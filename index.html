<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语一真题阅读资料库</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f7f4fb;
  --panel:#ffffff;
  --header-bg:#e8e0f5;
  --accent:#8b6fc4;
  --accent-deep:#6a4fa3;
  --accent-soft:#efe9f9;
  --accent-line:#d9cbf0;
  --line:#e0d6f0;
  --fav-border:#e8a8c8;
  --fav-bg:#fdf2f7;
  --fav-active:#d9739f;
  --text:#2e2640;
  --text-sub:#7a6f8f;
  --ok:#6bbf8a;
  --ok-bg:#eef8f1;
  --ok-line:#cdeada;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px;}

/* ===== 顶部 ===== */
.hero{
  background:linear-gradient(135deg,#f3edfa,#fceef5);
  border:1px solid #e8ddf3;border-radius:18px;
  padding:28px 28px 22px;margin-bottom:20px;
}
.hero h1{font-size:24px;color:var(--accent-deep);letter-spacing:1px;}
.hero p{color:var(--text-sub);font-size:13px;margin-top:6px;line-height:1.6;}
.searchRow{margin-top:16px;display:flex;gap:10px;}
#search{
  flex:1;border:1.5px solid var(--line);border-radius:10px;
  padding:7px 13px;font-size:14px;color:var(--text);
  background:#fff;outline:none;transition:border .15s,box-shadow .15s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,111,196,.15);}
#search::placeholder{color:#b7a9cf;}
.clearBtn{
  border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:0 16px;font-size:13px;color:var(--text-sub);cursor:pointer;display:none;
}
.clearBtn:hover{color:var(--accent-deep);border-color:var(--accent);}
.clearBtn.show{display:block;}
/* ===== 顶栏三按钮：各自底色 + 明显的 hover 反馈 ===== */
#bkImportBtn,#bkExportBtn,#clearBtn{transition:background .15s,box-shadow .15s,border-color .15s,color .15s}
#bkImportBtn{background:#eaf3fb;border-color:#cfe3f5;color:#3a6ea8;box-shadow:0 1px 4px rgba(58,110,168,.08)}
#bkImportBtn:hover{background:#dbe9f8;border-color:#aecdec;color:#2d5a8c;box-shadow:0 2px 8px rgba(58,110,168,.16)}
#bkExportBtn{background:#f0e9fa;border-color:#dccdf3;color:#6a4fa3;box-shadow:0 1px 4px rgba(106,79,163,.08)}
#bkExportBtn:hover{background:#e5d9f7;border-color:#c0a8ec;color:#58409a;box-shadow:0 2px 8px rgba(106,79,163,.16)}
#clearBtn{background:#fdf1f5;border-color:#f3d7e3;color:#b0577e;box-shadow:0 1px 4px rgba(176,87,126,.07)}
#clearBtn:hover{background:#fbdfe9;border-color:#efbccf;color:#8f3d62;box-shadow:0 2px 8px rgba(176,87,126,.14)}

/* ===== 最近学习 ===== */
.recent{margin-bottom:12px;}
.secTitle{font-size:14px;font-weight:700;color:var(--accent-deep);margin-bottom:10px;}
.recentRow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;}
.recentRow::-webkit-scrollbar{height:3px;}
.recentRow::-webkit-scrollbar-track{background:transparent;}
.recentRow::-webkit-scrollbar-thumb{background:rgba(246,193,215,.45);border-radius:2px;transition:background .2s;}
.recentRow:hover::-webkit-scrollbar-thumb{background:rgba(240,168,198,.75);}
.recentRow{scrollbar-width:thin;scrollbar-color:rgba(246,193,215,.45) transparent;}
.recentCard{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:7px 16px;cursor:pointer;transition:border .15s,background .15s;
}
.recentCard:hover{border-color:var(--accent);background:#fbf9fe;}
.recentCard .rcName{font-size:14.5px;font-weight:600;color:var(--text);white-space:nowrap;}
.recentCard .rcDate{font-size:12.5px;color:#a99dbc;white-space:nowrap;}

/* ===== 年份分组（默认全部展开） ===== */
.yearSec{margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.yearHead{
  display:flex;align-items:center;gap:10px;padding:14px 18px;
  background:#efe8f9;
  border-bottom:1px solid var(--accent-line);
}
.yearHead h2{font-size:17px;color:var(--text);}
.cnt{font-size:12px;color:var(--text-sub);}
.cnt b{color:var(--accent-deep);font-weight:700;}
.yearBody{padding:14px 14px 16px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}

/* 还没收录内容的年份：一行带过 */
.yearRow{
  display:flex;align-items:center;gap:10px;background:#fff;
  border:1px dashed var(--line);border-radius:12px;
  padding:10px 16px;color:#b0a6c4;font-size:13.5px;margin-bottom:8px;
}
.yearRow b{color:#8f84a8;font-size:14.5px;}
.yearRow .pill{font-size:11.5px;background:#f4f0fa;border-radius:999px;padding:2px 10px;color:#a99dbc;}

/* ===== 篇目卡片 ===== */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;position:relative;
  transition:box-shadow .15s,transform .15s;
}
.card.have{border-left:4px solid var(--accent);}
.card.have.faved{background:#fef9fb;border-color:#f2dbe7;border-left-color:#eebcd3;}
.card.missing{background:#fcfbfe;}
.cardTop{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-right:4px;}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.card.have .dot{background:var(--accent);}
.card.missing .dot{background:#d5cede;}
.card .name{font-size:15.5px;font-weight:700;flex:1;min-width:0;}
.donePill{
  border:1px solid var(--line);background:#fff;color:var(--text-sub);
  border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer;flex:0 0 auto;
  transition:background .13s,color .13s,border .13s;
}
.donePill:hover{border-color:var(--ok);color:var(--ok);}
.donePill.on{background:var(--ok-bg);border-color:var(--ok-line);color:#3e8a5f;font-weight:600;}
.starBtn{
  border:0;background:transparent;cursor:pointer;font-size:17px;line-height:1;
  padding:2px 3px;border-radius:8px;color:#d4c7e8;flex:0 0 auto;
  transition:transform .12s,color .12s;
}
.starBtn:hover{transform:scale(1.15);}
.starBtn.on{color:var(--fav-active);}
.btnRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn{
  border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-deep);
  border-radius:9px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600;
  text-decoration:none;display:inline-flex;align-items:center;gap:5px;
  transition:background .13s,border .13s,transform .13s;
}
.btn:hover{background:var(--accent-soft);}
/* 做题：紫偏粉 */
.btn.zuoti{background:#f0e9fa;border-color:#dccdf3;color:#6a4fa3;}
.btn.zuoti:hover{background:#e7dcf7;border-color:#8b6fc4;}
/* 复盘：近似但偏蓝一点的紫 */
.btn.fupan{background:#edeafb;border-color:#d4cdf4;color:#5a4fc0;}
.btn.fupan:hover{background:#e2ddf8;border-color:#7a6fd0;}
/* 笔记：更浅的蓝 + 实线框，只有✍️ */
.btn.noteBtn{
  background:#f0f9ff;border:1px solid #c8e4f8;color:#6fb1e8;
  font-size:15px;justify-content:center;
}
.btn.noteBtn:hover{background:#e3f2fd;border-color:#8fc6ee;}
.todo{
  border:1.5px dashed #d9d2e5;border-radius:9px;padding:7px 14px;font-size:13px;
  color:#b7a9cf;user-select:none;
  display:inline-flex;align-items:center;justify-content:center;
}

.empty{text-align:center;color:var(--text-sub);padding:40px 0;font-size:14px;display:none;}
.empty.show{display:block;}

footer{margin-top:30px;text-align:center;color:#b7a9cf;font-size:12px;line-height:1.8;}

@media(max-width:650px){
  .hero{padding:20px 16px;}
  .hero h1{font-size:20px;}
  .grid{grid-template-columns:1fr;}
  .yearHead h2{font-size:16px;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>英语一真题阅读资料库</h1>
    <p>2010 – 2026 · 每篇含做题模式 / 复盘模式 / 手写笔记 · 作者持续更新中</p>
    <div class="searchRow">
      <input id="search" type="search" placeholder="搜年份或篇目，比如 2014、text2…" autocomplete="off">
      <button class="clearBtn show" id="bkImportBtn" title="从备份JSON文件恢复（覆盖同名笔记）">导入</button>
      <button class="clearBtn show" id="bkExportBtn" title="所有批注和笔记打包成一个JSON文件下载">导出</button>
      <button class="clearBtn" id="clearBtn">清空</button>
      <a class="clearBtn show" href="guide.html" style="text-decoration:none;display:flex;align-items:center" title="英语备考攻略（点开查看）">📖 攻略</a>
    </div>
  </div>

  <div class="recent" id="recentSec" style="display:none">
    <div class="secTitle">🕐 最近学习</div>
    <div class="recentRow" id="recentRow"></div>
  </div>

  <div id="yearList"></div>

  <div class="empty" id="emptyTip">没有找到匹配的篇目，换个关键词试试？(｡•́︿•̀｡)</div>

  <footer>
    紫点 = 已收录 · 学完 = 标记完成 · ★ = 收藏<br>
    笔记保存在这台电脑的浏览器里，重要笔记记得用顶部「笔记备份」导出哦
  </footer>
</div>

<!-- 笔记备份弹窗 -->
<div id="toast" style="position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:300;background:#5a4382;color:#fff;font-size:13px;border-radius:999px;padding:8px 18px;opacity:0;transition:opacity .25s;pointer-events:none"></div>

<script src="assets/ekz-db.js?v=20261004n"></script>
<script src="assets/ekz-export.js?v=20261004n"></script>
<script src="assets/ekz-pdf.js?v=20261004n"></script>
<script src="manifest.js?v=20261004n"></script>
<script>
const LS_FAV='ekz.favs', LS_DONE='ekz.done', LS_RECENT='ekz.recent';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};

/* 【返回主页要不要置顶 · 2026-10-03 她定的规则】
 * 只一种情况置顶：从顶部「最近学习」点进去的。
 * 其余（从下面某年的篇目卡片点进去、直接敲网址、从攻略页回去）都恢复原滚动位置，
 * 因为那种情况下她本来就是停在某个年份上跳过去的，回原地才不丢上下文。
 * 标记由主页自己打：最近学习那排卡片点进去时写，
 * 年份卡片点进去时清掉（清掉很重要，否则标记会串到下一次）。
 * 浏览器「后退」回到主页走 bfcache，脚本不重跑，所以额外在 pageshow 里清一次。 */
const TOPKEY='ekz.homeTop';
const setTopMark=v=>{try{v?sessionStorage.setItem(TOPKEY,'1'):sessionStorage.removeItem(TOPKEY)}catch(e){}};
addEventListener('pageshow',e=>{ if(e.persisted) setTopMark(false); });

let favs=load(LS_FAV,[]), doneList=load(LS_DONE,[]), recent=load(LS_RECENT,[]);

/* 每年固定 Text 1-4 个槽位，manifest 里有的填入，没有的显示待补充 */
function slotsOf(year){
  const items=LIBRARY[year]||[];
  const byNum={};
  const extra=[];
  items.forEach(it=>{
    const m=/text\s*(\d+)/i.exec(it.label||'');
    if(m&&!byNum[m[1]])byNum[m[1]]=it;else extra.push(it);
  });
  const slots=[];
  for(let n=1;n<=4;n++)slots.push({num:n,item:byNum[String(n)]||null});
  extra.forEach(it=>slots.push({num:null,item:it}));
  return slots;
}

/* ---- 渲染 ---- */
const yearList=document.getElementById('yearList');
const years=Object.keys(LIBRARY).map(Number).sort((a,b)=>a-b); /* 旧到新 */

/* 拼 HTML 前的最小转义。课程卡片的 label 目前来自本地数据包、进不来，
   但多一层总比少一层好 —— 以后万一有外部来源，这里就是唯一的护栏。 */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cardHTML(year,slot){
  if(!slot.item){
    return `<div class="card missing">
      <div class="cardTop"><span class="dot"></span><span class="name">Text ${slot.num}</span></div>
      <div class="btnRow"><span class="todo">暂未更新</span><span class="todo">暂未更新</span></div>
    </div>`;
  }
  const it=slot.item;
  const faved=favs.includes(it.id), done=doneList.includes(it.id);
  const label=slot.num?`Text ${slot.num}`:it.label;
  return `<div class="card have${faved?' faved':''}" data-id="${esc(it.id)}" data-year="${esc(year)}" data-label="${esc(label)}">
    <div class="cardTop">
      <span class="dot"></span><span class="name">${esc(label)}</span>
      <button class="donePill${done?' on':''}" title="标记学完">${done?'✓ 学完':'学完'}</button>
      <button class="starBtn${faved?' on':''}" title="收藏">★</button>
    </div>
    <div class="btnRow">
      ${it.zuoti?`<a class="btn zuoti" href="${esc(it.zuoti)}" data-mode="做题模式">做题模式</a>`:'<span class="todo">暂未更新</span>'}
      ${it.fupan?`<a class="btn fupan" href="${esc(it.fupan)}" data-mode="复盘模式">复盘模式</a>`:'<span class="todo">暂未更新</span>'}
      <a class="btn noteBtn" href="${esc(it.note||('notes.html?id='+encodeURIComponent(it.id)))}" data-mode="手写笔记" title="手写笔记">✍️</a>
    </div>
  </div>`;
}

function render(filter=''){
  const q=filter.trim().toLowerCase();
  let html='', hasResult=false;
  for(const y of years){
    const slots=slotsOf(y);
    const have=slots.filter(s=>s.item);
    const matched=q?slots.filter(s=>s.item&&(String(y).includes(q)||(s.item.label||'').toLowerCase().includes(q)||s.item.id.toLowerCase().includes(q))):slots;
    if(q&&!matched.length)continue;
    hasResult=hasResult||matched.some(s=>s.item);
    if(!have.length){ /* 空年份：一行带过 */
      html+=`<div class="yearRow"><b>${y} 年</b><span class="pill">Text 1 – 4 暂未更新</span></div>`;
      continue;
    }
    html+=`<div class="yearSec" data-year="${y}">
      <div class="yearHead"><h2>${y} 年</h2><span class="cnt"><b>${have.length}</b> / 4 篇已收录</span></div>
      <div class="yearBody"><div class="grid">${matched.map(s=>cardHTML(y,s)).join('')}</div></div>
    </div>`;
  }
  yearList.innerHTML=html;
  document.getElementById('emptyTip').classList.toggle('show',q&&!hasResult);
  document.getElementById('recentSec').style.display=(q||!recent.length)?'none':'';
  bindCards();
}

/* ---- 卡片交互 ---- */
/* 最近学习去重。
   原来只按 id 过滤，但兜底分支写进去的 id 是 'href:'+href —— 两套键空间，
   同一篇就会同时存在「正常 id 那条」和「href: 那条」，卡片上出现两张。
   现在统一：能拿到 id 就按 id 去重；只有连 id 都没有的脏数据才退回按 href 去重。 */
function sameEntry(r,id,href){
  if(id)return r.id===id;
  return !!href&&r.href===href;
}
function pushRecent(id,year,label,href){
  recent=recent.filter(r=>!sameEntry(r,id,href));
  /* id 缺失的老数据顺手补上，别再写 'href:' 前缀那种半个 id */
  const rid=id||(href?String(href):'');
  if(!rid)return;
  recent.unshift({id:rid,year:String(year||''),label:String(label||''),href:String(href||''),ts:Date.now()});
  recent=recent.slice(0,8);
  save(LS_RECENT,recent);
}
function bindCards(){
  document.querySelectorAll('.card.have').forEach(card=>{
    const id=card.dataset.id, year=card.dataset.year, label=card.dataset.label;
    card.querySelectorAll('.btnRow .btn').forEach(a=>{
      a.addEventListener('click',()=>{ setTopMark(false); pushRecent(id,year,label,a.getAttribute('href')); });
    });
    card.querySelector('.starBtn').addEventListener('click',e=>{
      e.preventDefault();
      favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];
      save(LS_FAV,favs);
      e.currentTarget.classList.toggle('on');
      card.classList.toggle('faved');
    });
    const pill=card.querySelector('.donePill');
    pill.addEventListener('click',e=>{
      e.preventDefault();
      doneList=doneList.includes(id)?doneList.filter(x=>x!==id):[...doneList,id];
      save(LS_DONE,doneList);
      const on=doneList.includes(id);
      pill.classList.toggle('on',on);
      pill.textContent=on?'✓ 学完':'学完';
    });
  });
}

/* ---- 最近学习 ---- */
/* 最近学习卡片：原来是把 label/href 直接拼进 innerHTML，
   而这三个字段都能从导入的 JSON 进来（2026-10-03 实测 label 里的
   <img onerror> 真的被执行了）。改成用 createElement + textContent 建节点，
   文本自动转义，注入链断掉。
   data-* 走 setAttribute 本身是安全的，但 href 要额外挡一下 javascript:。 */
function buildRecentCard(r){
  const c=document.createElement('div');
  c.className='recentCard';
  const href=String(r.href||'');
  if(/^\s*javascript:/i.test(href)){c.classList.add('badHref');c.dataset.href='';}
  else c.dataset.href=href;
  c.dataset.id=r.id||'';
  c.dataset.year=r.year||'';
  c.dataset.label=r.label||'';
  const d=new Date(r.ts);
  const name=document.createElement('span');
  name.className='rcName';
  name.textContent=(r.year||'')+' 年 '+(r.label||'');
  const date=document.createElement('span');
  date.className='rcDate';
  date.textContent=isNaN(d.getTime())?'':(d.getMonth()+1)+'月'+d.getDate()+'日';
  c.appendChild(name);
  c.appendChild(date);
  return c;
}
function renderRecent(){
  const sec=document.getElementById('recentSec'), row=document.getElementById('recentRow');
  if(!recent.length){sec.style.display='none';return;}
  sec.style.display='';
  row.textContent='';
  recent.slice(0,8).forEach(r=>row.appendChild(buildRecentCard(r)));
  row.querySelectorAll('.recentCard').forEach(c=>{
    c.addEventListener('click',()=>{
      // 跳转前先置顶：她 2026-10-03 反馈"从最近学习点进去不会更新位置"。
      // 不改的话，这条记录的时间戳一直是旧的，下次回主页仍停在原位。
      if(!c.dataset.href)return;
      /* 统一走 pushRecent：有 id 按 id 去重，没 id 才按 href。
         原来这里自己写了一套，还写出 'href:' 前缀的半个 id，
         和 pushRecent 的键空间对不上，同一篇会出现两张卡片。 */
      pushRecent(c.dataset.id,c.dataset.year,c.dataset.label,c.dataset.href);
      setTopMark(true);   // 从最近学习进去的 → 回主页强制置顶
      location.href=c.dataset.href;
    });
  });
}

/* ---- 搜索 ---- */
const search=document.getElementById('search'), clearBtn=document.getElementById('clearBtn');
let searchTimer=null;
search.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{ clearBtn.classList.toggle('show',!!search.value); render(search.value); },120);
});
clearBtn.addEventListener('click',()=>{search.value='';clearBtn.classList.remove('show');render();});

/* 搜索态只有一个真相来源：搜索框。
   原来 render() 只管画列表，搜索框和 clear 按钮的显示状态是各写各的，
   于是导入/清空后列表已经是全量了、搜索框却还留着旧关键词，
   看着像"没生效"。统一走这个函数收口。 */
function syncSearchUI(){
  const has=!!search.value;
  clearBtn.classList.toggle('show',has);
  render(search.value);
}

renderRecent();
render();

/* ---- 主页位置记忆（她 2026-10-03 要求：刷新后停在原处） ----
 * 记两样：滚动位置 + 当时视口里最靠上的年份。
 * 只用 sessionStorage —— 刷新保留、关掉标签页自动清空，
 * 不会像 localStorage 那样隔天回来还停在老地方。
 * 搜索状态下不恢复（搜索结果的布局和全量列表不同，位置没意义）。
 *
 * 【坑】早先只按「年份」scrollIntoView 恢复，但 scrollIntoView 会把
 * 年份块顶到视口上沿，丢掉块内的具体偏移；而且卡片多时布局还没稳定，
 * 恢复出来的位置偏上，她反馈"跟手不对"。
 * 现在改成：优先用 scrollY 精确恢复，年份只作为 scrollY 拿不到时的兜底。
 * 另外把页面高度算出来，避免内容还没撑开就 scrollTo 导致落空。 */
const SCROLL_KEY='ekz.pos.indexScroll', YKEY='ekz.pos.indexYear';
(function(){
  const searchEl=document.getElementById('search');
  const searching=()=>!!(searchEl && searchEl.value.trim());
  /* restore() 执行期间为 true：期间 save() 不写，
     否则加载时序里那些临时 scrollY 会把真位置冲掉。 */
  let restoring=false;
  /* 置顶时 suppress 计数：置顶是"主动把位置清掉"，不该再被 save() 记回来。
     原来只删了 SCROLL_KEY，可 scrollTo(0,0) 触发的 scroll 事件
     经过 200ms 防抖后才跑 save()，那时 restoring 已经解除了，
     于是 scrollY=0 被写回 SCROLL_KEY —— 位置记忆被置顶污染，
     之后再刷新就再也回不到原来的地方。
     现在置顶起效期间一直挡着 save()，多挡几次防抖窗口。
     声明必须放在 restore()/tookTopMark() 之前，否则调用时会踩 TDZ。 */
  let suppressSave=0;

  /* 【2026-10-03 修她报的"顶部刷新被甩到 2010"】
     浏览器自带的 history 滚动恢复会跟我们的 restore() 抢方向盘：
     页面 DOM 还没建好时它先滚到上次位置，等我们 restore() 再纠正，
     中间触发的 scroll 事件又被 save() 记下来 —— 每刷一次漂一点。
     关掉自动恢复，位置完全由 sessionStorage 说了算。 */
  try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}

  /* 【2026-10-03 她定的规则】只有从「最近学习」点进去的子页，
   * 点【主页】回来才强制回顶部（TOPKEY 由主页在点最近学习时写）。
   * 从年份卡片进去的、敲网址进来的，标记都没有 → 照旧恢复滚动位置。
   * 标记用完立刻删，免得影响之后在主页的刷新。 */
  function tookTopMark(){
    try{
      if(sessionStorage.getItem(TOPKEY)){
        sessionStorage.removeItem(TOPKEY);
        /* 连清两次：第一次删掉旧值，第二次挡掉紧接着 scrollTo 触发的回写。
           suppressSave 还得再撑一会儿，覆盖那个 200ms 防抖窗口。 */
        try{sessionStorage.removeItem(SCROLL_KEY);}catch(e){}
        suppressSave=6;
        setTimeout(()=>{
          try{sessionStorage.removeItem(SCROLL_KEY);}catch(e){}
        },700);
        return true;
      }
    }catch(e){}
    return false;
  }

  function restore(){
    if(searching()) return;                 // 搜索态不恢复
    if(tookTopMark()){ scrollTo(0,0); return; }

    /* 【2026-10-03 修】原来读的是 sy>0 才算有效，这是个 bug：
     * 她人在主页顶部（scrollY=0）时按 Ctrl+Shift+R，YKEY 里还留着
     * 上次浏览到 2010 年写的值 2010，sy=0 走不进精确分支，
     * 就掉进年份兜底把她甩到 2010 年去了。
     * 正确做法：只要 sessionStorage 里**存过** scrollY 就用它，
     * 0 也是有效值（顶部本来就该是 0）。只有从来没存过才允许年份兜底。 */
    let sy=null, y=0;
    try{
      const raw=sessionStorage.getItem(SCROLL_KEY);
      if(raw!==null&&raw!=='') sy=+raw;
      y=+(sessionStorage.getItem(YKEY)||0);
    }catch(e){ return; }
    if(sy===null&&y<=0) return;             // 两者都没有 → 老老实实停在顶部

    const apply=()=>{
      if(searching()) return;
      const maxY=Math.max(0,document.documentElement.scrollHeight-innerHeight);
      if(sy!==null){
        scrollTo(0,Math.max(0,Math.min(sy,maxY)));
        return;                              // 有精确值就用它，绝不再兜底
      }
      // 兜底：只有压根没存过 scrollY 时才按年份定位
      if(y>0){
        for(const sec of yearList.querySelectorAll('.yearSec')){
          if(+sec.dataset.year===y){ sec.scrollIntoView({block:'start'}); return; }
        }
      }
    };

    // 恢复动作做完前，save() 一律不写 —— 否则加载中途的
    // scroll 事件会把"还没定位完的临时 scrollY"存进去，越刷越偏
    restoring=true;

    // 连续等几帧，直到文档高度稳定（年份块可能带懒加载样式）
    let tries=0;
    (function wait(){
      if(tries++>30 || searching()){ restoring=false; return; }
      const h1=document.documentElement.scrollHeight;
      requestAnimationFrame(()=>{
        if(document.documentElement.scrollHeight===h1){
          apply();
          /* 再多等一帧才解除锁：apply 里 scrollTo 会触发 scroll 事件，
             那时候 restoring 还是 true，这一下噪声就被挡掉了。 */
          requestAnimationFrame(()=>{ restoring=false; });
          return;
        }
        wait();
      });
    })();
  }

  /* 置顶时 suppress 计数：声明在上面 restoring 旁边，
     置顶期间 save() 一律不写回（详见那里的说明）。 */

  // 离开前 / 页面隐藏时都记一次，覆盖各种退出路径
  function save(){
    if(restoring) return;                   // 恢复过程中不写回
    if(suppressSave>0) return;              // 置顶过程中不写回
    try{
      sessionStorage.setItem(SCROLL_KEY,String(scrollY));
      let best=null;
      for(const sec of yearList.querySelectorAll('.yearSec')){
        if(sec.getBoundingClientRect().top<=120){ best=sec.dataset.year; }
      }
      if(best) sessionStorage.setItem(YKEY,best);
    }catch(e){}
  }
  // 主页不引 ekz-nav.js（它是列表页，没有互跳按钮），所以没有 registerSaver 可用。
  // 但 scroll/pagehide/visibilitychange 三个监听已经覆盖了所有退出路径。
  let t=null;
  addEventListener('scroll',()=>{
    if(t)return;
    t=setTimeout(()=>{ t=null; save(); },200);
  },{passive:true});
  addEventListener('pagehide',save);
  addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
  /* 抑制计数靠定时递减，不依赖任何事件 —— 事件不来它也得自己到期 */
  setInterval(()=>{ if(suppressSave>0) suppressSave--; },150);

  // 从笔记/做题页点"主页"回来时，若带 ?id= 则滚到那篇
  try{
    const back=sessionStorage.getItem('ekz.backToId');
    if(back && new URLSearchParams(location.search).get('id')){
      const t2=new URLSearchParams(location.search).get('id');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        const card=yearList.querySelector(`.card[data-id="${t2}"]`);
        if(card) card.scrollIntoView({block:'center'});
      }));
      sessionStorage.removeItem('ekz.backToId');
      return;                                   // 指定篇目优先于恢复滚动位置
    }
  }catch(e){}

/* 老版本留下的脏数据：id 写成 'href:'+href 的那批。
   它们和正常 id 那条并存会让同一篇显示两张卡片，这里按 href 合并一次。 */
function dedupeRecent(){
  try{
    if(!Array.isArray(recent)||!recent.length)return;
    const seen=new Set(), out=[];
    for(const r of recent){
      if(!r||!r.href)continue;
      const key=(r.id&&r.id.indexOf('href:')!==0)?r.id:String(r.href);
      if(seen.has(key))continue;
      seen.add(key);
      /* 把 'href:xxx' 换成干净 id，以后 pushRecent 就能正常按 id 去重 */
      out.push({...r,id:key,year:String(r.year||''),label:String(r.label||''),href:String(r.href)});
    }
    if(out.length!==recent.length||recent.some((r,i)=>r.id!==out[i].id)){
      recent=out.slice(0,8);
      save(LS_RECENT,recent);
    }
  }catch(e){}
}
dedupeRecent();

restore();
})();

/* ---- 笔记备份：导出全部 / 导入 ---- */
let _fbDB=null;
function openNotesDB(){
  if(window.ekzDB)return window.ekzDB.open();
  if(_fbDB)return Promise.resolve(_fbDB);
  return new Promise((res,rej)=>{
    const r=indexedDB.open('ekz-notes-v2',2);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('notes'))db.createObjectStore('notes',{keyPath:'id'});};
    r.onsuccess=()=>{_fbDB=r.result;res(_fbDB);};
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error('数据库被其他标签页占用'));
  });
}
function getAllNotes(){
  if(window.ekzDB&&window.ekzDB.all)return window.ekzDB.all();
  return openNotesDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('notes','readonly');
    const rq=tx.objectStore('notes').getAll();
    rq.onsuccess=()=>res(rq.result||[]);
    rq.onerror=()=>rej(rq.error);
    tx.onabort=()=>rej(tx.error||new Error('事务被中止'));
  }));
}
/* 关掉本标签页持有的数据库连接。deleteDatabase 之前必须做，
   否则走onblocked、库删不掉。 */
function closeNotesDB(){
  if(window.ekzDB&&window.ekzDB.close)return window.ekzDB.close();
  if(_fbDB){try{_fbDB.close();}catch(e){}_fbDB=null;}
  return Promise.resolve();
}
/* 【清空所有数据】
 * 要抹的痕迹分四类：
 *   1) IndexedDB 主库 ekz-notes-v2（手写笔记 + 做题批注都在这）
 *   2) IndexedDB 旧库 ekz-notes-db（留着会挡住 migrate，导致清空后笔记复活）
 *   3) localStorage：收藏 / 学完 / 最近学习 / 手写工具偏好 / 分栏比例 / 缩放
 *   4) sessionStorage：位置记忆
 * 外加 Cache Storage。
 *
 * 关键：deleteDatabase 会被同标签页任何还开着的连接卡成 onblocked。
 * 之前的写法是「关掉 count 那个连接」，但紧接着 getAllNotes() 又新开一个且从不关，
 * 结果 onblocked 被当成成功、笔记其实没删。所以现在所有读操作都排在
 * 计数之后统一关连接，blocked 一律算失败并在 toast 里如实说。 */
/* 键名必须与代码里实际用的完全一致。改这里之前先 grep 一遍 setItem。 */
const CLEAR_LS_EXACT=['ekz.favs','ekz.done','ekz.recent','ekz-migrated',
  'ekz-split-ratio','ekz-rv-split-ratio',
  'drawn.prefs.v1','drawn.paletteOrder.v1','drawn.customColors.v2'];
/* 【2026-10-04 补】ekz-ink-bk- / ekz-ink-bkts- 是 mark-engine 落笔时同步写的
   localStorage 备份和它的写入时刻（为了平板刷新不丢笔迹）。
   原来前缀表里只有 ekz-zoom-，这两份**一个都没清**。
   后果实测（scripts/cdp-import-ghost-diag.js）：
     清空数据只删了 IndexedDB，同步备份原封不动留着；
     紧接着导入"只有爱心"的旧备份 → IDB 里正确写成 2 笔，
     但 mark-engine 的 loadSlot 看到"备份 5 笔 > 主库 2 笔"就判定备份更新，
     拿旧备份把导入结果整个盖掉 → 荧光笔全复活。
   这条链只在"导入的笔迹比旧备份少"时才犯，所以平时撞不上，一清空就必现。
   注意两个前缀要都列：ekz-ink-bk- 带结尾横线，而 ekz-ink-bkts- 的 bk 后面是 t，
   只写 ekz-ink-bk- 匹配不到时间戳那一半。 */
const CLEAR_LS_PREFIX=['ekz-zoom-','ekz-ink-bk-','ekz-ink-bkts-'];
function wipeAllData(){
  const stat={notes:0,marks:0,ls:0,ss:0,db:0,cache:0,dbFailed:[]};
  return getAllNotes().catch(()=>[])
    .then(notes=>{
      for(const r of notes){
        if(r.marks){for(const k in r.marks)stat.marks+=(r.marks[k]||[]).length;}
      }
      stat.notes=notes.length;
      /* 计数用的连接必须先关掉，否则后面 deleteDatabase 一定被挡 */
      return closeNotesDB();
    })
    .then(()=>{
      const del=name=>{
        if(window.ekzDB&&window.ekzDB.destroy)return window.ekzDB.destroy(name);
        return new Promise(res=>{
          let r;
          try{r=indexedDB.deleteDatabase(name);}catch(e){stat.dbFailed.push(name);res();return;}
          r.onsuccess=()=>{stat.db++;res();};
          r.onerror=r.onblocked=()=>{stat.dbFailed.push(name);res();};
        });
      };
      return del('ekz-notes-v2').then(()=>del('ekz-notes-db'));
    })
    .then(()=>{
      try{
        CLEAR_LS_EXACT.forEach(k=>{if(localStorage.getItem(k)!==null){localStorage.removeItem(k);stat.ls++;}});
        Object.keys(localStorage).forEach(k=>{          /* 前缀类的（含 ekz-zoom-xxx） */
          if(CLEAR_LS_PREFIX.some(p=>k.indexOf(p)===0)){localStorage.removeItem(k);stat.ls++;}
        });
      }catch(e){}
      try{
        Object.keys(sessionStorage).forEach(k=>{
          if(k.indexOf('ekz')===0){sessionStorage.removeItem(k);stat.ss++;}
        });
      }catch(e){}
    })
    .then(()=>{                                        /* Cache Storage：清空但不阻塞流程 */
      try{
        if(window.caches&&window.caches.keys){
          return Promise.all([caches.keys().then(ks=>Promise.all(
            ks.map(k=>caches.delete(k).then(()=>{stat.cache++;}))
          ))]).catch(()=>{});
        }
      }catch(e){}
    })
    .then(()=>stat);
}
/* 二次确认：先把"会删掉什么、有多少"摆给她看，确认了才真删
 * （2026-10-03 她选 B 款：表格式清单，左名右数一行搞定，不换行） */
function fmtSize(bytes){
  if(!bytes)return '0 KB';
  if(bytes<1024)return bytes+' B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1048576).toFixed(2)+' MB';
}
/* 把一条记录归到三类：做题页批注 / 复盘页批注 / 真题页手写笔记。
   判据是记录 id 和槽位名：
     <paper>-mark        做题页（slot: article / question）
     <paper>-rv-mark     复盘页（slot: rv-left-annotated / rv-right-step-N）
     其它带 strokes/pages 的  笔记页自由笔记（真题页底图）
   之前统计只有"有 marks 就算批注"一条粗判据，
   复盘页批注被并进"做题页批注"里，她 2026-10-03 要求分开列才改成现在这样。 */
function classifyRec(r){
  if(r&&r.marks&&typeof r.marks==='object'){
    const isRv=/-rv-mark$/.test(r.id||'')||Object.keys(r.marks).some(k=>k.indexOf('rv-')===0);
    return isRv?'rv':'do';
  }
  return 'note';
}
/* 笔数口径（已实测，见 scripts/test-count.js）：
     写字 3 笔 → 撤销 1 次 → 剩 2 条（撤销是减一条，不会变两笔）
     橡皮擦一下 → 记录条数 +1（橡皮本身也是一条，存着才能重画/撤销）
   两个方向都跟「我写了多少字」对不上，所以界面上只报篇数，不报笔数。 */
function tallyRecs(recs){
  const t={do:{n:0},rv:{n:0},note:{n:0},bytes:0};
  recs.forEach(r=>{
    t[classifyRec(r)].n++;
    /* 体积：JSON 序列化后的字节数。笔记都是坐标数组，
       序列化长度跟实际占用一个量级，够她判断"值不值得备份" */
    try{t.bytes+=new Blob([JSON.stringify(r)]).size;}catch(e){}
  });
  return t;
}
/* 只报「多少篇」，不报笔数。
   她 2026-10-03 定的：笔数这个数字会让人误解（以为写完再撤销会算两笔），
   其实撤销是减一条、橡皮是另加一条，口径怎么算都容易被当成「写了多少字」，
   那干脆不给这个数字，看篇数就够了。 */
function inkText(o){
  return o.n?(o.n+' 篇'):'无';
}

    /* 实时读 localStorage，不要用页面加载时的内存快照 favs/doneList/recent ——

function putNotes(recs){
  if(window.ekzDB&&window.ekzDB.putMany)return window.ekzDB.putMany(recs).then(r=>r.ok);
  return openNotesDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('notes','readwrite');

    recs.forEach(r=>st.put(r));
    tx.oncomplete=()=>res(true);
    tx.onerror=()=>rej(tx.error);
    tx.onabort=()=>rej(tx.error||new Error('事务被中止'));
  }));
}
function toastMsg(t){

/* ---- 笔记备份：导出（弹窗：JSON 备份 / PDF 做题页带批注） ---- */
function exportJsonAll(){

    const real={};

    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    const d=new Date(),pad=n=>String(n).padStart(2,'0');
    a.download='英语真题手写笔记备份_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    const mN=real.favs.length+real.done.length+real.recent.length;
    toastMsg('已导出 '+notes.length+' 条笔记记录'+(mN?' + '+mN+' 条主页标记':''));
  }).catch(err=>{console.error(err);toastMsg('导出失败');});
}
/* 把一张底稿图 + 该页笔迹合成 canvas（图片走 dataURL，file:// 下不会被污染） */
function renderPageCanvas(imgSrc,strokes){
  return new Promise(res=>{
    const finish=img=>{
      const W=img?img.naturalWidth:1240,H=img?img.naturalHeight:Math.round(1240*1.414);
      const cv=document.createElement('canvas');cv.width=W;cv.height=H;
      const c=cv.getContext('2d');
      c.fillStyle='#fff';c.fillRect(0,0,W,H);
      if(img)c.drawImage(img,0,0,W,H);
      const st=strokes||[];
      /* 笔迹粗细补偿：做题页屏幕上画布约 630 CSS px 宽，导出画布是图片原始
         分辨率（更宽），size 不放大会细成发丝——按宽度比例补偿 */
      const k=W/630;
      const draw=s=>{
        const P0=s.pts;if(!P0||!P0.length)return;
        const P=P0.map(q=>({x:q.x*W,y:q.y*H,p:(q.p===undefined?.5:q.p)}));
        c.save();c.lineCap='round';c.lineJoin='round';
        if(s.tool==='er'){c.globalCompositeOperation='destination-out';c.strokeStyle=c.fillStyle='#000';c.globalAlpha=1;}
        else if(s.tool==='hl'){c.globalCompositeOperation='source-over';c.strokeStyle=c.fillStyle=s.color;c.globalAlpha=.32;}
        else{c.globalCompositeOperation='source-over';c.strokeStyle=c.fillStyle=s.color;c.globalAlpha=1;}
        if(P.length===1){c.beginPath();c.arc(P[0].x,P[0].y,s.size*k/2,0,7);c.fill();c.restore();return;}
        if(s.tool==='pen'){
          let px=P[0].x,py=P[0].y,pp=P[0].p;
          for(let i=1;i<P.length-1;i++){
            const a=P[i],b=P[i+1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,mp=(a.p+b.p)/2;
            c.lineWidth=s.size*k*(.65+.7*((pp+mp)/2));
            c.beginPath();c.moveTo(px,py);c.quadraticCurveTo(a.x,a.y,mx,my);c.stroke();
            px=mx;py=my;pp=mp;
          }
          const last=P[P.length-1];
          c.lineWidth=s.size*k*(.65+.7*((pp+last.p)/2));
          c.beginPath();c.moveTo(px,py);c.lineTo(last.x,last.y);c.stroke();
        }else{
          c.lineWidth=s.size*k;c.beginPath();c.moveTo(P[0].x,P[0].y);
          for(let i=1;i<P.length-1;i++){c.quadraticCurveTo(P[i].x,P[i].y,(P[i].x+P[i+1].x)/2,(P[i].y+P[i+1].y)/2);}
          c.lineTo(P[P.length-1].x,P[P.length-1].y);c.stroke();
        }
        c.restore();
      };
      for(const s of st)if(s.tool==='hl')draw(s);
      for(const s of st)if(s.tool==='pen')draw(s);
      for(const s of st)if(s.tool==='er')draw(s);
      res(cv);
    };
    if(!imgSrc){finish(null);return;}
    const im=new Image();
    im.onload=()=>finish(im);
    im.onerror=()=>finish(null);
    im.src=imgSrc;
  });
}
function loadImgData(paperId){
  if(window.EKZ_IMGDATA&&EKZ_IMGDATA[paperId])return Promise.resolve(EKZ_IMGDATA[paperId]);
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='assets/pdfimg/'+paperId+'.js';
    s.onload=()=>res(window.EKZ_IMGDATA&&EKZ_IMGDATA[paperId]);
    s.onerror=()=>rej(new Error('图片数据包缺失'));
    document.head.appendChild(s);
  });
}
async function exportPdfPapers(yearVal,paperVal){
  try{
    let papers=[];
    if(yearVal==='all'){Object.keys(LIBRARY).forEach(y=>papers=papers.concat(LIBRARY[y]||[]));}
    else{
      papers=(LIBRARY[yearVal]||[]).slice();
      if(paperVal!=='all')papers=papers.filter(it=>it.id===paperVal);
    }
    if(!papers.length){toastMsg('这个范围还没有篇目哦');return;}
    toastMsg('正在合成 PDF…');
    const notes=await getAllNotes();
    let markCount=0;for(const it2 of papers){const r2=notes.find(r=>r.id===it2.id+'-mark');if(r2&&r2.marks)for(const k in r2.marks)markCount+=(r2.marks[k]||[]).length;}
    const canvases=[];
    for(const it of papers){
      let imgs=null;
      try{imgs=await loadImgData(it.id);}catch(_){}
      const rec=notes.find(r=>r.id===it.id+'-mark');
      const slots=['article','question'];
      for(let i=0;i<2;i++){
        const src=(imgs&&imgs[i])||(it.underlay&&it.underlay[i])||'';
        /* 有图片数据就用图；没有图就用纯白 A4 + 笔迹兜底 */
        const cv=await renderPageCanvas(src.indexOf('data:')===0?src:'',rec&&rec.marks&&rec.marks[slots[i]]);
        canvases.push(cv);
      }
    }
    if(!canvases.length){toastMsg('没有可导出的内容');return;}
    const blob=await EkzPdf.build(canvases);
    const d=new Date(),pad=n=>String(n).padStart(2,'0');
    EkzPdf.download(blob,'英语真题做题页_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.pdf');
    toastMsg('已导出 PDF，共 '+canvases.length+' 页'+(markCount?('，含 '+markCount+' 条批注'):'（注意：没有找到任何批注哦）'));
  }catch(err){console.error(err);toastMsg('PDF 导出失败');}
}

    ]

const bkFile=document.createElement('input');
bkFile.type='file';bkFile.accept='.json,application/json';bkFile.style.display='none';
bkFile.id='bkFile';
document.body.appendChild(bkFile);
document.getElementById('bkImportBtn').addEventListener('click',()=>bkFile.click());
bkFile.addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    /* ---- 先解析、先说明，确认了才真的写进去（她 2026-10-03 要求） ---- */
    let recs=[],mk=null;
    try{
      const data=JSON.parse(reader.result);
      if(data.app==='ekz-notes-backup'&&Array.isArray(data.notes)){
        recs=data.notes.filter(r=>r&&r.id&&(Array.isArray(r.pages)||(r.marks&&typeof r.marks==='object')||Array.isArray(r.strokes)));
        /* v2 起备份里带 marks（收藏/学完/最近学习）。v1 老备份没有这一段，
           这里就是空的，弹窗会告诉她"这份备份不含主页标记"。 */
        if(data.marks&&typeof data.marks==='object')mk=data.marks;
      }else if(data.app==='ekz-notes'&&data.id&&Array.isArray(data.pages)){
        recs=[data]; /* 兼容旧版单本备份 */
      }
      if(!recs.length&&!mk)throw new Error('格式不对');
    }catch(err){toastMsg('文件不对，要用本库导出的JSON');return;}

    /* 统计这份文件里到底有什么，摆给她看 */
    const t=tallyRecs(recs);
    /* 哪些篇目已经有了 → 这些会被覆盖 */
    const existing=await getAllNotes().catch(()=>[]);
    const oldIds=new Set(existing.map(r=>r.id));
    const willCover=recs.filter(r=>oldIds.has(r.id)).length;

    /* 主页标记：备份里有的才算数，老备份（v1）这一项显示"无" */
    const mkArr=k=>{
      if(!mk)return [];
      if(Array.isArray(mk[k]))return mk[k];
      try{const v=JSON.parse(mk[k+'Raw']);return Array.isArray(v)?v:[];}catch(e){return []}
    };
    const fv=mkArr('favs'),dv=mkArr('done'),rv=mkArr('recent');
    const mkN=fv.length+dv.length+rv.length;
    /* 三项全空的备份不代表"用户想清空标记"，只代表这台机器当初没标记。
       这种情况下绝不能拿空数组去覆盖本机，否则换机导入会把收藏/学完全抹掉。
       hasMarks=有没有真内容，导入时只按它决定写不写。 */
    const hasMarks=mkN>0;
    /* 本机已有的标记数 —— 导入是整段覆盖，会把本机这些挤掉。 */
    const lsLen=k=>{try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v.length:0}catch(e){return 0}};
    const oldFavN=lsLen(LS_FAV), oldDoneN=lsLen(LS_DONE), oldRecN=lsLen(LS_RECENT);
    const oldMkN=oldFavN+oldDoneN+oldRecN;

    const rows=[
      {k:'做题页批注',v:inkText(t.do)},
      {k:'复盘页批注',v:inkText(t.rv)},
      {k:'真题页批注',v:inkText(t.note)},
      {k:'收藏 / 学完 / 最近学习',v:mk?(hasMarks?(fv.length+' / '+dv.length+' / '+rv.length):'无（本机保持原样）'):'无'},
      {k:'会覆盖本机',v:(
        (willCover?('笔记 '+willCover+' 篇'):'')+
        ((willCover&&hasMarks&&oldMkN)?' · ':'')+
        (hasMarks&&oldMkN?('主页标记 '+oldMkN+' 条'):'')
      )||'不会覆盖'},
      {k:'总共',v:fmtSize(f.size),tot:true}
    ];
    const ok=await EkzExport.confirm({
      theme:'blue',
      title:'这份备份里有这些内容',
      sub:hasMarks?'做题/复盘/真题的批注和主页标记都会一起导入，收藏、学完、最近学习都照文件里的覆盖本机'
          :(mk?'这份备份里没有任何主页标记，导入后收藏/学完/最近学习保持本机原样'
            :'这份是旧版备份，只有做题/复盘/真题的批注，没有收藏和学完标记'),
      rows:rows,
      hint:!mk?'旧备份不含主页标记，导入后收藏/学完/最近学习保持本机原样。'
          :!hasMarks?'备份里的标记是空的（多半是导出时那台机器还没用过收藏/学完），本机的不会被清掉。'
          :(oldMkN?('注意：本机现有 '+oldMkN+' 条主页标记，会被文件里的覆盖。')
                 :'本机没有主页标记，导入后直接用文件里的。'),
      okText:'确认导入'
    });
    if(!ok)return;
    try{
      if(recs.length){
        await putNotes(recs);
        /* 【2026-10-04 关键】导入成功后，必须把这次导入覆盖掉的篇目
           在 mark-engine 里的 localStorage 同步备份一起作废。
           不作废的话她反馈的"导入不覆盖、荧光笔复活"照样犯，原因是时间戳：
             putNotes 是整条 put 覆盖写，备份里的 ts 是**导出那一刻**的时间，
             属于过去；而本机同步备份的写入时刻是**本机最后一次落笔**，
             一定更晚。loadSlot 比"备份较新"就会拿这份旧备份反扑，
             把刚导入的数据整个盖掉 —— 即使笔数比对了也照样错
             （时间戳比笔数更权威）。
           所以：清空数据删备份只解决了"清完再导"，正常覆盖导入时的这条
           漏网路径在这儿补掉。逐条按记录 id 清，别的篇目备份不动。 */
        let clearedBk=0;
        try{
          recs.forEach(r=>{
            if(!r||!r.id)return;
            Object.keys(localStorage).forEach(k=>{
              if(k.indexOf('ekz-ink-bk-'+r.id+'-')===0||k.indexOf('ekz-ink-bkts-'+r.id+'-')===0){
                localStorage.removeItem(k);clearedBk++;
              }
            });
          });
        }catch(e){}
        if(clearedBk&&window.__ekzDebug)window.__ekzDebug.log('导入作废旧同步备份 '+clearedBk+' 项');
      }
      /* 主页标记整段覆盖，但只在备份里真有内容时才写 ——
         空数组覆盖会把本机的收藏/学完/最近学习无声清掉。 */
      if(hasMarks){
        const w=(k,arr)=>{try{localStorage.setItem(k,JSON.stringify(arr))}catch(e){}};
        w(LS_FAV,fv); w(LS_DONE,dv); w(LS_RECENT,rv);
        /* 内存里的快照也得换，不然这一页上的星号、✓、最近学习
           还是打开主页那一刻的旧值，导入完看着像没生效。 */
        favs=fv; doneList=dv; recent=rv;
        /* 走 syncSearchUI：列表、搜索框、clear 按钮一起对齐。
           原来只 render()，搜索框还留着旧词，导入完看着像没生效。 */
        syncSearchUI(); renderRecent();
      }
      const parts=[];
      if(recs.length)parts.push(recs.length+' 条笔记');
      if(hasMarks)parts.push(mkN+' 条主页标记');
      else if(mk)parts.push('主页标记保持原样');
      toastMsg('导入成功：'+(parts.join(' + ')||'没有可写入的内容'));
    }catch(err){console.error(err);toastMsg('写入失败，看控制台');}
  };
  reader.readAsText(f);
});
</script>
