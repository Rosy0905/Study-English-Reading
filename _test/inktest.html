<!doctype html>
<html>
<head><meta charset="utf-8"><title>inktest</title></head>
<body>
<div id="hostA" style="position:relative;width:400px;height:300px;border:1px solid #aaa;background:#fff">
  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" style="position:absolute;inset:0;width:100%;height:100%">
</div>
<div id="hostB" style="position:relative;width:400px;height:300px;border:1px solid #aaa;background:#fff;margin-top:8px">
  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" style="position:absolute;inset:0;width:100%;height:100%">
</div>
<script src="../assets/ekz-db.js"></script>
<script src="../assets/ink-paper.js"></script>
<script src="../assets/mark-engine.js"></script>
<script src="../assets/ink-toolbar.js"></script>
<script>
window.__errors = [];
window.addEventListener('error', e => window.__errors.push('ERR:' + e.message));
window.addEventListener('unhandledrejection', e => window.__errors.push('REJ:' + (e.reason && e.reason.message || e.reason)));
const _err = console.error;
console.error = (...a) => { try { window.__errors.push('CERR:' + a.map(String).join(' ')); } catch(_){} _err.apply(console, a); };

window.__setup = async function (finger) {
  window.engine = await window.EkzMark.init('test-paper-xyz', [
    { el: document.getElementById('hostA'), slot: 'article' },
    { el: document.getElementById('hostB'), slot: 'question' }
  ]);
  window.engine.setEditing(true);
  window.engine.setTool('pen');
  if (finger) window.engine.setFinger(true);
  return 'ready';
};
function _cv(id) { return document.getElementById(id).querySelector('canvas.ekz-ink-cv'); }
window.__drawOn = function (hostId, tool, pts, pointerType) {
  window.engine.setTool(tool);
  const cv = _cv(hostId); const r = cv.getBoundingClientRect();
  const id = (Date.now() % 100000) + Math.floor(Math.random() * 1000) + 1;
  const pt = pointerType || 'pen';
  const mk = (t, x, y) => new PointerEvent(t, { pointerId: id, pointerType: pt, button: 0, buttons: (t === 'pointerup' ? 0 : 1), clientX: r.left + x, clientY: r.top + y, pressure: 0.5, bubbles: true, cancelable: true });
  cv.dispatchEvent(mk('pointerdown', pts[0][0], pts[0][1]));
  for (let i = 1; i < pts.length; i++) cv.dispatchEvent(mk('pointermove', pts[i][0], pts[i][1]));
  cv.dispatchEvent(mk('pointerup', pts[pts.length - 1][0], pts[pts.length - 1][1]));
};
window.__pixels = function (hostId) {
  const cv = _cv(hostId); const c = cv.getContext('2d');
  const d = c.getImageData(0, 0, cv.width, cv.height).data;
  let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 0) n++;
  return n;
};
window.__strokesOf = function (slot) { return window.engine.rec.marks[slot] ? window.engine.rec.marks[slot].length : 0; };
window.__clearActive = function () {
  const before = { a: window.__strokesOf('article'), q: window.__strokesOf('question') };
  window.engine.clearActive();
  const after = { a: window.__strokesOf('article'), q: window.__strokesOf('question') };
  return { before, after };
};
window.__zoom = function (hostId) { const h = document.getElementById(hostId); const w = parseFloat(h.style.width) || h.clientWidth; h.style.width = (w * 2) + 'px'; };
window.__setFinger = function (v) { window.engine.setFinger(v); };
window.__errors_get = function () { return window.__errors.slice(); };
window.__idbCount = async function (slot) {
  try {
    const rec = await window.ekzDB.get('test-paper-xyz-mark');
    if (!rec || !rec.marks) return -1;
    return rec.marks[slot] ? rec.marks[slot].length : 0;
  } catch (e) { return 'ERR:' + e.message; }
};
</script>
</body>
</html>
