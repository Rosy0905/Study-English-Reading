<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset:method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset:method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset:method_newtype_overview)\n\n![新题型考纲表格](asset:method_newtype_table)\n\n![七选五题型说明](asset:method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset:method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset:method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset:method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"# 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| saying | n. 谚语；俗话 | half | n. 一半 | advertising budgets | 名词短语：广告预算 |\n| wasted | v. 被浪费 | trouble | n. 问题；麻烦 | knows | v. 知道 |\n| internet age | 名词短语：互联网时代 | in theory | 介词短语：在理论上 | fraction | n. 比例；此处指被浪费的预算所占比例 |\n| reduced | v. 减少；降低 | watching | v. 观察；监测 | click on | 动词短语：点击 |\n| online | adv. 在网上 | companies | n. 公司 | aim ... at ... | 动词短语：把……投向……；以……为目标 |\n| behavioural ads | 名词短语：行为定向广告 | likely to | 形容词短语：可能……的 |  |  |","level":1,"section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[96,117,895,484],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>saying<\/td>\n<td>n. 谚语；俗话<\/td>\n<td>half<\/td>\n<td>n. 一半<\/td>\n<td>advertising budgets<\/td>\n<td>名词短语：广告预算<\/td>\n<\/tr>\n<tr>\n<td>wasted<\/td>\n<td>v. 被浪费<\/td>\n<td>trouble<\/td>\n<td>n. 问题；麻烦<\/td>\n<td>knows<\/td>\n<td>v. 知道<\/td>\n<\/tr>\n<tr>\n<td>internet age<\/td>\n<td>名词短语：互联网时代<\/td>\n<td>in theory<\/td>\n<td>介词短语：在理论上<\/td>\n<td>fraction<\/td>\n<td>n. 比例；此处指被浪费的预算所占比例<\/td>\n<\/tr>\n<tr>\n<td>reduced<\/td>\n<td>v. 减少；降低<\/td>\n<td>watching<\/td>\n<td>v. 观察；监测<\/td>\n<td>click on<\/td>\n<td>动词短语：点击<\/td>\n<\/tr>\n<tr>\n<td>online<\/td>\n<td>adv. 在网上<\/td>\n<td>companies<\/td>\n<td>n. 公司<\/td>\n<td>aim ... at ...<\/td>\n<td>动词短语：把……投向……；以……为目标<\/td>\n<\/tr>\n<tr>\n<td>behavioural ads<\/td>\n<td>名词短语：行为定向广告<\/td>\n<td>likely to<\/td>\n<td>形容词短语：可能……的<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table>\n"},{"title":"第2段","raw":"# 第2段\n\n| 表达 | 词 利：(在这方面之前)。\n\n布伦登·林奇：(微软首席隐私官) → 在博客中写道：\"我们相信 → 消费者应该有 → 更多控制权。\"\n\n真的会是 → 这么简单吗？","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"meta":{},"html":"<p><strong>第1段<\/strong><\/p>\n<p>一句老话说：(所有广告预算的一半 → 被浪费了) – 问题是：(没人知道 → 是哪一半)。<\/p>\n<p>在互联网时代：(至少在理论上) → 这个比例 → 可以大大减少。<\/p>\n<p>通过观察：(人们搜索什么 + 点击什么 + 在网上说什么) → 公司可以瞄准 → &quot;行为&quot;广告：(对那些最可能购买的人)。<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>在过去几周里 → 一场争论展示了 → 对广告商的价值：(这种细粒度信息的)：广告商应该假设：(人们乐意：(被追踪 + 接收行为广告))吗？<\/p>\n<p>还是他们应该有 → 明确的许可？<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>在2010年12月 → 美国联邦贸易委员会（FTC）→ 提议添加 → 一个&quot;请勿追踪&quot;（DNT）选项：(到互联网浏览器)，以便用户可以告诉广告商：(他们不想 → 被跟踪)。<\/p>\n<p>微软的Internet Explorer + 苹果的Safari → 都提供DNT；// 谷歌的Chrome → 预计会这样做：(今年)。<\/p>\n<p>在二月 → FTC和数字广告联盟（DAA）→ 同意：(该行业将开始着手：(响应DNT请求))。<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>在5月31日 → 微软引发了这场争论。<\/p>\n<p>它说：(Internet Explorer 10：(预计出现的版本：(随Windows 8)) → 将把DNT：(作为默认设置))。<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>广告商感到恐慌。<\/p>\n<p>人性如此 → 大多数人坚持使用 → 默认设置。<\/p>\n<p>现在很少有人开启DNT // 但如果追踪是关闭的 → 它将保持关闭。<\/p>\n<p>鲍勃·利奥迪斯：(首席执行官：(全国广告商协会的)) → 说消费者会更糟糕：(如果该行业不能收集 → 关于他们偏好的信息)。<\/p>\n<p>人们不会得到 → 更少的广告，他说。<\/p>\n<p>&quot;他们会得到 → 意义更少的 + 针对性更差的广告。&quot;<\/p>\n<p><strong>第6段<\/strong><\/p>\n<p>还不清楚：(广告商将如何回应)。<\/p>\n<p>收到DNT信号 → 并不强制任何人 → 停止追踪，尽管一些公司 → 已经承诺这样做。<\/p>\n<p>无法判断：(某人是否真的反对 → 行为广告 // 还是他们只是坚持 → 微软的默认设置) → 一些人可能忽略 → DNT信号 + 继续进行。<\/p>\n<p><strong>第7段<\/strong><\/p>\n<p>同样不清楚的 → 是为什么微软 → 单独行动。<\/p>\n<p>毕竟 → 它也有广告业务：(它说 → 将遵守DNT请求)，尽管它仍在研究如何做。<\/p>\n<p>如果它试图 → 打击谷歌：(谷歌几乎完全依赖 → 广告) → 它选择了 → 一个间接方法：没有保证：(默认DNT → 会成为规范)。<\/p>\n<p>DNT似乎不是 → 一个明显巨大的卖点：(对于Windows 8) – 尽管该公司已经比较过 → 它的一些其他产品 → 与谷歌的相比有利：(在这方面之前)。<\/p>\n<p>布伦登·林奇：(微软首席隐私官) → 在博客中写道：&quot;我们相信 → 消费者应该有 → 更多控制权。&quot;<\/p>\n<p>真的会是 → 这么简单吗？<\/p>\n"},{"title":"长难句翻译练习（英一必修，英二选修)","raw":"## 长难句翻译练习（英一必修，英二选修)\n\n对于长难句的翻译，流程一共五步：\n\n1. 划分意群；\n2. 逐个意群直译；\n3. 按照中文语感，把应该放在一起的意群合并起来；\n4. 找到中文句子的骨干，再按照中文语序调整合并后 hat people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>By watching / what people search for, / click on / and say online, / companies can aim / &quot;behavioural&quot; ads / at those most likely to buy.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>通过观察 / 人们搜索什么，/ 点击什么 / 以及在网上说什么，/ 公司可以瞄准 / &quot;行为&quot;广告 / 对那些最可能购买的人。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-1-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>先把观察的三个内容并排接起来，它们都属于“人们在网上的行为”：<\/p>\n<blockquote>\n<p>观察人们搜索什么、点击什么以及在网上说什么<\/p>\n<\/blockquote>\n<p>“最可能购买的”是在说明哪一类人，先和“人”合在一起：<\/p>\n<blockquote>\n<p>那些最可能购买的人<\/p>\n<\/blockquote>\n<p>再把广告和接收广告的人接到公司的动作后面：<\/p>\n<blockquote>\n<p>公司把“行为”广告瞄准那些最可能购买的人<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>通过观察人们搜索什么、点击什么以及在网上说什么\n公司可以把“行为”广告瞄准那些最可能购买的人<\/p>\n<\/blockquote>\n<\/section>"},{"title":"1. 第1段第3句","raw":"#### 第四步：寻找句子骨干并按照中文语序调整\n\n接着找中文句子的骨干：\n\n> 公司可以向特定人群投放广告。\n\n先把“通过观察……”放在公司采取行动之前，交代它怎样找到目标人群。再让“公司”接“可以”，把广告接收者放到“瞄准”的后面。搜索、点击和网上言论都属于观察内容，不要把它们写成公司向消费者提供的服务。\n\n按照中文语序调整后是：\n\n> 通过观察人们搜索什么、点击什么以及在网上说什么，公司可以把“行为”广告瞄准那些最可能购买的人。","level":4,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第1段第3句","focus":[96,260,895,143],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-4","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文<\/h3>\n<blockquote>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>By wat ockquote>\n<p>几乎完全依赖广告的谷歌<\/p>\n<\/blockquote>\n<p>再把这个对象接到微软可能的目的后：<\/p>\n<blockquote>\n<p>如果它试图打击这样的谷歌<\/p>\n<\/blockquote>\n<p>冒号后解释为什么这种方法是间接的，要把“默认DNT”和预期结果接在一起：<\/p>\n<blockquote>\n<p>没有保证默认DNT会成为规范<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>如果它试图打击几乎完全依赖广告的谷歌\n它选择了一个间接方法\n没有保证默认DNT会成为规范<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-4\"><h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>如果目的是打击谷歌，微软的方法是间接的。<\/p>\n<\/blockquote>\n<p>先用“如果”限定打击谷歌只是被讨论的一种动机，不写成已经确定的事实。在“谷歌”前交代它对广告的依赖，再接微软选择的方法。最后用冒号保留解释关系，说默认DNT未必成为规范，这才说明前面的“间接”。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>如果它试图打击几乎完全依赖广告的谷歌，它选择了一个间接方法：没有保证默认DNT会成为规范。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"6. 第7段第3句","raw":"#### 第五步：艺术加工\n\n第四步已经把意思说明白了，接下来让表达更加准确、自然：\n\n- “一个间接方法”整理为“一个间接的方法”，读起来更自然。\n- 把此处的“规范”明确为“行业规范”，使它指向浏览器和广告行业的通行做法；保留“没有保证”，不改成绝不可能成为规范。\n\n参考译文：\n\n> 如果它试图打击几乎完全依赖广告的谷歌，它选择了一个间接的方法：没有保证默认DNT会成为行业规范。","level":4,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第7段第3句","focus":[96,3420,895,197],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-6","cumulativeFinal":true},"focusId":"focus-long-6-5","html":"<section class=\"revealPart\" id=\"focus-long-6-0\"><h3>原文<\/h3>\n<blockquote>\n<p>If it is trying to upset Google, which relies almost wholly on advertising, it has  chosen an indirect method: there is no guarantee that DNT by default will become the norm.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-1\"><h3>第一步：划分意群<\/h3>\n<blockquote>\n<p>If it is trying / to upset Google, / which relies almost wholly / on advertising, / it has chosen / an indirect method: / there is no guarantee / that DNT by default / will become the norm.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-2\"><h3>第二步：逐个意群直译<\/h3>\n<blockquote>\n<p>如果它试图 / 打击谷歌，/ 谷歌几乎完全依赖 / 广告，/ 它选择了 / 一个间接方法：/ 没有保证 / 默认DNT / 会成为规范。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-3\"><h3>第三步：按照中文语感合并意群<\/h3>\n<p>“几乎完全依赖广告”是在补充谷歌的情况，先和谷歌合成一块：<\/p>\n<blockquote>\n<p>几乎完全依赖广告的谷歌<\/p>\n<\/blockquote>\n<p>再把这个对象接到微软可能的目的后：<\/p>\n<blockquote>\n<p>如果它试图打击这样的谷歌<\/p>\n<\/blockquote>\n<p>冒号后解释为什么这种方法是间接的，要把“默认DNT”和预期结果接在一起：<\/p>\n<blockquote>\n<p>没有保证默认DNT会成为规范<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>如果它试图打击几乎完全依赖广告的谷歌\n它选择了一个间接方法\n没有保证默认DNT会成为规范<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-4\"><h3>第四步：寻找句子骨干并按照中文语序调整<\/h3>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>如果目的是打击谷歌，微软的方法是间接的。<\/p>\n<\/blockquote>\n<p>先用“如果”限定打击谷歌只是被讨论的一种动机，不写成已经确定的事实。在“谷歌”前交代它对广告的依赖，再接微软选择的方法。最后用冒号保留解释关系，说默认DNT未必成为规范，这才说明前面的“间接”。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>如果它试图打击几乎完全依赖广告的谷歌，它选择了一个间接方法：没有保证默认DNT会成为规范。<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-long-6-5\"><h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“一个间接方法”整理为“一个间接的方法”，读起来更自然。<\/li>\n<li>把此处的“规范”明确为“行业规范”，使它指向浏览器和广告行业的通行做法；保留“没有保证”，不改成绝不可能成为规范。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>如果它试图打击几乎完全依赖广告的谷歌，它选择了一个间接的方法：没有保证默认DNT会成为行业规范。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1711,"sourceH":2572},"meta":{"kind":"section-cover","mergedIntro":true},"level":1,"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n"},{"title":"30题 · 题干、题型与核心出处","raw":"## 30题\n\n**The author’s attitude towards what Brendon Lynch said in his blog is one of ______.**\n\n作者对Brendon Lynch博客中那句话持什么态度？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **appreciation**\n\n赞赏\n\nB. **understanding**\n\n理解\n\nC. **indulgence**\n\n纵容\n\nD. **skepticism**\n\n怀疑\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先说行为广告理论上能减少广告预算浪费，把广告投给更可能购买的人 | 先说一种新办法看起来很有效 |\n| 2 | 提出争议：用户应当默认被追踪，还是必须先明确同意 | 再说是否默认接受的问题 |\n| 3 | 交代监管机构提议引入DNT、各浏览器提供这一功能，以及监管机构与广告联盟就行业回应请求达成约定 | 接着说各方先答应处理 |\n| 4 | 写微软把DNT设为浏览器默认选项，由此把争议推到台前 | 然后写有人突然改了默认做法 |\n| 5 | 写广告商担心数据收集受限，认为消费者不会少看广告，只会看到更不精准的广告 | 再说反对者为什么不高兴 |\n| 6 | 指出DNT信号并不必然迫使停止追踪，广告商可能忽略它继续 | 但话说回来：实际效果还不确定 |\n| 7 | 继续质疑微软单独行动的动机和效果，并用反问回应“给消费者更多控制权”这句口号 | 最后下结论：一句漂亮话未必够用 |","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[18,2061,1675,493],"sourceW":1711,"sourceH":2572},"meta":{"kind":"question","question":30},"level":2,"html":"<p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<p>作者对Brendon Lynch博客中那句话持什么态度？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>appreciation<\/strong><\/p>\n<p>赞赏<\/p>\n<p>B. <strong>understanding<\/strong><\/p>\n<p>理解<\/p>\n<p>C. <strong>indulgence<\/strong><\/p>\n<p>纵容<\/p>\n<p>D. <strong>skepticism<\/strong><\/p>\n<p>怀疑<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先说行为广告理论上能减少广告预算浪费，把广告投给更可能购买的人<\/td>\n<td>先说一种新办法看起来很有效<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>提出争议：用户应当默认被追踪，还是必须先明确同意<\/td>\n<td>再说是否默认接受的问题<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>交代监管机构提议引入DNT、各浏览器提供这一功能，以及监管机构与广告联盟就行业回应请求达成约定<\/td>\n<td>接着说各方先答应处理<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>写微软把DNT设为浏览器默认选项，由此把争议推到台前<\/td>\n<td>然后写有人突然改了默认做法<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>写广告商担心数据收集受限，认为消费者不会少看广告，只会看到更不精准的广告<\/td>\n<td>再说反对者为什么不高兴<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>指出DNT信号并不必然迫使停止追踪，广告商可能忽略它继续<\/td>\n<td>但话说回来：实际效果还不确定<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>继续质疑微软单独行动的动机和效果，并用反问回应“给消费者更多控制权”这句口号<\/td>\n<td>最后下结论：一句漂亮话未必够用<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n"},{"title":"A. appreciation","raw":"**The author’s attitude towards what Brendon Lynch said in his blog is one of ______.**\n\n### A. appreciation\n\n赞赏","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题 A选项","focus":[93,2231,327,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":30,"option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q30-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-A-0\"><p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<p>赞赏<\/p>\n<\/section>"},{"title":"A. appreciation","raw":"#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n赞赏\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先说明行为广告通过分析用户行为提高投放效率，看起来能够减少浪费，为赞赏消费者在有效广告技术面前仍应掌握选择权建立背景 | 先说一种新办法看起来很有效 |\n| 2 | 再讨论使用有效追踪技术是否可以默认取得用户同意，提出消费者有权决定是否接受追踪，使“更多控制权”成为值得肯定的原则 | 再说是否默认接受的问题 |\n| 3 | 接着写监管机构、浏览器与广告方面答应提供拒绝追踪的入口并处理请求，把这些承诺视为认可消费者控制权的积极起点 | 接着说各方先答应处理 |\n| 4 | 然后写微软突然把拒绝追踪设为默认，说明这一改变使是否由用户掌握追踪选择成为现实议题，为赞赏其公开承认用户权利提供具体事件 | 然后写有人突然改了默认做法 |\n| 5 | 再解释反对者因行为数据和广告针对性受到影响而不满，指出这些商业顾虑使微软公开肯定消费者控制权显得值得赞赏 | 再说反对者为什么不高兴 |\n| 6 | 转而承认默认设置能否被执行、能否实际增加控制权仍不确定，把对权利原则的赞赏与对落地成效的审慎区分开 | 但话说回来：实际效果还不确定 |\n| 7 | 最后肯定“消费者应该拥有更多控制权”这一声明的价值，同时要求兑现为可执行的措施：值得赞赏的漂亮话本身仍未必够用 | 最后下结论：一句漂亮话未必够用 |\n\nA说的是作者赞赏Brendon Lynch所说的“消费者应有更多控制权”。赞赏这项原则并不要求作者认定DNT已经完美实施，所以不能只因第6段写执行困难就排除A；上面的假想路线完全可以一面肯定原则，一面要求兑现。\n\n实际第7段的关注点却是微软为什么单独行动。作者先说`Also unclear`，再审视微软自己的广告业务、对谷歌的竞争意图和Windows 8卖点，最后把微软的自述接到反问`Could it really be that simple?`。这里是在追问这句声明是否足以解释微软的行动，没有出现把它评价为值得称赞的收束。A所需的肯定评价，和实际结尾保留疑问的态度不同。\n\n判断：\n\n**A 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题 A选项","focus":[93,2231,327,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":30,"option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q30-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-A-0\"><p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<p>赞赏<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q30-A-1\"><h3>如果 A 是主旨，文章7段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>赞赏<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先说明行为广告通过分析用户行为提高投放效率，看起来能够减少浪费，为赞赏消费者在有效广告技术面前仍应掌握选择权建立背景<\/td>\n<td>先说一种新办法看起来很有效<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再讨论使用有效追踪技术是否可以默认取得用户同意，提出消费者有权决定是否接受追踪，使“更多控制权”成为值得肯定的原则<\/td>\n<td>再说是否默认接受的问题<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>接着写监管机构、浏览器与广告方面答应提供拒绝追踪的入口并处理请求，把这些承诺视为认可消费者控制权的积极起点<\/td>\n<td>接着说各方先答应处理<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>然后写微软突然把拒绝追踪设为默认，说明这一改变使是否由用户掌握追踪选择成为现实议题，为赞赏其公开承认用户权利提供具体事件<\/td>\n<td>然后写有人突然改了默认做法<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>再解释反对者因行为数据和广告针对性受到影响而不满，指出这些商业顾虑使微软公开肯定消费者控制权显得值得赞赏<\/td>\n<td>再说反对者为什么不高兴<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>转而承认默认设置能否被执行、能否实际增加控制权仍不确定，把对权利原则的赞赏与对落地成效的审慎区分开<\/td>\n<td>但话说回来：实际效果还不确定<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>最后肯定“消费者应该拥有更多控制权”这一声明的价值，同时要求兑现为可执行的措施：值得赞赏的漂亮话本身仍未必够用<\/td>\n<td>最后下结论：一句漂亮话未必够用<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>A说的是作者赞赏Brendon Lynch所说的“消费者应有更多控制权”。赞赏这项原则并不要求作者认定DNT已经完美实施，所以不能只因第6段写执行困难就排除A；上面的假想路线完全可以一面肯定原则，一面要求兑现。<\/p>\n<p>实际第7段的关注点却是微软为什么单独行动。作者先说<code>Also unclear<\/code>，再审视微软自己的广告业务、对谷歌的竞争意图和Windows 8卖点，最后把微软的自述接到反问<code>Could it really be that simple?<\/code>。这里是在追问这句声明是否足以解释微软的行动，没有出现把它评价为值得称赞的收束。A所需的肯定评价，和实际结尾保留疑问的态度不同。<\/p>\n<p>判断：<\/p>\n<p><strong>A 不保留。<\/strong><\/p>\n<\/section>"},{"title":"B. understanding","raw":"**The author’s attitude towards what Brendon Lynch said in his blog is one of ______.**\n\n### B. understanding\n\n理解","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题 B选项","focus":[93,2316,359,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":30,"option":"B","cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q30-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-B-0\"><p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<p>理解<\/p>\n<\/section>"},{"title":"B. understanding","raw":"#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n理解\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先介绍行为广告看起来能减少浪费，说明商业技术越有效，消费者控制个人行为数据的愿望越值得理解 | 先说一种新办法看起来很有效 |\n| 2 | 再讨论能否默认消费者接受追踪，展示用户不愿在没有明确选择时被追踪的处境，为理解微软声明中的控制权诉求作铺垫 | 再说是否默认接受的问题 |\n| 3 | 接着写有关各方先答应提供DNT并回应请求，说明微软声明所表达的用户诉求已经进入共同处理的议程 | 接着说各方先答应处理 |\n| 4 | 然后写微软突然改变默认做法，从用户不常修改设置的处境解释其行动，说明为何会说消费者应有更多控制权 | 然后写有人突然改了默认做法 |\n| 5 | 再解释反对者依赖追踪数据、担心失去广告针对性而不高兴，展示微软表达控制权诉求时面对的商业压力 | 再说反对者为什么不高兴 |\n| 6 | 转而说明实际控制效果仍不确定，但实现困难不妨碍理解微软为何提出这项诉求，区分理解其出发点与肯定其效果 | 但话说回来：实际效果还不确定 |\n| 7 | 最后以体谅的口吻理解微软声明所表达的诉求，同时指出一句漂亮话未必解决执行难题，需要继续给出办法 | 最后下结论：一句漂亮话未必够用 |\n\nB指作者对这句声明表示理解、体谅，不是“作者读懂了这句话的字面意思”。理解也不必等于完全赞成，因而一篇理解微软处境的文章仍可以承认效果不确定；关键要看作者是否把疑难转成对其立场的体谅。\n\n实际第5段解释了广告商的担忧，第6段指出信号可能被忽略，第7段却没有由此替微软的表态说明一个可体谅的理由。相反，作者说它的单独行动动机也不清楚，并接连检查竞争和销售上的解释。最后的反问把“给消费者更多控制权”作为仍待审视的说法，没有把它写成可以理解、接受的出发点。分析可能的动机，不等于最终对这句自述表示理解。\n\n判断：\n\n**B 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题 B选项","focus":[93,2316,359,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":30,"option":"B","cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q30-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-B-0\"><p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<p>理解<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q30-B-1\"><h3>如果 B 是主旨，文章7段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>理解<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先介绍行为广告看起来能减少浪费，说明商业技术越有效，消费者控制个人行为数据的愿望越值得理解<\/td>\n<td>先说一种新办法看起来很有效<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再讨论能否默认消费者接受追踪，展示用户不愿在没有明确选择时被追踪的处境，为理解微软声明中的控制权诉求作铺垫<\/td>\n<td>再说是否默认接受的问题<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>接着写有关各方先答应提供DNT并回应请求，说明微软声明所表达的用户诉求已经进入共同处理的议程<\/td>\n<td>接着说各方先答应处理<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>然后写微软突然改变默认做法，从用户不常修改设置的处境解释其行动，说明为何会说消费者应有更多控制权<\/td>\n<td>然后写有人突然改了默认做法<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>再解释反对者依赖追踪数据、担心失去广告针对性而不高兴，展示微软表达控制权诉求时面对的商业压力<\/td>\n<td>再说反对者为什么不高兴<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>转而说明实际控制效果仍不确定，但实现困难不妨碍理解微软为何提出这项诉求，区分理解其出发点与肯定其效果<\/td>\n<td>但话说回来：实际效果还不确定<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>最后以体谅的口吻理解微软声明所表达的诉求，同时指出一句漂亮话未必解决执行难题，需要继续给出办法<\/td>\n<td>最后下结论：一句漂亮话未必够用<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>B指作者对这句声明表示理解、体谅，不是“作者读懂了这句话的字面意思”。理解也不必等于完全赞成，因而一篇理解微软处境的文章仍可以承认效果不确定；关键要看作者是否把疑难转成对其立场的体谅。<\/p>\n<p>实际第5段解释了广告商的担忧，第6段指出信号可能被忽略，第7段却没有由此替微软的表态说明一个可体谅的理由。相反，作者说它的单独行动动机也不清楚，并接连检查竞争和销售上的解释。最后的反问把“给消费者更多控制权”作为仍待审视的说法，没有把它写成可以理解、接受的出发点。分析可能的动机，不等于最终对这句自述表示理解。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<\/section>"},{"title":"C. indulgence","raw":"**The author’s attitude towards what Brendon Lynch said in his blog is one of ______.**\n\n### C. indulgence\n\n纵容","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题 C选项","focus":[94,2401,296,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":30,"option":"C","cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q30-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-C-0\"><p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<p>纵容<\/p>\n<\/section>"},{"title":"C. indulgence","raw":"#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n纵容\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先说明行为广告在减少浪费上看起来有效，由此交代微软以消费者控制权回应有效商业技术时面临的实际压力，为宽容其声明中的不足铺垫 | 先说一种新办法看起来很有效 |\n| 2 | 再讨论是否能默认用户接受追踪，说明同意规则尚有争议，因此对微软关于消费者控制权的简略表述留出宽容空间 | 再说是否默认接受的问题 |\n| 3 | 接着写各方先答应处理DNT请求但具体安排仍待落实，把微软尚未充分展开的声明放在大家都在摸索的阶段中看待 | 接着说各方先答应处理 |\n| 4 | 然后写微软突然改变默认做法，承认行动和解释较仓促，却对“更多控制权”这句尚不周全的声明采取宽待态度 | 然后写有人突然改了默认做法 |\n| 5 | 再写反对者因数据获取和广告效果受影响而不满，说明这些压力让微软的解释未能顾全各方，为其表述不足给予体谅 | 再说反对者为什么不高兴 |\n| 6 | 转而承认实际效果尚不确定，但仍愿意容忍微软的声明先于完整执行方案，不因缺少成效证明就苛责其表态 | 但话说回来：实际效果还不确定 |\n| 7 | 最后指出一句漂亮话未必够用，却选择宽容其暂时的不足，让微软有时间补出执行方案，而不继续追究声明的可信性 | 最后下结论：一句漂亮话未必够用 |\n\nC表示对微软这句声明采取宽容、纵容的态度：即使解释还不周全，也愿意放宽要求，不作严格追问。这不必预设作者已证明微软说谎；宽容也可能针对仓促、过于简单或缺少细节的表态。\n\n实际文章没有为这类不足开脱。第6段的执行疑点没有被化解，第7段又补出动机疑点，随后以`Could it really be that simple?`继续追问。这种收束要求读者继续审视声明，而非容忍其不足、就此放过。因此C需要的宽待方向，不能从文章真实的疑问推进中得到。\n\n判断：\n\n**C 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题 C选项","focus":[94,2401,296,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":30,"option":"C","cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q30-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-C-0\"><p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<p>纵容<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q30-C-1\"><h3>如果 C 是主旨，文章7段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>纵容<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先说明行为广告在减少浪费上看起来有效，由此交代微软以消费者控制权回应有效商业技术时面临的实际压力，为宽容其声明中的不足铺垫<\/td>\n<td>先说一种新办法看起来很有效<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再讨论是否能默认用户接受追踪，说明同意规则尚有争议，因此对微软关于消费者控制权的简略表述留出宽容空间<\/td>\n<td>再说是否默认接受的问题<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>接着写各方先答应处理DNT请求但具体安排仍待落实，把微软尚未充分展开的声明放在大家都在摸索的阶段中看待<\/td>\n<td>接着说各方先答应处理<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>然后写微软突然改变默认做法，承认行动和解释较仓促，却对“更多控制权”这句尚不周全的声明采取宽待态度<\/td>\n<td>然后写有人突然改了默认做法<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>再写反对者因数据获取和广告效果受影响而不满，说明这些压力让微软的解释未能顾全各方，为其表述不足给予体谅<\/td>\n<td>再说反对者为什么不高兴<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>转而承认实际效果尚不确定，但仍愿意容忍微软的声明先于完整执行方案，不因缺少成效证明就苛责其表态<\/td>\n<td>但话说回来：实际效果还不确定<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>最后指出一句漂亮话未必够用，却选择宽容其暂时的不足，让微软有时间补出执行方案，而不继续追究声明的可信性<\/td>\n<td>最后下结论：一句漂亮话未必够用<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>C表示对微软这句声明采取宽容、纵容的态度：即使解释还不周全，也愿意放宽要求，不作严格追问。这不必预设作者已证明微软说谎；宽容也可能针对仓促、过于简单或缺少细节的表态。<\/p>\n<p>实际文章没有为这类不足开脱。第6段的执行疑点没有被化解，第7段又补出动机疑点，随后以<code>Could it really be that simple?<\/code>继续追问。这种收束要求读者继续审视声明，而非容忍其不足、就此放过。因此C需要的宽待方向，不能从文章真实的疑问推进中得到。<\/p>\n<p>判断：<\/p>\n<p><strong>C 不保留。<\/strong><\/p>\n<\/section>"},{"title":"D. skepticism","raw":"**The author’s attitude towards what Brendon Lynch said in his blog is one of ______.**\n\n### D. skepticism\n\n怀疑","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题 D选项","focus":[93,2485,295,69],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":30,"option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q30-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-D-0\"><p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<p>怀疑<\/p>\n<\/section>"},{"title":"D. skepticism","raw":"#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n怀疑\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先说明行为广告看起来能减少预算浪费、使广告更精准，交代追踪背后的商业价值，为审视微软“更多控制权”的解释提供利益背景 | 先说一种新办法看起来很有效 |\n| 2 | 再讨论是否可以默认消费者接受追踪，说明控制权涉及谁作出同意决定，不能仅凭一句声明认定用户已经掌握了选择 | 再说是否默认接受的问题 |\n| 3 | 接着写各方先答应引入DNT并处理请求，把承诺列作事件背景，同时为之后检验承诺能否兑现留下问题 | 接着说各方先答应处理 |\n| 4 | 然后写微软突然把DNT设为默认，指出用户主动决定与厂商预先决定并非同一件事，使“更多控制权”的解释值得进一步审视 | 然后写有人突然改了默认做法 |\n| 5 | 再写反对者因数据收集受限、广告针对性下降而不高兴，并提出消费者可能不受益的理由，增加对简单利民解释的疑问 | 再说反对者为什么不高兴 |\n| 6 | 转而指出广告商是否停止追踪、默认信号能否落实用户意愿仍不确定，说明实际效果尚不能为“更多控制权”的声明提供充分保证 | 但话说回来：实际效果还不确定 |\n| 7 | 最后结合微软自身广告业务、竞争动机和执行疑点追问声明是否足以解释这次行动，收束为对一句漂亮话不轻信的怀疑态度 | 最后下结论：一句漂亮话未必够用 |\n\nD是怀疑，具体对象是Brendon Lynch关于“消费者应有更多控制权”的声明能否如此简单地说明微软的行动。它不等于作者否定消费者应有选择权，也不等于认定微软的所有动机都已被揭穿。\n\n第1段承认行为广告在理论上能提高效率，说明作者并非对文中一切事物都持负面态度。第2至4段交代同意规则、DNT安排和默认设置的变化，第5段补出消费者未必受益的争议，第6段再说明拒绝追踪信号可能被忽略。由此走到第7段，单凭“更多控制权”并不能消除行动效果和商业动机上的问题。\n\n结尾紧跟微软声明的反问直接表明作者不轻信这一简单解释。D既能容纳前文对商业价值和执行难题的客观讨论，也准确落在题干指定的表态对象上。\n\n判断：\n\n**D 保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题 D选项","focus":[93,2485,295,69],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":30,"option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q30-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-D-0\"><p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<p>怀疑<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q30-D-1\"><h3>如果 D 是主旨，文章7段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>怀疑<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先说明行为广告看起来能减少预算浪费、使广告更精准，交代追踪背后的商业价值，为审视微软“更多控制权”的解释提供利益背景<\/td>\n<td>先说一种新办法看起来很有效<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再讨论是否可以默认消费者接受追踪，说明控制权涉及谁作出同意决定，不能仅凭一句声明认定用户已经掌握了选择<\/td>\n<td>再说是否默认接受的问题<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>接着写各方先答应引入DNT并处理请求，把承诺列作事件背景，同时为之后检验承诺能否兑现留下问题<\/td>\n<td>接着说各方先答应处理<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>然后写微软突然把DNT设为默认，指出用户主动决定与厂商预先决定并非同一件事，使“更多控制权”的解释值得进一步审视<\/td>\n<td>然后写有人突然改了默认做法<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>再写反对者因数据收集受限、广告针对性下降而不高兴，并提出消费者可能不受益的理由，增加对简单利民解释的疑问<\/td>\n<td>再说反对者为什么不高兴<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>转而指出广告商是否停止追踪、默认信号能否落实用户意愿仍不确定，说明实际效果尚不能为“更多控制权”的声明提供充分保证<\/td>\n<td>但话说回来：实际效果还不确定<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>最后结合微软自身广告业务、竞争动机和执行疑点追问声明是否足以解释这次行动，收束为对一句漂亮话不轻信的怀疑态度<\/td>\n<td>最后下结论：一句漂亮话未必够用<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>D是怀疑，具体对象是Brendon Lynch关于“消费者应有更多控制权”的声明能否如此简单地说明微软的行动。它不等于作者否定消费者应有选择权，也不等于认定微软的所有动机都已被揭穿。<\/p>\n<p>第1段承认行为广告在理论上能提高效率，说明作者并非对文中一切事物都持负面态度。第2至4段交代同意规则、DNT安排和默认设置的变化，第5段补出消费者未必受益的争议，第6段再说明拒绝追踪信号可能被忽略。由此走到第7段，单凭“更多控制权”并不能消除行动效果和商业动机上的问题。<\/p>\n<p>结尾紧跟微软声明的反问直接表明作者不轻信这一简单解释。D既能容纳前文对商业价值和执行难题的客观讨论，也准确落在题干指定的表态对象上。<\/p>\n<p>判断：<\/p>\n<p><strong>D 保留。<\/strong><\/p>\n<\/section>"},{"title":"30题结论","raw":"### 30题结论\n\n**30. D. skepticism**\n\n这句话就是本文后续做题的主旨底牌：\n\n**skepticism / 怀疑**\n\n这里的怀疑针对微软“给消费者更多控制权”这一声明能否简单说明它的行动，不是对行为广告、DNT原则或所有企业的一概否定。后面判断具体人物、指代和效果时，仍要回到各题限定的原句。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[18,2061,1675,493],"sourceW":1711,"sourceH":2572},"meta":{"kind":"conclusion","question":30},"level":3,"html":"<p><strong>30. D. skepticism<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>skepticism / 怀疑<\/strong><\/p>\n<p>这里的怀疑针对微软“给消费者更多控制权”这一声明能否简单说明它的行动，不是对行为广告、DNT原则或所有企业的一概否定。后面判断具体人物、指代和效果时，仍要回到各题限定的原句。<\/p>\n"},{"title":"26题 · 题干、题型与核心出处","raw":"## 26题\n\n> It is suggested in Paragraph 1 that “behavioural” ads help advertisers to ______.  \n> 第一段表明，“行为广告”帮助广告商做什么？\n\n### 题型\n\n这是一道细节推断题。题干用`Paragraph 1`限定第一段，`behavioural ads help advertisers`要求判断行为广告给广告商带来的作用。要把广告预算的浪费、互联网时代减少浪费的可能性和追踪后精准投放三句话接起来，不能仅凭“网络广告”补出其他好处。\n\n### 核心出处\n\n> An old saying has it that half of all advertising budgets are wasted – the trouble is, no one knows which half.\n>\n> In the internet age, at least in theory, this fraction can be much reduced.\n>\n> By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.\n\n第一句提出广告预算中存在无效投入，第二句中的`this fraction`承接前一句被浪费的那一部分，第三句说明减少浪费的办法：把广告投给最可能购买的人。题干问的是这条因果关系给广告商带来的经济作用，结论也要保留原文`at least in theory`的分寸。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[18,18,1657,410],"sourceW":1711,"sourceH":2572},"meta":{"kind":"question","question":26},"level":2,"html":"<blockquote>\n<p>It is suggested in Paragraph 1 that “behavioural” ads help advertisers to ______.<br>第一段表明，“行为广告”帮助广告商做什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道细节推断题。题干用<code>Paragraph 1<\/code>限定第一段，<code>behavioural ads help advertisers<\/code>要求判断行为广告给广告商带来的作用。要把广告预算的浪费、互联网时代减少浪费的可能性和追踪后精准投放三句话接起来，不能仅凭“网络广告”补出其他好处。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>An old saying has it that half of all advertising budgets are wasted – the trouble is, no one knows which half.<\/p>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<p>第一句提出广告预算中存在无效投入，第二句中的<code>this fraction<\/code>承接前一句被浪费的那一部分，第三句说明减少浪费的办法：把广告投给最可能购买的人。题干问的是这条因果关系给广告商带来的经济作用，结论也要保留原文<code>at least in theory<\/code>的分寸。<\/p>\n"},{"title":"A. lower their operational costs","raw":"### A. lower their operational costs\n\n> 降低运营成本\n\n**做题模式中的状态：** 当时第一段的`fraction`显示为`[xxx]`，但已经读到了广告预算被浪费以及这部分可以减少；A的词没有遮挡。当时把减少无效广告支出与降低运营成本相连，第一轮保留A，并在其余三项排除后选择了A。\n\n**选项类型：局部推断。**\n\n命题人把“减少被浪费的广告预算”概括为降低广告商的运营成本。广告投入是经营支出的一部分，定向投放减少无效投入，因此这里是在同一经济作用上作概括，没有声称所有成本项目都会下降。\n\n**出处：**\n\n> An old saying has it that half of all advertising budgets are wasted – the trouble is, no one knows which half.\n>\n> In the internet age, at least in theory, this fraction can be much reduced.\n>\n> By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题 A选项","focus":[93,105,656,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":26,"option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q26-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-A-0\"><blockquote>\n<p>降低运营成本<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第一段的<code>fraction<\/code>显示为<code>[xxx]<\/code>，但已经读到了广告预算被浪费以及这部分可以减少；A的词没有遮挡。当时把减少无效广告支出与降低运营成本相连，第一轮保留A，并在其余三项排除后选择了A。<\/p>\n<p><strong>选项类型：局部推断。<\/strong><\/p>\n<p>命题人把“减少被浪费的广告预算”概括为降低广告商的运营成本。广告投入是经营支出的一部分，定向投放减少无效投入，因此这里是在同一经济作用上作概括，没有声称所有成本项目都会下降。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>An old saying has it that half of all advertising budgets are wasted – the trouble is, no one knows which half.<\/p>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. lower their operational costs","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第一段表明，行为广告有助于广告商降低运营成本。\n\n题干的`behavioural ads`对应第一段末句，A的`costs`对应段首的`advertising budgets`；要沿着预算浪费为何能减少的解释向后读。\n\n第一句指出广告预算存在浪费；第二句说互联网时代这一浪费比例在理论上可以减少；第三句补出原因，即依据搜索、点击和发言把广告投向更可能购买的人。三句共同提供了“减少无效投放支出”的推断基础。\n\n原文没有承诺每家公司的实际总开支都立即下降。A接在`help advertisers to`之后，是行为广告可带来的作用；减少广告这一经营环节中的无效成本，足以支持它，不需要另证工资、房租等所有成本都降低。\n\nA把预算浪费的减少概括为经营成本的节约，主体仍是广告商，方向仍是无效支出的下降。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题 A选项","focus":[93,105,656,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":26,"option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q26-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-A-0\"><blockquote>\n<p>降低运营成本<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第一段的<code>fraction<\/code>显示为<code>[xxx]< 少得写成：<\/p>\n<blockquote>\n<p>By directing ads at likely buyers, advertisers can reduce spending that would otherwise be wasted.<\/p>\n<p>通过把广告投向可能购买的人，广告商可以减少本来会被浪费的支出。<\/p>\n<\/blockquote>\n<p>A所需要的解释正是原文已有的推进：先指出可减少的浪费，再说明定向投放为何能减少它。假设句只是把两句之间的经济关系说开，并未增加一种新的服务或竞争效果。<\/p>\n<\/section>"},{"title":"A. lower their operational costs","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> skepticism  \n> 怀疑\n\n把这个主旨直接代入26题题干：\n\n> 全文主旨只能确认作者在审视微软“更多控制权”的声明，不能单独判断行为广告在第一段给广告商带来的具体成本作用。\n\nA实际说的是：\n\n> lower their operational costs  \n> 降低运营成本\n\n对微软声明持怀疑态度，不等于否认行为广告对广告商的商业价值。A说的是广告商的成本，第30题判断的是作者对微软表态的态度，二者对象不同；本项最终仍要根据“advertising budgets are wasted”和“this fraction can be much reduced”判断。局部原文给出了减少浪费的依据，A与这层事实相符。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题 A选项","focus":[93,105,656,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":26,"option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q26-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-A-0\"><blockquote>\n<p>降低运营成本<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第一段的<code>fraction<\/code>显示为<code>[xxx]<\/code>，但已经读到了广告预算被浪费以及这部分可以减少；A的词没有遮挡。当时把减少无效广告支出与降低运营成本相连，第一轮保留A，并在其余三项排除后选择了A。<\/p>\n<p><strong>选项类型：局部推断。<\/strong><\/p>\n<p>命题人把“减少被浪费的广告预算”概括为降低广告商的运营成本。广告投入是经营支出的一部分，定向投放减少无效投入，因此这里是在同一经济作用上作概括，没有声称所有成本项目都会下降。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>An old saying has it that half of all advertising budgets are wasted – the trouble is, no one knows which half.<\/p>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q26-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第一段表明，行为广告有助于广告商降低运营成本。<\/p>\n<\/blockquote>\n<p>题干的<code>behavioural ads<\/code>对应第一段末句，A的<code>costs<\/code>对应段首的<code>advertising budgets<\/code>；要沿着预算浪费为何能减少的解释向后读。<\/p>\n<p>第一句指出广告预算存在浪费；第二句说互联网时代这一浪费比例在理论上可以减少；第三句补出原因，即依据搜索、点击和发言把广告投向更可能购买的人。三句共同提供了“减少无效投放支出”的推断基础。<\/p>\n<p>原文没有承诺每家公司的实际总开支都立即下降。A接在<code>help advertisers to<\/code>之后，是行为广告可带来的作用；减少广告这一经营环节中的无效成本，足以支持它，不需要另证工资、房租等所有成本都降低。<\/p>\n<p>A把预算浪费的减少概括为经营成本的节约，主体仍是广告商，方向仍是无效支出的下降。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q26-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<p>作者先说浪费比例可下降，再用精准投放解释这种节约从何而来。<\/p>\n<\/blockquote>\n<p>这里往下写的是“怎样把同样的广告投入更有效地用到潜在买家身上”，没有离开广告预算的效率问题。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>By directing ads at likely buyers, advertisers can reduce spending that would otherwise be wasted.<\/p>\n<p>通过把广告投向可能购买的人，广告商可以减少本来会被浪费的支出。<\/p>\n<\/blockquote>\n<p>A所需要的解释正是原文已有的推进：先指出可减少的浪费，再说明定向投放为何能减少它。假设句只是把两句之间的经济关系说开，并未增加一种新的服务或竞争效果。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q26-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入26题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在审视微软“更多控制权”的声明，不能单独判断行为广告在第一段给广告商带来的具体成本作用。<\/p>\n<\/blockquote>\n<p>A实际说的是：<\/p>\n<blockquote>\n<p>lower their operational costs<br>降低运营成本<\/p>\n<\/blockquote>\n<p>对微软声明持怀疑态度，不等于否认行为广告对广告商的商业价值。A说的是广告商的成本，第30题判断的是作者对微软表态的态度，二者对象不同；本项最终仍要根据“advertising budgets are wasted”和“this fraction can be much reduced”判断。局部原文给出了减少浪费的依据，A与这层事实相符。<\/p>\n<p><strong>复盘判断：A正确。<\/strong><\/p>\n<\/section>"},{"title":"B. ease competition among themselves","raw":"### B. ease competition among themselves\n\n> 缓和彼此之间的竞争\n\n**做题模式中的状态：** 当时B完整显示。做题时把它接回题干，发现原文写广告商向潜在消费者精准投放，B却写广告商彼此的竞争；第一轮因此排除B，后续没有改判。\n\n**错误类型：第三类——无中生有。**\n\n选项借用了企业都在争取潜在买家的 向潜在消费者精准投放，B却写广告商彼此的竞争；第一轮因此排除B，后续没有改判。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>选项借用了企业都在争取潜在买家的商业场景，引导我们把广告投放更有效继续想成竞争得到缓和。原文只写单个企业怎样找到更可能购买的人，没有建立企业相互竞争减弱这一结果。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q26-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第一段表明，行为广告有助于广告商缓和彼此之间的竞争。<\/p>\n<\/blockquote>\n<p><code>behavioural ads<\/code>定位到第一段末句，<code>among themselves<\/code>则要求检查原文有没有从企业与买家的关系转向企业彼此的关系。<\/p>\n<p>末句中<code>companies<\/code>是投放者，<code>those most likely to buy<\/code>是广告要瞄准的消费者，搜索、点击和发言是识别对象的信息。句子把这些信息连到更准确的投放，没有连到同行竞争。<\/p>\n<p>提高一家公司的获客效率，既不必然缓和也不必然加剧同行竞争；原文没有选择其中任何一种后果。不能把现实中可能出现的竞争变化当作文章已经说明的广告作用。<\/p>\n<p>B额外补出了“投放更精准，所以广告商之间竞争更缓和”这一关系，原文支持到精准定位买家为止。<\/p>\n<\/section>"},{"title":"B. ease competition among themselves","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> An old saying has it that half of all advertising budgets are wasted – the trouble is, no one knows which half.\n>\n> By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.\n>\n> 作者提出预算浪费的问题，随后给出依据网络行为寻找潜在买家的解决办法。\n\n从问题到办法，文章始终解释广告支出如何更有效，而不是解释同行如何调整竞争关系。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Behavioural ads help advertisers compete less intensely with one another.\n>\n> 行为广告有助于广告商降低彼此竞争的激烈程度。\n\n如果B成立，作者至少要让精准投放与同行竞争减弱相连。实际后文转向追踪是否须取得用户许可，没有补出竞争缓和的结果；假设句所需的同行关系，在真实推进中缺席。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题 B选项","focus":[93,190,803,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":26,"option":"B","cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q26-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-B-0\"><blockquote>\n<p>缓和彼此之间的竞争<\/p>\n<\/blockquote>\n<p>< services\n\n> 提供更好的在线服务\n\n**做题模式中的状态：** 当时D完整显示。做题时已经区分广告投放与在线服务改进，认为两者不能仅因都发生在网络上就等同；第一轮排除D，此后未改判。\n\n**错误类型：第三类——无中生有。**\n\n选项借用互联网环境和精准广告的积极作用，把广告商减少无效投放进一步写成向用户提供更好的在线服务。原文没有说明某种在线服务怎样因行为广告得到改进，服务质量的提升是补出来的。\n\n**出处：**\n\n> In the internet age, at least in theory, this fraction can be much reduced.\n>\n> By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题 D选项","focus":[93,360,678,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":26,"option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q26-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-D-0\"><blockquote>\n<p>提供更好的在线服务<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示。做题时已经区分广告投放与在线服务改进，认为两者不能仅因都发生在网络上就等同；第一轮排除D，此后未改判。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>选项借用互联网环境和精准广告的积极作用，把广告商减少无效投放进一步写成向用户提供更好的在线服务。原文没有说明某种在线服务怎样因行为广告得到改进，服务质量的提升是补出来的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. provide better online services","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 第一段表明，行为广告有助于广告商提供更好的在线服务。\n\n`online`与原文的`internet age`、`say online`对应，但题干问行为广告帮助广告商实现什么，决定答案的要核对`provide better services`这一动作。\n\n作者说互联网使广告商有机会减少预算浪费，具体方式是观察人们在网上的行为，将广告投给高购买概率的人。这里提供的信息是广告投放效率，而非用户所使用服务的质量。\n\n定向广告在现实中可能让用户看到更相关的信息，但第一段没有把这种可能性写成在线服务改善。D不能只凭“更精准”中的正面色彩，就把受益对象和评价指标换成服务质量。\n\nD增加了广告商改善在线服务的结果，原文能坐实的是广告预算如何减少浪费，二者不是同一命题。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题 D选项","focus":[93,360,678,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":26,"option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q26-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-D-0\"><blockquote>\n<p>提供更好的在线服务<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示。做题时已经区分广告投放与在线服务改进，认为两者不能仅因都发生在网络上就等同；第一轮排除D，此后未改判。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>选项借用互联网环境和精准广告的积极作用，把广告商减少无效投放进一步写成向用户提供更好的在线服务。原文没有说明某种在线服务怎样因行为广告得到改进，服务质量的提升是补出来的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q26-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第一段表明，行为广告有助于广告商提供更好的在线服务。<\/p>\n<\/blockquote>\n<p><code>online<\/code>与原文的<code>internet age<\/code>、<code>say online<\/code>对应，但题干问行为广告帮助广告商实现什么，决定答案的要核对<code>provide better services<\/code>这一动作。<\/p>\n<p>作者说互联网使广告商有机会减少预算浪费，具体方式是观察人们在网上的行为，将广告投给高购买概率的人。这里提供的信息是广告投放效率，而非用户所使用服务的质量。<\/p>\n<p>定向广告在现实中可能让用户看到更相关的信息，但第一段没有把这种可能性写成在线服务改善。D不能只凭“更精准”中的正面色彩，就把受益对象和评价指标换成服务质量。<\/p>\n<p>D增加了广告商改善在线服务的结果，原文能坐实的是广告预算如何减少浪费，二者不是同一命题。<\/p>\n<\/section>"},{"title":"D. provide better online services","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In the internet age, at least in theory, this fraction can be much reduced.\n>\n> By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.\n>\n> 实际文章解释数据怎样帮助企业投放行为广告，服务于减少预算浪费的问题。\n\n第2段顺势追问追踪权限，讨论的是广告商获取这种信息是否需要明确许可。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Behavioural advertising helps advertisers improve the online services they provide.\n>\n> 行为广告有助于广告商改善自己提供的在线服务。\n\n若D成立，文章至少需把行为广告与所提供服务的改善接上。实际从投放效率转到追踪权限，没有展开任何服务改进；假设句新增的服务效果无法由这条推进得到。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"question vide.<\/p>\n<p>行为广告有助于广告商改善自己提供的在线服务。<\/p>\n<\/blockquote>\n<p>若D成立，文章至少需把行为广告与所提供服务的改善接上。实际从投放效率转到追踪权限，没有展开任何服务改进；假设句新增的服务效果无法由这条推进得到。<\/p>\n<\/section>"},{"title":"D. provide better online services","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> skepticism  \n> 怀疑\n\n把这个主旨直接代入26题题干：\n\n> 全文主旨只能确认作者审视微软关于消费者控制权的声明，不能判断行为广告是否改善广告商提供的在线服务。\n\n但D实际说的是：\n\n> provide better online services  \n> 提供更好的在线服务\n\n“给消费者更多控制权”与“提供更好的在线服务”也不是同一句话；不能用微软的声明替行为广告证明服务改进。本项最终仍要根据“this fraction can be much reduced”和后面的定向投放句判断，原文给出了节约无效投入的作用，没有D声称的服务效果。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题 D选项","focus":[93,360,678,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":26,"option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q26-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-D-0\"><blockquote>\n<p>提供更好的在线服务<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示。做题时已经区分广告投放与在线服务改进，认为两者不能仅因都发生在网络上就等同；第一轮排除D，此后未改判。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>选项借用互联网环境和精准广告的积极作用，把广告商减少无效投放进一步写成向用户提供更好的在线服务。原文没有说明某种在线服务怎样因行为广告得到改进，服务质量的提升是补出来的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q26-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第一段表明，行为广告有助于广告商提供更好的在线服务。<\/p>\n<\/blockquote>\n<p><code>online<\/code>与原文的<code>internet age<\/code>、<code>say online<\/code>对应，但题干问行为广告帮助广告商实现什么，决定答案的要核对<code>provide better services<\/code>这一动作。<\/p>\n<p>作者说互联网使广告商有机会减少预算浪费，具体方式是观察人们在网上的行为，将广告投给高购买概率的人。这里提供的信息是广告投放效率，而非用户所使用服务的质量。<\/p>\n<p>定向广告在现实中可能让用户看到更相关的信息，但第一段没有把这种可能性写成在线服务改善。D不能只凭“更精准”中的正面色彩，就把受益对象和评价指标换成服务质量。<\/p>\n<p ______.  \n> 第三段中的“the industry”指什么？\n\n### 题型\n\n这是一道指代题。题干限定第3段，要求找出`the industry`所指的行业主体。既要向前寻找相关对象，也要把候选对象代入`responding to DNT requests`，检查谁负责响应用户的拒绝追踪请求。离指代词最近的名词，不必就是能执行这个动作的主体。\n\n### 核心出处\n\n> In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.\n>\n> Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.\n>\n> In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.\n\n第一句交代用户通过浏览器向广告商表达不愿被追踪，第二句交代浏览器提供DNT功能，第三句转到FTC与数字广告联盟商定如何回应这些请求。三个句子分别写发出请求的渠道和处理请求的一方，指代判断要保留这个分工。\n\n本题标准答案为D，采用的是从前一句连续列举的Internet Explorer、Safari和Chrome，回指互联网浏览器开发者这一解释。不过，`responding to DNT requests`在执行语义上也与广告商有关，第6段确实讨论广告商如何回应。因此，这里不能把“浏览器提供DNT”说成“浏览器替网站执行停止追踪”；我们按本题给定的回指解释区分选项，同时保留两种角色的真实分工。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[18,528,966,410],"sourceW":1711,"sourceH":2572},"meta":{"kind":"question","question":27},"level":2,"html":"<blockquote>\n<p>“The industry” (Para. 3) refers to ______.<br>第三段中的“the industry”指什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道指代题。题干限定第3段，要求找出<code>the industry<\/code>所指的行业主体。既要向前寻找相关对象，也要把候选对象代入<code>responding to DNT requests<\/code>，检查谁负责响应用户的拒绝追踪请求。离指代词最近的名词，不必就是能执行这个动作的主体。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.<\/p>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<p>第一句交代用户通过浏览器向广告商表达不愿被追踪，第二句交代浏览器提供DNT功能，第三句转到FTC与数字广告联盟商定如何回应这些请求。三个句子分别写发出请求的渠道和处理请求的一方，指代判断要保留这个分工。<\/p>\n<p>本题标准答案为D，采用的是从前一句连续列举的Internet Explorer、Safari和Chrome，回指互联网浏览器开发者这一解释。不过，<code>responding to DNT requests<\/code>在执行语义上也与广告商有关，第6段确实讨论广告商如何回应。因此，这里不能把“浏览器提供DNT”说成“浏览器替网站执行停止追踪”；我们按本题给定的回指解释区分选项，同时保留两种角色的真实分工。<\/p>\n"},{"title":"A. online advertisers","raw":"### A. online advertisers\n\n> 在线广告商\n\n**做题模式中的状态：** 当时第3段的`proposed`和`cracking`被显示为`[xxx]`，A完整显示。做题时将前句连续列举的浏览器视为`the industry`的回指范围，把广告商看作接收用户意愿的一方，因而第一轮排除A；后续保持这一结果。\n\n**错误类型：第一类——歪曲原意。**\n\n广告商确实是第3段写到的主体，用户会向它们表示不想被追踪。按本题标准采用的回指解释，`the industry`承接近前列举的浏览器产品及其开发者；A把这一回指对象换成了同段另一类主体。需要分清的是标准回指范围，不能否认广告商与回应DNT在现实语义上的联系。\n\n**出处：**\n\n> In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.\n>\n> Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.\n>\n> In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题 A选项","focus":[93,615,436,58],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":27,"option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q27-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-A-0\"><blockquote>\n<p>在线广告商<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第3段的<code>proposed<\/code>和<code>cracking<\/code>被显示为<code>[xxx]<\/code>，A完整显示。做题时将前句连续列举的浏览器视为<code>the industry<\/code>的回指范围，把广告商看作接收用户意愿的一方，因而第一轮排除A；后续保持这一结果。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>广告商确实是第3段写到的主体，用户会向它们表示不想被追踪。按本题标准采用的回指解释，<code>the industry<\/code>承接近前列举的浏览器产品及其开发者；A把这一回指对象换成了同段另一类主体。需要分清的是标准回指范围，不能否认广告商与回应DNT在现实语义上的联系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.<\/p>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. online advertisers","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第三段中的“the industry”指在线广告商。\n\n题干直接圈定`the industry`。前面的`advertisers`确实与A同词，但两者中间还有Internet Explorer、Safari、Chrome这组连续列举，本题按这组浏览器产品判断行业所指。\n\n第一句中的广告商是用户表示“不想被追踪”的对象；第二句说明几种浏览器已提供或将提供DNT。标准解读将末句行业的回指落在第二句的浏览器领域，而不是第一句的广告接收对象上。\n\n仅从`responding`的动作看，A具有语义关联，不能断言广告商“不可能响应DNT”。第6段还明确写广告商如何回应。这里排除A所依赖的是本题标准选择的前文回指关系，而非广告商没有这种业务行为。\n\n在标准回指解释下，A把浏览器领域换成在线广告领域；真实的广告商角色不能直接取代本题指定的前指对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题 A选项","focus":[93,615,436,58],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":27,"option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q27-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-A-0\"><blockquote>\n<p>在线广告商<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第3段的<code>proposed<\/code>和<code>cracking<\/code>被显示为<code>[xxx]<\/code>，A完整显示。做题时将前句连续列举的浏览器视为<code>the industry<\/code>的回指范围，把广告商看作接收用户意愿的一方，因而第一轮排除A；后续保持这一结果。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>广告商确实是第3段写到的主体，用户会向它们表示不想被追踪。按本题标准采用的回指解释，<code>the industry<\/code>承接近前列举的浏览器产品及其开发者；A把这一回指对象换成了同段另一类主体。需要分清的是标准回指范围，不能否认广告商与回应DNT在现实语义上的联系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.<\/p>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q27-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第三段中的“the industry”指在线广告商。<\/p>\n<\/blockquote>\n<p>题干直接圈定<code>the industry<\/code>。前面的<code>advertisers<\/code>确实与A同词，但两者中间还有Internet Explorer、Safari、Chrome这组连续列举，本题按这组浏览器产品判断行业所指。<\/p>\n<p>第一句中的广告商是用户表示“不想被追踪”的对象；第二句说明几种浏览器已提供或将提供DNT。标准解读将末句行业的回指落在第二句的浏览器领域，而不是第一句的广告接收对象上。<\/p>\n<p>仅从<code>responding<\/code>的动作看，A具有语义关联，不能断言广告商“不可能响应DNT”。第6段还明确写广告商如何回应。这里排除A所依赖的是本题标准选择的前文回指关系，而非广告商没有这种业务行为。<\/p>\n<p>在标准回指解释下，A把浏览器领域换成在线广告领域；真实的广告商角色不能直接取代本题指定的前指对象。<\/p>\n<\/section>"},{"title":"A. online advertisers","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.\n>\n> In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.\n>\n> 实际文序先连续列举浏览器产品，再用“行业”这一集合名称继续叙述有关DNT的安排。\n\n这一相邻文序是标准D所采用的依据。不过，末句也出现数字广告联盟并讨论响应请求，说明角色判断不能只靠把其他主体从段落中抹掉。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The online advertising industry would get cracking on responding to DNT requests.\n>\n> 在线广告行业将着手回应DNT请求。\n\n如果作者把行业明确限定为在线广告业，A的所指便成立。实际文字没有补出这个行业修饰语，标准解读依前句浏览器列表选D。假设句澄清的是行业所指，不是增造广告商响应DNT的能力；动作关联本身不足以消除本题的回指歧义。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题 A选项","focus":[93,615,436,58],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":27,"option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q27-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-A-0\"><blockquote>\n<p>在线广告商<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第3段的<code>proposed<\/code>和<code>cracking<\/code>被显示为<code>[xxx]<\/code>，A完整显示。做题时将前句连续列举的浏览器视为<code>the industry<\/code>的回指范围，把广告商看作接收用户意愿的一方，因而第一轮排除A；后续保持这一结果。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>广告商确实是第3段写到的主体，用户会向它们表示不想被追踪。按本题标准采用的回指解释，<code>the industry<\/code>承接近前列举的浏览器产品及其开发者；A把这一回指对象换成了同段另一类主体。需要分清的是标准回指范围，不能否认广告商与回应DNT在现实语义上的联系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.<\/p>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q27-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第三段中的“the industry”指在线广告商。<\/p>\n<\/blockquote>\n<p>题干直接圈定<code>the industry<\/code>。前面的<code>advertisers<\/code>确实与A同词，但两者中间还有Internet Explorer、Safari、Chrome这组连续列举，本题按这组浏览器产品判断行业所指。<\/p>\n<p>第一句中的广告商是用户表示“不想被追踪”的对象；第二句说明几种浏览器已提供或将提供DNT。标准解读将末句行业的回指落在第二句的浏览器领域，而不是第一句的广告接收对象上。<\/p>\n<p>仅从<code>responding<\/code>的动作看，A具有语义关联，不能断言广告商“不可能响应DNT”。第6段还明确写广告商如何回应。这里排除A所依赖的是本题标准选择的前文回指关系，而非广告商没有这种业务行为。<\/p>\n<p>在标准回指解释下，A把浏览器领域换成在线广告领域；真实的广告商角色不能直接取代本题指定的前指对象。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q27-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<p>实际文序先连续列举浏览器产品，再用“行业”这一集合名称继续叙述有关DNT的安排。<\/p>\n<\/blockquote>\n<p>这一相邻文序是标准D所采用的依据。不过，末句也出现数字广告联盟并讨论响应请求，说明角色判断不能只靠把其他主体从段落中抹掉。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The online advertising industry would get cracking on responding to DNT requests.<\/p>\n<p>在线广告行业将着手回应DNT请求。<\/p>\n<\/blockquote>\n<p>如果作者把行业明确限定为在线广告业，A的所指便成立。实际文字没有补出这个行业修饰语，标准解读依前句浏览器列表选D。假设句澄清的是行业所指，不是增造广告商响应DNT的能力；动作关联本身不足以消除本题的回指歧义。<\/p>\n<\/section>"},{"title":"A. online advertisers","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> skepticism  \n> 怀疑\n\n把这个主旨直接代入27题题干：\n\n> 全文主旨只能确认作者对微软“更多控制权”的声明持怀疑态度，不能判断第3段“the industry”究竟回指哪一个行业。\n\n但A实际说的是：\n\n> online advertisers  \n> 在线广告商\n\n作者怀疑微软的解释，不能推出某个名词必指广告商或浏览器开发者。A确实与追踪执行有关，但本题最终仍要按前句“Microsoft’s Internet Explorer and Apple’s Safari”及“Google’s Chrome”的列举所构成的标准回指范围判断，不能让态度主旨代替指代分析。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题 A选项","focus":[93,615,436,58],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":27,"option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q27-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-A-0\"><blockquote>\n<p>在线广告商<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第3段的<code>proposed<\/code>和<code>cracking<\/code>被显示为<code>[xxx]<\/code>，A完整显示。做题时将前句连续列举的浏览器视为<code>the industry<\/code>的回指范围，把广告商看作接收用户意愿的一方，因而第一轮排除A；后续保持这一结果。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>广告商确实是第3段写到的主体，用户会向它们表示不想被追踪。按本题标准采用的回指解释，<code>the industry<\/code>承接近前列举的浏览器产品及其开发者；A把这一回指对象换成了同段另一类主体。需要分清的是标准回指范围，不能否认广告商与回应DNT在现实语义上的联系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.<\/p>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the D
