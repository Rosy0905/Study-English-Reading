告的责任。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q29-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入29题题干：<\/p>\n<blockquote>\n<p>全文主旨只能提示微软“更多控制权”的声明需要接受实际执行的检验，不能判断广告商是否负有提供行为广告的特定义务。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>Advertisers are obliged to offer behavioural ads.<br>广告商有义务提供行为广告。<\/p>\n<\/blockquote>\n<p>D把执行疑问变成一项广告提供义务，怀疑态度既不能创设也不能取消这种义务。本项最终仍要根据“does not oblige anyone to stop tracking”判断，原文没有D所说的肯定义务与提供动作。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"29题结论","raw":"### 29题结论\n\n> **29. B. DNT may not serve its intended purpose.**\n\nA把部分公司承诺改成对广告商愿意实施的概括态度。\n\nB把有人可能忽略信号继续追踪概括成DNT目的可能落空。\n\nC由用户意愿难以分辨额外推出DNT人气正在下降。\n\nD把不强制停止追踪改成必须提供行为广告，换了肯否和动作。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[18,1550,1259,409],"sourceW":1711,"sourceH":2572},"meta":{"kind":"conclusion","question":29},"level":3,"html":"<blockquote>\n<p><strong>29. B. DNT may not serve its intended purpose.<\/strong><\/p>\n<\/blockquote>\n<p>A把部分公司承诺改成对广告商愿意实施的概括态度。<\/p>\n<p>B把有人可能忽略信号继续追踪概括成DNT目的可能落空。<\/p>\n<p>C由用户意愿难以分辨额外推出DNT人气正在下降。<\/p>\n<p>D把不强制停止追踪改成必须提供行为广告，换了肯否和动作。<\/p>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"section":"第四鸟 · 新题型","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n## 段落与全文逻辑框架\n\n**逻辑层次1：网络时代广告的新机遇**（段落1背景介绍） 传统广告困境：（一半预算被浪费 + 不知道是哪一半）→ 网络时代的解决方案：【通过追踪用户行为（搜索、点击、言论）→ 投放\"行为\"广告给最可能购买的人 → 理论上可减少浪费】\n\n↓（引出核心争议）\n\n**逻辑层次2：追踪权限的争议**（段落2-3规则制定） 核心问题：广告商应该假设用户乐意被追踪 // 还是需要明确许可？→ FTC的回应：【2010年提议DNT选项 → 各浏览器陆续支持（IE、Safari已有，Chrome将有）→ 2月份FTC与DAA达成一致：行业将响应DNT请求】\n\n↓（冲突爆发）\n\n**逻辑层次3：微软引发的争议**（段落4-5利益冲突） 导火索：5月31日微软宣布IE10将默认开启DNT → 广告商的恐慌：【人性使然大多数人使用默认设置 → 追踪关闭后将保持关闭】→ 行业观点（Bob Liodice）：【消费者不会受益：（广告数量不会减少 + 只会得到针对性更差的广告）】\n\n↓（实施困境）\n\n**逻辑层次4：DNT的实施困境**（段落6执行问题） 法律约束缺失：收到DNT信号不强制停止追踪 → 判断困难：（无法区分真正反对vs使用默认设置）→ 可能结果：一些广告商可能忽略DNT信号继续追踪\n\n↓（动机分析）\n\n**逻辑层次5：微软动机的不确定性**（段落7深层疑问） 微软的矛盾：（自己也有广告业务 + 将遵守DNT）→ 可能动机：【打击依赖广告的谷歌？（但方法间接 + 不保证成为规范）// DNT作为卖点？（似乎不明显）】→ 官方说法：（\"消费者应该有更多控制权\"）→ 作者质疑：真的这么简单吗？\n\n↑（全文主旨）\n\n全文核心观点：网络广告的精准投放依赖用户追踪，但微软将DNT设为默认引发了行业恐慌。这一举措的效果和动机都充满不确定性，可能无法真正保护用户隐私，反而可能影响广告的精准度。\n\n## 小标题题\n\nRead the following text and choose the most suitable heading from the list A–G for each numbered section (41–45). There are two extra headings.\n\n[A] A default setting that alarms the advertising industry\n\n[B] The commercial value of detailed online information\n\n[C] A legally guaranteed end to online tracking\n\n[D] Unanswered questions about Microsoft’s strategy\n\n[E] Addressing permission through browser tools and privacy rules\n\n[F] Fewer advertisements as the benefit of a new default\n\n[G] An uncertain response to signals against tracking\n\n### 41. ______\n\nAn old saying holds that half of all advertising budgets are wasted, though no one knows which half. The internet could, in theory, reduce that waste. By observing what people search for, click on and say online, firms can direct behavioural advertisements towards those most likely to buy.\n\nRecent deals show how valuable this detailed information has become. On May 23rd Oracle announced that it was buying Vitrue, which helps companies manage social-media marketing, for a reported $300m. On June 5th it added Collective Intellect, which analyses comments about companies on social networks, for an undisclosed sum. A day earlier Salesforce.com had announced that it would pay $689m for Buddy Media, a Vitrue competitor. Buddy would fit alongside Radian 6, a social-media monitoring business for which Salesforce had paid $326m the previous year. These purchases concern services that help firms use or understand activity online.\n\n### 42. ______\n\nThe value of such information raises a longstanding question: may advertisers assume that people are willing to be tracked and sent behavioural advertisements, or should explicit permission be required? Many users scarcely think about electronic observation while browsing, whereas some strongly object.\n\nIn December 2010 America’s Federal Trade Commission proposed a “do not track”, or DNT, option for browsers, allowing users to indicate that they did not wish to be followed. Firefox, Internet Explorer and Safari offered the option, and Chrome was due to do so during the year. In February the FTC and the Digital Advertising Alliance, a group of industry bodies, agreed that the industry would start responding to DNT requests. The European Union also introduced a rule requiring websites to ask before using cookies to collect information about users’ behaviour. These developments addressed how a user’s wishes could enter the tracking process.\n\n### 43. ______\n\nOn May 31st Microsoft provoked a row by announcing that Internet Explorer 10 would have DNT switched on by default. The browser was due to appear with Windows 8, the next version of the company’s operating system. This went beyond offering a setting that users could choose to activate.\n\nAdvertisers were horrified because most people tend to keep default settings. Few users were then switching DNT on, but if tracking were switched off at the start, it was likely to remain off. Bob Liodice, chief executive of the Association of National Advertisers, argued that consumers would be worse off if advertisers could not collect information about their preferences. He did not predict a fall in the number of advertisements: he said the advertisements would become less meaningful and less well targeted. The dispute therefore involved the effect of the initial setting on access to information and the relevance of advertising.\n\n### 44. ______\n\nWhat advertisers would actually do in response was still unclear. Receiving a DNT signal did not oblige a company to stop tracking, although some businesses, including Twitter, had promised to respect it. A signal and a guaranteed change in behaviour were therefore not the same thing.\n\nMicrosoft’s default created a further difficulty for anyone interpreting that signal. It might express a user’s real objection to behavioural advertisements, or it might merely reflect an unchanged browser setting. Unable to distinguish these cases, some advertisers might ignore the signal and continue tracking. This was a possible response, not a claim that every firm would refuse all requests. The issue was whether the request would bring about the intended conduct when its meaning and the response to it were uncertain.\n\n### 45. ______\n\nMicrosoft’s reasons for acting alone were also unclear. It had an advertising business of its own, which it said would comply with DNT requests, although it was still deciding how to do so. If the company meant to trouble Google, which relied almost entirely on advertising, it had chosen an indirect route: there was no guarantee that DNT by default would become standard.\n\nNor did DNT appear an obviously major selling point for Windows 8, even though Microsoft had previously compared some products favourably with Google’s on privacy. Brendon Lynch, its chief privacy officer, said the company believed consumers should have more control. Could the explanation really be that simple?","context":{"mode":"newtype","kind":"smallTitle","current":"","label":"小标题题"},"meta":{},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：网络时代广告的新机遇<\/strong>（段落1背景介绍） 传统广告困境：（一半预算被浪费 + 不知道是哪一半）→ 网络时代的解决方案：【通过追踪用户行为（搜索、点击、言论）→ 投放&quot;行为&quot;广告给最可能购买的人 → 理论上可减少浪费】<\/p>\n<p>↓（引出核心争议）<\/p>\n<p><strong>逻辑层次2：追踪权限的争议<\/strong>（段落2-3规则制定） 核心问题：广告商应该假设用户乐意被追踪 // 还是需要明确许可？→ FTC的回应：【2010年提议DNT选项 → 各浏览器陆续支持（IE、Safari已有，Chrome将有）→ 2月份FTC与DAA达成一致：行业将响应DNT请求】<\/p>\n<p>↓（冲突爆发）<\/p>\n<p><strong>逻辑层次3：微软引发的争议<\/strong>（段落4-5利益冲突） 导火索：5月31日微软宣布IE10将默认开启DNT → 广告商的恐慌：【人性使然大多数人使用默认设置 → 追踪关闭后将保持关闭】→ 行业观点（Bob Liodice）：【消费者不会受益：（广告数量不会减少 + 只会得到针对性更差的广告）】<\/p>\n<p>↓（实施困境）<\/p>\n<p><strong>逻辑层次4：DNT的实施困境<\/strong>（段落6执行问题） 法律约束缺失：收到DNT信号不强制停止追踪 → 判断困难：（无法区分真正反对vs使用默认设置）→ 可能结果：一些广告商可能忽略DNT信号继续追踪<\/p>\n<p>↓（动机分析）<\/p>\n<p><strong>逻辑层次5：微软动机的不确定性<\/strong>（段落7深层疑问） 微软的矛盾：（自己也有广告业务 + 将遵守DNT）→ 可能动机：【打击依赖广告的谷歌？（但方法间接 + 不保证成为规范）// DNT作为卖点？（似乎不明显）】→ 官方说法：（&quot;消费者应该有更多控制权&quot;）→ 作者质疑：真的这么简单吗？<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：网络广告的精准投放依赖用户追踪，但微软将DNT设为默认引发了行业恐慌。这一举措的效果和动机都充满不确定性，可能无法真正保护用户隐私，反而可能影响广告的精准度。<\/p>\n"},{"title":"小标题题 · 41题","level":3,"section":"第四鸟 · 新题型","raw":"### 41题解析\n\n**答案：B — The commercial value of detailed online information。** 中文：详细网络信息的商业价值。\n\n这一部分整体在说明，追踪网络行为为什么值得企业投入：先解释广告投放如何减少浪费，再用多宗收购展示企业对相关服务的重视。交易名称、日期和价格都服务于“信息为什么有价值”这个中心。\n\n开头的 reduce that waste 把行为信息接到广告效率；第二段首句 Recent deals show how valuable this detailed information has become 明确总领收购案例。结尾又把这些购买归到 use or understand activity online，没有改谈消费者许可。\n\n段内推进链：传统广告浪费难以识别 → 网络行为帮助锁定潜在买家 → 相关信息具有价值 → Oracle与Salesforce购买营销和监测业务 → 交易共同证明这种商业需求。\n\n标题中的 detailed online information 对应搜索、点击、言论及社交媒体活动；commercial value 对应广告投放用途和企业付钱购买的服务。标题概括的是几项交易共同支持的判断，不要求把每个公司名写进标题。\n\n最强干扰项是E。监测用户确实会牵涉隐私，但这一部分还没有讨论许可程序、浏览器选择或隐私规则；用Addressing permission作标题会把下一节的问题提前放过来，也解释不了本节反复列举收购的作用。\n\n**最终答案：41选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"41","label":"小标题题"},"meta":{},"html":"<h3>41题解析<\/h3>\n<p><strong>答案：B — The commercial value of detailed online information。<\/strong> 中文：详细网络信息的商业价值。<\/p>\n<p>这一部分整体在说明，追踪网络行为为什么值得企业投入：先解释广告投放如何减少浪费，再用多宗收购展示企业对相关服务的重视。交易名称、日期和价格都服务于“信息为什么有价值”这个中心。<\/p>\n<p>开头的 reduce that waste 把行为信息接到广告效率；第二段首句 Recent deals show how valuable this detailed information has become 明确总领收购案例。结尾又把这些购买归到 use or understand activity online，没有改谈消费者许可。<\/p>\n<p>段内推进链：传统广告浪费难以识别 → 网络行为帮助锁定潜在买家 → 相关信息具有价值 → Oracle与Salesforce购买营销和监测业务 → 交易共同证明这种商业需求。<\/p>\n<p>标题中的 detailed online information 对应搜索、点击、言论及社交媒体活动；commercial value 对应广告投放用途和企业付钱购买的服务。标题概括的是几项交易共同支持的判断，不要求把每个公司名写进标题。<\/p>\n<p>最强干扰项是E。监测用户确实会牵涉隐私，但这一部分还没有讨论许可程序、浏览器选择或隐私规则；用Addressing permission作标题会把下一节的问题提前放过来，也解释不了本节反复列举收购的作用。<\/p>\n<p><strong>最终答案：41选B。<\/strong><\/p>\n"},{"title":"小标题题 · 42题","level":3,"section":"第四鸟 · 新题型","raw":"### 42题解析\n\n**答案：E — Addressing permission through browser tools and privacy rules。** 中文：通过浏览器工具与隐私规则回应许可问题。\n\n这一部分先提出是否应获得明确许可的争议，再说明用户表达意愿的浏览器工具及相关规则。它把“用户是否同意”落实到表达和响应途径，尚未讨论微软改变默认值后的反应。\n\n首段把 assume 与 explicit permission 对立起来；第二段的 allowing users to indicate 说明DNT的用途，后面的 responding to DNT requests 和 ask before using cookies 分别补充行业响应与欧盟规则。结尾回收为用户意愿怎样进入追踪过程。\n\n段内推进链：行为信息带来许可争论 → 用户态度不一 → DNT让反对者表达意愿 → 浏览器陆续支持 → 行业承诺响应并有地区规则要求事先询问。\n\n标题中的 Addressing permission 对应开头的permission问题；browser tools 对应DNT选项；privacy rules 对应欧盟使用cookies前询问的要求。它同时覆盖争议和制度回应，不把某一地区的具体要求扩大成全球保证。\n\n最强干扰项是C。文中有监管机构和欧盟规则，容易让人想到法律保障，但既没有说所有网络追踪都必须停止，也没有把所有DNT信号写成强制命令。A legally guaranteed end把规则的对象与效力扩大了。\n\n**最终答案：42选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"42","label":"小标题题"},"meta":{},"html":"<h3>42题解析<\/h3>\n<p><strong>答案：E — Addressing permission through browser tools and privacy rules。<\/strong> 中文：通过浏览器工具与隐私规则回应许可问题。<\/p>\n<p>这一部分先提出是否应获得明确许可的争议，再说明用户表达意愿的浏览器工具及相关规则。它把“用户是否同意”落实到表达和响应途径，尚未讨论微软改变默认值后的反应。<\/p>\n<p>首段把 assume 与 explicit permission 对立起来；第二段的 allowing users to indicate 说明DNT的用途，后面的 responding to DNT requests 和 ask before using cookies 分别补充行业响应与欧盟规则。结尾回收为用户意愿怎样进入追踪过程。<\/p>\n<p>段内推进链：行为信息带来许可争论 → 用户态度不一 → DNT让反对者表达意愿 → 浏览器陆续支持 → 行业承诺响应并有地区规则要求事先询问。<\/p>\n<p>标题中的 Addressing permission 对应开头的permission问题；browser tools 对应DNT选项；privacy rules 对应欧盟使用cookies前询问的要求。它同时覆盖争议和制度回应，不把某一地区的具体要求扩大成全球保证。<\/p>\n<p>最强干扰项是C。文中有监管机构和欧盟规则，容易让人想到法律保障，但既没有说所有网络追踪都必须停止，也没有把所有DNT信号写成强制命令。A legally guaranteed end把规则的对象与效力扩大了。<\/p>\n<p><strong>最终答案：42选E。<\/strong><\/p>\n"},{"title":"小标题题 · 43题","level":3,"section":"第四鸟 · 新题型","raw":"### 43题解析\n\n**答案：A — A default setting that alarms the advertising industry。** 中文：令广告行业恐慌的默认设置。\n\n这一部分的中心是微软把DNT设为默认后为什么引发行业反对。前段交代改动，后段解释默认惯性和广告相关性方面的担忧；Liodice的话属于行业对后果的判断。\n\n第一段的 DNT switched on by default 与 went beyond offering a setting 标明变化；第二段用 because most people tend to keep default settings 解释恐慌，再用 did not predict a fall in the number 限定行业声称的影响。\n\n段内推进链：微软宣布默认开启DNT → 用户不必主动启用 → 多数人保留默认状态 → 广告商担心失去偏好信息 → 行业声称广告会更不相关而非更少。\n\n标题中的 default setting 对应首段真正的新举措；alarms 对应horrified及其原因；advertising industry 对应广告商与协会负责人。三个部分共同概括触发事件和反应主体。\n\n最强干扰项是F。它抓到消费者与广告的关系，却把“广告针对性下降”改写成“广告数量减少”，还把行业担忧写成已实现的benefit。文中明确否认数量减少的推断，因此不能用这一标题统摄本节。\n\n**最终答案：43选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"43","label":"小标题题"},"meta":{},"html":"<h3>43题解析<\/h3>\n<p><strong>答案：A — A default setting that alarms the advertising industry。<\/strong> 中文：令广告行业恐慌的默认设置。<\/p>\n<p>这一部分的中心是微软把DNT设为默认后为什么引发行业反对。前段交代改动，后段解释默认惯性和广告相关性方面的担忧；Liodice的话属于行业对后果的判断。<\/p>\n<p>第一段的 DNT switched on by default 与 went beyond offering a setting 标明变化；第二段用 because most people tend to keep default settings 解释恐慌，再用 did not predict a fall in the number 限定行业声称的影响。<\/p>\n<p>段内推进链：微软宣布默认开启DNT → 用户不必主动启用 → 多数人保留默认状态 → 广告商担心失去偏好信息 → 行业声称广告会更不相关而非更少。<\/p>\n<p>标题中的 default setting 对应首段真正的新举措；alarms 对应horrified及其原因；advertising industry 对应广告商与协会负责人。三个部分共同概括触发事件和反应主体。<\/p>\n<p>最强干扰项是F。它抓到消费者与广告的关系，却把“广告针对性下降”改写成“广告数量减少”，还把行业担忧写成已实现的benefit。文中明确否认数量减少的推断，因此不能用这一标题统摄本节。<\/p>\n<p><strong>最终答案：43选A。<\/strong><\/p>\n"},{"title":"小标题题 · 44题","level":3,"section":"第四鸟 · 新题型","raw":"### 44题解析\n\n**答案：G — An uncertain response to signals against tracking。** 中文：对反追踪信号的不确定回应。\n\n这一部分整体在分析DNT请求能否真正改变广告商行为。它区分收到信号、解释信号和采取行动三个环节，说明默认开启并不能直接保证停止追踪。\n\n开头的 actually do ... was still unclear 定下不确定性；did not oblige指出信号的约束有限，although some ... promised保留企业自愿遵守的情况。第二段的 might ... or ... 给出两种信号来源，some ... might又限定忽略请求只是部分企业的可能反应。\n\n段内推进链：实际响应尚不明确 → 收到信号不等于强制停追踪 → 默认值混合了主动反对和未改设置 → 广告商难以区分 → 部分企业可能忽略请求。\n\n标题中的 signals against tracking 对应DNT请求；response 对应stop tracking或continue tracking；uncertain覆盖法律约束、信号解释和行为结果的不确定，既不夸大为全面拒绝，也不把承诺当成普遍落实。\n\n最强干扰项是C。收到DNT后停止追踪确实是被讨论的结果，但本节明说did not oblige，并举出可能继续追踪的路径；legally guaranteed会把作者正在解释的执行缺口改成已经消失。\n\n**最终答案：44选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"44","label":"小标题题"},"meta":{},"html":"<h3>44题解析<\/h3>\n<p><strong>答案：G — An uncertain response to signals against tracking。<\/strong> 中文：对反追踪信号的不确定回应。<\/p>\n<p>这一部分整体在分析DNT请求能否真正改变广告商行为。它区分收到信号、解释信号和采取行动三个环节，说明默认开启并不能直接保证停止追踪。<\/p>\n<p>开头的 actually do ... was still unclear 定下不确定性；did not oblige指出信号的约束有限，although some ... promised保留企业自愿遵守的情况。第二段的 might ... or ... 给出两种信号来源，some ... might又限定忽略请求只是部分企业的可能反应。<\/p>\n<p>段内推进链：实际响应尚不明确 → 收到信号不等于强制停追踪 → 默认值混合了主动反对和未改设置 → 广告商难以区分 → 部分企业可能忽略请求。<\/p>\n<p>标题中的 signals against tracking 对应DNT请求；response 对应stop tracking或continue tracking；uncertain覆盖法律约束、信号解释和行为结果的不确定，既不夸大为全面拒绝，也不把承诺当成普遍落实。<\/p>\n<p>最强干扰项是C。收到DNT后停止追踪确实是被讨论的结果，但本节明说did not oblige，并举出可能继续追踪的路径；legally guaranteed会把作者正在解释的执行缺口改成已经消失。<\/p>\n<p><strong>最终答案：44选G。<\/strong><\/p>\n"},{"title":"小标题题 · 45题","level":3,"section":"第四鸟 · 新题型","raw":"### 45题解析\n\n**答案：D — Unanswered questions about Microsoft’s strategy。** 中文：关于微软策略的未解疑问。\n\n这一部分把注意力从广告商怎么做转到微软为什么独自采取这一举措。它依次检查自身广告业务、对谷歌的可能影响、系统卖点和消费者控制权说法，最后保留疑问。\n\n第一句 reasons for acting alone were also unclear 是总领；If ... meant to trouble Google 把打击谷歌放在假设层面，no guarantee指出限制；Nor ... major selling point 排查另一种解释。末尾没有给出确定动机，而是追问是否真的如此简单。\n\n段内推进链：微软自己也经营广告 → 打击谷歌只是可能且路径间接 → 默认DNT未必成为行业标准 → 产品卖点解释也不充分 → 官方强调消费者控制 → 作者仍追问。\n\n标题中的 Microsoft’s strategy 指默认DNT这一行动及商业背景；Unanswered questions 对应逐项检验后仍未得到确定解释。它保留文章的怀疑程度，没有把一种猜测升级为事实。\n\n最强干扰项是G。这里也出现comply with DNT，但只是微软自身广告业务带来的动机矛盾；本节没有继续分析广告商如何识别信号。若选G，就拿开头的一处执行细节覆盖了随后整段对策略理由的追问。\n\n**最终答案：45选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"45","label":"小标题题"},"meta":{},"html":"<h3>45题解析<\/h3>\n<p><strong>答案：D — Unanswered questions about Microsoft’s strategy。<\/strong> 中文：关于微软策略的未解疑问。<\/p>\n<p>这一部分把注意力从广告商怎么做转到微软为什么独自采取这一举措。它依次检查自身广告业务、对谷歌的可能影响、系统卖点和消费者控制权说法，最后保留疑问。<\/p>\n<p>第一句 reasons for acting alone were also unclear 是总领；If ... meant to trouble Google 把打击谷歌放在假设层面，no guarantee指出限制；Nor ... major selling point 排查另一种解释。末尾没有给出确定动机，而是追问是否真的如此简单。<\/p>\n<p>段内推进链：微软自己也经营广告 → 打击谷歌只是可能且路径间接 → 默认DNT未必成为行业标准 → 产品卖点解释也不充分 → 官方强调消费者控制 → 作者仍追问。<\/p>\n<p>标题中的 Microsoft’s strategy 指默认DNT这一行动及商业背景；Unanswered questions 对应逐项检验后仍未得到确定解释。它保留文章的怀疑程度，没有把一种猜测升级为事实。<\/p>\n<p>最强干扰项是G。这里也出现comply with DNT，但只是微软自身广告业务带来的动机矛盾；本节没有继续分析广告商如何识别信号。若选G，就拿开头的一处执行细节覆盖了随后整段对策略理由的追问。<\/p>\n<p><strong>最终答案：45选D。<\/strong><\/p>\n"},{"title":"排序题 · 完整题面与全局解析","level":2,"section":"第四鸟 · 新题型","raw":"## 排序题\n\nThe following paragraphs are given in a wrong order. Reorganize them into a coherent text by choosing from the list A–H to fill in each numbered box (41–45). Paragraphs A, E and H have been correctly placed.\n\n| 已给位置 | 41 | 42 | 已给位置 | 43 | 44 | 45 | 已给位置 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| A | ______ | ______ | E | ______ | ______ | ______ | H |\n\n### [A]\n\nAn old saying holds that half of advertising budgets are wasted, but no one knows which half. In theory, the internet could reduce this waste. By watching what people search for, click on and say online, companies can aim behavioural advertisements at those most likely to buy. The ability to use such detailed information is therefore valuable to advertisers and to the firms supplying their software.\n\n### [B]\n\nThat approach to DNT was thrown into dispute on May 31st, when Microsoft announced a different starting setting. Internet Explorer 10, due to appear with Windows 8, would have DNT on by default. Users would not have to switch it on themselves. This made the default, rather than only the availability of a choice, the centre of the argument. The announcement immediately alarmed advertisers.\n\n### [C]\n\nYet the pursuit of this information comes with a longstanding dispute over permission. Should advertisers assume that users are happy to be tracked and sent behavioural advertisements, or should they obtain explicit consent? Many people barely think about being observed electronically as they browse, while others object strongly. A central practical question is how those who object can tell advertisers that they do not want to be followed.\n\n### [D]\n\nWhether advertisers would act on that alarm by continuing to track was still uncertain. A DNT signal did not oblige them to stop, though some companies, including Twitter, had promised to respect it. With Microsoft’s default, an advertiser could not tell whether the signal expressed an active objection or an unchanged setting. Some might therefore ignore it and press on. The practical effect of Microsoft’s move remained unclear; its reason for making the move was another question.\n\n### [E]\n\nA browser setting was proposed as a way to communicate that wish. In December 2010 America’s Federal Trade Commission suggested adding a “do not track” option to browsers. Firefox, Internet Explorer and Safari offered DNT, and Chrome was due to follow during the year. In February the FTC and the Digital Advertising Alliance agreed that the industry would start responding to requests. In the European Union, a new rule required websites to ask before using cookies to gather behavioural information.\n\n### [F]\n\nSeveral recent purchases illustrate that commercial value. Oracle announced the acquisition of social-media marketing firm Vitrue for a reported $300m on May 23rd, and added social-media analyst Collective Intellect on June 5th for an undisclosed sum. On June 4th Salesforce.com said it would pay $689m for Buddy Media, a Vitrue competitor. This would complement Radian 6, another social-media monitoring business, for which Salesforce had paid $326m the previous year. The deals show firms investing in the ability to manage or understand people’s activity online.\n\n### [G]\n\nThe advertisers’ alarm reflected how strongly people tend to keep default settings. Few users were switching DNT on, but if tracking started switched off, it would probably stay off. Bob Liodice of the Association of National Advertisers said consumers would be worse off if the industry could not learn their preferences. They would receive less meaningful, less targeted advertisements, he argued, rather than fewer advertisements. This described the industry’s objection, but did not settle how advertisers would respond to the signals themselves.\n\n### [H]\n\nThat other question also lacked a clear answer. Microsoft had an advertising business too, and said it would respect DNT while still working out how. An attempt to trouble Google would be indirect, because the default might never become an industry norm. DNT was not an obviously powerful selling point for Windows 8 either. Microsoft’s privacy chief said consumers should have more control. Could the explanation really be that simple?\n\n## 排序题全局解析\n\n先看每一段在全文中的功能，再检查段首、段尾是否能双向接住。相同话题只提供候选范围，明确的指代、转折和段落任务才能确定位置。\n\n| 段落 | 这一段在做什么 | 关键接点 |\n| --- | --- | --- |\n| A | 说明网络行为信息为什么能提高广告投放效率 | 末尾详细信息的价值总领下一段交易 |\n| B | 微软改变默认设置并引发争议 | That approach接E的DNT安排；alarm递交G |\n| C | 从商业追求转入追踪许可争议 | Yet转折；末尾问反对者如何表达意愿 |\n| D | 解释广告商响应不确定及信号辨别困难 | act on that alarm承接G；another question递交H |\n| E | 用DNT工具和相关规则回应许可问题 | that wish回指C；提供B所改变的既有做法 |\n| F | 用收购交易展示网络信息的商业价值 | that commercial value回指A；结尾活动信息接C |\n| G | 解释默认惯性导致行业担忧 | advertisers’ alarm回指B；末尾提出实际响应尚未解决 |\n| H | 审视微软动机并保留疑问 | That other question回指D末尾；以反问收束 |\n\n全文推进链：广告浪费与行为数据的价值 → 收购展示商业投入 → 转入用户许可争议 → 介绍DNT及规则 → 微软改变默认设置 → 行业解释担忧 → 分析执行不确定 → 追问微软动机。\n\n**完整顺序：A → F → C → E → B → G → D → H。**\n\n**41—45答案：F、C、B、G、D。**\n\nA、E、H分别固定开篇的信息价值、DNT工具与规则、结尾的微软动机追问。把每个候选段放进去时，都要同时检查它接住了前段什么、又向后段交出了什么，不能只完成单侧配对。","context":{"mode":"newtype","kind":"sorting","current":"","label":"排序题"},"meta":{},"html":"<h2>排序题全局解析<\/h2>\n<p>先看每一段在全文中的功能，再检查段首、段尾是否能双向接住。相同话题只提供候选范围，明确的指代、转折和段落任务才能确定位置。<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在做什么<\/th>\n<th>关键接点<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>说明网络行为信息为什么能提高广告投放效率<\/td>\n<td>末尾详细信息的价值总领下一段交易<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>微软改变默认设置并引发争议<\/td>\n<td>That approach接E的DNT安排；alarm递交G<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>从商业追求转入追踪许可争议<\/td>\n<td>Yet转折；末尾问反对者如何表达意愿<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>解释广告商响应不确定及信号辨别困难<\/td>\n<td>act on that alarm承接G；another question递交H<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>用DNT工具和相关规则回应许可问题<\/td>\n<td>that wish回指C；提供B所改变的既有做法<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>用收购交易展示网络信息的商业价值<\/td>\n<td>that commercial value回指A；结尾活动信息接C<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>解释默认惯性导致行业担忧<\/td>\n<td>advertisers’ alarm回指B；末尾提出实际响应尚未解决<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>审视微软动机并保留疑问<\/td>\n<td>That other question回指D末尾；以反问收束<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>全文推进链：广告浪费与行为数据的价值 → 收购展示商业投入 → 转入用户许可争议 → 介绍DNT及规则 → 微软改变默认设置 → 行业解释担忧 → 分析执行不确定 → 追问微软动机。<\/p>\n<p><strong>完整顺序：A → F → C → E → B → G → D → H。<\/strong><\/p>\n<p><strong>41—45答案：F、C、B、G、D。<\/strong><\/p>\n<p>A、E、H分别固定开篇的信息价值、DNT工具与规则、结尾的微软动机追问。把每个候选段放进去时，都要同时检查它接住了前段什么、又向后段交出了什么，不能只完成单侧配对。<\/p>\n"},{"title":"排序题 · 41题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序41题解析\n\n当前空位位于已给A之后、42题之前，后面已给E将介绍DNT工具。41题先承接A关于信息商业价值的判断，为下一步从信息追求转向许可争议提供背景。\n\nA末尾说 detailed information is ... valuable；F开头的 Several recent purchases illustrate that commercial value 精确接住这一判断。F结尾说企业投入以管理和理解 people’s activity online，后面的C便以 Yet the pursuit of this information 转向许可。\n\nthat commercial value的指代和illustrate的举例功能使A→F连接明确。F不是另谈技术，而是用收购例证A；随后C中的Yet才把“值得获取”转成“是否有权获取”。\n\n局部推进链：A说明信息有用 → F列举企业为相关能力付费 → F回收为网络活动信息 → C转问搜集它是否需要许可。\n\n最强候选是C，它也能从A的信息价值转入争议。但若立即放C，F再置于C之后就会打断C末尾“如何表达反对”的问题与E的工具回应；F的that commercial value也会离开最直接的总领。A—F—C—E同时满足例证和问答关系。\n\n**最终答案：41填F。**","context":{"mode":"newtype","kind":"sorting","current":"F","label":"排序题"},"meta":{},"html":"<h3>排序41题解析<\/h3>\n<p>当前空位位于已给A之后、42题之前，后面已给E将介绍DNT工具。41题先承接A关于信息商业价值的判断，为下一步从信息追求转向许可争议提供背景。<\/p>\n<p>A末尾说 detailed information is ... valuable；F开头的 Several recent purchases illustrate that commercial value 精确接住这一判断。F结尾说企业投入以管理和理解 people’s activity online，后面的C便以 Yet the pursuit of this information 转向许可。<\/p>\n<p>that commercial value的指代和illustrate的举例功能使A→F连接明确。F不是另谈技术，而是用收购例证A；随后C中的Yet才把“值得获取”转成“是否有权获取”。<\/p>\n<p>局部推进链：A说明信息有用 → F列举企业为相关能力付费 → F回收为网络活动信息 → C转问搜集它是否需要许可。<\/p>\n<p>最强候选是C，它也能从A的信息价值转入争议。但若立即放C，F再置于C之后就会打断C末尾“如何表达反对”的问题与E的工具回应；F的that commercial value也会离开最直接的总领。A—F—C—E同时满足例证和问答关系。<\/p>\n<p><strong>最终答案：41填F。<\/strong><\/p>\n"},{"title":"排序题 · 42题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序42题解析\n\n当前空位位于已确定的F之后、已给E之前。F刚展示信息交易，E开头却说a way to communicate that wish；42题必须建立用户意愿这个准确前项，并引出其表达途径。\n\nF尾句仍谈 people’s activity online；C首句用 Yet the pursuit of this information 接住并转向许可争议。C末尾问反对者怎样 tell advertisers that they do not want to be followed，E开头的 communicate that wish 直接回答。\n\n前端通过this information和Yet形成同一对象上的转折；后端通过that wish及communicate/tell形成问题与工具的衔接。E中的DNT不是突兀出现，而是为C中明确的反对意愿服务。\n\n局部推进链：F信息具有交易价值 → C追问是否需要明确许可 → C聚焦反对用户怎样表达 → E提出浏览器DNT选项。\n\n最强候选是B，它也谈用户设置，却已经说That approach was thrown into dispute，需要先有E的DNT安排。它既不能提供E中that wish的直接前项，又会把默认值争议放到工具的介绍之前。\n\n**最终答案：42填C。**","context":{"mode":"newtype","kind":"sorting","current":"C","label":"排序题"},"meta":{},"html":"<h3>排序42题解析<\/h3>\n<p>当前空位位于已确定的F之后、已给E之前。F刚展示信息交易，E开头却说a way to communicate that wish；42题必须建立用户意愿这个准确前项，并引出其表达途径。<\/p>\n<p>F尾句仍谈 people’s activity online；C首句用 Yet the pursuit of this information 接住并转向许可争议。C末尾问反对者怎样 tell advertisers that they do not want to be followed，E开头的 communicate that wish 直接回答。<\/p>\n<p>前端通过this information和Yet形成同一对象上的转折；后端通过that wish及communicate/tell形成问题与工具的衔接。E中的DNT不是突兀出现，而是为C中明确的反对意愿服务。<\/p>\n<p>局部推进链：F信息具有交易价值 → C追问是否需要明确许可 → C聚焦反对用户怎样表达 → E提出浏览器DNT选项。<\/p>\n<p>最强候选是B，它也谈用户设置，却已经说That approach was thrown into dispute，需要先有E的DNT安排。它既不能提供E中that wish的直接前项，又会把默认值争议放到工具的介绍之前。<\/p>\n<p><strong>最终答案：42填C。<\/strong><\/p>\n"},{"title":"排序题 · 43题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序43题解析\n\n当前空位位于已给E之后、44题之前。E已经介绍DNT工具和响应安排，44题G将解释广告商的alarm。43题需要交代使已有安排起争议的新行动，并引出该反应。\n\nE写浏览器提供DNT及行业开始响应；B以 That approach to DNT was thrown into dispute 接续，并具体说明微软would have DNT on by default。B末句 The announcement immediately alarmed advertisers 与G首句 The advertisers’ alarm 形成紧密回指。\n\nThat approach回指既有DNT框架，a different starting setting说明真正变化在默认状态。B尾部先引入alarm，G才能解释其原因；所以前端是规则到事件，后端是现象到原因。\n\n局部推进链：E提供用户选择与响应框架 → B微软改变默认状态 → B广告商恐慌 → G解释多数人保留默认值。\n\n最强候选是G。它直接讨论默认设置，似乎能承接E，但E尚未宣布默认开启，也没有出现alarm。跳过B会使G的定指对象没有事件来源，并把反应放到触发行为之前。\n\n**最终答案：43填B。**","context":{"mode":"newtype","kind":"sorting","current":"B","label":"排序题"},"meta":{},"html":"<h3>排序43题解析<\/h3>\n<p>当前空位位于已给E之后、44题之前。E已经介绍DNT工具和响应安排，44题G将解释广告商的alarm。43题需要交代使已有安排起争议的新行动，并引出该反应。<\/p>\n<p>E写浏览器提供DNT及行业开始响应；B以 That approach to DNT was thrown into dispute 接续，并具体说明微软would have DNT on by default。B末句 The announcement immediately alarmed advertisers 与G首句 The advertisers’ alarm 形成紧密回指。<\/p>\n<p>That approach回指既有DNT框架，a different starting setting说明真正变化在默认状态。B尾部先引入alarm，G才能解释其原因；所以前端是规则到事件，后端是现象到原因。<\/p>\n<p>局部推进链：E提供用户选择与响应框架 → B微软改变默认状态 → B广告商恐慌 → G解释多数人保留默认值。<\/p>\n<p>最强候选是G。它直接讨论默认设置，似乎能承接E，但E尚未宣布默认开启，也没有出现alarm。跳过B会使G的定指对象没有事件来源，并把反应放到触发行为之前。<\/p>\n<p><strong>最终答案：43填B。<\/strong><\/p>\n"},{"title":"排序题 · 44题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序44题解析\n\n当前空位位于已确定的B之后、45题之前。B末尾宣布广告商被惊动，45题D将讨论他们是否据此继续追踪。44题要解释恐慌缘由，并把观点与实际行动区分开。\n\nB的 alarmed advertisers 对应G开头 The advertisers’ alarm；G随后用默认惯性和广告针对性说明反对理由。G末尾说 did not settle how advertisers would respond，D开头 Whether advertisers would act on that alarm ... was still uncertain 正接实际响应问题。\n\n前端重复alarm并补充原因，后端通过respond/act把“行业提出什么意见”推进到“企业会采取什么行动”。这一转换也防止把Liodice的意见当成广告商已经执行的统一方案。\n\n局部推进链：B微软引发恐慌 → G默认惯性解释信息损失担忧 → G行业声称广告相关性下降 → D另问实际响应是否停止追踪。\n\n最强候选是D，它也含alarm，但若直接接B，会先讲执行不确定，再回到G解释已经被提出的恐慌；G结尾的respond又会重新打开D已经处理过的问题，并挡住D末尾到H动机问题的衔接。\n\n**最终答案：44填G。**","context":{"mode":"newtype","kind":"sorting","current":"G","label":"排序题"},"meta":{},"html":"<h3>排序44题解析<\/h3>\n<p>当前空位位于已确定的B之后、45题之前。B末尾宣布广告商被惊动，45题D将讨论他们是否据此继续追踪。44题要解释恐慌缘由，并把观点与实际行动区分开。<\/p>\n<p>B的 alarmed advertisers 对应G开头 The advertisers’ alarm；G随后用默认惯性和广告针对性说明反对理由。G末尾说 did not settle how advertisers would respond，D开头 Whether advertisers would act on that alarm ... was still uncertain 正接实际响应问题。<\/p>\n<p>前端重复alarm并补充原因，后端通过respond/act把“行业提出什么意见”推进到“企业会采取什么行动”。这一转换也防止把Liodice的意见当成广告商已经执行的统一方案。<\/p>\n<p>局部推进链：B微软引发恐慌 → G默认惯性解释信息损失担忧 → G行业声称广告相关性下降 → D另问实际响应是否停止追踪。<\/p>\n<p>最强候选是D，它也含alarm，但若直接接B，会先讲执行不确定，再回到G解释已经被提出的恐慌；G结尾的respond又会重新打开D已经处理过的问题，并挡住D末尾到H动机问题的衔接。<\/p>\n<p><strong>最终答案：44填G。<\/strong><\/p>\n"},{"title":"排序题 · 45题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序45题解析\n\n当前空位位于已确定的G之后、已给H之前。G留下广告商实际响应的问题；H以That other question开始讨论微软的理由。45题必须先处理执行问题，再明确引出第二个问题。\n\nG末尾的 how advertisers would respond 对应D首句 Whether advertisers would act on that alarm。D分析信号的约束与解释后，末尾说 its reason for making the move was another question；H的That other question随后讨论微软为何如此行动。\n\n前端是尚未解决的问题与分析，后端是another/that other的明确指代。D把讨论对象从外部广告商的行为转到微软自己的动机，正好完成G与H之间的任务转换。\n\n局部推进链：G实际响应未定 → D收到信号不保证停止 → D默认与主动反对难区分 → D转问微软原因 → H逐项检查可能动机。\n\n最强候选是B，因它能再交代微软举措，但它没有回答G的响应问题，也没有引入H所说的other question；其末尾alarm只会把文章带回G。D的双向衔接才让全文继续向结论推进。\n\n**最终答案：45填D。**","context":{"mode":"newtype","kind":"sorting","current":"D","label":"排序题"},"meta":{},"html":"<h3>排序45题解析<\/h3>\n<p>当前空位位于已确定的G之后、已给H之前。G留下广告商实际响应的问题；H以That other question开始讨论微软的理由。45题必须先处理执行问题，再明确引出第二个问题。<\/p>\n<p>G末尾的 how advertisers would respond 对应D首句 Whether advertisers would act on that alarm。D分析信号的约束与解释后，末尾说 its reason for making the move was another question；H的That other question随后讨论微软为何如此行动。<\/p>\n<p>前端是尚未解决的问题与分析，后端是another/that other的明确指代。D把讨论对象从外部广告商的行为转到微软自己的动机，正好完成G与H之间的任务转换。<\/p>\n<p>局部推进链：G实际响应未定 → D收到信号不保证停止 → D默认与主动反对难区分 → D转问微软原因 → H逐项检查可能动机。<\/p>\n<p>最强候选是B，因它能再交代微软举措，但它没有回答G的响应问题，也没有引入H所说的other question；其末尾alarm只会把文章带回G。D的双向衔接才让全文继续向结论推进。<\/p>\n<p><strong>最终答案：45填D。<\/strong><\/p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **protecting privacy** | **保护隐私** | **社会现象类—科技经济** | **宏观主题** |\n| protecting personal information | 保护个人信息 | 社会现象类—科技经济 | 个人主题 |\n| a rational view of new technology | 理性看待新科技 | 社会现象类—科技经济 | 个人主题 |\n| rational consumption | 理性消费 | 社会现象类—社会生活 | 个人主题 |\n| **rational choice** | **理性选择** | **社会现象类—社会生活** | **个人主题** |\n| independent thinking | 独立思考 | 人生哲理类 | 个人主题 |\n| a sense of responsibility | 责任感 | 人生哲理类 | 个人主题 |\n| mutual trust | 相互信任 | 人生哲理类 | 个人主题 |\n| **building a healthy Net** | **构建网络文明** | **社会现象类—科技经济** | **宏观主题** |\n| proper use of the Internet | 合理使用互联网 | 社会现象类—科技经济 | 个人主题 |\n| assessing online information critically | 批判性地评估网络信息 | 社会现象类—科技经济 | 个人主题 |\n| technological innovation | 科技创新 | 经济消费类 | 宏观主题 |","level":2,"section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<table>\n<thead>\n<tr>\n<th>可积累的主题表达<\/th>\n<th>中文翻译<\/th>\n<th>所属类别<\/th>\n<th>使用层级<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>protecting privacy<\/strong><\/td>\n<td><strong>保护隐私<\/strong><\/td>\n<td><strong>社会现象类—科技经济<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>protecting personal information<\/td>\n<td>保护个人信息<\/td>\n<td>社会现象类—科技经济<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>a rational view of new technology<\/td>\n<td>理性看待新科技<\/td>\n<td>社会现象类—科技经济<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>rational consumption<\/td>\n<td>理性消费<\/td>\n<td>社会现象类—社会生活<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>rational choice<\/strong><\/td>\n<td><strong>理性选择<\/strong><\/td>\n<td><strong>社会现象类—社会生活<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>independent thinking<\/td>\n<td>独立思考<\/td>\n<td>人生哲理类<\/td> B和C。 |\n| 文本评论题 | The passage presents different responses to A’s decision to change B. | 短文介绍了各方对A改变B这一决定的不同反应。 |","level":2,"section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<table>\n<thead>\n<tr>\n<th>适用题型<\/th>\n<th>考试时可复用的形式<\/th>\n<th>中文翻译<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>图画题<\/strong><\/td>\n<td><strong>In the picture, A is choosing whether to allow B to collect information about C.<\/strong><\/td>\n<td><strong>图画中，A正在选择是否允许B收集有关C的信息。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The picture shows A changing the default settings of B.<\/td>\n<td>图画展现了A正在更改B的默认设置。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>In the picture, A is asking B for permission to do C.<\/td>\n<td>图画中，A正在征求B的许可，以便做C。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The picture depicts A and B expressing different views on C.<\/td>\n<td>图画描绘了A和B就C表达不同看法的情景。<\/td>\n<\/tr>\n<tr>\n<td><strong>图表题<\/strong><\/td>\n<td><strong>The chart shows the proportion of A who keep the default settings of B.<\/strong><\/td>\n<td><strong>图表显示了保留B默认设置的A所占的比例。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart compares the numbers of A who accept and decline B.<\/td>\n<td>图表比较了接受B与拒绝B的A的数量。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart presents changes in the percentage of A who choose B from C to D.<\/td>\n<td>图表呈现了从C到D期间选择B的A所占百分比的变化。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart compares A’s spending on B and C over the same period.<\/td>\n<td>图表比较了同一时期A在B和C上的支出。<\/td>\n<\/tr>\n<tr>\n<td><strong>文本评论题<\/strong><\/td>\n<td><strong>The passage discusses whether A should obtain B’s permission before doing C.<\/strong><\/td>\n<td><strong>短文讨论了A是否应该在做C之前征得B的许可。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage describes how A collects information about B’s preferences.<\/td>\n<td>短文描述了A如何收集有关B偏好的信息。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage examines how A’s choice affects B and C.<\/td>\n<td>短文考察了A的选择如何影响B和C。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage presents different responses to A’s decision to change B.<\/td>\n<td>短文介绍了各方对A改变B这一决定的不同反应。<\/td>\n<\/tr>\n<\/tbody><\/table>\n"}];

const NEWTYPE={"smallTitle":"<h2>小标题题<\/h2><p>Choose the most suitable heading from A–G for each section (41–45). There are two extra headings.<\/p><p><b>[A]<\/b> A default setting that alarms the advertising industry<\/p><p><b>[B]<\/b> The commercial value of detailed online information<\/p><p><b>[C]<\/b> A legally guaranteed end to online tracking<\/p><p><b>[D]<\/b> Unanswered questions about Microsoft’s strategy<\/p><p><b>[E]<\/b> Addressing permission through browser tools and privacy rules<\/p><p><b>[F]<\/b> Fewer advertisements as the benefit of a new default<\/p><p><b>[G]<\/b> An uncertain response to signals against tracking<\/p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41. ______<\/h3><p>An old saying holds that half of all advertising budgets are wasted, though no one knows which half. The internet could, in theory, reduce that waste. By observing what people search for, click on and say online, firms can direct behavioural advertisements towards those most likely to buy.<\/p><p>Recent deals show how valuable this detailed information has become. On May 23rd Oracle announced that it was buying Vitrue, which helps companies manage social-media marketing, for a reported $300m. On June 5th it added Collective Intellect, which analyses comments about companies on social networks, for an undisclosed sum. A day earlier Salesforce.com had announced that it would pay $689m for Buddy Media, a Vitrue competitor. Buddy would fit alongside Radian 6, a social-media monitoring business for which Salesforce had paid $326m the previous year. These purchases concern services that help firms use or understand activity online.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42. ______<\/h3><p>The value of such information raises a longstanding question: may advertisers assume that people are willing to be tracked and sent behavioural advertisements, or should explicit permission be required? Many users scarcely think about electronic observation while browsing, whereas some strongly object.<\/p><p>In December 2010 America’s Federal Trade Commission proposed a “do not track”, or DNT, option for browsers, allowing users to indicate that they did not wish to be followed. Firefox, Internet Explorer and Safari offered the option, and Chrome was due to do so during the year. In February the FTC and the Digital Advertising Alliance, a group of industry bodies, agreed that the industry would start responding to DNT requests. The European Union also introduced a rule requiring websites to ask before using cookies to collect information about users’ behaviour. These developments addressed how a user’s wishes could enter the tracking process.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43. ______<\/h3><p>On May 31st Microsoft provoked a row by announcing that Internet Explorer 10 would have DNT switched on by default. The browser was due to appear with Windows 8, the next version of the company’s operating system. This went beyond offering a setting that users could choose to activate.<\/p><p>Advertisers were horrified because most people tend to keep default settings. Few users were then switching DNT on, but if tracking were switched off at the start, it was likely to remain off. Bob Liodice, chief executive of the Association of National Advertisers, argued that consumers would be worse off if advertisers could not collect information about their preferences. He did not predict a fall in the number of advertisements: he said the advertisements would become less meaningful and less well targeted. The dispute therefore involved the effect of the initial setting on access to information and the relevance of advertising.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44. ______<\/h3><p>What advertisers would actually do in response was still unclear. Receiving a DNT signal did not oblige a company to stop tracking, although some businesses, including Twitter, had promised to respect it. A signal and a guaranteed change in behaviour were therefore not the same thing.<\/p><p>Microsoft’s default created a further difficulty for anyone interpreting that signal. It might express a user’s real objection to behavioural advertisements, or it might merely reflect an unchanged browser setting. Unable to distinguish these cases, some advertisers might ignore the signal and continue tracking. This was a possible response, not a claim that every firm would refuse all requests. The issue was whether the request would bring about the intended conduct when its meaning and the response to it were uncertain.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45. ______<\/h3><p>Microsoft’s reasons for acting alone were also unclear. It had an advertising business of its own, which it said would comply with DNT requests, although it was still deciding how to do so. If the company meant to trouble Google, which relied almost entirely on advertising, it had chosen an indirect route: there was no guarantee that DNT by default would become standard.<\/p><p>Nor did DNT appear an obviously major selling point for Windows 8, even though Microsoft had previously compared some products favourably with Google’s on privacy. Brendon Lynch, its chief privacy officer, said the company believed consumers should have more control. Could the explanation really be that simple?<\/p><\/section>","sorting":"<h2>排序题<\/h2><p>Reorganize paragraphs A–H. Paragraphs A, E and H have been correctly placed.<\/p><p>A → 41. ______ → 42. ______ → E → 43. ______ → 44. ______ → 45. ______ → H<\/p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>[A]<\/h3><p>An old saying holds that half of advertising budgets are wasted, but no one knows which half. In theory, the internet could reduce this waste. By watching what people search for, click on and say online, companies can aim behavioural advertisements at those most likely to buy. The ability to use such detailed information is therefore valuable to advertisers and to the firms supplying their software.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>[B]<\/h3><p>That approach to DNT was thrown into dispute on May 31st, when Microsoft announced a different starting setting. Internet Explorer 10, due to appear with Windows 8, would have DNT on by default. Users would not have to switch it on themselves. This made the default, rather than only the availability of a choice, the centre of the argument. The announcement immediately alarmed advertisers.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>[C]<\/h3><p>Yet the pursuit of this information comes with a longstanding dispute over permission. Should advertisers assume that users are happy to be tracked and sent behavioural advertisements, or should they obtain explicit consent? Many people barely think about being observed electronically as they browse, while others object strongly. A central practical question is how those who object can tell advertisers that they do not want to be followed.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>[D]<\/h3><p>Whether advertisers would act on that alarm by continuing to track was still uncertain. A DNT signal did not oblige them to stop, though some companies, including Twitter, had promised to respect it. With Microsoft’s default, an advertiser could not tell whether the signal expressed an active objection or an unchanged setting. Some might therefore ignore it and press on. The practical effect of Microsoft’s move remained unclear; its reason for making the move was another question.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>[E]<\/h3><p>A browser setting was proposed as a way to communicate that wish. In December 2010 America’s Federal Trade Commission suggested adding a “do not track” option to browsers. Firefox, Internet Explorer and Safari offered DNT, and Chrome was due to follow during the year. In February the FTC and the Digital Advertising Alliance agreed that the industry would start responding to requests. In the European Union, a new rule required websites to ask before using cookies to gather behavioural information.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>[F]<\/h3><p>Several recent purchases illustrate that commercial value. Oracle announced the acquisition of social-media marketing firm Vitrue for a reported $300m on May 23rd, and added social-media analyst Collective Intellect on June 5th for an undisclosed sum. On June 4th Salesforce.com said it would pay $689m for Buddy Media, a Vitrue competitor. This would complement Radian 6, another social-media monitoring business, for which Salesforce had paid $326m the previous year. The deals show firms investing in the ability to manage or understand people’s activity online.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>[G]<\/h3><p>The advertisers’ alarm reflected how strongly people tend to keep default settings. Few users were switching DNT on, but if tracking started switched off, it would probably stay off. Bob Liodice of the Association of National Advertisers said consumers would be worse off if the industry could not learn their preferences. They would receive less meaningful, less targeted advertisements, he argued, rather than fewer advertisements. This described the industry’s objection, but did not settle how advertisers would respond to the signals themselves.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>[H]<\/h3><p>That other question also lacked a clear answer. Microsoft had an advertising business too, and said it would respect DNT while still working out how. An attempt to trouble Google would be indirect, because the default might never become an industry norm. DNT was not an obviously powerful selling point for Windows 8 either. Microsoft’s privacy chief said consumers should have more control. Could the explanation really be that simple?<\/p><\/section>"};
const FULL="<h1>0.阅前须知<\/h1>\n<h2>史上最强阅读复盘法：一石五鸟法<\/h2>\n<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h1>\n<h1>第1段<\/h1>\n<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>saying<\/td>\n<td>n. 谚语；俗话<\/td>\n<td>half<\/td>\n<td>n. 一半<\/td>\n<td>advertising budgets<\/td>\n<td>名词短语：广告预算<\/td>\n<\/tr>\n<tr>\n<td>wasted<\/td>\n<td>v. 被浪费<\/td>\n<td>trouble<\/td>\n<td>n. 问题；麻烦<\/td>\n<td>knows<\/td>\n<td>v. 知道<\/td>\n<\/tr>\n<tr>\n<td>internet age<\/td>\n<td>名词短语：互联网时代<\/td>\n<td>in theory<\/td>\n<td>介词短语：在理论上<\/td>\n<td>fraction<\/td>\n<td>n. 比例；此处指被浪费的预算所占比例<\/td>\n<\/tr>\n<tr>\n<td>reduced<\/td>\n<td>v. 减少；降低<\/td>\n<td>watching<\/td>\n<td>v. 观察；监测<\/td>\n<td>click on<\/td>\n<td>动词短语：点击<\/td>\n<\/tr>\n<tr>\n<td>online<\/td>\n<td>adv. 在网上<\/td>\n<td>companies<\/td>\n<td>n. 公司<\/td>\n<td>aim ... at ...<\/td>\n<td>动词短语：把……投向……；以……为目标<\/td>\n<\/tr>\n<tr>\n<td>behavioural ads<\/td>\n<td>名词短语：行为定向广告<\/td>\n<td>likely to<\/td>\n<  / 所有广告预算的一半 / 被浪费了 – / 问题是，/ 没人知道 / 是哪一半。<\/p>\n<p>在互联网时代，/ 至少在理论上，/ 这个比例 / 可以大大减少。<\/p>\n<p>通过观察 / 人们搜索什么，/ 点击什么 / 以及在网上说什么，/ 公司可以瞄准 / &quot;行为&quot;广告 / 对那些最可能购买的人。<\/p>\n<h3>标准译文 · 第1段<\/h3>\n<p>俗话说，所有广告预算的一半都被浪费了——问题是，没人知道是哪一半。在互联网时代，至少在理论上，这个浪费的比例可以大大减少。通过观察人们搜索什么、点击什么以及在网上说什么，公司可以向那些最可能购买的人投放&quot;行为&quot;广告。<\/p>\n<h2>第2段<\/h2>\n<h3>完整原文 · 第2段<\/h3>\n<p>In the past couple of weeks a quarrel has illustrated the value to advertisers of such fine-grained information: Should advertisers assume that people are happy to be tracked and sent behavioural ads? Or should they have explicit permission?<\/p>\n<h3>意群划分 · 第2段<\/h3>\n<p>In the past couple of weeks / a quarrel has illustrated / the value to advertisers / of such fine-grained information: / Should advertisers assume / that people are happy / to be tracked / and sent behavioural ads?<\/p>\n<p>Or should they have / explicit permission?<\/p>\n<h3>意群翻译 · 第2段<\/h3>\n<p>在过去几周里 / 一场争论展示了 / 对广告商的价值 / 这种细粒度信息的：/ 广告商应该假设 / 人们乐意 / 被追踪 / 并接收行为广告吗？<\/p>\n<p>还是他们应该有 / 明确的许可？<\/p>\n<h3>标准译文 · 第2段<\/h3>\n<p>过去几周里，一场争论凸显了这种细粒度信息对广告商的价值：广告商应该假设人们乐意被追踪并接收行为广告吗？还是他们应该获得明确的许可？<\/p>\n<h2>第3段<\/h2>\n<h3>完整原文 · 第3段<\/h3>\n<p>In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year. In February the FTC and the Digital Advertising Alliance (DAA) agreed that <u>the industry<\/u> would get cracking on responding to DNT requests.<\/p>\n<h3>意群划分 · 第3段<\/h3>\n<p>In December 2010 / America&#39;s Federal Trade Commission (FTC) / proposed adding / a &quot;do not track&quot; (DNT) option / to internet browsers, / so that users could tell advertisers / that they did not want / to be followed.<\/p>\n<p>Microsoft&#39;s Internet Explorer / and Apple&#39;s Safari / both offer DNT; / Google&#39;s Chrome / is due to do so / this year.<\/p>\n<p>In February / the FTC and the Digital Advertising Alliance (DAA) / agreed / that the industry would get cracking / on responding to DNT requests.<\/p>\n<h3>意群翻译 · 第3段<\/h3>\n<p>在2010年12月 / 美国联邦贸易委员会（FTC）/ 提议添加 / 一个&quot;请勿追踪&quot;（DNT）选项 / 到互联网浏览器，/ 以便用户可以告诉广告商 / 他们不想 / 被跟踪。<\/p>\n<p>微软的Internet Explorer / 和苹果的Safari / 都提供DNT；/ 谷歌的Chrome / 预计会这样做 / 今年。<\/p>\n<p>在二月 / FTC和数字广告联盟（DAA）/ 同意 / 该行业将开始着手 / 响应DNT请求。<\/p>\n<h3>标准译文 · 第3段<\/h3>\n<p>2010年12月，美国联邦贸易委员会（FTC）提议在互联网浏览器中添加&quot;请勿追踪&quot;（DNT）选项，让用户可以告诉广告商他们不想被跟踪。微软的Internet Explorer和苹果的Safari都提供了DNT功能；谷歌的Chrome预计今年也会添加。二月份，FTC和数字广告联盟（DAA）达成一致，行业将开始着手响应DNT请求。<\/p>\n<h2>第4段<\/h2>\n<h3>完整原文 · 第4段<\/h3>\n<p>On May 31st Microsoft set off the row. It said that Internet Explorer 10, the version due to appear with Windows 8, would have DNT as a default.<\/p>\n<h3>意群划分 · 第4段<\/h3>\n<p>On May 31st / Microsoft set off the row.<\/p>\n<p>It said / that Internet Explorer 10, / the version due to appear / with Windows 8, / would have DNT / as a default.<\/p>\n<h3>意群翻译 · 第4段<\/h3>\n<p>在5月31日 / 微软引发了这场争论。<\/p>\n<p>它说 / Internet Explorer 10，/ 预计出现的版本 / 随Windows 8，/ 将把DNT / 作为默认设置。<\/p>\n<h3>标准译文 · 第4段<\/h3>\n<p>5月31日，微软引发了这场争论。它宣布，随Windows 8推出的Internet Explorer 10将把DNT作为默认设置。<\/p>\n<h2>第5段<\/h2>\n<h3>完整原文 · 第5段<\/h3>\n<p>Advertisers are horrified. Human nature being what it is, most people stick with default settings. Few switch DNT on now, but if tracking is off it will stay off. Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences. People will not get fewer ads, he says. “They’ll get less meaningful, less targeted ads.”<\/p>\n<h3>意群划分 · 第5段<\/h3>\n<p>Advertisers are horrified.<\/p>\n<p>Human nature being what it is, / most people stick with / default settings.<\/p>\n<p>Few switch DNT on now, / but if tracking is off / it will stay off.<\/p>\n<p>Bob Liodice, / the chief executive / of the Association of National Advertisers, / says consumers will be worse off / if the industry cannot collect / information about their preferences.<\/p>\n<p>People will not get / fewer ads, / he says.<\/p>\n<p>&quot;They&#39;ll get / less meaningful, / less targeted ads.&quot;<\/p>\n<h3>意群翻译 · 第5段<\/h3>\n<p>广告商感到恐慌。<\/p>\n<p>人性如此，/ 大多数人坚持使用 / 默认设置。<\/p>\n<p>现在很少有人开启DNT，/ 但如果追踪是关闭的 / 它将保持关闭。<\/p>\n<p>鲍勃·利奥迪斯，/ 首席执行官 / 全国广告商协会的，/ 说消费者会更糟糕 / 如果该行业不能收集 / 关于他们偏好的信息。<\/p>\n<p>人们不会得到 / 更少的广告，/ 他说。<\/p>\n<p>&quot;他们会得到 / 意义更少的，/ 针对性更差的广告。&quot;<\/p>\n<h3>标准译文 · 第5段<\/h3>\n<p>广告商对此感到恐慌。由于人性使然，大多数人会坚持使用默认设置。现在很少有人主动开启DNT，但如果追踪默认是关闭的，它就会一直保持关闭状态。全国广告商协会首席执行官鲍勃·利奥迪斯表示，如果该行业不能收集用户偏好信息，消费者的境况会更糟。他说，人们不会收到更少的广告。&quot;他们会收到意义更少、针对性更差的广告。&quot;<\/p>\n<h2>第6段<\/h2>\n<h3>完整原文 · 第6段<\/h3>\n<p>It is not yet clear how advertisers will respond. Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so. Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<h3>意群划分 · 第6段<\/h3>\n<p>It is not yet clear / how advertisers will respond.<\/p>\n<p>Getting a DNT signal / does not oblige anyone / to stop tracking, / although some companies / have promised to do so.<\/p>\n<p>Unable to tell / whether someone really objects / to behavioural ads / or whether they are sticking / with Microsoft&#39;s default, / some may ignore / a DNT signal / and press on anyway.<\/p>\n<h3>意群翻译 · 第6段<\/h3>\n<p>还不清楚 / 广告商将如何回应。<\/p>\n<p>收到DNT信号 / 并不强制任何人 / 停止追踪，/ 尽管一些公司 / 已经承诺这样做。<\/p>\n<p>无法判断 / 某人是否真的反对 / 行为广告 / 还是他们只是坚持 / 微软的默认设置，/ 一些人可能忽略 / DNT信号 / 并继续进行。<\/p>\n<h3>标准译文 · 第6段<\/h3>\n<p>目前还不清楚广告商将如何回应。收到DNT信号并不强制任何人停止追踪，尽管一些公司已经承诺会这样做。由于无法判断用户是真的反对行为广告，还是只是使用了微软的默认设置，一些广告商可能会忽略DNT信号，继续追踪。<\/p>\n<h2>第7段<\/h2>\n<h3>完整原文 · 第7段<\/h3>\n<p>Also unclear is why Microsoft has gone it alone. After all, it has an ad business too, which it says will comply with DNT requests, though it is still working out how. If it is trying to upset Google, which relies almost wholly on advertising, it has  chosen an indirect method: there is no guarantee that DNT by default will become the norm. DNT does not seem an obviously huge selling point for windows 8 – though  the firm has compared some of its other products favourably with Google’s on that count before. Brendon Lynch, Microsoft’s chief privacy officer, blogged: “We believe consumers should have more control.” Could it really be that simple?<\/p>\n<h3>意群划分 · 第7段<\/h3>\n<p>Also unclear / is why Microsoft / has gone it alone.<\/p>\n<p>After all, / it has an ad business too, / which it says / will comply with DNT requests, / though it is still working out how.<\/p>\n<p>If it is trying / to upset Google, / which relies almost wholly / on advertising, / it has chosen / an indirect method: / there is no guarantee / that DNT by default / will become the norm.<\/p>\n<p>DNT does not seem / an obviously huge selling point / for windows 8 – / though the firm has compared / some of its other products / favourably with Google&#39;s / on that count before.<\/p>\n<p>Brendon Lynch, / Microsoft&#39;s chief privacy officer, / blogged: / &quot;We believe / consumers should have / more control.&quot;<\/p>\n<p>Could it really be / that simple?<\/p>\n<h3>意群翻译 · 第7段<\/h3>\n<p>同样不清楚的 / 是为什么微软 / 单独行动。<\/p>\n<p>毕竟，/ 它也有广告业务，/ 它说 / 将遵守DNT请求，/ 尽管它仍在研究如何做。<\/p>\n<p>如果它试图 / 打击谷歌，/ 谷歌几乎完全依赖 / 广告，/ 它选择了 / 一个间接方法：/ 没有保证 / 默认DNT / 会成为规范。<\/p>\n<p>DNT似乎不是 / 一个明显巨大的卖点 / 对于Windows 8 – / 尽管该公司已经比较过 / 它的一些其他产品 / 与谷歌的相比有利 / 在这方面之前。<\/p>\n<p>布伦登·林奇，/ 微软首席隐私官，/ 在博客中写道：/ &quot;我们相信 / 消费者应该有 / 更多控制权。&quot;<\/p>\n<p>真的会是 / 这么简单吗？<\/p>\n<h3>标准译文 · 第7段<\/h3>\n<p>同样不清楚的是微软为什么要单独行动。毕竟，它也有广告业务，虽然它表示会遵守DNT请求，但仍在研究具体如何实施。如果它试图打击几乎完全依赖广告的谷歌，它选择了一个间接的方法：没有保证默认DNT会成为行业规范。DNT似乎不是Windows 8的一个明显巨大卖点——尽管该公司之前曾在这方面将其一些其他产品与谷歌的产品进行有利比较。微软首席隐私官布伦登·林奇在博客中写道：&quot;我们相信消费者应该有更多控制权。&quot;真的会这么简单吗？<\/p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)<\/h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。<\/p>\n<p>符号的作用：<\/p>\n<ul>\n<li><code>→<\/code>：主要叙述继续向下推进；<\/li>\n<li><code>+<\/code>：并列；<\/li>\n<li><code>：<\/code>：解释、修饰或补充；<\/li>\n<li><code>//<\/code>：转折或对比；<\/li>\n<li>括号：把同一层的信息捆成一个整体。<\/li>\n<\/ul>\n<h2>句子逻辑梳理（选修，按照自身语法基础而定)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>An old saying has it：(that half of all advertising budgets → are wasted) – the trouble is：(no one knows → which half).<\/p>\n<p>In the internet age：(at least in theory) → this fraction → can be much reduced.<\/p>\n<p>By watching：(what people search for + click on + say online) → companies can aim → &quot;behavioural&quot; ads：(at those most likely to buy).<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>In the past couple of weeks → a quarrel has illustrated → the value to advertisers：(of such fine-grained information)：Should advertisers assume：(that people are happy：(to be tracked + sent behavioural ads))?<\/p>\n<p>Or should they have → explicit permission?<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>In December 2010 → America&#39;s Federal Trade Commission (FTC) → proposed adding → a &quot;do not track&quot; (DNT) option：(to internet browsers)，so that users could tell advertisers：(that they did not want → to be followed).<\/p>\n<p>Microsoft&#39;s Internet Explorer + Apple&#39;s Safari → both offer DNT; // Google&#39;s Chrome → is due to do so：(this year).<\/p>\n<p>In February → the FTC and the Digital Advertising Alliance (DAA) → agreed：(that the industry would get cracking：(on responding to DNT requests)).<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>On May 31st → Microsoft set off the row.<\/p>\n<p>It said：(that Internet Explorer 10：(the version due to appear：(with Windows 8)) → would have DNT：(as a default)).<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>Advertisers are horrified.<\/p>\n<p>Human nature being what it is → most people stick with → default settings.<\/p>\n<p>Few switch DNT on now // but if tracking is off → it will stay off.<\/p>\n<p>Bob Liodice：(the chief executive：(of the Association of National Advertisers)) → says consumers will be worse off：(if the industry cannot collect → information about their preferences).<\/p>\n<p>People will not get → fewer ads，he says.<\/p>\n<p>&quot;They&#39;ll get → less meaningful + less targeted ads.&quot;<\/p>\n<p><strong>第6段<\/strong><\/p>\n<p>It is not yet clear：(how advertisers will respond).<\/p>\n<p>Getting a DNT signal → does not oblige anyone → to stop tracking，although some companies → have promised to do so.<\/p>\n<p>Unable to tell：(whether someone really objects → to behavioural ads // or whether they are sticking → with Microsoft&#39;s default) → some may ignore → a DNT signal + press on anyway.<\/p>\n<p><strong>第7段<\/strong><\/p>\n<p>Also unclear → is why Microsoft → has gone it alone.<\/p>\n<p>After all → it has an ad business too：(which it says → will comply with DNT requests)，though it is still working out how.<\/p>\n<p>If it is trying → to upset Google：(which relies almost wholly → on advertising) → it has chosen → an indirect method：there is no guarantee：(that DNT by default → will become the norm).<\/p>\n<p>DNT does not seem → an obviously huge selling point：(for windows 8) – though the firm has compared → some of its other products → favourably with Google&#39;s：(on that count before).<\/p>\n<p>Brendon Lynch：(Microsoft&#39;s chief privacy officer) → blogged：&quot;We believe → consumers should have → more control.&quot;<\/p>\n<p>Could it really be → that simple?<\/p>\n<h2>中文版句子逻辑（选修)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>一句老话说：(所有广告预算的一半 → 被浪费了) – 问题是：(没人知道 → 是哪一半)。<\/p>\n<p>在互联网时代：(至少在理论上) → 这个比例 → 可以大大减少。<\/p>\n<p>通过观察：(人们搜索什么 + 点击什么 + 在网上说什么) → 公司可以瞄准 → &quot;行为&quot;广告：(对那些最可能购买的人)。<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>在过去几周里 → 一场争论展示了 → 对广告商的价值：(这种细粒度信息的)：广告商应该假设：(人们乐意：(被追踪 + 接收行为广告))吗？<\/p>\n<p>还是他们应该有 → 明确的许可？<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>在2010年12月 → 美国联邦贸易委员会（FTC）→ 提议添加 → 一个&quot;请勿追踪&quot;（DNT）选项：(到互联网浏览器)，以便用户可以告诉广告商：(他们不想 → 被跟踪)。<\/p>\n<p>微软的Internet Explorer + 苹果的Safari → 都提供DNT；// 谷歌的Chrome → 预计会这样做：(今年)。<\/p>\n<p>在二月 → FTC和数字广告联盟（DAA）→ 同意：(该行业将开始着手：(响应DNT请求))。<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>在5月31日 → 微软引发了这场争论。<\/p>\n<p>它说：(Internet Explorer 10：(预计出现的版本：(随Windows 8)) → 将把DNT：(作为默认设置))。<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>广告商感到恐慌。<\/p>\n<p>人性如此 → 大多数人坚持使用 → 默认设置。<\/p>\n<p>现在很少有人开启DNT // 但如果追踪是关闭的 → 它将保持关闭。<\/p>\n<p>鲍勃·利奥迪斯：(首席执行官：(全国广告商协会的)) → 说消费者会更糟糕：(如果该行业不能收集 → 关于他们偏好的信息)。<\/p>\n<p>人们不会得到 → 更少的广告，他说。<\/p>\n<p>&quot;他们会得到 → 意义更少的 + 针对性更差的广告。&quot;<\/p>\n<p><strong>第6段<\/strong><\/p>\n<p>还不清楚：(广告商将如何回应)。<\/p>\n<p>收到DNT信号 → 并不强制任何人 → 停止追踪，尽管一些公司 → 已经承诺这样做。<\/p>\n<p>无法判断：(某人是否真的反对 → 行为广告 // 还是他们只是坚持 → 微软的默认设置) → 一些人可能忽略 → DNT信号 + 继续进行。<\/p>\n<p><strong>第7段<\/strong><\/p>\n<p>同样不清楚的 → 是为什么微软 → 单独行动。<\/p>\n<p>毕竟 → 它也有广告业务：(它说 → 将遵守DNT请求)，尽管它仍在研究如何做。<\/p>\n<p>如果它试图 → 打击谷歌：(谷歌几乎完全依赖 → 广告) → 它选择了 → 一个间接方法：没有保证：(默认DNT → 会成为规范)。<\/p>\n<p>DNT似乎不是 → 一个明显巨大的卖点：(对于Windows 8) – 尽管该公司已经比较过 → 它的一些其他产品 → 与谷歌的相比有利：(在这方面之前)。<\/p>\n<p>布伦登·林奇：(微软首席隐私官) → 在博客中写道：&quot;我们相信 → 消费者应该有 → 更多控制权。&quot;<\/p>\n<p>真的会是 → 这么简单吗？<\/p>\n<h2>长难句翻译练习（英一必修，英二选修)<\/h2>\n<p>对于长难句的翻译，流程一共五步：<\/p>\n<ol>\n<li>划分意群；<\/li>\n<li>逐个意群直译；<\/li>\n<li>按照中文语感，把应该放在一起的意群合并起来；<\/li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；<\/li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。<\/li>\n<\/ol>\n<h3>1. 第1段第3句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>By watching / what people search for, / click on / and say online, / companies can aim / &quot;behavioural&quot; ads / at those most likely to buy.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>通过观察 / 人们搜索什么，/ 点击什么 / 以及在网上说什么，/ 公司可以瞄准 / &quot;行为&quot;广告 / 对那些最可能购买的人。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把观察的三个内容并排接起来，它们都属于“人们在网上的行为”：<\/p>\n<blockquote>\n<p>观察人们搜索什么、点击什么以及在网上说什么<\/p>\n<\/blockquote>\n<p>“最可能购买的”是在说明哪一类人，先和“人”合在一起：<\/p>\n<blockquote>\n<p>那些最可能购买的人<\/p>\n<\/blockquote>\n<p>再把广告和接收广告的人接到公司的动作后面：<\/p>\n<blockquote>\n<p>公司把“行为”广告瞄准那些最可能购买的人<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>通过观察人们搜索什么、点击什么以及在网上说什么\n公司可以把“行为”广告瞄准那些最可能购买的人<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>公司可以向特定人群投放广告。<\/p>\n<\/blockquote>\n<p>先把“通过观察……”放在公司采取行动之前，交代它怎样找到目标人群。再让“公司”接“可以”，把广告接收者放到“瞄准”的后面。搜索、点击和网上言论都属于观察内容，不要把它们写成公司向消费者提供的服务。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>通过观察人们搜索什么、点击什么以及在网上说什么，公司可以把“行为”广告瞄准那些最可能购买的人。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“把广告瞄准某人”带有直译痕迹，改成“向某人投放广告”，让广告的去向清楚自然。<\/li>\n<li>保留“最可能购买”的限定，说明投放针对购买可能性较高的人，不改成面向全部网民。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>通过观察人们搜索什么、点击什么以及在网上说什么，公司可以向那些最可能购买的人投放&quot;行为&quot;广告。<\/p>\n<\/blockquote>\n<h3>2. 第3段第1句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>In December 2010 / America&#39;s Federal Trade Commission (FTC) / proposed adding / a &quot;do not track&quot; (DNT) option / to internet browsers, / so that users could tell advertisers / that they did not want / to be followed.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>在2010年12月 / 美国联邦贸易委员会（FTC）/ 提议添加 / 一个&quot;请勿追踪&quot;（DNT）选项 / 到互联网浏览器，/ 以便用户可以告诉广告商 / 他们不想 / 被跟踪。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把时间单独放好，再把机构名称与缩写合并，说明是谁提出建议：<\/p>\n<blockquote>\n<p>在2010年12月，美国联邦贸易委员会（FTC）<\/p>\n<\/blockquote>\n<p>“到互联网浏览器”是添加选项的位置，中文先交代位置再说添加什么：<\/p>\n<blockquote>\n<p>提议在互联网浏览器中添加一个“请勿追踪”（DNT）选项<\/p>\n<\/blockquote>\n<p>后面的两块一起说明用户能够表达的意愿：<\/p>\n<blockquote>\n<p>用户可以告诉广告商，他们不想被跟踪<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>在2010年12月，美国联邦贸易委员会（FTC）提议在互联网浏览器中添加一个“请勿追踪”（DNT）选项\n以便用户可以告诉广告商，他们不想被跟踪<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>委员会提议添加选项，让用户表达意愿。<\/p>\n<\/blockquote>\n<p>把时间放在最前面，机构作为提出建议的人，紧接“提议”。“在互联网浏览器中”放在“添加”之前，选项名称跟在“添加”后。再用“以便”接目的，先说用户可以告诉谁，再说他们不想被跟踪。不要把用户的意愿写成广告商已经停止追踪的结果。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>在2010年12月，美国联邦贸易委员会（FTC）提议在互联网浏览器中添加一个“请勿追踪”（DNT）选项，以便用户可以告诉广告商他们不想被跟踪。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>具体年月前的“在”和选项前的“一个”可以省去，使句子更紧凑。<\/li>\n<li>“以便”整理为“让”，保留设置选项的目的；“可以告诉”仍然保留，不把表达意愿扩大成强制要求。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>2010年12月，美国联邦贸易委员会（FTC）提议在互联网浏览器中添加&quot;请勿追踪&quot;（DNT）选项，让用户可以告诉广告商他们不想被跟踪。<\/p>\n<\/blockquote>\n<h3>3. 第4段第2句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>It said that Internet Explorer 10, the version due to appear with Windows 8, would have DNT as a default.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>It said / that Internet Explorer 10, / the version due to appear / with Windows 8, / would have DNT / as a default.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>它说 / Internet Explorer 10，/ 预计出现的版本 / 随Windows 8，/ 将把DNT / 作为默认设置。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>“预计出现的版本”和“随Windows 8”都在补充浏览器的推出情况，先合成一块：<\/p>\n<blockquote>\n<p>预计随Windows 8出现的版本<\/p>\n<\/blockquote>\n<p>再把这块说明放在浏览器名称前，不把它误接到DNT前：<\/p>\n<blockquote>\n<p>预计随Windows 8出现的Internet Explorer 10<\/p>\n<\/blockquote>\n<p>最后把DNT与它将处于的状态连起来：<\/p>\n<blockquote>\n<p>将把DNT作为默认设置<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>它说\n预计随Windows 8出现的Internet Explorer 10\n将把DNT作为默认设置<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>它说，浏览器将把DNT作为默认设置。<\/p>\n<\/blockquote>\n<p>先用“它说”承接上一句的微软，再说声明的内容。浏览器名称较长，把“预计随Windows 8出现的”放在名称前，随后直接接“将把DNT作为默认设置”。“随Windows 8”说的是浏览器怎样推出，不是用户怎样手动设置DNT。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>它说，预计随Windows 8出现的Internet Explorer 10将把DNT作为默认设置。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>结合这里公开发布产品安排的语境，“它说”整理为“它宣布”，明确这是微软作出的声明。<\/li>\n<li>产品“出现”改为“推出”更符合中文用法；主句保留“将”，交代这是即将实行的安排。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>它宣布，随Windows 8推出的Internet Explorer 10将把DNT作为默认设置。<\/p>\n<\/blockquote>\n<h3>4. 第5段第4句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>Bob Liodice, / the chief executive / of the Association of National Advertisers, / says consumers will be worse off / if the industry cannot collect / information about their preferences.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>鲍勃·利奥迪斯，/ 首席执行官 / 全国广告商协会的，/ 说消费者会更糟糕 / 如果该行业不能收集 / 关于他们偏好的信息。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把职务与所属机构合并，再一起放到姓名前：<\/p>\n<blockquote>\n<p>全国广告商协会首席执行官鲍勃·利奥迪斯<\/p>\n<\/blockquote>\n<p>“关于他们偏好的”是收集的信息内容，先和“信息”放在一起：<\/p>\n<blockquote>\n<p>收集关于消费者偏好的信息<\/p>\n<\/blockquote>\n<p>把说话内容里的条件单独拎出，与后果配成一组：<\/p>\n<blockquote>\n<p>如果该行业不能收集这些信息\n消费者会更糟糕<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>全国广告商协会首席执行官鲍勃·利奥迪斯说\n如果该行业不能收集关于消费者偏好的信息\n消费者会更糟糕<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>利奥迪斯说，消费者的境况会更糟。<\/p>\n<\/blockquote>\n<p>在姓名前先交代机构和职务，使整个人物身份一口气说完。接着用“说”引出他的判断。在这个判断内部先放“如果……不能收集……”的条件，再接消费者的后果。“关于消费者偏好的”紧贴“信息”，不要变成广告商自己的偏好。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>全国广告商协会首席执行官鲍勃·利奥迪斯说，如果该行业不能收集关于消费者偏好的信息，消费者会更糟糕。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“关于消费者偏好的信息”收为“用户偏好信息”，减少连续修饰，仍明确说的是用户的偏好。<\/li>\n<li>“消费者会更糟糕”容易像在评价人的品质，补成“消费者的境况会更糟”；“说”整理为报道中常用的“表示”。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>全国广告商协会首席执行官鲍勃·利奥迪斯表示，如果该行业不能收集用户偏好信息，消费者的境况会更糟。<\/p>\n<\/blockquote>\n<h3>5. 第6段第3句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>Unable to tell / whether someone really objects / to behavioural ads / or whether they are sticking / with Microsoft&#39;s default, / some may ignore / a DNT signal / and press on anyway.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>无法判断 / 某人是否真的反对 / 行为广告 / 还是他们只是坚持 / 微软的默认设置，/ 一些人可能忽略 / DNT信号 / 并继续进行。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把要判断的两种情况合成“是……还是……”的选择：<\/p>\n<blockquote>\n<p>用户是真的反对行为广告，还是只是坚持微软的默认设置<\/p>\n<\/blockquote>\n<p>再把“无法判断”接到这组选择前，说明为什么会有后面的行动：<\/p>\n<blockquote>\n<p>由于无法判断用户属于哪一种情况<\/p>\n<\/blockquote>\n<p>最后把同一方的两个动作连起来；“可能”要同时限制它们：<\/p>\n<blockquote>\n<p>一些人可能忽略DNT信号，并继续进行<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>由于无法判断用户是真的反对行为广告，还是只是坚持微软的默认设置\n一些人可能忽略DNT信号，并继续进行<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>一些广告商可能忽略信号并继续追踪。<\/p>\n<\/blockquote>\n<p>把“由于无法判断……”放在句首，先交代原因。两种难以区分的情况用“是……还是……”连接，保持用户主动反对和沿用默认值的区别。后面让一些广告商接“可能”，再依次放“忽略信号”和“继续进行”；不要删掉“可能”，也不要把原因写成所有用户都不反对追踪。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>由于无法判断用户是真的反对行为广告，还是只是坚持微软的默认设置，一些广告商可能忽略DNT信号，并继续进行追踪。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>设置是被使用或沿用的，“坚持微软的默认设置”改为“只是使用了微软的默认设置”，把用户未必主动选择的意思说清楚。<\/li>\n<li>“继续进行追踪”收成“继续追踪”，直接落到实际动作；“可能会”仍保留预测语气。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>由于无法判断用户是真的反对行为广告，还是只是使用了微软的默认设置，一些广告商可能会忽略DNT信号，继续追踪。<\/p>\n<\/blockquote>\n<h3>6. 第7段第3句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>If it is trying to upset Google, which relies almost wholly on advertising, it has  chosen an indirect method: there is no guarantee that DNT by default will become the norm.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>If it is trying / to upset Google, / which relies almost wholly / on advertising, / it has chosen / an indirect method: / there is no guarantee / that DNT by default / will become the norm.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>如果它试图 / 打击谷歌，/ 谷歌几乎完全依赖 / 广告，/ 它选择了 / 一个间接方法：/ 没有保证 / 默认DNT / 会成为规范。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>“几乎完全依赖广告”是在补充谷歌的情况，先和谷歌合成一块：<\/p>\n<blockquote>\n<p>几乎完全依赖广告的谷歌<\/p>\n<\/blockquote>\n<p>再把这个对象接到微软可能的目的后：<\/p>\n<blockquote>\n<p>如果它试图打击这样的谷歌<\/p>\n<\/blockquote>\n<p>冒号后解释为什么这种方法是间接的，要把“默认DNT”和预期结果接在一起：<\/p>\n<blockquote>\n<p>没有保证默认DNT会成为规范<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>如果它试图打击几乎完全依赖广告的谷歌\n它选择了一个间接方法\n没有保证默认DNT会成为规范<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>如果目的是打击谷歌，微软的方法是间接的。<\/p>\n<\/blockquote>\n<p>先用“如果”限定打击谷歌只是被讨论的一种动机，不写成已经确定的事实。在“谷歌”前交代它对广告的依赖，再接微软选择的方法。最后用冒号保留解释关系，说默认DNT未必成为规范，这才说明前面的“间接”。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>如果它试图打击几乎完全依赖广告的谷歌，它选择了一个间接方法：没有保证默认DNT会成为规范。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“一个间接方法”整理为“一个间接的方法”，读起来更自然。<\/li>\n<li>把此处的“规范”明确为“行业规范”，使它指向浏览器和广告行业的通行做法；保留“没有保证”，不改成绝不可能成为规范。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>如果它试图打击几乎完全依赖广告的谷歌，它选择了一个间接的方法：没有保证默认DNT会成为行业规范。<\/p>\n<\/blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句
