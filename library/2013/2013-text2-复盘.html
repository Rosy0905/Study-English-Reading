e’s Chrome”的列举所构成的标准回指范围判断，不能让态度主旨代替指代分析。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. e-commerce conductors","raw":"### B. e-commerce conductors\n\n> 电子商务经营者\n\n**做题模式中的状态：** 当时B中的`conductors`显示为`[xxx]`，但`e-commerce`可见。做题时对照前文的浏览器产品列举，发现电子商务领域不是这组对象所属的行业，第一轮排除B；并没有等到恢复被遮挡词后才改变判断。\n\n**错误类型：第三类——无中生有。**\n\n选项利用互联网浏览器与电子商务都在线上运行的联系，补出电子商务经营者这一主体。第3段出现监管机构、广告联盟、广告商和浏览器产品，没有引出电子商务经营者作为`the industry`的所指。\n\n**出处：**\n\n> Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.\n>\n> In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题 B选项","focus":[93,700,557,58],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":27,"option":"B","cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q27-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-B-0\"><blockquote>\n<p>电子商务经营者<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B中的<code>conductors<\/code>显示为<code>[xxx]<\/code>，但<code>e-commerce<\/code>可见。做题时对照前文的浏览器产品列举，发现电子商务领域不是这组对象所属的行业，第一轮排除B；并没有等到恢复被遮挡词后才改变判断。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>选项利用互联网浏览器与电子商务都在线上运行的联系，补出电子商务经营者这一主体。第3段出现监管机构、广告联盟、广告商和浏览器产品，没有引出电子商务经营者作为<code>the industry<\/code>的所指。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. e-commerce conductors","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 第三段中的“the industry”指电子商务经营者。\n\n要定位的是`the industry`之前已出现的行业对象。B中的`e-commerce`不能只因带有网络含义就与`internet browsers`对等，需核对具体 A) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. internet browser developers","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 第三段中的“the industry”指互联网浏览器开发者。\n\n`internet browser developers`与前句三个浏览器名称形成产品和开发者的联系；题干中的集合名词`the industry`，在标准解读下承接这一产品领域。\n\nInternet Explorer和Safari已提供DNT，Chrome将在当年提供。前句连续列出不同公司的同类产品，标准答案据此把后句行业名称理解为这些浏览器背后的开发者。\n\n这一判断不能靠把`responding to DNT requests`直译成“浏览器代广告商停止追踪”来加强。浏览器可提供发送用户偏好的机制，追踪方是否执行请求是另一环节；第6段正是在讨论后一问题。\n\nD对应本题标准所采用的近前同类列举与行业概括，产品名称与开发者身份能相接，但不应由此增造浏览器对网站追踪行为的控制。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题 D选项","focus":[93,870,637,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":27,"option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q27-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-D-0\"><blockquote>\n<p>互联网浏览器开发者<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第3段<code>proposed<\/code>和<code>cracking<\/code>被显示为<code>[xxx]<\/code>，D完整显示。做题时依据Internet Explorer、Safari、Chrome的连续列举，把产品背后的开发者概括为相应行业，第一轮保留D，随后选择D；这与本题标准答案一致。<\/p>\n<p><strong>选项类型：局部推断。<\/strong><\/p>\n<p>本题标准采用从前句浏览器产品回指开发行业的解释。D把Internet Explorer、Safari和Chrome这些产品名称，概括成提供相应浏览器功能的开发者群体；其依据是相邻句中的同类列举，而不是把网站是否停止追踪的执行权交给浏览器。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q27-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第三段中的“the industry”指互联网浏览器开发者。<\/p>\n<\/blockquote>\n<p><code>internet browser developers<\/code>与前句三个浏览器名称形成产品和开发者的联系；题干中的集合名词<code>the industry<\/code>，在标准解读下承接这一产品领域。<\/p>\n<p>Internet Explorer和Safari已提供DNT，Chrome将在当年提供。前句连续列出不同公司的同类产品，标准答案据此把后句行业名称理解为这些浏览器背后的开发者。<\/p>\n<p>这一判断不能靠把<code>responding to DNT requests<\/code>直译成“浏览器代广告商停止追踪”来加强。浏览器可提供发送用户偏好的机制，追踪方是否执行请求是另一环节；第6段正是在讨论后一问题。<\/p>\n<p>D对应本题标准所采用的近前同类列举与行业概括，产品名称与开发者身份能相接，但不应由此增造浏览器对网站追踪行为的控制。<\/p>\n<\/section>"},{"title":"D. internet browser developers","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.\n>\n> In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.\n>\n> 实际文序先列几种浏览器，随后使用行业这一集合称呼。\n\n标准解释将这两句读成由具体浏览器产品转向同一领域的开发者整体，这提供了D的回指路线。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The industry represented by these internet browser developers would take up the DNT issue.\n>\n> 这些互联网浏览器开发者所代表的行业将着手处理DNT问题。\n\nD所需的是把行业成员明确连到前列浏览器开发者。实际前句确有相应产品列举，因此标准答案采用这一联系；假设句只展开所指关系，没有声称开发者能够替广告商执行不追踪。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题 D选项","focus":[93,870,637,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":27,"option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q27-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-D-0\"><blockquote>\n<p>互联网浏览器开发者<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第3段<code>proposed<\/code>和<code>cracking<\/code>被显示为<code>[xxx]<\/code>，D完整显示。做题时依据Internet Explorer、Safari、Chrome的连续列举，把产品背后的开发者概括为相应行业，第一轮保留D，随后选择D；这与本题标准答案一致。<\/p>\n<p><strong>选项类型：局部推断。<\/strong><\/p>\n<p>本题标准采用从前句浏览器产品回指开发行业的解释。D把Internet Explorer、Safari和Chrome这些产品名称，概括成提供相应浏览器功能的开发者群体；其依据是相邻句中的同类列举，而不是把网站是否停止追踪的执行权交给浏览器。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the in d":"method","question":27,"option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q27-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-D-0\"><blockquote>\n<p>互联网浏览器开发者<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第3段<code>proposed<\/code>和<code>cracking<\/code>被显示为<code>[xxx]<\/code>，D完整显示。做题时依据Internet Explorer、Safari、Chrome的连续列举，把产品背后的开发者概括为相应行业，第一轮保留D，随后选择D；这与本题标准答案一致。<\/p>\n<p><strong>选项类型：局部推断。<\/strong><\/p>\n<p>本题标准采用从前句浏览器产品回指开发行业的解释。D把Internet Explorer、Safari和Chrome这些产品名称，概括成提供相应浏览器功能的开发者群体；其依据是相邻句中的同类列举，而不是把网站是否停止追踪的执行权交给浏览器。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q27-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第三段中的“the industry”指互联网浏览器开发者。<\/p>\n<\/blockquote>\n<p><code>internet browser developers<\/code>与前句三个浏览器名称形成产品和开发者的联系；题干中的集合名词<code>the industry<\/code>，在标准解读下承接这一产品领域。<\/p>\n<p>Internet Explorer和Safari已提供DNT，Chrome将在当年提供。前句连续列出不同公司的同类产品，标准答案据此把后句行业名称理解为这些浏览器背后的开发者。<\/p>\n<p>这一判断不能靠把<code>responding to DNT requests<\/code>直译成“浏览器代广告商停止追踪”来加强。浏览器可提供发送用户偏好的机制，追踪方是否执行请求是另一环节；第6段正是在讨论后一问题。<\/p>\n<p>D对应本题标准所采用的近前同类列举与行业概括，产品名称与开发者身份能相接，但不应由此增造浏览器对网站追踪行为的控制。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q27-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<p>实际文序先列几种浏览器，随后使用行业这一集合称呼。<\/p>\n<\/blockquote>\n<p>标准解释将这两句读成由具体浏览器产品转向同一领域的开发者整体，这提供了D的回指路线。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The industry represented by these internet browser developers would take up the DNT issue.<\/p>\n<p>这些互联网浏览器开发者所代表的行业将着手处理DNT问题。<\/p>\n<\/blockquote>\n<p>D所需的是把行业成员明确连到前列浏览器开发者。实际前句确有相应产品列举，因此标准答案采用这一联系；假设句只展开所指关系，没有声称开发者能够替广告商执行不追踪。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q27-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入27题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对微软“更多控制权”的声明持怀疑态度，不能单独判断第3段“the industry”的具体所指。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>internet browser developers<br>互联网浏览器开发者<\/p>\n<\/blockquote>\n<p>D不是因为“作者怀疑微软，而微软开发浏览器”就成立，这种跨越会把态度题当成词义解释。本项最终仍依据“Internet Explorer”“Safari”“Chrome”的近前同类列举，按本题标准解释确定为浏览器开发者；主旨不额外消除<code>responding<\/code>带来的角色关联。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<\/section>"},{"title":"27题结论","raw":"### 27题结论\n\n> **27. D. internet browser developers**\n\nA是段内真实的广告商角色，但不符合本题标准采用的近前浏览器列表回指。\n\nB由互联网场景补出第3段未建立的电子商务经营者身份。\n\nC把数据主题联想成未出现的分析人员群体。\n\nD按本题标准解释，将前句浏览器产品列举概括为开发者行业；这不等于浏览器替广告商执行停止追踪。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[18,528,966,410],"sourceW":1711,"sourceH":2572},"meta":{"kind":"conclusion","question":27},"level":3,"html":"<blockquote>\n<p><strong>27. D. internet browser developers<\/strong><\/p>\n<\/blockquote>\n<p>A是段内真实的广告商角色，但不符合本题标准采用的近前浏览器列表回指。<\/p>\n<p>B由互联网场景补出第3段未建立的电子商务经营者身份。<\/p>\n<p>C把数据主题联想成未出现的分析人员群体。<\/p>\n<p>D按本题标准解释，将前句浏览器产品列举概括为开发者行业；这不等于浏览器替广告商执行停止追踪。<\/p>\n"},{"title":"28题 · 题干、题型与核心出处","raw":"## 28题\n\n> Bob Liodice holds that setting DNT as a default ______.  \n> Bob Liodice认为，把DNT设为默认选项会怎样？\n\n### 题型\n\n这是一道人物观点题。`Bob Liodice holds`要求回答Bob的判断，不能把广告商、微软和作者的意见混为一谈。前文对默认设置习惯的说明交代政策怎样发生作用，Bob姓名后的条件句与广告数量、针对性两句共同说明他预言的消费者后果。\n\n### 核心出处\n\n> Advertisers are horrified.\n>\n> Human nature being what it is, most people stick with default settings.\n>\n> Few switch DNT on now, but if tracking is off it will stay off.\n>\n> Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.\n>\n> People will not get fewer ads, he says.\n>\n> “They’ll get less meaningful, less targeted ads.”\n\n多数用户沿用默认值，使默认拒绝追踪可能限制行业收集偏好信息。Bob据此认为消费者会`worse off`，并具体说明数量不会更少、广告却更不相关。题干中的默认设置通过这层数据收集条件与他的评价相连，不是无条件断言任何DNT安排都必然损害消费者。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[18,1040,1254,408],"sourceW":1711,"sourceH":2572},"meta":{"kind":"question","question":28},"level":2,"html":"<blockquote>\n<p>Bob Liodice holds that setting DNT as a default ______.<br>Bob Liodice认为，把DNT设为默认选项会怎样？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道人物观点题。<code>Bob Liodice holds<\/code>要求回答Bob的判断，不能把广告商、微软和作者的意见混为一谈。前文对默认设置习惯的说明交代政策怎样发生作用，Bob姓名后的条件句与广告数量、针对性两句共同说明他预言的消费者后果。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Advertisers are horrified.<\/p>\n<p>Human nature being what it is, most people stick with default settings.<\/p>\n<p>Few switch DNT on now, but if tracking is off it will stay off.<\/p>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<p>多数用户沿用默认值，使默认拒绝追踪可能限制行业收集偏好信息。Bob据此认为消费者会<code>worse off<\/code>，并具体说明数量不会更少、广告却更不相关。题干中的默认设置通过这层数据收集条件与他的评价相连，不是无条件断言任何DNT安排都必然损害消费者。<\/p>\n"},{"title":"A. goes against human nature","raw":"### A. goes against human nature\n\n> 违背人性\n\n**做题模式中的状态：** 当时第5段的`horrified`、`stick`、`preferences`和`meaningful`显示为`[xxx]`，A完整显示。做题时仍读出了多数人沿用默认设置这一前后关系，认为原文用人性解释默认值的持续作用，A却说违背人性，第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n选项抓住原文的`human nature`，把“人们往往顺着默认设置”的原因解释，改成“把DNT设为默认与人性相违背”。原文写默认值会借助人们不常更改设置的习惯产生效果，方向并不是逆着这种习惯。\n\n**出处：**\n\n> Human nature being what it is, most people stick with default settings.\n>\n> Few switch DNT on now, but if tracking is off it will stay off.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 A选项","focus":[93,1125,621,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":28,"option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q28-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-A-0\"><blockquote>\n<p>违背人性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第5段的<code>horrified<\/code>、<code>stick<\/code>、<code>preferences<\/code>和<code>meaningful<\/code>显示为<code>[xxx]<\/code>，A完整显示。做题时仍读出了多数人沿用默认设置这一前后关系，认为原文用人性解释默认值的持续作用，A却说违背人性，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>选项抓住原文的<code>human nature<\/code>，把“人们往往顺着默认设置”的原因解释，改成“把DNT设为默认与人性相违背”。原文写默认值会借助人们不常更改设置的习惯产生效果，方向并不是逆着这种习惯。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Human nature being what it is, most people stick with default settings.<\/p>\n<p>Few switch DNT on now, but if tracking is off it will stay off.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. goes against human nature","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Bob Liodice认为，把DNT设为默认选项违背人性。\n\n`human nature`定位到Bob姓名前的解释句，`setting DNT as a default`则要结合后一句追踪关闭后会保持关闭，辨清人性与默认设置的关系。\n\n原文先说多数人会沿用默认值，再说现在很少人主动开启DNT，但若追踪默认关闭，关闭状态会延续。这两句把用户不改设置视为默认DNT能够影响追踪的原因。\n\n`goes against`要求有与人性相冲突的评价。原文恰恰利用用户常沿用预设值的习惯解释后果；而且这段人性说明属于作者交代的背景，不能仅因离Bob发言近，就变成Bob说“违背人性”。\n\nA复现了名词，却将人性促进默认设置持续作用的关系改成了与默认设置冲突，也把背景说明错接成Bob的评价。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 A选项","focus":[93,1125,621,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":28,"option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q28-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-A-0\"><blockquote>\n<p>违背人性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第5段的<code>horrified<\/code>、<code>stick<\/code>、<code>preferences<\/code>和<code>meaningful<\/code>显示为<code>[xxx]<\/code>，A完整显示。做题时仍读出了多数人沿用默认设置这一前后关系，认为原文用人性解释默认值的持续作用，A却说违背人性，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>选项抓住原文的<code>human nature<\/code>，把“人们往往顺着默认设置”的原因解释，改成“把DNT设为默认与人性相违背”。原文写默认值会借助人们不常更改设置的习惯产生效果，方向并不是逆着这种习惯。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Human nature being what it is, most people stick with default settings.<\/p>\n<p>Few switch DNT on now, but if tracking is off it will stay off.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q28-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项违背人性。<\/p>\n<\/blockquote>\n<p><code>human nature<\/code>定位到Bob姓名前的解释句，<code>setting DNT as a default<\/code>则要结合后一句追踪关闭后会保持关闭，辨清人性与默认设置的关系。<\/p>\n<p>原文先说多数人会沿用默认值，再说现在很少人主动开启DNT，但若追踪默认关闭，关闭状态会延续。这两句把用户不改设置视为默认DNT能够影响追踪的原因。<\/p>\n<p><code>goes against<\/code>要求有与人性相冲突的评价。原文恰恰利用用户常沿用预设值的习惯解释后果；而且这段人性说明属于作者交代的背景，不能仅因离Bob发言近，就变成Bob说“违背人性”。<\/p>\n<p>A复现了名词，却将人性促进默认设置持续作用的关系改成了与默认设置冲突，也把背景说明错接成Bob的评价。<\/p>\n<\/section>"},{"title":"A. goes against human nature","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Human nature being what it is, most people stick with default settings.\n>\n> Few switch DNT on now, but if tracking is off it will stay off.\n>\n> Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.\n>\n> 实际先以用户沿用默认值解释追踪受限，再引出Bob对信息收集受限时消费者处境的判断。\n\n作者从人的习惯走向数据收集及消费者后果，没有转向默认DNT违背这种习惯。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Liodice says that making DNT the default runs against human nature.\n>\n> Liodice说，把DNT设为默认违背人性。\n\n若A成立，需要Bob作出这种冲突判断。实际引述给出的却是消费者在信息收集受限时境况更差的预测；人性是前面解释默认效果的原因，不是他批评的冲突对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 A选项","focus":[93 es.\n>\n> “They’ll get less meaningful, less targeted ads.”\n>\n> 实际写法从行业收集偏好信息受限，走向广告更不精准和消费者受损。\n\n消费者后果是通过广告业的工作方式变化推出来的，行业并不是这串后果之外的旁观者。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Liodice says that making DNT the default will leave the ad industry unaffected.\n>\n> Liodice说，把DNT设为默认将使广告业不受影响。\n\nB至少需要Bob把行业受影响这一环节拿掉。实际话语却以不能收集偏好信息为条件，再说明投放针对性下降；假设写法切断的正是Bob用于说明消费者后果的中间桥。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 B选项","focus":[93,1210,671,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":28,"option":"B","cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q28-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-B-0\"><blockquote>\n<p>无法对广告业产生影响<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B末尾的<code>industry<\/code>显示为<code>[xxx]<\/code>。第一轮认为Bob关于消费者处境的判断还不能完整否定广告端被遮挡对象的命题，因此暂时保留B，与C形成二选一。后来回查28题时，做题材料结合广告商担心数据收集、广告针对性受影响的内容，排除B，最后选C；不能把这段历史写成一开始就排除了B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用原文的<code>industry<\/code>，却把信息收集受限、广告针对性改变这一影响链改成行业不受影响。Bob预测消费者会更糟的前提，正是行业无法照常收集偏好信息，因此“广告业没有受到影响”不能概括他的观点。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Advertisers are horrified.<\/p>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q28-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项无法对广告业产生影响。<\/p>\n<\/blockquote>\n<p><code>Bob Liodice<\/code>定位到他的条件判断，<code>ad industry<\/code>对应其中<code>if the industry cannot collect information about their preferences<\/code>；要核对的是行业的信息获取是否会被触及。<\/p>\n<p>Bob先设定行业不能收集偏好信息的情形，再推到消费者处境更差，最后解释广告会更不相关、更不精准。条件中的信息限制发生在广告业，后果通过投放表现传到消费者。<\/p>\n<p>消费者受损本身并不能证明广告业的每个方面都受损，不能用两种主体粗暴互换。但原句还明确包含行业 dustry<\/code>，却把信息收集受限、广告针对性改变这一影响链改成行业不受影响。Bob预测消费者会更糟的前提，正是行业无法照常收集偏好信息，因此“广告业没有受到影响”不能概括他的观点。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Advertisers are horrified.<\/p>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q28-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项无法对广告业产生影响。<\/p>\n<\/blockquote>\n<p><code>Bob Liodice<\/code>定位到他的条件判断，<code>ad industry<\/code>对应其中<code>if the industry cannot collect information about their preferences<\/code>；要核对的是行业的信息获取是否会被触及。<\/p>\n<p>Bob先设定行业不能收集偏好信息的情形，再推到消费者处境更差，最后解释广告会更不相关、更不精准。条件中的信息限制发生在广告业，后果通过投放表现传到消费者。<\/p>\n<p>消费者受损本身并不能证明广告业的每个方面都受损，不能用两种主体粗暴互换。但原句还明确包含行业数据收集受限的中间环节，足以否定“对广告业不产生影响”这一概括；并不需要证明行业的利润、规模等指标全部变化。<\/p>\n<p>B抹掉了原文已经写出的广告业数据获取和投放针对性的变化，把有具体影响改成了不受影响。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q28-B-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<p>实际写法从行业收集偏好信息受限，走向广告更不精准和消费者受损。<\/p>\n<\/blockquote>\n<p>消费者后果是通过广告业的工作方式变化推出来的，行业并不是这串后果之外的旁观者。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Liodice says that making DNT the default will leave the ad industry unaffected.<\/p>\n<p>Liodice说，把DNT设为默认将使广告业不受影响。<\/p>\n<\/blockquote>\n<p>B至少需要Bob把行业受影响这一环节拿掉。实际话语却以不能收集偏好信息为条件，再说明投放针对性下降；假设写法切断的正是Bob用于说明消费者后果的中间桥。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q28-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入28题题干：<\/p>\n<blockquote>\n<p>全文对微软“更多控制权”的简单声明持怀疑态度，提示我们检查默认DNT的实际后果；但广告业是否受影响，仍须由Bob关于信息收集和投放的具体话语确定。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>fails to affect the ad industry<br>无法对广告业产生影响<\/p>\n<\/blockquote>\n<p>B不能仅因与作者的怀疑语气不同就被排除，怀疑本身不提供行业影响的事实。把主旨提醒的问题落回Bob的原句，可以看到“if the industry cannot collect information”这一局部条件：行业的数据获取已被纳入可能变化，B却把这个主体写成不受影响，因而不能概括其观点。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. will not benefit consumers","raw":"### C. will not benefit consumers\n\n> 不会让消费者受益\n\n**做题模式中的状态：** 当时C完整显示。虽然Bob句中的`preferences`以及后面的`meaningful`被显示为`[xxx]`，`consumers will be worse off`仍可读懂，因此第一轮保留C，同时暂留B。形成30题的怀疑态度判断后，又结合Bob所说消费者不会少看广告、只会看到更不精准的广告回查，最终选C。\n\n**选项类型：同义改写。**\n\n命题人把Bob的`consumers will be worse off`改写为消费者不会受益。原文说处境更差，选项采用较为概括的否定受益，没有改变对象和负面方向；它对应的是默认DNT限制偏好收集这一语境中的判断。\n\n**出处：**\n\n> Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.\n>\n> People will not get fewer ads, he says.\n>\n> “They’ll get less meaningful, less targeted ads.”","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 C选项","focus":[94,1295,617,58],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":28,"option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q28-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-C-0\"><blockquote>\n<p>不会让消费者受益<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。虽然Bob句中的<code>preferences<\/code>以及后面的<code>meaningful<\/code>被显示为<code>[xxx]<\/code>，<code>consumers will be worse off<\/code>仍可读懂，因此第一轮保留C，同时暂留B。形成30题的怀疑态度判断后，又结合Bob所说消费者不会少看广告、只会看到更不精准的广告回查，最终选C。<\/p>\n<p><strong>选项类型：同义改写。<\/strong><\/p>\n<p>命题人把Bob的<code>consumers will be worse off<\/code>改写为消费者不会受益。原文说处境更差，选项采用较为概括的否定受益，没有改变对象和负面方向；它对应的是默认DNT限制偏好收集这一语境中的判断。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. will not benefit consumers","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> Bob Liodice认为，把DNT设为默认选项不会让消费者受益。\n\n`Bob Liodice`直接定位人物发言，C的`not benefit consumers`与原文`consumers will be worse off`对应；还要把姓名后条件句和后面两句解释一起读完。\n\n条件句说如果广告业不能收集偏好信息，消费者处境会更差。接着Bob说广告数量不会减少，最后说明相关性和针对性会下降，这两句解释“更差”具体体现在哪里。\n\n选项接在默认DNT这一题干语境中，概括的是Bob对该安排的预期评价，并非说消费者在任何制度下、任何方面都绝不可能得益。原文的收集条件和后果解释仍构成它的适用范围。\n\nC以“不会受益”概括“处境更差”，由较具体的负面结果得到较宽的否定获益，没有倒置Bob的判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 C选项","focus":[94,1295,617,58],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":28,"option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q28-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-C-0\"><blockquote>\n<p>不会让消费者受益<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。虽然Bob句中的<code>preferences<\/code>以及后面的<code>meaningful<\/code>被显示为<code>[xxx]<\/code>，<code>consumers will be worse off<\/code>仍可读懂，因此第一轮保留C，同时暂留B。形成30题的怀疑态度判断后，又结合Bob所说消费者不会少看广告、只会看到更不精准的广告回查，最终选C。<\/p>\n<p><strong>选项类型：同义改写。<\/strong><\/p>\n<p>命题人把Bob的<code>consumers will be worse off<\/code>改写为消费者不会受益。原文说处境更差，选项采用较为概括的否定受益，没有改变对象和负面方向；它对应的是默认DNT限制偏好收集这一语境中的判断。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q28-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项不会让消费者受益。<\/p>\n<\/blockquote>\n<p><code>Bob Liodice<\/code>直接定位人物发言，C的<code>not benefit consumers<\/code>与原文<code>consumers will be worse off<\/code>对应；还要把姓名后条件句和后面两句解释一起读完。<\/p>\n<p>条件句说如果广告业不能收集偏好信息，消费者处境会更差。接着Bob说广告数量不会减少，最后说明相关性和针对性会下降，这两句解释“更差”具体体现在哪里。<\/p>\n<p>选项接在默认DNT这一题干语境中，概括的是Bob对该安排的预期评价，并非说消费者在任何制度下、任何方面都绝不可能得益。原文的收集条件和后果解释仍构成它的适用范围。<\/p>\n<p>C以“不会受益”概括“处境更差”，由较具体的负面结果得到较宽的否定获益，没有倒置Bob的判断。<\/p>\n<\/section>"},{"title":"C. will not benefit consumers","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.\n>\n> People will not get fewer ads, he says.\n>\n> “They’ll get less meaningful, less targeted ads.”\n>\n> 实际先给消费者境况更差的判断，再用广告数量不减、针对性下降加以解释。\n\nBob并未把不能追踪直接等同于消费者得到好处，而是追问他们最终收到的广告会怎样。\n\n如果C真是作者的意思，文章至少得写成：\n\n> If default DNT prevents the collection of preference data, consumers will not benefit: they will see ads that are less relevant to them.\n>\n> 如果默认DNT阻止偏好数据的收集，消费者不会受益：他们将看到与自己更不相关的广告。\n\nC所需的推进已在原文中出现。假设句保留信息收集受限这一条件，再将不相关广告连到不受益；真实发言的“更糟”和“更不精准”提供了同一关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 C选项","focus":[94,1295,617,58],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":28,"option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q28-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-C-0\"><blockquote>\n<p>不会让消费者受益<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。虽然Bob句中的<code>preferences<\/code>以及后面的<code>meaningful<\/code>被显示为<code>[xxx]<\/code>，<code>consumers will be worse off<\/code>仍可读懂，因此第一轮保留C，同时暂留B。形成30题的怀疑态度判断后，又结合Bob所说消费者不会少看广告、只会看到更不精准的广告回查，最终选C。<\/p>\n<p><strong>选项类型：同义改写。<\/strong><\/p>\n<p>命题人把Bob的<code>consumers will be worse off<\/code>改写为消费者不会受益。原文说处境更差，选项采用较为概括的否定受益，没有改变对象和负面方向；它对应的是默认DNT限制偏好收集这一语境中的判断。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q28-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项不会让消费者受益。<\/p>\n<\/blockquote>\n<p><code>Bob Liodice<\/code>直接定位人物发言，C的<code>not benefit consumers<\/code>与原文<code>consumers will be worse off<\/code>对应；还要把姓名后条件句和后面两句解释一起读完。<\/p>\n<p>条件句说如果广告业不能收集偏好信息，消费者处境会更差。接着Bob说广告数量不会减少，最后说明相关性和针对性会下降，这两句解释“更差”具体体现在哪里。<\/p>\n<p>选项接在默认DNT这一题干语境中，概括的是Bob对该安排的预期评价，并非说消费者在任何制度下、任何方面都绝不可能得益。原文的收集条件和后果解释仍构成它的适用范围。<\/p>\n<p>C以“不会受益”概括“处境更差”，由较具体的负面结果得到较宽的否定获益，没有倒置Bob的判断。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q28-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<p>实际先给消费者境况更差的判断，再用广告数量不减、针对性下降加以解释。<\/p>\n<\/blockquote>\n<p>Bob并未把不能追踪直接等同于消费者得到好处，而是追问他们最终收到的广告会怎样。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>If default DNT prevents the collection of preference data, consumers will not benefit: they will see ads that are less relevant to them.<\/p>\n<p>如果默认DNT阻止偏好数据的收集，消费者不会受益：他们将看到与自己更不相关的广告。<\/p>\n<\/blockquote>\n<p>C所需的推进已在原文中出现。假设句保留信息收集受限这一条件，再将不相关广告连到不受益；真实发言的“更糟”和“更不精准”提供了同一关系。<\/p>\n<\/section>"},{"title":"C. will not benefit consumers","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> skepticism  \n> 怀疑\n\n把这个主旨直接代入28题题干：\n\n> 全文怀疑微软“更多控制权”的声明是否足以解释其行动，因此要检查消费者是否真得到好处；Bob在这一争议中提出的是消费者可能得不到预期好处的理由。\n\nC实际说的是：\n\n> will not benefit consumers  \n> 不会让消费者受益\n\nC与这条检验方向一致，但作者的怀疑不能代替Bob的发言。真正坐实该项的是“consumers will be worse off”，以及数量不减、针对性下降的解释：主体都是消费者，结果都是否定受益。这里不能把Bob的看法扩成作者已全面认同广告业的所有主张。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 C选项","focus":[94,1295,617,58],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":28,"option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q28-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-C-0\"><blockquote>\n<p>不会让消费者受益<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。虽然Bob句中的<code>preferences<\/code>以及后面的<code>meaningful<\/code>被显示为<code>[xxx]<\/code>，<code>consumers will be worse off<\/code>仍可读懂，因此第一轮保留C，同时暂留B。形成30题的怀疑态度判断后，又结合Bob所说消费者不会少看广告、只会看到更不精准的广告回查，最终选C。<\/p>\n<p><strong>选项类型：同义改写。<\/strong><\/p>\n<p>命题人把Bob的<code>consumers will be worse off<\/code>改写为消费者不会受益。原文说处境更差，选项采用较为概括的否定受益，没有改变对象和负面方向；它对应的是默认DNT限制偏好收集这一语境中的判断。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q28-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项不会让消费者受益。<\/p>\n<\/blockquote>\n<p><code>Bob Liodice<\/code>直接定位人物发言，C的<code>not benefit consumers<\/code>与原文<code>consumers will be worse off<\/code>对应；还要把姓名后条件句和后面两句解释一起读完。<\/p>\n<p>条件句说如果广告业不能收集偏好信息，消费者处境会更差。接着Bob说广告数量不会减少，最后说明相关性和针对性会下降，这两句解释“更差”具体体现在哪里。<\/p>\n<p>选项接在默认DNT这一题干语境中，概括的是Bob对该安排的预期评价，并非说消费者在任何制度下、任何方面都绝不可能得益。原文的收集条件和后果解释仍构成它的适用范围。<\/p>\n<p>C以“不会受益”概括“处境更差”，由较具体的负面结果得到较宽的否定获益，没有倒置Bob的判断。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q28-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<p>实际先给消费者境况更差的判断，再用广告数量不减、针对性下降加以解释。<\/p>\n<\/blockquote>\n<p>Bob并未把不能追踪直接等同于消费者得到好处，而是追问他们最终收到的广告会怎样。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>If default DNT prevents the collection of preference data, consumers will not benefit: they will see ads that are less relevant to them.<\/p>\n<p>如果默认DNT阻止偏好数据的收集，消费者不会受益：他们将看到与自己更不相关的广告。<\/p>\n<\/blockquote>\n<p>C所需的推进已在原文中出现。假设句保留信息收集受限这一条件，再将不相关广告连到不受益；真实发言的“更糟”和“更不精准”提供了同一关系。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q28-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入28题题干：<\/p>\n<blockquote>\n<p>全文怀疑微软“更多控制权”的声明是否足以解释其行动，因此要检查消费者是否真得到好处；Bob在这一争议中提出的是消费者可能得不到预期好处的理由。<\/p>\n<\/blockquote>\n<p>C实际说的是：<\/p>\n<blockquote>\n<p>will not benefit consumers<br>不会让消费者受益<\/p>\n<\/blockquote>\n<p>C与这条检验方向一致，但作者的怀疑不能代替Bob的发言。真正坐实该项的是“consumers will be worse off”，以及数量不减、针对性下降的解释：主体都是消费者，结果都是否定受益。这里不能把Bob的看法扩成作者已全面认同广告业的所有主张。<\/p>\n<p><strong>复盘判断：C正确。<\/strong><\/p>\n<\/section>"},{"title":"D. may cut the number of junk ads","raw":"### D. may cut the number of junk ads\n\n> 可能减少垃圾广告的数量\n\n**做题模式中的状态：** 当时D完整显示。做题时读到了`People will not get fewer ads`以及`less targeted ads`，认为Bob说广告不会更少、针对性反而下降，因此第一轮排除D；后续没有重新保留。\n\n**错误类型：第一类——歪曲原意。**\n\n选项借用Bob谈广告数量和相关性的两句，把“总量不减、针对性下降”的负面解释改成“垃圾广告可能减少”的好处。要注意，单凭总量不减并不能在数学上排除某一子类数量下降；真正使D缺少支持的是Bob两句合在一起并未给出垃圾广告变少这条关系。\n\n**出处：**\n\n> People will not get fewer ads, he says.\n>\n> “They’ll get less meaningful, less targeted ads.”","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 D选项","focus":[93,1380,736,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":28,"option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q28-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-D-0\"><blockquote>\n<p>可能减少垃圾广告的数量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示。做题时读到了<code>People will not get fewer ads<\/code>以及<code>less targeted ads<\/code>，认为Bob说广告不会更少、针对性反而下降，因此第一轮排除D；后续没有重新保留。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>选项借用Bob谈广告数量和相关性的两句，把“总量不减、针对性下降”的负面解释改成“垃圾广告可能减少”的好处。要注意，单凭总量不减并不能在数学上排除某一子类数量下降；真正使D缺少支持的是Bob两句合在一起并未给出垃圾广告变少这条关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. may cut the number of junk ads","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Bob Liodice认为，把DNT设为默认选项可能减少垃圾广告的数量。\n\n`cut the number`对应`fewer ads`，`junk ads`还要求检查后面的`less meaningful, less targeted ads`究竟在说广告更合适，还是更不相关。\n\nBob先否定消费者收到的广告总数下降，然后说明广告会更缺少意义和针对性。两句连起来描述的是数量上的好处没有出现，投放质量还会变差。\n\nD的`may`只主张一种可能，并未断言必然减少，所以不能用“原文没说必然”反驳它。`junk ads`也不等于所有广告；但原文没有写某类垃圾广告被过滤掉，反而解释偏好信息减少后广告更不匹配。\n\nD把相关性变差的解释转成垃圾广告数量减少的可能收益；这个变化不是Bob所给出的观点，也不能仅由总量句的名词复现推出。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 D选项","focus":[93,1380,736,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":28,"option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q28-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-D-0\"><blockquote>\n<p>可能减少垃圾广告的数量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示。做题时读到了<code>People will not get fewer ads<\/code>以及<code>less targeted ads<\/code>，认为Bob说广告不会更少、针对性反而下降，因此第一轮排除D；后续没有重新保留。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>选项借用Bob谈广告数量和相关性的两句，把“总量不减、针对性下降”的负面解释改成“垃圾广告可能减少”的好处。要注意，单凭总量不减并不能在数学上排除某一子类数量下降；真正使D缺少支持的是Bob两句合在一起并未给出垃圾广告变少这条关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q28-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项可能减少垃圾广告的数量。<\/p>\n<\/blockquote>\n<p><code>cut the number<\/code>对应<code>fewer ads<\/code>，<code>junk ads<\/code>还要求检查后面的<code>less meaningful, less targeted ads<\/code>究竟在说广告更合适，还是更不相关。<\/p>\n<p>Bob先否定消费者收到的广告总数下降，然后说明广告会更缺少意义和针对性。两句连起来描述的是数量上的好处没有出现，投放质量还会变差。<\/p>\n<p>D的<code>may<\/code>只主张一种可能，并未断言必然减少，所以不能用“原文没说必然”反驳它。<code>junk ads<\/code>也不等于所有广告；但原文没有写某类垃圾广告被过滤掉，反而解释偏好信息减少后广告更不匹配。<\/p>\n<p>D把相关性变差的解释转成垃圾广告数量减少的可能收益；这个变化不是Bob所给出的观点，也不能仅由总量句的名词复现推出。<\/p>\n<\/section>"},{"title":"D. may cut the number of junk ads","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> People will not get fewer ads, he says.\n>\n> “They’ll get less meaningful, less targeted ads.”\n>\n> 实际写法否定广告总量减少，并强调广告更不相关、更不精准。\n\n第二句补充的是第一句之后的更差结果，不是在区分哪类广告数量会减少。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Liodice says that default DNT may reduce the number of junk ads consumers receive.\n>\n> Liodice说，默认DNT可能减少消费者收到的垃圾广告数量。\n\n若D成立，至少需要这条有关垃圾广告减少的可能结果。实际作者引述的是相关性下降，没有给出筛掉垃圾广告的推进；不能用“总量不变，所以所有子类都不变”这种并不存在的推理代替比较。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 D选项","focus":[93,1380,736,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":28,"option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q28-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-D-0\"><blockquote>\n<p>可能减少垃圾广告的数量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示。做题时读到了<code>People will not get fewer ads<\/code>以及<code>less targeted ads<\/code>，认为Bob说广告不会更少、针对性反而下降，因此第一轮排除D；后续没有重新保留。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>选项借用Bob谈广告数量和相关性的两句，把“总量不减、针对性下降”的负面解释改成“垃圾广告可能减少”的好处。要注意，单凭总量不减并不能在数学上排除某一子类数量下降；真正使D缺少支持的是Bob两句合在一起并未给出垃圾广告变少这条关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q28-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项可能减少垃圾广告的数量。<\/p>\n<\/blockquote>\n<p><code>cut the number<\/code>对应<code>fewer ads<\/code>，<code>junk ads<\/code>还要求检查后面的<code>less meaningful, less targeted ads<\/code>究竟在说广告更合适，还是更不相关。<\/p>\n<p>Bob先否定消费者收到的广告总数下降，然后说明广告会更缺少意义和针对性。两句连起来描述的是数量上的好处没有出现，投放质量还会变差。<\/p>\n<p>D的<code>may<\/code>只主张一种可能，并未断言必然减少，所以不能用“原文没说必然”反驳它。<code>junk ads<\/code>也不等于所有广告；但原文没有写某类垃圾广告被过滤掉，反而解释偏好信息减少后广告更不匹配。<\/p>\n<p>D把相关性变差的解释转成垃圾广告数量减少的可能收益；这个变化不是Bob所给出的观点，也不能仅由总量句的名词复现推出。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q28-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<p>实际写法否定广告总量减少，并强调广告更不相关、更不精准。<\/p>\n<\/blockquote>\n<p>第二句补充的是第一句之后的更差结果，不是在区分哪类广告数量会减少。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Liodice says that default DNT may reduce the number of junk ads consumers receive.<\/p>\n<p>Liodice说，默认DNT可能减少消费者收到的垃圾广告数量。<\/p>\n<\/blockquote>\n<p>若D成立，至少需要这条有关垃圾广告减少的可能结果。实际作者引述的是相关性下降，没有给出筛掉垃圾广告的推进；不能用“总量不变，所以所有子类都不变”这种并不存在的推理代替比较。<\/p>\n<\/section>"},{"title":"D. may cut the number of junk ads","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> skepticism  \n> 怀疑\n\n把这个主旨直接代入28题题干：\n\n> 全文要求审视微软所称的消费者控制权与实际后果；但这一怀疑不能直接决定垃圾广告的数量变化，仍须看Bob怎么解释。\n\n但D实际说的是：\n\n> may cut the number of junk ads  \n> 可能减少垃圾广告的数量\n\nD把消费者所得写成垃圾广告数量下降的可能好处，Bob却用“not get fewer ads”和“less targeted ads”解释不利结果。主旨只提示要查证收益是否落实，最终排除D靠的是他未给出垃圾广告减少这条关系，而不是认定怀疑态度可以算出广告数量。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题 D选项","focus":[93,1380,736,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":28,"option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q28-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-D-0\"><blockquote>\n<p>可能减少垃圾广告的数量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示。做题时读到了<code>People will not get fewer ads<\/code>以及<code>less targeted ads<\/code>，认为Bob说广告不会更少、针对性反而下降，因此第一轮排除D；后续没有重新保留。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>选项借用Bob谈广告数量和相关性的两句，把“总量不减、针对性下降”的负面解释改成“垃圾广告可能减少”的好处。要注意，单凭总量不减并不能在数学上排除某一子类数量下降；真正使D缺少支持的是Bob两句合在一起并未给出垃圾广告变少这条关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q28-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项可能减少垃圾广告的数量。<\/p>\n<\/blockquote>\n<p><code>cut the number<\/code>对应<code>fewer ads<\/code>，<code>junk ads<\/code>还要求检查后面的<code>less meaningful, less targeted ads<\/code>究竟在说广告更合适，还是更不相关。<\/p>\n<p>Bob先否定消费者收到的广告总数下降，然后说明广告会更缺少意义和针对性。两句连起来描述的是数量上的好处没有出现，投放质量还会变差。<\/p>\n<p>D的<code>may<\/code>只主张一种可能，并未断言必然减少，所以不能用“原文没说必然”反驳它。<code>junk ads<\/code>也不等于所有广告；但原文没有写某类垃圾广告被过滤掉，反而解释偏好信息减少后广告更不匹配。<\/p>\n<p>D把相关性变差的解释转成垃圾广告数量减少的可能收益；这个变化不是Bob所给出的观点，也不能仅由总量句的名词复现推出。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q28-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<p>实际写法否定广告总量减少，并强调广告更不相关、更不精准。<\/p>\n<\/blockquote>\n<p>第二句补充的是第一句之后的更差结果，不是在区分哪类广告数量会减少。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Liodice says that default DNT may reduce the number of junk ads consumers receive.<\/p>\n<p>Liodice说，默认DNT可能减少消费者收到的垃圾广告数量。<\/p>\n<\/blockquote>\n<p>若D成立，至少需要这条有关垃圾广告减少的可能结果。实际作者引述的是相关性下降，没有给出筛掉垃圾广告的推进；不能用“总量不变，所以所有子类都不变”这种并不存在的推理代替比较。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q28-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入28题题干：<\/p>\n<blockquote>\n<p>全文要求审视微软所称的消费者控制权与实际后果；但这一怀疑不能直接决定垃圾广告的数量变化，仍须看Bob怎么解释。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>may cut the number of junk ads<br>可能减少垃圾广告的数量<\/p>\n<\/blockquote>\n<p>D把消费者所得写成垃圾广告数量下降的可能好处，Bob却用“not get fewer ads”和“less targeted ads”解释不利结果。主旨只提示要查证收益是否落实，最终排除D靠的是他未给出垃圾广告减少这条关系，而不是认定怀疑态度可以算出广告数量。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"28题结论","raw":"### 28题结论\n\n> **28. C. will not benefit consumers**\n\nA将用户沿用默认值这一作用原因改成默认DNT违背人性。\n\nB把行业数据收集和广告针对性可能变化改成行业不受影响。\n\nC用不会受益概括Bob所说的消费者处境更差。\n\nD把数量不减、相关性下降的解释改成垃圾广告数量减少的可能好处。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[18,1040,1254,408],"sourceW":1711,"sourceH":2572},"meta":{"kind":"conclusion","question":28},"level":3,"html":"<blockquote>\n<p><strong>28. C. will not benefit consumers<\/strong><\/p>\n<\/blockquote>\n<p>A将用户沿用默认值这一作用原因改成默认DNT违背人性。<\/p>\n<p>B把行业数据收集和广告针对性可能变化改成行业不受影响。<\/p>\n<p>C用不会受益概括Bob所说的消费者处境更差。<\/p>\n<p>D把数量不减、相关性下降的解释改成垃圾广告数量减少的可能好处。<\/p>\n"},{"title":"29题 · 题干、题型与核心出处","raw":"## 29题\n\n> Which of the following is true according to Paragraph 6?  \n> 根据第六段，下面哪项正确？\n\n### 题型\n\n这是一道限定段落的判断题，需要把四个命题分别放回第6段。段首保留对广告商回应方式的不确定，第二句区别“没有强制约束”与“部分公司自愿承诺”，末句再解释为什么有人可能忽略信号。推断不得把`some`改成全体，也不得把`may`改成必然。\n\n### 核心出处\n\n> It is not yet clear how advertisers will respond.\n>\n> Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.\n>\n> Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.\n\n收到DNT信号不自动产生停止追踪的义务；广告商又不能判断信号来自主动反对还是默认设置，所以一些广告商可能继续追踪。段落说明的是执行存在落空的可能，没有给出消费者人气的变化，也没有宣布广告商的统一态度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[18,1550,1259,409],"sourceW":1711,"sourceH":2572},"meta":{"kind":"question","question":29},"level":2,"html":"<blockquote>\n<p>Which of the following is true according to Paragraph 6?<br>根据第六段，下面哪项正确？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道限定段落的判断题，需要把四个命题分别放回第6段。段首保留对广告商回应方式的不确定，第二句区别“没有强制约束”与“部分公司自愿承诺”，末句再解释为什么有人可能忽略信号。推断不得把<code>some<\/code>改成全体，也不得把<code>may<\/code>改成必然。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>It is not yet clear how advertisers will respond.<\/p>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<p>收到DNT信号不自动产生停止追踪的义务；广告商又不能判断信号来自主动反对还是默认设置，所以一些广告商可能继续追踪。段落说明的是执行存在落空的可能，没有给出消费者人气的变化，也没有宣布广告商的统一态度。<\/p>\n"},{"title":"A. Advertisers are willing to implement DNT.","raw":"### A. Advertisers are willing to implement DNT.\n\n> 广告商愿意实施DNT。\n\n**做题模式中的状态：** 当时第6段`oblige`、`objects`和`press`被显示为`[xxx]`，A完整显示。做题时把部分公司已经承诺与段首“回应方式还不清楚”相比较，认为不能据此给广告商整体贴上愿意实施的判断，第一轮排除A，后续未改判。\n\n**错误类型：第一类——歪曲原意。**\n\n命题人抓住`some companies have promised to do so`这处真实承诺，把部分公司的态度改成对广告商的概括性评价。错误不在于广告商中没有人愿意，而在于作者把回应方式保留为不清楚，且接着写有人可能忽略请求，不能据此概括行业愿意实施。\n\n**出处：**\n\n> It is not yet clear how advertisers will respond.\n>\n> Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.\n>\n> Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 A选项","focus":[93,1635,955,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":29,"option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q29-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-A-0\"><blockquote>\n<p>广告商愿意实施DNT。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第6段<code>oblige<\/code>、<code>objects<\/code>和<code>press<\/code>被显示为<code>[xxx]<\/code>，A完整显示。做题时把部分公司已经承诺与段首“回应方式还不清楚”相比较，认为不能据此给广告商整体贴上愿意实施的判断，第一轮排除A，后续未改判。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人抓住<code>some companies have promised to do so<\/code>这处真实承诺，把部分公司的态度改成对广告商的概括性评价。错误不在于广告商中没有人愿意，而在于作者把回应方式保留为不清楚，且接着写有人可能忽略请求，不能据此概括行业愿意实施。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>It is not yet clear how advertisers will respond.<\/p>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. Advertisers are willing to implement DNT.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第六段，广告商愿意实施DNT。\n\n`willing to implement`可联系`have promised to do so`，但必须同时定位限定词`some`以及段首的`not yet clear`，确认这种意愿覆盖什么范围。\n\n部分公司承诺停止追踪，说明确有愿意配合的公司；段首没有把这类承诺上升为对广告商回应的确定判断，末句还保留一些广告商可能忽略信号的另一方向。\n\nA没有写`all`，不应把它夸张成“每一家广告商都愿意”。但裸复数`Advertisers are willing`仍是在概括这一类主体的态度；第6段所支持的是反应未定、存在部分承诺与可能忽略，并非这种总体倾向已经确立。\n\nA把局部承诺改为行业的概括态度，舍弃了整段关于回应尚不确定、部分广告商可能继续追踪的关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 A选项","focus":[93,1635,955,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":29,"option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q29-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-A-0\"><blockquote>\n<p>广告商愿意实施DNT。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第6段<code>oblige<\/code>、<code>objects<\/code>和<code>press<\/code>被显示为<code>[xxx]<\/code>，A完整显示。做题时把部分公司已经承诺与段首“回应方式还不清楚”相比较，认为不能据此给广告商整体贴上愿意实施的判断，第一轮排除A，后续未改判。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人抓住<code>some companies have promised to do so<\/code>这处真实承诺，把部分公司的态度改成对广告商的概括性评价。错误不在于广告商中没有人愿意，而在于作者把回应方式保留为不清楚，且接着写有人可能忽略请求，不能据此概括行业愿意实施。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>It is not yet clear how advertisers will respond.<\/p>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q29-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，广告商愿意实施DNT。<\/p>\n<\/blockquote>\n<p><code>willing to implement<\/code>可联系<code>have promised to do so<\/code>，但必须同时定位限定词<code>some<\/code>以及段首的<code>not yet clear<\/code>，确认这种意愿覆盖什么范围。<\/p>\n<p>部分公司承诺停止追踪，说明确有愿意配合的公司；段首没有把这类承诺上升为对广告商回应的确定判断，末句还保留一些广告商可能忽略信号的另一方向。<\/p>\n<p>A没有写<code>all<\/code>，不应把它夸张成“每一家广告商都愿意”。但裸复数<code>Advertisers are willing<\/code>仍是在概括这一类主体的态度；第6段所支持的是反应未定、存在部分承诺与可能忽略，并非这种总体倾向已经确立。<\/p>\n<p>A把局部承诺改为行业的概括态度，舍弃了整段关于回应尚不确定、部分广告商可能继续追踪的关系。<\/p>\n<\/section>"},{"title":"A. Advertisers are willing to implement DNT.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It is not yet clear how advertisers will respond.\n>\n> Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.\n>\n> 作者先说广告商如何回应尚不清楚，末尾说明有人可能因无法辨别真实意愿而忽略DNT信号。\n\n部分承诺出现在这一不确定背景中，后文没有把它扩展成行业趋于愿意实施的结论。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Advertisers are willing to act on DNT requests and stop tracking users who send them.\n>\n> 广告商愿意按DNT请求行事，停止追踪发出请求的用户。\n\n若A成立，至少应有这样的概括性愿意配合的说明，不需要写成毫无例外的全员保证。实际末句却保留可能忽略请求的路线，段首也未确定行业反应；部分公司的承诺不足以把真实推进改成假设路线。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 A选项","focus":[93,1635,955,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":29,"option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q29-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-A-0\"><blockquote>\n<p>广告商愿意实施DNT。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第6段<code>oblige<\/code>、<code>objects<\/code>和<code>press<\/code>被显示为<code>[xxx]<\/code>，A完整显示。做题时把部分公司已经承诺与段首“回应方式还不清楚”相比较，认为不能据此给广告商整体贴上愿意实施的判断，第一轮排除A，后续未改判。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人抓住<code>some companies have promised to do so<\/code>这处真实承诺，把部分公司的态度改成对广告商的概括性评价。错误不在于广告商中没有人愿意，而在于作者把回应方式保留为不清楚，且接着写有人可能忽略请求，不能据此概括行业愿意实施。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>It is not yet clear how advertisers will respond.<\/p>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q29-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，广告商愿意实施DNT。<\/p>\n<\/blockquote>\n<p><code>willing to implement<\/code>可联系<code>have promised to do so<\/code>，但必须同时定位限定词<code>some<\/code>以及段首的<code>not yet clear<\/code>，确认这种意愿覆盖什么范围。<\/p>\n<p>部分公司承诺停止追踪，说明确有愿意配合的公司；段首没有把这类承诺上升为对广告商回应的确定判断，末句还保留一些广告商可能忽略信号的另一方向。<\/p>\n<p>A没有写<code>all<\/code>，不应把它夸张成“每一家广告商都愿意”。但裸复数<code>Advertisers are willing<\/code>仍是在概括这一类主体的态度；第6段所支持的是反应未定、存在部分承诺与可能忽略，并非这种总体倾向已经确立。<\/p>\n<p>A把局部承诺改为行业的概括态度，舍弃了整段关于回应尚不确定、部分广告商可能继续追踪的关系。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q29-A-2\"><h3>写作视角法<\/h3> 段DNT让用户表达不想被追踪的用途；第6段真正决定能否落实的是<code>ignore a DNT signal and press on anyway<\/code>。<\/p>\n<p>第6段先说收到信号并不强制停止追踪，再说广告商无法区分主动拒绝与默认设置。于是有人可能忽略信号继续追踪，这给出了用户表达了拒绝、追踪却没有停止的情形。<\/p>\n<p>B没有把“可能失效”说成“必定失效”，也没有抹去一些公司承诺响应的事实。即使部分请求能被尊重，只要原文支持另一些请求可能落空，就能支持DNT有时无法达到预期目的。<\/p>\n<p>B把信号可能被忽略的具体行为，概括为原本防止追踪的意愿可能不能落实，因果和情态都与原文相接。<\/p>\n<\/section>"},{"title":"B. DNT may not serve its intended purpose.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.\n>\n> Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.\n>\n> 实际从缺少强制约束和无法判断真实意愿，推到一些广告商可能忽略信号。\n\n末句把制度和识别上的问题落实为继续追踪的可能后果，为目的无法兑现提供了具体原因。\n\n如果B真是作者的意思，文章至少得写成：\n\n> If advertisers ignore the signal and continue tracking, DNT may fail to give users the protection they intend to request.\n>\n> 如果广告商忽略信号并继续追踪，DNT就可能无法实现用户本来想请求的保护。\n\nB所需要的条件和结果都能在原文推进中找到：信号可能被忽略，追踪可能继续。假设句只明确点出这一行为与DNT预期用途之间的差距，没有把可能性升级成普遍失败。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 B选项","focus":[93,1721,917,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":29,"option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q29-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-B-0\"><blockquote>\n<p>DNT可能达不到预期目的。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第6段有<code>oblige<\/code>、<code>objects<\/code>、<code>press<\/code>显示为<code>[xxx]<\/code>，但仍读到了<code>some may ignore a DNT signal<\/code>，并结合前文知道DNT在表达用户不想被追踪。做题时据此认为信号若被忽略，预期目的可能落空，第一轮保留B，随后选B。<\/p>\n<p><strong>选项类型：局部推断。<\/strong><\/p>\n<p>命题人把“有些广告商可能忽略DNT信号并继续追踪”概括为DNT可能达不到预期目的。原文的<code>some may<\/code>只给出落空的可能，B用<code>may not<\/code>保留这一限度，没有宣布DNT全部失效。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q29-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，DNT可能达不到预期目的。<\/p>\n<\/blockquote>\n<p><code>intended purpose<\/code>需要接回第3段DNT让用户表达不想被追踪的用途；第6段真正决定能否落实的是<code>ignore a DNT signal and press on anyway<\/code>。<\/p>\n<p>第6段先说收到信号并不强制停止追踪，再说广告商无法区分主动拒绝与默认设置。于是有人可能忽略信号继续追踪，这给出了用户表达了拒绝、追踪却没有停止的情形。<\/p>\n<p>B没有把“可能失效”说成“必定失效”，也没有抹去一些公司承诺响应的事实。即使部分请求能被尊重，只要原文支持另一些请求可能落空，就能支持DNT有时无法达到预期目的。<\/p>\n<p>B把信号可能被忽略的具体行为，概括为原本防止追踪的意愿可能不能落实，因果和情态都与原文相接。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q29-B-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<p>实际从缺少强制约束和无法判断真实意愿，推到一些广告商可能忽略信号。<\/p>\n<\/blockquote>\n<p>末句把制度和识别上的问题落实为继续追踪的可能后果，为目的无法兑现提供了具体原因。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>If advertisers ignore the signal and continue tracking, DNT may fail to give users the protection they intend to request.<\/p>\n<p>如果广告商忽略信号并继续追踪，DNT就可能无法实现用户本来想请求的保护。<\/p>\n<\/blockquote>\n<p>B所需要的条件和结果都能在原文推进中找到：信号可能被忽略，追踪可能继续。假设句只明确点出这一行为与DNT预期用途之间的差距，没有把可能性升级成普遍失败。<\/p>\n<\/section>"},{"title":"B. DNT may not serve its intended purpose.","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> skepticism  \n> 怀疑\n\n把这个主旨直接代入29题题干：\n\n> 作者对“更多控制权”的简单声明持怀疑态度，第6段具体指出执行可能不随信号落实，因此DNT可能无法实现用户拒绝追踪的预期。\n\nB实际说的是：\n\n> DNT may not serve its intended purpose.  \n> DNT可能达不到预期目的。\n\nB给出的是有依据的效果疑问，与作者要求进一步检验控制权声明的方向相符。关键仍是“some may ignore a DNT signal and press on anyway”：它既提供目的可能落空的行为，也用`may`限制程度。不能只凭作者怀疑，就把B扩大成DNT必然无效。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 B选项","focus":[93,1721,917,68],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":29,"option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q29-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-B-0\"><blockquote>\n<p>DNT可能达不到预期目的。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第6段有<code>oblige<\/code>、<code>objects<\/code>、<code>press<\/code>显示为<code>[xxx]<\/code>，但仍读到了<code>some may ignore a DNT signal<\/code>，并结合前文知道DNT在表达用户不想被追踪。做题时据此认为信号若被忽略，预期目的可能落空，第一轮保留B，随后选B。<\/p>\n<p><strong>选项类型：局部推断。<\/strong><\/p>\n<p>命题人把“有些广告商可能忽略DNT信号并继续追踪”概括为DNT可能达不到预期目的。原文的<code>some may<\/code>只给出落空的可能，B用<code>may not<\/code>保留这一限度，没有宣布DNT全部失效。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q29-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，DNT可能达不到预期目的。<\/p>\n<\/blockquote>\n<p><code>intended purpose<\/code>需要接回第3段DNT让用户表达不想被追踪的用途；第6段真正决定能否落实的是<code>ignore a DNT signal and press on anyway<\/code>。<\/p>\n<p>第6段先说收到信号并不强制停止追踪，再说广告商无法区分主动拒绝与默认设置。于是有人可能忽略信号继续追踪，这给出了用户表达了拒绝、追踪却没有停止的情形。<\/p>\n<p>B没有把“可能失效”说成“必定失效”，也没有抹去一些公司承诺响应的事实。即使部分请求能被尊重，只要原文支持另一些请求可能落空，就能支持DNT有时无法达到预期目的。<\/p>\n<p>B把信号可能被忽略的具体行为，概括为原本防止追踪的意愿可能不能落实，因果和情态都与原文相接。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q29-B-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<p>实际从缺少强制约束和无法判断真实意愿，推到一些广告商可能忽略信号。<\/p>\n<\/blockquote>\n<p>末句把制度和识别上的问题落实为继续追踪的可能后果，为目的无法兑现提供了具体原因。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>If advertisers ignore the signal and continue tracking, DNT may fail to give users the protection they intend to request.<\/p>\n<p>如果广告商忽略信号并继续追踪，DNT就可能无法实现用户本来想请求的保护。<\/p>\n<\/blockquote>\n<p>B所需要的条件和结果都能在原文推进中找到：信号可能被忽略，追踪可能继续。假设句只明确点出这一行为与DNT预期用途之间的差距，没有把可能性升级成普遍失败。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q29-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入29题题干：<\/p>\n<blockquote>\n<p>作者对“更多控制权”的简单声明持怀疑态度，第6段具体指出执行可能不随信号落实，因此DNT可能无法实现用户拒绝追踪的预期。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>DNT may not serve its intended purpose.<br>DNT可能达不到预期目的。<\/p>\n<\/blockquote>\n<p>B给出的是有依据的效果疑问，与作者要求进一步检验控制权声明的方向相符。关键仍是“some may ignore a DNT signal and press on anyway”：它既提供目的可能落空的行为，也用<code>may<\/code>限制程度。不能只凭作者怀疑，就把B扩大成DNT必然无效。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<\/section>"},{"title":"C. DNT is losing its popularity among consumers.","raw":"### C. DNT is losing its popularity among consumers.\n\n> DNT正在消费者中失去人气。\n\n**做题模式中的状态：** 当时C完整显示。做题时对照第6段“无法区分真实反对还是沿用默认设置”，认为原文没有提供消费者欢迎程度随时间下降的趋势，第一轮排除C，后续没有改变。\n\n**错误类型：第三类——无中生有。**\n\n选项借用用户真实意愿无法从默认信号中分辨这一事实，补出消费者越来越不喜欢DNT的趋势。无法判断某次信号是否代表主动选择，不等于已经观察到欢迎程度下降。\n\n**出处：**\n\n> Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 C选项","focus":[94,1805,1038,69],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":29,"option":"C","cumulative":true,"cumulative ass=\"revealPart\" id=\"focus-q29-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，DNT正在消费者中失去人气。<\/p>\n<\/blockquote>\n<p><code>among consumers<\/code>使我们注意末句关于用户意愿的两种来源；<code>is losing<\/code>则要求原文提供随时间下降的比较，而非仅仅出现“不清楚用户怎么想”。<\/p>\n<p>末句列出两种解释：用户确实反对行为广告，或用户只是沿用微软预设值。广告商不能区分它们，所以可能忽略信号。这里不确定的是现有信号的含义。<\/p>\n<p>C需要消费者对DNT的支持或使用意愿从较高变低的证据。原文既未给前后时间比较，也没有把真实反对行为广告等同于对DNT本身不欢迎，两个评价对象不能混在一起。<\/p>\n<p>C新增了对DNT人气下降的时间趋势；原文只是对信号能否代表主动选择提出辨别困难。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q29-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<p>实际末句把无法判断用户真实意愿连接到广告商可能忽略信号。<\/p>\n<\/blockquote>\n<p>后果发生在广告商的响应决策上，作者没有继续讨论消费者对DNT的支持率如何变化。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>DNT is becoming less popular among consumers.<\/p>\n<p>DNT正变得越来越不受消费者欢迎。<\/p>\n<\/blockquote>\n<p>若C成立，文章至少应出现这种前后变化的判断。实际写法没有评价DNT的人气走向，而是解释广告商为什么可能不把信号当作主动拒绝，二者的主体与结果都不同。<\/p>\n<\/section>"},{"title":"C. DNT is losing its popularity among consumers.","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> skepticism  \n> 怀疑\n\n把这个主旨直接代入29题题干：\n\n> 全文主旨只能确认作者怀疑微软的简单解释，不能判断消费者对DNT的欢迎程度是否正在下降。\n\n但C实际说的是：\n\n> DNT is losing its popularity among consumers.  \n> DNT正在消费者中失去人气。\n\n作者的怀疑不是消费者的人气调查，执行可能失败也不等于用户更不欢迎。C最终仍要有局部趋势证据；“Unable to tell whether”只说明信号来源难以辨别，未提供C的下降关系。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 C选项","focus":[94,1805,1038,69],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":29,"option":"C","cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q29-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-C-0\"><blockquote>\n<p>DNT正在消费者中失去人气。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。做题时对照第6段“无法区分真实反对还是沿用默认设置”，认为原文没有提 。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. Advertisers are obliged to offer behavioural ads.","raw":"### D. Advertisers are obliged to offer behavioural ads.\n\n> 广告商有义务提供行为广告。\n\n**做题模式中的状态：** 当时选项中的`behavioural`显示为`[xxx]`，原文的`oblige`也被遮挡。做题时仍读到了前面的否定和后面可能忽略信号的行为，认为这不能支持广告商必须提供某类广告的义务，第一轮排除D；不是恢复广告类别之后才发现错误。\n\n**错误类型：第一类——歪曲原意。**\n\n命题人借用原文的义务表达，却把“收到DNT信号并不强制停止追踪”改成“广告商必须提供行为广告”。否定方向和动作对象同时改变。原文没有强制停止某事，不表示广告商因此有义务提供另一种服务。\n\n**出处：**\n\n> Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.\n>\n> Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 D选项","focus":[93,1890,1061,69],"sourceW":1711,"sourceH":2572},"meta":{"kind":"option","question":29,"option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q29-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-D-0\"><blockquote>\n<p>广告商有义务提供行为广告。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项中的<code>behavioural<\/code>显示为<code>[xxx]<\/code>，原文的<code>oblige<\/code>也被遮挡。做题时仍读到了前面的否定和后面可能忽略信号的行为，认为这不能支持广告商必须提供某类广告的义务，第一轮排除D；不是恢复广告类别之后才发现错误。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人借用原文的义务表达，却把“收到DNT信号并不强制停止追踪”改成“广告商必须提供行为广告”。否定方向和动作对象同时改变。原文没有强制停止某事，不表示广告商因此有义务提供另一种服务。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. Advertisers are obliged to offer behavioural ads.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据第六段，广告商有义务提供行为广告。\n\n`are obliged`对应原文`does not oblige`，但不能只看是否同根；还要看原文义务后接的`stop tracking`与选项的`offer behavioural ads`是不是同一动作。\n\n原文讨论DNT信号是否使接收方必须停止追踪，回答是并不产生这种强制约束。随后举出可能忽略信号继续追踪的回应，说明请求未必落实。\n\n“没有被强制停止追踪”与“有义务投放行为广告”并非正反命题。前者既不建立后者，也不需要读者证明现实中绝无任何广告义务；题目只问本段支持什么，D的提供义务在本段没有依据。\n\nD把一个被否定的停止追踪义务，改成被肯定的提供行为广告义务，既换了肯否，也换了行动，无法作为原句的改写。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 D选项","focus":[93,1890,1061,69],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":29,"option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q29-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-D-0\"><blockquote>\n<p>广告商有义务提供行为广告。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项中的<code>behavioural<\/code>显示为<code>[xxx]<\/code>，原文的<code>oblige<\/code>也被遮挡。做题时仍读到了前面的否定和后面可能忽略信号的行为，认为这不能支持广告商必须提供某类广告的义务，第一轮排除D；不是恢复广告类别之后才发现错误。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人借用原文的义务表达，却把“收到DNT信号并不强制停止追踪”改成“广告商必须提供行为广告”。否定方向和动作对象同时改变。原文没有强制停止某事，不表示广告商因此有义务提供另一种服务。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q29-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，广告商有义务提供行为广告。<\/p>\n<\/blockquote>\n<p><code>are obliged<\/code>对应原文<code>does not oblige<\/code>，但不能只看是否同根；还要看原文义务后接的<code>stop tracking<\/code>与选项的<code>offer behavioural ads<\/code>是不是同一动作。<\/p>\n<p>原文讨论DNT信号是否使接收方必须停止追踪，回答是并不产生这种强制约束。随后举出可能忽略信号继续追踪的回应，说明请求未必落实。<\/p>\n<p>“没有被强制停止追踪”与“有义务投放行为广告”并非正反命题。前者既不建立后者，也不需要读者证明现实中绝无任何广告义务；题目只问本段支持什么，D的提供义务在本段没有依据。<\/p>\n<p>D把一个被否定的停止追踪义务，改成被肯定的提供行为广告义务，既换了肯否，也换了行动，无法作为原句的改写。<\/p>\n<\/section>"},{"title":"D. Advertisers are obliged to offer behavioural ads.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.\n>\n> Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.\n>\n> 作者实际先说明停止追踪不具有强制性，再解释有人可能选择忽略请求。\n\n后续落点是追踪是否继续，并没有转成广告商必须向消费者提供哪类广告。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Advertisers have an obligation to offer behavioural ads.\n>\n> 广告商负有提供行为广告的义务。\n\nD至少需要这种提供行为广告的义务陈述。实际没有此类要求，只有对停止追踪约束力的讨论；即使有人继续追踪，也不能把他的选择或可能行为写成必须提供广告的责任。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 D选项","focus":[93,1890,1061,69],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":29,"option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q29-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-D-0\"><blockquote>\n<p>广告商有义务提供行为广告。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项中的<code>behavioural<\/code>显示为<code>[xxx]<\/code>，原文的<code>oblige<\/code>也被遮挡。做题时仍读到了前面的否定和后面可能忽略信号的行为，认为这不能支持广告商必须提供某类广告的义务，第一轮排除D；不是恢复广告类别之后才发现错误。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人借用原文的义务表达，却把“收到DNT信号并不强制停止追踪”改成“广告商必须提供行为广告”。否定方向和动作对象同时改变。原文没有强制停止某事，不表示广告商因此有义务提供另一种服务。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q29-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，广告商有义务提供行为广告。<\/p>\n<\/blockquote>\n<p><code>are obliged<\/code>对应原文<code>does not oblige<\/code>，但不能只看是否同根；还要看原文义务后接的<code>stop tracking<\/code>与选项的<code>offer behavioural ads<\/code>是不是同一动作。<\/p>\n<p>原文讨论DNT信号是否使接收方必须停止追踪，回答是并不产生这种强制约束。随后举出可能忽略信号继续追踪的回应，说明请求未必落实。<\/p>\n<p>“没有被强制停止追踪”与“有义务投放行为广告”并非正反命题。前者既不建立后者，也不需要读者证明现实中绝无任何广告义务；题目只问本段支持什么，D的提供义务在本段没有依据。<\/p>\n<p>D把一个被否定的停止追踪义务，改成被肯定的提供行为广告义务，既换了肯否，也换了行动，无法作为原句的改写。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q29-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<p>作者实际先说明停止追踪不具有强制性，再解释有人可能选择忽略请求。<\/p>\n<\/blockquote>\n<p>后续落点是追踪是否继续，并没有转成广告商必须向消费者提供哪类广告。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Advertisers have an obligation to offer behavioural ads.<\/p>\n<p>广告商负有提供行为广告的义务。<\/p>\n<\/blockquote>\n<p>D至少需要这种提供行为广告的义务陈述。实际没有此类要求，只有对停止追踪约束力的讨论；即使有人继续追踪，也不能把他的选择或可能行为写成必须提供广告的责任。<\/p>\n<\/section>"},{"title":"D. Advertisers are obliged to offer behavioural ads.","raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> skepticism  \n> 怀疑\n\n把这个主旨直接代入29题题干：\n\n> 全文主旨只能提示微软“更多控制权”的声明需要接受实际执行的检验，不能判断广告商是否负有提供行为广告的特定义务。\n\n但D实际说的是：\n\n> Advertisers are obliged to offer behavioural ads.  \n> 广告商有义务提供行为广告。\n\nD把执行疑问变成一项广告提供义务，怀疑态度既不能创设也不能取消这种义务。本项最终仍要根据“does not oblige anyone to stop tracking”判断，原文没有D所说的肯定义务与提供动作。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题 D选项","focus":[93,1890,1061,69],"sourceW":1711,"sourceH":2572},"meta":{"kind":"method","question":29,"option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q29-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q29-D-0\"><blockquote>\n<p>广告商有义务提供行为广告。<\/p>\n<\/
