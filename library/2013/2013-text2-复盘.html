改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n<h2>30题<\/h2>\n<p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<p>作者对Brendon Lynch博客中那句话持什么态度？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>appreciation<\/strong><\/p>\n<p>赞赏<\/p>\n<p>B. <strong>understanding<\/strong><\/p>\n<p>理解<\/p>\n<p>C. <strong>indulgence<\/strong><\/p>\n<p>纵容<\/p>\n<p>D. <strong>skepticism<\/strong><\/p>\n<p>怀疑<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先说行为广告理论上能减少广告预算浪费，把广告投给更可能购买的人<\/td>\n<td>先说一种新办法看起来很有效<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>提出争议：用户应当默认被追踪，还是必须先明确同意<\/td>\n<td>再说是否默认接受的问题<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>交代监管机构提议引入DNT、各浏览器提供这一功能，以及监管机构与广告联盟就行业回应请求达成约定<\/td>\n<td>接着说各方先答应处理<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>写微软把DNT设为浏览器默认选项，由此把争议推到台前<\/td>\n<td>然后写有人突然改了默认做法<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>写广告商担心数据收集受限，认为消费者不会少看广告，只会看到更不精准的广告<\/td>\n<td>再说反对者为什么不高兴<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>指出DNT信号并不必然迫使停止追踪，广告商可能忽略它继续<\/td>\n<td>但话说回来：实际效果还不确定<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>继续质疑微软单独行动的动机和效果，并用反问回应“给消费者更多控制权”这句口号<\/td>\n<td>最后下结论：一句漂亮话未必够用<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<h3>A. appreciation<\/h3>\n<p>赞赏<\/p>\n<h4>如果 A 是主旨，文章7段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>赞赏<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先说明行为广告通过分析用户行为提高投放效率，看起来能够减少浪费，为赞赏消费者在有效广告技术面前仍应掌握选择权建立背景<\/td>\n<td>先说一种新办法看起来很有效<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再讨论使用有效追踪技术是否可以默认取得用户同意，提出消费者有权决定是否接受追踪，使“更多控制权”成为值得肯定的原则<\/td>\n<td>再说是否默认接受的问题<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>接着写监管机构、浏览器与广告方面答应提供拒绝追踪的入口并处理请求，把这些承诺视为认可消费者控制权的积极起点<\/td>\n<td>接着说各方先答应处理<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>然后写微软突然把拒绝追踪设为默认，说明这一改变使是否由用户掌握追踪选择成为现实议题，为赞赏其公开承认用户权利提供具体事件<\/td>\n<td>然后写有人突然改了默认做法<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>再解释反对者因行为数据和广告针对性受到影响而不满，指出这些商业顾虑使微软公开肯定消费者控制权显得值得赞赏<\/td>\n<td>再说反对者为什么不高兴<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>转而承认默认设置能否被执行、能否实际增加控制权仍不确定，把对权利原则的赞赏与对落地成效的审慎区分开<\/td>\n<td>但话说回来：实际效果还不确定<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>最后肯定“消费者应该拥有更多控制权”这一声明的价值，同时要求兑现为可执行的措施：值得赞赏的漂亮话本身仍未必够用<\/td>\n<td>最后下结论：一句漂亮话未必够用<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>A说的是作者赞赏Brendon Lynch所说的“消费者应有更多控制权”。赞赏这项原则并不要求作者认定DNT已经完美实施，所以不能只因第6段写执行困难就排除A；上面的假想路线完全可以一面肯定原则，一面要求兑现。<\/p>\n<p>实际第7段的关注点却是微软为什么单独行动。作者先说<code>Also unclear<\/code>，再审视微软自己的广告业务、对谷歌的竞争意图和Windows 8卖点，最后把微软的自述接到反问<code>Could it really be that simple?<\/code>。这里是在追问这句声明是否足以解释微软的行动，没有出现把它评价为值得称赞的收束。A所需的肯定评价，和实际结尾保留疑问的态度不同。<\/p>\n<p>判断：<\/p>\n<p><strong>A 不保留。<\/strong><\/p>\n<p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<h3>B. understanding<\/h3>\n<p>理解<\/p>\n<h4>如果 B 是主旨，文章7段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>理解<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先介绍行为广告看起来能减少浪费，说明商业技术越有效，消费者控制个人行为数据的愿望越值得理解<\/td>\n<td>先说一种新办法看起来很有效<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再讨论能否默认消费者接受追踪，展示用户不愿在没有明确选择时被追踪的处境，为理解微软声明中的控制权诉求作铺垫<\/td>\n<td>再说是否默认接受的问题<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>接着写有关各方先答应提供DNT并回应请求，说明微软声明所表达的用户诉求已经进入共同处理的议程<\/td>\n<td>接着说各方先答应处理<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>然后写微软突然改变默认做法，从用户不常修改设置的处境解释其行动，说明为何会说消费者应有更多控制权<\/td>\n<td>然后写有人突然改了默认做法<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>再解释反对者依赖追踪数据、担心失去广告针对性而不高兴，展示微软表达控制权诉求时面对的商业压力<\/td>\n<td>再说反对者为什么不高兴<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>转而说明实际控制效果仍不确定，但实现困难不妨碍理解微软为何提出这项诉求，区分理解其出发点与肯定其效果<\/td>\n<td>但话说回来：实际效果还不确定<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>最后以体谅的口吻理解微软声明所表达的诉求，同时指出一句漂亮话未必解决执行难题，需要继续给出办法<\/td>\n<td>最后下结论：一句漂亮话未必够用<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>B指作者对这句声明表示理解、体谅，不是“作者读懂了这句话的字面意思”。理解也不必等于完全赞成，因而一篇理解微软处境的文章仍可以承认效果不确定；关键要看作者是否把疑难转成对其立场的体谅。<\/p>\n<p>实际第5段解释了广告商的担忧，第6段指出信号可能被忽略，第7段却没有由此替微软的表态说明一个可体谅的理由。相反，作者说它的单独行动动机也不清楚，并接连检查竞争和销售上的解释。最后的反问把“给消费者更多控制权”作为仍待审视的说法，没有把它写成可以理解、接受的出发点。分析可能的动机，不等于最终对这句自述表示理解。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<h3>C. indulgence<\/h3>\n<p>纵容<\/p>\n<h4>如果 C 是主旨，文章7段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>纵容<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先说明行为广告在减少浪费上看起来有效，由此交代微软以消费者控制权回应有效商业技术时面临的实际压力，为宽容其声明中的不足铺垫<\/td>\n<td>先说一种新办法看起来很有效<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再讨论是否能默认用户接受追踪，说明同意规则尚有争议，因此对微软关于消费者控制权的简略表述留出宽容空间<\/td>\n<td>再说是否默认接受的问题<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>接着写各方先答应处理DNT请求但具体安排仍待落实，把微软尚未充分展开的声明放在大家都在摸索的阶段中看待<\/td>\n<td>接着说各方先答应处理<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>然后写微软突然改变默认做法，承认行动和解释较仓促，却对“更多控制权”这句尚不周全的声明采取宽待态度<\/td>\n<td>然后写有人突然改了默认做法<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>再写反对者因数据获取和广告效果受影响而不满，说明这些压力让微软的解释未能顾全各方，为其表述不足给予体谅<\/td>\n<td>再说反对者为什么不高兴<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>转而承认实际效果尚不确定，但仍愿意容忍微软的声明先于完整执行方案，不因缺少成效证明就苛责其表态<\/td>\n<td>但话说回来：实际效果还不确定<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>最后指出一句漂亮话未必够用，却选择宽容其暂时的不足，让微软有时间补出执行方案，而不继续追究声明的可信性<\/td>\n<td>最后下结论：一句漂亮话未必够用<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>C表示对微软这句声明采取宽容、纵容的态度：即使解释还不周全，也愿意放宽要求，不作严格追问。这不必预设作者已证明微软说谎；宽容也可能针对仓促、过于简单或缺少细节的表态。<\/p>\n<p>实际文章没有为这类不足开脱。第6段的执行疑点没有被化解，第7段又补出动机疑点，随后以<code>Could it really be that simple?<\/code>继续追问。这种收束要求读者继续审视声明，而非容忍其不足、就此放过。因此C需要的宽待方向，不能从文章真实的疑问推进中得到。<\/p>\n<p>判断：<\/p>\n<p><strong>C 不保留。<\/strong><\/p>\n<p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.<\/strong><\/p>\n<h3>D. skepticism<\/h3>\n<p>怀疑<\/p>\n<h4>如果 D 是主旨，文章7段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>怀疑<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先说明行为广告看起来能减少预算浪费、使广告更精准，交代追踪背后的商业价值，为审视微软“更多控制权”的解释提供利益背景<\/td>\n<td>先说一种新办法看起来很有效<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再讨论是否可以默认消费者接受追踪，说明控制权涉及谁作出同意决定，不能仅凭一句声明认定用户已经掌握了选择<\/td>\n<td>再说是否默认接受的问题<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>接着写各方先答应引入DNT并处理请求，把承诺列作事件背景，同时为之后检验承诺能否兑现留下问题<\/td>\n<td>接着说各方先答应处理<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>然后写微软突然把DNT设为默认，指出用户主动决定与厂商预先决定并非同一件事，使“更多控制权”的解释值得进一步审视<\/td>\n<td>然后写有人突然改了默认做法<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>再写反对者因数据收集受限、广告针对性下降而不高兴，并提出消费者可能不受益的理由，增加对简单利民解释的疑问<\/td>\n<td>再说反对者为什么不高兴<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>转而指出广告商是否停止追踪、默认信号能否落实用户意愿仍不确定，说明实际效果尚不能为“更多控制权”的声明提供充分保证<\/td>\n<td>但话说回来：实际效果还不确定<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>最后结合微软自身广告业务、竞争动机和执行疑点追问声明是否足以解释这次行动，收束为对一句漂亮话不轻信的怀疑态度<\/td>\n<td>最后下结论：一句漂亮话未必够用<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>D是怀疑，具体对象是Brendon Lynch关于“消费者应有更多控制权”的声明能否如此简单地说明微软的行动。它不等于作者否定消费者应有选择权，也不等于认定微软的所有动机都已被揭穿。<\/p>\n<p>第1段承认行为广告在理论上能提高效率，说明作者并非对文中一切事物都持负面态度。第2至4段交代同意规则、DNT安排和默认设置的变化，第5段补出消费者未必受益的争议，第6段再说明拒绝追踪信号可能被忽略。由此走到第7段，单凭“更多控制权”并不能消除行动效果和商业动机上的问题。<\/p>\n<p>结尾紧跟微软声明的反问直接表明作者不轻信这一简单解释。D既能容纳前文对商业价值和执行难题的客观讨论，也准确落在题干指定的表态对象上。<\/p>\n<p>判断：<\/p>\n<p><strong>D 保留。<\/strong><\/p>\n<h3>30题结论<\/h3>\n<p><strong>30. D. skepticism<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>skepticism / 怀疑<\/strong><\/p>\n<p>这里的怀疑针对微软“给消费者更多控制权”这一声明能否简单说明它的行动，不是对行为广告、DNT原则或所有企业的一概否定。后面判断具体人物、指代和效果时，仍要回到各题限定的原句。<\/p>\n<h2>26题<\/h2>\n<blockquote>\n<p>It is suggested in Paragraph 1 that “behavioural” ads help advertisers to ______.<br>第一段表明，“行为广告”帮助广告商做什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道细节推断题。题干用<code>Paragraph 1<\/code>限定第一段，<code>behavioural ads help advertisers<\/code>要求判断行为广告给广告商带来的作用。要把广告预算的浪费、互联网时代减少浪费的可能性和追踪后精准投放三句话接起来，不能仅凭“网络广告”补出其他好处。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>An old saying has it that half of all advertising budgets are wasted – the trouble is, no one knows which half.<\/p>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<p>第一句提出广告预算中存在无效投入，第二句中的<code>this fraction<\/code>承接前一句被浪费的那一部分，第三句说明减少浪费的办法：把广告投给最可能购买的人。题干问的是这条因果关系给广告商带来的经济作用，结论也要保留原文<code>at least in theory<\/code>的分寸。<\/p>\n<h3>A. lower their operational costs<\/h3>\n<blockquote>\n<p>降低运营成本<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第一段的<code>fraction<\/code>显示为<code>[xxx]<\/code>，但已经读到了广告预算被浪费以及这部分可以减少；A的词没有遮挡。当时把减少无效广告支出与降低运营成本相连，第一轮保留A，并在其余三项排除后选择了A。<\/p>\n<p><strong>选项类型：局部推断。<\/strong><\/p>\n<p>命题人把“减少被浪费的广告预算”概括为降低广告商的运营成本。广告投入是经营支出的一部分，定向投放减少无效投入，因此这里是在同一经济作用上作概括，没有声称所有成本项目都会下降。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>An old saying has it that half of all advertising budgets are wasted – the trouble is, no one knows which half.<\/p>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第一段表明，行为广告有助于广告商降低运营成本。<\/p>\n<\/blockquote>\n<p>题干的<code>behavioural ads<\/code>对应第一段末句，A的<code>costs<\/code>对应段首的<code>advertising budgets<\/code>；要沿着预算浪费为何能减少的解释向后读。<\/p>\n<p>第一句指出广告预算存在浪费；第二句说互联网时代这一浪费比例在理论上可以减少；第三句补出原因，即依据搜索、点击和发言把广告投向更可能购买的人。三句共同提供了“减少无效投放支出”的推断基础。<\/p>\n<p>原文没有承诺每家公司的实际总开支都立即下降。A接在<code>help advertisers to<\/code>之后，是行为广告可带来的作用；减少广告这一经营环节中的无效成本，足以支持它，不需要另证工资、房租等所有成本都降低。<\/p>\n<p>A把预算浪费的减少概括为经营成本的节约，主体仍是广告商，方向仍是无效支出的下降。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<p>作者先说浪费比例可下降，再用精准投放解释这种节约从何而来。<\/p>\n<\/blockquote>\n<p>这里往下写的是“怎样把同样的广告投入更有效地用到潜在买家身上”，没有离开广告预算的效率问题。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>By directing ads at likely buyers, advertisers can reduce spending that would otherwise be wasted.<\/p>\n<p>通过把广告投向可能购买的人，广告商可以减少本来会被浪费的支出。<\/p>\n<\/blockquote>\n<p>A所需要的解释正是原文已有的推进：先指出可减少的浪费，再说明定向投放为何能减少它。假设句只是把两句之间的经济关系说开，并未增加一种新的服务或竞争效果。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入26题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在审视微软“更多控制权”的声明，不能单独判断行为广告在第一段给广告商带来的具体成本作用。<\/p>\n<\/blockquote>\n<p>A实际说的是：<\/p>\n<blockquote>\n<p>lower their operational costs<br>降低运营成本<\/p>\n<\/blockquote>\n<p>对微软声明持怀疑态度，不等于否认行为广告对广告商的商业价值。A说的是广告商的成本，第30题判断的是作者对微软表态的态度，二者对象不同；本项最终仍要根据“advertising budgets are wasted”和“this fraction can be much reduced”判断。局部原文给出了减少浪费的依据，A与这层事实相符。<\/p>\n<p><strong>复盘判断：A正确。<\/strong><\/p>\n<h3>B. ease competition among themselves<\/h3>\n<blockquote>\n<p>缓和彼此之间的竞争<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整显示。做题时把它接回题干，发现原文写广告商向潜在消费者精准投放，B却写广告商彼此的竞争；第一轮因此排除B，后续没有改判。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>选项借用了企业都在争取潜在买家的商业场景，引导我们把广告投放更有效继续想成竞争得到缓和。原文只写单个企业怎样找到更可能购买的人，没有建立企业相互竞争减弱这一结果。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第一段表明，行为广告有助于广告商缓和彼此之间的竞争。<\/p>\n<\/blockquote>\n<p><code>behavioural ads<\/code>定位到第一段末句，<code>among themselves<\/code>则要求检查原文有没有从企业与买家的关系转向企业彼此的关系。<\/p>\n<p>末句中<code>companies<\/code>是投放者，<code>those most likely to buy<\/code>是广告要瞄准的消费者，搜索、点击和发言是识别对象的信息。句子把这些信息连到更准确的投放，没有连到同行竞争。<\/p>\n<p>提高一家公司的获客效率，既不必然缓和也不必然加剧同行竞争；原文没有选择其中任何一种后果。不能把现实中可能出现的竞争变化当作文章已经说明的广告作用。<\/p>\n<p>B额外补出了“投放更精准，所以广告商之间竞争更缓和”这一关系，原文支持到精准定位买家为止。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>An old saying has it that half of all advertising budgets are wasted – the trouble is, no one knows which half.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<p>作者提出预算浪费的问题，随后给出依据网络行为寻找潜在买家的解决办法。<\/p>\n<\/blockquote>\n<p>从问题到办法，文章始终解释广告支出如何更有效，而不是解释同行如何调整竞争关系。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Behavioural ads help advertisers compete less intensely with one another.<\/p>\n<p>行为广告有助于广告商降低彼此竞争的激烈程度。<\/p>\n<\/blockquote>\n<p>如果B成立，作者至少要让精准投放与同行竞争减弱相连。实际后文转向追踪是否须取得用户许可，没有补出竞争缓和的结果；假设句所需的同行关系，在真实推进中缺席。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入26题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在审视微软“更多控制权”的声明，不能判断第一段是否说行为广告缓和广告商之间的竞争。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>ease competition among themselves<br>缓和彼此之间的竞争<\/p>\n<\/blockquote>\n<p>微软声明是否可信，与广告商彼此是否减少竞争是不同问题。不能因为全文讨论商业利益，就替B推出竞争结论；本项最终仍要根据“aim ‘behavioural’ ads at those most likely to buy”这处局部原文判断。它给出的对象是潜在买家，没有B所说的同行竞争变化。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. avoid complaints from consumers<\/h3>\n<blockquote>\n<p>避免消费者投诉<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项末尾的<code>consumers<\/code>显示为<code>[xxx]<\/code>，只读到了避免某一方投诉。做题时已用“避免投诉”这一动作与原文的精准投放比较，认为原文没有给出投诉减少的结果，第一轮排除C；并非后来恢复投诉者身份才排除。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>命题人借用广告面向消费者以及企业观察网络行为的材料，使人联想到更合心意的广告可能少招抱怨。但第一段的作用链只通向高购买概率，未写消费者是否投诉，更未写广告商可以避免投诉。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第一段表明，行为广告有助于广告商避免消费者投诉。<\/p>\n<\/blockquote>\n<p><code>consumers<\/code>可与第一段的潜在购买者联系，真正需要核对的是<code>avoid complaints<\/code>：原文给广告商带来的结果究竟是增加投放针对性，还是避免投诉。<\/p>\n<p>企业观察人们搜索、点击和发言，是为了把广告投给最可能购买的人。<code>say online<\/code>在这里是可观察的信息来源，没有被界定为消费者投诉；末尾的<code>buy<\/code>则限定了识别目标的用途。<\/p>\n<p>一个人更可能购买产品，并不表示他不会抱怨广告或追踪行为。选项把购买可能性转成投诉上的效果，跨过了原文没有建立的一步。<\/p>\n<p>C补出了消费者投诉能够被避免的后果，既不是<code>those most likely to buy<\/code>的翻译，也不是减少广告预算浪费的同义表述。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<p>实际写法把观察网络行为的目的落在识别可能购买的人。<\/p>\n<\/blockquote>\n<p>接着第2段提出追踪是否需要明确许可的争议，文章并没有把精准投放写成消费者不再抱怨的原因。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Targeting ads in this way helps advertisers avoid complaints from consumers.<\/p>\n<p>以这种方式定向投放广告，有助于广告商避免消费者投诉。<\/p>\n<\/blockquote>\n<p>C至少需要出现这种投诉效果的连接。实际句子只接出了购买概率，后文又在讨论追踪许可的分歧；无论消费者会不会投诉，作者都没有把避免投诉列为第一段的广告作用。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入26题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对微软“更多控制权”的简单解释持怀疑态度，不能判断消费者投诉是否因行为广告而减少。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>avoid complaints from consumers<br>避免消费者投诉<\/p>\n<\/blockquote>\n<p>不能把作者的怀疑转译成“消费者必然会投诉”，也不能把精准广告转译成“消费者不会投诉”。C的结果必须有本地证据；本项最终仍要根据“at those most likely to buy”判断。原文写购买目标，没有给出避免投诉的作用。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. provide better online services<\/h3>\n<blockquote>\n<p>提供更好的在线服务<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示。做题时已经区分广告投放与在线服务改进，认为两者不能仅因都发生在网络上就等同；第一轮排除D，此后未改判。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>选项借用互联网环境和精准广告的积极作用，把广告商减少无效投放进一步写成向用户提供更好的在线服务。原文没有说明某种在线服务怎样因行为广告得到改进，服务质量的提升是补出来的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第一段表明，行为广告有助于广告商提供更好的在线服务。<\/p>\n<\/blockquote>\n<p><code>online<\/code>与原文的<code>internet age<\/code>、<code>say online<\/code>对应，但题干问行为广告帮助广告商实现什么，决定答案的要核对<code>provide better services<\/code>这一动作。<\/p>\n<p>作者说互联网使广告商有机会减少预算浪费，具体方式是观察人们在网上的行为，将广告投给高购买概率的人。这里提供的信息是广告投放效率，而非用户所使用服务的质量。<\/p>\n<p>定向广告在现实中可能让用户看到更相关的信息，但第一段没有把这种可能性写成在线服务改善。D不能只凭“更精准”中的正面色彩，就把受益对象和评价指标换成服务质量。<\/p>\n<p>D增加了广告商改善在线服务的结果，原文能坐实的是广告预算如何减少浪费，二者不是同一命题。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>In the internet age, at least in theory, this fraction can be much reduced.<\/p>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.<\/p>\n<p>实际文章解释数据怎样帮助企业投放行为广告，服务于减少预算浪费的问题。<\/p>\n<\/blockquote>\n<p>第2段顺势追问追踪权限，讨论的是广告商获取这种信息是否需要明确许可。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Behavioural advertising helps advertisers improve the online services they provide.<\/p>\n<p>行为广告有助于广告商改善自己提供的在线服务。<\/p>\n<\/blockquote>\n<p>若D成立，文章至少需把行为广告与所提供服务的改善接上。实际从投放效率转到追踪权限，没有展开任何服务改进；假设句新增的服务效果无法由这条推进得到。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入26题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者审视微软关于消费者控制权的声明，不能判断行为广告是否改善广告商提供的在线服务。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>provide better online services<br>提供更好的在线服务<\/p>\n<\/blockquote>\n<p>“给消费者更多控制权”与“提供更好的在线服务”也不是同一句话；不能用微软的声明替行为广告证明服务改进。本项最终仍要根据“this fraction can be much reduced”和后面的定向投放句判断，原文给出了节约无效投入的作用，没有D声称的服务效果。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>26题结论<\/h3>\n<blockquote>\n<p><strong>26. A. lower their operational costs<\/strong><\/p>\n<\/blockquote>\n<p>A由减少广告预算浪费概括出降低无效经营支出。<\/p>\n<p>B从精准定位买家额外推出同行竞争缓和。<\/p>\n<p>C把高购买概率额外连成避免消费者投诉。<\/p>\n<p>D把广告投放效率换成未说明的在线服务改善。<\/p>\n<h2>27题<\/h2>\n<blockquote>\n<p>“The industry” (Para. 3) refers to ______.<br>第三段中的“the industry”指什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道指代题。题干限定第3段，要求找出<code>the industry<\/code>所指的行业主体。既要向前寻找相关对象，也要把候选对象代入<code>responding to DNT requests<\/code>，检查谁负责响应用户的拒绝追踪请求。离指代词最近的名词，不必就是能执行这个动作的主体。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.<\/p>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<p>第一句交代用户通过浏览器向广告商表达不愿被追踪，第二句交代浏览器提供DNT功能，第三句转到FTC与数字广告联盟商定如何回应这些请求。三个句子分别写发出请求的渠道和处理请求的一方，指代判断要保留这个分工。<\/p>\n<p>本题标准答案为D，采用的是从前一句连续列举的Internet Explorer、Safari和Chrome，回指互联网浏览器开发者这一解释。不过，<code>responding to DNT requests<\/code>在执行语义上也与广告商有关，第6段确实讨论广告商如何回应。因此，这里不能把“浏览器提供DNT”说成“浏览器替网站执行停止追踪”；我们按本题给定的回指解释区分选项，同时保留两种角色的真实分工。<\/p>\n<h3>A. online advertisers<\/h3>\n<blockquote>\n<p>在线广告商<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第3段的<code>proposed<\/code>和<code>cracking<\/code>被显示为<code>[xxx]<\/code>，A完整显示。做题时将前句连续列举的浏览器视为<code>the industry<\/code>的回指范围，把广告商看作接收用户意愿的一方，因而第一轮排除A；后续保持这一结果。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>广告商确实是第3段写到的主体，用户会向它们表示不想被追踪。按本题标准采用的回指解释，<code>the industry<\/code>承接近前列举的浏览器产品及其开发者；A把这一回指对象换成了同段另一类主体。需要分清的是标准回指范围，不能否认广告商与回应DNT在现实语义上的联系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In December 2010 America’s Federal Trade Commission (FTC) proposed adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.<\/p>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第三段中的“the industry”指在线广告商。<\/p>\n<\/blockquote>\n<p>题干直接圈定<code>the industry<\/code>。前面的<code>advertisers<\/code>确实与A同词，但两者中间还有Internet Explorer、Safari、Chrome这组连续列举，本题按这组浏览器产品判断行业所指。<\/p>\n<p>第一句中的广告商是用户表示“不想被追踪”的对象；第二句说明几种浏览器已提供或将提供DNT。标准解读将末句行业的回指落在第二句的浏览器领域，而不是第一句的广告接收对象上。<\/p>\n<p>仅从<code>responding<\/code>的动作看，A具有语义关联，不能断言广告商“不可能响应DNT”。第6段还明确写广告商如何回应。这里排除A所依赖的是本题标准选择的前文回指关系，而非广告商没有这种业务行为。<\/p>\n<p>在标准回指解释下，A把浏览器领域换成在线广告领域；真实的广告商角色不能直接取代本题指定的前指对象。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<p>实际文序先连续列举浏览器产品，再用“行业”这一集合名称继续叙述有关DNT的安排。<\/p>\n<\/blockquote>\n<p>这一相邻文序是标准D所采用的依据。不过，末句也出现数字广告联盟并讨论响应请求，说明角色判断不能只靠把其他主体从段落中抹掉。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The online advertising industry would get cracking on responding to DNT requests.<\/p>\n<p>在线广告行业将着手回应DNT请求。<\/p>\n<\/blockquote>\n<p>如果作者把行业明确限定为在线广告业，A的所指便成立。实际文字没有补出这个行业修饰语，标准解读依前句浏览器列表选D。假设句澄清的是行业所指，不是增造广告商响应DNT的能力；动作关联本身不足以消除本题的回指歧义。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入27题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对微软“更多控制权”的声明持怀疑态度，不能判断第3段“the industry”究竟回指哪一个行业。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>online advertisers<br>在线广告商<\/p>\n<\/blockquote>\n<p>作者怀疑微软的解释，不能推出某个名词必指广告商或浏览器开发者。A确实与追踪执行有关，但本题最终仍要按前句“Microsoft’s Internet Explorer and Apple’s Safari”及“Google’s Chrome”的列举所构成的标准回指范围判断，不能让态度主旨代替指代分析。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. e-commerce conductors<\/h3>\n<blockquote>\n<p>电子商务经营者<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B中的<code>conductors<\/code>显示为<code>[xxx]<\/code>，但<code>e-commerce<\/code>可见。做题时对照前文的浏览器产品列举，发现电子商务领域不是这组对象所属的行业，第一轮排除B；并没有等到恢复被遮挡词后才改变判断。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>选项利用互联网浏览器与电子商务都在线上运行的联系，补出电子商务经营者这一主体。第3段出现监管机构、广告联盟、广告商和浏览器产品，没有引出电子商务经营者作为<code>the industry<\/code>的所指。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第三段中的“the industry”指电子商务经营者。<\/p>\n<\/blockquote>\n<p>要定位的是<code>the industry<\/code>之前已出现的行业对象。B中的<code>e-commerce<\/code>不能只因带有网络含义就与<code>internet browsers<\/code>对等，需核对具体产品和业务类别。<\/p>\n<p>Internet Explorer、Safari、Chrome是浏览器名称，前句用它们说明DNT功能的配置进展；末句转到行业处理DNT请求的安排，没有列出电子商务平台或交易服务商。<\/p>\n<p>某家公司可能同时提供浏览器、广告或其他网络业务，但题目问的是这段文字中的行业身份，不能把公司在现实中可能拥有的另一种业务搬进来。<\/p>\n<p>B凭互联网场景新增了电子商务经营者这一回指范围，原文的具体列举不足以支持这一主体。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>实际前文列出的是提供DNT的浏览器产品。<\/p>\n<\/blockquote>\n<p>标准解读由这组同类产品过渡到其开发行业，未先建立电子商务经营者这一群体。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>E-commerce conductors would get cracking on responding to DNT requests.<\/p>\n<p>电子商务经营者将着手回应DNT请求。<\/p>\n<\/blockquote>\n<p>若B成立，文章至少需要把承接主体指向电子商务经营者。实际列举没有这类身份；假设句改变的是行业类别，不能由“这些活动都发生在网上”补出。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入27题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对微软声明持怀疑态度，不能判断第3段行业名称是否指电子商务经营者。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>e-commerce conductors<br>电子商务经营者<\/p>\n<\/blockquote>\n<p>主旨没有给出电子商务经营者这一身份。判断B仍须检查第3段列举对象；本项最终依据“Internet Explorer”“Safari”“Chrome”等浏览器名称，无法得到B新增的电子商务行业范围。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. digital information analysts<\/h3>\n<blockquote>\n<p>数字信息分析人员<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。做题时将“分析人员”与第3段的浏览器产品及开发主体对照，认为原文没有把这些人列作行业的回指对象，第一轮排除C；后续未改判。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>选项借用了全文反复讨论网络行为信息的背景，把与数据有关的业务联想到数字信息分析人员。第3段没有建立这类人员群体，也没有说分析人员负责其中的DNT安排。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第三段中的“the industry”指数字信息分析人员。<\/p>\n<\/blockquote>\n<p><code>digital information<\/code>容易让人联想到行为追踪的数据，但题干限定第3段的指代，须检查前文实际列举的名称与动作，而不是泛找全文中与信息有关的内容。<\/p>\n<p>前句列出三种浏览器，说明它们已提供或将提供DNT；随后谈行业处理请求的安排。这里没有出现数据分析人员的职位、工作或组织。<\/p>\n<p>产品涉及数字信息，不意味着产品名称可以指代所有接触信息的职业群体。C需要的是分析人员这一身份，原文仅有网络数据主题不能证明它。<\/p>\n<p>C把技术背景中的数据因素转成了未出现的人员群体，新增的主体身份缺少第3段依据。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>作者实际写的是几种浏览器对DNT的支持进度。<\/p>\n<\/blockquote>\n<p>这串名称用于界定产品领域，并未转入数字信息分析工作的分工。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Digital information analysts would begin handling DNT requests.<\/p>\n<p>数字信息分析人员将开始处理DNT请求。<\/p>\n<\/blockquote>\n<p>若C成立，至少应出现把处理请求交给分析人员的写法。实际前后都没有引入这一身份，不能凭行为广告需要数据，就把数据分析人员填进本段的行业名称。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入27题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对微软声明持怀疑态度，不能判定第3段“行业”是否指数字信息分析人员。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>digital information analysts<br>数字信息分析人员<\/p>\n<\/blockquote>\n<p>怀疑一项消费者控制权声明，不会自动点名某类技术人员。C仍须有局部身份依据；本项最终根据第3段“both offer DNT”等浏览器配置描述判断，其中没有C所指的分析人员群体。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. internet browser developers<\/h3>\n<blockquote>\n<p>互联网浏览器开发者<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第3段<code>proposed<\/code>和<code>cracking<\/code>被显示为<code>[xxx]<\/code>，D完整显示。做题时依据Internet Explorer、Safari、Chrome的连续列举，把产品背后的开发者概括为相应行业，第一轮保留D，随后选择D；这与本题标准答案一致。<\/p>\n<p><strong>选项类型：局部推断。<\/strong><\/p>\n<p>本题标准采用从前句浏览器产品回指开发行业的解释。D把Internet Explorer、Safari和Chrome这些产品名称，概括成提供相应浏览器功能的开发者群体；其依据是相邻句中的同类列举，而不是把网站是否停止追踪的执行权交给浏览器。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>第三段中的“the industry”指互联网浏览器开发者。<\/p>\n<\/blockquote>\n<p><code>internet browser developers<\/code>与前句三个浏览器名称形成产品和开发者的联系；题干中的集合名词<code>the industry<\/code>，在标准解读下承接这一产品领域。<\/p>\n<p>Internet Explorer和Safari已提供DNT，Chrome将在当年提供。前句连续列出不同公司的同类产品，标准答案据此把后句行业名称理解为这些浏览器背后的开发者。<\/p>\n<p>这一判断不能靠把<code>responding to DNT requests<\/code>直译成“浏览器代广告商停止追踪”来加强。浏览器可提供发送用户偏好的机制，追踪方是否执行请求是另一环节；第6段正是在讨论后一问题。<\/p>\n<p>D对应本题标准所采用的近前同类列举与行业概括，产品名称与开发者身份能相接，但不应由此增造浏览器对网站追踪行为的控制。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.<\/p>\n<p>In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.<\/p>\n<p>实际文序先列几种浏览器，随后使用行业这一集合称呼。<\/p>\n<\/blockquote>\n<p>标准解释将这两句读成由具体浏览器产品转向同一领域的开发者整体，这提供了D的回指路线。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The industry represented by these internet browser developers would take up the DNT issue.<\/p>\n<p>这些互联网浏览器开发者所代表的行业将着手处理DNT问题。<\/p>\n<\/blockquote>\n<p>D所需的是把行业成员明确连到前列浏览器开发者。实际前句确有相应产品列举，因此标准答案采用这一联系；假设句只展开所指关系，没有声称开发者能够替广告商执行不追踪。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入27题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对微软“更多控制权”的声明持怀疑态度，不能单独判断第3段“the industry”的具体所指。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>internet browser developers<br>互联网浏览器开发者<\/p>\n<\/blockquote>\n<p>D不是因为“作者怀疑微软，而微软开发浏览器”就成立，这种跨越会把态度题当成词义解释。本项最终仍依据“Internet Explorer”“Safari”“Chrome”的近前同类列举，按本题标准解释确定为浏览器开发者；主旨不额外消除<code>responding<\/code>带来的角色关联。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<h3>27题结论<\/h3>\n<blockquote>\n<p><strong>27. D. internet browser developers<\/strong><\/p>\n<\/blockquote>\n<p>A是段内真实的广告商角色，但不符合本题标准采用的近前浏览器列表回指。<\/p>\n<p>B由互联网场景补出第3段未建立的电子商务经营者身份。<\/p>\n<p>C把数据主题联想成未出现的分析人员群体。<\/p>\n<p>D按本题标准解释，将前句浏览器产品列举概括为开发者行业；这不等于浏览器替广告商执行停止追踪。<\/p>\n<h2>28题<\/h2>\n<blockquote>\n<p>Bob Liodice holds that setting DNT as a default ______.<br>Bob Liodice认为，把DNT设为默认选项会怎样？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道人物观点题。<code>Bob Liodice holds<\/code>要求回答Bob的判断，不能把广告商、微软和作者的意见混为一谈。前文对默认设置习惯的说明交代政策怎样发生作用，Bob姓名后的条件句与广告数量、针对性两句共同说明他预言的消费者后果。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Advertisers are horrified.<\/p>\n<p>Human nature being what it is, most people stick with default settings.<\/p>\n<p>Few switch DNT on now, but if tracking is off it will stay off.<\/p>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<p>多数用户沿用默认值，使默认拒绝追踪可能限制行业收集偏好信息。Bob据此认为消费者会<code>worse off<\/code>，并具体说明数量不会更少、广告却更不相关。题干中的默认设置通过这层数据收集条件与他的评价相连，不是无条件断言任何DNT安排都必然损害消费者。<\/p>\n<h3>A. goes against human nature<\/h3>\n<blockquote>\n<p>违背人性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第5段的<code>horrified<\/code>、<code>stick<\/code>、<code>preferences<\/code>和<code>meaningful<\/code>显示为<code>[xxx]<\/code>，A完整显示。做题时仍读出了多数人沿用默认设置这一前后关系，认为原文用人性解释默认值的持续作用，A却说违背人性，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>选项抓住原文的<code>human nature<\/code>，把“人们往往顺着默认设置”的原因解释，改成“把DNT设为默认与人性相违背”。原文写默认值会借助人们不常更改设置的习惯产生效果，方向并不是逆着这种习惯。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Human nature being what it is, most people stick with default settings.<\/p>\n<p>Few switch DNT on now, but if tracking is off it will stay off.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项违背人性。<\/p>\n<\/blockquote>\n<p><code>human nature<\/code>定位到Bob姓名前的解释句，<code>setting DNT as a default<\/code>则要结合后一句追踪关闭后会保持关闭，辨清人性与默认设置的关系。<\/p>\n<p>原文先说多数人会沿用默认值，再说现在很少人主动开启DNT，但若追踪默认关闭，关闭状态会延续。这两句把用户不改设置视为默认DNT能够影响追踪的原因。<\/p>\n<p><code>goes against<\/code>要求有与人性相冲突的评价。原文恰恰利用用户常沿用预设值的习惯解释后果；而且这段人性说明属于作者交代的背景，不能仅因离Bob发言近，就变成Bob说“违背人性”。<\/p>\n<p>A复现了名词，却将人性促进默认设置持续作用的关系改成了与默认设置冲突，也把背景说明错接成Bob的评价。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Human nature being what it is, most people stick with default settings.<\/p>\n<p>Few switch DNT on now, but if tracking is off it will stay off.<\/p>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>实际先以用户沿用默认值解释追踪受限，再引出Bob对信息收集受限时消费者处境的判断。<\/p>\n<\/blockquote>\n<p>作者从人的习惯走向数据收集及消费者后果，没有转向默认DNT违背这种习惯。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Liodice says that making DNT the default runs against human nature.<\/p>\n<p>Liodice说，把DNT设为默认违背人性。<\/p>\n<\/blockquote>\n<p>若A成立，需要Bob作出这种冲突判断。实际引述给出的却是消费者在信息收集受限时境况更差的预测；人性是前面解释默认效果的原因，不是他批评的冲突对象。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入28题题干：<\/p>\n<blockquote>\n<p>作者对微软“更多控制权”的声明持怀疑态度，但这一态度不能确定Bob是否认为默认DNT违背人性；仍要看他被引述的具体观点。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>goes against human nature<br>违背人性<\/p>\n<\/blockquote>\n<p>怀疑一项控制权声明并不等于指责它违背人性。A把一个更具体、也更不同的评价塞进Bob的发言；本项最终仍根据“most people stick with default settings”判断，原文把人的习惯写成默认效果的原因，没有A的冲突关系。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. fails to affect the ad industry<\/h3>\n<blockquote>\n<p>无法对广告业产生影响<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B末尾的<code>industry<\/code>显示为<code>[xxx]<\/code>。第一轮认为Bob关于消费者处境的判断还不能完整否定广告端被遮挡对象的命题，因此暂时保留B，与C形成二选一。后来回查28题时，做题材料结合广告商担心数据收集、广告针对性受影响的内容，排除B，最后选C；不能把这段历史写成一开始就排除了B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用原文的<code>industry<\/code>，却把信息收集受限、广告针对性改变这一影响链改成行业不受影响。Bob预测消费者会更糟的前提，正是行业无法照常收集偏好信息，因此“广告业没有受到影响”不能概括他的观点。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Advertisers are horrified.<\/p>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项无法对广告业产生影响。<\/p>\n<\/blockquote>\n<p><code>Bob Liodice<\/code>定位到他的条件判断，<code>ad industry<\/code>对应其中<code>if the industry cannot collect information about their preferences<\/code>；要核对的是行业的信息获取是否会被触及。<\/p>\n<p>Bob先设定行业不能收集偏好信息的情形，再推到消费者处境更差，最后解释广告会更不相关、更不精准。条件中的信息限制发生在广告业，后果通过投放表现传到消费者。<\/p>\n<p>消费者受损本身并不能证明广告业的每个方面都受损，不能用两种主体粗暴互换。但原句还明确包含行业数据收集受限的中间环节，足以否定“对广告业不产生影响”这一概括；并不需要证明行业的利润、规模等指标全部变化。<\/p>\n<p>B抹掉了原文已经写出的广告业数据获取和投放针对性的变化，把有具体影响改成了不受影响。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<p>实际写法从行业收集偏好信息受限，走向广告更不精准和消费者受损。<\/p>\n<\/blockquote>\n<p>消费者后果是通过广告业的工作方式变化推出来的，行业并不是这串后果之外的旁观者。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Liodice says that making DNT the default will leave the ad industry unaffected.<\/p>\n<p>Liodice说，把DNT设为默认将使广告业不受影响。<\/p>\n<\/blockquote>\n<p>B至少需要Bob把行业受影响这一环节拿掉。实际话语却以不能收集偏好信息为条件，再说明投放针对性下降；假设写法切断的正是Bob用于说明消费者后果的中间桥。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入28题题干：<\/p>\n<blockquote>\n<p>全文对微软“更多控制权”的简单声明持怀疑态度，提示我们检查默认DNT的实际后果；但广告业是否受影响，仍须由Bob关于信息收集和投放的具体话语确定。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>fails to affect the ad industry<br>无法对广告业产生影响<\/p>\n<\/blockquote>\n<p>B不能仅因与作者的怀疑语气不同就被排除，怀疑本身不提供行业影响的事实。把主旨提醒的问题落回Bob的原句，可以看到“if the industry cannot collect information”这一局部条件：行业的数据获取已被纳入可能变化，B却把这个主体写成不受影响，因而不能概括其观点。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. will not benefit consumers<\/h3>\n<blockquote>\n<p>不会让消费者受益<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。虽然Bob句中的<code>preferences<\/code>以及后面的<code>meaningful<\/code>被显示为<code>[xxx]<\/code>，<code>consumers will be worse off<\/code>仍可读懂，因此第一轮保留C，同时暂留B。形成30题的怀疑态度判断后，又结合Bob所说消费者不会少看广告、只会看到更不精准的广告回查，最终选C。<\/p>\n<p><strong>选项类型：同义改写。<\/strong><\/p>\n<p>命题人把Bob的<code>consumers will be worse off<\/code>改写为消费者不会受益。原文说处境更差，选项采用较为概括的否定受益，没有改变对象和负面方向；它对应的是默认DNT限制偏好收集这一语境中的判断。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项不会让消费者受益。<\/p>\n<\/blockquote>\n<p><code>Bob Liodice<\/code>直接定位人物发言，C的<code>not benefit consumers<\/code>与原文<code>consumers will be worse off<\/code>对应；还要把姓名后条件句和后面两句解释一起读完。<\/p>\n<p>条件句说如果广告业不能收集偏好信息，消费者处境会更差。接着Bob说广告数量不会减少，最后说明相关性和针对性会下降，这两句解释“更差”具体体现在哪里。<\/p>\n<p>选项接在默认DNT这一题干语境中，概括的是Bob对该安排的预期评价，并非说消费者在任何制度下、任何方面都绝不可能得益。原文的收集条件和后果解释仍构成它的适用范围。<\/p>\n<p>C以“不会受益”概括“处境更差”，由较具体的负面结果得到较宽的否定获益，没有倒置Bob的判断。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.<\/p>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<p>实际先给消费者境况更差的判断，再用广告数量不减、针对性下降加以解释。<\/p>\n<\/blockquote>\n<p>Bob并未把不能追踪直接等同于消费者得到好处，而是追问他们最终收到的广告会怎样。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>If default DNT prevents the collection of preference data, consumers will not benefit: they will see ads that are less relevant to them.<\/p>\n<p>如果默认DNT阻止偏好数据的收集，消费者不会受益：他们将看到与自己更不相关的广告。<\/p>\n<\/blockquote>\n<p>C所需的推进已在原文中出现。假设句保留信息收集受限这一条件，再将不相关广告连到不受益；真实发言的“更糟”和“更不精准”提供了同一关系。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入28题题干：<\/p>\n<blockquote>\n<p>全文怀疑微软“更多控制权”的声明是否足以解释其行动，因此要检查消费者是否真得到好处；Bob在这一争议中提出的是消费者可能得不到预期好处的理由。<\/p>\n<\/blockquote>\n<p>C实际说的是：<\/p>\n<blockquote>\n<p>will not benefit consumers<br>不会让消费者受益<\/p>\n<\/blockquote>\n<p>C与这条检验方向一致，但作者的怀疑不能代替Bob的发言。真正坐实该项的是“consumers will be worse off”，以及数量不减、针对性下降的解释：主体都是消费者，结果都是否定受益。这里不能把Bob的看法扩成作者已全面认同广告业的所有主张。<\/p>\n<p><strong>复盘判断：C正确。<\/strong><\/p>\n<h3>D. may cut the number of junk ads<\/h3>\n<blockquote>\n<p>可能减少垃圾广告的数量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示。做题时读到了<code>People will not get fewer ads<\/code>以及<code>less targeted ads<\/code>，认为Bob说广告不会更少、针对性反而下降，因此第一轮排除D；后续没有重新保留。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>选项借用Bob谈广告数量和相关性的两句，把“总量不减、针对性下降”的负面解释改成“垃圾广告可能减少”的好处。要注意，单凭总量不减并不能在数学上排除某一子类数量下降；真正使D缺少支持的是Bob两句合在一起并未给出垃圾广告变少这条关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Bob Liodice认为，把DNT设为默认选项可能减少垃圾广告的数量。<\/p>\n<\/blockquote>\n<p><code>cut the number<\/code>对应<code>fewer ads<\/code>，<code>junk ads<\/code>还要求检查后面的<code>less meaningful, less targeted ads<\/code>究竟在说广告更合适，还是更不相关。<\/p>\n<p>Bob先否定消费者收到的广告总数下降，然后说明广告会更缺少意义和针对性。两句连起来描述的是数量上的好处没有出现，投放质量还会变差。<\/p>\n<p>D的<code>may<\/code>只主张一种可能，并未断言必然减少，所以不能用“原文没说必然”反驳它。<code>junk ads<\/code>也不等于所有广告；但原文没有写某类垃圾广告被过滤掉，反而解释偏好信息减少后广告更不匹配。<\/p>\n<p>D把相关性变差的解释转成垃圾广告数量减少的可能收益；这个变化不是Bob所给出的观点，也不能仅由总量句的名词复现推出。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>People will not get fewer ads, he says.<\/p>\n<p>“They’ll get less meaningful, less targeted ads.”<\/p>\n<p>实际写法否定广告总量减少，并强调广告更不相关、更不精准。<\/p>\n<\/blockquote>\n<p>第二句补充的是第一句之后的更差结果，不是在区分哪类广告数量会减少。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Liodice says that default DNT may reduce the number of junk ads consumers receive.<\/p>\n<p>Liodice说，默认DNT可能减少消费者收到的垃圾广告数量。<\/p>\n<\/blockquote>\n<p>若D成立，至少需要这条有关垃圾广告减少的可能结果。实际作者引述的是相关性下降，没有给出筛掉垃圾广告的推进；不能用“总量不变，所以所有子类都不变”这种并不存在的推理代替比较。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入28题题干：<\/p>\n<blockquote>\n<p>全文要求审视微软所称的消费者控制权与实际后果；但这一怀疑不能直接决定垃圾广告的数量变化，仍须看Bob怎么解释。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>may cut the number of junk ads<br>可能减少垃圾广告的数量<\/p>\n<\/blockquote>\n<p>D把消费者所得写成垃圾广告数量下降的可能好处，Bob却用“not get fewer ads”和“less targeted ads”解释不利结果。主旨只提示要查证收益是否落实，最终排除D靠的是他未给出垃圾广告减少这条关系，而不是认定怀疑态度可以算出广告数量。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>28题结论<\/h3>\n<blockquote>\n<p><strong>28. C. will not benefit consumers<\/strong><\/p>\n<\/blockquote>\n<p>A将用户沿用默认值这一作用原因改成默认DNT违背人性。<\/p>\n<p>B把行业数据收集和广告针对性可能变化改成行业不受影响。<\/p>\n<p>C用不会受益概括Bob所说的消费者处境更差。<\/p>\n<p>D把数量不减、相关性下降的解释改成垃圾广告数量减少的可能好处。<\/p>\n<h2>29题<\/h2>\n<blockquote>\n<p>Which of the following is true according to Paragraph 6?<br>根据第六段，下面哪项正确？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道限定段落的判断题，需要把四个命题分别放回第6段。段首保留对广告商回应方式的不确定，第二句区别“没有强制约束”与“部分公司自愿承诺”，末句再解释为什么有人可能忽略信号。推断不得把<code>some<\/code>改成全体，也不得把<code>may<\/code>改成必然。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>It is not yet clear how advertisers will respond.<\/p>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<p>收到DNT信号不自动产生停止追踪的义务；广告商又不能判断信号来自主动反对还是默认设置，所以一些广告商可能继续追踪。段落说明的是执行存在落空的可能，没有给出消费者人气的变化，也没有宣布广告商的统一态度。<\/p>\n<h3>A. Advertisers are willing to implement DNT.<\/h3>\n<blockquote>\n<p>广告商愿意实施DNT。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第6段<code>oblige<\/code>、<code>objects<\/code>和<code>press<\/code>被显示为<code>[xxx]<\/code>，A完整显示。做题时把部分公司已经承诺与段首“回应方式还不清楚”相比较，认为不能据此给广告商整体贴上愿意实施的判断，第一轮排除A，后续未改判。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人抓住<code>some companies have promised to do so<\/code>这处真实承诺，把部分公司的态度改成对广告商的概括性评价。错误不在于广告商中没有人愿意，而在于作者把回应方式保留为不清楚，且接着写有人可能忽略请求，不能据此概括行业愿意实施。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>It is not yet clear how advertisers will respond.<\/p>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，广告商愿意实施DNT。<\/p>\n<\/blockquote>\n<p><code>willing to implement<\/code>可联系<code>have promised to do so<\/code>，但必须同时定位限定词<code>some<\/code>以及段首的<code>not yet clear<\/code>，确认这种意愿覆盖什么范围。<\/p>\n<p>部分公司承诺停止追踪，说明确有愿意配合的公司；段首没有把这类承诺上升为对广告商回应的确定判断，末句还保留一些广告商可能忽略信号的另一方向。<\/p>\n<p>A没有写<code>all<\/code>，不应把它夸张成“每一家广告商都愿意”。但裸复数<code>Advertisers are willing<\/code>仍是在概括这一类主体的态度；第6段所支持的是反应未定、存在部分承诺与可能忽略，并非这种总体倾向已经确立。<\/p>\n<p>A把局部承诺改为行业的概括态度，舍弃了整段关于回应尚不确定、部分广告商可能继续追踪的关系。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>It is not yet clear how advertisers will respond.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<p>作者先说广告商如何回应尚不清楚，末尾说明有人可能因无法辨别真实意愿而忽略DNT信号。<\/p>\n<\/blockquote>\n<p>部分承诺出现在这一不确定背景中，后文没有把它扩展成行业趋于愿意实施的结论。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Advertisers are willing to act on DNT requests and stop tracking users who send them.<\/p>\n<p>广告商愿意按DNT请求行事，停止追踪发出请求的用户。<\/p>\n<\/blockquote>\n<p>若A成立，至少应有这样的概括性愿意配合的说明，不需要写成毫无例外的全员保证。实际末句却保留可能忽略请求的路线，段首也未确定行业反应；部分公司的承诺不足以把真实推进改成假设路线。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入29题题干：<\/p>\n<blockquote>\n<p>全文对微软声明的简单解释持怀疑态度，第6段为此提供执行仍不确定的背景；不能把这种背景概括为广告商已表现出愿意实施的整体态度。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>Advertisers are willing to implement DNT.<br>广告商愿意实施DNT。<\/p>\n<\/blockquote>\n<p>A把不确定的行业回应写成愿意配合。主旨本身不能证明哪家公司拒绝实施，但它与第6段的未定方向相容；本项最终仍根据“not yet clear”和“some may ignore”判断，二者不支持由部分承诺推出A的概括。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. DNT may not serve its intended purpose.<\/h3>\n<blockquote>\n<p>DNT可能达不到预期目的。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时第6段有<code>oblige<\/code>、<code>objects<\/code>、<code>press<\/code>显示为<code>[xxx]<\/code>，但仍读到了<code>some may ignore a DNT signal<\/code>，并结合前文知道DNT在表达用户不想被追踪。做题时据此认为信号若被忽略，预期目的可能落空，第一轮保留B，随后选B。<\/p>\n<p><strong>选项类型：局部推断。<\/strong><\/p>\n<p>命题人把“有些广告商可能忽略DNT信号并继续追踪”概括为DNT可能达不到预期目的。原文的<code>some may<\/code>只给出落空的可能，B用<code>may not<\/code>保留这一限度，没有宣布DNT全部失效。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，DNT可能达不到预期目的。<\/p>\n<\/blockquote>\n<p><code>intended purpose<\/code>需要接回第3段DNT让用户表达不想被追踪的用途；第6段真正决定能否落实的是<code>ignore a DNT signal and press on anyway<\/code>。<\/p>\n<p>第6段先说收到信号并不强制停止追踪，再说广告商无法区分主动拒绝与默认设置。于是有人可能忽略信号继续追踪，这给出了用户表达了拒绝、追踪却没有停止的情形。<\/p>\n<p>B没有把“可能失效”说成“必定失效”，也没有抹去一些公司承诺响应的事实。即使部分请求能被尊重，只要原文支持另一些请求可能落空，就能支持DNT有时无法达到预期目的。<\/p>\n<p>B把信号可能被忽略的具体行为，概括为原本防止追踪的意愿可能不能落实，因果和情态都与原文相接。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<p>实际从缺少强制约束和无法判断真实意愿，推到一些广告商可能忽略信号。<\/p>\n<\/blockquote>\n<p>末句把制度和识别上的问题落实为继续追踪的可能后果，为目的无法兑现提供了具体原因。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>If advertisers ignore the signal and continue tracking, DNT may fail to give users the protection they intend to request.<\/p>\n<p>如果广告商忽略信号并继续追踪，DNT就可能无法实现用户本来想请求的保护。<\/p>\n<\/blockquote>\n<p>B所需要的条件和结果都能在原文推进中找到：信号可能被忽略，追踪可能继续。假设句只明确点出这一行为与DNT预期用途之间的差距，没有把可能性升级成普遍失败。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入29题题干：<\/p>\n<blockquote>\n<p>作者对“更多控制权”的简单声明持怀疑态度，第6段具体指出执行可能不随信号落实，因此DNT可能无法实现用户拒绝追踪的预期。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>DNT may not serve its intended purpose.<br>DNT可能达不到预期目的。<\/p>\n<\/blockquote>\n<p>B给出的是有依据的效果疑问，与作者要求进一步检验控制权声明的方向相符。关键仍是“some may ignore a DNT signal and press on anyway”：它既提供目的可能落空的行为，也用<code>may<\/code>限制程度。不能只凭作者怀疑，就把B扩大成DNT必然无效。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<h3>C. DNT is losing its popularity among consumers.<\/h3>\n<blockquote>\n<p>DNT正在消费者中失去人气。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。做题时对照第6段“无法区分真实反对还是沿用默认设置”，认为原文没有提供消费者欢迎程度随时间下降的趋势，第一轮排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>选项借用用户真实意愿无法从默认信号中分辨这一事实，补出消费者越来越不喜欢DNT的趋势。无法判断某次信号是否代表主动选择，不等于已经观察到欢迎程度下降。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，DNT正在消费者中失去人气。<\/p>\n<\/blockquote>\n<p><code>among consumers<\/code>使我们注意末句关于用户意愿的两种来源；<code>is losing<\/code>则要求原文提供随时间下降的比较，而非仅仅出现“不清楚用户怎么想”。<\/p>\n<p>末句列出两种解释：用户确实反对行为广告，或用户只是沿用微软预设值。广告商不能区分它们，所以可能忽略信号。这里不确定的是现有信号的含义。<\/p>\n<p>C需要消费者对DNT的支持或使用意愿从较高变低的证据。原文既未给前后时间比较，也没有把真实反对行为广告等同于对DNT本身不欢迎，两个评价对象不能混在一起。<\/p>\n<p>C新增了对DNT人气下降的时间趋势；原文只是对信号能否代表主动选择提出辨别困难。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<p>实际末句把无法判断用户真实意愿连接到广告商可能忽略信号。<\/p>\n<\/blockquote>\n<p>后果发生在广告商的响应决策上，作者没有继续讨论消费者对DNT的支持率如何变化。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>DNT is becoming less popular among consumers.<\/p>\n<p>DNT正变得越来越不受消费者欢迎。<\/p>\n<\/blockquote>\n<p>若C成立，文章至少应出现这种前后变化的判断。实际写法没有评价DNT的人气走向，而是解释广告商为什么可能不把信号当作主动拒绝，二者的主体与结果都不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入29题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者怀疑微软的简单解释，不能判断消费者对DNT的欢迎程度是否正在下降。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>DNT is losing its popularity among consumers.<br>DNT正在消费者中失去人气。<\/p>\n<\/blockquote>\n<p>作者的怀疑不是消费者的人气调查，执行可能失败也不等于用户更不欢迎。C最终仍要有局部趋势证据；“Unable to tell whether”只说明信号来源难以辨别，未提供C的下降关系。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. Advertisers are obliged to offer behavioural ads.<\/h3>\n<blockquote>\n<p>广告商有义务提供行为广告。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项中的<code>behavioural<\/code>显示为<code>[xxx]<\/code>，原文的<code>oblige<\/code>也被遮挡。做题时仍读到了前面的否定和后面可能忽略信号的行为，认为这不能支持广告商必须提供某类广告的义务，第一轮排除D；不是恢复广告类别之后才发现错误。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人借用原文的义务表达，却把“收到DNT信号并不强制停止追踪”改成“广告商必须提供行为广告”。否定方向和动作对象同时改变。原文没有强制停止某事，不表示广告商因此有义务提供另一种服务。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第六段，广告商有义务提供行为广告。<\/p>\n<\/blockquote>\n<p><code>are obliged<\/code>对应原文<code>does not oblige<\/code>，但不能只看是否同根；还要看原文义务后接的<code>stop tracking<\/code>与选项的<code>offer behavioural ads<\/code>是不是同一动作。<\/p>\n<p>原文讨论DNT信号是否使接收方必须停止追踪，回答是并不产生这种强制约束。随后举出可能忽略信号继续追踪的回应，说明请求未必落实。<\/p>\n<p>“没有被强制停止追踪”与“有义务投放行为广告”并非正反命题。前者既不建立后者，也不需要读者证明现实中绝无任何广告义务；题目只问本段支持什么，D的提供义务在本段没有依据。<\/p>\n<p>D把一个被否定的停止追踪义务，改成被肯定的提供行为广告义务，既换了肯否，也换了行动，无法作为原句的改写。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.<\/p>\n<p>Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and press on anyway.<\/p>\n<p>作者实际先说明停止追踪不具有强制性，再解释有人可能选择忽略请求。<\/p>\n<\/blockquote>\n<p>后续落点是追踪是否继续，并没有转成广告商必须向消费者提供哪类广告。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Advertisers have an obligation to offer behavioural ads.<\/p>\n<p>广告商负有提供行为广告的义务。<\/p>\n<\/blockquote>\n<p>D至少需要这种提供行为广告的义务陈述。实际没有此类要求，只有对停止追踪约束力的讨论；即使有人继续追踪，也不能把他的选择或可能行为写成必须提供广告的责任。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>30题的正确答案是：<\/p>\n<blockquote>\n<p>skepticism<br>怀疑<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入29题题干：<\/p>\n<blockquote>\n<p>全文主旨只能提示微软“更多控制权”的声明需要接受实际执行的检验，不能判断广告商是否负有提供行为广告的特定义务。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>Advertisers are obliged to offer behavioural ads.<br>广告商有义务提供行为广告。<\/p>\n<\/blockquote>\n<p>D把执行疑问变成一项广告提供义务，怀疑态度既不能创设也不能取消这种义务。本项最终仍要根据“does not oblige anyone to stop tracking”判断，原文没有D所说的肯定义务与提供动作。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>29题结论<\/h3>\n<blockquote>\n<p><strong>29. B. DNT may not serve its intended purpose.<\/strong><\/p>\n<\/blockquote>\n<p>A把部分公司承诺改成对广告商愿意实施的概括态度。<\/p>\n<p>B把有人可能忽略信号继续追踪概括成DNT目的可能落空。<\/p>\n<p>C由用户意愿难以分辨额外推出DNT人气正在下降。<\/p>\n<p>D把不强制停止追踪改成必须提供行为广告，换了肯否和动作。<\/p>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：网络时代广告的新机遇<\/strong>（段落1背景介绍） 传统广告困境：（一半预算被浪费 + 不知道是哪一半）→ 网络时代的解决方案：【通过追踪用户行为（搜索、点击、言论）→ 投放&quot;行为&quot;广告给最可能购买的人 → 理论上可减少浪费】<\/p>\n<p>↓（引出核心争议）<\/p>\n<p><strong>逻辑层次2：追踪权限的争议<\/strong>（段落2-3规则制定） 核心问题：广告商应该假设用户乐意被追踪 // 还是需要明确许可？→ FTC的回应：【2010年提议DNT选项 → 各浏览器陆续支持（IE、Safari已有，Chrome将有）→ 2月份FTC与DAA达成一致：行业将响应DNT请求】<\/p>\n<p>↓（冲突爆发）<\/p>\n<p><strong>逻辑层次3：微软引发的争议<\/strong>（段落4-5利益冲突） 导火索：5月31日微软宣布IE10将默认开启DNT → 广告商的恐慌：【人性使然大多数人使用默认设置 → 追踪关闭后将保持关闭】→ 行业观点（Bob Liodice）：【消费者不会受益：（广告数量不会减少 + 只会得到针对性更差的广告）】<\/p>\n<p>↓（实施困境）<\/p>\n<p><strong>逻辑层次4：DNT的实施困境<\/strong>（段落6执行问题） 法律约束缺失：收到DNT信号不强制停止追踪 → 判断困难：（无法区分真正反对vs使用默认设置）→ 可能结果：一些广告商可能忽略DNT信号继续追踪<\/p>\n<p>↓（动机分析）<\/p>\n<p><strong>逻辑层次5：微软动机的不确定性<\/strong>（段落7深层疑问） 微软的矛盾：（自己也有广告业务 + 将遵守DNT）→ 可能动机：【打击依赖广告的谷歌？（但方法间接 + 不保证成为规范）// DNT作为卖点？（似乎不明显）】→ 官方说法：（&quot;消费者应该有更多控制权&quot;）→ 作者质疑：真的这么简单吗？<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：网络广告的精准投放依赖用户追踪，但微软将DNT设为默认引发了行业恐慌。这一举措的效果和动机都充满不确定性，可能无法真正保护用户隐私，反而可能影响广告的精准度。<\/p>\n<h2>小标题题<\/h2>\n<p>Read the following text and choose the most suitable heading from the list A–G for each numbered section (41–45). There are two extra headings.<\/p>\n<p>[A] A default setting that alarms the advertising industry<\/p>\n<p>[B] The commercial value of detailed online information<\/p>\n<p>[C] A legally guaranteed end to online tracking<\/p>\n<p>[D] Unanswered questions about Microsoft’s strategy<\/p>\n<p>[E] Addressing permission through browser tools and privacy rules<\/p>\n<p>[F] Fewer advertisements as the benefit of a new default<\/p>\n<p>[G] An uncertain response to signals against tracking<\/p>\n<h3>41. ______<\/h3>\n<p>An old saying holds that half of all advertising budgets are wasted, though no one knows which half. The internet could, in theory, reduce that waste. By observing what people search for, click on and say online, firms can direct behavioural advertisements towards those most likely to buy.<\/p>\n<p>Recent deals show how valuable this detailed information has become. On May 23rd Oracle announced that it was buying Vitrue, which helps companies manage social-media marketing, for a reported $300m. On June 5th it added Collective Intellect, which analyses comments about companies on social networks, for an undisclosed sum. A day earlier Salesforce.com had announced that it would pay $689m for Buddy Media, a Vitrue competitor. Buddy would fit alongside Radian 6, a social-media monitoring business for which Salesforce had paid $326m the previous year. These purchases concern services that help firms use or understand activity online.<\/p>\n<h3>42. ______<\/h3>\n<p>The value of such information raises a longstanding question: may advertisers assume that people are willing to be tracked and sent behavioural advertisements, or should explicit permission be required? Many users scarcely think about electronic observation while browsing, whereas some strongly object.<\/p>\n<p>In December 2010 America’s Federal Trade Commission proposed a “do not track”, or DNT, option for browsers, allowing users to indicate that they did not wish to be followed. Firefox, Internet Explorer and Safari offered the option, and Chrome was due to do so during the year. In February the FTC and the Digital Advertising Alliance, a group of industry bodies, agreed that the industry would start responding to DNT requests. The European Union also introduced a rule requiring websites to ask before using cookies to collect information about users’ behaviour. These developments addressed how a user’s wishes could enter the tracking process.<\/p>\n<h3>43. ______<\/h3>\n<p>On May 31st Microsoft provoked a row by announcing that Internet Explorer 10 would have DNT switched on by default. The browser was due to appear with Windows 8, the next version of the company’s operating system. This went beyond offering a setting that users could choose to activate.<\/p>\n<p>Advertisers were horrified because most people tend to keep default settings. Few users were then switching DNT on, but if tracking were switched off at the start, it was likely to remain off. Bob Liodice, chief executive of the Association of National Advertisers, argued that consumers would be worse off if advertisers could not collect information about their preferences. He did not predict a fall in the number of advertisements: he said the advertisements would become less meaningful and less well targeted. The dispute therefore involved the effect of the initial setting on access to information and the relevance of advertising.<\/p>\n<h3>44. ______<\/h3>\n<p>What advertisers would actually do in response was still unclear. Receiving a DNT signal did not oblige a company to stop tracking, although some businesses, including Twitter, had promised to respect it. A signal and a guaranteed change in behaviour were therefore not the same thing.<\/p>\n<p>Microsoft’s default created a further difficulty for anyone interpreting that signal. It might express a user’s real objection to behavioural advertisements, or it might merely reflect an unchanged browser setting. Unable to distinguish these cases, some advertisers might ignore the signal and continue tracking. This was a possible response, not a claim that every firm would refuse all requests. The issue was whether the request would bring about the intended conduct when its meaning and the response to it were uncertain.<\/p>\n<h3>45. ______<\/h3>\n<p>Microsoft’s reasons for acting alone were also unclear. It had an advertising business of its own, which it said would comply with DNT requests, although it was still deciding how to do so. If the company meant to trouble Google, which relied almost entirely on advertising, it had chosen an indirect route: there was no guarantee that DNT by default would become standard.<\/p>\n<p>Nor did DNT appear an obviously major selling point for Windows 8, even though Microsoft had previously compared some products favourably with Google’s on privacy. Brendon Lynch, its chief privacy officer, said the company believed consumers should have more control. Could the explanation really be that simple?<\/p>\n<h3>41题解析<\/h3>\n<p><strong>答案：B — The commercial value of detailed online information。<\/strong> 中文：详细网络信息的商业价值。<\/p>\n<p>这一部分整体在说明，追踪网络行为为什么值得企业投入：先解释广告投放如何减少浪费，再用多宗收购展示企业对相关服务的重视。交易名称、日期和价格都服务于“信息为什么有价值”这个中心。<\/p>\n<p>开头的 reduce that waste 把行为信息接到广告效率；第二段首句 Recent deals show how valuable this detailed information has become 明确总领收购案例。结尾又把这些购买归到 use or understand activity online，没有改谈消费者许可。<\/p>\n<p>段内推进链：传统广告浪费难以识别 → 网络行为帮助锁定潜在买家 → 相关信息具有价值 → Oracle与Salesforce购买营销和监测业务 → 交易共同证明这种商业需求。<\/p>\n<p>标题中的 detailed online information 对应搜索、点击、言论及社交媒体活动；commercial value 对应广告投放用途和企业付钱购买的服务。标题概括的是几项交易共同支持的判断，不要求把每个公司名写进标题。<\/p>\n<p>最强干扰项是E。监测用户确实会牵涉隐私，但这一部分还没有讨论许可程序、浏览器选择或隐私规则；用Addressing permission作标题会把下一节的问题提前放过来，也解释不了本节反复列举收购的作用。<\/p>\n<p><strong>最终答案：41选B。<\/strong><\/p>\n<h3>42题解析<\/h3>\n<p><strong>答案：E — Addressing permission through browser tools and privacy rules。<\/strong> 中文：通过浏览器工具与隐私规则回应许可问题。<\/p>\n<p>这一部分先提出是否应获得明确许可的争议，再说明用户表达意愿的浏览器工具及相关规则。它把“用户是否同意”落实到表达和响应途径，尚未讨论微软改变默认值后的反应。<\/p>\n<p>首段把 assume 与 explicit permission 对立起来；第二段的 allowing users to indicate 说明DNT的用途，后面的 responding to DNT requests 和 ask before using cookies 分别补充行业响应与欧盟规则。结尾回收为用户意愿怎样进入追踪过程。<\/p>\n<p>段内推进链：行为信息带来许可争论 → 用户态度不一 → DNT让反对者表达意愿 → 浏览器陆续支持 → 行业承诺响应并有地区规则要求事先询问。<\/p>\n<p>标题中的 Addressing permission 对应开头的permission问题；browser tools 对应DNT选项；privacy rules 对应欧盟使用cookies前询问的要求。它同时覆盖争议和制度回应，不把某一地区的具体要求扩大成全球保证。<\/p>\n<p>最强干扰项是C。文中有监管机构和欧盟规则，容易让人想到法律保障，但既没有说所有网络追踪都必须停止，也没有把所有DNT信号写成强制命令。A legally guaranteed end把规则的对象与效力扩大了。<\/p>\n<p><strong>最终答案：42选E。<\/strong><\/p>\n<h3>43题解析<\/h3>\n<p><strong>答案：A — A default setting that alarms the advertising industry。<\/strong> 中文：令广告行业恐慌的默认设置。<\/p>\n<p>这一部分的中心是微软把DNT设为默认后为什么引发行业反对。前段交代改动，后段解释默认惯性和广告相关性方面的担忧；Liodice的话属于行业对后果的判断。<\/p>\n<p>第一段的 DNT switched on by default 与 went beyond offering a setting 标明变化；第二段用 because most people tend to keep default settings 解释恐慌，再用 did not predict a fall in the number 限定行业声称的影响。<\/p>\n<p>段内推进链：微软宣布默认开启DNT → 用户不必主动启用 → 多数人保留默认状态 → 广告商担心失去偏好信息 → 行业声称广告会更不相关而非更少。<\/p>\n<p>标题中的 default setting 对应首段真正的新举措；alarms 对应horrified及其原因；advertising industry 对应广告商与协会负责人。三个部分共同概括触发事件和反应主体。<\/p>\n<p>最强干扰项是F。它抓到消费者与广告的关系，却把“广告针对性下降”改写成“广告数量减少”，还把行业担忧写成已实现的benefit。文中明确否认数量减少的推断，因此不能用这一标题统摄本节。<\/p>\n<p><strong>最终答案：43选A。<\/strong><\/p>\n<h3>44题解析<\/h3>\n<p><strong>答案：G — An uncertain response to signals against tracking。<\/strong> 中文：对反追踪信号的不确定回应。<\/p>\n<p>这一部分整体在分析DNT请求能否真正改变广告商行为。它区分收到信号、解释信号和采取行动三个环节，说明默认开启并不能直接保证停止追踪。<\/p>\n<p>开头的 actually do ... was still unclear 定下不确定性；did not oblige指出信号的约束有限，although some ... promised保留企业自愿遵守的情况。第二段的 might ... or ... 给出两种信号来源，some ... might又限定忽略请求只是部分企业的可能反应。<\/p>\n<p>段内推进链：实际响应尚不明确 → 收到信号不等于强制停追踪 → 默认值混合了主动反对和未改设置 → 广告商难以区分 → 部分企业可能忽略请求。<\/p>\n<p>标题中的 signals against tracking 对应DNT请求；response 对应stop tracking或continue tracking；uncertain覆盖法律约束、信号解释和行为结果的不确定，既不夸大为全面拒绝，也不把承诺当成普遍落实。<\/p>\n<p>最强干扰项是C。收到DNT后停止追踪确实是被讨论的结果，但本节明说did not oblige，并举出可能继续追踪的路径；legally guaranteed会把作者正在解释的执行缺口改成已经消失。<\/p>\n<p><strong>最终答案：44选G。<\/strong><\/p>\n<h3>45题解析<\/h3>\n<p><strong>答案：D — Unanswered questions about Microsoft’s strategy。<\/strong> 中文：关于微软策略的未解疑问。<\/p>\n<p>这一部分把注意力从广告商怎么做转到微软为什么独自采取这一举措。它依次检查自身广告业务、对谷歌的可能影响、系统卖点和消费者控制权说法，最后保留疑问。<\/p>\n<p>第一句 reasons for acting alone were also unclear 是总领；If ... meant to trouble Google 把打击谷歌放在假设层面，no guarantee指出限制；Nor ... major selling point 排查另一种解释。末尾没有给出确定动机，而是追问是否真的如此简单。<\/p>\n<p>段内推进链：微软自己也经营广告 → 打击谷歌只是可能且路径间接 → 默认DNT未必成为行业标准 → 产品卖点解释也不充分 → 官方强调消费者控制 → 作者仍追问。<\/p>\n<p>标题中的 Microsoft’s strategy 指默认DNT这一行动及商业背景；Unanswered questions 对应逐项检验后仍未得到确定解释。它保留文章的怀疑程度，没有把一种猜测升级为事实。<\/p>\n<p>最强干扰项是G。这里也出现comply with DNT，但只是微软自身广告业务带来的动机矛盾；本节没有继续分析广告商如何识别信号。若选G，就拿开头的一处执行细节覆盖了随后整段对策略理由的追问。<\/p>\n<p><strong>最终答案：45选D。<\/strong><\/p>\n<h2>排序题<\/h2>\n<p>The following paragraphs are given in a wrong order. Reorganize them into a coherent text by choosing from the list A–H to fill in each numbered box (41–45). Paragraphs A, E and H have been correctly placed.<\/p>\n<table>\n<thead>\n<tr>\n<th>已给位置<\/th>\n<th>41<\/th>\n<th>42<\/th>\n<th>已给位置<\/th>\n<th>43<\/th>\n<th>44<\/th>\n<th>45<\/th>\n<th>已给位置<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>E<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>H<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>[A]<\/h3>\n<p>An old saying holds that half of advertising budgets are wasted, but no one knows which half. In theory, the internet could reduce this waste. By watching what people search for, click on and say online, companies can aim behavioural advertisements at those most likely to buy. The ability to use such detailed information is therefore valuable to advertisers and to the firms supplying their software.<\/p>\n<h3>[B]<\/h3>\n<p>That approach to DNT was thrown into dispute on May 31st, when Microsoft announced a different starting setting. Internet Explorer 10, due to appear with Windows 8, would have DNT on by default. Users would not have to switch it on themselves. This made the default, rather than only the availability of a choice, the centre of the argument. The announcement immediately alarmed advertisers.<\/p>\n<h3>[C]<\/h3>\n<p>Yet the pursuit of this information comes with a longstanding dispute over permission. Should advertisers assume that users are happy to be tracked and sent behavioural advertisements, or should they obtain explicit consent? Many people barely think about being observed electronically as they browse, while others object strongly. A central practical question is how those who object can tell advertisers that they do not want to be followed.<\/p>\n<h3>[D]<\/h3>\n<p>Whether advertisers would act on that alarm by continuing to track was still uncertain. A DNT signal did not oblige them to stop, though some companies, including Twitter, had promised to respect it. With Microsoft’s default, an advertiser could not tell whether the signal expressed an active objection or an unchanged setting. Some might therefore ignore it and press on. The practical effect of Microsoft’s move remained unclear; its reason for making the move was another question.<\/p>\n<h3>[E]<\/h3>\n<p>A browser setting was proposed as a way to communicate that wish. In December 2010 America’s Federal Trade Commission suggested adding a “do not track” option to browsers. Firefox, Internet Explorer and Safari offered DNT, and Chrome was due to follow during the year. In February the FTC and the Digital Advertising Alliance agreed that the industry would start responding to requests. In the European Union, a new rule required websites to ask before using cookies to gather behavioural information.<\/p>\n<h3>[F]<\/h3>\n<p>Several recent purchases illustrate that commercial value. Oracle announced the acquisition of social-media marketing firm Vitrue for a reported $300m on May 23rd, and added social-media analyst Collective Intellect on June 5th for an undisclosed sum. On June 4th Salesforce.com said it would pay $689m for Buddy Media, a Vitrue competitor. This would complement Radian 6, another social-media monitoring business, for which Salesforce had paid $326m the previous year. The deals show firms investing in the ability to manage or understand people’s activity online.<\/p>\n<h3>[G]<\/h3>\n<p>The advertisers’ alarm reflected how strongly people tend to keep default settings. Few users were switching DNT on, but if tracking started switched off, it would probably stay off. Bob Liodice of the Association of National Advertisers said consumers would be worse off if the industry could not learn their preferences. They would receive less meaningful, less targeted advertisements, he argued, rather than fewer advertisements. This described the industry’s objection, but did not settle how advertisers would respond to the signals themselves.<\/p>\n<h3>[H]<\/h3>\n<p>That other question also lacked a clear answer. Microsoft had an advertising business too, and said it would respect DNT while still working out how. An attempt to trouble Google would be indirect, because the default might never become an industry norm. DNT was not an obviously powerful selling point for Windows 8 either. Microsoft’s privacy chief said consumers should have more control. Could the explanation really be that simple?<\/p>\n<h2>排序题全局解析<\/h2>\n<p>先看每一段在全文中的功能，再检查段首、段尾是否能双向接住。相同话题只提供候选范围，明确的指代、转折和段落任务才能确定位置。<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在做什么<\/th>\n<th>关键接点<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>说明网络行为信息为什么能提高广告投放效率<\/td>\n<td>末尾详细信息的价值总领下一段交易<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>微软改变默认设置并引发争议<\/td>\n<td>That approach接E的DNT安排；alarm递交G<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>从商业追求转入追踪许可争议<\/td>\n<td>Yet转折；末尾问反对者如何表达意愿<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>解释广告商响应不确定及信号辨别困难<\/td>\n<td>act on that alarm承接G；another question递交H<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>用DNT工具和相关规则回应许可问题<\/td>\n<td>that wish回指C；提供B所改变的既有做法<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>用收购交易展示网络信息的商业价值<\/td>\n<td>that commercial value回指A；结尾活动信息接C<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>解释默认惯性导致行业担忧<\/td>\n<td>advertisers’ alarm回指B；末尾提出实际响应尚未解决<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>审视微软动机并保留疑问<\/td>\n<td>That other question回指D末尾；以反问收束<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>全文推进链：广告浪费与行为数据的价值 → 收购展示商业投入 → 转入用户许可争议 → 介绍DNT及规则 → 微软改变默认设置 → 行业解释担忧 → 分析执行不确定 → 追问微软动机。<\/p>\n<p><strong>完整顺序：A → F → C → E → B → G → D → H。<\/strong><\/p>\n<p><strong>41—45答案：F、C、B、G、D。<\/strong><\/p>\n<p>A、E、H分别固定开篇的信息价值、DNT工具与规则、结尾的微软动机追问。把每个候选段放进去时，都要同时检查它接住了前段什么、又向后段交出了什么，不能只完成单侧配对。<\/p>\n<h3>排序41题解析<\/h3>\n<p>当前空位位于已给A之后、42题之前，后面已给E将介绍DNT工具。41题先承接A关于信息商业价值的判断，为下一步从信息追求转向许可争议提供背景。<\/p>\n<p>A末尾说 detailed information is ... valuable；F开头的 Several recent purchases illustrate that commercial value 精确接住这一判断。F结尾说企业投入以管理和理解 people’s activity online，后面的C便以 Yet the pursuit of this information 转向许可。<\/p>\n<p>that commercial value的指代和illustrate的举例功能使A→F连接明确。F不是另谈技术，而是用收购例证A；随后C中的Yet才把“值得获取”转成“是否有权获取”。<\/p>\n<p>局部推进链：A说明信息有用 → F列举企业为相关能力付费 → F回收为网络活动信息 → C转问搜集它是否需要许可。<\/p>\n<p>最强候选是C，它也能从A的信息价值转入争议。但若立即放C，F再置于C之后就会打断C末尾“如何表达反对”的问题与E的工具回应；F的that commercial value也会离开最直接的总领。A—F—C—E同时满足例证和问答关系。<\/p>\n<p><strong>最终答案：41填F。<\/strong><\/p>\n<h3>排序42题解析<\/h3>\n<p>当前空位位于已确定的F之后、已给E之前。F刚展示信息交易，E开头却说a way to communicate that wish；42题必须建立用户意愿这个准确前项，并引出其表达途径。<\/p>\n<p>F尾句仍谈 people’s activity online；C首句用 Yet the pursuit of this information 接住并转向许可争议。C末尾问反对者怎样 tell advertisers that they do not want to be followed，E开头的 communicate that wish 直接回答。<\/p>\n<p>前端通过this information和Yet形成同一对象上的转折；后端通过that wish及communicate/tell形成问题与工具的衔接。E中的DNT不是突兀出现，而是为C中明确的反对意愿服务。<\/p>\n<p>局部推进链：F信息具有交易价值 → C追问是否需要明确许可 → C聚焦反对用户怎样表达 → E提出浏览器DNT选项。<\/p>\n<p>最强候选是B，它也谈用户设置，却已经说That approach was thrown into dispute，需要先有E的DNT安排。它既不能提供E中that wish的直接前项，又会把默认值争议放到工具的介绍之前。<\/p>\n<p><strong>最终答案：42填C。<\/strong><\/p>\n<h3>排序43题解析<\/h3>\n<p>当前空位位于已给E之后、44题之前。E已经介绍DNT工具和响应安排，44题G将解释广告商的alarm。43题需要交代使已有安排起争议的新行动，并引出该反应。<\/p>\n<p>E写浏览器提供DNT及行业开始响应；B以 That approach to DNT was thrown into dispute 接续，并具体说明微软would have DNT on by default。B末句 The announcement immediately alarmed advertisers 与G首句 The advertisers’ alarm 形成紧密回指。<\/p>\n<p>That approach回指既有DNT框架，a different starting setting说明真正变化在默认状态。B尾部先引入alarm，G才能解释其原因；所以前端是规则到事件，后端是现象到原因。<\/p>\n<p>局部推进链：E提供用户选择与响应框架 → B微软改变默认状态 → B广告商恐慌 → G解释多数人保留默认值。<\/p>\n<p>最强候选是G。它直接讨论默认设置，似乎能承接E，但E尚未宣布默认开启，也没有出现alarm。跳过B会使G的定指对象没有事件来源，并把反应放到触发行为之前。<\/p>\n<p><strong>最终答案：43填B。<\/strong><\/p>\n<h3>排序44题解析<\/h3>\n<p>当前空位位于已确定的B之后、45题之前。B末尾宣布广告商被惊动，45题D将讨论他们是否据此继续追踪。44题要解释恐慌缘由，并把观点与实际行动区分开。<\/p>\n<p>B的 alarmed advertisers 对应G开头 The advertisers’ alarm；G随后用默认惯性和广告针对性说明反对理由。G末尾说 did not settle how advertisers would respond，D开头 Whether advertisers would act on that alarm ... was still uncertain 正接实际响应问题。<\/p>\n<p>前端重复alarm并补充原因，后端通过respond/act把“行业提出什么意见”推进到“企业会采取什么行动”。这一转换也防止把Liodice的意见当成广告商已经执行的统一方案。<\/p>\n<p>局部推进链：B微软引发恐慌 → G默认惯性解释信息损失担忧 → G行业声称广告相关性下降 → D另问实际响应是否停止追踪。<\/p>\n<p>最强候选是D，它也含alarm，但若直接接B，会先讲执行不确定，再回到G解释已经被提出的恐慌；G结尾的respond又会重新打开D已经处理过的问题，并挡住D末尾到H动机问题的衔接。<\/p>\n<p><strong>最终答案：44填G。<\/strong><\/p>\n<h3>排序45题解析<\/h3>\n<p>当前空位位于已确定的G之后、已给H之前。G留下广告商实际响应的问题；H以That other question开始讨论微软的理由。45题必须先处理执行问题，再明确引出第二个问题。<\/p>\n<p>G末尾的 how advertisers would respond 对应D首句 Whether advertisers would act on that alarm。D分析信号的约束与解释后，末尾说 its reason for making the move was another question；H的That other question随后讨论微软为何如此行动。<\/p>\n<p>前端是尚未解决的问题与分析，后端是another/that other的明确指代。D把讨论对象从外部广告商的行为转到微软自己的动机，正好完成G与H之间的任务转换。<\/p>\n<p>局部推进链：G实际响应未定 → D收到信号不保证停止 → D默认与主动反对难区分 → D转问微软原因 → H逐项检查可能动机。<\/p>\n<p>最强候选是B，因它能再交代微软举措，但它没有回答G的响应问题，也没有引入H所说的other question；其末尾alarm只会把文章带回G。D的双向衔接才让全文继续向结论推进。<\/p>\n<p><strong>最终答案：45填D。<\/strong><\/p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词<\/h2>\n<table>\n<thead>\n<tr>\n<th>可积累的主题表达<\/th>\n<th>中文翻译<\/th>\n<th>所属类别<\/th>\n<th>使用层级<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>protecting privacy<\/strong><\/td>\n<td><strong>保护隐私<\/strong><\/td>\n<td><strong>社会现象类—科技经济<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>protecting personal information<\/td>\n<td>保护个人信息<\/td>\n<td>社会现象类—科技经济<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>a rational view of new technology<\/td>\n<td>理性看待新科技<\/td>\n<td>社会现象类—科技经济<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>rational consumption<\/td>\n<td>理性消费<\/td>\n<td>社会现象类—社会生活<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>rational choice<\/strong><\/td>\n<td><strong>理性选择<\/strong><\/td>\n<td><strong>社会现象类—社会生活<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>independent thinking<\/td>\n<td>独立思考<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>a sense of responsibility<\/td>\n<td>责任感<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>mutual trust<\/td>\n<td>相互信任<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>building a healthy Net<\/strong><\/td>\n<td><strong>构建网络文明<\/strong><\/td>\n<td><strong>社会现象类—科技经济<\/strong><\/t bes how A collects information about B’s preferences.<\/td>\n<td>短文描述了A如何收集有关B偏好的信息。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage examines how A’s choice affects B and C.<\/td>\n<td>短文考察了A的选择如何影响B和C。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage presents different responses to A’s decision to change B.<\/td>\n<td>短文介绍了各方对A改变B这一决定的不同反应。<\/td>\n<\/tr>\n<\/tbody><\/table>\n";
