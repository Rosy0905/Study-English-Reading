读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>21题题干</h2>\n<p><strong>Priestly criticizes her assistant for her ______.</strong></p>\n<blockquote>\n<p>Priestly因助手的什么问题而批评她？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>22题题干</h2>\n<p><strong>According to Cline, mass-market labels urge consumers to ______.</strong></p>\n<blockquote>\n<p>根据Cline的说法，大众市场品牌促使消费者做什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>23题题干</h2>\n<p><strong>The word “indictment” (Para. 2) is closest in meaning to ______.</strong></p>\n<blockquote>\n<p>第二段中的“indictment”最接近哪个意思？</p>\n</blockquote>\n<p>题型：<strong>猜词题</strong>。</p>\n<hr />\n<h2>24题题干</h2>\n<p><strong>Which of the following can be inferred from the last paragraph?</strong></p>\n<blockquote>\n<p>从最后一段可以推断出什么？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr />\n<h2>25题题干</h2>\n<p><strong>What is the subject of the text?</strong></p>\n<blockquote>\n<p>这篇文章的主题是什么？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>But, of course, yet, Though</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>out of date, feverish, harmful, wasteful</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>encourage, renew, rely, curb</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>more profit, waste, lasting change</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>fashion, clothes, consumers, sustainability</td>\n</tr>\n</tbody>\n</table>\n<p>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her <strong>[xxx]</strong> assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater <strong>[xxx]</strong> over the years from fashion shows to department stores and to the bargain bin in which the poor girl <strong>[xxx]</strong> found her garment.</p>\n<p>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her <strong>[xxx]</strong> assistant for imagining that high fashion doesn’t affect her. / Priestly explains how the deep blue color of the assistant’s sweater <strong>[xxx]</strong> over the years from fashion shows to department stores and to the bargain bin in which the poor girl <strong>[xxx]</strong> found her garment.</p>\n<p>在2006年电影版中 of The Devil Wears Prada, 米兰达普里斯特利, 由梅丽尔斯特里普饰演, scolds her <strong>[xxx]</strong> assistant 她以为 high fashion doesn’t affect her. / Priestly explains how the 深蓝颜色 of 助手的毛衣 <strong>[xxx]</strong> 多年间 从时装秀 to department stores and to the bargain bin in which the poor girl <strong>[xxx]</strong> found her garment.</p>\n<p>1、在2006年电影版中、米兰达普里斯特利、由梅丽尔斯特里普饰演、她以为、深蓝颜色、助手的毛衣、多年间、从时装秀。</p>\n<p>This <strong>[xxx]</strong> conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion.” In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker <strong>[xxx]</strong> mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable—meant to last only a wash or two, although they don’t advertise that—and to renew their <strong>[xxx]</strong> every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have <strong>[xxx]</strong> fashion cycles, shaking an industry long accustomed to a seasonal pace.</p>\n<p>This <strong>[xxx]</strong> conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion.” In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. / Quicker <strong>[xxx]</strong> mean less wasted inventory, more frequent releases, and more profit. / These labels encourage style-conscious consumers to see clothes as disposable—meant to last only a wash or two, although they don’t advertise that—and to renew their <strong>[xxx]</strong> every few weeks. / By offering on-trend items at dirt-cheap prices, Cline argues, these brands have <strong>[xxx]</strong> fashion cycles, shaking an industry long accustomed to a seasonal pace.</p>\n<p>This <strong>[xxx]</strong> conception of the fashion business couldn’t be more out of date or 与之不合 狂热世界 写在《过度着装》中, 克莱因三年的 indictment of “快时尚.” In the last decade or so, 技术进步 have allowed 大众品牌 such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. / Quicker <strong>[xxx]</strong> mean 更少库存浪费, more frequent releases, and 更多利润. / These labels encourage 在意款式的消费者 to see clothes as disposable—meant to last only a wash or two, although they don’t advertise that—and to 更新他们的 <strong>[xxx]</strong> every few weeks. / By offering on-trend items at dirt-cheap prices, Cline argues, these brands have <strong>[xxx]</strong> fashion cycles, shaking an industry long accustomed to a seasonal pace.</p>\n<p>2、与之不合、狂热世界、写在《过度着装》中、克莱因三年的、快时尚、技术进步、大众品牌、更少库存浪费、更多利润、在意款式的消费者、更新他们的。</p>\n<p>The <strong>[xxx]</strong> of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that <strong>[xxx]</strong> natural resources, and use massive amounts of <strong>[xxx]</strong> chemicals.</p>\n<p>The <strong>[xxx]</strong> of this revolution, of course, are not limited to designers. / For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that <strong>[xxx]</strong> natural resources, and use massive amounts of <strong>[xxx]</strong> chemicals.</p>\n<p>The <strong>[xxx]</strong> of this revolution, of course, are not limited to designers. / For H&amp;M to offer a $5.95 knit miniskirt in all its 两千三百多家门店 遍布世界, it must rely on low-wage overseas labor, 大批量订货 that <strong>[xxx]</strong> 自然资源, and use massive amounts of <strong>[xxx]</strong> 化学品.</p>\n<p>3、两千三百多家门店、遍布世界、大批量订货、自然资源、化学品。</p>\n<p>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is <strong>[xxx]</strong> and wasteful,” Cline argues. Americans, she finds, buy <strong>[xxx]</strong> 20 billion garments a year—about 64 items per person—and no matter how much they give away, this <strong>[xxx]</strong> leads to waste.</p>\n<p>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. / “Mass-produced clothing, like fast food, fills a hunger and need, yet is <strong>[xxx]</strong> and wasteful,” Cline argues. / Americans, she finds, buy <strong>[xxx]</strong> 20 billion garments a year—about 64 items per person—and no matter how much they give away, this <strong>[xxx]</strong> leads to waste.</p>\n<p>Overdressed is 时尚界的回应 to 消费行动主义畅销书 like Michael Pollan’s The Omnivore’s Dilemma. / “批量生产的服装, 像快餐, fills a hunger and need, yet is <strong>[xxx]</strong> and 浪费,” Cline argues. / 美国人, she finds, buy <strong>[xxx]</strong> 20 billion garments a year—about 64 items per person—and no matter how much they give away, this <strong>[xxx]</strong> leads to waste.</p>\n<p>4、时尚界的回应、消费行动主义畅销书、批量生产的服装、像快餐、浪费、美国人。</p>\n<p>Towards the end of Overdressed, Cline introduced her <strong>[xxx]</strong>, a Brooklyn woman named Sarah Kate Beaumont, who since 2008 has made all of her own clothes—and beautifully. But as Cline is the first to note, it took Beaumont decades to <strong>[xxx]</strong> her <strong>[xxx]</strong>; her example can’t be knocked off.</p>\n<p>Towards the end of Overdressed, Cline introduced her <strong>[xxx]</strong>, a Brooklyn woman named Sarah Kate Beaumont, who since 2008 has made all of her own clothes—and beautifully. / But as Cline is the first to note, it took Beaumont decades to <strong>[xxx]</strong> her <strong>[xxx]</strong>; / her example can’t be knocked off.</p>\n<p>临近结尾 of Overdressed, Cline introduced her <strong>[xxx]</strong>, 一名布鲁克林女性 named 萨拉凯特博蒙特, who 自2008年起 has made all of her own clothes—and 而且很漂亮. / But as Cline is the first to note, it took Beaumont decades to <strong>[xxx]</strong> her <strong>[xxx]</strong>; / her example can’t be knocked off.</p>\n<p>5、临近结尾、一名布鲁克林女性、萨拉凯特博蒙特、自2008年起、而且很漂亮。</p>\n<p>Though several fast-fashion companies have made efforts to <strong>[xxx]</strong> their impact on labor and the environment—including H&amp;M, with its green Conscious Collection line—Cline believes lasting change can only be effected by the customer. She <strong>[xxx]</strong> the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.</p>\n<p>Though several fast-fashion companies have made efforts to <strong>[xxx]</strong> their impact on labor and the environment—including H&amp;M, with its green Conscious Collection line—Cline believes lasting change can only be effected by the customer. / She <strong>[xxx]</strong> the idealism common to many advocates of sustainability, be it in food or in energy. / Vanity is a constant; / people will only start shopping more sustainably when they can’t afford not to.</p>\n<p>Though 几家快时尚公司 已经作出努力 to <strong>[xxx]</strong> 它们的影响 on 劳工和环境—including H&amp;M, with its 绿色环保系列—Cline believes 持久改变 can only be effected by the customer. / She <strong>[xxx]</strong> 这种理想主义 common to 许多可持续倡导者, be it 在食品领域 or 在能源领域. / Vanity is a constant; / people will only start shopping more sustainably when they can’t afford not to.</p>\n<p>6、几家快时尚公司、已经作出努力、它们的影响、劳工和环境、绿色环保系列、持久改变、这种理想主义、许多可持续倡导者、在食品领域、在能源领域。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某种产业做法或某类后果时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章开头大概借一部电影和一件蓝色毛衣说时尚会影响普通人；中间反复出现快时尚、大众品牌、频繁上新、低薪劳工、资源和化学品、购买与浪费；后面又出现一位自己做衣服的女性、企业环保努力、消费者以及价格。</p>\n<p>到这里还不能自然地说清楚：电影里的毛衣和快时尚批评怎样连接，大众品牌为何让消费者频繁买衣服，各种劳工与环境代价之间是什么关系，个人做衣服的例子能证明到哪一步，最后为什么把改变落到消费者和负担能力上。粗读时只要能判断“这篇文章大概和快时尚、消费及其后果有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住毛衣、快时尚、低价生产、浪费、个人做衣服和结尾的消费者；这些信息之间到底是什么关系，等题目问到再精读。</p>\n<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<h2>21题</h2>\n<blockquote>\n<p>Priestly criticizes her assistant for her ______.<br />\nPriestly因助手的什么问题而批评她？</p>\n</blockquote>\n<p>题干已经给出人物Priestly。第一段开头就出现Priestly，随后直接写她为什么训斥助手，所以把第一段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her <strong>[xxx]</strong> assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater <strong>[xxx]</strong> over the years from fashion shows to department stores and to the bargain bin in which the poor girl <strong>[xxx]</strong> found her garment.</p>\n<p>开始精读：</p>\n<p>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her <strong>[xxx]</strong> assistant for imagining that high fashion doesn’t affect her. / Priestly explains how the deep blue color of the assistant’s sweater <strong>[xxx]</strong> over the years from fashion shows to department stores and to the bargain bin in which the poor girl <strong>[xxx]</strong> found her garment.</p>\n<p>顺着英文顺序读：</p>\n<p>在二〇〇六年电影版《穿普拉达的女王》中，由梅丽尔·斯特里普饰演的米兰达·普里斯特利，训斥她那位 <strong>[xxx]</strong> 的助手，因为助手以为高级时装不会影响自己。 / 普里斯特利接着解释，助手毛衣的深蓝色在多年间如何 <strong>[xxx]</strong>：从时装秀进入百货商店，再进入折价区，而这个可怜的女孩 <strong>[xxx]</strong> 在那里找到这件衣服。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. lack of imagination</h3>\n<blockquote>\n<p>缺乏想象力</p>\n</blockquote>\n<p>把A接回题干，它说的是：Priestly批评助手，是因为助手缺乏想象力。</p>\n<p>A里的“lack of imagination”和原文“imagining that high fashion doesn’t affect her”都落在助手被批评的原因上，因为两者都在说明这个原因，所以回看第一句中scolds后面的for从句。</p>\n<blockquote>\n<p>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her <strong>[xxx]</strong> assistant for imagining that high fashion doesn’t affect her.</p>\n</blockquote>\n<p>原文“imagining that high fashion doesn’t affect her”写的是助手作出“高级时装不影响自己”的判断；A的“lack of imagination”则把问题写成想象能力不足。两边都围绕imagine展开，但一个是判断内容，一个是能力评价，这个差别仍然存在。</p>\n<p><strong>助手作出“高级时装不影响自己”的判断，能不能直接等同于她缺乏想象力？</strong></p>\n<p>还不能直接等同。词形和批评原因确实能接上，但句子没有明确把错误判断解释成能力缺陷，A暂时不能被排掉。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. poor bargaining <strong>[xxx]</strong></h3>\n<blockquote>\n<p>糟糕的议价 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：Priestly批评助手，是因为助手议价方面很差。</p>\n<p>B里的“poor bargaining”和原文“high fashion doesn’t affect her”都被放进批评原因，因为题干问的是同一个for原因，所以回看第一句中for imagining that后面的内容。</p>\n<blockquote>\n<p>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her <strong>[xxx]</strong> assistant for imagining that high fashion doesn’t affect her.</p>\n</blockquote>\n<p>原文“high fashion doesn’t affect her”说的是助手对时尚影响的认识；B的“poor bargaining”说的是交易或议价表现。两者的对象和行为都不同，原句的批评原因并没有转向买卖能力。</p>\n<p><strong>“认为高级时装不影响自己”是否等于“议价方面很差”？</strong></p>\n<p>不等于。前者是对时尚影响的判断，后者是交易能力；助手前面的遮挡形容词也不会改动for从句给出的原因。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. obsession with high fashion</h3>\n<blockquote>\n<p>沉迷高级时装</p>\n</blockquote>\n<p>把C接回题干，它说的是：Priestly批评助手，是因为助手沉迷高级时装。</p>\n<p>C里的“obsession with high fashion”和原文“doesn’t affect her”都围绕high fashion写助手与时尚的关系，因为一个说沉迷、一个是否认影响，所以回看第一句的宾语从句。</p>\n<blockquote>\n<p>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her <strong>[xxx]</strong> assistant for imagining that high fashion doesn’t affect her.</p>\n</blockquote>\n<p>原文“doesn’t affect her”把助手写成认为自己不受高级时装影响；C的“obsession with high fashion”却把她写成过度投入高级时装。主体相同，但两边建立的关系方向相反。</p>\n<p><strong>认为高级时装与自己无关，能不能说明她沉迷高级时装？</strong></p>\n<p>不能。一个是否认受到影响，一个是过度迷恋；否定关系清楚写在原句里。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. insensitivity to fashion</h3>\n<blockquote>\n<p>对时尚不敏感</p>\n</blockquote>\n<p>把D接回题干，它说的是：Priestly批评助手，是因为助手对时尚不敏感。</p>\n<p>D里的“insensitivity to fashion”和原文“high fashion doesn’t affect her”都在写助手感觉不到时尚对自己的作用，因为二者意思接近，所以回看第一句中for imagining that后的判断。</p>\n<blockquote>\n<p>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her <strong>[xxx]</strong> assistant for imagining that high fashion doesn’t affect her.</p>\n</blockquote>\n<p>原文“high fashion doesn’t affect her”说助手没有意识到高级时装对自己的影响；D的“insensitivity to fashion”把这种迟钝概括为对时尚不敏感。两边的对象与方向一致。</p>\n<p><strong>把“没有意识到高级时装会影响自己”概括成“对时尚不敏感”，是否说得通？</strong></p>\n<p>能。D没有改换批评对象，也保留了助手感受不到时尚影响这一核心关系。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>21题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮留下A和D。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n<h2>22题</h2>\n<blockquote>\n<p>According to Cline, mass-market labels urge consumers to ______.<br />\n根据Cline的说法，大众市场品牌促使消费者做什么？</p>\n</blockquote>\n<p>题干已经给出Cline，并问大众市场品牌怎样推动消费者。第二段同时出现Cline和mass-market labels，所以直接读完整个第二段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>This <strong>[xxx]</strong> conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion.” In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker <strong>[xxx]</strong> mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable—meant to last only a wash or two, although they don’t advertise that—and to renew their <strong>[xxx]</strong> every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have <strong>[xxx]</strong> fashion cycles, shaking an industry long accustomed to a seasonal pace.</p>\n<p>开始精读：</p>\n<p>This <strong>[xxx]</strong> conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion.” In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. / Quicker <strong>[xxx]</strong> mean less wasted inventory, more frequent releases, and more profit. / These labels encourage style-conscious consumers to see clothes as disposable—meant to last only a wash or two, although they don’t advertise that—and to renew their <strong>[xxx]</strong> every few weeks. / By offering on-trend items at dirt-cheap prices, Cline argues, these brands have <strong>[xxx]</strong> fashion cycles, shaking an industry long accustomed to a seasonal pace.</p>\n<p>顺着英文顺序读：</p>\n<p>这种对时装生意的 <strong>[xxx]</strong> 看法已经极其过时，也与《过度着装》中描写的狂热世界完全不合；那本书是伊丽莎白·克莱因用三年写成的、对“快时尚”的控诉。过去十年左右，技术进步让Zara、H&amp;M和Uniqlo等大众品牌能够更快追随潮流，更准确预判需求。 / 更快的 <strong>[xxx]</strong> 意味着更少的库存浪费、更频繁的新品发布和更多利润。 / 这些品牌鼓励追求款式的消费者把衣服当成一次性用品——只穿洗一两次，尽管品牌不会这样宣传——并且每隔几周就更新自己的 <strong>[xxx]</strong>。 / 克莱因认为，这些品牌通过以极低价格提供当下流行的商品，已经 <strong>[xxx]</strong> 时尚周期，撼动了一个长期习惯按季节运行的行业。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. combat unnecessary waste</h3>\n<blockquote>\n<p>抵制不必要的浪费</p>\n</blockquote>\n<p>把A接回题干，它说的是：大众市场品牌促使消费者抵制不必要的浪费。</p>\n<p>A里的“combat unnecessary waste”和原文“see clothes as disposable”都在写消费者如何对待衣服，因为一个要求减少浪费、一个把衣服当成一次性用品，所以回看第二段以These labels encourage开头的句子。</p>\n<blockquote>\n<p>These labels encourage style-conscious consumers to see clothes as disposable—meant to last only a wash or two, although they don’t advertise that—and to renew their <strong>[xxx]</strong> every few weeks.</p>\n</blockquote>\n<p>原文“see clothes as disposable”让消费者把衣服视为穿洗一两次就可替换的东西；A的“combat unnecessary waste”却要求消费者反过来抵制浪费。两边对消费行为的推动方向相反。</p>\n<p><strong>把衣服当成一次性用品，是否等于抵制不必要的浪费？</strong></p>\n<p>不等于。原句在推动更快替换，A却写成减少浪费，动作方向已经倒转。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. shop for their garments more frequently</h3>\n<blockquote>\n<p>更频繁地购买服装</p>\n</blockquote>\n<p>把B接回题干，它说的是：大众市场品牌促使消费者更频繁地购买服装。</p>\n<p>B里的“shop for their garments more frequently”和原文“every few weeks”都在写购买或更新的频率，因为时间频率直接对应，所以回看第二段中every few weeks所在的句子。</p>\n<blockquote>\n<p>These labels encourage style-conscious consumers to see clothes as disposable—meant to last only a wash or two, although they don’t advertise that—and to renew their <strong>[xxx]</strong> every few weeks.</p>\n</blockquote>\n<p>原文“every few weeks”说明消费者隔几周就更新一次衣物；B的“shop for their garments more frequently”把这个频率概括为更频繁地买衣服。时间范围与动作方向都能对上。</p>\n<p><strong>隔几周就更新衣物，能不能概括成更频繁地购买服装？</strong></p>\n<p>能。B没有增加新的对象或条件，只把更新频率换成了更直白的购买频率。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. resist the <strong>[xxx]</strong> of advertisements</h3>\n<blockquote>\n<p>抵制广告的 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：大众市场品牌促使消费者抵制广告的某种作用。</p>\n<p>C里的“抵制广告”和原文“encourage style-conscious consumers”都在写品牌与消费者之间的推动关系，因为一个说抵制、一个说品牌主动鼓励，所以回看第二段以These labels encourage开头的句子。</p>\n<blockquote>\n<p>These labels encourage style-conscious consumers to see clothes as disposable—meant to last only a wash or two, although they don’t advertise that—and to renew their <strong>[xxx]</strong> every few weeks.</p>\n</blockquote>\n<p>原文“encourage style-conscious consumers”说品牌在推动消费者接受一次性服装并频繁更新；C的“抵制广告”则说品牌推动消费者拒绝广告作用。原文中的推动对象是消费方式，不是对广告的抵抗。</p>\n<p><strong>品牌鼓励消费者频繁更新衣物，是否等于鼓励他们抵制广告？</strong></p>\n<p>不等于。两边的动作对象不同，而且原文的encourage与C的抵制方向也不一致。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. shut out the feverish fashion world</h3>\n<blockquote>\n<p>把狂热的时尚世界挡在外面</p>\n</blockquote>\n<p>把D接回题干，它说的是：大众市场品牌促使消费者远离狂热的时尚世界。</p>\n<p>D里的“shut out the feverish fashion world”和原文“offering on-trend items”都在写消费者与流行时尚的距离，因为一个说隔绝、一个说提供当下流行商品，所以回看第二段最后一句。</p>\n<blockquote>\n<p>By offering on-trend items at dirt-cheap prices, Cline argues, these brands have <strong>[xxx]</strong> fashion cycles, shaking an industry long accustomed to a seasonal pace.</p>\n</blockquote>\n<p>原文“offering on-trend items”让消费者以低价进入流行周期；D的“shut out the feverish fashion world”却让消费者把时尚世界挡在外面。两边建立的是相反的接近关系。</p>\n<p><strong>提供当下流行商品，是否是在促使消费者远离时尚世界？</strong></p>\n<p>不是。原文让消费者更容易参与潮流，D却写成隔绝潮流。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>22题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>22题选B。</strong></p>\n</blockquote>\n<h2>23题</h2>\n<blockquote>\n<p>The word “indictment” (Para. 2) is closest in meaning to ______.<br />\n第二段中的“indictment”最接近哪个意思？</p>\n</blockquote>\n<p>题干直接标出Para. 2。第二段已经在22题完整读过，这里不再重贴整段，只回到其中Cline用indictment评价fast fashion的那句话，再看四个近义词选项。</p>\n<h3>A. accusation</h3>\n<blockquote>\n<p>指控、谴责</p>\n</blockquote>\n<p>把A接回题干，它说的是：第二段中的indictment最接近accusation。</p>\n<p>A里的“accusation”和原文“three-year indictment”都是对某事作负面指责的名词，因为题干问indictment的近义词，所以回看第二段第一句中Cline如何评价fast fashion。</p>\n<blockquote>\n<p>This <strong>[xxx]</strong> conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion.”</p>\n</blockquote>\n<p>原文“three-year indictment”处在couldn’t be more out of date和at odds with这样的负面语境中；A的“accusation”同样表示对某事提出指控。词义方向与语气相同。</p>\n<p><strong>在这种负面评价语境中，indictment能不能理解为accusation？</strong></p>\n<p>能。A既保留了指责动作，也符合Cline批评fast fashion的语气。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. enthusiasm</h3>\n<blockquote>\n<p>热情</p>\n</blockquote>\n<p>把B接回题干，它说的是：第二段中的indictment最接近enthusiasm。</p>\n<p>B里的“enthusiasm”和原文“three-year indictment”都可能表示作者对fast fashion的态度，因为题干问这个态度词的近义词，所以回看第二段第一句的负面语境。</p>\n<blockquote>\n<p>This <strong>[xxx]</strong> conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion.”</p>\n</blockquote>\n<p>原文“three-year indictment”与out of date、at odds with连在一起，表示批评；B的“enthusiasm”表示热情和积极投入。两者的评价方向相反。</p>\n<p><strong>一个与负面批评并列的indictment，能不能表示enthusiasm？</strong></p>\n<p>不能。原句是在谴责fast fashion，不是在表达热情。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. indifference</h3>\n<blockquote>\n<p>冷漠、不关心</p>\n</blockquote>\n<p>把C接回题干，它说的是：第二段中的indictment最接近indifference。</p>\n<p>C里的“indifference”和原文“three-year indictment”都描述Cline对fast fashion的态度，因为题干要比较态度含义，所以回看第二段第一句中indictment周围的评价。</p>\n<blockquote>\n<p>This <strong>[xxx]</strong> conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion.”</p>\n</blockquote>\n<p>原文“three-year indictment”表示花三年作出持续指责；C的“indifference”却表示不关心。一个是主动批评，一个是没有态度投入，关系不同。</p>\n<p><strong>持续三年的指责，是否等于对fast fashion漠不关心？</strong></p>\n<p>不等于。持续批评本身就排除了“不关心”这一含义。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. tolerance</h3>\n<blockquote>\n<p>容忍、宽容</p>\n</blockquote>\n<p>把D接回题干，它说的是：第二段中的indictment最接近tolerance。</p>\n<p>D里的“tolerance”和原文“three-year indictment”都说明Cline怎样对待fast fashion，因为题干要判断这个名词的意思，所以回看第二段第一句中的评价关系。</p>\n<blockquote>\n<p>This <strong>[xxx]</strong> conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion.”</p>\n</blockquote>\n<p>原文“three-year indictment”把fast fashion当作被批评的对象；D的“tolerance”却表示接受或容忍这个对象。两边态度方向相反。</p>\n<p><strong>把fast fashion作为被指责对象，能不能理解成对它的tolerance？</strong></p>\n<p>不能。指责与容忍不是同一态度。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>23题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>23题选A。</strong></p>\n</blockquote>\n<h2>24题</h2>\n<blockquote>\n<p>Which of the following can be inferred from the last paragraph?<br />\n从最后一段可以推断出什么？</p>\n</blockquote>\n<p>题干直接写了last paragraph，所以定位到最后一段。推断题仍要先把这段从开头到结尾读全，再判断各项有没有跨出原句关系。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Though several fast-fashion companies have made efforts to <strong>[xxx]</strong> their impact on labor and the environment—including H&amp;M, with its green Conscious Collection line—Cline believes lasting change can only be effected by the customer. She <strong>[xxx]</strong> the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.</p>\n<p>开始精读：</p>\n<p>Though several fast-fashion companies have made efforts to <strong>[xxx]</strong> their impact on labor and the environment—including H&amp;M, with its green Conscious Collection line—Cline believes lasting change can only be effected by the customer. / She <strong>[xxx]</strong> the idealism common to many advocates of sustainability, be it in food or in energy. / Vanity is a constant; / people will only start shopping more sustainably when they can’t afford not to.</p>\n<p>顺着英文顺序读：</p>\n<p>尽管几家快时尚公司已经努力 <strong>[xxx]</strong> 自己对劳工和环境的影响——其中包括推出绿色Conscious Collection系列的H&amp;M——克莱因认为，持久改变只能由消费者实现。 / 她 <strong>[xxx]</strong> 许多可持续发展倡导者共有的理想主义，无论是在食品领域还是能源领域。 / 虚荣是一个恒定因素； / 只有当人们承担不起不这样做的代价时，他们才会开始以更可持续的方式购物。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. Vanity has more often been found in <strong>[xxx]</strong>.</h3>\n<blockquote>\n<p>虚荣更常见于 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把A接回题干，它说的是：最后一段可以推断，虚荣更常见于某一类人。</p>\n<p>A里的“more often been found”和原文“Vanity is a constant”都在说明虚荣出现的范围和频率，因为一个作群体间比较、一个把它写成恒定因素，所以回看最后两句。</p>\n<blockquote>\n<p>Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.</p>\n</blockquote>\n<p>原文“Vanity is a constant”把虚荣写成普遍而持续的因素；A的“more often been found”却把它改成在某个被遮挡群体中出现得更多。一个是一般常量，一个是群体间频率高低，范围和程度都不同。</p>\n<p><strong>“虚荣是一个恒定因素”能不能推出它在某个群体中更常见？</strong></p>\n<p>不能。无论被遮挡的是哪类人，原句都没有把恒定因素改成群体间的频率比较。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. The fast-fashion industry ignores sustainability.</h3>\n<blockquote>\n<p>快时尚产业忽视可持续性</p>\n</blockquote>\n<p>把B接回题干，它说的是：最后一段可以推断，快时尚产业忽视可持续性。</p>\n<p>B里的“ignores sustainability”和原文“made efforts”都在写快时尚公司怎样对待劳工与环境问题，因为一个说忽视、一个说已经努力，所以回看最后一段第一句。</p>\n<blockquote>\n<p>Though several fast-fashion companies have made efforts to <strong>[xxx]</strong> their impact on labor and the environment—including H&amp;M, with its green Conscious Collection line—Cline believes lasting change can only be effected by the customer.</p>\n</blockquote>\n<p>原文“made efforts”明确说几家公司已经为劳工和环境影响采取行动；B的“ignores sustainability”却说整个行业完全忽视可持续性。B既倒转了动作，也把several companies扩大成整个行业。</p>\n<p><strong>已经为劳工和环境问题作出努力，是否等于忽视可持续性？</strong></p>\n<p>不等于。原文承认努力存在，只是说持久改变仍要靠消费者；B把“努力但不够”改成了“完全忽视”。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. Pricing is vital to environment-friendly purchasing.</h3>\n<blockquote>\n<p>价格对环保购买至关重要</p>\n</blockquote>\n<p>把C接回题干，它说的是：最后一段可以推断，价格是环保购买的重要条件。</p>\n<p>C里的“Pricing is vital”和原文“can’t afford not to”都在写经济负担怎样改变消费者选择，因为afford直接涉及价格，所以回看最后一句。</p>\n<blockquote>\n<p>Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.</p>\n</blockquote>\n<p>原文“can’t afford not to”说消费者只有在经济上无法承担不转向可持续购物的代价时才会改变；C的“Pricing is vital”把这个条件概括成价格至关重要。因果关系能够接上。</p>\n<p><strong>经济上“承担不起不这样做”，能不能说明价格会左右环保购买？</strong></p>\n<p>能。C没有把价格说成唯一因素，只说它很关键，符合only与afford建立的条件关系。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. People are more interested in <strong>[xxx]</strong> garments.</h3>\n<blockquote>\n<p>人们对 <strong>[xxx]</strong> 的衣服更感兴趣</p>\n</blockquote>\n<p>把D接回题干，它说的是：最后一段可以推断，人们对某类衣服更感兴趣。</p>\n<p>D里的“more interested in garments”和原文“can’t afford not to”都试图解释人们为什么改变购物方式，因为一个归因于兴趣、一个归因于经济压力，所以回看最后一句。</p>\n<blockquote>\n<p>Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.</p>\n</blockquote>\n<p>原文“can’t afford not to”把转向可持续购物的原因写成经济上不得不如此；D的“more interested in garments”却把原因改成兴趣增强。无论被遮挡的是哪类衣服，动因都从负担变成了偏好。</p>\n<p><strong>因为经济上不得不改变，是否等于对某类衣服更感兴趣？</strong></p>\n<p>不等于。原文是成本压力，D是兴趣偏好，因果来源不同。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>24题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有C保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>24题选C。</strong></p>\n</blockquote>\n<h2>25题</h2>\n<p><strong>What is the subject of the text?</strong></p>\n<p>这篇文章的主题是什么？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Satire on an extravagant lifestyle.</strong></p>\n<p>对奢侈生活方式的讽刺</p>\n<p>B. <strong>Challenge to a high-fashion myth.</strong></p>\n<p>对高级时装神话的挑战</p>\n<p>C. <strong>Criticism of the fast-fashion industry.</strong></p>\n<p>对快时尚产业的批评</p>\n<p>D. <strong>Exposure of a mass-market secret.</strong></p>\n<p>对大众市场秘密的揭露</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>借电影里一件毛衣的来路说明传统时尚由上而下影响普通消费者</td>\n  <td>先摆出一个熟悉场景里的旧看法</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>指出这种旧图景已经过时，技术让大众品牌快速追潮流、频繁上新并推动消费者把衣服当成一次性用品</td>\n  <td>再说现实已经换了玩法</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>写低价快时尚背后的低薪劳工、资源压力和大量化学品代价</td>\n  <td>接着写第一批代价</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>继续用美国人一年购买巨量衣服、不断丢弃来说明不耐用和浪费</td>\n  <td>再说代价还会继续扩大</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>介绍一位自己做衣服的理想人物，同时承认她几十年的手艺无法快速复制</td>\n  <td>举一个例子说明个人办法难复制</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>承认企业有一些环保努力，但认为持久改变最终要由顾客和经济压力推动</td>\n  <td>最后下结论：改变还得靠另一端</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n<h3>A. Satire on an extravagant lifestyle.</h3>\n<blockquote>\n<p>对奢侈生活方式的讽刺</p>\n</blockquote>\n<p>如果A是主旨，全文应当围绕一种奢侈生活方式展开讽刺，重点写富人炫耀、过度消费和荒唐日常。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先摆出一种奢侈生活的荒唐场景</td>\n  <td>先摆出一个熟悉场景里的旧看法</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再写这种生活怎样诱发过度消费</td>\n  <td>再说现实已经换了玩法</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着写富人炫耀造成的社会代价</td>\n  <td>接着写第一批代价</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>继续列举更多奢华与浪费</td>\n  <td>再说代价还会继续扩大</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举一个人物说明奢侈生活难以维持</td>\n  <td>举一个例子说明个人办法难复制</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后讽刺这种生活方式应当被抛弃</td>\n  <td>最后下结论：改变还得靠另一端</td>\n</tr>\n</tbody>\n</table>\n<p>文章确实写过浪费和虚荣，但对象不是奢侈生活，而是低价、快速、人人参与的大众消费。A把批评对象从快时尚产业换成了奢华阶层。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>B. Challenge to a high-fashion myth.</h3>\n<blockquote>\n<p>对高级时装神话的挑战</p>\n</blockquote>\n<p>如果B是主旨，全文应当主要拆穿高级时装由上而下塑造普通人的神话，重点比较高级时装与大众穿着的关系。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先摆出高级时装影响普通衣着的神话</td>\n  <td>先摆出一个熟悉场景里的旧看法</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再用现实变化直接推翻这个神话</td>\n  <td>再说现实已经换了玩法</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着比较高级时装和大众品牌的力量</td>\n  <td>接着写第一批代价</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>继续说明传统时尚权威已经失效</td>\n  <td>再说代价还会继续扩大</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举一个人物展示新时尚来源</td>\n  <td>举一个例子说明个人办法难复制</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后确认高级时装神话已经破灭</td>\n  <td>最后下结论：改变还得靠另一端</td>\n</tr>\n</tbody>\n</table>\n<p>开头的电影场景和“由上而下”神话只是引子。第二段之后，文章大部分篇幅都在写快时尚的运作、劳工与环境代价、浪费以及改变困难，B只抓住开头。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>C. Criticism of the fast-fashion industry.</h3>\n<blockquote>\n<p>对快时尚产业的批评</p>\n</blockquote>\n<p>如果C是主旨，全文应当先说明快时尚怎样运转，再连续写它对劳工、资源、环境和消费习惯造成的代价，最后讨论改变条件。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先借旧时尚图景引出新的产业变化</td>\n  <td>先摆出一个熟悉场景里的旧看法</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再说明快时尚加速生产和消费</td>\n  <td>再说现实已经换了玩法</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着写劳工、资源和环境代价</td>\n  <td>接着写第一批代价</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>继续写巨量购买与浪费</td>\n  <td>再说代价还会继续扩大</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举一个个人替代方案并说明难复制</td>\n  <td>举一个例子说明个人办法难复制</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后讨论真正改变要靠消费者与成本</td>\n  <td>最后下结论：改变还得靠另一端</td>\n</tr>\n</tbody>\n</table>\n<p>C与全文推进完全一致：先写快时尚怎样加速，再写多层代价，随后检验个人方案，最后讨论消费者和价格条件。它能够覆盖每一段，而不是只覆盖一个例子。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>D. Exposure of a mass-market secret.</h3>\n<blockquote>\n<p>对大众市场秘密的揭露</p>\n</blockquote>\n<p>如果D是主旨，全文应当揭露某个不为人知的大众市场秘密，中心应是一个隐藏事实被发现和曝光。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先暗示大众市场藏着一个秘密</td>\n  <td>先摆出一个熟悉场景里的旧看法</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再揭开秘密的具体内容</td>\n  <td>再说现实已经换了玩法</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着说明秘密伤害了哪些人</td>\n  <td>接着写第一批代价</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>继续展示曝光后的更多证据</td>\n  <td>再说代价还会继续扩大</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举一个知情者补充内幕</td>\n  <td>举一个例子说明个人办法难复制</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>最后要求公众警惕这个隐藏秘密</td>\n  <td>最后下结论：改变还得靠另一端</td>\n</tr>\n</tbody>\n</table>\n<p>文章不是靠悬念揭露一个单一秘密，而是公开评述一套已经可观察的产业模式及其后果。D的“secret”把议论文写成了内幕曝光。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>25题主旨结果</h3>\n<p>四个选项全部代入后，C能够覆盖开头设问、各段展开和结尾收束；另外三项都只能解释局部内容，或者要求文章沿着实际没有出现的方向继续写。</p>\n<p>C与全文推进完全一致：先写快时尚怎样加速，再写多层代价，随后检验个人方案，最后讨论消费者和价格条件。它能够覆盖每一段，而不是只覆盖一个例子。</p>\n<blockquote>\n<p><strong>25题选C。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Criticism of the fast-fashion industry / 对快时尚产业的批评</strong></p>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查21题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. lack of imagination</li>\n<li>D. insensitivity to fashion</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Criticism of the fast-fashion industry / 对快时尚产业的批评</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一遍看第一句时，A和D都有很强的吸引力。A几乎照着<code>imagining</code>的词形走，D则把<code>high fashion doesn’t affect her</code>概括成对时尚影响不敏感。问题在于，快速精读时很容易把“她以为某件事”误读成“她缺少想象力”，而遮挡的外貌评价又会分散注意，所以当时先把两项都留下。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>把题干接回来，A说Priestly因为助手没有想象力而批评她；D说Priestly因为助手感受不到时尚对自己的影响而批评她。A抓的是动词表面的词形，D抓的是<code>imagining that</code>后面那一整件事。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。全文主旨是对快时尚产业的批评，开头电影场景的任务只是说明普通人以为自己与时尚无关，但衣服仍然会被产业链塑造。若A成立，开头应当围绕助手的创造力或想象能力展开，后文也应继续讨论这种能力；实际文章马上解释蓝色毛衣如何从时装秀下沉到商店，后面更一路转向大众品牌、消费速度和浪费。因此A既接不上全文，也没有准确保留第一句的语法关系。</p>\n<p>再看D。D把助手的错误认识概括为“对时尚不敏感”：她没有意识到高级时装如何影响自己身上的毛衣。这个理解与主旨的入口完全一致，因为文章正要从“你以为自己不受影响”转向“产业实际上如何塑造消费”。回到局部原文，Priestly训斥她的直接原因是<code>for imagining that high fashion doesn’t affect her</code>，D对应整个宾语从句，而不是只抓一个长得相似的词。</p>\n<p>第一遍留下A，靠的是<code>imagination</code>与<code>imagining</code>的近似；主旨固定后，这种词形联系反而暴露出它缺少的关系：原文没有评价助手“不会想象”，只说她作出了错误判断。D则同时解释了训斥原因、毛衣例子的必要性以及全文进入快时尚批评的起点。</p>\n<blockquote>\n<p><strong>21题选D。</strong></p>\n</blockquote>\n<h1>5. 最终答案</h1>\n<ul>\n<li><strong>21题：D</strong> — insensitivity to fashion（对时尚不敏感）</li>\n<li><strong>22题：B</strong> — shop for their garments more frequently（更频繁地购买服装）</li>\n<li><strong>23题：A</strong> — accusation（指控、谴责）</li>\n<li><strong>24题：C</strong> — Pricing is vital to environment-friendly purchasing.（价格对环保购买至关重要）</li>\n<li><strong>25题：C</strong> — Criticism of the fast-fashion industry.（对快时尚产业的批评）</li>\n</ul>\n<p>本篇答案：<strong>DBACC</strong>。</p>\n","analysisStartIndex":34,"maskInventory":{"token":"[xxx]","count":103},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"maskAdjustmentState":"not_needed","mainIdeaQid":"25","ordinaryFirstRoundCandidates":{"21":["A","D"],"22":["B"],"23":["A"],"24":["C"]}},"questionOptionFlowVersion":"question_scope_whole_paragraph_then_option_compare_v3","questionFlowPlan":[{"sc
