<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 26题题干\n\n**It is suggested in Paragraph 1 that “behavioural” ads help advertisers to ______.**\n\n> 第一段表明，“行为广告”帮助广告商做什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>26题题干</h2>\n<p><strong>It is suggested in Paragraph 1 that “behavioural” ads help advertisers to ______.</strong></p>\n<blockquote>\n<p>第一段表明，“行为广告”帮助广告商做什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,156,891,35],[230,208,391,34]],"scrollTarget":null,"meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**“The industry” (Para. 3) refers to ______.**\n\n> 第三段中的“the industry”指什么？\n\n题型：**指代题**。\n\n---","html":"<h2>27题题干</h2>\n<p><strong>“The industry” (Para. 3) refers to ______.</strong></p>\n<blockquote>\n<p>第三段中的“the industry”指什么？</p>\n</blockquote>\n<p>题型：<strong>指代题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,461,471,36],[230,514,259,28]],"scrollTarget":null,"meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**Bob Liodice holds that setting DNT as a default ______.**\n\n> Bob Liodice认为把DNT设为默认选项会怎样？\n\n题型：**具体细节题**。\n\n---","html":"<h2>28题题干</h2>\n<p><strong>Bob Liodice holds that setting DNT as a default ______.</strong></p>\n<blockquote>\n<p>Bob Liodice认为把DNT设为默认选项会怎样？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,769,644,34],[230,820,369,34]],"scrollTarget":null,"meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**Which of the following is true according to Paragraph 6?**\n\n> 根据第六段，下面哪项正确？\n\n题型：**具体细节题**。\n\n---","html":"<h2>29题题干</h2>\n<p><strong>Which of the following is true according to Paragraph 6?</strong></p>\n<blockquote>\n<p>根据第六段，下面哪项正确？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,1075,753,34],[230,1126,570,34]],"scrollTarget":null,"meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"## 30题题干\n\n**The author’s attitude towards what Brendon Lynch said in his blog is one of ______.**\n\n> 作者对Brendon Lynch博客中那句话持什么态度？\n\n题型：**全文作者态度题**。\n\n---","html":"<h2>30题题干</h2>\n<p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.</strong></p>\n<blockquote>\n<p>作者对Brendon Lynch博客中那句话持什么态度？</p>\n</blockquote>\n<p>题型：<strong>全文作者态度题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,1381,1002,35],[230,1432,147,36]],"scrollTarget":null,"meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Or, but, although, After all |\n| 态度词 / 评价词 | 先抓个大概好坏 | wasted, horrified, unclear, simple |\n| 动作词 | 先看谁做了什么 | track, respond, ignore, comply |\n| 结果词 | 看最后出了什么事 | less targeted ads, more control |\n| 重复主题词 | 大概知道老在说什么 | DNT, advertisers, consumers, default |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>Or, but, although, After all</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>wasted, horrified, unclear, simple</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>track, respond, ignore, comply</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>less targeted ads, more control</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>DNT, advertisers, consumers, default</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[225,239,942,34],[165,280,1002,34],[165,321,1002,34],[557,361,179,29]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. In the internet age, at least in theory, this **[xxx]** can be much reduced. By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. In the internet age, at least in theory, this <span class=\"mask\">[xxx]</span> can be much reduced. By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n</div></div>","articleRects":[[225,239,942,34],[165,280,1002,34],[165,321,1002,34],[557,361,179,29]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse","coarse":true,"pid":0,"form":0},"contextRaw":""},{"section":"读文章","raw":"An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. / In the internet age, at least in theory, this **[xxx]** can be much reduced. / By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>An old saying has it that half of all advertising budgets are wasted—the trouble 166,979,1001,34],[165,1019,1002,35],[225,1102,942,34],[165,1143,1002,34],[166,1184,1002,35],[165,1225,1002,35],[165,1273,218,28],[225,1307,942,35],[165,1348,1002,35],[165,1390,1002,34],[165,1431,1001,34],[165,1472,1003,34],[165,1513,1001,34],[165,1554,1002,35],[165,1594,1002,36],[165,1636,273,35]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做26至29题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机  click on and say online, companies can aim “behavioural” ads at those most likely to buy.\n>\n> 顺着英文顺序读：\n>\n> 有句老话说，全部广告预算中有一半被浪费了；问题在于，没有人知道是哪一半。 / 在互联网时代，至少从理论上说，这种 **[xxx]** 可以大幅减少。 / 企业通过观察人们搜索什么、点击什么以及在网上说什么，就能把“行为广告”投向最可能购买的人。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>26题</h2>\n<blockquote>\n<p>It is suggested in Paragraph 1 that “behavioural” ads help advertisers to ______.<br />\n第一段表明，“行为广告”帮助广告商做什么？</p>\n</blockquote>\n<p>题干直接给出Paragraph 1，并点出behavioural ads，所以直接把第一段完整读一遍。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. In the internet age, at least in theory, this <strong>[xxx]</strong> can be much reduced. By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n<p>开始精读：</p>\n<p>An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. / In the internet age, at least in theory, this <strong>[xxx]</strong> can be much reduced. / By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n<p>顺着英文顺序读：</p>\n<p>有句老话说，全部广告预算中有一半被浪费了；问题在于，没有人知道是哪一半。 / 在互联网时代，至少从理论上说，这种 <strong>[xxx]</strong> 可以大幅减少。 / 企业通过观察人们搜索什么、点击什么以及在网上说什么，就能把“行为广告”投向最可能购买的人。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[225,239,942,34],[165,280,1002,34],[165,321,1002,34],[557,361,179,29]],"questionRects":[[185,156,891,35],[230,208,391,34],[230,259,479,34],[230,310,454,34],[230,361,404,34]],"scrollTarget":null,"meta":{"kind":"question","qid":"26"}},{"section":"26题","raw":"### A. lower their operational costs\n\n> 降低运营成本\n\n把A接回题干，它说的是：行为广告帮助广告商降低运营成本。\n\nA里的“lower their operational costs”和原文“advertising budgets are wasted”都在写广告投入的成本，因为减少预算浪费会降低经营支出，所以回看第一段前两句。\n\n> An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. In the internet age, at least in theory, this **[xxx]** can be much reduced.\n\n原文“advertising budgets are wasted”先指出广告预算被浪费，随后说在互联网时代这种浪费可以减少；A的“lower their operational costs”把减少无效广告支出概括为降低运营成本。两边的经济结果相同。\n\n**减少被浪费的广告预算，能不能理解为降低广告商的运营成本？**\n\n能。预算浪费减少就意味着同样投放目标所需的无效支出下降，A可以保留。\n\n**第一轮判断：A保留。**","html":"<h3>A. lower their operational costs</h3>\n<blockquote>\n<p>降低运营成本</p>\n</blockquote>\n<p>把A接回题干，它说的是：行为广告帮助广告商降低运营成本。</p>\n<p>A里的“lower their operational costs”和原文“advertising budgets are wasted”都在写广告投入的成本，因为减少预算浪费会降低经营支出，所以回看第一段前两句。</p>\n<blockquote>\n<p>An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. In the internet age, at least in theory, this <strong>[xxx]</strong> can be much reduced.</p>\n</blockquote>\n<p>原文“advertising budgets are wasted”先指出广告预算被浪费，随后说在互联网时代这种浪费可以减少；A的“lower their operational costs”把减少无效广告支出概括为降低运营成本。两边的经济结果相同。</p>\n<p><strong>减少被浪费的广告预算，能不能理解为降低广告商的运营成本？</strong></p>\n<p>能。预算浪费减少就意味着同样投放目标所需的无效支出下降，A可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[225,239,942,34],[165,280,1002,34],[165,321,1002,34],[557,361,179,29]],"questionRects":[[185,156,891,35],[230,208,391,34],[230,259,479,34],[230,310,454,34],[230,361,404,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"26","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“lower their operational costs”和原文“advertising budgets are wasted”都在写广告投入的成本，因为减少预算浪费会降低经营支出，所以回看第一段前两句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"advertising budgets are wasted","visibleOptionAnchor":"lower their operational costs"}}}},{"section":"26题","raw":"### B. ease competition among themselves\n\n> 缓和彼此之间的竞争\n\n把B接回题干，它说的是：行为广告帮助广告商缓和彼此之间的竞争。\n\nB里的“ease competition among themselves”和原文“aim behavioural ads at those most likely to buy”都在说明行为广告带来的作用，因为一个作用于广告商彼此、一个作用于潜在买家，所以回看第一段最后一句。\n\n> By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.\n\n原文“aim behavioural ads at those most likely to buy”建立的是企业与潜在消费者之间的精准投放关系；B的“ease competition among themselves”建立的是广告商彼此之间的竞争关系。作用对象与关系都换了。\n\n**把广告投向最可能购买的人，是否等于缓和广告商彼此的竞争？**\n\n不等于。原句提高的是投放针对性，没有让广告商之间停止或减弱竞争。\n\n**第一轮判断：B排除。**","html":"<h3>B. ease competition among themselves</h3>\n<blockquote>\n<p>缓和彼此之间的竞争</p>\n</blockquote>\n<p>把B接回题干，它说的是：行为广告帮助广告商缓和彼此之间的竞争。</p>\n<p>B里的“ease competition among themselves”和原文“aim behavioural ads at those most likely to buy”都在说明行为广告带来的作用，因为一个作用于广告商彼此、一个作用于潜在买家，所以回看第一段最后一句。</p>\n<blockquote>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n</blockquote>\n<p>原文“aim behavioural ads at those most likely to buy”建立的是企业与潜在消费者之间的精准投放关系；B的“ease competition among themselves”建立的是广告商彼此之间的竞争关系。作用对象与关系都换了。</p>\n<p><strong>把广告投向最可能购买的人，是否等于缓和广告商彼此的竞争？</strong></p>\n<p>不等于。原句提高的是投放针对性，没有让广告商之间停止或减弱竞争。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[225,239,942,34],[165,280,1002,34],[165,321,1002,34],[557,361,179,29]],"questionRects":[[185,156,891,35],[230,208,391,34],[230,259,479,34],[230,310,454,34],[230,361,404,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"26","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_compari p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n</blockquote>\n<p>原文“those most likely to buy”说明企业把行为广告投向最可能购买的人；D的“provide better online services”说的是提升在线服务质量。两者虽然都在线上发生，但提供的对象和动作不同。</p>\n<p><strong>更精准地投放广告，是否等于提供更好的在线服务？</strong></p>\n<p>不等于。广告投放不是服务改进，原句也没有把用户体验作为这一作用的结果。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[225,239,942,34],[165,280,1002,34],[165,321,1002,34],[557,361,179,29]],"questionRects":[[185,156,891,35],[230,208,391,34],[230,259,479,34],[230,310,454,34],[230,361,404,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"26","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“provide better online services”和原文“those most likely to buy”都发生在互联网环境中，因为一个说改善服务、一个说广告投向最可能购买的人，所以回看第一段最后一句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"those most likely to buy","visibleOptionAnchor":"provide better online services"}}}},{"section":"26题","raw":"### 26题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **26题选A。**","html":"<h3>26题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>26题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[185,156,891,35],[230,208,391,34],[230,259,479,34],[230,310,454,34],[230,361,404,34]],"scrollTarget":null,"meta":{"kind":"result","qid":"26"}},{"section":"27题","raw":"## 27题\n\n> “The industry” (Para. 3) refers to ______.  \n> 第三段中的“the industry”指什么？\n\n题干直接标出Para. 3，并要求判断the industry的指代。先把第三段从头到尾读完，重点保留它前面连续出现的机构、浏览器和动作。\n\n> 原文参考：\n>\n> In December 2010 America’s Federal Trade Commission (FTC) **[xxx]** adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year. In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get **[xxx]** on responding to DNT requests.\n>\n> 开始精读：\n>\n> In December 2010 America’s Federal Trade Commission (FTC) **[xxx]** adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. / Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; / Google’s Chrome is due to do so this year. / In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get **[xxx]** on responding to DNT requests.\n>\n> 顺着英文顺序读：\n>\n> 二〇一〇年十二月，美国联邦贸易委员会FTC **[xxx]** 在互联网浏览器中加入“不追踪”DNT选项，让用户能够告诉广告商自己不想被追踪。 / 微软的Internet Explorer和苹果的Safari都提供DNT； / 谷歌的Chrome也将在这一年这样做。 / 二月，FTC与数字广告联盟DAA同意，相关行业将 **[xxx]** 如何回应DNT请求。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>27题</h2>\n<blockquote>\n<p>“The industry” (Para. 3) refers to ______.<br />\n第三段中的“the industry”指什么？</p>\n</blockquote>\n<p>题干直接标出Para. 3，并要求判断the industry的指代。先把第三段从头到尾读完，重点保留它前面连续出现的机构、浏览器和动作。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In December 2010 America’s Federal Trade Commission (FTC) <strong>[xxx]</strong> adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year. In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get <strong>[xxx]</strong> on responding to DNT requests.</p>\n<p>开始精读：</p>\n<p>In December 2010 America’s Federal Trade Commission (FTC) <strong>[xxx]</strong> adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. / Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; / Google’s Chrome is due to do so this year. / In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get <strong>[xxx]</strong> on responding to DNT requests.</p>\n<p>顺着英文顺序读：</p>\n<p>二〇一〇年十二月，美国联邦贸易委员会FTC <strong>[xxx]</strong> 在互联网浏览器中加入“不追踪”DNT选项，让用户能够告诉广告商自己不想被追踪。 / 微软的Internet Explorer和苹果的Safari都提供DNT； / 谷歌的Chrome也将在这一年这样做。 / 二月，FTC与数字广告联盟DAA同意，相关行业将 <strong>[xxx]</strong> 如何回应DNT请求。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[225,525,942,36],[165,566,1002,36],[165,609,1003,34],[165,650,994,34],[165,690,1002,35],[165,732,678,36]],"questionRects":[[185,461,471,36],[230,514,259,28],[230,565,332,28],[230,616,376,34],[268,667,342,34]],"scrollTarget":null,"meta":{"kind":"question","qid":"27"}},{"section":"27题","raw":"### A. online advertisers\n\n> 在线广告商\n\n把A接回题干，它说的是：第三段中的the industry指在线广告商。\n\nA里的“online advertisers”和原文“internet browsers”都出现在DNT信号的传递链中，因为advertisers是接收用户意愿的一方，而browsers是提供DNT的一方，所以回看第三段前两句及其后的产品列举。\n\n> In December 2010 America’s Federal Trade Commission (FTC) **[xxx]** adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.\n\n原文“internet browsers”后面连续列出Internet Explorer、Safari和Chrome，承担提供DNT的动作；A的“online advertisers”在第一句中是接收“不想被追踪”意愿的一方。the industry承接前面连续列举的实施主体，而不是接收信号的对象。\n\n**the industry前面连续列举的主体，是online advertisers还是浏览器产品背后的开发者？**\n\n答案是浏览器产品背后的开发者。A把接收用户意愿的一方换成了提供DNT功能的一方。\n\n**第一轮判断：A排除。**","html":"<h3>A. online advertisers</h3>\n<blockquote>\n<p>在线广告商</p>\n</blockquote>\n<p>把A接回题干，它说的是：第三段中的the industry指在线广告商。</p>\n<p>A里的“online advertisers”和原文“internet browsers”都出现在DNT信号的传递链中，因为advertisers是接收用户意愿的一方，而browsers是提供DNT的一方，所以回看第三段前两句及其后的产品列举。</p>\n<blockquote>\n<p>In December 2010 America’s Federal Trade Commission (FTC) <strong>[xxx]</strong> adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.</p>\n</blockquote>\n<p>原文“internet browsers”后面连续列出Internet Explorer、Safari和Chrome，承担提供DNT的动作；A的“online advertisers”在第一句中是接收“不想被追踪”意愿的一方。the industry承接前面连续列举的实施主体，而不是接收信号的对象。</p>\n<p><strong>the industry前面连续列举的主体，是online advertisers还是浏览器产品背后的开发者？</strong></p>\n<p>答案是浏览器产品背后的开发者。A把接收用户意愿的一方换成了提供DNT功能的一方。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[225,525,942,36],[165,566,1002,36],[165,609,1003,34],[165,650,994,34],[165,690,1002,35],[165,732,678,36]],"questionRects":[[185,461,471,36],[230,514,259,28],[230,565,332,28],[230,616,376,34],[268,667,342,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"27","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“online advertisers”和原文“internet browsers”都出现在DNT信号的传递链中，因为advertisers是接收用户意愿的一方，而browsers是提供DNT的一方，所以回看第三段前两句及其后的产品列举。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"mask 组，所以回看第三段第二、三句。</p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.</p>\n</blockquote>\n<p>原文“Internet Explorer and Apple’s Safari”再加上Chrome，连续列出不同公司开发的浏览器；D的“internet browser developers”正好概括这组实施DNT功能的主体。指代范围能够对上。</p>\n<p><strong>把Internet Explorer、Safari和Chrome概括成internet browser developers这一行业，是否合适？</strong></p>\n<p>能。产品名称代表相应开发者，且它们共同承担提供DNT的动作。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[225,525,942,36],[165,566,1002,36],[165,609,1003,34],[165,650,994,34],[165,690,1002,35],[165,732,678,36]],"questionRects":[[185,461,471,36],[230,514,259,28],[230,565,332,28],[230,616,376,34],[268,667,342,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"27","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“internet browser developers”和原文“Internet Explorer and Apple’s Safari”属于同一产品与开发主体关系，因为这些浏览器被连续写成提供DNT的一组，所以回看第三段第二、三句。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"Internet Explorer and Apple’s Safari","visibleOptionAnchor":"internet browser developers"}}}},{"section":"27题","raw":"### 27题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n这一轮只有D保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **27题选D。**","html":"<h3>27题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮只有D保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>27题选D。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[185,461,471,36],[230,514,259,28],[230,565,332,28],[230,616,376,34],[268,667,342,34]],"scrollTarget":null,"meta":{"kind":"result","qid":"27"}},{"section":"28题","raw":"## 28题\n\n> Bob Liodice holds that setting DNT as a default ______.  \n> Bob Liodice认为把DNT设为默认选项会怎样？\n\n题干已经给出Bob Liodice。第五段出现Bob Liodice并完整写出他的判断，因此直接读完整个第五段。\n\n> 原文参考：\n>\n> Advertisers are **[xxx]**. Human nature being what it is, most people **[xxx]** with default settings. Few switch DNT on now, but if tracking is off it will stay off. Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their **[xxx]**. People will not get fewer ads, he says. “They’ll get less **[xxx]**, less targeted ads.”\n>\n> 开始精读：\n>\n> Advertisers are **[xxx]**. / Human nature being what it is, most people **[xxx]** with default settings. / Few switch DNT on now, but if tracking is off it will stay off. / Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their **[xxx]**. / People will not get fewer ads, he says. / “They’ll get less **[xxx]**, less targeted ads.”\n>\n> 顺着英文顺序读：\n>\n> 广告商感到 **[xxx]**。 / 人性如此，多数人会 **[xxx]** 默认设置。 / 现在很少有人主动打开DNT，但如果追踪默认关闭，它就会一直关闭。 / 全国广告商协会首席执行官Bob Liodice说，如果相关行业无法收集消费者 **[xxx]** 的信息，消费者的处境会变差。 / 他说，人们不会因此收到更少的广告。 / “他们得到的广告会更少 **[xxx]**、更缺乏针对性。”\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>28题</h2>\n<blockquote>\n<p>Bob Liodice holds that setting DNT as a default ______.<br />\nBob Liodice认为把DNT设为默认选项会怎样？</p>\n</blockquote>\n<p>题干已经给出Bob Liodice。第五段出现Bob Liodice并完整写出他的判断，因此直接读完整个第五段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Advertisers are <strong>[xxx]</strong>. Human nature being what it is, most people <strong>[xxx]</strong> with default settings. Few switch DNT on now, but if tracking is off it will stay off. Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>. People will not get fewer ads, he says. “They’ll get less <strong>[xxx]</strong>, less targeted ads.”</p>\n<p>开始精读：</p>\n<p>Advertisers are <strong>[xxx]</strong>. / Human nature being what it is, most people <strong>[xxx]</strong> with default settings. / Few switch DNT on now, but if tracking is off it will stay off. / Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>. / People will not get fewer ads, he says. / “They’ll get less <strong>[xxx]</strong>, less targeted ads.”</p>\n<p>顺着英文顺序读：</p>\n<p>广告商感到 <strong>[xxx]</strong>。 / 人性如此，多数人会 <strong>[xxx]</strong> 默认设置。 / 现在很少有人主动打开DNT，但如果追踪默认关闭，它就会一直关闭。 / 全国广告商协会首席执行官Bob Liodice说，如果相关行业无法收集消费者 <strong>[xxx]</strong> 的信息，消费者的处境会变差。 / 他说，人们不会因此收到更少的广告。 / “他们得到的广告会更少 <strong>[xxx]</strong>、更缺乏针对性。”</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[225,855,942,35],[165,896,1002,35],[165,937,998,34],[166,979,1001,34],[165,1019,1002,35]],"questionRects":[[185,769,644,34],[230,820,369,34],[230,871,399,34],[230,922,368,28],[230,973,439,34]],"scrollTarget":null,"meta":{"kind":"question","qid":"28"}},{"section":"28题","raw":"### A. goes against human nature\n\n> 违背人性\n\n把A接回题干，它说的是：Bob Liodice认为把DNT设为默认选项违背人性。\n\nA里的“goes against human nature”和原文“Human nature being what it is”都直接谈人性，因为一个说违背人性、一个用人性解释多数人沿用默认设置，所以回看第五段前两句。\n\n> Advertisers are **[xxx]**. Human nature being what it is, most people **[xxx]** with default settings. Few switch DNT on now, but if tracking is off it will stay off.\n\n原文“Human nature being what it is”把人性作为人们会沿用默认设置的原因；A的“goes against human nature”却说默认设置与人性相冲突。原文是顺着习惯发挥作用，A却改成逆着习惯，两边的关系相反。\n\n**利用人们沿用默认设置的习惯，是否是在违背人性？**\n\n不是。第五段正是因为多数人顺从默认值，才认为默认关闭追踪会持续生效。\n\n**第一轮判断：A排除。**","html":"<h3>A. goes against human nature</h3>\n<blockquote>\n<p>违背人性</p>\n</blockquote>\n<p>把A接回题干，它说的是：Bob Liodice认为把DNT设为默认选项违背人性。</p>\n<p>A里的“goes against human nature”和原文“Human nature being what it is”都直接谈人性，因为一个说违背人性、一个用人性解释多数人沿用默认设置，所以回看第五段前两句。</p>\n<blockquote>\n<p>Advertisers are <strong>[xxx]</strong>. Human nature being what it is, most people <strong>[xxx]</strong> with default settings. Few switch DNT on now, but if tracking is off it will stay off.</p>\n</blockquote>\n<p>原文“Human nature being what it is”把人性作为人们会沿用默认设置的原因；A的“goes against human nature”却说默认设置与人性相冲突。原文是顺着习惯发挥作用，A却改成逆着习惯，两边的关系相反。</p>\n<p><strong>利用人们沿用默认设置的习惯，是否是在违背人性？</strong></p>\n<p>不是。第五段正是因为多数人顺从默认值，才认为默认关闭追踪会持续生效。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[225,855,942,35],[165,896,1002,35],[165,937,998,34],[166,979,1001,34],[165,1019,1002,35]],"questionRects":[[185,769,644,34],[230,820,369,34],[230,871,399,34],[230,922,368,28],[230,973,439,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"28","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“goes against human nature”和原文“Human nature being what it is”都直接谈人性，因为一个说违背人性、一个用人性解释多数人沿用默认设置，所以回看第五段前两句。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"Human nature being what it is","visibleOptionAnchor":"goes against human nature"}}}},{"section":"28题","raw":"### B. fails to affect the ad **[xxx]**\n\n> 不会影响广告 **[xxx]**\n\n把B接回题干，它说的是：Bob Liodice认为把DNT设为默认选项不会影响广告一方的某个对象。\n\nB里的“不会影响广告一方”和原文“consumers will be worse off”都在写DNT默认设置的后果，因为一个判断广告端、一个判断消费者端，所以回看Bob Liodice姓名后的完整判断。\n\n> Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their **[xxx]**.\n\n原文“consumers will be worse off”只把消费者的后果明确写出；B的“不会影响广告一方”判断的是广告端，而且ad后面的具体对象仍被遮挡。两个命题的对象不同，消费者受损不能直接替广告端的完整命题作判断。\n\n**Bob Liodice说消费者会变糟，能不能据此确定“不会影响广告一方”一定错误？**\n\n还不能。消费者后果与广告端的被遮挡对象不是同一个判断，B尚未被完整否定。\n\n**第一轮判断：B保留。**","html":"<h3>B. fails to affect the ad <strong>[xxx]</strong></h3>\n<blockquote>\n<p>不会影响广告 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：Bob Liodice认为把DNT设为默认选项不会影响广告一方的某个对象。</p>\n<p>B里的“不会影响广告一方”和原文“consumers will be worse off”都在写DNT默认设置的后果，因为一个判断广告端、一个判断消费者端，所以回看Bob Liodice姓名后的完整判断。</p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文“consumers will be worse off”只把消费者的后果明确写出；B的“不会影响广告一方”判断的是广告端，而且ad后面的具体对象仍被遮挡。两个命题的对象不同，消费者受损不能直接替广告端的完整命题作判断。</p>\n<p><strong>Bob Liodice说消费者会变糟，能不能据此确定“不会影响广告一方”一定错误？</strong></p>\n<p>还不能。消费者后果与广告端的被遮挡对象不是同一个判断，B尚未被完整否定。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[225,855,942,35],[165,896,1002,35],[165,937,998,34],[166,979,1001,34],[165,1019,1002,35]],"questionRects":[[185,769,644,34],[230,820,369,34],[230,871,399,34],[230,922,368,28],[230,973,439,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"28","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“不会影响广告一方”和原文“consumers will be worse off”都在写DNT默认设置的后果，因为一个判断广告端、一个判断消费者端，所以回看Bob Liodice姓名后的完整判断。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"consumers will be worse off","visibleOptionAnchor":"不会影响广告一方"}}}},{"section":"28题","raw":"### C. will not benefit consumers\n\n> 不会让消费者受益\n\n把C接回题干，它说的是：Bob Liodice认为把DNT设为默认选项不会让消费者受益。\n\nC里的“will not benefit consumers”和原文“consumers will be worse off”都直接判断消费者的结果，因为worse off就是处境变差，所以回看Bob Liodice姓名后的句子。\n\n> Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their **[xxx]**.\n\n原文“consumers will be worse off”说消费者会变得更糟；C的“will not benefit consumers”说消费者不会受益。两边主体相同，结果方向也一致。\n\n**消费者会处境更差，能不能概括成不会让消费者受益？**\n\n能。C只是把worse off换成了更直白的否定受益，没有改变Bob Liodice的判断。\n\n**第一轮判断：C保留。**","html":"<h3>C. will not benefit consumers</h3>\n<blockquote>\n<p>不会让消费者受益</p>\n</blockquote>\n<p>把C接回题干，它说的是：Bob Liodice认为把DNT设为默认选项不会让消费者受益。</p>\n<p>C里的“will not benefit consumers”和原文“consumers will be worse off”都直接判断消费者的结果，因为worse off就是处境变差，所以回看Bob Liodice姓名后的句子。</p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文“consumers will be worse off”说消费者会变得更糟；C的“will not benefit consumers”说消费者不会受益。两边主体相同，结果方向也一致。</p>\n<p><strong>消费者会处境更差，能不能概括成不会让消费者受益？</strong></p>\n<p>能。C只是把worse off换成了更直白的否定受益，没有改变Bob Liodice的判断。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[225,855,942,35],[165,896,1002,35],[165,937,998,34],[166,979,1001,34],[165,1019,1002,35]],"questionRects":[[185,769,644,34],[230,820,369,34],[230,871,399,34],[230,922,368,28],[230,973,439,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"28","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“will not benefit consumers”和原文“consumers will be worse off”都直接判断消费者的结果，因为worse off就是处境变差，所以回看Bob Liodice姓名后的句子。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"consumers will be worse off","visibleOptionAnchor":"will not benefit consumers"}}}},{"section":"28题","raw":"### D. may cut the number of junk ads\n\n> 可能减少垃圾广告的数量\n\n把D接回题干，它说的是：Bob Liodice认为把DNT设为默认选项可能减少垃圾广告数量。\n\nD里的“cut the number of junk ads”和原文“People will not get fewer ads”都在写广告数量，因为一个说数量可能减少、一个明确说不会更少，所以回看Bob Liodice后面的两句。\n\n> People will not get fewer ads, he says. “They’ll get less **[xxx]**, less targeted ads.”\n\n原文“People will not get fewer ads”否定广告数量下降，并把变化写成广告更不精准；D的“cut the number of junk ads”却把结果写成垃圾广告数量减少。原文改变的是广告质量与针对性，D却改成数量减少，两边的动作结果不同。\n\n**明确说不会收到更少广告，能不能支持“垃圾广告数量会减少”？**\n\n不能。Bob Liodice预言的是同样多却更不精准的广告，D把质量变化改成了数量下降。\n\n**第一轮判断：D排除。**","html":"<h3>D. may cut the number of junk ads</h3>\n<blockquote>\n<p>可能减少垃圾广告的数量</p>\n</blockquote>\n<p>把D接回题干，它说的是：Bob Liodice认为把DNT设为默认选项可能减少垃圾广告数量。</p>\n<p>D里的“cut the number of junk ads”和原文“People will not get fewer ads”都在写广告数量，因为一个说数量可能减少、一个明确说不会更少，所以回看Bob Liodice后面的两句。</p>\n<blockquote>\n<p>People will not get fewer ads, he says. “They’ll get less <strong>[xxx]</strong>, less targeted ads.”</p>\n</blockquote>\n<p>原文“People will not get fewer ads”否定广告数量下降，并把变化写成广告更不精准；D的“cut the number of junk ads”却把结果写成垃圾广告数量减少。原文改变的是广告质量与针对性，D却改成数量减少，两边的动作结果不同。</p>\n<p><strong>明确说不会收到更少广告，能不能支持“垃圾广告数量会减少”？</strong></p>\n<p>不能。Bob Liodice预言的是同样多却更不精准的广告，D把质量变化改成了数量下降。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[225,855,942,35],[165,896,1002,35],[165,937,998,34],[166,979,1001,34],[165,1019,1002,35]],"questionRects":[[185,769,644,34],[230,820,369,34],[230,871,399,34],[230,922,368,28],[230,973,439,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"28","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“cut the number of junk ads”和原文“People will not get fewer ads”都在写广告数量，因为一个说数量可能减少、一个明确说不会更少，所以回看Bob Liodice后面的两句。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["negation","action_direction","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"People will not get fewer ads","visibleOptionAnchor":"cut the number of junk ads"}}}},{"section":"28题","raw":"### 28题第一次结果\n\n- A排除。\n- B保留。\n- C保留。\n- D排除。\n\n这一轮留下B和C。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。","html":"<h3>28题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮留下B和C。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n","articleRects":[],"questionRects":[[185,769,644,34],[230,820,369,34],[230,871,399,34],[230,922,368,28],[230,973,439,34]],"scrollTarget":null,"meta":{"kind":"result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> Which of the following is true according to Paragraph 6?  \n> 根据第六段，下面哪项正确？\n\n题干直接给出Paragraph 6，所以定位到第六段，并把这一段完整读完。\n\n> 原文参考：\n>\n> It is not yet clear how advertisers will respond. Getting a DNT signal does not **[xxx]** anyone to stop tracking, although some companies have promised to do so. Unable to tell whether someone really **[xxx]** to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and **[xxx]** on anyway.\n>\n> 开始精读：\n>\n> It is not yet clear how advertisers will respond. / Getting a DNT signal does not **[xxx]** anyone to stop tracking, although some companies have promised to do so. / Unable to tell whether someone really **[xxx]** to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and **[xxx]** on anyway.\n>\n> 顺着英文顺序读：\n>\n> 广告商将如何回应，目前还不清楚。 / 收到DNT信号并不会 **[xxx]** 任何人停止追踪，尽管一些公司已经承诺这样做。 / 广告商无法判断某人是真的 **[xxx]** 行为广告，还是只是沿用微软的默认设置，因此有些公司可能会忽略DNT信号，照样 **[xxx]** 下去。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>29题</h2>\n<blockquote>\n<p>Which of the following is true according to Paragraph 6?<br />\n根据第六段，下面哪项正确？</p>\n</blockquote>\n<p>题干直接给出Paragraph 6，所以定位到第六段，并把这一段完整读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>It is not yet clear how advertisers will respond. Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so. Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n<p>开始精读：</p>\n<p>It is not yet clear how advertisers will respond. / Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so. / Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n<p>顺着英文顺序读：</p>\n<p>广告商将如何回应，目前还不清楚。 / 收到DNT信号并不会 <strong>[xxx]</strong> 任何人停止追踪，尽管一些公司已经承诺这样做。 / 广告商无法判断某人是真的 <strong>[xxx]</strong> 行为广告，还是只是沿用微软的默认设置，因此有些公司可能会忽略DNT信号，照样 <strong>[xxx]</strong> 下去。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[225,1102,942,34],[165,1143,1002,34],[166,1184,1002,35],[165,1225,1002,35],[165,1273,218,28]],"questionRects":[[185,1075,753,34],[230,1126,570,34],[231,1177,547,35],[230,1228,620,35],[268,1279,596,35]],"scrollTarget":null,"meta":{"kind":"question","qid":"29"}},{"section":"29题","raw":"### A. Advertisers are willing to implement DNT.\n\n> 广告商愿意实施DNT\n\n把A接回题干，它说的是：根据第六段，广告商愿意实施DNT。\n\nA里的“Advertisers are willing”和原文“some companies have promised”都在写广告商是否愿意停止追踪，因为一个概括全部广告商、一个只说部分公司承诺，所以回看第六段前两句。\n\n> It is not yet clear how advertisers will respond. Getting a DNT signal does not **[xxx]** anyone to stop tracking, although some companies have promised to do so.\n\n原文“some companies have promised”只覆盖部分公司，而且开头说广告商将如何回应还不清楚；A的“Advertisers are willing”却把部分承诺扩大成广告商整体的明确意愿。范围和确定程度都被放大。\n\n**部分公司承诺停止追踪，能不能说明广告商整体都愿意实施DNT？**\n\n不能。some companies不等于Advertisers整体，not yet clear也排除了明确的统一意愿。\n\n**第一轮判断：A排除。**","html":"<h3>A. Advertisers are willing to implement DNT.</h3>\n<blockquote>\n<p>广告商愿意实施DNT</p>\n</blockquote>\n<p>把A接回题干，它说的是：根据第六段，广告商愿意实施DNT。</p>\n<p>A里的“Advertisers are willing”和原文“some companies have promised”都在写广告商是否愿意停止追踪，因为一个概括全部广告商、一个只说部分公司承诺，所以回看第六段前两句。</p>\n<blockquote>\n<p>It is not yet clear how advertisers will respond. Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so.</p>\n</blockquote>\n<p>原文“some companies have promised”只覆盖部分公司，而且开头说广告商将如何回应还不清楚；A的“Advertisers are willing”却把部分承诺扩大成广告商整体的明确意愿。范围和确定程度都被放大。</p>\n<p><strong>部分公司承诺停止追踪，能不能说明广告商整体都愿意实施DNT？</strong></p>\n<p>不能。some companies不等于Advertisers整体，not yet clear也排除了明确的统一意愿。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[225,1102,942,34],[165,1143,1002,34],[166,1184,1002,35],[165,1225,1002,35],[165,1273,218,28]],"questionRects":[[185,1075,753,34],[230,1126,570,34],[231,1177,547,35],[230,1228,620,35],[268,1279,596,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"29","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“Advertisers are willing”和原文“some companies have promised”都在写广告商是否愿意停止追踪，因为一个概括全部广告商、一个只说部分公司承诺，所以回看第六段前两句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"some companies have promised","visibleOptionAnchor":"Advertisers are willing"}}}},{"section":"29题","raw":"### B. DNT may not serve its intended purpose.\n\n> DNT可能达不到预期目的\n\n把B接回题干，它说的是：根据第六段，DNT可能达不到预期目的。\n\nB里的“may not serve its intended purpose”和原文“some may ignore a DNT signal”都在写DNT能否真正阻止追踪，因为忽略信号会让这一目的落空，所以回看第六段最后一句。\n\n> Unable to tell whether someone really **[xxx]** to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and **[xxx]** on anyway.\n\n原文“some may ignore a DNT signal”说明有些公司可能不理会用户的DNT信号，仍继续原来的行为；B的“may not serve its intended purpose”正是说DNT可能无法实现阻止追踪的目的。因果能够接上。\n\n**DNT信号可能被忽略，是否意味着它可能达不到预期目的？**\n\n能。信号若不能改变追踪行为，DNT要表达的用户选择就无法落实。\n\n**第一轮判断：B保留。**","html":"<h3>B. DNT may not serve its intended purpose.</h3>\n<blockquote>\n<p>DNT可能达不到预期目的</p>\n</blockquote>\n<p>把B接回题干，它说的是：根据第六段，DNT可能达不到预期目的。</p>\n<p>B里的“may not serve its intended purpose”和原文“some may ignore a DNT signal”都在写DNT能否真正阻止追踪，因为忽略信号会让这一目的落空，所以回看第六段最后一句。</p>\n<blockquote>\n<p>Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n</blockquote>\n<p>原文“some may ignore a DNT signal”说明有些公司可能不理会用户的DNT信号，仍继续原来的行为；B的“may not serve its intended purpose”正是说DNT可能无法实现阻止追踪的目的。因果能够接上。</p>\n<p><strong>DNT信号可能被忽略，是否意味着它可能达不到预期目的？</strong></p>\n<p>能。信号若不能改变追踪行为，DNT要表达的用户选择就无法落实。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[225,1102,942,34],[165,1143,1002,34],[166,1184,1002,35],[165,1225,1002,35],[165,1273,218,28]],"questionRects":[[185,1075,753,34],[230,1126,570,34],[231,1177,547,35],[230,1228,620,35],[268,1279,596,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"29","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“may not serve its intended purpose”和原文“some may ignore a DNT signal”都在写DNT能否真正阻止追踪，因为忽略信号会让这一目的落空，所以回看第六段最后一句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"some may ignore a DNT signal","visibleOptionAnchor":"may not serve its intended purpose"}}}},{"section":"29题","raw":"### C. DNT is losing its popularity among consumers.\n\n> DNT正在消费者中失去人气\n\n把C接回题干，它说的是：根据第六段，DNT正在消费者中失去人气。\n\nC里的“losing its popularity among consumers”和原文“Unable to tell whether someone really”都在判断消费者是否真正反对行为广告，因为一个声称支持度下降、一个说连真实偏好都无法判断，所以回看第六段最后一句。\n\n> Unable to tell whether someone really **[xxx]** to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and **[xxx]** on anyway.\n\n原文“Unable to tell whether someone really”强调无法区分消费者真实反对行为广告，还是只沿用默认设置；C的“losing its popularity among consumers”却断定DNT的受欢迎程度正在下降。原文给的是无法判断，C给的是明确趋势。\n\n**连消费者真实偏好都无法判断，能不能断定DNT正在失去人气？**\n\n不能。第六段没有建立时间上的下降趋势，反而强调现有行为不能说明真实态度。\n\n**第一轮判断：C排除。**","html":"<h3>C. DNT is losing its popularity among consumers.</h3>\n<blockquote>\n<p>DNT正在消费者中失去人气</p>\n</blockquote>\n<p>把C接回题干，它说的是：根据第六段，DNT正在消费者中失去人气。</p>\n<p>C里的“losing its popularity among consumers”和原文“Unable to tell whether someone really”都在判断消费者是否真正反对行为广告，因为一个声称支持度下降、一个说连真实偏好都无法判断，所以回看第六段最后一句。</p>\n<blockquote>\n<p>Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n</blockquote>\n<p>原文“Unable to tell whether someone really”强调无法区分消费者真实反对行为广告，还是只沿用默认设置；C的“losing its popularity among consumers”却断定DNT的受欢迎程度正在下降。原文给的是无法判断，C给的是明确趋势。</p>\n<p><strong>连消费者真实偏好都无法判断，能不能断定DNT正在失去人气？</strong></p>\n<p>不能。第六段没有建立时间上的下降趋势，反而强调现有行为不能说明真实态度。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[225,1102,942,34],[165,1143,1002,34],[166,1184,1002,35],[165,1225,1002,35],[165,1273,218,28]],"questionRects":[[185,1075,753,34],[230,1126,570,34],[231,1177,547,35],[230,1228,620,35],[268,1279,596,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"29","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“losing its popularity among consumers”和原文“Unable to tell whether someone really”都在判断消费者是否真正反对行为广告，因为一个声称支持度下降、一个说连真实偏好都无法判断，所以回看第六段最后一句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree","time","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"Unable to tell whether someone really","visibleOptionAnchor":"losing its popularity among consumers"}}}},{"section":"29题","raw":"### D. Advertisers are obliged to offer **[xxx]** ads.\n\n> 广告商有义务提供 **[xxx]** 广告\n\n把D接回题干，它说的是：根据第六段，广告商有义务提供某类广告。\n\nD里的“有义务提供广告”和原文“stop tracking”都涉及DNT对广告商是否具有约束力，因为一个说必须提供广告、一个讨论是否必须停止追踪，所以回看第六段第二句及最后一句。\n\n> Getting a DNT signal does not **[xxx]** anyone to stop tracking, although some companies have promised to do so. Unable to tell whether someone really **[xxx]** to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and **[xxx]** on anyway.\n\n原文“stop tracking”所在句先否定DNT信号会对所有人形成强制作用，后面又说有些公司可能忽略信号；D的“有义务提供广告”却增加了一项必须履行的提供义务。约束方向和动作对象都不同。\n\n**可能忽略DNT信号继续追踪，是否说明广告商有义务提供某类广告？**\n\n不能。原段讨论的是停止追踪是否受约束，并没有建立必须提供某类广告的义务。\n\n**第一轮判断：D排除。**","html":"<h3>D. Advertisers are obliged to offer <strong>[xxx]</strong> ads.</h3>\n<blockquote>\n<p>广告商有义务提供 <strong>[xxx]</strong> 广告</p>\n</blockquote>\n<p>把D接回题干，它说的是：根据第六段，广告商有义务提供某类广告。</p>\n<p>D里的“有义务提供广告”和原文“stop tracking”都涉及DNT对广告商是否具有约束力，因为一个说必须提供广告、一个讨论是否必须停止追踪，所以回看第六段第二句及最后一句。</p>\n<blockquote>\n<p>Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so. Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n</blockquote>\n<p>原文“stop tracking”所在句先否定DNT信号会对所有人形成强制作用，后面又说有些公司可能忽略信号；D的“有义务提供广告”却增加了一项必须履行的提供义务。约束方向和动作对象都不同。</p>\n<p><strong>可能忽略DNT信号继续追踪，是否说明广告商有义务提供某类广告？</strong></p>\n<p>不能。原段讨论的是停止追踪是否受约束，并没有建立必须提供某类广告的义务。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[225,1102,942,34],[165,1143,1002,34],[166,1184,1002,35],[165,1225,1002,35],[165,1273,218,28]],"questionRects":[[185,1075,753,34],[230,1126,570,34],[231,1177,547,35],[230,1228,620,35],[268,1279,596,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"29","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“有义务提供广告”和原文“stop tracking”都涉及DNT对广告商是否具有约束力，因为一个说必须提供广告、一个讨论是否必须停止追踪，所以回看第六段第二句及最后一句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"stop tracking","visibleOptionAnchor":"有义务提供广告"}}}},{"section":"29题","raw":"### 29题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **29题选B。**","html":"<h3>29题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>29题选B。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[185,1075,753,34],[230,1126,570,34],[231,1177,547,35],[230,1228,620,35],[268,1279,596,35]],"scrollTarget":null,"meta":{"kind":"result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n**The author’s attitude towards what Brendon Lynch said in his blog is one of ______.**\n\n作者对Brendon Lynch博客中那句话持什么态度？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **appreciation**\n\n赞赏\n\nB. **understanding**\n\n理解\n\nC. **indulgence**\n\n纵容\n\nD. **skepticism**\n\n怀疑","html":"<h2>30题</h2>\n<p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.</strong></p>\n<p>作者对Brendon Lynch博客中那句话持什么态度？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>appreciation</strong></p>\n<p>赞赏</p>\n<p>B. <strong>understanding</strong></p>\n<p>理解</p>\n<p>C. <strong>indulgence</strong></p>\n<p>纵容</p>\n<p>D. <strong>skepticism</strong></p>\n<p>怀疑</p>\n","articleRects":[[225,239,942,34],[165,280,1002,34],[165,321,1002,34],[557,361,179,29],[225,403,942,35],[165,444,1002,35],[443,485,723,35],[225,525,942,36],[165,566,1002,36],[165,609,1003,34],[165,650,994,34],[165,690,1002,35],[165,732,678,36],[226,773,940,35],[225,855,942,35],[165,896,1002,35],[165,937,998,34],[166,979,1001,34],[165,1019,1002,35],[225,1102,942,34],[165,1143,1002,34],[166,1184,1002,35],[165,1225,1002,35],[165,1273,218,28],[225,1307,942,35],[165,1348,1002,35],[165,1390,1002,34],[165,1431,1001,34],[165,1472,1003,34],[165,1513,1001,34],[165,1554,1002,35],[165,1594,1002,36],[165,1636,273,35]],"questionRects":[[185,1381,1002,35],[230,1432,147,36],[230,1483,193,35],[230,1534,212,35],[230,1585,175,35],[269,1636,134,35]],"scrollTarget":null,"meta":{"kind":"main_overview","qid":"30"}},{"section":"30题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先说行为广告理论上能减少广告预算浪费，把广告投给更可能购买的人 | 先说一种新办法看起来很有效 |\n| 2 | 提出争议：用户应当默认被追踪，还是必须先明确同意 | 再说是否默认接受的问题 |\n| 3 | 交代监管机构与浏览器方面引入DNT，并表示会回应这种请求 | 接着说各方先答应处理 |\n| 4 | 写微软把DNT设为浏览器默认选项，由此把争议推到台前 | 然后写有人突然改了默认做法 |\n| 5 | 写广告商担心数据收集受限，认为消费者不会少看广告，只会看到更不精准的广告 | 再说反对者为什么不高兴 |\n| 6 | 指出DNT信号并不必然迫使停止追踪，广告商可能忽略它继续 | 但话说回来：实际效果还不确定 |\n| 7 | 继续质疑微软单独行动的动机和效果，并用反问回应“给消费者更多控制权”这句口号 | 最后下结论：一句漂亮话未必够用 |\n\n先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先说行为广告理论上能减少广告预算浪费，把广告投给更可能购买的人</td>\n  <td>先说一种新办法看起来很有效</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>提出争议：用户应当默认被追踪，还是必须先明确同意</td>\n  <td>再说是否默认接受的问题</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>交代监管机构与浏览器方面引入DNT，并表示会回应这种请求</td>\n  <td>接着说各方先答应处理</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>写微软把DNT设为浏览器默认选项，由此把争议推到台前</td>\n  <td>然后写有人突然改了默认做法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>写广告商担心数据收集受限，认为消费者不会少看广告，只会看到更不精准的广告</td>\n  <td>再说反对者为什么不高兴</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>指出DNT信号并不必然迫使停止追踪，广告商可能忽略它继续</td>\n  <td>但话说回来：实际效果还不确定</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>继续质疑微软单独行动的动机和效果，并用反问回应“给消费者更多控制权”这句口号</td>\n  <td>最后下结论：一句漂亮话未必够用</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n","articleRects":[[225,239,942,34],[165,280,1002,34],[165,321,1002,34],[557,361,179,29],[225,403,942,35],[165,444,1002,35],[443,485,723,35],[225,525,942,36],[165,566,1002,36],[165,609,1003,34],[165,650,994,34],[165,690,1002,35],[165,732,678,36],[226,773,940,35],[225,855,942,35],[165,896,1002,35],[165,937,998,34],[166,979,1001,34],[165,1019,1002,35],[225,1102,942,34],[165,1143,1002,34],[166,1184,1002,35],[165,1225,1002,35],[165,1273,218,28],[225,1307,942,35],[165,1348,1002,35],[165,1390,1002,34],[165,1431,1001,34],[165,1472,1003,34],[165,1513,1001,34],[165,1554,1002,35],[165,1594,1002,36],[165,1636,273,35]],"questionRects":[[185,1381,1002,35],[230,1432,147,36],[230,1483,193,35],[230,1534,212,35],[230,1585,175,35],[269,1636,134,35]],"scrollTarget":null,"meta":{"kind":"main_method","qid":"30","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"30题","raw":"### A. appreciation\n\n> 赞赏\n\n如果A是作者态度，全文应当逐步肯定Brendon Lynch的说法，最后把“消费者应有更多控制权”作为值得赞赏的原则落地。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先肯定更精准的办法能减少浪费 | 先说一种新办法看起来很有效 |\n| 2 | 再把用户选择写成明确进步 | 再说是否默认接受的问题 |\n| 3 | 接着说明各方正在落实这种进步 | 接着说各方先答应处理 |\n| 4 | 然后写默认设置扩大用户权利 | 然后写有人突然改了默认做法 |\n| 5 | 再说反对意见不足以推翻好处 | 再说反对者为什么不高兴 |\n| 6 | 但话说回来：问题仍可逐步解决 | 但话说回来：实际效果还不确定 |\n| 7 | 最后下结论：这句主张值得赞赏 | 最后下结论：一句漂亮话未必够用 |\n\n文章没有在结尾赞赏这句话。相反，前面连续写DNT可能不被执行、微软动机不明、默认设置未必成为常态，最后还用反问收住，情绪不是肯定。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>A. appreciation</h3>\n<blockquote>\n<p>赞赏</p>\n</blockquote>\n<p>如果A是作者态度，全文应当逐步肯定Brendon Lynch的说法，最后把“消费者应有更多控制权”作为值得赞赏的原则落地。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先肯定更精准的办法能减少浪费</td>\n  <td>先说一种新办法看起来很有效</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再把用户选择写成明确进步</td>\n  <td>再说是否默认接受的问题</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着说明各方正在落实这种进步</td>\n  <td>接着说各方先答应处理</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后写默认设置扩大用户权利</td>\n  <td>然后写有人突然改了默认做法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再说反对意见不足以推翻好处</td>\n  <td>再说反对者为什么不高兴</td>\n</tr>\n<tr>\n  <td>6 该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查28题：B还是C？\n\n第一遍留下：\n\n- B. fails to affect the ad **[xxx]**\n- C. will not benefit consumers\n\n主旨底牌是：\n\n> **skepticism / 怀疑**\n\n也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。\n\n第一遍读第五段时，B和C都能暂时留下。B的关键词落在广告业，原文确实不断说industry和advertisers；C则直接对应Bob说消费者会`worse off`。但B中被挡住的部分决定了它究竟声称“影响不足”还是别的关系，局部阅读时不宜凭空补，因此先保留两项。\n\n我们先把题干和两个选项接起来。\n\n把题干接回来，B主张把DNT设成默认后，对广告业不会形成某种实质影响；C主张这种做法不会给消费者带来好处。两项都围绕默认设置的后果，只是一个落在广告业，一个落在消费者。\n\n现在拿主旨来检查。\n\n先看B。全文主旨题确定的是作者对“给消费者更多控制权”这句漂亮话持怀疑态度，文章之所以怀疑，恰恰因为默认DNT可能改变追踪、数据收集和广告投放，又未必按承诺执行。广告商“感到震动”、担心无法收集偏好，并预测广告会更不精准，这些内容都说明默认设置会触及广告业，而不是与广告业无关。B要成立，至少需要Bob认为行业基本不受影响；第一遍读到的局部原文说的正相反。\n\n再看C。Bob的判断十分直接：如果广告业不能收集消费者偏好，消费者会`worse off`；他们不会少看广告，只会看到更不相关、更不精准的广告。C把这串后果收成“不会让消费者受益”，没有改变评价方向。它也与全文的怀疑主旨协调：作者并没有把默认DNT当成毫无代价的简单善举，而是展示消费者可能得不到预想中的好处。\n\n回到第一遍，B之所以能留下，是因为遮挡让完整断言暂时不清楚；现在把主旨与局部句子叠在一起，B缺的是“广告业不受影响”这条关系，甚至受到广告商反应的反证。C则在局部有Bob的明确评价，在全文又与作者对简单口号的怀疑相互支持。\n\n> **28题选C。**","html":"<h2>回查28题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. fails to affect the ad <span class=\"mask\">[xxx]</span></li>\n<li>C. will not benefit consumers</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>skepticism / 怀疑</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一遍读第五段时，B和C都能暂时留下。B的关键词落在广告业，原文确实不断说industry和advertisers；C则直接对应Bob说消费者会<code>worse off</code>。但B中被挡住的部分决定了它究竟声称“影响不足”还是别的关系，局部阅读时不宜凭空补，因此先保留两项。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>把题干接回来，B主张把DNT设成默认后，对广告业不会形成某种实质影响；C主张这种做法不会给消费者带来好处。两项都围绕默认设置的后果，只是一个落在广告业，一个落在消费者。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。全文主旨题确定的是作者对“给消费者更多控制权”
