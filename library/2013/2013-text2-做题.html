qZq2sxSbzwFcs26jb7z5tw07WQ72O1J3fF5bPzeuukjyyVN2kJU0zDEmYTRvK7C/XgqPqeRmZF8UyZPNfflbidqbEmH8uy64H/K/aoGqWy6de1PqUu003Iwv68rgHc18bK1CoYxrbfWnt0rFiwcttBSZrjXmn9znz65YjW/nFBtesQ19cZndL3J4rrsk0SypHCyN5t5elXPwxm2OTsL0+D7sb52/HyJD6LN8U9yz2qLloPNUh6IF8XSonpXPbGfJFz1lot7h2W91OXXSnfOlhyid8Lp15nxP2rTgn3d+sMfBBr4gKgVgezeZTuiAkxPYtRi+OaE9oS3QmQrzmuzQE+5VlAv+80IafaMuZ8pumyTQNlGqSAL51LS77X1AnrdNJlR3SeMZSaLGzytFeyx7VblS9fvm5P1cehgsNMjj0k/1Yz+VlsoXl3LChbV8tuUeuquhVrPeehnn5jyW17yK2q/0j+jNso8zsz8rI0igP5pHsBd2qlozQH04fKd82z6aL1wr/Jf1dBp7Uy3y7+xulb3TqR0iBMsQv05rD1Bv1NToYNn/6I1F1bZ6C0o9N//vPff//9999///3333///ffff//9999///3333///ffff//9999///3333///SeEAA==","articleSize":{"w":1353,"h":1885},"questionSize":{"w":1353,"h":1885},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>26题题干</h2>\n<p><strong>It is suggested in Paragraph 1 that “behavioural” ads help advertisers to ______.</strong></p>\n<blockquote>\n<p>第一段表明，“行为广告”帮助广告商做什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>27题题干</h2>\n<p><strong>“The industry” (Para. 3) refers to ______.</strong></p>\n<blockquote>\n<p>第三段中的“the industry”指什么？</p>\n</blockquote>\n<p>题型：<strong>指代题</strong>。</p>\n<hr />\n<h2>28题题干</h2>\n<p><strong>Bob Liodice holds that setting DNT as a default ______.</strong></p>\n<blockquote>\n<p>Bob Liodice认为把DNT设为默认选项会怎样？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>29题题干</h2>\n<p><strong>Which of the following is true according to Paragraph 6?</strong></p>\n<blockquote>\n<p>根据第六段，下面哪项正确？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>30题题干</h2>\n<p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.</strong></p>\n<blockquote>\n<p>作者对Brendon Lynch博客中那句话持什么态度？</p>\n</blockquote>\n<p>题型：<strong>全文作者态度题</strong>。</p>\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>Or, but, although, After all</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>wasted, horrified, unclear, simple</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>track, respond, ignore, comply</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>less targeted ads, more control</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>DNT, advertisers, consumers, default</td>\n</tr>\n</tbody>\n</table>\n<p>An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. In the internet age, at least in theory, this <strong>[xxx]</strong> can be much reduced. By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n<p>An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. / In the internet age, at least in theory, this <strong>[xxx]</strong> can be much reduced. / By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n<p>一句老话 has it that 一半广告预算 被浪费—the trouble is, no one knows which half. / 在互联网时代, 至少理论上, this <strong>[xxx]</strong> can be much reduced. / By watching what people search for, 点击什么 and 网上说什么, companies can aim “behavioural” 广告 at those most likely to buy.</p>\n<p>1、一句老话、一半广告预算、被浪费、在互联网时代、至少理论上、点击什么、网上说什么、广告。</p>\n<p>In the past couple of weeks a <strong>[xxx]</strong> has illustrated the value to advertisers of such <strong>[xxx]</strong> information: Should advertisers assume that people are happy to be tracked and sent behavioural ads? Or should they have <strong>[xxx]</strong> permission?</p>\n<p>In the past couple of weeks a <strong>[xxx]</strong> has illustrated the value to advertisers of such <strong>[xxx]</strong> information: Should advertisers assume that people are happy to be tracked and sent behavioural ads? / Or should they have <strong>[xxx]</strong> permission?</p>\n<p>In the past couple of weeks a <strong>[xxx]</strong> 显示了价值 to advertisers of such <strong>[xxx]</strong> 信息: 广告商是否应假定 that people are happy to be tracked and sent behavioural ads? / Or should they have <strong>[xxx]</strong> permission?</p>\n<p>2、显示了价值、信息、广告商是否应假定。</p>\n<p>In December 2010 America’s Federal Trade Commission (FTC) <strong>[xxx]</strong> adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year. In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get <strong>[xxx]</strong> on responding to DNT requests.</p>\n<p>In December 2010 America’s Federal Trade Commission (FTC) <strong>[xxx]</strong> adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. / Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; / Google’s Chrome is due to do so this year. / In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get <strong>[xxx]</strong> on responding to DNT requests.</p>\n<p>2010年12月 America’s 联邦贸易委员会 (FTC) <strong>[xxx]</strong> adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. / Microsoft’s 互联网浏览器 and 苹果浏览器 都提供不追踪; / 谷歌浏览器 is due to do so this year. / 二月 the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get <strong>[xxx]</strong> on responding to DNT requests.</p>\n<p>3、2010年12月、联邦贸易委员会、互联网浏览器、苹果浏览器、都提供不追踪、谷歌浏览器、二月。</p>\n<p>On May 31st Microsoft set off the <strong>[xxx]</strong>. It said that Internet Explorer 10, the version due to appear with Windows 8, would have DNT as a default.</p>\n<p>On May 31st Microsoft set off the <strong>[xxx]</strong>. / It said that Internet Explorer 10, the version due to appear with Windows 8, would have DNT as a default.</p>\n<p>5月31日 Microsoft set off the <strong>[xxx]</strong>. / It said that 互联网浏览器10, the version due to appear with 视窗8, would have DNT as a default.</p>\n<p>4、5月31日、互联网浏览器10、视窗8。</p>\n<p>Advertisers are <strong>[xxx]</strong>. Human nature being what it is, most people <strong>[xxx]</strong> with default settings. Few switch DNT on now, but if tracking is off it will stay off. Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>. People will not get fewer ads, he says. “They’ll get less <strong>[xxx]</strong>, less targeted ads.”</p>\n<p>Advertisers are <strong>[xxx]</strong>. / Human nature being what it is, most people <strong>[xxx]</strong> with default settings. / Few switch DNT on now, but if tracking is off it will stay off. / Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>. / People will not get fewer ads, he says. / “They’ll get less <strong>[xxx]</strong>, less targeted ads.”</p>\n<p>广告商感到 <strong>[xxx]</strong>. / 人性 being what it is, 多数人 <strong>[xxx]</strong> with 默认设置. / Few switch DNT on now, but if 追踪关闭 it will stay off. / Bob Liodice, the 首席执行官 of the Association of 全国广告商, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>. / People will not get fewer ads, he says. / “They’ll get less <strong>[xxx]</strong>, less targeted ads.”</p>\n<p>5、广告商感到、人性、多数人、默认设置、追踪关闭、首席执行官、全国广告商。</p>\n<p>It is not yet clear how advertisers will respond. Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so. Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n<p>It is not yet clear how advertisers will respond. / Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so. / Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n<p>It is 尚不清楚 how advertisers will respond. / Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so. / 无法判断 whether 某人确实 <strong>[xxx]</strong> to 行为广告 or whether they are sticking with 微软默认设置, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n<p>6、尚不清楚、无法判断、某人确实、行为广告、微软默认设置。</p>\n<p>Also unclear is why Microsoft has gone it alone. After all, it has an ad business too, which it says will <strong>[xxx]</strong> with DNT requests, though it is still working out how. If it is trying to upset Google, which relies almost wholly on advertising, it has chosen an <strong>[xxx]</strong> method: There is no <strong>[xxx]</strong> that DNT by default will become the <strong>[xxx]</strong>. DNT does not seem an obviously huge selling point for Windows 8—though the firm has compared some of its other products favourably with Google’s on that count before. Brendon Lynch, Microsoft’s chief privacy officer, blogged: “We believe consumers should have more control.” Could it really be that simple?</p>\n<p>Also unclear is why Microsoft has gone it alone. / After all, it has an ad business too, which it says will <strong>[xxx]</strong> with DNT requests, though it is still working out how. / If it is trying to upset Google, which relies almost wholly on advertising, it has chosen an <strong>[xxx]</strong> method: There is no <strong>[xxx]</strong> that DNT by default will become the <strong>[xxx]</strong>. / DNT does not seem an obviously huge selling point for Windows 8—though the firm has compared some of its other products favourably with Google’s on that count before. / Brendon Lynch, Microsoft’s chief privacy officer, blogged: “We believe consumers should have more control.” Could it really be that simple?</p>\n<p>同样不清楚 is why Microsoft has gone it alone. / After all, it has an ad business too, which it says will <strong>[xxx]</strong> with 不追踪请求, though it is 仍在研究办法. / If it is 试图打击谷歌, which relies almost wholly on advertising, it has 选择了一种 <strong>[xxx]</strong> method: 并无 <strong>[xxx]</strong> that 默认不追踪 will 成为 <strong>[xxx]</strong>. / DNT 似乎并不 an obviously huge selling point 对视窗8—though 该公司曾比较 some of its 其他产品 比谷歌更好 以前在这方面. / Brendon Lynch, 微软隐私主管, blogged: “We believe consumers should have more control.” Could it really be that simple?</p>\n<p>7、同样不清楚、不追踪请求、仍在研究办法、试图打击谷歌、选择了一种、并无、默认不追踪、成为、似乎并不、对视窗8、该公司曾比较、其他产品、比谷歌更好、以前在这方面、微软隐私主管。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个设置、某一方立场或某句话时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章开头似乎在说广告预算浪费与行为广告；接着出现是否允许追踪、DNT、监管机构和几种浏览器；中间写微软把DNT设成默认，广告商很不高兴；后面又说实际执行并不清楚，微软的动机也不清楚，结尾出现“给消费者更多控制权”和一个反问。</p>\n<p>到这里还不能自然地说清楚：行为广告与DNT为什么冲突，默认设置究竟会怎样影响消费者和广告商，监管机构的承诺能否真正落实，微软为什么单独行动，作者最后的反问到底是肯定还是怀疑。粗读时只要能判断“这篇文章大概在谈DNT、广告追踪和微软的默认设置”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住行为广告、追踪、DNT、默认设置、广告商和结尾反问；它们之间到底是什么关系，等题目问到再精读。</p>\n<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<h2>26题</h2>\n<blockquote>\n<p>It is suggested in Paragraph 1 that “behavioural” ads help advertisers to ______.<br />\n第一段表明，“行为广告”帮助广告商做什么？</p>\n</blockquote>\n<p>题干直接给出Paragraph 1，并点出behavioural ads，所以直接把第一段完整读一遍。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. In the internet age, at least in theory, this <strong>[xxx]</strong> can be much reduced. By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n<p>开始精读：</p>\n<p>An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. / In the internet age, at least in theory, this <strong>[xxx]</strong> can be much reduced. / By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n<p>顺着英文顺序读：</p>\n<p>有句老话说，全部广告预算中有一半被浪费了；问题在于，没有人知道是哪一半。 / 在互联网时代，至少从理论上说，这种 <strong>[xxx]</strong> 可以大幅减少。 / 企业通过观察人们搜索什么、点击什么以及在网上说什么，就能把“行为广告”投向最可能购买的人。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. lower their operational costs</h3>\n<blockquote>\n<p>降低运营成本</p>\n</blockquote>\n<p>把A接回题干，它说的是：行为广告帮助广告商降低运营成本。</p>\n<p>A里的“lower their operational costs”和原文“advertising budgets are wasted”都在写广告投入的成本，因为减少预算浪费会降低经营支出，所以回看第一段前两句。</p>\n<blockquote>\n<p>An old saying has it that half of all advertising budgets are wasted—the trouble is, no one knows which half. In the internet age, at least in theory, this <strong>[xxx]</strong> can be much reduced.</p>\n</blockquote>\n<p>原文“advertising budgets are wasted”先指出广告预算被浪费，随后说在互联网时代这种浪费可以减少；A的“lower their operational costs”把减少无效广告支出概括为降低运营成本。两边的经济结果相同。</p>\n<p><strong>减少被浪费的广告预算，能不能理解为降低广告商的运营成本？</strong></p>\n<p>能。预算浪费减少就意味着同样投放目标所需的无效支出下降，A可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. ease competition among themselves</h3>\n<blockquote>\n<p>缓和彼此之间的竞争</p>\n</blockquote>\n<p>把B接回题干，它说的是：行为广告帮助广告商缓和彼此之间的竞争。</p>\n<p>B里的“ease competition among themselves”和原文“aim behavioural ads at those most likely to buy”都在说明行为广告带来的作用，因为一个作用于广告商彼此、一个作用于潜在买家，所以回看第一段最后一句。</p>\n<blockquote>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n</blockquote>\n<p>原文“aim behavioural ads at those most likely to buy”建立的是企业与潜在消费者之间的精准投放关系；B的“ease competition among themselves”建立的是广告商彼此之间的竞争关系。作用对象与关系都换了。</p>\n<p><strong>把广告投向最可能购买的人，是否等于缓和广告商彼此的竞争？</strong></p>\n<p>不等于。原句提高的是投放针对性，没有让广告商之间停止或减弱竞争。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. avoid complaints from <strong>[xxx]</strong></h3>\n<blockquote>\n<p>避免来自 <strong>[xxx]</strong> 的投诉</p>\n</blockquote>\n<p>把C接回题干，它说的是：行为广告帮助广告商避免某一方的投诉。</p>\n<p>C里的“避免投诉”和原文“those most likely to buy”都涉及广告面对的人群，因为一个把结果写成没有投诉、一个把目标写成更可能购买，所以回看第一段最后一句。</p>\n<blockquote>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n</blockquote>\n<p>原文“those most likely to buy”说行为广告用来找到高购买概率的人；C的“避免投诉”却把作用改成阻止某一方抱怨。一个是提高购买命中率，一个是消除投诉，动作与结果不同。</p>\n<p><strong>锁定最可能购买的人，是否就等于避免投诉？</strong></p>\n<p>不等于。原句只建立“观察网络行为—精准投放—更可能购买”的链条，没有把效果写成投诉减少。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. provide better online services</h3>\n<blockquote>\n<p>提供更好的在线服务</p>\n</blockquote>\n<p>把D接回题干，它说的是：行为广告帮助广告商提供更好的在线服务。</p>\n<p>D里的“provide better online services”和原文“those most likely to buy”都发生在互联网环境中，因为一个说改善服务、一个说广告投向最可能购买的人，所以回看第一段最后一句。</p>\n<blockquote>\n<p>By watching what people search for, click on and say online, companies can aim “behavioural” ads at those most likely to buy.</p>\n</blockquote>\n<p>原文“those most likely to buy”说明企业把行为广告投向最可能购买的人；D的“provide better online services”说的是提升在线服务质量。两者虽然都在线上发生，但提供的对象和动作不同。</p>\n<p><strong>更精准地投放广告，是否等于提供更好的在线服务？</strong></p>\n<p>不等于。广告投放不是服务改进，原句也没有把用户体验作为这一作用的结果。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>26题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>26题选A。</strong></p>\n</blockquote>\n<h2>27题</h2>\n<blockquote>\n<p>“The industry” (Para. 3) refers to ______.<br />\n第三段中的“the industry”指什么？</p>\n</blockquote>\n<p>题干直接标出Para. 3，并要求判断the industry的指代。先把第三段从头到尾读完，重点保留它前面连续出现的机构、浏览器和动作。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In December 2010 America’s Federal Trade Commission (FTC) <strong>[xxx]</strong> adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year. In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get <strong>[xxx]</strong> on responding to DNT requests.</p>\n<p>开始精读：</p>\n<p>In December 2010 America’s Federal Trade Commission (FTC) <strong>[xxx]</strong> adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. / Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; / Google’s Chrome is due to do so this year. / In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get <strong>[xxx]</strong> on responding to DNT requests.</p>\n<p>顺着英文顺序读：</p>\n<p>二〇一〇年十二月，美国联邦贸易委员会FTC <strong>[xxx]</strong> 在互联网浏览器中加入“不追踪”DNT选项，让用户能够告诉广告商自己不想被追踪。 / 微软的Internet Explorer和苹果的Safari都提供DNT； / 谷歌的Chrome也将在这一年这样做。 / 二月，FTC与数字广告联盟DAA同意，相关行业将 <strong>[xxx]</strong> 如何回应DNT请求。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. online advertisers</h3>\n<blockquote>\n<p>在线广告商</p>\n</blockquote>\n<p>把A接回题干，它说的是：第三段中的the industry指在线广告商。</p>\n<p>A里的“online advertisers”和原文“internet browsers”都出现在DNT信号的传递链中，因为advertisers是接收用户意愿的一方，而browsers是提供DNT的一方，所以回看第三段前两句及其后的产品列举。</p>\n<blockquote>\n<p>In December 2010 America’s Federal Trade Commission (FTC) <strong>[xxx]</strong> adding a “do not track” (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed. Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.</p>\n</blockquote>\n<p>原文“internet browsers”后面连续列出Internet Explorer、Safari和Chrome，承担提供DNT的动作；A的“online advertisers”在第一句中是接收“不想被追踪”意愿的一方。the industry承接前面连续列举的实施主体，而不是接收信号的对象。</p>\n<p><strong>the industry前面连续列举的主体，是online advertisers还是浏览器产品背后的开发者？</strong></p>\n<p>答案是浏览器产品背后的开发者。A把接收用户意愿的一方换成了提供DNT功能的一方。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. e-commerce <strong>[xxx]</strong></h3>\n<blockquote>\n<p>电子商务 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：第三段中的the industry指电子商务领域的某类主体。</p>\n<p>B里的“电子商务主体”和原文“Internet Explorer and Apple’s Safari”都是候选行业主体，因为题干要找the industry的前指对象，所以回看第三段中被连续列举并执行offer DNT动作的名称。</p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.</p>\n</blockquote>\n<p>原文“Internet Explorer and Apple’s Safari”以及Chrome都是浏览器产品；B的“电子商务主体”却属于在线交易领域。前文没有把电子商务主体列为提供DNT的那组对象。</p>\n<p><strong>一串浏览器产品名称，能不能指向电子商务主体？</strong></p>\n<p>不能。被连续列出的对象属于浏览器领域，B改换了行业类别。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. digital information analysts</h3>\n<blockquote>\n<p>数字信息分析人员</p>\n</blockquote>\n<p>把C接回题干，它说的是：第三段中的the industry指数字信息分析人员。</p>\n<p>C里的“digital information analysts”和原文“Google’s Chrome”都可能与网络数据有关，因为题干要确定the industry的具体主体，所以回看第三段中谁被写成将要提供DNT。</p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.</p>\n</blockquote>\n<p>原文“Google’s Chrome”与前面的Internet Explorer、Safari组成浏览器产品列表；C的“digital information analysts”是分析人员。产品开发主体与数据分析人员不是同一类对象。</p>\n<p><strong>提供DNT的浏览器列表，是否指向数字信息分析人员？</strong></p>\n<p>不是。句子列的是浏览器产品及其开发方，没有出现分析人员承担这个动作。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. internet browser developers</h3>\n<blockquote>\n<p>互联网浏览器开发者</p>\n</blockquote>\n<p>把D接回题干，它说的是：第三段中的the industry指互联网浏览器开发者。</p>\n<p>D里的“internet browser developers”和原文“Internet Explorer and Apple’s Safari”属于同一产品与开发主体关系，因为这些浏览器被连续写成提供DNT的一组，所以回看第三段第二、三句。</p>\n<blockquote>\n<p>Microsoft’s Internet Explorer and Apple’s Safari both offer DNT; Google’s Chrome is due to do so this year.</p>\n</blockquote>\n<p>原文“Internet Explorer and Apple’s Safari”再加上Chrome，连续列出不同公司开发的浏览器；D的“internet browser developers”正好概括这组实施DNT功能的主体。指代范围能够对上。</p>\n<p><strong>把Internet Explorer、Safari和Chrome概括成internet browser developers这一行业，是否合适？</strong></p>\n<p>能。产品名称代表相应开发者，且它们共同承担提供DNT的动作。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>27题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮只有D保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>27题选D。</strong></p>\n</blockquote>\n<h2>28题</h2>\n<blockquote>\n<p>Bob Liodice holds that setting DNT as a default ______.<br />\nBob Liodice认为把DNT设为默认选项会怎样？</p>\n</blockquote>\n<p>题干已经给出Bob Liodice。第五段出现Bob Liodice并完整写出他的判断，因此直接读完整个第五段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Advertisers are <strong>[xxx]</strong>. Human nature being what it is, most people <strong>[xxx]</strong> with default settings. Few switch DNT on now, but if tracking is off it will stay off. Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>. People will not get fewer ads, he says. “They’ll get less <strong>[xxx]</strong>, less targeted ads.”</p>\n<p>开始精读：</p>\n<p>Advertisers are <strong>[xxx]</strong>. / Human nature being what it is, most people <strong>[xxx]</strong> with default settings. / Few switch DNT on now, but if tracking is off it will stay off. / Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>. / People will not get fewer ads, he says. / “They’ll get less <strong>[xxx]</strong>, less targeted ads.”</p>\n<p>顺着英文顺序读：</p>\n<p>广告商感到 <strong>[xxx]</strong>。 / 人性如此，多数人会 <strong>[xxx]</strong> 默认设置。 / 现在很少有人主动打开DNT，但如果追踪默认关闭，它就会一直关闭。 / 全国广告商协会首席执行官Bob Liodice说，如果相关行业无法收集消费者 <strong>[xxx]</strong> 的信息，消费者的处境会变差。 / 他说，人们不会因此收到更少的广告。 / “他们得到的广告会更少 <strong>[xxx]</strong>、更缺乏针对性。”</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. goes against human nature</h3>\n<blockquote>\n<p>违背人性</p>\n</blockquote>\n<p>把A接回题干，它说的是：Bob Liodice认为把DNT设为默认选项违背人性。</p>\n<p>A里的“goes against human nature”和原文“Human nature being what it is”都直接谈人性，因为一个说违背人性、一个用人性解释多数人沿用默认设置，所以回看第五段前两句。</p>\n<blockquote>\n<p>Advertisers are <strong>[xxx]</strong>. Human nature being what it is, most people <strong>[xxx]</strong> with default settings. Few switch DNT on now, but if tracking is off it will stay off.</p>\n</blockquote>\n<p>原文“Human nature being what it is”把人性作为人们会沿用默认设置的原因；A的“goes against human nature”却说默认设置与人性相冲突。原文是顺着习惯发挥作用，A却改成逆着习惯，两边的关系相反。</p>\n<p><strong>利用人们沿用默认设置的习惯，是否是在违背人性？</strong></p>\n<p>不是。第五段正是因为多数人顺从默认值，才认为默认关闭追踪会持续生效。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. fails to affect the ad <strong>[xxx]</strong></h3>\n<blockquote>\n<p>不会影响广告 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：Bob Liodice认为把DNT设为默认选项不会影响广告一方的某个对象。</p>\n<p>B里的“不会影响广告一方”和原文“consumers will be worse off”都在写DNT默认设置的后果，因为一个判断广告端、一个判断消费者端，所以回看Bob Liodice姓名后的完整判断。</p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文“consumers will be worse off”只把消费者的后果明确写出；B的“不会影响广告一方”判断的是广告端，而且ad后面的具体对象仍被遮挡。两个命题的对象不同，消费者受损不能直接替广告端的完整命题作判断。</p>\n<p><strong>Bob Liodice说消费者会变糟，能不能据此确定“不会影响广告一方”一定错误？</strong></p>\n<p>还不能。消费者后果与广告端的被遮挡对象不是同一个判断，B尚未被完整否定。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. will not benefit consumers</h3>\n<blockquote>\n<p>不会让消费者受益</p>\n</blockquote>\n<p>把C接回题干，它说的是：Bob Liodice认为把DNT设为默认选项不会让消费者受益。</p>\n<p>C里的“will not benefit consumers”和原文“consumers will be worse off”都直接判断消费者的结果，因为worse off就是处境变差，所以回看Bob Liodice姓名后的句子。</p>\n<blockquote>\n<p>Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文“consumers will be worse off”说消费者会变得更糟；C的“will not benefit consumers”说消费者不会受益。两边主体相同，结果方向也一致。</p>\n<p><strong>消费者会处境更差，能不能概括成不会让消费者受益？</strong></p>\n<p>能。C只是把worse off换成了更直白的否定受益，没有改变Bob Liodice的判断。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. may cut the number of junk ads</h3>\n<blockquote>\n<p>可能减少垃圾广告的数量</p>\n</blockquote>\n<p>把D接回题干，它说的是：Bob Liodice认为把DNT设为默认选项可能减少垃圾广告数量。</p>\n<p>D里的“cut the number of junk ads”和原文“People will not get fewer ads”都在写广告数量，因为一个说数量可能减少、一个明确说不会更少，所以回看Bob Liodice后面的两句。</p>\n<blockquote>\n<p>People will not get fewer ads, he says. “They’ll get less <strong>[xxx]</strong>, less targeted ads.”</p>\n</blockquote>\n<p>原文“People will not get fewer ads”否定广告数量下降，并把变化写成广告更不精准；D的“cut the number of junk ads”却把结果写成垃圾广告数量减少。原文改变的是广告质量与针对性，D却改成数量减少，两边的动作结果不同。</p>\n<p><strong>明确说不会收到更少广告，能不能支持“垃圾广告数量会减少”？</strong></p>\n<p>不能。Bob Liodice预言的是同样多却更不精准的广告，D把质量变化改成了数量下降。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>28题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮留下B和C。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n<h2>29题</h2>\n<blockquote>\n<p>Which of the following is true according to Paragraph 6?<br />\n根据第六段，下面哪项正确？</p>\n</blockquote>\n<p>题干直接给出Paragraph 6，所以定位到第六段，并把这一段完整读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>It is not yet clear how advertisers will respond. Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so. Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n<p>开始精读：</p>\n<p>It is not yet clear how advertisers will respond. / Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so. / Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n<p>顺着英文顺序读：</p>\n<p>广告商将如何回应，目前还不清楚。 / 收到DNT信号并不会 <strong>[xxx]</strong> 任何人停止追踪，尽管一些公司已经承诺这样做。 / 广告商无法判断某人是真的 <strong>[xxx]</strong> 行为广告，还是只是沿用微软的默认设置，因此有些公司可能会忽略DNT信号，照样 <strong>[xxx]</strong> 下去。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n<h3>A. Advertisers are willing to implement DNT.</h3>\n<blockquote>\n<p>广告商愿意实施DNT</p>\n</blockquote>\n<p>把A接回题干，它说的是：根据第六段，广告商愿意实施DNT。</p>\n<p>A里的“Advertisers are willing”和原文“some companies have promised”都在写广告商是否愿意停止追踪，因为一个概括全部广告商、一个只说部分公司承诺，所以回看第六段前两句。</p>\n<blockquote>\n<p>It is not yet clear how advertisers will respond. Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so.</p>\n</blockquote>\n<p>原文“some companies have promised”只覆盖部分公司，而且开头说广告商将如何回应还不清楚；A的“Advertisers are willing”却把部分承诺扩大成广告商整体的明确意愿。范围和确定程度都被放大。</p>\n<p><strong>部分公司承诺停止追踪，能不能说明广告商整体都愿意实施DNT？</strong></p>\n<p>不能。some companies不等于Advertisers整体，not yet clear也排除了明确的统一意愿。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. DNT may not serve its intended purpose.</h3>\n<blockquote>\n<p>DNT可能达不到预期目的</p>\n</blockquote>\n<p>把B接回题干，它说的是：根据第六段，DNT可能达不到预期目的。</p>\n<p>B里的“may not serve its intended purpose”和原文“some may ignore a DNT signal”都在写DNT能否真正阻止追踪，因为忽略信号会让这一目的落空，所以回看第六段最后一句。</p>\n<blockquote>\n<p>Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n</blockquote>\n<p>原文“some may ignore a DNT signal”说明有些公司可能不理会用户的DNT信号，仍继续原来的行为；B的“may not serve its intended purpose”正是说DNT可能无法实现阻止追踪的目的。因果能够接上。</p>\n<p><strong>DNT信号可能被忽略，是否意味着它可能达不到预期目的？</strong></p>\n<p>能。信号若不能改变追踪行为，DNT要表达的用户选择就无法落实。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. DNT is losing its popularity among consumers.</h3>\n<blockquote>\n<p>DNT正在消费者中失去人气</p>\n</blockquote>\n<p>把C接回题干，它说的是：根据第六段，DNT正在消费者中失去人气。</p>\n<p>C里的“losing its popularity among consumers”和原文“Unable to tell whether someone really”都在判断消费者是否真正反对行为广告，因为一个声称支持度下降、一个说连真实偏好都无法判断，所以回看第六段最后一句。</p>\n<blockquote>\n<p>Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n</blockquote>\n<p>原文“Unable to tell whether someone really”强调无法区分消费者真实反对行为广告，还是只沿用默认设置；C的“losing its popularity among consumers”却断定DNT的受欢迎程度正在下降。原文给的是无法判断，C给的是明确趋势。</p>\n<p><strong>连消费者真实偏好都无法判断，能不能断定DNT正在失去人气？</strong></p>\n<p>不能。第六段没有建立时间上的下降趋势，反而强调现有行为不能说明真实态度。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. Advertisers are obliged to offer <strong>[xxx]</strong> ads.</h3>\n<blockquote>\n<p>广告商有义务提供 <strong>[xxx]</strong> 广告</p>\n</blockquote>\n<p>把D接回题干，它说的是：根据第六段，广告商有义务提供某类广告。</p>\n<p>D里的“有义务提供广告”和原文“stop tracking”都涉及DNT对广告商是否具有约束力，因为一个说必须提供广告、一个讨论是否必须停止追踪，所以回看第六段第二句及最后一句。</p>\n<blockquote>\n<p>Getting a DNT signal does not <strong>[xxx]</strong> anyone to stop tracking, although some companies have promised to do so. Unable to tell whether someone really <strong>[xxx]</strong> to behavioural ads or whether they are sticking with Microsoft’s default, some may ignore a DNT signal and <strong>[xxx]</strong> on anyway.</p>\n</blockquote>\n<p>原文“stop tracking”所在句先否定DNT信号会对所有人形成强制作用，后面又说有些公司可能忽略信号；D的“有义务提供广告”却增加了一项必须履行的提供义务。约束方向和动作对象都不同。</p>\n<p><strong>可能忽略DNT信号继续追踪，是否说明广告商有义务提供某类广告？</strong></p>\n<p>不能。原段讨论的是停止追踪是否受约束，并没有建立必须提供某类广告的义务。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>29题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有B保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>29题选B。</strong></p>\n</blockquote>\n<h2>30题</h2>\n<p><strong>The author’s attitude towards what Brendon Lynch said in his blog is one of ______.</strong></p>\n<p>作者对Brendon Lynch博客中那句话持什么态度？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>appreciation</strong></p>\n<p>赞赏</p>\n<p>B. <strong>understanding</strong></p>\n<p>理解</p>\n<p>C. <strong>indulgence</strong></p>\n<p>纵容</p>\n<p>D. <strong>skepticism</strong></p>\n<p>怀疑</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先说行为广告理论上能减少广告预算浪费，把广告投给更可能购买的人</td>\n  <td>先说一种新办法看起来很有效</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>提出争议：用户应当默认被追踪，还是必须先明确同意</td>\n  <td>再说是否默认接受的问题</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>交代监管机构与浏览器方面引入DNT，并表示会回应这种请求</td>\n  <td>接着说各方先答应处理</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>写微软把DNT设为浏览器默认选项，由此把争议推到台前</td>\n  <td>然后写有人突然改了默认做法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>写广告商担心数据收集受限，认为消费者不会少看广告，只会看到更不精准的广告</td>\n  <td>再说反对者为什么不高兴</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>指出DNT信号并不必然迫使停止追踪，广告商可能忽略它继续</td>\n  <td>但话说回来：实际效果还不确定</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>继续质疑微软单独行动的动机和效果，并用反问回应“给消费者更多控制权”这句口号</td>\n  <td>最后下结论：一句漂亮话未必够用</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n<h3>A. appreciation</h3>\n<blockquote>\n<p>赞赏</p>\n</blockquote>\n<p>如果A是作者态度，全文应当逐步肯定Brendon Lynch的说法，最后把“消费者应有更多控制权”作为值得赞赏的原则落地。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先肯定更精准的办法能减少浪费</td>\n  <td>先说一种新办法看起来很有效</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再把用户选择写成明确进步</td>\n  <td>再说是否默认接受的问题</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着说明各方正在落实这种进步</td>\n  <td>接着说各方先答应处理</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后写默认设置扩大用户权利</td>\n  <td>然后写有人突然改了默认做法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再说反对意见不足以推翻好处</td>\n  <td>再说反对者为什么不高兴</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>但话说回来：问题仍可逐步解决</td>\n  <td>但话说回来：实际效果还不确定</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后下结论：这句主张值得赞赏</td>\n  <td>最后下结论：一句漂亮话未必够用</td>\n</tr>\n</tbody>\n</table>\n<p>文章没有在结尾赞赏这句话。相反，前面连续写DNT可能不被执行、微软动机不明、默认设置未必成为常态，最后还用反问收住，情绪不是肯定。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>B. understanding</h3>\n<blockquote>\n<p>理解</p>\n</blockquote>\n<p>如果B是作者态度，全文应当主要解释微软为何这样做，并以同理、接受的口吻认可其处境。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先介绍这项办法的现实背景</td>\n  <td>先说一种新办法看起来很有效</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再解释用户与商业之间的两难</td>\n  <td>再说是否默认接受的问题</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着说明各方各有合理考虑</td>\n  <td>接着说各方先答应处理</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后写微软为何作出默认选择</td>\n  <td>然后写有人突然改了默认做法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再解释反对者的担忧</td>\n  <td>再说反对者为什么不高兴</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>但话说回来：双方都有苦衷</td>\n  <td>但话说回来：实际效果还不确定</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后下结论：作者理解这句话</td>\n  <td>最后下结论：一句漂亮话未必够用</td>\n</tr>\n</tbody>\n</table>\n<p>作者确实尝试分析微软可能的动机，但语气始终是“unclear”“no guarantee”，并没有转成体谅或认可。解释疑点不等于表示理解。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>C. indulgence</h3>\n<blockquote>\n<p>纵容</p>\n</blockquote>\n<p>如果C是作者态度，全文应当认为这句话虽有问题但可以原谅，重点为微软开脱。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先承认这项办法带来一些问题</td>\n  <td>先说一种新办法看起来很有效</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再写默认做法可能过于冒进</td>\n  <td>再说是否默认接受的问题</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着列出执行中的不足</td>\n  <td>接着说各方先答应处理</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后说明微软仍有可原谅之处</td>\n  <td>然后写有人突然改了默认做法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再替微软回应反对者</td>\n  <td>再说反对者为什么不高兴</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>但话说回来：问题不必过分追究</td>\n  <td>但话说回来：实际效果还不确定</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后下结论：作者选择宽容</td>\n  <td>最后下结论：一句漂亮话未必够用</td>\n</tr>\n</tbody>\n</table>\n<p>全文没有替微软开脱，也没有说问题可以宽容处理；“Could it really be that simple?”是在继续追问，不是在原谅。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>D. skepticism</h3>\n<blockquote>\n<p>怀疑</p>\n</blockquote>\n<p>如果D是作者态度，全文应当不断摆出执行漏洞、动机疑点和可能后果，最后用反问表示不轻信这句漂亮话。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先承认新办法理论上有效</td>\n  <td>先说一种新办法看起来很有效</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再追问默认同意是否合理</td>\n  <td>再说是否默认接受的问题</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着写表面承诺尚未兑现</td>\n  <td>接着说各方先答应处理</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>然后写默认做法引发冲突</td>\n  <td>然后写有人突然改了默认做法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再写反对者担心实际损失</td>\n  <td>再说反对者为什么不高兴</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>但话说回来：执行效果仍不确定</td>\n  <td>但话说回来：实际效果还不确定</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后下结论：漂亮口号未必可信</td>\n  <td>最后下结论：一句漂亮话未必够用</td>\n</tr>\n</tbody>\n</table>\n<p>D能覆盖整篇文章的疑问链：默认同意是否合理、广告商如何反应、DNT是否有效、微软为何单独行动都没有确定答案。结尾反问直接把怀疑态度落地。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>30题主旨结果</h3>\n<p>四个选项全部代入后，D能够覆盖开头设问、各段展开和结尾收束；另外三项都只能解释局部内容，或者要求文章沿着实际没有出现的方向继续写。</p>\n<p>D能覆盖整篇文章的疑问链：默认同意是否合理、广告商如何反应、DNT是否有效、微软为何单独行动都没有确定答案。结尾反问直接把怀疑态度落地。</p>\n<blockquote>\n<p><strong>30题选D。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>skepticism / 怀疑</strong></p>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查28题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. fails to affect the ad <strong>[xxx]</strong></li>\n<li>C. will not benefit consumers</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>skepticism / 怀疑</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一遍读第五段时，B和C都能暂时留下。B的关键词落在广告业，原文确实不断说industry和advertisers；C则直接对应Bob说消费者会<code>worse off</code>。但B中被挡住的部分决定了它究竟声称“影响不足”还是别的关系，局部阅读时不宜凭空补，因此先保留两项。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>把题干接回来，B主张把DNT设成默认后，对广告业不会形成某种实质影响；C主张这种做法不会给消费者带来好处。两项都围绕默认设置的后果，只是一个落在广告业，一个落在消费者。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。全文主旨题确定的是作者对“给消费者更多控制权”这句漂亮话持怀疑态度，文章之所以怀疑，恰恰因为默认DNT可能改变追踪、数据收集和广告投放，又未必按承诺执行。广告商“感到震动”、担心无法收集偏好，并预测广告会更不精准，这些内容都说明默认设置会触及广告业，而不是与广告业无关。B要成立，至少需要Bob认为行业基本不受影响；第一遍读到的局部原文说的正相反。</p>\n<p>再看C。Bob的判断十分直接：如果广告业不能收集消费者偏好，消费者会<code>worse off</code>；他们不会少看广告，只会看到更不相关、更不精准的广告。C把这串后果收成“不会让消费者受益”，没有改变评价方向。它也与全文的怀疑主旨协调：作者并没有把默认DNT当成毫无代价的简单善举，而是展示消费者可能得不到预想中的好处。</p>\n<p>回到第一遍，B之所以能留下，是因为遮挡让完整断言暂时不清楚；现在把主旨与局部句子叠在一起，B缺的是“广告业不受影响”这条关系，甚至受到广告商反应的反证。C则在局部有Bob的明确评价，在全文又与作者对简单口号的怀疑相互支持。</p>\n<blockquote>\n<p><strong>28题选C。</strong></p>\n</blockquote>\n<h1>5. 最终答案</h1>\n<ul>\n<li><strong>26题：A</strong> — lower their operational costs（降低运营成本）</li>\n<li><strong>27题：D</strong> — internet browser developers（互联网浏览器开发者）</li>\n<li><strong>28题：C</strong> — will not benefit consumers（不会让消费者受益）</li>\n<li><strong>29题：B</strong> — DNT may not serve its intended purpose.（DNT可能达不到预期目的）</li>\n<li><strong>30题：D</strong> — skepticism（怀疑）</li>\n</ul>\n<p>本篇答案：<strong>ADCBD</strong>。</p>\n","analysisStartIndex":38,"maskInventory":{"token":"[xxx]","count":141},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"maskAdjustmentState":"not_needed","mainIdeaQid":"30","ordinaryFirstRoundCandidates":{"26":["A"],"27":["D"],"28":["B","C"],"29":["B"]}},"questionOptionFlowVersion":"question_scope_whole_paragraph_then_option_compare_v3","questionFlowPlan":[{"schema":"question-flow-plan-v3","qid":"26","questionType":"ordinary","paragraphPids":[0],"locator":{"basis":"stem_scope","anchors":["Paragraph 1"],"paragraphPids":[0]},"initialReadingMode":"new","initialParagraphPids":[0],"initialContextParagraphPids":[],"questionEntryStepIndexes":[38],"initialPrecisionStepIndexes":[38],"optionStepIndexes":{"A":39,"B":40,"C":41,"D":42},"extraPrecisionReads":[]},{"schema":"question-flow-plan-v3","qid":"27","questionType":"ordinary","paragraphPids":[2],"locator":{"basis":"stem_scope","anchors":["Para. 3"],"paragraphPids":[2]},"initialReadingMode":"new","initialParagraphPids":[2],"initialContextParagraphPids":[],"questionEntrySt
