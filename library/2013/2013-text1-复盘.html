-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003cp>目标词所在短语是her three-year indictment of “fast fashion”，评价对象为快时尚，评价者是Cline。第2段的短寿命、后面victims与wasteful具体展开负面指控；three-year说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先介绍\u003ccode>Cline\u003c/code>的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看\u003ccode>fashion\u003c/code>这个话题名词。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Cline’s book expresses enthusiasm for the achievements of fast fashion.\u003c/p>\n\u003cp>Cline的书表达了对快时尚成就的热情。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>B\u003c/code>成立，后文应把快速生产、低价及扩大消费写成值得称赞的成就。实际作者用\u003ccode>victims\u003c/code>和\u003ccode>harmful\u003c/code>继续列代价，无法将这条受害叙述接成赞许。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是批评快时尚行业，因此Cline这本书在此应承担揭露问题、提出负面评价的作用。主旨可帮助确定评价方向，具体词义仍需结合victims、harmful与wasteful这些展开内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>enthusiasm\u003cbr>热情\u003c/p>\n\u003c/blockquote>\n\u003cp>全文以行业代价为中心，热情赞许会将这个评价方向翻转。品牌获利是被解释的商业背景，不能越过后面连续的负面证据，拿它替换\u003ccode>Cline\u003c/code>著作的态度。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. indifference\u003c/h3>\n\u003cblockquote>\n\u003cp>冷漠、不关心\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>排除。当时的判断依据是：“不等于。持续批评本身就排除了“不关心”这一含义”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>indifference\u003c/code>是不关心、漠然，缺少评价投入。原文却将\u003ccode>Cline\u003c/code>的书称为长达三年的研究与控诉，并连续呈现她所强调的损害。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>抹去书中鲜明的负面态度，把批评改成没有态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的indictment最接近的意思是冷漠、不关心。\u003c/p>\n\u003c/blockquote>\n\u003cp>目标词所在短语是\u003ccode>her three-year indictment of\u003c/code> “\u003ccode>fast fashion\u003c/code>”，评价对象为快时尚，评价者是\u003ccode>Cline\u003c/code>。第2段的短寿命、后面\u003ccode>victims\u003c/code>与\u003ccode>wasteful\u003c/code>具体展开负面指控；\u003ccode>three-year\u003c/code>说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>indifference\u003c/code>是不关心、漠然，缺少评价投入。原文却将\u003ccode>Cline\u003c/code>的书称为长达三年的研究与控诉，并连续呈现她所强调的损害。\u003c/p>\n\u003cp>\u003ccode>three-year\u003c/code>本身只表持续时间，但它与后面具体的问题清单连用，显示持续追究，而不是对快时尚后果无所谓。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>抹去书中鲜明的负面态度，把批评改成没有态度。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003cp>目标词所在短语是her three-year indictment of “fast fashion”，评价对象为快时尚，评价者是Cline。第2段的短寿命、后面victims与wasteful具体展开负面指控；three-year说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先介绍\u003ccode>Cline\u003c/code>的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看\u003ccode>fashion\u003c/code>这个话题名词。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Cline’s book shows indifference to the effects of fast fashion.\u003c/p>\n\u003cp>Cline的书对快时尚的影响表现冷漠。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>C\u003c/code>成立，作者应说明她不愿评判或不在意后果。实际后文不但点明劳动与环境受害，还将她归入消费者行动主义传统；这种写法在扩大关注，不能支持漠然。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是批评快时尚行业，因此Cline这本书在此应承担揭露问题、提出负面评价的作用。主旨可帮助确定评价方向，具体词义仍需结合victims、harmful与wasteful这些展开内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>indifference\u003cbr>冷漠、不关心\u003c/p>\n\u003c/blockquote>\n\u003cp>全文借\u003ccode>Cline\u003c/code>展开批评，她的书是推进问题意识的材料。\u003ccode>C\u003c/code>会使第3、4段细数代价失去态度归属；必须保留的是明确批评，而非把词义弱化成不关心。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. tolerance\u003c/h3>\n\u003cblockquote>\n\u003cp>容忍、宽容\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>排除。当时的判断依据是：“不能。指责与容忍不是同一态度”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>tolerance\u003c/code>表示容忍，意味着接受其存在或对问题持宽容态度。原文指出的损害并未被\u003ccode>Cline\u003c/code>开脱，反而成为要求消费改变的理由。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>将对问题的谴责改成容忍问题，改变了评价方向。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的indictment最接近的意思是容忍、宽容。\u003c/p>\n\u003c/blockquote>\n\u003cp>目标词所在短语是\u003ccode>her three-year indictment of\u003c/code> “\u003ccode>fast fashion\u003c/code>”，评价对象为快时尚，评价者是\u003ccode>Cline\u003c/code>。第2段的短寿命、后面\u003ccode>victims\u003c/code>与\u003ccode>wasteful\u003c/code>具体展开负面指控；\u003ccode>three-year\u003c/code>说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>tolerance\u003c/code>表示容忍，意味着接受其存在或对问题持宽容态度。原文指出的损害并未被\u003ccode>Cline\u003c/code>开脱，反而成为要求消费改变的理由。\u003c/p>\n\u003cp>结尾认为消费者才能实现持久改变，说明她希望现状被纠正；这不是因为理解行业困难而允许弊端继续。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>将对问题的谴责改成容忍问题，改变了评价方向。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003cp>目标词所在短语是her three-year indictment of “fast fashion”，评价对象为快时尚，评价者是Cline。第2段的短寿命、后面victims与wasteful具体展开负面指控；three-year说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先介绍\u003ccode>Cline\u003c/code>的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看\u003ccode>fashion\u003c/code>这个话题名词。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Cline’s book argues for tolerance of the harmful practices of fast fashion.\u003c/p>\n\u003cp>Cline的书主张容忍快时尚的有害做法。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>需要解释为何弊端可以接受，后文应给出宽容的理由。实际作者不断累加受害与浪费，再讨论如何改变消费，没有出现替现状开脱的推进。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是批评快时尚行业，因此Cline这本书在此应承担揭露问题、提出负面评价的作用。主旨可帮助确定评价方向，具体词义仍需结合victims、harmful与wasteful这些展开内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>tolerance\u003cbr>容忍、宽容\u003c/p>\n\u003c/blockquote>\n\u003cp>行业批评与改变的讨论要求先承认问题值得纠正。\u003ccode>D\u003c/code>把这种态度写成宽容，无法解释为何作者要用大量后果支撑\u003ccode>Cline\u003c/code>的控诉；它不只是程度较弱，而是评价功能换了。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>23题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>23. A. accusation\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>保留了评价的负面方向与被追责的对象，是语境中的近义解释。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把针对快时尚的批评性调查改成对它的积极热情。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>抹去书中鲜明的负面态度，把批评改成没有态度。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>将对问题的谴责改成容忍问题，改变了评价方向。\u003c/p>\n\u003ch2>24题\u003c/h2>\n\u003cblockquote>\n\u003cp>Which of the following can be inferred from the last paragraph?\u003cbr>从最后一段可以推断出什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>末段推断题。末段先承认几家企业已有减害尝试，再说\u003ccode>Cline\u003c/code>寄望顾客带来持久改变。作者以\u003ccode>She exhibits the idealism common to many advocates of sustainability\u003c/code>质疑这种期待，并用\u003ccode>vanity\u003c/code>与\u003ccode>can’t afford not to\u003c/code>把可持续购物拉回经济约束。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003c/blockquote>\n\u003cp>让步承认企业行动，随后提出顾客改变论，再指出仅靠道德期待过于理想，最后落到负担得起与否。结论不否认全部企业行动，也没有比较理想主义者和其他人的虚荣程度。\u003c/p>\n\u003ch3>A. Vanity has more often been found in idealists.\u003c/h3>\n\u003cblockquote>\n\u003cp>虚荣更常见于理想主义者\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时选项显示为“\u003ccode>Vanity has more often been found in\u003c/code> [\u003ccode>xxx\u003c/code>].”。当时的判断依据是：“不能。无论被遮挡的是哪类人，原句都没有把恒定因素改成群体间的频率比较”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>more often\u003c/code>要求比较理想主义者与其他人，判断谁更常虚荣。\u003ccode>Vanity is a constant\u003c/code>说虚荣是一直存在的因素，没有给出人群频率对比。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把两个不同层面的评价拼成群体差异，新增了\u003ccode>more often\u003c/code>这个比较关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据最后一段可以推断，虚荣更常见于理想主义者。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段先承认几家企业已有减害尝试，再说\u003ccode>Cline\u003c/code>寄望顾客带来持久改变。作者以\u003ccode>She exhibits the idealism common to many advocates of sustainability\u003c/code>质疑这种期待，并用\u003ccode>vanity\u003c/code>与\u003ccode>can’t afford not to\u003c/code>把可持续购物拉回经济约束。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>more often\u003c/code>要求比较理想主义者与其他人，判断谁更常虚荣。\u003ccode>Vanity is a constant\u003c/code>说虚荣是一直存在的因素，没有给出人群频率对比。\u003c/p>\n\u003cp>前面对\u003ccode>idealism\u003c/code>的评价针对\u003ccode>Cline\u003c/code>对消费者的期待过于理想；与下一句\u003ccode>vanity\u003c/code>相邻，不等于作者在测量理想主义者更虚荣。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把两个不同层面的评价拼成群体差异，新增了\u003ccode>more often\u003c/code>这个比较关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003cp>末段先承认几家企业已有减害尝试，再说Cline寄望顾客带来持久改变。作者以She exhibits the idealism common to many advocates of sustainability质疑这种期待，并用vanity与can’t afford not to把可持续购物拉回经济约束。\u003c/p>\n\u003c/blockquote>\n\u003cp>让步承认企业行动，随后提出顾客改变论，再指出仅靠道德期待过于理想，最后落到负担得起与否。结论不否认全部企业行动，也没有比较理想主义者和其他人的虚荣程度。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Idealists are more often vain than other consumers.\u003c/p>\n\u003cp>理想主义者比其他消费者更常表现出虚荣。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>A\u003c/code>成立，应先区分两类人，再给其虚荣表现的比较。实际文章把虚荣作为消费者共同面对的稳定因素，用它解释道德号召的局限，随后转向支付能力；没有分群比较这一步。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚并追问改变能否实现。末段的推论应说明消费改变受什么现实条件制约；全文主题不能替代末句的经济限制，关键仍是only when与can’t afford not to。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Vanity has more often been found in idealists.\u003cbr>虚荣更常见于理想主义者\u003c/p>\n\u003c/blockquote>\n\u003cp>全文关注快时尚消费难以改变的现实原因，不是在给理想主义者做性格排名。\u003ccode>A\u003c/code>即使使用了末段出现的两个概念，也不能把批评某种理想化期待推成一群人更虚荣。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. The fast-fashion industry ignores sustainability.\u003c/h3>\n\u003cblockquote>\n\u003cp>快时尚产业忽视可持续性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>排除。当时的判断依据是：“不等于。原文承认努力存在，只是说持久改变仍要靠消费者；\u003ccode>B\u003c/code>把“努力但不够”改成了“完全忽视””。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>说整个快时尚行业忽视可持续性。段首先明说\u003ccode>several fast-fashion companies have made efforts\u003c/code>，并具体提到\u003ccode>H\u003c/code>&amp;\u003ccode>M\u003c/code>绿色系列，这足以否定完全忽视的概括。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>将“已有减害努力但仍不足”改写为“行业忽视”，抹去让步承认的事实。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据最后一段可以推断，快时尚产业忽视可持续性。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段先承认几家企业已有减害尝试，再说\u003ccode>Cline\u003c/code>寄望顾客带来持久改变。作者以\u003ccode>She exhibits the idealism common to many advocates of sustainability\u003c/code>质疑这种期待，并用\u003ccode>vanity\u003c/code>与\u003ccode>can’t afford not to\u003c/code>把可持续购物拉回经济约束。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>说整个快时尚行业忽视可持续性。段首先明说\u003ccode>several fast-fashion companies have made efforts\u003c/code>，并具体提到\u003ccode>H\u003c/code>&amp;\u003ccode>M\u003c/code>绿色系列，这足以否定完全忽视的概括。\u003c/p>\n\u003cp>企业已有尝试不等于已经解决问题；\u003ccode>Cline\u003c/code>认为持久改变还靠顾客，也不等于此前所有企业行为为零。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>将“已有减害努力但仍不足”改写为“行业忽视”，抹去让步承认的事实。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003cp>末段先承认几家企业已有减害尝试，再说Cline寄望顾客带来持久改变。作者以She exhibits the idealism common to many advocates of sustainability质疑这种期待，并用vanity与can’t afford not to把可持续购物拉回经济约束。\u003c/p>\n\u003c/blockquote>\n\u003cp>让步承认企业行动，随后提出顾客改变论，再指出仅靠道德期待过于理想，最后落到负担得起与否。结论不否认全部企业行动，也没有比较理想主义者和其他人的虚荣程度。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Fast-fashion companies have made no effort to address sustainability.\u003c/p>\n\u003cp>快时尚公司没有为可持续性做出努力。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>成立时段首应列企业拒绝采取措施。实际作者先以\u003ccode>Although\u003c/code>承认措施，再转向为何顾客的持久改变仍难；假设删掉了让步事实，改变了后文讨论的起点。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚并追问改变能否实现。末段的推论应说明消费改变受什么现实条件制约；全文主题不能替代末句的经济限制，关键仍是only when与can’t afford not to。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>The fast-fashion industry ignores sustainability.\u003cbr>快时尚产业忽视可持续性\u003c/p>\n\u003c/blockquote>\n\u003cp>批评行业不能等于否定行业每项改进行动。全文最后正是在承认有限努力之后质疑解决程度，\u003ccode>B\u003c/code>把这种有条件的批评绝对化，局部还与绿色系列的明确例子相冲突。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. Pricing is vital to environment-friendly purchasing.\u003c/h3>\n\u003cblockquote>\n\u003cp>价格对环保购买至关重要\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>保留。当时的判断依据是：“能。\u003ccode>C\u003c/code>没有把价格说成唯一因素，只说它很关键，符合\u003ccode>only\u003c/code>与\u003ccode>afford\u003c/code>建立的条件关系”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>Pricing is vital\u003c/code>把价格或经济负担视为环保购买的重要条件。末句\u003ccode>only when they can’t afford not to\u003c/code>以经济约束限制消费者何时会可持续购物，支持这种重要性。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>概括了经济因素的关键作用，保留\u003ccode>vital\u003c/code>的分量，又没有把它夸成唯一决定一切的机制。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据最后一段可以推断，价格对环保购买至关重要。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段先承认几家企业已有减害尝试，再说\u003ccode>Cline\u003c/code>寄望顾客带来持久改变。作者以\u003ccode>She exhibits the idealism common to many advocates of sustainability\u003c/code>质疑这种期待，并用\u003ccode>vanity\u003c/code>与\u003ccode>can’t afford not to\u003c/code>把可持续购物拉回经济约束。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>Pricing is vital\u003c/code>把价格或经济负担视为环保购买的重要条件。末句\u003ccode>only when they can’t afford not to\u003c/code>以经济约束限制消费者何时会可持续购物，支持这种重要性。\u003c/p>\n\u003cp>这里没有承诺只要环保服装标价低一点所有人都会购买，也不是说消费者偏爱买不起的衣服。重点是改变消费的成本关系不能被道德呼吁替代。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>概括了经济因素的关键作用，保留\u003ccode>vital\u003c/code>的分量，又没有把它夸成唯一决定一切的机制。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003cp>末段先承认几家企业已有减害尝试，再说Cline寄望顾客带来持久改变。作者以She exhibits the idealism common to many advocates of sustainability质疑这种期待，并用vanity与can’t afford not to把可持续购物拉回经济约束。\u003c/p>\n\u003c/blockquote>\n\u003cp>让步承认企业行动，随后提出顾客改变论，再指出仅靠道德期待过于理想，最后落到负担得起与否。结论不否认全部企业行动，也没有比较理想主义者和其他人的虚荣程度。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Financial considerations are vital to whether consumers shop sustainably.\u003c/p>\n\u003cp>经济方面的考虑对消费者是否采取可持续购物方式至关重要。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>C\u003c/code>需要作者从理想倡议转到现实经济条件。文章先认为指望消费者主动改变体现了可持续性倡导者常见的理想主义，再说虚荣不变，最后以\u003ccode>afford\u003c/code>给出条件；实际结尾正完成这一转向。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚并追问改变能否实现。末段的推论应说明消费改变受什么现实条件制约；全文主题不能替代末句的经济限制，关键仍是only when与can’t afford not to。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Pricing is vital to environment-friendly purchasing.\u003cbr>价格对环保购买至关重要\u003c/p>\n\u003c/blockquote>\n\u003cp>全文揭示廉价消费的代价，结尾又说明纠正消费不能只靠善意。\u003ccode>C\u003c/code>把价格与支付条件接入可持续购买，符合从行业问题走向现实限制的收束，同时受末句的\u003ccode>only when\u003c/code>直接支持。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. People are more interested in unaffordable garments.\u003c/h3>\n\u003cblockquote>\n\u003cp>人们对买不起的衣服更感兴趣\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>排除。当时选项显示为“\u003ccode>People are more interested in\u003c/code> [\u003ccode>xxx\u003c/code>] \u003ccode>garments\u003c/code>.”。当时的判断依据是：“不等于。原文是成本压力，\u003ccode>D\u003c/code>是兴趣偏好，因果来源不同”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>more interested\u003c/code>要求兴趣更强，\u003ccode>unaffordable garments\u003c/code>把买不起的衣服当作兴趣对象。原文\u003ccode>can’t afford not to\u003c/code>中的\u003ccode>not to\u003c/code>指不采取可持续购物，谈的是继续旧行为的代价。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>改变了\u003ccode>afford\u003c/code>所连接的行为，并凭空补出兴趣程度的比较。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据最后一段可以推断，人们对买不起的衣服更感兴趣。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段先承认几家企业已有减害尝试，再说\u003ccode>Cline\u003c/code>寄望顾客带来持久改变。作者以\u003ccode>She exhibits the idealism common to many advocates of sustainability\u003c/code>质疑这种期待，并用\u003ccode>vanity\u003c/code>与\u003ccode>can’t afford not to\u003c/code>把可持续购物拉回经济约束。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>more interested\u003c/code>要求兴趣更强，\u003ccode>unaffordable garments\u003c/code>把买不起的衣服当作兴趣对象。原文\u003ccode>can’t afford not to\u003c/code>中的\u003ccode>not to\u003c/code>指不采取可持续购物，谈的是继续旧行为的代价。\u003c/p>\n\u003cp>这不是“买不起某件衣服”，更没有比较人们对贵衣服与可负担衣服的兴趣。双重否定不能拆成孤立的\u003ccode>afford\u003c/code>再配上\u003ccode>garments\u003c/code>。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>改变了\u003ccode>afford\u003c/code>所连接的行为，并凭空补出兴趣程度的比较。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003cp>末段先承认几家企业已有减害尝试，再说Cline寄望顾客带来持久改变。作者以She exhibits the idealism common to many advocates of sustainability质疑这种期待，并用vanity与can’t afford not to把可持续购物拉回经济约束。\u003c/p>\n\u003c/blockquote>\n\u003cp>让步承认企业行动，随后提出顾客改变论，再指出仅靠道德期待过于理想，最后落到负担得起与否。结论不否认全部企业行动，也没有比较理想主义者和其他人的虚荣程度。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Consumers are more interested in garments that they cannot afford.\u003c/p>\n\u003cp>消费者对自己买不起的服装更感兴趣。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>D\u003c/code>成立，作者应解释高价或不可及性怎样增强欲望。实际结尾说明何时经济约束会迫使购物行为变得可持续，讨论的对象是行为选择，不是昂贵衣物的吸引力。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚并追问改变能否实现。末段的推论应说明消费改变受什么现实条件制约；全文主题不能替代末句的经济限制，关键仍是only when与can’t afford not to。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>People are more interested in unaffordable garments.\u003cbr>人们对买不起的衣服更感兴趣\u003c/p>\n\u003c/blockquote>\n\u003cp>快时尚批评与可持续购买之间的转折由经济条件完成。\u003ccode>D\u003c/code>把条件改成对买不起的衣服的偏爱，使结论转到奢侈欲望，既错接\u003ccode>afford\u003c/code>的对象，也失去可持续行为这一落点。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>24题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>24. C. Pricing is vital to environment-friendly purchasing.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>把两个不同层面的评价拼成群体差异，新增了\u003ccode>more often\u003c/code>这个比较关系。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>将“已有减害努力但仍不足”改写为“行业忽视”，抹去让步承认的事实。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>概括了经济因素的关键作用，保留\u003ccode>vital\u003c/code>的分量，又没有把它夸成唯一决定一切的机制。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>改变了\u003ccode>afford\u003c/code>所连接的行为，并凭空补出兴趣程度的比较。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此这里依据本篇阅读的主题与论证关系，扩写、改编成小标题题和排序题供大家练习。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：传统时尚观念的过时\u003c/strong>（段落1-2转折对比） 电影中的自上而下时尚观：（高级时装影响力从时装秀→百货商店→廉价货架）// 现实中的快时尚革命：【技术进步使大众品牌（Zara、H&amp;M、优衣库）能快速反应潮流+精确预测需求→更快周转、更多利润】\u003c/p>\n\u003cp>↓（快时尚的策略）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：快时尚的商业模式\u003c/strong>（段落2核心论述） 消费者行为改变：（衣服被视为一次性用品：只能洗一两次）→ 购买频率加快：（每几周更新衣柜）→ 产业影响：【通过极低价格提供潮流单品→劫持时尚周期→动摇季节性节奏的传统产业】\u003c/p>\n\u003cp>↓（负面影响）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：快时尚的代价\u003c/strong>（段落3-4问题揭示） 受害者不只是设计师：【为提供5.95美元迷你裙→必须：（依赖低工资海外劳工+大量订购损害自然资源+使用有害化学物质）】→ 浪费问题：（美国人年购200亿件服装/人均64件→即使捐赠也造成浪费）→ 类比：大规模生产服装如快餐（满足需求但不耐用且浪费）\u003c/p>\n\u003cp>↓（解决方案的困境）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：理想与现实的差距\u003c/strong>（段落5-6解决方案） 个人解决方案的局限：（莎拉·凯特·博蒙特自制衣服的例子：需要几十年完善手艺→无法复制）→ 企业努力有限：（如H&amp;M的绿色系列）→ 克莱恩的观点：【持久改变只能由消费者实现 // 但虚荣是恒定的→只有当可持续消费成为经济必需时人们才会改变】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：快时尚产业通过技术进步和低价策略改变了传统时尚产业和消费模式，但这种模式对环境、劳工和资源造成严重损害。虽然有个人和企业的努力，但真正的改变需要消费者行为的根本转变，而这只有在经济压力下才可能实现。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>训练用改编文本，不是外刊原文。\u003c/strong>\u003c/p>\n\u003cp>Choose the most suitable heading from the list A–G for each paragraph. There are two extra headings.\u003c/p>\n\u003cp>A. Why a personal alternative is hard to reproduce\u003c/p>\n\u003cp>B. From a seasonal trickle to a rapid commercial cycle\u003c/p>\n\u003cp>C. A bargain for everyone in the supply chain\u003c/p>\n\u003cp>D. Lasting change under the pressure of consumer choices\u003c/p>\n\u003cp>E. The hidden production costs of a cheap garment\u003c/p>\n\u003cp>F. A personal solution that everyone can quickly copy\u003c/p>\n\u003cp>G. When cheap purchases become expensive waste\u003c/p>\n\u003ch4>41. ______\u003c/h4>\n\u003cp>The familiar story of fashion begins on a designer’s runway and ends, much later, in an ordinary shopper’s wardrobe. It imagines a slow movement from an expensive original towards cheaper versions. Fast fashion changes the speed and organisation of that journey. Retailers use information and rapid production to follow demand, release new products frequently and encourage customers to return before a season has ended. A low price makes each purchase seem unimportant; repeated novelty makes not purchasing feel like missing out. The central change is therefore more than the availability of inexpensive clothes. It is a commercial cycle that repeatedly turns a current desire into the need for another visit.\u003c/p>\n\u003ch4>42. ______\u003c/h4>\n\u003cp>The price on a skirt is not a complete account of the resources needed to make it. When a retailer offers the same low-priced item through a large network of stores, production must meet both the price and the volume. That demand can place pressure on workers’ wages, on supplies of water and other natural resources, and on the handling of chemicals. None of these pressures appears as a separate line on the customer’s receipt. The shopper can therefore experience a bargain while someone elsewhere carries a cost. To assess cheap clothing, the calculation must travel backwards from the shop to the conditions of production.\u003c/p>\n\u003ch4>43. ______\u003c/h4>\n\u003cp>The costs do not end when a garment leaves the shop. If low prices and constant arrivals encourage customers to replace usable clothes, a small bill can produce a large stream of unwanted material. A wardrobe full of items worn only briefly is evidence of throughput, not necessarily of a need being met. Donation can be useful, but giving clothing away does not recover every resource already used to make it or guarantee that another person will wear it. The relevant question is not merely whether a buyer can afford one more item. It is what happens when millions of similarly small decisions create an excess that the whole system must absorb.\u003c/p>\n\u003ch4>44. ______\u003c/h4>\n\u003cp>One striking response is to make one’s own clothes and keep them for a long time. Such work can restore attention to materials, fit and durability, qualities that disappear when clothing is treated as an endlessly replaceable product. Yet an accomplished maker is not created by a weekend resolution. The skills behind a well-made wardrobe may represent decades of practice, and the time required competes with other responsibilities. The example is valuable because it reveals another relationship with clothes, not because every shopper can reproduce it immediately. Turning an admirable life into a universal prescription would conceal the conditions that made that life possible.\u003c/p>\n\u003ch4>45. ______\u003c/h4>\n\u003cp>Companies can change materials and reduce some harmful practices, and these efforts should not be dismissed. Nevertheless, a greener product line does not automatically weaken a business model built on selling more items more often. Lasting change also requires customers to value longer use rather than constant replacement. That is a demanding expectation when novelty remains attractive and another purchase feels cheap. Moral appeals alone cannot remove those incentives. Prices, the quality of available alternatives and the cost of continuing wasteful habits all shape what shoppers can choose. A durable improvement will require consumer decisions to support the changes that isolated corporate initiatives cannot deliver by themselves.\u003c/p>\n\u003ch2>小标题题 41\u003c/h2>\n\u003cp>\u003cstrong>B. From a seasonal trickle to a rapid commercial cycle\u003c/strong>\u003c/p>\n\u003cp>从按季流传到快速商业循环\u003c/p>\n\u003cp>先交代旧的时尚下传图景，再解释快速上新怎样重组品牌与消费者之间的循环。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>a slow movement from an expensive original towards cheaper versions\u003c/p>\n\u003c/blockquote>\n\u003cp>明确旧图景是慢速下传，标题需要保留这个起点。\u003c/p>\n\u003cblockquote>\n\u003cp>release new products frequently and encourage customers to return\u003c/p>\n\u003c/blockquote>\n\u003cp>供给的高频上新与需求的反复回店被接在一起。\u003c/p>\n\u003cblockquote>\n\u003cp>a commercial cycle that repeatedly turns a current desire into the need for another visit\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾把变化概括为商业循环，而非仅仅价格降低。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>设计师向下传播的旧故事 → 技术加快反应和生产 → 低价与新鲜感刺激回购 → 消费周期被缩短。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>From\u003c/code> ... \u003ccode>to\u003c/code> ...覆盖新旧对比；\u003ccode>seasonal trickle\u003c/code>对应慢速流传，\u003ccode>rapid commercial cycle\u003c/code>对应频繁推出和反复回店。\u003c/p>\n\u003cp>\u003ccode>G\u003c/code>的浪费在后文才展开；本段说明循环如何运作，没有交代废弃后果。只因出现\u003ccode>cheap\u003c/code>就选\u003ccode>G\u003c/code>，会跳过此处的新旧机制对比。\u003c/p>\n\u003cp>\u003cstrong>最终答案：41 B。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 42\u003c/h2>\n\u003cp>\u003cstrong>E. The hidden production costs of a cheap garment\u003c/strong>\u003c/p>\n\u003cp>低价衣物背后隐藏的生产成本\u003c/p>\n\u003cp>将视线从店内标价转回生产，追踪低价与大规模订单把成本转给谁。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>not a complete account of the resources needed to make it\u003c/p>\n\u003c/blockquote>\n\u003cp>开头否定标价能完整代表成本。\u003c/p>\n\u003cblockquote>\n\u003cp>workers’ wages, on supplies of water and other natural resources\u003c/p>\n\u003c/blockquote>\n\u003cp>列出劳动和资源的具体压力，化学品处理继续补充同一层成本。\u003c/p>\n\u003cblockquote>\n\u003cp>travel backwards from the shop to the conditions of production\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾明确本段追查方向是生产条件。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>低标价不等于低总成本 → 大批量与低价格共同要求 → 工资、资源、化学处理受压 → 顾客实惠伴随别处负担。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>E\u003c/code>的\u003ccode>hidden\u003c/code>对应账单不显示，\u003ccode>production costs\u003c/code>对应工资、资源和化学处理，\u003ccode>cheap garment\u003c/code>对应店内低价单品。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把一端的实惠扩大到\u003ccode>everyone\u003c/code>。原文明确\u003ccode>someone elsewhere carries a cost\u003c/code>，恰在拆穿“消费者便宜就是所有人受益”的想象。\u003c/p>\n\u003cp>\u003cstrong>最终答案：42 E。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 43\u003c/h2>\n\u003cp>\u003cstrong>G. When cheap purchases become expensive waste\u003c/strong>\u003c/p>\n\u003cp>廉价购买变成高代价浪费之时\u003c/p>\n\u003cp>把成本从生产端推进到消费与废弃，说明单次便宜为何能累积成系统性负担。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>The costs do not end when a garment leaves the shop.\u003c/p>\n\u003c/blockquote>\n\u003cp>承接生产成本并向购物之后延伸。\u003c/p>\n\u003cblockquote>\n\u003cp>giving clothing away does not recover every resource\u003c/p>\n\u003c/blockquote>\n\u003cp>限制捐赠的补救能力，不能把送出视为前期消耗全部归零。\u003c/p>\n\u003cblockquote>\n\u003cp>millions of similarly small decisions create an excess\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾把个人小决定聚合为大量过剩。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>低价和上新促成替换 → 穿用时间短、废弃流增加 → 捐赠不能完全抵消资源消耗 → 无数小单累积系统性过剩。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>G\u003c/code>的\u003ccode>cheap purchases\u003c/code>对应小额购买，\u003ccode>expensive waste\u003c/code>不是说垃圾售价高，而是被消耗的资源和系统处理负担，覆盖从购买到废弃的变化。\u003c/p>\n\u003cp>\u003ccode>E\u003c/code>同样谈成本，但重点在制造这件衣服所用的劳动资源；本段首句已经向离店后的替换和过剩推进。用\u003ccode>E\u003c/code>会丢掉新增的消费阶段。\u003c/p>\n\u003cp>\u003cstrong>最终答案：43 G。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 44\u003c/h2>\n\u003cp>\u003cstrong>A. Why a personal alternative is hard to reproduce\u003c/strong>\u003c/p>\n\u003cp>个人替代办法为何难以复制\u003c/p>\n\u003cp>肯定个人制衣范例的意义，随后说明技能和时间条件阻止它迅速成为普遍方案。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>make one’s own clothes and keep them for a long time\u003c/p>\n\u003c/blockquote>\n\u003cp>先给出具体替代行为，不是抽象劝人节约。\u003c/p>\n\u003cblockquote>\n\u003cp>not created by a weekend resolution\u003c/p>\n\u003c/blockquote>\n\u003cp>转折否定凭短暂决心即可获得手艺。\u003c/p>\n\u003cblockquote>\n\u003cp>conceal the conditions that made that life possible\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾警告把个案普遍化会遮蔽其成立条件。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>自己制作并长期使用 → 看见材料和耐用价值 → 手艺需多年、时间有竞争 → 例子可启发但难即时复制。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>personal alternative\u003c/code>指自己做衣服，\u003ccode>hard to reproduce\u003c/code>由\u003ccode>decades of practice\u003c/code>和时间冲突共同支持，保留肯定与限制。\u003c/p>\n\u003cp>\u003ccode>F\u003c/code>也说\u003ccode>personal solution\u003c/code>，却把结论变成\u003ccode>everyone can quickly copy\u003c/code>。周末不能练成、数十年实践以及不可立即复制，连续三处都与\u003ccode>quickly\u003c/code>和\u003ccode>everyone\u003c/code>冲突。\u003c/p>\n\u003cp>\u003cstrong>最终答案：44 A。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 45\u003c/h2>\n\u003cp>\u003cstrong>D. Lasting change under the pressure of consumer choices\u003c/strong>\u003c/p>\n\u003cp>消费者选择压力下的持久改变\u003c/p>\n\u003cp>承认企业努力但指出单独不足，转向消费者选择及其价格和替代品条件。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>these efforts should not be dismissed\u003c/p>\n\u003c/blockquote>\n\u003cp>明确不是否定企业已做的一切。\u003c/p>\n\u003cblockquote>\n\u003cp>a greener product line does not automatically weaken a business model\u003c/p>\n\u003c/blockquote>\n\u003cp>把单项绿色产品与高频销售的结构区分开。\u003c/p>\n\u003cblockquote>\n\u003cp>Prices, the quality of available alternatives and the cost of continuing wasteful habits\u003c/p>\n\u003c/blockquote>\n\u003cp>说明消费改变受具体经济条件制约，不只靠道德倡议。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>企业改善部分做法 → 绿色单品未改高频销售 → 顾客要重视长期使用 → 新鲜感与低价仍有诱惑 → 经济条件支持更持久的选择。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>Lasting change\u003c/code>对应\u003ccode>durable improvement\u003c/code>，\u003ccode>consumer choices\u003c/code>对应最后要求顾客决定支持改变；压力既来自价格，也来自继续浪费的代价。\u003c/p>\n\u003cp>\u003ccode>F\u003c/code>提出人人迅速复制个人方案，但本段没有把制衣手艺普及当解法，而是讨论选择环境和经济激励。即使都涉及个人，作用层面也不同。\u003c/p>\n\u003cp>\u003cstrong>最终答案：45 D。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>训练用改编文本，不是外刊原文。\u003c/strong>\u003c/p>\n\u003cp>Arrange paragraphs A–H into a coherent text. A, E and H are already in position.\u003c/p>\n\u003cp>\u003cstrong>A → 41 → 42 → E → 43 → 44 → 45 → H\u003c/strong>\u003c/p>\n\u003ch4>[A]\u003c/h4>\n\u003cp>Fashion used to be described as a slow journey from the runway to the bargain shop. In that account, the ordinary customer received a cheaper version of a style long after designers had introduced it. The account is now incomplete. To see why, we must first examine how technology changed the speed at which retailers could respond to demand.\u003c/p>\n\u003ch4>[B]\u003c/h4>\n\u003cp>Those choices were shaped by more than awareness of environmental harm. Novelty remained attractive, cheap purchases felt easy, and alternatives could demand extra time or money. Expecting everyone to ignore these pressures was unrealistic. Lasting change required economic conditions that made longer use a practical choice, not merely a statement of good intentions.\u003c/p>\n\u003ch4>[C]\u003c/h4>\n\u003cp>Part of that production bill was paid far from the checkout. Large orders put pressure on low-paid workers and required substantial natural resources and chemical processing. A cheap price could therefore coexist with costly consequences elsewhere. Nor did those consequences finish at the factory gate. To follow the next part of the bill, we must look at what shoppers did with the clothes.\u003c/p>\n\u003ch4>[D]\u003c/h4>\n\u003cp>Several companies had already begun such changes through improved materials and greener product lines. These initiatives could reduce particular harms, yet they left a harder question unanswered: would customers buy fewer items or simply buy more products carrying reassuring labels? Corporate action alone could not determine that response. The durability of reform therefore depended on the choices made by shoppers.\u003c/p>\n\u003ch4>[E]\u003c/h4>\n\u003cp>Once in customers’ wardrobes, the garments could be replaced long before their usefulness was exhausted. Frequent buying created a stream of unwanted clothing, and donation could not undo all the resources already consumed. This waste made an individual alternative look attractive: making fewer clothes personally and using them for much longer. One accomplished home dressmaker might seem to show the way.\u003c/p>\n\u003ch4>[F]\u003c/h4>\n\u003cp>Those technological changes allowed retailers to track sales and organise production more rapidly. Instead of waiting for a new season, they could bring new items into shops frequently. Customers were encouraged to return just as often. A shop visit could now promise something new even when the customer’s existing clothes remained perfectly usable. Low prices helped keep this loop moving, but they also raised a question that speed alone could not answer: who paid for making so many cheap garments?\u003c/p>\n\u003ch4>[G]\u003c/h4>\n\u003cp>That dressmaker’s achievement, however, rested on years of learning. Her garments demonstrated care and durability, but the skills could not be reproduced by a shopper deciding to change overnight. The example offered inspiration rather than an immediately universal solution. If personal craft was difficult to scale, the next place to look was the companies capable of changing production on a much larger scale.\u003c/p>\n\u003ch4>[H]\u003c/h4>\n\u003cp>The criticism of fast fashion thus reaches beyond any single shop or shopper. Rapid production, hidden costs and repeated replacement form a connected system. Better corporate practices matter, but so do the conditions under which consumers decide whether to buy again. The challenge is to interrupt that system without pretending that either a green label or an exceptional individual can do all the work.\u003c/p>\n\u003ch3>全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>在全文中的作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出旧下传图景，转问技术改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>解释选择的经济和行为条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>回答生产代价，再转消费者使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>承认企业行动，提出消费者回应问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>消费浪费引出个人制衣替代\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>解释技术加速循环，提出生产成本归属\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>限制个体范例，转向规模化企业行动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>并收生产、消费与改变条件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cp>提出旧下传图景，转问技术改变 → 解释技术加速循环，提出生产成本归属 → 回答生产代价，再转消费者使用 → 消费浪费引出个人制衣替代 → 限制个体范例，转向规模化企业行动 → 承认企业行动，提出消费者回应问题 → 解释选择的经济和行为条件 → 并收生产、消费与改变条件\u003c/p>\n\u003cp>\u003cstrong>完整顺序：A—F—C—E—G—D—B—H。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>41—45：F、C、G、D、B。\u003c/strong>\u003c/p>\n\u003ch2>排序题 41\u003c/h2>\n\u003cp>这是全文第2个位置。先承接前段A，再接后段C；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段A末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>how technology changed the speed\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段F开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those technological changes\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段F末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>who paid for making so many cheap garments?\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Part of that production bill\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>A\u003c/code>以技术怎样改变速度设问，\u003ccode>F\u003c/code>的\u003ccode>Those technological changes\u003c/code>接着解释追踪销售、快速生产和上新，然后问低价生产账单由谁支付；\u003ccode>C\u003c/code>再给出工人和资源的答案。\u003c/p>\n\u003cp>局部推进：提出旧下传图景，转问技术改变 → 解释技术加速循环，提出生产成本归属 → 回答生产代价，再转消费者使用。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>B段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those choices\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>的选择指消费者如何回应改革，\u003ccode>A\u003c/code>尚未提出这类选择；它也无法为\u003ccode>C\u003c/code>的\u003ccode>production bill\u003c/code>提供前件。\u003c/p>\n\u003cp>\u003cstrong>最终答案：41 F。\u003c/strong>\u003c/p>\n\u003ch2>排序题 42\u003c/h2>\n\u003cp>这是全文第3个位置。先承接前段F，再接后段E；后面的E是题面已给定的固定位置。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段F末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>who paid for making so many cheap garments?\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段C开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Part of that production bill\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段C末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>what shoppers did with the clothes.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Once in customers’ wardrobes\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>C\u003c/code>先回答\u003ccode>F\u003c/code>的生产成本归属，再通过\u003ccode>factory gate\u003c/code>把追查转向离厂之后的使用；\u003ccode>E\u003c/code>从衣柜里的提前替换接续，完成生产端到消费端的换题。\u003c/p>\n\u003cp>局部推进：解释技术加速循环，提出生产成本归属 → 回答生产代价，再转消费者使用 → 消费浪费引出个人制衣替代。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>D段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>such changes\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>需要已提出的大规模企业改进，\u003ccode>F\u003c/code>只谈生产速度，尚未讨论这些减害措施，且无法顺接\u003ccode>E\u003c/code>的衣柜使用。\u003c/p>\n\u003cp>\u003cstrong>最终答案：42 C。\u003c/strong>\u003c/p>\n\u003ch2>排序题 43\u003c/h2>\n\u003cp>这是全文第5个位置。先承接前段E，再接后段D；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段E末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>One accomplished home dressmaker might seem to show the way.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段G开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That dressmaker’s achievement, however,\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段G末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>companies capable of changing production on a much larger scale.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Several companies had already begun such changes\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>G\u003c/code>的\u003ccode>That dressmaker\u003c/code>唯一回指\u003ccode>E\u003c/code>引出的手艺人，\u003ccode>however\u003c/code>把可行范例转为复制限制。末尾转向能规模化改进的企业，\u003ccode>D\u003c/code>的\u003ccode>such changes\u003c/code>因此有具体所指。\u003c/p>\n\u003cp>局部推进：消费浪费引出个人制衣替代 → 限制个体范例，转向规模化企业行动 → 承认企业行动，提出消费者回应问题。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>B段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those choices\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>开头需要消费者面对改革的选择，而\u003ccode>E\u003c/code>只提出一位制衣者；直接进入价格制约会漏掉个案为何不能普及，也让\u003ccode>D\u003c/code>的企业变化无承接。\u003c/p>\n\u003cp>\u003cstrong>最终答案：43 G。\u003c/strong>\u003c/p>\n\u003ch2>排序题 44\u003c/h2>\n\u003cp>这是全文第6个位置。先承接前段G，再接后段B；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段G末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>companies capable of changing production on a much larger scale.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段D开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Several companies had already begun such changes\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段D末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the choices made by shoppers.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those choices\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>D\u003c/code>承接\u003ccode>G\u003c/code>转向企业，先说改进材料和绿色系列，再追问消费者究竟少买还是买更多绿色标牌产品；其末尾\u003ccode>choices\u003c/code>正由\u003ccode>B\u003c/code>展开经济条件。\u003c/p>\n\u003cp>局部推进：限制个体范例，转向规模化企业行动 → 承认企业行动，提出消费者回应问题 → 解释选择的经济和行为条件。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>C段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Part of that production bill\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>C\u003c/code>回到生产损害的形成，无法回答\u003ccode>G\u003c/code>提出的企业改进，也不能给后段\u003ccode>Those choices\u003c/code>提供两种消费回应。\u003c/p>\n\u003cp>\u003cstrong>最终答案：44 D。\u003c/strong>\u003c/p>\n\u003ch2>排序题 45\u003c/h2>\n\u003cp>这是全文第7个位置。先承接前段D，再接后段H；后面的H是题面已给定的固定结尾。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段D末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the choices made by shoppers.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段B开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those choices\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段B末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>a practical choice, not merely a statement of good intentions.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The criticism of fast fashion thus reaches beyond any single shop or shopper.\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>B\u003c/code>把\u003ccode>D\u003c/code>留下的消费者回应问题具体化为新鲜感、价格和替代成本，再说明长期使用需要经济支持。\u003ccode>H\u003c/code>才能将企业与顾客都放进同一系统作总结。\u003c/p>\n\u003cp>局部推进：承认企业行动，提出消费者回应问题 → 解释选择的经济和行为条件 → 并收生产、消费与改变条件。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>G段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That dressmaker’s achievement\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>G\u003c/code>要求前面紧邻个人制衣者，而\u003ccode>D\u003c/code>正在讨论企业与消费者回应；放此处会倒退个案，留下经济条件未解。\u003c/p>\n\u003cp>\u003cstrong>最终答案：45 B。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>rational consumption\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>理性消费\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类·社会生活\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>frugality\u003c/td>\n\u003ctd>勤俭节约\u003c/td>\n\u003ctd>人生哲理类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>independent thinking\u003c/td>\n\u003ctd>独立思考\u003c/td>\n\u003ctd>人生哲理类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>environmental protection\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>环境保护\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类·社会生活\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>resources conservation\u003c/td>\n\u003ctd>资源节约\u003c/td>\n\u003ctd>环境保护类\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a sense of responsibility\u003c/td>\n\u003ctd>责任感\u003c/td>\n\u003ctd>人生哲理类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>craftsmanship\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>工匠精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sustainable lifestyles\u003c/td>\n\u003ctd>可持续生活方式\u003c/td>\n\u003ctd>社会现象类·社会生活\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>consumer awareness of product quality\u003c/td>\n\u003ctd>消费者的产品质量意识\u003c/td>\n\u003ctd>经济消费类\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>In the picture, A encourages B to see C as disposable.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图中，A促使B把C当作一次性用品。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene contrasts A’s ideal with the reality of B.\u003c/td>\n\u003ctd>画面将A的理想与B的现实形成对比。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The consequences shown in the picture are not limited to A.\u003c/td>\n\u003ctd>图中展示的后果并不限于A。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart shows that consumers buy roughly A items a year.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表显示消费者每年大约购买A件商品。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>More frequent purchases have accompanied an increase in A.\u003c/td>\n\u003ctd>购买更加频繁的同时，A也有所增加。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figure amounts to about A items per person.\u003c/td>\n\u003ctd>该数值相当于人均约A件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage argues that lasting change depends on A.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文认为持久改变有赖于A。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>Though A has made efforts to curb B, C remains a concern.\u003c/td>\n\u003ctd>尽管A已努力抑制B，C仍是值得关注的问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion links excessive consumption with A and B.\u003c/td>\n\u003ctd>讨论将过度消费与A、B联系起来。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
