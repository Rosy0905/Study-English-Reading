<script>
const DATA = [{"title":"史上最强阅读复盘法：一石五鸟法","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","section":"方法总览","level":2,"context":null,"meta":{"bird":0},"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"title":"第1段","raw":"# 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| film version | n.电影版本 | play | v.饰演 | scold | v.责备 |\n| unattractive | a.不引人注目的 | assistant | n.助手 | imagine | v.以为 |\n| high fashion | n.高级时装 | affect | v.影响 | explain | v.解释 |\n| deep blue | n.深蓝色 | sweater | n.毛衣 | descend | v.向下流传 |\n| fashion show | n.时装秀 | department store | n.百货商店 | bargain bin | n.廉价货架 |\n| doubtless | adv.无疑 | garment | n.服装 |  |  |","section":"第一鸟 · 词汇","level":1,"context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[85,112,925,549],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{"bird":1,"kind":"vocabulary","paragraph":1},"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>film version\u003c/td>\n\u003ctd>n.电影版本\u003c/td>\n\u003ctd>play\u003c/td>\n\u003ctd>v.饰演\u003c/td>\n\u003ctd>scold\u003c/td>\n\u003ctd> dictment\u003c/u> of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&M, and Uniqloto react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.","section":"第二鸟 · 精读与翻译","level":3,"context":{"mode":"image","asset":"articleAnnotated","label":"第2段完整原文与译文","focus":[85,669,925,1261],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"center"},"meta":{"bird":2,"kind":"paragraph","paragraph":2,"cumulative":true,"cumulativeGroup":"paragraph-2","partIndex":0,"cumulativeFinal":false},"focusId":"focus-paragraph-2-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in \u003cem>Overdressed\u003c/em>, Elizabeth Cline’s three-year \u003cu>indictment\u003c/u> of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqloto react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed ns：(how the deep blue color：(of the assistant&#39;s sweater) → descended over the years：(from fashion shows → to department stores → and to the bargain bin：(in which the poor girl → doubtless found her garment))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>This top-down conception：(of the fashion business) → couldn&#39;t be more out of date + at odds with：(the feverish world：(described in Overdressed：(Elizabeth Cline&#39;s three-year indictment：(of &quot;fast fashion&quot;)))).\u003c/p>\n\u003cp>In the last decade or so → advances in technology → have allowed mass-market labels：(such as Zara, H&amp;M, and Uniqlo) → to react to trends：(more quickly) + anticipate demand：(more precisely).\u003c/p>\n\u003cp>Quicker turnarounds → mean：(less wasted inventory + more frequent releases + more profit).\u003c/p>\n\u003cp>These labels → encourage style-conscious consumers → to see clothes as disposable：(meant to last：(only a wash or two)：(although they don&#39;t advertise that)) + to renew their wardrobe：(every few weeks).\u003c/p>\n\u003cp>By offering on-trend items：(at dirt-cheap prices) → Cline argues → these brands have hijacked：(fashion cycles) → shaking an industry：(long accustomed to：(a seasonal pace)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>The victims of this revolution → of course → are not limited to designers.\u003c/p>\n\u003cp>For H&amp;M to offer：(a $5.95 knit miniskirt：(in all its 2,300-plus stores：(around the world))) → it must rely on：(low-wage overseas labor) + order in volumes：(that strain natural resources) + use massive amounts：(of harmful chemicals).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Overdressed is → the fashion world&#39;s answer：(to consumer-activist bestsellers：(like Michael Pollan&#39;s The Omnivore&#39;s Dilemma)).\u003c/p>\n\u003cp>&quot;Mass-produced clothing：(like fast food) → fills a hunger and need // yet is non-durable and wasteful&quot; → Cline argues.\u003c/p>\n\u003cp>Americans → she finds → buy roughly 20 billion garments a year：(about 64 items per person) + no matter how much：(they give away) → this excess → leads to waste.\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Towards the end of Overdressed → Cline introduced her ideal：(a Brooklyn woman：(named Sarah Kate Beaumont)：(who since 2008 → has made all of her own clothes – and beautifully)).\u003c/p>\n\u003cp>But as Cline → is the first to note → it took Beaumont：(decades to perfect her craft); → her example → can&#39;t be knocked off.\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Though several fast-fashion companies → have made efforts → to curb their impact：(on labor and the environment) – including H&amp;M：(with its green Conscious Collection line) – // Cline believes → lasting change → can only be effected：(by the customer).\u003c/p>\n\u003cp>She exhibits → the idealism：(common to many advocates：(of sustainability))：(be it in food + or in energy).\u003c/p>\n\u003cp>Vanity is a constant; → people will only start → shopping more sustainably：(when they can&#39;t afford → not to).\u003c/p>\n"},{"title":"中文句子逻辑","raw":"## 中文句子逻辑\n\n### 第1段\n\n在2006年电影版本中：(《穿普拉达的女魔头》的) → 米兰达·普里斯特利：(由梅丽尔·斯特里普扮演) → 斥责她不起眼的助理：(因为想象：(高级时装 → 不会影响她))。\n\n普里斯特利解释：(深蓝色是如何：(助理毛衣的) → 经过多年下降：(从时装秀 → 到百货商店 → 再到廉价货架：(在那里这个可怜的女孩 → 无疑找到了她的衣服)))。\n\n### 第2段\n\n这种自上而下的观念：(对时尚产业的) → 再过时不过了 + 格格不入：(与狂热的世界：(描述在《过度着装》中的：(伊丽莎白·克莱恩的三年控诉：(对\"快时尚\"的))))。\n\n在过去十年左右 → 技术的进步 → 已经允许大众市场品牌：(比如Zara、H&M和优衣库) → 对潮流做出反应：(更快速地) + 预测需求：(更精确地)。\n\n更快的周转 → 意味着：(更少的库存浪费 + 更频繁的发布 + 更多的利润)。\n\n这些品牌 → 鼓励注重时尚的消费者 → 把衣服视为一次性的：(意味着只能持续：(一两次洗涤)：(尽管他们不会宣传这一点)) + 更新他们的衣柜：(每隔几周)。\n\n通过提供潮流单品：(以极其便宜的价格) → 克莱恩认为 → 这些品牌已经劫持了：(时尚周期) → 动摇了一个产业：(长期习惯于：(季节性节奏的))。\n\n### 第3段\n\n这场革命的受害者 → 当然 → 不仅限于设计师。\n\n为了H&M能够提供：(一条5.95美元的针织迷你裙：(在其全部2300多家店铺中：(遍布世界各地))) → 它必须依赖：(低工资的海外劳工) + 大量订购：(给自然资源造成压力的) + 使用大量：(有害化学物质)。\n\n### 第4段\n\n《过度着装》是 → 时尚界的回应：(对消费者活动家畅销书：(比如迈克尔·波伦的《杂食者的困境》))。\n\n\"大规模生产的服装：(就像快餐) → 满足了饥饿和需求 // 然而是不耐用和浪费的\" → 克莱恩认为。\n\n美国人 → 她发现 → 每年购买大约200亿件服装：(每人约64件) + 无论多少：(他们捐赠的) → 这种过量 → 导致浪费。\n\n### 第5段\n\n在《过度着装》的结尾 → 克莱恩介绍了她的理想：(一位布鲁克林女性：(名叫莎拉·凯特·博蒙特)：(自2008年以来 → 一直自己制作所有衣服 – 而且做得很漂亮))。\n\n但正如克莱恩 → 首先指出的 → 博蒙特花了：(几十年来完善她的手艺)；→ 她的例子 → 不能被复制。\n\n### 第6段\n\n尽管几家快时尚公司 → 已经做出努力 → 来抑制他们的影响：(对劳工和环境) – 包括H&M：(凭借其绿色的Conscious Collection系列) – // 克莱恩相信 → 持久的改变 → 只能被实现：(由消费者)。\n\n她展现出 → 理想主义：(常见于许多倡导者：(可持续发展的))：(无论是在食品方面 + 还是在能源方面)。\n\n虚荣是恒定的；→ 人们只会开始 → 更可持续地购物：(当他们负担不起 → 不这样做的时候)。","section":"第二鸟 · 精读与翻译","level":2,"context":{"mode":"image","asset":"articleAnnotated","label":"文章句内逻辑","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{"bird":2,"kind":"logic"},"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>在2006年电影版本中：(《穿普拉达的女魔头》的) → 米兰达·普里斯特利：(由梅丽尔·斯特里普扮演) → 斥责她不起眼的助理：(因为想象：(高级时装 → 不会影响她))。\u003c/p>\n\u003cp>普里斯特利解释：(深蓝色是如何：(助理毛衣的) → 经过多年下降：(从时装秀 → 到百货商店 → 再到廉价货架：(在那里这个可怜的女孩 → 无疑找到了她的衣服)))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>这种自上而下的观念：(对时尚产业的) → 再过时不过了 + 格格不入：(与狂热的世界：(描述在《过度着装》中的：(伊丽莎白·克莱恩的三年控诉：(对&quot;快时尚&quot;的))))。\u003c/p>\n\u003cp>在过去十年左右 → 技术的进步 → 已经允许大众市场品牌：(比如Zara、H&amp;M和优衣库) → 对潮流做出反应：(更快速地) + 预测需求：(更精确地)。\u003c/p>\n\u003cp>更快的周转 → 意味着：(更少的库存浪费 + 更频繁的发布 + 更多的利润)。\u003c/p>\n\u003cp>这些品牌 → 鼓励注重时尚的消费者 → 把衣服视为一次性的：(意味着只能持续：(一两次洗涤)：(尽管他们不会宣传这一点)) + 更新他们的衣柜：(每隔几周)。\u003c/p>\n\u003cp>通过提供潮流单品：(以极其便宜的价格) → 克莱恩认为 → 这些品牌已经劫持了：(时尚周期) → 动摇了一个产业：(长期习惯于：(季节性节奏的))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>这场革命的受害者 → 当然 → 不仅限于设计师。\u003c/p>\n\u003cp>为了H&amp;M能够提供：(一条5.95美元的针织迷你裙：(在其全部2300多家店铺中：(遍布世界各地))) → 它必须依赖：(低工资的海外劳工) + 大量订购：(给自然资源造成压力的) + 使用大量：(有害化学物质)。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>《过度着装》是 → 时尚界的回应：(对消费者活动家畅销书：(比如迈克尔·波伦的《杂食者的困境》))。\u003c/p>\n\u003cp>&quot;大规模生产的服装：(就像快餐) → 满足了饥饿和需求 // 然而是不耐用和浪费的&quot; → 克莱恩认为。\u003c/p>\n\u003cp>美国人 → 她发现 → 每年购买大约200亿件服装：(每人约64件) + 无论多少：(他们捐赠的) → 这种过量 → 导致浪费。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>在《过度着装》的结尾 → 克莱恩介绍了她的理想：(一位布鲁克林女性：(名叫莎拉·凯特·博蒙特)：(自2008年以来 → 一直自己制作所有衣服 – 而且做得很漂亮))。\u003c/p>\n\u003cp>但正如克莱恩 → 首先指出的 → 博蒙特花了：(几十年来完善她的手艺)；→ 她的例子 → 不能被复制。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>尽管几家快时尚公司 → 已经做出努 文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","section":"第三鸟 · 题目复盘","level":1,"context":{"mode":"image","asset":"questions","label":"25题","focus":[250,2356,1800,490],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"section-cover","mergedIntro":true},"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"title":"25题 · 题干、题型与核心出处","raw":"## 25题\n\n**What is the subject of the text?**\n\n这篇文章的主题是什么？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Satire on an extravagant lifestyle.**\n\n对奢侈生活方式的讽刺\n\nB. **Challenge to a high-fashion myth.**\n\n对高级时装神话的挑战\n\nC. **Criticism of the fast-fashion industry.**\n\n对快时尚产业的批评\n\nD. **Exposure of a mass-market secret.**\n\n对大众市场秘密的揭露\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 借电影里一件毛衣的来路说明传统时尚由上而下影响普通消费者 | 先摆出一个熟悉场景里的旧看法 |\n| 2 | 指出这种旧图景已经过时，技术让大众品牌快速追潮流、频繁上新并推动消费者把衣服当成一次性用品 | 再说现实已经换了玩法 |\n| 3 | 写低价快时尚背后的低薪劳工、资源压力和大量化学品代价 | 接着写第一批代价 |\n| 4 | 继续用美国人一年购买巨量衣服、不断丢弃来说明不耐用和浪费 | 再说代价还会继续扩大 |\n| 5 | 介绍一位自己做衣服的理想人物，同时承认她几十年的手艺无法快速复制 | 举一个例子说明个人办法难复制 |\n| 6 | 承认企业有一些环保努力，但认为持久改变最终要由顾客和经济压力推动 | 最后下结论：改变还得靠另一端 |","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"25题","focus":[250,2356,1800,490],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"question","question":25},"html":" A. Satire on an extravagant lifestyle.","raw":"**What is the subject of the text?**\n\n### A. Satire on an extravagant lifestyle.\n\n对奢侈生活方式的讽刺","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"25题A选项","focus":[250,2456,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-option","question":25,"option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q25-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-A-0\">\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003cp>对奢侈生活方式的讽刺\u003c/p>\n\u003c/section>"},{"title":"A. Satire on an extravagant lifestyle.","raw":"#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n对奢侈生活方式的讽刺\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 以熟悉的电影场景展示把昂贵衣着视为身份象征的旧生活观，为讽刺奢华作铺垫。 | 先摆出一个熟悉场景里的旧看法 |\n| 2 | 说明奢华炫耀如今也借廉价快购扩散，大众用高频更衣模仿奢侈生活。 | 再说现实已经换了玩法 |\n| 3 | 揭示这种炫耀生活首先让低薪劳动者与环境承担代价，形成奢华外表与实际损害的反差。 | 接着写第一批代价 |\n| 4 | 进一步写衣柜膨胀和大量废弃，使奢侈习惯的荒谬及社会代价继续扩大。 | 再说代价还会继续扩大 |\n| 5 | 举长期亲手制衣的节俭者为对照，同时说明其技能难复制，个人节制不易普及。 | 举一个例子说明个人办法难复制 |\n| 6 | 最后将讽刺落到消费一端：只有顾客放弃炫耀性的过量购买，奢华生活的扩散才会改变。 | 最后下结论：改变还得靠另一端 |\n\n`A`可以解释虚荣与浪费，却把批评中心限定为奢侈生活。文章第2段反复分析技术、库存、上新频率和极低价格，第3段分析劳动与资源，第4段用快餐比喻大众工业消费；这些是行业运作及外部代价，不以奢华生活讽刺为主。最后的`vanity`也只是解释改变困难的一项条件，不能回过头吞掉行业机制。\n\n判断：\n\n**A 不保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"25题A选项","focus":[250,2456,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-hypothesis","question":25,"option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q25-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-A-0\">\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003cp>对奢侈生活方式的讽刺\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-A-1\">\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对奢侈生活方式的讽刺\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以熟悉的电影场景展示把昂贵衣着视为身份象征的旧生活观，为讽刺奢华作铺垫。\u003c/td>\n\u003ctd>先摆出一个熟悉场景里的旧看法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明奢华炫耀如今也借廉价快购扩散，大众用高频更衣模仿奢侈生活。\u003c/td>\n\u003ctd>再说现实已经换了玩法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>揭示这种炫耀生活首先让低薪劳动者与环境承担代价，形成奢华外表与实际损害的反差。\u003c/td>\n\u003ctd>接着写第一批代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>进一步写衣柜膨胀和大量废弃，使奢侈习惯的荒谬及社会代价继续扩大。\u003c/td>\n\u003ctd>再说代价还会继续扩大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>举长期亲手制衣的节俭者为对照，同时说明其技能难复制，个人节制不易普及。\u003c/td>\n\u003ctd>举一个例子说明个人办法难复制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>最后将讽刺落到消费一端：只有顾客放弃炫耀性的过量购买，奢华生活的扩散才会改变。\u003c/td>\n\u003ctd>最后下结论：改变还得靠另一端\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>A\u003c/code>可以解释虚荣与浪费，却把批评中心限定为奢侈生活。文章第2段反复分析技术、库存、上新频率和极低价格，第3段分析劳动与资源，第4段用快餐比喻大众工业消费；这些是行业运作及外部代价，不以奢华生活讽刺为主。最后的\u003ccode>vanity\u003c/code>也只是解释改变困难的一项条件，不能回过头吞掉行业机制。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"B. Challenge to a high-fashion myth.","raw":"**What is the subject of the text?**\n\n### B. Challenge to a high-fashion myth.\n\n对高级时装神话的挑战","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"25题B选项","focus":[250,2545,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-option","question":25,"option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q25-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-B-0\">\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003cp>对高级时装神话的挑战\u003c/p>\n\u003c/section>"},{"title":"B. Challenge to a high-fashion myth.","raw":"#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n对高级时装神话的挑战\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 用电影中颜色由秀场传向大众的场景，摆出高级时装独占潮流决定权的旧神话。 | 先摆出一个熟悉场景里的旧看法 |\n| 2 | 指出大众品牌凭技术与快速反应已改变潮流控制权，挑战高级时装单向支配的旧说法。 | 再说现实已经换了玩法 |\n| 3 | 说明神话破裂后设计师和生产链首先承担代价，证明高级时装无力保护原有秩序。 | 接着写第一批代价 |\n| 4 | 再写大众消费者的服装消耗激增，显示高级时装也不能通过季节节奏约束整个市场。 | 再说代价还会继续扩大 |\n| 5 | 举绕开时装体系亲手制衣的个人例子，同时说明这种独立办法需要多年手艺、难以复制。 | 举一个例子说明个人办法难复制 |\n| 6 | 最后指出打破对高级时装的迷信还须消费者改变选择，不能只等设计师重掌权威。 | 最后下结论：改变还得靠另一端 |\n\n`B`能接到第1段的传统图景和第2段开头的过时判断，但这次转折服务于介绍新的快时尚批评。第3、4段追究的并非高级时装神话本身，而是低价快产带来的劳动、资源与浪费代价；末段也讨论可持续购物，不是如何戳破高级时装权威。`B`抓住了进入主题的门口，却没有涵盖展开与收束。\n\n判断：\n\n**B 不保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"25题B选项","focus":[250,2545,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-hypothesis","question":25,"option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q25-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-B-0\">\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003cp>对高级时装神话的挑战\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-B-1\">\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对高级时装神话的挑战\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>用电影中颜色由秀场传向大众的场景，摆出高级时装独占潮流决定权的旧神话。\u003c/td>\n\u003ctd>先摆出一个熟悉场景里的旧看法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>指出大众品牌凭技术与快速反应已改变潮流控制权，挑战高级时装单向支配的旧说法。\u003c/td>\n\u003ctd>再说现实已经换了玩法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明神话破裂后设计师和生产链首先承担代价，证明高级时装无力保护原有秩序。\u003c/td>\n\u003ctd>接着写第一批代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>再写大众消费者的服装消耗激增，显示高级时装也不能通过季节节奏约束整个市场。\u003c/td>\n\u003ctd>再说代价还会继续扩大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>举绕开时装体系亲手制衣的个人例子，同时说明这种独立办法需要多年手艺、难以复制。\u003c/td>\n\u003ctd>举一个例子说明个人办法难复制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>最后指出打破对高级时装的迷信还须消费者改变选择，不能只等设计师重掌权威。\u003c/td>\n\u003ctd>最后下结论：改变还得靠另一端\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>B\u003c/code>能接到第1段的传统图景和第2段开头的过时判断，但这次转折服务于介绍新的快时尚批评。第3、4段追究的并非高级时装神话本身，而是低价快产带来的劳动、资源与浪费代价；末段也讨论可持续购物，不是如何戳破高级时装权威。\u003ccode>B\u003c/code>抓住了进入主题的门口，却没有涵盖展开与收束。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"C. Criticism of the fast-fashion industry.","raw":"**What is the subject of the text?**\n\n### C. Criticism of the fast-fashion industry.\n\n对快时尚产业的批评","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"25题C选项","focus":[250,2632,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-option","question":25,"option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q25-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-C-0\">\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003cp>对快时尚产业的批评\u003c/p>\n\u003c/section>"},{"title":"C. Criticism of the fast-fashion industry.","raw":"#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n对快时尚产业的批评\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 借电影展示传统时尚自上而下影响普通消费者的旧观念，建立讨论行业变化的起点。 | 先摆出一个熟悉场景里的旧看法 |\n| 2 | 指出技术与大众品牌已经改写节奏，以低价、快速上新和短寿命衣物推动快时尚消费。 | 再说现实已经换了玩法 |\n| 3 | 批评这种机制首先带来的低薪劳动、自然资源压力及有害化学品使用。 | 接着写第一批代价 |\n| 4 | 继续批评巨量购买与衣物废弃，说明损害扩展到整个消费循环。 | 再说代价还会继续扩大 |\n| 5 | 举个人制衣的理想解法，同时指出多年手艺难复制，显示这种补救不能轻易普及。 | 举一个例子说明个人办法难复制 |\n| 6 | 最后承认企业有限改进，把持久改变转向顾客一端，并指出经济条件对可持续选择的约束。 | 最后下结论：改变还得靠另一端 |\n\n`C`从快时尚机制、生产代价、消费浪费一直管到补救的限制。第5段个人范例难复制，第6段消费者理想受到质疑，都在追问行业问题如何改变，并非离题。作者也没有无条件赞成`Cline`的每个方案；质疑其理想主义仍是对解决同一行业问题的现实检验。\n\n判断：\n\n**C 保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"25题C选项","focus":[250,2632,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-hypothesis","question":25,"option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q25-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-C-0\">\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003cp>对快时尚产业的批评\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-C-1\">\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对快时尚产业的批评\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>借电影展示传统时尚自上而下影响普通消费者的旧观念，建立讨论行业变化的起点。\u003c/td>\n\u003ctd>先摆出一个熟悉场景里的旧看法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>指出技术与大众品牌已经改写节奏，以低价、快速上新和短寿命衣物推动快时尚消费。\u003c/td>\n\u003ctd>再说现实已经换了玩法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>批评这种机制首先带来的低薪劳动、自然资源压力及有害化学品使用。\u003c/td>\n\u003ctd>接着写第一批代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>继续批评巨量购买与衣物废弃，说明损害扩展到整个消费循环。\u003c/td>\n\u003ctd>再说代价还会继续扩大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>举个人制衣的理想解法，同时指出多年手艺难复制，显示这种补救不能轻易普及。\u003c/td>\n\u003ctd>举一个例子说明个人办法难复制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>最后承认企业有限改进，把持久改变转向顾客一端，并指出经济条件对可持续选择的约束。\u003c/td>\n\u003ctd>最后下结论：改变还得靠另一端\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>C\u003c/code>从快时尚机制、生产代价、消费浪费一直管到补救的限制。第5段个人范例难复制，第6段消费者理想受到质疑，都在追问行业问题如何改变，并非离题。作者也没有无条件赞成\u003ccode>Cline\u003c/code>的每个方案；质疑其理想主义仍是对解决同一行业问题的现实检验。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"D. Exposure of a mass-market secret.","raw":"**What is the subject of the text?**\n\n### D. Exposure of a mass-market secret.\n\n对大众市场秘密的揭露","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"25题D选项","focus":[250,2720,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-option","question":25,"option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q25-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-D-0\">\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003cp>对大众市场秘密的揭露\u003c/p>\n\u003c/section>"},{"title":"D. Exposure of a mass-market secret.","raw":"#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n对大众市场秘密的揭露\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 用熟悉购物场景摆出消费者以为商品只沿公开的高级时装链条流入大众市场的旧看法。 | 先摆出一个熟悉场景里的旧看法 |\n| 2 | 揭露大众市场如今靠隐藏的短寿命设计和快速上新控制购买频率，秘密机制已取代旧玩法。 | 再说现实已经换了玩法 |\n| 3 | 追查秘密机制的第一批隐蔽代价：低价背后的劳动力与自然资源被过度使用。 | 接着写第一批代价 |\n| 4 | 继续揭露顾客不易看到的废弃规模，说明秘密机制的代价随重复购买扩大。 | 再说代价还会继续扩大 |\n| 5 | 举自行制衣者绕开隐蔽机制的例子，同时说明这种个人替代需要多年训练，难以复制。 | 举一个例子说明个人办法难复制 |\n| 6 | 最后认为破除秘密机制必须依靠顾客获知真相并改变购买，单靠品牌自我披露不足。 | 最后下结论：改变还得靠另一端 |\n\n`D`把全文的功能写成揭开某个大众市场秘密。产品不耐用且品牌不宣传这一点，确是第2段的一处内容，但后文公开讨论劳动资源、购买数量、理想范例与经济制约，并不围绕发现一个隐藏事实收束。全文强调这些运作方式为何值得批评及为何难改，范围比揭露某个秘密更完整。\n\n判断：\n\n**D 不保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"25题D选项","focus":[250,2720,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"main-hypothesis","question":25,"option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q25-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-D-0\">\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003cp>对大众市场秘密的揭露\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-D-1\">\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对大众市场秘密的揭露\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>用熟悉购物场景摆出消费者以为商品只沿公开的高级时装链条流入大众市场的旧看法。\u003c/td>\n\u003ctd>先摆出一个熟悉场景里的旧看法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>揭露大众市场如今靠隐藏的短寿命设计和快速上新控制购买频率，秘密机制已取代旧玩法。\u003c/td>\n\u003ctd>再说现实已经换了玩法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>追查秘密机制的第一批隐蔽代价：低价背后的劳动力与自然资源被过度使用。\u003c/td>\n\u003ctd>接着写第一批代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>继续揭露顾客不易看到的废弃规模，说明秘密机制的代价随重复购买扩大。\u003c/td>\n\u003ctd>再说代价还会继续扩大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>举自行制衣者绕开隐蔽机制的例子，同时说明这种个人替代需要多年训练，难以复制。\u003c/td>\n\u003ctd>举一个例子说明个人办法难复制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>最后认为破除秘密机制必须依靠顾客获知真相并改变购买，单靠品牌自我披露不足。\u003c/td>\n\u003ctd>最后下结论：改变还得靠另一端\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>D\u003c/code>把全文的功能写成揭开某个大众市场秘密。产品不耐用且品牌不宣传这一点，确是第2段的一处内容，但后文公开讨论劳动资源、购买数量、理想范例与经济制约，并不围绕发现一个隐藏事实收束。全文强调这些运作方式为何值得批评及为何难改，范围比揭露某个秘密更完整。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"25题结论","raw":"### 25题结论\n\n**25. C. Criticism of the fast-fashion industry.**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Criticism of the fast-fashion industry. / 对快时尚产业的批评**","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"25题结论","focus":[250,2356,1800,490],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"conclusion","question":25},"html":"\u003cp>\u003cstrong>25. C. Criticism of the fast-fashion industry.\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Criticism of the fast-fashion industry. / 对快时尚产业的批评\u003c/strong>\u003c/p>\n"},{"title":"21题 · 题干、题型与核心出处","raw":"## 21题\n\n> Priestly criticizes her assistant for her ______.  \n> Priestly因助手的什么问题而批评她？\n\n### 题型\n\n人物行为原因题。题干的人物`Priestly`及`criticizes`对应第1段的`scolds`。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是`Priestly`用来纠正这种看法的证据，不是对助手议价能力的评价。\n\n### 核心出处\n\n> In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\n\n电影场景先展示助手以为自己置身时尚之外，再由毛衣颜色的来源证明她仍受时尚影响。下一段才转入这种自上而下观念已过时，不能把后面的行业批评移成`Priestly`此处的批评内容。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"21题","focus":[250,243,1800,510],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"question","question":21},"html":"\u003cblockquote>\n\u003cp>Priestly criticizes her assistant for her ______.\u003cbr>Priestly因助手的什么问题而批评她？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物行为原因题。题干的人物\u003ccode>Priestly\u003c/code>及\u003ccode>criticizes\u003c/code>对应第1段的\u003ccode>scolds\u003c/code>。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是\u003ccode>Priestly\u003c/code>用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003c/blockquote>\n\u003cp>电影场景先展示助手以为自己置身时尚之外，再由毛衣颜色的来源证明她仍受时尚影响。下一段才转入这种自上而下观念已过时，不能把后面的行业批评移成\u003ccode>Priestly\u003c/code>此处的批评内容。\u003c/p>\n"},{"title":"A. lack of imagination","raw":"### A. lack of imagination\n\n> 缺乏想象力\n\n**做题模式中的状态：**第一轮`A`保留：当时凭`imagining`与`imagination`的相似，以及人物受到批评的情境，尚未读清后面具体想法。`D`也保留；确定全文主旨后再回看开场的时尚影响关系，排除`A`，最终选择`D`。\n\n**错误类型：第一类——歪曲原意。**\n\n`A`的`lack of imagination`把`imagination`当作创造性想象能力。原文`imagining`的宾语却是她以为高级时装与自己无关这一具体想法，意思是“竟然以为”，不是“缺少想象力”。\n\n`A`把“持有一个错误想法”改成“缺乏想象能力”，丢掉了`imagining`后面真正决定批评内容的命题。\n\n**命题人借用的原文材料：**\n\n> In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"21题A选项","focus":[250,342,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"option","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q21-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-A-0\">\u003cblockquote>\n\u003cp>缺乏想象力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>保留：当时凭\u003ccode>imagining\u003c/code>与\u003ccode>imagination\u003c/code>的相似，以及人物受到批评的情境，尚未读清后面具体想法。\u003ccode>D\u003c/code>也保留；确定全文主旨后再回看开场的时尚影响关系，排除\u003ccode>A\u003c/code>，最终选择\u003ccode>D\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>lack of imagination\u003c/code>把\u003ccode>imagination\u003c/code>当作创造性想象能力。原文\u003ccode>imagining\u003c/code>的宾语却是她以为高级时装与自己无关这一具体想法，意思是“竟然以为”，不是“缺少想象力”。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把“持有一个错误想法”改成“缺乏想象能力”，丢掉了\u003ccode>imagining\u003c/code>后面真正决定批评内容的命题。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"title":"A. lack of imagination","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Priestly批评她的助手，是因为助手缺乏想象力。\n\n题干的人物`Priestly`及`criticizes`对应第1段的`scolds`。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是`Priestly`用来纠正这种看法的证据，不是对助手议价能力的评价。\n\n`A`的`lack of imagination`把`imagination`当作创造性想象能力。原文`imagining`的宾语却是她以为高级时装与自己无关这一具体想法，意思是“竟然以为”，不是“缺少想象力”。\n\n`Priestly`随后追溯毛衣颜色的来源，用事实纠正助手对时尚影响的认识，并没有要求助手更有创造力或想出新款式。\n\n`A`把“持有一个错误想法”改成“缺乏想象能力”，丢掉了`imagining`后面真正决定批评内容的命题。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"21题A选项","focus":[250,342,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","partIndex":1,"cumulativeFinal":false},"focusId":"focus-q21-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-A-0\">\u003cblockquote>\n\u003cp>缺乏想象力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>保留：当时凭\u003ccode>imagining\u003c/code>与\u003ccode>imagination\u003c/code>的相似，以及人物受到批评的情境，尚未读清后面具体想法。\u003ccode>D\u003c/code>也保留；确定全文主旨后再回看开场的时尚影响关系，排除\u003ccode>A\u003c/code>，最终选择\u003ccode>D\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>lack of imagination\u003c/code>把\u003ccode>imagination\u003c/code>当作创造性想象能力。原文\u003ccode>imagining\u003c/code>的宾语却是她以为高级时装与自己无关这一具体想法，意思是“竟然以为”，不是“缺少想象力”。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把“持有一个错误想法”改成“缺乏想象能力”，丢掉了\u003ccode>imagining\u003c/code>后面真正决定批评内容的命题。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Priestly批评她的助手，是因为助手缺乏想象力。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干的人物\u003ccode>Priestly\u003c/code>及\u003ccode>criticizes\u003c/code>对应第1段的\u003ccode>scolds\u003c/code>。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是\u003ccode>Priestly\u003c/code>用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>lack of imagination\u003c/code>把\u003ccode>imagination\u003c/code>当作创造性想象能力。原文\u003ccode>imagining\u003c/code>的宾语却是她以为高级时装与自己无关这一具体想法，意思是“竟然以为”，不是“缺少想象力”。\u003c/p>\n\u003cp>\u003ccode>Priestly\u003c/code>随后追溯毛衣颜色的来源，用事实纠正助手对时尚影响的认识，并没有要求助手更有创造力或想出新款式。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把“持有一个错误想法”改成“缺乏想象能力”，丢掉了\u003ccode>imagining\u003c/code>后面真正决定批评内容的命题。\u003c/p>\n\u003c/section>"},{"title":"A. lack of imagination","raw":"#### 写作视角法\n\n原文第1段是这样写的：\n\n> In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\n>\n> 题干的人物Priestly及criticizes对应第1段的scolds。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是Priestly用来纠正这种看法的证据，不是对助手议价能力的评价。\n\n电影场景先展示助手以为自己置身时尚之外，再由毛衣颜色的来源证明她仍受时尚影响。下一段才转入这种自上而下观念已过时，不能把后面的行业批评移成`Priestly`此处的批评内容。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Priestly scolds her assistant for having too little imagination to create new looks.\n>\n> Priestly责备助手缺少创造新造型所需的想象力。\n\n若`A`成立，毛衣例子应显示助手不会构思或创造，`Priestly`应要求她拓展想象。实际毛衣的颜色由上游传到助手身上，例子证明的是她未察觉自己受到的影响，两种批评针对的能力不同。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"21题A选项","focus":[250,342,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","partIndex":2,"cumulativeFinal":false},"focusId":"focus-q21-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-A-0\">\u003cblockquote>\n\u003cp>缺乏想象力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>保留：当时凭\u003ccode>imagining\u003c/code>与\u003ccode>imagination\u003c/code>的相似，以及人物受到批评的情境，尚未读清后面具体想法。\u003ccode>D\u003c/code>也保留；确定全文主旨后再回看开场的时尚影响关系，排除\u003ccode>A\u003c/code>，最终选择\u003ccode>D\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>lack of imagination\u003c/code>把\u003ccode>imagination\u003c/code>当作创造性想象能力。原文\u003ccode>imagining\u003c/code>的宾语却是她以为高级时装与自己无关这一具体想法，意思是“竟然以为”，不是“缺少想象力”。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把“持有一个错误想法”改成“缺乏想象能力”，丢掉了\u003ccode>imagining\u003c/code>后面真正决定批评内容的命题。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of t stly\u003c/code>追踪的是颜色从时装秀、百货店到廉价货架的传播，末端价格便宜仍不能证明购买者议价能力差。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把\u003ccode>bargain\u003c/code>所在的销售场景改造为助手的个人技能，并补出了她在交易中表现不佳的事实。\u003c/p>\n\u003c/section>"},{"title":"B. poor bargaining skill","raw":"#### 写作视角法\n\n原文第1段是这样写的：\n\n> In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\n>\n> 题干的人物Priestly及criticizes对应第1段的scolds。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是Priestly用来纠正这种看法的证据，不是对助手议价能力的评价。\n\n电影场景先展示助手以为自己置身时尚之外，再由毛衣颜色的来源证明她仍受时尚影响。下一段才转入这种自上而下观念已过时，不能把后面的行业批评移成`Priestly`此处的批评内容。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Priestly criticizes her assistant for failing to negotiate a good price for her sweater.\n>\n> Priestly批评助手没能为毛衣谈到合适的价格。\n\n`B`成立时应出现价格谈判、出价和成交结果。实际叙述连续移动的是同一种蓝色的传播位置，廉价货架只充当终点；作者既未展示谈判，也未以买贵了作为被批评的原因。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"21题B选项","focus":[250,431,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":21,"option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","partIndex":2,"cumulativeFinal":false},"focusId":"focus-q21-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-B-0\">\u003cblockquote>\n\u003cp>糟糕的议价技巧\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>排除。当时选项显示为“\u003ccode>poor bargaining\u003c/code> [\u003ccode>xxx\u003c/code>]”。当时的判断依据是：“不等于。前者是对时尚影响的判断，后者是交易能力；助手前面的遮挡形容词也不会改动\u003ccode>for\u003c/code>从句给出的原因”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>需要助手买衣服时不善于讨价还价。原文的\u003ccode>bargain bin\u003c/code>是廉价商品筐或廉价货架，说明商品到达零售末端，不是在描写助手与售货员谈价。\u0 stly\u003c/code>责备的对象。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003cp>题干的人物Priestly及criticizes对应第1段的scolds。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是Priestly用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>电影场景先展示助手以为自己置身时尚之外，再由毛衣颜色的来源证明她仍受时尚影响。下一段才转入这种自上而下观念已过时，不能把后面的行业批评移成\u003ccode>Priestly\u003c/code>此处的批评内容。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Priestly criticizes her assistant for failing to recognize fashion’s influence on her own clothes.\u003c/p>\n\u003cp>Priestly批评助手没有认识到时尚对她自己衣着的影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>所需的写法就是先呈现“不受影响”的想法，再展示毛衣如何受上游时尚影响。原文两句话正组成这一纠正过程，颜色路径也有清楚的证明作用。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文借电影里的旧观念，引出对当今快时尚的批评。本题应回答这个开场人物对助手哪种时尚认识不满，不能由全文批评行业直接推出人物傲慢或助手奢侈；具体原因仍须看scolds之后的内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>insensitivity to fashion\u003cbr>对时尚不敏感\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>能说明作者为何用这个电影场景引出行业影响：消费者自以为无关，衣着仍处在传播链内。它解释了开场例子的局部功能；全文随后批评新的快时尚机制，并不取消这里明确的批评原因。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"21题结论","raw":"### 21题结论\n\n> **21. D. insensitivity to fashion**\n\n`A`把“持有一个错误想法”改成“缺乏想象能力”，丢掉了`imagining`后面真正决定批评内容的命题。\n\n`B`把`bargain`所在的销售场景改造为助手的个人技能，并补出了她在交易中表现不佳的事实。\n\n`C`保留`high fashion`这个对象，却把助手对它的疏离误认反写成沉迷。\n\n`D`用一个态度名词概括“没有意识到与自身有关的时尚影响”，保留了`Priestly`责备的对象。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"21题","focus":[250,243,1800,510],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"conclusion","question":21},"html":"\u003cblockquote>\n\u003cp>\u003cstrong>21. D. insensitivity to fashion\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>把“持有一个错误想法”改成“缺乏想象能力”，丢掉了\u003ccode>imagining\u003c/code>后面真正决定批评内容的命题。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把\u003ccode>bargain\u003c/code>所在的销售场景改造为助手的个人技能，并补出了她在交易中表现不佳的事实。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>保留\u003ccode>high fashion\u003c/code>这个对象，却把助手对它的疏离误认反写成沉迷。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>用一个态度名词概括“没有意识到与自身有关的时尚影响”，保留了\u003ccode>Priestly\u003c/code>责备的对象。\u003c/p>\n"},{"title":"22题 · 题干、题型与核心出处","raw":"## 22题\n\n> According to Cline, mass-market labels urge consumers to ______.  \n> 根据Cline的说法，大众市场品牌促使消费者做什么？\n\n### 题型\n\n消费者行为细节题。题干的`mass-market labels`对应第2段的`These labels`，`urge`对应`encourage`。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\n\n### 核心出处\n\n> This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\n\n先写技术使品牌快速回应趋势，再写少库存和频繁上新提高利润，接着写衣物寿命短、衣柜不断更新。结尾用便宜的新潮服装冲击传统周期，将消费频率与商业机制连接起来。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"22题","focus":[250,771,1800,510],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"question","question":22},"html":"\u003cblockquote>\n\u003cp>According to Cline, mass-market labels urge consumers to ______.\u003cbr>根据Cline的说法，大众市场品牌促使消费者做什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>消费者行为细节题。题干的\u003ccode>mass-market labels\u003c/code>对应第2段的\u003ccode>These labels\u003c/code>，\u003ccode>urge\u003c/code>对应\u003ccode>encourage\u003c/code>。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003c/blockquote>\n\u003cp>先写技术使品牌快速回应趋势，再写少库存和频繁上新提高利润，接着写衣物寿命短、衣柜不断更新。结尾用便宜的新潮服装冲击传统周期，将消费频率与商业机制连接起来。\u003c/p>\n"},{"title":"A. combat unnecessary waste","raw":"### A. combat unnecessary waste\n\n> 抵制不必要的浪费\n\n**做题模式中的状态：**第一轮`A`排除。当时的判断依据是：“不等于。原句在推动更快替换，`A`却写成减少浪费，动作方向已经倒转”。\n\n**错误类型：第一类——歪曲原意。**\n\n`A`的`combat unnecessary waste`表达抵制浪费，属于纠正消费弊端的方向。`These labels`实际鼓励消费者把衣物视为`disposable`，并且几周就更新衣柜。\n\n`A`将作者希望读者反思的后果，反写成品牌正在鼓励的节制行为。\n\n**命题人借用的原文材料：**\n\n> This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"22题A选项","focus":[250,871,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"option","question":22,"option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q22-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-A-0\">\u003cblockquote>\n\u003cp>抵制不必要的浪费\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不等于。原句在推动更快替换，\u003ccode>A\u003c/code>却写成减少浪费，动作方向已经倒转”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>combat unnecessary waste\u003c/code>表达抵制浪费，属于纠正消费弊端的方向。\u003ccode>These labels\u003c/code>实际鼓励消费者把衣物视为\u003ccode>disposable\u003c/code>，并且几周就更新衣柜。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>将作者希望读者反思的后果，反写成品牌正在鼓励的节制行为。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"title":"A. combat unnecessary waste","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 按照Cline的说法，大众市场品牌促使消费者抵制不必要的浪费。\n\n题干的`mass-market labels`对应第2段的`These labels`，`urge`对应`encourage`。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\n\n`A`的`combat unnecessary waste`表达抵制浪费，属于纠正消费弊端的方向。`These labels`实际鼓励消费者把衣物视为`disposable`，并且几周就更新衣柜。\n\n一次性使用和快速替换会制造后文批评的浪费，不能因为作者批评浪费，就说被批评的品牌也在劝消费者抵制它。\n\n`A`将作者希望读者反思的后果，反写成品牌正在鼓励的节制行为。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"22题A选项","focus":[250,871,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":22,"option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","partIndex":1,"cumulativeFinal":false},"focusId":"focus-q22-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-A-0\">\u003cblockquote>\n\u003cp>抵制不必要的浪费\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不等于。原句在推动更快替换，\u003ccode>A\u003c/code>却写成减少浪费，动作方向已经倒转”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>combat unnecessary waste\u003c/code>表达抵制浪费，属于纠正消费弊端的方向。\u003ccode>These labels\u003c/code>实际鼓励消费者把衣物视为\u003ccode>disposable\u003c/code>，并且几周就更新衣柜。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>将作者希望读者反思的后果，反写成品牌正在鼓励的节制行为。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>按照Cline的说法，大众市场品牌促使消费者抵制不必要的浪费。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干的\u003ccode>mass-market labels\u003c/code>对应第2段的\u003ccode>These labels\u003c/code>，\u003ccode>urge\u003c/code>对应\u003ccode>encourage\u003c/code>。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>combat unnecessary waste\u003c/code>表达抵制浪费，属于纠正消费弊端的方向。\u003ccode>These labels\u003c/code>实际鼓励消费者把衣物视为\u003ccode>disposable\u003c/code>，并且几周就更新衣柜。\u003c/p>\n\u003cp>一次性使用和快速替换会制造后文批评的浪费，不能因为作者批评浪费，就说被批评的品牌也在劝消费者抵制它。\u003c/p>\ 但A实际说的是：\n\n> combat unnecessary waste  \n> 抵制不必要的浪费\n\n全文批评这种商业模式，恰因为它推动短周期消费。`A`将批评者的反浪费方向安到品牌身上，会消解第3、4段为何追究生产消耗和抛弃数量的依据。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"22题A选项","focus":[250,871,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":22,"option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","partIndex":3,"cumulativeFinal":true},"focusId":"focus-q22-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-A-0\">\u003cblockquote>\n\u003cp>抵制不必要的浪费\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不等于。原句在推动更快替换，\u003ccode>A\u003c/code>却写成减少浪费，动作方向已经倒转”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>combat unnecessary waste\u003c/code>表达抵制浪费，属于纠正消费弊端的方向。\u003ccode>These labels\u003c/code>实际鼓励消费者把衣物视为\u003ccode>disposable\u003c/code>，并且几周就更新衣柜。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>将作者希望读者反思的后果，反写成品牌正在鼓励的节制行为。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to
