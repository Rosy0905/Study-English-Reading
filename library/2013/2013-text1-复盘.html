快速回应趋势，再写少库存和频繁上新提高利润，接着写衣物寿命短、衣柜不断更新。结尾用便宜的新潮服装冲击传统周期，将消费频率与商业机制连接起来。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Mass-market labels encourage consumers to keep their clothes longer and combat unnecessary waste.\u003c/p>\n\u003cp>大众市场品牌鼓励消费者延长衣物使用时间、抵制不必要的浪费。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>需要后文出现延长寿命、减少替换与少买的建议。实际作者写衣物只能经受一两次清洗，并且频繁更新衣柜；叙述展示浪费怎样被制造，而非品牌怎样教人减少浪费。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚的短寿命、大量消费及其代价。本题应找品牌怎样促使顾客持续购买，而不是把作者反对浪费的立场转给品牌；具体频率由renew与every few weeks确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>combat unnecessary waste\u003cbr>抵制不必要的浪费\u003c/p>\n\u003c/blockquote>\n\u003cp>全文批评这种商业模式，恰因为它推动短周期消费。\u003ccode>A\u003c/code>将批评者的反浪费方向安到品牌身上，会消解第3、4段为何追究生产消耗和抛弃数量的依据。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"B. shop for their garments more frequently","raw":"### B. shop for their garments more frequently\n\n> 更频繁地购买服装\n\n**做题模式中的状态：**第一轮`B`保留。当时的判断依据是：“能。`B`没有增加新的对象或条件，只把更新频率换成了更直白的购买频率”。\n\n**选项类型：正确同义改写。**\n\n`B`的`shop` ... `more frequently`对应`renew their wardrobe every few weeks`。更新衣柜在这里通过购买不断上新的便宜服装完成，频繁购买是对具体时间间隔的概括。\n\n`B`保留了品牌促使消费者提高购买频率这一动作和方向，没有承诺每个人都必然照做。\n\n**出处：**\n\n> This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"22题B选项","focus":[250,959,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"option","question":22,"option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q22-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-B-0\">\u003cblockquote>\n\u003cp>更频繁地购买服装\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>保留。当时的判断依据是：“能。\u003ccode>B\u003c/code>没有增加新的对象或条件，只把更新频率换成了更直白的购买频率”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>shop\u003c/code> ... \u003ccode>more frequently\u003c/code>对应\u003ccode>renew their wardrobe every few weeks\u003c/code>。更新衣柜在这里通过购买不断上新的便宜服装完成，频繁购买是对具体时间间隔的概括。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留了品牌促使消费者提高购买频率这一动作和方向，没有承诺每个人都必然照做。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"title":"B. shop for their garments more frequently","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 按照Cline的说法，大众市场品牌促使消费者更频繁地购买服装。\n\n题干的`mass-market labels`对应第2段的`These labels`，`urge`对应`encourage`。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\n\n`B`的`shop` ... `more frequently`对应`renew their wardrobe every few weeks`。更新衣柜在这里通过购买不断上新的便宜服装完成，频繁购买是对具体时间间隔的概括。\n\n前文`more-frequent` ... `releases`说明供给端不断上新，后文`disposable`说明原有衣物很快被替换；两侧信息共同使“更新”指向持续消费，而不只是整理已有衣服。\n\n`B`保留了品牌促使消费者提高购买频率这一动作和方向，没有承诺每个人都必然照做。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"22题B选项","focus":[250,959,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":22,"option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","partIndex":1,"cumulativeFinal":false},"focusId":"focus-q22-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-B-0\">\u003cblockquote>\n\u003cp>更频繁地购买服装\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>保留。当时的判断依据是：“能。\u003ccode>B\u003c/code>没有增加新的对象或条件，只把更新频率换成了更直白的购买频率”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>shop\u003c/code> ... \u003ccode>more frequently\u003c/code>对应\u003ccode>renew their wardrobe every few weeks\u003c/code>。更新衣柜在这里通过购买不断上新的便宜服装完成，频繁购买是对具体时间间隔的概括。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留了品牌促使消费者提高购买频率这一动作和方向，没有承诺每个人都必然照做。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feveri \u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚的短寿命、大量消费及其代价。本题应找品牌怎样促使顾客持续购买，而不是把作者反对浪费的立场转给品牌；具体频率由renew与every few weeks确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>shut out the feverish fashion world\u003cbr>把狂热的时尚世界挡在外面\u003c/p>\n\u003c/blockquote>\n\u003cp>全文揭示品牌怎样加速消费，\u003ccode>D\u003c/code>却让品牌阻断消费者与时尚的联系。它把作者的警惕方向与商业主体的鼓励方向混为一谈，不能解释后文为何批评过量购买。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"22题结论","raw":"### 22题结论\n\n> **22. B. shop for their garments more frequently**\n\n`A`将作者希望读者反思的后果，反写成品牌正在鼓励的节制行为。\n\n`B`保留了品牌促使消费者提高购买频率这一动作和方向，没有承诺每个人都必然照做。\n\n`C`把品牌不宣传某个缺点，改成品牌鼓励消费者抵制广告的普遍影响。\n\n`D`借用了对行业的负面描述，却把品牌的拉动消费改成劝人远离。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"22题","focus":[250,771,1800,510],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"conclusion","question":22},"html":"\u003cblockquote>\n\u003cp>\u003cstrong>22. B. shop for their garments more frequently\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>将作者希望读者反思的后果，反写成品牌正在鼓励的节制行为。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留了品牌促使消费者提高购买频率这一动作和方向，没有承诺每个人都必然照做。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把品牌不宣传某个缺点，改成品牌鼓励消费者抵制广告的普遍影响。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>借用了对行业的负面描述，却把品牌的拉动消费改成劝人远离。\u003c/p>\n"},{"title":"23题 · 题干、题型与核心出处","raw":"## 23题\n\n> The word “indictment” (Para. 2) is closest in meaning to ______.  \n> 第二段中的“indictment”最接近哪个意思？\n\n### 题型\n\n语境词义题。目标词所在短语是`her three-year indictment of` “`fast fashion`”，评价对象为快时尚，评价者是`Cline`。第2段的短寿命、后面`victims`与`wasteful`具体展开负面指控；`three-year`说明写作或调查历时，不能单独决定褒贬。\n\n### 核心出处\n\n> This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\n>\n> The victims of this revolution, of course, are not limited to designers. For H&M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\n>\n> Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\n\n作者先介绍`Cline`的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看`fashion`这个话题名词。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"23题","focus":[250,1300,1800,510],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"question","question":23},"html":"\u003cblockquote>\n\u003cp>The word “indictment” (Para. 2) is closest in meaning to ______.\u003cbr>第二段中的“indictment”最接近哪个意思？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>语境词义题。目标词所在短语是\u003ccode>her three-year indictment of\u003c/code> “\u003ccode>fast fashion\u003c/code>”，评价对象为快时尚，评价者是\u003ccode>Cline\u003c/code>。第2段的短寿命、后面\u003ccode>victims\u003c/code>与\u003ccode>wasteful\u003c/code>具体展开负面指控；\u003ccode>three-year\u003c/code>说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先介绍\u003ccode>Cline\u003c/code>的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看\u003ccode>fashion\u003c/code>这个话题名词。\u003c/p>\n"},{"title":"A. accusation","raw":"### A. accusation\n\n> 指控 ues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\n>\n> The victims of this revolution, of course, are not limited to designers. For H&M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\n>\n> Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\n>\n> 目标词所在短语是her three-year indictment of “fast fashion”，评价对象为快时尚，评价者是Cline。第2段的短寿命、后面victims与wasteful具体展开负面指控；three-year说明写作或调查历时，不能单独决定褒贬。\n\n作者先介绍`Cline`的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看`fashion`这个话题名词。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Cline’s book expresses enthusiasm for the achievements of fast fashion.\n>\n> Cline的书表达了对快时尚成就的热情。\n\n若`B`成立，后文应把快速生产、低价及扩大消费写成值得称赞的成就。实际作者用`victims`和`harmful`继续列代价，无法将这条受害叙述接成赞许。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"23题B选项","focus":[250,1488,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":23,"option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","partIndex":2,"cumulativeFinal":false},"focusId":"focus-q23-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-B-0\">\u003cblockquote>\n\u003cp>热情\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>排除。当时的判断依据是：“不能。原句是在谴责\u003ccode>fast fashion\u003c/code>，不是在表达热情”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>enthusiasm\u003c/code> 情”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>enthusiasm\u003c/code>表示热情或热衷，通常体现积极投入。这里列出的不是欣赏行业的理由，而是产品不耐用、劳动力低薪及环境负担。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把针对快时尚的批评性调查改成对它的积极热情。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的indictment最接近的意思是热情。\u003c/p>\n\u003c/blockquote>\n\u003cp>目标词所在短语是\u003ccode>her three-year indictment of\u003c/code> “\u003ccode>fast fashion\u003c/code>”，评价对象为快时尚，评价者是\u003ccode>Cline\u003c/code>。第2段的短寿命、后面\u003ccode>victims\u003c/code>与\u003ccode>wasteful\u003c/code>具体展开负面指控；\u003ccode>three-year\u003c/code>说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>enthusiasm\u003c/code>表示热情或热衷，通常体现积极投入。这里列出的不是欣赏行业的理由，而是产品不耐用、劳动力低薪及环境负担。\u003c/p>\n\u003cp>作者承认大众品牌利润增加，并不等于\u003ccode>Cline\u003c/code>对此充满赞赏；利润是机制说明，后果才揭示书的评价方向。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把针对快时尚的批评性调查改成对它的积极热情。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2、3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003cp>目标词所在短语是her three-year indictment of “fast fashion”，评价对象为快时尚，评价者是Cline。第2段的短寿命、后面victims与wasteful具体展开负面指控；three-year说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先介绍\u003ccode>Cline\u003c/code>的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看\u003ccode>fashion\u003c/code>这个话题名词。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Cline’s book expresses enthusiasm for the achievements of fast fashion.\u003c/p>\n\u003cp>Cline的书表达了对快时尚成就的热情。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>B\u003c/code>成立，后文应把快速生产、低价及扩大消费写成值得称赞的成就。实际作者用\u003ccode>victims\u003c/code>和\u003ccode>harmful\u003c/code>继续列代价，无法将这条受害叙述接成赞许。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是批评快时尚行业，因此Cline这本书在此应承担揭露问题、提出负面评价的作用。主旨可帮助确定评价方向，具体词义仍需结合victims、harmful与wasteful这些展开内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>enthusiasm\u003cbr>热情\u003c/p>\n\u003c/blockquote>\n\u003cp>全文以行业代价为中心，热情赞许会将这个评价方向翻转。品牌获利是被解释的商业背景，不能越过后面连续的负面证据，拿它替换\u003ccode>Cline\u003c/code>著作的态度。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"C. indifference","raw":"### C. indifference\n\n> 冷漠、不关心\n\n**做题模式中的状态：**第一轮`C`排除。当时的判断依据是：“不等于。持续批评本身就排除了“不关心”这一含义”。\n\n** urable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"title":"C. indifference","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 第2段的indictment最接近的意思是冷漠、不关心。\n\n目标词所在短语是`her three-year indictment of` “`fast fashion`”，评价对象为快时尚，评价者是`Cline`。第2段的短寿命、后面`victims`与`wasteful`具体展开负面指控；`three-year`说明写作或调查历时，不能单独决定褒贬。\n\n`C`的`indifference`是不关心、漠然，缺少评价投入。原文却将`Cline`的书称为长达三年的研究与控诉，并连续呈现她所强调的损害。\n\n`three-year`本身只表持续时间，但它与后面具体的问题清单连用，显示持续追究，而不是对快时尚后果无所谓。\n\n`C`抹去书中鲜明的负面态度，把批评改成没有态度。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"23题C选项","focus":[250,1575,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":23,"option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","partIndex":1,"cumulativeFinal":false},"focusId":"focus-q23-C-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-C-0\">\u003cblockquote>\n\u003cp>冷漠、不关心\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>排除。当时的判断依据是：“不等于。持续批评本身就排除了“不关心”这一含义”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>indifference\u003c/code>是不关心、漠然，缺少评价投入。原文却将\u003ccode>Cline\u003c/code>的书称为长达三年的研究与控诉，并连续呈现她所强调的损害。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>抹去书中鲜明的负面态度，把批评改成没有态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的indictment最接近的意思是冷漠、不关心。\u003c/p>\n\u003c/blockquote>\n\u003cp>目标词所在短语是\u003ccode>her three-year indictment of\u003c/code> “\u003ccode>fast fashion\u003c/code>”，评价对象为快时尚，评价者是\u003ccode>Cline\u003c/code>。第2段的短寿命、后面\u003ccode>victims\u003c/code>与\u003ccode>wasteful\u003c/code>具体展开负面指控；\u003ccode>three-year\u003c/code>说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>indifference\u003c/code>是不关心、漠然，缺少评价投入。原文却将\u003ccode>Cline\u003c/code>的书称为长达三年的研究与控诉，并连续呈现她所强调的损害。\u003c/p>\n\u003cp>\u003ccode>three-year\u003c/code>本身只表持续时间，但它与后面具体的问题清单连用，显示持续追究，而不是对快时尚后果无所谓。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>抹去书中鲜明的负面态度，把批评改成没有态度。\u003c/p>\n\u003c/section>"},{"title":"C. indifference","raw":"#### 写作视角法\n\n原文第2、3、4段是这样写的：\n\n> This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\n>\n> The victims of this revolution, of course, are not limited to designers. For H&M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\n>\n> Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\n>\n> 目标词所在短语是her three-year indictment of “fast fashion”，评价对象为快时尚，评价者是Cline。第2段的短寿命、后面victims与wasteful具体展开负面指控；three-year说明写作或调查历时，不能单独决定褒贬。\n\n作者先介绍`Cline`的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看`fashion`这个话题名词。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Cline’s book shows indifference to the effects of fast fashion.\n>\n> Cline的书对快时尚的影响表现冷漠。 书在此应承担揭露问题、提出负面评价的作用。主旨可帮助确定评价方向，具体词义仍需结合victims、harmful与wasteful这些展开内容。\n\n但C实际说的是：\n\n> indifference  \n> 冷漠、不关心\n\n全文借`Cline`展开批评，她的书是推进问题意识的材料。`C`会使第3、4段细数代价失去态度归属；必须保留的是明确批评，而非把词义弱化成不关心。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"23题C选项","focus":[250,1575,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":23,"option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","partIndex":3,"cumulativeFinal":true},"focusId":"focus-q23-C-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-C-0\">\u003cblockquote>\n\u003cp>冷漠、不关心\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>排除。当时的判断依据是：“不等于。持续批评本身就排除了“不关心”这一含义”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>indifference\u003c/code>是不关心、漠然，缺少评价投入。原文却将\u003ccode>Cline\u003c/code>的书称为长达三年的研究与控诉，并连续呈现她所强调的损害。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>抹去书中鲜明的负面态度，把批评改成没有态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\  mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003cp>目标词所在短语是her three-year indictment of “fast fashion”，评价对象为快时尚，评价者是Cline。第2段的短寿命、后面victims与wasteful具体展开负面指控；three-year说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先介绍\u003ccode>Cline\u003c/code>的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看\u003ccode>fashion\u003c/code>这个话题名词。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Cline’s book shows indifference to the effects of fast fashion.\u003c/p>\n\u003cp>Cline的书对快时尚的影响表现冷漠。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>C\u003c/code>成立，作者应说明她不愿评判或不在意后果。实际后文不但点明劳动与环境受害，还将她归入消费者行动主义传统；这种写法在扩大关注，不能支持漠然。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是批评快时尚行业，因此Cline这本书在此应承担揭露问题、提出负面评价的作用。主旨可帮助确定评价方向，具体词义仍需结合victims、harmful与wasteful这些展开内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>indifference\u003cbr>冷漠、不关心\u003c/p>\n\u003c/blockquote>\n\u003cp>全文借\u003ccode>Cline\u003c/code>展开批评，她的书是推进问题意识的材料。\u003ccode>C\u003c/code>会使第3、4段细数代价失去态度归属；必须保留的是明确批评，而非把词义弱化成不关心。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"D. tolerance","raw":"### D. tolerance\n\n> 容忍、宽容\n\n**做题模式中的状态：**第一轮`D`排除。当时的判断依据是：“不能。指责与容忍不是同一态度”。\n\n**错误类型：第一类——歪曲原意。**\n\n`D`的`tolerance`表示容忍，意味着接受其存在或对问题持宽容态度。原文指出的损害并未被`Cline`开脱，反而成为要求消费改变的理由。\n\n`D`将对问题的谴责改成容忍问题，改变了评价方向。\n\n**命题人借用的原文材料：**\n\n> This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\n>\n> The victims of this revolution, of course, are not limited to designers. For H&M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in v ressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的indictment最接近的意思是容忍、宽容。\u003c/p>\n\u003c/blockquote>\n\u003cp>目标词所在短语是\u003ccode>her three-year indictment of\u003c/code> “\u003ccode>fast fashion\u003c/code>”，评价对象为快时尚，评价者是\u003ccode>Cline\u003c/code>。第2段的短寿命、后面\u003ccode>victims\u003c/code>与\u003ccode>wasteful\u003c/code>具体展开负面指控；\u003ccode>three-year\u003c/code>说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\ ee-year indictment of “fast fashion”，评价对象为快时尚，评价者是Cline。第2段的短寿命、后面victims与wasteful具体展开负面指控；three-year说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先介绍\u003ccode>Cline\u003c/code>的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看\u003ccode>fashion\u003c/code>这个话题名词。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Cline’s book argues for tolerance of the harmful practices of fast fashion.\u003c/p>\n\u003cp>Cline的书主张容忍快时尚的有害做法。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>需要解释为何弊端可以接受，后文应给出宽容的理由。实际作者不断累加受害与浪费，再讨论如何改变消费，没有出现替现状开脱的推进。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是批评快时尚行业，因此Cline这本书在此应承担揭露问题、提出负面评价的作用。主旨可帮助确定评价方向，具体词义仍需结合victims、harmful与wasteful这些展开内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>tolerance\u003cbr>容忍、宽容\u003c/p>\n\u003c/blockquote>\n\u003cp>行业批评与改变的讨论要求先承认问题值得纠正。\u003ccode>D\u003c/code>把这种态度写成宽容，无法解释为何作者要用大量后果支撑\u003ccode>Cline\u003c/code>的控诉；它不只是程度较弱，而是评价功能换了。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"23题结论","raw":"### 23题结论\n\n> **23. A. accusation**\n\n`A`保留了评价的负面方向与被追责的对象，是语境中的近义解释。\n\n`B`把针对快时尚的批评性调查改成对它的积极热情。\n\n`C`抹去书中鲜明的负面态度，把批评改成没有态度。\n\n`D`将对问题的谴责改成容忍问题，改变了评价方向。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"23题","focus":[250,1300,1800,510],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"conclusion","question":23},"html":"\u003cblockquote>\n\u003cp>\u003cstrong>23. A. accusation\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>保留了评价的负面方向与被追责的对象，是语境中的近义解释。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把针对快时尚的批评性调查改成对它的积极热情。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>抹去书中鲜明的负面态度，把批评改成没有态度。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>将对问题的谴责改成容忍问题，改变了评价方向。\u003c/p>\n"},{"title":"24题 · 题干、题型与核心出处","raw":"## 24题\n\n> Which of the following can be inferred from the last paragraph?  \n> 从最后一段可以推断出什么？\n\n### 题型\n\n末段推断题。末段先承认几家企业已有减害尝试，再说`Cline`寄望顾客带来持久改变。作者以`She exhibits the idealism common to many advocates of sustainability`质疑这种期待，并用`vanity`与`can’t afford not to`把可持续购物拉回经济约束。\n\n### 核心出处\n\n> Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\n\n让步承认企业行动，随后提出顾客改变论，再指出仅靠道德期待过于理想，最后落到负担得起与否。结论不否认全部企业行动，也没有比较理想主义者和其他人的虚荣程度。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"24题","focus":[250,1828,1800,510],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"question","question":24},"html":"\u003cblockquote>\n\u003cp>Which of the following can be inferred from the last paragraph?\u003cbr>从最后一段可以推断出什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>末段推断题。末段先承认几家企业已有减害尝试，再说\u003ccode>Cline\u003c/code>寄望顾客带来持久改变。作者以\u003ccode>She exhibits the idealism common to many advocates of sustainability\u003c/code>质疑这种期待，并用\u003ccode>vanity\u003c/code>与\u003ccode>can’t afford not to\u003c/code>把可持续购物拉回经济约束。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003c/blockquote>\n\u003cp>让步承认企业行动，随后提出顾客改变论，再指出仅靠道德期待过于理想，最后落到负担得起与否。结论不否认全部企业行动，也没有比较理想主义者和其他人的虚荣程度。\u003c/p>\n"},{"title":"A. Vanity has more often been found in idealists.","raw":"### A. Vanity has more often been found in idealists.\n\n> 虚荣更常见于理想主义者\n\n**做题模式中的状态：**第一轮`A`排除。当时选项显示为“`Vanity has more often been found in` [`xxx`].”。当时的判断依据是：“不能。无论被遮挡的是哪类人，原句都没有把恒定因素改成群体间的频率比较”。\n\n**错误类型：第三类——无中生有。**\n\n`A`的`more often`要求比较理想主义者与其他人，判断谁更常虚荣。`Vanity is a constant`说虚荣是一直存在的因素，没有给出人群频率对比。\n\n`A`把两个不同层面的评价拼成群体差异，新增了`more often`这个比较关系。\n\n**命题人借用的原文材料：**\n\n> Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"24题A选项","focus":[250,1928,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"option","question":24,"option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q24-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-A-0\">\u003cblockquote>\n\u003cp>虚荣更常见于理想主义者\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时选项显示为“\u003ccode>Vanity has more often been found in\u003c/code> [\u003ccode>xxx\u003c/code>].”。当时的判断依据是：“不能。无论被遮挡的是哪类人，原句都没有把恒定因素改成群体间的频率比较”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>more often\u003c/code>要求比较理想主义者与其他人，判断谁更常虚荣。\u003ccod B\u003c/code>把这种有条件的批评绝对化，局部还与绿色系列的明确例子相冲突。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"C. Pricing is vital to environment-friendly purchasing.","raw":"### C. Pricing is vital to environment-friendly purchasing.\n\n> 价格对环保购买至关重要\n\n**做题模式中的状态：**第一轮`C`保留。当时的判断依据是：“能。`C`没有把价格说成唯一因素，只说它很关键，符合`only`与`afford`建立的条件关系”。\n\n**选项类型：正确局部推断。**\n\n`C`的`Pricing is vital`把价格或经济负担视为环保购买的重要条件。末句`only when they can’t afford not to`以经济约束限制消费者何时会可持续购物，支持这种重要性。\n\n`C`概括了经济因素的关键作用，保留`vital`的分量，又没有把它夸成唯一决定一切的机制。\n\n**出处：**\n\n> Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"24题C选项","focus":[250,2104,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"option","question":24,"option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q24-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-C-0\">\u003cblockquote>\n\u003cp>价格对环保购买至关重要\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>保留。当时的判断依据是：“能。\u003ccode>C\u003c/code>没有把价格说成唯一因素，只说它很关键，符合\u003ccode>only\u003c/code>与\u003ccode>afford\u003c/code>建立的条件关系”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>Pricing is vital\u003c/code>把价格或经济负担视为环保购买的重要条件。末句\u003ccode>only when they can’t afford not to\u003c/code>以经济约束限制消费者何时会可持续购物，支持这种重要性。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>概括了经济因素的关键作用，保留\u003ccode>vital\u hey cannot afford.\n>\n> 消费者对自己买不起的服装更感兴趣。\n\n若`D`成立，作者应解释高价或不可及性怎样增强欲望。实际结尾说明何时经济约束会迫使购物行为变得可持续，讨论的对象是行为选择，不是昂贵衣物的吸引力。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"24题D选项","focus":[250,2192,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":24,"option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","partIndex":2,"cumulativeFinal":false},"focusId":"focus-q24-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-D-0\">\u003cblockquote>\n\u003cp>人们对买不起的衣服更感兴趣\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>排除。当时选项显示为“\u003ccode>People are more interested in\u003c/code> [\u003ccode>xxx\u003c/code>] \u003ccode>garments\u003c/code>.”。当时的判断依据是：“不等于。原文是成本压力，\u003ccode>D\u003c/code>是兴趣偏好，因果来源不同”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>more interested\u003c/code>要求兴趣更强，\u003ccode>unaffordable garments\u003c/code>把买不起的衣服当作兴趣对象。原文\u003ccode>can’t afford not to\u003c/code>中的\u003ccode>not to\u003c/code>指不采取可持续购物，谈的是继续旧行为的代价。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>改变了\u003ccode>afford\u003c/code>所连接的行为，并凭空补出兴趣程度的比较。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据最后一段可以推断，人们对买不起的衣服更感兴趣。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段先承认几家企业已有减害尝试，再说\u003ccode>Cline\u003c/code>寄望顾客带来持久改变。作者以\u003ccode>She exhibits the idealism common to many advocates of sustainability\u003c/code>质疑这种期待，并用\u003ccode>vanity\u003c/code>与\u003ccode>can’t afford not to\u003c/code>把可持续购物拉回经济约束。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>more interested\u003c/code>要求兴趣更强，\u003ccode>unaffordable garments\u003c/code>把买不起的衣服当作兴趣对象。原文\u003ccode>can’t afford not to\u003c/code>中的\u003ccode>not to\u003c/code>指不采取可持续购物，谈的是继续旧行为的代价。\u003c/p>\n\u003cp>这不是“买不起某件衣服”，更没有比较人们对贵衣服与可负担衣服的兴趣。双重否定不能拆成孤立的\u003ccode>afford\u003c/code>再配上\u003ccode>garments\u003c/code>。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>改变了\u003ccode>afford\u003c/code>所连接的行为，并凭空补出兴趣程度的比较。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003cp>末段先承认几家企业已有减害尝试，再说Cline寄望顾客带来持久改变。作者以She exhibits the idealism common to many advocates of sustainability质疑这种期待，并用vanity与can’t afford not to把可持续购物拉回经济约束。\u003c/p>\n\u003c/blockquote>\n\u003cp>让步承认企业行动，随后提出顾客改变论，再指出仅靠道德期待过于理想，最后落到负担得起与否。结论不否认全部企业行动，也没有比较理想主义者和其他人的虚荣程度。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Consumers are more interested in garments that they cannot afford.\u003c/p>\n\u003cp>消费者对自己买不起的服装更感兴趣。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>D\u003c/code>成立，作者应解释高价或不可及性怎样增强欲望。实际结尾说明何时经济约束会迫使购物行为变得可持续，讨论的对象是行为选择，不是昂贵衣物的吸引力。\u003c/p>\n\u003c/section>"},{"title":"D. People are more interested in unaffordable garments.","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Criticism of the fast-fashion industry.  \n> 对快时尚产业的批评\n\n把这个主旨直接代入24题题干：\n\n> 全文批评快时尚并追问改变能否实现。末段的推论应说明消费改变受什么现实条件制约；全文主题不能替代末句的经济限制，关键仍是only when与can’t afford not to。\n\n但D实际说的是：\n\n> People are more interested in unaffordable garments.  \n> 人们对买不起的衣服更感兴趣\n\n快时尚批评与可持续购买之间的转折由经济条件完成。`D`把条件改成对买不起的衣服的偏爱，使结论转到奢侈欲望，既错接`afford`的对象，也失去可持续行为这一落点。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"24题D选项","focus":[250,2192,1800,85],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"method","question":24,"option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","partIndex":3,"cumulativeFinal":true},"focusId":"focus-q24-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-D-0\">\u003cblockquote>\n\u003cp>人们对买不起的衣服更感兴趣\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>排除。当时选项显示为“\u003ccode>People are more interested in\u003c/code> [\u003ccode>xxx\u003c/code>] \u003ccode>garments\u003c/code>.”。当时的判断依据是：“不等于。原文是成本压力，\u003ccode>D\u003c/code>是兴趣偏好，因果来源不同”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>more interested\u003c/code>要求兴趣更强，\u003ccode>unaffordable garments\u003c/code>把买不起的衣服当作兴趣对象。原文\u003ccode>can’t afford not to\u003c/code>中的\u003ccode>not to\u003c/code>指不采取可持续购物，谈的是继续旧行为的代价。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>改变了\u003ccode>afford\u003c/code>所连接的行为，并凭空补出兴趣程度的比较。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据最后一段可以推断，人们对买不起的衣服更感兴趣。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段先承认几家企业已有减害尝试，再说\u003ccode>Cline\u003c/code>寄望顾客带来持久改变。作者以\u003ccode>She exhibits the idealism common to many advocates of sustainability\u003c/code>质疑这种期待，并用\u003ccode>vanity\u003c/code>与\u003ccode>can’t afford not to\u003c/code>把可持续购物拉回经济约束。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>more interested\u003c/code>要求兴趣更强，\u003ccode>unaffordable garments\u003c/code>把买不起的衣服当作兴趣对象。原文\u003ccode>can’t afford not to\u003c/code>中的\u003ccode>not to\u003c/code>指不采取可持续购物，谈的是继续旧行为的代价。\u003c/p>\n\u003cp>这不是“买不起某件衣服”，更没有比较人们对贵衣服与可负担衣服的兴趣。双重否定不能拆成孤立的\u003ccode>afford\u003c/code>再配上\u003ccode>garments\u003c/code>。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>改变了\u003ccode>afford\u003c/code>所连接的行为，并凭空补出兴趣程度的比较。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003cp>末段先承认几家企业已有减害尝试，再说Cline寄望顾客带来持久改变。作者以She exhibits the idealism common to many advocates of sustainability质疑这种期待，并用vanity与can’t afford not to把可持续购物拉回经济约束。\u003c/p>\n\u003c/blockquote>\n\u003cp>让步承认企业行动，随后提出顾客改变论，再指出仅靠道德期待过于理想，最后落到负担得起与否。结论不否认全部企业行动，也没有比较理想主义者和其他人的虚荣程度。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Consumers are more interested in garments that they cannot afford.\u003c/p>\n\u003cp>消费者对自己买不起的服装更感兴趣。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>D\u003c/code>成立，作者应解释高价或不可及性怎样增强欲望。实际结尾说明何时经济约束会迫使购物行为变得可持续，讨论的对象是行为选择，不是昂贵衣物的吸引力。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚并追问改变能否实现。末段的推论应说明消费改变受什么现实条件制约；全文主题不能替代末句的经济限制，关键仍是only when与can’t afford not to。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>People are more interested in unaffordable garments.\u003cbr>人们对买不起的衣服更感兴趣\u003c/p>\n\u003c/blockquote>\n\u003cp>快时尚批评与可持续购买之间的转折由经济条件完成。\u003ccode>D\u003c/code>把条件改成对买不起的衣服的偏爱，使结论转到奢侈欲望，既错接\u003ccode>afford\u003c/code>的对象，也失去可持续行为这一落点。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"24题结论","raw":"### 24题结论\n\n> **24. C. Pricing is vital to environment-friendly purchasing.**\n\n`A`把两个不同层面的评价拼成群体差异，新增了`more often`这个比较关系。\n\n`B`将“已有减害努力但仍不足”改写为“行业忽视”，抹去让步承认的事实。\n\n`C`概括了经济因素的关键作用，保留`vital`的分量，又没有把它夸成唯一决定一切的机制。\n\n`D`改变了`afford`所连接的行为，并凭空补出兴趣程度的比较。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"24题","focus":[250,1828,1800,510],"sourceW":2255,"sourceH":3141},"meta":{"bird":3,"kind":"conclusion","question":24},"html":"\u003cblockquote>\n\u003cp>\u003cstrong>24. C. Pricing is vital to environment-friendly purchasing.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>把两个不同层面的评价拼成群体差异，新增了\u003ccode>more often\u003c/code>这个比较关系。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>将“已有减害努力但仍不足”改写为“行业忽视”，抹去让步承认的事实。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>概括了经济因素的关键作用，保留\u003ccode>vital\u003c/code>的分量，又没有把它夸成唯一决定一切的机制。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>改变了\u003ccode>afford\u003c/code>所连接的行为，并凭空补出兴趣程度的比较。\u003c/p>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此这里依据本篇阅读的主题与论证关系，扩写、改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：传统时尚观念的过时**（段落1-2转折对比） 电影中的自上而下时尚观：（高级时装影响力从时装秀→百货商店→廉价货架）// 现实中的快时尚革命：【技术进步使大众品牌（Zara、H&M、优衣库）能快速反应潮流+精确预测需求→更快周转、更多利润】\n\n↓（快时尚的策略）\n\n**逻辑层次2：快时尚的商业模式**（段落2核心论述） 消费者行为改变：（衣服被视为一次性用品：只能洗一两次）→ 购买频率加快：（每几周更新衣柜）→ 产业影响：【通过极低价格提供潮流单品→劫持时尚周期→动摇季节性节奏的传统产业】\n\n↓（负面影响）\n\n**逻辑层次3：快时尚的代价**（段落3-4问题揭示） 受害者不只是设计师：【为提供5.95美元迷你裙→必须：（依赖低工资海外劳工+大量订购损害自然资源+使用有害化学物质）】→ 浪费问题：（美国人年购200亿件服装/人均64件→即使捐赠也造成浪费）→ 类比：大规模生产服装如快餐（满足需求但不耐用且浪费）\n\n↓（解决方案的困境）\n\n**逻辑层次4：理想与现实的差距**（段落5-6解决方案） 个人解决方案的局限：（莎拉·凯特·博蒙特自制衣服的例子：需要几十年完善手艺→无法复制）→ 企业努力有限：（如H&M的绿色系列）→ 克莱恩的观点：【持久改变只能由消费者实现 // 但虚荣是恒定的→只有当可持续消费成为经济必需时人们才会改变】\n\n↑（全文主旨）\n\n全文核心观点：快时尚产业通过技术进步和低价策略改变了传统时尚产业和消费模式，但这种模式对环境、劳工和资源造成严重损害。虽然有个人和企业的努力，但真正的改变需要消费者行为的根本转变，而这只有在经济压力下才可能实现。\n\n### 小标题题\n\n**训练用改编文本，不是外刊原文。**\n\nChoose the most suitable heading from the list A–G for each paragraph. There are two extra headings.\n\nA. Why a personal alternative is hard to reproduce\n\nB. From a seasonal trickle to a rapid commercial cycle\n\nC. A bargain for everyone in the supply chain\n\nD. Lasting change under the pressure of consumer choices\n\nE. The hidden production costs of a cheap garment\n\nF. A personal solution that everyone can quickly copy\n\nG. When cheap purchases become expensive waste\n\n#### 41. ______\n\nThe familiar story of fashion begins on a designer’s runway and ends, much later, in an ordinary shopper’s wardrobe. It imagines a slow movement from an expensive original towards cheaper versions. Fast fashion changes the speed and organisation of that journey. Retailers use information and rapid production to follow demand, release new products frequently and encourage customers to return before a season has ended. A low price makes each purchase seem unimportant; repeated novelty makes not purchasing feel like missing out. The central change is therefore more than the availability of inexpensive clothes. It is a commercial cycle that repeatedly turns a current desire into the need for another visit.\n\n#### 42. ______\n\nThe price on a skirt is not a complete account of the resources needed to make it. When a retailer offers the same low-priced item through a large network of stores, production must meet both the price and the volume. That demand can place pressure on workers’ wages, on supplies of water and other natural resources, and on the handling of chemicals. None of these pressures appears as a separate line on the customer’s receipt. The shopper can therefore experience a bargain while someone elsewhere carries a cost. To assess cheap clothing, the calculation must travel backwards from the shop to the conditions of production.\n\n#### 43. ______\n\nThe costs do not end when a garment leaves the shop. If low prices and constant arrivals encourage customers to replace usable clothes, a small bill can produce a large stream of unwanted material. A wardrobe full of items worn only briefly is evidence of throughput, not necessarily of a need being met. Donation can be useful, but giving clothing away does not recover every resource already used to make it or guarantee that another person will wear it. The relevant question is not merely whether a buyer can afford one more item. It is what happens when millions of similarly small decisions create an excess that the whole system must absorb.\n\n#### 44. ______\n\nOne striking response is to make one’s own clothes and keep them for a long time. Such work can restore attention to materials, fit and durability, qualities that disappear when clothing is treated as an endlessly replaceable product. Yet an accomplished maker is not created by a weekend resolution. The skills behind a well-made wardrobe may represent decades of practice, and the time required competes with other responsibilities. The example is valuable because it reveals another relationship with clothes, not because every shopper can reproduce it immediately. Turning an admirable life into a universal prescription would conceal the conditions that made that life possible.\n\n#### 45. ______\n\nCompanies can change materials and reduce some harmful practices, and these efforts should not be dismissed. Nevertheless, a greener product line does not automatically weaken a business model built on selling more items more often. Lasting change also requires customers to value longer use rather than constant replacement. That is a demanding expectation when novelty remains attractive and another purchase feels cheap. Moral appeals alone cannot remove those incentives. Prices, the quality of available alternatives and the cost of continuing wasteful habits all shape what shoppers can choose. A durable improvement will require consumer decisions to support the changes that isolated corporate initiatives cannot deliver by themselves.","section":"第四鸟 · 新题型","level":1,"context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"bird":4,"kind":"newtype-intro","status":"ready"},"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此这里依据本篇阅读的主题与论证关系，扩写、改编成小标题题和排序题供大家练习。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：传统时尚观念的过时\u003c/strong>（段落1-2转折对比） 电影中的自上而下时尚观：（高级时装影响力从时装秀→百货商店→廉价货架）// 现实中的快时尚革命：【技术进步使大众品牌（Zara、H&amp;M、优衣库）能快速反应潮流+精确预测需求→更快周转、更多利润】\u003c/p>\n\u003cp>↓（快时尚的策略）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：快时尚的商业模式\u003c/strong>（段落2核心论述） 消费者行为改变：（衣服被视为一次性用品：只能洗一两次）→ 购买频率加快：（每几周更新衣柜）→ 产业影响：【通过极低价格提供潮流单品→劫持时尚周期→动摇季节性
