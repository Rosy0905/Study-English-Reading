turns a current desire into the need for another visit.\u003c/p>\n\u003ch4>42. ______\u003c/h4>\n\u003cp>The price on a skirt is not a complete account of the resources needed to make it. When a retailer offers the same low-priced item through a large network of stores, production must meet both the price and the volume. That demand can place pressure on workers’ wages, on supplies of water and other natural resources, and on the handling of chemicals. None of these pressures appears as a separate line on the customer’s receipt. The shopper can therefore experience a bargain while someone elsewhere carries a cost. To assess cheap clothing, the calculation must travel backwards from the shop to the conditions of production.\u003c/p>\n\u003ch4>43. ______\u003c/h4>\n\u003cp>The costs do not end when a garment leaves the shop. If low prices and constant arrivals encourage customers to replace usable clothes, a small bill can produce a large stream of unwanted material. A wardrobe full of items worn only briefly is evidence of throughput, not necessarily of a need being met. Donation can be useful, but giving clothing away does not recover every resource already used to make it or guarantee that another person will wear it. The relevant question is not merely whether a buyer can afford one more item. It is what happens when millions of similarly small decisions create an excess that the whole system must absorb.\u003c/p>\n\u003ch4>44. ______\u003c/h4>\n\u003cp>One striking response is to make one’s own clothes and keep them for a long time. Such work can restore attention to materials, fit and durability, qualities that disappear when clothing is treated as an endlessly replaceable product. Yet an accomplished maker is not created by a weekend resolution. The skills behind a well-made wardrobe may represent decades of practice, and the time required competes with other responsibilities. The example is valuable because it reveals another relationship with clothes, not because every shopper can reproduce it immediately. Turning an admirable life into a universal prescription would conceal the conditions that made that life possible.\u003c/p>\n\u003ch4>45. ______\u003c/h4>\n\u003cp>Companies can change materials and reduce some harmful practices, and these efforts should not be dismissed. Nevertheless, a greener product line does not automatically weaken a business model built on selling more items more often. Lasting change also requires customers to value longer use rather than constant replacement. That is a demanding expectation when novelty remains attractive and another purchase feels cheap. Moral appeals alone cannot remove those incentives. Prices, the quality of available alternatives and the cost of continuing wasteful habits all shape what shoppers can choose. A durable improvement will require consumer decisions to support the changes that isolated corporate initiatives cannot deliver by themselves.\u003c/p>\n"},{"title":"小标题题 41","raw":"## 小标题题 41\n\n**B. From a seasonal trickle to a rapid commercial cycle**\n\n从按季流传到快速商业循环\n\n先交代旧的时尚下传图景，再解释快速上新怎样重组品牌与消费者之间的循环。\n\n### 关键证据\n\n> a slow movement from an expensive original towards cheaper versions\n\n明确旧图景是慢速下传，标题需要保留这个起点。\n\n> release new products frequently and encourage customers to return\n\n供给的高频上新与需求的反复回店被接在一起。\n\n> a commercial cycle that repeatedly turns a current desire into the need for another visit\n\n结尾把变化概括为商业循环，而非仅仅价格降低。\n\n### 段内推进\n\n设计师向下传播的旧故事 → 技术加快反应和生产 → 低价与新鲜感刺激回购 → 消费周期被缩短。\n\n### 标题对应与干扰项比对\n\n`B`的`From` ... `to` ...覆盖新旧对比；`seasonal trickle`对应慢速流传，`rapid commercial cycle`对应频繁推出和反复回店。\n\n`G`的浪费在后文才展开；本段说明循环如何运作，没有交代废弃后果。只因出现`cheap`就选`G`，会跳过此处的新旧机制对比。\n\n**最终答案：41 B。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"bird":4,"kind":"small-title-analysis","question":41,"answer":"B"},"html":"\u003cp>\u003cstrong>B. From a seasonal trickle to a rapid commercial cycle\u003c/strong>\u003c/p>\n\u003cp>从按季流传到快速商业循环\u003c/p>\n\u003cp>先交代旧的时尚下传图景，再解释快速上新怎样重组品牌与消费者之间的循环。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>a slow movement from an expensive original towards cheaper versions\u003c/p>\n\u003c/blockquote>\n\u003cp>明确旧图景是慢速下传，标题需要保留这个起点。\u003c/p>\n\u003cblockquote>\n\u003cp>release new products frequently and encourage customers to return\u003c/p>\n\u003c/blockquote>\n\u003cp>供给的高频上新与需求的反复回店被接在一起。\u003c/p>\n\u003cblockquote>\n\u003cp>a commercial cycle that repeatedly turns a current desire into the need for another visit\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾把变化概括为商业循环，而非仅仅价格降低。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>设计师向下传播的旧故事 → 技术加快反应和生产 → 低价与新鲜感刺激回购 → 消费周期被缩短。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>From\u003c/code> ... \u003ccode>to\u003c/code> ...覆盖新旧对比；\u003ccode>seasonal trickle\u003c/code>对应慢速流传，\u003ccode>rapid commercial cycle\u003c/code>对应频繁推出和反复回店。\u003c/p>\n\u003cp>\u003ccode>G\u003c/code>的浪费在后文才展开；本段说明循环如何运作，没有交代废弃后果。只因出现\u003ccode>cheap\u003c/code>就选\u003ccode>G\u003c/code>，会跳过此处的新旧机制对比。\u003c/p>\n\u003cp>\u003cstrong>最终答案：41 B。\u003c/strong>\u003c/p>\n"},{"title":"小标题题 42","raw":"## 小标题题 42\n\n**E. The hidden production costs of a cheap garment**\n\n低价衣物背后隐藏的生产成本\n\n将视线从店内标价转回生产，追踪低价与大规模订单把成本转给谁。\n\n### 关键证据\n\n> not a complete account of the resources needed to make it\n\n开头否定标价能完整代表成本。\n\n> workers’ wages, on supplies of water and other natural resources\n\n列出劳动和资源的具体压力，化学品处理继续补充同一层成本。\n\n> travel backwards from the shop to the conditions of production\n\n结尾明确本段追查方向是生产条件。\n\n### 段内推进\n\n低标价不等于低总成本 → 大批量与低价格共同要求 → 工资、资源、化学处理受压 → 顾客实惠伴随别处负担。\n\n### 标题对应与干扰项比对\n\n`E`的`hidden`对应账单不显示，`production costs`对应工资、资源和化学处理，`cheap garment`对应店内低价单品。\n\n`C`把一端的实惠扩大到`everyone`。原文明确`someone elsewhere carries a cost`，恰在拆穿“消费者便宜就是所有人受益”的想象。\n\n**最终答案：42 E。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"bird":4,"kind":"small-title-analysis","question":42,"answer":"E"},"html":"\u003cp>\u003cstrong>E. The hidden production costs of a cheap garment\u003c/strong>\u003c/p>\n\u003cp>低价衣物背后隐藏的生产成本\u003c/p>\n\u003cp>将视线从店内标价转回生产，追踪低价与大规模订单把成本转给谁。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>not a complete account of the resources needed to make it\u003c/p>\n\u003c/blockquote>\n\u003cp>开头否定标价能完整代表成本。\u003c/p>\n\u003cblockquote>\n\u003cp>workers’ wages, on supplies of water and other natural resources\u003c/p>\n\u003c/blockquote>\n\u003cp>列出劳动和资源的具体压力，化学品处理继续补充同一层成本。\u003c/p>\n\u003cblockquote>\n\u003cp>travel backwards from the shop to the conditions of production\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾明确本段追查方向是生产条件。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>低标价不等于低总成本 → 大批量与低价格共同要求 → 工资、资源、化学处理受压 → 顾客实惠伴随别处负担。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>E\u003c/code>的\u003ccode>hidden\u003c/code>对应账单不显示，\u003ccode>production costs\u003c/code>对应工资、资源和化学处理，\u003ccode>cheap garment\u003c/code>对应店内低价单品。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把一端的实惠扩大到\u003ccode>everyone\u003c/code>。原文明确\u003ccode>someone elsewhere carries a cost\u003c/code>，恰在拆穿“消费者便宜就是所有人受益”的想象。\u003c/p>\n\u003cp>\u003cstrong>最终答案：42 E。\u003c/strong>\u003c/p>\n"},{"title":"小标题题 43","raw":"## 小标题题 43\n\n**G. When cheap purchases become expensive waste**\n\n廉价购买变成高代价浪费之时\n\n把成本从生产端推进到消费与废弃，说明单次便宜为何能累积成系统性负担。\n\n### 关键证据\n\n> The costs do not end when a garment leaves the shop.\n\n承接生产成本并向购物之后延伸。\n\n> giving clothing away does not recover every resource\n\n限制捐赠的补救能力，不能把送出视为前期消耗全部归零。\n\n> millions of similarly small decisions create an excess\n\n结尾把个人小决定聚合为大量过剩。\n\n### 段内推进\n\n低价和上新促成替换 → 穿用时间短、废弃流增加 → 捐赠不能完全抵消资源消耗 → 无数小单累积系统性过剩。\n\n### 标题对应与干扰项比对\n\n`G`的`cheap purchases`对应小额购买，`expensive waste`不是说垃圾售价高，而是被消耗的资源和系统处理负担，覆盖从购买到废弃的变化。\n\n`E`同样谈成本，但重点在制造这件衣服所用的劳动资源；本段首句已经向离店后的替换和过剩推进。用`E`会丢掉新增的消费阶段。\n\n**最终答案：43 G。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"bird":4,"kind":"small-title-analysis","question":43,"answer":"G"},"html":"\u003cp>\u003cstrong>G. When cheap purchases become expensive waste\u003c/strong>\u003c/p>\n\u003cp>廉价购买变成高代价浪费之时\u003c/p>\n\u003cp>把成本从生产端推进到消费与废弃，说明单次便宜为何能累积成系统性负担。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>The costs do not end when a garment leaves the shop.\u003c/p>\n\u003c/blockquote>\n\u003cp>承接生产成本并向购物之后延伸。\u003c/p>\n\u003cblockquote>\n\u003cp>giving clothing away does not recover every resource\u003c/p>\n\u003c/blockquote>\n\u003cp>限制捐赠的补救能力，不能把送出视为前期消耗全部归零。\u003c/p>\n\u003cblockquote>\n\u003cp>millions of similarly small decisions create an excess\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾把个人小决定聚合为大量过剩。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>低价和上新促成替换 → 穿用时间短、废弃流增加 → 捐赠不能完全抵消资源消耗 → 无数小单累积系统性过剩。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>G\u003c/code>的\u003ccode>cheap purchases\u003c/code>对应小额购买，\u003ccode>expensive waste\u003c/code>不是说垃圾售价高，而是被消耗的资源和系统处理负担，覆盖从购买到废弃的变化。\u003c/p>\n\u003cp>\u003ccode>E\u003c/code>同样谈成本，但重点在制造这件衣服所用的劳动资源；本段首句已经向离店后的替换和过剩推进。用\u003ccode>E\u003c/code>会丢掉新增的消费阶段。\u003c/p>\n\u003cp>\u003cstrong>最终答案：43 G。\u003c/strong>\u003c/p>\n"},{"title":"小标题题 44","raw":"## 小标题题 44\n\n**A. Why a personal alternative is hard to reproduce**\n\n个人替代办法为何难以复制\n\n肯定个人制衣范例的意义，随后说明技能和时间条件阻止它迅速成为普遍方案。\n\n### 关键证据\n\n> make one’s own clothes and keep them for a long time\n\n先给出具体替代行为，不是抽象劝人节约。\n\n> not created by a weekend resolution\n\n转折否定凭短暂决心即可获得手艺。\n\n> conceal the conditions that made that life possible\n\n结尾警告把个案普遍化会遮蔽其成立条件。\n\n### 段内推进\n\n自己制作并长期使用 → 看见材料和耐用价值 → 手艺需多年、时间有竞争 → 例子可启发但难即时复制。\n\n### 标题对应与干扰项比对\n\n`A`的`personal alternative`指自己做衣服，`hard to reproduce`由`decades of practice`和时间冲突共同支持，保留肯定与限制。\n\n`F`也说`personal solution`，却把结论变成`everyone can quickly copy`。周末不能练成、数十年实践以及不可立即复制，连续三处都与`quickly`和`everyone`冲突。\n\n**最终答案：44 A。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"bird":4,"kind":"small-title-analysis","question":44,"answer":"A"},"html":"\u003cp>\u003cstrong>A. Why a personal alternative is hard to reproduce\u003c/strong>\u003c/p>\n\u003cp>个人替代办法为何难以复制\u003c/p>\n\u003cp>肯定个人制衣范例的意义，随后说明技能和时间条件阻止它迅速成为普遍方案。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>make one’s own clothes and keep them for a long time\u003c/p>\n\u003c/blockquote>\n\u003cp>先给出具体替代行为，不是抽象劝人节约。\u003c/p>\n\u003cblockquote>\n\u003cp>not created by a weekend resolution\u003c/p>\n\u003c/blockquote>\n\u003cp>转折否定凭短暂决心即可获得手艺。\u003c/p>\n\u003cblockquote>\n\u003cp>conceal the conditions that made that life possible\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾警告把个案普遍化会遮蔽其成立条件。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>自己制作并长期使用 → 看见材料和耐用价值 → 手艺需多年、时间有竞争 → 例子可启发但难即时复制。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>personal alternative\u003c/code>指自己做衣服，\u003ccode>hard to reproduce\u003c/code>由\u003ccode>decades of practice\u003c/code>和时间冲突共同支持，保留肯定与限制。\u003c/p>\n\u003cp>\u003ccode>F\u003c/code>也说\u003ccode>personal solution\u003c/code>，却把结论变成\u003ccode>everyone can quickly copy\u003c/code>。周末不能练成、数十年实践以及不可立即复制，连续三处都与\u003ccode>quickly\u003c/code>和\u003ccode>everyone\u003c/code>冲突。\u003c/p>\n\u003cp>\u003cstrong>最终答案：44 A。\u003c/strong>\u003c/p>\n"},{"title":"小标题题 45","raw":"## 小标题题 45\n\n**D. Lasting change under the pressure of consumer choices**\n\n消费者选择压力下的持久改变\n\n承认企业努力但指出单独不足，转向消费者选择及其价格和替代品条件。\n\n### 关键证据\n\n> these efforts should not be dismissed\n\n明确不是否定企业已做的一切。\n\n> a greener product line does not automatically weaken a business model\n\n把单项绿色产品与高频销售的结构区分开。\n\n> Prices, the quality of available alternatives and the cost of continuing wasteful habits\n\n说明消费改变受具体经济条件制约，不只靠道德倡议。\n\n### 段内推进\n\n企业改善部分做法 → 绿色单品未改高频销售 → 顾客要重视长期使用 → 新鲜感与低价仍有诱惑 → 经济条件支持更持久的选择。\n\n### 标题对应与干扰项比对\n\n`D`的`Lasting change`对应`durable improvement`，`consumer choices`对应最后要求顾客决定支持改变；压力既来自价格，也来自继续浪费的代价。\n\n`F`提出人人迅速复制个人方案，但本段没有把制衣手艺普及当解法，而是讨论选择环境和经济激励。即使都涉及个人，作用层面也不同。\n\n**最终答案：45 D。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"bird":4,"kind":"small-title-analysis","question":45,"answer":"D"},"html":"\u003cp>\u003cstrong>D. Lasting change under the pressure of consumer choices\u003c/strong>\u003c/p>\n\u003cp>消费者选择压力下的持久改变\u003c/p>\n\u003cp>承认企业努力但指出单独不足，转向消费者选择及其价格和替代品条件。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>these efforts should not be dismissed\u003c/p>\n\u003c/blockquote>\n\u003cp>明确不是否定企业已做的一切。\u003c/p>\n\u003cblockquote>\n\u003cp>a greener product line does not automatically weaken a business model\u003c/p>\n\u003c/blockquote>\n\u003cp>把单项绿色产品与高频销售的结构区分开。\u003c/p>\n\u003cblockquote>\n\u003cp>Prices, the quality of available alternatives and the cost of continuing wasteful habits\u003c/p>\n\u003c/blockquote>\n\u003cp>说明消费改变受具体经济条件制约，不只靠道德倡议。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>企业改善部分做法 → 绿色单品未改高频销售 → 顾客要重视长期使用 → 新鲜感与低价仍有诱惑 → 经济条件支持更持久的选择。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>Lasting change\u003c/code>对应\u003ccode>durable improvement\u003c/code>，\u003ccode>consumer choices\u003c/code>对应最后要求顾客决定支持改变；压力既来自价格，也来自继续浪费的代价。\u003c/p>\n\u003cp>\u003ccode>F\u003c/code>提出人人迅速复制个人方案，但本段没有把制衣手艺普及当解法，而是讨论选择环境和经济激励。即使都涉及个人，作用层面也不同。\u003c/p>\n\u003cp>\u003cstrong>最终答案：45 D。\u003c/strong>\u003c/p>\n"},{"title":"排序题 · 完整题面与全局解析","raw":"### 排序题\n\n**训练用改编文本，不是外刊原文。**\n\nArrange paragraphs A–H into a coherent text. A, E and H are already in position.\n\n**A → 41 → 42 → E → 43 → 44 → 45 → H**\n\n#### [A]\n\nFashion used to be described as a slow journey from the runway to the bargain shop. In that account, the ordinary customer received a cheaper version of a style long after designers had introduced it. The account is now incomplete. To see why, we must first examine how technology changed the speed at which retailers could respond to demand.\n\n#### [B]\n\nThose choices were shaped by more than awareness of environmental harm. Novelty remained attractive, cheap purchases felt easy, and alternatives could demand extra time or money. Expecting everyone to ignore these pressures was unrealistic. Lasting change required economic conditions that made longer use a practical choice, not merely a statement of good intentions.\n\n#### [C]\n\nPart of that production bill was paid far from the checkout. Large orders put pressure on low-paid workers and required substantial natural resources and chemical processing. A cheap price could therefore coexist with costly consequences elsewhere. Nor did those consequences finish at the factory gate. To follow the next part of the bill, we must look at what shoppers did with the clothes.\n\n#### [D]\n\nSeveral companies had already begun such changes through improved materials and greener product lines. These initiatives could reduce particular harms, yet they left a harder question unanswered: would customers buy fewer items or simply buy more products carrying reassuring labels? Corporate action alone could not determine that response. The durability of reform therefore depended on the choices made by shoppers.\n\n#### [E]\n\nOnce in customers’ wardrobes, the garments could be replaced long before their usefulness was exhausted. Frequent buying created a stream of unwanted clothing, and donation could not undo all the resources already consumed. This waste made an individual alternative look attractive: making fewer clothes personally and using them for much longer. One accomplished home dressmaker might seem to show the way.\n\n#### [F]\n\nThose technological changes allowed retailers to track sales and organise production more rapidly. Instead of waiting for a new season, they could bring new items into shops frequently. Customers were encouraged to return just as often. A shop visit could now promise something new even when the customer’s existing clothes remained perfectly usable. Low prices helped keep this loop moving, but they also raised a question that speed alone could not answer: who paid for making so many cheap garments?\n\n#### [G]\n\nThat dressmaker’s achievement, however, rested on years of learning. Her garments demonstrated care and durability, but the skills could not be reproduced by a shopper deciding to change overnight. The example offered inspiration rather than an immediately universal solution. If personal craft was difficult to scale, the next place to look was the companies capable of changing production on a much larger scale.\n\n#### [H]\n\nThe criticism of fast fashion thus reaches beyond any single shop or shopper. Rapid production, hidden costs and repeated replacement form a connected system. Better corporate practices matter, but so do the conditions under which consumers decide whether to buy again. The challenge is to interrupt that system without pretending that either a green label or an exceptional individual can do all the work.\n\n### 全局解析\n\n| 段落 | 在全文中的作用 |\n| --- | --- |\n| A | 提出旧下传图景，转问技术改变 |\n| B | 解释选择的经济和行为条件 |\n| C | 回答生产代价，再转消费者使用 |\n| D | 承认企业行动，提出消费者回应问题 |\n| E | 消费浪费引出个人制衣替代 |\n| F | 解释技术加速循环，提出生产成本归属 |\n| G | 限制个体范例，转向规模化企业行动 |\n| H | 并收生产、消费与改变条件 |\n\n全文推进：\n\n提出旧下传图景，转问技术改变 → 解释技术加速循环，提出生产成本归属 → 回答生产代价，再转消费者使用 → 消费浪费引出个人制衣替代 → 限制个体范例，转向规模化企业行动 → 承认企业行动，提出消费者回应问题 → 解释选择的经济和行为条件 → 并收生产、消费与改变条件\n\n**完整顺序：A—F—C—E—G—D—B—H。**\n\n**41—45：F、C、G、D、B。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"bird":4,"kind":"sorting-overview"},"html":"\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>训练用改编文本，不是外刊原文。\u003c/strong>\u003c/p>\n\u003cp>Arrange paragraphs A–H into a coherent text. A, E and H are already in position.\u003c/p>\n\u003cp>\u003cstrong>A → 41 → 42 → E → 43 → 44 → 45 → H\u003c/strong>\u003c/p>\n\u003ch4>[A]\u003c/h4>\n\u003cp>Fashion used to be described as a slow journey from the runway to the bargain shop. In that account, the ordinary customer received a cheaper version of a style long after designers had introduced it. The account is now incomplete. To see why, we must first examine how technology changed the speed at which retailers could respond to demand.\u003c/p>\n\u003ch4>[B]\u003c/h4>\n\u003cp>Those choices were shaped by more than awareness of environmental harm. Novelty remained attractive, cheap purchases felt easy, and alternatives could demand extra time or money. Expecting everyone to ignore these pressures was unrealistic. Lasting change required economic conditions that made longer use a practical choice, not merely a statement of good intentions.\u003c/p>\n\u003ch4>[C]\u003c/h4>\n\u003cp>Part of that production bill was paid far from the checkout. Large orders put pressure on low-paid workers and required substantial natural resources and chemical processing. A cheap price could therefore coexist with costly consequences elsewhere. Nor did those consequences finish at the factory gate. To follow the next part of the bill, we must look at what shoppers did with the clothes.\u003c/p>\n\u003ch4>[D]\u003c/h4>\n\u003cp>Several companies had already begun such changes through improved materials and greener product lines. These initiatives could reduce particular harms, yet they left a harder question unanswered: would customers buy fewer items or simply buy more products carrying reassuring labels? Corporate action alone could not determine that response. The durability of reform therefore depended on the choices made by shoppers.\u003c/p>\n\u003ch4>[E]\u003c/h4>\n\u003cp>Once in customers’ wardrobes, the garments could be replaced long before their usefulness was exhausted. Frequent buying created a stream of unwanted clothing, and donation could not undo all the resources already consumed. This waste made an individual alternative look attractive: making fewer clothes personally and using them for much longer. One accomplished home dressmaker might seem to show the way.\u003c/p>\n\u003ch4>[F]\u003c/h4>\n\u003cp>Those technological changes allowed retailers to track sales and organise production more rapidly. Instead of waiting for a new season, they could bring new items into shops frequently. Customers were encouraged to return just as often. A shop visit could now promise something new even when the customer’s existing clothes remained perfectly usable. Low prices helped keep this loop moving, but they also raised a question that speed alone could not answer: who paid for making so many cheap garments?\u003c/p>\n\u003ch4>[G]\u003c/h4>\n\u003cp>That dressmaker’s achievement, however, rested on years of learning. Her garments demonstrated care and durability, but the skills could not be reproduced by a shopper deciding to change overnight. The example offered inspiration rather than an immediately universal solution. If personal craft was difficult to scale, the next place to look was the companies capable of changing production on a much larger scale.\u003c/p>\n\u003ch4>[H]\u003c/h4>\n\u003cp>The criticism of fast fashion thus reaches beyond any single shop or shopper. Rapid production, hidden costs and repeated replacement form a connected system. Better corporate practices matter, but so do the conditions under which consumers decide whether to buy again. The challenge is to interrupt that system without pretending that either a green label or an exceptional individual can do all the work.\u003c/p>\n\u003ch3>全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>在全文中的作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出旧下传图景，转问技术改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>解释选择的经济和行为条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>回答生产代价，再转消费者使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>承认企业行动，提出消费者回应问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>消费浪费引出个人制衣替代\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>解释技术加速循环，提出生产成本归属\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>限制个体范例，转向规模化企业行动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>并收生产、消费与改变条件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cp>提出旧下传图景，转问技术改变 → 解释技术加速循环，提出生产成本归属 → 回答生产代价，再转消费者使用 → 消费浪费引出个人制衣替代 → 限制个体范例，转向规模化企业行动 → 承认企业行动，提出消费者回应问题 → 解释选择的经济和行为条件 → 并收生产、消费与改变条件\u003c/p>\n\u003cp>\u003cstrong>完整顺序：A—F—C—E—G—D—B—H。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>41—45：F、C、G、D、B。\u003c/strong>\u003c/p>\n"},{"title":"排序题 41","raw":"## 排序题 41\n\n这是全文第2个位置。先承接前段A，再接后段C；与相邻待排段构成的组合还要同时满足前后两侧证据。\n\n### 前后衔接的关键证据\n\n前段A末尾：\n\n> how technology changed the speed\n\n候选段F开头：\n\n> Those technological changes\n\n候选段F末尾：\n\n> who paid for making so many cheap garments?\n\n后段C开头：\n\n> Part of that production bill\n\n### 为什么能接起来\n\n`A`以技术怎样改变速度设问，`F`的`Those technological changes`接着解释追踪销售、快速生产和上新，然后问低价生产账单由谁支付；`C`再给出工人和资源的答案。\n\n局部推进：提出旧下传图景，转问技术改变 → 解释技术加速循环，提出生产成本归属 → 回答生产代价，再转消费者使用。\n\n### 最强候选比对\n\nB段的开头是：\n\n> Those choices\n\n`B`的选择指消费者如何回应改革，`A`尚未提出这类选择；它也无法为`C`的`production bill`提供前件。\n\n**最终答案：41 F。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"bird":4,"kind":"sorting-analysis","question":41,"answer":"F"},"html":"\u003cp>这是全文第2个位置。先承接前段A，再接后段C；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段A末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>how technology changed the speed\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段F开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those technological changes\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段F末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>who paid for making so many cheap garments?\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Part of that production bill\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>A\u003c/code>以技术怎样改变速度设问，\u003ccode>F\u003c/code>的\u003ccode>Those technological changes\u003c/code>接着解释追踪销售、快速生产和上新，然后问低价生产账单由谁支付；\u003ccode>C\u003c/code>再给出工人和资源的答案。\u003c/p>\n\u003cp>局部推进：提出旧下传图景，转问技术改变 → 解释技术加速循环，提出生产成本归属 → 回答生产代价，再转消费者使用。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>B段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those choices\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>的选择指消费者如何回应改革，\u003ccode>A\u003c/code>尚未提出这类选择；它也无法为\u003ccode>C\u003c/code>的\u003ccode>production bill\u003c/code>提供前件。\u003c/p>\n\u003cp>\u003cstrong>最终答案：41 F。\u003c/strong>\u003c/p>\n"},{"title":"排序题 42","raw":"## 排序题 42\n\n这是全文第3个位置。先承接前段F，再接后段E；后面的E是题面已给定的固定位置。\n\n### 前后衔接的关键证据\n\n前段F末尾：\n\n> who paid for making so many cheap garments?\n\n候选段C开头：\n\n> Part of that production bill\n\n候选段C末尾：\n\n> what shoppers did with the clothes.\n\n后段E开头：\n\n> Once in customers’ wardrobes\n\n### 为什么能接起来\n\n`C`先回答`F`的生产成本归属，再通过`factory gate`把追查转向离厂之后的使用；`E`从衣柜里的提前替换接续，完成生产端到消费端的换题。\n\n局部推进：解释技术加速循环，提出生产成本归属 → 回答生产代价，再转消费者使用 → 消费浪费引出个人制衣替代。\n\n### 最强候选比对\n\nD段的开头是：\n\n> such changes\n\n`D`需要已提出的大规模企业改进，`F`只谈生产速度，尚未讨论这些减害措施，且无法顺接`E`的衣柜使用。\n\n**最终答案：42 C。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"bird":4,"kind":"sorting-analysis","question":42,"answer":"C"},"html":"\u003cp>这是全文第3个位置。先承接前段F，再接后段E；后面的E是题面已给定的固定位置。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段F末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>who paid for making so many cheap garments?\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段C开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Part of that production bill\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段C末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>what shoppers did with the clothes.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Once in customers’ wardrobes\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>C\u003c/code>先回答\u003ccode>F\u003c/code>的生产成本归属，再通过\u003ccode>factory gate\u003c/code>把追查转向离厂之后的使用；\u003ccode>E\u003c/code>从衣柜里的提前替换接续，完成生产端到消费端的换题。\u003c/p>\n\u003cp>局部推进：解释技术加速循环，提出生产成本归属 → 回答生产代价，再转消费者使用 → 消费浪费引出个人制衣替代。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>D段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>such changes\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>需要已提出的大规模企业改进，\u003ccode>F\u003c/code>只谈生产速度，尚未讨论这些减害措施，且无法顺接\u003ccode>E\u003c/code>的衣柜使用。\u003c/p>\n\u003cp>\u003cstrong>最终答案：42 C。\u003c/strong>\u003c/p>\n"},{"title":"排序题 43","raw":"## 排序题 43\n\n这是全文第5个位置。先承接前段E，再接后段D；与相邻待排段构成的组合还要同时满足前后两侧证据。\n\n### 前后衔接的关键证据\n\n前段E末尾：\n\n> One accomplished home dressmaker might seem to show the way.\n\n候选段G开头：\n\n> That dressmaker’s achievement, however,\n\n候选段G末尾：\n\n> companies capable of changing production on a much larger scale.\n\n后段D开头：\n\n> Several companies had already begun such changes\n\n### 为什么能接起来\n\n`G`的`That dressmaker`唯一回指`E`引出的手艺人，`however`把可行范例转为复制限制。末尾转向能规模化改进的企业，`D`的`such changes`因此有具体所指。\n\n局部推进：消费浪费引出个人制衣替代 → 限制个体范例，转向规模化企业行动 → 承认企业行动，提出消费者回应问题。\n\n### 最强候选比对\n\nB段的开头是：\n\n> Those choices\n\n`B`开头需要消费者面对改革的选择，而`E`只提出一位制衣者；直接进入价格制约会漏掉个案为何不能普及，也让`D`的企业变化无承接。\n\n**最终答案：43 G。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"bird":4,"kind":"sorting-analysis","question":43,"answer":"G"},"html":"\u003cp>这是全文第5个位置。先承接前段E，再接后段D；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段E末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>One accomplished home dressmaker might seem to show the way.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段G开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That dressmaker’s achievement, however,\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段G末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>companies capable of changing production on a much larger scale.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Several companies had already begun such changes\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>G\u003c/code>的\u003ccode>That dressmaker\u003c/code>唯一回指\u003ccode>E\u003c/code>引出的手艺人，\u003ccode>however\u003c/code>把可行范例转为复制限制。末尾转向能规模化改进的企业，\u003ccode>D\u003c/code>的\u003ccode>such changes\u003c/code>因此有具体所指。\u003c/p>\n\u003cp>局部推进：消费浪费引出个人制衣替代 → 限制个体范例，转向规模化企业行动 → 承认企业行动，提出消费者回应问题。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>B段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those choices\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>开头需要消费者面对改革的选择，而\u003ccode>E\u003c/code>只提出一位制衣者；直接进入价格制约会漏掉个案为何不能普及，也让\u003ccode>D\u003c/code>的企业变化无承接。\u003c/p>\n\u003cp>\u003cstrong>最终答案：43 G。\u003c/strong>\u003c/p>\n"},{"title":"排序题 44","raw":"## 排序题 44\n\n这是全文第6个位置。先承接前段G，再接后段B；与相邻待排段构成的组合还要同时满足前后两侧证据。\n\n### 前后衔接的关键证据\n\n前段G末尾：\n\n> companies capable of changing production on a much larger scale.\n\n候选段D开头：\n\n> Several companies had already begun such changes\n\n候选段D末尾：\n\n> the choices made by shoppers.\n\n后段B开头：\n\n> Those choices\n\n### 为什么能接起来\n\n`D`承接`G`转向企业，先说改进材料和绿色系列，再追问消费者究竟少买还是买更多绿色标牌产品；其末尾`choices`正由`B`展开经济条件。\n\n局部推进：限制个体范例，转向规模化企业行动 → 承认企业行动，提出消费者回应问题 → 解释选择的经济和行为条件。\n\n### 最强候选比对\n\nC段的开头是：\n\n> Part of that production bill\n\n`C`回到生产损害的形成，无法回答`G`提出的企业改进，也不能给后段`Those choices`提供两种消费回应。\n\n**最终答案：44 D。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"bird":4,"kind":"sorting-analysis","question":44,"answer":"D"},"html":"\u003cp>这是全文第6个位置。先承接前段G，再接后段B；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段G末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>companies capable of changing production on a much larger scale.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段D开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Several companies had already begun such changes\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段D末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the choices made by shoppers.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those choices\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>D\u003c/code>承接\u003ccode>G\u003c/code>转向企业，先说改进材料和绿色系列，再追问消费者究竟少买还是买更多绿色标牌产品；其末尾\u003ccode>choices\u003c/code>正由\u003ccode>B\u003c/code>展开经济条件。\u003c/p>\n\u003cp>局部推进：限制个体范例，转向规模化企业行动 → 承认企业行动，提出消费者回应问题 → 解释选择的经济和行为条件。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>C段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Part of that production bill\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>C\u003c/code>回到生产损害的形成，无法回答\u003ccode>G\u003c/code>提出的企业改进，也不能给后段\u003ccode>Those choices\u003c/code>提供两种消费回应。\u003c/p>\n\u003cp>\u003cstrong>最终答案：44 D。\u003c/strong>\u003c/p>\n"},{"title":"排序题 45","raw":"## 排序题 45\n\n这是全文第7个位置。先承接前段D，再接后段H；后面的H是题面已给定的固定结尾。\n\n### 前后衔接的关键证据\n\n前段D末尾：\n\n> the choices made by shoppers.\n\n候选段B开头：\n\n> Those choices\n\n候选段B末尾：\n\n> a practical choice, not merely a statement of good intentions.\n\n后段H开头：\n\n> The criticism of fast fashion thus reaches beyond any single shop or shopper.\n\n### 为什么能接起来\n\n`B`把`D`留下的消费者回应问题具体化为新鲜感、价格和替代成本，再说明长期使用需要经济支持。`H`才能将企业与顾客都放进同一系统作总结。\n\n局部推进：承认企业行动，提出消费者回应问题 → 解释选择的经济和行为条件 → 并收生产、消费与改变条件。\n\n### 最强候选比对\n\nG段的开头是：\n\n> That dressmaker’s achievement\n\n`G`要求前面紧邻个人制衣者，而`D`正在讨论企业与消费者回应；放此处会倒退个案，留下经济条件未解。\n\n**最终答案：45 B。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"bird":4,"kind":"sorting-analysis","question":45,"answer":"B"},"html":"\u003cp>这是全文第7个位置。先承接前段D，再接后段H；后面的H是题面已给定的固定结尾。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段D末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the choices made by shoppers.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段B开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those choices\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段B末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>a practical choice, not merely a statement of good intentions.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The criticism of fast fashion thus reaches beyond any single shop or shopper.\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>B\u003c/code>把\u003ccode>D\u003c/code>留下的消费者回应问题具体化为新鲜感、价格和替代成本，再说明长期使用需要经济支持。\u003ccode>H\u003c/code>才能将企业与顾客都放进同一系统作总结。\u003c/p>\n\u003cp>局部推进：承认企业行动，提出消费者回应问题 → 解释选择的经济和行为条件 → 并收生产、消费与改变条件。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>G段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That dressmaker’s achievement\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>G\u003c/code>要求前面紧邻个人制衣者，而\u003ccode>D\u003c/code>正在讨论企业与消费者回应；放此处会倒退个案，留下经济条件未解。\u003c/p>\n\u003cp>\u003cstrong>最终答案：45 B。\u003c/strong>\u003c/p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **rational consumption** | **理性消费** | **社会现象类·社会生活** | **个人主题** |\n| frugality | 勤俭节约 | 人生哲理类 | 个人主题 |\n| independent thinking | 独立思考 | 人生哲理类 | 个人主题 |\n| **environmental protection** | **环境保护** | **社会现象类·社会生活** | **宏观主题** |\n| resources conservation | 资源节约 | 环境保护类 | 宏观主题 |\n| a sense of responsibility | 责任感 | 人生哲理类 | 个人主题 |\n| **craftsmanship** | **工匠精神** | **人生哲理类** | **个人主题** |\n| sustainable lifestyles | 可持续生活方式 | 社会现象类·社会生活 | 宏观主题 |\n| consumer awareness of product quality | 消费者的产品质量意识 | 经济消费类 | 宏观主题 |","section":"第五鸟 · 写作积累","level":2,"context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{"bird":5,"kind":"writing-table"},"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>rational consumption\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>理性消费\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类·社会生活\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>frugality\u003c/td>\n\u003ctd>勤俭节约\u003c/td>\n\u003ctd>人生哲 **The passage argues that lasting change depends on A.** | **短文认为持久改变有赖于A。** |\n| 文本评论题 | Though A has made efforts to curb B, C remains a concern. | 尽管A已努力抑制B，C仍是值得关注的问题。 |\n| 文本评论题 | The discussion links excessive consumption with A and B. | 讨论将过度消费与A、B联系起来。 |","section":"第五鸟 · 写作积累","level":2,"context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{"bird":5,"kind":"writing-table"},"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>In the picture, A encourages B to see C as disposable.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图中，A促使B把C当作一次性用品。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene contrasts A’s ideal with the reality of B.\u003c/td>\n\u003ctd>画面将A的理想与B的现实形成对比。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The consequences shown in the picture are not limited to A.\u003c/td>\n\u003ctd>图中展示的后果并不限于A。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart shows that consumers buy roughly A items a year.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表显示消费者每年大约购买A件商品。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>More frequent purchases have accompanied an increase in A.\u003c/td>\n\u003ctd>购买更加频繁的同时，A也有所增加。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figure amounts to about A items per person.\u003c/td>\n\u003ctd>该数值相当于人均约A件。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage argues that lasting change depends on A.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文认为持久改变有赖于A。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>Though A has made efforts to curb B, C remains a concern.\u003c/td>\n\u003ctd>尽管A已努力抑制B，C仍是值得关注的问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion links excessive consumption with A and B.\u003c/td>\n\u003ctd>讨论将过度消费与A、B联系起来。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003ch2>小标题题\u003c/h2>\u003cp>训练用改编文本，不是外刊原文。\u003c/p>\u003cp>Choose the most suitable heading. Two headings are extra.\u003c/p>\u003cp>\u003cstrong>A.\u003c/strong> Why a personal alternative is hard to reproduce\u003c/p>\u003cp>\u003cstrong>B.\u003c/strong> From a seasonal trickle to a rapid commercial cycle\u003c/p>\u003cp>\u003cstrong>C.\u003c/strong> A bargain for everyone in the supply chain\u003c/p>\u003cp>\u003cstrong>D.\u003c/strong> Lasting change under the pressure of consumer choices\u003c/p>\u003cp>\u003cstrong>E.\u003c/strong> The hidden production costs of a cheap garment\u003c/p>\u003cp>\u003cstrong>F.\u003c/strong> A personal solution that everyone can quickly copy\u003c/p>\u003cp>\u003cstrong>G.\u003c/strong> When cheap purchases become expensive waste\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41. ______\u003c/h3>\u003cp>The familiar story of fashion begins on a designer’s runway and ends, much later, in an ordinary shopper’s wardrobe. It imagines a slow movement from an expensive original towards cheaper versions. Fast fashion changes the speed and organisation of that journey. Retailers use information and rapid production to follow demand, release new products frequently and encourage customers to return before a season has ended. A low price makes each purchase seem unimportant; repeated novelty makes not purchasing feel like missing out. The central change is therefore more than the availability of inexpensive clothes. It is a commercial cycle that repeatedly turns a current desire into the need for another visit.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42. ______\u003c/h3>\u003cp>The price on a skirt is not a complete account of the resources needed to make it. When a retailer offers the same low-priced item through a large network of stores, production must meet both the price and the volume. That demand can place pressure on workers’ wages, on supplies of water and other natural resources, and on the handling of chemicals. None of these pressures appears as a separate line on the customer’s receipt. The shopper can therefore experience a bargain while someone elsewhere carries a cost. To assess cheap clothing, the calculation must travel backwards from the shop to the conditions of production.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43. ______\u003c/h3>\u003cp>The costs do not end when a garment leaves the shop. If low prices and constant arrivals encourage customers to replace usable clothes, a small bill can produce a large stream of unwanted material. A wardrobe full of items worn only briefly is evidence of throughput, not necessarily of a need being met. Donation can be useful, but giving clothing away does not recover every resource already used to make it or guarantee that another person will wear it. The relevant question is not merely whether a buyer can afford one more item. It is what happens when millions of similarly small decisions create an excess that the whole system must absorb.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44. ______\u003c/h3>\u003cp>One striking response is to make one’s own clothes and keep them for a long time. Such work can restore attention to materials, fit and durability, qualities that disappear when clothing is treated as an endlessly replaceable product. Yet an accomplished maker is not created by a weekend resolution. The skills behind a well-made wardrobe may represent decades of practice, and the time required competes with other responsibilities. The example is valuable because it reveals another relationship with clothes, not because every shopper can reproduce it immediately. Turning an admirable life into a universal prescription would conceal the conditions that made that life possible.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45. ______\u003c/h3>\u003cp>Companies can change materials and reduce some harmful practices, and these efforts should not be dismissed. Nevertheless, a greener product line does not automatically weaken a business model built on selling more items more often. Lasting change also requires customers to value longer use rather than constant replacement. That is a demanding expectation when novelty remains attractive and another purchase feels cheap. Moral appeals alone cannot remove those incentives. Prices, the quality of available alternatives and the cost of continuing wasteful habits all shape what shoppers can choose. A durable improvement will require consumer decisions to support the changes that isolated corporate initiatives cannot deliver by themselves.\u003c/p>\u003c/section>","sorting":"\u003ch2>排序题\u003c/h2>\u003cp>训练用改编文本，不是外刊原文。\u003c/p>\u003cp>A → 41 → 42 → E → 43 → 44 → 45 → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>[A]\u003c/h3>\u003cp>Fashion used to be described as a slow journey from the runway to the bargain shop. In that account, the ordinary customer received a cheaper version of a style long after designers had introduced it. The account is now incomplete. To see why, we must first examine how technology changed the speed at which retailers could respond to demand.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>[B]\u003c/h3>\u003cp>Those choices were shaped by more than awareness of environmental harm. Novelty remained attractive, cheap purchases felt easy, and alternatives could demand extra time or money. Expecting everyone to ignore these pressures was unrealistic. Lasting change required economic conditions that made longer use a practical choice, not merely a statement of good intentions.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>[C]\u003c/h3>\u003cp>Part of that production bill was paid far from the checkout. Large orders put pressure on low-paid workers and required substantial natural resources and chemical processing. A cheap price could therefore coexist with costly consequences elsewhere. Nor did those consequences finish at the factory gate. To follow the next part of the bill, we must look at what shoppers did with the clothes.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>[D]\u003c/h3>\u003cp>Several companies had already begun such changes through improved materials and greener product lines. These initiatives could reduce particular harms, yet they left a harder question unanswered: would customers buy fewer items or simply buy more products carrying reassuring labels? Corporate action alone could not determine that response. The durability of reform therefore depended on the choices made by shoppers.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>[E]\u003c/h3>\u003cp>Once in customers’ wardrobes, the garments could be replaced long before their usefulness was exhausted. Frequent buying created a stream of unwanted clothing, and donation could not undo all the resources already consumed. This waste made an individual alternative look attractive: making fewer clothes personally and using them for much longer. One accomplished home dressmaker might seem to show the way.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>[F]\u003c/h3>\u003cp>Those technological changes allowed retailers to track sales and organise production more rapidly. Instead of waiting for a new season, they could bring new items into shops frequently. Customers were encouraged to return just as often. A shop visit could now promise something new even when the customer’s existing clothes remained perfectly usable. Low prices helped keep this loop moving, but they also raised a question that speed alone could not answer: who paid for making so many cheap garments?\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>[G]\u003c/h3>\u003cp>That dressmaker’s achievement, however, rested on years of learning. Her garments demonstrated care and durability, but the skills could not be reproduced by a shopper deciding to change overnight. The example offered inspiration rather than an immediately universal solution. If personal craft was difficult to scale, the next place to look was the companies capable of changing production on a much larger scale.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>[H]\u003c/h3>\u003cp>The criticism of fast fashion thus reaches beyond any single shop or shopper. Rapid production, hidden costs and repeated replacement form a connected system. Better corporate practices matter, but so do the conditions under which consumers decide whether to buy again. The challenge is to interrupt that system without pretending that either a green label or an exceptional individual can do all the work.\u003c/p>\u003c/section>"};
const FULL = "\u003ch1>0.阅前须知\u003c/h1>\n\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文词汇与译文标注长图\">\u003c/p>\n\u003ch1>第1段\u003c/h1>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u00 抑制\u003c/td>\n\u003ctd>impact\u003c/td>\n\u003ctd>n.影响\u003c/td>\n\u003ctd>environment\u003c/td>\n\u003ctd>n.环境\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>including\u003c/td>\n\u003ctd>prep.包括\u003c/td>\n\u003ctd>lasting change\u003c/td>\n\u003ctd>n.持久改变\u003c/td>\n\u003ctd>effect\u003c/td>\n\u003ctd>v.实现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>customer\u003c/td>\n\u003ctd>n.顾客\u003c/td>\n\u003ctd>exhibit\u003c/td>\n\u003ctd>v.表现出\u003c/td>\n\u003ctd>idealism\u003c/td>\n\u003ctd>n.理想主义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>advocate\u003c/td>\n\u003ctd>n.倡导者\u003c/td>\n\u003ctd>sustainability\u003c/td>\n\u003ctd>n.可持续性\u003c/td>\n\u003ctd>vanity\u003c/td>\n\u003ctd>n.虚荣\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>constant\u003c/td>\n\u003ctd>n.不变的因素\u003c/td>\n\u003ctd>sustainably\u003c/td>\n\u003ctd>adv.以可持续方式\u003c/td>\n\u003ctd>afford\u003c/td>\n\u003ctd>v.承担得起\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>In the 2006 film version of \u003cem>The Devil Wears Prada\u003c/em>, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>In the 2006 film version / of The Devil Wears Prada, / Miranda Priestly, / played by Meryl Streep, / scolds her unattractive assistant / for imagining / that high fashion / doesn&#39;t affect her.\u003c/p>\n\u003cp>Priestly explains / how the deep blue color / of the assistant&#39;s sweater / descended over the years / from fashion shows / to department stores / and to the bargain bin / in which the poor girl / doubtless found her garment.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>在2006年电影版本中 / 《穿普拉达的女魔头》的，/ 米兰达·普里斯特利，/ 由梅丽尔·斯特里普扮演，/ 斥责她不起眼的助理 / 因为想象 / 高级时装 / 不会影响她。\u003c/p>\n\u003cp>普里斯特利解释 / 深蓝色是如何 / 助理毛衣的 / 经过多年下降 / 从时装秀 / 到百货商店 / 再到廉价货架 / 在那里这个可怜的女孩 / 无疑找到了她的衣服。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>在2006年电影版《穿普拉达的女魔头》中，梅丽尔·斯特里普饰演的米兰达·普里斯特利斥责她那位不起眼的助理，因为助理以为高级时装与自己无关。普里斯特利解释了助理毛衣的深蓝色是如何经过多年从时装秀流传到百货商店，最终到达这个可怜女孩无疑找到她衣服的廉价货架。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in \u003cem>Overdressed\u003c/em>, Elizabeth Cline’s three-year \u003cu>indictment\u003c/u> of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqloto react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>This top-down conception / of the fashion business / couldn&#39;t be more out of date / or at odds with / the feverish world / described in Overdressed, / Elizabeth Cline&#39;s three-year indictment / of &quot;fast fashion&quot;.\u003c/p>\n\u003cp>In the last decade or so, / advances in technology / have allowed mass-market labels / such as Zara, H&amp;M, and Uniqlo / to react to trends / more quickly / and anticipate demand / more precisely.\u003c/p>\n\u003cp>Quicker turnarounds / mean less wasted inventory, / more frequent releases, / and more profit.\u003c/p>\n\u003cp>These labels / encourage style-conscious consumers / to see clothes as disposable – / meant to last / only a wash or two, / although they don&#39;t advertise that – / and to renew their wardrobe / every few weeks.\u003c/p>\n\u003cp>By offering on-trend items / at dirt-cheap prices, / Cline argues, / these brands have hijacked / fashion cycles, / shaking an industry / long accustomed to / a seasonal pace.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>这种自上而下的观念 / 对时尚产业的 / 再过时不过了 / 或者说格格不入 / 与狂热的世界 / 描述在《过度着装》中的，/ 伊丽莎白·克莱恩的三年控诉 / 对&quot;快时尚&quot;的。\u003c/p>\n\u003cp>在过去十年左右，/ 技术的进步 / 已经允许大众市场品牌 / 比如Zara、H&amp;M和优衣库 / 对潮流做出反应 / 更快速地 / 并预测需求 / 更精确地。\u003c/p>\n\u003cp>更快的周转 / 意味着更少的库存浪费，/ 更频繁的发布，/ 以及更多的利润。\u003c/p>\n\u003cp>这些品牌 / 鼓励注重时尚的消费者 / 把衣服视为一次性的 – / 意味着只能持续 / 一两次洗涤，/ 尽管他们不会宣传这一点 – / 并更新他们的衣柜 / 每隔几周。\u003c/p>\n\u003cp>通过提供潮流单品 / 以极其便宜的价格，/ 克莱恩认为，/ 这些品牌已经劫持了 / 时尚周期，/ 动摇了一个产业 / 长期习惯于 / 季节性节奏的。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>这种自上而下的时尚产业观念已经完全过时，与伊丽莎白·克莱恩在《过度着装》中描述的狂热世界格格不入——这是她对&quot;快时尚&quot;长达三年的控诉。在过去十年左右，技术进步使得Zara、H&amp;M和优衣库等大众市场品牌能够更快速地对潮流做出反应，更精确地预测需求。更快的周转意味着更少的库存浪费、更频繁的发布和更多的利润。这些品牌鼓励注重时尚的消费者把衣服视为一次性用品——尽管他们不会宣传这一点，但衣服只能经受一两次洗涤——并且每隔几周就更新衣柜。克莱恩认为，通过以极低价格提供潮流单品，这些品牌劫持了时尚周期，动摇了这个长期习惯于季节性节奏的产业。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>The victims of this revolution, / of course, / are not limited to designers.\u003c/p>\n\u003cp>For H&amp;M to offer / a $5.95 knit miniskirt / in all its 2,300-plus stores / around the world, / it must rely on / low-wage overseas labor, / order in volumes / that strain natural resources, / and use massive amounts / of harmful chemicals.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>这场革命的受害者，/ 当然，/ 不仅限于设计师。\u003c/p>\n\u003cp>为了H&amp;M能够提供 / 一条5.95美元的针织迷你裙 / 在其全部2300多家店铺中 / 遍布世界各地，/ 它必须依赖 / 低工资的海外劳工，/ 大量订购 / 给自然资源造成压力的，/ 并使用大量 / 有害化学物质。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>这场革命的受害者当然不仅限于设计师。为了让H&amp;M能在全球2300多家店铺中提供5.95美元的针织迷你裙，它必须依赖低工资的海外劳工，进行给自然资源造成压力的大量订购，并使用大量有害化学物质。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>_Overdressed _is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s \u003cem>The Omnivore’s Dilemma\u003c/em>. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Overdressed is / the fashion world&#39;s answer / to consumer-activist bestsellers / like Michael Pollan&#39;s The Omnivore&#39;s Dilemma.\u003c/p>\n\u003cp>&quot;Mass-produced clothing, / like fast food, / fills a hunger and need, / yet is non-durable and wasteful,&quot; / Cline argues.\u003c/p>\n\u003cp>Americans, / she finds, / buy roughly 20 billion garments a year – / about 64 items per person – / and no matter how much / they give away, / this excess / leads to waste.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>《过度着装》是 / 时尚界的回应 / 对消费者活动家畅销书 / 比如迈克尔·波伦的《杂食者的困境》。\u003c/p>\n\u003cp>&quot;大规模生产的服装，/ 就像快餐，/ 满足了饥饿和需求，/ 然而是不耐用和浪费的，&quot; / 克莱恩认为。\u003c/p>\n\u003cp>美国人，/ 她发现，/ 每年购买大约200亿件服装 – / 每人约64件 – / 无论他们捐赠多少，/ 这种过量 / 导致浪费。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>《过度着装》是时尚界对《杂食者的困境》等消费者活动家畅销书的回应。克莱恩认为：&quot;大规模生产的服装就像快餐，满足了饥饿和需求，却是不耐用和浪费的。&quot;她发现，美国人每年购买大约200亿件服装——每人约64件——无论他们捐赠多少，这种过量都会导致浪费。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>Towards the end of \u003cem>Overdressed\u003c/em>, Cline introduced her ideal, a Brooklyn woman named Sarah Kate Beaumont, who since 2008 has made all of her own clothes – and beautifully. But as Cline is the first to note, it took Beaumont decades to perfect her craft; her example can’t be knocked off.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>Towards the end of Overdressed, / Cline introduced her ideal, / a Brooklyn woman / named Sarah Kate Beaumont, / who since 2008 / has made all of her own clothes – / and beautifully.\u003c/p>\n\u003cp>But as Cline / is the first to note, / it took Beaumont / decades to perfect her craft; / her example / can&#39;t be knocked off.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>在《过度着装》的结尾，/ 克莱恩介绍了她的理想，/ 一位布鲁克林女性 / 名叫莎拉·凯特·博蒙特，/ 自2008年以来 / 一直自己制作所有衣服 – / 而且做得很漂亮。\u003c/p>\n\u003cp>但正如克莱恩 / 首先指出的，/ 博蒙特花了 / 几十年来完善她的手艺；/ 她的例子 / 不能被复制。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>在《过度着装》的结尾，克莱恩介绍了她的理想人物——一位名叫莎拉·凯特·博蒙特的布鲁克林女性，她自2008年以来一直自己制作所有衣服，而且做得很漂亮。但正如克莱恩首先指出的，博蒙特花了几十年来完善她的手艺；她的例子无法被复制。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment –  including H&amp;M, with its green Conscious Collection  line – Cline believes lasting change can only be effected by the customer. She exhibits the idealism common to many advocates of sustainability, be it in food or in energy. Vanity is a constant; people will only start shopping more sustainably when they can’t afford not to.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Though several fast-fashion companies / have made efforts / to curb their impact / on labor and the environment – / including H&amp;M, / with its green Conscious Collection line – / Cline believes / lasting change / can only be effected / by the customer.\u003c/p>\n\u003cp>She exhibits / the idealism / common to many advocates / of sustainability, / be it in food / or in energy.\u003c/p>\n\u003cp>Vanity is a constant; / people will only start / shopping more sustainably / when they can&#39;t afford / not to.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>尽管几家快时尚公司 / 已经做出努力 / 来抑制他们的影响 / 对劳工和环境 – / 包括H&amp;M，/ 凭借其绿色的Conscious Collection系列 – / 克莱恩相信 / 持久的改变 / 只能被实现 / 由消费者。\u003c/p>\n\u003cp>她展现出 / 理想主义 / 常见于许多倡导者 / 可持续发展的，/ 无论是在食品方面 / 还是在能源方面。\u003c/p>\n\u003cp>虚荣是恒定的；/ 人们只会开始 / 更可持续地购物 / 当他们负担不起 / 不这样做的时候。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>尽管几家快时尚公司已经努力减少对劳工和环境的影响——包括H&amp;M推出的绿色Conscious Collection系列——但克莱恩相信，持久的改变只能由消费者来实现。她展现出许多可持续发展倡导者共有的理想主义，无论是在食品还是能源领域。虚荣是恒定的；只有当人们负担不起不可持续消费时，他们才会开始更可持续地购物。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读）\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>英文句子逻辑\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>In the 2006 film version：(of The Devil Wears Prada) → Miranda Priestly：(played by Meryl Streep) → scolds her unattractive assistant：(for imagining：(that high fashion → doesn&#39;t affect her)).\u003c/p>\n\u003cp>Priestly explains：(how the deep blue color：(of the assistant&#39;s sweater) → descended over the years：(from fashion shows → to department stores → and to the bargain bin：(in which the poor girl → doubtless found her garment))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>This top-down conception：(of the fashion business) → couldn&#39;t be more out of date + at odds with：(the feverish world：(described in Overdressed：(Elizabeth Cline&#39;s three-year indictment：(of &quot;fast fashion&quot;)))).\u003c/p>\n\u003cp>In the last decade or so → advances in technology → have allowed mass-market labels：(such as Zara, H&amp;M, and Uniqlo) → to react to trends：(more quickly) + anticipate demand：(more precisely).\u003c/p>\n\u003cp>Quicker turnarounds → mean：(less wasted inventory + more frequent releases + more profit).\u003c/p>\n\u003cp>These labels → encourage style-conscious consumers → to see clothes as disposable：(meant to last：(only a wash or two)：(although they don&#39;t advertise that)) + to renew their wardrobe：(every few weeks).\u003c/p>\n\u003cp>By offering on-trend items：(at dirt-cheap prices) → Cline argues → these brands have hijacked：(fashion cycles) → shaking an industry：(long accustomed to：(a seasonal pace)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>The victims of this revolution → of course → are not limited to designers.\u003c/p>\n\u003cp>For H&amp;M to offer：(a $5.95 knit miniskirt：(in all its 2,300-plus stores：(around the world))) → it must rely on：(low-wage overseas labor) + order in volumes：(that strain natural resources) + use massive amounts：(of harmful chemicals).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Overdressed is → the fashion world&#39;s answer：(to consumer-activist bestsellers：(like Michael Pollan&#39;s The Omnivore&#39;s Dilemma)).\u003c/p>\n\u003cp>&quot;Mass-produced clothing：(like fast food) → fills a hunger and need // yet is non-durable and wasteful&quot; → Cline argues.\u003c/p>\n\u003cp>Americans → she finds → buy roughly 20 billion garments a year：(about 64 items per person) + no matter how much：(they give away) → this excess → leads to waste.\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Towards the end of Overdressed → Cline introduced her ideal：(a Brooklyn woman：(named Sarah Kate Beaumont)：(who since 2008 → has made all of her own clothes – and beautifully)).\u003c/p>\n\u003cp>But as Cline → is the first to note → it took Beaumont：(decades to perfect her craft); → her example → can&#39;t be knocked off.\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Though several fast-fashion companies → have made efforts → to curb their impact：(on labor and the environment) – including H&amp;M：(with its green Conscious Collection line) – // Cline believes → lasting change → can only be effected：(by the customer).\u003c/p>\n\u003cp>She exhibits → the idealism：(common to many advocates：(of sustainability))：(be it in food + or in energy).\u003c/p>\n\u003cp>Vanity is a constant; → people will only start → shopping more sustainably：(when they can&#39;t afford → not to).\u003c/p>\n\u003ch2>中文句子逻辑\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>在2006年电影版本中：(《穿普拉达的女魔头》的) → 米兰达·普里斯特利：(由梅丽尔·斯特里普扮演) → 斥责她不起眼的助理：(因为想象：(高级时装 → 不会影响她))。\u003c/p>\n\u003cp>普里斯特利解释：(深蓝色是如何：(助理毛衣的) → 经过多年下降：(从时装秀 → 到百货商店 → 再到廉价货架：(在那里这个可怜的女孩 → 无疑找到了她的衣服)))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>这种自上而下的观念：(对时尚产业的) → 再过时不过了 + 格格不入：(与狂热的世界：(描述在《过度着装》中的：(伊丽莎白·克莱恩的三年控诉：(对&quot;快时尚&quot;的))))。\u003c/p>\n\u003cp>在过去十年左右 → 技术的进步 → 已经允许大众市场品牌：(比如Zara、H&amp;M和优衣库) → 对潮流做出反应：(更快速地) + 预测需求：(更精确地)。\u003c/p>\n\u003cp>更快的周转 → 意味着：(更少的库存浪费 + 更频繁的发布 + 更多的利润)。\u003c/p>\n\u003cp>这些品牌 → 鼓励注重时尚的消费者 → 把衣服视为一次性的：(意味着只能持续：(一两次洗涤)：(尽管他们不会宣传这一点)) + 更新他们的衣柜：(每隔几周)。\u003c/p>\n\u003cp>通过提供潮流单品：(以极其便宜的价格) → 克莱恩认为 → 这些品牌已经劫持了：(时尚周期) → 动摇了一个产业：(长期习惯于：(季节性节奏的))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>这场革命的受害者 → 当然 → 不仅限于设计师。\u003c/p>\n\u003cp>为了H&amp;M能够提供：(一条5.95美元的针织迷你裙：(在其全部2300多家店铺中：(遍布世界各地))) → 它必须依赖：(低工资的海外劳工) + 大量订购：(给自然资源造成压力的) + 使用大量：(有害化学物质)。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>《过度着装》是 → 时尚界的回应：(对消费者活动家畅销书：(比如迈克尔·波伦的《杂食者的困境》))。\u003c/p>\n\u003cp>&quot;大规模生产的服装：(就像快餐) → 满足了饥饿和需求 // 然而是不耐用和浪费的&quot; → 克莱恩认为。\u003c/p>\n\u003cp>美国人 → 她发现 → 每年购买大约200亿件服装：(每人约64件) + 无论多少：(他们捐赠的) → 这种过量 → 导致浪费。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>在《过度着装》的结尾 → 克莱恩介绍了她的理想：(一位布鲁克林女性：(名叫莎拉·凯特·博蒙特)：(自2008年以来 → 一直自己制作所有衣服 – 而且做得很漂亮))。\u003c/p>\n\u003cp>但正如克莱恩 → 首先指出的 → 博蒙特花了：(几十年来完善她的手艺)；→ 她的例子 → 不能被复制。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>尽管几家快时尚公司 → 已经做出努力 → 来抑制他们的影响：(对劳工和环境) – 包括H&amp;M：(凭借其绿色的Conscious Collection系列) – // 克莱恩相信 → 持久的改变 → 只能被实现：(由消费者)。\u003c/p>\n\u003cp>她展现出 → 理想主义：(常见于许多倡导者：(可持续发展的))：(无论是在食品方面 + 还是在能源方面)。\u003c/p>\n\u003cp>虚荣是恒定的；→ 人们只会开始 → 更可持续地购物：(当他们负担不起 → 不这样做的时候)。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第1段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Priestly explains how the deep blue color of the assistant&#39;s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Priestly explains / how the deep blue color / of the assistant&#39;s sweater / descended over the years / from fashion shows / to department stores / and to the bargain bin / in which the poor girl / doubtless found her garment.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>普里斯特利解释 / 深蓝色是如何 / 助理毛衣的 / 经过多年下降 / 从时装秀 / 到百货商店 / 再到廉价货架 / 在那里这个可怜的女孩 / 无疑找到了她的衣服。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把颜色归到毛衣上：\u003c/p>\n\u003cblockquote>\n\u003cp>助理毛衣的深蓝色\u003c/p>\n\u003c/blockquote>\n\u003cp>把流传经过按顺序合并：\u003c/p>\n\u003cblockquote>\n\u003cp>经过多年，从时装秀到百货商店，再到廉价货架\u003c/p>\n\u003c/blockquote>\n\u003cp>最后一块说明这个货架与女孩的关系：\u003c/p>\n\u003cblockquote>\n\u003cp>女孩无疑就是在那里找到这件衣服的\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>助理毛衣的深蓝色\u003cbr>经过多年，从时装秀到百货商店，再到廉价货架\u003cbr>女孩无疑就是在那里找到这件衣服的\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>普里斯特利解释了毛衣颜色的流传过程。\u003c/p>\n\u003c/blockquote>\n\u003cp>先说谁解释什么；把“经过多年”放在流传路径前，三个地点顺序不变，最后补充女孩在廉价货架找到衣服。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>普里斯特利解释了助理毛衣的深蓝色如何经过多年从时装秀下降到百货商店，再到这个可怜女孩无疑找到衣服的廉价货架。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>颜色不是垂直掉落，用“流传”替换“下降”。\u003c/li>\n\u003cli>以“最终到达”连接最后一站，使三个地点的先后层次清楚。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>普里斯特利解释了助理毛衣的深蓝色是如何经过多年从时装秀流传到百货商店，最终到达这个可怜女孩无疑找到她衣服的廉价货架。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第2段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn&#39;t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline&#39;s three-year indictment of &quot;fast fashion&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>This top-down conception / of the fashion business / couldn&#39;t be more out of date / or at odds with / the feverish world / described in Overdressed, / Elizabeth Cline&#39;s three-year indictment / of &quot;fast fashion&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>这种自上而下的观念 / 对时尚产业的 / 再过时不过了 / 或者说格格不入 / 与狂热的世界 / 描述在《过度着装》中的，/ 伊丽莎白·克莱恩的三年控诉 / 对&quot;快时尚&quot;的。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把观念的对象和方向说完整：\u003c/p>\n\u003cblockquote>\n\u003cp>这种自上而下的时尚产业观念\u003c/p>\n\u003c/blockquote>\n\u003cp>把两个评价并列在一起：\u003c/p>\n\u003cblockquote>\n\u003cp>已经完全过时，与书中描写的狂热世界格格不入\u003c/p>\n\u003c/blockquote>\n\u003cp>书名后补上作者、历时和批评对象：\u003c/p>\n\u003cblockquote>\n\u003cp>《过度着装》是伊丽莎白·克莱恩对快时尚长达三年的控诉\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>这种自上而下的时尚产业观念\u003cbr>已经完全过时，与书中描写的狂热世界格格不入\u003cbr>《过度着装》是伊丽莎白·克莱恩对快时尚长达三年的控诉\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>这种观念已过时，也与现实格格不入。\u003c/p>\n\u003c/blockquote>\n\u003cp>先说旧观念的两个判断；现实世界的描述放在第二个判断内，书名和作者随后出现，再以补充说明交代书的性质。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>这种自上而下的时尚产业观念再过时不过了，与伊丽莎白·克莱恩在《过度着装》中描写的狂热世界不相合，这本书是她对快时尚长达三年的控诉。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>用“已经完全过时”表达极强否定，避免“再过时不过”的口语绕口。\u003c/li>\n\u003cli>“格格不入”准确表达与现实不相合；用破折号追加书的性质，层次更分明。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>这种自上而下的时尚产业观念已经完全过时，与伊丽莎白·克莱恩在《过度着装》中描述的狂热世界格格不入——这是她对&quot;快时尚&quot;长达三年的控诉。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第2段第4句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don&#39;t advertise that – and to renew their wardrobe every few weeks.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>These labels / encourage style-conscious consumers / to see clothes as disposable – / meant to last / only a wash or two, / although they don&#39;t advertise that – / and to renew their wardrobe / every few weeks.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>这些品牌 / 鼓励注重时尚的消费者 / 把衣服视为一次性的 – / 意味着只能持续 / 一两次洗涤，/ 尽管他们不会宣传这一点 – / 并更新他们的衣柜 / 每隔几周。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把鼓励的对象说完整：\u003c/p>\n\u003cblockquote>\n\u003cp>这些品牌鼓励注重时尚的消费者\u003c/p>\n\u003c/blockquote>\n\u003cp>把消费者要做的两件事并列：\u003c/p>\n\u003cblockquote>\n\u003cp>把衣服视为一次性用品，并且每隔几周更新衣柜\u003c/p>\n\u003c/blockquote>\n\u003cp>把一次性的具体含义合成插入说明：\u003c/p>\n\u003cblockquote>\n\u003cp>衣服只能经受一两次洗涤，尽管品牌不会宣传这一点\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>这些品牌鼓励注重时尚的消费者\u003cbr>把衣服视为一次性用品，并且每隔几周更新衣柜\u003cbr>衣服只能经受一两次洗涤，尽管品牌不会宣传这一点\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>这些品牌鼓励消费者把衣服当作一次性用品并频繁更新衣柜。\u003c/p>\n\u003c/blockquote>\n\u003cp>在消费者前保留“注重时尚”。把关于洗涤和宣传的补充紧贴“一次性用品”，随后回到第二个动作“更新衣柜”，使两个动作都受“鼓励”统领。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>这些品牌鼓励注重时尚的消费者把衣服看成一次性用品——衣服只能撑过一两次洗涤，虽然品牌不会宣传这一点——并每隔几周更新衣柜。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>将插入部分调为“尽管……但……”，先说不宣传，再强调不耐洗事实。\u003c/li>\n\u003cli>“视为”“经受”比“看成”“撑过”更凝练，同时保留一两次及每隔几周的限制。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>这些品牌鼓励注重时尚的消费者把衣服视为一次性用品——尽管他们不会宣传这一点，但衣服只能经受一两次洗涤——并且每隔几周就更新衣柜。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第3段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>For H&amp;M to offer / a $5.95 knit miniskirt / in all its 2,300-plus stores / around the world, / it must rely on / low-wage overseas labor, / order in volumes / that strain natural resources, / and use massive amounts / of harmful chemicals.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>为了H&amp;M能够提供 / 一条5.95美元的针织迷你裙 / 在其全部2300多家店铺中 / 遍布世界各地，/ 它必须依赖 / 低工资的海外劳工，/ 大量订购 / 给自然资源造成压力的，/ 并使用大量 / 有害化学物质。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把销售目的、价格与覆盖范围合并：\u003c/p>\n\u003cblockquote>\n\u003cp>为了在全球2300多家店铺供应5.95美元的针织迷你裙\u003c/p>\n\u003c/blockquote>\n\u003cp>再把三项生产依赖排齐：\u003c/p>\n\u003cblockquote>\n\u003cp>依赖低工资海外劳工；大量订购；使用大量有害化学物质\u003c/p>\n\u003c/blockquote>\n\u003cp>将资源压力接回大量订购：\u003c/p>\n\u003cblockquote>\n\u003cp>进行给自然资源造成压力的大量订购\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>为了在全球2300多家店铺供应5.95美元的针织迷你裙\u003cbr>依赖低工资海外劳工；大量订购；使用大量有害化学物质\u003cbr>进行给自然资源造成压力的大量订购\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>H&amp;M必须依赖劳工、大量订购并使用化学物质。\u003c/p>\n\u003c/blockquote>\n\u003cp>开头放为了低价、大范围供货这一目的。后面三项都由“必须”统领；资源负担紧跟订购，不能移到劳工或店铺数量上。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>为了让H&amp;M在全球2300多家店铺供应5.95美元的针织迷你裙，它必须依赖低工资海外劳工，作给自然资源造成压力的大量订购，并使用大量有害化学物质。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步
