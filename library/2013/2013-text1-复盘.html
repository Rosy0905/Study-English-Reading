已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>“供应”整理为“提供”，与面向店铺顾客的产品语境一致。\u003c/li>\n\u003cli>“作大量订购”换成“进行大量订购”，补足中文搭配，同时不删去资源压力这个后果。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>为了让H&amp;M能在全球2300多家店铺中提供5.95美元的针织迷你裙，它必须依赖低工资的海外劳工，进行给自然资源造成压力的大量订购，并使用大量有害化学物质。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies have made efforts to curb their impact on labor and the environment – including H&amp;M, with its green Conscious Collection line – Cline believes lasting change can only be effected by the customer.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Though several fast-fashion companies / have made efforts / to curb their impact / on labor and the environment – / including H&amp;M, / with its green Conscious Collection line – / Cline believes / lasting change / can only be effected / by the customer.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>尽管几家快时尚公司 / 已经做出努力 / 来抑制他们的影响 / 对劳工和环境 – / 包括H&amp;M，/ 凭借其绿色的Conscious Collection系列 – / 克莱恩相信 / 持久的改变 / 只能被实现 / 由消费者。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并企业已有的行动：\u003c/p>\n\u003cblockquote>\n\u003cp>几家快时尚公司已努力减少对劳工和环境的影响\u003c/p>\n\u003c/blockquote>\n\u003cp>把例子接回企业行动：\u003c/p>\n\u003cblockquote>\n\u003cp>包括H&amp;M推出绿色Conscious Collection系列\u003c/p>\n\u003c/blockquote>\n\u003cp>再把克莱恩的判断合并：\u003c/p>\n\u003cblockquote>\n\u003cp>持久改变只能由消费者实现\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>几家快时尚公司已努力减少对劳工和环境的影响\u003cbr>包括H&amp;M推出绿色Conscious Collection系列\u003cbr>持久改变只能由消费者实现\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>克莱恩相信，持久改变只能由消费者实现。\u003c/p>\n\u003c/blockquote>\n\u003cp>前面企业行动及例子用“尽管”引入，后面用“但”转到克莱恩判断。只能限定改变由谁实现，不能误写为公司完全没有行动。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>尽管几家快时尚公司已努力抑制对劳工和环境的影响，包括H&amp;M的绿色Conscious Collection系列，但克莱恩相信持久改变只能由消费者实现。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>“减少影响”比“抑制影响”自然，也不夸成完全消除。\u003c/li>\n\u003cli>用破折号隔开绿色系列这一例子，让让步背景与最后的主判断容易区分。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>尽管几家快时尚公司已经努力减少对劳工和环境的影响——包括H&amp;M推出的绿色Conscious Collection系列——但克莱恩相信，持久的改变只能由消费者来实现。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>25题\u003c/h2>\n\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003cp>这篇文章的主题是什么？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Satire on an extravagant lifestyle.\u003c/strong>\u003c/p>\n\u003cp>对奢侈生活方式的讽刺\u003c/p>\n\u003cp>B. \u003cstrong>Challenge to a high-fashion myth.\u003c/strong>\u003c/p>\n\u003cp>对高级时装神话的挑战\u003c/p>\n\u003cp>C. \u003cstrong>Criticism of the fast-fashion industry.\u003c/strong>\u003c/p>\n\u003cp>对快时尚产业的批评\u003c/p>\n\u003cp>D. \u003cstrong>Exposure of a mass-market secret.\u003c/strong>\u003c/p>\n\u003cp>对大众市场秘密的揭露\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>借电影里一件毛衣的来路说明传统时尚由上而下影响普通消费者\u003c/td>\n\u003ctd>先摆出一个熟悉场景里的旧看法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>指出这种旧图景已经过时，技术让大众品牌快速追潮流、频繁上新并推动消费者把衣服当成一次性用品\u003c/td>\n\u003ctd>再说现实已经换了玩法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>写低价快时尚背后的低薪劳工、资源压力和大量化学品代价\u003c/td>\n\u003ctd>接着写第一批代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>继续用美国人一年购买巨量衣服、不断丢弃来说明不耐用和浪费\u003c/td>\n\u003ctd>再说代价还会继续扩大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>介绍一位自己做衣服的理想人物，同时承认她几十年的手艺无法快速复制\u003c/td>\n\u003ctd>举一个例子说明个人办法难复制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>承认企业有一些环保努力，但认为持久改变最终要由顾客和经济压力推动\u003c/td>\n\u003ctd>最后下结论：改变还得靠另一端\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003ch3>A. Satire on an extravagant lifestyle.\u003c/h3>\n\u003cp>对奢侈生活方式的讽刺\u003c/p>\n\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对奢侈生活方式的讽刺\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以熟悉的电影场景展示把昂贵衣着视为身份象征的旧生活观，为讽刺奢华作铺垫。\u003c/td>\n\u003ctd>先摆出一个熟悉场景里的旧看法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明奢华炫耀如今也借廉价快购扩散，大众用高频更衣模仿奢侈生活。\u003c/td>\n\u003ctd>再说现实已经换了玩法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>揭示这种炫耀生活首先让低薪劳动者与环境承担代价，形成奢华外表与实际损害的反差。\u003c/td>\n\u003ctd>接着写第一批代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>进一步写衣柜膨胀和大量废弃，使奢侈习惯的荒谬及社会代价继续扩大。\u003c/td>\n\u003ctd>再说代价还会继续扩大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>举长期亲手制衣的节俭者为对照，同时说明其技能难复制，个人节制不易普及。\u003c/td>\n\u003ctd>举一个例子说明个人办法难复制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>最后将讽刺落到消费一端：只有顾客放弃炫耀性的过量购买，奢华生活的扩散才会改变。\u003c/td>\n\u003ctd>最后下结论：改变还得靠另一端\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>A\u003c/code>可以解释虚荣与浪费，却把批评中心限定为奢侈生活。文章第2段反复分析技术、库存、上新频率和极低价格，第3段分析劳动与资源，第4段用快餐比喻大众工业消费；这些是行业运作及外部代价，不以奢华生活讽刺为主。最后的\u003ccode>vanity\u003c/code>也只是解释改变困难的一项条件，不能回过头吞掉行业机制。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003ch3>B. Challenge to a high-fashion myth.\u003c/h3>\n\u003cp>对高级时装神话的挑战\u003c/p>\n\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对高级时装神话的挑战\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>用电影中颜色由秀场传向大众的场景，摆出高级时装独占潮流决定权的旧神话。\u003c/td>\n\u003ctd>先摆出一个熟悉场景里的旧看法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>指出大众品牌凭技术与快速反应已改变潮流控制权，挑战高级时装单向支配的旧说法。\u003c/td>\n\u003ctd>再说现实已经换了玩法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明神话破裂后设计师和生产链首先承担代价，证明高级时装无力保护原有秩序。\u003c/td>\n\u003ctd>接着写第一批代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>再写大众消费者的服装消耗激增，显示高级时装也不能通过季节节奏约束整个市场。\u003c/td>\n\u003ctd>再说代价还会继续扩大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>举绕开时装体系亲手制衣的个人例子，同时说明这种独立办法需要多年手艺、难以复制。\u003c/td>\n\u003ctd>举一个例子说明个人办法难复制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>最后指出打破对高级时装的迷信还须消费者改变选择，不能只等设计师重掌权威。\u003c/td>\n\u003ctd>最后下结论：改变还得靠另一端\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>B\u003c/code>能接到第1段的传统图景和第2段开头的过时判断，但这次转折服务于介绍新的快时尚批评。第3、4段追究的并非高级时装神话本身，而是低价快产带来的劳动、资源与浪费代价；末段也讨论可持续购物，不是如何戳破高级时装权威。\u003ccode>B\u003c/code>抓住了进入主题的门口，却没有涵盖展开与收束。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003ch3>C. Criticism of the fast-fashion industry.\u003c/h3>\n\u003cp>对快时尚产业的批评\u003c/p>\n\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对快时尚产业的批评\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>借电影展示传统时尚自上而下影响普通消费者的旧观念，建立讨论行业变化的起点。\u003c/td>\n\u003ctd>先摆出一个熟悉场景里的旧看法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>指出技术与大众品牌已经改写节奏，以低价、快速上新和短寿命衣物推动快时尚消费。\u003c/td>\n\u003ctd>再说现实已经换了玩法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>批评这种机制首先带来的低薪劳动、自然资源压力及有害化学品使用。\u003c/td>\n\u003ctd>接着写第一批代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>继续批评巨量购买与衣物废弃，说明损害扩展到整个消费循环。\u003c/td>\n\u003ctd>再说代价还会继续扩大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>举个人制衣的理想解法，同时指出多年手艺难复制，显示这种补救不能轻易普及。\u003c/td>\n\u003ctd>举一个例子说明个人办法难复制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>最后承认企业有限改进，把持久改变转向顾客一端，并指出经济条件对可持续选择的约束。\u003c/td>\n\u003ctd>最后下结论：改变还得靠另一端\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>C\u003c/code>从快时尚机制、生产代价、消费浪费一直管到补救的限制。第5段个人范例难复制，第6段消费者理想受到质疑，都在追问行业问题如何改变，并非离题。作者也没有无条件赞成\u003ccode>Cline\u003c/code>的每个方案；质疑其理想主义仍是对解决同一行业问题的现实检验。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>What is the subject of the text?\u003c/strong>\u003c/p>\n\u003ch3>D. Exposure of a mass-market secret.\u003c/h3>\n\u003cp>对大众市场秘密的揭露\u003c/p>\n\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对大众市场秘密的揭露\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>用熟悉购物场景摆出消费者以为商品只沿公开的高级时装链条流入大众市场的旧看法。\u003c/td>\n\u003ctd>先摆出一个熟悉场景里的旧看法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>揭露大众市场如今靠隐藏的短寿命设计和快速上新控制购买频率，秘密机制已取代旧玩法。\u003c/td>\n\u003ctd>再说现实已经换了玩法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>追查秘密机制的第一批隐蔽代价：低价背后的劳动力与自然资源被过度使用。\u003c/td>\n\u003ctd>接着写第一批代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>继续揭露顾客不易看到的废弃规模，说明秘密机制的代价随重复购买扩大。\u003c/td>\n\u003ctd>再说代价还会继续扩大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>举自行制衣者绕开隐蔽机制的例子，同时说明这种个人替代需要多年训练，难以复制。\u003c/td>\n\u003ctd>举一个例子说明个人办法难复制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>最后认为破除秘密机制必须依靠顾客获知真相并改变购买，单靠品牌自我披露不足。\u003c/td>\n\u003ctd>最后下结论：改变还得靠另一端\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>D\u003c/code>把全文的功能写成揭开某个大众市场秘密。产品不耐用且品牌不宣传这一点，确是第2段的一处内容，但后文公开讨论劳动资源、购买数量、理想范例与经济制约，并不围绕发现一个隐藏事实收束。全文强调这些运作方式为何值得批评及为何难改，范围比揭露某个秘密更完整。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>25题结论\u003c/h3>\n\u003cp>\u003cstrong>25. C. Criticism of the fast-fashion industry.\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Criticism of the fast-fashion industry. / 对快时尚产业的批评\u003c/strong>\u003c/p>\n\u003ch2>21题\u003c/h2>\n\u003cblockquote>\n\u003cp>Priestly criticizes her assistant for her ______.\u003cbr>Priestly因助手的什么问题而批评她？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物行为原因题。题干的人物\u003ccode>Priestly\u003c/code>及\u003ccode>criticizes\u003c/code>对应第1段的\u003ccode>scolds\u003c/code>。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是\u003ccode>Priestly\u003c/code>用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003c/blockquote>\n\u003cp>电影场景先展示助手以为自己置身时尚之外，再由毛衣颜色的来源证明她仍受时尚影响。下一段才转入这种自上而下观念已过时，不能把后面的行业批评移成\u003ccode>Priestly\u003c/code>此处的批评内容。\u003c/p>\n\u003ch3>A. lack of imagination\u003c/h3>\n\u003cblockquote>\n\u003cp>缺乏想象力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>保留：当时凭\u003ccode>imagining\u003c/code>与\u003ccode>imagination\u003c/code>的相似，以及人物受到批评的情境，尚未读清后面具体想法。\u003ccode>D\u003c/code>也保留；确定全文主旨后再回看开场的时尚影响关系，排除\u003ccode>A\u003c/code>，最终选择\u003ccode>D\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>lack of imagination\u003c/code>把\u003ccode>imagination\u003c/code>当作创造性想象能力。原文\u003ccode>imagining\u003c/code>的宾语却是她以为高级时装与自己无关这一具体想法，意思是“竟然以为”，不是“缺少想象力”。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把“持有一个错误想法”改成“缺乏想象能力”，丢掉了\u003ccode>imagining\u003c/code>后面真正决定批评内容的命题。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Priestly批评她的助手，是因为助手缺乏想象力。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干的人物\u003ccode>Priestly\u003c/code>及\u003ccode>criticizes\u003c/code>对应第1段的\u003ccode>scolds\u003c/code>。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是\u003ccode>Priestly\u003c/code>用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>lack of imagination\u003c/code>把\u003ccode>imagination\u003c/code>当作创造性想象能力。原文\u003ccode>imagining\u003c/code>的宾语却是她以为高级时装与自己无关这一具体想法，意思是“竟然以为”，不是“缺少想象力”。\u003c/p>\n\u003cp>\u003ccode>Priestly\u003c/code>随后追溯毛衣颜色的来源，用事实纠正助手对时尚影响的认识，并没有要求助手更有创造力或想出新款式。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把“持有一个错误想法”改成“缺乏想象能力”，丢掉了\u003ccode>imagining\u003c/code>后面真正决定批评内容的命题。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003cp>题干的人物Priestly及criticizes对应第1段的scolds。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是Priestly用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>电影场景先展示助手以为自己置身时尚之外，再由毛衣颜色的来源证明她仍受时尚影响。下一段才转入这种自上而下观念已过时，不能把后面的行业批评移成\u003ccode>Priestly\u003c/code>此处的批评内容。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Priestly scolds her assistant for having too little imagination to create new looks.\u003c/p>\n\u003cp>Priestly责备助手缺少创造新造型所需的想象力。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>A\u003c/code>成立，毛衣例子应显示助手不会构思或创造，\u003ccode>Priestly\u003c/code>应要求她拓展想象。实际毛衣的颜色由上游传到助手身上，例子证明的是她未察觉自己受到的影响，两种批评针对的能力不同。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文借电影里的旧观念，引出对当今快时尚的批评。本题应回答这个开场人物对助手哪种时尚认识不满，不能由全文批评行业直接推出人物傲慢或助手奢侈；具体原因仍须看scolds之后的内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>lack of imagination\u003cbr>缺乏想象力\u003c/p>\n\u003c/blockquote>\n\u003cp>开场为行业影响的讨论提供旧观念，\u003ccode>A\u003c/code>却把它变成个人创造力训练。后文改变的是时尚传播方式，也没有继续处理助手缺少想象力的问题；局部的\u003ccode>imagining\u003c/code>不能只按与\u003ccode>imagination\u003c/code>词形相近来认定。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. poor bargaining skill\u003c/h3>\n\u003cblockquote>\n\u003cp>糟糕的议价技巧\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>排除。当时选项显示为“\u003ccode>poor bargaining\u003c/code> [\u003ccode>xxx\u003c/code>]”。当时的判断依据是：“不等于。前者是对时尚影响的判断，后者是交易能力；助手前面的遮挡形容词也不会改动\u003ccode>for\u003c/code>从句给出的原因”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>需要助手买衣服时不善于讨价还价。原文的\u003ccode>bargain bin\u003c/code>是廉价商品筐或廉价货架，说明商品到达零售末端，不是在描写助手与售货员谈价。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把\u003ccode>bargain\u003c/code>所在的销售场景改造为助手的个人技能，并补出了她在交易中表现不佳的事实。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Priestly批评她的助手，是因为助手不擅长议价。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干的人物\u003ccode>Priestly\u003c/code>及\u003ccode>criticizes\u003c/code>对应第1段的\u003ccode>scolds\u003c/code>。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是\u003ccode>Priestly\u003c/code>用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>需要助手买衣服时不善于讨价还价。原文的\u003ccode>bargain bin\u003c/code>是廉价商品筐或廉价货架，说明商品到达零售末端，不是在描写助手与售货员谈价。\u003c/p>\n\u003cp>\u003ccode>Priestly\u003c/code>追踪的是颜色从时装秀、百货店到廉价货架的传播，末端价格便宜仍不能证明购买者议价能力差。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把\u003ccode>bargain\u003c/code>所在的销售场景改造为助手的个人技能，并补出了她在交易中表现不佳的事实。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003cp>题干的人物Priestly及criticizes对应第1段的scolds。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是Priestly用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>电影场景先展示助手以为自己置身时尚之外，再由毛衣颜色的来源证明她仍受时尚影响。下一段才转入这种自上而下观念已过时，不能把后面的行业批评移成\u003ccode>Priestly\u003c/code>此处的批评内容。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Priestly criticizes her assistant for failing to negotiate a good price for her sweater.\u003c/p>\n\u003cp>Priestly批评助手没能为毛衣谈到合适的价格。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>成立时应出现价格谈判、出价和成交结果。实际叙述连续移动的是同一种蓝色的传播位置，廉价货架只充当终点；作者既未展示谈判，也未以买贵了作为被批评的原因。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文借电影里的旧观念，引出对当今快时尚的批评。本题应回答这个开场人物对助手哪种时尚认识不满，不能由全文批评行业直接推出人物傲慢或助手奢侈；具体原因仍须看scolds之后的内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>poor bargaining skill\u003cbr>糟糕的议价技巧\u003c/p>\n\u003c/blockquote>\n\u003cp>全文研究时尚行业如何影响消费者，廉价市场在这条链中有意义，但助手会不会议价不构成开场的论点。\u003ccode>B\u003c/code>将市场位置换成购物技能，局部缺少\u003ccode>negotiation\u003c/code>这一行为依据。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. obsession with high fashion\u003c/h3>\n\u003cblockquote>\n\u003cp>沉迷高级时装\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>排除。当时的判断依据是：“不能。一个是否认受到影响，一个是过度迷恋；否定关系清楚写在原句里”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>说助手沉迷高级时装，原文恰说她以为高级时装与自己无关。前者主动高度投入，后者以为自己置身其外，是相反的自我认识。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>保留\u003ccode>high fashion\u003c/code>这个对象，却把助手对它的疏离误认反写成沉迷。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Priestly批评她的助手，是因为助手沉迷高级时装。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干的人物\u003ccode>Priestly\u003c/code>及\u003ccode>criticizes\u003c/code>对应第1段的\u003ccode>scolds\u003c/code>。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是\u003ccode>Priestly\u003c/code>用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>说助手沉迷高级时装，原文恰说她以为高级时装与自己无关。前者主动高度投入，后者以为自己置身其外，是相反的自我认识。\u003c/p>\n\u003cp>\u003ccode>Priestly\u003c/code>需要解释毛衣与时装秀的关系，正因为助手没有意识到这种联系；如果助手已经痴迷高级时装，这个纠正便失去针对性。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>保留\u003ccode>high fashion\u003c/code>这个对象，却把助手对它的疏离误认反写成沉迷。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003cp>题干的人物Priestly及criticizes对应第1段的scolds。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是Priestly用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>电影场景先展示助手以为自己置身时尚之外，再由毛衣颜色的来源证明她仍受时尚影响。下一段才转入这种自上而下观念已过时，不能把后面的行业批评移成\u003ccode>Priestly\u003c/code>此处的批评内容。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Priestly scolds her assistant for being obsessed with high fashion.\u003c/p>\n\u003cp>Priestly责备助手过于沉迷高级时装。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>C\u003c/code>成立，后文应劝助手降低对名牌或时装秀的关注。实际\u003ccode>Priestly\u003c/code>让助手看到她原本不承认的影响，是把联系补上，而非要求她从过度投入中退出来。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文借电影里的旧观念，引出对当今快时尚的批评。本题应回答这个开场人物对助手哪种时尚认识不满，不能由全文批评行业直接推出人物傲慢或助手奢侈；具体原因仍须看scolds之后的内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>obsession with high fashion\u003cbr>沉迷高级时装\u003c/p>\n\u003c/blockquote>\n\u003cp>全文批评快时尚，不代表开场每个被批评的人都是时尚狂热者。助手的作用是展示消费者可能不知道自己受到影响；\u003ccode>C\u003c/code>反转了这个角色的初始认识，不能支撑电影场景向行业讨论的过渡。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. insensitivity to fashion\u003c/h3>\n\u003cblockquote>\n\u003cp>对时尚不敏感\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>保留。当时的判断依据是：“能。\u003ccode>D\u003c/code>没有改换批评对象，也保留了助手感受不到时尚影响这一核心关系”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>insensitivity\u003c/code>不是说助手看不见颜色，而是未察觉时尚对自己的影响。原文她以为高级时装与自己无关，正体现这种不敏感。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>用一个态度名词概括“没有意识到与自身有关的时尚影响”，保留了\u003ccode>Priestly\u003c/code>责备的对象。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Priestly批评她的助手，是因为助手对时尚不敏感。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干的人物\u003ccode>Priestly\u003c/code>及\u003ccode>criticizes\u003c/code>对应第1段的\u003ccode>scolds\u003c/code>。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是\u003ccode>Priestly\u003c/code>用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>insensitivity\u003c/code>不是说助手看不见颜色，而是未察觉时尚对自己的影响。原文她以为高级时装与自己无关，正体现这种不敏感。\u003c/p>\n\u003cp>毛衣颜色最终从时装秀传到她身上，反驳了她自认为独立于时尚的想法。\u003ccode>D\u003c/code>概括了这个具体认识问题，没有把它扩大为对服装完全无知。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>用一个态度名词概括“没有意识到与自身有关的时尚影响”，保留了\u003ccode>Priestly\u003c/code>责备的对象。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn’t affect her. Priestly explains how the deep blue color of the assistant’s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.\u003c/p>\n\u003cp>题干的人物Priestly及criticizes对应第1段的scolds。被批评的具体行为是助手以为高级时装与自己无关；毛衣颜色的传播路径是Priestly用来纠正这种看法的证据，不是对助手议价能力的评价。\u003c/p>\n\u003c/blockquote>\n\u003cp>电影场景先展示助手以为自己置身时尚之外，再由毛衣颜色的来源证明她仍受时尚影响。下一段才转入这种自上而下观念已过时，不能把后面的行业批评移成\u003ccode>Priestly\u003c/code>此处的批评内容。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Priestly criticizes her assistant for failing to recognize fashion’s influence on her own clothes.\u003c/p>\n\u003cp>Priestly批评助手没有认识到时尚对她自己衣着的影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>所需的写法就是先呈现“不受影响”的想法，再展示毛衣如何受上游时尚影响。原文两句话正组成这一纠正过程，颜色路径也有清楚的证明作用。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文借电影里的旧观念，引出对当今快时尚的批评。本题应回答这个开场人物对助手哪种时尚认识不满，不能由全文批评行业直接推出人物傲慢或助手奢侈；具体原因仍须看scolds之后的内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>insensitivity to fashion\u003cbr>对时尚不敏感\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>能说明作者为何用这个电影场景引出行业影响：消费者自以为无关，衣着仍处在传播链内。它解释了开场例子的局部功能；全文随后批评新的快时尚机制，并不取消这里明确的批评原因。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>21题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>21. D. insensitivity to fashion\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>把“持有一个错误想法”改成“缺乏想象能力”，丢掉了\u003ccode>imagining\u003c/code>后面真正决定批评内容的命题。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把\u003ccode>bargain\u003c/code>所在的销售场景改造为助手的个人技能，并补出了她在交易中表现不佳的事实。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>保留\u003ccode>high fashion\u003c/code>这个对象，却把助手对它的疏离误认反写成沉迷。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>用一个态度名词概括“没有意识到与自身有关的时尚影响”，保留了\u003ccode>Priestly\u003c/code>责备的对象。\u003c/p>\n\u003ch2>22题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Cline, mass-market labels urge consumers to ______.\u003cbr>根据Cline的说法，大众市场品牌促使消费者做什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>消费者行为细节题。题干的\u003ccode>mass-market labels\u003c/code>对应第2段的\u003ccode>These labels\u003c/code>，\u003ccode>urge\u003c/code>对应\u003ccode>encourage\u003c/code>。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003c/blockquote>\n\u003cp>先写技术使品牌快速回应趋势，再写少库存和频繁上新提高利润，接着写衣物寿命短、衣柜不断更新。结尾用便宜的新潮服装冲击传统周期，将消费频率与商业机制连接起来。\u003c/p>\n\u003ch3>A. combat unnecessary waste\u003c/h3>\n\u003cblockquote>\n\u003cp>抵制不必要的浪费\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“不等于。原句在推动更快替换，\u003ccode>A\u003c/code>却写成减少浪费，动作方向已经倒转”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>combat unnecessary waste\u003c/code>表达抵制浪费，属于纠正消费弊端的方向。\u003ccode>These labels\u003c/code>实际鼓励消费者把衣物视为\u003ccode>disposable\u003c/code>，并且几周就更新衣柜。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>将作者希望读者反思的后果，反写成品牌正在鼓励的节制行为。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>按照Cline的说法，大众市场品牌促使消费者抵制不必要的浪费。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干的\u003ccode>mass-market labels\u003c/code>对应第2段的\u003ccode>These labels\u003c/code>，\u003ccode>urge\u003c/code>对应\u003ccode>encourage\u003c/code>。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>combat unnecessary waste\u003c/code>表达抵制浪费，属于纠正消费弊端的方向。\u003ccode>These labels\u003c/code>实际鼓励消费者把衣物视为\u003ccode>disposable\u003c/code>，并且几周就更新衣柜。\u003c/p>\n\u003cp>一次性使用和快速替换会制造后文批评的浪费，不能因为作者批评浪费，就说被批评的品牌也在劝消费者抵制它。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>将作者希望读者反思的后果，反写成品牌正在鼓励的节制行为。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>题干的mass-market labels对应第2段的These labels，urge对应encourage。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写技术使品牌快速回应趋势，再写少库存和频繁上新提高利润，接着写衣物寿命短、衣柜不断更新。结尾用便宜的新潮服装冲击传统周期，将消费频率与商业机制连接起来。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Mass-market labels encourage consumers to keep their clothes longer and combat unnecessary waste.\u003c/p>\n\u003cp>大众市场品牌鼓励消费者延长衣物使用时间、抵制不必要的浪费。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>需要后文出现延长寿命、减少替换与少买的建议。实际作者写衣物只能经受一两次清洗，并且频繁更新衣柜；叙述展示浪费怎样被制造，而非品牌怎样教人减少浪费。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚的短寿命、大量消费及其代价。本题应找品牌怎样促使顾客持续购买，而不是把作者反对浪费的立场转给品牌；具体频率由renew与every few weeks确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>combat unnecessary waste\u003cbr>抵制不必要的浪费\u003c/p>\n\u003c/blockquote>\n\u003cp>全文批评这种商业模式，恰因为它推动短周期消费。\u003ccode>A\u003c/code>将批评者的反浪费方向安到品牌身上，会消解第3、4段为何追究生产消耗和抛弃数量的依据。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. shop for their garments more frequently\u003c/h3>\n\u003cblockquote>\n\u003cp>更频繁地购买服装\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>保留。当时的判断依据是：“能。\u003ccode>B\u003c/code>没有增加新的对象或条件，只把更新频率换成了更直白的购买频率”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>shop\u003c/code> ... \u003ccode>more frequently\u003c/code>对应\u003ccode>renew their wardrobe every few weeks\u003c/code>。更新衣柜在这里通过购买不断上新的便宜服装完成，频繁购买是对具体时间间隔的概括。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留了品牌促使消费者提高购买频率这一动作和方向，没有承诺每个人都必然照做。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>按照Cline的说法，大众市场品牌促使消费者更频繁地购买服装。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干的\u003ccode>mass-market labels\u003c/code>对应第2段的\u003ccode>These labels\u003c/code>，\u003ccode>urge\u003c/code>对应\u003ccode>encourage\u003c/code>。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>shop\u003c/code> ... \u003ccode>more frequently\u003c/code>对应\u003ccode>renew their wardrobe every few weeks\u003c/code>。更新衣柜在这里通过购买不断上新的便宜服装完成，频繁购买是对具体时间间隔的概括。\u003c/p>\n\u003cp>前文\u003ccode>more-frequent\u003c/code> ... \u003ccode>releases\u003c/code>说明供给端不断上新，后文\u003ccode>disposable\u003c/code>说明原有衣物很快被替换；两侧信息共同使“更新”指向持续消费，而不只是整理已有衣服。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留了品牌促使消费者提高购买频率这一动作和方向，没有承诺每个人都必然照做。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>题干的mass-market labels对应第2段的These labels，urge对应encourage。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写技术使品牌快速回应趋势，再写少库存和频繁上新提高利润，接着写衣物寿命短、衣柜不断更新。结尾用便宜的新潮服装冲击传统周期，将消费频率与商业机制连接起来。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Mass-market labels encourage shoppers to buy new garments every few weeks.\u003c/p>\n\u003cp>大众市场品牌鼓励消费者每隔几周就购买新服装。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>要求上新、短寿命和再购买能够接起来。原文先写品牌频繁推出新款，随后写消费者每几周更新衣柜，结尾再写便宜潮款打破传统季节周期；实际路线完整支持这种高频消费。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚的短寿命、大量消费及其代价。本题应找品牌怎样促使顾客持续购买，而不是把作者反对浪费的立场转给品牌；具体频率由renew与every few weeks确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>shop for their garments more frequently\u003cbr>更频繁地购买服装\u003c/p>\n\u003c/blockquote>\n\u003cp>频繁购买使快时尚的低价吸引、资源消耗及大量废弃连成一条链。\u003ccode>B\u003c/code>回答了品牌如何把商业速度传到消费者身上，也有\u003ccode>every few weeks\u003c/code>这一直接的时间依据。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. resist the influence of advertisements\u003c/h3>\n\u003cblockquote>\n\u003cp>抵制广告的影响\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>排除。当时选项显示为“\u003ccode>resist the\u003c/code> [\u003ccode>xxx\u003c/code>] \u003ccode>of advertisements\u003c/code>”。当时的判断依据是：“不等于。两边的动作对象不同，而且原文的\u003ccode>encourage\u003c/code>与\u003ccode>C\u003c/code>的抵制方向也不一致”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把\u003ccode>advertise\u003c/code>理解成品牌要消费者抵制广告影响。原文\u003ccode>although they don’t advertise that\u003c/code>中的\u003ccode>that\u003c/code>回指衣物只能撑过一两次清洗，主语\u003ccode>they\u003c/code>是品牌。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把品牌不宣传某个缺点，改成品牌鼓励消费者抵制广告的普遍影响。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>按照Cline的说法，大众市场品牌促使消费者抵制广告的影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干的\u003ccode>mass-market labels\u003c/code>对应第2段的\u003ccode>These labels\u003c/code>，\u003ccode>urge\u003c/code>对应\u003ccode>encourage\u003c/code>。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把\u003ccode>advertise\u003c/code>理解成品牌要消费者抵制广告影响。原文\u003ccode>although they don’t advertise that\u003c/code>中的\u003ccode>that\u003c/code>回指衣物只能撑过一两次清洗，主语\u003ccode>they\u003c/code>是品牌。\u003c/p>\n\u003cp>这句话说品牌不会主动宣扬产品不耐穿，不是消费者应采取某种抵制广告的行动。隐藏缺点与反对广告本身也不是同一件事。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把品牌不宣传某个缺点，改成品牌鼓励消费者抵制广告的普遍影响。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>题干的mass-market labels对应第2段的These labels，urge对应encourage。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写技术使品牌快速回应趋势，再写少库存和频繁上新提高利润，接着写衣物寿命短、衣柜不断更新。结尾用便宜的新潮服装冲击传统周期，将消费频率与商业机制连接起来。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>These labels urge consumers to resist the influence of advertisements.\u003c/p>\n\u003cp>这些品牌敦促消费者抵制广告的影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>C\u003c/code>成立时，应出现品牌帮助消费者识别营销、拒绝被宣传左右的建议。原文只是插入说明不耐穿这一事实未被宣传，马上接回更新衣柜；插语限制的是品牌说什么，而非顾客该如何对待广告。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚的短寿命、大量消费及其代价。本题应找品牌怎样促使顾客持续购买，而不是把作者反对浪费的立场转给品牌；具体频率由renew与every few weeks确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>resist the influence of advertisements\u003cbr>抵制广告的影响\u003c/p>\n\u003c/blockquote>\n\u003cp>快时尚靠不断推出潮流产品刺激消费，\u003ccode>C\u003c/code>却把品牌写成帮助顾客摆脱广告的角色。全文没有这层劝导，局部的\u003ccode>don’t advertise that\u003c/code>也不能跨主语、跨对象转成这样的命题。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. shut out the feverish fashion world\u003c/h3>\n\u003cblockquote>\n\u003cp>把狂热的时尚世界挡在外面\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>排除。当时的判断依据是：“不是。原文让消费者更容易参与潮流，\u003ccode>D\u003c/code>却写成隔绝潮流”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>shut out\u003c/code>要求消费者把狂热的时尚世界隔绝在外。原文\u003ccode>style-conscious consumers\u003c/code>是关注时尚的人，品牌向他们快速提供新潮款式并推动衣柜更新。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>借用了对行业的负面描述，却把品牌的拉动消费改成劝人远离。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>按照Cline的说法，大众市场品牌促使消费者把狂热的时尚世界挡在外面。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干的\u003ccode>mass-market labels\u003c/code>对应第2段的\u003ccode>These labels\u003c/code>，\u003ccode>urge\u003c/code>对应\u003ccode>encourage\u003c/code>。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>shut out\u003c/code>要求消费者把狂热的时尚世界隔绝在外。原文\u003ccode>style-conscious consumers\u003c/code>是关注时尚的人，品牌向他们快速提供新潮款式并推动衣柜更新。\u003c/p>\n\u003cp>\u003ccode>feverish world\u003c/code>在前面形容\u003ccode>Cline\u003c/code>揭示的行业，不是品牌劝顾客退出的对象；帮助潮流快速进入衣柜与挡住潮流方向相反。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>借用了对行业的负面描述，却把品牌的拉动消费改成劝人远离。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>题干的mass-market labels对应第2段的These labels，urge对应encourage。两个并列动作是把衣服当作可抛弃品，以及每隔几周更新衣柜；虽然品牌不会宣扬衣物不耐洗，却仍通过产品与上新机制促成频繁购买。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写技术使品牌快速回应趋势，再写少库存和频繁上新提高利润，接着写衣物寿命短、衣柜不断更新。结尾用便宜的新潮服装冲击传统周期，将消费频率与商业机制连接起来。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Mass-market labels urge consumers to shut out the feverish fashion world.\u003c/p>\n\u003cp>大众市场品牌劝消费者远离狂热的时尚世界。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>D\u003c/code>成立，后文应出现不追新、不受流行周期干扰的行为。实际文章强调更快回应趋势、几周更新一次和便宜的新潮服装，都是让消费者更紧密地进入这种世界。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文批评快时尚的短寿命、大量消费及其代价。本题应找品牌怎样促使顾客持续购买，而不是把作者反对浪费的立场转给品牌；具体频率由renew与every few weeks确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>shut out the feverish fashion world\u003cbr>把狂热的时尚世界挡在外面\u003c/p>\n\u003c/blockquote>\n\u003cp>全文揭示品牌怎样加速消费，\u003ccode>D\u003c/code>却让品牌阻断消费者与时尚的联系。它把作者的警惕方向与商业主体的鼓励方向混为一谈，不能解释后文为何批评过量购买。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>22题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>22. B. shop for their garments more frequently\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>将作者希望读者反思的后果，反写成品牌正在鼓励的节制行为。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留了品牌促使消费者提高购买频率这一动作和方向，没有承诺每个人都必然照做。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把品牌不宣传某个缺点，改成品牌鼓励消费者抵制广告的普遍影响。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>借用了对行业的负面描述，却把品牌的拉动消费改成劝人远离。\u003c/p>\n\u003ch2>23题\u003c/h2>\n\u003cblockquote>\n\u003cp>The word “indictment” (Para. 2) is closest in meaning to ______.\u003cbr>第二段中的“indictment”最接近哪个意思？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>语境词义题。目标词所在短语是\u003ccode>her three-year indictment of\u003c/code> “\u003ccode>fast fashion\u003c/code>”，评价对象为快时尚，评价者是\u003ccode>Cline\u003c/code>。第2段的短寿命、后面\u003ccode>victims\u003c/code>与\u003ccode>wasteful\u003c/code>具体展开负面指控；\u003ccode>three-year\u003c/code>说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先介绍\u003ccode>Cline\u003c/code>的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看\u003ccode>fashion\u003c/code>这个话题名词。\u003c/p>\n\u003ch3>A. accusation\u003c/h3>\n\u003cblockquote>\n\u003cp>指控、谴责\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>保留。当时的判断依据是：“能。\u003ccode>A\u003c/code>既保留了指责动作，也符合\u003ccode>Cline\u003c/code>批评\u003ccode>fast fashion\u003c/code>的语气”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>accusation\u003c/code>指控诉、谴责，与书中追究快时尚造成的劳动和环境代价相合。这里不要求存在法庭上的正式起诉，语境是一本消费批评著作。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>保留了评价的负面方向与被追责的对象，是语境中的近义解释。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的indictment最接近的意思是指控、谴责。\u003c/p>\n\u003c/blockquote>\n\u003cp>目标词所在短语是\u003ccode>her three-year indictment of\u003c/code> “\u003ccode>fast fashion\u003c/code>”，评价对象为快时尚，评价者是\u003ccode>Cline\u003c/code>。第2段的短寿命、后面\u003ccode>victims\u003c/code>与\u003ccode>wasteful\u003c/code>具体展开负面指控；\u003ccode>three-year\u003c/code>说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>accusation\u003c/code>指控诉、谴责，与书中追究快时尚造成的劳动和环境代价相合。这里不要求存在法庭上的正式起诉，语境是一本消费批评著作。\u003c/p>\n\u003cp>第3段的\u003ccode>victims\u003c/code>不止设计师，把低工资劳动、资源负担和有害化学物质列为问题；第4段又加上浪费，形成对行业的连续指责。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>保留了评价的负面方向与被追责的对象，是语境中的近义解释。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003cp>目标词所在短语是her three-year indictment of “fast fashion”，评价对象为快时尚，评价者是Cline。第2段的短寿命、后面victims与wasteful具体展开负面指控；three-year说明写作或调查历时，不能单独决定褒贬。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先介绍\u003ccode>Cline\u003c/code>的书，再用工人、自然资源和化学污染说明受害面，随后把服装消费类比快餐，指出不耐用和浪费。书的性质须由这些批评内容确定，而非只看\u003ccode>fashion\u003c/code>这个话题名词。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Cline’s book is a sustained accusation against the damaging practices of fast fashion.\u003c/p>\n\u003cp>Cline的书持续谴责快时尚中造成损害的做法。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>要求后文列举受到指控的行为及损害。实际由短寿命产品写到劳动与环境，再到巨量消费，正逐项充实书为何批评这个行业，既有立场也有具体理由。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Criticism of the fast-fashion industry.\u003cbr>对快时尚产业的批评\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是批评快时尚行业，因此Cline这本书在此应承担揭露问题、提出负面评价的作用。主旨可帮助确定评价方向，具体词义仍需结合victims、harmful与wasteful这些展开内容。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>accusation\u003cbr>指控、谴责\u003c/p>\n\u003c/blockquote>\n\u003cp>批评行业这一主旨与\u003ccode>accusation\u003c/code>的负面评价一致。\u003ccode>Cline\u003c/code>并非仅仅提到快时尚，而是用受害者与浪费来追究后果；因此\u003ccode>A\u003c/code>同时得到全文方向和词后具体展开的支持。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. enthusiasm\u003c/h3>\n\u003cblockquote>\n\u003cp>热情\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>排除。当时的判断依据是：“不能。原句是在谴责\u003ccode>fast fashion\u003c/code>，不是在表达热情”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>enthusiasm\u003c/code>表示热情或热衷，通常体现积极投入。这里列出的不是欣赏行业的理由，而是产品不耐用、劳动力低薪及环境负担。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把针对快时尚的批评性调查改成对它的积极热情。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This top-down conception of the fashion business couldn’t be more out of date or at odds with the feverish world described in Overdressed, Elizabeth Cline’s three-year indictment of “fast fashion”. In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely. Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit. These labels encourage style-conscious consumers to see clothes as disposable – meant to last only a wash or two, although they don’t advertise that – and to renew their wardrobe every few weeks. By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.\u003c/p>\n\u003cp>The victims of this revolution, of course, are not limited to designers. For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.\u003c/p>\n\u003cp>Overdressed is the fashion world’s answer to consumer-activist bestsellers like Michael Pollan’s The Omnivore’s Dilemma. “Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,” Cline argues. Americans, she finds, buy roughly 20 billion garments a year – about 64 items per person – and  no matter how much they give away, this excess leads to waste.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4
