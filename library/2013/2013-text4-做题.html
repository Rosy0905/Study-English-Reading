<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 36题题干\n\n**Three provisions of Arizona’s plan were overturned because they ______.**\n\n> 亚利桑那计划中的三项条款被推翻，因为它们____。\n\n题型：**原因题**。","articleRects":[],"questionRects":[[226,190,1008,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"36"},"html":"<h2>36题题干</h2>\n<p><strong>Three provisions of Arizona’s plan were overturned because they ______.</strong></p>\n<blockquote><p>亚利桑那计划中的三项条款被推翻，因为它们____。</p>\n</blockquote>\n<p>题型：<strong>原因题</strong>。</p>\n"},{"section":"先读题干","raw":"## 37题题干\n\n**On which of the following did the Justices agree, according to Paragraph 4?**\n\n> 根据第4段，大法官们对下列哪一点表示同意？\n\n题型：**段落细节题**。","articleRects":[],"questionRects":[[226,570,1181,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"37"},"html":"<h2>37题题干</h2>\n<p><strong>On which of the following did the Justices agree, according to Paragraph 4?</strong></p>\n<blockquote><p>根据第4段，大法官们对下列哪一点表示同意？</p>\n</blockquote>\n<p>题型：<strong>段落细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 38题题干\n\n**It can be inferred from Paragraph 5 that the Alien and Sedition Acts ______.**\n\n> 从第5段可以推断，《客籍法和镇压叛乱法》____。\n\n题型：**推断题**。","articleRects":[],"questionRects":[[226,951,1058,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"38"},"html":"<h2>38题题干</h2>\n<p><strong>It can be inferred from Paragraph 5 that the Alien and Sedition Acts ______.</strong></p>\n<blockquote><p>从第5段可以推断，《客籍法和镇压叛乱法》____。</p>\n</blockquote>\n<p>题型：<strong>推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 39题题干\n\n**The White House claims that its power of enforcement ______.**\n\n> 白宫声称，其执法权____。\n\n题型：**观点细节题**。","articleRects":[],"questionRects":[[226,1331,862,38],[1097,1363,110,7]],"scrollTarget":"question","meta":{"kind":"stem","qid":"39"},"html":"<h2>39题题干</h2>\n<p><strong>The White House claims that its power of enforcement ______.</strong></p>\n<blockquote><p>白宫声称，其执法权____。</p>\n</blockquote>\n<p>题型：<strong>观点细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 40题题干\n\n**What can be learned from the last paragraph?**\n\n> 从最后一段可以得知什么？\n\n题型：**段落理解题**。","articleRects":[],"questionRects":[[225,1712,728,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"40"},"html":"<h2>40题题干</h2>\n<p><strong>What can be learned from the last paragraph?</strong></p>\n<blockquote><p>从最后一段可以得知什么？</p>\n</blockquote>\n<p>题型：<strong>段落理解题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, However, even if |\n| 态度词／评价词 | 先抓个大概好坏 | legitimate, shocking, rightly |\n| 动作词 | 先看谁做了什么 | overturned, verify, cooperate |\n| 结果词 | 看最后出了什么事 | victory, defeat, objection |\n| 重复主题词 | 大概知道老在说什么 | Court, federal government, states |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, However, even if</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>legitimate, shocking, rightly</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>overturned, verify, cooperate</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>victory, defeat, objection</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>Court, federal government, states</td></tr></tbody></table>\n"},{"section":"读文章","raw":"On a five to three vote, the Supreme Court knocked out much of Arizona’s immigration law Monday—a **[xxx]** policy victory for the Obama Administration. But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration’s effort to upset the balance of power between the federal government and the states.","articleRects":[[274,279,1122,47],[202,330,1186,38],[202,377,1194,37],[202,423,1194,38],[202,470,501,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>On a five to three vote, the Supreme Court knocked out much of Arizona’s immigration law Monday—a <strong>[xxx]</strong> policy victory for the Obama Administration. But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration’s effort to upset the balance of power between the federal government and the states.</p>\n</div></div>"},{"section":"读文章","raw":"On a five to three vote, / the Supreme Court knocked out much of Arizona’s immigration law Monday — / a **[xxx]** policy victory for the Obama Administration. / But on the more important matter of the Constitution, / the decision was an 8-0 defeat for the Administration’s effort to upset the balance of power between the federal government and the states.","articleRects":[[274,279,1122,47],[202,330,1186,38],[202,377,1194,37],[202,423,1194,38],[202,470,501,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div cl  out Congress’s immigration wishes, / 任何州都不应获准 to do so either. / 每位大法官正确地驳回 this <strong>[xxx]</strong> claim.</p>\n</div></div>"},{"section":"读文章","raw":"7、某些权力确实专属、于联邦政府、但如果国会想、阻止各州使用、它从未这样做、任何州都不应获准、每位大法官正确地驳回。","articleRects":[[274,1732,1122,37],[202,1778,1194,38],[203,1825,1193,38],[202,1872,1195,37],[202,1919,1194,37],[202,1965,964,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":6,"form":3,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[6]},"contextRaw":"1、最高法院废除了、亚利桑那移民法的大部分、但在更重要的事情上、该判决是8-0的失败。\n\n2、多数派推翻了、要让州及地方警察、优先于州法律、都没有争议。\n\n3、太接近联邦的太阳、对于被推翻的条款。\n\n4、核实合法身份、联邦与州联合移民执法、分享信息。\n\n5、同意这一宪法推理、唯一主要的反对意见来自、对州特权的辩护。\n\n6、白宫辩称、即使州法律遵守、任何原本合法的州法律、只要它不赞同。","html":"<div class=\"coarseStack\"><div class=\"coarseDone\"><p>1、最高法院废除了、亚利桑那移民法的大部分、但在更重要的事情上、该判决是8-0的失败。</p>\n</div><div class=\"coarseDone\"><p>2、多数派推翻了、要让州及地方警察、优先于州法律、都没有争议。</p>\n</div><div class=\"coarseDone\"><p>3、太接近联邦的太阳、对于被推翻的条款。</p>\n</div><div class=\"coarseDone\"><p>4、核实合法身份、联邦与州联合移民执法、分享信息。</p>\n</div><div class=\"coarseDone\"><p>5、同意这一宪法推理、唯一主要的反对意见来自、对州特权的辩护。</p>\n</div><div class=\"coarseDone\"><p>6、白宫辩称、即使州法律遵守、任何原本合法的州法律、只要它不赞同。</p>\n</div><div class=\"currentFocus\"><p>7、某些权力确实专属、于联邦政府、但如果国会想、阻止各州使用、它从未这样做、任何州都不应获准、每位大法官正确地驳回。</p>\n</div></div>"},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到最高法院废除了、亚利桑那移民法的大部分、但在更重要的事情上、该判决是8-0的失败；中间又出现多数派推翻了、要让州及地方警察、优先于州法律、都没有争议；太接近联邦的太阳、对于被推翻的条款、太接近联邦的太阳、对于被推翻的条款；核实合法身份、联邦与州联合移民执法、联邦与州联合移民执法、分享信息；同意这一宪法推理、唯一主要的反对意见来自、唯一主要的反对意见来自、对州特权的辩护；白宫辩称、即使州法律遵守、任何原本合法的州法律、只要它不赞同；结尾还有某些权力确实专属、于联邦政府、任何州都不应获准、每位大法官正确地驳回。\n\n到这里还不能自然地说清楚：两次表决分别处理什么问题，联邦法律、总统的执法选择与州的行动权限怎样联系。先留下松散印象和大致位置，具体关系等题目问到时再查。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到最高法院废除了、亚利桑那移民法的大部分、但在更重要的事情上、该判决是8-0的失败；中间又出现多数派推翻了、要让州及地方警察、优先于州法律、都没有争议；太接近联邦的太阳、对于被推翻的条款、太接近联邦的太阳、对于被推翻的条款；核实合法身份、联邦与州联合移民执法、联邦与州联合移民执法、分享信息；同意这一宪法推理、唯一主要的反对意见来自、唯一主要的反对意见来自、对州特权的辩护；白宫辩称、即使州法律遵守、任何原本合法的州法律、只要它不赞同；结尾还有某些权力确实专属、于联邦政府、任何州都不应获准、每位大法官正确地驳回。</p>\n<p>到这里还不能自然地说清楚：两次表决分别处理什么问题，联邦法律、总统的执法选择与州的行动权限怎样联系。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"36题","raw":"## 36题\n\n> Three provisions of Arizona’s plan were overturned because they ______.  \n> 亚利桑那计划中的三项条款被推翻，因为它们____。\n\n题干的Three provisions、Arizona’s plan、overturned直接对应第2段的three of the four **[xxx]** provisions。第3段紧接着用On the overturned provisions展开法官的理由，所以把第2、3段完整读完。\n\n> 原文参考：\n> \n> In Arizona v. United States, the majority overturned three of the four **[xxx]** provisions of Arizona’s **[xxx]** plan to have state and local police enforce federal immigration law. The Constitutional principles that Washington alone has the power to“establish a uniform Rule of **[xxx]**” and that federal laws precede state laws are noncontroversial. Arizona had attempted to fashion state policies that ran **[xxx]** to the existing federal ones.\n> \n> 开始精读：\n> \n> In Arizona v. United States, / the majority overturned / three of the four **[xxx]** provisions / of Arizona’s **[xxx]** plan / to have state and local police / enforce federal immigration law. / The Constitutional principles / that Washington alone has the power / to“establish a uniform Rule of **[xxx]**” / and that federal laws / precede state laws / are noncontroversial. / Arizona had attempted to fashion / state policies that ran **[xxx]** / to the existing federal ones.\n> \n> 在亚利桑那诉美国案中， / 多数派推翻了 / 四项**[xxx]**条款中的三项 / 属于亚利桑那**[xxx]**计划 / 要让州及地方警察 / 执行联邦移民法。 / 宪法原则 / 即华盛顿独自拥有权力 / 去“确立统一的**[xxx]**规则” / 以及联邦法律 / 优先于州法律 / 都没有争议。 / 亚利桑那曾试图制定 / 呈**[xxx]**关系的州政策 / 相对于现行联邦政策。\n\n> 原文参考：\n> \n> Justice Anthony Kennedy, joined by Chief Justice John Roberts and the Court’s **[xxx]**, ruled that the state flew too close to the federal sun. On the overturned provisions the majority held that Congress had **[xxx]** “occupied the field,” and Arizona had thus **[xxx]** on the federal’s **[xxx]** powers.\n> \n> 开始精读：\n> \n> Justice Anthony Kennedy, / joined by Chief Justice John Roberts / and the Court’s **[xxx]**, / ruled that the state flew / too close to the federal sun. / On the overturned provisions / the majority held / that Congress had **[xxx]** / “occupied the field,” / and Arizona had thus **[xxx]** / on the federal’s **[xxx]** powers.\n> \n> 安东尼·肯尼迪大法官， / 得到首席大法官罗伯茨 / 及法院的**[xxx]**加入， / 裁定该州飞得 / 太接近联邦的太阳。 / 对于被推翻的条款 / 多数派认为 / 国会已经**[xxx]** / “占据了该领域”， / 因而亚利桑那已经**[xxx]** / 针对联邦的**[xxx]**权力。\n\n题干问三项条款为何被推翻。第2段写州及地方警察执行联邦移民法的计划，并说明联邦法优先于州法；第3段接着谈该州与联邦权力之间的问题。空格要解释条款与这一权力安排发生了什么关系。\n\n接下来按A—D逐项看。","articleRects":[[274,517,1123,38],[202,563,1194,38],[202,610,1194,38],[202,655,1194,40],[202,704,1194,37],[202,750,772,38],[273,797,1123,38],[202,844,1194,36],[202,890,1194,38],[202,936,1134,39]],"questionRects":[[226,190,1008,38],[281,253,817,38],[280,317,810,38],[280,380,804,38],[280,444,729,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1,2],"qid":"36","initialReadingPids":[1,2]},"html":"<h2>36题</h2>\n<blockquote><p>Three provisions of Arizona’s plan were overturned because they ______.<br />\n亚利桑那计划中的三项条款被推翻，因为它们____。</p>\n</blockquote>\n<p>题干的Three provisions、Arizona’s plan、overturned直接对应第2段的three of the four <strong>[xxx]</strong> provisions。第3段紧接着用On the overturned provisions展开法官的理由，所以把第2、3段完整读完。</p>\n<blockquote><p>原文参考：</p>\n<p>In Arizona v. United States, the majority overturned three of the four <strong>[xxx]</strong> provisions of Arizona’s <strong>[xxx]</strong> plan to have state and local police enforce federal immigration law. The Constitutional principles that Washington alone has the power to“establish a uniform Rule of <strong>[xxx]</strong>” and that federal laws precede state laws are noncontroversial. Arizona had attempted to fashion state policies that ran <strong>[xxx]</strong> to the existing federal ones.</p>\n<p>开始精读：</p>\n<p>In Arizona v. United States, / the majority overturned / three of the four <strong>[xxx]</strong> provisions / of Arizona’s <strong>[xxx]</strong> plan / to have state and local police / enforce federal immigration law. / The Constitutional principles / that Washington alone has the power / to“establish a uniform Rule of <strong>[xxx]</strong>” / and that federal laws / precede state laws / are noncontroversial. / Arizona had attempted to fashion / state policies that ran <strong>[xxx]</strong> / to the existing federal ones.</p>\n<p>在亚利桑那诉美国案中， / 多数派推翻了 / 四项<strong>[xxx]</strong>条款中的三项 / 属于亚利桑那<strong>[xxx]</strong>计划 / 要让州及地方警察 / 执行联邦移民法。 / 宪法原则 / 即华盛顿独自拥有权力 / 去“确立统一的<strong>[xxx]</strong>规则” / 以及联邦法律 / 优先于州法律 / 都没有争议。 / 亚利桑那曾试图制定 / 呈<strong>[xxx]</strong>关系的州政策 / 相对于现行联邦政策。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Justice Anthony Kennedy, joined by Chief Justice John Roberts and the Court’s <strong>[xxx]</strong>, ruled that the state flew too close to the federal sun. On the overturned provisions the majority held that Congress had <strong>[xxx]</strong> “occupied the field,” and Arizona had thus <strong>[xxx]</strong> on the federal’s <strong>[xxx]</strong> powers.</p>\n<p>开始精读：</p>\n<p>Justice Anthony Kennedy, / joined by Chief Justice John Roberts / and the Court’s <strong>[xxx]</strong>, / ruled that the state flew / too close to the federal sun. / On the overturned provisions / the majority held / that Congress had <strong>[xxx]</strong> / “occupied the field,” / and Arizona had thus <strong>[xxx]</strong> / on the federal’s <strong>[xxx]</strong> powers.</p>\n<p>安东尼·肯尼迪大法官， / 得到首席大法官罗伯茨 / 及法院的<strong>[xxx]</strong>加入， / 裁定该州飞得 / 太接近联邦的太阳。 / 对于被推翻的条款 / 多数派认为 / 国会已经<strong>[xxx]</strong> / “占据了该领域”， / 因而亚利桑那已经<strong>[xxx]</strong> / 针对联邦的<strong>[xxx]</strong>权力。</p>\n</blockquote>\n<p>题干问三项条款为何被推翻。第2段写州及地方警察执行联邦移民法的计划，并说明联邦法优先于州法；第3段接着谈该州与联邦权力之间的问题。空格要解释条款与这一权力安排发生了什么关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"36题","raw":"### A. overstepped the authority of federal immigration law\n\n> 越过了联邦移民法的权限。\n\n把A接回题干，它说的是：三项条款因越过联邦移民法的权限而被推翻。\n\nA说州的条款越过了联邦移民法的权限。第2段有`federal laws precede state laws`，第3段又说州飞得太靠近“联邦的太阳”。我们把这两句接起来看，州制定条款时受什么限制。\n\n> federal laws precede state laws are noncontroversial.\n\n> ruled that the state flew too close to the federal sun.\n\n> On the overturned provisions the majority held that Congress had **[xxx]** “occupied the field,” and Arizona had thus **[xxx]** on the federal’s **[xxx]** powers.\n\n`federal laws precede state laws`先说联邦法优先于州法。接着法院说，这个州离联邦的太阳太近了。虽然是比喻，仍能看出法院认为州的做法碰到了联邦这一边。\n\n后面又接着国会已经`occupied the field`，即占据了这一领域，亚利桑那随后对联邦权力做了**[xxx]**。这里还不能把不认识的动作直接译成越权，不过，前后的主语都是州和联邦，讨论的也是州能不能进入这片领域。\n\nA说条款超出联邦移民法允许州行事的范围，能和联邦法优先、州太过接近这两句接起来。\n\n**国会已经占据这一领域，州又被说成靠得太近，是否能支持A说的越过权限？**\n\n能支持这种理解。具体动作还没读清，但A没有改换州和联邦这两方，先留下。\n\n**第一轮判断：A保留。**","articleRects":[[274,517,1123,38],[202,563,1194,38],[202,610,1194,38],[202,655,1194,40],[202,704,1194,37],[202,750,772,38],[273,797,1123,38],[202,844,1194,36],[202,890,1194,38],[202,936,1134,39]],"questionRects":[[281,253,817,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"36","paragraphPids":[1,2]},"html":"<h3>A. overstepped the authority of federal immigration law</h3>\n<blockquote><p>越过了联邦移民法的权限。</p>\n</blockquote>\n<p>把A接回题干，它说的是：三项条款因越过联邦移民法的权限而被推翻。</p>\n<p>A说州的条款越过了联邦移民法的权限。第2段有<code>federal laws precede state laws</code>，第3段又说州飞得太靠近“联邦的太阳”。我们把这两句接起来看，州制定条款时受什么限制。</p>\n<blockquote><p>federal laws precede state laws are noncontroversial.</p>\n</blockquote>\n<blockquote><p>ruled that the state flew too close to the federal sun.</p>\n</blockquote>\n<blockquote><p>On the overturned provisions the majority held that Congress had <strong>[xxx]</strong> “occupied the field,” and Arizona had thus <strong>[xxx]</strong> on the federal’s <strong>[xxx]</strong> powers.</p>\n</blockquote>\n<p><code>federal laws precede state laws</code>先说联邦法优先于州法。接着法院说，这个州离联邦的太阳太近了。虽然是比喻，仍能看出法院认为州的做法碰到了联邦这一边。</p>\n<p>后面又接着国会已经<code>occupied the field</code>，即占据了这一领域，亚利桑那随后对联邦权力做了<strong>[xxx]</strong>。这里还不能把不认识的动作直接译成越权，不过，前后的主语都是州和联邦，讨论的也是州能不能进入这片领域。</p>\n<p>A说条款超出联邦移民法允许州行事的范围，能和联邦法优先、州太过接近这两句接起来。</p>\n<p><strong>国会已经占据这一领域，州又被说成靠得太近，是否能支持A说的越过权限？</strong></p>\n<p>能支持这种理解。具体动作还没读清，但A没有改换州和联邦这两方，先留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"36题","raw":"### B. disturbed the power balance between different states\n\n> 扰乱了不同州之间的权力平衡。\n\n把B接回题干，它说的是：三项条款因扰乱不同州之间的权力平衡而被推翻。\n\nB说`between different states`，是几个州之间。我们回到第3段，把`the state`和`the federal`分别找出来。\n\n> ruled that the state flew too close to the federal sun.\n\n> Arizona had thus **[xxx]** on the federal’s **[xxx]** powers.\n\n`the state`指亚利桑那州，`the federal`指联邦。法院说的是这个州的行动和联邦权力之间出了问题。\n\nB却把另一方也写成州。若是B，应该读到亚利桑那做了什么，使另一个州的权力受到影响；这两句没有出现这样的另一个州。\n\n虽然有些动作词被挡住了，`the federal’s ... powers`仍然能看清：后面说的是联邦的权力，不能拿其他州来替换。\n\n**原文与亚利桑那州发生权限争议的，是联邦还是其他州？**\n\n是联邦。B把联邦换成了其他州。\n\n**第一轮判断：B排除。**","articleRects":[[273,797,1123,38],[202,844,1194,36],[202,890,1194,38],[202,936,1134,39]],"questionRects":[[280,317,810,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"36","paragraphPids":[2]},"html":"<h3>B. disturbed the power balance between different states</h3>\n<blockquote><p>扰乱了不同州之间的权力平衡。</p>\n</blockquote>\n<p>把B接回题干，它说的是：三项条款因扰乱不同州之间的权力平衡而被推翻。</p>\n<p>B说<code>between different states</code>，是几个州之间。我们回到第3段，把<code>the state</code>和<code>the federal</code>分别找出来。</p>\n<blockquote><p>ruled that the state flew too close to the federal sun.</p>\n</blockquote>\n<blockquote><p>Arizona had thus <strong>[xxx]</strong> on the federal’s <strong>[xxx]</strong> powers.</p>\n</blockquote>\n<p><code>the state</code>指亚利桑那州，<code>the federal</code>指联邦。法院说的是这个州的行动和联邦权力之间出了问题。</p>\n<p>B却把另一方也写成州。若是B，应该读到亚利桑那做了什么，使另一个州的权力受到影响；这两句没有出现这样的另一个州。</p>\n<p>虽然有些动作词被挡住了，<code>the federal’s ... powers</code>仍然能看清：后面说的是联邦的权力，不能拿其他州来替换。</p>\n<p><strong>原文与亚利桑那州发生权限争议的，是联邦还是其他州？</strong></p>\n<p>是联邦。B把联邦换成了其他州。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"36题","raw":"### C. deprived the federal police of Constitutional powers\n\n> 剥夺了联邦警察的宪法权力。\n\n把C接回题干，它说的是：三项条款因剥夺联邦警察的宪法权力而被推翻。\n\nC把受影响的一方具体说成`the federal police`。原文前面提到警察，后面提到联邦权力，我们把这两处放在一起分清。\n\n> plan to have state and local police enforce federal immigration law.\n\n> On the overturned provisions the majority held that Congress had **[xxx]** “occupied the field,” and Arizona had thus **[xxx]** on the federal’s **[xxx]** powers.\n\n第2段说州及地方警察去执行联邦移民法。这里确实出现了警察，不过他们是去执行法律的人，尚未出现联邦警察的权力被拿走。\n\n第3段又说，亚利桑那对联邦的某种权力做了**[xxx]**。动作和权力前面的修饰都没读懂，所以现在还不清楚这项权力具体指什么。\n\nC的“剥夺联邦警察的宪法权力”比我们已经读懂的句子具体得多。眼下不能直接把两个**[xxx]**当成这几个词，也还要往后看，联邦法律、政府和负责执法的警察各自做什么。\n\n**后一句到底说州对哪种联邦权力做了什么，现在已经能完整读出来吗？**\n\n还不能。C提到的联邦警察也需要继续核对，先和A一起留下。\n\n**第一轮判断：C保留。**","articleRects":[[274,517,1123,38],[202,563,1194,38],[202,610,1194,38],[202,655,1194,40],[202,704,1194,37],[202,750,772,38],[273,797,1123,38],[202,844,1194,36],[202,890,1194,38],[202,936,1134,39]],"questionRects":[[280,380,804,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"36","paragraphPids":[1,2]},"html":"<h3>C. deprived the federal police of Constitutional powers</h3>\n<blockquote><p>剥夺了联邦警察的宪法权力。</p>\n</blockquote>\n<p>把C接回题干，它说的是：三项条款因剥夺联邦警察的宪法权力而被推翻。</p>\n<p>C把受影响的一方具体说成<code>the federal police</code>。原文前面提到警察，后面提到联邦权力，我们把这两处放在一起分清。</p>\n<blockquote><p>plan to have state and local police enforce federal immigration law.</p>\n</blockquote>\n<blockquote><p>On the overturned provisions the majority held that Congress had <strong>[xxx]</strong> “occupied the field,” and Arizona had thus <strong>[xxx]</strong> on the federal’s <strong>[xxx]</strong> powers.</p>\n</blockquote>\n<p>第2段说州及地方警察去执行联邦移民法。这里确实出现了警察，不过他们是去执行法律的人，尚未出现联邦警察的权力被拿走。</p>\n<p>第3段又说，亚利桑那对联邦的某种权力做了<strong>[xxx]</strong>。动作和权力前面的修饰都没读懂，所以现在还不清楚这项权力具体指什么。</p>\n<p>C的“剥夺联邦警察的宪法权力”比我们已经读懂的句子具体得多。眼下不能直接把两个<strong>[xxx]</strong>当成这几个词，也还要往后看，联邦法律、政府和负责执法的警察各自做什么。</p>\n<p><strong>后一句到底说州对哪种联邦权力做了什么，现在已经能完整读出来吗？</strong></p>\n<p>还不能。C提到的联邦警察也需要继续核对，先和A一起留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"36题","raw":"### D. contradicted both the federal and state policies\n\n> 同时与联邦政策和州政策相矛盾。\n\n把D接回题干，它说的是：三项条款同时与联邦政策和州政策相矛盾。\n\nD里的`both`要求三项条款既违背联邦政策，又违背州政策。我们回到第2段末，看`state policies`在句子里做什么。\n\n> Arizona had attempted to fashion state policies that ran **[xxx]** to the existing federal ones.\n\n亚利桑那试图制定的是`state policies`。后面的`that`接着这些州政策，再说它们与现有联邦政策之间的关系。\n\n因此，原句是“这些州政策与联邦政策怎样”，不是“这些条款另外违背了州政策”。州政策本来就是亚利桑那要制定的东西。\n\n即使中间的**[xxx]**暂时读不懂，也不能在原有的两方之外，再加上一套被它违背的州政策。D的`both`多要求了一件原句没有写的事。\n\n**原文写亚利桑那制定州政策，是否还写了这些条款同时违背另一套州政策？**\n\n没有。它只把所制定的州政策与联邦政策相对照，D的“同时”接不上。\n\n**第一轮判断：D排除。**","articleRects":[[274,517,1123,38],[202,563,1194,38],[202,610,1194,38],[202,655,1194,40],[202,704,1194,37],[202,750,772,38]],"questionRects":[[280,444,729,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"36","paragraphPids":[1]},"html":"<h3>D. contradicted both the federal and state policies</h3>\n<blockquote><p>同时与联邦政策和州政策相矛盾。</p>\n</blockquote>\n<p>把D接回题干，它说的是：三项条款同时与联邦政策和州政策相矛盾。</p>\n<p>D里的<code>both</code>要求三项条款既违背联邦政策，又违背州政策。我们回到第2段末，看<code>state policies</code>在句子里做什么。</p>\n<blockquote><p>Arizona had attempted to fashion state policies that ran <strong>[xxx]</strong> to the existing federal ones.</p>\n</blockquote>\n<p>亚利桑那试图制定的是<code>state policies</code>。后面的<code>that</code>接着这些州政策，再说它们与现有联邦政策之间的关系。</p>\n<p>因此，原句是“这些州政策与联邦政策怎样”，不是“这些条款另外违背了州政策”。州政策本来就是亚利桑那要制定的东西。</p>\n<p>即使中间的<strong>[xxx]</strong>暂时读不懂，也不能在原有的两方之外，再加上一套被它违背的州政策。D的<code>both</code>多要求了一件原句没有写的事。</p>\n<p><strong>原文写亚利桑那制定州政策，是否还写了这些条款同时违背另一套州政策？</strong></p>\n<p>没有。它只把所制定的州政策与联邦政策相对照，D的“同时”接不上。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"36题","raw":"### 36题第一次结果\n\n- A保留。\n- B排除。\n- C保留。\n- D排除。\n\n暂时保留：A、C。\n\n第一轮留下A、C。A能接上州与联邦权限的分界；C涉及的具体动作与权力性质仍未读清。","articleRects":[],"questionRects":[[226,190,1008,38],[281,253,817,38],[280,317,810,38],[280,380,804,38],[280,444,729,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"36"},"html":"<h3>36题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂时保留：A、C。</p>\n<p>第一轮留下A、C。A能接上州与联邦权限的分界；C涉及的具体动作与权力性质仍未读清。</p>\n"},{"section":"37题","raw":"## 37题\n\n> On which of the following did the Justices agree, according to Paragraph 4?  \n> 根据第4段，大法官们对下列哪一点表示同意？\n\n题干给出Paragraph 4，直接完整读第4段：从However开始，到cooperate with federal colleagues结束。\n\n> 原文参考：\n> \n> However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement. That’s because Congress has always **[xxx]** joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.\n> \n> 开始精读：\n> \n> However, the Justices said / that Arizona police would be allowed / to verify the legal status / of people who come in contact / with law enforcement. / That’s because Congress has always **[xxx]** / joint federal-state immigration enforcement / and explicitly encourages state officers / to share information / and cooperate with federal colleagues.\n> \n> 然而，大法官们说 / 亚利桑那警察将获准 / 核实合法身份 / 属于那些发生接触的人 / 与执法活动发生接触。 / 那是因为国会一向**[xxx]** / 联邦与州联合移民执法 / 并明确鼓励州官员 / 分享信息 / 并与联邦同僚合作。\n\n题干问大法官们同意的内容。第4段先说明州警察获准核实什么，再解释国会与州、联邦共同执法的关系；选项要准确表达这一许可或其依据。\n\n接下来按A—D逐项看。","articleRects":[[274,984,1122,38],[202,1031,1194,37],[202,1078,1195,37],[203,1124,1193,38],[202,1171,272,38]],"questionRects":[[226,570,1181,38],[280,634,802,38],[280,697,909,38],[280,761,789,38],[280,824,812,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"37","initialReadingPids":[3]},"html":"<h2>37题</h2>\n<blockquote><p>On which of the following did the Justices agree, according to Paragraph 4?<br />\n根据第4段，大法官们对下列哪一点表示同意？</p>\n</blockquote>\n<p>题干给出Paragraph 4，直接完整读第4段：从However开始，到cooperate with federal colleagues结束。</p>\n<blockquote><p>原文参考：</p>\n<p>However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement. That’s because Congress has always <strong>[xxx]</strong> joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n<p>开始精读：</p>\n<p>However, the Justices said / that Arizona police would be allowed / to verify the legal status / of people who come in contact / with law enforcement. / That’s because Congress has always <strong>[xxx]</strong> / joint federal-state immigration enforcement / and explicitly encourages state officers / to share information / and cooperate with federal colleagues.</p>\n<p>然而，大法官们说 / 亚利桑那警察将获准 / 核实合法身份 / 属于那些发生接触的人 / 与执法活动发生接触。 / 那是因为国会一向<strong>[xxx]</strong> / 联邦与州联合移民执法 / 并明确鼓励州官员 / 分享信息 / 并与联邦同僚合作。</p>\n</blockquote>\n<p>题干问大法官们同意的内容。第4段先说明州警察获准核实什么，再解释国会与州、联邦共同执法的关系；选项要准确表达这一许可或其依据。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"37题","raw":"### A. States’ independence from federal immigration law.\n\n> 各州独立于联邦移民法。\n\n把A接回题干，它说的是：大法官们同意各州独立于联邦移民法。\n\nA说各州`independence from`联邦移民法，也就是脱离它。第4段则写州警察获准核查身份，我们看获准后是独自行事还是与联邦合作。\n\n> Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.\n\n> explicitly encourages state officers to share information and cooperate with federal colleagues.\n\n`would be allowed to verify`说州警察可以核实身份，许可的是一个具体行动。\n\n后面又说州官员分享信息，并与联邦同僚合作。州参与的是共同执法，不是从所执行的联邦移民法中独立出来。\n\nA把“可以参与做这件事”写成“可以脱离这部法律”。原文没有给州这样的独立地位；正相反，州与联邦要相互配合。\n\n**州警察可以核查身份，就意味着各州可以独立于联邦移民法吗？**\n\n不意味着。原文允许的是共同执法中的具体行动，且明确要求分享信息、合作。\n\n**第一轮判断：A排除。**","articleRects":[[274,984,1122,38],[202,1031,1194,37],[202,1078,1195,37],[203,1124,1193,38],[202,1171,272,38]],"questionRects":[[280,634,802,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"37","paragraphPids":[3]},"html":"<h3>A. States’ independence from federal immigration law.</h3>\n<blockquote><p>各州独立于联邦移民法。</p>\n</blockquote>\n<p>把A接回题干，它说的是：大法官们同意各州独立于联邦移民法。</p>\n<p>A说各州<code>independence from</code>联邦移民法，也就是脱离它。第4段则写州警察获准核查身份，我们看获准后是独自行事还是与联邦合作。</p>\n<blockquote><p>Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.</p>\n</blockquote>\n<blockquote><p>explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n</blockquote>\n<p><code>would be allowed to verify</code>说州警察可以核实身份，许可的是一个具体行动。</p>\n<p>后面又说州官员分享信息，并与联邦同僚合作。州参与的是共同执法，不是从所执行的联邦移民法中独立出来。</p>\n<p>A把“可以参与做这件事”写成“可以脱离这部法律”。原文没有给州这样的独立地位；正相反，州与联邦要相互配合。</p>\n<p><strong>州警察可以核查身份，就意味着各州可以独立于联邦移民法吗？</strong></p>\n<p>不意味着。原文允许的是共同执法中的具体行动，且明确要求分享信息、合作。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"37题","raw":"### B. Federal officers’ duty to withhold immigrants’ information.\n\n> 联邦官员有隐瞒移民信息的义务。\n\n把B接回题干，它说的是：大法官们同意联邦官员有隐瞒移民信息的义务。\n\nB说`withhold ... information`，扣住信息。原文恰好写了`share information`，我们看是谁被鼓励怎样处理信息。\n\n> explicitly encourages state officers to share information and cooperate with federal colleagues.\n\n原文的`state officers`是州官员，国会鼓励他们把信息分享出去，并与联邦同僚合作。\n\nB说的却是联邦官员有义务隐瞒移民信息。州官员被换成了联邦官员，“分享”又变成了“扣住”。\n\n原句让信息在合作双方之间传递，B却要求其中一方把信息留住不交。不能因为都有官员和信息，就把这两个动作当作一样。\n\n**原文鼓励分享信息，能接成官员有义务把信息扣住吗？**\n\n不能。`share`是分享，B的`withhold`是扣留，处理信息的做法相反。\n\n**第一轮判断：B排除。**","articleRects":[[274,984,1122,38],[202,1031,1194,37],[202,1078,1195,37],[203,1124,1193,38],[202,1171,272,38]],"questionRects":[[280,697,909,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"37","paragraphPids":[3]},"html":"<h3>B. Federal officers’ duty to withhold immigrants’ information.</h3>\n<blockquote><p>联邦官员有隐瞒移民信息的义务。</p>\n</blockquote>\n<p>把B接回题干，它说的是：大法官们同意联邦官员有隐瞒移民信息的义务。</p>\n<p>B说<code>withhold ... information</code>，扣住信息。原文恰好写了<code>share information</code>，我们看是谁被鼓励怎样处理信息。</p>\n<blockquote><p>explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n</blockquote>\n<p>原文的<code>state officers</code>是州官员，国会鼓励他们把信息分享出去，并与联邦同僚合作。</p>\n<p>B说的却是联邦官员有义务隐瞒移民信息。州官员被换成了联邦官员，“分享”又变成了“扣住”。</p>\n<p>原句让信息在合作双方之间传递，B却要求其中一方把信息留住不交。不能因为都有官员和信息，就把这两个动作当作一样。</p>\n<p><strong>原文鼓励分享信息，能接成官员有义务把信息扣住吗？</strong></p>\n<p>不能。<code>share</code>是分享，B的<code>withhold</code>是扣留，处理信息的做法相反。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"37题","raw":"### C. States’ legitimate role in immigration enforcement.\n\n> 各州在移民执法中的合法作用。\n\n把C接回题干，它说的是：大法官们同意各州在移民执法中有合法作用。\n\nC说州在移民执法中有`legitimate role`。我们回到`would be allowed`，看法院究竟允许州做哪件事。\n\n> Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.\n\n> explicitly encourages state officers to share information and cooperate with federal colleagues.\n\n州警察被允许核实与执法接触者的合法身份。这里不是州自己声称要做，而是`the Justices said`后面明确给出的许可。\n\n后面还写了州官员与联邦官员分享信息、合作。州并未被完全排除在移民执法之外，它可以承担核查与配合的工作。\n\nC把这些获准承担的工作概括成“合法作用”。`role`对应具体参与，`legitimate`对应法院允许、国会鼓励，两个词都能找到落脚处。\n\n**法院明确允许州警察核查身份，能否说明州在移民执法中有被认可的作用？**\n\n能。这项许可和后面的合作安排都说明州可以合法参与，C留下。\n\n**第一轮判断：C保留。**","articleRects":[[274,984,1122,38],[202,1031,1194,37],[202,1078,1195,37],[203,1124,1193,38],[202,1171,272,38]],"questionRects":[[280,761,789,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"37","paragraphPids":[3]},"html":"<h3>C. States’ legitimate role in immigration enforcement.</h3>\n<blockquote><p>各州在移民执法中的合法作用。</p>\n</blockquote>\n<p>把C接回题干，它说的是：大法官们同意各州在移民执法中有合法作用。</p>\n<p>C说州在移民执法中有<code>legitimate role</code>。我们回到<code>would be allowed</code>，看法院究竟允许州做哪件事。</p>\n<blockquote><p>Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.</p>\n</blockquote>\n<blockquote><p>explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n</blockquote>\n<p>州警察被允许核实与执法接触者的合法身份。这里不是州自己声称要做，而是<code>the Justices said</code>后面明确给出的许可。</p>\n<p>后面还写了州官员与联邦官员分享信息、合作。州并未被完全排除在移民执法之外，它可以承担核查与配合的工作。</p>\n<p>C把这些获准承担的工作概括成“合法作用”。<code>role</code>对应具体参与，<code>legitimate</code>对应法院允许、国会鼓励，两个词都能找到落脚处。</p>\n<p><strong>法院明确允许州警察核查身份，能否说明州在移民执法中有被认可的作用？</strong></p>\n<p>能。这项许可和后面的合作安排都说明州可以合法参与，C留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"37题","raw":"### D. Congress’s intervention in immigration enforcement.\n\n> 国会对移民执法的介入。\n\n把D接回题干，它说的是：大法官们同意国会对移民执法的介入。\n\nD提到国会，原文理由句也以`Congress`开头。我们读它后面的两个动作，看“介入执法”能不能说清这里国会做的事。\n\n> That’s because Congress has always **[xxx]** joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.\n\n第一个动作被挡住了，但它后面接着联邦与州联合执法；第二个动作是`explicitly encourages`，明确鼓励州官员分享信息和合作。\n\n所以国会确实对联合执法有所安排，不能说这一段完全没写国会。不过，D把这种安排称为`intervention`，前面那个动作尚未读清，暂时还不好确定这是不是合适的概括。\n\n还要留意，这句话以`That’s because`开头：它在解释前面为什么允许州警察核查。C说获准的工作，D说国会做的事，后面再回来分清题干问的是哪一件。\n\n**国会对联合执法的第一个动作还没读清，能马上确定D的“介入”说错了吗？**\n\n还不能。明确鼓励合作也说明国会有所作为，D先留下，随后与C一起核对。\n\n**第一轮判断：D保留。**","articleRects":[[274,984,1122,38],[202,1031,1194,37],[202,1078,1195,37],[203,1124,1193,38],[202,1171,272,38]],"questionRects":[[280,824,812,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"37","paragraphPids":[3]},"html":"<h3>D. Congress’s intervention in immigration enforcement.</h3>\n<blockquote><p>国会对移民执法的介入。</p>\n</blockquote>\n<p>把D接回题干，它说的是：大法官们同意国会对移民执法的介入。</p>\n<p>D提到国会，原文理由句也以<code>Congress</code>开头。我们读它后面的两个动作，看“介入执法”能不能说清这里国会做的事。</p>\n<blockquote><p>That’s because Congress has always <strong>[xxx]</strong> joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n</blockquote>\n<p>第一个动作被挡住了，但它后面接着联邦与州联合执法；第二个动作是<code>explicitly encourages</code>，明确鼓励州官员分享信息和合作。</p>\n<p>所以国会确实对联合执法有所安排，不能说这一段完全没写国会。不过，D把这种安排称为<code>intervention</code>，前面那个动作尚未读清，暂时还不好确定这是不是合适的概括。</p>\n<p>还要留意，这句话以<code>That’s because</code>开头：它在解释前面为什么允许州警察核查。C说获准的工作，D说国会做的事，后面再回来分清题干问的是哪一件。</p>\n<p><strong>国会对联合执法的第一个动作还没读清，能马上确定D的“介入”说错了吗？</strong></p>\n<p>还不能。明确鼓励合作也说明国会有所作为，D先留下，随后与C一起核对。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"37题","raw":"### 37题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D保留。\n\n暂时保留：C、D。\n\n第一轮留下C、D。C对应州获准核查身份的作用；D涉及国会与联合执法的动作，该动作还未读懂。","articleRects":[],"questionRects":[[226,570,1181,38],[280,634,802,38],[280,697,909,38],[280,761,789,38],[280,824,812,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"37"},"html":"<h3>37题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D保留。</li></ul>\n<p>暂时保留：C、D。</p>\n<p>第一轮留下C、D。C对应州获准核查身份的作用；D涉及国会与联合执法的动作，该动作还未读懂。</p>\n"},{"section":"38题","raw":"## 38题\n\n> It can be inferred from Paragraph 5 that the Alien and Sedition Acts ______.  \n> 从第5段可以推断，《客籍法和镇压叛乱法》____。\n\n题干明示Paragraph 5，又点出the Alien and Sedition Acts，直接读第5段完整自然段，检查这组法案出现在哪一项论述中。\n\n> 原文参考：\n> \n> Two of the three objecting Justices—Samuel Alito and Clarence Thomas— agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal **[xxx]**. The only major objection came from Justice Antonin Scalia, who offered an even more **[xxx]** defense of state privileges going back to the Alien and Sedition Acts.\n> \n> 开始精读：\n> \n> Two of the three objecting Justices—Samuel / Alito and Clarence Thomas— / agreed with this Constitutional logic / but disagreed about / which Arizona rules conflicted / with the federal **[xxx]**. / The only major objection came / from Justice Antonin Scalia, / who offered an even more **[xxx]** / defense of state privileges / going back to / the Alien and Sedition Acts.\n> \n> 三位反对者中有两位——塞缪尔 / 阿利托和克拉伦斯·托马斯—— / 同意这一宪法逻辑 / 但在此事上有分歧 / 哪些亚利桑那规则相冲突 / 与联邦的**[xxx]**。 / 唯一主要的反对意见来自 / 安东宁·斯卡利亚大法官， / 他提出更加**[xxx]**的 / 对州特权的辩护 / 追溯到 / 《客籍法和镇压叛乱法》。\n\n本段先区分反对法官对宪法逻辑和具体规则的分歧，随后说斯卡利亚为州特权辩护，并追溯到题干中的法案。空格要补的是从这段引用和辩护关系能够推得的法案含义。\n\n接下来按A—D逐项看。","articleRects":[[274,1218,1123,37],[203,1264,1193,38],[202,1311,1194,38],[202,1358,1194,38],[202,1404,536,31]],"questionRects":[[226,951,1058,38],[281,1014,404,31],[280,1078,439,30],[280,1141,457,38],[280,1205,506,30]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"38","initialReadingPids":[4]},"html":"<h2>38题</h2>\n<blockquote><p>It can be inferred from Paragraph 5 that the Alien and Sedition Acts ______.<br />\n从第5段可以推断，《客籍法和镇压叛乱法》____。</p>\n</blockquote>\n<p>题干明示Paragraph 5，又点出the Alien and Sedition Acts，直接读第5段完整自然段，检查这组法案出现在哪一项论述中。</p>\n<blockquote><p>原文参考：</p>\n<p>Two of the three objecting Justices—Samuel Alito and Clarence Thomas— agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal <strong>[xxx]</strong>. The only major objection came from Justice Antonin Scalia, who offered an even more <strong>[xxx]</strong> defense of state privileges going back to the Alien and Sedition Acts.</p>\n<p>开始精读：</p>\n<p>Two of the three objecting Justices—Samuel / Alito and Clarence Thomas— / agreed with this Constitutional logic / but disagreed about / which Arizona rules conflicted / with the federal <strong>[xxx]</strong>. / The only major objection came / from Justice Antonin Scalia, / who offered an even more <strong>[xxx]</strong> / defense of state privileges / going back to / the Alien and Sedition Acts.</p>\n<p>三位反对者中有两位——塞缪尔 / 阿利托和克拉伦斯·托马斯—— / 同意这一宪法逻辑 / 但在此事上有分歧 / 哪些亚利桑那规则相冲突 / 与联邦的<strong>[xxx]</strong>。 / 唯一主要的反对意见来自 / 安东宁·斯卡利亚大法官， / 他提出更加<strong>[xxx]</strong>的 / 对州特权的辩护 / 追溯到 / 《客籍法和镇压叛乱法》。</p>\n</blockquote>\n<p>本段先区分反对法官对宪法逻辑和具体规则的分歧，随后说斯卡利亚为州特权辩护，并追溯到题干中的法案。空格要补的是从这段引用和辩护关系能够推得的法案含义。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"38题","raw":"### A. violated the Constitution\n\n> 违反了宪法。\n\n把A接回题干，它说的是：《客籍法和镇压叛乱法》违反了宪法。\n\nA说这些历史法案违宪。第5段前面确实有`Constitutional`，我们先看它在说谁，再回到法案所在的句子。\n\n> agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal **[xxx]**.\n\n> who offered an even more **[xxx]** defense of state privileges going back to the Alien and Sedition Acts.\n\n前一句说两位法官同意某种宪法逻辑，分歧是哪些亚利桑那规则与联邦规定冲突。这里谈的是本次案件中的规则。\n\n历史法案出现在后一句：斯卡利亚为州特权辩护，一直追溯到这些法案。句子没有接着说这些法案违反宪法。\n\nA把前面的宪法问题安到了后面的历史法案上。要这样选，至少得有一句把“这些法案”和“违宪”连起来；本段没有这句话。\n\n**两位法官讨论亚利桑那规则是否冲突，就能说明后面提到的历史法案违宪吗？**\n\n不能。前面讨论的是亚利桑那规则，后面的法案用于追溯州特权的辩护。\n\n**第一轮判断：A排除。**","articleRects":[[274,1218,1123,37],[203,1264,1193,38],[202,1311,1194,38],[202,1358,1194,38],[202,1404,536,31]],"questionRects":[[281,1014,404,31]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"38","paragraphPids":[4]},"html":"<h3>A. violated the Constitution</h3>\n<blockquote><p>违反了宪法。</p>\n</blockquote>\n<p>把A接回题干，它说的是：《客籍法和镇压叛乱法》违反了宪法。</p>\n<p>A说这些历史法案违宪。第5段前面确实有<code>Constitutional</code>，我们先看它在说谁，再回到法案所在的句子。</p>\n<blockquote><p>agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote><p>who offered an even more <strong>[xxx]</strong> defense of state privileges going back to the Alien and Sedition Acts.</p>\n</blockquote>\n<p>前一句说两位法官同意某种宪法逻辑，分歧是哪些亚利桑那规则与联邦规定冲突。这里谈的是本次案件中的规则。</p>\n<p>历史法案出现在后一句：斯卡利亚为州特权辩护，一直追溯到这些法案。句子没有接着说这些法案违反宪法。</p>\n<p>A把前面的宪法问题安到了后面的历史法案上。要这样选，至少得有一句把“这些法案”和“违宪”连起来；本段没有这句话。</p>\n<p><strong>两位法官讨论亚利桑那规则是否冲突，就能说明后面提到的历史法案违宪吗？</strong></p>\n<p>不能。前面讨论的是亚利桑那规则，后面的法案用于追溯州特权的辩护。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"38题","raw":"### B. stood in favor of the states\n\n> 站在支持各州的一边。\n\n把B接回题干，它说的是：《客籍法和镇压叛乱法》站在支持各州的一边。\n\nB说这些法案有利于各州。题干法案紧接在`defense of state privileges`之后，我们沿着这处往前读。\n\n> who offered an even more **[xxx]** defense of state privileges going back to the Alien and Sedition Acts.\n\n`defense`是辩护，`of state privileges`说明辩护的是州的特权。斯卡利亚为了这样辩护，把依据往前追溯到题干中的法案。\n\n如果这些法案接在这项辩护里，它们就是被拿来帮助说明州应该有这些权利的。B说站在支持各州的一边，正能接上这种用途。\n\n前面的**[xxx]**修饰辩护是什么样的，但`defense of state privileges`已经读得清，不需要先猜出那个形容词才能看出支持谁。\n\n**斯卡利亚为州特权辩护时追溯这些法案，能否据此推断它们在这里支持各州？**\n\n能。法案被用来支撑对州特权的辩护，B留下。\n\n**第一轮判断：B保留。**","articleRects":[[274,1218,1123,37],[203,1264,1193,38],[202,1311,1194,38],[202,1358,1194,38],[202,1404,536,31]],"questionRects":[[280,1078,439,30]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"38","paragraphPids":[4]},"html":"<h3>B. stood in favor of the states</h3>\n<blockquote><p>站在支持各州的一边。</p>\n</blockquote>\n<p>把B接回题干，它说的是：《客籍法和镇压叛乱法》站在支持各州的一边。</p>\n<p>B说这些法案有利于各州。题干法案紧接在<code>defense of state privileges</code>之后，我们沿着这处往前读。</p>\n<blockquote><p>who offered an even more <strong>[xxx]</strong> defense of state privileges going back to the Alien and Sedition Acts.</p>\n</blockquote>\n<p><code>defense</code>是辩护，<code>of state privileges</code>说明辩护的是州的特权。斯卡利亚为了这样辩护，把依据往前追溯到题干中的法案。</p>\n<p>如果这些法案接在这项辩护里，它们就是被拿来帮助说明州应该有这些权利的。B说站在支持各州的一边，正能接上这种用途。</p>\n<p>前面的<strong>[xxx]</strong>修饰辩护是什么样的，但<code>defense of state privileges</code>已经读得清，不需要先猜出那个形容词才能看出支持谁。</p>\n<p><strong>斯卡利亚为州特权辩护时追溯这些法案，能否据此推断它们在这里支持各州？</strong></p>\n<p>能。法案被用来支撑对州特权的辩护，B留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"38题","raw":"### C. supported the federal statute\n\n> 支持联邦法规。\n\n把C接回题干，它说的是：《客籍法和镇压叛乱法》支持联邦法规。\n\nC说支持的是`federal statute`，联邦法规。我们回到法案前的`defense of state privileges`，看原句直接写出的辩护对象。\n\n> The only major objection came from Justice Antonin Scalia, who offered an even more **[xxx]** defense of state privileges going back to the Alien and Sedition Acts.\n\n斯卡利亚提出反对意见，接着为州的特权辩护，最后才提到历史法案。我们据此推断法案的作用，要沿着他正在为谁辩护来读。\n\n原句写明的是`state privileges`，并没有把这次追溯用在支持联邦法规上。C却把支持对象从州这一边换到了联邦法规上。\n\n不能因为前一句也提到联邦，就把后一句的法案自动接过去。法案所在的这句话，已经有明确的`defense of`把它接向州。\n\n**题干法案被引来为州特权辩护，还是为联邦法规辩护？**\n\n是为州特权辩护。C没有接上这处用途。\n\n**第一轮判断：C排除。**","articleRects":[[274,1218,1123,37],[203,1264,1193,38],[202,1311,1194,38],[202,1358,1194,38],[202,1404,536,31]],"questionRects":[[280,1141,457,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"38","paragraphPids":[4]},"html":"<h3>C. supported the federal statute</h3>\n<blockquote><p>支持联邦法规。</p>\n</blockquote>\n<p>把C接回题干，它说的是：《客籍法和镇压叛乱法》支持联邦法规。</p>\n<p>C说支持的是<code>federal statute</code>，联邦法规。我们回到法案前的<code>defense of state privileges</code>，看原句直接写出的辩护对象。</p>\n<blockquote><p>The only major objection came from Justice Antonin Scalia, who offered an even more <strong>[xxx]</strong> defense of state privileges going back to the Alien and Sedition Acts.</p>\n</blockquote>\n<p>斯卡利亚提出反对意见，接着为州的特权辩护，最后才提到历史法案。我们据此推断法案的作用，要沿着他正在为谁辩护来读。</p>\n<p>原句写明的是<code>state privileges</code>，并没有把这次追溯用在支持联邦法规上。C却把支持对象从州这一边换到了联邦法规上。</p>\n<p>不能因为前一句也提到联邦，就把后一句的法案自动接过去。法案所在的这句话，已经有明确的<code>defense of</code>把它接向州。</p>\n<p><strong>题干法案被引来为州特权辩护，还是为联邦法规辩护？</strong></p>\n<p>是为州特权辩护。C没有接上这处用途。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"38题","raw":"### D. undermined the states’ interests\n\n> 损害了各州的利益。\n\n把D接回题干，它说的是：《客籍法和镇压叛乱法》损害各州利益。\n\nD说法案`undermined`州利益，即损害州利益。原句则用`defense`把这些法案连到州特权上，我们把两种作用对一下。\n\n> who offered an even more **[xxx]** defense of state privileges going back to the Alien and Sedition Acts.\n\n斯卡利亚正在为州特权作辩护，并追溯到这些法案。按这个写法，历史法案被拿来帮助他说明州应有的权利。\n\nD却说这些法案伤害了各州。若原文要这样说，得让我们看到法案怎样削弱州，或斯卡利亚怎样反对它们；这里实际写的是用它们来辩护。\n\n那个修饰`defense`的**[xxx]**虽不认识，也不会把已经读懂的“为州辩护”换成“损害州”。\n\n**原文把法案放在为州特权辩护的依据里，能读成法案损害州利益吗？**\n\n不能。这里的使用方向是支持州特权，D说成了损害。\n\n**第一轮判断：D排除。**","articleRects":[[274,1218,1123,37],[203,1264,1193,38],[202,1311,1194,38],[202,1358,1194,38],[202,1404,536,31]],"questionRects":[[280,1205,506,30]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"38","paragraphPids":[4]},"html":"<h3>D. undermined the states’ interests</h3>\n<blockquote><p>损害了各州的利益。</p>\n</blockquote>\n<p>把D接回题干，它说的是：《客籍法和镇压叛乱法》损害各州利益。</p>\n<p>D说法案<code>undermined</code>州利益，即损害州利益。原句则用<code>defense</code>把这些法案连到州特权上，我们把两种作用对一下。</p>\n<blockquote><p>who offered an even more <strong>[xxx]</strong> defense of state privileges going back to the Alien and Sedition Acts.</p>\n</blockquote>\n<p>斯卡利亚正在为州特权作辩护，并追溯到这些法案。按这个写法，历史法案被拿来帮助他说明州应有的权利。</p>\n<p>D却说这些法案伤害了各州。若原文要这样说，得让我们看到法案怎样削弱州，或斯卡利亚怎样反对它们；这里实际写的是用它们来辩护。</p>\n<p>那个修饰<code>defense</code>的<strong>[xxx]</strong>虽不认识，也不会把已经读懂的“为州辩护”换成“损害州”。</p>\n<p><strong>原文把法案放在为州特权辩护的依据里，能读成法案损害州利益吗？</strong></p>\n<p>不能。这里的使用方向是支持州特权，D说成了损害。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"38题","raw":"### 38题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n第一轮留下B。法案接在斯卡利亚为州特权辩护的历史追溯中，可以据此推断其在这里支持各州。","articleRects":[],"questionRects":[[226,951,1058,38],[281,1014,404,31],[280,1078,439,30],[280,1141,457,38],[280,1205,506,30]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"38"},"html":"<h3>38题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一轮留下B。法案接在斯卡利亚为州特权辩护的历史追溯中，可以据此推断其在这里支持各州。</p>\n"},{"section":"39题","raw":"## 39题\n\n> The White House claims that its power of enforcement ______.  \n> 白宫声称，其执法权____。\n\n题干点出The White House和claims，第6段既有The White House argued，又有the White House claimed，直接定位这一段并从头读到末尾。\n\n> 原文参考：\n> \n> The 8-0 objection to President Obama turns on what Justice Samuel Alito describes in his objection as “a shocking **[xxx]** of federal executive power. ” The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.\n> \n> 开始精读：\n> \n> The 8-0 objection to President Obama / turns on what Justice Samuel Alito / describes in his objection as / “a shocking **[xxx]** / of federal executive power. ” / The White House argued / that Arizona’s laws conflicted / with its enforcement priorities, / even if state laws complied / with federal statutes to the letter. / In effect, the White House claimed / that it could invalidate / any otherwise legitimate state law / that it disagrees with.\n> \n> 以8-0反对奥巴马总统 / 关键在于阿利托大法官 / 在反对意见中描述为 / “令人震惊的**[xxx]** / 关于联邦行政权力。” / 白宫辩称 / 亚利桑那的法律相抵触 / 与其执法的优先事项， / 即使州法律遵守 / 联邦法规达到逐字遵守。 / 实际上，白宫声称 / 它可以使其失效 / 任何原本合法的州法律 / 只要它不赞同。\n\n要补的是白宫自己声称执法权能做到什么，而非作者是否赞同。第6段先写白宫以执法优先事项为由评价州法，再用In effect解释这一说法意味着什么，需把这两句连起来核对。\n\n接下来按A—D逐项看。","articleRects":[[274,1451,1122,38],[202,1496,1189,40],[202,1545,1194,38],[202,1591,1189,38],[202,1638,1194,38],[202,1685,380,38]],"questionRects":[[226,1331,862,38],[1097,1363,110,7],[280,1395,527,38],[280,1458,517,38],[280,1522,553,37],[280,1585,475,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"39","initialReadingPids":[5]},"html":"<h2>39题</h2>\n<blockquote><p>The White House claims that its power of enforcement ______.<br />\n白宫声称，其执法权____。</p>\n</blockquote>\n<p>题干点出The White House和claims，第6段既有The White House argued，又有the White House claimed，直接定位这一段并从头读到末尾。</p>\n<blockquote><p>原文参考：</p>\n<p>The 8-0 objection to President Obama turns on what Justice Samuel Alito describes in his objection as “a shocking <strong>[xxx]</strong> of federal executive power. ” The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n<p>开始精读：</p>\n<p>The 8-0 objection to President Obama / turns on what Justice Samuel Alito / describes in his objection as / “a shocking <strong>[xxx]</strong> / of federal executive power. ” / The White House argued / that Arizona’s laws conflicted / with its enforcement priorities, / even if state laws complied / with federal statutes to the letter. / In effect, the White House claimed / that it could invalidate / any otherwise legitimate state law / that it disagrees with.</p>\n<p>以8-0反对奥巴马总统 / 关键在于阿利托大法官 / 在反对意见中描述为 / “令人震惊的<strong>[xxx]</strong> / 关于联邦行政权力。” / 白宫辩称 / 亚利桑那的法律相抵触 / 与其执法的优先事项， / 即使州法律遵守 / 联邦法规达到逐字遵守。 / 实际上，白宫声称 / 它可以使其失效 / 任何原本合法的州法律 / 只要它不赞同。</p>\n</blockquote>\n<p>要补的是白宫自己声称执法权能做到什么，而非作者是否赞同。第6段先写白宫以执法优先事项为由评价州法，再用In effect解释这一说法意味着什么，需把这两句连起来核对。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"39题","raw":"### A. outweighs that held by the states\n\n> 高于各州持有的执法权。\n\n把A接回题干，它说的是：白宫声称自己的执法权高于各州的执法权。\n\nA说白宫认为自己的执法权压过州。第6段末直接解释白宫声称能做什么，我们连着前面的`even if`一起看。\n\n> The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter.\n\n> In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.\n\n`even if`后面说，即使州法完全遵守联邦法规，白宫仍认为它与自己的执法优先事项冲突。\n\n下一句把这个意思说开：只要白宫不赞同，原本合法的州法也可以被它宣布无效。也就是说，州即使依法制定规定，白宫仍声称自己可以阻止它生效。\n\nA的`outweighs`正说这种谁压过谁的关系。题干问的是白宫的声称，不是问法院是否认可；这里先把白宫说的话接全就行。\n\n**连原本合法的州法都能因白宫不赞同而失效，是否就是白宫声称自己的权力压过州？**\n\n是。它认为自己的执法选择足以否定州法，A留下。\n\n**第一轮判断：A保留。**","articleRects":[[274,1451,1122,38],[202,1496,1189,40],[202,1545,1194,38],[202,1591,1189,38],[202,1638,1194,38],[202,1685,380,38]],"questionRects":[[280,1395,527,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"39","paragraphPids":[5]},"html":"<h3>A. outweighs that held by the states</h3>\n<blockquote><p>高于各州持有的执法权。</p>\n</blockquote>\n<p>把A接回题干，它说的是：白宫声称自己的执法权高于各州的执法权。</p>\n<p>A说白宫认为自己的执法权压过州。第6段末直接解释白宫声称能做什么，我们连着前面的<code>even if</code>一起看。</p>\n<blockquote><p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter.</p>\n</blockquote>\n<blockquote><p>In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n<p><code>even if</code>后面说，即使州法完全遵守联邦法规，白宫仍认为它与自己的执法优先事项冲突。</p>\n<p>下一句把这个意思说开：只要白宫不赞同，原本合法的州法也可以被它宣布无效。也就是说，州即使依法制定规定，白宫仍声称自己可以阻止它生效。</p>\n<p>A的<code>outweighs</code>正说这种谁压过谁的关系。题干问的是白宫的声称，不是问法院是否认可；这里先把白宫说的话接全就行。</p>\n<p><strong>连原本合法的州法都能因白宫不赞同而失效，是否就是白宫声称自己的权力压过州？</strong></p>\n<p>是。它认为自己的执法选择足以否定州法，A留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"39题","raw":"### B. is established by federal **[xxx]**\n\n> 由联邦**[xxx]**确立。\n\n把B接回题干，它说的是：白宫声称其执法权由联邦**[xxx]**确立。\n\nB说权力`is established by`某个联邦**[xxx]**，是在说权力从哪里来。原文也有`federal statutes`，我们看这个词接在谁后面。\n\n> even if state laws complied with federal statutes to the letter.\n\n> In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.\n\n原句是`state laws complied with federal statutes`：州法遵守联邦法规。联邦法规在这里用于说明州法本来是合法的。\n\n随后白宫声称，即使这样，它仍能使自己不赞同的州法无效。这两句都在说明它自认为能对州法做什么。\n\nB却改成某个联邦事物确立了白宫的权力。后面的名词虽被遮住，`is established by`仍明确要求一个赋予权力的来源；原文没有用这句话说明这种来源。\n\n**原文出现联邦法规，是说州法遵守它，还是说它确立了白宫的执法权？**\n\n是说州法遵守它。B另外接上了确立权力的说法。\n\n**第一轮判断：B排除。**","articleRects":[[274,1451,1122,38],[202,1496,1189,40],[202,1545,1194,38],[202,1591,1189,38],[202,1638,1194,38],[202,1685,380,38]],"questionRects":[[280,1458,517,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"39","paragraphPids":[5]},"html":"<h3>B. is established by federal <strong>[xxx]</strong></h3>\n<blockquote><p>由联邦<strong>[xxx]</strong>确立。</p>\n</blockquote>\n<p>把B接回题干，它说的是：白宫声称其执法权由联邦<strong>[xxx]</strong>确立。</p>\n<p>B说权力<code>is established by</code>某个联邦<strong>[xxx]</strong>，是在说权力从哪里来。原文也有<code>federal statutes</code>，我们看这个词接在谁后面。</p>\n<blockquote><p>even if state laws complied with federal statutes to the letter.</p>\n</blockquote>\n<blockquote><p>In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n<p>原句是<code>state laws complied with federal statutes</code>：州法遵守联邦法规。联邦法规在这里用于说明州法本来是合法的。</p>\n<p>随后白宫声称，即使这样，它仍能使自己不赞同的州法无效。这两句都在说明它自认为能对州法做什么。</p>\n<p>B却改成某个联邦事物确立了白宫的权力。后面的名词虽被遮住，<code>is established by</code>仍明确要求一个赋予权力的来源；原文没有用这句话说明这种来源。</p>\n<p><strong>原文出现联邦法规，是说州法遵守它，还是说它确立了白宫的执法权？</strong></p>\n<p>是说州法遵守它。B另外接上了确立权力的说法。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"39题","raw":"### C. is dependent on the states’ support\n\n> 依赖各州的支持。\n\n把C接回题干，它说的是：白宫声称其执法权依赖各州支持。\n\nC说白宫的执法权依靠州的支持。原文末句里决定州法是否失效的条件是`that it disagrees with`，我们看这个`it`是谁。\n\n> In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.\n\n`it`接白宫。白宫声称，只要自己不赞同某个州法，就能让它失效，哪怕州法原本合法。\n\n这里起作用的是白宫自己的选择。C却要求先由各州提供支持，白宫的执法权才有所依靠。\n\n原句没有写白宫先取得州的同意。恰恰是州已经制定的法，也可能被白宫按自己的意愿否定。\n\n**白宫声称自己可以否定州法，这句话是否把州的支持当成它行使权力的前提？**\n\n没有。原文写的是白宫凭自己的不赞同使州法失效，C说的依赖州支持没有出现。\n\n**第一轮判断：C排除。**","articleRects":[[274,1451,1122,38],[202,1496,1189,40],[202,1545,1194,38],[202,1591,1189,38],[202,1638,1194,38],[202,1685,380,38]],"questionRects":[[280,1522,553,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"39","paragraphPids":[5]},"html":"<h3>C. is dependent on the states’ support</h3>\n<blockquote><p>依赖各州的支持。</p>\n</blockquote>\n<p>把C接回题干，它说的是：白宫声称其执法权依赖各州支持。</p>\n<p>C说白宫的执法权依靠州的支持。原文末句里决定州法是否失效的条件是<code>that it disagrees with</code>，我们看这个<code>it</code>是谁。</p>\n<blockquote><p>In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n<p><code>it</code>接白宫。白宫声称，只要自己不赞同某个州法，就能让它失效，哪怕州法原本合法。</p>\n<p>这里起作用的是白宫自己的选择。C却要求先由各州提供支持，白宫的执法权才有所依靠。</p>\n<p>原句没有写白宫先取得州的同意。恰恰是州已经制定的法，也可能被白宫按自己的意愿否定。</p>\n<p><strong>白宫声称自己可以否定州法，这句话是否把州的支持当成它行使权力的前提？</strong></p>\n<p>没有。原文写的是白宫凭自己的不赞同使州法失效，C说的依赖州支持没有出现。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"39题","raw":"### D. rarely goes against state laws\n\n> 很少与州法相抵触。\n\n把D接回题干，它说的是：白宫声称其执法权很少与州法相抵触。\n\nD的`rarely`说很少发生，第6段的`could invalidate`说可以使州法失效。我们回看白宫声称的是行使权力的次数，还是能做什么。\n\n> In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.\n\n原文没有统计白宫与州法发生过多少次冲突。它说，只要白宫不赞同，就声称能使任何原本合法的州法失效。\n\n`any`后面还有`that it disagrees with`这一条件，不能简单用它证明现实中冲突一定很多。但这句话也绝不是在声明冲突很少。\n\nD把白宫对自己权限的说法换成了次数多少。即使我们不知道实际冲突频不频繁，仍能看出D没有把原来的声明说出来。\n\n**原文回答的是白宫可以否定哪些州法，还是白宫很少与州法冲突？**\n\n是前者。D的“很少”没有对应的次数说明。\n\n**第一轮判断：D排除。**","articleRects":[[274,1451,1122,38],[202,1496,1189,40],[202,1545,1194,38],[202,1591,1189,38],[202,1638,1194,38],[202,1685,380,38]],"questionRects":[[280,1585,475,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"39","paragraphPids":[5]},"html":"<h3>D. rarely goes against state laws</h3>\n<blockquote><p>很少与州法相抵触。</p>\n</blockquote>\n<p>把D接回题干，它说的是：白宫声称其执法权很少与州法相抵触。</p>\n<p>D的<code>rarely</code>说很少发生，第6段的<code>could invalidate</code>说可以使州法失效。我们回看白宫声称的是行使权力的次数，还是能做什么。</p>\n<blockquote><p>In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n<p>原文没有统计白宫与州法发生过多少次冲突。它说，只要白宫不赞同，就声称能使任何原本合法的州法失效。</p>\n<p><code>any</code>后面还有<code>that it disagrees with</code>这一条件，不能简单用它证明现实中冲突一定很多。但这句话也绝不是在声明冲突很少。</p>\n<p>D把白宫对自己权限的说法换成了次数多少。即使我们不知道实际冲突频不频繁，仍能看出D没有把原来的声明说出来。</p>\n<p><strong>原文回答的是白宫可以否定哪些州法，还是白宫很少与州法冲突？</strong></p>\n<p>是前者。D的“很少”没有对应的次数说明。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"39题","raw":"### 39题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一轮留下A。白宫声称自己的执法优先事项足以否定原本合法但自己不赞同的州法，体现其自认高于州执法权的立场。","articleRects":[],"questionRects":[[226,1331,862,38],[1097,1363,110,7],[280,1395,527,38],[280,1458,517,38],[280,1522,553,37],[280,1585,475,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"39"},"html":"<h3>39题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一轮留下A。白宫声称自己的执法优先事项足以否定原本合法但自己不赞同的州法，体现其自认高于州执法权的立场。</p>\n"},{"section":"40题","raw":"## 40题\n\n> What can be learned from the last paragraph?  \n> 从最后一段可以得知什么？\n\n题干直接指定the last paragraph，最后一段就是第7段，从Some powers开始完整读到Every Justice的判断。\n\n> 原文参考：\n> \n> Some powers do belong exclusively to the federal government, and control of citizenship and the borders is among them. But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in **[xxx]** asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this **[xxx]** claim.\n> \n> 开始精读：\n> \n> Some powers do belong exclusively / to the federal government, / and control of citizenship / and the borders is among them. / But if Congress wanted / to prevent states from using / their own resources / to check immigration status, / it could. / It never did so. / The Administration was in **[xxx]** asserting / that because it didn’t want / to carry out Congress’s immigration wishes, / no state should be allowed / to do so either. / Every Justice rightly rejected / this **[xxx]** claim.\n> \n> 某些权力确实专属 / 于联邦政府， / 而对公民身份的控制 / 及边境控制属于其中。 / 但如果国会想 / 阻止各州使用 / 它们自己的资源 / 去核查移民身份， / 它本可以这样做。 / 它从未这样做。 / 政府在**[xxx]**声称 / 因为它不愿意 / 执行国会的移民意愿， / 任何州都不应获准 / 同样这样做。 / 每位大法官正确地驳回 / 这一**[xxx]**主张。\n\n本段先谈联邦独有的部分权力，再区分国会能否禁止州核查身份与国会是否实际禁止，随后说明政府的主张及法官回应。题目要核对选项是否忠实表达这些权力、实际做法和回应之间的关系。\n\n接下来按A—D逐项看。","articleRects":[[274,1732,1122,37],[202,1778,1194,38],[203,1825,1193,38],[202,1872,1195,37],[202,1919,1194,37],[202,1965,964,38]],"questionRects":[[225,1712,728,38],[281,1775,812,38],[280,1839,876,38],[280,1902,933,38],[280,1966,915,37],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[6],"qid":"40","initialReadingPids":[6]},"html":"<h2>40题</h2>\n<blockquote><p>What can be learned from the last paragraph?<br />\n从最后一段可以得知什么？</p>\n</blockquote>\n<p>题干直接指定the last paragraph，最后一段就是第7段，从Some powers开始完整读到Every Justice的判断。</p>\n<blockquote><p>原文参考：</p>\n<p>Some powers do belong exclusively to the federal government, and control of citizenship and the borders is among them. But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in <strong>[xxx]</strong> asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this <strong>[xxx]</strong> claim.</p>\n<p>开始精读：</p>\n<p>Some powers do belong exclusively / to the federal government, / and control of citizenship / and the borders is among them. / But if Congress wanted / to prevent states from using / their own resources / to check immigration status, / it could. / It never did so. / The Administration was in <strong>[xxx]</strong> asserting / that because it didn’t want / to carry out Congress’s immigration wishes, / no state should be allowed / to do so either. / Every Justice rightly rejected / this <strong>[xxx]</strong> claim.</p>\n<p>某些权力确实专属 / 于联邦政府， / 而对公民身份的控制 / 及边境控制属于其中。 / 但如果国会想 / 阻止各州使用 / 它们自己的资源 / 去核查移民身份， / 它本可以这样做。 / 它从未这样做。 / 政府在<strong>[xxx]</strong>声称 / 因为它不愿意 / 执行国会的移民意愿， / 任何州都不应获准 / 同样这样做。 / 每位大法官正确地驳回 / 这一<strong>[xxx]</strong>主张。</p>\n</blockquote>\n<p>本段先谈联邦独有的部分权力，再区分国会能否禁止州核查身份与国会是否实际禁止，随后说明政府的主张及法官回应。题目要核对选项是否忠实表达这些权力、实际做法和回应之间的关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"40题","raw":"### A. Immigration issues are usually decided by Congress.\n\n> 移民问题通常由国会决定。\n\n把A接回题干，它说的是：最后一段表明移民问题通常由国会决定。\n\nA用`usually`说移民问题通常由国会决定。末段提到国会的句子用了`if`，我们看这个假设具体允许它做什么。\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so.\n\n原句说，国会如果想禁止各州利用自身资源核查移民身份，它可以这样做。紧接着说，国会从未这样做。\n\n这里先说明国会有这一项禁止的权力，再说明它没有使用。没有接着介绍各种移民问题一般由谁决定，也没有写“通常”的频率。\n\nA把一项具体权力扩成所有移民问题的一般决策安排。我们能知道国会可以下这道禁令，但仅靠这句还不能知道每类移民问题平时怎样决定。\n\n**国会有权禁止州自行核查身份，就能推成移民问题通常都由国会作决定吗？**\n\n不能。原文只说明这一项可以禁止却未禁止的事情，A说得更宽了。\n\n**第一轮判断：A排除。**","articleRects":[[274,1732,1122,37],[202,1778,1194,38],[203,1825,1193,38],[202,1872,1195,37],[202,1919,1194,37],[202,1965,964,38]],"questionRects":[[281,1775,812,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"40","paragraphPids":[6]},"html":"<h3>A. Immigration issues are usually decided by Congress.</h3>\n<blockquote><p>移民问题通常由国会决定。</p>\n</blockquote>\n<p>把A接回题干，它说的是：最后一段表明移民问题通常由国会决定。</p>\n<p>A用<code>usually</code>说移民问题通常由国会决定。末段提到国会的句子用了<code>if</code>，我们看这个假设具体允许它做什么。</p>\n<blockquote><p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so.</p>\n</blockquote>\n<p>原句说，国会如果想禁止各州利用自身资源核查移民身份，它可以这样做。紧接着说，国会从未这样做。</p>\n<p>这里先说明国会有这一项禁止的权力，再说明它没有使用。没有接着介绍各种移民问题一般由谁决定，也没有写“通常”的频率。</p>\n<p>A把一项具体权力扩成所有移民问题的一般决策安排。我们能知道国会可以下这道禁令，但仅靠这句还不能知道每类移民问题平时怎样决定。</p>\n<p><strong>国会有权禁止州自行核查身份，就能推成移民问题通常都由国会作决定吗？</strong></p>\n<p>不能。原文只说明这一项可以禁止却未禁止的事情，A说得更宽了。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"40题","raw":"### B. The Administration is dominant over immigration issues.\n\n> 政府在移民问题上居于支配地位。\n\n把B接回题干，它说的是：最后一段表明政府在移民问题上居于支配地位。\n\nB说行政当局居于支配地位。末段确实写了它不让州执行的要求，我们要连着下一句法官怎样回应一起看。\n\n> The Administration was in **[xxx]** asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either.\n\n> Every Justice rightly rejected this **[xxx]** claim.\n\n行政当局说，自己不想执行国会的移民意愿，所以各州也不该被允许去执行。这是它想控制各州行动的要求。\n\n下一句却说每一位法官都驳回了这项要求。作者加了`rightly`，还表示这样的驳回是对的。\n\n所以，我们读到的是政府试图让州跟着自己做，但这种要求没有被允许成立。B把它想取得的控制写成已经具有的支配地位，漏掉了驳回。\n\n**政府提出不许各州执行的要求，却被所有法官驳回，这能说明它已经居于支配地位吗？**\n\n不能。段末写出的结果恰恰限制了这种控制。\n\n**第一轮判断：B排除。**","articleRects":[[274,1732,1122,37],[202,1778,1194,38],[203,1825,1193,38],[202,1872,1195,37],[202,1919,1194,37],[202,1965,964,38]],"questionRects":[[280,1839,876,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"40","paragraphPids":[6]},"html":"<h3>B. The Administration is dominant over immigration issues.</h3>\n<blockquote><p>政府在移民问题上居于支配地位。</p>\n</blockquote>\n<p>把B接回题干，它说的是：最后一段表明政府在移民问题上居于支配地位。</p>\n<p>B说行政当局居于支配地位。末段确实写了它不让州执行的要求，我们要连着下一句法官怎样回应一起看。</p>\n<blockquote><p>The Administration was in <strong>[xxx]</strong> asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either.</p>\n</blockquote>\n<blockquote><p>Every Justice rightly rejected this <strong>[xxx]</strong> claim.</p>\n</blockquote>\n<p>行政当局说，自己不想执行国会的移民意愿，所以各州也不该被允许去执行。这是它想控制各州行动的要求。</p>\n<p>下一句却说每一位法官都驳回了这项要求。作者加了<code>rightly</code>，还表示这样的驳回是对的。</p>\n<p>所以，我们读到的是政府试图让州跟着自己做，但这种要求没有被允许成立。B把它想取得的控制写成已经具有的支配地位，漏掉了驳回。</p>\n<p><strong>政府提出不许各州执行的要求，却被所有法官驳回，这能说明它已经居于支配地位吗？</strong></p>\n<p>不能。段末写出的结果恰恰限制了这种控制。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"40题","raw":"### C. Justices wanted to strengthen its **[xxx]** with Congress.\n\n> 大法官们想加强其与国会的**[xxx]**。\n\n把C接回题干，它说的是：大法官们想加强其与国会的**[xxx]**。\n\nC说法官`wanted to strengthen`与国会的某种**[xxx]**。我们回看最后两句，分清法官拒绝的是什么，以及有没有说明他们想加强什么。\n\n> because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either.\n\n> Every Justice rightly rejected this **[xxx]** claim.\n\n政府不想执行国会的移民意愿，就要求州也不能执行；法官接着驳回的是这项要求。\n\nC把这一裁决解释成法官想加强自己与国会之间的某种关系。后面的名词被挡住了，但“想加强”这个目的已经写得很明确。\n\n原文没有说法官希望和国会走得更近或建立什么更强的联系。拒绝政府的要求，可以说明政府不能这样限制州，却不能再替法官加上另一个动机。\n\n**法官拒绝政府限制州的要求，就能知道他们是为了加强自己与国会的某种关系吗？**\n\n不能。原文说明了被拒绝的要求，没有说明C添加的这个目的。\n\n**第一轮判断：C排除。**","articleRects":[[274,1732,1122,37],[202,1778,1194,38],[203,1825,1193,38],[202,1872,1195,37],[202,1919,1194,37],[202,1965,964,38]],"questionRects":[[280,1902,933,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"40","paragraphPids":[6]},"html":"<h3>C. Justices wanted to strengthen its <strong>[xxx]</strong> with Congress.</h3>\n<blockquote><p>大法官们想加强其与国会的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把C接回题干，它说的是：大法官们想加强其与国会的<strong>[xxx]</strong>。</p>\n<p>C说法官<code>wanted to strengthen</code>与国会的某种<strong>[xxx]</strong>。我们回看最后两句，分清法官拒绝的是什么，以及有没有说明他们想加强什么。</p>\n<blockquote><p>because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either.</p>\n</blockquote>\n<blockquote><p>Every Justice rightly rejected this <strong>[xxx]</strong> claim.</p>\n</blockquote>\n<p>政府不想执行国会的移民意愿，就要求州也不能执行；法官接着驳回的是这项要求。</p>\n<p>C把这一裁决解释成法官想加强自己与国会之间的某种关系。后面的名词被挡住了，但“想加强”这个目的已经写得很明确。</p>\n<p>原文没有说法官希望和国会走得更近或建立什么更强的联系。拒绝政府的要求，可以说明政府不能这样限制州，却不能再替法官加上另一个动机。</p>\n<p><strong>法官拒绝政府限制州的要求，就能知道他们是为了加强自己与国会的某种关系吗？</strong></p>\n<p>不能。原文说明了被拒绝的要求，没有说明C添加的这个目的。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"40题","raw":"### D. Justices intended to check the power of the Administration.\n\n> 大法官们意在制约政府的权力。\n\n把D接回题干，它说的是：大法官们意在制约政府的权力。\n\nD说法官要`check the power`，制约行政当局的权力。我们看行政当局要求自己能管到哪一步，再看法官是否允许。\n\n> The Administration was in **[xxx]** asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either.\n\n> Every Justice rightly rejected this **[xxx]** claim.\n\n国会从未禁止州利用自身资源核查身份，行政当局却说，因为自己不想执行，各州也都不能执行。\n\n这样一来，政府就想把自己的不愿意，变成约束各州行动的理由。法官驳回这项主张，正是不让它取得这种权力。\n\nD说制约政府权力，具体制约的就是这里这一项：政府不能仅因自己不执行，就禁止州执行国会的要求。这能从裁决直接看出来。\n\n**法官不允许政府用自己的不愿意来阻止各州执行，是否是在限制政府所要求的权力？**\n\n是。裁决拒绝了政府扩到各州行动上的这一权力，D留下。\n\n**第一轮判断：D保留。**","articleRects":[[274,1732,1122,37],[202,1778,1194,38],[203,1825,1193,38],[202,1872,1195,37],[202,1919,1194,37],[202,1965,964,38]],"questionRects":[[280,1966,915,37],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"40","paragraphPids":[6]},"html":"<h3>D. Justices intended to check the power of the Administration.</h3>\n<blockquote><p>大法官们意在制约政府的权力。</p>\n</blockquote>\n<p>把D接回题干，它说的是：大法官们意在制约政府的权力。</p>\n<p>D说法官要<code>check the power</code>，制约行政当局的权力。我们看行政当局要求自己能管到哪一步，再看法官是否允许。</p>\n<blockquote><p>The Administration was in <strong>[xxx]</strong> asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either.</p>\n</blockquote>\n<blockquote><p>Every Justice rightly rejected this <strong>[xxx]</strong> claim.</p>\n</blockquote>\n<p>国会从未禁止州利用自身资源核查身份，行政当局却说，因为自己不想执行，各州也都不能执行。</p>\n<p>这样一来，政府就想把自己的不愿意，变成约束各州行动的理由。法官驳回这项主张，正是不让它取得这种权力。</p>\n<p>D说制约政府权力，具体制约的就是这里这一项：政府不能仅因自己不执行，就禁止州执行国会的要求。这能从裁决直接看出来。</p>\n<p><strong>法官不允许政府用自己的不愿意来阻止各州执行，是否是在限制政府所要求的权力？</strong></p>\n<p>是。裁决拒绝了政府扩到各州行动上的这一权力，D留下。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"40题","raw":"### 40题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一轮留下D。法官驳回政府以自身不愿执行为由禁止州执行的要求，这一裁决限制了政府所主张的权力。","articleRects":[],"questionRects":[[225,1712,728,38],[281,1775,812,38],[280,1839,876,38],[280,1902,933,38],[280,1966,915,37],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"40"},"html":"<h3>40题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一轮留下D。法官驳回政府以自身不愿执行为由禁止州执行的要求，这一裁决限制了政府所主张的权力。</p>\n"},{"section":"进阶方法","raw":"### 把还没细读的段落接上\n\n> 原文参考：\n> \n> On a five to three vote, the Supreme Court knocked out much of Arizona’s immigration law Monday—a **[xxx]** policy victory for the Obama Administration. But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration’s effort to upset the balance of power between the federal government and the states.\n> \n> 开始精读：\n> \n> On a five to three vote, / the Supreme Court knocked out / much of Arizona’s immigration law / Monday—a **[xxx]** policy victory / for the Obama Administration. / But on the more important matter / of the Constitution, / the decision was an 8-0 defeat / for the Administration’s effort / to upset the balance of power / between the federal government / and the states.\n> \n> 以五比三的票数， / 最高法院废除了 / 亚利桑那移民法的大部分 / 在星期一——**[xxx]**政策胜利 / 对奥巴马政府而言。 / 但在更重要的事情上 / 即宪法方面， / 该判决是8-0的失败 / 对于政府的努力 / 去打破权力平衡 / 在联邦政府 / 与各州之间。","articleRects":[[274,279,1122,47],[202,330,1186,38],[202,377,1194,37],[202,423,1194,38],[202,470,501,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_reading","readingPids":[1],"role":"whole_text_precision","paragraphPids":[0]},"html":"<h3>把还没细读的段落接上</h3>\n<blockquote><p>原文参考：</p>\n<p>On a five to three vote, the Supreme Court knocked out much of Arizona’s immigration law Monday—a <strong>[xxx]</strong> policy victory for the Obama Administration. But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration’s effort to upset the balance of power between the federal government and the states.</p>\n<p>开始精读：</p>\n<p>On a five to three vote, / the Supreme Court knocked out / much of Arizona’s immigration law / Monday—a <strong>[xxx]</strong> policy victory / for the Obama Administration. / But on the more important matter / of the Constitution, / the decision was an 8-0 defeat / for the Administration’s effort / to upset the balance of power / between the federal government / and the states.</p>\n<p>以五比三的票数， 何占据、州做了什么和权力性质仍有<strong>[xxx]</strong>，不能补成具体动作。</td><td>继续说明州与联邦之间的法律权限问题。</td></tr><tr><td>第4段</td><td>would be allowed to verify the legal status；cooperate with federal colleagues</td><td>However转出未被否定的州行动，would be allowed to verify the legal status明确允许州警察核查身份；explicitly encourages与cooperate with federal colleagues给出国会鼓励合作的理由，说明推翻部分条款并没有否定州参与执法。</td><td>转向获准的州执法行动，区分部分条款被推翻与合作执法被允许。</td></tr><tr><td>第5段</td><td>agreed with this Constitutional logic；disagreed about which Arizona rules</td><td>补充法官内部的赞同与分歧，agreed with this Constitutional logic与disagreed about which Arizona rules将原则和具体规则区分开；斯卡利亚另作defense of state privileges，并把辩护追溯到历史法案。</td><td>把共同认可的原则与法官对具体规则的分歧分开。</td></tr><tr><td>第6段</td><td>complied with federal statutes to the letter；invalidate any otherwise legitimate state law</td><td>转回开头的8-0 objection，说明白宫声称即使州法complied with federal statutes to the letter，仍可invalidate any otherwise legitimate state law，只因为不赞同；这与前面法律层面的州与联邦分界不同，焦点转为行政当局能否凭自身意愿否定州法。</td><td>转回行政当局的权力主张，与前面的法律权限问题区分。</td></tr><tr><td>第7段</td><td>Some powers do belong exclusively to the federal government；It never did so</td><td>先承认Some powers do belong exclusively to the federal government，再区分国会能够禁止州核查与It never did so；政府却把自己不愿执行国会意愿变成不准州执行的理由。Every Justice rightly rejected对此作出否定，回应第1段的宪法层面失败。</td><td>区分国会依法限制州权与政府不愿执法，收束对行政权主张的批评。</td></tr></tbody></table>\n<p>全文观点：判决可以推翻涉及州与联邦法律权限的部分条款，同时认可州参与移民执法；联邦法律的优先地位不能被行政当局改成“自己不愿执行，州也不得执行”的权力。作者赞同法官驳回这种行政权力主张，维护联邦与州之间的权力安排。</p>\n"},{"section":"进阶回查","raw":"## 回查36题：A还是C？\n\nA. overstepped the authority of federal immigration law\n\nC. deprived the federal police of Constitutional powers\n\nA说三项条款越过联邦移民法的权限；C说它们剥夺了联邦警察的宪法权力。\n\n第一遍没有读清第3段对联邦权力所做的动作，所以留下A、C。现在读完全文，先回来找“谁拥有权力”和“谁负责执行”各写在哪里。\n\n第1段说争议涉及：\n\n> the balance of power between the federal government and the states\n\n这里是联邦政府与州之间的权力平衡。第2段又明确说联邦法优先于州法。被推翻的是州制定的条款，所以A说州的条款越过联邦法权限，能接上这一部分。\n\n警察出现在哪里？第4段写：\n\n> Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.\n>\n> explicitly encourages state officers to share information and cooperate with federal colleagues\n\n警察在这里做的是核查身份，官员之间做的是分享信息、合作。到末段，决定能否禁止州核查的又是国会：\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so.\n\n所以文章一直把法律制定、政府权限和具体执法分开。C说的“联邦警察自己的宪法权力被剥夺”，不能仅凭前面出现过警察、后面出现过联邦权力就把它们接起来。\n\n**全文写明州条款受到的是联邦法律权限的限制，还是联邦警察个人拥有的宪法权力被拿走？**\n\n是前者。警察承担的是核查与合作，文章没有把联邦法律的权限写成联邦警察自身的宪法权力。A能够接住条款被推翻的原因，C把两处内容接错了。\n\n> **36题选A。**","articleRects":[[274,517,1123,38],[202,563,1194,38],[202,610,1194,38],[202,655,1194,40],[202,704,1194,37],[202,750,772,38],[273,797,1123,38],[202,844,1194,36],[202,890,1194,38],[202,936,1134,39],[274,279,1122,47],[202,330,1186,38],[202,377,1194,37],[202,423,1194,38],[202,470,501,38],[274,984,1122,38],[202,1031,1194,37],[202,1078,1195,37],[203,1124,1193,38],[202,1171,272,38],[274,1451,1122,38],[202,1496,1189,40],[202,1545,1194,38],[202,1591,1189,38],[202,1638,1194,38],[202,1685,380,38],[274,1732,1122,37],[202,1778,1194,38],[203,1825,1193,38],[202,1872,1195,37],[202,1919,1194,37],[202,1965,964,38]],"questionRects":[[226,190,1008,38],[281,253,817,38],[280,317,810,38],[280,380,804,38],[280,444,729,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","C"],"newEvidencePids":[1,4,6,7],"finalChoice":"A","qid":"36","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查36题：A还是C？</h2>\n<p>A. overstepped the authority of federal immigration law</p>\n<p>C. deprived the federal police of Constitutional powers</p>\n<p>A说三项条款越过联邦移民法的权限；C说它们剥夺了联邦警察的宪法权力。</p>\n<p>第一遍没有读清第3段对联邦权力所做的动作，所以留下A、C。现在读完全文，先回来找“谁拥有权力”和“谁负责执行”各写在哪里。</p>\n<p>第1段说争议涉及：</p>\n<blockquote><p>the balance of power between the federal government and the states</p>\n</blockquote>\n<p>这里是联邦政府与州之间的权力平衡。第2段又明确说联邦法优先于州法。被推翻的是州制定的条款，所以A说州的条款越过联邦法权限，能接上这一部分。</p>\n<p>警察出现在哪里？第4段写：</p>\n<blockquote><p>Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.</p>\n<p>explicitly encourages state officers to share information and cooperate with federal colleagues</p>\n</blockquote>\n<p>警察在这里做的是核查身份，官员之间做的是分享信息、合作。到末段，决定能否禁止州核查的又是国会：</p>\n<blockquote><p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so.</p>\n</blockquote>\n<p>所以文章一直把法律制定、政府权限和具体执法分开。C说的“联邦警察自己的宪法权力被剥夺”，不能仅凭前面出现过警察、后面出现过联邦权力就把它们接起来。</p>\n<p><strong>全文写明州条款受到的是联邦法律权限的限制，还是联邦警察个人拥有的宪法权力被拿走？</strong></p>\n<p>是前者。警察承担的是核查与合作，文章没有把联邦法律的权限写成联邦警察自身的宪法权力。A能够接住条款被推翻的原因，C把两处内容接错了。</p>\n<blockquote><p><strong>36题选A。</strong></p>\n</blockquote>\n"},{"section":"进阶回查","raw":"## 回查37题：C还是D？\n\nC. States’ legitimate role in immigration enforcement.\n\nD. Congress’s intervention in immigration enforcement.\n\nC说州可以合法参与移民执法；D说国会介入移民执法。第4段确实同时写了州和国会，第一遍有个动作未读懂，所以两项都留下了。\n\n我们现在把这段的两句重新连起来：\n\n> However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.\n>\n> That’s because Congress has always **[xxx]** joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.\n\n法官`said`后面先给出了许可：州警察可以核查身份。下一句`That’s because`再解释为什么可以：国会对联合执法有所安排，并鼓励合作。\n\n两句话都重要，但各自在回答不同的问题。第一句回答州能不能做；第二句说明为什么能做。题干问大法官同意了哪件事，要接的是他们给出的许可。\n\n末段又把争议写得很具体：\n\n> because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either.\n>\n> Every Justice rightly rejected this **[xxx]** claim.\n\n行政当局希望州也不能执行，法官不同意。因此，第4段允许州核查，和末段拒绝阻止州执行，前后接的都是州能否参与执法。\n\n**大法官实际认可的是州警察可以核查身份，还是把国会的行为本身当成待认可的事项？**\n\n是州警察可以核查身份。国会的安排是允许州参与的理由。D拿理由里的国会行为代替了法官作出的许可，C才把这项许可说出来。\n\n> **37题选C。**","articleRects":[[274,984,1122,38],[202,1031,1194,37],[202,1078,1195,37],[203,1124,1193,38],[202,1171,272,38],[274,1451,1122,38],[202,1496,1189,40],[202,1545,1194,38],[202,1591,1189,38],[202,1638,1194,38],[202,1685,380,38],[274,1732,1122,37],[202,1778,1194,38],[203,1825,1193,38],[202,1872,1195,37],[202,1919,1194,37],[202,1965,964,38]],"questionRects":[[226,570,1181,38],[280,634,802,38],[280,697,909,38],[280,761,789,38],[280,824,812,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["C","D"],"newEvidencePids":[6,7],"finalChoice":"C","qid":"37","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查37题：C还是D？</h2>\n<p>C. States’ legitimate role in immigration enforcement.</p>\n<p>D. Congress’s intervention in immigration enforcement.</p>\n<p>C说州可以合法参与移民执法；D说国会介入移民执法。第4段确实同时写了州和国会，第一遍有个动作未读懂，所以两项都留下了。</p>\n<p>我们现在把这段的两句重新连起来：</p>\n<blockquote><p>However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.</p>\n<p>That’s because Congress has always <strong>[xxx]</strong> joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n</blockquote>\n<p>法官<code>said</code>后面先给出了许可：州警察可以核查身份。下一句<code>That’s because</code>再解释为什么可以：国会对联合执法有所安排，并鼓励合作。</p>\n<p>两句话都重要，但各自在回答不同的问题。第一句回答州能不能做；第二句说明为什么能做。题干问大法官同意了哪件事，要接的是他们给出的许可。</p>\n<p>末段又把争议写得很具体：</p>\n<blockquote><p>because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either.</p>\n<p>Every Justice rightly rejected this <strong>[xxx]</strong> claim.</p>\n</blockquote>\n<p>行政当局希望州也不能执行，法官不同意。因此，第4段允许州核查，和末段拒绝阻止州执行，前后接的都是州能否参与执法。</p>\n<p><strong>大法官实际认可的是州警察可以核查身份，还是把国会的行为本身当成待认可的事项？</strong></p>\n<p>是州警察可以核查身份。国会的安排是允许州参与的理由。D拿理由里的国会行为代替了法官作出的许可，C才把这项许可说出来。</p>\n<blockquote><p><strong>37题选C。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**36. A**\n\n**37. C**\n\n**38. B**\n\n**39. A**\n\n**40. D**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>36. A</strong></p>\n<p><strong>37. C</strong></p>\n<p><strong>38. B</strong></p>\n<p><strong>39. A</strong></p>\
