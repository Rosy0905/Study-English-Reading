{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>大法官们认可的是：国会介入移民执法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>国会确实设想并鼓励联合执法，但这是because引出的理由。法官共同允许的是州警察核查身份，D把理由中出现的国会当成了被认可事项的主体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement. That’s because Congress has always envisioned joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>大法官们认可的是：国会介入移民执法。</p>\n</blockquote>\n<p><code>envisioned</code>说明国会一直设想联邦与州共同执法，<code>explicitly encourages</code>再说它明确鼓励信息共享和合作。因此，国会确实对执法安排有所作为，不能将D排成“文中没有国会”。</p>\n<p>但题干问<code>On which ... did the Justices agree</code>，要找法官认可的事项。第4段第一句的the Justices said直接接<code>Arizona police would be allowed to verify</code>，许可的是州警察核查身份。</p>\n<p>第二句以<code>That’s because</code>开头，国会的安排是这项许可的依据。D抓到了原因中的主体，却没有转述许可本身；C的州具有合法角色才同时接住法院认可与核查这一具体工作。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement. That’s because Congress has always envisioned joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n<p>然而，大法官们说，亚利桑那州警察可以核查在执法中接触的人的合法身份。这是因为国会一直设想联邦与州联合执行移民法，并明确鼓励州官员分享信息、与联邦同僚合作。</p>\n</blockquote>\n<p>作者先写the Justices said后的许可，再以That’s because追溯许可依据。国会的作用服务于解释州为何能做这项工作。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Justices agreed on Congress’s intervention in immigration enforcement.</p>\n<p>大法官们认可的是：国会介入移民执法。</p>\n</blockquote>\n<p>要选D，段落应把国会介入本身作为法官赞同的议题。实际首先得到回答的是州的执法角色，不能用原因中的行为者替换结论中的行为者。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"37题结论","raw":"### 37题结论\n\n> **37. C**\n\n- A：法院允许州警察核查身份，并鼓励共同执法。许可的是法律框架内的工作，不能据此说各州独立于所执行的联邦移民法。\n- B：原文鼓励州官员分享信息，B却说联邦官员有义务隐瞒信息。官员所属一方和信息流动的方向都发生变化。\n- C：would be allowed说明州的参与获准，核查身份、分享信息与合作说明参与的具体内容。C的legitimate role同时对应这两部分。\n- D：国会确实设想并鼓励联合执法，但这是because引出的理由。法官共同允许的是州警察核查身份，D把理由中出现的国会当成了被认可事项的主体。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"37","questionConclusion":true},"html":"<blockquote>\n<p><strong>37. C</strong></p>\n</blockquote>\n<ul>\n<li>A：法院允许州警察核查身份，并鼓励共同执法。许可的是法律框架内的工作，不能据此说各州独立于所执行的联邦移民法。</li>\n<li>B：原文鼓励州官员分享信息，B却说联邦官员有义务隐瞒信息。官员所属一方和信息流动的方向都发生变化。</li>\n<li>C：would be allowed说明州的参与获准，核查身份、分享信息与合作说明参与的具体内容。C的legitimate role同时对应这两部分。</li>\n<li>D：国会确实设想并鼓励联合执法，但这是because引出的理由。法官共同允许的是州警察核查身份，D把理由中出现的国会当成了被认可事项的主体。</li>\n</ul>\n"},{"title":"38题 · 题干、题型与核心出处","raw":"## 38题\n\n> It can be inferred from Paragraph 5 that the Alien and Sedition Acts ______.\n>\n> 从第5段可以推断，《客籍法和镇压叛乱法》____。\n\n### 题型\n\n推断题：法案的作用没有单列结论，要根据斯卡利亚援引它们为谁辩护来推断。\n\n题干明示Paragraph 5，又点出the Alien and Sedition Acts，直接读第5段完整自然段，检查这组法案出现在哪一项论述中。\n\n### 核心出处\n\n> agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute\n>\n> who offered an even more robust defense of state privileges going back to the Alien and SeditionActs\n>\n> The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"38","questionIntro":true},"html":"<blockquote>\n<p>It can be inferred from Paragraph 5 that the Alien and Sedition Acts ______.</p>\n<p>从第5段可以推断，《客籍法和镇压叛乱法》____。</p>\n</blockquote>\n<h3>题型</h3>\n<p>推断题：法案的作用没有单列结论，要根据斯卡利亚援引它们为谁辩护来推断。</p>\n<p>题干明示Paragraph 5，又点出the Alien and Sedition Acts，直接读第5段完整自然段，检查这组法案出现在哪一项论述中。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute</p>\n<p>who offered an even more robust defense of state privileges going back to the Alien and SeditionActs</p>\n<p>The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs</p>\n</blockquote>\n"},{"title":"A. violated the Constitution","raw":"### A. violated the Constitution\n\n> 从第5段可推得，这些历史法案违反了宪法。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n第5段的宪法逻辑涉及亚利桑那规则是否冲突；历史法案出现在斯卡利亚为州权辩护的叙述中。A把两句的对象接错了。\n\n**出处：**\n\n> Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>从第5段可推得，这些历史法案违反了宪法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>第5段的宪法逻辑涉及亚利桑那规则是否冲突；历史法案出现在斯卡利亚为州权辩护的叙述中。A把两句的对象接错了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.</p>\n</blockquote>\n</section>"},{"title":"A. violated the Constitution","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 从第5段可推得，这些历史法案违反了宪法。\n\n第5段的宪法逻辑涉及亚利桑那规则是否冲突；历史法案出现在斯卡利亚为州权辩护的叙述中。A把两句的对象接错了。\n\n作者先介绍两名法官对原则和具体条款的不同态度，再介绍斯卡利亚向历史追溯的州权辩护。\n\nA需要一句明确评判这些历史法案违宪的话。实际没有把前句对亚利桑那规则的争议移到后句法案上，出现Constitutional不能单独构成违宪判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>从第5段可推得，这些历史法案违反了宪法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>第5段的宪法逻辑涉及亚利桑那规则是否冲突；历史法案出现在斯卡利亚为州权辩护的叙述中。A把两句的对象接错了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>从第5段可推得，这些历史法案违反了宪法。</p>\n</blockquote>\n<p>第5段的宪法逻辑涉及亚利桑那规则是否冲突；历史法案出现在斯卡利亚为州权辩护的叙述中。A把两句的对象接错了。</p>\n<p>作者先介绍两名法官对原则和具体条款的不同态度，再介绍斯卡利亚向历史追溯的州权辩护。</p>\n<p>A需要一句明确评判这些历史法案违宪的话。实际没有把前句对亚利桑那规则的争议移到后句法案上，出现Constitutional不能单独构成违宪判断。</p>\n</section>"},{"title":"A. violated the Constitution","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.\n>\n> 三名持异议的大法官中，阿利托与托马斯同意这一宪法逻辑，却对哪些亚利桑那规则与联邦法规冲突有分歧。主要的反对意见来自斯卡利亚，他为州特权作了更有力的辩护，并追溯至《客籍法和镇压叛乱法》。\n\n作者先介绍两名法官对原则和具体条款的不同态度，再介绍斯卡利亚向历史追溯的州权辩护。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The Alien and Sedition Acts violated the Constitution.\n>\n> 从第5段可推得，这些历史法案违反了宪法。\n\nA需要一句明确评判这些历史法案违宪的话。实际没有把前句对亚利桑那规则的争议移到后句法案上，出现Constitutional不能单独构成违宪判断。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>从第5段可推得，这些历史法案违反了宪法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>第5段的宪法逻辑涉及亚利桑那规则是否冲突；历史法案出现在斯卡利亚为州权辩护的叙述中。A把两句的对象接错了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitu h the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>从第5段可推得，这些历史法案支持各州。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法案被放在为州特权辩护的历史依据中。沿着defense of state privileges与going back to的连接，能推得它们在这里支持州这一方。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.</p>\n</blockquote>\n</section>"},{"title":"B. stood in favor of the states","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 从第5段可推得，这些历史法案支持各州。\n\n`stood in favor of the states`要看法案被用于支持哪方，第5段的`defense of state privileges`明确说斯卡利亚为州特权辩护，而`going back to`把这一辩护接到法案，因此回看段末这句话。\n\n原文直接写`defense of state privileges`：斯卡利亚在为州特权辩护，这一辩护追溯到题干法案。`B`的`stood in favor of the states`不是原句逐字说出的法案评价，而是据其在辩护中的用途推断法案有利于各州。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-B-1","html":"<section class=\"revealPart op ivileges going back to the Alien and SeditionActs.</p>\n<p>三名持异议的大法官中，阿利托与托马斯同意这一宪法逻辑，却对哪些亚利桑那规则与联邦法规冲突有分歧。主要的反对意见来自斯卡利亚，他为州特权作了更有力的辩护，并追溯至《客籍法和镇压叛乱法》。</p>\n</blockquote>\n<p>斯卡利亚提出更强的州权辩护，再将这项辩护追溯到历史法案。追溯的用途由前面的辩护对象限定。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Alien and Sedition Acts stood in favor of the states.</p>\n<p>从第5段可推得，这些历史法案支持各州。</p>\n</blockquote>\n<p>B保留了这段话的支持方向，不是根据法案名字猜历史立场。它概括的是文章把法案用于支持谁，没有进一步补充法案的具体条文。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n</section>"},{"title":"C. supported the federal statute","raw":"### C. supported the federal statute\n\n> 从第5段可推得，这些历史法案支持联邦法规。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\n历史法案接在defense of state privileges之后，支持对象是州特权。C改成联邦法规，与本句安排的辩护方向不符。\n\n**出处：**\n\n> Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-C-0\"><blockquote>\n<p>从第5段可推得，这些历史法案支持联邦法规。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>历史法案接在defense of state privileges之后，支持对象是州特权。C改成联邦法规，与本句安排的辩护方向不符。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice ":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>从第5段可推得，这些历史法案损害了各州的利益。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>斯卡利亚援引法案加强州权辩护，D却说法案损害各州利益，改变了材料在这段中的支持方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.</p>\n</blockquote>\n</section>"},{"title":"D. undermined the states’ interests","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 从第5段可推得，这些历史法案损害了各州的利益。\n\n`undermined the states’ interests`把法案的作用写成伤害各州，而第5段的`defense of state privileges`把法案连到保护州特权的辩护，因此回看段末的追溯关系。\n\n原文写的是`defense of state privileges`，并把这项对州特权的辩护追溯到法案。`D`的`undermined the states’ interests`把法案与各州的关系说成损害。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>从第5段可推得，这些历史法案损害了各州的利益。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>斯卡利亚援引法案加强州权辩护，D却说法案损害各州利益，改变了材料在这段中的支持方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从第5段可推得，这些历史法案损害了各州的利益。</p>\n</blockquote>\n<p><code>undermined the states’ interests</code>把法案的作用写成伤害各州，而第5段的<code>defense of state privileges</code>把法案连到保护州特权的辩护，因此回看段末的追溯关系。</p>\n<p>原文写的是<code>defense of state privileges</code>，并把这项对州特权的辩护追溯到法案。<code>D</code>的<code>undermined the states’ interests</code>把法案与各州的关系说成损害。</p>\n</section>"},{"title":"D. undermined the states’ interests","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.\n>\n> 三名持异议的大法官中，阿利托与托马斯同意这一宪法逻辑，却对哪些亚利桑那规则与联邦法规冲突有分歧。主要的反对意见来自斯卡利亚，他为州特权作了更有力的辩护，并追溯至《客籍法和镇压叛乱法》。\n\n更有力的辩护和历史追溯接在一起，作者没有叙述斯卡利亚批评这些法案损害州权。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The Alien and Sedition Acts undermined the states’ interests.\n>\n> 从第5段可推得，这些历史法案损害了各州的利益。\n\nD需要出现法案怎样削弱州利益的关系。实际说明法案被用来支撑州特权；仅有同一个states，并不能使支持和损害成为相同意思。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>从第5段可推得，这些历史法案损害了各州的利益。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>斯卡利亚援引法案加强州权辩护，D却说法案损害各州利益，改变了材料在这段中的支持方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从第5段可推得，这些历史法案损害了各州的利益。</p>\n</blockquote>\n<p><code>undermined the states’ interests</code>把法案的作用写成伤害各州，而第5段的<code>defense of state privileges</code>把法案连到保护州特权的辩护，因此回看段末的追溯关系。</p>\n<p>原文写的是<code>defense of state privileges</code>，并把这项对州特权的辩护追溯到法案。<code>D</code>的<code>undermined the states’ interests</code>把法案与各州的关系说成损害。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.</p>\n<p>三名持异议的大法官中，阿利托与托马斯同意这一宪法逻辑，却对哪些亚利桑那规则与联邦法规冲突有分歧。主要的反对意见来自斯卡利亚，他为州特权作了更有力的辩护，并追溯至《客籍法和镇压叛乱法》。</p>\n</blockquote>\n<p>更有力的辩护和历史追溯接在一起，作者没有叙述斯卡利亚批评这些法案损害州权。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Alien and Sedition Acts undermined the states’ interests.</p>\n<p>从第5段可推得，这些历史法案损害了各州的利益。</p>\n</blockquote>\n<p>D需要出现法案怎样削弱州利益的关系。实际说明法案被用来支撑州特权；仅有同一个states，并不能使支持和损害成为相同意思。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"38题结论","raw":"### 38题结论\n\n> **38. B**\n\n- A：第5段的宪法逻辑涉及亚利桑那规则是否冲突；历史法案出现在斯卡利亚为州权辩护的叙述中。A把两句的对象接错了。\n- B：法案被放在为州特权辩护的历史依据中。沿着defense of state privileges与going back to的连接，能推得它们在这里支持州这一方。\n- C：历史法案接在defense of state privileges之后，支持对象是州特权。C改成联邦法规，与本句安排的辩护方向不符。\n- D：斯卡利亚援引法案加强州权辩护，D却说法案损害各州利益，改变了材料在这段中的支持方向。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"38","questionConclusion":true},"html":"<blockquote>\n<p><strong>38. B</strong></p>\n</blockquote>\n<ul>\n<li>A：第5段的宪法逻辑涉及亚利桑那规则是否冲突；历史法案出现在斯卡利亚为州权辩护的叙述中。A把两句的对象接错了。</li>\n<li>B：法案被放在为州特权辩护的历史依据中。沿着defense of state privileges与going back to的连接，能推得它们在这里支持州这一方。</li>\n<li>C：历史法案接在defense of state privileges之后，支持对象是州特权。C改成联邦法规，与本句安排的辩护方向不符。</li>\n<li>D：斯卡利亚援引法案加强州权辩护，D却说法案损害各州利益，改变了材料在这段中的支持方向。</li>\n</ul>\n"},{"title":"39题 · 题干、题型与核心出处","raw":"## 39题\n\n> The White House claims that its power of enforcement ______.\n>\n> 白宫声称，其执法权____。\n\n### 题型\n\n观点细节题：问白宫声称什么，先准确转述其权限主张，再与作者、法院的立场分开。\n\n题干点出The White House和claims，第6段既有The White House argued，又有the White House claimed，直接定位这一段并从头读到末尾。\n\n### 核心出处\n\n> The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter.\n>\n> In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.\n>\n> even if state laws complied with federal statutes to the letter.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"39","questionIntro":true},"html":"<blockquote>\n<p>The White House claims that its power of enforcement ______.</p>\n<p>白宫声称，其执法权____。</p>\n</blockquote>\n<h3>题型</h3>\n<p>观点细节题：问白宫声称什么，先准确转述其权限主张，再与作者、法院的立场分开。</p>\n<p>题干点出The White House和claims，第6段既有The White House argued，又有the White House claimed，直接定位这一段并从头读到末尾。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter.</p>\n<p>In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n<p>even if state laws complied with federal statutes to the letter.</p>\n</blockquote>\n"},{"title":"A. outweighs that held by the states","raw":"### A. outweighs that held by the states\n\n> 白宫声称自己的执法权高于各州的执法权。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n即使州法遵守联邦法规，白宫仍声称可因自己不同意而使它失效。A的outweighs对应其自称能够压过州依法行动的权力。\n\n**出处：**\n\n> The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>白宫声称自己的执法权高于各州的执法权。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>即使州法遵守联邦法规，白宫仍声称可因自己不同意而使它失效。A的outweighs对应其自称能够压过州依法行动的权力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n</section>"},{"title":"A. outweighs that held by the states","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 白宫声称自己的执法权高于各州的执法权。\n\n`outweighs`要核对谁能压过谁，第6段的`invalidate any otherwise legitimate state law`写白宫主张可以使州法失效，因此回看这一句及前面`even if`引出的条件。\n\n原文说白宫把自己的执法优先事项放在州法之前，即使州法逐字遵守联邦法规，仍声称可以`invalidate any otherwise legitimate state law`，只因自己不赞同。`A`的`outweighs`概括了这种权力高低：白宫认为自己的执法选择足以使州的合法规定失效，因而压过州据其法律行事的权力。这是白宫的声称，题干正是在问这一声称。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>白宫声称自己的执法权高于各州的执法权。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>即使州法遵守联邦法规，白宫仍声称可因自己不同意而使它失效。A的outweighs对应其自称能够压过州依法行动的权力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>白宫声称自己的执法权高于各州的执法权。</p>\n</blockquote>\n<p><code>outweighs</code>要核对谁能压过谁，第6段的<code>invalidate any otherwise legitimate state law</code>写白宫主张可以使州法失效，因此回看这一句及前面<code>even if</code>引出的条件。</p>\n<p>原文说白宫把自己的执法优先事项放在州法之前，即使州法逐字遵守联邦法规，仍声称可以<code>invalidate any otherwise legitimate state law</code>，只因自己不赞同。<code>A</code>的<code>outweighs</code>概括了这种权力高低：白宫认为自己的执法选择足以使州的合法规定失效，因而压过州据其法律行事的权力。这是白宫的声称，题干正是在问这一声称。</p>\n</section>"},{"title":"A. outweighs that held by the states","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.\n>\n> 白宫认为，即使州法完全遵守联邦法规，亚利桑那的法律仍与其执法优先事项冲突。实际上，白宫声称它可以使任何自己不同意的、原本合法的州法失效。\n\neven if先把州法合法这一条件保留下来，In effect再说明白宫主张的后果：行政意见足以否定这类州法。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The White House claims its enforcement power outweighs that held by the states.\n>\n> 白宫声称自己的执法权高于各州的执法权。\n\nA保留的是白宫声称的权力高低，并非文章认定该权力已合法成立。题干claims限定了说话者，所以不能拿作者的反对去否定这一转述。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>白宫声称自己的执法权高于各州的执法权。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>即使州法遵守联邦法规，白宫仍声称可因自己不同意而使它失效。A的outweighs对应其自称能够压过州依法行动的权力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>白宫声称自己的执法权高于各州的执法权。</p>\n</blockquote>\n<p><code>outweighs</code>要核对谁能压过谁，第6段的<code>invalidate any otherwise legitimate state law</code>写白宫主张可以使州法失效，因此回看这一句及前面<code>even if</code>引出的条件。</p>\n<p>原文说白宫把自己的执法优先事项放在州法之前，即使州法逐字遵守联邦法规，仍声称可以<code>invalidate any otherwise legitimate state law</code>，只因自己不赞同。<code>A</code>的<code>outweighs</code>概括了这种权力高低：白宫认为自己的执法选择足以使州  if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>白宫声称自己的执法权很少与州法相抵触。</p>\n</blockquote>\n<p><code>rarely goes against</code>在谈发生抵触的频率，第6段的<code>any otherwise legitimate state law</code>则谈白宫主张可以否定哪些州法，因此回看白宫声明的末句。</p>\n<p>原文说白宫自认可以使<code>any otherwise legitimate state law</code>失效，条件是它不赞同该法；这是声称权力能达到的范围。<code>D</code>的<code>rarely goes against</code>改成“很少发生抵触”的频率判断。原文的<code>any</code>不是统计抵触发生了多少次，不能与<code>rarely</code>直接比多少；但<code>D</code>确实把“有权否定任一不赞同的州法”换成了“通常不与州法抵触”，没有保留原句声明的权力范围。</p>\n</section>"},{"title":"D. rarely goes against state laws","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.\n>\n> 白宫认为，即使州法完全遵守联邦法规，亚利桑那的法律仍与其执法优先事项冲突。实际上，白宫声称它可以使任何自己不同意的、原本合法的州法失效。\n\n作者以any ... that it disagrees with限定白宫主张覆盖的州法，再说明otherwise legitimate也不能免于被否定。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The White House claims its enforcement power rarely goes against state laws.\n>\n> 白宫声称自己的执法权很少与州法相抵触。\n\nD需要对冲突次数作出很少的判断，文中没有这项统计。也不能反过来把any当成现实冲突很多；真正不对应的是D未转述这项权限声明。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-D-0\"><blockquote>\n<p>白宫声称自己的执法权很少与州法相抵触。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原句说明白宫自称能否定哪些州法，D改成很少与州法冲突。权限范围与实际发生频率是两个不同问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>白宫声称自己的执法权很少与州法相抵触。</p>\n</blockquote>\n<p><code>rarely goes against</code>在谈发生抵触的频率，第6段的<code>any otherwise legitimate state law</code>则谈白宫主张可以否定哪些州法，因此回看白宫声明的末句。</p>\n<p>原文说白宫自认可以使<code>any otherwise legitimate state law</code>失效，条件是它不赞同该法；这是声称权力能达到的范围。<code>D</code>的<code>rarely goes against</code>改成“很少发生抵触”的频率判断。原文的<code>any</code>不是统计抵触发生了多少次，不能与<code>rarely</code>直接比多少；但<code>D</code>确实把“有权否定任一不赞同的州法”换成了“通常不与州法抵触”，没有保留原句声明的权力范围。</p>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n<p>白宫认为，即使州法完全遵守联邦法规，亚利桑那的法律仍与其执法优先事项冲突。实际上，白宫声称它可以使任何自己不同意的、原本合法的州法失效。</p>\n</blockquote>\n<p>作者以any ... that it disagrees with限定白宫主张覆盖的州法，再说明otherwise legitimate也不能免于被否定。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The White House claims its enforcement power rarely goes against state laws.</p>\n<p>白宫声称自己的执法权很少与州法相抵触。</p>\n</blockquote>\n<p>D需要对冲突次数作出很少的判断，文中没有这项统计。也不能反过来把any当成现实冲突很多；真正不对应的是D未转述这项权限声明。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"39题结论","raw":"### 39题结论\n\n> **39. A**\n\n- A：即使州法遵守联邦法规，白宫仍声称可因自己不同意而使它失效。A的outweighs对应其自称能够压过州依法行动的权力。\n- B：联邦法规在原句中是州法遵守的准则，B却把它写成白宫执法权的设立依据，添上了原文没有说明的权力来源。\n- C：白宫以自己的不同意作为否定州法的理由，C则要求各州支持成为其权力的依靠，倒转了原句的决定关系。\n- D：原句说明白宫自称能否定哪些州法，D改成很少与州法冲突。权限范围与实际发生频率是两个不同问题。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"39","questionConclusion":true},"html":"<blockquote>\n<p><strong>39. A</strong></p>\n</blockquote>\n<ul>\n<li>A：即使州法遵守联邦法规，白宫仍声称可因自己不同意而使它失效。A的outweighs对应其自称能够压过州依法行动的权力。</li>\n<li>B：联邦法规在原句中是州法遵守的准则，B却把它写成白宫执法权的设立依据，添上了原文没有说明的权力来源。</li>\n<li>C：白宫以自己的不同意作为否定州法的理由，C则要求各州支持成为其权力的依靠，倒转了原句的决定关系。</li>\n<li>D：原句说明白宫自称能否定哪些州法，D改成很少与州法冲突。权限范围与实际发生频率是两个不同问题。</li>\n</ul>\n"},{"title":"40题 · 题干、题型与核心出处","raw":"## 40题\n\n> What can be learned from the last paragraph?\n>\n> 从最后一段可以得知什么？\n\n### 题型\n\n推断题：要从末段政府提出的要求及法官驳回它的结果，判断裁决的实际作用。\n\n题干直接指定the last paragraph，最后一段就是第7段，从Some powers开始完整读到Every Justice的判断。\n\n### 核心出处\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so.\n>\n> The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either\n>\n> Every Justice rightly rejected this remarkable claim","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"40","questionIntro":true},"html":"<blockquote>\n<p>What can be learned from the last paragraph?</p>\n<p>从最后一段可以得知什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>推断题：要从末段政府提出的要求及法官驳回它的结果，判断裁决的实际作用。</p>\n<p>题干直接指定the last paragraph，最后一段就是第7段，从Some powers开始完整读到Every Justice的判断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so.</p>\n<p>The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either</p>\n<p>Every Justice rightly rejected this remarkable claim</p>\n</blockquote>\n"},{"title":"A. Immigration issues are usually decided by Congress.","raw":"### A. Immigration issues are usually decided by Congress.\n\n> 从末段可以得知：移民问题通常由国会决定。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n国会有权禁止州用自身资源核查，但从未这样禁止，说明的是一项具体权力。A扩大成移民问题通常由国会决定的一般安排。\n\n**出处：**\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>从末段可以得知：移民问题通常由国会决定。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>国会有权禁止州用自身资源核查，但从未这样禁止，说明的是一项具体权力。A扩大成移民问题通常由国会决定的一般安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section>"},{"title":"A. Immigration issues are usually decided by Congress.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 从末段可以得知：移民问题通常由国会决定。\n\n`usually decided by Congress`涉及移民问题的一般决策安排，而段中的`if Congress wanted`与`it could`谈国会能否禁止州核查身份，因此回看这一假设句及`It never did so`。\n\n原文的`if Congress wanted`设定一个具体情形：国会若要禁止州使用自己的资源核查身份，就有能力这样做，但实际上没有做。`A`的`usually decided by Congress`把这项特定禁止权扩成移民问题通常由国会决断的一般安排。它同时扩大了事情的范围，并把一次能力与实际行为的区分改成“通常”的频率说明；原句并没有建立这种一般分工。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>从末段可以得知：移民问题通常由国会决定。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>国会有权禁止州用自身资源核查，但从未这样禁止，说明的是一项具体权力。A扩大成移民问题通常由国会决定的一般安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：移民问题通常由国会决定。</p>\n</blockquote>\n<p><code>usually decided by Congress</code>涉及移民问题的一般决策安排，而段中的<code>if Congress wanted</code>与<code>it could</code>谈国会能否禁止州核查身份，因此回看这一假设句及<code>It never did so</code>。</p>\n<p>原文的<code>if Congress wanted</code>设定一个具体情形：国会若要禁止州使用自己的资源核查身份，就有能力这样做，但实际上没有做。<code>A</code>的<code>usually decided by Congress</code>把这项特定禁止权扩成移民问题通常由国会决断的一般安排。它同时扩大了事情的范围，并把一次能力与实际行为的区分改成“通常”的频率说明；原句并没有建立这种一般分工。</p>\n</section>"},{"title":"A. Immigration issues are usually decided by Congress.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.\n>\n> 但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。\n\n作者先承认联邦专属权力，再以could与never did区分国会能够下禁令和事实上未下禁令。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Immigration issues are usually decided by Congress.\n>\n> 从末段可以得知：移民问题通常由国会决定。\n\nA需要移民问题的一般决策归属以及usually的频率。实际只检验这一具体禁令是否存在，不能由有权采取一次行动推出通常决定所有这类问题。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>从末段可以得知：移民问题通常由国会决定。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>国会有权禁止州用自身资源核查，但从未这样禁止，说明的是一项具体权力。A扩大成移民问题通常由国会决定的一般安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：移民问题通常由国会决定。</p>\n</blockquote>\n<p><code>usually decided by Congress</code>涉及移民问题的一般决策安排，而段中的<code>if Congress wanted</code>与<code>it could</code>谈国会能否禁止州核查身份，因此回看这一假设句及<code>It never did so</code>。</p>\n<p>原文的<code>if Congress wanted</code>设定一个具体情形：国会若要禁止州使用自己的资源核查身份，就有能力这样做，但实际上没有做。<code>A</code>的<code>usually decided by Congress</code>把这项特定禁止权扩成移民问题通常由国会决断的一般安排。它同时扩大了事情的范围，并把一次能力与实际行为的区分改成“通常”的频率说明；原句并没有建立这种一般分工。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n<p>但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。</p>\n</blockquote>\n<p>作者先承认联邦专属权力，再以could与never did区分国会能够下禁令和事实上未下禁令。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Immigration issues are usually decided by Congress.</p>\n<p>从末段可以得知：移民问题通常由国会决定。</p>\n</blockquote>\n<p>A需要移民问题的一般决策归属以及usually的频率。实际只检验这一具体禁令是否存在，不能由有权采取一次行动推出通常决定所有这类问题。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. The Administration is dominant over immigration issues.","raw":"### B. The Administration is dominant over immigration issues.\n\n> 从末段可以得知：行政当局在移民问题上居于支配地位。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n行政当局要求各州也不得执行，却被所有法官驳回。B把未获认可的权力要求写成已有的支配地位。\n\n**出处：**\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-B-0\"><blockquote>\n<p>从末段可以得知：行政当局在移民问题上居于支配地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>行政当局要求各州也不得执行，却被所有法官驳回。B把未获认可的权力要求写成已有的支配地位。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section>"},{"title":"B. The Administration is dominant over immigration issues.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 从末段可以得知：行政当局在移民问题上居于支配地位。\n\n`dominant over`要检查政府能否凭自己的选择支配州的行动，段末的`no state should be allowed`正是政府提出的要求，随后`Every Justice rightly rejected`给出回应，所以合看这两句。\n\n原文写政府因为自己不愿执行国会的移民意愿，就主张各州也不应获准执行；接着`Every Justice rightly rejected`说明所有法官驳回了这一要求，作者还用`rightly`表示赞同驳回。`B`的`dominant over`则把政府可以支配移民事项写成该段可得的结论。政府确实提出了支配州行动的要求，但原文把它作为被驳回的主张，不能把被否定的要求变成已获得的支配地位。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-B-0\"><blockquote>\n<p>从末段可以得知：行政当局在移民问题上居于支配地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>行政当局要求各州也不得执行，却被所有法官驳回。B把未获认可的权力要求写成已有的支配地位。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：行政当局在移民问题上居于支配地位。</p>\n</blockquote>\n<p><code>dominant over</code>要检查政府能否凭自己的选择支配州的行动，段末的<code>no state should be allowed</code>正是政府提出的要求，随后<code>Every Justice rightly rejected</code>给出回应，所以合看这两句。</p>\n<p>原文写政府因为自己不愿执行国会的移民意愿，就主张各州也不应获准执行；接着<code>Every Justice rightly rejected</code>说明所有法官驳回了这一要求，作者还用<code>rightly</code>表示赞同驳回。<code>B</code>的<code>dominant over</code>则把政府可以支配移民事项写成该段可得的结论。政府确实提出了支配州行动的要求，但原文把它作为被驳回的主张，不能把被否定的要求变成已获得的支配地位。</p>\n</section>"},{"title":"B. The Administration is dominant over immigration issues.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.\n>\n> 但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。\n\n作者先转述政府的理由，再以Every Justice rejected给出处理结果；rightly进一步表示赞同限制这项要求。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The Administration is dominant over immigration issues.\n>\n> 从末段可以得知：行政当局在移民问题上居于支配地位。\n\n若政府支配移民事务是段落结论，末句就应支持其阻止州行动的权力。实际裁决拒绝了这项要求，不能只读政府想做什么而跳过结果。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option 张。</p>\n</blockquote>\n<p>作者先转述政府的理由，再以Every Justice rejected给出处理结果；rightly进一步表示赞同限制这项要求。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Administration is dominant over immigration issues.</p>\n<p>从末段可以得知：行政当局在移民问题上居于支配地位。</p>\n</blockquote>\n<p>若政府支配移民事务是段落结论，末句就应支持其阻止州行动的权力。实际裁决拒绝了这项要求，不能只读政府想做什么而跳过结果。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. Justices wanted to strengthen its coordination with Congress.","raw":"### C. Justices wanted to strengthen its coordination with Congress.\n\n> 从末段可以得知：法官想加强与国会之间的协调。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\n法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。\n\n**出处：**\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-C-0\"><blockquote>\n<p>从末段可以得知：法官想加强与国会之间的协调。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section>"},{"title":"C. Justices wanted to strengthen its coordination with Congress.","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 从末段可以得知：法官想加强与国会之间的协调。\n\n法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。\n\n国会的意愿先作为政府不愿执行的内容出现，法官随后否定由此限制州的要求；法官与国会之间并未展开协调行为。\n\nC需要want与加强协调之间的目的关系。实际能看到的只是驳回政府主张，不能因这一结果没有违背国会意愿，就额外补上加强协调的动机。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-C-0\"><blockquote>\n<p>从末段可以得知：法官想加强与国会之间的协调。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：法官想加强与国会之间的协调。</p>\n</blockquote>\n<p>法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。</p>\n<p>国会的意愿先作为政府不愿执行的内容出现，法官随后否定由此限制州的要求；法官与国会之间并未展开协调行为。</p>\n<p>C需要want与加强协调之间的目的关系。实际能看到的只是驳回政府主张，不能因这一结果没有违背国会意愿，就额外补上加强协调的动机。</p>\n</section>"},{"title":"C. Justices wanted to strengthen its coordination with Congress.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.\n>\n> 但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。\n\n国会的意愿先作为政府不愿执行的内容出现，法官随后否定由此限制州的要求；法官与国会之间并未展开协调行为。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The Justices wanted to strengthen their coordination with Congress.\n>\n> 从末段可以得知：法官想加强与国会之间的协调。\n\nC需要want与加强协调之间的目的关系。实际能看到的只是驳回政府主张，不能因这一结果没有违背国会意愿，就额外补上加强协调的动机。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-C-0\"><blockquote>\n<p>从末段可以得知：法官想加强与国会之间的协调。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：法官想加强与国会之间的协调。</p>\n</blockquote>\n<p>法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。</p>\n<p>国会的意愿先作为政府不愿执行的内容出现，法官随后否定由此限制州的要求；法官与国会之间并未展开协调行为。</p>\n<p>C需要want与加强协调之间的目的关系。实际能看到的只是驳回政府主张，不能因这一结果没有违背国会意愿，就额外补上加强协调的动机。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n<p>但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。</p>\n</blockquote>\n<p>国会的意愿先作为政府不愿执行的内容出现，法官随后否定由此限制州的要求；法官与国会之间并未展开协调行为。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Justices wanted to strengthen their coordination with Congress.</p>\n<p>从末段可以得知：法官想加强与国会之间的协调。</p>\n</blockquote>\n<p>C需要want与加强协调之间的目的关系。实际能看到的只是驳回政府主张，不能因这一结果没有违背国会意愿，就额外补上加强协调的动机。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. Justices intended to check the power of the Administration.","raw":"### D. Justices intended to check the power of the Administration.\n\n> 从末段可以得知：法官意在制约行政当局的权力。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n法官不允许政府把自己的不愿执行变成禁止各州执行的理由，限制的正是行政当局想取得的这一权力。\n\n**出处：**\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>从末段可以得知：法官意在制约行政当局的权力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法官不允许政府把自己的不愿执行变成禁止各州执行的理由，限制的正是行政当局想取得的这一权力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section>"},{"title":"D. Justices intended to check the power of the Administration.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 从末段可以得知：法官意在制约行政当局的权力。\n\n`check the power`要看裁决是否限制政府的权力要求，末段`no state should be allowed`是政府试图限制州的主张，`Every Justice rightly rejected`则给出法官的裁决，因此把这两句合看。\n\n原文写政府主张：自己不愿执行国会的移民意愿，就不应允许州执行；`Every Justice rightly rejected`则拒绝让这一主张成立。`D`的`check the power`把法官裁决的方向概括为制约政府权力。裁决直接针对政府要求决定各州能否执行的权力，而不是另设一个与裁决无关的目的，所以可以由拒绝这一要求推得法官在限制这种行政权力主张。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>从末段可以得知：法官意在制约行政当局的权力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法官不允许政府把自己的不愿执行变成禁止各州执行的理由，限制的正是行政当局想取得的这一权力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：法官意在制约行政当局的权力。</p>\n</blockquote>\n<p><code>check the power</code>要看裁决是否限制政府的权力要求，末段<code>no state should be allowed</code>是政府试图限制州的主张，<code>Every Justice rightly rejected</code>则给出法官的裁决，因此把这两句合看。</p>\n<p>原文写政府主张：自己不愿执行国会的移民意愿，就不应允许州执行；<code>Every Justice rightly rejected</code>则拒绝让这一主张成立。<code>D</code>的<code>check the power</code>把法官裁决的方向概括为制约政府权力。裁决直接针对政府要求决定各州能否执行的权力，而不是另设一个与裁决无关的目的，所以可以由拒绝这一要求推得法官在限制这种行政权力主张。</p>\n</section>"},{"title":"D. Justices intended to check the power of the Administration.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.\n>\n> 但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。\n\n国会尚未下禁令，政府却企图用执法优先事项产生同样结果；作者用法官一致拒绝结束这条推论。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Justices intended to check the power of the Administration.\n>\n> 从末段可以得知：法官意在制约行政当局的权力。\n\nD的check the power可以落实到被驳回的具体要求，没有另添无关目的。它概括的是裁决限制了行政当局支配州合法行动的企图。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>从末段可以得知：法官意在制约行政当局的权力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法官不允许政府把自己的不愿执行变成禁止各州执行的理由，限制的正是行政当局想取得的这一权力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：法官意在制约行政当局的权力。</p>\n</blockquote>\n<p><code>check the power</code>要看裁决是否限制政府的权力要求，末段<code>no state should be allowed</code>是政府试图限制州的主张，<code>Every Justice rightly rejected</code>则给出法官的裁决，因此把这两句合看。</p>\n<p>原文写政府主张：自己不愿执行国会的移民意愿，就不应允许州执行；<code>Every Justice rightly rejected</code>则拒绝让这一主张成立。<code>D</code>的<code>check the power</code>把法官裁决的方向概括为制约政府权力。裁决直接针对政府要求决定各州能否执行的权力，而不是另设一个与裁决无关的目的，所以可以由拒绝这一要求推得法官在限制这种行政权力主张。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n<p>但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。</p>\n</blockquote>\n<p>国会尚未下禁令，政府却企图用执法优先事项产生同样结果；作者用法官一致拒绝结束这条推论。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Justices intended to check the power of the Administration.</p>\n<p>从末段可以得知：法官意在制约行政当局的权力。</p>\n</blockquote>\n<p>D的check the power可以落实到被驳回的具体要求，没有另添无关目的。它概括的是裁决限制了行政当局支配州合法行动的企图。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"40题结论","raw":"### 40题结论\n\n> **40. D**\n\n- A：国会有权禁止州用自身资源核查，但从未这样禁止，说明的是一项具体权力。A扩大成移民问题通常由国会决定的一般安排。\n- B：行政当局要求各州也不得执行，却被所有法官驳回。B把未获认可的权力要求写成已有的支配地位。\n- C：法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。\n- D：法官不允许政府把自己的不愿执行变成禁止各州执行的理由，限制的正是行政当局想取得的这一权力。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"40","questionConclusion":true},"html":"<blockquote>\n<p><strong>40. D</strong></p>\n</blockquote>\n<ul>\n<li>A：国会有权禁止州用自身资源核查，但从未这样禁止，说明的是一项具体权力。A扩大成移民问题通常由国会决定的一般安排。</li>\n<li>B：行政当局要求各州也不得执行，却被所有法官驳回。B把未获认可的权力要求写成已有的支配地位。</li>\n<li>C：法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。</li>\n<li>D：法官不允许政府把自己的不愿执行变成禁止各州执行的理由，限制的正是行政当局想取得的这一权力。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：最高法院裁决的双重结果**（段落1核心矛盾） 表面胜利：5-3推翻亚利桑那州移民法大部分内容（奥巴马政府的政策胜利）// 实质失败：8-0否决政府打破联邦-州权力平衡的努力（宪法层面的失败）\n\n↓（具体案情分析）\n\n**逻辑层次2：亚利桑那州法案的内容与宪法原则**（段落2-3法律分析） 案件背景：亚利桑那州试图让州警执行联邦移民法（制定平行政策）→ 宪法原则：【只有联邦有权建立统一归化规则 + 联邦法优于州法】→ 多数派裁决：推翻3/4条款（国会已\"占据该领域\"，州侵犯联邦特权）\n\n↓（例外情况）\n\n**逻辑层次3：州在移民执法中的合法角色**（段落4例外条款） 保留条款：允许亚利桑那州警察核实接触者的法律身份 → 原因：国会一直设想联邦-州联合执法 + 鼓励信息共享与合作\n\n→（不同意见）\n\n**逻辑层次4：大法官们的分歧**（段落5意见分歧） 部分同意：阿利托和托马斯（同意宪法逻辑 // 但对具体冲突有异议）+ 主要反对：斯卡利亚（援引《外国人和煽动叛乱法》为州特权辩护）\n\n↓（核心争议）\n\n**逻辑层次5：行政权力的越界**（段落6-7权力之争） 白宫的主张：【州法即使符合联邦法规字面要求，仍因与执法优先事项冲突而无效】→ 实质：白宫可以使任何不同意的合法州法无效（\"令人震惊的联邦行政权力主张\"）→ 法院回应：【承认某些权力专属联邦（如边界控制）// 但国会从未禁止州使用自己资源检查移民身份】→ 结论：所有大法官拒绝政府\"因自己不想执行就禁止州执行\"的主张\n\n↑（全文主旨）\n\n全文核心观点：虽然最高法院推翻了亚利桑那州移民法的部分条款，但更重要的是，法院以8-0的一致决定拒绝了奥巴马政府试图扩大联邦行政权力、破坏联邦与州权力平衡的努力。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：最高法院裁决的双重结果</strong>（段落1核心矛盾） 表面胜利：5-3推翻亚利桑那州移民法大部分内容（奥巴马政府的政策胜利）// 实质失败：8-0否决政府打破联邦-州权力平衡的努力（宪法层面的失败）</p>\n<p>↓（具体案情分析）</p>\n<p><strong>逻辑层次2：亚利桑那州法案的内容与宪法原则</strong>（段落2-3法律分析） 案件背景：亚利桑那州试图让州警执行联邦移民法（制定平行政策）→ 宪法原则：【只有联邦有权建立统一归化规则 + 联邦法优于州法】→ 多数派裁决：推翻3/4条款（国会已&quot;占据该领域&quot;，州侵犯联邦特权）</p>\n<p>↓（例外情况）</p>\n<p><strong>逻辑层次3：州在移民执法中的合法角色</strong>（段落4例外条款） 保留条款：允许亚利桑那州警察核实接触者的法律身份 → 原因：国会一直设想联邦-州联合执法 + 鼓励信息共享与合作</p>\n<p>→（不同意见）</p>\n<p><strong>逻辑层次4：大法官们的分歧</strong>（段落5意见分歧） 部分同意：阿利托和托马斯（同意宪法逻辑 // 但对具体冲突有异议）+ 主要反对：斯卡利亚（援引《外国人和煽动叛乱法》为州特权辩护）</p>\n<p>↓（核心争议）</p>\n<p><strong>逻辑层次5：行政权力的越界</strong>（段落6-7权力之争） 白宫的主张：【州法即使符合联邦法规字面要求，仍因与执法优先事项冲突而无效】→ 实质：白宫可以使任何不同意的合法州法无效（&quot;令人震惊的联邦行政权力主张&quot;）→ 法院回应：【承认某些权力专属联邦（如边界控制）// 但国会从未禁止州使用自己资源检查移民身份】→ 结论：所有大法官拒绝政府&quot;因自己不想执行就禁止州执行&quot;的主张</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：虽然最高法院推翻了亚利桑那州移民法的部分条款，但更重要的是，法院以8-0的一致决定拒绝了奥巴马政府试图扩大联邦行政权力、破坏联邦与州权力平衡的努力。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】E. A policy victory accompanied by a constitutional defeat\n\n> 政策胜利伴随宪法层面的失败\n\n开头把5比3的部分政策胜利与8比0的宪法争议失败放在对照关系中。\n\n> On a five to three vote, the Supreme Court knocked out much of Arizona’s immigration law Monday – a modest policy victory for the Obama Administration.\n\n第一句把撤销多项州法称为政府在政策上的小胜，5比3对应这一层结果。\n\n> But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration’s effort to upset the balance of power between the federal government and the states.\n\nBut转到更重要的宪法问题：政府打破联邦与州权力平衡的努力以8比0失败。两个票数属于不同问题，不能相互代换。\n\n这一部分的推进关系是：\n\n> 多项州法被撤销：政策小胜 → 行政扩权被一致拒绝：宪法层面失败\n\npolicy victory与constitutional defeat对应两个不同层面的裁决，不能合并成政府全面胜利。\n\n再看最强干扰项G：A unanimous rejection of every state immigration rule。\n\n撤销的是多项条款而非全部；而且8比0针对政府扩大权限的主张。\n\n**41题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】E. A policy victory accompanied by a constitutional defeat</p>\n<blockquote>\n<p>政策胜利伴随宪法层面的失败</p>\n</blockquote>\n<p>开头把5比3的部分政策胜利与8比0的宪法争议失败放在对照关系中。</p>\n<blockquote>\n<p>On a five to three vote, the Supreme Court knocked out much of Arizona’s immigration law Monday – a modest policy victory for the Obama Administration.</p>\n</blockquote>\n<p>第一句把撤销多项州法称为政府在政策上的小胜，5比3对应这一层结果。</p>\n<blockquote>\n<p>But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration’s effort to upset the balance of power between the federal government and the states.</p>\n</blockquote>\n<p>But转到更重要的宪法问题：政府打破联邦与州权力平衡的努力以8比0失败。两个票数属于不同问题，不能相互代换。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>多项州法被撤销：政策小胜 → 行政扩权被一致拒绝：宪法层面失败</p>\n</blockquote>\n<p>policy victory与constitutional defeat对应两个不同层面的裁决，不能合并成政府全面胜利。</p>\n<p>再看最强干扰项G：A unanimous rejection of every state immigration rule。</p>\n<p>撤销的是多项条款而非全部；而且8比0针对政府扩大权限的主张。</p>\n<p><strong>41题选E。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】C. Why some state provisions entered a reserved federal field\n\n> 部分州条款为何进入联邦专属领域\n\n先交代三项条款被推翻，再用联邦优先、国会占据领域说明裁决理由。\n\n> In _Arizona v. United States_, the majority overturned three of the four contested provisions of Arizona’s controversial plan to have state and local police enforce federal immigration law.\n\n开头交代争议计划四条中有三条被推翻，标题需要继续回答为什么是这些条款越界。\n\n> Arizona had attempted to fashion state policies that ran parallel to the existing federal ones.\n\n州试图制定与联邦政策并行的政策，联系联邦法优先原则，问题是州能否另行进入已有联邦规则的领域。\n\n> On the overturned provisions the majority held Congress had deliberately “occupied the field” and Arizona had thus intruded on the federal’s privileged powers.\n\noccupied the field与intruded把国会已经占据和州随后侵入接为因果，正面给出撤销条款的理由。\n\n这一部分的推进关系是：\n\n> 州的三项条款被撤销 → 制定并行政策受到联邦优先限制 → 国会已占领域而州侵入\n\nreserved federal field概括occupied the field和privileged powers；entered对应intruded。\n\n再看最强干扰项D：An end to cooperation between federal and state officers。\n\n权限领域争议不表示执法合作终结，下一部分明确允许合作。\n\n**42题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】C. Why some state provisions entered a reserved federal field</p>\n<blockquote>\n<p>部分州条款为何进入联邦专属领域</p>\n</blockquote>\n<p>先交代三项条款被推翻，再用联邦优先、国会占据领域说明裁决理由。</p>\n<blockquote>\n<p>In <em>Arizona v. United States</em>, the majority overturned three of the four contested provisions of Arizona’s controversial plan to have state and local police enforce federal immigration law.</p>\n</blockquote>\n<p>开头交代争议计划四条中有三条被推翻，标题需要继续回答为什么是这些条款越界。</p>\n<blockquote>\n<p>Arizona had attempted to fashion state policies that ran parallel to the existing federal ones.</p>\n</blockquote>\n<p>州试图制定与联邦政策并行的政策，联系联邦法优先原则，问题是州能否另行进入已有联邦规则的领域。</p>\n<blockquote>\n<p>On the overturned provisions the majority held Congress had deliberately “occupied the field” and Arizona had thus intruded on the federal’s privileged powers.</p>\n</blockquote>\n<p>occupied the field与intruded把国会已经占据和州随后侵入接为因果，正面给出撤销条款的理由。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>州的三项条款被撤销 → 制定并行政策受到联邦优先限制 → 国会已占领域而州侵入</p>\n</blockquote>\n<p>reserved federal field概括occupied the field和privileged powers；entered对应intruded。</p>\n<p>再看最强干扰项D：An end to cooperation between federal and state officers。</p>\n<p>权限领域争议不表示执法合作终结，下一部分明确允许合作。</p>\n<p><strong>42题选C。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】F. The lawful place of state officers in joint enforcement\n\n> 联合执法中州官员的合法位置\n\nHowever转出仍被允许的身份核查，再以国会鼓励信息共享解释这一例外。\n\n> However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.\n\nHowever承接前面的撤销，却说明仍有获准的州警察工作：核查执法接触者的身份。\n\n> That’s because Congress has always envisioned joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.\n\nThat’s because说明这项许可来自国会设想的共同执法及信息合作，因此州有合法角色，却不是完全独立于联邦法。\n\n这一部分的推进关系是：\n\n> 州警察身份核查获准 → 国会设想联合执法 → 信息共享与合作解释许可\n\nlawful place对应would be allowed，joint enforcement对应joint federal-state及cooperate。\n\n再看最强干扰项G：A unanimous rejection of every state immigration rule。\n\n恰恰存在合法保留部分，所以不是否定全部州规则。\n\n**43题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】F. The lawful place of state officers in joint enforcement</p>\n<blockquote>\n<p>联合执法中州官员的合法位置</p>\n</blockquote>\n<p>However转出仍被允许的身份核查，再以国会鼓励信息共享解释这一例外。</p>\n<blockquote>\n<p>However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.</p>\n</blockquote>\n<p>However承接前面的撤销，却说明仍有获准的州警察工作：核查执法接触者的身份。</p>\n<blockquote>\n<p>That’s because Congress has always envisioned joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n</blockquote>\n<p>That’s because说明这项许可来自国会设想的共同执法及信息合作，因此州有合法角色，却不是完全独立于联邦法。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>州警察身份核查获准 → 国会设想联合执法 → 信息共享与合作解释许可</p>\n</blockquote>\n<p>lawful place对应would be allowed，joint enforcement对应joint federal-state及cooperate。</p>\n<p>再看最强干扰项G：A unanimous rejection of every state immigration rule。</p>\n<p>恰恰存在合法保留部分，所以不是否定全部州规则。</p>\n<p><strong>43题选F。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】A. A shared constitutional logic with remaining disagreements\n\n> 共同宪法逻辑之下仍有分歧\n\nAlito与Thomas接受宪法逻辑但对冲突条款有异议；Scalia更强力维护州权。\n\n> Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute.\n\nagreed与disagreed落在不同对象上：两名法官接受宪法逻辑，却对具体哪些州规则冲突有异议。\n\n> The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.\n\nScalia的更强州权辩护补充另一类异议。标题要兼顾部分原则共识与尚存分歧，不能把三人的立场压成完全一致。\n\n这一部分的推进关系是：\n\n> 两名法官接受原则但分歧在具体条款 → 另一法官进一步维护州特权\n\nshared logic与remaining disagreements同时保留原则一致和具体裁决分歧。\n\n再看最强干扰项C：Why some state provisions entered a reserved federal field。\n\n这里讨论异议法官的立场，不再主要解释多数方为何撤销三条。\n\n**44题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】A. A shared constitutional logic with remaining disagreements</p>\n<blockquote>\n<p>共同宪法逻辑之下仍有分歧</p>\n</blockquote>\n<p>Alito与Thomas接受宪法逻辑但对冲突条款有异议；Scalia更强力维护州权。</p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute.</p>\n</blockquote>\n<p>agreed与disagreed落在不同对象上：两名法官接受宪法逻辑，却对具体哪些州规则冲突有异议。</p>\n<blockquote>\n<p>The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.</p>\n</blockquote>\n<p>Scalia的更强州权辩护补充另一类异议。标题要兼顾部分原则共识与尚存分歧，不能把三人的立场压成完全一致。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>两名法官接受原则但分歧在具体条款 → 另一法官进一步维护州特权</p>\n</blockquote>\n<p>shared logic与remaining disagreements同时保留原则一致和具体裁决分歧。</p>\n<p>再看最强干扰项C：Why some state provisions entered a reserved federal field。</p>\n<p>这里讨论异议法官的立场，不再主要解释多数方为何撤销三条。</p>\n<p><strong>44题选A。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Rejecting executive priorities as a reason to cancel lawful action\n\n> 拒绝以行政优先事项否定合法行动\n\n先呈现白宫以执行优先事项否定合法州法的要求，再指出国会并未禁止州核查，因此所有法官拒绝这一要求。\n\n> The 8-0 objection to President Obama turns on what Justice Samuel Alito describes in his objection as “a shocking assertion of federal executive power”.\n\nshocking assertion先定出争议是行政部门提出了过大的权力要求，后文要检验它能否成立。\n\n> But if Congress wanted to prevent states from using their own resources to check immigration status, it could.\n\n国会可以禁止州核查却没有禁止，说明法律权限不能被行政当局不愿执行的选择取代。\n\n> Every Justice rightly rejected this remarkable claim.\n\nEvery Justice rejected回到争议的结果：没有一位法官接受这种额外限制州行动的权力。B同时保留主张和否定方向。\n\n这一部分的推进关系是：\n\n> 白宫要求依执法偏好否定州法 → 国会尚未禁止州核查 → 法官一致拒绝行政扩权\n\nexecutive priorities不能自动压过otherwise legitimate state law；末段拒绝的是行政部门额外扩张的权力。\n\n再看最强干扰项D：An end to cooperation between federal and state officers。\n\n拒绝行政扩权与禁止执法合作相反，州依法协作的空间仍被保留。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Rejecting executive priorities as a reason to cancel lawful action</p>\n<blockquote>\n<p>拒绝以行政优先事项否定合法行动</p>\n</blockquote>\n<p>先呈现白宫以执行优先事项否定合法州法的要求，再指出国会并未禁止州核查，因此所有法官拒绝这一要求。</p>\n<blockquote>\n<p>The 8-0 objection to President Obama turns on what Justice Samuel Alito describes in his objection as “a shocking assertion of federal executive power”.</p>\n</blockquote>\n<p>shocking assertion先定出争议是行政部门提出了过大的权力要求，后文要检验它能否成立。</p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could.</p>\n</blockquote>\n<p>国会可以禁止州核查却没有禁止，说明法律权限不能被行政当局不愿执行的选择取代。</p>\n<blockquote>\n<p>Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n<p>Every Justice rejected回到争议的结果：没有一位法官接受这种额外限制州行动的权力。B同时保留主张和否定方向。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>白宫要求依执法偏好否定州法 → 国会尚未禁止州核查 → 法官一致拒绝行政扩权</p>\n</blockquote>\n<p>executive priorities不能自动压过otherwise legitimate state law；末段拒绝的是行政部门额外扩张的权力。</p>\n<p>再看最强干扰项D：An end to cooperation between federal and state officers。</p>\n<p>拒绝行政扩权与禁止执法合作相反，州依法协作的空间仍被保留。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，
