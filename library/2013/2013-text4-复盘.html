法权的设立依据，添上了原文没有说明的权力来源。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>白宫声称自己的执法权由联邦法规确立。</p>\n</blockquote>\n<p>联邦法规在原句中是州法遵守的准则，B却把它写成白宫执法权的设立依据，添上了原文没有说明的权力来源。</p>\n<p>作者先写州法即使守法仍被白宫反对，再将争议解释成白宫能否否定州法；两句围绕权限范围推进。</p>\n<p>B需要federal statutes与白宫权力之间的赋予关系。实际complied with的主语是state laws，联邦法规不是is established by后的授权者，不能只凭同词相接。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n<p>白宫认为，即使州法完全遵守联邦法规，亚利桑那的法律仍与其执法优先事项冲突。实际上，白宫声称它可以使任何自己不同意的、原本合法的州法失效。</p>\n</blockquote>\n<p>作者先写州法即使守法仍被白宫反对，再将争议解释成白宫能否否定州法；两句围绕权限范围推进。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The White House claims its enforcement power is established by federal statutes.</p>\n<p>白宫声称自己的执法权由联邦法规确立。</p>\n</blockquote>\n<p>B需要federal statutes与白宫权力之间的赋予关系。实际complied with的主语是state laws，联邦法规不是is established by后的授权者，不能只凭同词相接。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. is dependent on the states’ support</h3>\n<blockquote>\n<p>白宫声称自己的执法权依赖各州的支持。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>白宫以自己的不同意作为否定州法的理由，C则要求各州支持成为其权力的依靠，倒转了原句的决定关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>白宫声称自己的执法权依赖各州的支持。</p>\n</blockquote>\n<p><code>dependent on the states’ support</code>需要由州向白宫提供权力条件，而第6段的<code>that it disagrees with</code>把白宫自己的不赞同设为否定州法的条件，因此回看末句白宫声称能做什么。</p>\n<p>原文由白宫作出判断：只要某个原本合法的州法属于<code>that it disagrees with</code>，它就声称可使其失效。<code>C</code>的<code>dependent on the states’ support</code>把权力的条件改成各州提供支持，变成白宫要从州那里取得依靠。原文的方向是白宫凭自己的不赞同约束州法，<code>C</code>却改成州的支持决定白宫的执法权。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n<p>白宫认为，即使州法完全遵守联邦法规，亚利桑那的法律仍与其执法优先事项冲突。实际上，白宫声称它可以使任何自己不同意的、原本合法的州法失效。</p>\n</blockquote>\n<p>句中it一直指白宫：它作出不赞同的判断，再声称能使州法无效。没有转向各州是否先批准。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The White House claims its enforcement power is dependent on the states’ support.</p>\n<p>白宫声称自己的执法权依赖各州的支持。</p>\n</blockquote>\n<p>C需要州的支持赋予或维持白宫权力。实际写白宫不顾州法本身合法仍主张约束它，不能把州的支持加成行使权力的前提。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. rarely goes against state laws</h3>\n<blockquote>\n<p>白宫声称自己的执法权很少与州法相抵触。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原句说明白宫自称能否定哪些州法，D改成很少与州法冲突。权限范围与实际发生频率是两个不同问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>白宫声称自己的执法权很少与州法相抵触。</p>\n</blockquote>\n<p><code>rarely goes against</code>在谈发生抵触的频率，第6段的<code>any otherwise legitimate state law</code>则谈白宫主张可以否定哪些州法，因此回看白宫声明的末句。</p>\n<p>原文说白宫自认可以使<code>any otherwise legitimate state law</code>失效，条件是它不赞同该法；这是声称权力能达到的范围。<code>D</code>的<code>rarely goes against</code>改成“很少发生抵触”的频率判断。原文的<code>any</code>不是统计抵触发生了多少次，不能与<code>rarely</code>直接比多少；但<code>D</code>确实把“有权否定任一不赞同的州法”换成了“通常不与州法抵触”，没有保留原句声明的权力范围。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.</p>\n<p>白宫认为，即使州法完全遵守联邦法规，亚利桑那的法律仍与其执法优先事项冲突。实际上，白宫声称它可以使任何自己不同意的、原本合法的州法失效。</p>\n</blockquote>\n<p>作者以any ... that it disagrees with限定白宫主张覆盖的州法，再说明otherwise legitimate也不能免于被否定。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The White House claims its enforcement power rarely goes against state laws.</p>\n<p>白宫声称自己的执法权很少与州法相抵触。</p>\n</blockquote>\n<p>D需要对冲突次数作出很少的判断，文中没有这项统计。也不能反过来把any当成现实冲突很多；真正不对应的是D未转述这项权限声明。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>39题结论</h3>\n<blockquote>\n<p><strong>39. A</strong></p>\n</blockquote>\n<ul>\n<li>A：即使州法遵守联邦法规，白宫仍声称可因自己不同意而使它失效。A的outweighs对应其自称能够压过州依法行动的权力。</li>\n<li>B：联邦法规在原句中是州法遵守的准则，B却把它写成白宫执法权的设立依据，添上了原文没有说明的权力来源。</li>\n<li>C：白宫以自己的不同意作为否定州法的理由，C则要求各州支持成为其权力的依靠，倒转了原句的决定关系。</li>\n<li>D：原句说明白宫自称能否定哪些州法，D改成很少与州法冲突。权限范围与实际发生频率是两个不同问题。</li>\n</ul>\n<h2>40题</h2>\n<blockquote>\n<p>What can be learned from the last paragraph?</p>\n<p>从最后一段可以得知什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>推断题：要从末段政府提出的要求及法官驳回它的结果，判断裁决的实际作用。</p>\n<p>题干直接指定the last paragraph，最后一段就是第7段，从Some powers开始完整读到Every Justice的判断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so.</p>\n<p>The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either</p>\n<p>Every Justice rightly rejected this remarkable claim</p>\n</blockquote>\n<h3>A. Immigration issues are usually decided by Congress.</h3>\n<blockquote>\n<p>从末段可以得知：移民问题通常由国会决定。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>国会有权禁止州用自身资源核查，但从未这样禁止，说明的是一项具体权力。A扩大成移民问题通常由国会决定的一般安排。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：移民问题通常由国会决定。</p>\n</blockquote>\n<p><code>usually decided by Congress</code>涉及移民问题的一般决策安排，而段中的<code>if Congress wanted</code>与<code>it could</code>谈国会能否禁止州核查身份，因此回看这一假设句及<code>It never did so</code>。</p>\n<p>原文的<code>if Congress wanted</code>设定一个具体情形：国会若要禁止州使用自己的资源核查身份，就有能力这样做，但实际上没有做。<code>A</code>的<code>usually decided by Congress</code>把这项特定禁止权扩成移民问题通常由国会决断的一般安排。它同时扩大了事情的范围，并把一次能力与实际行为的区分改成“通常”的频率说明；原句并没有建立这种一般分工。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n<p>但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。</p>\n</blockquote>\n<p>作者先承认联邦专属权力，再以could与never did区分国会能够下禁令和事实上未下禁令。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Immigration issues are usually decided by Congress.</p>\n<p>从末段可以得知：移民问题通常由国会决定。</p>\n</blockquote>\n<p>A需要移民问题的一般决策归属以及usually的频率。实际只检验这一具体禁令是否存在，不能由有权采取一次行动推出通常决定所有这类问题。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. The Administration is dominant over immigration issues.</h3>\n<blockquote>\n<p>从末段可以得知：行政当局在移民问题上居于支配地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>行政当局要求各州也不得执行，却被所有法官驳回。B把未获认可的权力要求写成已有的支配地位。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：行政当局在移民问题上居于支配地位。</p>\n</blockquote>\n<p><code>dominant over</code>要检查政府能否凭自己的选择支配州的行动，段末的<code>no state should be allowed</code>正是政府提出的要求，随后<code>Every Justice rightly rejected</code>给出回应，所以合看这两句。</p>\n<p>原文写政府因为自己不愿执行国会的移民意愿，就主张各州也不应获准执行；接着<code>Every Justice rightly rejected</code>说明所有法官驳回了这一要求，作者还用<code>rightly</code>表示赞同驳回。<code>B</code>的<code>dominant over</code>则把政府可以支配移民事项写成该段可得的结论。政府确实提出了支配州行动的要求，但原文把它作为被驳回的主张，不能把被否定的要求变成已获得的支配地位。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n<p>但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。</p>\n</blockquote>\n<p>作者先转述政府的理由，再以Every Justice rejected给出处理结果；rightly进一步表示赞同限制这项要求。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Administration is dominant over immigration issues.</p>\n<p>从末段可以得知：行政当局在移民问题上居于支配地位。</p>\n</blockquote>\n<p>若政府支配移民事务是段落结论，末句就应支持其阻止州行动的权力。实际裁决拒绝了这项要求，不能只读政府想做什么而跳过结果。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Justices wanted to strengthen its coordination with Congress.</h3>\n<blockquote>\n<p>从末段可以得知：法官想加强与国会之间的协调。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：法官想加强与国会之间的协调。</p>\n</blockquote>\n<p>法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。</p>\n<p>国会的意愿先作为政府不愿执行的内容出现，法官随后否定由此限制州的要求；法官与国会之间并未展开协调行为。</p>\n<p>C需要want与加强协调之间的目的关系。实际能看到的只是驳回政府主张，不能因这一结果没有违背国会意愿，就额外补上加强协调的动机。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n<p>但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。</p>\n</blockquote>\n<p>国会的意愿先作为政府不愿执行的内容出现，法官随后否定由此限制州的要求；法官与国会之间并未展开协调行为。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Justices wanted to strengthen their coordination with Congress.</p>\n<p>从末段可以得知：法官想加强与国会之间的协调。</p>\n</blockquote>\n<p>C需要want与加强协调之间的目的关系。实际能看到的只是驳回政府主张，不能因这一结果没有违背国会意愿，就额外补上加强协调的动机。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Justices intended to check the power of the Administration.</h3>\n<blockquote>\n<p>从末段可以得知：法官意在制约行政当局的权力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>法官不允许政府把自己的不愿执行变成禁止各州执行的理由，限制的正是行政当局想取得的这一权力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>从末段可以得知：法官意在制约行政当局的权力。</p>\n</blockquote>\n<p><code>check the power</code>要看裁决是否限制政府的权力要求，末段<code>no state should be allowed</code>是政府试图限制州的主张，<code>Every Justice rightly rejected</code>则给出法官的裁决，因此把这两句合看。</p>\n<p>原文写政府主张：自己不愿执行国会的移民意愿，就不应允许州执行；<code>Every Justice rightly rejected</code>则拒绝让这一主张成立。<code>D</code>的<code>check the power</code>把法官裁决的方向概括为制约政府权力。裁决直接针对政府要求决定各州能否执行的权力，而不是另设一个与裁决无关的目的，所以可以由拒绝这一要求推得法官在限制这种行政权力主张。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n<p>但如果国会想禁止各州用自身资源核查移民身份，它有权这样做；它从未如此做。行政当局实际上主张：因为自己不愿执行国会的移民意愿，各州也都不应获准执行。每位大法官都正确地驳回了这一惊人的主张。</p>\n</blockquote>\n<p>国会尚未下禁令，政府却企图用执法优先事项产生同样结果；作者用法官一致拒绝结束这条推论。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Justices intended to check the power of the Administration.</p>\n<p>从末段可以得知：法官意在制约行政当局的权力。</p>\n</blockquote>\n<p>D的check the power可以落实到被驳回的具体要求，没有另添无关目的。它概括的是裁决限制了行政当局支配州合法行动的企图。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>40题结论</h3>\n<blockquote>\n<p><strong>40. D</strong></p>\n</blockquote>\n<ul>\n<li>A：国会有权禁止州用自身资源核查，但从未这样禁止，说明的是一项具体权力。A扩大成移民问题通常由国会决定的一般安排。</li>\n<li>B：行政当局要求各州也不得执行，却被所有法官驳回。B把未获认可的权力要求写成已有的支配地位。</li>\n<li>C：法官驳回政府限制各州的主张，没有说明其目的是加强与国会协调。C把裁决的内容换成了另一个合作动机。</li>\n<li>D：法官不允许政府把自己的不愿执行变成禁止各州执行的理由，限制的正是行政当局想取得的这一权力。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：最高法院裁决的双重结果</strong>（段落1核心矛盾） 表面胜利：5-3推翻亚利桑那州移民法大部分内容（奥巴马政府的政策胜利）// 实质失败：8-0否决政府打破联邦-州权力平衡的努力（宪法层面的失败）</p>\n<p>↓（具体案情分析）</p>\n<p><strong>逻辑层次2：亚利桑那州法案的内容与宪法原则</strong>（段落2-3法律分析） 案件背景：亚利桑那州试图让州警执行联邦移民法（制定平行政策）→ 宪法原则：【只有联邦有权建立统一归化规则 + 联邦法优于州法】→ 多数派裁决：推翻3/4条款（国会已&quot;占据该领域&quot;，州侵犯联邦特权）</p>\n<p>↓（例外情况）</p>\n<p><strong>逻辑层次3：州在移民执法中的合法角色</strong>（段落4例外条款） 保留条款：允许亚利桑那州警察核实接触者的法律身份 → 原因：国会一直设想联邦-州联合执法 + 鼓励信息共享与合作</p>\n<p>→（不同意见）</p>\n<p><strong>逻辑层次4：大法官们的分歧</strong>（段落5意见分歧） 部分同意：阿利托和托马斯（同意宪法逻辑 // 但对具体冲突有异议）+ 主要反对：斯卡利亚（援引《外国人和煽动叛乱法》为州特权辩护）</p>\n<p>↓（核心争议）</p>\n<p><strong>逻辑层次5：行政权力的越界</strong>（段落6-7权力之争） 白宫的主张：【州法即使符合联邦法规字面要求，仍因与执法优先事项冲突而无效】→ 实质：白宫可以使任何不同意的合法州法无效（&quot;令人震惊的联邦行政权力主张&quot;）→ 法院回应：【承认某些权力专属联邦（如边界控制）// 但国会从未禁止州使用自己资源检查移民身份】→ 结论：所有大法官拒绝政府&quot;因自己不想执行就禁止州执行&quot;的主张</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：虽然最高法院推翻了亚利桑那州移民法的部分条款，但更重要的是，法院以8-0的一致决定拒绝了奥巴马政府试图扩大联邦行政权力、破坏联邦与州权力平衡的努力。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. A shared constitutional logic with remaining disagreements</p>\n<p>B. Rejecting executive priorities as a reason to cancel lawful action</p>\n<p>C. Why some state provisions entered a reserved federal field</p>\n<p>D. An end to cooperation between federal and state officers</p>\n<p>E. A policy victory accompanied by a constitutional defeat</p>\n<p>F. The lawful place of state officers in joint enforcement</p>\n<p>G. A unanimous rejection of every state immigration rule</p>\n<p><strong>41.</strong></p>\n<p>On a five to three vote, the Supreme Court knocked out much of Arizona’s immigration law Monday – a modest policy victory for the Obama Administration. But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration’s effort to upset the balance of power between the federal government and the states.</p>\n<p><strong>42.</strong></p>\n<p>In <em>Arizona v. United States</em>, the majority overturned three of the four contested provisions of Arizona’s controversial plan to have state and local police enforce federal immigration law. The Constitutional principles that Washington alone has the power to “establish a uniform Rule of Naturalization” and that federal laws precede state laws are noncontroversial. Arizona had attempted to fashion state policies that ran parallel to the existing federal ones. Justice Anthony Kennedy, joined by Chief Justice John Roberts and the Court’s liberals, ruled that the state flew too close to the federal sun. On the overturned provisions the majority held Congress had deliberately “occupied the field” and Arizona had thus intruded on the federal’s privileged powers.</p>\n<p><strong>43.</strong></p>\n<p>However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement. That’s because Congress has always envisioned joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n<p><strong>44.</strong></p>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute. The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.</p>\n<p><strong>45.</strong></p>\n<p>The 8-0 objection to President Obama turns on what Justice Samuel Alito describes in his objection as “a shocking assertion of federal executive power”. The White House argued that Arizona’s laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter. In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with. Some powers do belong exclusively to the federal government, and control of citizenship and the borders is among them. But if Congress wanted to prevent states from using their own resources to check immigration status, it could. It never did so. The Administration was in essence asserting that because it didn’t want to carry out Congress’s immigration wishes, no state should be allowed to do so either. Every Justice rightly rejected this remarkable claim.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】E. A policy victory accompanied by a constitutional defeat</p>\n<blockquote>\n<p>政策胜利伴随宪法层面的失败</p>\n</blockquote>\n<p>开头把5比3的部分政策胜利与8比0的宪法争议失败放在对照关系中。</p>\n<blockquote>\n<p>On a five to three vote, the Supreme Court knocked out much of Arizona’s immigration law Monday – a modest policy victory for the Obama Administration.</p>\n</blockquote>\n<p>第一句把撤销多项州法称为政府在政策上的小胜，5比3对应这一层结果。</p>\n<blockquote>\n<p>But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration’s effort to upset the balance of power between the federal government and the states.</p>\n</blockquote>\n<p>But转到更重要的宪法问题：政府打破联邦与州权力平衡的努力以8比0失败。两个票数属于不同问题，不能相互代换。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>多项州法被撤销：政策小胜 → 行政扩权被一致拒绝：宪法层面失败</p>\n</blockquote>\n<p>policy victory与constitutional defeat对应两个不同层面的裁决，不能合并成政府全面胜利。</p>\n<p>再看最强干扰项G：A unanimous rejection of every state immigration rule。</p>\n<p>撤销的是多项条款而非全部；而且8比0针对政府扩大权限的主张。</p>\n<p><strong>41题选E。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】C. Why some state provisions entered a reserved federal field</p>\n<blockquote>\n<p>部分州条款为何进入联邦专属领域</p>\n</blockquote>\n<p>先交代三项条款被推翻，再用联邦优先、国会占据领域说明裁决理由。</p>\n<blockquote>\n<p>In <em>Arizona v. United States</em>, the majority overturned three of the four contested provisions of Arizona’s controversial plan to have state and local police enforce federal immigration law.</p>\n</blockquote>\n<p>开头交代争议计划四条中有三条被推翻，标题需要继续回答为什么是这些条款越界。</p>\n<blockquote>\n<p>Arizona had attempted to fashion state policies that ran parallel to the existing federal ones.</p>\n</blockquote>\n<p>州试图制定与联邦政策并行的政策，联系联邦法优先原则，问题是州能否另行进入已有联邦规则的领域。</p>\n<blockquote>\n<p>On the overturned provisions the majority held Congress had deliberately “occupied the field” and Arizona had thus intruded on the federal’s privileged powers.</p>\n</blockquote>\n<p>occupied the field与intruded把国会已经占据和州随后侵入接为因果，正面给出撤销条款的理由。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>州的三项条款被撤销 → 制定并行政策受到联邦优先限制 → 国会已占领域而州侵入</p>\n</blockquote>\n<p>reserved federal field概括occupied the field和privileged powers；entered对应intruded。</p>\n<p>再看最强干扰项D：An end to cooperation between federal and state officers。</p>\n<p>权限领域争议不表示执法合作终结，下一部分明确允许合作。</p>\n<p><strong>42题选C。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】F. The lawful place of state officers in joint enforcement</p>\n<blockquote>\n<p>联合执法中州官员的合法位置</p>\n</blockquote>\n<p>However转出仍被允许的身份核查，再以国会鼓励信息共享解释这一例外。</p>\n<blockquote>\n<p>However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.</p>\n</blockquote>\n<p>However承接前面的撤销，却说明仍有获准的州警察工作：核查执法接触者的身份。</p>\n<blockquote>\n<p>That’s because Congress has always envisioned joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.</p>\n</blockquote>\n<p>That’s because说明这项许可来自国会设想的共同执法及信息合作，因此州有合法角色，却不是完全独立于联邦法。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>州警察身份核查获准 → 国会设想联合执法 → 信息共享与合作解释许可</p>\n</blockquote>\n<p>lawful place对应would be allowed，joint enforcement对应joint federal-state及cooperate。</p>\n<p>再看最强干扰项G：A unanimous rejection of every state immigration rule。</p>\n<p>恰恰存在合法保留部分，所以不是否定全部州规则。</p>\n<p><strong>43题选F。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】A. A shared constitutional logic with remaining disagreements</p>\n<blockquote>\n<p>共同宪法逻辑之下仍有分歧</p>\n</blockquote>\n<p>Alito与Thomas接受宪法逻辑但对冲突条款有异议；Scalia更强力维护州权。</p>\n<blockquote>\n<p>Two of the three objecting Justices – Samuel Alito and Clarence Thomas – agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute.</p>\n</blockquote>\n<p>agreed与disagreed落在不同对象上：两名法官接受宪法逻辑，却对具体哪些州规则冲突有异议。</p>\n<blockquote>\n<p>The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.</p>\n</blockquote>\n<p>Scalia的更强州权辩护补充另一类异议。标题要兼顾部分原则共识与尚存分歧，不能把三人的立场压成完全一致。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>两名法官接受原则但分歧在具体条款 → 另一法官进一步维护州特权</p>\n</blockquote>\n<p>shared logic与remaining disagreements同时保留原则一致和具体裁决分歧。</p>\n<p>再看最强干扰项C：Why some state provisions entered a reserved federal field。</p>\n<p>这里讨论异议法官的立场，不再主要解释多数方为何撤销三条。</p>\n<p><strong>44题选A。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】B. Rejecting executive priorities as a reason to cancel lawful action</p>\n<blockquote>\n<p>拒绝以行政优先事项否定合法行动</p>\n</blockquote>\n<p>先呈现白宫以执行优先事项否定合法州法的要求，再指出国会并未禁止州核查，因此所有法官拒绝这一要求。</p>\n<blockquote>\n<p>The 8-0 objection to President Obama turns on what Justice Samuel Alito describes in his objection as “a shocking assertion of federal executive power”.</p>\n</blockquote>\n<p>shocking assertion先定出争议是行政部门提出了过大的权力要求，后文要检验它能否成立。</p>\n<blockquote>\n<p>But if Congress wanted to prevent states from using their own resources to check immigration status, it could.</p>\n</blockquote>\n<p>国会可以禁止州核查却没有禁止，说明法律权限不能被行政当局不愿执行的选择取代。</p>\n<blockquote>\n<p>Every Justice rightly rejected this remarkable claim.</p>\n</blockquote>\n<p>Every Justice rejected回到争议的结果：没有一位法官接受这种额外限制州行动的权力。B同时保留主张和否定方向。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>白宫要求依执法偏好否定州法 → 国会尚未禁止州核查 → 法官一致拒绝行政扩权</p>\n</blockquote>\n<p>executive priorities不能自动压过otherwise legitimate state law；末段拒绝的是行政部门额外扩张的权力。</p>\n<p>再看最强干扰项D：An end to cooperation between federal and state officers。</p>\n<p>拒绝行政扩权与禁止执法合作相反，州依法协作的空间仍被保留。</p>\n<p><strong>45题选B。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>A judicial decision can give an administration a policy victory while rejecting its larger constitutional claim. The Arizona immigration case illustrates that distinction. Much of the state plan was overturned, yet the federal executive did not obtain the unrestricted authority it had sought.</p>\n<p><strong>B.</strong></p>\n<p>Under that claim, compliance with a statute would no longer be enough to protect a state law from invalidation. The executive could set aside lawful action simply because it preferred a different enforcement policy. That is why the dispute required a distinction between powers granted by Congress and preferences expressed by the administration.</p>\n<p><strong>C.</strong></p>\n<p>Congress could have used its powers to prohibit states from making the relevant checks, but it had not done so. The absence of such a prohibition undermined the administration’s attempt to impose the same result through its own priorities. The judges accordingly refused to accept that attempt.</p>\n<p><strong>D.</strong></p>\n<p>One role remained: checking the legal status of people encountered during law enforcement. Congress had envisaged cooperation and encouraged officers to share information across federal and state institutions. The surviving provision therefore reflected a model of joint enforcement rather than complete state independence.</p>\n<p><strong>E.</strong></p>\n<p>This constitutional model was accepted even by some judges who disagreed over particular provisions. Their disagreement concerned which rules conflicted with federal law, not whether that law mattered. Another dissent went further in defending state privileges by appealing to earlier historical legislation.</p>\n<p><strong>F.</strong></p>\n<p>The overturned part concerned several state provisions in an area already occupied by Congress. Federal law took priority, so the state could not simply create a parallel system. That finding established a boundary on state action, but it did not remove every lawful role for state officers.</p>\n<p><strong>G.</strong></p>\n<p>The historical defence of state privileges was not, however, the central obstacle to the administration. Its broader claim was that state action could be stopped whenever it conflicted with executive enforcement priorities, even when the state otherwise obeyed federal statutes.</p>\n<p><strong>H.</strong></p>\n<p>Their refusal preserved two boundaries at once. States must respect fields reserved to federal law, while the executive must not treat every policy preference as authority to cancel lawful state participation. The decision therefore cannot be described accurately as an unlimited victory for either side.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>区分政策结果与宪法主张</td>\n</tr>\n<tr>\n<td>B</td>\n<td>解释行政偏好为何不能等于法定权限</td>\n</tr>\n<tr>\n<td>C</td>\n<td>以国会未禁止说明拒绝行政扩权</td>\n</tr>\n<tr>\n<td>D</td>\n<td>具体解释保留的共同执法角色</td>\n</tr>\n<tr>\n<td>E</td>\n<td>说明共同原则内的分歧及历史援引</td>\n</tr>\n<tr>\n<td>F</td>\n<td>说明撤销条款并保留州合法空间</td>\n</tr>\n<tr>\n<td>G</td>\n<td>转向行政部门更广的优先权主张</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结州和行政部门各自的权力边界</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>区分政策结果与宪法主张 → 说明撤销条款并保留州合法空间 → 具体解释保留的共同执法角色 → 说明共同原则内的分歧及历史援引 → 转向行政部门更广的优先权主张 → 解释行政偏好为何不能等于法定权限 → 以国会未禁止说明拒绝行政扩权 → 总结州和行政部门各自的权力边界</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Much of the state plan was overturned, yet the federal executive did not obtain the unrestricted authority it had sought.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>The overturned part concerned several state provisions in an area already occupied by Congress.</p>\n</blockquote>\n<p>A末句先说much of the state plan was overturned，F的The overturned part承接这一被撤销部分，继续说明其涉及国会占据的领域。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Federal law took priority, so the state could not simply create a parallel system. That finding established a boundary on state action, but it did not remove every lawful role for state officers.</p>\n</blockquote>\n<p>F先解释联邦法优先为何约束州，再用but it did not remove every lawful role保留州合法参与的空间。末句已把话题转到仍可做什么。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>One role remained: checking the legal status of people encountered during law enforcement.</p>\n</blockquote>\n<p>D的One role remained承接F的lawful role，再把它具体化为核查身份，形成从边界到保留职责的推进。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>区分政策结果与宪法主张 → 说明撤销条款并保留州合法空间 → 具体解释保留的共同执法角色</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The historical defence of state privileges was not, however, the central obstacle to the administration.</p>\n</blockquote>\n<p>G开头的historical defence需要前面先介绍历史辩护；A没有这层内容。它也没有留下州仍有何职责，不能给后面的D提供role的承接。</p>\n<p><strong>41题选F。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>That finding established a boundary on state action, but it did not remove every lawful role for state officers.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>One role remained: checking the legal status of people encountered during law enforcement.</p>\n</blockquote>\n<p>F末句说州的合法角色未被全部取消，D的One role remained回答到底保留了哪一项：核查合法身份。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Congress had envisaged cooperation and encouraged officers to share information across federal and state institutions. The surviving provision therefore reflected a model of joint enforcement rather than complete state independence.</p>\n</blockquote>\n<p>国会鼓励共享信息和合作，为保留条款提供制度依据。末句概括成model of joint enforcement，而非完全州独立。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>This constitutional model was accepted even by some judges who disagreed over particular provisions.</p>\n</blockquote>\n<p>E的This constitutional model接D末句的model，再说明一些法官接受这套原则但对具体条款仍有分歧。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明撤销条款并保留州合法空间 → 具体解释保留的共同执法角色 → 说明共同原则内的分歧及历史援引</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The historical defence of state privileges was not, however, the central obstacle to the administration.</p>\n</blockquote>\n<p>G起句要求historical defence，而F没有历史材料；先放G也会让E的This constitutional model缺少前面刚概括的共同执法模式。</p>\n<p><strong>42题选D。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Another dissent went further in defending state privileges by appealing to earlier historical legislation.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The historical defence of state privileges was not, however, the central obstacle to the administration.</p>\n</blockquote>\n<p>E末句用历史法案为州权辩护，G的The historical defence回指这项材料；however把重点转向政府真正面对的主要障碍。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Its broader claim was that state action could be stopped whenever it conflicted with executive enforcement priorities, even when the state otherwise obeyed federal statutes.</p>\n</blockquote>\n<p>G解释更广的行政主张：即使州遵守联邦法规，也可因违背行政执法偏好而被阻止。这个完整claim是下一段要检查的对象。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Under that claim, compliance with a statute would no longer be enough to protect a state law from invalidation.</p>\n</blockquote>\n<p>B的Under that claim逐句承接G，解释这种主张为何让守法不足以保护州法免遭否定。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明共同原则内的分歧及历史援引 → 转向行政部门更广的优先权主张 → 解释行政偏好为何不能等于法定权限</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Congress could have used its powers to prohibit states from making the relevant checks, but it had not done so.</p>\n</blockquote>\n<p>C先谈国会没有禁止核查，是反驳扩权的依据。若在G交代主张之前出现，B的that claim就缺少所指，论证也会先反驳再提出被反驳内容。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Its broader claim was that state action could be stopped whenever it conflicted with executive enforcement priorities, even when the state otherwise obeyed federal statutes.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Under that claim, compliance with a statute would no longer be enough to protect a state law from invalidation.</p>\n</blockquote>\n<p>G写出即使守法仍可被行政优先事项否定的主张，B用Under that claim继续推演这一后果。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The executive could set aside lawful action simply because it preferred a different enforcement policy. That is why the dispute required a distinction between powers granted by Congress and preferences expressed by the administration.</p>\n</blockquote>\n<p>B把问题拆为法定权力与行政偏好两类：行政当局想凭不同偏好搁置合法行动，因此必须确认国会到底授予了什么权力。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>Congress could have used its powers to prohibit states from making the relevant checks, but it had not done so.</p>\n</blockquote>\n<p>C从Congress could have used its powers开始，正回答B提出的法定权限问题，并用but it had not done so说明不存在这项禁令。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转向行政部门更广的优先权主张 → 解释行政偏好为何不能等于法定权限 → 以国会未禁止说明拒绝行政扩权</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>The overturned part concerned several state provisions in an area already occupied by Congress.</p>\n</blockquote>\n<p>F解释州条款为何被撤销，回到了州是否越界；这里正在分析行政当局是否越界，换成F会中断由行政主张到法定权限检验的连接。</p>\n<p><strong>44题选B。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>That is why the dispute required a distinction between powers granted by Congress and preferences expressed by the administration.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Congress could have used its powers to prohibit states from making the relevant checks, but it had not done so.</p>\n</blockquote>\n<p>B结尾要求区分国会授予的权力与行政偏好，C接着查国会是否使用其权力禁止州核查。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The absence of such a prohibition undermined the administration’s attempt to impose the same result through its own priorities. The judges accordingly refused to accept that attempt.</p>\n</blockquote>\n<p>有权禁止但没有禁止，削弱了政府凭自身优先事项取得同样禁止效果的企图，法官据此拒绝它。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Their refusal preserved two boundaries at once.</p>\n</blockquote>\n<p>H的Their refusal指C末句judges refused，再总结这一拒绝同时保留了两条权力边界。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释行政偏好为何不能等于法定权限 → 以国会未禁止说明拒绝行政扩权 → 总结州和行政部门各自的权力边界</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>The overturned part concerned several state provisions in an area already occupied by Congress.</p>\n</blockquote>\n<p>F的overturned part回到前面的州法条款，不提供法官拒绝行政扩权这一结果；若接F，H的Their refusal便不能紧接对应行动。</p>\n<p><strong>45题选C。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>constitutional limits</strong></td>\n<td><strong>宪法约束</strong></td>\n<td><strong>社会现象类｜社会生活</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<t
