prove the lot of those to come.<\/p>\n<p>从长期历史中获取预测依据，再用已有知识减少危险、改善后代处境。<\/p>\n<\/blockquote>\n<p>文章沿着积极使用知识的路线收束，没有把某种改变历史的企图列为必须先压制的问题。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>We must curb our ambition to reshape history in order to secure humanity’s future.<\/p>\n<p>为了保障人类未来，我们必须抑制重塑历史的雄心。<\/p>\n<\/blockquote>\n<p>D要求明确指出这类雄心应受到限制。原文没有评价这种动机，而是解释已有认识怎样支持应对未来，不能把“利用历史”改写成“限制重塑历史的雄心”。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>要保障仍然值得期待的人类未来，应利用已有知识辨认和减少风险、改善后代处境；其中知识怎样取得，要由第六段关于过去与长期模式的说明补足，积极态度本身不能替代这一步。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>curb our ambition to reshape history<br>抑制我们重塑历史的雄心<\/p>\n<\/blockquote>\n<p>全文看好人类利用知识改善未来的能力，但积极主旨本身不决定每一种雄心是否应限制。本项最终仍要根据“identified enough of the long-term patterns”及末段的知识用途判断：这两处支持认识和运用过去，没有提出抑制重塑历史雄心这一要求。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"34题结论","raw":"### 34题结论\n\n> **34. A. draw on our experience from the past**\n\nA把识别历史模式并利用知识应对未来概括为借鉴过去经验。\n\nB把有知识依据的积极态度换成保障未来的关键手段。\n\nC借地球一词补出了丰富资源及探索资源的关键作用。\n\nD借历史与风险主题补出了重塑历史的雄心及必须抑制它的要求。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[18,1597,1259,419],"sourceW":1452,"sourceH":2561},"meta":{"kind":"conclusion","question":34},"level":3,"html":"<blockquote>\n<p><strong>34. A. draw on our experience from the past<\/strong><\/p>\n<\/blockquote>\n<p>A把识别历史模式并利用知识应对未来概括为借鉴过去经验。<\/p>\n<p>B把有知识依据的积极态度换成保障未来的关键手段。<\/p>\n<p>C借地球一词补出了丰富资源及探索资源的关键作用。<\/p>\n<p>D借历史与风险主题补出了重塑历史的雄心及必须抑制它的要求。<\/p>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"section":"第四鸟 · 新题型","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n## 段落与全文逻辑框架\n\n**逻辑层次1：人类未来观的转变**（段落1-2主题引入） 过去的乐观愿景：（科学技术将治愈所有疾病 → 带来充满成就感和机会的生活）// 现在的悲观转向：（认识到各种威胁：小行星撞击、流行病、气候变化 → 人类似乎没有未来）\n\n↓（反驳悲观论）\n\n**逻辑层次2：反驳悲观论的证据**（段落3论证支撑） 悲观是错位的：【化石记录：许多物种存续数百万年 → 人类为何不能？】+ 【IUCN红色名录：智人列为\"最少关注\"（分布广泛 + 适应性强 + 数量增长 + 无重大威胁）】→ 结论：人类有极好机会存活数万至数十万年\n\n↓（探讨未来的努力）\n\n**逻辑层次3：思考未来的不同时间尺度**（段落4-5方法论） 长远未来的思考：（越来越多研究者认真思考 → 例：长远基金会的千年钟项目）// 近期未来的复杂性：（技术演变及社会后果令人眼花缭乱 → 留给科幻作家和未来学家 → Arc出版物专注近期未来）\n\n↓（预测的基础）\n\n**逻辑层次4：基于过去预测未来**（段落6预测方法） 长远视角的优势：可以相当确信地预测 → 方法论：【过去是未来的钥匙：识别塑造地球和人类历史的长期模式 → 做出基于证据的预测】\n\n↓（总结展望）\n\n**逻辑层次5：理性乐观的未来观**（段落7结论） 长远视角的启示：悲观主义可能只是一时风尚 → 平衡的观点：【未来并非全是美好 // 但人类现在有足够知识：（减少威胁早期人类的风险 + 改善后代命运）】\n\n↑（全文主旨）\n\n全文核心观点：虽然当前对人类未来的悲观情绪盛行，但从长远视角和科学证据来看，人类作为一个物种有着光明的前景，我们有能力利用知识减少风险并改善后代的生活。\n\n## 小标题题\n\nRead the following text and choose the most suitable heading from the list A–G for each numbered section (41–45). There are two extra headings.\n\n[A] Research that stretches the horizon of human thinking\n\n[B] Technology making the near future easy to predict\n\n[C] From confident visions to fears about tomorrow\n\n[D] Evidence for humanity’s chances of long survival\n\n[E] Qualified optimism and action for future generations\n\n[F] Species survival as a guarantee of everyone’s happiness\n\n[G] Different timescales and different grounds for confidence\n\n### 41. ______\n\nWhat has happened to our picture of the future? Until a few decades ago, many visions of what lay ahead were strongly positive, although they were never uniformly so. Science and technology were expected to cure humanity’s problems and make lives of fulfilment and opportunity available to all.\n\nThat confidence has become less fashionable as the range of threats has become more apparent. Asteroid impacts, pandemic disease and climate change can make the future look much less welcoming. Awareness of these dangers might even tempt people to assume that humanity has little to look forward to. The change described here is from a largely hopeful picture to a mood in which threats dominate expectations; it is not yet a demonstration that those expectations are correct.\n\n### 42. ______\n\nSuch gloom is misplaced. The fossil record shows that many species have persisted for millions of years, raising the question of why our own should be assumed incapable of lasting. From a wider perspective, humanity has an excellent chance of surviving for tens or even hundreds of thousands of years.\n\nThe International Union for Conservation of Nature’s Red List offers another relevant piece of evidence. Homo sapiens is classified as Least Concern because the species is widely distributed, adaptable and increasing in number, without major threats producing an overall population decline. This assessment concerns the species as a whole. Alongside the fossil record, it supports a better view of the prospects for human persistence than the prevailing gloom suggests, without claiming that every individual will avoid difficulty.\n\n### 43. ______\n\nResearchers and organisations are already exploring what such a distant future could hold. The Long Now Foundation in San Francisco provides a forum where thinkers and scientists consider the implications of their ideas over very long periods. Its flagship project is a mechanical clock buried inside a mountain in Texas, designed to continue marking time thousands of years from now.\n\nOther scientists are considering whether to recognise a new geological era, the Anthropocene. They are likewise stepping back from immediate events to ask what humanity’s impact on the planet will be in the context of stratigraphic time. The clock and the proposed geological perspective differ in form, but both encourage people to think across intervals much longer than those of everyday forecasting. They show that the distant future is becoming a subject of deliberate inquiry.\n\n### 44. ______\n\nSurprisingly, it may be easier to think about very long periods than about the immediate future. The possible evolution of present-day technology and its social consequences is enormously complicated. Science-fiction writers and futurologists can explore the many possibilities; this complexity is one reason for launching Arc, a publication devoted to the near future.\n\nA longer view offers a different basis for prediction. Enough long-term patterns shaping the history of the planet and of humanity have now been identified to make evidence-based forecasts about the circumstances our descendants may face. The past can therefore provide a key to the distant future. The contrast is not that every remote event can be predicted, but that enduring patterns permit considerable confidence in some long-range statements while near-term technological possibilities are difficult to disentangle.\n\n### 45. ______\n\nA long perspective makes today’s pessimism about humanity’s prospects look more like a passing fashion. Yet the future is not entirely rosy: the species may flourish while a great many individuals do not. Hope for humanity’s persistence must not be mistaken for a promise of a good life for everyone.\n\nEven with that qualification, people now know enough to reduce many risks that threatened earlier humans and to improve the lives of those who come after them. Thinking about our place in deep time can help focus attention on present challenges and on building a future worth living in.","context":{"mode":"newtype","kind":"smallTitle","current":"","label":"小标题题"},"meta":{},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：人类未来观的转变<\/strong>（段落1-2主题引入） 过去的乐观愿景：（科学技术将治愈所有疾病 → 带来充满成就感和机会的生活）// 现在的悲观转向：（认识到各种威胁：小行星撞击、流行病、气候变化 → 人类似乎没有未来）<\/p>\n<p>↓（反驳悲观论）<\/p>\n<p><strong>逻辑层次2：反驳悲观论的证据<\/strong>（段落3论证支撑） 悲观是错位的：【化石记录：许多物种存续数百万年 → 人类为何不能？】+ 【IUCN红色名录：智人列为&quot;最少关注&quot;（分布广泛 + 适应性强 + 数量增长 + 无重大威胁）】→ 结论：人类有极好机会存活数万至数十万年<\/p>\n<p>↓（探讨未来的努力）<\/p>\n<p><strong>逻辑层次3：思考未来的不同时间尺度<\/strong>（段落4-5方法论） 长远未来的思考：（越来越多研究者认真思考 → 例：长远基金会的千年钟项目）// 近期未来的复杂性：（技术演变及社会后果令人眼花缭乱 → 留给科幻作家和未来学家 → Arc出版物专注近期未来）<\/p>\n<p>↓（预测的基础）<\/p>\n<p><strong>逻辑层次4：基于过去预测未来<\/strong>（段落6预测方法） 长远视角的优势：可以相当确信地预测 → 方法论：【过去是未来的钥匙：识别塑造地球和人类历史的长期模式 → 做出基于证据的预测】<\/p>\n<p>↓（总结展望）<\/p>\n<p><strong>逻辑层次5：理性乐观的未来观<\/strong>（段落7结论） 长远视角的启示：悲观主义可能只是一时风尚 → 平衡的观点：【未来并非全是美好 // 但人类现在有足够知识：（减少威胁早期人类的风险 + 改善后代命运）】<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：虽然当前对人类未来的悲观情绪盛行，但从长远视角和科学证据来看，人类作为一个物种有着光明的前景，我们有能力利用知识减少风险并改善后代的生活。<\/p>\n"},{"title":"小标题题 · 41题","level":3,"section":"第四鸟 · 新题型","raw":"### 41题解析\n\n**答案：C — From confident visions to fears about tomorrow。** 中文：从自信的愿景转向对未来的担忧。\n\n这一部分整体在交代人们的未来观怎样变化。前段概述过去依靠科技解决问题的希望，后段写威胁意识怎样带来悲观倾向；它为后面的反驳建立对象，还没有替悲观论下结论。\n\n开头的 Until a few decades ago 与第二段的 has become less fashionable 构成前后对照。Science and technology were expected 描述过去的预期，might even tempt people to assume 则说明今天可能作出的悲观推断，两者都在写人的看法。\n\n段内推进链：回看过去的未来图景 → 科技被寄予解决问题的希望 → 对多种威胁认识加深 → 乐观不再流行 → 人们可能转而觉得前景有限。\n\n标题中的 From ... to ... 对应两段的时间与态度转变；confident visions 对应科技带来机会的旧图景；fears about tomorrow对应威胁主导的当下预期。它概括两面，而不是把威胁清单单独当中心。\n\n最强干扰项是D。这里确实讲到人类前景，但尚未给出化石或物种分布的长期生存证据。若选Evidence，就把背景中的信念变化写成了下一节才展开的反驳论据。\n\n**最终答案：41选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"41","label":"小标题题"},"meta":{},"html":"<h3>41题解析<\/h3>\n<p><strong>答案：C — From confident visions to fears about tomorrow。<\/strong> 中文：从自信的愿景转向对未来的担忧。<\/p>\n<p>这一部分整体在交代人们的未来观怎样变化。前段概述过去依靠科技解决问题的希望，后段写威胁意识怎样带来悲观倾向；它为后面的反驳建立对象，还没有替悲观论下结论。<\/p>\n<p>开头的 Until a few decades ago 与第二段的 has become less fashionable 构成前后对照。Science and technology were expected 描述过去的预期，might even tempt people to assume 则说明今天可能作出的悲观推断，两者都在写人的看法。<\/p>\n<p>段内推进链：回看过去的未来图景 → 科技被寄予解决问题的希望 → 对多种威胁认识加深 → 乐观不再流行 → 人们可能转而觉得前景有限。<\/p>\n<p>标题中的 From ... to ... 对应两段的时间与态度转变；confident visions 对应科技带来机会的旧图景；fears about tomorrow对应威胁主导的当下预期。它概括两面，而不是把威胁清单单独当中心。<\/p>\n<p>最强干扰项是D。这里确实讲到人类前景，但尚未给出化石或物种分布的长期生存证据。若选Evidence，就把背景中的信念变化写成了下一节才展开的反驳论据。<\/p>\n<p><strong>最终答案：41选C。<\/strong><\/p>\n"},{"title":"小标题题 · 42题","level":3,"section":"第四鸟 · 新题型","raw":"### 42题解析\n\n**答案：D — Evidence for humanity’s chances of long survival。** 中文：支持人类长期生存机会的证据。\n\n这一部分整体在反驳由风险意识直接推出的悲观结论。化石记录和IUCN物种评估从不同角度支持人类可能长期延续，判断的尺度始终是整个人类物种。\n\n第一句 Such gloom is misplaced 明确立场；随后 fossil record shows 引入历史比较，第二段用 Red List offers another ... piece of evidence 标明补充论据。结尾把两者合并为prospects for human persistence，并保留individual的边界。\n\n段内推进链：否定过度悲观 → 其他物种长期存续提供参照 → 提出人类可能延续很久 → 名录中的分布、适应和数量状况补强 → 得出物种持续存在的较好前景。\n\n标题中的 Evidence 对应两组支撑材料；humanity’s chances说明谈的是前景和概率；long survival对应数万年至数十万年的物种延续。chance也保留了论证的强度，没有写成绝无风险的保证。\n\n最强干扰项是F。它同样写species survival，却把物种层面的判断扩大到everyone’s happiness。红色名录的整体种群状态不能推出每个人幸福，本节结尾也明确说并非每个人都能避开困难。\n\n**最终答案：42选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"42","label":"小标题题"},"meta":{},"html":"<h3>42题解析<\/h3>\n<p><strong>答案：D — Evidence for humanity’s chances of long survival。<\/strong> 中文：支持人类长期生存机会的证据。<\/p>\n<p>这一部分整体在反驳由风险意识直接推出的悲观结论。化石记录和IUCN物种评估从不同角度支持人类可能长期延续，判断的尺度始终是整个人类物种。<\/p>\n<p>第一句 Such gloom is misplaced 明确立场；随后 fossil record shows 引入历史比较，第二段用 Red List offers another ... piece of evidence 标明补充论据。结尾把两者合并为prospects for human persistence，并保留individual的边界。<\/p>\n<p>段内推进链：否定过度悲观 → 其他物种长期存续提供参照 → 提出人类可能延续很久 → 名录中的分布、适应和数量状况补强 → 得出物种持续存在的较好前景。<\/p>\n<p>标题中的 Evidence 对应两组支撑材料；humanity’s chances说明谈的是前景和概率；long survival对应数万年至数十万年的物种延续。chance也保留了论证的强度，没有写成绝无风险的保证。<\/p>\n<p>最强干扰项是F。它同样写species survival，却把物种层面的判断扩大到everyone’s happiness。红色名录的整体种群状态不能推出每个人幸福，本节结尾也明确说并非每个人都能避开困难。<\/p>\n<p><strong>最终答案：42选D。<\/strong><\/p>\n"},{"title":"小标题题 · 43题","level":3,"section":"第四鸟 · 新题型","raw":"### 43题解析\n\n**答案：A — Research that stretches the horizon of human thinking。** 中文：拓展人类思考时间范围的研究。\n\n这一部分列举已经在认真思考深远未来的两类探索：长远基金会及其钟项目、科学家关于人类世的讨论。共同点在于拉长时间视角，而非两者使用相同工具或解决同一技术问题。\n\n首句 Researchers and organisations are already exploring 总领实例；第二段的 likewise stepping back 把人类世讨论接入同一功能。末尾用 both encourage 和 much longer 收拢两例，明确重点是思考范围的扩大。\n\n段内推进链：提出谁在研究深远未来 → 长远基金会组织跨长时段思考 → 千年钟把时间视野具体化 → 人类世研究转向地质尺度 → 两例共同说明深远未来正在被认真研究。\n\n标题中的 Research 覆盖论坛、科学思考和地质讨论；stretches the horizon对应从即时事件退后、跨越很长时段；human thinking对应这些项目培养和采用的视角。它能同时包住钟与人类世，而不把本节缩成钟的设计介绍。\n\n最强干扰项是G。文中确实出现不同时间尺度，但本节没有比较各尺度预测的信心依据；它展示两种长期探索。G所需的近期技术复杂性与长期历史模式的对照，要到下一节才完整建立。\n\n**最终答案：43选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"43","label":"小标题题"},"meta":{},"html":"<h3>43题解析<\/h3>\n<p><strong>答案：A — Research that stretches the horizon of human thinking。<\/strong> 中文：拓展人类思考时间范围的研究。<\/p>\n<p>这一部分列举已经在认真思考深远未来的两类探索：长远基金会及其钟项目、科学家关于人类世的讨论。共同点在于拉长时间视角，而非两者使用相同工具或解决同一技术问题。<\/p>\n<p>首句 Researchers and organisations are already exploring 总领实例；第二段的 likewise stepping back 把人类世讨论接入同一功能。末尾用 both encourage 和 much longer 收拢两例，明确重点是思考范围的扩大。<\/p>\n<p>段内推进链：提出谁在研究深远未来 → 长远基金会组织跨长时段思考 → 千年钟把时间视野具体化 → 人类世研究转向地质尺度 → 两例共同说明深远未来正在被认真研究。<\/p>\n<p>标题中的 Research 覆盖论坛、科学思考和地质讨论；stretches the horizon对应从即时事件退后、跨越很长时段；human thinking对应这些项目培养和采用的视角。它能同时包住钟与人类世，而不把本节缩成钟的设计介绍。<\/p>\n<p>最强干扰项是G。文中确实出现不同时间尺度，但本节没有比较各尺度预测的信心依据；它展示两种长期探索。G所需的近期技术复杂性与长期历史模式的对照，要到下一节才完整建立。<\/p>\n<p><strong>最终答案：43选A。<\/strong><\/p>\n"},{"title":"小标题题 · 44题","level":3,"section":"第四鸟 · 新题型","raw":"### 44题解析\n\n**答案：G — Different timescales and different grounds for confidence。** 中文：不同的时间尺度与不同的信心依据。\n\n这一部分整体在解释一个看似反常的比较：近期科技及其社会影响可能很难预测，较长时段却能利用已知的历史模式作出某些可靠判断。重点是两类预测的依据和难度，而非贬低近期研究。\n\n开头把 very long periods 与 immediate future 直接对照；科技的复杂性解释前者为何未必更难。第二段的 A longer view offers a different basis 转入历史模式，末句用 some long-range statements 限定信心的范围。\n\n段内推进链：提出长期思考可能更容易 → 近期技术分支及社会后果复杂 → 科幻与未来研究探索多种可能 → 长期模式提供另一种依据 → 对部分远期情况可作有证据的预测。\n\n标题中的 Different timescales 对应近期和长期；different grounds for confidence对应复杂的技术可能性与可识别的历史模式。它覆盖两个段落的比较关系，也保留“有些长期判断”这一范围。\n\n最强干扰项是B。科技的确占了第一段，但它被用来解释近期预测的困难；making ... easy恰好反转了dazzlingly complicated的方向，而且无法涵盖第二段借助过去模式的解释。\n\n**最终答案：44选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"44","label":"小标题题"},"meta":{},"html":"<h3>44题解析<\/h3>\n<p><strong>答案：G — Different timescales and different grounds for confidence。<\/strong> 中文：不同的时间尺度与不同的信心依据。<\/p>\n<p>这一部分整体在解释一个看似反常的比较：近期科技及其社会影响可能很难预测，较长时段却能利用已知的历史模式作出某些可靠判断。重点是两类预测的依据和难度，而非贬低近期研究。<\/p>\n<p>开头把 very long periods 与 immediate future 直接对照；科技的复杂性解释前者为何未必更难。第二段的 A longer view offers a different basis 转入历史模式，末句用 some long-range statements 限定信心的范围。<\/p>\n<p>段内推进链：提出长期思考可能更容易 → 近期技术分支及社会后果复杂 → 科幻与未来研究探索多种可能 → 长期模式提供另一种依据 → 对部分远期情况可作有证据的预测。<\/p>\n<p>标题中的 Different timescales 对应近期和长期；different grounds for confidence对应复杂的技术可能性与可识别的历史模式。它覆盖两个段落的比较关系，也保留“有些长期判断”这一范围。<\/p>\n<p>最强干扰项是B。科技的确占了第一段，但它被用来解释近期预测的困难；making ... easy恰好反转了dazzlingly complicated的方向，而且无法涵盖第二段借助过去模式的解释。<\/p>\n<p><strong>最终答案：44选G。<\/strong><\/p>\n"},{"title":"小标题题 · 45题","level":3,"section":"第四鸟 · 新题型","raw":"### 45题解析\n\n**答案：E — Qualified optimism and action for future generations。** 中文：有保留的乐观与面向后代的行动。\n\n这一部分在收束全文：长远看不必陷入悲观，但物种繁荣不等于每个人安好；已有知识应被用来减少风险、改善后代生活并面对眼前挑战。希望与行动是连在一起的。\n\n第一段的 Yet 和 while ... do not 保留个体处境的限制；第二段的 Even with that qualification 转向能力，reduce risks、improve lives、focus attention on present challenges则把长远判断落实到当下任务。\n\n段内推进链：长期前景削弱悲观论 → 承认个体未必都受益 → 指出知识能缓解风险 → 着眼后代生活 → 用深时间视角组织当下行动并创造值得生活的未来。\n\n标题中的 qualified optimism对应希望与限制并存；action对应减少风险、改善处境及面对挑战；future generations对应those who come after them。三部分共同概括结论既保留希望，又把已有知识用于后代生活的推进。\n\n最强干扰项是F。第一段明确提醒a great many individuals may not flourish，已经否定从物种存续到人人幸福的保证。若只抓species may flourish就选F，既漏掉转折，也让第二段主动改善处境失去必要性。\n\n**最终答案：45选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"45","label":"小标题题"},"meta":{},"html":"<h3>45题解析<\/h3>\n<p><strong>答案：E — Qualified optimism and action for future generations。<\/strong> 中文：有保留的乐观与面向后代的行动。<\/p>\n<p>这一部分在收束全文：长远看不必陷入悲观，但物种繁荣不等于每个人安好；已有知识应被用来减少风险、改善后代生活并面对眼前挑战。希望与行动是连在一起的。<\/p>\n<p>第一段的 Yet 和 while ... do not 保留个体处境的限制；第二段的 Even with that qualification 转向能力，reduce risks、improve lives、focus attention on present challenges则把长远判断落实到当下任务。<\/p>\n<p>段内推进链：长期前景削弱悲观论 → 承认个体未必都受益 → 指出知识能缓解风险 → 着眼后代生活 → 用深时间视角组织当下行动并创造值得生活的未来。<\/p>\n<p>标题中的 qualified optimism对应希望与限制并存；action对应减少风险、改善处境及面对挑战；future generations对应those who come after them。三部分共同概括结论既保留希望，又把已有知识用于后代生活的推进。<\/p>\n<p>最强干扰项是F。第一段明确提醒a great many individuals may not flourish，已经否定从物种存续到人人幸福的保证。若只抓species may flourish就选F，既漏掉转折，也让第二段主动改善处境失去必要性。<\/p>\n<p><strong>最终答案：45选E。<\/strong><\/p>\n"},{"title":"排序题 · 完整题面与全局解析","level":2,"section":"第四鸟 · 新题型","raw":"## 排序题\n\nThe following paragraphs are given in a wrong order. Reorganize them into a coherent text by choosing from the list A–H to fill in each numbered box (41–45). Paragraphs A, E and H have been correctly placed.\n\n| 已给位置 | 41 | 42 | 已给位置 | 43 | 44 | 45 | 已给位置 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| A | ______ | ______ | E | ______ | ______ | ______ | H |\n\n### [A]\n\nUntil a few decades ago, many visions of the future were brightly positive, though not all were. Science and technology were expected to cure humanity’s ills and open lives of fulfilment and opportunity to everyone. This confidence made the future seem full of promise. But that once-familiar picture no longer dominates expectations in the same way.\n\n### [B]\n\nYet this gloom is misplaced. The fossil record shows many species surviving for millions of years, and there is good reason to think humanity could last for tens or hundreds of thousands. The IUCN Red List classifies Homo sapiens as Least Concern: the species is widely distributed, adaptable and growing, without major threats causing an overall population decline. Such evidence invites a question beyond immediate survival: what might our distant future hold?\n\n### [C]\n\nThinking on such lengthy timescales may, surprisingly, be easier than thinking about the immediate future. The evolution of today’s technology and its social effects is dazzlingly complicated. Science-fiction writers and futurologists can explore the many possibilities that can be imagined. That is one reason for Arc, a publication devoted to the near future. Complexity at this shorter horizon does not mean that every kind of forecast is equally uncertain.\n\n### [D]\n\nInstead, awareness of dangers has made utopian hopes unfashionable. From asteroid impacts and pandemic flu to climate change, the threats facing humanity are more fully appreciated. Faced with that list, one might be tempted to think there is little future to look forward to. Such a conclusion turns awareness of real dangers into a deeply pessimistic picture of the species’ prospects.\n\n### [E]\n\nA growing number of researchers and organisations are taking that question seriously. The Long Now Foundation in San Francisco has created a forum where thinkers and scientists consider the implications of their ideas across very long periods. Its leading project is a mechanical clock placed deep inside a mountain in Texas and designed to mark time thousands of years hence. This is one way of drawing thought beyond the immediate future.\n\n### [F]\n\nA longer view, however, allows considerable assurance about some aspects of what is to come. Long-term patterns in the history of the planet and of humanity have been identified well enough to support evidence-based forecasts about the situations our descendants may face. In this sense, the past holds a key to the future. Confidence here comes from recurring patterns over time, rather than an ability to resolve every near-term technological possibility.\n\n### [G]\n\nAnother way is being considered by scientists who propose recognising a new geological era, the Anthropocene. Like the foundation’s thinkers, they pull the camera back, asking what humanity’s impact on the planet will be in the context of stratigraphic time. Both approaches shift attention away from immediate events and towards very lengthy intervals. This scale of inquiry raises a contrast with attempts to understand the much nearer future.\n\n### [H]\n\nThis long perspective makes the pessimistic view look more likely to be a passing fashion. The future is not all rosy: a flourishing species does not mean that every individual will flourish. But present knowledge can reduce many risks that threatened earlier humans and improve the lot of later generations. Thinking about humanity’s place in deep time can sharpen attention to today’s challenges and help people make a future worth living in.\n\n## 排序题全局解析\n\n先看每一段在全文中的功能，再检查段首、段尾是否能双向接住。相同话题只提供候选范围，明确的指代、转折和段落任务才能确定位置。\n\n| 段落 | 这一段在做什么 | 关键接点 |\n| --- | --- | --- |\n| A | 交代过去的乐观未来观及其退潮 | 末尾once-familiar picture no longer dominates引出替代情绪 |\n| B | 用化石和名录反驳悲观，提出深远未来问题 | Yet this gloom接D；末尾what might our distant future hold引出E |\n| C | 说明近期技术预测复杂，并介绍Arc | such lengthy timescales接G；末尾every kind of forecast留给F比较 |\n| D | 列举威胁，说明乐观如何转为悲观 | Instead接A；末尾pessimistic picture供B反驳 |\n| E | 介绍长远基金会及千年钟的长时段探索 | that question回指B；末尾one way引出G的另一种方式 |\n| F | 用长期历史模式说明远期判断的证据基础 | A longer view, however对照C；支持H的This long perspective |\n| G | 以人类世补充地质尺度探索并转向时间尺度比较 | Another way接E；末尾nearer future引出C |\n| H | 以有保留的乐观和面向后代的行动收束 | This long perspective接F；同时关注个体限制和改善能力 |\n\n全文推进链：过去乐观愿景 → 当前威胁意识与悲观 → 生存证据反驳并提出深远未来问题 → 长远基金会探索 → 人类世地质视角 → 近期技术预测的复杂性 → 长期历史模式支持预测 → 有保留的乐观与当下行动。\n\n**完整顺序：A → D → B → E → G → C → F → H。**\n\n**41—45答案：D、B、G、C、F。**\n\nA、E、H分别固定开篇的乐观愿景、长远基金会的探索、结尾的有保留的乐观与行动。把每个候选段放进去时，都要同时检查它接住了前段什么、又向后段交出了什么，不能只完成单侧配对。","context":{"mode":"newtype","kind":"sorting","current":"","label":"排序题"},"meta":{},"html":"<h2>排序题全局解析<\/h2>\n<p>先看每一段在全文中的功能，再检查段首、段尾是否能双向接住。相同话题只提供候选范围，明确的指代、转折和段落任务才能确定位置。<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在做什么<\/th>\n<th>关键接点<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>交代过去的乐观未来观及其退潮<\/td>\n<td>末尾once-familiar picture no longer dominates引出替代情绪<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>用化石和名录反驳悲观，提出深远未来问题<\/td>\n<td>Yet this gloom接D；末尾what might our distant future hold引出E<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>说明近期技术预测复杂，并介绍Arc<\/td>\n<td>such lengthy timescales接G；末尾every kind of forecast留给F比较<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>列举威胁，说明乐观如何转为悲观<\/td>\n<td>Instead接A；末尾pessimistic picture供B反驳<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>介绍长远基金会及千年钟的长时段探索<\/td>\n<td>that question回指B；末尾one way引出G的另一种方式<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>用长期历史模式说明远期判断的证据基础<\/td>\n<td>A longer view, however对照C；支持H的This long perspective<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>以人类世补充地质尺度探索并转向时间尺度比较<\/td>\n<td>Another way接E；末尾nearer future引出C<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>以有保留的乐观和面向后代的行动收束<\/td>\n<td>This long perspective接F；同时关注个体限制和改善能力<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>全文推进链：过去乐观愿景 → 当前威胁意识与悲观 → 生存证据反驳并提出深远未来问题 → 长远基金会探索 → 人类世地质视角 → 近期技术预测的复杂性 → 长期历史模式支持预测 → 有保留的乐观与当下行动。<\/p>\n<p><strong>完整顺序：A → D → B → E → G → C → F → H。<\/strong><\/p>\n<p><strong>41—45答案：D、B、G、C、F。<\/strong><\/p>\n<p>A、E、H分别固定开篇的乐观愿景、长远基金会的探索、结尾的有保留的乐观与行动。把每个候选段放进去时，都要同时检查它接住了前段什么、又向后段交出了什么，不能只完成单侧配对。<\/p>\n"},{"title":"排序题 · 41题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序41题解析\n\n当前空位位于已给A之后、42题之前，随后已给E将介绍思考深远未来的组织。41题先交代A所说乐观图景退潮后出现了什么，建立42题需要回应的悲观判断。\n\nA末尾说过去图景 no longer dominates expectations；D用 Instead 和 utopian hopes unfashionable 接续，写威胁意识如何转成a deeply pessimistic picture。接下来的B以 Yet this gloom is misplaced 明确反驳这幅悲观图景。\n\n前端Instead说明替代旧态度的新态度，后端this gloom指代D结尾的悲观。D把“认识到风险”推进到“推断物种前景黯淡”，B才能用证据检验这一推断。\n\n局部推进链：A过去科技乐观退潮 → D威胁进入视野 → D产生深度悲观判断 → B指出这种悲观不当并给证据。\n\n最强候选是B，它有转折，也谈前景；但A仍主要描述乐观，并未建立this gloom的准确对象。若A后直接放B，就是在悲观被交代前先反驳它，随后D也会打断B提问到E作答的连接。\n\n**最终答案：41填D。**","context":{"mode":"newtype","kind":"sorting","current":"D","label":"排序题"},"meta":{},"html":"<h3>排序41题解析<\/h3>\n<p>当前空位位于已给A之后、42题之前，随后已给E将介绍思考深远未来的组织。41题先交代A所说乐观图景退潮后出现了什么，建立42题需要回应的悲观判断。<\/p>\n<p>A末尾说过去图景 no longer dominates expectations；D用 Instead 和 utopian hopes unfashionable 接续，写威胁意识如何转成a deeply pessimistic picture。接下来的B以 Yet this gloom is misplaced 明确反驳这幅悲观图景。<\/p>\n<p>前端Instead说明替代旧态度的新态度，后端this gloom指代D结尾的悲观。D把“认识到风险”推进到“推断物种前景黯淡”，B才能用证据检验这一推断。<\/p>\n<p>局部推进链：A过去科技乐观退潮 → D威胁进入视野 → D产生深度悲观判断 → B指出这种悲观不当并给证据。<\/p>\n<p>最强候选是B，它有转折，也谈前景；但A仍主要描述乐观，并未建立this gloom的准确对象。若A后直接放B，就是在悲观被交代前先反驳它，随后D也会打断B提问到E作答的连接。<\/p>\n<p><strong>最终答案：41填D。<\/strong><\/p>\n"},{"title":"排序题 · 42题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序42题解析\n\n当前空位位于已确定的D之后、已给E之前。D刚得出悲观图景，E开头说研究者正在认真对待that question，因此42题要反驳前面的判断并提出E所回应的具体问题。\n\nD尾部的 deeply pessimistic picture 对应B首句 Yet this gloom is misplaced；B接着用fossil record与Red List论证。B末尾问 what might our distant future hold，E开头 A growing number ... are taking that question seriously 逐字承接问题。\n\n前端是Yet标记的反驳和this回指，后端是问题与that question的承接。中间的生存证据先说明为什么值得讨论深远未来，提问才有论证基础，并非话题突然跳远。\n\n局部推进链：D悲观预期 → B历史与物种状态提供反证 → B人类可能延续很久 → B追问远期内容 → E介绍已有探索。\n\n最强候选是F，它也能支持乐观，但并没有问E所说的that question，而且A longer view, however针对的是C中近期预测的困难。用F会漏掉由生存前景转向研究实例的关键过渡。\n\n**最终答案：42填B。**","context":{"mode":"newtype","kind":"sorting","current":"B","label":"排序题"},"meta":{},"html":"<h3>排序42题解析<\/h3>\n<p>当前空位位于已确定的D之后、已给E之前。D刚得出悲观图景，E开头说研究者正在认真对待that question，因此42题要反驳前面的判断并提出E所回应的具体问题。<\/p>\n<p>D尾部的 deeply pessimistic picture 对应B首句 Yet this gloom is misplaced；B接着用fossil record与Red List论证。B末尾问 what might our distant future hold，E开头 A growing number ... are taking that question seriously 逐字承接问题。<\/p>\n<p>前端是Yet标记的反驳和this回指，后端是问题与that question的承接。中间的生存证据先说明为什么值得讨论深远未来，提问才有论证基础，并非话题突然跳远。<\/p>\n<p>局部推进链：D悲观预期 → B历史与物种状态提供反证 → B人类可能延续很久 → B追问远期内容 → E介绍已有探索。<\/p>\n<p>最强候选是F，它也能支持乐观，但并没有问E所说的that question，而且A longer view, however针对的是C中近期预测的困难。用F会漏掉由生存前景转向研究实例的关键过渡。<\/p>\n<p><strong>最终答案：42填B。<\/strong><\/p>\n"},{"title":"排序题 · 43题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序43题解析\n\n当前空位位于已给E之后、44题之前。E以长远基金会说明one way of drawing thought beyond the immediate future；44题C将比较长短时间尺度。43题应补充另一种长期视角，并为比较建立明确尺度。\n\nE末尾的 one way 与G开头 Another way 配对，G中的 Like the foundation’s thinkers 进一步回指刚介绍的组织。G末尾引出 contrast ... much nearer future，C开头便说 lengthy timescales may ... be easier than ... immediate future。\n\n前端靠one/another的并列与foundation的明确回指连接；后端则从两个长时段实例转到长短预测难度比较。人类世不是随机插入的新名词，而是第二种把观察尺度拉远的研究。\n\n局部推进链：E基金会与千年钟 → G另举人类世地质视角 → G归纳很长的观察时段 → G转向较近未来 → C解释近未来复杂性。\n\n最强候选是C，它的such lengthy timescales也能接E。但若跳过G，G余下只能被塞到技术复杂性或历史模式之后，Another way及foundation便失去紧邻的并列对象，还会打断C→F的短长对照。\n\n**最终答案：43填G。**","context":{"mode":"newtype","kind":"sorting","current":"G","label":"排序题"},"meta":{},"html":"<h3>排序43题解析<\/h3>\n<p>当前空位位于已给E之后、44题之前。E以长远基金会说明one way of drawing thought beyond the immediate future；44题C将比较长短时间尺度。43题应补充另一种长期视角，并为比较建立明确尺度。<\/p>\n<p>E末尾的 one way 与G开头 Another way 配对，G中的 Like the foundation’s thinkers 进一步回指刚介绍的组织。G末尾引出 contrast ... much nearer future，C开头便说 lengthy timescales may ... be easier than ... immediate future。<\/p>\n<p>前端靠one/another的并列与foundation的明确回指连接；后端则从两个长时段实例转到长短预测难度比较。人类世不是随机插入的新名词，而是第二种把观察尺度拉远的研究。<\/p>\n<p>局部推进链：E基金会与千年钟 → G另举人类世地质视角 → G归纳很长的观察时段 → G转向较近未来 → C解释近未来复杂性。<\/p>\n<p>最强候选是C，它的such lengthy timescales也能接E。但若跳过G，G余下只能被塞到技术复杂性或历史模式之后，Another way及foundation便失去紧邻的并列对象，还会打断C→F的短长对照。<\/p>\n<p><strong>最终答案：43填G。<\/strong><\/p>\n"},{"title":"排序题 · 44题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序44题解析\n\n当前空位位于已确定的G之后、45题之前。G刚把长期研究同较近未来作对照，45题F将用however转向长期预测的依据。44题需要具体解释近期为什么难预测。\n\nG末尾提出 contrast with ... much nearer future；C开头直接比较 lengthy timescales 与 immediate future，随后解释技术与社会后果的复杂性。C末尾的 not ... every kind of forecast is equally uncertain 留出转折，F便以 A longer view, however 开始。\n\n前端是由预告的比较进入比较内容，后端通过however把近期困难转到长期可用的历史模式。Arc是短期可能性探索的例子，并没有证明长期同样无法预测。\n\n局部推进链：G提出长短尺度对照 → C解释近期技术复杂 → C探索多种可能 → C保留其他预测类型的空间 → F给出长期模式依据。\n\n最强候选是F，它也承接长视角，但however所反转的近期困难还未出现；若把F放在C前，就先解释“长期为什么可以”，再补“近期为什么困难”，破坏C末尾留给F的定向转折。\n\n**最终答案：44填C。**","context":{"mode":"newtype","kind":"sorting","current":"C","label":"排序题"},"meta":{},"html":"<h3>排序44题解析<\/h3>\n<p>当前空位位于已确定的G之后、45题之前。G刚把长期研究同较近未来作对照，45题F将用however转向长期预测的依据。44题需要具体解释近期为什么难预测。<\/p>\n<p>G末尾提出 contrast with ... much nearer future；C开头直接比较 lengthy timescales 与 immediate future，随后解释技术与社会后果的复杂性。C末尾的 not ... every kind of forecast is equally uncertain 留出转折，F便以 A longer view, however 开始。<\/p>\n<p>前端是由预告的比较进入比较内容，后端通过however把近期困难转到长期可用的历史模式。Arc是短期可能性探索的例子，并没有证明长期同样无法预测。<\/p>\n<p>局部推进链：G提出长短尺度对照 → C解释近期技术复杂 → C探索多种可能 → C保留其他预测类型的空间 → F给出长期模式依据。<\/p>\n<p>最强候选是F，它也承接长视角，但however所反转的近期困难还未出现；若把F放在C前，就先解释“长期为什么可以”，再补“近期为什么困难”，破坏C末尾留给F的定向转折。<\/p>\n<p><strong>最终答案：44填C。<\/strong><\/p>\n"},{"title":"排序题 · 45题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序45题解析\n\n当前空位位于已确定的C之后、已给H之前。C已说明近期技术预测复杂，H将依据This long perspective给出乐观结论。45题应说明长远判断何以拥有证据和信心。\n\nC末尾说并非 every kind of forecast is equally uncertain；F用 A longer view, however 接住，给出long-term patterns和evidence-based forecasts。H首句 This long perspective再回指这一已说明依据的长期视角，并推进到对悲观论的评价。\n\n前端是对照转折，后端是this回指及论据到结论的提升。F把“拉远看”落实为识别历史模式，H的乐观才不仅是换个时间尺度的直觉，而有可解释的预测基础。\n\n局部推进链：C近期预测复杂 → F长期历史模式提供另一种依据 → F可对部分后代处境作有证据的判断 → H得出有保留的乐观并转向行动。\n\n最强候选是B，它也有支持乐观的证据，但Yet this gloom需要前文悲观判断，C讲的是复杂性而非物种灭绝前景；B末尾又提出what might ... hold，会重新打开E已经回答过的问题，无法自然收束到H。\n\n**最终答案：45填F。**","context":{"mode":"newtype","kind":"sorting","current":"F","label":"排序题"},"meta":{},"html":"<h3>排序45题解析<\/h3>\n<p>当前空位位于已确定的C之后、已给H之前。C已说明近期技术预测复杂，H将依据This long perspective给出乐观结论。45题应说明长远判断何以拥有证据和信心。<\/p>\n<p>C末尾说并非 every kind of forecast is equally uncertain；F用 A longer view, however 接住，给出long-term patterns和evidence-based forecasts。H首句 This long perspective再回指这一已说明依据的长期视角，并推进到对悲观论的评价。<\/p>\n<p>前端是对照转折，后端是this回指及论据到结论的提升。F把“拉远看”落实为识别历史模式，H的乐观才不仅是换个时间尺度的直觉，而有可解释的预测基础。<\/p>\n<p>局部推进链：C近期预测复杂 → F长期历史模式提供另一种依据 → F可对部分后代处境作有证据的判断 → H得出有保留的乐观并转向行动。<\/p>\n<p>最强候选是B，它也有支持乐观的证据，但Yet this gloom需要前文悲观判断，C讲的是复杂性而非物种灭绝前景；B末尾又提出what might ... hold，会重新打开E已经回答过的问题，无法自然收束到H。<\/p>\n<p><strong>最终答案：45填F。<\/strong><\/p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **optimism** | **乐观** | **人生哲理类** | **个人主题** |\n| **developing long-term plans** | **制定长远计划** | **人生哲理类** | **个人主题** | >社会现象类—社会生活<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td>environmental protection<\/td>\n<td>环境保护<\/td>\n<td>环境保护类<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td>quality of life<\/td>\n<td>生活质量<\/td>\n<td>社会生活类<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<\/tbody><\/table>\n"},{"title":"2. 大作文第一段描述题目信息时可积累的表达","raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画题** | **In the picture, A is taking a longer view of B.** | **图画中，A正在从更长远的角度看待B。** |\n| 图画题 | The picture shows A and B expressing different visions of C’s future. | 图画展现了A和B对C的未来表达不同愿景。 |\n| 图画题 | In the picture, A is examining the evidence before making a forecast about B. | 图画中，A正在考察证据，以便对B作出预测。 |\n| 图画题 | The picture depicts A planning for B while preparing for C. | 图画描绘了A在规划B的同时为C作准备的情景。 |\n| **图表题** | **The chart shows the long-term pattern of changes in A from B to C.** | **图表显示了从B到C期间A变化的长期规律。** |\n| 图表题 | The chart compares the proportions of A who hold positive and negative views of B’s future. | 图表比较了A中对B的未来持积极看法和消极看法的人所占的比例。 |\n| 图表题 | The chart presents changes in the number of A exposed to B over the period from C to D. | 图表呈现了从C到D期间面临B的A的数量变化。 |\n| 图表题 | The chart compares A’s population in different periods. | 图表比较了A在不同时期的种群数量。 |\n| **文本评论题** | **The passage examines A’s future prospects in light of B.** | **短文结合B考察了A的未来前景。** |\n| 文本评论题 | The passage contrasts an earlier vision of A with a more recent one. | 短文对比了人们早先对A的愿景与较近时期的愿景。 |\n| 文本评论题 | The passage describes how evidence from A is used to make forecasts about B. | 短文描述了来自A的证据如何被用于对B作出预测。 |\n| 文本评论题 | The passage discusses the possible development of A and its consequences for B. | 短文讨论了A可能的发展及其对B的影响。 |","level":2,"section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<table>\n<thead>\n<tr>\n<th>适用题型<\/th>\n<th>考试时可复用的形式<\/th>\n<th>中文翻译<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong> const NEWTYPE={"smallTitle":"<h2>小标题题<\/h2><p>Choose the most suitable heading from A–G for each section (41–45). There are two extra headings.<\/p><p><b>[A]<\/b> Research that stretches the horizon of human thinking<\/p><p><b>[B]<\/b> Technology making the near future easy to predict<\/p><p><b>[C]<\/b> From confident visions to fears about tomorrow<\/p><p><b>[D]<\/b> Evidence for humanity’s chances of long survival<\/p><p><b>[E]<\/b> Qualified optimism and action for future generations<\/p><p><b>[F]<\/b> Species survival as a guarantee of everyone’s happiness<\/p><p><b>[G]<\/b> Different timescales and different grounds for confidence<\/p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41. ______<\/h3><p>What has happened to our picture of the future? Until a few decades ago, many visions of what lay ahead were strongly positive, although they were never uniformly so. Science and technology were expected to cure humanity’s problems and make lives of fulfilment and opportunity available to all.<\/p><p>That confidence has become less fashionable as the range of threats has become more apparent. Asteroid impacts, pandemic disease and climate change can make the future look much less welcoming. Awareness of these dangers might even tempt people to assume that humanity has little to look forward to. The change described here is from a largely hopeful picture to a mood in which threats dominate expectations; it is not yet a demonstration that those expectations are correct.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42. ______<\/h3><p>Such gloom is misplaced. The fossil record shows that many species have persisted for millions of years, raising the question of why our own should be assumed incapable of lasting. From a wider perspective, humanity has an excellent chance of surviving for tens or even hundreds of thousands of years.<\/p><p>The International Union for Conservation of Nature’s Red List offers another relevant piece of evidence. Homo sapiens is classified as Least Concern because the species is widely distributed, adaptable and increasing in number, without major threats producing an overall population decline. This assessment concerns the species as a whole. Alongside the fossil record, it supports a better view of the prospects for human persistence than the prevailing gloom suggests, without claiming that every individual will avoid difficulty.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43. ______<\/h3><p>Researchers and organisations are already exploring what such a distant future could hold. The Long Now Foundation in San Francisco provides a forum where thinkers and scientists consider the implications of their ideas over very long periods. Its flagship project is a mechanical clock buried inside a mountain in Texas, designed to continue marking time thousands of years from now.<\/p><p>Other scientists are considering whether to recognise a new geological era, the Anthropocene. They are likewise stepping back from immediate events to ask what humanity’s impact on the planet will be in the context of stratigraphic time. The clock and the proposed geological perspective differ in form, but both encourage people to think across intervals much longer than those of everyday forecasting. They show that the distant future is becoming a subject of deliberate inquiry.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44. ______<\/h3><p>Surprisingly, it may be easier to think about very long periods than about the immediate future. The possible evolution of present-day technology and its social consequences is enormously complicated. Science-fiction writers and futurologists can explore the many possibilities; this complexity is one reason for launching Arc, a publication devoted to the near future.<\/p><p>A longer view offers a different basis for prediction. Enough long-term patterns shaping the history of the planet and of humanity have now been identified to make evidence-based forecasts about the circumstances our descendants may face. The past can therefore provide a key to the distant future. The contrast is not that every remote event can be predicted, but that enduring patterns permit considerable confidence in some long-range statements while near-term technological possibilities are difficult to disentangle.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45. ______<\/h3><p>A long perspective makes today’s pessimism about humanity’s prospects look more like a passing fashion. Yet the future is not entirely rosy: the species may flourish while a great many individuals do not. Hope for humanity’s persistence must not be mistaken for a promise of a good life for everyone.<\/p><p>Even with that qualification, people now know enough to reduce many risks that threatened earlier humans and to improve the lives of those who come after them. Thinking about our place in deep time can help focus attention on present challenges and on building a future worth living in.<\/p><\/section>","sorting":"<h2>排序题<\/h2><p>Reorganize paragraphs A–H. Paragraphs A, E and H have been correctly placed.<\/p><p>A → 41. ______ → 42. ______ → E → 43. ______ → 44. ______ → 45. ______ → H<\/p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>[A]<\/h3><p>Until a few decades ago, many visions of the future were brightly positive, though not all were. Science and technology were expected to cure humanity’s ills and open lives of fulfilment and opportunity to everyone. This confidence made the future seem full of promise. But that once-familiar picture no longer dominates expectations in the same way.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>[B]<\/h3><p>Yet this gloom is misplaced. The fossil record shows many species surviving for millions of years, and there is good reason to think humanity could last for tens or hundreds of thousands. The IUCN Red List classifies Homo sapiens as Least Concern: the species is widely distributed, adaptable and growing, without major threats causing an overall population decline. Such evidence invites a question beyond immediate survival: what might our distant future hold?<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>[C]<\/h3><p>Thinking on such lengthy timescales may, surprisingly, be easier than thinking about the immediate future. The evolution of today’s technology and its social effects is dazzlingly complicated. Science-fiction writers and futurologists can explore the many possibilities that can be imagined. That is one reason for Arc, a publication devoted to the near future. Complexity at this shorter horizon does not mean that every kind of forecast is equally uncertain.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>[D]<\/h3><p>Instead, awareness of dangers has made utopian hopes unfashionable. From asteroid impacts and pandemic flu to climate change, the threats facing humanity are more fully appreciated. Faced with that list, one might be tempted to think there is little future to look forward to. Such a conclusion turns awareness of real dangers into a deeply pessimistic picture of the species’ prospects.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>[E]<\/h3><p>A growing number of researchers and organisations are taking that question seriously. The Long Now Foundation in San Francisco has created a forum where thinkers and scientists consider the implications of their ideas across very long periods. Its leading project is a mechanical clock placed deep inside a mountain in Texas and designed to mark time thousands of years hence. This is one way of drawing thought beyond the immediate future.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>[F]<\/h3><p>A longer view, however, allows considerable assurance about some aspects of what is to come. Long-term patterns in the history of the planet and of humanity have been identified well enough to support evidence-based forecasts about the situations our descendants may face. In this sense, the past holds a key to the future. Confidence here comes from recurring patterns over time, rather than an ability to resolve every near-term technological possibility.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>[G]<\/h3><p>Another way is being considered by scientists who propose recognising a new geological era, the Anthropocene. Like the foundation’s thinkers, they pull the camera back, asking what humanity’s impact on the planet will be in the context of stratigraphic time. Both approaches shift attention away from immediate events and towards very lengthy intervals. This scale of inquiry raises a contrast with attempts to understand the much nearer future.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>[H]<\/h3><p>This long perspective makes the pessimistic view look more likely to be a passing fashion. The future is not all rosy: a flourishing species does not mean that every individual will flourish. But present knowledge can reduce many risks that threatened earlier humans and improve the lot of later generations. Thinking about humanity’s place in deep time can sharpen attention to today’s challenges and help people make a future worth living in.<\/p><\/section>"};
const FULL="<h1>0.阅前须知<\/h1>\n<h2>史上最强阅读复盘法：一石五鸟法<\/h2>\n<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h1>\n<h1>第1段<\/h1>\n<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>a few<\/td>\n<td>数量短语：几个；少数几个<\/td>\n<td>decades ago<\/td>\n<td>名词短语：几十年前<\/td>\n<td>visions<\/td>\n<td>n. 愿景；想象<\/td>\n<\/tr>\n<tr>\n<td>future<\/td>\n<td>n. 未来<\/td>\n<td>largely<\/td>\n<td>adv. 大体上；在很大程度上<\/td>\n<td>though<\/td>\n<td>conj. 尽管；虽然<\/td>\n<\/tr>\n<tr>\n<td>by no means<\/td>\n<td>介词短语：绝不；一点也不<\/td>\n<td>uniformly<\/td>\n<td>adv. 一致地；毫无例外地<\/td>\n<td>glowingly positive<\/td>\n<td>形容词短语：非常乐观的；充满希望的<\/td>\n<\/tr>\n<tr>\n<td>technology<\/td>\n<td>n. 技术；科技<\/td>\n<td>cure<\/td>\n<td>v. 解决；消除；此处以治病比喻解决问题<\/td>\n<td>ills<\/td>\n<td>n. 弊病；苦难<\/td>\n<\/tr>\n<tr>\n<td>humanity<\/td>\n<td>n. 人类<\/td>\n<td>leading to<\/td>\n<td>动词短语：带来；导致<\/td>\n<td>lives<\/td>\n<td>n. 生活<\/td>\n<\/tr>\n<tr>\n<td>fulfilment<\/td>\n<td>n. 成就感；充实感<\/td>\n<td>opport \n<p>直到几十年前，我们对未来的愿景在很大程度上——尽管并非完全一致——都是光明积极的。人们相信科学和技术将治愈人类的所有疾病，为所有人带来充满成就感和机会的生活。<\/p>\n<h2>第2段<\/h2>\n<h3>完整原文 · 第2段<\/h3>\n<p>Now utopia has grown unfashionable, as we have gained a deeper appreciation  of the range of threats facing us, from asteroid strike to epidemic flu and to climate change. You might even be tempted to assume that humanity has little future to look forward to.<\/p>\n<h3>意群划分 · 第2段<\/h3>\n<p>Now utopia / has grown unfashionable, / as we have gained / a deeper appreciation / of the range of threats / facing us, / from asteroid strike / to epidemic flu / and to climate change.<\/p>\n<p>You might even be tempted / to assume / that humanity / has little future / to look forward to.<\/p>\n<h3>意群翻译 · 第2段<\/h3>\n<p>现在乌托邦 / 已经变得不流行了，/ 因为我们已经获得 / 更深刻的认识 / 对威胁范围的 / 面对我们的，/ 从小行星撞击 / 到流行性流感 / 再到气候变化。<\/p>\n<p>你甚至可能被诱惑 / 去假设 / 人类 / 几乎没有未来 / 可以期待。<\/p>\n<h3>标准译文 · 第2段<\/h3>\n<p>如今，乌托邦已经不再流行，因为我们对面临的各种威胁有了更深刻的认识，从小行星撞击到流行性流感，再到气候变化。你甚至可能会认为人类几乎没有什么未来可以期待。<\/p>\n<h2>第3段<\/h2>\n<h3>完整原文 · 第3段<\/h3>\n<p>But such gloominess is misplaced. The fossil record shows that many species have endured for millions of years – so why shouldn’t we? Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years. Look up <em>Homo sapiens<\/em> in the “Red List” of threatened species of the International Union for the  Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.”<\/p>\n<h3>意群划分 · 第3段<\/h3>\n<p>But such gloominess / is misplaced.<\/p>\n<p>The fossil record shows / that many species / have endured / for millions of years – / so why shouldn&#39;t we?<\/p>\n<p>Take a broader look / at our species&#39; place / in the universe, / and it becomes clear / that we have / an excellent chance / of surviving / for tens, / if not hundreds, / of thousands of years.<\/p>\n<p>Look up Homo sapiens / in the &quot;Red List&quot; / of threatened species / of the International Union / for the Conservation of Nature (IUCN) / and you will read: / &quot;Listed as Least Concern / as the species / is very widely distributed, / adaptable, / currently increasing, / and there are no major threats / resulting in / an overall population decline.&quot;<\/p>\n<h3>意群翻译 · 第3段<\/h3>\n<p>但这种悲观情绪 / 是错误的。<\/p>\n<p>化石记录显示 / 许多物种 / 已经存续 / 数百万年 – / 那么我们为什么不能呢？<\/p>\n<p>放眼更广阔地看 / 我们物种的位置 / 在宇宙中，/ 它变得清晰 / 我们有 / 极好的机会 / 生存 / 数万年，/ 如果不是数十万年的话。<\/p>\n<p>查找智人 / 在&quot;红色名录&quot;中 / 受威胁物种的 / 国际自然保护联盟的 / (IUCN) / 你会读到：/ &quot;列为最少关注 / 因为该物种 / 分布非常广泛，/ 适应性强，/ 目前正在增长，/ 并且没有重大威胁 / 导致 / 整体种群下降。&quot;<\/p>\n<h3>标准译文 · 第3段<\/h3>\n<p>但这种悲观情绪是错位的。化石记录显示许多物种已经存续了数百万年——那我们为什么不能呢？从更广阔的视角审视我们物种在宇宙中的位置，就会清楚地看到，我们有极好的机会存活数万年，甚至数十万年。在国际自然保护联盟（IUCN）的受威胁物种&quot;红色名录&quot;中查找智人，你会读到：&quot;列为最少关注，因为该物种分布非常广泛、适应性强、目前正在增长，并且没有导致整体种群下降的重大威胁。&quot;<\/p>\n<h2>第4段<\/h2>\n<h3>完整原文 · 第4段<\/h3>\n<p>So what does our deep future hold? A growing number of researchers and organisations are now thinking seriously about that question. For example, the Long Now Foundation has as its flagship project a mechanical clock that is designed to still be marking time thousands of years hence.<\/p>\n<h3>意群划分 · 第4段<\/h3>\n<p>So what does / our deep future hold?<\/p>\n<p>A growing number / of researchers and organisations / are now thinking seriously / about that question.<\/p>\n<p>For example, / the Long Now Foundation / has as its flagship project / a mechanical clock / that is designed / to still be marking time / thousands of years hence.<\/p>\n<h3>意群翻译 · 第4段<\/h3>\n<p>那么什么 / 我们的深远未来包含？<\/p>\n<p>越来越多 / 研究人员和组织的 / 现在正在认真思考 / 关于那个问题。<\/p>\n<p>例如，/ 长远基金会 / 作为其旗舰项目有 / 一个机械钟 / 被设计 / 仍在计时 / 数千年后。<\/p>\n<h3>标准译文 · 第4段<\/h3>\n<p>那么，我们的深远未来会是什么样子？越来越多的研究人员和组织现在正在认真思考这个问题。例如，长远基金会的旗舰项目是一个机械钟，设计目标是在数千年后仍能计时。<\/p>\n<h2>第5段<\/h2>\n<h3>完整原文 · 第5段<\/h3>\n<p>Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future. The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage. That’s one reason why we have launched <em>Arc<\/em>, a new publication dedicated to the near future.<\/p>\n<h3>意群划分 · 第5段<\/h3>\n<p>Perhaps willfully, / it may be easier / to think about / such lengthy timescales / than about / the more immediate future.<\/p>\n<p>The potential evolution / of today&#39;s technology, / and its social consequences, / is dazzlingly complicated, / and it&#39;s perhaps best / left to science fiction writers / and futurologists / to explore / the many possibilities / we can envisage.<\/p>\n<p>That&#39;s one reason / why we have launched Arc, / a new publication / dedicated to / the near future.<\/p>\n<h3>意群翻译 · 第5段<\/h3>\n<p>也许是故意地，/ 可能更容易 / 思考 / 如此漫长的时间尺度 / 比起 / 更近期的未来。<\/p>\n<p>潜在的演变 / 今天技术的，/ 及其社会后果，/ 是令人眼花缭乱地复杂，/ 也许最好 / 留给科幻作家 / 和未来学家 / 去探索 / 许多可能性 / 我们能够设想的。<\/p>\n<p>那是一个原因 / 为什么我们推出了Arc，/ 一个新出版物 / 致力于 / 近期未来。<\/p>\n<h3>标准译文 · 第5段<\/h3>\n<p>也许是有意为之，思考如此漫长的时间尺度可能比思考更近期的未来要容易。今天技术的潜在演变及其社会后果令人眼花缭乱地复杂，也许最好留给科幻作家和未来学家去探索我们能够设想的许多可能性。这就是我们推出Arc的原因之一，这是一份致力于探讨近期未来的新出版物。<\/p>\n<h2>第6段<\/h2>\n<h3>完整原文 · 第6段<\/h3>\n<p>But take a longer view and there is a surprising amount that we can say with considerable assurance. As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<h3>意群划分 · 第6段<\/h3>\n<p>But take a longer view / and there is / a surprising amount / that we can say / with considerable assurance.<\/p>\n<p>As so often, / the past / holds the key / to the future: / we have now identified / enough of the long-term patterns / shaping the history / of the planet, / and our species, / to make / evidence-based forecasts / about the situations / in which our descendants / will find themselves.<\/p>\n<h3>意群翻译 · 第6段<\/h3>\n<p>但采取更长远的视角 / 就有 / 令人惊讶的数量 / 我们可以说的 / 以相当的确信。<\/p>\n<p>正如经常的情况，/ 过去 / 掌握着钥匙 / 通向未来：/ 我们现在已经识别 / 足够的长期模式 / 塑造历史 / 地球的，/ 和我们物种的，/ 来做出 / 基于证据的预测 / 关于情况 / 我们的后代 / 将发现自己所处的。<\/p>\n<h3>标准译文 · 第6段<\/h3>\n<p>但如果采取更长远的视角，我们能够以相当的确信说出令人惊讶的多的内容。正如往常一样，过去掌握着通向未来的钥匙：我们现在已经识别出足够多的塑造地球和我们物种历史的长期模式，可以对我们后代将面临的情况做出基于证据的预测。<\/p>\n<h2>第7段<\/h2>\n<h3>完整原文 · 第7段<\/h3>\n<p>This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad. To be sure, the future is not all rosy. But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<h3>意群划分 · 第7段<\/h3>\n<p>This long perspective / makes the pessimistic view / of our prospects / seem more likely / to be a passing fad.<\/p>\n<p>To be sure, / the future / is not all rosy.<\/p>\n<p>But we are now / knowledgeable enough / to reduce / many of the risks / that threatened / the existence of earlier humans, / and to improve / the lot / of those to come.<\/p>\n<h3>意群翻译 · 第7段<\/h3>\n<p>这种长远视角 / 使悲观看法 / 对我们前景的 / 看起来更可能 / 是一时的风尚。<\/p>\n<p>确实，/ 未来 / 并非全是美好的。<\/p>\n<p>但我们现在 / 足够有知识 / 去减少 / 许多风险 / 那些威胁 / 早期人类存在的，/ 并且改善 / 命运 / 未来人类的。<\/p>\n<h3>标准译文 · 第7段<\/h3>\n<p>这种长远视角使得对我们前景的悲观看法更像是一时的风尚。诚然，未来并非全是美好的。但我们现在已经拥有足够的知识来减少许多曾威胁早期人类生存的风险，并改善后代的命运。<\/p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)<\/h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。<\/p>\n<p>符号的作用：<\/p>\n<ul>\n<li><code>→<\/code>：主要叙述继续向下推进；<\/li>\n<li><code>+<\/code>：并列；<\/li>\n<li><code>：<\/code>：解释、修饰或补充；<\/li>\n<li><code>//<\/code>：转折或对比；<\/li>\n<li>括号：把同一层的信息捆成一个整体。<\/li>\n<\/ul>\n<h2>句子逻辑梳理（选修，按照自身语法基础而定)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>Up until a few decades ago → our visions of the future → were largely – though by no means uniformly – glowingly positive.<\/p>\n<p>Science and technology → would cure → all the ills of humanity → leading to lives：(of fulfilment and opportunity)：(for all).<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>Now utopia → has grown unfashionable → as we have gained → a deeper appreciation：(of the range of threats：(facing us))：(from asteroid strike + to epidemic flu + to climate change).<\/p>\n<p>You might even be tempted → to assume：(that humanity → has little future：(to look forward to)).<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>But such gloominess → is misplaced.<\/p>\n<p>The fossil record shows：(that many species → have endured：(for millions of years)) – so why shouldn&#39;t we?<\/p>\n<p>Take a broader look：(at our species&#39; place：(in the universe)) → and it becomes clear：(that we have → an excellent chance：(of surviving)：(for tens, if not hundreds, of thousands of years)).<\/p>\n<p>Look up Homo sapiens：(in the &quot;Red List&quot;：(of threatened species)：(of the International Union for the Conservation of Nature (IUCN))) → and you will read：&quot;Listed as Least Concern：(as the species → is very widely distributed + adaptable + currently increasing) + (there are no major threats：(resulting in → an overall population decline)).&quot;<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>So what does → our deep future hold?<\/p>\n<p>A growing number：(of researchers and organisations) → are now thinking seriously：(about that question).<\/p>\n<p>For example → the Long Now Foundation → has as its flagship project → a mechanical clock：(that is designed → to still be marking time：(thousands of years hence)).<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>Perhaps willfully → it may be easier → to think about：(such lengthy timescales) // than about：(the more immediate future).<\/p>\n<p>The potential evolution：(of today&#39;s technology) + its social consequences → is dazzlingly complicated → and it&#39;s perhaps best → left to science fiction writers + futurologists → to explore：(the many possibilities：(we can envisage)).<\/p>\n<p>That&#39;s one reason：(why we have launched Arc：(a new publication：(dedicated to → the near future))).<\/p>\n<p><strong>第6段<\/strong><\/p>\n<p>But take a longer view → and there is → a surprising amount：(that we can say：(with considerable assurance)).<\/p>\n<p>As so often → the past → holds the key：(to the future)：we have now identified → enough of the long-term patterns：(shaping the history：(of the planet + our species)) → to make → evidence-based forecasts：(about the situations：(in which our descendants → will find themselves)).<\/p>\n<p><strong>第7段<\/strong><\/p>\n<p>This long perspective → makes the pessimistic view：(of our prospects) → seem more likely → to be a passing fad.<\/p>\n<p>To be sure → the future → is not all rosy.<\/p>\n<p>But we are now → knowledgeable enough → to reduce：(many of the risks：(that threatened → the existence of earlier humans)) + to improve：(the lot：(of those to come)).<\/p>\n<h2>中文版句子逻辑（选修)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>直到几十年前 → 我们对未来的愿景 → 在很大程度上是 – 尽管绝非一致地 – 光辉正面的。<\/p>\n<p>科学和技术 → 将会治愈 → 人类的所有疾病 → 带来生活：(充满成就感和机会的)：(对所有人)。<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>现在乌托邦 → 已经变得不流行了 → 因为我们已经获得 → 更深刻的认识：(对威胁范围的：(面对我们的))：(从小行星撞击 + 到流行性流感 + 再到气候变化)。<\/p>\n<p>你甚至可能被诱惑 → 去假设：(人类 → 几乎没有未来：(可以期待))。<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>但这种悲观情绪 → 是错误的。<\/p>\n<p>化石记录显示：(许多物种 → 已经存续：(数百万年)) – 那么我们为什么不能呢？<\/p>\n<p>放眼更广阔地看：(我们物种的位置：(在宇宙中)) → 它变得清晰：(我们有 → 极好的机会：(生存)：(数万年，如果不是数十万年的话))。<\/p>\n<p>查找智人：(在&quot;红色名录&quot;中：(受威胁物种的)：(国际自然保护联盟的)) → 你会读到：&quot;列为最少关注：(因为该物种 → 分布非常广泛 + 适应性强 + 目前正在增长) + (没有重大威胁：(导致 → 整体种群下降))。&quot;<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>那么什么 → 我们的深远未来包含？<\/p>\n<p>越来越多：(研究人员和组织的) → 现在正在认真思考：(关于那个问题)。<\/p>\n<p>例如 → 长远基金会 → 作为其旗舰项目有 → 一个机械钟：(被设计 → 仍在计时：(数千年后))。<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>也许是故意地 → 可能更容易 → 思考：(如此漫长的时间尺度) // 比起：(更近期的未来)。<\/p>\n<p>潜在的演变：(今天技术的) + 其社会后果 → 是令人眼花缭乱地复杂 → 也许最好 → 留给科幻作家 + 未来学家 → 去探索：(许多可能性：(我们能够设想的))。<\/p>\n<p>那是一个原因：(为什么我们推出了Arc：(一个新出版物：(致力于 → 近期未来)))。<\/p>\n<p><strong>第6段<\/strong><\/p>\n<p>但采取更长远的视角 → 就有 → 令人惊讶的数量：(我们可以说的：(以相当的确信))。<\/p>\n<p>正如经常的情况 → 过去 → 掌握着钥匙：(通向未来)：我们现在已经识别 → 足够的长期模式：(塑造历史：(地球的 + 我们物种的)) → 来做出 → 基于证据的预测：(关于情况：(我们的后代 → 将发现自己所处的))。<\/p>\n<p><strong>第7段<\/strong><\/p>\n<p>这种长远视角 → 使悲观看法：(对我们前景的) → 看起来更可能 → 是一时的风尚。<\/p>\n<p>确实 → 未来 → 并非全是美好的。<\/p>\n<p>但我们现在 → 足够有知识 → 去减少：(许多风险：(那些威胁 → 早期人类存在的)) + 改善：(命运：(未来人类的))。<\/p>\n<h2>长难句翻译练习（英一必修，英二选修)<\/h2>\n<p>对于长难句的翻译，流程一共五步：<\/p>\n<ol>\n<li>划分意群；<\/li>\n<li>逐个意群直译；<\/li>\n<li>按照中文语感，把应该放在一起的意群合并起来；<\/li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；<\/li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。<\/li>\n<\/ol>\n<h3>1. 第2段第1句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>Now utopia has grown unfashionable, as we have gained a deeper appreciation  of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>Now utopia / has grown unfashionable, / as we have gained / a deeper appreciation / of the range of threats / facing us, / from asteroid strike / to epidemic flu / and to climate change.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>现在乌托邦 / 已经变得不流行了，/ 因为我们已经获得 / 更深刻的认识 / 对威胁范围的 / 面对我们的，/ 从小行星撞击 / 到流行性流感 / 再到气候变化。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>“面对我们的”是在说明威胁，把它放到“威胁”前；“范围”说明威胁并不只一种：<\/p>\n<blockquote>\n<p>我们面临的各种威胁<\/p>\n<\/blockquote>\n<p>再把认识的内容与认识的程度放在一起：<\/p>\n<blockquote>\n<p>对我们面临的各种威胁获得更深刻的认识<\/p>\n<\/blockquote>\n<p>最后把三个具体例子接成连续列举，它们共同说明威胁有哪些：<\/p>\n<blockquote>\n<p>从小行星撞击到流行性流感，再到气候变化<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>现在乌托邦已经变得不流行了\n因为我们对面临的各种威胁获得了更深刻的认识\n从小行星撞击到流行性流感，再到气候变化<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>乌托邦不再流行，因为人们更了解各种威胁。<\/p>\n<\/blockquote>\n<p>先交代现在的变化，再用“因为”接原因。在原因中把“对面临的各种威胁”放在“获得认识”之前，让认识的对象先出现。最后的三个例子放在威胁和认识之后，用“从……到……再到……”保持原来的列举顺序。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>现在，乌托邦已经变得不流行了，因为我们对面临的各种威胁获得了更深刻的认识，从小行星撞击到流行性流感，再到气候变化。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“已经变得不流行了”收成“已经不再流行”，保留今昔变化而减少重复表达。<\/li>\n<li>“获得了更深刻的认识”改为“有了更深刻的认识”，中文更平顺；“现在”整理为“如今”，与前段过去的愿景自然衔接。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>如今，乌托邦已经不再流行，因为我们对面临的各种威胁有了更深刻的认识，从小行星撞击到流行性流感，再到气候变化。<\/p>\n<\/blockquote>\n<h3>2. 第3段第3句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>Take a broader look / at our species&#39; place / in the universe, / and it becomes clear / that we have / an excellent chance / of surviving / for tens, / if not hundreds, / of thousands of years.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>放眼更广阔地看 / 我们物种的位置 / 在宇宙中，/ 它变得清晰 / 我们有 / 极好的机会 / 生存 / 数万年，/ 如果不是数十万年的话。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把位置属于谁、位于哪里合在一起：<\/p>\n<blockquote>\n<p>我们物种在宇宙中的位置<\/p>\n<\/blockquote>\n<p>“放眼更广阔地看”说明采用怎样的视角，先接到这个观察对象前：<\/p>\n<blockquote>\n<p>从更广阔的视角看我们物种在宇宙中的位置<\/p>\n<\/blockquote>\n<p>再把生存机会和时间长度接在一起；后一个时间是向更长的可能性推进：<\/p>\n<blockquote>\n<p>有极好的机会生存数万年，如果不是数十万年的话<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>从更广阔的视角看我们物种在宇宙中的位置\n就会变得清晰\n我们有极好的机会生存数万年，如果不是数十万年的话<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>换一个更广阔的视角，就能看清人类的生存机会。<\/p>\n<\/blockquote>\n<p>先放观察的方法和对象，再用“就”接看清的结果，不把前后两个动作摆成毫无关系的并列。结果里以“我们”起头，用“有极好的机会”限制生存判断；数万年和数十万年都紧跟生存，不要变成物种在宇宙中存在的位置。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>从更广阔的视角看我们物种在宇宙中的位置，就会清楚地看到，我们有极好的机会生存数万年，如果不是数十万年的话。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“看……位置”整理为“审视……位置”，使观察和思考的意味更自然；“生存”在时间长度前整理为“存活”。<\/li>\n<li>“如果不是数十万年的话”改成“甚至数十万年”，直接表达向更长时间推进的可能性，仍由“有极好的机会”限定。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>从更广阔的视角审视我们物种在宇宙中的位置，就会清楚地看到，我们有极好的机会存活数万年，甚至数十万年。<\/p>\n<\/blockquote>\n<h3>3. 第4段第3句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>For example, the Long Now Foundation has as its flagship project a mechanical clock that is designed to still be marking time thousands of years hence.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>For example, / the Long Now Foundation / has as its flagship project / a mechanical clock / that is designed / to still be marking time / thousands of years hence.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>例如，/ 长远基金会 / 作为其旗舰项目有 / 一个机械钟 / 被设计 / 仍在计时 / 数千年后。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>“作为其旗舰项目有”先改成中文便于连接的所有关系，把机构和项目放在一起：<\/p>\n<blockquote>\n<p>长远基金会的旗舰项目<\/p>\n<\/blockquote>\n<p>项目的具体内容是一座钟，先接成完整的一组：<\/p>\n<blockquote>\n<p>旗舰项目是一个机械钟<\/p>\n<\/blockquote>\n<p>再把设计要实现的事情合并，先说时间，再说到那时仍要做到什么：<\/p>\n<blockquote>\n<p>被设计为在数千年后仍在计时<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>例如，长远基金会的旗舰项目是一个机械钟\n这个机械钟被设计为在数千年后仍在计时<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>基金会的旗舰项目是一座能够长久计时的钟。<\/p>\n<\/blockquote>\n<p>先用“例如”说明这是前面研究长远未来的一个实例。把基金会和旗舰项目连起来，再说明项目是机械钟。关于设计的说明接在机械钟后，用“在数千年后”限定“仍在计时”，不能让读者误以为几千年后才开始设计这座钟。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>例如，长远基金会的旗舰项目是一个机械钟，这个钟被设计为在数千年后仍在计时。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>后半句的“这个钟被设计为”改成“设计目标是”，去掉重复主语和生硬的被动表达。<\/li>\n<li>“仍在计时”整理为“仍能计时”，明确这是设计希望保有的功能，不是正在报告几千年后的实际状态。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>例如，长远基金会的旗舰项目是一个机械钟，设计目标是在数千年后仍能计时。<\/p>\n<\/blockquote>\n<h3>4. 第5段第2句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>The potential evolution / of today&#39;s technology, / and its social consequences, / is dazzlingly complicated, / and it&#39;s perhaps best / left to science fiction writers / and futurologists / to explore / the many possibilities / we can envisage.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>潜在的演变 / 今天技术的，/ 及其社会后果，/ 是令人眼花缭乱地复杂，/ 也许最好 / 留给科幻作家 / 和未来学家 / 去探索 / 许多可能性 / 我们能够设想的。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把“今天技术的”接到“潜在演变”前，再与它带来的社会后果并列：<\/p>\n<blockquote>\n<p>今天技术的潜在演变及其社会后果<\/p>\n<\/blockquote>\n<p>“我们能够设想的”在说明哪些可能性，先放到可能性前：<\/p>\n<blockquote>\n<p>我们能够设想的许多可能性<\/p>\n<\/blockquote>\n<p>科幻作家和未来学家共同承担探索，把两类人和动作合并：<\/p>\n<blockquote>\n<p>留给科幻作家和未来学家去探索这些可能性<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>今天技术的潜在演变及其社会后果，是令人眼花缭乱地复杂的\n也许最好留给科幻作家和未来学家\n去探索我们能够设想的许多可能性<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>技术演变十分复杂，探索其可能性也许最好交给相关作者和研究者。<\/p>\n<\/blockquote>\n<p>先完整说出复杂的对象，也就是技术的潜在演变及其社会后果，再接复杂程度。随后说探索工作交给谁；两类人并列放在“留给”之后，紧接“去探索”，而“我们能够设想的”要放到被探索的可能性前。“也许最好”保持建议语气，不写成别人都无法研究。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>今天技术的潜在演变及其社会后果，是令人眼花缭乱地复杂的，也许最好留给科幻作家和未来学家去探索我们能够设想的许多可能性。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“是……复杂的”收成直接用“复杂”描述对象，删去主语后的停顿，使前半句更紧凑。<\/li>\n<li>保留“潜在”“也许”和“能够设想”，说明这里讨论的是未来的多种可能，并未把任何一种写成确定结局。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>今天技术的潜在演变及其社会后果令人眼花缭乱地复杂，也许最好留给科幻作家和未来学家去探索我们能够设想的许多可能性。<\/p>\n<\/blockquote>\n<h3>5. 第6段第2句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>As so often, / the past / holds the key / to the future: / we have now identified / enough of the long-term patterns / shaping the history / of the planet, / and our species, / to make / evidence-based forecasts / about the situations / in which our descendants / will find themselves.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>正如经常的情况，/ 过去 / 掌握着钥匙 / 通向未来：/ 我们现在已经识别 / 足够的长期模式 / 塑造历史 / 地球的，/ 和我们物种的，/ 来做出 / 基于证据的预测 / 关于情况 / 我们的后代 / 将发现自己所处的。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把“通向未来”放到“钥匙”前，明确钥匙是用来理解什么的：<\/p>\n<blockquote>\n<p>通向未来的钥匙<\/p>\n<\/blockquote>\n<p>中间几块共同说明长期模式塑造什么，先从里面向外合并：<\/p>\n<blockquote>\n<p>地球和我们物种的历史\n塑造这些历史的足够多的长期模式<\/p>\n<\/blockquote>\n<p>最后把后代与他们将处于的情况连在一起，再接上预测的方式：<\/p>\n<blockquote>\n<p>对我们后代将发现自己所处的情况，做出基于证据的预测<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>正如经常的情况，过去掌握着通向未来的钥匙\n我们现在已经识别出足够多的塑造地球和我们物种历史的长期模式\n可以对我们后代将发现自己所处的情况做出基于证据的预测<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>我们识别了长期模式，因此能够预测后代的处境。<\/p>\n<\/blockquote>\n<p>先保留“过去掌握着通向未来的钥匙”这句话，再在冒号后解释钥匙具体指什么。让“我们”接“已经识别出”，把塑造历史的说明放到“长期模式”前。接下来用“可以”说识别这些模式带来的能力，把预测对象放在“对”后，把“基于证据的”紧接在“预测”前。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>正如经常的情况，过去掌握着通向未来的钥匙：我们现在已经识别出足够多的塑造地球和我们物种历史的长期模式，可以对我们后代将发现自己所处的情况做出基于证据的预测。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“正如经常的情况”整理为“正如往常一样”，使句首衔接自然。<\/li>\n<li>“将发现自己所处的情况”去掉绕行表达，改为“将面临的情况”；保留“基于证据”，说明预测并非随意设想。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>正如往常一样，过去掌握着通向未来的钥匙：我们现在已经识别出足够多的塑造地球和我们物种历史的长期模式，可以对我们后代将面临的情况做出基于证据的预测。<\/p>\n<\/blockquote>\n<h3>6. 第7段第3句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>But we are now / knowledgeable enough / to reduce / many of the risks / that threatened / the existence of earlier humans, / and to improve / the lot / of those to come.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>但我们现在 / 足够有知识 / 去减少 / 许多风险 / 那些威胁 / 早期人类存在的，/ 并且改善 / 命运 / 未来人类的。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把风险会造成什么后果接到风险前面，并保留它针对早期人类这一时间范围：<\/p>\n<blockquote>\n<p>许多曾威胁早期人类存在的风险<\/p>\n<\/blockquote>\n<p>再把“未来人类的”与“命运”接在一起：<\/p>\n<blockquote>\n<p>未来人类的命运<\/p>\n<\/blockquote>\n<p>减少风险和改善命运是并列的两件事，接到知识足够之后：<\/p>\n<blockquote>\n<p>足够有知识，去减少这些风险，并改善未来人类的命运<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>但我们现在足够有知识\n去减少许多曾威胁早期人类存在的风险\n并改善未来人类的命运<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>我们拥有足够知识，可以减少风险并改善后代命运。<\/p>\n<\/blockquote>\n<p>先用“但”承接上句对未来仍有风险的让步，再交代现在的知识基础。“足够”要接出能够做成的两件事：先减少风险，再改善命运。有关早期人类的说明放在风险前，未来人类的说明放在命运前，使过去受威胁的人和将来受益的人区分清楚。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>但我们现在已经足够有知识，去减少许多曾威胁早期人类存在的风险，并改善未来人类的命运。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“已经足够有知识，去……”改为“已经拥有足够的知识来……”，让知识和行动自然连接。<\/li>\n<li>“早期人类存在”整理为“早期人类生存”，“未来人类”收为“后代”；保留“许多”和“减少”，不改成消除全部风险。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>但我们现在已经拥有足够的知识来减少许多曾威胁早期人类生存的风险，并改善后代的命运。<\/p>\n<\/blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n<h2>35题<\/h2>\n<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>下面哪个标题最适合这篇文章？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>Uncertainty about Our Future<\/strong><\/p>\n<p>我们未来的不确定性<\/p>\n<p>B. <strong>Evolution of the Human Species<\/strong><\/p>\n<p>人类物种的进化<\/p>\n<p>C. <strong>The Ever-bright Prospects of Mankind<\/strong><\/p>\n<p>人类始终光明的前景<\/p>\n<p>D. <strong>Science, Technology and Humanity<\/strong><\/p>\n<p>科学、技术与人类<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先回顾几十年前对未来的乐观图景，人们相信科学技术会治愈人类弊病<\/td>\n<td>先说过去大家非常乐观<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再写如今乌托邦想象失宠，各类威胁让人怀疑人类是否还有未来<\/td>\n<td>再说现在大家又变得悲观<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>转而用化石记录和IUCN红色名录说明人类作为物种有很强的长期生存机会<\/td>\n<td>再转回来，说悲观可能放错地方<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>写一些组织开始认真思考数千年后的深远未来，并举长期时钟项目<\/td>\n<td>接着把眼光拉到很远以后<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认近期未来反而更难设想，因为技术演变及社会后果极其复杂<\/td>\n<td>再承认眼前反而更难说清<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>指出拉长时间后，可以从地球与人类历史的长期模式中作有证据的预测<\/td>\n<td>然后说拉长时间能多知道一些<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>收束为长期悲观可能只是一时风潮；未来并非全好，但人类已有能力减少风
