险、改善后代处境<\/td>\n<td>最后下结论：悲观不必当成定局<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<h3>A. Uncertainty about Our Future<\/h3>\n<p>我们未来的不确定性<\/p>\n<h4>如果 A 是主旨，文章7段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>我们未来的不确定性<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先回顾过去人们对未来非常乐观，常把美好愿景当成可以放心期待的生活图景，为讨论预测中尚未显露的不确定性作铺垫<\/td>\n<td>先说过去大家非常乐观<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再写如今人们看到灾害、疾病等风险，转向悲观；未来会朝什么方向发展因此成为人们难以拿准的问题<\/td>\n<td>再说现在大家又变得悲观<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>再指出悲观也不等于已经知道未来：人类仍有继续生存的有利条件，不能把一种坏结局提前当成确定结果<\/td>\n<td>再转回来，说悲观可能放错地方<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把不确定性的问题延伸到数千年以后，讨论如此遥远的时间里哪些变化仍有多种走向<\/td>\n<td>接着把眼光拉到很远以后<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认近期技术与社会变化交织，具体事件怎样发生比遥远年代的大致条件更难说清，说明不确定性的现实表现<\/td>\n<td>再承认眼前反而更难说清<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>说明长期记录能帮助掌握部分稳定规律、缩小预测范围，同时具体区分因此增加的知识与仍待确定的未来走向<\/td>\n<td>然后说拉长时间能多知道一些<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>总结未来仍存在未定因素；既然坏结局并未被确定，悲观就不必成为定局，应对不同走向保持开放<\/td>\n<td>最后下结论：悲观不必当成定局<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>A可以容纳第五段所说的近期未来难以设想，也容许第六段增加一些知识；它并不等于宣称任何预测都不可靠。但若全文中心是不确定性，第三段纠正悲观、第六段说明预测依据后，结尾还应着重区分哪些未来走向仍然未定。实际文章第三段强调人类长期存活的良好机会，第六段强调可以有把握地说出很多内容，第七段落在减少风险、改善后代处境上。这些段落共同支持对人类前景的积极判断，不确定性只是其中承认的一项限制。<\/p>\n<p>判断：<\/p>\n<p><strong>A 不保留。<\/strong><\/p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<h3>B. Evolution of the Human Species<\/h3>\n<p>人类物种的进化<\/p>\n<h4>如果 B 是主旨，文章7段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>人类物种的进化<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写过去人们对人类物种未来的演化充满乐观，相信适应能力与身体特征的延续变化将使后代处境更好<\/td>\n<td>先说过去大家非常乐观<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再写如今人们担忧环境压力对人类演化产生不利影响，因此对物种将向何处变化转为悲观<\/td>\n<td>再说现在大家又变得悲观<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>再用人类既有的适应性变化说明演化并不必然走向衰败，纠正把未来物种变化看坏的判断<\/td>\n<td>再转回来，说悲观可能放错地方<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把观察尺度延长到数千年以后，具体讨论人类特征在长期选择和环境影响下如何变化<\/td>\n<td>接着把眼光拉到很远以后<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认眼前的生活环境和技术条件变化复杂，短期内哪些影响会留下可传承的演化效果更难辨清<\/td>\n<td>再承认眼前反而更难说清<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>说明把时间拉长后，可以借助历代人类特征与环境的关系辨认演化模式，从而更清楚地讨论今后的变化<\/td>\n<td>然后说拉长时间能多知道一些<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>总结人类物种会在变化条件中继续演化，既有适应路径使悲观的演化前景不必成为定局<\/td>\n<td>最后下结论：悲观不必当成定局<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>这条假想路线把各段的乐观、悲观和长短时间尺度都落实在人类物种如何演化上，因而需要持续说明特征、适应与环境之间的变化关系。实际第三段的化石记录和红色名录证明的是人类有机会长期生存，第四段的机械钟指向认真思考遥远未来，第五段谈的是技术可能怎样演变，第六、七段转向预测和减少风险。文章没有把人类的演化过程作为各段共同解释的对象；“能够延续”也不等于“怎样进化”。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<h3>C. The Ever-bright Prospects of Mankind<\/h3>\n<p>人类始终光明的前景<\/p>\n<h4>如果 C 是主旨，文章7段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>人类始终光明的前景<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先回顾过去人们普遍相信科学技术能改善人类生活，未来前景因而被描绘得十分光明<\/td>\n<td>先说过去大家非常乐观<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再写如今对天灾、疾病和气候威胁的认识使人转向悲观，看好人类未来的判断由此受到挑战<\/td>\n<td>再说现在大家又变得悲观<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>再用其他物种的长期存续和人类良好的生存状态指出悲观可能错位，给人类光明前景补上事实依据<\/td>\n<td>再转回来，说悲观可能放错地方<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把人类前景放到数千年以后认真考虑，用面向遥远未来的研究说明长期延续值得作为现实问题规划<\/td>\n<td>接着把眼光拉到很远以后<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认近期技术演变及社会后果很复杂，近期难以设想构成乐观判断需要保留的限制<\/td>\n<td>再承认眼前反而更难说清<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>说明拉长时间后可以从地球与人类的长期历史模式获得预测依据，使看好后代前景有知识支撑<\/td>\n<td>然后说拉长时间能多知道一些<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>总结未来虽有风险，人类仍能运用知识减少危险、改善后代处境，因此长期悲观不必成为定局<\/td>\n<td>最后下结论：悲观不必当成定局<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>第一、二段先摆出过去乐观与如今悲观，第三段用生存证据把方向转回，第四段把目光投向深远未来。第五段承认近期复杂，第六段随即说明长期预测的知识基础，第七段在承认风险后强调人类能够改善后代处境。C概括的是贯穿这些转折的长期积极前景。这里的光明保留了文章明写的限制：有良好的存活机会，并能减少许多风险，不能据此说人类永远不会遇到风险。<\/p>\n<p>判断：<\/p>\n<p><strong>C 保留。<\/strong><\/p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<h3>D. Science, Technology and Humanity<\/h3>\n<p>科学、技术与人类<\/p>\n<h4>如果 D 是主旨，文章7段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>科学、技术与人类<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写过去人们对科学技术与人类生活的关系非常乐观，相信科技将帮助人类解决困难、获得更好的生活<\/td>\n<td>先说过去大家非常乐观<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再写如今人们担忧科技发展与人类社会相互影响中的风险，对这种关系的未来走向转为悲观<\/td>\n<td>再说现在大家又变得悲观<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>再说明科学认识和技术适应也能帮助人类处理困难，纠正对科技与人类关系的片面悲观<\/td>\n<td>再转回来，说悲观可能放错地方<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把科技与人类的关系延伸到数千年以后，讨论长期技术选择将怎样影响后代的生活条件<\/td>\n<td>接着把眼光拉到很远以后<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认近期技术变化与社会反应互相作用，其具体后果比长远趋势更难说清<\/td>\n<td>再承认眼前反而更难说清<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>说明长期观察能帮助识别科学发现、技术应用与人类生活之间的反复作用，从而增进对三者关系的认识<\/td>\n<td>然后说拉长时间能多知道一些<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>总结科学技术与人类的关系具有可调整的空间，运用知识改善技术应用可以使悲观前景不必成为定局<\/td>\n<td>最后下结论：悲观不必当成定局<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>D的假想文章可以有明确的积极立场，也可以讨论科技的风险；问题并不在于这个标题必须平行罗列三类内容。关键是各段应持续解释科学、技术与人类之间的关系。实际第二段列举的威胁不都被归因为科技，第三段的物种生存证据、第四段的深远时间尺度和第六段的历史模式共同回答的是“人类未来是否值得期待”。科技在其中提供部分背景和认识手段，文章最终要确立的判断是人类的长期前景，D没有把这一中心点出。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<hr>\n<h3>35题结论<\/h3>\n<p><strong>35. C. The Ever-bright Prospects of Mankind<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>The Ever-bright Prospects of Mankind / 人类始终光明的前景<\/strong><\/p>\n<hr>\n<h2>31题<\/h2>\n<blockquote>\n<p>Our vision of the future used to be inspired by ______.<\/p>\n<p>我们过去对未来的想象由什么激发？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>具体细节题，问过去的未来愿景由什么信念激发。<code>used to<\/code>限定过去，<code>inspired by<\/code>要求找愿景的依据，不是列出愿景包含的美好结果。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<p><code>our vision of the future<\/code>对应首段的<code>our visions of the future<\/code>，<code>used to<\/code>对应<code>Up until a few decades ago<\/code>。第一句交代过去总体乐观，第二句用科学技术能够解决人类弊病的信念解释这种愿景，同时把充实生活和人人有机会放在结果端。<\/p>\n<hr>\n<h3>A. our desire for lives of fulfilment<\/h3>\n<blockquote>\n<p>我们对充实生活的渴望<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示，但原文<code>lives of [xxx]<\/code>仍有遮挡。读到<code>leading to lives<\/code>后，我们已经发现理想生活处于结果端，却仍觉得追求这种生活也可能激发愿景，所以第一轮保留A，同时留下B。35题确定后回查，才根据全文不断交代判断依据的推进及首段因果位置排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了<code>lives of fulfilment<\/code>，再添上<code>our desire for<\/code>。原文给出的是信任科技所期待的生活结果，选项则把对结果的渴望写成过去愿景的激发来源；两者共享生活内容，却没有共享同一条因果关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>我们过去对未来的想象由我们对充实生活的渴望激发。<\/p>\n<\/blockquote>\n<p><code>vision of the future<\/code>和<code>used to<\/code>把题目锁定在第一段，A的<code>lives of fulfilment<\/code>对应第二句的结果部分。定位时既要看见同样的名词，也要保留它前面的<code>leading to<\/code>。<\/p>\n<p>第二句先说科学技术将治愈人类弊病，再说这会带来充实生活和人人有机会。这是在解释当时的人为什么相信未来会好：他们相信科技有这样的能力。<\/p>\n<p>对充实生活抱有愿望在现实中可以理解，但原句没有陈述这一愿望如何激发未来观。把可期待的结果换成<code>desire<\/code>，再把它接到<code>inspired by<\/code>之后，就多出了一条愿望导致乐观的关系。<\/p>\n<p>因此，A复现了愿景的内容，却把“人们相信科技会带来的结果”改成了“使人们产生愿景的起因”。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<p>Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.<\/p>\n<p>先以科技能够解决弊病的信念描写过去的乐观，随后以认识到威胁解释现在的悲观。<\/p>\n<\/blockquote>\n<p>两段对照的是人们形成未来判断时所依据的理由：过去信任科技的能力，如今更注意各种威胁。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Our desire for fulfilling lives inspired these positive visions of the future.<\/p>\n<p>我们对充实生活的渴望激发了这些积极的未来愿景。<\/p>\n<\/blockquote>\n<p>A所需的写法要把生活愿望明确接成愿景的来源。原文实际用科技能力作信念依据，随后又换成威胁认识，并没有把追求充实生活写成这组未来观变化的解释。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者看好人类的长期前景，不能单凭这一态度判断过去的乐观愿景具体由什么激发；还要分清第一段中信念的依据与期待的生活结果。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>our desire for lives of fulfilment<br>我们对充实生活的渴望<\/p>\n<\/blockquote>\n<p>想要美好生活与看好人类前景并不冲突，所以主旨本身不能排除A。本项最终仍要根据“leading to lives of fulfilment”这处局部原文判断：它处于科技解决弊病之后，是承诺实现的结果，不能据此改成愿景的激发来源。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<hr>\n<h3>B. our faith in science and technology<\/h3>\n<blockquote>\n<p>我们对科学技术的信心<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整显示；即使原文结果端<code>lives of [xxx]<\/code>尚未读全，<code>Science and technology would cure all the ills of humanity<\/code>仍能说明人们相信科技可以解决问题，因此第一轮保留B。那一轮A也保留，35题之后回查两项，才用首段因果位置和全文判断依据的变化选定B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>第一句说过去的未来图景总体十分乐观，第二句写人们相信科技将解决人类弊病。B用<code>faith in<\/code>概括这种信念，把乐观愿景及其支撑来源接在一起，没有把愿景中的结果当成原因。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>我们过去对未来的想象由我们对科学技术的信心激发。<\/p>\n<\/blockquote>\n<p>题干的<code>used to<\/code>对应<code>Up until a few decades ago<\/code>，B的<code>science and technology<\/code>对应首段第二句主语。<code>faith<\/code>虽然没有原词复现，却可以从人们相信科技将解决问题的写法读出。<\/p>\n<p>首句提供过去普遍乐观这一事实；第二句提供乐观的具体内容与依据：科学技术会治愈人类弊病，继而使生活更好。两句前后相接，才构成题干所问的解释。<\/p>\n<p>这里的信心属于当时人们的未来愿景，不能把<code>would cure all the ills<\/code>当成作者保证科技后来确实解决了一切问题。B表达的也是人们的信念，不是对科技成就的事实统计。<\/p>\n<p>B准确地把“相信科技能够带来改善”概括为“对科学技术的信心”，并保留它作为过去乐观愿景依据的关系。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<p>先说明过去的未来愿景总体乐观，接着写科技将解决人类弊病并带来更好的生活。<\/p>\n<\/blockquote>\n<p>后一句把前一句的乐观落到可理解的信念上：有能力改善生活的科技，使人们觉得未来值得期待。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>People pictured a positive future because they trusted science and technology to cure humanity’s ills.<\/p>\n<p>人们描绘积极的未来，是因为他们相信科学技术能够解决人类的弊病。<\/p>\n<\/blockquote>\n<p>B所要求的“信任科技的能力→积极愿景”在原文两句间能够接上；句尾再写充实生活和机会，正是这种信心所承诺的结果。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者看好人类的长期前景，不能单凭这一态度判断过去的乐观愿景具体由什么激发；还要分清第一段中信念的依据与期待的生活结果。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>our faith in science and technology<br>我们对科学技术的信心<\/p>\n<\/blockquote>\n<p>B与全文看好长期前景的方向相容，但它被选中仍要由首段的具体依据落实。“Science and technology would cure”交代了过去人们相信的力量，首句的积极未来观由此得到解释。全文后来改用物种生存和历史知识支撑乐观，也是在继续追问未来判断靠什么成立。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<hr>\n<h3>C. our awareness of potential risks<\/h3>\n<blockquote>\n<p>我们对潜在风险的认识<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们把风险认识与第一段过去的乐观图景比较，并注意到威胁意识出现在后面“现在”的视角中，所以第一轮排除C，之后没有重新保留。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用第二段对威胁有更深认识的内容，却把它移到题干限定的“过去”。原文用这种认识解释现在乌托邦愿景失去吸引力，选项却让它激发过去的积极未来图景。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<p>Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>我们过去对未来的想象由我们对潜在风险的认识激发。<\/p>\n<\/blockquote>\n<p><code>used to<\/code>限定过去，<code>awareness of potential risks<\/code>对应第二段的<code>a deeper appreciation of the range of threats<\/code>。这两处不能因为都谈未来就合并成同一时间背景。<\/p>\n<p>第一段先写过去相信科学技术能够解决弊病，第二段以<code>Now<\/code>切换到现在，以<code>as<\/code>引出人们更了解各种威胁。风险认识是原文确实交代的原因，但它属于现在的观念变化。<\/p>\n<p>不能泛化成“认识风险必然使人悲观”；此题只需保留本文已写明的时间和作用：这里的风险认识解释乌托邦愿景失宠，而不是首段那种科技信心。<\/p>\n<p>C把现在观念转变的依据搬成了过去愿景的依据，改动的是时间与因果归属。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.<\/p>\n<p>But such gloominess is misplaced.<\/p>\n<p>现在更认识各种威胁，于是对未来趋于悲观；作者接着指出这种悲观可能错位。<\/p>\n<\/blockquote>\n<p>第二、三段先说明当下悲观怎样产生，再对这份悲观作修正，它们承接的是<code>Now<\/code>这一时间线。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Our earlier visions of the future were inspired by an awareness of the risks ahead.<\/p>\n<p>我们过去的未来愿景由对前方风险的认识激发。<\/p>\n<\/blockquote>\n<p>C只需让风险认识明确成为过去愿景的来源，并不需要声称风险没有其他作用。原文却把这一解释放在“现在”，而首段给出的是对科技的信任，两条时间线的依据不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者看好人类的长期前景，不能单凭这一态度判断过去的乐观愿景具体由什么激发；还要分清第一段中信念的依据与期待的生活结果。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>our awareness of potential risks<br>我们对潜在风险的认识<\/p>\n<\/blockquote>\n<p>作者看好长期前景，并不意味着他从不讨论风险，所以不能只凭乐观主旨否定C。本项最终仍要根据“Now”及后面的风险认识判断：它解释现在的悲观转向，题干问的是过去的愿景来源，时间范围没有对上。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<hr>\n<h3>D. our belief in equal opportunity<\/h3>\n<blockquote>\n<p>我们对机会平等的信念<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项是<code>our belief in [xxx] opportunity<\/code>，我们未读出机会的修饰语。仍能看见原文<code>opportunity for all<\/code>在<code>leading to<\/code>之后，属于科技解决弊病带来的结果；选项把对机会的信念当成愿景起因，因此第一轮排除D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p><code>equal opportunity<\/code>借用了<code>opportunity for all<\/code>，但选项不只是把“人人有机会”换一种说法。加上<code>our belief in<\/code>并接回题干后，它变成激发未来愿景的信念，而原文把机会放在科技改善生活的结果端。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>我们过去对未来的想象由我们对机会平等的信念激发。<\/p>\n<\/blockquote>\n<p>D的<code>opportunity<\/code>对应第一段第二句的<code>opportunity for all<\/code>，题干的<code>inspired by<\/code>则要求检查这一内容在原句中是否承担原因作用。<\/p>\n<p>原句以科学技术为主语，说它们将治愈弊病；<code>leading to<\/code>引出充实生活和人人有机会。这两项并列出现，都是当时人们相信科技可能带来的美好生活。<\/p>\n<p>即使允许<code>equal opportunity<\/code>概括人人有机会，名词内容接近也不足以证明整项。原文没有说机会平等的信念推动人们形成了过去的未来观。<\/p>\n<p>D把愿景中的一项结果改成愿景的激发来源，问题在因果位置，不在是否认识<code>equal<\/code>这个修饰语。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<p>人们相信科技将治愈弊病，并由此带来充实生活和人人有机会。<\/p>\n<\/blockquote>\n<p>这句话先提供实现美好未来的力量，再列出它能带来的生活图景，机会属于后面列出的内容。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A belief in equal opportunity inspired our earlier visions of the future.<\/p>\n<p>对机会平等的信念激发了我们过去的未来愿景。<\/p>\n<\/blockquote>\n<p>D所需的是机会信念与愿景之间的激发关系；实际写法是科技带来机会。两条关系可以在现实中并存，但原文只陈述了后一条，不能用共享<code>opportunity<\/code>替前一条补证据。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者看好人类的长期前景，不能单凭这一态度判断过去的乐观愿景具体由什么激发；还要分清第一段中信念的依据与期待的生活结果。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>our belief in equal opportunity<br>我们对机会平等的信念<\/p>\n<\/blockquote>\n<p>机会平等可以属于光明前景的一部分，但全文主旨不能把愿景的内容自动变成其原因。本项最终仍要根据“leading to”判断：人人有机会是相信科技能解决问题之后所期待的结果，不是首段明写的信心来源。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<hr>\n<h3>31题结论<\/h3>\n<blockquote>\n<p><strong>31. B. our faith in science and technology<\/strong><\/p>\n<\/blockquote>\n<p>A借用了充实生活这个结果，却把对结果的愿望补成了未来观的原因。<\/p>\n<p>B把过去人们相信科技能解决弊病准确概括为对科技的信心。<\/p>\n<p>C借用了现在的风险认识，却把它搬成过去乐观愿景的来源。<\/p>\n<p>D借用了人人有机会，却把期待得到的结果改成激发愿景的信念。<\/p>\n<hr>\n<h2>32题<\/h2>\n<blockquote>\n<p>The IUCN’s “Red List” suggests that human beings are ______.<\/p>\n<p>IUCN“红色名录”表明人类是什么样的物种？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>具体细节题，要求概括IUCN“红色名录”给出的人类生存状态。应以名录对智人的评估为主，再用它前面关于长期存活的说明理解这项评估的作用。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<p>Look up Homo sapiens in the “Red List” of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.”<\/p>\n<\/blockquote>\n<p><code>IUCN<\/code>和<code>Red List<\/code>把范围锁定在第三段末句。<code>Least Concern<\/code>是名录给出的分类，后面的分布广、适应性、数量增长和总体威胁情况解释分类依据；前一句说明这些材料支持人类有良好的长期生存机会。<\/p>\n<hr>\n<h3>A. a misplaced race<\/h3>\n<blockquote>\n<p>一个位置不当的种族<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示；第三段开头是<code>But such [xxx] is misplaced<\/code>，虽然情绪名词被遮挡，我们仍从前后的悲观判断知道<code>misplaced<\/code>是在评价那种看法。再与名录的<code>Least Concern<\/code>比较，发现A把修饰对象换成人类，因此第一轮排除。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A拿走第三段开头的<code>misplaced<\/code>，让它修饰<code>race<\/code>。原文被评为“不合适、错位”的是悲观情绪，人类则被名录列为无危；把同段中的形容词换一个修饰对象，判断就变了。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But such gloominess is misplaced.<\/p>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>IUCN“红色名录”表明，人类是一个位置不当的种族。<\/p>\n<\/blockquote>\n<p>题干的<code>Red List<\/code>锁定第三段末尾，A的<code>misplaced<\/code>却来自本段开头。既要读这个词，也要读它究竟在评价谁。<\/p>\n<p>开头句子的主语是<code>such gloominess<\/code>，承接第二段对人类未来的悲观；末句名录的评估对象才是<code>Homo sapiens<\/code>，分类是<code>Least Concern<\/code>。<\/p>\n<p>A把“这种悲观是错位的”改成“人类这个种族位置不当”，又让这一判断成为名录的结论。修饰对象和信息来源都被更换。<\/p>\n<p>名录的分布、适应性与增长等指标是在说明生存状态，没有把人类称为一个位置不当的种族。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>But such gloominess is misplaced.<\/p>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<p>作者先纠正悲观，随后肯定人类有良好的长期生存机会。<\/p>\n<\/blockquote>\n<p>两句推进相互支持：被质疑的是悲观判断，而人类被重新放到具有延续机会的位置上。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The IUCN’s Red List describes human beings as a misplaced race.<\/p>\n<p>IUCN红色名录把人类描述为一个位置不当的种族。<\/p>\n<\/blockquote>\n<p>A需要名录本身把<code>misplaced<\/code>归给人类；实际文章先用它否定悲观，再引用名录支持人类有良好生存条件。并不是给人类同一个负面标签后再展开说明。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨指向人类仍有良好的长期前景，因此这里应说明人类具备延续的条件；名录到底列了什么指标、怎样界定人类，仍须由第三段的局部评估确认。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>a misplaced race<br>一个位置不当的种族<\/p>\n<\/blockquote>\n<p>A把名录的评估对象判为位置不当，无法替本文说明人类长期前景的积极依据。不过关键仍在局部修饰关系：“such gloominess is misplaced”评价的是悲观情绪；名录给人类的分类是无危，二者不能互换。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<hr>\n<h3>B. a sustained species<\/h3>\n<blockquote>\n<p>一个能够延续的物种<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整显示。即使名录中的适应性表达仍是<code>[xxx]<\/code>，我们已经读到人类有很好的长期存活机会、被列为<code>Least Concern<\/code>、数量增长等信息，因此第一轮保留B；本题其余选项排除后选B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B用<code>a sustained species<\/code>概括名录列举的生存条件，并与引文前关于长期存活机会的判断相接。它描述能够延续的物种状态，不是把人类说成永远不会灭绝。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>IUCN“红色名录”表明，人类是一个能够延续的物种。<\/p>\n<\/blockquote>\n<p><code>Red List<\/code>定位到第三段的正式评估，B的<code>sustained<\/code>要结合前面的<code>surviving<\/code>和名录具体指标理解，而不是另找完全相同的词。<\/p>\n<p>名录给出的分布广、适应性强、数量增长，以及没有导致总体种群下降的重大威胁，共同说明人类当前不处于严重生存危机中。引文前一句再将这类材料用于支持长期存活的良好机会。<\/p>\n<p>原文用<code>excellent chance<\/code>说明机会很好，仍保留可能性；说人类能够延续并不要求把它扩大为所有地区都无风险、种群数量永远增加或物种必定永久存在。<\/p>\n<p>B保留了评估所支持的物种延续方向，是对多项生存指标及其上下文的概括。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<p>前文提出人类有良好的长期存活机会，名录再以无危分类和多项生存指标支撑。<\/p>\n<\/blockquote>\n<p>文章先提出长期生存的判断，再引用现有评估给它提供依据，论点与引文的方向一致。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The Red List’s assessment indicates that humans are a species capable of continued survival.<\/p>\n<p>红色名录的评估表明，人类是能够继续生存的物种。<\/p>\n<\/blockquote>\n<p>B需要的只是生存条件支持延续，原文名录中的分布、适应性和种群趋势能够满足这一点；前一句的良好存活机会进一步说明这些指标被作者拿来支持什么。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨指向人类仍有良好的长期前景，因此这里应说明人类具备延续的条件；名录到底列了什么指标、怎样界定人类，仍须由第三段的局部评估确认。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>a sustained species<br>一个能够延续的物种<\/p>\n<\/blockquote>\n<p>B把人类表述为能够延续的物种，正好回答全文长期积极前景需要的一项依据。局部名录的无危分类和生存指标使这条方向得到具体支持；它没有从积极前景跳到永无危险的保证。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<hr>\n<h3>C. the world’s dominant power<\/h3>\n<blockquote>\n<p>世界的主导力量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们发现它容易使人从名录的分布广、数量增长联想到支配世界，但名录说的是受威胁程度和生存状态，没有给出主导地位，因此第一轮排除C。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用了人类分布广、数量增长这些指标，诱导人再补出“因此成为世界主导力量”。数量与分布说明生存状况，并未建立人类支配其他力量的关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>IUCN“红色名录”表明，人类是世界的主导力量。<\/p>\n<\/blockquote>\n<p>C的<code>world’s<\/code>容易让人注意第三段的<code>very widely distributed<\/code>，但题干要的是名录实际支持的判断，不能把空间范围误读成力量排序。<\/p>\n<p>名录说人类分布广、适应性强、种群正在增长，并且没有导致总体数量下降的重大威胁。这些内容共同用于解释为什么列为无危。<\/p>\n<p>主导力量需要涉及对其他力量的相对优势或控制作用，而名录没有进行这类比较。分布广与占据主导地位在现实中可以相关，但一个并不自动推出另一个。<\/p>\n<p>C由生存指标额外补出支配世界的关系，超出了这段名录评估给出的命题。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<p>列举分布、适应性、数量和威胁情况，解释人类为什么被列为无危。<\/p>\n<\/blockquote>\n<p>引文围绕人类是否受到导致整体衰退的威胁展开，没有转入人类相对其他生物或力量处于何种地位。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The Red List identifies humans as the dominant power in the world.<\/p>\n<p>红色名录把人类认定为世界的主导力量。<\/p>\n<\/blockquote>\n<p>C所需的是名录作出主导地位判断；实际引文只给出种群生存评估。作者随后转问深远未来，也没有把“能够存续”继续解释成“支配世界”。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨指向人类仍有良好的长期前景，因此这里应说明人类具备延续的条件；名录到底列了什么指标、怎样界定人类，仍须由第三段的局部评估确认。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>the world’s dominant power<br>世界的主导力量<\/p>\n<\/blockquote>\n<p>全文的积极前景可以建立在人类能够延续和改善处境上，并不需要把人类说成世界的主导力量。本项最终仍要根据“very widely distributed”等局部材料判断：它们没有给出主导地位或支配关系，C多走了一步。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<hr>\n<h3>D. a threat to the environment<\/h3>\n<blockquote>\n<p>对环境的威胁<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项显示为<code>a threat to the [xxx]<\/code>，威胁的对象尚未读出。我们仍能判断选项让人类成为威胁的发出者，而名录在评估是否有威胁造成人类种群下降，因而第一轮排除D，没有等遮挡词恢复才作判断。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了名录中的<code>threats<\/code>，却把关系方向倒转：原文评估作用于人类总体种群的威胁，选项改成人类对环境构成威胁。名录并未在这段给出后一判断。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>IUCN“红色名录”表明，人类是对环境的威胁。<\/p>\n<\/blockquote>\n<p>题干明确要求看名录，D的<code>threat<\/code>对应引文尾部的<code>no major threats resulting in an overall population decline<\/code>。决定答案的是威胁指向谁，不只是同一个词有没有出现。<\/p>\n<p>引文中的<code>the species<\/code>指人类，<code>an overall population decline<\/code>是人类总体种群下降。原文说没有重大威胁正在造成这种下降，服务于人类被列为无危的判断。<\/p>\n<p>D让人类充当威胁源，把环境当作受影响对象。人类自身的受威胁程度与人类是否损害环境，是两条不同关系，前者不能证明后者。<\/p>\n<p>D把评估人类遭受的威胁改成评估人类发出的威胁，更换了关系中的主体与对象。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<p>名录用没有导致人类总体数量下降的重大威胁，解释人类的无危状态。<\/p>\n<\/blockquote>\n<p>各项指标始终围绕人类这一物种的存续条件，没有将人类行为对其他系统的影响设为讨论对象。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The Red List describes human beings as a threat to the environment.<\/p>\n<p>红色名录把人类描述为对环境的威胁。<\/p>\n<\/blockquote>\n<p>D至少需要名录评价人类对环境的影响。实际引文评价人类是否因重大威胁而总体减少；即使两类问题都可以讨论，也不能把其中一个作为另一个的证据。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨指向人类仍有良好的长期前景，因此这里应说明人类具备延续的条件；名录到底列了什么指标、怎样界定人类，仍须由第三段的局部评估确认。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>a threat to the environment<br>对环境的威胁<\/p>\n<\/blockquote>\n<p>人类长期前景好与人类是否威胁环境并非简单反义，所以不能凭主旨独自否定D。局部引文“no major threats resulting in an overall population decline”是在说明人类自身的受威胁状态，D却把人类放在威胁的发出端。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<hr>\n<h3>32题结论<\/h3>\n<blockquote>\n<p><strong>32. B. a sustained species<\/strong><\/p>\n<\/blockquote>\n<p>A把修饰悲观情绪的misplaced移到人类身上。<\/p>\n<p>B把名录的生存指标及前文的长期存活机会概括为物种能够延续。<\/p>\n<p>C从分布广和数量增长脑补了支配世界的地位。<\/p>\n<p>D把人类是否受到威胁，倒换成人类是否威胁环境。<\/p>\n<hr>\n<h2>33题<\/h2>\n<blockquote>\n<p>Which of the following is true according to Paragraph 5?<\/p>\n<p>根据第五段，下面哪项正确？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>具体细节题，题干将证据范围限定为第五段。要逐项核对该段实际判断的对象、动作和难易关系，不能把别段出现的相关话题移来充当本段结论。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future. The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage. That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<p><code>Paragraph 5<\/code>要求读全第五段。首句比较长期与近期未来的思考难度，第二句说明技术演变和社会后果复杂，第三句交代Arc这份刊物关注近期未来。三句依次提供难度判断、原因和由此引出的探索。<\/p>\n<hr>\n<h3>A. The interest in science fiction is on the rise.<\/h3>\n<blockquote>\n<p>人们对科幻的兴趣正在上升。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示。我们读到第五段让科幻作家探索复杂未来，比较后发现这只是探索任务由谁承担，不能说明公众兴趣随时间上升，所以第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借用<code>science fiction writers<\/code>中的科幻话题，再补出对科幻的兴趣正在增加。原文谈的是谁适合探索未来的多种可能，没有给出兴趣程度的前后比较。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第五段，人们对科幻的兴趣正在上升。<\/p>\n<\/blockquote>\n<p><code>according to Paragraph 5<\/code>限定本段，A的<code>science fiction<\/code>对应第二句的<code>science fiction writers<\/code>。两处共享话题，但选项新增的<code>interest<\/code>和<code>on the rise<\/code>同样需要依据。<\/p>\n<p>第二句说技术演变及社会后果十分复杂，因此或许最好由科幻作家和未来学家探索各种可能；第三句再介绍为讨论近期未来而创办的Arc。<\/p>\n<p>作者安排谁来探索，交代的是人员角色；兴趣上升则需要比较人们以前与现在对科幻的兴趣。出现作家或推出刊物，可以令人联想需求，却不能替代这种趋势证据。<\/p>\n<p>A从探索者身份补出了公众兴趣增长，第五段没有表达这一完整趋势。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<p>复杂未来值得由科幻作家和未来学家探索，这也是创办关注近期未来的Arc的原因之一。<\/p>\n<\/blockquote>\n<p>后句沿着“近期未来复杂→需要进一步探索”推进，把刊物当成开展讨论的安排。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Interest in science fiction has grown as more people seek to imagine the near future.<\/p>\n<p>随着更多人寻求想象近期未来，人们对科幻的兴趣增长了。<\/p>\n<\/blockquote>\n<p>A成立至少需要明确写出兴趣出现增长。原文解释的是探索任务和刊物主题，未把这些安排写成兴趣上升的表现，也没有比较前后兴趣。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者总体看好长期前景，不能判断第五段中的兴趣趋势、刊物作用、技术用途或具体难易比较；这些局部命题必须逐项以第五段为依据。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>The interest in science fiction is on the rise.<br>人们对科幻的兴趣正在上升。<\/p>\n<\/blockquote>\n<p>科幻兴趣上升既不能由人类前景光明推出，也不必与它冲突。本项最终仍要根据“best left to science fiction writers”判断：原句交代探索任务适合由谁承担，并没有关于公众兴趣变化的陈述。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<hr>\n<h3>B. Arc helps limit the scope of futurological studies.<\/h3>\n<blockquote>\n<p>Arc有助于限制未来学研究的范围。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项为<code>Arc helps limit the scope of [xxx] studies<\/code>，研究类别仍被遮挡。我们已经看出原句只说Arc专门讨论近期未来，并不等于刊物限制研究范围，因此第一轮排除B，后续未改变状态。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B把<code>dedicated to the near future<\/code>给刊物规定的主题，改成<code>helps limit the scope<\/code>所宣称的研究作用。刊物选择关注近期未来，与它对未来学研究范围施加限制，并不是同一件事。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第五段，Arc有助于限制未来学研究的范围。<\/p>\n<\/blockquote>\n<p><code>Arc<\/code>定位到第五段末句，<code>futurological<\/code>与前句的<code>futurologists<\/code>相关。应把这两处连起来看，同时检查<code>helps limit<\/code>这一作用是否被原文建立。<\/p>\n<p>前句说未来学家可以探索技术演变及社会后果的多种可能，末句把Arc说明为一份专注近期未来的新刊物，创办原因之一就是这个领域值得探索。<\/p>\n<p>一份刊物有自己的时间和主题范围，并不等于它使未来学研究的范围缩小。原文没有将刊物的主题选择转述为对这类研究产生限制的效果。<\/p>\n<p>B把“Arc自身关注什么”改成“Arc使某类研究受到什么影响”，更换了范围限定的对象与作用关系。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<p>先提出探索可设想的多种可能，再介绍一份专门讨论近期未来的刊物。<\/p>\n<\/blockquote>\n<p>Arc承接的是开展探索的需要；作者用它说明自己怎样参与这一讨论。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Arc helps narrow the scope of futurological studies by concentrating research on the near future.<\/p>\n<p>Arc通过把研究集中到近期未来，有助于缩小未来学研究的范围。<\/p>\n<\/blockquote>\n<p>B所需的写法要让Arc的关注方向实际影响研究范围，程度只需达到“有助于”，无需声称它控制全部研究。原文仅交代刊物主题，并未建立这一限制作用。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者总体看好长期前景，不能判断第五段中的兴趣趋势、刊物作用、技术用途或具体难易比较；这些局部命题必须逐项以第五段为依据。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>Arc helps limit the scope of futurological studies.<br>Arc有助于限制未来学研究的范围。<\/p>\n<\/blockquote>\n<p>看好人类长期前景并不能判断一份刊物是否限制研究范围。本项最终仍要根据“a new publication dedicated to the near future”判断：它说明Arc的定位，B却让这一定位产生约束未来学研究的作用。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<hr>\n<h3>C. Technology offers solutions to social problems.<\/h3>\n<blockquote>\n<p>技术为社会问题提供解决方案。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们把它与第五段技术演变及社会后果复杂、需要探索的写法比较，发现本段并没有把技术的作用概括为解决社会问题，因此第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用<code>technology<\/code>和<code>social consequences<\/code>，把技术与社会之间复杂的后果关系改成提供解决方案的关系。第五段实际要解释的是近期未来为什么难以设想，不是确认技术具有怎样的社会问题解决功能。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第五段，技术为社会问题提供解决方案。<\/p>\n<\/blockquote>\n<p>题干限定第五段，C中的<code>Technology<\/code>对应第二句的<code>today’s technology<\/code>，<code>social problems<\/code>容易使人联想到<code>social consequences<\/code>，但问题与后果不能直接替换。<\/p>\n<p>原句同时讨论技术的潜在演变及其社会后果，并把它们评价为极其复杂，需要探索各种可设想的可能。它没有在这些后果中明确建立“技术解决社会问题”这条判断。<\/p>\n<p>C并未说技术可以解决所有问题，因此不能靠给它添上“全部”来排除。即使只说技术提供某些方案，仍需本段有这类功能的陈述；仅有复杂社会后果不足以推出解决作用。<\/p>\n<p>C改变了第五段技术与社会之间所写的关系：由复杂、待探索的后果，换成了提供解决办法。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<p>技术变化及社会后果复杂，因此需要探索，Arc也被用于讨论近期未来。<\/p>\n<\/blockquote>\n<p>从复杂性引出探索，说明作者此处是在交代预测为何困难以及怎样展开讨论。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Technology provides ways of addressing social problems.<\/p>\n<p>技术提供应对社会问题的办法。<\/p>\n<\/blockquote>\n<p>C成立至少需要写出技术具有解决社会问题的作用，不要求作者宣称技术无所不能。实际句子把社会后果作为需要探索的对象，随后继续谈刊物，并没有写出这一作用。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者总体看好长期前景，不能判断第五段中的兴趣趋势、刊物作用、技术用途或具体难易比较；这些局部命题必须逐项以第五段为依据。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>Technology offers solutions to social problems.<br>技术为社会问题提供解决方案。<\/p>\n<\/blockquote>\n<p>积极的长期前景可以与技术帮助人类相容，但不能因此把这一命题补进第五段。本项最终仍要根据“its social consequences”及“dazzlingly complicated”判断：它们描述复杂性，没有把技术概括为社会问题的解决方案。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<hr>\n<h3>D. Our immediate future is hard to conceive.<\/h3>\n<blockquote>\n<p>我们的近期未来很难设想。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示；第五段首句虽有<code>[xxx]<\/code>，但<code>easier to think about ... than about the more immediate future<\/code>的比较关系完整保留。我们读到长期反而更容易思考，再接上后句的复杂性，第一轮保留D；其余选项排除后选D。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>D把首句长期与近期未来的难易比较，连同后句对技术及社会后果复杂性的说明，概括成近期未来难以设想。它说的是困难，不是断言人类完全不能思考近期未来。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future.<\/p>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第五段，我们的近期未来很难设想。<\/p>\n<\/blockquote>\n<p>D的<code>immediate future<\/code>对应首句<code>the more immediate future<\/code>，<code>hard to conceive<\/code>需要结合<code>easier to think about<\/code>的比较及后句的<code>dazzlingly complicated<\/code>理解。<\/p>\n<p>首句说思考漫长时间尺度可能比思考更近的未来容易，表明近期这一侧更难处理；第二句说明原因在于技术演变和社会后果极其复杂。<\/p>\n<p>只有比较更难，未必单独足以说明绝对难度很大；这里第二句的复杂性说明补足了判断。<code>hard<\/code>保留困难程度，没有把它说成不能探索或无法想象任何可能。<\/p>\n<p>D将两句共同表达的近期预测难度概括出来，时间对象和难易方向都与第五段一致。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future.<\/p>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<p>先比较长期和近期未来，再解释近期技术与社会变化复杂，最后介绍关注近期未来的新刊物。<\/p>\n<\/blockquote>\n<p>首句提出难度差异，后句解释困难，末句说明仍要围绕近期未来开展探索；困难与可以讨论并不冲突。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Because technological change and its social consequences are so complicated, the immediate future is difficult to envisage.<\/p>\n<p>由于技术变化及其社会后果十分复杂，近期未来很难设想。<\/p>\n<\/blockquote>\n<p>D需要的“复杂性→近期难设想”就是原文已有的推进。Arc的存在也没有推翻这种困难，只说明作者用刊物继续探索，而不是近期未来已经容易预测。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者总体看好长期前景，不能判断第五段中的兴趣趋势、刊物作用、技术用途或具体难易比较；这些局部命题必须逐项以第五段为依据。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>Our immediate future is hard to conceive.<br>我们的近期未来很难设想。<\/p>\n<\/blockquote>\n<p>长期前景积极与近期未来难以设想可以同时成立；文章在保持前者时承认后者。本项的具体判断仍由第五段的难易比较和复杂性说明给出，D准确保留这项局部限制，没有把它扩大成所有未来都不可知。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<hr>\n<h3>33题结论<\/h3>\n<blockquote>\n<p><strong>33. D. Our immediate future is hard to conceive.<\/strong><\/p>\n<\/blockquote>\n<p>A从科幻作家的探索角色补出了科幻兴趣上升。<\/p>\n<p>B把刊物本身的主题范围改成限制未来学研究范围的作用。<\/p>\n<p>C把技术复杂的社会后果换成技术解决社会问题的作用。<\/p>\n<p>D概括了首句的难易比较与后句的复杂性原因。<\/p>\n<hr>\n<h2>34题<\/h2>\n<blockquote>\n<p>To ensure the future of mankind, it is crucial to ______.<\/p>\n<p>为了保障人类的未来，关键是什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>局部推断题，问保障人类未来所需的关键做法。第六段明说以过去的长期模式作预测，第七段明说利用知识减少风险、改善后代处境；将这两项明示事实连起来，才能推出题干要求的行动。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad. To be sure, the future is not all rosy. But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<\/blockquote>\n<p><code>ensure the future of mankind<\/code>对应末段的减少生存风险和改善后代处境。末段<code>This long perspective<\/code>承接第六段，因此要回看<code>the past holds the key to the future<\/code>及冒号后的解释：利用历史模式形成有证据的预测，再把知识用于应对未来。<\/p>\n<hr>\n<h3>A. draw on our experience from the past<\/h3>\n<blockquote>\n<p>借鉴过去的经验<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示。我们从末段的长远视角回读第六段，尽管<code>considerable [xxx]<\/code>仍有遮挡，仍读到<code>the past holds the key to the future<\/code>及依据长期模式作预测，因此第一轮保留A；其他项排除后选A。<\/p>\n<p><strong>选项类型：正确跨段概括。<\/strong><\/p>\n<p>第六段说明从地球与人类历史的长期模式获得预测依据，第七段说明知识可以减少生存风险、改善后代处境。A把这一路径概括为借鉴过去经验，既包含依据来源，也接得上题干保障未来的目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>为了保障人类的未来，关键是借鉴过去的经验。<\/p>\n<\/blockquote>\n<p>题干的<code>ensure the future<\/code>要找减少风险、改善后代处境的做法；A的<code>experience from the past<\/code>对应第六段<code>the past<\/code>与<code>long-term patterns<\/code>，不能只停在末段态度词上。<\/p>\n<p>第六段明示已经识别了塑造地球和人类历史的足够多长期模式，因此能够作有证据的预测；第七段明示现有知识能够减少许多曾威胁早期人类的风险。<\/p>\n<p>这两段把知识来源和知识用途接起来：依据过去认识模式，为预见与应对未来提供基础。<code>draw on<\/code>是利用和借鉴，并不要求照搬过去每种做法，也不保证未来完全重复历史。<\/p>\n<p>A准确概括了借助过去形成认识、再用认识改善未来这条行动路径。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<p>以过去的长期模式形成预测，再凭知识减少风险、改善后来者的处境。<\/p>\n<\/blockquote>\n<p>第六段回答认识从哪里来，第七段回答这些认识对未来有什么用；跨段推进把借鉴过去落到保障未来上。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>By drawing on what the past reveals, we can better anticipate risks and improve conditions for future generations.<\/p>\n<p>借助过去揭示的经验，我们能够更好地预见风险、改善后代的处境。<\/p>\n<\/blockquote>\n<p>A所需的写法由相邻两段共同给出：历史模式帮助预测，已有知识帮助减少风险。它不是只复述“过去”一词，而是保留作者赋予过去经验的实际用途。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>要保障仍然值得期待的人类未来，应利用已有知识辨认和减少风险、改善后代处境；其中知识怎样取得，要由第六段关于过去与长期模式的说明补足，积极态度本身不能替代这一步。<\/p>\n<\/blockquote>\n<p>A实际说的是：<\/p>\n<blockquote>\n<p>draw on our experience from the past<br>借鉴过去的经验<\/p>\n<\/blockquote>\n<p>A提供了主旨所需的行动基础：人类能够改善前景，靠的是可用于识别和减少风险的认识。第六段“the past holds the key to the future”明确知识的一项来源，第七段再说明它的用途，因此借鉴过去能够接回答题要求。<\/p>\n<p><strong>复盘判断：A正确。<\/strong><\/p>\n<hr>\n<h3>B. adopt an optimistic view of the world<\/h3>\n<blockquote>\n<p>采取乐观的世界观<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整显示。我们将采取乐观态度与第六段依据历史模式作预测比较，发现题干要关键做法，原文给出的依据是知识和证据；保持乐观不能替代这一做法，因此第一轮排除B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了文章纠正悲观、看好人类前景的态度，却把这一认识结果放到保障未来的关键手段位置。原文先说明依据历史与知识作判断、减少风险，再得出不必悲观的结论。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad. To be sure, the future is not all rosy. But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>为了保障人类的未来，关键是采取乐观的世界观。<\/p>\n<\/blockquote>\n<p><code>ensure<\/code>要求保障未来的手段，B的<code>optimistic<\/code>可与末段反驳<code>pessimistic view<\/code>的方向联系；但要继续看末段为什么有这种态度。<\/p>\n<p>第六段给出长期模式和有证据的预测，第七段说长远视角使悲观更像一时风潮，又强调现有知识能够减少风险。作者的积极判断有事实和能力作依据。<\/p>\n<p>B本身并没有说只要乐观就够了，因此不能给它加上“只要”再批评。问题是原文没有把“采用乐观世界观”陈述为保障未来的关键行动；它明确支持的行动是借助认识来应对风险。<\/p>\n<p>B把由知识和长远视角支持的态度，改成了保障未来所需的关键手段，调换了论证关系中的位置。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad. To be sure, the future is not all rosy. But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<p>长远视角使悲观不必成为定局；承认未来有风险之后，强调人类已有知识可以减少风险。<\/p>\n<\/blockquote>\n<p>作者在让步后落到有能力做什么，积极态度的依据是改善处境的知识与行动空间。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Adopting an optimistic view of the world is crucial to securing humanity’s future.<\/p>\n<p>采取乐观的世界观对于保障人类未来至关重要。<\/p>\n<\/blockquote>\n<p>B至少需要作者把这一态度与保障未来的作用明确相连，无须排斥其他办法。实际结尾强调的是知识足以减少风险，未把采用乐观态度设为这项作用的关键条件。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>要保障仍然值得期待的人类未来，应利用已有知识辨认和减少风险、改善后代处境；其中知识怎样取得，要由第六段关于过去与长期模式的说明补足，积极态度本身不能替代这一步。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>adopt an optimistic view of the world<br>采取乐观的世界观<\/p>\n<\/blockquote>\n<p>B在态度上接近文章主旨，但题干问怎样保障未来，并非问作者乐观还是悲观。局部“knowledgeable enough to reduce many of the risks”将实际能力建立在知识上；从有依据的乐观跳到以乐观作为关键手段，不能回答原文给出的方法。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<hr>\n<h3>C. explore our planet’s abundant resources<\/h3>\n<blockquote>\n<p>探索地球丰富的资源<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们注意到它与第六段都出现<code>planet<\/code>，但原文研究地球历史的长期模式，选项转为探查资源，因此第一轮排除C。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用<code>the planet<\/code>，再补出资源丰富和探索资源有助于保障未来的关系。第六段的地球是历史模式的研究对象，原文没有给出资源数量或将探查资源设为关键办法。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>为了保障人类的未来，关键是探索地球丰富的资源。<\/p>\n<\/blockquote>\n<p>C的<code>our planet<\/code>对应第六段<code>the history of the planet<\/code>，题干的<code>crucial<\/code>对应<code>the past holds the key<\/code>。必须把<code>history<\/code>和后面的长期模式一起读，才能确定地球在这里承担什么角色。<\/p>\n<p>原文写人们识别塑造地球与人类历史的长期模式，用它们预测后代将处在什么情境中。这是一条从历史材料取得认识的路径。<\/p>\n<p>C则把动作设为探索地球资源，并称这些资源丰富。探索资源现实中可能有益，但这段没有给出资源的丰富程度，也没有把这种探索与保障未来建立关系。<\/p>\n<p>C从同一个<code>planet<\/code>补出了新的对象“丰富资源”和新的关键行动，不能由研究历史模式推得。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<p>地球和人类历史提供可识别的长期模式，现有知识又可以帮助降低未来风险。<\/p>\n<\/blockquote>\n<p>作者持续谈怎样取得和利用认识，后文承接的是知识带来的预测与应对能力。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Exploring our planet’s abundant resources is crucial to securing the future of humanity.<\/p>\n<p>探索地球丰富的资源对于保障人类未来至关重要。<\/p>\n<\/blockquote>\n<p>C所需的写法必须让资源探索成为保障未来的关键办法。原文从地球历史转向证据和知识，并没有以资源储备或资源探索接住这个问题。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>要保障仍然值得期待的人类未来，应利用已有知识辨认和减少风险、改善后代处境；其中知识怎样取得，要由第六段关于过去与长期模式的说明补足，积极态度本身不能替代这一步。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>explore our planet’s abundant resources<br>探索地球丰富的资源<\/p>\n<\/blockquote>\n<p>光明前景可以与资源探索相容，但主旨不能推出这就是关键办法。本项最终仍要根据“long-term patterns shaping the history of the planet”判断：作者寻找的是历史中的预测依据，C的资源丰富程度和探索作用都没有从中得到支持。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<hr>\n<h3>D. curb our ambition to reshape history<\/h3>\n<blockquote>\n<p>抑制我们重塑历史的雄心<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项为<code>curb our ambition to [xxx] history<\/code>，重塑这一动词仍被遮挡。我们已经看出它提出压制雄心，而原文主张识别和利用历史模式，没有把保障未来建立在限制动机上，因此第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了<code>history<\/code>和关于风险的背景，额外引入人类怀有重塑历史的雄心，并把抑制这种雄心设为保障未来的关键。原文说的是认识历史和运用知识，没有对这类雄心作出判断。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>为了保障人类的未来，关键是抑制我们重塑历史的雄心。<\/p>\n<\/blockquote>\n<p>D的<code>history<\/code>可对应第六段的<code>the history of the planet, and our species<\/code>，但<code>curb our ambition<\/code>是一个新的行动要求，同样要检查原文是否支持。<\/p>\n<p>第六段主语是已经识别长期模式的“我们”，动作是识别并据此预测；末段又写有足够知识减少风险、改善后来者处境。两段没有先列出重塑历史的雄心，也没有把它当作风险原因。<\/p>\n<p>知道人类面临风险，不等于知道风险来自某种雄心；主张借鉴过去，也不等于主张抑制重塑历史的意愿。要得到D，还需要补出原文没有的动机和应对要求。<\/p>\n<p>D将认识历史这一主题接成限制雄心的规范性结论，缺少两者之间的文本依据。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<p>从长期历史中获取预测依据，再用已有知识减少危险、改善后代处境。<\/p>\n<\/blockquote>\n<p>文章沿着积极使用知识的路线收束，没有把某种改变历史的企图列为必须先压制的问题。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>We must curb our ambition to reshape history in order to secure humanity’s future.<\/p>\n<p>为了保障人类未来，我们必须抑制重塑历史的雄心。<\/p>\n<\/blockquote>\n<p>D要求明确指出这类雄心应受到限制。原文没有评价这种动机，而是解释已有认识怎样支持应对未来，不能把“利用历史”改写成“限制重塑历史的雄心”。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>要保障仍然值得期待的人类未来，应利用已有知识辨认和减少风险、改善后代处境；其中知识怎样取得，要由第六段关于过去与长期模式的说明补足，积极态度本身不能替代这一步。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>curb our ambition to reshape history<br>抑制我们重塑历史的雄心<\/p>\n<\/blockquote>\n<p>全文看好人类利用知识改善未来的能力，但积极主旨本身不决定每一种雄心是否应限制。本项最终仍要根据“identified enough of the long-term patterns”及末段的知识用途判断：这两处支持认识和运用过去，没有提出抑制重塑历史雄心这一要求。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<hr>\n<h3>34题结论<\/h3>\n<blockquote>\n<p><strong>34. A. draw on our experience from the past<\/strong><\/p>\n<\/blockquote>\n<p>A把识别历史模式并利用知识应对未来概括为借鉴过去经验。<\/p>\n<p>B把有知识依据的积极态度换成保障未来的关键手段。<\/p>\n<p>C借地球一词补出了丰富资源及探索资源的关键作用。<\/p>\n<p>D借历史与风险主题补出了重塑历史的雄心及必须抑制它的要求。<\/p>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：人类未来观的转变<\/strong>（段落1-2主题引入） 过去的乐观愿景：（科学技术将治愈所有疾病 → 带来充满成就感和机会的生活）// 现在的悲观转向：（认识到各种威胁：小行星撞击、流行病、气候变化 → 人类似乎没有未来）<\/p>\n<p>↓（反驳悲观论）<\/p>\n<p><strong>逻辑层次2：反驳悲观论的证据<\/strong>（段落3论证支撑） 悲观是错位的：【化石记录：许多物种存续数百万年 → 人类为何不能？】+ 【IUCN红色名录：智人列为&quot;最少关注&quot;（分布广泛 + 适应性强 + 数量增长 + 无重大威胁）】→ 结论：人类有极好机会存活数万至数十万年<\/p>\n<p>↓（探讨未来的努力）<\/p>\n<p><strong>逻辑层次3：思考未来的不同时间尺度<\/strong>（段落4-5方法论） 长远未来的思考：（越来越多研究者认真思考 → 例：长远基金会的千年钟项目）// 近期未来的复杂性：（技术演变及社会后果令人眼花缭乱 → 留给科幻作家和未来学家 → Arc出版物专注近期未来）<\/p>\n<p>↓（预测的基础）<\/p>\n<p><strong>逻辑层次4：基于过去预测未来<\/strong>（段落6预测方法） 长远视角的优势：可以相当确信地预测 → 方法论：【过去是未来的钥匙：识别塑造地球和人类历史的长期模式 → 做出基于证据的预测】<\/p>\n<p>↓（总结展望）<\/p>\n<p><strong>逻辑层次5：理性乐观的未来观<\/strong>（段落7结论） 长远视角的启示：悲观主义可能只是一时风尚 → 平衡的观点：【未来并非全是美好 // 但人类现在有足够知识：（减少威胁早期人类的风险 + 改善后代命运）】<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：虽然当前对人类未来的悲观情绪盛行，但从长远视角和科学证据来看，人类作为一个物种有着光明的前景，我们有能力利用知识减少风险并改善后代的生活。<\/p>\n<h2>小标题题<\/h2>\n<p>Read the following text and choose the most suitable heading from the list A–G for each numbered section (41–45). There are two extra headings.<\/p>\n<p>[A] Research that stretches the horizon of human thinking<\/p>\n<p>[B] Technology making the near future easy to predict<\/p>\n<p>[C] From confident visions to fears about tomorrow<\/p>\n<p>[D] Evidence for humanity’s chances of long survival<\/p>\n<p>[E] Qualified optimism and action for future generations<\/p>\n<p>[F] Species survival as a guarantee of everyone’s happiness<\/p>\n<p>[G] Different timescales and different grounds for confidence<\/p>\n<h3>41. ______<\/h3>\n<p>What has happened to our picture of the future? Until a few decades ago, many visions of what lay ahead were strongly positive, although they were never uniformly so. Science and technology were expected to cure humanity’s problems and make lives of fulfilment and opportunity available to all.<\/p>\n<p>That confidence has become less fashionable as the range of threats has become more apparent. Asteroid impacts, pandemic disease and climate change can make the future look much less welcoming. Awareness of these dangers might even tempt people to assume that humanity has little to look forward to. The change described here is from a largely hopeful picture to a mood in which threats dominate expectations; it is not yet a demonstration that those expectations are correct.<\/p>\n<h3>42. ______<\/h3>\n<p>Such gloom is misplaced. The fossil record shows that many species have persisted for millions of years, raising the question of why our own should be assumed incapable of lasting. From a wider perspective, humanity has an excellent chance of surviving for tens or even hundreds of thousands of years.<\/p>\n<p>The International Union for Conservation of Nature’s Red List offers another relevant piece of evidence. Homo sapiens is classified as Least Concern because the species is widely distributed, adaptable and increasing in number, without major threats producing an overall population decline. This assessment concerns the species as a whole. Alongside the fossil record, it supports a better view of the prospects for human persistence than the prevailing gloom suggests, without claiming that every individual will avoid difficulty.<\/p>\n<h3>43. ______<\/h3>\n<p>Researchers and organisations are already exploring what such a distant future could hold. The Long Now Foundation in San Francisco provides a forum where thinkers and scientists consider the implications of their ideas over very long periods. Its flagship project is a mechanical clock buried inside a mountain in Texas, designed to continue marking time thousands of years from now.<\/p>\n<p>Other scientists are considering whether to recognise a new geological era, the Anthropocene. They are likewise stepping back from immediate events to ask what humanity’s impact on the planet will be in the context of stratigraphic time. The clock and the proposed geological perspective differ in form, but both encourage people to think across intervals much longer than those of everyday forecasting. They show that the distant future is becoming a subject of deliberate inquiry.<\/p>\n<h3>44. ______<\/h3>\n<p>Surprisingly, it may be easier to think about very long periods than about the immediate future. The possible evolution of present-day technology and its social consequences is enormously complicated. Science-fiction writers and futurologists can explore the many possibilities; this complexity is one reason for launching Arc, a publication devoted to the near future.<\/p>\n<p>A longer view offers a different basis for prediction. Enough long-term patterns shaping the history of the planet and of humanity have now been identified to make evidence-based forecasts about the circumstances our descendants may face. The past can therefore provide a key to the distant future. The contrast is not that every remote event can be predicted, but that enduring patterns permit considerable confidence in some long-range statements while near-term technological possibilities are difficult to disentangle.<\/p>\n<h3>45. ______<\/h3>\n<p>A long perspective makes today’s pessimism about humanity’s prospects look more like a passing fashion. Yet the future is not entirely rosy: the species may flourish while a great many individuals do not. Hope for humanity’s persistence must not be mistaken for a promise of a good life for everyone.<\/p>\n<p>Even with that qualification, people now know enough to reduce many risks that threatened earlier humans and to improve the lives of those who come after them. Thinking about our place in deep time can help focus attention on present challenges and on building a future worth living in.<\/p>\n<h3>41题解析<\/h3>\n<p><strong>答案：C — From confident visions to fears about tomorrow。<\/strong> 中文：从自信的愿景转向对未来的担忧。<\/p>\n<p>这一部分整体在交代人们的未来观怎样变化。前段概述过去依靠科技解决问题的希望，后段写威胁意识怎样带来悲观倾向；它为后面的反驳建立对象，还没有替悲观论下结论。<\/p>\n<p>开头的 Until a few decades ago 与第二段的 has become less fashionable 构成前后对照。Science and technology were expected 描述过去的预期，might even tempt people to assume 则说明今天可能作出的悲观推断，两者都在写人的看法。<\/p>\n<p>段内推进链：回看过去的未来图景 → 科技被寄予解决问题的希望 → 对多种威胁认识加深 → 乐观不再流行 → 人们可能转而觉得前景有限。<\/p>\n<p>标题中的 From ... to ... 对应两段的时间与态度转变；confident visions 对应科技带来机会的旧图景；fears about tomorrow对应威胁主导的当下预期。它概括两面，而不是把威胁清单单独当中心。<\/p>\n<p>最强干扰项是D。这里确实讲到人类前景，但尚未给出化石或物种分布的长期生存证据。若选Evidence，就把背景中的信念变化写成了下一节才展开的反驳论据。<\/p>\n<p><strong>最终答案：41选C。<\/strong><\/p>\n<h3>42题解析<\/h3>\n<p><strong>答案：D — Evidence for humanity’s chances of long survival。<\/strong> 中文：支持人类长期生存机会的证据。<\/p>\n<p>这一部分整体在反驳由风险意识直接推出的悲观结论。化石记录和IUCN物种评估从不同角度支持人类可能长期延续，判断的尺度始终是整个人类物种。<\/p>\n<p>第一句 Such gloom is misplaced 明确立场；随后 fossil record shows 引入历史比较，第二段用 Red List offers another ... piece of evidence 标明补充论据。结尾把两者合并为prospects for human persistence，并保留individual的边界。<\/p>\n<p>段内推进链：否定过度悲观 → 其他物种长期存续提供参照 → 提出人类可能延续很久 → 名录中的分布、适应和数量状况补强 → 得出物种持续存在的较好前景。<\/p>\n<p>标题中的 Evidence 对应两组支撑材料；humanity’s chances说明谈的是前景和概率；long survival对应数万年至数十万年的物种延续。chance也保留了论证的强度，没有写成绝无风险的保证。<\/p>\n<p>最强干扰项是F。它同样写species survival，却把物种层面的判断扩大到everyone’s happiness。红色名录的整体种群状态不能推出每个人幸福，本节结尾也明确说并非每个人都能避开困难。<\/p>\n<p><strong>最终答案：42选D。<\/strong><\/p>\n<h3>43题解析<\/h3>\n<p><strong>答案：A — Research that stretches the horizon of human thinking。<\/strong> 中文：拓展人类思考时间范围的研究。<\/p>\n<p>这一部分列举已经在认真思考深远未来的两类探索：长远基金会及其钟项目、科学家关于人类世的讨论。共同点在于拉长时间视角，而非两者使用相同工具或解决同一技术问题。<\/p>\n<p>首句 Researchers and organisations are already exploring 总领实例；第二段的 likewise stepping back 把人类世讨论接入同一功能。末尾用 both encourage 和 much longer 收拢两例，明确重点是思考范围的扩大。<\/p>\n<p>段内推进链：提出谁在研究深远未来 → 长远基金会组织跨长时段思考 → 千年钟把时间视野具体化 → 人类世研究转向地质尺度 → 两例共同说明深远未来正在被认真研究。<\/p>\n<p>标题中的 Research 覆盖论坛、科学思考和地质讨论；stretches the horizon对应从即时事件退后、跨越很长时段；human thinking对应这些项目培养和采用的视角。它能同时包住钟与人类世，而不把本节缩成钟的设计介绍。<\/p>\n<p>最强干扰项是G。文中确实出现不同时间尺度，但本节没有比较各尺度预测的信心依据；它展示两种长期探索。G所需的近期技术复杂性与长期历史模式的对照，要到下一节才完整建立。<\/p>\n<p><strong>最终答案：43选A。<\/strong><\/p>\n<h3>44题解析<\/h3>\n<p><strong>答案：G — Different timescales and different grounds for confidence。<\/strong> 中文：不同的时间尺度与不同的信心依据。<\/p>\n<p>这一部分整体在解释一个看似反常的比较：近期科技及其社会影响可能很难预测，较长时段却能利用已知的历史模式作出某些可靠判断。重点是两类预测的依据和难度，而非贬低近期研究。<\/p>\n<p>开头把 very long periods 与 immediate future 直接对照；科技的复杂性解释前者为何未必更难。第二段的 A longer view offers a different basis 转入历史模式，末句用 some long-range statements 限定信心的范围。<\/p>\n<p>段内推进链：提出长期思考可能更容易 → 近期技术分支及社会后果复杂 → 科幻与未来研究探索多种可能 → 长期模式提供另一种依据 → 对部分远期情况可作有证据的预测。<\/p>\n<p>标题中的 Different timescales 对应近期和长期；different grounds for confidence对应复杂的技术可能性与可识别的历史模式。它覆盖两个段落的比较关系，也保留“有些长期判断”这一范围。<\/p>\n<p>最强干扰项是B。科技的确占了第一段，但它被用来解释近期预测的困难；making ... easy恰好反转了dazzlingly complicated的方向，而且无法涵盖第二段借助过去模式的解释。<\/p>\n<p><strong>最终答案：44选G。<\/strong><\/p>\n<h3>45题解析<\/h3>\n<p><strong>答案：E — Qualified optimism and action for future generations。<\/strong> 中文：有保留的乐观与面向后代的行动。<\/p>\n<p>这一部分在收束全文：长远看不必陷入悲观，但物种繁荣不等于每个人安好；已有知识应被用来减少风险、改善后代生活并面对眼前挑战。希望与行动是连在一起的。<\/p>\n<p>第一段的 Yet 和 while ... do not 保留个体处境的限制；第二段的 Even with that qualification 转向能力，reduce risks、improve lives、focus attention on present challenges则把长远判断落实到当下任务。<\/p>\n<p>段内推进链：长期前景削弱悲观论 → 承认个体未必都受益 → 指出知识能缓解风险 → 着眼后代生活 → 用深时间视角组织当下行动并创造值得生活的未来。<\/p>\n<p>标题中的 qualified optimism对应希望与限制并存；action对应减少风险、改善处境及面对挑战；future generations对应those who come after them。三部分共同概括结论既保留希望，又把已有知识用于后代生活的推进。<\/p>\n<p>最强干扰项是F。第一段明确提醒a great many individuals may not flourish，已经否定从物种存续到人人幸福的保证。若只抓species may flourish就选F，既漏掉转折，也让第二段主动改善处境失去必要性。<\/p>\n<p><strong>最终答案：45选E。<\/strong><\/p>\n<h2>排序题<\/h2>\n<p>The following paragraphs are given in a wrong order. Reorganize them into a coherent text by choosing from the list A–H to fill in each numbered box (41–45). Paragraphs A, E and H have been correctly placed.<\/p>\n<table>\n<thead>\n<tr>\n<th>已给位置<\/th>\n<th>41<\/th>\n<th>42<\/th>\n<th>已给位置<\/th>\n<th>43<\/th>\n<th>44<\/th>\n<th>45<\/th>\n<th>已给位置<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>E<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>H<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>[A]<\/h3>\n<p>Until a few decades ago, many visions of the future were brightly positive, though not all were. Science and technology were expected to cure humanity’s ills and open lives of fulfilment and opportunity to everyone. This confidence made the future seem full of promise. But that once-familiar picture no longer dominates expectations in the same way.<\/p>\n<h3>[B]<\/h3>\n<p>Yet this gloom is misplaced. The fossil record shows many species surviving for millions of years, and there is good reason to think humanity could last for tens or hundreds of thousands. The IUCN Red List classifies Homo sapiens as Least Concern: the species is widely distributed, adaptable and growing, without major threats causing an overall population decline. Such evidence invites a question beyond immediate survival: what might our distant future hold?<\/p>\n<h3>[C]<\/h3>\n<p>Thinking on such lengthy timescales may, surprisingly, be easier than thinking about the immediate future. The evolution of today’s technology and its social effects is dazzlingly complicated. Science-fiction writers and futurologists can explore the many possibilities that can be imagined. That is one reason for Arc, a publication devoted to the near future. Complexity at this shorter horizon does not mean that every kind of forecast is equally uncertain.<\/p>\n<h3>[D]<\/h3>\n<p>Instead, awareness of dangers has made utopian hopes unfashionable. From asteroid impacts and pandemic flu to climate change, the threats facing humanity are more fully appreciated. Faced with that list, one might be tempted to think there is little future to look forward to. Such a conclusion turns awareness of real dangers into a deeply pessimistic picture of the species’ prospects.<\/p>\n<h3>[E]<\/h3>\n<p>A growing number of researchers and organisations are taking that question seriously. The Long Now Foundation in San Francisco has created a forum where thinkers and scientists consider the implications of their ideas across very long periods. Its leading project is a mechanical clock placed deep inside a mountain in Texas and designed to mark time thousands of years hence. This is one way of drawing thought beyond the immediate future.<\/p>\n<h3>[F]<\/h3>\n<p>A longer view, however, allows considerable assurance about some aspects of what is to come. Long-term patterns in the history of the planet and of humanity have been identified well enough to support evidence-based forecasts about the situations our descendants may face. In this sense, the past holds a key to the future. Confidence here comes from recurring patterns over time, rather than an ability to resolve every near-term technological possibility.<\/p>\n<h3>[G]<\/h3>\n<p>Another way is being considered by scientists who propose recognising a new geological era, the Anthropocene. Like the foundation’s thinkers, they pull the camera back, asking what humanity’s impact on the planet will be in the context of stratigraphic time. Both approaches shift attention away from immediate events and towards very lengthy intervals. This scale of inquiry raises a contrast with attempts to understand the much nearer future.<\/p>\n<h3>[H]<\/h3>\n<p>This long perspective makes the pessimistic view look more likely to be a passing fashion. The future is not all rosy: a flourishing species does not mean that every individual will flourish. But present knowledge can reduce many risks that threatened earlier humans and improve the lot of later generations. Thinking about humanity’s place in deep time can sharpen attention to today’s challenges and help people make a future worth living in.<\/p>\n<h2>排序题全局解析<\/h2>\n<p>先看每一段在全文中的功能，再检查段首、段尾是否能双向接住。相同话题只提供候选范围，明确的指代、转折和段落任务才能确定位置。<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在做什么<\/th>\n<th>关键接点<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>交代过去的乐观未来观及其退潮<\/td>\n<td>末尾once-familiar picture no longer dominates引出替代情绪<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>用化石和名录反驳悲观，提出深远未来问题<\/td>\n<td>Yet this gloom接D；末尾what might our distant future hold引出E<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>说明近期技术预测复杂，并介绍Arc<\/td>\n<td>such lengthy timescales接G；末尾every kind of forecast留给F比较<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>列举威胁，说明乐观如何转为悲观<\/td>\n<td>Instead接A；末尾pessimistic picture供B反驳<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>介绍长远基金会及千年钟的长时段探索<\/td>\n<td>that question回指B；末尾one way引出G的另一种方式<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>用长期历史模式说明远期判断的证据基础<\/td>\n<td>A longer view, however对照C；支持H的This long perspective<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>以人类世补充地质尺度探索并转向时间尺度比较<\/td>\n<td>Another way接E；末尾nearer future引出C<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>以有保留的乐观和面向后代的行动收束<\/td>\n<td>This long perspective接F；同时关注个体限制和改善能力<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>全文推进链：过去乐观愿景 → 当前威胁意识与悲观 → 生存证据反驳并提出深远未来问题 → 长远基金会探索 → 人类世地质视角 → 近期技术预测的复杂性 → 长期历史模式支持预测 → 有保留的乐观与当下行动。<\/p>\n<p><strong>完整顺序：A → D → B → E → G → C → F → H。<\/strong><\/p>\n<p><strong>41—45答案：D、B、G、C、F。<\/strong><\/p>\n<p>A、E、H分别固定开篇的乐观愿景、长远基金会的探索、结尾的有保留的乐观与行动。把每个候选段放进去时，都要同时检查它接住了前段什么、又向后段交出了什么，不能只完成单侧配对。<\/p>\n<h3>排序41题解析<\/h3>\n<p>当前空位位于已给A之后、42题之前，随后已给E将介绍思考深远未来的组织。41题先交代A所说乐观图景退潮后出现了什么，建立42题需要回应的悲观判断。<\/p>\n<p>A末尾说过去图景 no longer dominates expectations；D用 Instead 和 utopian hopes unfashionable 接续，写威胁意识如何转成a deeply pessimistic picture。接下来的B以 Yet this gloom is misplaced 明确反驳这幅悲观图景。<\/p>\n<p>前端Instead说明替代旧态度的新态度，后端this gloom指代D结尾的悲观。D把“认识到风险”推进到“推断物种前景黯淡”，B才能用证据检验这一推断。<\/p>\n<p>局部推进链：A过去科技乐观退潮 → D威胁进入视野 → D产生深度悲观判断 → B指出这种悲观不当并给证据。<\/p>\n<p>最强候选是B，它有转折，也谈前景；但A仍主要描述乐观，并未建立this gloom的准确对象。若A后直接放B，就是在悲观被交代前先反驳它，随后D也会打断B提问到E作答的连接。<\/p>\n<p><strong>最终答案：41填D。<\/strong><\/p>\n<h3>排序42题解析<\/h3>\n<p>当前空位位于已确定的D之后、已给E之前。D刚得出悲观图景，E开头说研究者正在认真对待that question，因此42题要反驳前面的判断并提出E所回应的具体问题。<\/p>\n<p>D尾部的 deeply pessimistic picture 对应B首句 Yet this gloom is misplaced；B接着用fossil record与Red List论证。B末尾问 what might our distant future hold，E开头 A growing number ... are taking that question seriously 逐字承接问题。<\/p>\n<p>前端是Yet标记的反驳和this回指，后端是问题与that question的承接。中间的生存证据先说明为什么值得讨论深远未来，提问才有论证基础，并非话题突然跳远。<\/p>\n<p>局部推进链：D悲观预期 → B历史与物种状态提供反证 → B人类可能延续很久 → B追问远期内容 → E介绍已有探索。<\/p>\n<p>最强候选是F，它也能支持乐观，但并没有问E所说的that question，而且A longer view, however针对的是C中近期预测的困难。用F会漏掉由生存前景转向研究实例的关键过渡。<\/p>\n<p><strong>最终答案：42填B。<\/strong><\/p>\n<h3>排序43题解析<\/h3>\n<p>当前空位位于已给E之后、44题之前。E以长远基金会说明one way of drawing thought beyond the immediate future；44题C将比较长短时间尺度。43题应补充另一种长期视角，并为比较建立明确尺度。<\/p>\n<p>E末尾的 one way 与G开头 Another way 配对，G中的 Like the foundation’s thinkers 进一步回指刚介绍的组织。G末尾引出 contrast ... much nearer future，C开头便说 lengthy timescales may ... be easier than ... immediate future。<\/p>\n<p>前端靠one/another的并列与foundation的明确回指连接；后端则从两个长时段实例转到长短预测难度比较。人类世不是随机插入的新名词，而是第二种把观察尺度拉远的研究。<\/p>\n<p>局部推进链：E基金会与千年钟 → G另举人类世地质视角 → G归纳很长的观察时段 → G转向较近未来 → C解释近未来复杂性。<\/p>\n<p>最强候选是C，它的such lengthy timescales也能接E。但若跳过G，G余下只能被塞到技术复杂性或历史模式之后，Another way及foundation便失去紧邻的并列对象，还会打断C→F的短长对照。<\/p>\n<p><strong>最终答案：43填G。<\/strong><\/p>\n<h3>排序44题解析<\/h3>\n<p>当前空位位于已确定的G之后、45题之前。G刚把长期研究同较近未来作对照，45题F将用however转向长期预测的依据。44题需要具体解释近期为什么难预测。<\/p>\n<p>G末尾提出 contrast with ... much nearer future；C开头直接比较 lengthy timescales 与 immediate future，随后解释技术与社会后果的复杂性。C末尾的 not ... every kind of forecast is equally uncertain 留出转折，F便以 A longer view, however 开始。<\/p>\n<p>前端是由预告的比较进入比较内容，后端通过however把近期困难转到长期可用的历史模式。Arc是短期可能性探索的例子，并没有证明长期同样无法预测。<\/p>\n<p>局部推进链：G提出长短尺度对照 → C解释近期技术复杂 → C探索多种可能 → C保留其他预测类型的空间 → F给出长期模式依据。<\/p>\n<p>最强候选是F，它也承接长视角，但however所反转的近期困难还未出现；若把F放在C前，就先解释“长期为什么可以”，再补“近期为什么困难”，破坏C末尾留给F的定向转折。<\/p>\n<p><strong>最终答案：44填C。<\/strong><\/p>\n<h3>排序45题解析<\/h3>\n<p>当前空位位于已确定的C之后、已给H之前。C已说明近期技术预测复杂，H将依据This long perspective给出乐观结论。45题应说明长远判断何以拥有证据和信心。<\/p>\n<p>C末尾说并非 every kind of forecast is equally uncertain；F用 A longer view, however 接住，给出long-term patterns和evidence-based forecasts。H首句 This long perspective再回指这一已说明依据的长期视角，并推进到对悲观论的评价。<\/p>\n<p>前端是对照转折，后端是this回指及论据到结论的提升。F把“拉远看”落实为识别历史模式，H的乐观才不仅是换个时间尺度的直觉，而有可解释的预测基础。<\/p>\n<p>局部推进链：C近期预测复杂 → F长期历史模式提供另一种依据 → F可对部分后代处境作有证据的判断 → H得出有保留的乐观并转向行动。<\/p>\n<p>最强候选是B，它也有支持乐观的证据，但Yet this gloom需要前文悲观判断，C讲的是复杂性而非物种灭绝前景；B末尾又提出what might ... hold，会重新打开E已经回答过的问题，无法自然收束到H。<\/p>\n<p><strong>最终答案：45填F。<\/strong><\/p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词<\/h2>\n<table>\n<thead>\n<tr>\n<th>可积累的主题表达<\/th>\n<th>中文翻译<\/th>\n<th>所属类别<\/th>\n<th>使用层级<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>optimism<\/strong><\/td>\n<td><strong>乐观<\/strong><\/td>\n<td><strong>人生哲理类<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>developing long-term plans<\/strong><\/td>\n<td><strong>制定长远计划<\/strong><\/td>\n<td><strong>人生哲理类<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>global thinking<\/td>\n<td>全局思维<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>critical thinking<\/td>\n<td>批判性思维<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>a thirst for knowledge<\/td>\n<td>求知欲<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>keeping pace with the times<\/td>\n<td>与时俱进<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>a sense of responsibility<\/td>\n<td>责任感<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>technological progress<\/strong><\/td>\n<td><strong>科技进步<\/strong><\/td>\n<td><strong>经济消费类<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>a rational view of new technology<\/td>\n<td>理性看待新科技<\/td>\n<td>社会现象类—科技经济<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>biological diversity<\/td>\n<td>生物多样性<\/td>\n<td>社会现象类—社会生活<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td>environmental protection<\/td>\n<td>环境保护<\/td>\n<td>环境保护类<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td>quality of life<\/td>\n<td>生活质量<\/td>\n<td>社会生活类<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>2. 大作文第一段描述题目信息时可积累的表达<\/h2>\n<table>\n<thead>\n<tr>\n<th>适用题型<\/th>\n<th>考试时可复用的形式<\/th>\n<th>中文翻译<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>图画题<\/strong><\/td>\n<td><strong>In the picture, A is taking a longer view of B.<\/strong><\/td>\n<td><strong>图画中，A正在从更长远的角度看待B。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The picture shows A and B expressing different visions of C’s future.<\/td>\n<td>图画展现了A和B对C的未来表达不同愿景。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>In the picture, A is examining the evidence before making a forecast about B.<\/td>\n<td>图画中，A正在考察证据，以便对B作出预测。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The picture depicts A planning for B while preparing for C.<\/td>\n<td>图画描绘了A在规划B的同时为C作准备的情景。<\/td>\n<\/tr>\n<tr>\n<td><strong>图表题<\/strong><\/td>\n<td><strong>The chart shows the long-term pattern of changes in A from B to C.<\/strong><\/td>\n<td><strong>图表显示了从B到C期间A变化的长期规律。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart compares the proportions of A who hold positive and negative views of B’s future.<\/td>\n<td>图表比较了A中对B的未来持积极看法和消极看法的人所占的比例。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart presents changes in the number of A exposed to B over the period from C to D.<\/td>\n<td>图表呈现了从C到D期间面临B的A的数量变化。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart compares A’s population in different periods.<\/td>\n<td>图表比较了A在不同时期的种群数量。<\/td>\n<\/tr>\n<tr>\n<td><strong>文本评论题<\/strong><\/td>\n<td><strong>The passage examines A’s future prospects in light of B.<\/strong><\/td>\n<td><strong>短文结合B考察了A的未来前景。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage contrasts an earlier vision of A with a more recent one.<\/td>\n<td>短文对比了人们早先对A的愿景与较近时期的愿景。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage describes how evidence from A is used to make forecasts about B.<\/td>\n<td>短文描述了来自A的证据如何被用于对B作出预测。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage discusses the possible development of A and its consequences for B.<\/td>\n<td>短文讨论了A可能的发展及其对B的影响。<\/td>\n<\/tr>\n<\/tbody><\/table>\n";
