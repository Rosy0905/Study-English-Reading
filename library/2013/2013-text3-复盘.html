manity, leading to lives of fulfilment and opportunity for all.<\/p>\n<p>人们相信科技将治愈弊病，并由此带来充实生活和人人有机会。<\/p>\n<\/blockquote>\n<p>这句话先提供实现美好未来的力量，再列出它能带来的生活图景，机会属于后面列出的内容。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A belief in equal opportunity inspired our earlier visions of the future.<\/p>\n<p>对机会平等的信念激发了我们过去的未来愿景。<\/p>\n<\/blockquote>\n<p>D所需的是机会信念与愿景之间的激发关系；实际写法是科技带来机会。两条关系可以在现实中并存，但原文只陈述了后一条，不能用共享<code>opportunity<\/code>替前一条补证据。<\/p>\n<\/section>"},{"title":"D. our belief in equal opportunity","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> The Ever-bright Prospects of Mankind  \n> 人类始终光明的前景\n\n把这个主旨直接代入31题题干：\n\n> 全文主旨只能确认作者看好人类的长期前景，不能单凭这一态度判断过去的乐观愿景具体由什么激发；还要分清第一段中信念的依据与期待的生活结果。\n\n但D实际说的是：\n\n> our belief in equal opportunity  \n> 我们对机会平等的信念\n\n机会平等可以属于光明前景的一部分，但全文主旨不能把愿景的内容自动变成其原因。本项最终仍要根据“leading to”判断：人人有机会是相信科技能解决问题之后所期待的结果，不是首段明写的信心来源。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[93,369,704,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":31,"option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q31-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>我们对机会平等的信念<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项是<code>our belief in [xxx] opportunity<\/code>，我们未读出机会的修饰语。仍能看见原文<code>opportunity for all<\/code>在<code>leading to<\/code>之后，属于科技解决弊病带来的结果；选项把对机会的信念当成愿景起因，因此第一轮排除D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p><code>equal opportunity<\/code>借用了<code>opportunity for all<\/code>，但选项不只是把“人人有机会”换一种说法。加上<code>our belief in<\/code>并接回题干后，它变成激发未来愿景的信念，而原文把机会放在科技改善生活的结果端。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>我们过去对未来的想象由我们对机会平等的信念激发。<\/p>\n<\/blockquote>\n<p>D的<code>opportunity<\/code>对应第一段第二句的<code>opportunity for all<\/code>，题干的<code>inspired by<\/code>则要求检查这一内容在原句中是否承担原因作用。<\/p>\n<p>原句以科学技术为主语，说它们将治愈弊病；<code>leading to<\/code>引出充实生活和人人有机会。这两项并列出现，都是当时人们相信科技可能带来的美好生活。<\/p>\n<p>即使允许<code>equal opportunity<\/code>概括人人有机会，名词内容接近也不足以证明整项。原文没有说机会平等的信念推动人们形成了过去的未来观。<\/p>\n<p>D把愿景中的一项结果改成愿景的激发来源，问题在因果位置，不在是否认识<code>equal<\/code>这个修饰语。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<p>人们相信科技将治愈弊病，并由此带来充实生活和人人有机会。<\/p>\n<\/blockquote>\n<p>这句话先提供实现美好未来的力量，再列出它能带来的生活图景，机会属于后面列出的内容。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>A belief in equal opportunity inspired our earlier visions of the future.<\/p>\n<p>对机会平等的信念激发了我们过去的未来愿景。<\/p>\n<\/blockquote>\n<p>D所需的是机会信念与愿景之间的激发关系；实际写法是科技带来机会。两条关系可以在现实中并存，但原文只陈述了后一条，不能用共享<code>opportunity<\/code>替前一条补证据。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者看好人类的长期前景，不能单凭这一态度判断过去的乐观愿景具体由什么激发；还要分清第一段中信念的依据与期待的生活结果。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>our belief in equal opportunity<br>我们对机会平等的信念<\/p>\n<\/blockquote>\n<p>机会平等可以属于光明前景的一部分，但全文主旨不能把愿景的内容自动变成其原因。本项最终仍要根据“leading to”判断：人人有机会是相信科技能解决问题之后所期待的结果，不是首段明写的信心来源。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"31题结论","raw":"### 31题结论\n\n> **31. B. our faith in science and technology**\n\nA借用了充实生活这个结果，却把对结果的愿望补成了未来观的原因。\n\nB把过去人们相信科技能解决弊病准确概括为对科技的信心。\n\nC借用了现在的风险认识，却把它搬成过去乐观愿景的来源。\n\nD借用了人人有机会，却把期待得到的结果改成激发愿景的信念。\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[18,18,1224,419],"sourceW":1452,"sourceH":2561},"meta":{"kind":"conclusion","question":31},"level":3,"html":"<blockquote>\n<p><strong>31. B. our faith in science and technology<\/strong><\/p>\n<\/blockquote>\n<p>A借用了充实生活这个结果，却把对结果的愿望补成了未来观的原因。<\/p>\n<p>B把过去人们相信科技能解决弊病准确概括为对科技的信心。<\/p>\n<p>C借用了现在的风险认识，却把它搬成过去乐观愿景的来源。<\/p>\n<p>D借用了人人有机会，却把期待得到的结果改成激发愿景的信念。<\/p>\n<hr>\n"},{"title":"32题 · 题干、题型与核心出处","raw":"## 32题\n\n> The IUCN’s “Red List” suggests that human beings are ______.\n>\n> IUCN“红色名录”表明人类是什么样的物种？\n\n### 题型\n\n具体细节题，要求概括IUCN“红色名录”给出的人类生存状态。应以名录对智人的评估为主，再用它前面关于长期存活的说明理解这项评估的作用。\n\n### 核心出处\n\n> Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.\n>\n> Look up Homo sapiens in the “Red List” of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.”\n\n`IUCN`和`Red List`把范围锁定在第三段末句。`Least Concern`是名录给出的分类，后面的分布广、适应性、数量增长和总体威胁情况解释分类依据；前一句说明这些材料支持人类有良好的长期生存机会。\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[18,542,1416,426],"sourceW":1452,"sourceH":2561},"meta":{"kind":"question","question":32},"level":2,"html":"<blockquote>\n<p>The IUCN’s “Red List” suggests that human beings are ______.<\/p>\n<p>IUCN“红色名录”表明人类是什么样的物种？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>具体细节题，要求概括IUCN“红色名录”给出的人类生存状态。应以名录对智人的评估为主，再用它前面关于长期存活的说明理解这项评估的作用。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<p>Look up Homo sapiens in the “Red List” of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.”<\/p>\n<\/blockquote>\n<p><code>IUCN<\/code>和<code>Red List<\/code>把范围锁定在第三段末句。<code>Least Concern<\/code>是名录给出的分类，后面的分布广、适应性、数量增长和总体威胁情况解释分类依据；前一句说明这些材料支持人类有良好的长期生存机会。<\/p>\n<hr>\n"},{"title":"A. a misplaced race","raw":"### A. a misplaced race\n\n> 一个位置不当的种族\n\n**做题模式中的状态：** 当时A完整显示；第三段开头是`But such [xxx] is misplaced`，虽然情绪名词被遮挡，我们仍从前后的悲观判断知道`misplaced`是在评价那种看法。再与名录的`Least Concern`比较，发现A把修饰对象换成人类，因此第一轮排除。\n\n**错误类型：第一类——歪曲原意。**\n\nA拿走第三段开头的`misplaced`，让它修饰`race`。原文被评为“不合适、错位”的是悲观情绪，人类则被名录列为无危；把同段中的形容词换一个修饰对象，判断就变了。\n\n**出处：**\n\n> But such gloominess is misplaced.\n>\n> Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,632,422,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q32-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>一个位置不当的种族<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示；第三段开头是<code>But such [xxx] is misplaced<\/code>，虽然情绪名词被遮挡，我们仍从前后的悲观判断知道<code>misplaced<\/code>是在评价那种看法。再与名录的<code>Least Concern<\/code>比较，发现A把修饰对象换成人类，因此第一轮排除。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A拿走第三段开头的<code>misplaced<\/code>，让它修饰<code>race<\/code>。原文被评为“不合适、错位”的是悲观情绪，人类则被名录列为无危；把同段中的形容词换一个修饰对象，判断就变了。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But such gloominess is misplaced.<\/p>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. a misplaced race","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> IUCN“红色名录”表明，人类是一个位置不当的种族。\n\n题干的`Red List`锁定第三段末尾，A的`misplaced`却来自本段开头。既要读这个词，也要读它究竟在评价谁。\n\n开头句子的主语是`such gloominess`，承接第二段对人类未来的悲观；末句名录的评估对象才是`Homo sapiens`，分类是`Least Concern`。\n\nA把“这种悲观是错位的”改成“人类这个种族位置不当”，又让这一判断成为名录的结论。修饰对象和信息来源都被更换。\n\n名录的分布、适应性与增长等指标是在说明生存状态，没有把人类称为一个位置不当的种族。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,632,422,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q32-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>一个位置不当的种族<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示；第三段开头是<code>But such [xxx] is misplaced<\/code>，虽然情绪名词被遮挡，我们仍从前后的悲观判断知道<code>misplaced<\/code>是在评价那种看法。再与名录的<code>Least Concern<\/code>比较，发现A把修饰对象换成人类，因此第一轮排除。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A拿走第三段开头的<code>misplaced<\/code>，让它修饰<code>race<\/code>。原文被评为“不合适、错位”的是悲观情绪，人类则被名录列为无危；把同段中的形容词换一个修饰对象，判断就变了。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But such gloominess is misplaced.<\/p>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>IUCN“红色名录”表明，人类是一个位置不当的种族。<\/p>\n<\/blockquote>\n<p>题干的<code>Red List<\/code>锁定第三段末尾，A的<code>misplaced<\/code>却来自本段开头。既要读这个词，也要读它究竟在评价谁。<\/p>\n<p>开头句子的主语是<code>such gloominess<\/code>，承接第二段对人类未来的悲观；末句名录的评估对象才是<code>Homo sapiens<\/code>，分类是<code>Least Concern<\/code>。<\/p>\n<p>A把“这种悲观是错位的”改成“人类这个种族位置不当”，又让这一判断成为名录的结论。修饰对象和信息来源都被更换。<\/p>\n<p>名录的分布、适应性与增长等指标是在说明生存状态，没有把人类称为一个位置不当的种族。<\/p>\n<\/section>"},{"title":"A. a misplaced race","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> But such gloominess is misplaced.\n>\n> Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.\n>\n> 作者先纠正悲观，随后肯定人类有良好的长期生存机会。\n\n两句推进相互支持：被质疑的是悲观判断，而人类被重新放到具有延续机会的位置上。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The IUCN’s Red List describes human beings as a misplaced race.\n>\n> IUCN红色名录把人类描述为一个位置不当的种族。\n\nA需要名录本身把`misplaced`归给人类；实际文章先用它否定悲观，再引用名录支持人类有良好生存条件。并不是给人类同一个负面标签后再展开说明。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,632,422,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q32-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>一个位置不当的种族<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示；第三段开头是<code>But such [xxx] is misplaced<\/code>，虽然情绪名词被遮挡，我们仍从前后的悲观判断知道<code>misplaced<\/code>是在评价那种看法。再与名录的<code>Least Concern<\/code>比较，发现A把修饰对象换成人类，因此第一轮排除。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A拿走第三段开头的<code>misplaced<\/code>，让它修饰<code>race<\/code>。原文被评为“不合适、错位”的是悲观情绪，人类则被名录列为无危；把同段中的形容词换一个修饰对象，判断就变了。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But such gloominess is misplaced.<\/p>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>IUCN“红色名录”表明，人类是一个位置不当的种族。<\/p>\n<\/blockquote>\n<p>题干的<code>Red List<\/code>锁定第三段末尾，A的<code>misplaced<\/code>却来自本段开头。既要读这个词，也要读它究竟在评价谁。<\/p>\n<p>开头句子的主语是<code>such gloominess<\/code>，承接第二段对人类未来的悲观；末句名录的评估对象才是<code>Homo sapiens<\/code>，分类是<code>Least Concern<\/code>。<\/p>\n<p>A把“这种悲观是错位的”改成“人类这个种族位置不当”，又让这一判断成为名录的结论。修饰对象和信息来源都被更换。<\/p>\n<p>名录的分布、适应性与增长等指标是在说明生存状态，没有把人类称为一个位置不当的种族。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>But such gloominess is misplaced.<\/p>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<p>作者先纠正悲观，随后肯定人类有良好的长期生存机会。<\/p>\n<\/blockquote>\n<p>两句推进相互支持：被质疑的是悲观判断，而人类被重新放到具有延续机会的位置上。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The IUCN’s Red List describes human beings as a misplaced race.<\/p>\n<p>IUCN红色名录把人类描述为一个位置不当的种族。<\/p>\n<\/blockquote>\n<p>A需要名录本身把<code>misplaced<\/code>归给人类；实际文章先用它否定悲观，再引用名录支持人类有良好生存条件。并不是给人类同一个负面标签后再展开说明。<\/p>\n<\/section>"},{"title":"A. a misplaced race","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> The Ever-bright Prospects of Mankind  \n> 人类始终光明的前景\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨指向人类仍有良好的长期前景，因此这里应说明人类具备延续的条件；名录到底列了什么指标、怎样界定人类，仍须由第三段的局部评估确认。\n\n但A实际说的是：\n\n> a misplaced race  \n> 一个位置不当的种族\n\nA把名录的评估对象判为位置不当，无法替本文说明人类长期前景的积极依据。不过关键仍在局部修饰关系：“such gloominess is misplaced”评价的是悲观情绪；名录给人类的分类是无危，二者不能互换。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,632,422,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q32-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>一个位置不当的种族<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示；第三段开头是<code>But such [xxx] is misplaced<\/code>，虽然情绪名词被遮挡，我们仍从前后的悲观判断知道<code>misplaced<\/code>是在评价那种看法。再与名录的<code>Least Concern<\/code>比较，发现A把修饰对象换成人类，因此第一轮排除。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A拿走第三段开头的<code>misplaced<\/code>，让它修饰<code>race<\/code>。原文被评为“不合适、错位”的是悲观情绪，人类则被名录列为无危；把同段中的形容词换一个修饰对象，判断就变了。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But such gloominess is misplaced.<\/p>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>IUCN“红色名录”表明，人类是一个位置不当的种族。<\/p>\n<\/blockquote>\n<p>题干的<code>Red List<\/code>锁定第三段末尾，A的<code>misplaced<\/code>却来自本段开头。既要读这个词，也要读它究竟在评价谁。<\/p>\n<p>开头句子的主语是<code>such gloominess<\/code>，承接第二段对人类未来的悲观；末句名录的评估对象才是<code>Homo sapiens<\/code>，分类是<code>Least Concern<\/code>。<\/p>\n<p>A把“这种悲观是错位的”改成“人类这个种族位置不当”，又让这一判断成为名录的结论。修饰对象和信息来源都被更换。<\/p>\n<p>名录的分布、适应性与增长等指标是在说明生存状态，没有把人类称为一个位置不当的种族。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>But such gloominess is misplaced.<\/p>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<p>作者先纠正悲观，随后肯定人类有良好的长期生存机会。<\/p>\n<\/blockquote>\n<p>两句推进相互支持：被质疑的是悲观判断，而人类被重新放到具有延续机会的位置上。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The IUCN’s Red List describes human beings as a misplaced race.<\/p>\n<p>IUCN红色名录把人类描述为一个位置不当的种族。<\/p>\n<\/blockquote>\n<p>A需要名录本身把<code>misplaced<\/code>归给人类；实际文章先用它否定悲观，再引用名录支持人类有良好生存条件。并不是给人类同一个负面标签后再展开说明。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨指向人类仍有良好的长期前景，因此这里应说明人类具备延续的条件；名录到底列了什么指标、怎样界定人类，仍须由第三段的局部评估确认。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>a misplaced race<br>一个位置不当的种族<\/p>\n<\/blockquote>\n<p>A把名录的评估对象判为位置不当，无法替本文说明人类长期前景的积极依据。不过关键仍在局部修饰关系：“such gloominess is misplaced”评价的是悲观情绪；名录给人类的分类是无危，二者不能互换。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. a sustained species","raw":"### B. a sustained species\n\n> 一个能够延续的物种\n\n**做题模式中的状态：** 当时B完整显示。即使名录中的适应性表达仍是`[xxx]`，我们已经读到人类有很好的长期存活机会、被列为`Least Concern`、数量增长等信息，因此第一轮保留B；本题其余选项排除后选B。\n\n**选项类型：正确跨句概括。**\n\nB用`a sustained species`概括名录列举的生存条件，并与引文前关于长期存活机会的判断相接。它描述能够延续的物种状态，不是把人类说成永远不会灭绝。\n\n**出处：**\n\n> Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.\n>\n> Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 B选项","focus":[93,720,462,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":32,"option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q32-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-B-0\"><blockquote>\n<p>一个能够延续的物种<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整显示。即使名录中的适应性表达仍是<code>[xxx]<\/code>，我们已经读到人类有很好的长期存活机会、被列为<code>Least Concern<\/code>、数量增长等信息，因此第一轮保留B；本题其余选项排除后选B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B用<code>a sustained species<\/code>概括名录列举的生存条件，并与引文前关于长期存活机会的判断相接。它描述能够延续的物种状态，不是把人类说成永远不会灭绝。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. a sustained species","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> IUCN“红色名录”表明，人类是一个能够延续的物种。\n\n`Red List`定位到第三段的正式评估，B的`sustained`要结合前面的`surviving`和名录具体指标理解，而不是另找完全相同的词。\n\n名录给出的分布广、适应性强、数量增长，以及没有导致总体种群下降的重大威胁，共同说明人类当前不处于严重生存危机中。引文前一句再将这类材料用于支持长期存活的良好机会。\n\n原文用`excellent chance`说明机会很好，仍保留可能性；说人类能够延续并不要求把它扩大为所有地区都无风险、种群数量永远增加或物种必定永久存在。\n\nB保留了评估所支持的物种延续方向，是对多项生存指标及其上下文的概括。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 B选项","focus":[93,720,462,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":32,"option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q32-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-B-0\"><blockquote>\n<p>一个能够延续的物种<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整显示。即使名录中的适应性表达仍是<code>[xxx]<\/code>，我们已经读到人类有很好的长期存活机会、被列为<code>Least Concern<\/code>、数量增长等信息，因此第一轮保留B；本题其余选项排除后选B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B用<code>a sustained species<\/code>概括名录列举的生存条件，并与引文前关于长期存活机会的判断相接。它描述能够延续的物种状态，不是把人类说成永远不会灭绝。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>IUCN“红色名录”表明，人类是一个能够延续的物种。<\/p>\n<\/blockquote>\n<p><code>Red List<\/code>定位到第三段的正式评估，B的<code>sustained<\/code>要结合前面的<code>surviving<\/code>和名录具体指标理解，而不是另找完全相同的词。<\/p>\n<p>名录给出的分布广、适应性强、数量增长，以及没有导致总体种群下降的重大威胁，共同说明人类当前不处于严重生存危机中。引文前一句再将这类材料用于支持长期存活的良好机会。<\/p>\n<p>原文用<code>excellent chance<\/code>说明机会很好，仍保留可能性；说人类能够延续并不要求把它扩大为所有地区都无风险、种群数量永远增加或物种必定永久存在。<\/p>\n<p>B保留了评估所支持的物种延续方向，是对多项生存指标及其上下文的概括。<\/p>\n<\/section>"},{"title":"B. a sustained species","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.\n>\n> Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.\n>\n> 前文提出人类有良好的长期存活机会，名录再以无危分类和多项生存指标支撑。\n\n文章先提出长期生存的判断，再引用现有评估给它提供依据，论点与引文的方向一致。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The Red List’s assessment indicates that humans are a species capable of continued survival.\n>\n> 红色名录的评估表明，人类是能够继续生存的物种。\n\nB需要的只是生存条件支持延续，原文名录中的分布、适应性和种群趋势能够满足这一点；前一句的良好存活机会进一步说明这些指标被作者拿来支持什么。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 B选项","focus":[93,720,462,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":32,"option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q32-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-B-0\"><blockquote>\n<p>一个能够延续的物种<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整显示。即使名录中的适应性表达仍是<code>[xxx]<\/code>，我们已经读到人类有很好的长期存活机会、被列为<code>Least Concern<\/code>、数量增长等信息，因此第一轮保留B；本题其余选项排除后选B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>B用<code>a sustained species<\/code>概括名录列举的生存条件，并与引文前关于长期存活机会的判断相接。它描述能够延续的物种状态，不是把人类说成永远不会灭绝。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.<\/p>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<\/sectio >"},{"title":"C. the world’s dominant power","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.\n>\n> 列举分布、适应性、数量和威胁情况，解释人类为什么被列为无危。\n\n引文围绕人类是否受到导致整体衰退的威胁展开，没有转入人类相对其他生物或力量处于何种地位。\n\n如果C真是作者的意思，文章至少得写成：\n\n> The Red List identifies humans as the dominant power in the world.\n>\n> 红色名录把人类认定为世界的主导力量。\n\nC所需的是名录作出主导地位判断；实际引文只给出种群生存评估。作者随后转问深远未来，也没有把“能够存续”继续解释成“支配世界”。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 C选项","focus":[94,807,650,69],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":32,"option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q32-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>世界的主导力量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们发现它容易使人从名录的分布广、数量增长联想到支配世界，但名录说的是受威胁程度和生存状态，没有给出主导地位，因此第一轮排除C。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用了人类分布广、数量增长这些指标，诱导人再补出“因此成为世界主导力量”。数量与分布说明生存状况，并未建立人类支配其他力量的关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>IUCN“红色名录”表明，人类是世界的主导力量。<\/p>\n<\/blockquote>\n<p>C的<code>world’s<\/code>容易让人注意第三段的<code>very widely distributed<\/code>，但题干要的是名录实际支持的判断，不能把空间范围误读成力量排序。<\/p>\n<p>名录说人类分布广、适应性强、种群正在增长，并且没有导致总体数量下降的重大威胁。这些内容共同用于解释为什么列为无危。<\/p>\n<p>主导力量需要涉及对其他力量的相对优势或控制作用，而名录没有进行这类比较。分布广与占据主导地位在现实中可以相关，但一个并不自动推出另一个。<\/p>\n<p>C由生存指标额外补出支配世界的关系，超出了这段名录评估给出的命题。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\ onment  \n> 对环境的威胁\n\n人类长期前景好与人类是否威胁环境并非简单反义，所以不能凭主旨独自否定D。局部引文“no major threats resulting in an overall population decline”是在说明人类自身的受威胁状态，D却把人类放在威胁的发出端。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[93,891,635,77],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q32-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>对环境的威胁<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项显示为<code>a threat to the [xxx]<\/code>，威胁的对象尚未读出。我们仍能判断选项让人类成为威胁的发出者，而名录在评估是否有威胁造成人类种群下降，因而第一轮排除D，没有等遮挡词恢复才作判断。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了名录中的<code>threats<\/code>，却把关系方向倒转：原文评估作用于人类总体种群的威胁，选项改成人类对环境构成威胁。名录并未在这段给出后一判断。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>IUCN“红色名录”表明，人类是对环境的威胁。<\/p>\n<\/blockquote>\n<p>题干明确要求看名录，D的<code>threat<\/code>对应引文尾部的<code>no major threats resulting in an overall population decline<\/code>。决定答案的是威胁指向谁，不只是同一个词有没有出现。<\/p>\n<p>引文中的<code>the species<\/code>指人类，<code>an overall population decline<\/code>是人类总体种群下降。原文说没有重大威胁正在造成这种下降，服务于人类被列为无危的判断。<\/p>\n<p>D让人类充当威胁源，把环境当作受影响对象。人类自身的受威胁程度与人类是否损害环境，是两条不同关系，前者不能证明后者。<\/p>\n<p>D把评估人类遭受的威胁改成评估人类发出的威胁，更换了关系中的主体与对象。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.<\/p>\n<p>名录用没有导致人类总体数量下降的重大威胁，解释人类的无危状态。<\/p>\n<\/blockquote>\n<p>各项指标始终围绕人类这一物种的存续条件，没有将人类行为对其他系统的影响设为讨论对象。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The Red List describes human beings as a threat to the environment.<\/p>\n<p>红色名录把人类描述为对环境的威胁。<\/p>\n<\/blockquote>\n<p>D至少需要名录评价人类对环境的影响。实际引文评价人类是否因重大威胁而总体减少；即使两类问题都可以讨论，也不能把其中一个作为另一个的证据。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨指向人类仍有良好的长期前景，因此这里应说明人类具备延续的条件；名录到底列了什么指标、怎样界定人类，仍须由第三段的局部评估确认。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>a threat to the environment<br>对环境的威胁<\/p>\n<\/blockquote>\n<p>人类长期前景好与人类是否威胁环境并非简单反义，所以不能凭主旨独自否定D。局部引文“no major threats resulting in an overall population decline”是在说明人类自身的受威胁状态，D却把人类放在威胁的发出端。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"32题结论","raw":"### 32题结论\n\n> **32. B. a sustained species**\n\nA把修饰悲观情绪的misplaced移到人类身上。\n\nB把名录的生存指标及前文的长期存活机会概括为物种能够延续。\n\nC从分布广和数量增长脑补了支配世界的地位。\n\nD把人类是否受到威胁，倒换成人类是否威胁环境。\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[18,542,1416,426],"sourceW":1452,"sourceH":2561},"meta":{"kind":"conclusion","question":32},"level":3,"html":"<blockquote>\n<p><strong>32. B. a sustained species<\/strong><\/p>\n<\/blockquote>\n<p>A把修饰悲观情绪的misplaced移到人类身上。<\/p>\n<p>B把名录的生存指标及前文的长期存活机会概括为物种能够延续。<\/p>\n<p>C从分布广和数量增长脑补了支配世界的地位。<\/p>\n<p>D把人类是否受到威胁，倒换成人类是否威胁环境。<\/p>\n<hr>\n"},{"title":"33题 · 题干、题型与核心出处","raw":"## 33题\n\n> Which of the following is true according to Paragraph 5?\n>\n> 根据第五段，下面哪项正确？\n\n### 题型\n\n具体细节题，题干将证据范围限定为第五段。要逐项核对该段实际判断的对象、动作和难易关系，不能把别段出现的相关话题移来充当本段结论。\n\n### 核心出处\n\n> Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future. The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage. That’s one reason why we have launched Arc, a new publication dedicated to the near future.\n\n`Paragraph 5`要求读全第五段。首句比较长期与近期未来的思考难度，第二句说明技术演变和社会后果复杂，第三句交代Arc这份刊物关注近期未来。三句依次提供难度判断、原因和由此引出的探索。\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[18,1071,1259,409],"sourceW":1452,"sourceH":2561},"meta":{"kind":"question","question":33},"level":2,"html":"<blockquote>\n<p>Which of the following is true according to Paragraph 5?<\/p>\n<p>根据第五段，下面哪项正确？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>具体细节题，题干将证据范围限定为第五段。要逐项核对该段实际判断的对象、动作和难易关系，不能把别段出现的相关话题移来充当本段结论。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future. The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage. That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<p><code>Paragraph 5<\/code>要求读全第五段。首句比较长期与近期未来的思考难度，第二句说明技术演变和社会后果复杂，第三句交代Arc这份刊物关注近期未来。三句依次提供难度判断、原因和由此引出的探索。<\/p>\n<hr>\n"},{"title":"A. The interest in science fiction is on the rise.","raw":"### A. The interest in science fiction is on the rise.\n\n> 人们对科幻的兴趣正在上升。\n\n**做题模式中的状态：** 当时A完整显示。我们读到第五段让科幻作家探索复杂未来，比较后发现这只是探索任务由谁承担，不能说明公众兴趣随时间上升，所以第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\nA借用`science fiction writers`中的科幻话题，再补出对科幻的兴趣正在增加。原文谈的是谁适合探索未来的多种可能，没有给出兴趣程度的前后比较。\n\n**出处：**\n\n> The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.\n>\n> That’s one reason why we have launched Arc, a new publication dedicated to the near future.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1158,982,58],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q33-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>人们对科幻的兴趣正在上升。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示。我们读到第五段让科幻作家探索复杂未来，比较后发现这只是探索任务由谁承担，不能说明公众兴趣随时间上升，所以第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借用<code>science fiction writers<\/code>中的科幻话题，再补出对科幻的兴趣正在增加。原文谈的是谁适合探索未来的多种可能，没有给出兴趣程度的前后比较。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. The interest in science fiction is on the rise.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第五段，人们对科幻的兴趣正在上升。\n\n`according to Paragraph 5`限定本段，A的`science fiction`对应第二句的`science fiction writers`。两处共享话题，但选项新增的`interest`和`on the rise`同样需要依据。\n\n第二句说技术演变及社会后果十分复杂，因此或许最好由科幻作家和未来学家探索各种可能；第三句再介绍为讨论近期未来而创办的Arc。\n\n作者安排谁来探索，交代的是人员角色；兴趣上升则需要比较人们以前与现在对科幻的兴趣。出现作家或推出刊物，可以令人联想需求，却不能替代这种趋势证据。\n\nA从探索者身份补出了公众兴趣增长，第五段没有表达这一完整趋势。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1158,982,58],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q33-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>人们对科幻的兴趣正在上升。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示。我们读到第五段让科幻作家探索复杂未来，比较后发现这只是探索任务由谁承担，不能说明公众兴趣随时间上升，所以第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借用<code>science fiction writers<\/code>中的科幻话题，再补出对科幻的兴趣正在增加。原文谈的是谁适合探索未来的多种可能，没有给出兴趣程度的前后比较。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第五段，人们对科幻的兴趣正在上升。<\/p>\n<\/blockquote>\n<p><code>according to Paragraph 5<\/code>限定本段，A的<code>science fiction<\/code>对应第二句的<code>science fiction writers<\/code>。两处共享话题，但选项新增的<code>interest<\/code>和<code>on the rise<\/code>同样需要依据。<\/p>\n<p>第二句说技术演变及社会后果十分复杂，因此或许最好由科幻作家和未来学家探索各种可能；第三句再介绍为讨论近期未来而创办的Arc。<\/p>\n<p>作者安排谁来探索，交代的是人员角色；兴趣上升则需要比较人们以前与现在对科幻的兴趣。出现作家或推出刊物，可以令人联想需求，却不能替代这种趋势证据。<\/p>\n<p>A从探索者身份补出了公众兴趣增长，第五段没有表达这一完整趋势。<\/p>\n<\/section>"},{"title":"A. The interest in science fiction is on the rise.","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.\n>\n> That’s one reason why we have launched Arc, a new publication dedicated to the near future.\n>\n> 复杂未来值得由科幻作家和未来学家探索，这也是创办关注近期未来的Arc的原因之一。\n\n后句沿着“近期未来复杂→需要进一步探索”推进，把刊物当成开展讨论的安排。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Interest in science fiction has grown as more people seek to imagine the near future.\n>\n> 随着更多人寻求想象近期未来，人们对科幻的兴趣增长了。\n\nA成立至少需要明确写出兴趣出现增长。原文解释的是探索任务和刊物主题，未把这些安排写成兴趣上升的表现，也没有比较前后兴趣。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1158,982,58],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q33-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>人们对科幻的兴趣正在上升。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示。我们读到第五段让科幻作家探索复杂未来，比较后发现这只是探索任务由谁承担，不能说明公众兴趣随时间上升，所以第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借用<code>science fiction writers<\/code>中的科幻话题，再补出对科幻的兴趣正在增加。原文谈的是谁适合探索未来的多种可能，没有给出兴趣程度的前后比较。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第五段，人们对科幻的兴趣正在上升。<\/p>\n<\/blockquote>\n<p><code>according to Paragraph 5<\/code>限定本段，A的<code>science fiction<\/code>对应第二句的<code>science fiction writers<\/code>。两处共享话题，但选项新增的<code>interest<\/code>和<code>on the rise<\/code>同样需要依据。<\/p>\n<p>第二句说技术演变及社会后果十分复杂，因此或许最好由科幻作家和未来学家探索各种可能；第三句再介绍为讨论近期未来而创办的Arc。<\/p>\n<p>作者安排谁来探索，交代的是人员角色；兴趣上升则需要比较人们以前与现在对科幻的兴趣。出现作家或推出刊物，可以令人联想需求，却不能替代这种趋势证据。<\/p>\n<p>A从探索者身份补出了公众兴趣增长，第五段没有表达这一完整趋势。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<p>复杂未来值得由科幻作家和未来学家探索，这也是创办关注近期未来的Arc的原因之一。<\/p>\n<\/blockquote>\n<p>后句沿着“近期未来复杂→需要进一步探索”推进，把刊物当成开展讨论的安排。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Interest in science fiction has grown as more people seek to imagine the near future.<\/p>\n<p>随着更多人寻求想象近期未来，人们对科幻的兴趣增长了。<\/p>\n<\/blockquote>\n<p>A成立至少需要明确写出兴趣出现增长。原文解释的是探索任务和刊物主题，未把这些安排写成兴趣上升的表现，也没有比较前后兴趣。<\/p>\n<\/section>"},{"title":"A. The interest in science fiction is on the rise.","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> The Ever-bright Prospects of Mankind  \n> 人类始终光明的前景\n\n把这个主旨直接代入33题题干：\n\n> 全文主旨只能确认作者总体看好长期前景，不能判断第五段中的兴趣趋势、刊物作用、技术用途或具体难易比较；这些局部命题必须逐项以第五段为依据。\n\n但A实际说的是：\n\n> The interest in science fiction is on the rise.  \n> 人们对科幻的兴趣正在上升。\n\n科幻兴趣上升既不能由人类前景光明推出，也不必与它冲突。本项最终仍要根据“best left to science fiction writers”判断：原句交代探索任务适合由谁承担，并没有关于公众兴趣变化的陈述。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1158,982,58],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q33-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>人们对科幻的兴趣正在上升。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示。我们读到第五段让科幻作家探索复杂未来，比较后发现这只是探索任务由谁承担，不能说明公众兴趣随时间上升，所以第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借用<code>science fiction writers<\/code>中的科幻话题，再补出对科幻的兴趣正在增加。原文谈的是谁适合探索未来的多种可能，没有给出兴趣程度的前后比较。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"f udies.","raw":"### B. Arc helps limit the scope of futurological studies.\n\n> Arc有助于限制未来学研究的范围。\n\n**做题模式中的状态：** 当时选项为`Arc helps limit the scope of [xxx] studies`，研究类别仍被遮挡。我们已经看出原句只说Arc专门讨论近期未来，并不等于刊物限制研究范围，因此第一轮排除B，后续未改变状态。\n\n**错误类型：第一类——歪曲原意。**\n\nB把`dedicated to the near future`给刊物规定的主题，改成`helps limit the scope`所宣称的研究作用。刊物选择关注近期未来，与它对未来学研究范围施加限制，并不是同一件事。\n\n**出处：**\n\n> The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.\n>\n> That’s one reason why we have launched Arc, a new publication dedicated to the near future.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 B选项","focus":[93,1246,1083,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":33,"option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q33-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>Arc有助于限制未来学研究的范围。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项为<code>Arc helps limit the scope of [xxx] studies<\/code>，研究类别仍被遮挡。我们已经看出原句只说Arc专门讨论近期未来，并不等于刊物限制研究范围，因此第一轮排除B，后续未改变状态。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B把<code>dedicated to the near future<\/code>给刊物规定的主题，改成<code>helps limit the scope<\/code>所宣称的研究作用。刊物选择关注近期未来，与它对未来学研究范围施加限制，并不是同一件事。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. Arc helps limit the scope of futurological studies.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 根据第五段，Arc有助于限制未来学研究的范围。\n\n`Arc`定位到第五段末句，`futurological`与前句的`futurologists`相关。应把这两处连起来看，同时检查`helps limit`这一作用是否被原文建立。\n\n前句说未来学家可以探索技术演变及社会后果的多种可能，末句把Arc说明为一份专注近期未来的新刊物，创办原因之一就是这个领域值得探索。\n\n一份刊物有自己的时间和主题范围，并不等于它使未来学研究的范围缩小。原文没有将刊物的主题选择转述为对这类研究产生限制的效果。\n\nB把“Arc自身关注什么”改成“Arc使某类研究受到什么影响”，更换了范围限定的对象与作用关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 B选项","focus":[93,1246,1083,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q33-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>Arc有助于限制未来学研究的范围。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项为<code>Arc helps limit the scope of [xxx] studies<\/code>，研究类别仍被遮挡。我们已经看出原句只说Arc专门讨论近期未来，并不等于刊物限制研究范围，因此第一轮排除B，后续未改变状态。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B把<code>dedicated to the near future<\/code>给刊物规定的主题，改成<code>helps limit the scope<\/code>所宣称的研究作用。刊物选择关注近期未来，与它对未来学研究范围施加限制，并不是同一件事。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第五段，Arc有助于限制未来学研究的范围。<\/p>\n<\/blockquote>\n<p><code>Arc<\/code>定位到第五段末句，<code>futurological<\/code>与前句的<code>futurologists<\/code>相关。应把这两处连起来看，同时检查<code>helps limit<\/code>这一作用是否被原文建立。<\/p>\n<p>前句说未来学家可以探索技术演变及社会后果的多种可能，末句把Arc说明为一份专注近期未来的新刊物，创办原因之一就是这个领域值得探索。<\/p>\n<p>一份刊物有自己的时间和主题范围，并不等于它使未来学研究的范围缩小。原文没有将刊物的主题选择转述为对这类研究产生限制的效果。<\/p>\n<p>B把“Arc自身关注什么”改成“Arc使某类研究受到什么影响”，更换了范围限定的对象与作用关系。<\/p>\n<\/section>"},{"title":"B. Arc helps limit the scope of futurological studies.","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.\n>\n> That’s one reason why we have launched Arc, a new publication dedicated to the near future.\n>\n> 先提出探索可设想的多种可能，再介绍一份专门讨论近期未来的刊物。\n\nArc承接的是开展探索的需要；作者用它说明自己怎样参与这一讨论。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Arc helps narrow the scope of futurological studies by concentrating research on the near future.\n>\n> Arc通过把研究集中到近期未来，有助于缩小未来学研究的范围。\n\nB所需的写法要让Arc的关注方向实际影响研究范围，程度只需达到“有助于”，无需声称它控制全部研究。原文仅交代刊物主题，并未建立这一限制作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 B选项","focus":[93,1246,1083,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q33-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>Arc有助于限制未来学研究的范围。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项为<code>Arc helps limit the scope of [xxx] studies<\/code>，研究类别仍被遮挡。我们已经看出原句只说Arc专门讨论近期未来，并不等于刊物限制研究范围，因此第一轮排除B，后续未改变状态。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B把<code>dedicated to the near future<\/code>给刊物规定的主题，改成<code>helps limit the scope<\/code>所宣称的研究作用。刊物选择关注近期未来，与它对未来学研究范围施加限制，并不是同一件事。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart \/p>\n<\/blockquote>\n<p>Arc承接的是开展探索的需要；作者用它说明自己怎样参与这一讨论。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Arc helps narrow the scope of futurological studies by concentrating research on the near future.<\/p>\n<p>Arc通过把研究集中到近期未来，有助于缩小未来学研究的范围。<\/p>\n<\/blockquote>\n<p>B所需的写法要让Arc的关注方向实际影响研究范围，程度只需达到“有助于”，无需声称它控制全部研究。原文仅交代刊物主题，并未建立这一限制作用。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者总体看好长期前景，不能判断第五段中的兴趣趋势、刊物作用、技术用途或具体难易比较；这些局部命题必须逐项以第五段为依据。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>Arc helps limit the scope of futurological studies.<br>Arc有助于限制未来学研究的范围。<\/p>\n<\/blockquote>\n<p>看好人类长期前景并不能判断一份刊物是否限制研究范围。本项最终仍要根据“a new publication dedicated to the near future”判断：它说明Arc的定位，B却让这一定位产生约束未来学研究的作用。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. Technology offers solutions to social problems.","raw":"### C. Technology offers solutions to social problems.\n\n> 技术为社会问题提供解决方案。\n\n**做题模式中的状态：** 当时C完整显示。我们把它与第五段技术演变及社会后果复杂、需要探索的写法比较，发现本段并没有把技术的作用概括为解决社会问题，因此第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\nC借用`technology`和`social consequences`，把技术与社会之间复杂的后果关系改成提供解决方案的关系。第五段实际要解释的是近期未来为什么难以设想，不是确认技术具有怎样的社会问题解决功能。\n\n**出处：**\n\n> The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 C选项","focus":[94,1334,1037,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":33,"option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q33-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>技术为社会问题提供解决方案。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们把它与第五段技术演变及社会后果复杂、需要探索的写法比较，发现本段并没有把技术的作用概括为解决社会问题，因此第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用<code>technology<\/code>和<code>social consequences<\/code>，把技术与社会之间复杂的后果关系改成提供解决方案的关系。第五段实际要解释的是近期未来为什么难以设想，不是确认技术具有怎样的社会问题解决功能。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. Technology offers solutions to social problems.","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 根据第五段，技术为社会问题提供解决方案。\n\n题干限定第五段，C中的`Technology`对应第二句的`today’s technology`，`social problems`容易使人联想到`social consequences`，但问题与后果不能直接替换。\n\n原句同时讨论技术的潜在演变及其社会后果，并把它们评价为极其复杂，需要探索各种可设想的可能。它没有在这些后果中明确建立“技术解决社会问题”这条判断。\n\nC并未说技术可以解决所有问题，因此不能靠给它添上“全部”来排除。即使只说技术提供某些方案，仍需本段有这类功能的陈述；仅有复杂社会后果不足以推出解决作用。\n\nC改变了第五段技术与社会之间所写的关系：由复杂、待探索的后果，换成了提供解决办法。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 C选项","focus":[94,1334,1037,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q33-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>技术为社会问题提供解决方案。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们把它与第五段技术演变及社会后果复杂、需要探索的写法比较，发现本段并没有把技术的作用概括为解决社会问题，因此第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用<code>technology<\/code>和<code>social consequences<\/code>，把技术与社会之间复杂的后果关系改成提供解决方案的关系。第五段实际要解释的是近期未来为什么难以设想，不是确认技术具有怎样的社会问题解决功能。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第五段，技术为社会问题提供解决方案。<\/p>\n<\/blockquote>\n<p>题干限定第五段，C中的<code>Technology<\/code>对应第二句的<code>today’s technology<\/code>，<code>social problems<\/code>容易使人联想到<code>social consequences<\/code>，但问题与后果不能直接替换。<\/p>\n<p>原句同时讨论技术的潜在演变及其社会后果，并把它们评价为极其复杂，需要探索各种可设想的可能。它没有在这些后果中明确建立“技术解决社会问题”这条判断。<\/p>\n<p>C并未说技术可以解决所有问题，因此不能靠给它添上“全部”来排除。即使只说技术提供某些方案，仍需本段有这类功能的陈述；仅有复杂社会后果不足以推出解决作用。<\/p>\n<p>C改变了第五段技术与社会之间所写的关系：由复杂、待探索的后果，换成了提供解决办法。<\/p>\n<\/section>"},{"title":"C. Technology offers solutions to social problems.","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.\n>\n> That’s one reason why we have launched Arc, a new publication dedicated to the near future.\n>\n> 技术变化及社会后果复杂，因此需要探索，Arc也被用于讨论近期未来。\n\n从复杂性引出探索，说明作者此处是在交代预测为何困难以及怎样展开讨论。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Technology provides ways of addressing social problems.\n>\n> 技术提供应对社会问题的办法。\n\nC成立至少需要写出技术具有解决社会问题的作用，不要求作者宣称技术无所不能。实际句子把社会后果作为需要探索的对象，随后继续谈刊物，并没有写出这一作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 C选项","focus":[94,1334,1037,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q33-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>技术为社会问题提供解决方案。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们把它与第五段技术演变及社会后果复杂、需要探索的写法比较，发现本段并没有把技术的作用概括为解决社会问题，因此第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用<code>technology<\/code>和<code>social consequences<\/co  offers solutions to social problems.  \n> 技术为社会问题提供解决方案。\n\n积极的长期前景可以与技术帮助人类相容，但不能因此把这一命题补进第五段。本项最终仍要根据“its social consequences”及“dazzlingly complicated”判断：它们描述复杂性，没有把技术概括为社会问题的解决方案。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 C选项","focus":[94,1334,1037,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q33-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-C-0\"><blockquote>\n<p>技术为社会问题提供解决方案。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们把它与第五段技术演变及社会后果复杂、需要探索的写法比较，发现本段并没有把技术的作用概括为解决社会问题，因此第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用<code>technology<\/code>和<code>social consequences<\/code>，把技术与社会之间复杂的后果关系改成提供解决方案的关系。第五段实际要解释的是近期未来为什么难以设想，不是确认技术具有怎样的社会问题解决功能。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第五段，技术为社会问题提供解决方案。<\/p>\n<\/blockquote>\n<p>题干限定第五段，C中的<code>Technology<\/code>对应第二句的<code>today’s technology<\/code>，<code>social problems<\/code>容易使人联想到<code>social consequences<\/code>，但问题与后果不能直接替换。<\/p>\n<p>原句同时讨论技术的潜在演变及其社会后果，并把它们评价为极其复杂，需要探索各种可设想的可能。它没有在这些后果中明确建立“技术解决社会问题”这条判断。<\/p>\n<p>C并未说技术可以解决所有问题，因此不能靠给它添上“全部”来排除。即使只说技术提供某些方案，仍需本段有这类功能的陈述；仅有复杂社会后果不足以推出解决作用。<\/p>\n<p>C改变了第五段技术与社会之间所写的关系：由复杂、待探索的后果，换成了提供解决办法。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<p>技术变化及社会后果复杂，因此需要探索，Arc也被用于讨论近期未来。<\/p>\n<\/blockquote>\n<p>从复杂性引出探索，说明作者此处是在交代预测为何困难以及怎样展开讨论。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Technology provides ways of addressing social problems.<\/p>\n<p>技术提供应对社会问题的办法。<\/p>\n<\/blockquote>\n<p>C成立至少需要写出技术具有解决社会问题的作用，不要求作者宣称技术无所不能。实际句子把社会后果作为需要探索的对象，随后继续谈刊物，并没有写出这一作用。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者总体看好长期前景，不能判断第五段中的兴趣趋势、刊物作用、技术用途或具体难易比较；这些局部命题必须逐项以第五段为依据。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>Technology offers solutions to social problems.<br>技术为社会问题提供解决方案。<\/p>\n<\/blockquote>\n<p>积极的长期前景可以与技术帮助人类相容，但不能因此把这一命题补进第五段。本项最终仍要根据“its social consequences”及“dazzlingly complicated”判断：它们描述复杂性，没有把技术概括为社会问题的解决方案。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. Our immediate future is hard to conceive.","raw":"### D. Our immediate future is hard to conceive.\n\n> 我们的近期未来很难设想。\n\n**做题模式中的状态：** 当时D完整显示；第五段首句虽有`[xxx]`，但`easier to think about ... than about the more immediate future`的比较关系完整保留。我们读到长期反而更容易思考，再接上后句的复杂性，第一轮保留D；其余选项排除后选D。\n\n**选项类型：正确跨句概括。**\n\nD把首句长期与近期未来的难易比较，连同后句对技术及社会后果复杂性的说明，概括成近期未来难以设想。它说的是困难，不是断言人类完全不能思考近期未来。\n\n**出处：**\n\n> Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future.\n>\n> The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[93,1421,933,59],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q33-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>我们的近期未来很难设想。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示；第五段首句虽有<code>[xxx]<\/code>，但<code>easier to think about ... than about the more immediate future<\/code>的比较关系完整保留。我们读到长期反而更容易思考，再接上后句的复杂性，第一轮保留D；其余选项排除后选D。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>D把首句长期与近期未来的难易比较，连同后句对技术及社会后果复杂性的说明，概括成近期未来难以设想。它说的是困难，不是断言人类完全不能思考近期未来。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future.<\/p>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. Our immediate future is hard to conceive.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据第五段，我们的近期未来很难设想。\n\nD的`immediate future`对应首句`the more immediate future`，`hard to conceive`需要结合`easier to think about`的比较及后句的`dazzlingly complicated`理解。\n\n首句说思考漫长时间尺度可能比思考更近的未来容易，表明近期这一侧更难处理；第二句说明原因在于技术演变和社会后果极其复杂。\n\n只有比较更难，未必单独足以说明绝对难度很大；这里第二句的复杂性说明补足了判断。`hard`保留困难程度，没有把它说成不能探索或无法想象任何可能。\n\nD将两句共同表达的近期预测难度概括出来，时间对象和难易方向都与第五段一致。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[93,1421,933,59],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q33-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>我们的近期未来很难设想。<\/p>\n<\/blockquote>\n< chnological change and its social consequences are so complicated, the immediate future is difficult to envisage.\n>\n> 由于技术变化及其社会后果十分复杂，近期未来很难设想。\n\nD需要的“复杂性→近期难设想”就是原文已有的推进。Arc的存在也没有推翻这种困难，只说明作者用刊物继续探索，而不是近期未来已经容易预测。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[93,1421,933,59],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q33-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>我们的近期未来很难设想。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示；第五段首句虽有<code>[xxx]<\/code>，但<code>easier to think about ... than about the more immediate future<\/code>的比较关系完整保留。我们读到长期反而更容易思考，再接上后句的复杂性，第一轮保留D；其余选项排除后选D。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>D把首句长期与近期未来的难易比较，连同后句对技术及社会后果复杂性的说明，概括成近期未来难以设想。它说的是困难，不是断言人类完全不能思考近期未来。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future.<\/p>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第五段，我们的近期未来很难设想。<\/p>\n<\/blockquote>\n<p>D的<code>immediate future<\/code>对应首句<code>the more immediate future<\/code>，<code>hard to conceive<\/code>需要结合<code>easier to think about<\/code>的比较及后句的<code>dazzlingly complicated<\/code>理解。<\/p>\n<p>首句说思考漫长时间尺度可能比思考更近的未来容易，表明近期这一侧更难处理；第二句说明原因在于技术演变和社会后果极其复杂。<\/p>\n<p>只有比较更难，未必单独足以说明绝对难度很大；这里第二句的复杂性说明补足了判断。<code>hard<\/code>保留困难程度，没有把它说成不能探索或无法想象任何可能。<\/p>\n<p>D将两句共同表达的近期预测难度概括出来，时间对象和难易方向都与第五段一致。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future.<\/p>\n<p>The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.<\/p>\n<p>That’s one reason why we have launched Arc, a new publication dedicated to the near future.<\/p>\n<p>先比较长期和近期未来，再解释近期技术与社会变化复杂，最后介绍关注近期未来的新刊物。<\/p>\n<\/blockquote>\n<p>首句提出难度差异，后句解释困难，末句说明仍要围绕近期未来开展探索；困难与可以讨论并不冲突。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Because technological change and its social consequences are so complicated, the immediate future is difficult to envisage.<\/p>\n<p>由于技术变化及其社会后果十分复杂，近期未来很难设想。<\/p>\n<\/blockquote>\n<p>D需要的“复杂性→近期难设想”就是原文已有的推进。Arc的存在也没有推翻这种困难，只说明作者用刊物继续探索，而不是近期未来已经容易预测。<\/p>\n<\/section>"},{"title":"D. Our immediate future is hard to conceive.","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> The Ever-bright Prospects of Mankind  \n> 人类始终光明的前景\n\n把这个主旨直接代入33题题干：\n\n> 全文主旨只能确认作者总体看好长期前景，不能判断第五段中的兴趣趋势、刊物作用、技术用途或具体难易比较；这些局部命题必须逐项以第五段为依据。\n\nD实际说的是：\n\n> Our immediate future is hard to conceive.  \n> 我们的近期未来很难设想。\n\n长期前景积极与近期未来难以设想可以同时成立；文章在保持前者时承认后者。本项的具体判断仍由第五段的难易比较和复杂性说明给出，D准确保留这项局部限制，没有把它扩大成所有未来都不可知。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[93,1421,933,59],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q33-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>我们的近期未来很难设想。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D完整显示；第五段首句虽有<code>[xxx]<\/code>，但<code>easier to think about ... than about the more immediate future<\/code>的比较关系完整保留。 is difficult to envisage.<\/p>\n<p>由于技术变化及其社会后果十分复杂，近期未来很难设想。<\/p>\n<\/blockquote>\n<p>D需要的“复杂性→近期难设想”就是原文已有的推进。Arc的存在也没有推翻这种困难，只说明作者用刊物继续探索，而不是近期未来已经容易预测。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者总体看好长期前景，不能判断第五段中的兴趣趋势、刊物作用、技术用途或具体难易比较；这些局部命题必须逐项以第五段为依据。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>Our immediate future is hard to conceive.<br>我们的近期未来很难设想。<\/p>\n<\/blockquote>\n<p>长期前景积极与近期未来难以设想可以同时成立；文章在保持前者时承认后者。本项的具体判断仍由第五段的难易比较和复杂性说明给出，D准确保留这项局部限制，没有把它扩大成所有未来都不可知。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<\/section>"},{"title":"33题结论","raw":"### 33题结论\n\n> **33. D. Our immediate future is hard to conceive.**\n\nA从科幻作家的探索角色补出了科幻兴趣上升。\n\nB把刊物本身的主题范围改成限制未来学研究范围的作用。\n\nC把技术复杂的社会后果换成技术解决社会问题的作用。\n\nD概括了首句的难易比较与后句的复杂性原因。\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[18,1071,1259,409],"sourceW":1452,"sourceH":2561},"meta":{"kind":"conclusion","question":33},"level":3,"html":"<blockquote>\n<p><strong>33. D. Our immediate future is hard to conceive.<\/strong><\/p>\n<\/blockquote>\n<p>A从科幻作家的探索角色补出了科幻兴趣上升。<\/p>\n<p>B把刊物本身的主题范围改成限制未来学研究范围的作用。<\/p>\n<p>C把技术复杂的社会后果换成技术解决社会问题的作用。<\/p>\n<p>D概括了首句的难易比较与后句的复杂性原因。<\/p>\n<hr>\n"},{"title":"34题 · 题干、题型与核心出处","raw":"## 34题\n\n> To ensure the future of mankind, it is crucial to ______.\n>\n> 为了保障人类的未来，关键是什么？\n\n### 题型\n\n局部推断题，问保障人类未来所需的关键做法。第六段明说以过去的长期模式作预测，第七段明说利用知识减少风险、改善后代处境；将这两项明示事实连起来，才能推出题干要求的行动。\n\n### 核心出处\n\n> As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.\n>\n> This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad. To be sure, the future is not all rosy. But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.\n\n`ensure the future of mankind`对应末段的减少生存风险和改善后代处境。末段`This long perspective`承接第六段，因此要回看`the past holds the key to the future`及冒号后的解释：利用历史模式形成有证据的预测，再把知识用于应对未来。\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[18,1597,1259,419],"sourceW":1452,"sourceH":2561},"meta":{"kind":"question","question":34},"level":2,"html":"<blockquote>\n<p>To ensure the future of mankind, it is crucial to ______.<\/p>\n<p>为了保障人类的未来，关键是什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>局部推断题，问保障人类未来所需的关键做法。第六段明说以过去的长期模式作预测，第七段明说利用知识减少风险、改善后代处境；将这两项明示事实连起来，才能推出题干要求的行动。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad. To be sure, the future is not all rosy. But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<\/blockquote>\n<p><code>ensure the future of mankind<\/code>对应末段的减少生存风险和改善后代处境。末段<code>This long perspective<\/code>承接第六段，因此要回看<code>the past holds the key to the future<\/code>及冒号后的解释：利用历史模式形成有证据的预测，再把知识用于应对未来。<\/p>\n<hr>\n"},{"title":"A. draw on our experience from the past","raw":"### A. draw on our experience from the past\n\n> 借鉴过去的经验\n\n**做题模式中的状态：** 当时A完整显示。我们从末段的长远视角回读第六段，尽管`considerable [xxx]`仍有遮挡，仍读到`the past holds the key to the future`及依据长期模式作预测，因此第一轮保留A；其他项排除后选A。\n\n**选项类型：正确跨段概括。**\n\n第六段说明从地球与人类历史的长期模式获得预测依据，第七段说明知识可以减少生存风险、改善后代处境。A把这一路径概括为借鉴过去经验，既包含依据来源，也接得上题干保障未来的目的。\n\n**出处：**\n\n> As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.\n>\n> But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 A选项","focus":[93,1685,848,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":34,"option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q34-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>借鉴过去的经验<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示。我们从末段的长远视角回读第六段，尽管<code>considerable [xxx]<\/code>仍有遮挡，仍读到<code>the past holds the key to the future<\/code>及依据长期模式作预测，因此第一轮保留A；其他项排除后选A。<\/p>\n<p><strong>选项类型：正确跨段概括。<\/strong><\/p>\n<p>第六段说明从地球与人类历史的长期模式获得预测依据，第七段说明知识可以减少生存风险、改善后代处境。A把这一路径概括为借鉴过去经验，既包含依据来源，也接得上题干保障未来的目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. draw on our experience from the past","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 为了保障人类的未来，关键是借鉴过去的经验。\n\n题干的`ensure the future`要找减少风险、改善后代处境的做法；A的`experience from the past`对应第六段`the past`与`long-term patterns`，不能只停在末段态度词上。\n\n第六段明示已经识别了塑造地球和人类历史的足够多长期模式，因此能够作有证据的预测；第七段明示现有知识能够减少许多曾威 ":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.\n>\n> But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.\n>\n> 以过去的长期模式形成预测，再凭知识减少风险、改善后来者的处境。\n\n第六段回答认识从哪里来，第七段回答这些认识对未来有什么用；跨段推进把借鉴过去落到保障未来上。\n\n如果A真是作者的意思，文章至少得写成：\n\n> By drawing on what the past reveals, we can better anticipate risks and improve conditions for future generations.\n>\n> 借助过去揭示的经验，我们能够更好地预见风险、改善后代的处境。\n\nA所需的写法由相邻两段共同给出：历史模式帮助预测，已有知识帮助减少风险。它不是只复述“过去”一词，而是保留作者赋予过去经验的实际用途。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 A选项","focus":[93,1685,848,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":34,"option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q34-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>借鉴过去的经验<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示。我们从末段的长远视角回读第六段，尽管<code>considerable [xxx]<\/code>仍有遮挡，仍读到<code>the past holds the key to the future<\/code>及依据长期模式作预测，因此第一轮保留A；其他项排除后选A。<\/p>\n<p><strong>选项类型：正确跨段概括。<\/strong><\/p>\n<p>第六段说明从地球与人类历史的长期模式获得预测依据，第七段说明知识可以减少生存风险、改善后代处境。A把这一路径概括为借鉴过去经验，既包含依据来源，也接得上题干保障未来的目的。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of spects of Mankind  \n> 人类始终光明的前景\n\n把这个主旨直接代入34题题干：\n\n> 要保障仍然值得期待的人类未来，应利用已有知识辨认和减少风险、改善后代处境；其中知识怎样取得，要由第六段关于过去与长期模式的说明补足，积极态度本身不能替代这一步。\n\n但C实际说的是：\n\n> explore our planet’s abundant resources  \n> 探索地球丰富的资源\n\n光明前景可以与资源探索相容，但主旨不能推出这就是关键办法。本项最终仍要根据“long-term patterns shaping the history of the planet”判断：作者寻找的是历史中的预测依据，C的资源丰富程度和探索作用都没有从中得到支持。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 C选项","focus":[94,1860,880,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":34,"option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q34-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-C-0\"><blockquote>\n<p>探索地球丰富的资源<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们注意到它与第六段都出现<code>planet<\/code>，但原文研究地球历史的长期模式，选项转为探查资源，因此第一轮排除C。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用<code>the planet<\/code>，再补出资源丰富和探索资源有助于保障未来的关系。第六段的地球是历史模式的研究对象，原文没有给出资源数量或将探查资源设为关键办法。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>为了保障人类的未来，关键是探索地球丰富的资源。<\/p>\n<\/blockquote>\n<p>C的<code>our planet<\/code>对应第六段<code>the history of the planet<\/code>，题干的<code>crucial<\/code>对应<code>the past holds the key<\/code>。必须把<code>history<\/code>和后面的长期模式一起读，才能确定地球在这里承担什么角色。<\/p>\n<p>原文写人们识别塑造地球与人类历史的长期模式，用它们预测后代将处在什么情境中。这是一条从历史材料取得认识的路径。<\/p>\n<p>C则把动作设为探索地球资源，并称这些资源丰富。探索资源现实中可能有益，但这段没有给出资源的丰富程度，也没有把这种探索与保障未来建立关系。<\/p>\n<p>C从同一个<code>planet<\/code>补出了新的对象“丰富资源”和新的关键行动，不能由研究历史模式推得。<\/p>\n<\/section><section class=\"revealPart\" id y of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.\n>\n> But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1948,821,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q34-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>抑制我们重塑历史的雄心<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项为<code>curb our ambition to [xxx] history<\/code>，重塑这一动词仍被遮挡。我们已经看出它提出压制雄心，而原文主张识别和利用历史模式，没有把保障未来建立在限制动机上，因此第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了<code>history<\/code>和关于风险的背景，额外引入人类怀有重塑历史的雄心，并把抑制这种雄心设为保障未来的关键。原文说的是认识历史和运用知识，没有对这类雄心作出判断。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. curb our ambition to reshape history","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 为了保障人类的未来，关键是抑制我们重塑历史的雄心。\n\nD的`history`可对应第六段的`the history of the planet, and our species`，但`curb our ambition`是一个新的行动要求，同样要检查原文是否支持。\n\n第六段主语是已经识别长期模式的“我们”，动作是识别并据此预测；末段又写有足够知识减少风险、改善后来者处境。两段没有先列出重塑历史的雄心，也没有把它当作风险原因。\n\n知道人类面临风险，不等于知道风险来自某种雄心；主张借鉴过去，也不等于主张抑制重塑历史的意愿。要得到D，还需要补出原文没有的动机和应对要求。\n\nD将认识历史这一主题接成限制雄心的规范性结论，缺少两者之间的文本依据。","section":"第三鸟 · 题目复盘","context"  make evidence-based forecasts about the situations in which our descendants will find themselves.\n>\n> But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.\n>\n> 从长期历史中获取预测依据，再用已有知识减少危险、改善后代处境。\n\n文章沿着积极使用知识的路线收束，没有把某种改变历史的企图列为必须先压制的问题。\n\n如果D真是作者的意思，文章至少得写成：\n\n> We must curb our ambition to reshape history in order to secure humanity’s future.\n>\n> 为了保障人类未来，我们必须抑制重塑历史的雄心。\n\nD要求明确指出这类雄心应受到限制。原文没有评价这种动机，而是解释已有认识怎样支持应对未来，不能把“利用历史”改写成“限制重塑历史的雄心”。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1948,821,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q34-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>抑制我们重塑历史的雄心<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项为<code>curb our ambition to [xxx] history<\/code>，重塑这一动词仍被遮挡。我们已经看出它提出压制雄心，而原文主张识别和利用历史模式，没有把保障未来建立在限制动机上，因此第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了<code>history<\/code>和关于风险的背景，额外引入人类怀有重塑历史的雄心，并把抑制这种雄心设为保障未来的关键。原文说的是认识历史和运用知识，没有对这类雄心作出判断。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>为了保障人类的未来，关键是抑制我们重塑历史的雄心。<\/p>\n<\/blockquote>\n<p>D的<code>history<\/code>可对应第六段的<code>the history of the planet, and our species<\/code>，但<code>curb our ambition<\/code>是一个新的行动要求，同样要检查原文是否支持。<\/p>\n<p>第六段主语是已经识别长期模式的“我们”，动作是识别并据此预测；末段又写有足够知识减少风险、改善后来者处境。两段没有先列出重塑历史的雄心，也没有把它当作风险原因。<\/p>\n<p>知道人类面临风险，不等于知道风险来自某种雄心；主张借鉴过去，也不等于主张抑制重塑历史的意愿。要得到D，还需要补出原文没有的动机和应对要求。<\/p>\n<p>D将认识历史这一主题接成限制雄心的规范性结论，缺少两者之间的文本依据。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.<\/p>\n<p>But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.<\/p>\n<p>从长期历史中获取预测依据，再用已有知识减少危险、改善后代处境。<\/p>\n<\/blockquote>\n<p>文章沿着积极使用知识的路线收束，没有把某种改变历史的企图列为必须先压制的问题。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>We must curb our ambition to reshape history in order to secure humanity’s future.<\/p>\n<p>为了保障人类未来，我们必须抑制重塑历史的雄心。<\/p>\n<\/blockquote>\n<p>D要求明确指出这类雄心应受到限制。原文没有评价这种动机，而是解释已有认识怎样支持应对未来，不能把“利用历史”改写成“限制重塑历史的雄心”。<\/p>\n<\/section>"},{"title":"D. curb our ambition to reshape history","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> The Ever-bright Prospects of Mankind  \n> 人类始终光明的前景\n\n把这个主旨直接代入34题题干：\n\n> 要保障仍然值得期待的人类未来，应利用已有知识辨认和减少风险、改善后代处境；其中知识怎样取得，要由第六段关于过去与长期模式的说明补足，积极态度本身不能替代这一步。\n\n但D实际说的是：\n\n> curb our ambition to reshape history  \n> 抑制我们重塑历史的雄心\n\n全文看好人类利用知识改善未来的能力，但积极主旨本身不决定每一种雄心是否应限制。本项最终仍要根据“identified enough of the long-term patterns”及末段的知识用途判断：这两处支持认识和运用过去，没有提出抑制重塑历史雄心这一要求。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1948,821,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":true
