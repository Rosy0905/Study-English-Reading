<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset:method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset:method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset:method_newtype_overview)\n\n![新题型考纲表格](asset:method_newtype_table)\n\n![七选五题型说明](asset:method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset:method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset:method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset:method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"# 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| a few | 数量短语：几个；少数几个 | decades ago | 名词短语：几十年前 | visions | n. 愿景；想象 |\n| future | n. 未来 | largely | adv. 大体上；在很大程度上 | though | conj. 尽管；虽然 |\n| by no means | 介词短语：绝不；一点也不 | uniformly | adv. 一致地；毫无例外地 | glowingly positive | 形容词短语：非常乐观的；充满希望的 |\n| technology | n. 技术；科技 | cure | v. 解决；消除；此处以治病比喻解决问题 | ills | n. 弊病；苦难 |\n| humanity | n. 人类 | leading to | 动词短语：带来；导致 | lives | n. 生活 |\n| fulfilment | n. 成就感；充实感 | opportunity | n. 机会 |  |  |","level":1,"section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[86,150,905,353],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>a few<\/td>\n<td>数量短语：几个；少数几个<\/td>\n<td>decades ago<\/td>\n<td>名词短语：几十年前<\/td>\n<td>visions<\/td>\n<td>n. 愿景；想象<\/td>\n<\/tr>\n<tr>\n<td>future<\/td>\n<td>n. 未来<\/td>\n<td>largely<\/td>\n<td>adv. 大体上；在很大程度上<\/td>\n<td>though<\/td>\n<td>conj. 尽管；虽然<\/td>\n<\/tr>\n<tr>\n<td>by no means<\/td>\n<td>介词短语：绝不；一点也不<\/td>\n<td>uniformly<\/td>\n<td>adv. 一致地；毫无例外地<\/td>\n<td>glowingly positive<\/td>\n<td>形容词短语：非常乐观的；充满希望的<\/td>\n<\/tr>\n<tr>\n<td>technology<\/td>\n<td>n. 技术；科技<\/td>\n<td>cure<\/td>\n<td>v. 解决；消除；此处以治病比喻解决问题<\/td>\n<td>ills<\/td>\n<td>n. 弊病；苦难<\/td>\n<\/tr>\n<tr>\n<td>humanity<\/td>\n<td>n. 人类<\/td>\n<td>leading to<\/td>\n<td>动词短语：带来；导致<\/td>\n<td>lives<\/td>\n<td>n. 生活<\/td>\n<\/tr>\n<tr>\n<td>fulfilment<\/td>\n<td>n. 成就感；充实感<\/td>\n<td>opportunity<\/td>\n<td>n. 机会<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody><\/table>\n"},{"title":"第2段","raw":"# ut that question.<\/p>\n<p>For example, / the Long Now Foundation / has as its flagship project / a mechanical clock / that is designed / to still be marking time / thousands of years hence.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"><h3>意群翻译 · 第4段<\/h3>\n<p>那么什么 / 我们的深远未来包含？<\/p>\n<p>越来越多 / 研究人员和组织的 / 现在正在认真思考 / 关于那个问题。<\/p>\n<p>例如，/ 长远基金会 / 作为其旗舰项目有 / 一个机械钟 / 被设计 / 仍在计时 / 数千年后。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-4-3\"><h3>标准译文 · 第4段<\/h3>\n<p>那么，我们的深远未来会是什么样子？越来越多的研究人员和组织现在正在认真思考这个问题。例如，长远基金会的旗舰项目是一个机械钟，设计目标是在数千年后仍能计时。<\/p>\n<\/section>"},{"title":"第5段","raw":"### 完整原文 · 第5段\n\nPerhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future. The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage. That’s one reason why we have launched _Arc_, a new publication dedicated to the near future.","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[86,2368,905,582],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false},"focusId":"focus-paragraph-5-0","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段<\/h3>\n<p>Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future. The potential evolution of today’s technology, and its social consequences, is dazzlingly complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage. That’s one reason why we have launched <em>Arc<\/em>, a new publication dedicated to the near future.<\/p>\n<\/section>"},{"title":"第5段","raw":"### 意群划分 · 第5段\n\ The fossil record shows：(that many species → have endured：(for millions of years)) – so why shouldn't we?\n\nTake a broader look：(at our species' place：(in the universe)) → and it becomes clear：(that we have → an excellent chance：(of surviving)：(for tens, if not hundreds, of thousands of years)).\n\nLook up Homo sapiens：(in the \"Red List\"：(of threatened species)：(of the International Union for the Conservation of Nature (IUCN))) → and you will read：\"Listed as Least Concern：(as the species → is very widely distributed + adaptable + currently increasing) + (there are no major threats：(resulting in → an overall population decline)).\"\n\n**第4段**\n\nSo what does → our deep future hold?\n\nA growing number：(of researchers and organisations) → are now thinking seriously：(about that question).\n\nFor example → the Long Now Foundation → has as its flagship project → a mechanical clock：(that is designed → to still be marking time：(thousands of years hence)).\n\n**第5段**\n\nPerhaps willfully → it may be easier → to think about：(such lengthy timescales) // than about：(the more immediate future).\n\nThe potential evolution：(of today's technology) + its social consequences → is dazzlingly complicated → and it's perhaps best → left to science fiction writers + futurologists → to explore：(the many possibilities：(we can envisage)).\n\nThat's one reason：(why we have launched Arc：(a new publication：(dedicated to → the near future))).\n\n**第6段**\n\nBut take a longer view → and there is → a surprising amount：(that we can say：(with considerable assurance)).\n\nAs so often → the past → holds the key：(to the future)：we have now identified → enough of the long-term patterns：(shaping the history：(of the planet + our species)) → to make → evidence-based forecasts：(about the situations：(in which our descendants → will find themselves)).\n\n**第7段**\n\nThis long perspective → makes the pessimistic view：(of our prospects) → seem more likely → to be a passing fad.\n\nTo be sure → the future → is not all rosy.\n\nBut we are now → knowledgeable enough → to reduce：(many of the risks：(that threatened → the existence of earlier humans)) + to improve：(the lot：(of those to come)).","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"meta":{},"html":"<p><strong>第1段<\/strong><\/p>\n<p>Up until a few decades ago → our visions of the future → were largely – though by no means uniformly – glowingly positive.<\/p>\n<p>Science and technology → would cure → all the ills of humanity → leading to lives：(of fulfilment and opportunity)：(for all).<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>Now utopia → has grown unfashionable → as we have gained → a deeper appreciation：(of the range of threats：(facing us))：(from asteroid strike + to epidemic flu + to climate change).<\/p>\n<p>You might even be tempted → to assume：(that humanity → has little future：(to look forward to)).<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>But such gloominess → is misplaced.<\/p>\n<p>The fossil record shows：(that many species → have endured：(for millions of years)) – so why shouldn&#39;t we?<\/p>\n<p>Take a broader look：(at our species&#39; place：(in the universe)) → and it becomes clear：(that we have → an excellent chance：(of surviving)：(for tens, if not hundreds, of thousands of years)).<\/p>\n<p>Look up Homo sapiens：(in the &quot;Red List&quot;：(of threatened species)：(of the International Union for the Conservation of Nature (IUCN))) → and you will read：&quot;Listed as Least Concern：(as the species → is very widely distributed + adaptable + currently increasing) + (there are no major threats：(resulting in → an overall population decline)).&quot;<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>So what does → our deep future hold?<\/p>\n<p>A growing number：(of researchers and organisations) → are now thinking seriously：(about that question).<\/p>\n<p>For example → the Long Now Foundation → has as its flagship project 。\"\n\n**第4段**\n\n那么什么 → 我们的深远未来包含？\n\n越来越多：(研究人员和组织的) → 现在正在认真思考：(关于那个问题)。\n\n例如 → 长远基金会 → 作为其旗舰项目有 → 一个机械钟：(被设计 → 仍在计时：(数千年后))。\n\n**第5段**\n\n也许是故意地 → 可能更容易 → 思考：(如此漫长的时间尺度) // 比起：(更近期的未来)。\n\n潜在的演变：(今天技术的) + 其社会后果 → 是令人眼花缭乱地复杂 → 也许最好 → 留给科幻作家 + 未来学家 → 去探索：(许多可能性：(我们能够设想的))。\n\n那是一个原因：(为什么我们推出了Arc：(一个新出版物：(致力于 → 近期未来)))。\n\n**第6段**\n\n但采取更长远的视角 → 就有 → 令人惊讶的数量：(我们可以说的：(以相当的确信))。\n\n正如经常的情况 → 过去 → 掌握着钥匙：(通向未来)：我们现在已经识别 → 足够的长期模式：(塑造历史：(地球的 + 我们物种的)) → 来做出 → 基于证据的预测：(关于情况：(我们的后代 → 将发现自己所处的))。\n\n**第7段**\n\n这种长远视角 → 使悲观看法：(对我们前景的) → 看起来更可能 → 是一时的风尚。\n\n确实 → 未来 → 并非全是美好的。\n\n但我们现在 → 足够有知识 → 去减少：(许多风险：(那些威胁 → 早期人类存在的)) + 改善：(命运：(未来人类的))。","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"meta":{},"html":"<p><strong>第1段<\/strong><\/p>\n<p>直到几十年前 → 我们对未来的愿景 → 在很大程度上是 – 尽管绝非一致地 – 光辉正面的。<\/p>\n<p>科学和技术 → 将会治愈 → 人类的所有疾病 → 带来生活：(充满成就感和机会的)：(对所有人)。<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>现在乌托邦 → 已经变得不流行了 → 因为我们已经获得 → 更深刻的认识：(对威胁范围的：(面对我们的))：(从小行星撞击 + 到流行性流感 + 再到气候变化)。<\/p>\n<p>你甚至可能被诱惑 → 去假设：(人类 → 几乎没有未来：(可以期待))。<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>但这种悲观情绪 → 是错误的。<\/p>\n<p>化石记录显示：(许多物种 → 已经存续：(数百万年)) – 那么我们为什么不能呢？<\/p>\n<p>放眼更广阔地看：(我们物种的位置：(在宇宙中)) → 它变得清晰：(我们有 → 极好的机会：(生存)：(数万年，如果不是数十万年的话))。<\/p>\n<p>查找智人：(在&quot;红色名录&quot;中：(受威胁物种的)：(国际自然保护联盟的)) → 你会读到：&quot;列为最少关注：(因为该物种 → 分布非常广泛 + 适应性强 + 目前正在增长) + (没有重大威胁：(导致 → 整体种群下降))。&quot;<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>那么什么 → 我们的深远未来包含？<\/p>\n<p>越来越多：(研究人员和组织的) → 现在正在认真思考：(关于那个问题)。<\/p>\n<p>例如 → 长远基金会 → 作为其旗舰项目有 → 一个机械钟：(被设计 → 仍在计时：(数千年后))。<\/p>\n<p><strong>第5段<\/strong><\/p>\n<p>也许是故意地 → 可能更容易 → 思考：(如此漫长的时间尺度) // 比起：(更近期的未来)。<\/p>\n<p>潜在的演变：(今天技术的) + 其社会后果 → 是令人眼花缭乱地复杂 → 也许最好 → 留给科幻作家 + 未来学家 → 去探索：(许多可能性：(我们能够设想的))。<\/p>\n<p>那是一个原因：(为什么我们推出了Arc：(一个新出版物：(致力于 → 近期未来)))。<\/p>\n<p><strong>第6段<\/strong><\/p>\n<p>但采取更长远的视角 → 就有 → 令人惊讶的数量：(我们可以说的：(以相当的确信))。<\/p>\n<p>正如经常的情况 → 过去 → 掌握着钥匙：(通向未来)：我们现在已经识别 → 足够的长期模式：(塑造历史：(地球的 + 我们物种 n class=\"revealPart\" id=\"focus-long-6-5\"><h3>第五步：艺术加工<\/h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“已经足够有知识，去……”改为“已经拥有足够的知识来……”，让知识和行动自然连接。<\/li>\n<li>“早期人类存在”整理为“早期人类生存”，“未来人类”收为“后代”；保留“许多”和“减少”，不改成消除全部风险。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>但我们现在已经拥有足够的知识来减少许多曾威胁早期人类生存的风险，并改善后代的命运。<\/p>\n<\/blockquote>\n<\/section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1452,"sourceH":2561},"meta":{"kind":"section-cover","mergedIntro":true},"level":1,"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n"},{"title":"35题 · 题干、题型与核心出处","raw":"## 35题\n\n**Which of the following would be the best title for the text?**\n\n下面哪个标题最适合这篇文章？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Uncertainty about Our Future**\n\n我们未来的不确定性\n\nB. **Evolution of the Human Species**\n\n人类物种的进化\n\nC. **The Ever-bright Prospects of Mankind**\n\n人类始终光明的前景\n\nD. **Science, Technology and Humanity**\n\n科学、技术与人类\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先回顾几十年前对未来的乐观图景，人们相信科学技术会治愈人类弊病 | 先说过去大家非常乐观 |\n| 2 | 再写如今乌托邦想象失宠，各类威胁让人怀疑人类是否还有未来 | 再说现在大家又变得悲观 |\n| 3 | 转而用化石记录和IUCN红色名录说明人类作为物种有很强的长期生存机会 | 再转回来，说悲观可能放错地方 |\n| 4 | 写一些组织开始认真思考数千年后的深远未来，并举长期时钟项目 | 接着把眼光拉到很远以后 |\n| 5 | 承认近期未来反而更难设想，因为技术演变及社会后果极其复杂 | 再承认眼前反而更难说清 |\n| 6 | 指出拉长时间后，可以从地球与人类历史的长期模式中作有证据的预测 | 然后说拉长时间能多知道一些 |\n| 7 | 收束为长期悲观可能只是一时风潮；未来并非全好，但人类已有能力减少风险、改善后代处境 | 最后下结论：悲观不必当成定局 |\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[18,2123,1308,420],"sourceW":1452,"sourceH":2561},"meta":{"kind":"question","question":35},"level":2,"html":"<p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>下面哪个标题最适合这篇文章？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>Uncertainty about Our Future<\/strong><\/p>\n<p>我们未来的不确定性<\/p>\n<p>B. <strong>Evolution of the Human Species<\/strong><\/p>\n<p>人类物种的进化<\/p>\n<p>C. <strong>The Ever-bright Prospects of Mankind<\/strong><\/p>\n<p>人类始终光明的前景<\/p>\n<p>D. <strong>Science, Technology and Humanity<\/strong><\/p>\n<p>科学、技术与人类<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先回顾几十年前对未来的乐观图景，人们相信科学技术会治愈人类弊病<\/td>\n<td>先说过去大家非常乐观<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再写如今乌托邦想象失宠，各类威胁让人怀疑人类是否还有未来<\/td>\n<td>再说现在大家又变得悲观<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>转而用化石记录和IUCN红色名录说明人类作为物种有很强的长期生存机会<\/td>\n<td>再转回来，说悲观可能放错地方<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>写一些组织开始认真思考数千年后的深远未来，并举长期时钟项目<\/td>\n<td>接着把眼光拉到很远以后<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认近期未来反而更难设想，因为技术演变及社会后果极其复杂<\/td>\n<td>再承认眼前反而更难说清<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>指出拉长时间后，可以从地球与人类历史的长期模式中作有证据的预测<\/td>\n<td>然后说拉长时间能多知道一些<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>收束为长期悲观可能只是一时风潮；未来并非全好，但人类已有能力减少风险、改善后代处境<\/td>\n<td>最后下结论：悲观不必当成定局<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n"},{"title":"A. Uncertainty about Our Future","raw":"**Which of the following would be the best title for the text?**\n\n### A. Uncertainty about Our Future\n\n我们未来的不确定性","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 A选项","focus":[93,2211,680,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":35,"option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q35-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-A-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>我们未来的不确定性<\/p>\n<\/section>"},{"title":"A. Uncertainty about Our Future","raw":"#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n我们未来的不确定性\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先回顾过去人们对未来非常乐观，常把美好愿景当成可以放心期待的生活图景，为讨论预测中尚未显露的不确定性作铺垫 | 先说过去大家非常乐观 |\n| 2 | 再写如今人们看到灾害、疾病等风险，转向悲观；未来会朝什么方向发展因此成为人们难以拿准的问题 | 再说现在大家又变得悲观 |\n| 3 | 再指出悲观也不等于已经知道未来：人类仍有继续生存的有利条件，不能把一种坏结局提前当成确定结果 | 再转回来，说悲观可能放错地方 |\n| 4 | 把不确定性的问题延伸到数千年以后，讨论如此遥远的时间里哪些变化仍有多种走向 | 接着把眼光拉到很远以后 |\n| 5 | 承认近期技术与社会变化交织，具体事件怎样发生比遥远年代的大致条件更难说清，说明不确定性的现实表现 | 再承认眼前反而更难说清 |\n| 6 | 说明长期记录能帮助掌握部分稳定规律、缩小预测范围，同时具体区分因此增加的知识与仍待确定的未来走向 | 然后说拉长时间能多知道一些 |\n| 7 | 总结未来仍存在未定因素；既然坏结局并未被确定，悲观就不必成为定局，应对不同走向保持开放 | 最后下结论：悲观不必当成定局 |\n\nA可以容纳第五段所说的近期未来难以设想，也容许第六段增加一些知识；它并不等于宣称任何预测都不可靠。但若全文中心是不确定性，第三段纠正悲观、第六段说明预测依据后，结尾还应着重区分哪些未来走向仍然未定。实际文章第三段强调人类长期存活的良好机会，第六段强调可以有把握地说出很多内容，第七段落在减少风险、改善后代处境上。这些段落共同支持对人类前景的积极判断，不确定性只是其中承认的一项限制。\n\n判断：\n\n**A 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 A选项","focus":[93,2211,680,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":35,"option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q35-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-A-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>我们未来的不确定性<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-A-1\"><h3>如果 A 是主旨，文章7段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>我们未来的不确定性<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先回顾过去人们对未来非常乐观，常把美好愿景当成可以放心期待的生活图景，为讨论预测中尚未显露的不确定性作铺垫<\/td>\n<td>先说过去大家非常乐观<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再写如今人们看到灾害、疾病等风险，转向悲观；未来会朝什么方向发展因此成为人们难以拿准的问题<\/td>\n<td>再说现在大家又变得悲观<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>再指出悲观也不等于已经知道未来：人类仍有继续生存的有利条件，不能把一种坏结局提前当成确定结果<\/td>\n<td>再转回来，说悲观可能放错地方<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把不确定性的问题延伸到数千年以后，讨论如此遥远的时间里哪些变化仍有多种走向<\/td>\n<td>接着把眼光拉到很远以后<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认近期技术与社会变化交织，具体事件怎样发生比遥远年代的大致条件更难说清，说明不确定性的现实表现<\/td>\n<td>再承认眼前反而更难说清<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>说明长期记录能帮助掌握部分稳定规律、缩小预测范围，同时具体区分因此增加的知识与仍待确定的未来走向<\/td>\n<td>然后说拉长时间能多知道一些<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>总结未来仍存在未定因素；既然坏结局并未被确定，悲观就不必成为定局，应对不同走向保持开放<\/td>\n<td>最后下结论：悲观不必当成定局<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>A可以容纳第五段所说的近期未来难以设想，也容许第六段增加一些知识；它并不等于宣称任何预测都不可靠。但若全文中心是不确定性，第三段纠正悲观、第六段说明预测依据后，结尾还应着重区分哪些未来走向仍然未定。实际文章第三段强调人类长期存活的良好机会，第六段强调可以有把握地说出很多内容，第七段落在减少风险、改善后代处境上。这些段落共同支持对人类前景的积极判断，不确定性只是其中承认的一项限制。<\/p>\n<p>判断：<\/p>\n<p><strong>A 不保留。<\/strong><\/p>\n<\/section>"},{"title":"B. Evolution of the Human Species","raw":"**Which of the following would be the best title for the text?**\n\n### B. Evolution of the Human Species\n\n人类物种的进化","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 B选项","focus":[93,2299,738,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":35,"option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q35-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-B-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>人类物种的进化<\/p>\n<\/section>"},{"title":"B. Evolution of the Human Species","raw":"#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n人类物种的进化\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先写过去人们对人类物种未来的演化充满乐观，相信适应能力与身体特征的延续变化将使后代处境更好 | 先说过去大家非常乐观 |\n| 2 | 再写如今人们担忧环境压力对人类演化产生不利影响，因此对物种将向何处变化转为悲观 | 再说现在大家又变得悲观 |\n| 3 | 再用人类既有的适应性变化说明演化并不必然走向衰败，纠正把未来物种变化看坏的判断 | 再转回来，说悲观可能放错地方 |\n| 4 | 把观察尺度延长到数千年以后，具体讨论人类特征在长期选择和环境影响下如何变化 | 接着把眼光拉到很远以后 |\n| 5 | 承认眼前的生活环境和技术条件变化复杂，短期内哪些影响会留下可传承的演化效果更难辨清 | 再承认眼前反而更难说清 |\n| 6 | 说明把时间拉长后，可以借助历代人类特征与环境的关系辨认演化模式，从而更清楚地讨论今后的变化 | 然后说拉长时间能多知道一些 |\n| 7 | 总结人类物种会在变化条件中继续演化，既有适应路径使悲观的演化前景不必成为定局 | 最后下结论：悲观不必当成定局 |\n\n这条假想路线把各段的乐观、悲观和长短时间尺度都落实在人类物种如何演化上，因而需要持续说明特征、适应与环境之间的变化关系。实际第三段的化石记录和红色名录证明的是人类有机会长期生存，第四段的机械钟指向认真思考遥远未来，第五段谈的是技术可能怎样演变，第六、七段转向预测和减少风险。文章没有把人类的演化过程作为各段共同解释的对象；“能够延续”也不等于“怎样进化”。\n\n判断：\n\n**B 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 B选项","focus":[93,2299,738,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":35,"option":"B","cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q35-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-B-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>人类物种的进化<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-B-1\"><h3>如果 B 是主旨，文章7段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>人类物种的进化<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写过去人们对人类物种未来的演化充满乐观，相信适应能力与身体特征的延续变化将使后代处境更好<\/td>\n<td>先说过去大家非常乐观<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再写如今人们担忧环境压力对人类演化产生不利影响，因此对物种将向何处变化转为悲观<\/td>\n<td>再说现在大家又变得悲观<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>再用人类既有的适应性变化说明演化并不必然走向衰败，纠正把未来物种变化看坏的判断<\/td>\n<td>再转回来，说悲观可能放错地方<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把观察尺度延长到数千年以后，具体讨论人类特征在长期选择和环境影响下如何变化<\/td>\n<td>接着把眼光拉到很远以后<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认眼前的生活环境和技术条件变化复杂，短期内哪些影响会留下可传承的演化效果更难辨清<\/td>\n<td>再承认眼前反而更难说清<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>说明把时间拉长后，可以借助历代人类特征与环境的关系辨认演化模式，从而更清楚地讨论今后的变化<\/td>\n<td>然后说拉长时间能多知道一些<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>总结人类物种会在变化条件中继续演化，既有适应路径使悲观的演化前景不必成为定局<\/td>\n<td>最后下结论：悲观不必当成定局<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>这条假想路线把各段的乐观、悲观和长短时间尺度都落实在人类物种如何演化上，因而需要持续说明特征、适应与环境之间的变化关系。实际第三段的化石记录和红色名录证明的是人类有机会长期生存，第四段的机械钟指向认真思考遥远未来，第五段谈的是技术可能怎样演变，第六、七段转向预测和减少风险。文章没有把人类的演化过程作为各段共同解释的对象；“能够延续”也不等于“怎样进化”。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<\/section>"},{"title":"C. The Ever-bright Prospects of Mankind","raw":"**Which of the following would be the best title for the text?**\n\n### C. The Ever-bright Prospects of Mankind\n\n人类始终光明的前景","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 C选项","focus":[94,2387,859,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":35,"option":"C","cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q35-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-C-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>人类始终光明的前景<\/p>\n<\/section>"},{"title":"C. The Ever-bright Prospects of Mankind","raw":"#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n人类始终光明的前景\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先回顾过去人们普遍相信科学技术能改善人类生活，未来前景因而被描绘得十分光明 | 先说过去大家非常乐观 |\n| 2 | 再写如今对天灾、疾病和气候威胁的认识使人转向悲观，看好人类未来的判断由此受到挑战 | 再说现在大家又变得悲观 |\n| 3 | 再用其他物种的长期存续和人类良好的生存状态指出悲观可能错位，给人类光明前景补上事实依据 | 再转回来，说悲观可能放错地方 |\n| 4 | 把人类前景放到数千年以后认真考虑，用面向遥远未来的研究说明长期延续值得作为现实问题规划 | 接着把眼光拉到很远以后 |\n| 5 | 承认近期技术演变及社会后果很复杂，近期难以设想构成乐观判断需要保留的限制 | 再承认眼前反而更难说清 |\n| 6 | 说明拉长时间后可以从地球与人类的长期历史模式获得预测依据，使看好后代前景有知识支撑 | 然后说拉长时间能多知道一些 |\n| 7 | 总结未来虽有风险，人类仍能运用知识减少危险、改善后代处境，因此长期悲观不必成为定局 | 最后下结论：悲观不必当成定局 |\n\n第一、二段先摆出过去乐观与如今悲观，第三段用生存证据把方向转回，第四段把目光投向深远未来。第五段承认近期复杂，第六段随即说明长期预测的知识基础，第七段在承认风险后强调人类能够改善后代处境。C概括的是贯穿这些转折的长期积极前景。这里的光明保留了文章明写的限制：有良好的存活机会，并能减少许多风险，不能据此说人类永远不会遇到风险。\n\n判断：\n\n**C 保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 C选项","focus":[94,2387,859,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":35,"option":"C","cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q35-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-C-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>人类始终光明的前景<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-C-1\"><h3>如果 C 是主旨，文章7段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>人类始终光明的前景<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先回顾过去人们普遍相信科学技术能改善人类生活，未来前景因而被描绘得十分光明<\/td>\n<td>先说过去大家非常乐观<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再写如今对天灾、疾病和气候威胁的认识使人转向悲观，看好人类未来的判断由此受到挑战<\/td>\n<td>再说现在大家又变得悲观<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>再用其他物种的长期存续和人类良好的生存状态指出悲观可能错位，给人类光明前景补上事实依据<\/td>\n<td>再转回来，说悲观可能放错地方<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把人类前景放到数千年以后认真考虑，用面向遥远未来的研究说明长期延续值得作为现实问题规划<\/td>\n<td>接着把眼光拉到很远以后<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认近期技术演变及社会后果很复杂，近期难以设想构成乐观判断需要保留的限制<\/td>\n<td>再承认眼前反而更难说清<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>说明拉长时间后可以从地球与人类的长期历史模式获得预测依据，使看好后代前景有知识支撑<\/td>\n<td>然后说拉长时间能多知道一些<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>总结未来虽有风险，人类仍能运用知识减少危险、改善后代处境，因此长期悲观不必成为定局<\/td>\n<td>最后下结论：悲观不必当成定局<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>第一、二段先摆出过去乐观与如今悲观，第三段用生存证据把方向转回，第四段把目光投向深远未来。第五段承认近期复杂，第六段随即说明长期预测的知识基础，第七段在承认风险后强调人类能够改善后代处境。C概括的是贯穿这些转折的长期积极前景。这里的光明保留了文章明写的限制：有良好的存活机会，并能减少许多风险，不能据此说人类永远不会遇到风险。<\/p>\n<p>判断：<\/p>\n<p><strong>C 保留。<\/strong><\/p>\n<\/section>"},{"title":"D. Science, Technology and Humanity","raw":"**Which of the following would be the best title for the text?**\n\n### D. Science, Technology and Humanity\n\n科学、技术与人类","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 D选项","focus":[93,2474,813,69],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":35,"option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q35-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-D-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>科学、技术与人类<\/p>\n<\/section>"},{"title":"D. Science, Technology and Humanity","raw":"#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n科学、技术与人类\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先写过去人们对科学技术与人类生活的关系非常乐观，相信科技将帮助人类解决困难、获得更好的生活 | 先说过去大家非常乐观 |\n| 2 | 再写如今人们担忧科技发展与人类社会相互影响中的风险，对这种关系的未来走向转为悲观 | 再说现在大家又变得悲观 |\n| 3 | 再说明科学认识和技术适应也能帮助人类处理困难，纠正对科技与人类关系的片面悲观 | 再转回来，说悲观可能放错地方 |\n| 4 | 把科技与人类的关系延伸到数千年以后，讨论长期技术选择将怎样影响后代的生活条件 | 接着把眼光拉到很远以后 |\n| 5 | 承认近期技术变化与社会反应互相作用，其具体后果比长远趋势更难说清 | 再承认眼前反而更难说清 |\n| 6 | 说明长期观察能帮助识别科学发现、技术应用与人类生活之间的反复作用，从而增进对三者关系的认识 | 然后说拉长时间能多知道一些 |\n| 7 | 总结科学技术与人类的关系具有可调整的空间，运用知识改善技术应用可以使悲观前景不必成为定局 | 最后下结论：悲观不必当成定局 |\n\nD的假想文章可以有明确的积极立场，也可以讨论科技的风险；问题并不在于这个标题必须平行罗列三类内容。关键是各段应持续解释科学、技术与人类之间的关系。实际第二段列举的威胁不都被归因为科技，第三段的物种生存证据、第四段的深远时间尺度和第六段的历史模式共同回答的是“人类未来是否值得期待”。科技在其中提供部分背景和认识手段，文章最终要确立的判断是人类的长期前景，D没有把这一中心点出。\n\n判断：\n\n**D 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题 D选项","focus":[93,2474,813,69],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":35,"option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q35-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q35-D-0\"><p><strong>Which of the following would be the best title for the text?<\/strong><\/p>\n<p>科学、技术与人类<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q35-D-1\"><h3>如果 D 是主旨，文章7段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>科学、技术与人类<\/p>\n<p>那文章7段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>先写过去人们对科学技术与人类生活的关系非常乐观，相信科技将帮助人类解决困难、获得更好的生活<\/td>\n<td>先说过去大家非常乐观<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>再写如今人们担忧科技发展与人类社会相互影响中的风险，对这种关系的未来走向转为悲观<\/td>\n<td>再说现在大家又变得悲观<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>再说明科学认识和技术适应也能帮助人类处理困难，纠正对科技与人类关系的片面悲观<\/td>\n<td>再转回来，说悲观可能放错地方<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>把科技与人类的关系延伸到数千年以后，讨论长期技术选择将怎样影响后代的生活条件<\/td>\n<td>接着把眼光拉到很远以后<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>承认近期技术变化与社会反应互相作用，其具体后果比长远趋势更难说清<\/td>\n<td>再承认眼前反而更难说清<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>说明长期观察能帮助识别科学发现、技术应用与人类生活之间的反复作用，从而增进对三者关系的认识<\/td>\n<td>然后说拉长时间能多知道一些<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>总结科学技术与人类的关系具有可调整的空间，运用知识改善技术应用可以使悲观前景不必成为定局<\/td>\n<td>最后下结论：悲观不必当成定局<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>D的假想文章可以有明确的积极立场，也可以讨论科技的风险；问题并不在于这个标题必须平行罗列三类内容。关键是各段应持续解释科学、技术与人类之间的关系。实际第二段列举的威胁不都被归因为科技，第三段的物种生存证据、第四段的深远时间尺度和第六段的历史模式共同回答的是“人类未来是否值得期待”。科技在其中提供部分背景和认识手段，文章最终要确立的判断是人类的长期前景，D没有把这一中心点出。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<\/section>"},{"title":"35题结论","raw":"### 35题结论\n\n**35. C. The Ever-bright Prospects of Mankind**\n\n这句话就是本文后续做题的主旨底牌：\n\n**The Ever-bright Prospects of Mankind / 人类始终光明的前景**\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[18,2123,1308,420],"sourceW":1452,"sourceH":2561},"meta":{"kind":"conclusion","question":35},"level":3,"html":"<p><strong>35. C. The Ever-bright Prospects of Mankind<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>The Ever-bright Prospects of Mankind / 人类始终光明的前景<\/strong><\/p>\n<hr>\n"},{"title":"31题 · 题干、题型与核心出处","raw":"## 31题\n\n> Our vision of the future used to be inspired by ______.\n>\n> 我们过去对未来的想象由什么激发？\n\n### 题型\n\n具体细节题，问过去的未来愿景由什么信念激发。`used to`限定过去，`inspired by`要求找愿景的依据，不是列出愿景包含的美好结果。\n\n### 核心出处\n\n> Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.\n\n`our vision of the future`对应首段的`our visions of the future`，`used to`对应`Up until a few decades ago`。第一句交代过去总体乐观，第二句用科学技术能够解决人类弊病的信念解释这种愿景，同时把充实生活和人人有机会放在结果端。\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[18,18,1224,419],"sourceW":1452,"sourceH":2561},"meta":{"kind":"question","question":31},"level":2,"html":"<blockquote>\n<p>Our vision of the future used to be inspired by ______.<\/p>\n<p>我们过去对未来的想象由什么激发？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>具体细节题，问过去的未来愿景由什么信念激发。<code>used to<\/code>限定过去，<code>inspired by<\/code>要求找愿景的依据，不是列出愿景包含的美好结果。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<p><code>our vision of the future<\/code>对应首段的<code>our visions of the future<\/code>，<code>used to<\/code>对应<code>Up until a few decades ago<\/code>。第一句交代过去总体乐观，第二句用科学技术能够解决人类弊病的信念解释这种愿景，同时把充实生活和人人有机会放在结果端。<\/p>\n<hr>\n"},{"title":"A. our desire for lives of fulfilment","raw":"### A. our desire for lives of fulfilment\n\n> 我们对充实生活的渴望\n\n**做题模式中的状态：** 当时A完整显示，但原文`lives of [xxx]`仍有遮挡。读到`leading to lives`后，我们已经发现理想生活处于结果端，却仍觉得追求这种生活也可能激发愿景，所以第一轮保留A，同时留下B。35题确定后回查，才根据全文不断交代判断依据的推进及首段因果位置排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nA借用了`lives of fulfilment`，再添上`our desire for`。原文给出的是信任科技所期待的生活结果，选项则把对结果的渴望写成过去愿景的激发来源；两者共享生活内容，却没有共享同一条因果关系。\n\n**出处：**\n\n> Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 A选项","focus":[93,106,741,58],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":31,"option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q31-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>我们对充实生活的渴望<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示，但原文<code>lives of [xxx]<\/code>仍有遮挡。读到<code>leading to lives<\/code>后，我们已经发现理想生活处于结果端，却仍觉得追求这种生活也可能激发愿景，所以第一轮保留A，同时留下B。35题确定后回查，才根据全文不断交代判断依据的推进及首段因果位置排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了<code>lives of fulfilment<\/code>，再添上<code>our desire for<\/code>。原文给出的是信任科技所期待的生活结果，选项则把对结果的渴望写成过去愿景的激发来源；两者共享生活内容，却没有共享同一条因果关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. our desire for lives of fulfilment","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 我们过去对未来的想象由我们对充实生活的渴望激发。\n\n`vision of the future`和`used to`把题目锁定在第一段，A的`lives of fulfilment`对应第二句的结果部分。定位时既要看见同样的名词，也要保留它前面的`leading to`。\n\n第二句先说科学技术将治愈人类弊病，再说这会带来充实生活和人人有机会。这是在解释当时的人为什么相信未来会好：他们相信科技有这样的能力。\n\n对充实生活抱有愿望在现实中可以理解，但原句没有陈述这一愿望如何激发未来观。把可期待的结果换成`desire`，再把它接到`inspired by`之后，就多出了一条愿望导致乐观的关系。\n\n因此，A复现了愿景的内容，却把“人们相信科技会带来的结果”改成了“使人们产生愿景的起因”。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 A选项","focus":[93,106,741,58],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":31,"option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q31-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>我们对充实生活的渴望<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示，但原文<code>lives of [xxx]<\/code>仍有遮挡。读到<code>leading to lives<\/code>后，我们已经发现理想生活处于结果端，却仍觉得追求这种生活也可能激发愿景，所以第一轮保留A，同时留下B。35题确定后回查，才根据全文不断交代判断依据的推进及首段因果位置排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了<code>lives of fulfilment<\/code>，再添上<code>our desire for<\/code>。原文给出的是信任科技所期待的生活结果，选项则把对结果的渴望写成过去愿景的激发来源；两者共享生活内容，却没有共享同一条因果关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>我们过去对未来的想象由我们对充实生活的渴望激发。<\/p>\n<\/blockquote>\n<p><code>vision of the future<\/code>和<code>used to<\/code>把题目锁定在第一段，A的<code>lives of fulfilment<\/code>对应第二句的结果部分。定位时既要看见同样的名词，也要保留它前面的<code>leading to<\/code>。<\/p>\n<p>第二句先说科学技术将治愈人类弊病，再说这会带来充实生活和人人有机会。这是在解释当时的人为什么相信未来会好：他们相信科技有这样的能力。<\/p>\n<p>对充实生活抱有愿望在现实中可以理解，但原句没有陈述这一愿望如何激发未来观。把可期待的结果换成<code>desire<\/code>，再把它接到<code>inspired by<\/code>之后，就多出了一条愿望导致乐观的关系。<\/p>\n<p>因此，A复现了愿景的内容，却把“人们相信科技会带来的结果”改成了“使人们产生愿景的起因”。<\/p>\n<\/section>"},{"title":"A. our desire for lives of fulfilment","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.\n>\n> Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.\n>\n> 先以科技能够解决弊病的信念描写过去的乐观，随后以认识到威胁解释现在的悲观。\n\n两段对照的是人们形成未来判断时所依据的理由：过去信任科技的能力，如今更注意各种威胁。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Our desire for fulfilling lives inspired these positive visions of the future.\n>\n> 我们对充实生活的渴望激发了这些积极的未来愿景。\n\nA所需的写法要把生活愿望明确接成愿景的来源。原文实际用科技能力作信念依据，随后又换成威胁认识，并没有把追求充实生活写成这组未来观变化的解释。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 A选项","focus":[93,106,741,58],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":31,"option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q31-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-A-0\"><blockquote>\n<p>我们对充实生活的渴望<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A完整显示，但原文<code>lives of [xxx]<\/code>仍有遮挡。读到<code>leading to lives<\/code>后，我们已经发现理想生活处于结果端，却仍觉得追求这种生活也可能激发愿景，所以第一轮保留A，同时留下B。35题确定后回查，才根据全文不断交代判断依据的推进及首段因果位置排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了<code>lives of fulfilment<\/code>，再添上<code>our desire for<\/code>。原文给出的是信任科技所期待的生活结果，选项则把对结果的渴望写成过去愿景的激发来源；两者共享生活内容，却没有共享同一条因果关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquot n<p>先以科技能够解决弊病的信念描写过去的乐观，随后以认识到威胁解释现在的悲观。<\/p>\n<\/blockquote>\n<p>两段对照的是人们形成未来判断时所依据的理由：过去信任科技的能力，如今更注意各种威胁。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Our desire for fulfilling lives inspired these positive visions of the future.<\/p>\n<p>我们对充实生活的渴望激发了这些积极的未来愿景。<\/p>\n<\/blockquote>\n<p>A所需的写法要把生活愿望明确接成愿景的来源。原文实际用科技能力作信念依据，随后又换成威胁认识，并没有把追求充实生活写成这组未来观变化的解释。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者看好人类的长期前景，不能单凭这一态度判断过去的乐观愿景具体由什么激发；还要分清第一段中信念的依据与期待的生活结果。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>our desire for lives of fulfilment<br>我们对充实生活的渴望<\/p>\n<\/blockquote>\n<p>想要美好生活与看好人类前景并不冲突，所以主旨本身不能排除A。本项最终仍要根据“leading to lives of fulfilment”这处局部原文判断：它处于科技解决弊病之后，是承诺实现的结果，不能据此改成愿景的激发来源。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. our faith in science and technology","raw":"### B. our faith in science and technology\n\n> 我们对科学技术的信心\n\n**做题模式中的状态：** 当时B完整显示；即使原文结果端`lives of [xxx]`尚未读全，`Science and technology would cure all the ills of humanity`仍能说明人们相信科技可以解决问题，因此第一轮保留B。那一轮A也保留，35题之后回查两项，才用首段因果位置和全文判断依据的变化选定B。\n\n**选项类型：正确跨句概括。**\n\n第一句说过去的未来图景总体十分乐观，第二句写人们相信科技将解决人类弊病。B用`faith in`概括这种信念，把乐观愿景及其支撑来源接在一起，没有把愿景中的结果当成原因。\n\n**出处：**\n\n> Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 B选项","focus":[93,193,795,69],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":31,"option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q31-B-0","html":"<section class=\"revealPart optionLead\" i ；句尾再写充实生活和机会，正是这种信心所承诺的结果。<\/p>\n<\/section>"},{"title":"B. our faith in science and technology","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> The Ever-bright Prospects of Mankind  \n> 人类始终光明的前景\n\n把这个主旨直接代入31题题干：\n\n> 全文主旨只能确认作者看好人类的长期前景，不能单凭这一态度判断过去的乐观愿景具体由什么激发；还要分清第一段中信念的依据与期待的生活结果。\n\nB实际说的是：\n\n> our faith in science and technology  \n> 我们对科学技术的信心\n\nB与全文看好长期前景的方向相容，但它被选中仍要由首段的具体依据落实。“Science and technology would cure”交代了过去人们相信的力量，首句的积极未来观由此得到解释。全文后来改用物种生存和历史知识支撑乐观，也是在继续追问未来判断靠什么成立。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 B选项","focus":[93,193,795,69],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":31,"option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q31-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-B-0\"><blockquote>\n<p>我们对科学技术的信心<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B完整显示；即使原文结果端<code>lives of [xxx]<\/code>尚未读全，<code>Science and technology would cure all the ills of humanity<\/code>仍能说明人们相信科技可以解决问题，因此第一轮保留B。那一轮A也保留，35题之后回查两项，才用首段因果位置和全文判断依据的变化选定B。<\/p>\n<p><strong>选项类型：正确跨句概括。<\/strong><\/p>\n<p>第一句说过去的未来图景总体十分乐观，第二句写人们相信科技将解决人类弊病。B用<code>faith in<\/code>概括这种信念，把乐观愿景及其支撑来源接在一起，没有把愿景中的结果当成原因。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>我们过去对未来的想象由我们对科学技术的信心激发。<\/p>\n<\/blockquote>\n<p>题干的<code>used to<\/code>对应<code>Up until a few decades ago<\/code>，B的<code>science and technology<\/code>对应首段第二句主语。<code>faith<\/code>虽然没有原词复现，却可以从人们相信科技将解决问题的写法读出。<\/p>\n<p>首句提供过去普遍乐观这一事实；第二句提供乐观的具体内容与依据：科学技术会治愈人类弊病，继而使生活更好。两句前后相接，才构成题干所问的解释。<\/p>\n<p>这里的信心属于当时人们的未来愿景，不能把<code>would cure all the ills<\/code>当成作者保证科技后来确实解决了一切问题。B表达的也是人们的信念，不是对科技成就的事实统计。<\/p>\n<p>B准确地把“相信科技能够带来改善”概括为“对科学技术的信心”，并保留它作为过去乐观愿景依据的关系。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-B-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<p>先说明过去的未来愿景总体乐观，接着写科技将解决人类弊病并带来更好的生活。<\/p>\n<\/blockquote>\n<p>后一句把前一句的乐观落到可理解的信念上：有能力改善生活的科技，使人们觉得未来值得期待。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>People pictured a positive future because they trusted science and technology to cure humanity’s ills.<\/p>\n<p>人们描绘积极的未来，是因为他们相信科学技术能够解决人类的弊病。<\/p>\n<\/blockquote>\n<p>B所要求的“信任科技的能力→积极愿景”在原文两句间能够接上；句尾再写充实生活和机会，正是这种信心所承诺的结果。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>The Ever-bright Prospects of Mankind<br>人类始终光明的前景<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者看好人类的长期前景，不能单凭这一态度判断过去的乐观愿景具体由什么激发；还要分清第一段中信念的依据与期待的生活结果。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>our faith in science and technology<br>我们对科学技术的信心<\/p>\n<\/blockquote>\n<p>B与全文看好长期前景的方向相容，但它被选中仍要由首段的具体依据落实。“Science and technology would cure”交代了过去人们相信的力量，首句的积极未来观由此得到解释。全文后来改用物种生存和历史知识支撑乐观，也是在继续追问未来判断靠什么成立。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<\/section>"},{"title":"C. our awareness of potential risks","raw":"### C. our awareness of potential risks\n\n> 我们对潜在风险的认识\n\n**做题模式中的状态：** 当时C完整显示。我们把风险认识与第一段过去的乐观图景比较，并注意到威胁意识出现在后面“现在”的视角中，所以第一轮排除C，之后没有重新保留。\n\n**错误类型：第一类——歪曲原意。**\n\nC借用第二段对威胁有更深认识的内容，却把它移到题干限定的“过去”。原文用这种认识解释现在乌托邦愿景失去吸引力，选项却让它激发过去的积极未来图景。\n\n**出处：**\n\n> Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.\n>\n> Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,281,720,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q31-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>我们对潜在风险的认识<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们把风险认识与第一段过去的乐观图景比较，并注意到威胁意识出现在后面“现在”的视角中，所以第一轮排除C，之后没有重新保留。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用第二段对威胁有更深认识的内容，却把它移到题干限定的“过去”。原文用这种认识解释现在乌托邦愿景失去吸引力，选项却让它激发过去的积极未来图景。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<p>Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. our awareness of potential risks","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 我们过去对未来的想象由我们对潜在风险的认识激发。\n\n`used to`限定过去，`awareness of potential risks`对应第二段的`a deeper appreciation of the range of threats`。这两处不能因为都谈未来就合并成同一时间背景。\n\n第一段先写过去相信科学技术能够解决弊病，第二段以`Now`切换到现在，以`as`引出人们更了解各种威胁。风险认识是原文确实交代的原因，但它属于现在的观念变化。\n\n不能泛化成“认识风险必然使人悲观”；此题只需保留本文已写明的时间和作用：这里的风险认识解释乌托邦愿景失宠，而不是首段那种科技信心。\n\nC把现在观念转变的依据搬成了过去愿景的依据，改动的是时间与因果归属。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,281,720,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q31-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>我们对潜在风险的认识<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们把风险认识与第一段过去的乐观图景比较，并注意到威胁意识出现在后面“现在”的视角中，所以第一轮排除C，之后没有重新保留。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用第二段对威胁有更深认识的内容，却把它移到题干限定的“过去”。原文用这种认识解释现在乌托邦愿景失去吸引力，选项却让它激发过去的积极未来图景。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<p>Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>我们过去对未来的想象由我们对潜在风险的认识激发。<\/p>\n<\/blockquote>\n<p><code>used to<\/code>限定过去，<code>awareness of potential risks<\/code>对应第二段的<code>a deeper appreciation of the range of threats<\/code>。这两处不能因为都谈未来就合并成同一时间背景。<\/p>\n<p>第一段先写过去相信科学技术能够解决弊病，第二段以<code>Now<\/code>切换到现在，以<code>as<\/code>引出人们更了解各种威胁。风险认识是原文确实交代的原因，但它属于现在的观念变化。<\/p>\n<p>不能泛化成“认识风险必然使人悲观”；此题只需保留本文已写明的时间和作用：这里的风险认识解释乌托邦愿景失宠，而不是首段那种科技信心。<\/p>\n<p>C把现在观念转变的依据搬成了过去愿景的依据，改动的是时间与因果归属。<\/p>\n<\/section>"},{"title":"C. our awareness of potential risks","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.\n>\n> But such gloominess is misplaced.\n>\n> 现在更认识各种威胁，于是对未来趋于悲观；作者接着指出这种悲观可能错位。\n\n第二、三段先说明当下悲观怎样产生，再对这份悲观作修正，它们承接的是`Now`这一时间线。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Our earlier visions of the future were inspired by an awareness of the risks ahead.\n>\n> 我们过去的未来愿景由对前方风险的认识激发。\n\nC只需让风险认识明确成为过去愿景的来源，并不需要声称风险没有其他作用。原文却把这一解释放在“现在”，而首段给出的是对科技的信任，两条时间线的依据不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,281,720,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q31-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>我们对潜在风险的认识<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们把风险认识与第一段过去的乐观图景比较，并注意到威胁意识出现在后面“现在”的视角中，所以第一轮排除C，之后没有重新保留。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用第二段对威胁有更深认识的内容，却把它移到题干限定的“过去”。原文用这种认识解释现在乌托邦愿景失去吸引力，选项却让它激发过去的积极未来图景。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<p>Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>我们过去对未来的想象由我们对潜在风险的认识激发。<\/p>\n<\/blockquote>\n<p><code>used to<\/code>限定过去，<code>awareness of potential risks<\/code>对应第二段的<code>a deeper appreciation of the range of threats<\/code>。这两处不能因为都谈未来就合并成同一时间背景。<\/p>\n<p>第一段先写过去相信科学技术能够解决弊病，第二段以<code>Now<\/code>切换到现在，以<code>as<\/code>引出人们更了解各种威胁。风险认识是原文确实交代的原因，但它属于现在的观念变化。<\/p>\n<p>不能泛化成“认识风险必然使人悲观”；此题只需保留本文已写明的时间和作用：这里的风险认识解释乌托邦愿景失宠，而不是首段那种科技信心。<\/p>\n<p>C把现在观念转变的依据搬成了过去愿景的依据，改动的是时间与因果归属。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关段落是这样写的：<\/p>\n<blockquote>\n<p>Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.<\/p>\n<p>But such gloominess is misplaced.<\/p>\n<p>现在更认识各种威胁，于是对未来趋于悲观；作者接着指出这种悲观可能错位。<\/p>\n<\/blockquote>\n<p>第二、三段先说明当下悲观怎样产生，再对这份悲观作修正，它们承接的是<code>Now<\/code>这一时间线。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Our earlier visions of the future were inspired by an awareness of the risks ahead.<\/p>\n<p>我们过去的未来愿景由对前方风险的认识激发。<\/p>\n<\/blockquote>\n<p>C只需让风险认识明确成为过去愿景的来源，并不需要声称风险没有其他作用。原文却把这一解释放在“现在”，而首段给出的是对科技的信任，两条时间线的依据不同。<\/p>\n<\/section>"},{"title":"C. our awareness of potential risks","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> The Ever-bright Prospects of Mankind  \n> 人类始终光明的前景\n\n把这个主旨直接代入31题题干：\n\n> 全文主旨只能确认作者看好人类的长期前景，不能单凭这一态度判断过去的乐观愿景具体由什么激发；还要分清第一段中信念的依据与期待的生活结果。\n\n但C实际说的是：\n\n> our awareness of potential risks  \n> 我们对潜在风险的认识\n\n作者看好长期前景，并不意味着他从不讨论风险，所以不能只凭乐观主旨否定C。本项最终仍要根据“Now”及后面的风险认识判断：它解释现在的悲观转向，题干问的是过去的愿景来源，时间范围没有对上。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,281,720,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q31-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>我们对潜在风险的认识<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C完整显示。我们把风险认识与第一段过去的乐观图景比较，并注意到威胁意识出现在后面“现在”的视角中，所以第一轮排除C，之后没有重新保留。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用第二段对威胁有更深认识的内容，却把它移到题干限定的“过去”。原文用这种认识解释现在乌托邦愿景失去吸引力，选项却让它激发过去的积极未来图景。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely – though by no means uniformly – glowingly positive. Science and technology would cure all the ills of human 并不意味着他从不讨论风险，所以不能只凭乐观主旨否定C。本项最终仍要根据“Now”及后面的风险认识判断：它解释现在的悲观转向，题干问的是过去的愿景来源，时间范围没有对上。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. our belief in equal opportunity","raw":"### D. our belief in equal opportunity\n\n> 我们对机会平等的信念\n\n**做题模式中的状态：** 当时选项是`our belief in [xxx] opportunity`，我们未读出机会的修饰语。仍能看见原文`opportunity for all`在`leading to`之后，属于科技解决弊病带来的结果；选项把对机会的信念当成愿景起因，因此第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n`equal opportunity`借用了`opportunity for all`，但选项不只是把“人人有机会”换一种说法。加上`our belief in`并接回题干后，它变成激发未来愿景的信念，而原文把机会放在科技改善生活的结果端。\n\n**出处：**\n\n> Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[93,369,704,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"option","question":31,"option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q31-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>我们对机会平等的信念<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项是<code>our belief in [xxx] opportunity<\/code>，我们未读出机会的修饰语。仍能看见原文<code>opportunity for all<\/code>在<code>leading to<\/code>之后，属于科技解决弊病带来的结果；选项把对机会的信念当成愿景起因，因此第一轮排除D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p><code>equal opportunity<\/code>借用了<code>opportunity for all<\/code>，但选项不只是把“人人有机会”换一种说法。加上<code>our belief in<\/code>并接回题干后，它变成激发未来愿景的信念，而原文把机会放在科技改善生活的结果端。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. our belief in equal opportunity","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 我们过去对未来的想象由我们对机会平等的信念激发。\n\nD的`opportunity`对应第一段第二句的`opportunity for all`，题干的`inspired by`则要求检查这一内容在原句中是否承担原因作用。\n\n原句以科学技术为主语，说它们将治愈弊病；`leading to`引出充实生活和人人有机会。这两项并列出现，都是当时人们相信科技可能带来的美好生活。\n\n即使允许`equal opportunity`概括人人有机会，名词内容接近也不足以证明整项。原文没有说机会平等的信念推动人们形成了过去的未来观。\n\nD把愿景中的一项结果改成愿景的激发来源，问题在因果位置，不在是否认识`equal`这个修饰语。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[93,369,704,68],"sourceW":1452,"sourceH":2561},"meta":{"kind":"method","question":31,"option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q31-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>我们对机会平等的信念<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项是<code>our belief in [xxx] opportunity<\/code>，我们未读出机会的修饰语。仍能看见原文<code>opportunity for all<\/code>在<code>leading to<\/code>之后，属于科技解决弊病带来的结果；选项把对机会的信念当成愿景起因，因此第一轮排除D。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p><code>equal opportunity<\/code>借用了<code>opportunity for all<\/code>，但选项不只是把“人人有机会”换一种说法。加上<code>our belief in<\/code>并接回题干后，它变成激发未来愿景的信念，而原文把机会放在科技改善生活的结果端。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>我们过去对未来的想象由我们对机会平等的信念激发。<\/p>\n<\/blockquote>\n<p>D的<code>opportunity<\/code>对应第一段第二句的<code>opportunity for all<\/code>，题干的<code>inspired by<\/code>则要求检查这一内容在原句中是否承担原因作用。<\/p>\n<p>原句以科学技术为主语，说它们将治愈弊病；<code>leading to<\/code>引出充实生活和人人有机会。这两项并列出现，都是当时人们相信科技可能带来的美好生活。<\/p>\n<p>即使允许<code>equal opportunity<\/code>概括人人有机会，名词内容接近也不足以证明整项。原文没有说机会平等的信念推动人们形成了过去的未来观。<\/p>\n<p>D把愿景中的一项结果改成愿景的激发来源，问题在因果位置，不在是否认识<code>equal<\/code>这个修饰语。<\/p>\n<\/section>"},{"title":"D. our belief in equal opportunity","raw":"#### 写作视角法\n\n原文相关段落是这样写的：\n\n> Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.\n>\n> 人们相信科技将治愈弊病，并由此带来充实生活和人人有机会。\n\n这句话先提供实现美好未来的力量，再列出它
