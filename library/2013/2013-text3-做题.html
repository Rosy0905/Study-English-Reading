<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**Our vision of the future used to be inspired by ______.**\n\n> 我们过去对未来的想象由什么激发？\n\n题型：**具体细节题**。\n\n---","html":"<h2>31题题干</h2>\n<p><strong>Our vision of the future used to be inspired by ______.</strong></p>\n<blockquote>\n<p>我们过去对未来的想象由什么激发？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,157,625,34],[231,209,441,29]],"scrollTarget":null,"meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**The IUCN’s “Red List” suggests that human beings are ______.**\n\n> IUCN“红色名录”表明人类是什么样的物种？\n\n题型：**具体细节题**。\n\n---","html":"<h2>32题题干</h2>\n<p><strong>The IUCN’s “Red List” suggests that human beings are ______.</strong></p>\n<blockquote>\n<p>IUCN“红色名录”表明人类是什么样的物种？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,471,847,37],[231,525,250,35]],"scrollTarget":null,"meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**Which of the following is true according to Paragraph 5?**\n\n> 根据第五段，下面哪项正确？\n\n题型：**具体细节题**。\n\n---","html":"<h2>33题题干</h2>\n<p><strong>Which of the following is true according to Paragraph 5?</strong></p>\n<blockquote>\n<p>根据第五段，下面哪项正确？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,788,753,35],[230,841,586,28]],"scrollTarget":null,"meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"## 34题题干\n\n**To ensure the future of mankind, it is crucial to ______.**\n\n> 为了保障人类的未来，关键是什么？\n\n题型：**局部推断题**。\n\n---","html":"<h2>34题题干</h2>\n<p><strong>To ensure the future of mankind, it is crucial to ______.</strong></p>\n<blockquote>\n<p>为了保障人类的未来，关键是什么？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,1104,646,34],[230,1157,506,34]],"scrollTarget":null,"meta":{"kind":"stem","qid":"34"}},{"section":"先读题干","raw":"## 35题题干\n\n**Which of the following would be the best title for the text?**\n\n> 下面哪个标题最适合这篇文章？\n\n题型：**全文作者观点／全文主旨题**。\n\n---","html":"<h2>35题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下面哪个标题最适合这篇文章？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[185,1420,782,35],[230,1473,405,34]],"scrollTarget":null,"meta":{"kind":"stem","qid":"35"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Now, But, So, To be sure |\n| 态度词 / 评价词 | 先抓个大概好坏 | positive, gloominess, excellent, pessimistic |\n| 动作词 | 先看谁做了什么 | cure, survive, forecast, reduce |\n| 结果词 | 看最后出了什么事 | little future, excellent chance, improve the lot |\n| 重复主题词 | 大概知道老在说什么 | future, humanity, species, risks |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>Now, But, So, To be sure</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>positive, gloominess, excellent, pessimistic</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>cure, survive, forecast, reduce</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>little future, excellent chance, improve the lot</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>future, humanity, species, risks</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"Up until a few decades ago, our visions of the future were largely—though by no means uniformly—glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of **[xxx]** and opportunity for all.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Up until a few decades ago, our visions of the future were largely—though by no means uniformly—glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of <span class=\"mask\">[xxx]</span> and opportunity for all.</p>\n</div></div>","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse","coarse":true,"pid":0,"form":0},"contextRaw":""},{"section":"读文章","raw":"Up until a few decades ago, our visions of the future were largely—though by no means uniformly—glowingly positive. / Science and technology would cure all the ills of humanity, leading to lives of **[xxx]** and opportunity for all.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Up until a few decades ago, our visions of the future were largely—though by no means uniformly—glowingly positive. / Science and technology would cure all the ills of humanity, leading to lives of <span class=\"mask\">[xxx]</span> and opportunity for all.</p>\n</div></div>","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse","coarse":true,"pid":0," 走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住过去乐观、现在悲观、红色名录、长期时钟、近期复杂和结尾的风险；这些信息之间到底是什么关系，等题目问到再精读。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个时间范围、某种风险或某类判断时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章开头好像说几十年前大家对未来很乐观，随后又出现如今的威胁和悲观；中间写化石记录、红色名录、长期生存与几千年后的时钟；后面承认近期未来很复杂，又说过去能帮助预测，结尾出现悲观可能只是短暂风潮以及人类减少风险的能力。</p>\n<p>到这里还不能自然地说清楚：过去的乐观由什么激发，现在的悲观为什么可能放错地方，红色名录与人类未来怎样连接，为什么遥远未来反而可能比近期未来更容易讨论，结尾的有限乐观能否概括全文。粗读时只要能判断“这篇文章大概在谈人类未来、风险和长期前景”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住过去乐观、现在悲观、红色名录、长期时钟、近期复杂和结尾的风险；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35],[225,368,943,34],[165,410,1002,34],[165,452,1003,34],[165,494,103,29],[225,537,942,34],[165,579,1002,34],[165,621,1002,35],[165,663,1002,35],[164,704,1003,36],[165,747,1002,35],[165,790,998,35],[225,875,942,34],[165,917,1002,35],[165,959,1002,35],[165,1002,733,34],[225,1040,942,43],[165,1086,999,35],[165,1128,1002,35],[166,1171,1001,34],[165,1213,1003,35],[225,1298,942,34],[165,1340,1002,35],[165,1382,998,35],[165,1424,1002,35],[215,1467,413,28],[225,1509,942,35],[165,1551,1002,35],[165,1594,1004,34],[165,1636,592,34]],"questionRects":[],"scrollTarget":null,"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做31至34题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做31至34题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"method_intro"}},{"section":"31题","raw":"## 31题\n\n> Our vision of the future used to be inspired by ______.  \n> 我们过去对未来的想象由什么激发？\n\n题干中的“our vision of the future”直接对应第一段开头的“our visions of the future”，所以回到第一段整段读。\n\n> 原文参考：\n>\n> Up until a few decades ago, our visions of the future were largely—though by no means uniformly—glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of **[xxx]** and opportunity for all.\n>\n> 开始精读：\n>\n> Up until a few decades ago, our visions of the future were largely—though by no means uniformly—glowingly positive. / Science and technology would cure all the ills of humanity, leading to lives of **[xxx]** and opportunity for all.\n>\n> 顺着英文顺序读：\n>\n> 直到几十年前，我们对未来的想象大体上都非常乐观，尽管并非人人如此。 / 人们相信科学和技术会治愈人类的一切弊病，带来 **[xxx]** 的生活，并让所有人都有机会。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>31题</h2>\n<blockquote>\n<p>Our vision of the future used to be inspired by ______.<br />\n我们过去对未来的想象由什么激发？</p>\n</blockquote>\n<p>题干中的“our vision of the future”直接对应第一段开头的“our visions of the future”，所以回到第一段整段读。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Up until a few decades ago, our visions of the future were largely—though by no means uniformly—glowingly positive. Science and technology would cure all the ills of humanity, leading to lives of <strong>[xxx]</strong> and opportunity for all.</p>\n<p>开始精读：</p>\n<p>Up until a few decades ago, our visions of the future were largely—though by no means uniformly—glowingly positive. / Science and technology would cure all the ills of humanity, leading to lives of <strong>[xxx]</strong> and opportunity for all.</p>\n<p>顺着英文顺序读：</p>\n<p>直到几十年前，我们对未来的想象大体上都非常乐观，尽管并非人人如此。 / 人们相信科学和技术会治愈人类的一切弊病，带来 <strong>[xxx]</strong> 的生活，并让所有人都有机会。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35]],"questionRects":[[185,157,625,34],[231,209,441,29],[230,262,474,34],[230,315,430,34],[317,367,333,35]],"scrollTarget":null,"meta":{"kind":"question","qid":"31"}},{"section":"31题","raw":"### A. our desire for lives of fulfilment\n\n> 我们对充实生活的渴望\n\n把A接回题干，它说的是：我们过去对未来的想象由追求充实生活的愿望激发。\n\nA里的“desire for lives of fulfilment”和原文“leading to lives”都提到理想生活，因为一种结果也可能成为人们形成愿景的动力，所以回看第一段第二句。\n\n> Science and technology would cure all the ills of humanity, leading to lives of **[xxx]** and opportunity for all.\n\n原文“leading to lives”把某种生活放在科学技术治愈弊病之后，作为结果；A的“desire for lives of fulfilment”把对这种生活的渴望放到inspired by后面，作为愿景的起因。因果位置不同，但理想结果确实可能被理解成愿景动力，句子尚未完全排除这种读法。\n\n**“科学技术会带来某种生活”，能不能也理解为人们对这种生活的渴望激发了愿景？**\n\n可以形成间接联系。A不是原句最直接的主语，但理想生活与积极愿景之间仍可能相连，因此先保留。\n\n**第一轮判断：A保留。**","html":"<h3>A. our desire for lives of fulfilment</h3>\n<blockquote>\n<p>我们对充实生活的渴望</p>\n</blockquote>\n<p>把A接回题干，它说的是：我们过去对未来的想象由追求充实生活的愿望激发。</p>\n<p>A里的“desire for lives of fulfilment”和原文“leading to lives”都提到理想生活，因为一种结果也可能成为人们形成愿景的动力，所以回看第一段第二句。</p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of <strong>[xxx]</strong> and opportunity for all.</p>\n</blockquote>\n<p>原文“leading to lives”把某种生活放在科学技术治愈弊病之后，作为结果；A的“desire for lives of fulfilment”把对这种生活的渴望放到inspired by后面，作为愿景的起因。因果位置不同，但理想结果确实可能被理解成愿景动力，句子尚未完全排除这种读法。</p>\n<p><strong>“科学技术会带来某种生活”，能不能也理解为人们对这种生活的渴望激发了愿景？</strong></p>\n<p>可以形成间接联系。A不是原句最直接的主语，但理想生活与积极愿景之间仍可能相连，因此先保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35]],"questionRects":[[185,157,625,34],[231,209,441,29],[230,262,474,34],[230,315,430,34],[317,367,333,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"31","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“desire for lives of fulfilment”和原文“leading to lives”都提到理想生活，因为一种结果也可能成为人们形成愿景的动力，所以回看第一段第二句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"leading to lives","visibleOptionAnchor":"desire for lives of fulfilment"}}}},{"section":"31题","raw":"### B. our faith in science and technology\n\n> 我们对科学技术的信心\n\n把B接回题干，它说的是：我们过去对未来的想象由对科学技术的信心激发。\n\nB里的“faith in science and technology”和原文“Science and technology would cure all the ills of humanity”都在写人们相信科技能解决问题，因为would cure体现这种信心，所以回看第一段第二句。\n\n> Science and technology would cure all the ills of humanity, leading to lives of **[xxx]** and opportunity for all.\n\n原文“Science and technology would cure all the ills of humanity”把过去的乐观愿景建立在科技可以治愈所有弊病的信念上；B的“faith in science and technology”正好概括这种信念。主体和因果方向一致。\n\n**相信科学技术能治愈人类一切弊病，是否就是对科学技术有信心？**\n\n能。B直接抓住了过去乐观愿景的支撑来源。\n\n**第一轮判断：B保留。**","html":"<h3>B. our faith in science and technology</h3>\n<blockquote>\n<p>我们对科学技术的信心</p>\n</blockquote>\n<p>把B接回题干，它说的是：我们过去对未来的想象由对科学技术的信心激发。</p>\n<p>B里的“faith in science and technology”和原文“Science and technology would cure all the ills of humanity”都在写人们相信科技能解决问题，因为would cure体现这种信心，所以回看第一段第二句。</p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of <strong>[xxx]</strong> and opportunity for all.</p>\n</blockquote>\n<p>原文“Science and technology would cure all the ills of humanity”把过去的乐观愿景建立在科技可以治愈所有弊病的信念上；B的“faith in science and technology”正好概括这种信念。主体和因果方向一致。</p>\n<p><strong>相信科学技术能治愈人类一切弊病，是否就是对科学技术有信心？</strong></p>\n<p>能。B直接抓住了过去乐观愿景的支撑来源。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35]],"questionRects":[[185,157,625,34],[231,209,441,29],[230,262,474,34],[230,315,430,34],[317,367,333,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"31","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“faith in science and technology”和原文“Science and technology would cure all the ills of humanity”都在写人们相信科技能解决问题，因为would cure体现这种信心，所以回看第一段第二句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"Science and technology would cure all the ills of humanity","visibleOptionAnchor":"faith in science and technology"}}}},{"section":"31题","raw":"### C. our awareness of potential risks\n\n> 我们对潜在风险的认识\n\n把C接回题干，它说的是：我们过去对未来的想象由对潜在风险的认识激发。\n\nC里的“awareness of potential risks”和原文“glowingly positive”都描述过去看待未来的心理状态，因为一个强调风险、一个强调高度乐观，所以回看第一段第一句。\n\n> Up until a few decades ago, our visions of the future were largely—though by no means uniformly—glowingly positive.\n\n原文“glowingly positive”说过去的未来想象总体非常乐观；C的“awareness of potential risks”却把推动力写成对潜在危险的认识。一个弱化风险，一个突出风险，态度方向相反。\n\n**高度乐观的未来想象，是否由对潜在风险的认识激发？**\n\n不是。第一段的过去视角相信科技会解决问题，风险意识是在后面“现在”的视角中出现的。\n\n**第一轮判断：C排除。**","html":"<h3>C. our awareness of potential risks</h3>\n<blockquote>\n<p>我们对潜在风险的认识</p>\n</blockquote>\n<p>把C接回题干，它说的是：我们过去对未来的想象由对潜在风险的认识激发。</p>\n<p>C里的“awareness of potential risks”和原文“glowingly positive”都描述过去看待未来的心理状态，因为一个强调风险、一个强调高度乐观，所以回看第一段第一句。</p>\n<blockquote>\n<p>Up until a few decades ago, our visions of the future were largely—though by no means uniformly—glowingly positive.</p>\n</blockquote>\n<p>原文“glowingly positive”说过去的未来想象总体非常乐观；C的“awareness of potential risks”却把推动力写成对潜在危险的认识。一个弱化风险，一个突出风险，态度方向相反。</p>\n<p><strong>高度乐观的未来想象，是否由对潜在风险的认识激发？</strong></p>\n<p>不是。第一段的过去视角相信科技会解决问题，风险意识是在后面“现在”的视角中出现的。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35]],"questionRects":[[185,157,625,34],[231,209,441,29],[230,262,474,34],[230,315,430,34],[317,367,333,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"31","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“awareness of potential risks”和原文“glowingly positive”都描述过去看待未来的心理状态，因为一个强调风险、一个强调高度乐观，所以回看第一段第一句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"glowingly positive","visibleOptionAnchor":"awareness of potential risks"}}}},{"section":"31题","raw":"### D. our belief in **[xxx]** opportunity\n\n> 我们对 **[xxx]** 机会的信念\n\n把D接回题干，它说的是：我们过去对未来的想象由对某种机会的信念激发。\n\nD里的“belief in opportunity”和原文“opportunity for all”都出现opportunity，因为题干问愿景的来源，所以回看第一段第二句中它在句子里的位置。\n\n> Science and technology would cure all the ills of humanity, leading to lives of **[xxx]** and opportunity for all.\n\n原文“opportunity for all”放在leading to后面，是科学技术治愈弊病之后带来的结果；D的“belief in opportunity”却把机会信念放到inspired by后面当作原因。词面相同，但因果位置被调换。\n\n**作为科技进步结果的opportunity，能不能直接变成激发愿景的原因？**\n\n不能直接变成。被遮挡的修饰词不会改变opportunity位于leading to结果端这一结构。\n\n**第一轮判断：D排除。**","html":"<h3>D. our belief in <strong>[xxx]</strong> opportunity</h3>\n<blockquote>\n<p>我们对 <strong>[xxx]</strong> 机会的信念</p>\n</blockquote>\n<p>把D接回题干，它说的是：我们过去对未来的想象由对某种机会的信念激发。</p>\n<p>D里的“belief in opportunity”和原文“opportunity for all”都出现opportunity，因为题干问愿景的来源，所以回看第一段第二句中它在句子里的位置。</p>\n<blockquote>\n<p>Science and technology would cure all the ills of humanity, leading to lives of <strong>[xxx]</strong> and opportunity for all.</p>\n</blockquote>\n<p>原文“opportunity for all”放在leading to后面，是科学技术治愈弊病之后带来的结果；D的“belief in opportunity”却把机会信念放到inspired by后面当作原因。词面相同，但因果位置被调换。</p>\n<p><strong>作为科技进步结果的opportunity，能不能直接变成激发愿景的原因？</strong></p>\n<p>不能直接变成。被遮挡的修饰词不会改变opportunity位于leading to结果端这一结构。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35]],"questionRects":[[185,157,625,34],[231,209,441,29],[230,262,474,34],[230,315,430,34],[317,367,333,35]],"scrollTarget":null,"meta":{"kind":"option","qid":"31","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“belief in opportunity”和原文“opportunity for all”都出现opportunity，因为题干问愿景的来源，所以回看第一段第二句中它在句子里的位置。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":" t we have an excellent chance of surviving for tens, if not hundreds, of thousands of years. / Look up Homo sapiens in the “Red List” of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, **[xxx]**, currently increasing, and there are no major threats resulting in an overall population decline.”\n>\n> 顺着英文顺序读：\n>\n> 但是，这种 **[xxx]** 放错了位置。 / **[xxx]** 记录表明，许多物种已经 **[xxx]** 了数百万年——我们为什么不能如此？ / 从更广阔的角度看人类在宇宙中的位置，就会清楚地发现，我们极有可能继续生存数万年，甚至数十万年。 / 在国际自然保护联盟IUCN的受威胁物种“红色名录”中查找智人，你会读到：“被列为无危，因为这一物种分布十分广泛、**[xxx]**、数量正在增加，而且没有造成总体种群下降的重大威胁。”\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>32题</h2>\n<blockquote>\n<p>The IUCN’s “Red List” suggests that human beings are ______.<br />\nIUCN“红色名录”表明人类是什么样的物种？</p>\n</blockquote>\n<p>题干已经给出IUCN。第三段出现IUCN及其Red List的完整描述，所以直接把第三段读全。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But such <strong>[xxx]</strong> is misplaced. The <strong>[xxx]</strong> record shows that many species have <strong>[xxx]</strong> for millions of years—so why shouldn’t we? Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years. Look up Homo sapiens in the “Red List” of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, <strong>[xxx]</strong>, currently increasing, and there are no major threats resulting in an overall population decline.”</p>\n<p>开始精读：</p>\n<p>But such <strong>[xxx]</strong> is misplaced. / The <strong>[xxx]</strong> record shows that many species have <strong>[xxx]</strong> for millions of years—so why shouldn’t we? / Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years. / Look up Homo sapiens in the “Red List” of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, <strong>[xxx]</strong>, currently increasing, and there are no major threats resulting in an overall population decline.”</p>\n<p>顺着英文顺序读：</p>\n<p>但是，这种 <strong>[xxx]</strong> 放错了位置。 / <strong>[xxx]</strong> 记录表明，许多物种已经 <strong>[xxx]</strong> 了数百万年——我们为什么不能如此？ / 从更广阔的角度看人类在宇宙中的位置，就会清楚地发现，我们极有可能继续生存数万年，甚至数十万年。 / 在国际自然保护联盟IUCN的受威胁物种“红色名录”中查找智人，你会读到：“被列为无危，因为这一物种分布十分广泛、<strong>[xxx]</strong>、数量正在增加，而且没有造成总体种群下降的重大威胁。”</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[225,537,942,34],[165,579,1002,34],[165,621,1002,35],[165,663,1002,35],[164,704,1003,36],[165,747,1002,35],[165,790,998,35]],"questionRects":[[185,471,847,37],[231,525,250,35],[230,578,274,34],[230,630,388,35],[292,683,316,28]],"scrollTarget":null,"meta":{"kind":"question","qid":"32"}},{"section":"32题","raw":"### A. a misplaced race\n\n> 一个位置不当的种族\n\n把A接回题干，它说的是：IUCN红色名录表明人类是一个位置不当的种族。\n\nA里的“a misplaced race”和原文“Listed as Least Concern”都像是在给人类作分类，因为题干问Red List怎样描述人类，所以回看第三段最后一句的正式分类。\n\n> Look up Homo sapiens in the “Red List” of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, **[xxx]**, currently increasing, and there are no major threats resulting in an overall population decline.”\n\n原文“Listed as Least Concern”把Homo sapiens归为“无危”，并说明分布广、数量增加；A的“a misplaced race”却把前面misplaced一词错误地挂到race上，写成人类所处位置不当。分类内容和修饰对象都不同。\n\n**Red List把人类列为Least Concern，是否等于把人类称作misplaced race？**\n\n不等于。misplaced修饰的是前文的悲观情绪，而Red List对人类的分类是Least Concern。\n\n**第一轮判断：A排除。**","html":"<h3>A. a misplaced race</h3>\n<blockquote>\n<p>一个位置不当的种族</p>\n</blockquote>\n<p>把A接回题干，它说的是：IUCN红色名录表明人类是一个位置不当的种族。</p>\n<p>A里的“a misplaced race”和原文“Listed as Least Concern”都像是在给人类作分类，因为题干问Red List怎样描述人类，所以回看第三段最后一句的正式分类。</p>\n<blockquote>\n<p>Look up Homo sapiens in the “Red List” of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, <strong>[xxx]</strong>, currently increasing, and there are no major threats resulting in an overall population decline.”</p>\n</blockquote>\n<p>原文“Listed as Least Concern”把Homo sapiens归为“无危”，并说明分布广、数量增加；A的“a misplaced race”却把前面misplaced一词错误地挂到race上，写成人类所处位置不当。分类内容和修饰对象都不同。</p>\n<p><strong>Red List把人类列为Least Concern，是否等于把人类称作misplaced race？</strong></p>\n<p>不等于。misplaced修饰的是前文的悲观情绪，而Red List对人类的分类是Least Concern。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[225,537,942,34],[165,579,1002,34],[165,621,1002,35],[165,663,1002,35],[164,704,1003,36],[165,747,1002,35],[165,790,998,35]],"questionRects":[[185,471,847,37],[231,525,250,35],[230,578,274,34],[230,630,388,35],[292,683,316,28]],"scrollTarget":null,"meta":{"kind":"option","qid":"32","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“a misplaced race”和原文“Listed as Least Concern”都像是在给人类作分类，因为题干问Red List怎样描述人类，所以回看第三段最后一句的正式分类。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["modifier_attachment","subject"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"Listed as Least Concern","visibleOptionAnchor":"a misplaced race"}}}},{"section":"32题","raw":"### B. a sustained species\n\n> 一个能够延续的物种\n\n把B接回题干，它说的是：IUCN红色名录表明人类是一个能够延续的物种。\n\nB里的“a sustained species”和原文“an excellent chance of surviving”都在写人类能否长期延续，因为surviving与sustained意思接近，所以回看第三段后半部分。\n\n> Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years. Look up Homo sapiens in the “Red List” of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, **[xxx]**, currently increasing, and there are no major threats resulting in an overall population decline.”\n\n原文“an excellent chance of surviving”说明人类很可能继续生存数万乃至数十万年，Red List又给出Least Concern和数量增加；B的“a sustained species”概括的正是这种能够延续的状态，两边说的是同一生存趋势。\n\n**很可能长期生存且数量正在增加，能不能说明人类是能够延续的物种？**\n\n能。B概括了Red List及其上下文共同给出的生存状态。\n\n**第一轮判断：B保留。**","html":"<h3>B. a sustained species</h3>\n<blockquote>\n<p>一个能够延续的物种</p>\n</blockquote>\n<p>把B接回题干，它说的是：IUCN红色名录表明人类是一个能够延续的物种。</p>\n<p>B里的“a sustained species”和原文“an excellent chance of surviving”都在写人类能否长期延续，因为surviving与sustained意思接近，所以回看第三段后半部分。</p>\n<blockquote>\n<p>Take a broader look at our species’ place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years. Look up Homo sapiens in the “Red List” of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: “Listed as Least Concern as the species is very widely distributed, <strong>[xxx]</strong>, currently increasing, and there are no major threats resulting in an overall population decline.”</p>\n</blockquote>\n<p>原文“an excellent chance of surviving”说明人类很可能继续生存数万乃至数十万年，Red List又给出Least Concern和数量增加；B的“a sustained species”概括的正是这种能够延续的状态，两边说的是同一生存趋势。</p>\n<p><strong>很可能长期生存且数量正在增加，能不能说明人类是能够延续的物种？</strong></p>\n<p>能。B概括了Red List及其上下文共同给出的生存状态。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[225,537,942,34],[165,579,1002,34],[165,621,1002,35],[165,663,1002,35],[164,704,1003,36],[165,747,1002,35],[165,790,998,35]],"questionRects":[[185,471,847,37],[231,525,250,35],[230,578,274,34],[230,630,388,35],[292,683,316,28]],"scrollTarget":null,"meta":{"kind":"option","qid":"32","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“a sustained species”和原文“an excellent chance of surviving”都在写人类能否长期延续，因为surviving与sustained意思接近，所以回看第三段后半部分。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"an excellent chance of surviving","visibleOptionAnchor":"a sustained species"}}}},{"section":"32题","raw":"### C. the world’s dominant power\n\n> 世界的主导力量\n\n把C接回题干，它说的是：IUCN红色名录表明人类是世界的主导力量。\n\nC里的“the world’s dominant power”和原文“very widely distributed”都可能让人联想到人类在世界上的范围，因为题干问Red List的结论，所以回看最后一句具体列出的生存指标。\n\n> Listed as Least Concern as the species is very widely distributed, **[xxx]**, currently increasing, and there are no major threats resulting in an overall population decline.\n\n原文“very widely distributed”只说明物种分布广，并与数量增加、无重大种群下降威胁并列；C的“the world’s dominant power”却增加了支配世界的权力关系。分布范围不等于支配地位。\n\n**分布广、数量增加，是否就等于成为世界的主导力量？**\n\n不等于。Red List评估的是物种受威胁程度和生存状况，不是政治或生态支配力。\n\n**第一轮判断：C排除。**","html":"<h3>C. the world’s dominant power</h3>\n<blockquote>\n<p>世界的主导力量</p>\n</blockquote>\n<p>把C接回题干，它说的是：IUCN红色名录表明人类是世界的主导力量。</p>\n<p>C里的“the world’s dominant power”和原文“very widely distributed”都可能让人联想到人类在世界上的范围，因为题干问Red List的结论，所以回看最后一句具体列出的生存指标。</p>\n<blockquote>\n<p>Listed as Least Concern as the species is very widely distributed, <strong>[xxx]</strong>, currently increasing, and there are no major threats resulting in an overall population decline.</p>\n</blockquote>\n<p>原文“very widely distributed”只说明物种分布广，并与数量增加、无重大种群下降威胁并列；C的“the world’s dominant power”却增加了支配世界的权力关系。分布范围不等于支配地位。</p>\n<p><strong>分布广、数量增加，是否就等于成为世界的主导力量？</strong></p>\n<p>不等于。Red List评估的是物种受威胁程度和生存状况，不是政治或生态支配力。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[225,537,942,34],[165,579,1002,34],[165,621,1002,35],[165,663,1002,35],[164,704,1003,36],[165,747,1002,35],[165,790,998,35]],"questionRects":[[185,471,847,37],[231,525,250,35],[230,578,274,34],[230,630,388,35],[292,683,316,28]],"scrollTarget":null,"meta":{"kind":"option","qid":"32","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“the world’s dominant power”和原文“very widely distributed”都可能让人联想到人类在世界上的范围，因为题干问Red List的结论，所以回看最后一句具体列出的生存指标。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"very widely distributed","visibleOptionAnchor":"the world’s dominant power"}}}},{"section":"32题","raw":"### D. a threat to the **[xxx]**\n\n> 对 **[xxx]** 的威胁\n\n把D接回题干，它说的是：IUCN红色名录表明人类会威胁某个对象。\n\nD里的“human beings are a threat”和原文“no major threats resulting in an overall population decline”都出现威胁关系，因为一个让人类充当威胁源、一个让威胁作用于人类种群，所以回看Red List引文末尾。\n\n> Listed as Least Concern as the species is very widely distributed, **[xxx]**, currently increasing, and there are no major threats resulting in an overall population decline.\n\n原文“no major threats resulting in an overall population decline”说没有重大威胁正在造成人类种群下降，人类是受威胁评估的对象；D的“human beings are a threat”却把人类变成威胁的发出者。关系方向被倒转。\n\n**Red List说人类没有遭受导致种群下降的重大威胁，是否等于说人类会威胁别的对象？**\n\n不等于。一个判断威胁是否作用于人类，一个判断人类是否威胁他者，主客体相反。\n\n**第一轮判断：D排除。**","html":"<h3>D. a threat to the <strong>[xxx]</strong></h3>\n<blockquote>\n<p>对 <strong>[xxx]</strong> 的威胁</p>\n</blockquote>\n<p>把D接回题干，它说的是：IUCN红色名录表明人类会威胁某个对象。</p>\n<p>D里的“human beings are a threat”和原文“no major threats resulting in an overall population decline”都出现威胁关系，因为一个让人类充当威胁源、一个让威胁作用于人类种群，所以回看Red List引文末尾。</p>\n<blockquote>\n<p>Listed as Least Concern as the species is very widely distributed, <strong>[xxx]</strong>, currently increasing, and there are no major threats resulting in an overall population decline.</p>\n</blockquote>\n<p>原文“no major threats resulting in an overall population decline”说没有重大威胁正在造成人类种群下降，人类是受威胁评估的对象；D的“human beings are a threat”却把人类变成威胁的发出者。关系方向被倒转。</p>\n<p><strong>Red List说人类没有遭受导致种群下降的重大威胁，是否等于说人类会威胁别的对象？</strong></p>\n<p>不等于。一个判断威胁是否作用于人类，一个判断人类是否威胁他者，主客体相反。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[225,537,942,34],[165,579,1002,34],[165,621,1002,35],[165,663,1002,35],[164,704,1003,36],[165,747,1002,35],[165,790,998,35]],"questionRects":[[185,471,847,37],[231,525,250,35],[230,578,274,34],[230,630,388,35],[292,683,316,28]],"scrollTarget":null,"meta":{"kind":"option","qid":"32","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“human beings are a threat”和原文“no major threats resulting in an overal sequences, is **[xxx]** complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage. / That’s one reason why we have launched Arc, a new publication dedicated to the near future.\n>\n> 顺着英文顺序读：\n>\n> 也许 **[xxx]**，思考这样漫长的 **[xxx]**，反而比思考更近期的未来容易。 / 当今技术可能如何演变，以及它会带来怎样的社会后果，极其 **[xxx]** 复杂；最好让科幻作家和未来学家去探索我们能够设想的各种可能。 / 这也是我们创办Arc的一个原因；这是一份专门讨论近期未来的新刊物。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>33题</h2>\n<blockquote>\n<p>Which of the following is true according to Paragraph 5?<br />\n根据第五段，下面哪项正确？</p>\n</blockquote>\n<p>题干直接给出Paragraph 5，所以定位到第五段，并把这一段从头到尾读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Perhaps <strong>[xxx]</strong>, it may be easier to think about such lengthy <strong>[xxx]</strong> than about the more immediate future. The potential evolution of today’s technology, and its social consequences, is <strong>[xxx]</strong> complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage. That’s one reason why we have launched Arc, a new publication dedicated to the near future.</p>\n<p>开始精读：</p>\n<p>Perhaps <strong>[xxx]</strong>, it may be easier to think about such lengthy <strong>[xxx]</strong> than about the more immediate future. / The potential evolution of today’s technology, and its social consequences, is <strong>[xxx]</strong> complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage. / That’s one reason why we have launched Arc, a new publication dedicated to the near future.</p>\n<p>顺着英文顺序读：</p>\n<p>也许 <strong>[xxx]</strong>，思考这样漫长的 <strong>[xxx]</strong>，反而比思考更近期的未来容易。 / 当今技术可能如何演变，以及它会带来怎样的社会后果，极其 <strong>[xxx]</strong> 复杂；最好让科幻作家和未来学家去探索我们能够设想的各种可能。 / 这也是我们创办Arc的一个原因；这是一份专门讨论近期未来的新刊物。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[225,1040,942,43],[165,1086,999,35],[165,1128,1002,35],[166,1171,1001,34],[165,1213,1003,35]],"questionRects":[[185,788,753,35],[230,841,586,28],[230,894,647,34],[230,946,620,35],[230,999,557,28]],"scrollTarget":null,"meta":{"kind":"question","qid":"33"}},{"section":"33题","raw":"### A. The interest in science fiction is on the rise.\n\n> 人们对科幻的兴趣正在上升\n\n把A接回题干，它说的是：根据第五段，人们对科幻的兴趣正在上升。\n\nA里的“interest in science fiction is on the rise”和原文“best left to science fiction writers”都提到science fiction，因为一个说兴趣趋势、一个说由谁探索未来，所以回看第五段第二句。\n\n> The potential evolution of today’s technology, and its social consequences, is **[xxx]** complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.\n\n原文“best left to science fiction writers”说近期未来太复杂，适合交给科幻作家和未来学家探索；A的“interest in science fiction is on the rise”却判断大众兴趣正在上升。一个是任务归属，一个是时间趋势，关系不同。\n\n**把复杂未来交给科幻作家探索，是否说明公众对科幻的兴趣正在上升？**\n\n不能说明。第五段没有比较过去与现在的兴趣，也没有建立上升趋势。\n\n**第一轮判断：A排除。**","html":"<h3>A. The interest in science fiction is on the rise.</h3>\n<blockquote>\n<p>人们对科幻的兴趣正在上升</p>\n</blockquote>\n<p>把A接回题干，它说的是：根据第五段，人们对科幻的兴趣正在上升。</p>\n<p>A里的“interest in science fiction is on the rise”和原文“best left to science fiction writers”都提到science fiction，因为一个说兴趣趋势、一个说由谁探索未来，所以回看第五段第二句。</p>\n<blockquote>\n<p>The potential evolution of today’s technology, and its social consequences, is <strong>[xxx]</strong> complicated, and it’s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.</p>\n</blockquote>\n<p>原文“best left to science fiction writers”说近期未来太复杂，适合交给科幻作家和未来学家探索；A的“interest in science fiction is on the rise”却判断大众兴趣正在上升。一个是任务归属，一个是时间趋势，关系不同。</p>\n<p><strong>把复杂未来交给科幻作家探索，是否说明公众对科幻的兴趣正在上升？</strong></p>\n<p>不能说明。第五段没有比较过去与现在的兴趣，也没有建立上升趋势。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[225,1040,942,43],[165,1086,999,35],[165,1128,1002,35],[166,1171,1001,34],[165,1213,1003,35]],"questionRects":[[185,788,753,35],[230,841,586,28],[230,894,647,34],[230,946,620,35],[230,999,557,28]],"scr fad. To be sure, the future is not all **[xxx]**. But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.\n>\n> 开始精读：\n>\n> This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad. / To be sure, the future is not all **[xxx]**. / But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.\n>\n> 顺着英文顺序读：\n>\n> 这种长远视角使我们对自身前景的悲观看法更像是一阵短暂风潮。 / 诚然，未来并非全都 **[xxx]**。 / 但是，我们现在掌握的知识已经足以减少许多曾威胁早期人类生存的风险，并改善后来者的处境。\n\n前一处的指代还需要相邻段落补全，继续把相邻段落完整读完。\n\n> 原文参考：\n>\n> But take a longer view and there is a surprising amount that we can say with considerable **[xxx]**. As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.\n>\n> 开始精读：\n>\n> But take a longer view and there is a surprising amount that we can say with considerable **[xxx]**. / As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.\n>\n> 顺着英文顺序读：\n>\n> 但是，把眼光放得更长远一些，我们能够以相当的 **[xxx]** 说清的事情多得令人意外。 / 常常如此：过去掌握着通向未来的钥匙。我们现在已经识别出足够多的长期模式；这些模式塑造着地球和人类自身的历史，使我们能够根据证据预测后代将处在怎样的环境中。\n\n整段关系读清后，再进入A—D逐项比较。","html":"<h2>34题</h2>\n<blockquote>\n<p>To ensure the future of mankind, it is crucial to ______.<br />\n为了保障人类的未来，关键是什么？</p>\n</blockquote>\n<p>题干问保障人类的“未来”靠什么。粗读时好像末段留下了“早期人类”这个碎片，于是先回到末段；末段第一句的“这种长远视角”又指向前一段，所以还要把前一段一起读全。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad. To be sure, the future is not all <strong>[xxx]</strong>. But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.</p>\n<p>开始精读：</p>\n<p>This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad. / To be sure, the future is not all <strong>[xxx]</strong>. / But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.</p>\n<p>顺着英文顺序读：</p>\n<p>这种长远视角使我们对自身前景的悲观看法更像是一阵短暂风潮。 / 诚然，未来并非全都 <strong>[xxx]</strong>。 / 但是，我们现在掌握的知识已经足以减少许多曾威胁早期人类生存的风险，并改善后来者的处境。</p>\n</blockquote>\n<p>前一处的指代还需要相邻段落补全，继续把相邻段落完整读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But take a longer view and there is a surprising amount that we can say with considerable <strong>[xxx]</strong>. As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.</p>\n<p>开始精读：</p>\n<p>But take a longer view and there is a surprising amount that we can say with considerable <strong>[xxx]</strong>. / As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.</p>\n<p>顺着英文顺序读：</p>\n<p>但是，把眼光放得更长远一些，我们能够以相当的 <strong>[xxx]</strong> 说清的事情多得令人意外。 / 常常如此：过去掌握着通向未来的钥匙。我们现在已经识别出足够多的长期模式；这些模式塑造着地球和人类自身的历史，使我们能够根据证据预测后代将处在怎样的环境中。</p>\n</blockquote>\n<p>整段关系读清后，再进入A—D逐项比较。</p>\n","articleRects":[[225,1509,942,35],[165,1551,1002,35],[165,1594,1004,34],[165,1636,592,34],[225,1298,942,34],[165,1340,1002,35],[165,1382,998,35],[165,1424,1002,35],[215,1467,413,28]],"questionRects":[[185,1104,646,34],[230,1157,506,34],[230,1210,506,34],[230,1262,526,35],[230,1315,489,34]],"scrollTarget":null,"meta":{"kind":"question","qid":"34"}},{"section":"34题","raw":"### A. draw on our experience from the past\n\n> 借鉴过去的经验\n\n把A接回题干，它说的是：为了保障人类的未来，关键是借鉴过去的经验。\n\nA里的“draw on our experience from the past”和原文“the past holds the key to the future”都把过去当作理解未来的来源，因为key直接说明这种关键作用，所以回看第六段第二句。\n\n> As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.\n\n原文“the past holds the key to the future”说要从地球和人类历史的长期模式中作有证据的预测；A的“draw on our experience from the past”把这一方法概括为借鉴过去经验。知识来源和行动方向相同。\n\n**从过去的长期模式预测未来，能不能概括为借鉴过去的经验？**\n\n能。A保留了“以过去为依据”的关键方法，没有把它改成单纯重复历史。\n\n**第一轮判断：A保留。**","html":"<h3>A. draw on our experience from the past</h3>\n<blockquote>\n<p>借鉴过去的经验</p>\n</blockquote>\n<p>把A接回题干，它说的是：为了保障人类的未来，关键是借鉴过去的经验。</p>\n<p>A里的“draw on our experience from the past”和原文“the past holds the key to the future”都把过去当作理解未来的来源，因为key直接说明这种关键作用，所以回看第六段第二句。</p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.</p>\n</blockquote>\n<p>原文“the past holds the key to the future”说要从地球和人类历史的长期模式中作有证据的预测；A的“draw on our experience from the past”把这一方法概括为借鉴过去经验。知识来源和行动方向相同。</p>\n<p><strong>从过去的长期模式预测未来，能不能概括为借鉴过去的经验？</strong></p>\n<p>能。A保留了“以过去为依据”的关键方法，没有把它改成单纯重复历史。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[225,1298,942,34],[165,1340,1002,35],[165,1382,998,35],[165,1424,1002,35],[215,1467,413,28]],"questionRects":[[185,1104,646,34],[230,1157,506,34],[230,1210,506,34],[230,1262,526,35],[230,1315,489,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"34","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“draw on our experience from the past”和原文“the past holds the key to the future”都把过去当作理解未来的来源，因为key直接说明这种关键作用，所以回看第六段第二句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"the past holds the key to the future","visibleOptionAnchor":"draw on our experience from the past"}}}},{"section":"34题","raw":"### B. adopt an optimistic view of the world\n\n> 采取乐观的世界观\n\n把B接回题干，它说的是：为了保障人类的未来，关键是采取乐观的世界观。\n\nB里的“adopt an optimistic view”和原文“make evidence-based forecasts”都被放在面对未来的方法位置，因为一个强调态度、一个强调根据过去模式作预测，所以回看第六段第二句。\n\n> As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.\n\n原文“make evidence-based forecasts”把关键方法写成识别长期模式并依据证据预测；B的“adopt an optimistic view”却把方法换成保持乐观。一个依靠知识和预测，一个依靠心理态度。\n\n**依据过去模式作预测，是否等于采取乐观的世界观？**\n\n不等于。乐观本身不能替代识别风险和基于证据的判断。\n\n**第一轮判断：B排除。**","html":"<h3>B. adopt an optimistic view of the world</h3>\n<blockquote>\n<p>采取乐观的世界观</p>\n</blockquote>\n<p>把B接回题干，它说的是：为了保障人类的未来，关键是采取乐观的世界观。</p>\n<p>B里的“adopt an optimistic view”和原文“make evidence-based forecasts”都被放在面对未来的方法位置，因为一个强调态度、一个强调根据过去模式作预测，所以回看第六段第二句。</p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.</p>\n</blockquote>\n<p>原文“make evidence-based forecasts”把关键方法写成识别长期模式并依据证据预测；B的“adopt an optimistic view”却把方法换成保持乐观。一个依靠知识和预测，一个依靠心理态度。</p>\n<p><strong>依据过去模式作预测，是否等于采取乐观的世界观？</strong></p>\n<p>不等于。乐观本身不能替代识别风险和基于证据的判断。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[225,1298,942,34],[165,1340,1002,35],[165,1382,998,35],[165,1424,1002,35],[215,1467,413,28]],"questionRects":[[185,1104,646,34],[230,1157,506,34],[230,1210,506,34],[230,1262,526,35],[230,1315,489,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"34","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“adopt an optimistic view”和原文“make evidence-based forecasts”都被放在面对未来的方法位置，因为一个强调态度、一个强调根据过去模式作预测，所以回看第六段第二句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"make evidence-based forecasts","visibleOptionAnchor":"adopt an optimistic view"}}}},{"section":"34题","raw":"### C. explore our planet’s abundant resources\n\n> 开发地球丰富的资源\n\n把C接回题干，它说的是：为了保障人类的未来，关键是开发地球丰富的资源。\n\nC里的“explore our planet’s abundant resources”和原文“history of the planet”都出现planet，因为一个把地球当作资源来源、一个把地球当作历史模式的对象，所以回看第六段第二句。\n\n> As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.\n\n原文“history of the planet”要求识别塑造地球历史的长期模式；C的“explore our planet’s abundant resources”却要求开发地球资源。两边共享planet，但动作从研究历史改成开发资源，对象也从模式改成资源。\n\n**研究地球历史中的长期模式，是否等于开发地球资源？**\n\n不等于。第六段谈的是从历史获取预测依据，没有谈资源数量或开发。\n\n**第一轮判断：C排除。**","html":"<h3>C. explore our planet’s abundant resources</h3>\n<blockquote>\n<p>开发地球丰富的资源</p>\n</blockquote>\n<p>把C接回题干，它说的是：为了保障人类的未来，关键是开发地球丰富的资源。</p>\n<p>C里的“explore our planet’s abundant resources”和原文“history of the planet”都出现planet，因为一个把地球当作资源来源、一个把地球当作历史模式的对象，所以回看第六段第二句。</p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.</p>\n</blockquote>\n<p>原文“history of the planet”要求识别塑造地球历史的长期模式；C的“explore our planet’s abundant resources”却要求开发地球资源。两边共享planet，但动作从研究历史改成开发资源，对象也从模式改成资源。</p>\n<p><strong>研究地球历史中的长期模式，是否等于开发地球资源？</strong></p>\n<p>不等于。第六段谈的是从历史获取预测依据，没有谈资源数量或开发。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[225,1298,942,34],[165,1340,1002,35],[165,1382,998,35],[165,1424,1002,35],[215,1467,413,28]],"questionRects":[[185,1104,646,34],[230,1157,506,34],[230,1210,506,34],[230,1262,526,35],[230,1315,489,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"34","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“explore our planet’s abundant resources”和原文“history of the planet”都出现planet，因为一个把地球当作资源来源、一个把地球当作历史模式的对象，所以回看第六段第二句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"history of the planet","visibleOptionAnchor":"explore our planet’s abundant resources"}}}},{"section":"34题","raw":"### D. curb our ambition to **[xxx]** history\n\n> 抑制我们 **[xxx]** 历史的雄心\n\n把D接回题干，它说的是：为了保障人类的未来，关键是抑制我们对历史采取某种行动的雄心。\n\nD里的“curb our ambition”和原文“identified enough of the long-term patterns”都提出人类面对历史时应做什么，因为一个要求压制雄心、一个要求识别模式，所以回看第六段第二句。\n\n> As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.\n\n原文“identified enough of the long-term patterns”主张利用已经认识到的历史规律作预测；D的“curb our ambition”却增加了压制某种雄心的规范性动作。即使遮挡动词不同，原文也没有把保障未来建立在限制ambition上。\n\n**识别历史模式并据此预测，是否等于压制改变历史的雄心？**\n\n不等于。一个是获取和使用知识，一个是限制动机，行动方向不同。\n\n**第一轮判断：D排除。**","html":"<h3>D. curb our ambition to <strong>[xxx]</strong> history</h3>\n<blockquote>\n<p>抑制我们 <strong>[xxx]</strong> 历史的雄心</p>\n</blockquote>\n<p>把D接回题干，它说的是：为了保障人类的未来，关键是抑制我们对历史采取某种行动的雄心。</p>\n<p>D里的“curb our ambition”和原文“identified enough of the long-term patterns”都提出人类面对历史时应做什么，因为一个要求压制雄心、一个要求识别模式，所以回看第六段第二句。</p>\n<blockquote>\n<p>As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.</p>\n</blockquote>\n<p>原文“identified enough of the long-term patterns”主张利用已经认识到的历史规律作预测；D的“curb our ambition”却增加了压制某种雄心的规范性动作。即使遮挡动词不同，原文也没有把保障未来建立在限制ambition上。</p>\n<p><strong>识别历史模式并据此预测，是否等于压制改变历史的雄心？</strong></p>\n<p>不等于。一个是获取和使用知识，一个是限制动机，行动方向不同。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[225,1298,942,34],[165,1340,1002,35],[165,1382,998,35],[165,1424,1002,35],[215,1467,413,28]],"questionRects":[[185,1104,646,34],[230,1157,506,34],[230,1210,506,34],[230,1262,526,35],[230,1315,489,34]],"scrollTarget":null,"meta":{"kind":"option","qid":"34","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“curb our ambition”和原文“identified enough of the long-term patterns”都提出人类面对历史时应做什么，因为一个要求压制雄心、一个要求识别模式，所以回看第六段第二句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"identified enough of the long-term patterns","visibleOptionAnchor":"curb our ambition"}}}},{"section":"34题","raw":"### 34题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。\n\n> **34题选A。**","html":"<h3>34题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只有A保留下来。它既能接回题干，也没有把刚才精读的关系换掉；其余三项都能由局部内容直接排除。</p>\n<blockquote>\n<p><strong>34题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[185,1104,646,34],[230,1157,506,34],[230,1210,506,34],[230,1262,526,35],[230,1315,489,34]],"scrollTarget":null,"meta":{"kind":"result","qid":"34"}},{"section":"35题","raw":"## 35题\n\n**Which of the following would be the best title for the text?**\n\n下面哪个标题最适合这篇文章？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Uncertainty about Our Future**\n\n我们未来的不确定性\n\nB. **Evolution of the Human Species**\n\n人类物种的进化\n\nC. **The Ever-bright Prospects of Mankind**\n\n人类始终光明的前景\n\nD. **Science, Technology and Humanity**\n\n科学、技术与人类","html":"<h2>35题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下面哪个标题最适合这篇文章？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Uncertainty about Our Future</strong></p>\n<p>我们未来的不确定性</p>\n<p>B. <strong>Evolution of the Human Species</strong></p>\n<p>人类物种的进化</p>\n<p>C. <strong>The Ever-bright Prospects of Mankind</strong></p>\n<p>人类始终光明的前景</p>\n<p>D. <strong>Science, Technology and Humanity</strong></p>\n<p>科学、技术与人类</p>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35],[225,368,943,34],[165,410,1002,34],[165,452,1003,34],[165,494,103,29],[225,537,942,34],[165,579,1002,34],[165,621,1002,35],[165,663,1002,35],[164,704,1003,36],[165,747,1002,35],[165,790,998,35],[225,875,942,34],[165,917,1002,35],[165,959,1002,35],[165,1002,733,34],[225,1040,942,43],[165,1086,999,35],[165,1128,1002,35],[166,1171,1001,34],[165,1213,1003,35],[225,1298,942,34],[165,1340,1002,35],[165,1382,998,35],[165,1424,1002,35],[215,1467,413,28],[225,1509,942,35],[165,1551,1002,35],[165,1594,1004,34],[165,1636,592,34]],"questionRects":[[185,1420,782,35],[230,1473,405,34],[230,1525,440,35],[230,1578,513,34],[230,1631,485,34]],"scrollTarget":null,"meta":{"kind":"main_overview","qid":"35"}},{"section":"35题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先回顾几十年前对未来的乐观图景，人们相信科学技术会治愈人类弊病 | 先说过去大家非常乐观 |\n| 2 | 再写如今乌托邦想象失宠，各类威胁让人怀疑人类是否还有未来 | 再说现在大家又变得悲观 |\n| 3 | 转而用化石记录和IUCN红色名录说明人类作为物种有很强的长期生存机会 | 再转回来，说悲观可能放错地方 |\n| 4 | 写一些组织开始认真思考数千年后的深远未来，并举长期时钟项目 | 接着把眼光拉到很远以后 |\n| 5 | 承认近期未来反而更难设想，因为技术演变及社会后果极其复杂 | 再承认眼前反而更难说清 |\n| 6 | 指出拉长时间后，可以从地球与人类历史的长期模式中作有证据的预测 | 然后说拉长时间能多知道一些 |\n| 7 | 收束为长期悲观可能只是一时风潮；未来并非全好，但人类已有能力减少风险、改善后代处境 | 最后下结论：悲观不必当成定局 |\n\n先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先回顾几十年前对未来的乐观图景，人们相信科学技术会治愈人类弊病</td>\n  <td>先说过去大家非常乐观</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再写如今乌托邦想象失宠，各类威胁让人怀疑人类是否还有未来</td>\n  <td>再说现在大家又变得悲观</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>转而用化石记录和IUCN红色名录说明人类作为物种有很强的长期生存机会</td>\n  <td>再转回来，说悲观可能放错地方</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>写一些组织开始认真思考数千年后的深远未来，并举长期时钟项目</td>\n  <td>接着把眼光拉到很远以后</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>承认近期未来反而更难设想，因为技术演变及社会后果极其复杂</td>\n  <td>再承认眼前反而更难说清</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>指出拉长时间后，可以从地球与人类历史的长期模式中作有证据的预测</td>\n  <td>然后说拉长时间能多知道一些</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>收束为长期悲观可能只是一时风潮；未来并非全好，但人类已有能力减少风险、改善后代处境</td>\n  <td>最后下结论：悲观不必当成定局</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个标题。把第三列单独留下，可以看到全文的推进不是围绕一个孤立细节打转，而是在前后转折中逐步完成一个明确判断。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35],[225,368,943,34],[165,410,1002,34],[165,452,1003,34],[165,494,103,29],[225,537,942,34],[165,579,1002,34],[165,621,1002,35],[165,663,1002,35],[164,704,1003,36],[165,747,1002,35],[165,790,998,35],[225,875,942,34],[165,917,1002,35],[165,959,1002,35],[165,1002,733,34],[225,1040,942,43],[165,1086,999,35],[165,1128,1002,35],[166,1171,1001,34],[165,1213,1003,35],[225,1298,942,34],[165,1340,1002,35],[165,1382,998,35],[165,1424,1002,35],[215,1467,413,28],[225,1509,942,35],[165,1551,1002,35],[165,1594,1004,34],[165,1636,592,34]],"questionRects":[[185,1420,782,35],[230,1473,405,34],[230,1525,440,35],[230,1578,513,34],[230,1631,485,34]],"scrollTarget":null,"meta":{"kind":"main_method","qid":"35","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"35题","raw":"### A. Uncertainty about Our Future\n\n> 我们未来的不确定性\n\n如果A是主旨，全文应当集中强调未来不可确定，最终也只能承认我们无法作出可靠判断。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先说过去的人过度乐观 | 先说过去大家非常乐观 |\n| 2 | 再说现在的风险越来越多 | 再说现在大家又变得悲观 |\n| 3 | 再转回来，说各种判断都靠不住 | 再转回来，说悲观可能放错地方 |\n| 4 | 接着写遥远未来也无法预测 | 接着把眼光拉到很远以后 |\n| 5 | 再承认近期未来同样不清楚 | 再承认眼前反而更难说清 |\n| 6 | 然后说历史模式不足以提供答案 | 然后说拉长时间能多知道一些 |\n| 7 | 最后下结论：未来始终不可确定 | 最后下结论：悲观不必当成定局 |\n\n文章承认近期未来难预测，但第六段明确说拉长时间后有相当多内容可以较有把握地判断，结尾也说悲观可能只是风潮。A只抓住第五段，漏掉全文转折和结论。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>A. Uncertainty about Our Future</h3>\n<blockquote>\n<p>我们未来的不确定性</p>\n</blockquote>\n<p>如果A是主旨，全文应当集中强调未来不可确定，最终也只能承认我们无法作出可靠判断。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先说过去的人过度乐观</td>\n  <td>先说过去大家非常乐观</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再说现在的风险越来越多</td>\n  <td>再说现在大家又变得悲观</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>再转回来，说各种判断都靠不住</td>\n  <td>再转回来，说悲观可能放错地方</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>接着写遥远未来也无法预测</td>\n  <td>接着把眼光拉到很远以后</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再承认近期未来同样不清楚</td>\n  <td>再承认眼前反而更难说清</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>然后说历史模式不足以提供答案</td>\n  <td>然后说拉长时间能多知道一些</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后下结论：未来始终不可确定</td>\n  <td>最后下结论：悲观不必当成定局</td>\n</tr>\n</tbody>\n</table>\n<p>文章承认近期未来难预测，但第六段明确说拉长时间后有相当多内容可以较有把握地判断，结尾也说悲观可能只是风潮。A只抓住第五段，漏掉全文转折和结论。</p>\n<p>把这张假设表与实际全文表对照 \n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>D. Science, Technology and Humanity</h3>\n<blockquote>\n<p>科学、技术与人类</p>\n</blockquote>\n<p>如果D是主旨，全文应当平行讨论科学、技术和人类三者的关系，范围应包括多种科技成果及其社会影响。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先介绍科学对人类生活的影响</td>\n  <td>先说过去大家非常乐观</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再写技术带来的风险</td>\n  <td>再说现在大家又变得悲观</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>再转回来，比较科学与人类适应</td>\n  <td>再转回来，说悲观可能放错地方</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>接着列举面向未来的科技项目</td>\n  <td>接着把眼光拉到很远以后</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>再承认技术后果难预测</td>\n  <td>再承认眼前反而更难说清</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>然后讨论科学知识如何服务社会</td>\n  <td>然后说拉长时间能多知道一些</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后下结论：三者应协调发展</td>\n  <td>最后下结论：悲观不必当成定局</td>\n</tr>\n</tbody>\n</table>\n<p>科学技术只在开头和第五段作为未来观的一部分出现，文章中心是人类前景如何看，而不是系统讨论三者关系。D范围过宽且缺少明确立场。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是五到七段能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35],[225,368,943,34],[165,410,1002,34],[165,452,1003,34],[165,494,103,29],[225,537,942,34],[165,579,1002,34],[165,621,1002,35],[165,663,1002,35],[164,704,1003,36],[165,747,1002,35],[165,790,998,35],[225,875,942,34],[165,917,1002,35],[165,959,1002,35],[165,1002,733,34],[225,1040,942,43],[165,1086,999,35],[165,1128,1002,35],[166,1171,1001,34],[165,1213,1003,35],[225,1298,942,34],[165,1340,1002,35],[165,1382,998,35],[165,1424,1002,35],[215,1467,413,28],[225,1509,942,35],[165,1551,1002,35],[165,1594,1004,34],[165,1636,592,34]],"questionRects":[[185,1420,782,35],[230,1473,405,34],[230,1525,440,35],[230,1578,513,34],[230,1631,485,34]],"scrollTarget":null,"meta":{"kind":"main_option","qid":"35","option":"D"}},{"section":"35题","raw":"### 35题主旨结果\n\n四个选项全部代入后，C能够覆盖开头设问、各段展开和结尾收束；另外三项都只能解释局部内容，或者要求文章沿着实际没有出现的方向继续写。\n\nC能够包住全文的态度变化：过去乐观、现在悲观、随后用长期证据纠正悲观，最后承认未来不全美好但总体前景仍可改善。标题里的明亮是长期方向，而不是保证没有风险。\n\n> **35题选C。* 两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":null,"meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查31题：A还是B？\n\n第一遍留下：\n\n- A. our desire for lives of fulfilment\n- B. our faith in science and technology\n\n主旨底牌是：\n\n> **The Ever-bright Prospects of Mankind / 人类始终光明的前景**\n\n也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。\n\n第一遍读第一段时，A和B都离原文很近。A几乎复现了句尾的`lives of fulfilment`，B则复现了`Science and technology`。题干问的是过去的未来图景“由什么激发”，而原句同时给出原因和结果；快速阅读时把愿景中的结果当成激发来源，是很自然的混淆，所以先保留两项。\n\n我们先把题干和两个选项接起来。\n\n把题干接回来，A说过去的人因为渴望充实生活而想象美好未来；B说这种想象来自对科学技术的信心。A抓住的是他们期待得到的生活，B抓住的是他们相信能够实现这种生活的力量。\n\n现在拿主旨来检查。\n\n先看A。全文主旨是人类长期前景仍然明亮，文章不断比较人们依据什么形成乐观或悲观判断。第一段里`leading to`已经把“充实生活和人人有机会”放在科学技术治愈人类弊病之后，它是信念所承诺的结果。A虽然复现了结果内容，却把结果改成了激发未来观的原因。主旨要求我们关注判断依据，A在这一步没有给出真正的依据。\n\n再看B。B对应的是句子的前半段：人们相信科学和技术能够治愈人类的一切弊病，因此未来图景才会“glowingly positive”。这也与全文的推进一致：第二段转向威胁带来的悲观，后文再用化石记录、长期模式和现有知识重新建立较乐观的判断。全文始终在换“依据”，B正是过去乐观图景的依据。\n\n回到第一遍局部证据，A的词面确实比B还贴近结尾，但题干不是问美好未来包含什么，而是问它由什么激发。A缺少从愿望到未来观的因果动作；B则同时满足`Science and technology would cure...`的语法位置和全文关于“用什么根据看未来”的方向。\n\n> **31题选B。**","html":"<h2>回查31题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. our desire for lives of fulfilment</li>\n<li>B. our faith in science and technology</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>The Ever-bright Prospects of Mankind / 人类始终光明的前景</strong></p>\n</blockquote>\n<p>也就是：全文真正要完成的判断，已经由主旨题固定下来；现在只拿这一条新依据，去检查第一次没有拉开的两项。</p>\n<p>第一遍读第一段时，A和B都离原文很近。A几乎复现了句尾的<code>lives of fulfilment</code>，B则复现了<code>Science and technology</code>。题干问的是过去的未来图景“由什么激发”，而原句同时给出原因和结果；快速阅读时把愿景中的结果当成激发来源，是很自然的混淆，所以先保留两项。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>把题干接回来，A说过去的人因为渴望充实生活而想象美好未来；B说这种想象来自对科学技术的信心。A抓住的是他们期待得到的生活，B抓住的是他们相信能够实现这种生活的力量。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。全文主旨是人类长期前景仍然明亮，文章不断比较人们依据什么形成乐观或悲观判断。第一段里<code>leading to</code>已经把“充实生活和人人有机会”放在科学技术治愈人类弊病之后，它是信念所承诺的结果。A虽然复现了结果内容，却把结果改成了激发未来观的原因。主旨要求我们关注判断依据，A在这一步没有给出真正的依据。</p>\n<p>再看B。B对应的是句子的前半段：人们相信科学和技术能够治愈人类的一切弊病，因此未来图景才会“glowingly positive”。这也与全文的推进一致：第二段转向威胁带来的悲观，后文再用化石记录、长期模式和现有知识重新建立较乐观的判断。全文始终在换“依据”，B正是过去乐观图景的依据。</p>\n<p>回到第一遍局部证据，A的词面确实比B还贴近结尾，但题干不是问美好未来包含什么，而是问它由什么激发。A缺少从愿望到未来观的因果动作；B则同时满足<code>Science and technology would cure...</code>的语法位置和全文关于“用什么根据看未来”的方向。</p>\n<blockquote>\n<p><strong>31题选B。</strong></p>\n</blockquote>\n","articleRects":[[225,240,941,35],[165,283,1002,34],[165,325,955,35]],"questionRects":[[185,157,625,34],[231,209,441,29],[230,262,474,34],[230,315,430,34],[317,367,333,35],[185,1420,782,35],[230,1473,405,34],[230,1525,440,35],[230,1578,513,34],[230,1631,485,34]],"scrollTarget":null,"meta":{"kind":"review","qid":"31"}},{"section":"最终答案","raw":"# 5. 最终答案\n\n- **31题：B** — our faith in science and technology（我们对科学技术的信心）\n- **32题：B** — a sustained species（一个能够延续的物种）\n- **33题：D** — Our immediate future is hard to conceive.（我们的近期未来很难设想）\n- **34题：A** — draw on our experience from the past（借鉴过去的经验）\n- **35题：C** — The Ever-bright Prospects of Mankind（人类始终光明的前景）\n\n本篇答案：**BBDAC**。","html":"<h1>5. 最终答案</h1>\n<ul>\n<li><strong>31题：B</strong> — our faith in science and technology（我们对科学技术的信心）</li>\n<li><strong>32题：B</strong> — a sustained species（一个能够延续的物种）</li>\n<li><strong>33题：D</strong> — Our immediate future is hard to conceive.（我们的近期未来很难设想）</li>\n<li><strong>34题：A</strong> — draw on our experience from the past（借鉴过去的经验）</li>\n<li><strong>35题：C</strong> — The Ever-bright Prospects of Mankind（人类始终光明的前景）</li>\n</ul>\n<p>本篇答案：<strong>BBDAC</strong>。</p>\n","articleRects":[],"questionRects":[[185,157,625,34],[231,209,441,29],[230,262,474,34],[230,315,430,34],[317,367,333,35],[185,471,847,37],[231,525,250,35],[230,578,274,34],[230,630,388,35],[292,683,316,28],[185,788,753,35],[230,841,586,28],[230,894,647,34],[230,946,620,35],[230,999,557,28],[185,1104,646,34],[230,1157,506,34],[230,1210,506,34],[230,1262,526,35],[230,1315,489,34],[185,1420,782,35],[230,147
