<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 21题题干\n\n**According to Paragraph 1, one motive in imposing the new rule is to ______.**\n\n> 根据第1段，实行这条新规则的一个动机是什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>21题题干</h2>\n<p><strong>According to Paragraph 1, one motive in imposing the new rule is to ______.</strong></p>\n<blockquote>\n<p>根据第1段，实行这条新规则的一个动机是什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,214,1311,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"21"}},{"section":"先读题干","raw":"## 22题题干\n\n**Alfred Marshall is quoted to indicate ______.**\n\n> 引用Alfred Marshall的话，是为了说明什么？\n\n题型：**例子作用题**。\n\n---","html":"<h2>22题题干</h2>\n<p><strong>Alfred Marshall is quoted to indicate ______.</strong></p>\n<blockquote>\n<p>引用Alfred Marshall的话，是为了说明什么？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,622,657,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"22"}},{"section":"先读题干","raw":"## 23题题干\n\n**It is argued that the influence of transient investment on public companies can be ______.**\n\n> 文章说，短期投资对上市公司的影响可能是什么样的？\n\n题型：**具体细节题**。\n\n---","html":"<h2>23题题干</h2>\n<p><strong>It is argued that the influence of transient investment on public companies can be ______.</strong></p>\n<blockquote>\n<p>文章说，短期投资对上市公司的影响可能是什么样的？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,1029,1322,36],[315,1098,177,33]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"23"}},{"section":"先读题干","raw":"## 24题题干\n\n**The US and France examples are used to illustrate ______.**\n\n> 美国和法国的例子，是用来说明什么的？\n\n题型：**例子作用题**。\n\n---","html":"<h2>24题题干</h2>\n<p><strong>The US and France examples are used to illustrate ______.</strong></p>\n<blockquote>\n<p>美国和法国的例子，是用来说明什么的？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,1505,879,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"24"}},{"section":"先读题干","raw":"## 25题题干\n\n**Which of the following would be the best title for the text?**\n\n> 下面哪一个最适合作为全文标题？\n\n题型：**全文作者观点／全文主旨题**。\n\n---","html":"<h2>25题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下面哪一个最适合作为全文标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,1913,1028,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"25"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Yet, rather than, In addition, not just, but |\n| 态度词 / 评价词 | 先抓个大概好坏 | unusual, harmful, stronger, worsened |\n| 动作词 | 先看谁做了什么 | delayed, restore, dropped, encourage |\n| 结果词 | 看最后出了什么事 | profits, performance, voting rights |\n| 重复主题词 | 大概知道老在说什么 | banks, companies, short-termism, long-termism |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>Yet, rather than, In addition, not just, but</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏< 的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住银行奖金、短期主义、两个人名、七年和七个月、美国、法国和结尾的短期与长期；这些信息之间到底是什么关系，等题目问到再精读。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和银行、公司里的规则有关，开头似乎出现奖金、可能被推迟10年、公众信任，还有更多长期决策；中间看到短期主义、快速利润，出现Andrew Haldane和Alfred Marshall，随后还有七年、七个月、长期研究、客户、新的数字技术；后面又看到美国、2002、绩效奖金，法国、至少两年、投票权，结尾出现英国的新规则、社会、他们的表现，以及短期、长期。</p>\n<p>到这里还不能自然地说清楚：奖金为什么可能推迟10年，孩子们的那几句话跟公司有什么关系，七年和七个月说的到底是什么，美国和法国这些做法各自怎样起作用。粗读时只要能判断“这篇文章大概与银行、公司的规则、短期和长期有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住银行奖金、短期主义、两个人名、七年和七个月、美国、法国和结尾的短期与长期；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做21至24题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"21题","raw":"## 21题\n\n> According to Paragraph 1, one motive in imposing the new rule is to ______.  \n> 根据第1段，实行这条新规则的一个动机是什么？\n\n题干直接给出 Paragraph 1，所以回到第1段，从英国的新规则读到最后的未来几代人。\n\n> 原文参考：\n>\n> Financial **[xxx]** in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any **[xxx]** bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this “clawback” rule is to hold bankers **[xxx]** for harmful risk-taking and to restore public trust in financial **[xxx]**. Yet officials also hope for a much larger benefit: more long-term decision-making, not only by banks but by all corporations, to build a stronger economy for future generations.\n>\n> 开始精读：\n>\n> Financial **[xxx]** in Britain / have imposed a rather unusual rule / on the bosses of big banks. / Starting next year, / any **[xxx]** bonus of top executives / could be delayed 10 years / if their banks are under investigation / for wrongdoing. / The main purpose of this “clawback” rule / is to hold bankers **[xxx]** / for harmful risk-taking / and to restore public trust / in financial **[xxx]**. / Yet officials also hope / for a much larger benefit: / more long-term decision-making, / not only by banks / but by all corporations, / to build a stronger economy / for future generations.\n>\n> 金融的 **[xxx]** 在英国 / 已经施加一条相当不寻常的规则 / 在大银行的老板身上。/ 从明年开始，/ 任何 **[xxx]** 的奖金属于高管的 / 可能被推迟10年 / 如果他们的银行正在接受调查 / 因为不当行为。/ 这条“追回”规则的主要目的 / 是让银行家 **[xxx]** / 对于有害的冒险行为 / 并恢复公众信任 / 对金融 **[xxx]** 的。/ 然而官员也希望 / 得到一个大得多的好处：/ 更多长期决策，/ 不仅由银行作出 / 而且由所有公司作出，/ 去建立一个更强的经济 / 为未来几代人。\n\n题干问实行规则的动机。这里既有 The main purpose 引出的主要目的，也有 Yet 后面官员希望得到的更大好处；两处都要看。奖金可以推迟是做法，为什么这样做才是空格要补的内容。","html":"<h2>21题</h2>\n<blockquote>\n<p>According to Paragraph 1, one motive in imposing the new rule is to ______.<br>根据第1段，实行这条新规则的一个动机是什么？</p>\n</blockquote>\n<p>题干直接给出 Paragraph 1，所以回到第1段，从英国的新规则读到最后的未来几代人。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Financial <strong>[xxx]</strong> in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any <strong>[xxx]</strong> bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this “clawback” rule is to hold bankers <strong>[xxx]</strong> for harmful risk-taking and to restore public trust in financial <strong>[xxx]</strong>. Yet officials also hope for a much larger benefit: more long-term decision-making, not only by banks but by all corporations, to build a stronger economy for future generations.</p>\n<p>开始精读：</p>\n<p>Financial <strong>[xxx]</strong> in Britain / have imposed a rather unusual rule / on the bosses of big banks. / Starting next year, / any <strong>[xxx]</strong> bonus of top executives / could be delayed 10 years / if their banks are under investigation / for wrongdoing. / The main purpose of this “clawback” rule / is to hold bankers <strong>[xxx]</strong> / for harmful risk-taking / and to restore public trust / in financial <strong>[xxx]</strong>. / Yet officials also hope / for a much larger benefit: / more long-term decision-making, / not only by banks / but by all corporations, / to build a stronger economy / for future generations.</p>\n<p>金融的 <strong>[xxx]</strong> 在英国 / 已经施加一条相当不寻常的规则 / 在大银行的老板身上。/ 从明年开始，/ 任何 <strong>[xxx]</strong> 的奖金属于高管的 / 可能被推迟10年 / 如果他们的银行正在接受调查 / 因为不当行为。/ 这条“追回”规则的主要目的 / 是让银行家 <strong>[xxx]</strong> / 对于有害的冒险行为 / 并恢复公众信任 / 对金融 <strong>[xxx]</strong> 的。/ 然而官员也希望 / 得到一个大得多的好处：/ 更多长期决策，/ 不仅由银行作出 / 而且由所有公司作出，/ 去建立一个更强的经济 / 为未来几代人。</p>\n</blockquote>\n<p>题干问实行规则的动机。这里既有 The main purpose 引出的主要目的，也有 Yet 后面官员希望得到的更大好处；两处都要看。奖金可以推迟是做法，为什么这样做才是空格要补的内容。</p>\n","articleRects":[[307,333,1241,36],[228,388,1320,35],[228,442,1320,35],[227,495,1321,37],[228,551,1320,35],[228,605,1319,35],[227,659,1224,36]],"questionRects":[[254,214,1311,36]],"scrollTarget":"auto","meta":{"kind":"question","qid":"21"}},{"section":"21题","raw":"### A. guarantee the bonuses of top executives\n\n> 保证高管的奖金\n\n把A接回题干，它说的是：新规则的一个动机是保证高管拿到奖金。\n\nA的 guarantee the bonuses 是“保证奖金”，原文的 could be delayed 10 years 则在说明这些奖金会怎样处理；两边说的是同一笔高管奖金，所以回看从 Starting next year 开始的句子。\n\n> Starting next year, any **[xxx]** bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing.\n\n原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。could be delayed 10 years 给的是限制和延期，并没有把发放奖金当作需要保护的目标。A的 guarantee the bonuses 则把这条规则说成保证高管奖金的措施；一个在出现问题时扣住奖金，一个以保证奖金为目的，奖金相同，规则对奖金做的事却变了。\n\n**原文用可能推迟10年的办法约束奖金，能说它的动机是保证奖金吗？**\n\n不能。高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。\n\n**第一轮判断：A排除。**","html":"<h3>A. guarantee the bonuses of top executives</h3>\n<blockquote>\n<p>保证高管的奖金</p>\n</blockquote>\n<p>把A接回题干，它说的是：新规则的一个动机是保证高管拿到奖金。</p>\n<p>A的 guarantee the bonuses 是“保证奖金”，原文的 could be delayed 10 years 则在说明这些奖金会怎样处理；两边说的是同一笔高管奖金，所以回看从 Starting next year 开始的句子。</p>\n<blockquote>\n<p>Starting next year, any <strong>[xxx]</strong> bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing.</p>\n</blockquote>\n<p>原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。could be delayed 10 years 给的是限制和延期，并没有把发放奖金当作需要保护的目标。A的 guarantee the bonuses 则把这条规则说成保证高管奖金的措施；一个在出现问题时扣住奖金，一个以保证奖金为目的，奖金相同，规则对奖金做的事却变了。</p>\n<p><strong>原文用可能推迟10年的办法约束奖金，能说它的动机是保证奖金吗？</strong></p>\n<p>不能。高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[307,333,1241,36],[228,388,1320,35],[228,442,1320,35],[227,495,1321,37],[228,551,1320,35],[228,605,1319,35],[227,659,1224,36]],"questionRects":[[254,214,1311,36],[315,282,694,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 guarantee the bonuses 是“保证奖金”，原文的 could be delayed 10 years 则在说明这些奖金会怎样处理；两边说的是同一笔高管奖金，所以回看从 Starting next year 开始的句子。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","object"],"visibleSourceAnchor":"could be delayed 10 years","visibleOptionAnchor":"guarantee the bonuses"}}}},{"section":"21题","raw":"### B. **[xxx]** bankers’ sense of responsibility\n\n> **[xxx]** 银行家的责任意识\n\n把B接回题干，它说的是：新规则的一个动机是 **[xxx]** 银行家的责任意识。\n\nB里的 bankers’ sense of responsibility 说银行家的责任，原文的 for harmful risk-taking 也把银行家与有害的冒险行为连在一起；两边都在谈银行家怎样面对自己的行为，所以回看 The main purpose 开始的句子。\n\n> The main purpose of this “clawback” rule is to hold bankers **[xxx]** for harmful risk-taking and to restore public trust in financial **[xxx]**.\n\n原文明确把 bankers 放在 hold 后面，又用 for harmful risk-taking 接上有害的冒险行为：规则要让这些银行家对于这样的行为处于某种状态。B的 bankers’ sense of responsibility 仍然围绕银行家对行为的责任意识，与这部分可以接上。不过，原文 hold bankers 后的 **[xxx]** 以及B开头的 **[xxx]** 都没有读懂，具体要怎样对待这种责任意识，还不能把两句话完全连起来。后面的 restore public trust 只让我们知道还希望恢复公众信任，并没有替这两个位置作出解释。\n\n**目前银行家和有害冒险行为能接上，但两个 [xxx] 没读懂，能把B排掉吗？**\n\n不能。B说的银行家责任与规则的主要目的有对应的对象，尚未读懂的是对责任意识做什么；现在没有哪一处已经把这个说法否定掉。\n\n**第一轮判断：B保留。**","html":"<h3>B. <strong>[xxx]</strong> bankers’ sense of responsibility</h3>\n<blockquote>\n<p><strong>[xxx]</strong> 银行家的责任意识</p>\n</blockquote>\n<p>把B接回题干，它说的是：新规则的一个动机是 <strong>[xxx]</strong> 银行家的责任意识。</p>\n<p>B里的 bankers’ sense of responsibility 说银行家的责任，原文的 for harmful risk-taking 也把银行家与有害的冒险行为连在一起；两边都在谈银行家怎样面对自己的行为，所以回看 The main purpose 开始的句子。</p>\n<blockquote>\n<p>The main purpose of this “clawback” rule is to hold bankers <strong>[xxx]</strong> for harmful risk-taking and to restore public trust in financial <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文明确把 bankers 放在 hold 后面，又用 for harmful risk-taking 接上有害的冒险行为：规则要让这些银行家对于这样的行为处于某种状态。B的 bankers’ sense of responsibility 仍然围绕银行家对行为的责任意识，与这部分可以接上。不过，原文 hold bankers 后的 <strong>[xxx]</strong> 以及B开头的 <strong>[xxx]</strong> 都没有读懂，具体要怎样对待这种责任意识，还不能把两句话完全连起来。后面的 restore public trust 只让我们知道还希望恢复公众信任，并没有替这两个位置作出解释。</p>\n<p><strong>目前银行家和有害冒险行为能接上，但两个 [xxx] 没读懂，能把B排掉吗？</strong></p>\n<p>不能。B说的银行家责任与规则的主要目的有对应的对象，尚未读懂的是对责任意识做什么；现在没有哪一处已经把这个说法否定掉。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[307,333,1241,36],[228,388,1320,35],[228,442,1320,35],[227,495,1321,37],[228,551,1320,35],[228,605,1319,35],[227,659,1224,36]],"questionRects":[[254,214,1311,36],[315,350,696,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的 bankers’ sense of responsibility 说银行家的责任，原文的 for harmful risk-taking 也把银行家与有害的冒险行为连在一起；两边都在谈银行家怎样面对自己的行为，所以回看 The main purpose 开始的句子。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"for harmful risk-taking","visibleOptionAnchor":"bankers’ sense of responsibility"}}}},{"section":"21题","raw":"### C. build a new system of financial regulation\n\n> 建立一套新的金融监管体系\n\n把C接回题干，它说的是：实行这条新规则是为了建立一套新的金融监管体系。\n\nC的 a new system of financial regulation 指一整套金融监管体系，原文的 a rather unusual rule 指对银行老板施加的这一条规则；两边都涉及管理银行，所以先回看第一句，再接着看明确说明主要目的的句子。\n\n> Financial **[xxx]** in Britain have imposed a rather unusual rule on the bosses of big banks.\n\n> The main purpose of this “clawback” rule is to hold bankers **[xxx]** for harmful risk-taking and to restore public trust in financial **[xxx]**.\n\n原文先给出 a rather unusual rule，再说明它约束的是大银行老板，具体涉及奖金以及有害冒险行为。主要目的的两个动作，都落在银行家及公众信任上。C却把要完成的事情改成建立 a new system of financial regulation，要求原文谈一整套新体系怎样建立。这里介绍的是已有规则中的具体要求和它想改变的行为，不能把“施加一条规则”直接换成“以建立整套体系为目的”；**[xxx]** 出现在银行家的状态或金融对象处，也不会把已写出的规则和目的扩成新体系建设。\n\n**原文解释的是这一条规则对银行家和公众信任的作用，能改成建立一整套监管体系吗？**\n\n不能。一条新要求不等于一整套新体系，原文说明的目的也已经落到银行家行为和公众信任；C把要实现的事情换掉了。\n\n**第一轮判断：C排除。**","html":"<h3>C. build a new system of financial regulation</h3>\n<blockquote>\n<p>建立一套新的金融监管体系</p>\n</blockquote>\n<p>把C接回题干，它说的是：实行这条新规则是为了建立一套新的金融监管体系。</p>\n<p>C的 a new system of financial regulation 指一整套金融监管体系，原文的 a rather unusual rule 指对银行老板施加的这一条规则；两边都涉及管理银行，所以先回看第一句，再接着看明确说明主要目的的句子。</p>\n<blockquote>\n<p>Financial <strong>[xxx]</strong> in Britain have imposed a rather unusual rule on the bosses of big banks.</p>\n</blockquote>\n<blockquote>\n<p>The main purpose of this “clawback” rule is to hold bankers <strong>[xxx]</strong> for harmful risk-taking and to restore public trust in financial <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文先给出 a rather unusual rule，再说明它约束的是大银行老板，具体涉及奖金以及有害冒险行为。主要目的的两个动作，都落在银行家及公众信任上。C却把要完成的事情改成建立 a new system of financial regulation，要求原文谈一整套新体系怎样建立。这里介绍的是已有规则中的具体要求和它想改变的行为，不能把“施加一条规则”直接换成“以建立整套体系为目的”；<strong>[xxx]</strong> 出现在银行家的状态或金融对象处，也不会把已写出的规则和目的扩成新体系建设。</p>\n<p><strong>原文解释的是这一条规则对银行家和公众信任的作用，能改成建立一整套监管体系吗？</strong></p>\n<p>不能。一条新要求不等于一整套新体系，原文说明的目的也已经落到银行家行为和公众信任；C把要实现的事情换掉了。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[307,333,1241,36],[228,388,1320,35],[228,442,1320,35],[227,495,1321,37],[228,551,1320,35],[228,605,1319,35],[227,659,1224,36]],"questionRects":[[254,214,1311,36],[316,418,732,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 a new system of financial regulation 指一整套金融监管体系，原文的 a rather unusual rule 指对银行老板施加的这一条规则；两边都涉及管理银行，所以先回看第一句，再接着看明确说明主要目的的句子。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","object"],"visibleSourceAnchor":"a rather unusual rule","visibleOptionAnchor":"a new system of financial regulation"}}}},{"section":"21题","raw":"### D. help corporations achieve larger profits\n\n> 帮助公司获得更大利润\n\n把D接回题干，它说的是：实行新规则的一个动机是帮助公司获得更大利润。\n\nD的 corporations 和原文的 all corporations 是同一类对象，但 achieve larger profits 要和原文希望的 a much larger benefit 分清；因此回看 Yet officials also hope 后面的整句，看看这个好处具体是什么。\n\n> Yet officials also hope for a much larger benefit: more long-term decision-making, not only by banks but by all corporations, to build a stronger economy for future generations.\n\n原文用冒号解释 a much larger benefit：银行和所有公司作出更多长期决策，为未来几代人建立更强的经济。D的 achieve larger profits 则是让公司自己赚到更大利润。两边虽然都有“更大”和公司，但原文 bigger 的对象是这条规则给经济和未来几代人的好处，D bigger 的对象是公司的利润。more long-term decision-making 说决策看多远，也没有写利润要变大。把 benefit 读成 profits，就把面向未来经济的目标缩成了公司赚钱。\n\n**让公司作长期决策、为后代建立更强经济，能直接改写成让公司获得更大利润吗？**\n\n不能。公司是被要求作长期决策的主体，未来几代人的经济才是后面指出的目的；D把这两个位置合成了公司利润增加。\n\n**第一轮判断：D排除。**","html":"<h3>D. help corporations achieve larger profits</h3>\n<blockquote>\n<p>帮助公司获得更大利润</p>\n</blockquote>\n<p>把D接回题干，它说的是：实行新规则的一个动机是帮助公司获得更大利润。</p>\n<p>D的 corporations 和原文的 all corporations 是同一类对象，但 achieve larger profits 要和原文希望的 a much larger benefit 分清；因此回看 Yet officials also hope 后面的整句，看看这个好处具体是什么。</p>\n<blockquote>\n<p>Yet officials also hope for a much larger benefit: more long-term decision-making, not only by banks but by all corporations, to build a stronger economy for future generations.</p>\n</blockquote>\n<p>原文用冒号解释 a much larger benefit：银行和所有公司作出更多长期决策，为未来几代人建立更强的经济。D的 achieve larger profits 则是让公司自己赚到更大利润。两边虽然都有“更大”和公司，但原文 bigger 的对象是这条规则给经济和未来几代人的好处，D bigger 的对象是公司的利润。more long-term decision-making 说决策看多远，也没有写利润要变大。把 benefit 读成 profits，就把面向未来经济的目标缩成了公司赚钱。</p>\n<p><strong>让公司作长期决策、为后代建立更强经济，能直接改写成让公司获得更大利润吗？</strong></p>\n<p>不能。公司是被要求作长期决策的主体，未来几代人的经济才是后面指出的目的；D把这两个位置合成了公司利润增加。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[307,333,1241,36],[228,388,1320,35],[228,442,1320,35],[227,495,1321,37],[228,551,1320,35],[228,605,1319,35],[227,659,1224,36]],"questionRects":[[254,214,1311,36],[315,486,682,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"21","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 corporations 和原文的 all corporations 是同一类对象，但 achieve larger profits 要和原文希望的 a much larger benefit 分清；因此回看 Yet officials also hope 后面的整句，看看这个好处具体是什么。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","scope"],"visibleSourceAnchor":"a much larger benefit","visibleOptionAnchor":"achieve larger profits"}}}},{"section":"21题","raw":"### 21题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D排除。\n\nB保留。它能接上银行家对于有害冒险行为的责任；A把约束奖金说成保证奖金，C换成新体系建设，D换成公司利润，这三项都与第1段实际解释的规则目的不同。\n\n> **21题选B。**","html":"<h3>21题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B保留。它能接上银行家对于有害冒险行为的责任；A把约束奖金说成保证奖金，C换成新体系建设，D换成公司利润，这三项都与第1段实际解释的规则目的不同。</p>\n<blockquote>\n<p><strong>21题选B。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"21"}},{"section":"22题","raw":"## 22题\n\n> Alfred Marshall is quoted to indicate ______.  \n> 引用Alfred Marshall的话，是为了说明什么？\n\n题干点名 Alfred Marshall，他出现在第2段。先把这一段从“短期主义”读到孩子把东西留到最后吃，看看引语前面在说什么。\n\n> 原文参考：\n>\n> “Short-termism,” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane. He quotes a giant of classical economics, Alfred Marshall, in describing this financial **[xxx]** as acting like “children who pick the **[xxx]** out of their **[xxx]** to eat them at once” rather than putting them aside to be eaten last.\n>\n> 开始精读：\n>\n> “Short-termism,” / or the desire for quick profits, / has worsened in publicly traded companies, / says the Bank of England’s top economist, / Andrew Haldane. / He quotes a giant of classical economics, / Alfred Marshall, / in describing this financial **[xxx]** / as acting like “children / who pick the **[xxx]** / out of their **[xxx]** / to eat them at once” / rather than putting them aside / to be eaten last.\n>\n> “短期主义”，/ 或者对快速利润的渴望，/ 在上市公司里已经变得更严重，/ 英格兰银行的首席经济学家说，/ Andrew Haldane。/ 他引用古典经济学的一位巨人，/ Alfred Marshall，/ 在描述这个金融 **[xxx]** 时 / 像“孩子们那样行动 / 他们挑出 **[xxx]** / 从他们的 **[xxx]** 里 / 去立刻吃掉它们”/ 而不是把它们放到一边 / 留到最后吃。\n\n被引用的是孩子“马上吃”与“留到最后吃”的比较。前面有 in describing，说明这句话是在描述刚才的金融现象；要回答的是这个比较说明了什么，而不是孩子具体从哪里挑出了什么。","html":"<h2>22题</h2>\n<blockquote>\n<p>Alfred Marshall is quoted to indicate ______.<br>引用Alfred Marshall的话，是为了说明什么？</p>\n</blockquote>\n<p>题干点名 Alfred Marshall，他出现在第2段。先把这一段从“短期主义”读到孩子把东西留到最后吃，看看引语前面在说什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane. He quotes a giant of classical economics, Alfred Marshall, in describing this financial <strong>[xxx]</strong> as acting like “children who pick the <strong>[xxx]</strong> out of their <strong>[xxx]</strong> to eat them at once” rather than putting them aside to be eaten last.</p>\n<p>开始精读：</p>\n<p>“Short-termism,” / or the desire for quick profits, / has worsened in publicly traded companies, / says the Bank of England’s top economist, / Andrew Haldane. / He quotes a giant of classical economics, / Alfred Marshall, / in describing this financial <strong>[xxx]</strong> / as acting like “children / who pick the <strong>[xxx]</strong> / out of their <strong>[xxx]</strong> / to eat them at once” / rather than putting them aside / to be eaten last.</p>\n<p>“短期主义”，/ 或者对快速利润的渴望，/ 在上市公司里已经变得更严重，/ 英格兰银行的首席经济学家说，/ Andrew Haldane。/ 他引用古典经济学的一位巨人，/ Alfred Marshall，/ 在描述这个金融 <strong>[xxx]</strong> 时 / 像“孩子们那样行动 / 他们挑出 <strong>[xxx]</strong> / 从他们的 <strong>[xxx]</strong> 里 / 去立刻吃掉它们”/ 而不是把它们放到一边 / 留到最后吃。</p>\n</blockquote>\n<p>被引用的是孩子“马上吃”与“留到最后吃”的比较。前面有 in describing，说明这句话是在描述刚才的金融现象；要回答的是这个比较说明了什么，而不是孩子具体从哪里挑出了什么。</p>\n","articleRects":[[310,712,1237,37],[228,768,1309,35],[228,822,1319,36],[228,875,1321,37],[227,929,1247,37]],"questionRects":[[254,622,657,35]],"scrollTarget":"auto","meta":{"kind":"question","qid":"22"}},{"section":"22题","raw":"### A. the **[xxx]** structure of publicly traded companies\n\n> 上市公司的 **[xxx]** 结构\n\n把A接回题干，它说的是：引用Marshall的话是为了说明上市公司的某种 **[xxx]** 结构。\n\nA的 structure of publicly traded companies 和原文 in publicly traded companies 都提到上市公司，所以回到第2段第一句；紧接着再看 acting like children 的比较，区分原文谈的是公司结构还是追求利润的行为。\n\n> “Short-termism,” or the desire for quick profits, has worsened in publicly traded companies …\n\n> … in describing this financial **[xxx]** as acting like “children who pick the **[xxx]** out of their **[xxx]** to eat them at once” rather than putting them aside to be eaten last.\n\n原文 in publicly traded companies 交代现象发生在哪里，现象本身是 the desire for quick profits，接着借孩子马上吃东西的动作描述它。A的 structure of publicly traded companies 却把要描述的对象变成上市公司的结构。孩子先吃还是后吃，对应的是取舍和等待，无法对应公司内部怎样组成、层级怎样安排。A开头虽然有 **[xxx]**，它修饰的仍然是 structure，不会把“公司结构”变成“公司追求快速利润的行为”。\n\n**马上吃还是留到最后吃，描述的是行为选择，能用来说明公司的结构吗？**\n\n不能。上市公司在原文里是短期逐利现象所在的地方，并不是引语要解释的组成结构。\n\n**第一轮判断：A排除。**","html":"<h3>A. the <strong>[xxx]</strong> structure of publicly traded companies</h3>\n<blockquote>\n<p>上市公司的 <strong>[xxx]</strong> 结构</p>\n</blockquote>\n<p>把A接回题干，它说的是：引用Marshall的话是为了说明上市公司的某种 <strong>[xxx]</strong> 结构。</p>\n<p>A的 structure of publicly traded companies 和原文 in publicly traded companies 都提到上市公司，所以回到第2段第一句；紧接着再看 acting like children 的比较，区分原文谈的是公司结构还是追求利润的行为。</p>\n<blockquote>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies …</p>\n</blockquote>\n<blockquote>\n<p>… in describing this financial <strong>[xxx]</strong> as acting like “children who pick the <strong>[xxx]</strong> out of their <strong>[xxx]</strong> to eat them at once” rather than putting them aside to be eaten last.</p>\n</blockquote>\n<p>原文 in publicly traded companies 交代现象发生在哪里，现象本身是 the desire for quick profits，接着借孩子马上吃东西的动作描述它。A的 structure of publicly traded companies 却把要描述的对象变成上市公司的结构。孩子先吃还是后吃，对应的是取舍和等待，无法对应公司内部怎样组成、层级怎样安排。A开头虽然有 <strong>[xxx]</strong>，它修饰的仍然是 structure，不会把“公司结构”变成“公司追求快速利润的行为”。</p>\n<p><strong>马上吃还是留到最后吃，描述的是行为选择，能用来说明公司的结构吗？</strong></p>\n<p>不能。上市公司在原文里是短期逐利现象所在的地方，并不是引语要解释的组成结构。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[310,712,1237,37],[228,768,1309,35],[228,822,1319,36],[228,875,1321,37],[227,929,1247,37]],"questionRects":[[254,622,657,35],[315,690,820,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 structure of publicly traded companies 和原文 in publicly traded companies 都提到上市公司，所以回到第2段第一句；紧接着再看 acting like children 的比较，区分原文谈的是公司结构还是追求利润的行为。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","modifier_attachment"],"visibleSourceAnchor":"in publicly traded companies","visibleOptionAnchor":"structure of publicly traded companies"}}}},{"section":"22题","raw":"### B. governments’ impatience in decision-making\n\n> 政府在决策中的不耐心\n\n把B接回题干，它说的是：引用Marshall的话是为了说明政府作决策没有耐心。\n\nB的 governments’ impatience 说政府没有耐心，原文的 the desire for quick profits 与 to eat them at once 确实也写到急着获得眼前东西；所以回看这一段首句及孩子比喻，确认没有耐心的是谁。\n\n> “Short-termism,” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane.\n\n> … children who pick the **[xxx]** out of their **[xxx]** to eat them at once …\n\n原文的 the desire for quick profits 发生在上市公司，孩子“马上吃”的比喻用来描述这种急着取得眼前利润的行为。B的 governments’ impatience 把主体改成政府。Haldane是说这段话的经济学家，他所在机构的名字也不等于这段批评政府；要被描述的主体已经由 in publicly traded companies 给出，不能把发言者所在机构换成被批评的政府。\n\n**急着取得眼前利益的是这里的公司，能把它换成政府作决策没有耐心吗？**\n\n不能。原文把“短期主义”放在上市公司中，B却让政府承担了这个行为，主体发生了变化。\n\n**第一轮判断：B排除。**","html":"<h3>B. governments’ impatience in decision-making</h3>\n<blockquote>\n<p>政府在决策中的不耐心</p>\n</blockquote>\n<p>把B接回题干，它说的是：引用Marshall的话是为了说明政府作决策没有耐心。</p>\n<p>B的 governments’ impatience 说政府没有耐心，原文的 the desire for quick profits 与 to eat them at once 确实也写到急着获得眼前东西；所以回看这一段首句及孩子比喻，确认没有耐心的是谁。</p>\n<blockquote>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane.</p>\n</blockquote>\n<blockquote>\n<p>… children who pick the <strong>[xxx]</strong> out of their <strong>[xxx]</strong> to eat them at once …</p>\n</blockquote>\n<p>原文的 the desire for quick profits 发生在上市公司，孩子“马上吃”的比喻用来描述这种急着取得眼前利润的行为。B的 governments’ impatience 把主体改成政府。Haldane是说这段话的经济学家，他所在机构的名字也不等于这段批评政府；要被描述的主体已经由 in publicly traded companies 给出，不能把发言者所在机构换成被批评的政府。</p>\n<p><strong>急着取得眼前利益的是这里的公司，能把它换成政府作决策没有耐心吗？</strong></p>\n<p>不能。原文把“短期主义”放在上市公司中，B却让政府承担了这个行为，主体发生了变化。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[310,712,1237,37],[228,768,1309,35],[228,822,1319,36],[228,875,1321,37],[227,929,1247,37]],"questionRects":[[254,622,657,35],[315,758,769,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 governments’ impatience 说政府没有耐心，原文的 the desire for quick profits 与 to eat them at once 确实也写到急着获得眼前东西；所以回看这一段首句及孩子比喻，确认没有耐心的是谁。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject"],"visibleSourceAnchor":"the desire for quick profits","visibleOptionAnchor":"governments’ impatience"}}}},{"section":"22题","raw":"### C. the conditions for **[xxx]** quick profits\n\n> **[xxx]** 快速利润的条件\n\n把C接回题干，它说的是：引用Marshall的话是为了说明 **[xxx]** 快速利润的条件。\n\nC的 conditions 和原文的 the desire for quick profits 都围绕快速利润，但一个问条件，一个写渴望；因此回看第2段第一句以及 to eat them at once 所在的孩子比喻，看看有没有在解释满足什么条件。\n\n> “Short-termism,” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane.\n\n> … to eat them at once” rather than putting them aside to be eaten last.\n\n原文的 the desire for quick profits 说明公司想尽快拿到利润，随后把这个想法比作现在吃还是留到最后吃，比较的是愿不愿意等待。C的 conditions 则要求引语交代某件事成立需要哪些条件；**[xxx]** 暂时不明白，但后面 quick profits 以及前面的 conditions 已经确定，它是在说有关快速利润的条件。原文没有把“孩子先吃”设成获取利润必须具备的条件，而是在用这一行为描述公司想立刻得到利益的倾向，描述对象和要说明的关系不同。\n\n**借孩子先吃来描述急着得利，等于说明有关快速利润的条件吗？**\n\n不等于。这里对照的是马上享用和留到最后，作用是把一种急于获利的行为说清楚；C把这种行为描述改成了条件说明。\n\n**第一轮判断：C排除。**","html":"<h3>C. the conditions for <strong>[xxx]</strong> quick profits</h3>\n<blockquote>\n<p><strong>[xxx]</strong> 快速利润的条件</p>\n</blockquote>\n<p>把C接回题干，它说的是：引用Marshall的话是为了说明 <strong>[xxx]</strong> 快速利润的条件。</p>\n<p>C的 conditions 和原文的 the desire for quick profits 都围绕快速利润，但一个问条件，一个写渴望；因此回看第2段第一句以及 to eat them at once 所在的孩子比喻，看看有没有在解释满足什么条件。</p>\n<blockquote>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane.</p>\n</blockquote>\n<blockquote>\n<p>… to eat them at once” rather than putting them aside to be eaten last.</p>\n</blockquote>\n<p>原文的 the desire for quick profits 说明公司想尽快拿到利润，随后把这个想法比作现在吃还是留到最后吃，比较的是愿不愿意等待。C的 conditions 则要求引语交代某件事成立需要哪些条件；<strong>[xxx]</strong> 暂时不明白，但后面 quick profits 以及前面的 conditions 已经确定，它是在说有关快速利润的条件。原文没有把“孩子先吃”设成获取利润必须具备的条件，而是在用这一行为描述公司想立刻得到利益的倾向，描述对象和要说明的关系不同。</p>\n<p><strong>借孩子先吃来描述急着得利，等于说明有关快速利润的条件吗？</strong></p>\n<p>不等于。这里对照的是马上享用和留到最后，作用是把一种急于获利的行为说清楚；C把这种行为描述改成了条件说明。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[310,712,1237,37],[228,768,1309,35],[228,822,1319,36],[228,875,1321,37],[227,929,1247,37]],"questionRects":[[254,622,657,35],[315,826,728,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 conditions 和原文的 the desire for quick profits 都围绕快速利润，但一个问条件，一个写渴望；因此回看第2段第一句以及 to eat them at once 所在的孩子比喻，看看有没有在解释满足什么条件。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["visible_link","object"],"visibleSourceAnchor":"the desire for quick profits","visibleOptionAnchor":"conditions"}}}},{"section":"22题","raw":"### D. “short-termism” in economic activities\n\n> 经济活动中的“短期主义”\n\n把D接回题干，它说的是：引用Marshall的话是为了说明经济活动中的“短期主义”。\n\nD的 economic activities 说经济活动，原文 the desire for quick profits 就是在说明公司追逐利润的活动；D里的 short-termism 又在段首直接出现，所以回看段首的解释和末尾马上吃、最后吃的对照。\n\n> “Short-termism,” or the desire for quick profits, has worsened in publicly traded companies …\n\n> … to eat them at once” rather than putting them aside to be eaten last.\n\n原文先用 the desire for quick profits 解释短期主义，再把这种金融现象比成孩子马上吃掉东西、不留到最后。D的 economic activities 把上市公司的逐利行为放在经济活动中，short-termism 则接住段首明确说的倾向。比喻里挑的具体东西还是 **[xxx]**，但 at once 和 last 都能读懂，先后取舍与急着获得利润的时间选择能够接上；这正好说明引语为什么跟在“短期主义”后面。\n\n**公司急着拿利润，与孩子马上吃、不肯等到最后，是否都在说明“短期主义”？**\n\n能。两者都把眼前取得放在后面等待之前，D既接住段首现象，也解释了孩子比喻在这里的作用。\n\n**第一轮判断：D保留。**","html":"<h3>D. “short-termism” in economic activities</h3>\n<blockquote>\n<p>经济活动中的“短期主义”</p>\n</blockquote>\n<p>把D接回题干，它说的是：引用Marshall的话是为了说明经济活动中的“短期主义”。</p>\n<p>D的 economic activities 说经济活动，原文 the desire for quick profits 就是在说明公司追逐利润的活动；D里的 short-termism 又在段首直接出现，所以回看段首的解释和末尾马上吃、最后吃的对照。</p>\n<blockquote>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies …</p>\n</blockquote>\n<blockquote>\n<p>… to eat them at once” rather than putting them aside to be eaten last.</p>\n</blockquote>\n<p>原文先用 the desire for quick profits 解释短期主义，再把这种金融现象比成孩子马上吃掉东西、不留到最后。D的 economic activities 把上市公司的逐利行为放在经济活动中，short-termism 则接住段首明确说的倾向。比喻里挑的具体东西还是 <strong>[xxx]</strong>，但 at once 和 last 都能读懂，先后取舍与急着获得利润的时间选择能够接上；这正好说明引语为什么跟在“短期主义”后面。</p>\n<p><strong>公司急着拿利润，与孩子马上吃、不肯等到最后，是否都在说明“短期主义”？</strong></p>\n<p>能。两者都把眼前取得放在后面等待之前，D既接住段首现象，也解释了孩子比喻在这里的作用。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[310,712,1237,37],[228,768,1309,35],[228,822,1319,36],[228,875,1321,37],[227,929,1247,37]],"questionRects":[[254,622,657,35],[315,892,684,29]],"scrollTarget":"auto","meta":{"kind":"option","qid":"22","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 economic activities 说经济活动，原文 the desire for quick profits 就是在说明公司追逐利润的活动；D里的 short-termism 又在段首直接出现，所以回看段首的解释和末尾马上吃、最后吃的对照。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"the desire for quick profits","visibleOptionAnchor":"economic activities"}}}},{"section":"22题","raw":"### 22题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C排除；\n- D保留。\n\nD保留。段首明确写短期主义，孩子“马上吃”与“最后吃”的比较把这种急着取得利益的行为说得更直观；其余三项分别换成公司结构、政府和获利条件。\n\n> **22题选D。**","html":"<h3>22题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>D保留。段首明确写短期主义，孩子“马上吃”与“最后吃”的比较把这种急着取得利益的行为说得更直观；其余三项分别换成公司结构、政府和获利条件。</p>\n<blockquote>\n<p><strong>22题选D。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"22"}},{"section":"23题","raw":"## 23题\n\n> It is argued that the influence of transient investment on public companies can be ______.  \n> 文章说，短期投资对上市公司的影响可能是什么样的？\n\n题干的 transient investment 指短期投资，第3段出现 Transient investors，都是在说投资者只停留较短时间。回到第3段，从持股时间读到“季度资本主义”。\n\n> 原文参考：\n>\n> The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades. Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer **[xxx]**. This has been **[xxx]** “quarterly capitalism.”\n>\n> 开始精读：\n>\n> The average time / for holding a stock / in both the United States and Britain, / he notes, / has dropped from seven years / to seven months / in recent decades. / Transient investors, / who demand high quarterly profits / from companies, / can hinder a firm’s efforts / to invest in long-term research / or to build up customer **[xxx]**. / This has been **[xxx]** / “quarterly capitalism.”\n>\n> 平均时间 / 对于持有一只股票 / 在美国和英国两地，/ 他指出，/ 已经从七年下降 / 到七个月 / 在最近几十年。/ 短期投资者，/ 他们要求高的季度利润 / 从公司那里，/ 能够阻碍一家公司的努力 / 去投资长期研究 / 或者去建立客户 **[xxx]**。/ 这已经被 **[xxx]** / “季度资本主义”。\n\n题干要补的是短期投资对公司的影响。第1句用七年变七个月说明持股时间；第2句才写投资者要求什么，以及这会对公司的长期研究和客户方面的努力做什么。影响和投资者停留多久，需要分开看。","html":"<h2>23题</h2>\n<blockquote>\n<p>It is argued that the influence of transient investment on public companies can be ______.<br>文章说，短期投资对上市公司的影响可能是什么样的？</p>\n</blockquote>\n<p>题干的 transient investment 指短期投资，第3段出现 Transient investors，都是在说投资者只停留较短时间。回到第3段，从持股时间读到“季度资本主义”。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades. Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>. This has been <strong>[xxx]</strong> “quarterly capitalism.”</p>\n<p>开始精读：</p>\n<p>The average time / for holding a stock / in both the United States and Britain, / he notes, / has dropped from seven years / to seven months / in recent decades. / Transient investors, / who demand high quarterly profits / from companies, / can hinder a firm’s efforts / to invest in long-term research / or to build up customer <strong>[xxx]</strong>. / This has been <strong>[xxx]</strong> / “quarterly capitalism.”</p>\n<p>平均时间 / 对于持有一只股票 / 在美国和英国两地，/ 他指出，/ 已经从七年下降 / 到七个月 / 在最近几十年。/ 短期投资者，/ 他们要求高的季度利润 / 从公司那里，/ 能够阻碍一家公司的努力 / 去投资长期研究 / 或者去建立客户 <strong>[xxx]</strong>。/ 这已经被 <strong>[xxx]</strong> / “季度资本主义”。</p>\n</blockquote>\n<p>题干要补的是短期投资对公司的影响。第1句用七年变七个月说明持股时间；第2句才写投资者要求什么，以及这会对公司的长期研究和客户方面的努力做什么。影响和投资者停留多久，需要分开看。</p>\n","articleRects":[[307,985,1236,36],[227,1040,1310,35],[228,1094,1320,35],[228,1148,1321,35],[228,1201,885,37]],"questionRects":[[254,1029,1322,36],[315,1098,177,33]],"scrollTarget":"auto","meta":{"kind":"question","qid":"23"}},{"section":"23题","raw":"### A. minimal\n\n> 很小的、微乎其微的\n\n把A接回题干，它说的是：短期投资对上市公司的影响可能很小。\n\nA的 minimal 判断影响有多大，而原文的 hinder a firm’s efforts 写投资者会影响公司的努力；两边都在谈对公司的影响，所以回看 Transient investors 开始的句子，看看阻碍的程度有没有讲清。\n\n> Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer **[xxx]**.\n\n原文的 hinder a firm’s efforts 是阻碍一家公司的努力，努力的方向包括投资长期研究以及建立客户 **[xxx]**。A的 minimal 则把这个影响的大小说成很小。阻碍说明方向不好，却没有单独交代阻碍到什么程度；后面的客户 **[xxx]** 也只让我们读到一个对象，不会自动变成程度很大。公司努力受阻与影响极小并不是同一个说法，但只靠这句，尚不能断言所有这样的阻碍都绝不可能很小。\n\n**原文已经说会阻碍公司的努力，仅凭“阻碍”两个字，能把影响很小完全否定吗？**\n\n单看这里还不能。我们能确认这是对公司努力的不利动作，却没有读到它有多严重；A缺少明确的程度说明，因此现在仍留下。\n\n**第一轮判断：A保留。**","html":"<h3>A. minimal</h3>\n<blockquote>\n<p>很小的、微乎其微的</p>\n</blockquote>\n<p>把A接回题干，它说的是：短期投资对上市公司的影响可能很小。</p>\n<p>A的 minimal 判断影响有多大，而原文的 hinder a firm’s efforts 写投资者会影响公司的努力；两边都在谈对公司的影响，所以回看 Transient investors 开始的句子，看看阻碍的程度有没有讲清。</p>\n<blockquote>\n<p>Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文的 hinder a firm’s efforts 是阻碍一家公司的努力，努力的方向包括投资长期研究以及建立客户 <strong>[xxx]</strong>。A的 minimal 则把这个影响的大小说成很小。阻碍说明方向不好，却没有单独交代阻碍到什么程度；后面的客户 <strong>[xxx]</strong> 也只让我们读到一个对象，不会自动变成程度很大。公司努力受阻与影响极小并不是同一个说法，但只靠这句，尚不能断言所有这样的阻碍都绝不可能很小。</p>\n<p><strong>原文已经说会阻碍公司的努力，仅凭“阻碍”两个字，能把影响很小完全否定吗？</strong></p>\n<p>单看这里还不能。我们能确认这是对公司努力的不利动作，却没有读到它有多严重；A缺少明确的程度说明，因此现在仍留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[307,985,1236,36],[227,1040,1310,35],[228,1094,1320,35],[228,1148,1321,35],[228,1201,885,37]],"questionRects":[[254,1029,1322,36],[315,1098,177,33],[316,1165,181,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 minimal 判断影响有多大，而原文的 hinder a firm’s efforts 写投资者会影响公司的努力；两边都在谈对公司的影响，所以回看 Transient investors 开始的句子，看看阻碍的程度有没有讲清。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"visibleSourceAnchor":"hinder a firm’s efforts","visibleOptionAnchor":"minimal"}}}},{"section":"23题","raw":"### B. indirect\n\n> 间接的\n\n把B接回题干，它说的是：短期投资对上市公司的影响可能是间接的。\n\nB的 indirect 要判断影响是否通过别的对象绕一层，原文的 demand high quarterly profits 写投资者直接向公司提出要求；因此回看第3段第2句，从投资者要求利润读到公司的努力受阻。\n\n> Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer **[xxx]**.\n\n原文先写投资者 demand high quarterly profits，要求对象就是 companies；接着仍以这些投资者作主语，直接说他们 can hinder a firm’s efforts。公司既承受季度利润要求，公司的长期投入也直接成为阻碍的对象。B的 indirect 却要把文中这条影响说成间接作用；句子没有先让投资者影响另一类人，再由那类人传给公司，而是从投资者的要求直接连到公司的经营努力。\n\n**原文让投资者直接要求公司交出季度利润，并阻碍公司投入，能把这条作用说成间接的吗？**\n\n不能。投资者面对的是公司，公司自己的长期经营努力就是被影响的对象，B改变了这里说明的作用关系。\n\n**第一轮判断：B排除。**","html":"<h3>B. indirect</h3>\n<blockquote>\n<p>间接的</p>\n</blockquote>\n<p>把B接回题干，它说的是：短期投资对上市公司的影响可能是间接的。</p>\n<p>B的 indirect 要判断影响是否通过别的对象绕一层，原文的 demand high quarterly profits 写投资者直接向公司提出要求；因此回看第3段第2句，从投资者要求利润读到公司的努力受阻。</p>\n<blockquote>\n<p>Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文先写投资者 demand high quarterly profits，要求对象就是 companies；接着仍以这些投资者作主语，直接说他们 can hinder a firm’s efforts。公司既承受季度利润要求，公司的长期投入也直接成为阻碍的对象。B的 indirect 却要把文中这条影响说成间接作用；句子没有先让投资者影响另一类人，再由那类人传给公司，而是从投资者的要求直接连到公司的经营努力。</p>\n<p><strong>原文让投资者直接要求公司交出季度利润，并阻碍公司投入，能把这条作用说成间接的吗？</strong></p>\n<p>不能。投资者面对的是公司，公司自己的长期经营努力就是被影响的对象，B改变了这里说明的作用关系。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[307,985,1236,36],[227,1040,1310,35],[228,1094,1320,35],[228,1148,1321,35],[228,1201,885,37]],"questionRects":[[254,1029,1322,36],[315,1098,177,33],[316,1233,169,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 indirect 要判断影响是否通过别的对象绕一层，原文的 demand high quarterly profits 写投资者直接向公司提出要求；因此回看第3段第2句，从投资者要求利润读到公司的努力受阻。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","visible_link"],"visibleSourceAnchor":"demand high quarterly profits","visibleOptionAnchor":"indirect"}}}},{"section":"23题","raw":"### C. adverse\n\n> 不利的\n\n把C接回题干，它说的是：短期投资对上市公司的影响可能是不利的。\n\nC的 adverse 表示不利，原文的 hinder 表示阻碍；阻碍公司的长期努力正是对公司不利的一种表现，所以回看第3段第2句里的投资者、公司的努力和长期研究。\n\n> Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer **[xxx]**.\n\n原文的 hinder 把投资者放在阻碍公司努力的一方，公司本来要做的是投资长期研究或建立客户 **[xxx]**。C的 adverse 并没有补上这些客户内容，也没有要求我们算影响多大，只说影响是不利的。公司在推进长期投入，投资者追逐高季度利润却会让这项努力受阻，从公司努力被妨碍这个结果，就能够接上“不利”这一评价。\n\n**投资者会阻碍公司的长期研究等努力，能否说明这种影响可能不利？**\n\n能。C只概括已经写明的阻碍方向，既没有把影响说成必定很大，也没有给客户 **[xxx]** 补意思。\n\n**第一轮判断：C保留。**","html":"<h3>C. adverse</h3>\n<blockquote>\n<p>不利的</p>\n</blockquote>\n<p>把C接回题干，它说的是：短期投资对上市公司的影响可能是不利的。</p>\n<p>C的 adverse 表示不利，原文的 hinder 表示阻碍；阻碍公司的长期努力正是对公司不利的一种表现，所以回看第3段第2句里的投资者、公司的努力和长期研究。</p>\n<blockquote>\n<p>Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文的 hinder 把投资者放在阻碍公司努力的一方，公司本来要做的是投资长期研究或建立客户 <strong>[xxx]</strong>。C的 adverse 并没有补上这些客户内容，也没有要求我们算影响多大，只说影响是不利的。公司在推进长期投入，投资者追逐高季度利润却会让这项努力受阻，从公司努力被妨碍这个结果，就能够接上“不利”这一评价。</p>\n<p><strong>投资者会阻碍公司的长期研究等努力，能否说明这种影响可能不利？</strong></p>\n<p>能。C只概括已经写明的阻碍方向，既没有把影响说成必定很大，也没有给客户 <strong>[xxx]</strong> 补意思。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[307,985,1236,36],[227,1040,1310,35],[228,1094,1320,35],[228,1148,1321,35],[228,1201,885,37]],"questionRects":[[254,1029,1322,36],[315,1098,177,33],[316,1301,167,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 adverse 表示不利，原文的 hinder 表示阻碍；阻碍公司的长期努力正是对公司不利的一种表现，所以回看第3段第2句里的投资者、公司的努力和长期研究。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"hinder","visibleOptionAnchor":"adverse"}}}},{"section":"23题","raw":"### D. temporary\n\n> 暂时的\n\n把D接回题干，它说的是：短期投资对上市公司的影响可能只持续很短时间。\n\nD的 temporary 谈影响持续多久，原文的 Transient investors 则谈投资者停留多久；两者都带有时间意思，所以回看持股从七年变七个月的句子，并与下一句影响长期研究的内容分开。\n\n> The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades.\n\n> Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer **[xxx]**.\n\n原文先把七年和七个月接在 holding a stock 后面，随后 Transient investors 里的短期也修饰 investors，说明投资者持股的时间短。D的 temporary 接回题干以后却修饰 influence，变成对公司的影响持续很短。原文的影响落在长期研究等经营努力上，并没有让这项阻碍在投资者卖掉股票时就结束；把持股时间直接搬到影响持续时间上，就把两个不同的计时对象混在一起了。\n\n**七个月量的是持股时间，可以直接拿来证明对公司的影响只是暂时的吗？**\n\n不能。时间描述属于投资者持股，题干要判断的却是对公司的影响；D把前一个对象的时间属性转到了后一个对象上。\n\n**第一轮判断：D排除。**","html":"<h3>D. temporary</h3>\n<blockquote>\n<p>暂时的</p>\n</blockquote>\n<p>把D接回题干，它说的是：短期投资对上市公司的影响可能只持续很短时间。</p>\n<p>D的 temporary 谈影响持续多久，原文的 Transient investors 则谈投资者停留多久；两者都带有时间意思，所以回看持股从七年变七个月的句子，并与下一句影响长期研究的内容分开。</p>\n<blockquote>\n<p>The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades.</p>\n</blockquote>\n<blockquote>\n<p>Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文先把七年和七个月接在 holding a stock 后面，随后 Transient investors 里的短期也修饰 investors，说明投资者持股的时间短。D的 temporary 接回题干以后却修饰 influence，变成对公司的影响持续很短。原文的影响落在长期研究等经营努力上，并没有让这项阻碍在投资者卖掉股票时就结束；把持股时间直接搬到影响持续时间上，就把两个不同的计时对象混在一起了。</p>\n<p><strong>七个月量的是持股时间，可以直接拿来证明对公司的影响只是暂时的吗？</strong></p>\n<p>不能。时间描述属于投资者持股，题干要判断的却是对公司的影响；D把前一个对象的时间属性转到了后一个对象上。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[307,985,1236,36],[227,1040,1310,35],[228,1094,1320,35],[228,1148,1321,35],[228,1201,885,37]],"questionRects":[[254,1029,1322,36],[315,1098,177,33],[316,1370,211,34]],"scrollTarget":"auto","meta":{"kind":"option","qid":"23","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 temporary 谈影响持续多久，原文的 Transient investors 则谈投资者停留多久；两者都带有时间意思，所以回看持股从七年变七个月的句子，并与下一句影响长期研究的内容分开。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["modifier_attachment","time"],"visibleSourceAnchor":"Transient investors","visibleOptionAnchor":"temporary"}}}},{"section":"23题","raw":"### 23题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C保留；\n- D排除。\n\nA和C保留。C接上hinder所说的不利方向；A谈影响大小，第3段没有把程度说清。B改变投资者直接作用于公司的关系，D把投资者持股时间转成了影响持续时间。","html":"<h3>23题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>A和C保留。C接上hinder所说的不利方向；A谈影响大小，第3段没有把程度说清。B改变投资者直接作用于公司的关系，D把投资者持股时间转成了影响持续时间。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"23"}},{"section":"24题","raw":"## 24题\n\n> The US and France examples are used to illustrate ______.  \n> 美国和法国的例子，是用来说明什么的？\n\n题干点名 The US 和 France。美国的法案在第5段，法国股东的做法在第6段，因此把这两段依次从头读完，再看它们一起说明什么。\n\n> 原文参考：\n>\n> In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to **[xxx]** performance bonuses for senior executives by about a year, slightly helping reduce “short-termism.” In its latest survey of CEO pay, The Wall Street Journal finds that “a **[xxx]** part” of executive pay is now tied to performance.\n>\n> 开始精读：\n>\n> In the US, / the Sarbanes-Oxley Act of 2002 / has pushed most public companies / to **[xxx]** performance bonuses / for senior executives / by about a year, / slightly helping reduce “short-termism.” / In its latest survey of CEO pay, / The Wall Street Journal finds / that “a **[xxx]** part” / of executive pay / is now tied to performance.\n>\n> 在美国，/ 2002年的《萨班斯—奥克斯利法案》/ 已经推动大多数上市公司 / 去 **[xxx]** 绩效奖金 / 给高管的 / 大约一年，/ 略微帮助减少“短期主义”。/ 在它最近的首席执行官薪酬调查中，/ 《华尔街日报》发现 / “一个 **[xxx]** 部分”/ 高管薪酬中的 / 现在与业绩相联系。\n\n> 原文参考：\n>\n> Much more could be done to encourage “long-termism,” such as changes in the tax code and quicker **[xxx]** of stock **[xxx]**. In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\n>\n> 开始精读：\n>\n> Much more could be done / to encourage “long-termism,” / such as changes in the tax code / and quicker **[xxx]** / of stock **[xxx]**. / In France, / shareholders who hold onto a company investment / for at least two years / can sometimes earn more voting rights / in a company.\n>\n> 更多事情可以做 / 来鼓励“长期主义”，/ 比如税法中的变化 / 以及更快的 **[xxx]** / 股票 **[xxx]** 的。/ 在法国，/ 持有一项公司投资的股东 / 至少两年 / 有时能够获得更多投票权 / 在一家公司里。\n\n美国例子写高管奖金与减少短期主义，法国例子写持有投资至少两年可以多得投票权。第6段开头 Much more could be done to encourage “long-termism” 又把法国的做法放进“还可以做更多事”的话里。现在比较选项怎样解释这两个例子的共同作用。","html":"<h2>24题</h2>\n<blockquote>\n<p>The US and France examples are used to illustrate ______.<br>美国和法国的例子，是用来说明什么的？</p>\n</blockquote>\n<p>题干点名 The US 和 France。美国的法案在第5段，法国股东的做法在第6段，因此把这两段依次从头读完，再看它们一起说明什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to <strong>[xxx]</strong> performance bonuses for senior executives by about a year, slightly helping reduce “short-termism.” In its latest survey of CEO pay, The Wall Street Journal finds that “a <strong>[xxx]</strong> part” of executive pay is now tied to performance.</p>\n<p>开始精读：</p>\n<p>In the US, / the Sarbanes-Oxley Act of 2002 / has pushed most public companies / to <strong>[xxx]</strong> performance bonuses / for senior executives / by about a year, / slightly helping reduce “short-termism.” / In its latest survey of CEO pay, / The Wall Street Journal finds / that “a <strong>[xxx]</strong> part” / of executive pay / is now tied to performance.</p>\n<p>在美国，/ 2002年的《萨班斯—奥克斯利法案》/ 已经推动大多数上市公司 / 去 <strong>[xxx]</strong> 绩效奖金 / 给高管的 / 大约一年，/ 略微帮助减少“短期主义”。/ 在它最近的首席执行官薪酬调查中，/ 《华尔街日报》发现 / “一个 <strong>[xxx]</strong> 部分”/ 高管薪酬中的 / 现在与业绩相联系。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Much more could be done to encourage “long-termism,” such as changes in the tax code and quicker <strong>[xxx]</strong> of stock <strong>[xxx]</strong>. In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n<p>开始精读：</p>\n<p>Much more could be done / to encourage “long-termism,” / such as changes in the tax code / and quicker <strong>[xxx]</strong> / of stock <strong>[xxx]</strong>. / In France, / shareholders who hold onto a company investment / for at least two years / can sometimes earn more voting rights / in a company.</p>\n<p>更多事情可以做 / 来鼓励“长期主义”，/ 比如税法中的变化 / 以及更快的 <strong>[xxx]</strong> / 股票 <strong>[xxx]</strong> 的。/ 在法国，/ 持有一项公司投资的股东 / 至少两年 / 有时能够获得更多投票权 / 在一家公司里。</p>\n</blockquote>\n<p>美国例子写高管奖金与减少短期主义，法国例子写持有投资至少两年可以多得投票权。第6段开头 Much more could be done to encourage “long-termism” 又把法国的做法放进“还可以做更多事”的话里。现在比较选项怎样解释这两个例子的共同作用。</p>\n","articleRects":[[307,1529,1240,35],[228,1583,1315,35],[229,1635,1318,37],[231,1690,1317,37],[227,1746,205,35],[307,1798,1241,37],[228,1854,1319,36],[228,1909,1320,35],[228,1963,537,35]],"questionRects":[[254,1505,879,35]],"scrollTarget":"auto","meta":{"kind":"question","qid":"24"}},{"section":"24题","raw":"### A. the **[xxx]** to promoting “long-termism”\n\n> 促进“长期主义”的 **[xxx]**\n\n把A接回题干，它说的是：美国和法国的例子是为了说明促进“长期主义”的某种 **[xxx]**。\n\nA的 promoting “long-termism” 与原文 encourage “long-termism” 都说促进长期主义，因此先回看第6段的开头和法国做法，再接回第5段 helping reduce “short-termism”，看美国例子是否也朝同一个方向。\n\n> In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to **[xxx]** performance bonuses for senior executives by about a year, slightly helping reduce “short-termism.”\n\n> Much more could be done to encourage “long-termism,” such as changes in the tax code and quicker **[xxx]** of stock **[xxx]**. … shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\n\n原文的 encourage “long-termism” 直接接在“更多事情可以做”后面，随后举法国持有投资较久可获得更多投票权的做法；前面的美国法案也与减少短期主义相连。A的 promoting “long-termism” 和这两段朝向一致，都是让行为放到更长时间里。不过，A最前面的 **[xxx]** 没读懂，完整说法究竟怎样概括这些做法，还不能把它补出来。目前已经能对上的，是美国和法国两个例子都被放在减少短期、鼓励长期的方向中。\n\n**A读得出的促进长期主义，能接上美国和法国这两个例子的共同方向吗？**\n\n能。美国例子略微帮助减少短期主义，法国例子奖励更长时间的持有；A开头虽未读清，后面这一方向可以接上。\n\n**第一轮判断：A保留。**","html":"<h3>A. the <strong>[xxx]</strong> to promoting “long-termism”</h3>\n<blockquote>\n<p>促进“长期主义”的 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把A接回题干，它说的是：美国和法国的例子是为了说明促进“长期主义”的某种 <strong>[xxx]</strong>。</p>\n<p>A的 promoting “long-termism” 与原文 encourage “long-termism” 都说促进长期主义，因此先回看第6段的开头和法国做法，再接回第5段 helping reduce “short-termism”，看美国例子是否也朝同一个方向。</p>\n<blockquote>\n<p>In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to <strong>[xxx]</strong> performance bonuses for senior executives by about a year, slightly helping reduce “short-termism.”</p>\n</blockquote>\n<blockquote>\n<p>Much more could be done to encourage “long-termism,” such as changes in the tax code and quicker <strong>[xxx]</strong> of stock <strong>[xxx]</strong>. … shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n</blockquote>\n<p>原文的 encourage “long-termism” 直接接在“更多事情可以做”后面，随后举法国持有投资较久可获得更多投票权的做法；前面的美国法案也与减少短期主义相连。A的 promoting “long-termism” 和这两段朝向一致，都是让行为放到更长时间里。不过，A最前面的 <strong>[xxx]</strong> 没读懂，完整说法究竟怎样概括这些做法，还不能把它补出来。目前已经能对上的，是美国和法国两个例子都被放在减少短期、鼓励长期的方向中。</p>\n<p><strong>A读得出的促进长期主义，能接上美国和法国这两个例子的共同方向吗？</strong></p>\n<p>能。美国例子略微帮助减少短期主义，法国例子奖励更长时间的持有；A开头虽未读清，后面这一方向可以接上。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[307,1529,1240,35],[228,1583,1315,35],[229,1635,1318,37],[231,1690,1317,37],[227,1746,205,35],[307,1798,1241,37],[228,1854,1319,36],[228,1909,1320,35],[228,1963,537,35]],"questionRects":[[254,1505,879,35],[315,1571,777,37]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 promoting “long-termism” 与原文 encourage “long-termism” 都说促进长期主义，因此先回看第6段的开头和法国做法，再接回第5段 helping reduce “short-termism”，看美国例子是否也朝同一个方向。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"visibleSourceAnchor":"encourage","visibleOptionAnchor":"promoting “long-termism”"}}}},{"section":"24题","raw":"### B. the prevalence of short-term thinking\n\n> 短期思维的普遍流行\n\n把B接回题干，它说的是：美国和法国的例子是为了说明短期思维很普遍。\n\nB的 prevalence of short-term thinking 要看短期思维有多普遍，原文的 helping reduce “short-termism” 也提到短期主义，但它在说减少；所以回看美国法案的结果，再把法国奖励较长持有的句子放在一起。\n\n> … slightly helping reduce “short-termism.”\n\n> In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\n\n原文的 helping reduce “short-termism” 写美国采取措施以后减少了一些短期主义，法国则把更多投票权交给至少持有两年的股东，写的是怎样使人愿意持有更久。B的 prevalence of short-term thinking 要求这两个例子呈现短期思维普遍存在，比如人们普遍急着取利。这里美国和法国共同呈现的是朝相反方向调整行为的安排，不能把两国都在采取减少它的做法，直接读成两国的例子是在展示它如何普遍流行。\n\n**两国例子在写减少短期、鼓励长期的做法，能把它们的共同作用说成展示短期思维流行吗？**\n\n不能。采取措施的国家有两个，不等于这两段在统计短期思维的普及；句子给出的动作和结果都在把行为往长期引导。\n\n**第一轮判断：B排除。**","html":"<h3>B. the prevalence of short-term thinking</h3>\n<blockquote>\n<p>短期思维的普遍流行</p>\n</blockquote>\n<p>把B接回题干，它说的是：美国和法国的例子是为了说明短期思维很普遍。</p>\n<p>B的 prevalence of short-term thinking 要看短期思维有多普遍，原文的 helping reduce “short-termism” 也提到短期主义，但它在说减少；所以回看美国法案的结果，再把法国奖励较长持有的句子放在一起。</p>\n<blockquote>\n<p>… slightly helping reduce “short-termism.”</p>\n</blockquote>\n<blockquote>\n<p>In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n</blockquote>\n<p>原文的 helping reduce “short-termism” 写美国采取措施以后减少了一些短期主义，法国则把更多投票权交给至少持有两年的股东，写的是怎样使人愿意持有更久。B的 prevalence of short-term thinking 要求这两个例子呈现短期思维普遍存在，比如人们普遍急着取利。这里美国和法国共同呈现的是朝相反方向调整行为的安排，不能把两国都在采取减少它的做法，直接读成两国的例子是在展示它如何普遍流行。</p>\n<p><strong>两国例子在写减少短期、鼓励长期的做法，能把它们的共同作用说成展示短期思维流行吗？</strong></p>\n<p>不能。采取措施的国家有两个，不等于这两段在统计短期思维的普及；句子给出的动作和结果都在把行为往长期引导。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[307,1529,1240,35],[228,1583,1315,35],[229,1635,1318,37],[231,1690,1317,37],[227,1746,205,35],[307,1798,1241,37],[228,1854,1319,36],[228,1909,1320,35],[228,1963,537,35]],"questionRects":[[254,1505,879,35],[315,1641,649,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 prevalence of short-term thinking 要看短期思维有多普遍，原文的 helping reduce “short-termism” 也提到短期主义，但它在说减少；所以回看美国法案的结果，再把法国奖励较长持有的句子放在一起。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","object"],"visibleSourceAnchor":"helping reduce","visibleOptionAnchor":"prevalence of short-term thinking"}}}},{"section":"24题","raw":"### C. the significance of long-term thinking\n\n> 长期思维的重要性\n\n把C接回题干，它说的是：美国和法国的例子是为了说明长期思维的重要性。\n\nC的 significance of long-term thinking 说长期思维的重要性，原文的 more voting rights 表明法国给持有较久的股东更多权利；同样，美国用法案调整奖金，因此把两国具体安排与第6段鼓励长期的开头合看。\n\n> … slightly helping reduce “short-termism.”\n\n> Much more could be done to encourage “long-termism,” …\n\n> In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\n\n原文说的是两国作出的安排：先写用法案影响高管奖金，后写 more voting rights 给持有投资至少两年的股东，能读出两国都愿意为鼓励长期行为作安排。C的 significance of long-term thinking 是对长期思维价值的概括；政府和公司愿意作这样的安排，可以间接让人觉得他们重视长期。可是，这两段直接展开的还是具体措施，没有专门说明长期思维到底带来哪些好处。只读这两段，C虽然比“采取了哪些做法”更概括，但不能因为它没有逐字写出措施，就断言例子完全不可能说明对长期的重视。\n\n**两国愿意为长期行为作安排，是否也可能间接体现它们重视长期思维？**\n\n能。C说的重要性可以从这种安排中间接想到；但这是否就是作者把两个例子放在这里的主要作用，现在仍需要把文章前后的安排连起来。\n\n**第一轮判断：C保留。**","html":"<h3>C. the significance of long-term thinking</h3>\n<blockquote>\n<p>长期思维的重要性</p>\n</blockquote>\n<p>把C接回题干，它说的是：美国和法国的例子是为了说明长期思维的重要性。</p>\n<p>C的 significance of long-term thinking 说长期思维的重要性，原文的 more voting rights 表明法国给持有较久的股东更多权利；同样，美国用法案调整奖金，因此把两国具体安排与第6段鼓励长期的开头合看。</p>\n<blockquote>\n<p>… slightly helping reduce “short-termism.”</p>\n</blockquote>\n<blockquote>\n<p>Much more could be done to encourage “long-termism,” …</p>\n</blockquote>\n<blockquote>\n<p>In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n</blockquote>\n<p>原文说的是两国作出的安排：先写用法案影响高管奖金，后写 more voting rights 给持有投资至少两年的股东，能读出两国都愿意为鼓励长期行为作安排。C的 significance of long-term thinking 是对长期思维价值的概括；政府和公司愿意作这样的安排，可以间接让人觉得他们重视长期。可是，这两段直接展开的还是具体措施，没有专门说明长期思维到底带来哪些好处。只读这两段，C虽然比“采取了哪些做法”更概括，但不能因为它没有逐字写出措施，就断言例子完全不可能说明对长期的重视。</p>\n<p><strong>两国愿意为长期行为作安排，是否也可能间接体现它们重视长期思维？</strong></p>\n<p>能。C说的重要性可以从这种安排中间接想到；但这是否就是作者把两个例子放在这里的主要作用，现在仍需要把文章前后的安排连起来。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[307,1529,1240,35],[228,1583,1315,35],[229,1635,1318,37],[231,1690,1317,37],[227,1746,205,35],[307,1798,1241,37],[228,1854,1319,36],[228,1909,1320,35],[228,1963,537,35]],"questionRects":[[254,1505,879,35],[315,1709,660,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 significance of long-term thinking 说长期思维的重要性，原文的 more voting rights 表明法国给持有较久的股东更多权利；同样，美国用法案调整奖金，因此把两国具体安排与第6段鼓励长期的开头合看。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"visibleSourceAnchor":"more voting rights","visibleOptionAnchor":"significance of long-term thinking"}}}},{"section":"24题","raw":"### D. the obstacles to preventing “short-termism”\n\n> 阻止“短期主义”的障碍\n\n把D接回题干，它说的是：美国和法国的例子是为了说明阻止短期主义会遇到的障碍。\n\nD的 obstacles to preventing “short-termism” 在问阻止短期主义遇到什么障碍，原文的 slightly helping reduce 写美国措施已经帮助减少它，方向相反；所以回看这个结果，再读法国股东取得更多投票权的做法。\n\n> … slightly helping reduce “short-termism.”\n\n> In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\n\n原文的 slightly helping reduce 承认美国措施的帮助不大，但 helping reduce 仍是发挥了减少短期主义的作用。法国例子也写较长持有换来更多权利，是一种鼓励，不是使长期行为做不成的阻碍。D的 obstacles to preventing “short-termism” 却要让这两个例子展示阻止短期主义时卡在哪里。slightly 只能把帮助的程度说小，不能把帮助反转成障碍；法国的奖励也不能读成妨碍长期持有。\n\n**美国略有帮助、法国给长期股东奖励，能把两者都当作阻止短期主义的障碍吗？**\n\n不能。帮助小仍是帮助，奖励也在鼓励长期行为，D把这两个例子的作用方向反了过来。\n\n**第一轮判断：D排除。**","html":"<h3>D. the obstacles to preventing “short-termism”</h3>\n<blockquote>\n<p>阻止“短期主义”的障碍</p>\n</blockquote>\n<p>把D接回题干，它说的是：美国和法国的例子是为了说明阻止短期主义会遇到的障碍。</p>\n<p>D的 obstacles to preventing “short-termism” 在问阻止短期主义遇到什么障碍，原文的 slightly helping reduce 写美国措施已经帮助减少它，方向相反；所以回看这个结果，再读法国股东取得更多投票权的做法。</p>\n<blockquote>\n<p>… slightly helping reduce “short-termism.”</p>\n</blockquote>\n<blockquote>\n<p>In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n</blockquote>\n<p>原文的 slightly helping reduce 承认美国措施的帮助不大，但 helping reduce 仍是发挥了减少短期主义的作用。法国例子也写较长持有换来更多权利，是一种鼓励，不是使长期行为做不成的阻碍。D的 obstacles to preventing “short-termism” 却要让这两个例子展示阻止短期主义时卡在哪里。slightly 只能把帮助的程度说小，不能把帮助反转成障碍；法国的奖励也不能读成妨碍长期持有。</p>\n<p><strong>美国略有帮助、法国给长期股东奖励，能把两者都当作阻止短期主义的障碍吗？</strong></p>\n<p>不能。帮助小仍是帮助，奖励也在鼓励长期行为，D把这两个例子的作用方向反了过来。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[307,1529,1240,35],[228,1583,1315,35],[229,1635,1318,37],[231,1690,1317,37],[227,1746,205,35],[307,1798,1241,37],[228,1854,1319,36],[228,1909,1320,35],[228,1963,537,35]],"questionRects":[[254,1505,879,35],[315,1775,757,37]],"scrollTarget":"auto","meta":{"kind":"option","qid":"24","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 obstacles to preventing “short-termism” 在问阻止短期主义遇到什么障碍，原文的 slightly helping reduce 写美国措施已经帮助减少它，方向相反；所以回看这个结果，再读法国股东取得更多投票权的做法。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"slightly helping reduce","visibleOptionAnchor":"obstacles to preventing “short-termism”"}}}},{"section":"24题","raw":"### 24题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C保留；\n- D排除。\n\nA和C保留。A读得出的部分能接上促进长期主义，C能从两国愿意作安排间接读到重视长期；A开头尚未读清，这两个说法现在还没有完全拉开。","html":"<h3>24题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>A和C保留。A读得出的部分能接上促进长期主义，C能从两国愿意作安排间接读到重视长期；A开头尚未读清，这两个说法现在还没有完全拉开。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"24"}},{"section":"25题","raw":"## 25题\n\n**Which of the following would be the best title for the text?**\n\n下面哪一个最适合作为全文标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Decisiveness Required of Top Executives**\n\n要求高管具备决断力\n\nB. **Failure of Quarterly Capitalism**\n\n季度资本主义的失败\n\nC. **Patience as a Corporate Virtue**\n\n耐心是一种企业美德\n\nD. **Frustration of Risk-taking Bankers**\n\n冒险银行家的挫败感","html":"<h2>25题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下面哪一个最适合作为全文标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Decisiveness Required of Top Executives</strong></p>\n<p>要求高管具备决断力</p>\n<p>B. <strong>Failure of Quarterly Capitalism</strong></p>\n<p>季度资本主义的失败</p>\n<p>C. <strong>Patience as a Corporate Virtue</strong></p>\n<p>耐心是一种企业美德</p>\n<p>D. <strong>Frustration of Risk-taking Bankers</strong></p>\n<p>冒险银行家的挫败感</p>\n","articleRects":[],"questionRects":[[254,1913,1028,35]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"25"}},{"section":"25题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n> 原文参考：\n>\n> In addition, new digital technologies have allowed more rapid trading of **[xxx]**, quicker use of information, and thus shorter attention spans in financial markets. “There seems to be a **[xxx]** of short-term thinking at the expense of long-term investing,” said Commissioner Daniel Gallagher of the US Securities and Exchange Commission in a speech this week.\n>\n> 开始精读：\n>\n> In addition, / new digital technologies / have allowed more rapid trading of **[xxx]**, / quicker use of information, / and thus shorter attention spans / in financial markets. / “There seems to be / a **[xxx]** of short-term thinking / at the expense of long-term investing,” / said Commissioner Daniel Gallagher / of the US Securities and Exchange Commission / in a speech this week.\n>\n> 另外，/ 新的数字技术 / 已经允许更快地交易 **[xxx]**，/ 更快地使用信息，/ 从而更短的注意持续时间 / 在金融市场中。/ “似乎有 / 一个 **[xxx]** 属于短期思考的 / 以长期投资为代价，”/ 委员 Daniel Gallagher 说 / 美国证券交易委员会的 / 在本周一次演讲中。\n\n> 原文参考：\n>\n> Within companies, the right **[xxx]** design can provide **[xxx]** for executives to think beyond their own time at the company and on behalf of all **[xxx]**. Britain’s new rule is a reminder to bankers that society has an interest in their performance, not just for the short term but for the long term.\n>\n> 开始精读：\n>\n> Within companies, / the right **[xxx]** design / can provide **[xxx]** / for executives to think / beyond their own time at the company / and on behalf of all **[xxx]**. / Britain’s new rule / is a reminder to bankers / that society has an interest / in their performance, / not just for the short term / but for the long term.\n>\n> 在公司内部，/ 正确的 **[xxx]** 设计 / 可以提供 **[xxx]** / 让高管思考 / 超出他们自己在公司的任期 / 并代表所有 **[xxx]**。/ 英国的新规则 / 是给银行家的一个提醒 / 社会有一种利益关切 / 在他们的表现上，/ 不只是对于短期 / 而且对于长期。\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 新规约束银行行为，也期待公司多作长期决策 | 先摆出新做法并提出长远期待 |\n| 第2段 | 点出短期逐利加重，用孩子先吃作比较 | 再说问题正在加重并打个比方 |\n| 第3段 | 持股变短，季度逐利会阻碍公司长期投入 | 再说行为变短后会妨碍长远的事 |\n| 第4段 | 数字技术加速交易，短期思考损害长期投资 | 再说还有什么使问题加重 |\n| 第5段 | 介绍美国通过高管奖金减少短期主义的尝试 | 举一个例子说明已经怎样改善 |\n| 第6段 | 提出更多鼓励长期的做法，再举法国奖励 | 接着补充还能怎样继续改善 |\n| 第7段 | 回到新规，强调公司行为关乎社会长期利益 | 最后收回来说明大家的长远要求 |\n\n---","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In addition, new digital technologies have allowed more rapid trading of <strong>[xxx]</strong>, quicker use of information, and thus shorter attention spans in financial markets. “There seems to be a <strong>[xxx]</strong> of short-term thinking at the expense of long-term investing,” said Commissioner Daniel Gallagher of the US Securities and Exchange Commission in a speech this week.</p>\n<p>开始精读：</p>\n<p>In addition, / new digital technologies / have allowed more rapid trading of <strong>[xxx]</strong>, / quicker use of information, / and thus shorter attention spans / in financial markets. / “There seems to be / a <strong>[xxx]</strong> of short-term thinking / at the expense of long-term investing,” / said Commissioner Daniel Gallagher / of the US Securities and Exchange Commission / in a speech this week.</p>\n<p>另外，/ 新的数字技术 / 已经允许更快地交易 <strong>[xxx]</strong>，/ 更快地使用信息，/ 从而更短的注意持续时间 / 在金融市场中。/ “似乎有 / 一个 <strong>[xxx]</strong> 属于短期思考的 / 以长期投资为代价，”/ 委员 Daniel Gallagher 说 / 美国证券交易委员会的 / 在本周一次演讲中。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Within companies, the right <strong>[xxx]</strong> design can provide <strong>[xxx]</strong> for executives to think beyond their own time at the company and on behalf of all <strong>[xxx]</strong>. Britain’s new rule is a reminder to bankers that society has an interest in their performance, not just for the short term but for the long term.</p>\n<p>开始精读：</p>\n<p>Within companies, / the right <strong>[xxx]</strong> design / can provide <strong>[xxx]</strong> / for executives to think / beyond their own time at the company / and on behalf of all <strong>[xxx]</strong>. / Britain’s new rule / is a reminder to bankers / that society has an interest / in their performance, / not just for the short term / but for the long term.</p>\n<p>在公司内部，/ 正确的 <strong>[xxx]</strong> 设计 / 可以提供 <strong>[xxx]</strong> / 让高管思考 / 超出他们自己在公司的任期 / 并代表所有 <strong>[xxx]</strong>。/ 英国的新规则 / 是给银行家的一个提醒 / 社会有一种利益关切 / 在他们的表现上，/ 不只是对于短期 /
