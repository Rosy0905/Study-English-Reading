 而且对于长期。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>新规约束银行行为，也期待公司多作长期决策</td>\n<td>先摆出新做法并提出长远期待</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>点出短期逐利加重，用孩子先吃作比较</td>\n<td>再说问题正在加重并打个比方</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>持股变短，季度逐利会阻碍公司长期投入</td>\n<td>再说行为变短后会妨碍长远的事</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>数字技术加速交易，短期思考损害长期投资</td>\n<td>再说还有什么使问题加重</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>介绍美国通过高管奖金减少短期主义的尝试</td>\n<td>举一个例子说明已经怎样改善</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>提出更多鼓励长期的做法，再举法国奖励</td>\n<td>接着补充还能怎样继续改善</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>回到新规，强调公司行为关乎社会长期利益</td>\n<td>最后收回来说明大家的长远要求</td>\n</tr>\n</tbody></table>\n<hr>\n","articleRects":[[307,1257,1244,35],[228,1311,1319,35],[228,1364,1320,37],[228,1418,1318,37],[229,1474,973,35],[307,2017,1242,36],[228,2072,1318,35],[229,2126,1319,35],[228,2180,1273,36]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"25","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"25题","raw":"**Which of the following would be the best title for the text?**\n\n### A. Decisiveness Required of Top Executives\n\n要求高管具备决断力\n\n#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果A是主旨，文章中心就应该是“要求高管在作决定时更加果断”。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先提出要求高管果断的新规则和预期好处 | 先摆出新做法并提出长远期待 |\n| 第2段 | 再说高管犹豫不决的问题正在加重 | 再说问题正在加重并打个比方 |\n| 第3段 | 用决策拖延的变化说明犹豫怎样影响公司 | 再说行为变短后会妨碍长远的事 |\n| 第4段 | 再解释什么因素让高管更难果断决定 | 再说还有什么使问题加重 |\n| 第5段 | 举美国怎样训练或督促高管决断的例子 | 举一个例子说明已经怎样改善 |\n| 第6段 | 补充法国怎样帮助高管更快作决定 | 接着补充还能怎样继续改善 |\n| 第7段 | 最后回到规则，强调社会需要高管果断 | 最后收回来说明大家的长远要求 |\n\n如果中心是Decisiveness，文章需要围绕“拿不定主意—怎样果断作决定”展开。实际第2、3段批评的却是想快拿利润、持股时间缩短，并不是犹豫太久；第4段还把交易更快与注意持续时间更短连在一起，这种加快在这里使问题更重。第5、6段调整奖金和持有较久才多得权利，也是在把经营者和股东的眼光拉远。结尾要求看任期以外和社会长期利益，而不是催高管更快拍板。高管确实出现了，但文章关注决定考虑多长时间，A关注决定作得是否果断，两条主线并不相同。\n\n**围绕高管果断决策，能解释文章为什么批评急着取利、又奖励更久持有吗？**\n\n不能。中间的批评与后面的做法共同要求耐心和长期眼光；A把考虑长远换成果断作决定，解释不了这组前后安排。\n\n**判断：A排除。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>A. Decisiveness Required of Top Executives</h3>\n<p>要求高管具备决断力</p>\n<h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是“要求高管在作决定时更加果断”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先提出要求高管果断的新规则和预期好处</td>\n<td>先摆出新做法并提出长远期待</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再说高管犹豫不决的问题正在加重</td>\n<td>再说问题正在加重并打个比方</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用决策拖延的变化说明犹豫怎样影响公司</td>\n<td>再说行为变短后会妨碍长远的事</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>再解释什么因素让高管更难果断决定</td>\n<td>再说还有什么使问题加重</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>举美国怎样训练或督促高管决断的例子</td>\n<td>举一个例子说明已经怎样改善</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>补充法国怎样帮助高管更快作决定</td>\n<td>接着补充还能怎样继续改善</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后回到规则，强调社会需要高管果断</td>\n<td>最后收回来说明大家的长远要求</td>\n</tr>\n</tbody></table>\n<p>如果中心是Decisiveness，文章需要围绕“拿不定主意—怎样果断作决定”展开。实际第2、3段批评的却是想快拿利润、持股时间缩短，并不是犹豫太久；第4段还把交易更快与注意持续时间更短连在一起，这种加快在这里使问题更重。第5、6段调整奖金和持有较久才多得权利，也是在把经营者和股东的眼光拉远。结尾要求看任期以外和社会长期利益，而不是催高管更快拍板。高管确实出现了，但文章关注决定考虑多长时间，A关注决定作得是否果断，两条主线并不相同。</p>\n<p><strong>围绕高管果断决策，能解释文章为什么批评急着取利、又奖励更久持有吗？</strong></p>\n<p>不能。中间的批评与后面的做法共同要求耐心和长期眼光；A把考虑长远换成果断作决定，解释不了这组前后安排。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[254,1913,1028,35],[315,1980,720,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"A"}},{"section":"25题","raw":"**Which of the following would be the best title for the text?**\n\n### B. Failure of Quarterly Capitalism\n\n季度资本主义的失败\n\n#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果B是主旨，文章中心就应该是“季度资本主义作为一种模式已经失败”。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先宣布季度资本主义失败并提出应对 | 先摆出新做法并提出长远期待 |\n| 第2段 | 再说明这种失败越来越严重 | 再说问题正在加重并打个比方 |\n| 第3段 | 用公司经营变化证明该模式已无法运转 | 再说行为变短后会妨碍长远的事 |\n| 第4段 | 再补充导致这种模式失败的技术因素 | 再说还有什么使问题加重 |\n| 第5段 | 举美国已因模式失败而转向新模式的例子 | 举一个例子说明已经怎样改善 |\n| 第6段 | 继续介绍法国怎样放弃失败模式 | 接着补充还能怎样继续改善 |\n| 第7段 | 最后回到开头，总结季度资本主义已经失败 | 最后收回来说明大家的长远要求 |\n\n“quarterly capitalism”出现在第3段，确实与公司只顾季度利润的现象相关。但B把全文中心定成Failure，要求作者证明这套模式失败。文章从英国新规的长远期待写起，第2至4段解释为什么短期逐利值得担忧，第5、6段转向已经采取和还能采取的改善做法，第7段再说社会对公司长期行为的要求。它没有把美国和法国写成某种经济模式已经失败的证据，而是把它们写成鼓励长期的安排。B能覆盖中间对短期做法的批评，却把正文中很大一部分“可以怎样改”压成了失败的例证。\n\n**把全文写成季度资本主义的失败，能说明后半篇为何反复介绍鼓励长期的办法吗？**\n\n不能。后半篇在推动长期思维，结尾也回到长期利益；B抓住了问题现象，却把作者要倡导的方向变成对一个模式已经失败的判断。\n\n**判断：B排除。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>B. Failure of Quarterly Capitalism</h3>\n<p>季度资本主义的失败</p>\n<h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是“季度资本主义作为一种模式已经失败”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先宣布季度资本主义失败并提出应对</td>\n<td>先摆出新做法并提出长远期待</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再说明这种失败越来越严重</td>\n<td>再说问题正在加重并打个比方</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用公司经营变化证明该模式已无法运转</td>\n<td>再说行为变短后会妨碍长远的事</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>再补充导致这种模式失败的技术因素</td>\n<td>再说还有什么使问题加重</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>举美国已因模式失败而转向新模式的例子</td>\n<td>举一个例子说明已经怎样改善</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>继续介绍法国怎样放弃失败模式</td>\n<td>接着补充还能怎样继续改善</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后回到开头，总结季度资本主义已经失败</td>\n<td>最后收回来说明大家的长远要求</td>\n</tr>\n</tbody></table>\n<p>“quarterly capitalism”出现在第3段，确实与公司只顾季度利润的现象相关。但B把全文中心定成Failure，要求作者证明这套模式失败。文章从英国新规的长远期待写起，第2至4段解释为什么短期逐利值得担忧，第5、6段转向已经采取和还能采取的改善做法，第7段再说社会对公司长期行为的要求。它没有把美国和法国写成某种经济模式已经失败的证据，而是把它们写成鼓励长期的安排。B能覆盖中间对短期做法的批评，却把正文中很大一部分“可以怎样改”压成了失败的例证。</p>\n<p><strong>把全文写成季度资本主义的失败，能说明后半篇为何反复介绍鼓励长期的办法吗？</strong></p>\n<p>不能。后半篇在推动长期思维，结尾也回到长期利益；B抓住了问题现象，却把作者要倡导的方向变成对一个模式已经失败的判断。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[254,1913,1028,35],[315,2048,553,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"B"}},{"section":"25题","raw":"**Which of the following would be the best title for the text?**\n\n### C. Patience as a Corporate Virtue\n\n耐心是一种企业美德\n\n#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果C是主旨，文章中心就应该是“公司应当具有耐心，把眼光放到更长远的利益上”。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先提出一种促使公司有耐心的新做法和长远期待 | 先摆出新做法并提出长远期待 |\n| 第2段 | 再说缺乏耐心、急着取得眼前利益的问题加重 | 再说问题正在加重并打个比方 |\n| 第3段 | 用行为变短说明缺乏耐心怎样影响长期投入 | 再说行为变短后会妨碍长远的事 |\n| 第4段 | 再补充让短期取向加重的因素 | 再说还有什么使问题加重 |\n| 第5段 | 举美国如何鼓励耐心和长期行为的例子 | 举一个例子说明已经怎样改善 |\n| 第6段 | 继续介绍还能怎样做，并举法国的安排 | 接着补充还能怎样继续改善 |\n| 第7段 | 最后回到新规，强调公司应顾及大家的长远利益 | 最后收回来说明大家的长远要求 |\n\nPatience不是让公司什么都不做，而是在公司的决定中愿意等待并顾及长远。第1段希望更多long-term decision-making，第2段把急着得利比作孩子马上吃，第3、4段说明这种急迫怎样影响长期投入；这几步把为什么需要耐心说清。第5、6段接着写奖金、较久持有与更多权利，把“如何鼓励长期行为”接上来。最后社会关注的不只是短期表现，还有长期表现，正好回到耐心为什么是公司应有的品质。Corporate也覆盖银行、公司高管和股东这些对象，没有把全文只缩到一类银行家。\n\n**把耐心看作企业应有的品质，能否把新规、短期逐利、改善办法和长期利益连在一起？**\n\n能。前面写缺乏耐心造成的问题，后面写怎样鼓励长期行为，结尾说明社会的长远要求；C能解释文章这几步为什么这样排列。\n\n**判断：C保留。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>C. Patience as a Corporate Virtue</h3>\n<p>耐心是一种企业美德</p>\n<h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“公司应当具有耐心，把眼光放到更长远的利益上”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先提出一种促使公司有耐心的新做法和长远期待</td>\n<td>先摆出新做法并提出长远期待</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再说缺乏耐心、急着取得眼前利益的问题加重</td>\n<td>再说问题正在加重并打个比方</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用行为变短说明缺乏耐心怎样影响长期投入</td>\n<td>再说行为变短后会妨碍长远的事</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>再补充让短期取向加重的因素</td>\n<td>再说还有什么使问题加重</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>举美国如何鼓励耐心和长期行为的例子</td>\n<td>举一个例子说明已经怎样改善</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>继续介绍还能怎样做，并举法国的安排</td>\n<td>接着补充还能怎样继续改善</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后回到新规，强调公司应顾及大家的长远利益</td>\n<td>最后收回来说明大家的长远要求</td>\n</tr>\n</tbody></table>\n<p>Patience不是让公司什么都不做，而是在公司的决定中愿意等待并顾及长远。第1段希望更多long-term decision-making，第2段把急着得利比作孩子马上吃，第3、4段说明这种急迫怎样影响长期投入；这几步把为什么需要耐心说清。第5、6段接着写奖金、较久持有与更多权利，把“如何鼓励长期行为”接上来。最后社会关注的不只是短期表现，还有长期表现，正好回到耐心为什么是公司应有的品质。Corporate也覆盖银行、公司高管和股东这些对象，没有把全文只缩到一类银行家。</p>\n<p><strong>把耐心看作企业应有的品质，能否把新规、短期逐利、改善办法和长期利益连在一起？</strong></p>\n<p>能。前面写缺乏耐心造成的问题，后面写怎样鼓励长期行为，结尾说明社会的长远要求；C能解释文章这几步为什么这样排列。</p>\n<p><strong>判断：C保留。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[254,1913,1028,35],[315,2116,543,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"C"}},{"section":"25题","raw":"**Which of the following would be the best title for the text?**\n\n### D. Frustration of Risk-taking Bankers\n\n冒险银行家的挫败感\n\n#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果D是主旨，文章中心就应该是“冒险的银行家遭遇挫折后的感受”。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写冒险银行家遇到新规后的挫折 | 先摆出新做法并提出长远期待 |\n| 第2段 | 再说他们的挫败感越来越强并作比喻 | 再说问题正在加重并打个比方 |\n| 第3段 | 用投资变化说明银行家的失落怎样发展 | 再说行为变短后会妨碍长远的事 |\n| 第4段 | 再解释技术怎样使这些银行家更受挫 | 再说还有什么使问题加重 |\n| 第5段 | 举美国银行家经历挫折的具体事件 | 举一个例子说明已经怎样改善 |\n| 第6段 | 继续写法国银行家相似的情绪经历 | 接着补充还能怎样继续改善 |\n| 第7段 | 最后回到银行家本人，归结他们的挫败感 | 最后收回来说明大家的长远要求 |\n\n第1段有bankers和harmful risk-taking，新规还可能延后高管奖金，D因此看起来碰到了开头的一些词。可Frustration要求文章以银行家的受挫感受为中心，实际后面写的是上市公司、投资者、数字交易以及政策安排，没有继续描写银行家失望、不满或受挫的心理。第6段的法国例子甚至以股东持有时间和投票权为内容，第7段讨论的是社会对银行家长期表现的利益关切。D不但把公司范围缩成冒险银行家，也把行为规则和长期后果改成他们自己的情绪。\n\n**银行家受挫的情绪，能解释公司持股时间、法国股东权利和社会长期利益这些安排吗？**\n\n不能。这些段落都服务于公司怎样顾及长远，D只能碰到开头的银行家和风险两个对象，无法接住中间展开及结尾。\n\n**判断：D排除。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>D. Frustration of Risk-taking Bankers</h3>\n<p>冒险银行家的挫败感</p>\n<h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是“冒险的银行家遭遇挫折后的感受”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先写冒险银行家遇到新规后的挫折</td>\n<td>先摆出新做法并提出长远期待</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再说他们的挫败感越来越强并作比喻</td>\n<td>再说问题正在加重并打个比方</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用投资变化说明银行家的失落怎样发展</td>\n<td>再说行为变短后会妨碍长远的事</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>再解释技术怎样使这些银行家更受挫</td>\n<td>再说还有什么使问题加重</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>举美国银行家经历挫折的具体事件</td>\n<td>举一个例子说明已经怎样改善</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>继续写法国银行家相似的情绪经历</td>\n<td>接着补充还能怎样继续改善</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后回到银行家本人，归结他们的挫败感</td>\n<td>最后收回来说明大家的长远要求</td>\n</tr>\n</tbody></table>\n<p>第1段有bankers和harmful risk-taking，新规还可能延后高管奖金，D因此看起来碰到了开头的一些词。可Frustration要求文章以银行家的受挫感受为中心，实际后面写的是上市公司、投资者、数字交易以及政策安排，没有继续描写银行家失望、不满或受挫的心理。第6段的法国例子甚至以股东持有时间和投票权为内容，第7段讨论的是社会对银行家长期表现的利益关切。D不但把公司范围缩成冒险银行家，也把行为规则和长期后果改成他们自己的情绪。</p>\n<p><strong>银行家受挫的情绪，能解释公司持股时间、法国股东权利和社会长期利益这些安排吗？</strong></p>\n<p>不能。这些段落都服务于公司怎样顾及长远，D只能碰到开头的银行家和风险两个对象，无法接住中间展开及结尾。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[254,1913,1028,35],[315,2184,606,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"25","option":"D"}},{"section":"25题","raw":"### 25题结论\n\n**25. C. Patience as a Corporate Virtue**\n\n全文由鼓励长期决策的新规进入，说明急着取得眼前利润的问题，再提出可以鼓励长期行为的做法，最后回到社会的长远利益。C把这些步骤收在公司应有耐心这一条线上。\n\n这句话就是本文后续做题的主旨底牌：\n\n**Patience as a Corporate Virtue / 耐心是一种企业美德**\n\n---","html":"<h3>25题结论</h3>\n<p><strong>25. C. Patience as a Corporate Virtue</strong></p>\n<p>全文由鼓励长期决策的新规进入，说明急着取得眼前利润的问题，再提出可以鼓励长期行为的做法，最后回到社会的长远利益。C把这些步骤收在公司应有耐心这一条线上。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Patience as a Corporate Virtue / 耐心是一种企业美德</strong></p>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"25"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为 >。</p>\n<blockquote>\n<p><strong>23题选C。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review","qid":"23"}},{"section":"进阶回查","raw":"## 回查24题：A还是C？\n\n第一遍留下：\n\n- A. the **[xxx]** to promoting “long-termism”\n- C. the significance of long-term thinking\n\n主旨底牌是：\n\n> **Patience as a Corporate Virtue**\n\n也就是：\n\n> 耐心是一种企业美德\n\n我们先把题干和两个选项接起来。\n\n题干问美国和法国两个例子在文中用来说明什么。A是the **[xxx]** to promoting “long-termism”，其中促进长期主义能读懂，前面的名词仍然没有读懂，整项关系也就没有读全；C说的是长期思维的重要性。第一遍，美国的法案略微帮助减少短期主义，法国给持有投资至少两年的股东更多投票权。这些安排使A读得出的部分有了对应，也让C的“重视长期”显得有可能，所以当时留下了两项。\n\n现在拿主旨来检查。\n\n主旨把全文组织成公司应当有耐心、顾及长远。沿着全文顺序看，第2至4段已经把为什么急着取利会出问题展开了：持股时间变短、长期研究受阻、短期思考以长期投资为代价。到美国和法国时，文章开始回答这种取向可以怎样改变。第6段的Much more could be done接着美国已有的安排，说还可以多做哪些事，随后才出现法国股东的例子。\n\nC说的重要性可以概括全文对长期思维的重视，却把这两个例子在这里承担的作用说得过宽。若这里仍主要在说明“长期很重要”，前面关于长期努力受阻的内容和这里的奖金、持有两年、更多投票权就没有分开。实际推进是前面解释问题，这里介绍可以采取的具体安排；C只说重要性，没有接住从问题转向行动的这一步。\n\n再看A，promoting long-termism至少与这两段想促成的行为改变相接；但the **[xxx]** 的名词到底是什么，仍然不能说已经明白，也不能把整项直接翻译成“具体做法”。回到第一遍读过的helping reduce、could be done和earn more voting rights，原文对两国例子的安排是清楚的。C把这个用途概括得过宽以后，在留下的两个候选中，A有更多依据作为本题的作答。选择A，同时把没有读懂的首词仍保留为 **[xxx]**。\n\n> **24题选A。**\n\n---","html":"<h2>回查24题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. the <strong>[xxx]</strong> to promoting “long-termism”</li>\n<li>C. the significance of long-term thinking</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Patience as a Corporate Virtue</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>耐心是一种企业美德</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>题干问美国和法国两个例子在文中用来说明什么。A是the <strong>[xxx]</strong> to promoting “long-termism”，其中促进长期主义能读懂，前面的名词仍然没有读懂，整项关系也就没有读全；C说的是长期思维的重要性。第一遍，美国的法案略微帮助减少短期主义，法国给持有投资至少两年的股东更多投票权。这些安排使A读得出的部分有了对应，也让C的“重视长期”显得有可能，所以当时留下了两项。</p>\n<p>现在拿主旨来检查。</p>\n<p>主旨把全文组织成公司应当有耐心、顾及长远。沿着全文顺序看，第2至4段已经把为什么急着取利会出问题展开了：持股时间变短、长期研究受阻、短期思考以长期投资为代价。到美国和法国时，文章开始回答这种取向可以怎样改变。第6段的Much more could be done接着美国已有的安排，说还可以多做哪些事，随后才出现法国股东的例子。</p>\n<p>C说的重要性可以概括全文对长期思维的重视 QMFhrX2g6gD3EurfJWQaLY8c7UkjOj47TALbslDfbst35Fkuo4LPhPB9SNIwqLU4oU49b++7O4r+Y0vD5wAUYJ/ecOYv1HSFc77nTlbqhOeZt/p9MG/ikiUbyTRZ5qGaPNCLAUx1BHmyNmkYItqTbM3GJwTkD0LwF2YINrl9/7/JTPGXLGCtWwW6FXskI7gZ/+RcogtGmawfyRim66oJhIHbkVsfrjXuMSMxWGf/lRj56+dbKPM4rVpHZqG6kxuGAZfnr7hlsyJS9kU/NDUb0Z7CJhX2HcmaTfPbvPOfQS2aWoWkj58GXCS5ISiBxRd2WUkihXXZR7jYZlKBNHrBFDdGhIZHJKicLgrBZRpsZG+d9beFTXg6o0V1xIyCdTqpC5p533Kh8sbrg9pZ4++uuX0DHWd0oYqhQPJ1avYWGpGAsQUP/HP2KO3PE9n6r8SAXtW8URK9hwca8FvmjzP2XvurA5qQl79pE/CsNf//Hf/7/+47///vvvv//++++///7777///vvvv//++++///7777///vvvv//++++///7777///vvvv//++++///7777///vvvv//++++///7777///l/WIg==","articleSize":{"w":1804,"h":2513},"questionSize":{"w":1804,"h":2513},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>21题题干</h2>\n<p><strong>According to Paragraph 1, one motive in imposing the new rule is to ______.</strong></p>\n<blockquote>\n<p>根据第1段，实行这条新规则的一个动机是什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>22题题干</h2>\n<p><strong>Alfred Marshall is quoted to indicate ______.</strong></p>\n<blockquote>\n<p>引用Alfred Marshall的话，是为了说明什么？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n<hr>\n<h2>23题题干</h2>\n<p><strong>It is argued that the influence of transient investment on public companies can be ______.</strong></p>\n<blockquote>\n<p>文章说，短期投资对上市公司的影响可能是什么样的？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>24题题干</h2>\n<p><strong>The US and France examples are used to illustrate ______.</strong></p>\n<blockquote>\n<p>美国和法国的例子，是用来说明什么的？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n<hr>\n<h2>25题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下面哪一个最适合作为全文标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>Yet, rather than, In addition, not just, but</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>unusual, harmful, stronger, worsened</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>delayed, restore, dropped, encourage</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>profits, performance, voting rights</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>banks, companies, short-termism, long-termism</td>\n</tr>\n</tbody></table>\n<p>Financial <strong>[xxx]</strong> in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any <strong>[xxx]</strong> bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this “clawback” rule is to hold bankers <strong>[xxx]</strong> for harmful risk-taking and to restore public trust in financial <strong>[xxx]</strong>. Yet officials also hope for a much larger benefit: more long-term decision-making, not only by banks but by all corporations, to build a stronger economy for future generations.</p>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane. He quotes a giant of classical economics, Alfred Marshall, in describing this financial <strong>[xxx]</strong> as acting like “children who pick the <strong>[xxx]</strong> out of their <strong>[xxx]</strong> to eat them at once” rather than putting them aside to be eaten last.</p>\n<p>The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades. Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>. This has been <strong>[xxx]</strong> “quarterly capitalism.”</p>\n<p>In addition, new digital technologies have allowed more rapid trading of <strong>[xxx]</strong>, quicker use of information, and thus shorter attention spans in financial markets. “There seems to be a <strong>[xxx]</strong> of short-term thinking at the expense of long-term investing,” said Commissioner Daniel Gallagher of the US Securities and Exchange Commission in a speech this week.</p>\n<p>In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to <strong>[xxx]</strong> performance bonuses for senior executives by about a year, slightly helping reduce “short-termism.” In its latest survey of CEO pay, The Wall Street Journal finds that “a <strong>[xxx]</strong> part” of executive pay is now tied to performance.</p>\n<p>Much more could be done to encourage “long-termism,” such as changes in the tax code and quicker <strong>[xxx]</strong> of stock <strong>[xxx]</strong>. In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n<p>Within companies, the right <strong>[xxx]</strong> design can provide <strong>[xxx]</strong> for executives to think beyond their own time at the company and on behalf of all <strong>[xxx]</strong>. Britain’s new rule is a reminder to bankers that society has an interest in their performance, not just for the short term but for the long term.</p>\n<p>Financial <strong>[xxx]</strong> in Britain / have imposed a rather unusual rule / on the bosses of big banks. / Starting next year, / any <strong>[xxx]</strong> bonus of top executives / could be delayed 10 years / if their banks are under investigation / for wrongdoing. / The main purpose of this “clawback” rule / is to hold bankers <strong>[xxx]</strong> / for harmful risk-taking / and to restore public trust / in financial <strong>[xxx]</strong>. / Yet officials also hope / for a much larger benefit: / more long-term decision-making, / not only by banks / but by all corporations, / to build a stronger economy / for future generations.</p>\n<p>“Short-termism,” / or the desire for quick profits, / has worsened in publicly traded companies, / says the Bank of England’s top economist, / Andrew Haldane. / He quotes a giant of classical economics, / Alfred Marshall, / in describing this financial <strong>[xxx]</strong> / as acting like “children / who pick the <strong>[xxx]</strong> / out of their <strong>[xxx]</strong> / to eat them at once” / rather than putting them aside / to be eaten last.</p>\n<p>The average time / for holding a stock / in both the United States and Britain, / he notes, / has dropped from seven years / to seven months / in recent decades. / Transient investors, / who demand high quarterly profits / from companies, / can hinder a firm’s efforts / to invest in long-term research / or to build up customer <strong>[xxx]</strong>. / This has been <strong>[xxx]</strong> / “quarterly capitalism.”</p>\n<p>In addition, / new digital technologies / have allowed more rapid trading of <strong>[xxx]</strong>, / quicker use of information, / and thus shorter attention spans / in financial markets. / “There seems to be / a <strong>[xxx]</strong> of short-term thinking / at the expense of long-term investing,” / said Commissioner Daniel Gallagher / of the US Securities and Exchange Commission / in a speech this week.</p>\n<p>In the US, / the Sarbanes-Oxley Act of 2002 / has pushed most public companies / to <strong>[xxx]</strong> performance bonuses / for senior executives / by about a year, / slightly helping reduce “short-termism.” / In its latest survey of CEO pay, / The Wall Street Journal finds / that “a <strong>[xxx]</strong> part” / of executive pay / is now tied to performance.</p>\n<p>Much more could be done / to encourage “long-termism,” / such as changes in the tax code / and quicker <strong>[xxx]</strong> / of stock <strong>[xxx]</strong>. / In France, / shareholders who hold onto a company investment / for at least two years / can sometimes earn more voting rights / in a company.</p>\n<p>Within companies, / the right <strong>[xxx]</strong> design / can provide <strong>[xxx]</strong> / for executives to think / beyond their own time at the company / and on behalf of all <strong>[xxx]</strong>. / Britain’s new rule / is a reminder to bankers / that society has an interest / in their performance, / not just for the short term / but for the long term.</p>\n<p>Financial <strong>[xxx]</strong> 在英国 / have imposed 相当不寻常的规则 / on the bosses of 大银行. / 从明年开始, / any <strong>[xxx]</strong> 奖金 of top executives / 可能被推迟10年 / if their banks are under investigation / for wrongdoing. / The main purpose of this “clawback” rule / is to hold bankers <strong>[xxx]</strong> / for harmful risk-taking / and 去恢复公众信任 / in financial <strong>[xxx]</strong>. / Yet 官员 also hope / for a much larger benefit: / 更多长期决策, / not only by banks / but by 所有公司, / to build 更强的经济 / for 未来几代人.</p>\n<p>“短期主义,” / or the desire for 快速利润, / has worsened in publicly traded 公司, / says the Bank of England’s top economist, / Andrew Haldane. / He quotes a giant of classical economics, / Alfred Marshall, / in describing this financial <strong>[xxx]</strong> / as acting like “孩子们 / who pick the <strong>[xxx]</strong> / out of their <strong>[xxx]</strong> / 去立刻吃掉它们” / rather than putting them aside / 留到最后吃.</p>\n<p>平均时间 / for holding a stock / in both the United States and Britain, / he notes, / has dropped from 七年 / to 七个月 / in recent decades. / Transient investors, / who demand high quarterly profits / from 公司, / can hinder a firm’s efforts / to invest in 长期研究 / or to build up 客户 <strong>[xxx]</strong>. / This has been <strong>[xxx]</strong> / “季度资本主义.”</p>\n<p>另外, / 新的数字技术 / have allowed more rapid trading of <strong>[xxx]</strong>, / quicker use of 信息, / and thus shorter attention spans / in 金融市场. / “There seems to be / a <strong>[xxx]</strong> of short-term thinking / at the expense of long-term investing,” / said Commissioner Daniel Gallagher / of the US Securities and Exchange Commission / in 本周一次演讲.</p>\n<p>在美国, / the Sarbanes-Oxley Act of 2002 / has pushed most public companies / to <strong>[xxx]</strong> 绩效奖金 / for senior executives / by 大约一年, / slightly helping reduce “short-termism.” / In its latest survey of 首席执行官薪酬, / The Wall Street Journal finds / that “a <strong>[xxx]</strong> part” / of executive pay / is now tied to 业绩。</p>\n<p>更多事情 could be done / to encourage “长期主义,” / such as changes in the tax code / and quicker <strong>[xxx]</strong> / of stock <strong>[xxx]</strong>. / 在法国, / shareholders who hold onto a company investment / for 至少两年 / can sometimes earn more 投票权 / in a company.</p>\n<p>在公司内部, / the right <strong>[xxx]</strong> 设计 / can provide <strong>[xxx]</strong> / for 高管 to think / beyond 他们自己的时间 at the company / and on behalf of all <strong>[xxx]</strong>. / 英国的新规则 / is a reminder to bankers / that 社会 has an interest / in 他们的表现, / not just 对于短期 / but 对于长期.</p>\n<p>1、在英国、相当不寻常的规则、大银行；从明年开始、奖金、可能被推迟10年；去恢复公众信任、官员、更多长期决策、所有公司、更强的经济、未来几代人。</p>\n<p>2、短期主义、快速利润、公司；Andrew Haldane、Alfred Marshall；孩子们、去立刻吃掉它们、留到最后吃。</p>\n<p>3、平均时间、七年、七个月；公司、长期研究、客户、季度资本主义。</p>\n<p>4、另外、新的数字技术、信息、金融市场；Daniel Gallagher、本周一次演讲。</p>\n<p>5、在美国、2002、绩效奖金、大约一年、首席执行官薪酬、业绩。</p>\n<p>6、更多事情、长期主义；在法国、至少两年、投票权。</p>\n<p>7、在公司内部、设计、高管、他们自己的时间；英国的新规则、社会、他们的表现、对于短期、对于长期。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和银行、公司里的规则有关，开头似乎出现奖金、可能被推迟10年、公众信任，还有更多长期决策；中间看到短期主义、快速利润，出现Andrew Haldane和Alfred Marshall，随后还有七年、七个月、长期研究、客户、新的数字技术；后面又看到美国、2002、绩效奖金，法国、至少两年、投票权，结尾出现英国的新规则、社会、他们的表现，以及短期、长期。</p>\n<p>到这里还不能自然地说清楚：奖金为什么可能推迟10年，孩子们的那几句话跟公司有什么关系，七年和七个月说的到底是什么，美国和法国这些做法各自怎样起作用。粗读时只要能判断“这篇文章大概与银行、公司的规则、短期和长期有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住银行奖金、短期主义、两个人名、七年和七个月、美国、法国和结尾的短期与长期；这些信息之间到底是什么关系，等题目问到再精读。</p>\n<hr>\n<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n<h2>21题</h2>\n<blockquote>\n<p>According to Paragraph 1, one motive in imposing the new rule is to ______.<br>根据第1段，实行这条新规则的一个动机是什么？</p>\n</blockquote>\n<p>题干直接给出 Paragraph 1，所以回到第1段，从英国的新规则读到最后的未来几代人。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Financial <strong>[xxx]</strong> in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any <strong>[xxx]</strong> bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this “clawback” rule is to hold bankers <strong>[xxx]</strong> for harmful risk-taking and to restore public trust in financial <strong>[xxx]</strong>. Yet officials also hope for a much larger benefit: more long-term decision-making, not only by banks but by all corporations, to build a stronger economy for future generations.</p>\n<p>开始精读：</p>\n<p>Financial <strong>[xxx]</strong> in Britain / have imposed a rather unusual rule / on the bosses of big banks. / Starting next year, / any <strong>[xxx]</strong> bonus of top executives / could be delayed 10 years / if their banks are under investigation / for wrongdoing. / The main purpose of this “clawback” rule / is to hold bankers <strong>[xxx]</strong> / for harmful risk-taking / and to restore public trust / in financial <strong>[xxx]</strong>. / Yet officials also hope / for a much larger benefit: / more long-term decision-making, / not only by banks / but by all corporations, / to build a stronger economy / for future generations.</p>\n<p>金融的 <strong>[xxx]</strong> 在英国 / 已经施加一条相当不寻常的规则 / 在大银行的老板身上。/ 从明年开始，/ 任何 <strong>[xxx]</strong> 的奖金属于高管的 / 可能被推迟10年 / 如果他们的银行正在接受调查 / 因为不当行为。/ 这条“追回”规则的主要目的 / 是让银行家 <strong>[xxx]</strong> / 对于有害的冒险行为 / 并恢复公众信任 / 对金融 <strong>[xxx]</strong> 的。/ 然而官员也希望 / 得到一个大得多的好处：/ 更多长期决策，/ 不仅由银行作出 / 而且由所有公司作出，/ 去建立一个更强的经济 / 为未来几代人。</p>\n</blockquote>\n<p>题干问实行规则的动机。这里既有 The main purpose 引出的主要目的，也有 Yet 后面官员希望得到的更大好处；两处都要看。奖金可以推迟是做法，为什么这样做才是空格要补的内容。</p>\n<h3>A. guarantee the bonuses of top executives</h3>\n<blockquote>\n<p>保证高管的奖金</p>\n</blockquote>\n<p>把A接回题干，它说的是：新规则的一个动机是保证高管拿到奖金。</p>\n<p>A的 guarantee the bonuses 是“保证奖金”，原文的 could be delayed 10 years 则在说明这些奖金会怎样处理；两边说的是同一笔高管奖金，所以回看从 Starting next year 开始的句子。</p>\n<blockquote>\n<p>Starting next year, any <strong>[xxx]</strong> bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing.</p>\n</blockquote>\n<p>原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。could be delayed 10 years 给的是限制和延期，并没有把发放奖金当作需要保护的目标。A的 guarantee the bonuses 则把这条规则说成保证高管奖金的措施；一个在出现问题时扣住奖金，一个以保证奖金为目的，奖金相同，规则对奖金做的事却变了。</p>\n<p><strong>原文用可能推迟10年的办法约束奖金，能说它的动机是保证奖金吗？</strong></p>\n<p>不能。高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. <strong>[xxx]</strong> bankers’ sense of responsibility</h3>\n<blockquote>\n<p><strong>[xxx]</strong> 银行家的责任意识</p>\n</blockquote>\n<p>把B接回题干，它说的是：新规则的一个动机是 <strong>[xxx]</strong> 银行家的责任意识。</p>\n<p>B里的 bankers’ sense of responsibility 说银行家的责任，原文的 for harmful risk-taking 也把银行家与有害的冒险行为连在一起；两边都在谈银行家怎样面对自己的行为，所以回看 The main purpose 开始的句子。</p>\n<blockquote>\n<p>The main purpose of this “clawback” rule is to hold bankers <strong>[xxx]</strong> for harmful risk-taking and to restore public trust in financial <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文明确把 bankers 放在 hold 后面，又用 for harmful risk-taking 接上有害的冒险行为：规则要让这些银行家对于这样的行为处于某种状态。B的 bankers’ sense of responsibility 仍然围绕银行家对行为的责任意识，与这部分可以接上。不过，原文 hold bankers 后的 <strong>[xxx]</strong> 以及B开头的 <strong>[xxx]</strong> 都没有读懂，具体要怎样对待这种责任意识，还不能把两句话完全连起来。后面的 restore public trust 只让我们知道还希望恢复公众信任，并没有替这两个位置作出解释。</p>\n<p><strong>目前银行家和有害冒险行为能接上，但两个 [xxx] 没读懂，能把B排掉吗？</strong></p>\n<p>不能。B说的银行家责任与规则的主要目的有对应的对象，尚未读懂的是对责任意识做什么；现在没有哪一处已经把这个说法否定掉。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. build a new system of financial regulation</h3>\n<blockquote>\n<p>建立一套新的金融监管体系</p>\n</blockquote>\n<p>把C接回题干，它说的是：实行这条新规则是为了建立一套新的金融监管体系。</p>\n<p>C的 a new system of financial regulation 指一整套金融监管体系，原文的 a rather unusual rule 指对银行老板施加的这一条规则；两边都涉及管理银行，所以先回看第一句，再接着看明确说明主要目的的句子。</p>\n<blockquote>\n<p>Financial <strong>[xxx]</strong> in Britain have imposed a rather unusual rule on the bosses of big banks.</p>\n</blockquote>\n<blockquote>\n<p>The main purpose of this “clawback” rule is to hold bankers <strong>[xxx]</strong> for harmful risk-taking and to restore public trust in financial <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文先给出 a rather unusual rule，再说明它约束的是大银行老板，具体涉及奖金以及有害冒险行为。主要目的的两个动作，都落在银行家及公众信任上。C却把要完成的事情改成建立 a new system of financial regulation，要求原文谈一整套新体系怎样建立。这里介绍的是已有规则中的具体要求和它想改变的行为，不能把“施加一条规则”直接换成“以建立整套体系为目的”；<strong>[xxx]</strong> 出现在银行家的状态或金融对象处，也不会把已写出的规则和目的扩成新体系建设。</p>\n<p><strong>原文解释的是这一条规则对银行家和公众信任的作用，能改成建立一整套监管体系吗？</strong></p>\n<p>不能。一条新要求不等于一整套新体系，原文说明的目的也已经落到银行家行为和公众信任；C把要实现的事情换掉了。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. help corporations achieve larger profits</h3>\n<blockquote>\n<p>帮助公司获得更大利润</p>\n</blockquote>\n<p>把D接回题干，它说的是：实行新规则的一个动机是帮助公司获得更大利润。</p>\n<p>D的 corporations 和原文的 all corporations 是同一类对象，但 achieve larger profits 要和原文希望的 a much larger benefit 分清；因此回看 Yet officials also hope 后面的整句，看看这个好处具体是什么。</p>\n<blockquote>\n<p>Yet officials also hope for a much larger benefit: more long-term decision-making, not only by banks but by all corporations, to build a stronger economy for future generations.</p>\n</blockquote>\n<p>原文用冒号解释 a much larger benefit：银行和所有公司作出更多长期决策，为未来几代人建立更强的经济。D的 achieve larger profits 则是让公司自己赚到更大利润。两边虽然都有“更大”和公司，但原文 bigger 的对象是这条规则给经济和未来几代人的好处，D bigger 的对象是公司的利润。more long-term decision-making 说决策看多远，也没有写利润要变大。把 benefit 读成 profits，就把面向未来经济的目标缩成了公司赚钱。</p>\n<p><strong>让公司作长期决策、为后代建立更强经济，能直接改写成让公司获得更大利润吗？</strong></p>\n<p>不能。公司是被要求作长期决策的主体，未来几代人的经济才是后面指出的目的；D把这两个位置合成了公司利润增加。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>21题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B保留。它能接上银行家对于有害冒险行为的责任；A把约束奖金说成保证奖金，C换成新体系建设，D换成公司利润，这三项都与第1段实际解释的规则目的不同。</p>\n<blockquote>\n<p><strong>21题选B。</strong></p>\n</blockquote>\n<h2>22题</h2>\n<blockquote>\n<p>Alfred Marshall is quoted to indicate ______.<br>引用Alfred Marshall的话，是为了说明什么？</p>\n</blockquote>\n<p>题干点名 Alfred Marshall，他出现在第2段。先把这一段从“短期主义”读到孩子把东西留到最后吃，看看引语前面在说什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane. He quotes a giant of classical economics, Alfred Marshall, in describing this financial <strong>[xxx]</strong> as acting like “children who pick the <strong>[xxx]</strong> out of their <strong>[xxx]</strong> to eat them at once” rather than putting them aside to be eaten last.</p>\n<p>开始精读：</p>\n<p>“Short-termism,” / or the desire for quick profits, / has worsened in publicly traded companies, / says the Bank of England’s top economist, / Andrew Haldane. / He quotes a giant of classical economics, / Alfred Marshall, / in describing this financial <strong>[xxx]</strong> / as acting like “children / who pick the <strong>[xxx]</strong> / out of their <strong>[xxx]</strong> / to eat them at once” / rather than putting them aside / to be eaten last.</p>\n<p>“短期主义”，/ 或者对快速利润的渴望，/ 在上市公司里已经变得更严重，/ 英格兰银行的首席经济学家说，/ Andrew Haldane。/ 他引用古典经济学的一位巨人，/ Alfred Marshall，/ 在描述这个金融 <strong>[xxx]</strong> 时 / 像“孩子们那样行动 / 他们挑出 <strong>[xxx]</strong> / 从他们的 <strong>[xxx]</strong> 里 / 去立刻吃掉它们”/ 而不是把它们放到一边 / 留到最后吃。</p>\n</blockquote>\n<p>被引用的是孩子“马上吃”与“留到最后吃”的比较。前面有 in describing，说明这句话是在描述刚才的金融现象；要回答的是这个比较说明了什么，而不是孩子具体从哪里挑出了什么。</p>\n<h3>A. the <strong>[xxx]</strong> structure of publicly traded companies</h3>\n<blockquote>\n<p>上市公司的 <strong>[xxx]</strong> 结构</p>\n</blockquote>\n<p>把A接回题干，它说的是：引用Marshall的话是为了说明上市公司的某种 <strong>[xxx]</strong> 结构。</p>\n<p>A的 structure of publicly traded companies 和原文 in publicly traded companies 都提到上市公司，所以回到第2段第一句；紧接着再看 acting like children 的比较，区分原文谈的是公司结构还是追求利润的行为。</p>\n<blockquote>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies …</p>\n</blockquote>\n<blockquote>\n<p>… in describing this financial <strong>[xxx]</strong> as acting like “children who pick the <strong>[xxx]</strong> out of their <strong>[xxx]</strong> to eat them at once” rather than putting them aside to be eaten last.</p>\n</blockquote>\n<p>原文 in publicly traded companies 交代现象发生在哪里，现象本身是 the desire for quick profits，接着借孩子马上吃东西的动作描述它。A的 structure of publicly traded companies 却把要描述的对象变成上市公司的结构。孩子先吃还是后吃，对应的是取舍和等待，无法对应公司内部怎样组成、层级怎样安排。A开头虽然有 <strong>[xxx]</strong>，它修饰的仍然是 structure，不会把“公司结构”变成“公司追求快速利润的行为”。</p>\n<p><strong>马上吃还是留到最后吃，描述的是行为选择，能用来说明公司的结构吗？</strong></p>\n<p>不能。上市公司在原文里是短期逐利现象所在的地方，并不是引语要解释的组成结构。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. governments’ impatience in decision-making</h3>\n<blockquote>\n<p>政府在决策中的不耐心</p>\n</blockquote>\n<p>把B接回题干，它说的是：引用Marshall的话是为了说明政府作决策没有耐心。</p>\n<p>B的 governments’ impatience 说政府没有耐心，原文的 the desire for quick profits 与 to eat them at once 确实也写到急着获得眼前东西；所以回看这一段首句及孩子比喻，确认没有耐心的是谁。</p>\n<blockquote>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane.</p>\n</blockquote>\n<blockquote>\n<p>… children who pick the <strong>[xxx]</strong> out of their <strong>[xxx]</strong> to eat them at once …</p>\n</blockquote>\n<p>原文的 the desire for quick profits 发生在上市公司，孩子“马上吃”的比喻用来描述这种急着取得眼前利润的行为。B的 governments’ impatience 把主体改成政府。Haldane是说这段话的经济学家，他所在机构的名字也不等于这段批评政府；要被描述的主体已经由 in publicly traded companies 给出，不能把发言者所在机构换成被批评的政府。</p>\n<p><strong>急着取得眼前利益的是这里的公司，能把它换成政府作决策没有耐心吗？</strong></p>\n<p>不能。原文把“短期主义”放在上市公司中，B却让政府承担了这个行为，主体发生了变化。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. the conditions for <strong>[xxx]</strong> quick profits</h3>\n<blockquote>\n<p><strong>[xxx]</strong> 快速利润的条件</p>\n</blockquote>\n<p>把C接回题干，它说的是：引用Marshall的话是为了说明 <strong>[xxx]</strong> 快速利润的条件。</p>\n<p>C的 conditions 和原文的 the desire for quick profits 都围绕快速利润，但一个问条件，一个写渴望；因此回看第2段第一句以及 to eat them at once 所在的孩子比喻，看看有没有在解释满足什么条件。</p>\n<blockquote>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane.</p>\n</blockquote>\n<blockquote>\n<p>… to eat them at once” rather than putting them aside to be eaten last.</p>\n</blockquote>\n<p>原文的 the desire for quick profits 说明公司想尽快拿到利润，随后把这个想法比作现在吃还是留到最后吃，比较的是愿不愿意等待。C的 conditions 则要求引语交代某件事成立需要哪些条件；<strong>[xxx]</strong> 暂时不明白，但后面 quick profits 以及前面的 conditions 已经确定，它是在说有关快速利润的条件。原文没有把“孩子先吃”设成获取利润必须具备的条件，而是在用这一行为描述公司想立刻得到利益的倾向，描述对象和要说明的关系不同。</p>\n<p><strong>借孩子先吃来描述急着得利，等于说明有关快速利润的条件吗？</strong></p>\n<p>不等于。这里对照的是马上享用和留到最后，作用是把一种急于获利的行为说清楚；C把这种行为描述改成了条件说明。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. “short-termism” in economic activities</h3>\n<blockquote>\n<p>经济活动中的“短期主义”</p>\n</blockquote>\n<p>把D接回题干，它说的是：引用Marshall的话是为了说明经济活动中的“短期主义”。</p>\n<p>D的 economic activities 说经济活动，原文 the desire for quick profits 就是在说明公司追逐利润的活动；D里的 short-termism 又在段首直接出现，所以回看段首的解释和末尾马上吃、最后吃的对照。</p>\n<blockquote>\n<p>“Short-termism,” or the desire for quick profits, has worsened in publicly traded companies …</p>\n</blockquote>\n<blockquote>\n<p>… to eat them at once” rather than putting them aside to be eaten last.</p>\n</blockquote>\n<p>原文先用 the desire for quick profits 解释短期主义，再把这种金融现象比成孩子马上吃掉东西、不留到最后。D的 economic activities 把上市公司的逐利行为放在经济活动中，short-termism 则接住段首明确说的倾向。比喻里挑的具体东西还是 <strong>[xxx]</strong>，但 at once 和 last 都能读懂，先后取舍与急着获得利润的时间选择能够接上；这正好说明引语为什么跟在“短期主义”后面。</p>\n<p><strong>公司急着拿利润，与孩子马上吃、不肯等到最后，是否都在说明“短期主义”？</strong></p>\n<p>能。两者都把眼前取得放在后面等待之前，D既接住段首现象，也解释了孩子比喻在这里的作用。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>22题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>D保留。段首明确写短期主义，孩子“马上吃”与“最后吃”的比较把这种急着取得利益的行为说得更直观；其余三项分别换成公司结构、政府和获利条件。</p>\n<blockquote>\n<p><strong>22题选D。</strong></p>\n</blockquote>\n<h2>23题</h2>\n<blockquote>\n<p>It is argued that the influence of transient investment on public companies can be ______.<br>文章说，短期投资对上市公司的影响可能是什么样的？</p>\n</blockquote>\n<p>题干的 transient investment 指短期投资，第3段出现 Transient investors，都是在说投资者只停留较短时间。回到第3段，从持股时间读到“季度资本主义”。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades. Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>. This has been <strong>[xxx]</strong> “quarterly capitalism.”</p>\n<p>开始精读：</p>\n<p>The average time / for holding a stock / in both the United States and Britain, / he notes, / has dropped from seven years / to seven months / in recent decades. / Transient investors, / who demand high quarterly profits / from companies, / can hinder a firm’s efforts / to invest in long-term research / or to build up customer <strong>[xxx]</strong>. / This has been <strong>[xxx]</strong> / “quarterly capitalism.”</p>\n<p>平均时间 / 对于持有一只股票 / 在美国和英国两地，/ 他指出，/ 已经从七年下降 / 到七个月 / 在最近几十年。/ 短期投资者，/ 他们要求高的季度利润 / 从公司那里，/ 能够阻碍一家公司的努力 / 去投资长期研究 / 或者去建立客户 <strong>[xxx]</strong>。/ 这已经被 <strong>[xxx]</strong> / “季度资本主义”。</p>\n</blockquote>\n<p>题干要补的是短期投资对公司的影响。第1句用七年变七个月说明持股时间；第2句才写投资者要求什么，以及这会对公司的长期研究和客户方面的努力做什么。影响和投资者停留多久，需要分开看。</p>\n<h3>A. minimal</h3>\n<blockquote>\n<p>很小的、微乎其微的</p>\n</blockquote>\n<p>把A接回题干，它说的是：短期投资对上市公司的影响可能很小。</p>\n<p>A的 minimal 判断影响有多大，而原文的 hinder a firm’s efforts 写投资者会影响公司的努力；两边都在谈对公司的影响，所以回看 Transient investors 开始的句子，看看阻碍的程度有没有讲清。</p>\n<blockquote>\n<p>Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文的 hinder a firm’s efforts 是阻碍一家公司的努力，努力的方向包括投资长期研究以及建立客户 <strong>[xxx]</strong>。A的 minimal 则把这个影响的大小说成很小。阻碍说明方向不好，却没有单独交代阻碍到什么程度；后面的客户 <strong>[xxx]</strong> 也只让我们读到一个对象，不会自动变成程度很大。公司努力受阻与影响极小并不是同一个说法，但只靠这句，尚不能断言所有这样的阻碍都绝不可能很小。</p>\n<p><strong>原文已经说会阻碍公司的努力，仅凭“阻碍”两个字，能把影响很小完全否定吗？</strong></p>\n<p>单看这里还不能。我们能确认这是对公司努力的不利动作，却没有读到它有多严重；A缺少明确的程度说明，因此现在仍留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. indirect</h3>\n<blockquote>\n<p>间接的</p>\n</blockquote>\n<p>把B接回题干，它说的是：短期投资对上市公司的影响可能是间接的。</p>\n<p>B的 indirect 要判断影响是否通过别的对象绕一层，原文的 demand high quarterly profits 写投资者直接向公司提出要求；因此回看第3段第2句，从投资者要求利润读到公司的努力受阻。</p>\n<blockquote>\n<p>Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文先写投资者 demand high quarterly profits，要求对象就是 companies；接着仍以这些投资者作主语，直接说他们 can hinder a firm’s efforts。公司既承受季度利润要求，公司的长期投入也直接成为阻碍的对象。B的 indirect 却要把文中这条影响说成间接作用；句子没有先让投资者影响另一类人，再由那类人传给公司，而是从投资者的要求直接连到公司的经营努力。</p>\n<p><strong>原文让投资者直接要求公司交出季度利润，并阻碍公司投入，能把这条作用说成间接的吗？</strong></p>\n<p>不能。投资者面对的是公司，公司自己的长期经营努力就是被影响的对象，B改变了这里说明的作用关系。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. adverse</h3>\n<blockquote>\n<p>不利的</p>\n</blockquote>\n<p>把C接回题干，它说的是：短期投资对上市公司的影响可能是不利的。</p>\n<p>C的 adverse 表示不利，原文的 hinder 表示阻碍；阻碍公司的长期努力正是对公司不利的一种表现，所以回看第3段第2句里的投资者、公司的努力和长期研究。</p>\n<blockquote>\n<p>Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文的 hinder 把投资者放在阻碍公司努力的一方，公司本来要做的是投资长期研究或建立客户 <strong>[xxx]</strong>。C的 adverse 并没有补上这些客户内容，也没有要求我们算影响多大，只说影响是不利的。公司在推进长期投入，投资者追逐高季度利润却会让这项努力受阻，从公司努力被妨碍这个结果，就能够接上“不利”这一评价。</p>\n<p><strong>投资者会阻碍公司的长期研究等努力，能否说明这种影响可能不利？</strong></p>\n<p>能。C只概括已经写明的阻碍方向，既没有把影响说成必定很大，也没有给客户 <strong>[xxx]</strong> 补意思。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. temporary</h3>\n<blockquote>\n<p>暂时的</p>\n</blockquote>\n<p>把D接回题干，它说的是：短期投资对上市公司的影响可能只持续很短时间。</p>\n<p>D的 temporary 谈影响持续多久，原文的 Transient investors 则谈投资者停留多久；两者都带有时间意思，所以回看持股从七年变七个月的句子，并与下一句影响长期研究的内容分开。</p>\n<blockquote>\n<p>The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades.</p>\n</blockquote>\n<blockquote>\n<p>Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>原文先把七年和七个月接在 holding a stock 后面，随后 Transient investors 里的短期也修饰 investors，说明投资者持股的时间短。D的 temporary 接回题干以后却修饰 influence，变成对公司的影响持续很短。原文的影响落在长期研究等经营努力上，并没有让这项阻碍在投资者卖掉股票时就结束；把持股时间直接搬到影响持续时间上，就把两个不同的计时对象混在一起了。</p>\n<p><strong>七个月量的是持股时间，可以直接拿来证明对公司的影响只是暂时的吗？</strong></p>\n<p>不能。时间描述属于投资者持股，题干要判断的却是对公司的影响；D把前一个对象的时间属性转到了后一个对象上。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>23题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>A和C保留。C接上hinder所说的不利方向；A谈影响大小，第3段没有把程度说清。B改变投资者直接作用于公司的关系，D把投资者持股时间转成了影响持续时间。</p>\n<h2>24题</h2>\n<blockquote>\n<p>The US and France examples are used to illustrate ______.<br>美国和法国的例子，是用来说明什么的？</p>\n</blockquote>\n<p>题干点名 The US 和 France。美国的法案在第5段，法国股东的做法在第6段，因此把这两段依次从头读完，再看它们一起说明什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to <strong>[xxx]</strong> performance bonuses for senior executives by about a year, slightly helping reduce “short-termism.” In its latest survey of CEO pay, The Wall Street Journal finds that “a <strong>[xxx]</strong> part” of executive pay is now tied to performance.</p>\n<p>开始精读：</p>\n<p>In the US, / the Sarbanes-Oxley Act of 2002 / has pushed most public companies / to <strong>[xxx]</strong> performance bonuses / for senior executives / by about a year, / slightly helping reduce “short-termism.” / In its latest survey of CEO pay, / The Wall Street Journal finds / that “a <strong>[xxx]</strong> part” / of executive pay / is now tied to performance.</p>\n<p>在美国，/ 2002年的《萨班斯—奥克斯利法案》/ 已经推动大多数上市公司 / 去 <strong>[xxx]</strong> 绩效奖金 / 给高管的 / 大约一年，/ 略微帮助减少“短期主义”。/ 在它最近的首席执行官薪酬调查中，/ 《华尔街日报》发现 / “一个 <strong>[xxx]</strong> 部分”/ 高管薪酬中的 / 现在与业绩相联系。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Much more could be done to encourage “long-termism,” such as changes in the tax code and quicker <strong>[xxx]</strong> of stock <strong>[xxx]</strong>. In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n<p>开始精读：</p>\n<p>Much more could be done / to encourage “long-termism,” / such as changes in the tax code / and quicker <strong>[xxx]</strong> / of stock <strong>[xxx]</strong>. / In France, / shareholders who hold onto a company investment / for at least two years / can sometimes earn more voting rights / in a company.</p>\n<p>更多事情可以做 / 来鼓励“长期主义”，/ 比如税法中的变化 / 以及更快的 <strong>[xxx]</strong> / 股票 <strong>[xxx]</strong> 的。/ 在法国，/ 持有一项公司投资的股东 / 至少两年 / 有时能够获得更多投票权 / 在一家公司里。</p>\n</blockquote>\n<p>美国例子写高管奖金与减少短期主义，法国例子写持有投资至少两年可以多得投票权。第6段开头 Much more could be done to encourage “long-termism” 又把法国的做法放进“还可以做更多事”的话里。现在比较选项怎样解释这两个例子的共同作用。</p>\n<h3>A. the <strong>[xxx]</strong> to promoting “long-termism”</h3>\n<blockquote>\n<p>促进“长期主义”的 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把A接回题干，它说的是：美国和法国的例子是为了说明促进“长期主义”的某种 <strong>[xxx]</strong>。</p>\n<p>A的 promoting “long-termism” 与原文 encourage “long-termism” 都说促进长期主义，因此先回看第6段的开头和法国做法，再接回第5段 helping reduce “short-termism”，看美国例子是否也朝同一个方向。</p>\n<blockquote>\n<p>In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to <strong>[xxx]</strong> performance bonuses for senior executives by about a year, slightly helping reduce “short-termism.”</p>\n</blockquote>\n<blockquote>\n<p>Much more could be done to encourage “long-termism,” such as changes in the tax code and quicker <strong>[xxx]</strong> of stock <strong>[xxx]</strong>. … shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n</blockquote>\n<p>原文的 encourage “long-termism” 直接接在“更多事情可以做”后面，随后举法国持有投资较久可获得更多投票权的做法；前面的美国法案也与减少短期主义相连。A的 promoting “long-termism” 和这两段朝向一致，都是让行为放到更长时间里。不过，A最前面的 <strong>[xxx]</strong> 没读懂，完整说法究竟怎样概括这些做法，还不能把它补出来。目前已经能对上的，是美国和法国两个例子都被放在减少短期、鼓励长期的方向中。</p>\n<p><strong>A读得出的促进长期主义，能接上美国和法国这两个例子的共同方向吗？</strong></p>\n<p>能。美国例子略微帮助减少短期主义，法国例子奖励更长时间的持有；A开头虽未读清，后面这一方向可以接上。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. the prevalence of short-term thinking</h3>\n<blockquote>\n<p>短期思维的普遍流行</p>\n</blockquote>\n<p>把B接回题干，它说的是：美国和法国的例子是为了说明短期思维很普遍。</p>\n<p>B的 prevalence of short-term thinking 要看短期思维有多普遍，原文的 helping reduce “short-termism” 也提到短期主义，但它在说减少；所以回看美国法案的结果，再把法国奖励较长持有的句子放在一起。</p>\n<blockquote>\n<p>… slightly helping reduce “short-termism.”</p>\n</blockquote>\n<blockquote>\n<p>In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n</blockquote>\n<p>原文的 helping reduce “short-termism” 写美国采取措施以后减少了一些短期主义，法国则把更多投票权交给至少持有两年的股东，写的是怎样使人愿意持有更久。B的 prevalence of short-term thinking 要求这两个例子呈现短期思维普遍存在，比如人们普遍急着取利。这里美国和法国共同呈现的是朝相反方向调整行为的安排，不能把两国都在采取减少它的做法，直接读成两国的例子是在展示它如何普遍流行。</p>\n<p><strong>两国例子在写减少短期、鼓励长期的做法，能把它们的共同作用说成展示短期思维流行吗？</strong></p>\n<p>不能。采取措施的国家有两个，不等于这两段在统计短期思维的普及；句子给出的动作和结果都在把行为往长期引导。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. the significance of long-term thinking</h3>\n<blockquote>\n<p>长期思维的重要性</p>\n</blockquote>\n<p>把C接回题干，它说的是：美国和法国的例子是为了说明长期思维的重要性。</p>\n<p>C的 significance of long-term thinking 说长期思维的重要性，原文的 more voting rights 表明法国给持有较久的股东更多权利；同样，美国用法案调整奖金，因此把两国具体安排与第6段鼓励长期的开头合看。</p>\n<blockquote>\n<p>… slightly helping reduce “short-termism.”</p>\n</blockquote>\n<blockquote>\n<p>Much more could be done to encourage “long-termism,” …</p>\n</blockquote>\n<blockquote>\n<p>In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n</blockquote>\n<p>原文说的是两国作出的安排：先写用法案影响高管奖金，后写 more voting rights 给持有投资至少两年的股东，能读出两国都愿意为鼓励长期行为作安排。C的 significance of long-term thinking 是对长期思维价值的概括；政府和公司愿意作这样的安排，可以间接让人觉得他们重视长期。可是，这两段直接展开的还是具体措施，没有专门说明长期思维到底带来哪些好处。只读这两段，C虽然比“采取了哪些做法”更概括，但不能因为它没有逐字写出措施，就断言例子完全不可能说明对长期的重视。</p>\n<p><strong>两国愿意为长期行为作安排，是否也可能间接体现它们重视长期思维？</strong></p>\n<p>能。C说的重要性可以从这种安排中间接想到；但这是否就是作者把两个例子放在这里的主要作用，现在仍需要把文章前后的安排连起来。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. the obstacles to preventing “short-termism”</h3>\n<blockquote>\n<p>阻止“短期主义”的障碍</p>\n</blockquote>\n<p>把D接回题干，它说的是：美国和法国的例子是为了说明阻止短期主义会遇到的障碍。</p>\n<p>D的 obstacles to preventing “short-termism” 在问阻止短期主义遇到什么障碍，原文的 slightly helping reduce 写美国措施已经帮助减少它，方向相反；所以回看这个结果，再读法国股东取得更多投票权的做法。</p>\n<blockquote>\n<p>… slightly helping reduce “short-termism.”</p>\n</blockquote>\n<blockquote>\n<p>In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.</p>\n</blockquote>\n<p>原文的 slightly helping reduce 承认美国措施的帮助不大，但 helping reduce 仍是发挥了减少短期主义的作用。法国例子也写较长持有换来更多权利，是一种鼓励，不是使长期行为做不成的阻碍。D的 obstacles to preventing “short-termism” 却要让这两个例子展示阻止短期主义时卡在哪里。slightly 只能把帮助的程度说小，不能把帮助反转成障碍；法国的奖励也不能读成妨碍长期持有。</p>\n<p><strong>美国略有帮助、法国给长期股东奖励，能把两者都当作阻止短期主义的障碍吗？</strong></p>\n<p>不能。帮助小仍是帮助，奖励也在鼓励长期行为，D把这两个例子的作用方向反了过来。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>24题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>A和C保留。A读得出的部分能接上促进长期主义，C能从两国愿意作安排间接读到重视长期；A开头尚未读清，这两个说法现在还没有完全拉开。</p>\n<h2>25题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下面哪一个最适合作为全文标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Decisiveness Required of Top Executives</strong></p>\n<p>要求高管具备决断力</p>\n<p>B. <strong>Failure of Quarterly Capitalism</strong></p>\n<p>季度资本主义的失败</p>\n<p>C. <strong>Patience as a Corporate Virtue</strong></p>\n<p>耐心是一种企业美德</p>\n<p>D. <strong>Frustration of Risk-taking Bankers</strong></p>\n<p>冒险银行家的挫败感</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In addition, new digital technologies have allowed more rapid trading of <strong>[xxx]</strong>, quicker use of information, and thus shorter attention spans in financial markets. “There seems to be a <strong>[xxx]</strong> of short-term thinking at the expense of long-term investing,” said Commissioner Daniel Gallagher of the US Securities and Exchange Commission in a speech this week.</p>\n<p>开始精读：</p>\n<p>In addition, / new digital technologies / have allowed more rapid trading of <strong>[xxx]</strong>, / quicker use of information, / and thus shorter attention spans / in financial markets. / “There seems to be / a <strong>[xxx]</strong> of short-term thinking / at the expense of long-term investing,” / said Commissioner Daniel Gallagher / of the US Securities and Exchange Commission / in a speech this week.</p>\n<p>另外，/ 新的数字技术 / 已经允许更快地交易 <strong>[xxx]</strong>，/ 更快地使用信息，/ 从而更短的注意持续时间 / 在金融市场中。/ “似乎有 / 一个 <strong>[xxx]</strong> 属于短期思考的 / 以长期投资为代价，”/ 委员 Daniel Gallagher 说 / 美国证券交易委员会的 / 在本周一次演讲中。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Within companies, the right <strong>[xxx]</strong> design can provide <strong>[xxx]</strong> for executives to think beyond their own time at the company and on behalf of all <strong>[xxx]</strong>. Britain’s new rule is a reminder to bankers that society has an interest in their performance, not just for the short term but for the long term.</p>\n<p>开始精读：</p>\n<p>Within companies, / the right <strong>[xxx]</strong> design / can provide <strong>[xxx]</strong> / for executives to think / beyond their own time at the company / and on behalf of all <strong>[xxx]</strong>. / Britain’s new rule / is a reminder to bankers / that society has an interest / in their performance, / not just for the short term / but for the long term.</p>\n<p>在公司内部，/ 正确的 <strong>[xxx]</strong> 设计 / 可以提供 <strong>[xxx]</strong> / 让高管思考 / 超出他们自己在公司的任期 / 并代表所有 <strong>[xxx]</strong>。/ 英国的新规则 / 是给银行家的一个提醒 / 社会有一种利益关切 / 在他们的表现上，/ 不只是对于短期 / 而且对于长期。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>新规约束银行行为，也期待公司多作长期决策</td>\n<td>先摆出新做法并提出长远期待</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>点出短期逐利加重，用孩子先吃作比较</td>\n<td>再说问题正在加重并打个比方</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>持股变短，季度逐利会阻碍公司长期投入</td>\n<td>再说行为变短后会妨碍长远的事</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>数字技术加速交易，短期思考损害长期投资</td>\n<td>再说还有什么使问题加重</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>介绍美国通过高管奖金减少短期主义的尝试</td>\n<td>举一个例子说明已经怎样改善</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>提出更多鼓励长期的做法，再举法国奖励</td>\n<td>接着补充还能怎样继续改善</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>回到新规，强调公司行为关乎社会长期利益</td>\n<td>最后收回来说明大家的长远要求</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>A. Decisiveness Required of Top Executives</h3>\n<p>要求高管具备决断力</p>\n<h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是“要求高管在作决定时更加果断”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先提出要求高管果断的新规则和预期好处</td>\n<td>先摆出新做法并提出长远期待</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再说高管犹豫不决的问题正在加重</td>\n<td>再说问题正在加重并打个比方</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用决策拖延的变化说明犹豫怎样影响公司</td>\n<td>再说行为变短后会妨碍长远的事</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>再解释什么因素让高管更难果断决定</td>\n<td>再说还有什么使问题加重</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>举美国怎样训练或督促高管决断的例子</td>\n<td>举一个例子说明已经怎样改善</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>补充法国怎样帮助高管更快作决定</td>\n<td>接着补充还能怎样继续改善</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后回到规则，强调社会需要高管果断</td>\n<td>最后收回来说明大家的长远要求</td>\n</tr>\n</tbody></table>\n<p>如果中心是Decisiveness，文章需要围绕“拿不定主意—怎样果断作决定”展开。实际第2、3段批评的却是想快拿利润、持股时间缩短，并不是犹豫太久；第4段还把交易更快与注意持续时间更短连在一起，这种加快在这里使问题更重。第5、6段调整奖金和持有较久才多得权利，也是在把经营者和股东的眼光拉远。结尾要求看任期以外和社会长期利益，而不是催高管更快拍板。高管确实出现了，但文章关注决定考虑多长时间，A关注决定作得是否果断，两条主线并不相同。</p>\n<p><strong>围绕高管果断决策，能解释文章为什么批评急着取利、又奖励更久持有吗？</strong></p>\n<p>不能。中间的批评与后面的做法共同要求耐心和长期眼光；A把考虑长远换成果断作决定，解释不了这组前后安排。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>B. Failure of Quarterly Capitalism</h3>\n<p>季度资本主义的失败</p>\n<h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是“季度资本主义作为一种模式已经失败”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先宣布季度资本主义失败并提出应对</td>\n<td>先摆出新做法并提出长远期待</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再说明这种失败越来越严重</td>\n<td>再说问题正在加重并打个比方</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用公司经营变化证明该模式已无法运转</td>\n<td>再说行为变短后会妨碍长远的事</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>再补充导致这种模式失败的技术因素</td>\n<td>再说还有什么使问题加重</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>举美国已因模式失败而转向新模式的例子</td>\n<td>举一个例子说明已经怎样改善</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>继续介绍法国怎样放弃失败模式</td>\n<td>接着补充还能怎样继续改善</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后回到开头，总结季度资本主义已经失败</td>\n<td>最后收回来说明大家的长远要求</td>\n</tr>\n</tbody></table>\n<p>“quarterly capitalism”出现在第3段，确实与公司只顾季度利润的现象相关。但B把全文中心定成Failure，要求作者证明这套模式失败。文章从英国新规的长远期待写起，第2至4段解释为什么短期逐利值得担忧，第5、6段转向已经采取和还能采取的改善做法，第7段再说社会对公司长期行为的要求。它没有把美国和法国写成某种经济模式已经失败的证据，而是把它们写成鼓励长期的安排。B能覆盖中间对短期做法的批评，却把正文中很大一部分“可以怎样改”压成了失败的例证。</p>\n<p><strong>把全文写成季度资本主义的失败，能说明后半篇为何反复介绍鼓励长期的办法吗？</strong></p>\n<p>不能。后半篇在推动长期思维，结尾也回到长期利益；B抓住了问题现象，却把作者要倡导的方向变成对一个模式已经失败的判断。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>C. Patience as a Corporate Virtue</h3>\n<p>耐心是一种企业美德</p>\n<h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是“公司应当具有耐心，把眼光放到更长远的利益上”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先提出一种促使公司有耐心的新做法和长远期待</td>\n<td>先摆出新做法并提出长远期待</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再说缺乏耐心、急着取得眼前利益的问题加重</td>\n<td>再说问题正在加重并打个比方</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用行为变短说明缺乏耐心怎样影响长期投入</td>\n<td>再说行为变短后会妨碍长远的事</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>再补充让短期取向加重的因素</td>\n<td>再说还有什么使问题加重</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>举美国如何鼓励耐心和长期行为的例子</td>\n<td>举一个例子说明已经怎样改善</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>继续介绍还能怎样做，并举法国的安排</td>\n<td>接着补充还能怎样继续改善</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后回到新规，强调公司应顾及大家的长远利益</td>\n<td>最后收回来说明大家的长远要求</td>\n</tr>\n</tbody></table>\n<p>Patience不是让公司什么都不做，而是在公司的决定中愿意等待并顾及长远。第1段希望更多long-term decision-making，第2段把急着得利比作孩子马上吃，第3、4段说明这种急迫怎样影响长期投入；这几步把为什么需要耐心说清。第5、6段接着写奖金、较久持有与更多权利，把“如何鼓励长期行为”接上来。最后社会关注的不只是短期表现，还有长期表现，正好回到耐心为什么是公司应有的品质。Corporate也覆盖银行、公司高管和股东这些对象，没有把全文只缩到一类银行家。</p>\n<p><strong>把耐心看作企业应有的品质，能否把新规、短期逐利、改善办法和长期利益连在一起？</strong></p>\n<p>能。前面写缺乏耐心造成的问题，后面写怎样鼓励长期行为，结尾说明社会的长远要求；C能解释文章这几步为什么这样排列。</p>\n<p><strong>判断：C保留。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>D. Frustration of Risk-taking Bankers</h3>\n<p>冒险银行家的挫败感</p>\n<h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是“冒险的银行家遭遇挫折后的感受”。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先写冒险银行家遇到新规后的挫折</td>\n<td>先摆出新做法并提出长远期待</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>再说他们的挫败感越来越强并作比喻</td>\n<td>再说问题正在加重并打个比方</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用投资变化说明银行家的失落怎样发展</td>\n<td>再说行为变短后会妨碍长远的事</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>再解释技术怎样使这些银行家更受挫</td>\n<td>再说还有什么使问题加重</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>举美国银行家经历挫折的具体事件</td>\n<td>举一个例子说明已经怎样改善</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>继续写法国银行家相似的情绪经历</td>\n<td>接着补充还能怎样继续改善</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后回到银行家本人，归结他们的挫败感</td>\n<td>最后收回来说明大家的长远要求</td>\n</tr>\n</tbody></table>\n<p>第1段有bankers和harmful risk-taking，新规还可能延后高管奖金，D因此看起来碰到了开头的一些词。可Frustration要求文章以银行家的受挫感受为中心，实际后面写的是上市公司、投资者、数字交易以及政策安排，没有继续描写银行家失望、不满或受挫的心理。第6段的法国例子甚至以股东持有时间和投票权为内容，第7段讨论的是社会对银行家长期表现的利益关切。D不但把公司范围缩成冒险银行家，也把行为规则和长期后果改成他们自己的情绪。</p>\n<p><strong>银行家受挫的情绪，能解释公司持股时间、法国股东权利和社会长期利益这些安排吗？</strong></p>\n<p>不能。这些段落都服务于公司怎样顾及长远，D只能碰到开头的银行家和风险两个对象，无法接住中间展开及结尾。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<h3>25题结论</h3>\n<p><strong>25. C. Patience as a Corporate Virtue</strong></p>\n<p>全文由鼓励长期决策的新规进入，说明急着取得眼前利润的问题，再提出可以鼓励长期行为的做法，最后回到社会的长远利益。C把这些步骤收在公司应有耐心这一条线上。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Patience as a Corporate Virtue / 耐心是一种企业美德</strong></p>\n<hr>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查23题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. minimal</li>\n<li>C. adverse</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Patience as a Corporate Virtue</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>耐心是一种企业美德</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>题干问短期投资对上市公司的影响。A说的是影响可能很小；C说的是影响可能不利。第一遍读第3段，我们已经看到hinder，知道公司的长期研究等努力会受到阻碍。C能接上这个动作。A没有被排掉，是因为这句话没有交代阻碍的大小，不能把“会阻碍”直接放大成“影响一定很严重”；七年变七个月量的也只是持股时间。</p>\n<p>现在拿主旨来检查。</p>\n<p>“耐心是一种企业美德”让我们看清，第3段为什么出现在这里：第2段刚说急着获利的情况加重，第3段接着解释这种短期取向会给公司带来什么问题，后面才有鼓励长期行为的措施。C的“不利”能把第3段放进这个位置：季度利润要求阻碍长期努力，所以公司需要把目光放远。它同时接住了hinder和全文要改善这种短期取向的方向。</p>\n<p>A的“很小”在第一遍只是程度没有说清时留下的可能性。把它代入全文，第3段就会变成对短期投资影响的淡化；但文章并没有用这一段表示不必在意，接着还写短期思考以长期投资为代价，再讨论如何鼓励长期行为。全文新增的这些安排支持作者强调影响的不利方向，却没有给“很小”增加程度方面的说明。</p>\n<p>回到原句，作者直接交代的仍是投资者会hinder公司的努力，既没有计算损害多大，也没有说影响可以忽略。因此最终选择C，回答文中真正说出的不利评价；这不等于把C扩大成“影响必定很大”，也不需要补出客户后面的 <strong>[xxx]</strong>。</p>\n<blockquote>\n<p><strong>23题选C。</strong></p>\n</blockquote>\n<hr>\n<h2>回查24题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. the <strong>[xxx]</strong> to promoting “long-termism”</li>\n<li>C. the significance of long-term thinking</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Patience as a Corporate Virtue</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>耐心是一种企业美德</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>题干问美国和法国两个例子在文中用来说明什么。A是the <strong>[xxx]</strong> to promoting “long-termism”，其中促进长期主义能读懂，前面的名词仍然没有读懂，整项关系也就没有读全；C说的是长期思维的重要性。第一遍，美国的法案略微帮助减少短期主义，法国给持有投资至少两年的股东更多投票权。这些安排使A读得出的部分有了对应，也让C的“重视长期”显得有可能，所以当时留下了两项。</p>\n<p>现在拿主旨来检查。</p>\n<p>主旨把全文组织成公司应当有耐心、顾及长远。沿着全文顺序看，第2至4段已经把为什么急着取利会出问题展开了：持股时间变短、长期研究受阻、短期思考以长期投资为代价。到美国和法国时，文章开始回答这种取向可以怎样改变。第6段的Much more could be done接着美国已有的安排，说还可以多做哪些事，随后才出现法国股东的例子。</p>\n<p>C说的重要性可以概括全文对长期思维的重视，却把这两个例子在这里承担的作用说得过宽。若这里仍主要在说明“长期很重要”，前面关于长期努力受阻的内容和这里的奖金、持有两年、更多投票权就没有分开。实际推进是前面解释问题，这里介绍可以采取的具体安排；C只说重要性，没有接住从问题转向行动的这一步。</p>\n<p>再看A，promoting long-termism至少与这两段想促成的行为改变相接；但the <strong>[xxx]</strong> 的名词到底是什么，仍然不能说已经明白，也不能把整项直接翻译成“具体做法”。回到第一遍读过的helping reduce、could be done和earn more voting rights，原文对两国例子的安排是清楚的。C把这个用途概括得过宽以后，在留下的两个候选中，A有更多依据作为本题的作答。选择A，同时把没有读懂的首词仍保留为 <strong>[xxx]</strong>。</p>\n<blockquote>\n<p><strong>24题选A。</strong></p>\n</blockquote>\n<hr>\n<h2>最终答案：</h2>\n<p><strong>21. B</strong></p>\n<p><strong>22. D</strong></p>\n<p><strong>23. C</strong></p>\n<p><strong>24. A</strong></p>\n<p><strong>25. C</strong></p>\n","analysisSta
