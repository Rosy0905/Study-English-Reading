误。\u003c/strong>\u003c/p>\n\u003ch3>36题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>36. C. make more online shoppers pay sales tax\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：dilemma表示两难境地。\u003c/p>\n\u003cp>B：原文 pay sales tax 的执行者是 more people，各州得到的是强制更多人缴税的能力。\u003c/p>\n\u003cp>C：原文 more people 不是随便一种人，后面的网上购物条件把他们限定成购物者。\u003c/p>\n\u003cp>D：原文 financial win for states 指各州在钱上获益，同一句把另一端写成购物者的钱包变轻。\u003c/p>\n\u003ch2>37题\u003c/h2>\n\u003cblockquote>\n\u003cp>It can be learned from Paragraphs 2 and 3 that the overruled decisions ______.\u003cbr>从第2、3段可以知道，被推翻的那些决定有什么情况？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>旧裁决信息题。题干要求判断“从第2、3段可以知道，被推翻的那些决定有什么情况？”，先按第2、3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The Supreme Court&#39;s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually. The decisions made it more difficult for states to collect sales tax on certain online purchases.\u003c/p>\n\u003cp>The cases the court overturned said that if a business was shipping a customer&#39;s purchase to a state where the business didn&#39;t have a physical presence such as a warehouse or office, the business didn&#39;t have to collect sales tax for the state. Customers were generally responsible for paying the sales tax to the state themselves if they weren&#39;t charged it, but most didn&#39;t realize they owed it and few paid.\u003c/p>\n\u003c/blockquote>\n\u003cp>各州表示旧决定令它们每年损失数十亿美元；无当地实体的商家不必代收，而顾客虽有缴税责任却很少实际缴纳。\u003c/p>\n\u003ch3>A. were widely criticized by online purchasers\u003c/h3>\n\u003cblockquote>\n\u003cp>受到网上购物者的广泛批评\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A 的 online purchasers 对应第3段的 Customers，都是购买东西的人；但 criticized 还要求他们表达批评，所以回看第3段末句写顾客知道什么、实际做什么。再看第2段 states said，分清提出损失的是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文把 Customers 写成大多不知道自己欠税、也很少缴税的人。第2段 states said 的发言者则是各州，它们说旧决定使自己损失了钱。A 把 online purchasers 放到 criticized 的位置上，让顾客成为广泛表达不满的一方。顾客不知道欠税与州知道自己少收了钱，是两个主体的两种情况；不能把各州的抱怨搬到顾客身上。\u003c/p>\n\u003cp>顾客这一端写的是不知欠税、很少付款，提出损失的是州。A 将说话的人换成了网上购买者。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Customers were generally responsible for paying the sales tax to the state themselves if they weren&#39;t charged it, but most didn&#39;t realize they owed it and few paid.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2、3段表明，被推翻的旧裁决受到网上购物者的广泛批评。\u003c/p>\n\u003c/blockquote>\n\u003cp>A 的 online purchasers 对应第3段的 Customers，都是购买东西的人；但 criticized 还要求他们表达批评，所以回看第3段末句写顾客知道什么、实际做什么。再看第2段 states said，分清提出损失的是谁。\u003c/p>\n\u003cp>原文把 Customers 写成大多不知道自己欠税、也很少缴税的人。第2段 states said 的发言者则是各州，它们说旧决定使自己损失了钱。A 把 online purchasers 放到 criticized 的位置上，让顾客成为广泛表达不满的一方。顾客不知道欠税与州知道自己少收了钱，是两个主体的两种情况；不能把各州的抱怨搬到顾客身上。\u003c/p>\n\u003cp>顾客这一端写的是不知欠税、很少付款，提出损失的是州。A 将说话的人换成了网上购买者。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Customers were generally responsible for paying the sales tax to the state themselves if they weren&#39;t charged it, but most didn&#39;t realize they owed it and few paid.\u003c/p>\n\u003cp>各州表示旧决定令它们每年损失数十亿美元；无当地实体的商家不必代收，而顾客虽有缴税责任却很少实际缴纳。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Online shoppers widely criticized the old decisions.\u003c/p>\n\u003cp>网上购物者广泛批评旧裁决。\u003c/p>\n\u003c/blockquote>\n\u003cp>如果有这种舆论，作者应交代购物者的评价。原文作出损失判断的是states，顾客方面写不知道欠税与少有人缴税，不是广泛批评。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文从旧制度解释新裁决，旧规则的相关问题是州财政损失和征收困难；顾客是否批评、电子商务是否占据主导，需要另外的事实。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>were widely criticized by online purchasers\u003cbr>受到网上购物者的广泛批评\u003c/p>\n\u003c/blockquote>\n\u003cp>顾客这一端写的是不知欠税、很少付款，提出损失的是州。A 将说话的人换成了网上购买者。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. have cost consumers a lot over the years\u003c/h3>\n\u003cblockquote>\n\u003cp>这些年来让消费者付出了很多钱\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B 的 cost consumers 要找损失落在谁身上，正好对应第2段 states said cost them；第3段 few paid 又写顾客实际上很少缴税，因此要把两处放在一起，分清州的损失和消费者的付款。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>states said cost them 中 them 接的是 states，损失数十亿美元的是各州。B 的 cost consumers 把承受损失的人改成消费者。第3段又说 few paid，即真正缴税的顾客很少，这与让消费者付出很多钱的说法也不同。不能只看到 cost 和 billions of dollars 就留下 B；把损失归给谁，才是这一句的要点。\u003c/p>\n\u003cp>损失属于州，顾客一端反而是很少缴税。B 保留了损失很大的说法，却换掉了承受损失的主体。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The Supreme Court&#39;s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually. The decisions made it more difficult for states to collect sales tax on certain online purchases.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2、3段表明，被推翻的旧裁决这些年来让消费者付出了很多钱。\u003c/p>\n\u003c/blockquote>\n\u003cp>B 的 cost consumers 要找损失落在谁身上，正好对应第2段 states said cost them；第3段 few paid 又写顾客实际上很少缴税，因此要把两处放在一起，分清州的损失和消费者的付款。\u003c/p>\n\u003cp>states said cost them 中 them 接的是 states，损失数十亿美元的是各州。B 的 cost consumers 把承受损失的人改成消费者。第3段又说 few paid，即真正缴税的顾客很少，这与让消费者付出很多钱的说法也不同。不能只看到 cost 和 billions of dollars 就留下 B；把损失归给谁，才是这一句的要点。\u003c/p>\n\u003cp>损失属于州，顾客一端反而是很少缴税。B 保留了损失很大的说法，却换掉了承受损失的主体。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The Supreme Court&#39;s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually. The decisions made it more difficult for states to collect sales tax on certain online purchases.\u003c/p>\n\u003cp>各州表示旧决定令它们每年损失数十亿美元；无当地实体的商家不必代收，而顾客虽有缴税责任却很少实际缴纳。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The old decisions have cost consumers large sums of money over the years.\u003c/p>\n\u003cp>旧裁决这些年来让消费者付出了大量金钱。\u003c/p>\n\u003c/blockquote>\n\u003cp>数十亿美元损失明确属于各州的lost revenue。顾客多未缴纳税款，假设把财政收入的受损者换成消费者，混淆了少收钱与多付钱。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文从旧制度解释新裁决，旧规则的相关问题是州财政损失和征收困难；顾客是否批评、电子商务是否占据主导，需要另外的事实。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>have cost consumers a lot over the years\u003cbr>这些年来让消费者付出了很多钱\u003c/p>\n\u003c/blockquote>\n\u003cp>损失属于州，顾客一端反而是很少缴税。B 保留了损失很大的说法，却换掉了承受损失的主体。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. have led to the dominance of e-commerce\u003c/h3>\n\u003cblockquote>\n\u003cp>导致电子商务占据主导地位\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“have led to the [xxx] of e-commerce”，保留了相应遮挡。当时的定位线索是：C 的 e-commerce 是电子商务，对应第2段 certain online purchases 中的网上交易；要看旧决定怎样影响这类交易，就回看第2段最后一句以及第3段企业可以不代收税的规定。读完全文后，做题模式再经交叉验证排除C，最终选择D。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>dominance指主导地位。旧规则确实让某些没有当地实体的商家不必代收销售税，可能形成价格条件上的不同，但第2、3段讲的是税收义务与州收入损失，没有给出电子商务市场份额。\u003c/p>\n\u003cp>C从一种税收安排进一步推出该安排造成整个电子商务主导市场，增加结果与因果两个环节。征收困难可以解释各州为何认为旧规则不利，却不能单独证明电子商务已取得dominance。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The decisions made it more difficult for states to collect sales tax on certain online purchases.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2、3段表明，被推翻的旧裁决导致电子商务占据主导地位。\u003c/p>\n\u003c/blockquote>\n\u003cp>C 的 e-commerce 是电子商务，对应第2段 certain online purchases 中的网上交易；要看旧决定怎样影响这类交易，就回看第2段最后一句以及第3段企业可以不代收税的规定。\u003c/p>\n\u003cp>dominance指主导地位。旧规则确实让某些没有当地实体的商家不必代收销售税，可能形成价格条件上的不同，但第2、3段讲的是税收义务与州收入损失，没有给出电子商务市场份额。\u003c/p>\n\u003cp>C从一种税收安排进一步推出该安排造成整个电子商务主导市场，增加结果与因果两个环节。征收困难可以解释各州为何认为旧规则不利，却不能单独证明电子商务已取得dominance。\u003c/p>\n\u003cp>各州表示旧决定令它们每年损失数十亿美元；无当地实体的商家不必代收，而顾客虽有缴税责任却很少实际缴纳。\u003c/p>\n\u003cp>这需要电子商务市场份额及其变化，还需要旧决定与主导地位的因果证据。免于代收可能提供成本优势，但不能据此补成已经占据主导。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The decisions made it more difficult for states to collect sales tax on certain online purchases.\u003c/p>\n\u003cp>各州表示旧决定令它们每年损失数十亿美元；无当地实体的商家不必代收，而顾客虽有缴税责任却很少实际缴纳。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The old decisions caused e-commerce to dominate the market.\u003c/p>\n\u003cp>旧裁决导致电子商务主导市场。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要电子商务市场份额及其变化，还需要旧决定与主导地位的因果证据。免于代收可能提供成本优势，但不能据此补成已经占据主导。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文从旧制度解释新裁决，旧规则的相关问题是州财政损失和征收困难；顾客是否批评、电子商务是否占据主导，需要另外的事实。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>have led to the dominance of e-commerce\u003cbr>导致电子商务占据主导地位\u003c/p>\n\u003c/blockquote>\n\u003cp>C从一种税收安排进一步推出该安排造成整个电子商务主导市场，增加结果与因果两个环节。征收困难可以解释各州为何认为旧规则不利，却不能单独证明电子商务已取得dominance。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. were considered unfavorable by states\u003c/h3>\n\u003cblockquote>\n\u003cp>被各州认为是不利的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D 的 unfavorable by states 要看各州怎样看待旧决定，对应第2段 more difficult for states：州自己说损失了钱，随后又交代它们征税更困难，所以回看这两句给出的具体后果。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文 more difficult for states 把征税困难落在各州身上，各州又明确说自己因此损失数十亿美元。D 的 unfavorable by states 仍然以各州为评价主体，没有声称法院或顾客反对，而是说各州认为不利。这里虽然没有原样出现 unfavorable，但州说自己损失钱、事情更难办，两处都说明旧决定没有给州带来好处。\u003c/p>\n\u003cp>D 评价的主体仍是各州，不利的依据就是它们自己提出的金钱损失与征税困难，不需要把顾客或企业的态度搬过来。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The decisions made it more difficult for states to collect sales tax on certain online purchases.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2、3段表明，被推翻的旧裁决被各州认为是不利的。\u003c/p>\n\u003c/blockquote>\n\u003cp>D 的 unfavorable by states 要看各州怎样看待旧决定，对应第2段 more difficult for states：州自己说损失了钱，随后又交代它们征税更困难，所以回看这两句给出的具体后果。\u003c/p>\n\u003cp>原文 more difficult for states 把征税困难落在各州身上，各州又明确说自己因此损失数十亿美元。D 的 unfavorable by states 仍然以各州为评价主体，没有声称法院或顾客反对，而是说各州认为不利。这里虽然没有原样出现 unfavorable，但州说自己损失钱、事情更难办，两处都说明旧决定没有给州带来好处。\u003c/p>\n\u003cp>D 评价的主体仍是各州，不利的依据就是它们自己提出的金钱损失与征税困难，不需要把顾客或企业的态度搬过来。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The decisions made it more difficult for states to collect sales tax on certain online purchases.\u003c/p>\n\u003cp>各州表示旧决定令它们每年损失数十亿美元；无当地实体的商家不必代收，而顾客虽有缴税责任却很少实际缴纳。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>States regarded the old decisions as harmful to their revenues.\u003c/p>\n\u003cp>各州认为旧裁决损害了它们的收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>states said直接给出评价者，lost revenue给出不利的内容，征收困难与很少自行缴纳进一步解释损失从何而来。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文从旧制度解释新裁决，旧规则的相关问题是州财政损失和征收困难；顾客是否批评、电子商务是否占据主导，需要另外的事实。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>were considered unfavorable by states\u003cbr>被各州认为是不利的\u003c/p>\n\u003c/blockquote>\n\u003cp>D 评价的主体仍是各州，不利的依据就是它们自己提出的金钱损失与征税困难，不需要把顾客或企业的态度搬过来。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>37题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>37. D. were considered unfavorable by states\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文把 Customers 写成大多不知道自己欠税、也很少缴税的人。\u003c/p>\n\u003cp>B：states said cost them 中 them 接的是 states，损失数十亿美元的是各州。\u003c/p>\n\u003cp>C：dominance指主导地位。\u003c/p>\n\u003cp>D：原文 more difficult for states 把征税困难落在各州身上，各州又明确说自己因此损失数十亿美元。\u003c/p>\n\u003ch2>38题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Justice Anthony Kennedy, the physical presence rule has ______.\u003cbr>根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点题。题干要求判断“根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed. &quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices. Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>肯尼迪列出脱离经济现实、州收入损失，随后用prevented market participants from competing on an even playing field指出公平竞争受损。\u003c/p>\n\u003ch3>A. hindered economic development\u003c/h3>\n\u003cblockquote>\n\u003cp>阻碍了经济发展\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“[xxx] economic development”，保留了相应遮挡。当时的定位线索是：A 的 economic development 谈经济发展，原文 economic reality 谈经济现实，都在说经济方面的情况；要判断规则与经济发展究竟是什么关系，还要一起回看他随后说各州长期目标受限制的句子。读完全文后，做题模式再经交叉验证排除A，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>hindered是阻碍，economic development指经济发展。原文的economic reality说规则越来越脱离经济现实，不是在说经济发展本身；这两个带economic的表达不能直接互换。\u003c/p>\n\u003cp>相比之下，B对应prevented market participants from competing on an even playing field，主体是市场参与者，受损的是公平竞争条件，几乎逐项落在原话上。本题优先选择保留这些明确关系的B，不用一层更宽的推论取代直接改写。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed.\u003c/p>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.\u003c/p>\n\u003cp>Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>肯尼迪认为，实体存在规则已经阻碍了经济发展。\u003c/p>\n\u003c/blockquote>\n\u003cp>A 的 economic development 谈经济发展，原文 economic reality 谈经济现实，都在说经济方面的情况；要判断规则与经济发展究竟是什么关系，还要一起回看他随后说各州长期目标受限制的句子。\u003c/p>\n\u003cp>hindered是阻碍，economic development指经济发展。原文的economic reality说规则越来越脱离经济现实，不是在说经济发展本身；这两个带economic的表达不能直接互换。\u003c/p>\n\u003cp>后面的limited states’ ability to seek long-term prosperity确实涉及经济上的不利，所以不能简单说原文完全没有经济影响。但它保留各州、能力、寻求长期繁荣这些限制，A把它扩成经济发展已被阻碍的一般结果。\u003c/p>\n\u003cp>相比之下，B对应prevented market participants from competing on an even playing field，主体是市场参与者，受损的是公平竞争条件，几乎逐项落在原话上。本题优先选择保留这些明确关系的B，不用一层更宽的推论取代直接改写。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed.\u003c/p>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.\u003c/p>\n\u003cp>Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003cp>肯尼迪列出脱离经济现实、州收入损失，随后用prevented market participants from competing on an even playing field指出公平竞争受损。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The physical presence rule has hindered economic development generally.\u003c/p>\n\u003cp>实体存在规则总体上已经阻碍经济发展。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的economic reality说规则脱离现实；long-term prosperity受limited states’ ability to seek限制。假设把各州追求长期繁荣的能力扩成整体经济发展已经受阻，比直接点明的竞争受损更宽。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文介绍改变旧规则的理由，本题须落到肯尼迪明确说出的后果；公平竞争由even playing field直接支持，不能把寻求繁荣的能力限制扩成所有经济发展的既成结果。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>hindered economic development\u003cbr>阻碍了经济发展\u003c/p>\n\u003c/blockquote>\n\u003cp>相比之下，B对应prevented market participants from competing on an even playing field，主体是市场参与者，受损的是公平竞争条件，几乎逐项落在原话上。本题优先选择保留这些明确关系的B，不用一层更宽的推论取代直接改写。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. harmed fair market competition\u003c/h3>\n\u003cblockquote>\n\u003cp>损害了公平的市场竞争\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B 的 fair market competition 对应原文 competing on an even playing field，两边都说在公平条件下竞争；再看这件事前面接的是怎样的动作，所以回到第4段的最后一句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文 competing on an even playing field 把竞争条件比作平整、公平的比赛场地，前面 has prevented 表示这件事被阻止了。B 的 fair market competition 正在说这种公平竞争，harmed 表示它受到损害。\u003c/p>\n\u003cp>原文的 prevented 与 B 的 harmed 都让公平竞争受到不利影响；这里比较的是竞争能否公平进行，不是市场中具体哪个名词的译法。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed.\u003c/p>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.\u003c/p>\n\u003cp>Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>肯尼迪认为，实体存在规则已经损害了公平的市场竞争。\u003c/p>\n\u003c/blockquote>\n\u003cp>B 的 fair market competition 对应原文 competing on an even playing field，两边都说在公平条件下竞争；再看这件事前面接的是怎样的动作，所以回到第4段的最后一句。\u003c/p>\n\u003cp>原文 competing on an even playing field 把竞争条件比作平整、公平的比赛场地，前面 has prevented 表示这件事被阻止了。B 的 fair market competition 正在说这种公平竞争，harmed 表示它受到损害。\u003c/p>\n\u003cp>原文的 prevented 与 B 的 harmed 都让公平竞争受到不利影响；这里比较的是竞争能否公平进行，不是市场中具体哪个名词的译法。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed.\u003c/p>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.\u003c/p>\n\u003cp>Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003cp>肯尼迪列出脱离经济现实、州收入损失，随后用prevented market participants from competing on an even playing field指出公平竞争受损。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The rule has prevented businesses from competing on equal terms.\u003c/p>\n\u003cp>这条规则妨碍企业在平等条件下竞争。\u003c/p>\n\u003c/blockquote>\n\u003cp>on equal terms准确解释an even playing field。实际论证从实体存在决定代收义务，推到市场参与者条件不平等，正好支持harmed fair market competition。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文介绍改变旧规则的理由，本题须落到肯尼迪明确说出的后果；公平竞争由even playing field直接支持，不能把寻求繁荣的能力限制扩成所有经济发展的既成结果。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>harmed fair market competition\u003cbr>损害了公平的市场竞争\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的 prevented 与 B 的 harmed 都让公平竞争受到不利影响；这里比较的是竞争能否公平进行，不是市场中具体哪个名词的译法。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. boosted growth in states’ revenue\u003c/h3>\n\u003cblockquote>\n\u003cp>促进了各州收入增长\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C 的 growth in states’ revenue 与原文 revenue losses to the states 都直接谈各州收入，同一个对象一边说增长、一边说损失，所以回看肯尼迪引语中 results in 后面的结果。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文 revenue losses to the states 把结果写成州的收入损失。C 的 growth in states’ revenue 说州收入增长，而且 boosted 又写规则在推动这种增长。两边说的是同一笔收入，变化的方向却相反。\u003c/p>\n\u003cp>losses 已经把结果写成收入损失，C 却说规则促进收入增长；修饰损失的那个词不会把这两个方向变成同一个意思。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>肯尼迪认为，实体存在规则已经促进了各州收入增长。\u003c/p>\n\u003c/blockquote>\n\u003cp>C 的 growth in states’ revenue 与原文 revenue losses to the states 都直接谈各州收入，同一个对象一边说增长、一边说损失，所以回看肯尼迪引语中 results in 后面的结果。\u003c/p>\n\u003cp>原文 revenue losses to the states 把结果写成州的收入损失。C 的 growth in states’ revenue 说州收入增长，而且 boosted 又写规则在推动这种增长。两边说的是同一笔收入，变化的方向却相反。\u003c/p>\n\u003cp>losses 已经把结果写成收入损失，C 却说规则促进收入增长；修饰损失的那个词不会把这两个方向变成同一个意思。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.\u003c/p>\n\u003cp>肯尼迪列出脱离经济现实、州收入损失，随后用prevented market participants from competing on an even playing field指出公平竞争受损。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The rule has increased the states’ revenues.\u003c/p>\n\u003cp>这条规则增加了各州收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>若是增加收入，应接revenue gains。实际写significant revenue losses，主体同为各州，金额方向从损失改成了增长。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文介绍改变旧规则的理由，本题须落到肯尼迪明确说出的后果；公平竞争由even playing field直接支持，不能把寻求繁荣的能力限制扩成所有经济发展的既成结果。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>boosted growth in states’ revenue\u003cbr>促进了各州收入增长\u003c/p>\n\u003c/blockquote>\n\u003cp>losses 已经把结果写成收入损失，C 却说规则促进收入增长；修饰损失的那个词不会把这两个方向变成同一个意思。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. brought prosperity to the country\u003c/h3>\n\u003cblockquote>\n\u003cp>给国家带来繁荣\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D 的 prosperity to the country 把经济结果落在全国繁荣，原文 revenue losses to the states 则落在各州收入；两边都涉及经济影响，因此回看收入结果，并连着看肯尼迪接下来对公平竞争的评价。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文 revenue losses to the states 是州收入受损，末句又说公平竞争受到阻止，肯尼迪列出的都是这条规则带来的问题。D 的 prosperity to the country 却将结果写成全国繁荣，不仅把各州的具体收入结果扩到整个国家，还把肯尼迪的负面评价改成正面成就。economic reality 虽然提到经济，但它前面的 further removed 也不是在赞扬规则顺应现实。\u003c/p>\n\u003cp>他谈的是这条规则离现实越来越远、给州和竞争造成问题；D 却把这些结果改写成一项全国性的好处，评价方向正好转了过去。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed.\u003c/p>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.\u003c/p>\n\u003cp>Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>肯尼迪认为，实体存在规则已经给国家带来繁荣。\u003c/p>\n\u003c/blockquote>\n\u003cp>D 的 prosperity to the country 把经济结果落在全国繁荣，原文 revenue losses to the states 则落在各州收入；两边都涉及经济影响，因此回看收入结果，并连着看肯尼迪接下来对公平竞争的评价。\u003c/p>\n\u003cp>原文 revenue losses to the states 是州收入受损，末句又说公平竞争受到阻止，肯尼迪列出的都是这条规则带来的问题。D 的 prosperity to the country 却将结果写成全国繁荣，不仅把各州的具体收入结果扩到整个国家，还把肯尼迪的负面评价改成正面成就。economic reality 虽然提到经济，但它前面的 further removed 也不是在赞扬规则顺应现实。\u003c/p>\n\u003cp>他谈的是这条规则离现实越来越远、给州和竞争造成问题；D 却把这些结果改写成一项全国性的好处，评价方向正好转了过去。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed.\u003c/p>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.\u003c/p>\n\u003cp>Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003cp>肯尼迪列出脱离经济现实、州收入损失，随后用prevented market participants from competing on an even playing field指出公平竞争受损。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The rule has brought prosperity to the country.\u003c/p>\n\u003cp>这条规则给国家带来了繁荣。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文说限制各州寻求长期繁荣的能力。假设不仅把限制换成带来，还把州的目标换成全国已经取得的结果，改变了方向、范围和实现状态。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文介绍改变旧规则的理由，本题须落到肯尼迪明确说出的后果；公平竞争由even playing field直接支持，不能把寻求繁荣的能力限制扩成所有经济发展的既成结果。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>brought prosperity to the country\u003cbr>给国家带来繁荣\u003c/p>\n\u003c/blockquote>\n\u003cp>他谈的是这条规则离现实越来越远、给州和竞争造成问题；D 却把这些结果改写成一项全国性的好处，评价方向正好转了过去。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>38题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>38. B. harmed fair market competition\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：hindered是阻碍，economic development指经济发展。\u003c/p>\n\u003cp>B：原文 competing on an even playing field 把竞争条件比作平整、公平的比赛场地，前面 has prevented 表示这件事被阻止了。\u003c/p>\n\u003cp>C：原文 revenue losses to the states 把结果写成州的收入损失。\u003c/p>\n\u003cp>D：原文 revenue losses to the states 是州收入受损，末句又说公平竞争受到阻止，肯尼迪列出的都是这条规则带来的问题。\u003c/p>\n\u003ch2>39题\u003c/h2>\n\u003cblockquote>\n\u003cp>Who are most likely to welcome the Supreme Court ruling?\u003cbr>谁最有可能欢迎最高法院的这项裁决？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>受益者推断题。题干要求判断“谁最有可能欢迎最高法院的这项裁决？”，先按第5、6、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, rivals will be charging sales tax where they hadn&#39;t before. Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#39;t have to.\u003c/p>\n\u003cp>Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states. Sellers that use eBay and Etsy, which provide platforms for smaller sellers, also haven&#39;t been collecting sales tax nationwide. Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state&#39;s sales tax from customers and send it to the state.\u003c/p>\n\u003cp>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses. The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches complying with various state sales tax laws. The Small Business &amp; Entrepreneurship Council advocacy group said in a statement, &quot;Small businesses and internet entrepreneurs are not well served at all by this decision.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>大型连锁企业此前通常已经代收，新规会让竞争者也代收；其他线上卖家要承担新义务，小企业还担忧遵从各州法律的负担。\u003c/p>\n\u003ch3>A. Big-chain owners.\u003c/h3>\n\u003cblockquote>\n\u003cp>大型连锁企业的所有者。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A 的 Big-chain owners 是大型连锁企业的所有者。粗读后面时看到过大型连锁企业和一场胜利，回到第5段的 big chains，两者指向同一类企业，所以先把第5段从头到尾读完，再看胜利的原因。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>现在回到 A，企业的一场胜利与其所有者是否最可能欢迎，直接看第5段首句给出的结果和原因。\u003c/p>\n\u003cp>A 的人和原文受益的企业是一一对应的，胜利已经给出了正面结果。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already.\u003c/p>\n\u003cp>Now, rivals will be charging sales tax where they hadn&#39;t before.\u003c/p>\n\u003cp>Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#39;t have to.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最可能欢迎新裁决的是大型连锁企业的所有者。\u003c/p>\n\u003c/blockquote>\n\u003cp>A 的 Big-chain owners 是大型连锁企业的所有者。粗读后面时看到过大型连锁企业和一场胜利，回到第5段的 big chains，两者指向同一类企业，所以先把第5段从头到尾读完，再看胜利的原因。\u003c/p>\n\u003cp>现在回到 A，企业的一场胜利与其所有者是否最可能欢迎，直接看第5段首句给出的结果和原因。\u003c/p>\n\u003cp>原文 a victory for big chains 直接把大型连锁企业放在受益一边，原因是它们通常已经在网上交易中收销售税。A 的 Big-chain owners 指的正是拥有这些企业的人，并没有把行业换成另一种商家。题干问 most likely，不是要求所有者必须在原文里亲口说欢迎；企业得到一场胜利，就能给其所有者最可能欢迎提供直接依据。\u003c/p>\n\u003cp>A 的人和原文受益的企业是一一对应的，胜利已经给出了正面结果。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already.\u003c/p>\n\u003cp>Now, rivals will be charging sales tax where they hadn&#39;t before.\u003c/p>\n\u003cp>Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#39;t have to.\u003c/p>\n\u003cp>大型连锁企业此前通常已经代收，新规会让竞争者也代收；其他线上卖家要承担新义务，小企业还担忧遵从各州法律的负担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Big-chain owners benefit when their competitors must collect taxes they already collect.\u003c/p>\n\u003cp>竞争者也必须代收大连锁早已代收的税时，大连锁所有者从中受益。\u003c/p>\n\u003c/blockquote>\n\u003cp>第5段先明说victory，再解释rivals新增义务。欢迎是由既有负担被拉平作出的局部推断，没有让所有零售商成为同一利益群体。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>讨论后果必须区分受益者和受损者；最可能欢迎的是竞争条件得到拉平、且原已代收的群体，具体身份由第5段的victory确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Big-chain owners.\u003cbr>大型连锁企业的所有者。\u003c/p>\n\u003c/blockquote>\n\u003cp>A 的人和原文受益的企业是一一对应的，胜利已经给出了正面结果。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. Third-party sellers.\u003c/h3>\n\u003cblockquote>\n\u003cp>第三方卖家。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B 的 Third-party sellers 对应刚读过的 don’t have to 所指的卖家：它们使用网站，却以前不必像网站本身一样收税。这里要弄清旧安排怎样变成新安排，因此接着看第6段的 sellers 与 out-of-state sellers，把这一整段读完，再比较以前不收税与现在可以被要求收税。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>现在回到 B，把第5段第三方卖家原来的待遇，与第6段州今后可以提出的收税要求放在一起。\u003c/p>\n\u003cp>don&#39;t have to 说的是原来的情况；新裁决让州能够要求州外卖家代收。把旧的便利当成新的好处，会把变化前后读反。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#39;t have to.\u003c/p>\n\u003cp>Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states.\u003c/p>\n\u003cp>Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state&#39;s sales tax from customers and send it to the state.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最可能欢迎新裁决的是第三方卖家。\u003c/p>\n\u003c/blockquote>\n\u003cp>B 的 Third-party sellers 对应刚读过的 don’t have to 所指的卖家：它们使用网站，却以前不必像网站本身一样收税。这里要弄清旧安排怎样变成新安排，因此接着看第6段的 sellers 与 out-of-state sellers，把这一整段读完，再比较以前不收税与现在可以被要求收税。\u003c/p>\n\u003cp>现在回到 B，把第5段第三方卖家原来的待遇，与第6段州今后可以提出的收税要求放在一起。\u003c/p>\n\u003cp>第5段 don’t have to 写的是第三方卖家原来的不同待遇；第6段说州现在可以要求州外卖家从顾客那里收税，再交给州。B 的 Third-party sellers 属于前面享有不代收安排的卖家，不能把原来不必收税当成新裁决给它们的一项新好处。题干问谁会欢迎这次变化，新的安排恰恰使原来不收的卖家可能要开始收，而不是继续给它们更宽松的待遇。\u003c/p>\n\u003cp>don&#39;t have to 说的是原来的情况；新裁决让州能够要求州外卖家代收。把旧的便利当成新的好处，会把变化前后读反。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#39;t have to.\u003c/p>\n\u003cp>Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states.\u003c/p>\n\u003cp>Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state&#39;s sales tax from customers and send it to the state.\u003c/p>\n\u003cp>大型连锁企业此前通常已经代收，新规会让竞争者也代收；其他线上卖家要承担新义务，小企业还担忧遵从各州法律的负担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Third-party sellers welcome being required to collect sales taxes they previously did not collect.\u003c/p>\n\u003cp>第三方卖家欢迎承担此前没有的代收税义务。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文把网站自身已收与第三方此前不必收作区别。假设要证明新增义务对第三方有利；文章没有给出这种利益，不能把平台的待遇转给平台上的卖家。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>讨论后果必须区分受益者和受损者；最可能欢迎的是竞争条件得到拉平、且原已代收的群体，具体身份由第5段的victory确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Third-party sellers.\u003cbr>第三方卖家。\u003c/p>\n\u003c/blockquote>\n\u003cp>don&#39;t have to 说的是原来的情况；新裁决让州能够要求州外卖家代收。把旧的便利当成新的好处，会把变化前后读反。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. Internet entrepreneurs.\u003c/h3>\n\u003cblockquote>\n\u003cp>互联网创业者。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C 的 Internet entrepreneurs 让我们接着找网上经营者的反应。粗读结尾出现过小企业，回到第7段看，internet entrepreneurs 与 Small businesses 并列，是同一句里的两类经营者，因此先把第7段读完，再回看声明的评价。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。\u003c/p>\n\u003cp>Small businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses.\u003c/p>\n\u003cp>The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.\u003c/p>\n\u003cp>The Small Business &amp; Entrepreneurship Council advocacy group said in a statement, &quot;Small businesses and internet entrepreneurs are not well served at all by this decision.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最可能欢迎新裁决的是互联网创业者。\u003c/p>\n\u003c/blockquote>\n\u003cp>C 的 Internet entrepreneurs 让我们接着找网上经营者的反应。粗读结尾出现过小企业，回到第7段看，internet entrepreneurs 与 Small businesses 并列，是同一句里的两类经营者，因此先把第7段读完，再回看声明的评价。\u003c/p>\n\u003cp>回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。\u003c/p>\n\u003cp>原文 Small businesses 后面并列的是 internet entrepreneurs，声明对两者共用 are not well served at all 这一评价。C 的 Internet entrepreneurs 正是其中一类人，不能因为前面说零售业团体称赞，就把这种正面反应分给所有网上经营者。对这类创业者，末句明确说这项决定完全没有好好照顾他们，方向与欢迎相反。\u003c/p>\n\u003cp>Small businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses.\u003c/p>\n\u003cp>The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.\u003c/p>\n\u003cp>The Small Business &amp; Entrepreneurship Council advocacy group said in a statement, &quot;Small businesses and internet entrepreneurs are not well served at all by this decision.&quot;\u003c/p>\n\u003cp>大型连锁企业此前通常已经代收，新规会让竞争者也代收；其他线上卖家要承担新义务，小企业还担忧遵从各州法律的负担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Internet entrepreneurs regard the decision as serving their interests.\u003c/p>\n\u003cp>互联网创业者认为裁决符合自身利益。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段引述的组织明确说创业者not well served。要支持欢迎，后文应出现利益改善的理由，实际反应方向相反。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>讨论后果必须区分受益者和受损者；最可能欢迎的是竞争条件得到拉平、且原已代收的群体，具体身份由第5段的victory确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Internet entrepreneurs.\u003cbr>互联网创业者。\u003c/p>\n\u003c/blockquote>\n\u003cp>Small businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. Small retailers.\u003c/h3>\n\u003cblockquote>\n\u003cp>小型零售商。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D 的 Small retailers 对应第7段 especially smaller ones，都是体量较小的零售商；这句前面将他们放在 The losers 之后，所以直接回到刚读过的第7段，看他们被归在哪一边。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。D 的 Small retailers 与原文限定的人群范围不同，它只按规模泛称小型零售商，没有保留网上经营这一条件，也没有指出其中哪一类明确受益。后面 headaches 继续说这些网上零售商面临麻烦。这里既不能把所有小型实体店都算成失利者，也不能仅凭 small 这个规模，就把小型零售商选为最可能欢迎的一方；文章明确给出胜利的是大型连锁企业。\u003c/p>\n\u003cp>especially smaller ones 加重的是小型网上零售商的不利处境。D 只说 Small retailers，没有
