factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>讨论后果必须区分受益者和受损者；最可能欢迎的是竞争条件得到拉平、且原已代收的群体，具体身份由第5段的victory确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Small retailers.\u003cbr>小型零售商。\u003c/p>\n\u003c/blockquote>\n\u003cp>especially smaller ones 加重的是小型网上零售商的不利处境。D 只说 Small retailers，没有给出明确受益的经营身份；A 所指的大型连锁企业则被直接称为获得胜利。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>39题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>39. A. Big-chain owners.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：现在回到 A，企业的一场胜利与其所有者是否最可能欢迎，直接看第5段首句给出的结果和原因。\u003c/p>\n\u003cp>B：现在回到 B，把第5段第三方卖家原来的待遇，与第6段州今后可以提出的收税要求放在一起。\u003c/p>\n\u003cp>C：回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。\u003c/p>\n\u003cp>D：原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：最高法院裁决的核心内容\u003c/strong>（段落1-3事件概述） 裁决影响：各州可强制更多人网购时缴纳销售税（购物者钱包变轻 // 州政府财政胜利）→ 推翻的历史判决：【旧规则：无实体存在不必代收销售税 → 后果：州政府年损失数十亿美元 + 顾客自行缴税但很少人缴纳】\u003c/p>\n\u003cp>↓（法理依据）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：肯尼迪大法官的法理论述\u003c/strong>（段落4法律分析） 判决缺陷：实体存在规则脱离经济现实 → 造成州政府重大收入损失 → 负面影响：【限制州寻求长期繁荣 + 阻止市场公平竞争】\u003c/p>\n\u003cp>↓（影响分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：对不同企业的影响差异\u003c/strong>（段落5-6影响剖析） 赢家：大型连锁店（本已在各州有实体店并征税）+ 亚马逊（仓库网络已覆盖各州）→ 现状改变：【之前：小卖家只在所在州征税 + eBay/Etsy卖家不全国征税 → 现在：州可要求所有州外卖家代收销售税】\u003c/p>\n\u003cp>↓（各方反应）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：各利益相关方的反应\u003c/strong>（段落7反应总结） 支持者：零售贸易团体（认为平衡了竞争环境）// 反对者：【纯在线零售商（特别是小型）：面临遵守各州税法的困难 + 小企业委员会：认为决定不利于小企业和网络创业者】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：最高法院推翻了实体存在规则，允许各州要求所有网络卖家代收销售税，这一裁决有利于大型连锁店和州政府财政，但给小型网络零售商带来合规负担。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Removing an Unequal Burden on Competing Sellers\u003c/p>\n\u003cp>B. Making All Internet Purchases Tax-free\u003c/p>\n\u003cp>C. Making Fair Collection Practical for Small Firms\u003c/p>\n\u003cp>D. Ending Competition between Shops and Websites\u003c/p>\n\u003cp>E. A Collection Gap Behind an Apparent Tax Break\u003c/p>\n\u003cp>F. Public Revenue Lost as Shopping Moves Online\u003c/p>\n\u003cp>G. The Uneven Cost of Complying with the New Rule\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>An online purchase could appear tax-free when no sales tax was added at checkout. Under the older physical-presence rule, a seller without the required connection to a state could avoid collecting that state’s sales tax. This did not necessarily remove the customer’s tax obligation. Instead, the buyer might be expected to report and pay the relevant tax separately. Few shoppers found that process convenient, and compliance was difficult to secure. What looked like a tax exemption was therefore often a gap between a legal obligation and an effective method of collection. Changing who must collect the payment can matter even when the underlying purchase was not legally untaxed.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>For state governments, that gap was not a minor detail of shopping convenience. Revenue that was legally due could fail to arrive as consumers shifted spending towards sellers that did not collect it. A tax system tied to a retailer’s physical footprint became less reliable when a business could reach customers widely without opening local premises. The fiscal concern was therefore connected to a change in the structure of commerce, not simply to a wish to penalise a particular website. States sought a way to preserve a revenue base that older collection rules no longer reached effectively as more transactions moved across state lines.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>Retailers with local stores had a different reason to challenge the old arrangement. They normally collected tax at the point of sale, while a rival selling from outside the state might display a lower checkout total because it did not. That difference could steer a buyer towards the remote seller even when the goods and their pre-tax prices were comparable. Requiring more remote sellers to collect tax reduces this particular advantage. The reform does not stop firms competing on price, service or selection. Rather, it makes one part of the competition less dependent on whether the seller happens to maintain a physical location in the buyer’s state.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>A more even collection rule does not produce an even adjustment cost. A large chain already collecting tax in many states may have staff and software capable of handling the change. A small seller operating mainly through the internet may instead face unfamiliar registration procedures, different rates and reporting duties across many jurisdictions. The legal principle can be the same while the administrative effort is very different. This is why approval from established retailers does not show that every online business benefits equally. The size and previous tax practices of a seller shape whether the new obligation is a routine extension of existing work or a substantial new burden.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>The challenge is to preserve fair collection without making participation impractical for small firms. Clear guidance, usable filing systems and coordination among jurisdictions can reduce the work involved in meeting an obligation. These measures address administration rather than grant every remote seller a permanent exemption. They also recognise that a rule’s success depends on whether businesses can understand and carry it out, not only on whether its principle sounds fair. A workable system would collect what is owed while avoiding needless differences in procedure. Equal treatment is more credible when the route to compliance is intelligible to businesses with limited staff as well as to national chains.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】E. A Collection Gap Behind an Apparent Tax Break\u003c/p>\n\u003cblockquote>\n\u003cp>看似免税背后的征收缺口\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分区分商家没有代收与买家没有义务，解释看似免税为何可能只是征收程序失灵。\u003c/p>\n\u003cp>先呈现消费者看到的现象：\u003c/p>\n\u003cblockquote>\n\u003cp>An online purchase could appear tax-free when no sales tax was added at checkout.\u003c/p>\n\u003c/blockquote>\n\u003cp>结账页面未加税，会使购物看起来免税；\u003ccode>appear\u003c/code>提醒这只是外观，还不能据此判断法律义务消失。\u003c/p>\n\u003cp>随后把商家的征收义务与买家的纳税义务分开：\u003c/p>\n\u003cblockquote>\n\u003cp>This did not necessarily remove the customer’s tax obligation. Instead, the buyer might be expected to report and pay the relevant tax separately.\u003c/p>\n\u003c/blockquote>\n\u003cp>旧规则可能使商家不用代收，但买家仍可能需要单独申报缴纳。实际执行困难，才形成应缴与实缴之间的断裂。\u003c/p>\n\u003cp>结尾直接给出概念归纳：\u003c/p>\n\u003cblockquote>\n\u003cp>What looked like a tax exemption was therefore often a gap between a legal obligation and an effective method of collection.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段并非宣布网购一律免税，而是解释为什么“看似免税”可能只是缺乏有效征收渠道。改变代收者由此成为重要问题。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>结账未加税 → 商家可能无需代收但买家仍有义务 → 单独申报难落实 → 看似免税实际是征收缺口\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Apparent Tax Break\u003c/code>对应\u003ccode>appear tax-free\u003c/code>与\u003ccode>looked like a tax exemption\u003c/code>；\u003ccode>Collection Gap\u003c/code>对应法定义务和有效征收之间的断裂。标题中的\u003ccode>Apparent\u003c/code>保留了作者的关键区分。\u003c/p>\n\u003cp>再看最强干扰项B：Making All Internet Purchases Tax-free。\u003c/p>\n\u003cp>干扰项把结账时没代收扩大为所有网购合法免税，而原文明说客户义务未必消失。它不仅扩大到\u003ccode>All\u003c/code>，还把“征收方式失灵”改成“取消税收”的政策目标。\u003c/p>\n\u003cp>\u003cstrong>41题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】F. Public Revenue Lost as Shopping Moves Online\u003c/p>\n\u003cblockquote>\n\u003cp>购物转向线上造成的公共收入流失\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分从州政府角度解释跨境购物如何削弱旧征收办法，并造成保护税基的改革压力。\u003c/p>\n\u003cp>段首先把同一个缺口换成州政府视角：\u003c/p>\n\u003cblockquote>\n\u003cp>Revenue that was legally due could fail to arrive as consumers shifted spending towards sellers that did not collect it.\u003c/p>\n\u003c/blockquote>\n\u003cp>消费者把支出转向不代收税的卖家，应有收入却收不上来；讨论对象已从单次结账转为公共财政。\u003c/p>\n\u003cp>原因是旧规则与商业结构错位：\u003c/p>\n\u003cblockquote>\n\u003cp>A tax system tied to a retailer’s physical footprint became less reliable when a business could reach customers widely without opening local premises.\u003c/p>\n\u003c/blockquote>\n\u003cp>规则依赖实体场所，企业却可不设本地门店就触达客户，所以线上扩张削弱了原征收办法的覆盖能力。\u003c/p>\n\u003cp>末句把州的诉求限定为保护税基：\u003c/p>\n\u003cblockquote>\n\u003cp>States sought a way to preserve a revenue base that older collection rules no longer reached effectively as more transactions moved across state lines.\u003c/p>\n\u003c/blockquote>\n\u003cp>目标是让税制重新触及跨州交易形成的收入，不是单纯惩罚某个网站。段落由收入流失解释改革动力。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>消费者转向不代收的卖家 → 合法应得税收未到账 → 实体门店标准覆盖不了新交易 → 州寻求保护公共收入基础\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Public Revenue Lost\u003c/code>对应\u003ccode>Revenue...could fail to arrive\u003c/code>；\u003ccode>Shopping Moves Online\u003c/code>由不设本地场所也能触达消费者及更多跨州交易共同说明。标题概括结构变化造成的财政后果。\u003c/p>\n\u003cp>再看最强干扰项E：A Collection Gap Behind an Apparent Tax Break。\u003c/p>\n\u003cp>征收缺口仍是起因，但上一段已解释它如何产生；本段新增的是州政府收入流失和保护税基的动机。仅用缺口标题会漏掉明确的政府视角及商业变化带来的财政影响。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】A. Removing an Unequal Burden on Competing Sellers\u003c/p>\n\u003cblockquote>\n\u003cp>消除竞争商家承担的不平等负担\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分从商家竞争角度说明代收义务差异如何影响结账价格，以及改革怎样减少这项偏差。\u003c/p>\n\u003cp>第一句转入实体零售商的竞争处境：\u003c/p>\n\u003cblockquote>\n\u003cp>They normally collected tax at the point of sale, while a rival selling from outside the state might display a lower checkout total because it did not.\u003c/p>\n\u003c/blockquote>\n\u003cp>同卖一种商品，一方结账代收税，另一方不代收，总价就可能不同；差异不是商品质量，而是征收义务。\u003c/p>\n\u003cp>改革直接针对这项优势：\u003c/p>\n\u003cblockquote>\n\u003cp>Requiring more remote sellers to collect tax reduces this particular advantage.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>this particular advantage\u003c/code>回指不代收造成的结账价格优势，不能扩大成取消远程销售的全部优势。\u003c/p>\n\u003cp>作者随后说明公平并不等于取消竞争：\u003c/p>\n\u003cblockquote>\n\u003cp>The reform does not stop firms competing on price, service or selection.\u003c/p>\n\u003c/blockquote>\n\u003cp>价格、服务和商品选择的竞争仍然存在；末句只要求其中一个环节少受卖家是否有本地门店影响。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>本地店必须代收而外州对手可能不代收 → 总价差影响购买选择 → 统一更多卖家的征收义务 → 保留正常竞争并减少规则造成的偏差\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Unequal Burden\u003c/code>对应代收义务不一致；\u003ccode>Competing Sellers\u003c/code>对应本地店和远程对手；\u003ccode>Removing\u003c/code>指减少这项规则差异，而非停止企业竞争。\u003c/p>\n\u003cp>再看最强干扰项D：Ending Competition between Shops and Websites。\u003c/p>\n\u003cp>干扰标题主张结束实体与网络竞争，但原文明确\u003ccode>does not stop firms competing\u003c/code>，并列举仍可竞争的三个方面。减少制度偏差与消灭竞争方向不同。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】G. The Uneven Cost of Complying with the New Rule\u003c/p>\n\u003cblockquote>\n\u003cp>遵守新规则的成本并不均等\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分比较大小商家的既有系统和人力，说明同一征收规则为何造成不同适应成本。\u003c/p>\n\u003cp>首句直接提出本段的区别：\u003c/p>\n\u003cblockquote>\n\u003cp>A more even collection rule does not produce an even adjustment cost.\u003c/p>\n\u003c/blockquote>\n\u003cp>征收规则更平等，不保证适应规则的成本也平等；后面两类商家正是这个判断的例证。\u003c/p>\n\u003cp>大型连锁与小型网商形成对照：\u003c/p>\n\u003cblockquote>\n\u003cp>A large chain already collecting tax in many states may have staff and software capable of handling the change.\u003c/p>\n\u003c/blockquote>\n\u003cp>大型商家已有人员和系统，小型网商却可能首次应付跨辖区登记、税率和申报。区别来自既有能力与经营规模，而不是小企业被赋予了另一套基本原则。\u003c/p>\n\u003cp>最后用两种工作性质概括差异：\u003c/p>\n\u003cblockquote>\n\u003cp>The size and previous tax practices of a seller shape whether the new obligation is a routine extension of existing work or a substantial new burden.\u003c/p>\n\u003c/blockquote>\n\u003cp>已有代收流程的延伸与全新的重负担，说明同一法律变化在不同商家身上的执行后果不同。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>规则更平等未必成本更平等 → 大型企业已有人员系统 → 小网商面临新程序 → 既有税务实践决定调整负担\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Uneven Cost\u003c/code>对应大型和小型商家的不同适应负担；\u003ccode>Complying with the New Rule\u003c/code>对应登记、税率、申报义务，而不是商品本身多缴了多少税。\u003c/p>\n\u003cp>再看最强干扰项A：Removing an Unequal Burden on Competing Sellers。\u003c/p>\n\u003cp>消除竞争负担差异是改革理由，本段却用\u003ccode>does not\u003c/code>转向执行成本仍不均等的保留。只用公平竞争标题，会把对改革后果的细分误读为再次赞同改革的一般原则。\u003c/p>\n\u003cp>\u003cstrong>44题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】C. Making Fair Collection Practical for Small Firms\u003c/p>\n\u003cblockquote>\n\u003cp>让公平征税也能为小企业实际执行\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分在保留公平征收目标的同时，提出使小企业也能遵从的操作办法。\u003c/p>\n\u003cp>段首提出需要同时满足的两个目标：\u003c/p>\n\u003cblockquote>\n\u003cp>The challenge is to preserve fair collection without making participation impractical for small firms.\u003c/p>\n\u003c/blockquote>\n\u003cp>既保留公平征收，又不让小企业难以执行；不是在公平与豁免之间简单二选一。\u003c/p>\n\u003cp>随后给出针对操作负担的具体办法：\u003c/p>\n\u003cblockquote>\n\u003cp>Clear guidance, usable filing systems and coordination among jurisdictions can reduce the work involved in meeting an obligation.\u003c/p>\n\u003c/blockquote>\n\u003cp>指引、申报系统和跨辖区协调分别缓解不懂规则、难以办理和程序差异；它们回应上段的小商家执行成本，而非取消纳税。\u003c/p>\n\u003cp>最后一句说明公平怎样落地：\u003c/p>\n\u003cblockquote>\n\u003cp>Equal treatment is more credible when the route to compliance is intelligible to businesses with limited staff as well as to national chains.\u003c/p>\n\u003c/blockquote>\n\u003cp>人员少的企业也能理解遵从路径，平等待遇才更可信。因此本段重心从原则推进到可执行性。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>保留公平征收目标 → 通过指引、系统和协调减轻操作负担 → 不等于永久免税 → 使小企业也能理解并执行规则\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Fair Collection\u003c/code>对应保留应收税款；\u003ccode>Practical for Small Firms\u003c/code>对应可用申报系统、清楚指引和有限人员也能遵从。标题完整保留两个必须兼顾的目标。\u003c/p>\n\u003cp>再看最强干扰项B：Making All Internet Purchases Tax-free。\u003c/p>\n\u003cp>简化程序可能被误当减免税款，但本段明确说\u003ccode>rather than grant every remote seller a permanent exemption\u003c/code>。它改进怎样履行义务，没有让所有网购永久免税。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>As shopping moved across state borders through the internet, an old sales-tax rule became increasingly controversial. A seller could reach thousands of customers in a state without opening a store there. The dispute began with whether the absence of a physical business location should continue to determine the seller’s duty to collect tax.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Reducing these administrative costs need not mean restoring the old exemption from collection. Clearer guidance and simpler filing arrangements could help a small firm comply without the resources of a national chain. Coordination could also limit unnecessary procedural differences. The practical task is to make a common obligation manageable for businesses with unequal capacities.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar. Its systems and staff might need extension rather than creation from nothing. Smaller online sellers, by contrast, could face a new set of registrations and reporting requirements. The same obligation could therefore involve very different administrative costs.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Under the older rule, that absence could free the seller from collecting the state’s sales tax at checkout. The customer’s obligation did not necessarily disappear, however. Buyers might still owe tax through a separate reporting process. This distinction between the seller’s collection duty and the buyer’s liability is essential to understanding what followed.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>For states, this growing collection gap meant lost revenue. For local shops, it also meant facing remote competitors whose checkout totals might omit tax. These fiscal and competitive effects increased pressure for a different rule. The issue was no longer merely where a seller occupied a building, but how the old standard affected a changed market.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>The change in rule removed the old physical-presence restriction as the governing standard for collection duties. States could require more remote sellers to collect tax, reducing the advantage created by not adding it at checkout. Yet sellers did not enter the new arrangement from the same starting point. Existing tax collection practices mattered greatly.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>The separate process often failed to turn the buyer’s liability into an actual payment. Many consumers did not report the purchases themselves, and obtaining the money from individual shoppers was difficult. Consequently, a transaction that remained taxable could yield no collected tax. The resulting gap grew more significant as more spending moved to remote sellers.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>A fairer market and a workable tax system should be pursued together. Requiring collection can protect public revenue and reduce a competitive distortion, but complicated implementation can create new difficulties. The durable solution respects both sides: an obligation should reach comparable transactions, and its administration should not impose avoidable obstacles on smaller participants.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>引出跨州网购与实体场所征税标准的争议\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>针对执行成本提出简化协调，使不同能力商家都可遵从\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>比较大商家既有能力与小网商的新负担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>解释旧规则，区分商家代收义务与买家纳税义务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>分析缺口造成的财政和竞争后果，形成改变规则的压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>介绍规则变化，并提示卖家原有征收实践影响不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>说明买家单独申报难落实，形成日益扩大的征收缺口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>兼顾公平、公共收入和可执行性，收束改革评价\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>引出跨州网购与实体场所征税标准的争议 → 解释旧规则，区分商家代收义务与买家纳税义务 → 说明买家单独申报难落实，形成日益扩大的征收缺口 → 分析缺口造成的财政和竞争后果，形成改变规则的压力 → 介绍规则变化，并提示卖家原有征收实践影响不同 → 比较大商家既有能力与小网商的新负担 → 针对执行成本提出简化协调，使不同能力商家都可遵从 → 兼顾公平、公共收入和可执行性，收束改革评价\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → G → E → F → C → B → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、G、F、C、B。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → G的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The dispute began with whether the absence of a physical business location should continue to determine the seller’s duty to collect tax.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Under the older rule, that absence could free the seller from collecting the state’s sales tax at checkout.\u003c/p>\n\u003c/blockquote>\n\u003cp>A最后问\u003ccode>absence of a physical business location\u003c/code>是否还应决定征收义务。本段\u003ccode>that absence\u003c/code>回指没有实体场所，并说明旧制度的答案：卖家可能免于结账代收，正好把争议背景具体化。\u003c/p>\n\u003cp>\u003ccode>however\u003c/code>接着否定一种常见等同：商家不代收，不代表买家义务消失。段中提出\u003ccode>a separate reporting process\u003c/code>，末句明确这是卖家征收责任与买家税款责任的区别。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This distinction between the seller’s collection duty and the buyer’s liability is essential to understanding what followed.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The separate process often failed to turn the buyer’s liability into an actual payment.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段首句\u003ccode>The separate process\u003c/code>正承接买家另行申报这一程序，然后解释程序为什么常收不到钱。先建立法律区别，才能说明制度在执行层面哪里失灵。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>引出跨州网购与实体场所征税标准的争议 → 解释旧规则，区分商家代收义务与买家纳税义务 → 说明买家单独申报难落实，形成日益扩大的征收缺口\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The change in rule removed the old physical-presence restriction as the governing standard for collection duties.\u003c/p>\n\u003c/blockquote>\n\u003cp>新规则段也提实体场所，但开头就是\u003ccode>The change in rule\u003c/code>，预设旧规则及其问题已经交代。A只提出争议，直接接改变后的结果，会缺少买家另行申报与征收缺口的来由。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → G → E的关系。\u003c/p>\n\u003cp>先看前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This distinction between the seller’s collection duty and the buyer’s liability is essential to understanding what followed.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The separate process often failed to turn the buyer’s liability into an actual payment.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段明确买家可能通过\u003ccode>a separate reporting process\u003c/code>缴税。本段用\u003ccode>The separate process\u003c/code>接续，并把问题限定为无法将\u003ccode>liability\u003c/code>变成\u003ccode>actual payment\u003c/code>：有义务与实际收到税款之间有落差。\u003c/p>\n\u003cp>消费者不自行申报、逐人追缴又困难，于是仍属应税交易却没有征收结果。末句说交易向远程卖家转移使\u003ccode>The resulting gap\u003c/code>更显著，这个缺口由前面两项执行困难产生。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The resulting gap grew more significant as more spending moved to remote sellers.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>For states, this growing collection gap meant lost revenue.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知E的\u003ccode>this growing collection gap\u003c/code>直接概括本段最后的扩大缺口，再分别说明州收入与本地商店竞争受到什么影响。机制先说明，后果随后展开。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>解释旧规则，区分商家代收义务与买家纳税义务 → 说明买家单独申报难落实，形成日益扩大的征收缺口 → 分析缺口造成的财政和竞争后果，形成改变规则的压力\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar.\u003c/p>\n\u003c/blockquote>\n\u003cp>大小卖家成本段谈的是新征收义务实施之后的系统和申报负担；E却还在从旧征收缺口推出改革压力。若将成本段放此处，会让新制度先于改革动机出现，也无法提供E的\u003ccode>this growing collection gap\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → F → C的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The issue was no longer merely where a seller occupied a building, but how the old standard affected a changed market.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The change in rule removed the old physical-presence restriction as the governing standard for collection duties.\u003c/p>\n\u003c/blockquote>\n\u003cp>E说财政与竞争后果促成\u003ccode>pressure for a different rule\u003c/code>。本段\u003ccode>The change in rule\u003c/code>接住这一改革诉求，说明旧实体存在限制被移除，州可要求更多远程卖家代收。它是对压力的制度回应。\u003c/p>\n\u003cp>先说明减少不代收带来的价格优势，再用\u003ccode>Yet\u003c/code>提醒卖家起点不同；末句\u003ccode>Existing tax collection practices mattered greatly\u003c/code>把问题从法律原则转向企业已有的执行能力。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Existing tax collection practices mattered greatly.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段以\u003ccode>already collecting in many states\u003c/code>的大型零售商举例，\u003ccode>those existing practices\u003c/code>回指本段末句。先提示“旧有实践很重要”，再比较谁已有系统、谁需要新建。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>分析缺口造成的财政和竞争后果，形成改变规则的压力 → 介绍规则变化，并提示卖家原有征收实践影响不同 → 比较大商家既有能力与小网商的新负担\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Under the older rule, that absence could free the seller from collecting the state’s sales tax at checkout.\u003c/p>\n\u003c/blockquote>\n\u003cp>旧规则解释段同样谈实体场所，但它回答的是为什么卖家可不代收，无法承接E已经形成的\u003ccode>different rule\u003c/code>诉求。后段的大型卖家\u003ccode>those existing practices\u003c/code>也需要本段先明确提出起点差异。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成F → C → B的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Existing tax collection practices mattered greatly.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段以\u003ccode>Existing tax collection practices\u003c/code>收束，当前段的\u003ccode>those existing practices\u003c/code>将该概念落实到已在多州代收的大型商家。它不重新讨论规则对错，而是解释已有经验怎样影响适应成本。\u003c/p>\n\u003cp>大型商家可能只需扩展现有人手系统，小网商却面对新登记和申报要求；\u003ccode>by contrast\u003c/code>标出比较关系。末句由这两类例子归纳为不同的\u003ccode>administrative costs\u003c/code>。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The same obligation could therefore involve very different administrative costs.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing these administrative costs need not mean restoring the old exemption from collection.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段\u003ccode>Reducing these administrative costs\u003c/code>明确回指刚归纳的管理成本，并提出简化措施。只有先说明成本差在哪里，才能讨论降低\u003ccode>these\u003c/code>成本的方法。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>介绍规则变化，并提示卖家原有征收实践影响不同 → 比较大商家既有能力与小网商的新负担 → 针对执行成本提出简化协调，使不同能力商家都可遵从\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing these administrative costs need not mean restoring the old exemption from collection.\u003c/p>\n\u003c/blockquote>\n\u003cp>简化协调段一开始就要降低\u003ccode>these administrative costs\u003c/code>，但前段只是说原有实践重要，尚未列出大小企业的成本对照。本段必须先把不同起点转化为实际负担，解决办法才有具体对象。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成C → B → H的关系。\u003c/p>\n\u003cp>先看前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The same obligation could therefore involve very different administrative costs.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing these administrative costs need not mean restoring the old exemption from collection.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段结尾归纳同一义务造成\u003ccode>very different administrative costs\u003c/code>。本段\u003ccode>Reducing these administrative costs\u003c/code>沿用这一对象，第一句先说明减负不等于恢复旧的代收豁免。\u003c/p>\n\u003cp>清楚指引、简化申报和辖区协调分别应对小企业资源少、程序多的问题，末句再概括为让能力不等的企业履行共同义务。这与单纯宣布“都应纳税”相比增加了执行路径。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The practical task is to make a common obligation manageable for businesses with unequal capacities.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A fairer market and a workable tax system should be pursued together.\u003c/p>\n\u003c/blockquote>\n\u003cp>H将\u003ccode>fairer market\u003c/code>与\u003ccode>workable tax system\u003c/code>并列，并要求避免小商家面对可避免的障碍。本段的可操作办法提供了第二项目标的内容，使最终结论兼顾公平与实际执行。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>比较大商家既有能力与小网商的新负担 → 针对执行成本提出简化协调，使不同能力商家都可遵从 → 兼顾公平、公共收入和可执行性，收束改革评价\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The change in rule removed the old physical-presence restriction as the governing standard for collection duties.\u003c/p>\n\u003c/blockquote>\n\u003cp>规则变化段可说明改革减少竞争偏差，却没有处理成本如何降低。此处重放它会重复“要求代收”，丢掉刚提出的小商家负担问题，H关于\u003ccode>avoidable obstacles\u003c/code>的总结也缺少对应解决思路。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>fair competition\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>公平竞争\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>经济消费类：企业经营\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>public responsibility\u003c/td>\n\u003ctd>公共责任\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>adaptation to change\u003c/td>\n\u003ctd>适应变化\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>balanced judgement\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>平衡判断\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：批判、独立、全局思维\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sustainable public finance\u003c/td>\n\u003ctd>可持续的公共财政\u003c/td>\n\u003ctd>经济消费类：经济收入\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsible entrepreneurship\u003c/td>\n\u003ctd>负责任的创业\u003c/td>\n\u003ctd>经济消费类：企业经营\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>equal opportunities\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>平等机会\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>long-term prosperity\u003c/td>\n\u003ctd>长期繁荣\u003c/td>\n\u003ctd>经济消费类：经济收入\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>consideration for smaller participants\u003c/td>\n\u003ctd>对较小参与者的体谅\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture contrasts the effects of X on A and B.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画对比X对A和B的不同影响。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The picture shows A and B competing on unequal terms.\u003c/td>\n\u003ctd>图画展示A与B在不平等条件下竞争。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene illustrates the difficulties faced by smaller participants.\u003c/td>\n\u003ctd>这一场景展示较小参与者面临的困难。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart indicates significant losses in X over the period.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表显示该时期X存在显著损失。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures show that more people are now participating in X.\u003c/td>\n\u003ctd>数字表明现在有更多人参与X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The change is associated with a financial gain for A.\u003c/td>\n\u003ctd>这一变化与A的经济收益相联系。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage gives a factual account of X and its consequences.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章对X及其后果作了事实性介绍。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text discusses a rule that has become removed from economic reality.\u003c/td>\n\u003ctd>文字讨论了一项逐渐脱离经济现实的规定。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue concerns how to create an even playing field for A and B.\u003c/td>\n\u003ctd>问题涉及如何为A与B创造公平竞争环境。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":8},{"label":"句内逻辑","index":36},{"label":"长难句手译","index":39},{"label":"第三鸟 · 题目复盘","index":58},{"label":"40题","index":59},{"label":"36题","index":69},{"label":"37题","index":87},{"label":"38题","index":105},{"label":"39题","index":123},{"label":"第四鸟 · 新题型","index":141},{"label":"小标题题","index":141},{"label":"排序题","index":147},{"label":"第五鸟 · 写作积累","index":153}];
const allIndices = [0,1,2,3,4,5,6,7,11,15,19,23,27,31,35,36,37,38,39,45,51,57,58,59,61,63,65,67,68,69,73,77,81,85,86,87,91,95,99,103,104,105,109,113,117,121,122,123,127,131,135,139,140,141,142,143,144,145,146,147,148,149,150,151,152,153,154];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
 const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
 const top=rightScroll.scrollTop+er.top-sr.top;
 const target=height<=view-2*margin?top+height/2-view/2:top-margin;
 rightScroll.scrollTop=clampScroll(target,rightScroll.scrollHeight-view);
}
function positionRight(st,token,restore){
 guardedSchedule(token,()=>{
  if(isLongSentenceCumulative(st)){
   positionLongSentence(st);
   if(!restore)return;
  }
  if(restore){
   rightScroll.scrollTop=saved.right;
   window.scrollTo(0,saved.win);
   return;
  }
  if(!st.meta.cumulative||st.meta.partIndex===0){rightScroll.scrollTop=0;return;}
  const el=document.getElementById(st.focusId);
  if(!el)return;
  if(isParagraphCumulative(st)){
   // Match the sample: no artificial tail; real content height limits the scroll.
   const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const top=rightScroll.scrollTop+er.top-sr.top;
   rightScroll.scrollTop=clampScroll(top-34,rightScroll.scrollHeight-rightScroll.clientHeight);
   return;
  }
  // A short final layer still needs enough trailing room to bring its heading into view.
  const tail=rightContent.querySelector('.longScrollTail');
  if(tail)tail.style.minHeight=Math.max(420,rightScroll.clientHeight*.9-el.offsetHeight)+'px';
  const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
  const top=rightScroll.scrollTop+er.top-sr.top;
  rightScroll.scrollTop=latestTarget(top,rightScroll.clientHeight,rightScroll.scrollHeight-rightScroll.clientHeight);
 });
}
function render(options={}){
 const token=++renderToken; // stale image and scroll callbacks may never reset a newer step
 document.body.classList.toggle('allMode',all);
 toggleAll.classList.toggle('active',all);
 toggleAll.textContent=all?'返回交互':'显示全部';
 if(all){
  layout.className='layout single';leftPanel.hidden=true;
  rightContent.innerHTML='<div class="fullContent">'+FULL+'</div>';
  hydrateAssets(rightContent);rightScroll.scrollTop=0;
  progress.textContent='全文';
  prev.disabled=next.disabled=reset.disabled=jump.disabled=true;
  return;
 }
 const st=DATA[idx],previous=lastRenderedIdx<0?null:DATA[lastRenderedIdx];
 const sameGroup=previous&&st.meta.cumulative&&previous.meta.cumulative&&st.meta.cumulativeGroup===previous.meta.cumulativeGroup;
 reset.disabled=jump.disabled=false;prev.disabled=idx===0;next.disabled=idx===DATA.length-1;
 progress.textContent=(idx+1)+' / '+DATA.length;
 if(st.context){
  layout.className='layout split';leftPanel.hidden=false;
  renderContext(st.context,token,options.restore===true);
 }else{
  layout.className='layout single';leftPanel.hidden=true;
  leftStage.innerHTML='';delete leftStage.dataset.kind;
 }
 const holder=rightContent.querySelector('.cumulativeParts');
 let kept=false;
 if(sameGroup&&holder&&!options.restore){
  if(st.html.startsWith(previous.html)){
   holder.insertAdjacentHTML('beforeend',st.html.slice(previous.html.length));kept=true;
  }else if(previous.html.startsWith(st.html)){
   while(holder.children.length>st.meta.partIndex+1)holder.lastElementChild.remove();
   kept=true;
  }
 }
 if(!kept){
  const third=st.section==='第三鸟 · 题目复盘'?' thirdBird':'';
  const content=st.meta.cumulative?'<div class="cumulativeParts">'+st.html+'</div>'+(isParagraphCumulative(st)?'':'<div class="longScrollTail" aria-hidden="true"></div>'):st.html;
  rightContent.innerHTML='<div class="stage'+third+'"><div class="stageHeader"><div class="crumb">'+escHtml(st.section)+'</div><h1 class="stepTitle">'+escHtml(st.title)+'</h1></div><div class="lectureBody">'+content+'</div></div>';
 }
 hydrateAssets(rightContent);
 positionRight(st,token,options.restore===true);
 jump.value='';lastRenderedIdx=idx;
}
JUMP_TARGETS.forEach(j=>{const o=document.createElement('option');o.value=String(j.index);o.textContent=j.label;jump.appendChild(o);});
next.onclick=()=>{if(!all&&idx<DATA.length-1){idx++;render();}};
prev.onclick=()=>{if(!all&&idx>0){idx--;render();}};
reset.onclick=()=>{idx=0;all=false;lastRenderedIdx=-1;render();};
jump.onchange=()=>{if(jump.value!==''){idx=Number(jump.value);all=false;lastRenderedIdx=-1;render();}};
toggleAll.onclick=()=>{
 if(!all){saved={idx,left:leftScroll.scrollTop,right:rightScroll.scrollTop,win:window.scrollY};all=true;render();}
 else{all=false;idx=saved.idx;lastRenderedIdx=-1;render({restore:true});}
};
document.addEventListener('keydown',e=>{
 if(all||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,button,[contenteditable="true"]'))return;
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next.click();}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev.click();}
});
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!all)render();},100);});
render();
