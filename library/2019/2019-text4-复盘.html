const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| be able to | 能够 | force | v.强迫；迫使 | sales tax | 销售税 |\n| online purchase | 网上购买 | Supreme Court decision | 最高法院裁决 | Thursday | n.星期四 |\n| leave | v.使处于某种状态 | lighter wallet | 更轻的钱包 | financial win | 财政收益 |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 4重点词与语境","focus":[85,148,925,319],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>be able to\u003c/td>\n\u003ctd>能够\u003c/td>\n\u003ctd>force\u003c/td>\n\u003ctd>v.强迫；迫使\u003c/td>\n\u003ctd>sales tax\u003c/td>\n\u003ctd>销售税\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>online purchase\u003c/td>\n\u003ctd>网上购买\u d results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices. Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Justice Anthony Kennedy wrote / that the previous decisions were flawed.\u003c/p>\n\u003cp>&quot;Each year / the physical presence rule / becomes further removed / from economic reality / and results in / significant revenue losses / to the States,&quot; / he wrote / in an opinion / joined by four other justices.\u003c/p>\n\u003cp>Kennedy wrote / that the rule / &quot;limited states&#39; ability / to seek long-term prosperity / and has prevented / market participants / from competing / on an even playing field.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-2\">\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>大法官安东尼·肯尼迪写道 / 之前的判决是有缺陷的。\u003c/p>\n\u003cp>&quot;每年 / 实体存在规则 / 变得更加脱离 / 经济现实 / 并导致 / 重大收入损失 / 对各州来说，&quot; / 他写道 / 在一份意见中 / 其他四位大法官加入。\u003c/p>\n\u003cp>肯尼迪写道 / 该规则 / &quot;限制了各州的能力 / 寻求长期繁荣 / 并且阻止了 / 市场参与者 / 竞争 / 在一个公平的竞争环境中。&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-3\">\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>大法官安东尼·肯尼迪写道，之前的判决是有缺陷的。他在一份有其他四位大法官加入的意见书中写道：&quot;每年实体存在规则都更加脱离经济现实，并给各州造成重大收入损失。&quot;肯尼迪写道，该规则&quot;限制了各州寻求长期繁荣的能力，并阻止了市场参与者在公平的竞争环境中竞争。&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第5段","level":3,"raw":"### 完整原文 · 第5段\n\nThe ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, rivals will be charging sales tax where they hadn't before. Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a purch 003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n"},{"section":"第二鸟 · 精读与翻译","title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n### 第1段\n\nStates will be able to force → more people to pay sales tax：(when they make online purchases)：(under a Supreme Court decision Thursday：(that will leave shoppers：(with lighter wallets) // but is a big financial win：(for states))).\n\n### 第2段\n\nThe Supreme Court's opinion Thursday → overruled a pair of decades-old decisions：(that states said → cost them billions of dollars：(in lost revenue annually)).\n\nThe decisions made it more difficult：(for states to collect sales tax：(on certain online purchases)).\n\n### 第3段\n\nThe cases：(the court overturned) → said：(that if a business was shipping → a customer's purchase → to a state：(where the business didn't have → a physical presence：(such as a warehouse or office)) → the business didn't have to collect → sales tax for the state).\n\nCustomers were generally responsible：(for paying the sales tax：(to the state themselves))：(if they weren't charged it) // but most didn't realize：(they owed it) + few paid.\n\n### 第4段\n\nJustice Anthony Kennedy wrote：(that the previous decisions were flawed).\n\n\"Each year → the physical presence rule → becomes further removed：(from economic reality) + results in：(significant revenue losses：(to the States))\" → he wrote：(in an opinion：(joined by four other justices)).\n\nKennedy wrote：(that the rule → \"limited states' ability：(to seek long-term prosperity) + has prevented：(market participants：(from competing：(on an even playing field)))\").\n\n### 第5段\n\nThe ruling is a victory：(for big chains：(with a presence in many states))：(since they usually collect → sales tax on online purchases already).\n\nNow → rivals will be charging sales tax：(where they hadn't before).\n\nBig chains have been collecting → sales tax nationwide：(because they typically have → physical stores：(in whatever state：(a purchase is being shipped to))).\n\nAmazon.com：(with its network of warehouses) → also collects sales tax：(in every state that charges it) // though third-party sellers：(who use the site) → don't have to.\n\n### 第6段\n\nUntil now → many sellers：(that have a physical presence：(in only a single state or a few states)) → have been able to avoid：(charging sales taxes)：(when they ship：(to addresses outside those states)).\n\nSellers：(that use eBay and Etsy：(which provide platforms：(for smaller sellers))) → also haven't been collecting：(sales tax nationwide).\n\nUnder the ruling Thursday → states can pass laws：(requiring out-of-state sellers → to collect the state's sales tax：(from customers) + send it to the state).\n\n### 第7段\n\nRetail trade groups → praised the ruling → saying：(it levels the playing field：(for local and online businesses)).\n\nThe losers → said retail analyst Neil Saunders → are online-only retailers：(especially smaller ones).\n\nThose retailers → may face headaches：(complying with：(various state sales tax laws)).\n\nThe Small Business & Entrepreneurship Council：(advocacy group) → said in a statement：(\"Small businesses and internet entrepreneurs → are not well served at all：(by this decision)\").","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>States will be able to force → more people to pay sales tax：(when they make online purchases)：(under a Supreme Court decision Thursday：(that will leave shoppers：(with lighter wallets) // but is a big financial win：(for states))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>The Supreme Court&#39;s opinion Thursday → overruled a pair of decades-old decisions：(that states said → cost them billions of dollars：(in lost revenue annually)).\u003c/p>\n\u003cp>The decisions made it more difficult：(for states to collect sales tax：(on certain online purchases)).\u003c/p>\n\u003ch3>第3段\u003c/h s：(for smaller sellers))) → also haven&#39;t been collecting：(sales tax nationwide).\u003c/p>\n\u003cp>Under the ruling Thursday → states can pass laws：(requiring out-of-state sellers → to collect the state&#39;s sales tax：(from customers) + send it to the state).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>Retail trade groups → praised the ruling → saying：(it levels the playing field：(for local and online businesses)).\u003c/p>\n\u003cp>The losers → said retail analyst Neil Saunders → are online-only retailers：(especially smaller ones).\u003c/p>\n\u003cp>Those retailers → may face headaches：(complying with：(various state sales tax laws)).\u003c/p>\n\u003cp>The Small Business &amp; Entrepreneurship Council：(advocacy group) → said in a statement：(&quot;Small businesses and internet entrepreneurs → are not well served at all：(by this decision)&quot;).\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n各州将能够强制 → 更多人支付销售税：(当他们进行网上购买时)：(根据最高法院周四的裁决：(这将让购物者：(钱包变轻) // 但是一个巨大的财政胜利：(对各州来说)))。\n\n### 第2段\n\n最高法院周四的意见 → 推翻了一对几十年前的判决：(各州表示 → 让他们损失了数十亿美元：(在每年的收入损失中))。\n\n这些判决使得更加困难：(对各州征收销售税：(在某些网上购买上))。\n\n### 第3段\n\n案例：(法院推翻的) → 说明：(如果一个企业正在运送 → 客户的购买物品 → 到一个州：(在那里企业没有 → 实体存在：(比如仓库或办公室)) → 企业不必征收 → 该州的销售税)。\n\n顾客通常负责：(支付销售税：(给州政府自己))：(如果他们没有被收取) // 但大多数人没有意识到：(他们欠税) + 很少有人支付。\n\n### 第4段\n\n大法官安东尼·肯尼迪写道：(之前的判决是有缺陷的)。\n\n\"每年 → 实体存在规则 → 变得更加脱离：(经济现实) + 导致：(重大收入损失：(对各州来说))\" → 他写道：(在一份意见中：(其他四位大法官加入))。\n\n肯尼迪写道：(该规则 → \"限制了各州的能力：(寻求长期繁荣) + 阻止了：(市场参与者：(竞争：(在一个公平的竞争环境中)))\")。\n\n### 第5段\n\n这项裁决是一个胜利：(对大型连锁店：(在许多州有存在的))：(因为他们通常已经征收 → 网上购买的销售税)。\n\n现在 → 竞争对手将征收销售税：(在他们以前没有的地方)。\n\n大型连锁店一直在征收 → 全国范围的销售税：(因为他们通常有 → 实体店：(在任何州：(购买物品被运送到的地方)))。\n\n亚马逊：(凭借其仓库网络) → 也征收销售税：(在每个收取销售税的州) // 尽管第三方卖家：(使用该网站的) → 不必征收。\n\n### 第6段\n\n直到现在 → 许多卖家：(有实体存在的：(只在单一州或几个州)) → 已经能够避免：(收取销售税)：(当他们运送：(到这些州以外的地址))。\n\n卖家：(使用eBay和Etsy的：(这些平台提供：(给较小的卖家))) → 也没有征收：(全国范围的销售税)。\n\n根据周四的裁决 → 各州可以通过法律：(要求州外卖家 → 征收该州的销售税：(从顾客那里) + 将其发送给州政府)。\n\n### 第7段\n\n零售贸易团体 → 赞 州或少数几个州设有实体；直到现在，这些卖家向上述州以外的地址运货时，一直能够不收取销售税。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-4\">\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>这些卖家此前能够不收取销售税。\u003c/p>\n\u003c/blockquote>\n\u003cp>把时间界限放到开头，让读者知道说的是新裁决之前的安排。卖家只在哪些州有实体放在卖家前，向外州运货作为条件放在不收税前；“这些州”始终指卖家有实体的那些州。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>直到现在，许多只在一个州或少数几个州设有实体的卖家，在往这些州以外的地址运送商品时，一直能够不收取销售税。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-5\">\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“有实体存在的只在单一州”整理成“只在单一州或几个州有实体存在的卖家”，避免范围修饰错位。\u003c/p>\n\u003cp>用“一直能够”保留原来持续适用的制度条件，不能润色成卖家已经逃掉全部税款。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>直到现在，许多只在单一州或几个州有实体存在的卖家，在向这些州以外的地址运送商品时，一直能够避免收取销售税。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"40题 · 题干、题型与核心出处","level":2,"raw":"## 40题\n\n**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n在处理最高法院周四这项决定时，作者采用了怎样的写法？\n\n这是全文写作方式题，要求判断作者主要怎样展开论述。这里仍把每个选项放回各段功能检查，不把某个局部细节当成整篇写法。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **presents its main points with conflicting views on them**\n\n呈现它的主要内容，并给出对这些内容相互冲突的看法\n\nB. **gives a factual account of it and discusses its consequences**\n\n对它作事实性的介绍，并讨论它的后果\n\nC. **cites some cases related to it and analyzes their implications**\n\n引用一些与它有关的案件，并分析这些案件的含义\n\nD. **describes the long and complicated process of its making**\n\n描述它形成过程中漫长而复杂的过程\n\n### 用写作视角检查全文写法\n\n本题用同样的写作视角检查全文的展开方式，也就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。 | 先说发生了什么和谁受影响 |\n| 第2段 | 回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。 | 回头解释原来是什么情况 |\n| 第3段 | 解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。 | 再把原来的做法说清楚 |\n| 第4段 | 引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。 | 接着说原来的做法为什么要改 |\n| 第5段 | 具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。 | 先说一种人会受到什么影响 |\n| 第6段 | 具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。 | 再说另一种人会受到什么影响 |\n| 第7段 | 以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。 | 最后说各方分别有什么反应 |","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"question":"40","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003cp>在处理最高法院周四这项决定时，作者采用了怎样的写法？\u003c/p>\n\u003cp>这是全文写作方式题，要求判断作者主要怎样展开论述。这里仍把每个选项放回各段功能检查，不把某个局部细节当成整篇写法。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>presents its main points with conflicting views on them\u003c/strong>\u003c/p>\n\u003cp>呈现它的主要内容，并给出对这些内容相互冲突的看法\u003c/p>\n\u003cp>B. \u003cstrong>gives a factual account of it and discusses its consequences\u003c/strong>\u003c/p>\n\u003cp>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003cp>C. \u003cstrong>cites some cases related to it and analyzes their implications\u003c/strong>\u003c/p>\n\u003cp>引用一些与它有关的案件，并分析这些案件的含义\u003c/p>\n\u003cp>D. \u003cstrong>describes the long and complicated process of its making\u003c/strong>\u003c/p>\n\u003cp>描述它形成过程中漫长而复杂的过程\u003c/p>\n\u003ch3>用写作视角检查全文写法\u003c/h3>\n\u003cp>本题用同样的写作视角检查全文的展开方式，也就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。\u003c/td>\n\u003ctd>先说发生了什么和谁受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。\u003c/td>\n\u003ctd>回头解释原来是什么情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。\u003c/td>\n\u003ctd>再把原来的做法说清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。\u003c/td>\n\u003ctd>接着说原来的做法为什么要改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。\u003c/td>\n\u003ctd>先说一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。\u003c/td>\n\u003ctd>再说另一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。\u003c/td>\n\u003ctd>最后说各方分别有什么反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. presents its main points with conflicting views on them","level":3,"raw":"**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n### A. presents its main points with conflicting views on them\n\n呈现它的主要内容，并给出对这些内容相互冲突的看法","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"A"},"focusId":"focus-q40-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-A-0\">\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003cp>呈现它的主要内容，并给出对这些内容相互冲突的看法\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. presents its main points with conflicting views on them","level":3,"raw":"#### 如果 A 概括了全文写法，文章7段应该怎么写？\n\n如果作者主要采用的写法真的是：\n\n呈现它的主要内容，并给出对这些内容相互冲突的看法\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先交代新裁决内容及受影响群体，再围绕同一征收要求点出双方相反的评价。 | 先说发生了什么和谁受影响 |\n| 第2段 | 回顾旧判决时，把支持原有税收界限与反对其财政后果的意见并列。 | 回头解释原来是什么情况 |\n| 第3段 | 解释实体存在规则怎样运行，并比较两方对商家代收义务是否合理的看法。 | 再把原来的做法说清楚 |\n| 第4段 | 介绍主张改变规则的理由，再呈现针对这些理由的反驳，使裁决要点与争论持续对应。 | 接着说原来的做法为什么要改 |\n| 第5段 | 说明连锁企业受到的影响，同时并置它们认为公平与对手认为偏袒的相反评价。 | 先说一种人会受到什么影响 |\n| 第6段 | 说明州外卖家新增义务，再比较它们对负担的批评与支持者对责任分担的解释。 | 再说另一种人会受到什么影响 |\n| 第7段 | 归纳各方对同一裁决要点的意见冲突，使观点比较成为全文一贯的组织方式。 | 最后说各方分别有什么反应 |\n\nA 不是完全没有碰到文章：第7段确实有人称赞，也有人说小企业没有受到良好照顾。不过，这些人处在不同的经营位置，作者主要用他们的反应补充说明谁受益、谁受损。前面的第2、3段在解释旧制度怎样收税，第4段引用肯尼迪说明改变它的理由，第5、6段追踪不同商家将承担什么；这些段落没有一直成对摆出针对同一要点的正反论据。A 中 with conflicting views on them 要求意见冲突跟着各个主要内容展开，实际文章只是结尾集中出现不同反应。用最后一段的一个特征来解释前面全部段落，会漏掉正文对规则和后果的连续交代。\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"A"},"focusId":"focus-q40-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-A-0\">\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003cp>呈现它的主要内容，并给出对这些内容相互冲突的看法\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-A-1\">\u003ch4>如果 A 概括了全文写法，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>呈现它的主要内容，并给出对这些内容相互冲突的看法\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先交代新裁决内容及受影响群体，再围绕同一征收要求点出双方相反的评价。\u003c/td>\n\u003ctd>先说发生了什么和谁受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回顾旧判决时，把支持原有税收界限与反对其财政后果的意见并列。\u003c/td>\n\u003ctd>回头解释原来是什么情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>解释实体存在规则怎样运行，并比较两方对商家代收义务是否合理的看法。\u003c/td>\n\u003ctd>再把原来的做法说清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍主张改变规则的理由，再呈现针对这些理由的反驳，使裁决要点与争论持续对应。\u003c/td>\n\u003ctd>接着说原来的做法为什么要改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>说明连锁企业受到的影响，同时并置它们认为公平与对手认为偏袒的相反评价。\u003c/td>\n\u003ctd>先说一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明州外卖家新增义务，再比较它们对负担的批评与支持者对责任分担的解释。\u003c/td>\n\u003ctd>再说另一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>归纳各方对同一裁决要点的意见冲突，使观点比较成为全文一贯的组织方式。\u003c/td>\n\u003ctd>最后说各方分别有什么反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A 不是完全没有碰到文章：第7段确实有人称赞，也有人说小企业没有受到良好照顾。不过，这些人处在不同的经营位置，作者主要用他们的反应补充说明谁受益、谁受损。前面的第2、3段在解释旧制度怎样收税，第4段引用肯尼迪说明改变它的理由，第5、6段追踪不同商家将承担什么；这些段落没有一直成对摆出针对同一要点的正反论据。A 中 with conflicting views on them 要求意见冲突跟着各个主要内容展开，实际文章只是结尾集中出现不同反应。用最后一段的一个特征来解释前面全部段落，会漏掉正文对规则和后果的连续交代。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. gives a factual account of it and discusses its consequences","level":3,"raw":"**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n### B. gives a factual account of it and discusses its consequences\n\n对它作事实性的介绍，并讨论它的后果","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"B"},"focusId":"focus-q40-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-B-0\">\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003cp>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. gives a factual account of it and discusses its consequences","level":3,"raw":"#### 如果 B 概括了全文写法，文章7段应该怎么写？\n\n如果作者主要采用的写法真的是：\n\n对它作事实性的介绍，并讨论它的后果\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 报道裁决扩大网上购物销售税征收范围，并概括购物者和州财政受到的直接影响。 | 先说发生了什么和谁受影响 |\n| 第2段 | 回顾两项被推翻的旧决定，给出新裁决所针对的征税困难和收入损失。 | 回头解释原来是什么情况 |\n| 第3段 | 说明无当地实体企业的代收豁免与顾客自行缴税责任，交代旧规则的实际运转。 | 再把原来的做法说清楚 |\n| 第4段 | 引述改变规则的理由，说明经济现实、财政收入和公平竞争方面的问题。 | 接着说原来的做法为什么要改 |\n| 第5段 | 解释大连锁企业为何受益：它们原已代收，对手此后也需承担相同义务。 | 先说一种人会受到什么影响 |\n| 第6段 | 说明原先免于代收的州外卖家将怎样面对各州新增的法律要求。 | 再说另一种人会受到什么影响 |\n| 第7段 | 汇集零售团体、分析师及小企业的反应，具体呈现裁决对不同经营者的后果。 | 最后说各方分别有什么反应 |\n\nB 的 factual account 能接住第1段对周四决定的报道，也能接住第2、3段对旧决定和收税安排的解释。第4段引用肯尼迪，是让读者知道改变的理由，仍然围绕这项决定交代事实。discusses its consequences 又接住第5、6段：大型连锁企业被称为获胜者，原来不收税的州外卖家今后可能被要求代收。第7段的称赞、失利者和小企业声明继续说明这些后果。这里既不是只列一条新闻，也不是把作者自己的态度放到中心；作者把决定、背景与各方所受影响连着讲出来。B 的两个动作能够分别覆盖文章前半与后半，也能解释为什么结尾会引用不同群体的反应。\n\n判断：\n\n**B 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"B"},"focusId":"focus-q40-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-B-0\">\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003cp>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-B-1\">\u003ch4>如果 B 概括了全文写法，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>报道裁决扩大网上购物销售税征收范围，并概括购物者和州财政受到的直接影响。\u003c/td>\n\u003ctd>先说发生了什么和谁受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回顾两项被推翻的旧决定，给出新裁决所针对的征税困难和收入损失。\u003c/td>\n\u003ctd>回头解释原来是什么情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明无当地实体企业的代收豁免与顾客自行缴税责任，交代旧规则的实际运转。\u003c/td>\n\u003ctd>再把原来的做法说清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>引述改变规则的理由，说明经济现实、财政收入和公平竞争方面的问题。\u003c/td>\n\u003ctd>接着说原来的做法为什么要改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>解释大连锁企业为何受益：它们原已代收，对手此后也需承担相同义务。\u003c/td>\n\u003ctd>先说一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明原先免于代收的州外卖家将怎样面对各州新增的法律要求。\u003c/td>\n\u003ctd>再说另一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>汇集零售团体、分析师及小企业的反应，具体呈现裁决对不同经营者的后果。\u003c/td>\n\u003ctd>最后说各方分别有什么反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B 的 factual account 能接住第1段对周四决定的报道，也能接住第2、3段对旧决定和收税安排的解释。第4段引用肯尼迪，是让读者知道改变的理由，仍然围绕这项决定交代事实。discusses its consequences 又接住第5、6段：大型连锁企业被称为获胜者，原来不收税的州外卖家今后可能被要求代收。第7段的称赞、失利者和小企业声明继续说明这些后果。这里既不是只列一条新闻，也不是把作者自己的态度放到中心；作者把决定、背景与各方所受影响连着讲出来。B 的两个动作能够分别覆盖文章前半与后半，也能解释为什么结尾会引用不同群体的反应。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. cites some cases related to it and analyzes their implications","level":3,"raw":"**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n### C. cites some cases related to it and analyzes their implications\n\n引用一些与它有关的案件，并分析这些案件的含义","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"C"},"focusId":"focus-q40-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-C-0\">\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003cp>引用一些与它有关的案件，并分析这些案件的含义\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. cites some cases related to it and analyzes their implications","level":3,"raw":"#### 如果 C 概括了全文写法，文章7段应该怎么写？\n\n如果作者主要采用的写法真的是：\n\n引用一些与它有关的案件，并分析这些案件的含义\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 以新裁决牵涉的具体诉讼案件起笔，交代案中哪些当事人受到影响。 | 先说发生了什么和谁受影响 |\n| 第2段 | 回到相关旧案，逐一说明案件背景和此前法律处理的情况。 | 回头解释原来是什么情况 |\n| 第3段 | 用案件里的交易及实体经营证据，解释旧规则怎样被用于具体当事人。 | 再把原来的做法说清楚 |\n| 第4段 | 分析相关案件暴露的规则缺陷，以判案结果说明为什么需要改变旧做法。 | 接着说原来的做法为什么要改 |\n| 第5段 | 选取连锁企业卷入的具体案件，解释其结果对这一类企业意味着什么。 | 先说一种人会受到什么影响 |\n| 第6段 | 再分析州外小卖家的案件，比较它给这类经营者带来的不同意义。 | 再说另一种人会受到什么影响 |\n| 第7段 | 汇集各方对所列案件及其法律含义的反应，以案例分析贯穿报道。 | 最后说各方分别有什么反应 |\n\nC 中 cases 可以让我们想到第3段开头的 The cases，以及第2段的两项旧决定。但接下来文章没有讲这些案件各自是谁起诉谁、具体争议是什么，也没有逐案讨论含义，而是马上解释共同的实体存在规则与顾客缴税情况。第5、6段的连锁企业、州外卖家也是受新裁决影响的群体，不是正在逐个分析的诉讼案例。C 把背景中提到旧案件，变成了全文依靠相关案件展开分析，给案件的作用加大了一层。尤其尾段的商家反应，接的是新决定对它们的影响，并非前面各个案件的不同含义。\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"C"},"focusId":"focus-q40-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-C-0\">\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003cp>引用一些与它有关的案件，并分析这些案件的含义\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-C-1\">\u003ch4>如果 C 概括了全文写法，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>引用一些与它有关的案件，并分析这些案件的含义\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以新裁决牵涉的具体诉讼案件起笔，交代案中哪些当事人受到影响。\u003c/td>\n\u003ctd>先说发生了什么和谁受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回到相关旧案，逐一说明案件背景和此前法律处理的情况。\u003c/td>\n\u003ctd>回头解释原来是什么情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>用案件里的交易及实体经营证据，解释旧规则怎样被用于具体当事人。\u003c/td>\n\u003ctd>再把原来的做法说清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>分析相关案件暴露的规则缺陷，以判案结果说明为什么需要改变旧做法。\u003c/td>\n\u003ctd>接着说原来的做法为什么要改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>选取连锁企业卷入的具体案件，解释其结果对这一类企业意味着什么。\u003c/td>\n\u003ctd>先说一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>再分析州外小卖家的案件，比较它给这类经营者带来的不同意义。\u003c/td>\n\u003ctd>再说另一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>汇集各方对所列案件及其法律含义的反应，以案例分析贯穿报道。\u003c/td>\n\u003ctd>最后说各方分别有什么反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C 中 cases 可以让我们想到第3段开头的 The cases，以及第2段的两项旧决定。但接下来文章没有讲这些案件各自是谁起诉谁、具体争议是什么，也没有逐案讨论含义，而是马上解释共同的实体存在规则与顾客缴税情况。第5、6段的连锁企业、州外卖家也是受新裁决影响的群体，不是正在逐个分析的诉讼案例。C 把背景中提到旧案件，变成了全文依靠相关案件展开分析，给案件的作用加大了一层。尤其尾段的商家反应，接的是新决定对它们的影响，并非前面各个案件的不同含义。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. describes the long and complicated process of its making","level":3,"raw":"**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n### D. describes the long and complicated process of its making\n\n描述它形成过程中漫长而复杂的过程","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"D"},"focusId":"focus-q40-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-D-0\">\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003cp>描述它形成过程中漫长而复杂的过程\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. describes the long and complicated process of its making","level":3,"raw":"#### 如果 D 概括了全文写法，文章7段应该怎么写？\n\n如果作者主要采用的写法真的是：\n\n描述它形成过程中漫长而复杂的过程\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先宣布历经漫长程序形成的新裁决，点出当事人在形成过程中受到的影响。 | 先说发生了什么和谁受影响 |\n| 第2段 | 回溯裁决形成的早期法律背景，说明旧判例如何成为长期审议的起点。 | 回头解释原来是什么情况 |\n| 第3段 | 讲清原有收税安排如何进入诉讼程序，说明形成新决定所必须处理的制度步骤。 | 再把原来的做法说清楚 |\n| 第4段 | 展开审议中发现缺陷、争论与修改的关键转折，体现过程复杂。 | 接着说原来的做法为什么要改 |\n| 第5段 | 说明连锁企业在漫长审理各阶段受到的不确定影响及其程序回应。 | 先说一种人会受到什么影响 |\n| 第6段 | 再说明州外卖家在听证、法律论证和等待决定期间受到的影响。 | 再说另一种人会受到什么影响 |\n| 第7段 | 用参与者对整个耗时形成过程的反应收尾，回扣决定如何一步步作成。 | 最后说各方分别有什么反应 |\n\nD 的 process of its making 问的是决定怎样一步步形成，long and complicated 又要求文章突出耗时与复杂性。原文确实有 Thursday、decades-old、Until now 等时间词，但它们分别标记本次决定、旧决定和此前的收税状态，并没有串成审议程序。第4段介绍肯尼迪的理由，也只是说明旧规则存在的问题，没有展开漫长的讨论、修改或表决经过。更明显的是，第5、6段已经在说决定作出以后商家怎样收税，第7段又是相关人对结果的反应。这些段落都在走向决定之后，D 却要求它们围绕决定作出之前的形成过程展开。\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"D"},"focusId":"focus-q40-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-D-0\">\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003cp>描述它形成过程中漫长而复杂的过程\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-D-1\">\u003ch4>如果 D 概括了全文写法，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>描述它形成过程中漫长而复杂的过程\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先宣布历经漫长程序形成的新裁决，点出当事人在形成过程中受到的影响。\u003c/td>\n\u003ctd>先说发生了什么和谁受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回溯裁决形成的早期法律背景，说明旧判例如何成为长期审议的起点。\u003c/td>\n\u003ctd>回头解释原来是什么情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>讲清原有收税安排如何进入诉讼程序，说明形成新决定所必须处理的制度步骤。\u003c/td>\n\u003ctd>再把原来的做法说清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>展开审议中发现缺陷、争论与修改的关键转折，体现过程复杂。\u003c/td>\n\u003ctd>接着说原来的做法为什么要改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>说明连锁企业在漫长审理各阶段受到的不确定影响及其程序回应。\u003c/td>\n\u003ctd>先说一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>再说明州外卖家在听证、法律论证和等待决定期间受到的影响。\u003c/td>\n\u003ctd>再说另一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>用参与者对整个耗时形成过程的反应收尾，回扣决定如何一步步作成。\u003c/td>\n\u003ctd>最后说各方分别有什么反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D 的 process of its making 问的是决定怎样一步步形成，long and complicated 又要求文章突出耗时与复杂性。原文确实有 Thursday、decades-old、Until now 等时间词，但它们分别标记本次决定、旧决定和此前的收税状态，并没有串成审议程序。第4段介绍肯尼迪的理由，也只是说明旧规则存在的问题，没有展开漫长的讨论、修改或表决经过。更明显的是，第5、6段已经在说决定作出以后商家怎样收税，第7段又是相关人对结果的反应。这些段落都在走向决定之后，D 却要求它们围绕决定作出之前的形成过程展开。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"40题结论","level":2,"raw":"### 40题结论\n\n**40. B. gives a factual account of it and discusses its consequences**\n\n对它作事实性的介绍，并讨论它的后果。\n\n据此回到全文，后续题目应保持的理解方向是：\n\n**文章介绍销售税裁决的事实与旧规则背景，再区分州、消费者、大型连锁和小型网商承受的不同后果。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"question":"40","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>40. B. gives a factual account of it and discusses its consequences\u003c/strong>\u003c/p>\n\u003cp>对它作事实性的介绍，并讨论它的后果。\u003c/p>\n\u003cp>据此回到全文，后续题目应保持的理解方向是：\u003c/p>\n\u003cp>\u003cstrong>文章介绍销售税裁决的事实与旧规则背景，再区分州、消费者、大型连锁和小型网商承受的不同后果。\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"36题 · 题干、题型与核心出处","level":2,"raw":"## 36题\n\n> The Supreme Court decision Thursday will ______.  \n> 最高法院周四的决定将会带来什么？\n\n### 题型\n\n裁决影响题。题干要求判断“最高法院周四的决定将会带来什么？”，先按第1、5、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\n>\n> The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, rivals will be charging sales tax where they hadn't before. Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don't have to.\n>\n> Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses. The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches complying with various state sales tax laws. The Small Business & Entrepreneurship Council advocacy group said in a statement, \"Small businesses and internet entrepreneurs are not well served at all by this decision.\"\n\n开篇说明更多购物者缴税、各州受益；后文区分大型连锁企业的胜利与小型纯线上零售商的负担，影响并不相同。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"question":"36","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The Supreme Court decision Thursday will ______.\u003cbr>最高法院周四的决定将会带来什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>裁决影响题。题干要求判断“最高法院周四的决定将会带来什么？”，先按第1、5、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\u003c/p>\n\u003cp>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, rivals will be charging sales tax where they hadn&#39;t before. Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#39;t have to.\u003c/p>\n\u003cp>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses. The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches complying with various state sales tax laws. The Small Business &amp; Entrepreneurship Council advocacy group said in a statement, &quot;Small businesses and internet entrepreneurs are not well served at all by this decision.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>开篇说明更多购物者缴税、各州受益；后文区分大型连锁企业的胜利与小型纯线上零售商的负担，影响并不相同。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. put most online businesses in a dilemma","level":3,"raw":"### A. put most online businesses in a dilemma\n\n> 使大多数网上企业陷入两难境地\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“put most online businesses in a [xxx]”，保留了相应遮挡。当时的定位线索是：A 的 most online businesses 在说网上交易中的企业，原文 more people 在说同一交易中的购物者，两边都涉及网上交易受这项决定影响，因此回看第1段中谁需要缴税的句子。读完全文后，做题模式再经交叉验证排除A，最终选择C。\n\n**错误类型：第一类——歪曲原意。**\n\ndilemma表示两难境地。A的完整命题是大多数网上企业陷入两难，不只是有某些商家受到影响。开篇直接写更多购物者缴税与州财政获益，尚不能产生这个关于企业比例的判断。\n\n放回全文，第5段把大型连锁企业称作赢家，第7段则说小型纯线上零售商面临多州合规麻烦。不同商家的后果不同；A把一部分卖家的负担扩成大多数网上企业共同的两难，C对购物者缴税的概括则直接对应首段。\n\n**命题人借用的原文材料：**\n\n> States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.","context":{"mode":"image","asset":"questions","focus":[250,337,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"36","option":"A"},"focusId":"focus-q36-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-A-0\">\u003cblockquote>\n\u003cp>使大多数网上企业陷入两难境地\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“put most online businesses in a [xxx]”，保留了相应遮挡。当时的定位线索是：A 的 most online businesses 在说网上交易中的企业，原文 more people 在说同一交易中的购物者，两边都涉及网上交易受这项决定影响，因此回看第1段中谁需要缴税的句子。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cst 物者缴税与州财政获益，尚不能产生这个关于企业比例的判断。\u003c/p>\n\u003cp>放回全文，第5段把大型连锁企业称作赢家，第7段则说小型纯线上零售商面临多州合规麻烦。不同商家的后果不同；A把一部分卖家的负担扩成大多数网上企业共同的两难，C对购物者缴税的概括则直接对应首段。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最高法院周四的裁决将会使大多数网上企业陷入两难境地。\u003c/p>\n\u003c/blockquote>\n\u003cp>A 的 most online businesses 在说网上交易中的企业，原文 more people 在说同一交易中的购物者，两边都涉及网上交易受这项决定影响，因此回看第1段中谁需要缴税的句子。\u003c/p>\n\u003cp>dilemma表示两难境地。A的完整命题是大多数网上企业陷入两难，不只是有某些商家受到影响。开篇直接写更多购物者缴税与州财政获益，尚不能产生这个关于企业比例的判断。\u003c/p>\n\u003cp>放回全文，第5段把大型连锁企业称作赢家，第7段则说小型纯线上零售商面临多州合规麻烦。不同商家的后果不同；A把一部分卖家的负担扩成大多数网上企业共同的两难，C对购物者缴税的概括则直接对应首段。\u003c/p>\n\u003cp>开篇说明更多购物者缴税、各州受益；后文区分大型连锁企业的胜利与小型纯线上零售商的负担，影响并不相同。\u003c/p>\n\u003cp>若是大多数，后文应围绕普遍受困展开。实际大连锁企业被写作赢家，小型纯线上商家才面临合规麻烦，主体范围和单向负面程度都被放大。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. put most online businesses in a dilemma","level":4,"raw":"#### 写作视角法\n\n原文第1、5、7段是这样写的：\n\n> States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\n>\n> 开篇说明更多购物者缴税、各州受益；后文区分大型连锁企业的胜利与小型纯线上零售商的负担，影响并不相同。\n\n把这一处放回全文，它承担的写作任务是：先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The ruling puts most online businesses in a dilemma.\n>\n> 这项裁决让大多数网上企业陷入两难。\n\n若是大多数，后文应围绕普遍受困展开。实际大连锁企业被写作赢家，小型纯线上商家才面临合规麻烦，主体范围和单向负面程度都被放大。","context":{"mode":"ima 体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The ruling improves the relationship between businesses and state governments.\u003c/p>\n\u003cp>这项裁决改善企业与州政府的关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>财政受益需要钱的流向，关系改善则需要双方态度或合作的材料。文章写收入与合规义务，还出现商家不满，不能用financial win代替关系融洽。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文事实性介绍裁决及后果，应具体区分哪一方付钱、哪一方得益；不能将部分卖家的负担扩大到大多数网上企业。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>better businesses’ relations with states\u003cbr>改善企业与各州的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>financial 限定的是钱，而 relations 说的是双方的关系。第1段交代的受影响一方还是购物者，不能用各州收入增加替换成企业与各州关系变好。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"36题结论","level":2,"raw":"### 36题结论\n\n> **36. C. make more online shoppers pay sales tax**\n\nA：dilemma表示两难境地。\n\nB：原文 pay sales tax 的执行者是 more people，各州得到的是强制更多人缴税的能力。\n\nC：原文 more people 不是随便一种人，后面的网上购物条件把他们限定成购物者。\n\nD：原文 financial win for states 指各州在钱上获益，同一句把另一端写成购物者的钱包变轻。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"question":"36","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>36. C. make more online shoppers pay sales tax\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：dilemma表示两难境地。\u003c/p>\n\u003cp>B：原文 pay sales tax 的执行者是 more people，各州得到的是强制更多人缴税的能力。\u003c/p>\n\u003cp>C：原文 more people 不是随便一种人，后面的网上购物条件把他们限定成购物者。\u003c/p>\n\u003cp>D：原文 financial win for states 指各州在钱上获益，同一句把另一端写成购物者的钱包变轻。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"37题 · 题干、题型与核心出处","level":2,"raw":"## 37题\n\n> It can be learned from Paragraphs 2 and 3 that the overruled decisions ______.  \n> 从第2、3段可以知道，被推翻的那些决定有什么情况？\n\n### 题型\n\n旧裁决信息题。题干要求判断“从第2、3段可以知道，被推翻的那些决定有什么情况？”，先按第2、3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> The Supreme Court's opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually. The decisions made it more difficult for states to collect sales tax on certain online purchases.\n>\n> The cases the court overturned said that if a business was shipping a customer's purchase to a state where the business didn't have a physical presence such as a warehouse or office, the business didn't have to collect sales tax for the state. Customers were generally responsible for paying the sales tax to the state themselves if they weren't charged it, but most didn't realize they owed it and few paid.\n\n各州表示旧决定令它们每年损失数十亿美元；无当地实体的商家不必代收，而顾客虽有缴税责任却很少实际缴纳。","context":{"mode":"image","asset":"questions","focus":[250,753,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"question":"37","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>It can be learned from Paragraphs 2 and 3 that the overruled decisions ______.\u003cbr>从第2、3段可以知道，被推翻的那些决定有什么情况？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>旧裁决信息题。题干要求判断“从第2、3段可以知道，被推翻的那些决定有什么情况？”，先按第2、3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The Supreme Court&#39;s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually. The decisions made it more difficult for states to collect sales tax on certain online purchases.\u003c/p>\n\u003cp>The cases the court overturned said that if a business was shipping a customer&#39;s purchase to a state where the business didn&#39;t have a physical presence such as a warehouse or office, the business didn&#39;t have to collect sales tax for the state. Customers were generally responsible for paying the sales tax to the state themselves if they weren&#39;t charged it, but most didn&#39;t realize they owed it and few paid.\u003c/p>\n\u003c/blockquote>\n\u003cp>各州表示旧决定令它们每年损失数十亿美元；无当地实体的商家不必代收，而顾客虽有缴税责任却很少实际缴纳。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. were widely criticized by online purchasers","level":3,"raw":"### A. were widely criticized by online purchasers\n\n> 受到网上购物者的广泛批评\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A 的 online purchasers 对应第3段的 Customers，都是购买东西的人；但 criticized 还要求他们表达批评，所以回看第3段末句写顾客知道什么、实际做什么。再看第2段 states said，分清提出损失的是谁。\n\n**错误类型：第三类——无中生有。**\n\n原文把 Customers 写成大多不知道自己欠税、也很少缴税的人。第2段 states said 的发言者则是各州，它们说旧决定使自己损失了钱。A 把 online purchasers 放到 criticized 的位置上，让顾客成为广泛表达不满的一方。顾客不知道欠税与州知道自己少收了钱，是两个主体的两种情况；不能把各州的抱怨搬到顾客身上。\n\n顾客这一端写的是不知欠税、很少付款，提出损失的是州。A 将说话的人换成了网上购买者。\n\n**命题人借用的原文材料：**\n\n> Customers were generally responsible for paying the sales tax to the state themselves if they weren't charged it, but most didn't realize they owed it and few paid.","context":{"mode":"image","asset":"questions","focus":[250,847,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"37","option":"A"},"focusId":"focus-q37-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-A-0\">\u003cblockquote>\n\u003cp>受到网上购物者的广泛批评\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A 造成整个电子商务主导市场，增加结果与因果两个环节。征收困难可以解释各州为何认为旧规则不利，却不能单独证明电子商务已取得dominance。\n\n**命题人借用的原文材料：**\n\n> The decisions made it more difficult for states to collect sales tax on certain online purchases.","context":{"mode":"image","asset":"questions","focus":[250,1016,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"37","option":"C"},"focusId":"focus-q37-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-C-0\">\u003cblockquote>\n\u003cp>导致电子商务占据主导地位\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“have led to the [xxx] of e-commerce”，保留了相应遮挡。当时的定位线索是：C 的 e-commerce 是电子商务，对应第2段 certain online purchases 中的网上交易；要看旧决定怎样影响这类交易，就回看第2段最后一句以及第3段企业可以不代收税的规定。读完全文后，做题模式再经交叉验证排除C，最终选择D。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>dominance指主导地位。旧规则确实让某些没有当地实体的商家不必代收销售税，可能形成价格条件上的不同，但第2、3段讲的是税收义务与州收入损失，没有给出电子商务市场份额。\u003c/p>\n\u003cp>C从一种税收安排进一步推出该安排造成整个电子商务主导市场，增加结果与因果两个环节。征收困难可以解释各州为何认为旧规则不利，却不能单独证明电子商务已取得dominance。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The decisions made it more difficult for states to collect sales tax on certain online purchases.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. have led to the dominance of e-commerce","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 第2、3段表明，被推翻的旧裁决导致电子商务占据主导地位。\n\nC 的 e-commerce 是电子商务，对应第2段 certain online purchases 中的网上交易；要看旧决定怎样影响这类交易，就回看第2段最后一句以及第3段企业可以不代收税的规定。\n\ndominance指主导地位。旧规则确实让某些没有当地实体的商家不必代收销售税，可能形成价格条件上的不同，但第2、3段讲的是税收义务与州收入损失，没有给出电子商务市场份额。\n\nC从一种税收安排进一步推出该安排造成整个电子商务主导市场，增加结果与因果两个环节。征收困难可以解释各州为何认为旧规则不利，却不能单独证明电子商务已取得dominance。\n\n各州表示旧决定令它们每年损失数十亿美元；无当地实体的商家不必代收，而顾客虽有缴税责任却很少实际缴纳。\n\n这需要电子商务市场份额及其变化，还需要旧决定与主导地位的因果证据。免于代收可能提供成本优势，但不能据此补成已经占据主导。","context":{"mode":"image","asset":"questions 事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文从旧制度解释新裁决，旧规则的相关问题是州财政损失和征收困难；顾客是否批评、电子商务是否占据主导，需要另外的事实。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>were considered unfavorable by states\u003cbr>被各州认为是不利的\u003c/p>\n\u003c/blockquote>\n\u003cp>D 评价的主体仍是各州，不利的依据就是它们自己提出的金钱损失与征税困难，不需要把顾客或企业的态度搬过来。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"37题结论","level":2,"raw":"### 37题结论\n\n> **37. D. were considered unfavorable by states**\n\nA：原文把 Customers 写成大多不知道自己欠税、也很少缴税的人。\n\nB：states said cost them 中 them 接的是 states，损失数十亿美元的是各州。\n\nC：dominance指主导地位。\n\nD：原文 more difficult for states 把征税困难落在各州身上，各州又明确说自己因此损失数十亿美元。","context":{"mode":"image","asset":"questions","focus":[250,753,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"question":"37","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>37. D. were considered unfavorable by states\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文把 Customers 写成大多不知道自己欠税、也很少缴税的人。\u003c/p>\n\u003cp>B：states said cost them 中 them 接的是 states，损失数十亿美元的是各州。\u003c/p>\n\u003cp>C：dominance指主导地位。\u003c/p>\n\u003cp>D：原文 more difficult for states 把征税困难落在各州身上，各州又明确说自己因此损失数十亿美元。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"38题 · 题干、题型与核心出处","level":2,"raw":"## 38题\n\n> According to Justice Anthony Kennedy, the physical presence rule has ______.  \n> 根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？\n\n### 题型\n\n人物观点题。题干要求判断“根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Justice Anthony Kennedy wrote that the previous decisions were flawed. \"Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,\" he wrote in an opinion joined by four other justices. Kennedy wrote that the rule \"limited states' ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.\"\n\n肯尼迪列出脱离经济现实、州收入损失，随后用prevented market participants from competing on an even playing field指出公平竞争受损。","context":{"mode":"image","asset":"questions","focus":[250,1262,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"question":"38","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>According to Justice Anthony Kennedy, the physical presence rule has ______.\u003cbr>根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点题。题干要求判断“根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed. &quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices. Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>肯尼迪列出脱离经济现实、州收入损失，随后用prevented market participants from competing on an even playing field指出公平竞争受损。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. hindered economic development","level":3,"raw":"### A. hindered economic development\n\n> 阻碍了经济发展\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“[xxx] economic development”，保留了相应遮挡。当时的定位线索是：A 的 economic development 谈经济发展，原文 economic reality 谈经济现实，都在说经济方面的情况；要判断规则与经济发展究竟是什么关系，还要一起回看他随后说各州长期目标受限制的句子。读完全文后，做题模式再经交叉验证排除A，最终选择B。\n\n**错误类型：第一类——歪曲原意。**\n\nhindered是阻碍，economic development指经济发展。原文的economic reality说规则越来越脱离经济现实，不是在说经济发展本身；这两个带economic的表达不能直接互换。\n\n相比之下，B对应prevented market participants from competing on an even playing field，主体是市场参与者，受损的是公平竞争条件，几乎逐项落在原话上。本题优先选择保留这些明确关系的B，不用一层更宽的推论取代直接改写。\n\n**命题人借用的原文材料：**\n\n> Justice Anthony Kennedy wrote that the previous decisions were flawed.\n>\n> \"Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,\" he wrote in an opinion joined by four other justices.\n>\n> Kennedy wrote that the rule \"limited states' ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.\"","context":{"mode":"image","asset":"questions","focus":[250,1441,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"38","option":"A"},"focusId":"focus-q38-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-A-0\">\u003cblockquote>\n\u003cp>阻碍了经济发展\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“[xxx] economic development”，保留了相应遮挡。当时的定位线索是：A 的 economic development 谈经济发展，原文 economic reality 谈经济现实，都在说经济方面的情况；要判断规则与经济发展究竟是什么关系，还要一起回看他随后说各州长期目标受限制的句子。读完全文后，做题模式再经交叉验证排除A，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>hindered是阻碍，economic development指经济发展。原文的economic reality说规则越来越脱离经济现实，不是在说经济发展本身；这两个带economic的表达不能直接互换。\u003c/p>\n\u003cp>相比之下，B对应prevented market participants from competing on an even playing field，主体是市场参与者，受损的是公平竞争条件，几乎逐项落在原话上。本题优先选择保留这些明确关系的B，不用一层更宽的推论取代直接改写。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed.\u003c/p>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant 争。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The physical presence rule has hindered economic development generally.\u003c/p>\n\u003cp>实体存在规则总体上已经阻碍经济发展。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的economic reality说规则脱离现实；long-term prosperity受limited states’ ability to seek限制。假设把各州追求长期繁荣的能力扩成整体经济发展已经受阻，比直接点明的竞争受损更宽。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文介绍改变旧规则的理由，本题须落到肯尼迪明确说出的后果；公平竞争由even playing field直接支持，不能把寻求繁荣的能力限制扩成所有经济发展的既成结果。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>hindered economic development\u003cbr>阻碍了经济发展\u003c/p>\n\u003c/blockquote>\n\u003cp>相比之下，B对应prevented market participants from competing on an even playing field，主体是市场参与者，受损的是公平竞争条件，几乎逐项落在原话上。本题优先选择保留这些明确关系的B，不用一层更宽的推论取代直接改写。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. harmed fair market competition","level":3,"raw":"### B. harmed fair market competition\n\n> 损害了公平的市场竞争\n\n**做题模式中的状态：** 第一轮B保留。当时的定位线索是：B 的 fair market competition 对应原文 competing on an even playing field，两边都说在公平条件下竞争；再看这件事前面接的是怎样的动作，所以回到第4段的最后一句。\n\n**选项类型：正确同义改写。**\n\n原文 competing on an even playing field 把竞争条件比作平整、公平的比赛场地，前面 has prevented 表示这件事被阻止了。B 的 fair market competition 正在说这种公平竞争，harmed 表示它受到损害。\n\n原文的 prevented 与 B 的 harmed 都让公平竞争受到不利影响；这里比较的是竞争能否公平进行，不是市场中具体哪个名词的译法。\n\n**出处：**\n\n> Justice Anthony Kennedy wrote that the previous decisions were flawed.\n>\n> \"Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,\" he wrote in an opinion joined by four other justices.\n>\n> Kennedy wrote that the rule \"limited states' ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.\"","context":{"mode":"image","asset":"questions","focus":[250,1527,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"38","option":"B"},"focusId":"focus-q38-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-B-0\">\u003cblockquote>\n\u003cp>损害了公平的市场竞争\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B 的 fair market competition 对应原文 competing on an even playing field，两边都说在公平条件下竞争；再看这件事前面接的是怎样的动作，所以回到第4段的最后一句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文 competing on an even playing field 把竞争条件比作平整、公平的比赛场地，前面 has prevented 表示这件事被阻止了。B 的 fair market competition 正在说这种公平竞争，harmed 表示它受到损害。\u003c/p>\n\u003cp>原文的 prevented 与 B 的 harmed 都让公平竞争受到不利影响；这里比较的是竞争能否公平进行，不是市场中具体哪个名词的译法。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed.\u003c/p>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.\u003c/p>\n\u003cp>Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. harmed fair market competition","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\
