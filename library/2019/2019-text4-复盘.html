成州收入损失，并阻止公平竞争。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"38题结论","level":2,"raw":"### 38题结论\n\n> **38. B. harmed fair market competition**\n\nA：hindered是阻碍，economic development指经济发展。\n\nB：原文 competing on an even playing field 把竞争条件比作平整、公平的比赛场地，前面 has prevented 表示这件事被阻止了。\n\nC：原文 revenue losses to the states 把结果写成州的收入损失。\n\nD：原文 revenue losses to the states 是州收入受损，末句又说公平竞争受到阻止，肯尼迪列出的都是这条规则带来的问题。","context":{"mode":"image","asset":"questions","focus":[250,1262,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"question":"38","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>38. B. harmed fair market competition\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：hindered是阻碍，economic development指经济发展。\u003c/p>\n\u003cp>B：原文 competing on an even playing field 把竞争条件比作平整、公平的比赛场地，前面 has prevented 表示这件事被阻止了。\u003c/p>\n\u003cp>C：原文 revenue losses to the states 把结果写成州的收入损失。\u003c/p>\n\u003cp>D：原文 revenue losses to the states 是州收入受损，末句又说公平竞争受到阻止，肯尼迪列出的都是这条规则带来的问题。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"39题 · 题干、题型与核心出处","level":2,"raw":"## 39题\n\n> Who are most likely to welcome the Supreme Court ruling?  \n> 谁最有可能欢迎最高法院的这项裁决？\n\n### 题型\n\n受益者推断题。题干要求判断“谁最有可能欢迎最高法院的这项裁决？”，先按第5、6、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, rivals will be charging sales tax where they hadn't before. Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don't have to.\n>\n> Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states. Sellers that use eBay and Etsy, which provide platforms for smaller sellers, also haven't been collecting sales tax nationwide. Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state's sales tax from customers and send it to the state.\n>\n> Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses. The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches complying with various state sales tax laws. The Small Business & Entrepreneurship Council advocacy group said in a statement, \"Small businesses and internet entrepreneurs are not well served at all by this decision.\"\n\n大型连锁企业此前通常已经代收，新规会让竞争者也代收；其他线上卖家要承担新义务，小企业还担忧遵从各州法律的负担。","context":{"mode":"image","asset":"questions","focus":[250,1857,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"question":"39","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Who are most likely to welcome the Supreme Court ruling?\u003cbr>谁最有可能欢迎最高法院的这项裁决？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>受益者推断题。题干要求判断“谁最有可能欢迎最高法院的这项裁决？”，先按第5、6、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, rivals will be charging sales tax where they hadn&#39;t before. Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#39;t have to.\u003c/p>\n\u003cp>Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states. Sellers that use eBay and Etsy, which provide platforms for smaller sellers, also haven&#39;t been collecting sales tax nationwide. Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state&#39;s sales tax from customers and send it to the state.\u003c/p>\n\u003cp>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses. The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches complying with various state sales tax laws. The Small Business &amp; Entrepreneurship Council advocacy group said in a statement, &quot;Small businesses and internet entrepreneurs are not well served at all by this decision.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>大型连锁企业此前通常已经代收，新规会让竞争者也代收；其他线上卖家要承担新义务，小企业还担忧遵从各州法律的负担。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. Big-chain owners.","level":3,"raw":"### A. Big-chain owners.\n\n> 大型连锁企业的所有者。\n\n**做题模式中的状态：** 第一轮A保留。当时的定位线索是：A 的 Big-chain owners 是大型连锁企业的所有者。粗读后面时看到过大型连锁企业和一场胜利，回到第5段的 big chains，两者指向同一类企业，所以先把第5段从头到尾读完，再看胜利的原因。\n\n**选项类型：正确局部推断。**\n\n现在回到 A，企业的一场胜利与其所有者是否最可能欢迎，直接看第5段首句给出的结果和原因。\n\nA 的人和原文受益的企业是一一对应的，胜利已经给出了正面结果。\n\n**出处：**\n\n> The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already.\n>\n> Now, rivals will be charging sales tax where they hadn't before.\n>\n> Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don't have to.","context":{"mode":"image","asset":"questions","focus":[250,1951,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语 com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don't have to.\n>\n> 大型连锁企业此前通常已经代收，新规会让竞争者也代收；其他线上卖家要承担新义务，小企业还担忧遵从各州法律的负担。\n\n把这一处放回全文，它承担的写作任务是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Big-chain owners benefit when their competitors must collect taxes they already collect.\n>\n> 竞争者也必须代收大连锁早已代收的税时，大连锁所有者从中受益。\n\n第5段先明说victory，再解释rivals新增义务。欢迎是由既有负担被拉平作出的局部推断，没有让所有零售商成为同一利益群体。","context":{"mode":"image","asset":"questions","focus":[250,1951,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"39","option":"A"},"focusId":"focus-q39-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-A-0\">\u003cblockquote>\n\u003cp>大型连锁企业的所有者。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A 的 Big-chain owners 是大型连锁企业的所有者。粗读后面时看到过大型连锁企业和一场胜利，回到第5段的 big chains，两者指向同一类企业，所以先把第5段从头到尾读完，再看胜利的原因。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>现在回到 A，企业的一场胜利与其所有者是否最可能欢迎，直接看第5段首句给出的结果和原因。\u003c/p>\n\u003cp>A 的人和原文受益的企业是一一对应的，胜利已经给出了正面结果。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already.\u003c/p>\n\u003cp>Now, rivals will be charging sales tax where they hadn&#39;t before.\u003c/p>\n\u003cp>Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#39;t have to.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\" 的两类经营者，因此先把第7段读完，再回看声明的评价。\n\n**错误类型：第一类——歪曲原意。**\n\n回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。\n\nSmall businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。\n\n**命题人借用的原文材料：**\n\n> Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses.\n>\n> The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.\n>\n> The Small Business & Entrepreneurship Council advocacy group said in a statement, \"Small businesses and internet entrepreneurs are not well served at all by this decision.\"","context":{"mode":"image","asset":"questions","focus":[250,2120,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"39","option":"C"},"focusId":"focus-q39-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-C-0\">\u003cblockquote>\n\u003cp>互联网创业者。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C 的 Internet entrepreneurs 让我们接着找网上经营者的反应。粗读结尾出现过小企业，回到第7段看，internet entrepreneurs 与 Small businesses 并列，是同一句里的两类经营者，因此先把第7段读完，再回看声明的评价。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。\u003c/p>\n\u003cp>Small businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses.\u003c/p>\n\u003cp>The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.\u003c/p>\n\u003cp>The Small Business &amp; Entrepreneurship Council advocacy group said in a statement, &quot;Small businesses and internet entrepreneurs are not well served at all by this decision.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Internet entrepreneurs.","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 最可能欢迎新裁决的是互联网创业者。\n\nC 的 Internet entrepreneurs 让我们接着找网上经营者的反应。粗读结尾出现过小企业，回到第7段看，internet entrepreneurs 与 Small businesses 并列，是同一句里的两类经营者，因此先把第7段读完，再回看声明的评价。\n\n回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。\n\n原文 Small businesses 后面并列的是 internet entrepreneurs，声明对两者共用 are not well served at all 这一评价。C 的 Internet entrepreneurs 正是其中一类人，不能因为前面说零售业团体称赞，就把这种正面反应分给所有网上经营者。对这类创业者，末句明确说这项决定完全没有好好照顾他们，方向与欢迎相反。\n\nSmall businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。","context":{"mode":"image","asset":"questions","focus":[250,2120,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"39","option":"C"},"focusId":"focus-q39-C-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-C-0\">\u003cblockquote>\n\u003cp>互联网创业者。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C 的 Internet entrepreneurs 让我们接着找网上经营者的反应。粗读结尾出现过小企业，回到第7段看，internet entrepreneurs 与 Small businesses 并列，是同一句里的两类经营者，因此先把第7段读完，再回看声明的评价。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。\u003c/p>\n\u003cp>Small businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses.\u003c/p>\n\u003cp>The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.\u003c/p>\n\u003cp>The Small Business &amp; Entrepreneurship Council advocacy group said in a statement, &quot;Small businesses and internet entrepreneurs are not well served at all by this decision.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id , are online-only retailers, especially smaller ones.\u003c/p>\n\u003cp>The Small Business &amp; Entrepreneurship Council advocacy group said in a statement, &quot;Small businesses and internet entrepreneurs are not well served at all by this decision.&quot;\u003c/p>\n\u003cp>大型连锁企业此前通常已经代收，新规会让竞争者也代收；其他线上卖家要承担新义务，小企业还担忧遵从各州法律的负担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Internet entrepreneurs regard the decision as serving their interests.\u003c/p>\n\u003cp>互联网创业者认为裁决符合自身利益。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段引述的组织明确说创业者not well served。要支持欢迎，后文应出现利益改善的理由，实际反应方向相反。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>讨论后果必须区分受益者和受损者；最可能欢迎的是竞争条件得到拉平、且原已代收的群体，具体身份由第5段的victory确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Internet entrepreneurs.\u003cbr>互联网创业者。\u003c/p>\n\u003c/blockquote>\n\u003cp>Small businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Small retailers.","level":3,"raw":"### D. Small retailers.\n\n> 小型零售商。\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D 的 Small retailers 对应第7段 especially smaller ones，都是体量较小的零售商；这句前面将他们放在 The losers 之后，所以直接回到刚读过的第7段，看他们被归在哪一边。\n\n**错误类型：第一类——歪曲原意。**\n\n原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。D 的 Small retailers 与原文限定的人群范围不同，它只按规模泛称小型零售商，没有保留网上经营这一条件，也没有指出其中哪一类明确受益。后面 headaches 继续说这些网上零售商面临麻烦。这里既不能把所有小型实体店都算成失利者，也不能仅凭 small 这个规模，就把小型零售商选为最可能欢迎的一方；文章明确给出胜利的是大型连锁企业。\n\nespecially smaller ones 加重的是小型网上零售商的不利处境。D 只说 Small retailers，没有给出明确受益的经营身份；A 所指的大型连锁企业则被直接称为获得胜利。\n\n**命题人借用的原文材料：**\n\n> The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.\n>\n> Those retailers may face headaches complying with various state sales tax laws.","context":{"mode":"image","asset":"questions","focus":[250,2206,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"39","option":"D"},"focusId":"focus-q39-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-D-0\">\u003cblockquote>\n\u003cp>小型零售商。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D 的 Small retailers 对应第7段 especially smaller ones，都是体量较小的零售商；这句前面将他们放在 The losers 之后，所以直接回到刚读过的第7段，看他们被归在哪一边。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。D 的 Small retailers 与原文限定的人群范围不同，它只按规模泛称小型零售商，没有保留网上经营这一条件，也没有指出其中哪一类明确受益。后面 headaches 继续说这些网上零售商面临麻烦。这里既不能把所有小型实体店都算成失利者，也不能仅凭 small 这个规模，就把小型零售商选为最可能欢迎的一方；文章明确给出胜利的是大型连锁企业。\u003c/p>\n\u003cp>especially smaller ones 加重的是小型网上零售商的不利处境。D 只说 Small retailers，没有给出明确受益的经营身份；A 所指的大型连锁企业则被直接称为获得胜利。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.\u003c/p>\n\u003cp>Those retailers may face headaches complying with various stat n\u003cp>原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。D 的 Small retailers 与原文限定的人群范围不同，它只按规模泛称小型零售商，没有保留网上经营这一条件，也没有指出其中哪一类明确受益。后面 headaches 继续说这些网上零售商面临麻烦。这里既不能把所有小型实体店都算成失利者，也不能仅凭 small 这个规模，就把小型零售商选为最可能欢迎的一方；文章明确给出胜利的是大型连锁企业。\u003c/p>\n\u003cp>especially smaller ones 加重的是小型网上零售商的不利处境。D 只说 Small retailers，没有给出明确受益的经营身份；A 所指的大型连锁企业则被直接称为获得胜利。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.\u003c/p>\n\u003cp>Those retailers may face headaches complying with various state sales tax laws.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最可能欢迎新裁决的是小型零售商。\u003c/p>\n\u003c/blockquote>\n\u003cp>D 的 Small retailers 对应第7段 especially smaller ones，都是体量较小的零售商；这句前面将他们放在 The losers 之后，所以直接回到刚读过的第7段，看他们被归在哪一边。\u003c/p>\n\u003cp>原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。D 的 Small retailers 与原文限定的人群范围不同，它只按规模泛称小型零售商，没有保留网上经营这一条件，也没有指出其中哪一类明确受益。后面 headaches 继续说这些网上零售商面临麻烦。这里既不能把所有小型实体店都算成失利者，也不能仅凭 small 这个规模，就把小型零售商选为最可能欢迎的一方；文章明确给出胜利的是大型连锁企业。\u003c/p>\n\u003cp>especially smaller ones 加重的是小型网上零售商的不利处境。D 只说 Small retailers，没有给出明确受益的经营身份；A 所指的大型连锁企业则被直接称为获得胜利。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第5、6、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.\u003c/p>\n\u003cp>Those retailers may face headaches complying with various state sales tax laws.\u003c/p>\n\u003cp>大型连锁企业此前通常已经代收，新规会让竞争者也代收；其他线上卖家要承担新义务，小企业还担忧遵从各州法律的负担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Small retailers are the chief beneficiaries of the new compliance requirements.\u003c/p>\n\u003cp>小零售商是新增合规要求的主要受益者。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者尤其点出小型纯线上零售商面临多州合规麻烦，不能把trade groups的称赞一并转给所有小商家。最明确的赢家是已代收的大连锁。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>讨论后果必须区分受益者和受损者；最可能欢迎的是竞争条件得到拉平、且原已代收的群体，具体身份由第5段的victory确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Small retailers.\u003cbr>小型零售商。\u003c/p>\n\u003c/blockquote>\n\u003cp>especially smaller ones 加重的是小型网上零售商的不利处境。D 只说 Small retailers，没有给出明确受益的经营身份；A 所指的大型连锁企业则被直接称为获得胜利。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"39题结论","level":2,"raw":"### 39题结论\n\n> **39. A. Big-chain owners.**\n\nA：现在回到 A，企业的一场胜利与其所有者是否最可能欢迎，直接看第5段首句给出的结果和原因。\n\nB：现在回到 B，把第5段第三方卖家原来的待遇，与第6段州今后可以提出的收税要求放在一起。\n\nC：回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。\n\nD：原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。","context":{"mode":"image","asset":"questions","focus":[250,1857,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 4题目"},"meta":{"question":"39","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>39. A. Big-chain owners.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：现在回到 A，企业的一场胜利与其所有者是否最可能欢迎，直接看第5段首句给出的结果和原因。\u003c/p>\n\u003cp>B：现在回到 B，把第5段第三方卖家原来的待遇，与第6段州今后可以提出的收税要求放在一起。\u003c/p>\n\u003cp>C：回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。\u003c/p>\n\u003cp>D：原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：最高法院裁决的核心内容**（段落1-3事件概述） 裁决影响：各州可强制更多人网购时缴纳销售税（购物者钱包变轻 // 州政府财政胜利）→ 推翻的历史判决：【旧规则：无实体存在不必代收销售税 → 后果：州政府年损失数十亿美元 + 顾客自行缴税但很少人缴纳】\n\n↓（法理依据）\n\n**逻辑层次2：肯尼迪大法官的法理论述**（段落4法律分析） 判决缺陷：实体存在规则脱离经济现实 → 造成州政府重大收入损失 → 负面影响：【限制州寻求长期繁荣 + 阻止市场公平竞争】\n\n↓（影响分析）\n\n**逻辑层次3：对不同企业的影响差异**（段落5-6影响剖析） 赢家：大型连锁店（本已在各州有实体店并征税）+ 亚马逊（仓库网络已覆盖各州）→ 现状改变：【之前：小卖家只在所在州征税 + eBay/Etsy卖家不全国征税 → 现在：州可要求所有州外卖家代收销售税】\n\n↓（各方反应）\n\n**逻辑层次4：各利益相关方的反应**（段落7反应总结） 支持者：零售贸易团体（认为平衡了竞争环境）// 反对者：【纯在线零售商（特别是小型）：面临遵守各州税法的困难 + 小企业委员会：认为决定不利于小企业和网络创业者】\n\n↑（全文主旨）\n\n全文核心观点：最高法院推翻了实体存在规则，允许各州要求所有网络卖家代收销售税，这一裁决有利于大型连锁店和州政府财政，但给小型网络零售商带来合规负担。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：最高法院裁决的核心内容\u003c/strong>（段落1-3事件概述） 裁决影响：各州可强制更多人网购时缴纳销售税（购物者钱包变轻 // 州政府财政胜利）→ 推翻的历史判决：【旧规则：无实体存在不必代收销售税 → 后果：州政府年损失数十亿美元 + 顾客自行缴税但很少人缴纳】\u003c/p>\n\u003cp>↓（法理依据）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：肯尼迪大法官的法理论述\u003c/strong>（段落4法律分析） 判决缺陷：实体存在规则脱离经济现实 → 造成州政府重大收入损失 → 负面影响：【限制州寻求长期繁荣 + 阻止市场公平竞争】\u003c/p>\n\u003cp>↓（影响分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：对不同企业的影响差异\u003c/strong>（段落5-6影响剖析） 赢家：大型连锁店（本已在各州有实体店并征税）+ 亚马逊（仓库网络已覆盖各州）→ 现状改变：【之前：小卖家只在所在州征税 + eBay/Etsy卖家不全国征税 → 现在：州可要求所有州外卖家代收销售税】\u003c/p>\n\u003cp>↓（各方反应）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：各利益相关方的反应\u003c/strong>（段落7反应总结） 支持者：零售贸易团体（认为平衡了竞争环境）// 反对者：【纯在线零售商（特别是小型）：面临遵守各州税法的困难 + 小企业委员会：认为决定不利于小企业和网络创业者】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：最高法院推翻了实体存在规则，允许各州要求所有网络卖家代收销售税，这一裁决有利于大型连锁店和州政府财政，但给小型网络零售商带来合规负担。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n【答案】E. A Collection Gap Behind an Apparent Tax Break\n\n> 看似免税背后的征收缺口\n\n这一部分区分商家没有代收与买家没有义务，解释看似免税为何可能只是征收程序失灵。\n\n先呈现消费者看到的现象：\n\n> An online purchase could appear tax-free when no sales tax was added at checkout.\n\n结账页面未加税，会使购物看起来免税；`appear`提醒这只是外观，还不能据此判断法律义务消失。\n\n随后把商家的征收义务与买家的纳税义务分开：\n\n> This did not necessarily remove the customer’s tax obligation. Instead, the buyer might be expected to report and pay the relevant tax separately.\n\n旧规则可能使商家不用代收，但买家仍可能需要单独申报缴纳。实际执行困难，才形成应缴与实缴之间的断裂。\n\n结尾直接给出概念归纳：\n\n> What looked like a tax exemption was therefore often a gap between a legal obligation and an effective method of collection.\n\n本段并非宣布网购一律免税，而是解释为什么“看似免税”可能只是缺乏有效征收渠道。改变代收者由此成为重要问题。\n\n这一部分的推进关系是：\n\n> 结账未加税 → 商家可能无需代收但买家仍有义务 → 单独申报难落实 → 看似免税实际是征收缺口\n\n`Apparent Tax Break`对应`appear tax-free`与`looked like a tax exemption`；`Collection Gap`对应法定义务和有效征收之间的断裂。标题中的`Apparent`保留了作者的关键区分。\n\n再看最强干扰项B：Making All Internet Purchases Tax-free。\n\n干扰项把结账时没代收扩大为所有网购合法免税，而原文明说客户义务未必消失。它不仅扩大到`All`，还把“征收方式失灵”改成“取消税收”的政策目标。\n\n**41题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】E. A Collection Gap Behind an Apparent Tax Break\u003c/p>\n\u003cblockquote>\n\u003cp>看似免税背后的征收缺口\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分区分商家没有代收与买家没有义务，解释看似免税为何可能只是征收程序失灵。\u003c/p>\n\u003cp>先呈现消费者看到的现象：\u003c/p>\n\u003cblockquote>\n\u003cp>An online purchase could appear tax-free when no sales tax was added at checkout.\u003c/p>\n\u003c/blockquote>\n\u003cp>结账页面未加税，会使购物看起来免税；\u003ccode>appear\u003c/code>提醒这只是外观，还不能据此判断法律义务消失。\u003c/p>\n\u003cp>随后把商家的征收义务与买家的纳税义务分开：\u003c/p>\n\u003cblockquote>\n\u003cp>This did not necessarily remove the customer’s tax obligation. Instead, the buyer might be expected to report and pay the relevant tax separately.\u003c/p>\n\u003c/blockquote>\n\u003cp>旧规则可能使商家不用代收，但买家仍可能需要单独申报缴纳。实际执行困难，才形成应缴与实缴之间的断裂。\u003c/p>\n\u003cp>结尾直接给出概念归纳：\u003c/p>\n\u003cblockquote>\n\u003cp>What looked like a tax exemption was therefore often a gap between a legal obligation and an effective method of collection.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段并非宣布网购一律免税，而是解释为什么“看似免税”可能只是缺乏有效征收渠道。改变代收者由此成为重要问题。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>结账未加税 → 商家可能无需代收但买家仍有义务 → 单独申报难落实 → 看似免税实际是征收缺口\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Apparent Tax Break\u003c/code>对应\u003ccode>appear tax-free\u003c/code>与\u003ccode>looked like a tax exemption\u003c/code>；\u003ccode>Collection Gap\u003c/code>对应法定义务和有效征收之间的断裂。标题中的\u003ccode>Apparent\u003c/code>保留了作者的关键区分。\u003c/p>\n\u003cp>再看最强干扰项B：Making All Internet Purchases Tax-free。\u003c/p>\n\u003cp>干扰项把结账时没代收扩大为所有网购合法免税，而原文明说客户义务未必消失。它不仅扩大到\u003ccode>All\u003c/code>，还把“征收方式失灵”改成“取消税收”的政策目标。\u003c/p>\n\u003cp>\u003cstrong>41题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】F. Public Revenue Lost as Shopping Moves Online\n\n> 购物转向线上造成的公共收入流失\n\n这一部分从州政府角度解释跨境购物如何削弱旧征收办法，并造成保护税基的改革压力。\n\n段首先把同一个缺口换成州政府视角：\n\n> Revenue that was legally due could fail to arrive as consumers shifted spending towards sellers that did not collect it.\n\n消费者把支出转向不代收税的卖家，应有收入却收不上来；讨论对象已从单次结账转为公共财政。\n\n原因是旧规则与商业结构错位：\n\n> A tax system tied to a retailer’s physical footprint became less reliable when a business could reach customers widely without opening local premises.\n\n规则依赖实体场所，企业却可不设本地门店就触达客户，所以线上扩张削弱了原征收办法的覆盖能力。\n\n末句把州的诉求限定为保护税基：\n\n> States sought a way to preserve a revenue base that older collection rules no longer reached effectively as more transactions moved across state lines.\n\n目标是让税制重新触及跨州交易形成的收入，不是单纯惩罚某个网站。段落由收入流失解释改革动力。\n\n这一部分的推进关系是：\n\n> 消费者转向不代收的卖家 → 合法应得税收未到账 → 实体门店标准覆盖不了新交易 → 州寻求保护公共收入基础\n\n`Public Revenue Lost`对应`Revenue...could fail to arrive`；`Shopping Moves Online`由不设本地场所也能触达消费者及更多跨州交易共同说明。标题概括结构变化造成的财政后果。\n\n再看最强干扰项E：A Collection Gap Behind an Apparent Tax Break。\n\n征收缺口仍是起因，但上一段已解释它如何产生；本段新增的是州政府收入流失和保护税基的动机。仅用缺口标题会漏掉明确的政府视角及商业变化带来的财政影响。\n\n**42题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】F. Public Revenue Lost as Shopping Moves Online\u003c/p>\n\u003cblockquote>\n\u003cp>购物转向线上造成的公共收入流失\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分从州政府角度解释跨境购物如何削弱旧征收办法，并造成保护税基的改革压力。\u003c/p>\n\u003cp>段首先把同一个缺口换成州政府视角：\u003c/p>\n\u003cblockquote>\n\u003cp>Revenue that was legally due could fail to arrive as consumers shifted spending towards sellers that did not collect it.\u003c/p>\n\u003c/blockquote>\n\u003cp>消费者把支出转向不代收税的卖家，应有收入却收不上来；讨论对象已从单次结账转为公共财政。\u003c/p>\n\u003cp>原因是旧规则与商业结构错位：\u003c/p>\n\u003cblockquote>\n\u003cp>A tax system tied to a retailer’s physical footprint became less reliable when a business could reach customers widely without opening local premises.\u003c/p>\n\u003c/blockquote>\n\u003cp>规则依赖实体场所，企业却可不设本地门店就触达客户，所以线上扩张削弱了原征收办法的覆盖能力。\u003c/p>\n\u003cp>末句把州的诉求限定为保护税基：\u003c/p>\n\u003cblockquote>\n\u003cp>States sought a way to preserve a revenue base that older collection rules no longer reached effectively as more transactions moved across state lines.\u003c/p>\n\u003c/blockquote>\n\u003cp>目标是让税制重新触及跨州交易形成的收入，不是单纯惩罚某个网站。段落由收入流失解释改革动力。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>消费者转向不代收的卖家 → 合法应得税收未到账 → 实体门店标准覆盖不了新交易 → 州寻求保护公共收入基础\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Public Revenue Lost\u003c/code>对应\u003ccode>Revenue...could fail to arrive\u003c/code>；\u003ccode>Shopping Moves Online\u003c/code>由不设本地场所也能触达消费者及更多跨州交易共同说明。标题概括结构变化造成的财政后果。\u003c/p>\n\u003cp>再看最强干扰项E：A Collection Gap Behind an Apparent Tax Break。\u003c/p>\n\u003cp>征收缺口仍是起因，但上一段已解释它如何产生；本段新增的是州政府收入流失和保护税基的动机。仅用缺口标题会漏掉明确的政府视角及商业变化带来的财政影响。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n【答案】A. Removing an Unequal Burden on Competing Sellers\n\n> 消除竞争商家承担的不平等负担\n\n这一部分从商家竞争角度说明代收义务差异如何影响结账价格，以及改革怎样减少这项偏差。\n\n第一句转入实体零售商的竞争处境：\n\n> They normally collected tax at the point of sale, while a rival selling from outside the state might display a lower checkout total because it did not.\n\n同卖一种商品，一方结账代收税，另一方不代收，总价就可能不同；差异不是商品质量，而是征收义务。\n\n改革直接针对这项优势：\n\n> Requiring more remote sellers to collect tax reduces this particular advantage.\n\n`this particular advantage`回指不代收造成的结账价格优势，不能扩大成取消远程销售的全部优势。\n\n作者随后说明公平并不等于取消竞争：\n\n> The reform does not stop firms competing on price, service or selection.\n\n价格、服务和商品选择的竞争仍然存在；末句只要求其中一个环节少受卖家是否有本地门店影响。\n\n这一部分的推进关系是：\n\n> 本地店必须代收而外州对手可能不代收 → 总价差影响购买选择 → 统一更多卖家的征收义务 → 保留正常竞争并减少规则造成的偏差\n\n`Unequal Burden`对应代收义务不一致；`Competing Sellers`对应本地店和远程对手；`Removing`指减少这项规则差异，而非停止企业竞争。\n\n再看最强干扰项D：Ending Competition between Shops and Websites。\n\n干扰标题主张结束实体与网络竞争，但原文明确`does not stop firms competing`，并列举仍可竞争的三个方面。减少制度偏差与消灭竞争方向不同。\n\n**43题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】A. Removing an Unequal Burden on Competing Sellers\u003c/p>\n\u003cblockquote>\n\u003cp>消除竞争商家承担的不平等负担\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分从商家竞争角度说明代收义务差异如何影响结账价格，以及改革怎样减少这项偏差。\u003c/p>\n\u003cp>第一句转入实体零售商的竞争处境：\u003c/p>\n\u003cblockquote>\n\u003cp>They normally collected tax at the point of sale, while a rival selling from outside the state might display a lower checkout total because it did not.\u003c/p>\n\u003c/blockquote>\n\u003cp>同卖一种商品，一方结账代收税，另一方不代收，总价就可能不同；差异不是商品质量，而是征收义务。\u003c/p>\n\u003cp>改革直接针对这项优势：\u003c/p>\n\u003cblockquote>\n\u003cp>Requiring more remote sellers to collect tax reduces this particular advantage.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>this particular advantage\u003c/code>回指不代收造成的结账价格优势，不能扩大成取消远程销售的全部优势。\u003c/p>\n\u003cp>作者随后说明公平并不等于取消竞争：\u003c/p>\n\u003cblockquote>\n\u003cp>The reform does not stop firms competing on price, service or selection.\u003c/p>\n\u003c/blockquote>\n\u003cp>价格、服务和商品选择的竞争仍然存在；末句只要求其中一个环节少受卖家是否有本地门店影响。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>本地店必须代收而外州对手可能不代收 → 总价差影响购买选择 → 统一更多卖家的征收义务 → 保留正常竞争并减少规则造成的偏差\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Unequal Burden\u003c/code>对应代收义务不一致；\u003ccode>Competing Sellers\u003c/code>对应本地店和远程对手；\u003ccode>Removing\u003c/code>指减少这项规则差异，而非停止企业竞争。\u003c/p>\n\u003cp>再看最强干扰项D：Ending Competition between Shops and Websites。\u003c/p>\n\u003cp>干扰标题主张结束实体与网络竞争，但原文明确\u003ccode>does not stop firms competing\u003c/code>，并列举仍可竞争的三个方面。减少制度偏差与消灭竞争方向不同。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】G. The Uneven Cost of Complying with the New Rule\n\n> 遵守新规则的成本并不均等\n\n这一部分比较大小商家的既有系统和人力，说明同一征收规则为何造成不同适应成本。\n\n首句直接提出本段的区别：\n\n> A more even collection rule does not produce an even adjustment cost.\n\n征收规则更平等，不保证适应规则的成本也平等；后面两类商家正是这个判断的例证。\n\n大型连锁与小型网商形成对照：\n\n> A large chain already collecting tax in many states may have staff and software capable of handling the change.\n\n大型商家已有人员和系统，小型网商却可能首次应付跨辖区登记、税率和申报。区别来自既有能力与经营规模，而不是小企业被赋予了另一套基本原则。\n\n最后用两种工作性质概括差异：\n\n> The size and previous tax practices of a seller shape whether the new obligation is a routine extension of existing work or a substantial new burden.\n\n已有代收流程的延伸与全新的重负担，说明同一法律变化在不同商家身上的执行后果不同。\n\n这一部分的推进关系是：\n\n> 规则更平等未必成本更平等 → 大型企业已有人员系统 → 小网商面临新程序 → 既有税务实践决定调整负担\n\n`Uneven Cost`对应大型和小型商家的不同适应负担；`Complying with the New Rule`对应登记、税率、申报义务，而不是商品本身多缴了多少税。\n\n再看最强干扰项A：Removing an Unequal Burden on Competing Sellers。\n\n消除竞争负担差异是改革理由，本段却用`does not`转向执行成本仍不均等的保留。只用公平竞争标题，会把对改革后果的细分误读为再次赞同改革的一般原则。\n\n**44题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】G. The Uneven Cost of Complying with the New Rule\u003c/p>\n\u003cblockquote>\n\u003cp>遵守新规则的成本并不均等\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分比较大小商家的既有系统和人力，说明同一征收规则为何造成不同适应成本。\u003c/p>\n\u003cp>首句直接提出本段的区别：\u003c/p>\n\u003cblockquote>\n\u003cp>A more even collection rule does not produce an even adjustment cost.\u003c/p>\n\u003c/blockquote>\n\u003cp>征收规则更平等，不保证适应规则的成本也平等；后面两类商家正是这个判断的例证。\u003c/p>\n\u003cp>大型连锁与小型网商形成对照：\u003c/p>\n\u003cblockquote>\n\u003cp>A large chain already collecting tax in many states may have staff and software capable of handling the change.\u003c/p>\n\u003c/blockquote>\n\u003cp>大型商家已有人员和系统，小型网商却可能首次应付跨辖区登记、税率和申报。区别来自既有能力与经营规模，而不是小企业被赋予了另一套基本原则。\u003c/p>\n\u003cp>最后用两种工作性质概括差异：\u003c/p>\n\u003cblockquote>\n\u003cp>The size and previous tax practices of a seller shape whether the new obligation is a routine extension of existing work or a substantial new burden.\u003c/p>\n\u003c/blockquote>\n\u003cp>已有代收流程的延伸与全新的重负担，说明同一法律变化在不同商家身上的执行后果不同。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>规则更平等未必成本更平等 → 大型企业已有人员系统 → 小网商面临新程序 → 既有税务实践决定调整负担\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Uneven Cost\u003c/code>对应大型和小型商家的不同适应负担；\u003ccode>Complying with the New Rule\u003c/code>对应登记、税率、申报义务，而不是商品本身多缴了多少税。\u003c/p>\n\u003cp>再看最强干扰项A：Removing an Unequal Burden on Competing Sellers。\u003c/p>\n\u003cp>消除竞争负担差异是改革理由，本段却用\u003ccode>does not\u003c/code>转向执行成本仍不均等的保留。只用公平竞争标题，会把对改革后果的细分误读为再次赞同改革的一般原则。\u003c/p>\n\u003cp>\u003cstrong>44题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】C. Making Fair Collection Practical for Small Firms\n\n> 让公平征税也能为小企业实际执行\n\n这一部分在保留公平征收目标的同时，提出使小企业也能遵从的操作办法。\n\n段首提出需要同时满足的两个目标：\n\n> The challenge is to preserve fair collection without making participation impractical for small firms.\n\n既保留公平征收，又不让小企业难以执行；不是在公平与豁免之间简单二选一。\n\n随后给出针对操作负担的具体办法：\n\n> Clear guidance, usable filing systems and coordination among jurisdictions can reduce the work involved in meeting an obligation.\n\n指引、申报系统和跨辖区协调分别缓解不懂规则、难以办理和程序差异；它们回应上段的小商家执行成本，而非取消纳税。\n\n最后一句说明公平怎样落地：\n\n> Equal treatment is more credible when the route to compliance is intelligible to businesses with limited staff as well as to national chains.\n\n人员少的企业也能理解遵从路径，平等待遇才更可信。因此本段重心从原则推进到可执行性。\n\n这一部分的推进关系是：\n\n> 保留公平征收目标 → 通过指引、系统和协调减轻操作负担 → 不等于永久免税 → 使小企业也能理解并执行规则\n\n`Fair Collection`对应保留应收税款；`Practical for Small Firms`对应可用申报系统、清楚指引和有限人员也能遵从。标题完整保留两个必须兼顾的目标。\n\n再看最强干扰项B：Making All Internet Purchases Tax-free。\n\n简化程序可能被误当减免税款，但本段明确说`rather than grant every remote seller a permanent exemption`。它改进怎样履行义务，没有让所有网购永久免税。\n\n**45题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】C. Making Fair Collection Practical for Small Firms\u003c/p>\n\u003cblockquote>\n\u003cp>让公平征税也能为小企业实际执行\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分在保留公平征收目标的同时，提出使小企业也能遵从的操作办法。\u003c/p>\n\u003cp>段首提出需要同时满足的两个目标：\u003c/p>\n\u003cblockquote>\n\u003cp>The challenge is to preserve fair collection without making participation impractical for small firms.\u003c/p>\n\u003c/blockquote>\n\u003cp>既保留公平征收，又不让小企业难以执行；不是在公平与豁免之间简单二选一。\u003c/p>\n\u003cp>随后给出针对操作负担的具体办法：\u003c/p>\n\u003cblockquote>\n\u003cp>Clear guidance, usable filing systems and coordination among jurisdictions can reduce the work involved in meeting an obligation.\u003c/p>\n\u003c/blockquote>\n\u003cp>指引、申报系统和跨辖区协调分别缓解不懂规则、难以办理和程序差异；它们回应上段的小商家执行成本，而非取消纳税。\u003c/p>\n\u003cp>最后一句说明公平怎样落地：\u003c/p>\n\u003cblockquote>\n\u003cp>Equal treatment is more credible when the route to compliance is intelligible to businesses with limited staff as well as to national chains.\u003c/p>\n\u003c/blockquote>\n\u003cp>人员少的企业也能理解遵从路径，平等待遇才更可信。因此本段重心从原则推进到可执行性。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>保留公平征收目标 → 通过指引、系统和协调减轻操作负担 → 不等于永久免税 → 使小企业也能理解并执行规则\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Fair Collection\u003c/code>对应保留应收税款；\u003ccode>Practical for Small Firms\u003c/code>对应可用申报系统、清楚指引和有限人员也能遵从。标题完整保留两个必须兼顾的目标。\u003c/p>\n\u003cp>再看最强干扰项B：Making All Internet Purchases Tax-free。\u003c/p>\n\u003cp>简化程序可能被误当减免税款，但本段明确说\u003ccode>rather than grant every remote seller a permanent exemption\u003c/code>。它改进怎样履行义务，没有让所有网购永久免税。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 引出跨州网购与实体场所征税标准的争议 |\n| B | 针对执行成本提出简化协调，使不同能力商家都可遵从 |\n| C | 比较大商家既有能力与小网商的新负担 |\n| D | 解释旧规则，区分商家代收义务与买家纳税义务 |\n| E | 分析缺口造成的财政和竞争后果，形成改变规则的压力 |\n| F | 介绍规则变化，并提示卖家原有征收实践影响不同 |\n| G | 说明买家单独申报难落实，形成日益扩大的征收缺口 |\n| H | 兼顾公平、公共收入和可执行性，收束改革评价 |\n\n全文推进：\n\n> 引出跨州网购与实体场所征税标准的争议 → 解释旧规则，区分商家代收义务与买家纳税义务 → 说明买家单独申报难落实，形成日益扩大的征收缺口 → 分析缺口造成的财政和竞争后果，形成改变规则的压力 → 介绍规则变化，并提示卖家原有征收实践影响不同 → 比较大商家既有能力与小网商的新负担 → 针对执行成本提出简化协调，使不同能力商家都可遵从 → 兼顾公平、公共收入和可执行性，收束改革评价\n\n完整顺序：\n\n**A → D → G → E → F → C → B → H**\n\n41—45：D、G、F、C、B。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>引出跨州网购与实体场所征税标准的争议\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>针对执行成本提出简化协调，使不同能力商家都可遵从\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>比较大商家既有能力与小网商的新负担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>解释旧规则，区分商家代收义务与买家纳税义务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>分析缺口造成的财政和竞争后果，形成改变规则的压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>介绍规则变化，并提示卖家原有征收实践影响不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>说明买家单独申报难落实，形成日益扩大的征收缺口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>兼顾公平、公共收入和可执行性，收束改革评价\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>引出跨州网购与实体场所征税标准的争议 → 解释旧规则，区分商家代收义务与买家纳税义务 → 说明买家单独申报难落实，形成日益扩大的征收缺口 → 分析缺口造成的财政和竞争后果，形成改变规则的压力 → 介绍规则变化，并提示卖家原有征收实践影响不同 → 比较大商家既有能力与小网商的新负担 → 针对执行成本提出简化协调，使不同能力商家都可遵从 → 兼顾公平、公共收入和可执行性，收束改革评价\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → G → E → F → C → B → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、G、F、C、B。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → G的关系。\n\n先看前段A的结尾：\n\n> The dispute began with whether the absence of a physical business location should continue to determine the seller’s duty to collect tax.\n\n再看候选D的开头：\n\n> Under the older rule, that absence could free the seller from collecting the state’s sales tax at checkout.\n\nA最后问`absence of a physical business location`是否还应决定征收义务。本段`that absence`回指没有实体场所，并说明旧制度的答案：卖家可能免于结账代收，正好把争议背景具体化。\n\n`however`接着否定一种常见等同：商家不代收，不代表买家义务消失。段中提出`a separate reporting process`，末句明确这是卖家征收责任与买家税款责任的区别。\n\nD段最终落在：\n\n> This distinction between the seller’s collection duty and the buyer’s liability is essential to understanding what followed.\n\n后段G的开头是：\n\n> The separate process often failed to turn the buyer’s liability into an actual payment.\n\n后段首句`The separate process`正承接买家另行申报这一程序，然后解释程序为什么常收不到钱。先建立法律区别，才能说明制度在执行层面哪里失灵。\n\n这三段的局部推进是：\n\n> 引出跨州网购与实体场所征税标准的争议 → 解释旧规则，区分商家代收义务与买家纳税义务 → 说明买家单独申报难落实，形成日益扩大的征收缺口\n\n再检验容易混淆的候选F。它的开头是：\n\n> The change in rule removed the old physical-presence restriction as the governing standard for collection duties.\n\n新规则段也提实体场所，但开头就是`The change in rule`，预设旧规则及其问题已经交代。A只提出争议，直接接改变后的结果，会缺少买家另行申报与征收缺口的来由。\n\n**41题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → G的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The dispute began with whether the absence of a physical business location should continue to determine the seller’s duty to collect tax.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Under the older rule, that absence could free the seller from collecting the state’s sales tax at checkout.\u003c/p>\n\u003c/blockquote>\n\u003cp>A最后问\u003ccode>absence of a physical business location\u003c/code>是否还应决定征收义务。本段\u003ccode>that absence\u003c/code>回指没有实体场所，并说明旧制度的答案：卖家可能免于结账代收，正好把争议背景具体化。\u003c/p>\n\u003cp>\u003ccode>however\u003c/code>接着否定一种常见等同：商家不代收，不代表买家义务消失。段中提出\u003ccode>a separate reporting process\u003c/code>，末句明确这是卖家征收责任与买家税款责任的区别。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This distinction between the seller’s collection duty and the buyer’s liability is essential to understanding what followed.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The separate process often failed to turn the buyer’s liability into an actual payment.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段首句\u003ccode>The separate process\u003c/code>正承接买家另行申报这一程序，然后解释程序为什么常收不到钱。先建立法律区别，才能说明制度在执行层面哪里失灵。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>引出跨州网购与实体场所征税标准的争议 → 解释旧规则，区分商家代收义务与买家纳税义务 → 说明买家单独申报难落实，形成日益扩大的征收缺口\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The change in rule removed the old physical-presence restriction as the governing standard for collection duties.\u003c/p>\n\u003c/blockquote>\n\u003cp>新规则段也提实体场所，但开头就是\u003ccode>The change in rule\u003c/code>，预设旧规则及其问题已经交代。A只提出争议，直接接改变后的结果，会缺少买家另行申报与征收缺口的来由。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → G → E的关系。\n\n先看前段D的结尾：\n\n> This distinction between the seller’s collection duty and the buyer’s liability is essential to understanding what followed.\n\n再看候选G的开头：\n\n> The separate process often failed to turn the buyer’s liability into an actual payment.\n\n前段明确买家可能通过`a separate reporting process`缴税。本段用`The separate process`接续，并把问题限定为无法将`liability`变成`actual payment`：有义务与实际收到税款之间有落差。\n\n消费者不自行申报、逐人追缴又困难，于是仍属应税交易却没有征收结果。末句说交易向远程卖家转移使`The resulting gap`更显著，这个缺口由前面两项执行困难产生。\n\nG段最终落在：\n\n> The resulting gap grew more significant as more spending moved to remote sellers.\n\n后段E的开头是：\n\n> For states, this growing collection gap meant lost revenue.\n\n已知E的`this growing collection gap`直接概括本段最后的扩大缺口，再分别说明州收入与本地商店竞争受到什么影响。机制先说明，后果随后展开。\n\n这三段的局部推进是：\n\n> 解释旧规则，区分商家代收义务与买家纳税义务 → 说明买家单独申报难落实，形成日益扩大的征收缺口 → 分析缺口造成的财政和竞争后果，形成改变规则的压力\n\n再检验容易混淆的候选C。它的开头是：\n\n> For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar.\n\n大小卖家成本段谈的是新征收义务实施之后的系统和申报负担；E却还在从旧征收缺口推出改革压力。若将成本段放此处，会让新制度先于改革动机出现，也无法提供E的`this growing collection gap`。\n\n**42题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → G → E的关系。\u003c/p>\n\u003cp>先看前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This distinction between the seller’s collection duty and the buyer’s liability is essential to understanding what followed.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The separate process often failed to turn the buyer’s liability into an actual payment.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段明确买家可能通过\u003ccode>a separate reporting process\u003c/code>缴税。本段用\u003ccode>The separate process\u003c/code>接续，并把问题限定为无法将\u003ccode>liability\u003c/code>变成\u003ccode>actual payment\u003c/code>：有义务与实际收到税款之间有落差。\u003c/p>\n\u003cp>消费者不自行申报、逐人追缴又困难，于是仍属应税交易却没有征收结果。末句说交易向远程卖家转移使\u003ccode>The resulting gap\u003c/code>更显著，这个缺口由前面两项执行困难产生。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The resulting gap grew more significant as more spending moved to remote sellers.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>For states, this growing collection gap meant lost revenue.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知E的\u003ccode>this growing collection gap\u003c/code>直接概括本段最后的扩大缺口，再分别说明州收入与本地商店竞争受到什么影响。机制先说明，后果随后展开。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>解释旧规则，区分商家代收义务与买家纳税义务 → 说明买家单独申报难落实，形成日益扩大的征收缺口 → 分析缺口造成的财政和竞争后果，形成改变规则的压力\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar.\u003c/p>\n\u003c/blockquote>\n\u003cp>大小卖家成本段谈的是新征收义务实施之后的系统和申报负担；E却还在从旧征收缺口推出改革压力。若将成本段放此处，会让新制度先于改革动机出现，也无法提供E的\u003ccode>this growing collection gap\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → F → C的关系。\n\n先看前段E的结尾：\n\n> The issue was no longer merely where a seller occupied a building, but how the old standard affected a changed market.\n\n再看候选F的开头：\n\n> The change in rule removed the old physical-presence restriction as the governing standard for collection duties.\n\nE说财政与竞争后果促成`pressure for a different rule`。本段`The change in rule`接住这一改革诉求，说明旧实体存在限制被移除，州可要求更多远程卖家代收。它是对压力的制度回应。\n\n先说明减少不代收带来的价格优势，再用`Yet`提醒卖家起点不同；末句`Existing tax collection practices mattered greatly`把问题从法律原则转向企业已有的执行能力。\n\nF段最终落在：\n\n> Existing tax collection practices mattered greatly.\n\n后段C的开头是：\n\n> For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar.\n\n后段以`already collecting in many states`的大型零售商举例，`those existing practices`回指本段末句。先提示“旧有实践很重要”，再比较谁已有系统、谁需要新建。\n\n这三段的局部推进是：\n\n> 分析缺口造成的财政和竞争后果，形成改变规则的压力 → 介绍规则变化，并提示卖家原有征收实践影响不同 → 比较大商家既有能力与小网商的新负担\n\n再检验容易混淆的候选D。它的开头是：\n\n> Under the older rule, that absence could free the seller from collecting the state’s sales tax at checkout.\n\n旧规则解释段同样谈实体场所，但它回答的是为什么卖家可不代收，无法承接E已经形成的`different rule`诉求。后段的大型卖家`those existing practices`也需要本段先明确提出起点差异。\n\n**43题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → F → C的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The issue was no longer merely where a seller occupied a building, but how the old standard affected a changed market.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The change in rule removed the old physical-presence restriction as the governing standard for collection duties.\u003c/p>\n\u003c/blockquote>\n\u003cp>E说财政与竞争后果促成\u003ccode>pressure for a different rule\u003c/code>。本段\u003ccode>The change in rule\u003c/code>接住这一改革诉求，说明旧实体存在限制被移除，州可要求更多远程卖家代收。它是对压力的制度回应。\u003c/p>\n\u003cp>先说明减少不代收带来的价格优势，再用\u003ccode>Yet\u003c/code>提醒卖家起点不同；末句\u003ccode>Existing tax collection practices mattered greatly\u003c/code>把问题从法律原则转向企业已有的执行能力。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Existing tax collection practices mattered greatly.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段以\u003ccode>already collecting in many states\u003c/code>的大型零售商举例，\u003ccode>those existing practices\u003c/code>回指本段末句。先提示“旧有实践很重要”，再比较谁已有系统、谁需要新建。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>分析缺口造成的财政和竞争后果，形成改变规则的压力 → 介绍规则变化，并提示卖家原有征收实践影响不同 → 比较大商家既有能力与小网商的新负担\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Under the older rule, that absence could free the seller from collecting the state’s sales tax at checkout.\u003c/p>\n\u003c/blockquote>\n\u003cp>旧规则解释段同样谈实体场所，但它回答的是为什么卖家可不代收，无法承接E已经形成的\u003ccode>different rule\u003c/code>诉求。后段的大型卖家\u003ccode>those existing practices\u003c/code>也需要本段先明确提出起点差异。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成F → C → B的关系。\n\n先看前段F的结尾：\n\n> Existing tax collection practices mattered greatly.\n\n再看候选C的开头：\n\n> For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar.\n\n前段以`Existing tax collection practices`收束，当前段的`those existing practices`将该概念落实到已在多州代收的大型商家。它不重新讨论规则对错，而是解释已有经验怎样影响适应成本。\n\n大型商家可能只需扩展现有人手系统，小网商却面对新登记和申报要求；`by contrast`标出比较关系。末句由这两类例子归纳为不同的`administrative costs`。\n\nC段最终落在：\n\n> The same obligation could therefore involve very different administrative costs.\n\n后段B的开头是：\n\n> Reducing these administrative costs need not mean restoring the old exemption from collection.\n\n后段`Reducing these administrative costs`明确回指刚归纳的管理成本，并提出简化措施。只有先说明成本差在哪里，才能讨论降低`these`成本的方法。\n\n这三段的局部推进是：\n\n> 介绍规则变化，并提示卖家原有征收实践影响不同 → 比较大商家既有能力与小网商的新负担 → 针对执行成本提出简化协调，使不同能力商家都可遵从\n\n再检验容易混淆的候选B。它的开头是：\n\n> Reducing these administrative costs need not mean restoring the old exemption from collection.\n\n简化协调段一开始就要降低`these administrative costs`，但前段只是说原有实践重要，尚未列出大小企业的成本对照。本段必须先把不同起点转化为实际负担，解决办法才有具体对象。\n\n**44题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成F → C → B的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Existing tax collection practices mattered greatly.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段以\u003ccode>Existing tax collection practices\u003c/code>收束，当前段的\u003ccode>those existing practices\u003c/code>将该概念落实到已在多州代收的大型商家。它不重新讨论规则对错，而是解释已有经验怎样影响适应成本。\u003c/p>\n\u003cp>大型商家可能只需扩展现有人手系统，小网商却面对新登记和申报要求；\u003ccode>by contrast\u003c/code>标出比较关系。末句由这两类例子归纳为不同的\u003ccode>administrative costs\u003c/code>。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The same obligation could therefore involve very different administrative costs.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing these administrative costs need not mean restoring the old exemption from collection.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段\u003ccode>Reducing these administrative costs\u003c/code>明确回指刚归纳的管理成本，并提出简化措施。只有先说明成本差在哪里，才能讨论降低\u003ccode>these\u003c/code>成本的方法。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>介绍规则变化，并提示卖家原有征收实践影响不同 → 比较大商家既有能力与小网商的新负担 → 针对执行成本提出简化协调，使不同能力商家都可遵从\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing these administrative costs need not mean restoring the old exemption from collection.\u003c/p>\n\u003c/blockquote>\n\u003cp>简化协调段一开始就要降低\u003ccode>these administrative costs\u003c/code>，但前段只是说原有实践重要，尚未列出大小企业的成本对照。本段必须先把不同起点转化为实际负担，解决办法才有具体对象。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成C → B → H的关系。\n\n先看前段C的结尾：\n\n> The same obligation could therefore involve very different administrative costs.\n\n再看候选B的开头：\n\n> Reducing these administrative costs need not mean restoring the old exemption from collection.\n\n前段结尾归纳同一义务造成`very different administrative costs`。本段`Reducing these administrative costs`沿用这一对象，第一句先说明减负不等于恢复旧的代收豁免。\n\n清楚指引、简化申报和辖区协调分别应对小企业资源少、程序多的问题，末句再概括为让能力不等的企业履行共同义务。这与单纯宣布“都应纳税”相比增加了执行路径。\n\nB段最终落在：\n\n> The practical task is to make a common obligation manageable for businesses with unequal capacities.\n\n后段H的开头是：\n\n> A fairer market and a workable tax system should be pursued together.\n\nH将`fairer market`与`workable tax system`并列，并要求避免小商家面对可避免的障碍。本段的可操作办法提供了第二项目标的内容，使最终结论兼顾公平与实际执行。\n\n这三段的局部推进是：\n\n> 比较大商家既有能力与小网商的新负担 → 针对执行成本提出简化协调，使不同能力商家都可遵从 → 兼顾公平、公共收入和可执行性，收束改革评价\n\n再检验容易混淆的候选F。它的开头是：\n\n> The change in rule removed the old physical-presence restriction as the governing standard for collection duties.\n\n规则变化段可说明改革减少竞争偏差，却没有处理成本如何降低。此处重放它会重复“要求代收”，丢掉刚提出的小商家负担问题，H关于`avoidable obstacles`的总结也缺少对应解决思路。\n\n**45题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成C → B → H的关系。\u003c/p>\n\u003cp>先看前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The same obligation could therefore involve very different administrative costs.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Reducing these administrative costs need not mean restoring the old exemption from collection.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段结尾归纳同一义务造成\u003ccode>very different administrative costs\u003c/code>。本段\u003ccode>Reducing these administrative costs\u003c/code>沿用这一对象，第一句先说明减负不等于恢复旧的代收豁免。\u003c/p>\n\u003cp>清楚指引、简化申报和辖区协调分别应对小企业资源少、程序多的问题，末句再概括为让能力不等的企业履行共同义务。这与单纯宣布“都应纳税”相比增加了执行路径。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The practical task is to make a common obligation manageable for businesses with unequal capacities.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A fairer market and a workable tax system should be pursued together.\u003c/p>\n\u003c/blockquote>\n\u003cp>H将\u003ccode>fairer market\u003c/code>与\u003ccode>workable tax system\u003c/code>并列，并要求避免小商家面对可避免的障碍。本段的可操作办法提供了第二项目标的内容，使最终结论兼顾公平与实际执行。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>比较大商家既有能力与小网商的新负担 → 针对执行成本提出简化协调，使不同能力商家都可遵从 → 兼顾公平、公共收入和可执行性，收束改革评价\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The change in rule removed the old physical-presence restriction as the governing standard for collection duties.\u003c/p>\n\u003c/blockquote>\n\u003cp>规则变化段可说明改革减少竞争偏差，却没有处理成本如何降低。此处重放它会重复“要求代收”，丢掉刚提出的小商家负担问题，H关于\u003ccode>avoidable obstacles\u003c/code>的总结也缺少对应解决思路。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **fair competition** | **公平竞争** | **经济消费类：企业经营** | **宏观主题** |\n| public responsibility | 公共责任 | 人生哲理类：责任感、奉献精神 | 宏观主题 |\n| adaptation to change | 适应变化 | 人生哲理类：创新、开拓、与时俱进 | 个人主题 |\n| **balanced judgement** | **平衡判断** | **人生哲理类：批判、独立、全局思维** | **个人主题** |\n| sustainable public finance | 可持续的公共财政 | 经济消费类：经济收入 | 宏观主题 |\n| responsible entrepreneurship | 负责任的创业 | 经济消费类：企业经营 | 宏观主题 |\n| **equal opportunities** | **平等机会** | **人生哲理类：理解、信任、宽容** | **宏观主题** |\n| long-term prosperity | 长期繁荣 | 经济消费类：经济收入 | 宏观主题 |\n| consideration for smaller participants | 对较小参与者的体谅 | 人生哲理类：理解、信任、宽容 | 个人主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>fair competition\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>公平竞争\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>经济消费类：企业经营\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/t iod.** | **图表显示该时期X存在显著损失。** |\n| 图表题 | The figures show that more people are now participating in X. | 数字表明现在有更多人参与X。 |\n| 图表题 | The change is associated with a financial gain for A. | 这一变化与A的经济收益相联系。 |\n| **文本评论题** | **The passage gives a factual account of X and its consequences.** | **文章对X及其后果作了事实性介绍。** |\n| 文本评论题 | The text discusses a rule that has become removed from economic reality. | 文字讨论了一项逐渐脱离经济现实的规定。 |\n| 文本评论题 | The issue concerns how to create an even playing field for A and B. | 问题涉及如何为A与B创造公平竞争环境。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture contrasts the effects of X on A and B.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画对比X对A和B的不同影响。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The picture shows A and B competing on unequal terms.\u003c/td>\n\u003ctd>图画展示A与B在不平等条件下竞争。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene illustrates the difficulties faced by smaller participants.\u003c/td>\n\u003ctd>这一场景展示较小参与者面临的困难。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart indicates significant losses in X over the period.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表显示该时期X存在显著损失。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures show that more people are now participating in X.\u003c/td>\n\u003ctd>数字表明现在有更多人参与X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The change is associated with a financial gain for A.\u003c/td>\n\u003ctd>这一变化与A的经济收益相联系。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage gives a factual account of X and its consequences.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章对X及其后果作了事实性介绍。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text discusses a rule that has become removed from economic reality.\u003c/td>\n\u003ctd>文字讨论了一项逐渐脱离经济现实的规定。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue concerns how to create an even playing field for A and B.\u003c/td>\n\u003ctd>问题涉及如何为A与B创造公平竞争环境。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Removing an Unequal Burden on Competing Sellers\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Making All Internet Purchases Tax-free\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Making Fair Collection Practical for Small Firms\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. Ending Competition between Shops and Websites\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. A Collection Gap Behind an Apparent Tax Break\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Public Revenue Lost as Shopping Moves Online\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. The Uneven Cost of Complying with the New Rule\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>An online purchase could appear tax-free when no sales tax was added at checkout. Under the older physical-presence rule, a seller without the required connection to a state could avoid collecting that state’s sales tax. This did not necessarily remove the customer’s tax obligation. Instead, the buyer might be expected to report and pay the relevant tax separately. Few shoppers found that process convenient, and compliance was difficult to secure. What looked like a tax exemption was therefore often a gap between a legal obligation and an effective method of collection. Changing who must collect the payment can matter even when the underlying purchase was not legally untaxed.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>For state governments, that gap was not a minor detail of shopping convenience. Revenue that was legally due could fail to arrive as consumers shifted spending towards sellers that did not collect it. A tax system tied to a retailer’s physical footprint became less reliable when a business could reach customers widely without opening local premises. The fiscal concern was therefore connected to a change in the structure of commerce, not simply to a wish to penalise a particular website. States sought a way to preserve a revenue base that older collection rules no longer reached effectively as more transactions moved across state lines.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>Retailers with local stores had a different reason to challenge the old arrangement. They normally collected tax at the point of sale, while a rival selling from outside the state might display a lower checkout total because it did not. That difference could steer a buyer towards the remote seller even when the goods and their pre-tax prices were comparable. Requiring more remote sellers to collect tax reduces this particular advantage. The reform does not stop firms competing on price, service or selection. Rather, it makes one part of the competition less dependent on whether the seller happens to maintain a physical location in the buyer’s state.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>A more even collection rule does not produce an even adjustment cost. A large chain already collecting tax in many states may have staff and software capable of handling the change. A small seller operating mainly through the internet may instead face unfamiliar registration procedures, different rates and reporting duties across many jurisdictions. The legal principle can be the same while the administrative effort is very different. This is why approval from established retailers does not show that every online business benefits equally. The size and previous tax practices of a seller shape whether the new obligation is a routine extension of existing work or a substantial new burden.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>The challenge is to preserve fair collection without making participation impractical for small firms. Clear guidance, usable filing systems and coordination among jurisdictions can reduce the work involved in meeting an obligation. These measures address administration rather than grant every remote seller a permanent exemption. They also recognise that a rule’s success depends on whether businesses can understand and carry it out, not only on whether its principle sounds fair. A workable system would collect what is owed while avoiding needless differences in procedure. Equal treatment is more credible when the route to compliance is intelligible to businesses with limited staff as well as to national chains.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>As shopping moved across state borders through the internet, an old sales-tax rule became increasingly controversial. A seller could reach thousands of customers in a state without opening a store there. The dispute began with whether the absence of a physical business location should continue to determine the seller’s duty to collect tax.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Reducing these administrative costs need not mean restoring the old exemption from collection. Clearer guidance and simpler filing arrangements could help a small firm comply without the resources of a national chain. Coordination could also limit unnecessary procedural differences. The practical task is to make a common obligation manageable for businesses with unequal capacities.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>For a large retailer already collecting in many states, those existing practices could make adjustment relatively familiar. Its systems and staff might need extension rather than creation from nothing. Smaller online sellers, by contrast, could face a new set of registrations and reporting requirements. The same obligation could therefore involve very different administrative costs.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Under the older rule, that absence could free the seller from collecting the state’s sales tax at checkout. The customer’s obligation did not necessarily disappear, however. Buyers might still owe tax through a separate reporting process. This distinction between the seller’s collection duty and the buyer’s liability is essential to understanding what followed.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>For states, this growing collection gap meant lost revenue. For local shops, it also meant facing remote competitors whose checkout totals might omit tax. These fiscal and competitive effects increased pressure for a different rule. The issue was no longer merely where a seller occupied a building, but how the old standard affected a changed market.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>The change in rule removed the old physical-presence restriction as the governing standard for collection duties. States could require more remote sellers to collect tax, reducing the advantage created by not adding it at checkout. Yet sellers did not enter the new arrangement from the same starting point. Existing tax collection practices mattered greatly.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>The separate process often failed to turn the buyer’s liability into an actual payment. Many consumers did not report the purchases themselves, and obtaining the money from individual shoppers was difficult. Consequently, a transaction that remained taxable could yield no collected tax. The resulting gap grew more significant as more spending moved to remote sellers.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>A fairer market and a workable tax system should be pursued together. Requiring collection can protect public revenue and reduce a competitive distortion, but complicated implementation can create new difficulties. The durable solution respects both sides: an obligation should reach comparable transactions, and its administration should not impose avoidable obstacles on smaller participants.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2019英语一Text 4重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>be able to\u003c/td>\n\u003ctd>能够\u003c/td>\n\u003ctd>force\u003c/td>\n\u003ctd>v.强迫；迫使\u003c/td>\n\u003ctd>sale
