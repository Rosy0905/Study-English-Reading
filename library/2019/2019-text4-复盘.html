>loser\u003c/td>\n\u003ctd>n.受损的一方\u003c/td>\n\u003ctd>analyst\u003c/td>\n\u003ctd>n.分析师\u003c/td>\n\u003ctd>online-only retailer\u003c/td>\n\u003ctd>仅在线经营的零售商\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>especially\u003c/td>\n\u003ctd>ad.尤其\u003c/td>\n\u003ctd>face headaches\u003c/td>\n\u003ctd>面临麻烦\u003c/td>\n\u003ctd>comply with\u003c/td>\n\u003ctd>遵守\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>various\u003c/td>\n\u003ctd>a.各种各样的\u003c/td>\n\u003ctd>entrepreneurship\u003c/td>\n\u003ctd>n.创业\u003c/td>\n\u003ctd>advocacy group\u003c/td>\n\u003ctd>倡导组织\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>statement\u003c/td>\n\u003ctd>n.声明\u003c/td>\n\u003ctd>internet entrepreneur\u003c/td>\n\u003ctd>互联网创业者\u003c/td>\n\u003ctd>serve\u003c/td>\n\u003ctd>v.有利于\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decision\u003c/td>\n\u003ctd>n.决定\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>States will be able to force / more people to pay sales tax / when they make online purchases / under a Supreme Court decision Thursday / that will leave shoppers / with lighter wallets / but is a big financial win / for states.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>各州将能够强制 / 更多人支付销售税 / 当他们进行网上购买时 / 根据最高法院周四的裁决 / 这将让购物者 / 钱包变轻 / 但是一个巨大的财政胜利 / 对各州来说。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>根据最高法院周四的裁决，各州将能够强制更多人在网上购物时支付销售税。这一裁决将让购物者的钱包变轻，但对各州来说是一个巨大的财政胜利。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>The Supreme Court&#39;s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually. The decisions made it more difficult for states to collect sales tax on certain online purchases.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>The Supreme Court&#39;s opinion Thursday / overruled a pair of decades-old decisions / that states said / cost them billions of dollars / in lost revenue annually.\u003c/p>\n\u003cp>The decisions made it more difficult / for states to collect sales tax / on certain online purchases.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>最高法院周四的意见 / 推翻了一对几十年前的判决 / 各州表示 / 让他们损失了数十亿美元 / 在每年的收入损失中。\u003c/p>\n\u003cp>这些判决使得更加困难 / 对各州征收销售税 / 在某些网上购买上。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>最高法院周四的意见推翻了一对几十年前的判决，各州表示这些判决每年让他们损失了数十亿美元的收入。这些判决使得各州更难对某些网上购买征收销售税。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>The cases the court overturned said that if a business was shipping a customer&#39;s purchase to a state where the business didn&#39;t have a physical presence such as a warehouse or office, the business didn&#39;t have to collect sales tax for the state. Customers were generally responsible for paying the sales tax to the state themselves if they weren&#39;t charged it, but most didn&#39;t realize they owed it and few paid.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>The cases the court overturned / said that / if a business was shipping / a customer&#39;s purchase / to a state / where the business didn&#39;t have / a physical presence / such as a warehouse or office, / the business didn&#39;t have to collect / sales tax for the state.\u003c/p>\n\u003cp>Customers were generally responsible / for paying the sales tax / to the state themselves / if they weren&#39;t charged it, / but most didn&#39;t realize / they owed it / and few paid.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>法院推翻的案例 / 说明 / 如果一个企业正在运送 / 客户的购买物品 / 到一个州 / 在那里企业没有 / 实体存在 / 比如仓库或办公室，/ 企业不必征收 / 该州的销售税。\u003c/p>\n\u003cp>顾客通常负责 / 支付销售税 / 给州政府自己 / 如果他们没有被收取，/ 但大多数人没有意识到 / 他们欠税 / 而且很少有人支付。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>法院推翻的案例规定，如果企业向某个州运送客户的购买物品，但在该州没有仓库或办公室等实体存在，企业就不必为该州征收销售税。如果顾客没有被收取销售税，他们通常要自己向州政府支付，但大多数人没有意识到他们欠税，而且很少有人支付。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Justice Anthony Kennedy wrote that the previous decisions were flawed. &quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices. Kennedy wrote that the rule &quot;limited states&#39; ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.&quot;\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Justice Anthony Kennedy wrote / that the previous decisions were flawed.\u003c/p>\n\u003cp>&quot;Each year / the physical presence rule / becomes further removed / from economic reality / and results in / significant revenue losses / to the States,&quot; / he wrote / in an opinion / joined by four other justices.\u003c/p>\n\u003cp>Kennedy wrote / that the rule / &quot;limited states&#39; ability / to seek long-term prosperity / and has prevented / market participants / from competing / on an even playing field.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>大法官安东尼·肯尼迪写道 / 之前的判决是有缺陷的。\u003c/p>\n\u003cp>&quot;每年 / 实体存在规则 / 变得更加脱离 / 经济现实 / 并导致 / 重大收入损失 / 对各州来说，&quot; / 他写道 / 在一份意见中 / 其他四位大法官加入。\u003c/p>\n\u003cp>肯尼迪写道 / 该规则 / &quot;限制了各州的能力 / 寻求长期繁荣 / 并且阻止了 / 市场参与者 / 竞争 / 在一个公平的竞争环境中。&quot;\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>大法官安东尼·肯尼迪写道，之前的判决是有缺陷的。他在一份有其他四位大法官加入的意见书中写道：&quot;每年实体存在规则都更加脱离经济现实，并给各州造成重大收入损失。&quot;肯尼迪写道，该规则&quot;限制了各州寻求长期繁荣的能力，并阻止了市场参与者在公平的竞争环境中竞争。&quot;\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, rivals will be charging sales tax where they hadn&#39;t before. Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#39;t have to.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>The ruling is a victory / for big chains / with a presence in many states, / since they usually collect / sales tax on online purchases already.\u003c/p>\n\u003cp>Now, / rivals will be charging sales tax / where they hadn&#39;t before.\u003c/p>\n\u003cp>Big chains have been collecting / sales tax nationwide / because they typically have / physical stores / in whatever state / a purchase is being shipped to.\u003c/p>\n\u003cp>Amazon.com, / with its network of warehouses, / also collects sales tax / in every state that charges it, / though third-party sellers / who use the site / don&#39;t have to.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>这项裁决是一个胜利 / 对大型连锁店 / 在许多州有存在的，/ 因为他们通常已经征收 / 网上购买的销售税。\u003c/p>\n\u003cp>现在，/ 竞争对手将征收销售税 / 在他们以前没有的地方。\u003c/p>\n\u003cp>大型连锁店一直在征收 / 全国范围的销售税 / 因为他们通常有 / 实体店 / 在任何州 / 购买物品被运送到的地方。\u003c/p>\n\u003cp>亚马逊，/ 凭借其仓库网络，/ 也征收销售税 / 在每个收取销售税的州，/ 尽管第三方卖家 / 使用该网站的 / 不必征收。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>这项裁决对在许多州都有存在的大型连锁店来说是一个胜利，因为他们通常已经在征收网上购买的销售税了。现在，他们的竞争对手也将在以前不征收的地方征收销售税。大型连锁店一直在全国范围内征收销售税，因为他们通常在购买物品被运送到的任何州都有实体店。亚马逊凭借其仓库网络，也在每个收取销售税的州征收销售税，尽管使用该网站的第三方卖家不必征收。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states. Sellers that use eBay and Etsy, which provide platforms for smaller sellers, also haven&#39;t been collecting sales tax nationwide. Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state&#39;s sales tax from customers and send it to the state.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Until now, / many sellers / that have a physical presence / in only a single state or a few states / have been able to avoid / charging sales taxes / when they ship / to addresses outside those states.\u003c/p>\n\u003cp>Sellers that use eBay and Etsy, / which provide platforms / for smaller sellers, / also haven&#39;t been collecting / sales tax nationwide.\u003c/p>\n\u003cp>Under the ruling Thursday, / states can pass laws / requiring out-of-state sellers / to collect the state&#39;s sales tax / from customers / and send it to the state.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>直到现在，/ 许多卖家 / 有实体存在的 / 只在单一州或几个州 / 已经能够避免 / 收取销售税 / 当他们运送 / 到这些州以外的地址。\u003c/p>\n\u003cp>使用eBay和Etsy的卖家，/ 这些平台提供 / 给较小的卖家，/ 也没有征收 / 全国范围的销售税。\u003c/p>\n\u003cp>根据周四的裁决，/ 各州可以通过法律 / 要求州外卖家 / 征收该州的销售税 / 从顾客那里 / 并将其发送给州政府。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>直到现在，许多只在单一州或几个州有实体存在的卖家，在向这些州以外的地址运送商品时，一直能够避免收取销售税。使用eBay和Etsy这些为较小卖家提供平台的卖家，也没有在全国范围内征收销售税。根据周四的裁决，各州可以通过法律，要求州外卖家从顾客那里征收该州的销售税并将其发送给州政府。\u003c/p>\n\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses. The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches complying with various state sales tax laws. The Small Business &amp; Entrepreneurship Council advocacy group said in a statement, &quot;Small businesses and internet entrepreneurs are not well served at all by this decision.&quot;\u003c/p>\n\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>Retail trade groups / praised the ruling, / saying it levels the playing field / for local and online businesses.\u003c/p>\n\u003cp>The losers, / said retail analyst Neil Saunders, / are online-only retailers, / especially smaller ones.\u003c/p>\n\u003cp>Those retailers / may face headaches / complying with / various state sales tax laws.\u003c/p>\n\u003cp>The Small Business &amp; Entrepreneurship Council / advocacy group / said in a statement, / &quot;Small businesses and internet entrepreneurs / are not well served at all / by this decision.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>零售贸易团体 / 赞扬了这项裁决，/ 说它平衡了竞争环境 / 对本地和在线企业。\u003c/p>\n\u003cp>失败者，/ 零售分析师尼尔·桑德斯说，/ 是纯在线零售商，/ 特别是较小的。\u003c/p>\n\u003cp>这些零售商 / 可能面临头痛 / 遵守 / 各州不同的销售税法。\u003c/p>\n\u003cp>小企业与创业委员会 / 倡导团体 / 在一份声明中说，/ &quot;小企业和互联网创业者 / 完全没有得到很好的服务 / 通过这个决定。&quot;\u003c/p>\n\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>零售贸易团体赞扬了这项裁决，说它为本地和在线企业平衡了竞争环境。零售分析师尼尔·桑德斯说，失败者是纯在线零售商，特别是较小的。这些零售商可能面临遵守各州不同销售税法的麻烦。小企业与创业委员会倡导团体在一份声明中说：&quot;小企业和互联网创业者完全没有从这个决定中得到很好的服务。&quot;\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>States will be able to force → more people to pay sales tax：(when they make online purchases)：(under a Supreme Court decision Thursday：(that will leave shoppers：(with lighter wallets) // but is a big financial win：(for states))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>The Supreme Court&#39;s opinion Thursday → overruled a pair of decades-old decisions：(that states said → cost them billions of dollars：(in lost revenue annually)).\u003c/p>\n\u003cp>The decisions made it more difficult：(for states to collect sales tax：(on certain online purchases)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>The cases：(the court overturned) → said：(that if a business was shipping → a customer&#39;s purchase → to a state：(where the business didn&#39;t have → a physical presence：(such as a warehouse or office)) → the business didn&#39;t have to collect → sales tax for the state).\u003c/p>\n\u003cp>Customers were generally responsible：(for paying the sales tax：(to the state themselves))：(if they weren&#39;t charged it) // but most didn&#39;t realize：(they owed it) + few paid.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Justice Anthony Kennedy wrote：(that the previous decisions were flawed).\u003c/p>\n\u003cp>&quot;Each year → the physical presence rule → becomes further removed：(from economic reality) + results in：(significant revenue losses：(to the States))&quot; → he wrote：(in an opinion：(joined by four other justices)).\u003c/p>\n\u003cp>Kennedy wrote：(that the rule → &quot;limited states&#39; ability：(to seek long-term prosperity) + has prevented：(market participants：(from competing：(on an even playing field)))&quot;).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>The ruling is a victory：(for big chains：(with a presence in many states))：(since they usually collect → sales tax on online purchases already).\u003c/p>\n\u003cp>Now → rivals will be charging sales tax：(where they hadn&#39;t before).\u003c/p>\n\u003cp>Big chains have been collecting → sales tax nationwide：(because they typically have → physical stores：(in whatever state：(a purchase is being shipped to))).\u003c/p>\n\u003cp>Amazon.com：(with its network of warehouses) → also collects sales tax：(in every state that charges it) // though third-party sellers：(who use the site) → don&#39;t have to.\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Until now → many sellers：(that have a physical presence：(in only a single state or a few states)) → have been able to avoid：(charging sales taxes)：(when they ship：(to addresses outside those states)).\u003c/p>\n\u003cp>Sellers：(that use eBay and Etsy：(which provide platforms：(for smaller sellers))) → also haven&#39;t been collecting：(sales tax nationwide).\u003c/p>\n\u003cp>Under the ruling Thursday → states can pass laws：(requiring out-of-state sellers → to collect the state&#39;s sales tax：(from customers) + send it to the state).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>Retail trade groups → praised the ruling → saying：(it levels the playing field：(for local and online businesses)).\u003c/p>\n\u003cp>The losers → said retail analyst Neil Saunders → are online-only retailers：(especially smaller ones).\u003c/p>\n\u003cp>Those retailers → may face headaches：(complying with：(various state sales tax laws)).\u003c/p>\n\u003cp>The Small Business &amp; Entrepreneurship Council：(advocacy group) → said in a statement：(&quot;Small businesses and internet entrepreneurs → are not well served at all：(by this decision)&quot;).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>各州将能够强制 → 更多人支付销售税：(当他们进行网上购买时)：(根据最高法院周四的裁决：(这将让购物者：(钱包变轻) // 但是一个巨大的财政胜利：(对各州来说)))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>最高法院周四的意见 → 推翻了一对几十年前的判决：(各州表示 → 让他们损失了数十亿美元：(在每年的收入损失中))。\u003c/p>\n\u003cp>这些判决使得更加困难：(对各州征收销售税：(在某些网上购买上))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>案例：(法院推翻的) → 说明：(如果一个企业正在运送 → 客户的购买物品 → 到一个州：(在那里企业没有 → 实体存在：(比如仓库或办公室)) → 企业不必征收 → 该州的销售税)。\u003c/p>\n\u003cp>顾客通常负责：(支付销售税：(给州政府自己))：(如果他们没有被收取) // 但大多数人没有意识到：(他们欠税) + 很少有人支付。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>大法官安东尼·肯尼迪写道：(之前的判决是有缺陷的)。\u003c/p>\n\u003cp>&quot;每年 → 实体存在规则 → 变得更加脱离：(经济现实) + 导致：(重大收入损失：(对各州来说))&quot; → 他写道：(在一份意见中：(其他四位大法官加入))。\u003c/p>\n\u003cp>肯尼迪写道：(该规则 → &quot;限制了各州的能力：(寻求长期繁荣) + 阻止了：(市场参与者：(竞争：(在一个公平的竞争环境中)))&quot;)。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>这项裁决是一个胜利：(对大型连锁店：(在许多州有存在的))：(因为他们通常已经征收 → 网上购买的销售税)。\u003c/p>\n\u003cp>现在 → 竞争对手将征收销售税：(在他们以前没有的地方)。\u003c/p>\n\u003cp>大型连锁店一直在征收 → 全国范围的销售税：(因为他们通常有 → 实体店：(在任何州：(购买物品被运送到的地方)))。\u003c/p>\n\u003cp>亚马逊：(凭借其仓库网络) → 也征收销售税：(在每个收取销售税的州) // 尽管第三方卖家：(使用该网站的) → 不必征收。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>直到现在 → 许多卖家：(有实体存在的：(只在单一州或几个州)) → 已经能够避免：(收取销售税)：(当他们运送：(到这些州以外的地址))。\u003c/p>\n\u003cp>卖家：(使用eBay和Etsy的：(这些平台提供：(给较小的卖家))) → 也没有征收：(全国范围的销售税)。\u003c/p>\n\u003cp>根据周四的裁决 → 各州可以通过法律：(要求州外卖家 → 征收该州的销售税：(从顾客那里) + 将其发送给州政府)。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>零售贸易团体 → 赞扬了这项裁决 → 说：(它平衡了竞争环境：(对本地和在线企业))。\u003c/p>\n\u003cp>失败者 → 零售分析师尼尔·桑德斯说 → 是纯在线零售商：(特别是较小的)。\u003c/p>\n\u003cp>这些零售商 → 可能面临头痛：(遵守：(各州不同的销售税法))。\u003c/p>\n\u003cp>小企业与创业委员会：(倡导团体) → 在一份声明中说：(&quot;小企业和互联网创业者 → 完全没有得到很好的服务：(通过这个决定)&quot;)。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第3段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>The cases the court overturned said that if a business was shipping a customer&#39;s purchase to a state where the business didn&#39;t have a physical presence such as a warehouse or office, the business didn&#39;t have to collect sales tax for the state.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>The cases the court overturned / said that / if a business was shipping / a customer&#39;s purchase / to a state / where the business didn&#39;t have / a physical presence / such as a warehouse or office, / the business didn&#39;t have to collect / sales tax for the state.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>法院推翻的案例 / 说明 / 如果一个企业正在运送 / 客户的购买物品 / 到一个州 / 在那里企业没有 / 实体存在 / 比如仓库或办公室，/ 企业不必征收 / 该州的销售税。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把商品要运往的州说完整：\u003c/p>\n\u003cblockquote>\n\u003cp>企业向某个州运送顾客购买的商品，但在该州没有仓库或办公室等实体\u003c/p>\n\u003c/blockquote>\n\u003cp>再把条件与代收税义务合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>在这种情况下，法院推翻的旧判例规定，企业不必为该州代收销售税\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>企业向某个州运送顾客购买的商品，但在该州没有仓库或办公室等实体；在这种情况下，法院推翻的旧判例规定，企业不必为该州代收销售税。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>旧判例规定，符合条件的企业不必代收税。\u003c/p>\n\u003c/blockquote>\n\u003cp>先点出这些是已经被推翻的判例，接着用“如果”引出发货地点与没有实体的条件，最后用“就”落到企业不必代收税。把仓库、办公室放在实体存在前作例子，不要把没有实体理解成企业完全没有经营地点。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>法院推翻的案例说明，如果企业向某个州运送客户购买的商品，并且在那个州没有仓库或办公室这样的实体存在，企业就不必为该州收取销售税。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“客户的购买物品”顺成“客户购买的物品”或原译文的“客户的购买物品”，都不能把客户变成收税的企业。\u003c/p>\n\u003cp>“不必为该州征收”强调企业的代收义务；不要扩大成购物者从此没有纳税义务，后句还专门讨论购物者自行缴税。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>法院推翻的案例规定，如果企业向某个州运送客户的购买物品，但在该州没有仓库或办公室等实体存在，企业就不必为该州征收销售税。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;Each year / the physical presence rule / becomes further removed / from economic reality / and results in / significant revenue losses / to the States,&quot; / he wrote / in an opinion / joined by four other justices.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;每年 / 实体存在规则 / 变得更加脱离 / 经济现实 / 并导致 / 重大收入损失 / 对各州来说，&quot; / 他写道 / 在一份意见中 / 其他四位大法官加入。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把规则造成的两件事并列起来：\u003c/p>\n\u003cblockquote>\n\u003cp>实体存在规则越来越脱离经济现实，并使各州损失大量收入\u003c/p>\n\u003c/blockquote>\n\u003cp>再把说话形式与支持者身份合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>他在一份另外四位大法官共同加入的意见书中写下这一判断\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>实体存在规则越来越脱离经济现实，并使各州损失大量收入；他在一份另外四位大法官共同加入的意见书中写下这一判断。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>他写道，规则脱离现实并造成收入损失。\u003c/p>\n\u003c/blockquote>\n\u003cp>把“在一份意见书中”放到“写道”前，把其他四位大法官的参与作为意见书的说明。引语中先保留每年的发展，再将脱离现实与收入损失并列，收入损失的承担者各州跟在造成之后。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>他在一份另外四位大法官也加入的意见书中写道，实体存在规则每年都更远离经济现实，并造成各州的重大收入损失。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“变得更加脱离”整理成“更加脱离”，保留逐年加剧的变化。\u003c/p>\n\u003cp>“对各州来说的重大收入损失”改为“给各州造成重大收入损失”；不能把参与意见书的四位法官误写成四个州。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>他在一份有其他四位大法官加入的意见书中写道：&quot;每年实体存在规则都更加脱离经济现实，并给各州造成重大收入损失。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Until now, / many sellers / that have a physical presence / in only a single state or a few states / have been able to avoid / charging sales taxes / when they ship / to addresses outside those states.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>直到现在，/ 许多卖家 / 有实体存在的 / 只在单一州或几个州 / 已经能够避免 / 收取销售税 / 当他们运送 / 到这些州以外的地址。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把这一类卖家的经营范围合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>许多卖家只在一个州或少数几个州设有实体\u003c/p>\n\u003c/blockquote>\n\u003cp>再把发货条件与免于代收税接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>直到现在，这些卖家向上述州以外的地址运货时，一直能够不收取销售税\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>许多卖家只在一个州或少数几个州设有实体；直到现在，这些卖家向上述州以外的地址运货时，一直能够不收取销售税。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>这些卖家此前能够不收取销售税。\u003c/p>\n\u003c/blockquote>\n\u003cp>把时间界限放到开头，让读者知道说的是新裁决之前的安排。卖家只在哪些州有实体放在卖家前，向外州运货作为条件放在不收税前；“这些州”始终指卖家有实体的那些州。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>直到现在，许多只在一个州或少数几个州设有实体的卖家，在往这些州以外的地址运送商品时，一直能够不收取销售税。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“有实体存在的只在单一州”整理成“只在单一州或几个州有实体存在的卖家”，避免范围修饰错位。\u003c/p>\n\u003cp>用“一直能够”保留原来持续适用的制度条件，不能润色成卖家已经逃掉全部税款。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>直到现在，许多只在单一州或几个州有实体存在的卖家，在向这些州以外的地址运送商品时，一直能够避免收取销售税。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>40题\u003c/h2>\n\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003cp>在处理最高法院周四这项决定时，作者采用了怎样的写法？\u003c/p>\n\u003cp>这是全文写作方式题，要求判断作者主要怎样展开论述。这里仍把每个选项放回各段功能检查，不把某个局部细节当成整篇写法。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>presents its main points with conflicting views on them\u003c/strong>\u003c/p>\n\u003cp>呈现它的主要内容，并给出对这些内容相互冲突的看法\u003c/p>\n\u003cp>B. \u003cstrong>gives a factual account of it and discusses its consequences\u003c/strong>\u003c/p>\n\u003cp>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003cp>C. \u003cstrong>cites some cases related to it and analyzes their implications\u003c/strong>\u003c/p>\n\u003cp>引用一些与它有关的案件，并分析这些案件的含义\u003c/p>\n\u003cp>D. \u003cstrong>describes the long and complicated process of its making\u003c/strong>\u003c/p>\n\u003cp>描述它形成过程中漫长而复杂的过程\u003c/p>\n\u003ch3>用写作视角检查全文写法\u003c/h3>\n\u003cp>本题用同样的写作视角检查全文的展开方式，也就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。\u003c/td>\n\u003ctd>先说发生了什么和谁受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。\u003c/td>\n\u003ctd>回头解释原来是什么情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。\u003c/td>\n\u003ctd>再把原来的做法说清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。\u003c/td>\n\u003ctd>接着说原来的做法为什么要改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。\u003c/td>\n\u003ctd>先说一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。\u003c/td>\n\u003ctd>再说另一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。\u003c/td>\n\u003ctd>最后说各方分别有什么反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003ch3>A. presents its main points with conflicting views on them\u003c/h3>\n\u003cp>呈现它的主要内容，并给出对这些内容相互冲突的看法\u003c/p>\n\u003ch4>如果 A 概括了全文写法，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>呈现它的主要内容，并给出对这些内容相互冲突的看法\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先交代新裁决内容及受影响群体，再围绕同一征收要求点出双方相反的评价。\u003c/td>\n\u003ctd>先说发生了什么和谁受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回顾旧判决时，把支持原有税收界限与反对其财政后果的意见并列。\u003c/td>\n\u003ctd>回头解释原来是什么情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>解释实体存在规则怎样运行，并比较两方对商家代收义务是否合理的看法。\u003c/td>\n\u003ctd>再把原来的做法说清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍主张改变规则的理由，再呈现针对这些理由的反驳，使裁决要点与争论持续对应。\u003c/td>\n\u003ctd>接着说原来的做法为什么要改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>说明连锁企业受到的影响，同时并置它们认为公平与对手认为偏袒的相反评价。\u003c/td>\n\u003ctd>先说一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明州外卖家新增义务，再比较它们对负担的批评与支持者对责任分担的解释。\u003c/td>\n\u003ctd>再说另一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>归纳各方对同一裁决要点的意见冲突，使观点比较成为全文一贯的组织方式。\u003c/td>\n\u003ctd>最后说各方分别有什么反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A 不是完全没有碰到文章：第7段确实有人称赞，也有人说小企业没有受到良好照顾。不过，这些人处在不同的经营位置，作者主要用他们的反应补充说明谁受益、谁受损。前面的第2、3段在解释旧制度怎样收税，第4段引用肯尼迪说明改变它的理由，第5、6段追踪不同商家将承担什么；这些段落没有一直成对摆出针对同一要点的正反论据。A 中 with conflicting views on them 要求意见冲突跟着各个主要内容展开，实际文章只是结尾集中出现不同反应。用最后一段的一个特征来解释前面全部段落，会漏掉正文对规则和后果的连续交代。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003ch3>B. gives a factual account of it and discusses its consequences\u003c/h3>\n\u003cp>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003ch4>如果 B 概括了全文写法，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>报道裁决扩大网上购物销售税征收范围，并概括购物者和州财政受到的直接影响。\u003c/td>\n\u003ctd>先说发生了什么和谁受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回顾两项被推翻的旧决定，给出新裁决所针对的征税困难和收入损失。\u003c/td>\n\u003ctd>回头解释原来是什么情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明无当地实体企业的代收豁免与顾客自行缴税责任，交代旧规则的实际运转。\u003c/td>\n\u003ctd>再把原来的做法说清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>引述改变规则的理由，说明经济现实、财政收入和公平竞争方面的问题。\u003c/td>\n\u003ctd>接着说原来的做法为什么要改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>解释大连锁企业为何受益：它们原已代收，对手此后也需承担相同义务。\u003c/td>\n\u003ctd>先说一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明原先免于代收的州外卖家将怎样面对各州新增的法律要求。\u003c/td>\n\u003ctd>再说另一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>汇集零售团体、分析师及小企业的反应，具体呈现裁决对不同经营者的后果。\u003c/td>\n\u003ctd>最后说各方分别有什么反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B 的 factual account 能接住第1段对周四决定的报道，也能接住第2、3段对旧决定和收税安排的解释。第4段引用肯尼迪，是让读者知道改变的理由，仍然围绕这项决定交代事实。discusses its consequences 又接住第5、6段：大型连锁企业被称为获胜者，原来不收税的州外卖家今后可能被要求代收。第7段的称赞、失利者和小企业声明继续说明这些后果。这里既不是只列一条新闻，也不是把作者自己的态度放到中心；作者把决定、背景与各方所受影响连着讲出来。B 的两个动作能够分别覆盖文章前半与后半，也能解释为什么结尾会引用不同群体的反应。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003ch3>C. cites some cases related to it and analyzes their implications\u003c/h3>\n\u003cp>引用一些与它有关的案件，并分析这些案件的含义\u003c/p>\n\u003ch4>如果 C 概括了全文写法，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>引用一些与它有关的案件，并分析这些案件的含义\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以新裁决牵涉的具体诉讼案件起笔，交代案中哪些当事人受到影响。\u003c/td>\n\u003ctd>先说发生了什么和谁受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回到相关旧案，逐一说明案件背景和此前法律处理的情况。\u003c/td>\n\u003ctd>回头解释原来是什么情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>用案件里的交易及实体经营证据，解释旧规则怎样被用于具体当事人。\u003c/td>\n\u003ctd>再把原来的做法说清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>分析相关案件暴露的规则缺陷，以判案结果说明为什么需要改变旧做法。\u003c/td>\n\u003ctd>接着说原来的做法为什么要改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>选取连锁企业卷入的具体案件，解释其结果对这一类企业意味着什么。\u003c/td>\n\u003ctd>先说一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>再分析州外小卖家的案件，比较它给这类经营者带来的不同意义。\u003c/td>\n\u003ctd>再说另一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>汇集各方对所列案件及其法律含义的反应，以案例分析贯穿报道。\u003c/td>\n\u003ctd>最后说各方分别有什么反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C 中 cases 可以让我们想到第3段开头的 The cases，以及第2段的两项旧决定。但接下来文章没有讲这些案件各自是谁起诉谁、具体争议是什么，也没有逐案讨论含义，而是马上解释共同的实体存在规则与顾客缴税情况。第5、6段的连锁企业、州外卖家也是受新裁决影响的群体，不是正在逐个分析的诉讼案例。C 把背景中提到旧案件，变成了全文依靠相关案件展开分析，给案件的作用加大了一层。尤其尾段的商家反应，接的是新决定对它们的影响，并非前面各个案件的不同含义。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>In dealing with the Supreme Court decision Thursday, the author ______.\u003c/strong>\u003c/p>\n\u003ch3>D. describes the long and complicated process of its making\u003c/h3>\n\u003cp>描述它形成过程中漫长而复杂的过程\u003c/p>\n\u003ch4>如果 D 概括了全文写法，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>描述它形成过程中漫长而复杂的过程\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先宣布历经漫长程序形成的新裁决，点出当事人在形成过程中受到的影响。\u003c/td>\n\u003ctd>先说发生了什么和谁受影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回溯裁决形成的早期法律背景，说明旧判例如何成为长期审议的起点。\u003c/td>\n\u003ctd>回头解释原来是什么情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>讲清原有收税安排如何进入诉讼程序，说明形成新决定所必须处理的制度步骤。\u003c/td>\n\u003ctd>再把原来的做法说清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>展开审议中发现缺陷、争论与修改的关键转折，体现过程复杂。\u003c/td>\n\u003ctd>接着说原来的做法为什么要改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>说明连锁企业在漫长审理各阶段受到的不确定影响及其程序回应。\u003c/td>\n\u003ctd>先说一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>再说明州外卖家在听证、法律论证和等待决定期间受到的影响。\u003c/td>\n\u003ctd>再说另一种人会受到什么影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>用参与者对整个耗时形成过程的反应收尾，回扣决定如何一步步作成。\u003c/td>\n\u003ctd>最后说各方分别有什么反应\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D 的 process of its making 问的是决定怎样一步步形成，long and complicated 又要求文章突出耗时与复杂性。原文确实有 Thursday、decades-old、Until now 等时间词，但它们分别标记本次决定、旧决定和此前的收税状态，并没有串成审议程序。第4段介绍肯尼迪的理由，也只是说明旧规则存在的问题，没有展开漫长的讨论、修改或表决经过。更明显的是，第5、6段已经在说决定作出以后商家怎样收税，第7段又是相关人对结果的反应。这些段落都在走向决定之后，D 却要求它们围绕决定作出之前的形成过程展开。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>40题结论\u003c/h3>\n\u003cp>\u003cstrong>40. B. gives a factual account of it and discusses its consequences\u003c/strong>\u003c/p>\n\u003cp>对它作事实性的介绍，并讨论它的后果。\u003c/p>\n\u003cp>据此回到全文，后续题目应保持的理解方向是：\u003c/p>\n\u003cp>\u003cstrong>文章介绍销售税裁决的事实与旧规则背景，再区分州、消费者、大型连锁和小型网商承受的不同后果。\u003c/strong>\u003c/p>\n\u003ch2>36题\u003c/h2>\n\u003cblockquote>\n\u003cp>The Supreme Court decision Thursday will ______.\u003cbr>最高法院周四的决定将会带来什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>裁决影响题。题干要求判断“最高法院周四的决定将会带来什么？”，先按第1、5、7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\u003c/p>\n\u003cp>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, rivals will be charging sales tax where they hadn&#39;t before. Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#39;t have to.\u003c/p>\n\u003cp>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses. The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches complying with various state sales tax laws. The Small Business &amp; Entrepreneurship Council advocacy group said in a statement, &quot;Small businesses and internet entrepreneurs are not well served at all by this decision.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>开篇说明更多购物者缴税、各州受益；后文区分大型连锁企业的胜利与小型纯线上零售商的负担，影响并不相同。\u003c/p>\n\u003ch3>A. put most online businesses in a dilemma\u003c/h3>\n\u003cblockquote>\n\u003cp>使大多数网上企业陷入两难境地\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“put most online businesses in a [xxx]”，保留了相应遮挡。当时的定位线索是：A 的 most online businesses 在说网上交易中的企业，原文 more people 在说同一交易中的购物者，两边都涉及网上交易受这项决定影响，因此回看第1段中谁需要缴税的句子。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>dilemma表示两难境地。A的完整命题是大多数网上企业陷入两难，不只是有某些商家受到影响。开篇直接写更多购物者缴税与州财政获益，尚不能产生这个关于企业比例的判断。\u003c/p>\n\u003cp>放回全文，第5段把大型连锁企业称作赢家，第7段则说小型纯线上零售商面临多州合规麻烦。不同商家的后果不同；A把一部分卖家的负担扩成大多数网上企业共同的两难，C对购物者缴税的概括则直接对应首段。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最高法院周四的裁决将会使大多数网上企业陷入两难境地。\u003c/p>\n\u003c/blockquote>\n\u003cp>A 的 most online businesses 在说网上交易中的企业，原文 more people 在说同一交易中的购物者，两边都涉及网上交易受这项决定影响，因此回看第1段中谁需要缴税的句子。\u003c/p>\n\u003cp>dilemma表示两难境地。A的完整命题是大多数网上企业陷入两难，不只是有某些商家受到影响。开篇直接写更多购物者缴税与州财政获益，尚不能产生这个关于企业比例的判断。\u003c/p>\n\u003cp>放回全文，第5段把大型连锁企业称作赢家，第7段则说小型纯线上零售商面临多州合规麻烦。不同商家的后果不同；A把一部分卖家的负担扩成大多数网上企业共同的两难，C对购物者缴税的概括则直接对应首段。\u003c/p>\n\u003cp>开篇说明更多购物者缴税、各州受益；后文区分大型连锁企业的胜利与小型纯线上零售商的负担，影响并不相同。\u003c/p>\n\u003cp>若是大多数，后文应围绕普遍受困展开。实际大连锁企业被写作赢家，小型纯线上商家才面临合规麻烦，主体范围和单向负面程度都被放大。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、5、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\u003c/p>\n\u003cp>开篇说明更多购物者缴税、各州受益；后文区分大型连锁企业的胜利与小型纯线上零售商的负担，影响并不相同。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The ruling puts most online businesses in a dilemma.\u003c/p>\n\u003cp>这项裁决让大多数网上企业陷入两难。\u003c/p>\n\u003c/blockquote>\n\u003cp>若是大多数，后文应围绕普遍受困展开。实际大连锁企业被写作赢家，小型纯线上商家才面临合规麻烦，主体范围和单向负面程度都被放大。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文事实性介绍裁决及后果，应具体区分哪一方付钱、哪一方得益；不能将部分卖家的负担扩大到大多数网上企业。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>put most online businesses in a dilemma\u003cbr>使大多数网上企业陷入两难境地\u003c/p>\n\u003c/blockquote>\n\u003cp>放回全文，第5段把大型连锁企业称作赢家，第7段则说小型纯线上零售商面临多州合规麻烦。不同商家的后果不同；A把一部分卖家的负担扩成大多数网上企业共同的两难，C对购物者缴税的概括则直接对应首段。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. force some states to cut sales tax\u003c/h3>\n\u003cblockquote>\n\u003cp>迫使一些州削减销售税\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B 的 cut sales tax 对应原文 pay sales tax，双方都在说销售税，但一个是州削减，另一个是人们缴纳，所以回看第1段中各州得到什么权力的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文 pay sales tax 的执行者是 more people，各州得到的是强制更多人缴税的能力。B 的 cut sales tax 却让各州成为被迫行动的一方，而且行动是削减销售税。两边虽然都提到税，谁被要求做事和税款怎样变化都不一样：原文把更多购物者纳入缴税范围，B 却写各州被要求减少税收。\u003c/p>\n\u003cp>原文是各州能够让更多人缴税，B 却把各州改成被迫削减销售税的一方，动作对象和方向都变了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最高法院周四的裁决将会迫使一些州削减销售税。\u003c/p>\n\u003c/blockquote>\n\u003cp>B 的 cut sales tax 对应原文 pay sales tax，双方都在说销售税，但一个是州削减，另一个是人们缴纳，所以回看第1段中各州得到什么权力的句子。\u003c/p>\n\u003cp>原文 pay sales tax 的执行者是 more people，各州得到的是强制更多人缴税的能力。B 的 cut sales tax 却让各州成为被迫行动的一方，而且行动是削减销售税。两边虽然都提到税，谁被要求做事和税款怎样变化都不一样：原文把更多购物者纳入缴税范围，B 却写各州被要求减少税收。\u003c/p>\n\u003cp>原文是各州能够让更多人缴税，B 却把各州改成被迫削减销售税的一方，动作对象和方向都变了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、5、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\u003c/p>\n\u003cp>开篇说明更多购物者缴税、各州受益；后文区分大型连锁企业的胜利与小型纯线上零售商的负担，影响并不相同。\u003c/p>\n\u003c/bl rong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最高法院周四的裁决将会使更多网上购物者缴纳销售税。\u003c/p>\n\u003c/blockquote>\n\u003cp>C 的 online shoppers 是在网上购物的人，对应原文 more people 后面的 when they make online purchases，所以回看第1段中这些人要做什么的句子。\u003c/p>\n\u003cp>原文 more people 不是随便一种人，后面的网上购物条件把他们限定成购物者。C 的 online shoppers 把这个条件收进一个名词里。原文的 force 与 C 的 make 都把动作落到这些人身上，动作又同样是 pay sales tax。因此 C 既保留了人数增加，也保留了网上购物和缴销售税这两个限定，没有把缴税者换成企业或州。\u003c/p>\n\u003cp>更多人在网上购物时被要求缴销售税，正是更多网上购物者缴纳销售税，这个结果在第1段已经写明。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、5、7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\u003c/p>\n\u003cp>开篇说明更多购物者缴税、各州受益；后文区分大型连锁企业的胜利与小型纯线上零售商的负担，影响并不相同。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The ruling allows states to require more online shoppers to pay sales tax.\u003c/p>\n\u003cp>这项裁决允许各州要求更多网上购物者缴销售税。\u003c/p>\n\u003c/blockquote>\n\u003cp>原句more people受when they make online purchases限定，online shoppers把限定收进名词。make对应force，缴税动作和人数增加均保持不变。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>gives a factual account of it and discusses its consequences\u003cbr>对它作事实性的介绍，并讨论它的后果\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入36题
