const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| grade inflation | 成绩膨胀 | gradual increase | 逐渐增加 | average | a.平均的 |\n| past few decades | 过去几十年 | often | ad.经常；通常 | consider | v.认为 |\n| product | n.产物 | consumer era | 消费时代 | treat | v.对待 |\n| customer | n.顾客 | please | v.使满意 | related force | 相关力量 |\n| policy | n.政策 | bury | v.埋藏；隐藏 | catalog | n.目录 |\n| grade forgiveness | 成绩宽免 | raise | v.提高 |  |  |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 2重点词与语境","focus":[85,186,925,510],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>grade inflation\u003c/td>\n\u003ctd>成绩膨胀\u003c/td>\n\u003ctd>gradual increa 03cp>The use of this little-known practice has accelerated in recent years, as colleges continue to do their utmost to keep students in school (and paying tuition) and improve their graduation rates. When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their transition to college-level courses. But now most colleges, save for many selective campuses, allow all undergraduates, and even graduate students, to get their low grades forgiven.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-1\">\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>The use of this little-known practice / has accelerated / in recent years, / as colleges continue / to do their utmost / to keep students in school / (and paying tuition) / and improve their graduation rates.\u003c/p>\n\u003cp>When this practice first started / decades ago, / it was usually limited to freshmen, / to give them a second chance / to take a class / in their first year / if they struggled / in their transition / to college-level courses.\u003c/p>\n\u003cp>But now most colleges, / save for many selective campuses, / allow all undergraduates, / and even graduate students, / to get their low grades forgiven.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 意群翻译 · 第3段\n\n这种鲜为人知的做法的使用 / 已经加速 / 在最近几年，/ 随着大学继续 / 竭尽全力 / 让学生留在学校 / （并支付学费）/ 并提高他们的毕业率。\n\n当这种做法首次开始 / 几十年前，/ 它通常仅限于新生，/ 给他们第二次机会 / 上一门课 / 在他们的第一年 / 如果他们挣扎 / 在他们的过渡期 / 到大学水平课程。\n\n但现在大多数大学，/ 除了许多精英校园，/ 允许所有本科生，/ 甚至研究生，/ 让他们的低分被宽恕。","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1037,925,959],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-3-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>The use of this little-known practice has accelerated in recent years, as colleges continue to do their utmost to keep students in school (and paying tuition) and improve their graduation rates. When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their transition to college-level courses. But now most colleges, save for many selective campuses, allow all undergraduates, and even graduate students, to get their low grades forgiven.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-1\">\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>The use of this little-known practice / has accelerated / in recent years, / as colleges continue / to do their utmost / to keep students in school / (and paying tuition) / and improve their graduation rates.\u003c/p>\n\u003cp>When this practice first started / decades ago, / it was usually limited to freshmen, / to give them a second chance / to take a class / in their first year / if they struggled / in their transition / to college-level courses.\u003c/p>\n\u003cp>But now most colleges, / save for many selective campuses, / allow all undergraduates, / and even graduate students, / to get their low grades forgiven.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-2\">\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>这种鲜为人知的做法的使用 / 已经加速 / 在最近几年，/ 随着大学继续 / 竭尽全力 / 让学生留在学校 / （并支付学费）/ 并提高他们的毕业率。\u003c/p>\n\u003cp>当这种做法首次开始 / 几十年前，/ 它通常仅限于新生，/ 给他们第二次机会 / 上一门课 / 在他们的第一年 / 如果他们挣扎 / 在他们的过渡期 / 到大学水平课程。\u003c/p>\n\u003cp>但现在大多数大学，/ 除了许多精英校园，/ 允许所有本科生，/ 甚至研究生，/ 让他们的低分被宽恕。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 标准译文 · 第3段\n\n这种鲜为人知的做法的使用在最近几年已经加速，因为大学继续竭尽全力让学生留在学校（并支付学费）并提高毕业率。几十年前这种做法首次开始时，通常仅限于新生，如果他们在向大学水平课程过渡时遇到困难，给他们第二次机会在第一年重修课程。但现在除了许多精英校园外，大多数大学允许所有本科生，甚至研究生，让他们的低分被宽恕。","con 的第一年 / 如果他们挣扎 / 在他们的过渡期 / 到大学水平课程。\u003c/p>\n\u003cp>但现在大多数大学，/ 除了许多精英校园，/ 允许所有本科生，/ 甚至研究生，/ 让他们的低分被宽恕。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-3\">\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>这种鲜为人知的做法的使用在最近几年已经加速，因为大学继续竭尽全力让学生留在学校（并支付学费）并提高毕业率。几十年前这种做法首次开始时，通常仅限于新生，如果他们在向大学水平课程过渡时遇到困难，给他们第二次机会在第一年重修课程。但现在除了许多精英校园外，大多数大学允许所有本科生，甚至研究生，让他们的低分被宽恕。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 完整原文 · 第4段\n\nCollege officials tend to emphasize that the goal of grade forgiveness is less about the grade itself and more about encouraging students to retake courses critical to their degree program and graduation without incurring a big penalty. \"Ultimately,\" said Jack Miner, Ohio State University's registrar, \"we see students achieve more success because they retake a course and do better in subsequent courses or master the content that allows them to graduate on time.\"","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,2005,925,613],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-4-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>College officials tend to emphasize that the goal of grade forgiveness is less about the grade itself and more about encouraging students to retake courses critical to their degree program and graduation without incurring a big penalty. &quot;Ultimately,&quot; said Jack Miner, Ohio State University&#39;s registrar, &quot;we see students achieve more success because they retake a course and do better in subsequent courses or master the content that allows them to graduate on time.&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群划分 · 第4段\n\nCollege official  or master the content / that allows them to graduate on time.&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群翻译 · 第4段\n\n大学官员倾向于强调 / 成绩宽恕的目标 / 更少关于成绩本身 / 而更多关于鼓励学生 / 重修关键课程 / 对他们的学位项目和毕业 / 而不承受大的惩罚。\n\n\"最终，\" / 杰克·迈纳说，/ 俄亥俄州立大学的注册主任，/ \"我们看到学生取得更多成功 / 因为他们重修一门课程 / 并在后续课程中表现更好 / 或掌握内容 / 这使他们能够按时毕业。\"","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,2005,925,613],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-4-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>College officials tend to emphasize that the goal of grade forgiveness is less about the grade itself and more about encouraging students to retake courses critical to their degree program and graduation without incurring a big penalty. &quot;Ultimately,&quot; said Jack Miner, Ohio State University&#39;s registrar, &quot;we see students achieve more success because they retake a course and do better in subsequent courses or master the content that allows them to graduate on time.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>College officials tend to emphasize / that the goal of grade forgiveness / is less about the grade itself / and more about encouraging students / to retake courses critical / to their degree program and graduation / without incurring a big penalty.\u003c/p>\n\u003cp>&quot;Ultimately,&quot; / said Jack Miner, / Ohio State University&#39;s registrar, / &quot;we see students achieve more success / because they retake a course / and do better in subsequent courses / or master the content / that allows them to graduate on time.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=  do better in subsequent courses / or master the content / that allows them to graduate on time.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-2\">\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>大学官员倾向于强调 / 成绩宽恕的目标 / 更少关于成绩本身 / 而更多关于鼓励学生 / 重修关键课程 / 对他们的学位项目和毕业 / 而不承受大的惩罚。\u003c/p>\n\u003cp>&quot;最终，&quot; / 杰克·迈纳说，/ 俄亥俄州立大学的注册主任，/ &quot;我们看到学生取得更多成功 / 因为他们重修一门课程 / 并在后续课程中表现更好 / 或掌握内容 / 这使他们能够按时毕业。&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-3\">\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>大学官员倾向于强调，成绩宽恕的目标更少关于成绩本身，而更多关于鼓励学生重修对他们学位项目和毕业至关重要的课程，而不用承受大的惩罚。俄亥俄州立大学的注册主任杰克·迈纳说：&quot;最终，我们看到学生取得更多成功，因为他们重修课程后在后续课程中表现更好，或掌握了使他们能够按时毕业的内容。&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第5段","level":3,"raw":"### 完整原文 · 第5段\n\nThat said, there is a way in which grade forgiveness satisfies colleges' own needs as well. For public institutions, state funds are sometimes tied partly to their success on metrics such as graduation rates and student retention – so better grades can, by boosting figures like those, mean more money. And anything that raises GPAs will likely make students – who, at the end of the day, are paying the bill – feel they've gotten a better value for their tuition dollars, which is another big concern for colleges.","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[85,2633,925,958],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-5-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-5-0\">\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>That said, there is a way in which grade forgiveness satisfies colleges&#39; own needs as well. For public institutions, state funds are sometimes tied partly to their success on metrics such as graduation rates and student retention – so better grades can, by boosting figures like those, mean more money. And anything that raises GPAs will likely make students – who, at the end of the day, are paying the bill – feel they&#39;ve gotten a better value for their tuition dollars, which is another big concern for colleges.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第5段","level":3,"raw":"### 意群划分 · 第5段\n\nThat said, / there is a way / in which grade forgiveness / satisfies colleges' own needs as well.\n\nFor public institutions, / state funds are sometimes tied / partly to their success / on metrics such as graduation rates / and student retention – / so better grades can, / by boosting figures like those, / mean more money.\n\nAnd anything that raises GPAs / will likely make students – / who, at the end of the day, / are paying the bill – / feel they've gotten a better value / for their tuition dollars, / which is another big concern / for colleges.","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[85,2633,925,958],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-5-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-5-0\">\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>That said, there is a way in which grade forgiveness satisfies colleges&#39; own needs as well. For public institutions, state funds are sometimes tied partly to their success on metrics such as graduation rates and student retention – so better grades can, by boosting figures like those, mean more money. And anything that raises GPAs will likely make students – who, at the end of the day, are paying the bill – feel they&#39;ve gotten a better value for their tuition dollars, which is another big concern for colleges.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-1\">\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>That said, / there is a way / in which grade forgiveness / satisfies colleges&#39; own needs as well.\u003c/p>\n\u003cp>For public institutions, / state funds are sometimes tied / partly to their success / on metrics such as graduation rates / and student retention – / so better grades can, / by boosting figures like those, / mean more money.\u003c/p>\n\u003cp>And anything that raises GPAs / will likely make students – / who, at the end of the day, / are paying the bill – / feel they&#39;ve gotten a better value / for their tuition dollars, / which is another big concern / for colleges.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第5段","level":3,"raw":"### 意群翻译 · 第5段\n\n话虽如此，/ 有一种方式 / 成绩宽恕 / 也满足大学自身的需求。\n\n对于公立机构，/ 州资金有时被绑定 / 部分地与他们的成功 / 在诸如毕业率等指标上 / 和学生保留率 – / 所以更好的成绩可以，/ 通过提升这些数字，/ 意味着更多的钱。\n\n任何提高绩点的事物 / 都可能让学生 – / 他们，说到底，/ 正在支付账单 – / 感觉他们获得了更好的价值 / 为他们的学费，/ 这是另一个大的关注点 / 对大学来说。","context":{"mode":"image","asset":"articleAnnotated","label":"第5段精读与翻译","focus":[85,2633,925,958],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-5-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-5-0\">\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>That said, there is a way in which grade forgiveness satisfies colleges&#39; own needs as well. For public institutions, state funds are sometimes tied partly to their success on metrics such as graduation rates and student retention – so better grades can, by boosting figures like those, mean more money. And anything that raises GPAs will likely make students – who, at the end of the day, are paying the bill – feel they&#39;ve gotten a better value for their tuition dollars, which is another big concern for colleges.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-1\">\u003ch3>意群划 ises GPAs will likely make students – who, at the end of the day, are paying the bill – feel they&#39;ve gotten a better value for their tuition dollars, which is another big concern for colleges.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-1\">\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>That said, / there is a way / in which grade forgiveness / satisfies colleges&#39; own needs as well.\u003c/p>\n\u003cp>For public institutions, / state funds are sometimes tied / partly to their success / on metrics such as graduation rates / and student retention – / so better grades can, / by boosting figures like those, / mean more money.\u003c/p>\n\u003cp>And anything that raises GPAs / will likely make students – / who, at the end of the day, / are paying the bill – / feel they&#39;ve gotten a better value / for their tuition dollars, / which is another big concern / for colleges.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-2\">\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>话虽如此，/ 有一种方式 / 成绩宽恕 / 也满足大学自身的需求。\u003c/p>\n\u003cp>对于公立机构，/ 州资金有时被绑定 / 部分地与他们的成功 / 在诸如毕业率等指标上 / 和学生保留率 – / 所以更好的成绩可以，/ 通过提升这些数字，/ 意味着更多的钱。\u003c/p>\n\u003cp>任何提高绩点的事物 / 都可能让学生 – / 他们，说到底，/ 正在支付账单 – / 感觉他们获得了更好的价值 / 为他们的学费，/ 这是另一个大的关注点 / 对大学来说。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-5-3\">\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>话虽如此，成绩宽恕也有满足大学自身需求的一面。对于公立机构，州资金有时部分地与他们在毕业率和学生保留率等指标上的成功挂钩——所以更好的成绩通过提升这些数字，可以意味着更多的资金。任何提高绩点的做法都可能让学生——他们说到底是在支付账单的人——感觉他们的学费物有所值，这是大学的另一个重大关切。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 完整原文 · 第6段\n\nIndeed, grade forgiveness is just another way that universities are responding to consumers' expectations for higher education. Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be. On this, students' and colleges' incentives seem to be aligned.","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3604,925,511],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-6-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Indeed, grade forgiveness is just another way that universities are responding to consumers&#39; expectations for higher education. Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be. On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 意群划分 · 第6段\n\nIndeed, / grade forgiveness is just another way / that universities are responding / to consumers' expectations / for higher education.\n\nSince students and parents / expect a college degree / to lead to a job, / it is in the best interest of a school / to turn out graduates / who are as qualified as possible – / or at least appear to be.\n\nOn this, / students' and colleges' incentives / seem to be aligned.","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3604,925,511],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-6-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Indeed, grade forgiveness is just another way that universities are responding to consumers&#39; expectations for higher education. Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be. On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-1\">\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Indeed, / grade forgiveness is just another way / that universities are responding / to consumers&#39; expectations / for higher education.\u003c/p>\n\u003cp>Since students and parents / expect a college degree / to lead to a job, / it is in the best interest of a school / to turn out graduates / who are as qualified as possible – / or at least appear to be.\u003c/p>\n\u003cp>On this, / students&#39; and colleges&#39; incentives / seem to be aligned.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 意群翻译 · 第6段\n\n确实，/ 成绩宽恕只是另一种方式 / 大学正在回应 / 消费者的期望 / 对高等教育的。\n\n由于学生和家长 / 期望大学学位 / 能带来工作，/ 这符合学校的最佳利益 / 培养毕业生 / 尽可能合格的 – / 或至少看起来如此。\n\n在这一点上，/ 学生和大学的动机 / 似乎是一致的。","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3604,925,511],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-6-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Indeed, grade forgiveness is just another way that universities are responding to consumers&#39; expectations for higher education. Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be. On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-1\">\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Indeed, / grade forgiveness is just another way / that universities are responding / to consumers&#39; expectations / for higher education.\u003c/p>\n\u003cp>Since students and parents / expect a college degree / to lead to a job, / it is in the best interest of a school / to turn out graduates / who are as qualified as possible – / or at least appear to be.\u003c/p>\n\u003cp>On this, / students&#39; and colleges&#39; incentives / seem to be aligned.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-2\">\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>确实，/ 成绩宽恕只是另一种方式 / 大学正在回应 / 消费者的期望 / 对高等教育的。\u003c/p>\n\u003cp>由于学生和家长 / 期望大学学位 / 能带来工作，/ 这符合学校的最佳利益 / 培养毕业生 / 尽可能合格的 – / 或至少看起来如此。\u003c/p>\n\u003cp>在这一点上，/ 学生和大学的动机 / 似乎是一致的。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 标准译文 · 第6段\n\n确实，成绩宽恕只是大学回应消费者对高等教育期望的另一种方式。由于学生和家长期望大学学位能带来工作，培养尽可能合格的毕业生——或至少看起来如此——符合学校的最佳利益。在这一点上，学生和大学的动机似乎是一致的。","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3604,925,511],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-6-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Indeed, grade forgiveness is just another way that universities are responding to consumers&#39; expectations for higher education. Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be. On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-6-1\">\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Indeed, / grade forgiveness is just another way / that universities are responding t of a consumer era：(in higher education)：(in which students are treated：(like customers to be pleased)).\n\nBut another, related force：(a policy often buried deep：(in course catalogs)：(called \"grade forgiveness\")) → is helping raise GPAs.\n\n### 第2段\n\nGrade forgiveness allows students → to retake a course：(in which they received a low grade) + and the most recent grade // or the highest grade → is the only one that counts：(in calculating a student's overall GPA).\n\n### 第3段\n\nThe use of this little-known practice → has accelerated：(in recent years) → as colleges continue → to do their utmost：(to keep students in school：(and paying tuition) + improve their graduation rates).\n\nWhen this practice first started：(decades ago) → it was usually limited to freshmen → to give them a second chance：(to take a class：(in their first year))：(if they struggled：(in their transition：(to college-level courses))).\n\nBut now most colleges：(save for many selective campuses) → allow all undergraduates + even graduate students → to get their low grades forgiven.\n\n### 第4段\n\nCollege officials tend to emphasize：(that the goal of grade forgiveness → is less about the grade itself + more about encouraging students：(to retake courses critical：(to their degree program and graduation))：(without incurring a big penalty)).\n\n\"Ultimately,\" → said Jack Miner：(Ohio State University's registrar) → \"we see students achieve more success：(because they retake a course + do better in subsequent courses // or master the content：(that allows them to graduate on time)).\"\n\n### 第5段\n\nThat said → there is a way：(in which grade forgiveness → satisfies colleges' own needs as well).\n\nFor public institutions → state funds are sometimes tied：(partly to their success：(on metrics such as graduation rates + student retention)) – so better grades can：(by boosting figures like those) → mean more money.\n\nAnd anything that raises GPAs → will likely make students：(who, at the end of the day → are paying the bill) → feel they've gotten a better value：(for their tuition dollars)：(which is another big concern：(for colleges)).\n\n### 第6段\n\nIndeed → grade forgiveness is just another way：(that universities are responding：(to consumers' expectations：(for higher education))).\n\nSince students and parents → expect a college degree：(to lead to a job) → it is in the best interest of a school → to turn out graduates：(who are as qualified as possible – or at least appear to be).\n\nOn this → students' and colleges' incentives → seem to be aligned.","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>Grade inflation：(the gradual increase：(in average GPAs)：(over the past few decades)) → is often considered → a product of a consumer era：(in higher education)：(in which students are treated：(like customers to be pleased)).\u003c/p>\n\u003cp>But another, related force：(a policy often buried deep：(in course catalogs)：(called &quot;grade forgiveness&quot;)) → is helping raise GPAs.\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Grade forgiveness allows students → to retake a course：(in which they received a low grade) + and the most recent grade // or the highest grade → is the only one that counts：(in calculating a student&#39;s overall GPA).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>The use of this little-known practice → has accelerated：(in recent years) → as colleges continue → to do their utmost：(to keep students in school：(and paying tuition) + improve their graduation rates).\u003c/p>\n\u003cp>When this practice first started：(decades ago) → it was usually limited to freshmen → to give them a second chance：(to take a class：(in their first year))：(if they struggled：(in their transition：(to college-level courses))).\u003c/p>\n\u003cp>But now most colleges：(save for many selective campuses) → allow all undergraduates + even graduate students → to get their low grades forgiven.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>College officials tend to emphasize：(that the goal of grade forgiveness → is less about the grade itself + more about encouraging students：(to retake courses critical：(to their degree program and graduation))：(without incurring a big penalty)).\u003c/p>\n\u003cp>&quot;Ultimately,&quot; → said Jack Miner：(Ohio State University&#39;s registrar) → &quot;we see students achieve more success：(because they retake a course + do better in subsequent courses // or master the content：(that allows them to graduate on time)).&quot;\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>That said → there is a way：(in which grade forgiveness → satisfies colleges&#39; own needs as well).\u003c/p>\n\u003cp>For public institutions → state funds are sometimes tied：(partly to their success：(on metrics such as graduation rates + student retention)) – so better grades can：(by boosting figures like those) → mean more money.\u003c/p>\n\u003cp>And anything that raises GPAs → will likely make students：(who, at the end of the day → are paying the bill) → feel they&#39;ve gotten a better value：(for their tuition dollars)：(which is another big concern：(for colleges)).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Indeed → grade forgiveness is just another way：(that universities are responding：(to consumers&#39; expectations：(for higher education))).\u003c/p>\n\u003cp>Since students and parents → expect a college degree：(to lead to a job) → it is in the best interest of a school → to turn out graduates：(who are as qualified as possible – or at least appear to be).\u003c/p>\n\u003cp>On this → students&#39; and colleges&#39; incentives → seem to be aligned.\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n成绩膨胀：(逐渐增加：(平均绩点的)：(在过去几十年里)) → 通常被认为是 → 消费时代的产物：(在高等教育中)：(在其中学生被对待：(像需要取悦的顾客))。\n\n但另一个相关的力量：(一项经常深埋的政策：(在课程目录中)：(叫做\"成绩宽恕\")) → 正在帮助提高绩点。\n\n### 第2段\n\n成绩宽恕允许学生 → 重修一门课程：(在其中他们获得了低分) + 并且最近的成绩 // 或最高的成绩 → 是唯一被计算的：(在计算学生的总体绩点时)。\n\n### 第3段\n\n这种鲜为人知的做法的使用 → 已经加速：(在最近几年) → 随着大学继续 → 竭尽全力：(让学生留在学校：(并支付学费) + 提高他们的毕业率)。\n\n当这种做法首次开始：(几十年前) → 它通常仅限于新生 → 给他们第二次机会：(上一门课：(在他们的第一年))：(如果他们挣扎：(在他们的过渡期：(到大学水平课程)))。\n\n但现在大多数大学：(除了许多精英校园) → 允许所有本科生 + 甚至研究生 → 让他们的低分被宽恕。\n\n### 第4段\n\n大学官员倾向于强调：(成绩宽恕的目标 → 更少关于成绩本身 + 更多关于鼓励学生：(重修关键课程：(对他们的学位项目和毕业))：(而不承受大的惩罚))。\n\n\"最终，\" → 杰克·迈纳说：(俄亥俄州立大学的注册主任) → \"我们看到学生取得更多成功：(因为他们重修一门课程 + 在后续课程中表现更好 // 或掌握内容：(这使他们能够按时毕业))。\"\n\n### 第5段\n\n话虽如此 → 有一种方式：(成绩宽恕 → 也满足大学自身的需求)。\n\n对于公立机构 → 州资金有时被绑定：(部分地与他们的成功：(在诸如毕业率 + 学生保留率等指标上)) – 所以更好的成绩可以：(通过提升这些数字) → 意味着更多的钱。\n\n任何提高绩点的事物 → 都可能让学生：(他们，说到底 → 正在支付账单) → 感觉他们获得了更好的价值：(为他们的学费)：(这是另一个大的关注点：(对大学来说))。\n\n### 第6段\n\n确实 → 成绩宽恕只是另一种方式：(大学正在回应：(消费者的期望：(对高等教育的)))。\n\n由于学生和家长 → 期望大学学位：(能带来工作) → 这符合学校的最佳利益 → 培养毕业生：(尽可能合格的 – 或至少看起来如此)。\n\n在这一点上 → 学生和大学的动机 → 似乎是一致的。","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>成绩膨胀：(逐渐增加：(平均绩点的)：(在过去几十年里)) → 通常被认为是 → 消费时代的产物：(在高等教育中)：(在其中学生被对待：(像需要取悦的顾客))。\u003c/p>\n\u003cp>但另一个相关的力量：(一项经常深埋的政策：(在课程目录中)：(叫做&quot;成绩宽恕&quot;)) → 正在帮助提高绩点。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>成绩宽恕允许学生 → 重修一门课程：(在其中他们获得了低分) + 并且最近的成绩 // 或最高的成绩 → 是唯一被计算的：(在计算学生的总体绩点时)。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>这种鲜为人知的做法的使用 → 已经加速：(在最近几年) → 随着大学继续 → 竭尽全力：(让学生留在学校：(并支付学费) + 提高他们的毕业率)。\u003c/p>\n\u003cp>当这种做法首次开始：(几十年前) → 它通常仅限于新生 → 给他们第二次机会：(上一门课：(在他们的第一年))：(如果他们挣扎：(在他们的过渡期：(到大学水平课程)))。\u003c/p>\n\u003cp>但现在大多数大学：(除了许多精英校园) → 允许所有本科生 + 甚至研究生 → 让他们的低分被宽恕。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>大学官员倾向于强调：(成绩宽恕的目标 → 更少关于成绩本身 + 更多关于鼓励学生：(重修关键课程：(对他们的学位项目和毕业))：(而不承受大的惩罚))。\u003c/p>\n\u003cp>&quot;最终，&quot; → 杰克·迈纳说：(俄亥俄州立大学的注册主任) → &quot;我们看到学生取得更多成功：(因为他们重修一门课程 + 在后续课程中表现更好 // 或掌握内容：(这使他们能够按时毕业))。&quot;\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>话虽如此 → 有一种方式：(成绩宽恕 → 也满足大学 le":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"30题 · 题干、题型与核心出处","level":2,"raw":"## 30题\n\n**The author examines the practice of grade forgiveness by ______.**\n\n作者通过什么方式来考察成绩宽免这种做法？\n\n这是全文写作方式题，要求判断作者主要怎样展开论述。这里仍把每个选项放回各段功能检查，不把某个局部细节当成整篇写法。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **assessing its feasibility**\n\n评估它是否可行\n\nB. **listing its long-run effects**\n\n列出它的长期影响\n\nC. **comparing different views on it**\n\n比较人们对它的不同看法\n\nD. **analyzing the causes behind it**\n\n分析它背后的原因\n\n### 用写作视角检查全文写法\n\n本题用同样的写作视角检查全文的展开方式，也就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先从平均成绩上涨及教育消费化的通常解释切入，再提出成绩宽免也是提高成绩的一股力量。 | 先摆出一个现象，再补一个原因 |\n| 第2段 | 说明成绩宽免怎样运行：低分课可以重修，最近或最高的成绩才在总体绩点中算数。 | 再说这个做法到底是怎样的 |\n| 第3段 | 说明这项做法从帮助第一年遇到课程困难的新生，扩大到更多学生；近年的考虑包括留住学生、学费和毕业率。 | 回头解释起点，再说现在变了 |\n| 第4段 | 介绍学校人员强调的学习好处：鼓励重修、学得更好、掌握内容并按时毕业。 | 先说这件事怎样让一边得利 |\n| 第5段 | 转到学校自身的需要：较好的成绩可能带来更多州资金，也让付学费的学生觉得更值。 | 再说另一边也能从中得利 |\n| 第6段 | 把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。 | 最后说双方为什么走到一起 |","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"question":"30","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>The author examines the practice of grade forgiveness by ______.\u003c/strong>\u003c/p>\n\u003cp>作者通过什么方式来考察成绩宽免这种做法？\u003c/p>\n\u003cp>这是全文写作方式题，要求判断作者主要怎样展开论述。这里仍把每个选项放回各段功能检查，不把某个局部细节当成整篇写法。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>assessing its feasibility\u003c/strong>\u003c/p>\n\u003cp>评估它是否可行\u003c/p>\n\u003cp>B. \u003cstrong>listing its long-run effects\u003c/strong>\u003c/p>\n\u003cp>列出它的长期影响\u003c/p>\n\u003cp>C. \u003cstrong>comparing different views on it\u003c/strong>\u003c/p>\n\u003cp>比较人们对它的不同看法\u003c/p>\n\u003cp>D. \u003cstrong>analyzing the causes behind it\u003c/strong>\u003c/p>\n\u003cp>分析它背后的原因\u003c/p>\n\u003ch3>用写作视角检查全文写法\u003c/h3>\n\u003cp>本题用同样的写作视角检查全文的展开方式，也就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先从平均成绩上涨及教育消费化的通常解释切入，再提出成绩宽免也是提高成绩的一股力量。\u003c/td>\n\u003ctd>先摆出一个现象，再补一个原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明成绩宽免怎样运行：低分课可以重修，最近或最高的成绩才在总体绩点中算数。\u003c/td>\n\u003ctd>再说这个做法到底是怎样的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明这项做法从帮助第一年遇到课程困难的新生，扩大到更多学生；近年的考虑包括留住学生、学费和毕业率。\u003c/td>\n\u003ctd>回头解释起点，再说现在变了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍学校人员强调的学习好处：鼓励重修、学得更好、掌握内容并按时毕业。\u003c/td>\n\u003ctd>先说这件事怎样让一边得利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转到学校自身的需要：较好的成绩可能带来更多州资金，也让付学费的学生觉得更值。\u003c/td>\n\u003ctd>再说另一边也能从中得利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。\u003c/td>\n\u003ctd>最后说双方为什么走到一起\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. assessing its feasibility","level":3,"raw":"**The author examines the practice of grade forgiveness by ______.**\n\n### A. assessing its feasibility\n\n评估它是否可行","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"A"},"focusId":"focus-q30-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>The author examines the practice of grade forgiveness by ______.\u003c/strong>\u003c/p>\n\u003cp>评估它是否可行\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. assessing its feasibility","level":3,"raw":"#### 如果 A 概括了全文写法，文章6段应该怎么写？\n\n如果作者主要采用的写法真的是：\n\n评估它是否可行\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先摆出成绩宽免不断扩大的现象，再补充重修资源和计分安排可用这一实施原因，提出可行性考察。 | 先摆出一个现象，再补一个原因 |\n| 第2段 | 解释学生申请重修、学校安排课程和替换成绩的操作，使可行性建立在明确流程上。 | 再说这个做法到底是怎样的 |\n| 第3段 | 回看最初面向新生的小规模实施条件，再说明扩大到更多学生后需怎样配置资源。 | 回头解释起点，再说现在变了 |\n| 第4段 | 说明学生既能负担重修时间又可补足关键知识，以学生获得实际帮助证明方案可操作。 | 先说这件事怎样让一边得利 |\n| 第5段 | 说明学校凭现有课程安排和较高留存收益能承担资源投入，展示学校一方的可行条件与所得。 | 再说另一边也能从中得利 |\n| 第6段 | 将双方可承担的成本和实际收益合起来，说明它们为何选择一个能够共同实施的方案。 | 最后说双方为什么走到一起 |\n\n如果 A 是中心，feasibility 要让全文回答“这件事做不做得到”。第二段介绍重修与成绩处理，确实会让人想到怎样操作，但后面的内容不能停在这里。第三段说实践已经存在几十年，而且近些年使用得更广；它主要追问从最初帮助新生到如今留住学生、获得学费这一路为什么变化，并不是比较实施条件是否成熟。第四段解释学生能学得更好，第五段解释学校可以拿到更多钱，第六段又解释为什么双方都愿意看到这种结果。这些是在说一项已经实行的做法为何获得推动，而非检验大学有无能力把它办成。A 若成立，学校是否排得出重修课程、怎样承担成本、能否执行成绩规则等可行条件应当承担主要论证作用，原文却把篇幅花在动机与利益上。\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"A"},"focusId":"focus-q30-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>The author examines the practice of grade forgiveness by ______.\u003c/strong>\u003c/p>\n\u003cp>评估它是否可行\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-A-1\">\u003ch4>如果 A 概括了全文写法，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>评估它是否可行\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先摆出成绩宽免不断扩大的现象，再补充重修资源和计分安排可用这一实施原因，提出可行性考察。\u003c/td>\n\u003ctd>先摆出一个现象，再补一个原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释学生申请重修、学校安排课程和替换成绩的操作，使可行性建立在明确流程上。\u003c/td>\n\u003ctd>再说这个做法到底是怎样的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>回看最初面向新生的小规模实施条件，再说明扩大到更多学生后需怎样配置资源。\u003c/td>\n\u003ctd>回头解释起点，再说现在变了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明学生既能负担重修时间又可补足关键知识，以学生获得实际帮助证明方案可操作。\u003c/td>\n\u003ctd>先说这件事怎样让一边得利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>说明学校凭现有课程安排和较高留存收益能承担资源投入，展示学校一方的可行条件与所得。\u003c/td>\n\u003ctd>再说另一边也能从中得利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>将双方可承担的成本和实际收益合起来，说明它们为何选择一个能够共同实施的方案。\u003c/td>\n\u003ctd>最后说双方为什么走到一起\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>如果 A 是中心，feasibility 要让全文回答“这件事做不做得到”。第二段介绍重修与成绩处理，确实会让人想到怎样操作，但后面的内容不能停在这里。第三段说实践已经存在几十年，而且近些年使用得更广；它主要追问从最初帮助新生到如今留住学生、获得学费这一路为什么变化，并不是比较实施条件是否成熟。第四段解释学生能学得更好，第五段解释学校可以拿到更多钱，第六段又解释为什么双方都愿意看到这种结果。这些是在说一项已经实行的做法为何获得推动，而非检验大学有无能力把它办成。A 若成立，学校是否排得出重修课程、怎样承担成本、能否执行成绩规则等可行条件应当承担主要论证作用，原文却把篇幅花在动机与利益上。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. listing its long-run effects","level":3,"raw":"**The author examines the practice of grade forgiveness by ______.**\n\n### B. listing its long-run effects\n\n列出它的长期影响","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"B"},"focusId":"focus-q30-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>The author examines the practice of grade forgiveness by ______.\u003c/strong>\u003c/p>\n\u003cp>列出它的长期影响\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. listing its long-run effects","level":3,"raw":"#### 如果 B 概括了全文写法，文章6段应该怎么写？\n\n如果作者主要采用的写法真的是：\n\n列出它的长期影响\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先呈现学生多年成绩变化的现象，再指出长期采用成绩宽免是其中一项原因。 | 先摆出一个现象，再补一个原因 |\n| 第2段 | 解释重修和替换成绩如何运行，以便追踪这种做法累积多年后带来的影响。 | 再说这个做法到底是怎样的 |\n| 第3段 | 回顾最初使用宽免的新生，再比较政策扩大后不同年级多年累积的变化。 | 回头解释起点，再说现在变了 |\n| 第4段 | 列出学生在持续掌握知识、按期毕业和后续就业方面获得的长期好处。 | 先说这件事怎样让一边得利 |\n| 第5段 | 列出大学在多年留存、稳定财政和维持学生满意方面得到的持续收益。 | 再说另一边也能从中得利 |\n| 第6段 | 将双方长期获益连在一起，说明这些多年形成的效果为何使学生与大学持续支持宽免。 | 最后说双方为什么走到一起 |\n\n如果 B 是中心，long-run effects 要求作者把“实行以后，长期变成什么样”作为全文主线。原文确实写 decades ago，也写了 do better、graduate on time 和 more money，但这些信息放在哪里、用来回答什么不同。第三段的几十年前用于说明最初给谁第二次机会，随后改写今天为何让更多人使用；它不是跟踪同一批学生几十年后的结果。第四段的学习成功是学校人员说明推行理由，第五段的更多钱是学校自身的考虑，第六段则把这些理由放回消费者期待。文章列了一些可能的好处，却没有把它们按长期发展展开，也没有持续追踪学生或学校的远期变化。看到时间词和结果词，不能就把整篇变成长期效果清单。\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"B"},"focusId":"focus-q30-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>The author examines the practice of grade forgiveness by ______.\u003c/strong>\u003c/p>\n\u003cp>列出它的长期影响\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-B-1\">\u003ch4>如果 B 概括了全文写法，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>列出它的长期影响\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先呈现学生多年成绩变化的现象，再指出长期采用成绩宽免是其中一项原因。\u003c/td>\n\u003ctd>先摆出一个现象，再补一个原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释重修和替换成绩如何运行，以便追踪这种做法累积多年后带来的影响。\u003c/td>\n\u003ctd>再说这个做法到底是怎样的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>回顾最初使用宽免的新生，再比较政策扩大后不同年级多年累积的变化。\u003c/td>\n\u003ctd>回头解释起点，再说现在变了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>列出学生在持续掌握知识、按期毕业和后续就业方面获得的长期好处。\u003c/td>\n\u003ctd>先说这件事怎样让一边得利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>列出大学在多年留存、稳定财政和维持学生满意方面得到的持续收益。\u003c/td>\n\u003ctd>再说另一边也能从中得利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>将双方长期获益连在一起，说明这些多年形成的效果为何使学生与大学持续支持宽免。\u003c/td>\n\u003ctd>最后说双方为什么走到一起\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>如果 B 是中心，long-run effects 要求作者把“实行以后，长期变成什么样”作为全文主线。原文确实写 decades ago，也写了 do better、graduate on time 和 more money，但这些信息放在哪里、用来回答什么不同。第三段的几十年前用于说明最初给谁第二次机会，随后改写今天为何让更多人使用；它不是跟踪同一批学生几十年后的结果。第四段的学习成功是学校人员说明推行理由，第五段的更多钱是学校自身的考虑，第六段则把这些理由放回消费者期待。文章列了一些可能的好处，却没有把它们按长期发展展开，也没有持续追踪学生或学校的远期变化。看到时间词和结果词，不能就把整篇变成长期效果清单。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. comparing different views on it","level":3,"raw":"**The author examines the practice of grade forgiveness by ______.**\n\n### C. comparing different views on it\n\n比较人们对它的不同看法","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"C"},"focusId":"focus-q30-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-C-0\">\u003cp>\u003cstrong>The author examines the practice of grade forgiveness by ______.\u003c/strong>\u003c/p>\n\u003cp>比较人们对它的不同看法\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. comparing different views on it","level":3,"raw":"#### 如果 C 概括了全文写法，文章6段应该怎么写？\n\n如果作者主要采用的写法真的是：\n\n比较人们对它的不同看法\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先摆出公众对成绩宽免存在不同评价的现象，再指出双方对政策收益的理解不同是意见差异的原因。 | 先摆出一个现象，再补一个原因 |\n| 第2段 | 交代重修和成绩替换的具体规则，使后面对不同观点的比较围绕同一做法展开。 | 再说这个做法到底是怎样的 |\n| 第3段 | 回看最初只帮助新生时的评价，再说明扩大适用范围后利益判断如何发生分歧。 | 回头解释起点，再说现在变了 |\n| 第4段 | 展开学生视角的支持意见，说明他们怎样把补救学习和降低成绩损失看成主要收益。 | 先说这件事怎样让一边得利 |\n| 第5段 | 补充学校管理者的评价，说明他们更重视留存和资源回报，并与学生关注的收益作具体比较。 | 再说另一边也能从中得利 |\n| 第6段 | 比较两类观点为何在各自获益的基础上形成共同支持，指出理由不同而选择相合。 | 最后说双方为什么走到一起 |\n\n如果 C 是中心，comparing different views 应当让不同人的意见彼此比较：谁赞成、谁反对，或同一做法被怎样不同地解释。第四段确有 College officials 与 Jack Miner 的话，第五段也用 That said 转了一下，所以这项值得把两段仔细接起来。可是第四段讲学生的学习好处，第五段补充学校自己的经济需要，两者可以同时成立；第五段没有换来另一方发言，反驳“学生会学得更好”，而是作者继续揭示这项做法为什么也符合学校利益。第三段的过去与现在比较的是使用对象及推行考虑，也不是两派观点。结尾说学校回应消费者期待，把前面的理由归在一起，没有裁判谁的观点更有道理。C 抓到了有人说话和文章有转折，却把“补充另一层原因”改成了“比较不同意见”。\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"C"},"focusId":"focus-q30-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-C-0\">\u003cp>\u003cstrong>The author examines the practice of grade forgiveness by ______.\u003c/strong>\u003c/p>\n\u003cp>比较人们对它的不同看法\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-C-1\">\u003ch4>如果 C 概括了全文写法，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>比较人们对它的不同看法\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先摆出公众对成绩宽免存在不同评价的现象，再指出双方对政策收益的理解不同是意见差异的原因。\u003c/td>\n\u003ctd>先摆出一个现象，再补一个原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>交代重修和成绩替换的具体规则，使后面对不同观点的比较围绕同一做法展开。\u003c/td>\n\u003ctd>再说这个做法到底是怎样的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>回看最初只帮助新生时的评价，再说明扩大适用范围后利益判断如何发生分歧。\u003c/td>\n\u003ctd>回头解释起点，再说现在变了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>展开学生视角的支持意见，说明他们怎样把补救学习和降低成绩损失看成主要收益。\u003c/td>\n\u003ctd>先说这件事怎样让一边得利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>补充学校管理者的评价，说明他们更重视留存和资源回报，并与学生关注的收益作具体比较。\u003c/td>\n\u003ctd>再说另一边也能从中得利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>比较两类观点为何在各自获益的基础上形成共同支持，指出理由不同而选择相合。\u003c/td>\n\u003ctd>最后说双方为什么走到一起\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>如果 C 是中心，comparing different views 应当让不同人的意见彼此比较：谁赞成、谁反对，或同一做法被怎样不同地解释。第四段确有 College officials 与 Jack Miner 的话，第五段也用 That said 转了一下，所以这项值得把两段仔细接起来。可是第四段讲学生的学习好处，第五段补充学校自己的经济需要，两者可以同时成立；第五段没有换来另一方发言，反驳“学生会学得更好”，而是作者继续揭示这项做法为什么也符合学校利益。第三段的过去与现在比较的是使用对象及推行考虑，也不是两派观点。结尾说学校回应消费者期待，把前面的理由归在一起，没有裁判谁的观点更有道理。C 抓到了有人说话和文章有转折，却把“补充另一层原因”改成了“比较不同意见”。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. analyzing the causes behind it","level":3,"raw":"**The author examines the practice of grade forgiveness by ______.**\n\n### D. analyzing the causes behind it\n\n分析它背后的原因","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"D"},"focusId":"focus-q30-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>The author examines the practice of grade forgiveness by ______.\u003c/strong>\u003c/p>\n\u003cp>分析它背后的原因\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. analyzing the causes behind it","level":3,"raw":"#### 如果 D 概括了全文写法，文章6段应该怎么写？\n\n如果作者主要采用的写法真的是：\n\n分析它背后的原因\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从成绩上涨现象出发，在消费化解释之外引出成绩宽免这一相关推动原因。 | 先摆出一个现象，再补一个原因 |\n| 第2段 | 说明重修后仅计最近或最高成绩的方式，为后面解释采用动机明确政策对象。 | 再说这个做法到底是怎样的 |\n| 第3段 | 回顾最初帮助新生适应课程的原因，再解释如今扩大使用与留存、学费和毕业率的关系。 | 回头解释起点，再说现在变了 |\n| 第4段 | 具体说明补救关键课程、学得更好和顺利毕业为何使学生一方愿意利用这种政策。 | 先说这件事怎样让一边得利 |\n| 第5段 | 转向学校的资金与付费满意度，说明政策为何也符合大学自身需要。 | 再说另一边也能从中得利 |\n| 第6段 | 将就业期待与学校培养合格毕业生的利益相连，解释双方为何共同推动成绩宽免。 | 最后说双方为什么走到一起 |\n\n如果 D 是中心，analyzing the causes behind it 就是追问“成绩宽免为何被采用、又为何越来越普遍”。第一段先把它放在成绩上涨和教育消费化里；第二段解释重修与计分的方式，读懂政策之后，第三段才追到最初和现在的推行目的。这一段的 to give、to keep 和 improve，都在说明学校为什么愿意这样做。第四段把学校人员强调的学习理由写具体，第五段用 colleges’ own needs 再补学校自身的资金与付费满意度。两类原因并不相互排斥，反而解释同一做法为什么能得到双方支持。第六段的 Indeed 又把整篇收回回应 consumers’ expectations 的更大背景。D 能容纳开头的现象、政策说明、目的变化以及最后双方所求的连接，也没有把其中一段单独扩成全文。\n\n判断：\n\n**D 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"D"},"focusId":"focus-q30-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>The author examines the practice of grade forgiveness by ______.\u003c/strong>\u003c/p>\n\u003cp>分析它背后的原因\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-D-1\">\u003ch4>如果 D 概括了全文写法，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果作者主要采用的写法真的是：\u003c/p>\n\u003cp>分析它背后的原因\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从成绩上涨现象出发，在消费化解释之外引出成绩宽免这一相关推动原因。\u003c/td>\n\u003ctd>先摆出一个现象，再补一个原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明重修后仅计最近或最高成绩的方式，为后面解释采用动机明确政策对象。\u003c/td>\n\u003ctd>再说这个做法到底是怎样的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>回顾最初帮助新生适应课程的原因，再解释如今扩大使用与留存、学费和毕业率的关系。\u003c/td>\n\u003ctd>回头解释起点，再说现在变了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>具体说明补救关键课程、学得更好和顺利毕业为何使学生一方愿意利用这种政策。\u003c/td>\n\u003ctd>先说这件事怎样让一边得利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转向学校的资金与付费满意度，说明政策为何也符合大学自身需要。\u003c/td>\n\u003ctd>再说另一边也能从中得利\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>将就业期待与学校培养合格毕业生的利益相连，解释双方为何共同推动成绩宽免。\u003c/td>\n\u003ctd>最后说双方为什么走到一起\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>如果 D 是中心，analyzing the causes behind it 就是追问“成绩宽免为何被采用、又为何越来越普遍”。第一段先把它放在成绩上涨和教育消费化里；第二段解释重修与计分的方式，读懂政策之后，第三段才追到最初和现在的推行目的。这一段的 to give、to keep 和 improve，都在说明学校为什么愿意这样做。第四段把学校人员强调的学习理由写具体，第五段用 colleges’ own needs 再补学校自身的资金与付费满意度。两类原因并不相互排斥，反而解释同一做法为什么能得到双方支持。第六段的 Indeed 又把整篇收回回应 consumers’ expectations 的更大背景。D 能容纳开头的现象、政策说明、目的变化以及最后双方所求的连接，也没有把其中一段单独扩成全文。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"30题结论","level":2,"raw":"### 30题结论\n\n**30. D. analyzing the causes behind it**\n\n分析它背后的原因。\n\n据此回到全文，后续题目应保持的理解方向是：\n\n**成绩宽免受到学生与学校共同推动：学生获得重修、毕业和就业机会，学校则从留存、学费、拨款及毕业率中受益。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"question":"30","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>30. D. analyzing the causes behind it\u003c/strong>\u003c/p>\n\u003cp>分析它背后的原因。\u003c/p>\n\u003cp>据此回到全文，后续题目应保持的理解方向是：\u003c/p>\n\u003cp>\u003cstrong>成绩宽免受到学生与学校共同推动：学生获得重修、毕业和就业机会，学校则从留存、学费、拨款及毕业率中受益。\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"26题 · 题干、题型与核心出处","level":2,"raw":"## 26题\n\n> What is commonly regarded as the cause of grade inflation?  \n> 什么通常被看作平均成绩越来越高的原因？\n\n### 题型\n\n原因细节题。题干要求判断“什么通常被看作平均成绩越来越高的原因？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Grade inflation – the gradual increase in average GPAs (grade-point averages) over the past few decades – is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased. But another, related force – a policy often buried deep in course catalogs called \"grade forgiveness\" – is helping raise GPAs.\n\n首句把成绩上涨解释为高等教育消费时代的产物，学生成为需要被取悦的顾客；But another再引出成绩宽免这另一股力量。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"question":"26","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>What is commonly regarded as the cause of grade inflation?\u003cbr>什么通常被看作平均成绩越来越高的原因？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“什么通常被看作平均成绩越来越高的原因？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Grade inflation – the gradual increase in average GPAs (grade-point averages) over the past few decades – is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased. But another, related force – a policy often buried deep in course catalogs called &quot;grade forgiveness&quot; – is helping raise GPAs.\u003c/p>\n\u003c/blockquote>\n\u003cp>首句把成绩上涨解释为高等教育消费时代的产物，学生成为需要被取悦的顾客；But another再引出成绩宽免这另一股力量。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. Colleges’ neglect of GPAs.","level":3,"raw":"### A. Colleges’ neglect of GPAs.\n\n> 大学对平均成绩的忽视。\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A 的 neglect of GPAs 是说大学把平均成绩放在一边；第一段的 helping raise GPAs 则在说大学政策怎样影响成绩，两边都涉及学校对成绩做什么，所以把这句与前面的顾客说法一起看。\n\n**错误类型：第一类——歪曲原意。**\n\n原文先说学生被当成 customers to be pleased，后面又明确写政策正在 helping raise GPAs。学校这边呈现的是回应学生、用政策影响成绩。A 的 neglect of GPAs 却把原因改成学校不在意平均成绩。这里不是“忘了管成绩所以分数涨了”，而是把学生当顾客的做法与另一项提高成绩的政策相联系；忽视成绩不能替代这段已写出的做法。\n\nA 把学校对学生和成绩采取的做法改成“不在意成绩”，与这一段呈现的主动影响成绩不是同一回事。\n\n**命题人借用的原文材料：**\n\n> Grade inflation – the gradual increase in average GPAs (grade-point averages) over the past few decades – is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased. But another, related force – a policy often buried deep in course catalogs called \"grade forgiveness\" – is helping raise GPAs.","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"26","option":"A"},"focusId":"focus-q26-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>大学对平均成绩的忽视。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A 的 neglect of GPAs 是说大学把平均成绩放在一边；第一段的 helping raise GPAs 则在说大学政策怎样影响成绩，两边都涉及学校对成绩做什么，所以把这句与前面的顾客说法一起看。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文先说学生被当成 customers to be pleased，后面又明确写政策正在 helping raise GPAs。学校这边呈现的是回应学生、用政策影响成绩。A 的 neglect of GPAs 却把原因改成学校不在意平均成绩。这里不是“忘了管成绩所以分数涨了”，而是把学生当顾客的做法与另一项提高成绩的政策相联系；忽视成绩不能替代这段已写出的做法。\u003c/p>\n\u003cp>A 把学校对学生和成绩采取的做法改成“不在意成绩”，与这一段呈现的主动影响成绩不是同一回事。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Grade inflation – the gradual increase in average GPAs (grade-point averages) over the past few decades – is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased. But another, related force – a policy often buried deep in course catalogs called &quot;grade forgiveness&quot; – is helping raise GPAs.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. Colleges’ neglect of GPAs.","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 通常认为，成绩膨胀的原因是大学对平均成绩的忽视。\n\nA 的 neglect of GPAs 是说大学把平均成绩放在一边；第一段的 helping raise GPAs 则在说大学政策怎样影响成绩，两边都涉及学校对成绩做什么，所以把这句与前面的顾客说法一起看。\n\n原文先说学生被当成 customers to be pleased，后面又明确写政策正在 helping raise GPAs。学校这边呈现的是回应学生、用政策影响成绩。A 的 neglect of GPAs 却把原因改成学校不在意平均成绩。这里不是“忘了管成绩所以分数涨了”，而是把学生当顾客的做法与另一项提高成绩的政策相联系；忽视成绩不能替代这段已写出的做法。\n\nA 把学校对学生和成绩采取的做法改成“不在意成绩”，与这一段呈现的主动影响成绩不是同一回事。","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"26","option":"A"},"focusId":"focus-q26-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>大学对平均成绩的忽视。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A 的 neglect of GPAs 是说大学把平均成绩放在一边；第一段的 helping raise GPAs 则在说大学政策怎样影响成绩，两边都涉及学校对成绩做什么，所以把这句与前面的顾客说法一起看。\u003c/p>\n\u003c
