ng>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. The change of course catalogs.","level":3,"raw":"### D. The change of course catalogs.\n\n> 课程目录的变化。\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D 的 change of course catalogs 让人注意课程文件的变化，第一段却用 a policy 指明另一股力量；两边都涉及课程安排，但“文件改了”与“政策起作用”不同，所以回看 But another 后面的整句。\n\n**错误类型：第一类——歪曲原意。**\n\n原文这句的主干是 a policy 正在帮助提高平均成绩，often 后面那些词是在补充这项政策的情况。D 的 change of course catalogs 则把做动作的原因换成课程目录的变化。即使课程文件与政策有关，句子也没有说“目录变化正在提高成绩”。再看题干的 commonly：前一句是通常的解释，But another 引进的是另一种原因；D 把后一处的课程文件拿来替代前面明确说出的消费背景，既换了起作用的东西，也错接了题干问的那一种原因。\n\n句子把提高成绩的作用交给 policy，并用 another 区别于前面的常见解释；D 把课程文件改成了起作用的主体。\n\n**命题人借用的原文材料：**\n\n> But another, related force – a policy often buried deep in course catalogs called \"grade forgiveness\" – is helping raise GPAs.","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"26","option":"D"},"focusId":"focus-q26-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-D-0\">\u003cblockquote>\n\u003cp>课程目录的变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D 的 change of course catalogs 让人注意课程文件的变化，第一段却用 a policy 指明另一股力量；两边都涉及课程安排，但“文件改了”与“政策起作用”不同，所以回看 But another 后面的整句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文这句的主干是 a policy 正在帮助提高平均成绩，often 后面那些词是在补充这项政策的情况。D 的 change of course catalogs 则把做动作的原因换成课程目录的变化。即使课程文件与政策有关，句子也没有说“目录变化正在提高成绩”。再看题干的 commonly：前一句是通常的解释，But another 引进的是另一种原因；D 把后一处的课程文件拿来替代前面明确说出的消费背景，既换了起作用的东西，也错接了题干问的那一种原因。\u003c/p>\n\u003cp>句子把提高成绩的作用交给 policy，并用 another 区别于前面的常见解释；D 把课程文件改成了起作用的主体。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But another, related force – a policy often buried deep in course catalogs call 体换成原因，又用But another之后的信息替代首句的commonly解释。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. The change of course catalogs.","level":4,"raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> analyzing the causes behind it  \n> 分析它背后的原因\n\n把这个全文判断直接代入26题题干：\n\n> 全文把成绩政策放在教育消费者期待中，常见解释应落到消费关系，而题干的commonly还要求区分通常解释与后文补充的另一原因。\n\nD实际说的是：\n\n> The change of course catalogs.  \n> 课程目录的变化。\n\n句子把提高成绩的作用交给 policy，并用 another 区别于前面的常见解释；D 把课程文件改成了起作用的主体。\n\n从全文推进看，这一处的作用是：先从平均成绩上涨及教育消费化的通常解释切入，再提出成绩宽免也是提高成绩的一股力量。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"26","option":"D"},"focusId":"focus-q26-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-D-0\">\u003cblockquote>\n\u003cp>课程目录的变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D 的 change of course catalogs 让人注意课程文件的变化，第一段却用 a policy 指明另一股力量；两边都涉及课程安排，但“文件改了”与“政策起作用”不同，所以回看 But another 后面的整句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文这句的主干是 a policy 正在帮助提高平均成绩，often 后面那些词是在补充这项政策的情况。D 的 change of course catalogs 则把做动作的原因换成课程目录的变化。即使课程文件与政策有关，句子也没有说“目录变化正在提高成绩”。再看题干的 commonly：前一句是通常的解释，But another 引进的是另一种原因；D 把后一处的课程文件拿来替代前面明确说出的消费背景，既换了起作用的东西，也错接了题干问的那一种原因。\u003c/p>\n\u003cp>句子把提高成绩的作用交给 policy，并用 another 区别于前面的常见解释；D 把课程文件改成了起作用的主体。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But another, related force – a policy often buried deep in course catalogs called &quot;grade forgiveness&quot; – is helping raise GPAs.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblo 时间切回最初，limited to freshmen与transition说明是给适应大学课程有困难的新生第二次机会。","context":{"mode":"image","asset":"questions","focus":[250,772,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"question":"27","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>What was the original purpose of grade forgiveness?\u003cbr>成绩宽免最初是为了什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>历史目的题。题干要求判断“成绩宽免最初是为了什么？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The use of this little-known practice has accelerated in recent years, as colleges continue to do their utmost to keep students in school (and paying tuition) and improve their graduation rates. When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their transition to college-level courses. But now most colleges, save for many selective campuses, allow all undergraduates, and even graduate students, to get their low grades forgiven.\u003c/p>\n\u003c/blockquote>\n\u003cp>段中When this practice first started把时间切回最初，limited to freshmen与transition说明是给适应大学课程有困难的新生第二次机会。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. To maintain colleges’ graduation rates.","level":3,"raw":"### A. To maintain colleges’ graduation rates.\n\n> 维持大学的毕业率。\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A 的 maintain 指维持某个水平，原文的 improve their graduation rates 也在说学校想达到怎样的毕业率；因此先看这句的时间，再与 first started 引出的过去一句合看。\n\n**错误类型：第一类——歪曲原意。**\n\n原文的 improve their graduation rates 是近些年大学继续推行这种做法时希望取得的结果，方向是提高。A 的 maintain 却说维持，并把它放到 original purpose 的“最初”上。后面的 When this practice first started 已另起一句，明确给出过去的对象和目的：新生第一年遇到课程困难，给一次重学机会。不能把现在提高毕业率的目的往前移，改成当初保持毕业率。\n\nA 同时改了时间和动作：原文近年的 improve 不是最初的 maintain，过去那句落在新生重学课程上。\n\n**命题人借用的原文材料：**\n\n> The use of this little-known practice has accelerated in recent years, as colleges continue to do their utmost to ion dollars, which is another big concern for colleges.","context":{"mode":"image","asset":"questions","focus":[250,1486,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"28","option":"B"},"focusId":"focus-q28-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q28-B-0\">\u003cblockquote>\n\u003cp>提高教学质量\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B 的 teaching quality 指学校实际教得怎样，第五段的 better value for their tuition dollars 则是学生认为学费花得更值；都涉及学生对教育的评价，因此回看段尾这句话，分清究竟是谁觉得什么变好了。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文先写 raises GPAs，再说这会让付钱的学生 feel 自己得到 better value for their tuition dollars。这里变的是成绩，以及学生对花钱是否值当的感受。B 的 teaching quality 却把“学生觉得花得值”改成“大学实际提高了教学质量”，把感受的内容当成教学本身已发生的改善。学生拿到更好看的平均分便觉得满意，并不要求老师的教法、课程内容或教学水平随之提高；第五段给出的获益途径正是成绩与付费感受相连。\u003c/p>\n\u003cp>原文明确说的是 feel，B 却把感受改成教学质量本身的提高，两边所说的变化对象不同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And anything that raises GPAs will likely make students – who, at the end of the day, are paying the bill – feel they&#39;ve gotten a better value for their tuition dollars, which is another big concern for colleges.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. improve their teaching quality","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 根据第5段，成绩宽免能让大学提高教学质量。\n\nB 的 teaching quality 指学校实际教得怎样，第五段的 better value for their tuition dollars 则是学生认为学费花得更值；都涉及学生对教育的评价，因此回看段尾这句话，分清究竟是谁觉得什么变好了。\n\n原文先写 raises GPAs，再说这会让付钱的学生 feel 自己得到 better value for their tuition dollars。这里变的是成绩，以及学生对花钱是否值当的感受。B 的 teaching quality 却把“学生觉得花得值”改成“大学实际提高了教学质量”，把感受的内容当成教学本身已发生的改善。学生拿到更好看的平均分便觉得满意，并不要求老师的教法、课程内容或教学水平随之提高；第五段给出的获益途径正是成绩与付费感受相连。\n\n原文明确说的是 feel，B 却把感受改成教学质量本身的提高，两边所说的变化对象不同。","context":{"mode":"image","a ds","level":3,"raw":"### D. meet local governments’ needs\n\n> 满足地方政府的需要\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D 的 local governments’ needs 把需要的主体写成地方政府，段首的 colleges’ own needs 则明说是大学自己的需要；两边都谈满足谁，所以先看开头，再联系州拨款那句分清政府在这里扮演什么角色。\n\n**错误类型：第三类——无中生有。**\n\n原文用 colleges’ own needs 指出大学是需要获得满足的一方，州资金出现在后面，是大学可能获得的钱。D 的 local governments’ needs 把拨款的一方改成需要被满足的一方。国家或地方提供资金，与学校因此满足自己的资金需要，是两种角色；原文列出的结果还是 more money，钱流向公立学校，并不是学校在满足某项政府要求。\n\nstate funds 说明资金从哪里来，colleges’ own needs 说明这里满足谁；D 把这两个角色换了。\n\n**命题人借用的原文材料：**\n\n> That said, there is a way in which grade forgiveness satisfies colleges' own needs as well.\n>\n> For public institutions, state funds are sometimes tied partly to their success on metrics such as graduation rates and student retention – so better grades can, by boosting figures like those, mean more money.","context":{"mode":"image","asset":"questions","focus":[250,1662,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"28","option":"D"},"focusId":"focus-q28-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q28-D-0\">\u003cblockquote>\n\u003cp>满足地方政府的需要\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D 的 local governments’ needs 把需要的主体写成地方政府，段首的 colleges’ own needs 则明说是大学自己的需要；两边都谈满足谁，所以先看开头，再联系州拨款那句分清政府在这里扮演什么角色。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文用 colleges’ own needs 指出大学是需要获得满足的一方，州资金出现在后面，是大学可能获得的钱。D 的 local governments’ needs 把拨款的一方改成需要被满足的一方。国家或地方提供资金，与学校因此满足自己的资金需要，是两种角色；原文列出的结果还是 more money，钱流向公立学校，并不是学校在满足某项政府要求。\u003c/p>\n\u003cp>state funds 说明资金从哪里来，colleges’ own needs 说明这里满足谁；D 把这两个角色换了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>That said, there is a way in which grade forgiveness satisfies colleges&#39; own needs as well.\u003c/p>\n\u003cp>Fo iveness is to meet local governments’ needs.\u003c/p>\n\u003cp>成绩宽免满足的是地方政府的需要。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文首句点名colleges’ own needs，州政府则是拨款一方。符合拨款指标不自动等于满足地方政府的全部需要，文章没有把讨论对象转到地方政府政策。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q28-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>analyzing the causes behind it\u003cbr>分析它背后的原因\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文说明双方采用宽免的动机，这一段专门写学校自身得益；资金的具体传导仍须依据指标与州拨款挂钩这句话，不能凭主旨推出教学改善或招生人数。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>meet local governments’ needs\u003cbr>满足地方政府的需要\u003c/p>\n\u003c/blockquote>\n\u003cp>state funds 说明资金从哪里来，colleges’ own needs 说明这里满足谁；D 把这两个角色换了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转到学校自身的需要：较好的成绩可能带来更多州资金，也让付学费的学生觉得更值。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"28题结论","level":2,"raw":"### 28题结论\n\n> **28. A. obtain more financial support**\n\nA：原文说 state funds 有时部分取决于学校在某些方面的表现，后面紧接 so，落到 better grades 可以意味着 more money。\n\nB：原文先写 raises GPAs，再说这会让付钱的学生 feel 自己得到 better value for their tuition dollars。\n\nC：enrollments指招生或入学人数；原文student retention指让已在校的学生继续留下。\n\nD：原文用 colleges’ own needs 指出大学是需要获得满足的一方，州资金出现在后面，是大学可能获得的钱。","context":{"mode":"image","asset":"questions","focus":[250,1300,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"question":"28","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>28. A. obtain more financial support\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文说 state funds 有时部分取决于学校在某些方面的表现，后面紧接 so，落到 better grades 可以意味着 more money。\u003c/p>\n\u003cp>B：原文先写 raises GPAs，再说这会让付钱的学生 feel 自己得到 better value for their tuition dollars。\u003c/p>\n\u003cp>C：enrollments指招生或入学人数；原文student retention指让已在校的学生继续留下。\u003c/p>\n\u003cp>D：原文用 colleges’ own needs 指出大学是需要获得满足的一方，州资金出现在后面，是大学可能获得的钱。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"29题 · 题干、题型与核心出处","level":2,"raw":"## 29题\n\n> What does the phrase “to be aligned” (Para. 6) most probably mean?  \n> 第六段中的 to be aligned 最可能是什么意思？\n\n### 题型\n\n语境词义题。题干要求判断“第六段中的 to be aligned 最可能是什么意思？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Indeed, grade forgiveness is just another way that universities are responding to consumers' expectations for higher education. Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be. On this, students' and colleges' incentives seem to be aligned.\n\n学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少看起来合格的毕业生；On this把共同方向限定在这一点上。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"question":"29","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>What does the phrase “to be aligned” (Para. 6) most probably mean?\u003cbr>第六段中的 to be aligned 最可能是什么意思？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>语境词义题。题干要求判断“第六段中的 to be aligned 最可能是什么意思？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Indeed, grade forgiveness is just another way that universities are responding to consumers&#39; expectations for higher education. Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be. On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003c/blockquote>\n\u003cp>学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少看起来合格的毕业生；On this把共同方向限定在这一点上。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. To counterbalance each other.","level":3,"raw":"### A. To counterbalance each other.\n\n> 相互制衡。\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“To [xxx] each other.”，保留了相应遮挡。当时的定位线索是：A 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。读完全文后，做题模式再经交叉验证排除A，最终选择C。\n\n**错误类型：第一类——歪曲原意。**\n\ncounterbalance表示相互制衡、抵消。第6段先说学生希望学位通向工作，再说学校也希望毕业生尽可能合格，或至少看起来合格；两边并未被安排为阻挡对方目标的力量。\n\nOn this说明只在这一点上比较动机，aligned概括双方方向一致。A保留了each other的双方形式，却把共同追求合格毕业生改成相互牵制；不能因为都有双方，就忽略动词规定的关系。\n\n**命题人借用的原文材料：**\n\n> Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\n>\n> On this, students' and colleges' incentives seem to be aligned.","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"29","option":"A"},"focusId":"focus-q29-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-A-0\">\u003cblockquote>\n\u003cp>相互制衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“To [xxx] each other.”，保留了相应遮挡。当时的定位线索是：A 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>counterbalance表示相互制衡、抵消。第6段先说学生希望学位通向工作，再说学校也希望毕业生尽可能合格，或至少看起来合格；两边并未被安排为阻挡对方目标的力量。\u003c/p>\n\u003cp>On this说明只在这一点上比较动机，aligned概括双方方向一致。A保留了each other的双方形式，却把共同追求合格毕业生改成相互牵制；不能因为都有双方，就忽略动词规定的关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003cp>On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. To counterbalance each other.","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第6段的to be aligned表示双方的动机相互制衡。\n\nA 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。\n\ncounterbalance表示相互制衡、抵消。第6段先说学生希望学位通向工作，再说学校也希望毕业生尽可能合格，或至少看起来合格；两边并未被安排为阻挡对方目标的力量。\n\nOn this说明只在这一点上比较动机，aligned概括双方方向一致。A保留了each other的双方形式，却把共同追求合格毕业生改成相互牵制；不能因为都有双方，就忽略动词规定的关系。\n\n学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少看起来合格的毕业生；On this把共同方向限定在这一点上。\n\n制衡需要一方的力量限制另一方。实际两边都想让毕业生显得更合格，后一句收束共同方向，没有建立相互抵消的关系。","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"29","option":"A"},"focusId":"focus-q29-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-A-0\">\u003cblockquote>\n\u003cp>相互制衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“To [xxx] each other.”，保留了相应遮挡。当时的定位线索是：A 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>counterbalance表示相互制衡、抵消。第6段先说学生希望学位通向工作，再说学校也希望毕业生尽可能合格，或至少看起来合格；两边并未被安排为阻挡对方目标的力量。\u003c/p>\n\u003cp>On this说明只在这一点上比较动机，aligned概括双方方向一致。A保留了each other的双方形式，却把共同追求合格毕业生改成相互牵制；不能因为都有双方，就忽略动词规定的关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003cp>On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第6段的to be aligned表示双方的动机相互制衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>A 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。\u003c/p>\n\u003cp>counterbalance表示相互制衡、抵消。第6段先说学生希望学位通向工作，再说学校也希望毕业生尽可能合格，或至少看起来合格；两边并未被安排为阻挡对方目标的力量。\u003c/p>\n\u003cp>On this说明只在这一点上比较动机，aligned概括双方方向一致。A保留了each other的双方形式，却把共同追求合格毕业生改成相互牵制；不能因为都有双方，就忽略动词规定的关系。\u003c/p>\n\u003cp>学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少看起来合格的毕业生；On this把共同方向限定在这一点上。\u003c/p>\n\u003cp>制衡需要一方的力量限制另一方。实际两边都想让毕业生显得更合格，后一句收束共同方向，没有建立相互抵消的关系。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. To counterbalance each other.","level":4,"raw":"#### 写作视角法\n\n原文第6段是这样写的：\n\n> Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\n>\n> On this, students' and colleges' incentives seem to be aligned.\n>\n> 学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少看起来合格的毕业生；On this把共同方向限定在这一点上。\n\n把这一处放回全文，它承担的写作任务是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> On this issue, students’ and colleges’ incentives counterbalance one another.\n>\n> 在这个问题上，学生与大学的动机相互制衡。\n\n制衡需要一方的力量限制另一方。实际两边都想让毕业生显得更合格，后一句收束共同方向，没有建立相互抵消的关系。","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"29","option":"A"},"focusId":"focus-q29-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-A-0\">\u003cblockquote>\n\u003cp>相互制衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“To [xxx] each other.”，保留了相应遮挡。当时的定位线索是：A 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>counterbalance表示相互制衡、抵消。第6段先说学生希望学位通向工作，再说学校也希望毕业生尽可能合格，或至少看起来合格；两边并未被安排为阻挡对方目标的力量。\u003c/p>\n\u003cp>On this说明只在这一点上比较动机，aligned概括双方方向一致。A保留了each other的双方形式，却把共同追求合格毕业生改成相互牵制；不能因为都有双方，就忽略动词规定的关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003cp>On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第6段的to be aligned表示双方的动机相互制衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>A 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。\u003c/p>\n\u003cp>counterbalance表示相互制衡、抵消。第6段先说学生希望学位通向工作，再说学校也希望毕业生尽可能合格，或至少看起来合格；两边并未被安排为阻挡对方目标的力量。\u003c/p>\n\u003cp>On this说明只在这一点上比较动机，aligned概括双方方向一致。A保留了each other的双方形式，却把共同追求合格毕业生改成相互牵制；不能因为都有双方，就忽略动词规定的关系。\u003c/p>\n\u003cp>学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少看起来合格的毕业生；On this把共同方向限定在这一点上。\u003c/p>\n\u003cp>制衡需要一方的力量限制另一方。实际两边都想让毕业生显得更合格，后一句收束共同方向，没有建立相互抵消的关系。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003cp>On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003cp>学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少 3cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003cp>On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第6段的to be aligned表示双方的动机相互制衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>A 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。\u003c/p>\n\u003cp>counterbalance表示相互制衡、抵消。第6段先说学生希望学位通向工作，再说学校也希望毕业生尽可能合格，或至少看起来合格；两边并未被安排为阻挡对方目标的力量。\u003c/p>\n\u003cp>On this说明只在这一点上比较动机，aligned概括双方方向一致。A保留了each other的双方形式，却把共同追求合格毕业生改成相互牵制；不能因为都有双方，就忽略动词规定的关系。\u003c/p>\n\u003cp>学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少看起来合格的毕业生；On this把共同方向限定在这一点上。\u003c/p>\n\u003cp>制衡需要一方的力量限制另一方。实际两边都想让毕业生显得更合格，后一句收束共同方向，没有建立相互抵消的关系。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003cp>On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003cp>学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少看起来合格的毕业生；On this把共同方向限定在这一点上。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>On this issue, students’ and colleges’ incentives counterbalance one another.\u003c/p>\n\u003cp>在这个问题上，学生与大学的动机相互制衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>制衡需要一方的力量限制另一方。实际两边都想让毕业生显得更合格，后一句收束共同方向，没有建立相互抵消的关系。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>analyzing the causes behind it\u003cbr>分析它背后的原因\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文解释学生与学校为何共同接受宽免，本段的主旨方向是利益诉求在这一点上相合；具体词义须依双方并列的期待，而非任意套用同话题词。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>To counterbalance each other.\u003cbr>相互制衡。\u003c/p>\n\u003c/blockquote>\n\u003cp>On this说明只在这一点上比较动机，aligned概括双方方向一致。A保留了each other的双方形式，却把共同追求合格毕业生改成相互牵制；不能因为都有双方，就忽略动词规定的关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. To be contradictory to each other.","level":3,"raw":"### B. To be contradictory to each other.\n\n> 相互矛盾。\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B 的 contradictory 是说两边冲突，原文的 best interest 却用来说明学校怎样从学生希望的结果中得益；两者都在解释双方关系，所以把 Since 开头的因果句与最后一句一起看。\n\n**错误类型：第一类——歪曲原意。**\n\n原文说学生与家长希望学位带来工作，接着用 Since 把这一期待连到学校的 best interest：学校培养符合这一期待的毕业生，也有利于自己。B 的 contradictory 则要求学生想要的结果损害学校、或学校想做的事违背学生期待。这里写的恰恰是学校顺着学生的期待行动也能得益，双方在这件事上并不是朝相反方向走。\n\n学生所求与学校利益在这句里被连在一起，B 却改成冲突，方向相反。\n\n**命题人借用的原文材料：**\n\n> Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\n>\n> On this, students' and colleges' incentives seem to be aligned.","context":{"mode":"image","asset":"questions","focus":[250,2015,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"29","option":"B"},"focusId":"focus-q29-B-0"," 全文，它承担的写作任务是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Students’ and colleges’ incentives point in the same direction on this issue.\n>\n> 在这个问题上，学生与大学的动机指向同一方向。\n\nOn this防止把一致扩大为所有利益完全相同；在让学位体现就业资格这一点上，学生的期待与学校利益对上，符合aligned的语境。","context":{"mode":"image","asset":"questions","focus":[250,2102,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"29","option":"C"},"focusId":"focus-q29-C-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-C-0\">\u003cblockquote>\n\u003cp>相互一致。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C 的 identical 是相同或一致，原文的 On this 将比较限定在刚才说的事情上；因此回看它前面学生的期望与学校的利益，判断相同的究竟是哪一方面。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文的 On this 限定了范围：谈的是让大学培养的毕业生符合学生、家长对就业的期待这件事。学生希望大学学位有这种结果，学校也觉得顺着这种期待培养毕业生对自己最有利。C 的 identical 放回这个范围，指双方在这件事上的方向相同，不是说学生和大学身份相同，也不是说双方所有需要都完全一样。两边希望出现的结果能接到一起，C 可以解释这里的关系。\u003c/p>\n\u003cp>On this 把范围限定在同一件事，前句又把学生所盼与学校最有利的做法连接起来，C 的“一致”可以接住。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003cp>On this, students&#39; and colleges&#39; incentives seem to be aligned.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第6段的to be aligned表示双方的动机相互一致。\u003c/p>\n\u003c/blockquote>\n\u003cp>C 的 identical 是相同或一致，原文的 On this 将比较限定在刚才说的事情上；因此回看它前面学生的期望与学校的利益，判断相同的究竟是哪一方面。\u003c/p>\n\u003cp>原文的 On this 限定了范围：谈的是让大学培养的毕业生符合学生、家长对就业的期待这件事。学生希望大学学位有这种结果，学校 e aligned.\u003c/p>\n\u003cp>学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少看起来合格的毕业生；On this把共同方向限定在这一点上。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Students’ and colleges’ incentives point in the same direction on this issue.\u003c/p>\n\u003cp>在这个问题上，学生与大学的动机指向同一方向。\u003c/p>\n\u003c/blockquote>\n\u003cp>On this防止把一致扩大为所有利益完全相同；在让学位体现就业资格这一点上，学生的期待与学校利益对上，符合aligned的语境。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>analyzing the causes behind it\u003cbr>分析它背后的原因\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文解释学生与学校为何共同接受宽免，本段的主旨方向是利益诉求在这一点上相合；具体词义须依双方并列的期待，而非任意套用同话题词。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>To be identical with each other.\u003cbr>相互一致。\u003c/p>\n\u003c/blockquote>\n\u003cp>On this 把范围限定在同一件事，前句又把学生所盼与学校最有利的做法连接起来，C 的“一致”可以接住。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. To complement each other.","level":3,"raw":"### D. To complement each other.\n\n> 相互补充。\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D 的 complement 是一方补另一方所缺，原文的 responding to consumers’ expectations 写的却是大学回应消费者期待；两处都描述双方怎样联系，所以回看第一句，并接上随后具体的就业期待。\n\n**错误类型：第一类——歪曲原意。**\n\n原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。D 的 complement 则写成双方各缺一部分、由对方补上。前文两边反复落在同一个期待上，不是分别提供两种不同部分；“大学回应学生所求”不能改写成“学生和大学互相补足”。\n\n原文在解释两边为何追求同一结果，D 却把这种联系写成互相补足不同部分，改变了双方的关系。\n\n**命题人借用的原文材料：**\n\n> Indeed, grade forgiveness is just another way that universities are responding to consumers' expectations for higher education.\n>\n> Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.","context":{"mode":"image","asset":"questions","focus":[250,2191,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"29","option":"D"},"focusId":"focus-q29-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-D-0\">\u003cblockquote>\n\u003cp>相互补充。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D 的 complement 是一方补另一方所缺，原文的 responding to consumers’ expectations 写的却是大学回应消费者期待；两处都描述双方怎样联系，所以回看第一句，并接上随后具体的就业期待。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。D 的 complement 则写成双方各缺一部分、由对方补上。前文两边反复落在同一个期待上，不是分别提供两种不同部分；“大学回应学生所求”不能改写成“学生和大学互相补足”。\u003c/p>\n\u003cp>原文在解释两边为何追求同一结果，D 却把这种联系写成互相补足不同部分，改变了双方的关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Indeed, grade forgiveness is just another way that universities are responding to consumers&#39; expectations for higher education.\u003c/p>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. To complement each other.","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 第6段的to be aligned表示双方的动机相互补充。\n\nD 的 complement 是一方补另一方所缺，原文的 responding to consumers’ expectations 写的却是大学回应消费者期待；两处都描述双方怎样联系，所以回看第一句，并接上随后具体的就业期待。\n\n原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。D ction>"},{"section":"第三鸟 · 题目复盘","title":"D. To complement each other.","level":4,"raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> analyzing the causes behind it  \n> 分析它背后的原因\n\n把这个全文判断直接代入29题题干：\n\n> 全文解释学生与学校为何共同接受宽免，本段的主旨方向是利益诉求在这一点上相合；具体词义须依双方并列的期待，而非任意套用同话题词。\n\nD实际说的是：\n\n> To complement each other.  \n> 相互补充。\n\n原文在解释两边为何追求同一结果，D 却把这种联系写成互相补足不同部分，改变了双方的关系。\n\n从全文推进看，这一处的作用是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,2191,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"29","option":"D"},"focusId":"focus-q29-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-D-0\">\u003cblockquote>\n\u003cp>相互补充。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D 的 complement 是一方补另一方所缺，原文的 responding to consumers’ expectations 写的却是大学回应消费者期待；两处都描述双方怎样联系，所以回看第一句，并接上随后具体的就业期待。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。D 的 complement 则写成双方各缺一部分、由对方补上。前文两边反复落在同一个期待上，不是分别提供两种不同部分；“大学回应学生所求”不能改写成“学生和大学互相补足”。\u003c/p>\n\u003cp>原文在解释两边为何追求同一结果，D 却把这种联系写成互相补足不同部分，改变了双方的关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Indeed, grade forgiveness is just another way that universities are responding to consumers&#39; expectations for higher education.\u003c/p>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-D-1\">\u003ch3>定位比对法\u003 u003cbr>相互补充。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文在解释两边为何追求同一结果，D 却把这种联系写成互相补足不同部分，改变了双方的关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"29题结论","level":2,"raw":"### 29题结论\n\n> **29. C. To be identical with each other.**\n\nA：counterbalance表示相互制衡、抵消。\n\nB：原文说学生与家长希望学位带来工作，接着用 Since 把这一期待连到学校的 best interest：学校培养符合这一期待的毕业生，也有利于自己。\n\nC：原文的 On this 限定了范围：谈的是让大学培养的毕业生符合学生、家长对就业的期待这件事。\n\nD：原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 2题目"},"meta":{"question":"29","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>29. C. To be identical with each other.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：counterbalance表示相互制衡、抵消。\u003c/p>\n\u003cp>B：原文说学生与家长希望学位带来工作，接着用 Since 把这一期待连到学校的 best interest：学校培养符合这一期待的毕业生，也有利于自己。\u003c/p>\n\u003cp>C：原文的 On this 限定了范围：谈的是让大学培养的毕业生符合学生、家长对就业的期待这件事。\u003c/p>\n\u003cp>D：原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：成绩膨胀的两个原因**（段落1引入主题） 传统认知：成绩膨胀是消费时代的产物（学生被当作顾客）// 另一个原因：成绩宽恕政策也在推高绩点\n\n↓（政策解释）\n\n**逻辑层次2：成绩宽恕的定义与演变**（段落2-3政策内容） 政策定义：允许重修低分课程，只计算最高分或最近分数 → 历史演变：【最初：仅限新生适应大学过渡 → 现在：扩展到所有本科生甚至研究生（除精英学校）】→ 加速原因：大学努力留住学生（保证学费）+ 提高毕业率\n\n↓（官方解释）\n\n**逻辑层次3：官方对政策目标的解释**（段落4表面理由） 官方强调：不是为了成绩本身 → 而是鼓励学生重修关键课程而不受惩罚 → 俄亥俄州立大学案例：学生重修后在后续课程表现更好，能按时毕业\n\n//（深层动机）\n\n**逻辑层次4：大学的实际利益考量**（段落5真实动机） 经济动机：【公立大学：州资金与毕业率等指标挂钩 → 更好成绩=更多资金】+ 市场动机：【提高绩点让学生感觉物有所值（学生是付费者）】\n\n↑（本质分析）\n\n**逻辑层次5：消费主义视角下的利益一致**（段落6总结升华） 本质：成绩宽恕是大学回应消费者期望的方式 → 共同目标：学生和家长期望学位带来工作 → 学校需要培养看起来合格的毕业生 → 结论：学生和大学的动机一致\n\n全文核心观点：成绩宽恕表面上是为了帮助学生，实际上是高等教育消费主义时代的产物，既满足了学生获得高分的需求，也满足了大学提高指标获得资金的需求，双方利益在此达成一致。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：成绩膨胀的两个原因\u003c/strong>（段落1引入主题） 传统认知：成绩膨胀是消费时代的产物（学生被当作顾客）// 另一个原因：成绩宽恕政策也在推高绩点\u003c/p>\n\u003cp>↓（政策解释）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：成绩宽恕的定义与演变\u003c/strong>（段落2-3政策内容） 政策定义：允许重修低分课程，只计算最高分或最近分数 → 历史演变：【最初：仅限新生适应大学过渡 → 现在：扩展到所有本科生甚至研究生（除精英学校）】→ 加速原因：大学努力留住学生（保证学费）+ 提高毕业率\u003c/p>\n\u003cp>↓（官方解释）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：官方对政策目标的解释\u003c/strong>（段落4表面理由） 官方强调：不是为了成绩本身 → 而是鼓励学生重修关键课程而不受惩罚 → 俄亥俄州立大学案例：学生重修后在后续课程表现更好，能按时毕业\u003c/p>\n\u003cp>//（深层动机）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：大学的实际利益考量\u003c/strong>（段落5真实动机） 经济动机：【公立大学：州资金与毕业率等指标挂钩 → 更好成绩=更多资金】+ 市场动机：【提高绩点让学生感觉物有所值（学生是付费者）】\u003c/p>\n\u003cp>↑（本质分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：消费主义视角下的利益一致\u003c/strong>（段落6总结升华） 本质：成绩宽恕是大学回应消费者期望的方式 → 共同目标：学生和家长期望学位带来工作 → 学校需要培养看起来合格的毕业生 → 结论：学生和大学的动机一致\u003c/p>\n\u003cp>全文核心观点：成绩宽恕表面上是为了帮助学生，实际上是高等教育消费主义时代的产物，既满足了学生获得高分的需求，也满足了大学提高指标获得资金的需求，双方利益在此达成一致。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n【答案】C. Replacing a Past Failure in the Grade Average\n\n> 替换平均成绩中的旧低分\n\n这一部分解释重修宽免怎样改变平均成绩计算，并区分计算规则变化与学习表现改善。\n\n段落先区分两次考试，再追问旧分数如何处理：\n\n> The question is what happens to the first mark.\n\n问题不是是否允许重修，而是计算平均成绩时，第一次低分还占不占位置。\n\n核心机制由这一句给出：\n\n> Under grade-forgiveness policies, the later or higher grade can replace the earlier one when the institution calculates the student’s grade-point average.\n\n后一次或更高分数替代旧分参与平均成绩计算。后面承认旧成绩可能仍出现在其他记录中，因此“替换”不能扩大为抹去全部历史。\n\n最后一句说明该机制为什么与分数上升有关：\n\n> As a result, an improvement in the reported average can reflect a new calculation rule as well as improved performance.\n\n平均分上升可能同时来自表现改善与算法改变；段落解释宽免政策的运作方式，尚未评判所有学生是否真的学得更好。\n\n这一部分的推进关系是：\n\n> 重修获得新分数 → 旧分是否计入成为问题 → 新分替换旧分参与计算 → 平均成绩提高可能包含规则因素\n\n`Replacing`对应`replace`；`a Past Failure`对应第一次低分；`in the Grade Average`精确限定替换发生在平均成绩计算中，避免误读为删除所有考试记录。\n\n再看最强干扰项E：When Better Records Outrun Better Education。\n\n末句提示成绩与能力未必同步，但主体仍在定义政策的计算机制，没有展开教育质量落后于记录改善的风险。该风险标题适合评价段，不能代替本段的规则说明。\n\n**41题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】C. Replacing a Past Failure in the Grade Average\u003c/p>\n\u003cblockquote>\n\u003cp>替换平均成绩中的旧低分\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释重修宽免怎样改变平均成绩计算，并区分计算规则变化与学习表现改善。\u003c/p>\n\u003cp>段落先区分两次考试，再追问旧分数如何处理：\u003c/p>\n\u003cblockquote>\n\u003cp>The question is what happens to the first mark.\u003c/p>\n\u003c/blockquote>\n\u003cp>问题不是是否允许重修，而是计算平均成绩时，第一次低分还占不占位置。\u003c/p>\n\u003cp>核心机制由这一句给出：\u003c/p>\n\u003cblockquote>\n\u003cp>Under grade-forgiveness policies, the later or higher grade can replace the earlier one when the institution calculates the student’s grade-point average.\u003c/p>\n\u003c/blockquote>\n\u003cp>后一次或更高分数替代旧分参与平均成绩计算。后面承认旧成绩可能仍出现在其他记录中，因此“替换”不能扩大为抹去全部历史。\u003c/p>\n\u003cp>最后一句说明该机制为什么与分数上升有关：\u003c/p>\n\u003cblockquote>\n\u003cp>As a result, an improvement in the reported average can reflect a new calculation rule as well as improved performance.\u003c/p>\n\u003c/blockquote>\n\u003cp>平均分上升可能同时来自表现改善与算法改变；段落解释宽免政策的运作方式，尚未评判所有学生是否真的学得更好。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>重修获得新分数 → 旧分是否计入成为问题 → 新分替换旧分参与计算 → 平均成绩提高可能包含规则因素\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Replacing\u003c/code>对应\u003ccode>replace\u003c/code>；\u003ccode>a Past Failure\u003c/code>对应第一次低分；\u003ccode>in the Grade Average\u003c/code>精确限定替换发生在平均成绩计算中，避免误读为删除所有考试记录。\u003c/p>\n\u003cp>再看最强干扰项E：When Better Records Outrun Better Education。\u003c/p>\n\u003cp>末句提示成绩与能力未必同步，但主体仍在定义政策的计算机制，没有展开教育质量落后于记录改善的风险。该风险标题适合评价段，不能代替本段的规则说明。\u003c/p>\n\u003cp>\u003cstrong>41题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】G. A Second Chance That Reached More Students\n\n> 惠及更多学生的第二次机会\n\n这一部分按时间展示政策从新生过渡保护扩展到更多在校学生的过程。\n\n起点是一类特定学生及其处境：\n\n> It first gave newcomers some protection while they adjusted to the unfamiliar demands of university study.\n\n最初服务新生，理由是他们需要适应大学；第一学期低分未必等于没有长期学习能力。\n\n`however`以后改变的是覆盖范围：\n\n> Over time, however, institutions extended the opportunity beyond the beginning of undergraduate life.\n\n机会不再局限于本科起步阶段，随后补充高年级乃至研究生，明确了扩大的对象。\n\n作者自己对变化作了归纳：\n\n> The change was therefore one of reach: a limited allowance for an early transition became a more general route back from academic difficulty.\n\n`reach`和从`limited`到`more general`概括适用范围扩大；不是说政策原理完全改变，也不是说新生人数增长。\n\n这一部分的推进关系是：\n\n> 最初帮助新生适应 → 低分可能只是过渡困难 → 政策扩展至高年级和研究生 → 特定过渡保护变成更广泛的补救机会\n\n`Second Chance`概括再次学习和补救的机会；`Reached More Students`对应`extended`及本科起点以外的受益者，准确抓住本段的时间推进与范围变化。\n\n再看最强干扰项A：Attracting a Larger Entering Class。\n\n两者都有“更多学生”，但干扰项讲吸引更多新生入学。本段列出的高年级和研究生已经在校，讨论的是更多人获得政策资格，不能把受益范围扩大改成招生规模扩大。\n\n**42题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】G. A Second Chance That Reached More Students\u003c/p>\n\u003cblockquote>\n\u003cp>惠及更多学生的第二次机会\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分按时间展示政策从新生过渡保护扩展到更多在校学生的过程。\u003c/p>\n\u003cp>起点是一类特定学生及其处境：\u003c/p>\n\u003cblockquote>\n\u003cp>It first gave newcomers some protection while they adjusted to the unfamiliar demands of university study.\u003c/p>\n\u003c/blockquote>\n\u003cp>最初服务新生，理由是他们需要适应大学；第一学期低分未必等于没有长期学习能力。\u003c/p>\n\u003cp>\u003ccode>however\u003c/code>以后改变的是覆盖范围：\u003c/p>\n\u003cblockquote>\n\u003cp>Over time, however, institutions extended the opportunity beyond the beginning of undergraduate life.\u003c/p>\n\u003c/blockquote>\n\u003cp>机会不再局限于本科起步阶段，随后补充高年级乃至研究生，明确了扩大的对象。\u003c/p>\n\u003cp>作者自己对变化作了归纳：\u003c/p>\n\u003cblockquote>\n\u003cp>The change was therefore one of reach: a limited allowance for an early transition became a more general route back from academic difficulty.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>reach\u003c/code>和从\u003ccode>limited\u003c/code>到\u003ccode>more general\u003c/code>概括适用范围扩大；不是说政策原理完全改变，也不是说新生人数增长。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>最初帮助新生适应 → 低分可能只是过渡困难 → 政策扩展至高年级和研究生 → 特定过渡保护变成更广泛的补救机会\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Second Chance\u003c/code>概括再次学习和补救的机会；\u003ccode>Reached More Students\u003c/code>对应\u003ccode>extended\u003c/code>及本科起点以外的受益者，准确抓住本段的时间推进与范围变化。\u003c/p>\n\u003cp>再看最强干扰项A：Attracting a Larger Entering Class。\u003c/p>\n\u003cp>两者都有“更多学生”，但干扰项讲吸引更多新生入学。本段列出的高年级和研究生已经在校，讨论的是更多人获得政策资格，不能把受益范围扩大改成招生规模扩大。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n【答案】B. Making Recovery Serve Real Learning\n\n> 让补救机会服务于真正的学习\n\n这一部分说明第二次机会的教育价值，同时要求重修必须带来更强的理解。\n\n数学课例子首先说明第二次机会能挽回什么：\n\n> Someone who struggles with an essential mathematics course can return to the material instead of abandoning a degree that depends on it.\n\n学生可以重学必修内容，不必因一次挫败放弃整个学位。下一句还说明旧低分不再永久拖累平均成绩，可能降低挑战难课的恐惧。\n\n`But`为这些好处加上学习条件：\n\n> But repeating the course is useful only if the second attempt brings stronger understanding.\n\n有价值的不只是重新登记一个分数，而是理解加深。教师和顾问找出先前困难、指导重学，都是让这一条件实现的办法。\n\n结尾明确手段与目的：\n\n> On this account, forgiveness is a means of making recovery possible, not a substitute for learning what the course requires.\n\n宽免提供恢复学习的机会，却不能代替课程要求；因此标题必须同时覆盖“补救”和“真实学习”。\n\n这一部分的推进关系是：\n\n> 允许重学关键课程 → 减少一次失败的持续惩罚 → 重学必须带来理解提升 → 教学支持把补救转化为真实学习\n\n`Recovery`对应从必修课失败中恢复；`Serve Real Learning`对应`stronger understanding`和满足课程要求。标题保留了本段“机会有价值，但必须用来学习”的条件。\n\n再看最强干扰项D：Removing Difficult Subjects from the Curriculum。\n\n难学的数学课确实出现，但学生被鼓励重学它，而非把它从课程体系删除。末句还坚持`what the course requires`，与取消难课的方向相反。\n\n**43题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】B. Making Recovery Serve Real Learning\u003c/p>\n\u003cblockquote>\n\u003cp>让补救机会服务于真正的学习\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分说明第二次机会的教育价值，同时要求重修必须带来更强的理解。\u003c/p>\n\u003cp>数学课例子首先说明第二次机会能挽回什么：\u003c/p>\n\u003cblockquote>\n\u003cp>Someone who struggles with an essential mathematics course can return to the material instead of abandoning a degree that depends on it.\u003c/p>\n\u003c/blockquote>\n\u003cp>学生可以重学必修内容，不必因一次挫败放弃整个学位。下一句还说明旧低分不再永久拖累平均成绩，可能降低挑战难课的恐惧。\u003c/p>\n\u003cp>\u003ccode>But\u003c/code>为这些好处加上学习条件：\u003c/p>\n\u003cblockquote>\n\u003cp>But repeating the course is useful only if the second attempt brings stronger understanding.\u003c/p>\n\u003c/blockquote>\n\u003cp>有价值的不只是重新登记一个分数，而是理解加深。教师和顾问找出先前困难、指导重学，都是让这一条件实现的办法。\u003c/p>\n\u003cp>结尾明确手段与目的：\u003c/p>\n\u003cblockquote>\n\u003cp>On this account, forgiveness is a means of making recovery possible, not a substitute for learning what the course requires.\u003c/p>\n\u003c/blockquote>\n\u003cp>宽免提供恢复学习的机会，却不能代替课程要求；因此标题必须同时覆盖“补救”和“真实学习”。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>允许重学关键课程 → 减少一次失败的持续惩罚 → 重学必须带来理解提升 → 教学支持把补救转化为真实学习\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Recovery\u003c/code>对应从必修课失败中恢复；\u003ccode>Serve Real Learning\u003c/code>对应\u003ccode>stronger understanding\u003c/code>和满足课程要求。标题保留了本段“机会有价值，但必须用来学习”的条件。\u003c/p>\n\u003cp>再看最强干扰项D：Removing Difficult Subjects from the Curriculum。\u003c/p>\n\u003cp>难学的数学课确实出现，但学生被鼓励重学它，而非把它从课程体系删除。末句还坚持\u003ccode>what the course requires\u003c/code>，与取消难课的方向相反。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】F. The Financial Return from Keeping Students\n\n> 留住学生带来的经济回报\n\n这一部分转到学校一方，用学费与可能的拨款收益解释留住已有学生的经济动机。\n\n主体从学生切换为学校：\n\n> A student who remains enrolled continues to pay tuition, whereas one who drops out takes future fee income away.\n\n`remains`与`drops out`形成对照：同一个已入学学生是否留下，决定学校能否继续收到学费。\n\n另一笔收入与学生完成学业相连：\n\n> Where public support is partly linked to retention or graduation, helping students stay and complete their degrees can also improve the institution’s funding position.\n\n在拨款部分取决于留存或毕业表现的情形下，帮助学生留下和毕业也有财政好处；`Where`限定条件，不能扩大为所有地区统一如此。\n\n作者随后排除招生规模解释：\n\n> These incentives concern the progress of students already admitted; they do not require a larger intake of new students.\n\n经济激励来自已有学生继续就读及毕业，不以招更多新生为前提。末句据此解释管理者为何支持扩大政策适用。\n\n这一部分的推进关系是：\n\n> 已有学生留下继续缴费 → 留存和毕业表现还可能影响拨款 → 宽免有助于保护学校收入 → 教育理由与经济动机可以同时存在\n\n`Keeping Students`对应`remains enrolled`、`retention`及`already admitted`；`Financial Return`对应学费与可能获得的公共支持，完整覆盖本段的两条收入联系。\n\n再看最强干扰项A：Attracting a Larger Entering Class。\n\n吸引更多新生也可能增加学费，但这是原文专门否定的解释。`do not require a larger intake`说明留存已入学者与扩大招生是不同机制，不能仅因都涉及收入就替换。\n\n**44题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】F. The Financial Return from Keeping Students\u003c/p>\n\u003cblockquote>\n\u003cp>留住学生带来的经济回报\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分转到学校一方，用学费与可能的拨款收益解释留住已有学生的经济动机。\u003c/p>\n\u003cp>主体从学生切换为学校：\u003c/p>\n\u003cblockquote>\n\u003cp>A student who remains enrolled continues to pay tuition, whereas one who drops out takes future fee income away.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>remains\u003c/code>与\u003ccode>drops out\u003c/code>形成对照：同一个已入学学生是否留下，决定学校能否继续收到学费。\u003c/p>\n\u003cp>另一笔收入与学生完成学业相连：\u003c/p>\n\u003cblockquote>\n\u003cp>Where public support is partly linked to retention or graduation, helping students stay and complete their degrees can also improve the institution’s funding position.\u003c/p>\n\u003c/blockquote>\n\u003cp>在拨款部分取决于留存或毕业表现的情形下，帮助学生留下和毕业也有财政好处；\u003ccode>Where\u003c/code>限定条件，不能扩大为所有地区统一如此。\u003c/p>\n\u003cp>作者随后排除招生规模解释：\u003c/p>\n\u003cblockquote>\n\u003cp>These incentives concern the progress of students already admitted; they do not require a larger intake of new students.\u003c/p>\n\u003c/blockquote>\n\u003cp>经济激励来自已有学生继续就读及毕业，不以招更多新生为前提。末句据此解释管理者为何支持扩大政策适用。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>已有学生留下继续缴费 → 留存和毕业表现还可能影响拨款 → 宽免有助于保护学校收入 → 教育理由与经济动机可以同时存在\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Keeping Students\u003c/code>对应\u003ccode>remains enrolled\u003c/code>、\u003ccode>retention\u003c/code>及\u003ccode>already admitted\u003c/code>；\u003ccode>Financial Return\u003c/code>对应学费与可能获得的公共支持，完整覆盖本段的两条收入联系。\u003c/p>\n\u003cp>再看最强干扰项A：Attracting a Larger Entering Class。\u003c/p>\n\u003cp>吸引更多新生也可能增加学费，但这是原文专门否定的解释。\u003ccode>do not require a larger intake\u003c/code>说明留存已入学者与扩大招生是不同机制，不能仅因都涉及收入就替换。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】E. When Better Records Outrun Better Education\n\n> 成绩记录改善快于教育质量提升时\n\n这一部分检验学生与学校共同欢迎的好成绩是否代表真实能力，警惕指标成为宣传外观。\n\n先写双方为什么都欢迎更好看的结果：\n\n> Students want qualifications that improve their employment prospects, while universities want records that demonstrate success to families and funders.\n\n学生希望证书帮助就业，学校希望向家庭和资助者展示成功；更高平均分与毕业率可以同时满足两方。\n\n但指标成立有一个前提：\n\n> Yet those indicators are persuasive only if they correspond to knowledge and competence.\n\n`only if`要求好看的数字对应知识与能力。作者没有把双方获益直接当成政策成功。\n\n条件落空会出现什么后果？\n\n> If the rule improves the appearance of achievement without improving what students can actually do, the record becomes a better advertisement rather than better evidence of education.\n\n记录可能只是更好的宣传，未成为教育更好的证据。最后据此把检验标准从“分数是否涨”改为“能力是否跟得上分数”。\n\n这一部分的推进关系是：\n\n> 学生与学校共同追求好看的成绩记录 → 指标必须对应能力 → 只改善外观可能沦为宣传 → 以真实能力而非单纯分数上涨检验政策\n\n`Better Records`对应更高平均分和毕业率；`Outrun Better Education`对应记录改善而实际能力没有提升的条件情形。`When`也保留了原文的假设范围，没有断言所有宽免都无效。\n\n再看最强干扰项F：The Financial Return from Keeping Students。\n\n资助者出现只是为了交代学校为什么希望记录好看；主体随后转为这些记录能否真实代表能力。本段没有继续计算收入，而是在审查双方看似获益背后的教育真实性。\n\n**45题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】E. When Better Records Outrun Better Education\u003c/p>\n\u003cblockquote>\n\u003cp>成绩记录改善快于教育质量提升时\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分检验学生与学校共同欢迎的好成绩是否代表真实能力，警惕指标成为宣传外观。\u003c/p>\n\u003cp>先写双方为什么都欢迎更好看的结果：\u003c/p>\n\u003cblockquote>\n\u003cp>Students want qualifications that improve their employment prospects, while universities want records that demonstrate success to families and funders.\u003c/p>\n\u003c/blockquote>\n\u003cp>学生希望证书帮助就业，学校希望向家庭和资助者展示成功；更高平均分与毕业率可以同时满足两方。\u003c/p>\n\u003cp>但指标成立有一个前提：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet those indicators are persuasive only if they correspond to knowledge and competence.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>only if\u003c/code>要求好看的数字对应知识与能力。作者没有把双方获益直接当成政策成功。\u003c/p>\n\u003cp>条件落空会出现什么后果？\u003c/p>\n\u003cblockquote>\n\u003cp>If the rule improves the appearance of achievement without improving what students can actually do, the record becomes a better advertisement rather than better evidence of education.\u003c/p>\n\u003c/blockquote>\n\u003cp>记录可能只是更好的宣传，未成为教育更好的证据。最后据此把检验标准从“分数是否涨”改为“能力是否跟得上分数”。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>学生与学校共同追求好看的成绩记录 → 指标必须对应能力 → 只改善外观可能沦为宣传 → 以真实能力而非单纯分数上涨检验政策\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Better Records\u003c/code>对应更高平均分和毕业率；\u003ccode>Outrun Better Education\u003c/code>对应记录改善而实际能力没有提升的条件情形。\u003ccode>When\u003c/code>也保留了原文的假设范围，没有断言所有宽免都无效。\u003c/p>\n\u003cp>再看最强干扰项F：The Financial Return from Keeping Students。\u003c/p>\n\u003cp>资助者出现只是为了交代学校为什么希望记录好看；主体随后转为这些记录能否真实代表能力。本段没有继续计算收入，而是在审查双方看似获益背后的教育真实性。\u003c/p>\n\u003cp>\u003cstrong>45题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 引出成绩宽免，询问重修后旧低分如何计算 |\n| B | 用第二次学习的真实收获检验指标，区分两种结果 |\n| C | 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题 |\n| D | 解释新分替换旧分的机制，并引出最初的有限适用群体 |\n| E | 说明重修和减少惩罚如何帮助学习者，并转向其他受益方 |\n| F | 说明从新生扩展至其他在校学生，转问重试的教育收益 |\n| G | 指出大学通过留存已有学生获得学费和可能的拨款利益 |\n| H | 以真实理解的改善总结第二次机会与教育标准的关系 |\n\n全文推进：\n\n> 引出成绩宽免，询问重修后旧低分如何计算 → 解释新分替换旧分的机制，并引出最初的有限适用群体 → 说明从新生扩展至其他在校学生，转问重试的教育收益 → 说明重修和减少惩罚如何帮助学习者，并转向其他受益方 → 指出大学通过留存已有学生获得学费和可能的拨款利益 → 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题 → 用第二次学习的真实收获检验指标，区分两种结果 → 以真实理解的改善总结第二次机会与教育标准的关系\n\n完整顺序：\n\n**A → D → F → E → G → C → B → H**\n\n41—45：D、F、G、C、B。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>引出成绩宽免，询问重修后旧低分如何计算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用第二次学习的真实收获检验指标，区分两种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>把学校动机与学生就业愿望相连，提出指标是否代表学习的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>解释新分替换旧分的机制，并引出最初的有限适用群体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>说明重修和减少惩罚如何帮助学习者，并转向其他受益方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>说明从新生扩展至其他在校学生，转问重试的教育收益\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>指出大学通过留存已有学生获得学费和可能的拨款利益\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以真实理解的改善总结第二次机会与教育标准的关系\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>引出成绩宽免，询问重修后旧低分如何计算 → 解释新分替换旧分的机制，并引出最初的有限适用群体 → 说明从新生扩展至其他在校学生，转问重试的教育收益 → 说明重修和减少惩罚如何帮助学习者，并转向其他受益方 → 指出大学通过留存已有学生获得学费和可能的拨款利益 → 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题 → 用第二次学习的真实收获检验指标，区分两种结果 → 以真实理解的改善总结第二次机会与教育标准的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → F → E → G → C → B → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、F、G、C、B。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → F的关系。\n\n先看前段A的结尾：\n\n> To understand its effects, we must first ask what an institution does with a low mark when a student takes the same course again.\n\n再看候选D的开头：\n\n> It can replace the old mark with the later or higher one in the grade-point average.\n\nA最后问学校如何处理重修者的`a low mark`。本段`It`承接`an institution`，`replace the old mark with the later or higher one`直接回答处理方式：新分替换旧分计算平均成绩。它没有跳到政策效果，而是先交代必要的运作机制。\n\n第二句区别“旧记录仍可见”与“不再同样影响平均分”，防止把计算替换误认为所有历史被删除。末句`This second chance`概括刚介绍的重修待遇，再指出最初只有有限群体得到它。\n\nD段最终落在：\n\n> This second chance was originally directed at a limited group rather than offered to everyone.\n\n后段F的开头是：\n\n> That group consisted of students beginning university life.\n\n后段首句`That group consisted of students beginning university life`为`a limited group`给出具体身份。因此先定义政策，再说最初谁有资格，概念与对象按顺序展开。\n\n这三段的局部推进是：\n\n> 引出成绩宽免，询问重修后旧低分如何计算 → 解释新分替换旧分的机制，并引出最初的有限适用群体 → 说明从新生扩展至其他在校学生，转问重试的教育收益\n\n再检验容易混淆的候选B。它的开头是：\n\n> To answer that question, the second attempt must be examined for what it actually teaches.\n\n检验真实学习的段落也说第二次尝试，但`To answer that question`要回答的是指标是否代表学习，而A问的是旧分如何计算。两种问题不同，不能因为都出现重修就把评估标准放到机制说明之前。\n\n**41题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → F的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To understand its effects, we must first ask what an institution does with a low mark when a student takes the same course again.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>It can replace the old mark with the later or higher one in the grade-point average.\u003c/p>\n\u003c/blockquote>\n\u003cp>A最后问学校如何处理重修者的\u003ccode>a low mark\u003c/code>。本段\u003ccode>It\u003c/code>承接\u003ccode>an institution\u003c/code>，\u003ccode>replace the old mark with the later or higher one\u003c/code>直接回答处理方式：新分替换旧分计算平均成绩。它没有跳到政策效果，而是先交代必要的运作机制。\u003c/p>\n\u003cp>第二句区别“旧记录仍可见”与“不再同样影响平均分”，防止把计算替换误认为所有历史被删除。末句\u003ccode>This second chance\u003c/code>概括刚介绍的重修待遇，再指出最初只有有限群体得到它。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This second chance was originally directed at a limited group rather than offered to everyone.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That group consisted of students beginning university life.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段首句\u003ccode>That group consisted of students beginning university life\u003c/code>为\u003ccode>a limited group\u003c/code>给出具体身份。因此先定义政策，再说最初谁有资格，概念与对象按顺序展开。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>引出成绩宽免，询问重修后旧低分如何计算 → 解释新分替换旧分的机制，并引出最初的有限适用群体 → 说明从新生扩展至其他在校学生，转问重试的教育收益\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>To answer that question, the second attempt must be examined for what it actually teaches.\u003c/p>\n\u003c/blockquote>\n\u003cp>检验真实学习的段落也说第二次尝试，但\u003ccode>To answer that question\u003c/code>要回答的是指标是否代表学习，而A问的是旧分如何计算。两种问题不同，不能因为都出现重修就把评估标准放到机制说明之前。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → F → E的关系。\n\n先看前段D的结尾：\n\n> This second chance was originally directed at a limited group rather than offered to everyone.\n\n再看候选F的开头：\n\n> That group consisted of students beginning university life.\n\n前段最后出现`a limited group`，本段用`That group`紧接并说明是大学新生。这里必须先有“有限群体”才能使用定指的`That group`，而非随意开启另一个受益者话题。\n\n最初新生需要适应，因此一次失败不能预测最终能力；`Later`转入同一机会向高年级扩展。末句不再停留在历史，而要求解释扩大政策背后的教育收益。\n\nF段最终落在：\n\n> Explaining this expansion requires considering the educational benefits claimed for another attempt.\n\n后段E的开头是：\n\n> Another attempt can keep a difficult but essential course from becoming the end of a student’s education.\n\n已知E以`Another attempt can keep a difficult but essential course from becoming the end...`具体回答这些收益：重试避免因关键课程失败而终止学业，并改善理解。`another attempt`将前段的提问与后段的解释扣合。\n\n这三段的局部推进是：\n\n> 解释新分替换旧分的机制，并引出最初的有限适用群体 → 说明从新生扩展至其他在校学生，转问重试的教育收益 → 说明重修和减少惩罚如何帮助学习者，并转向其他受益方\n\n再检验容易混淆的候选G。它的开头是：\n\n> Universities benefit as well when those learners remain enrolled.\n\n大学收入段也能解释推广动机，但以`Universities benefit as well`进入，需要先介绍学习者的好处。若在这里先说学校“也获益”，`as well`的比较对象尚未出现，后面的E又会倒回首次说明学生收益。\n\n**42题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → F → E的关系。\u003c/p>\n\u003cp>先看前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This second chance was originally directed at a limited group rather than offered to everyone.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That group consisted of students beginning university life.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后出现\u003ccode>a limited group\u003c/code>，本段用\u003ccode>That group\u003c/code>紧接并说明是大学新生。这里必须先有“有限群体”才能使用定指的\u003ccode>That group\u003c/code>，而非随意开启另一个受益者话题。\u003c/p>\n\u003cp>最初新生需要适应，因此一次失败不能预测最终能力；\u003ccode>Later\u003c/code>转入同一机会向高年级扩展。末句不再停留在历史，而要求解释扩大政策背后的教育收益。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Explaining this expansion requires considering the educational benefits claimed for another attempt.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Another attempt can keep a difficult but essential course from becoming the end of a student’s education.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知E以\u003ccode>Another attempt can keep a difficult but essential course from becoming the end...\u003c/code>具体回答这些收益：重试避免因关键课程失败而终止学业，并改善理解。\u003ccode>another attempt\u003c/code>将前段的提问与后段的解释扣合。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>解释新分替换旧分的机制，并引出最初的有限适用群体 → 说明从新生扩展至其他在校学生，转问重试的教育收益 → 说明重修和减少惩罚如何帮助学习者，并转向其他受益方\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Universities benefit as well when those learners remain enrolled.\u003c/p>\n\u003c/blockquote>\n\u003cp>大学收入段也能解释推广动机，但以\u003ccode>Universities benefit as well\u003c/code>进入，需要先介绍学习者的好处。若在这里先说学校“也获益”，\u003ccode>as well\u003c/code>的比较对象尚未出现，后面的E又会倒回首次说明学生收益。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → C的关系。\n\n先看前段E的结尾：\n\n> These are benefits to learners, but learners are not the only beneficiaries.\n\n再看候选G的开头：\n\n> Universities benefit as well when those learners remain enrolled.\n\nE末句强调`learners are not the only beneficiaries`，明确预告另一种受益者。本段用`Universities benefit as well`补出学校，`those learners remain enrolled`则承接刚才因重修而能够继续求学的学生。\n\n本段把“留在学校”拆为收入联系：持续缴学费，完成学位还可能影响拨款。它特意说`not necessarily from recruiting more newcomers`，因此优势来自留存而非扩大招生。\n\nG段最终落在：\n\n> This institutional interest helps explain administrators’ enthusiasm for the policy.\n\n后段C的开头是：\n\n> That enthusiasm can coincide with students’ wish for a stronger record in the job market.\n\n末句以`administrators’ enthusiasm`概括学校支持政策的原因；后段开头`That enthusiasm can coincide with students’ wish...`回指这一热情，再把学校与学生的就业愿望并列，形成双方动机汇合。\n\n这三段的局部推进是：\n\n> 说明重修和减少惩罚如何帮助学习者，并转向其他受益方 → 指出大学通过留存已有学生获得学费和可能的拨款利益 → 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题\n\n再检验容易混淆的候选C。它的开头是：\n\n> That enthusiasm can coincide with students’ wish for a stronger record in the job market.\n\n双方动机汇合段以`That enthusiasm`起头，但E只列学习好处，没有说明管理者为何热情。学校学费及拨款利益这一环必须先补上，后段的“这种热情”才有明确来源。\n\n**43题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → C的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>These are benefits to learners, but learners are not the only beneficiaries.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Universities benefit as well when those learners remain enrolled.\u003c/p>\n\u003c/blockquote>\n\u003cp>E末句强调\u003ccode>learners are not the only beneficiaries\u003c/code>，明确预告另一种受益者。本段用\u003ccode>Universities benefit as well\u003c/code>补出学校，\u003ccode>those learners remain enrolled\u003c/code>则承接刚才因重修而能够继续求学的学生。\u003c/p>\n\u003cp>本段把“留在学校”拆为收入联系：持续缴学费，完成学位还可能影响拨款。它特意说\u003ccode>not necessarily from recruiting more newcomers\u003c/code>，因此优势来自留存而非扩大招生。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This institutional interest helps explain administrators’ enthusiasm for the policy.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That enthusiasm can coincide with students’ wish for a stronger record in the job market.\u003c/p>\n\u003c/blockquote>\n\u003cp>末句以\u003ccode>administrators’ enthusiasm\u003c/code>概括学校支持政策的原因；后段开头\u003ccode>That enthusiasm can coincide with students’ wish...\u003c/code>回指这一热情，再把学校与学生的就业愿望并列，形成双方动机汇合。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明重修和减少惩罚如何帮助学习者，并转向其他受益方 → 指出大学通过留存已有学生获得学费和可能的拨款利益 → 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That enthusiasm can coincide with students’ wish for a stronger record in the job market.\u003c/p>\n\u003c/blockquote>\n\u003cp>双方动机汇合段以\u003ccode>That enthusiasm\u003c/code>起头，但E只列学习好处，没有说明管理者为何热情。学校学费及拨款利益这一环必须先补上，后段的“这种热情”才有明确来源。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → C → B的关系。\n\n先看前段G的结尾：\n\n> This institutional interest helps explain administrators’ enthusiasm for the policy.\n\n再看候选C的开头：\n\n> That enthusiasm can coincide with students’ wish for a stronger record in the job market.\n\n前段已经用学费与拨款解释`administrators’ enthusiasm`。本段的`That enthusiasm`指这份管理者支持，`coincide with students’ wish`则加入另一方：学生想要更有利于就业的成绩记录。\n\n双方都欢迎高平均分和更多学位，但`does not prove wrongdoing`避免把动机一致直接判为作弊。随后真正提出的风险是把漂亮指标当作充分成功证据；最后将“指标是否对应学习”单独提问。\n\nC段最终落在：\n\n> Whether those indicators still describe genuine learning is a separate question.\n\n后段B的开头是：\n\n> To answer that question, the second attempt must be examined for what it actually teaches.\n\n后段`To answer that question`承接的就是这句`Whether those indicators still describe genuine learning...`，并通过重修到底教会了什么来回答。先产生评价疑问，后提出能力检验方法。\n\n这三段的局部推进是：\n\n> 指出大学通过留存已有学生获得学费和可能的拨款利益 → 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题 → 用第二次学习的真实收获检验指标，区分两种结果\n\n再检验容易混淆的候选B。它的开头是：\n\n> To answer that question, the second attempt must be examined for what it actually teaches.\n\n能力检验段的首句带有`that question`，不能在学校收入段后直接出现：收入段解释支持动机，并未问指标真假。需要本段先指出双方容易共同接受漂亮数字，才有后面的检验问题。\n\n**44题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → C → B的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This institutional interest helps explain administrators’ enthusiasm for the policy.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That enthusiasm can coincide with students’ wish for a stronger record in the job market.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段已经用学费与拨款解释\u003ccode>administrators’ enthusiasm\u003c/code>。本段的\u003ccode>That enthusiasm\u003c/code>指这份管理者支持，\u003ccode>coincide with students’ wish\u003c/code>则加入另一方：学生想要更有利于就业的成绩记录。\u003c/p>\n\u003cp>双方都欢迎高平均分和更多学位，但\u003ccode>does not prove wrongdoing\u003c/code>避免把动机一致直接判为作弊。随后真正提出的风险是把漂亮指标当作充分成功证据；最后将“指标是否对应学习”单独提问。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Whether those indicators still describe genuine learning is a separate question.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>To answer that question, the second attempt must be examined for what it actually teaches.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段\u003ccode>To answer that question\u003c/code>承接的就是这句\u003ccode>Whether those indicators still describe genuine learning...\u003c/code>，并通过重修到底教会了什么来回答。先产生评价疑问，后提出能力检验方法。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>指出大学通过留存已有学生获得学费和可能的拨款利益 → 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题 → 用第二次学习的真实收获检验指标，区分两种结果\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>To answer that question, the second attempt must be examined for what it actually teaches.\u003c/p>\n\u003c/blockquote>\n\u003cp>能力检验段的首句带有\u003ccode>that question\u003c/code>，不能在学校收入段后直接出现：收入段解释支持动机，并未问指标真假。需要本段先指出双方容易共同接受漂亮数字，才有后面的检验问题。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成C → B → H的关系。\n\n先看前段C的结尾：\n\n> Whether those indicators still describe genuine learning is a separate question.\n\n再看候选B的开头：\n\n> To answer that question, the second attempt must be examined for what it actually teaches.\n\n前段末尾问指标是否仍描述`genuine learning`。本段以`To answer that question`回应，并把判断落在第二次尝试的实际教学收获，而不是再比较学费或学生满意度。\n\n两个学生构成明确对照：一个掌握原先不懂的内容，另一个只有记录改善而能力未变。`these two outcomes`就是这两种结果，建议、课程标准和评估用来区分它们。\n\nB段最终落在：\n\n> Advice, clear course standards and meaningful assessment help distinguish these two outcomes.\n\n后段H的开头是：\n\n> The policy should therefore be judged by the quality of recovery it supports.\n\nH的`therefore`从这种区分推出政策应按`quality of recovery`评价；“改好的记录不能替代理解提升”概括本段第二种失败结果。结论保留第二次机会，同时要求它服务真实能力，正好收束前面的检验。\n\n这三段的局部推进是：\n\n> 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题 → 用第二次学习的真实收获检验指标，区分两种结果 → 以真实理解的改善总结第二次机会与教育标准的关系\n\n再检验容易混淆的候选D。它的开头是：\n\n> It can replace the old mark with the later or higher one in the grade-point average.\n\n计算规则段同样提到平均成绩，但它回答“分数怎么换”，无法回答前段“学习是否真实改善”。放回此处会重启政策定义，H关于`stronger understanding`的判断也失去这组能力对照的支持。\n\n**45题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成C → B → H的关系。\u003c/p>\n\u003cp>先看前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Whether those indicators still describe genuine learning is a separate question.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>To answer that question, the second attempt must be examined for what it actually teaches.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末尾问指标是否仍描述\u003ccode>genuine learning\u003c/code>。本段以\u003ccode>To answer that question\u003c/code>回应，并把判断落在第二次尝试的实际教学收获，而不是再比较学费或学生满意度。\u003c/p>\n\u003cp>两个学生构成明确对照：一个掌握原先不懂的内容，另一个只有记录改善而能力未变。\u003ccode>these two outcomes\u003c/code>就是这两种结果，建议、课程标准和评估用来区分它们。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Advice, clear course standards and meaningful assessment help distinguish these two outcomes.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The policy should therefore be judged by the quality of recovery it supports.\u003c/p>\n\u003c/blockquote>\n\u003cp>H的\u003ccode>therefore\u003c/code>从这种区分推出政策应按\u003ccode>quality of recovery\u003c/code>评价；“改好的记录不能替代理解提升”概括本段第二种失败结果。结论保留第二次机会，同时要求它服务真实能力，正好收束前面的检验。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>把学校动机与学生就业愿望相连，提出指标是否代表学习的问题 → 用第二次学习的真实收获检验指标，区分两种结果 → 以真实理解的改善总结第二次机会与教育标准的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>It can replace the old mark with the later or higher one in the grade-point average.\u003c/p>\n\u003c/blockquote>\n\u003cp>计算规则段同样提到平均成绩，但它回答“分数怎么换”，无法回答前段“学习是否真实改善”。放回此处会重启政策定义，H关于\u003ccode>stronger understanding\u003c/code>的判断也失去这组能力对照的支持。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **educational opportunity** | **教育机会** | **教育文化类：学习生活** | **宏观主题** |\n| adaptability in learning | 学习适应能力 | 人生哲理类：创新、开拓、与时俱进 | 个人主题 |\n| mastery of knowledge | 知识掌握 | 教育文化类：学习生活 | 个人主题 |\n| **mutual benefit** | **互利** | **人生哲理类：团结合作** | **宏观主题** |\n| a willingness to try again | 再次尝试的意愿 | 人生哲理类：坚持 | 个人主题 |\n| educational quality | 教育质量 | 教育文化类：学习生活 | 宏观主题 |\n| **sound judgement** | **健全的判断力** | **人生哲理类：批判、独立、全局思维** | **个人主题** |\n| successful transitions | 顺利过渡 | 教育文化类：学习生活 | 个人主题 |\n| responsible institutional support | 负责任的制度支持 | 人生哲理类：责任感、奉献精神 | 宏观主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>educational opportunity\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>教育机会\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>教育文化类：学习生活\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>adaptability in learning\u003c/td>\n\u003ctd>学习适应能力\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mastery of knowledge\u003c/td>\n\u003ctd>知识掌握\u003c/td>\n\u003ctd>教育文化类：学习生活\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>mutual benefit\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>互利\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u rceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture presents A receiving a second chance to do X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画呈现A得到再次做X的机会。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, A is struggling in the transition to X.\u003c/td>\n\u003ctd>图中A在向X过渡时面临困难。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The picture shows how X can satisfy the needs of both A and B.\u003c/td>\n\u003ctd>图画展示X怎样满足A和B双方的需要。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart records a gradual increase in the average level of X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表记录了X平均水平的逐步上升。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The use of X has accelerated in recent years.\u003c/td>\n\u003ctd>近几年X的使用加快了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures show that X and Y have increased together.\u003c/td>\n\u003ctd>数据显示X与Y一起增长。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage considers X a product of a wider change in Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章将X视为Y更广泛变化的产物。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text examines why A and B have an interest in X.\u003c/td>\n\u003ctd>文字考察A和B为何都关心X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage suggests that X is less about A and more about B.\u003c/td>\n\u003ctd>文章指出X与其说关于A，不如说更侧重B。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];
