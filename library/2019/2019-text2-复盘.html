项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Students’ and colleges’ incentives point in the same direction on this issue.\u003c/p>\n\u003cp>在这个问题上，学生与大学的动机指向同一方向。\u003c/p>\n\u003c/blockquote>\n\u003cp>On this防止把一致扩大为所有利益完全相同；在让学位体现就业资格这一点上，学生的期待与学校利益对上，符合aligned的语境。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>analyzing the causes behind it\u003cbr>分析它背后的原因\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文解释学生与学校为何共同接受宽免，本段的主旨方向是利益诉求在这一点上相合；具体词义须依双方并列的期待，而非任意套用同话题词。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>To be identical with each other.\u003cbr>相互一致。\u003c/p>\n\u003c/blockquote>\n\u003cp>On this 把范围限定在同一件事，前句又把学生所盼与学校最有利的做法连接起来，C 的“一致”可以接住。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. To complement each other.\u003c/h3>\n\u003cblockquote>\n\u003cp>相互补充。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D 的 complement 是一方补另一方所缺，原文的 responding to consumers’ expectations 写的却是大学回应消费者期待；两处都描述双方怎样联系，所以回看第一句，并接上随后具体的就业期待。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。D 的 complement 则写成双方各缺一部分、由对方补上。前文两边反复落在同一个期待上，不是分别提供两种不同部分；“大学回应学生所求”不能改写成“学生和大学互相补足”。\u003c/p>\n\u003cp>原文在解释两边为何追求同一结果，D 却把这种联系写成互相补足不同部分，改变了双方的关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Indeed, grade forgiveness is just another way that universities are responding to consumers&#39; expectations for higher education.\u003c/p>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第6段的to be aligned表示双方的动机相互补充。\u003c/p>\n\u003c/blockquote>\n\u003cp>D 的 complement 是一方补另一方所缺，原文的 responding to consumers’ expectations 写的却是大学回应消费者期待；两处都描述双方怎样联系，所以回看第一句，并接上随后具体的就业期待。\u003c/p>\n\u003cp>原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。D 的 complement 则写成双方各缺一部分、由对方补上。前文两边反复落在同一个期待上，不是分别提供两种不同部分；“大学回应学生所求”不能改写成“学生和大学互相补足”。\u003c/p>\n\u003cp>原文在解释两边为何追求同一结果，D 却把这种联系写成互相补足不同部分，改变了双方的关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Indeed, grade forgiveness is just another way that universities are responding to consumers&#39; expectations for higher education.\u003c/p>\n\u003cp>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.\u003c/p>\n\u003cp>学生和家长希望学位带来工作，学校也愿意培养尽可能合格、至少看起来合格的毕业生；On this把共同方向限定在这一点上。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Students’ and colleges’ different incentives supply what the other side lacks.\u003c/p>\n\u003cp>学生和大学的不同动机各自补足对方缺少的部分。\u003c/p>\n\u003c/blockquote>\n\u003cp>互补需要说明不同作用怎样拼合。原文先后表达的是同一合格毕业生目标，没有将双方安排为各做一半来填补彼此缺口。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>analyzing the causes behind it\u003cbr>分析它背后的原因\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个全文判断直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文解释学生与学校为何共同接受宽免，本段的主旨方向是利益诉求在这一点上相合；具体词义须依双方并列的期待，而非任意套用同话题词。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>To complement each other.\u003cbr>相互补充。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文在解释两边为何追求同一结果，D 却把这种联系写成互相补足不同部分，改变了双方的关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>29题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>29. C. To be identical with each other.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：counterbalance表示相互制衡、抵消。\u003c/p>\n\u003cp>B：原文说学生与家长希望学位带来工作，接着用 Since 把这一期待连到学校的 best interest：学校培养符合这一期待的毕业生，也有利于自己。\u003c/p>\n\u003cp>C：原文的 On this 限定了范围：谈的是让大学培养的毕业生符合学生、家长对就业的期待这件事。\u003c/p>\n\u003cp>D：原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：成绩膨胀的两个原因\u003c/strong>（段落1引入主题） 传统认知：成绩膨胀是消费时代的产物（学生被当作顾客）// 另一个原因：成绩宽恕政策也在推高绩点\u003c/p>\n\u003cp>↓（政策解释）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：成绩宽恕的定义与演变\u003c/strong>（段落2-3政策内容） 政策定义：允许重修低分课程，只计算最高分或最近分数 → 历史演变：【最初：仅限新生适应大学过渡 → 现在：扩展到所有本科生甚至研究生（除精英学校）】→ 加速原因：大学努力留住学生（保证学费）+ 提高毕业率\u003c/p>\n\u003cp>↓（官方解释）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：官方对政策目标的解释\u003c/strong>（段落4表面理由） 官方强调：不是为了成绩本身 → 而是鼓励学生重修关键课程而不受惩罚 → 俄亥俄州立大学案例：学生重修后在后续课程表现更好，能按时毕业\u003c/p>\n\u003cp>//（深层动机）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：大学的实际利益考量\u003c/strong>（段落5真实动机） 经济动机：【公立大学：州资金与毕业率等指标挂钩 → 更好成绩=更多资金】+ 市场动机：【提高绩点让学生感觉物有所值（学生是付费者）】\u003c/p>\n\u003cp>↑（本质分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：消费主义视角下的利益一致\u003c/strong>（段落6总结升华） 本质：成绩宽恕是大学回应消费者期望的方式 → 共同目标：学生和家长期望学位带来工作 → 学校需要培养看起来合格的毕业生 → 结论：学生和大学的动机一致\u003c/p>\n\u003cp>全文核心观点：成绩宽恕表面上是为了帮助学生，实际上是高等教育消费主义时代的产物，既满足了学生获得高分的需求，也满足了大学提高指标获得资金的需求，双方利益在此达成一致。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Attracting a Larger Entering Class\u003c/p>\n\u003cp>B. Making Recovery Serve Real Learning\u003c/p>\n\u003cp>C. Replacing a Past Failure in the Grade Average\u003c/p>\n\u003cp>D. Removing Difficult Subjects from the Curriculum\u003c/p>\n\u003cp>E. When Better Records Outrun Better Education\u003c/p>\n\u003cp>F. The Financial Return from Keeping Students\u003c/p>\n\u003cp>G. A Second Chance That Reached More Students\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A student who fails a course may take it again and perform much better. The question is what happens to the first mark. Under grade-forgiveness policies, the later or higher grade can replace the earlier one when the institution calculates the student’s grade-point average. The first attempt need not determine the final average forever, even though it may still appear elsewhere in the record. This is different from making an examination easier or awarding everyone extra points. It changes the way repeated attempts are counted. As a result, an improvement in the reported average can reflect a new calculation rule as well as improved performance.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>The policy did not begin as an offer to every student in every programme. It first gave newcomers some protection while they adjusted to the unfamiliar demands of university study. A poor first term might reflect that adjustment rather than a lasting inability to learn. Over time, however, institutions extended the opportunity beyond the beginning of undergraduate life. Students further along in their degrees, and in some cases graduate students, could also benefit. The change was therefore one of reach: a limited allowance for an early transition became a more general route back from academic difficulty. The original justification remained relevant, but no longer described all its users.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>For supporters, the educational value of this wider opportunity lies in what students can do with it. Someone who struggles with an essential mathematics course can return to the material instead of abandoning a degree that depends on it. Knowing that one failure will not permanently depress the average may also make a demanding course less frightening. But repeating the course is useful only if the second attempt brings stronger understanding. Advisers and teachers must help identify the earlier difficulty and guide the renewed effort. On this account, forgiveness is a means of making recovery possible, not a substitute for learning what the course requires.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>Institutions have reasons of their own to welcome that recovery. A student who remains enrolled continues to pay tuition, whereas one who drops out takes future fee income away. Where public support is partly linked to retention or graduation, helping students stay and complete their degrees can also improve the institution’s funding position. These incentives concern the progress of students already admitted; they do not require a larger intake of new students. Thus an academic policy may protect institutional revenue while helping an individual recover. Its financial appeal helps explain why administrators can support wider access to forgiveness even when they also speak sincerely about learning.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>The shared benefits create a final difficulty. Students want qualifications that improve their employment prospects, while universities want records that demonstrate success to families and funders. A higher average and a better graduation rate can satisfy both sides. Yet those indicators are persuasive only if they correspond to knowledge and competence. If the rule improves the appearance of achievement without improving what students can actually do, the record becomes a better advertisement rather than better evidence of education. The sensible test is therefore not simply whether marks rise after forgiveness, but whether students leave with the abilities that those marks are supposed to represent.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】C. Replacing a Past Failure in the Grade Average\u003c/p>\n\u003cblockquote>\n\u003cp>替换平均成绩中的旧低分\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释重修宽免怎样改变平均成绩计算，并区分计算规则变化与学习表现改善。\u003c/p>\n\u003cp>段落先区分两次考试，再追问旧分数如何处理：\u003c/p>\n\u003cblockquote>\n\u003cp>The question is what happens to the first mark.\u003c/p>\n\u003c/blockquote>\n\u003cp>问题不是是否允许重修，而是计算平均成绩时，第一次低分还占不占位置。\u003c/p>\n\u003cp>核心机制由这一句给出：\u003c/p>\n\u003cblockquote>\n\u003cp>Under grade-forgiveness policies, the later or higher grade can replace the earlier one when the institution calculates the student’s grade-point average.\u003c/p>\n\u003c/blockquote>\n\u003cp>后一次或更高分数替代旧分参与平均成绩计算。后面承认旧成绩可能仍出现在其他记录中，因此“替换”不能扩大为抹去全部历史。\u003c/p>\n\u003cp>最后一句说明该机制为什么与分数上升有关：\u003c/p>\n\u003cblockquote>\n\u003cp>As a result, an improvement in the reported average can reflect a new calculation rule as well as improved performance.\u003c/p>\n\u003c/blockquote>\n\u003cp>平均分上升可能同时来自表现改善与算法改变；段落解释宽免政策的运作方式，尚未评判所有学生是否真的学得更好。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>重修获得新分数 → 旧分是否计入成为问题 → 新分替换旧分参与计算 → 平均成绩提高可能包含规则因素\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Replacing\u003c/code>对应\u003ccode>replace\u003c/code>；\u003ccode>a Past Failure\u003c/code>对应第一次低分；\u003ccode>in the Grade Average\u003c/code>精确限定替换发生在平均成绩计算中，避免误读为删除所有考试记录。\u003c/p>\n\u003cp>再看最强干扰项E：When Better Records Outrun Better Education。\u003c/p>\n\u003cp>末句提示成绩与能力未必同步，但主体仍在定义政策的计算机制，没有展开教育质量落后于记录改善的风险。该风险标题适合评价段，不能代替本段的规则说明。\u003c/p>\n\u003cp>\u003cstrong>41题选C。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】G. A Second Chance That Reached More Students\u003c/p>\n\u003cblockquote>\n\u003cp>惠及更多学生的第二次机会\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分按时间展示政策从新生过渡保护扩展到更多在校学生的过程。\u003c/p>\n\u003cp>起点是一类特定学生及其处境：\u003c/p>\n\u003cblockquote>\n\u003cp>It first gave newcomers some protection while they adjusted to the unfamiliar demands of university study.\u003c/p>\n\u003c/blockquote>\n\u003cp>最初服务新生，理由是他们需要适应大学；第一学期低分未必等于没有长期学习能力。\u003c/p>\n\u003cp>\u003ccode>however\u003c/code>以后改变的是覆盖范围：\u003c/p>\n\u003cblockquote>\n\u003cp>Over time, however, institutions extended the opportunity beyond the beginning of undergraduate life.\u003c/p>\n\u003c/blockquote>\n\u003cp>机会不再局限于本科起步阶段，随后补充高年级乃至研究生，明确了扩大的对象。\u003c/p>\n\u003cp>作者自己对变化作了归纳：\u003c/p>\n\u003cblockquote>\n\u003cp>The change was therefore one of reach: a limited allowance for an early transition became a more general route back from academic difficulty.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>reach\u003c/code>和从\u003ccode>limited\u003c/code>到\u003ccode>more general\u003c/code>概括适用范围扩大；不是说政策原理完全改变，也不是说新生人数增长。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>最初帮助新生适应 → 低分可能只是过渡困难 → 政策扩展至高年级和研究生 → 特定过渡保护变成更广泛的补救机会\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Second Chance\u003c/code>概括再次学习和补救的机会；\u003ccode>Reached More Students\u003c/code>对应\u003ccode>extended\u003c/code>及本科起点以外的受益者，准确抓住本段的时间推进与范围变化。\u003c/p>\n\u003cp>再看最强干扰项A：Attracting a Larger Entering Class。\u003c/p>\n\u003cp>两者都有“更多学生”，但干扰项讲吸引更多新生入学。本段列出的高年级和研究生已经在校，讨论的是更多人获得政策资格，不能把受益范围扩大改成招生规模扩大。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】B. Making Recovery Serve Real Learning\u003c/p>\n\u003cblockquote>\n\u003cp>让补救机会服务于真正的学习\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分说明第二次机会的教育价值，同时要求重修必须带来更强的理解。\u003c/p>\n\u003cp>数学课例子首先说明第二次机会能挽回什么：\u003c/p>\n\u003cblockquote>\n\u003cp>Someone who struggles with an essential mathematics course can return to the material instead of abandoning a degree that depends on it.\u003c/p>\n\u003c/blockquote>\n\u003cp>学生可以重学必修内容，不必因一次挫败放弃整个学位。下一句还说明旧低分不再永久拖累平均成绩，可能降低挑战难课的恐惧。\u003c/p>\n\u003cp>\u003ccode>But\u003c/code>为这些好处加上学习条件：\u003c/p>\n\u003cblockquote>\n\u003cp>But repeating the course is useful only if the second attempt brings stronger understanding.\u003c/p>\n\u003c/blockquote>\n\u003cp>有价值的不只是重新登记一个分数，而是理解加深。教师和顾问找出先前困难、指导重学，都是让这一条件实现的办法。\u003c/p>\n\u003cp>结尾明确手段与目的：\u003c/p>\n\u003cblockquote>\n\u003cp>On this account, forgiveness is a means of making recovery possible, not a substitute for learning what the course requires.\u003c/p>\n\u003c/blockquote>\n\u003cp>宽免提供恢复学习的机会，却不能代替课程要求；因此标题必须同时覆盖“补救”和“真实学习”。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>允许重学关键课程 → 减少一次失败的持续惩罚 → 重学必须带来理解提升 → 教学支持把补救转化为真实学习\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Recovery\u003c/code>对应从必修课失败中恢复；\u003ccode>Serve Real Learning\u003c/code>对应\u003ccode>stronger understanding\u003c/code>和满足课程要求。标题保留了本段“机会有价值，但必须用来学习”的条件。\u003c/p>\n\u003cp>再看最强干扰项D：Removing Difficult Subjects from the Curriculum。\u003c/p>\n\u003cp>难学的数学课确实出现，但学生被鼓励重学它，而非把它从课程体系删除。末句还坚持\u003ccode>what the course requires\u003c/code>，与取消难课的方向相反。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】F. The Financial Return from Keeping Students\u003c/p>\n\u003cblockquote>\n\u003cp>留住学生带来的经济回报\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分转到学校一方，用学费与可能的拨款收益解释留住已有学生的经济动机。\u003c/p>\n\u003cp>主体从学生切换为学校：\u003c/p>\n\u003cblockquote>\n\u003cp>A student who remains enrolled continues to pay tuition, whereas one who drops out takes future fee income away.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>remains\u003c/code>与\u003ccode>drops out\u003c/code>形成对照：同一个已入学学生是否留下，决定学校能否继续收到学费。\u003c/p>\n\u003cp>另一笔收入与学生完成学业相连：\u003c/p>\n\u003cblockquote>\n\u003cp>Where public support is partly linked to retention or graduation, helping students stay and complete their degrees can also improve the institution’s funding position.\u003c/p>\n\u003c/blockquote>\n\u003cp>在拨款部分取决于留存或毕业表现的情形下，帮助学生留下和毕业也有财政好处；\u003ccode>Where\u003c/code>限定条件，不能扩大为所有地区统一如此。\u003c/p>\n\u003cp>作者随后排除招生规模解释：\u003c/p>\n\u003cblockquote>\n\u003cp>These incentives concern the progress of students already admitted; they do not require a larger intake of new students.\u003c/p>\n\u003c/blockquote>\n\u003cp>经济激励来自已有学生继续就读及毕业，不以招更多新生为前提。末句据此解释管理者为何支持扩大政策适用。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>已有学生留下继续缴费 → 留存和毕业表现还可能影响拨款 → 宽免有助于保护学校收入 → 教育理由与经济动机可以同时存在\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Keeping Students\u003c/code>对应\u003ccode>remains enrolled\u003c/code>、\u003ccode>retention\u003c/code>及\u003ccode>already admitted\u003c/code>；\u003ccode>Financial Return\u003c/code>对应学费与可能获得的公共支持，完整覆盖本段的两条收入联系。\u003c/p>\n\u003cp>再看最强干扰项A：Attracting a Larger Entering Class。\u003c/p>\n\u003cp>吸引更多新生也可能增加学费，但这是原文专门否定的解释。\u003ccode>do not require a larger intake\u003c/code>说明留存已入学者与扩大招生是不同机制，不能仅因都涉及收入就替换。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】E. When Better Records Outrun Better Education\u003c/p>\n\u003cblockquote>\n\u003cp>成绩记录改善快于教育质量提升时\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分检验学生与学校共同欢迎的好成绩是否代表真实能力，警惕指标成为宣传外观。\u003c/p>\n\u003cp>先写双方为什么都欢迎更好看的结果：\u003c/p>\n\u003cblockquote>\n\u003cp>Students want qualifications that improve their employment prospects, while universities want records that demonstrate success to families and funders.\u003c/p>\n\u003c/blockquote>\n\u003cp>学生希望证书帮助就业，学校希望向家庭和资助者展示成功；更高平均分与毕业率可以同时满足两方。\u003c/p>\n\u003cp>但指标成立有一个前提：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet those indicators are persuasive only if they correspond to knowledge and competence.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>only if\u003c/code>要求好看的数字对应知识与能力。作者没有把双方获益直接当成政策成功。\u003c/p>\n\u003cp>条件落空会出现什么后果？\u003c/p>\n\u003cblockquote>\n\u003cp>If the rule improves the appearance of achievement without improving what students can actually do, the record becomes a better advertisement rather than better evidence of education.\u003c/p>\n\u003c/blockquote>\n\u003cp>记录可能只是更好的宣传，未成为教育更好的证据。最后据此把检验标准从“分数是否涨”改为“能力是否跟得上分数”。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>学生与学校共同追求好看的成绩记录 → 指标必须对应能力 → 只改善外观可能沦为宣传 → 以真实能力而非单纯分数上涨检验政策\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Better Records\u003c/code>对应更高平均分和毕业率；\u003ccode>Outrun Better Education\u003c/code>对应记录改善而实际能力没有提升的条件情形。\u003ccode>When\u003c/code>也保留了原文的假设范围，没有断言所有宽免都无效。\u003c/p>\n\u003cp>再看最强干扰项F：The Financial Return from Keeping Students。\u003c/p>\n\u003cp>资助者出现只是为了交代学校为什么希望记录好看；主体随后转为这些记录能否真实代表能力。本段没有继续计算收入，而是在审查双方看似获益背后的教育真实性。\u003c/p>\n\u003cp>\u003cstrong>45题选E。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>Rising grades can be produced by changes in calculation as well as changes in teaching or effort. One policy makes this distinction especially important: grade forgiveness. To understand its effects, we must first ask what an institution does with a low mark when a student takes the same course again.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>To answer that question, the second attempt must be examined for what it actually teaches. A student who masters previously misunderstood material has gained more than a revised average. A student whose record changes without a similar gain in competence has not. Advice, clear course standards and meaningful assessment help distinguish these two outcomes.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>That enthusiasm can coincide with students’ wish for a stronger record in the job market. Both sides welcome higher averages and more completed degrees. The agreement does not prove wrongdoing, but it can make it easy to treat improved indicators as sufficient evidence of success. Whether those indicators still describe genuine learning is a separate question.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>It can replace the old mark with the later or higher one in the grade-point average. The earlier failure may remain visible in other records, but it no longer has the same effect on that calculation. This second chance was originally directed at a limited group rather than offered to everyone.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>Another attempt can keep a difficult but essential course from becoming the end of a student’s education. The student can return to missed material, and an improved understanding can support later study. Reduced fear of a lasting penalty may also encourage a challenging choice. These are benefits to learners, but learners are not the only beneficiaries.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>That group consisted of students beginning university life. They were learning to manage unfamiliar academic demands, so an early failure did not necessarily predict their eventual ability. Later, the same opportunity spread to students further along in their studies. Explaining this expansion requires considering the educational benefits claimed for another attempt.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>Universities benefit as well when those learners remain enrolled. Continued enrolment preserves tuition income, while successful completion may improve funding where support is linked to graduation. The advantage comes from retaining students already present, not necessarily from recruiting more newcomers. This institutional interest helps explain administrators’ enthusiasm for the policy.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>The policy should therefore be judged by the quality of recovery it supports. Giving a second chance and protecting educational standards need not conflict. They do conflict when a cleaner record is accepted in place of stronger understanding. Forgiveness succeeds educationally when the improved result records a real improvement in the learner.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>引出成绩宽免，询问重修后旧低分如何计算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用第二次学习的真实收获检验指标，区分两种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>把学校动机与学生就业愿望相连，提出指标是否代表学习的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>解释新分替换旧分的机制，并引出最初的有限适用群体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>说明重修和减少惩罚如何帮助学习者，并转向其他受益方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>说明从新生扩展至其他在校学生，转问重试的教育收益\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>指出大学通过留存已有学生获得学费和可能的拨款利益\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以真实理解的改善总结第二次机会与教育标准的关系\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>引出成绩宽免，询问重修后旧低分如何计算 → 解释新分替换旧分的机制，并引出最初的有限适用群体 → 说明从新生扩展至其他在校学生，转问重试的教育收益 → 说明重修和减少惩罚如何帮助学习者，并转向其他受益方 → 指出大学通过留存已有学生获得学费和可能的拨款利益 → 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题 → 用第二次学习的真实收获检验指标，区分两种结果 → 以真实理解的改善总结第二次机会与教育标准的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → F → E → G → C → B → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、F、G、C、B。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → F的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To understand its effects, we must first ask what an institution does with a low mark when a student takes the same course again.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>It can replace the old mark with the later or higher one in the grade-point average.\u003c/p>\n\u003c/blockquote>\n\u003cp>A最后问学校如何处理重修者的\u003ccode>a low mark\u003c/code>。本段\u003ccode>It\u003c/code>承接\u003ccode>an institution\u003c/code>，\u003ccode>replace the old mark with the later or higher one\u003c/code>直接回答处理方式：新分替换旧分计算平均成绩。它没有跳到政策效果，而是先交代必要的运作机制。\u003c/p>\n\u003cp>第二句区别“旧记录仍可见”与“不再同样影响平均分”，防止把计算替换误认为所有历史被删除。末句\u003ccode>This second chance\u003c/code>概括刚介绍的重修待遇，再指出最初只有有限群体得到它。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This second chance was originally directed at a limited group rather than offered to everyone.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That group consisted of students beginning university life.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段首句\u003ccode>That group consisted of students beginning university life\u003c/code>为\u003ccode>a limited group\u003c/code>给出具体身份。因此先定义政策，再说最初谁有资格，概念与对象按顺序展开。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>引出成绩宽免，询问重修后旧低分如何计算 → 解释新分替换旧分的机制，并引出最初的有限适用群体 → 说明从新生扩展至其他在校学生，转问重试的教育收益\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>To answer that question, the second attempt must be examined for what it actually teaches.\u003c/p>\n\u003c/blockquote>\n\u003cp>检验真实学习的段落也说第二次尝试，但\u003ccode>To answer that question\u003c/code>要回答的是指标是否代表学习，而A问的是旧分如何计算。两种问题不同，不能因为都出现重修就把评估标准放到机制说明之前。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → F → E的关系。\u003c/p>\n\u003cp>先看前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This second chance was originally directed at a limited group rather than offered to everyone.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That group consisted of students beginning university life.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后出现\u003ccode>a limited group\u003c/code>，本段用\u003ccode>That group\u003c/code>紧接并说明是大学新生。这里必须先有“有限群体”才能使用定指的\u003ccode>That group\u003c/code>，而非随意开启另一个受益者话题。\u003c/p>\n\u003cp>最初新生需要适应，因此一次失败不能预测最终能力；\u003ccode>Later\u003c/code>转入同一机会向高年级扩展。末句不再停留在历史，而要求解释扩大政策背后的教育收益。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Explaining this expansion requires considering the educational benefits claimed for another attempt.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Another attempt can keep a difficult but essential course from becoming the end of a student’s education.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知E以\u003ccode>Another attempt can keep a difficult but essential course from becoming the end...\u003c/code>具体回答这些收益：重试避免因关键课程失败而终止学业，并改善理解。\u003ccode>another attempt\u003c/code>将前段的提问与后段的解释扣合。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>解释新分替换旧分的机制，并引出最初的有限适用群体 → 说明从新生扩展至其他在校学生，转问重试的教育收益 → 说明重修和减少惩罚如何帮助学习者，并转向其他受益方\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Universities benefit as well when those learners remain enrolled.\u003c/p>\n\u003c/blockquote>\n\u003cp>大学收入段也能解释推广动机，但以\u003ccode>Universities benefit as well\u003c/code>进入，需要先介绍学习者的好处。若在这里先说学校“也获益”，\u003ccode>as well\u003c/code>的比较对象尚未出现，后面的E又会倒回首次说明学生收益。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → C的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>These are benefits to learners, but learners are not the only beneficiaries.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Universities benefit as well when those learners remain enrolled.\u003c/p>\n\u003c/blockquote>\n\u003cp>E末句强调\u003ccode>learners are not the only beneficiaries\u003c/code>，明确预告另一种受益者。本段用\u003ccode>Universities benefit as well\u003c/code>补出学校，\u003ccode>those learners remain enrolled\u003c/code>则承接刚才因重修而能够继续求学的学生。\u003c/p>\n\u003cp>本段把“留在学校”拆为收入联系：持续缴学费，完成学位还可能影响拨款。它特意说\u003ccode>not necessarily from recruiting more newcomers\u003c/code>，因此优势来自留存而非扩大招生。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This institutional interest helps explain administrators’ enthusiasm for the policy.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That enthusiasm can coincide with students’ wish for a stronger record in the job market.\u003c/p>\n\u003c/blockquote>\n\u003cp>末句以\u003ccode>administrators’ enthusiasm\u003c/code>概括学校支持政策的原因；后段开头\u003ccode>That enthusiasm can coincide with students’ wish...\u003c/code>回指这一热情，再把学校与学生的就业愿望并列，形成双方动机汇合。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明重修和减少惩罚如何帮助学习者，并转向其他受益方 → 指出大学通过留存已有学生获得学费和可能的拨款利益 → 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That enthusiasm can coincide with students’ wish for a stronger record in the job market.\u003c/p>\n\u003c/blockquote>\n\u003cp>双方动机汇合段以\u003ccode>That enthusiasm\u003c/code>起头，但E只列学习好处，没有说明管理者为何热情。学校学费及拨款利益这一环必须先补上，后段的“这种热情”才有明确来源。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → C → B的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This institutional interest helps explain administrators’ enthusiasm for the policy.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That enthusiasm can coincide with students’ wish for a stronger record in the job market.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段已经用学费与拨款解释\u003ccode>administrators’ enthusiasm\u003c/code>。本段的\u003ccode>That enthusiasm\u003c/code>指这份管理者支持，\u003ccode>coincide with students’ wish\u003c/code>则加入另一方：学生想要更有利于就业的成绩记录。\u003c/p>\n\u003cp>双方都欢迎高平均分和更多学位，但\u003ccode>does not prove wrongdoing\u003c/code>避免把动机一致直接判为作弊。随后真正提出的风险是把漂亮指标当作充分成功证据；最后将“指标是否对应学习”单独提问。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Whether those indicators still describe genuine learning is a separate question.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>To answer that question, the second attempt must be examined for what it actually teaches.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段\u003ccode>To answer that question\u003c/code>承接的就是这句\u003ccode>Whether those indicators still describe genuine learning...\u003c/code>，并通过重修到底教会了什么来回答。先产生评价疑问，后提出能力检验方法。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>指出大学通过留存已有学生获得学费和可能的拨款利益 → 把学校动机与学生就业愿望相连，提出指标是否代表学习的问题 → 用第二次学习的真实收获检验指标，区分两种结果\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>To answer that question, the second attempt must be examined for what it actually teaches.\u003c/p>\n\u003c/blockquote>\n\u003cp>能力检验段的首句带有\u003ccode>that question\u003c/code>，不能在学校收入段后直接出现：收入段解释支持动机，并未问指标真假。需要本段先指出双方容易共同接受漂亮数字，才有后面的检验问题。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成C → B → H的关系。\u003c/p>\n\u003cp>先看前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Whether those indicators still describe genuine learning is a separate question.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>To answer that question, the second attempt must be examined for what it actually teaches.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末尾问指标是否仍描述\u003ccode>genuine learning\u003c/code>。本段以\u003ccode>To answer that question\u003c/code>回应，并把判断落在第二次尝试的实际教学收获，而不是再比较学费或学生满意度。\u003c/p>\n\u003cp>两个学生构成明确对照：一个掌握原先不懂的内容，另一个只有记录改善而能力未变。\u003ccode>these two outcomes\u003c/code>就是这两种结果，建议、课程标准和评估用来区分它们。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Advice, clear course standards and meaningful assessment help distinguish these two outcomes.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The policy should therefore be judged by the quality of recovery it supports.\u003c/p>\n\u003c/blockquote>\n\u003cp>H的\u003ccode>therefore\u003c/code>从这种区分推出政策应按\u003ccode>quality of recovery\u003c/code>评价；“改好的记录不能替代理解提升”概括本段第二种失败结果。结论保留第二次机会，同时要求它服务真实能力，正好收束前面的检验。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>把学校动机与学生就业愿望相连，提出指标是否代表学习的问题 → 用第二次学习的真实收获检验指标，区分两种结果 → 以真实理解的改善总结第二次机会与教育标准的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>It can replace the old mark with the later or higher one in the grade-point average.\u003c/p>\n\u003c/blockquote>\n\u003cp>计算规则段同样提到平均成绩，但它回答“分数怎么换”，无法回答前段“学习是否真实改善”。放回此处会重启政策定义，H关于\u003ccode>stronger understanding\u003c/code>的判断也失去这组能力对照的支持。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>educational opportunity\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>教育机会\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>教育文化类：学习生活\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>adaptability in learning\u003c/td>\n\u003ctd>学习适应能力\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mastery of knowledge\u003c/td>\n\u003ctd>知识掌握\u003c/td>\n\u003ctd>教育文化类：学习生活\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>mutual benefit\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>互利\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a willingness to try again\u003c/td>\n\u003ctd>再次尝试的意愿\u003c/td>\n\u003ctd>人生哲理类：坚持\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>educational quality\u003c/td>\n\u003ctd>教育质量\u003c/td>\n\u003ctd>教育文化类：学习生活\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>sound judgement\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>健全的判断力\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：批判、独立、全局思维\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>successful transitions\u003c/td>\n\u003ctd>顺利过渡\u003c/td>\n\u003ctd>教育文化类：学习生活\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsible institutional support\u003c/td>\n\u003ctd>负责任的制度支持\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture presents A receiving a second chance to do X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画呈现A得到再次做X的机会。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, A is struggling in the transition to X.\u003c/td>\n\u003ctd>图中A在向X过渡时面临困难。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The picture shows how X can satisfy the needs of both A and B.\u003c/td>\n\u003ctd>图画展示X怎样满足A和B双方的需要。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart records a gradual increase in the average level of X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表记录了X平均水平的逐步上升。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The use of X has accelerated in recent years.\u003c/td>\n\u003ctd>近几年X的使用加快了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures show that X and Y have increased together.\u003c/td>\n\u003ctd>数据显示X与Y一起增长。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage considers X a product of a wider change in Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章将X视为Y更广泛变化的产物。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text examines why A and B have an interest in X.\u003c/td>\n\u003ctd>文字考察A和B为何都关心X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage suggests that X is less about A and more about B.\u003c/td>\n\u003ctd>文章指出X与其说关于A，不如说更侧重B。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":7},{"label":"句内逻辑","index":31},{"label":"长难句手译","index":34},{"label":"第三鸟 · 题目复盘","index":53},{"label":"30题","index":54},{"label":"26题","index":64},{"label":"27题","index":82},{"label":"28题","index":100},{"label":"29题","index":118},{"label":"第四鸟 · 新题型","index":136},{"label":"小标题题","index":136},{"label":"排序题","index":142},{"label":"第五鸟 · 写作积累","index":148}];
const allIndices = [0,1,2,3,4,5,6,10,14,18,22,26,30,31,32,33,34,40,46,52,53,54,56,58,60,62,63,64,68,72,76,80,81,82,86,90,94,98,99,100,104,108,112,116,117,118,122,126,130,134,135,136,137,138,139,140,141,142,143,144,145,146,147,148,149];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{

 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }

  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));

 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
 const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
 const top=rightScroll.scrollTop+er.top-sr.top;
 const target=height<=view-2*margin?top+height/2-view/2:top-margin;
 rightScroll.scrollTop=clampScroll(target,rightScroll.scrollHeight-view);
}
function positionRight(st,token,restore){
 guardedSchedule(token,()=>{
  if(isLongSentenceCumulative(st)){
   positionLongSentence(st);
   if(!restore)return;
  }
  if(restore){
   rightScroll.scrollTop=saved.right;
   window.scrollTo(0,saved.win);
   return;
  }
  if(!st.meta.cumulative||st.meta.partIndex===0){rightScroll.scrollTop=0;return;}
  const el=document.getElementById(st.focusId);
  if(!el)return;
  if(isParagraphCumulative(st)){
   // Match the sample: no artificial tail; real content height limits the scroll.
   const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const top=rightScroll.scrollTop+er.top-sr.top;
   rightScroll.scrollTop=clampScroll(top-34,rightScroll.scrollHeight-rightScroll.clientHeight);
   return;
  }
  // A short final layer still needs enough trailing room to bring its heading into view.
  const tail=rightContent.querySelector('.longScrollTail');
  if(tail)tail.style.minHeight=Math.max(420,rightScroll.clientHeight*.9-el.offsetHeight)+'px';
  const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
  const top=rightScroll.scrollTop+er.top-sr.top;
  rightScroll.scrollTop=latestTarget(top,rightScroll.clientHeight,rightScroll.scrollHeight-rightScroll.clientHeight);
 });
}
function render(options={}){
 const token=++renderToken; // stale image and scroll callbacks may never reset a newer step
 document.body.classList.toggle('allMode',all);
 toggleAll.classList.toggle('active',all);
 toggleAll.textContent=all?'返回交互':'显示全部';
 if(all){
  layout.className='layout single';leftPanel.hidden=true;
  rightContent.innerHTML='<div class="fullContent">'+FULL+'</div>';
  hydrateAssets(rightContent);rightScroll.scrollTop=0;
  progress.textContent='全文';
  prev.disabled=next.disabled=reset.disabled=jump.disabled=true;
  return;
 }
 const st=DATA[idx],previous=lastRenderedIdx<0?null:DATA[lastRenderedIdx];
 const sameGroup=previous&&st.meta.cumulative&&previous.meta.cumulative&&st.meta.cumulativeGroup===previous.meta.cumulativeGroup;
 reset.disabled=jump.disabled=false;prev.disabled=idx===0;next.disabled=idx===DATA.length-1;
 progress.textContent=(idx+1)+' / '+DATA.length;
 if(st.context){

  renderContext(st.context,token,options.restore===true);
 }else{
  layout.className='layout single';leftPanel.hidden=true;
  leftStage.innerHTML='';delete leftStage.dataset.kind;
 }
 const holder=rightContent.querySelector('.cumulativeParts');
 let kept=false;
 if(sameGroup&&holder&&!options.restore){
  if(st.html.startsWith(previous.html)){
   holder.insertAdjacentHTML('beforeend',st.html.slice(previous.html.length));kept=true;
  }else if(previous.html.startsWith(st.html)){
   while(holder.children.length>st.meta.partIndex+1)holder.lastElementChild.remove();
   kept=true;

 }
 if(!kept){
  const third=st.section==='第三鸟 · 题目复盘'?' thirdBird':'';
  const content=st.meta.cumulative?'<div class="cumulativeParts">'+st.html+'</div>'+(isParagraphCumulative(st)?'':'<div class="longScrollTail" aria-hidden="true"></div>'):st.html;
  rightContent.innerHTML='<div class="stage'+third+'"><div class="stageHeader"><div class="crumb">'+escHtml(st.section)+'</div><h1 class="stepTitle">'+escHtml(st.title)+'</h1></div><div class="lectureBody">'+content+'</div></div>';
 }
 hydrateAssets(rightContent);
 positionRight(st,token,options.restore===true);
 jump.value='';lastRenderedIdx=idx;
}
JUMP_TARGETS.forEach(j=>{const o=document.createElement('option');o.value=String(j.index);o.textContent=j.label;jump.appendChild(o);});

 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev.click();}
