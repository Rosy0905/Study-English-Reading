 “you quickly get into a lot of ethical questions,”\n\n> Along with Singapore, other governments and mega-corporations are beginning to establish their own guidelines. Britain is setting up a data ethics center. India released its AI ethics strategy this spring.\n\n这里先说大量数据作出的决定很快带来许多伦理问题，然后用具体行动接下去：新加坡的机构帮助政府制定规范，other governments和大公司建立指导原则，英国设立伦理中心，印度发布战略。D的 little public concern 则把这件事描写成很少受到公共关切。政府不是每一个公众个体，但这些国家正在建立针对伦理问题的公共规则，说明问题已进入需要公开制度回应的层面，不能概括成“几乎不受关切”。第五段的自动驾驶正是以数据和程序作决定的一个眼前例子；作者从这个例子接到多方制定规范，没有把它写成无人过问的小问题。\n\n两边的差别就在反应程度：原文说的是多个国家已经为这些问题建立规范，D却说公共关切很少，把正在发生的多方应对写成了近乎不关心。\n\n**多国政府和大公司已经着手制定伦理规范，这能被概括为几乎没有公共关切吗？**\n\n不能。原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。\n\n**第一轮判断：D排除。**","html":"<h3>D. causes little public concern</h3>\n<blockquote>\n<p>几乎不引起公众关切</p>\n</blockquote>\n<p>把D接回题干，它说的是：解决自动驾驶车辆的伦理问题几乎不引起公众关切。</p>\n<p>D的 little public concern 说这类问题在公众层面没有多少关切，粗读时紧接的一段却出现了政府和指导原则；other governments 与前面的自动驾驶伦理问题接在一起讨论社会应对，所以把第六段整段读完，再看各方是否正在行动。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Whenever decisions are based on masses of data, “you quickly get into a lot of ethical questions,” notes Tan Kiat How, chief executive of a Singapore-based agency that is helping the government develop a <strong>[xxx]</strong> code for the ethical use of AI. Along with Singapore, other governments and mega-corporations are beginning to establish their own guidelines. Britain is setting up a data ethics center. India released its AI ethics strategy this spring.</p>\n<p>开始精读：</p>\n<p>Whenever decisions are based on masses of data, / “you quickly get into a lot of ethical questions,” / notes Tan Kiat How, / chief executive of a Singapore-based agency / that is helping the government / develop a <strong>[xxx]</strong> code / for the ethical use of AI. / Along with Singapore, / other governments and mega-corporations / are beginning to establish their own guidelines. / Britain is setting up a data ethics center. / India released its AI ethics strategy this spring.</p>\n<p>每当决定基于大量数据，/ “你很快就进入许多伦理问题”，/ 陈杰豪指出，/ 一家设在新加坡的机构的负责人 / 它正在帮助政府 / 制定一种 <strong>[xxx]</strong> 规范 / 用于人工智能的合乎伦理的使用。/ 与新加坡一起，/ 其他政府和大型企业 / 正开始建立他们自己的指导原则。/ 英国正在建立一个数据伦理中心。/ 印度在今年春天发布了它的人工智能伦理战略。</p>\n</blockquote>\n<p>再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。</p>\n<blockquote>\n<p>Whenever decisions are based on masses of data, “you quickly get into a lot of ethical questions,”</p>\n</blockquote>\n<blockquote>\n<p>Along with Singapore, other governments and mega-corporations are beginning to establish their own guidelines. Britain is setting up a data ethics center. India released its AI ethics strategy this spring.</p>\n</blockquote>\n<p>这里先说大量数据作出的决定很快带来许多伦理问题，然后用具体行动接下去：新加坡的机构帮助政府制定规范，other governments和大公司建立指导原则，英国设立伦理中心，印度发布战略。D的 little public concern 则把这件事描写成很少受到公共关切。政府不是每一个公众个体，但这些国家正在建立针对伦理问题的公共规则，说明问题已进入需要公开制度回应的层面，不能概括成“几乎不受关切”。第五段的自动驾驶正是以数据和程序作决定的一个眼前例子；作者从这个例子接到多方制定规范，没有把它写成无人过问的小问题。</p>\n<p>两边的差别就在反应程度：原文说的是多个国家已经为这些问题建立规范，D却说公共关切很少，把正在发生的多方应对写成了近乎不关心。</p>\n<p><strong>多国政府和大公司已经着手制定伦理规范，这能被概括为几乎没有公共关切吗？</strong></p>\n<p>不能。原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[307,1135,1241,35],[228,1185,1309,36],[228,1235,1319,35],[228,1285,1320,36],[228,1334,1314,37],[228,1386,1319,35],[228,1436,1039,35],[307,1485,1241,36],[228,1534,1320,37],[228,1586,1319,35],[228,1636,1319,36],[227,1686,1320,36],[228,1736,890,35]],"questionRects":[[255,1059,1126,35],[315,1340,489,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 little public concern 说这类问题在公众层面没有多少关切，粗读时紧接的一段却出现了政府和指导原则；other governments 与前面的自动驾驶伦理问题接在一起讨论社会应对，所以把第六段整段读完，再看各方是否正在行动。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[5],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree","action_direction"],"visibleSourceAnchor":"other governments","visibleOptionAnchor":"little public concern"}}}},{"section":"33题","raw":"### 33题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C保留；\n- D排除。\n\nC能接住目前仍难处理的状态；B所说的具体反应还没有读出来。第一遍留下B和C。","html":"<h3>33题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C能接住目前仍难处理的状态；B所说的具体反应还没有读出来。第一遍留下B和C。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"33"}},{"section":"34题","raw":"## 34题\n\n> The author’s attitude toward Google’s pledges is one of ______.  \n> 作者对谷歌的承诺持什么态度？\n\n题干问 Google’s pledges，所以先找到第七段谷歌作出的承诺。第八段紧接着用 the statement 指这份声明，并直接作出评价；要判断作者态度，还需连着把这相邻一段读完。\n\n> 原文参考：\n>\n> On June 7 Google pledged not to “design or **[xxx]** AI” that would cause “overall harm,” or to develop AI-directed weapons or use AI for **[xxx]** that would violate international norms. It also pledged not to deploy AI whose use would violate international laws or human rights.\n>\n> 开始精读：\n>\n> On June 7 / Google pledged not to “design or **[xxx]** AI” / that would cause “overall harm,” / or to develop AI-directed weapons / or use AI for **[xxx]** / that would violate international norms. / It also pledged not to deploy AI / whose use would violate international laws / or human rights.\n>\n> 在六月七日 / 谷歌承诺不去“设计或者 **[xxx]** 人工智能” / 它会导致“总体伤害”，/ 或去开发由人工智能引导的武器 / 或使用人工智能去进行 **[xxx]** / 它会违反国际准则。/ 它还承诺不部署人工智能 / 其使用会违反国际法律 / 或人权。\n\n> 原文参考：\n>\n> While the statement is vague, it represents one starting point. So does the idea that decisions made by AI systems should be explainable, **[xxx]**, and fair.\n>\n> 开始精读：\n>\n> While the statement is vague, / it represents one starting point. / So does the idea / that decisions made by AI systems / should be explainable, **[xxx]**, and fair.\n>\n> 虽然这份声明含糊，/ 它代表着一个起点。/ 那个想法也一样 / 由人工智能系统作出的决定 / 应该是可以解释的、**[xxx]** 的以及公平的。\n\n第七段列的是谷歌承诺不做什么，第八段才是作者自己的评价：虽然声明含糊，它仍代表一个起点。题干问作者对承诺的态度，要根据这句让步后留下的判断来选。","html":"<h2>34题</h2>\n<blockquote>\n<p>The author’s attitude toward Google’s pledges is one of ______.<br>作者对谷歌的承诺持什么态度？</p>\n</blockquote>\n<p>题干问 Google’s pledges，所以先找到第七段谷歌作出的承诺。第八段紧接着用 the statement 指这份声明，并直接作出评价；要判断作者态度，还需连着把这相邻一段读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>On June 7 Google pledged not to “design or <strong>[xxx]</strong> AI” that would cause “overall harm,” or to develop AI-directed weapons or use AI for <strong>[xxx]</strong> that would violate international norms. It also pledged not to deploy AI whose use would violate international laws or human rights.</p>\n<p>开始精读：</p>\n<p>On June 7 / Google pledged not to “design or <strong>[xxx]</strong> AI” / that would cause “overall harm,” / or to develop AI-directed weapons / or use AI for <strong>[xxx]</strong> / that would violate international norms. / It also pledged not to deploy AI / whose use would violate international laws / or human rights.</p>\n<p>在六月七日 / 谷歌承诺不去“设计或者 <strong>[xxx]</strong> 人工智能” / 它会导致“总体伤害”，/ 或去开发由人工智能引导的武器 / 或使用人工智能去进行 <strong>[xxx]</strong> / 它会违反国际准则。/ 它还承诺不部署人工智能 / 其使用会违反国际法律 / 或人权。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>While the statement is vague, it represents one starting point. So does the idea that decisions made by AI systems should be explainable, <strong>[xxx]</strong>, and fair.</p>\n<p>开始精读：</p>\n<p>While the statement is vague, / it represents one starting point. / So does the idea / that decisions made by AI systems / should be explainable, <strong>[xxx]</strong>, and fair.</p>\n<p>虽然这份声明含糊，/ 它代表着一个起点。/ 那个想法也一样 / 由人工智能系统作出的决定 / 应该是可以解释的、<strong>[xxx]</strong> 的以及公平的。</p>\n</blockquote>\n<p>第七段列的是谷歌承诺不做什么，第八段才是作者自己的评价：虽然声明含糊，它仍代表一个起点。题干问作者对承诺的态度，要根据这句让步后留下的判断来选。</p>\n","articleRects":[[308,1785,1240,37],[230,1835,1318,37],[228,1887,1320,35],[228,1937,792,35],[307,1987,1242,35],[228,2037,1275,35]],"questionRects":[[255,1477,1007,43]],"scrollTarget":"auto","meta":{"kind":"question","qid":"34"}},{"section":"34题","raw":"### A. contempt\n\n> 轻蔑\n\n把A接回题干，它说的是：作者对谷歌的这些承诺持轻蔑态度。\n\nA的 contempt 是认为不值得一提，第八段 one starting point 则是作者对声明价值的直接说法，因此回看第八段第一句，看作者在承认含糊之后给了什么评价。\n\n> While the statement is vague, it represents one starting point.\n\n作者并未忽略声明的不足，先写 vague，说它含糊；但让步的后半句仍给出 one starting point，承认它可以作为一个开始。A的 contempt 要把这种声明当作没有价值、值得轻视的东西，与“承认它是一个起点”相反。不能只看vague就把后半句删掉：作者保留的正是这一步即使不完善，仍有起步意义。\n\n**承认声明能成为一个起点，是在轻蔑它吗？**\n\n不是。one starting point给它保留了实际的起步价值，和contempt的轻视方向不同。\n\n**第一轮判断：A排除。**","html":"<h3>A. contempt</h3>\n<blockquote>\n<p>轻蔑</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者对谷歌的这些承诺持轻蔑态度。</p>\n<p>A的 contempt 是认为不值得一提，第八段 one starting point 则是作者对声明价值的直接说法，因此回看第八段第一句，看作者在承认含糊之后给了什么评价。</p>\n<blockquote>\n<p>While the statement is vague, it represents one starting point.</p>\n</blockquote>\n<p>作者并未忽略声明的不足，先写 vague，说它含糊；但让步的后半句仍给出 one starting point，承认它可以作为一个开始。A的 contempt 要把这种声明当作没有价值、值得轻视的东西，与“承认它是一个起点”相反。不能只看vague就把后半句删掉：作者保留的正是这一步即使不完善，仍有起步意义。</p>\n<p><strong>承认声明能成为一个起点，是在轻蔑它吗？</strong></p>\n<p>不是。one starting point给它保留了实际的起步价值，和contempt的轻视方向不同。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[307,1987,1242,35],[228,2037,1275,35]],"questionRects":[[255,1477,1007,43],[315,1552,197,34]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 contempt 是认为不值得一提，第八段 one starting point 则是作者对声明价值的直接说法，因此回看第八段第一句，看作者在承认含糊之后给了什么评价。"],"evidenceParagraphPids":[7],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"one starting point","visibleOptionAnchor":"contempt"}}}},{"section":"34题","raw":"### B. skepticism\n\n> 怀疑\n\n把B接回题干，它说的是：作者对谷歌的承诺持怀疑态度。\n\nB的 skepticism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。\n\n> While the statement is vague, it represents one starting point.\n\n作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。B的 skepticism 若要成立，评价应停在不相信承诺、怀疑其真假或作用上。这里却没有把含糊发展成不相信，反而用While先让一步，再保留起点价值。“还不够具体”与“我不相信它”表达的是不同态度，决定方向的是让步后面的明确肯定。\n\n**作者说声明含糊之后，是停在怀疑，还是肯定它仍然代表一个起点？**\n\n后者。it represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。\n\n**第一轮判断：B排除。**","html":"<h3>B. skepticism</h3>\n<blockquote>\n<p>怀疑</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者对谷歌的承诺持怀疑态度。</p>\n<p>B的 skepticism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。</p>\n<blockquote>\n<p>While the statement is vague, it represents one starting point.</p>\n</blockquote>\n<p>作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。B的 skepticism 若要成立，评价应停在不相信承诺、怀疑其真假或作用上。这里却没有把含糊发展成不相信，反而用While先让一步，再保留起点价值。“还不够具体”与“我不相信它”表达的是不同态度，决定方向的是让步后面的明确肯定。</p>\n<p><strong>作者说声明含糊之后，是停在怀疑，还是肯定它仍然代表一个起点？</strong></p>\n<p>后者。it represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[307,1987,1242,35],[228,2037,1275,35]],"questionRects":[[255,1477,1007,43],[315,1621,216,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 skepticism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。"],"evidenceParagraphPids":[7],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["negation","action_direction"],"visibleSourceAnchor":"it represents","visibleOptionAnchor":"skepticism"}}}},{"section":"34题","raw":"### C. respect\n\n> 敬重\n\n把C接回题干，它说的是：作者对谷歌的承诺持敬重态度。\n\nC的 respect 带有敬重的评价分量，第八段 one starting point 给出的则是对声明的具体程度限定，两边都在评价谷歌这一步，因此回看第一句的完整让步与主句。\n\n> While the statement is vague, it represents one starting point.\n\n这句话既说vague，又只把声明称为one starting point：它不够清楚，不过可以作为许多起步办法中的一个。C的 respect 把对这一步实用意义的认可提高到了敬重。作者没有把谷歌放到值得仰望的位置，也没有用它来代表卓越的道德表现；他马上又说另一种关于AI决定的想法也是起点。one starting point说的是“先有一个开端”的价值，respect表达的评价强度超过了这句有保留的认可。\n\n**“虽然含糊，但算一个起点”已经表达出对这份承诺的敬重了吗？**\n\n还不能。作者认可的是起步作用，仍明确保留了含糊这个不足；C把这种有限的认可抬高成了敬重。\n\n**第一轮判断：C排除。**","html":"<h3>C. respect</h3>\n<blockquote>\n<p>敬重</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者对谷歌的承诺持敬重态度。</p>\n<p>C的 respect 带有敬重的评价分量，第八段 one starting point 给出的则是对声明的具体程度限定，两边都在评价谷歌这一步，因此回看第一句的完整让步与主句。</p>\n<blockquote>\n<p>While the statement is vague, it represents one starting point.</p>\n</blockquote>\n<p>这句话既说vague，又只把声明称为one starting point：它不够清楚，不过可以作为许多起步办法中的一个。C的 respect 把对这一步实用意义的认可提高到了敬重。作者没有把谷歌放到值得仰望的位置，也没有用它来代表卓越的道德表现；他马上又说另一种关于AI决定的想法也是起点。one starting point说的是“先有一个开端”的价值，respect表达的评价强度超过了这句有保留的认可。</p>\n<p><strong>“虽然含糊，但算一个起点”已经表达出对这份承诺的敬重了吗？</strong></p>\n<p>还不能。作者认可的是起步作用，仍明确保留了含糊这个不足；C把这种有限的认可抬高成了敬重。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[307,1987,1242,35],[228,2037,1275,35]],"questionRects":[[255,1477,1007,43],[315,1692,159,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的 respect 带有敬重的评价分量，第八段 one starting point 给出的则是对声明的具体程度限定，两边都在评价谷歌这一步，因此回看第一句的完整让步与主句。"],"evidenceParagraphPids":[7],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree"],"visibleSourceAnchor":"one starting point","visibleOptionAnchor":"respect"}}}},{"section":"34题","raw":"### D. affirmation\n\n> 肯定\n\n把D接回题干，它说的是：作者对谷歌的承诺持肯定态度。\n\nD的 affirmation 是对这一步给予肯定，第八段 one starting point 承认声明有起步作用，意思能够相接，因此回看作者评价声明的那句完整话。\n\n> While the statement is vague, it represents one starting point.\n\n作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。D的 affirmation 不要求作者认为声明完美，也不要求他崇敬谷歌，只要求作者认可这一步的某种价值。这正符合句中的让步：表述不够清楚，但朝制定规则迈出一步仍值得承认。后一句So does又把可解释、公平等要求也放进起点之列，可见作者是在认可若干开始行动的办法，而不是把不完善当作全部否定的理由。\n\n**肯定其起步价值，同时承认声明含糊，能用affirmation概括吗？**\n\n能。affirmation可以是有保留的肯定；作者明确认可one starting point，并没有声称所有问题已经解决。\n\n**第一轮判断：D保留。**","html":"<h3>D. affirmation</h3>\n<blockquote>\n<p>肯定</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者对谷歌的承诺持肯定态度。</p>\n<p>D的 affirmation 是对这一步给予肯定，第八段 one starting point 承认声明有起步作用，意思能够相接，因此回看作者评价声明的那句完整话。</p>\n<blockquote>\n<p>While the statement is vague, it represents one starting point.</p>\n</blockquote>\n<p>作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。D的 affirmation 不要求作者认为声明完美，也不要求他崇敬谷歌，只要求作者认可这一步的某种价值。这正符合句中的让步：表述不够清楚，但朝制定规则迈出一步仍值得承认。后一句So does又把可解释、公平等要求也放进起点之列，可见作者是在认可若干开始行动的办法，而不是把不完善当作全部否定的理由。</p>\n<p><strong>肯定其起步价值，同时承认声明含糊，能用affirmation概括吗？</strong></p>\n<p>能。affirmation可以是有保留的肯定；作者明确认可one starting point，并没有声称所有问题已经解决。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[307,1987,1242,35],[228,2037,1275,35]],"questionRects":[[255,1477,1007,43],[315,1762,227,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 affirmation 是对这一步给予肯定，第八段 one starting point 承认声明有起步作用，意思能够相接，因此回看作者评价声明的那句完整话。"],"evidenceParagraphPids":[7],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"one starting point","visibleOptionAnchor":"affirmation"}}}},{"section":"34题","raw":"### 34题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C排除；\n- D保留。\n\n作者在指出含糊后仍肯定声明的起步意义，这一题可以留下D。\n\n> **34题选D。**","html":"<h3>34题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>作者在指出含糊后仍肯定声明的起步意义，这一题可以留下D。</p>\n<blockquote>\n<p><strong>34题选D。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"34"}},{"section":"35题","raw":"## 35题\n\n**Which of the following would be the best title for the text?**\n\n下列哪一个最适合作为本文的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **The Conscience of AI: Complex But Inevitable**\n\n人工智能的良知：复杂，但不可回避\n\nB. **Frankenstein, the Novel Predicting the Age of AI**\n\n《弗兰肯斯坦》：预言人工智能时代的小说\n\nC. **AI’s Future: In the Hands of Tech Giants**\n\n人工智能的未来：掌握在科技巨头手里\n\nD. **AI Shall Be Killers Once Out of Control**\n\n人工智能一旦失控就会成为杀手","html":"<h2>35题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下列哪一个最适合作为本文的标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>The Conscience of AI: Complex But Inevitable</strong></p>\n<p>人工智能的良知：复杂，但不可回避</p>\n<p>B. <strong>Frankenstein, the Novel Predicting the Age of AI</strong></p>\n<p>《弗兰肯斯坦》：预言人工智能时代的小说</p>\n<p>C. <strong>AI’s Future: In the Hands of Tech Giants</strong></p>\n<p>人工智能的未来：掌握在科技巨头手里</p>\n<p>D. <strong>AI Shall Be Killers Once Out of Control</strong></p>\n<p>人工智能一旦失控就会成为杀手</p>\n","articleRects":[],"questionRects":[[255,1903,1027,35]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"35"}},{"section":"35题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n> 原文参考：\n>\n> To put it another way: How can we make sure that the thinking of intelligent machines reflects humanity’s highest values? Only then will they be useful servants and not Frankenstein’s out-of-control monster.\n>\n> 开始精读：\n>\n> To put it another way: / How can we make sure / that the thinking of intelligent machines / reflects humanity’s highest values? / Only then will they be useful servants / and not Frankenstein’s out-of-control monster.\n>\n> 换一种说法：/ 我们怎样能确保 / 智能机器的思考 / 反映人类最高的价值？/ 只有那样它们才会成为有用的仆人 / 而不是弗兰肯斯坦的失控怪物。\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。 | 先讲一个旧例子引出要谈的问题 |\n| 第2段 | 转到今天的人工智能，列出智能、意识和人之所以为人的疑问。 | 再把旧问题接到眼前的新情况 |\n| 第3段 | 写模仿人类思考的机器、像人的机器人和科幻电视剧中的形象。 | 先摆出人们对新事物的想象 |\n| 第4段 | 借伊格曼的说明指出，意识尚难理解，更难复制到机器中。 | 接着说明现实还做不到那一步 |\n| 第5段 | 转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。 | 但话说回来问题已到眼前且很难 |\n| 第6段 | 从数据决策的伦理问题转向各国和大公司开始制定伦理规范。 | 再说有些人已经开始想办法 |\n| 第7段 | 列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。 | 举一个例子把怎样起步写具体 |\n| 第8段 | 承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。 | 先承认办法不完善再肯定起步 |\n| 第9段 | 要求智能机器体现人类最高价值，使它们成为有用帮手而非失控怪物。 | 最后说必须朝哪个方向继续做 |\n\n---","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<blockquote>\n<p>原文参考：</p>\n<p>To put it another way: How can we make sure that the thinking of intelligent machines reflects humanity’s highest values? Only then will they be useful servants and not Frankenstein’s out-of-control monster.</p>\n<p>开始精读：</p>\n<p>To put it another way: / How can we make sure / that the thinking of intelligent machines / reflects humanity’s highest values? / Only then will they be useful servants / and not Frankenstein’s out-of-control monster.</p>\n<p>换一种说法：/ 我们怎样能确保 / 智能机器的思考 / 反映人类最高的价值？/ 只有那样它们才会成为有用的仆人 / 而不是弗兰肯斯坦的失控怪物。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。</td>\n<td>先讲一个旧例子引出要谈的问题</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>转到今天的人工智能，列出智能、意识和人之所以为人的疑问。</td>\n<td>再把旧问题接到眼前的新情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>写模仿人类思考的机器、像人的机器人和科幻电视剧中的形象。</td>\n<td>先摆出人们对新事物的想象</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>借伊格曼的说明指出，意识尚难理解，更难复制到机器中。</td>\n<td>接着说明现实还做不到那一步</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。</td>\n<td>但话说回来问题已到眼前且很难</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>从数据决策的伦理问题转向各国和大公司开始制定伦理规范。</td>\n<td>再说有些人已经开始想办法</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。</td>\n<td>举一个例子把怎样起步写具体</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。</td>\n<td>先承认办法不完善再肯定起步</td>\n</tr>\n<tr>\n<td>第9段</td>\n<td>要求智能机器体现人类最高价值，使它们成为有用帮手而非失控怪物。</td>\n<td>最后说必须朝哪个方向继续做</td>\n</tr>\n</tbody></table>\n<hr>\n","articleRects":[[307,2087,1241,35],[228,2137,1319,36],[229,2187,892,28]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"35","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"35题","raw":"**Which of the following would be the best title for the text?**\n\n### A. The Conscience of AI: Complex But Inevitable\n\n人工智能的良知：复杂，但不可回避\n\n#### 如果 A 是主旨，文章9段应该怎么写？\n\n如果A是主旨，文章中心就应该是人工智能如何遵守人的伦理价值，虽然复杂，却已经不能回避。前面会解释困难，后面会写为什么仍要行动以及朝什么方向行动。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 用旧作品中的技术伦理疑问，引出机器是否应遵循人的价值这一问题。 | 先讲一个旧例子引出要谈的问题 |\n| 第2段 | 说明人工智能把智能、意识与人的本质等伦理疑问带到今天。 | 再把旧问题接到眼前的新情况 |\n| 第3段 | 写人们对像人的机器的想象，为理解这种机器的难处作铺垫。 | 先摆出人们对新事物的想象 |\n| 第4段 | 说明对人类意识的认识不足，不能轻易复制出像人的机器。 | 接着说明现实还做不到那一步 |\n| 第5段 | 指出伦理问题不能等待技术全懂了再处理，并以现实应用说明困难。 | 但话说回来问题已到眼前且很难 |\n| 第6段 | 介绍各方已经开始给人工智能制定伦理规则。 | 再说有些人已经开始想办法 |\n| 第7段 | 用一家公司的承诺说明如何从避免伤害、遵守价值约束起步。 | 举一个例子把怎样起步写具体 |\n| 第8段 | 承认初步办法仍有不足，同时认可它们迈出了必要的一步。 | 先承认办法不完善再肯定起步 |\n| 第9段 | 要求机器体现人类价值，让它为人服务而不失控。 | 最后说必须朝哪个方向继续做 |\n\nA中的 Conscience of AI 不是要求全文证明机器已经具有人类的良心；标题把机器怎样遵守人的伦理价值概括成一个问题。Complex能接住中间连续出现的难处：意识很复杂、缺少好理论，驾驶员的瞬间反应又涉及经验和感官信息，编程很难处理所有情况。But Inevitable接住第五段开头的转折：不能因为还造不出完全像人的机器，就以为伦理问题没有到眼前。\n\n后半篇也不是突然换题。新加坡、英国、印度和大公司在制定规则，谷歌承诺避开总体伤害和侵犯权利，作者说这些虽含糊却是起点；最后再把目标说成智能机器反映人类最高价值。前半篇解释复杂在哪里，后半篇写既然回避不了就怎样开始。A既容得下技术困难，也容得下政府和企业的行动，最后的有用仆人与失控怪物还给出了为什么必须处理的理由。\n\n**A能不能同时解释文章为什么先谈理解与编程的困难，后谈伦理规则和人类价值？**\n\n能。前一部分说明处理人工智能伦理并不简单，后一部分说明问题已经到来、各方必须开始行动；“复杂但不可回避”把两部分接成了同一个中心。\n\n**判断：A保留。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>A. The Conscience of AI: Complex But Inevitable</h3>\n<p>人工智能的良知：复杂，但不可回避</p>\n<h4>如果 A 是主旨，文章9段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是人工智能如何遵守人的伦理价值，虽然复杂，却已经不能回避。前面会解释困难，后面会写为什么仍要行动以及朝什么方向行动。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>用旧作品中的技术伦理疑问，引出机器是否应遵循人的价值这一问题。</td>\n<td>先讲一个旧例子引出要谈的问题</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明人工智能把智能、意识与人的本质等伦理疑问带到今天。</td>\n<td>再把旧问题接到眼前的新情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>写人们对像人的机器的想象，为理解这种机器的难处作铺垫。</td>\n<td>先摆出人们对新事物的想象</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>说明对人类意识的认识不足，不能轻易复制出像人的机器。</td>\n<td>接着说明现实还做不到那一步</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>指出伦理问题不能等待技术全懂了再处理，并以现实应用说明困难。</td>\n<td>但话说回来问题已到眼前且很难</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>介绍各方已经开始给人工智能制定伦理规则。</td>\n<td>再说有些人已经开始想办法</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>用一家公司的承诺说明如何从避免伤害、遵守价值约束起步。</td>\n<td>举一个例子把怎样起步写具体</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>承认初步办法仍有不足，同时认可它们迈出了必要的一步。</td>\n<td>先承认办法不完善再肯定起步</td>\n</tr>\n<tr>\n<td>第9段</td>\n<td>要求机器体现人类价值，让它为人服务而不失控。</td>\n<td>最后说必须朝哪个方向继续做</td>\n</tr>\n</tbody></table>\n<p>A中的 Conscience of AI 不是要求全文证明机器已经具有人类的良心；标题把机器怎样遵守人的伦理价值概括成一个问题。Complex能接住中间连续出现的难处：意识很复杂、缺少好理论，驾驶员的瞬间反应又涉及经验和感官信息，编程很难处理所有情况。But Inevitable接住第五段开头的转折：不能因为还造不出完全像人的机器，就以为伦理问题没有到眼前。</p>\n<p>后半篇也不是突然换题。新加坡、英国、印度和大公司在制定规则，谷歌承诺避开总体伤害和侵犯权利，作者说这些虽含糊却是起点；最后再把目标说成智能机器反映人类最高价值。前半篇解释复杂在哪里，后半篇写既然回避不了就怎样开始。A既容得下技术困难，也容得下政府和企业的行动，最后的有用仆人与失控怪物还给出了为什么必须处理的理由。</p>\n<p><strong>A能不能同时解释文章为什么先谈理解与编程的困难，后谈伦理规则和人类价值？</strong></p>\n<p>能。前一部分说明处理人工智能伦理并不简单，后一部分说明问题已经到来、各方必须开始行动；“复杂但不可回避”把两部分接成了同一个中心。</p>\n<p><strong>判断：A保留。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1903,1027,35],[315,1975,825,35]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"A"}},{"section":"35题","raw":"**Which of the following would be the best title for the text?**\n\n### B. Frankenstein, the Novel Predicting the Age of AI\n\n《弗兰肯斯坦》：预言人工智能时代的小说\n\n#### 如果 B 是主旨，文章9段应该怎么写？\n\n如果B是主旨，文章中心就应该是小说怎样预言了人工智能时代。各段需要持续拿小说里的具体内容与今天的技术现实对照，再评价这本书的预见。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 介绍小说的出版，并提出它预言了人工智能时代。 | 先讲一个旧例子引出要谈的问题 |\n| 第2段 | 指出今天人工智能的哪些发展印证了小说中的具体预言。 | 再把旧问题接到眼前的新情况 |\n| 第3段 | 比较小说里的机器与当代科幻、类人机器形象。 | 先摆出人们对新事物的想象 |\n| 第4段 | 借科学家的话判断小说关于意识的预言是否准确。 | 接着说明现实还做不到那一步 |\n| 第5段 | 以自动驾驶等现实事例核对小说当年的预言。 | 但话说回来问题已到眼前且很难 |\n| 第6段 | 说明各国规则与小说警告之间的对应。 | 再说有些人已经开始想办法 |\n| 第7段 | 把谷歌的承诺解释为对小说中某个预言的回应。 | 举一个例子把怎样起步写具体 |\n| 第8段 | 评价小说预言为当代技术讨论提供了多少指导。 | 先承认办法不完善再肯定起步 |\n| 第9段 | 回到小说，总结它如何预见人工智能时代。 | 最后说必须朝哪个方向继续做 |\n\nB确实能接住开头的小说和两百年，也能接住末段再次出现的Frankenstein；但是“预言人工智能时代的小说”要求小说本身始终是被解释、被核对的对象。那样第四段讨论意识、第五段讨论驾驶时，就应该指出这些情形分别对应小说里的哪项设想，后面的规则也应被用来证明小说预见得准。\n\n实际正文没有沿着小说情节展开。第四段伊格曼说现实理论不足，第五段详细拆驾驶员的反应和程序困难，第六、七段说各方当下怎样建立规范，这些段落之间能够直接连起来，不需要借小说内容作中介。结尾提到怪物，是把不能让机器失控的要求说得形象，并非评定一本书的预测成就。B把承担开头引入和结尾警示作用的小说，抬成了全文一直在论证的中心，因此中间大部分具体讨论在这个标题下找不到应有的位置。\n\n**如果中心是小说预言得多准确，文章会只在首尾提小说、却把主要篇幅交给现实难题和伦理规范吗？**\n\n不会。B需要持续比较小说设想与现实发展，实际主体却是人工智能伦理为什么难、又怎样开始处理；小说只是帮助提出和形象化这个问题。\n\n**判断：B排除。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>B. Frankenstein, the Novel Predicting the Age of AI</h3>\n<p>《弗兰肯斯坦》：预言人工智能时代的小说</p>\n<h4>如果 B 是主旨，文章9段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是小说怎样预言了人工智能时代。各段需要持续拿小说里的具体内容与今天的技术现实对照，再评价这本书的预见。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>介绍小说的出版，并提出它预言了人工智能时代。</td>\n<td>先讲一个旧例子引出要谈的问题</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>指出今天人工智能的哪些发展印证了小说中的具体预言。</td>\n<td>再把旧问题接到眼前的新情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>比较小说里的机器与当代科幻、类人机器形象。</td>\n<td>先摆出人们对新事物的想象</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>借科学家的话判断小说关于意识的预言是否准确。</td>\n<td>接着说明现实还做不到那一步</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>以自动驾驶等现实事例核对小说当年的预言。</td>\n<td>但话说回来问题已到眼前且很难</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明各国规则与小说警告之间的对应。</td>\n<td>再说有些人已经开始想办法</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>把谷歌的承诺解释为对小说中某个预言的回应。</td>\n<td>举一个例子把怎样起步写具体</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>评价小说预言为当代技术讨论提供了多少指导。</td>\n<td>先承认办法不完善再肯定起步</td>\n</tr>\n<tr>\n<td>第9段</td>\n<td>回到小说，总结它如何预见人工智能时代。</td>\n<td>最后说必须朝哪个方向继续做</td>\n</tr>\n</tbody></table>\n<p>B确实能接住开头的小说和两百年，也能接住末段再次出现的Frankenstein；但是“预言人工智能时代的小说”要求小说本身始终是被解释、被核对的对象。那样第四段讨论意识、第五段讨论驾驶时，就应该指出这些情形分别对应小说里的哪项设想，后面的规则也应被用来证明小说预见得准。</p>\n<p>实际正文没有沿着小说情节展开。第四段伊格曼说现实理论不足，第五段详细拆驾驶员的反应和程序困难，第六、七段说各方当下怎样建立规范，这些段落之间能够直接连起来，不需要借小说内容作中介。结尾提到怪物，是把不能让机器失控的要求说得形象，并非评定一本书的预测成就。B把承担开头引入和结尾警示作用的小说，抬成了全文一直在论证的中心，因此中间大部分具体讨论在这个标题下找不到应有的位置。</p>\n<p><strong>如果中心是小说预言得多准确，文章会只在首尾提小说、却把主要篇幅交给现实难题和伦理规范吗？</strong></p>\n<p>不会。B需要持续比较小说设想与现实发展，实际主体却是人工智能伦理为什么难、又怎样开始处理；小说只是帮助提出和形象化这个问题。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1903,1027,35],[315,2045,863,35]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"B"}},{"section":"35题","raw":"**Which of the following would be the best title for the text?**\n\n### C. AI’s Future: In the Hands of Tech Giants\n\n人工智能的未来：掌握在科技巨头手里\n\n#### 如果 C 是主旨，文章9段应该怎么写？\n\n如果C是主旨，文章中心就应该是科技巨头掌握了人工智能的未来。各段应说明这些企业拥有何种决定权、怎样使用它，并让其他主体围绕它们的控制力展开。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 用旧故事引出科技巨头怎样决定新技术的未来。 | 先讲一个旧例子引出要谈的问题 |\n| 第2段 | 说明人工智能发展对大公司决策权提出了哪些问题。 | 再把旧问题接到眼前的新情况 |\n| 第3段 | 描述科技巨头如何塑造公众对机器的想象。 | 先摆出人们对新事物的想象 |\n| 第4段 | 说明大公司怎样主导对意识与机器的研究。 | 接着说明现实还做不到那一步 |\n| 第5段 | 用自动驾驶说明技术未来取决于企业的选择。 | 但话说回来问题已到眼前且很难 |\n| 第6段 | 解释各国政府为什么也要围绕巨头的决定行动。 | 再说有些人已经开始想办法 |\n| 第7段 | 以谷歌为代表，证明科技巨头掌握关键方向。 | 举一个例子把怎样起步写具体 |\n| 第8段 | 评价巨头的声明如何决定未来局势。 | 先承认办法不完善再肯定起步 |\n| 第9段 | 总结人工智能前途取决于科技巨头怎样使用权力。 | 最后说必须朝哪个方向继续做 |\n\nC里的Tech Giants能找到谷歌和mega-corporations，后面也确实谈了公司应该遵守什么。但“In the Hands of”进一步把人工智能的未来归到科技巨头手里，这就要求全文解释谁拥有控制权、为何企业能决定其他人的方向。\n\n实际第六段把企业和other governments并列，具体还列出新加坡、英国、印度，没有说政府只能跟随科技巨头。第七段谷歌只是紧接其后的一个具体例子，第八段对它的评价也只是one starting point，另一个关于可解释与公平的想法同样是起点。结尾提出的衡量标准是humanity’s highest values，主体扩展到“我们如何确保”，不是“巨头怎样决定”。C虽然抓住了一个分量不小的例子，却把参与制定规范的一类主体改成了掌握全局的主体；它既解释不了前面的意识与驾驶困难，也把后面政府和全人类价值的位置挤掉了。\n\n**谷歌作为一个制定伦理承诺的例子，能把并列行动的政府和人类价值都收进“未来由科技巨头掌握”吗？**\n\n不能。公司是参与者之一，原文没有建立巨头控制政府或独占未来方向的关系；C把一个参与主体放大成了全文的决定者。\n\n**判断：C排除。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>C. AI’s Future: In the Hands of Tech Giants</h3>\n<p>人工智能的未来：掌握在科技巨头手里</p>\n<h4>如果 C 是主旨，文章9段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是科技巨头掌握了人工智能的未来。各段应说明这些企业拥有何种决定权、怎样使用它，并让其他主体围绕它们的控制力展开。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>用旧故事引出科技巨头怎样决定新技术的未来。</td>\n<td>先讲一个旧例子引出要谈的问题</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明人工智能发展对大公司决策权提出了哪些问题。</td>\n<td>再把旧问题接到眼前的新情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>描述科技巨头如何塑造公众对机器的想象。</td>\n<td>先摆出人们对新事物的想象</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>说明大公司怎样主导对意识与机器的研究。</td>\n<td>接着说明现实还做不到那一步</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用自动驾驶说明技术未来取决于企业的选择。</td>\n<td>但话说回来问题已到眼前且很难</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>解释各国政府为什么也要围绕巨头的决定行动。</td>\n<td>再说有些人已经开始想办法</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>以谷歌为代表，证明科技巨头掌握关键方向。</td>\n<td>举一个例子把怎样起步写具体</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>评价巨头的声明如何决定未来局势。</td>\n<td>先承认办法不完善再肯定起步</td>\n</tr>\n<tr>\n<td>第9段</td>\n<td>总结人工智能前途取决于科技巨头怎样使用权力。</td>\n<td>最后说必须朝哪个方向继续做</td>\n</tr>\n</tbody></table>\n<p>C里的Tech Giants能找到谷歌和mega-corporations，后面也确实谈了公司应该遵守什么。但“In the Hands of”进一步把人工智能的未来归到科技巨头手里，这就要求全文解释谁拥有控制权、为何企业能决定其他人的方向。</p>\n<p>实际第六段把企业和other governments并列，具体还列出新加坡、英国、印度，没有说政府只能跟随科技巨头。第七段谷歌只是紧接其后的一个具体例子，第八段对它的评价也只是one starting point，另一个关于可解释与公平的想法同样是起点。结尾提出的衡量标准是humanity’s highest values，主体扩展到“我们如何确保”，不是“巨头怎样决定”。C虽然抓住了一个分量不小的例子，却把参与制定规范的一类主体改成了掌握全局的主体；它既解释不了前面的意识与驾驶困难，也把后面政府和全人类价值的位置挤掉了。</p>\n<p><strong>谷歌作为一个制定伦理承诺的例子，能把并列行动的政府和人类价值都收进“未来由科技巨头掌握”吗？</strong></p>\n<p>不能。公司是参与者之一，原文没有建立巨头控制政府或独占未来方向的关系；C把一个参与主体放大成了全文的决定者。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1903,1027,35],[315,2117,729,29]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"C"}},{"section":"35题","raw":"**Which of the following would be the best title for the text?**\n\n### D. AI Shall Be Killers Once Out of Control\n\n人工智能一旦失控就会成为杀手\n\n#### 如果 D 是主旨，文章9段应该怎么写？\n\n如果D是主旨，文章中心就应该是人工智能一旦失控就会成为杀手。各段需要展示失控与杀人之间的必然联系，例子和结论都应围绕这种致命危险。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 用小说怪物说明机器失控必然伤害人。 | 先讲一个旧例子引出要谈的问题 |\n| 第2段 | 指出今天人工智能的发展正在带来杀人危险。 | 再把旧问题接到眼前的新情况 |\n| 第3段 | 把类人机器人和科幻形象写成失控杀手的预兆。 | 先摆出人们对新事物的想象 |\n| 第4段 | 借科学家说明无法理解机器会导致致命后果。 | 接着说明现实还做不到那一步 |\n| 第5段 | 用自动驾驶事故说明失控人工智能会变成杀手。 | 但话说回来问题已到眼前且很难 |\n| 第6段 | 说明各国开始采取措施防止机器杀人。 | 再说有些人已经开始想办法 |\n| 第7段 | 用谷歌对武器的承诺进一步强调杀人威胁。 | 举一个例子把怎样起步写具体 |\n| 第8段 | 评价这些起步措施能否阻止人工智能成为杀手。 | 先承认办法不完善再肯定起步 |\n| 第9段 | 断言人工智能只要失控就会杀人。 | 最后说必须朝哪个方向继续做 |\n\nD抓住了后半篇的harm、weapons和最后的out-of-control monster，因此危险方向不是完全无关。但“Shall Be Killers Once Out of Control”是一个很强的条件判断：只要失控，就会成为杀手。文章并没有把所有伦理问题都缩成杀人，更没有用段落持续证明这条必然关系。\n\n第五段谈的是在复杂驾驶情况中怎样作决定，第六段扩大到数据决策的伦理，第七段还提到国际准则、国际法律和人权，第八段要求决定可解释、公平。这些内容的范围远超过是否杀人。尾段也不是断言机器必定作恶，而是先问怎样确保它反映人类最高价值，再说只有这样它才会成为有用的仆人而非失控怪物。作者最后在要求一个好的发展方向，D却只留下恐怖结果，并把可能的伤害压成必然成为杀手；它不能解释文中大量积极制定规范和肯定起步的内容。\n\n**原文对伦理约束和有用机器的要求，能被“失控就必然成为杀手”完整概括吗？**\n\n不能。D把广泛的伦理问题缩成杀人，把应努力避免的风险写成必然结果，也漏掉了文章认可规则与行动的方向。\n\n**判断：D排除。**\n\n---","html":"<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>D. AI Shall Be Killers Once Out of Control</h3>\n<p>人工智能一旦失控就会成为杀手</p>\n<h4>如果 D 是主旨，文章9段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是人工智能一旦失控就会成为杀手。各段需要展示失控与杀人之间的必然联系，例子和结论都应围绕这种致命危险。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>用小说怪物说明机器失控必然伤害人。</td>\n<td>先讲一个旧例子引出要谈的问题</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>指出今天人工智能的发展正在带来杀人危险。</td>\n<td>再把旧问题接到眼前的新情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>把类人机器人和科幻形象写成失控杀手的预兆。</td>\n<td>先摆出人们对新事物的想象</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>借科学家说明无法理解机器会导致致命后果。</td>\n<td>接着说明现实还做不到那一步</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用自动驾驶事故说明失控人工智能会变成杀手。</td>\n<td>但话说回来问题已到眼前且很难</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明各国开始采取措施防止机器杀人。</td>\n<td>再说有些人已经开始想办法</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>用谷歌对武器的承诺进一步强调杀人威胁。</td>\n<td>举一个例子把怎样起步写具体</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>评价这些起步措施能否阻止人工智能成为杀手。</td>\n<td>先承认办法不完善再肯定起步</td>\n</tr>\n<tr>\n<td>第9段</td>\n<td>断言人工智能只要失控就会杀人。</td>\n<td>最后说必须朝哪个方向继续做</td>\n</tr>\n</tbody></table>\n<p>D抓住了后半篇的harm、weapons和最后的out-of-control monster，因此危险方向不是完全无关。但“Shall Be Killers Once Out of Control”是一个很强的条件判断：只要失控，就会成为杀手。文章并没有把所有伦理问题都缩成杀人，更没有用段落持续证明这条必然关系。</p>\n<p>第五段谈的是在复杂驾驶情况中怎样作决定，第六段扩大到数据决策的伦理，第七段还提到国际准则、国际法律和人权，第八段要求决定可解释、公平。这些内容的范围远超过是否杀人。尾段也不是断言机器必定作恶，而是先问怎样确保它反映人类最高价值，再说只有这样它才会成为有用的仆人而非失控怪物。作者最后在要求一个好的发展方向，D却只留下恐怖结果，并把可能的伤害压成必然成为杀手；它不能解释文中大量积极制定规范和肯定起步的内容。</p>\n<p><strong>原文对伦理约束和有用机器的要求，能被“失控就必然成为杀手”完整概括吗？</strong></p>\n<p>不能。D把广泛的伦理问题缩成杀人，把应努力避免的风险写成必然结果，也漏掉了文章认可规则与行动的方向。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1903,1027,35],[315,2187,712,28]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"D"}},{"section":"35题","raw":"### 35题结论\n\n**35. A. The Conscience of AI: Complex But Inevitable**\n\n全文一面写理解意识、复制思考和处理驾驶情境很复杂，一面强调伦理问题已经来到眼前，并用规则、承诺与人类价值说明必须继续处理。A把这两个方向一起概括了。\n\n这句话就是本文后续做题的主旨底牌：\n\n**The Conscience of AI: Complex But Inevitable / 人工智能的良知：复杂，但不可回避**\n\n---","html":"<h3>35题结论</h3>\n<p><strong>35. A. The Conscience of AI: Complex But Inevitable</strong></p>\n<p>全文一面写理解意识、复制思考和处理驾驶情境很复杂，一面强调伦理问题已经来到眼前，并用规则、承诺与人类价值说明必须继续处理。A把这两个方向一起概括了。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>The Conscience of AI: Complex But Inevitable / 人工智能的良知：复杂，但不可回避</strong></p>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"35"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查31题：A还是D？\n\n第一遍留下：\n\n- A. involves some concerns raised by AI today\n- D. has sparked serious ethical **[xxx]**\n\n主旨底牌是：\n\n> **The Conscience of AI: Complex But Inevitable**\n\n也就是：\n\n> 人工智能的良知：复杂，但不可回避\n\n我们先把题干和两个选项接起来。\n\nA接上是：作者提到这部小说，因为它涉及今天人工智能带来的一些关切。D接上是：作者提到这部小说，因为它已经引发了严重的伦理 **[xxx]**。第一遍没有拉开，是因为作品后面连接ethical questions的动作没有读出，D最后那个伦理名词也不清楚；两项都碰到了小说和伦理问题，不能靠把生词补成某个意思来选。\n\n现在拿主旨来检查。\n\n主旨说人工智能的伦理要求复杂，却已经无法回避。既然全文要处理的是今天的这个问题，开头的小说就应该帮助读者进入“技术会带来怎样的伦理疑问”，再由第二段Today转到人工智能。这恰好给A增加了段落作用上的支持：它不只说小说有伦理内容，还把小说与今天人工智能的关切接到一起，能解释作者为什么在进入现实难题之前提这本书。\n\n再看D，它要求我们把重点放在小说已经引发了某种伦理反应。即使这个反应与伦理有关，后面文章也没有围绕这本小说的社会反响往下展开；自动驾驶、多国规范和谷歌承诺，讨论的对象始终是现在的人工智能。主旨没有替我们翻译D的最后一个词，但它让我们看清，小说引发了何种反应并不是这里通向全文的问题。\n\n回到第一轮那两句，第一段是many ethical questions和未来技术，第二段是Today与人工智能提出的问题。A既能接住这组局部衔接，又能承担引入全文伦理议题的作用。D仍只停在小说引发了某种事情上，解释不了为什么下一段立刻进入今天的人工智能。因此选A。\n\n> **31题选A。**\n\n---","html":"<h2>回查31题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. involves some concerns raised by AI today</li>\n<li>D. has sparked serious ethical <strong>[xxx]</strong></li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>The Conscience of AI: Complex But Inevitable</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>人工智能的良知：复杂，但不可回避</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A接上是：作者提到这部小说，因为它涉及今天人工智能带来的一些关切。D接上是：作者提到这部小说，因为它已经引发了严重的伦理 <strong>[xxx]</strong>。第一遍没有拉开，是因为作品后面连接ethical questions的动作没有读出，D最后那个伦理名词也不清楚；两项都碰到了小说和伦理问题，不能靠把生词补成某个意思来选。</p>\n<p>现在拿主旨来检查。</p>\n<p>主旨说人工智能的伦理要求复杂，却已经无法回避。既然全文要处理的是今天的这个问题，开头的小说就应该帮助读者进入“技术会带来怎样的伦理疑问”，再由第二段Today转到人工智能。这恰好给A增加了段落作用上的支持：它不只说小说有伦理内容，还把小说与今天人工智能的关切接到一起，能解释作者为什么在进入现实难题之前提这本书。</p>\n<p>再看D，它要求我们把重点放在小说已经引发了某种伦理反应。即使这个反应与伦理有关，后面文章也没有围绕这本小说的社会反响往下展开；自动驾驶、多国规范和谷歌承诺，讨论的对象始终是现在的人工智能。主旨没有替我们翻译D的最后一个词，但它让我们看清，小说引发了何种反应并不是这里通向全文的问题。</p>\n<p>回到第一轮那两句，第一段是many ethical questions和未来技术，第二段是Today与人工智能提出的问题。A既能接住这组局部衔接，又能承担引入全文伦理议题的作用。D仍只停在小说引发了某种事情上，解释不了为什么下一段立刻进入今天的人工智能。因此选A。</p>\n<blockquote>\n<p><strong>31题选A。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review","qid":"31"}},{"section":"进阶回查","raw":"## 回查32题：B还是C？\n\n第一遍留下：\n\n- B. is too limited for us to reproduce it\n- C. **[xxx]** popular sci-fi TV series\n\n主旨底牌是：\n\n> **The Conscience of AI: Complex But Inevitable**\n\n也就是：\n\n> 人工智能的良知：复杂，但不可回避\n\n我们先把题干和两个选项接起来。\n\nB说，伊格曼认为我们目前对意识的认识太有限，还不能复制意识。C说，我们目前对意识的认识 **[xxx]** 流行科幻电视剧。第一遍B能对应“还无法理解，更别说复制”，但C的动作未读出；前一段又确实写了电视剧中的类人机器人，所以当时把C留了下来。\n\n现在拿主旨来检查。\n\n文章最终讨论的是人工智能伦理：问题复杂，但不能回避。第四段的伊格曼处在“人们想象像人的机器”之后、“然而伦理问题已到眼前”之前。放回这个全文方向，他的话承担的是说明现实研究还存在困难，从而让后面的转折有意义：即使意识尚未理解、机器尚难复制，眼前应用带来的伦理问题也不能等。这一作用与B描述的认识不足正好一致。\n\nC把判断落在popular sci-fi TV series，要求理解意识与电视剧之间的某种作用。全文却没有继续评判这些电视剧是否合理，也没有追踪意识研究怎样改变影视内容；电视剧只是第三段中帮助呈现类人机器人想象的例子。主旨给C增加不了“伊格曼是在评论电视剧”的支持，也不能替它把那个动作翻出来。\n\n再接回他自己的话：far too complex to be understood和let alone reproduced，后面还有no good theories解释意识及造机器的方法。B不仅对应这些局部判断，还准确承担了全文说明技术复杂性的那一步。C虽碰到邻段的电视剧，却没有把伊格曼谈当前认识的判断说清。两层放在一起，B更完整地回答了题干。\n\n> **32题选B。**\n\n---","html":"<h2>回查32题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. is too limited for us to reproduce it</li>\n<li>C. <strong>[xxx]</strong> popular sci-fi TV series</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>The Conscience of AI: Complex But Inevitable</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>人工智能的良知：复杂，但不可回避</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>B说，伊格曼认为我们目前对意识的认识太有限，还不能复制意识。C说，我们目前对意识的 逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>31题题干</h2>\n<p><strong>Mary Shelley’s novel Frankenstein is mentioned because it ______.</strong></p>\n<blockquote>\n<p>文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n<hr>\n<h2>32题题干</h2>\n<p><strong>In David Eagleman’s opinion, our current knowledge of consciousness ______.</strong></p>\n<blockquote>\n<p>按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？</p>\n</blockquote>\n<p>题型：<strong>人物观点题</strong>。</p>\n<hr>\n<h2>33题题干</h2>\n<p><strong>The solution to the ethical issues brought by autonomous vehicles ______.</strong></p>\n<blockquote>\n<p>自动驾驶车辆所带来的伦理问题，其解决办法怎样？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>34题题干</h2>\n<p><strong>The author’s attitude toward Google’s pledges is one of ______.</strong></p>\n<blockquote>\n<p>作者对谷歌的承诺持什么态度？</p>\n</blockquote>\n<p>题型：<strong>作者态度题</strong>。</p>\n<hr>\n<h2>35题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下列哪一个最适合作为本文的标题？</p>\n</blockquote>\n<p>题型：<strong>全文主旨题</strong>。</p>\n<hr>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>Yet；But；While；Only then</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>remarkable；complex；vague；fair</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>imitate；build；establish；pledged</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>overall harm；useful servants</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>AI；ethical questions；humans</td>\n</tr>\n</tbody></table>\n<p>This year marks exactly two centuries since the publication of Frankenstein; or, The Modern Prometheus, by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of <strong>[xxx]</strong> fiction that would <strong>[xxx]</strong> many ethical questions to be raised by technologies yet to come.</p>\n<p>Today the rapid growth of artificial intelligence (AI) raises <strong>[xxx]</strong> questions: “What is intelligence, <strong>[xxx]</strong>, or consciousness? What makes humans humans?”</p>\n<p>What is being called artificial general intelligence, machines that would imitate the way humans think, continues to <strong>[xxx]</strong> scientists. Yet humans remain <strong>[xxx]</strong> by the idea of robots that would look, move, and respond like humans, similar to those recently <strong>[xxx]</strong> on popular sci-fi TV series such as “Westworld” and “Humans.”</p>\n<p>Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University <strong>[xxx]</strong>. “We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.”</p>\n<p>But that doesn’t mean <strong>[xxx]</strong> ethical issues involving AI aren’t at hand. The coming use of autonomous vehicles, for example, poses <strong>[xxx]</strong> ethical questions. Human drivers sometimes must make split-second decisions. Their reactions may be a complex combination of instant <strong>[xxx]</strong>, input from past driving experiences, and what their eyes and ears tell them in that moment. AI “vision” today is not nearly as <strong>[xxx]</strong> as that of humans. And to <strong>[xxx]</strong> every <strong>[xxx]</strong> driving situation is a difficult programming problem.</p>\n<p>Whenever decisions are based on masses of data, “you quickly get into a lot of ethical questions,” notes Tan Kiat How, chief executive of a Singapore-based agency that is helping the government develop a <strong>[xxx]</strong> code for the ethical use of AI. Along with Singapore, other governments and mega-corporations are beginning to establish their own guidelines. Britain is setting up a data ethics center. India released its AI ethics strategy this spring.</p>\n<p>On June 7 Google pledged not to “design or <strong>[xxx]</strong> AI” that would cause “overall harm,” or to develop AI-directed weapons or use AI for <strong>[xxx]</strong> that would violate international norms. It also pledged not to deploy AI whose use would violate international laws or human rights.</p>\n<p>While the statement is vague, it represents one starting point. So does the idea that decisions made by AI systems should be explainable, <strong>[xxx]</strong>, and fair.</p>\n<p>To put it another way: How can we make sure that the thinking of intelligent machines reflects humanity’s highest values? Only then will they be useful servants and not Frankenstein’s out-of-control monster.</p>\n<p>This year marks / exactly two centuries / since the publication of Frankenstein; / or, The Modern Prometheus, / by Mary Shelley. / Even before the invention / of the electric light bulb, / the author produced / a remarkable work of <strong>[xxx]</strong> fiction / that would <strong>[xxx]</strong> / many ethical questions / to be raised by technologies / yet to come.</p>\n<p>Today / the rapid growth of artificial intelligence (AI) / raises <strong>[xxx]</strong> questions: / “What is intelligence, <strong>[xxx]</strong>, or consciousness? / What makes humans humans?”</p>\n<p>What is being called artificial general intelligence, / machines that would imitate / the way humans think, / continues to <strong>[xxx]</strong> scientists. / Yet humans remain <strong>[xxx]</strong> / by the idea of robots / that would look, move, and respond like humans, / similar to those recently <strong>[xxx]</strong> / on popular sci-fi TV series / such as “Westworld” and “Humans.”</p>\n<p>Just how people think / is still far too complex to be understood, / let alone reproduced, / says David Eagleman, / a Stanford University <strong>[xxx]</strong>. / “We are just in a situation / where there are no good theories / explaining what consciousness actually is / and how you could ever build a machine / to get there.”</p>\n<p>But that doesn’t mean / <strong>[xxx]</strong> ethical issues involving AI / aren’t at hand. / The coming use of autonomous vehicles, / for example, / poses <strong>[xxx]</strong> ethical questions. / Human drivers sometimes must make split-second decisions. / Their reactions may be a complex combination / of instant <strong>[xxx]</strong>, / input from past driving experiences, / and what their eyes and ears tell them / in that moment. / AI “vision” today / is not nearly as <strong>[xxx]</strong> as that of humans. / And to <strong>[xxx]</strong> every <strong>[xxx]</strong> driving situation / is a difficult programming problem.</p>\n<p>Whenever decisions are based on masses of data, / “you quickly get into a lot of ethical questions,” / notes Tan Kiat How, / chief executive of a Singapore-based agency / that is helping the government / develop a <strong>[xxx]</strong> code / for the ethical use of AI. / Along with Singapore, / other governments and mega-corporations / are beginning to establish their own guidelines. / Britain is setting up a data ethics center. / India released its AI ethics strategy this spring.</p>\n<p>On June 7 / Google pledged not to “design or <strong>[xxx]</strong> AI” / that would cause “overall harm,” / or to develop AI-directed weapons / or use AI for <strong>[xxx]</strong> / that would violate international norms. / It also pledged not to deploy AI / whose use would violate international laws / or human rights.</p>\n<p>While the statement is vague, / it represents one starting point. / So does the idea / that decisions made by AI systems / should be explainable, <strong>[xxx]</strong>, and fair.</p>\n<p>To put it
