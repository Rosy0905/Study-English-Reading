<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**Mary Shelley’s novel Frankenstein is mentioned because it ______.**\n\n> 文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？\n\n题型：**例子作用题**。\n\n---","html":"<h2>31题题干</h2>\n<p><strong>Mary Shelley’s novel Frankenstein is mentioned because it ______.</strong></p>\n<blockquote>\n<p>文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,214,1157,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**In David Eagleman’s opinion, our current knowledge of consciousness ______.**\n\n> 按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？\n\n题型：**人物观点题**。\n\n---","html":"<h2>32题题干</h2>\n<p><strong>In David Eagleman’s opinion, our current knowledge of consciousness ______.</strong></p>\n<blockquote>\n<p>按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？</p>\n</blockquote>\n<p>题型：<strong>人物观点题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,636,1311,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**The solution to the ethical issues brought by autonomous vehicles ______.**\n\n> 自动驾驶车辆所带来的伦理问题，其解决办法怎样？\n\n题型：**具体细节题**。\n\n---","html":"<h2>33题题干</h2>\n<p><strong>The solution to the ethical issues brought by autonomous vehicles ______.</strong></p>\n<blockquote>\n<p>自动驾驶车辆所带来的伦理问题，其解决办法怎样？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,1059,1126,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"## d>imitate；build；establish；pledged</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>overall harm；useful servants</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>AI；ethical questions；humans</td>\n</tr>\n</tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"This year marks exactly two centuries since the publication of Frankenstein; or, The Modern Prometheus, by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of **[xxx]** fiction that would **[xxx]** many ethical questions to be raised by technologies yet to come.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>This year marks exactly two centuries since the publication of Frankenstein; or, The Modern Prometheus, by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of <strong>[xxx]</strong> fiction that would <strong>[xxx]</strong> many ethical questions to be raised by technologies yet to come.</p>\n</div></div>","articleRects":[[307,329,1238,45],[228,383,1320,36],[228,434,1321,35],[228,484,1292,35]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true},"contextRaw":""},{"section":"读文章","raw":"This year marks / exactly two centuries / since the publication of Frankenstein; / or, The Modern Prometheus, / by Mary Shelley. / Even before the invention / of the electric light bulb, / the author produced / a remarkable work of **[xxx]** fiction / that would **[xxx]** / many ethical questions / to be raised by technologies / yet to come.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>This year marks / exactly two centuries / since the publication of Frankenstein; / or, The Modern Prometheus, / by Mary Shelley. / Even before the invention / of the electric light bulb, / the author produced / a remarkable work {"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做31至34题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做31至34题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"31题","raw":"## 31题\n\n> Mary Shelley’s novel Frankenstein is mentioned because it ______.  \n> 文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？\n\n题干直接给出了 Mary Shelley 和 Frankenstein，所以回到第一段看这部小说。题目问为什么提它，第一段说到还未到来的技术，紧接着第二段出现 Today 和人工智能；还要把相邻的第二段一起读完，看看话题怎样接下去。\n\n> 原文参考：\n>\n> This year marks exactly two centuries since the publication of Frankenstein; or, The Modern Prometheus, by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of **[xxx]** fiction that would **[xxx]** many ethical questions to be raised by technologies yet to come.\n>\n> 开始精读：\n>\n> This year marks / exactly two centuries / since the publication of Frankenstein; / or, The Modern Prometheus, / by Mary Shelley. / Even before the invention / of the electric light bulb, / the author produced / a remarkable work of **[xxx]** fiction / that would **[xxx]** / many ethical questions / to be raised by technologies / yet to come.\n>\n> 今年标志着 / 恰好两个世纪 / 自《弗兰肯斯坦》的出版以来；/ 或者叫《现代普罗米修斯》，/ 由玛丽·雪莱所写。/ 甚至在发明之前 / 电灯泡的，/ 这位作者写出了 / 一本不寻常的 **[xxx]** 小说 / 它将会 **[xxx]** / 许多伦理问题 / 将由技术提出的 / 还没有到来的。\n\n> 原文参考：\n>\n> Today the rapid growth of artificial intelligence (AI) raises **[xxx]** questions: “What is intelligence, **[xxx]**, or consciousness? What makes humans humans?”\n>\n> 开始精读：\n>\n> Today / the rapid growth of artificial intelligence (AI) / raises **[xxx]** questions: / “What is intelligence, **[xxx]**, or consciousness? / What makes humans humans?”\n>\n> 今天 / 人工智能的迅速增长 / 提出了 **[xxx]** 问题：/ “什么是智能、**[xxx]** 或者意识？/ 什么使人类成为人类？”\n\n第一段把小说和 many ethical questions 放在一起，第二段接着谈今天人工智能的发展以及人的智能、意识。空格要补的是这部小说为什么适合放在这里开头，而不是单独介绍小说的出版资料。","html":"<h2>31题</h2>\n<blockquote>\n<p>Mary Shelley’s novel Frankenstein is mentioned because it ______.<br>文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？</p>\n</blockquote>\n<p>题干直接给出了 Mary Shelley 和 Frankenstein，所以回到第一段看这部小说。题目问为什么提它，第一段说到还未到来的技术，紧接着第二段出现 Today 和人工智能；还要把相邻的第二段一起读完，看看话题怎样接下去。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>This year marks exactly two centuries since the publication of Frankenstein; or, The Modern Prometheus, by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of <strong>[xxx]</strong> fiction that would <strong>[xxx]</strong> many ethical questions to be raised by technologies yet to come.</p>\n<p>开始精读：</p>\n<p>This year marks / exactly two centuries / since the publication of Frankenstein; / or, The Modern Prometheus, / by Mary Shelley. / Even before the invention / of the electric light bulb, / the author produced / a remarkable work of <strong>[xxx]</strong> fiction / that would <strong>[xxx]</strong> / many ethical questions / to be raised by technologies / yet to come.</p>\n<p>今年标志着 / 恰好两个世纪 / 自《弗兰肯斯坦》的出版以来；/ 或者叫《现代普罗米修斯》，/ 由玛丽·雪莱所写。/ 甚至在发明之前 / 电灯泡的，/ 这位作者写出了 / 一本不寻常的 <strong>[xxx]</strong> 小说 / 它将会 <strong>[xxx]</strong> / 许多伦理问题 / 将由技术提出的 / 还没有到来的。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Today the rapid growth of artificial intelligence (AI) raises <strong>[xxx]</strong> questions: “What is intelligence, <strong>[xxx]</strong>, or consciousness? What makes humans humans?”</p>\n<p>开始精读：</p>\n<p>Today / the rapid growth of artificial intelligence (AI) / raises <strong>[xxx]</strong> questions: / “What is intelligence, <strong>[xxx]</strong>, or consciousness? / What makes humans humans?”</p>\n<p>今天 / 人工智能的迅速增长 / 提出了 <strong>[xxx]</strong> 问题：/ “什么是智能、<strong>[xxx]</strong> 或者意识？/ 什么使人类成为人类？”</p>\n</blockquote>\n<p>第一段把小说和 many ethical questions 放在一起，第二段接着谈今天人工智能的发展以及人的智能、意识。空格要补的是这部小说为什么适合放在这里开头，而不是单独介绍小说的出版资料。</p>\n","articleRects":[[307,329,1238,45],[228,383,1320,36],[228,434,1321,35],[228,484,1292,35],[307,532,1240,37],[228,583,1319,36],[228,633,305,33]],"questionRects":[[255,214,1157,36]],"scrollTarget":"auto","meta":{"kind":"question","qid":"31"}},{"section":"31题","raw":"### A. involves some concerns raised by AI today\n\n> 涉及今天人工智能引发的一些关切\n\n把A接回题干，它说的是：这部小说被提到，是因为它涉及今天人工智能引发的一些关切。\n\nA里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。\n\n> Even before the invention of the electric light bulb, the author produced a remarkable work of **[xxx]** fiction that would **[xxx]** many ethical questions to be raised by technologies yet to come.\n\n> Today the rapid growth of artificial intelligence (AI) raises **[xxx]** questions:\n\n第一段的 many ethical questions 后面跟着 to be raised by technologies yet to come，问题与未来的技术有关。第二段从 Today 起笔，具体说到了人工智能，以及智能、意识和人之所以为人的疑问。A的 concerns raised by AI today 把前面的“技术问题”落到了后面的“今天的人工智能”。小说中间那个动作暂时读不出，但两段放在一起，讨论对象确实从小说中的技术伦理疑问接到了今天的人工智能疑问。A没有把小说说成技术发明，也没有说小说已解决这些问题，只说涉及了一些相关关切。\n\n**A说小说涉及今天人工智能引发的关切，能和这两段先谈技术伦理疑问、再谈人工智能的安排接上吗？**\n\n能。第一段留下的是技术将带来的伦理问题，第二段接上的就是人工智能正在提出的问题；“涉及一些关切”与这个衔接相容，先留下A。\n\n**第一轮判断：A保留。**","html":"<h3>A. involves some concerns raised by AI today</h3>\n<blockquote>\n<p>涉及今天人工智能引发的一些关切</p>\n</blockquote>\n<p>把A接回题干，它说的是：这部小说被提到，是因为它涉及今天人工智能引发的一些关切。</p>\n<p>A里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。</p>\n<blockquote>\n<p>Even before the invention of the electric light bulb, the author produced a remarkable work of <strong>[xxx]</strong> fiction that would <strong>[xxx]</strong> many ethical questions to be raised by technologies yet to come.</p>\n</blockquote>\n<blockquote>\n<p>Today the rapid growth of artificial intelligence (AI) raises <strong>[xxx]</strong> questions:</p>\n</blockquote>\n<p>第一段的 many ethical questions 后面跟着 to be raised by technologies yet to come，问题与未来的技术有关。第二段从 Today 起笔，具体说到了人工智能，以及智能、意识和人之所以为人的疑问。A的 concerns raised by AI today 把前面的“技术问题”落到了后面的“今天的人工智能”。小说中间那个动作暂时读不出，但两段放在一起，讨论对象确实从小说中的技术伦理疑问接到了今天的人工智能疑问。A没有把小说说成技术发明，也没有说小说已解决这些问题，只说涉及了一些相关关切。</p>\n<p><strong>A说小说涉及今天人工智能引发的关切，能和这两段先谈技术伦理疑问、再谈人工智能的安排接上吗？</strong></p>\n<p>能。第一段留下的是技术将带来的伦理问题，第二段接上的就是人工智能正在提出的问题；“涉及一些关切”与这个衔接相容，先留下A。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[307,329,1238,45],[228,383,1320,36],[228,434,1321,35],[228,484,1292,35],[307,532,1240,37],[228,583,1319,36],[228,633,305,33]],"questionRects":[[255,214,1157,36],[315,285,748,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"visibleSourceAnchor":"many ethical questions","visibleOptionAnchor":"concerns raised by AI today"}}}},{"section":"31题","raw":"### B. has remained popular for as long as 200 years\n\n> 足足两百年来一直受欢迎\n\n把B接回题干，它说的是：提到这部小说，是因为它已经持续流行了两百年。\n\nB的 has remained popular 后面限定两百年，第一段 since the publication 也在计算时间；两边提到的时长相同，因此回看第一句，确定两百年到底在计算哪件事。\n\n> This year marks exactly two centuries since the publication of Frankenstein; or, The Modern Prometheus, by Mary Shelley.\n\n原文用 since the publication 计算的是“自出版以来到今年”的时间，起点是出版事件。B的 has remained popular 则把这整段时间写成了持续受欢迎的状态：从出版到现在一直有人喜爱。年份相同，所记录的事情却不同。出版了两百年的小说，可以在某些时期流行，也可以一度很少被阅读；第一句的纪念时间不能被直接读成两百年不断流行。紧接着作者谈的是作品中的伦理问题，也不是追述它在各年代的读者和销量。\n\n**“距出版已有两百年”能直接读成“整整两百年一直受欢迎”吗？**\n\n不能。前者给出出版日期到现在的间隔，后者给出全程持续的流行状态；B把出版时间换成了受欢迎的持续时间。\n\n**第一轮判断：B排除。**","html":"<h3>B. has remained popular for as long as 200 years</h3>\n<blockquote>\n<p>足足两百年来一直受欢迎</p>\n</blockquote>\n<p>把B接回题干，它说的是：提到这部小说，是因为它已经持续流行了两百年。</p>\n<p>B的 has remained popular 后面限定两百年，第一段 since the publication 也在计算时间；两边提到的时长相同，因此回看第一句，确定两百年到底在计算哪件事。</p>\n<blockquote>\n<p>This year marks exactly two centuries since the publication of Frankenstein; or, The Modern Prometheus, by Mary Shelley.</p>\n</blockquote>\n<p>原文用 since the publication 计算的是“自出版以来到今年”的时间，起点是出版事件。B的 has remained popular 则把这整段时间写成了持续受欢迎的状态：从出版到现在一直有人喜爱。年份相同，所记录的事情却不同。出版了两百年的小说，可以在某些时期流行，也可以一度很少被阅读；第一句的纪念时间不能被直接读成两百年不断流行。紧接着作者谈的是作品中的伦理问题，也不是追述它在各年代的读者和销量。</p>\n<p><strong>“距出版已有两百年”能直接读成“整整两百年一直受欢迎”吗？</strong></p>\n<p>不能。前者给出出版日期到现在的间隔，后者给出全程持续的流行状态；B把出版时间换成了受欢迎的持续时间。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[307,329,1238,45],[228,383,1320,36],[228,434,1321,35],[228,484,1292,35]],"questionRects":[[255,214,1157,36],[315,355,797,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 has remained popular 后面限定两百年，第一段 since the publication 也在计算时间；两边提到的时长相同，因此回看第一句，确定两百年到底在计算哪件事。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time","action_direction"],"visibleSourceAnchor":"since the publication","visibleOptionAnchor":"has remained popular"}}}},{"section":"31题","raw":"### C. fascinates AI scientists all over the world\n\n> 使全世界的人工智能科学家着迷\n\n把C接回题干，它说的是：文中提到这部小说，是因为它让全世界的人工智能科学家着迷。\n\nC中的 fascinates AI scientists 把对象落在人工智能科学家身上，粗读时第三段出现过科学家和机器；scientists指的也是科学家这个对象，所以先回到第三段读完，再看影响科学家的到底是什么。\n\n> 原文参考：\n>\n> What is being called artificial general intelligence, machines that would imitate the way humans think, continues to **[xxx]** scientists. Yet humans remain **[xxx]** by the idea of robots that would look, move, and respond like humans, similar to those recently **[xxx]** on popular sci-fi TV series such as “Westworld” and “Humans.”\n>\n> 开始精读：\n>\n> What is being called artificial general intelligence, / machines that would imitate / the way humans think, / continues to **[xxx]** scientists. / Yet humans remain **[xxx]** / by the idea of robots / that would look, move, and respond like humans, / similar to those recently **[xxx]** / on popular sci-fi TV series / such as “Westworld” and “Humans.”\n>\n> 现在被称为通用人工智能的东西，/ 那些将模仿的机器 / 人类思考的方式，/ 继续 **[xxx]** 科学家。/ 然而人类仍然 **[xxx]** / 被机器人的想法 / 它们将看起来、移动并作出反应像人类一样，/ 类似那些最近 **[xxx]** 的 / 在流行的科幻电视剧中 / 比如《西部世界》和《真实的人类》。\n\n回到C，fascinates AI scientists把影响科学家的主语写成了小说；第三段的主语却是artificial general intelligence，接着再看这两处具体说法。\n\n> What is being called artificial general intelligence, machines that would imitate the way humans think, continues to **[xxx]** scientists.\n\n> Yet humans remain **[xxx]** by the idea of robots that would look, move, and respond like humans\n\n这里与 scientists 搭配的主语是 artificial general intelligence，后面的 machines 解释它是模仿人类思考的机器。C的 fascinates AI scientists 接回题干后，主语却变成了玛丽·雪莱的小说。下一句又换到 humans 和 the idea of robots，举的是电视剧中的类人机器人。哪一处都不能把“通用人工智能对科学家的影响”改成“这本小说使全世界科学家着迷”：不仅主语换了，all over the world 还把对象扩成全世界的科学家。中间动词即使暂时不认识，它前面的 artificial general intelligence 仍然不是小说。\n\n**第三段中对科学家发生作用的主语，是小说《弗兰肯斯坦》，还是通用人工智能？**\n\n后者。原句明写 artificial general intelligence，并用模仿人类思考的机器来解释；C把这个主语换成小说，不能据此回答为什么提到小说。\n\n**第一轮判断：C排除。**","html":"<h3>C. fascinates AI scientists all over the world</h3>\n<blockquote>\n<p>使全世界的人工智能科学家着迷</p>\n</blockquote>\n<p>把C接回题干，它说的是：文中提到这部小说，是因为它让全世界的人工智能科学家着迷。</p>\n<p>C中的 fascinates AI scientists 把对象落在人工智能科学家身上，粗读时第三段出现过科学家和机器；scientists指的也是科学家这个对象，所以先回到第三段读完，再看影响科学家的到底是什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>What is being called artificial general intelligence, machines that would imitate the way humans think, continues to <strong>[xxx]</strong> scientists. Yet humans remain <strong>[xxx]</strong> by the idea of robots that would look, move, and respond like humans, similar to those recently <strong>[xxx]</strong> on popular sci-fi TV series such as “Westworld” and “Humans.”</p>\n<p>开始精读：</p>\n<p>What is being called artificial general intelligence, / machines that would imitate / the way humans think, / continues to <strong>[xxx]</strong> scientists. / Yet humans remain <strong>[xxx]</strong> / by the idea of robots / that would look, move, and respond like humans, / similar to those recently <strong>[xxx]</strong> / on popular sci-fi TV series / such as “Westworld” and “Humans.”</p>\n<p>现在被称为通用人工智能的东西，/ 那些将模仿的机器 / 人类思考的方式，/ 继续 <strong>[xxx]</strong> 科学家。/ 然而人类仍然 <strong>[xxx]</strong> / 被机器人的想法 / 它们将看起来、移动并作出反应像人类一样，/ 类似那些最近 <strong>[xxx]</strong> 的 / 在流行的科幻电视剧中 / 比如《西部世界》和《真实的人类》。</p>\n</blockquote>\n<p>回到C，fascinates AI scientists把影响科学家的主语写成了小说；第三段的主语却是artificial general intelligence，接着再看这两处具体说法。</p>\n<blockquote>\n<p>What is being called artificial general intelligence, machines that would imitate the way humans think, continues to <strong>[xxx]</strong> scientists.</p>\n</blockquote>\n<blockquote>\n<p>Yet humans remain <strong>[xxx]</strong> by the idea of robots that would look, move, and respond like humans</p>\n</blockquote>\n<p>这里与 scientists 搭配的主语是 artificial general intelligence，后面的 machines 解释它是模仿人类思考的机器。C的 fascinates AI scientists 接回题干后，主语却变成了玛丽·雪莱的小说。下一句又换到 humans 和 the idea of robots，举的是电视剧中的类人机器人。哪一处都不能把“通用人工智能对科学家的影响”改成“这本小说使全世界科学家着迷”：不仅主语换了，all over the world 还把对象扩成全世界的科学家。中间动词即使暂时不认识，它前面的 artificial general intelligence 仍然不是小说。</p>\n<p><strong>第三段中对科学家发生作用的主语，是小说《弗兰肯斯坦》，还是通用人工智能？</strong></p>\n<p>后者。原句明写 artificial general intelligence，并用模仿人类思考的机器来解释；C把这个主语换成小说，不能据此回答为什么提到小说。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[307,684,1241,36],[228,734,1320,36],[228,784,1320,36],[228,834,1319,36],[230,883,490,29]],"questionRects":[[255,214,1157,36],[315,426,719,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C中的 fascinates AI scientists 把对象落在人工智能科学家身上，粗读时第三段出现过科学家和机器；scientists指的也是科学家这个对象，所以先回到第三段读完，再看影响科学家的到底是什么。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[2],"sourceMode":"new_precision_reading","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","scope"],"visibleSourceAnchor":"scientists","visibleOptionAnchor":"fascinates AI scientists"}}}},{"section":"31题","raw":"### D. has sparked serious ethical **[xxx]**\n\n> 已经引发了严重的伦理 **[xxx]**\n\n把D接回题干，它说的是：这部小说被提到，是因为它已经引发了严重的伦理 **[xxx]**。\n\nD用 has sparked 说小说引发了某种伦理上的东西，第一段 ethical questions 也是小说后面紧接的伦理内容，因此回到第一段作品与伦理问题相连的那一句，看原文说的是哪种联系。\n\n> the author produced a remarkable work of **[xxx]** fiction that would **[xxx]** many ethical questions to be raised by technologies yet to come.\n\nD的 has sparked 把小说放在引发动作的前面，后面 serious ethical 的名词还看不懂。原文也把作品与 ethical questions 连起来，但 that would 后面的动作被挡住了，所以现在无法把“作品与问题的关系”读完整。后面的 to be raised by technologies yet to come 清楚说明这些问题与后来技术有关，却还不能说明小说只是涉及了问题，还是曾引发了关于问题的某种反应。D的最后一个词会决定这种反应究竟是什么；此刻不能擅自把它读成“讨论”或者“争论”再判断。\n\n**只凭现在能读出的 ethical questions，能确定D中小说引发的具体事情已经与原文冲突吗？**\n\n还不能。原文连接小说与问题的动作、D所指的具体伦理事情，都没有读完整；这里先留下D，不能把相关名词相似当成已经选定它。\n\n**第一轮判断：D保留。**","html":"<h3>D. has sparked serious ethical <strong>[xxx]</strong></h3>\n<blockquote>\n<p>已经引发了严重的伦理 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把D接回题干，它说的是：这部小说被提到，是因为它已经引发了严重的伦理 <strong>[xxx]</strong>。</p>\n<p>D用 has sparked 说小说引发了某种伦理上的东西，第一段 ethical questions 也是小说后面紧接的伦理内容，因此回到第一段作品与伦理问题相连的那一句，看原文说的是哪种联系。</p>\n<blockquote>\n<p>the author produced a remarkable work of <strong>[xxx]</strong> fiction that would <strong>[xxx]</strong> many ethical questions to be raised by technologies yet to come.</p>\n</blockquote>\n<p>D的 has sparked 把小说放在引发动作的前面，后面 serious ethical 的名词还看不懂。原文也把作品与 ethical questions 连起来，但 that would 后面的动作被挡住了，所以现在无法把“作品与问题的关系”读完整。后面的 to be raised by technologies yet to come 清楚说明这些问题与后来技术有关，却还不能说明小说只是涉及了问题，还是曾引发了关于问题的某种反应。D的最后一个词会决定这种反应究竟是什么；此刻不能擅自把它读成“讨论”或者“争论”再判断。</p>\n<p><strong>只凭现在能读出的 ethical questions，能确定D中小说引发的具体事情已经与原文冲突吗？</strong></p>\n<p>还不能。原文连接小说与问题的动作、D所指的具体伦理事情，都没有读完整；这里先留下D，不能把相关名词相似当成已经选定它。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[307,329,1238,45],[228,383,1320,36],[228,434,1321,35],[228,484,1292,35]],"questionRects":[[255,214,1157,36],[315,496,702,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D用 has sparked 说小说引发了某种伦理上的东西，第一段 ethical questions 也是小说后面紧接的伦理内容，因此回到第一段作品与伦理问题相连的那一句，看原文说的是哪种联系。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"visibleSourceAnchor":"ethical questions","visibleOptionAnchor":"has sparked"}}}},{"section":"31题","raw":"### 31题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C排除；\n- D保留。\n\nA能接住两段共同的技术伦理疑问；D中的具体伦理事情和小说的作用还没有读清。第一遍先留下A和D。","html":"<h3>31题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>A能接住两段共同的技术伦理疑问；D中的具体伦理事情和小说的作用还没有读清。第一遍先留下A和D。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"31"}},{"section":"32题","raw":"## 32题\n\n> In David Eagleman’s opinion, our current knowledge of consciousness ______.  \n> 按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？\n\n题干点名 David Eagleman，并问他对 consciousness 的看法，所以直接回到第四段，把他的整段话读完。\n\n> 原文参考：\n>\n> Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University **[xxx]**. “We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.”\n>\n> 开始精读：\n>\n> Just how people think / is still far too complex to be understood, / let alone reproduced, / says David Eagleman, / a Stanford University **[xxx]**. / “We are just in a situation / where there are no good theories / explaining what consciousness actually is / and how you could ever build a machine / to get there.”\n>\n> 人们究竟怎样思考 / 仍然太过复杂以至于无法理解，/ 更不用说被复制出来，/ 大卫·伊格曼说，/ 一位斯坦福大学的 **[xxx]**。/ “我们只是处在一种情况中 / 在那里没有好的理论 / 解释意识究竟是什么 / 以及你到底怎样能造出一台机器 / 到达那个程度。”\n\n这段先说人的思考复杂得还无法理解，再说没有好的理论解释意识是什么、怎样造出具有这种东西的机器。题干的 our current knowledge 要和这种“目前理解到了哪一步”接起来。","html":"<h2>32题</h2>\n<blockquote>\n<p>In David Eagleman’s opinion, our current knowledge of consciousness ______.<br>按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？</p>\n</blockquote>\n<p>题干点名 David Eagleman，并问他对 consciousness 的看法，所以直接回到第四段，把他的整段话读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University <strong>[xxx]</strong>. “We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.”</p>\n<p>开始精读：</p>\n<p>Just how people think / is still far too complex to be understood, / let alone reproduced, / says David Eagleman, / a Stanford University <strong>[xxx]</strong>. / “We are just in a situation / where there are no good theories / explaining what consciousness actually is / and how you could ever build a machine / to get there.”</p>\n<p>人们究竟怎样思考 / 仍然太过复杂以至于无法理解，/ 更不用说被复制出来，/ 大卫·伊格曼说，/ 一位斯坦福大学的 <strong>[xxx]</strong>。/ “我们只是处在一种情况中 / 在那里没有好的理论 / 解释意识究竟是什么 / 以及你到底怎样能造出一台机器 / 到达那个程度。”</p>\n</blockquote>\n<p>这段先说人的思考复杂得还无法理解，再说没有好的理论解释意识是什么、怎样造出具有这种东西的机器。题干的 our current knowledge 要和这种“目前理解到了哪一步”接起来。</p>\n","articleRects":[[307,935,1241,35],[228,985,1319,35],[224,1035,1323,35],[228,1083,1079,37]],"questionRects":[[255,636,1311,36]],"scrollTarget":"auto","meta":{"kind":"question","qid":"32"}},{"section":"32题","raw":"### A. helps explain artificial intelligence\n\n> 有助于解释人工智能\n\n把A接回题干，它说的是：伊格曼认为，我们目前对意识的认识有助于解释人工智能。\n\nA的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。\n\n> We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.\n\n引语里的 no good theories 同时带出两个解释对象：意识究竟是什么，以及怎样造出一台机器达到那个程度。A的 helps explain 却把我们的现有认识写成了正在帮助解释人工智能的资源。题目限定 current，比较的就是眼下；伊格曼明确说眼下没有好的理论完成这些解释，不能把“解释尚未建立”读成“已有认识在提供解释”。前一句还说人的思考仍太复杂，无法理解，这也不是在介绍现有认识已经带来的解释成果。\n\n**伊格曼是在说现有认识已经帮助我们解释机器智能，还是说所需的解释理论还没有建立好？**\n\n后者。no good theories 直接落在理解意识和制造相关机器的解释上，A把这项尚未完成的工作写成已有的帮助。\n\n**第一轮判断：A排除。**","html":"<h3>A. helps explain artificial intelligence</h3>\n<blockquote>\n<p>有助于解释人工智能</p>\n</blockquote>\n<p>把A接回题干，它说的是：伊格曼认为，我们目前对意识的认识有助于解释人工智能。</p>\n<p>A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。</p>\n<blockquote>\n<p>We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.</p>\n</blockquote>\n<p>引语里的 no good theories 同时带出两个解释对象：意识究竟是什么，以及怎样造出一台机器达到那个程度。A的 helps explain 却把我们的现有认识写成了正在帮助解释人工智能的资源。题目限定 current，比较的就是眼下；伊格曼明确说眼下没有好的理论完成这些解释，不能把“解释尚未建立”读成“已有认识在提供解释”。前一句还说人的思考仍太复杂，无法理解，这也不是在介绍现有认识已经带来的解释成果。</p>\n<p><strong>伊格曼是在说现有认识已经帮助我们解释机器智能，还是说所需的解释理论还没有建立好？</strong></p>\n<p>后者。no good theories 直接落在理解意识和制造相关机器的解释上，A把这项尚未完成的工作写成已有的帮助。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[307,935,1241,35],[228,985,1319,35],[224,1035,1323,35],[228,1083,1079,37]],"questionRects":[[255,636,1311,36],[315,707,607,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["negation","action_direction"],"visibleSourceAnchor":"no good theories","visibleOptionAnchor":"helps explain"}}}},{"section":"32题","raw":"### B. is too limited for us to reproduce it\n\n> 太有限，以至于我们无法把意识复制出来\n\n把B接回题干，它说的是：伊格曼认为，我们目前对于意识的认识太有限，还不能把它复制出来。\n\nB的 too limited 说认识程度不够，第四段 let alone reproduced 把复制放在连理解都未完成的后面；两者都在比较当前认识与复制要求，所以回看第四段第一句和紧随的解释。\n\n> Just how people think is still far too complex to be understood, let alone reproduced\n\n> there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.\n\n先有 far too complex to be understood：人怎样思考还复杂得无法理解；再有 let alone reproduced：连前一步都没完成，更谈不上复制。B的 too limited 描述的正是我们当前认识的不足，而不是说意识本身简单或能力很低。it 接着题干指意识，要复制的是意识这一对象。后面的 no good theories 又把不足写得具体：没有合适理论解释意识是什么，也没有解释如何造机器达到那个程度。这几处都能接上“认识太有限，还不能复制”，而不是“机器永远不可能出现”。\n\n**连意识怎样形成都缺少足够解释，能否支持“当前认识还不足以把它复制出来”？**\n\n能。原句从尚不能理解推进到更不能复制，B把这个先后条件说出来了，too limited也限定在当前认识。\n\n**第一轮判断：B保留。**","html":"<h3>B. is too limited for us to reproduce it</h3>\n<blockquote>\n<p>太有限，以至于我们无法把意识复制出来</p>\n</blockquote>\n<p>把B接回题干，它说的是：伊格曼认为，我们目前对于意识的认识太有限，还不能把它复制出来。</p>\n<p>B的 too limited 说认识程度不够，第四段 let alone reproduced 把复制放在连理解都未完成的后面；两者都在比较当前认识与复制要求，所以回看第四段第一句和紧随的解释。</p>\n<blockquote>\n<p>Just how people think is still far too complex to be understood, let alone reproduced</p>\n</blockquote>\n<blockquote>\n<p>there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.</p>\n</blockquote>\n<p>先有 far too complex to be understood：人怎样思考还复杂得无法理解；再有 let alone reproduced：连前一步都没完成，更谈不上复制。B的 too limited 描述的正是我们当前认识的不足，而不是说意识本身简单或能力很低。it 接着题干指意识，要复制的是意识这一对象。后面的 no good theories 又把不足写得具体：没有合适理论解释意识是什么，也没有解释如何造机器达到那个程度。这几处都能接上“认识太有限，还不能复制”，而不是“机器永远不可能出现”。</p>\n<p><strong>连意识怎样形成都缺少足够解释，能否支持“当前认识还不足以把它复制出来”？</strong></p>\n<p>能。原句从尚不能理解推进到更不能复制，B把这个先后条件说出来了，too limited也限定在当前认识。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[307,935,1241,35],[228,985,1319,35],[224,1035,1323,35],[228,1083,1079,37]],"questionRects":[[255,636,1311,36],[315,777,624,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的 too limited 说认识程度不够，第四段 let alone reproduced 把复制放在连理解都未完成的后面；两者都在比较当前认识与复制要求，所以回看第四段第一句和紧随的解释。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"let alone reproduced","visibleOptionAnchor":"too limited"}}}},{"section":"32题","raw":"### C. **[xxx]** popular sci-fi TV series\n\n> 对流行科幻电视剧有一种 **[xxx]** 作用\n\n把C接回题干，它说的是：伊格曼认为，我们目前对意识的认识 **[xxx]** 流行的科幻电视剧。\n\nC里的 popular sci-fi TV series 指向上一题读过的第三段，其中 like humans 描述电视剧相关的机器人形象；都是在谈荧幕上的类人机器，所以回看第三段后半句，并与第四段的意识认识相连着比较。\n\n> Yet humans remain **[xxx]** by the idea of robots that would look, move, and respond like humans, similar to those recently **[xxx]** on popular sci-fi TV series such as “Westworld” and “Humans.”\n\n> We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.\n\n第三段的 like humans 说的是机器人看起来、移动和反应像人，这些形象又连着 popular sci-fi TV series。第四段伊格曼谈现实认识：解释意识的好理论尚缺。C把题干中的“当前认识”和这些电视剧接在一起，但中间承担动作的词是 **[xxx]**。如果不认识它，我们就不知道C是在说现实认识支持电视剧、影响电视剧，还是与电视剧存在另外一种关系。原文的确把荧幕形象与现实中的理解困难相邻放着，因此不能只因C提电视剧，就把中间尚未读懂的动作替它判成错误。\n\n**当C连接“当前认识”和“科幻电视剧”的动作还没读出来时，能把这个完整判断直接排除吗？**\n\n还不能。电视剧确实与类人机器人连在前一段，现实中的意识认识又紧跟其后；两者具体怎样相连是C没有读清的部分，先留着。\n\n**第一轮判断：C保留。**","html":"<h3>C. <strong>[xxx]</strong> popular sci-fi TV series</h3>\n<blockquote>\n<p>对流行科幻电视剧有一种 <strong>[xxx]</strong> 作用</p>\n</blockquote>\n<p>把C接回题干，它说的是：伊格曼认为，我们目前对意识的认识 <strong>[xxx]</strong> 流行的科幻电视剧。</p>\n<p>C里的 popular sci-fi TV series 指向上一题读过的第三段，其中 like humans 描述电视剧相关的机器人形象；都是在谈荧幕上的类人机器，所以回看第三段后半句，并与第四段的意识认识相连着比较。</p>\n<blockquote>\n<p>Yet humans remain <strong>[xxx]</strong> by the idea of robots that would look, move, and respond like humans, similar to those recently <strong>[xxx]</strong> on popular sci-fi TV series such as “Westworld” and “Humans.”</p>\n</blockquote>\n<blockquote>\n<p>We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.</p>\n</blockquote>\n<p>第三段的 like humans 说的是机器人看起来、移动和反应像人，这些形象又连着 popular sci-fi TV series。第四段伊格曼谈现实认识：解释意识的好理论尚缺。C把题干中的“当前认识”和这些电视剧接在一起，但中间承担动作的词是 <strong>[xxx]</strong>。如果不认识它，我们就不知道C是在说现实认识支持电视剧、影响电视剧，还是与电视剧存在另外一种关系。原文的确把荧幕形象与现实中的理解困难相邻放着，因此不能只因C提电视剧，就把中间尚未读懂的动作替它判成错误。</p>\n<p><strong>当C连接“当前认识”和“科幻电视剧”的动作还没读出来时，能把这个完整判断直接排除吗？</strong></p>\n<p>还不能。电视剧确实与类人机器人连在前一段，现实中的意识认识又紧跟其后；两者具体怎样相连是C没有读清的部分，先留着。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[307,684,1241,36],[228,734,1320,36],[228,784,1320,36],[228,834,1319,36],[230,883,490,29],[307,935,1241,35],[228,985,1319,35],[224,1035,1323,35],[228,1083,1079,37]],"questionRects":[[255,636,1311,36],[316,848,567,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的 popular sci-fi TV series 指向上一题读过的第三段，其中 like humans 描述电视剧相关的机器人形象；都是在谈荧幕上的类人机器，所以回看第三段后半句，并与第四段的意识认识相连着比较。"],"evidenceParagraphPids":[2,3],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"visibleSourceAnchor":"like humans","visibleOptionAnchor":"popular sci-fi TV series"}}}},{"section":"32题","raw":"### D. can be misleading to robot making\n\n> 可能误导机器人的制造\n\n把D接回题干，它说的是：伊格曼认为，我们目前对于意识的认识会误导机器人的制造。\n\nD的 misleading 指向认识把造机器带偏，第四段 no good theories 则说明意识与造机器之间缺少什么解释，因此回到伊格曼那句同时谈意识和 build a machine 的话。\n\n> We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.\n\n原文的 no good theories 是理论还没能解释意识和机器的实现方法，重点在没有弄明白。D的 misleading 则要求已有认识给了一个错误方向，照着它去造机器人会被带偏。这是两种不同的认识问题：不知道怎样做，不等于已经给出了错误做法。伊格曼前面说 too complex to be understood，后面仍在讲解释没有完成；他并没有把某种现有理论作为错误路线来批判。D将“认识不足，无法指导复制”换成了“已有认识产生错误指导”，改变了认识与造机器的关系。\n\n**“尚无好理论告诉我们怎样造出来”，等不等于“现有认识正在把制造工作带向错误方向”？**\n\n不等于。缺少可用解释使复制难以进行，misleading则指错误解释造成误导；伊格曼说的是前一种困难。\n\n**第一轮判断：D排除。**","html":"<h3>D. can be misleading to robot making</h3>\n<blockquote>\n<p>可能误导机器人的制造</p>\n</blockquote>\n<p>把D接回题干，它说的是：伊格曼认为，我们目前对于意识的认识会误导机器人的制造。</p>\n<p>D的 misleading 指向认识把造机器带偏，第四段 no good theories 则说明意识与造机器之间缺少什么解释，因此回到伊格曼那句同时谈意识和 build a machine 的话。</p>\n<blockquote>\n<p>We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.</p>\n</blockquote>\n<p>原文的 no good theories 是理论还没能解释意识和机器的实现方法，重点在没有弄明白。D的 misleading 则要求已有认识给了一个错误方向，照着它去造机器人会被带偏。这是两种不同的认识问题：不知道怎样做，不等于已经给出了错误做法。伊格曼前面说 too complex to be understood，后面仍在讲解释没有完成；他并没有把某种现有理论作为错误路线来批判。D将“认识不足，无法指导复制”换成了“已有认识产生错误指导”，改变了认识与造机器的关系。</p>\n<p><strong>“尚无好理论告诉我们怎样造出来”，等不等于“现有认识正在把制造工作带向错误方向”？</strong></p>\n<p>不等于。缺少可用解释使复制难以进行，misleading则指错误解释造成误导；伊格曼说的是前一种困难。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[307,935,1241,35],[228,985,1319,35],[224,1035,1323,35],[228,1083,1079,37]],"questionRects":[[255,636,1311,36],[315,918,614,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的 misleading 指向认识把造机器带偏，第四段 no good theories 则说明意识与造机器之间缺少什么解释，因此回到伊格曼那句同时谈意识和 build a machine 的话。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction"],"visibleSourceAnchor":"no good theories","visibleOptionAnchor":"misleading"}}}},{"section":"32题","raw":"### 32题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C保留；\n- D排除。\n\nB能接住还无法理解、更不能复制的判断；C中连接意识认识与电视剧的动作仍然看不懂。这一遍先留下B和C。","html":"<h3>32题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>B能接住还无法理解、更不能复制的判断；C中连接意识认识与电视剧的动作仍然看不懂。这一遍先留下B和C。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"32"}},{"section":"33题","raw":"## 33题\n\n> The solution to the ethical issues brought by autonomous vehicles ______.  \n> 自动驾驶车辆所带来的伦理问题，其解决办法怎样？\n\n题干直接给出 autonomous vehicles，所以回到第五段。这里不仅介绍自动驾驶车辆，还比较人类驾驶员的反应与人工智能的处理能力，先从段首读到段尾。\n\n> 原文参考：\n>\n> But that doesn’t mean **[xxx]** ethical issues involving AI aren’t at hand. The coming use of autonomous vehicles, for example, poses **[xxx]** ethical questions. Human drivers sometimes must make split-second decisions. Their reactions may be a complex combination of instant **[xxx]**, input from past driving experiences, and what their eyes and ears tell them in that moment. AI “vision” today is not nearly as **[xxx]** as that of humans. And to **[xxx]** every **[xxx]** driving situation is a difficult programming problem.\n>\n> 开始精读：\n>\n> But that doesn’t mean / **[xxx]** ethical issues involving AI / aren’t at hand. / The coming use of autonomous vehicles, / for example, / poses **[xxx]** ethical questions. / Human drivers sometimes must make split-second decisions. / Their reactions may be a complex combination / of instant **[xxx]**, / input from past driving experiences, / and what their eyes and ears tell them / in that moment. / AI “vision” today / is not nearly as **[xxx]** as that of humans. / And to **[xxx]** every **[xxx]** driving situation / is a difficult programming problem.\n>\n> 但那并不意味着 / 涉及人工智能的 **[xxx]** 伦理问题 / 没有近在眼前。/ 自动驾驶车辆即将到来的使用，/ 例如，/ 提出了 **[xxx]** 伦理问题。/ 人类驾驶员有时必须作出瞬间的决定。/ 他们的反应可能是复杂的组合 / 来自即时的 **[xxx]**，/ 来自过去驾驶经验的信息，/ 以及他们的眼睛和耳朵告诉他们的东西 / 在那个时刻。/ 今天人工智能的“视觉” / 远没有人类的那么 **[xxx]**。/ 而去 **[xxx]** 每种 **[xxx]** 驾驶情况 / 是一个困难的编程问题。\n\n题干问的是这些伦理问题怎样解决。第五段先说问题就在眼前，再写驾驶员需要瞬间决定、反应由多种信息组成，最后落在困难的编程问题上；接下来要看选项怎样描述解决这件事的状态。","html":"<h2>33题</h2>\n<blockquote>\n<p>The solution to the ethical issues brought by autonomous vehicles ______.<br>自动驾驶车辆所带来的伦理问题，其解决办法怎样？</p>\n</blockquote>\n<p>题干直接给出 autonomous vehicles，所以回到第五段。这里不仅介绍自动驾驶车辆，还比较人类驾驶员的反应与人工智能的处理能力，先从段首读到段尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But that doesn’t mean <strong>[xxx]</strong 远都找不到\n\n把A接回题干，它说的是：自动驾驶伦理问题的解决办法几乎永远找不到。\n\nA里的 hardly ever 把找不到解决办法推到几乎所有时候，第五段 today 则给人工智能能力加上了当前的时间限制，因此回看段尾关于今天的视觉与编程困难的两句。\n\n> AI “vision” today is not nearly as **[xxx]** as that of humans. And to **[xxx]** every **[xxx]** driving situation is a difficult programming problem.\n\n原文的 today 在讲人工智能今天的状态，后一句把处理各种驾驶情况说成 difficult programming problem，承认它很难。A的 hardly ever 却把这种眼下的困难扩大为几乎任何时候都找不到解决办法。困难可能需要更好的理论、数据或程序，但difficult本身不是“永远无解”。前文 coming use 还把车辆应用放在即将到来的时间里，整段是在讨论正在面对的能力限制，不是在给未来所有技术发展下一个否定判断。\n\n**今天存在困难的编程问题，能推出这件事几乎永远无法解决吗？**\n\n不能。today限定的是现在，hardly ever却扩大到了几乎所有时候；原文没有作出这样的永久判断。\n\n**第一轮判断：A排除。**","html":"<h3>A. can hardly ever be found</h3>\n<blockquote>\n<p>几乎永远都找不到</p>\n</blockquote>\n<p>把A接回题干，它说的是：自动驾驶伦理问题的解决办法几乎永远找不到。</p>\n<p>A里的 hardly ever 把找不到解决办法推到几乎所有时候，第五段 today 则给人工智能能力加上了当前的时间限制，因此回看段尾关于今天的视觉与编程困难的两句。</p>\n<blockquote>\n<p>AI “vision” today is not nearly as <strong>[xxx]</strong> as that of humans. And to <strong>[xxx]</strong> every <strong>[xxx]</strong> driving situation is a difficult programming problem.</p>\n</blockquote>\n<p>原文的 today 在讲人工智能今天的状态，后一句把处理各种驾驶情况说成 difficult programming problem，承认它很难。A的 hardly ever 却把这种眼下的困难扩大为几乎任何时候都找不到解决办法。困难可能需要更好的理论、数据或程序，但difficult本身不是“永远无解”。前文 coming use 还把车辆应用放在即将到来的时间里，整段是在讨论正在面对的能力限制，不是在给未来所有技术发展下一个否定判断。</p>\n<p><strong>今天存在困难的编程问题，能推出这件事几乎永远无法解决吗？</strong></p>\n<p>不能。today限定的是现在，hardly ever却扩大到了几乎所有时候；原文没有作出这样的永久判断。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[307,1135,1241,35],[228,1185,1309,36],[228,1235,1319,35],[228,1285,1320,36],[228,1334,1314,37],[228,1386,1319,35],[228,1436,1039,35]],"questionRects":[[255,1059,1126,35],[315,1129,456,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement 的“视觉”与人类比较，再把各种驾驶情况放进一个 difficult programming problem 中。C的 still beyond our 保留了“到现在仍超出”的方向，和原文说目前处理不了复杂驾驶情况能够接上。our后面的词没有读出来，它具体是指人的哪一方面，我们还不能翻译；但C也没有像A一样断言永远找不到解决方法。前面的驾驶员需要瞬间综合经验、眼耳信息，后面程序很难处理这些情况，至少能支持“目前尚有够不到的地方”。\n\n**C的“目前仍超出某种范围”，是否与原文今天仍面对复杂编程困难的说法相容？**\n\n能。still与today的时间方向一致，beyond our所指的具体名词还需保留疑问，但现在没有看到它把困难写成已经解决或永远无解。\n\n**第一轮判断：C保留。**","html":"<h3>C. is still beyond our <strong>[xxx]</strong></h3>\n<blockquote>\n<p>仍然超出了我们的 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：这些自动驾驶伦理问题的解决仍然超出了我们的 <strong>[xxx]</strong>。</p>\n<p>C里的 still beyond our 说目前还有某种达不到的地方，与第五段 difficult programming problem 都在描述解决时的困难，因此回看段尾人工智能视觉与驾驶情况编程的两句。</p>\n<blockquote>\n<p>AI “vision” today is not nearly as <strong>[xxx]</strong> as that of humans. And to <strong>[xxx]</strong> every <strong>[xxx]</strong> driving situation is a difficult programming problem.</p>\n</blockquote>\n<p>原文先把AI今天的“视觉”与人类比较，再把各种驾驶情况放进一个 difficult programming problem 中。C的 still beyond our 保留了“到现在仍超出”的方向，和原文说目前处理不了复杂驾驶情况能够接上。our后面的词没有读出来，它具体是指人的哪一方面，我们还不能翻译；但C也没有像A一样断言永远找不到解决方法。前面的驾驶员需要瞬间综合经验、眼耳信息，后面程序很难处理这些情况，至少能支持“目前尚有够不到的地方”。</p>\n<p><strong>C的“目前仍超出某种范围”，是否与原文今天仍面对复杂编程困难的说法相容？</strong></p>\n<p>能。still与today的时间方向一致，beyond our所指的具体名词还需保留疑问，但现在没有看到它把困难写成已经解决或永远无解。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[307,1135,1241,35],[228,1185,1309,36],[228,1235,1319,35],[228,1285,1320,36],[228,1334,1314,37],[228,1386,1319,35],[228,1436,1039,35]],"questionRects":[[255,1059,1126,35],[315,1270,487,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的 still beyond our 说目前还有某种达不到的地方，与第五段 difficult programming problem 都在描述解决时的困难，因此回看段尾人工智能视觉与驾驶情况编程的两句。"],"evidenceParagraphPids":[4],"
