agency / that is helping 政府 / develop a <strong>[xxx]</strong> code / for the ethical use of AI. / Along with Singapore, / 其他政府 and mega-corporations / are beginning to establish 自己的指导原则. / 英国 is setting up a data ethics center. / 印度 released its AI ethics strategy this spring.</p>\n<p>在6月7日 / 谷歌 pledged not to “design or <strong>[xxx]</strong> AI” / that would cause “总体伤害,” / or to develop 由人工智能引导的武器 / or use AI for <strong>[xxx]</strong> / that would violate international norms. / It also pledged not to deploy AI / whose use would violate international laws / or 人权.</p>\n<p>While the 声明 is 含糊, / it represents 一个起点. / So does the idea / that decisions made by AI systems / should be explainable, <strong>[xxx]</strong>, and 公平.</p>\n<p>To put it 另一种说法: / How can we make sure / that the 思考 of 智能机器 / reflects 人类最高的价值? / Only then will they be 有用的仆人 / and not Frankenstein’s 失控的怪物.</p>\n<p>1、今年、两个世纪、出版、玛丽·雪莱、电灯泡、作者、不寻常的作品、许多伦理问题、技术。</p>\n<p>2、今天、迅速增长、人工智能。</p>\n<p>3、机器、人类思考、科学家、机器人、看起来、移动并反应、流行的科幻电视剧。</p>\n<p>4、人们怎样思考、太复杂、没有好的理论、意识。</p>\n<p>5、伦理问题、自动驾驶车辆、人类驾驶员、瞬间的决定、过去的驾驶经验、眼睛和耳朵、困难的编程问题。</p>\n<p>6、大量数据、伦理问题、政府、其他政府、自己的指导原则、英国、印度。</p>\n<p>7、6月7日、谷歌、总体伤害、由人工智能引导的武器、人权。</p>\n<p>8、声明、含糊、一个起点、公平。</p>\n<p>9、另一种说法、思考、智能机器、人类最高的价值、有用的仆人、失控的怪物。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头似乎有两个世纪、玛丽·雪莱和许多伦理问题，接着出现人工智能、机器人和科幻电视剧；中间看到意识、自动驾驶车辆、困难的编程问题，还有英国、印度；后面又出现谷歌、人权、一个起点，最后是智能机器、有用的仆人和失控的怪物。</p>\n<p>到这里还不能自然地说清楚：那本小说与人工智能怎样连起来，自动驾驶车辆为什么牵涉伦理问题，各国、谷歌和那个起点分别说到了什么，现在还说不清。粗读时只要能判断“这篇文章大概与人工智能、伦理问题和一些技术做法有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住开头的小说、中间的自动驾驶车辆和政府、后面的谷歌与智能机器；这些信息之间到底是什么关系，等题目问到再精读。</p>\n<hr>\n<h1>3. 开始做31至34题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n<h2>31题</h2>\n<blockquote>\n<p>Mary Shelley’s novel Frankenstein is mentioned because it ______.<br>文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？</p>\n</blockquote>\n<p>题干直接给出了 Mary Shelley 和 Frankenstein，所以回到第一段看这部小说。题目问为什么提它，第一段说到还未到来的技术，紧接着第二段出现 Today 和人工智能；还要把相邻的第二段一起读完，看看话题怎样接下去。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>This year marks exactly two centuries since the publication of Frankenstein; or, The Modern Prometheus, by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of <strong>[xxx]</strong> fiction that would <strong>[xxx]</strong> many ethical questions to be raised by technologies yet to come.</p>\n<p>开始精读：</p>\n<p>This year marks / exactly two centuries / since the publication of Frankenstein; / or, The Modern Prometheus, / by Mary Shelley. / Even before the invention / of the electric light bulb, / the author produced / a remarkable work of <strong>[xxx]</strong> fiction / that would <strong>[xxx]</strong> / many ethical questions / to be raised by technologies / yet to come.</p>\n<p>今年标志着 / 恰好两个世纪 / 自《弗兰肯斯坦》的出版以来；/ 或者叫《现代普罗米修斯》，/ 由玛丽·雪莱所写。/ 甚至在发明之前 / 电灯泡的，/ 这位作者写出了 / 一本不寻常的 <strong>[xxx]</strong> 小说 / 它将会 <strong>[xxx]</strong> / 许多伦理问题 / 将由技术提出的 / 还没有到来的。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Today the rapid growth of artificial intelligence (AI) raises <strong>[xxx]</strong> questions: “What is intelligence, <strong>[xxx]</strong>, or consciousness? What makes humans humans?”</p>\n<p>开始精读：</p>\n<p>Today / the rapid growth of artificial intelligence (AI) / raises <strong>[xxx]</strong> questions: / “What is intelligence, <strong>[xxx]</strong>, or consciousness? / What makes humans humans?”</p>\n<p>今天 / 人工智能的迅速增长 / 提出了 <strong>[xxx]</strong> 问题：/ “什么是智能、<strong>[xxx]</strong> 或者意识？/ 什么使人类成为人类？”</p>\n</blockquote>\n<p>第一段把小说和 many ethical questions 放在一起，第二段接着谈今天人工智能的发展以及人的智能、意识。空格要补的是这部小说为什么适合放在这里开头，而不是单独介绍小说的出版资料。</p>\n<h3>A. involves some concerns raised by AI today</h3>\n<blockquote>\n<p>涉及今天人工智能引发的一些关切</p>\n</blockquote>\n<p>把A接回题干，它说的是：这部小说被提到，是因为它涉及今天人工智能引发的一些关切。</p>\n<p>A里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。</p>\n<blockquote>\n<p>Even before the invention of the electric light bulb, the author produced a remarkable work of <strong>[xxx]</strong> fiction that would <strong>[xxx]</strong> many ethical questions to be raised by technologies yet to come.</p>\n</blockquote>\n<blockquote>\n<p>Today the rapid growth of artificial intelligence (AI) raises <strong>[xxx]</strong> questions:</p>\n</blockquote>\n<p>第一段的 many ethical questions 后面跟着 to be raised by technologies yet to come，问题与未来的技术有关。第二段从 Today 起笔，具体说到了人工智能，以及智能、意识和人之所以为人的疑问。A的 concerns raised by AI today 把前面的“技术问题”落到了后面的“今天的人工智能”。小说中间那个动作暂时读不出，但两段放在一起，讨论对象确实从小说中的技术伦理疑问接到了今天的人工智能疑问。A没有把小说说成技术发明，也没有说小说已解决这些问题，只说涉及了一些相关关切。</p>\n<p><strong>A说小说涉及今天人工智能引发的关切，能和这两段先谈技术伦理疑问、再谈人工智能的安排接上吗？</strong></p>\n<p>能。第一段留下的是技术将带来的伦理问题，第二段接上的就是人工智能正在提出的问题；“涉及一些关切”与这个衔接相容，先留下A。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. has remained popular for as long as 200 years</h3>\n<blockquote>\n<p>足足两百年来一直受欢迎</p>\n</blockquote>\n<p>把B接回题干，它说的是：提到这部小说，是因为它已经持续流行了两百年。</p>\n<p>B的 has remained popular 后面限定两百年，第一段 since the publication 也在计算时间；两边提到的时长相同，因此回看第一句，确定两百年到底在计算哪件事。</p>\n<blockquote>\n<p>This year marks exactly two centuries since the publication of Frankenstein; or, The Modern Prometheus, by Mary Shelley.</p>\n</blockquote>\n<p>原文用 since the publication 计算的是“自出版以来到今年”的时间，起点是出版事件。B的 has remained popular 则把这整段时间写成了持续受欢迎的状态：从出版到现在一直有人喜爱。年份相同，所记录的事情却不同。出版了两百年的小说，可以在某些时期流行，也可以一度很少被阅读；第一句的纪念时间不能被直接读成两百年不断流行。紧接着作者谈的是作品中的伦理问题，也不是追述它在各年代的读者和销量。</p>\n<p><strong>“距出版已有两百年”能直接读成“整整两百年一直受欢迎”吗？</strong></p>\n<p>不能。前者给出出版日期到现在的间隔，后者给出全程持续的流行状态；B把出版时间换成了受欢迎的持续时间。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. fascinates AI scientists all over the world</h3>\n<blockquote>\n<p>使全世界的人工智能科学家着迷</p>\n</blockquote>\n<p>把C接回题干，它说的是：文中提到这部小说，是因为它让全世界的人工智能科学家着迷。</p>\n<p>C中的 fascinates AI scientists 把对象落在人工智能科学家身上，粗读时第三段出现过科学家和机器；scientists指的也是科学家这个对象，所以先回到第三段读完，再看影响科学家的到底是什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>What is being called artificial general intelligence, machines that would imitate the way humans think, continues to <strong>[xxx]</strong> scientists. Yet humans remain <strong>[xxx]</strong> by the idea of robots that would look, move, and respond like humans, similar to those recently <strong>[xxx]</strong> on popular sci-fi TV series such as “Westworld” and “Humans.”</p>\n<p>开始精读：</p>\n<p>What is being called artificial general intelligence, / machines that would imitate / the way humans think, / continues to <strong>[xxx]</strong> scientists. / Yet humans remain <strong>[xxx]</strong> / by the idea of robots / that would look, move, and respond like humans, / similar to those recently <strong>[xxx]</strong> / on popular sci-fi TV series / such as “Westworld” and “Humans.”</p>\n<p>现在被称为通用人工智能的东西，/ 那些将模仿的机器 / 人类思考的方式，/ 继续 <strong>[xxx]</strong> 科学家。/ 然而人类仍然 <strong>[xxx]</strong> / 被机器人的想法 / 它们将看起来、移动并作出反应像人类一样，/ 类似那些最近 <strong>[xxx]</strong> 的 / 在流行的科幻电视剧中 / 比如《西部世界》和《真实的人类》。</p>\n</blockquote>\n<p>回到C，fascinates AI scientists把影响科学家的主语写成了小说；第三段的主语却是artificial general intelligence，接着再看这两处具体说法。</p>\n<blockquote>\n<p>What is being called artificial general intelligence, machines that would imitate the way humans think, continues to <strong>[xxx]</strong> scientists.</p>\n</blockquote>\n<blockquote>\n<p>Yet humans remain <strong>[xxx]</strong> by the idea of robots that would look, move, and respond like humans</p>\n</blockquote>\n<p>这里与 scientists 搭配的主语是 artificial general intelligence，后面的 machines 解释它是模仿人类思考的机器。C的 fascinates AI scientists 接回题干后，主语却变成了玛丽·雪莱的小说。下一句又换到 humans 和 the idea of robots，举的是电视剧中的类人机器人。哪一处都不能把“通用人工智能对科学家的影响”改成“这本小说使全世界科学家着迷”：不仅主语换了，all over the world 还把对象扩成全世界的科学家。中间动词即使暂时不认识，它前面的 artificial general intelligence 仍然不是小说。</p>\n<p><strong>第三段中对科学家发生作用的主语，是小说《弗兰肯斯坦》，还是通用人工智能？</strong></p>\n<p>后者。原句明写 artificial general intelligence，并用模仿人类思考的机器来解释；C把这个主语换成小说，不能据此回答为什么提到小说。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. has sparked serious ethical <strong>[xxx]</strong></h3>\n<blockquote>\n<p>已经引发了严重的伦理 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把D接回题干，它说的是：这部小说被提到，是因为它已经引发了严重的伦理 <strong>[xxx]</strong>。</p>\n<p>D用 has sparked 说小说引发了某种伦理上的东西，第一段 ethical questions 也是小说后面紧接的伦理内容，因此回到第一段作品与伦理问题相连的那一句，看原文说的是哪种联系。</p>\n<blockquote>\n<p>the author produced a remarkable work of <strong>[xxx]</strong> fiction that would <strong>[xxx]</strong> many ethical questions to be raised by technologies yet to come.</p>\n</blockquote>\n<p>D的 has sparked 把小说放在引发动作的前面，后面 serious ethical 的名词还看不懂。原文也把作品与 ethical questions 连起来，但 that would 后面的动作被挡住了，所以现在无法把“作品与问题的关系”读完整。后面的 to be raised by technologies yet to come 清楚说明这些问题与后来技术有关，却还不能说明小说只是涉及了问题，还是曾引发了关于问题的某种反应。D的最后一个词会决定这种反应究竟是什么；此刻不能擅自把它读成“讨论”或者“争论”再判断。</p>\n<p><strong>只凭现在能读出的 ethical questions，能确定D中小说引发的具体事情已经与原文冲突吗？</strong></p>\n<p>还不能。原文连接小说与问题的动作、D所指的具体伦理事情，都没有读完整；这里先留下D，不能把相关名词相似当成已经选定它。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>31题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>A能接住两段共同的技术伦理疑问；D中的具体伦理事情和小说的作用还没有读清。第一遍先留下A和D。</p>\n<h2>32题</h2>\n<blockquote>\n<p>In David Eagleman’s opinion, our current knowledge of consciousness ______.<br>按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？</p>\n</blockquote>\n<p>题干点名 David Eagleman，并问他对 consciousness 的看法，所以直接回到第四段，把他的整段话读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University <strong>[xxx]</strong>. “We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.”</p>\n<p>开始精读：</p>\n<p>Just how people think / is still far too complex to be understood, / let alone reproduced, / says David Eagleman, / a Stanford University <strong>[xxx]</strong>. / “We are just in a situation / where there are no good theories / explaining what consciousness actually is / and how you could ever build a machine / to get there.”</p>\n<p>人们究竟怎样思考 / 仍然太过复杂以至于无法理解，/ 更不用说被复制出来，/ 大卫·伊格曼说，/ 一位斯坦福大学的 <strong>[xxx]</strong>。/ “我们只是处在一种情况中 / 在那里没有好的理论 / 解释意识究竟是什么 / 以及你到底怎样能造出一台机器 / 到达那个程度。”</p>\n</blockquote>\n<p>这段先说人的思考复杂得还无法理解，再说没有好的理论解释意识是什么、怎样造出具有这种东西的机器。题干的 our current knowledge 要和这种“目前理解到了哪一步”接起来。</p>\n<h3>A. helps explain artificial intelligence</h3>\n<blockquote>\n<p>有助于解释人工智能</p>\n</blockquote>\n<p>把A接回题干，它说的是：伊格曼认为，我们目前对意识的认识有助于解释人工智能。</p>\n<p>A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。</p>\n<blockquote>\n<p>We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.</p>\n</blockquote>\n<p>引语里的 no good theories 同时带出两个解释对象：意识究竟是什么，以及怎样造出一台机器达到那个程度。A的 helps explain 却把我们的现有认识写成了正在帮助解释人工智能的资源。题目限定 current，比较的就是眼下；伊格曼明确说眼下没有好的理论完成这些解释，不能把“解释尚未建立”读成“已有认识在提供解释”。前一句还说人的思考仍太复杂，无法理解，这也不是在介绍现有认识已经带来的解释成果。</p>\n<p><strong>伊格曼是在说现有认识已经帮助我们解释机器智能，还是说所需的解释理论还没有建立好？</strong></p>\n<p>后者。no good theories 直接落在理解意识和制造相关机器的解释上，A把这项尚未完成的工作写成已有的帮助。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. is too limited for us to reproduce it</h3>\n<blockquote>\n<p>太有限，以至于我们无法把意识复制出来</p>\n</blockquote>\n<p>把B接回题干，它说的是：伊格曼认为，我们目前对于意识的认识太有限，还不能把它复制出来。</p>\n<p>B的 too limited 说认识程度不够，第四段 let alone reproduced 把复制放在连理解都未完成的后面；两者都在比较当前认识与复制要求，所以回看第四段第一句和紧随的解释。</p>\n<blockquote>\n<p>Just how people think is still far too complex to be understood, let alone reproduced</p>\n</blockquote>\n<blockquote>\n<p>there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.</p>\n</blockquote>\n<p>先有 far too complex to be understood：人怎样思考还复杂得无法理解；再有 let alone reproduced：连前一步都没完成，更谈不上复制。B的 too limited 描述的正是我们当前认识的不足，而不是说意识本身简单或能力很低。it 接着题干指意识，要复制的是意识这一对象。后面的 no good theories 又把不足写得具体：没有合适理论解释意识是什么，也没有解释如何造机器达到那个程度。这几处都能接上“认识太有限，还不能复制”，而不是“机器永远不可能出现”。</p>\n<p><strong>连意识怎样形成都缺少足够解释，能否支持“当前认识还不足以把它复制出来”？</strong></p>\n<p>能。原句从尚不能理解推进到更不能复制，B把这个先后条件说出来了，too limited也限定在当前认识。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. <strong>[xxx]</strong> popular sci-fi TV series</h3>\n<blockquote>\n<p>对流行科幻电视剧有一种 <strong>[xxx]</strong> 作用</p>\n</blockquote>\n<p>把C接回题干，它说的是：伊格曼认为，我们目前对意识的认识 <strong>[xxx]</strong> 流行的科幻电视剧。</p>\n<p>C里的 popular sci-fi TV series 指向上一题读过的第三段，其中 like humans 描述电视剧相关的机器人形象；都是在谈荧幕上的类人机器，所以回看第三段后半句，并与第四段的意识认识相连着比较。</p>\n<blockquote>\n<p>Yet humans remain <strong>[xxx]</strong> by the idea of robots that would look, move, and respond like humans, similar to those recently <strong>[xxx]</strong> on popular sci-fi TV series such as “Westworld” and “Humans.”</p>\n</blockquote>\n<blockquote>\n<p>We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.</p>\n</blockquote>\n<p>第三段的 like humans 说的是机器人看起来、移动和反应像人，这些形象又连着 popular sci-fi TV series。第四段伊格曼谈现实认识：解释意识的好理论尚缺。C把题干中的“当前认识”和这些电视剧接在一起，但中间承担动作的词是 <strong>[xxx]</strong>。如果不认识它，我们就不知道C是在说现实认识支持电视剧、影响电视剧，还是与电视剧存在另外一种关系。原文的确把荧幕形象与现实中的理解困难相邻放着，因此不能只因C提电视剧，就把中间尚未读懂的动作替它判成错误。</p>\n<p><strong>当C连接“当前认识”和“科幻电视剧”的动作还没读出来时，能把这个完整判断直接排除吗？</strong></p>\n<p>还不能。电视剧确实与类人机器人连在前一段，现实中的意识认识又紧跟其后；两者具体怎样相连是C没有读清的部分，先留着。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. can be misleading to robot making</h3>\n<blockquote>\n<p>可能误导机器人的制造</p>\n</blockquote>\n<p>把D接回题干，它说的是：伊格曼认为，我们目前对于意识的认识会误导机器人的制造。</p>\n<p>D的 misleading 指向认识把造机器带偏，第四段 no good theories 则说明意识与造机器之间缺少什么解释，因此回到伊格曼那句同时谈意识和 build a machine 的话。</p>\n<blockquote>\n<p>We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.</p>\n</blockquote>\n<p>原文的 no good theories 是理论还没能解释意识和机器的实现方法，重点在没有弄明白。D的 misleading 则要求已有认识给了一个错误方向，照着它去造机器人会被带偏。这是两种不同的认识问题：不知道怎样做，不等于已经给出了错误做法。伊格曼前面说 too complex to be understood，后面仍在讲解释没有完成；他并没有把某种现有理论作为错误路线来批判。D将“认识不足，无法指导复制”换成了“已有认识产生错误指导”，改变了认识与造机器的关系。</p>\n<p><strong>“尚无好理论告诉我们怎样造出来”，等不等于“现有认识正在把制造工作带向错误方向”？</strong></p>\n<p>不等于。缺少可用解释使复制难以进行，misleading则指错误解释造成误导；伊格曼说的是前一种困难。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>32题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>B能接住还无法理解、更不能复制的判断；C中连接意识认识与电视剧的动作仍然看不懂。这一遍先留下B和C。</p>\n<h2>33题</h2>\n<blockquote>\n<p>The solution to the ethical issues brought by autonomous vehicles ______.<br>自动驾驶车辆所带来的伦理问题，其解决办法怎样？</p>\n</blockquote>\n<p>题干直接给出 autonomous vehicles，所以回到第五段。这里不仅介绍自动驾驶车辆，还比较人类驾驶员的反应与人工智能的处理能力，先从段首读到段尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>But that doesn’t mean <strong>[xxx]</strong> ethical issues involving AI aren’t at hand. The coming use of autonomous vehicles, for example, poses <strong>[xxx]</strong> ethical questions. Human drivers sometimes must make split-second decisions. Their reactions may be a complex combination of instant <strong>[xxx]</strong>, input from past driving experiences, and what their eyes and ears tell them in that moment. AI “vision” today is not nearly as <strong>[xxx]</strong> as that of humans. And to <strong>[xxx]</strong> every <strong>[xxx]</strong> driving situation is a difficult programming problem.</p>\n<p>开始精读：</p>\n<p>But that doesn’t mean / <strong>[xxx]</strong> ethical issues involving AI / aren’t at hand. / The coming use of autonomous vehicles, / for example, / poses <strong>[xxx]</strong> ethical questions. / Human drivers sometimes must make split-second decisions. / Their reactions may be a complex combination / of instant <strong>[xxx]</strong>, / input from past driving experiences, / and what their eyes and ears tell them / in that moment. / AI “vision” today / is not nearly as <strong>[xxx]</strong> as that of humans. / And to <strong>[xxx]</strong> every <strong>[xxx]</strong> driving situation / is a difficult programming problem.</p>\n<p>但那并不意味着 / 涉及人工智能的 <strong>[xxx]</strong> 伦理问题 / 没有近在眼前。/ 自动驾驶车辆即将到来的使用，/ 例如，/ 提出了 <strong>[xxx]</strong> 伦理问题。/ 人类驾驶员有时必须作出瞬间的决定。/ 他们的反应可能是复杂的组合 / 来自即时的 <strong>[xxx]</strong>，/ 来自过去驾驶经验的信息，/ 以及他们的眼睛和耳朵告诉他们的东西 / 在那个时刻。/ 今天人工智能的“视觉” / 远没有人类的那么 <strong>[xxx]</strong>。/ 而去 <strong>[xxx]</strong> 每种 <strong>[xxx]</strong> 驾驶情况 / 是一个困难的编程问题。</p>\n</blockquote>\n<p>题干问的是这些伦理问题怎样解决。第五段先说问题就在眼前，再写驾驶员需要瞬间决定、反应由多种信息组成，最后落在困难的编程问题上；接下来要看选项怎样描述解决这件事的状态。</p>\n<h3>A. can hardly ever be found</h3>\n<blockquote>\n<p>几乎永远都找不到</p>\n</blockquote>\n<p>把A接回题干，它说的是：自动驾驶伦理问题的解决办法几乎永远找不到。</p>\n<p>A里的 hardly ever 把找不到解决办法推到几乎所有时候，第五段 today 则给人工智能能力加上了当前的时间限制，因此回看段尾关于今天的视觉与编程困难的两句。</p>\n<blockquote>\n<p>AI “vision” today is not nearly as <strong>[xxx]</strong> as that of humans. And to <strong>[xxx]</strong> every <strong>[xxx]</strong> driving situation is a difficult programming problem.</p>\n</blockquote>\n<p>原文的 today 在讲人工智能今天的状态，后一句把处理各种驾驶情况说成 difficult programming problem，承认它很难。A的 hardly ever 却把这种眼下的困难扩大为几乎任何时候都找不到解决办法。困难可能需要更好的理论、数据或程序，但difficult本身不是“永远无解”。前文 coming use 还把车辆应用放在即将到来的时间里，整段是在讨论正在面对的能力限制，不是在给未来所有技术发展下一个否定判断。</p>\n<p><strong>今天存在困难的编程问题，能推出这件事几乎永远无法解决吗？</strong></p>\n<p>不能。today限定的是现在，hardly ever却扩大到了几乎所有时候；原文没有作出这样的永久判断。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. has aroused much <strong>[xxx]</strong></h3>\n<blockquote>\n<p>已经引起了很多 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：自动驾驶伦理问题的解决办法已经引起了很多 <strong>[xxx]</strong>。</p>\n<p>B用 has aroused much 描述解决办法引起的某种反应，第五段 ethical questions 也出现在自动驾驶车辆之后，都与这些伦理问题有关，因此回看问题如何被提起以及段尾怎样描述解决难度。</p>\n<blockquote>\n<p>The coming use of autonomous vehicles, for example, poses <strong>[xxx]</strong> ethical questions.</p>\n</blockquote>\n<blockquote>\n<p>And to <strong>[xxx]</strong> every <strong>[xxx]</strong> driving situation is a difficult programming problem.</p>\n</blockquote>\n<p>这里有 ethical questions，也有 difficult programming problem，说明自动驾驶车辆带来了需要处理的问题，程序层面的解决还存在困难。B的 has aroused much 后面是一个没读出来的词；我们只能知道它声称“已经引起许多某种反应”，不能确定这种反应是担心、关注、好奇还是别的内容。原文具体写了问题和难度，却没有在这两句话里直接命名人们的反应。没有读出B的那个核心名词，就还不能把这种反应与段中的困难逐一对照；不能看到它不谈技术能力便自行补成一种错误情绪。</p>\n<p><strong>B引起的到底是哪一种反应还不清楚，现在能仅凭这两句将整项判错吗？</strong></p>\n<p>还不能。自动驾驶的伦理疑问和编程困难确实存在，但has aroused much后面的具体事情没有读清，B先保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. is still beyond our <strong>[xxx]</strong></h3>\n<blockquote>\n<p>仍然超出了我们的 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：这些自动驾驶伦理问题的解决仍然超出了我们的 <strong>[xxx]</strong>。</p>\n<p>C里的 still beyond our 说目前还有某种达不到的地方，与第五段 difficult programming problem 都在描述解决时的困难，因此回看段尾人工智能视觉与驾驶情况编程的两句。</p>\n<blockquote>\n<p>AI “vision” today is not nearly as <strong>[xxx]</strong> as that of humans. And to <strong>[xxx]</strong> every <strong>[xxx]</strong> driving situation is a difficult programming problem.</p>\n</blockquote>\n<p>原文先把AI今天的“视觉”与人类比较，再把各种驾驶情况放进一个 difficult programming problem 中。C的 still beyond our 保留了“到现在仍超出”的方向，和原文说目前处理不了复杂驾驶情况能够接上。our后面的词没有读出来，它具体是指人的哪一方面，我们还不能翻译；但C也没有像A一样断言永远找不到解决方法。前面的驾驶员需要瞬间综合经验、眼耳信息，后面程序很难处理这些情况，至少能支持“目前尚有够不到的地方”。</p>\n<p><strong>C的“目前仍超出某种范围”，是否与原文今天仍面对复杂编程困难的说法相容？</strong></p>\n<p>能。still与today的时间方向一致，beyond our所指的具体名词还需保留疑问，但现在没有看到它把困难写成已经解决或永远无解。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. causes little public concern</h3>\n<blockquote>\n<p>几乎不引起公众关切</p>\n</blockquote>\n<p>把D接回题干，它说的是：解决自动驾驶车辆的伦理问题几乎不引起公众关切。</p>\n<p>D的 little public concern 说这类问题在公众层面没有多少关切，粗读时紧接的一段却出现了政府和指导原则；other governments 与前面的自动驾驶伦理问题接在一起讨论社会应对，所以把第六段整段读完，再看各方是否正在行动。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Whenever decisions are based on masses of data, “you quickly get into a lot of ethical questions,” notes Tan Kiat How, chief executive of a Singapore-based agency that is helping the government develop a <strong>[xxx]</strong> code for the ethical use of AI. Along with Singapore, other governments and mega-corporations are beginning to establish their own guidelines. Britain is setting up a data ethics center. India released its AI ethics strategy this spring.</p>\n<p>开始精读：</p>\n<p>Whenever decisions are based on masses of data, / “you quickly get into a lot of ethical questions,” / notes Tan Kiat How, / chief executive of a Singapore-based agency / that is helping the government / develop a <strong>[xxx]</strong> code / for the ethical use of AI. / Along with Singapore, / other governments and mega-corporations / are beginning to establish their own guidelines. / Britain is setting up a data ethics center. / India released its AI ethics strategy this spring.</p>\n<p>每当决定基于大量数据，/ “你很快就进入许多伦理问题”，/ 陈杰豪指出，/ 一家设在新加坡的机构的负责人 / 它正在帮助政府 / 制定一种 <strong>[xxx]</strong> 规范 / 用于人工智能的合乎伦理的使用。/ 与新加坡一起，/ 其他政府和大型企业 / 正开始建立他们自己的指导原则。/ 英国正在建立一个数据伦理中心。/ 印度在今年春天发布了它的人工智能伦理战略。</p>\n</blockquote>\n<p>再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。</p>\n<blockquote>\n<p>Whenever decisions are based on masses of data, “you quickly get into a lot of ethical questions,”</p>\n</blockquote>\n<blockquote>\n<p>Along with Singapore, other governments and mega-corporations are beginning to establish their own guidelines. Britain is setting up a data ethics center. India released its AI ethics strategy this spring.</p>\n</blockquote>\n<p>这里先说大量数据作出的决定很快带来许多伦理问题，然后用具体行动接下去：新加坡的机构帮助政府制定规范，other governments和大公司建立指导原则，英国设立伦理中心，印度发布战略。D的 little public concern 则把这件事描写成很少受到公共关切。政府不是每一个公众个体，但这些国家正在建立针对伦理问题的公共规则，说明问题已进入需要公开制度回应的层面，不能概括成“几乎不受关切”。第五段的自动驾驶正是以数据和程序作决定的一个眼前例子；作者从这个例子接到多方制定规范，没有把它写成无人过问的小问题。</p>\n<p>两边的差别就在反应程度：原文说的是多个国家已经为这些问题建立规范，D却说公共关切很少，把正在发生的多方应对写成了近乎不关心。</p>\n<p><strong>多国政府和大公司已经着手制定伦理规范，这能被概括为几乎没有公共关切吗？</strong></p>\n<p>不能。原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>33题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C能接住目前仍难处理的状态；B所说的具体反应还没有读出来。第一遍留下B和C。</p>\n<h2>34题</h2>\n<blockquote>\n<p>The author’s attitude toward Google’s pledges is one of ______.<br>作者对谷歌的承诺持什么态度？</p>\n</blockquote>\n<p>题干问 Google’s pledges，所以先找到第七段谷歌作出的承诺。第八段紧接着用 the statement 指这份声明，并直接作出评价；要判断作者态度，还需连着把这相邻一段读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>On June 7 Google pledged not to “design or <strong>[xxx]</strong> AI” that would cause “overall harm,” or to develop AI-directed weapons or use AI for <strong>[xxx]</strong> that would violate international norms. It also pledged not to deploy AI whose use would violate international laws or human rights.</p>\n<p>开始精读：</p>\n<p>On June 7 / Google pledged not to “design or <strong>[xxx]</strong> AI” / that would cause “overall harm,” / or to develop AI-directed weapons / or use AI for <strong>[xxx]</strong> / that would violate international norms. / It also pledged not to deploy AI / whose use would violate international laws / or human rights.</p>\n<p>在六月七日 / 谷歌承诺不去“设计或者 <strong>[xxx]</strong> 人工智能” / 它会导致“总体伤害”，/ 或去开发由人工智能引导的武器 / 或使用人工智能去进行 <strong>[xxx]</strong> / 它会违反国际准则。/ 它还承诺不部署人工智能 / 其使用会违反国际法律 / 或人权。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>While the statement is vague, it represents one starting point. So does the idea that decisions made by AI systems should be explainable, <strong>[xxx]</strong>, and fair.</p>\n<p>开始精读：</p>\n<p>While the statement is vague, / it represents one starting point. / So does the idea / that decisions made by AI systems / should be explainable, <strong>[xxx]</strong>, and fair.</p>\n<p>虽然这份声明含糊，/ 它代表着一个起点。/ 那个想法也一样 / 由人工智能系统作出的决定 / 应该是可以解释的、<strong>[xxx]</strong> 的以及公平的。</p>\n</blockquote>\n<p>第七段列的是谷歌承诺不做什么，第八段才是作者自己的评价：虽然声明含糊，它仍代表一个起点。题干问作者对承诺的态度，要根据这句让步后留下的判断来选。</p>\n<h3>A. contempt</h3>\n<blockquote>\n<p>轻蔑</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者对谷歌的这些承诺持轻蔑态度。</p>\n<p>A的 contempt 是认为不值得一提，第八段 one starting point 则是作者对声明价值的直接说法，因此回看第八段第一句，看作者在承认含糊之后给了什么评价。</p>\n<blockquote>\n<p>While the statement is vague, it represents one starting point.</p>\n</blockquote>\n<p>作者并未忽略声明的不足，先写 vague，说它含糊；但让步的后半句仍给出 one starting point，承认它可以作为一个开始。A的 contempt 要把这种声明当作没有价值、值得轻视的东西，与“承认它是一个起点”相反。不能只看vague就把后半句删掉：作者保留的正是这一步即使不完善，仍有起步意义。</p>\n<p><strong>承认声明能成为一个起点，是在轻蔑它吗？</strong></p>\n<p>不是。one starting point给它保留了实际的起步价值，和contempt的轻视方向不同。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. skepticism</h3>\n<blockquote>\n<p>怀疑</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者对谷歌的承诺持怀疑态度。</p>\n<p>B的 skepticism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。</p>\n<blockquote>\n<p>While the statement is vague, it represents one starting point.</p>\n</blockquote>\n<p>作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。B的 skepticism 若要成立，评价应停在不相信承诺、怀疑其真假或作用上。这里却没有把含糊发展成不相信，反而用While先让一步，再保留起点价值。“还不够具体”与“我不相信它”表达的是不同态度，决定方向的是让步后面的明确肯定。</p>\n<p><strong>作者说声明含糊之后，是停在怀疑，还是肯定它仍然代表一个起点？</strong></p>\n<p>后者。it represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. respect</h3>\n<blockquote>\n<p>敬重</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者对谷歌的承诺持敬重态度。</p>\n<p>C的 respect 带有敬重的评价分量，第八段 one starting point 给出的则是对声明的具体程度限定，两边都在评价谷歌这一步，因此回看第一句的完整让步与主句。</p>\n<blockquote>\n<p>While the statement is vague, it represents one starting point.</p>\n</blockquote>\n<p>这句话既说vague，又只把声明称为one starting point：它不够清楚，不过可以作为许多起步办法中的一个。C的 respect 把对这一步实用意义的认可提高到了敬重。作者没有把谷歌放到值得仰望的位置，也没有用它来代表卓越的道德表现；他马上又说另一种关于AI决定的想法也是起点。one starting point说的是“先有一个开端”的价值，respect表达的评价强度超过了这句有保留的认可。</p>\n<p><strong>“虽然含糊，但算一个起点”已经表达出对这份承诺的敬重了吗？</strong></p>\n<p>还不能。作者认可的是起步作用，仍明确保留了含糊这个不足；C把这种有限的认可抬高成了敬重。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. affirmation</h3>\n<blockquote>\n<p>肯定</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者对谷歌的承诺持肯定态度。</p>\n<p>D的 affirmation 是对这一步给予肯定，第八段 one starting point 承认声明有起步作用，意思能够相接，因此回看作者评价声明的那句完整话。</p>\n<blockquote>\n<p>While the statement is vague, it represents one starting point.</p>\n</blockquote>\n<p>作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。D的 affirmation 不要求作者认为声明完美，也不要求他崇敬谷歌，只要求作者认可这一步的某种价值。这正符合句中的让步：表述不够清楚，但朝制定规则迈出一步仍值得承认。后一句So does又把可解释、公平等要求也放进起点之列，可见作者是在认可若干开始行动的办法，而不是把不完善当作全部否定的理由。</p>\n<p><strong>肯定其起步价值，同时承认声明含糊，能用affirmation概括吗？</strong></p>\n<p>能。affirmation可以是有保留的肯定；作者明确认可one starting point，并没有声称所有问题已经解决。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>34题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>作者在指出含糊后仍肯定声明的起步意义，这一题可以留下D。</p>\n<blockquote>\n<p><strong>34题选D。</strong></p>\n</blockquote>\n<h2>35题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下列哪一个最适合作为本文的标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>The Conscience of AI: Complex But Inevitable</strong></p>\n<p>人工智能的良知：复杂，但不可回避</p>\n<p>B. <strong>Frankenstein, the Novel Predicting the Age of AI</strong></p>\n<p>《弗兰肯斯坦》：预言人工智能时代的小说</p>\n<p>C. <strong>AI’s Future: In the Hands of Tech Giants</strong></p>\n<p>人工智能的未来：掌握在科技巨头手里</p>\n<p>D. <strong>AI Shall Be Killers Once Out of Control</strong></p>\n<p>人工智能一旦失控就会成为杀手</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<blockquote>\n<p>原文参考：</p>\n<p>To put it another way: How can we make sure that the thinking of intelligent machines reflects humanity’s highest values? Only then will they be useful servants and not Frankenstein’s out-of-control monster.</p>\n<p>开始精读：</p>\n<p>To put it another way: / How can we make sure / that the thinking of intelligent machines / reflects humanity’s highest values? / Only then will they be useful servants / and not Frankenstein’s out-of-control monster.</p>\n<p>换一种说法：/ 我们怎样能确保 / 智能机器的思考 / 反映人类最高的价值？/ 只有那样它们才会成为有用的仆人 / 而不是弗兰肯斯坦的失控怪物。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。</td>\n<td>先讲一个旧例子引出要谈的问题</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>转到今天的人工智能，列出智能、意识和人之所以为人的疑问。</td>\n<td>再把旧问题接到眼前的新情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>写模仿人类思考的机器、像人的机器人和科幻电视剧中的形象。</td>\n<td>先摆出人们对新事物的想象</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>借伊格曼的说明指出，意识尚难理解，更难复制到机器中。</td>\n<td>接着说明现实还做不到那一步</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。</td>\n<td>但话说回来问题已到眼前且很难</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>从数据决策的伦理问题转向各国和大公司开始制定伦理规范。</td>\n<td>再说有些人已经开始想办法</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。</td>\n<td>举一个例子把怎样起步写具体</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。</td>\n<td>先承认办法不完善再肯定起步</td>\n</tr>\n<tr>\n<td>第9段</td>\n<td>要求智能机器体现人类最高价值，使它们成为有用帮手而非失控怪物。</td>\n<td>最后说必须朝哪个方向继续做</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>A. The Conscience of AI: Complex But Inevitable</h3>\n<p>人工智能的良知：复杂，但不可回避</p>\n<h4>如果 A 是主旨，文章9段应该怎么写？</h4>\n<p>如果A是主旨，文章中心就应该是人工智能如何遵守人的伦理价值，虽然复杂，却已经不能回避。前面会解释困难，后面会写为什么仍要行动以及朝什么方向行动。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>用旧作品中的技术伦理疑问，引出机器是否应遵循人的价值这一问题。</td>\n<td>先讲一个旧例子引出要谈的问题</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明人工智能把智能、意识与人的本质等伦理疑问带到今天。</td>\n<td>再把旧问题接到眼前的新情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>写人们对像人的机器的想象，为理解这种机器的难处作铺垫。</td>\n<td>先摆出人们对新事物的想象</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>说明对人类意识的认识不足，不能轻易复制出像人的机器。</td>\n<td>接着说明现实还做不到那一步</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>指出伦理问题不能等待技术全懂了再处理，并以现实应用说明困难。</td>\n<td>但话说回来问题已到眼前且很难</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>介绍各方已经开始给人工智能制定伦理规则。</td>\n<td>再说有些人已经开始想办法</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>用一家公司的承诺说明如何从避免伤害、遵守价值约束起步。</td>\n<td>举一个例子把怎样起步写具体</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>承认初步办法仍有不足，同时认可它们迈出了必要的一步。</td>\n<td>先承认办法不完善再肯定起步</td>\n</tr>\n<tr>\n<td>第9段</td>\n<td>要求机器体现人类价值，让它为人服务而不失控。</td>\n<td>最后说必须朝哪个方向继续做</td>\n</tr>\n</tbody></table>\n<p>A中的 Conscience of AI 不是要求全文证明机器已经具有人类的良心；标题把机器怎样遵守人的伦理价值概括成一个问题。Complex能接住中间连续出现的难处：意识很复杂、缺少好理论，驾驶员的瞬间反应又涉及经验和感官信息，编程很难处理所有情况。But Inevitable接住第五段开头的转折：不能因为还造不出完全像人的机器，就以为伦理问题没有到眼前。</p>\n<p>后半篇也不是突然换题。新加坡、英国、印度和大公司在制定规则，谷歌承诺避开总体伤害和侵犯权利，作者说这些虽含糊却是起点；最后再把目标说成智能机器反映人类最高价值。前半篇解释复杂在哪里，后半篇写既然回避不了就怎样开始。A既容得下技术困难，也容得下政府和企业的行动，最后的有用仆人与失控怪物还给出了为什么必须处理的理由。</p>\n<p><strong>A能不能同时解释文章为什么先谈理解与编程的困难，后谈伦理规则和人类价值？</strong></p>\n<p>能。前一部分说明处理人工智能伦理并不简单，后一部分说明问题已经到来、各方必须开始行动；“复杂但不可回避”把两部分接成了同一个中心。</p>\n<p><strong>判断：A保留。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>B. Frankenstein, the Novel Predicting the Age of AI</h3>\n<p>《弗兰肯斯坦》：预言人工智能时代的小说</p>\n<h4>如果 B 是主旨，文章9段应该怎么写？</h4>\n<p>如果B是主旨，文章中心就应该是小说怎样预言了人工智能时代。各段需要持续拿小说里的具体内容与今天的技术现实对照，再评价这本书的预见。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>介绍小说的出版，并提出它预言了人工智能时代。</td>\n<td>先讲一个旧例子引出要谈的问题</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>指出今天人工智能的哪些发展印证了小说中的具体预言。</td>\n<td>再把旧问题接到眼前的新情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>比较小说里的机器与当代科幻、类人机器形象。</td>\n<td>先摆出人们对新事物的想象</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>借科学家的话判断小说关于意识的预言是否准确。</td>\n<td>接着说明现实还做不到那一步</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>以自动驾驶等现实事例核对小说当年的预言。</td>\n<td>但话说回来问题已到眼前且很难</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明各国规则与小说警告之间的对应。</td>\n<td>再说有些人已经开始想办法</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>把谷歌的承诺解释为对小说中某个预言的回应。</td>\n<td>举一个例子把怎样起步写具体</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>评价小说预言为当代技术讨论提供了多少指导。</td>\n<td>先承认办法不完善再肯定起步</td>\n</tr>\n<tr>\n<td>第9段</td>\n<td>回到小说，总结它如何预见人工智能时代。</td>\n<td>最后说必须朝哪个方向继续做</td>\n</tr>\n</tbody></table>\n<p>B确实能接住开头的小说和两百年，也能接住末段再次出现的Frankenstein；但是“预言人工智能时代的小说”要求小说本身始终是被解释、被核对的对象。那样第四段讨论意识、第五段讨论驾驶时，就应该指出这些情形分别对应小说里的哪项设想，后面的规则也应被用来证明小说预见得准。</p>\n<p>实际正文没有沿着小说情节展开。第四段伊格曼说现实理论不足，第五段详细拆驾驶员的反应和程序困难，第六、七段说各方当下怎样建立规范，这些段落之间能够直接连起来，不需要借小说内容作中介。结尾提到怪物，是把不能让机器失控的要求说得形象，并非评定一本书的预测成就。B把承担开头引入和结尾警示作用的小说，抬成了全文一直在论证的中心，因此中间大部分具体讨论在这个标题下找不到应有的位置。</p>\n<p><strong>如果中心是小说预言得多准确，文章会只在首尾提小说、却把主要篇幅交给现实难题和伦理规范吗？</strong></p>\n<p>不会。B需要持续比较小说设想与现实发展，实际主体却是人工智能伦理为什么难、又怎样开始处理；小说只是帮助提出和形象化这个问题。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>C. AI’s Future: In the Hands of Tech Giants</h3>\n<p>人工智能的未来：掌握在科技巨头手里</p>\n<h4>如果 C 是主旨，文章9段应该怎么写？</h4>\n<p>如果C是主旨，文章中心就应该是科技巨头掌握了人工智能的未来。各段应说明这些企业拥有何种决定权、怎样使用它，并让其他主体围绕它们的控制力展开。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>用旧故事引出科技巨头怎样决定新技术的未来。</td>\n<td>先讲一个旧例子引出要谈的问题</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明人工智能发展对大公司决策权提出了哪些问题。</td>\n<td>再把旧问题接到眼前的新情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>描述科技巨头如何塑造公众对机器的想象。</td>\n<td>先摆出人们对新事物的想象</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>说明大公司怎样主导对意识与机器的研究。</td>\n<td>接着说明现实还做不到那一步</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用自动驾驶说明技术未来取决于企业的选择。</td>\n<td>但话说回来问题已到眼前且很难</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>解释各国政府为什么也要围绕巨头的决定行动。</td>\n<td>再说有些人已经开始想办法</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>以谷歌为代表，证明科技巨头掌握关键方向。</td>\n<td>举一个例子把怎样起步写具体</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>评价巨头的声明如何决定未来局势。</td>\n<td>先承认办法不完善再肯定起步</td>\n</tr>\n<tr>\n<td>第9段</td>\n<td>总结人工智能前途取决于科技巨头怎样使用权力。</td>\n<td>最后说必须朝哪个方向继续做</td>\n</tr>\n</tbody></table>\n<p>C里的Tech Giants能找到谷歌和mega-corporations，后面也确实谈了公司应该遵守什么。但“In the Hands of”进一步把人工智能的未来归到科技巨头手里，这就要求全文解释谁拥有控制权、为何企业能决定其他人的方向。</p>\n<p>实际第六段把企业和other governments并列，具体还列出新加坡、英国、印度，没有说政府只能跟随科技巨头。第七段谷歌只是紧接其后的一个具体例子，第八段对它的评价也只是one starting point，另一个关于可解释与公平的想法同样是起点。结尾提出的衡量标准是humanity’s highest values，主体扩展到“我们如何确保”，不是“巨头怎样决定”。C虽然抓住了一个分量不小的例子，却把参与制定规范的一类主体改成了掌握全局的主体；它既解释不了前面的意识与驾驶困难，也把后面政府和全人类价值的位置挤掉了。</p>\n<p><strong>谷歌作为一个制定伦理承诺的例子，能把并列行动的政府和人类价值都收进“未来由科技巨头掌握”吗？</strong></p>\n<p>不能。公司是参与者之一，原文没有建立巨头控制政府或独占未来方向的关系；C把一个参与主体放大成了全文的决定者。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>D. AI Shall Be Killers Once Out of Control</h3>\n<p>人工智能一旦失控就会成为杀手</p>\n<h4>如果 D 是主旨，文章9段应该怎么写？</h4>\n<p>如果D是主旨，文章中心就应该是人工智能一旦失控就会成为杀手。各段需要展示失控与杀人之间的必然联系，例子和结论都应围绕这种致命危险。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>用小说怪物说明机器失控必然伤害人。</td>\n<td>先讲一个旧例子引出要谈的问题</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>指出今天人工智能的发展正在带来杀人危险。</td>\n<td>再把旧问题接到眼前的新情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>把类人机器人和科幻形象写成失控杀手的预兆。</td>\n<td>先摆出人们对新事物的想象</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>借科学家说明无法理解机器会导致致命后果。</td>\n<td>接着说明现实还做不到那一步</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>用自动驾驶事故说明失控人工智能会变成杀手。</td>\n<td>但话说回来问题已到眼前且很难</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>说明各国开始采取措施防止机器杀人。</td>\n<td>再说有些人已经开始想办法</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>用谷歌对武器的承诺进一步强调杀人威胁。</td>\n<td>举一个例子把怎样起步写具体</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>评价这些起步措施能否阻止人工智能成为杀手。</td>\n<td>先承认办法不完善再肯定起步</td>\n</tr>\n<tr>\n<td>第9段</td>\n<td>断言人工智能只要失控就会杀人。</td>\n<td>最后说必须朝哪个方向继续做</td>\n</tr>\n</tbody></table>\n<p>D抓住了后半篇的harm、weapons和最后的out-of-control monster，因此危险方向不是完全无关。但“Shall Be Killers Once Out of Control”是一个很强的条件判断：只要失控，就会成为杀手。文章并没有把所有伦理问题都缩成杀人，更没有用段落持续证明这条必然关系。</p>\n<p>第五段谈的是在复杂驾驶情况中怎样作决定，第六段扩大到数据决策的伦理，第七段还提到国际准则、国际法律和人权，第八段要求决定可解释、公平。这些内容的范围远超过是否杀人。尾段也不是断言机器必定作恶，而是先问怎样确保它反映人类最高价值，再说只有这样它才会成为有用的仆人而非失控怪物。作者最后在要求一个好的发展方向，D却只留下恐怖结果，并把可能的伤害压成必然成为杀手；它不能解释文中大量积极制定规范和肯定起步的内容。</p>\n<p><strong>原文对伦理约束和有用机器的要求，能被“失控就必然成为杀手”完整概括吗？</strong></p>\n<p>不能。D把广泛的伦理问题缩成杀人，把应努力避免的风险写成必然结果，也漏掉了文章认可规则与行动的方向。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<h3>35题结论</h3>\n<p><strong>35. A. The Conscience of AI: Complex But Inevitable</strong></p>\n<p>全文一面写理解意识、复制思考和处理驾驶情境很复杂，一面强调伦理问题已经来到眼前，并用规则、承诺与人类价值说明必须继续处理。A把这两个方向一起概括了。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>The Conscience of AI: Complex But Inevitable / 人工智能的良知：复杂，但不可回避</strong></p>\n<hr>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查31题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. involves some concerns raised by AI today</li>\n<li>D. has sparked serious ethical <strong>[xxx]</strong></li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>The Conscience of AI: Complex But Inevitable</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>人工智能的良知：复杂，但不可回避</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A接上是：作者提到这部小说，因为它涉及今天人工智能带来的一些关切。D接上是：作者提到这部小说，因为它已经引发了严重的伦理 <strong>[xxx]</strong>。第一遍没有拉开，是因为作品后面连接ethical questions的动作没有读出，D最后那个伦理名词也不清楚；两项都碰到了小说和伦理问题，不能靠把生词补成某个意思来选。</p>\n<p>现在拿主旨来检查。</p>\n<p>主旨说人工智能的伦理要求复杂，却已经无法回避。既然全文要处理的是今天的这个问题，开头的小说就应该帮助读者进入“技术会带来怎样的伦理疑问”，再由第二段Today转到人工智能。这恰好给A增加了段落作用上的支持：它不只说小说有伦理内容，还把小说与今天人工智能的关切接到一起，能解释作者为什么在进入现实难题之前提这本书。</p>\n<p>再看D，它要求我们把重点放在小说已经引发了某种伦理反应。即使这个反应与伦理有关，后面文章也没有围绕这本小说的社会反响往下展开；自动驾驶、多国规范和谷歌承诺，讨论的对象始终是现在的人工智能。主旨没有替我们翻译D的最后一个词，但它让我们看清，小说引发了何种反应并不是这里通向全文的问题。</p>\n<p>回到第一轮那两句，第一段是many ethical questions和未来技术，第二段是Today与人工智能提出的问题。A既能接住这组局部衔接，又能承担引入全文伦理议题的作用。D仍只停在小说引发了某种事情上，解释不了为什么下一段立刻进入今天的人工智能。因此选A。</p>\n<blockquote>\n<p><strong>31题选A。</strong></p>\n</blockquote>\n<hr>\n<h2>回查32题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. is too limited for us to reproduce it</li>\n<li>C. <strong>[xxx]</strong> popular sci-fi TV series</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>The Conscience of AI: Complex But Inevitable</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>人工智能的良知：复杂，但不可回避</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>B说，伊格曼认为我们目前对意识的认识太有限，还不能复制意识。C说，我们目前对意识的认识 <strong>[xxx]</strong> 流行科幻电视剧。第一遍B能对应“还无法理解，更别说复制”，但C的动作未读出；前一段又确实写了电视剧中的类人机器人，所以当时把C留了下来。</p>\n<p>现在拿主旨来检查。</p>\n<p>文章最终讨论的是人工智能伦理：问题复杂，但不能回避。第四段的伊格曼处在“人们想象像人的机器”之后、“然而伦理问题已到眼前”之前。放回这个全文方向，他的话承担的是说明现实研究还存在困难，从而让后面的转折有意义：即使意识尚未理解、机器尚难复制，眼前应用带来的伦理问题也不能等。这一作用与B描述的认识不足正好一致。</p>\n<p>C把判断落在popular sci-fi TV series，要求理解意识与电视剧之间的某种作用。全文却没有继续评判这些电视剧是否合理，也没有追踪意识研究怎样改变影视内容；电视剧只是第三段中帮助呈现类人机器人想象的例子。主旨给C增加不了“伊格曼是在评论电视剧”的支持，也不能替它把那个动作翻出来。</p>\n<p>再接回他自己的话：far too complex to be understood和let alone reproduced，后面还有no good theories解释意识及造机器的方法。B不仅对应这些局部判断，还准确承担了全文说明技术复杂性的那一步。C虽碰到邻段的电视剧，却没有把伊格曼谈当前认识的判断说清。两层放在一起，B更完整地回答了题干。</p>\n<blockquote>\n<p><strong>32题选B。</strong></p>\n</blockquote>\n<hr>\n<h2>回查33题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. has aroused much <strong>[xxx]</strong></li>\n<li>C. is still beyond our <strong>[xxx]</strong></li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>The Conscience of AI: Complex But Inevitable</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>人工智能的良知：复杂，但不可回避</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>B说，自动驾驶伦理问题的解决已经引起了很多 <strong>[xxx]</strong>；C说，这种解决仍然超出了我们的 <strong>[xxx]</strong>。第一遍没有拉开，是因为B所指的反应不知道是什么，C在our后面的名词也没有读出。不过两项已经读出的部分不同：B描述引起的反应，C描述目前还有达不到的地方。</p>\n<p>现在拿主旨来检查。</p>\n<p>“复杂但不可回避”把第五段放到了一个明确位置：前面承认理解意识很难，But之后却说伦理问题已经在眼前；自动驾驶就是用来说明实际处理为什么复杂。它不是为了调查人们对某个解决办法有什么情绪，而是让我们看到，人类驾驶员的瞬间决定需要综合许多东西，人工智能的程序目前还难以做到。这使C的still beyond our得到全文方向的支持，它保留了“当前尚未够到”的困难，而没有说问题永远无解。</p>\n<p>B的has aroused much则把焦点移到解决办法引起的某种反应。后面的各国规范和谷歌承诺能说明必须采取行动，却没有把第五段变成对某种反应多少的说明。主旨也不能告诉我们B最后一个名词是什么，所以不能只因全文重视伦理，就自动把任何未知反应都接成正确答案。</p>\n<p>回看最初读过的段尾，AI的视觉还在与人类比较，对驾驶情况作程序处理仍是difficult programming problem。这是关于当下能否妥善处理的困难，既接住C已经读出的still beyond our，也服务于全文“事情复杂仍须面对”的中心。C的名词不靠猜译补出，但它已读出的判断方向同时得到了局部与全文的支持；B仍没有回答清这种解决处于什么状态，因此选C。</p>\n<blockquote>\n<p><strong>33题选C。</strong></p>\n</blockquote>\n<hr>\n<h2>最终答案：</h2>\n<p><strong>31. A</strong></p>\n<p><strong>32. B</strong></p>\n<p><strong>33. C</strong></p>\n<p><strong>34. D</strong></p>\n<p><strong>35. A</strong></p>\n","analysisStartIndex":46,"maskInventory":{"token":"[xxx]","count":147},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"ordinaryFirstRoundCandidates":{"31":["A","D"],"32":["B","
