const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| mark | v.标志；纪念 | exactly | ad.恰好 | century | n.世纪 |\n| publication | n.出版 | modern | a.现代的 | invention | n.发明 |\n| electric light bulb | 电灯泡 | author | n.作者 | produce | v.创作 |\n| remarkable work | 杰出作品 | speculative fiction | 推想小说 | foreshadow | v.预示 |\n| ethical question | 伦理问题 | raise | v.引发；提出 | technology | n.技术 |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 3重点词与语境","focus":[85,137,925,477],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>mark\u003c/td>\n\u003ctd>v.标志；纪念\u003c/td>\n\u003ctd>exactly\u003c/td>\n\u003ctd>ad.恰好\u003c/td>\n\u003ctd>centur ch as &quot;Westworld&quot; and &quot;Humans.&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 意群翻译 · 第3段\n\n被称为的东西 / 通用人工智能，/ 机器将模仿 / 人类思考的方式，/ 继续躲避 / 科学家们。\n\n然而人类仍然着迷 / 于这个想法 / 机器人的 / 它们会看起来，/ 移动，/ 和反应 / 像人类一样，/ 类似于那些 / 最近被描绘的 / 在流行的科幻电视剧中 / 比如《西部世界》和《人类》。","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,923,925,412],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-3-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>What is being called artificial general intelligence, machines that would imitate the way humans think, continues to evade scientists. Yet humans remain fascinated by the idea of robots that would look, move, and respond like humans, similar to those recently depicted on popular sci-fi TV series such as &quot;Westworld&quot; and &quot;Humans.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-1\">\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>What is being called / artificial general intelligence, / machines that would imitate / the way humans think, / continues to evade / scientists.\u003c/p>\n\u003cp>Yet humans remain fascinated / by the idea / of robots / that would look, / move, / and respond / like humans, / similar to those / recently depicted / on popular sci-fi TV series / such as &quot;Westworld&quot; and &quot;Humans.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-2\">\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>被称为的东西 / 通用人工智能，/ 机器将模仿 / 人类思考的方式，/ 继续躲避 / 科学家们。\u003c/p>\n\u003cp>然而人类仍然着迷 / 于这个想法 / 机器人的 / 它们会看起来，/ 移动，/ 和反应 / 像人类一样，/ 类似于那些 / 最近被描绘的 / 在流行的科幻电视剧中 / 比如《西部世界》和《人类》。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 标准译文 · level":3,"raw":"### 完整原文 · 第4段\n\nJust how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University neuroscientist. \"We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.\"","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,1349,925,598],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-4-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University neuroscientist. &quot;We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群划分 · 第4段\n\nJust how people think / is still far too complex / to be understood, / let alone reproduced, / says David Eagleman, / a Stanford University neuroscientist.\n\n\"We are just in a situation / where there are no good theories / explaining what consciousness actually is / and how you could ever / build a machine / to get there.\"","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,1349,925,598],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-4-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Just how people think is still far too complex to be n### 第7段\n\nOn June 7 → Google pledged → not to \"design or deploy AI\"：(that would cause → \"overall harm\") + or to develop：(AI-directed weapons) + or use AI：(for surveillance：(that would violate → international norms)).\n\nIt also pledged → not to deploy AI：(whose use would violate → international laws + or human rights).\n\n### 第8段\n\nWhile the statement is vague // it represents → one starting point.\n\nSo does the idea：(that decisions made：(by AI systems) → should be explainable + transparent + and fair).\n\n### 第9段\n\nTo put it another way：How can we make sure：(that the thinking：(of intelligent machines) → reflects humanity's highest values)?\n\nOnly then → will they be useful servants // and not Frankenstein's：(out-of-control monster).","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>This year marks → exactly two centuries：(since the publication：(of &quot;Frankenstein; or, The Modern Prometheus,&quot;：(by Mary Shelley))).\u003c/p>\n\u003cp>Even before：(the invention of the electric light bulb) → the author produced → a remarkable work：(of speculative fiction)：(that would foreshadow → many ethical questions：(to be raised：(by technologies：(yet to come)))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Today → the rapid growth：(of artificial intelligence (AI)) → raises fundamental questions：(&quot;What is intelligence + identity + or consciousness?&quot; + &quot;What makes humans → humans?&quot;)\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>What is being called → artificial general intelligence：(machines：(that would imitate → the way：(humans think))) → continues to evade → scientists.\u003c/p>\n\u003cp>Yet humans remain fascinated：(by the idea：(of robots：(that would look + move + and respond → like humans)))：(similar to those：(recently depicted：(on popular sci-fi TV series：(such as &quot;Westworld&quot; and &quot;Humans&quot;)))).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Just how people think → is still far too complex：(to be understood) + let alone reproduced → says David Eagleman：(a Stanford University neuroscientist).\u003c/p>\n\u003cp>&quot;We are just in a situation：(where there are no good theories：(explaining what consciousness actually is + and how you could ever → build a machine：(to get there))).&quot;\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>But that doesn&#39;t mean：(crucial ethical issues：(involving AI) → aren&#39;t at hand).\u003c/p>\n\u003cp>The coming use：(of autonomous vehicles)：(for example) → poses thorny ethical questions.\u003c/p>\n\u003cp>Human drivers → sometimes must make → split-second decisions.\u003c/p>\n\u003cp>Their reactions → may be a complex combination：(of instant reflexes + input from past driving experiences + what their eyes and ears → tell them：(in that moment)).\u003c/p>\n\u003cp>AI &quot;vision&quot; today → is not nearly as sophisticated：(as that of humans).\u003c/p>\n\u003cp>And to anticipate：(every imaginable driving situation) → is a difficult programming problem.\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Whenever decisions are based：(on masses of data) → &quot;you quickly get into：(a lot of ethical questions)&quot; → notes Tan Kiat How：(chief executive：(of a Singapore-based agency：(that is helping the government → develop a voluntary code：(for the ethical use of AI)))).\u003c/p>\n\u003cp>Along with Singapore → other governments and mega-corporations → are beginning to establish：(their own guidelines).\u003c/p>\n\u003cp>Britain is setting up → a data ethics center.\u003c/p>\n\u003cp>India released → its AI ethics strategy：(this spring).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>On June 7 → Google pledged → not to &quot;design or deploy AI&quot;：(that would cause → &quot;overall harm&quot;) + or to develop：(AI-directed weapons) + or use AI：(for surveillance：(that would violate → international norms)).\u003c/p>\n\u003cp>It also pledged → not to deploy AI：(whose use would violate → international laws + or human rights).\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>While the statement is vague // it represents → one starting point.\u003c/p>\n\u003cp>So does the idea：(that decisions made：(by AI systems) → should be explainable + transparent + and fair).\u003c/p>\n\u003ch3>第9段\u003c/h3>\n\u003cp>To put it another way：How can we make sure：(that the thinking：(of intelligent machines) → reflects humanity&#39;s highest values)?\u003c/p>\n\u003cp>Only then → will they be useful servants // and not Frankenstein&#39;s：(out-of-control monster).\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n今年标志着 → 整整两个世纪：(自出版以来：(《弗兰肯斯坦；或，现代普罗米修斯》的：(玛丽·雪莱著)))。\n\n甚至在：(电灯泡发明之前) → 这位作者创作了 → 一部杰出的作品：(推测性小说的)：(它将预示 → 许多伦理问题：(将被提出的：(由技术：(尚未到来的))))。\n\n### 第2段\n\n今天 → 快速增长：(人工智能（AI）的) → 提出了根本性问题：(\"什么是智能 + 身份 + 或意识？\" + \"什么使人类 → 成为人类？\")\n\n### 第3段\n\n被称为 → 通用人工智能：(机器：(将模仿 → 方式：(人类思考))) → 继续躲避 → 科学家们。\n\n然而人类仍然着迷：(于这个想法：(机器人的：(它们会看起来 + 移动 + 和反应 → 像人类一样)))：(类似于那些：(最近被描绘的：(在流行的科幻电视剧中：(比如《西部世界》和《人类》))))。\n\n### 第4段\n\n人们如何思考 → 仍然太过复杂：(无法被理解) + 更不用说复制 → 大卫·伊格曼说：(斯坦福大学神经科学家)。\n\n\"我们只是处于一种情况：(在这种情况下没有好的理论：(解释意识实际上是什么 + 以及你如何能够 → 建造一台机器：(达到那里)))。\"\n\n### 第5段\n\n但这并不意味着：(关键的伦理问题：(涉及AI的) → 不在眼前)。\n\n即将到来的使用：(自动驾驶车辆的)：(例如) → 提出了棘手的伦理问题。\n\n人类司机 → 有时必须做出 → 瞬间决定。\n\n他们的反应 → 可能是复杂的组合：(即时反射 + 来自过去驾驶经验的输入 + 他们的眼睛和耳朵 → 告诉他们的：(在那一刻))。\n\nAI\"视觉\"今天 → 远不如精密：(相比人类的)。\n\n而且要预测：(每一种可想象的驾驶情况) → 是一个困难的编程问题。\n\n### 第6段\n\n每当决策基于：(大量数据) → \"你很快就会遇到：(很多伦理问题)\" → 陈吉豪指出：(首席执行官：(一个新加坡机构的：(正在帮助政府 → 制定自愿准则：(为AI的伦理使用))))。\n\n与新加坡一起 → 其他政府和大型企业 → 正开始建立：(他们自己的指导方针)。\n\n英国正在建立 → 一个数据伦理中心。\n\n印度发布了 → 其AI伦理战略：(今年春天)。\n\n### 第7段\n\n在6月7日 → 谷歌承诺 → 不\"设计或部署AI\"：(会造成 → \"整体伤害\"的) + 或开发：(AI导向的武器) + 或使用AI：(用于监视：(会违反 → 国际规范的))。\n\n它还承诺 → 不部署AI：(其使用会违反 → 国际法律 + 或人权的)。\n\n### 第8段\n\n虽然这个声明很模糊 // 它代表 → 一个起点。\n\n这个想法也是如此：(即决策做出的：(由AI系统) → 应该是可解释的 + 透明的 + 和公平的)。\n\n### 第9段\n\n换句话说：我们如何能确保：(思维：(智能机器的) → 反映人类最高价值观)？\n\n只有那时 → 它们才会是有用的仆人 // 而不是弗兰肯斯坦的：(失控的怪物)。","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>今年标志着 → 整整两个世纪：(自出版以来：(《弗兰肯斯坦；或，现代普罗米修斯》的：(玛丽·雪莱著)))。\u003c/p>\n\u003cp>甚至在：(电灯泡发明之前) → 这位作者创作了 → 一部杰出的作品：(推测性小说的)：(它将预示 → 许多伦理问题：(将被提出的：(由技术：(尚未到来的))))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>今天 → 快速增长：(人工智能（AI）的) → 提出了根本性问题：(&quot;什么是智能 + 身份 + 或意识？&quot; + &quot;什么使人类 → 成为人类？&quot;)\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>被称为 → 通用人工智能：(机器：(将模仿 → 方式：(人类思考))) → 继续躲避 → 科学家们。\u003c/p>\n\u003cp>然而人类仍然着迷：(于这个想法：(机器人的：(它们会看起来 + 移动 + 和反应 → 像人类一样)))：(类似于那些：(最近被描绘的：(在流行的科幻电视剧中：(比如《西部世界》和《人类》))))。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>人们如何思考 → 仍然太过复杂：(无法被理解) + 更不用说复制 → 大卫·伊格曼说：(斯坦福大学神经科学家)。\u003c/p>\n\u003cp>&quot;我们只是处于一种情况：(在这种情况下没有好的理论：(解释意识实际上是什么 + 以及你如何能够 → 建造一台机器：(达到那里)))。&quot;\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>但这并不意味着：(关键的伦理问题：(涉及AI的) → 不在眼前)。\u003c/p>\n\u003cp>即将到来的使用：(自动驾驶车辆的)：(例如) → 提出了棘手的伦理问题。\u003c/p>\n\u003cp>人类司机 → 有时必须做出 → 瞬间决定。\u003c/p>\n\u003cp>他们的反应 → 可能是复杂的组合：(即时反射 + 来自过去驾驶经验的输入 + 他们的眼睛和耳朵 → 告诉他们的：(在那一刻))。\u003c/p>\n\u003cp>AI&quot;视觉&quot;今天 → 远不如精密：(相比人类的)。\u003c/p>\n\u003cp>而且要预测：(每一种可想象的驾驶情况) → 是一个困难的编程问题。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>每当决策基于：(大量数据) → &quot;你很快就会遇到：(很多伦理问题)&quot; → 陈吉豪指出：(首席执行官：(一个新加坡机构的：(正在帮助政府 → 制定自愿准则：(为AI的伦理使用))))。\u003c/p>\n\u003cp>与新加坡一起 → 其他政府和大型企业 → 正开始建立：(他们自己的指导方针)。\u003c/p>\n\u003cp>英国正在建立 → 一个数据伦理中心。\u003c/p>\n\u003cp>印度发布了 → 其AI伦理战略：(今年春天)。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>在6月7日 → 谷歌承诺 → 不&quot;设计或部署AI&quot;：(会造成 → &quot;整体伤害&quot;的) + 或开发：(AI导向的武器) + 或使用AI：(用于监视：(会违反 → 国际规范的))。\u003c/p>\n\u003cp>它还承诺 → 不部署AI：(其使用会违反 → 国际法律 + 或人权的)。\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>虽然这个声明很模糊 // 它代表 → 一个起点。\u003c/p>\n\u003cp>这个想法也是如此：(即决策做出的：(由AI系统) → 应该是可解释的 + 透明的 + 和公平的)。\u003c/p>\n\u003ch3>第9段\u003c/h3>\n\u003cp>换 .\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-2\">\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>每当决策基于 / 大量数据，/ &quot;你很快就会遇到 / 很多伦理问题，&quot; / 陈吉豪指出，/ 首席执行官 / 一个新加坡机构的 / 正在帮助政府 / 制定自愿准则 / 为AI的伦理使用。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-3\">\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把说话者的身份和机构的工作合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>陈吉豪是一个新加坡机构的首席执行官，该机构正在帮助政府制定AI伦理使用的自愿准则\u003c/p>\n\u003c/blockquote>\n\u003cp>再把数据决策与伦理疑问接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>每当决策基于大量数据时，就很快会遇到许多伦理问题\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>陈吉豪是一个新加坡机构的首席执行官，该机构正在帮助政府制定AI伦理使用的自愿准则；每当决策基于大量数据时，就很快会遇到许多伦理问题。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-4\">\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>陈吉豪指出，数据决策会带来伦理问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>先把条件与评论接成完整引语，再交代是谁说的。姓名之后补充机构身份，机构正在协助制定准则的工作再接在身份后；“自愿”修饰准则，不要读成政府自愿成为决策主体。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>每当决策依据大量数据时，你很快就会碰到许多伦理问题。陈吉豪这样指出，他是一家新加坡机构的首席执行官，这家机构正在帮助政府制定AI伦理使用的自愿准则。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-5\">\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>“每当……时，就……”把条件和结果接清楚；“大量数据”说明决策依据，不是伦理问题数量的修饰语。\u003c/p>\n\u003cp>把“首席执行官一个新加坡机构的”改成“一个新加坡机构的首席执行官”，最后用“该机构”明确帮助政府的是谁。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;每当决策基于大量数据时，你很快就会遇到很多伦理问题，&quot;陈吉豪指出，他是一个新加坡机构的首席执行官，该机构正在帮助政府制定AI伦理使用的自愿准则。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"35题 · 题干、题型与核心出处","level":2,"raw":"## 35题\n\n**Which of the following would be the best title for the text?**\n\n下列哪一个最适合作为本文的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **The Conscience of AI: Complex But Inevitable**\n\n人工智能的良知：复杂，但不可回避\n\nB. **Frankenstein, the Novel Predicting the Age of AI**\n\n《弗兰肯斯坦》：预言人工智能时代的小说\n\nC. **AI’s Future: In the Hands of Tech Giants**\n\n人工智能的未来：掌握在科技巨头手里\n\nD. **AI Shall Be Killers Once Out of Control**\n\n人工智能一旦失控就会成为杀手\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。 | 先讲一个旧例子引出要谈的问题 |\n| 第2段 | 转到今天的人工智能，列出智能、意识和人之所以为人的疑问。 | 再把旧问题接到眼前的新情况 |\n| 第3段 | 写模仿人类思考的机器、像人的机器人和科幻电视剧中的形象。 | 先摆出人们对新事物的想象 |\n| 第4段 | 借伊格曼的说明指出，意识尚难理解，更难复制到机器中。 | 接着说明现实还做不到那一步 |\n| 第5段 | 转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。 | 但话说回来问题已到眼前且很难 |\n| 第6段 | 从数据决策的伦理问题转向各国和大公司开始制定伦理规范。 | 再说有些人已经开始想办法 |\n| 第7段 | 列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。 | 举一个例子把怎样起步写具体 |\n| 第8段 | 承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。 | 先承认办法不完善再肯定起步 |\n| 第9段 | 要求智能机器体现人类最高价值，使它们成为有用帮手而非失控怪物。 | 最后说必须朝哪个方向继续做 |","context":{"mode":"image","asset":"questions","focus":[250,2354,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"question":"35","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下列哪一个最适合作为本文的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>The Conscience of AI: Complex But Inevitable\u003c/strong>\u003c/p>\n\u003cp>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003cp>B. \u003cstrong>Frankenstein, the Novel Predicting the Age of AI\u003c/strong>\u003c/p>\n\u003cp>《弗兰肯斯坦》：预言人工智能时代的小说\u003c/p>\n\u003cp>C. \u003cstrong>AI’s Future: In the Hands of Tech Giants\u003c/strong>\u003c/p>\n\u003cp>人工智能的未来：掌握在科技巨头手里\u003c/p>\n\u003cp>D. \u003cstrong>AI Shall Be Killers Once Out of Control\u003c/strong>\u003c/p>\n\u003cp>人工智能一旦失控就会成为杀手\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。\u003c/td>\n\u003ctd>先讲一个旧例子引出要谈的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>转到今天的人工智能，列出智能、意识和人之所以为人的疑问。\u003c/td>\n\u003ctd>再把旧问题接到眼前的新情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>写模仿人类思考的机器、像人的机器人和科幻电视剧中的形象。\u003c/td>\n\u003ctd>先摆出人们对新事物的想象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>借伊格曼的说明指出，意识尚难理解，更难复制到机器中。\u003c/td>\n\u003ctd>接着说明现实还做不到那一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。\u003c/td>\n\u003ctd>但话说回来问题已到眼前且很难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>从数据决策的伦理问题转向各国和大公司开始制定伦理规范。\u003c/td>\n\u003ctd>再说有些人已经开始想办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。\u003c/td>\n\u003ctd>举一个例子把怎样起步写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。\u003c/td>\n\u003ctd>先承认办法不完善再肯定起步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9段\u003c/td>\n\u003ctd>要求智能机器体现人类最高价值，使它们成为有用帮手而非失控怪物。\u003c/td>\n\u003ctd>最后说必须朝哪个方向继续做\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. The Conscience of AI: Complex But Inevitable","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### A. The Conscience of AI: Complex But Inevitable\n\n人工智能的良知：复杂，但不可回避","context":{"mode":"image","asset":"questions","focus":[250,2354,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"A"},"focusId":"focus-q35-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. The Conscience of AI: Complex But Inevitable","level":3,"raw":"#### 如果 A 是主旨，文章9段应该怎么写？\n\n如果全文主旨真的是：\n\n人工智能的良知：复杂，但不可回避\n\n那文章9段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 借旧小说中的造物责任引出机器应遵守什么伦理价值的问题。 | 先讲一个旧例子引出要谈的问题 |\n| 第2段 | 说明今天AI的发展把智能、意识和人的本质这些旧疑问变成迫切现实。 | 再把旧问题接到眼前的新情况 |\n| 第3段 | 展示人们对外形、行动和回应都像人的机器的想象，为机器伦理问题确定对象。 | 先摆出人们对新事物的想象 |\n| 第4段 | 说明意识尚无成熟理论，人类无法轻易实现理想中的智能机器，点出复杂性。 | 接着说明现实还做不到那一步 |\n| 第5段 | 转向已经到来的自动驾驶应用，说明完整类人智能尚未实现也不能推迟困难的伦理决策。 | 但话说回来问题已到眼前且很难 |\n| 第6段 | 介绍政府和企业开始制定AI伦理准则，说明面对复杂性仍须立即行动。 | 再说有些人已经开始想办法 |\n| 第7段 | 以谷歌避免伤害和违法用途的承诺，把伦理约束的起步方式写具体。 | 举一个例子把怎样起步写具体 |\n| 第8段 | 承认初步承诺还不够清楚，仍肯定其价值，并以公平、透明等原则补充方向。 | 先承认办法不完善再肯定起步 |\n| 第9段 | 要求智能机器体现人类最高价值，把复杂而必须推进的伦理工作落到服务人类。 | 最后说必须朝哪个方向继续做 |\n\nA中的 Conscience of AI 不是要求全文证明机器已经具有人类的良心；标题把机器怎样遵守人的伦理价值概括成一个问题。Complex能接住中间连续出现的难处：意识很复杂、缺少好理论，驾驶员的瞬间反应又涉及经验和感官信息，编程很难处理所有情况。But Inevitable接住第五段开头的转折：不能因为还造不出完全像人的机器，就以为伦理问题没有到眼前。\n\n后半篇也不是突然换题。新加坡、英国、印度和大公司在制定规则，谷歌承诺避开总体伤害和侵犯权利，作者说这些虽含糊却是起点；最后再把目标说成智能机器反映人类最高价值。前半篇解释复杂在哪里，后半篇写既然回避不了就怎样开始。A既容得下技术困难，也容得下政府和企业的行动，最后的有用仆人与失控怪物还给出了为什么必须处理的理由。\n\n判断：\n\n**A 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2354,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"A"},"focusId":"focus-q35-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-A-1\">\u003ch4>如果 A 是主旨，文章9段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003cp>那文章9段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>借旧小说中的造物责任引出机器应遵守什么伦理价值的问题。\u003c/td>\n\u003ctd>先讲一个旧例子引出要谈的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明今天AI的发展把智能、意识和人的本质这些旧疑问变成迫切现实。\u003c/td>\n\u003ctd>再把旧问题接到眼前的新情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>展示人们对外形、行动和回应都像人的机器的想象，为机器伦理问题确定对象。\u003c/td>\n\u003ctd>先摆出人们对新事物的想象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明意识尚无成熟理论，人类无法轻易实现理想中的智能机器，点出复杂性。\u003c/td>\n\u003ctd>接着说明现实还做不到那一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转向已经到来的自动驾驶应用，说明完整类人智能尚未实现也不能推迟困难的伦理决策。\u003c/td>\n\u003ctd>但话说回来问题已到眼前且很难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>介绍政府和企业开始制定AI伦理准则，说明面对复杂性仍须立即行动。\u003c/td>\n\u003ctd>再说有些人已经开始想办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>以谷歌避免伤害和违法用途的承诺，把伦理约束的起步方式写具体。\u003c/td>\n\u003ctd>举一个例子把怎样起步写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>承认初步承诺还不够清楚，仍肯定其价值，并以公平、透明等原则补充方向。\u003c/td>\n\u003ctd>先承认办法不完善再肯定起步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9段\u003c/td>\n\u003ctd>要求智能机器体现人类最高价值，把复杂而必须推进的伦理工作落到服务人类。\u003c/td>\n\u003ctd>最后说必须朝哪个方向继续做\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A中的 Conscience of AI 不是要求全文证明机器已经具有人类的良心；标题把机器怎样遵守人的伦理价值概括成一个问题。Complex能接住中间连续出现的难处：意识很复杂、缺少好理论，驾驶员的瞬间反应又涉及经验和感官信息，编程很难处理所有情况。But Inevitable接住第五段开头的转折：不能因为还造不出完全像人的机器，就以为伦理问题没有到眼前。\u003c/p>\n\u003cp>后半篇也不是突然换题。新加坡、英国、印度和大公司在制定规则，谷歌承诺避开总体伤害和侵犯权利，作者说这些虽含糊却是起点；最后再把目标说成智能机器反映人类最高价值。前半篇解释复杂在哪里，后半篇写既然回避不了就怎样开始。A既容得下技术困难，也容得下政府和企业的行动，最后的有用仆人与失控怪物还给出了为什么必须处理的理由。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Frankenstein, the Novel Predicting the Age of AI","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### B. Frankenstein, the Novel Predicting the Age of AI\n\n《弗兰肯斯坦》：预言人工智能时代的小说","context":{"mode":"image","asset":"questions","focus":[250,2354,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"B"},"focusId":"focus-q35-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>《弗兰肯斯坦》：预言人工智能时代的小说\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Frankenstein, the Novel Predicting the Age of AI","level":3,"raw":"#### 如果 B 是主旨，文章9段应该怎么写？\n\n如果全文主旨真的是：\n\n《弗兰肯斯坦》：预言人工智能时代的小说\n\n那文章9段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先介绍小说里关于人造智能及创造者责任的旧设想，提出它预言了AI时代的主题。 | 先讲一个旧例子引出要谈的问题 |\n| 第2段 | 把当代AI的伦理疑问与小说当年的设想逐项相接，说明预言如何进入现实。 | 再把旧问题接到眼前的新情况 |\n| 第3段 | 展示公众对小说所预言的类人机器的想象，并说明影视怎样延续这些预言图景。 | 先摆出人们对新事物的想象 |\n| 第4段 | 指出现实尚不能复制小说预想的完整类人意识，界定预言尚未兑现的部分。 | 接着说明现实还做不到那一步 |\n| 第5段 | 转向已出现的自动驾驶责任难题，说明小说预示的伦理困境却已先于完整类人机器到来。 | 但话说回来问题已到眼前且很难 |\n| 第6段 | 介绍读者与研究者如何借小说的警告提出当代治理办法，继续展示预言的启发。 | 再说有些人已经开始想办法 |\n| 第7段 | 举一项由小说的创造责任警告引出的企业承诺，具体呈现预言怎样指导行动。 | 举一个例子把怎样起步写具体 |\n| 第8段 | 承认根据小说发展出的初步治理方案仍粗略，同时肯定从文学预警走向现实规则的起步。 | 先承认办法不完善再肯定起步 |\n| 第9段 | 回到小说的预见价值，要求继续理解其警告，使预言中的失控情节不在AI时代重演。 | 最后说必须朝哪个方向继续做 |\n\nB确实能接住开头的小说和两百年，也能接住末段再次出现的Frankenstein；但是“预言人工智能时代的小说”要求小说本身始终是被解释、被核对的对象。那样第四段讨论意识、第五段讨论驾驶时，就应该指出这些情形分别对应小说里的哪项设想，后面的规则也应被用来证明小说预见得准。\n\n实际正文没有沿着小说情节展开。第四段伊格曼说现实理论不足，第五段详细拆驾驶员的反应和程序困难，第六、七段说各方当下怎样建立规范，这些段落之间能够直接连起来，不需要借小说内容作中介。结尾提到怪物，是把不能让机器失控的要求说得形象，并非评定一本书的预测成就。B把承担开头引入和结尾警示作用的小说，抬成了全文一直在论证的中心，因此中间大部分具体讨论在这个标题下找不到应有的位置。\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2354,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"B"},"focusId":"focus-q35-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>《弗兰肯斯坦》：预言人工智能时代的小说\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-B-1\">\u003ch4>如果 B 是主旨，文章9段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>《弗兰肯斯坦》：预言人工智能时代的小说\u003c/p>\n\u003cp>那文章9段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先介绍小说里关于人造智能及创造者责任的旧设想，提出它预言了AI时代的主题。\u003c/td>\n\u003ctd>先讲一个旧例子引出要谈的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>把当代AI的伦理疑问与小说当年的设想逐项相接，说明预言如何进入现实。\u003c/td>\n\u003ctd>再把旧问题接到眼前的新情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>展示公众对小说所预言的类人机器的想象，并说明影视怎样延续这些预言图景。\u003c/td>\n\u003ctd>先摆出人们对新事物的想象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出现实尚不能复制小说预想的完整类人意识，界定预言尚未兑现的部分。\u003c/td>\n\u003ctd>接着说明现实还做不到那一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转向已出现的自动驾驶责任难题，说明小说预示的伦理困境却已先于完整类人机器到来。\u003c/td>\n\u003ctd>但话说回来问题已到眼前且很难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>介绍读者与研究者如何借小说的警告提出当代治理办法，继续展示预言的启发。\u003c/td>\n\u003ctd>再说有些人已经开始想办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>举一项由小说的创造责任警告引出的企业承诺，具体呈现预言怎样指导行动。\u003c/td>\n\u003ctd>举一个例子把怎样起步写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>承认根据小说发展出的初步治理方案仍粗略，同时肯定从文学预警走向现实规则的起步。\u003c/td>\n\u003ctd>先承认办法不完善再肯定起步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9段\u003c/td>\n\u003ctd>回到小说的预见价值，要求继续理解其警告，使预言中的失控情节不在AI时代重演。\u003c/td>\n\u003ctd>最后说必须朝哪个方向继续做\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B确实能接住开头的小说和两百年，也能接住末段再次出现的Frankenstein；但是“预言人工智能时代的小说”要求小说本身始终是被解释、被核对的对象。那样第四段讨论意识、第五段讨论驾驶时，就应该指出这些情形分别对应小说里的哪项设想，后面的规则也应被用来证明小说预见得准。\u003c/p>\n\u003cp>实际正文没有沿着小说情节展开。第四段伊格曼说现实理论不足，第五段详细拆驾驶员的反应和程序困难，第六、七段说各方当下怎样建立规范，这些段落之间能够直接连起来，不需要借小说内容作中介。结尾提到怪物，是把不能让机器失控的要求说得形象，并非评定一本书的预测成就。B把承担开头引入和结尾警示作用的小说，抬成了全文一直在论证的中心，因此中间大部分具体讨论在这个标题下找不到应有的位置。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. AI’s Future: In the Hands of Tech Giants","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### C. AI’s Future: In the Hands of Tech Giants\n\n人工智能的未来：掌握在科技巨头手里","context":{"mode":"image","asset":"questions","focus":[250,2354,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"C"},"focusId":"focus-q35-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>人工智能的未来：掌握在科技巨头手里\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. AI’s Future: In the Hands of Tech Giants","level":3,"raw":"#### 如果 C 是主旨，文章9段应该怎么写？\n\n如果全文主旨真的是：\n\n人工智能的未来：掌握在科技巨头手里\n\n那文章9段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 用旧故事中创造者控制造物的例子，引出今天谁能决定AI未来的权力问题。 | 先讲一个旧例子引出要谈的问题 |\n| 第2段 | 把创造者的选择接到当代科技巨头的研发和部署决策上，说明这种权力的现实载体。 | 再把旧问题接到眼前的新情况 |\n| 第3段 | 展示企业描绘的类人机器愿景，说明公众对AI未来的想象怎样受到巨头塑造。 | 先摆出人们对新事物的想象 |\n| 第4段 | 指出掌握资源的大公司仍未实现完整类人意识，因此AI下一步取决于它们攻克哪些技术难点。 | 接着说明现实还做不到那一步 |\n| 第5段 | 说明自动驾驶等产品已经带来艰难取舍，而企业掌握设计和投放权，使问题更加迫切。 | 但话说回来问题已到眼前且很难 |\n| 第6段 | 介绍巨头开始建立内部伦理方案，政府提出的要求也需要它们落实到产品决定中。 | 再说有些人已经开始想办法 |\n| 第7段 | 以谷歌宣布哪些AI不开发为例，具体说明企业如何用开发权决定未来技术边界。 | 举一个例子把怎样起步写具体 |\n| 第8段 | 承认企业承诺含糊且尚不完善，仍肯定掌握实际技术权力者开始自我约束的意义。 | 先承认办法不完善再肯定起步 |\n| 第9段 | 总结应促使科技巨头负责任地运用决策权，因为AI的未来在很大程度上由它们的选择塑造。 | 最后说必须朝哪个方向继续做 |\n\nC里的Tech Giants能找到谷歌和mega-corporations，后面也确实谈了公司应该遵守什么。但“In the Hands of”进一步把人工智能的未来归到科技巨头手里，这就要求全文解释谁拥有控制权、为何企业能决定其他人的方向。\n\n实际第六段把企业和other governments并列，具体还列出新加坡、英国、印度，没有说政府只能跟随科技巨头。第七段谷歌只是紧接其后的一个具体例子，第八段对它的评价也只是one starting point，另一个关于可解释与公平的想法同样是起点。结尾提出的衡量标准是humanity’s highest values，主体扩展到“我们如何确保”，不是“巨头怎样决定”。C虽然抓住了一个分量不小的例子，却把参与制定规范的一类主体改成了掌握全局的主体；它既解释不了前面的意识与驾驶困难，也把后面政府和全人类价值的位置挤掉了。\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2354,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"C"},"focusId":"focus-q35-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>人工智能的未来：掌握在科技巨头手里\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-C-1\">\u003ch4>如果 C 是主旨，文章9段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>人工智能的未来：掌握在科技巨头手里\u003c/p>\n\u003cp>那文章9段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>用旧故事中创造者控制造物的例子，引出今天谁能决定AI未来的权力问题。\u003c/td>\n\u003ctd>先讲一个旧例子引出要谈的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>把创造者的选择接到当代科技巨头的研发和部署决策上，说明这种权力的现实载体。\u003c/td>\n\u003ctd>再把旧问题接到眼前的新情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>展示企业描绘的类人机器愿景，说明公众对AI未来的想象怎样受到巨头塑造。\u003c/td>\n\u003ctd>先摆出人们对新事物的想象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出掌握资源的大公司仍未实现完整类人意识，因此AI下一步取决于它们攻克哪些技术难点。\u003c/td>\n\u003ctd>接着说明现实还做不到那一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>说明自动驾驶等产品已经带来艰难取舍，而企业掌握设计和投放权，使问题更加迫切。\u003c/td>\n\u003ctd>但话说回来问题已到眼前且很难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>介绍巨头开始建立内部伦理方案，政府提出的要求也需要它们落实到产品决定中。\u003c/td>\n\u003ctd>再说有些人已经开始想办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>以谷歌宣布哪些AI不开发为例，具体说明企业如何用开发权决定未来技术边界。\u003c/td>\n\u003ctd>举一个例子把怎样起步写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>承认企业承诺含糊且尚不完善，仍肯定掌握实际技术权力者开始自我约束的意义。\u003c/td>\n\u003ctd>先承认办法不完善再肯定起步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9段\u003c/td>\n\u003ctd>总结应促使科技巨头负责任地运用决策权，因为AI的未来在很大程度上由它们的选择塑造。\u003c/td>\n\u003ctd>最后说必须朝哪个方向继续做\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C里的Tech Giants能找到谷歌和mega-corporations，后面也确实谈了公司应该遵守什么。但“In the Hands of”进一步把人工智能的未来归到科技巨头手里，这就要求全文解释谁拥有控制权、为何企业能决定其他人的方向。\u003c/p>\n\u003cp>实际第六段把企业和other governments并列，具体还列出新加坡、英国、印度，没有说政府只能跟随科技巨头。第七段谷歌只是紧接其后的一个具体例子，第八段对它的评价也只是one starting point，另一个关于可解释与公平的想法同样是起点。结尾提出的衡量标准是humanity’s highest values，主体扩展到“我们如何确保”，不是“巨头怎样决定”。C虽然抓住了一个分量不小的例子，却把参与制定规范的一类主体改成了掌握全局的主体；它既解释不了前面的意识与驾驶困难，也把后面政府和全人类价值的位置挤掉了。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. AI Shall Be Killers Once Out of Control","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### D. AI Shall Be Killers Once Out of Control\n\n人工智能一旦失控就会成为杀手","context":{"mode":"image","asset":"questions","focus":[250,2354,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"D"},"focusId":"focus-q35-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>人工智能一旦失控就会成为杀手\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. AI Shall Be Killers Once Out of Control","level":3,"raw":"#### 如果 D 是主旨，文章9段应该怎么写？\n\n如果全文主旨真的是：\n\n人工智能一旦失控就会成为杀手\n\n那文章9段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 用旧小说中失控造物造成死亡的故事，引出智能机器一旦失控便成为杀手的条件判断。 | 先讲一个旧例子引出要谈的问题 |\n| 第2段 | 把这种失控与致命后果的关系接到今天AI应用中的控制问题。 | 再把旧问题接到眼前的新情况 |\n| 第3段 | 展示人们想象的自主类人机器，突出它们在失去安全限制后实施致命行为的情景。 | 先摆出人们对新事物的想象 |\n| 第4段 | 指出机器像人一样理解和克制伤害仍未实现，使人类尚不能靠机器的自觉排除失控杀人的后果。 | 接着说明现实还做不到那一步 |\n| 第5段 | 转向自动驾驶等眼前应用，说明阻止失控导致死亡已经是困难而迫切的现实任务。 | 但话说回来问题已到眼前且很难 |\n| 第6段 | 介绍各方开始设计可中断系统和行为边界，以防机器越过控制而造成死亡。 | 再说有些人已经开始想办法 |\n| 第7段 | 举企业禁止自主武器的承诺，具体说明它怎样防范失控机器成为杀手。 | 举一个例子把怎样起步写具体 |\n| 第8段 | 承认安全承诺仍不能覆盖每种失控情境，同时肯定建立致命行为约束是必要开端。 | 先承认办法不完善再肯定起步 |\n| 第9段 | 要求继续加强可控性和紧急停止能力，以避免失控即造成致命伤害的结果。 | 最后说必须朝哪个方向继续做 |\n\nD抓住了后半篇的harm、weapons和最后的out-of-control monster，因此危险方向不是完全无关。但“Shall Be Killers Once Out of Control”是一个很强的条件\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2354,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"D"},"focusId":"focus-q35-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>人工智能一旦失控就会成为杀手\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-D-1\">\u003ch4>如果 D 是主旨，文章9段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>人工智能一旦失控就会成为杀手\u003c/p>\n\u003cp>那文章9段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>用旧小说中失控造物造成死亡的故事，引出智能机器一旦失控便成为杀手的条件判断。\u003c/td>\n\u003ctd>先讲一个旧例子引出要谈的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>把这种失控与致命后果的关系接到今天AI应用中的控制问题。\u003c/td>\n\u003ctd>再把旧问题接到眼前的新情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>展示人们想象的自主类人机器，突出它们在失去安全限制后实施致命行为的情景。\u003c/td>\n\u003ctd>先摆出人们对新事物的想象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出机器像人一样理解和克制伤害仍未实现，使人类尚不能靠机器的自觉排除失控杀人的后果。\u003c/td>\n\u003ctd>接着说明现实还做不到那一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转向自动驾驶等眼前应用，说明阻止失控导致死亡已经是困难而迫切的现实任务。\u003c/td>\n\u003ctd>但话说回来问题已到眼前且很难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>介绍各方开始设计可中断系统和行为边界，以防机器越过控制而造成死亡。\u003c/td>\n\u003ctd>再说有些人已经开始想办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>举企业禁止自主武器的承诺，具体说明它怎样防范失控机器成为杀手。\u003c/td>\n\u003ctd>举一个例子把怎样起步写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>承认安全承诺仍不能覆盖每种失控情境，同时肯定建立致命行为约束是必要开端。\u003c/td>\n\u003ctd>先承认办法不完善再肯定起步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9段\u003c/td>\n\u003ctd>要求继续加强可控性和紧急停止能力，以避免失控即造成致命伤害的结果。\u003c/td>\n\u003ctd>最后说必须朝哪个方向继续做\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D抓住了后半篇的harm、weapons和最后的out-of-control monster，因此危险方向不是完全无关。但“Shall Be Killers Once Out of Control”是一个很强的条件\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"35题结论","level":2,"raw":"### 35题结论\n\n**35. A. The Conscience of AI: Complex But Inevitable**\n\n这句话就是本文后续做题的主旨底牌：\n\n**The Conscience of AI: Complex But Inevitable / 人工智能的良知：复杂，但不可回避**","context":{"mode":"image","asset":"questions","focus":[250,2354,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"question":"35","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>35. A. The Conscience of AI: Complex But Inevitable\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>The Conscience of AI: Complex But Inevitable / 人工智能的良知：复杂，但不可回避\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"31题 · 题干、题型与核心出处","level":2,"raw":"## 31题\n\n> Mary Shelley’s novel Frankenstein is mentioned because it ______.  \n> 文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？\n\n### 题型\n\n引例作用题。题干要求判断“文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> This year marks exactly two centuries since the publication of \"Frankenstein; or, The Modern Prometheus,\" by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\n>\n> Today the rapid growth of artificial intelligence (AI) raises fundamental questions: \"What is intelligence, identity, or consciousness? What makes humans humans?\"\n\n首段把小说与后来技术将提出的伦理问题联系，第二段用Today把这种关切接到今天的人工智能。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"question":"31","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Mary Shelley’s novel Frankenstein is mentioned because it ______.\u003cbr>文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>引例作用题。题干要求判断“文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>This year marks exactly two centuries since the publication of &quot;Frankenstein; or, The Modern Prometheus,&quot; by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003cp>Today the rapid growth of artificial intelligence (AI) raises fundamental questions: &quot;What is intelligence, identity, or consciousness? What makes humans humans?&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>首段把小说与后来技术将提出的伦理问题联系，第二段用Today把这种关切接到今天的人工智能。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. involves some concerns raised by AI today","level":3,"raw":"### A. involves some concerns raised by AI today\n\n> 涉及今天人工智能引发的一些关切\n\n**做题模式中的状态：** 第一轮A保留。当时的定位线索是：A里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。\n\n**选项类型：正确概括例子作用。**\n\n首段foreshadow many ethical questions表示作品预示后来技术会提出的伦理问题；第2段Today把话题接到今天AI所引发的智能、身份和意识疑问。一个交代早期关切，一个给出今天的对应对象。\n\nA的involves some concerns raised by AI today概括这两段的衔接。some保留部分关联，不声称小说准确预测整个AI时代，也不说小说本身制造了现实伦理冲突。\n\n**出处：**\n\n> Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\n>\n> Today the rapid growth of artificial intelligence (AI) raises fundamental questions: \"What is intelligence, identity, or consciousness?","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option":"A"},"focusId":"focus-q31-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>涉及今天人工智能引发的一些关切\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>首段foreshadow many ethical questions表示作品预示后来技术会提出的伦理问题；第2段Today把话题接到今天AI所引发的智能、身份和意识疑问。一个交代早期关切，一个给出今天的对应对象。\u003c/p>\n\u003cp>A的involves some concerns raised by AI today概括这两段的衔接。some保留部分关联，不声称小说准确预测整个AI时代，也不说小说本身制造了现实伦理冲突。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003cp>Today the rapid growth of artificial intelligence (AI) raises fundamental questions: &quot;What is intelligence, identity, or consciousness?\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. involves some concerns raised by AI today","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 文章提到玛丽·雪莱的小说，是因为它涉及今天人工智能引发的一些关切。\n\nA里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。\n\n首段foreshadow many ethical questions表示作品预示后来技术会提出的伦理问题；第2段Today把话题接到今天AI所引发的智能、身份和意识疑问。一个交代早期关切，一个给出今天的对应对象。\n\nA的involves some concerns raised by AI today概括这两段的衔接。some保留部分关联，不声称小说准确预测整个AI时代，也不说小说本身制造了现实伦理冲突。","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"31","option":"A"},"focusId":"focus-q31-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>涉及今天人工智能引发的一些关切\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>首段foreshadow many ethical questions表示作品预示后来技术会提出的伦理问题；第2段Today把话题接到今天AI所引发的智能、身份和意识疑问。一个交代早期关切，一个给出今天的对应对象。\u003c/p>\n\u003cp>A的involves some concerns raised by AI today概括这两段的衔接。some保留部分关联，不声称小说准确预测整个AI时代，也不说小说本身制造了现实伦理冲突。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003cp>Today the rapid growth of artificial intelligence (AI) raises fundamental questions: &quot;What is intelligence, identity, or consciousness?\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>文章提到玛丽·雪莱的小 第一段末句和第二段开头合起来看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>首段foreshadow many ethical questions表示作品预示后来技术会提出的伦理问题；第2段Today把话题接到今天AI所引发的智能、身份和意识疑问。一个交代早期关切，一个给出今天的对应对象。\u003c/p>\n\u003cp>A的involves some concerns raised by AI today概括这两段的衔接。some保留部分关联，不声称小说准确预测整个AI时代，也不说小说本身制造了现实伦理冲突。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003cp>Today the rapid growth of artificial intelligence (AI) raises fundamental questions: &quot;What is intelligence, identity, or consciousness?\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>文章提到玛丽·雪莱的小说，是因为它涉及今天人工智能引发的一些关切。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。\u003c/p>\n\u003cp>首段foreshadow many ethical questions表示作品预示后来技术会提出的伦理问题；第2段Today把话题接到今天AI所引发的智能、身份和意识疑问。一个交代早期关切，一个给出今天的对应对象。\u003c/p>\n\u003cp>A的involves some concerns raised by AI today概括这两段的衔接。some保留部分关联，不声称小说准确预测整个AI时代，也不说小说本身制造了现实伦理冲突。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003cp>Today the rapid growth of artificial intelligence (AI) raises fundamental questions: &quot;What is intelligence, identity, or consciousness?\u003c/p>\n\u003cp>首段把小说与后来技术将提出的伦理问题联系，第二段用Today把这种关切接到今天的人工智 orld are fascinated by Shelley’s novel.\u003c/p>\n\u003cp>全世界的人工智能科学家都对雪莱的小说着迷。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文写人类迷恋类人机器人的想法，科学家则尚未掌握通用人工智能。假设把着迷的对象换成小说、着迷者换成全球科学家，首尾均没有对应。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. fascinates AI scientists all over the world","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> The Conscience of AI: Complex But Inevitable  \n> 人工智能的良知：复杂，但不可回避\n\n把这个主旨直接代入31题题干：\n\n> 全文要讨论人工智能的伦理约束，小说应作为这一问题的早期文学引入；主旨不能替文章证明两百年持续流行、科学家反应或现实争论。\n\nC实际说的是：\n\n> fascinates AI scientists all over the world  \n> 让全世界的人工智能科学家着迷\n\n原句明写 artificial general intelligence，并用模仿人类思考的机器来解释；C把这个主语换成小说，不能据此回答为什么提到小说。\n\n从全文推进看，这一处的作用是：从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。转到今天的人工智能，列出智能、意识和人之所以为人的疑问。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：C错误。**","context":{"mode":"image","asset":"questions","focus":[250,516,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"31","option":"C"},"focusId":"focus-q31-C-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-C-0\">\u003cblockquote>\n\u003cp>让全世界的人工智能科学家着迷\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C中的 fascinates AI scientists 把对象落在人工智能科学家身上，粗读时第三段出现过科学家和机器；scientists指的也是科学家这个对象，所以先回到第三段读完，再看影响科学家的到底是什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>回到C，fascinates AI scientists把影响科学家的主语写成了小说；第三段的主语却是artificial general intelligence，接着再看这两处具体说法。\u003c/p>\n\u003cp>原句明写 artificial general intelligence，并用模仿人类思考的机器来解释；C把这个主语换成小说，不能据此回答为什么提到小说。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This year marks exactly two centuries since the publication of &quot;Frankenstein; or, The Modern Prometheus,&quot; by Mary Shelley. Even before the invention of the electric light bulb, the author u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文要讨论人工智能的伦理约束，小说应作为这一问题的早期文学引入；主旨不能替文章证明两百年持续流行、科学家反应或现实争论。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>fascinates AI scientists all over the world\u003cbr>让全世界的人工智能科学家着迷\u003c/p>\n\u003c/blockquote>\n\u003cp>原句明写 artificial general intelligence，并用模仿人类思考的机器来解释；C把这个主语换成小说，不能据此回答为什么提到小说。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。转到今天的人工智能，列出智能、意识和人之所以为人的疑问。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. has sparked serious ethical controversies","level":3,"raw":"### D. has sparked serious ethical controversies\n\n> 已经引发严重的伦理争论\n\n**做题模式中的状态：** 第一轮D保留。当时选项呈现为“has sparked serious ethical [xxx]”，保留了相应遮挡。当时的定位线索是：D用 has sparked 说小说引发了某种伦理上的东西，第一段 ethical questions 也是小说后面紧接的伦理内容，因此回到第一段作品与伦理问题相连的那一句，看原文说的是哪种联系。读完全文后，做题模式再经交叉验证排除D，最终选择A。\n\n**错误类型：第一类——歪曲原意。**\n\ncontroversies是争论，has sparked表示已经引发。D接回题干后，变成小说是现实伦理争论的触发者；原文foreshadow却说作品预示将由未来技术引出的伦理问题。\n\n一边是文学作品先写到问题，一边是作品导致争论发生，动作和时间均不同。第一段没有介绍小说出版后引发哪些争论，第二段明确把今天的问题联系到AI发展，因此不能用ethical这个共同词补全D的因果。\n\n**命题人借用的原文材料：**\n\n> Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.","context":{"mode":"image","asset":"questions","focus":[250,605,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option"
