":"\u003cblockquote>\n\u003cp>\u003cstrong>31. A. involves some concerns raised by AI today\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：首段foreshadow many ethical questions表示作品预示后来技术会提出的伦理问题；第2段Today把话题接到今天AI所引发的智能、身份和意识疑问。\u003c/p>\n\u003cp>B：原文用 since the publication 计算的是“自出版以来到今年”的时间，起点是出版事件。\u003c/p>\n\u003cp>C：回到C，fascinates AI scientists把影响科学家的主语写成了小说；第三段的主语却是artificial general intelligence，接着再看这两处具体说法。\u003c/p>\n\u003cp>D：controversies是争论，has sparked表示已经引发。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"32题 · 题干、题型与核心出处","level":2,"raw":"## 32题\n\n> In David Eagleman’s opinion, our current knowledge of consciousness ______.  \n> 按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？\n\n### 题型\n\n人物观点题。题干要求判断“按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> What is being called artificial general intelligence, machines that would imitate the way humans think, continues to evade scientists. Yet humans remain fascinated by the idea of robots that would look, move, and respond like humans, similar to those recently depicted on popular sci-fi TV series such as \"Westworld\" and \"Humans.\"\n>\n> Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University neuroscientist. \"We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.\"\n\n第4段先说人的思维太复杂而无法理解，更不用说复制，再用no good theories说明还没有足以解释意识并造出相应机器的理论。","context":{"mode":"image","asset":"questions","focus":[250,771,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"question":"32","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>In David Eagleman’s opinion, our current knowledge of consciousness ______.\u003cbr>按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点题。题干要求判断“按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>What is being called artificial general intelligence, machines that would imitate the way humans think, continues to evade scientists. Yet humans remain fascinated by the idea of robots that would look, move, and respond like humans, similar to those recently depicted on popular sci-fi TV series such as &quot;Westworld&quot; and &quot;Humans.&quot;\u003c/p>\n\u003cp>Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University neuroscientist. &quot;We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>第4段先说人的思维太复杂而无法理解，更不用说复制，再用no good theories说明还没有足以解释意识并造出相应机器的理论。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. helps explain artificial intelligence","level":3,"raw":"### A. helps explain artificial intelligence\n\n> 有助于解释人工智能\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。\n\n**错误类型：第一类——歪曲原意。**\n\n这要求后文给出可用于解释机器的成熟理论。实际明确说no good theories，把尚无法充分说明的知识写成已有解释，改变了认识水平。\n\n**命题人借用的原文材料：**\n\n> \"We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.\"","context":{"mode":"image","asset":"questions","focus":[250,868,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"A"},"focusId":"focus-q32-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>有助于解释人工智能\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>这要求后文给出可用于解释机器的成熟理论。实际明确说no good theories，把尚无法充分说明的知识写成已有解释，改变了认识水平。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. helps explain artificial intelligence","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 伊格曼认为，我们目前对意识的认识有助于解释人工智能。\n\nA的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。\n\n引语里的 no good theories 同时带出两个解释对象：意识究竟是什么，以及怎样造出一台机器达到那个程度。A的 helps explain 却把我们的现有认识写成了正在帮助解释人工智能的资源。前一句还说人的思考仍太复杂，无法理解，这也不是在介绍现有认识已经带来的解释成果。\n\n第4段先说人的思维太复杂而无法理解，更不用说复制，再用no good theories说明还没有足以解释意识并造出相应机器的理论。\n\n这要求后文给出可用于解释机器的成熟理论。实际明确说no good theories，把尚无法充分说明的知识写成已有解释，改变了认识水平。","context":{"mode":"image","asset":"questions","focus":[250,868,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"32","option":"A"},"focusId":"focus-q32-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>有助于解释人工智能\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>这要求后文给出可用于解释机器的成熟理论。实际明确说no good theories，把尚无法充分说明的知识写成已有解释，改变了认识水平。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>伊格曼认为，我们目前对意识的认识有助于解释人工智能。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。\u003c/p>\n\u003cp>引语里的 no good theories 同时带出两个解释对象：意识究竟是什么，以及怎样造出一台机器达到那个程度。A的 helps explain 却把我们的现有认识写成了正在帮助解释人工智能的资源。前一句还说人的思考仍太复杂，无法理解，这也不是在介绍现有认识已经带来的解释成果。\u003c/p>\n\u003cp>第4段先说人的思维太复杂而无法理解，更不用说复制，再用no good theories说明还没有足以解释意识并造出相应机器的理论。\u003c/p>\n\u003cp>这要求后文给出可用于解释机器的成熟理论。实际明确说no good theories，把尚无法充分说明的知识写成已有解释，改变了认识水平。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. helps explain artificial intelligence","level":4,"raw":"#### 写作视角法\n\n原文第3、4段是这样写的：\n\n> \"We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.\"\n>\n> 第4段先说人的思维太复杂而无法理解，更不用说复制，再用no good theories说明还没有足以解释意识并造出相应机器的理论。\n\n把这一处放回全文，它承担的写作任务是：写模仿人类思考的机器、像人的机器人和科幻电视剧中的形象。借伊格曼的说明指出，意识尚难理解，更难复制到机器中。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Our present understanding of consciousness already provides an explanation of artificial intelligence.\n>\n> 现有意识知识已经提供了对人工智能的解释。\n\n这要求后文给出可用于解释机器的成熟理论。实际明确说no good theories，把尚无法充分说明的知识写成已有解释，改变了认识水平。","context":{"mode":"image","asset":"questions","focus":[250,868,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"32","option":"A"},"focusId":"focus-q32-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>有助于解释人工智能\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前 。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. helps explain artificial intelligence","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> The Conscience of AI: Complex But Inevitable  \n> 人工智能的良知：复杂，但不可回避\n\n把这个主旨直接代入32题题干：\n\n> 全文承认伦理与技术问题复杂，但本题具体问意识知识的限度；主旨只能限定为仍有困难，复制能力须由too complex与let alone判断。\n\nA实际说的是：\n\n> helps explain artificial intelligence  \n> 有助于解释人工智能\n\n引语里的 no good theories 同时带出两个解释对象：意识究竟是什么，以及怎样造出一台机器达到那个程度。A的 helps explain 却把我们的现有认识写成了正在帮助解释人工智能的资源。前一句还说人的思考仍太复杂，无法理解，这也不是在介绍现有认识已经带来的解释成果。\n\n从全文推进看，这一处的作用是：写模仿人类思考的机器、像人的机器人和科幻电视剧中的形象。借伊格曼的说明指出，意识尚难理解，更难复制到机器中。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,868,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"32","option":"A"},"focusId":"focus-q32-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>有助于解释人工智能\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>这要求后文给出可用于解释机器的成熟理论。实际明确说no good theories，把尚无法充分说明的知识写成已有解释，改变了认识水平。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>伊格曼认为，我们目前对意识的认识有助于解释人工智能。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说 s说明还没有足以解释意识并造出相应机器的理论。\n\n把这一处放回全文，它承担的写作任务是：写模仿人类思考的机器、像人的机器人和科幻电视剧中的形象。借伊格曼的说明指出，意识尚难理解，更难复制到机器中。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Our knowledge of consciousness directs robot makers along a mistaken path.\n>\n> 意识知识会把机器人制造者引向错误道路。\n\nmisleading要求已有认知导致错误设计的关系。伊格曼说的是知识不足、尚不能复制，既没有提出错误理论，也没有报告制造者被它误导。","context":{"mode":"image","asset":"questions","focus":[250,1132,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"32","option":"D"},"focusId":"focus-q32-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-D-0\">\u003cblockquote>\n\u003cp>可能误导机器人制造\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 misleading 指向认识把造机器带偏，第四段 no good theories 则说明意识与造机器之间缺少什么解释，因此回到伊格曼那句同时谈意识和 build a machine 的话。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 no good theories 是理论还没能解释意识和机器的实现方法，重点在没有弄明白。D的 misleading 则要求已有认识给了一个错误方向，照着它去造机器人会被带偏。这是两种不同的认识问题：不知道怎样做，不等于已经给出了错误做法。伊格曼前面说 too complex to be understood，后面仍在讲解释没有完成；他并没有把某种现有理论作为错误路线来批判。D将“认识不足，无法指导复制”换成了“已有认识产生错误指导”，改变了认识与造机器的关系。\u003c/p>\n\u003cp>缺少可用解释使复制难以进行，misleading则指错误解释造成误导；伊格曼说的是前一种困难。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>伊格曼认为，我们目前对意识的认识可能误导机器人制造。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 misleading 指向认识把造机器带偏，第四段 no good theories 则说明意识与造机器之间缺少什么解释，因此回到伊格曼那句同时谈意识和 build a machine 的话。\u003c/p>\n\u003cp>原文的 no good theories 是理论还没能解释意识和机器的实 \u003cp>B：先难以理解、再更谈不上复制，构成由认识到技术实现的递进。\u003c/p>\n\u003cp>C：inspires指提供灵感。\u003c/p>\n\u003cp>D：原文的 no good theories 是理论还没能解释意识和机器的实现方法，重点在没有弄明白。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"33题 · 题干、题型与核心出处","level":2,"raw":"## 33题\n\n> The solution to the ethical issues brought by autonomous vehicles ______.  \n> 自动驾驶车辆所带来的伦理问题，其解决办法怎样？\n\n### 题型\n\n现实能力推断题。题干要求判断“自动驾驶车辆所带来的伦理问题，其解决办法怎样？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> But that doesn't mean crucial ethical issues involving AI aren't at hand. The coming use of autonomous vehicles, for example, poses thorny ethical questions. Human drivers sometimes must make split-second decisions. Their reactions may be a complex combination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment. AI \"vision\" today is not nearly as sophisticated as that of humans. And to anticipate every imaginable driving situation is a difficult programming problem.\n\n人类的瞬间判断综合本能、经验和感官信息，AI视觉尚不及人类，预见所有驾驶情境又是困难的编程问题。","context":{"mode":"image","asset":"questions","focus":[250,1299,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"question":"33","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The solution to the ethical issues brought by autonomous vehicles ______.\u003cbr>自动驾驶车辆所带来的伦理问题，其解决办法怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>现实能力推断题。题干要求判断“自动驾驶车辆所带来的伦理问题，其解决办法怎样？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>But that doesn&#39;t mean crucial ethical issues involving AI aren&#39;t at hand. The coming use of autonomous vehicles, for example, poses thorny ethical questions. Human drivers sometimes must make split-second decisions. Their reactions may be a complex combination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment. AI &quot; ical questions.\u003c/p>\n\u003cp>And to anticipate every imaginable driving situation is a difficult programming problem.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. has aroused much curiosity","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 自动驾驶带来的伦理问题，其解决办法已经引起很多好奇。\n\nB声称自动驾驶伦理问题的解决办法已经`aroused much curiosity`，即引起很大好奇。第5段介绍的是复杂反应、视觉差距和编程困难，必须判断这些困难是否提供了公众对解决办法感到好奇的证据。\n\ncuriosity是好奇心，has aroused much curiosity说解决办法已经引起大量好奇。第5段既未描述一种已提出的解决办法，也没有介绍公众对这种办法的反应。\n\n本段比较人类多种信息综合判断与AI尚不成熟的视觉，并指出预见所有驾驶情境很难。它为当前能力不足提供两方面原因；B把处理难度改成社会心理反应，所需的好奇程度无从取得。\n\n人类的瞬间判断综合本能、经验和感官信息，AI视觉尚不及人类，预见所有驾驶情境又是困难的编程问题。\n\n若是好奇，作者应介绍公众如何追问或关注方案。该段列的是决策复杂性、视觉差距和预测难题，没有把解决能力写成社会反应。","context":{"mode":"image","asset":"questions","focus":[250,1484,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"33","option":"B"},"focusId":"focus-q33-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-B-0\">\u003cblockquote>\n\u003cp>已经引起很多好奇\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“has aroused much [xxx]”，保留了相应遮挡。当时的定位线索是：B用 has aroused much 描述解决办法引起的某种反应，第五段 ethical questions 也出现在自动驾驶车辆之后，都与这些伦理问题有关，因此回看问题如何被提起以及段尾怎样描述解决难度。读完全文后，做题模式再经交叉验证排除B，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>curiosity是好奇心，has aroused much curiosity说解决办法已经引起大量好奇。第5段既未描述一种已提出的解决办法，也没有介绍公众对这种办法的反应。\u003c/p>\n\u003cp>本段比较人类多种信息综合判断与AI尚不成熟的视觉，并指出预见所有驾驶情境很难。它为当前能力不足提供两方面原因；B把处理难度改成社会心理反应，所需的好奇程度无从取得。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The coming use of autonomous vehicles, for example, poses thorny ethical questions.\u003c/p>\n\u003cp>And to anticipate every imaginable driving situation is a difficult programming problem.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csect 全文推进看，这一处的作用是：转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. causes little public concern","level":3,"raw":"### D. causes little public concern\n\n> 几乎没有引起公众关注\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D的 little public concern 说这类问题在公众层面没有多少关切，粗读时紧接的一段却出现了政府和指导原则；other governments 与前面的自动驾驶伦理问题接在一起讨论社会应对，所以把第六段整段读完，再看各方是否正在行动。\n\n**错误类型：第三类——无中生有。**\n\n再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。\n\n原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。\n\n**命题人借用的原文材料：**\n\n> But that doesn't mean crucial ethical issues involving AI aren't at hand. The coming use of autonomous vehicles, for example, poses thorny ethical questions. Human drivers sometimes must make split-second decisions. Their reactions may be a complex combination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment. AI \"vision\" today is not nearly as sophisticated as that of humans. And to anticipate every imaginable driving situation is a difficult programming problem.","context":{"mode":"image","asset":"questions","focus":[250,1660,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"33","option":"D"},"focusId":"focus-q33-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-D-0\">\u003cblockquote>\n\u003cp>几乎没有引起公众关注\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 little public concern 说这类问题在公众层面没有多少关切，粗读时紧接的一段却出现了政府和指导原则；other governments 与前面的自动驾驶伦理问题接在一起讨论社会应对，所以把第六段整段读完，再看各方是否正在行动。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。\u003c/p>\n\u003cp>原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But that doesn&#39;t mean crucial ethical issues involving AI aren&#39;t at hand. The coming use of autonomous vehicles, for example, poses thorny ethical questions. Human drivers sometimes must make split-second decisions. Their reactions may be a complex combination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment. AI &quot;vision&quot; today is not nearly as sophisticated as that of humans. And to anticipate every imaginable driving situation is a difficult programming problem.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. causes little public concern","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 自动驾驶带来的伦理问题，其解决办法几乎没有引起公众关注。\n\nD的 little public concern 说这类问题在公众层面没有多少关切，粗读时紧接的一段却出现了政府和指导原则；other governments 与前面的自动驾驶伦理问题接在一起讨论社会应对，所以把第六段整段读完，再看各方是否正在行动。\n\n再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。\n\n这里先说大量数据作出的决定很快带来许多伦理问题，然后用具体行动接下去：新加坡的机构帮助政府制定规范，other governments和大公司建立指导原则，英国设立伦理中心，印度发布战略。D的 little public concern 则把这件事描写成很少受到公共关切。政府不是每一个公众个体，但这些国家正在建立针对伦理问题的公共规则，说明问题已进入需要公开制度回应的层面，不能概括成“几乎不受关切”。第五段的自动驾驶正是以数据和程序作决定的一个眼前例子；作者从这个例子接到多方制定规范，没有把它写成无人过问的小问题。\n\n两边的差别就在反应程度：原文说的是多个国家已经为这些问题建立规范，D却说公共关切很少，把正在发生的多方应对写成了近乎不关心。\n\n原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。","context":{"mode":"image","asset":"questions","focus":[250,1660,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"33","option":"D"},"focusId":"focus-q33-D-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-D-0\">\u003cblockquote>\n\u003cp>几乎没有引起公众关注\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstron ated as that of humans. And to anticipate every imaginable driving situation is a difficult programming problem.\u003c/p>\n\u003cp>人类的瞬间判断综合本能、经验和感官信息，AI视觉尚不及人类，预见所有驾驶情境又是困难的编程问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The ethical problems of autonomous vehicles cause little public concern.\u003c/p>\n\u003cp>自动驾驶的伦理问题几乎不引起公众关切。\u003c/p>\n\u003c/blockquote>\n\u003cp>公众关切程度需要调查或反应描述。原文的thorny评价问题棘手，接着解释技术困难，并没有统计人们是否在意。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. causes little public concern","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> The Conscience of AI: Complex But Inevitable  \n> 人工智能的良知：复杂，但不可回避\n\n把这个主旨直接代入33题题干：\n\n> 人工智能伦理复杂而不能回避，本题能据局部困难判断当前能力不足；这个主旨既不宣布永远无解，也不能证明公众好奇或关注的多少。\n\nD实际说的是：\n\n> causes little public concern  \n> 几乎没有引起公众关注\n\n原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。\n\n从全文推进看，这一处的作用是：转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,1660,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"33","option":"D"},"focusId":"focus-q33-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-D-0\">\u003cblockquote>\n\u003cp>几乎没有引起公众关注\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 little public concern 说这类问题在公众层面没有多少关切，粗读时紧接的一段却出现了政府和指导原则；other governments 与前面的自动驾驶伦理问题接在一起讨论社会应对，所以把第六段整段读完，再看各方是否正在行动。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。\u003c/p>\n\u003cp>原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩 bination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment. AI &quot;vision&quot; today is not nearly as sophisticated as that of humans. And to anticipate every imaginable driving situation is a difficult programming problem.\u003c/p>\n\u003cp>人类的瞬间判断综合本能、经验和感官信息，AI视觉尚不及人类，预见所有驾驶情境又是困难的编程问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The ethical problems of autonomous vehicles cause little public concern.\u003c/p>\n\u003cp>自动驾驶的伦理问题几乎不引起公众关切。\u003c/p>\n\u003c/blockquote>\n\u003cp>公众关切程度需要调查或反应描述。原文的thorny评价问题棘手，接着解释技术困难，并没有统计人们是否在意。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>人工智能伦理复杂而不能回避，本题能据局部困难判断当前能力不足；这个主旨既不宣布永远无解，也不能证明公众好奇或关注的多少。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>causes little public concern\u003cbr>几乎没有引起公众关注\u003c/p>\n\u003c/blockquote>\n\u003cp>原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"33题结论","level":2,"raw":"### 33题结论\n\n> **33. C. is still beyond our capacity**\n\nA：原文的 today 在讲人工智能今天的状态，后一句把处理各种驾驶情况说成 difficult programming problem，承认它很难。\n\nB：curiosity是好奇心，has aroused much curiosity说解决办法已经引起大量好奇。\n\nC：capacity是能力，still beyond our capacity表示仍超出目前能力。\n\nD：再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。","context":{"mode":"image","asset":"questions","focus":[250,1299,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"question":"33","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>33. C. is still beyond our capacity\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文的 today 在讲人工智能今天的状态，后一句把处理各种驾驶情况说成 difficult programming problem，承认它很难。\u003c/p>\n\u003cp>B：curiosity是好奇心，has aroused much curiosity说解决办法已经引起大量好奇。\u003c/p>\n\u003cp>C：capacity是能力，still beyond our capacity表示仍超出目前能力。\u003c/p>\n\u003cp>D：再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"34题 · 题干、题型与核心出处","level":2,"raw":"## 34题\n\n> The author’s attitude toward Google’s pledges is one of ______.  \n> 作者对谷歌的承诺持什么态度？\n\n### 题型\n\n作者态度题。题干要求判断“作者对谷歌的承诺持什么态度？”，先按第7、8段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> On June 7 Google pledged not to \"design or deploy AI\" that would cause \"overall harm,\" or to develop AI-directed weapons or use AI for surveillance that would violate international norms. It also pledged not to deploy AI whose use would violate international laws or human rights.\n>\n> While the statement is vague, it represents one starting point. So does the idea that decisions made by AI systems should be explainable, transparent, and fair.\n\n第7段列避免整体伤害、违法和侵犯人权的承诺；第8段虽承认声明含糊，主句仍把它视为一个起点。","context":{"mode":"image","asset":"questions","focus":[250,1826,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"question":"34","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The author’s attitude toward Google’s pledges is one of ______.\u003cbr>作者对谷歌的承诺持什么态度？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>作者态度题。题干要求判断“作者对谷歌的承诺持什么态度？”，先按第7、8段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>On June 7 Google pledged not to &quot;design or deploy AI&quot; that would cause &quot;overall harm,&quot; or to develop AI-directed weapons or use AI for surveillance that would violate international norms. It also pledged not to deploy AI whose use would violate international laws or human rights.\u003c/p>\n\u003cp>While the statement is vague, it represents one starting point. So does the idea that decisions made by AI systems should be explainable, transparent, and fair.\u003c/p>\n\u003c/blockquote>\n\u003cp>第7段列避免整体伤害、违法和侵犯人权的承诺；第8段虽承认声明含糊，主句仍把它视为一个起点。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. contempt","level":3,"raw":"### A. contempt\n\n> 蔑视\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 contempt 是认为不值得一提，第八段 one starting point 则是作者对声明价值的直接说法，因此回看第八段第一句，看作者在承认含糊之后给了什么评价。\n\n**错误类型：第一类——歪曲原意。**\n\n作者并未忽略声明的不足，先写 vague，说它含糊；但让步的后半句仍给出 one starting point，承认它可以作为一个开始。A的 contempt 要把这种声明当作没有价值、值得轻视的东西，与“承认它是一个起点”相反。不能只看vague就把后半句删掉：作者保留的正是这一步即使不完善，仍有起步意义。\n\none starting point给它保留了实际的起步价值，和contempt的轻视方向不同。\n\n**命题人借用的原文材料：**\n\n> While the statement is vague, it represents one starting point.","context":{"mode":"image","asset":"questions","focus":[250,1923,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"A"},"focusId":"focus-q34-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-A-0\">\u003cblockquote>\n\u003cp>蔑视\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 contempt 是认为不值得一提，第八段 one starting point 则是作者对声明价值的直接说法，因此回看第八段第一句，看作者在承认含糊之后给了什么评价。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>作者并未忽略声明的不足，先写 vague，说它含糊；但让步的后半句仍给出 one starting point，承认它可以作为一个开始。A的 contempt 要把这种声明当作没有价值、值得轻视的东西，与“承认它是一个起点”相反。不能只看vague就把后半句删掉：作者保留的正是这一步即使不完善，仍有起步意义。\u003c/p>\n\u003cp>one starting point给它保留了实际的起步价值，和contempt的轻视方向不同。\u003c/p>\n\u003cp>\u003cstrong> ism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。B的 skepticism 若要成立，评价应停在不相信承诺、怀疑其真假或作用上。这里却没有把含糊发展成不相信，反而用While先让一步，再保留起点价值。“还不够具体”与“我不相信它”表达的是不同态度，决定方向的是让步后面的明确肯定。\u003c/p>\n\u003cp>it represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. skepticism","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者对谷歌承诺的态度是怀疑。\n\nB的 skepticism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。\n\n作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。B的 skepticism 若要成立，评价应停在不相信承诺、怀疑其真假或作用上。这里却没有把含糊发展成不相信，反而用While先让一步，再保留起点价值。“还不够具体”与“我不相信它”表达的是不同态度，决定方向的是让步后面的明确肯定。\n\nit represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。","context":{"mode":"image","asset":"questions","focus":[250,2012,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"34","option":"B"},"focusId":"focus-q34-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-B-0\">\u003cblockquote>\n\u003cp>怀疑\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 skepticism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。B的 skepticism 若要成立，评价应停在不相信承诺、怀疑其真假或作用上。这里却没有把含糊发展成不相信，反而用While先让一步，再保留起点价值。“还不够具体”与“我不相信它”表达的是不同态度，决定方向的是让步后面的明确肯定。\u003c/p>\n\u003cp>it represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u ，并提出决定应可解释、公平等要求。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：B错误。**","context":{"mode":"image","asset":"questions","focus":[250,2012,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"34","option":"B"},"focusId":"focus-q34-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-B-0\">\u003cblockquote>\n\u003cp>怀疑\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 skepticism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。B的 skepticism 若要成立，评价应停在不相信承诺、怀疑其真假或作用上。这里却没有把含糊发展成不相信，反而用While先让一步，再保留起点价值。“还不够具体”与“我不相信它”表达的是不同态度，决定方向的是让步后面的明确肯定。\u003c/p>\n\u003cp>it represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者对谷歌承诺的态度是怀疑。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 skepticism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。\u003c/p>\n\u003cp>作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。B的 skepticism 若要成立，评价应停在不相信承诺、怀疑其真假或作用上。这里却没有把含糊发展成不相信，反而用While先让一步，再保留起点价值。“还不够具体”与“我不相信它”表达的是不同态度，决定方向的是让步后面的明确肯定。\u003c/p>\n\u003cp>it represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第7、8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003cp>第7段列避免整体伤害、违法和侵犯人权的承 tion","level":3,"raw":"### D. affirmation\n\n> 肯定\n\n**做题模式中的状态：** 第一轮D保留。当时的定位线索是：D的 affirmation 是对这一步给予肯定，第八段 one starting point 承认声明有起步作用，意思能够相接，因此回看作者评价声明的那句完整话。\n\n**选项类型：正确概括作者态度。**\n\n作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。D的 affirmation 不要求作者认为声明完美，也不要求他崇敬谷歌，只要求作者认可这一步的某种价值。这正符合句中的让步：表述不够清楚，但朝制定规则迈出一步仍值得承认。后一句So does又把可解释、公平等要求也放进起点之列，可见作者是在认可若干开始行动的办法，而不是把不完善当作全部否定的理由。\n\naffirmation可以是有保留的肯定；作者明确认可one starting point，并没有声称所有问题已经解决。\n\n**出处：**\n\n> While the statement is vague, it represents one starting point.","context":{"mode":"image","asset":"questions","focus":[250,2188,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"D"},"focusId":"focus-q34-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-D-0\">\u003cblockquote>\n\u003cp>肯定\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 affirmation 是对这一步给予肯定，第八段 one starting point 承认声明有起步作用，意思能够相接，因此回看作者评价声明的那句完整话。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括作者态度。\u003c/strong>\u003c/p>\n\u003cp>作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。D的 affirmation 不要求作者认为声明完美，也不要求他崇敬谷歌，只要求作者认可这一步的某种价值。这正符合句中的让步：表述不够清楚，但朝制定规则迈出一步仍值得承认。后一句So does又把可解释、公平等要求也放进起点之列，可见作者是在认可若干开始行动的办法，而不是把不完善当作全部否定的理由。\u003c/p>\n\u003cp>affirmation可以是有保留的肯定；作者明确认可one starting point，并没有声称所有问题已经解决。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. affirmation","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者对谷歌承诺的态度是肯定。\n\nD的 affirmation 是对这一步给予肯定，第八段 one starting point 承认声明有起步作用，意思能够相接，因此回看作者评价声明的那句完整话。\n\n作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。D的 affirmation 不要求作者认为声明完美，也不要求他崇敬谷歌，只要求作者认可这一步的某种价值。这正符合 的：\n\n> While the statement is vague, it represents one starting point.\n>\n> 第7段列避免整体伤害、违法和侵犯人权的承诺；第8段虽承认声明含糊，主句仍把它视为一个起点。\n\n把这一处放回全文，它承担的写作任务是：列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Although Google’s statement lacks precision, it is a useful first step.\n>\n> 虽然谷歌的声明不够具体，它仍是一个有用的第一步。\n\n让步保留不足，主句确认起步价值，与原文的while—represents结构一致。肯定不等于说承诺已经完善，也不要求删掉vague。","context":{"mode":"image","asset":"questions","focus":[250,2188,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"34","option":"D"},"focusId":"focus-q34-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-D-0\">\u003cblockquote>\n\u003cp>肯定\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 affirmation 是对这一步给予肯定，第八段 one starting point 承认声明有起步作用，意思能够相接，因此回看作者评价声明的那句完整话。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括作者态度。\u003c/strong>\u003c/p>\n\u003cp>作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。D的 affirmation 不要求作者认为声明完美，也不要求他崇敬谷歌，只要求作者认可这一步的某种价值。这正符合句中的让步：表述不够清楚，但朝制定规则迈出一步仍值得承认。后一句So does又把可解释、公平等要求也放进起点之列，可见作者是在认可若干开始行动的办法，而不是把不完善当作全部否定的理由。\u003c/p>\n\u003cp>affirmation可以是有保留的肯定；作者明确认可one starting point，并没有声称所有问题已经解决。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者对谷歌承诺的态度是肯定。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 affirmation 是对这一步给予肯定，第八段 one starting point 承认声明有起步作用，意思能够相接，因此回看作者评价声明的那句完整话。\u003c/p>\n\u003cp>作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。D的 affirmation 不要求作者认为声明完美，也不要求他崇敬谷歌，只要求作者认可这一步的某种价值。这正符合句中的让步：
