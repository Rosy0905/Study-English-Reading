此回看作者评价声明的那句完整话。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括作者态度。\u003c/strong>\u003c/p>\n\u003cp>作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。D的 affirmation 不要求作者认为声明完美，也不要求他崇敬谷歌，只要求作者认可这一步的某种价值。这正符合句中的让步：表述不够清楚，但朝制定规则迈出一步仍值得承认。后一句So does又把可解释、公平等要求也放进起点之列，可见作者是在认可若干开始行动的办法，而不是把不完善当作全部否定的理由。\u003c/p>\n\u003cp>affirmation可以是有保留的肯定；作者明确认可one starting point，并没有声称所有问题已经解决。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者对谷歌承诺的态度是肯定。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 affirmation 是对这一步给予肯定，第八段 one starting point 承认声明有起步作用，意思能够相接，因此回看作者评价声明的那句完整话。\u003c/p>\n\u003cp>作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。D的 affirmation 不要求作者认为声明完美，也不要求他崇敬谷歌，只要求作者认可这一步的某种价值。这正符合句中的让步：表述不够清楚，但朝制定规则迈出一步仍值得承认。后一句So does又把可解释、公平等要求也放进起点之列，可见作者是在认可若干开始行动的办法，而不是把不完善当作全部否定的理由。\u003c/p>\n\u003cp>affirmation可以是有保留的肯定；作者明确认可one starting point，并没有声称所有问题已经解决。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第7、8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003cp>第7段列避免整体伤害、违法和侵犯人权的承诺；第8段虽承认声明含糊，主句仍把它视为一个起点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Although Google’s statement lacks precision, it is a useful first step.\u003c/p>\n\u003cp>虽然谷歌的声明不够具体，它仍是一个有用的第一步。\u003c/p>\n\u003c/blockquote>\n\u003cp>让步保留不足，主句确认起步价值，与原文的while—represents结构一致。肯定不等于说承诺已经完善，也不要求删掉vague。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文支持从现在开始给AI施加伦理要求，对初步承诺应肯定其起步意义，同时保留尚不完善的限制；局部转折决定具体态度词。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>affirmation\u003cbr>肯定\u003c/p>\n\u003c/blockquote>\n\u003cp>affirmation可以是有保留的肯定；作者明确认可one starting point，并没有声称所有问题已经解决。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"34题结论","level":2,"raw":"### 34题结论\n\n> **34. D. affirmation**\n\nA：作者并未忽略声明的不足，先写 vague，说它含糊；但让步的后半句仍给出 one starting point，承认它可以作为一个开始。\n\nB：作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。\n\nC：这句话既说vague，又只把声明称为one starting point：它不够清楚，不过可以作为许多起步办法中的一个。\n\nD：作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。","context":{"mode":"image","asset":"questions","focus":[250,1826,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 3题目"},"meta":{"question":"34","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>34. D. affirmation\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：作者并未忽略声明的不足，先写 vague，说它含糊；但让步的后半句仍给出 one starting point，承认它可以作为一个开始。\u003c/p>\n\u003cp>B：作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。\u003c/p>\n\u003cp>C：这句话既说vague，又只把声明称为one starting point：它不够清楚，不过可以作为许多起步办法中的一个。\u003c/p>\n\u003cp>D：作者先承认vague，再说one starting point，保留下来的判断说的是“这可以是一个开始”。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：历史视角引入AI伦理问题**（段落1-2引言） 《弗兰肯斯坦》200年前预示了技术伦理问题 → 今天AI快速发展提出根本性问题：（什么是智能、身份、意识？什么使人类成为人类？）\n\n↓（技术现状与挑战）\n\n**逻辑层次2：AI技术的现状与人类认知的局限**（段落3-4技术困境） 通用人工智能仍难以实现 // 但人类着迷于类人机器人（如科幻剧中描绘）→ 专家观点：【人类思维太复杂无法理解和复制 + 缺乏解释意识的理论 + 不知如何建造有意识的机器】\n\n↓（现实问题）\n\n**逻辑层次3：AI带来的具体伦理挑战**（段落5实际问题） 关键伦理问题已经出现 → 自动驾驶案例：【人类决策的复杂性：（瞬间反应 + 经验 + 感官输入）// AI的局限：（视觉不如人类精密 + 难以预测所有情况）】\n\n↓（应对措施）\n\n**逻辑层次4：全球对AI伦理的响应**（段落6-7政策回应） 基于数据的决策引发伦理问题 → 各方行动：【新加坡：制定自愿准则 + 英国：建立数据伦理中心 + 印度：发布AI伦理战略 + 谷歌：承诺不造成伤害、不开发武器、不违反规范】\n\n↓（未来方向）\n\n**逻辑层次5：AI发展的价值导向**（段落8-9结论展望） 当前措施虽模糊但是起点 → 核心原则：（AI决策应可解释、透明、公平）→ 根本问题：如何确保智能机器反映人类最高价值观 → 目标：让AI成为有用的仆人而非失控的怪物\n\n↑（全文主旨）\n\n全文核心观点：AI的快速发展带来了复杂的伦理挑战，虽然我们还无法完全理解和复制人类意识，但必须确保AI的发展反映人类的最高价值观，使其成为有益的工具而非失控的威胁。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：历史视角引入AI伦理问题\u003c/strong>（段落1-2引言） 《弗兰肯斯坦》200年前预示了技术伦理问题 → 今天AI快速发展提出根本性问题：（什么是智能、身份、意识？什么使人类成为人类？）\u003c/p>\n\u003cp>↓（技术现状与挑战）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：AI技术的现状与人类认知的局限\u003c/strong>（段落3-4技术困境） 通用人工智能仍难以实现 // 但人类着迷于类人机器人（如科幻剧中描绘）→ 专家观点：【人类思维太复杂无法理解和复制 + 缺乏解释意识的理论 + 不知如何建造有意识的机器】\u003c/p>\n\u003cp>↓（现实问题）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：AI带来的具体伦理挑战\u003c/strong>（段落5实际问题） 关键伦理问题已经出现 → 自动驾驶案例：【人类决策的复杂性：（瞬间反应 + 经验 + 感官输入）// AI的局限：（视觉不如人类精密 + 难以预测所有情况）】\u003c/p>\n\u003cp>↓（应对措施）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：全球对AI伦理的响应\u003c/strong>（段落6-7政策回应） 基于数据的决策引发伦理问题 → 各方行动：【新加坡：制定自愿准则 + 英国：建立数据伦理中心 + 印度：发布AI伦理战略 + 谷歌：承诺不造成伤害、不开发武器、不违反规范】\u003c/p>\n\u003cp>↓（未来方向）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：AI发展的价值导向\u003c/strong>（段落8-9结论展望） 当前措施虽模糊但是起点 → 核心原则：（AI决策应可解释、透明、公平）→ 根本问题：如何确保智能机器反映人类最高价值观 → 目标：让AI成为有用的仆人而非失控的怪物\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：AI的快速发展带来了复杂的伦理挑战，虽然我们还无法完全理解和复制人类意识，但必须确保AI的发展反映人类的最高价值观，使其成为有益的工具而非失控的威胁。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n【答案】B. An Old Story with a Present Moral Question\n\n> 旧故事提出当下的道德问题\n\n这一部分借小说提出创造者责任，但明确故事不是技术预言，进而引出当下AI的伦理追问。\n\n文章从小说进入，但抓住的是创造者责任：\n\n> the creator’s achievement does not settle the question of responsibility\n\n造出来只是技术成就，不能自动回答该如何对待创造物、如何承担其社会后果。这正是开头把“成就”和“责任”分开的原因。\n\n作者又限定小说与现实的关系：\n\n> Modern artificial intelligence is not the creature in that novel, and a fictional disaster is not a prediction.\n\n小说里的灾难不是对现实AI的预言；因此这里并未用故事证明机器危险必然发生。`Nevertheless`随后说明即使不是预言，故事仍能提供思考起点。\n\n这种起点具体落实为三种追问：\n\n> We should ask what purposes they serve, who may be harmed and who remains answerable when they act.\n\n用途、受害者和责任承担者，都是当下设计和使用系统时要回答的问题。结尾再把教训归到创造者义务，而非技术预测。\n\n这一部分的推进关系是：\n\n> 小说中创造成功不等于责任解决 → 虚构情节不是现实预言 → 借故事追问用途、伤害和责任 → 把旧故事转为当下伦理起点\n\n`Old Story`对应Shelley的小说；`Present Moral Question`对应现代系统的用途、潜在伤害及责任。标题保留了“借历史提出现在的问题”，没有把故事当作科学证明。\n\n再看最强干扰项D：Solving Every Ethical Problem by Banning Robots。\n\n小说灾难可能使人联想到禁用机器，但本段明确不把虚构灾难当预言，并提出如何负责的具体问题，没有主张禁止一切机器人。用禁令概括会把责任讨论改成技术拒绝。\n\n**41题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】B. An Old Story with a Present Moral Question\u003c/p>\n\u003cblockquote>\n\u003cp>旧故事提出当下的道德问题\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分借小说提出创造者责任，但明确故事不是技术预言，进而引出当下AI的伦理追问。\u003c/p>\n\u003cp>文章从小说进入，但抓住的是创造者责任：\u003c/p>\n\u003cblockquote>\n\u003cp>the creator’s achievement does not settle the question of responsibility\u003c/p>\n\u003c/blockquote>\n\u003cp>造出来只是技术成就，不能自动回答该如何对待创造物、如何承担其社会后果。这正是开头把“成就”和“责任”分开的原因。\u003c/p>\n\u003cp>作者又限定小说与现实的关系：\u003c/p>\n\u003cblockquote>\n\u003cp>Modern artificial intelligence is not the creature in that novel, and a fictional disaster is not a prediction.\u003c/p>\n\u003c/blockquote>\n\u003cp>小说里的灾难不是对现实AI的预言；因此这里并未用故事证明机器危险必然发生。\u003ccode>Nevertheless\u003c/code>随后说明即使不是预言，故事仍能提供思考起点。\u003c/p>\n\u003cp>这种起点具体落实为三种追问：\u003c/p>\n\u003cblockquote>\n\u003cp>We should ask what purposes they serve, who may be harmed and who remains answerable when they act.\u003c/p>\n\u003c/blockquote>\n\u003cp>用途、受害者和责任承担者，都是当下设计和使用系统时要回答的问题。结尾再把教训归到创造者义务，而非技术预测。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>小说中创造成功不等于责任解决 → 虚构情节不是现实预言 → 借故事追问用途、伤害和责任 → 把旧故事转为当下伦理起点\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Old Story\u003c/code>对应Shelley的小说；\u003ccode>Present Moral Question\u003c/code>对应现代系统的用途、潜在伤害及责任。标题保留了“借历史提出现在的问题”，没有把故事当作科学证明。\u003c/p>\n\u003cp>再看最强干扰项D：Solving Every Ethical Problem by Banning Robots。\u003c/p>\n\u003cp>小说灾难可能使人联想到禁用机器，但本段明确不把虚构灾难当预言，并提出如何负责的具体问题，没有主张禁止一切机器人。用禁令概括会把责任讨论改成技术拒绝。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】F. Limited Intelligence Does Not Remove Urgent Risks\n\n> 智能有限并不消除迫切风险\n\n这一部分承认通用智能尚未实现，同时说明有限系统也已有重要影响，伦理讨论不能推迟。\n\n前半段承认能力和理论的缺口：\n\n> Researchers still lack a settled account of consciousness, and broad artificial general intelligence remains an ambition rather than an established everyday tool.\n\n意识理论尚无定论，通用AI仍是目标；人形机器人形象容易遮蔽这个距离，所以不能从外形推定已经具有人类智能。\n\n`Yet`之后转向现有系统的实际影响：\n\n> Yet a limited system can already affect access to a loan, the information a person receives or a vehicle’s response to danger.\n\n即使只能完成有限任务，系统仍影响贷款、信息接触和车辆安全。这些都是人的利益，并不要求机器先具有意识。\n\n作者把两部分压成一句关键判断：\n\n> Its narrowness does not make every consequence narrow.\n\n能力范围有限，不代表后果轻微。末句的`therefore`由此推出伦理讨论不能等到人类水平智能出现才开始。\n\n这一部分的推进关系是：\n\n> 意识与通用智能仍有距离 → 有限系统已经进入重要决策 → 能力有限不等于影响有限 → 伦理问题不能等未来再讨论\n\n`Limited Intelligence`对应`a limited system`及理论缺口；`Does Not Remove Urgent Risks`对应现有系统已影响贷款和安全、伦理讨论现在就有必要。标题中的否定关系正是全段转折。\n\n再看最强干扰项C：Proving That Machines Already Have Consciousness。\n\n意识确实是段落关键词，但原文说`lack a settled account`，不是提供机器已有意识的证明。后半段还说明无需意识达到人类水平，现实伦理风险也会存在。\n\n**42题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】F. Limited Intelligence Does Not Remove Urgent Risks\u003c/p>\n\u003cblockquote>\n\u003cp>智能有限并不消除迫切风险\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分承认通用智能尚未实现，同时说明有限系统也已有重要影响，伦理讨论不能推迟。\u003c/p>\n\u003cp>前半段承认能力和理论的缺口：\u003c/p>\n\u003cblockquote>\n\u003cp>Researchers still lack a settled account of consciousness, and broad artificial general intelligence remains an ambition rather than an established everyday tool.\u003c/p>\n\u003c/blockquote>\n\u003cp>意识理论尚无定论，通用AI仍是目标；人形机器人形象容易遮蔽这个距离，所以不能从外形推定已经具有人类智能。\u003c/p>\n\u003cp>\u003ccode>Yet\u003c/code>之后转向现有系统的实际影响：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet a limited system can already affect access to a loan, the information a person receives or a vehicle’s response to danger.\u003c/p>\n\u003c/blockquote>\n\u003cp>即使只能完成有限任务，系统仍影响贷款、信息接触和车辆安全。这些都是人的利益，并不要求机器先具有意识。\u003c/p>\n\u003cp>作者把两部分压成一句关键判断：\u003c/p>\n\u003cblockquote>\n\u003cp>Its narrowness does not make every consequence narrow.\u003c/p>\n\u003c/blockquote>\n\u003cp>能力范围有限，不代表后果轻微。末句的\u003ccode>therefore\u003c/code>由此推出伦理讨论不能等到人类水平智能出现才开始。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>意识与通用智能仍有距离 → 有限系统已经进入重要决策 → 能力有限不等于影响有限 → 伦理问题不能等未来再讨论\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Limited Intelligence\u003c/code>对应\u003ccode>a limited system\u003c/code>及理论缺口；\u003ccode>Does Not Remove Urgent Risks\u003c/code>对应现有系统已影响贷款和安全、伦理讨论现在就有必要。标题中的否定关系正是全段转折。\u003c/p>\n\u003cp>再看最强干扰项C：Proving That Machines Already Have Consciousness。\u003c/p>\n\u003cp>意识确实是段落关键词，但原文说\u003ccode>lack a settled account\u003c/code>，不是提供机器已有意识的证明。后半段还说明无需意识达到人类水平，现实伦理风险也会存在。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n【答案】A. Turning a Driver’s Judgement into Machine Decisions\n\n> 把驾驶者的判断转化为机器决策\n\n这一部分以自动驾驶解释把人类判断交给机器时，技术可靠性和后果责任为何同时出现。\n\n本段用驾驶把上段的迫切性变具体：\n\n> A human driver combines perception, experience and rapid judgement when the road suddenly changes.\n\n人类面对路况变化，把感知、经验和即时判断结合起来；下一句才问机器如何检测情况并决定动作，形成两种决策方式的对照。\n\n作者接着说明识别一张清楚图片为什么还不够：\n\n> Rain, an unexpected movement or an unusual road layout can change the situation in which the system must act.\n\n雨天、突然移动和特殊道路改变机器真正要行动的条件，不能把静态识别成绩等同于复杂路况下的可靠驾驶。\n\n结尾同时保留技术和责任两条线：\n\n> Designers must consider how it responds when information is incomplete and who can explain a failure afterwards.\n\n一方面要处理信息不完整时的反应，另一方面要解释事故发生后的责任。驾驶例子把“如何行动”与“谁解释后果”连在一起。\n\n这一部分的推进关系是：\n\n> 人类驾驶依靠多种判断能力 → 机器必须检测并决定动作 → 复杂场景超出静态识别 → 设计者同时面对反应可靠性和事后责任\n\n`a Driver’s Judgement`对应感知、经验与快速判断；`Turning...into Machine Decisions`对应机器检测和行动规则，以及末句的`Translating everyday driving into machine action`。\n\n再看最强干扰项F：Limited Intelligence Does Not Remove Urgent Risks。\n\n智能局限与风险是本段的背景，但正确标题进一步抓住独有的驾驶任务与人机决策转换。干扰标题不能解释为什么全文集中比较人类反应、图片识别和实际路况，概括停留在上段的总判断。\n\n**43题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】A. Turning a Driver’s Judgement into Machine Decisions\u003c/p>\n\u003cblockquote>\n\u003cp>把驾驶者的判断转化为机器决策\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分以自动驾驶解释把人类判断交给机器时，技术可靠性和后果责任为何同时出现。\u003c/p>\n\u003cp>本段用驾驶把上段的迫切性变具体：\u003c/p>\n\u003cblockquote>\n\u003cp>A human driver combines perception, experience and rapid judgement when the road suddenly changes.\u003c/p>\n\u003c/blockquote>\n\u003cp>人类面对路况变化，把感知、经验和即时判断结合起来；下一句才问机器如何检测情况并决定动作，形成两种决策方式的对照。\u003c/p>\n\u003cp>作者接着说明识别一张清楚图片为什么还不够：\u003c/p>\n\u003cblockquote>\n\u003cp>Rain, an unexpected movement or an unusual road layout can change the situation in which the system must act.\u003c/p>\n\u003c/blockquote>\n\u003cp>雨天、突然移动和特殊道路改变机器真正要行动的条件，不能把静态识别成绩等同于复杂路况下的可靠驾驶。\u003c/p>\n\u003cp>结尾同时保留技术和责任两条线：\u003c/p>\n\u003cblockquote>\n\u003cp>Designers must consider how it responds when information is incomplete and who can explain a failure afterwards.\u003c/p>\n\u003c/blockquote>\n\u003cp>一方面要处理信息不完整时的反应，另一方面要解释事故发生后的责任。驾驶例子把“如何行动”与“谁解释后果”连在一起。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>人类驾驶依靠多种判断能力 → 机器必须检测并决定动作 → 复杂场景超出静态识别 → 设计者同时面对反应可靠性和事后责任\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>a Driver’s Judgement\u003c/code>对应感知、经验与快速判断；\u003ccode>Turning...into Machine Decisions\u003c/code>对应机器检测和行动规则，以及末句的\u003ccode>Translating everyday driving into machine action\u003c/code>。\u003c/p>\n\u003cp>再看最强干扰项F：Limited Intelligence Does Not Remove Urgent Risks。\u003c/p>\n\u003cp>智能局限与风险是本段的背景，但正确标题进一步抓住独有的驾驶任务与人机决策转换。干扰标题不能解释为什么全文集中比较人类反应、图片识别和实际路况，概括停留在上段的总判断。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】E. From Isolated Concerns to Shared Principles\n\n> 从分散的担忧走向共同原则\n\n这一部分将个体设计责任扩展为多方参与的共同原则，使受影响者能一起质询系统。\n\n首句把责任范围从一个设计者扩大出去：\n\n> Such responsibilities extend beyond a single vehicle designer.\n\n后面加入处理个人数据和影响公共决策的系统，受影响者利益也未必一致，因此单个组织自说自话不足以处理这些问题。\n\n制度回应由多类主体共同展开：\n\n> Governments, professional bodies and technology companies have therefore begun to discuss common ethical principles.\n\n政府、专业组织和公司不是同一类参与者；公平、权利和解释能力是它们反复讨论的共同内容。公司禁用有害用途的承诺只是其中一部分。\n\n最后解释“共同”带来的作用：\n\n> Shared principles provide a language in which developers, users and affected citizens can question a system together, rather than leaving each organisation to define responsibility entirely for itself.\n\n共同原则使开发者、使用者和受影响公众能一起质询系统，替代每个组织单独定义责任的状态。重心是形成可共同讨论的标准。\n\n这一部分的推进关系是：\n\n> 责任超出单一设计者 → 多群体利益受影响 → 政府、专业组织和公司讨论原则 → 形成共同质询系统的标准语言\n\n`Isolated Concerns`对应单一设计者和各组织自行定义责任；`Shared Principles`对应多方讨论公平、权利及解释要求。`From...to...`概括本段从个别问题到共同规范的扩展。\n\n再看最强干扰项G：Making Ethical Promises Open to Examination。\n\n公司承诺出现，但本段主要回答谁参与、共同原则起什么作用，还未说明如何审查履行、提供证据或纠正决定。接受检验是原则之后的落实问题，不能取代这里的规范形成。\n\n**44题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】E. From Isolated Concerns to Shared Principles\u003c/p>\n\u003cblockquote>\n\u003cp>从分散的担忧走向共同原则\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分将个体设计责任扩展为多方参与的共同原则，使受影响者能一起质询系统。\u003c/p>\n\u003cp>首句把责任范围从一个设计者扩大出去：\u003c/p>\n\u003cblockquote>\n\u003cp>Such responsibilities extend beyond a single vehicle designer.\u003c/p>\n\u003c/blockquote>\n\u003cp>后面加入处理个人数据和影响公共决策的系统，受影响者利益也未必一致，因此单个组织自说自话不足以处理这些问题。\u003c/p>\n\u003cp>制度回应由多类主体共同展开：\u003c/p>\n\u003cblockquote>\n\u003cp>Governments, professional bodies and technology companies have therefore begun to discuss common ethical principles.\u003c/p>\n\u003c/blockquote>\n\u003cp>政府、专业组织和公司不是同一类参与者；公平、权利和解释能力是它们反复讨论的共同内容。公司禁用有害用途的承诺只是其中一部分。\u003c/p>\n\u003cp>最后解释“共同”带来的作用：\u003c/p>\n\u003cblockquote>\n\u003cp>Shared principles provide a language in which developers, users and affected citizens can question a system together, rather than leaving each organisation to define responsibility entirely for itself.\u003c/p>\n\u003c/blockquote>\n\u003cp>共同原则使开发者、使用者和受影响公众能一起质询系统，替代每个组织单独定义责任的状态。重心是形成可共同讨论的标准。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>责任超出单一设计者 → 多群体利益受影响 → 政府、专业组织和公司讨论原则 → 形成共同质询系统的标准语言\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Isolated Concerns\u003c/code>对应单一设计者和各组织自行定义责任；\u003ccode>Shared Principles\u003c/code>对应多方讨论公平、权利及解释要求。\u003ccode>From...to...\u003c/code>概括本段从个别问题到共同规范的扩展。\u003c/p>\n\u003cp>再看最强干扰项G：Making Ethical Promises Open to Examination。\u003c/p>\n\u003cp>公司承诺出现，但本段主要回答谁参与、共同原则起什么作用，还未说明如何审查履行、提供证据或纠正决定。接受检验是原则之后的落实问题，不能取代这里的规范形成。\u003c/p>\n\u003cp>\u003cstrong>44题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】G. Making Ethical Promises Open to Examination\n\n> 让伦理承诺接受检验\n\n这一部分要求用错误检查、解释与纠正渠道检验伦理承诺，使原则超出宣传口号。\n\n开头为共同原则增加可检验的要求：\n\n> Common principles become valuable only when people can examine how they are applied.\n\n讨论了原则还不够，必须让人能检查它们怎样用于实际系统。`only when`把“有用”与“能检验”联系起来。\n\n公平与透明的两个例子揭示口号缺什么：\n\n> Calling a system fair does not reveal which groups bear its errors; promising transparency does not tell an affected person how to challenge a decision.\n\n宣称公平没有说明错误落在哪些群体身上，宣称透明没有提供申诉办法；后面对应提出解释选择、调查伤害和纠正渠道。\n\n末句明确检验对象：\n\n> so that declarations about rights and fairness can be tested against what a system actually does\n\n把权利、公平宣言与系统实际行为对照，才使承诺超出广告。目标是技术继续受人的判断和公众审视，而非制造绝对完美的机器道德家。\n\n这一部分的推进关系是：\n\n> 原则需要落实检验 → 公平和透明口号尚缺证据及申诉办法 → 解释、调查和纠正使承诺可追问 → 用实际行为检验伦理宣言\n\n`Ethical Promises`对应公平、透明、权利宣言；`Open to Examination`对应`examine`、`public scrutiny`和`tested against`。标题概括从声称合乎伦理到允许公众核查的变化。\n\n再看最强干扰项E：From Isolated Concerns to Shared Principles。\n\n共同原则是本段起点，段落已经转入如何检验应用。若只写形成共同原则，会遗漏错误分布、质疑渠道、调查纠正等所有新内容，也无法解释作者为何把承诺与广告区别开。\n\n**45题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】G. Making Ethical Promises Open to Examination\u003c/p>\n\u003cblockquote>\n\u003cp>让伦理承诺接受检验\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分要求用错误检查、解释与纠正渠道检验伦理承诺，使原则超出宣传口号。\u003c/p>\n\u003cp>开头为共同原则增加可检验的要求：\u003c/p>\n\u003cblockquote>\n\u003cp>Common principles become valuable only when people can examine how they are applied.\u003c/p>\n\u003c/blockquote>\n\u003cp>讨论了原则还不够，必须让人能检查它们怎样用于实际系统。\u003ccode>only when\u003c/code>把“有用”与“能检验”联系起来。\u003c/p>\n\u003cp>公平与透明的两个例子揭示口号缺什么：\u003c/p>\n\u003cblockquote>\n\u003cp>Calling a system fair does not reveal which groups bear its errors; promising transparency does not tell an affected person how to challenge a decision.\u003c/p>\n\u003c/blockquote>\n\u003cp>宣称公平没有说明错误落在哪些群体身上，宣称透明没有提供申诉办法；后面对应提出解释选择、调查伤害和纠正渠道。\u003c/p>\n\u003cp>末句明确检验对象：\u003c/p>\n\u003cblockquote>\n\u003cp>so that declarations about rights and fairness can be tested against what a system actually does\u003c/p>\n\u003c/blockquote>\n\u003cp>把权利、公平宣言与系统实际行为对照，才使承诺超出广告。目标是技术继续受人的判断和公众审视，而非制造绝对完美的机器道德家。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>原则需要落实检验 → 公平和透明口号尚缺证据及申诉办法 → 解释、调查和纠正使承诺可追问 → 用实际行为检验伦理宣言\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Ethical Promises\u003c/code>对应公平、透明、权利宣言；\u003ccode>Open to Examination\u003c/code>对应\u003ccode>examine\u003c/code>、\u003ccode>public scrutiny\u003c/code>和\u003ccode>tested against\u003c/code>。标题概括从声称合乎伦理到允许公众核查的变化。\u003c/p>\n\u003cp>再看最强干扰项E：From Isolated Concerns to Shared Principles。\u003c/p>\n\u003cp>共同原则是本段起点，段落已经转入如何检验应用。若只写形成共同原则，会遗漏错误分布、质疑渠道、调查纠正等所有新内容，也无法解释作者为何把承诺与广告区别开。\u003c/p>\n\u003cp>\u003cstrong>45题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 借旧小说提出创造者责任，并引向现实AI |\n| B | 承认通用智能和意识的局限，但反对推迟伦理讨论 |\n| C | 在检查之外加入纠正和干预，避免只有解释而无救济 |\n| D | 指出有限系统已有现实影响，并引入自动驾驶例子 |\n| E | 展开车辆在不确定条件下的行动，连接技术与责任 |\n| F | 从个体设计扩展到多方伦理原则，指出口头一致尚不足 |\n| G | 把公平透明承诺转为错误检查与质疑程序 |\n| H | 以人的干预能力回扣创造者责任并总结全文 |\n\n全文推进：\n\n> 借旧小说提出创造者责任，并引向现实AI → 承认通用智能和意识的局限，但反对推迟伦理讨论 → 指出有限系统已有现实影响，并引入自动驾驶例子 → 展开车辆在不确定条件下的行动，连接技术与责任 → 从个体设计扩展到多方伦理原则，指出口头一致尚不足 → 把公平透明承诺转为错误检查与质疑程序 → 在检查之外加入纠正和干预，避免只有解释而无救济 → 以人的干预能力回扣创造者责任并总结全文\n\n完整顺序：\n\n**A → B → D → E → F → G → C → H**\n\n41—45：B、D、F、G、C。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>借旧小说提出创造者责任，并引向现实AI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>承认通用智能和意识的局限，但反对推迟伦理讨论\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>在检查之外加入纠正和干预，避免只有解释而无救济\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>指出有限系统已有现实影响，并引入自动驾驶例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>展开车辆在不确定条件下的行动，连接技术与责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>从个体设计扩展到多方伦理原则，指出口头一致尚不足\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>把公平透明承诺转为错误检查与质疑程序\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以人的干预能力回扣创造者责任并总结全文\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>借旧小说提出创造者责任，并引向现实AI → 承认通用智能和意识的局限，但反对推迟伦理讨论 → 指出有限系统已有现实影响，并引入自动驾驶例子 → 展开车辆在不确定条件下的行动，连接技术与责任 → 从个体设计扩展到多方伦理原则，指出口头一致尚不足 → 把公平透明承诺转为错误检查与质疑程序 → 在检查之外加入纠正和干预，避免只有解释而无救济 → 以人的干预能力回扣创造者责任并总结全文\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → B → D → E → F → G → C → H\u003c/strong>\u003c/p>\n\u003cp>41—45：B、D、F、G、C。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → B → D的关系。\n\n先看前段A的结尾：\n\n> Artificial intelligence now gives that old question a new setting.\n\n再看候选B的开头：\n\n> In this new setting, machines need not resemble fictional human beings.\n\nA结尾说AI给旧责任问题提供`a new setting`。本段首句`In this new setting`逐字回指这个现实AI场景，随后才说明它与小说人形创造物不同，不能把小说形象直接当作技术进展。\n\n通用智能与意识仍困难，先建立能力有限的事实；`Acknowledging them, however`承认这些限制，却转而否定据此推迟伦理讨论。这个转折把技术进度与讨论时机分开。\n\nB段最终落在：\n\n> Acknowledging them, however, must not become a reason for postponing ethical discussion.\n\n后段D的开头是：\n\n> Postponement would overlook systems already making consequential choices with limited abilities.\n\n后段首词`Postponement`接本段的`postponing ethical discussion`，再说明推迟会忽略什么：现有有限系统已经产生重要后果。因此“不可推迟”之后紧跟现实理由。\n\n这三段的局部推进是：\n\n> 借旧小说提出创造者责任，并引向现实AI → 承认通用智能和意识的局限，但反对推迟伦理讨论 → 指出有限系统已有现实影响，并引入自动驾驶例子\n\n再检验容易混淆的候选F。它的开头是：\n\n> Responsibility of this kind cannot be left to individual designers alone.\n\n共同原则段也讨论AI伦理，但开头`Responsibility of this kind`要求前面已展示某种具体行动责任。A只有一般性创造者问题，尚无驾驶等场景，不能直接进入“这类责任”的制度扩展。\n\n**41题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → B → D的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Artificial intelligence now gives that old question a new setting.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>In this new setting, machines need not resemble fictional human beings.\u003c/p>\n\u003c/blockquote>\n\u003cp>A结尾说AI给旧责任问题提供\u003ccode>a new setting\u003c/code>。本段首句\u003ccode>In this new setting\u003c/code>逐字回指这个现实AI场景，随后才说明它与小说人形创造物不同，不能把小说形象直接当作技术进展。\u003c/p>\n\u003cp>通用智能与意识仍困难，先建立能力有限的事实；\u003ccode>Acknowledging them, however\u003c/code>承认这些限制，却转而否定据此推迟伦理讨论。这个转折把技术进度与讨论时机分开。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Acknowledging them, however, must not become a reason for postponing ethical discussion.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Postponement would overlook systems already making consequential choices with limited abilities.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段首词\u003ccode>Postponement\u003c/code>接本段的\u003ccode>postponing ethical discussion\u003c/code>，再说明推迟会忽略什么：现有有限系统已经产生重要后果。因此“不可推迟”之后紧跟现实理由。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>借旧小说提出创造者责任，并引向现实AI → 承认通用智能和意识的局限，但反对推迟伦理讨论 → 指出有限系统已有现实影响，并引入自动驾驶例子\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Responsibility of this kind cannot be left to individual designers alone.\u003c/p>\n\u003c/blockquote>\n\u003cp>共同原则段也讨论AI伦理，但开头\u003ccode>Responsibility of this kind\u003c/code>要求前面已展示某种具体行动责任。A只有一般性创造者问题，尚无驾驶等场景，不能直接进入“这类责任”的制度扩展。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成B → D → E的关系。\n\n先看前段B的结尾：\n\n> Acknowledging them, however, must not become a reason for postponing ethical discussion.\n\n再看候选D的开头：\n\n> Postponement would overlook systems already making consequential choices with limited abilities.\n\n前段末句不允许用能力限制为`postponing ethical discussion`辩护。本段用`Postponement would overlook...`作反向论证：若推迟，就忽略现有系统对信息和服务获得的影响。\n\n`No human-like mind is required`回答前段通用智能与意识仍未解决的疑问：没有人类头脑也能影响利益。最后用`An automated vehicle`首次引入车辆，将影响具体化为人身安全。\n\nD段最终落在：\n\n> An automated vehicle offers an especially direct example because a machine’s response may immediately affect someone’s physical safety.\n\n后段E的开头是：\n\n> In that vehicle, recognising the road is only part of the task.\n\n已知E以`In that vehicle`开头，`that vehicle`只能承接本段刚引入的自动驾驶车辆；它进一步解释检测道路与在不确定条件下行动的区别，完成“引例 → 展开例子”。\n\n这三段的局部推进是：\n\n> 承认通用智能和意识的局限，但反对推迟伦理讨论 → 指出有限系统已有现实影响，并引入自动驾驶例子 → 展开车辆在不确定条件下的行动，连接技术与责任\n\n再检验容易混淆的候选B。它的开头是：\n\n> In this new setting, machines need not resemble fictional human beings.\n\n能力限制段虽然可提供技术背景，却没有引入任何具体车辆。若放到E前，E的`that vehicle`没有先行对象，而且`In this new setting`应当靠近A首次引入AI场景的位置。\n\n**42题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成B → D → E的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Acknowledging them, however, must not become a reason for postponing ethical discussion.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Postponement would overlook systems already making consequential choices with limited abilities.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末句不允许用能力限制为\u003ccode>postponing ethical discussion\u003c/code>辩护。本段用\u003ccode>Postponement would overlook...\u003c/code>作反向论证：若推迟，就忽略现有系统对信息和服务获得的影响。\u003c/p>\n\u003cp>\u003ccode>No human-like mind is required\u003c/code>回答前段通用智能与意识仍未解决的疑问：没有人类头脑也能影响利益。最后用\u003ccode>An automated vehicle\u003c/code>首次引入车辆，将影响具体化为人身安全。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>An automated vehicle offers an especially direct example because a machine’s response may immediately affect someone’s physical safety.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>In that vehicle, recognising the road is only part of the task.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知E以\u003ccode>In that vehicle\u003c/code>开头，\u003ccode>that vehicle\u003c/code>只能承接本段刚引入的自动驾驶车辆；它进一步解释检测道路与在不确定条件下行动的区别，完成“引例 → 展开例子”。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>承认通用智能和意识的局限，但反对推迟伦理讨论 → 指出有限系统已有现实影响，并引入自动驾驶例子 → 展开车辆在不确定条件下的行动，连接技术与责任\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>In this new setting, machines need not resemble fictional human beings.\u003c/p>\n\u003c/blockquote>\n\u003cp>能力限制段虽然可提供技术背景，却没有引入任何具体车辆。若放到E前，E的\u003ccode>that vehicle\u003c/code>没有先行对象，而且\u003ccode>In this new setting\u003c/code>应当靠近A首次引入AI场景的位置。\u003c/p>\n\u003cp>\u003cstrong>42题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → F → G的关系。\n\n先看前段E的结尾：\n\n> This example links technical performance with responsibility for the consequences of action.\n\n再看候选F的开头：\n\n> Responsibility of this kind cannot be left to individual designers alone.\n\nE以`responsibility for the consequences of action`收束驾驶例子。本段的`Responsibility of this kind`指车辆作出行动并带来后果的责任，再用`cannot be left to individual designers alone`将承担者从设计者扩大出去。\n\n政府、专业组织和公司提出公平、权利、可解释等共同原则，但末句`though`指出仅就用词达成一致，不等于实际系统兑现承诺。这个保留专门为下一步落实问题铺路。\n\nF段最终落在：\n\n> A shared vocabulary is emerging, though agreement on the words does not establish that systems meet the promises.\n\n后段G的开头是：\n\n> Meeting those promises requires evidence about actual operation.\n\n后段`Meeting those promises requires evidence about actual operation`中`those promises`回指本段列举的公平等原则，`actual operation`正好与`agreement on the words`对照：从说什么转到实际做什么。\n\n这三段的局部推进是：\n\n> 展开车辆在不确定条件下的行动，连接技术与责任 → 从个体设计扩展到多方伦理原则，指出口头一致尚不足 → 把公平透明承诺转为错误检查与质疑程序\n\n再检验容易混淆的候选G。它的开头是：\n\n> Meeting those promises requires evidence about actual operation.\n\n证据审查段看似能接车辆后果，但它一开始就使用`those promises`。E没有列出任何公平、权利、透明承诺，需要先由本段建立这些规范，才有下一段逐项检查的对象。\n\n**43题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → F → G的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This example links technical performance with responsibility for the consequences of action.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Responsibility of this kind cannot be left to individual designers alone.\u003c/p>\n\u003c/blockquote>\n\u003cp>E以\u003ccode>responsibility for the consequences of action\u003c/code>收束驾驶例子。本段的\u003ccode>Responsibility of this kind\u003c/code>指车辆作出行动并带来后果的责任，再用\u003ccode>cannot be left to individual designers alone\u003c/code>将承担者从设计者扩大出去。\u003c/p>\n\u003cp>政府、专业组织和公司提出公平、权利、可解释等共同原则，但末句\u003ccode>though\u003c/code>指出仅就用词达成一致，不等于实际系统兑现承诺。这个保留专门为下一步落实问题铺路。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>A shared vocabulary is emerging, though agreement on the words does not establish that systems meet the promises.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Meeting those promises requires evidence about actual operation.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段\u003ccode>Meeting those promises requires evidence about actual operation\u003c/code>中\u003ccode>those promises\u003c/code>回指本段列举的公平等原则，\u003ccode>actual operation\u003c/code>正好与\u003ccode>agreement on the words\u003c/code>对照：从说什么转到实际做什么。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>展开车辆在不确定条件下的行动，连接技术与责任 → 从个体设计扩展到多方伦理原则，指出口头一致尚不足 → 把公平透明承诺转为错误检查与质疑程序\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Meeting those promises requires evidence about actual operation.\u003c/p>\n\u003c/blockquote>\n\u003cp>证据审查段看似能接车辆后果，但它一开始就使用\u003ccode>those promises\u003c/code>。E没有列出任何公平、权利、透明承诺，需要先由本段建立这些规范，才有下一段逐项检查的对象。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成F → G → C的关系。\n\n先看前段F的结尾：\n\n> A shared vocabulary is emerging, though agreement on the words does not establish that systems meet the promises.\n\n再看候选G的开头：\n\n> Meeting those promises requires evidence about actual operation.\n\n前段刚说文字上同意原则不等于系统`meet the promises`。本段`Meeting those promises`把这一不足接过来，以`evidence about actual operation`提出验证方式，明确转入落实而非继续罗列原则。\n\n公平承诺对应检查错误由谁承受，透明承诺对应能否质疑决定。末句把缺少这些程序的声明与真正`a check on behaviour`区分，形成两项具体要求后的归纳。\n\nG段最终落在：\n\n> Without such procedures, even a carefully written ethical statement may function mainly as reassurance rather than as a check on behaviour.\n\n后段C的开头是：\n\n> A check on behaviour also needs a way to correct it.\n\n后段首句`A check on behaviour also needs a way to correct it`重复本段结尾的检查概念，并用`also`增加纠正要求：先能看出问题，再能改正问题。\n\n这三段的局部推进是：\n\n> 从个体设计扩展到多方伦理原则，指出口头一致尚不足 → 把公平透明承诺转为错误检查与质疑程序 → 在检查之外加入纠正和干预，避免只有解释而无救济\n\n再检验容易混淆的候选C。它的开头是：\n\n> A check on behaviour also needs a way to correct it.\n\n纠正段谈补救，若直接接原则段，`A check on behaviour also`中的已有检查程序还没有介绍。公平错误检查和决策质疑必须先出现，`also`才能在这些办法之上增加纠正。\n\n**44题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成F → G → C的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A shared vocabulary is emerging, though agreement on the words does not establish that systems meet the promises.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Meeting those promises requires evidence about actual operation.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段刚说文字上同意原则不等于系统\u003ccode>meet the promises\u003c/code>。本段\u003ccode>Meeting those promises\u003c/code>把这一不足接过来，以\u003ccode>evidence about actual operation\u003c/code>提出验证方式，明确转入落实而非继续罗列原则。\u003c/p>\n\u003cp>公平承诺对应检查错误由谁承受，透明承诺对应能否质疑决定。末句把缺少这些程序的声明与真正\u003ccode>a check on behaviour\u003c/code>区分，形成两项具体要求后的归纳。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Without such procedures, even a carefully written ethical statement may function mainly as reassurance rather than as a check on behaviour.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A check on behaviour also needs a way to correct it.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段首句\u003ccode>A check on behaviour also needs a way to correct it\u003c/code>重复本段结尾的检查概念，并用\u003ccode>also\u003c/code>增加纠正要求：先能看出问题，再能改正问题。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从个体设计扩展到多方伦理原则，指出口头一致尚不足 → 把公平透明承诺转为错误检查与质疑程序 → 在检查之外加入纠正和干预，避免只有解释而无救济\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A check on behaviour also needs a way to correct it.\u003c/p>\n\u003c/blockquote>\n\u003cp>纠正段谈补救，若直接接原则段，\u003ccode>A check on behaviour also\u003c/code>中的已有检查程序还没有介绍。公平错误检查和决策质疑必须先出现，\u003ccode>also\u003c/code>才能在这些办法之上增加纠正。\u003c/p>\n\u003cp>\u003cstrong>44题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成G → C → H的关系。\n\n先看前段G的结尾：\n\n> Without such procedures, even a carefully written ethical statement may function mainly as reassurance rather than as a check on behaviour.\n\n再看候选C的开头：\n\n> A check on behaviour also needs a way to correct it.\n\n前段区分了伦理安慰话语与`a check on behaviour`；本段以同一短语起头，再说还需要`a way to correct it`。这里的`it`指系统行为，`also`说明纠正是检查之后新增的能力。\n\n调查发现伤害后，必须有人能改变系统或重新审议决定。`informed but powerless`具体说明只有解释而无救济的不足，因而本段把责任推进到干预权，而非仅仅观察。\n\nC段最终落在：\n\n> Human responsibility therefore includes the capacity to intervene, not merely to observe.\n\n后段H的开头是：\n\n> This capacity to intervene brings the argument back to the creator’s obligations.\n\nH段首`This capacity to intervene`回指本段末句`the capacity to intervene`，并把这种现实干预能力连回A的创造者义务。固定结尾既承接新增的补救要求，也回扣全文起点。\n\n这三段的局部推进是：\n\n> 把公平透明承诺转为错误检查与质疑程序 → 在检查之外加入纠正和干预，避免只有解释而无救济 → 以人的干预能力回扣创造者责任并总结全文\n\n再检验容易混淆的候选F。它的开头是：\n\n> Responsibility of this kind cannot be left to individual designers alone.\n\n共同原则段止于形成公平等词汇，不能提供H中`This capacity to intervene`指代的干预能力。放在这里会由已经讨论的检查退回原则起草，跳过“发现伤害后谁能改”的必要环节。\n\n**45题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成G → C → H的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Without such procedures, even a carefully written ethical statement may function mainly as reassurance rather than as a check on behaviour.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A check on behaviour also needs a way to correct it.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段区分了伦理安慰话语与\u003ccode>a check on behaviour\u003c/code>；本段以同一短语起头，再说还需要\u003ccode>a way to correct it\u003c/code>。这里的\u003ccode>it\u003c/code>指系统行为，\u003ccode>also\u003c/code>说明纠正是检查之后新增的能力。\u003c/p>\n\u003cp>调查发现伤害后，必须有人能改变系统或重新审议决定。\u003ccode>informed but powerless\u003c/code>具体说明只有解释而无救济的不足，因而本段把责任推进到干预权，而非仅仅观察。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Human responsibility therefore includes the capacity to intervene, not merely to observe.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>This capacity to intervene brings the argument back to the creator’s obligations.\u003c/p>\n\u003c/blockquote>\n\u003cp>H段首\u003ccode>This capacity to intervene\u003c/code>回指本段末句\u003ccode>the capacity to intervene\u003c/code>，并把这种现实干预能力连回A的创造者义务。固定结尾既承接新增的补救要求，也回扣全文起点。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>把公平透明承诺转为错误检查与质疑程序 → 在检查之外加入纠正和干预，避免只有解释而无救济 → 以人的干预能力回扣创造者责任并总结全文\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Responsibility of this kind cannot be left to individual designers alone.\u003c/p>\n\u003c/blockquote>\n\u003cp>共同原则段止于形成公平等词汇，不能提供H中\u003ccode>This capacity to intervene\u003c/code>指代的干预能力。放在这里会由已经讨论的检查退回原则起草，跳过“发现伤害后谁能改”的必要环节。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **responsible innovation** | **负责任的创新** | **经济消费类：科技发展** | **宏观主题** |\n| ethical awareness | 伦理意识 | 人生哲理类：责任感、奉献精神 | 个人主题 |\n| human values | 人类价值观 | 人生哲理类：责任感、奉献精神 | 宏观主题 |\n| **cooperation in technology governance** | **技术治理中的合作** | **人生哲理类：团结合作** | **宏观主题** |\n| transparency | 透明度 | 经济消费类：科技发展 | 宏观主题 |\n| fair decision-making | 公平决策 | 人生哲理类：批判、独立、全局思维 | 宏观主题 |\n| **a willingness to acknowledge limitations** | **承认局限的意愿** | **人生哲理类：谦虚、承认不足** | **个人主题** |\n| scientific curiosity | 科学好奇心 | 人生哲理类：好奇、求知 | 个人主题 |\n| human-centred progress | 以人为本的进步 | 社会生活类：生活质量 | 宏观主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>responsible innovation\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>负责任的创新\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>经济消费类：科技发展\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ethical awareness\u003c/td>\n\u003ctd>伦理意识\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>human values\u003c/td>\n\u003ctd>人类价值观\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>cooperation in technology governance\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>技术治理中的合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>transparency\u003c/td>\n\u003ctd>透明度\u003c/td>\n\u003ctd>经济消费类：科技发展\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fair decision-making\u003c/td>\n\u003ctd>公平决策\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>a willingness to acknowledge limitations\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>承认局限的意愿\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：谦虚、承认不足\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>scientific curiosity\u003c/td>\n\u003ctd>科学好奇心\u003c/td>\n\u003ctd>人生哲理类：好奇、求知\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>human-centred progress\u003c/td>\n\u003ctd>以人为本的进步\u003c/td>\n\u003ctd>社会生活类：生活质量\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第五鸟 · 写作积累","title":"2. 大作文第一段描述题目信息时可积累的表达","level":2,"raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画题** | **The picture raises a fundamental question about X.** | **图画提出了关于X的一个根本问题。** |\n| 图画题 | The picture shows A using X to make a difficult decision. | 图画展示A使用X作出困难决定。 |\n| 图画题 | The contrast in the picture concerns whether X serves human needs. | 图中的对比涉及X能否服务人类需要。 |\n| **图表题** | **The chart shows the rapid growth of X.** | **图表显示X的快速增长。** |\n| 图表题 | The figures indicate that the use of X continues to expand. | 数字表明X的使用持续扩大。 |\n| 图表题 | The chart records a growing number of decisions based on X. | 图表记录了越来越多依据X作出的决策。 |\n| **文本评论题** | **The text asks how we can make sure that X reflects our shared values.** | **文字询问我们怎样确保X反映共同价值。** |\n| 文本评论题 | The passage treats X as a starting point for Y. | 文章把X视为Y的起点。 |\n| 文本评论题 | The issue is complex, but that does not mean it can be ignored. | 这个问题很复杂，但这不意味着可以忽视它。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture raises a fundamental question about X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画提出了关于X的一个根本问题。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The picture shows A using X to make a difficult decision.\u003c/td>\n\u003ctd>图画展示A使用X作出困难决定。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast in the picture concerns whether X serves human needs.\u003c/td>\n\u003ctd>图中的对比涉及X能否服务人类需要。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart shows the rapid growth of X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表显示X的快速增长。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures indicate that the use of X continues to expand.\u003c/td>\n\u003ctd>数字表明X的使用持续扩大。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The chart records a growing number of decisions based on X.\u003c/td>\n\u003ctd>图表记录了越来越多依据X作出的决策。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The text asks how we can make sure that X reflects our shared values.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文字询问我们怎样确保X反映共同价值。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage treats X as a starting point for Y.\u003c/td>\n\u003ctd>文章把X视为Y的起点。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue is complex, but that does not mean it can be ignored.\u003c/td>\n\u003ctd>这个问题很复杂，但这不意味着可以忽视它。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Turning a Driver’s Judgement into Machine Decisions\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. An Old Story with a Present Moral Question\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Proving That Machines Already Have Consciousness\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. Solving Every Ethical Problem by Banning Robots\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. From Isolated Concerns to Shared Principles\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Limited Intelligence Does Not Remove Urgent Risks\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Making Ethical Promises Open to Examination\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>Mary Shelley’s story of an invented being remains powerful because the creator’s achievement does not settle the question of responsibility. Making something capable of action also raises questions about its treatment and the consequences of releasing it into society. Modern artificial intelligence is not the creature in that novel, and a fictional disaster is not a prediction. Nevertheless, the old story offers a useful starting point for examining new systems. We should ask what purposes they serve, who may be harmed and who remains answerable when they act. The enduring lesson concerns the creator’s obligations, not the accuracy of a novelist’s technical forecast.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>These questions should not wait for a machine that thinks exactly like a human. Researchers still lack a settled account of consciousness, and broad artificial general intelligence remains an ambition rather than an established everyday tool. Popular images of human-like robots can obscure that distance. Yet a limited system can already affect access to a loan, the information a person receives or a vehicle’s response to danger. Its narrowness does not make every consequence narrow. Ethical discussion is therefore needed before human-like intelligence arrives, because systems with far more modest capabilities are already being placed where their decisions matter to people.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>An automated vehicle makes that urgency concrete. A human driver combines perception, experience and rapid judgement when the road suddenly changes. A machine needs ways to detect what is happening and rules or learned responses for deciding what to do. The difficulty is not exhausted by recognising a pedestrian in a clear photograph. Rain, an unexpected movement or an unusual road layout can change the situation in which the system must act. Designers must consider how it responds when information is incomplete and who can explain a failure afterwards. Translating everyday driving into machine action therefore exposes both technical limits and questions of responsibility.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>Such responsibilities extend beyond a single vehicle designer. Systems that process personal data or influence public decisions may affect many groups whose interests do not coincide. Governments, professional bodies and technology companies have therefore begun to discuss common ethical principles. Fairness, respect for rights and the ability to explain important decisions are recurring concerns. A company’s pledge not to build technology for harmful uses can form part of this discussion, but company policy is only one part of a wider effort. Shared principles provide a language in which developers, users and affected citizens can question a system together, rather than leaving each organisation to define responsibility entirely for itself.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>Common principles become valuable only when people can examine how they are applied. Calling a system fair does not reveal which groups bear its errors; promising transparency does not tell an affected person how to challenge a decision. Organisations need to explain relevant choices, investigate harmful outcomes and provide routes for correction. Those practices cannot eliminate every disagreement, but they make ethical claims more than advertising. The objective is not to create a flawless mechanical moralist. It is to keep useful technology subject to human judgement and public scrutiny, so that declarations about rights and fairness can be tested against what a system actually does.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>Shelley’s invented creature still invites a question that technical achievement alone cannot answer: what does a creator owe to the world into which a creation is released? The story cannot predict modern engineering, but its question about responsibility remains useful. Artificial intelligence now gives that old question a new setting.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>In this new setting, machines need not resemble fictional human beings. General intelligence and consciousness remain difficult research problems, and dramatic images of robots can make progress seem more complete than it is. We should acknowledge these limits. Acknowledging them, however, must not become a reason for postponing ethical discussion.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>A check on behaviour also needs a way to correct it. When investigation reveals a harmful pattern, somebody must be able to change the system or reconsider its decisions. Explanation without the possibility of remedy can leave an affected person informed but powerless. Human responsibility therefore includes the capacity to intervene, not merely to observe.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Postponement would overlook systems already making consequential choices with limited abilities. Software can shape the information people receive or help decide whether they obtain a service. No human-like mind is required for those effects. An automated vehicle offers an especially direct example because a machine’s response may immediately affect someone’s physical safety.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>In that vehicle, recognising the road is only part of the task. The system must also respond when visibility deteriorates or another road user behaves unexpectedly. Human drivers draw on experience and judgement; designers must decide how a machine will act under uncertain conditions. This example links technical performance with responsibility for the consequences of action.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>Responsibility of this kind cannot be left to individual designers alone. Governments, professional organisations and technology companies have begun to articulate principles for the use of AI. Fairness, rights and explainable decisions recur in that discussion. A shared vocabulary is emerging, though agreement on the words does not establish that systems meet the promises.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>Meeting those promises requires evidence about actual operation. An organisation claiming fairness should ask who suffers when the system makes errors. One claiming transparency should explain how a consequential decision can be questioned. Without such procedures, even a carefully written ethical statement may function mainly as reassurance rather than as a check on behaviour.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>This capacity to intervene brings the argument back to the creator’s obligations. Useful systems should remain answerable to the people they affect, even when their operations are complex. Ethical development is neither faith in an approaching mechanical conscience nor fear of a fictional monster. It is the continuing work of keeping powerful tools subject to human responsibility.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2019英语一Text 3重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>mark\u003c/td>\n\u003ctd>v.标志；纪念\u003c/td>\n\u003ctd>exactly\u003c/td>\n\u003ctd>ad.恰好\u003c/td>\n\u003ctd>centu
