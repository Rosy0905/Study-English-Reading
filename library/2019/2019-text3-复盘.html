>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>make sure\u003c/td>\n\u003ctd>确保\u003c/td>\n\u003ctd>thinking\u003c/td>\n\u003ctd>n.思维\u003c/td>\n\u003ctd>intelligent machine\u003c/td>\n\u003ctd>智能机器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>reflect\u003c/td>\n\u003ctd>v.反映\u003c/td>\n\u003ctd>humanity\u003c/td>\n\u003ctd>n.人类\u003c/td>\n\u003ctd>value\u003c/td>\n\u003ctd>n.价值观\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>useful servant\u003c/td>\n\u003ctd>有用的帮手\u003c/td>\n\u003ctd>out-of-control monster\u003c/td>\n\u003ctd>失控的怪物\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>This year marks exactly two centuries since the publication of &quot;Frankenstein; or, The Modern Prometheus,&quot; by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>This year marks / exactly two centuries / since the publication / of &quot;Frankenstein; or, The Modern Prometheus,&quot; / by Mary Shelley.\u003c/p>\n\u003cp>Even before / the invention of the electric light bulb, / the author produced / a remarkable work / of speculative fiction / that would foreshadow / many ethical questions / to be raised / by technologies / yet to come.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>今年标志着 / 整整两个世纪 / 自出版以来 / 《弗兰肯斯坦；或，现代普罗米修斯》的，/ 玛丽·雪莱著。\u003c/p>\n\u003cp>甚至在 / 电灯泡发明之前，/ 这位作者创作了 / 一部杰出的作品 / 推测性小说的 / 它将预示 / 许多伦理问题 / 将被提出的 / 由技术 / 尚未到来的。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>今年是玛丽·雪莱的《弗兰肯斯坦；或，现代普罗米修斯》出版整整两百周年。甚至在电灯泡发明之前，这位作者就创作了这部杰出的推测性小说，预示了未来技术将引发的许多伦理问题。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Today the rapid growth of artificial intelligence (AI) raises fundamental questions: &quot;What is intelligence, identity, or consciousness? What makes humans humans?&quot;\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Today / the rapid growth / of artificial intelligence (AI) / raises fundamental questions: / &quot;What is intelligence, / identity, / or consciousness? / What makes humans / humans?&quot;\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>今天 / 快速增长 / 人工智能（AI）的 / 提出了根本性问题：/ &quot;什么是智能，/ 身份，/ 或意识？/ 什么使人类 / 成为人类？&quot;\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>今天，人工智能（AI）的快速发展提出了根本性问题：&quot;什么是智能、身份或意识？什么使人类成为人类？&quot;\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>What is being called artificial general intelligence, machines that would imitate the way humans think, continues to evade scientists. Yet humans remain fascinated by the idea of robots that would look, move, and respond like humans, similar to those recently depicted on popular sci-fi TV series such as &quot;Westworld&quot; and &quot;Humans.&quot;\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>What is being called / artificial general intelligence, / machines that would imitate / the way humans think, / continues to evade / scientists.\u003c/p>\n\u003cp>Yet humans remain fascinated / by the idea / of robots / that would look, / move, / and respond / like humans, / similar to those / recently depicted / on popular sci-fi TV series / such as &quot;Westworld&quot; and &quot;Humans.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>被称为的东西 / 通用人工智能，/ 机器将模仿 / 人类思考的方式，/ 继续躲避 / 科学家们。\u003c/p>\n\u003cp>然而人类仍然着迷 / 于这个想法 / 机器人的 / 它们会看起来，/ 移动，/ 和反应 / 像人类一样，/ 类似于那些 / 最近被描绘的 / 在流行的科幻电视剧中 / 比如《西部世界》和《人类》。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>所谓的通用人工智能——能够模仿人类思维方式的机器——仍然让科学家们难以实现。然而，人类仍然着迷于机器人能够像人类一样看、动、反应的想法，就像最近在《西部世界》和《人类》等流行科幻电视剧中描绘的那样。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University neuroscientist. &quot;We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.&quot;\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Just how people think / is still far too complex / to be understood, / let alone reproduced, / says David Eagleman, / a Stanford University neuroscientist.\u003c/p>\n\u003cp>&quot;We are just in a situation / where there are no good theories / explaining what consciousness actually is / and how you could ever / build a machine / to get there.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>人们如何思考 / 仍然太过复杂 / 无法被理解，/ 更不用说复制，/ 大卫·伊格曼说，/ 斯坦福大学神经科学家。\u003c/p>\n\u003cp>&quot;我们只是处于一种情况 / 在这种情况下没有好的理论 / 解释意识实际上是什么 / 以及你如何能够 / 建造一台机器 / 达到那里。&quot;\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>斯坦福大学神经科学家大卫·伊格曼说，人类的思维方式仍然太过复杂，无法被理解，更不用说复制了。&quot;我们现在的情况是，没有好的理论能解释意识到底是什么，以及如何建造一台能够达到这种状态的机器。&quot;\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>But that doesn&#39;t mean crucial ethical issues involving AI aren&#39;t at hand. The coming use of autonomous vehicles, for example, poses thorny ethical questions. Human drivers sometimes must make split-second decisions. Their reactions may be a complex combination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment. AI &quot;vision&quot; today is not nearly as sophisticated as that of humans. And to anticipate every imaginable driving situation is a difficult programming problem.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>But that doesn&#39;t mean / crucial ethical issues / involving AI / aren&#39;t at hand.\u003c/p>\n\u003cp>The coming use / of autonomous vehicles, / for example, / poses thorny ethical questions.\u003c/p>\n\u003cp>Human drivers / sometimes must make / split-second decisions.\u003c/p>\n\u003cp>Their reactions / may be a complex combination / of instant reflexes, / input from past driving experiences, / and what their eyes and ears / tell them / in that moment.\u003c/p>\n\u003cp>AI &quot;vision&quot; today / is not nearly as sophisticated / as that of humans.\u003c/p>\n\u003cp>And to anticipate / every imaginable driving situation / is a difficult programming problem.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>但这并不意味着 / 关键的伦理问题 / 涉及AI的 / 不在眼前。\u003c/p>\n\u003cp>即将到来的使用 / 自动驾驶车辆的，/ 例如，/ 提出了棘手的伦理问题。\u003c/p>\n\u003cp>人类司机 / 有时必须做出 / 瞬间决定。\u003c/p>\n\u003cp>他们的反应 / 可能是复杂的组合 / 即时反射的，/ 来自过去驾驶经验的输入，/ 以及他们的眼睛和耳朵 / 告诉他们的 / 在那一刻。\u003c/p>\n\u003cp>AI&quot;视觉&quot;今天 / 远不如精密 / 相比人类的。\u003c/p>\n\u003cp>而且要预测 / 每一种可想象的驾驶情况 / 是一个困难的编程问题。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>但这并不意味着涉及AI的关键伦理问题不在眼前。例如，即将到来的自动驾驶车辆的使用就提出了棘手的伦理问题。人类司机有时必须做出瞬间决定。他们的反应可能是即时反射、过去驾驶经验以及当时眼耳所见所闻的复杂组合。今天的AI&quot;视觉&quot;远不如人类精密。而且要预测每一种可想象的驾驶情况是一个困难的编程问题。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Whenever decisions are based on masses of data, &quot;you quickly get into a lot of ethical questions,&quot; notes Tan Kiat How, chief executive of a Singapore-based agency that is helping the government develop a voluntary code for the ethical use of AI. Along with Singapore, other governments and mega-corporations are beginning to establish their own guidelines. Britain is setting up a data ethics center. India released its AI ethics strategy this spring.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Whenever decisions are based / on masses of data, / &quot;you quickly get into / a lot of ethical questions,&quot; / notes Tan Kiat How, / chief executive / of a Singapore-based agency / that is helping the government / develop a voluntary code / for the ethical use of AI.\u003c/p>\n\u003cp>Along with Singapore, / other governments and mega-corporations / are beginning to establish / their own guidelines.\u003c/p>\n\u003cp>Britain is setting up / a data ethics center.\u003c/p>\n\u003cp>India released / its AI ethics strategy / this spring.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>每当决策基于 / 大量数据，/ &quot;你很快就会遇到 / 很多伦理问题，&quot; / 陈吉豪指出，/ 首席执行官 / 一个新加坡机构的 / 正在帮助政府 / 制定自愿准则 / 为AI的伦理使用。\u003c/p>\n\u003cp>与新加坡一起，/ 其他政府和大型企业 / 正开始建立 / 他们自己的指导方针。\u003c/p>\n\u003cp>英国正在建立 / 一个数据伦理中心。\u003c/p>\n\u003cp>印度发布了 / 其AI伦理战略 / 今年春天。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>&quot;每当决策基于大量数据时，你很快就会遇到很多伦理问题，&quot;陈吉豪指出，他是一个新加坡机构的首席执行官，该机构正在帮助政府制定AI伦理使用的自愿准则。与新加坡一起，其他政府和大型企业正开始建立他们自己的指导方针。英国正在建立一个数据伦理中心。印度今年春天发布了其AI伦理战略。\u003c/p>\n\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>On June 7 Google pledged not to &quot;design or deploy AI&quot; that would cause &quot;overall harm,&quot; or to develop AI-directed weapons or use AI for surveillance that would violate international norms. It also pledged not to deploy AI whose use would violate international laws or human rights.\u003c/p>\n\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>On June 7 / Google pledged / not to &quot;design or deploy AI&quot; / that would cause / &quot;overall harm,&quot; / or to develop / AI-directed weapons / or use AI / for surveillance / that would violate / international norms.\u003c/p>\n\u003cp>It also pledged / not to deploy AI / whose use would violate / international laws / or human rights.\u003c/p>\n\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>在6月7日 / 谷歌承诺 / 不&quot;设计或部署AI&quot; / 会造成 / &quot;整体伤害&quot;的，/ 或开发 / AI导向的武器 / 或使用AI / 用于监视 / 会违反 / 国际规范的。\u003c/p>\n\u003cp>它还承诺 / 不部署AI / 其使用会违反 / 国际法律 / 或人权的。\u003c/p>\n\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>6月7日，谷歌承诺不&quot;设计或部署&quot;会造成&quot;整体伤害&quot;的AI，不开发AI导向的武器，不将AI用于违反国际规范的监视。它还承诺不部署使用会违反国际法律或人权的AI。\u003c/p>\n\u003ch3>完整原文 · 第8段\u003c/h3>\n\u003cp>While the statement is vague, it represents one starting point. So does the idea that decisions made by AI systems should be explainable, transparent, and fair.\u003c/p>\n\u003ch3>意群划分 · 第8段\u003c/h3>\n\u003cp>While the statement is vague, / it represents / one starting point.\u003c/p>\n\u003cp>So does the idea / that decisions made / by AI systems / should be explainable, / transparent, / and fair.\u003c/p>\n\u003ch3>意群翻译 · 第8段\u003c/h3>\n\u003cp>虽然这个声明很模糊，/ 它代表 / 一个起点。\u003c/p>\n\u003cp>这个想法也是如此 / 即决策做出的 / 由AI系统 / 应该是可解释的，/ 透明的，/ 和公平的。\u003c/p>\n\u003ch3>标准译文 · 第8段\u003c/h3>\n\u003cp>虽然这个声明很模糊，但它代表了一个起点。AI系统做出的决策应该是可解释的、透明的和公平的，这个想法也是一个起点。\u003c/p>\n\u003ch3>完整原文 · 第9段\u003c/h3>\n\u003cp>To put it another way: How can we make sure that the thinking of intelligent machines reflects humanity&#39;s highest values? Only then will they be useful servants and not Frankenstein&#39;s out-of-control monster.\u003c/p>\n\u003ch3>意群划分 · 第9段\u003c/h3>\n\u003cp>To put it another way: / How can we make sure / that the thinking / of intelligent machines / reflects humanity&#39;s highest values?\u003c/p>\n\u003cp>Only then / will they be useful servants / and not Frankenstein&#39;s / out-of-control monster.\u003c/p>\n\u003ch3>意群翻译 · 第9段\u003c/h3>\n\u003cp>换句话说：/ 我们如何能确保 / 思维 / 智能机器的 / 反映人类最高价值观？\u003c/p>\n\u003cp>只有那时 / 它们才会是有用的仆人 / 而不是弗兰肯斯坦的 / 失控的怪物。\u003c/p>\n\u003ch3>标准译文 · 第9段\u003c/h3>\n\u003cp>换句话说：我们如何能确保智能机器的思维反映人类的最高价值观？只有这样，它们才会是有用的仆人，而不是弗兰肯斯坦的失控怪物。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>This year marks → exactly two centuries：(since the publication：(of &quot;Frankenstein; or, The Modern Prometheus,&quot;：(by Mary Shelley))).\u003c/p>\n\u003cp>Even before：(the invention of the electric light bulb) → the author produced → a remarkable work：(of speculative fiction)：(that would foreshadow → many ethical questions：(to be raised：(by technologies：(yet to come)))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Today → the rapid growth：(of artificial intelligence (AI)) → raises fundamental questions：(&quot;What is intelligence + identity + or consciousness?&quot; + &quot;What makes humans → humans?&quot;)\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>What is being called → artificial general intelligence：(machines：(that would imitate → the way：(humans think))) → continues to evade → scientists.\u003c/p>\n\u003cp>Yet humans remain fascinated：(by the idea：(of robots：(that would look + move + and respond → like humans)))：(similar to those：(recently depicted：(on popular sci-fi TV series：(such as &quot;Westworld&quot; and &quot;Humans&quot;)))).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Just how people think → is still far too complex：(to be understood) + let alone reproduced → says David Eagleman：(a Stanford University neuroscientist).\u003c/p>\n\u003cp>&quot;We are just in a situation：(where there are no good theories：(explaining what consciousness actually is + and how you could ever → build a machine：(to get there))).&quot;\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>But that doesn&#39;t mean：(crucial ethical issues：(involving AI) → aren&#39;t at hand).\u003c/p>\n\u003cp>The coming use：(of autonomous vehicles)：(for example) → poses thorny ethical questions.\u003c/p>\n\u003cp>Human drivers → sometimes must make → split-second decisions.\u003c/p>\n\u003cp>Their reactions → may be a complex combination：(of instant reflexes + input from past driving experiences + what their eyes and ears → tell them：(in that moment)).\u003c/p>\n\u003cp>AI &quot;vision&quot; today → is not nearly as sophisticated：(as that of humans).\u003c/p>\n\u003cp>And to anticipate：(every imaginable driving situation) → is a difficult programming problem.\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Whenever decisions are based：(on masses of data) → &quot;you quickly get into：(a lot of ethical questions)&quot; → notes Tan Kiat How：(chief executive：(of a Singapore-based agency：(that is helping the government → develop a voluntary code：(for the ethical use of AI)))).\u003c/p>\n\u003cp>Along with Singapore → other governments and mega-corporations → are beginning to establish：(their own guidelines).\u003c/p>\n\u003cp>Britain is setting up → a data ethics center.\u003c/p>\n\u003cp>India released → its AI ethics strategy：(this spring).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>On June 7 → Google pledged → not to &quot;design or deploy AI&quot;：(that would cause → &quot;overall harm&quot;) + or to develop：(AI-directed weapons) + or use AI：(for surveillance：(that would violate → international norms)).\u003c/p>\n\u003cp>It also pledged → not to deploy AI：(whose use would violate → international laws + or human rights).\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>While the statement is vague // it represents → one starting point.\u003c/p>\n\u003cp>So does the idea：(that decisions made：(by AI systems) → should be explainable + transparent + and fair).\u003c/p>\n\u003ch3>第9段\u003c/h3>\n\u003cp>To put it another way：How can we make sure：(that the thinking：(of intelligent machines) → reflects humanity&#39;s highest values)?\u003c/p>\n\u003cp>Only then → will they be useful servants // and not Frankenstein&#39;s：(out-of-control monster).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>今年标志着 → 整整两个世纪：(自出版以来：(《弗兰肯斯坦；或，现代普罗米修斯》的：(玛丽·雪莱著)))。\u003c/p>\n\u003cp>甚至在：(电灯泡发明之前) → 这位作者创作了 → 一部杰出的作品：(推测性小说的)：(它将预示 → 许多伦理问题：(将被提出的：(由技术：(尚未到来的))))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>今天 → 快速增长：(人工智能（AI）的) → 提出了根本性问题：(&quot;什么是智能 + 身份 + 或意识？&quot; + &quot;什么使人类 → 成为人类？&quot;)\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>被称为 → 通用人工智能：(机器：(将模仿 → 方式：(人类思考))) → 继续躲避 → 科学家们。\u003c/p>\n\u003cp>然而人类仍然着迷：(于这个想法：(机器人的：(它们会看起来 + 移动 + 和反应 → 像人类一样)))：(类似于那些：(最近被描绘的：(在流行的科幻电视剧中：(比如《西部世界》和《人类》))))。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>人们如何思考 → 仍然太过复杂：(无法被理解) + 更不用说复制 → 大卫·伊格曼说：(斯坦福大学神经科学家)。\u003c/p>\n\u003cp>&quot;我们只是处于一种情况：(在这种情况下没有好的理论：(解释意识实际上是什么 + 以及你如何能够 → 建造一台机器：(达到那里)))。&quot;\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>但这并不意味着：(关键的伦理问题：(涉及AI的) → 不在眼前)。\u003c/p>\n\u003cp>即将到来的使用：(自动驾驶车辆的)：(例如) → 提出了棘手的伦理问题。\u003c/p>\n\u003cp>人类司机 → 有时必须做出 → 瞬间决定。\u003c/p>\n\u003cp>他们的反应 → 可能是复杂的组合：(即时反射 + 来自过去驾驶经验的输入 + 他们的眼睛和耳朵 → 告诉他们的：(在那一刻))。\u003c/p>\n\u003cp>AI&quot;视觉&quot;今天 → 远不如精密：(相比人类的)。\u003c/p>\n\u003cp>而且要预测：(每一种可想象的驾驶情况) → 是一个困难的编程问题。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>每当决策基于：(大量数据) → &quot;你很快就会遇到：(很多伦理问题)&quot; → 陈吉豪指出：(首席执行官：(一个新加坡机构的：(正在帮助政府 → 制定自愿准则：(为AI的伦理使用))))。\u003c/p>\n\u003cp>与新加坡一起 → 其他政府和大型企业 → 正开始建立：(他们自己的指导方针)。\u003c/p>\n\u003cp>英国正在建立 → 一个数据伦理中心。\u003c/p>\n\u003cp>印度发布了 → 其AI伦理战略：(今年春天)。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>在6月7日 → 谷歌承诺 → 不&quot;设计或部署AI&quot;：(会造成 → &quot;整体伤害&quot;的) + 或开发：(AI导向的武器) + 或使用AI：(用于监视：(会违反 → 国际规范的))。\u003c/p>\n\u003cp>它还承诺 → 不部署AI：(其使用会违反 → 国际法律 + 或人权的)。\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>虽然这个声明很模糊 // 它代表 → 一个起点。\u003c/p>\n\u003cp>这个想法也是如此：(即决策做出的：(由AI系统) → 应该是可解释的 + 透明的 + 和公平的)。\u003c/p>\n\u003ch3>第9段\u003c/h3>\n\u003cp>换句话说：我们如何能确保：(思维：(智能机器的) → 反映人类最高价值观)？\u003c/p>\n\u003cp>只有那时 → 它们才会是有用的仆人 // 而不是弗兰肯斯坦的：(失控的怪物)。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第1段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Even before / the invention of the electric light bulb, / the author produced / a remarkable work / of speculative fiction / that would foreshadow / many ethical questions / to be raised / by technologies / yet to come.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>甚至在 / 电灯泡发明之前，/ 这位作者创作了 / 一部杰出的作品 / 推测性小说的 / 它将预示 / 许多伦理问题 / 将被提出的 / 由技术 / 尚未到来的。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把作品的性质和创作时间合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>甚至在电灯泡发明之前，这位作者就创作了一部杰出的推测性小说\u003c/p>\n\u003c/blockquote>\n\u003cp>再把伦理问题是谁在什么时候引发的说完整：\u003c/p>\n\u003cblockquote>\n\u003cp>小说预示了尚未出现的技术将引发的许多伦理问题\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>甚至在电灯泡发明之前，这位作者就创作了一部杰出的推测性小说；小说预示了尚未出现的技术将引发的许多伦理问题。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>作者创作了小说，小说预示了伦理问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>时间放在创作动作之前；作品的类型和评价放在作品名词前。后半句先说预示，再把“未来技术将引发的”放到伦理问题前；不能让尚未到来修饰作者或作品的出版。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>甚至在电灯泡发明之前，作者就写了一部杰出的推测性小说，预示了尚未出现的技术以后会引发的许多伦理问题。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“将被提出的，由技术，尚未到来的”合成“未来技术将引发的”，去掉连续悬空的修饰。\u003c/p>\n\u003cp>“甚至……就……”保留时间上的超前意味；“预示”不能润色成已经造成技术危害，那会把预见改成因果。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>甚至在电灯泡发明之前，这位作者就创作了这部杰出的推测性小说，预示了未来技术将引发的许多伦理问题。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第3段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Yet humans remain fascinated by the idea of robots that would look, move, and respond like humans, similar to those recently depicted on popular sci-fi TV series such as &quot;Westworld&quot; and &quot;Humans.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Yet humans remain fascinated / by the idea / of robots / that would look, / move, / and respond / like humans, / similar to those / recently depicted / on popular sci-fi TV series / such as &quot;Westworld&quot; and &quot;Humans.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>然而人类仍然着迷 / 于这个想法 / 机器人的 / 它们会看起来，/ 移动，/ 和反应 / 像人类一样，/ 类似于那些 / 最近被描绘的 / 在流行的科幻电视剧中 / 比如《西部世界》和《人类》。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把机器人像人体现在哪些地方合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>机器人在外观、移动和反应上都像人，人类仍对这种想法着迷\u003c/p>\n\u003c/blockquote>\n\u003cp>再把电视剧与其中的机器人形象接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>这种形象类似于最近在《西部世界》和《人类》等流行科幻剧中描绘的机器人\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>机器人在外观、移动和反应上都像人，人类仍对这种想法着迷；这种形象类似于最近在《西部世界》和《人类》等流行科幻剧中描绘的机器人。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>人类仍然着迷于像人的机器人的想法。\u003c/p>\n\u003c/blockquote>\n\u003cp>“然而”放在开头，与前文技术尚未实现形成转折；先明确着迷的是一种想法，再把机器人像人的几个方面放进这个想法。电视剧名称留在后半句作例子，不能变成小说或科学家令人着迷。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>然而，人类仍对机器人在外观、移动和反应上像人类的想法着迷，这与最近《西部世界》和《人类》等流行科幻电视剧描绘的形象相似。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>将“于这个想法机器人的”接成“于机器人能够像人类一样……的想法”，避免中文对象断裂。\u003c/p>\n\u003cp>电视剧部分用“就像……描绘的那样”顺接，保留其示例作用；“仍然”说明现实困难并未消除想象。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>然而，人类仍然着迷于机器人能够像人类一样看、动、反应的想法，就像最近在《西部世界》和《人类》等流行科幻电视剧中描绘的那样。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Whenever decisions are based on masses of data, &quot;you quickly get into a lot of ethical questions,&quot; notes Tan Kiat How, chief executive of a Singapore-based agency that is helping the government develop a voluntary code for the ethical use of AI.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Whenever decisions are based / on masses of data, / &quot;you quickly get into / a lot of ethical questions,&quot; / notes Tan Kiat How, / chief executive / of a Singapore-based agency / that is helping the government / develop a voluntary code / for the ethical use of AI.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>每当决策基于 / 大量数据，/ &quot;你很快就会遇到 / 很多伦理问题，&quot; / 陈吉豪指出，/ 首席执行官 / 一个新加坡机构的 / 正在帮助政府 / 制定自愿准则 / 为AI的伦理使用。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把说话者的身份和机构的工作合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>陈吉豪是一个新加坡机构的首席执行官，该机构正在帮助政府制定AI伦理使用的自愿准则\u003c/p>\n\u003c/blockquote>\n\u003cp>再把数据决策与伦理疑问接起来：\u003c/p>\n\u003cblockquote>\n\u003cp>每当决策基于大量数据时，就很快会遇到许多伦理问题\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>陈吉豪是一个新加坡机构的首席执行官，该机构正在帮助政府制定AI伦理使用的自愿准则；每当决策基于大量数据时，就很快会遇到许多伦理问题。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>陈吉豪指出，数据决策会带来伦理问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>先把条件与评论接成完整引语，再交代是谁说的。姓名之后补充机构身份，机构正在协助制定准则的工作再接在身份后；“自愿”修饰准则，不要读成政府自愿成为决策主体。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>每当决策依据大量数据时，你很快就会碰到许多伦理问题。陈吉豪这样指出，他是一家新加坡机构的首席执行官，这家机构正在帮助政府制定AI伦理使用的自愿准则。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>“每当……时，就……”把条件和结果接清楚；“大量数据”说明决策依据，不是伦理问题数量的修饰语。\u003c/p>\n\u003cp>把“首席执行官一个新加坡机构的”改成“一个新加坡机构的首席执行官”，最后用“该机构”明确帮助政府的是谁。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;每当决策基于大量数据时，你很快就会遇到很多伦理问题，&quot;陈吉豪指出，他是一个新加坡机构的首席执行官，该机构正在帮助政府制定AI伦理使用的自愿准则。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>35题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下列哪一个最适合作为本文的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>The Conscience of AI: Complex But Inevitable\u003c/strong>\u003c/p>\n\u003cp>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003cp>B. \u003cstrong>Frankenstein, the Novel Predicting the Age of AI\u003c/strong>\u003c/p>\n\u003cp>《弗兰肯斯坦》：预言人工智能时代的小说\u003c/p>\n\u003cp>C. \u003cstrong>AI’s Future: In the Hands of Tech Giants\u003c/strong>\u003c/p>\n\u003cp>人工智能的未来：掌握在科技巨头手里\u003c/p>\n\u003cp>D. \u003cstrong>AI Shall Be Killers Once Out of Control\u003c/strong>\u003c/p>\n\u003cp>人工智能一旦失控就会成为杀手\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。\u003c/td>\n\u003ctd>先讲一个旧例子引出要谈的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>转到今天的人工智能，列出智能、意识和人之所以为人的疑问。\u003c/td>\n\u003ctd>再把旧问题接到眼前的新情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>写模仿人类思考的机器、像人的机器人和科幻电视剧中的形象。\u003c/td>\n\u003ctd>先摆出人们对新事物的想象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>借伊格曼的说明指出，意识尚难理解，更难复制到机器中。\u003c/td>\n\u003ctd>接着说明现实还做不到那一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。\u003c/td>\n\u003ctd>但话说回来问题已到眼前且很难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>从数据决策的伦理问题转向各国和大公司开始制定伦理规范。\u003c/td>\n\u003ctd>再说有些人已经开始想办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。\u003c/td>\n\u003ctd>举一个例子把怎样起步写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。\u003c/td>\n\u003ctd>先承认办法不完善再肯定起步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9段\u003c/td>\n\u003ctd>要求智能机器体现人类最高价值，使它们成为有用帮手而非失控怪物。\u003c/td>\n\u003ctd>最后说必须朝哪个方向继续做\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>A. The Conscience of AI: Complex But Inevitable\u003c/h3>\n\u003cp>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003ch4>如果 A 是主旨，文章9段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003cp>那文章9段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>借旧小说中的造物责任引出机器应遵守什么伦理价值的问题。\u003c/td>\n\u003ctd>先讲一个旧例子引出要谈的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明今天AI的发展把智能、意识和人的本质这些旧疑问变成迫切现实。\u003c/td>\n\u003ctd>再把旧问题接到眼前的新情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>展示人们对外形、行动和回应都像人的机器的想象，为机器伦理问题确定对象。\u003c/td>\n\u003ctd>先摆出人们对新事物的想象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明意识尚无成熟理论，人类无法轻易实现理想中的智能机器，点出复杂性。\u003c/td>\n\u003ctd>接着说明现实还做不到那一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转向已经到来的自动驾驶应用，说明完整类人智能尚未实现也不能推迟困难的伦理决策。\u003c/td>\n\u003ctd>但话说回来问题已到眼前且很难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>介绍政府和企业开始制定AI伦理准则，说明面对复杂性仍须立即行动。\u003c/td>\n\u003ctd>再说有些人已经开始想办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>以谷歌避免伤害和违法用途的承诺，把伦理约束的起步方式写具体。\u003c/td>\n\u003ctd>举一个例子把怎样起步写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>承认初步承诺还不够清楚，仍肯定其价值，并以公平、透明等原则补充方向。\u003c/td>\n\u003ctd>先承认办法不完善再肯定起步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9段\u003c/td>\n\u003ctd>要求智能机器体现人类最高价值，把复杂而必须推进的伦理工作落到服务人类。\u003c/td>\n\u003ctd>最后说必须朝哪个方向继续做\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A中的 Conscience of AI 不是要求全文证明机器已经具有人类的良心；标题把机器怎样遵守人的伦理价值概括成一个问题。Complex能接住中间连续出现的难处：意识很复杂、缺少好理论，驾驶员的瞬间反应又涉及经验和感官信息，编程很难处理所有情况。But Inevitable接住第五段开头的转折：不能因为还造不出完全像人的机器，就以为伦理问题没有到眼前。\u003c/p>\n\u003cp>后半篇也不是突然换题。新加坡、英国、印度和大公司在制定规则，谷歌承诺避开总体伤害和侵犯权利，作者说这些虽含糊却是起点；最后再把目标说成智能机器反映人类最高价值。前半篇解释复杂在哪里，后半篇写既然回避不了就怎样开始。A既容得下技术困难，也容得下政府和企业的行动，最后的有用仆人与失控怪物还给出了为什么必须处理的理由。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>B. Frankenstein, the Novel Predicting the Age of AI\u003c/h3>\n\u003cp>《弗兰肯斯坦》：预言人工智能时代的小说\u003c/p>\n\u003ch4>如果 B 是主旨，文章9段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>《弗兰肯斯坦》：预言人工智能时代的小说\u003c/p>\n\u003cp>那文章9段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先介绍小说里关于人造智能及创造者责任的旧设想，提出它预言了AI时代的主题。\u003c/td>\n\u003ctd>先讲一个旧例子引出要谈的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>把当代AI的伦理疑问与小说当年的设想逐项相接，说明预言如何进入现实。\u003c/td>\n\u003ctd>再把旧问题接到眼前的新情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>展示公众对小说所预言的类人机器的想象，并说明影视怎样延续这些预言图景。\u003c/td>\n\u003ctd>先摆出人们对新事物的想象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出现实尚不能复制小说预想的完整类人意识，界定预言尚未兑现的部分。\u003c/td>\n\u003ctd>接着说明现实还做不到那一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转向已出现的自动驾驶责任难题，说明小说预示的伦理困境却已先于完整类人机器到来。\u003c/td>\n\u003ctd>但话说回来问题已到眼前且很难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>介绍读者与研究者如何借小说的警告提出当代治理办法，继续展示预言的启发。\u003c/td>\n\u003ctd>再说有些人已经开始想办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>举一项由小说的创造责任警告引出的企业承诺，具体呈现预言怎样指导行动。\u003c/td>\n\u003ctd>举一个例子把怎样起步写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>承认根据小说发展出的初步治理方案仍粗略，同时肯定从文学预警走向现实规则的起步。\u003c/td>\n\u003ctd>先承认办法不完善再肯定起步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9段\u003c/td>\n\u003ctd>回到小说的预见价值，要求继续理解其警告，使预言中的失控情节不在AI时代重演。\u003c/td>\n\u003ctd>最后说必须朝哪个方向继续做\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B确实能接住开头的小说和两百年，也能接住末段再次出现的Frankenstein；但是“预言人工智能时代的小说”要求小说本身始终是被解释、被核对的对象。那样第四段讨论意识、第五段讨论驾驶时，就应该指出这些情形分别对应小说里的哪项设想，后面的规则也应被用来证明小说预见得准。\u003c/p>\n\u003cp>实际正文没有沿着小说情节展开。第四段伊格曼说现实理论不足，第五段详细拆驾驶员的反应和程序困难，第六、七段说各方当下怎样建立规范，这些段落之间能够直接连起来，不需要借小说内容作中介。结尾提到怪物，是把不能让机器失控的要求说得形象，并非评定一本书的预测成就。B把承担开头引入和结尾警示作用的小说，抬成了全文一直在论证的中心，因此中间大部分具体讨论在这个标题下找不到应有的位置。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>C. AI’s Future: In the Hands of Tech Giants\u003c/h3>\n\u003cp>人工智能的未来：掌握在科技巨头手里\u003c/p>\n\u003ch4>如果 C 是主旨，文章9段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>人工智能的未来：掌握在科技巨头手里\u003c/p>\n\u003cp>那文章9段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>用旧故事中创造者控制造物的例子，引出今天谁能决定AI未来的权力问题。\u003c/td>\n\u003ctd>先讲一个旧例子引出要谈的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>把创造者的选择接到当代科技巨头的研发和部署决策上，说明这种权力的现实载体。\u003c/td>\n\u003ctd>再把旧问题接到眼前的新情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>展示企业描绘的类人机器愿景，说明公众对AI未来的想象怎样受到巨头塑造。\u003c/td>\n\u003ctd>先摆出人们对新事物的想象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出掌握资源的大公司仍未实现完整类人意识，因此AI下一步取决于它们攻克哪些技术难点。\u003c/td>\n\u003ctd>接着说明现实还做不到那一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>说明自动驾驶等产品已经带来艰难取舍，而企业掌握设计和投放权，使问题更加迫切。\u003c/td>\n\u003ctd>但话说回来问题已到眼前且很难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>介绍巨头开始建立内部伦理方案，政府提出的要求也需要它们落实到产品决定中。\u003c/td>\n\u003ctd>再说有些人已经开始想办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>以谷歌宣布哪些AI不开发为例，具体说明企业如何用开发权决定未来技术边界。\u003c/td>\n\u003ctd>举一个例子把怎样起步写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>承认企业承诺含糊且尚不完善，仍肯定掌握实际技术权力者开始自我约束的意义。\u003c/td>\n\u003ctd>先承认办法不完善再肯定起步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9段\u003c/td>\n\u003ctd>总结应促使科技巨头负责任地运用决策权，因为AI的未来在很大程度上由它们的选择塑造。\u003c/td>\n\u003ctd>最后说必须朝哪个方向继续做\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C里的Tech Giants能找到谷歌和mega-corporations，后面也确实谈了公司应该遵守什么。但“In the Hands of”进一步把人工智能的未来归到科技巨头手里，这就要求全文解释谁拥有控制权、为何企业能决定其他人的方向。\u003c/p>\n\u003cp>实际第六段把企业和other governments并列，具体还列出新加坡、英国、印度，没有说政府只能跟随科技巨头。第七段谷歌只是紧接其后的一个具体例子，第八段对它的评价也只是one starting point，另一个关于可解释与公平的想法同样是起点。结尾提出的衡量标准是humanity’s highest values，主体扩展到“我们如何确保”，不是“巨头怎样决定”。C虽然抓住了一个分量不小的例子，却把参与制定规范的一类主体改成了掌握全局的主体；它既解释不了前面的意识与驾驶困难，也把后面政府和全人类价值的位置挤掉了。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>D. AI Shall Be Killers Once Out of Control\u003c/h3>\n\u003cp>人工智能一旦失控就会成为杀手\u003c/p>\n\u003ch4>如果 D 是主旨，文章9段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>人工智能一旦失控就会成为杀手\u003c/p>\n\u003cp>那文章9段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>用旧小说中失控造物造成死亡的故事，引出智能机器一旦失控便成为杀手的条件判断。\u003c/td>\n\u003ctd>先讲一个旧例子引出要谈的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>把这种失控与致命后果的关系接到今天AI应用中的控制问题。\u003c/td>\n\u003ctd>再把旧问题接到眼前的新情况\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>展示人们想象的自主类人机器，突出它们在失去安全限制后实施致命行为的情景。\u003c/td>\n\u003ctd>先摆出人们对新事物的想象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出机器像人一样理解和克制伤害仍未实现，使人类尚不能靠机器的自觉排除失控杀人的后果。\u003c/td>\n\u003ctd>接着说明现实还做不到那一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转向自动驾驶等眼前应用，说明阻止失控导致死亡已经是困难而迫切的现实任务。\u003c/td>\n\u003ctd>但话说回来问题已到眼前且很难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>介绍各方开始设计可中断系统和行为边界，以防机器越过控制而造成死亡。\u003c/td>\n\u003ctd>再说有些人已经开始想办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>举企业禁止自主武器的承诺，具体说明它怎样防范失控机器成为杀手。\u003c/td>\n\u003ctd>举一个例子把怎样起步写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>承认安全承诺仍不能覆盖每种失控情境，同时肯定建立致命行为约束是必要开端。\u003c/td>\n\u003ctd>先承认办法不完善再肯定起步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第9段\u003c/td>\n\u003ctd>要求继续加强可控性和紧急停止能力，以避免失控即造成致命伤害的结果。\u003c/td>\n\u003ctd>最后说必须朝哪个方向继续做\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D抓住了后半篇的harm、weapons和最后的out-of-control monster，因此危险方向不是完全无关。但“Shall Be Killers Once Out of Control”是一个很强的条件\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>35题结论\u003c/h3>\n\u003cp>\u003cstrong>35. A. The Conscience of AI: Complex But Inevitable\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>The Conscience of AI: Complex But Inevitable / 人工智能的良知：复杂，但不可回避\u003c/strong>\u003c/p>\n\u003ch2>31题\u003c/h2>\n\u003cblockquote>\n\u003cp>Mary Shelley’s novel Frankenstein is mentioned because it ______.\u003cbr>文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>引例作用题。题干要求判断“文中提到玛丽·雪莱的小说《弗兰肯斯坦》，是因为它怎样？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>This year marks exactly two centuries since the publication of &quot;Frankenstein; or, The Modern Prometheus,&quot; by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003cp>Today the rapid growth of artificial intelligence (AI) raises fundamental questions: &quot;What is intelligence, identity, or consciousness? What makes humans humans?&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>首段把小说与后来技术将提出的伦理问题联系，第二段用Today把这种关切接到今天的人工智能。\u003c/p>\n\u003ch3>A. involves some concerns raised by AI today\u003c/h3>\n\u003cblockquote>\n\u003cp>涉及今天人工智能引发的一些关切\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>首段foreshadow many ethical questions表示作品预示后来技术会提出的伦理问题；第2段Today把话题接到今天AI所引发的智能、身份和意识疑问。一个交代早期关切，一个给出今天的对应对象。\u003c/p>\n\u003cp>A的involves some concerns raised by AI today概括这两段的衔接。some保留部分关联，不声称小说准确预测整个AI时代，也不说小说本身制造了现实伦理冲突。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003cp>Today the rapid growth of artificial intelligence (AI) raises fundamental questions: &quot;What is intelligence, identity, or consciousness?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>文章提到玛丽·雪莱的小说，是因为它涉及今天人工智能引发的一些关切。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的 concerns raised by AI today 指向今天人工智能带来的问题，与第一段 many ethical questions 都在谈技术引起的伦理疑问；第二段又以 Today 转到 artificial intelligence，因此把第一段末句和第二段开头合起来看。\u003c/p>\n\u003cp>首段foreshadow many ethical questions表示作品预示后来技术会提出的伦理问题；第2段Today把话题接到今天AI所引发的智能、身份和意识疑问。一个交代早期关切，一个给出今天的对应对象。\u003c/p>\n\u003cp>A的involves some concerns raised by AI today概括这两段的衔接。some保留部分关联，不声称小说准确预测整个AI时代，也不说小说本身制造了现实伦理冲突。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003cp>Today the rapid growth of artificial intelligence (AI) raises fundamental questions: &quot;What is intelligence, identity, or consciousness?\u003c/p>\n\u003cp>首段把小说与后来技术将提出的伦理问题联系，第二段用Today把这种关切接到今天的人工智能。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。转到今天的人工智能，列出智能、意识和人之所以为人的疑问。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Shelley’s novel anticipated ethical concerns that have become relevant to artificial intelligence today.\u003c/p>\n\u003cp>雪莱的小说预示了一些如今与人工智能有关的伦理关切。\u003c/p>\n\u003c/blockquote>\n\u003cp>小说中的预示与第2段今天的疑问形成时间上的衔接，因而适合引出全文。假设不要求小说准确预言某项发明，只需相关伦理关切延续到今天。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文要讨论人工智能的伦理约束，小说应作为这一问题的早期文学引入；主旨不能替文章证明两百年持续流行、科学家反应或现实争论。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>involves some concerns raised by AI today\u003cbr>涉及今天人工智能引发的一些关切\u003c/p>\n\u003c/blockquote>\n\u003cp>A的involves some concerns raised by AI today概括这两段的衔接。some保留部分关联，不声称小说准确预测整个AI时代，也不说小说本身制造了现实伦理冲突。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。转到今天的人工智能，列出智能、意识和人之所以为人的疑问。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. has remained popular for as long as 200 years\u003c/h3>\n\u003cblockquote>\n\u003cp>两百年来一直广受欢迎\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 has remained popular 后面限定两百年，第一段 since the publication 也在计算时间；两边提到的时长相同，因此回看第一句，确定两百年到底在计算哪件事。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文用 since the publication 计算的是“自出版以来到今年”的时间，起点是出版事件。B的 has remained popular 则把这整段时间写成了持续受欢迎的状态：从出版到现在一直有人喜爱。年份相同，所记录的事情却不同。出版了两百年的小说，可以在某些时期流行，也可以一度很少被阅读；第一句的纪念时间不能被直接读成两百年不断流行。紧接着作者谈的是作品中的伦理问题，也不是追述它在各年代的读者和销量。\u003c/p>\n\u003cp>前者给出出版日期到现在的间隔，后者给出全程持续的流行状态；B把出版时间换成了受欢迎的持续时间。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This year marks exactly two centuries since the publication of &quot;Frankenstein; or, The Modern Prometheus,&quot; by Mary Shelley.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>文章提到玛丽·雪莱的小说，是因为它两百年来一直广受欢迎。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 has remained popular 后面限定两百年，第一段 since the publication 也在计算时间；两边提到的时长相同，因此回看第一句，确定两百年到底在计算哪件事。\u003c/p>\n\u003cp>原文用 since the publication 计算的是“自出版以来到今年”的时间，起点是出版事件。B的 has remained popular 则把这整段时间写成了持续受欢迎的状态：从出版到现在一直有人喜爱。年份相同，所记录的事情却不同。出版了两百年的小说，可以在某些时期流行，也可以一度很少被阅读；第一句的纪念时间不能被直接读成两百年不断流行。紧接着作者谈的是作品中的伦理问题，也不是追述它在各年代的读者和销量。\u003c/p>\n\u003cp>前者给出出版日期到现在的间隔，后者给出全程持续的流行状态；B把出版时间换成了受欢迎的持续时间。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This year marks exactly two centuries since the publication of &quot;Frankenstein; or, The Modern Prometheus,&quot; by Mary Shelley.\u003c/p>\n\u003cp>首段把小说与后来技术将提出的伦理问题联系，第二段用Today把这种关切接到今天的人工智能。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。转到今天的人工智能，列出智能、意识和人之所以为人的疑问。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The novel is introduced because it has been continuously popular for two hundred years.\u003c/p>\n\u003cp>介绍这部小说，是因为它两百年来一直受到欢迎。\u003c/p>\n\u003c/blockquote>\n\u003cp>持续流行需要出版之后各时期读者反响的材料。首句只给距出版两百年的时间，后句立即写技术伦理，不能把作品存在的时长换成持续受欢迎的时长。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文要讨论人工智能的伦理约束，小说应作为这一问题的早期文学引入；主旨不能替文章证明两百年持续流行、科学家反应或现实争论。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>has remained popular for as long as 200 years\u003cbr>两百年来一直广受欢迎\u003c/p>\n\u003c/blockquote>\n\u003cp>前者给出出版日期到现在的间隔，后者给出全程持续的流行状态；B把出版时间换成了受欢迎的持续时间。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。转到今天的人工智能，列出智能、意识和人之所以为人的疑问。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. fascinates AI scientists all over the world\u003c/h3>\n\u003cblockquote>\n\u003cp>让全世界的人工智能科学家着迷\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C中的 fascinates AI scientists 把对象落在人工智能科学家身上，粗读时第三段出现过科学家和机器；scientists指的也是科学家这个对象，所以先回到第三段读完，再看影响科学家的到底是什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>回到C，fascinates AI scientists把影响科学家的主语写成了小说；第三段的主语却是artificial general intelligence，接着再看这两处具体说法。\u003c/p>\n\u003cp>原句明写 artificial general intelligence，并用模仿人类思考的机器来解释；C把这个主语换成小说，不能据此回答为什么提到小说。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This year marks exactly two centuries since the publication of &quot;Frankenstein; or, The Modern Prometheus,&quot; by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>文章提到玛丽·雪莱的小说，是因为它让全世界的人工智能科学家着迷。\u003c/p>\n\u003c/blockquote>\n\u003cp>C中的 fascinates AI scientists 把对象落在人工智能科学家身上，粗读时第三段出现过科学家和机器；scientists指的也是科学家这个对象，所以先回到第三段读完，再看影响科学家的到底是什么。\u003c/p>\n\u003cp>回到C，fascinates AI scientists把影响科学家的主语写成了小说；第三段的主语却是artificial general intelligence，接着再看这两处具体说法。\u003c/p>\n\u003cp>这里与 scientists 搭配的主语是 artificial general intelligence，后面的 machines 解释它是模仿人类思考的机器。C的 fascinates AI scientists 接回题干后，主语却变成了玛丽·雪莱的小说。下一句又换到 humans 和 the idea of robots，举的是电视剧中的类人机器人。哪一处都不能把“通用人工智能对科学家的影响”改成“这本小说使全世界科学家着迷”：不仅主语换了，all over the world 还把对象扩成全世界的科学家。\u003c/p>\n\u003cp>原句明写 artificial general intelligence，并用模仿人类思考的机器来解释；C把这个主语换成小说，不能据此回答为什么提到小说。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This year marks exactly two centuries since the publication of &quot;Frankenstein; or, The Modern Prometheus,&quot; by Mary Shelley. Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003cp>首段把小说与后来技术将提出的伦理问题联系，第二段用Today把这种关切接到今天的人工智能。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。转到今天的人工智能，列出智能、意识和人之所以为人的疑问。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>AI scientists throughout the world are fascinated by Shelley’s novel.\u003c/p>\n\u003cp>全世界的人工智能科学家都对雪莱的小说着迷。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文写人类迷恋类人机器人的想法，科学家则尚未掌握通用人工智能。假设把着迷的对象换成小说、着迷者换成全球科学家，首尾均没有对应。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文要讨论人工智能的伦理约束，小说应作为这一问题的早期文学引入；主旨不能替文章证明两百年持续流行、科学家反应或现实争论。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>fascinates AI scientists all over the world\u003cbr>让全世界的人工智能科学家着迷\u003c/p>\n\u003c/blockquote>\n\u003cp>原句明写 artificial general intelligence，并用模仿人类思考的机器来解释；C把这个主语换成小说，不能据此回答为什么提到小说。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。转到今天的人工智能，列出智能、意识和人之所以为人的疑问。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. has sparked serious ethical controversies\u003c/h3>\n\u003cblockquote>\n\u003cp>已经引发严重的伦理争论\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“has sparked serious ethical [xxx]”，保留了相应遮挡。当时的定位线索是：D用 has sparked 说小说引发了某种伦理上的东西，第一段 ethical questions 也是小说后面紧接的伦理内容，因此回到第一段作品与伦理问题相连的那一句，看原文说的是哪种联系。读完全文后，做题模式再经交叉验证排除D，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>controversies是争论，has sparked表示已经引发。D接回题干后，变成小说是现实伦理争论的触发者；原文foreshadow却说作品预示将由未来技术引出的伦理问题。\u003c/p>\n\u003cp>一边是文学作品先写到问题，一边是作品导致争论发生，动作和时间均不同。第一段没有介绍小说出版后引发哪些争论，第二段明确把今天的问题联系到AI发展，因此不能用ethical这个共同词补全D的因果。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>文章提到玛丽·雪莱的小说，是因为它已经引发严重的伦理争论。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的\u003ccode>has sparked serious ethical controversies\u003c/code>声称小说引发了严重伦理争议。原文使用\u003ccode>foreshadowed many ethical questions\u003c/code>，讨论的是小说提前涉及后来技术提出的问题；需要比较“预示问题”与“引发争议”这两个不同动作。\u003c/p>\n\u003cp>controversies是争论，has sparked表示已经引发。D接回题干后，变成小说是现实伦理争论的触发者；原文foreshadow却说作品预示将由未来技术引出的伦理问题。\u003c/p>\n\u003cp>一边是文学作品先写到问题，一边是作品导致争论发生，动作和时间均不同。第一段没有介绍小说出版后引发哪些争论，第二段明确把今天的问题联系到AI发展，因此不能用ethical这个共同词补全D的因果。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.\u003c/p>\n\u003cp>首段把小说与后来技术将提出的伦理问题联系，第二段用Today把这种关切接到今天的人工智能。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。转到今天的人工智能，列出智能、意识和人之所以为人的疑问。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The novel itself has triggered serious ethical controversies.\u003c/p>\n\u003cp>这部小说本身已经引发了严重伦理争论。\u003c/p>\n\u003c/blockquote>\n\u003cp>foreshadow是预示后来技术的问题，假设却将小说作为已经引发争论的原因。未来技术带来的伦理疑问不等于小说出版后实际引起了争论。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文要讨论人工智能的伦理约束，小说应作为这一问题的早期文学引入；主旨不能替文章证明两百年持续流行、科学家反应或现实争论。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>has sparked serious ethical controversies\u003cbr>已经引发严重的伦理争论\u003c/p>\n\u003c/blockquote>\n\u003cp>一边是文学作品先写到问题，一边是作品导致争论发生，动作和时间均不同。第一段没有介绍小说出版后引发哪些争论，第二段明确把今天的问题联系到AI发展，因此不能用ethical这个共同词补全D的因果。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从两百年前的小说谈起，把作品与后来技术会引发的伦理问题放在一起。转到今天的人工智能，列出智能、意识和人之所以为人的疑问。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>31题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>31. A. involves some concerns raised by AI today\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：首段foreshadow many ethical questions表示作品预示后来技术会提出的伦理问题；第2段Today把话题接到今天AI所引发的智能、身份和意识疑问。\u003c/p>\n\u003cp>B：原文用 since the publication 计算的是“自出版以来到今年”的时间，起点是出版事件。\u003c/p>\n\u003cp>C：回到C，fascinates AI scientists把影响科学家的主语写成了小说；第三段的主语却是artificial general intelligence，接着再看这两处具体说法。\u003c/p>\n\u003cp>D：controversies是争论，has sparked表示已经引发。\u003c/p>\n\u003ch2>32题\u003c/h2>\n\u003cblockquote>\n\u003cp>In David Eagleman’s opinion, our current knowledge of consciousness ______.\u003cbr>按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点题。题干要求判断“按照大卫·伊格曼的看法，我们目前对于意识的认识怎样？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>What is being called artificial general intelligence, machines that would imitate the way humans think, continues to evade scientists. Yet humans remain fascinated by the idea of robots that would look, move, and respond like humans, similar to those recently depicted on popular sci-fi TV series such as &quot;Westworld&quot; and &quot;Humans.&quot;\u003c/p>\n\u003cp>Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University neuroscientist. &quot;We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>第4段先说人的思维太复杂而无法理解，更不用说复制，再用no good theories说明还没有足以解释意识并造出相应机器的理论。\u003c/p>\n\u003ch3>A. helps explain artificial intelligence\u003c/h3>\n\u003cblockquote>\n\u003cp>有助于解释人工智能\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>这要求后文给出可用于解释机器的成熟理论。实际明确说no good theories，把尚无法充分说明的知识写成已有解释，改变了认识水平。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>伊格曼认为，我们目前对意识的认识有助于解释人工智能。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 helps explain 在说已有认识能够提供解释，而第四段 no good theories 正在说明目前有没有足够的解释，因此回看伊格曼引语里对理论现状的那一句。\u003c/p>\n\u003cp>引语里的 no good theories 同时带出两个解释对象：意识究竟是什么，以及怎样造出一台机器达到那个程度。A的 helps explain 却把我们的现有认识写成了正在帮助解释人工智能的资源。前一句还说人的思考仍太复杂，无法理解，这也不是在介绍现有认识已经带来的解释成果。\u003c/p>\n\u003cp>第4段先说人的思维太复杂而无法理解，更不用说复制，再用no good theories说明还没有足以解释意识并造出相应机器的理论。\u003c/p>\n\u003cp>这要求后文给出可用于解释机器的成熟理论。实际明确说no good theories，把尚无法充分说明的知识写成已有解释，改变了认识水平。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.&quot;\u003c/p>\n\u003cp>第4段先说人的思维太复杂而无法理解，更不用说复制，再用no good theories说明还没有足以解释意识并造出相应机器的理论。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写模仿人类思考的机器、像人的机器人和科幻电视剧中的形象。借伊格曼的说明指出，意识尚难理解，更难复制到机器中。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Our present understanding of consciousness already provides an explanation of artificial intelligence.\u003c/p>\n\u003cp>现有意识知识已经提供了对人工智能的解释。\u003c/p>\n\u003c/blockquote>\n\u003cp>这要求后文给出可用于解释机器的成熟理论。实际明确说no good theories，把尚无法充分说明的知识写成已有解释，改变了认识水平。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文承认伦理与技术问题复杂，但本题具体问意识知识的限度；主旨只能限定为仍有困难，复制能力须由too complex与let alone判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>helps explain artificial intelligence\u003cbr>有助于解释人工智能\u003c/p>\n\u003c/blockquote>\n\u003cp>引语 nd our present technical capacity.\u003c/p>\n\u003cp>解决这些伦理问题仍超出我们目前的技术能力。\u003c/p>\n\u003c/blockquote>\n\u003cp>still与today相合，capacity由感知和编程两方面的不足具体支持。它承认当下有困难，没有把暂未解决扩大成不可能解决。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>人工智能伦理复杂而不能回避，本题能据局部困难判断当前能力不足；这个主旨既不宣布永远无解，也不能证明公众好奇或关注的多少。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>is still beyond our capacity\u003cbr>仍超出我们的能力\u003c/p>\n\u003c/blockquote>\n\u003cp>C把感知与预测两项不足概括为当下尚未具备完整解决能力。still限制在当前阶段，不排除未来改进；这与A把困难扩成几乎永远无解不同，也不添加公众反应。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. causes little public concern\u003c/h3>\n\u003cblockquote>\n\u003cp>几乎没有引起公众关注\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 little public concern 说这类问题在公众层面没有多少关切，粗读时紧接的一段却出现了政府和指导原则；other governments 与前面的自动驾驶伦理问题接在一起讨论社会应对，所以把第六段整段读完，再看各方是否正在行动。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。\u003c/p>\n\u003cp>原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But that doesn&#39;t mean crucial ethical issues involving AI aren&#39;t at hand. The coming use of autonomous vehicles, for example, poses thorny ethical questions. Human drivers sometimes must make split-second decisions. Their reactions may be a complex combination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment. AI &quot;vision&quot; today is not nearly as sophisticated as that of humans. And to anticipate every imaginable driving situation is a difficult programming problem.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>自动驾驶带来的伦理问题，其解决办法几乎没有引起公众关注。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 little public concern 说这类问题在公众层面没有多少关切，粗读时紧接的一段却出现了政府和指导原则；other governments 与前面的自动驾驶伦理问题接在一起讨论社会应对，所以把第六段整段读完，再看各方是否正在行动。\u003c/p>\n\u003cp>再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。\u003c/p>\n\u003cp>这里先说大量数据作出的决定很快带来许多伦理问题，然后用具体行动接下去：新加坡的机构帮助政府制定规范，other governments和大公司建立指导原则，英国设立伦理中心，印度发布战略。D的 little public concern 则把这件事描写成很少受到公共关切。政府不是每一个公众个体，但这些国家正在建立针对伦理问题的公共规则，说明问题已进入需要公开制度回应的层面，不能概括成“几乎不受关切”。第五段的自动驾驶正是以数据和程序作决定的一个眼前例子；作者从这个例子接到多方制定规范，没有把它写成无人过问的小问题。\u003c/p>\n\u003cp>两边的差别就在反应程度：原文说的是多个国家已经为这些问题建立规范，D却说公共关切很少，把正在发生的多方应对写成了近乎不关心。\u003c/p>\n\u003cp>原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But that doesn&#39;t mean crucial ethical issues involving AI aren&#39;t at hand. The coming use of autonomous vehicles, for example, poses thorny ethical questions. Human drivers sometimes must make split-second decisions. Their reactions may be a complex combination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment. AI &quot;vision&quot; today is not nearly as sophisticated as that of humans. And to anticipate every imaginable driving situation is a difficult programming problem.\u003c/p>\n\u003cp>人类的瞬间判断综合本能、经验和感官信息，AI视觉尚不及人类，预见所有驾驶情境又是困难的编程问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The ethical problems of autonomous vehicles cause little public concern.\u003c/p>\n\u003cp>自动驾驶的伦理问题几乎不引起公众关切。\u003c/p>\n\u003c/blockquote>\n\u003cp>公众关切程度需要调查或反应描述。原文的thorny评价问题棘手，接着解释技术困难，并没有统计人们是否在意。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>人工智能伦理复杂而不能回避，本题能据局部困难判断当前能力不足；这个主旨既不宣布永远无解，也不能证明公众好奇或关注的多少。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>causes little public concern\u003cbr>几乎没有引起公众关注\u003c/p>\n\u003c/blockquote>\n\u003cp>原文写出了接连发生的公共应对行动，D却用little public concern把这种应对缩成近乎不关心，程度和实际情况相反。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出伦理问题已经近在眼前，用自动驾驶决定的复杂性说明解决困难。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>33题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>33. C. is still beyond our capacity\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文的 today 在讲人工智能今天的状态，后一句把处理各种驾驶情况说成 difficult programming problem，承认它很难。\u003c/p>\n\u003cp>B：curiosity是好奇心，has aroused much curiosity说解决办法已经引起大量好奇。\u003c/p>\n\u003cp>C：capacity是能力，still beyond our capacity表示仍超出目前能力。\u003c/p>\n\u003cp>D：再看D的little public concern，第六段已经出现other governments及具体行动，把这几句拿来比较公共层面的反应。\u003c/p>\n\u003ch2>34题\u003c/h2>\n\u003cblockquote>\n\u003cp>The author’s attitude toward Google’s pledges is one of ______.\u003cbr>作者对谷歌的承诺持什么态度？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>作者态度题。题干要求判断“作者对谷歌的承诺持什么态度？”，先按第7、8段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>On June 7 Google pledged not to &quot;design or deploy AI&quot; that would cause &quot;overall harm,&quot; or to develop AI-directed weapons or use AI for surveillance that would violate international norms. It also pledged not to deploy AI whose use would violate international laws or human rights.\u003c/p>\n\u003cp>While the statement is vague, it represents one starting point. So does the idea that decisions made by AI systems should be explainable, transparent, and fair.\u003c/p>\n\u003c/blockquote>\n\u003cp>第7段列避免整体伤害、违法和侵犯人权的承诺；第8段虽承认声明含糊，主句仍把它视为一个起点。\u003c/p>\n\u003ch3>A. contempt\u003c/h3>\n\u003cblockquote>\n\u003cp>蔑视\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 contempt 是认为不值得一提，第八段 one starting point 则是作者对声明价值的直接说法，因此回看第八段第一句，看作者在承认含糊之后给了什么评价。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>作者并未忽略声明的不足，先写 vague，说它含糊；但让步的后半句仍给出 one starting point，承认它可以作为一个开始。A的 contempt 要把这种声明当作没有价值、值得轻视的东西，与“承认它是一个起点”相反。不能只看vague就把后半句删掉：作者保留的正是这一步即使不完善，仍有起步意义。\u003c/p>\n\u003cp>one starting point给它保留了实际的起步价值，和contempt的轻视方向不同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者对谷歌承诺的态度是蔑视。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 contempt 是认为不值得一提，第八段 one starting point 则是作者对声明价值的直接说法，因此回看第八段第一句，看作者在承认含糊之后给了什么评价。\u003c/p>\n\u003cp>作者并未忽略声明的不足，先写 vague，说它含糊；但让步的后半句仍给出 one starting point，承认它可以作为一个开始。A的 contempt 要把这种声明当作没有价值、值得轻视的东西，与“承认它是一个起点”相反。不能只看vague就把后半句删掉：作者保留的正是这一步即使不完善，仍有起步意义。\u003c/p>\n\u003cp>one starting point给它保留了实际的起步价值，和contempt的轻视方向不同。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第7、8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003cp>第7段列避免整体伤害、违法和侵犯人权的承诺；第8段虽承认声明含糊，主句仍把它视为一个起点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Google’s vague statement is beneath serious consideration and offers no useful beginning.\u003c/p>\n\u003cp>谷歌的模糊声明不值得认真对待，也没有任何有用的起步意义。\u003c/p>\n\u003c/blockquote>\n\u003cp>蔑视需要贬低或抹去承诺的价值。实际用it represents one starting point肯定其作用，不能让让步词vague吞掉主句的正面评价。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文支持从现在开始给AI施加伦理要求，对初步承诺应肯定其起步意义，同时保留尚不完善的限制；局部转折决定具体态度词。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>contempt\u003cbr>蔑视\u003c/p>\n\u003c/blockquote>\n\u003cp>one starting point给它保留了实际的起步价值，和contempt的轻视方向不同。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. skepticism\u003c/h3>\n\u003cblockquote>\n\u003cp>怀疑\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 skepticism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。B的 skepticism 若要成立，评价应停在不相信承诺、怀疑其真假或作用上。这里却没有把含糊发展成不相信，反而用While先让一步，再保留起点价值。“还不够具体”与“我不相信它”表达的是不同态度，决定方向的是让步后面的明确肯定。\u003c/p>\n\u003cp>it represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者对谷歌承诺的态度是怀疑。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 skepticism 在说作者不相信这些承诺，第八段 it represents 则直接断定声明具有什么作用，所以回看While引出的让步句和主句。\u003c/p>\n\u003cp>作者说声明vague，是指出表述还不具体；随后的 it represents 是肯定式断言，认定它代表一个起点。B的 skepticism 若要成立，评价应停在不相信承诺、怀疑其真假或作用上。这里却没有把含糊发展成不相信，反而用While先让一步，再保留起点价值。“还不够具体”与“我不相信它”表达的是不同态度，决定方向的是让步后面的明确肯定。\u003c/p>\n\u003cp>it represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第7、8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>While the statement is vague, it represents one starting point.\u003c/p>\n\u003cp>第7段列避免整体伤害、违法和侵犯人权的承诺；第8段虽承认声明含糊，主句仍把它视为一个起点。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The author doubts whether Google’s statement can serve as any meaningful starting point.\u003c/p>\n\u003cp>作者怀疑谷歌的声明能否成为有意义的起点。\u003c/p>\n\u003c/blockquote>\n\u003cp>怀疑应把起点价值置于不确定中。实际主句直接确认它代表一个起点，只对表述的清晰度保留意见，评价对象不能偷换。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Conscience of AI: Complex But Inevitable\u003cbr>人工智能的良知：复杂，但不可回避\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文支持从现在开始给AI施加伦理要求，对初步承诺应肯定其起步意义，同时保留尚不完善的限制；局部转折决定具体态度词。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>skepticism\u003cbr>怀疑\u003c/p>\n\u003c/blockquote>\n\u003cp>it represents没有否认作用，而是认可它已有起步意义，B把不足说明当成了最终态度。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：列出谷歌避免总体伤害、武器及违反法律和人权用途的承诺。承认声明含糊，仍肯定起点价值，并提出决定应可解释、公平等要求。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. respect\u003c/h3>\n\u003cblockquote>\n\u003cp>尊敬\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 respect 带有敬重的评价分量，第八段 one starting point 给出的则是对声明的具体程度限定，两边都在评价谷歌这一步，因此回看第一句的完整让步与主句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>这句话既说vague，又只把声明称为one starting point：它不够清楚，不过可以作为许多起步办法中的一个。C的 respect 把对这一步实用意义的认可提高到了敬重。作者没有把谷歌放到值得仰望的位置，也没有用它来代表卓越的道德表现；他马上又说另一种关于AI决定的想法也是起点。one starting point说
