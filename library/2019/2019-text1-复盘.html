const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| financial regulator | 金融监管机构 | Britain | n.英国 | impose | v.施加；实行 |\n| unusual | a.不寻常的 | rule | n.规定 | boss | n.负责人 |\n| guaranteed bonus | 有保证的奖金 | top executive | 高管 | delay | v.推迟 |\n| investigation | n.调查 | wrongdoing | n.不当行为 | main purpose | 主要目的 |\n| clawback | n.追回；追索 | hold accountable | 要求承担责任 | harmful risk-taking | 有害的冒险行为 |\n| restore public trust | 恢复公众信任 | financial institution | 金融机构 | official | n.官员 |\n| hope for | 期待 | benefit | n.好处 | long-term decision-making | 长期决策 |\n| corporation | n.公司 | build | v.建立 | stronger economy | 更强大的经济 |\n| future generation | 后代 |  |  |  |  |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 1重点词与语境","focus":[85,132,925,777],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\  精读与翻译","title":"第1段","level":3,"raw":"### 完整原文 · 第1段\n\nFinancial regulators in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this \"clawback\" rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions. Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,132,925,777],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-1-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Financial regulators in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this &quot;clawback&quot; rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions. Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 意群划分 · 第1段\n\nFinancial regulators in Britain / have imposed / a rather unusual rule / on the bosses of big banks.\n\nStarting next year, / any guaranteed bonus / of top executives / could be delayed 10 years / if their banks are under investigation / for wrongdoing.\n\nThe main purpo  / more long-term decisionmaking, / not only by banks / but by all corporations, / to build a stronger economy / for future generations.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 意群翻译 · 第1段\n\n英国的金融监管机构 / 已经实施了 / 一项相当不寻常的规则 / 对大型银行的老板们。\n\n从明年开始，/ 任何保证奖金 / 高管的 / 可能被延迟10年 / 如果他们的银行正在接受调查 / 因为不当行为。\n\n主要目的 / 这个\"追回\"规则的 / 是让银行家负责 / 对有害的冒险行为 / 并恢复公众信任 / 在金融机构中。\n\n然而官员们也希望 / 获得更大的好处：/ 更多长期决策，/ 不仅由银行 / 而且由所有公司，/ 来建立更强大的经济 / 为未来几代人。","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,132,925,777],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-1-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Financial regulators in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this &quot;clawback&quot; rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions. Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Financial regulators in Britain / have imposed / a rather unusual rule / on the bosses of big banks.\u003c/p>\n\u003cp>Starting next year, / any guaranteed bonus / of top executives / could be delayed 10 years / if their banks are under investigation / for wrongdoing.\u003c/p>\n\u003cp>The main purpose / of this &quot;clawback&quot; rule / is to hold bankers accountable / for harmful risk-taking / and to restore public trust / in financial institutions.\u003c/p>\n\u003cp>Yet officials also hope / for a much larger benefit: / more long-term decisionmaking, / not only by banks / but by all corporations, / to build a stronger economy / for future generations.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-2\">\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>英国的金融监管机构 / 已经实施了 / 一项相当不寻常的规则 / 对大型银行的老板们。\u003c/p>\n\u003cp>从明年开始，/ 任何保证奖金 / 高管的 / 可能被延迟10年 / 如果他们的银行正在接受调查 / 因为不当行为。\u003c/p>\n\u003cp>主要目的 / 这个&quot;追回&quot;规则的 / 是让银行家负责 / 对有害的冒险行为 / 并恢复公众信任 / 在金融机构中。\u003c/p>\n\u003cp>然而官员们也希望 / 获得更大的好处：/ 更多长期决策，/ 不仅由银行 / 而且由所有公司，/ 来建立更强大的经济 / 为未来几代人。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 标准译文 · 第1段\n\n英国金融监管机构对大型银行老板实施了一项相当不寻常的规则。从明年开始，如果银行因不当行为受到调查，高管的任何保证奖金都可能被延迟10年发放。这个\"追回\"规则的主要目的是让银行家对有害的冒险行为负责，并恢复公众对金融机构的信任。然而，官员们还希望获得更大的好处：促进不仅银行、而且所有公司进行更多长期决策，为子孙后代建立更强大的经济。","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,132,925,777],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-1-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Financial regulators in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this &quot;clawback&quot; rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions. Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.\u003c/p>\n\u003c/section>\u003cse },{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 完整原文 · 第6段\n\nMuch more could be done to encourage \"long-termism,\" such as changes in the tax code and quicker disclosure of stock acquisitions. In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3256,925,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-6-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Much more could be done to encourage &quot;long-termism,&quot; such as changes in the tax code and quicker disclosure of stock acquisitions. In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第6段","level":3,"raw":"### 意群划分 · 第6段\n\nMuch more could be done / to encourage \"long-termism,\" / such as changes in the tax code / and quicker disclosure / of stock acquisitions.\n\nIn France, / shareholders who hold onto / a company investment / for at least two years / can sometimes earn / more voting rights / in a company.","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[85,3256,925,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-6-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-6-0\">\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Much more could be done to encourage &quot;long-termism,&quot; such as changes in the tax code and quicker disclosure of sto  future generations)).\n\n### 第2段\n\n\"Short-termism\"：(or the desire for quick profits) → has worsened：(in publicly traded companies) → says the Bank of England's top economist：(Andrew Haldane).\n\nHe quotes → a giant of classical economics：(Alfred Marshall)：(in describing this financial impatience)：(as acting like：\"children who pick the plums out of their pudding：(to eat them at once)\" // rather than putting them aside：(to be eaten last)).\n\n### 第3段\n\nThe average time：(for holding a stock)：(in both the United States and Britain) → he notes → has dropped：(from seven years to seven months)：(in recent decades).\n\nTransient investors：(who demand high quarterly profits：(from companies)) → can hinder a firm's efforts：(to invest in long-term research + to build up customer loyalty).\n\nThis has been dubbed → \"quarterly capitalism.\"\n\n### 第4段\n\nIn addition → new digital technologies → have allowed：(more rapid trading of equities + quicker use of information + thus shorter attention spans：(in financial markets)).\n\n\"There seems to be → a predominance of short-term thinking：(at the expense of long-term investing)\" → said Commissioner Daniel Gallagher：(of the US Securities and Exchange Commission)：(in a speech this week).\n\n### 第5段\n\nIn the US → the Sarbanes-Oxley Act of 2002 → has pushed most public companies → to defer performance bonuses：(for senior executives)：(by about a year) → slightly helping reduce：(\"short-termism\").\n\nIn its latest survey：(of CEO pay) → The Wall Street Journal finds：(that \"a substantial part\"：(of executive pay) → is now tied to performance).\n\n### 第6段\n\nMuch more could be done：(to encourage \"long-termism\")：(such as changes in the tax code + quicker disclosure：(of stock acquisitions)).\n\nIn France → shareholders：(who hold onto → a company investment：(for at least two years)) → can sometimes earn → more voting rights：(in a company).\n\n### 第7段\n\nWithin companies → the right compensation design → can provide incentives：(for executives)：(to think beyond：(their own time at the company) + on behalf of：(all stakeholders)).\n\nBritain's new rule → is a reminder to bankers：(that society has an interest：(in their performance))：(not just for the short term + but for the long term).","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>Financial regulators in Britain → have imposed → a rather unusual rule：(on the bosses of big banks).\u003c/p>\n\u003cp>Starting next year → any guaranteed bonus：(of top executives) → could be delayed 10 years：(if their banks are under investigation：(for wrongdoing)).\u003c/p>\n\u003cp>The main purpose：(of this &quot;clawback&quot; rule) → is to hold bankers accountable：(for harmful risk-taking) + to restore public trust：(in financial institutions).\u003c/p>\n\u003cp>Yet officials also hope：(for a much larger benefit)：more long-term decisionmaking：(not only by banks + but by all corporations)：(to build a stronger economy：(for future generations)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>&quot;Short-termism&quot;：(or the desire for quick profits) → has worsened：(in publicly traded companies) → says the Bank of England&#39;s top economist：(Andrew Haldane).\u003c/p>\n\u003cp>He quotes → a giant of classical economics：(Alfred Marshall)：(in describing this financial impatience)：(as acting like：&quot;children who pick the plums out of their pudding：(to eat them at once)&quot; // rather than putting them aside：(to be eaten last)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>The average time：(for holding a stock)：(in both the United States and Britain) → he notes → has dropped：(from seven years to seven months)：(in recent decades).\u003c/p>\n\u003cp>Transient investors：(who demand high quarterly profits：(from companies)) → can hinder a firm&#39;s efforts：(to invest in long-term research + to build up customer loyalty).\u003c/p>\n\u003cp>This has been dubbed → &quot;quarterly capitalism.&quot;\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>In addition → new digital technologies → have allowed：(more rapid trading of equities + quicker use of information + thus shorter attention spans：(in financial markets)).\u003c/p>\n\u003cp>&quot;There seems to be → a predominance of short-term thinking：(at the expense of long-term investing)&quot; → said Commissioner Daniel Gallagher：(of the US Securities and Exchange Commission)：(in a speech this week).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>In the US → the Sarbanes-Oxley Act of 2002 → has pushed most public companies → to defer performance bonuses：(for senior executives)：(by about a year) → slightly helping reduce：(&quot;short-termism&quot;).\u003c/p>\n\u003cp>In its latest survey：(of CEO pay) → The Wall Street Journal finds：(that &quot;a substantial part&quot;：(of executive pay) → is now tied to performance).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Much more could be done：(to encourage &quot;long-termism&quot;)：(such as changes in the tax code + quicker disclosure：(of stock acquisitions)).\u003c/p>\n\u003cp>In France → shareholders：(who hold onto → a company investment：(for at least two years)) → can sometimes earn → more voting rights：(in a company).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>Within companies → the right compensation design → can provide incentives：(for executives)：(to think beyond：(their own time at the company) + on behalf of：(all stakeholders)).\u003c/p>\n\u003cp>Britain&#39;s new rule → is a reminder to bankers：(that society has an interest：(in their performance))：(not just for the short term + but for the long term).\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n英国的金融监管机构 → 已经实施了 → 一项相当不寻常的规则：(对大型银行的老板们)。\n\n从明年开始 → 任何保证奖金：(高管的) → 可能被延迟10年：(如果他们的银行正在接受调查：(因为不当行为))。\n\n主要目的：(这个\"追回\"规则的) → 是让银行家负责：(对有害的冒险行为) + 恢复公众信任：(在金融机构中)。\n\n然而官员们也希望：(获得更大的好处)：更多长期决策：(不仅由银行 + 而且由所有公司)：(来建立更强大的经济：(为未来几代人))。\n\n### 第2段\n\n\"短期主义\"：(或对快速利润的渴望) → 已经恶化了：(在上市公司中) → 英格兰银行的首席经济学家说：(安德鲁·霍尔丹)。\n\n他引用 → 古典经济学巨匠：(阿尔弗雷德·马歇尔)：(在描述这种金融急躁)：(就像：\"孩子们把李子从布丁里挑出来：(立即吃掉)\" // 而不是把它们放在一边：(最后再吃))。\n\n### 第3段\n\n平均时间：(持有股票的)：(在美国和英国) → 他指出 → 已经下降了：(从七年到七个月)：(在最近几十年)。\n\n短期投资者：(他们要求高季度利润：(从公司)) → 可能阻碍公司的努力：(投资长期研究 + 建立客户忠诚度)。\n\n这被称为 → \"季度资本主义\"。\n\n### 第4段\n\n此外 → 新的数字技术 → 已经允许：(更快速的股票交易 + 更快地使用信息 + 因此更短的注意力跨度：(在金融市场中))。\n\n\"似乎存在 → 短期思维的主导：(以长期投资为代价)\" → 专员丹尼尔·加拉格尔说：(美国证券交易委员会的)：(在本周的演讲中)。\n\n### 第5段\n\n在美国 → 2002年的萨班斯-奥克斯利法案 → 已经推动大多数上市公司 → 推迟绩效奖金：(给高级管理人员)：(大约一年) → 略微帮助减少：(\"短期主义\")。\n\n在其最新调查中：(关于CEO薪酬的) → 《华尔街日报》发现：(\"相当大的一部分\"：(高管薪酬的) → 现在与绩效挂钩)。\n\n### 第6段\n\n更多可以做的事：(来鼓励\"长期主义\")：(比如税法的改变 + 更快的披露：(股票收购的))。\n\n在法国 → 股东们：(持有 → 公司投资：(至少两年)) → 有时可以获得 → 更多投票权：(在公司中)。\n\n### 第7段\n\n在公司内部 → 正确的薪酬设计 → 可以提供激励：(给高管们)：(去思考超越：(他们自己在公司的时间) + 代表：(所有利益相关者))。\n\n英国的新规则 → 是对银行家的提醒：(社会有利益关系：(在他们的表现中))：(不仅是短期的 + 而且是长期的)。","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>英国的金融监管机构 → 已经实施了 → 一项相当不寻常的规则：(对大型银行的老板们)。\u003c/p>\n\u003cp>从明年开始 → 任何保证奖金：(高管的) → 可能被延迟10年：(如果他们的银行正在接受调查：(因为不当行为))。\u003c/p>\n\u003cp>主要目的：(这个&quot;追回&quot;规则的) → 是让银行家负责：(对有害的冒险行为) + 恢复公众信任：(在金融机构中)。\u003c/p>\n\u003cp>然而官员们也希望：(获得更大的好处)：更多长期决策：(不仅由银行 + 而且由所有公司)：(来建立更强大的经济：(为未来几代人))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>&quot;短期主义&quot;：(或对快速利润的渴望) → 已经恶化了：(在上市公司中) → 英格兰银行的首席经济学家说：(安德鲁·霍尔丹)。\u003c/p>\n\u003cp>他引用 → 古典经济学巨匠：(阿尔弗雷德·马歇尔)：(在描述这种金融急躁)：(就像：&quot;孩子们把李子从布丁里挑出来：(立即吃掉)&quot; // 而不是把它们放在一边：(最后再吃))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>平均时间：(持有股票的)：(在美国和英国) → 他指出 → 已经下降了：(从七年到七个月)：(在最近几十年)。\u003c/p>\n\u003cp>短期投资者：(他们要求高季度利润：(从公司)) → 可能阻碍公司的努力：(投资长期研究 + 建立客户忠诚度)。\u003c/p>\n\u003cp>这被称为 → &quot;季度资本主义&quot;。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>此外 → 新的数字技术 → 已经允许：(更快速的股票交易 + 更快地使用信息 + 因此更短的注意力跨度：( 什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"25题 · 题干、题型与核心出处","level":2,"raw":"## 25题\n\n**Which of the following would be the best title for the text?**\n\n下面哪一个最适合作为全文标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Decisiveness Required of Top Executives**\n\n要求高管具备决断力\n\nB. **Failure of Quarterly Capitalism**\n\n季度资本主义的失败\n\nC. **Patience as a Corporate Virtue**\n\n耐心是一种企业美德\n\nD. **Frustration of Risk-taking Bankers**\n\n冒险银行家的挫败感\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 新规约束银行行为，也期待公司多作长期决策 | 先摆出新做法并提出长远期待 |\n| 第2段 | 点出短期逐利加重，用孩子先吃作比较 | 再说问题正在加重并打个比方 |\n| 第3段 | 持股变短，季度逐利会阻碍公司长期投入 | 再说行为变短后会妨碍长远的事 |\n| 第4段 | 数字技术加速交易，短期思考损害长期投资 | 再说还有什么使问题加重 |\n| 第5段 | 介绍美国通过高管奖金减少短期主义的尝试 | 举一个例子说明已经怎样改善 |\n| 第6段 | 提出更多鼓励长期的做法，再举法国奖励 | 接着补充还能怎样继续改善 |\n| 第7段 | 回到新规，强调公司行为关乎社会长期利益 | 最后收回来说明大家的长远要求 |","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"question":"25","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一个最适合作为全文标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Decisiveness Required of Top Executives\u003c/strong>\u003c/p>\n\u003cp>要求高管具备决断力\u003c/p>\n\u003cp>B. \u003cstrong>Failure of Quarterly Capitalism\u003c/strong>\u003c/p>\n\u003cp>季度资本主义的失败\u003c/p>\n\u003cp>C. \u003cstrong>Patience as a Corporate Virtue\u003c/strong>\u003c/p>\n\u003cp>耐心是一种企业美德\u003c/p>\n\u003cp>D. \u003cstrong>Frustration of Risk-taking Bankers\u003c/strong>\u003c/p>\n\u003cp>冒险银行家的挫败感\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>新规约束银行行为，也期待公司多作长期决策\u003c/td>\n\u003ctd>先摆出新做法并提出长远期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>点出短期逐利加重，用孩子先吃作比较\u003c/td>\n\u003ctd>再说问题正在加重并打个比方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>持股变短，季度逐利会阻碍公司长期投入\u003c/td>\n\u003ctd>再说行为变短后会妨碍长远的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>数字技术加速交易，短期思考损害长期投资\u003c/td>\n\u003ctd>再说还有什么使问题加重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍美国通过高管奖金减少短期主义的尝试\u003c/td>\n\u003ctd>举一个例子说明已经怎样改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>提出更多鼓励长期的做法，再举法国奖励\u003c/td>\n\u003ctd>接着补充还能怎样继续改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>回到新规，强调公司行为关乎社会长期利益\u003c/td>\n\u003ctd>最后收回来说明大家的长远要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. Decisiveness Required of Top Executives","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### A. Decisiveness Required of Top Executives\n\n要求高管具备决断力","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"A"},"focusId":"focus-q25-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>要求高管具备决断力\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. Decisiveness Required of Top Executives","level":3,"raw":"#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n要求高管具备决断力\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先介绍要求高管作出明确而坚定决策的新规定，并期待这种决断力支持企业的长远发展。 | 先摆出新做法并提出长远期待 |\n| 第2段 | 说明高管左右摇摆、无法坚持决定的现象正在加重，比作孩子面对食物反复改变主意。 | 再说问题正在加重并打个比方 |\n| 第3段 | 指出高管的承诺期限越来越短，尚未执行就推翻决定，使需要持续投入的长期项目受阻。 | 再说行为变短后会妨碍长远的事 |\n| 第4段 | 补充即时信息和密集评价使高管更易随外部声音改主意，进一步削弱坚定决断。 | 再说还有什么使问题加重 |\n| 第5段 | 介绍美国把决策责任与考核结合的安排，说明它已使高管更敢作出并执行决定。 | 举一个例子说明已经怎样改善 |\n| 第6段 | 再提出完善授权和评价机制，以法国减少决策反复的安排说明还可怎样加强决断力。 | 接着补充还能怎样继续改善 |\n| 第7段 | 回到开头的新要求，强调社会长期利益需要高管在充分考虑后作出坚定决定。 | 最后收回来说明大家的长远要求 |\n\n如果中心是Decisiveness，文章需要围绕“拿不定主意—怎样果断作决定”展开。实际第2、3段批评的却是想快拿利润、持股时间缩短，并不是犹豫太久；第4段还把交易更快与注意持续时间更短连在一起，这种加快在这里使问题更重。第5、6段调整奖金和持有较久才多得权利，也是在把经营者和股东的眼光拉远。结尾要求看任期以外和社会长期利益，而不是催高管更快拍板。高管确实出现了，但文章关注决定考虑多长时间，A关注决定作得是否果断，两条主线并不相同。\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"A"},"focusId":"focus-q25-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>要求高管具备决断力\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-A-1\">\u003ch4>如果 A 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>要求高管具备决断力\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先介绍要求高管作出明确而坚定决策的新规定，并期待这种决断力支持企业的长远发展。\u003c/td>\n\u003ctd>先摆出新做法并提出长远期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明高管左右摇摆、无法坚持决定的现象正在加重，比作孩子面对食物反复改变主意。\u003c/td>\n\u003ctd>再说问题正在加重并打个比方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出高管的承诺期限越来越短，尚未执行就推翻决定，使需要持续投入的长期项目受阻。\u003c/td>\n\u003ctd>再说行为变短后会妨碍长远的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>补充即时信息和密集评价使高管更易随外部声音改主意，进一步削弱坚定决断。\u003c/td>\n\u003ctd>再说还有什么使问题加重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍美国把决策责任与考核结合的安排，说明它已使高管更敢作出并执行决定。\u003c/td>\n\u003ctd>举一个例子说明已经怎样改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>再提出完善授权和评价机制，以法国减少决策反复的安排说明还可怎样加强决断力。\u003c/td>\n\u003ctd>接着补充还能怎样继续改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>回到开头的新要求，强调社会长期利益需要高管在充分考虑后作出坚定决定。\u003c/td>\n\u003ctd>最后收回来说明大家的长远要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>如果中心是Decisiveness，文章需要围绕“拿不定主意—怎样果断作决定”展开。实际第2、3段批评的却是想快拿利润、持股时间缩短，并不是犹豫太久；第4段还把交易更快与注意持续时间更短连在一起，这种加快在这里使问题更重。第5、6段调整奖金和持有较久才多得权利，也是在把经营者和股东的眼光拉远。结尾要求看任期以外和社会长期利益，而不是催高管更快拍板。高管确实出现了，但文章关注决定考虑多长时间，A关注决定作得是否果断，两条主线并不相同。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Failure of Quarterly Capitalism","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### B. Failure of Quarterly Capitalism\n\n季度资本主义的失败","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"B"},"focusId":"focus-q25-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>季度资本主义的失败\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Failure of Quarterly Capitalism","level":3,"raw":"#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n季度资本主义的失败\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先介绍修补季度资本主义缺陷的新制度，期待纠正这种失败的经营导向并保护长期经济。 | 先摆出新做法并提出长远期待 |\n| 第2段 | 说明季度考核的失灵越来越严重，比作只顾抢吃眼前食物而破坏整顿饭安排。 | 再说问题正在加重并打个比方 |\n| 第3段 | 指出投资期限不断缩短，使企业牺牲长期研究，具体展现季度资本主义无法承担长期建设。 | 再说行为变短后会妨碍长远的事 |\n| 第4段 | 解释高速交易又放大季度指标压力，使这种模式的短视缺陷进一步暴露。 | 再说还有什么使问题加重 |\n| 第5段 | 举美国延缓兑现绩效奖励的改革，说明已有办法开始修补季度资本主义的失败之处。 | 举一个例子说明已经怎样改善 |\n| 第6段 | 补充法国奖励长期持股等替代激励，说明针对这种模式失灵还应继续改进。 | 接着补充还能怎样继续改善 |\n| 第7段 | 总结季度导向的失败不能再由社会承担，制度调整应恢复企业服务长远利益的能力。 | 最后收回来说明大家的长远要求 |\n\n“quarterly capitalism”出现在第3段，确实与公司只顾季度利润的现象相关。但B把全文中心定成Failure，要求作者证明这套模式失败。文章从英国新规的长远期待写起，第2至4段解释为什么短期逐利值得担忧，第5、6段转向已经采取和还能采取的改善做法，第7段再说社会对公司长期行为的要求。它没有把美国和法国写成某种经济模式已经失败的证据，而是把它们写成鼓励长期的安排。B能覆盖中间对短期做法的批评，却把正文中很大一部分“可以怎样改”压成了失败的例证。\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"B"},"focusId":"focus-q25-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>季度资本主义的失败\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-B-1\">\u003ch4>如果 B 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>季度资本主义的失败\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先介绍修补季度资本主义缺陷的新制度，期待纠正这种失败的经营导向并保护长期经济。\u003c/td>\n\u003ctd>先摆出新做法并提出长远期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明季度考核的失灵越来越严重，比作只顾抢吃眼前食物而破坏整顿饭安排。\u003c/td>\n\u003ctd>再说问题正在加重并打个比方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出投资期限不断缩短，使企业牺牲长期研究，具体展现季度资本主义无法承担长期建设。\u003c/td>\n\u003ctd>再说行为变短后会妨碍长远的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释高速交易又放大季度指标压力，使这种模式的短视缺陷进一步暴露。\u003c/td>\n\u003ctd>再说还有什么使问题加重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举美国延缓兑现绩效奖励的改革，说明已有办法开始修补季度资本主义的失败之处。\u003c/td>\n\u003ctd>举一个例子说明已经怎样改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>补充法国奖励长期持股等替代激励，说明针对这种模式失灵还应继续改进。\u003c/td>\n\u003ctd>接着补充还能怎样继续改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>总结季度导向的失败不能再由社会承担，制度调整应恢复企业服务长远利益的能力。\u003c/td>\n\u003ctd>最后收回来说明大家的长远要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>“quarterly capitalism”出现在第3段，确实与公司只顾季度利润的现象相关。但B把全文中心定成Failure，要求作者证明这套模式失败。文章从英国新规的长远期待写起，第2至4段解释为什么短期逐利值得担忧，第5、6段转向已经采取和还能采取的改善做法，第7段再说社会对公司长期行为的要求。它没有把美国和法国写成某种经济模式已经失败的证据，而是把它们写成鼓励长期的安排。B能覆盖中间对短期做法的批评，却把正文中很大一部分“可以怎样改”压成了失败的例证。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Patience as a Corporate Virtue","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### C. Patience as a Corporate Virtue\n\n耐心是一种企业美德","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"C"},"focusId":"focus-q25-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>耐心是一种企业美德\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Patience as a Corporate Virtue","level":3,"raw":"#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n耐心是一种企业美德\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 介绍让奖金承担长期后果的新规则，期待银行及其他公司愿意等待长期回报。 | 先摆出新做法并提出长远期待 |\n| 第2段 | 说明急于兑现利润的倾向加重，以孩子先吃李子的比喻表现企业缺乏耐心。 | 再说问题正在加重并打个比方 |\n| 第3段 | 用持股时间变短说明缺乏耐心如何挤压长期研究和顾客关系建设。 | 再说行为变短后会妨碍长远的事 |\n| 第4段 | 解释数字交易提速使人们更难等待，进一步强化应以耐心保护长期投资的理由。 | 再说还有什么使问题加重 |\n| 第5段 | 介绍美国延缓高管奖金的做法，说明激励制度已经开始奖励更有耐心的企业行为。 | 举一个例子说明已经怎样改善 |\n| 第6段 | 提出税制与披露等进一步安排，并以法国长期持股奖励说明耐心还可怎样得到支持。 | 接着补充还能怎样继续改善 |\n| 第7段 | 回到社会关心长期表现的要求，把耐心确立为企业应为各方利益保持的品质。 | 最后收回来说明大家的长远要求 |\n\nPatience不是让公司什么都不做，而是在公司的决定中愿意等待并顾及长远。第1段希望更多long-term decision-making，第2段把急着得利比作孩子马上吃，第3、4段说明这种急迫怎样影响长期投入；这几步把为什么需要耐心说清。第5、6段接着写奖金、较久持有与更多权利，把“如何鼓励长期行为”接上来。最后社会关注的不只是短期表现，还有长期表现，正好回到耐心为什么是公司应有的品质。Corporate也覆盖银行、公司高管和股东这些对象，没有把全文只缩到一类银行家。\n\n判断：\n\n**C 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"C"},"focusId":"focus-q25-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>耐心是一种企业美德\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-C-1\">\u003ch4>如果 C 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>耐心是一种企业美德\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>介绍让奖金承担长期后果的新规则，期待银行及其他公司愿意等待长期回报。\u003c/td>\n\u003ctd>先摆出新做法并提出长远期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明急于兑现利润的倾向加重，以孩子先吃李子的比喻表现企业缺乏耐心。\u003c/td>\n\u003ctd>再说问题正在加重并打个比方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>用持股时间变短说明缺乏耐心如何挤压长期研究和顾客关系建设。\u003c/td>\n\u003ctd>再说行为变短后会妨碍长远的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释数字交易提速使人们更难等待，进一步强化应以耐心保护长期投资的理由。\u003c/td>\n\u003ctd>再说还有什么使问题加重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍美国延缓高管奖金的做法，说明激励制度已经开始奖励更有耐心的企业行为。\u003c/td>\n\u003ctd>举一个例子说明已经怎样改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>提出税制与披露等进一步安排，并以法国长期持股奖励说明耐心还可怎样得到支持。\u003c/td>\n\u003ctd>接着补充还能怎样继续改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>回到社会关心长期表现的要求，把耐心确立为企业应为各方利益保持的品质。\u003c/td>\n\u003ctd>最后收回来说明大家的长远要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Patience不是让公司什么都不做，而是在公司的决定中愿意等待并顾及长远。第1段希望更多long-term decision-making，第2段把急着得利比作孩子马上吃，第3、4段说明这种急迫怎样影响长期投入；这几步把为什么需要耐心说清。第5、6段接着写奖金、较久持有与更多权利，把“如何鼓励长期行为”接上来。最后社会关注的不只是短期表现，还有长期表现，正好回到耐心为什么是公司应有的品质。Corporate也覆盖银行、公司高管和股东这些对象，没有把全文只缩到一类银行家。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Frustration of Risk-taking Bankers","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### D. Frustration of Risk-taking Bankers\n\n冒险银行家的挫败感","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"D"},"focusId":"focus-q25-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>冒险银行家的挫败感\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Frustration of Risk-taking Bankers","level":3,"raw":"#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n冒险银行家的挫败感\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先介绍针对冒险银行家受挫情绪的新应对办法，并期待他们恢复稳定的长期工作状态。 | 先摆出新做法并提出长远期待 |\n| 第2段 | 说明奖金受限后的挫败感正在加重，把他们的失落比作孩子期待落空后的不满。 | 再说问题正在加重并打个比方 |\n| 第3段 | 指出受挫银行家将工作承诺缩短为眼前得失，使原本需要坚持的长期项目受到妨碍。 | 再说行为变短后会妨碍长远的事 |\n| 第4段 | 再解释即时评价和高速信息传播使银行家更频繁感到失败，加重这种挫折体验。 | 再说还有什么使问题加重 |\n| 第5段 | 举美国通过更明确的评价与反馈缓解银行家挫败情绪的例子，交代已有改善。 | 举一个例子说明已经怎样改善 |\n| 第6段 | 补充法国提供长期支持与申诉渠道的安排，说明还可怎样帮助冒险银行家处理受挫感。 | 接着补充还能怎样继续改善 |\n| 第7段 | 回到银行家如何走出挫败的问题，指出社会需要他们恢复能够顾及长远的心理状态。 | 最后收回来说明大家的长远要求 |\n\n第1段有bankers和harmful risk-taking，新规还可能延后高管奖金，D因此看起来碰到了开头的一些词。可Frustration要求文章以银行家的受挫感受为中心，实际后面写的是上市公司、投资者、数字交易以及政策安排，没有继续描写银行家失望、不满或受挫的心理。第6段的法国例子甚至以股东持有时间和投票权为内容，第7段讨论的是社会对银行家长期表现的利益关切。D不但把公司范围缩成冒险银行家，也把行为规则和长期后果改成他们自己的情绪。\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"D"},"focusId":"focus-q25-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>冒险银行家的挫败感\u003c/p>\n\u003c/section>\u003cse l":"2019英语一Text 1题目"},"meta":{"question":"25","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>25. C. Patience as a Corporate Virtue\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Patience as a Corporate Virtue / 耐心是一种企业美德\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"21题 · 题干、题型与核心出处","level":2,"raw":"## 21题\n\n> According to Paragraph 1, one motive in imposing the new rule is to ______.  \n> 根据第1段，实行这条新规则的一个动机是什么？\n\n### 题型\n\n目的细节题。题干要求判断“根据第1段，实行这条新规则的一个动机是什么？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Financial regulators in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this \"clawback\" rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions. Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.\n\n规则把奖金延期与银行的不当冒险联系起来，明确写出要求银行家负责、恢复信任，并希望公司作更多长期决策。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"question":"21","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>According to Paragraph 1, one motive in imposing the new rule is to ______.\u003cbr>根据第1段，实行这条新规则的一个动机是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>目的细节题。题干要求判断“根据第1段，实行这条新规则的一个动机是什么？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Financial regulators in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this &quot;clawback&quot; rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions. Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.\u003c/p>\n\u003c/blockquote>\n\u003cp>规则把奖金延期与银行的不当冒险联系起来，明确写出要求银行家负责、恢复信任，并希望公司作更多长期决策。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. guarantee the bonuses of top executives","level":3,"raw":"### A. guarantee the bonuses of top executives\n\n> 保证高管的奖金\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 guarantee the bonuses 是“保证奖金”，原文的 could be delayed 10 years 则在说明这些奖金会怎样处理；两边说的是同一笔高管奖金，所以回看从 Starting next year 开始的句子。\n\n**错误类型：第一类——歪曲原意。**\n\n原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。could be delayed 10 years 给的是限制和延期，并没有把发放奖金当作需要保护的目标。A的 guarantee the bonuses 则把这条规则说成保证高管奖金的措施；一个在出现问题时扣住奖金，一个以保证奖金为目的，奖金相同，规则对奖金做的事却变了。\n\n高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。\n\n**命题人借用的原文材料：**\n\n> Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing.","context":{"mode":"image","asset":"questions","focus":[250,337,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"21","option":"A"},"focusId":"focus-q21-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-A-0\">\u003cblockquote>\n\u003cp>保证高管的奖金\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 guarantee the bonuses 是“保证奖金”，原文的 could be delayed 10 years 则在说明这些奖金会怎样处理；两边说的是同一笔高管奖金，所以回看从 Starting next year 开始的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。could be delayed 10 years 给的是限制和延期，并没有把发放奖金当作需要保护的目标。A的 g 同一笔高管奖金，所以回看从 Starting next year 开始的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。could be delayed 10 years 给的是限制和延期，并没有把发放奖金当作需要保护的目标。A的 guarantee the bonuses 则把这条规则说成保证高管奖金的措施；一个在出现问题时扣住奖金，一个以保证奖金为目的，奖金相同，规则对奖金做的事却变了。\u003c/p>\n\u003cp>高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>英国实行这条新规则的一个动机是保证高管的奖金。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 guarantee the bonuses 是“保证奖金”，原文的 could be delayed 10 years 则在说明这些奖金会怎样处理；两边说的是同一笔高管奖金，所以回看从 Starting next year 开始的句子。\u003c/p>\n\u003cp>原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。could be delayed 10 years 给的是限制和延期，并没有把发放奖金当作需要保护的目标。A的 guarantee the bonuses 则把这条规则说成保证高管奖金的措施；一个在出现问题时扣住奖金，一个以保证奖金为目的，奖金相同，规则对奖金做的事却变了。\u003c/p>\n\u003cp>高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing.\u003c/p>\n\u003cp>规则把奖金延期与银行的不当冒险联系起来，明确写出要求银行家负责、恢复信任，并希望公司作更多长期决策。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：新规约束银行行为，也期待公司多作长期决策。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new rule is intended to guarantee that top executives receive their bonuses.\u003c/p>\n\u003cp>新规则旨在保证高管拿到奖金。\u003c/p>\n\u003c/blockquote>\n\u003cp>如果保证发奖金是目的，作者应说明规则如何保护奖金领取。实际在银行被调查时可以延后十年，奖金是约束冒险的工具，不能把限制发放写成保证领取。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. guarantee the bonuses of top executives","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Patience as a Corporate Virtue  \n> 耐心是一种企业美德\n\n把这个主旨直接代入21题题干：\n\n> 耐心与长期责任是全文方向，因此规则应约束只顾眼前的行为；具体动机仍须由第1段的问责和恢复信任来确定。\n\nA实际说的是：\n\n> guarantee the bonuses of top executives  \n> 保证高管的奖金\n\n高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。\n\n从全文推进看，这一处的作用是：新规约束银行行为，也期待公司多作长期决策\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,337,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"21","option":"A"},"focusId":"focus-q21-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-A-0\">\u003cblockquote>\n\u003cp>保证高管的奖金\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 guarantee the bonuses 是“保证奖金”，原文的 could be delayed 10 years 则在说明这些奖金会怎样处理；两边说的是同一笔高管奖金，所以回看从 Starting next year 开始的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。could be delayed 10 years 给的是限制和延期，并没有把发放奖金当作需要保护的目标。A的 guarantee the bonuses 则把这条规则说成保证高管奖金的措施；一个在出现问题时扣住奖金，一个以保证奖金为目的，奖金相同，规则对奖金做的事却变了。\u003c/p>\n\u003cp>高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>英国实行这条新规则的一个动机是保证高管的奖金。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 guarantee t 。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.\u003c/p>\n\u003cp>规则把奖金延期与银行的不当冒险联系起来，明确写出要求银行家负责、恢复信任，并希望公司作更多长期决策。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：新规约束银行行为，也期待公司多作长期决策。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Officials introduced the rule so that corporations could earn larger profits.\u003c/p>\n\u003cp>官员出台规则，是为了让公司赚取更大利润。\u003c/p>\n\u003c/blockquote>\n\u003cp>假设将收益落到公司利润上，后文应证明盈利增长。实际冒号解释的benefit是长期决策和后代的经济，不是把larger与profits重新拼成企业获利目标。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>耐心与长期责任是全文方向，因此规则应约束只顾眼前的行为；具体动机仍须由第1段的问责和恢复信任来确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>help corporations achieve larger profits\u003cbr>帮助公司获得更大利润\u003c/p>\n\u003c/blockquote>\n\u003cp>公司是被要求作长期决策的主体，未来几代人的经济才是后面指出的目的；D把这两个位置合成了公司利润增加。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：新规约束银行行为，也期待公司多作长期决策\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"21题结论","level":2,"raw":"### 21题结论\n\n> **21. B. enhance bankers’ sense of responsibility**\n\nA：原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。\n\nB：先看hold bankers accountable for harmful risk-taking：被要求负责的是银行家，责任指向有害冒险造成的后果。\n\nC：原文先给出 a rather unusual rule，再说明它约束的是大银行老板，具体涉及奖金以及有害冒险行为。\n\nD：原文用冒号解释 a much larger benefit：银行和所有公司作出更多长期决策，为未来几代人建立更强的经济。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"question":"21","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>21. B. enhance bankers’ sense of responsibility\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。\u003c/p>\n\u003cp>B：先看hold bankers accountable for harmful risk-taking：被要求负责的是银行家，责任指向有害冒险造成的后果。\u003c/p>\n\u003cp>C：原文先给出 a rather unusual rule，再说明它约束的是大银行老板，具体涉及奖金以及有害冒险行为。\u003c/p>\n\u003cp>D：原文用冒号解释 a much larger benefit：银行和所有公司作出更多长期决策，为未来几代人建立更强的经济。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"22题 · 题干、题型与核心出处","level":2,"raw":"## 22题\n\n> Alfred Marshall is quoted to indicate ______.  \n> 引用Alfred Marshall的话，是为了说明什么？\n\n### 题型\n\n例子作用题。题干要求判断“引用Alfred Marshall的话，是为了说明什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> \"Short-termism\" or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England's top economist, Andrew Haldane. He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like \"children who pick the plums out of their pudding to eat them at once\" rather than putting them aside to be eaten last.\n\n先提出上市公司追逐快速利润的问题加重，再用孩子先把好吃的东西挑走的比喻，解释金融上的急躁。","context":{"mode":"image","asset":"questions","focus":[250,753,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"question":"22","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Alfred Marshall is quoted to indicate ______.\u003cbr>引用Alfred Marshall的话，是为了说明什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>例子作用题。题干要求判断“引用Alfred Marshall的话，是为了说明什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane. He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like &quot;children who pick the plums out of their pudding to eat them at once&quot; rather than putting them aside to be eaten last.\u003c/p>\n\u003c/blockquote>\n\u003cp>先提出上市公司追逐快速利润的问题加重，再用孩子先把好吃的东西挑走的比喻，解释金融上的急躁。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. the solid structure of publicly traded companies","level":3,"raw":"### A. the solid structure of publicly traded companies\n\n> 上市公司稳固的结构\n\n**做题模式中的状态：** 第一轮A排除。当时选项呈现为“the [xxx] structure of publicly traded companies”，保留了相应遮挡。当时的定位线索是：A的 structure of publicly traded companies 和原文 in publicly traded companies 都提到上市公司，所以回到第2段第一句；紧接着再看 acting like children 的比较，区分原文谈的是公司结构还是追求利润的行为。\n\n**错误类型：第三类——无中生有。**\n\n原文 in publicly traded companies 交代现象发生在哪里，现象本身是 the desire for quick profits，接着借孩子马上吃东西的动作描述它。A的 structure of publicly traded companies 却把要描述的对象变成上市公司的结构。孩子先吃还是后吃，对应的是取舍和等待，无法对应公司内部怎样组成、层级怎样安排。\n\n上市公司在原文里是短期逐利现象所在的地方，并不是引语要解释的组成结构。\n\n**命题人借用的原文材料：**\n\n> \"Short-termism\" or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England's top economist, Andrew Haldane.\n>\n> He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like \"children who pick the plums out of their pudding to eat them at once\" rather than putting them aside to be eaten last.","context":{"mode":"image","asset":"questions","focus":[250,847,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"22","option":"A"},"focusId":"focus-q22-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-A-0\">\u003cblockquote>\n\u003cp>上市公司稳固的结构\u003c/p>\n\u003c/blockquote>\n\u003  · 题目复盘","title":"A. the solid structure of publicly traded companies","level":4,"raw":"#### 写作视角法\n\n原文第2段是这样写的：\n\n> \"Short-termism\" or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England's top economist, Andrew Haldane.\n>\n> He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like \"children who pick the plums out of their pudding to eat them at once\" rather than putting them aside to be eaten last.\n>\n> 先提出上市公司追逐快速利润的问题加重，再用孩子先把好吃的东西挑走的比喻，解释金融上的急躁。\n\n把这一处放回全文，它承担的写作任务是：点出短期逐利加重，用孩子先吃作比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Marshall’s comparison shows how solid the structure of publicly traded companies is.\n>\n> 马歇尔的比喻说明上市公司的结构多么稳固。\n\n若为稳固结构服务，孩子与布丁的细节应对应公司组织如何稳定。实际对应的是先吃还是留到最后，比较维度是耐心和利益兑现时间。","context":{"mode":"image","asset":"questions","focus":[250,847,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"22","option":"A"},"focusId":"focus-q22-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-A-0\">\u003cblockquote>\n\u003cp>上市公司稳固的结构\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时选项呈现为“the [xxx] structure of publicly traded companies”，保留了相应遮挡。当时的定位线索是：A的 structure of publicly traded companies 和原文 in publicly traded companies 都提到上市公司，所以回到第2段第一句；紧接着再看 acting like children 的比较，区分原文谈的是公司结构还是追求利润的行为。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 in publicly traded companies 交代现象发生在哪里，现象本身是 the desire for quick profits，接着借孩子马上吃东西的动作描述它。A的 structure of publicly traded companies 却把要描述的对象变成上市公司的结构。孩子先吃还是后吃，对应的是取舍和等待，无法对应公司内部怎样组成、层级怎样安排。\u003c/p>\n\u003cp>上市公司在原文里是短期逐利现象所在的地方，并不是引语要解释的组成结构。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane.\u003c/p>\n\u003cp>He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like &quot;children who pick the plums out of their pudding to eat them at once&quot; rather than putting them aside to be eaten last.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者引用阿尔弗雷德·马歇尔，是为了说明上市公司稳固的结构。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 structure of publicly traded companies 和原文 in publicly traded companies 都提到上市公司，所以回到第2段第一句；紧接着再看 acting like children 的比较，区分原文谈的是公司结构还是追求利润的行为。\u003c/p>\n\u003cp>原文 in publicly traded companies 交代现象发生在哪里，现象本身是 the desire for quick profits，接着借孩子马上吃东西的动作描述它。A的 structure of publicly traded companies 却把要描述的对象变成上市公司的结构。孩子先吃还是后吃，对应的是取舍和等待，无法对应公司内部怎样组成、层级怎样安排。\u003c/p>\n\u003cp>上市公司在原文里是短期逐利现象所在的地方，并不是引语要解释的组成结构。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane.\u003c/p>\n\u003cp>He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like &quot;children who pick the plums out of their pudding to eat them at once&quot; rather than putting them aside to be eaten last.\u003c/p>\n\u003cp>先提出上市公司追逐快速利润的问题加重，再用孩子先把好吃的东西挑走的比喻，解释金融上的急躁。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：点出短期逐利加重，用孩子先吃作比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Marshall’s comparison shows how solid the structure of publicly traded
