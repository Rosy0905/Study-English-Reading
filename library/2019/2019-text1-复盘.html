re voting rights in a company.\u003c/p>\n\u003cp>美国把高管绩效奖金延后，法国给持股至少两年的股东更多表决权，两处都把激励与更长的时间联系起来。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：介绍美国通过高管奖金减少短期主义的尝试。提出更多鼓励长期的做法，再举法国奖励。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The US and French cases reveal barriers that prevent efforts to reduce short-termism.\u003c/p>\n\u003cp>美国和法国的例子揭示了阻止减少短期主义的障碍。\u003c/p>\n\u003c/blockquote>\n\u003cp>障碍路线要求例子呈现改革受到什么阻挠。实际一个是已略有帮助的法案，另一个是可继续实施的奖励；把它们当障碍，改反了例子的作用方向。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>企业耐心需要制度激励，两个国家的例子应回答可以通过哪些办法鼓励长期行为，而不仅重述短期主义存在或长期思维值得重视。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the obstacles to preventing “short-termism”\u003cbr>防止短期主义的障碍\u003c/p>\n\u003c/blockquote>\n\u003cp>帮助小仍是帮助，奖励也在鼓励长期行为，D把这两个例子的作用方向反了过来。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍美国通过高管奖金减少短期主义的尝试提出更多鼓励长期的做法，再举法国奖励\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>24题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>24. A. the approaches to promoting “long-termism”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：approaches在这里指实现目标的途径。\u003c/p>\n\u003cp>B：原文的 helping reduce “short-termism” 写美国采取措施以后减少了一些短期主义，法国则把更多投票权交给至少持有两年的股东，写的是怎样使人愿意持有更久。\u003c/p>\n\u003cp>C：significance指重要性。\u003c/p>\n\u003cp>D：原文的 slightly helping reduce 承认美国措施的帮助不大，但 helping reduce 仍是发挥了减少短期主义的作用。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：英国金融监管新规的内容与目的\u003c/strong>（段落1核心介绍） 新规内容：（高管奖金可延迟10年发放，如果银行涉嫌不当行为）→ 直接目的：【让银行家对冒险行为负责 + 恢复公众信任】→ 更大目标：促进所有公司的长期决策，建立更强大的经济\u003c/p>\n\u003cp>↓（问题分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：短期主义问题的严重性\u003c/strong>（段落2-3问题阐述） 短期主义恶化：（霍尔丹引用马歇尔比喻：像孩子急于吃掉布丁中的李子）→ 具体表现：【持股时间从7年降至7个月 → 短期投资者要求高季度利润 → 阻碍长期研究和客户忠诚度建设】→ 被称为&quot;季度资本主义&quot;\u003c/p>\n\u003cp>→（加剧因素）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：技术发展加剧短期主义\u003c/strong>（段落4技术影响） 数字技术的影响：（更快速的股票交易 + 更快的信息使用 → 更短的注意力跨度）→ SEC专员观点：短期思维占主导，以长期投资为代价\u003c/p>\n\u003cp>↓（应对措施）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：各国促进长期主义的措施\u003c/strong>（段落5-6解决方案） 美国措施：萨班斯-奥克斯利法案（推迟奖金约一年）→ 效果：略微减少短期主义 + 更多待做：【税法改变 + 更快披露股票收购】→ 法国经验：持股两年以上可获更多投票权\u003c/p>\n\u003cp>↓（深层意义）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：薪酬设计与社会责任\u003c/strong>（段落7总结升华） 公司内部：正确的薪酬设计激励高管为所有利益相关者考虑 → 英国新规的意义：提醒银行家社会关注其长期表现，而非仅仅短期\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：通过金融监管新规（如英国的奖金延迟规则）和其他制度设计，可以抑制有害的短期主义，促进长期思维，从而为未来建立更强大、更可持续的经济体系。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. When Faster Trading Shortens Attention\u003c/p>\n\u003cp>B. Improving the Speed of Financial Reporting\u003c/p>\n\u003cp>C. Replacing All Bonuses with Fixed Salaries\u003c/p>\n\u003cp>D. Extending Responsibility Beyond a Manager’s Tenure\u003c/p>\n\u003cp>E. Giving Patient Ownership a Practical Advantage\u003c/p>\n\u003cp>F. Investors Who Leave Before Value Matures\u003c/p>\n\u003cp>G. Making Rewards Answerable to Future Results\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A large bonus can reward a decision before anyone knows whether it was wise. A bank may report a profit from a risky investment this year, while the losses emerge much later. Britain’s approach to executive pay addresses this mismatch by allowing bonuses to be recovered after misconduct is discovered. Extending the period of possible recovery makes it harder for an executive to keep the reward while leaving the damage to others. The point is not to abolish performance pay. It is to make the final reward depend on results that survive examination over time, thereby encouraging decisions whose benefits outlast the next annual report.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>Managers do not create this impatience by themselves. Shareholders can encourage it when they sell their stakes long before a business plan has had time to work. An investor seeking a quick rise in the share price may favour an immediate distribution of cash over the development of a new product. The product could eventually create more value, but that value will arrive after the investor has left. Faced with owners who keep changing, managers have less support for projects with distant returns. Like children picking fruit before it ripens, such investors sacrifice a larger later gain for something they can collect now.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>Technology has made it easier to act on that desire for quick gains. A shareholder can receive market news and sell a holding almost immediately, without the delays that once made frequent trading inconvenient. This speed is useful for carrying out a transaction, but it does not shorten the time needed to develop a medicine, train employees or earn a customer’s trust. When each fresh price movement demands attention, those slower activities become harder to defend. The danger lies in confusing the speed at which ownership can change with the speed at which a company can create lasting value. Faster information alone cannot remove that difference.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>If impatience is encouraged by the rules, patience needs support from the rules as well. Delayed bonuses are one possibility, but ownership itself can also be designed to favour commitment. Giving additional voting rights to shareholders who keep their shares for a substantial period offers them something that rapid trading does not. They gain a stronger voice in the company’s direction by staying, rather than merely hoping that a distant financial return will compensate them. Such an arrangement cannot guarantee good judgement. It can, however, reduce the disadvantage faced by investors willing to wait and give managers a more stable audience for long-term plans.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>The final test of these changes is whether responsibility lasts beyond the departure of the person making the decision. An executive may leave before a product succeeds, a debt becomes unmanageable or an employee-training programme pays off. Customers, workers and communities cannot necessarily leave so easily; they continue to live with the consequences. Pay arrangements should therefore consider performance over a period longer than the executive’s own tenure. This is not simply a way to punish failure. It encourages leaders to treat the company as an institution with a future, and to recognise people whose interests cannot be captured by the next quarter’s share price.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】G. Making Rewards Answerable to Future Results\u003c/p>\n\u003cblockquote>\n\u003cp>让报酬对未来结果负责\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分从奖金先发、损失后现的时间差出发，解释延长追回期限如何使奖励接受长期结果的检验。\u003c/p>\n\u003cp>开头先交代奖金为什么可能奖错了人：\u003c/p>\n\u003cblockquote>\n\u003cp>A large bonus can reward a decision before anyone knows whether it was wise.\u003c/p>\n\u003c/blockquote>\n\u003cp>奖金已经发放，决策是否明智却尚未得到验证。后面的银行例子把这种时间差展开：今年报告盈利，损失可能多年后才出现。\u003c/p>\n\u003cp>英国的办法针对的正是这个时间差：\u003c/p>\n\u003cblockquote>\n\u003cp>Extending the period of possible recovery makes it harder for an executive to keep the reward while leaving the damage to others.\u003c/p>\n\u003c/blockquote>\n\u003cp>延长追回期限后，经理不能轻易把奖金留下、把日后损失交给别人。这是在延长对结果负责的时间，而非仅仅改变发薪日期。\u003c/p>\n\u003cp>最后两句划清制度目的：\u003c/p>\n\u003cblockquote>\n\u003cp>The point is not to abolish performance pay. It is to make the final reward depend on results that survive examination over time, thereby encouraging decisions whose benefits outlast the next annual report.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>not...It is...\u003c/code>先排除取消绩效薪酬，再提出让报酬经受长期结果检验；段落重心由“提前领奖的风险”落到“让奖励对未来负责”。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>今年盈利即可拿奖金 → 以后可能出现损失 → 延长追回期限 → 最终报酬接受长期结果检验\u003c/p>\n\u003c/blockquote>\n\u003cp>标题的\u003ccode>Rewards\u003c/code>对应\u003ccode>bonus\u003c/code>和\u003ccode>final reward\u003c/code>；\u003ccode>Answerable\u003c/code>对应奖金仍可能被追回；\u003ccode>Future Results\u003c/code>对应\u003ccode>results that survive examination over time\u003c/code>。它把问题、制度办法和目的连在一起。\u003c/p>\n\u003cp>再看最强干扰项C：Replacing All Bonuses with Fixed Salaries。\u003c/p>\n\u003cp>干扰标题主张用固定工资取代所有奖金，但本段明确说\u003ccode>not to abolish performance pay\u003c/code>。追回不当奖金与取消全部奖金是两种制度，原文保留了绩效激励。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】F. Investors Who Leave Before Value Matures\u003c/p>\n\u003cblockquote>\n\u003cp>在价值成熟前便离开的投资者\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释短期股东为什么不愿等长期项目见效，以及这种退出节奏怎样削弱经理的长期计划。\u003c/p>\n\u003cp>段首先把急于求成的来源扩展到股东：\u003c/p>\n\u003cblockquote>\n\u003cp>Shareholders can encourage it when they sell their stakes long before a business plan has had time to work.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>it\u003c/code>承接急躁。股东在经营计划生效前就卖出持股，经理因而难以获得支持长期项目的稳定所有者。\u003c/p>\n\u003cp>新产品例子说明股东为什么宁要眼前现金：\u003c/p>\n\u003cblockquote>\n\u003cp>The product could eventually create more value, but that value will arrive after the investor has left.\u003c/p>\n\u003c/blockquote>\n\u003cp>项目并非没有价值，而是收益兑现时这个投资者已经离场；投资者的持有期和企业创造价值所需的时间不一致。\u003c/p>\n\u003cp>末句用未熟的果实概括这种选择：\u003c/p>\n\u003cblockquote>\n\u003cp>Like children picking fruit before it ripens, such investors sacrifice a larger later gain for something they can collect now.\u003c/p>\n\u003c/blockquote>\n\u003cp>提前摘果对应提前退出或取走收益，果实成熟后的更大收获对应长期项目回报。这个比喻解释的是放弃未来价值，并非赞成迅速变现。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>股东过早卖出持股 → 长期项目收益在离场后才兑现 → 经理缺少长期支持 → 为眼前小利牺牲以后更大收益\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Investors\u003c/code>对应本段反复出现的股东；\u003ccode>Leave Before\u003c/code>对应\u003ccode>after the investor has left\u003c/code>这一时间错位；\u003ccode>Value Matures\u003c/code>由新产品未来增值和果实成熟的比喻共同解释。\u003c/p>\n\u003cp>再看最强干扰项E：Giving Patient Ownership a Practical Advantage。\u003c/p>\n\u003cp>本段解释耐心持有为何不足，没有提出给予长期股东什么权利或待遇。\u003ccode>Giving...a Practical Advantage\u003c/code>要求出现激励办法，而这里的现金分配和摘果比喻都在说明急于退出的后果。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】A. When Faster Trading Shortens Attention\u003c/p>\n\u003cblockquote>\n\u003cp>交易加速如何缩短关注周期\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分比较股票交易和企业能力形成的不同速度，说明数字交易为何可能加重短期注意力压力。\u003c/p>\n\u003cp>技术先改变的是交易条件：\u003c/p>\n\u003cblockquote>\n\u003cp>A shareholder can receive market news and sell a holding almost immediately, without the delays that once made frequent trading inconvenient.\u003c/p>\n\u003c/blockquote>\n\u003cp>消息到达和卖出股票几乎可以同时发生，过去阻碍频繁交易的延迟消失了。这解释为何短期获利愿望更容易转成行动。\u003c/p>\n\u003cp>随后用\u003ccode>but\u003c/code>划出另一种时间尺度：\u003c/p>\n\u003cblockquote>\n\u003cp>This speed is useful for carrying out a transaction, but it does not shorten the time needed to develop a medicine, train employees or earn a customer’s trust.\u003c/p>\n\u003c/blockquote>\n\u003cp>交易能够加速，不代表研发、培训和客户信任也能同样加速。三个例子共同说明企业价值仍需要慢过程。\u003c/p>\n\u003cp>风险在两种速度被混淆时出现：\u003c/p>\n\u003cblockquote>\n\u003cp>When each fresh price movement demands attention, those slower activities become harder to defend.\u003c/p>\n\u003c/blockquote>\n\u003cp>注意力被每次价格变化占据，长期活动更难获得支持；因此本段讨论交易加速怎样挤压长期关注，而非单纯介绍新技术的便利。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>消息和交易加速 → 企业能力形成仍然缓慢 → 注意力跟着短期价格走 → 长期投入更难获得支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Faster Trading\u003c/code>对应即时接收消息并卖出；\u003ccode>Shortens Attention\u003c/code>对应\u003ccode>each fresh price movement demands attention\u003c/code>以及慢活动更难被支持。标题概括了技术便利带来的管理后果。\u003c/p>\n\u003cp>再看最强干扰项B：Improving the Speed of Financial Reporting。\u003c/p>\n\u003cp>\u003ccode>Faster information\u003c/code>确实出现，但末句说它不能消除两种时间尺度的差别。段落没有建议加快财报发布；把传播速度当成目标，恰好漏掉了作者对过快注意力转换的担忧。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】E. Giving Patient Ownership a Practical Advantage\u003c/p>\n\u003cblockquote>\n\u003cp>让耐心持有获得实际优势\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分提出用额外投票权奖励长期持股，把耐心从一种愿望转化为具有实际优势的选择。\u003c/p>\n\u003cp>首句从分析急躁转向制度激励：\u003c/p>\n\u003cblockquote>\n\u003cp>If impatience is encouraged by the rules, patience needs support from the rules as well.\u003c/p>\n\u003c/blockquote>\n\u003cp>前面解释规则怎样助长短期行为，这里提出反向改造规则，使愿意等待的人获得支持。\u003c/p>\n\u003cp>具体办法不是口头劝股东耐心，而是给权利：\u003c/p>\n\u003cblockquote>\n\u003cp>Giving additional voting rights to shareholders who keep their shares for a substantial period offers them something that rapid trading does not.\u003c/p>\n\u003c/blockquote>\n\u003cp>持有足够久才得到额外投票权；频繁买卖者得不到同一优势。因此长期持有与公司决策话语权发生了制度性联系。\u003c/p>\n\u003cp>结尾说明作用，也保留限度：\u003c/p>\n\u003cblockquote>\n\u003cp>Such an arrangement cannot guarantee good judgement. It can, however, reduce the disadvantage faced by investors willing to wait and give managers a more stable audience for long-term plans.\u003c/p>\n\u003c/blockquote>\n\u003cp>额外权利并不保证判断正确，但能改善耐心投资者的处境，让经理有更稳定的长期计划支持者。论证落点是“使耐心更有利”，不是保证投资成功。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>规则也应支持耐心 → 持有时间换取额外投票权 → 长期股东获得更强话语权 → 长期计划有更稳定的支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Patient Ownership\u003c/code>对应长期持股；\u003ccode>Giving...a Practical Advantage\u003c/code>对应额外投票权及\u003ccode>a stronger voice\u003c/code>。标题既覆盖制度动作，也指出直接受益的是耐心所有者。\u003c/p>\n\u003cp>再看最强干扰项G：Making Rewards Answerable to Future Results。\u003c/p>\n\u003cp>开头虽然提到延期奖金，但马上用\u003ccode>but ownership itself can also...\u003c/code>转到持股制度。后面解释的额外投票权属于股东，而非经理报酬；用奖金标题会把引入语当成主体。\u003c/p>\n\u003cp>\u003cstrong>44题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】D. Extending Responsibility Beyond a Manager’s Tenure\u003c/p>\n\u003cblockquote>\n\u003cp>把责任延伸至经理任期之后\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把责任期限延伸至经理离任以后，因为员工、客户和社区仍将承受决策后果。\u003c/p>\n\u003cp>第一句直接提出检验改革的标准：\u003c/p>\n\u003cblockquote>\n\u003cp>The final test of these changes is whether responsibility lasts beyond the departure of the person making the decision.\u003c/p>\n\u003c/blockquote>\n\u003cp>经理离任不应成为责任结束的时点。后面列举产品、债务、培训，说明决策后果常常在任期之后才显现。\u003c/p>\n\u003cp>作者接着比较谁能离开、谁仍要承受：\u003c/p>\n\u003cblockquote>\n\u003cp>Customers, workers and communities cannot necessarily leave so easily; they continue to live with the consequences.\u003c/p>\n\u003c/blockquote>\n\u003cp>客户、员工和社区未必能随经理一起退出，因而需要把他们持续承担的后果纳入评价。这里将时间问题与受影响人群联系起来。\u003c/p>\n\u003cp>\u003ccode>therefore\u003c/code>把以上理由落实到薪酬周期：\u003c/p>\n\u003cblockquote>\n\u003cp>Pay arrangements should therefore consider performance over a period longer than the executive’s own tenure.\u003c/p>\n\u003c/blockquote>\n\u003cp>报酬评价应超过经理本人任期，才可能覆盖这些延后后果。末句进一步把公司看成有未来的机构，而非下一季度的股价。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>决策后果晚于经理离任 → 其他相关者继续承受 → 薪酬评价超过任期 → 管理责任面向企业和社会的长远未来\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Responsibility\u003c/code>对应持续承担决策后果；\u003ccode>Beyond a Manager’s Tenure\u003c/code>直接对应\u003ccode>longer than the executive’s own tenure\u003c/code>，也覆盖本段经理能够离开、员工社区仍然留下的对照。\u003c/p>\n\u003cp>再看最强干扰项G：Making Rewards Answerable to Future Results。\u003c/p>\n\u003cp>奖励对未来结果负责与本段有关，但该标题没有抓住本段新增的界限：责任应越过经理离任时点，并考虑留下的员工和社区。前文追回奖金的制度，在这里被提升为任期以外的责任原则。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>A company can look successful today because the costs of a decision have not yet appeared. Managers may collect bonuses while the risks remain hidden, leaving shareholders and employees to face the eventual loss. Reforming executive pay therefore begins with a question about timing: how long should a reward remain open to reconsideration?\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Beyond that tenure, other people are still living with the decision. Employees may be left with outdated skills, customers with unreliable products and communities with a weakened local employer. These continuing effects explain why a longer assessment period matters. The company’s future cannot be reduced to the fortune of the executive who once led it.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>That second source is the shareholder who plans to leave quickly. Such an owner may demand cash now rather than support a project that will succeed after the shares have been sold. Managers then face pressure to choose visible short-term gains. Understanding that pressure also requires asking why leaving has become so easy.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>One answer is to keep bonuses recoverable for longer. If misconduct is discovered several years after payment, the executive should not automatically be beyond reach. A longer recovery period connects present rewards with later consequences. Yet this reform concerns only the person running the company; it leaves a second source of impatience largely untouched.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>Leaving has become easier because digital markets allow news and trades to travel almost instantly. But a laboratory, a skilled workforce and customer loyalty still take years to build. The resulting mismatch is between a fast-moving market and a slowly developing business. Rules that merely allow faster exits cannot by themselves produce more patient owners.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>Changing shareholder incentives, however, cannot finish the job. Managers’ pay must also be judged against results that appear after they have moved on. A leader who leaves before a risky strategy fails should not be evaluated solely on the attractive figures reported while in office. The relevant period must extend beyond the leader’s tenure.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>Producing more patient owners requires a reward for staying. Extra voting rights for people who hold shares for a sustained period are one possible device. They give committed investors more influence over company decisions, making continued ownership valuable in its own right. This approach changes the incentives of shareholders rather than concentrating only on managers.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>The aim, then, is to make both ownership and leadership attentive to a future they cannot immediately cash in. Delayed rewards, patient voting rights and longer assessments address different parts of the same problem. None guarantees success, but together they make it harder to take today’s gain while passing tomorrow’s costs to someone else.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出奖金发放早于风险显现的问题，并询问追责期限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用员工、客户和社区的持续后果解释任期后责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>指出短期股东施加压力，并追问退出为何如此容易\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>用延长奖金追回期回答期限问题，转向第二种急躁来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>解释数字交易加速退出，却无法加速企业价值形成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>指出股东改革仍不足，要求经理评价越过任期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>提出长期持股换取额外投票权，改变股东激励\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>合并奖金、股权和任期评价，收束长期责任主张\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出奖金发放早于风险显现的问题，并询问追责期限 → 用延长奖金追回期回答期限问题，转向第二种急躁来源 → 指出短期股东施加压力，并追问退出为何如此容易 → 解释数字交易加速退出，却无法加速企业价值形成 → 提出长期持股换取额外投票权，改变股东激励 → 指出股东改革仍不足，要求经理评价越过任期 → 用员工、客户和社区的持续后果解释任期后责任 → 合并奖金、股权和任期评价，收束长期责任主张\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → C → E → G → F → B → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、C、G、F、B。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → C的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Reforming executive pay therefore begins with a question about timing: how long should a reward remain open to reconsideration?\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One answer is to keep bonuses recoverable for longer.\u003c/p>\n\u003c/blockquote>\n\u003cp>A以\u003ccode>how long should a reward remain open to reconsideration?\u003c/code>询问奖金在多长时间内还能重新审查。本段的\u003ccode>One answer\u003c/code>必须回答这个问题，紧跟的\u003ccode>keep bonuses recoverable for longer\u003c/code>给出答案：延长追回期；既承接疑问形式，也承接奖金这一具体对象。\u003c/p>\n\u003cp>本段用“发放多年后才发现违规”解释延长期限为什么有用，接着以\u003ccode>Yet\u003c/code>指出边界：这项办法只管经理。\u003ccode>a second source of impatience\u003c/code>由此提出尚未解决的另一类行为者。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet this reform concerns only the person running the company; it leaves a second source of impatience largely untouched.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That second source is the shareholder who plans to leave quickly.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段开头\u003ccode>That second source is the shareholder\u003c/code>正好为“第二种来源”命名。先说经理追责还遗漏一种来源，再揭示短期股东，指代与转题都连续。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>提出奖金发放早于风险显现的问题，并询问追责期限 → 用延长奖金追回期回答期限问题，转向第二种急躁来源 → 指出短期股东施加压力，并追问退出为何如此容易\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Changing shareholder incentives, however, cannot finish the job.\u003c/p>\n\u003c/blockquote>\n\u003cp>另一候选也谈经理薪酬，但开头\u003ccode>Changing shareholder incentives, however\u003c/code>预设已经讨论过改变股东激励。A只提出奖金追责期限，并未谈股东改革；直接接它既无法解释\u003ccode>however\u003c/code>，也跳过了奖金追回这个具体回答。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → C → E的关系。\u003c/p>\n\u003cp>先看前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet this reform concerns only the person running the company; it leaves a second source of impatience largely untouched.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That second source is the shareholder who plans to leave quickly.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后明确留下\u003ccode>a second source of impatience\u003c/code>。本段用\u003ccode>That second source\u003c/code>回指，再以\u003ccode>the shareholder who plans to leave quickly\u003c/code>补足身份；“第二种”对应经理以外的短期股东，不能理解成另一项奖金制度。\u003c/p>\n\u003cp>股东退出早于项目成功，因此宁要眼前现金；经理受到这些所有者的压力而追求短期可见收益。段末再把解释推进一层：这些股东为什么能够如此容易地退出？\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Understanding that pressure also requires asking why leaving has become so easy.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Leaving has become easier because digital markets allow news and trades to travel almost instantly.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知E开头重复\u003ccode>Leaving has become easier\u003c/code>，并用\u003ccode>because digital markets...\u003c/code>回答本段结尾\u003ccode>why leaving has become so easy\u003c/code>。这是“提出退出便利之因 → 数字市场给出原因”的问答关系。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>用延长奖金追回期回答期限问题，转向第二种急躁来源 → 指出短期股东施加压力，并追问退出为何如此容易 → 解释数字交易加速退出，却无法加速企业价值形成\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Producing more patient owners requires a reward for staying.\u003c/p>\n\u003c/blockquote>\n\u003cp>额外投票权那段也谈股东，但它从\u003ccode>Producing more patient owners\u003c/code>进入解决办法，需要先说明快进快出为何造成问题。放在这里会使后面的E突然退回解释退出原因，也没有给\u003ccode>That second source\u003c/code>提供身份说明。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → F的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Rules that merely allow faster exits cannot by themselves produce more patient owners.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Producing more patient owners requires a reward for staying.\u003c/p>\n\u003c/blockquote>\n\u003cp>E末句指出，让人更快退出的规则不能自动产生\u003ccode>more patient owners\u003c/code>。本段段首\u003ccode>Producing more patient owners requires a reward for staying\u003c/code>接住这一未解决目标，把“退出更容易”转为“留下也应有好处”。\u003c/p>\n\u003cp>段中不是泛泛倡导耐心，而是明确额外投票权的交换条件：持续持股。它使长期股东影响公司决策，从而让继续持有本身有价值。末句将此办法归纳为改变股东激励。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This approach changes the incentives of shareholders rather than concentrating only on managers.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Changing shareholder incentives, however, cannot finish the job.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段以\u003ccode>Changing shareholder incentives, however, cannot finish the job\u003c/code>接续末句的\u003ccode>changes the incentives of shareholders\u003c/code>。\u003ccode>however\u003c/code>承认股东办法有用，同时要求继续处理经理报酬，形成“改革一个主体 → 另一个主体也要改”的递进。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>解释数字交易加速退出，却无法加速企业价值形成 → 提出长期持股换取额外投票权，改变股东激励 → 指出股东改革仍不足，要求经理评价越过任期\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Changing shareholder incentives, however, cannot finish the job.\u003c/p>\n\u003c/blockquote>\n\u003cp>经理任期评价段的\u003ccode>Changing shareholder incentives\u003c/code>看似可接E对所有者的讨论，但E尚未提出任何改变股东激励的办法。本段的投票权措施必须先出现，后段才能说这种改革还不够。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → F → B的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This approach changes the incentives of shareholders rather than concentrating only on managers.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Changing shareholder incentives, however, cannot finish the job.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段已完整介绍“持股时间换投票权”，最后总结为\u003ccode>changes the incentives of shareholders\u003c/code>。本段重提\u003ccode>Changing shareholder incentives\u003c/code>并加\u003ccode>however\u003c/code>，把焦点从股东转回经理，指出这一类改革尚未覆盖另一类责任。\u003c/p>\n\u003cp>随后给出经理评价为何要延长：任内漂亮报表可能来自以后才失败的冒险策略。\u003ccode>after they have moved on\u003c/code>与\u003ccode>beyond the leader’s tenure\u003c/code>共同确定评价时间必须晚于离任。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The relevant period must extend beyond the leader’s tenure.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Beyond that tenure, other people are still living with the decision.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段开头\u003ccode>Beyond that tenure\u003c/code>中的\u003ccode>that tenure\u003c/code>只能指本段刚明确的经理任期。后段再列举谁在任期之后继续承受损失，补足延长评价期的理由。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>提出长期持股换取额外投票权，改变股东激励 → 指出股东改革仍不足，要求经理评价越过任期 → 用员工、客户和社区的持续后果解释任期后责任\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One answer is to keep bonuses recoverable for longer.\u003c/p>\n\u003c/blockquote>\n\u003cp>奖金追回段同样关注以后发生的后果，但以\u003ccode>One answer\u003c/code>起头，回答的是A的奖金追责时限问题；它最后引出“第二种急躁来源”，不是经理任期，因而无法为后段\u003ccode>that tenure\u003c/code>建立直接先行词。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → B → H的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The relevant period must extend beyond the leader’s tenure.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Beyond that tenure, other people are still living with the decision.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段结尾强调\u003ccode>beyond the leader’s tenure\u003c/code>，本段随即用\u003ccode>Beyond that tenure\u003c/code>把时间界限承接下来。\u003ccode>other people\u003c/code>又与刚离任的经理对照：经理走了，其他相关者还在。\u003c/p>\n\u003cp>员工技能过时、客户产品不可靠、社区雇主衰弱，三个例子具体说明离任后的成本由谁承担。\u003ccode>These continuing effects\u003c/code>回指这三类后果，用来解释评价期为什么要加长。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The company’s future cannot be reduced to the fortune of the executive who once led it.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The aim, then, is to make both ownership and leadership attentive to a future they cannot immediately cash in.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知H把结论概括为所有权与领导责任都要关注无法立即兑现的未来，并收束为不能把\u003ccode>tomorrow’s costs\u003c/code>转给别人。本段刚展示的员工、客户和社区就是这里\u003ccode>someone else\u003c/code>的具体内容，因此由后果展开自然进入总结。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>指出股东改革仍不足，要求经理评价越过任期 → 用员工、客户和社区的持续后果解释任期后责任 → 合并奖金、股权和任期评价，收束长期责任主张\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Producing more patient owners requires a reward for staying.\u003c/p>\n\u003c/blockquote>\n\u003cp>投票权段虽然也面向长期，但讨论的是股东留下的奖励，没有说明经理离任后谁承受代价。此处若返回投票权，会遗漏\u003ccode>that tenure\u003c/code>之后的责任解释，H的“把明天成本转给别人”也缺少这组直接例证。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>patience\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>耐心\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：坚持\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>long-term thinking\u003c/td>\n\u003ctd>长远思考\u003c/td>\n\u003ctd>人生哲理类：延迟满足、具有远见\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>corporate responsibility\u003c/td>\n\u003ctd>企业责任\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>public trust\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>公众信任\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sustainable investment\u003c/td>\n\u003ctd>可持续投资\u003c/td>\n\u003ctd>经济消费类：经济收入\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>customer loyalty\u003c/td>\n\u003ctd>顾客忠诚度\u003c/td>\n\u003ctd>经济消费类：企业经营\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>responsible decision-making\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>负责任的决策\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：责任感、奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>effective incentives\u003c/td>\n\u003ctd>有效激励\u003c/td>\n\u003ctd>经济消费类：企业经营\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the welfare of future generations\u003c/td>\n\u003ctd>后代福祉\u003c/td>\n\u003ctd>社会生活类：生活质量\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A pursuing X rather than waiting for Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示A追求X而不是等待Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, A is putting X aside for a future purpose.\u003c/td>\n\u003ctd>图中A正在为未来的用途把X留起来。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A’s behaviour in the picture serves as a reminder of the need for X.\u003c/td>\n\u003ctd>图中A的行为提醒我们需要X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The average time spent on X has dropped from A to B.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>花在X上的平均时间已从A降到B。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures indicate a growing preference for X over Y.\u003c/td>\n\u003ctd>这些数字表明，相比Y，人们越来越偏好X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>A substantial part of X is now tied to Y.\u003c/td>\n\u003ctd>目前X中相当大的一部分与Y相关。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The text discusses a rule intended to encourage X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>这段文字讨论了一项旨在鼓励X的规定。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage highlights society’s interest in X, not just in the short term but in the long term.\u003c/td>\n\u003ctd>文章强调社会对X的关注既涉及短期，也涉及长期。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue concerns whether incentives can support X on behalf of Y.\u003c/td>\n\u003ctd>该问题涉及激励能否为Y的利益支持X。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":8},{"label":"句内逻辑","index":36},{"label":"长难句手译","index":39},{"label":"第三鸟 · 题目复盘","index":58},{"label":"25题","index":59},{"label":"21题","index":69},{"label":"22题","index":87},{"label":"23题","index":105},{"label":"24题","index":123},{"label":"第四鸟 · 新题型","index":141},{"label":"小标题题","index":141},{"label":"排序题","index":147},{"label":"第五鸟 · 写作积累","index":153}];
const allIndices = [0,1,2,3,4,5,6,7,11,15,19,23,27,31,35,36,37,38,39,45,51,57,58,59,61,63,65,67,68,69,73,77,81,85,86,87,91,95,99,103,104,105,109,113,117,121,122,123,127,131,135,139,140,141,142,143,144,145,146,147,148,149,150,151,152,153,154];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{

 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';

   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);

 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{

  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);

 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
 const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
 const top=rightScroll.scrollTop+er.top-sr.top;
 const target=height<=view-2*margin?top+height/2-view/2:top-margin;
 rightScroll.scrollTop=clampScroll(target,rightScroll.scrollHeight-view);
}
function positionRight(st,token,restore){
 guardedSchedule(token,()=>{
  if(isLongSentenceCumulative(st)){
   positionLongSentence(st);
   if(!restore)return;
  }
  if(restore){
   rightScroll.scrollTop=saved.right;
   window.scrollTo(0,saved.win);
   return;
  }
  if(!st.meta.cumulative||st.meta.partIndex===0){rightScroll.scrollTop=0;return;}
  const el=document.getElementById(st.focusId);
  if(!el)return;
  if(isParagraphCumulative(st)){
   // Match the sample: no artificial tail; real content height limits the scroll.
   const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const top=rightScroll.scrollTop+er.top-sr.top;
   rightScroll.scrollTop=clampScroll(top-34,rightScroll.scrollHeight-rightScroll.clientHeight);
   return;
  }
  // A short final layer still needs enough trailing room to bring its heading into view.
  const tail=rightContent.querySelector('.longScrollTail');
  if(tail)tail.style.minHeight=Math.max(420,rightScroll.clientHeight*.9-el.offsetHeight)+'px';
  const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
  const top=rightScroll.scrollTop+er.top-sr.top;
  rightScroll.scrollTop=latestTarget(top,rightScroll.clientHeight,rightScroll.scrollHeight-rightScroll.clientHeight);
 });
}
function render(options={}){
 const token=++renderToken; // stale image and scroll callbacks may never reset a newer step
 document.body.classList.toggle('allMode',all);
 toggleAll.classList.toggle('active',all);
 toggleAll.textContent=all?'返回交互':'显示全部';
 if(all){
  layout.className='layout single';leftPanel.hidden=true;
  rightContent.innerHTML='<div class="fullContent">'+FULL+'</div>';
  hydrateAssets(rightContent);rightScroll.scrollTop=0;
  progress.textContent='全文';
  prev.disabled=next.disabled=reset.disabled=jump.disabled=true;
  return;
 }
 const st=DATA[idx],previous=lastRenderedIdx<0?null:DATA[lastRenderedIdx];
 const sameGroup=previous&&st.meta.cumulative&&previous.meta.cumulative&&st.meta.cumulativeGroup===previous.meta.cumulativeGroup;
 reset.disabled=jump.disabled=false;prev.disabled=idx===0;next.disabled=idx===DATA.length-1;
 progress.textContent=(idx+1)+' / '+DATA.length;
 if(st.context){
  layout.className='layout split';leftPanel.hidden=false;
  renderContext(st.context,token,options.restore===true);
 }else{
  layout.className='layout single';leftPanel.hidden=true;
  leftStage.innerHTML='';delete leftStage.dataset.kind;
 }
 const holder=rightContent.querySelector('.cumulativeParts');
 let kept=false;
 if(sameGroup&&holder&&!options.restore){
  if(st.html.startsWith(previous.html)){
   holder.insertAdjacentHTML('beforeend',st.html.slice(previous.html.length));kept=true;
  }else if(previous.html.startsWith(st.html)){
   while(holder.children.length>st.meta.partIndex+1)holder.lastElementChild.remove();
   kept=true;
  }
 }
 if(!kept){
  const third=st.section==='第三鸟 · 题目复盘'?' thirdBird':'';
  const content=st.meta.cumulative?'<div class="cumulativeParts">'+st.html+'</div>'+(isParagraphCumulative(st)?'':'<div class="longScrollTail" aria-hidden="true"></div>'):st.html;
  rightContent.innerHTML='<div class="stage'+third+'"><div class="stageHeader"><div class="crumb">'+escHtml(st.section)+'</div><h1 class="stepTitle">'+escHtml(st.title)+'</h1></div><div class="lectureBody">'+content+'</div></div>';
 }
 hydrateAssets(rightContent);
 positionRight(st,token,options.restore===true);
 jump.value='';lastRenderedIdx=idx;
}
JUMP_TARGETS.forEach(j=>{const o=document.createElement('option');o.value=String(j.index);o.textContent=j.label;jump.appendChild(o);});
next.onclick=()=>{if(!all&&idx<DATA.length-1){idx++;render();}};
prev.onclick=()=>{if(!all&&idx>0){idx--;render();}};
reset.onclick=()=>{idx=0;all=false;lastRenderedIdx=-1;render();};
jump.onchange=()=>{if(jump.value!==''){idx=Number(jump.value);all=false;lastRenderedIdx=-1;render();}};
toggleAll.onclick=()=>{
 if(!all){saved={idx,left:leftScroll.scrollTop,right:rightScroll.scrollTop,win:window.scrollY};all=true;render();}
 else{all=false;idx=saved.idx;lastRenderedIdx=-1;render({restore:true});}
};
document.addEventListener('keydown',e=>{
 if(all||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,button,[contenteditable="true"]'))return;
 if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next.click();}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev.click();}
});
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!all)render();},100);});
render();
