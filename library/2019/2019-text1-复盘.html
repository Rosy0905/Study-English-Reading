03ctr>\n\u003ctd>tax code\u003c/td>\n\u003ctd>税法\u003c/td>\n\u003ctd>disclosure\u003c/td>\n\u003ctd>n.披露\u003c/td>\n\u003ctd>stock acquisition\u003c/td>\n\u003ctd>股票收购\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>France\u003c/td>\n\u003ctd>n.法国\u003c/td>\n\u003ctd>shareholder\u003c/td>\n\u003ctd>n.股东\u003c/td>\n\u003ctd>hold onto\u003c/td>\n\u003ctd>继续持有\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>company investment\u003c/td>\n\u003ctd>对公司的投资\u003c/td>\n\u003ctd>earn\u003c/td>\n\u003ctd>v.获得\u003c/td>\n\u003ctd>voting right\u003c/td>\n\u003ctd>投票权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>第7段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>company\u003c/td>\n\u003ctd>n.公司\u003c/td>\n\u003ctd>right\u003c/td>\n\u003ctd>a.合适的\u003c/td>\n\u003ctd>compensation design\u003c/td>\n\u003ctd>薪酬设计\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>provide incentives\u003c/td>\n\u003ctd>提供激励\u003c/td>\n\u003ctd>executive\u003c/td>\n\u003ctd>n.高管\u003c/td>\n\u003ctd>on behalf of\u003c/td>\n\u003ctd>代表；为了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stakeholder\u003c/td>\n\u003ctd>n.利益相关者\u003c/td>\n\u003ctd>rule\u003c/td>\n\u003ctd>n.规定\u003c/td>\n\u003ctd>reminder\u003c/td>\n\u003ctd>n.提醒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>banker\u003c/td>\n\u003ctd>n.银行家\u003c/td>\n\u003ctd>society\u003c/td>\n\u003ctd>n.社会\u003c/td>\n\u003ctd>interest\u003c/td>\n\u003ctd>n.利益；关切\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>performance\u003c/td>\n\u003ctd>n.表现\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Financial regulators in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this &quot;clawback&quot; rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions. Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Financial regulators in Britain / have imposed / a rather unusual rule / on the bosses of big banks.\u003c/p>\n\u003cp>Starting next year, / any guaranteed bonus / of top executives / could be delayed 10 years / if their banks are under investigation / for wrongdoing.\u003c/p>\n\u003cp>The main purpose / of this &quot;clawback&quot; rule / is to hold bankers accountable / for harmful risk-taking / and to restore public trust / in financial institutions.\u003c/p>\n\u003cp>Yet officials also hope / for a much larger benefit: / more long-term decisionmaking, / not only by banks / but by all corporations, / to build a stronger economy / for future generations.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>英国的金融监管机构 / 已经实施了 / 一项相当不寻常的规则 / 对大型银行的老板们。\u003c/p>\n\u003cp>从明年开始，/ 任何保证奖金 / 高管的 / 可能被延迟10年 / 如果他们的银行正在接受调查 / 因为不当行为。\u003c/p>\n\u003cp>主要目的 / 这个&quot;追回&quot;规则的 / 是让银行家负责 / 对有害的冒险行为 / 并恢复公众信任 / 在金融机构中。\u003c/p>\n\u003cp>然而官员们也希望 / 获得更大的好处：/ 更多长期决策，/ 不仅由银行 / 而且由所有公司，/ 来建立更强大的经济 / 为未来几代人。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>英国金融监管机构对大型银行老板实施了一项相当不寻常的规则。从明年开始，如果银行因不当行为受到调查，高管的任何保证奖金都可能被延迟10年发放。这个&quot;追回&quot;规则的主要目的是让银行家对有害的冒险行为负责，并恢复公众对金融机构的信任。然而，官员们还希望获得更大的好处：促进不仅银行、而且所有公司进行更多长期决策，为子孙后代建立更强大的经济。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane. He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like &quot;children who pick the plums out of their pudding to eat them at once&quot; rather than putting them aside to be eaten last.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>&quot;Short-termism&quot; / or the desire for quick profits, / has worsened / in publicly traded companies, / says the Bank of England&#39;s top economist, / Andrew Haldane.\u003c/p>\n\u003cp>He quotes / a giant of classical economics, / Alfred Marshall, / in describing this financial impatience / as acting like / &quot;children who pick the plums out of their pudding / to eat them at once&quot; / rather than putting them aside / to be eaten last.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>&quot;短期主义&quot; / 或对快速利润的渴望，/ 已经恶化了 / 在上市公司中，/ 英格兰银行的首席经济学家说，/ 安德鲁·霍尔丹。\u003c/p>\n\u003cp>他引用 / 古典经济学巨匠，/ 阿尔弗雷德·马歇尔，/ 在描述这种金融急躁 / 就像 / &quot;孩子们把李子从布丁里挑出来 / 立即吃掉&quot; / 而不是把它们放在一边 / 最后再吃。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>英格兰银行首席经济学家安德鲁·霍尔丹表示，&quot;短期主义&quot;或对快速利润的渴望在上市公司中已经恶化。他引用古典经济学巨匠阿尔弗雷德·马歇尔的话来描述这种金融急躁，就像&quot;孩子们把李子从布丁里挑出来立即吃掉&quot;，而不是把它们留到最后再吃。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades. Transient investors, who demand high quarterly profits from companies, can hinder a firm&#39;s efforts to invest in long-term research or to build up customer loyalty. This has been dubbed &quot;quarterly capitalism.&quot;\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>The average time / for holding a stock / in both the United States and Britain, / he notes, / has dropped / from seven years to seven months / in recent decades.\u003c/p>\n\u003cp>Transient investors, / who demand high quarterly profits / from companies, / can hinder a firm&#39;s efforts / to invest in long-term research / or to build up customer loyalty.\u003c/p>\n\u003cp>This has been dubbed / &quot;quarterly capitalism.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>平均时间 / 持有股票的 / 在美国和英国，/ 他指出，/ 已经下降了 / 从七年到七个月 / 在最近几十年。\u003c/p>\n\u003cp>短期投资者，/ 他们要求高季度利润 / 从公司，/ 可能阻碍公司的努力 / 投资长期研究 / 或建立客户忠诚度。\u003c/p>\n\u003cp>这被称为 / &quot;季度资本主义&quot;。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>他指出，在美国和英国，持有股票的平均时间在最近几十年已经从七年下降到七个月。要求公司提供高季度利润的短期投资者，可能阻碍公司投资长期研究或建立客户忠诚度的努力。这被称为&quot;季度资本主义&quot;。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>In addition, new digital technologies have allowed more rapid trading of equities, quicker use of information, and thus shorter attention spans in financial markets. &quot;There seems to be a predominance of short-term thinking at the expense of long-term investing,&quot; said Commissioner Daniel Gallagher of the US Securities and Exchange Commission in a speech this week.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>In addition, / new digital technologies / have allowed / more rapid trading of equities, / quicker use of information, / and thus shorter attention spans / in financial markets.\u003c/p>\n\u003cp>&quot;There seems to be / a predominance of short-term thinking / at the expense of long-term investing,&quot; / said Commissioner Daniel Gallagher / of the US Securities and Exchange Commission / in a speech this week.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>此外，/ 新的数字技术 / 已经允许 / 更快速的股票交易，/ 更快地使用信息，/ 因此更短的注意力跨度 / 在金融市场中。\u003c/p>\n\u003cp>&quot;似乎存在 / 短期思维的主导 / 以长期投资为代价，&quot; / 专员丹尼尔·加拉格尔说 / 美国证券交易委员会的 / 在本周的演讲中。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>此外，新的数字技术已经使股票交易更加快速，信息使用更加迅速，从而导致金融市场的注意力跨度更短。美国证券交易委员会专员丹尼尔·加拉格尔在本周的演讲中说：&quot;短期思维似乎占主导地位，这是以长期投资为代价的。&quot;\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to defer performance bonuses for senior executives by about a year, slightly helping reduce &quot;short-termism.&quot; In its latest survey of CEO pay, The Wall Street Journal finds that &quot;a substantial part&quot; of executive pay is now tied to performance.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>In the US, / the Sarbanes-Oxley Act of 2002 / has pushed most public companies / to defer performance bonuses / for senior executives / by about a year, / slightly helping reduce / &quot;short-termism.&quot;\u003c/p>\n\u003cp>In its latest survey / of CEO pay, / The Wall Street Journal finds / that &quot;a substantial part&quot; / of executive pay / is now tied to performance.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>在美国，/ 2002年的萨班斯-奥克斯利法案 / 已经推动大多数上市公司 / 推迟绩效奖金 / 给高级管理人员 / 大约一年，/ 略微帮助减少 / &quot;短期主义&quot;。\u003c/p>\n\u003cp>在其最新调查中 / 关于CEO薪酬的，/ 《华尔街日报》发现 / &quot;相当大的一部分&quot; / 高管薪酬的 / 现在与绩效挂钩。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>在美国，2002年的萨班斯-奥克斯利法案已经推动大多数上市公司将高级管理人员的绩效奖金推迟约一年发放，这略微有助于减少&quot;短期主义&quot;。《华尔街日报》在其最新的CEO薪酬调查中发现，现在&quot;相当大一部分&quot;高管薪酬与绩效挂钩。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Much more could be done to encourage &quot;long-termism,&quot; such as changes in the tax code and quicker disclosure of stock acquisitions. In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Much more could be done / to encourage &quot;long-termism,&quot; / such as changes in the tax code / and quicker disclosure / of stock acquisitions.\u003c/p>\n\u003cp>In France, / shareholders who hold onto / a company investment / for at least two years / can sometimes earn / more voting rights / in a company.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>更多可以做的事 / 来鼓励&quot;长期主义&quot;，/ 比如税法的改变 / 和更快的披露 / 股票收购的。\u003c/p>\n\u003cp>在法国，/ 股东们持有 / 公司投资 / 至少两年 / 有时可以获得 / 更多投票权 / 在公司中。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>还可以做更多来鼓励&quot;长期主义&quot;，比如改变税法和更快地披露股票收购信息。在法国，持有公司投资至少两年的股东有时可以获得更多的投票权。\u003c/p>\n\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>Within companies, the right compensation design can provide incentives for executives to think beyond their own time at the company and on behalf of all stakeholders. Britain&#39;s new rule is a reminder to bankers that society has an interest in their performance, not just for the short term but for the long term.\u003c/p>\n\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>Within companies, / the right compensation design / can provide incentives / for executives / to think beyond / their own time at the company / and on behalf of / all stakeholders.\u003c/p>\n\u003cp>Britain&#39;s new rule / is a reminder to bankers / that society has an interest / in their performance, / not just for the short term / but for the long term.\u003c/p>\n\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>在公司内部，/ 正确的薪酬设计 / 可以提供激励 / 给高管们 / 去思考超越 / 他们自己在公司的时间 / 并代表 / 所有利益相关者。\u003c/p>\n\u003cp>英国的新规则 / 是对银行家的提醒 / 社会有利益关系 / 在他们的表现中，/ 不仅是短期的 / 而且是长期的。\u003c/p>\n\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>在公司内部，正确的薪酬设计可以激励高管超越自己在公司任职期间的思考，代表所有利益相关者的利益。英国的新规则提醒银行家，社会不仅关注他们的短期表现，也关注长期表现。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>Financial regulators in Britain → have imposed → a rather unusual rule：(on the bosses of big banks).\u003c/p>\n\u003cp>Starting next year → any guaranteed bonus：(of top executives) → could be delayed 10 years：(if their banks are under investigation：(for wrongdoing)).\u003c/p>\n\u003cp>The main purpose：(of this &quot;clawback&quot; rule) → is to hold bankers accountable：(for harmful risk-taking) + to restore public trust：(in financial institutions).\u003c/p>\n\u003cp>Yet officials also hope：(for a much larger benefit)：more long-term decisionmaking：(not only by banks + but by all corporations)：(to build a stronger economy：(for future generations)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>&quot;Short-termism&quot;：(or the desire for quick profits) → has worsened：(in publicly traded companies) → says the Bank of England&#39;s top economist：(Andrew Haldane).\u003c/p>\n\u003cp>He quotes → a giant of classical economics：(Alfred Marshall)：(in describing this financial impatience)：(as acting like：&quot;children who pick the plums out of their pudding：(to eat them at once)&quot; // rather than putting them aside：(to be eaten last)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>The average time：(for holding a stock)：(in both the United States and Britain) → he notes → has dropped：(from seven years to seven months)：(in recent decades).\u003c/p>\n\u003cp>Transient investors：(who demand high quarterly profits：(from companies)) → can hinder a firm&#39;s efforts：(to invest in long-term research + to build up customer loyalty).\u003c/p>\n\u003cp>This has been dubbed → &quot;quarterly capitalism.&quot;\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>In addition → new digital technologies → have allowed：(more rapid trading of equities + quicker use of information + thus shorter attention spans：(in financial markets)).\u003c/p>\n\u003cp>&quot;There seems to be → a predominance of short-term thinking：(at the expense of long-term investing)&quot; → said Commissioner Daniel Gallagher：(of the US Securities and Exchange Commission)：(in a speech this week).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>In the US → the Sarbanes-Oxley Act of 2002 → has pushed most public companies → to defer performance bonuses：(for senior executives)：(by about a year) → slightly helping reduce：(&quot;short-termism&quot;).\u003c/p>\n\u003cp>In its latest survey：(of CEO pay) → The Wall Street Journal finds：(that &quot;a substantial part&quot;：(of executive pay) → is now tied to performance).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Much more could be done：(to encourage &quot;long-termism&quot;)：(such as changes in the tax code + quicker disclosure：(of stock acquisitions)).\u003c/p>\n\u003cp>In France → shareholders：(who hold onto → a company investment：(for at least two years)) → can sometimes earn → more voting rights：(in a company).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>Within companies → the right compensation design → can provide incentives：(for executives)：(to think beyond：(their own time at the company) + on behalf of：(all stakeholders)).\u003c/p>\n\u003cp>Britain&#39;s new rule → is a reminder to bankers：(that society has an interest：(in their performance))：(not just for the short term + but for the long term).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>英国的金融监管机构 → 已经实施了 → 一项相当不寻常的规则：(对大型银行的老板们)。\u003c/p>\n\u003cp>从明年开始 → 任何保证奖金：(高管的) → 可能被延迟10年：(如果他们的银行正在接受调查：(因为不当行为))。\u003c/p>\n\u003cp>主要目的：(这个&quot;追回&quot;规则的) → 是让银行家负责：(对有害的冒险行为) + 恢复公众信任：(在金融机构中)。\u003c/p>\n\u003cp>然而官员们也希望：(获得更大的好处)：更多长期决策：(不仅由银行 + 而且由所有公司)：(来建立更强大的经济：(为未来几代人))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>&quot;短期主义&quot;：(或对快速利润的渴望) → 已经恶化了：(在上市公司中) → 英格兰银行的首席经济学家说：(安德鲁·霍尔丹)。\u003c/p>\n\u003cp>他引用 → 古典经济学巨匠：(阿尔弗雷德·马歇尔)：(在描述这种金融急躁)：(就像：&quot;孩子们把李子从布丁里挑出来：(立即吃掉)&quot; // 而不是把它们放在一边：(最后再吃))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>平均时间：(持有股票的)：(在美国和英国) → 他指出 → 已经下降了：(从七年到七个月)：(在最近几十年)。\u003c/p>\n\u003cp>短期投资者：(他们要求高季度利润：(从公司)) → 可能阻碍公司的努力：(投资长期研究 + 建立客户忠诚度)。\u003c/p>\n\u003cp>这被称为 → &quot;季度资本主义&quot;。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>此外 → 新的数字技术 → 已经允许：(更快速的股票交易 + 更快地使用信息 + 因此更短的注意力跨度：(在金融市场中))。\u003c/p>\n\u003cp>&quot;似乎存在 → 短期思维的主导：(以长期投资为代价)&quot; → 专员丹尼尔·加拉格尔说：(美国证券交易委员会的)：(在本周的演讲中)。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>在美国 → 2002年的萨班斯-奥克斯利法案 → 已经推动大多数上市公司 → 推迟绩效奖金：(给高级管理人员)：(大约一年) → 略微帮助减少：(&quot;短期主义&quot;)。\u003c/p>\n\u003cp>在其最新调查中：(关于CEO薪酬的) → 《华尔街日报》发现：(&quot;相当大的一部分&quot;：(高管薪酬的) → 现在与绩效挂钩)。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>更多可以做的事：(来鼓励&quot;长期主义&quot;)：(比如税法的改变 + 更快的披露：(股票收购的))。\u003c/p>\n\u003cp>在法国 → 股东们：(持有 → 公司投资：(至少两年)) → 有时可以获得 → 更多投票权：(在公司中)。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>在公司内部 → 正确的薪酬设计 → 可以提供激励：(给高管们)：(去思考超越：(他们自己在公司的时间) + 代表：(所有利益相关者))。\u003c/p>\n\u003cp>英国的新规则 → 是对银行家的提醒：(社会有利益关系：(在他们的表现中))：(不仅是短期的 + 而且是长期的)。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第2段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like &quot;children who pick the plums out of their pudding to eat them at once&quot; rather than putting them aside to be eaten last.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>He quotes / a giant of classical economics, / Alfred Marshall, / in describing this financial impatience / as acting like / &quot;children who pick the plums out of their pudding / to eat them at once&quot; / rather than putting them aside / to be eaten last.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>他引用 / 古典经济学巨匠，/ 阿尔弗雷德·马歇尔，/ 在描述这种金融急躁 / 就像 / &quot;孩子们把李子从布丁里挑出来 / 立即吃掉&quot; / 而不是把它们放在一边 / 最后再吃。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把被引用者的身份和姓名合在一起：\u003c/p>\n\u003cblockquote>\n\u003cp>他引用古典经济学巨匠阿尔弗雷德·马歇尔的话，来描述这种金融急躁\u003c/p>\n\u003c/blockquote>\n\u003cp>把孩子的两种吃法接成一组对比：\u003c/p>\n\u003cblockquote>\n\u003cp>孩子把李子从布丁里挑出来立即吃掉，而不是放在一边最后再吃\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>他引用古典经济学巨匠阿尔弗雷德·马歇尔的话，来描述这种金融急躁；孩子把李子从布丁里挑出来立即吃掉，而不是放在一边最后再吃。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>他引用马歇尔的话描述金融急躁。\u003c/p>\n\u003c/blockquote>\n\u003cp>先在“马歇尔”前放上身份，再把描述的对象接到“描述”后面。孩子的两种吃法是对金融急躁的比喻，放在后半句，用“就像”引出；“而不是”只连接两种吃法，不要接成两位说话人的对比。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>他引用古典经济学巨匠阿尔弗雷德·马歇尔的话来描述这种金融急躁：孩子们把李子从布丁里挑出来立即吃掉，而不是放在一边留到最后吃。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“放在一边最后再吃”整理成“留到最后再吃”，中文更简洁，但先吃与后吃的对比仍保留。\u003c/p>\n\u003cp>“来描述”说明引用的用途；不要把它改成马歇尔在评论这一次英国新规，也不要丢掉“立即”所体现的急躁。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>他引用古典经济学巨匠阿尔弗雷德·马歇尔的话来描述这种金融急躁，就像&quot;孩子们把李子从布丁里挑出来立即吃掉&quot;，而不是把它们留到最后再吃。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;There seems to be a predominance of short-term thinking at the expense of long-term investing,&quot; said Commissioner Daniel Gallagher of the US Securities and Exchange Commission in a speech this week.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;There seems to be / a predominance of short-term thinking / at the expense of long-term investing,&quot; / said Commissioner Daniel Gallagher / of the US Securities and Exchange Commission / in a speech this week.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;似乎存在 / 短期思维的主导 / 以长期投资为代价，&quot; / 专员丹尼尔·加拉格尔说 / 美国证券交易委员会的 / 在本周的演讲中。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先说清作出评论的人和时间：\u003c/p>\n\u003cblockquote>\n\u003cp>美国证券交易委员会专员丹尼尔·加拉格尔在本周的演讲中说\u003c/p>\n\u003c/blockquote>\n\u003cp>再把短期思维的地位与它带来的代价接在一起：\u003c/p>\n\u003cblockquote>\n\u003cp>短期思维似乎处于主导地位，而长期投资为此付出了代价\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>美国证券交易委员会专员丹尼尔·加拉格尔在本周的演讲中说；短期思维似乎处于主导地位，而长期投资为此付出了代价。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>加拉格尔说，短期思维似乎占主导。\u003c/p>\n\u003c/blockquote>\n\u003cp>把机构名称放到说话人身份前，把“本周的演讲中”放在“说”前。说话内容中先提出短期思维占主导，再补充受损的是长期投资；“似乎”保留在判断前，不能把语气改成绝对断言。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>美国证券交易委员会专员丹尼尔·加拉格尔在本周演讲中说，短期思维似乎处于主导地位，而这种主导以长期投资为代价。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“存在短期思维的主导”改成“短期思维占主导地位”，让中文主语直接带动作。\u003c/p>\n\u003cp>把“长期投资为此付出了代价”压成“以长期投资为代价”，与前一句相接，明确代价承受者。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>美国证券交易委员会专员丹尼尔·加拉格尔在本周的演讲中说：&quot;短期思维似乎占主导地位，这是以长期投资为代价的。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch2>第5段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to defer performance bonuses for senior executives by about a year, slightly helping reduce &quot;short-termism.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>In the US, / the Sarbanes-Oxley Act of 2002 / has pushed most public companies / to defer performance bonuses / for senior executives / by about a year, / slightly helping reduce / &quot;short-termism.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>在美国，/ 2002年的萨班斯-奥克斯利法案 / 已经推动大多数上市公司 / 推迟绩效奖金 / 给高级管理人员 / 大约一年，/ 略微帮助减少 / &quot;短期主义&quot;。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把奖金发给谁、推迟多久合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>大多数上市公司把给高级管理人员的绩效奖金推迟大约一年\u003c/p>\n\u003c/blockquote>\n\u003cp>再把法案的推动与减少短期主义的效果接上：\u003c/p>\n\u003cblockquote>\n\u003cp>在美国，2002年的法案推动这种延期，对减少短期主义略微有帮助\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>大多数上市公司把给高级管理人员的绩效奖金推迟大约一年；在美国，2002年的法案推动这种延期，对减少短期主义略微有帮助。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>法案推动公司推迟发放奖金。\u003c/p>\n\u003c/blockquote>\n\u003cp>“在美国”和法案年份放在句首；“高级管理人员的”放到绩效奖金前；“大约一年”说明延期长度，紧跟推迟发放。最后另接这项安排的有限效果，让“略微”修饰帮助减少短期主义。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>在美国，2002年的萨班斯-奥克斯利法案推动大多数上市公司，把高级管理人员的绩效奖金推迟大约一年发放，对减少短期主义略有帮助。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>把“推迟绩效奖金给高级管理人员”改成“将高级管理人员的绩效奖金推迟发放”，避免像是在推迟某个人。\u003c/p>\n\u003cp>保留“大约”和“略微”，原文既没有规定精确到一天，也没有说这种措施彻底消除了短期主义。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>在美国，2002年的萨班斯-奥克斯利法案已经推动大多数上市公司将高级管理人员的绩效奖金推迟约一年发放，这略微有助于减少&quot;短期主义&quot;。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>25题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一个最适合作为全文标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Decisiveness Required of Top Executives\u003c/strong>\u003c/p>\n\u003cp>要求高管具备决断力\u003c/p>\n\u003cp>B. \u003cstrong>Failure of Quarterly Capitalism\u003c/strong>\u003c/p>\n\u003cp>季度资本主义的失败\u003c/p>\n\u003cp>C. \u003cstrong>Patience as a Corporate Virtue\u003c/strong>\u003c/p>\n\u003cp>耐心是一种企业美德\u003c/p>\n\u003cp>D. \u003cstrong>Frustration of Risk-taking Bankers\u003c/strong>\u003c/p>\n\u003cp>冒险银行家的挫败感\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>新规约束银行行为，也期待公司多作长期决策\u003c/td>\n\u003ctd>先摆出新做法并提出长远期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>点出短期逐利加重，用孩子先吃作比较\u003c/td>\n\u003ctd>再说问题正在加重并打个比方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>持股变短，季度逐利会阻碍公司长期投入\u003c/td>\n\u003ctd>再说行为变短后会妨碍长远的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>数字技术加速交易，短期思考损害长期投资\u003c/td>\n\u003ctd>再说还有什么使问题加重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍美国通过高管奖金减少短期主义的尝试\u003c/td>\n\u003ctd>举一个例子说明已经怎样改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>提出更多鼓励长期的做法，再举法国奖励\u003c/td>\n\u003ctd>接着补充还能怎样继续改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>回到新规，强调公司行为关乎社会长期利益\u003c/td>\n\u003ctd>最后收回来说明大家的长远要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>A. Decisiveness Required of Top Executives\u003c/h3>\n\u003cp>要求高管具备决断力\u003c/p>\n\u003ch4>如果 A 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>要求高管具备决断力\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先介绍要求高管作出明确而坚定决策的新规定，并期待这种决断力支持企业的长远发展。\u003c/td>\n\u003ctd>先摆出新做法并提出长远期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明高管左右摇摆、无法坚持决定的现象正在加重，比作孩子面对食物反复改变主意。\u003c/td>\n\u003ctd>再说问题正在加重并打个比方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出高管的承诺期限越来越短，尚未执行就推翻决定，使需要持续投入的长期项目受阻。\u003c/td>\n\u003ctd>再说行为变短后会妨碍长远的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>补充即时信息和密集评价使高管更易随外部声音改主意，进一步削弱坚定决断。\u003c/td>\n\u003ctd>再说还有什么使问题加重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍美国把决策责任与考核结合的安排，说明它已使高管更敢作出并执行决定。\u003c/td>\n\u003ctd>举一个例子说明已经怎样改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>再提出完善授权和评价机制，以法国减少决策反复的安排说明还可怎样加强决断力。\u003c/td>\n\u003ctd>接着补充还能怎样继续改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>回到开头的新要求，强调社会长期利益需要高管在充分考虑后作出坚定决定。\u003c/td>\n\u003ctd>最后收回来说明大家的长远要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>如果中心是Decisiveness，文章需要围绕“拿不定主意—怎样果断作决定”展开。实际第2、3段批评的却是想快拿利润、持股时间缩短，并不是犹豫太久；第4段还把交易更快与注意持续时间更短连在一起，这种加快在这里使问题更重。第5、6段调整奖金和持有较久才多得权利，也是在把经营者和股东的眼光拉远。结尾要求看任期以外和社会长期利益，而不是催高管更快拍板。高管确实出现了，但文章关注决定考虑多长时间，A关注决定作得是否果断，两条主线并不相同。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>B. Failure of Quarterly Capitalism\u003c/h3>\n\u003cp>季度资本主义的失败\u003c/p>\n\u003ch4>如果 B 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>季度资本主义的失败\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先介绍修补季度资本主义缺陷的新制度，期待纠正这种失败的经营导向并保护长期经济。\u003c/td>\n\u003ctd>先摆出新做法并提出长远期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明季度考核的失灵越来越严重，比作只顾抢吃眼前食物而破坏整顿饭安排。\u003c/td>\n\u003ctd>再说问题正在加重并打个比方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出投资期限不断缩短，使企业牺牲长期研究，具体展现季度资本主义无法承担长期建设。\u003c/td>\n\u003ctd>再说行为变短后会妨碍长远的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释高速交易又放大季度指标压力，使这种模式的短视缺陷进一步暴露。\u003c/td>\n\u003ctd>再说还有什么使问题加重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举美国延缓兑现绩效奖励的改革，说明已有办法开始修补季度资本主义的失败之处。\u003c/td>\n\u003ctd>举一个例子说明已经怎样改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>补充法国奖励长期持股等替代激励，说明针对这种模式失灵还应继续改进。\u003c/td>\n\u003ctd>接着补充还能怎样继续改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>总结季度导向的失败不能再由社会承担，制度调整应恢复企业服务长远利益的能力。\u003c/td>\n\u003ctd>最后收回来说明大家的长远要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>“quarterly capitalism”出现在第3段，确实与公司只顾季度利润的现象相关。但B把全文中心定成Failure，要求作者证明这套模式失败。文章从英国新规的长远期待写起，第2至4段解释为什么短期逐利值得担忧，第5、6段转向已经采取和还能采取的改善做法，第7段再说社会对公司长期行为的要求。它没有把美国和法国写成某种经济模式已经失败的证据，而是把它们写成鼓励长期的安排。B能覆盖中间对短期做法的批评，却把正文中很大一部分“可以怎样改”压成了失败的例证。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>C. Patience as a Corporate Virtue\u003c/h3>\n\u003cp>耐心是一种企业美德\u003c/p>\n\u003ch4>如果 C 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>耐心是一种企业美德\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>介绍让奖金承担长期后果的新规则，期待银行及其他公司愿意等待长期回报。\u003c/td>\n\u003ctd>先摆出新做法并提出长远期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明急于兑现利润的倾向加重，以孩子先吃李子的比喻表现企业缺乏耐心。\u003c/td>\n\u003ctd>再说问题正在加重并打个比方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>用持股时间变短说明缺乏耐心如何挤压长期研究和顾客关系建设。\u003c/td>\n\u003ctd>再说行为变短后会妨碍长远的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释数字交易提速使人们更难等待，进一步强化应以耐心保护长期投资的理由。\u003c/td>\n\u003ctd>再说还有什么使问题加重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>介绍美国延缓高管奖金的做法，说明激励制度已经开始奖励更有耐心的企业行为。\u003c/td>\n\u003ctd>举一个例子说明已经怎样改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>提出税制与披露等进一步安排，并以法国长期持股奖励说明耐心还可怎样得到支持。\u003c/td>\n\u003ctd>接着补充还能怎样继续改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>回到社会关心长期表现的要求，把耐心确立为企业应为各方利益保持的品质。\u003c/td>\n\u003ctd>最后收回来说明大家的长远要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Patience不是让公司什么都不做，而是在公司的决定中愿意等待并顾及长远。第1段希望更多long-term decision-making，第2段把急着得利比作孩子马上吃，第3、4段说明这种急迫怎样影响长期投入；这几步把为什么需要耐心说清。第5、6段接着写奖金、较久持有与更多权利，把“如何鼓励长期行为”接上来。最后社会关注的不只是短期表现，还有长期表现，正好回到耐心为什么是公司应有的品质。Corporate也覆盖银行、公司高管和股东这些对象，没有把全文只缩到一类银行家。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>D. Frustration of Risk-taking Bankers\u003c/h3>\n\u003cp>冒险银行家的挫败感\u003c/p>\n\u003ch4>如果 D 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>冒险银行家的挫败感\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先介绍针对冒险银行家受挫情绪的新应对办法，并期待他们恢复稳定的长期工作状态。\u003c/td>\n\u003ctd>先摆出新做法并提出长远期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明奖金受限后的挫败感正在加重，把他们的失落比作孩子期待落空后的不满。\u003c/td>\n\u003ctd>再说问题正在加重并打个比方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出受挫银行家将工作承诺缩短为眼前得失，使原本需要坚持的长期项目受到妨碍。\u003c/td>\n\u003ctd>再说行为变短后会妨碍长远的事\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>再解释即时评价和高速信息传播使银行家更频繁感到失败，加重这种挫折体验。\u003c/td>\n\u003ctd>再说还有什么使问题加重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举美国通过更明确的评价与反馈缓解银行家挫败情绪的例子，交代已有改善。\u003c/td>\n\u003ctd>举一个例子说明已经怎样改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>补充法国提供长期支持与申诉渠道的安排，说明还可怎样帮助冒险银行家处理受挫感。\u003c/td>\n\u003ctd>接着补充还能怎样继续改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>回到银行家如何走出挫败的问题，指出社会需要他们恢复能够顾及长远的心理状态。\u003c/td>\n\u003ctd>最后收回来说明大家的长远要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第1段有bankers和harmful risk-taking，新规还可能延后高管奖金，D因此看起来碰到了开头的一些词。可Frustration要求文章以银行家的受挫感受为中心，实际后面写的是上市公司、投资者、数字交易以及政策安排，没有继续描写银行家失望、不满或受挫的心理。第6段的法国例子甚至以股东持有时间和投票权为内容，第7段讨论的是社会对银行家长期表现的利益关切。D不但把公司范围缩成冒险银行家，也把行为规则和长期后果改成他们自己的情绪。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>25题结论\u003c/h3>\n\u003cp>\u003cstrong>25. C. Patience as a Corporate Virtue\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Patience as a Corporate Virtue / 耐心是一种企业美德\u003c/strong>\u003c/p>\n\u003ch2>21题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Paragraph 1, one motive in imposing the new rule is to ______.\u003cbr>根据第1段，实行这条新规则的一个动机是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>目的细节题。题干要求判断“根据第1段，实行这条新规则的一个动机是什么？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Financial regulators in Britain have imposed a rather unusual rule on the bosses of big banks. Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing. The main purpose of this &quot;clawback&quot; rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions. Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.\u003c/p>\n\u003c/blockquote>\n\u003cp>规则把奖金延期与银行的不当冒险联系起来，明确写出要求银行家负责、恢复信任，并希望公司作更多长期决策。\u003c/p>\n\u003ch3>A. guarantee the bonuses of top executives\u003c/h3>\n\u003cblockquote>\n\u003cp>保证高管的奖金\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 guarantee the bonuses 是“保证奖金”，原文的 could be delayed 10 years 则在说明这些奖金会怎样处理；两边说的是同一笔高管奖金，所以回看从 Starting next year 开始的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。could be delayed 10 years 给的是限制和延期，并没有把发放奖金当作需要保护的目标。A的 guarantee the bonuses 则把这条规则说成保证高管奖金的措施；一个在出现问题时扣住奖金，一个以保证奖金为目的，奖金相同，规则对奖金做的事却变了。\u003c/p>\n\u003cp>高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>英国实行这条新规则的一个动机是保证高管的奖金。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 guarantee the bonuses 是“保证奖金”，原文的 could be delayed 10 years 则在说明这些奖金会怎样处理；两边说的是同一笔高管奖金，所以回看从 Starting next year 开始的句子。\u003c/p>\n\u003cp>原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。could be delayed 10 years 给的是限制和延期，并没有把发放奖金当作需要保护的目标。A的 guarantee the bonuses 则把这条规则说成保证高管奖金的措施；一个在出现问题时扣住奖金，一个以保证奖金为目的，奖金相同，规则对奖金做的事却变了。\u003c/p>\n\u003cp>高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing.\u003c/p>\n\u003cp>规则把奖金延期与银行的不当冒险联系起来，明确写出要求银行家负责、恢复信任，并希望公司作更多长期决策。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：新规约束银行行为，也期待公司多作长期决策。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new rule is intended to guarantee that top executives receive their bonuses.\u003c/p>\n\u003cp>新规则旨在保证高管拿到奖金。\u003c/p>\n\u003c/blockquote>\n\u003cp>如果保证发奖金是目的，作者应说明规则如何保护奖金领取。实际在银行被调查时可以延后十年，奖金是约束冒险的工具，不能把限制发放写成保证领取。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>耐心与长期责任是全文方向，因此规则应约束只顾眼前的行为；具体动机仍须由第1段的问责和恢复信任来确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>guarantee the bonuses of top executives\u003cbr>保证高管的奖金\u003c/p>\n\u003c/blockquote>\n\u003cp>高管奖金在这里是银行行为有问题时可以被延后的东西；不能因为规则涉及奖金，就把对奖金的限制读成保证发放。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：新规约束银行行为，也期待公司多作长期决策\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. enhance bankers’ sense of responsibility\u003c/h3>\n\u003cblockquote>\n\u003cp>增强银行家的责任意识\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“[xxx] bankers’ sense of responsibility”，保留了相应遮挡。当时的定位线索是：B里的 bankers’ sense of responsibility 说银行家的责任，原文的 for harmful risk-taking 也把银行家与有害的冒险行为连在一起；两边都在谈银行家怎样面对自己的行为，所以回看 The main purpose 开始的句子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>先看hold bankers accountable for harmful risk-taking：被要求负责的是银行家，责任指向有害冒险造成的后果。accountable表示要对行为承担责任，后面的restore public trust说明这种问责还服务于恢复公众信任。\u003c/p>\n\u003cp>选项enhance bankers’ sense of responsibility把这种约束概括成增强责任意识。它保留银行家这个主体和对自身行为负责这个方向，没有把规则改成保护奖金；奖金可能延期正是让责任不能随短期收益结束而消失的手段。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The main purpose of this &quot;clawback&quot; rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>英国实行这条新规则的一个动机是增强银行家的责任意识。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的 bankers’ sense of responsibility 说银行家的责任，原文的 for harmful risk-taking 也把银行家与有害的冒险行为连在一起；两边都在谈银行家怎样面对自己的行为，所以回看 The main purpose 开始的句子。\u003c/p>\n\u003cp>先看hold bankers accountable for harmful risk-taking：被要求负责的是银行家，责任指向有害冒险造成的后果。accountable表示要对行为承担责任，后面的restore public trust说明这种问责还服务于恢复公众信任。\u003c/p>\n\u003cp>选项enhance bankers’ sense of responsibility把这种约束概括成增强责任意识。它保留银行家这个主体和对自身行为负责这个方向，没有把规则改成保护奖金；奖金可能延期正是让责任不能随短期收益结束而消失的手段。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The main purpose of this &quot;clawback&quot; rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions.\u003c/p>\n\u003cp>规则把奖金延期与银行的不当冒险联系起来，明确写出要求银行家负责、恢复信任，并希望公司作更多长期决策。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：新规约束银行行为，也期待公司多作长期决策。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The rule aims to strengthen bankers’ responsibility for harmful risk-taking.\u003c/p>\n\u003cp>规则旨在增强银行家对有害冒险行为的责任意识。\u003c/p>\n\u003c/blockquote>\n\u003cp>这项假设把责任对象落在银行家，把责任内容落在冒险后果上，正好接住hold bankers accountable。后面的恢复公众信任又说明这种问责服务于长期关系。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>耐心与长期责任是全文方向，因此规则应约束只顾眼前的行为；具体动机仍须由第1段的问责和恢复信任来确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>enhance bankers’ sense of responsibility\u003cbr>增强银行家的责任意识\u003c/p>\n\u003c/blockquote>\n\u003cp>选项enhance bankers’ sense of responsibility把这种约束概括成增强责任意识。它保留银行家这个主体和对自身行为负责这个方向，没有把规则改成保护奖金；奖金可能延期正是让责任不能随短期收益结束而消失的手段。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：新规约束银行行为，也期待公司多作长期决策\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. build a new system of financial regulation\u003c/h3>\n\u003cblockquote>\n\u003cp>建立一套新的金融监管体系\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 a new system of financial regulation 指一整套金融监管体系，原文的 a rather unusual rule 指对银行老板施加的这一条规则；两边都涉及管理银行，所以先回看第一句，再接着看明确说明主要目的的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文先给出 a rather unusual rule，再说明它约束的是大银行老板，具体涉及奖金以及有害冒险行为。主要目的的两个动作，都落在银行家及公众信任上。C却把要完成的事情改成建立 a new system of financial regulation，要求原文谈一整套新体系怎样建立。\u003c/p>\n\u003cp>一条新要求不等于一整套新体系，原文说明的目的也已经落到银行家行为和公众信任；C把要实现的事情换掉了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Financial regulators in Britain have imposed a rather unusual rule on the bosses of big banks.\u003c/p>\n\u003cp>The main purpose of this &quot;clawback&quot; rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>英国实行这条新规则的一个动机是建立一套新的金融监管体系。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 a new system of financial regulation 指一整套金融监管体系，原文的 a rather unusual rule 指对银行老板施加的这一条规则；两边都涉及管理银行，所以先回看第一句，再接着看明确说明主要目的的句子。\u003c/p>\n\u003cp>原文先给出 a rather unusual rule，再说明它约束的是大银行老板，具体涉及奖金以及有害冒险行为。主要目的的两个动作，都落在银行家及公众信任上。C却把要完成的事情改成建立 a new system of financial regulation，要求原文谈一整套新体系怎样建立。\u003c/p>\n\u003cp>一条新要求不等于一整套新体系，原文说明的目的也已经落到银行家行为和公众信任；C把要实现的事情换掉了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Financial regulators in Britain have imposed a rather unusual rule on the bosses of big banks.\u003c/p>\n\u003cp>The main purpose of this &quot;clawback&quot; rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions.\u003c/p>\n\u003cp>规则把奖金延期与银行的不当冒险联系起来，明确写出要求银行家负责、恢复信任，并希望公司作更多长期决策。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：新规约束银行行为，也期待公司多作长期决策。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new rule is intended to create an entirely new system of financial regulation.\u003c/p>\n\u003cp>新规则旨在建立一整套全新的金融监管体系。\u003c/p>\n\u003c/blockquote>\n\u003cp>这一路线需要继续交代新体系的组织、覆盖范围与建设安排。实际围绕一条奖金追索规定写行为激励，没有从局部新要求推出整套体系的创建。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>耐心与长期责任是全文方向，因此规则应约束只顾眼前的行为；具体动机仍须由第1段的问责和恢复信任来确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>build a new system of financial regulation\u003cbr>建立一套新的金融监管体系\u003c/p>\n\u003c/blockquote>\n\u003cp>一条新要求不等于一整套新体系，原文说明的目的也已经落到银行家行为和公众信任；C把要实现的事情换掉了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：新规约束银行行为，也期待公司多作长期决策\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. help corporations achieve larger profits\u003c/h3>\n\u003cblockquote>\n\u003cp>帮助公司获得更大利润\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 corporations 和原文的 all corporations 是同一类对象，但 achieve larger profits 要和原文希望的 a much larger benefit 分清；因此回看 Yet officials also hope 后面的整句，看看这个好处具体是什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文用冒号解释 a much larger benefit：银行和所有公司作出更多长期决策，为未来几代人建立更强的经济。D的 achieve larger profits 则是让公司自己赚到更大利润。两边虽然都有“更大”和公司，但原文 bigger 的对象是这条规则给经济和未来几代人的好处，D bigger 的对象是公司的利润。more long-term decision-making 说决策看多远，也没有写利润要变大。把 benefit 读成 profits，就把面向未来经济的目标缩成了公司赚钱。\u003c/p>\n\u003cp>公司是被要求作长期决策的主体，未来几代人的经济才是后面指出的目的；D把这两个位置合成了公司利润增加。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>英国实行这条新规则的一个动机是帮助公司获得更大利润。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 corporations 和原文的 all corporations 是同一类对象，但 achieve larger profits 要和原文希望的 a much larger benefit 分清；因此回看 Yet officials also hope 后面的整句，看看这个好处具体是什么。\u003c/p>\n\u003cp>原文用冒号解释 a much larger benefit：银行和所有公司作出更多长期决策，为未来几代人建立更强的经济。D的 achieve larger profits 则是让公司自己赚到更大利润。两边虽然都有“更大”和公司，但原文 bigger 的对象是这条规则给经济和未来几代人的好处，D bigger 的对象是公司的利润。more long-term decision-making 说决策看多远，也没有写利润要变大。把 benefit 读成 profits，就把面向未来经济的目标缩成了公司赚钱。\u003c/p>\n\u003cp>公司是被要求作长期决策的主体，未来几代人的经济才是后面指出的目的；D把这两个位置合成了公司利润增加。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.\u003c/p>\n\u003cp>规则把奖金延期与银行的不当冒险联系起来，明确写出要求银行家负责、恢复信任，并希望公司作更多长期决策。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：新规约束银行行为，也期待公司多作长期决策。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Officials introduced the rule so that corporations could earn larger profits.\u003c/p>\n\u003cp>官员出台规则，是为了让公司赚取更大利润。\u003c/p>\n\u003c/blockquote>\n\u003cp>假设将收益落到公司利润上，后文应证明盈利增长。实际冒号解释的benefit是长期决策和后代的经济，不是把larger与profits重新拼成企业获利目标。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>耐心与长期责任是全文方向，因此规则应约束只顾眼前的行为；具体动机仍须由第1段的问责和恢复信任来确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>help corporations achieve larger profits\u003cbr>帮助公司获得更大利润\u003c/p>\n\u003c/blockquote>\n\u003cp>公司是被要求作长期决策的主体，未来几代人的经济才是后面指出的目的；D把这两个位置合成了公司利润增加。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：新规约束银行行为，也期待公司多作长期决策\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>21题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>21. B. enhance bankers’ sense of responsibility\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文把银行因不当行为接受调查作为条件：出现这种情况，高管的奖金可能被推迟10年。\u003c/p>\n\u003cp>B：先看hold bankers accountable for harmful risk-taking：被要求负责的是银行家，责任指向有害冒险造成的后果。\u003c/p>\n\u003cp>C：原文先给出 a rather unusual rule，再说明它约束的是大银行老板，具体涉及奖金以及有害冒险行为。\u003c/p>\n\u003cp>D：原文用冒号解释 a much larger benefit：银行和所有公司作出更多长期决策，为未来几代人建立更强的经济。\u003c/p>\n\u003ch2>22题\u003c/h2>\n\u003cblockquote>\n\u003cp>Alfred Marshall is quoted to indicate ______.\u003cbr>引用Alfred Marshall的话，是为了说明什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>例子作用题。题干要求判断“引用Alfred Marshall的话，是为了说明什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane. He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like &quot;children who pick the plums out of their pudding to eat them at once&quot; rather than putting them aside to be eaten last.\u003c/p>\n\u003c/blockquote>\n\u003cp>先提出上市公司追逐快速利润的问题加重，再用孩子先把好吃的东西挑走的比喻，解释金融上的急躁。\u003c/p>\n\u003ch3>A. the solid structure of publicly traded companies\u003c/h3>\n\u003cblockquote>\n\u003cp>上市公司稳固的结构\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时选项呈现为“the [xxx] structure of publicly traded companies”，保留了相应遮挡。当时的定位线索是：A的 structure of publicly traded companies 和原文 in publicly traded companies 都提到上市公司，所以回到第2段第一句；紧接着再看 acting like children 的比较，区分原文谈的是公司结构还是追求利润的行为。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 in publicly traded companies 交代现象发生在哪里，现象本身是 the desire for quick profits，接着借孩子马上吃东西的动作描述它。A的 structure of publicly traded companies 却把要描述的对象变成上市公司的结构。孩子先吃还是后吃，对应的是取舍和等待，无法对应公司内部怎样组成、层级怎样安排。\u003c/p>\n\u003cp>上市公司在原文里是短期逐利现象所在的地方，并不是引语要解释的组成结构。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane.\u003c/p>\n\u003cp>He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like &quot;children who pick the plums out of their pudding to eat them at once&quot; rather than putting them aside to be eaten last.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者引用阿尔弗雷德·马歇尔，是为了说明上市公司稳固的结构。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 structure of publicly traded companies 和原文 in publicly traded companies 都提到上市公司，所以回到第2段第一句；紧接着再看 acting like children 的比较，区分原文谈的是公司结构还是追求利润的行为。\u003c/p>\n\u003cp>原文 in publicly traded companies 交代现象发生在哪里，现象本身是 the desire for quick profits，接着借孩子马上吃东西的动作描述它。A的 structure of publicly traded companies 却把要描述的对象变成上市公司的结构。孩子先吃还是后吃，对应的是取舍和等待，无法对应公司内部怎样组成、层级怎样安排。\u003c/p>\n\u003cp>上市公司在原文里是短期逐利现象所在的地方，并不是引语要解释的组成结构。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane.\u003c/p>\n\u003cp>He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like &quot;children who pick the plums out of their pudding to eat them at once&quot; rather than putting them aside to be eaten last.\u003c/p>\n\u003cp>先提出上市公司追逐快速利润的问题加重，再用孩子先把好吃的东西挑走的比喻，解释金融上的急躁。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：点出短期逐利加重，用孩子先吃作比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Marshall’s comparison shows how solid the structure of publicly traded companies is.\u003c/p>\n\u003cp>马歇尔的比喻说明上市公司的结构多么稳固。\u003c/p>\n\u003c/blockquote>\n\u003cp>若为稳固结构服务，孩子与布丁的细节应对应公司组织如何稳定。实际对应的是先吃还是留到最后，比较维度是耐心和利益兑现时间。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文倡导企业耐心，引用应把缺乏耐心、急于兑现眼前收益的问题说具体，而非论证政府决策或公司组织结构。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the solid structure of publicly traded companies\u003cbr>上市公司稳固的结构\u003c/p>\n\u003c/blockquote>\n\u003cp>上市公司在原文里是短期逐利现象所在的地方，并不是引语要解释的组成结构。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：点出短期逐利加重，用孩子先吃作比较\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. governments’ impatience in decision-making\u003c/h3>\n\u003cblockquote>\n\u003cp>政府在决策中的急躁\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 governments’ impatience 说政府没有耐心，原文的 the desire for quick profits 与 to eat them at once 确实也写到急着获得眼前东西；所以回看这一段首句及孩子比喻，确认没有耐心的是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 the desire for quick profits 发生在上市公司，孩子“马上吃”的比喻用来描述这种急着取得眼前利润的行为。B的 governments’ impatience 把主体改成政府。Haldane是说这段话的经济学家，他所在机构的名字也不等于这段批评政府；要被描述的主体已经由 in publicly traded companies 给出，不能把发言者所在机构换成被批评的政府。\u003c/p>\n\u003cp>原文把“短期主义”放在上市公司中，B却让政府承担了这个行为，主体发生了变化。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者引用阿尔弗雷德·马歇尔，是为了说明政府在决策中的急躁。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 governments’ impatience 说政府没有耐心，原文的 the desire for quick profits 与 to eat them at once 确实也写到急着获得眼前东西；所以回看这一段首句及孩子比喻，确认没有耐心的是谁。\u003c/p>\n\u003cp>原文的 the desire for quick profits 发生在上市公司，孩子“马上吃”的比喻用来描述这种急着取得眼前利润的行为。B的 governments’ impatience 把主体改成政府。Haldane是说这段话的经济学家，他所在机构的名字也不等于这段批评政府；要被描述的主体已经由 in publicly traded companies 给出，不能把发言者所在机构换成被批评的政府。\u003c/p>\n\u003cp>原文把“短期主义”放在上市公司中，B却让政府承担了这个行为，主体发生了变化。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane.\u003c/p>\n\u003cp>先提出上市公司追逐快速利润的问题加重，再用孩子先把好吃的东西挑走的比喻，解释金融上的急躁。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：点出短期逐利加重，用孩子先吃作比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Marshall’s words describe governments’ impatience when making decisions.\u003c/p>\n\u003cp>马歇尔的话描述政府作决策时的急躁。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文引语前锁定的是publicly traded companies，政府只在别处制定规则。假设把被批评者换成政府，无法接住上市公司急于获利这个前提。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文倡导企业耐心，引用应把缺乏耐心、急于兑现眼前收益的问题说具体，而非论证政府决策或公司组织结构。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>governments’ impatience in decision-making\u003cbr>政府在决策中的急躁\u003c/p>\n\u003c/blockquote>\n\u003cp>原文把“短期主义”放在上市公司中，B却让政府承担了这个行为，主体发生了变化。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：点出短期逐利加重，用孩子先吃作比较\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. the conditions for generating quick profits\u003c/h3>\n\u003cblockquote>\n\u003cp>产生快速利润的条件\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时选项呈现为“the conditions for 微乎其微的。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 minimal 判断影响有多大，而原文的 hinder a firm’s efforts 写投资者会影响公司的努力；两边都在谈对公司的影响，所以回看 Transient investors 开始的句子，看看阻碍的程度有没有讲清。\u003c/p>\n\u003cp>minimal的完整意思是影响小到几乎可以忽略。原文没有衡量影响大小，而是说短期投资者要求高季度利润，这种压力can hinder长期研究和顾客忠诚度方面的努力。\u003c/p>\n\u003cp>hinder提供的是不利方向，不能单凭它推断影响一定巨大；但缺少巨大损害的证明，同样不能变成影响极小的证明。A增加了原文没有给出的程度，C的adverse只概括已经写出的阻碍关系。\u003c/p>\n\u003cp>持股时间从七年缩到七个月，短期投资者要求高季度利润，会妨碍长期研究投入和顾客忠诚度建设。\u003c/p>\n\u003cp>这需要一项轻微程度的说明，或者长期投入基本不受影响的证据。实际hinder只给出阻碍方向，没有量化程度；不能因没有写严重就填入minimal。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Transient investors, who demand high quarterly profits from companies, can hinder a firm&#39;s efforts to invest in long-term research or to build up customer loyalty.\u003c/p>\n\u003cp>持股时间从七年缩到七个月，短期投资者要求高季度利润，会妨碍长期研究投入和顾客忠诚度建设。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：持股变短，季度逐利会阻碍公司长期投入。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Transient investment has only a negligible effect on companies’ long-term plans.\u003c/p>\n\u003cp>短期投资对公司的长期计划影响微乎其微。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要一项轻微程度的说明，或者长期投入基本不受影响的证据。实际hinder只给出阻碍方向，没有量化程度；不能因没有写严重就填入minimal。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求重视长期价值，题干应回答短期逐利对长期投入的影响方向；主旨不能替代局部原文判断影响究竟多大、是否间接或持续多久。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>minimal\u003cbr>微乎其微的\u003c/p>\n\u003c/blockquote>\n\u003cp>hinder提供的是不利方向，不能单凭它推断影响一定巨大；但缺少巨大损害的证明，同样不能变成影响极小的证明。A增加了原文没有给出的程度，C的adverse只概括已经写出的阻碍关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：持股变短，季度逐利会阻碍公司长期投入\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. indirect\u003c/h3>\n\u003cblockquote>\n\u003cp>间接的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 indirect 要判断影响是否通过别的对象绕一层，原文的 demand high quarterly profits 写投资者直接向公司提出要求；因此回看第3段第2句，从投资者要求利润读到公司的努力受阻。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文先写投资者 demand high quarterly profits，要求对象就是 companies；接着仍以这些投资者作主语，直接说他们 can hinder a firm’s efforts。公司既承受季度利润要求，公司的长期投入也直接成为阻碍的对象。B的 indirect 却要把文中这条影响说成间接作用；句子没有先让投资者影响另一类人，再由那类人传给公司，而是从投资者的要求直接连到公司的经营努力。\u003c/p>\n\u003cp>投资者面对的是公司，公司自己的长期经营努力就是被影响的对象，B改变了这里说明的作用关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Transient investors, who demand high quarterly profits from companies, can hinder a firm&#39;s efforts to invest in long-term research or to build up customer loyalty.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>短期投资对上市公司的影响可能是间接的。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 indirect 要判断影响是否通过别的对象绕一层，原文的 demand high quarterly profits 写投资者直接向公司提出要求；因此回看第3段第2句，从投资者要求利润读到公司的努力受阻。\u003c/p>\n\u003cp>原文先写投资者 demand high quarterly profits，要求对象就是 companies；接着仍以这些投资者作主语，直接说他们 can hinder a firm’s efforts。公司既承受季度利润要求，公司的长期投入也直接成为阻碍的对象。B的 indirect 却要把文中这条影响说成间接作用；句子没有先让投资者影响另一类人，再由那类人传给公司，而是从投资者的要求直接连到公司的经营努力。\u003c/p>\n\u003cp>投资者面对的是公司，公司自己的长期经营努力就是被影响的对象，B改变了这里说明的作用关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Transient investors, who demand high quarterly profits from companies, can hinder a firm&#39;s efforts to invest in long-term research or to build up customer loyalty.\u003c/p>\n\u003cp>持股时间从七年缩到七个月，短期投资者要求高季度利润，会妨碍长期研究投入和顾客忠诚度建设。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：持股变短，季度逐利会阻碍公司长期投入。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Transient investment affects long-term research only through a clearly indirect channel.\u003c/p>\n\u003cp>短期投资只通过明确的间接渠道影响长期研究。\u003c/p>\n\u003c/blockquote>\n\u003cp>如果重点是间接性，文章应区分作用路径并说明中介环节。实际用高季度利润要求与长期努力相连，题目可据此读出不利，读不出indirect这种机制判断。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求重视长期价值，题干应回答短期逐利对长期投入的影响方向；主旨不能替代局部原文判断影响究竟多大、是否间接或持续多久。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>indirect\u003cbr>间接的\u003c/p>\n\u003c/blockquote>\n\u003cp>投资者面对的是公司，公司自己的长期经营努力就是被影响的对象，B改变了这里说明的作用关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：持股变短，季度逐利会阻碍公司长期投入\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. adverse\u003c/h3>\n\u003cblockquote>\n\u003cp>不利的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的 adverse 表示不利，原文的 hinder 表示阻碍；阻碍公司的长期努力正是对公司不利的一种表现，所以回看第3段第2句里的投资者、公司的努力和长期研究。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>harm保留hinder所表达的不利方向，两个长期对象也与原文对应。它不声称损害一定巨大，所作概括小于对程度、期限的额外猜测。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Transient investors, who demand high quarterly profits from companies, can hinder a firm&#39;s efforts to invest in long-term research or to build up customer loyalty.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>短期投资对上市公司的影响可能是不利的。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 adverse 表示不利，原文的 hinder 表示阻碍；阻碍公司的长期努力正是对公司不利的一种表现，所以回看第3段第2句里的投资者、公司的努力和长期研究。\u003c/p>\n\u003cp>C的 adverse 并没有补上这些客户内容，也没有要求我们算影响多大，只说影响是不利的。公司在推进长期投入，投资者追逐高季度利润却会让这项努力受阻，从公司努力被妨碍这个结果，就能够接上“不利”这一评价。\u003c/p>\n\u003cp>持股时间从七年缩到七个月，短期投资者要求高季度利润，会妨碍长期研究投入和顾客忠诚度建设。\u003c/p>\n\u003cp>harm保留hinder所表达的不利方向，两个长期对象也与原文对应。它不声称损害一定巨大，所作概括小于对程度、期限的额外猜测。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Transient investors, who demand high quarterly profits from companies, can hinder a firm&#39;s efforts to invest in long-term research or to build up customer loyalty.\u003c/p>\n\u003cp>持股时间从七年缩到七个月，短期投资者要求高季度利润，会妨碍长期研究投入和顾客忠诚度建设。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：持股变短，季度逐利会阻碍公司长期投入。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Pressure for high quarterly profits can harm investment in long-term research and customer loyalty.\u003c/p>\n\u003cp>高季度利润压力会损害长期研究和顾客忠诚度方面的投入。\u003c/p>\n\u003c/blockquote>\n\u003cp>harm保留hinder所表达的不利方向，两个长期对象也与原文对应。它不声称损害一定巨大，所作概括小于对程度、期限的额外猜测。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求重视长期价值，题干应回答短期逐利对长期投入的影响方向；主旨不能替代局部原文判断影响究竟多大、是否间接或持续多久。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>adverse\u003cbr>不利的\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 adverse 并没有补上这些客户内容，也没有要求我们算影响多大，只说影响是不利的。公司在推进长期投入，投资者追逐高季度利润却会让这项努力受阻，从公司努力被妨碍这个结果，就能够接上“不利”这一评价。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：持股变短，季度逐利会阻碍公司长期投入\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. temporary\u003c/h3>\n\u003cblockquote>\n\u003cp>暂时的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 temporary 谈影响持续多久，原文的 Transient investors 则谈投资者停留多久；两者都带有时间意思，所以回看持股从七年变七个月的句子，并与下一句影响长期研究的内容分开。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文先把七年和七个月接在 holding a stock 后面，随后 Transient investors 里的短期也修饰 investors，说明投资者持股的时间短。D的 temporary 接回题干以后却修饰 influence，变成对公司的影响持续很短。原文的影响落在长期研究等经营努力上，并没有让这项阻碍 rance, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\u003c/p>\n\u003c/blockquote>\n\u003cp>美国把高管绩效奖金延后，法国给持股至少两年的股东更多表决权，两处都把激励与更长的时间联系起来。\u003c/p>\n\u003ch3>A. the approaches to promoting “long-termism”\u003c/h3>\n\u003cblockquote>\n\u003cp>促进长期主义的途径\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“the [xxx] to promoting “long-termism””，保留了相应遮挡。当时的定位线索是：A的 promoting “long-termism” 与原文 encourage “long-termism” 都说促进长期主义，因此先回看第6段的开头和法国做法，再接回第5段 helping reduce “short-termism”，看美国例子是否也朝同一个方向。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>approaches在这里指实现目标的途径。美国的defer performance bonuses让奖励兑现向后延，法国的more voting rights奖励至少持有投资两年的股东，都是把具体激励与更长时间绑定。\u003c/p>\n\u003cp>第6段以Much more could be done to encourage long-termism引出补充做法，因此两国例子都在回答怎样促进长期行为。A既概括了两种不同工具，又保留promoting long-termism这一共同用途。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to defer performance bonuses for senior executives by about a year, slightly helping reduce &quot;short-termism.&quot; In its latest survey of CEO pay, The Wall Street Journal finds that &quot;a substantial part&quot; of executive pay is now tied to performance.\u003c/p>\n\u003cp>Much more could be done to encourage &quot;long-termism,&quot; such as changes in the tax code and quicker disclosure of stock acquisitions.\u003c/p>\n\u003cp>In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>美国和法国的例子共同说明促进长期主义的途径。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 promoting “long-termism” 与原文 encourage “long-termism” 都说促进长期主义，因此先回看第6段的开头和法国做法，再接回第5段 helping reduce “short-termism”，看美国例子是否也朝同一个方向。\u003c/p> 003cp>第6段以Much more could be done to encourage long-termism引出补充做法，因此两国例子都在回答怎样促进长期行为。A既概括了两种不同工具，又保留promoting long-termism这一共同用途。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍美国通过高管奖金减少短期主义的尝试提出更多鼓励长期的做法，再举法国奖励\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. the prevalence of short-term thinking\u003c/h3>\n\u003cblockquote>\n\u003cp>短期思维的普遍存在\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 prevalence of short-term thinking 要看短期思维有多普遍，原文的 helping reduce “short-termism” 也提到短期主义，但它在说减少；所以回看美国法案的结果，再把法国奖励较长持有的句子放在一起。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>原文的 helping reduce “short-termism” 写美国采取措施以后减少了一些短期主义，法国则把更多投票权交给至少持有两年的股东，写的是怎样使人愿意持有更久。B的 prevalence of short-term thinking 要求这两个例子呈现短期思维普遍存在，比如人们普遍急着取利。这里美国和法国共同呈现的是朝相反方向调整行为的安排，不能把两国都在采取减少它的做法，直接读成两国的例子是在展示它如何普遍流行。\u003c/p>\n\u003cp>采取措施的国家有两个，不等于这两段在统计短期思维的普及；句子给出的动作和结果都在把行为往长期引导。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>美国和法国的例子共同说明短期思维的普遍存在。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 prevalence of short-term thinking 要看短期思维有多普遍，原文的 helping reduce “short-termism” 也提到短期主义，但它在说减少；所以回看美国法案的结果，再把法国奖励较长持有的句子放在一起。\u003c/p>\n\u003cp>原文的 helping reduce “short-termism” 写美国采取措施以后减少了一些短期主义，法国则把更多投票权交给至少持有两年的股东，写的是怎样使人愿意持有更久。B的 prevalence of short-term thinking 要求这两个例子呈现短期思维普遍存在，比如人们普遍急着取利。这里美国和法国共同呈现的是朝相反方向调整行为的安排，不能把两国都在采取减少它的做法，直接读成两国的例子是在展示它如何普遍流行。\u003c/p>\n\u003cp>采取措施的国家有两个，不等于这两段在统计短期思维的普及；句子给出的动作和结果都在把行为往长期引导。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In France, shareholders w
