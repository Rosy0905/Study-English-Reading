喻在收益时间上重合。后文短持股与季度压力继续沿同一方向展开。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. “short-termism” in economic activities","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Patience as a Corporate Virtue  \n> 耐心是一种企业美德\n\n把这个主旨直接代入22题题干：\n\n> 全文倡导企业耐心，引用应把缺乏耐心、急于兑现眼前收益的问题说具体，而非论证政府决策或公司组织结构。\n\nD实际说的是：\n\n> “short-termism” in economic activities  \n> 经济活动中的短期主义\n\n两者都把眼前取得放在后面等待之前，D既接住段首现象，也解释了孩子比喻在这里的作用。\n\n从全文推进看，这一处的作用是：点出短期逐利加重，用孩子先吃作比较\n\n这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\n\n**复盘判断：D正确。**","context":{"mode":"image","asset":"questions","focus":[250,1102,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"22","option":"D"},"focusId":"focus-q22-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-D-0\">\u003cblockquote>\n\u003cp>经济活动中的短期主义\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 economic activities 说经济活动，原文 the desire for quick profits 就是在说明公司追逐利润的活动；D里的 short-termism 又在段首直接出现，所以回看段首的解释和末尾马上吃、最后吃的对照。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>原文先用 the desire for quick profits 解释短期主义，再把这种金融现象比成孩子马上吃掉东西、不留到最后。D的 economic activities 把上市公司的逐利行为放在经济活动中，short-termism 则接住段首明确说的倾向。\u003c/p>\n\u003cp>两者都把眼前取得放在后面等待之前，D既接住段首现象，也解释了孩子比喻在这里的作用。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者引用阿尔弗雷德·马歇尔，是为了说明经济活动中的短期主义。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 economic activities 说经济活动，原文 the desire for quick profits 就是在说明公司追逐利润的活动；D里的 short-termism 又在段首直接出现，所以回看段首的解释和末尾马上吃、最后吃的对照。\u003c/p>\n\u003cp>原文先用 the desire for quick profits 解释短期主义，再把这种金融现象比成孩子马上吃掉东西、不留到最后。D的 economic activities 把上市公司的逐利行为放在经济活动中，short-termism 则接住段首明确说的倾向。\u003c/p>\n\u003cp>两者都把眼前取得放在后面等待之前，D既接住段首现象，也解释了孩子比喻在这里的作用。\u003c/p>\n\u003cp>先提出上市公司追逐快速利润的问题加重，再用孩子先把好吃的东西挑走的比喻，解释金融上的急躁。\u003c/p>\n\u003cp>先给短期主义下定义，再用立即吃掉而非留到最后使它形象化，观点与比喻在收益时间上重合。后文短持股与季度压力继续沿同一方向展开。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Short-termism&quot; or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England&#39;s top economist, Andrew Haldane.\u003c/p>\n\u003cp>先提出上市公司追逐快速利润的问题加重，再用孩子先把好吃的东西挑走的比喻，解释金融上的急躁。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：点出短期逐利加重，用孩子先吃作比较。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Marshall’s image illustrates the preference for immediate gains in economic activity.\u003c/p>\n\u003cp>马歇尔的比喻说明经济活动中偏爱即时收益的倾向。\u003c/p>\n\u003c/blockquote>\n\u003cp>先给短期主义下定义，再用立即吃掉而非留到最后使它形象化，观点与比喻在收益时间上重合。后文短持股与季度压力继续沿同一方向展开。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文倡导企业耐心，引用应把缺乏耐心、急于兑现眼前收益的问题说具体，而非论证政府决策或公司组织结构。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>“short-termism” in economic activities\u003cbr>经济活动中的短期主义\u003c/p>\n\u003c/blockquote>\n\u003cp>两者都把眼前取得放在后面等待之前，D既接住段首现象，也解释了孩子比喻在这里的作用。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：点出短期逐利加重，用孩子先吃作比较\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"22题结论","level":2,"raw":"### 22题结论\n\n> **22. D. “short-termism” in economic activities**\n\nA：原文 in publicly traded companies 交代现象发生在哪里，现象本身是 the desire for quick profits，接着借孩子马上吃东西的动作描述它。\n\nB：原文的 the desire for quick profits 发生在上市公司，孩子“马上吃”的比喻用来描述这种急着取得眼前利润的行为。\n\nC：原文的 the desire for quick profits 说明公司想尽快拿到利润，随后把这个想法比作现在吃还是留到最后吃，比较的是愿不愿意等待。\n\nD：原文先用 the desire for quick profits 解释短期主义，再把这种金融现象比成孩子马上吃掉东西、不留到最后。","context":{"mode":"image","asset":"questions","focus":[250,753,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"question":"22","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>22. D. “short-termism” in economic activities\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文 in publicly traded companies 交代现象发生在哪里，现象本身是 the desire for quick profits，接着借孩子马上吃东西的动作描述它。\u003c/p>\n\u003cp>B：原文的 the desire for quick profits 发生在上市公司，孩子“马上吃”的比喻用来描述这种急着取得眼前利润的行为。\u003c/p>\n\u003cp>C：原文的 the desire for quick profits 说明公司想尽快拿到利润，随后把这个想法比作现在吃还是留到最后吃，比较的是愿不愿意等待。\u003c/p>\n\u003cp>D：原文先用 the desire for quick profits 解释短期主义，再把这种金融现象比成孩子马上吃掉东西、不留到最后。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"23题 · 题干、题型与核心出处","level":2,"raw":"## 23题\n\n> It is argued that the influence of transient investment on public companies can be ______.  \n> 文章说，短期投资对上市公司的影响可能是什么样的？\n\n### 题型\n\n影响推断题。题干要求判断“文章说，短期投资对上市公司的影响可能是什么样的？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades. Transient investors, who demand high quarterly profits from companies, can hinder a firm's efforts to invest in long-term research or to build up customer loyalty. This has been dubbed \"quarterly capitalism.\"\n\n持股时间从七年缩到七个月，短期投资者要求高季度利润，会妨碍长期研究投入和顾客忠诚度建设。","context":{"mode":"image","asset":"questions","focus":[250,1262,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"question":"23","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>It is argued that the influence of transient investment on public companies can be ______.\u003cbr>文章说，短期投资对上市公司的影响可能是什么样的？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>影响推断题。题干要求判断“文章说，短期投资对上市公司的影响可能是什么样的？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades. Transient investors, who demand high quarterly profits from companies, can hinder a firm&#39;s efforts to invest in long-term research or to build up customer loyalty. This has been dubbed &quot;quarterly capitalism.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>持股时间从七年缩到七个月，短期投资者要求高季度利润，会妨碍长期研究投入和顾客忠诚度建设。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. minimal","level":3,"raw":"### A. minimal\n\n> 微乎其微的\n\n**做题模式中的状态：** 第一轮A保留。当时的定位线索是：A的 minimal 判断影响有多大，而原文的 hinder a firm’s efforts 写投资者会影响公司的努力；两边都在谈对公司的影响，所以回看 Transient investors 开始的句子，看看阻碍的程度有没有讲清。读完全文后，做题模式再经交叉验证排除A，最终选择C。\n\n**错误类型：第三类——无中生有。**\n\nminimal的完整意思是影响小到几乎可以忽略。原文没有衡量影响大小，而是说短期投资者要求高季度利润，这种压力can hinder长期研究和顾客忠诚度方面的努力。\n\nhinder提供的是不利方向，不能单凭它推断影响一定巨大；但缺少巨大损害的证明，同样不能变成影响极小的证明。A增加了原文没有给出的程度，C的adverse只概括已经写出的阻碍关系。\n\n**命题人借用的原文材料：**\n\n> Transient investors, who demand high quarterly profits from companies, can hinder a firm's efforts to invest in long-term research or to build up customer loyalty.","context":{"mode":"image","asset":"questions","focus":[250,1332,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"23","option":"A"},"focusId":"focus-q23-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q2 \n\u003cp>Transient investors, who demand high quarterly profits from companies, can hinder a firm&#39;s efforts to invest in long-term research or to build up customer loyalty.\u003c/p>\n\u003cp>持股时间从七年缩到七个月，短期投资者要求高季度利润，会妨碍长期研究投入和顾客忠诚度建设。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：持股变短，季度逐利会阻碍公司长期投入。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Transient investment has only a negligible effect on companies’ long-term plans.\u003c/p>\n\u003cp>短期投资对公司的长期计划影响微乎其微。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要一项轻微程度的说明，或者长期投入基本不受影响的证据。实际hinder只给出阻碍方向，没有量化程度；不能因没有写严重就填入minimal。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. minimal","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Patience as a Corporate Virtue  \n> 耐心是一种企业美德\n\n把这个主旨直接代入23题题干：\n\n> 主旨要求重视长期价值，题干应回答短期逐利对长期投入的影响方向；主旨不能替代局部原文判断影响究竟多大、是否间接或持续多久。\n\nA实际说的是：\n\n> minimal  \n> 微乎其微的\n\nhinder提供的是不利方向，不能单凭它推断影响一定巨大；但缺少巨大损害的证明，同样不能变成影响极小的证明。A增加了原文没有给出的程度，C的adverse只概括已经写出的阻碍关系。\n\n从全文推进看，这一处的作用是：持股变短，季度逐利会阻碍公司长期投入\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,1332,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"23","option":"A"},"focusId":"focus-q23-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-A-0\">\u003cblockquote>\n\u003cp>微乎其微的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 minimal 判断影响有多大，而原文的 hinder a firm’s efforts 写投资者会影响公司的努力；两边都在谈对公司的影响，所以回看 Transient investors 开始的句子，看看阻碍的程度有没有讲清。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>minimal的完整意思是影响小到几乎可以忽略。原文没有衡量影响大小，而是说短期投资者要求高季度利润，这种压力can hinder长期研究和顾客忠诚度方面的努力。\u003c/p>\n\u003cp>hinder提供的 略。\u003c/p>\n\u003cp>B：原文先写投资者 demand high quarterly profits，要求对象就是 companies；接着仍以这些投资者作主语，直接说他们 can hinder a firm’s efforts。\u003c/p>\n\u003cp>C：harm保留hinder所表达的不利方向，两个长期对象也与原文对应。\u003c/p>\n\u003cp>D：原文先把七年和七个月接在 holding a stock 后面，随后 Transient investors 里的短期也修饰 investors，说明投资者持股的时间短。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"24题 · 题干、题型与核心出处","level":2,"raw":"## 24题\n\n> The US and France examples are used to illustrate ______.  \n> 美国和法国的例子，是用来说明什么的？\n\n### 题型\n\n例子作用题。题干要求判断“美国和法国的例子，是用来说明什么的？”，先按第5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to defer performance bonuses for senior executives by about a year, slightly helping reduce \"short-termism.\" In its latest survey of CEO pay, The Wall Street Journal finds that \"a substantial part\" of executive pay is now tied to performance.\n>\n> Much more could be done to encourage \"long-termism,\" such as changes in the tax code and quicker disclosure of stock acquisitions. In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\n\n美国把高管绩效奖金延后，法国给持股至少两年的股东更多表决权，两处都把激励与更长的时间联系起来。","context":{"mode":"image","asset":"questions","focus":[250,1857,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"question":"24","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The US and France examples are used to illustrate ______.\u003cbr>美国和法国的例子，是用来说明什么的？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>例子作用题。题干要求判断“美国和法国的例子，是用来说明什么的？”，先按第5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to defer performance bonuses for senior executives by about a year, slightly helping reduce &quot;short-termism.&quot; In its latest survey of CEO pay, The Wall Street Journal finds that &quot;a substantial part&quot; of executive pay is now tied to performance.\u003c/p>\n\u003cp>Much more could be done to encourage &quot;long-termism,&quot; such as changes in the tax code and quicker disclosure of stock acquisitions. In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\u003c/p>\n\u003c/blockquote>\n\u003cp>美国把高管绩效奖金延后，法国给持股至少两年的股东更多表决权，两处都把激励与更长的时间联系起来。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. the approaches to promoting “long-termism”","level":3,"raw":"### A. the approaches to promoting “long-termism”\n\n> 促进长期主义的途径\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“the [xxx] to promoting “long-termism””，保留了相应遮挡。当时的定位线索是：A的 promoting “long-termism” 与原文 encourage “long-termism” 都说促进长期主义，因此先回看第6段的开头和法国做法，再接回第5段 helping reduce “short-termism”，看美国例子是否也朝同一个方向。\n\n**选项类型：正确概括例子作用。**\n\napproaches在这里指实现目标的途径。美国的defer performance bonuses让奖励兑现向后延，法国的more voting rights奖励至少持有投资两年的股东，都是把具体激励与更长时间绑定。\n\n第6段以Much more could be done to encourage long-termism引出补充做法，因此两国例子都在回答怎样促进长期行为。A既概括了两种不同工具，又保留promoting long-termism这一共同用途。\n\n**出处：**\n\n> In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to defer performance bonuses for senior executives by about a year, slightly helping reduce \"short-termism.\" In its latest survey of CEO pay, The Wall Street Journal finds that \"a substantial part\" of executive pay is now tied to performance.\n>\n> Much more could be done to encourage \"long-termism,\" such as changes in the tax code and quicker disclosure of stock acquisitions.\n>\n> In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.","context":{"mode":"image","asset":"questions","focus":[250,1951,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":0,"kind": rate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>企业耐心需要制度激励，两个国家的例子应回答可以通过哪些办法鼓励长期行为，而不仅重述短期主义存在或长期思维值得重视。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the approaches to promoting “long-termism”\u003cbr>促进长期主义的途径\u003c/p>\n\u003c/blockquote>\n\u003cp>第6段以Much more could be done to encourage long-termism引出补充做法，因此两国例子都在回答怎样促进长期行为。A既概括了两种不同工具，又保留promoting long-termism这一共同用途。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍美国通过高管奖金减少短期主义的尝试提出更多鼓励长期的做法，再举法国奖励\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. the prevalence of short-term thinking","level":3,"raw":"### B. the prevalence of short-term thinking\n\n> 短期思维的普遍存在\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B的 prevalence of short-term thinking 要看短期思维有多普遍，原文的 helping reduce “short-termism” 也提到短期主义，但它在说减少；所以回看美国法案的结果，再把法国奖励较长持有的句子放在一起。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n原文的 helping reduce “short-termism” 写美国采取措施以后减少了一些短期主义，法国则把更多投票权交给至少持有两年的股东，写的是怎样使人愿意持有更久。B的 prevalence of short-term thinking 要求这两个例子呈现短期思维普遍存在，比如人们普遍急着取利。这里美国和法国共同呈现的是朝相反方向调整行为的安排，不能把两国都在采取减少它的做法，直接读成两国的例子是在展示它如何普遍流行。\n\n采取措施的国家有两个，不等于这两段在统计短期思维的普及；句子给出的动作和结果都在把行为往长期引导。\n\n**命题人借用的原文材料：**\n\n> In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.","context":{"mode":"image","asset":"questions","focus":[250,2036,1800,85],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"24","option":"B"},"focusId":"focus-q24-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-B-0\">\u003cblockquote>\n\u003cp>短期思维的普遍存在\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除  investment for at least two years can sometimes earn more voting rights in a company.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>美国和法国的例子共同说明防止短期主义的障碍。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 obstacles to preventing “short-termism” 在问阻止短期主义遇到什么障碍，原文的 slightly helping reduce 写美国措施已经帮助减少它，方向相反；所以回看这个结果，再读法国股东取得更多投票权的做法。\u003c/p>\n\u003cp>原文的 slightly helping reduce 承认美国措施的帮助不大，但 helping reduce 仍是发挥了减少短期主义的作用。法国例子也写较长持有换来更多权利，是一种鼓励，不是使长期行为做不成的阻碍。D的 obstacles to preventing “short-termism” 却要让这两个例子展示阻止短期主义时卡在哪里。slightly 只能把帮助的程度说小，不能把帮助反转成障碍；法国的奖励也不能读成妨碍长期持有。\u003c/p>\n\u003cp>帮助小仍是帮助，奖励也在鼓励长期行为，D把这两个例子的作用方向反了过来。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In France, shareholders who hold onto a company investment for at least two years can sometimes earn more voting rights in a company.\u003c/p>\n\u003cp>美国把高管绩效奖金延后，法国给持股至少两年的股东更多表决权，两处都把激励与更长的时间联系起来。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：介绍美国通过高管奖金减少短期主义的尝试。提出更多鼓励长期的做法，再举法国奖励。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The US and French cases reveal barriers that prevent efforts to reduce short-termism.\u003c/p>\n\u003cp>美国和法国的例子揭示了阻止减少短期主义的障碍。\u003c/p>\n\u003c/blockquote>\n\u003cp>障碍路线要求例子呈现改革受到什么阻挠。实际一个是已略有帮助的法案，另一个是可继续实施的奖励；把它们当障碍，改反了例子的作用方向。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Patience as a Corporate Virtue\u003cbr>耐心是一种企业美德\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>企业耐心需要制度激励，两个国家的例子应回答可以通过哪些办法鼓励长期行为，而不仅重述短期主义存在或长期思维值得重视。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the obstacles to preventing “short-termism”\u003cbr>防止短期主义的障碍\u003c/p>\n\u003c/blockquote>\n\u003cp>帮助小仍是帮助，奖励也在鼓励长期行为，D把这两个例子的作用方向反了过来。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍美国通过高管奖金减少短期主义的尝试提出更多鼓励长期的做法，再举法国奖励\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"24题结论","level":2,"raw":"### 24题结论\n\n> **24. A. the approaches to promoting “long-termism”**\n\nA：approaches在这里指实现目标的途径。\n\nB：原文的 helping reduce “short-termism” 写美国采取措施以后减少了一些短期主义，法国则把更多投票权交给至少持有两年的股东，写的是怎样使人愿意持有更久。\n\nC：significance指重要性。\n\nD：原文的 slightly helping reduce 承认美国措施的帮助不大，但 helping reduce 仍是发挥了减少短期主义的作用。","context":{"mode":"image","asset":"questions","focus":[250,1857,1800,470],"sourceW":2255,"sourceH":3141,"label":"2019英语一Text 1题目"},"meta":{"question":"24","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>24. A. the approaches to promoting “long-termism”\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：approaches在这里指实现目标的途径。\u003c/p>\n\u003cp>B：原文的 helping reduce “short-termism” 写美国采取措施以后减少了一些短期主义，法国则把更多投票权交给至少持有两年的股东，写的是怎样使人愿意持有更久。\u003c/p>\n\u003cp>C：significance指重要性。\u003c/p>\n\u003cp>D：原文的 slightly helping reduce 承认美国措施的帮助不大，但 helping reduce 仍是发挥了减少短期主义的作用。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：英国金融监管新规的内容与目的**（段落1核心介绍） 新规内容：（高管奖金可延迟10年发放，如果银行涉嫌不当行为）→ 直接目的：【让银行家对冒险行为负责 + 恢复公众信任】→ 更大目标：促进所有公司的长期决策，建立更强大的经济\n\n↓（问题分析）\n\n**逻辑层次2：短期主义问题的严重性**（段落2-3问题阐述） 短期主义恶化：（霍尔丹引用马歇尔比喻：像孩子急于吃掉布丁中的李子）→ 具体表现：【持股时间从7年降至7个月 → 短期投资者要求高季度利润 → 阻碍长期研究和客户忠诚度建设】→ 被称为\"季度资本主义\"\n\n→（加剧因素）\n\n**逻辑层次3：技术发展加剧短期主义**（段落4技术影响） 数字技术的影响：（更快速的股票交易 + 更快的信息使用 → 更短的注意力跨度）→ SEC专员观点：短期思维占主导，以长期投资为代价\n\n↓（应对措施）\n\n**逻辑层次4：各国促进长期主义的措施**（段落5-6解决方案） 美国措施：萨班斯-奥克斯利法案（推迟奖金约一年）→ 效果：略微减少短期主义 + 更多待做：【税法改变 + 更快披露股票收购】→ 法国经验：持股两年以上可获更多投票权\n\n↓（深层意义）\n\n**逻辑层次5：薪酬设计与社会责任**（段落7总结升华） 公司内部：正确的薪酬设计激励高管为所有利益相关者考虑 → 英国新规的意义：提醒银行家社会关注其长期表现，而非仅仅短期\n\n↑（全文主旨）\n\n全文核心观点：通过金融监管新规（如英国的奖金延迟规则）和其他制度设计，可以抑制有害的短期主义，促进长期思维，从而为未来建立更强大、更可持续的经济体系。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：英国金融监管新规的内容与目的\u003c/strong>（段落1核心介绍） 新规内容：（高管奖金可延迟10年发放，如果银行涉嫌不当行为）→ 直接目的：【让银行家对冒险行为负责 + 恢复公众信任】→ 更大目标：促进所有公司的长期决策，建立更强大的经济\u003c/p>\n\u003cp>↓（问题分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：短期主义问题的严重性\u003c/strong>（段落2-3问题阐述） 短期主义恶化：（霍尔丹引用马歇尔比喻：像孩子急于吃掉布丁中的李子）→ 具体表现：【持股时间从7年降至7个月 → 短期投资者要求高季度利润 → 阻碍长期研究和客户忠诚度建设】→ 被称为&quot;季度资本主义&quot;\u003c/p>\n\u003cp>→（加剧因素）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：技术发展加剧短期主义\u003c/strong>（段落4技术影响） 数字技术的影响：（更快速的股票交易 + 更快的信息使用 → 更短的注意力跨度）→ SEC专员观点：短期思维占主导，以长期投资为代价\u003c/p>\n\u003cp>↓（应对措施）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：各国促进长期主义的措施\u003c/strong>（段落5-6解决方案） 美国措施：萨班斯-奥克斯利法案（推迟奖金约一年）→ 效果：略微减少短期主义 + 更多待做：【税法改变 + 更快披露股票收购】→ 法国经验：持股两年以上可获更多投票权\u003c/p>\n\u003cp>↓（深层意义）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：薪酬设计与社会责任\u003c/strong>（段落7总结升华） 公司内部：正确的薪酬设计激励高管为所有利益相关者考虑 → 英国新规的意义：提醒银行家社会关注其长期表现，而非仅仅短期\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：通过金融监管新规（如英国的奖金延迟规则）和其他制度设计，可以抑制有害的短期主义，促进长期思维，从而为未来建立更强大、更可持续的经济体系。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n【答案】G. Making Rewards Answerable to Future Results\n\n> 让报酬对未来结果负责\n\n这一部分从奖金先发、损失后现的时间差出发，解释延长追回期限如何使奖励接受长期结果的检验。\n\n开头先交代奖金为什么可能奖错了人：\n\n> A large bonus can reward a decision before anyone knows whether it was wise.\n\n奖金已经发放，决策是否明智却尚未得到验证。后面的银行例子把这种时间差展开：今年报告盈利，损失可能多年后才出现。\n\n英国的办法针对的正是这个时间差：\n\n> Extending the period of possible recovery makes it harder for an executive to keep the reward while leaving the damage to others.\n\n延长追回期限后，经理不能轻易把奖金留下、把日后损失交给别人。这是在延长对结果负责的时间，而非仅仅改变发薪日期。\n\n最后两句划清制度目的：\n\n> The point is not to abolish performance pay. It is to make the final reward depend on results that survive examination over time, thereby encouraging decisions whose benefits outlast the next annual report.\n\n`not...It is...`先排除取消绩效薪酬，再提出让报酬经受长期结果检验；段落重心由“提前领奖的风险”落到“让奖励对未来负责”。\n\n这一部分的推进关系是：\n\n> 今年盈利即可拿奖金 → 以后可能出现损失 → 延长追回期限 → 最终报酬接受长期结果检验\n\n标题的`Rewards`对应`bonus`和`final reward`；`Answerable`对应奖金仍可能被追回；`Future Results`对应`results that survive examination over time`。它把问题、制度办法和目的连在一起。\n\n再看最强干扰项C：Replacing All Bonuses with Fixed Salaries。\n\n干扰标题主张用固定工资取代所有奖金，但本段明确说`not to abolish performance pay`。追回不当奖金与取消全部奖金是两种制度，原文保留了绩效激励。\n\n**41题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】G. Making Rewards Answerable to Future Results\u003c/p>\n\u003cblockquote>\n\u003cp>让报酬对未来结果负责\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分从奖金先发、损失后现的时间差出发，解释延长追回期限如何使奖励接受长期结果的检验。\u003c/p>\n\u003cp>开头先交代奖金为什么可能奖错了人：\u003c/p>\n\u003cblockquote>\n\u003cp>A large bonus can reward a decision before anyone knows whether it was wise.\u003c/p>\n\u003c/blockquote>\n\u003cp>奖金已经发放，决策是否明智却尚未得到验证。后面的银行例子把这种时间差展开：今年报告盈利，损失可能多年后才出现。\u003c/p>\n\u003cp>英国的办法针对的正是这个时间差：\u003c/p>\n\u003cblockquote>\n\u003cp>Extending the period of possible recovery makes it harder for an executive to keep the reward while leaving the damage to others.\u003c/p>\n\u003c/blockquote>\n\u003cp>延长追回期限后，经理不能轻易把奖金留下、把日后损失交给别人。这是在延长对结果负责的时间，而非仅仅改变发薪日期。\u003c/p>\n\u003cp>最后两句划清制度目的：\u003c/p>\n\u003cblockquote>\n\u003cp>The point is not to abolish performance pay. It is to make the final reward depend on results that survive examination over time, thereby encouraging decisions whose benefits outlast the next annual report.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>not...It is...\u003c/code>先排除取消绩效薪酬，再提出让报酬经受长期结果检验；段落重心由“提前领奖的风险”落到“让奖励对未来负责”。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>今年盈利即可拿奖金 → 以后可能出现损失 → 延长追回期限 → 最终报酬接受长期结果检验\u003c/p>\n\u003c/blockquote>\n\u003cp>标题的\u003ccode>Rewards\u003c/code>对应\u003ccode>bonus\u003c/code>和\u003ccode>final reward\u003c/code>；\u003ccode>Answerable\u003c/code>对应奖金仍可能被追回；\u003ccode>Future Results\u003c/code>对应\u003ccode>results that survive examination over time\u003c/code>。它把问题、制度办法和目的连在一起。\u003c/p>\n\u003cp>再看最强干扰项C：Replacing All Bonuses with Fixed Salaries。\u003c/p>\n\u003cp>干扰标题主张用固定工资取代所有奖金，但本段明确说\u003ccode>not to abolish performance pay\u003c/code>。追回不当奖金与取消全部奖金是两种制度，原文保留了绩效激励。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】F. Investors Who Leave Before Value Matures\n\n> 在价值成熟前便离开的投资者\n\n这一部分解释短期股东为什么不愿等长期项目见效，以及这种退出节奏怎样削弱经理的长期计划。\n\n段首先把急于求成的来源扩展到股东：\n\n> Shareholders can encourage it when they sell their stakes long before a business plan has had time to work.\n\n`it`承接急躁。股东在经营计划生效前就卖出持股，经理因而难以获得支持长期项目的稳定所有者。\n\n新产品例子说明股东为什么宁要眼前现金：\n\n> The product could eventually create more value, but that value will arrive after the investor has left.\n\n项目并非没有价值，而是收益兑现时这个投资者已经离场；投资者的持有期和企业创造价值所需的时间不一致。\n\n末句用未熟的果实概括这种选择：\n\n> Like children picking fruit before it ripens, such investors sacrifice a larger later gain for something they can collect now.\n\n提前摘果对应提前退出或取走收益，果实成熟后的更大收获对应长期项目回报。这个比喻解释的是放弃未来价值，并非赞成迅速变现。\n\n这一部分的推进关系是：\n\n> 股东过早卖出持股 → 长期项目收益在离场后才兑现 → 经理缺少长期支持 → 为眼前小利牺牲以后更大收益\n\n`Investors`对应本段反复出现的股东；`Leave Before`对应`after the investor has left`这一时间错位；`Value Matures`由新产品未来增值和果实成熟的比喻共同解释。\n\n再看最强干扰项E：Giving Patient Ownership a Practical Advantage。\n\n本段解释耐心持有为何不足，没有提出给予长期股东什么权利或待遇。`Giving...a Practical Advantage`要求出现激励办法，而这里的现金分配和摘果比喻都在说明急于退出的后果。\n\n**42题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】F. Investors Who Leave Before Value Matures\u003c/p>\n\u003cblockquote>\n\u003cp>在价值成熟前便离开的投资者\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释短期股东为什么不愿等长期项目见效，以及这种退出节奏怎样削弱经理的长期计划。\u003c/p>\n\u003cp>段首先把急于求成的来源扩展到股东：\u003c/p>\n\u003cblockquote>\n\u003cp>Shareholders can encourage it when they sell their stakes long before a business plan has had time to work.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>it\u003c/code>承接急躁。股东在经营计划生效前就卖出持股，经理因而难以获得支持长期项目的稳定所有者。\u003c/p>\n\u003cp>新产品例子说明股东为什么宁要眼前现金：\u003c/p>\n\u003cblockquote>\n\u003cp>The product could eventually create more value, but that value will arrive after the investor has left.\u003c/p>\n\u003c/blockquote>\n\u003cp>项目并非没有价值，而是收益兑现时这个投资者已经离场；投资者的持有期和企业创造价值所需的时间不一致。\u003c/p>\n\u003cp>末句用未熟的果实概括这种选择：\u003c/p>\n\u003cblockquote>\n\u003cp>Like children picking fruit before it ripens, such investors sacrifice a larger later gain for something they can collect now.\u003c/p>\n\u003c/blockquote>\n\u003cp>提前摘果对应提前退出或取走收益，果实成熟后的更大收获对应长期项目回报。这个比喻解释的是放弃未来价值，并非赞成迅速变现。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>股东过早卖出持股 → 长期项目收益在离场后才兑现 → 经理缺少长期支持 → 为眼前小利牺牲以后更大收益\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Investors\u003c/code>对应本段反复出现的股东；\u003ccode>Leave Before\u003c/code>对应\u003ccode>after the investor has left\u003c/code>这一时间错位；\u003ccode>Value Matures\u003c/code>由新产品未来增值和果实成熟的比喻共同解释。\u003c/p>\n\u003cp>再看最强干扰项E：Giving Patient Ownership a Practical Advantage。\u003c/p>\n\u003cp>本段解释耐心持有为何不足，没有提出给予长期股东什么权利或待遇。\u003ccode>Giving...a Practical Advantage\u003c/code>要求出现激励办法，而这里的现金分配和摘果比喻都在说明急于退出的后果。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n【答案】A. When Faster Trading Shortens Attention\n\n> 交易加速如何缩短关注周期\n\n这一部分比较股票交易和企业能力形成的不同速度，说明数字交易为何可能加重短期注意力压力。\n\n技术先改变的是交易条件：\n\n> A shareholder can receive market news and sell a holding almost immediately, without the delays that once made frequent trading inconvenient.\n\n消息到达和卖出股票几乎可以同时发生，过去阻碍频繁交易的延迟消失了。这解释为何短期获利愿望更容易转成行动。\n\n随后用`but`划出另一种时间尺度：\n\n> This speed is useful for carrying out a transaction, but it does not shorten the time needed to develop a medicine, train employees or earn a customer’s trust.\n\n交易能够加速，不代表研发、培训和客户信任也能同样加速。三个例子共同说明企业价值仍需要慢过程。\n\n风险在两种速度被混淆时出现：\n\n> When each fresh price movement demands attention, those slower activities become harder to defend.\n\n注意力被每次价格变化占据，长期活动更难获得支持；因此本段讨论交易加速怎样挤压长期关注，而非单纯介绍新技术的便利。\n\n这一部分的推进关系是：\n\n> 消息和交易加速 → 企业能力形成仍然缓慢 → 注意力跟着短期价格走 → 长期投入更难获得支持\n\n`Faster Trading`对应即时接收消息并卖出；`Shortens Attention`对应`each fresh price movement demands attention`以及慢活动更难被支持。标题概括了技术便利带来的管理后果。\n\n再看最强干扰项B：Improving the Speed of Financial Reporting。\n\n`Faster information`确实出现，但末句说它不能消除两种时间尺度的差别。段落没有建议加快财报发布；把传播速度当成目标，恰好漏掉了作者对过快注意力转换的担忧。\n\n**43题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】A. When Faster Trading Shortens Attention\u003c/p>\n\u003cblockquote>\n\u003cp>交易加速如何缩短关注周期\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分比较股票交易和企业能力形成的不同速度，说明数字交易为何可能加重短期注意力压力。\u003c/p>\n\u003cp>技术先改变的是交易条件：\u003c/p>\n\u003cblockquote>\n\u003cp>A shareholder can receive market news and sell a holding almost immediately, without the delays that once made frequent trading inconvenient.\u003c/p>\n\u003c/blockquote>\n\u003cp>消息到达和卖出股票几乎可以同时发生，过去阻碍频繁交易的延迟消失了。这解释为何短期获利愿望更容易转成行动。\u003c/p>\n\u003cp>随后用\u003ccode>but\u003c/code>划出另一种时间尺度：\u003c/p>\n\u003cblockquote>\n\u003cp>This speed is useful for carrying out a transaction, but it does not shorten the time needed to develop a medicine, train employees or earn a customer’s trust.\u003c/p>\n\u003c/blockquote>\n\u003cp>交易能够加速，不代表研发、培训和客户信任也能同样加速。三个例子共同说明企业价值仍需要慢过程。\u003c/p>\n\u003cp>风险在两种速度被混淆时出现：\u003c/p>\n\u003cblockquote>\n\u003cp>When each fresh price movement demands attention, those slower activities become harder to defend.\u003c/p>\n\u003c/blockquote>\n\u003cp>注意力被每次价格变化占据，长期活动更难获得支持；因此本段讨论交易加速怎样挤压长期关注，而非单纯介绍新技术的便利。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>消息和交易加速 → 企业能力形成仍然缓慢 → 注意力跟着短期价格走 → 长期投入更难获得支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Faster Trading\u003c/code>对应即时接收消息并卖出；\u003ccode>Shortens Attention\u003c/code>对应\u003ccode>each fresh price movement demands attention\u003c/code>以及慢活动更难被支持。标题概括了技术便利带来的管理后果。\u003c/p>\n\u003cp>再看最强干扰项B：Improving the Speed of Financial Reporting。\u003c/p>\n\u003cp>\u003ccode>Faster information\u003c/code>确实出现，但末句说它不能消除两种时间尺度的差别。段落没有建议加快财报发布；把传播速度当成目标，恰好漏掉了作者对过快注意力转换的担忧。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】E. Giving Patient Ownership a Practical Advantage\n\n> 让耐心持有获得实际优势\n\n这一部分提出用额外投票权奖励长期持股，把耐心从一种愿望转化为具有实际优势的选择。\n\n首句从分析急躁转向制度激励：\n\n> If impatience is encouraged by the rules, patience needs support from the rules as well.\n\n前面解释规则怎样助长短期行为，这里提出反向改造规则，使愿意等待的人获得支持。\n\n具体办法不是口头劝股东耐心，而是给权利：\n\n> Giving additional voting rights to shareholders who keep their shares for a substantial period offers them something that rapid trading does not.\n\n持有足够久才得到额外投票权；频繁买卖者得不到同一优势。因此长期持有与公司决策话语权发生了制度性联系。\n\n结尾说明作用，也保留限度：\n\n> Such an arrangement cannot guarantee good judgement. It can, however, reduce the disadvantage faced by investors willing to wait and give managers a more stable audience for long-term plans.\n\n额外权利并不保证判断正确，但能改善耐心投资者的处境，让经理有更稳定的长期计划支持者。论证落点是“使耐心更有利”，不是保证投资成功。\n\n这一部分的推进关系是：\n\n> 规则也应支持耐心 → 持有时间换取额外投票权 → 长期股东获得更强话语权 → 长期计划有更稳定的支持\n\n`Patient Ownership`对应长期持股；`Giving...a Practical Advantage`对应额外投票权及`a stronger voice`。标题既覆盖制度动作，也指出直接受益的是耐心所有者。\n\n再看最强干扰项G：Making Rewards Answerable to Future Results。\n\n开头虽然提到延期奖金，但马上用`but ownership itself can also...`转到持股制度。后面解释的额外投票权属于股东，而非经理报酬；用奖金标题会把引入语当成主体。\n\n**44题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】E. Giving Patient Ownership a Practical Advantage\u003c/p>\n\u003cblockquote>\n\u003cp>让耐心持有获得实际优势\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分提出用额外投票权奖励长期持股，把耐心从一种愿望转化为具有实际优势的选择。\u003c/p>\n\u003cp>首句从分析急躁转向制度激励：\u003c/p>\n\u003cblockquote>\n\u003cp>If impatience is encouraged by the rules, patience needs support from the rules as well.\u003c/p>\n\u003c/blockquote>\n\u003cp>前面解释规则怎样助长短期行为，这里提出反向改造规则，使愿意等待的人获得支持。\u003c/p>\n\u003cp>具体办法不是口头劝股东耐心，而是给权利：\u003c/p>\n\u003cblockquote>\n\u003cp>Giving additional voting rights to shareholders who keep their shares for a substantial period offers them something that rapid trading does not.\u003c/p>\n\u003c/blockquote>\n\u003cp>持有足够久才得到额外投票权；频繁买卖者得不到同一优势。因此长期持有与公司决策话语权发生了制度性联系。\u003c/p>\n\u003cp>结尾说明作用，也保留限度：\u003c/p>\n\u003cblockquote>\n\u003cp>Such an arrangement cannot guarantee good judgement. It can, however, reduce the disadvantage faced by investors willing to wait and give managers a more stable audience for long-term plans.\u003c/p>\n\u003c/blockquote>\n\u003cp>额外权利并不保证判断正确，但能改善耐心投资者的处境，让经理有更稳定的长期计划支持者。论证落点是“使耐心更有利”，不是保证投资成功。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>规则也应支持耐心 → 持有时间换取额外投票权 → 长期股东获得更强话语权 → 长期计划有更稳定的支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Patient Ownership\u003c/code>对应长期持股；\u003ccode>Giving...a Practical Advantage\u003c/code>对应额外投票权及\u003ccode>a stronger voice\u003c/code>。标题既覆盖制度动作，也指出直接受益的是耐心所有者。\u003c/p>\n\u003cp>再看最强干扰项G：Making Rewards Answerable to Future Results。\u003c/p>\n\u003cp>开头虽然提到延期奖金，但马上用\u003ccode>but ownership itself can also...\u003c/code>转到持股制度。后面解释的额外投票权属于股东，而非经理报酬；用奖金标题会把引入语当成主体。\u003c/p>\n\u003cp>\u003cstrong>44题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】D. Extending Responsibility Beyond a Manager’s Tenure\n\n> 把责任延伸至经理任期之后\n\n这一部分把责任期限延伸至经理离任以后，因为员工、客户和社区仍将承受决策后果。\n\n第一句直接提出检验改革的标准：\n\n> The final test of these changes is whether responsibility lasts beyond the departure of the person making the decision.\n\n经理离任不应成为责任结束的时点。后面列举产品、债务、培训，说明决策后果常常在任期之后才显现。\n\n作者接着比较谁能离开、谁仍要承受：\n\n> Customers, workers and communities cannot necessarily leave so easily; they continue to live with the consequences.\n\n客户、员工和社区未必能随经理一起退出，因而需要把他们持续承担的后果纳入评价。这里将时间问题与受影响人群联系起来。\n\n`therefore`把以上理由落实到薪酬周期：\n\n> Pay arrangements should therefore consider performance over a period longer than the executive’s own tenure.\n\n报酬评价应超过经理本人任期，才可能覆盖这些延后后果。末句进一步把公司看成有未来的机构，而非下一季度的股价。\n\n这一部分的推进关系是：\n\n> 决策后果晚于经理离任 → 其他相关者继续承受 → 薪酬评价超过任期 → 管理责任面向企业和社会的长远未来\n\n`Responsibility`对应持续承担决策后果；`Beyond a Manager’s Tenure`直接对应`longer than the executive’s own tenure`，也覆盖本段经理能够离开、员工社区仍然留下的对照。\n\n再看最强干扰项G：Making Rewards Answerable to Future Results。\n\n奖励对未来结果负责与本段有关，但该标题没有抓住本段新增的界限：责任应越过经理离任时点，并考虑留下的员工和社区。前文追回奖金的制度，在这里被提升为任期以外的责任原则。\n\n**45题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】D. Extending Responsibility Beyond a Manager’s Tenure\u003c/p>\n\u003cblockquote>\n\u003cp>把责任延伸至经理任期之后\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把责任期限延伸至经理离任以后，因为员工、客户和社区仍将承受决策后果。\u003c/p>\n\u003cp>第一句直接提出检验改革的标准：\u003c/p>\n\u003cblockquote>\n\u003cp>The final test of these changes is whether responsibility lasts beyond the departure of the person making the decision.\u003c/p>\n\u003c/blockquote>\n\u003cp>经理离任不应成为责任结束的时点。后面列举产品、债务、培训，说明决策后果常常在任期之后才显现。\u003c/p>\n\u003cp>作者接着比较谁能离开、谁仍要承受：\u003c/p>\n\u003cblockquote>\n\u003cp>Customers, workers and communities cannot necessarily leave so easily; they continue to live with the consequences.\u003c/p>\n\u003c/blockquote>\n\u003cp>客户、员工和社区未必能随经理一起退出，因而需要把他们持续承担的后果纳入评价。这里将时间问题与受影响人群联系起来。\u003c/p>\n\u003cp>\u003ccode>therefore\u003c/code>把以上理由落实到薪酬周期：\u003c/p>\n\u003cblockquote>\n\u003cp>Pay arrangements should therefore consider performance over a period longer than the executive’s own tenure.\u003c/p>\n\u003c/blockquote>\n\u003cp>报酬评价应超过经理本人任期，才可能覆盖这些延后后果。末句进一步把公司看成有未来的机构，而非下一季度的股价。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>决策后果晚于经理离任 → 其他相关者继续承受 → 薪酬评价超过任期 → 管理责任面向企业和社会的长远未来\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>Responsibility\u003c/code>对应持续承担决策后果；\u003ccode>Beyond a Manager’s Tenure\u003c/code>直接对应\u003ccode>longer than the executive’s own tenure\u003c/code>，也覆盖本段经理能够离开、员工社区仍然留下的对照。\u003c/p>\n\u003cp>再看最强干扰项G：Making Rewards Answerable to Future Results。\u003c/p>\n\u003cp>奖励对未来结果负责与本段有关，但该标题没有抓住本段新增的界限：责任应越过经理离任时点，并考虑留下的员工和社区。前文追回奖金的制度，在这里被提升为任期以外的责任原则。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出奖金发放早于风险显现的问题，并询问追责期限 |\n| B | 用员工、客户和社区的持续后果解释任期后责任 |\n| C | 指出短期股东施加压力，并追问退出为何如此容易 |\n| D | 用延长奖金追回期回答期限问题，转向第二种急躁来源 |\n| E | 解释数字交易加速退出，却无法加速企业价值形成 |\n| F | 指出股东改革仍不足，要求经理评价越过任期 |\n| G | 提出长期持股换取额外投票权，改变股东激励 |\n| H | 合并奖金、股权和任期评价，收束长期责任主张 |\n\n全文推进：\n\n> 提出奖金发放早于风险显现的问题，并询问追责期限 → 用延长奖金追回期回答期限问题，转向第二种急躁来源 → 指出短期股东施加压力，并追问退出为何如此容易 → 解释数字交易加速退出，却无法加速企业价值形成 → 提出长期持股换取额外投票权，改变股东激励 → 指出股东改革仍不足，要求经理评价越过任期 → 用员工、客户和社区的持续后果解释任期后责任 → 合并奖金、股权和任期评价，收束长期责任主张\n\n完整顺序：\n\n**A → D → C → E → G → F → B → H**\n\n41—45：D、C、G、F、B。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出奖金发放早于风险显现的问题，并询问追责期限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用员工、客户和社区的持续后果解释任期后责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>指出短期股东施加压力，并追问退出为何如此容易\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>用延长奖金追回期回答期限问题，转向第二种急躁来源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>解释数字交易加速退出，却无法加速企业价值形成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>指出股东改革仍不足，要求经理评价越过任期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>提出长期持股换取额外投票权，改变股东激励\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>合并奖金、股权和任期评价，收束长期责任主张\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出奖金发放早于风险显现的问题，并询问追责期限 → 用延长奖金追回期回答期限问题，转向第二种急躁来源 → 指出短期股东施加压力，并追问退出为何如此容易 → 解释数字交易加速退出，却无法加速企业价值形成 → 提出长期持股换取额外投票权，改变股东激励 → 指出股东改革仍不足，要求经理评价越过任期 → 用员工、客户和社区的持续后果解释任期后责任 → 合并奖金、股权和任期评价，收束长期责任主张\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → C → E → G → F → B → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、C、G、F、B。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → C的关系。\n\n先看前段A的结尾：\n\n> Reforming executive pay therefore begins with a question about timing: how long should a reward remain open to reconsideration?\n\n再看候选D的开头：\n\n> One answer is to keep bonuses recoverable for longer.\n\nA以`how long should a reward remain open to reconsideration?`询问奖金在多长时间内还能重新审查。本段的`One answer`必须回答这个问题，紧跟的`keep bonuses recoverable for longer`给出答案：延长追回期；既承接疑问形式，也承接奖金这一具体对象。\n\n本段用“发放多年后才发现违规”解释延长期限为什么有用，接着以`Yet`指出边界：这项办法只管经理。`a second source of impatience`由此提出尚未解决的另一类行为者。\n\nD段最终落在：\n\n> Yet this reform concerns only the person running the company; it leaves a second source of impatience largely untouched.\n\n后段C的开头是：\n\n> That second source is the shareholder who plans to leave quickly.\n\n后段开头`That second source is the shareholder`正好为“第二种来源”命名。先说经理追责还遗漏一种来源，再揭示短期股东，指代与转题都连续。\n\n这三段的局部推进是：\n\n> 提出奖金发放早于风险显现的问题，并询问追责期限 → 用延长奖金追回期回答期限问题，转向第二种急躁来源 → 指出短期股东施加压力，并追问退出为何如此容易\n\n再检验容易混淆的候选F。它的开头是：\n\n> Changing shareholder incentives, however, cannot finish the job.\n\n另一候选也谈经理薪酬，但开头`Changing shareholder incentives, however`预设已经讨论过改变股东激励。A只提出奖金追责期限，并未谈股东改革；直接接它既无法解释`however`，也跳过了奖金追回这个具体回答。\n\n**41题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → C的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Reforming executive pay therefore begins with a question about timing: how long should a reward remain open to reconsideration?\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One answer is to keep bonuses recoverable for longer.\u003c/p>\n\u003c/blockquote>\n\u003cp>A以\u003ccode>how long should a reward remain open to reconsideration?\u003c/code>询问奖金在多长时间内还能重新审查。本段的\u003ccode>One answer\u003c/code>必须回答这个问题，紧跟的\u003ccode>keep bonuses recoverable for longer\u003c/code>给出答案：延长追回期；既承接疑问形式，也承接奖金这一具体对象。\u003c/p>\n\u003cp>本段用“发放多年后才发现违规”解释延长期限为什么有用，接着以\u003ccode>Yet\u003c/code>指出边界：这项办法只管经理。\u003ccode>a second source of impatience\u003c/code>由此提出尚未解决的另一类行为者。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet this reform concerns only the person running the company; it leaves a second source of impatience largely untouched.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That second source is the shareholder who plans to leave quickly.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段开头\u003ccode>That second source is the shareholder\u003c/code>正好为“第二种来源”命名。先说经理追责还遗漏一种来源，再揭示短期股东，指代与转题都连续。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>提出奖金发放早于风险显现的问题，并询问追责期限 → 用延长奖金追回期回答期限问题，转向第二种急躁来源 → 指出短期股东施加压力，并追问退出为何如此容易\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Changing shareholder incentives, however, cannot finish the job.\u003c/p>\n\u003c/blockquote>\n\u003cp>另一候选也谈经理薪酬，但开头\u003ccode>Changing shareholder incentives, however\u003c/code>预设已经讨论过改变股东激励。A只提出奖金追责期限，并未谈股东改革；直接接它既无法解释\u003ccode>however\u003c/code>，也跳过了奖金追回这个具体回答。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → C → E的关系。\n\n先看前段D的结尾：\n\n> Yet this reform concerns only the person running the company; it leaves a second source of impatience largely untouched.\n\n再看候选C的开头：\n\n> That second source is the shareholder who plans to leave quickly.\n\n前段最后明确留下`a second source of impatience`。本段用`That second source`回指，再以`the shareholder who plans to leave quickly`补足身份；“第二种”对应经理以外的短期股东，不能理解成另一项奖金制度。\n\n股东退出早于项目成功，因此宁要眼前现金；经理受到这些所有者的压力而追求短期可见收益。段末再把解释推进一层：这些股东为什么能够如此容易地退出？\n\nC段最终落在：\n\n> Understanding that pressure also requires asking why leaving has become so easy.\n\n后段E的开头是：\n\n> Leaving has become easier because digital markets allow news and trades to travel almost instantly.\n\n已知E开头重复`Leaving has become easier`，并用`because digital markets...`回答本段结尾`why leaving has become so easy`。这是“提出退出便利之因 → 数字市场给出原因”的问答关系。\n\n这三段的局部推进是：\n\n> 用延长奖金追回期回答期限问题，转向第二种急躁来源 → 指出短期股东施加压力，并追问退出为何如此容易 → 解释数字交易加速退出，却无法加速企业价值形成\n\n再检验容易混淆的候选G。它的开头是：\n\n> Producing more patient owners requires a reward for staying.\n\n额外投票权那段也谈股东，但它从`Producing more patient owners`进入解决办法，需要先说明快进快出为何造成问题。放在这里会使后面的E突然退回解释退出原因，也没有给`That second source`提供身份说明。\n\n**42题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → C → E的关系。\u003c/p>\n\u003cp>先看前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet this reform concerns only the person running the company; it leaves a second source of impatience largely untouched.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That second source is the shareholder who plans to leave quickly.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后明确留下\u003ccode>a second source of impatience\u003c/code>。本段用\u003ccode>That second source\u003c/code>回指，再以\u003ccode>the shareholder who plans to leave quickly\u003c/code>补足身份；“第二种”对应经理以外的短期股东，不能理解成另一项奖金制度。\u003c/p>\n\u003cp>股东退出早于项目成功，因此宁要眼前现金；经理受到这些所有者的压力而追求短期可见收益。段末再把解释推进一层：这些股东为什么能够如此容易地退出？\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Understanding that pressure also requires asking why leaving has become so easy.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Leaving has become easier because digital markets allow news and trades to travel almost instantly.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知E开头重复\u003ccode>Leaving has become easier\u003c/code>，并用\u003ccode>because digital markets...\u003c/code>回答本段结尾\u003ccode>why leaving has become so easy\u003c/code>。这是“提出退出便利之因 → 数字市场给出原因”的问答关系。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>用延长奖金追回期回答期限问题，转向第二种急躁来源 → 指出短期股东施加压力，并追问退出为何如此容易 → 解释数字交易加速退出，却无法加速企业价值形成\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Producing more patient owners requires a reward for staying.\u003c/p>\n\u003c/blockquote>\n\u003cp>额外投票权那段也谈股东，但它从\u003ccode>Producing more patient owners\u003c/code>进入解决办法，需要先说明快进快出为何造成问题。放在这里会使后面的E突然退回解释退出原因，也没有给\u003ccode>That second source\u003c/code>提供身份说明。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → F的关系。\n\n先看前段E的结尾：\n\n> Rules that merely allow faster exits cannot by themselves produce more patient owners.\n\n再看候选G的开头：\n\n> Producing more patient owners requires a reward for staying.\n\nE末句指出，让人更快退出的规则不能自动产生`more patient owners`。本段段首`Producing more patient owners requires a reward for staying`接住这一未解决目标，把“退出更容易”转为“留下也应有好处”。\n\n段中不是泛泛倡导耐心，而是明确额外投票权的交换条件：持续持股。它使长期股东影响公司决策，从而让继续持有本身有价值。末句将此办法归纳为改变股东激励。\n\nG段最终落在：\n\n> This approach changes the incentives of shareholders rather than concentrating only on managers.\n\n后段F的开头是：\n\n> Changing shareholder incentives, however, cannot finish the job.\n\n后段以`Changing shareholder incentives, however, cannot finish the job`接续末句的`changes the incentives of shareholders`。`however`承认股东办法有用，同时要求继续处理经理报酬，形成“改革一个主体 → 另一个主体也要改”的递进。\n\n这三段的局部推进是：\n\n> 解释数字交易加速退出，却无法加速企业价值形成 → 提出长期持股换取额外投票权，改变股东激励 → 指出股东改革仍不足，要求经理评价越过任期\n\n再检验容易混淆的候选F。它的开头是：\n\n> Changing shareholder incentives, however, cannot finish the job.\n\n经理任期评价段的`Changing shareholder incentives`看似可接E对所有者的讨论，但E尚未提出任何改变股东激励的办法。本段的投票权措施必须先出现，后段才能说这种改革还不够。\n\n**43题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → F的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Rules that merely allow faster exits cannot by themselves produce more patient owners.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Producing more patient owners requires a reward for staying.\u003c/p>\n\u003c/blockquote>\n\u003cp>E末句指出，让人更快退出的规则不能自动产生\u003ccode>more patient owners\u003c/code>。本段段首\u003ccode>Producing more patient owners requires a reward for staying\u003c/code>接住这一未解决目标，把“退出更容易”转为“留下也应有好处”。\u003c/p>\n\u003cp>段中不是泛泛倡导耐心，而是明确额外投票权的交换条件：持续持股。它使长期股东影响公司决策，从而让继续持有本身有价值。末句将此办法归纳为改变股东激励。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This approach changes the incentives of shareholders rather than concentrating only on managers.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Changing shareholder incentives, however, cannot finish the job.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段以\u003ccode>Changing shareholder incentives, however, cannot finish the job\u003c/code>接续末句的\u003ccode>changes the incentives of shareholders\u003c/code>。\u003ccode>however\u003c/code>承认股东办法有用，同时要求继续处理经理报酬，形成“改革一个主体 → 另一个主体也要改”的递进。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>解释数字交易加速退出，却无法加速企业价值形成 → 提出长期持股换取额外投票权，改变股东激励 → 指出股东改革仍不足，要求经理评价越过任期\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Changing shareholder incentives, however, cannot finish the job.\u003c/p>\n\u003c/blockquote>\n\u003cp>经理任期评价段的\u003ccode>Changing shareholder incentives\u003c/code>看似可接E对所有者的讨论，但E尚未提出任何改变股东激励的办法。本段的投票权措施必须先出现，后段才能说这种改革还不够。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → F → B的关系。\n\n先看前段G的结尾：\n\n> This approach changes the incentives of shareholders rather than concentrating only on managers.\n\n再看候选F的开头：\n\n> Changing shareholder incentives, however, cannot finish the job.\n\n前段已完整介绍“持股时间换投票权”，最后总结为`changes the incentives of shareholders`。本段重提`Changing shareholder incentives`并加`however`，把焦点从股东转回经理，指出这一类改革尚未覆盖另一类责任。\n\n随后给出经理评价为何要延长：任内漂亮报表可能来自以后才失败的冒险策略。`after they have moved on`与`beyond the leader’s tenure`共同确定评价时间必须晚于离任。\n\nF段最终落在：\n\n> The relevant period must extend beyond the leader’s tenure.\n\n后段B的开头是：\n\n> Beyond that tenure, other people are still living with the decision.\n\n后段开头`Beyond that tenure`中的`that tenure`只能指本段刚明确的经理任期。后段再列举谁在任期之后继续承受损失，补足延长评价期的理由。\n\n这三段的局部推进是：\n\n> 提出长期持股换取额外投票权，改变股东激励 → 指出股东改革仍不足，要求经理评价越过任期 → 用员工、客户和社区的持续后果解释任期后责任\n\n再检验容易混淆的候选D。它的开头是：\n\n> One answer is to keep bonuses recoverable for longer.\n\n奖金追回段同样关注以后发生的后果，但以`One answer`起头，回答的是A的奖金追责时限问题；它最后引出“第二种急躁来源”，不是经理任期，因而无法为后段`that tenure`建立直接先行词。\n\n**44题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → F → B的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This approach changes the incentives of shareholders rather than concentrating only on managers.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Changing shareholder incentives, however, cannot finish the job.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段已完整介绍“持股时间换投票权”，最后总结为\u003ccode>changes the incentives of shareholders\u003c/code>。本段重提\u003ccode>Changing shareholder incentives\u003c/code>并加\u003ccode>however\u003c/code>，把焦点从股东转回经理，指出这一类改革尚未覆盖另一类责任。\u003c/p>\n\u003cp>随后给出经理评价为何要延长：任内漂亮报表可能来自以后才失败的冒险策略。\u003ccode>after they have moved on\u003c/code>与\u003ccode>beyond the leader’s tenure\u003c/code>共同确定评价时间必须晚于离任。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The relevant period must extend beyond the leader’s tenure.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Beyond that tenure, other people are still living with the decision.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段开头\u003ccode>Beyond that tenure\u003c/code>中的\u003ccode>that tenure\u003c/code>只能指本段刚明确的经理任期。后段再列举谁在任期之后继续承受损失，补足延长评价期的理由。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>提出长期持股换取额外投票权，改变股东激励 → 指出股东改革仍不足，要求经理评价越过任期 → 用员工、客户和社区的持续后果解释任期后责任\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One answer is to keep bonuses recoverable for longer.\u003c/p>\n\u003c/blockquote>\n\u003cp>奖金追回段同样关注以后发生的后果，但以\u003ccode>One answer\u003c/code>起头，回答的是A的奖金追责时限问题；它最后引出“第二种急躁来源”，不是经理任期，因而无法为后段\u003ccode>that tenure\u003c/code>建立直接先行词。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → B → H的关系。\n\n先看前段F的结尾：\n\n> The relevant period must extend beyond the leader’s tenure.\n\n再看候选B的开头：\n\n> Beyond that tenure, other people are still living with the decision.\n\n前段结尾强调`beyond the leader’s tenure`，本段随即用`Beyond that tenure`把时间界限承接下来。`other people`又与刚离任的经理对照：经理走了，其他相关者还在。\n\n员工技能过时、客户产品不可靠、社区雇主衰弱，三个例子具体说明离任后的成本由谁承担。`These continuing effects`回指这三类后果，用来解释评价期为什么要加长。\n\nB段最终落在：\n\n> The company’s future cannot be reduced to the fortune of the executive who once led it.\n\n后段H的开头是：\n\n> The aim, then, is to make both ownership and leadership attentive to a future they cannot immediately cash in.\n\n已知H把结论概括为所有权与领导责任都要关注无法立即兑现的未来，并收束为不能把`tomorrow’s costs`转给别人。本段刚展示的员工、客户和社区就是这里`someone else`的具体内容，因此由后果展开自然进入总结。\n\n这三段的局部推进是：\n\n> 指出股东改革仍不足，要求经理评价越过任期 → 用员工、客户和社区的持续后果解释任期后责任 → 合并奖金、股权和任期评价，收束长期责任主张\n\n再检验容易混淆的候选G。它的开头是：\n\n> Producing more patient owners requires a reward for staying.\n\n投票权段虽然也面向长期，但讨论的是股东留下的奖励，没有说明经理离任后谁承受代价。此处若返回投票权，会遗漏`that tenure`之后的责任解释，H的“把明天成本转给别人”也缺少这组直接例证。\n\n**45题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → B → H的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The relevant period must extend beyond the leader’s tenure.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Beyond that tenure, other people are still living with the decision.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段结尾强调\u003ccode>beyond the leader’s tenure\u003c/code>，本段随即用\u003ccode>Beyond that tenure\u003c/code>把时间界限承接下来。\u003ccode>other people\u003c/code>又与刚离任的经理对照：经理走了，其他相关者还在。\u003c/p>\n\u003cp>员工技能过时、客户产品不可靠、社区雇主衰弱，三个例子具体说明离任后的成本由谁承担。\u003ccode>These continuing effects\u003c/code>回指这三类后果，用来解释评价期为什么要加长。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The company’s future cannot be reduced to the fortune of the executive who once led it.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The aim, then, is to make both ownership and leadership attentive to a future they cannot immediately cash in.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知H把结论概括为所有权与领导责任都要关注无法立即兑现的未来，并收束为不能把\u003ccode>tomorrow’s costs\u003c/code>转给别人。本段刚展示的员工、客户和社区就是这里\u003ccode>someone else\u003c/code>的具体内容，因此由后果展开自然进入总结。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>指出股东改革仍不足，要求经理评价越过任期 → 用员工、客户和社区的持续后果解释任期后责任 → 合并奖金、股权和任期评价，收束长期责任主张\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Producing more patient owners requires a reward for staying.\u003c/p>\n\u003c/blockquote>\n\u003cp>投票权段虽然也面向长期，但讨论的是股东留下的奖励，没有说明经理离任后谁承受代价。此处若返回投票权，会遗漏\u003ccode>that tenure\u003c/code>之后的责任解释，H的“把明天成本转给别人”也缺少这组直接例证。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **patience** | **耐心** | **人生哲理类：坚持** | **个人主题** |\n| long-term thinking | 长远思考 | 人生哲理类：延迟满足、具有远见 | 个人主题 |\n| corporate responsibility | 企业责任 | 人生哲理类：责任感、奉献精神 | 宏观主题 |\n| **public trust** | **公众信任** | **人生哲理类：理解、信任、宽容** | **宏观主题** |\n| sustainable investment | 可持续投资 | 经济消费类：经济收入 | 宏观主题 |\n| customer loyalty | 顾客忠诚度 | 经济消费类：企业经营 | 宏观主题 |\n| **responsible decision-making** | **负责任的决策** | **人生哲理类：责任感、奉献精神** | **个人主题** |\n| effective incentives | 有效激励 | 经济消费类：企业经营 | 宏观主题 |\n| the welfare of future generations | 后代福祉 | 社会生活类：生活质量 | 宏观主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>patience\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>耐心\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：坚持\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>long-term thinking\u003c/td>\n\u003ctd>长远思考\u003c/td>\n\u003ctd>人生哲理类：延迟满足、具有远见\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>corporate responsibility\u003c/td>\n\ urage X.** | **这段文字讨论了一项旨在鼓励X的规定。** |\n| 文本评论题 | The passage highlights society’s interest in X, not just in the short term but in the long term. | 文章强调社会对X的关注既涉及短期，也涉及长期。 |\n| 文本评论题 | The issue concerns whether incentives can support X on behalf of Y. | 该问题涉及激励能否为Y的利益支持X。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2019英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A pursuing X rather than waiting for Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示A追求X而不是等待Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, A is putting X aside for a future purpose.\u003c/td>\n\u003ctd>图中A正在为未来的用途把X留起来。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A’s behaviour in the picture serves as a reminder of the need for X.\u003c/td>\n\u003ctd>图中A的行为提醒我们需要X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The average time spent on X has dropped from A to B.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>花在X上的平均时间已从A降到B。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures indicate a growing preference for X over Y.\u003c/td>\n\u003ctd>这些数字表明，相比Y，人们越来越偏好X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>A substantial part of X is now tied to Y.\u003c/td>\n\u003ctd>目前X中相当大的一部分与Y相关。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The text discusses a rule intended to encourage X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>这段文字讨论了一项旨在鼓励X的规定。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage highlights society’s interest in X, not just in the short term but in the long term.\u003c/td>\n\u003ctd>文章强调社会对X的关注既涉及短期，也涉及长期。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue concerns whether incentives can support X on behalf of Y.\u003c/td>\n\u003ctd>该问题涉及激励能否为Y的利益支持X。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. When Faster Trading Shortens Attention\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Improving the Speed of Financial Reporting\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Replacing All Bonuses with Fixed Salaries\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. Extending Responsibility Beyond a Manager’s Tenure\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Giving Patient Ownership a Practical Advantage\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Investors Who Leave Before Value Matures\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Making Rewards Answerable to Future Results\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>A large bonus can reward a decision before anyone knows whether it was wise. A bank may report a profit from a risky investment this year, while the losses emerge much later. Britain’s approach to executive pay addresses this mismatch by allowing bonuses to be recovered after misconduct is discovered. Extending the period of possible recovery makes it harder for an executive to keep the reward while leaving the damage to others. The point is not to abolish performance pay. It is to make the final reward depend on results that survive examination over time, thereby encouraging decisions whose benefits outlast the next annual report.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>Managers do not create this impatience by themselves. Shareholders can encourage it when they sell their stakes long before a business plan has had time to work. An investor seeking a quick rise in the share price may favour an immediate distribution of cash over the development of a new product. The product could eventually create more value, but that value will arrive after the investor has left. Faced with owners who keep changing, managers have less support for projects with distant returns. Like children picking fruit before it ripens, such investors sacrifice a larger later gain for something they can collect now.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>Technology has made it easier to act on that desire for quick gains. A shareholder can receive market news and sell a holding almost immediately, without the delays that once made frequent trading inconvenient. This speed is useful for carrying out a transaction, but it does not shorten the time needed to develop a medicine, train employees or earn a customer’s trust. When each fresh price movement demands attention, those slower activities become harder to defend. The danger lies in confusing the speed at which ownership can change with the speed at which a company can create lasting value. Faster information alone cannot remove that difference.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>If impatience is encouraged by the rules, patience needs support from the rules as well. Delayed bonuses are one possibility, but ownership itself can also be designed to favour commitment. Giving additional voting rights to shareholders who keep their shares for a substantial period offers them something that rapid trading does not. They gain a stronger voice in the company’s direction by staying, rather than merely hoping that a distant financial return will compensate them. Such an arrangement cannot guarantee good judgement. It can, however, reduce the disadvantage faced by investors willing to wait and give managers a more stable audience for long-term plans.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>The final test of these changes is whether responsibility lasts beyond the departure of the person making the decision. An executive may leave before a product succeeds, a debt becomes unmanageable or an employee-training programme pays off. Customers, workers and communities cannot necessarily leave so easily; they continue to live with the consequences. Pay arrangements should therefore consider performance over a period longer than the executive’s own tenure. This is not simply a way to punish failure. It encourages leaders to treat the company as an institution with a future, and to recognise people whose interests cannot be captured by the next quarter’s share price.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>A company can look successful today because the costs of a decision have not yet appeared. Managers may collect bonuses while the risks remain hidden, leaving shareholders and employees to face the eventual loss. Reforming executive pay therefore begins with a question about timing: how long should a reward remain open to reconsideration?\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Beyond that tenure, other people are still living with the decision. Employees may be left with outdated skills, customers with unreliable products and communities with a weakened local employer. These continuing effects explain why a longer assessment period matters. The company’s future cannot be reduced to the fortune of the executive who once led it.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>That second source is the shareholder who plans to leave quickly. Such an owner may demand cash now rather than support a project that will succeed after the shares have been sold. Managers then face pressure to choose visible short-term gains. Understanding that pressure also requires asking why leaving has become so easy.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>One answer is to keep bonuses recoverable for longer. If misconduct is discovered several years after payment, the executive should not automatically be beyond reach. A longer recovery period connects present rewards with later consequences. Yet this reform concerns only the person running the company; it leaves a second source of impatience largely untouched.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>Leaving has become easier because digital markets allow news and trades to travel almost instantly. But a laboratory, a skilled workforce and customer loyalty still take years to build. The resulting mismatch is between a fast-moving market and a slowly developing business. Rules that merely allow faster exits cannot by themselves produce more patient owners.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>Changing shareholder incentives, however, cannot finish the job. Managers’ pay must also be judged against results that appear after they have moved on. A leader who leaves before a risky strategy fails should not be evaluated solely on the attractive figures reported while in office. The relevant period must extend beyond the leader’s tenure.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>Producing more patient owners requires a reward for staying. Extra voting rights for people who hold shares for a sustained period are one possible device. They give committed investors more influence over company decisions, making continued ownership valuable in its own right. This approach changes the incentives of shareholders rather than concentrating only on managers.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>The aim, then, is to make both ownership and leadership attentive to a future they cannot immediately cash in. Delayed rewards, patient voting rights and longer assessments address different parts of the same problem. None guarantees success, but together they make it harder to take today’s gain while passing tomorrow’s costs to someone else.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2019英语一Text 1重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>financial regulator\u003c/td>\n\u003ctd>金融监管机构\u003c/td>\n\u003ctd>Britain\u003c/td>\n\u003ctd>n.英国\u003c/td>\n\
