O3aPlOPQUTwQDGc2HvXFGTsOvg2qeDJ05s1FIP5+2v2lqhhyfGYy1UtVX7BxHfyAf7nrpcFxQKJPTJdQXXP88gkly+5tTw4C2Hx95xK9cyCmxk0M9Cv1+5qAseVo0EOT8J1++dr48TFpOvCcvxuxVyMNZS8ZOiVOwmPTz0VDfix4/MUNBeehDs12T1o0d+51yOasd/sSjqx7NUDAcKCkXEybIw2JtNyhE6/DnHvC5hJs+C9Wv1lPaH/Tksrvd6YEK4Trw6Qlfa1Nev3J3Xdw112BH83Bd6X///b/S//7777///vvvv//++++///7777///vvvv//++++///7777///vvvv//++++///7777///vvvv//++++///7777///vvvv//++++///777///n5w=","articleSize":{"w":1804,"h":2513},"questionSize":{"w":1804,"h":2513},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>36题题干</h2>\n<p><strong>The Supreme Court decision Thursday will ______.</strong></p>\n<blockquote>\n<p>最高法院周四的决定将会带来什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>37题题干</h2>\n<p><strong>It can be learned from Paragraphs 2 and 3 that the overruled decisions ______.</strong></p>\n<blockquote>\n<p>从第2、3段可以知道，被推翻的那些决定有什么情况？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr>\n<h2>38题题干</h2>\n<p><strong>According to Justice Anthony Kennedy, the physical presence rule has ______.</strong></p>\n<blockquote>\n<p>根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>39题题干</h2>\n<p><strong>Who are most likely to welcome the Supreme Court ruling?</strong></p>\n<blockquote>\n<p>谁最有可能欢迎最高法院的这项裁决？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>40题题干</h2>\n<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<blockquote>\n<p>在处理最高法院周四这项决定时，作者采用了怎样的写法？</p>\n</blockquote>\n<p>题型：<strong>全文写作方式题</strong>。</p>\n<hr>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>but, since, because, though</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>win, difficult, victory, losers</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>pay, collect, pass, praised</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>losses, victory, losers</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>states, sales tax, decisions, sellers</td>\n</tr>\n</tbody></table>\n<p>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.</p>\n<p>The Supreme Court’s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost <strong>[xxx]</strong> annually. The decisions made it more difficult for states to collect sales tax on certain online purchases.</p>\n<p>The cases the court <strong>[xxx]</strong> said that if a business was shipping a customer’s purchase to a state where the business didn’t have a physical presence such as a <strong>[xxx]</strong> or office, the business didn’t have to collect sales tax for the state. Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.</p>\n<p>Justice Anthony Kennedy wrote that the previous decisions were <strong>[xxx]</strong>. “Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term <strong>[xxx]</strong> and has prevented market <strong>[xxx]</strong> from competing on an even playing field.”</p>\n<p>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, <strong>[xxx]</strong> will be charging sales tax where they hadn’t before. Big chains have been collecting sales tax <strong>[xxx]</strong> because they <strong>[xxx]</strong> have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of <strong>[xxx]</strong>, also collects sales tax in every state that charges it, though third-party sellers who use the site don’t have to.</p>\n<p>Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states. Sellers that use eBay and Etsy, which provide <strong>[xxx]</strong> for smaller sellers, also haven’t been collecting sales tax nationwide. Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state’s sales tax from customers and send it to the state.</p>\n<p>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses. The losers, said retail <strong>[xxx]</strong> Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches <strong>[xxx]</strong> with various state sales tax laws. The Small Business &amp; Entrepreneurship Council <strong>[xxx]</strong> group said in a statement, “Small businesses and internet entrepreneurs are not well served at all by this decision.”</p>\n<p>States will be able  / to force more people  / to pay sales tax  / when they make online purchases  / under a Supreme Court decision Thursday  / that will leave shoppers with lighter wallets  / but is a big financial win for states.</p>\n<p>The Supreme Court’s opinion Thursday  / overruled a pair of decades-old decisions  / that states said cost them billions of dollars  / in lost <strong>[xxx]</strong> annually.  / The decisions made it more difficult  / for states to collect sales tax  / on certain online purchases.</p>\n<p>The cases the court <strong>[xxx]</strong>  / said that  / if a business was shipping a customer’s purchase  / to a state  / where the business didn’t have a physical presence  / such as a <strong>[xxx]</strong> or office,  / the business didn’t have to collect sales tax for the state.  / Customers were generally responsible  / for paying the sales tax to the state themselves  / if they weren’t charged it,  / but most didn’t realize they owed it  / and few paid.</p>\n<p>Justice Anthony Kennedy wrote  / that the previous decisions were <strong>[xxx]</strong>.  / “Each year the physical presence rule  / becomes further removed from economic reality  / and results in <strong>[xxx]</strong> revenue losses to the states,”  / he wrote in an opinion  / joined by four other justices.  / Kennedy wrote that the rule  / “limited states’ ability  / to seek long-term <strong>[xxx]</strong>  / and has prevented market <strong>[xxx]</strong>  / from competing on an even playing field.”</p>\n<p>The ruling is a victory  / for big chains  / with a presence in many states,  / since they usually collect sales tax on online purchases already.  / Now, <strong>[xxx]</strong>  / will be charging sales tax  / where they hadn’t before.  / Big chains have been collecting sales tax <strong>[xxx]</strong>  / because they <strong>[xxx]</strong>  / have physical stores  / in whatever state a purchase is being shipped to.  / Amazon.com, with its network of <strong>[xxx]</strong>,  / also collects sales tax in every state that charges it,  / though third-party sellers  / who use the site don’t have to.</p>\n<p>Until now, many sellers  / that have a physical presence  / in only a single state or a few states  / have been able to avoid charging sales taxes  / when they ship to addresses outside those states.  / Sellers that use eBay and Etsy,  / which provide <strong>[xxx]</strong> for smaller sellers,  / also haven’t been collecting sales tax nationwide.  / Under the ruling Thursday,  / states can pass laws  / requiring out-of-state sellers to collect the state’s sales tax  / from customers  / and send it to the state.</p>\n<p>Retail trade groups praised the ruling,  / saying it levels the playing field  / for local and online businesses.  / The losers, said retail <strong>[xxx]</strong> Neil Saunders,  / are online-only retailers,  / especially smaller ones.  / Those retailers may face headaches <strong>[xxx]</strong>  / with various state sales tax laws.  / The Small Business &amp; Entrepreneurship Council <strong>[xxx]</strong> group  / said in a statement,  / “Small businesses and internet entrepreneurs  / are not well served at all by this decision.”</p>\n<p>各州将能够 / to force 更多人 / to 缴纳销售税 / when they make 网上购物 / under a Supreme Court decision 周四 / that will leave 购物者 with 更轻的钱包 / but is a big 财政胜利 for states.</p>\n<p>The Supreme Court’s opinion 周四 / overruled a pair of decades-old decisions / that states said cost them 数十亿美元 / in lost <strong>[xxx]</strong> annually. / The decisions made it 更困难 / for states to 征收销售税 / on certain online purchases.</p>\n<p>The cases the court <strong>[xxx]</strong> / said that / if a business was shipping 一个顾客购买的东西 / to a state / where the business didn’t have 实体存在 / such as a <strong>[xxx]</strong> or 办公室, / the business didn’t have to collect sales tax for the state. / 顾客 were generally responsible / for 缴纳销售税 to the state themselves / if they weren’t charged it, / but 大多数人没有意识到 they owed it / and 很少有人缴纳.</p>\n<p>大法官安东尼·肯尼迪 wrote / that the previous decisions were <strong>[xxx]</strong>. / “每一年 the physical presence rule / becomes further removed from 经济现实 / and results in <strong>[xxx]</strong> 收入损失 to the states,” / he wrote in an opinion / joined by 另外四位大法官. / Kennedy wrote that the rule / “限制了各州的能力 / to seek long-term <strong>[xxx]</strong> / and has prevented market <strong>[xxx]</strong> / from competing on an even playing field.”</p>\n<p>The ruling is 一场胜利 / for 大型连锁企业 / with a presence in 许多州, / since they usually collect sales tax on online purchases already. / 现在, <strong>[xxx]</strong> / will be charging sales tax / where they hadn’t before. / Big chains have been collecting sales tax <strong>[xxx]</strong> / because they <strong>[xxx]</strong> / have 实体店 / in whatever state a purchase is being shipped to. / Amazon.com, with its 网络 of <strong>[xxx]</strong>, / also collects sales tax in every state that charges it, / though 第三方卖家 / who use the site 不必.</p>\n<p>直到现在, many sellers / that have a physical presence / in 只有一个州 or a few states / have been able to avoid charging sales taxes / when they ship to addresses outside those states. / Sellers that use eBay and Etsy, / which provide <strong>[xxx]</strong> for 更小的卖家, / also haven’t been collecting sales tax 全国. / Under the ruling Thursday, / 各州可以通过法律 / requiring out-of-state sellers to collect the state’s sales tax / from customers / and 将它交给州.</p>\n<p>零售业团体 称赞这项裁决, / saying it levels the playing field / for 本地和网上的企业. / 失利者, said retail <strong>[xxx]</strong> Neil Saunders, / are 只在网上营业的零售商, / 尤其更小的那些. / Those retailers may face headaches <strong>[xxx]</strong> / with various 州销售税法律. / The Small Business &amp; Entrepreneurship Council <strong>[xxx]</strong> group / said in a statement, / “小企业 and internet entrepreneurs / are 完全没有受到良好照顾 by this decision.”</p>\n<p>1、各州将能够、更多人、缴纳销售税、网上购物、周四；购物者、更轻的钱包、财政胜利。</p>\n<p>2、周四、数十亿美元、<strong>[xxx]</strong>；更困难、征收销售税。</p>\n<p>3、一个顾客购买的东西、实体存在、办公室；顾客、缴纳销售税、大多数人没有意识到、很少有人缴纳。</p>\n<p>4、大法官安东尼·肯尼迪、每一年、经济现实、收入损失；另外四位大法官、限制了各州的能力。</p>\n<p>5、一场胜利、大型连锁企业、许多州；现在、实体店、网络；第三方卖家、不必。</p>\n<p>6、直到现在、只有一个州；更小的卖家、全国；各州可以通过法律、将它交给州。</p>\n<p>7、零售业团体、称赞这项裁决；本地和网上的企业、失利者、只在网上营业的零售商、尤其更小的那些；州销售税法律、小企业、完全没有受到良好照顾。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概与各州、网上购物和销售税有关，开头看到购物者、更轻的钱包和财政胜利；中间似乎出现数十亿美元、顾客、很少有人缴纳，大法官安东尼·肯尼迪和收入损失；后来看到大型连锁企业、实体店和第三方卖家，结尾又出现只在网上营业的零售商、小企业和完全没有受到良好照顾。</p>\n<p>到这里还不能自然地说清楚：各州为什么有财政胜利，数十亿美元与顾客有什么关系，实体店和第三方卖家为什么一起出现，小企业为什么没有受到良好照顾。粗读时只要能判断“这篇文章大概与网上购物、销售税及不同的商家有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住各州、销售税、肯尼迪、大型连锁企业、第三方卖家和小企业；这些信息之间到底是什么关系，等题目问到再精读。</p>\n<hr>\n<h1>3. 开始做36至39题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n<h2>36题</h2>\n<blockquote>\n<p>The Supreme Court decision Thursday will ______.<br>最高法院周四的决定将会带来什么？</p>\n</blockquote>\n<p>题干点名 Supreme Court decision Thursday，开头就出现这项周四的决定。直接回到第1段，从开头读到结尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.</p>\n<p>开始精读：</p>\n<p>States will be able  / to force more people  / to pay sales tax  / when they make online purchases  / under a Supreme Court decision Thursday  / that will leave shoppers with lighter wallets  / but is a big financial win for states.</p>\n<p>各州将能够 / 强制更多人 / 缴纳销售税 / 当他们进行网上购物时 / 根据最高法院在周四作出的一项决定 / 它将使购物者的钱包更轻 / 但对于各州是一次大的财政胜利。</p>\n</blockquote>\n<p>第1段把这项决定、各州、购物者连在一起：各州能让更多人在网上购物时缴税，购物者的钱包变轻，各州得到财政上的好处。空格要接在 will 后面，问这项决定将带来什么。</p>\n<h3>A. put most online businesses in a <strong>[xxx]</strong></h3>\n<blockquote>\n<p>使大多数网上企业处在一种 <strong>[xxx]</strong> 中</p>\n</blockquote>\n<p>把A接回题干，它说的是：最高法院周四的决定将使大多数网上企业处在一种 <strong>[xxx]</strong> 状态。</p>\n<p>A 的 most online businesses 在说网上交易中的企业，原文 more people 在说同一交易中的购物者，两边都涉及网上交易受这项决定影响，因此回看第1段中谁需要缴税的句子。</p>\n<blockquote>\n<p>States will be able to force more people to pay sales tax when they make online purchases</p>\n</blockquote>\n<p>原文的 more people 是更多需要缴税的购物者。A 中 most online businesses 则是大多数网上企业，主体已经不同。不过，顾客需要缴税也可能影响卖方，A 后面表示企业处境的词又暂时看不懂，单凭这一句还不能确定它说的究竟是哪种影响。我们现在能读出的只是：买东西的人将有更多人缴税；大多数网上企业会处在什么状态，还没有说清。不能把购物者的钱包变轻直接翻成企业亏损，也不能把 A 中不认识的词当成某种好处。</p>\n<p><strong>只知道更多购物者需要缴税，能确定大多数网上企业所处的 [xxx] 状态吗？</strong></p>\n<p>不能。购物者缴税和企业受到影响可能同时发生，但两者不是同一句话。A 的核心状态还没有读清，现在不能确定它与裁决后果冲突。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. force some states to cut sales tax</h3>\n<blockquote>\n<p>迫使一些州削减销售税</p>\n</blockquote>\n<p>把B接回题干，它说的是：最高法院周四的决定将迫使一些州削减销售税。</p>\n<p>B 的 cut sales tax 对应原文 pay sales tax，双方都在说销售税，但一个是州削减，另一个是人们缴纳，所以回看第1段中各州得到什么权力的句子。</p>\n<blockquote>\n<p>States will be able to force more people to pay sales tax when they make online purchases</p>\n</blockquote>\n<p>原文 pay sales tax 的执行者是 more people，各州得到的是强制更多人缴税的能力。B 的 cut sales tax 却让各州成为被迫行动的一方，而且行动是削减销售税。两边虽然都提到税，谁被要求做事和税款怎样变化都不一样：原文把更多购物者纳入缴税范围，B 却写各州被要求减少税收。</p>\n<p><strong>这里被迫做事的是缴税的人，还是要削减销售税的州？</strong></p>\n<p>前者。原文是各州能够让更多人缴税，B 却把各州改成被迫削减销售税的一方，动作对象和方向都变了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. make more online shoppers pay sales tax</h3>\n<blockquote>\n<p>使更多网上购物者缴纳销售税</p>\n</blockquote>\n<p>把C接回题干，它说的是：最高法院周四的决定将使更多网上购物者缴纳销售税。</p>\n<p>C 的 online shoppers 是在网上购物的人，对应原文 more people 后面的 when they make online purchases，所以回看第1段中这些人要做什么的句子。</p>\n<blockquote>\n<p>States will be able to force more people to pay sales tax when they make online purchases</p>\n</blockquote>\n<p>原文 more people 不是随便一种人，后面的网上购物条件把他们限定成购物者。C 的 online shoppers 把这个条件收进一个名词里。原文的 force 与 C 的 make 都把动作落到这些人身上，动作又同样是 pay sales tax。因此 C 既保留了人数增加，也保留了网上购物和缴销售税这两个限定，没有把缴税者换成企业或州。</p>\n<p><strong>C 是否把原文中的人、网上购物条件和缴税动作都接上了？</strong></p>\n<p>能。更多人在网上购物时被要求缴销售税，正是更多网上购物者缴纳销售税，这个结果在第1段已经写明。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. better businesses’ relations with states</h3>\n<blockquote>\n<p>改善企业与各州的关系</p>\n</blockquote>\n<p>把D接回题干，它说的是：最高法院周四的决定将改善企业与各州之间的关系。</p>\n<p>D 的 relations with states 让我们回看原文 financial win for states，双方都把各州放在结果一端；但关系改善和财政收益是不同的结果，因此回看第1段结尾，比较这里说的是什么好处。</p>\n<blockquote>\n<p>that will leave shoppers with lighter wallets but is a big financial win for states.</p>\n</blockquote>\n<p>原文 financial win for states 指各州在钱上获益，同一句把另一端写成购物者的钱包变轻。D 的 relations with states 却把各州与企业之间相处得更好当成结果。原文建立的是购物者付款、各州得款这条关系，D 建立的是企业与各州之间关系改善。这里的 win 有 financial 明确限定，说的是钱上的得失，不是企业对各州的态度。</p>\n<p><strong>各州获得财政上的好处，就等于企业与各州的关系改善吗？</strong></p>\n<p>不等于。financial 限定的是钱，而 relations 说的是双方的关系。第1段交代的受影响一方还是购物者，不能用各州收入增加替换成企业与各州关系变好。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>36题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C 已经接上购物者缴税这件事；A 的企业状态还没有读清，目前留下 A 和 C。</p>\n<h2>37题</h2>\n<blockquote>\n<p>It can be learned from Paragraphs 2 and 3 that the overruled decisions ______.<br>从第2、3段可以知道，被推翻的那些决定有什么情况？</p>\n</blockquote>\n<p>题干直接给出 Paragraphs 2 and 3。我们把第2、3段都从开头读到结尾，留意旧决定分别给州、企业和顾客带来什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The Supreme Court’s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost <strong>[xxx]</strong> annually. The decisions made it more difficult for states to collect sales tax on certain online purchases.</p>\n<p>开始精读：</p>\n<p>The Supreme Court’s opinion Thursday  / overruled a pair of decades-old decisions  / that states said cost them billions of dollars  / in lost <strong>[xxx]</strong> annually.  / The decisions made it more difficult  / for states to collect sales tax  / on certain online purchases.</p>\n<p>最高法院周四的意见 / 推翻了两项几十年前的决定 / 各州说这些决定使它们损失了数十亿美元 / 在每年失去的 <strong>[xxx]</strong> 方面。 / 这些决定使事情更加困难 / 对各州去征收销售税来说 / 在某些网上购物上。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>The cases the court <strong>[xxx]</strong> said that if a business was shipping a customer’s purchase to a state where the business didn’t have a physical presence such as a <strong>[xxx]</strong> or office, the business didn’t have to collect sales tax for the state. Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.</p>\n<p>开始精读：</p>\n<p>The cases the court <strong>[xxx]</strong>  / said that  / if a business was shipping a customer’s purchase  / to a state  / where the business didn’t have a physical presence  / such as a <strong>[xxx]</strong> or office,  / the business didn’t have to collect sales tax for the state.  / Customers were generally responsible  / for paying the sales tax to the state themselves  / if they weren’t charged it,  / but most didn’t realize they owed it  / and few paid.</p>\n<p>那些案件，法院 <strong>[xxx]</strong> 的 / 说的是 / 如果一家企业正在寄送一个顾客购买的东西 / 到一个州 / 而这家企业在那里没有实体存在 / 例如一家 <strong>[xxx]</strong> 或办公室， / 这家企业就不必为这个州征收销售税。 / 顾客通常负有责任 / 自己向州缴纳销售税 / 如果他们没有被收取这笔税， / 但大多数人没有意识到他们欠这笔税 / 而且很少有人缴纳。</p>\n</blockquote>\n<p>第2段说各州损失钱，征税也更困难。第3段解释旧安排：不在当地有实体的企业可以不代收，顾客原本仍有缴税责任，但多数人不知欠税，很少人实际缴纳。题干问被推翻的旧决定，要把这几方分清。</p>\n<h3>A. were widely criticized by online purchasers</h3>\n<blockquote>\n<p>受到网上购买者的广泛批评</p>\n</blockquote>\n<p>把A接回题干，它说的是：被推翻的那些决定曾受到网上购买者的广泛批评。</p>\n<p>A 的 online purchasers 对应第3段的 Customers，都是购买东西的人；但 criticized 还要求他们表达批评，所以回看第3段末句写顾客知道什么、实际做什么。再看第2段 states said，分清提出损失的是谁。</p>\n<blockquote>\n<p>Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.</p>\n</blockquote>\n<blockquote>\n<p>states said cost them billions of dollars</p>\n</blockquote>\n<p>原文把 Customers 写成大多不知道自己欠税、也很少缴税的人。第2段 states said 的发言者则是各州，它们说旧决定使自己损失了钱。A 把 online purchasers 放到 criticized 的位置上，让顾客成为广泛表达不满的一方。顾客不知道欠税与州知道自己少收了钱，是两个主体的两种情况；不能把各州的抱怨搬到顾客身上。</p>\n<p><strong>这两段中说旧决定使自己损失钱的，是购买者还是各州？</strong></p>\n<p>后者。顾客这一端写的是不知欠税、很少付款，提出损失的是州。A 将说话的人换成了网上购买者。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. have cost consumers a lot over the years</h3>\n<blockquote>\n<p>多年来让消费者损失了很多钱</p>\n</blockquote>\n<p>把B接回题干，它说的是：被推翻的那些决定多年来使消费者损失了大量金钱。</p>\n<p>B 的 cost consumers 要找损失落在谁身上，正好对应第2段 states said cost them；第3段 few paid 又写顾客实际上很少缴税，因此要把两处放在一起，分清州的损失和消费者的付款。</p>\n<blockquote>\n<p>states said cost them billions of dollars</p>\n</blockquote>\n<blockquote>\n<p>but most didn’t realize they owed it and few paid.</p>\n</blockquote>\n<p>states said cost them 中 them 接的是 states，损失数十亿美元的是各州。B 的 cost consumers 把承受损失的人改成消费者。第3段又说 few paid，即真正缴税的顾客很少，这与让消费者付出很多钱的说法也不同。不能只看到 cost 和 billions of dollars 就留下 B；把损失归给谁，才是这一句的要点。</p>\n<p><strong>原文的数十亿美元损失能转成消费者损失很多钱吗？</strong></p>\n<p>不能。损失属于州，顾客一端反而是很少缴税。B 保留了损失很大的说法，却换掉了承受损失的主体。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. have led to the <strong>[xxx]</strong> of e-commerce</h3>\n<blockquote>\n<p>导致了电子商务的 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：被推翻的那些决定导致了电子商务的某种 <strong>[xxx]</strong>。</p>\n<p>C 的 e-commerce 是电子商务，对应第2段 certain online purchases 中的网上交易；要看旧决定怎样影响这类交易，就回看第2段最后一句以及第3段企业可以不代收税的规定。</p>\n<blockquote>\n<p>The decisions made it more difficult for states to collect sales tax on certain online purchases.</p>\n</blockquote>\n<blockquote>\n<p>the business didn’t have to collect sales tax for the state. </p>\n</blockquote>\n<p>原文 certain online purchases 限定的是某些网上购物，具体后果是州征税更困难，满足条件的企业不必代收。C 的 e-commerce 与网上交易有关，但它说的是电子商务发生一种变化，这个变化的核心名词没有读清。这里既不能把它说成行业发展，也不能说成行业衰落；目前只能确认旧决定确实改变了网上交易的税款安排。</p>\n<p><strong>税款安排发生变化，能让我们读出电子商务的 [xxx] 究竟是什么吗？</strong></p>\n<p>不能。原文已经给了网上交易与旧决定的联系，但 C 所说的变化仍不清楚。它可能涉及这项安排的影响，现在还不能确定整个命题是否成立。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. were considered unfavorable by states</h3>\n<blockquote>\n<p>被各州认为不利</p>\n</blockquote>\n<p>把D接回题干，它说的是：被推翻的那些决定被各州认为对自己不利。</p>\n<p>D 的 unfavorable by states 要看各州怎样看待旧决定，对应第2段 more difficult for states：州自己说损失了钱，随后又交代它们征税更困难，所以回看这两句给出的具体后果。</p>\n<blockquote>\n<p>states said cost them billions of dollars</p>\n</blockquote>\n<blockquote>\n<p>The decisions made it more difficult for states to collect sales tax on certain online purchases.</p>\n</blockquote>\n<p>原文 more difficult for states 把征税困难落在各州身上，各州又明确说自己因此损失数十亿美元。D 的 unfavorable by states 仍然以各州为评价主体，没有声称法院或顾客反对，而是说各州认为不利。这里虽然没有原样出现 unfavorable，但州说自己损失钱、事情更难办，两处都说明旧决定没有给州带来好处。</p>\n<p><strong>各州说旧决定让自己损失钱、征税更难，能说明它们认为旧决定不利吗？</strong></p>\n<p>能。D 评价的主体仍是各州，不利的依据就是它们自己提出的金钱损失与征税困难，不需要把顾客或企业的态度搬过来。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>37题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D保留。</li>\n</ul>\n<p>D 与各州的征税困难已经接上；C 中电子商务发生了什么变化尚不清楚。第一遍留下 C 和 D。</p>\n<h2>38题</h2>\n<blockquote>\n<p>According to Justice Anthony Kennedy, the physical presence rule has ______.<br>根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？</p>\n</blockquote>\n<p>题干给出 Justice Anthony Kennedy，直接回到他发言的第4段，从段首读到段尾，分清他所说的规则和规则造成的结果。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Justice Anthony Kennedy wrote that the previous decisions were <strong>[xxx]</strong>. “Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term <strong>[xxx]</strong> and has prevented market <strong>[xxx]</strong> from competing on an even playing field.”</p>\n<p>开始精读：</p>\n<p>Justice Anthony Kennedy wrote  / that the previous decisions were <strong>[xxx]</strong>.  / “Each year the physical presence rule  / becomes further removed from economic reality  / and results in <strong>[xxx]</strong> revenue losses to the states,”  / he wrote in an opinion  / joined by four other justices.  / Kennedy wrote that the rule  / “limited states’ ability  / to seek long-term <strong>[xxx]</strong>  / and has prevented market <strong>[xxx]</strong>  / from competing on an even playing field.”</p>\n<p>大法官安东尼·肯尼迪写道 / 以前的那些决定是 <strong>[xxx]</strong> 的。 / “每一年，这条实体存在规则 / 变得进一步远离经济现实 / 并且给各州造成 <strong>[xxx]</strong> 的收入损失，” / 他在一份意见中写道 / 另外四位大法官加入了这份意见。 / 肯尼迪写道，这条规则 / “限制了各州的能力 / 去寻求长期的 <strong>[xxx]</strong> / 并且已经阻止了市场 <strong>[xxx]</strong> / 在一个公平的比赛场地上竞争。”</p>\n</blockquote>\n<p>肯尼迪谈的是旧的实体存在规则：它越来越远离经济现实，造成州的收入损失；末句又写 limited 和 prevented，分别接着各州的一种长期目标与市场中的公平竞争。空格要补这条规则造成的影响。</p>\n<h3>A. <strong>[xxx]</strong> economic development</h3>\n<blockquote>\n<p>对经济发展做出 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把A接回题干，它说的是：肯尼迪认为，实体存在规则对经济发展造成了 <strong>[xxx]</strong>。</p>\n<p>A 的 economic development 谈经济发展，原文 economic reality 谈经济现实，都在说经济方面的情况；要判断规则与经济发展究竟是什么关系，还要一起回看他随后说各州长期目标受限制的句子。</p>\n<blockquote>\n<p>“Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states”</p>\n</blockquote>\n<blockquote>\n<p>Kennedy wrote that the previous decisions were <strong>[xxx]</strong>. “Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term <strong>[xxx]</strong> and has prevented market <strong>[xxx]</strong> from competing on an even playing field.”</p>\n</blockquote>\n<p>原文 economic reality 前面是 further removed，说明这条规则越来越远离经济现实；另一句说州追求长期目标的能力受到限制，但目标是什么还卡在 <strong>[xxx]</strong>。A 的 economic development 把对象写成经济发展，前面的核心动作也没有读清。两边有经济这层联系，但不能把原文的现实自动改成发展，也不能替 A 的动作决定是促进还是阻碍。</p>\n<p><strong>现在能读出 A 对经济发展作出了什么判断吗？</strong></p>\n<p>还不能。A 的动作没有读清，原文有关州长期目标的词也没有读清。经济现实、各州目标和经济发展之间可能有关联，但目前还不能确定这一整项的意思。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. harmed fair market competition</h3>\n<blockquote>\n<p>损害了公平的市场竞争</p>\n</blockquote>\n<p>把B接回题干，它说的是：肯尼迪认为，实体存在规则损害了公平的市场竞争。</p>\n<p>B 的 fair market competition 对应原文 competing on an even playing field，两边都说在公平条件下竞争；再看这件事前面接的是怎样的动作，所以回到第4段的最后一句。</p>\n<blockquote>\n<p>Kennedy wrote that the previous decisions were <strong>[xxx]</strong>. “Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term <strong>[xxx]</strong> and has prevented market <strong>[xxx]</strong> from competing on an even playing field.”</p>\n</blockquote>\n<p>原文 competing on an even playing field 把竞争条件比作平整、公平的比赛场地，前面 has prevented 表示这件事被阻止了。B 的 fair market competition 正在说这种公平竞争，harmed 表示它受到损害。market 后面的人或机构具体叫什么暂时不清楚，但 prevented 后接公平竞争这个动作已经明确，B 没有要求我们把那个名词补出来。</p>\n<p><strong>阻止在公平条件下竞争，能对应损害公平市场竞争吗？</strong></p>\n<p>能。原文的 prevented 与 B 的 harmed 都让公平竞争受到不利影响；这里比较的是竞争能否公平进行，不是市场中具体哪个名词的译法。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. boosted growth in states’ revenue</h3>\n<blockquote>\n<p>促进了各州收入的增长</p>\n</blockquote>\n<p>把C接回题干，它说的是：肯尼迪认为，实体存在规则促进了各州收入增长。</p>\n<p>C 的 growth in states’ revenue 与原文 revenue losses to the states 都直接谈各州收入，同一个对象一边说增长、一边说损失，所以回看肯尼迪引语中 results in 后面的结果。</p>\n<blockquote>\n<p>“Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states”</p>\n</blockquote>\n<p>原文 revenue losses to the states 把结果写成州的收入损失。losses 前面虽有一个词不认识，但这个词修饰的是损失，不能把 losses 改成收入增长。C 的 growth in states’ revenue 说州收入增长，而且 boosted 又写规则在推动这种增长。两边说的是同一笔收入，变化的方向却相反。</p>\n<p><strong>收入损失前面有一个词不认识，就能把损失读成增长吗？</strong></p>\n<p>不能。losses 已经把结果写成收入损失，C 却说规则促进收入增长；修饰损失的那个词不会把这两个方向变成同一个意思。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. brought prosperity to the country</h3>\n<blockquote>\n<p>给国家带来了繁荣</p>\n</blockquote>\n<p>把D接回题干，它说的是：肯尼迪认为，实体存在规则给整个国家带来了繁荣。</p>\n<p>D 的 prosperity to the country 把经济结果落在全国繁荣，原文 revenue losses to the states 则落在各州收入；两边都涉及经济影响，因此回看收入结果，并连着看肯尼迪接下来对公平竞争的评价。</p>\n<blockquote>\n<p>“Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states”</p>\n</blockquote>\n<blockquote>\n<p>Kennedy wrote that the previous decisions were <strong>[xxx]</strong>. “Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term <strong>[xxx]</strong> and has prevented market <strong>[xxx]</strong> from competing on an even playing field.”</p>\n</blockquote>\n<p>原文 revenue losses to the states 是州收入受损，末句又说公平竞争受到阻止，肯尼迪列出的都是这条规则带来的问题。D 的 prosperity to the country 却将结果写成全国繁荣，不仅把各州的具体收入结果扩到整个国家，还把肯尼迪的负面评价改成正面成就。economic reality 虽然提到经济，但它前面的 further removed 也不是在赞扬规则顺应现实。</p>\n<p><strong>肯尼迪列出的收入损失和竞争受阻，能合成给国家带来繁荣吗？</strong></p>\n<p>不能。他谈的是这条规则离现实越来越远、给州和竞争造成问题；D 却把这些结果改写成一项全国性的好处，评价方向正好转了过去。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>38题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B 与公平竞争受阻的句子可以对上；A 里描述经济发展的动作没有读清。目前留下 A 和 B。</p>\n<h2>39题</h2>\n<blockquote>\n<p>Who are most likely to welcome the Supreme Court ruling?<br>谁最有可能欢迎最高法院的这项裁决？</p>\n</blockquote>\n<p>题干点名 Supreme Court ruling，先回到第1段的 Supreme Court decision。36题已经把这一段读过，这里直接回到刚才读过的范围，接着看各选项所说的是哪一类人。</p>\n<p>第1段说购物者的钱包变轻、各州得到财政上的好处。题干现在问谁最可能欢迎这项裁决，需要根据选项中的具体人物，再去找文章是否把他们写成受益者。</p>\n<h3>A. Big-chain owners.</h3>\n<blockquote>\n<p>大型连锁企业的所有者</p>\n</blockquote>\n<p>把A接回题干，它说的是：大型连锁企业的所有者最可能欢迎这项裁决。</p>\n<p>A 的 Big-chain owners 是大型连锁企业的所有者。粗读后面时看到过大型连锁企业和一场胜利，回到第5段的 big chains，两者指向同一类企业，所以先把第5段从头到尾读完，再看胜利的原因。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, <strong>[xxx]</strong> will be charging sales tax where they hadn’t before. Big chains have been collecting sales tax <strong>[xxx]</strong> because they <strong>[xxx]</strong> have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of <strong>[xxx]</strong>, also collects sales tax in every state that charges it, though third-party sellers who use the site don’t have to.</p>\n<p>开始精读：</p>\n<p>The ruling is a victory  / for big chains  / with a presence in many states,  / since they usually collect sales tax on online purchases already.  / Now, <strong>[xxx]</strong>  / will be charging sales tax  / where they hadn’t before.  / Big chains have been collecting sales tax <strong>[xxx]</strong>  / because they <strong>[xxx]</strong>  / have physical stores  / in whatever state a purchase is being shipped to.  / Amazon.com, with its network of <strong>[xxx]</strong>,  / also collects sales tax in every state that charges it,  / though third-party sellers  / who use the site don’t have to.</p>\n<p>这项裁决是一场胜利 / 对大型连锁企业来说 / 它们在许多州有实体存在， / 因为它们通常已经对网上购物征收销售税。 / 现在， <strong>[xxx]</strong> / 将会征收销售税 / 在它们以前没有征收的地方。 / 大型连锁企业一直在征收销售税 <strong>[xxx]</strong> / 因为它们 <strong>[xxx]</strong> / 有实体店 / 不管购买的东西正被寄往哪个州。 / 亚马逊网站，带着它的 <strong>[xxx]</strong> 网络， / 也在每一个收这种税的州征收销售税， / 虽然第三方卖家 / 使用这个网站的，却不必这么做。</p>\n</blockquote>\n<p>现在回到 A，企业的一场胜利与其所有者是否最可能欢迎，直接看第5段首句给出的结果和原因。</p>\n<blockquote>\n<p>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already.</p>\n</blockquote>\n<p>原文 a victory for big chains 直接把大型连锁企业放在受益一边，原因是它们通常已经在网上交易中收销售税。A 的 Big-chain owners 指的正是拥有这些企业的人，并没有把行业换成另一种商家。题干问 most likely，不是要求所有者必须在原文里亲口说欢迎；企业得到一场胜利，就能给其所有者最可能欢迎提供直接依据。</p>\n<p><strong>裁决被称为大型连锁企业的胜利，能说明其所有者最可能欢迎吗？</strong></p>\n<p>能。A 的人和原文受益的企业是一一对应的，胜利已经给出了正面结果。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. Third-party sellers.</h3>\n<blockquote>\n<p>第三方卖家</p>\n</blockquote>\n<p>把B接回题干，它说的是：第三方卖家最可能欢迎这项裁决。</p>\n<p>B 的 Third-party sellers 对应刚读过的 don’t have to 所指的卖家：它们使用网站，却以前不必像网站本身一样收税。这里要弄清旧安排怎样变成新安排，因此接着看第6段的 sellers 与 out-of-state sellers，把这一整段读完，再比较以前不收税与现在可以被要求收税。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states. Sellers that use eBay and Etsy, which provide <strong>[xxx]</strong> for smaller sellers, also haven’t been collecting sales tax nationwide. Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state’s sales tax from customers and send it to the state.</p>\n<p>开始精读：</p>\n<p>Until now, many sellers  / that have a physical presence  / in only a single state or a few states  / have been able to avoid charging sales taxes  / when they ship to addresses outside those states.  / Sellers that use eBay and Etsy,  / which provide <strong>[xxx]</strong> for smaller sellers,  / also haven’t been collecting sales tax nationwide.  / Under the ruling Thursday,  / states can pass laws  / requiring out-of-state sellers to collect the state’s sales tax  / from customers  / and send it to the state.</p>\n<p>直到现在，许多卖家 / 有实体存在的 / 只在一个州或少数几个州， / 一直能够避免收取销售税 / 当它们把货寄到这些州以外的地址时。 / 使用易贝和埃特西的卖家， / 这两个网站为更小的卖家提供 <strong>[xxx]</strong>， / 也一直没有在全国征收销售税。 / 根据周四的这项裁决， / 各州可以通过法律 / 要求州外的卖家征收本州的销售税 / 从顾客那里 / 并将它交给州。</p>\n</blockquote>\n<p>现在回到 B，把第5段第三方卖家原来的待遇，与第6段州今后可以提出的收税要求放在一起。</p>\n<blockquote>\n<p>Amazon.com, with its network of <strong>[xxx]</strong>, also collects sales tax in every state that charges it, though third-party sellers who use the site don’t have to.</p>\n</blockquote>\n<blockquote>\n<p>Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state’s sales tax from customers and send it to the state.</p>\n</blockquote>\n<p>第5段 don’t have to 写的是第三方卖家原来的不同待遇；第6段说州现在可以要求州外卖家从顾客那里收税，再交给州。B 的 Third-party sellers 属于前面享有不代收安排的卖家，不能把原来不必收税当成新裁决给它们的一项新好处。题干问谁会欢迎这次变化，新的安排恰恰使原来不收的卖家可能要开始收，而不是继续给它们更宽松的待遇。</p>\n<p><strong>第三方卖家原来不必收税，能当成它们欢迎新裁决的好处吗？</strong></p>\n<p>不能。don&#39;t have to 说的是原来的情况；新裁决让州能够要求州外卖家代收。把旧的便利当成新的好处，会把变化前后读反。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. Internet entrepreneurs.</h3>\n<blockquote>\n<p>互联网创业者</p>\n</blockquote>\n<p>把C接回题干，它说的是：互联网创业者最可能欢迎这项裁决。</p>\n<p>C 的 Internet entrepreneurs 让我们接着找网上经营者的反应。粗读结尾出现过小企业，回到第7段看，internet entrepreneurs 与 Small businesses 并列，是同一句里的两类经营者，因此先把第7段读完，再回看声明的评价。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses. The losers, said retail <strong>[xxx]</strong> Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches <strong>[xxx]</strong> with various state sales tax laws. The Small Business &amp; Entrepreneurship Council <strong>[xxx]</strong> group said in a statement, “Small businesses and internet entrepreneurs are not well served at all by this decision.”</p>\n<p>开始精读：</p>\n<p>Retail trade groups praised the ruling,  / saying it levels the playing field  / for local and online businesses.  / The losers, said retail <strong>[xxx]</strong> Neil Saunders,  / are online-only retailers,  / especially smaller ones.  / Those retailers may face headaches <strong>[xxx]</strong>  / with various state sales tax laws.  / The Small Business &amp; Entrepreneurship Council <strong>[xxx]</strong> group  / said in a statement,  / “Small businesses and internet entrepreneurs  / are not well served at all by this decision.”</p>\n<p>零售业团体称赞这项裁决， / 说它使比赛场地变得公平 / 对本地和网上的企业来说。 / 失利者，零售 <strong>[xxx]</strong> 尼尔·桑德斯说， / 是只在网上营业的零售商， / 尤其是更小的那些。 / 那些零售商可能面临头痛 <strong>[xxx]</strong> / 与各州不同的销售税法律有关。 / 小企业与创业委员会这个 <strong>[xxx]</strong> 团体 / 在一份声明中说， / “小企业和互联网创业者 / 完全没有受到这项决定的良好照顾。”</p>\n</blockquote>\n<p>回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。</p>\n<blockquote>\n<p>The Small Business &amp; Entrepreneurship Council <strong>[xxx]</strong> group said in a statement, “Small businesses and internet entrepreneurs are not well served at all by this decision.”</p>\n</blockquote>\n<p>原文 Small businesses 后面并列的是 internet entrepreneurs，声明对两者共用 are not well served at all 这一评价。C 的 Internet entrepreneurs 正是其中一类人，不能因为前面说零售业团体称赞，就把这种正面反应分给所有网上经营者。对这类创业者，末句明确说这项决定完全没有好好照顾他们，方向与欢迎相反。</p>\n<p><strong>被明确说完全没有受到良好照顾的互联网创业者，会是这里最可能欢迎的一方吗？</strong></p>\n<p>不能。Small businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. Small retailers.</h3>\n<blockquote>\n<p>小型零售商</p>\n</blockquote>\n<p>把D接回题干，它说的是：小型零售商最可能欢迎这项裁决。</p>\n<p>D 的 Small retailers 对应第7段 especially smaller ones，都是体量较小的零售商；这句前面将他们放在 The losers 之后，所以直接回到刚读过的第7段，看他们被归在哪一边。</p>\n<blockquote>\n<p>The losers, said retail <strong>[xxx]</strong> Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches <strong>[xxx]</strong> with various state sales tax laws. </p>\n</blockquote>\n<p>原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。D 的 Small retailers 与原文限定的人群范围不同，它只按规模泛称小型零售商，没有保留网上经营这一条件，也没有指出其中哪一类明确受益。后面 headaches 继续说这些网上零售商面临麻烦。这里既不能把所有小型实体店都算成失利者，也不能仅凭 small 这个规模，就把小型零售商选为最可能欢迎的一方；文章明确给出胜利的是大型连锁企业。</p>\n<p><strong>原文特别点出小型网上零售商属于失利者，能只凭规模小就选 D 为最可能欢迎的一方吗？</strong></p>\n<p>不能。especially smaller ones 加重的是小型网上零售商的不利处境。D 只说 Small retailers，没有给出明确受益的经营身份；A 所指的大型连锁企业则被直接称为获得胜利。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>39题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>大型连锁企业被明确写成获胜的一方；其他几项对应新增缴税安排或文末的不利影响。第一遍留下 A。</p>\n<blockquote>\n<p><strong>39题选A。</strong></p>\n</blockquote>\n<h2>40题</h2>\n<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<p>在处理最高法院周四这项决定时，作者采用了怎样的写法？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>presents its main points with conflicting views on them</strong></p>\n<p>呈现它的主要内容，并给出对这些内容相互冲突的看法</p>\n<p>B. <strong>gives a factual account of it and discusses its consequences</strong></p>\n<p>对它作事实性的介绍，并讨论它的后果</p>\n<p>C. <strong>cites some cases related to it and analyzes their implications</strong></p>\n<p>引用一些与它有关的案件，并分析这些案件的含义</p>\n<p>D. <strong>describes the long and complicated process of its making</strong></p>\n<p>描述它形成过程中漫长而复杂的过程</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。</td>\n<td>先说发生了什么和谁受影响</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。</td>\n<td>回头解释原来是什么情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。</td>\n<td>再把原来的做法说清楚</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。</td>\n<td>接着说原来的做法为什么要改</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。</td>\n<td>先说一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。</td>\n<td>再说另一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。</td>\n<td>最后说各方分别有什么反应</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<h3>A. presents its main points with conflicting views on them</h3>\n<p>呈现它的主要内容，并给出对这些内容相互冲突的看法</p>\n<h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果 A 对，文章应当围绕裁决的主要内容及对这些内容相互冲突的看法展开。作者需要反复将同一个问题上的两种意见放在一起，让意见冲突成为组织全文的线索。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>交代裁决的主要内容，并立即摆出针对该内容的两种相反意见。</td>\n<td>先说发生了什么和谁受影响</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回看旧决定时，介绍围绕这些决定形成的两种对立判断。</td>\n<td>回头解释原来是什么情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>解释旧做法后，把赞成保留与反对保留的具体理由并列。</td>\n<td>再把原来的做法说清楚</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>交代改变旧做法的理由，同时提出针锋相对的反驳。</td>\n<td>接着说原来的做法为什么要改</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>写大型连锁企业时，围绕其主张呈现另一方的异议。</td>\n<td>先说一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>写其他卖家时，继续比较双方对同一裁决内容的不同解释。</td>\n<td>再说另一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后归纳前面一直展开的意见冲突，以及双方主要争论点。</td>\n<td>最后说各方分别有什么反应</td>\n</tr>\n</tbody></table>\n<p>A 不是完全没有碰到文章：第7段确实有人称赞，也有人说小企业没有受到良好照顾。不过，这些人处在不同的经营位置，作者主要用他们的反应补充说明谁受益、谁受损。前面的第2、3段在解释旧制度怎样收税，第4段引用肯尼迪说明改变它的理由，第5、6段追踪不同商家将承担什么；这些段落没有一直成对摆出针对同一要点的正反论据。A 中 with conflicting views on them 要求意见冲突跟着各个主要内容展开，实际文章只是结尾集中出现不同反应。用最后一段的一个特征来解释前面全部段落，会漏掉正文对规则和后果的连续交代。</p>\n<p><strong>把相互冲突的看法作为全文中心，能解释前六段为何主要在交代规则与影响吗？</strong></p>\n<p>不能。不同反应确实出现了，但它们是各种后果的一部分，不能代替全文主要的叙述方式。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr>\n<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<h3>B. gives a factual account of it and discusses its consequences</h3>\n<p>对它作事实性的介绍，并讨论它的后果</p>\n<h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果 B 对，作者就应先把决定是什么、相关旧安排是什么讲清，再追踪这项决定会给不同人带来什么。引用理由和各方反应都可以服务于这两件事。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先报道决定的具体内容，并简要交代最直接的受益者和付出者。</td>\n<td>先说发生了什么和谁受影响</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回到旧决定，给读者理解新决定所需的事实背景。</td>\n<td>回头解释原来是什么情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>继续解释旧安排怎样运作，哪些人负责收税或缴税。</td>\n<td>再把原来的做法说清楚</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>引用作出改变的理由，说明原来的安排存在哪些问题。</td>\n<td>接着说原来的做法为什么要改</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>先写一种经营者将受到什么影响，以及为什么受益。</td>\n<td>先说一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>再写另一种经营者面临的义务如何变化。</td>\n<td>再说另一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后引用相关各方的反应，把不同后果呈现得更具体。</td>\n<td>最后说各方分别有什么反应</td>\n</tr>\n</tbody></table>\n<p>B 的 factual account 能接住第1段对周四决定的报道，也能接住第2、3段对旧决定和收税安排的解释。第4段引用肯尼迪，是让读者知道改变的理由，仍然围绕这项决定交代事实。discusses its consequences 又接住第5、6段：大型连锁企业被称为获胜者，原来不收税的州外卖家今后可能被要求代收。第7段的称赞、失利者和小企业声明继续说明这些后果。这里既不是只列一条新闻，也不是把作者自己的态度放到中心；作者把决定、背景与各方所受影响连着讲出来。B 的两个动作能够分别覆盖文章前半与后半，也能解释为什么结尾会引用不同群体的反应。</p>\n<p><strong>事实介绍加后果讨论，能同时解释开头、旧规则说明和后面的商家反应吗？</strong></p>\n<p>能。前面让人知道发生了什么、为何改变，后面让人知道谁会怎样，两部分与 B 的写法描述逐段吻合。</p>\n<p><strong>判断：B保留。</strong></p>\n<hr>\n<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<h3>C. cites some cases related to it and analyzes their implications</h3>\n<p>引用一些与它有关的案件，并分析这些案件的含义</p>\n<h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果 C 对，文章应当把几个相关案件当成主要材料，逐个交代它们发生了什么，再解释各案对本次决定意味着什么。案件及其含义要承担全文推进。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>交代决定时带出几个将要分析的相关案件。</td>\n<td>先说发生了什么和谁受影响</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回顾旧情况时，逐一说明过去几个案件的背景。</td>\n<td>回头解释原来是什么情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>通过案件中当事人的做法和具体争议，把旧安排说清楚。</td>\n<td>再把原来的做法说清楚</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用相关案件的具体结果解释为什么需要改变原来的做法。</td>\n<td>接着说原来的做法为什么要改</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>选取涉及第一类人的具体案件，并分析它的含义。</td>\n<td>先说一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>再选取涉及另一类人的案件，继续作比较和解释。</td>\n<td>再说另一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后汇集人们对前面几个案件及其含义的反应。</td>\n<td>最后说各方分别有什么反应</td>\n</tr>\n</tbody></table>\n<p>C 中 cases 可以让我们想到第3段开头的 The cases，以及第2段的两项旧决定。但接下来文章没有讲这些案件各自是谁起诉谁、具体争议是什么，也没有逐案讨论含义，而是马上解释共同的实体存在规则与顾客缴税情况。第5、6段的连锁企业、州外卖家也是受新裁决影响的群体，不是正在逐个分析的诉讼案例。C 把背景中提到旧案件，变成了全文依靠相关案件展开分析，给案件的作用加大了一层。尤其尾段的商家反应，接的是新决定对它们的影响，并非前面各个案件的不同含义。</p>\n<p><strong>仅仅提到旧案件，就足以说明全文在引用多个案件并分析其含义吗？</strong></p>\n<p>不能。文章用旧决定交代收税背景，后半追踪的是新裁决的后果；它没有按多个案件逐一展开。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<h3>D. describes the long and complicated process of its making</h3>\n<p>描述它形成过程中漫长而复杂的过程</p>\n<h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果 D 对，全文应该沿着裁决形成的时间过程往下走，让读者看到这项决定经过了哪些漫长、复杂的环节。人物与旧规则都应放回这些形成环节中。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>宣布决定时先点出它耗时漫长、过程复杂。</td>\n<td>先说发生了什么和谁受影响</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回到早期阶段，交代形成决定之前的起点。</td>\n<td>回头解释原来是什么情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>继续按先后顺序描述参与者在形成过程中的具体行动。</td>\n<td>再把原来的做法说清楚</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>说明过程中遇到的难题与转折，以及改变旧做法的关键一步。</td>\n<td>接着说原来的做法为什么要改</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>描写第一类人怎样参与决定的形成。</td>\n<td>先说一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>接着描写另一类人参与形成决定的后续环节。</td>\n<td>再说另一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后用各方反应为整个形成过程收尾。</td>\n<td>最后说各方分别有什么反应</td>\n</tr>\n</tbody></table>\n<p>D 的 process of its making 问的是决定怎样一步步形成，long and complicated 又要求文章突出耗时与复杂性。原文确实有 Thursday、decades-old、Until now 等时间词，但它们分别标记本次决定、旧决定和此前的收税状态，并没有串成审议程序。第4段介绍肯尼迪的理由，也只是说明旧规则存在的问题，没有展开漫长的讨论、修改或表决经过。更明显的是，第5、6段已经在说决定作出以后商家怎样收税，第7段又是相关人对结果的反应。这些段落都在走向决定之后，D 却要求它们围绕决定作出之前的形成过程展开。</p>\n<p><strong>文章后半追踪决定之后的影响，能归为描述决定形成过程吗？</strong></p>\n<p>不能。后果发生在决定作出之后，形成过程发生在决定作出之前。时间词的存在，不能把这两种内容合成一件事。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<h3>40题结论</h3>\n<p><strong>40. B. gives a factual account of it and discusses its consequences</strong></p>\n<p>文章开头交代新决定，随后解释旧规则、旧规则的问题，再追踪大型连锁企业、州外卖家和小商家分别会怎样，末尾补上它们的反应。这些段落共同完成的是事实介绍与后果讨论。最后出现不同反应，并不等于整篇围绕各项内容展开正反争论；出现旧案件，也不等于全文在逐案分析。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>gives a factual account of it and discusses its consequences / 对这项决定作事实性的介绍，并讨论它的后果</strong></p>\n<hr>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保40题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查36题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. put most online businesses in a <strong>[xxx]</strong></li>\n<li>C. make more online shoppers pay sales tax</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>gives a factual account of it and discusses its consequences</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>对这项决定作事实性的介绍，并讨论它的后果</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A 说，这项决定将使大多数网上企业处在一种 <strong>[xxx]</strong> 中；C 说，这项决定将使更多网上购物者缴纳销售税。第一遍，第1段已经直接写了购物者缴税，但也不能否认购物者的付款变化会影响企业。A 所说的企业状态又没读清，所以当时没有把 A 直接否掉。</p>\n<p>现在拿主旨来检查。</p>\n<p>40题确定的是事实介绍和后果讨论这种写法，不能代替具体事实，仍要回到刚才已经读过的内容。全文前面解释州为何难以收税，后面说明州外卖家可以被要求向顾客收税再交给州。这个展开反复补充的是同一变化：网上交易中，更多应缴的税将被收上来。C 所说的更多网上购物者缴税，既接住第1段直接交代的结果，也接住后面具体说明的征收安排。</p>\n<p>再看 A。全文确实谈企业受影响，但没有把大多数网上企业都写成一种相同处境：大型连锁企业被称为获胜者，只在网上经营的零售商尤其小商家则被放在失利的一边。A 中的状态仍然读不清，不能替它补成亏损，也不能替它补成受益；更不能仅凭 businesses 一词，就把不同商家的不同后果拼成对大多数网上企业的同一个断言。</p>\n<p>回到最开始的局部，more people、online purchases 与 pay sales tax 已经把 C 所需的人、购物方式和动作写全。后面各段的事实介绍又解释了这项安排怎样落实。C 因而同时得到开头原句和全文展开的明确支持；A 仍只与企业受影响这一宽泛话题相连，核心状态并未得到确认。选择 C，不需要先猜出 A 的最后一个词。</p>\n<blockquote>\n<p><strong>36题选C。</strong></p>\n</blockquote>\n<hr>\n<h2>回查37题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>C. have led to the <strong>[xxx]</strong> of e-commerce</li>\n<li>D. were considered unfavorable by states</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>gives a factual account of it and discusses its consequences</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>对这项决定作事实性的介绍，并讨论它的后果</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>C 说旧决定导致电子商务出现某种 <strong>[xxx]</strong>；D 说旧决定被各州认为不利。第一遍我们读出了网上交易的收税安排，也读出了州因此损失钱、征税更困难。C 中电子商务与网上交易有关，但究竟发生什么变化没有读清，所以当时保留了 C；D 则有各州自己说出的损失作为依据。</p>\n<p>现在拿主旨来检查。</p>\n<p>40题确认作者在介绍这项决定的事实，并讨论它的后果。放回已经整理过的全文表，第2、3段不是突然转去介绍电子商务行业的发展史，而是在解释旧决定为何让州难以收到钱；后面的肯尼迪发言继续说州收入损失、公平竞争受到阻碍，新安排则允许州要求州外卖家代收。这些内容把旧规则的问题与新决定的后果接在一起。</p>\n<p>D 说各州认为旧决定不利，能解释为什么文章先记录州的损失，再说明旧制度怎样造成收税困难。它仍然说各州的看法，没有把肯尼迪或商家的意见算到消费者身上。第2段 states said 又说明，这项判断并非我们替州猜出的态度，而是州自己指出了损失。</p>\n<p>C 的 e-commerce 确实与网上交易相连，但全文对这个领域交代的是不同经营者的税款安排与不同影响，并没有确定 C 中那个未知结果。若直接选择 C，就要替没有读清的词决定行业究竟发生了什么，而这些具体税款事实还不能完成那一步。这里不把 C 的未知词判成某个相反意思，只比较哪一项已经得到明确说明。</p>\n<p>最后回到第一遍读过的第2、3段：州损失数十亿美元、征税更难，顾客却多数不知欠税、很少缴纳，受不利影响的主体是州。D 同时接住这两段的事实，以及全文解释改变旧安排原因的展开，所以选择 D。</p>\n<blockquote>\n<p><strong>37题选D。</strong></p>\n</blockquote>\n<hr>\n<h2>回查38题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. <strong>[xxx]</strong> economic development</li>\n<li>B. harmed fair market competition</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>gives a factual account of it and discusses its consequences</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>对这项决定作事实性的介绍，并讨论它的后果</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A 说这条实体存在规则对经济发展作出 <strong>[xxx]</strong>；B 说它损害公平市场竞争。第一遍，economic development 让我们想到 economic reality，加上州的长期目标受到限制，A 看起来与这一段有经济层面的联系。但 A 的动作没有读清，州的长期目标也没有读清，因此只能保留它。B 则能直接接上 prevented 与公平竞争。</p>\n<p>现在拿主旨来检查。</p>\n<p>40题让我们把文章看成对决定的事实介绍和后果讨论。全文已经读过的具体后果，是不同商家在销售税上的待遇发生变化：大型连锁企业以前通常已收税，某些州外卖家以前能够不收，新安排使州可以要求它们代收。文末还有零售业团体称赞比赛场地变得公平。这些事实与肯尼迪所说的竞争条件受影响，谈的是同一件具体事情。</p>\n<p>B 的 harmed fair market competition 能把这几处接起来。旧规则使不同经营者面对不同收税安排，肯尼迪说它阻止在公平条件下竞争；改变规则以后，又有人称赞竞争条件变得公平。选择 B 不必把 market 后面的未知名词补出，也不必把州的长期目标译成某个具体词。</p>\n<p>再看 A。economic reality 是经济现实，economic development 是经济发展，前者出现并不能替后者确定动作。全文也没有把讨论扩展成经济发展总体被怎样影响的结论，而是反复具体说明收税义务、州收入和竞争条件。A 的未知动作依然不能由这些文字读出；我们不能因为两边都有 economic，就把一个关于现实的句子改成关于发展的完整判断。</p>\n<p>回到第一遍读过的第4段，has prevented 后面直接接 competing on an even playing field，B 已经能据此成立；全文对不同商家待遇与公平反应的介绍，又把这一后果展开得更清楚。A 仍需要补出没有读清的动作并增加经济发展的关系。因此选择 B，而不替 A 的未知词下定义。</p>\n<blockquote>\n<p><strong>38题选B。</strong></p>\n</blockquote>\n<hr>\n<h2>最终答案：</h2>\n<p><strong>36. C</strong></p>\n<p><strong>37. D</strong></p>\n<p><strong>38. B</strong></p>\n<p><strong>39. A</strong></p>\n<p><strong>40. B</strong></p>\n","analysisStartIndex":38,"maskInventory":{"token":"[xxx]","count":128},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired": function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h);if(!baseW||!baseH)return;const pw=wrap.querySelector('.pageWrap')||wrap;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=(a[0]/baseW*100)+'%';d.style.top=(a[1]/baseH*100)+'%';d.style.width=(a[2]/baseW*100)+'%';d.style.height=(a[3]/baseH*100)+'%';pw.appendChild(d)})}
function centerRects(wrapId){const wrap=document.getElementById(wrapId);if(!wrap)return;const hls=[...wrap.querySelectorAll('.hl')];if(!hls.length)return;const sr=leftPane.getBoundingClientRect();let top=Infinity,bottom=-Infinity;for(const el of hls){const r=el.getBoundingClientRect();top=Math.min(top,leftPane.scrollTop+r.top-sr.top);bottom=Math.max(bottom,leftPane.scrollTop+r.bottom-sr.top)}const target=Math.max(0,Math.min(leftPane.scrollHeight-leftPane.clientHeight,(top+bottom)/2-leftPane.clientHeight/2));leftPane.scrollTo({top:target,behavior:'smooth'})}
