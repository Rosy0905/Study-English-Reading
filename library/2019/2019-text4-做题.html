et entrepreneurs，声明对两者共用 are not well served at all 这一评价。C 的 Internet entrepreneurs 正是其中一类人，不能因为前面说零售业团体称赞，就把这种正面反应分给所有网上经营者。对这类创业者，末句明确说这项决定完全没有好好照顾他们，方向与欢迎相反。\n\n**被明确说完全没有受到良好照顾的互联网创业者，会是这里最可能欢迎的一方吗？**\n\n不能。Small businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。\n\n**第一轮判断：C排除。**","html":"<h3>C. Internet entrepreneurs.</h3>\n<blockquote>\n<p>互联网创业者</p>\n</blockquote>\n<p>把C接回题干，它说的是：互联网创业者最可能欢迎这项裁决。</p>\n<p>C 的 Internet entrepreneurs 让我们接着找网上经营者的反应。粗读结尾出现过小企业，回到第7段看，internet entrepreneurs 与 Small businesses 并列，是同一句里的两类经营者，因此先把第7段读完，再回看声明的评价。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses. The losers, said retail <strong>[xxx]</strong> Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches <strong>[xxx]</strong> with various state sales tax laws. The Small Business &amp; Entrepreneurship Council <strong>[xxx]</strong> group said in a statement, “Small businesses and internet entrepreneurs are not well served at all by this decision.”</p>\n<p>开始精读：</p>\n<p>Retail trade groups praised the ruling,  / saying it levels the playing field  / for local and online businesses.  / The losers, said retail <strong>[xxx]</strong> Neil Saunders,  / are online-only retailers,  / especially smaller ones.  / Those retailers may face headaches <strong>[xxx]</strong>  / with various state sales tax laws.  / The Small Business &amp; Entrepreneurship Council <strong>[xxx]</strong> group  / said in a statement,  / “Small businesses and internet entrepreneurs  / are not well served at all by this decision.”</p>\n<p>零售业团体称赞这项裁决， / 说它使比赛场地变得公平 / 对本地和网上的企业来说。 / 失利者，零售 <strong>[xxx]</strong> 尼尔·桑德斯说， / 是只在网上营业的零售商， / 尤其是更小的那些。 / 那些零售商可能面临头痛 <strong>[xxx]</strong> / 与各州不同的销售税法律有关。 / 小企业与创业委员会这个 <strong>[xxx]</strong> 团体 / 在一份声明中说， / “小企业和互联网创业者 / 完全没有受到这项决定的良好照顾。”</p>\n</blockquote>\n<p>回到 C，直接看声明怎样评价互联网创业者和小企业受到的影响。</p>\n<blockquote>\n<p>The Small Business &amp; Entrepreneurship Council <strong>[xxx]</strong> group said in a statement, “Small businesses and internet entrepreneurs are not well served at all by this decision.”</p>\n</blockquote>\n<p>原文 Small businesses 后面并列的是 internet entrepreneurs，声明对两者共用 are not well served at all 这一评价。C 的 Internet entrepreneurs 正是其中一类人，不能因为前面说零售业团体称赞，就把这种正面反应分给所有网上经营者。对这类创业者，末句明确说这项决定完全没有好好照顾他们，方向与欢迎相反。</p>\n<p><strong>被明确说完全没有受到良好照顾的互联网创业者，会是这里最可能欢迎的一方吗？</strong></p>\n<p>不能。Small businesses 和互联网创业者一起受到负面评价，C 所指的人就在这句不满之中；前面零售业团体的称赞不能覆盖他们。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[307,1928,1242,35],[228,1979,1319,35],[228,2030,1319,36],[228,2082,1326,35],[227,2132,1320,37],[228,2183,1140,37]],"questionRects":[[255,1505,1033,35],[315,1709,405,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C 的 Internet entrepreneurs 让我们接着找网上经营者的反应。粗读结尾出现过小企业，回到第7段看，internet entrepreneurs 与 Small businesses 并列，是同一句里的两类经营者，因此先把第7段读完，再回看声明的评价。"],"evidenceParagraphPids":[6],"extraPrecisionParagraphPids":[6],"sourceMode":"new_precision_reading","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"Small businesses","visibleOptionAnchor":"Internet entrepreneurs"}}}},{"section":"39题","raw":"### D. Small retailers.\n\n> 小型零售商\n\n把D接回题干，它说的是：小型零售商最可能欢迎这项裁决。\n\nD 的 Small retailers 对应第7段 especially smaller ones，都是体量较小的零售商；这句前面将他们放在 The losers 之后，所以直接回到刚读过的第7段，看他们被归在哪一边。\n\n> The losers, said retail **[xxx]** Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches **[xxx]** with various state sales tax laws. \n\n原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。D 的 Small retailers 与原文限定的人群范围不同，它只按规模泛称小型零售商，没有保留网上经营这一条件，也没有指出其中哪一类明确受益。后面 headaches 继续说这些网上零售商面临麻烦。这里既不能把所有小型实体店都算成失利者，也不能仅凭 small 这个规模，就把小型零售商选为最可能欢迎的一方；文章明确给出胜利的是大型连锁企业。\n\n**原文特别点出小型网上零售商属于失利者，能只凭规模小就选 D 为最可能欢迎的一方吗？**\n\n不能。especially smaller ones 加重的是小型网上零售商的不利处境。D 只说 Small retailers，没有给出明确受益的经营身份；A 所指的大型连锁企业则被直接称为获得胜利。\n\n**第一轮判断：D排除。**","html":"<h3>D. Small retailers.</h3>\n<blockquote>\n<p>小型零售商</p>\n</blockquote>\n<p>把D接回题干，它说的是：小型零售商最可能欢迎这项裁决。</p>\n<p>D 的 Small retailers 对应第7段 especially smaller ones，都是体量较小的零售商；这句前面将他们放在 The losers 之后，所以直接回到刚读过的第7段，看他们被归在哪一边。</p>\n<blockquote>\n<p>The losers, said retail <strong>[xxx]</strong> Neil Saunders, are online-only retailers, especially smaller ones. Those retailers may face headaches <strong>[xxx]</strong> with various state sales tax laws. </p>\n</blockquote>\n<p>原文 especially smaller ones 承接 online-only retailers，说明只在网上营业的零售商是失利者，尤其小的那些受到影响。D 的 Small retailers 与原文限定的人群范围不同，它只按规模泛称小型零售商，没有保留网上经营这一条件，也没有指出其中哪一类明确受益。后面 headaches 继续说这些网上零售商面临麻烦。这里既不能把所有小型实体店都算成失利者，也不能仅凭 small 这个规模，就把小型零售商选为最可能欢迎的一方；文章明确给出胜利的是大型连锁企业。</p>\n<p><strong>原文特别点出小型网上零售商属于失利者，能只凭规模小就选 D 为最可能欢迎的一方吗？</strong></p>\n<p>不能。especially smaller ones 加重的是小型网上零售商的不利处境。D 只说 Small retailers，没有给出明确受益的经营身份；A 所指的大型连锁企业则被直接称为获得胜利。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[307,1928,1242,35],[228,1979,1319,35],[228,2030,1319,36],[228,2082,1326,35],[227,2132,1320,37],[228,2183,1140,37]],"questionRects":[[255,1505,1033,35],[315,1777,291,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D 的 Small retailers 对应第7段 especially smaller ones，都是体量较小的零售商；这句前面将他们放在 The losers 之后，所以直接回到刚读过的第7段，看他们被归在哪一边。"],"evidenceParagraphPids":[6],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"especially smaller ones","visibleOptionAnchor":"Small retailers"}}}},{"section":"39题","raw":"### 39题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C排除；\n- D排除。\n\n大型连锁企业被明确写成获胜的一方；其他几项对应新增缴税安排或文末的不利影响。第一遍留下 A。\n\n> **39题选A。**","html":"<h3>39题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>大型连锁企业被明确写成获胜的一方；其他几项对应新增缴税安排或文末的不利影响。第一遍留下 A。</p>\n<blockquote>\n<p><strong>39题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"39"}},{"section":"40题","raw":"## 40题\n\n**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n在处理最高法院周四这项决定时，作者采用了怎样的写法？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **presents its main points with conflicting views on them**\n\n呈现它的主要内容，并给出对这些内容相互冲突的看法\n\nB. **gives a factual account of it and discusses its consequences**\n\n对它作事实性的介绍，并讨论它的后果\n\nC. **cites some cases related to it and analyzes their implications**\n\n引用一些与它有关的案件，并分析这些案件的含义\n\nD. **describes the long and complicated process of its making**\n\n描述它形成过程中漫长而复杂的过程","html":"<h2>40题</h2>\n<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<p>在处理最高法院周四这项决定时，作者采用了怎样的写法？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>presents its main points with conflicting views on them</strong></p>\n<p>呈现它的主要内容，并给出对这些内容相互冲突的看法</p>\n<p>B. <strong>gives a factual account of it and discusses its consequences</strong></p>\n<p>对它作事实性的介绍，并讨论它的后果</p>\n<p>C. <strong>cites some cases related to it and analyzes their implications</strong></p>\n<p>引用一些与它有关的案件，并分析这些案件的含义</p>\n<p>D. <strong>describes the long and complicated process of its making</strong></p>\n<p>描述它形成过程中漫长而复杂的过程</p>\n","articleRects":[],"questionRects":[[253,1913,1265,35]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"40"}},{"section":"40题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。 | 先说发生了什么和谁受影响 |\n| 第2段 | 回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。 | 回头解释原来是什么情况 |\n| 第3段 | 解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。 | 再把原来的做法说清楚 |\n| 第4段 | 引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。 | 接着说原来的做法为什么要改 |\n| 第5段 | 具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。 | 先说一种人会受到什么影响 |\n| 第6段 | 具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。 | 再说另一种人会受到什么影响 |\n| 第7段 | 以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。 | 最后说各方分别有什么反应 |\n\n---","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先报道周四的新决定：州能让更多网上购物者缴销售税，并点出购物者付出更多钱、州在财政上获益。</td>\n<td>先说发生了什么和谁受影响</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回到被推翻的旧决定，说明州说自己损失了钱、对某些网上购物征税更难。</td>\n<td>回头解释原来是什么情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>解释旧规则怎样运行：无当地实体的企业可以不代收税；顾客原本应自行缴纳，但多数不知欠税、很少实际缴纳。</td>\n<td>再把原来的做法说清楚</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>引用肯尼迪解释旧规则的问题：脱离经济现实、造成州收入损失，并阻止公平竞争。</td>\n<td>接着说原来的做法为什么要改</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>具体看大型连锁企业：以前通常已收销售税，新裁决被称为它们的胜利；再对照网站本身与第三方卖家的旧待遇。</td>\n<td>先说一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>具体看原来可以不代收的州外卖家：新裁决允许州立法要求它们向顾客收税并交给州。</td>\n<td>再说另一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>以不同经营者的反应收尾：零售业团体称赞公平，网上零售商尤其小商家可能面对麻烦，小企业与创业者表达不满。</td>\n<td>最后说各方分别有什么反应</td>\n</tr>\n</tbody></table>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"40","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"40题","raw":"**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n### A. presents its main points with conflicting views on them\n\n呈现它的主要内容，并给出对这些内容相互冲突的看法\n\n#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果 A 对，文章应当围绕裁决的主要内容及对这些内容相互冲突的看法展开。作者需要反复将同一个问题上的两种意见放在一起，让意见冲突成为组织全文的线索。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 交代裁决的主要内容，并立即摆出针对该内容的两种相反意见。 | 先说发生了什么和谁受影响 |\n| 第2段 | 回看旧决定时，介绍围绕这些决定形成的两种对立判断。 | 回头解释原来是什么情况 |\n| 第3段 | 解释旧做法后，把赞成保留与反对保留的具体理由并列。 | 再把原来的做法说清楚 |\n| 第4段 | 交代改变旧做法的理由，同时提出针锋相对的反驳。 | 接着说原来的做法为什么要改 |\n| 第5段 | 写大型连锁企业时，围绕其主张呈现另一方的异议。 | 先说一种人会受到什么影响 |\n| 第6段 | 写其他卖家时，继续比较双方对同一裁决内容的不同解释。 | 再说另一种人会受到什么影响 |\n| 第7段 | 最后归纳前面一直展开的意见冲突，以及双方主要争论点。 | 最后说各方分别有什么反应 |\n\nA 不是完全没有碰到文章：第7段确实有人称赞，也有人说小企业没有受到良好照顾。不过，这些人处在不同的经营位置，作者主要用他们的反应补充说明谁受益、谁受损。前面的第2、3段在解释旧制度怎样收税，第4段引用肯尼迪说明改变它的理由，第5、6段追踪不同商家将承担什么；这些段落没有一直成对摆出针对同一要点的正反论据。A 中 with conflicting views on them 要求意见冲突跟着各个主要内容展开，实际文章只是结尾集中出现不同反应。用最后一段的一个特征来解释前面全部段落，会漏掉正文对规则和后果的连续交代。\n\n**把相互冲突的看法作为全文中心，能解释前六段为何主要在交代规则与影响吗？**\n\n不能。不同反应确实出现了，但它们是各种后果的一部分，不能代替全文主要的叙述方式。\n\n**判断：A排除。**\n\n---","html":"<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<h3>A. presents its main points with conflicting views on them</h3>\n<p>呈现它的主要内容，并给出对这些内容相互冲突的看法</p>\n<h4>如果 A 是主旨，文章7段应该怎么写？</h4>\n<p>如果 A 对，文章应当围绕裁决的主要内容及对这些内容相互冲突的看法展开。作者需要反复将同一个问题上的两种意见放在一起，让意见冲突成为组织全文的线索。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>交代裁决的主要内容，并立即摆出针对该内容的两种相反意见。</td>\n<td>先说发生了什么和谁受影响</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回看旧决定时，介绍围绕这些决定形成的两种对立判断。</td>\n<td>回头解释原来是什么情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>解释旧做法后，把赞成保留与反对保留的具体理由并列。</td>\n<td>再把原来的做法说清楚</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>交代改变旧做法的理由，同时提出针锋相对的反驳。</td>\n<td>接着说原来的做法为什么要改</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>写大型连锁企业时，围绕其主张呈现另一方的异议。</td>\n<td>先说一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>写其他卖家时，继续比较双方对同一裁决内容的不同解释。</td>\n<td>再说另一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后归纳前面一直展开的意见冲突，以及双方主要争论点。</td>\n<td>最后说各方分别有什么反应</td>\n</tr>\n</tbody></table>\n<p>A 不是完全没有碰到文章：第7段确实有人称赞，也有人说小企业没有受到良好照顾。不过，这些人处在不同的经营位置，作者主要用他们的反应补充说明谁受益、谁受损。前面的第2、3段在解释旧制度怎样收税，第4段引用肯尼迪说明改变它的理由，第5、6段追踪不同商家将承担什么；这些段落没有一直成对摆出针对同一要点的正反论据。A 中 with conflicting views on them 要求意见冲突跟着各个主要内容展开，实际文章只是结尾集中出现不同反应。用最后一段的一个特征来解释前面全部段落，会漏掉正文对规则和后果的连续交代。</p>\n<p><strong>把相互冲突的看法作为全文中心，能解释前六段为何主要在交代规则与影响吗？</strong></p>\n<p>不能。不同反应确实出现了，但它们是各种后果的一部分，不能代替全文主要的叙述方式。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[253,1913,1265,35],[315,1980,949,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"A"}},{"section":"40题","raw":"**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n### B. gives a factual account of it and discusses its consequences\n\n对它作事实性的介绍，并讨论它的后果\n\n#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果 B 对，作者就应先把决定是什么、相关旧安排是什么讲清，再追踪这项决定会给不同人带来什么。引用理由和各方反应都可以服务于这两件事。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先报道决定的具体内容，并简要交代最直接的受益者和付出者。 | 先说发生了什么和谁受影响 |\n| 第2段 | 回到旧决定，给读者理解新决定所需的事实背景。 | 回头解释原来是什么情况 |\n| 第3段 | 继续解释旧安排怎样运作，哪些人负责收税或缴税。 | 再把原来的做法说清楚 |\n| 第4段 | 引用作出改变的理由，说明原来的安排存在哪些问题。 | 接着说原来的做法为什么要改 |\n| 第5段 | 先写一种经营者将受到什么影响，以及为什么受益。 | 先说一种人会受到什么影响 |\n| 第6段 | 再写另一种经营者面临的义务如何变化。 | 再说另一种人会受到什么影响 |\n| 第7段 | 最后引用相关各方的反应，把不同后果呈现得更具体。 | 最后说各方分别有什么反应 |\n\nB 的 factual account 能接住第1段对周四决定的报道，也能接住第2、3段对旧决定和收税安排的解释。第4段引用肯尼迪，是让读者知道改变的理由，仍然围绕这项决定交代事实。discusses its consequences 又接住第5、6段：大型连锁企业被称为获胜者，原来不收税的州外卖家今后可能被要求代收。第7段的称赞、失利者和小企业声明继续说明这些后果。这里既不是只列一条新闻，也不是把作者自己的态度放到中心；作者把决定、背景与各方所受影响连着讲出来。B 的两个动作能够分别覆盖文章前半与后半，也能解释为什么结尾会引用不同群体的反应。\n\n**事实介绍加后果讨论，能同时解释开头、旧规则说明和后面的商家反应吗？**\n\n能。前面让人知道发生了什么、为何改变，后面让人知道谁会怎样，两部分与 B 的写法描述逐段吻合。\n\n**判断：B保留。**\n\n---","html":"<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<h3>B. gives a factual account of it and discusses its consequences</h3>\n<p>对它作事实性的介绍，并讨论它的后果</p>\n<h4>如果 B 是主旨，文章7段应该怎么写？</h4>\n<p>如果 B 对，作者就应先把决定是什么、相关旧安排是什么讲清，再追踪这项决定会给不同人带来什么。引用理由和各方反应都可以服务于这两件事。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先报道决定的具体内容，并简要交代最直接的受益者和付出者。</td>\n<td>先说发生了什么和谁受影响</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回到旧决定，给读者理解新决定所需的事实背景。</td>\n<td>回头解释原来是什么情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>继续解释旧安排怎样运作，哪些人负责收税或缴税。</td>\n<td>再把原来的做法说清楚</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>引用作出改变的理由，说明原来的安排存在哪些问题。</td>\n<td>接着说原来的做法为什么要改</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>先写一种经营者将受到什么影响，以及为什么受益。</td>\n<td>先说一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>再写另一种经营者面临的义务如何变化。</td>\n<td>再说另一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后引用相关各方的反应，把不同后果呈现得更具体。</td>\n<td>最后说各方分别有什么反应</td>\n</tr>\n</tbody></table>\n<p>B 的 factual account 能接住第1段对周四决定的报道，也能接住第2、3段对旧决定和收税安排的解释。第4段引用肯尼迪，是让读者知道改变的理由，仍然围绕这项决定交代事实。discusses its consequences 又接住第5、6段：大型连锁企业被称为获胜者，原来不收税的州外卖家今后可能被要求代收。第7段的称赞、失利者和小企业声明继续说明这些后果。这里既不是只列一条新闻，也不是把作者自己的态度放到中心；作者把决定、背景与各方所受影响连着讲出来。B 的两个动作能够分别覆盖文章前半与后半，也能解释为什么结尾会引用不同群体的反应。</p>\n<p><strong>事实介绍加后果讨论，能同时解释开头、旧规则说明和后面的商家反应吗？</strong></p>\n<p>能。前面让人知道发生了什么、为何改变，后面让人知道谁会怎样，两部分与 B 的写法描述逐段吻合。</p>\n<p><strong>判断：B保留。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[253,1913,1265,35],[315,2048,1010,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"B"}},{"section":"40题","raw":"**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n### C. cites some cases related to it and analyzes their implications\n\n引用一些与它有关的案件，并分析这些案件的含义\n\n#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果 C 对，文章应当把几个相关案件当成主要材料，逐个交代它们发生了什么，再解释各案对本次决定意味着什么。案件及其含义要承担全文推进。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 交代决定时带出几个将要分析的相关案件。 | 先说发生了什么和谁受影响 |\n| 第2段 | 回顾旧情况时，逐一说明过去几个案件的背景。 | 回头解释原来是什么情况 |\n| 第3段 | 通过案件中当事人的做法和具体争议，把旧安排说清楚。 | 再把原来的做法说清楚 |\n| 第4段 | 用相关案件的具体结果解释为什么需要改变原来的做法。 | 接着说原来的做法为什么要改 |\n| 第5段 | 选取涉及第一类人的具体案件，并分析它的含义。 | 先说一种人会受到什么影响 |\n| 第6段 | 再选取涉及另一类人的案件，继续作比较和解释。 | 再说另一种人会受到什么影响 |\n| 第7段 | 最后汇集人们对前面几个案件及其含义的反应。 | 最后说各方分别有什么反应 |\n\nC 中 cases 可以让我们想到第3段开头的 The cases，以及第2段的两项旧决定。但接下来文章没有讲这些案件各自是谁起诉谁、具体争议是什么，也没有逐案讨论含义，而是马上解释共同的实体存在规则与顾客缴税情况。第5、6段的连锁企业、州外卖家也是受新裁决影响的群体，不是正在逐个分析的诉讼案例。C 把背景中提到旧案件，变成了全文依靠相关案件展开分析，给案件的作用加大了一层。尤其尾段的商家反应，接的是新决定对它们的影响，并非前面各个案件的不同含义。\n\n**仅仅提到旧案件，就足以说明全文在引用多个案件并分析其含义吗？**\n\n不能。文章用旧决定交代收税背景，后半追踪的是新裁决的后果；它没有按多个案件逐一展开。\n\n**判断：C排除。**\n\n---","html":"<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<h3>C. cites some cases related to it and analyzes their implications</h3>\n<p>引用一些与它有关的案件，并分析这些案件的含义</p>\n<h4>如果 C 是主旨，文章7段应该怎么写？</h4>\n<p>如果 C 对，文章应当把几个相关案件当成主要材料，逐个交代它们发生了什么，再解释各案对本次决定意味着什么。案件及其含义要承担全文推进。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>交代决定时带出几个将要分析的相关案件。</td>\n<td>先说发生了什么和谁受影响</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回顾旧情况时，逐一说明过去几个案件的背景。</td>\n<td>回头解释原来是什么情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>通过案件中当事人的做法和具体争议，把旧安排说清楚。</td>\n<td>再把原来的做法说清楚</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用相关案件的具体结果解释为什么需要改变原来的做法。</td>\n<td>接着说原来的做法为什么要改</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>选取涉及第一类人的具体案件，并分析它的含义。</td>\n<td>先说一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>再选取涉及另一类人的案件，继续作比较和解释。</td>\n<td>再说另一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后汇集人们对前面几个案件及其含义的反应。</td>\n<td>最后说各方分别有什么反应</td>\n</tr>\n</tbody></table>\n<p>C 中 cases 可以让我们想到第3段开头的 The cases，以及第2段的两项旧决定。但接下来文章没有讲这些案件各自是谁起诉谁、具体争议是什么，也没有逐案讨论含义，而是马上解释共同的实体存在规则与顾客缴税情况。第5、6段的连锁企业、州外卖家也是受新裁决影响的群体，不是正在逐个分析的诉讼案例。C 把背景中提到旧案件，变成了全文依靠相关案件展开分析，给案件的作用加大了一层。尤其尾段的商家反应，接的是新决定对它们的影响，并非前面各个案件的不同含义。</p>\n<p><strong>仅仅提到旧案件，就足以说明全文在引用多个案件并分析其含义吗？</strong></p>\n<p>不能。文章用旧决定交代收税背景，后半追踪的是新裁决的后果；它没有按多个案件逐一展开。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[253,1913,1265,35],[315,2116,1027,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"C"}},{"section":"40题","raw":"**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n### D. describes the long and complicated process of its making\n\n描述它形成过程中漫长而复杂的过程\n\n#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果 D 对，全文应该沿着裁决形成的时间过程往下走，让读者看到这项决定经过了哪些漫长、复杂的环节。人物与旧规则都应放回这些形成环节中。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 宣布决定时先点出它耗时漫长、过程复杂。 | 先说发生了什么和谁受影响 |\n| 第2段 | 回到早期阶段，交代形成决定之前的起点。 | 回头解释原来是什么情况 |\n| 第3段 | 继续按先后顺序描述参与者在形成过程中的具体行动。 | 再把原来的做法说清楚 |\n| 第4段 | 说明过程中遇到的难题与转折，以及改变旧做法的关键一步。 | 接着说原来的做法为什么要改 |\n| 第5段 | 描写第一类人怎样参与决定的形成。 | 先说一种人会受到什么影响 |\n| 第6段 | 接着描写另一类人参与形成决定的后续环节。 | 再说另一种人会受到什么影响 |\n| 第7段 | 最后用各方反应为整个形成过程收尾。 | 最后说各方分别有什么反应 |\n\nD 的 process of its making 问的是决定怎样一步步形成，long and complicated 又要求文章突出耗时与复杂性。原文确实有 Thursday、decades-old、Until now 等时间词，但它们分别标记本次决定、旧决定和此前的收税状态，并没有串成审议程序。第4段介绍肯尼迪的理由，也只是说明旧规则存在的问题，没有展开漫长的讨论、修改或表决经过。更明显的是，第5、6段已经在说决定作出以后商家怎样收税，第7段又是相关人对结果的反应。这些段落都在走向决定之后，D 却要求它们围绕决定作出之前的形成过程展开。\n\n**文章后半追踪决定之后的影响，能归为描述决定形成过程吗？**\n\n不能。后果发生在决定作出之后，形成过程发生在决定作出之前。时间词的存在，不能把这两种内容合成一件事。\n\n**判断：D排除。**\n\n---","html":"<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<h3>D. describes the long and complicated process of its making</h3>\n<p>描述它形成过程中漫长而复杂的过程</p>\n<h4>如果 D 是主旨，文章7段应该怎么写？</h4>\n<p>如果 D 对，全文应该沿着裁决形成的时间过程往下走，让读者看到这项决定经过了哪些漫长、复杂的环节。人物与旧规则都应放回这些形成环节中。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>宣布决定时先点出它耗时漫长、过程复杂。</td>\n<td>先说发生了什么和谁受影响</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>回到早期阶段，交代形成决定之前的起点。</td>\n<td>回头解释原来是什么情况</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>继续按先后顺序描述参与者在形成过程中的具体行动。</td>\n<td>再把原来的做法说清楚</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>说明过程中遇到的难题与转折，以及改变旧做法的关键一步。</td>\n<td>接着说原来的做法为什么要改</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>描写第一类人怎样参与决定的形成。</td>\n<td>先说一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>接着描写另一类人参与形成决定的后续环节。</td>\n<td>再说另一种人会受到什么影响</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>最后用各方反应为整个形成过程收尾。</td>\n<td>最后说各方分别有什么反应</td>\n</tr>\n</tbody></table>\n<p>D 的 process of its making 问的是决定怎样一步步形成，long and complicated 又要求文章突出耗时与复杂性。原文确实有 Thursday、decades-old、Until now 等时间词，但它们分别标记本次决定、旧决定和此前的收税状态，并没有串成审议程序。第4段介绍肯尼迪的理由，也只是说明旧规则存在的问题，没有展开漫长的讨论、修改或表决经过。更明显的是，第5、6段已经在说决定作出以后商家怎样收税，第7段又是相关人对结果的反应。这些段落都在走向决定之后，D 却要求它们围绕决定作出之前的形成过程展开。</p>\n<p><strong>文章后半追踪决定之后的影响，能归为描述决定形成过程吗？</strong></p>\n<p>不能。后果发生在决定作出之后，形成过程发生在决定作出之前。时间词的存在，不能把这两种内容合成一件事。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[253,1913,1265,35],[315,2184,977,35]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"D"}},{"section":"40题","raw":"### 40题结论\n\n**40. B. gives a factual account of it and discusses its consequences**\n\n文章开头交代新决定，随后解释旧规则、旧规则的问题，再追踪大型连锁企业、州外卖家和小商家分别会怎样，末尾补上它们的反应。这些段落共同完成的是事实介绍与后果讨论。最后出现不同反应，并不等于整篇围绕各项内容展开正反争论；出现旧案件，也不等于全文在逐案分析。\n\n这句话就是本文后续做题的主旨底牌：\n\n**gives a factual account of it and discusses its consequences / 对这项决定作事实性的介绍，并讨论它的后果**\n\n---","html":"<h3>40题结论</h3>\n<p><strong>40. B. gives a factual account of it and discusses its consequences</strong></p>\n<p>文章开头交代新决定，随后解释旧规则、旧规则的问题，再追踪大型连锁企业、州外卖家和小商家分别会怎样，末尾补上它们的反应。这些段落共同完成的是事实介绍与后果讨论。最后出现不同反应，并不等于整篇围绕各项内容展开正反争论；出现旧案件，也不等于全文在逐案分析。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>gives a factual account of it and discusses its consequences / 对这项决定作事实性的介绍，并讨论它的后果</strong></p>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"40"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保40题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保40题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查36题：A还是C？\n\n第一遍留下：\n\n- A. put most online businesses in a **[xxx]**\n- C. make more online shoppers pay sales tax\n\n主旨底牌是：\n\n> **gives a factual account of it and discusses its consequences**\n\n也就是：\n\n> 对这项决定作事实性的介绍，并讨论它的后果\n\n我们先把题干和两个选项接起来。\n\nA 说，这项决定将使大多数网上企业处在一种 **[xxx]** 中；C 说，这项决定将使更多网上购物者缴纳销售税。第一遍，第1段已经直接写了购物者缴税，但也不能否认购物者的付款变化会影响企业。A 所说的企业状态又没读清，所以当时没有把 A 直接否掉。\n\n现在拿主旨来检查。\n\n40题确定的是事实介绍和后果讨论这种写法，不能代替具体事实，仍要回到刚才已经读过的内容。全文前面解释州为何难以收税，后面说明州外卖家可以被要求向顾客收税再交给州。这个展开反复补充的是同一变化：网上交易中，更多应缴的税将被收上来。C 所说的更多网上购物者缴税，既接住第1段直接交代的结果，也接住后面具体说明的征收安排。\n\n再看 A。全文确实谈企业受影响，但没有把大多数网上企业都写成一种相同处境：大型连锁企业被称为获胜者，只在网上经营的零售商尤其小商家则被放在失利的一边。A 中的状态仍然读不清，不能替它补成亏损，也不能替它补成受益；更不能仅凭 businesses 一词，就把不同商家的不同后果拼成对大多数网上企业的同一个断言。\n\n回到最开始的局部，more people、online purchases 与 pay sales tax 已经把 C 所需的人、购物方式和动作写全。后面各段的事实介绍又解释了这项安排怎样落实。C 因而同时得到开头原句和全文展开的明确支持；A 仍只与企业受影响这一宽泛话题相连，核心状态并未得到确认。选择 C，不需要先猜出 A 的最后一个词。\n\n> **36题选C。**\n\n---","html":"<h2>回查36题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. put most online businesses in a <strong>[xxx]</strong></li>\n<li>C. make more online shoppers pay sales tax</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>gives a factual account of it and discusses its consequences</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>对这项决定作事实性的介绍，并讨论它的后果</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A 说，这项决定将使大多数网上企业处在一种 <strong>[xxx]</strong> 中；C 说，这项决定将使更多网上购物者缴纳销售税。第一遍，第1段已经直接写了购物者缴税，但也不能否认购物者的付款变化会影响企业。A 所说的企业状态又没读清，所以当时没有把 A 直接否掉。</p>\n<p>现在拿主旨来检查。</p>\n<p>40题确定的是事实介绍和后果讨论这种写法，不能代替具体事实，仍要回到刚才已经读过的内容。全文前面解释州为何难以收税，后面说明州外卖家可以被要求向顾客收税再交给州。这个展开反复补充的是同一变化：网上交易中，更多应缴的税将被收上来。C 所说的更多网上购物者缴税，既接住第1段直接交代的结果，也接住后面具体说明的征收安排。</p>\n<p>再看 A。全文确实谈企业受影响，但没有把大多数网上企业都写成一种相同处境：大型连锁企业被称为获胜者，只在网上经营的零售商尤其小商家则被放在失利的一边。A 中的状态仍然读不清，不能替它补成亏损，也不能替它补成受益；更不能仅凭 businesses 一词，就把不同商家的不同后果拼成对大多数网上企业的同一个断言。</p>\n<p>回到最开始的局部，more people、online purchases 与 pay sales tax 已经把 C 所需的人、购物方式和动作写全。后面各段的事实介绍又解释了这项安排怎样落实。C 因而同时得到开头原句和全文展开的明确支持；A 仍只与企业受影响这一宽泛话题相连，核心状态并未得到确认。选择 C，不需要先猜出 A 的最后一个词。</p>\n<blockquote>\n<p><strong>36题选C。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review","qid":"36"}},{"section":"进阶回查","raw":"## 回查37题：C还是D？\n\n第一遍留下：\n\n- C. have led to the **[xxx]** of e-commerce\n- D. were considered unfavorable by states\n\n主旨底牌是：\n\n> **gives a factual account of it and discusses its consequences**\n\n也就是：\n\n> 对这项决定作事实性的介绍，并讨论它的后果\n\n我们先把题干和两个选项接起来。\n\nC 说旧决定导致电子商务出现某种 **[xxx]**；D 说旧决定被各州认为不利。第一遍我们读出了网上交易的收税安排，也读出了州因此损失钱、征税更困难。C 中电子商务与网上交易有关，但究竟发生什么变化没有读清，所以当时保留了 C；D 则有各州自己说出的损失作为依据。\n\n现在拿主旨来检查。\n\n40题确认作者在介绍这项决定的事实，并讨论它的后果。放回已经整理过的全文表，第2、3段不是突然转去介绍电子商务行业的发展史，而是在解释旧决定为何让州难以收到钱；后面的肯尼迪发言继续说州收入损失、公平竞争受到阻碍，新安排则允许州要求州外卖家代收。这些内容把旧规则的问题与新决定的后果接在一起。\n\nD 说各州认为旧决定不利，能解释为什么文章先记录州的损失，再说明旧制度怎样造成收税困难。它仍然说各州的看法，没有把肯尼迪或商家的意见算到消费者身上。第2段 states said 又说明，这项判断并非我们替州猜出的态度，而是州自己指出了损失。\n\nC 的 e-commerce 确实与网上交易相连，但全文对这个领域交代的是不同经营者的税款安排与不同影响，并没有确定 C 中那个未知结果。若直接选择 C，就要替没有读清的词决定行业究竟发生了什么，而这些具体税款事实还不能完成那一步。这里不把 C 的未知词判成某个相反意思，只比较哪一项已经得到明确说明。\n\n最后回到第一遍读过的第2、3段：州损失数十亿美元、征税更难，顾客却多数不知欠税、很少缴纳，受不利影响的主体是州。D 同时接住这两段的事实，以及全文解释改变旧安排原因的展开，所以选择 D。\n\n> **37题选D。**\n\n---","html":"<h2>回查37题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>C. have led to the <strong>[xxx]</strong> of e-commerce</li>\n<li>D. were considered unfavorable by states</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>gives a factual account of it and discusses its consequences</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>对这项决定作事实性的介绍，并讨论它的后果</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>C 说旧决定导致电子商务出现某种 <strong>[xxx]</strong>；D 说旧决定被各州认为不利。第一遍我们读出了网上交易的收税安排，也读出了州因此损失钱、征税更困难。C 中电子商务与网上交易有关，但究竟发生什么变化没有读清，所以当时保留了 C；D 则有各州自己说出的损失作为依据。</p>\n<p>现在拿主旨来检查。</p>\n<p>40题确认作者在介绍这项决定的事实，并讨论它的后果。放回已经整理过的全文表，第2、3段不是突然转去介绍电子商务行业的发展史，而是在解释旧决定为何让州难以收到钱；后面的肯尼迪发言继续说州收入损失、公平竞争受到阻碍，新安排则允许州要求州外卖家代收。这些内容把旧规则的问题与新决定的后果接在一起。</p>\n<p>D 说各州认为旧决定不利，能解释为什么文章先记录州的损失，再说明旧制度怎样造成收税困难。它仍然说各州的看法，没有把肯尼迪或商家的意见算到消费者身上。第2段 states said 又说明，这项判断并非我们替州猜出的态度，而是州自己指出了损失。</p>\n<p>C 的 e-commerce 确实与网上交易相连，但全文对这个领域交代的是不同经营者的税款安排与不同影响，并没有确定 C 中那个未知结果。若直接选择 C，就要替没有读清的词决定行业究竟发生了什么，而这些具体税款事实还不能完成那一步。这里不把 C 的未知词判成某个相反意思，只比较哪一项已经得到明确说明。</p>\n<p>最后回到第一遍读过的第2、3段：州损失数十亿美元、征税更难，顾客却多数不知欠税、很少缴纳，受不利影响的主体是州。D 同时接住这两段的事实，以及全文解释改变旧安排原因的展开，所以选择 D。</p>\n<blockquote>\n<p><strong>37题选D。</strong></p>\n</blockquote>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review","qid":"37"}},{"section":"进阶回查","raw":"## 回查38题：A还是B？\n\n第一遍留下：\n\n- A. **[xxx]** economic development\n- B. harmed fair market competition\n\n主旨底牌是：\n\n> **gives a factual account of it and discusses its consequences**\n\n也就是：\n\n> 对这项决定作事实性的介绍，并讨论它的后果\n\n我们先把题干和两个选项接起来。\n\nA 说这条实体存在规则对经济发展作出 **[xxx]**；B 说它损害公平市场竞争。第一遍，economic development 让我们想到 economic reality，加上州的长期目标受到限制，A 看起来与这一段有经济层面的联系。但 A 的动作没有读清，州的长期目标也没有读清，因此只能保留它。B 则能直接接上 prevented 与公平竞争。\n\n现在拿主旨来检查。\n\n40题让我们把文章看成对决定的事实介绍和后果讨论。全文已经读过的具体后果，是不同商家在销售税上的待遇发生变化：大型连锁企业以前通常已收税，某些州外卖家以前能够不收，新安排使州可以要求它们代收。文末还有零售业团体称赞比赛场地变得公平。这些事实与肯尼迪所说的竞争条件受影响，谈的是同一件具体事情。\n\nB 的 harmed fair market competition 能把这几处接起来。旧规则使不同经营者面对不同收税安排，肯尼迪说它阻止在公平条件下竞争；改变规则以后，又有人称赞竞争条件变得公平。选择 B 不必把 market 后面的未知名词补出，也不必把州的长期目标译成某个具体词。\n\n再看 A。economic reality 是经济现实，economic development 是经济发展，前者出现并不能替后者确定动作。全文也没有把讨论扩展成经济发展总体被怎样影响的结论，而是反复具体说明收税义务、州收入和竞争条件。A 的未知动作依然不能由这些文字读出；我们不能因为两边都有 economic，就把一个关于现实的句子改成关于发展的完整判断。\n\n回到第一遍读过的第4段，has prevented 后面直接接 competing on an even playing field，B 已经能据此成立；全文对不同商家待遇与公平反应的介绍，又把这一后果展开得更清楚。A 仍需要补出没有读清的动作并增加经济发展的关系。因此选择 B，而不替 A 的未知词下定义。\n\n> **38题选B。**\n\n---","html":"<h2>回查38题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. <strong>[xxx]</strong> economic development</li>\n<li>B. harmed fair market competition</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>gives a factual account of it and discusses its consequences</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>对这项决定作事实性的介绍，并讨论它的后果</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A 说这条实体存在规则对经济发展作出 <strong>[xxx]</strong>；B 说它损害公平市场竞争。第一遍，economic development 让我们想到 economic reality，加上州的长期目标受到限制，A 看起来与这一段有经济层面的联系。但 A 的动作没有读清，州的长期目标也没有读清，因此只能保留它。B 则能直接接上 prevented 与公平竞争。</p>\n<p>现在拿主旨来检查。</p>\n<p>40题让我们把文章看成对决定的事实介绍和后果讨论。全文已经读过的具体后果，是不同商家在销售税上的待遇发生变化：大型连锁企业以前通常已收税，某些州外卖家以前能够不收，新安排使州可以要求它们代收。文末还有零售业团体称赞比赛场地变得公平。这些事实与肯尼迪所说的竞争条件受影响，谈的是同一件具体事情。</p>\n<p>B 的 harmed fair market competition 能把这几处接起来。旧规则使不同经营者面对不同收税安排，肯尼迪说它阻止在公平条件下竞争；改变规则以后，又有人称赞竞争条件变得公平。选择 B 不必把 market 后面的未知名词补出，也不必把州的长期目标译成某个具体词。</p>\n<p>再看 A。economic reality 是经济现实，economic development 是经济发展，前者出现并不能替后者确定动作。全文也没有把讨论扩展成经济发展总体被怎样影响的结论，而是反复具体说明收税义务、州收入和竞争条件。A 的未知动作依然不能由这些文字读出；我们不能因为两边都有
