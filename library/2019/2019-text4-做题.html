<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 36题题干\n\n**The Supreme Court decision Thursday will ______.**\n\n> 最高法院周四的决定将会带来什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>36题题干</h2>\n<p><strong>The Supreme Court decision Thursday will ______.</strong></p>\n<blockquote>\n<p>最高法院周四的决定将会带来什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,214,896,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"36"}},{"section":"先读题干","raw":"## 37题题干\n\n**It can be learned from Paragraphs 2 and 3 that the overruled decisions ______.**\n\n> 从第2、3段可以知道，被推翻的那些决定有什么情况？\n\n题型：**局部推断题**。\n\n---","html":"<h2>37题题干</h2>\n<p><strong>It can be learned from Paragraphs 2 and 3 that the overruled decisions ______.</strong></p>\n<blockquote>\n<p>从第2、3段可以知道，被推翻的那些决定有什么情况？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,622,1311,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"37"}},{"section":"先读题干","raw":"## 38题题干\n\n**According to Justice Anthony Kennedy, the physical presence rule has ______.**\n\n> 根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>38题题干</h2>\n<p><strong>According to Justice Anthony Kennedy, the physical presence rule has ______.</strong></p>\n<blockquote>\n<p>根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,1030,1321,35],[331,1098,192,27]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"38"}},{"section":"先读题干","raw":"## 39题题干\n\n**Who are most likely to welcome the Supreme Court ruling?**\n\n> 谁最有可能欢迎最高法院的这项裁决？\n\n题型：**具体细节题**。\n\n---","html":"<h2>39题题干</h2>\n<p><strong>Who are most likely to welcome the Supreme Court ruling?</strong></p>\n<blockquote>\n<p>谁最有可能欢迎最高法院的这项裁决？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,1505,1033,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"39"}},{"section":"先读题干","raw":"## 40题题干\n\n**In dealing with the Supreme Court decision Thursday, the author ______.**\n\n> 在处理最高法院周四这项决定时，作者采用了怎样的写法？\n\n题型：**全文写作方式题**。\n\n---","html":"<h2>40题题干</h2>\n<p><strong>In dealing with the Supreme Court decision Thursday, the author ______.</strong></p>\n<blockquote>\n<p>在处理最高法院周四这项决定时，作者采用了怎样的写法？</p>\n</blockquote>\n<p>题型：<strong>全文写作方式题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[253,1913,1265,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"40"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but, since, because, though |\n| 态度词 / 评价词 | 先抓个大概好坏 | win, difficult, victory, losers |\n| 动作词 | 先看谁做了什么 | pay, collect, pass, praised |\n| 结果词 | 看最后出了什么事 | losses, victory, losers |\n| 重复主题词 | 大概知道老在说什么 | states, sales tax, decisions, sellers |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>but, since, because, though</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>win, difficult, victory, losers</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>pay, collect, pass, praised</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>losses, victory, losers</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>states, sales tax, decisions, sellers</td>\n</tr>\n</tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.</p>\n</div></div>","articleRects":[[308,333,1240,36],[228,385,1319,35],[229,436,1053,36]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true},"contextRaw":""},{"section":"读文章","raw":"States will be able  / to force more people  / to pay sales tax  / when they make online purchases  / under a Supreme Court decision Thursday  / that will leave shoppers with lighter wallets  / but is a big financial win for states.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>States will be able  / to force more people  / to pay sales tax  / when they make online purchases  / under a Supreme Court decision Thursday  / that will leave shoppers with lighter wallets  / but is a big financial win for states.</p>\n</div></div>","articleRects":[[308,333,1240,36],[228,385,1319,35],[229,436,1053,36]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true},"contextRaw":""},{"section":"读文章","raw":"各州将能够 / to force 更多人 / to 缴纳销售税 / when they make 网上购物 / under a Supreme Court decision 周四 / that wi crollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做36至39题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做36至39题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"36题","raw":"## 36题\n\n> The Supreme Court decision Thursday will ______.  \n> 最高法院周四的决定将会带来什么？\n\n题干点名 Supreme Court decision Thursday，开头就出现这项周四的决定。直接回到第1段，从开头读到结尾。\n\n> 原文参考：\n>\n> States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.\n>\n> 开始精读：\n>\n> States will be able  / to force more people  / to pay sales tax  / when they make online purchases  / under a Supreme Court decision Thursday  / that will leave shoppers with lighter wallets  / but is a big financial win for states.\n>\n> 各州将能够 / 强制更多人 / 缴纳销售税 / 当他们进行网上购物时 / 根据最高法院在周四作出的一项决定 / 它将使购物者的钱包更轻 / 但对于各州是一次大的财政胜利。\n\n第1段把这项决定、各州、购物者连在一起：各州能让更多人在网上购物时缴税，购物者的钱包变轻，各州得到财政上的好处。空格要接在 will 后面，问这项决定将带来什么。","html":"<h2>36题</h2>\n<blockquote>\n<p>The Supreme Court decision Thursday will ______.<br>最高法院周四的决定将会带来什么？</p>\n</blockquote>\n<p>题干点名 Supreme Court decision Thursday，开头就出现这项周四的决定。直接回到第1段，从开头读到结尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.</p>\n<p>开始精读：</p>\n<p>States will be able  / to force more people  / to pay sales tax  / when they make online purchases  / under a Supreme Court decision Thursday  / that will leave shoppers with lighter wallets  / but is a big financial win for states.</p>\n<p>各州将能够 / 强制更多人 / 缴纳销售税 / 当他们进行网上购物时 / 根据最高法院在周四作出的一项决定 / 它将使购物者的钱包更轻 / 但对于各州是一次大的财政胜利。</p>\n</blockquote>\n<p>第1段把这项决定、各州、购物者连在一起：各州能让更多人在网上购物时缴税，购物者的钱包变轻，各州得到财政上的好处。空格要接在 will 后面，问这项决定将带来什么。</p>\n","articleRects":[[308,333,1240,36],[228,385,1319,35],[229,436,1053,36]],"questionRects":[[255,214,896,36]],"scrollTarget":"auto","meta":{"kind":"question","qid":"36"}},{"section":"36题","raw":"### A. put most online businesses in a **[xxx]**\n\n> 使大多数网上企业处在一种 **[xxx]** 中\n\n把A接回题干，它说的是：最高法院周四的决定将使大多数网上企业处在一种 **[xxx]** 状态。\n\nA 的 most online businesses 在说网上交易中的企业，原文 more people 在说同一交易中的购物者，两边都涉及网上交易受这项决定影响，因此回看第1段中谁需要缴税的句子。\n\n> States will be able to force more people to pay sales tax when they make online purchases\n\n原文的 more people 是更多需要缴税的购物者。A 中 most online businesses 则是大多数网上企业，主体已经不同。不过，顾客需要缴税也可能影响卖方，A 后面表示企业处境的词又暂时看不懂，单凭这一句还不能确定它说的究竟是哪种影响。我们现在能读出的只是：买东西的人将有更多人缴税；大多数网上企业会处在什么状态，还没有说清。不能把购物者的钱包变轻直接翻成企业亏损，也不能把 A 中不认识的词当成某种好处。\n\n**只知道更多购物者需要缴税，能确定大多数网上企业所处的 [xxx] 状态吗？**\n\n不能。购物者缴税和企业受到影响可能同时发生，但两者不是同一句话。A 的核心状态还没有读清，现在不能确定它与裁决后果冲突。\n\n**第一轮判断：A保留。**","html":"<h3>A. put most online businesses in a <strong>[xxx]</strong></h3>\n<blockquote>\n<p>使大多数网上企业处在一种 <strong>[xxx]</strong> 中</p>\n</blockquote>\n<p>把A接回题干，它说的是：最高法院周四的决定将使大多数网上企业处在一种 <strong>[xxx]</strong> 状态。</p>\n<p>A 的 most online businesses 在说网上交易中的企业，原文 more people 在说同一交易中的购物者，两边都涉及网上交易受这项决定影响，因此回看第1段中谁需要缴税的句子。</p>\n<blockquote>\n<p>States will be able to force more people to pay sales tax when they make online purchases</p>\n</blockquote>\n<p>原文的 more people 是更多需要缴税的购物者。A 中 most online businesses 则是大多数网上企业，主体已经不同。不过，顾客需要缴税也可能影响卖方，A 后面表示企业处境的词又暂时看不懂，单凭这一句还不能确定它说的究竟是哪种影响。我们现在能读出的只是：买东西的人将有更多人缴税；大多数网上企业会处在什么状态，还没有说清。不能把购物者的钱包变轻直接翻成企业亏损，也不能把 A 中不认识的词当成某种好处。</p>\n<p><strong>只知道更多购物者需要缴税，能确定大多数网上企业所处的 [xxx] 状态吗？</strong></p>\n<p>不能。购物者缴税和企业受到影响可能同时发生，但两者不是同一句话。A 的核心状态还没有读清，现在不能确定它与裁决后果冲突。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[308,333,1240,36],[228,385,1319,35],[229,436,1053,36]],"questionRects":[[255,214,896,36],[315,282,708,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A 的 most online businesses 在说网上交易中的企业，原文 more people 在说同一交易中的购物者，两边都涉及网上交易受这项决定影响，因此回看第1段中谁需要缴税的句子。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"more people","visibleOptionAnchor":"most online businesses"}}}},{"section":"36题","raw":"### B. force some states to cut sales tax\n\n> 迫使一些州削减销售税\n\n把B接回题干，它说的是：最高法院周四的决定将迫使一些州削减销售税。\n\nB 的 cut sales tax 对应原文 pay sales tax，双方都在说销售税，但一个是州削减，另一个是人们缴纳，所以回看第1段中各州得到什么权力的句子。\n\n> States will be able to force more people to pay sales tax when they make online purchases\n\n原文 pay sales tax 的执行者是 more people，各州得到的是强制更多人缴税的能力。B 的 cut sales tax 却让各州成为被迫行动的一方，而且行动是削减销售税。两边虽然都提到税，谁被要求做事和税款怎样变化都不一样：原文把更多购物者纳入缴税范围，B 却写各州被要求减少税收。\n\n**这里被迫做事的是缴税的人，还是要削减销售税的州？**\n\n前者。原文是各州能够让更多人缴税，B 却把各州改成被迫削减销售税的一方，动作对象和方向都变了。\n\n**第一轮判断：B排除。**","html":"<h3>B. force some states to cut sales tax</h3>\n<blockquote>\n<p>迫使一些州削减销售税</p>\n</blockquote>\n<p>把B接回题干，它说的是：最高法院周四的决定将迫使一些州削减销售税。</p>\n<p>B 的 cut sales tax 对应原文 pay sales tax，双方都在说销售税，但一个是州削减，另一个是人们缴纳，所以回看第1段中各州得到什么权力的句子。</p>\n<blockquote>\n<p>States will be able to force more people to pay sales tax when they make online purchases</p>\n</blockquote>\n<p>原文 pay sales tax 的执行者是 more people，各州得到的是强制更多人缴税的能力。B 的 cut sales tax 却让各州成为被迫行动的一方，而且行动是削减销售税。两边虽然都提到税，谁被要求做事和税款怎样变化都不一样：原文把更多购物者纳入缴税范围，B 却写各州被要求减少税收。</p>\n<p><strong>这里被迫做事的是缴税的人，还是要削减销售税的州？</strong></p>\n<p>前者。原文是各州能够让更多人缴税，B 却把各州改成被迫削减销售税的一方，动作对象和方向都变了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[308,333,1240,36],[228,385,1319,35],[229,436,1053,36]],"questionRects":[[255,214,896,36],[315,350,585,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B 的 cut sales tax 对应原文 pay sales tax，双方都在说销售税，但一个是州削减，另一个是人们缴纳，所以回看第1段中各州得到什么权力的句子。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","action_direction"],"visibleSourceAnchor":"pay sales tax","visibleOptionAnchor":"cut sales tax"}}}},{"section":"36题","raw":"### C. make more online shoppers pay sales tax\n\n> 使更多网上购物者缴纳销售税\n\n把C接回题干，它说的是：最高法院周四的决定将使更多网上购物者缴纳销售税。\n\nC 的 online shoppers 是在网上购物的人，对应原文 more people 后面的 when they make online purchases，所以回看第1段中这些人要做什么的句子。\n\n> States will be able to force more people to pay sales tax when they make online purchases\n\n原文 more people 不是随便一种人，后面的网上购物条件把他们限定成购物者。C 的 online shoppers 把这个条件收进一个名词里。原文的 force 与 C 的 make 都把动作落到这些人身上，动作又同样是 pay sales tax。因此 C 既保留了人数增加，也保留了网上购物和缴销售税这两个限定，没有把缴税者换成企业或州。\n\n**C 是否把原文中的人、网上购物条件和缴税动作都接上了？**\n\n能。更多人在网上购物时被要求缴销售税，正是更多网上购物者缴纳销售税，这个结果在第1段已经写明。\n\n**第一轮判断：C保留。**","html":"<h3>C. make more online shoppers pay sales tax</h3>\n<blockquote>\n<p>使更多网上购物者缴纳销售税</p>\n</blockquote>\n<p>把C接回题干，它说的是：最高法院周四的决定将使更多网上购物者缴纳销售税。</p>\n<p>C 的 online shoppers 是在网上购物的人，对应原文 more people 后面的 when they make online purchases，所以回看第1段中这些人要做什么的句子。</p>\n<blockquote>\n<p>States will be able to force more people to pay sales tax when they make online purchases</p>\n</blockquote>\n<p>原文 more people 不是随便一种人，后面的网上购物条件把他们限定成购物者。C 的 online shoppers 把这个条件收进一个名词里。原文的 force 与 C 的 make 都把动作落到这些人身上，动作又同样是 pay sales tax。因此 C 既保留了人数增加，也保留了网上购物和缴销售税这两个限定，没有把缴税者换成企业或州。</p>\n<p><strong>C 是否把原文中的人、网上购物条件和缴税动作都接上了？</strong></p>\n<p>能。更多人在网上购物时被要求缴销售税，正是更多网上购物者缴纳销售税，这个结果在第1段已经写明。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[308,333,1240,36],[228,385,1319,35],[229,436,1053,36]],"questionRects":[[255,214,896,36],[315,418,714,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C 的 online shoppers 是在网上购物的人，对应原文 more people 后面的 when they make online purchases，所以回看第1段中这些人要做什么的句子。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"more people","visibleOptionAnchor":"online shoppers"}}}},{"section":"36题","raw":"### D. better businesses’ relations with states\n\n> 改善企业与各州的关系\n\n把D接回题干，它说的是：最高法院周四的决定将改善企业与各州之间的关系。\n\nD 的 relations with states 让我们回看原文 financial win for states，双方都把各州放在结果一端；但关系改善和财政收益是不同的结果，因此回看第1段结尾，比较这里说的是什么好处。\n\n> that will leave shoppers with lighter wallets but is a big financial win for states.\n\n原文 financial win for states 指各州在钱上获益，同一句把另一端写成购物者的钱包变轻。D 的 relations with states 却把各州与企业之间相处得更好当成结果。原文建立的是购物者付款、各州得款这条关系，D 建立的是企业与各州之间关系改善。这里的 win 有 financial 明确限定，说的是钱上的得失，不是企业对各州的态度。\n\n**各州获得财政上的好处，就等于企业与各州的关系改善吗？**\n\n不等于。financial 限定的是钱，而 relations 说的是双方的关系。第1段交代的受影响一方还是购物者，不能用各州收入增加替换成企业与各州关系变好。\n\n**第一轮判断：D排除。**","html":"<h3>D. better businesses’ relations with states</h3>\n<blockquote>\n<p>改善企业与各州的关系</p>\n</blockquote>\n<p>把D接回题干，它说的是：最高法院周四的决定将改善企业与各州之间的关系。</p>\n<p>D 的 relations with states 让我们回看原文 financial win for states，双方都把各州放在结果一端；但关系改善和财政收益是不同的结果，因此回看第1段结尾，比较这里说的是什么好处。</p>\n<blockquote>\n<p>that will leave shoppers with lighter wallets but is a big financial win for states.</p>\n</blockquote>\n<p>原文 financial win for states 指各州在钱上获益，同一句把另一端写成购物者的钱包变轻。D 的 relations with states 却把各州与企业之间相处得更好当成结果。原文建立的是购物者付款、各州得款这条关系，D 建立的是企业与各州之间关系改善。这里的 win 有 financial 明确限定，说的是钱上的得失，不是企业对各州的态度。</p>\n<p><strong>各州获得财政上的好处，就等于企业与各州的关系改善吗？</strong></p>\n<p>不等于。financial 限定的是钱，而 relations 说的是双方的关系。第1段交代的受影响一方还是购物者，不能用各州收入增加替换成企业与各州关系变好。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[308,333,1240,36],[228,385,1319,35],[229,436,1053,36]],"questionRects":[[255,214,896,36],[315,486,663,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D 的 relations with states 让我们回看原文 financial win for states，双方都把各州放在结果一端；但关系改善和财政收益是不同的结果，因此回看第1段结尾，比较这里说的是什么好处。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction"],"visibleSourceAnchor":"financial win for states","visibleOptionAnchor":"relations with states"}}}},{"section":"36题","raw":"### 36题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C保留；\n- D排除。\n\nC 已经接上购物者缴税这件事；A 的企业状态还没有读清，目前留下 A 和 C。","html":"<h3>36题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C 已经接上购物者缴税这件事；A 的企业状态还没有读清，目前留下 A 和 C。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"36"}},{"section":"37题","raw":"## 37题\n\n> It can be learned from Paragraphs 2 and 3 that the overruled decisions ______.  \n> 从第2、3段可以知道，被推翻的那些决定有什么情况？\n\n题干直接给出 Paragraphs 2 and 3。我们把第2、3段都从开头读到结尾，留意旧决定分别给州、企业和顾客带来什么。\n\n> 原文参考：\n>\n> The Supreme Court’s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost **[xxx]** annually. The decisions made it more difficult for states to collect sales tax on certain online purchases.\n>\n> 开始精读：\n>\n> The Supreme Court’s opinion Thursday  / overruled a pair of decades-old decisions  / that states said cost them billions of dollars  / in lost **[xxx]** annually.  / The decisions made it more difficult  / for states to collect sales tax  / on certain online purchases.\n>\n> 最高法院周四的意见 / 推翻了两项几十年前的决定 / 各州说这些决定使它们损失了数十亿美元 / 在每年失去的 **[xxx]** 方面。 / 这些决定使事情更加困难 / 对各州去征收销售税来说 / 在某些网上购物上。\n\n> 原文参考：\n>\n> The cases the court **[xxx]** said that if a business was shipping a customer’s purchase to a state where the business didn’t have a physical presence such as a **[xxx]** or office, the business didn’t have to collect sales tax for the state. Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.\n>\n> 开始精读：\n>\n> The cases the court **[xxx]**  / said that  / if a business was shipping a customer’s purchase  / to a state  / where the business didn’t have a physical presence  / such as a **[xxx]** or office,  / the business didn’t have to collect sales tax for the state.  / Customers were generally responsible  / for paying the sales tax to the state themselves  / if they weren’t charged it,  / but most didn’t realize they owed it  / and few paid.\n>\n> 那些案件，法院 **[xxx]** 的 / 说的是 / 如果一家企业正在寄送一个顾客购买的东西 / 到一个州 / 而这家企业在那里没有实体存在 / 例如一家 **[xxx]** 或办公室， / 这家企业就不必为这个州征收销售税。 / 顾客通常负有责任 / 自己向州缴纳销售税 / 如果他们没有被收取这笔税， / 但大多数人没有意识到他们欠这笔税 / 而且很少有人缴纳。\n\n第2段说各州损失钱，征税也更困难。第3段解释旧安排：不在当地有实体的企业可以不代收，顾客原本仍有缴税责任，但多数人不知欠税，很少人实际缴纳。题干问被推翻的旧决定，要把这几方分清。","html":"<h2>37题</h2>\n<blockquote>\n<p>It can be learned from Paragraphs 2 and 3 that the overruled decisions ______.<br>从第2、3段可以知道，被推翻的那些决定有什么情况？</p>\n</blockquote>\n<p>题干直接给出 Paragraphs 2 and 3。我们把第2、3段都从开头读到结尾，留意旧决定分别给州、企业和顾客带来什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The Supreme Court’s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost <strong>[xxx]</strong> annually. The decisions made it more difficult for states to collect sales tax on certain online purchases.</p>\n<p>开始精读：</p>\n<p>The Supreme Court’s opinion Thursday  / overruled a pair of decades-old decisions  / that states said cost them billions of dollars  / in lost <strong>[xxx]</strong> annually.  / The decisions made it more difficult  / for states to collect sales tax  / on certain online purchases.</p>\n<p>最高法院周四的意见 / 推翻了两项几十年前的决定 / 各州说这些决定使它们损失了数十亿美元 / 在每年失去的 <strong>[xxx]</strong> 方面。 / 这些决定使事情更加困难 / 对各州去征收销售税来说 / 在某些网上购物上。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>The cases the court <strong>[xxx]</strong> said that if a business was shipping a customer’s purchase to a state where the business didn’t have a physical presence such as a <strong>[xxx]</strong> or office, the business didn’t have to collect sales tax for the state. Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.</p>\n<p>开始精读：</p>\n<p>The cases the court <strong>[xxx]</strong>  / said that  / if a business was shipping a customer’s purchase  / to a state  / where the business didn’t have a physical presence  / such as a <strong>[xxx]</strong> or office,  / the business didn’t have to collect sales tax for the state.  / Customers were generally responsible  / for paying the sales tax to the state themselves  / if they weren’t charged it,  / but most didn’t realize they owed it  / and few paid.</p>\n<p>那些案件，法院 <strong>[xxx]</strong> 的 / 说的是 / 如果一家企业正在寄送一个顾客购买的东西 / 到一个州 / 而这家企业在那里没有实体存在 / 例如一家 <strong>[xxx]</strong> 或办公室， / 这家企业就不必为这个州征收销售税。 / 顾客通常负有责任 / 自己向州缴纳销售税 / 如果他们没有被收取这笔税， / 但大多数人没有意识到他们欠这笔税 / 而且很少有人缴纳。</p>\n</blockquote>\n<p>第2段说各州损失钱，征税也更困难。第3段解释旧安排：不在当地有实体的企业可以不代收，顾客原本仍有缴税责任，但多数人不知欠税，很少人实际缴纳。题干问被推翻的旧决定，要把这几方分清。</p>\n","articleRects":[[307,488,1241,35],[228,539,1309,35],[228,590,1320,28],[227,642,161,35],[307,693,1241,36],[227,745,1322,35],[228,796,1311,34],[228,848,1320,35],[228,899,1203,35]],"questionRects":[[255,622,1311,35]],"scrollTarget":"auto","meta":{"kind":"question","qid":"37"}},{"section":"37题","raw":"### A. were widely criticized by online purchasers\n\n> 受到网上购买者的广泛批评\n\n把A接回题干，它说的是：被推翻的那些决定曾受到网上购买者的广泛批评。\n\nA 的 online purchasers 对应第3段的 Customers，都是购买东西的人；但 criticized 还要求他们表达批评，所以回看第3段末句写顾客知道什么、实际做什么。再看第2段 states said，分清提出损失的是谁。\n\n> Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.\n\n> states said cost them billions of dollars\n\n原文把 Customers 写成大多不知道自己欠税、也很少缴税的人。第2段 states said 的发言者则是各州，它们说旧决定使自己损失了钱。A 把 online purchasers 放到 criticized 的位置上，让顾客成为广泛表达不满的一方。顾客不知道欠税与州知道自己少收了钱，是两个主体的两种情况；不能把各州的抱怨搬到顾客身上。\n\n**这两段中说旧决定使自己损失钱的，是购买者还是各州？**\n\n后者。顾客这一端写的是不知欠税、很少付款，提出损失的是州。A 将说话的人换成了网上购买者。\n\n**第一轮判断：A排除。**","html":"<h3>A. were widely criticized by online purchasers</h3>\n<blockquote>\n<p>受到网上购买者的广泛批评</p>\n</blockquote>\n<p>把A接回题干，它说的是：被推翻的那些决定曾受到网上购买者的广泛批评。</p>\n<p>A 的 online purchasers 对应第3段的 Customers，都是购买东西的人；但 criticized 还要求他们表达批评，所以回看第3段末句写顾客知道什么、实际做什么。再看第2段 states said，分清提出损失的是谁。</p>\n<blockquote>\n<p>Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.</p>\n</blockquote>\n<blockquote>\n<p>states said cost them billions of dollars</p>\n</blockquote>\n<p>原文把 Customers 写成大多不知道自己欠税、也很少缴税的人。第2段 states said 的发言者则是各州，它们说旧决定使自己损失了钱。A 把 online purchasers 放到 criticized 的位置上，让顾客成为广泛表达不满的一方。顾客不知道欠税与州知道自己少收了钱，是两个主体的两种情况；不能把各州的抱怨搬到顾客身上。</p>\n<p><strong>这两段中说旧决定使自己损失钱的，是购买者还是各州？</strong></p>\n<p>后者。顾客这一端写的是不知欠税、很少付款，提出损失的是州。A 将说话的人换成了网上购买者。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[307,488,1241,35],[228,539,1309,35],[228,590,1320,28],[227,642,161,35],[307,693,1241,36],[227,745,1322,35],[228,796,1311,34],[228,848,1320,35],[228,899,1203,35]],"questionRects":[[255,622,1311,35],[315,690,753,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"37","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A 的 online purchasers 对应第3段的 Customers，都是购买东西的人；但 criticized 还要求他们表达批评，所以回看第3段末句写顾客知道什么、实际做什么。再看第2段 states said，分清提出损失的是谁。"],"evidenceParagraphPids":[1,2],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject"],"visibleSourceAnchor":"Customers","visibleOptionAnchor":"online purchasers"}}}},{"section":"37题","raw":"### B. have cost consumers a lot over the years\n\n> 多年来让消费者损失了很多钱\n\n把B接回题干，它说的是：被推翻的那些决定多年来使消费者损失了大量金钱。\n\nB 的 cost consumers 要找损失落在谁身上，正好对应第2段 states said cost them；第3段 few paid 又写顾客实际上很少缴税，因此要把两处放在一起，分清州的损失和消费者的付款。\n\n> states said cost them billions of dollars\n\n> but most didn’t realize they owed it and few paid.\n\nstates said cost them 中 them 接的是 states，损失数十亿美元的是各州。B 的 cost consumers 把承受损失的人改成消费者。第3段又说 few paid，即真正缴税的顾客很少，这与让消费者付出很多钱的说法也不同。不能只看到 cost 和 billions of dollars 就留下 B；把损失归给谁，才是这一句的要点。\n\n**原文的数十亿美元损失能转成消费者损失很多钱吗？**\n\n不能。损失属于州，顾客一端反而是很少缴税。B 保留了损失很大的说法，却换掉了承受损失的主体。\n\n**第一轮判断：B排除。**","html":"<h3>B. have cost consumers a lot over the years</h3>\n<blockquote>\n<p>多年来让消费者损失了很多钱</p>\n</blockquote>\n<p>把B接回题干，它说的是：被推翻的那些决定多年来使消费者损失了大量金钱。</p>\n<p>B 的 cost consumers 要找损失落在谁身上，正好对应第2段 states said cost them；第3段 few paid 又写顾客实际上很少缴税，因此要把两处放在一起，分清州的损失和消费者的付款。</p>\n<blockquote>\n<p>states said cost them billions of dollars</p>\n</blockquote>\n<blockquote>\n<p>but most didn’t realize they owed it and few paid.</p>\n</blockquote>\n<p>states said cost them 中 them 接的是 states，损失数十亿美元的是各州。B 的 cost consumers 把承受损失的人改成消费者。第3段又说 few paid，即真正缴税的顾客很少，这与让消费者付出很多钱的说法也不同。不能只看到 cost 和 billions of dollars 就留下 B；把损失归给谁，才是这一句的要点。</p>\n<p><strong>原文的数十亿美元损失能转成消费者损失很多钱吗？</strong></p>\n<p>不能。损失属于州，顾客一端反而是很少缴税。B 保留了损失很大的说法，却换掉了承受损失的主体。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n", quote>\n<p>导致了电子商务的 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：被推翻的那些决定导致了电子商务的某种 <strong>[xxx]</strong>。</p>\n<p>C 的 e-commerce 是电子商务，对应第2段 certain online purchases 中的网上交易；要看旧决定怎样影响这类交易，就回看第2段最后一句以及第3段企业可以不代收税的规定。</p>\n<blockquote>\n<p>The decisions made it more difficult for states to collect sales tax on certain online purchases.</p>\n</blockquote>\n<blockquote>\n<p>the business didn’t have to collect sales tax for the state. </p>\n</blockquote>\n<p>原文 certain online purchases 限定的是某些网上购物，具体后果是州征税更困难，满足条件的企业不必代收。C 的 e-commerce 与网上交易有关，但它说的是电子商务发生一种变化，这个变化的核心名词没有读清。这里既不能把它说成行业发展，也不能说成行业衰落；目前只能确认旧决定确实改变了网上交易的税款安排。</p>\n<p><strong>税款安排发生变化，能让我们读出电子商务的 [xxx] 究竟是什么吗？</strong></p>\n<p>不能。原文已经给了网上交易与旧决定的联系，但 C 所说的变化仍不清楚。它可能涉及这项安排的影响，现在还不能确定整个命题是否成立。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[307,488,1241,35],[228,539,1309,35],[228,590,1320,28],[227,642,161,35],[307,693,1241,36],[227,745,1322,35],[228,796,1311,34],[228,848,1320,35],[228,899,1203,35]],"questionRects":[[255,622,1311,35],[316,826,732,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"37","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C 的 e-commerce 是电子商务，对应第2段 certain online purchases 中的网上交易；要看旧决定怎样影响这类交易，就回看第2段最后一句以及第3段企业可以不代收税的规定。"],"evidenceParagraphPids":[1,2],"extraPrecisionParagraphPids":[],"sourceMode":"multiple_sources","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"certain online purchases","visibleOptionAnchor":"e-commerce"}}}},{"section":"37题","raw":"### D. were considered unfavorable by states\n\n> 被各州认为不利\n\n把D接回题干，它说的是：被推翻的那些决定被各州认为对自己不利。\n\nD 的 unfavorable by states 要看各州怎样看待旧决定，对应第2段 more difficult for states：州自己说损失了钱，随后又交代它们征税更困难，所以回看这两句给出的具体后果。\n\n> states said cost them billions of dollars\n\n> The decisions made it more difficult for states to collect sales tax on certain online purchases.\n\n原文 more difficult for states 把征税困难落在各州身上，各州又明确说自己因此损失数十亿美元。D 的 unfavorable by states 仍然以各州为评价主体，没有声称法院或顾客反对，而是说各州认为不利。这里虽然没有原样出现 unfavorable，但州说自己损失钱、事情更难办，两处都说明旧决定没有给州带来好处。\n\n**各州说旧决定让自己损失钱、征税更难，能说明它们认为旧决定不利吗？**\n\n能。D 评价的主体仍是各州，不利的依据就是它们自己提出的金钱损失与征税困难，不需要把顾客或企业的态度搬过来。\n\n**第一轮判断：D保留。**","html":"<h3>D. were considered unfavorable by states</h3>\n<blockquote>\n<p>被各州认为不利</p>\n</blockquote>\n<p>把D接回题干，它说的是：被推翻的那些决定被各州认为对自己不利。</p>\n<p>D 的 unfavorable by states 要看各州怎样看待旧决定，对应第2段 more difficult for states：州自己说损失了钱，随后又交代它们征税更困难，所以回看这两句给出的具体后果。</p>\n<blockquote>\n<p>states said cost them billions of dollars</p>\n</blockquote>\n<blockquote>\n<p>The decisions made it more difficult for states to collect sales tax on certain online purchases.</p>\n</blockquote>\n<p>原文 more difficult for states 把征税困难落在各州身上，各州又明确说自己因此损失数十亿美元。D 的 unfavorable by states 仍然以各州为评价主体，没有声称法院或顾客反对，而是说各州认为不利。这里虽然没有原样出现 unfavorable，但州说自己损失钱、事情更难办，两处都说明旧决定没有给州带来好处。</p>\n<p><strong>各州说旧决定让自己损失钱、征税更难，能说明它们认为旧决定不利吗？</strong></p>\n<p>能。D 评价的主体仍是各州，不利的依据就是它们自己提出的金钱损失与征税困难，不需要把顾客或企业的态度搬过来。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[307,488,1241,35],[228,539,1309,35],[228,590,1320,28],[227,642,161,35]],"questionRects":[[255,622,1311,35],[315,894,664,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"37","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D 的 unfavorable by states 要看各州怎样看待旧决定，对应第2段 more difficult for states：州自己说损失了钱，随后又交代它们征税更困难，所以回看这两句给出的具体后果。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"more difficult for states","visibleOptionAnchor":"unfavorable by states"}}}},{"section":"37题","raw":"### 37题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D保留。\n\nD 与各州的征税困难已经接上；C 中电子商务发生了什么变化尚不清楚。第一遍留下 C 和 D。","html":"<h3>37题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D保留。</li>\n</ul>\n<p>D 与各州的征税困难已经接上；C 中电子商务发生了什么变化尚不清楚。第一遍留下 C 和 D。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"37"}},{"section":"38题","raw":"## 38题\n\n> According to Justice Anthony Kennedy, the physical presence rule has ______.  \n> 根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？\n\n题干给出 Justice Anthony Kennedy，直接回到他发言的第4段，从段首读到段尾，分清他所说的规则和规则造成的结果。\n\n> 原文参考：\n>\n> Justice Anthony Kennedy wrote that the previous decisions were **[xxx]**. “Each year the physical presence rule becomes further removed from economic reality and results in **[xxx]** revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term **[xxx]** and has prevented market **[xxx]** from competing on an even playing field.”\n>\n> 开始精读：\n>\n> Justice Anthony Kennedy wrote  / that the previous decisions were **[xxx]**.  / “Each year the physical presence rule  / becomes further removed from economic reality  / and results in **[xxx]** revenue losses to the states,”  / he wrote in an opinion  / joined by four other justices.  / Kennedy wrote that the rule  / “limited states’ ability  / to seek long-term **[xxx]**  / and has prevented market **[xxx]**  / from competing on an even playing field.”\n>\n> 大法官安东尼·肯尼迪写道 / 以前的那些决定是 **[xxx]** 的。 / “每一年，这条实体存在规则 / 变得进一步远离经济现实 / 并且给各州造成 **[xxx]** 的收入损失，” / 他在一份意见中写道 / 另外四位大法官加入了这份意见。 / 肯尼迪写道，这条规则 / “限制了各州的能力 / 去寻求长期的 **[xxx]** / 并且已经阻止了市场 **[xxx]** / 在一个公平的比赛场地上竞争。”\n\n肯尼迪谈的是旧的实体存在规则：它越来越远离经济现实，造成州的收入损失；末句又写 limited 和 prevented，分别接着各州的一种长期目标与市场中的公平竞争。空格要补这条规则造成的影响。","html":"<h2>38题</h2>\n<blockquote>\n<p>According to Justice Anthony Kennedy, the physical presence rule has ______.<br>根据大法官安东尼·肯尼迪的看法，实体存在规则造成了什么？</p>\n</blockquote>\n<p>题干给出 Justice Anthony Kennedy，直接回到他发言的第4段，从段首读到段尾，分清他所说的规则和规则造成的结果。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Justice Anthony Kennedy wrote that the previous decisions were <strong>[xxx]</strong>. “Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term <strong>[xxx]</strong> and has prevented market <strong>[xxx]</strong> from competing on an even playing field.”</p>\n<p>开始精读：</p>\n<p>Justice Anthony Kennedy wrote  / that the previous decisions were <strong>[xxx]</strong>.  / “Each year the physical presence rule  / becomes further removed from economic reality  / and results in <strong>[xxx]</strong> revenue losses to the states,”  / he wrote in an opinion  / joined by four other justices.  / Kennedy wrote that the rule  / “limited states’ ability  / to seek long-term <strong>[xxx]</strong>  / and has prevented market <strong>[xxx]</strong>  / from competing on an even playing field.”</p>\n<p>大法官安东尼·肯尼迪写道 / 以前的那些决定是 <strong>[xxx]</strong> 的。 / “每一年，这条实体存在规则 / 变得进一步远离经济现实 / 并且给各州造成 <strong>[xxx]</strong> 的收入损失，” / 他在一份意见中写道 / 另外四位大法官加入了这份意见。 / 肯尼迪写道，这条规则 / “限制了各州的能力 / 去寻求长期的 <strong>[xxx]</strong> / 并且已经阻止了市场 <strong>[xxx]</strong> / 在一个公平的比赛场地上竞争。”</p>\n</blockquote>\n<p>肯尼迪谈的是旧的实体存在规则：它越来越远离经济现实，造成州的收入损失；末句又写 limited 和 prevented，分别接着各州的一种长期目标与市场中的公平竞争。空格要补这条规则造成的影响。</p>\n","articleRects":[[307,950,1230,36],[230,1001,1317,36],[227,1052,1321,37],[228,1103,1316,37],[228,1156,1320,35],[228,1206,610,37]],"questionRects":[[255,1030,1321,35],[331,1098,192,27]],"scrollTarget":"auto","meta":{"kind":"question","qid":"38"}},{"section":"38题","raw":"### A. **[xxx]** economic development\n\n> 对经济发展做出 **[xxx]**\n\n把A接回题干，它说的是：肯尼迪认为，实体存在规则对经济发展造成了 **[xxx]**。\n\nA 的 economic development 谈经济发展，原文 economic reality 谈经济现实，都在说经济方面的情况；要判断规则与经济发展究竟是什么关系，还要一起回看他随后说各州长期目标受限制的句子。\n\n> “Each year the physical presence rule becomes further removed from economic reality and results in **[xxx]** revenue losses to the states”\n\n> Kennedy wrote that the previous decisions were **[xxx]**. “Each year the physical presence rule becomes further removed from economic reality and results in **[xxx]** revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term **[xxx]** and has prevented market **[xxx]** from competing on an even playing field.”\n\n原文 economic reality 前面是 further removed，说明这条规则越来越远离经济现实；另一句说州追求长期目标的能力受到限制，但目标是什么还卡在 **[xxx]**。A 的 economic development 把对象写成经济发展，前面的核心动作也没有读清。两边有经济这层联系，但不能把原文的现实自动改成发展，也不能替 A 的动作决定是促进还是阻碍。\n\n**现在能读出 A 对经济发展作出了什么判断吗？**\n\n还不能。A 的动作没有读清，原文有关州长期目标的词也没有读清。经济现实、各州目标和经济发展之间可能有关联，但目前还不能确定这一整项的意思。\n\n**第一轮判断：A保留。**","html":"<h3>A. <strong>[xxx]</strong> economic development</h3>\n<blockquote>\n<p>对经济发展做出 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把A接回题干，它说的是：肯尼迪认为，实体存在规则对经济发展造成了 <strong>[xxx]</strong>。</p>\n<p>A 的 economic development 谈经济发展，原文 economic reality 谈经济现实，都在说经济方面的情况；要判断规则与经济发展究竟是什么关系，还要一起回看他随后说各州长期目标受限制的句子。</p>\n<blockquote>\n<p>“Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states”</p>\n</blockquote>\n<blockquote>\n<p>Kennedy wrote that the previous decisions were <strong>[xxx]</strong>. “Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term <strong>[xxx]</strong> and has prevented market <strong>[xxx]</strong> from competing on an even playing field.”</p>\n</blockquote>\n<p>原文 economic reality 前面是 further removed，说明这条规则越来越远离经济现实；另一句说州追求长期目标的能力受到限制，但目标是什么还卡在 <strong>[xxx]</strong>。A 的 economic development 把对象写成经济发展，前面的核心动作也没有读清。两边有经济这层联系，但不能把原文的现实自动改成发展，也不能替 A 的动作决定是促进还是阻碍。</p>\n<p><strong>现在能读出 A 对经济发展作出了什么判断吗？</strong></p>\n<p>还不能。A 的动作没有读清，原文有关州长期目标的词也没有读清。经济现实、各州目标和经济发展之间可能有关联，但目前还不能确定这一整项的意思。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[307,950,1230,36],[230,1001,1317,36],[227,1052,1321,37],[228,1103,1316,37],[228,1156,1320,35],[228,1206,610,37]],"questionRects":[[255,1030,1321,35],[331,1098,192,27],[331,1165,571,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A 的 economic development 谈经济发展，原文 economic reality 谈经济现实，都在说经济方面的情况；要判断规则与经济发展究竟是什么关系，还要一起回看他随后说各州长期目标受限制的句子。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"economic reality","visibleOptionAnchor":"economic development"}}}},{"section":"38题","raw":"### B. harmed fair market competition\n\n> 损害了公平的市场竞争\n\n把B接回题干，它说的是：肯尼迪认为，实体存在规则损害了公平的市场竞争。\n\nB 的 fair market competition 对应原文 competing on an even playing field，两边都说在公平条件下竞争；再看这件事前面接的是怎样的动作，所以回到第4段的最后一句。\n\n> Kennedy wrote that the previous decisions were **[xxx]**. “Each year the physical presence rule becomes further removed from economic reality and results in **[xxx]** revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term **[xxx]** and has prevented market **[xxx]** from competing on an even playing field.”\n\n原文 competing on an even playing field 把竞争条件比作平整、公平的比赛场地，前面 has prevented 表示这件事被阻止了。B 的 fair market competition 正在说这种公平竞争，harmed 表示它受到损害。market 后面的人或机构具体叫什么暂时不清楚，但 prevented 后接公平竞争这个动作已经明确，B 没有要求我们把那个名词补出来。\n\n**阻止在公平条件下竞争，能对应损害公平市场竞争吗？**\n\n能。原文的 prevented 与 B 的 harmed 都让公平竞争受到不利影响；这里比较的是竞争能否公平进行，不是市场中具体哪个名词的译法。\n\n**第一轮判断：B保留。**","html":"<h3>B. harmed fair market competition</h3>\n<blockquote>\n<p>损害了公平的市场竞争</p>\n</blockquote>\n<p>把B接回题干，它说的是：肯尼迪认为，实体存在规则损害了公平的市场竞争。</p>\n<p>B 的 fair market competition 对应原文 competing on an even playing field，两边都说在公平条件下竞争；再看这件事前面接的是怎样的动作，所以回到第4段的最后一句。</p>\n<blockquote>\n<p>Kennedy wrote that the previous decisions were <strong>[xxx]</strong>. “Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term <strong>[xxx]</strong> and has prevented market <strong>[xxx]</strong> from competing on an even playing field.”</p>\n</blockquote>\n<p>原文 competing on an even playing field 把竞争条件比作平整、公平的比赛场地，前面 has prevented 表示这件事被阻止了。B 的 fair market competition 正在说这种公平竞争，harmed 表示它受到损害。market 后面的人或机构具体叫什么暂时不清楚，但 prevented 后接公平竞争这个动作已经明确，B 没有要求我们把那个名词补出来。</p>\n<p><strong>阻止在公平条件下竞争，能对应损害公平市场竞争吗？</strong></p>\n<p>能。原文的 prevented 与 B 的 harmed 都让公平竞争受到不利影响；这里比较的是竞争能否公平进行，不是市场中具体哪个名词的译法。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[307,950,1230,36],[230,1001,1317,36],[227,1052,1321,37],[228,1103,1316,37],[228,1156,1320,35],[228,1206,610,37]],"questionRects":[[255,1030,1321,35],[331,1098,192,27],[331,1233,559,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B 的 fair market competition 对应原文 competing on an even playing field，两边都说在公平条件下竞争；再看这件事前面接的是怎样的动作，所以回到第4段的最后一句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"competing on an even playing field","visibleOptionAnchor":"fair market competition"}}}},{"section":"38题","raw":"### C. boosted growth in states’ revenue\n\n> 促进了各州收入的增长\n\n把C接回题干，它说的是：肯尼迪认为，实体存在规则促进了各州收入增长。\n\nC 的 growth in states’ revenue 与原文 revenue losses to the states 都直接谈各州收入，同一个对象一边说增长、一边说损失，所以回看肯尼迪引语中 results in 后面的结果。\n\n> “Each year the physical presence rule becomes further removed from economic reality and results in **[xxx]** revenue losses to the states”\n\n原文 revenue losses to the states 把结果写成州的收入损失。losses 前面虽有一个词不认识，但这个词修饰的是损失，不能把 losses 改成收入增长。C 的 growth in states’ revenue 说州收入增长，而且 boosted 又写规则在推动这种增长。两边说的是同一笔收入，变化的方向却相反。\n\n**收入损失前面有一个词不认识，就能把损失读成增长吗？**\n\n不能。losses 已经把结果写成收入损失，C 却说规则促进收入增长；修饰损失的那个词不会把这两个方向变成同一个意思。\n\n**第一轮判断：C排除。**","html":"<h3>C. boosted growth in states’ revenue</h3>\n<blockquote>\n<p>促进了各州收入的增长</p>\n</blockquote>\n<p>把C接回题干，它说的是：肯尼迪认为，实体存在规则促进了各州收入增长。</p>\n<p>C 的 growth in states’ revenue 与原文 revenue losses to the states 都直接谈各州收入，同一个对象一边说增长、一边说损失，所以回看肯尼迪引语中 results in 后面的结果。</p>\n<blockquote>\n<p>“Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states”</p>\n</blockquote>\n<p>原文 revenue losses to the states 把结果写成州的收入损失。losses 前面虽有一个词不认识，但这个词修饰的是损失，不能把 losses 改成收入增长。C 的 growth in states’ revenue 说州收入增长，而且 boosted 又写规则在推动这种增长。两边说的是同一笔收入，变化的方向却相反。</p>\n<p><strong>收入损失前面有一个词不认识，就能把损失读成增长吗？</strong></p>\n<p>不能。losses 已经把结果写成收入损失，C 却说规则促进收入增长；修饰损失的那个词不会把这两个方向变成同一个意思。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[307,950,1230,36],[230,1001,1317,36],[227,1052,1321,37],[228,1103,1316,37],[228,1156,1320,35],[228,1206,610,37]],"questionRects":[[255,1030,1321,35],[331,1098,192,27],[332,1301,589,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C 的 growth in states’ revenue 与原文 revenue losses to the states 都直接谈各州收入，同一个对象一边说增长、一边说损失，所以回看肯尼迪引语中 results in 后面的结果。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"revenue losses to the states","visibleOptionAnchor":"growth in states’ revenue"}}}},{"section":"38题","raw":"### D. brought prosperity to the country\n\n> 给国家带来了繁荣\n\n把D接回题干，它说的是：肯尼迪认为，实体存在规则给整个国家带来了繁荣。\n\nD 的 prosperity to the country 把经济结果落在全国繁荣，原文 revenue losses to the states 则落在各州收入；两边都涉及经济影响，因此回看收入结果，并连着看肯尼迪接下来对公平竞争的评价。\n\n> “Each year the physical presence rule becomes further removed from economic reality and results in **[xxx]** revenue losses to the states”\n\n> Kennedy wrote that the previous decisions were **[xxx]**. “Each year the physical presence rule becomes further removed from economic reality and results in **[xxx]** revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term **[xxx]** and has prevented market **[xxx]** from competing on an even playing field.”\n\n原文 revenue losses to the states 是州收入受损，末句又说公平竞争受到阻止，肯尼迪列出的都是这条规则带来的问题。D 的 prosperity to the country 却将结果写成全国繁荣，不仅把各州的具体收入结果扩到整个国家，还把肯尼迪的负面评价改成正面成就。economic reality 虽然提到经济，但它前面的 further removed 也不是在赞扬规则顺应现实。\n\n**肯尼迪列出的收入损失和竞争受阻，能合成给国家带来繁荣吗？**\n\n不能。他谈的是这条规则离现实越来越远、给州和竞争造成问题；D 却把这些结果改写成一项全国性的好处，评价方向正好转了过去。\n\n**第一轮判断：D排除。**","html":"<h3>D. brought prosperity to the country</h3>\n<blockquote>\n<p>给国家带来了繁荣</p>\n</blockquote>\n<p>把D接回题干，它说的是：肯尼迪认为，实体存在规则给整个国家带来了繁荣。</p>\n<p>D 的 prosperity to the country 把经济结果落在全国繁荣，原文 revenue losses to the states 则落在各州收入；两边都涉及经济影响，因此回看收入结果，并连着看肯尼迪接下来对公平竞争的评价。</p>\n<blockquote>\n<p>“Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states”</p>\n</blockquote>\n<blockquote>\n<p>Kennedy wrote that the previous decisions were <strong>[xxx]</strong>. “Each year the physical presence rule becomes further removed from economic reality and results in <strong>[xxx]</strong> revenue losses to the states,” he wrote in an opinion joined by four other justices. Kennedy wrote that the rule “limited states’ ability to seek long-term <strong>[xxx]</strong> and has prevented market <strong>[xxx]</strong> from competing on an even playing field.”</p>\n</blockquote>\n<p>原文 revenue losses to the states 是州收入受损，末句又说公平竞争受到阻止，肯尼迪列出的都是这条规则带来的问题。D 的 prosperity to the country 却将结果写成全国繁荣，不仅把各州的具体收入结果扩到整个国家，还把肯尼迪的负面评价改成正面成就。economic reality 虽然提到经济，但它前面的 further removed 也不是在赞扬规则顺应现实。</p>\n<p><strong>肯尼迪列出的收入损失和竞争受阻，能合成给国家带来繁荣吗？</strong></p>\n<p>不能。他谈的是这条规则离现实越来越远、给州和竞争造成问题；D 却把这些结果改写成一项全国性的好处，评价方向正好转了过去。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[307,950,1230,36],[230,1001,1317,36],[227,1052,1321,37],[228,1103,1316,37],[228,1156,1320,35],[228,1206,610,37]],"questionRects":[[255,1030,1321,35],[331,1098,192,27],[331,1369,584,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D 的 prosperity to the country 把经济结果落在全国繁荣，原文 revenue losses to the states 则落在各州收入；两边都涉及经济影响，因此回看收入结果，并连着看肯尼迪接下来对公平竞争的评价。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","scope"],"visibleSourceAnchor":"revenue losses to the states","visibleOptionAnchor":"prosperity to the country"}}}},{"section":"38题","raw":"### 38题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B保留；\n- C排除；\n- D排除。\n\nB 与公平竞争受阻的句子可以对上；A 里描述经济发展的动作没有读清。目前留下 A 和 B。","html":"<h3>38题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>B 与公平竞争受阻的句子可以对上；A 里描述经济发展的动作没有读清。目前留下 A 和 B。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"38"}},{"section":"39题","raw":"## 39题\n\n> Who are most likely to welcome the Supreme Court ruling?  \n> 谁最有可能欢迎最高法院的这项裁决？\n\n题干点名 Supreme Court ruling，先回到第1段的 Supreme Court decision。36题已经把这一段读过，这里直接回到刚才读过的范围，接着看各选项所说的是哪一类人。\n\n第1段说购物者的钱包变轻、各州得到财政上的好处。题干现在问谁最可能欢迎这项裁决，需要根据选项中的具体人物，再去找文章是否把他们写成受益者。","html":"<h2>39题</h2>\n<blockquote>\n<p>Who are most likely to welcome the Supreme Court ruling?<br>谁最有可能欢迎最高法院的这项裁决？</p>\n</blockquote>\n<p>题干点名 Supreme Court ruling，先回到第1段的 Supreme Court decision。36题已经把这一段读过，这里直接回到刚才读过的范围，接着看各选项所说的是哪一类人。</p>\n<p>第1段说购物者的钱包变轻、各州得到财政上的好处。题干现在问谁最可能欢迎这项裁决，需要根据选项中的具体人物，再去找文章是否把他们写成受益者。</p>\n","articleRects":[[308,333,1240,36],[228,385,1319,35],[229,436,1053,36]],"questionRects":[[255,1505,1033,35]],"scrollTarget":"auto","meta":{"kind":"question","qid":"39"}},{"section":"39题","raw":"### A. Big-chain owners.\n\n> 大型连锁企业的所有者\n\n把A接回题干，它说的是：大型连锁企业的所有者最可能欢迎这项裁决。\n\nA 的 Big-chain owners 是大型连锁企业的所有者。粗读后面时看到过大型连锁企业和一场胜利，回到第5段的 big chains，两者指向同一类企业，所以先把第5段从头到尾读完，再看胜利的原因。\n\n> 原文参考：\n>\n> The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, **[xxx]** will be charging sales tax where they hadn’t before. Big chains have been collecting sales tax **[xxx]** because they **[xxx]** have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of **[xxx]**, also collects sales tax in every state that charges it, though third-party sellers who use the site don’t have to.\n>\n> 开始精读：\n>\n> The ruling is a victory  / for big chains  / with a presence in many states,  / since they usually collect sales tax on online purchases already.  / Now, **[xxx]**  / will be charging sales tax  / where they hadn’t before.  / Big chains have been collecting sales tax **[xxx]**  / because they **[xxx]**  / have physical stores  / in whatever state a purchase is being shipped to.  / Amazon.com, with its network of **[xxx]**,  / also collects sales tax in every state that charges it,  / though third-party sellers  / who use the site don’t have to.\n>\n> 这项裁决是一场胜利 / 对大型连锁企业来说 / 它们在许多州有实体存在， / 因为它们通常已经对网上购物征收销售税。 / 现在， **[xxx]** / 将会征收销售税 / 在它们以前没有征收的地方。 / 大型连锁企业一直在征收销售税 **[xxx]** / 因为它们 **[xxx]** / 有实体店 / 不管购买的东西正被寄往哪个州。 / 亚马逊网站，带着它的 **[xxx]** 网络， / 也在每一个收这种税的州征收销售税， / 虽然第三方卖家 / 使用这个网站的，却不必这么做。\n\n现在回到 A，企业的一场胜利与其所有者是否最可能欢迎，直接看第5段首句给出的结果和原因。\n\n> The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already.\n\n原文 a victory for big chains 直接把大型连锁企业放在受益一边，原因是它们通常已经在网上交易中收销售税。A 的 Big-chain owners 指的正是拥有这些企业的人，并没有把行业换成另一种商家。题干问 most likely，不是要求所有者必须在原文里亲口说欢迎；企业得到一场胜利，就能给其所有者最可能欢迎提供直接依据。\n\n**裁决被称为大型连锁企业的胜利，能说明其所有者最可能欢迎吗？**\n\n能。A 的人和原文受益的企业是一一对应的，胜利已经给出了正面结果。\n\n**第一轮判断：A保留。**","html":"<h3>A. Big-chain owners.</h3>\n<blockquote>\n<p>大型连锁企业的所有者</p>\n</blockquote>\n<p>把A接回题干，它说的是：大型连锁企业的所有者最可能欢迎这项裁决。</p>\n<p>A 的 Big-chain owners 是大型连锁企业的所有者。粗读后面时看到过大型连锁企业和一场胜利，回到第5段的 big chains，两者指向同一类企业，所以先把第5段从头到尾读完，再看胜利的原因。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already. Now, <strong>[xxx]</strong> will be charging sales tax where they hadn’t before. Big chains have been collecting sales tax <strong>[xxx]</strong> because they <strong>[xxx]</strong> have physical stores in whatever state a purchase is being shipped to. Amazon.com, with its network of <strong>[xxx]</strong>, also collects sales tax in every state that charges it, though third-party sellers who use the site don’t have to.</p>\n<p>开始精读：</p>\n<p>The ruling is a victory  / for big chains  / with a presence in many states,  / since they usually collect sales tax on online purchases already.  / Now, <strong>[xxx]</strong>  / will be charging sales tax  / where they hadn’t before.  / Big chains have been collecting sales tax <strong>[xxx]</strong>  / because they <strong>[xxx]</strong>  / have physical stores  / in whatever state a purchase is being shipped to.  / Amazon.com, with its network of <strong>[xxx]</strong>,  / also collects sales tax in every state that charges it,  / though third-party sellers  / who use the site don’t have to.</p>\n<p>这项裁决是一场胜利 / 对大型连锁企业来说 / 它们在许多州有实体存在， / 因为它们通常已经对网上购物征收销售税。 / 现在， <strong>[xxx]</strong> / 将会征收销售税 / 在它们以前没有征收的地方。 / 大型连锁企业一直在征收销售税 <strong>[xxx]</strong> / 因为它们 <strong>[xxx]</strong> / 有实体店 / 不管购买的东西正被寄往哪个州。 / 亚马逊网站，带着它的 <strong>[xxx]</strong> 网络， / 也在每一个收这种税的州征收销售税， / 虽然第三方卖家 / 使用这个网站的，却不必这么做。</p>\n</blockquote>\n<p>现在回到 A，企业的一场胜利与其所有者是否最可能欢迎，直接看第5段首句给出的结果和原因。</p>\n<blockquote>\n<p>The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already.</p>\n</blockquote>\n<p>原文 a victory for big chains 直接把大型连锁企业放在受益一边，原因是它们通常已经在网上交易中收销售税。A 的 Big-chain owners 指的正是拥有这些企业的人，并没有把行业换成另一种商家。题干问 most likely，不是要求所有者必须在原文里亲口说欢迎；企业得到一场胜利，就能给其所有者最可能欢迎提供直接依据。</p>\n<p><strong>裁决被称为大型连锁企业的胜利，能说明其所有者最可能欢迎吗？</strong></p>\n<p>能。A 的人和原文受益的企业是一一对应的，胜利已经给出了正面结果。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[307,1259,1240,35],[228,1311,1320,35],[228,1362,1319,35],[228,1413,1320,36],[227,1465,1321,35],[228,1516,1320,35],[228,1568,353,27]],"questionRects":[[255,1505,1033,35],[315,1573,341,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A 的 Big-chain owners 是大型连锁企业的所有者。粗读后面时看到过大型连锁企业和一场胜利，回到第5段的 big chains，两者指向同一类企业，所以先把第5段从头到尾读完，再看胜利的原因。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[4],"sourceMode":"new_precision_reading","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"big chains","visibleOptionAnchor":"Big-chain owners"}}}},{"section":"39题","raw":"### B. Third-party sellers.\n\n> 第三方卖家\n\n把B接回题干，它说的是：第三方卖家最可能欢迎这项裁决。\n\nB 的 Third-party sellers 对应刚读过的 don’t have to 所指的卖家：它们使用网站，却以前不必像网站本身一样收税。这里要弄清旧安排怎样变成新安排，因此接着看第6段的 sellers 与 out-of-state sellers，把这一整段读完，再比较以前不收税与现在可以被要求收税。\n\n> 原文参考：\n>\n> Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states. Sellers that use eBay and Etsy, which provide **[xxx]** for smaller sellers, also haven’t been collecting sales tax nationwide. Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state’s sales tax from customers and send it to the state.\n>\n> 开始精读：\n>\n> Until now, many sellers  / that have a physical presence  / in only a single state or a few states  / have been able to avoid charging sales taxes  / when they ship to addresses outside those states.  / Sellers that use eBay and Etsy,  / which provide **[xxx]** for smaller sellers,  / also haven’t been collecting sales tax nationwide.  / Under the ruling Thursday,  / states can pass laws  / requiring out-of-state sellers to collect the state’s sales tax  / from customers  / and send it to the state.\n>\n> 直到现在，许多卖家 / 有实体存在的 / 只在一个州或少数几个州， / 一直能够避免收取销售税 / 当它们把货寄到这些州以外的地址时。 / 使用易贝和埃特西的卖家， / 这两个网站为更小的卖家提供 **[xxx]**， / 也一直没有在全国征收销售税。 / 根据周四的这项裁决， / 各州可以通过法律 / 要求州外的卖家征收本州的销售税 / 从顾客那里 / 并将它交给州。\n\n现在回到 B，把第5段第三方卖家原来的待遇，与第6段州今后可以提出的收税要求放在一起。\n\n> Amazon.com, with its network of **[xx
