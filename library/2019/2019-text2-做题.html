<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 26题题干\n\n**What is commonly regarded as the cause of grade inflation?**\n\n> 什么通常被看作平均成绩越来越高的原因？\n\n题型：**细节题**。\n\n---","html":"<h2>26题题干</h2>\n<p><strong>What is commonly regarded as the cause of grade inflation?</strong></p>\n<blockquote>\n<p>什么通常被看作平均成绩越来越高的原因？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,214,1038,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**What was the original purpose of grade forgiveness?**\n\n> 成绩宽免最初是为了什么？\n\n题型：**细节题**。\n\n---","html":"<h2>27题题干</h2>\n<p><strong>What was the original purpose of grade forgiveness?</strong></p>\n<blockquote>\n<p>成绩宽免最初是为了什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,637,913,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**According to Paragraph 5, grade forgiveness enables colleges to ______.**\n\n> 根据第五段，成绩宽免使大学能够做什么？\n\n题型：**细节题**。\n\n---","html":"<h2>28题题干</h2>\n<p><strong>According to Paragraph 5, grade forgiveness enables colleges to ______.</strong></p>\n<blockquote>\n<p>根据第五段，成绩宽免使大学能够做什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,1060,1246,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**What does the phrase “to be aligned” (Para. 6) most probably mean?**\n\n> 第六段中的 to be aligned 最可能是什么意思？\n\n题型：**词义题**。\n\n---","html":"<h2>29题题干</h2>\n<p><strong>What does the phrase “to be aligned” (Para. 6) most probably mean?</strong></p>\n<blockquote>\n<p>第六段中的 to be aligned 最可能是什么意思？</p>\n</blockquote>\n<p>题型：<strong>词义题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,1481,1209,37]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"## 30题题干\n\n**The author examines the practice of grade forgiveness by ______.**\n\n> 作者通过什么方式来考察成绩宽免这种做法？\n\n题型：**全文写作方式题**。\n\n---","html":"<h2>30题题干</h2>\n<p><strong>The author examines the practice of grade forgiveness by ______.</strong></p>\n<blockquote>\n<p>作者通过什么方式来考察成绩宽免这种做法？</p>\n</blockquote>\n<p>题型：<strong>全文写作方式题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[255,1905,1130,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, as, That said, so, Since |\n| 态度词 / 评价词 | 先抓个大概好坏 | low, better, success, best |\n| 动作词 | 先看谁做了什么 | retake, keep, improve, raise |\n| 结果词 | 看最后出了什么事 | graduation rates, more money, a job |\n| 重复主题词 | 大概知道老在说什么 | grade forgiveness, GPAs, students, colleges |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>But, as, That said, so, Since</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>low, better, success, best</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>retake, keep, improve, raise</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>graduation rates, more money, a job</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>grade forgiveness, GPAs, students, colleges</td>\n</tr>\n</tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"Grade inflation—the gradual increase in average GPAs (grade-point averages) over the past few decades—is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased. But another, related force—a policy often **[xxx]** deep in course **[xxx]** called “grade forgiveness”—is helping raise GPAs.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Grade inflation—the gradual increase in average GPAs (grade-point averages) over the past few decades—is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased. But another, related force—a policy often <strong>[xxx]</strong> deep in course <strong>[xxx]</strong> called “grade forgiveness”—is helping raise GPAs.</p>\n</div></div>","articleRects":[[308,326,1240,45],[228,388,1321,37],[228,448,1320,35],[227,505,1320,36],[228,558,835,46]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true},"contextRaw":""},{"section":"读文章","raw":"Grade inflation—the gradual increase / in average GPAs (grade-point averages) / over the past few decades—is often considered / a product of a consumer era / in higher education, / in which students are treated / like customers to be pleased. / But another, related force—a policy / often **[xxx]** deep in course **[xxx]** / called “grade forgiveness”— / is helping raise GPAs.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>Grade inflation—the gradual increase / in average GPAs (grade-point averages) / over the past few decades—is often considered / a pro 点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住成绩宽免、新生、第二次机会、Jack Miner、州资金和结尾的工作；这些信息之间到底是什么关系，等题目问到再精读。","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和成绩上涨、平均绩点、成绩宽免有关。开头似乎有消费时代、学生和顾客，后来看到低分、最高成绩；中间又出现近些年、几十年前、新生和第二次机会，还有 Jack Miner、更多成功、按时毕业。后面有大学自己的需要、州资金、更多的钱，结尾又看到消费者的期待、学生与家长、大学学位和工作。</p>\n<p>到这里还不能自然地说清楚：成绩宽免具体怎样改变成绩，几十年前与近些年有什么不同，Jack Miner 的话与毕业有什么关系，州资金为什么和成绩放在一起，最后的学生、家长和学校又有什么联系。粗读时只要能判断“这篇文章大概与成绩、大学、学生以及几种钱和毕业的事情有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住成绩宽免、新生、第二次机会、Jack Miner、州资金和结尾的工作；这些信息之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做26至29题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> What is commonly regarded as the cause of grade inflation?  \n> 什么通常被看作平均成绩越来越高的原因？\n\n题干问 grade inflation 的常见原因。刚才粗读时，在开头好像看到了“成绩上涨”和“平均绩点”，所以先回第一段，从头读到结尾。\n\n> 原文参考：\n>\n> Grade inflation—the gradual increase in average GPAs (grade-point averages) over the past few decades—is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased. But another, related force—a policy often **[xxx]** deep in course **[xxx]** called “grade forgiveness”—is helping raise GPAs.\n>\n> 开始精读：\n>\n> Grade inflation—the gradual increase / in average GPAs (grade-point averages) / over the past few decades—is often considered / a product of a consumer era / in higher education, / in which students are treated / like customers to be pleased. / But another, related force—a policy / often **[xxx]** deep in course **[xxx]** / called “grade forgiveness”— / is helping raise GPAs.\n>\n> 成绩上涨——逐渐增加 / 在平均GPAs（平均绩点）上 / 在过去几十年里——经常被认为 / 一个消费时代的产物 / 在高等教育中， / 在其中学生被对待 / 像需要被取悦的顾客。 / 但是另一股相关的力量——一项政策 / 经常 **[xxx]** 深在课程 **[xxx]** 中 / 叫作“成绩宽免”—— / 正在帮助提高平均绩点。\n\n题干里的 commonly regarded 对应这一段的 is often considered，都是“通常被看作”。这句话把成绩上涨放在一个 consumer era 里解释：学生被当成需要哄满意的顾客。后一句又用 But another 引出另一股力量。题目先问大家通常认为什么是原因，空格要补的是前一种说法。","html":"<h2>26题</h2>\n<blockquote>\n<p>What is commonly regarded as the cause of grade inflation?<br>什么通常被看作平均成绩越来越高的原因？</p>\n</blockquote>\n<p>题干问 grade inflation 的常见原因。刚才粗读时，在开头好像看到了“成绩上涨”和“平均绩点”，所以先回第一段，从头读到结尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Grade inflation—the gradual increase in average GPAs (grade-point averages) over the past few decades—is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased. But another, related force—a policy often <strong>[xxx]</strong> deep in course <strong>[xxx]</strong> called “grade forgiveness”—is helping raise GPAs.</p>\n<p>开始精读：</p>\n<p>Grade inflation—the gradual increase / in average GPAs (grade-point averages) / over the past few decades—is often considered / a product of a consumer era / in higher education, / in which students are treated / like customers to be pleased. / But another, related force—a policy / often <strong>[xxx]</strong> deep in course <strong>[xxx]</strong> / called “grade forgiveness”— / is helping raise GPAs.</p>\n<p>成绩上涨——逐渐增加 / 在平均GPAs（平均绩点）上 / 在过去几十年里——经常被认为 / 一个消费时代的产物 / 在高等教育中， / 在其中学生被对待 / 像需要被取悦的顾客。 / 但是另一股相关的力量——一项政策 / 经常 <strong>[xxx]</strong> 深在课程 <strong>[xxx]</strong> 中 / 叫作“成绩宽免”—— / 正在帮助提高平均绩点。</p>\n</blockquote>\n<p>题干里的 commonly regarded 对应这一段的 is often considered，都是“通常被看作”。这句话把成绩上涨放在一个 consumer era 里解释：学生被当成需要哄满意的顾客。后一句又用 But another 引出另一股力量。题目先问大家通常认为什么是原因，空格要补的是前一种说法。</p>\n","articleRects":[[308,326,1240,45],[228,388,1321,37],[228,448,1320,35],[227,505,1320,36],[228,558,835,46]],"questionRects":[[254,214,1038,36]],"scrollTarget":"auto","meta":{"kind":"question","qid":"26"}},{"section":"26题","raw":"### A. Colleges’ neglect of GPAs.\n\n> 大学对平均成绩的忽视。\n\n把A接回题干，它说的是：成绩上涨通常被认为是大学忽视平均成绩造成的。\n\nA 的 neglect of GPAs 是说大学把平均成绩放在一边；第一段的 helping raise GPAs 则在说大学政策怎样影响成绩，两边都涉及学校对成绩做什么，所以把这句与前面的顾客说法一起看。\n\n> in which students are treated like customers to be pleased.\n\n> called “grade forgiveness”—is helping raise GPAs.\n\n原文先说学生被当成 customers to be pleased，后面又明确写政策正在 helping raise GPAs。学校这边呈现的是回应学生、用政策影响成绩。A 的 neglect of GPAs 却把原因改成学校不在意平均成绩。这里不是“忘了管成绩所以分数涨了”，而是把学生当顾客的做法与另一项提高成绩的政策相联系；忽视成绩不能替代这段已写出的做法。\n\n**把学生当顾客并用政策推高成绩，能改成大学忽视了平均成绩吗？**\n\n不能。A 把学校对学生和成绩采取的做法改成“不在意成绩”，与这一段呈现的主动影响成绩不是同一回事。\n\n**第一轮判断：A排除。**","html":"<h3>A. Colleges’ neglect of GPAs.</h3>\n<blockquote>\n<p>大学对平均成绩的忽视。</p>\n</blockquote>\n<p>把A接回题干，它说的是：成绩上涨通常被认为是大学忽视平均成绩造成的。</p>\n<p>A 的 neglect of GPAs 是说大学把平均成绩放在一边；第一段的 helping raise GPAs 则在说大学政策怎样影响成绩，两边都涉及学校对成绩做什么，所以把这句与前面的顾客说法一起看。</p>\n<blockquote>\n<p>in which students are treated like customers to be pleased.</p>\n</blockquote>\n<blockquote>\n<p>called “grade forgiveness”—is helping raise GPAs.</p>\n</blockquote>\n<p>原文先说学生被当成 customers to be pleased，后面又明确写政策正在 helping raise GPAs。学校这边呈现的是回应学生、用政策影响成绩。A 的 neglect of GPAs 却把原因改成学校不在意平均成绩。这里不是“忘了管成绩所以分数涨了”，而是把学生当顾客的做法与另一项提高成绩的政策相联系；忽视成绩不能替代这段已写出的做法。</p>\n<p><strong>把学生当顾客并用政策推高成绩，能改成大学忽视了平均成绩吗？</strong></p>\n<p>不能。A 把学校对学生和成绩采取的做法改成“不在意成绩”，与这一段呈现的主动影响成绩不是同一回事。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[308,326,1240,45],[228,388,1321,37],[228,448,1320,35],[227,505,1320,36],[228,558,835,46]],"questionRects":[[254,214,1038,36],[315,285,489,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A 的 neglect of GPAs 是说大学把平均成绩放在一边；第一段的 helping raise GPAs 则在说大学政策怎样影响成绩，两边都涉及学校对成绩做什么，所以把这句与前面的顾客说法一起看。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction"],"visibleSourceAnchor":"helping raise GPAs","visibleOptionAnchor":"neglect of GPAs"}}}},{"section":"26题","raw":"### B. The influence of consumer culture.\n\n> 消费文化的影响。\n\n把B接回题干，它说的是：成绩上涨通常被认为受到消费文化的影响。\n\nB 的 consumer culture 指消费文化，原文的 a consumer era 也在讲把教育放进消费关系中；后面的 customers 说明这种关系具体怎样出现，所以回看第一句。\n\n> Grade inflation—the gradual increase in average GPAs (grade-point averages) over the past few decades—is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased.\n\n原文说成绩上涨通常被看作 a consumer era 的产物，然后把“消费”落实到学生身上：他们像顾客一样需要被取悦。B 的 consumer culture 把这个时代及其中对待学生的方式概括成消费文化，influence 则接住“产物”背后的影响关系。两边说的都是教育里把学生当顾客的做法怎样影响成绩，没有把对象换成课程内容或毕业生就业。\n\n**学生被当成要哄满意的顾客，能说明成绩上涨受到消费文化影响吗？**\n\n能。consumer era 后面紧接 customers，已把这种影响写具体；B 能接到题干所问的通常看法上。\n\n**第一轮判断：B保留。**","html":"<h3>B. The influence of consumer culture.</h3>\n<blockquote>\n<p>消费文化的影响。</p>\n</blockquote>\n<p>把B接回题干，它说的是：成绩上涨通常被认为受到消费文化的影响。</p>\n<p>B 的 consumer culture 指消费文化，原文的 a consumer era 也在讲把教育放进消费关系中；后面的 customers 说明这种关系具体怎样出现，所以回看第一句。</p>\n<blockquote>\n<p>Grade inflation—the gradual increase in average GPAs (grade-point averages) over the past few decades—is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased.</p>\n</blockquote>\n<p>原文说成绩上涨通常被看作 a consumer era 的产物，然后把“消费”落实到学生身上：他们像顾客一样需要被取悦。B 的 consumer culture 把这个时代及其中对待学生的方式概括成消费文化，influence 则接住“产物”背后的影响关系。两边说的都是教育里把学生当顾客的做法怎样影响成绩，没有把对象换成课程内容或毕业生就业。</p>\n<p><strong>学生被当成要哄满意的顾客，能说明成绩上涨受到消费文化影响吗？</strong></p>\n<p>能。consumer era 后面紧接 customers，已把这种影响写具体；B 能接到题干所问的通常看法上。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[308,326,1240,45],[228,388,1321,37],[228,448,1320,35],[227,505,1320,36],[228,558,835,46]],"questionRects":[[254,214,1038,36],[315,355,613,28]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B 的 consumer culture 指消费文化，原文的 a consumer era 也在讲把教育放进消费关系中；后面的 customers 说明这种关系具体怎样出现，所以回看第一句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"a consumer era","visibleOptionAnchor":"consumer culture"}}}},{"section":"26题","raw":"### C. Students’ **[xxx]** to GPAs.\n\n> 学生对平均成绩的 **[xxx]**。\n\n把C接回题干，它说的是：成绩上涨通常被认为源于学生对平均成绩的 **[xxx]**。\n\nC 的 Students’ 把原因放在学生这一边，原文的 customers to be pleased 也在谈学生怎样被对待；两处指向同一批人，所以回看第一句中学生与顾客相连的部分。\n\n> Grade inflation—the gradual increase in average GPAs (grade-point averages) over the past few decades—is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased.\n\n原文的 customers to be pleased 说明学生被当成要获得满足的顾客，却没有在这里具体展开他们对分数抱有什么想法。C 的 Students’ 后面有一个看不懂的词，它连着 to GPAs，整项要说的是学生与平均成绩之间的某种态度或联系。学生这个对象能接上，GPAs 也是本句讨论的成绩；卡住的是这项到底说学生怎样看待成绩。只凭已读到的学生、顾客和成绩，尚不能断定它与消费关系相反。\n\n**还没读清学生对成绩是什么态度，就能断定 C 与顾客这层说法冲突吗？**\n\n不能。C 所说的具体态度还不清楚，而原文确实把学生的满意与成绩上涨放在同一句中。这里先把它留下。\n\n**第一轮判断：C保留。**","html":"<h3>C. Students’ <strong>[xxx]</strong> to GPAs.</h3>\n<blockquote>\n<p>学生对平均成绩的 <strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把C接回题干，它说的是：成绩上涨通常被认为源于学生对平均成绩的 <strong>[xxx]</strong>。</p>\n<p>C 的 Students’ 把原因放在学生这一边，原文的 customers to be pleased 也在谈学生怎样被对待；两处指向同一批人，所以回看第一句中学生与顾客相连的部分。</p>\n<blockquote>\n<p>Grade inflation—the gradual increase in average GPAs (grade-point averages) over the past few decades—is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased.</p>\n</blockquote>\n<p>原文的 customers to be pleased 说明学生被当成要获得满足的顾客，却没有在这里具体展开他们对分数抱有什么想法。C 的 Students’ 后面有一个看不懂的词，它连着 to GPAs，整项要说的是学生与平均成绩之间的某种态度或联系。学生这个对象能接上，GPAs 也是本句讨论的成绩；卡住的是这项到底说学生怎样看待成绩。只凭已读到的学生、顾客和成绩，尚不能断定它与消费关系相反。</p>\n<p><strong>还没读清学生对成绩是什么态度，就能断定 C 与顾客这层说法冲突吗？</strong></p>\n<p>不能。C 所说的具体态度还不清楚，而原文确实把学生的满意与成绩上涨放在同一句中。这里先把它留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[308,326,1240,45],[228,388,1321,37],[228,448,1320,35],[227,505,1320,36],[228,558,835,46]],"questionRects":[[254,214,1038,36],[315,426,558,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C 的 Students’ 把原因放在学生这一边，原文的 customers to be pleased 也在谈学生怎样被对待；两处指向同一批人，所以回看第一句中学生与顾客相连的部分。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"visibleSourceAnchor":"customers to be pleased","visibleOptionAnchor":"Students’"}}}},{"section":"26题","raw":"### D. The change of course catalogs.\n\n> 课程目录的变化。\n\n把D接回题干，它说的是：成绩上涨通常被认为是课程目录发生变化造成的。\n\nD 的 change of course catalogs 让人注意课程文件的变化，第一段却用 a policy 指明另一股力量；两边都涉及课程安排，但“文件改了”与“政策起作用”不同，所以回看 But another 后面的整句。\n\n> But another, related force—a policy often **[xxx]** deep in course **[xxx]** called “grade forgiveness”—is helping raise GPAs.\n\n原文这句的主干是 a policy 正在帮助提高平均成绩，often 后面那些词是在补充这项政策的情况。D 的 change of course catalogs 则把做动作的原因换成课程目录的变化。即使课程文件与政策有关，句子也没有说“目录变化正在提高成绩”。再看题干的 commonly：前一句是通常的解释，But another 引进的是另一种原因；D 把后一处的课程文件拿来替代前面明确说出的消费背景，既换了起作用的东西，也错接了题干问的那一种原因。\n\n**一项政策提高成绩，能直接说成课程目录的变化是通常认为的原因吗？**\n\n不能。句子把提高成绩的作用交给 policy，并用 another 区别于前面的常见解释；D 把课程文件改成了起作用的主体。\n\n**第一轮判断：D排除。**","html":"<h3>D. The change of course catalogs.</h3>\n<blockquote>\n<p>课程目录的变化。</p>\n</blockquote>\n<p>把D接回题干，它说的是：成绩上涨通常被认为是课程目录发生变化造成的。</p>\n<p>D 的 change of course catalogs 让人注意课程文件的变化，第一段却用 a policy 指明另一股力量；两边都涉及课程安排，但“文件改了”与“政策起作用”不同，所以回看 But another 后面的整句。</p>\n<blockquote>\n<p>But another, related force—a policy often <strong>[xxx]</strong> deep in course <strong>[xxx]</strong> called “grade forgiveness”—is helping raise GPAs.</p>\n</blockquote>\n<p>原文这句的主干是 a policy 正在帮助提高平均成绩，often 后面那些词是在补充这项政策的情况。D 的 change of course catalogs 则把做动作的原因换成课程目录的变化。即使课程文件与政策有关，句子也没有说“目录变化正在提高成绩”。再看题干的 commonly：前一句是通常的解释，But another 引进的是另一种原因；D 把后一处的课程文件拿来替代前面明确说出的消费背景，既换了起作用的东西，也错接了题干问的那一种原因。</p>\n<p><strong>一项政策提高成绩，能直接说成课程目录的变化是通常认为的原因吗？</strong></p>\n<p>不能。句子把提高成绩的作用交给 policy，并用 another 区别于前面的常见解释；D 把课程文件改成了起作用的主体。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[308,326,1240,45],[228,388,1321,37],[228,448,1320,35],[227,505,1320,36],[228,558,835,46]],"questionRects":[[254,214,1038,36],[315,496,550,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D 的 change of course catalogs 让人注意课程文件的变化，第一段却用 a policy 指明另一股力量；两边都涉及课程安排，但“文件改了”与“政策起作用”不同，所以回看 But another 后面的整句。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","visible_link"],"visibleSourceAnchor":"a policy","visibleOptionAnchor":"change of course catalogs"}}}},{"section":"26题","raw":"### 26题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C保留；\n- D排除。\n\nB 能接上消费时代与顾客的解释；C 的学生态度还没有读清。第一次留下 B、C。","html":"<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>B 能接上消费时代与顾客的解释；C 的学生态度还没有读清。第一次留下 B、C。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"26"}},{"section":"27题","raw":"## 27题\n\n> What was the original purpose of grade forgiveness?  \n> 成绩宽免最初是为了什么？\n\n题干里的 original purpose 要找最初的目的。刚才粗读时，中间好像出现了“几十年前”“新生”和“第二次机会”，先回到第三段，从开头读到结尾。\n\n> 原文参考：\n>\n> The use of this little-known practice has accelerated in recent years, as colleges continue to do their **[xxx]** to keep students in school (and paying tuition) and improve their graduation rates. When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their **[xxx]** to college-level courses. But now most colleges, save for many **[xxx]** campuses, allow all **[xxx]**, and even graduate students, to get their low grades forgiven.\n>\n> 开始精读：\n>\n> The use of this little-known practice / has accelerated in recent years, / as colleges continue to do their **[xxx]** / to keep students in school / (and paying tuition) / and improve their graduation rates. / When this practice first started decades ago, / it was usually limited to freshmen, / to give them a second chance / to take a class in their first year / if they struggled / in their **[xxx]** to college-level courses. / But now most colleges, / save for many **[xxx]** campuses, / allow all **[xxx]**, / and even graduate students, / to get their low grades forgiven.\n>\n> 这个不太为人所知的做法的使用 / 近些年已经加快， / 随着大学继续做它们的 **[xxx]** / 以留住学生在学校 / （并且交学费） / 并提高它们的毕业率。 / 当这种做法几十年前刚开始时， / 它通常限于新生， / 来给他们第二次机会 / 在他们第一年上一门课 / 如果他们学得吃力 / 在他们 **[xxx]** 到大学水平课程的过程中。 / 但现在大多数大学， / 除了许多 **[xxx]** 校园， / 允许所有 **[xxx]**， / 甚至研究生， / 让他们的低分被宽免。\n\n这里有两个时间：in recent years 是近些年，first started decades ago 是几十年前刚开始。题干问 original purpose，所以要接的是过去那句：对象通常限于 freshmen，做法是给他们 first year 再上一遍课的机会，条件是他们面对大学课程时学得吃力。","html":"<h2>27题</h2>\n<blockquote>\n<p>What was the original purpose of grade forgiveness?<br>成绩宽免最初是为了什么？</p>\n</blockquote>\n<p>题干里的 original purpose 要找最初的目的。刚才粗读时，中间好像出现了“几十年前”“新生”和“第二次机会”，先回到第三段，从开头读到结尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The use of this little-known practice has accelerated in recent years, as colleges continue to do their <strong>[xxx]</strong> to keep students in school (and paying tuition) and improve their graduation rates. When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their <strong>[xxx]</strong> to college-level courses. But now most colleges, save for many <strong>[xxx]</strong> campuses, allow all <strong>[xxx]</strong>, and even graduate students, to get their low grades forgiven.</p>\n<p>开始精读：</p>\n<p>The use of this little-known practice / has accelerated in recent years, / as colleges continue to do their <strong>[xxx]</strong> / to keep students in school / (and paying tuition) / and improve their graduation rates. / When this practice first started decades ago, / it was usually limited to freshmen, / to give them a second chance / to take a class in their first year / if they struggled / in their <strong>[xxx]</strong> to college-level courses. / But now most colleges, / save for many <strong>[xxx]</strong> campuses, / allow all <strong>[xxx]</strong>, / and even graduate students, / to get their low grades forgiven.</p>\n<p>这个不太为人所知的做法的使用 / 近些年已经加快， / 随着大学继续做它们的 <strong>[xxx]</strong> / 以留住学生在学校 / （并且交学费） / 并提高它们的毕业率。 / 当这种做法几十年前刚开始时， / 它通常限于新生， / 来给他们第二次机会 / 在他们第一年上一门课 / 如果他们学得吃力 / 在他们 <strong>[xxx]</strong> 到大学水平课程的过程中。 / 但现在大多数大学， / 除了许多 <strong>[xxx]</strong> 校园， / 允许所有 <strong>[xxx]</strong>， / 甚至研究生， / 让他们的低分被宽免。</p>\n</blockquote>\n<p>这里有两个时间：in recent years 是近些年，first started decades ago 是几十年前刚开始。题干问 original purpose，所以要接的是过去那句：对象通常限于 freshmen，做法是给他们 first year 再上一遍课的机会，条件是他们面对大学课程时学得吃力。</p>\n","articleRects":[[307,795,1240,35],[228,851,1320,37],[228,909,1320,37],[228,968,1320,36],[228,1026,1319,36],[228,1084,1319,36],[228,1142,1261,35]],"questionRects":[[254,637,913,35]],"scrollTarget":"auto","meta":{"kind":"question","qid":"27"}},{"section":"27题","raw":"### A. To maintain colleges’ graduation rates.\n\n> 维持大学的毕业率。\n\n把A接回题干，它说的是：成绩宽免最初是为了维持大学的毕业率。\n\nA 的 maintain 指维持某个水平，原文的 improve their graduation rates 也在说学校想达到怎样的毕业率；因此先看这句的时间，再与 first started 引出的过去一句合看。\n\n> The use of this little-known practice has accelerated in recent years, as colleges continue to do their **[xxx]** to keep students in school (and paying tuition) and improve their graduation rates.\n\n> When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their **[xxx]** to college-level courses.\n\n原文的 improve their graduation rates 是近些年大学继续推行这种做法时希望取得的结果，方向是提高。A 的 maintain 却说维持，并把它放到 original purpose 的“最初”上。后面的 When this practice first started 已另起一句，明确给出过去的对象和目的：新生第一年遇到课程困难，给一次重学机会。不能把现在提高毕业率的目的往前移，改成当初保持毕业率。\n\n**近些年想提高毕业率，能替代几十年前给新生第二次机会的目的吗？**\n\n不能。A 同时改了时间和动作：原文近年的 improve 不是最初的 maintain，过去那句落在新生重学课程上。\n\n**第一轮判断：A排除。**","html":"<h3>A. To maintain colleges’ graduation rates.</h3>\n<blockquote>\n<p>维持大学的毕业率。</p>\n</blockquote>\n<p>把A接回题干，它说的是：成绩宽免最初是为了维持大学的毕业率。</p>\n<p>A 的 maintain 指维持某个水平，原文的 improve their graduation rates 也在说学校想达到怎样的毕业率；因此先看这句的时间，再与 first started 引出的过去一句合看。</p>\n<blockquote>\n<p>The use of this little-known practice has accelerated in recent years, as colleges continue to do their <strong>[xxx]</strong> to keep students in school (and paying tuition) and improve their graduation rates.</p>\n</blockquote>\n<blockquote>\n<p>When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their <strong>[xxx]</strong> to college-level courses.</p>\n</blockquote>\n<p>原文的 improve their graduation rates 是近些年大学继续推行这种做法时希望取得的结果，方向是提高。A 的 maintain 却说维持，并把它放到 original purpose 的“最初”上。后面的 When this practice first started 已另起一句，明确给出过去的对象和目的：新生第一年遇到课程困难，给一次重学机会。不能把现在提高毕业率的目的往前移，改成当初保持毕业率。</p>\n<p><strong>近些年想提高毕业率，能替代几十年前给新生第二次机会的目的吗？</strong></p>\n<p>不能。A 同时改了时间和动作：原文近年的 improve 不是最初的 maintain，过去那句落在新生重学课程上。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[307,795,1240,35],[228,851,1320,37],[228,909,1320,37],[228,968,1320,36],[228,1026,1319,36],[228,1084,1319,36],[228,1142,1261,35]],"questionRects":[[254,637,913,35],[315,708,678,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A 的 maintain 指维持某个水平，原文的 improve their graduation rates 也在说学校想达到怎样的毕业率；因此先看这句的时间，再与 first started 引出的过去一句合看。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time","action_direction"],"visibleSourceAnchor":"improve their graduation rates","visibleOptionAnchor":"maintain"}}}},{"section":"27题","raw":"### B. To increase universities’ income from tuition.\n\n> 增加大学从学费中获得的收入。\n\n把B接回题干，它说的是：成绩宽免最初是为了增加大学的学费收入。\n\nB 的 income from tuition 指学费收入，原文的 paying tuition 是学生继续缴纳学费；两者连在收钱与交钱上，所以回看含括号的第一句，再对照下面刚开始时的做法。\n\n> The use of this little-known practice has accelerated in recent years, as colleges continue to do their **[xxx]** to keep students in school (and paying tuition) and improve their graduation rates.\n\n> When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their **[xxx]** to college-level courses.\n\n原文把 paying tuition 放在近些年留住学生的括号里，学生继续在校，也就继续交学费。B 的 income from tuition 能对上钱从哪里来，却把这一近年的考虑接成了最初目的。过去一句的 to give them a second chance 说明的是给新生第二次学习机会，没有把最初的受益对象写成学校收入。学费这两个字相同，时间与目的的接法却不同。\n\n**第一句近年的缴学费，能接到题干最初的目的上吗？**\n\n不能。B 把近些年学校留住缴费学生的考虑移到了几十年前，而过去的目的句明确在讲新生再修课程的机会。\n\n**第一轮判断：B排除。**","html":"<h3>B. To increase universities’ income from tuition.</h3>\n<blockquote>\n<p>增加大学从学费中获得的收入。</p>\n</blockquote>\n<p>把B接回题干，它说的是：成绩宽免最初是为了增加大学的学费收入。</p>\n<p>B 的 income from tuition 指学费收入，原文的 paying tuition 是学生继续缴纳学费；两者连在收钱与交钱上，所以回看含括号的第一句，再对照下面刚开始时的做法。</p>\n<blockquote>\n<p>The use of this little-known practice has accelerated in recent years, as colleges continue to do their <strong>[xxx]</strong> to keep students in school (and paying tuition) and improve their graduation rates.</p>\n</blockquote>\n<blockquote>\n<p>When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their <strong>[xxx]</strong> to college-level courses.</p>\n</blockquote>\n<p>原文把 paying tuition 放在近些年留住学生的括号里，学生继续在校，也就继续交学费。B 的 income from tuition 能对上钱从哪里来，却把这一近年的考虑接成了最初目的。过去一句的 to give them a second chance 说明的是给新生第二次学习机会，没有把最初的受益对象写成学校收入。学费这两个字相同，时间与目的的接法却不同。</p>\n<p><strong>第一句近年的缴学费，能接到题干最初的目的上吗？</strong></p>\n<p>不能。B 把近些年学校留住缴费学生的考虑移到了几十年前，而过去的目的句明确在讲新生再修课程的机会。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[307,795,1240,35],[228,851,1320,37],[228,909,1320,37],[228,968,1320,36],[228,1026,1319,36],[228,1084,1319,36],[228,1142,1261,35]],"questionRects":[[254,637,913,35],[315,778,786,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B 的 income from tuition 指学费收入，原文的 paying tuition 是学生继续缴纳学费；两者连在收钱与交钱上，所以回看含括号的第一句，再对照下面刚开始时的做法。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time","object"],"visibleSourceAnchor":"paying tuition","visibleOptionAnchor":"income from tuition"}}}},{"section":"27题","raw":"### C. To prepare graduates for a **[xxx]** future.\n\n> 让毕业生为一个 **[xxx]** 的未来做好准备。\n\n把C接回题干，它说的是：成绩宽免最初是为了让毕业生为一个 **[xxx]** 的未来做好准备。\n\nC 的 graduates 是毕业生，原文的 freshmen 是新生；都是学生身份，但处于不同阶段，所以回看 first started 那句对最初受益学生的限定。\n\n> When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their **[xxx]** to college-level courses.\n\n原文把最初对象限定为 freshmen，并再用 in their first year 说明他们刚入学；机会也是重新上一门课，处理眼前大学课程学起来吃力的问题。C 的 graduates 却跳到毕业阶段，又把目的改成准备未来。未来前面的修饰词虽然不认识，但它不能把“毕业生”改成“刚入学的新生”，也不能把毕业后的准备改成第一年再学一遍课程。\n\n**不管未来前面是什么修饰词，毕业生能成为这句最初限定的新生吗？**\n\n不能。graduates 与 freshmen 对应不同阶段，原文的 first year 又把时间说得很清楚；C 的对象已经错了。\n\n**第一轮判断：C排除。**","html":"<h3>C. To prepare graduates for a <strong>[xxx]</strong> future.</h3>\n<blockquote>\n<p>让毕业生为一个 <strong>[xxx]</strong> 的未来做好准备。</p>\n</blockquote>\n<p>把C接回题干，它说的是：成绩宽免最初是为了让毕业生为一个 <strong>[xxx]</strong> 的未来做好准备。</p>\n<p>C 的 graduates 是毕业生，原文的 freshmen 是新生；都是学生身份，但处于不同阶段，所以回看 first started 那句对最初受益学生的限定。</p>\n<blockquote>\n<p>When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their <strong>[xxx]</strong> to college-level courses.</p>\n</blockquote>\n<p>原文把最初对象限定为 freshmen，并再用 in their first year 说明他们刚入学；机会也是重新上一门课，处理眼前大学课程学起来吃力的问题。C 的 graduates 却跳到毕业阶段，又把目的改成准备未来。未来前面的修饰词虽然不认识，但它不能把“毕业生”改成“刚入学的新生”，也不能把毕业后的准备改成第一年再学一遍课程。</p>\n<p><strong>不管未来前面是什么修饰词，毕业生能成为这句最初限定的新生吗？</strong></p>\n<p>不能。graduates 与 freshmen 对应不同阶段，原文的 first year 又把时间说得很清楚；C 的对象已经错了。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[307,795,1240,35],[228,851,1320,37],[228,909,1320,37],[228,968,1320,36],[228,1026,1319,36],[228,1084,1319,36],[228,1142,1261,35]],"questionRects":[[254,637,913,35],[315,849,791,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C 的 graduates 是毕业生，原文的 freshmen 是新生；都是学生身份，但处于不同阶段，所以回看 first started 那句对最初受益学生的限定。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","time"],"visibleSourceAnchor":"freshmen","visibleOptionAnchor":"graduates"}}}},{"section":"27题","raw":"### D. To help freshmen adapt to college learning.\n\n> 帮助新生适应大学学习。\n\n把D接回题干，它说的是：成绩宽免最初是为了帮助新生适应大学学习。\n\nD 的 adapt to college learning 是适应大学学习，原文的 college-level courses 指他们正在面对的大学课程；两处对象相同，再由 freshmen 找到同一批学生，所以回看给予第二次机会的那句。\n\n> When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their **[xxx]** to college-level courses.\n\n原文写新生第一年面对 college-level courses 学得吃力，学校就给他们第二次上课的机会。D 的 adapt to college learning 说帮助他们适应大学学习：对象仍是新生，困难仍在大学课程，办法是允许重新学习。struggled 后面的具体过程有一个词看不懂，但“大学第一年学得吃力—再给一次上课机会”已经能说明学校在帮助学生应付新的学习要求，D 没有把它换成毕业后的就业准备。\n\n**让第一年学大学课程吃力的新生再学一次，能起到帮助适应大学学习的作用吗？**\n\n能。D 把新生、大学课程和第二次学习机会接到一起，回答了过去这项做法帮助谁、解决什么学习问题。\n\n**第一轮判断：D保留。**","html":"<h3>D. To help freshmen adapt to college learning.</h3>\n<blockquote>\n<p>帮助新生适应大学学习。</p>\n</blockquote>\n<p>把D接回题干，它说的是：成绩宽免最初是为了帮助新生适应大学学习。</p>\n<p>D 的 adapt to college learning 是适应大学学习，原文的 college-level courses 指他们正在面对的大学课程；两处对象相同，再由 freshmen 找到同一批学生，所以回看给予第二次机会的那句。</p>\n<blockquote>\n<p>When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their <strong>[xxx]</strong> to college-level courses.</p>\n</blockquote>\n<p>原文写新生第一年面对 college-level courses 学得吃力，学校就给他们第二次上课的机会。D 的 adapt to college learning 说帮助他们适应大学学习：对象仍是新生，困难仍在大学课程，办法是允许重新学习。struggled 后面的具体过程有一个词看不懂，但“大学第一年学得吃力—再给一次上课机会”已经能说明学校在帮助学生应付新的学习要求，D 没有把它换成毕业后的就业准备。</p>\n<p><strong>让第一年学大学课程吃力的新生再学一次，能起到帮助适应大学学习的作用吗？</strong></p>\n<p>能。D 把新生、大学课程和第二次学习机会接到一起，回答了过去这项做法帮助谁、解决什么学习问题。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[307,795,1240,35],[228,851,1320,37],[228,909,1320,37],[228,968,1320,36],[228,1026,1319,36],[228,1084,1319,36],[228,1142,1261,35]],"questionRects":[[254,637,913,35],[315,919,757,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D 的 adapt to college learning 是适应大学学习，原文的 college-level courses 指他们正在面对的大学课程；两处对象相同，再由 freshmen 找到同一批学生，所以回看给予第二次机会的那句。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"visibleSourceAnchor":"college-level courses","visibleOptionAnchor":"adapt to college learning"}}}},{"section":"27题","raw":"### 27题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C排除；\n- D保留。\n\nA、B 把近些年的考虑移到最初，C 换成了毕业生；D 与当年帮助新生重学大学课程的目的相接。第一次选 D。\n\n> **27题选D。**","html":"<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>A、B 把近些年的考虑移到最初，C 换成了毕业生；D 与当年帮助新生重学大学课程的目的相接。第一次选 D。</p>\n<blockquote>\n<p><strong>27题选D。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"27"}},{"section":"28题","raw":"## 28题\n\n> According to Paragraph 5, grade forgiveness enables colleges to ______.  \n> 根据第五段，成绩宽免使大学能够做什么？\n\n题干直接写了 Paragraph 5，我们回第五段从头读到结尾。\n\n> 原文参考：\n>\n> That said, there is a way in which grade forgiveness satisfies colleges’ own needs as well. For public institutions, state funds are sometimes tied partly to their success on **[xxx]** such as graduation rates and student **[xxx]**—so better grades can, by **[xxx]** figures like those, mean more money. And anything that raises GPAs will likely make students—who, at the end of the day, are paying the bill—feel they’ve gotten a better value for their tuition dollars, which is another big concern for colleges.\n>\n> 开始精读：\n>\n> That said, there is a way / in which grade forgiveness satisfies / colleges’ own needs as well. / For public institutions, / state funds are sometimes tied partly / to their success on **[xxx]** / such as graduation rates and student **[xxx]**— / so better grades can, / by **[xxx]** figures like those, / mean more money. / And anything that raises GPAs / will likely make students— / who, at the end of the day, / are paying the bill— / feel they’ve gotten a better value / for their tuition dollars, / which is another big concern for colleges.\n>\n> 话虽如此，有一种方式 / 通过这种方式成绩宽免满足 / 大学自己的需要，也一样。 / 对公立机构来说， / 州资金有时部分地关联 / 到它们在 **[xxx]** 上的成功 / 比如毕业率和学生 **[xxx]**—— / 因此更好的成绩能够， / 通过 **[xxx]** 像那样的数字， / 意味着更多的钱。 / 而且任何提高平均绩点的东西 / 可能会让学生—— / 这些人，说到底， / 在付账—— / 感觉他们已经得到了更好的价值 / 相对于他们花的学费， / 这是大学的另一个重大关切。\n\n这段开头说这种做法也满足 colleges’ own needs，接着从钱说起：州里的拨款部分连着一些学校表现，较好的成绩可能意味着更多的钱；学生还会觉得学费花得更值。题目要补的是大学因此能够得到什么。","html":"<h2>28题</h2>\n<blockquote>\n<p>According to Paragraph 5, grade forgiveness enables colleges to ______.<br>根据第五段，成绩宽免使大学能够做什么？</p>\n</blockquote>\n<p>题干直接写了 Paragraph 5，我们回第五段从头读到结尾。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>That said, there is a way in which grade forgiveness satisfies colleges’ own needs as well. For public institutions, state funds are sometimes tied partly to their success on <strong>[xxx]</strong> such as graduation rates and student <strong>[xxx]</strong>—so better grades can, by <strong>[xxx]</strong> figures like those, mean more money. And anything that raises GPAs will likely make students—who, at the end of the day, are paying the bill—feel they’ve gotten a better value for their tuition dollars, which is another big concern for colleges.</p>\n<p>开始精读：</p>\n<p>That said, there is a way / in which grade forgiveness satisfies / colleges’ own needs as well. / For public institutions, / state funds are sometimes tied partly / to their success on <strong>[xxx]</strong> / such as graduation rates and student <strong>[xxx]</strong>— / so better grades can, / by <strong>[xxx]</strong> figures like those, / mean more money. / And anything that raises GPAs / will likely make students— / who, at the end of the day, / are paying the bill— / feel they’ve gotten a better value / for their tuition dollars, / which is another big concern for colleges.</p>\n<p>话虽如此，有一种方式 / 通过这种方式成绩宽免满足 / 大学自己的需要，也一样。 / 对公立机构来说， / 州资金有时部分地关联 / 到它们在 <strong>[xxx]</strong> 上的成功 / 比如毕业率和学生 <strong>[xxx]</strong>—— / 因此更好的成绩能够， / 通过 <strong>[xxx]</strong> 像那样的数字， / 意味着更多的钱。 / 而且任何提高平均绩点的东西 / 可能会让学生—— / 这些人，说到底， / 在付账—— / 感觉他们已经得到了更好的价值 / 相对于他们花的学费， / 这是大学的另一个重大关切。</p>\n</blockquote>\n<p>这段开头说这种做法也满足 colleges’ own needs，接着从钱说起：州里的拨款部分连着一些学校表现，较好的成绩可能意味着更多的钱；学生还会觉得学费花得更值。题目要补的是大学因此能够得到什么。</p>\n","articleRects":[[307,1547,1241,36],[228,1605,1320,36],[228,1663,1321,35],[228,1721,1320,35],[227,1779,1321,35],[228,1837,1319,35],[228,1895,528,35]],"questionRects":[[254,1060,1246,35]],"scrollTarget":"auto","meta":{"kind":"question","qid":"28"}},{"section":"28题","raw":"### A. obtain more financial support\n\n> 获得更多经济支持。\n\n把A接回题干，它说的是：成绩宽免使大学能够获得更多经济支持。\n\nA 的 financial support 指经济支持，原文的 state funds 正是州里给学校的钱；more 又能接到后面的 more money，所以回看说明拨款怎样与学校表现相连的那句。\n\n> For public institutions, state funds are sometimes tied partly to their success on **[xxx]** such as graduation rates and student **[xxx]**—so better grades can, by **[xxx]** figures like those, mean more money.\n\n原文说 state funds 有时部分取决于学校在某些方面的表现，后面紧接 so，落到 better grades 可以意味着 more money。A 的 financial support 对应这笔来自州里的资金，obtain more 则对应 money 增多。中间的项目名称和具体改变数字的动作有词没读清，不过“拨款与表现相连—更好的成绩可能带来更多的钱”两头和 so 的连接都已经写出来；A 也只是说使大学能够获得，并没有说每所大学必然拿到固定金额。\n\n**更好的成绩可能带来更多州拨款，能说明大学能够获得更多经济支持吗？**\n\n能。state funds 把钱的性质说明了，more money 把增加说明了，A 与这句的结果相接。\n\n**第一轮判断：A保留。**","html":"<h3>A. obtain more financial support</h3>\n<blockquote>\n<p>获得更多经济支持。</p>\n</blockquote>\n<p>把A接回题干，它说的是：成绩宽免使大学能够获得更多经济支持。</p>\n<p>A 的 financial support 指经济支持，原文的 state funds 正是州里给学校的钱；more 又能接到后面的 more money，所以回看说明拨款怎样与学校表现相连的那句。</p>\n<blockquote>\n<p>For public institutions, state funds are sometimes tied partly to their success on <strong>[xxx]</strong> such as graduation rates and student <strong>[xxx]</strong>—so better grades can, by <strong>[xxx]</strong> figures like those, mean more money.</p>\n</blockquote>\n<p>原文说 state funds 有时部分取决于学校在某些方面的表现，后面紧接 so，落到 better grades 可以意味着 more money。A 的 financial support 对应这笔来自州里的资金，obtain more 则对应 money 增多。中间的项目名称和具体改变数字的动作有词没读清，不过“拨款与表现相连—更好的成绩可能带来更多的钱”两头和 so 的连接都已经写出来；A 也只是说使大学能够获得，并没有说每所大学必然拿到固定金额。</p>\n<p><strong>更好的成绩可能带来更多州拨款，能说明大学能够获得更多经济支持吗？</strong></p>\n<p>能。state funds 把钱的性质说明了，more money 把增加说明了，A 与这句的结果相接。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[307,1547,1241,36],[228,1605,1320,36],[228,1663,1321,35],[228,1721,1320,35],[227,1779,1321,35],[228,1837,1319,35],[228,1895,528,35]],"questionRects":[[254,1060,1246,35],[315,1130,525,36]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A 的 financial support 指经济支持，原文的 state funds 正是州里给学校的钱；more 又能接到后面的 more money，所以回看说明拨款怎样与学校表现相连的那句。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"state funds","visibleOptionAnchor":"financial support"}}}},{"section":"28题","raw":"### B. improve their teaching quality\n\n> 提高它们的教学质量。\n\n把B接回题干，它说的是：成绩宽免使大学能够提高教学质量。\n\nB 的 teaching quality 指学校实际教得怎样，第五段的 better value for their tuition dollars 则是学生认为学费花得更值；都涉及学生对教育的评价，因此回看段尾这句话，分清究竟是谁觉得什么变好了。\n\n> And anything that raises GPAs will likely make students—who, at the end of the day, are paying the bill—feel they’ve gotten a better value for their tuition dollars, which is another big concern for colleges.\n\n原文先写 raises GPAs，再说这会让付钱的学生 feel 自己得到 better value for their tuition dollars。这里变的是成绩，以及学生对花钱是否值当的感受。B 的 teaching quality 却把“学生觉得花得值”改成“大学实际提高了教学质量”，把感受的内容当成教学本身已发生的改善。学生拿到更好看的平均分便觉得满意，并不要求老师的教法、课程内容或教学水平随之提高；第五段给出的获益途径正是成绩与付费感受相连。\n\n**学生因为平均分升高而觉得学费更值，就等于大学实际提高了教学质量吗？**\n\n不等于。原文明确说的是 feel，B 却把感受改成教学质量本身的提高，两边所说的变化对象不同。\n\n**第一轮判断：B排除。**","html":"<h3>B. improve their teaching quality</h3>\n<blockquote>\n<p>提高它们的教学质量。</p>\n</blockquote>\n<p>把B接回题干，它说的是：成绩宽免使大学能够提高教学质量。</p>\n<p>B 的 teaching quality 指学校实际教得怎样，第五段的 better value for their tuition dollars 则是学生认为学费花得更值；都涉及学生对教育的评价，因此回看段尾这句话，分清究竟是谁觉得什么变好了。</p>\n<blockquote>\n<p>And anything that raises GPAs will likely make students—who, at the end of the day, are paying the bill—feel they’ve gotten a better value for their tuition dollars, which is another big concern for colleges.</p>\n</blockquote>\n<p>原文先写 raises GPAs，再说这会让付钱的学生 feel 自己得到 better value for their tuition dollars。这里变的是成绩，以及学生对花钱是否值当的感受。B 的 teaching quality 却把“学生觉得花得值”改成“大学实际提高了教学质量”，把感受的内容当成教学本身已发生的改善。学生拿到更好看的平均分便觉得满意，并不要求老师的教法、课程内容或教学水平随之提高；第五段给出的获益途径正是成绩与付费感受相连。</p>\n<p><strong>学生因为平均分升高而觉得学费更值，就等于大学实际提高了教学质量吗？</strong></p>\n<p>不等于。原文明确说的是 feel，B 却把感受改成教学质量本身的提高，两边所说的变化对象不同。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[307,1547,1241,36],[228,1605,1320,36],[228,1663,1321,35],[228,1721,1320,35],[227,1779,1321,35],[228,1837,1319,35],[228,1895,528,35]],"questionRects":[[254,1060,1246,35],[315,1201,534,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B 的 teaching quality 指学校实际教得怎样，第五段的 better value for their tuition dollars 则是学生认为学费花得更值；都涉及学生对教育的评价，因此回看段尾这句话，分清究竟是谁觉得什么变好了。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","visible_link"],"visibleSourceAnchor":"better value for their tuition dollars","visibleOptionAnchor":"teaching quality"}}}},{"section":"28题","raw":"### C. boost their student **[xxx]**\n\n> 提高它们的学生 **[xxx]**。\n\n把C接回题干，它说的是：成绩宽免使大学能够提高它们的学生 **[xxx]**。\n\nC 的 boost 说把某项与学生有关的东西往上提高，原文的 figures like those 也指前面列举的学校表现数字，其中紧跟毕业率还出现了 student；因此回看州拨款与这些数字联系的那句。\n\n> For public institutions, state funds are sometimes tied partly to their success on **[xxx]** such as graduation rates and student **[xxx]**—so better grades can, by **[xxx]** figures like those, mean more money.\n\n原文把毕业率和一项 student 后面的内容并排举出，随后说通过对 figures like those 做某种动作，更好成绩可以意味着更多钱。C 的 boost 也是提高，但学生后面的名词不认识，所以还不知道它要提高的是哪一项。原文的 student 后面同样有未读清的内容，不能因为两处都写 student 就认定相同，也不能断言它们一定不同。此时 C 可能接得上学校表现这一部分，究竟提高什么还说不清。\n\n**学生后面的具体项目没有读清，能只因它不是“钱”就把 C 排掉吗？**\n\n不能。这句在钱之前确实列出了学生方面的项目，C 可能是在说其中某项变化；目前不能把两个学生项目的关系彻底分开。\n\n**第一轮判断：C保留。**","html":"<h3>C. boost their student <strong>[xxx]</strong></h3>\n<blockquote>\n<p>提高它们的学生 <strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把C接回题干，它说的是：成绩宽免使大学能够提高它们的学生 <strong>[xxx]</strong>。</p>\n<p>C 的 boost 说把某项与学生有关的东西往上提高，原文的 figures like those 也指前面列举的学校表现数字，其中紧跟毕业率还出现了 student；因此回看州拨款与这些数字联系的那句。</p>\n<blockquote>\n<p>For public institutions, state funds are sometimes tied partly to their success on <strong>[xxx]</strong> such as graduation rates and student <strong>[xxx]</strong>—so better grades can, by <strong>[xxx]</strong> figures like those, mean more money.</p>\n</blockquote>\n<p>原文把毕业率和一项 student 后面的内容并排举出，随后说通过对 figures like those 做某种动作，更好成绩可以意味着更多钱。C 的 boost 也是提高，但学生后面的名词不认识，所以还不知道它要提高的是哪一项。原文的 student 后面同样有未读清的内容，不能因为两处都写 student 就认定相同，也不能断言它们一定不同。此时 C 可能接得上学校表现这一部分，究竟提高什么还说不清。</p>\n<p><strong>学生后面的具体项目没有读清，能只因它不是“钱”就把 C 排掉吗？</strong></p>\n<p>不能。这句在钱之前确实列出了学生方面的项目，C 可能是在说其中某项变化；目前不能把两个学生项目的关系彻底分开。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[307,1547,1241,36],[228,1605,1320,36],[228,1663,1321,35],[228,1721,1320,35],[227,1779,1321,35],[228,1837,1319,35],[228,1895,528,35]],"questionRects":[[254,1060,1246,35],[315,1271,544,28]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C 的 boost 说把某项与学生有关的东西往上提高，原文的 figures like those 也指前面列举的学校表现数字，其中紧跟毕业率还出现了 student；因此回看州拨款与这些数字联系的那句。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"visibleSourceAnchor":"figures like those","visibleOptionAnchor":"boost"}}}},{"section":"28题","raw":"### D. meet local governments’ needs\n\n> 满足地方政府的需要。\n\n把D接回题干，它说的是：成绩宽免使大学能够满足地方政府的需要。\n\nD 的 local governments’ needs 把需要的主体写成地方政府，段首的 colleges’ own needs 则明说是大学自己的需要；两边都谈满足谁，所以先看开头，再联系州拨款那句分清政府在这里扮演什么角色。\n\n> That said, there is a way in which grade forgiveness satisfies colleges’ own needs as well.\n\n> For public institutions, state funds are sometimes tied partly to their success on **[xxx]** such as graduation rates and student **[xxx]**—so better grades can, by **[xxx]** figures like those, mean more money.\n\n原文用 colleges’ own needs 指出大学是需要获得满足的一方，州资金出现在后面，是大学可能获得的钱。D 的 local governments’ needs 把拨款的一方改成需要被满足的一方。国家或地方提供资金，与学校因此满足自己的资金需要，是两种角色；原文列出的结果还是 more money，钱流向公立学校，并不是学校在满足某项政府要求。\n\n**州里给学校的钱，能把“满足学校需要”改成“满足政府需要”吗？**\n\n不能。state funds 说明资金从哪里来，colleges’ own needs 说明这里满足谁；D 把这两个角色换了。\n\n**第一轮判断：D排除。**","html":"<h3>D. meet local governments’ needs</h3>\n<blockquote>\n<p>满足地方政府的需要。</p>\n</blockquote>\n<p>把D接回题干，它说的是：成绩宽免使大学能够满足地方政府的需要。</p>\n<p>D 的 local governments’ needs 把需要的主体写成地方政府，段首的 colleges’ own needs 则明说是大学自己的需要；两边都谈满足谁，所以先看开头，再联系州拨款那句分清政府在这里扮演什么角色。</p>\n<blockquote>\n<p>That said, there is a way in which grade forgiveness satisfies colleges’ own needs as well.</p>\n</blockquote>\n<blockquote>\n<p>For public institutions, state funds are sometimes tied partly to their success on <strong>[xxx]</strong> such as graduation rates and student <strong>[xxx]</strong>—so better grades can, by <strong>[xxx]</strong> figures like those, mean more money.</p>\n</blockquote>\n<p>原文用 colleges’ own needs 指出大学是需要获得满足的一方，州资金出现在后面，是大学可能获得的钱。D 的 local governments’ needs 把拨款的一方改成需要被满足的一方。国家或地方提供资金，与学校因此满足自己的资金需要，是两种角色；原文列出的结果还是 more money，钱流向公立学校，并不是学校在满足某项政府要求。</p>\n<p><strong>州里给学校的钱，能把“满足学校需要”改成“满足政府需要”吗？</strong></p>\n<p>不能。state funds 说明资金从哪里来，colleges’ own needs 说明这里满足谁；D 把这两个角色换了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[307,1547,1241,36],[228,1605,1320,36],[228,1663,1321,35],[228,1721,1320,35],[227,1779,1321,35],[228,1837,1319,35],[228,1895,528,35]],"questionRects":[[254,1060,1246,35],[315,1342,548,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D 的 local governments’ needs 把需要的主体写成地方政府，段首的 colleges’ own needs 则明说是大学自己的需要；两边都谈满足谁，所以先看开头，再联系州拨款那句分清政府在这里扮演什么角色。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","object"],"visibleSourceAnchor":"colleges’ own needs","visibleOptionAnchor":"local governments’ needs"}}}},{"section":"28题","raw":"### 28题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C保留；\n- D排除。\n\nA 对上州拨款和更多的钱；C 中学生后面的项目没读清。B 把付费感受改成教学质量，D 把学校需要改成政府需要。第一次留下 A、C。","html":"<h3>28题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>A 对上州拨款和更多的钱；C 中学生后面的项目没读清。B 把付费感受改成教学质量，D 把学校需要改成政府需要。第一次留下 A、C。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> What does the phrase “to be aligned” (Para. 6) most probably mean?  \n> 第六段中的 to be aligned 最可能是什么意思？\n\n题干直接给了 Para. 6 和 to be aligned。我们回第六段，先把整段读完，再看最后这组词接着前面哪件事。\n\n> 原文参考：\n>\n> Indeed, grade forgiveness is just another way that universities are responding to consumers’ expectations for higher education. Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as **[xxx]** as possible—or at least appear to be. On this, students’ and colleges’ **[xxx]** seem to be aligned.\n>\n> 开始精读：\n>\n> Indeed, grade forgiveness is just another way / that universities are responding / to consumers’ expectations for higher education. / Since students and parents expect / a college degree to lead to a job, / it is in the best interest of a school / to turn out graduates / who are as **[xxx]** as possible— / or at least appear to be. / On this, / students’ and colleges’ **[xxx]** / seem to be aligned.\n>\n> 确实，成绩宽免只是另一种方式 / 大学正在以此回应 / 消费者对高等教育的期待。 / 既然学生与家长期望 / 一个大学学位通向一份工作， / 这符合一所学校的最大利益 / 去培养毕业生 / 他们尽可能地 **[xxx]**—— / 或者至少看起来是这样。 / 在这件事上， / 学生的与大学的 **[xxx]** / 似乎 to be aligned。\n\n最后一句前面是 On this，意思是在刚说的这件事上。前面两句把两边摆出来：学生与家长希望大学学位通向工作，学校也觉得培养尽可能 **[xxx]**、或者至少显得如此的毕业生最符合自己的利益。空格里的词要解释这两边在这件事上怎样相处。","html":"<h2>29题</h2>\n<blockquote>\n<p>What does the phrase “to be aligned” (Para. 6) most probably mean?<br>第六段中的 to be aligned 最可能是什么意思？</p>\n</blockquote>\n<p>题干直接给了 Para. 6 和 to be aligned。我们回第六段，先把整段读完，再看最后这组词接着前面哪件事。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Indeed, grade forgiveness is just another way that universities are responding to consumers’ expectations for higher education. Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as <strong>[xxx]</strong> as possible—or at least appear to be. On this, students’ and colleges’ <strong>[xxx]</strong> seem to be aligned.</p>\n<p>开始精读：</p>\n<p>Indeed, grade forgiveness is just another way / that universities are responding / to consumers’ expectations for higher education. / Since students and parents expect / a college degree to lead to a job, / it is in the best interest of a school / to turn out graduates / who are as <strong>[xxx]</strong> as possible— / or at least appear to be. / On this, / students’ and colleges’ <strong>[xxx]</strong> / seem to be aligned.</p>\n<p>确实，成绩宽免只是另一种方式 / 大学正在以此回应 / 消费者对高等教育的期待。 / 既然学生与家长期望 / 一个大学学位通向一份工作， / 这符合一所学校的最大利益 / 去培养毕业生 / 他们尽可能地 <strong>[xxx]</strong>—— / 或者至少看起来是这样。 / 在这件事上， / 学生的与大学的 <strong>[xxx]</strong> / 似乎 to be aligned。</p>\n</blockquote>\n<p>最后一句前面是 On this，意思是在刚说的这件事上。前面两句把两边摆出来：学生与家长希望大学学位通向工作，学校也觉得培养尽可能 <strong>[xxx]</strong>、或者至少显得如此的毕业生最符合自己的利益。空格里的词要解释这两边在这件事上怎样相处。</p>\n","articleRects":[[308,1953,1240,35],[228,2010,1319,36],[228,2068,1320,36],[228,2126,1320,35],[228,2184,956,37]],"questionRects":[[254,1481,1209,37]],"scrollTarget":"auto","meta":{"kind":"question","qid":"29"}},{"section":"29题","raw":"### A. To **[xxx]** each other.\n\n> 彼此 **[xxx]**。\n\n把A接回题干，它说的是：这里的 to be aligned 最可能指两边彼此 **[xxx]**。\n\nA 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。\n\n> Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as **[xxx]** as possible—or at least appear to be.\n\n> On this, students’ and colleges’ **[xxx]** seem to be aligned.\n\n原文的 students’ and colleges’ 确实是两方；前文一边写学生希望学位通向工作，一边写学校认为培养这样的毕业生对自己最有利。A 的 each other 也要求两方建立某种关系，但它前面那个动词没有读清。只看到“相互”，还不知道它是把双方写成同向、对立，还是另一个动作。两方本身没有换掉，真正要比较的关系恰好还不清楚，因此不能直接把 A 判错。\n\n**只认出“彼此”，还不知道彼此做什么，能断定 A 与学生和学校的关系相反吗？**\n\n不能。A 保留了双方这一点，但相互之间的动作还没有读出来，暂时留下。\n\n**第一轮判断：A保留。**","html":"<h3>A. To <strong>[xxx]</strong> each other.</h3>\n<blockquote>\n<p>彼此 <strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把A接回题干，它说的是：这里的 to be aligned 最可能指两边彼此 <strong>[xxx]</strong>。</p>\n<p>A 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。</p>\n<blockquote>\n<p>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as <strong>[xxx]</strong> as possible—or at least appear to be.</p>\n</blockquote>\n<blockquote>\n<p>On this, students’ and colleges’ <strong>[xxx]</strong> seem to be aligned.</p>\n</blockquote>\n<p>原文的 students’ and colleges’ 确实是两方；前文一边写学生希望学位通向工作，一边写学校认为培养这样的毕业生对自己最有利。A 的 each other 也要求两方建立某种关系，但它前面那个动词没有读清。只看到“相互”，还不知道它是把双方写成同向、对立，还是另一个动作。两方本身没有换掉，真正要比较的关系恰好还不清楚，因此不能直接把 A 判错。</p>\n<p><strong>只认出“彼此”，还不知道彼此做什么，能断定 A 与学生和学校的关系相反吗？</strong></p>\n<p>不能。A 保留了双方这一点，但相互之间的动作还没有读出来，暂时留下。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[308,1953,1240,35],[228,2010,1319,36],[228,2068,1320,36],[228,2126,1320,35],[228,2184,956,37]],"questionRects":[[254,1481,1209,37],[315,1553,534,27]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A 的 each other 在说双方相互怎样，原文的 students’ and colleges’ 也把学生和学校两边并列；两边对象能对上，所以回看最后一句和它前面解释双方所求的那句。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"visibleSourceAnchor":"students’ and colleges’","visibleOptionAnchor":"each other"}}}},{"section":"29题","raw":"### B. To be contradictory to each other.\n\n> 彼此矛盾。\n\n把B接回题干，它说的是：这里的 to be aligned 最可能指学生和学校在这件事上彼此矛盾。\n\nB 的 contradictory 是说两边冲突，原文的 best interest 却用来说明学校怎样从学生希望的结果中得益；两者都在解释双方关系，所以把 Since 开头的因果句与最后一句一起看。\n\n> Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as **[xxx]** as possible—or at least appear to be.\n\n> On this, students’ and colleges’ **[xxx]** seem to be aligned.\n\n原文说学生与家长希望学位带来工作，接着用 Since 把这一期待连到学校的 best interest：学校培养符合这一期待的毕业生，也有利于自己。B 的 contradictory 则要求学生想要的结果损害学校、或学校想做的事违背学生期待。这里写的恰恰是学校顺着学生的期待行动也能得益，双方在这件事上并不是朝相反方向走。\n\n**学校回应学生的期待也符合自身利益，能称为双方彼此矛盾吗？**\n\n不能。学生所求与学校利益在这句里被连在一起，B 却改成冲突，方向相反。\n\n**第一轮判断：B排除。**","html":"<h3>B. To be contradictory to each other.</h3>\n<blockquote>\n<p>彼此矛盾。</p>\n</blockquote>\n<p>把B接回题干，它说的是：这里的 to be aligned 最可能指学生和学校在这件事上彼此矛盾。</p>\n<p>B 的 contradictory 是说两边冲突，原文的 best interest 却用来说明学校怎样从学生希望的结果中得益；两者都在解释双方关系，所以把 Since 开头的因果句与最后一句一起看。</p>\n<blockquote>\n<p>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as <strong>[xxx]</strong> as possible—or at least appear to be.</p>\n</blockquote>\n<blockquote>\n<p>On this, students’ and colleges’ <strong>[xxx]</strong> seem to be aligned.</p>\n</blockquote>\n<p>原文说学生与家长希望学位带来工作，接着用 Since 把这一期待连到学校的 best interest：学校培养符合这一期待的毕业生，也有利于自己。B 的 contradictory 则要求学生想要的结果损害学校、或学校想做的事违背学生期待。这里写的恰恰是学校顺着学生的期待行动也能得益，双方在这件事上并不是朝相反方向走。</p>\n<p><strong>学校回应学生的期待也符合自身利益，能称为双方彼此矛盾吗？</strong></p>\n<p>不能。学生所求与学校利益在这句里被连在一起，B 却改成冲突，方向相反。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[308,1953,1240,35],[228,2010,1319,36],[228,2068,1320,36],[228,2126,1320,35],[228,2184,956,37]],"questionRects":[[254,1481,1209,37],[315,1624,599,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B 的 contradictory 是说两边冲突，原文的 best interest 却用来说明学校怎样从学生希望的结果中得益；两者都在解释双方关系，所以把 Since 开头的因果句与最后一句一起看。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction"],"visibleSourceAnchor":"best interest","visibleOptionAnchor":"contradictory"}}}},{"section":"29题","raw":"### C. To be identical with each other.\n\n> 彼此相同。\n\n把C接回题干，它说的是：这里的 to be aligned 最可能指双方在这件事上是一致的。\n\nC 的 identical 是相同或一致，原文的 On this 将比较限定在刚才说的事情上；因此回看它前面学生的期望与学校的利益，判断相同的究竟是哪一方面。\n\n> Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as **[xxx]** as possible—or at least appear to be.\n\n> On this, students’ and colleges’ **[xxx]** seem to be aligned.\n\n原文的 On this 限定了范围：谈的是让大学培养的毕业生符合学生、家长对就业的期待这件事。学生希望大学学位有这种结果，学校也觉得顺着这种期待培养毕业生对自己最有利。C 的 identical 放回这个范围，指双方在这件事上的方向相同，不是说学生和大学身份相同，也不是说双方所有需要都完全一样。两边希望出现的结果能接到一起，C 可以解释这里的关系。\n\n**只看刚说的这件事，学生的期望和学校的利益方向能说是一致的吗？**\n\n能。On this 把范围限定在同一件事，前句又把学生所盼与学校最有利的做法连接起来，C 的“一致”可以接住。\n\n**第一轮判断：C保留。**","html":"<h3>C. To be identical with each other.</h3>\n<blockquote>\n<p>彼此相同。</p>\n</blockquote>\n<p>把C接回题干，它说的是：这里的 to be aligned 最可能指双方在这件事上是一致的。</p>\n<p>C 的 identical 是相同或一致，原文的 On this 将比较限定在刚才说的事情上；因此回看它前面学生的期望与学校的利益，判断相同的究竟是哪一方面。</p>\n<blockquote>\n<p>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as <strong>[xxx]</strong> as possible—or at least appear to be.</p>\n</blockquote>\n<blockquote>\n<p>On this, students’ and colleges’ <strong>[xxx]</strong> seem to be aligned.</p>\n</blockquote>\n<p>原文的 On this 限定了范围：谈的是让大学培养的毕业生符合学生、家长对就业的期待这件事。学生希望大学学位有这种结果，学校也觉得顺着这种期待培养毕业生对自己最有利。C 的 identical 放回这个范围，指双方在这件事上的方向相同，不是说学生和大学身份相同，也不是说双方所有需要都完全一样。两边希望出现的结果能接到一起，C 可以解释这里的关系。</p>\n<p><strong>只看刚说的这件事，学生的期望和学校的利益方向能说是一致的吗？</strong></p>\n<p>能。On this 把范围限定在同一件事，前句又把学生所盼与学校最有利的做法连接起来，C 的“一致”可以接住。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[308,1953,1240,35],[228,2010,1319,36],[228,2068,1320,36],[228,2126,1320,35],[228,2184,956,37]],"questionRects":[[254,1481,1209,37],[315,1694,565,28]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C 的 identical 是相同或一致，原文的 On this 将比较限定在刚才说的事情上；因此回看它前面学生的期望与学校的利益，判断相同的究竟是哪一方面。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"visibleSourceAnchor":"On this","visibleOptionAnchor":"identical"}}}},{"section":"29题","raw":"### D. To complement each other.\n\n> 彼此补充。\n\n把D接回题干，它说的是：这里的 to be aligned 最可能指学生和学校在这件事上彼此补充。\n\nD 的 complement 是一方补另一方所缺，原文的 responding to consumers’ expectations 写的却是大学回应消费者期待；两处都描述双方怎样联系，所以回看第一句，并接上随后具体的就业期待。\n\n> Indeed, grade forgiveness is just another way that universities are responding to consumers’ expectations for higher education.\n\n> Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as **[xxx]** as possible—or at least appear to be.\n\n原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。D 的 complement 则写成双方各缺一部分、由对方补上。前文两边反复落在同一个期待上，不是分别提供两种不同部分；“大学回应学生所求”不能改写成“学生和大学互相补足”。\n\n**双方都朝同一个期待靠近，就是双方各补对方的一处欠缺吗？**\n\n不等于。原文在解释两边为何追求同一结果，D 却把这种联系写成互相补足不同部分，改变了双方的关系。\n\n**第一轮判断：D排除。**","html":"<h3>D. To complement each other.</h3>\n<blockquote>\n<p>彼此补充。</p>\n</blockquote>\n<p>把D接回题干，它说的是：这里的 to be aligned 最可能指学生和学校在这件事上彼此补充。</p>\n<p>D 的 complement 是一方补另一方所缺，原文的 responding to consumers’ expectations 写的却是大学回应消费者期待；两处都描述双方怎样联系，所以回看第一句，并接上随后具体的就业期待。</p>\n<blockquote>\n<p>Indeed, grade forgiveness is just another way that universities are responding to consumers’ expectations for higher education.</p>\n</blockquote>\n<blockquote>\n<p>Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as <strong>[xxx]</strong> as possible—or at least appear to be.</p>\n</blockquote>\n<p>原文的 responding to consumers’ expectations 是大学顺着学生的期待作出回应：学生要学位通向工作，学校也觉得提供相应毕业生符合自己利益。D 的 complement 则写成双方各缺一部分、由对方补上。前文两边反复落在同一个期待上，不是分别提供两种不同部分；“大学回应学生所求”不能改写成“学生和大学互相补足”。</p>\n<p><strong>双方都朝同一个期待靠近，就是双方各补对方的一处欠缺吗？</strong></p>\n<p>不等于。原文在解释两边为何追求同一结果，D 却把这种联系写成互相补足不同部分，改变了双方的关系。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[308,1953,1240,35],[228,2010,1319,36],[228,2068,1320,36],[228,2126,1320,35],[228,2184,956,37]],"questionRects":[[254,1481,1209,37],[315,1765,491,35]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D 的 complement 是一方补另一方所缺，原文的 responding to consumers’ expectations 写的却是大学回应消费者期待；两处都描述双方怎样联系，所以回看第一句，并接上随后具体的就业期待。"],"evidenceParagraphPids":[5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction"],"visibleSourceAnchor":"responding to consumers’ expectations","visibleOptionAnchor":"complement"}}}},{"section":"29题","raw":"### 29题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C保留；\n- D排除。\n\nB 的对立和 D 的互补都与双方追求同一结果不同；C 的一致能接上，但 A 的相互动作还不清楚。第一次留下 A、C。","html":"<h3>29题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>B 的对立和 D 的互补都与双方追求同一结果不同；C 的一致能接上，但 A 的相互动作还不清楚。第一次留下 A、C。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n**The author examines the practice of grade forgiveness by ______.**\n\n作者通过什么方式来考察成绩宽免这种做法？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **assessing its feasibility**\n\n评估它是否可行\n\nB. **listing its long-run effects**\n\n列出它的长期影响\n\nC. **comparing different views on it**\n\n比较人们对它的不同看法\n\nD. **analyzing the causes behind it**\n\n分析它背后的原因","html":"<h2>30题</h2>\n<p><strong>The author examines the practice of grade forgiveness by ______.</strong></p>\n<p>作者通过什么方式来考察成绩宽免这种做法？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>assessing its feasibility</strong></p>\n<p>评估它是否可行</p>\n<p>B. <strong>listing its long-run effects</strong></p>\n<p>列出它的长期影响</p>\n<p>C. <strong>comparing different views on it</strong></p>\n<p>比较人们对它的不同看法</p>\n<p>D. <strong>analyzing the causes behind it</strong></p>\n<p>分析它背后的原因</p>\n","articleRects":[],"questionRects":[[255,1905,1130,36]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"30"}},{"section":"30题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n> 原文参考：\n>\n> Grade forgiveness allows students to retake a course in which they received a low grade, and the most recent grade or the highest grade is the only one that counts in **[xxx]** a student’s overall GPA.\n>\n> 开始精读：\n>\n> Grade forgiveness allows students / to retake a course / in which they received a low grade, / and the most recent grade / or the highest grade / is the only one that counts / in **[xxx]** a student’s overall GPA.\n>\n> 成绩宽免允许学生 / 重新上一门课 / 在这门课里他们得到了低分， / 并且最近一次的成绩 / 或者最高的成绩 / 是唯一算数的那个成绩 / 在 **[xxx]** 一名学生的总体平均绩点时。\n\n> 原文参考：\n>\n> College officials tend to emphasize that the goal of grade forgiveness is less about the grade itself and more about encouraging students to retake courses **[xxx]** to their degree program and graduation without **[xxx]** a big **[xxx]**. “**[xxx]**,” said Jack Miner, Ohio State University’s **[xxx]**, “we see students achieve more success because they retake a course and do better in **[xxx]** courses or master the content that allows them to graduate on time.”\n>\n> 开始精读：\n>\n> College officials tend to emphasize / that the goal of grade forgiveness / is less about the grade itself / and more about encouraging students / to retake courses **[xxx]** / to their degree program and graduation / without **[xxx]** a big **[xxx]**. / “**[xxx]**,” said Jack Miner, / Ohio State University’s **[xxx]**, / “we see students achieve more success / because they retake a course / and do better in **[xxx]** courses / or master the content / that allows them to graduate on time.”\n>\n> 大学管理人员倾向于强调 / 成绩宽免的目标 / 较少是关于分数本身 / 而更多是关于鼓励学生 / 重新修读 **[xxx]** 的课程 / 对于他们的学位项目与毕业 / 而不用 **[xxx]** 一个大的 **[xxx]**。 / “**[xxx]**，”Jack Miner 说， / 俄亥俄州立大学的 **[xxx]**， / “我们看到学生取得更多成功 / 因为他们重新上一门课 / 并在 **[xxx]** 课程中做得更好 / 或者掌握内容 / 这些内容使他们能按时毕业。”\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先从平均成绩上涨及教育消费化的通常解释切入，再提出成绩宽免也是提高成绩的一股力量。 | 先摆出一个现象，再补一个原因 |\n| 第2段 | 说明成绩宽免怎样运行：低分课可以重修，最近或最高的成绩才在总体绩点中算数。 | 再说这个做法到底是怎样的 |\n| 第3段 | 说明这项做法从帮助第一年遇到课程困难的新生，扩大到更多学生；近年的考虑包括留住学生、学费和毕业率。 | 回头解释起点，再说现在变了 |\n| 第4段 | 介绍学校人员强调的学习好处：鼓励重修、学得更好、掌握内容并按时毕业。 | 先说这件事怎样让一边得利 |\n| 第5段 | 转到学校自身的需要：较好的成绩可能带来更多州资金，也让付学费的学生觉得更值。 | 再说另一边也能从中得利 |\n| 第6段 | 把成绩宽免放回回应教育消费者期待的背景；学生希望学位通向工作，学校也从培养符合期待的毕业生中得益。 | 最后说双方为什么走到一起 |\n\n---","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Grade forgiveness allows students to retake a course in which they received a low grade, and the most recent grade or the highest grade is the only one that counts in <strong>[xxx]</strong> a student’s overall GPA.</p>\n<p>开始精读：</p>\n<p>Grade forgiveness allows students / to retake a course / in which they received a low grade, / and the most recent grade / or the highest grade / is the only one that counts / in <strong>[xxx]</strong> a student’s overall GPA.</p>\n<p>成绩宽免允许学生 / 重新上一门课 / 在这门课里他们得到了低分， / 并且最近一次的成绩 / 或者最高的成绩 / 是唯一算数的那个成绩 / 在 <strong>[xxx]</strong> 一名学生的总体平均绩点时。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>College officials tend to emphasize that the goal of grade forgiveness is less about the grade itself and more about encouraging students to retake courses <strong>[xxx]</strong> to their degree program and graduation without <strong>[xxx]</strong> a big <strong>[xxx]</strong>. “<strong>[xxx]</strong>,” said Jack Miner, Ohio State University’s <strong>[xxx]</strong>, “we see students achieve more success because they retake a course and do better in <strong>[xxx]</strong> courses or master the content that allows them to graduate on time.”</p>\n<p>开始精读：</p>\n<p>College officials tend to emphasize / that the goal of grade forgiveness / is less about the grade itself / and more about encouraging students / to retake courses <strong>[xxx]</strong> / to their degree program and graduation / without <strong>[xxx]</strong> a big <strong>[xxx]</strong>. / “<strong>[xxx]</strong>,” said Jack Miner, / Ohio State University’s <strong>[xxx]</strong>, / “we see students achieve more success / because they retake a course / and do better in <strong>[xxx]</strong> courses / or master the content / that allows them to graduate on time.”</p>\n<p>大学管理人员倾向于强调 / 成绩宽免的目标 / 较少是关于分数本身 / 而更多是关于鼓励学生 / 重新修读 <strong>[xxx]</strong> 的课程 / 对于他们的学位项目与毕业 / 而不用 <strong>[xxx]</strong> 一个大的 <strong>[xxx]</strong>。 / “<strong>[xxx]</strong>，”Jack Miner 说， / 俄亥俄州立大学的 <strong>[xxx]</strong>， / “我们看到学生取得更多成功 / 因为他们重新上一门课 / 并在 <strong>[xxx]</strong> 课程中做得更好 / 或者掌握内容 / 这些内容使他们能按时毕业。”</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先从平均成绩上涨及教育消费化的通常解释切入，再提出成绩宽免也是提高成绩的一股力量。</td>\n<td>先摆出一个现象，再补一个原因</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明成绩宽免怎样运行：低分课可以重修，最近或最高的成绩才在总体绩点
