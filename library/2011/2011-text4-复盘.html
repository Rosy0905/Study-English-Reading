&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段暗示，无子女者更不容易对生活感到满意。</p>\n</blockquote>\n<p><code>less likely to be satisfied</code>比较整个群体的满意可能性，第三段实际以<code>Unhappy parents</code>和<code>unhappy childless folks</code>作对照；回读末句，检查比较的是总体感受还是已经不快乐的人受到的评价。</p>\n<p><code>D</code>的<code>less likely to be satisfied</code>比较的是两大类人对生活满意的可能性。第三段先明确取出<code>unhappy parents</code>和<code>unhappy childless folks</code>，两组在这次比较里都已经不快乐；后面讨论的是一组是否被迫反思生育，另一组怎样被告知缺少孩子才痛苦。</p>\n<p>由此能比较他们受到的对待，不能算出全部父母或全部无子女者谁更容易满意。特别是“痛苦直接来自没有孩子”被放在社会施加的信息中，不能再当成作者统计出来的真实原因。</p>\n<p><code>D</code>把外界的归因当作实际满意度结果，还把两个已不快乐的小组扩大成整个群体。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n<p>不快乐的父母很少被人逼着反思当初是否不该生孩子，但不快乐的无子女者却被&quot;孩子是世界上最重要的事情&quot;这样的信息所困扰：显然他们的痛苦必定是生活中没有孩子留下的巨大空缺的直接结果。</p>\n</blockquote>\n<p>原句以 <code>unhappy parents</code> 与 <code>unhappy childless folks</code> 作对照，两组在这个例子里都已经不快乐。后面解释谁被追问、谁被归咎，而非统计谁更容易不快乐。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Childless people are generally less likely than parents to feel satisfied with their lives.</p>\n<p>总体而言，无子女者比父母更不容易对自己的生活感到满意。</p>\n</blockquote>\n<p><code>D</code> 需要对群体满意度的比较，实际对照的是已不快乐者受到的社会对待。被别人告知“你因没有孩子而痛苦”，不能变成作者验证过的满意度规律。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"38题结论","raw":"### 38题结论\n\n> **38. A. are constantly exposed to criticism**\n\n- A：它概括的 criticism 不只指当面辱骂，也包括反复把一种生活选择说成缺陷。社会持续颂扬生育，再把无子女者的不快乐归因于缺少孩子，构成这种压力。\n- B：它容易让人联想到前一段媒体总在展示明星母亲，于是自行补出媒体忽略无子女者。第三段实际讨论社会评价，未比较媒体对两类人的关注比例。\n- C：它借用“孩子最重要、没有孩子导致痛苦”的社会评价，改写成作者对无子女者的责任判决。作者实际在揭示这种评价的不公平。\n- D：它把外界对无子女者痛苦的归因当成事实，又从 unhappy childless folks 扩大到整个无子女群体，改成满意可能性的比较。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"conclusion","question":"38","questionConclusion":true},"html":"<blockquote>\n<p><strong>38. A. are constantly exposed to criticism</strong></p>\n</blockquote>\n<ul>\n<li>A：它概括的 criticism 不只指当面辱骂，也包括反复把一种生活选择说成缺陷。社会持续颂扬生育，再把无子女者的不快乐归因于缺少孩子，构成这种压力。</li>\n<li>B：它容易让人联想到前一段媒体总在展示明星母亲，于是自行补出媒体忽略无子女者。第三段实际讨论社会评价，未比较媒体对两类人的关注比例。</li>\n<li>C：它借用“孩子最重要、没有孩子导致痛苦”的社会评价，改写成作者对无子女者的责任判决。作者实际在揭示这种评价的不公平。</li>\n<li>D：它把外界对无子女者痛苦的归因当成事实，又从 unhappy childless folks 扩大到整个无子女群体，改成满意可能性的比较。</li>\n</ul>\n"},{"title":"39题 · 题干、题型与核心出处","raw":"## 39题\n\n> According to Paragraph 4, the message conveyed by celebrity magazines is ______.\n>\n> 根据第四段，明星杂志传达的信息具有怎样的性质？\n\n### 题型\n\n局部评价题。题干问第四段中明星杂志信息的性质，依据该段直接评价与普通单亲、明星单亲的条件对照判断；它不是全文作者态度题。\n\n### 核心出处\n\n> Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.\n>\n> According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all.\n>\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their \"own\" (read: with round-the-clock help) is a piece of cake.\n\n作者先说杂志形象 hugely unrealistic，再写普通单亲育儿的辛苦；明星却说 on their “own” 育儿是 a piece of cake，括号又揭出 round-the-clock help。失真之处在于隐去支援条件，让读者误判独自育儿的难度。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"question","question":"39","questionIntro":true},"html":"<blockquote>\n<p>According to Paragraph 4, the message conveyed by celebrity magazines is ______.</p>\n<p>根据第四段，明星杂志传达的信息具有怎样的性质？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部评价题。题干问第四段中明星杂志信息的性质，依据该段直接评价与普通单亲、明星单亲的条件对照判断；它不是全文作者态度题。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.</p>\n<p>According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n<p>作者先说杂志形象 hugely unrealistic，再写普通单亲育儿的辛苦；明星却说 on their “own” 育儿是 a piece of cake，括号又揭出 round-the-clock help。失真之处在于隐去支援条件，让读者误判独自育儿的难度。</p>\n"},{"title":"A. soothing","raw":"### A. soothing\n\n> 明星杂志传达的信息令人安心。\n\n**做题模式中的状态：** 当时读到 hugely unrealistic，并看到普通单亲的辛苦与明星轻松说法的反差。没有用另行设想的安慰效果替换作者的评价，第一轮排除 A。\n\n**错误类型：第三类——无中生有。**\n\n它从美好、轻松的明星形象联想到安慰作用，但第四段没有描述读者因此安心。原文评价的是信息是否真实反映育儿处境。\n\n**命题人借用的原文材料：**\n\n> Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.\n>\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their \"own\" (read: with round-the-clock help) is a piece of cake.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q39-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-A-0\"><blockquote>\n<p>明星杂志传达的信息令人安心。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时读到 hugely unrealistic，并看到普通单亲的辛苦与明星轻松说法的反差。没有用另行设想的安慰效果替换作者的评价，第一轮排除 A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它从美好、轻松的明星形象联想到安慰作用，但第四段没有描述读者因此安心。原文评价的是信息是否真实反映育儿处境。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section>"},{"title":"A. soothing","raw":"#### 定位比对法\n\n先把`A`接回题干，整句话就变成：\n\n> 明星杂志传达的信息令人安心。\n\n`soothing`涉及读者是否得到安慰，第四段给出的直接评价是`hugely unrealistic`；把段首与`on their own`后的帮助说明合看，确定作者具体在检验哪种信息性质。\n\n`soothing`评价的是信息能使人安心，而第四段先用`hugely unrealistic`评价杂志里的养育形象，再用普通单亲与明星的条件对照说明哪里失真。普通单亲没有伴侣依靠，需要承担很多工作；明星却把`on their own`与`a piece of cake`连在一起，旁边又明写她们实际有`with round-the-clock help`。\n\n题目问这一段揭示的信息性质，作者正在检查它是否让人正确理解养育处境，并没有展示读者被安慰后的反应。\n\n即使一幅轻松画面有可能令人短时安心，也不能用这种另外设想的效果，替代作者已经论证的真实条件差异。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q39-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-A-0\"><blockquote>\n<p>明星杂志传达的信息令人安心。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时读到 hugely unrealistic，并看到普通单亲的辛苦与明星轻松说法的反差。没有用另行设想的安慰效果替换作者的评价，第一轮排除 A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它从美好、轻松的明星形象联想到安慰作用，但第四段没有描述读者因此安心。原文评价的是信息是否真实反映育儿处境。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>明星杂志传达的信息令人安心。</p>\n</blockquote>\n<p><code>soothing</code>涉及读者是否得到安慰，第四段给出的直接评价是<code>hugely unrealistic</code>；把段首与<code>on their own</code>后的帮助说明合看，确定作者具体在检验哪种信息性质。</p>\n<p><code>soothing</code>评价的是信息能使人安心，而第四段先用<code>hugely unrealistic</code>评价杂志里的养育形象，再用普通单亲与明星的条件对照说明哪里失真。普通单亲没有伴侣依靠，需要承担很多工作；明星却把<code>on their own</code>与<code>a piece of cake</code>连在一起，旁边又明写她们实际有<code>with round-the-clock help</code>。</p>\n<p>题目问这一段揭示的信息性质，作者正在检查它是否让人正确理解养育处境，并没有展示读者被安慰后的反应。</p>\n<p>即使一幅轻松画面有可能令人短时安心，也不能用这种另外设想的效果，替代作者已经论证的真实条件差异。</p>\n</section>"},{"title":"A. soothing","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.\n>\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their \"own\" (read: with round-the-clock help) is a piece of cake.\n>\n> 当然，《美国周刊》和《人物》等名人杂志呈现的育儿形象是极其不现实的，尤其是当父母是像布洛克这样的单身母亲时。考虑到没有伴侣依靠独自养育孩子有多辛苦，这并不令人震惊；然而听桑德拉和布兰妮说起来，她们\"独自\"（读作：有全天候帮助）养育孩子是小菜一碟。\n\n作者先说形象失真，再解释明星“独自”养育其实有帮助。文章揭开隐去的条件，重点是普通读者可能误判工作量。\n\n如果`A`真是作者的意思，文章至少得写成：\n\n> These magazine stories reassure struggling parents and make them feel more at ease.\n>\n> 这些杂志故事安慰了艰难育儿的父母，使他们感到安心。\n\n`A` 需要读者被安抚的效果；实际提供的是明星与普通单亲条件不一样。好看的图像在现实中可能安慰人，并不等于本段用这个效果评价了杂志信息。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q39-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-A-0\"><blockquote>\n<p>明星杂志传达的信息令人安心。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时读到 hugely unrealistic，并看到普通单亲的辛苦与明星轻松说法的反差。没有用另行设想的安慰效果替换作者的评价，第一轮排除 A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它从美好、轻松的明星形象联想到安慰作用，但第四段没有描述读者因此安心。原文评价的是信息是否真实反映育儿处境。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>明星杂志传达的信息令人安心。</p>\n</blockquote>\n<p><code>soothing</code>涉及读者是否得到安慰，第四段给出的直接评价是<code>hugely unrealistic</code>；把段首与<code>on their own</code>后的帮助说明合看，确定作者具体在检验哪种信息性质。</p>\n<p><code>soothing</code>评价的是信息能使人安心，而第四段先用<code>hugely unrealistic</code>评价杂志里的养育形象，再用普通单亲与明星的条件对照说明哪里失真。普通单亲没有伴侣依靠，需要承担很多工作；明星却把<code>on their own</code>与<code>a piece of cake</code>连在一起，旁边又明写她们实际有<code>with round-the-clock help</code>。</p>\n<p>题目问这一段揭示的信息性质，作者正在检查它是否让人正确理解养育处境，并没有展示读者被安慰后的反应。</p>\n<p>即使一幅轻松画面有可能令人短时安心，也不能用这种另外设想的效果，替代作者已经论证的真实条件差异。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n<p>当然，《美国周刊》和《人物》等名人杂志呈现的育儿形象是极其不现实的，尤其是当父母是像布洛克这样的单身母亲时。考虑到没有伴侣依靠独自养育孩子有多辛苦，这并不令人震惊；然而听桑德拉和布兰妮说起来，她们&quot;独自&quot;（读作：有全天候帮助）养育孩子是小菜一碟。</p>\n</blockquote>\n<p>作者先说形象失真，再解释明星“独自”养育其实有帮助。文章揭开隐去的条件，重点是普通读者可能误判工作量。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These magazine stories reassure struggling parents and make them feel more at ease.</p>\n<p>这些杂志故事安慰了艰难育儿的父母，使他们感到安心。</p>\n</blockquote>\n<p><code>A</code> 需要读者被安抚的效果；实际提供的是明星与普通单亲条件不一样。好看的图像在现实中可能安慰人，并不等于本段用这个效果评价了杂志信息。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. ambiguous","raw":"### B. ambiguous\n\n> 明星杂志传达的信息含糊不清。\n\n**做题模式中的状态：** 当时 a piece of cake 的意思明确，括号中的帮助是在揭露被隐去的条件，不是表明杂志有两种意思，第一轮排除 B。\n\n**错误类型：第一类——歪曲原意。**\n\n它把杂志说法与实际条件的反差，改成了信息本身含糊。明星宣称养育轻松很明确；问题是这个说法容易让读者误会其适用条件。\n\n**出处：**\n\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their \"own\" (read: with round-the-clock help) is a piece of cake.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q39-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-B-0\"><blockquote>\n<p>明星杂志传达的信息含糊不清。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 a piece of cake 的意思明确，括号中的帮助是在揭露被隐去的条件，不是表明杂志有两种意思，第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把杂志说法与实际条件的反差，改成了信息本身含糊。明星宣称养育轻松很明确；问题是这个说法容易让读者误会其适用条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section>"},{"title":"B. ambiguous","raw":"#### 定位比对法\n\n先把`B`接回题干，整句话就变成：\n\n> 明星杂志传达的信息含糊不清。\n\n`ambiguous`说表达含糊，第四段却以`a piece of cake`概括明星说法；回读包含`on their own`与括号帮助说明的整句，区分明确的表态和被隐去的条件。\n\n`ambiguous`说杂志传达的意思含糊，存在两种都说得通的解释。第四段中明星的表态却很明确：`raising a kid on their own is a piece of cake`，即使看起来单独养育也轻而易举。\n\n作者给`on their own`加引号并插入`with round-the-clock help`，是在指出这种表述隐去了实际支援；这不是杂志同时说“容易”和“困难”，而是作者把它没有明说的条件揭出来。\n\n题干问杂志信息的性质，不能把读者后来发现两种实际处境不同，误读成杂志一开始表达得模棱两可。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q39-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-B-0\"><blockquote>\n<p>明星杂志传达的信息含糊不清。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 a piece of cake 的意思明确，括号中的帮助是在揭露被隐去的条件，不是表明杂志有两种意思，第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把杂志说法与实际条件的反差，改成了信息本身含糊。明星宣称养育轻松很明确；问题是这个说法容易让读者误会其适用条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>明星杂志传达的信息含糊不清。</p>\n</blockquote>\n<p><code>ambiguous</code>说表达含糊，第四段却以<code>a piece of cake</code>概括明星说法；回读包含<code>on their own</code>与括号帮助说明的整句，区分明确的表态和被隐去的条件。</p>\n<p><code>ambiguous</code>说杂志传达的意思含糊，存在两种都说得通的解释。第四段中明星的表态却很明确：<code>raising a kid on their own is a piece of cake</code>，即使看起来单独养育也轻而易举。</p>\n<p>作者给<code>on their own</code>加引号并插入<code>with round-the-clock help</code>，是在指出这种表述隐去了实际支援；这不是杂志同时说“容易”和“困难”，而是作者把它没有明说的条件揭出来。</p>\n<p>题干问杂志信息的性质，不能把读者后来发现两种实际处境不同，误读成杂志一开始表达得模棱两可。</p>\n</section>"},{"title":"B. ambiguous","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their \"own\" (read: with round-the-clock help) is a piece of cake.\n>\n> 考虑到没有伴侣依靠独自养育孩子有多辛苦，这并不令人震惊；然而听桑德拉和布兰妮说起来，她们\"独自\"（读作：有全天候帮助）养育孩子是小菜一碟。\n\n作者先写普通单亲养育孩子的工作量，再用`yet`转到明星的说法：自己养孩子很轻松。括号中的全天候帮助说明她们并不缺协助，揭出的是两种处境之间的差异。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The magazines leave readers unsure whether caring for a child alone is easy or difficult.\n>\n> 这些杂志让读者无法确定独自照顾孩子究竟容易还是困难。\n\nB需要杂志所传达的意思难以确定。原文里的`a piece of cake`却明确表示很容易，作者随后指出支援条件被隐去了。一个判断可以表达得清楚，却因不说明适用条件而误导人；这里的问题在后者，不能把失真改成含糊。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q39-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-B-0\"><blockquote>\n<p>明星杂志传达的信息含糊不清。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 a piece of cake 的意思明确，括号中的帮助是在揭露被隐去的条件，不是表明杂志有两种意思，第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把杂志说法与实际条件的反差，改成了信息本身含糊。明星宣称养育轻松很明确；问题是这个说法容易让读者误会其适用条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>明星杂志传达的信息含糊不清。</p>\n</blockquote>\n<p><code>ambiguous</code>说表达含糊，第四段却以<code>a piece of cake</code>概括明星说法；回读包含<code>on their own</code>与括号帮助说明的整句，区分明确的表态和被隐去的条件。</p>\n<p><code>ambiguous</code>说杂志传达的意思含糊，存在两种都说得通的解释。第四段中明星的表态却很明确：<code>raising a kid on their own is a piece of cake</code>，即使看起来单独养育也轻而易举。</p>\n<p>作者给<code>on their own</code>加引号并插入<code>with round-the-clock help</code>，是在指出这种表述隐去了实际支援；这不是杂志同时说“容易”和“困难”，而是作者把它没有明说的条件揭出来。</p>\n<p>题干问杂志信息的性质，不能把读者后来发现两种实际处境不同，误读成杂志一开始表达得模棱两可。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n<p>考虑到没有伴侣依靠独自养育孩子有多辛苦，这并不令人震惊；然而听桑德拉和布兰妮说起来，她们&quot;独自&quot;（读作：有全天候帮助）养育孩子是小菜一碟。</p>\n</blockquote>\n<p>作者先写普通单亲养育孩子的工作量，再用<code>yet</code>转到明星的说法：自己养孩子很轻松。括号中的全天候帮助说明她们并不缺协助，揭出的是两种处境之间的差异。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The magazines leave readers unsure whether caring for a child alone is easy or difficult.</p>\n<p>这些杂志让读者无法确定独自照顾孩子究竟容易还是困难。</p>\n</blockquote>\n<p>B需要杂志所传达的意思难以确定。原文里的<code>a piece of cake</code>却明确表示很容易，作者随后指出支援条件被隐去了。一个判断可以表达得清楚，却因不说明适用条件而误导人；这里的问题在后者，不能把失真改成含糊。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. compensatory","raw":"### C. compensatory\n\n> 明星杂志传达的信息具有补偿作用。\n\n**做题模式中的状态：** 当时没有把“普通单亲不快乐”和“明星看起来轻松”连成心理补偿过程，第一轮排除了 C。\n\n**错误类型：第三类——无中生有。**\n\n它借两种处境的反差，补出读者的失落被美好图像弥补。原文只用反差说明明星形象不代表普通育儿条件，没有写补偿如何发生。\n\n**命题人借用的原文材料：**\n\n> According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all.\n>\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their \"own\" (read: with round-the-clock help) is a piece of cake.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q39-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-C-0\"><blockquote>\n<p>明星杂志传达的信息具有补偿作用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时没有把“普通单亲不快乐”和“明星看起来轻松”连成心理补偿过程，第一轮排除了 C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它借两种处境的反差，补出读者的失落被美好图像弥补。原文只用反差说明明星形象不代表普通育儿条件，没有写补偿如何发生。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section>"},{"title":"C. compensatory","raw":"#### 定位比对法\n\n先把`C`接回题干，整句话就变成：\n\n> 明星杂志传达的信息具有补偿作用。\n\n`compensatory`要在原文中找到某种失落怎样被弥补；第四段先写`least happy`，后用`yet`转到`a piece of cake`，连读这两处，检查它们构成补偿过程还是条件对照。\n\n`compensatory`把信息理解为具有补偿作用，也就是读者原先的某种失落由这些图像得到弥补。第四段确实先写单亲父母最不快乐，又写明星显得养育很轻松，但两组陈述之间用`yet`形成的是现实困难与明星说法的反差，不是“因为看见明星，所以原有失落得到弥补”的过程。\n\n作者紧接着解释明星有帮助，是为了说明她们为何不能代表普通单亲的工作处境，并没有把美好图像当作解决普通人困难的办法。\n\n`C`需要加入读者从图像获得心理补偿这一环，而段中具体展开的是失真怎样产生。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false," 现实与明星说法之间的不一致。\n\n如果`C`真是作者的意思，文章至少得写成：\n\n> The cheerful images compensate parents for the unhappiness of raising children.\n>\n> 这些愉快形象弥补了父母养育孩子时的不快乐。\n\n`C` 需要“看到图像 → 失落得到弥补”的关系。原文的先后顺序只是对照，没有这个因果环节；不能把两种陈述并排就当成已经发生了补偿。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q39-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-C-0\"><blockquote>\n<p>明星杂志传达的信息具有补偿作用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时没有把“普通单亲不快乐”和“明星看起来轻松”连成心理补偿过程，第一轮排除了 C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它借两种处境的反差，补出读者的失落被美好图像弥补。原文只用反差说明明星形象不代表普通育儿条件，没有写补偿如何发生。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>明星杂志传达的信息具有补偿作用。</p>\n</blockquote>\n<p><code>compensatory</code>要在原文中找到某种失落怎样被弥补；第四段先写<code>least happy</code>，后用<code>yet</code>转到<code>a piece of cake</code>，连读这两处，检查它们构成补偿过程还是条件对照。</p>\n<p><code>compensatory</code>把信息理解为具有补偿作用，也就是读者原先的某种失落由这些图像得到弥补。第四段确实先写单亲父母最不快乐，又写明星显得养育很轻松，但两组陈述之间用<code>yet</code>形成的是现实困难与明星说法的反差，不是“因为看见明星，所以原有失落得到弥补”的过程。</p>\n<p>作者紧接着解释明星有帮助，是为了说明她们为何不能代表普通单亲的工作处境，并没有把美好图像当作解决普通人困难的办法。</p>\n<p><code>C</code>需要加入读者从图像获得心理补偿这一环，而段中具体展开的是失真怎样产生。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n<p>根据几项得出父母不如无子女夫妇快乐的研究，单身父母是所有人中最不快乐的。考虑到没有伴侣依靠独自养育孩子有多辛苦，这并不令人震惊；然而听桑德拉和布兰妮说起来，她们&quot;独自&quot;（读作：有全天候帮助）养育孩子是小菜一碟。</p>\n</blockquote>\n<p>研究说单亲父母最不快乐，作者接着解释工作量，再揭出明星的帮助条件。<code>yet</code> 连接的是现实与明星说法之间的不一致。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The cheerful images compensate parents for the unhappiness of raising children.</p>\n<p>这些愉快形象弥补了父母养育孩子时的不快乐。</p>\n</blockquote>\n<p><code>C</code> 需要“看到图像 → 失落得到弥补”的关系。原文的先后顺序只是对照，没有这个因果环节；不能把两种陈述并排就当成已经发生了补偿。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. misleading","raw":"### D. misleading\n\n> 明星杂志传达的信息具有误导性。\n\n**做题模式中的状态：** 当时 hugely unrealistic、普通单亲的工作量、明星 on their “own” 与 help 的反差都已读到。D 能解释读者会怎样误判处境，第一轮保留并选 D。\n\n**选项类型：局部评价概括。**\n\n它概括了失真形象可能带来的误解：将拥有全天候帮助的明星经验，当成普通人独自承担育儿工作也轻而易举的证明。\n\n**出处：**\n\n> Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.\n>\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their \"own\" (read: with round-the-clock help) is a piece of cake.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q39-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>明星杂志传达的信息具有误导性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 hugely unrealistic、普通单亲的工作量、明星 on their “own” 与 help 的反差都已读到。D 能解释读者会怎样误判处境，第一轮保留并选 D。</p>\n<p><strong>选项类型：局部评价概括。</strong></p>\n<p>它概括了失真形象可能带来的误解：将拥有全天候帮助的明星经验，当成普通人独自承担育儿工作也轻而易举的证明。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section>"},{"title":"D. misleading","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 明星杂志传达的信息具有误导性。\n\n先看直接评价：`hugely unrealistic`说明杂志呈现的育儿形象与现实相差很大。接下来作者没有停在这个评价上，而是拿普通单亲与明星单亲的条件作了对照。\n\n普通单亲没有伴侣可以依靠，独自养育孩子要承担很大的工作量；明星却说`on their own`养孩子是`a piece of cake`。如果读到这里就停下，我们容易把“没有伴侣”理解成“所有工作都靠自己做”。\n\n括号里的`with round-the-clock help`正是关键：明星其实有全天候帮助。支援资源不同，轻松程度就不能直接拿来比较。D的`misleading`概括的就是这层误解——把有大量协助的经验，当成普通人独自育儿也很容易的样子。它既有段首评价作依据，也能说明后面的例子为什么支持这个评价。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q39-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>明星杂志传达的信息具有误导性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 hugely unrealistic、普通单亲的工作量、明星 on their “own” 与 help 的反差都已读到。D 能解释读者会怎样误判处境，第一轮保留并选 D。</p>\n<p><strong>选项类型：局部评价概括。</strong></p>\n<p>它概括了失真形象可能带来的误解：将拥有全天候帮助的明星经验，当成普通人独自承担育儿工作也轻而易举的证明。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>明星杂志传达的信息具有误导性。</p>\n</blockquote>\n<p>先看直接评价：<code>hugely unrealistic</code>说明杂志呈现的育儿形象与现实相差很大。接下来作者没有停在这个评价上，而是拿普通单亲与明星单亲的条件作了对照。</p>\n<p>普通单亲没有伴侣可以依靠，独自养育孩子要承担很大的工作量；明星却说<code>on their own</code>养孩子是<code>a piece of cake</code>。如果读到这里就停下，我们容易把“没有伴侣”理解成“所有工作都靠自己做”。</p>\n<p>括号里的<code>with round-the-clock help</code>正是关键：明星其实有全天候帮助。支援资源不同，轻松程度就不能直接拿来比较。D的<code>misleading</code>概括的就是这层误解——把有大量协助的经验，当成普通人独自育儿也很容易的样子。它既有段首评价作依据，也能说明后面的例子为什么支持这个评价。</p>\n</section>"},{"title":"D. misleading","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.\n>\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their \"own\" (read: with round-the-clock help) is a piece of cake.\n>\n> 当然，《美国周刊》和《人物》等名人杂志呈现的育儿形象是极其不现实的，尤其是当父母是像布洛克这样的单身母亲时。考虑到没有伴侣依靠独自养育孩子有多辛苦，这并不令人震惊；然而听桑德拉和布兰妮说起来，她们\"独自\"（读作：有全天候帮助）养育孩子是小菜一碟。\n\n作者先明确说形象不现实，再把没有伴侣可依靠的辛苦，与明星有帮助却声称“独自”轻松养育并排，给出评价的具体依据。\n\n如果`D`真是作者的意思，文章至少得写成：\n\n> By presenting heavily assisted parenting as easy work done on one’s own, the magazines can give readers a false impression of single parenthood.\n>\n> 杂志把有大量帮助的育儿呈现为独自也很轻松，可能让读者对单亲育儿产生错误印象。\n\n`D` 所需的误导关系由这种条件隐去来完成。它不是指明星没有养孩子，也不是说所有读者一定上当，而是说明信息容易让人错估真实工作量。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"39","option":"D","cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q39-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q39-D-0\"><blockquote>\n<p>明星杂志传达的信息具有误导性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 hugely unrealistic、普通单亲的工作量、明星 on their “own” 与 help 的反差都已读到。D 能解释读者会怎样误判处境，第一轮保留并选 D。</p>\n<p><strong>选项类型：局部评价概括。</strong></p>\n<p>它概括了失真形象可能带来的误解：将拥有全天候帮助的明星经验，当成普通人独自承担育儿工作也轻而易举的证明。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q39-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>明星杂志传达的信息具有误导性。</p>\n</blockquote>\n<p>先看直接评价：<code>hugely unrealistic</code>说明杂志呈现的育儿形象与现实相差很大。接下来作者没有停在这个评价上，而是拿普通单亲与明星单亲的条件作了对照。</p>\n<p>普通单亲没有伴侣可以依靠，独自养育孩子要承担很大的工作量；明星却说<code>on their own</code>养孩子是<code>a piece of cake</code>。如果读到这里就停下，我们容易把“没有伴侣”理解成“所有工作都靠自己做”。</p>\n<p>括号里的<code>with round-the-clock help</code>正是关键：明星其实有全天候帮助。支援资源不同，轻松程度就不能直接拿来比较。D的<code>misleading</code>概括的就是这层误解——把有大量协助的经验，当成普通人独自育儿也很容易的样子。它既有段首评价作依据，也能说明后面的例子为什么支持这个评价。</p>\n</section><section class=\"revealPart\" id=\"focus-q39-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.</p>\n<p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n<p>当然，《美国周刊》和《人物》等名人杂志呈现的育儿形象是极其不现实的，尤其是当父母是像布洛克这样的单身母亲时。考虑到没有伴侣依靠独自养育孩子有多辛苦，这并不令人震惊；然而听桑德拉和布兰妮说起来，她们&quot;独自&quot;（读作：有全天候帮助）养育孩子是小菜一碟。</p>\n</blockquote>\n<p>作者先明确说形象不现实，再把没有伴侣可依靠的辛苦，与明星有帮助却声称“独自”轻松养育并排，给出评价的具体依据。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>By presenting heavily assisted parenting as easy work done on one’s own, the magazines can give readers a false impression of single parenthood.</p>\n<p>杂志把有大量帮助的育儿呈现为独自也很轻松，可能让读者对单亲育儿产生错误印象。</p>\n</blockquote>\n<p><code>D</code> 所需的误导关系由这种条件隐去来完成。它不是指明星没有养孩子，也不是说所有读者一定上当，而是说明信息容易让人错估真实工作量。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"39题结论","raw":"### 39题结论\n\n> **39. D. misleading**\n\n- A：它从美好、轻松的明星形象联想到安慰作用，但第四段没有描述读者因此安心。原文评价的是信息是否真实反映育儿处境。\n- B：它把杂志说法与实际条件的反差，改成了信息本身含糊。明星宣称养育轻松很明确；问题是这个说法容易让读者误会其适用条件。\n- C：它借两种处境的反差，补出读者的失落被美好图像弥补。原文只用反差说明明星形象不代表普通育儿条件，没有写补偿如何发生。\n- D：它概括了失真形象可能带来的误解：将拥有全天候帮助的明星经验，当成普通人独自承担育儿工作也轻而易举的证明。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"39题","focus":[250,1755,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"conclusion","question":"39","questionConclusion":true},"html":"<blockquote>\n<p><strong>39. D. misleading</strong></p>\n</blockquote>\n<ul>\n<li>A：它从美好、轻松的明星形象联想到安慰作用，但第四段没有描述读者因此安心。原文评价的是信息是否真实反映育儿处境。</li>\n<li>B：它把杂志说法与实际条件的反差，改成了信息本身含糊。明星宣称养育轻松很明确；问题是这个说法容易让读者误会其适用条件。</li>\n<li>C：它借两种处境的反差，补出读者的失落被美好图像弥补。原文只用反差说明明星形象不代表普通育儿条件，没有写补偿如何发生。</li>\n<li>D：它概括了失真形象可能带来的误解：将拥有全天候帮助的明星经验，当成普通人独自承担育儿工作也轻而易举的证明。</li>\n</ul>\n"},{"title":"40题 · 题干、题型与核心出处","raw":"## 40题\n\n> Which of the following can be inferred from the last paragraph?\n>\n> 从最后一段可以推知什么？\n\n### 题型\n\n局部推断题。范围是最后一段；先读首句否定了多强的模仿，再读 But 后保留了哪一种较小的影响，不能只抓一边。\n\n### 核心出处\n\n> It's hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.\n>\n> But it's interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren't in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting \"the Rachel\" might make us look just a little bit like Jennifer Aniston.\n\n作者不相信很多人仅因明星形象就决定生育，但仍追问理想化形象是否在潜意识中增加对实际育儿体验的不满。发型类比里的 a small part 和 just a little bit 继续限制影响程度，支持的是态度、期待受到影响。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"question","question":"40","questionIntro":true},"html":"<blockquote>\n<p>Which of the following can be inferred from the last paragraph?</p>\n<p>从最后一段可以推知什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部推断题。范围是最后一段；先读首句否定了多强的模仿，再读 But 后保留了哪一种较小的影响，不能只抓一边。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>It&#39;s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.</p>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n<p>作者不相信很多人仅因明星形象就决定生育，但仍追问理想化形象是否在潜意识中增加对实际育儿体验的不满。发型类比里的 a small part 和 just a little bit 继续限制影响程度，支持的是态度、期待受到影响。</p>\n"},{"title":"A. Having children contributes little to the glamour of celebrity moms.","raw":"### A. Having children contributes little to the glamour of celebrity moms.\n\n> 最后一段可推知，生孩子对明星妈妈的魅力贡献很小。\n\n**做题模式中的状态：** 当时已分清明星怎样呈现育儿，与育儿怎样增加明星魅力是两个方向。A 换了作用的主客体，还加上 little，第一轮排除。\n\n**错误类型：第一类——歪曲原意。**\n\n它拿 `glamorous` 作落点，却把“明星使育儿看起来迷人”反转成“育儿使明星变得多有魅力”，又添了贡献很小的程度判断。\n\n**出处：**\n\n> It's hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.\n>\n> But it's interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren't in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting \"the Rachel\" might make us look just a little bit like Jennifer Aniston.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q40-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-A-0\"><blockquote>\n<p>最后一段可推知，生孩子对明星妈妈的魅力贡献很小。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已分清明星怎样呈现育儿，与育儿怎样增加明星魅力是两个方向。A 换了作用的主客体，还加上 little，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它拿 <code>glamorous</code> 作落点，却把“明星使育儿看起来迷人”反转成“育儿使明星变得多有魅力”，又添了贡献很小的程度判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It&#39;s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.</p>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section>"},{"title":"A. Having children contributes little to the glamour of celebrity moms.","raw":"#### 定位比对法\n\n先把`A`接回题干，整句话就变成：\n\n> 最后一段可推知，生孩子对明星妈妈的魅力贡献很小。\n\n`A`的`Having children contributes to celebrity moms`把生育作用于明星本人，末段首句却以`Reese and Angelina`作`make it look`的主语；回看首句及`But`后`images`对`our feelings`的解释，核对作用方向。\n\n首句`Reese and Angelina make it look so glamorous`中的`it`，指养育孩子这件事，即明星把生育、养育呈现成某种样子，句子追问普通人是否因此想要孩子。`A`却让`Having children`成为作用来源，说生育对`celebrity moms`的`glamour`贡献很少，衡量的是孩子给明星本人增加了多少魅力。\n\n一个方向是明星怎样影响普通人看待养育，另一个方向是生育怎样改变明星形象。后文继续追问`the images`与`our own dissatisfactions`的关系，也始终落在普通人的期待和感受。\n\n`A`交换了作用的两端，又加上`contributes little`的数量判断，不能由这条关于普通人接受形象影响的论证推出。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q40-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-A-0\"><blockquote>\n<p>最后一段可推知，生孩子对明星妈妈的魅力贡献很小。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时已分清明星怎样呈现育儿，与育儿怎样增加明星魅力是两个方向。A 换了作用的主客体，还加上 little，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它拿 <code>glamorous</code> 作落点，却把“明星使育儿看起来迷人”反转成“育儿使明星变得多有魅力”，又添了贡献很小的程度判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It&#39;s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.</p>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q40-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知，生孩子对明星妈妈的 e</code>的数量判断，不能由这条关于普通人接受形象影响的论证推出。</p>\n</section><section class=\"revealPart\" id=\"focus-q40-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It&#39;s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.</p>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n<p>很难想象很多人会愚蠢到只因为瑞茜和安吉丽娜让育儿看起来如此迷人就想要孩子：大多数成年人明白婴儿不是发型。但有趣的是，我们每周看到的那些无压力、增强幸福感的育儿形象，是否在某种微小的、潜意识的方式上导致了我们对实际体验的不满，就像我们曾经有一小部分希望剪个&quot;瑞秋头&quot;可能让我们看起来有点像詹妮弗·安妮斯顿一样。</p>\n</blockquote>\n<p>首句讨论普通人是否会因为明星形象而想生孩子，<code>But</code> 后讨论那些形象怎样影响普通人的育儿感受。两句始终围绕普通人的选择与期待。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Having a child adds very little to a celebrity mother’s own glamour.</p>\n<p>生一个孩子几乎不会增加明星母亲本人的魅力。</p>\n</blockquote>\n<p><code>A</code> 需要衡量生育对明星形象的作用。实际衡量的是明星形象对普通人看待育儿的影响，作用方向反了；原文也没给出贡献很小的判断。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. Celebrity moms have influenced our attitude towards child rearing.","raw":"### B. Celebrity moms have influenced our attitude towards child rearing.\n\n> 最后一段可推知，明星妈妈影响了我们对养育孩子的态度。\n\n**做题模式中的状态：** 当时把首句否定的强模仿与 But 后保留的较小影响分开；没有把“不仅凭明星决定生育”读成“完全不受影响”，第一轮保留并选 B。\n\n**选项类型：局部推断。**\n\n它概括的是对期待和实际育儿感受的影响。原文对潜意识中的轻微作用作出提示，`B` 没有夸大成所有人都按明星的样子生育。\n\n**出处：**\n\n> It's hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.\n>\n> But it's interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren't in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting \"the Rachel\" might make us look just a little bit like Jennifer Aniston.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q40-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-B-0\"><blockquote>\n<p>最后一段可推知，明星妈妈影响了我们对养育孩子的态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时把首句否定的强模仿与 But 后保留的较小影响分开；没有把“不仅凭明星决定生育”读成“完全不受影响”，第一轮保留并选 B。</p>\n<p><strong>选项类型：局部推断。</strong></p>\n<p>它概括的是对期待和实际育儿感受的影响。原文对潜意识中的轻微作用作出提示，<code>B</code> 没有夸大成所有人都按明星的样子生育。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It&#39;s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.</p>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section>"},{"title":"B. Celebrity moms have influenced our attitude towards child rearing.","raw":"#### 定位比对法\n\n先把`B`接回题干，整句话就变成：\n\n> 最后一段可推知，明星妈妈影响了我们对养育孩子的态度。\n\n`influenced our attitude`与末段`images contributing to our own dissatisfactions`相接；把`But`前的`just because`和后面的`in some small`…`way`一起读，区分被否定的强影响与仍可能存在的小影响。\n\n`B`的`influenced our attitude`指明星母亲影响普通人如何看待养育，没有说所有人都会完全模仿。首句不相信很多人仅因明星呈现的养育形象，就决定`want children`；`But`后一句却问每周看到的`stress-free`、`happiness-enhancing`图像，是否`in some small`…`way`增加我们对`actual experience`的不满。\n\n前一句否定的是“只凭明星形象作出生育决定”这一很强的影响，后一句保留的是对期待和实际感受的较小影响。末尾发型类比中的`just a little bit`又说明程度有限。\n\n`B`能同时容纳理性地不照搬和感受上受影响，不需要抹掉`But`前的限制。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q40-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-B-0\"><blockquote>\n<p>最后一段可推知，明星妈妈影响了我们对养育孩子的态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时把首句否定的强模仿与 But 后保留的较小影响分开；没有把“不仅凭明星决定生育”读成“完全不受影响”，第一轮保留并选 B。</p>\n<p><strong>选项类型：局部推断。</strong></p>\n<p>它概括的是对期待和实际育儿感受的影响。原文对潜意识中的轻微作用作出提示，<code>B</code> 没有夸大成所有人都按明星的样子生育。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It&#39;s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.</p>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q40-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知，明星妈妈影响了我们对养育孩子的态度。</p>\n</blockquote>\n<p><code>influenced our attitude</code>与末段<code>images contributing to our own dissatisfactions</code>相接；把<code>But</code>前的<code>just because</code>和后面的<code>in some small</code>…<code>way</code>一起读，区分被否定的强影响与仍可能存在的小影响。</p>\n<p><code>B</code>的<code>influenced our attitude</code>指明星母亲影响普通人如何看待养育，没有说所有人都会完全模仿。首句不相信很多人仅因明星呈现的养育形象，就决定<code>want children</code>；<code>But</code>后一句却问每周看到的<code>stress-free</code>、<code>happiness-enhancing</code>图像，是否<code>in some small</code>…<code>way</code>增加我们对<code>actual experience</code>的不满。</p>\n<p>前一句否定的是“只凭明星形象作出生育决定”这一很强的影响，后一句保留的是对期待和实际感受的较小影响。末尾发型类比中的<code>just a little bit</code>又说明程度有限。</p>\n<p><code>B</code>能同时容纳理性地不照搬和感受上受影响，不需要抹掉<code>But</code>前的限制。</p>\n</section>"},{"title":"B. Celebrity moms have influenced our attitude towards child rearing.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It's hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.\n>\n> But it's interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren't in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting \"the Rachel\" might make us look just a little bit like Jennifer Aniston.\n>\n> 很难想象很多人会愚蠢到只因为瑞茜和安吉丽娜让育儿看起来如此迷人就想要孩子：大多数成年人明白婴儿不是发型。但有趣的是，我们每周看到的那些无压力、增强幸福感的育儿形象，是否在某种微小的、潜意识的方式上导致了我们对实际体验的不满，就像我们曾经有一小部分希望剪个\"瑞秋头\"可能让我们看起来有点像詹妮弗·安妮斯顿一样。\n\n作者先承认大多数成年人知道孩子不是发型，随后用 `But` 追问理想化形象是否悄悄加重对现实的不满，发型类比继续限制作用的程度。\n\n如果`B`真是作者的意思，文章至少得写成：\n\n> Even when we do not copy celebrity mothers’ choices, their idealized images can shape our expectations of raising children.\n>\n> 即使我们不照搬明星母亲的选择，她们的理想化形象仍会影响我们对育儿的期待。\n\n`B` 能同时容纳前句的理性限制和后句的细微影响。态度受到影响不等于生育决定完全由明星左右，选项没有越过原文保留的程度。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q40-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-B-0\"><blockquote>\n<p>最后一段可推知，明星妈妈影响了我们对养育孩子的态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时把首句否定的强模仿与 But 后保留的较小影响分开；没有把“不仅凭明星决定生育”读成“完全不受影响”，第一轮保留并选 B。</p>\n<p><strong>选项类型：局部推断。</strong></p>\n<p>它概括的是对期待和实际育儿感受的影响。原文对潜意识中的轻微作用作出提示，<code>B</code> 没有夸大成所有人都按明星的样子生育。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It&#39;s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.</p>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q40-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知，明星妈妈影响了我们对养育孩子的态度。</p>\n</blockquote>\n<p><code>influenced our attitude</code>与末段<code>images contributing to our own dissatisfactions</code>相接；把<code>But</code>前的<code>just because</code>和后面的<code>in some small</code>…<code>way</code>一起读，区分被否定的强影响与仍可能存在的小影响。</p>\n<p><code>B</code>的<code>influenced our attitude</code>指明星母亲影响普通人如何看待养育，没有说所有人都会完全模仿。首句不相信很多人仅因明星呈现的养育形象，就决定<code>want children</code>；<code>But</code>后一句却问每周看到的<code>stress-free</code>、<code>happiness-enhancing</code>图像，是否<code>in some small</code>…<code>way</code>增加我们对<code>actual experience</code>的不满。</p>\n<p>前一句否定的是“只凭明星形象作出生育决定”这一很强的影响，后一句保留的是对期待和实际感受的较小影响。末尾发型类比中的<code>just a little bit</code>又说明程度有限。</p>\n<p><code>B</code>能同时容纳理性地不照搬和感受上受影响，不需要抹掉<code>But</code>前的限制。</p>\n</section><section class=\"revealPart\" id=\"focus-q40-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It&#39;s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut.</p>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n<p>很难想象很多人会愚蠢到只因为瑞茜和安吉丽娜让育儿看起来如此迷人就想要孩子：大多数成年人明白婴儿不是发型。但有趣的是，我们每周看到的那些无压力、增强幸福感的育儿形象，是否在某种微小的、潜意识的方式上导致了我们对实际体验的不满，就像我们曾经有一小部分希望剪个&quot;瑞秋头&quot;可能让我们看起来有点像詹妮弗·安妮斯顿一样。</p>\n</blockquote>\n<p>作者先承认大多数成年人知道孩子不是发型，随后用 <code>But</code> 追问理想化形象是否悄悄加重对现实的不满，发型类比继续限制作用的程度。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Even when we do not copy celebrity mothers’ choices, their idealized images can shape our expectations of raising children.</p>\n<p>即使我们不照搬明星母亲的选择，她们的理想化形象仍会影响我们对育儿的期待。</p>\n</blockquote>\n<p><code>B</code> 能同时容纳前句的理性限制和后句的细微影响。态度受到影响不等于生育决定完全由明星左右，选项没有越过原文保留的程度。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n</section>"},{"title":"C. Having children intensifies our dissatisfaction with life.","raw":"### C. Having children intensifies our dissatisfaction with life.\n\n> 最后一段可推知，生孩子加剧了我们对生活的不满。\n\n**做题模式中的状态：** 当时 intensifies 被遮挡，但 Having children 与 dissatisfaction with life 可见。它把原句 the images 的作用改给生育本身，还扩大到整个人生，第一轮排除。\n\n**错误类型：第一类——歪曲原意。**\n\n它复现 `dissatisfaction`，却拿掉了造成落差的理想化图像，改成生育本身造成更强的不满，并把实际育儿体验扩大成整个生活。\n\n**出处：**\n\n> But it's interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren't in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting \"the Rachel\" might make us look just a little bit like Jennifer Aniston.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q40-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-C-0\"><blockquote>\n<p>最后一段可推知，生孩子加剧了我们对生活的不满。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 intensifies 被遮挡，但 Having children 与 dissatisfaction with life 可见。它把原句 the images 的作用改给生育本身，还扩大到整个人生，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它复现 <code>dissatisfaction</code>，却拿掉了造成落差的理想化图像，改成生育本身造成更强的不满，并把实际育儿体验扩大成整个生活。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section>"},{"title":"C. Having children intensifies our dissatisfaction with life.","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 最后一段可推知，生孩子加剧了我们对生活的不满。\n\n`intensifies`是加剧，C把它接在`Having children`后面，完整说法就是生育本身加重人们对生活的不满。我们要同时核对原因和不满所指的范围。\n\n原句中`contributing to`前面的主语是`the images we see every week`。这些图像把育儿描绘成没有压力、能够增添幸福的经历；作者追问的是，这种理想形象会不会在潜意识中影响我们的期待，让真实体验显得更令人不满。\n\n再看`with the actual experience`，这里承接实际养育孩子的体验，并未扩展到生活的全部方面。C既把理想化图像的作用转给生育本身，又把育儿体验扩大成整个生活。相同的`dissatisfaction`不能保住已经改变的因果和范围。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q40-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-C-0\"><blockquote>\n<p>最后一段可推知，生孩子加剧了我们对生活的不满。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 intensifies 被遮挡，但 Having children 与 dissatisfaction with life 可见。它把原句 the images 的作用改给生育本身，还扩大到整个人生，第一轮排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它复现 <code>dissatisfaction</code>，却拿掉了造成落差的理想化图像，改成生育本身造成更强的不满，并把实际育儿体验扩大成整个生活。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q40-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知，生孩子加剧了我们对生活的不满。</p>\n</blockquote>\n<p><code>intensifies</code>是加剧，C把它接在<code>Having children</code>后面，完整说法就是生育本身加重人们对生活的不满。我们要同时核对原因和不满所指的范围。</p>\n<p>原句中<code>contributing to</code>前面的主语是<code>the images we see every week</code>。这些图像把育儿描绘成没有压力、能够增添幸福的经历；作者追问的是，这种理想形象会不会在潜意识中影响我们的期待，让真实体验显得更令人不满。</p>\n<p>再看<code>with the actual experience</code>，这里承接实际养育孩子的体验，并未扩展到生活的全部方面。C既把理想化图像的作用转给生育本身，又把育儿体验扩大成整个生活。相同的<code>dissatisfaction</code>不能保住已经改变的因果和范围。</p>\n</section>"},{"title":"C. Having children intensifies our dissatisfaction with life.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But it's interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren't in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting \"the Rachel\" might make us look just a little bit like Jennifer Aniston.\n>\n> 但有趣的是，我们每周看到的那些无压力、增强幸福感的育儿形象，是否在某种微小的、潜意识的方式上导致了我们对实际体验的不满，就像我们曾经有一小部分希望剪个\"瑞秋头\"可能让我们看起来有点像詹妮弗·安妮斯顿一样。\n\n`But` 后的主语是每周看到的育儿形象，后面讨论它们是否在潜意识中参与形成现实体验的不满。发型类比也在说明理想形象怎样影响期待。\n\n如果`C`真是作者的意思，文章至少得写成：\n\n> Having children itself increases our dissatisfaction with life as a whole.\n>\n> 生孩子这件事本身增加了我们对整个生活的不满。\n\n`C` 至少需要直接建立“生育 → 人生不满”的关系；实际原文建立的是“理想化形象 → 对现实育儿体验的不满”。影响来源与范围都变了，不能因为共同出现 ood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n<p>但有趣的是，我们每周看到的那些无压力、增强幸福感的育儿形象，是否在某种微小的、潜意识的方式上导致了我们对实际体验的不满，就像我们曾经有一小部分希望剪个&quot;瑞秋头&quot;可能让我们看起来有点像詹妮弗·安妮斯顿一样。</p>\n</blockquote>\n<p><code>But</code> 后的主语是每周看到的育儿形象，后面讨论它们是否在潜意识中参与形成现实体验的不满。发型类比也在说明理想形象怎样影响期待。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Having children itself increases our dissatisfaction with life as a whole.</p>\n<p>生孩子这件事本身增加了我们对整个生活的不满。</p>\n</blockquote>\n<p><code>C</code> 至少需要直接建立“生育 → 人生不满”的关系；实际原文建立的是“理想化形象 → 对现实育儿体验的不满”。影响来源与范围都变了，不能因为共同出现 <code>dissatisfaction</code> 就视作同义。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. We sometimes neglect the happiness from child rearing.","raw":"### D. We sometimes neglect the happiness from child rearing.\n\n> 最后一段可推知，我们有时忽视养育孩子带来的幸福。\n\n**做题模式中的状态：** 当时发现末段解释从 the images 出发，没有把不满归因于人们忽略现实中的幸福部分，因此第一轮排除 D。\n\n**错误类型：第三类——无中生有。**\n\n它从 `dissatisfaction` 联想到“只看不好的、不看好的”，替作者增加了一个选择性注意的心理原因。原文检视的是外部理想图像与实际体验的落差。\n\n**命题人借用的原文材料：**\n\n> But it's interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren't in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting \"the Rachel\" might make us look just a little bit like Jennifer Aniston.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q40-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-D-0\"><blockquote>\n<p>最后一段可推知，我们有时忽视养育孩子带来的幸福。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时发现末段解释从 the images 出发，没有把不满归因于人们忽略现实中的幸福部分，因此第一轮排除 D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它从 <code>dissatisfaction</code> 联想到“只看不好的、不看好的”，替作者增加了一个选择性注意的心理原因。原文检视的是外部理想图像与实际体验的落差。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section>"},{"title":"D. We sometimes neglect the happiness from child rearing.","raw":"#### 定位比对法\n\n先把`D`接回题干，整句话就变成：\n\n> 最后一段可推知，我们有时忽视养育孩子带来的幸福。\n\n`neglect the happiness`在说漏看养育好处，末段实际写`stress-free`、`happiness-enhancing`的`images`与`actual experience`；回读`But`后整句，检查作者是在分析图像带来的期待，还是注意力遗漏了现实好处。\n\n`D`说我们有时`neglect the happiness from child rearing`，把问题解释为没有注意养育中的幸福部分。末段的解释却从`the images we see every week`开始：这些图像把养育呈现得毫无压力、增进幸福，可能影响我们对`actual experience`的感受。\n\n作者在检视外部图像提供的理想与现实感受之间的落差，没有先把现实拆成幸福和不幸福两部分，再说我们只看到了后一部分。`D`加入了“好处实际存在而被人忽略”的心理过程，也把对理想形象的追问改成了对人们注意方式的判断。\n\n仅凭`dissatisfactions`不能推出这种特定原因。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q40-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-D-0\"><blockquote>\n<p>最后一段可推知，我们有时忽视养育孩子带来的幸福。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时发现末段解释从 the images 出发，没有把不满归因于人们忽略现实中的幸福部分，因此第一轮排除 D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它从 <code>dissatisfaction</code> 联想到“只看不好的、不看好的”，替作者增加了一个选择性注意的心理原因。原文检视的是外部理想图像与实际体验的落差。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquo 没有注意到它。实际没有这两步，只讨论图像如何影响期待；不能由不满直接推导出忽视幸福这一特定原因。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q40-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q40-D-0\"><blockquote>\n<p>最后一段可推知，我们有时忽视养育孩子带来的幸福。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时发现末段解释从 the images 出发，没有把不满归因于人们忽略现实中的幸福部分，因此第一轮排除 D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它从 <code>dissatisfaction</code> 联想到“只看不好的、不看好的”，替作者增加了一个选择性注意的心理原因。原文检视的是外部理想图像与实际体验的落差。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q40-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知，我们有时忽视养育孩子带来的幸福。</p>\n</blockquote>\n<p><code>neglect the happiness</code>在说漏看养育好处，末段实际写<code>stress-free</code>、<code>happiness-enhancing</code>的<code>images</code>与<code>actual experience</code>；回读<code>But</code>后整句，检查作者是在分析图像带来的期待，还是注意力遗漏了现实好处。</p>\n<p><code>D</code>说我们有时<code>neglect the happiness from child rearing</code>，把问题解释为没有注意养育中的幸福部分。末段的解释却从<code>the images we see every week</code>开始：这些图像把养育呈现得毫无压力、增进幸福，可能影响我们对<code>actual experience</code>的感受。</p>\n<p>作者在检视外部图像提供的理想与现实感受之间的落差，没有先把现实拆成幸福和不幸福两部分，再说我们只看到了后一部分。<code>D</code>加入了“好处实际存在而被人忽略”的心理过程，也把对理想形象的追问改成了对人们注意方式的判断。</p>\n<p>仅凭<code>dissatisfactions</code>不能推出这种特定原因。</p>\n</section><section class=\"revealPart\" id=\"focus-q40-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n<p>但有趣的是，我们每周看到的那些无压力、增强幸福感的育儿形象，是否在某种微小的、潜意识的方式上导致了我们对实际体验的不满，就像我们曾经有一小部分希望剪个&quot;瑞秋头&quot;可能让我们看起来有点像詹妮弗·安妮斯顿一样。</p>\n</blockquote>\n<p>文章沿着每周看到的轻松育儿形象往下问：这些形象会不会影响真实体验的评价？末尾发型类比仍在说明对理想形象的期待。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>We feel dissatisfied partly because we overlook the happiness that raising children actually brings.</p>\n<p>我们感到不满，部分原因是忽视了养育孩子实际带来的幸福。</p>\n</blockquote>\n<p><code>D</code> 需要原文先指出幸福存在，再指出人们没有注意到它。实际没有这两步，只讨论图像如何影响期待；不能由不满直接推导出忽视幸福这一特定原因。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"40题结论","raw":"### 40题结论\n\n> **40. B. Celebrity moms have influenced our attitude towards child rearing.**\n\n- A：它拿 glamorous 作落点，却把“明星使育儿看起来迷人”反转成“育儿使明星变得多有魅力”，又添了贡献很小的程度判断。\n- B：它概括的是对期待和实际育儿感受的影响。原文对潜意识中的轻微作用作出提示，B 没有夸大成所有人都按明星的样子生育。\n- C：它复现 dissatisfaction，却拿掉了造成落差的理想化图像，改成生育本身造成更强的不满，并把实际育儿体验扩大成整个生活。\n- D：它从 dissatisfaction 联想到“只看不好的、不看好的”，替作者增加了一个选择性注意的心理原因。原文检视的是外部理想图像与实际体验的落差。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"40题","focus":[250,2345,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"conclusion","question":"40","questionConclusion":true},"html":"<blockquote>\n<p><strong>40. B. Celebrity moms have influenced our attitude towards child rearing.</strong></p>\n</blockquote>\n<ul>\n<li>A：它拿 glamorous 作落点，却把“明星使育儿看起来迷人”反转成“育儿使明星变得多有魅力”，又添了贡献很小的程度判断。</li>\n<li>B：它概括的是对期待和实际育儿感受的影响。原文对潜意识中的轻微作用作出提示，B 没有夸大成所有人都按明星的样子生育。</li>\n<li>C：它复现 dissatisfaction，却拿掉了造成落差的理想化图像，改成生育本身造成更强的不满，并把实际育儿体验扩大成整个生活。</li>\n<li>D：它从 dissatisfaction 联想到“只看不好的、不看好的”，替作者增加了一个选择性注意的心理原因。原文检视的是外部理想图像与实际体验的落差。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：重新定义育儿的幸福感**（段落1核心观点） 西尼尔的文章引发热议：【挑战传统观念：育儿并非完全充实的体验】→ 核心主张：重新定义幸福（不是即时快乐 // 而是回顾性的满足）→ 具体阐释：当下痛苦的事情日后可能成为满足和喜悦的源泉\n\n↓（社会现象描述）\n\n**逻辑层次2：媒体对母亲形象的持续呈现**（段落2媒体现象） 报刊亭现象：【圣母子形象无处不在：杂志封面 + 名人妈妈故事（桑德拉·布洛克）+ 怀孕新闻（詹妮弗·安妮斯顿）】→ 每周至少一位名人妈妈或准妈妈微笑示人\n\n→（社会压力分析）\n\n**逻辑层次3：社会对生育的颂扬与无子女者的困境**（段落3社会压力） 社会氛围：持续颂扬生育（后悔生孩子=支持杀小猫）→ 不公平的对比：【有孩子的不快乐父母：很少质疑自己的选择 // 无子女的不快乐者：被认为痛苦源于没有孩子】\n\n↓（现实与媒体的反差）\n\n**逻辑层次4：名人育儿形象的虚假性**（段落4真相揭露） 媒体呈现vs研究发现：【名人杂志：育儿轻松愉快（尤其单身母亲）// 研究结果：父母不如无子女者快乐，单身父母最不快乐】→ 虚假原因：名人有全天候帮助却说\"独自\"养育很容易\n\n↓（潜在影响探讨）\n\n**逻辑层次5：媒体形象对普通人的潜意识影响**（段落5深层影响） 表面理性：大多数人知道婴儿不是发型（不会因名人而盲目生育）// 潜在影响：无压力的育儿形象可能在潜意识中加剧我们对实际体验的不满 → 类比：如同希望\"瑞秋头\"让自己像安妮斯顿\n\n↑（全文主旨）\n\n全文核心观点：在一个持续颂扬生育的社会中，媒体呈现的完美育儿形象与现实形成巨大反差，这种反差可能在潜意识层面影响人们对育儿体验的满意度，而西尼尔提出的将幸福视为回顾性满足的观点，为理解育儿的复杂性提供了新视角。","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：重新定义育儿的幸福感</strong>（段落1核心观点） 西尼尔的文章引发热议：【挑战传统观念：育儿并非完全充实的体验】→ 核心主张：重新定义幸福（不是即时快乐 // 而是回顾性的满足）→ 具体阐释：当下痛苦的事情日后可能成为满足和喜悦的源泉</p>\n<p>↓（社会现象描述）</p>\n<p><strong>逻辑层次2：媒体对母亲形象的持续呈现</strong>（段落2媒体现象） 报刊亭现象：【圣母子形象无处不在：杂志封面 + 名人妈妈故事（桑德拉·布洛克）+ 怀孕新闻（詹妮弗·安妮斯顿）】→ 每周至少一位名人妈妈或准妈妈微笑示人</p>\n<p>→（社会压力分析）</p>\n<p><strong>逻辑层次3：社会对生育的颂扬与无子女者的困境</strong>（段落3社会压力） 社会氛围：持续颂扬生育（后悔生孩子=支持杀小猫）→ 不公平的对比：【有孩子的不快乐父母：很少质疑自己的选择 // 无子女的不快乐者：被认为痛苦源于没有孩子】</p>\n<p>↓（现实与媒体的反差）</p>\n<p><strong>逻辑层次4：名人育儿形象的虚假性</strong>（段落4真相揭露） 媒体呈现vs研究发现：【名人杂志：育儿轻松愉快（尤其单身母亲）// 研究结果：父母不如无子女者快乐，单身父母最不快乐】→ 虚假原因：名人有全天候帮助却说&quot;独自&quot;养育很容易</p>\n<p>↓（潜在影响探讨）</p>\n<p><strong>逻辑层次5：媒体形象对普通人的潜意识影响</strong>（段落5深层影响） 表面理性：大多数人知道婴儿不是发型（不会因名人而盲目生育）// 潜在影响：无压力的育儿形象可能在潜意识中加剧我们对实际体验的不满 → 类比：如同希望&quot;瑞秋头&quot;让自己像安妮斯顿</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：在一个持续颂扬生育的社会中，媒体呈现的完美育儿形象与现实形成巨大反差，这种反差可能在潜意识层面影响人们对育儿体验的满意度，而西尼尔提出的将幸福视为回顾性满足的观点，为理解育儿的复杂性提供了新视角。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. Separate immediate feelings from retrospective satisfaction\n\n> 区分即时感受与回顾性满足\n\n这一段把育儿当下的感受与后来回顾生活时的满足分开，解释为什么辛苦和有意义可以同时成立。\n\n> at different distances from the experience\n\n两种评价与经历的时间距离不同，为后面区分即时感受和回顾意义确定维度。\n\n> what that period later means within a life\n\n后来回顾关心的是这段经历在整个人生中的意义，而不是把每个时刻重新判为快乐。\n\n> recalling meaning does not make the earlier fatigue unreal\n\nYet再次限制回顾性满足：它不抹掉当时真实的疲劳。结尾允许两种报告同时成立，拒绝快乐或悲惨的简单二选一。\n\n这一部分的推进关系是：\n\n> 辛苦的当下与美好的回忆并存 → 二者回答不同时间视角的问题 → 瞬时快乐不是唯一尺度 → 承认意义而不否定疲劳\n\nimmediate feelings对应做具体事情时的疲惫与感受，retrospective satisfaction对应后来回看时的意义。Separate概括评价维度的区分，没有宣称其中一种体验必然虚假。\n\n再看最强干扰项B：Treat a smiling cover as a complete account。\n\nB要求把微笑封面当成完整记录，本段既没有以杂志封面举证，也不接受单一快乐表象覆盖全部经历。只看快乐的一个截面，恰好会删掉作者允许并存的困难体验。\n\n**41题选C。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. Separate immediate feelings from retrospective satisfaction</p>\n<blockquote>\n<p>区分即时感受与回顾性满足</p>\n</blockquote>\n<p>这一段把育儿当下的感受与后来回顾生活时的满足分开，解释为什么辛苦和有意义可以同时成立。</p>\n<blockquote>\n<p>at different distances from the experience</p>\n</blockquote>\n<p>两种评价与经历的时间距离不同，为后面区分即时感受和回顾意义确定维度。</p>\n<blockquote>\n<p>what that period later means within a life</p>\n</blockquote>\n<p>后来回顾关心的是这段经历在整个人生中的意义，而不是把每个时刻重新判为快乐。</p>\n<blockquote>\n<p>recalling meaning does not make the earlier fatigue unreal</p>\n</blockquote>\n<p>Yet再次限制回顾性满足：它不抹掉当时真实的疲劳。结尾允许两种报告同时成立，拒绝快乐或悲惨的简单二选一。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>辛苦的当下与美好的回忆并存 → 二者回答不同时间视角的问题 → 瞬时快乐不是唯一尺度 → 承认意义而不否定疲劳</p>\n</blockquote>\n<p>immediate feelings对应做具体事情时的疲惫与感受，retrospective satisfaction对应后来回看时的意义。Separate概括评价维度的区分，没有宣称其中一种体验必然虚假。</p>\n<p>再看最强干扰项B：Treat a smiling cover as a complete account。</p>\n<p>B要求把微笑封面当成完整记录，本段既没有以杂志封面举证，也不接受单一快乐表象覆盖全部经历。只看快乐的一个截面，恰好会删掉作者允许并存的困难体验。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】G. Examine the message produced by repeated happy images\n\n> 审视反复呈现快乐形象所形成的信息\n\n这一段解释反复出现的快乐母子形象如何组成社会背景信息，重点在重复呈现而非某张照片直接下命令。\n\n> Its place in a repeated pattern matters\n\n单张照片未必宣称育儿总是轻松，但放进反复出现的模式，意义就发生变化。however把考察单位从单张推向整体。\n\n> a narrow selection of the possible experiences\n\n这些画面只选择育儿经验中的一小部分。快乐显眼而不适留在画外，使呈现的范围偏窄。\n\n> built through repetition rather than through one explicit argument\n\n结尾明确解释信息怎样形成：靠重复而非一次明说的论证。因此不能把它概括为直接要求观众生育。\n\n这一部分的推进关系是：\n\n> 单张快乐照片不必作普遍承诺 → 同类画面持续重复 → 困难经验被排在画外 → 积累成育儿应有面貌的背景信息\n\nrepeated happy images对应新闻摊上反复出现的快乐母子，message对应育儿通常应是什么样的背景印象。Examine要求分析这种形成过程，并未把形象直接等同于完整现实。\n\n再看最强干扰项B：Treat a smiling cover as a complete account。\n\nB与本段共享封面形象，却把狭窄选择当成完整记录。a narrow selection和outside the frame已经表明有重要经验被省略，不能反过来称其提供了全部情况。\n\n**42题选G。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】G. Examine the message produced by repeated happy images</p>\n<blockquote>\n<p>审视反复呈现快乐形象所形成的信息</p>\n</blockquote>\n<p>这一段解释反复出现的快乐母子形象如何组成社会背景信息，重点在重复呈现而非某张照片直接下命令。</p>\n<blockquote>\n<p>Its place in a repeated pattern matters</p>\n</blockquote>\n<p>单张照片未必宣称育儿总是轻松，但放进反复出现的模式，意义就发生变化。however把考察单位从单张推向整体。</p>\n<blockquote>\n<p>a narrow selection of the possible experiences</p>\n</blockquote>\n<p>这些画面只选择育儿经验中的一小部分。快乐显眼而不适留在画外，使呈现的范围偏窄。</p>\n<blockquote>\n<p>built through repetition rather than through one explicit argument</p>\n</blockquote>\n<p>结尾明确解释信息怎样形成：靠重复而非一次明说的论证。因此不能把它概括为直接要求观众生育。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>单张快乐照片不必作普遍承诺 → 同类画面持续重复 → 困难经验被排在画外 → 积累成育儿应有面貌的背景信息</p>\n</blockquote>\n<p>repeated happy images对应新闻摊上反复出现的快乐母子，message对应育儿通常应是什么样的背景印象。Examine要求分析这种形成过程，并未把形象直接等同于完整现实。</p>\n<p>再看最强干扰项B：Treat a smiling cover as a complete account。</p>\n<p>B与本段共享封面形象，却把狭窄选择当成完整记录。a narrow selection和outside the frame已经表明有重要经验被省略，不能反过来称其提供了全部情况。</p>\n<p><strong>42题选G。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】A. Recognise the unequal explanations imposed on unhappiness\n\n> 识别施加在不快乐之上的不平等解释\n\n这一段比较社会怎样解释有孩子和无孩子者的不快乐，指出两类人的后悔并不是在同等压力下表达的。\n\n> the explanations offered to them can differ sharply\n\n开头让两人同样不满意，控制住情绪状态，再比较外界给出的原因解释。重点不是比较哪一类人更快乐。\n\n> the missing child explains the sadness\n\n无孩子者的不快乐被归因于缺少孩子，而父母很少被鼓励把生育选择当成所有困难的明显原因，形成不对称。\n\n> socially unequal judgments ... under equal conditions\n\n结尾明确点出比较失真的原因：把受到不同社会压力的判断，当作在相同条件下形成。\n\n这一部分的推进关系是：\n\n> 两人同样不快乐 → 外界归因却因是否生育而不同 → 社会预先规定哪种选择值得后悔 → 比较后悔时须考虑压力不对等\n\nunequal explanations对应父母与无子女者遭遇的不同归因，imposed on unhappiness说明这些解释来自社会判断。Recognise概括识别这种不对称，而非替任何个人断定其不快乐的真正原因。\n\n再看最强干扰项E：Count celebrity parents to settle the happiness debate。\n\n统计名人父母人数无法检验两组人的后悔是否受到同等压力。E把社会归因的不公平改成数量统计和幸福结论，本段没有提供这种统计，也没有以此裁定哪组更快乐。\n\n**43题选A。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】A. Recognise the unequal explanations imposed on unhappiness</p>\n<blockquote>\n<p>识别施加在不快乐之上的不平等解释</p>\n</blockquote>\n<p>这一段比较社会怎样解释有孩子和无孩子者的不快乐，指出两类人的后悔并不是在同等压力下表达的。</p>\n<blockquote>\n<p>the explanations offered to them can differ sharply</p>\n</blockquote>\n<p>开头让两人同样不满意，控制住情绪状态，再比较外界给出的原因解释。重点不是比较哪一类人更快乐。</p>\n<blockquote>\n<p>the missing child explains the sadness</p>\n</blockquote>\n<p>无孩子者的不快乐被归因于缺少孩子，而父母很少被鼓励把生育选择当成所有困难的明显原因，形成不对称。</p>\n<blockquote>\n<p>socially unequal judgments ... under equal conditions</p>\n</blockquote>\n<p>结尾明确点出比较失真的原因：把受到不同社会压力的判断，当作在相同条件下形成。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>两人同样不快乐 → 外界归因却因是否生育而不同 → 社会预先规定哪种选择值得后悔 → 比较后悔时须考虑压力不对等</p>\n</blockquote>\n<p>unequal explanations对应父母与无子女者遭遇的不同归因，imposed on unhappiness说明这些解释来自社会判断。Recognise概括识别这种不对称，而非替任何个人断定其不快乐的真正原因。</p>\n<p>再看最强干扰项E：Count celebrity parents to settle the happiness debate。</p>\n<p>统计名人父母人数无法检验两组人的后悔是否受到同等压力。E把社会归因的不公平改成数量统计和幸福结论，本段没有提供这种统计，也没有以此裁定哪组更快乐。</p>\n<p><strong>43题选A。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. Restore the hidden support behind apparently effortless care\n\n> 还原轻松育儿表象背后的隐形支持\n\n这一段揭示“独自育儿很轻松”的叙述遗漏了什么：没有伴侣不等于没有全天候帮助。\n\n> the meaning of alone changes\n\nBut之后专门重审alone的含义，不能从独身或没有伴侣直接推出无人协助。\n\n> help throughout the day and night\n\n昼夜支持解释了名人轻松育儿的资源条件，也是普通父母不能当然拥有的差异。\n\n> recover the resources that make it possible\n\n结尾要求把被省略的资源补回理解过程。同时说明不用否认名人爱孩子，避免把条件批评扩大成人品或感情指控。\n\n这一部分的推进关系是：\n\n> 独自育儿似乎轻松 → 叙述省略持续付费帮助 → 普通父母未必有同等资源 → 还原照料条件才能评价轻松表象\n\nhidden support对应叙述中省略的持续协助，apparently effortless care对应展示出来的轻松。Restore强调把遗漏条件补回来，既没有断言名人不付出，也没有否定其爱孩子。\n\n再看最强干扰项B：Treat a smiling cover as a complete account。\n\nB把展示片段当作完整记录，正会漏掉continuous paid assistance。该段的中心是说明记录不完整以及应补回什么，不能用作者反对的阅读方式作为标题。\n\n**44题选F。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. Restore the hidden support behind apparently effortless care</p>\n<blockquote>\n<p>还原轻松育儿表象背后的隐形支持</p>\n</blockquote>\n<p>这一段揭示“独自育儿很轻松”的叙述遗漏了什么：没有伴侣不等于没有全天候帮助。</p>\n<blockquote>\n<p>the meaning of alone changes</p>\n</blockquote>\n<p>But之后专门重审alone的含义，不能从独身或没有伴侣直接推出无人协助。</p>\n<blockquote>\n<p>help throughout the day and night</p>\n</blockquote>\n<p>昼夜支持解释了名人轻松育儿的资源条件，也是普通父母不能当然拥有的差异。</p>\n<blockquote>\n<p>recover the resources that make it possible</p>\n</blockquote>\n<p>结尾要求把被省略的资源补回理解过程。同时说明不用否认名人爱孩子，避免把条件批评扩大成人品或感情指控。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>独自育儿似乎轻松 → 叙述省略持续付费帮助 → 普通父母未必有同等资源 → 还原照料条件才能评价轻松表象</p>\n</blockquote>\n<p>hidden support对应叙述中省略的持续协助，apparently effortless care对应展示出来的轻松。Restore强调把遗漏条件补回来，既没有断言名人不付出，也没有否定其爱孩子。</p>\n<p>再看最强干扰项B：Treat a smiling cover as a complete account。</p>\n<p>B把展示片段当作完整记录，正会漏掉continuous paid assistance。该段的中心是说明记录不完整以及应补回什么，不能用作者反对的阅读方式作为标题。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】D. Notice how expectations can change without literal imitation\n\n> 留意不靠直接模仿也会改变的期待\n\n这一段保留成年人有常识的前提，再讨论理想化育儿形象可能通过期待影响满意度。\n\n> does not settle whether glamorous images influence them at all\n\n成年人不照抄名人的生育选择，不能自动证明所有影响都不存在。however打开了更细微的作用方式。\n\n> raise the standard against which ordinary days are judged\n\n可能改变的是评价普通日子的标准；标准被抬高，现实中的辛苦就可能显得更令人失望。\n\n> expectations, not a simple command\n\n结尾明确区分期待影响与直接服从，并保留possible和not ... every的限度，不能夸成所有不满都由杂志造成。\n\n这一部分的推进关系是：\n\n> 承认成年人不会机械模仿名人生育 → 不等于形象毫无作用 → 理想画面可能抬高期待 → 期待落差可能加剧不满\n\nwithout literal imitation对应不机械照搬名人的人生，expectations can change对应衡量普通日子的标准可能提高。Notice概括作者提出的潜在作用，保留可能性而非保证人人受影响。\n\n再看最强干扰项G：Examine the message produced by repeated happy images。\n\nG概括重复快乐画面形成的信息，和本段有联系，但这里只把重复作为前提，进一步追问观众即使不模仿，也可能怎样改变期待。D覆盖“不模仿仍受影响”的核心转折，G停在呈现端。\n\n**45题选D。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】D. Notice how expectations can change without literal imitation</p>\n<blockquote>\n<p>留意不靠直接模仿也会改变的期待</p>\n</blockquote>\n<p>这一段保留成年人有常识的前提，再讨论理想化育儿形象可能通过期待影响满意度。</p>\n<blockquote>\n<p>does not settle whether glamorous images influence them at all</p>\n</blockquote>\n<p>成年人不照抄名人的生育选择，不能自动证明所有影响都不存在。however打开了更细微的作用方式。</p>\n<blockquote>\n<p>raise the standard against which ordinary days are judged</p>\n</blockquote>\n<p>可能改变的是评价普通日子的标准；标准被抬高，现实中的辛苦就可能显得更令人失望。</p>\n<blockquote>\n<p>expectations, not a simple command</p>\n</blockquote>\n<p>结尾明确区分期待影响与直接服从，并保留possible和not ... every的限度，不能夸成所有不满都由杂志造成。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>承认成年人不会机械模仿名人生育 → 不等于形象毫无作用 → 理想画面可能抬高期待 → 期待落差可能加剧不满</p>\n</blockquote>\n<p>without literal imitation对应不机械照搬名人的人生，expectations can change对应衡量普通日子的标准可能提高。Notice概括作者提出的潜在作用，保留可能性而非保证人人受影响。</p>\n<p>再看最强干扰项G：Examine the message produced by repeated happy images。</p>\n<p>G概括重复快乐画面形成的信息，和本段有联系，但这里只把重复作为前提，进一步追问观众即使不模仿，也可能怎样改变期待。D覆盖“不模仿仍受影响”的核心转折，G停在呈现端。</p>\n<p><strong>45题选D。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 由快乐或悲惨的二选一转向幸福的定义与评价时间 |\n| B | 转向媒体反复展示的快乐片段，并引出不快乐的差别归因 |\n| C | 区分即时感受与回顾性满足，限制单个片段的代表性 |\n| D | 从隐形条件转向观众理解，区分有意模仿与期待受到影响 |\n| E | 解释社会对两类人的不快乐施加不同归因，并保留理想育儿图景 |\n| F | 展开期待悄然改变的机制，解释现实落差可能怎样形成 |\n| G | 用名人独自育儿的说法揭示全天候帮助等隐形条件 |\n| H | 收束期待落差的可能影响，综合困难、满足与社会压力 |\n\n全文推进：\n\n> 由快乐或悲惨的二选一转向幸福的定义与评价时间 → 区分即时感受与回顾性满足，限制单个片段的代表性 → 转向媒体反复展示的快乐片段，并引出不快乐的差别归因 → 解释社会对两类人的不快乐施加不同归因，并保留理想育儿图景 → 用名人独自育儿的说法揭示全天候帮助等隐形条件 → 从隐形条件转向观众理解，区分有意模仿与期待受到影响 → 展开期待悄然改变的机制，解释现实落差可能怎样形成 → 收束期待落差的可能影响，综合困难、满足与社会压力\n\n完整顺序：\n\n**A → C → B → E → G → D → F → H**\n\n41—45：C、B、G、D、F。","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>由快乐或悲惨的二选一转向幸福的定义与评价时间</td>\n</tr>\n<tr>\n<td>B</td>\n<td>转向媒体反复展示的快乐片段，并引出不快乐的差别归因</td>\n</tr>\n<tr>\n<td>C</td>\n<td>区分即时感受与回顾性满足，限制单个片段的代表性</td>\n</tr>\n<tr>\n<td>D</td>\n<td>从隐形条件转向观众理解，区分有意模仿与期待受到影响</td>\n</tr>\n<tr>\n<td>E</td>\n<td>解释社会对两类人的不快乐施加不同归因，并保留理想育儿图景</td>\n</tr>\n<tr>\n<td>F</td>\n<td>展开期待悄然改变的机制，解释现实落差可能怎样形成</td>\n</tr>\n<tr>\n<td>G</td>\n<td>用名人独自育儿的说法揭示全天候帮助等隐形条件</td>\n</tr>\n<tr>\n<td>H</td>\n<td>收束期待落差的可能影响，综合困难、满足与社会压力</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>由快乐或悲惨的二选一转向幸福的定义与评价时间 → 区分即时感受与回顾性满足，限制单个片段的代表性 → 转向媒体反复展示的快乐片段，并引出不快乐的差别归因 → 解释社会对两类人的
