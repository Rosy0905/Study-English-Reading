差异并不抹掉育儿困难。结尾据此限制单个片段的代表性，把一个pleasant or painful moment与整个parenthood分开。</p>\n<p>C段最终落在：</p>\n<blockquote>\n<p>It does, however, warn against letting a single pleasant or painful moment stand for the whole of parenthood.</p>\n</blockquote>\n<p>后段B的开头是：</p>\n<blockquote>\n<p>Yet the pleasant moments are precisely what celebrity magazines repeatedly display.</p>\n</blockquote>\n<p>C刚说不能让单个快乐片段代表全部，B的Yet the pleasant moments转到媒体实际反复展示的恰是这种片段。规范上的提醒与现实中的选择形成转折。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>由快乐或悲惨的二选一转向幸福的定义与评价时间 → 区分即时感受与回顾性满足，限制单个片段的代表性 → 转向媒体反复展示的快乐片段，并引出不快乐的差别归因</p>\n</blockquote>\n<p>再检验容易混淆的候选B。它的开头是：</p>\n<blockquote>\n<p>Yet the pleasant moments are precisely what celebrity magazines repeatedly display.</p>\n</blockquote>\n<p>B的Yet和the pleasant moments需要前面已点出片段不能代表全程。A虽然提到一天与回忆，但还在提问；若直接转媒体，会跳过对幸福维度的回答，C也失去承上位置。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题在已知A与E之间，是全文第3段的位置。它与紧邻两段形成C → B → E的关系。\n\n先看前段C的结尾：\n\n> It does, however, warn against letting a single pleasant or painful moment stand for the whole of parenthood.\n\n再看候选B的开头：\n\n> Yet the pleasant moments are precisely what celebrity magazines repeatedly display.\n\nC末句限制单个pleasant moment的代表性，B用Yet the pleasant moments接住并转向名人杂志。这个Yet不是否认回顾性满足，而是指出公众呈现仍偏向少量快乐片段。\n\nB先列母婴封面反复出现、疲劳被留在画外，再从社会对育儿的颂扬转入无子女者的处境。末句对照两组人的不快乐被怎样解释，为下一段明确命名这种不平等准备对象。\n\nB段最终落在：\n\n> When they are unhappy, the missing child can be offered as the obvious cause, whereas unhappy parents are rarely told that having children explains their misery.\n\n后段E的开头是：\n\n> That unequal explanation is easy to recognise.\n\nB最后完整列出“无子女者被归因于缺孩子，父母却少被归因于有孩子”，固定E用That unequal explanation概括并展开其后果。具体对照在前，概括评价在后。\n\n这三段的局部推进是：\n\n> 区分即时感受与回顾性满足，限制单个片段的代表性 → 转向媒体反复展示的快乐片段，并引出不快乐的差别归因 → 解释社会对两类人的不快乐施加不同归因，并保留理想育儿图景\n\n再检验容易混淆的候选G。它的开头是：\n\n> The ideal picture becomes especially doubtful when a celebrity describes caring for a child on her own.\n\nG直接讨论The ideal picture与独自育儿，主题虽有关，却不能让E的That unequal explanation指向两组人的差别归因。此处需要社会比较的桥梁，不能只插入一个育儿资源的例子。\n\n**42题选B。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype","question":"B"},"html":"<p>42题在已知A与E之间，是全文第3段的位置。它与紧邻两段形成C → B → E的关系。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>It does, however, warn against letting a single pleasant or painful moment stand for the whole of parenthood.</p>\n</blockquote>\n<p>再看候选B的开头：</p>\n<blockquote>\n<p>Yet the pleasant moments are precisely what celebrity magazines repeatedly display.</p>\n</blockquote>\n<p>C末句限制单个pleasant moment的代表性，B用Yet the pleasant moments接住并转向名人杂志。这个Yet不是否认回顾性满足，而是指出公众呈现仍偏向少量快乐片段。</p>\n<p>B先列母婴封面反复出现、疲劳被留在画外，再从社会对育儿的颂扬转入无子女者的处境。末句对照两组人的不快乐被怎样解释，为下一段明确命名这种不平等准备对象。</p>\n<p>B段最终落在：</p>\n<blockquote>\n<p>When they are unhappy, the missing child can be offered as the obvious cause, whereas unhappy parents are rarely told that having children explains their misery.</p>\n</blockquote>\n<p>后段E的开头是：</p>\n<blockquote>\n<p>That unequal explanation is easy to recognise.</p>\n</blockquote>\n<p>B最后完整列出“无子女者被归因于缺孩子，父母却少被归因于有孩子”，固定E用That unequal explanation概括并展开其后果。具体对照在前，概括评价在后。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>区分即时感受与回顾性满足，限制单个片段的代表性 → 转向媒体反复展示的快乐片段，并引出不快乐的差别归因 → 解释社会对两类人的不快乐施加不同归因，并保留理想育儿图景</p>\n</blockquote>\n<p>再检验容易混淆的候选G。它的开头是：</p>\n<blockquote>\n<p>The ideal picture becomes especially doubtful when a celebrity describes caring for a child on her own.</p>\n</blockquote>\n<p>G直接讨论The ideal picture与独自育儿，主题虽有关，却不能让E的That unequal explanation指向两组人的差别归因。此处需要社会比较的桥梁，不能只插入一个育儿资源的例子。</p>\n<p><strong>42题选B。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → D的关系。\n\n先看前段E的结尾：\n\n> Such pressure makes a simple comparison of regrets misleading, while leaving the ideal picture of parenthood largely unchallenged.\n\n再看候选G的开头：\n\n> The ideal picture becomes especially doubtful when a celebrity describes caring for a child on her own.\n\n固定E以the ideal picture of parenthood收尾，G的The ideal picture立即承接，再用名人声称独自育儿的例子检验这幅理想图景。\n\nG解释没有伴侣与没有帮助并不等同，round-the-clock support揭示普通独身父母未必拥有的条件。因此轻松表象不是足以独立比较育儿负担的完整证据。\n\nG段最终落在：\n\n> An apparently effortless experience may therefore depend on conditions hidden from the audience.\n\n后段D的开头是：\n\n> Noticing those hidden conditions need not make us assume that readers blindly copy celebrities.\n\nG末尾指出conditions hidden from the audience，D开头Noticing those hidden conditions原样回指。D再把话题由图景缺少什么转向观众怎样理解它，推进对象清楚。\n\n这三段的局部推进是：\n\n> 解释社会对两类人的不快乐施加不同归因，并保留理想育儿图景 → 用名人独自育儿的说法揭示全天候帮助等隐形条件 → 从隐形条件转向观众理解，区分有意模仿与期待受到影响\n\n再检验容易混淆的候选D。它的开头是：\n\n> Noticing those hidden conditions need not make us assume that readers blindly copy celebrities.\n\nD直接用those hidden conditions，需要前面刚交代具体隐形资源。E讨论社会归因与后悔比较，尚未说全天候帮助；把D提前会让指代缺少对象，也跳过理想图景为何不可靠的例证。\n\n**43题选G。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype","question":"G"},"html":"<p>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → D的关系。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Such pressure makes a simple comparison of regrets misleading, while leaving the ideal picture of parenthood largely unchallenged.</p>\n</blockquote>\n<p>再看候选G的开头：</p>\n<blockquote>\n<p>The ideal picture becomes especially doubtful when a celebrity describes caring for a child on her own.</p>\n</blockquote>\n<p>固定E以the ideal picture of parenthood收尾，G的The ideal picture立即承接，再用名人声称独自育儿的例子检验这幅理想图景。</p>\n<p>G解释没有伴侣与没有帮助并不等同，round-the-clock support揭示普通独身父母未必拥有的条件。因此轻松表象不是足以独立比较育儿负担的完整证据。</p>\n<p>G段最终落在：</p>\n<blockquote>\n<p>An apparently effortless experience may therefore depend on conditions hidden from the audience.</p>\n</blockquote>\n<p>后段D的开头是：</p>\n<blockquote>\n<p>Noticing those hidden conditions need not make us assume that readers blindly copy celebrities.</p>\n</blockquote>\n<p>G末尾指出conditions hidden from the audience，D开头Noticing those hidden conditions原样回指。D再把话题由图景缺少什么转向观众怎样理解它，推进对象清楚。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>解释社会对两类人的不快乐施加不同归因，并保留理想育儿图景 → 用名人独自育儿的说法揭示全天候帮助等隐形条件 → 从隐形条件转向观众理解，区分有意模仿与期待受到影响</p>\n</blockquote>\n<p>再检验容易混淆的候选D。它的开头是：</p>\n<blockquote>\n<p>Noticing those hidden conditions need not make us assume that readers blindly copy celebrities.</p>\n</blockquote>\n<p>D直接用those hidden conditions，需要前面刚交代具体隐形资源。E讨论社会归因与后悔比较，尚未说全天候帮助；把D提前会让指代缺少对象，也跳过理想图景为何不可靠的例证。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → D → F的关系。\n\n先看前段G的结尾：\n\n> An apparently effortless experience may therefore depend on conditions hidden from the audience.\n\n再看候选D的开头：\n\n> Noticing those hidden conditions need not make us assume that readers blindly copy celebrities.\n\nG已经揭示隐形帮助，D以Noticing those hidden conditions接住，但提醒看见这种差异不意味着要把观众想成盲目模仿者。\n\nD先承认成年人懂得婴儿不同于发型，也知道自身资源不同于名人。随后用however限制这个常识能证明的范围：排除有意模仿，并未回答期待是否会被改变。\n\nD段最终落在：\n\n> That sensible distinction, however, concerns deliberate imitation; it does not settle the separate question of how images shape expectations.\n\n后段F的开头是：\n\n> Expectations can be shaped without a decision to imitate anyone.\n\nD末尾提出images shape expectations这一尚待解释的问题，F以Expectations can be shaped without a decision to imitate回答，直接展开不靠模仿仍可能受影响的机制。\n\n这三段的局部推进是：\n\n> 用名人独自育儿的说法揭示全天候帮助等隐形条件 → 从隐形条件转向观众理解，区分有意模仿与期待受到影响 → 展开期待悄然改变的机制，解释现实落差可能怎样形成\n\n再检验容易混淆的候选F。它的开头是：\n\n> Expectations can be shaped without a decision to imitate anyone.\n\nF已经在解释期待改变，若直接接G，虽然话题能够勉强联系，却会省掉D关于成年人常识与模仿边界的让步。D再放到F之后，会在机制讲完后重新提出已回答的问题。\n\n**44题选D。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype","question":"D"},"html":"<p>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → D → F的关系。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>An apparently effortless experience may therefore depend on conditions hidden from the audience.</p>\n</blockquote>\n<p>再看候选D的开头：</p>\n<blockquote>\n<p>Noticing those hidden conditions need not make us assume that readers blindly copy celebrities.</p>\n</blockquote>\n<p>G已经揭示隐形帮助，D以Noticing those hidden conditions接住，但提醒看见这种差异不意味着要把观众想成盲目模仿者。</p>\n<p>D先承认成年人懂得婴儿不同于发型，也知道自身资源不同于名人。随后用however限制这个常识能证明的范围：排除有意模仿，并未回答期待是否会被改变。</p>\n<p>D段最终落在：</p>\n<blockquote>\n<p>That sensible distinction, however, concerns deliberate imitation; it does not settle the separate question of how images shape expectations.</p>\n</blockquote>\n<p>后段F的开头是：</p>\n<blockquote>\n<p>Expectations can be shaped without a decision to imitate anyone.</p>\n</blockquote>\n<p>D末尾提出images shape expectations这一尚待解释的问题，F以Expectations can be shaped without a decision to imitate回答，直接展开不靠模仿仍可能受影响的机制。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>用名人独自育儿的说法揭示全天候帮助等隐形条件 → 从隐形条件转向观众理解，区分有意模仿与期待受到影响 → 展开期待悄然改变的机制，解释现实落差可能怎样形成</p>\n</blockquote>\n<p>再检验容易混淆的候选F。它的开头是：</p>\n<blockquote>\n<p>Expectations can be shaped without a decision to imitate anyone.</p>\n</blockquote>\n<p>F已经在解释期待改变，若直接接G，虽然话题能够勉强联系，却会省掉D关于成年人常识与模仿边界的让步。D再放到F之后，会在机制讲完后重新提出已回答的问题。</p>\n<p><strong>44题选D。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成D → F → H的关系。\n\n先看前段D的结尾：\n\n> That sensible distinction, however, concerns deliberate imitation; it does not settle the separate question of how images shape expectations.\n\n再看候选F的开头：\n\n> Expectations can be shaped without a decision to imitate anyone.\n\nD把有意模仿与期待变化分开，F开头明确说期待不需要一个模仿决定也能受到影响，正面回答上一段最后留下的问题。\n\nF用评价标准的变化解释作用路径：不接受名人的生活方式，仍可能把无压力育儿当作衡量日常的标准。疲惫下午与理想标准比较后，失望可能加重；may和possible保留了推测范围。\n\nF段最终落在：\n\n> In this account, the possible influence lies in a quiet shift of expectations rather than in a direct instruction to have a child.\n\n后段H的开头是：\n\n> If expectations have shifted, disappointment need not indicate that the decision to have children was itself wrong.\n\nF末尾的a quiet shift of expectations由固定H的If expectations have shifted承接。H再说明失望不一定证明生育决定本身错误，也可能与公共图景和私人经历的差距有关。\n\n这三段的局部推进是：\n\n> 从隐形条件转向观众理解，区分有意模仿与期待受到影响 → 展开期待悄然改变的机制，解释现实落差可能怎样形成 → 收束期待落差的可能影响，综合困难、满足与社会压力\n\n再检验容易混淆的候选C。它的开头是：\n\n> Happiness measured during an exhausting task differs from satisfaction recalled years later.\n\nC讨论即时感受与回顾满足，能说明经历复杂，却没有说明期待标准如何改变。把它放在H前会使If expectations have shifted缺少刚刚展开的条件，还会重启开篇已经完成的定义讨论。\n\n**45题选F。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype","question":"F"},"html":"<p>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成D → F → H的关系。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>That sensible distinction, however, concerns deliberate imitation; it does not settle the separate question of how images shape expectations.</p>\n</blockquote>\n<p>再看候选F的开头：</p>\n<blockquote>\n<p>Expectations can be shaped without a decision to imitate anyone.</p>\n</blockquote>\n<p>D把有意模仿与期待变化分开，F开头明确说期待不需要一个模仿决定也能受到影响，正面回答上一段最后留下的问题。</p>\n<p>F用评价标准的变化解释作用路径：不接受名人的生活方式，仍可能把无压力育儿当作衡量日常的标准。疲惫下午与理想标准比较后，失望可能加重；may和possible保留了推测范围。</p>\n<p>F段最终落在：</p>\n<blockquote>\n<p>In this account, the possible influence lies in a quiet shift of expectations rather than in a direct instruction to have a child.</p>\n</blockquote>\n<p>后段H的开头是：</p>\n<blockquote>\n<p>If expectations have shifted, disappointment need not indicate that the decision to have children was itself wrong.</p>\n</blockquote>\n<p>F末尾的a quiet shift of expectations由固定H的If expectations have shifted承接。H再说明失望不一定证明生育决定本身错误，也可能与公共图景和私人经历的差距有关。</p>\n<p>这三段的局部推进是：</p>\n<blockquote>\n<p>从隐形条件转向观众理解，区分有意模仿与期待受到影响 → 展开期待悄然改变的机制，解释现实落差可能怎样形成 → 收束期待落差的可能影响，综合困难、满足与社会压力</p>\n</blockquote>\n<p>再检验容易混淆的候选C。它的开头是：</p>\n<blockquote>\n<p>Happiness measured during an exhausting task differs from satisfaction recalled years later.</p>\n</blockquote>\n<p>C讨论即时感受与回顾满足，能说明经历复杂，却没有说明期待标准如何改变。把它放在H前会使If expectations have shifted缺少刚刚展开的条件，还会重启开篇已经完成的定义讨论。</p>\n<p><strong>45题选F。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **a rational life choice** | **理性的人生选择** | **社会现象类｜社会生活** | **个人主题** |\n| mutual understanding | ng></td>\n<td><strong>社会现象类｜健康生活方式</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>balanced media portrayals</td>\n<td>客观均衡的媒体呈现</td>\n<td>社会现象类｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>independent judgment</td>\n<td>独立判断</td>\n<td>人生哲理类｜独立思考</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>mutual support in family life</td>\n<td>家庭生活中的相互支持</td>\n<td>人生哲理类｜团结合作</td>\n<td>个人主题</td>\n</tr>\n</tbody></table></div>\n"},{"title":"2. 大作文第一段描述题目信息时可积累的表达","raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画题** | **The picture shows A holding B, with a smile on A’s face.** | **图中A抱着B，脸上带着微笑。** |\n| 图画题 | The two images present a contrast between the ideal of A and the actual experience of B. | 两幅画面将A的理想状态与B的实际体验作了对比。 |\n| 图画题 | In the picture, A is struggling with B without anyone to lean on. | 图中，A没有可依靠的人，正艰难应对B。 |\n| **图画题** | **The scene invites us to reconsider what happiness means in A.** | **这一画面促使我们重新思考A中的幸福意味着什么。** |\n| 图表题 | According to the chart, A is less satisfied with B than C is. | 根据图表，与C相比，A对B的满意度更低。 |\n| 图表题 | Among the groups shown, A reports the lowest level of satisfaction. | 所列群体中，A报告的满意度最低。 |\n| 图表题 | The proportion of A has increased, while that of B has declined. | A的比例上升，而B的比例下降。 |\n| 图表题 | The chart compares people’s expectations of A with their actual experience. | 图表比较了人们对A的期待与其实际体验。 |\n| **文本评论题** | **Rather than treating A as either B or C, the author suggests redefining it.** | **作者没有把A简单视为B或C，而是建议重新界定它。** |\n| 文本评论题 | The passage questions whether the image of A presented by B is realistic. | 文章质疑B所呈现的A的形象是否真实。 |\n| 文本评论题 | The author suggests that idealized images of A may contribute to dissatisfaction with B. | 作者指出，A的理想化形象可能导致人们对B不满。 |\n| 文本评论题 | The passage explores the gap between expectations and the actual experience of A. | 文章探讨了期待与A的实际体验之间的差距。 |","section":"第五鸟 · 写作积累","level":2,"context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画题</strong></td>\n<td><strong>The picture shows A holding B, with a smile on A’s face.</strong></td>\n<td><strong>图中A抱着B，脸上带着微笑。</strong></td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>The two images present a contrast between the ideal of A and the actual experience of B.</td>\n<td>两幅画面将A的理想状态与B的实际体验作了对比。</td>\n</tr>\n<tr>\n<td>图画题</td>\n<td>In the picture, A is struggling with B without anyone to lean on.</td>\n<td>图中，A没有可依靠的人，正艰难应对B。</td>\n</tr>\n<tr>\n<td><strong>图画题</strong></td>\n<td><strong>The scene invites us to reconsider what happiness means in A.</strong></td>\n<td><strong>这一画面促使我们重新思考A中的幸福意味着什么。</strong></td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>According to the chart, A is less satisfied with B than C is.</td>\n<td>根据图表，与C相比，A对B的满意度更低。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>Among the groups shown, A reports the lowest level of satisfaction.</td>\n<td>所列群体中，A报告的满意度最低。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The proportion of A has increased, while that of B has declined.</td>\n<td>A的比例上升，而B的比例下降。</td>\n</tr>\n<tr>\n<td>图表题</td>\n<td>The chart compares people’s expectations of A with their actual experience.</td>\n<td>图表比较了人们对A的期待与其实际体验。</td>\n</tr>\n<tr>\n<td><strong>文本评论题</strong></td>\n<td><strong>Rather than treating A as either B or C, the author suggests redefining it.</strong></td>\n<td><strong>作者没有把A简单视为B或C，而是建议重新界定它。</strong></td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The passage questions whether the image of A presented by B is realistic.</td>\n<td>文章质疑B所呈现的A的形象是否真实。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The author suggests that idealized images of A may contribute to dissatisfaction with B.</td>\n<td>作者指出，A的理想化形象可能导致人们对B不满。</td>\n</tr>\n<tr>\n<td>文本评论题</td>\n<td>The passage explores the gap between expectations and the actual experience of A.</td>\n<td>文章探讨了期待与A的实际体验之间的差距。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. Recognise the unequal explanations imposed on unhappiness</strong></p><p><strong>B. Treat a smiling cover as a complete account</strong></p><p><strong>C. Separate immediate feelings from retrospective satisfaction</strong></p><p><strong>D. Notice how expectations can change without literal imitation</strong></p><p><strong>E. Count celebrity parents to settle the happiness debate</strong></p><p><strong>F. Restore the hidden support behind apparently effortless care</strong></p><p><strong>G. Examine the message produced by repeated happy images</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>A difficult afternoon with a child and a rewarding memory of family life need not contradict each other. They answer questions asked at different distances from the experience. One concerns how a person feels while performing exhausting tasks; the other concerns what that period later means within a life. Treating happiness only as a succession of pleasant moments makes the second kind of judgment difficult to recognise. Yet recalling meaning does not make the earlier fatigue unreal. The more useful distinction allows both reports to stand, rather than forcing a parent to describe the entire experience as either unbroken pleasure or simple misery.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>A single photograph of a smiling mother and baby need not claim that parenting is always easy. Its place in a repeated pattern matters, however. When newsstands regularly offer similar portraits of famous mothers and mothers-to-be, viewers encounter a narrow selection of the possible experiences of raising children. Discomfort may remain outside the frame while delight becomes the most visible public image. The result is not necessarily a deliberate instruction to have a child. It is a familiar background message about what parenthood normally looks like, built through repetition rather than through one explicit argument.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>Two adults may both be dissatisfied with their lives, yet the explanations offered to them can differ sharply. A parent is not usually encouraged to regard having children as the obvious mistake behind every difficulty. A childless person, by contrast, may be told that the missing child explains the sadness. The contrast reveals more than a difference between two private choices. It shows how a society&#x27;s celebration of parenthood can decide in advance which choice is allowed to appear regrettable. Comparing the regrets of the two groups without considering that pressure risks treating socially unequal judgments as if they arose under equal conditions.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>A celebrity&#x27;s account of raising a child alone can sound like evidence that the task is manageable without much strain. But the meaning of alone changes when continuous paid assistance is left out of the picture. A person without a partner may still have people providing help throughout the day and night. An ordinary parent cannot assume the same arrangements are available. To understand the ease being displayed, the reader must recover the resources that make it possible. This does not require denying the celebrity&#x27;s affection for the child; it requires refusing to mistake a carefully limited account of care for the conditions of unsupported parenting.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Most adults know that having a child is not comparable to copying a celebrity&#x27;s haircut. That recognition, however, does not settle whether glamorous images influence them at all. Repeated pictures of relaxed and delighted parents may quietly raise the standard against which ordinary days are judged. Someone can reject the idea of copying a star&#x27;s life and still feel disappointed when personal experience fails to resemble the attractive picture. The possible influence concerns expectations, not a simple command followed without thought. Asking about that influence is therefore compatible with recognising the audience&#x27;s common sense, and it does not prove that every parent&#x27;s dissatisfaction comes from magazines.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Public discussions of parenting often begin with a choice between two simple claims: children make adults happy, or they make them miserable. Yet a demanding day and a treasured memory need not deliver the same verdict. Before choosing between the claims, we need to ask what sort of happiness is being measured and from what point in time.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>Yet the pleasant moments are precisely what celebrity magazines repeatedly display. Smiling mothers and attractive babies appear on covers week after week, while fatigue and frustration usually remain outside the frame. The resulting celebration of parenthood has implications for people without children as well. When they are unhappy, the missing child can be offered as the obvious cause, whereas unhappy parents are rarely told that having children explains their misery.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>Happiness measured during an exhausting task differs from satisfaction recalled years later. The immediate feeling may be unpleasant while the experience eventually acquires considerable meaning. Recognising this difference does not erase the difficulty of raising a child. It does, however, warn against letting a single pleasant or painful moment stand for the whole of parenthood.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>Noticing those hidden conditions need not make us assume that readers blindly copy celebrities. Most adults understand that having a baby is not like choosing a haircut. They can recognise differences in resources and know that their lives will not reproduce a star&#x27;s experience. That sensible distinction, however, concerns deliberate imitation; it does not settle the separate question of how images shape expectations.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>That unequal explanation is easy to recognise. Parents who are unhappy are not ordinarily told that having children must have been their mistake. Childless adults, however, may hear that their lives are miserable precisely because no child fills them. Such pressure makes a simple comparison of regrets misleading, while leaving the ideal picture of parenthood largely unchallenged.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>Expectations can be shaped without a decision to imitate anyone. A reader may reject a celebrity&#x27;s lifestyle yet gradually come to treat stress-free parenting as the standard against which ordinary days are judged. Compared with that standard, an exhausting afternoon may feel more disappointing than it otherwise would. In this account, the possible influence lies in a quiet shift of expectations rather than in a direct instruction to have a child.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>The ideal picture becomes especially doubtful when a celebrity describes caring for a child on her own. The phrase may mean that she has no partner; it need not mean that she lacks assistance. Round-the-clock support can remove burdens that an ordinary single parent must carry. An apparently effortless experience may therefore depend on conditions hidden from the audience.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>If expectations have shifted, disappointment need not indicate that the decision to have children was itself wrong. It may also reflect the distance between a polished public image and a complicated private experience. This possibility does not explain every family&#x27;s feelings. It does suggest that understanding parenthood requires room for real difficulties, later satisfaction and the pressures created by the stories a society repeatedly tells.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>insightful</td>\n<td>adj.有洞察力的</td>\n<td>provocative</td>\n<td>adj.引发争议或深思的</td>\n<td>magazine cover story</td>\n<td>杂志封面报道</td>\n</tr>\n<tr>\n<td>arouse much chatter</td>\n<td>引起热议</td>\n<td>get people talking</td>\n<td>引发人们议论</td>\n<td>suggestion</td>\n<td>n.暗示；提法</td>\n</tr>\n<tr>\n<td>child rearing</td>\n<td>n.养育孩子</td>\n<td>fulfilling</td>\n<td>adj.令人充实满足的</td>\n<td>life-enriching</td>\n<td>adj.丰富人生的</td>\n</tr>\n<tr>\n<td>conclude</td>\n<td>v.得出结论</td>\n<td>miserable</td>\n<td>adj.痛苦的</td>\n<td>redefine happiness</td>\n<td>重新定义幸福</td>\n</tr>\n<tr>\n<td>instead of</td>\n<td>而不是</td>\n<td>measure</td>\n<td>v.衡量</td>\n<td>moment-to-moment joy</td>\n<td>每时每刻的快乐</td>\n</tr>\n<tr>\n<td>past-tense condition</td>\n<td>过去时的状态</td>\n<td>even though</td>\n<td>尽管</td>\n<td>day-to-day experience</td>\n<td>日常体验</td>\n</tr>\n<tr>\n<td>soul-crushingly hard</td>\n<td>令人心力交瘁地艰难</td>\n<td>dampen our moods</td>\n<td>使我们的情绪低落</td>\n<td>sources</td>\n<td>n.来源</td>\n</tr>\n<tr>\n<td>intense gratification</td>\n<td>强烈的满足</td>\n<td>delight</td>\n<td>n.喜悦</td>\n<td></td>\n< td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第4段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>of course</td>\n<td>当然</td>\n<td>image of parenthood</td>\n<td>育儿形象</td>\n<td>celebrity magazines</td>\n<td>名人杂志</td>\n</tr>\n<tr>\n<td>present</td>\n<td>v.呈现</td>\n<td>hugely unrealistic</td>\n<td>极不现实的</td>\n<td>especially</td>\n<td>adv.尤其</td>\n</tr>\n<tr>\n<td>single mothers</td>\n<td>单身母亲</td>\n<td>several studies</td>\n<td>几项研究</td>\n<td>conclude</td>\n<td>v.得出结论</td>\n</tr>\n<tr>\n<td>childless couples</td>\n<td>无子女夫妇</td>\n<td>least happy</td>\n<td>最不快乐的</td>\n<td>considering</td>\n<td>prep.考虑到</td>\n</tr>\n<tr>\n<td>raise a kid</td>\n<td>养育孩子</td>\n<td>partner</td>\n<td>n.伴侣</td>\n<td>lean on</td>\n<td>依靠</td>\n</tr>\n<tr>\n<td>round-the-clock help</td>\n<td>全天候帮助</td>\n<td>a piece of cake</td>\n<td>小菜一碟；轻而易举的事</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第5段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>imagine</td>\n<td>v.想象</td>\n<td>dumb enough</td>\n<td>愚蠢到</td>\n<td>glamorous</td>\n<td>adj.迷人的</td>\n</tr>\n<tr>\n<td>adults</td>\n<td>n.成年人</td>\n<td>understand</td>\n<td>v.理解；明白</td>\n<td>haircut</td>\n<td>n.发型</td>\n</tr>\n<tr>\n<td>images</td>\n<td>n.形象；画面</td>\n<td>stress-free</td>\n<td>adj.无压力的</td>\n<td>happiness-enhancing</td>\n<td>adj.增进幸福的</td>\n</tr>\n<tr>\n<td>parenthood</td>\n<td>n.为人父母；育儿</td>\n<td>subconscious</td>\n<td>adj.潜意识的</td>\n<td>contribute to</td>\n<td>促成；导致</td>\n</tr>\n<tr>\n<td>dissatisfaction</td>\n<td>n.不满</td>\n<td>actual experience</td>\n<td>实际体验</td>\n<td>hope</td>\n<td>v.希望</td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>It&#39;s no surprise that Jennifer Senior&#39;s insightful, provocative magazine cover story, &quot;I love My Children, I Hate My Life,&quot; is arousing much chatter – nothing gets people talking like the suggestion that child rearing is anything less than a completely fulfilling, life-enriching experience. Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition. Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n<h3>意群划分 · 第1段</h3>\n<p>It&#39;s no surprise / that Jennifer Senior&#39;s insightful, provocative magazine cover story, / &quot;I love My Children, I Hate My Life,&quot; / is arousing much chatter – / nothing gets people talking / like the suggestion / that child rearing is anything less than / a completely fulfilling, life-enriching experience.</p>\n<p>Rather than concluding / that children make parents either happy or miserable, / Senior suggests / we need to redefine happiness: / instead of thinking of it / as something that can be measured / by moment-to-moment joy, / we should consider being happy / as a past-tense condition.</p>\n<p>Even though / the day-to-day experience of raising kids / can be soul-crushingly hard, / Senior writes / that &quot;the very things / that in the moment dampen our moods / can later be sources / of intense gratification and delight.&quot;</p>\n<h3>意群翻译 · 第1段</h3>\n<p>毫不奇怪 / 詹妮弗·西尼尔富有洞察力、发人深省的杂志封面故事，/ &quot;我爱我的孩子，我恨我的生活，&quot; / 正在引起热议 – / 没有什么能让人们议论纷纷 / 像这种暗示 / 育儿不完全是 / 一种完全充实、丰富生活的体验。</p>\n<p>与其得出结论 / 孩子让父母要么快乐要么痛苦，/ 西尼尔建议 / 我们需要重新定义幸福：/ 与其把它看作 / 可以被衡量的东西 / 通过每时每刻的快乐，/ 我们应该把幸福看作 / 一种过去时的状态。</p>\n<p>即使 / 养育孩子的日常体验 / 可能是压垮灵魂般的艰难，/ 西尼尔写道 / &quot;那些事情 / 在当下削弱我们的情绪 / 之后可能成为源泉 / 强烈满足和喜悦的。&quot;</p>\n<h3>标准译文 · 第1段</h3>\n<p>詹妮弗·西尼尔那篇富有洞察力、发人深省的杂志封面故事《我爱我的孩子，我恨我的生活》引起热议毫不奇怪——没有什么比暗示育儿不是完全充实、丰富生活的体验更能让人们议论纷纷了。西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：&quot;那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。&quot;</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week. There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news. Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<h3>意群划分 · 第2段</h3>\n<p>The magazine cover / showing an attractive mother / holding a cute baby / is hardly the only Madonna-and-child image / on newsstands this week.</p>\n<p>There are also stories / about newly adoptive – and newly single – mom / Sandra Bullock, / as well as the usual / &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week / features at least one celebrity mom, / or mom-to-be, / smiling on the newsstands.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>杂志封面 / 展示一位迷人的母亲 / 抱着可爱的婴儿 / 绝不是唯一的圣母子形象 / 在本周的报刊亭上。</p>\n<p>还有故事 / 关于新近收养孩子且新近单身的妈妈 / 桑德拉·布洛克，/ 以及常见的 / &quot;詹妮弗·安妮斯顿怀孕了&quot;的新闻。</p>\n<p>几乎每周 / 都有至少一位名人妈妈，/ 或准妈妈，/ 在报刊亭上微笑。</p>\n<h3>标准译文 · 第2段</h3>\n<p>展示迷人母亲抱着可爱婴儿的杂志封面绝不是本周报刊亭上唯一的圣母子形象。还有关于新近收养孩子且新近单身的妈妈桑德拉·布洛克的故事，以及常见的&quot;詹妮弗·安妮斯顿怀孕了&quot;的新闻。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing? It doesn&#39;t seem quite fair, then, to compare the regrets of parents to the regrets of the childless. Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n<h3>意群划分 · 第3段</h3>\n<p>In a society / that so persistently celebrates procreation, / is it any wonder / that admitting you regret having children / is equivalent to / admitting you support kitten-killing?</p>\n<p>It doesn&#39;t seem quite fair, then, / to compare the regrets of parents / to the regrets of the childless.</p>\n<p>Unhappy parents / rarely are provoked to wonder / if they shouldn&#39;t have had kids, / but unhappy childless folks / are bothered with the message / that children are the single most important thing / in the world: / obviously their misery / must be a direct result / of the gaping baby-size holes / in their lives.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>在一个社会中 / 如此持续地颂扬生育，/ 有什么奇怪的 / 承认你后悔生孩子 / 等同于 / 承认你支持杀小猫？</p>\n<p>这似乎不太公平，那么，/ 比较父母的遗憾 / 与无子女者的遗憾。</p>\n<p>不快乐的父母 / 很少被激发去思考 / 他们是否不该生孩子，/ 但不快乐的无子女者 / 被这样的信息困扰 / 孩子是最重要的事情 / 在世界上：/ 显然他们的痛苦 / 必定是直接结果 / 巨大的婴儿大小的空洞 / 在他们的生活中。</p>\n<h3>标准译文 · 第3段</h3>\n<p>在一个如此持续颂扬生育的社会中，承认后悔生孩子等同于承认支持杀小猫，这有什么奇怪的吗？因此，比较父母的遗憾与无子女者的遗憾似乎不太公平。不快乐的父母很少被激发去思考他们是否不该生孩子，但不快乐的无子女者却被&quot;孩子是世界上最重要的事情&quot;这样的信息所困扰：显然他们的痛苦必定是生活中那个巨大的婴儿大小的空洞的直接结果。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>Of course, the image of parenthood that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock. According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all. No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.</p>\n<h3>意群划分 · 第4段</h3>\n<p>Of course, / the image of parenthood / that celebrity magazines like Us Weekly and People present / is hugely unrealistic, / especially when the parents are single mothers / like Bullock.</p>\n<p>According to several studies / concluding that parents are less happy / than childless couples, / single parents are the least happy of all.</p>\n<p>No shock there, / considering how much work it is / to raise a kid / without a partner to lean on; / yet to hear Sandra and Britney tell it, / raising a kid on their &quot;own&quot; / (read: with round-the-clock help) / is a piece of cake.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>当然，/ 育儿的形象 / 名人杂志如《美国周刊》和《人物》呈现的 / 是极其不现实的，/ 尤其当父母是单身母亲时 / 像布洛克。</p>\n<p>根据几项研究 / 得出结论父母不如 / 无子女夫妇快乐，/ 单身父母是所有人中最不快乐的。</p>\n<p>这并不令人震惊，/ 考虑到有多少工作 / 养育一个孩子 / 没有伴侣可以依靠；/ 然而听桑德拉和布兰妮说起来，/ 独自养育孩子 / （读作：有全天候帮助）/ 是小菜一碟。</p>\n<h3>标准译文 · 第4段</h3>\n<p>当然，《美国周刊》和《人物》等名人杂志呈现的育儿形象是极其不现实的，尤其是当父母是像布洛克这样的单身母亲时。根据几项得出父母不如无子女夫妇快乐的研究，单身父母是所有人中最不快乐的。考虑到没有伴侣依靠独自养育孩子有多辛苦，这并不令人震惊；然而听桑德拉和布兰妮说起来，她们&quot;独自&quot;（读作：有全天候帮助）养育孩子是小菜一碟。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>It&#39;s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut. But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n<h3>意群划分 · 第5段</h3>\n<p>It&#39;s hard to imagine / that many people are dumb enough / to want children / just because Reese and Angelina / make it look so glamorous: / most adults understand / that a baby is not a haircut.</p>\n<p>But it&#39;s interesting to wonder / if the images we see every week / of stress-free, happiness-enhancing parenthood / aren&#39;t in some small, subconscious way / contributing to our own dissatisfactions / with the actual experience, / in the same way / that a small part of us hoped / getting &quot;the Rachel&quot; / might make us look / just a little bit like Jennifer Aniston.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>很难想象 / 很多人愚蠢到 / 想要孩子 / 只是因为瑞茜和安吉丽娜 / 让它看起来如此迷人：/ 大多数成年人明白 / 婴儿不是发型。</p>\n<p>但有趣的是想知道 / 我们每周看到的形象 / 无压力、增强幸福感的育儿 / 是否不是在某种微小的、潜意识的方式 / 导致我们自己的不满 / 对实际体验，/ 以同样的方式 / 我们的一小部分希望 / 剪&quot;瑞秋头&quot; / 可能让我们看起来 / 有点像詹妮弗·安妮斯顿。</p>\n<h3>标准译文 · 第5段</h3>\n<p>很难想象很多人会愚蠢到只因为瑞茜和安吉丽娜让育儿看起来如此迷人就想要孩子：大多数成年人明白婴儿不是发型。但有趣的是，我们每周看到的那些无压力、增强幸福感的育儿形象，是否在某种微小的、潜意识的方式上导致了我们对实际体验的不满，就像我们曾经有一小部分希望剪个&quot;瑞秋头&quot;可能让我们看起来有点像詹妮弗·安妮斯顿一样。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n<h2>句子逻辑梳理（选修，按照自身语法基础而定)</h2>\n<p><strong>第1段</strong></p>\n<p>It&#39;s no surprise：(that Jennifer Senior&#39;s insightful, provocative magazine cover story：&quot;I love My Children, I Hate My Life&quot; → is arousing much chatter) – nothing gets people talking：(like the suggestion：(that child rearing is anything less than → a completely fulfilling, life-enriching experience)).</p>\n<p>Rather than concluding：(that children make parents either happy or miserable) → Senior suggests：(we need to redefine happiness)：instead of thinking of it：(as something that can be measured：(by moment-to-moment joy)) → we should consider being happy：(as a past-tense condition).</p>\n<p>Even though：(the day-to-day experience of raising kids → can be soul-crushingly hard) → Senior writes：(that &quot;the very things：(that in the moment dampen our moods) → can later be sources：(of intense gratification and delight)&quot;).</p>\n<p><strong>第2段</strong></p>\n<p>The magazine cover：(showing an attractive mother：(holding a cute baby)) → is hardly the only Madonna-and-child image：(on newsstands this week).</p>\n<p>There are also stories：(about newly adoptive – and newly single – mom：(Sandra Bullock)) + as well as the usual：&quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week → features at least one celebrity mom + or mom-to-be → smiling on the newsstands.</p>\n<p><strong>第3段</strong></p>\n<p>In a society：(that so persistently celebrates procreation) → is it any wonder：(that admitting you regret having children → is equivalent to → admitting you support kitten-killing)?</p>\n<p>It doesn&#39;t seem quite fair, then → to compare the regrets of parents → to the regrets of the childless.</p>\n<p>Unhappy parents → rarely are provoked to wonder：(if they shouldn&#39;t have had kids) // but unhappy childless folks → are bothered with the message：(that children are the single most important thing：(in the world))：obviously their misery → must be a direct result：(of the gaping baby-size holes：(in their lives)).</p>\n<p><strong>第4段</strong></p>\n<p>Of course → the image of parenthood：(that celebrity magazines like Us Weekly and People present) → is hugely unrealistic → especially when the parents are single mothers：(like Bullock).</p>\n<p>According to several studies：(concluding that parents are less happy：(than childless couples)) → single parents are the least happy of all.</p>\n<p>No shock there → considering how much work it is：(to raise a kid：(without a partner to lean on)); // yet to hear Sandra and Britney tell it → raising a kid on their &quot;own&quot;：(read: with round-the-clock help) → is a piece of cake.</p>\n<p><strong>第5段</strong></p>\n<p>It&#39;s hard to imagine：(that many people are dumb enough：(to want children：(just because Reese and Angelina → make it look so glamorous)))：most adults understand：(that a baby is not a haircut).</p>\n<p>But it&#39;s interesting to wonder：(if the images we see every week：(of stress-free, happiness-enhancing parenthood) → aren&#39;t in some small, subconscious way → contributing to our own dissatisfactions：(with the actual experience))，in the same way：(that a small part of us hoped：(getting &quot;the Rachel&quot; → might make us look → just a little bit like Jennifer Aniston)).</p>\n<h2>中文版句子逻辑（选修)</h2>\n<p><strong>第1段</strong></p>\n<p>毫不奇怪：(詹妮弗·西尼尔富有洞察力、发人深省的杂志封面故事：&quot;我爱我的孩子，我恨我的生活&quot; → 正在引起热议) – 没有什么能让人们议论纷纷：(像这种暗示：(育儿不完全是 → 一种完全充实、丰富生活的体验))。</p>\n<p>与其得出结论：(孩子让父母要么快乐要么痛苦) → 西尼尔建议：(我们需要重新定义幸福)：与其把它看作：(可以被衡量的东西：(通过每时每刻的快乐)) → 我们应该把幸福看作：(一种过去时的状态)。</p>\n<p>即使：(养育孩子的日常体验 → 可能是压垮灵魂般的艰难) → 西尼尔写道：(&quot;那些事情：(在当下削弱我们的情绪) → 之后可能成为源泉：(强烈满足和喜悦的)&quot;)。</p>\n<p><strong>第2段</strong></p>\n<p>杂志封面：(展示一位迷人的母亲：(抱着可爱的婴儿)) → 绝不是唯一的圣母子形象：(在本周的报刊亭上)。</p>\n<p>还有故事：(关于新近收养孩子且新近单身的妈妈：(桑德拉·布洛克)) + 以及常见的：&quot;詹妮弗·安妮斯顿怀孕了&quot;的新闻。</p>\n<p>几乎每周 → 都有至少一位名人妈妈 + 或准妈妈 → 在报刊亭上微笑。</p>\n<p><strong>第3段</strong></p>\n<p>在一个社会中：(如此持续地颂扬生育) → 有什么奇怪的：(承认你后悔生孩子 → 等同于 → 承认你支持杀小猫)?</p>\n<p>这似乎不太公平，那么 → 比较父母的遗憾 → 与无子女者的遗憾。</p>\n<p>不快乐的父母 → 很少被激发去思考：(他们是否不该生孩子) // 但不快乐的无子女者 → 被这样的信息困扰：(孩子是最重要的事情：(在世界上))：显然他们的痛苦 → 必定是直接结果：(巨大的婴儿大小的空洞：(在他们的生活中))。</p>\n<p><strong>第4段</strong></p>\n<p>当然 → 育儿的形象：(名人杂志如《美国周刊》和《人物》呈现的) → 是极其不现实的 → 尤其当父母是单身母亲时：(像布洛克)。</p>\n<p>根据几项研究：(得出结论父母不如：(无子女夫妇快乐)) → 单身父母是所有人中最不快乐的。</p>\n<p>这并不令人震惊 → 考虑到有多少工作：(养育一个孩子：(没有伴侣可以依靠))；// 然而听桑德拉和布兰妮说起来 → 独自养育孩子：(读作：有全天候帮助) → 是小菜一碟。</p>\n<p><strong>第5段</strong></p>\n<p>很难想象：(很多人愚蠢到：(想要孩子：(只是因为瑞茜和安吉丽娜 → 让它看起来如此迷人)))：大多数成年人明白：(婴儿不是发型)。</p>\n<p>但有趣的是想知道：(我们每周看到的形象：(无压力、增强幸福感的育儿) → 是否不是在某种微小的、潜意识的方式 → 导致我们自己的不满：(对实际体验))，以同样的方式：(我们的一小部分希望：(剪&quot;瑞秋头&quot; → 可能让我们看起来 → 有点像詹妮弗·安妮斯顿))。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Rather than concluding / that children make parents either happy or miserable, / Senior suggests / we need to redefine happiness: / instead of thinking of it / as something that can be measured / by moment-to-moment joy, / we should consider being happy / as a past-tense condition.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>与其得出结论 / 孩子让父母要么快乐要么痛苦，/ 西尼尔建议 / 我们需要重新定义幸福：/ 与其把它看作 / 可以被衡量的东西 / 通过每时每刻的快乐，/ 我们应该把幸福看作 / 一种过去时的状态。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把“不直接作两种结论”和“提出建议”并起来：</p>\n<blockquote>\n<p>西尼尔不简单地说孩子使父母快乐或痛苦，而是建议重新定义幸福</p>\n</blockquote>\n<p>把两种衡量角度接成同一组对照：</p>\n<blockquote>\n<p>不按每时每刻的快乐衡量，而从过去经历的角度理解幸福</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>西尼尔不直接将育儿判成快乐或痛苦\n她建议重新定义幸福\n不按当下的快乐衡量，而把它看作过去时的状态</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>西尼尔建议重新定义幸福，不按当下快乐衡量，而从过去经历的角度理解。</p>\n</blockquote>\n<p>先交代西尼尔没有采用什么判断，再写她提出什么建议；冒号后集中解释新的衡量方式。“可以用每时每刻的快乐来衡量”应当一起修饰“东西”，不要拆散。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>西尼尔没有得出孩子使父母快乐或痛苦的结论，而是建议重新定义幸福：不把幸福视为以每时每刻的快乐衡量的东西，而将它看作过去时的一种状态。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>用“并未简单地……而是……”表达作者对二分结论的回避；补出“我们需要”，承接建议的对象；保留“不应……而应该……”的成组关系，不能只留下后半句。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。</p>\n</blockquote>\n<h2>2. 第3段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Unhappy parents / rarely are provoked to wonder / if they shouldn&#39;t have had kids, / but unhappy childless folks / are bothered with the message / that children are the single most important thing / in the world: / obviously their misery / must be a direct result / of the gaping baby-size holes / in their lives.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>不快乐的父母 / 很少被激发去思考 / 他们是否不该生孩子，/ 但不快乐的无子女者 / 被这样的信息困扰 / 孩子是最重要的事情 / 在世界上：/ 显然他们的痛苦 / 必定是直接结果 / 巨大的婴儿大小的空洞 / 在他们的生活中。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把两类人的状态与他们受到的对待分别接好：</p>\n<blockquote>\n<p>不快乐的父母，很少被引发去怀疑是否不该生育\n不快乐的无子女者，却被“孩子最重要”的信息困扰</p>\n</blockquote>\n<p>最后把强硬归因当作这条外界信息继续展开，不误读成作者另作科学结论：</p>\n<blockquote>\n<p>这套说法还将他们的痛苦直接归因于没有孩子的空缺</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>父母与无子女者都可能不快乐\n前者少被追问自己的选择，后者却被施加价值判断\n无子女者的痛苦被归因为生活中没有孩子</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>不快乐的父母少被追问，无子女者却被关于孩子重要性的信息困扰。</p>\n</blockquote>\n<p>保留“但”两侧的对照，把两组人的完整名称分别放在动作前；冒号后的归因紧跟社会施加的信息。不要把“很少”移到无子女者一边，也不要删去前一组的 unhappy。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>不快乐的父母很少被促使怀疑自己是否不该生孩子，但不快乐的无子女者却被孩子是世界上最重要的事这一信息困扰：他们的痛苦被说成必定直接来自生活中没有孩子的巨大空缺。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>把长信息用引号括起来，方便看清困扰他们的具体说法；保留“很少”与“却”的不对称。材料最后的“显然……必定……”是在模仿社会强加的口气，阅读时要连同前文“不公平”的评价理解，不能当成作者认可的因果。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>不快乐的父母很少被激发去思考他们是否不该生孩子，但不快乐的无子女者却被&quot;孩子是世界上最重要的事情&quot;这样的信息所困扰：显然他们的痛苦必定是生活中那个巨大的婴儿大小的空洞的直接结果。</p>\n</blockquote>\n<h2>3. 第5段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>But it&#39;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>But it&#39;s interesting to wonder / if the images we see every week / of stress-free, happiness-enhancing parenthood / aren&#39;t in some small, subconscious way / contributing to our own dissatisfactions / with the actual experience, / in the same way / that a small part of us hoped / getting &quot;the Rachel&quot; / might make us look / just a little bit like Jennifer Aniston.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>但有趣的是想知道 / 我们每周看到的形象 / 无压力、增强幸福感的育儿 / 是否不是在某种微小的、潜意识的方式 / 导致我们自己的不满 / 对实际体验，/ 以同样的方式 / 我们的一小部分希望 / 剪&quot;瑞秋头&quot; / 可能让我们看起来 / 有点像詹妮弗·安妮斯顿。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把图像的来源和内容放在一起：</p>\n<blockquote>\n<p>我们每周看到的、将育儿表现得无压力又增进幸福的形象</p>\n</blockquote>\n<p>再把影响的对象与程度接好：</p>\n<blockquote>\n<p>以微小的、潜意识的方式，促成对实际育儿体验的不满</p>\n</blockquote>\n<p>末尾类比单独保留：</p>\n<blockquote>\n<p>就像我们曾希望剪相同发型，多少能更像明星</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>作者追问理想化育儿图像是否影响真实感受\n这种影响可能微小、发生在潜意识中\n发型愿望用来类比这种对明星形象的期待</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>这些育儿形象是否以微小的潜意识影响，促成了我们对实际体验的不满？</p>\n</blockquote>\n<p>先用“但”接住前句的理性限制；将图像的修饰语放到“育儿形象”前，将微小、潜意识的限制放在“导致”前；发型类比放在整段追问之后，避免喧宾夺主。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>但值得思考的是，每周看到的无压力、增加幸福的育儿形象，是否以某种微小的潜意识方式增加了我们对实际体验的不满，就像我们曾有一点希望剪瑞秋头会让自己有点像詹妮弗·安妮斯顿一样。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>“无压力、增强幸福感”成组修饰育儿形象；用“就像……一样”收住类比，保留原文的程度限制。这里不是直接模仿明星就一定生孩子，而是理想化形象可能影响期待，不可把这层较小的影响译成完全决定。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>但有趣的是，我们每周看到的那些无压力、增强幸福感的育儿形象，是否在某种微小的、潜意识的方式上导致了我们对实际体验的不满，就像我们曾经有一小部分希望剪个&quot;瑞秋头&quot;可能让我们看起来有点像詹妮弗·安妮斯顿一样。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>36题</h2>\n<blockquote>\n<p>Jennifer Senior suggests in her article that raising a child can bring ______.</p>\n<p>Jennifer Senior 在文章中认为，养育孩子能够带来什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。题干问 Senior 的观点，定位第一段她对 happiness 的重新定义，区分当下感受、事后回顾与快乐持续多久。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n<p>instead of ... we should ... 将衡量幸福的视角从每时每刻的快乐移到过去经历；后一句用 in the moment 与 later 解释同一经历的感受怎样变化。要找的是回顾中的幸福，而不是一段固定时长的快乐。</p>\n<h3>A. temporary delight</h3>\n<blockquote>\n<p>Senior 认为，养育孩子能带来短暂的快乐。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到了 past-tense condition 与 later，判断原文区分的是回看经历的角度；temporary 却限定持续时长，第一轮排除 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了 <code>delight</code> 这个结果，把“当时辛苦、事后感到喜悦”的时间关系，改成快乐只持续一小会儿。原文没有给后来喜悦规定这样的期限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能带来短暂的快乐。</p>\n</blockquote>\n<p><code>temporary</code>在问快乐持续多久，<code>delight</code>又出现在第一段末句；回看<code>can later be sources</code>与前面的<code>past-tense condition</code>，分清持续时长与回顾角度。</p>\n<p><code>temporary delight</code>与末句的<code>delight</code>看起来能接上，但<code>temporary</code>限定的是快乐持续多久。<code>Senior</code>实际在区分另一个问题：我们是在养育正在进行时衡量幸福，还是后来回看这段经历时感到幸福。</p>\n<p>她先提出<code>past-tense condition</code>，再用<code>can later be sources</code>解释这种回顾角度。<code>A</code>只说快乐短暂，没有保留这一角度；把<code>later</code>出现的快乐直接称为<code>temporary</code>，还会额外加上“只持续一会儿”的期限。</p>\n<p>短暂快乐在现实中当然可能存在，可它并没有说出<code>Senior</code>在这里重新界定的幸福，不能用相同的<code>delight</code>代替原句的时间关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n<p>西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：&quot;那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。&quot;</p>\n</blockquote>\n<p><code>Senior</code> 先改变幸福的衡量角度，再用当下与后来可能有不同感受来解释。文章并没有继续说这种后来得到的快乐很快就消失。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Raising children brings moments of delight that soon disappear.</p>\n<p>养育孩子会带来一些快乐时刻，但这些快乐很快就会消失。</p>\n</blockquote>\n<p><code>A</code> 需要短暂之后结束这一时间限制；原文却只交代后来怎样回看过去。<code>later</code> 回答何时获得这种感受，<code>temporary</code> 回答持续多久，两者不能互换。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. enjoyment in progress</h3>\n<blockquote>\n<p>Senior 认为，养育孩子能带来过程中的享受。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时将 in progress 与 day-to-day experience、later 对照，发现选项把事后回顾改成当下享受，因此第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文要求不要只用 <code>moment-to-moment joy</code> 衡量育儿，<code>B</code> 却把她强调的幸福重新放到正在养育的过程当中，漏掉了时间视角的转化。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能带来过程中的享受。</p>\n</blockquote>\n<p><code>in progress</code>把<code>enjoyment</code>放在正在养育时；回看<code>day-to-day experience</code>与<code>can later be sources</code>同在的末句，再与前句<code>moment-to-moment joy</code>的衡量方式相接。</p>\n<p><code>B</code>的<code>in progress</code>把享受放在养育正在进行的阶段，正好需要核对<code>day-to-day experience</code>与<code>later</code>。原文承认每天养孩子的经历<code>can be</code>…<code>hard</code>，随后说当时影响心情的事情后来可能成为<code>delight</code>的来源；<code>Senior</code>要我们不要只用<code>moment-to-moment joy</code>衡量幸福。</p>\n<p>这里并不是否认过程中出现过任何快乐，而是说明她所提出的幸福并不取决于过程当下的享受。</p>\n<p><code>B</code>若接回题干，就把她强调的后来回看改成正在进行时享受，漏掉了当时艰难与后来感受不同这一层转化。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n<p>西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：&quot;那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。&quot;</p>\n</blockquote>\n<p>文章先承认日常育儿可能很艰难，再说当时打击心情的事情以后可能成为喜悦来源。让步和转化可以同时成立，并不要求过程始终愉快。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Senior emphasizes the enjoyment parents feel while they are carrying out the daily work of raising children.</p>\n<p>Senior 强调的是父母正在进行日常育儿工作时感受到的享受。</p>\n</blockquote>\n<p><code>B</code> 的写法需要把重心放在当下体验，原文却用 <code>instead of</code> 将这种衡量方式移开。这里不是断言育儿过程中毫无快乐，而是不能用当下享受替代她提出的回顾性幸福。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. happiness in retrospect</h3>\n<blockquote>\n<p>Senior 认为，养育孩子能够带来事后回顾时的幸福。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 in retrospect 接上 past-tense condition，又得到 in the moment 与 later 对照的支持。第一轮保留 C，最终选择 C。</p>\n<p><strong>选项类型：跨句概括。</strong></p>\n<p>它把“过去时的幸福状态”和“当时辛苦的事情以后成为喜悦来源”概括成回顾中的幸福，同时允许日常育儿依然很艰难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能够带来事后回顾时的幸福。</p>\n</blockquote>\n<p><code>in retrospect</code>是在后来回看，能接上<code>past-tense condition</code>；继续读末句的<code>later</code>，检查作者如何说明同一经历在两个时间点带来不同感受。</p>\n<p><code>C</code>的<code>in retrospect</code>把感到幸福的视角放在经历之后，与<code>past-tense condition</code>相接。原文不是单独说将来会开心，而是先让我们不要只用<code>moment-to-moment joy</code>评价养育，接着说明同一件事情在当时和后来可能带来不同感受：当时影响心情，后来却成为<code>delight</code>的来源。</p>\n<p><code>C</code>保留了这种“后来回看过去经历”的关系，也允许<code>day-to-day experience</code>仍然很艰难。</p>\n<p>它没有把幸福扩大成养育全程都愉快，也没有承诺后来这种感受会持续多久，正好把<code>Senior</code>改变衡量角度的意思说出来。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n<p>西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：&quot;那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。&quot;</p>\n</blockquote>\n<p><code>Senior</code> 没有把养育一概判为快乐或痛苦，而是改变观察时点：现在觉得辛苦的同一件事，后来回看时可能得到满足。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Experiences that are difficult while raising children may bring happiness when parents look back on them.</p>\n<p>养育孩子时觉得艰难的经历，父母日后回想起来可能感到幸福。</p>\n</blockquote>\n<p><code>C</code> 所需的回顾视角能由两句话共同支持：<code>past-tense condition</code> 先提出概念，<code>later</code> 再解释它。选项没有添加全程快乐或持续终生等额外限制。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. lasting reward</h3>\n<blockquote>\n<p>Senior 认为，养育孩子能够带来持久的回报。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 reward 被遮挡，但 lasting 可见。做题时已经分清“以后感到幸福”不等于“这种回报长久持续”，所以不需要补出名词也排除了 D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它把后来出现的满足继续延长为 <code>lasting reward</code>。原文讨论感受发生的时点和回顾角度，并没有承诺这种回报会持续多长时间。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能够带来持久的回报。</p>\n</blockquote>\n<p><code>reward</code>可以表示一件事情带来的满足或回报，原文的<code>gratification and delight</code>确实能与这种感受联系起来。D的问题要落到前面的<code>lasting</code>，即这份回报能够持久存在。</p>\n<p>Senior先说把幸福看成<code>a past-tense condition</code>，随后用<code>in the moment</code>与<code>later</code>解释：同一件事，当时使人心情低落，后来却可能成为满足的来源。这组对照回答的是“什么时候、从什么角度感到幸福”。</p>\n<p><code>lasting</code>回答的却是“感受持续多久”。日后回想起来得到满足，不等于文章已经说明这份满足会长久保持。D保留了积极感受，却添上原文没有给出的持续时间；C的<code>in retrospect</code>才与Senior重新界定幸福的角度对应。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n<p>西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：&quot;那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。&quot;</p>\n</blockquote>\n<p>作者引用 <code>Senior</code> 的意思，是用 <code>later</code> 的喜悦重新理解当时的艰难。句子到喜悦的来源就结束了，没有再补充这种回报会长期保持。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The rewards of raising children remain with parents for a long time.</p>\n<p>养育孩子带来的回报会长久地伴随父母。</p>\n</blockquote>\n<p><code>D</code> 需要关于持续时长的保证。原文的 <code>can later be sources</code> 只说日后可能成为来源，不能凭“后来有满足”补出“回报会持久”。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>36题结论</h3>\n<blockquote>\n<p><strong>36. C. happiness in retrospect</strong></p>\n</blockquote>\n<ul>\n<li>A：它借用了 delight 这个结果，把“当时辛苦、事后感到喜悦”的时间关系，改成快乐只持续一小会儿。原文没有给后来喜悦规定这样的期限。</li>\n<li>B：原文要求不要只用 moment-to-moment joy 衡量育儿，B 却把她强调的幸福重新放到正在养育的过程当中，漏掉了时间视角的转化。</li>\n<li>C：它把“过去时的幸福状态”和“当时辛苦的事情以后成为喜悦来源”概括成回顾中的幸福，同时允许日常育儿依然很艰难。</li>\n<li>D：它把后来出现的满足继续延长为 lasting reward。原文讨论感受发生的时点和回顾角度，并没有承诺这种回报会持续多长时间。</li>\n</ul>\n<h2>37题</h2>\n<blockquote>\n<p>We learn from Paragraph 2 that ______.</p>\n<p>从第二段可以看出什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落推断题。题干限定第二段，要概括母子封面、明星母亲和怀孕报道共同反映的内容。既看反复出现的频率，也看它们被呈现成什么样子。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n<p>母亲 attractive、婴儿 cute，明星母亲或准妈妈 smiling；这些形象几乎每周出现。不同例子共同把生育与母亲身份呈现为值得欣赏的事情。紧接着第三段的 persistently celebrates procreation 对这一社会氛围作了概括，但推断的基础仍要落在第二段的这些描写中。</p>\n<h3>A. celebrity moms are a permanent source for gossip</h3>\n<blockquote>\n<p>第二段说明，明星妈妈是长久不断的八卦来源。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮中，A 对应明星私生活新闻反复出现，与 D 一起保留。最后回查发现段中的积极描写和下一段对颂扬生育的承接更支持社会价值判断，A 只抓住报道素材这一层，最终排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>明星母亲确实持续出现在报道中，但题目要概括这一组母子形象所反映的内容。<code>A</code> 只抓反复报道，把 <code>attractive</code>、<code>cute</code>、<code>smiling</code> 共同建立的积极评价丢掉了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，明星妈妈是长久不断的八卦来源。</p>\n</blockquote>\n<p><code>A</code>的<code>permanent source</code>指持续有话题，第二段有<code>usual</code>的怀孕消息与<code>Practically every week</code>；连同<code>Sandra</code>的单身、当妈妈消息回读全段，核对反复报道的具体内容。</p>\n<p><code>Practically every week</code> 确实能支持明星母亲相关消息反复出现，故事也涉及私人生活，因此 A 不是完全没有落点。可题目需要概括整段，不能只抽走频率。</p>\n<p>段首 <code>attractive mother</code>、<code>cute baby</code> 与末尾 <code>smiling</code> 反复赋予母子形象正面色彩；新妈妈、单身妈妈和准妈妈又共同围绕生育身份展开。A 的 gossip 只能解释媒体有话题可写，不能概括这些描写共同传出的价值评价，因此不如 D 回答得完整。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>展示迷人母亲抱着可爱婴儿的杂志封面绝不是本周报刊亭上唯一的圣母子形象。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。</p>\n</blockquote>\n<p>第二段不只说有明星新闻，还反复将母亲和孩子写得美好。接着文章讨论社会持续颂扬生育，以及这种氛围给无子女者带来的压力。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These magazines repeatedly use celebrity mothers’ private lives as gossip, and the discussion focuses on this continuing supply of stories.</p>\n<p>这些杂志不断拿明星母亲的私生活制造八卦，讨论重点是这种持续不断的报道素材。</p>\n</blockquote>\n<p><code>A</code> 能解释新闻为什么总有得写，却解释不了作者为何特意写迷人母亲、可爱婴儿和微笑形象。实际段落用多种正面形象指向对生育的推崇，<code>A</code> 停在了材料来源这一层。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. single mothers with babies deserve greater attention</h3>\n<blockquote>\n<p>第二段说明，有婴儿的单身母亲理应得到更多关注。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时区分了“有一位单身母亲被报道”和 deserve greater attention 的规范性建议。原段没有这种建议或比较，第一轮排除 B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它借用 <code>Sandra</code> 的单身母亲身份，补出“这一类人应该得到更多关注”。新闻中受到关注这一事实，不提供理应如此的评价，更不提供 <code>greater</code> 的比较依据。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，有婴儿的单身母亲理应得到更多关注。</p>\n</blockquote>\n<p><code>B</code>的<code>single mothers</code>找到<code>newly single mom Sandra Bullock</code>，<code>deserve greater attention</code>又提出更值得关注；回看她的故事与其他母亲消息并列的句子，检查是否出现这种建议和比较。</p>\n<p><code>B</code>里的<code>deserve</code>不是“正在受到”，而是“理应得到”；<code>greater</code>又要求比某个比较对象得到更多。第二段确有<code>newly single mom Sandra Bullock</code>，却把她的故事与母子封面、怀孕新闻并列，最后归到<code>celebrity mom or mom-to-be</code>。</p>\n<p><code>Sandra</code>的单身身份用于交代这则新闻，并没有被拿来论证她比其他母亲更值得关注。<code>B</code>把“有一位单身母亲受到报道”变成“单身母亲这一类人应得到更多关注”，既把描述改成建议，又添上关注程度的比较。</p>\n<p>原段展示的是已经出现的多种报道，不是在提出向其中一类重新分配关注的主张。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>还有关于新近收养孩子且新近单身的妈妈桑德拉·布洛克的故事，以及常见的&quot;詹妮弗·安妮斯顿怀孕了&quot;的新闻。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。</p>\n</blockquote>\n<p><code>Sandra</code> 的故事与怀孕新闻、其他明星母亲形象并列，最后用每周都有 <code>celebrity mom</code> 或 <code>mom-to-be</code> 概括。作者没有把单身母亲单独提出来要求优先关注。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Single mothers with babies should receive more attention than they currently do.</p>\n<p>有婴儿的单身母亲应该得到比现在更多的关注。</p>\n</blockquote>\n<p><code>B</code> 至少需要作者提出“应该增加关注”的主张。实际只是列出已有报道，单身身份是例子中的信息，不能从一个被报道的人推导出面向整类人的建议。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. news about pregnant celebrities is entertaining</h3>\n<blockquote>\n<p>第二段说明，明星怀孕新闻令人觉得有趣、具有娱乐性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到 usual、Practically every week 只说明常见，attractive、cute、smiling 描写的是封面人物。没有把这些信息改成读者被逗乐的反应，第一轮排除 C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它借用怀孕新闻和好看的封面，诱导我们补出公众感到娱乐。报道出现频繁、封面人物在微笑，都不等于原文描写了读者的娱乐体验。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，明星怀孕新闻令人觉得有趣、具有娱乐性。</p>\n</blockquote>\n<p><code>entertaining</code>评价读者看新闻的感受，段内<code>pregnant news</code>前面是<code>usual</code>，末句又写<code>every week</code>；回读这两句并检查<code>smiling</code>修饰谁，分清频率、人物状态与读者感受。</p>\n<p><code>C</code>把<code>pregnant celebrities</code>的消息评价为<code>entertaining</code>，说明它使读者觉得有趣或获得娱乐。第二段对应的表达却是<code>usual</code>的怀孕新闻，以及<code>Practically every week</code>重复出现的明星母亲形象：这些词说明消息多常见，没有描述读者阅读时有多开心。</p>\n<p>段中<code>attractive</code>、<code>cute</code>、<code>smiling</code>也分别修饰母亲、婴儿和封面人物，不是对新闻给公众带来娱乐的评价。<code>C</code>把画面里的人显得愉快，转成观看新闻的人得到娱乐，改变了感受的主体。</p>\n<p>频繁出现或封面好看都不能完成这一步，因此它没有准确表达这些具体描写正在建立的内容。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>还有关于新近收养孩子且新近单身的妈妈桑德拉·布洛克的故事，以及常见的&quo
