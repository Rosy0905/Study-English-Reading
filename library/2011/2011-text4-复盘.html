vel":4,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q36-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-D-0\"><blockquote>\n<p>Senior 认为，养育孩子能够带来持久的回报。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 reward 被遮挡，但 lasting 可见。做题时已经分清“以后感到幸福”不等于“这种回报长久持续”，所以不需要补出名词也排除了 D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它把后来出现的满足继续延长为 <code>lasting reward</code>。原文讨论感受发生的时点和回顾角度，并没有承诺这种回报会持续多长时间。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能够带来持久的回报。</p>\n</blockquote>\n<p><code>reward</code>可以表示一件事情带来的满足或回报，原文的<code>gratification and delight</code>确实能与这种感受联系起来。D的问题要落到前面的<code>lasting</code>，即这份回报能够持久存在。</p>\n<p>Senior先说把幸福看成<code>a past-tense condition</code>，随后用<code>in the moment</code>与<code>later</code>解释：同一件事，当时使人心情低落，后来却可能成为满足的来源。这组对照回答的是“什么时候、从什么角度感到幸福”。</p>\n<p><code>lasting</code>回答的却是“感受持续多久”。日后回想起来得到满足，不等于文章已经说明这份满足会长久保持。D保留了积极感受，却添上原文没有给出的持续时间；C的<code>in retrospect</code>才与Senior重新界定幸福的角度对应。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n<p>西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：&quot;那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。&quot;</p>\n</blockquote>\n<p>作者引用 <code>Senior</code> 的意思，是用 <code>later</code> 的喜悦重新理解当时的艰难。句子到喜悦的来源就结束了，没有再补充这种回报会长期保持。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The rewards of raising children remain with parents for a long time.</p>\n<p>养育孩子带来的回报会长久地伴随父母。</p>\n</blockquote>\n<p><code>D</code> 需要关于持续时长的保证。原文的 <code>can later be sources</code> 只说日后可能成为来源，不能凭“后来有满足”补出“回报会持久”。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"36题结论","raw":"### 36题结论\n\n> **36. C. happiness in retrospect**\n\n- A：它借用了 delight 这个结果，把“当时辛苦、事后感到喜悦”的时间关系，改成快乐只持续一小会儿。原文没有给后来喜悦规定这样的期限。\n- B：原文要求不要只用 moment-to-moment joy 衡量育儿，B 却把她强调的幸福重新放到正在养育的过程当中，漏掉了时间视角的转化。\n- C：它把“过去时的幸福状态”和“当时辛苦的事情以后成为喜悦来源”概括成回顾中的幸福，同时允许日常育儿依然很艰难。\n- D：它把后来出现的满足继续延长为 lasting reward。原文讨论感受发生的时点和回顾角度，并没有承诺这种回报会持续多长时间。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"conclusion","question":"36","questionConclusion":true},"html":"<blockquote>\n<p><strong>36. C. happiness in retrospect</strong></p>\n</blockquote>\n<ul>\n<li>A：它借用了 delight 这个结果，把“当时辛苦、事后感到喜悦”的时间关系，改成快乐只持续一小会儿。原文没有给后来喜悦规定这样的期限。</li>\n<li>B：原文要求不要只用 moment-to-moment joy 衡量育儿，B 却把她强调的幸福重新放到正在养育的过程当中，漏掉了时间视角的转化。</li>\n<li>C：它把“过去时的幸福状态”和“当时辛苦的事情以后成为喜悦来源”概括成回顾中的幸福，同时允许日常育儿依然很艰难。</li>\n<li>D：它把后来出现的满足继续延长为 lasting reward。原文讨论感受发生的时点和回顾角度，并没有承诺这种回报会持续多长时间。</li>\n</ul>\n"},{"title":"37题 · 题干、题型与核心出处","raw":"## 37题\n\n> We learn from Paragraph 2 that ______.\n>\n> 从第二段可以看出什么？\n\n### 题型\n\n段落推断题。题干限定第二段，要概括母子封面、明星母亲和怀孕报道共同反映的内容。既看反复出现的频率，也看它们被呈现成什么样子。\n\n### 核心出处\n\n> The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.\n>\n> There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual \"Jennifer Aniston is pregnant\" news.\n>\n> Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n\n母亲 attractive、婴儿 cute，明星母亲或准妈妈 smiling；这些形象几乎每周出现。不同例子共同把生育与母亲身份呈现为值得欣赏的事情。紧接着第三段的 persistently celebrates procreation 对这一社会氛围作了概括，但推断的基础仍要落在第二段的这些描写中。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"question","question":"37","questionIntro":true},"html":"<blockquote>\n<p>We learn from Paragraph 2 that ______.</p>\n<p>从第二段可以看出什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落推断题。题干限定第二段，要概括母子封面、明星母亲和怀孕报道共同反映的内容。既看反复出现的频率，也看它们被呈现成什么样子。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n<p>母亲 attractive、婴儿 cute，明星母亲或准妈妈 smiling；这些形象几乎每周出现。不同例子共同把生育与母亲身份呈现为值得欣赏的事情。紧接着第三段的 persistently celebrates procreation 对这一社会氛围作了概括，但推断的基础仍要落在第二段的这些描写中。</p>\n"},{"title":"A. celebrity moms are a permanent source for gossip","raw":"### A. celebrity moms are a permanent source for gossip\n\n> 第二段说明，明星妈妈是长久不断的八卦来源。\n\n**做题模式中的状态：** 第一轮中，A 对应明星私生活新闻反复出现，与 D 一起保留。最后回查发现段中的积极描写和下一段对颂扬生育的承接更支持社会价值判断，A 只抓住报道素材这一层，最终排除。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n明星母亲确实持续出现在报道中，但题目要概括这一组母子形象所反映的内容。`A` 只抓反复报道，把 `attractive`、`cute`、`smiling` 共同建立的积极评价丢掉了。\n\n**出处：**\n\n> The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.\n>\n> Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q37-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>第二段说明，明星妈妈是长久不断的八卦来源。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮中，A 对应明星私生活新闻反复出现，与 D 一起保留。最后回查发现段中的积极描写和下一段对颂扬生育的承接更支持社会价值判断，A 只抓住报道素材这一层，最终排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>明星母亲确实持续出现在报道中，但题目要概括这一组母子形象所反映的内容。<code>A</code> 只抓反复报道，把 <code>attractive</code>、<code>cute</code>、<code>smiling</code> 共同建立的积极评价丢掉了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n</section>"},{"title":"A. celebrity moms are a permanent source for gossip","raw":"#### 定位比对法\n\n先把`A`接回题干，整句话就变成：\n\n> 第二段说明，明星妈妈是长久不断的八卦来源。\n\n`A`的`permanent source`指持续有话题，第二段有`usual`的怀孕消息与`Practically every week`；连同`Sandra`的单身、当妈妈消息回读全段，核对反复报道的具体内容。\n\n`Practically every week` 确实能支持明星母亲相关消息反复出现，故事也涉及私人生活，因此 A 不是完全没有落点。可题目需要概括整段，不能只抽走频率。\n\n段首 `attractive mother`、`cute baby` 与末尾 `smiling` 反复赋予母子形象正面色彩；新妈妈、单身妈妈和准妈妈又共同围绕生育身份展开。A 的 gossip 只能解释媒体有话题可写，不能概括这些描写共同传出的价值评价，因此不如 D 回答得完整。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q37-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>第二段说明，明星妈妈是长久不断的八卦来源。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮中，A 对应明星私生活新闻反复出现，与 D 一起保留。最后回查发现段中的积极描写和下一段对颂扬生育的承接更支持社会价值判断，A 只抓住报道素材这一层，最终排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>明星母亲确实持续出现在报道中，但题目要概括这一组母子形象所反映的内容。<code>A</code> 只抓反复报道，把 <code>attractive</code>、<code>cute</code>、<code>smiling</code> 共同建立的积极评价丢掉了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，明星妈妈是长久不断的八卦来源。</p>\n</blockquote>\n<p><code>A</code>的<code>permanent source</code>指持续有话题，第二段有<code>usual</code>的怀孕消息与<code>Practically every week</code>；连同<code>Sandra</code>的单身、当妈妈消息回读全段，核对反复报道的具体内容。</p>\n<p><code>Practically every week</code> 确实能支持明星母亲相关消息反复出现，故事也涉及私人生活，因此 A 不是完全没有落点。可题目需要概括整段，不能只抽走频率。</p>\n<p>段首 <code>attractive mother</code>、<code>cute baby</code> 与末尾 <code>smiling</code> 反复赋予母子形象正面色彩；新妈妈、单身妈妈和准妈妈又共同围绕生育身份展开。A 的 gossip 只能解释媒体有话题可写，不能概括这些描写共同传出的价值评价，因此不如 D 回答得完整。</p>\n</section>"},{"title":"A. celebrity moms are a permanent source for gossip","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.\n>\n> Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n>\n> 展示迷人母亲抱着可爱婴儿的杂志封面绝不是本周报刊亭上唯一的圣母子形象。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。\n\n第二段不只说有明星新闻，还反复将母亲和孩子写得美好。接着文章讨论社会持续颂扬生育，以及这种氛围给无子女者带来的压力。\n\n如果`A`真是作者的意思，文章至少得写成：\n\n> These magazines repeatedly use celebrity mothers’ private lives as gossip, and the discussion focuses on this continuing supply of stories.\n>\n> 这些杂志不断拿明星母亲的私生活制造八卦，讨论重点是这种持续不断的报道素材。\n\n`A` 能解释新闻为什么总有得写，却解释不了作者为何特意写迷人母亲、可爱婴儿和微笑形象。实际段落用多种正面形象指向对生育的推崇，`A` 停在了材料来源这一层。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q37-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-A-0\"><blockquote>\n<p>第二段说明，明星妈妈是长久不断的八卦来源。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮中，A 对应明星私生活新闻反复出现，与 D 一起保留。最后回查发现段中的积极描写和下一段对颂扬生育的承接更支持社会价值判断，A 只抓住报道素材这一层，最终排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>明星母亲确实持续出现在报道中，但题目要概括这一组母子形象所反映的内容。<code>A</code> 只抓反复报道，把 <code>attractive</code>、<code>cute</code>、<code>smiling</code> 共同建立的积极评价丢掉了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，明星妈妈是长久不断的八卦来源。</p>\n</blockquote>\n<p><code>A</code>的<code>permanent source</code>指持续有话题，第二段有<code>usual</code>的怀孕消息与<code>Practically every week</code>；连同<code>Sandra</code>的单身、当妈妈消息回读全段，核对反复报道的具体内容。</p>\n<p><code>Practically every week</code> 确实能支持明星母亲相关消息反复出现，故事也涉及私人生活，因此 A 不是完全没有落点。可题目需要概括整段，不能只抽走频率。</p>\n<p>段首 <code>attractive mother</code>、<code>cute baby</code> 与末尾 <code>smiling</code> 反复赋予母子形象正面色彩；新妈妈、单身妈妈和准妈妈又共同围绕生育身份展开。A 的 gossip 只能解释媒体有话题可写，不能概括这些描写共同传出的价值评价，因此不如 D 回答得完整。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>展示迷人母亲抱着可爱婴儿的杂志封面绝不是本周报刊亭上唯一的圣母子形象。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。</p>\n</blockquote>\n<p>第二段不只说有明星新闻，还反复将母亲和孩子写得美好。接着文章讨论社会持续颂扬生育，以及这种氛围给无子女者带来的压力。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>These magazines repeatedly use celebrity mothers’ private lives as gossip, and the discussion focuses on this continuing supply of stories.</p>\n<p>这些杂志不断拿明星母亲的私生活制造八卦，讨论重点是这种持续不断的报道素材。</p>\n</blockquote>\n<p><code>A</code> 能解释新闻为什么总有得写，却解释不了作者为何特意写迷人母亲、可爱婴儿和微笑形象。实际段落用多种正面形象指向对生育的推崇，<code>A</code> 停在了材料来源这一层。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. single mothers with babies deserve greater attention","raw":"### B. single mothers with babies deserve greater attention\n\n> 第二段说明，有婴儿的单身母亲理应得到更多关注。\n\n**做题模式中的状态：** 当时区分了“有一位单身母亲被报道”和 deserve greater attention 的规范性建议。原段没有这种建议或比较，第一轮排除 B。\n\n**错误类型：第三类——无中生有。**\n\n它借用 `Sandra` 的单身母亲身份，补出“这一类人应该得到更多关注”。新闻中受到关注这一事实，不提供理应如此的评价，更不提供 `greater` 的比较依据。\n\n**命题人借用的原文材料：**\n\n> There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual \"Jennifer Aniston is pregnant\" news.\n>\n> Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q37-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-B-0\"><blockquote>\n<p>第二段说明，有婴儿的单身母亲理应得到更多关注。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时区分了“有一位单身母亲被报道”和 deserve greater attention 的规范性建议。原段没有这种建议或比较，第一轮排除 B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它借用 <code>Sandra</code> 的单身母亲身份，补出“这一类人应该得到更多关注”。新闻中受到关注这一事实，不提供理应如此的评价，更不提供 <code>greater</code> 的比较依据。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n</section>"},{"title":"B. single mothers with babies deserve greater attention","raw":"#### 定位比对法\n\n先把`B`接回题干，整句话就变成：\n\n> 第二段说明，有婴儿的单身母亲理应得到更多关注。\n\n`B`的`single mothers`找到`newly single mom Sandra Bullock`，`deserve greater attention`又提出更值得关注；回看她的故事与其他母亲消息并列的句子，检查是否出现这种建议和比较。\n\n`B`里的`deserve`不是“正在受到”，而是“理应得到”；`greater`又要求比某个比较对象得到更多。第二段确有`newly single mom Sandra Bullock`，却把她的故事与母子封面、怀孕新闻并列，最后归到`celebrity mom or mom-to-be`。\n\n`Sandra`的单身身份用于交代这则新闻，并没有被拿来论证她比其他母亲更值得关注。`B`把“有一位单身母亲受到报道”变成“单身母亲这一类人应得到更多关注”，既把描述改成建议，又添上关注程度的比较。\n\n原段展示的是已经出现的多种报道，不是在提出向其中一类重新分配关注的主张。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q37-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-B-0\"><blockquote>\n<p>第二段说明，有婴儿的单身母亲理应得到更多关注。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时区分了“有一位单身母亲被报道”和 deserve greater attention 的规范性建议。原段没有这种建议或比较，第一轮排除 B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它借用 <code>Sandra</code> 的单身母亲身份，补出“这一类人应该得到更多关注”。新闻中受到关注这一事实，不提供理应如此的评价，更不提供 <code>greater</code> 的比较依据。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，有婴儿的单身母亲理应得到更多关注。</p>\n</blockquote>\n<p><code>B</code>的<code>single mothers</code>找到<code>newly single mom Sandra Bullock</code>，<code>deserve greater attention</code>又提出更值得关注；回看她的故事与其他母亲消息并列的句子，检查是否出现这种建议和比较。</p>\n<p><code>B</code>里的<code>deserve</code>不是“正在受到”，而是“理应得到”；<code>greater</code>又要求比某个比较对象得到更多。第二段确有<code>newly single mom Sandra Bullock</code>，却把她的故事与母子封面、怀孕新闻并列，最后归到<code>celebrity mom or mom-to-be</code>。</p>\n<p><code>Sandra</code>的单身身份用于交代这则新闻，并没有被拿来论证她比其他母亲更值得关注。<code>B</code>把“有一位单身母亲受到报道”变成“单身母亲这一类人应得到更多关注”，既把描述改成建议，又添上关注程度的比较。</p>\n<p>原段展示的是已经出现的多种报道，不是在提出向其中一类重新分配关注的主张。</p>\n</section>"},{"title":"B. single mothers with babies deserve greater attention","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual \"Jennifer Aniston is pregnant\" news.\n>\n> Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n>\n> 还有关于新近收养孩子且新近单身的妈妈桑德拉·布洛克的故事，以及常见的\"詹妮弗·安妮斯顿怀孕了\"的新闻。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。\n\n`Sandra` 的故事与怀孕新闻、其他明星母亲形象并列，最后用每周都有 `celebrity mom` 或 `mom-to-be` 概括。作者没有把单身母亲单独提出来要求优先关注。\n\n如果`B`真是作者的意思，文章至少得写成：\n\n> Single mothers with babies should receive more attention than they currently do.\n>\n> 有婴儿的单身母亲应该得到比现在更多的关注。\n\n`B` 至少需要作者提出“应该增加关注”的主张。实际只是列出已有报道，单身身份是例子中的信息，不能从一个被报道的人推导出面向整类人的建议。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q37-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-B-0\"><blockquote>\n<p>第二段说明，有婴儿的单身母亲理应得到更多关注。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时区分了“有一位单身母亲被报道”和 deserve greater attention 的规范性建议。原段没有这种建议或比较，第一轮排除 B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它借用 <code>Sandra</code> 的单身母亲身份，补出“这一类人应该得到更多关注”。新闻中受到关注这一事实，不提供理应如此的评价，更不提供 <code>greater</code> 的比较依据。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，有婴儿的单身母亲理应得到更多关注。</p>\n</blockquote>\n<p><code>B</code>的<code>single mothers</code>找到<code>newly single mom Sandra Bullock</code>，<code>deserve greater attention</code>又提出更值得关注；回看她的故事与其他母亲消息并列的句子，检查是否出现这种建议和比较。</p>\n<p><code>B</code>里的<code>deserve</code>不是“正在受到”，而是“理应得到”；<code>greater</code>又要求比某个比较对象得到更多。第二段确有<code>newly single mom Sandra Bullock</code>，却把她的故事与母子封面、怀孕新闻并列，最后归到<code>celebrity mom or mom-to-be</code>。</p>\n<p><code>Sandra</code>的单身身份用于交代这则新闻，并没有被拿来论证她比其他母亲更值得关注。<code>B</code>把“有一位单身母亲受到报道”变成“单身母亲这一类人应得到更多关注”，既把描述改成建议，又添上关注程度的比较。</p>\n<p>原段展示的是已经出现的多种报道，不是在提出向其中一类重新分配关注的主张。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>还有关于新近收养孩子且新近单身的妈妈桑德拉·布洛克的故事，以及常见的&quot;詹妮弗·安妮斯顿怀孕了&quot;的新闻。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。</p>\n</blockquote>\n<p><code>Sandra</code> 的故事与怀孕新闻、其他明星母亲形象并列，最后用每周都有 <code>celebrity mom</code> 或 <code>mom-to-be</code> 概括。作者没有把单身母亲单独提出来要求优先关注。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Single mothers with babies should receive more attention than they currently do.</p>\n<p>有婴儿的单身母亲应该得到比现在更多的关注。</p>\n</blockquote>\n<p><code>B</code> 至少需要作者提出“应该增加关注”的主张。实际只是列出已有报道，单身身份是例子中的信息，不能从一个被报道的人推导出面向整类人的建议。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. news about pregnant celebrities is entertaining","raw":"### C. news about pregnant celebrities is entertaining\n\n> 第二段说明，明星怀孕新闻令人觉得有趣、具有娱乐性。\n\n**做题模式中的状态：** 当时看到 usual、Practically every week 只说明常见，attractive、cute、smiling 描写的是封面人物。没有把这些信息改成读者被逗乐的反应，第一轮排除 C。\n\n**错误类型：第三类——无中生有。**\n\n它借用怀孕新闻和好看的封面，诱导我们补出公众感到娱乐。报道出现频繁、封面人物在微笑，都不等于原文描写了读者的娱乐体验。\n\n**命题人借用的原文材料：**\n\n> There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual \"Jennifer Aniston is pregnant\" news.\n>\n> Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q37-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-C-0\"><blockquote>\n<p>第二段说明，明星怀孕新闻令人觉得有趣、具有娱乐性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到 usual、Practically every week 只说明常见，attractive、cute、smiling 描写的是封面人物。没有把这些信息改成读者被逗乐的反应，第一轮排除 C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它借用怀孕新闻和好看的封面，诱导我们补出公众感到娱乐。报道出现频繁、封面人物在微笑，都不等于原文描写了读者的娱乐体验。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n</section>"},{"title":"C. news about pregnant celebrities is entertaining","raw":"#### 定位比对法\n\n先把`C`接回题干，整句话就变成：\n\n> 第二段说明，明星怀孕新闻令人觉得有趣、具有娱乐性。\n\n`entertaining`评价读者看新闻的感受，段内`pregnant news`前面是`usual`，末句又写`every week`；回读这两句并检查`smiling`修饰谁，分清频率、人物状态与读者感受。\n\n`C`把`pregnant celebrities`的消息评价为`entertaining`，说明它使读者觉得有趣或获得娱乐。第二段对应的表达却是`usual`的怀孕新闻，以及`Practically every week`重复出现的明星母亲形象：这些词说明消息多常见，没有描述读者阅读时有多开心。\n\n段中`attractive`、`cute`、`smiling`也分别修饰母亲、婴儿和封面人物，不是对新闻给公众带来娱乐的评价。`C`把画面里的人显得愉快，转成观看新闻的人得到娱乐，改变了感受的主体。\n\n频繁出现或封面好看都不能完成这一步，因此它没有准确表达这些具体描写正在建立的内容。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q37-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-C-0\"><blockquote>\n<p>第二段说明，明星怀孕新闻令人觉得有趣、具有娱乐性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到 usual、Practically every week 只说明常见，attractive、cute、smiling 描写的是封面人物。没有把这些信息改成读者被逗乐的反应，第一轮排除 C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它借用怀孕新闻和好看的封面，诱导我们补出公众感到娱乐。报道出现频繁、封面人物在微笑，都不等于原文描写了读者的娱乐体验。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，明星怀孕新闻令人觉得有趣、具有娱乐性。</p>\n</blockquote>\n<p><code>entertaining</code>评价读者看新闻的感受，段内<code>pregnant news</code>前面是<code>usual</code>，末句又写<code>every week</code>；回读这两句并检查<code>smiling</code>修饰谁，分清频率、人物状态与读者感受。</p>\n<p><code>C</code>把<code>pregnant celebrities</code>的消息评价为<code>entertaining</code>，说明它使读者觉得有趣或获得娱乐。第二段对应的表达却是<code>usual</code>的怀孕新闻，以及<code>Practically every week</code>重复出现的明星母亲形象：这些词说明消息多常见，没有描述读者阅读时有多开心。</p>\n<p>段中<code>attractive</code>、<code>cute</code>、<code>smiling</code>也分别修饰母亲、婴儿和封面人物，不是对新闻给公众带来娱乐的评价。<code>C</code>把画面里的人显得愉快，转成观看新闻的人得到娱乐，改变了感受的主体。</p>\n<p>频繁出现或封面好看都不能完成这一步，因此它没有准确表达这些具体描写正在建立的内容。</p>\n</section>"},{"title":"C. news about pregnant celebrities is entertaining","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual \"Jennifer Aniston is pregnant\" news.\n>\n> Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n>\n> 还有关于新近收养孩子且新近单身的妈妈桑德拉·布洛克的故事，以及常见的\"詹妮弗·安妮斯顿怀孕了\"的新闻。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。\n\n段落不断列举怀孕与母亲身份受到积极展示的现象，以每周反复出现结束；它没有写公众读到新闻后如何发笑、消遣或感到有趣。\n\n如果`C`真是作者的意思，文章至少得写成：\n\n> Readers find reports of celebrity pregnancies entertaining and enjoy them as amusement.\n>\n> 读者觉得明星怀孕报道很有趣，并将其当作娱乐。\n\n`C` 需要读者的娱乐感受，而实际 `smiling` 的是封面人物。把人物看起来愉快变成读者被娱乐，感受的主体已经换了；报道频率也不能补足这一关系。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q37-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-C-0\"><blockquote>\n<p>第二段说明，明星怀孕新闻令人觉得有趣、具有娱乐性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到 usual、Practically every week 只说明常见，attractive、cute、smiling 描写的是封面人物。没有把这些信息改成读者被逗乐的反应，第一轮排除 C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它借用怀孕新闻和好看的封面，诱导我们补出公众感到娱乐。报道出现频繁、封面人物在微笑，都不等于原文描写了读者的娱乐体验。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，明星怀孕新闻令人觉得有趣、具有娱乐性。</p>\n</blockquote>\n<p><code>entertaining</code>评价读者看新闻的感受，段内<code>pregnant news</code>前面是<code>usual</code>，末句又写<code>every week</code>；回读这两句并检查<code>smiling</code>修饰谁，分清频率、人物状态与读者感受。</p>\n<p><code>C</code>把<code>pregnant celebrities</code>的消息评价为<code>entertaining</code>，说明它使读者觉得有趣或获得娱乐。第二段对应的表达却是<code>usual</code>的怀孕新闻，以及<code>Practically every week</code>重复出现的明星母亲形象：这些词说明消息多常见，没有描述读者阅读时有多开心。</p>\n<p>段中<code>attractive</code>、<code>cute</code>、<code>smiling</code>也分别修饰母亲、婴儿和封面人物，不是对新闻给公众带来娱乐的评价。<code>C</code>把画面里的人显得愉快，转成观看新闻的人得到娱乐，改变了感受的主体。</p>\n<p>频繁出现或封面好看都不能完成这一步，因此它没有准确表达这些具体描写正在建立的内容。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>There are also stories about newly adoptive – and newly single – mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is pregnant&quot; news.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>还有关于新近收养孩子且新近单身的妈妈桑德拉·布洛克的故事，以及常见的&quot;詹妮弗·安妮斯顿怀孕了&quot;的新闻。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。</p>\n</blockquote>\n<p>段落不断列举怀孕与母亲身份受到积极展示的现象，以每周反复出现结束；它没有写公众读到新闻后如何发笑、消遣或感到有趣。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Readers find reports of celebrity pregnancies entertaining and enjoy them as amusement.</p>\n<p>读者觉得明星怀孕报道很有趣，并将其当作娱乐。</p>\n</blockquote>\n<p><code>C</code> 需要读者的娱乐感受，而实际 <code>smiling</code> 的是封面人物。把人物看起来愉快变成读者被娱乐，感受的主体已经换了；报道频率也不能补足这一关系。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. having children is highly valued by the public","raw":"### D. having children is highly valued by the public\n\n> 第二段说明，公众高度重视生儿育女。\n\n**做题模式中的状态：** 第一轮根据 attractive、cute、smiling 和每周出现的频率保留 D，但从封面走到公众价值的联系当时还没有说透，因此与 A 二选一。最后结合第三段的承接回查第二段，确定 D 更能概括这组正面形象。\n\n**选项类型：段落概括。**\n\n它把反复出现的不同母亲与准妈妈形象合起来，概括出母亲身份和生育受到社会推崇。不是只凭出现次数推断重视，还要把正面的描写一起带上。\n\n**出处：**\n\n> The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.\n>\n> Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n>\n> In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q37-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-D-0\"><blockquote>\n<p>第二段说明，公众高度重视生儿育女。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮根据 attractive、cute、smiling 和每周出现的频率保留 D，但从封面走到公众价值的联系当时还没有说透，因此与 A 二选一。最后结合第三段的承接回查第二段，确定 D 更能概括这组正面形象。</p>\n<p><strong>选项类型：段落概括。</strong></p>\n<p>它把反复出现的不同母亲与准妈妈形象合起来，概括出母亲身份和生育受到社会推崇。不是只凭出现次数推断重视，还要把正面的描写一起带上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?</p>\n</blockquote>\n</section>"},{"title":"D. having children is highly valued by the public","raw":"#### 定位比对法\n\n先把`D`接回题干，整句话就变成：\n\n> 第二段说明，公众高度重视生儿育女。\n\n`highly valued`评价生育的社会地位，第二段的`attractive mother`、`cute baby`与`smiling`带着正面描写；把段首与每周出现的末句合起来读，检查积极形象是否持续受到展示。\n\n把第二段的材料并起来：一方面，`hardly the only`、`usual` 和 `Practically every week` 表明报道持续出现；另一方面，`attractive`、`cute` 和 `smiling` 将母亲与孩子呈现得美好。D 的依据必须同时包含频率和正面呈现，不能只说“出现多，所以公众重视”。\n\n不同明星的共同点是母亲或准妈妈身份，段落由具体例子推向反复出现的社会现象。公众面前持续展示这类正面形象，可以概括为生育受到推崇；第三段的 `persistently celebrates procreation` 进一步确认了这个承接。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q37-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-D-0\"><blockquote>\n<p>第二段说明，公众高度重视生儿育女。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮根据 attractive、cute、smiling 和每周出现的频率保留 D，但从封面走到公众价值的联系当时还没有说透，因此与 A 二选一。最后结合第三段的承接回查第二段，确定 D 更能概括这组正面形象。</p>\n<p><strong>选项类型：段落概括。</strong></p>\n<p>它把反复出现的不同母亲与准妈妈形象合起来，概括出母亲身份和生育受到社会推崇。不是只凭出现次数推断重视，还要把正面的描写一起带上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，公众高度重视生儿育女。</p>\n</blockquote>\n<p><code>highly valued</code>评价生育的社会地位，第二段的<code>attractive mother</code>、<code>cute baby</code>与<code>smiling</code>带着正面描写；把段首与每周出现的末句合起来读，检查积极形象是否持续受到展示。</p>\n<p>把第二段的材料并起来：一方面，<code>hardly the only</code>、<code>usual</code> 和 <code>Practically every week</code> 表明报道持续出现；另一方面，<code>attractive</code>、<code>cute</code> 和 <code>smiling</code> 将母亲与孩子呈现得美好。D 的依据必须同时包含频率和正面呈现，不能只说“出现多，所以公众重视”。</p>\n<p>不同明星的共同点是母亲或准妈妈身份，段落由具体例子推向反复出现的社会现象。公众面前持续展示这类正面形象，可以概括为生育受到推崇；第三段的 <code>persistently celebrates procreation</code> 进一步确认了这个承接。</p>\n</section>"},{"title":"D. having children is highly valued by the public","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.\n>\n> Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n>\n> In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?\n>\n> 展示迷人母亲抱着可爱婴儿的杂志封面绝不是本周报刊亭上唯一的圣母子形象。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。在一个如此持续颂扬生育的社会中，承认后悔生孩子等同于承认支持杀小猫，这有什么奇怪的吗？\n\n第二段从一个迷人母亲抱可爱婴儿的封面扩展到多种明星母亲报道，再说几乎每周都出现微笑的母亲或准妈妈。第三段开头将这种持续展示承接为社会对生育的颂扬。\n\n如果`D`真是作者的意思，文章至少得写成：\n\n> The recurring positive images of mothers and babies reflect the high value society places on having children.\n>\n> 反复出现的正面母婴形象反映出社会对生育的高度重视。\n\n`D` 要求的是“多种正面形象持续出现 → 反映共同的价值评价”。第二段的形容词、例子范围和频率共同支撑这一推断，后面的社会评价只是进一步确认，并未替代第二段的依据。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q37-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q37-D-0\"><blockquote>\n<p>第二段说明，公众高度重视生儿育女。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮根据 attractive、cute、smiling 和每周出现的频率保留 D，但从封面走到公众价值的联系当时还没有说透，因此与 A 二选一。最后结合第三段的承接回查第二段，确定 D 更能概括这组正面形象。</p>\n<p><strong>选项类型：段落概括。</strong></p>\n<p>它把反复出现的不同母亲与准妈妈形象合起来，概括出母亲身份和生育受到社会推崇。不是只凭出现次数推断重视，还要把正面的描写一起带上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q37-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第二段说明，公众高度重视生儿育女。</p>\n</blockquote>\n<p><code>highly valued</code>评价生育的社会地位，第二段的<code>attractive mother</code>、<code>cute baby</code>与<code>smiling</code>带着正面描写；把段首与每周出现的末句合起来读，检查积极形象是否持续受到展示。</p>\n<p>把第二段的材料并起来：一方面，<code>hardly the only</code>、<code>usual</code> 和 <code>Practically every week</code> 表明报道持续出现；另一方面，<code>attractive</code>、<code>cute</code> 和 <code>smiling</code> 将母亲与孩子呈现得美好。D 的依据必须同时包含频率和正面呈现，不能只说“出现多，所以公众重视”。</p>\n<p>不同明星的共同点是母亲或准妈妈身份，段落由具体例子推向反复出现的社会现象。公众面前持续展示这类正面形象，可以概括为生育受到推崇；第三段的 <code>persistently celebrates procreation</code> 进一步确认了这个承接。</p>\n</section><section class=\"revealPart\" id=\"focus-q37-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n<p>Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?</p>\n<p>展示迷人母亲抱着可爱婴儿的杂志封面绝不是本周报刊亭上唯一的圣母子形象。几乎每周都有至少一位名人妈妈或准妈妈在报刊亭上微笑。在一个如此持续颂扬生育的社会中，承认后悔生孩子等同于承认支持杀小猫，这有什么奇怪的吗？</p>\n</blockquote>\n<p>第二段从一个迷人母亲抱可爱婴儿的封面扩展到多种明星母亲报道，再说几乎每周都出现微笑的母亲或准妈妈。第三段开头将这种持续展示承接为社会对生育的颂扬。</p>\n<p>如果<code>D</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The recurring positive images of mothers and babies reflect the high value society places on having children.</p>\n<p>反复出现的正面母婴形象反映出社会对生育的高度重视。</p>\n</blockquote>\n<p><code>D</code> 要求的是“多种正面形象持续出现 → 反映共同的价值评价”。第二段的形容词、例子范围和频率共同支撑这一推断，后面的社会评价只是进一步确认，并未替代第二段的依据。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"37题结论","raw":"### 37题结论\n\n> **37. D. having children is highly valued by the public**\n\n- A：明星母亲确实持续出现在报道中，但题目要概括这一组母子形象所反映的内容。A 只抓反复报道，把 attractive、cute、smiling 共同建立的积极评价丢掉了。\n- B：它借用 Sandra 的单身母亲身份，补出“这一类人应该得到更多关注”。新闻中受到关注这一事实，不提供理应如此的评价，更不提供 greater 的比较依据。\n- C：它借用怀孕新闻和好看的封面，诱导我们补出公众感到娱乐。报道出现频繁、封面人物在微笑，都不等于原文描写了读者的娱乐体验。\n- D：它把反复出现的不同母亲与准妈妈形象合起来，概括出母亲身份和生育受到社会推崇。不是只凭出现次数推断重视，还要把正面的描写一起带上。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"37题","focus":[250,745,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"conclusion","question":"37","questionConclusion":true},"html":"<blockquote>\n<p><strong>37. D. having children is highly valued by the public</strong></p>\n</blockquote>\n<ul>\n<li>A：明星母亲确实持续出现在报道中，但题目要概括这一组母子形象所反映的内容。A 只抓反复报道，把 attractive、cute、smiling 共同建立的积极评价丢掉了。</li>\n<li>B：它借用 Sandra 的单身母亲身份，补出“这一类人应该得到更多关注”。新闻中受到关注这一事实，不提供理应如此的评价，更不提供 greater 的比较依据。</li>\n<li>C：它借用怀孕新闻和好看的封面，诱导我们补出公众感到娱乐。报道出现频繁、封面人物在微笑，都不等于原文描写了读者的娱乐体验。</li>\n<li>D：它把反复出现的不同母亲与准妈妈形象合起来，概括出母亲身份和生育受到社会推崇。不是只凭出现次数推断重视，还要把正面的描写一起带上。</li>\n</ul>\n"},{"title":"38题 · 题干、题型与核心出处","raw":"## 38题\n\n> It is suggested in Paragraph 3 that childless folks ______.\n>\n> 第三段暗示，没有孩子的人处于怎样的处境？\n\n### 题型\n\n局部推断题。题干限定第三段，比较 unhappy parents 和 unhappy childless folks 受到的不同对待，并区分社会施加的评价与作者自己的判断。\n\n### 核心出处\n\n> In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?\n>\n> It doesn't seem quite fair, then, to compare the regrets of parents to the regrets of the childless.\n>\n> Unhappy parents rarely are provoked to wonder if they shouldn't have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.\n\n社会持续颂扬生育，父母不快乐很少被拿来追问当初是否不该生孩子；无子女者的不快乐却被说成缺少孩子的结果。作者用 not quite fair 揭示这种不对称，支持的是他们承受否定压力，而非作者赞同这种责备。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"question","question":"38","questionIntro":true},"html":"<blockquote>\n<p>It is suggested in Paragraph 3 that childless folks ______.</p>\n<p>第三段暗示，没有孩子的人处于怎样的处境？</p>\n</blockquote>\n<h3>题型</h3>\n<p>局部推断题。题干限定第三段，比较 unhappy parents 和 unhappy childless folks 受到的不同对待，并区分社会施加的评价与作者自己的判断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?</p>\n<p>It doesn&#39;t seem quite fair, then, to compare the regrets of parents to the regrets of the childless.</p>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n<p>社会持续颂扬生育，父母不快乐很少被拿来追问当初是否不该生孩子；无子女者的不快乐却被说成缺少孩子的结果。作者用 not quite fair 揭示这种不对称，支持的是他们承受否定压力，而非作者赞同这种责备。</p>\n"},{"title":"A. are constantly exposed to criticism","raw":"### A. are constantly exposed to criticism\n\n> 第三段暗示，无子女者不断承受否定和责备。\n\n**做题模式中的状态：** 当时读到 are bothered with the message，并与 unhappy parents 很少被迫反思的处境对照，判断无子女者承受的是不对称的否定压力。第一轮保留并选 A。\n\n**选项类型：跨句概括。**\n\n它概括的 `criticism` 不只指当面辱骂，也包括反复把一种生活选择说成缺陷。社会持续颂扬生育，再把无子女者的不快乐归因于缺少孩子，构成这种压力。\n\n**出处：**\n\n> In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?\n>\n> It doesn't seem quite fair, then, to compare the regrets of parents to the regrets of the childless.\n>\n> Unhappy parents rarely are provoked to wonder if they shouldn't have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q38-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-A-0\"><blockquote>\n<p>第三段暗示，无子女者不断承受否定和责备。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时读到 are bothered with the message，并与 unhappy parents 很少被迫反思的处境对照，判断无子女者承受的是不对称的否定压力。第一轮保留并选 A。</p>\n<p><strong>选项类型：跨句概括。</strong></p>\n<p>它概括的 <code>criticism</code> 不只指当面辱骂，也包括反复把一种生活选择说成缺陷。社会持续颂扬生育，再把无子女者的不快乐归因于缺少孩子，构成这种压力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?</p>\n<p>It doesn&#39;t seem quite fair, then, to compare the regrets of parents to the regrets of the childless.</p>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n</section>"},{"title":"A. are constantly exposed to criticism","raw":"#### 定位比对法\n\n先把`A`接回题干，整句话就变成：\n\n> 第三段暗示，无子女者不断承受否定和责备。\n\n`criticism`要找到对无子女者的否定，第三段用`are bothered with the message`介绍他们受到的信息；回读完整末句，同时对照前面的`Unhappy parents`，检查否定具体落在哪里。\n\n`A`的`criticism`不必仅指当面责骂，也可以是反复把某种生活选择说成缺陷。第三段写`unhappy childless folks are bothered with the message`，随后给出信息内容：孩子最重要，他们的痛苦显然必定来自生活中没有孩子的位置。\n\n对照`Unhappy parents`，已经不快乐的父母很少被迫追问当初是否不该生育，无子女者的不快乐却被用来证明没有孩子是个问题。`A`概括的是这种不对称的否定压力。\n\n`constantly`与段首`persistently`描绘的社会气氛相接，不需要把它夸大成每个人每一刻都受到直接责骂。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q38-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-A-0\"><blockquote>\n<p>第三段暗示，无子女者不断承受否定和责备。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时读到 are bothered with the message，并与 unhappy parents 很少被迫反思的处境对照，判断无子女者承受的是不对称的否定压力。第一轮保留并选 A。</p>\n<p><strong>选项类型：跨句概括。</strong></p>\n<p>它概括的 <code>criticism</code> 不只指当面辱骂，也包括反复把一种生活选择说成缺陷。社会持续颂扬生育，再把无子女者的不快乐归因于缺少孩子，构成这种压力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?</p>\n<p>It doesn&#39;t seem quite fair, then, to compare the regrets of parents to the regrets of the childless.</p>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段暗示，无子女者不断承受否定和责备。</p>\n</blockquote>\n<p><code>criticism</code>要找到对无子女者的否定，第三段用<code>are bothered with the message</code>介绍他们受到的信息；回读完整末句，同时对照前面的<code>Unhappy parents</code>，检查否定具体落在哪里。</p>\n<p><code>A</code>的<code>criticism</code>不必仅指当面责骂，也可以是反复把某种生活选择说成缺陷。第三段写<code>unhappy childless folks are bothered with the message</code>，随后给出信息内容：孩子最重要，他们的痛苦显然必定来自生活中没有孩子的位置。</p>\n<p>对照<code>Unhappy parents</code>，已经不快乐的父母很少被迫追问当初是否不该生育，无子女者的不快乐却被用来证明没有孩子是个问题。<code>A</code>概括的是这种不对称的否定压力。</p>\n<p><code>constantly</code>与段首<code>persistently</code>描绘的社会气氛相接，不需要把它夸大成每个人每一刻都受到直接责骂。</p>\n</section>"},{"title":"A. are constantly exposed to criticism","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?\n>\n> It doesn't seem quite fair, then, to compare the regrets of parents to the regrets of the childless.\n>\n> Unhappy parents rarely are provoked to wonder if they shouldn't have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.\n>\n> 在一个如此持续颂扬生育的社会中，承认后悔生孩子等同于承认支持杀小猫，这有什么奇怪的吗？因此，比较父母的遗憾与无子女者的遗憾似乎不太公平。不快乐的父母很少被人逼着反思当初是否不该生孩子，但不快乐的无子女者却被\"孩子是世界上最重要的事情\"这样的信息所困扰：显然他们的痛苦必定是生活中没有孩子留下的巨大空缺的直接结果。\n\n作者先交代持续赞美生育的社会氛围，再说两类人的遗憾被不公平地比较，最后展示无子女者被什么信息困扰。\n\n如果`A`真是作者的意思，文章至少得写成：\n\n> Childless people repeatedly face the judgment that their lives are deficient because they have no children.\n>\n> 无子女者反复面对一种评判：因为没有孩子，他们的生活存在缺陷。\n\n`A` 所需的否定压力由具体的信息内容体现出来：孩子最重要，而他们的不幸被说成没有孩子所致。`constantly` 对应持续的社会压力，不必夸张成每个人每一秒都遭受直接斥责。\n\n**复盘判断：A正确。**","section":"第三鸟 oles in their lives.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q38-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-B-0\"><blockquote>\n<p>第三段暗示，无子女者大体被媒体忽视。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 media 被遮挡，但 ignored 仍可见。该段写他们受到价值判断的打扰，未讨论某一方的报道份额，因此第一轮排除 B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它容易让人联想到前一段媒体总在展示明星母亲，于是自行补出媒体忽略无子女者。第三段实际讨论社会评价，未比较媒体对两类人的关注比例。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n</section>"},{"title":"B. are largely ignored by the media","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 第三段暗示，无子女者大体被媒体忽视。\n\nB把无子女者的处境概括为`largely ignored by the media`，也就是媒体大体忽略他们。这个说法需要比较媒体是否报道他们、对他们的经历给了多少关注。\n\n第三段的实际动作是`are bothered with the message`：他们受到一种信息的困扰。后面明确写出信息内容——孩子是世界上最重要的东西，因此他们的不快乐必定来自没有孩子。这里交代的是无子女者受到怎样的价值评判。\n\n上一段确实频繁出现明星母亲，但报道过许多母亲，并不能推出媒体很少报道没有孩子的人。也不能因为无子女者受到否定，就反过来说他们没有被注意。B所写的媒体关注份额没有在这一段建立，A的否定压力才与这条信息的内容对应。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q38-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-B-0\"><blockquote>\n<p>第三段暗示，无子女者大体被媒体忽视。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 media 被遮挡，但 ignored 仍可见。该段写他们受到价值判断的打扰，未讨论某一方的报道份额，因此第一轮排除 B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它容易让人联想到前一段媒体总在展示明星母亲，于是自行补出媒体忽略无子女者。第三段实际讨论社会评价，未比较媒体对两类人的关注比例。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段暗示，无子女者大体被媒体忽视。</p>\n</blockquote>\n<p>B把无子女者的处境概括为<code>largely ignored by the media</code>，也就是媒体大体忽略他们。这个说法需要比较媒体是否报道他们、对他们的经历给了多少关注。</p>\n<p>第三段的实际动作是<code>are bothered with the message</code>：他们受到一种信息的困扰。后面明确写出信息内容——孩子是世界上最重要的东西，因此他们的不快乐必定来自没有孩子。这里交代的是无子女者受到怎样的价值评判。</p>\n<p>上一段确实频繁出现明星母亲，但报道过许多母亲，并不能推出媒体很少报道没有孩子的人。也不能因为无子女者受到否定，就反过来说他们没有被注意。B所写的媒体关注份额没有在这一段建立，A的否定压力才与这条信息的内容对应。</p>\n</section>"},{"title":"B. are largely ignored by the media","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Unhappy parents rarely are provoked to wonder if they shouldn't have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.\n>\n> 不快乐的父母很少被人逼着反思当初是否不该生孩子，但不快乐的无子女者却被\"孩子是世界上最重要的事情\"这样的信息所困扰：显然他们的痛苦必定是生活中没有孩子留下的巨大空缺的直接结果。\n\n作者继续写无子女者被怎样的信息困扰，而不是列出他们在媒体中出现多少次。差别对待表现为否定压力，不能直接改成缺少媒体关注。\n\n如果`B`真是作者的意思，文章至少得写成：\n\n> The media devote little coverage to childless people and largely leave their experiences unreported.\n>\n> 媒体很少报道无子女者，他们的经历大体没有进入报道。\n\n`B` 需要媒体报道份额的材料，原文没有提供。受到社会压力与是否被媒体忽略是两件事，不能把 `are bothered` 直接换成 `ignored`，也不能拿上一段的报道例子补出统计结论。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sou </p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>The media devote little coverage to childless people and largely leave their experiences unreported.</p>\n<p>媒体很少报道无子女者，他们的经历大体没有进入报道。</p>\n</blockquote>\n<p><code>B</code> 需要媒体报道份额的材料，原文没有提供。受到社会压力与是否被媒体忽略是两件事，不能把 <code>are bothered</code> 直接换成 <code>ignored</code>，也不能拿上一段的报道例子补出统计结论。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. fail to fulfill their social responsibilities","raw":"### C. fail to fulfill their social responsibilities\n\n> 第三段暗示，无子女者没有履行自己的社会责任。\n\n**做题模式中的状态：** 当时把社会施加的信息与作者的 not quite fair 分开，没把“受到责备”当成“确实有错”，第一轮排除 C。\n\n**错误类型：第一类——歪曲原意。**\n\n它借用“孩子最重要、没有孩子导致痛苦”的社会评价，改写成作者对无子女者的责任判决。作者实际在揭示这种评价的不公平。\n\n**出处：**\n\n> It doesn't seem quite fair, then, to compare the regrets of parents to the regrets of the childless.\n>\n> Unhappy parents rarely are provoked to wonder if they shouldn't have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q38-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-C-0\"><blockquote>\n<p>第三段暗示，无子女者没有履行自己的社会责任。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时把社会施加的信息与作者的 not quite fair 分开，没把“受到责备”当成“确实有错”，第一轮排除 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用“孩子最重要、没有孩子导致痛苦”的社会评价，改写成作者对无子女者的责任判决。作者实际在揭示这种评价的不公平。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It doesn&#39;t seem quite fair, then, to compare the regrets of parents to the regrets of the childless.</p>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n</section>"},{"title":"C. fail to fulfill their social responsibilities","raw":"#### 定位比对法\n\n先把`C`接回题干，整句话就变成：\n\n> 第三段暗示，无子女者没有履行自己的社会责任。\n\n`fail to fulfill social responsibilities`是在认定无子女者失责，第三段却先评价`doesn’t seem quite fair`；连着读后面的`message`和`misery`，分清作者的判断与社会施加的信息。\n\n`C`的`fail to fulfill their social responsibilities`把无子女者未生育判成没有尽到社会责任。原段却先说拿父母和无子女者的后悔作比较`doesn’t seem quite fair`，再展示他们所接收到的信息：孩子最重要，痛苦必定因为没有孩子。\n\n这些评价是被用来解释无子女者怎样受到压力的，并非作者认可的责任标准。`C`把“他们被这样责备”改成“他们确实做错了”，省掉了信息是谁施加、作者怎样评价这种对待两个层次。\n\n如此接回题干，就会把作者对不公平评价的揭示读成他自己赞同这套评价。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q38-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-C-0\"><blockquote>\n<p>第三段暗示，无子女者没有履行自己的社会责任。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时把社会施加的信息与作者的 not quite fair 分开，没把“受到责备”当成“确实有错”，第一轮排除 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用“孩子最重要、没有孩子导致痛苦”的社会评价，改写成作者对无子女者的责任判决。作者实际在揭示这种评价的不公平。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It doesn&#39;t seem quite fair, then, to compare the regrets of parents to the regrets of the childless.</p>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段暗示，无子女者没有履行自己的社会责任。</p>\n</blockquote>\n<p><code>fail to fulfill social responsibilities</code>是在认定无子女者失责，第三段却先评价<code>doesn’t seem quite fair</code>；连着读后面的<code>message</code>和<code>misery</code>，分清作者的判断与社会施加的信息。</p>\n<p><code>C</code>的<code>fail to fulfill their social responsibilities</code>把无子女者未生育判成没有尽到社会责任。原段却先说拿父母和无子女者的后悔作比较<code>doesn’t seem quite fair</code>，再展示他们所接收到的信息：孩子最重要，痛苦必定因为没有孩子。</p>\n<p>这些评价是被用来解释无子女者怎样受到压力的，并非作者认可的责任标准。<code>C</code>把“他们被这样责备”改成“他们确实做错了”，省掉了信息是谁施加、作者怎样评价这种对待两个层次。</p>\n<p>如此接回题干，就会把作者对不公平评价的揭示读成他自己赞同这套评价。</p>\n</section>"},{"title":"C. fail to fulfill their social responsibilities","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It doesn't seem quite fair, then, to compare the regrets of parents to the regrets of the childless.\n>\n> Unhappy parents rarely are provoked to wonder if they shouldn't have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.\n>\n> 因此，比较父母的遗憾与无子女者的遗憾似乎不太公平。不快乐的父母很少被人逼着反思当初是否不该生孩子，但不快乐的无子女者却被\"孩子是世界上最重要的事情\"这样的信息所困扰：显然他们的痛苦必定是生活中没有孩子留下的巨大空缺的直接结果。\n\n作者先指出比较不太公平，再并排描述父母和无子女者受到的不同追问。后面的强硬归因属于被揭示的社会压力，不是作者提出的责任标准。\n\n如果`C`真是作者的意思，文章至少得写成：\n\n> People without children are failing to meet a social responsibility that they ought to fulfill.\n>\n> 没有孩子的人没有履行一项本应承担的社会责任。\n\n`C` 所需的是作者认可“未生育就是失责”，原文却先质疑比较的公平性。记录一种责备与认可这种责备，评价主体和态度方向都不同。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q38-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-C-0\"><blockquote>\n<p>第三段暗示，无子女者没有履行自己的社会责任。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时把社会施加的信息与作者的 not quite fair 分开，没把“受到责备”当成“确实有错”，第一轮排除 C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用“孩子最重要、没有孩子导致痛苦”的社会评价，改写成作者对无子女者的责任判决。作者实际在揭示这种评价的不公平。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It doesn&#39;t seem quite fair, then, to compare the regrets of parents to the regrets of the childless.</p>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段暗示，无子女者没有履行自己的社会责任。</p>\n</blockquote>\n<p><code>fail to fulfill social responsibilities</code>是在认定无子女者失责，第三段却先评价<code>doesn’t seem quite fair</code>；连着读后面的<code>message</code>和<code>misery</code>，分清作者的判断与社会施加的信息。</p>\n<p><code>C</code>的<code>fail to fulfill their social responsibilities</code>把无子女者未生育判成没有尽到社会责任。原段却先说拿父母和无子女者的后悔作比较<code>doesn’t seem quite fair</code>，再展示他们所接收到的信息：孩子最重要，痛苦必定因为没有孩子。</p>\n<p>这些评价是被用来解释无子女者怎样受到压力的，并非作者认可的责任标准。<code>C</code>把“他们被这样责备”改成“他们确实做错了”，省掉了信息是谁施加、作者怎样评价这种对待两个层次。</p>\n<p>如此接回题干，就会把作者对不公平评价的揭示读成他自己赞同这套评价。</p>\n</section><section class=\"revealPart\" id=\"focus-q38-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It doesn&#39;t seem quite fair, then, to compare the regrets of parents to the regrets of the childless.</p>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n<p>因此，比较父母的遗憾与无子女者的遗憾似乎不太公平。不快乐的父母很少被人逼着反思当初是否不该生孩子，但不快乐的无子女者却被&quot;孩子是世界上最重要的事情&quot;这样的信息所困扰：显然他们的痛苦必定是生活中没有孩子留下的巨大空缺的直接结果。</p>\n</blockquote>\n<p>作者先指出比较不太公平，再并排描述父母和无子女者受到的不同追问。后面的强硬归因属于被揭示的社会压力，不是作者提出的责任标准。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>People without children are failing to meet a social responsibility that they ought to fulfill.</p>\n<p>没有孩子的人没有履行一项本应承担的社会责任。</p>\n</blockquote>\n<p><code>C</code> 所需的是作者认可“未生育就是失责”，原文却先质疑比较的公平性。记录一种责备与认可这种责备，评价主体和态度方向都不同。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. are less likely to be satisfied with their life","raw":"### D. are less likely to be satisfied with their life\n\n> 第三段暗示，无子女者更不容易对生活感到满意。\n\n**做题模式中的状态：** 当时发现原段比较的是两个已经不快乐的小组所受的对待，不能据此判断全部无子女者的满意度更低，因此第一轮排除 D。\n\n**错误类型：第一类——歪曲原意。**\n\n它把外界对无子女者痛苦的归因当成事实，又从 `unhappy childless folks` 扩大到整个无子女群体，改成满意可能性的比较。\n\n**出处：**\n\n> Unhappy parents rarely are provoked to wonder if they shouldn't have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q38-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-D-0\"><blockquote>\n<p>第三段暗示，无子女者更不容易对生活感到满意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时发现原段比较的是两个已经不快乐的小组所受的对待，不能据此判断全部无子女者的满意度更低，因此第一轮排除 D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把外界对无子女者痛苦的归因当成事实，又从 <code>unhappy childless folks</code> 扩大到整个无子女群体，改成满意可能性的比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n</section>"},{"title":"D. are less likely to be satisfied with their life","raw":"#### 定位比对法\n\n先把`D`接回题干，整句话就变成：\n\n> 第三段暗示，无子女者更不容易对生活感到满意。\n\n`less likely to be satisfied`比较整个群体的满意可能性，第三段实际以`Unhappy parents`和`unhappy childless folks`作对照；回读末句，检查比较的是总体感受还是已经不快乐的人受到的评价。\n\n`D`的`less likely to be satisfied`比较的是两大类人对生活满意的可能性。第三段先明确取出`unhappy parents`和`unhappy childless folks`，两组在这次比较里都已经不快乐；后面讨论的是一组是否被迫反思生育，另一组怎样被告知缺少孩子才痛苦。\n\n由此能比较他们受到的对待，不能算出全部父母或全部无子女者谁更容易满意。特别是“痛苦直接来自没有孩子”被放在社会施加的信息中，不能再当成作者统计出来的真实原因。\n\n`D`把外界的归因当作实际满意度结果，还把两个已不快乐的小组扩大成整个群体。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"38题","focus":[250,1250,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q38-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q38-D-0\"><blockquote>\n<p>第三段暗示，无子女者更不容易对生活感到满意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时发现原段比较的是两个已经不快乐的小组所受的对待，不能据此判断全部无子女者的满意度更低，因此第一轮排除 D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它把外界对无子女者痛苦的归因当成事实，又从 <code>unhappy childless folks</code> 扩大到整个无子女群体，改成满意可能性的比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Unhappy parents rarely are provoked to wonder if they shouldn&#39;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q38-D-1\"><h3>定位比对法</h3>\n<p>先把<code>D</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段暗示，无子女者更不容易对生活感到满意。</p>\n</blockquote>\n<p><code>less likely to be satisfied</code>比较整个群体的满意可能性，第三段实际以<code>Unhappy parents</code>和<code>unhappy childless folks</code>作对照；回读末句，检查比较
