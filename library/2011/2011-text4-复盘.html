k of stress-free, happiness-enhancing parenthood aren&#39;t in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>But it&#39;s interesting to wonder / if the images we see every week / of stress-free, happiness-enhancing parenthood / aren&#39;t in some small, subconscious way / contributing to our own dissatisfactions / with the actual experience, / in the same way / that a small part of us hoped / getting &quot;the Rachel&quot; / might make us look / just a little bit like Jennifer Aniston.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>但有趣的是想知道 / 我们每周看到的形象 / 无压力、增强幸福感的育儿 / 是否不是在某种微小的、潜意识的方式 / 导致我们自己的不满 / 对实际体验，/ 以同样的方式 / 我们的一小部分希望 / 剪&quot;瑞秋头&quot; / 可能让我们看起来 / 有点像詹妮弗·安妮斯顿。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>先把图像的来源和内容放在一起：</p>\n<blockquote>\n<p>我们每周看到的、将育儿表现得无压力又增进幸福的形象</p>\n</blockquote>\n<p>再把影响的对象与程度接好：</p>\n<blockquote>\n<p>以微小的、潜意识的方式，促成对实际育儿体验的不满</p>\n</blockquote>\n<p>末尾类比单独保留：</p>\n<blockquote>\n<p>就像我们曾希望剪相同发型，多少能更像明星</p>\n</blockquote>\n<p>先得到：</p>\n<blockquote>\n<p>作者追问理想化育儿图像是否影响真实感受\n这种影响可能微小、发生在潜意识中\n发型愿望用来类比这种对明星形象的期待</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>这些育儿形象是否以微小的潜意识影响，促成了我们对实际体验的不满？</p>\n</blockquote>\n<p>先用“但”接住前句的理性限制；将图像的修饰语放到“育儿形象”前，将微小、潜意识的限制放在“导致”前；发型类比放在整段追问之后，避免喧宾夺主。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>但值得思考的是，每周看到的无压力、增加幸福的育儿形象，是否以某种微小的潜意识方式增加了我们对实际体验的不满，就像我们曾有一点希望剪瑞秋头会让自己有点像詹妮弗·安妮斯顿一样。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：</p>\n<p>“无压力、增强幸福感”成组修饰育儿形象；用“就像……一样”收住类比，保留原文的程度限制。这里不是直接模仿明星就一定生孩子，而是理想化形象可能影响期待，不可把这层较小的影响译成完全决定。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>但有趣的是，我们每周看到的那些无压力、增强幸福感的育儿形象，是否在某种微小的、潜意识的方式上导致了我们对实际体验的不满，就像我们曾经有一小部分希望剪个&quot;瑞秋头&quot;可能让我们看起来有点像詹妮弗·安妮斯顿一样。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","level":1,"context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":2256,"sourceH":3142},"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"36题 · 题干、题型与核心出处","raw":"## 36题\n\n> Jennifer Senior suggests in her article that raising a child can bring ______.\n>\n> Jennifer Senior 在文章中认为，养育孩子能够带来什么？\n\n### 题型\n\n具体细节题。题干问 Senior 的观点，定位第一段她对 happiness 的重新定义，区分当下感受、事后回顾与快乐持续多久。\n\n### 核心出处\n\n> Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n>\n> Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that \"the very things that in the moment dampen our moods can later be sources of intense gratification and delight.\"\n\ninstead of ... we should ... 将衡量幸福的视角从每时每刻的快乐移到过去经历；后一句用 in the moment 与 later 解释同一经历的感受怎样变化。要找的是回顾中的幸福，而不是一段固定时长的快乐。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"kind":"question","question":"36","questionIntro":true},"html":"<blockquote>\n<p>Jennifer Senior suggests in her article that raising a child can bring ______.</p>\n<p>Jennifer Senior 在文章中认为，养育孩子能够带来什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>具体细节题。题干问 Senior 的观点，定位第一段她对 happiness 的重新定义，区分当下感受、事后回顾与快乐持续多久。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n<p>instead of ... we should ... 将衡量幸福的视角从每时每刻的快乐移到过去经历；后一句用 in the moment 与 later 解释同一经历的感受怎样变化。要找的是回顾中的幸福，而不是一段固定时长的快乐。</p>\n"},{"title":"A. temporary delight","raw":"### A. temporary delight\n\n> Senior 认为，养育孩子能带来短暂的快乐。\n\n**做题模式中的状态：** 当时看到了 past-tense condition 与 later，判断原文区分的是回看经历的角度；temporary 却限定持续时长，第一轮排除 A。\n\n**错误类型：第一类——歪曲原意。**\n\n它借用了 `delight` 这个结果，把“当时辛苦、事后感到喜悦”的时间关系，改成快乐只持续一小会儿。原文没有给后来喜悦规定这样的期限。\n\n**出处：**\n\n> Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n>\n> Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that \"the very things that in the moment dampen our moods can later be sources of intense gratification and delight.\"","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q36-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-A-0\"><blockquote>\n<p>Senior 认为，养育孩子能带来短暂的快乐。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到了 past-tense condition 与 later，判断原文区分的是回看经历的角度；temporary 却限定持续时长，第一轮排除 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了 <code>delight</code> 这个结果，把“当时辛苦、事后感到喜悦”的时间关系，改成快乐只持续一小会儿。原文没有给后来喜悦规定这样的期限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section>"},{"title":"A. temporary delight","raw":"#### 定位比对法\n\n先把`A`接回题干，整句话就变成：\n\n> Senior 认为，养育孩子能带来短暂的快乐。\n\n`temporary`在问快乐持续多久，`delight`又出现在第一段末句；回看`can later be sources`与前面的`past-tense condition`，分清持续时长与回顾角度。\n\n`temporary delight`与末句的`delight`看起来能接上，但`temporary`限定的是快乐持续多久。`Senior`实际在区分另一个问题：我们是在养育正在进行时衡量幸福，还是后来回看这段经历时感到幸福。\n\n她先提出`past-tense condition`，再用`can later be sources`解释这种回顾角度。`A`只说快乐短暂，没有保留这一角度；把`later`出现的快乐直接称为`temporary`，还会额外加上“只持续一会儿”的期限。\n\n短暂快乐在现实中当然可能存在，可它并没有说出`Senior`在这里重新界定的幸福，不能用相同的`delight`代替原句的时间关系。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q36-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-A-0\"><blockquote>\n<p>Senior 认为，养育孩子能带来短暂的快乐。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到了 past-tense condition 与 later，判断原文区分的是回看经历的角度；temporary 却限定持续时长，第一轮排除 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了 <code>delight</code> 这个结果，把“当时辛苦、事后感到喜悦”的时间关系，改成快乐只持续一小会儿。原文没有给后来喜悦规定这样的期限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能带来短暂的快乐。</p>\n</blockquote>\n<p><code>temporary</code>在问快乐持续多久，<code>delight</code>又出现在第一段末句；回看<code>can later be sources</code>与前面的<code>past-tense condition</code>，分清持续时长与回顾角度。</p>\n<p><code>temporary delight</code>与末句的<code>delight</code>看起来能接上，但<code>temporary</code>限定的是快乐持续多久。<code>Senior</code>实际在区分另一个问题：我们是在养育正在进行时衡量幸福，还是后来回看这段经历时感到幸福。</p>\n<p>她先提出<code>past-tense condition</code>，再用<code>can later be sources</code>解释这种回顾角度。<code>A</code>只说快乐短暂，没有保留这一角度；把<code>later</code>出现的快乐直接称为<code>temporary</code>，还会额外加上“只持续一会儿”的期限。</p>\n<p>短暂快乐在现实中当然可能存在，可它并没有说出<code>Senior</code>在这里重新界定的幸福，不能用相同的<code>delight</code>代替原句的时间关系。</p>\n</section>"},{"title":"A. temporary delight","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n>\n> Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that \"the very things that in the moment dampen our moods can later be sources of intense gratification and delight.\"\n>\n> 西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：\"那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。\"\n\n`Senior` 先改变幸福的衡量角度，再用当下与后来可能有不同感受来解释。文章并没有继续说这种后来得到的快乐很快就消失。\n\n如果`A`真是作者的意思，文章至少得写成：\n\n> Raising children brings moments of delight that soon disappear.\n>\n> 养育孩子会带来一些快乐时刻，但这些快乐很快就会消失。\n\n`A` 需要短暂之后结束这一时间限制；原文却只交代后来怎样回看过去。`later` 回答何时获得这种感受，`temporary` 回答持续多久，两者不能互换。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"A","cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q36-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-A-0\"><blockquote>\n<p>Senior 认为，养育孩子能带来短暂的快乐。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时看到了 past-tense condition 与 later，判断原文区分的是回看经历的角度；temporary 却限定持续时长，第一轮排除 A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>它借用了 <code>delight</code> 这个结果，把“当时辛苦、事后感到喜悦”的时间关系，改成快乐只持续一小会儿。原文没有给后来喜悦规定这样的期限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-A-1\"><h3>定位比对法</h3>\n<p>先把<code>A</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能带来短暂的快乐。</p>\n</blockquote>\n<p><code>temporary</code>在问快乐持续多久，<code>delight</code>又出现在第一段末句；回看<code>can later be sources</code>与前面的<code>past-tense condition</code>，分清持续时长与回顾角度。</p>\n<p><code>temporary delight</code>与末句的<code>delight</code>看起来能接上，但<code>temporary</code>限定的是快乐持续多久。<code>Senior</code>实际在区分另一个问题：我们是在养育正在进行时衡量幸福，还是后来回看这段经历时感到幸福。</p>\n<p>她先提出<code>past-tense condition</code>，再用<code>can later be sources</code>解释这种回顾角度。<code>A</code>只说快乐短暂，没有保留这一角度；把<code>later</code>出现的快乐直接称为<code>temporary</code>，还会额外加上“只持续一会儿”的期限。</p>\n<p>短暂快乐在现实中当然可能存在，可它并没有说出<code>Senior</code>在这里重新界定的幸福，不能用相同的<code>delight</code>代替原句的时间关系。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n<p>西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：&quot;那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。&quot;</p>\n</blockquote>\n<p><code>Senior</code> 先改变幸福的衡量角度，再用当下与后来可能有不同感受来解释。文章并没有继续说这种后来得到的快乐很快就消失。</p>\n<p>如果<code>A</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Raising children brings moments of delight that soon disappear.</p>\n<p>养育孩子会带来一些快乐时刻，但这些快乐很快就会消失。</p>\n</blockquote>\n<p><code>A</code> 需要短暂之后结束这一时间限制；原文却只交代后来怎样回看过去。<code>later</code> 回答何时获得这种感受，<code>temporary</code> 回答持续多久，两者不能互换。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. enjoyment in progress","raw":"### B. enjoyment in progress\n\n> Senior 认为，养育孩子能带来过程中的享受。\n\n**做题模式中的状态：** 当时将 in progress 与 day-to-day experience、later 对照，发现选项把事后回顾改成当下享受，因此第一轮排除 B。\n\n**错误类型：第一类——歪曲原意。**\n\n原文要求不要只用 `moment-to-moment joy` 衡量育儿，`B` 却把她强调的幸福重新放到正在养育的过程当中，漏掉了时间视角的转化。\n\n**出处：**\n\n> Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n>\n> Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that \"the very things that in the moment dampen our moods can later be sources of intense gratification and delight.\"","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q36-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-B-0\"><blockquote>\n<p>Senior 认为，养育孩子能带来过程中的享受。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时将 in progress 与 day-to-day experience、later 对照，发现选项把事后回顾改成当下享受，因此第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文要求不要只用 <code>moment-to-moment joy</code> 衡量育儿，<code>B</code> 却把她强调的幸福重新放到正在养育的过程当中，漏掉了时间视角的转化。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section>"},{"title":"B. enjoyment in progress","raw":"#### 定位比对法\n\n先把`B`接回题干，整句话就变成：\n\n> Senior 认为，养育孩子能带来过程中的享受。\n\n`in progress`把`enjoyment`放在正在养育时；回看`day-to-day experience`与`can later be sources`同在的末句，再与前句`moment-to-moment joy`的衡量方式相接。\n\n`B`的`in progress`把享受放在养育正在进行的阶段，正好需要核对`day-to-day experience`与`later`。原文承认每天养孩子的经历`can be`…`hard`，随后说当时影响心情的事情后来可能成为`delight`的来源；`Senior`要我们不要只用`moment-to-moment joy`衡量幸福。\n\n这里并不是否认过程中出现过任何快乐，而是说明她所提出的幸福并不取决于过程当下的享受。\n\n`B`若接回题干，就把她强调的后来回看改成正在进行时享受，漏掉了当时艰难与后来感受不同这一层转化。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q36-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-B-0\"><blockquote>\n<p>Senior 认为，养育孩子能带来过程中的享受。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时将 in progress 与 day-to-day experience、later 对照，发现选项把事后回顾改成当下享受，因此第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文要求不要只用 <code>moment-to-moment joy</code> 衡量育儿，<code>B</code> 却把她强调的幸福重新放到正在养育的过程当中，漏掉了时间视角的转化。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能带来过程中的享受。</p>\n</blockquote>\n<p><code>in progress</code>把<code>enjoyment</code>放在正在养育时；回看<code>day-to-day experience</code>与<code>can later be sources</code>同在的末句，再与前句<code>moment-to-moment joy</code>的衡量方式相接。</p>\n<p><code>B</code>的<code>in progress</code>把享受放在养育正在进行的阶段，正好需要核对<code>day-to-day experience</code>与<code>later</code>。原文承认每天养孩子的经历<code>can be</code>…<code>hard</code>，随后说当时影响心情的事情后来可能成为<code>delight</code>的来源；<code>Senior</code>要我们不要只用<code>moment-to-moment joy</code>衡量幸福。</p>\n<p>这里并不是否认过程中出现过任何快乐，而是说明她所提出的幸福并不取决于过程当下的享受。</p>\n<p><code>B</code>若接回题干，就把她强调的后来回看改成正在进行时享受，漏掉了当时艰难与后来感受不同这一层转化。</p>\n</section>"},{"title":"B. enjoyment in progress","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n>\n> Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that \"the very things that in the moment dampen our moods can later be sources of intense gratification and delight.\"\n>\n> 西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：\"那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。\"\n\n文章先承认日常育儿可能很艰难，再说当时打击心情的事情以后可能成为喜悦来源。让步和转化可以同时成立，并不要求过程始终愉快。\n\n如果`B`真是作者的意思，文章至少得写成：\n\n> Senior emphasizes the enjoyment parents feel while they are carrying out the daily work of raising children.\n>\n> Senior 强调的是父母正在进行日常育儿工作时感受到的享受。\n\n`B` 的写法需要把重心放在当下体验，原文却用 `instead of` 将这种衡量方式移开。这里不是断言育儿过程中毫无快乐，而是不能用当下享受替代她提出的回顾性幸福。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"B","cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q36-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-B-0\"><blockquote>\n<p>Senior 认为，养育孩子能带来过程中的享受。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时将 in progress 与 day-to-day experience、later 对照，发现选项把事后回顾改成当下享受，因此第一轮排除 B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文要求不要只用 <code>moment-to-moment joy</code> 衡量育儿，<code>B</code> 却把她强调的幸福重新放到正在养育的过程当中，漏掉了时间视角的转化。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-B-1\"><h3>定位比对法</h3>\n<p>先把<code>B</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能带来过程中的享受。</p>\n</blockquote>\n<p><code>in progress</code>把<code>enjoyment</code>放在正在养育时；回看<code>day-to-day experience</code>与<code>can later be sources</code>同在的末句，再与前句<code>moment-to-moment joy</code>的衡量方式相接。</p>\n<p><code>B</code>的<code>in progress</code>把享受放在养育正在进行的阶段，正好需要核对<code>day-to-day experience</code>与<code>later</code>。原文承认每天养孩子的经历<code>can be</code>…<code>hard</code>，随后说当时影响心情的事情后来可能成为<code>delight</code>的来源；<code>Senior</code>要我们不要只用<code>moment-to-moment joy</code>衡量幸福。</p>\n<p>这里并不是否认过程中出现过任何快乐，而是说明她所提出的幸福并不取决于过程当下的享受。</p>\n<p><code>B</code>若接回题干，就把她强调的后来回看改成正在进行时享受，漏掉了当时艰难与后来感受不同这一层转化。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n<p>西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：&quot;那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。&quot;</p>\n</blockquote>\n<p>文章先承认日常育儿可能很艰难，再说当时打击心情的事情以后可能成为喜悦来源。让步和转化可以同时成立，并不要求过程始终愉快。</p>\n<p>如果<code>B</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Senior emphasizes the enjoyment parents feel while they are carrying out the daily work of raising children.</p>\n<p>Senior 强调的是父母正在进行日常育儿工作时感受到的享受。</p>\n</blockquote>\n<p><code>B</code> 的写法需要把重心放在当下体验，原文却用 <code>instead of</code> 将这种衡量方式移开。这里不是断言育儿过程中毫无快乐，而是不能用当下享受替代她提出的回顾性幸福。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. happiness in retrospect","raw":"### C. happiness in retrospect\n\n> Senior 认为，养育孩子能够带来事后回顾时的幸福。\n\n**做题模式中的状态：** 当时 in retrospect 接上 past-tense condition，又得到 in the moment 与 later 对照的支持。第一轮保留 C，最终选择 C。\n\n**选项类型：跨句概括。**\n\n它把“过去时的幸福状态”和“当时辛苦的事情以后成为喜悦来源”概括成回顾中的幸福，同时允许日常育儿依然很艰难。\n\n**出处：**\n\n> Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n>\n> Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that \"the very things that in the moment dampen our moods can later be sources of intense gratification and delight.\"","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q36-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>Senior 认为，养育孩子能够带来事后回顾时的幸福。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 in retrospect 接上 past-tense condition，又得到 in the moment 与 later 对照的支持。第一轮保留 C，最终选择 C。</p>\n<p><strong>选项类型：跨句概括。</strong></p>\n<p>它把“过去时的幸福状态”和“当时辛苦的事情以后成为喜悦来源”概括成回顾中的幸福，同时允许日常育儿依然很艰难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section>"},{"title":"C. happiness in retrospect","raw":"#### 定位比对法\n\n先把`C`接回题干，整句话就变成：\n\n> Senior 认为，养育孩子能够带来事后回顾时的幸福。\n\n`in retrospect`是在后来回看，能接上`past-tense condition`；继续读末句的`later`，检查作者如何说明同一经历在两个时间点带来不同感受。\n\n`C`的`in retrospect`把感到幸福的视角放在经历之后，与`past-tense condition`相接。原文不是单独说将来会开心，而是先让我们不要只用`moment-to-moment joy`评价养育，接着说明同一件事情在当时和后来可能带来不同感受：当时影响心情，后来却成为`delight`的来源。\n\n`C`保留了这种“后来回看过去经历”的关系，也允许`day-to-day experience`仍然很艰难。\n\n它没有把幸福扩大成养育全程都愉快，也没有承诺后来这种感受会持续多久，正好把`Senior`改变衡量角度的意思说出来。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q36-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>Senior 认为，养育孩子能够带来事后回顾时的幸福。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 in retrospect 接上 past-tense condition，又得到 in the moment 与 later 对照的支持。第一轮保留 C，最终选择 C。</p>\n<p><strong>选项类型：跨句概括。</strong></p>\n<p>它把“过去时的幸福状态”和“当时辛苦的事情以后成为喜悦来源”概括成回顾中的幸福，同时允许日常育儿依然很艰难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能够带来事后回顾时的幸福。</p>\n</blockquote>\n<p><code>in retrospect</code>是在后来回看，能接上<code>past-tense condition</code>；继续读末句的<code>later</code>，检查作者如何说明同一经历在两个时间点带来不同感受。</p>\n<p><code>C</code>的<code>in retrospect</code>把感到幸福的视角放在经历之后，与<code>past-tense condition</code>相接。原文不是单独说将来会开心，而是先让我们不要只用<code>moment-to-moment joy</code>评价养育，接着说明同一件事情在当时和后来可能带来不同感受：当时影响心情，后来却成为<code>delight</code>的来源。</p>\n<p><code>C</code>保留了这种“后来回看过去经历”的关系，也允许<code>day-to-day experience</code>仍然很艰难。</p>\n<p>它没有把幸福扩大成养育全程都愉快，也没有承诺后来这种感受会持续多久，正好把<code>Senior</code>改变衡量角度的意思说出来。</p>\n</section>"},{"title":"C. happiness in retrospect","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n>\n> Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that \"the very things that in the moment dampen our moods can later be sources of intense gratification and delight.\"\n>\n> 西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：\"那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。\"\n\n`Senior` 没有把养育一概判为快乐或痛苦，而是改变观察时点：现在觉得辛苦的同一件事，后来回看时可能得到满足。\n\n如果`C`真是作者的意思，文章至少得写成：\n\n> Experiences that are difficult while raising children may bring happiness when parents look back on them.\n>\n> 养育孩子时觉得艰难的经历，父母日后回想起来可能感到幸福。\n\n`C` 所需的回顾视角能由两句话共同支持：`past-tense condition` 先提出概念，`later` 再解释它。选项没有添加全程快乐或持续终生等额外限制。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"C","cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-q36-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-C-0\"><blockquote>\n<p>Senior 认为，养育孩子能够带来事后回顾时的幸福。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 in retrospect 接上 past-tense condition，又得到 in the moment 与 later 对照的支持。第一轮保留 C，最终选择 C。</p>\n<p><strong>选项类型：跨句概括。</strong></p>\n<p>它把“过去时的幸福状态”和“当时辛苦的事情以后成为喜悦来源”概括成回顾中的幸福，同时允许日常育儿依然很艰难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q36-C-1\"><h3>定位比对法</h3>\n<p>先把<code>C</code>接回题干，整句话就变成：</p>\n<blockquote>\n<p>Senior 认为，养育孩子能够带来事后回顾时的幸福。</p>\n</blockquote>\n<p><code>in retrospect</code>是在后来回看，能接上<code>past-tense condition</code>；继续读末句的<code>later</code>，检查作者如何说明同一经历在两个时间点带来不同感受。</p>\n<p><code>C</code>的<code>in retrospect</code>把感到幸福的视角放在经历之后，与<code>past-tense condition</code>相接。原文不是单独说将来会开心，而是先让我们不要只用<code>moment-to-moment joy</code>评价养育，接着说明同一件事情在当时和后来可能带来不同感受：当时影响心情，后来却成为<code>delight</code>的来源。</p>\n<p><code>C</code>保留了这种“后来回看过去经历”的关系，也允许<code>day-to-day experience</code>仍然很艰难。</p>\n<p>它没有把幸福扩大成养育全程都愉快，也没有承诺后来这种感受会持续多久，正好把<code>Senior</code>改变衡量角度的意思说出来。</p>\n</section><section class=\"revealPart\" id=\"focus-q36-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n<p>西尼尔并未简单地得出孩子让父母要么快乐要么痛苦的结论，而是建议我们需要重新定义幸福：不应把幸福看作可以用每时每刻的快乐来衡量的东西，而应该把它看作一种过去时的状态。尽管养育孩子的日常体验可能令人精疲力竭，但西尼尔写道：&quot;那些在当下削弱我们情绪的事情，之后可能成为强烈满足和喜悦的源泉。&quot;</p>\n</blockquote>\n<p><code>Senior</code> 没有把养育一概判为快乐或痛苦，而是改变观察时点：现在觉得辛苦的同一件事，后来回看时可能得到满足。</p>\n<p>如果<code>C</code>真是作者的意思，文章至少得写成：</p>\n<blockquote>\n<p>Experiences that are difficult while raising children may bring happiness when parents look back on them.</p>\n<p>养育孩子时觉得艰难的经历，父母日后回想起来可能感到幸福。</p>\n</blockquote>\n<p><code>C</code> 所需的回顾视角能由两句话共同支持：<code>past-tense condition</code> 先提出概念，<code>later</code> 再解释它。选项没有添加全程快乐或持续终生等额外限制。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. lasting reward","raw":"### D. lasting reward\n\n> Senior 认为，养育孩子能够带来持久的回报。\n\n**做题模式中的状态：** 当时 reward 被遮挡，但 lasting 可见。做题时已经分清“以后感到幸福”不等于“这种回报长久持续”，所以不需要补出名词也排除了 D。\n\n**错误类型：第三类——无中生有。**\n\n它把后来出现的满足继续延长为 `lasting reward`。原文讨论感受发生的时点和回顾角度，并没有承诺这种回报会持续多长时间。\n\n**命题人借用的原文材料：**\n\n> Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n>\n> Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that \"the very things that in the moment dampen our moods can later be sources of intense gratification and delight.\"","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-q36-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-D-0\"><blockquote>\n<p>Senior 认为，养育孩子能够带来持久的回报。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 reward 被遮挡，但 lasting 可见。做题时已经分清“以后感到幸福”不等于“这种回报长久持续”，所以不需要补出名词也排除了 D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它把后来出现的满足继续延长为 <code>lasting reward</code>。原文讨论感受发生的时点和回顾角度，并没有承诺这种回报会持续多长时间。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n<p>Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and delight.&quot;</p>\n</blockquote>\n</section>"},{"title":"D. lasting reward","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Senior 认为，养育孩子能够带来持久的回报。\n\n`reward`可以表示一件事情带来的满足或回报，原文的`gratification and delight`确实能与这种感受联系起来。D的问题要落到前面的`lasting`，即这份回报能够持久存在。\n\nSenior先说把幸福看成`a past-tense condition`，随后用`in the moment`与`later`解释：同一件事，当时使人心情低落，后来却可能成为满足的来源。这组对照回答的是“什么时候、从什么角度感到幸福”。\n\n`lasting`回答的却是“感受持续多久”。日后回想起来得到满足，不等于文章已经说明这份满足会长久保持。D保留了积极感受，却添上原文没有给出的持续时间；C的`in retrospect`才与Senior重新界定幸福的角度对应。","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"36题","focus":[250,235,1790,500],"sourceW":2256,"sourceH":3142},"meta":{"question":"36","option":"D","cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-q36-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q36-D-0\"><blockquote>\n<p>Senior 认为，养育孩子能够带来持久的回报。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 当时 reward 被遮挡，但 lasting 可见。做题时已经分清“以后感到幸福”不等于“这种回报长久持续”，所以不需要补出名词也排除了 D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>它把后来出现的满足继续延长为 <code>lasting reward</code>。原文讨论感受发生的时点和回顾角度，并没有承诺这种回报会持续多长时间。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be
