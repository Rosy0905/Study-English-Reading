本周报摊上、每周、明星妈妈；在一个社会里、后悔生孩子、唯一最重要的东西、在他们的生活中；当然、极不真实、没有伴侣、轻而易举；结尾还有很难想象、想要孩子、希望得到、使我们看起来。\n\n到这里还不能自然地说清楚：杂志里的母亲形象与真实养育体验怎样联系，不同人为什么会感到幸福或不满。先留下松散印象和大致位置，具体关系等题目问到时再查。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到并不奇怪、杂志封面故事、强烈的、和快乐；中间又出现一个可爱婴儿、本周报摊上、每周、明星妈妈；在一个社会里、后悔生孩子、唯一最重要的东西、在他们的生活中；当然、极不真实、没有伴侣、轻而易举；结尾还有很难想象、想要孩子、希望得到、使我们看起来。</p>\n<p>到这里还不能自然地说清楚：杂志里的母亲形象与真实养育体验怎样联系，不同人为什么会感到幸福或不满。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"36题","raw":"## 36题\n\n> Jennifer Senior suggests in her article that raising a child can bring ______.  \n> Senior认为，养育孩子能带来怎样的感受？\n\nJennifer Senior在第一段。题干问她认为raising a child能带来什么，先完整读她怎样redefine happiness，再分清她谈的时间角度。\n\n> 原文参考：\n> \n> It’s no surprise that Jennifer Senior’s insightful, **[xxx]** magazine cover story, “I Love My Children, I Hate My Life,” is arousing much **[xxx]**—nothing gets people talking like the suggestion that child rearing is anything less than a completely fulfilling, life-enriching experience. Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition. Even though the day-to-day experience of raising kids can be soul-**[xxx]** hard, Senior writes that “the very things that in the moment **[xxx]** our moods can later be sources of intense **[xxx]** and delight. ”\n> \n> 开始精读：\n> \n> It’s no surprise that Jennifer Senior’s insightful, **[xxx]** magazine cover story, “I Love My Children, I Hate My Life,” / is arousing much **[xxx]**— / nothing gets people talking like the suggestion that / child rearing is anything less than a completely fulfilling, life-enriching experience. / Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: / instead of thinking of it as something that can be measured by moment-to-moment joy, / we should consider being happy as a past-tense condition. / Even though the day-to-day experience of raising kids can be soul-**[xxx]** hard, / Senior writes that “the very things that in the moment **[xxx]** our moods / can later be sources of intense **[xxx]** and delight. ”\n> \n> 并不奇怪，Jennifer Senior那篇有见地、**[xxx]**的杂志封面故事《我爱孩子，我讨厌自己的生活》，/ 正引发大量**[xxx]**—— / 没有什么比这样一种说法更能让人议论：/ 养孩子并不完全是令人满足、丰富人生的经历。/ Senior没有断定孩子让父母幸福还是痛苦，而是建议重新定义幸福：/ 不要把幸福看成能用时时刻刻的快乐衡量的东西，/ 应当把幸福视为一种回头看时的状态。/ 尽管每天养孩子的经历可能艰难得令人**[xxx]**，/ Senior写道，恰恰是那些当下使我们心情**[xxx]**的事情，/ 后来可能成为强烈**[xxx]**和快乐的来源。\n\nSenior把当下的日常经历与后来回看的感受区分开。空格要表达她重新界定的幸福，选项里的出现阶段、回顾角度和持续长短需要分别核对。\n\n接下来按A—D逐项看。","articleRects":[[274,317,1123,38],[203,363,1193,39],[202,412,1194,38],[202,459,1194,38],[202,506,1194,38],[202,553,1194,38],[202,600,1194,38],[202,647,1194,38],[202,693,1194,39],[202,740,1006,39]],"questionRects":[[226,190,1040,38],[280,251,306,38],[280,313,368,37],[280,374,378,37],[280,435,254,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"36","initialReadingPids":[0]},"html":"<h2>36题</h2>\n<blockquote><p>Jennifer Senior suggests in her article that raising a child can bring ______.<br />\nSenior认为，养育孩子能带来怎样的感受？</p>\n</blockquote>\n<p>Jennifer Senior在第一段。题干问她认为raising a child能带来什么，先完整读她怎样redefine happiness，再分清她谈的时间角度。</p>\n<blockquote><p>原文参考：</p>\n<p>It’s no surprise that Jennifer Senior’s insightful, <strong>[xxx]</strong> magazine cover story, “I Love My Children, I Hate My Life,” is arousing much <strong>[xxx]</strong>—nothing gets people talking like the suggestion that child rearing is anything less than a completely fulfilling, life-enriching experience. Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition. Even though the day-to-day experience of raising kids can be soul-<strong>[xxx]</strong> hard, Senior writes that “the very things that in the moment <strong>[xxx]</strong> our moods can later be sources of intense <strong>[xxx]</strong> and delight. ”</p>\n<p>开始精读：</p>\n<p>It’s no surprise that Jennifer Senior’s insightful, <strong>[xxx]</strong> magazine cover story, “I Love My Children, I Hate My Life,” / is arousing much <strong>[xxx]</strong>— / nothing gets people talking like the suggestion that / child rearing is anything less than a completely fulfilling, life-enriching experience. / Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: / instead of thinking of it as something that can be measured by moment-to-moment joy, / we should consider being happy as a past-tense condition. / Even though the day-to-day experience of raising kids can be soul-<strong>[xxx]</strong> hard, / Senior writes that “the very things that in the moment <strong>[xxx]</strong> our moods / can later be sources of intense <strong>[xxx]</strong> and delight. ”</p>\n<p>并不奇怪，Jennifer Senior那篇有见地、<strong>[xxx]</strong>的杂志封面故事《我爱孩子，我讨厌自己的生活》，/ 正引发大量<strong>[xxx]</strong>—— / 没有什么比这样一种说法更能让人议论：/ 养孩子并不完全是令人满足、丰富人生的经历。/ Senior没有断定孩子让父母幸福还是痛苦，而是建议重新定义幸福：/ 不要把幸福看成能用时时刻刻的快乐衡量的东西，/ 应当把幸福视为一种回头看时的状态。/ 尽管每天养孩子的经历可能艰难得令人<strong>[xxx]</strong>，/ Senior写道，恰恰是那些当下使我们心情<strong>[xxx]</strong>的事情，/ 后来可能成为强烈<strong>[xxx]</strong>和快乐的来源。</p>\n</blockquote>\n<p>Senior把当下的日常经历与后来回看的感受区分开。空格要表达她重新界定的幸福，选项里的出现阶段、回顾角度和持续长短需要分别核对。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"36题","raw":"### A. temporary delight\n\n> 养孩子带来短暂的快乐。\n\n把A接回题干，它说的是：养孩子带来短暂的快乐。\n\nA中的`delight`就在段末，`temporary`说这份快乐只持续很短的时间。我们把末句的`later`和前面的`past-tense condition`接起来，看Senior到底是在说快乐短，还是说后来回想时才觉得快乐。\n\n> Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n\n> Even though the day-to-day experience of raising kids can be soul-**[xxx]** hard, Senior writes that “the very things that in the moment **[xxx]** our moods can later be sources of intense **[xxx]** and delight.\n\nSenior先让我们把幸福看成`a past-tense condition`，接着说，当时影响心情的事情，后来可能成为快乐的来源。\n\n这里前后比较的是两个时候：正在养孩子时，以及后来回看那段经历时。A的`temporary`却要说明这份快乐持续不了多久。\n\n`later`只能让我们知道快乐在后来出现，没有说出现以后很快就结束。A保留了快乐，却把“后来回看”换成了“短暂”。\n\n**后来回想时感到快乐，就能说明这份快乐只持续一小会儿吗？**\n\n不能。原文没有交代快乐持续多久，A的`temporary`没有接上Senior所说的后来回顾。\n\n**第一轮判断：A排除。**","articleRects":[[274,317,1123,38],[203,363,1193,39],[202,412,1194,38],[202,459,1194,38],[202,506,1194,38],[202,553,1194,38],[202,600,1194,38],[202,647,1194,38],[202,693,1194,39],[202,740,1006,39]],"questionRects":[[280,251,306,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>A. temporary delight</h3>\n<blockquote><p>养孩子带来短暂的快乐。</p>\n</blockquote>\n<p>把A接回题干，它说的是：养孩子带来短暂的快乐。</p>\n<p>A中的<code>delight</code>就在段末，<code>temporary</code>说这份快乐只持续很短的时间。我们把末句的<code>later</code>和前面的<code>past-tense condition</code>接起来，看Senior到底是在说快乐短，还是说后来回想时才觉得快乐。</p>\n<blockquote><p>Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n</blockquote>\n<blockquote><p>Even though the day-to-day experience of raising kids can be soul-<strong>[xxx]</strong> hard, Senior writes that “the very things that in the moment <strong>[xxx]</strong> our moods can later be sources of intense <strong>[xxx]</strong> and delight.</p>\n</blockquote>\n<p>Senior先让我们把幸福看成<code>a past-tense condition</code>，接着说，当时影响心情的事情，后来可能成为快乐的来源。</p>\n<p>这里前后比较的是两个时候：正在养孩子时，以及后来回看那段经历时。A的<code>temporary</code>却要说明这份快乐持续不了多久。</p>\n<p><code>later</code>只能让我们知道快乐在后来出现，没有说出现以后很快就结束。A保留了快乐，却把“后来回看”换成了“短暂”。</p>\n<p><strong>后来回想时感到快乐，就能说明这份快乐只持续一小会儿吗？</strong></p>\n<p>不能。原文没有交代快乐持续多久，A的<code>temporary</code>没有接上Senior所说的后来回顾。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"36题","raw":"### B. enjoyment in progress\n\n> 养孩子在进行过程中令人享受。\n\n把B接回题干，它说的是：养孩子在进行过程中令人享受。\n\nB的`in progress`说事情正在进行时。首段也写了养育每天的`day-to-day experience`，随后却接`can later be sources`。我们看这两处怎样把当时和后来分开。\n\n> Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n\n> Even though the day-to-day experience of raising kids can be soul-**[xxx]** hard, Senior writes that “the very things that in the moment **[xxx]** our moods can later be sources of intense **[xxx]** and delight.\n\n原文说每天养孩子可以很辛苦，后来再回看，当时影响心情的事情却可能带来快乐。前一句的`instead of`也让我们别只拿每一刻的快乐衡量幸福。\n\nB把享受放在养育正在进行的时候。Senior在这里要我们看到的，恰好是当时很艰难，也仍可能在后来觉得幸福。\n\n我们不需要断定养育过程中完全没有快乐；但B只说过程中的享受，没有说到她正在解释的后来回看。\n\n**Senior用当时辛苦、后来幸福来解释养育，B的`in progress`说出了后面这个时候吗？**\n\n没有。它仍把享受放在养育正在进行时。\n\n**第一轮判断：B排除。**","articleRects":[[274,317,1123,38],[203,363,1193,39],[202,412,1194,38],[202,459,1194,38],[202,506,1194,38],[202,553,1194,38],[202,600,1194,38],[202,647,1194,38],[202,693,1194,39],[202,740,1006,39]],"questionRects":[[280,313,368,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>B. enjoyment in progress</h3>\n<blockquote><p>养孩子在进行过程中令人享受。</p>\n</blockquote>\n<p>把B接回题干，它说的是：养孩子在进行过程中令人享受。</p>\n<p>B的<code>in progress</code>说事情正在进行时。首段也写了养育每天的<code>day-to-day experience</code>，随后却接<code>can later be sources</code>。我们看这两处怎样把当时和后来分开。</p>\n<blockquote><p>Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n</blockquote>\n<blockquote><p>Even though the day-to-day experience of raising kids can be soul-<strong>[xxx]</strong> hard, Senior writes that “the very things that in the moment <strong>[xxx]</strong> our moods can later be sources of intense <strong>[xxx]</strong> and delight.</p>\n</blockquote>\n<p>原文说每天养孩子可以很辛苦，后来再回看，当时影响心情的事情却可能带来快乐。前一句的<code>instead of</code>也让我们别只拿每一刻的快乐衡量幸福。</p>\n<p>B把享受放在养育正在进行的时候。Senior在这里要我们看到的，恰好是当时很艰难，也仍可能在后来觉得幸福。</p>\n<p>我们不需要断定养育过程中完全没有快乐；但B只说过程中的享受，没有说到她正在解释的后来回看。</p>\n<p><strong>Senior用当时辛苦、后来幸福来解释养育，B的<code>in progress</code>说出了后面这个时候吗？</strong></p>\n<p>没有。它仍把享受放在养育正在进行时。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"36题","raw":"### C. happiness in retrospect\n\n> 回顾养育经历时会感到幸福。\n\n把C接回题干，它说的是：回顾养育经历时会感到幸福。\n\nC的`in retrospect`是回顾过去。首段先说`past-tense condition`，末句又说`later`，我们把这两处一起看，确认回顾的是什么经历。\n\n> Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n\n> Even though the day-to-day experience of raising kids can be soul-**[xxx]** hard, Senior writes that “the very things that in the moment **[xxx]** our moods can later be sources of intense **[xxx]** and delight.\n\n`past-tense condition`先把幸福放在对过去的回看中。末句再举出同一件事在两个时候的不同感受：养孩子的当时可以很辛苦，当时影响心情的事情，后来却可能成为快乐的来源。\n\n所以，Senior没有要求我们把每天养孩子都说成轻松愉快。她是在说，过后再看这段经历，人可以感到幸福。\n\nC的`happiness`接住了这种幸福，`in retrospect`又把它放在后来回顾的时候，两部分都能接上。\n\n**当时养孩子很辛苦，后来回顾却觉得幸福，这能和C的`happiness in retrospect`接上吗？**\n\n能。C说的正是回顾这段经历时的幸福。\n\n**第一轮判断：C保留。**","articleRects":[[274,317,1123,38],[203,363,1193,39],[202,412,1194,38],[202,459,1194,38],[202,506,1194,38],[202,553,1194,38],[202,600,1194,38],[202,647,1194,38],[202,693,1194,39],[202,740,1006,39]],"questionRects":[[280,374,378,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"36","paragraphPids":[0]},"html":"<h3>C. happiness in retrospect</h3>\n<blockquote><p>回顾养育经历时会感到幸福。</p>\n</blockquote>\n<p>把C接回题干，它说的是：回顾养育经历时会感到幸福。</p>\n<p>C的<code>in retrospect</code>是回顾过去。首段先说<code>past-tense condition</code>，末句又说<code>later</code>，我们把这两处一起看，确认回顾的是什么经历。</p>\n<blockquote><p>Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n</blockquote>\n<blockquote><p>Even though the day-to-day experience of raising kids can be soul-<strong>[xxx]</strong> hard, Senior writes that “the very things that in the moment <strong>[xxx]</strong> our moods can later be sources of intense <strong>[xxx]</strong> and delight.</p>\n</blockquote>\n<p><code>past-tense condition</code>先把幸福放在对过去的回看中。末句再举出同一件事在两个时候的不同感受：养孩子的当时可以很辛苦，当时影响心情的事情，后来却可能成为快乐的来源。</p>\n<p>所以，Senior没有要求我们把每天养孩子都说成轻松愉快。她是在说，过后再看这段经历，人可以感到幸福。</p>\n<p>C的<code>happiness</code>接住了这种幸福，<code>in retrospect</code>又把它放在后来回顾的时候，两部分都能接上。</p>\n<p><strong>当时养孩子很辛苦，后来回顾却觉得幸福，这能和C的<code>happiness in retrospect</code>接上吗？</strong></p>\n<p>能。C说的正是回顾这段经历时的幸福。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"36题","raw":"### D. lasting **[xxx]**\n\n> 养孩子能带来持久的**[xxx]**。\n\n把D接回题干，它说的是：养孩子能带来持久的**[xxx]**。\n\nD里认识的`lasting`是持久，后面的名词还不认识。原文相近的时间词是`past-tense`和`later`，我们看它们有没有说某种感受会持续很久。\n\n> Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.\n\n> Even though the day-to-day experience of raising kids can be soul-**[xxx]** hard, Senior writes that “the very things that in the moment **[xxx]** our moods can later be sources of intense **[xxx]** and delight.\n\nSenior说当时的事情`can later be sources`，也就是后来可能成为某种感受和快乐的来源。前面的`past-tense condition`也在说怎样回看经历。\n\n这两处都没有交代后来的感受能保持多久。D虽然还剩一个名词读不清，但`lasting`已经要求它持续很长时间。\n\n所以，即使先不管后面的名词，原文“后来有这种感受”和D“这种感受很持久”之间仍缺少持续多久的信息。\n\n**原文的`later`说后来出现，能直接读成D的`lasting`、持续很久吗？**\n\n不能。后来出现不等于持续很久，D加上了原文没有给出的时长。\n\n**第一轮判断：D排除。**","articleRects":[[274,317,1123,38],[203,363,1193,39],[202,412,1194,38],[202,459,1194,38],[202,506,1194,38],[202,553,1194,38],[202,600,1194,38],[202,647,1194,38],[202,693,1194,39],[202,740,1006,39]],"questionRects":[[280,435,254,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>D. lasting <strong>[xxx]</strong></h3>\n<blockquote><p>养孩子能带来持久的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把D接回题干，它说的是：养孩子能带来持久的<strong>[xxx]</strong>。</p>\n<p>D里认识的<code>lasting</code>是持久，后面的名词还不认识。原文相近的时间词是<code>past-tense</code>和<code>later</code>，我们看它们有没有说某种感受会持续很久。</p>\n<blockquote><p>Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.</p>\n</blockquote>\n<blockquote><p>Even though the day-to-day experience of raising kids can be soul-<strong>[xxx]</strong> hard, Senior writes that “the very things that in the moment <strong>[xxx]</strong> our moods can later be sources of intense <strong>[xxx]</strong> and delight.</p>\n</blockquote>\n<p>Senior说当时的事情<code>can later be sources</code>，也就是后来可能成为某种感受和快乐的来源。前面的<code>past-tense condition</code>也在说怎样回看经历。</p>\n<p>这两处都没有交代后来的感受能保持多久。D虽然还剩一个名词读不清，但<code>lasting</code>已经要求它持续很长时间。</p>\n<p>所以，即使先不管后面的名词，原文“后来有这种感受”和D“这种感受很持久”之间仍缺少持续多久的信息。</p>\n<p><strong>原文的<code>later</code>说后来出现，能直接读成D的<code>lasting</code>、持续很久吗？</strong></p>\n<p>不能。后来出现不等于持续很久，D加上了原文没有给出的时长。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"36题","raw":"### 36题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n目前保留C。past-tense condition给出回顾角度，later把感受转变的时间说清楚，保留C。","articleRects":[],"questionRects":[[226,190,1040,38],[280,251,306,38],[280,313,368,37],[280,374,378,37],[280,435,254,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"36"},"html":"<h3>36题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>目前保留C。past-tense condition给出回顾角度，later把感受转变的时间说清楚，保留C。</p>\n"},{"section":"37题","raw":"## 37题\n\n> We learn from Paragraph 2 that ______.  \n> 从第二段能看出什么？\n\n题干明确要求从Paragraph 2推断。先把母子封面、Sandra的新闻、怀孕消息和段末每周出现的描述连在一起读，再看各项概括了什么。\n\n> 原文参考：\n> \n> The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week. There are also stories about newly **[xxx]**—and newly single—mom Sandra Bullock, as well as the usual “Jennifer Aniston is pregnant” news. Practically every week **[xxx]** at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n> \n> 开始精读：\n> \n> The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week. / There are also stories about newly **[xxx]**—and newly single—mom Sandra Bullock, / as well as the usual “Jennifer Aniston is pregnant” news. / Practically every week **[xxx]** at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n> \n> 封面上一位迷人的母亲抱着可爱的婴儿，这远不是本周报摊上唯一的圣母子形象。/ 还有刚成为**[xxx]**母亲、又刚成为单身妈妈的Sandra Bullock的故事，/ 以及常见的“Jennifer Aniston怀孕了”的新闻。/ 实际上，每周至少**[xxx]**一位明星妈妈或准妈妈，在报摊上的封面微笑。\n\n第二段同时给出报道频率和画面内容。空格要填这些具体描写能够带出的意思；持续报道、人物形象、公众感受和应当怎样分配关注，分别需要核对。\n\n接下来按A—D逐项看。","articleRects":[[273,789,1123,37],[202,836,1194,37],[203,883,1193,38],[202,928,1195,40],[202,977,1167,38]],"questionRects":[[226,557,522,38],[280,618,777,38],[280,679,801,38],[280,741,721,37],[280,802,722,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"37","initialReadingPids":[1]},"html":"<h2>37题</h2>\n<blockquote><p>We learn from Paragraph 2 that ______.<br />\n从第二段能看出什么？</p>\n</blockquote>\n<p>题干明确要求从Paragraph 2推断。先把母子封面、Sandra的新闻、怀孕消息和段末每周出现的描述连在一起读，再看各项概括了什么。</p>\n<blockquote><p>原文参考：</p>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week. There are also stories about newly <strong>[xxx]</strong>—and newly single—mom Sandra Bullock, as well as the usual “Jennifer Aniston is pregnant” news. Practically every week <strong>[xxx]</strong> at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>开始精读：</p>\n<p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week. / There are also stories about newly <strong>[xxx]</strong>—and newly single—mom Sandra Bullock, / as well as the usual “Jennifer Aniston is pregnant” news. / Practically every week <strong>[xxx]</strong> at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n<p>封面上一位迷人的母亲抱着可爱的婴儿，这远不是本周报摊上唯一的圣母子形象。/ 还有刚成为<strong>[xxx]</strong>母亲、又刚成为单身妈妈的Sandra Bullock的故事，/ 以及常见的“Jennifer Aniston怀孕了”的新闻。/ 实际上，每周至少<strong>[xxx]</strong>一位明星妈妈或准妈妈，在报摊上的封面微笑。</p>\n</blockquote>\n<p>第二段同时给出报道频率和画面内容。空格要填这些具体描写能够带出的意思；持续报道、人物形象、公众感受和应当怎样分配关注，分别需要核对。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"37题","raw":"### A. celebrity moms are a permanent source for gossip\n\n> 明星妈妈是八卦的固定来源。\n\n把A接回题干，它说的是：明星妈妈是八卦的固定来源。\n\nA说明星妈妈能不断提供`gossip`话题。第2段既有单身妈妈的新闻，又有惯常的怀孕消息，最后还写`Practically every week`。我们把这些私人生活消息和出现频率一起看。\n\n> There are also stories about newly **[xxx]**—and newly single—mom Sandra Bullock, as well as the usual “Jennifer Aniston is pregnant” news.\n\n> Practically every week **[xxx]** at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n\nSandra的新闻涉及当妈妈和单身，Jennifer Aniston的新闻涉及怀孕。这些确实都是明星的私人生活。\n\n`the usual ... news`说明怀孕消息经常出现，段末又说几乎每周都有至少一位明星妈妈或准妈妈出现在报摊上。A说她们持续给八卦报道提供话题，这一层能接上这些例子。\n\n不过，这段还特意把母亲写得迷人、婴儿写得可爱，最后的人物又在微笑。先把A留下，再看这些描写是不是还想让我们知道其他事情。\n\n**明星私人生活的消息惯常出现、几乎每周都有，能否支持A所说的持续话题来源？**\n\n能。单看报道的内容和频率，A有可以接上的地方，先保留。\n\n**第一轮判断：A保留。**","articleRects":[[273,789,1123,37],[202,836,1194,37],[203,883,1193,38],[202,928,1195,40],[202,977,1167,38]],"questionRects":[[280,618,777,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"37","paragraphPids":[1]},"html":"<h3>A. celebrity moms are a permanent source for gossip</h3>\n<blockquote><p>明星妈妈是八卦的固定来源。</p>\n</blockquote>\n<p>把A接回题干，它说的是：明星妈妈是八卦的固定来源。</p>\n<p>A说明星妈妈能不断提供<code>gossip</code>话题。第2段既有单身妈妈的新闻，又有惯常的怀孕消息，最后还写<code>Practically every week</code>。我们把这些私人生活消息和出现频率一起看。</p>\n<blockquote><p>There are also stories about newly <strong>[xxx]</strong>—and newly single—mom Sandra Bullock, as well as the usual “Jennifer Aniston is pregnant” news.</p>\n</blockquote>\n<blockquote><p>Practically every week <strong>[xxx]</strong> at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n<p>Sandra的新闻涉及当妈妈和单身，Jennifer Aniston的新闻涉及怀孕。这些确实都是明星的私人生活。</p>\n<p><code>the usual ... news</code>说明怀孕消息经常出现，段末又说几乎每周都有至少一位明星妈妈或准妈妈出现在报摊上。A说她们持续给八卦报道提供话题，这一层能接上这些例子。</p>\n<p>不过，这段还特意把母亲写得迷人、婴儿写得可爱，最后的人物又在微笑。先把A留下，再看这些描写是不是还想让我们知道其他事情。</p>\n<p><strong>明星私人生活的消息惯常出现、几乎每周都有，能否支持A所说的持续话题来源？</strong></p>\n<p>能。单看报道的内容和频率，A有可以接上的地方，先保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"37题","raw":"### B. single mothers with babies deserve greater attention\n\n> 带着婴儿的单身母亲应当得到更多关注。\n\n把B接回题干，它说的是：带着婴儿的单身母亲应当得到更多关注。\n\nB中的`single mothers`能找到`newly single ... mom Sandra Bullock`。但B还说`deserve greater attention`，应得到更多关注。我们看提到Sandra的这句话，作者有没有把单身母亲和其他人比谁更值得关注。\n\n> There are also stories about newly **[xxx]**—and newly single—mom Sandra Bullock, as well as the usual “Jennifer Aniston is pregnant” news.\n\n> Practically every week **[xxx]** at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n\n原文把Sandra的消息和Jennifer Aniston的怀孕新闻并列，随后把它们归到每周出现的明星妈妈或准妈妈中。它说明的是报摊上已经有什么新闻。\n\nB说的`deserve`却是在提出应该怎样，`greater`还说关注应该更多。看到一位单身母亲受到报道，只能知道她被报道了，不能知道作者认为这类人应比别人得到更多关注。\n\n这两句没有提出这种建议，也没有比较单身母亲和其他母亲谁更值得关注。\n\n**Sandra是报道中的一个例子，就能说明单身母亲应比别人得到更多关注吗？**\n\n不能。原文列出已有报道，没有提出给单身母亲更多关注的建议。\n\n**第一轮判断：B排除。**","articleRects":[[273,789,1123,37],[202,836,1194,37],[203,883,1193,38],[202,928,1195,40],[202,977,1167,38]],"questionRects":[[280,679,801,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"37","paragraphPids":[1]},"html":"<h3>B. single mothers with babies deserve greater attention</h3>\n<blockquote><p>带着婴儿的单身母亲应当得到更多关注。</p>\n</blockquote>\n<p>把B接回题干，它说的是：带着婴儿的单身母亲应当得到更多关注。</p>\n<p>B中的<code>single mothers</code>能找到<code>newly single ... mom Sandra Bullock</code>。但B还说<code>deserve greater attention</code>，应得到更多关注。我们看提到Sandra的这句话，作者有没有把单身母亲和其他人比谁更值得关注。</p>\n<blockquote><p>There are also stories about newly <strong>[xxx]</strong>—and newly single—mom Sandra Bullock, as well as the usual “Jennifer Aniston is pregnant” news.</p>\n</blockquote>\n<blockquote><p>Practically every week <strong>[xxx]</strong> at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n<p>原文把Sandra的消息和Jennifer Aniston的怀孕新闻并列，随后把它们归到每周出现的明星妈妈或准妈妈中。它说明的是报摊上已经有什么新闻。</p>\n<p>B说的<code>deserve</code>却是在提出应该怎样，<code>greater</code>还说关注应该更多。看到一位单身母亲受到报道，只能知道她被报道了，不能知道作者认为这类人应比别人得到更多关注。</p>\n<p>这两句没有提出这种建议，也没有比较单身母亲和其他母亲谁更值得关注。</p>\n<p><strong>Sandra是报道中的一个例子，就能说明单身母亲应比别人得到更多关注吗？</strong></p>\n<p>不能。原文列出已有报道，没有提出给单身母亲更多关注的建议。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"37题","raw":"### C. news about pregnant celebrities is entertaining\n\n> 关于明星怀孕的消息很有娱乐性。\n\n把C接回题干，它说的是：关于明星怀孕的消息很有娱乐性。\n\nC的`pregnant celebrities`可以接上Jennifer Aniston的怀孕新闻。它还说新闻`entertaining`，让人觉得有趣。我们看看原文形容的是消息出现得多，还是读者看后觉得有趣。\n\n> as well as the usual “Jennifer Aniston is pregnant” news.\n\n> Practically every week **[xxx]** at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n\n`usual`说怀孕消息很常见，`Practically every week`又说几乎每周都有。这两处告诉我们消息出现的频率，没有告诉我们读者读起来有什么感受。\n\n段末的`smiling`也不能补上这一点。微笑的是出现在报摊上的明星妈妈或准妈妈，不是看新闻的人。\n\nC把新闻里的人在微笑，读成了新闻让读者获得娱乐；原文没有写后面这件事。\n\n**封面里的明星母亲在微笑，是否就说明读者觉得怀孕新闻很有趣？**\n\n不是。原文写了人物的表情，没有写读者的阅读感受。\n\n**第一轮判断：C排除。**","articleRects":[[273,789,1123,37],[202,836,1194,37],[203,883,1193,38],[202,928,1195,40],[202,977,1167,38]],"questionRects":[[280,741,721,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"37","paragraphPids":[1]},"html":"<h3>C. news about pregnant celebrities is entertaining</h3>\n<blockquote><p>关于明星怀孕的消息很有娱乐性。</p>\n</blockquote>\n<p>把C接回题干，它说的是：关于明星怀孕的消息很有娱乐性。</p>\n<p>C的<code>pregnant celebrities</code>可以接上Jennifer Aniston的怀孕新闻。它还说新闻<code>entertaining</code>，让人觉得有趣。我们看看原文形容的是消息出现得多，还是读者看后觉得有趣。</p>\n<blockquote><p>as well as the usual “Jennifer Aniston is pregnant” news.</p>\n</blockquote>\n<blockquote><p>Practically every week <strong>[xxx]</strong> at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n<p><code>usual</code>说怀孕消息很常见，<code>Practically every week</code>又说几乎每周都有。这两处告诉我们消息出现的频率，没有告诉我们读者读起来有什么感受。</p>\n<p>段末的<code>smiling</code>也不能补上这一点。微笑的是出现在报摊上的明星妈妈或准妈妈，不是看新闻的人。</p>\n<p>C把新闻里的人在微笑，读成了新闻让读者获得娱乐；原文没有写后面这件事。</p>\n<p><strong>封面里的明星母亲在微笑，是否就说明读者觉得怀孕新闻很有趣？</strong></p>\n<p>不是。原文写了人物的表情，没有写读者的阅读感受。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"37题","raw":"### D. having children is highly valued by the public\n\n> 公众高度重视生儿育女。\n\n把D接回题干，它说的是：公众高度重视生儿育女。\n\nD说生儿育女受到高度重视。第2段的`attractive mother`、`cute baby`和`smiling`都把母子写得很美好，再看这种画面是不是只出现了一次。\n\n> The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.\n\n> Practically every week **[xxx]** at least one celebrity mom, or mom-to-be, smiling on the newsstands.\n\n段首先说，迷人的母亲抱着可爱的婴儿，这还不是本周唯一一幅母子图像。后面又列出明星当妈妈、怀孕的消息，最后说几乎每周都有明星母亲或准母亲微笑着出现在报摊上。\n\n这里反复出现的不只是明星的名字，还有她们当妈妈或快当妈妈的身份，而且配上的是迷人、可爱、微笑这些样子。\n\n因此，D说生育受到重视，可以从这些反复出现的美好母子形象去理解。只是从杂志封面走到公众怎样评价生育，还要接着看后文怎样说社会里的普通人，先保留D。\n\n**母子形象被描写得美好，又一周周反复出现，能否让我们往“生育受到重视”这个方向理解？**\n\n能。母亲和生育身份被持续、正面地展示，D先保留。\n\n**第一轮判断：D保留。**","articleRects":[[273,789,1123,37],[202,836,1194,37],[203,883,1193,38],[202,928,1195,40],[202,977,1167,38]],"questionRects":[[280,802,722,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"37","paragraphPids":[1]},"html":"<h3>D. having children is highly valued by the public</h3>\n<blockquote><p>公众高度重视生儿育女。</p>\n</blockquote>\n<p>把D接回题干，它说的是：公众高度重视生儿育女。</p>\n<p>D说生儿育女受到高度重视。第2段的<code>attractive mother</code>、<code>cute baby</code>和<code>smiling</code>都把母子写得很美好，再看这种画面是不是只出现了一次。</p>\n<blockquote><p>The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.</p>\n</blockquote>\n<blockquote><p>Practically every week <strong>[xxx]</strong> at least one celebrity mom, or mom-to-be, smiling on the newsstands.</p>\n</blockquote>\n<p>段首先说，迷人的母亲抱着可爱的婴儿，这还不是本周唯一一幅母子图像。后面又列出明星当妈妈、怀孕的消息，最后说几乎每周都有明星母亲或准母亲微笑着出现在报摊上。</p>\n<p>这里反复出现的不只是明星的名字，还有她们当妈妈或快当妈妈的身份，而且配上的是迷人、可爱、微笑这些样子。</p>\n<p>因此，D说生育受到重视，可以从这些反复出现的美好母子形象去理解。只是从杂志封面走到公众怎样评价生育，还要接着看后文怎样说社会里的普通人，先保留D。</p>\n<p><strong>母子形象被描写得美好，又一周周反复出现，能否让我们往“生育受到重视”这个方向理解？</strong></p>\n<p>能。母亲和生育身份被持续、正面地展示，D先保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"37题","raw":"### 37题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D保留。\n\n暂时保留：A、D。\n\n第一次留下A、D。A接住明星生育新闻几乎每周出现这一现象，D接住母子形象被持续美化这一意味。两项的区别是：这一段主要让我们看到媒体不断有明星话题，还是让我们看出生育在公众价值判断中的地位？目前封面事实同时容得下这两层理解，暂不把其中一层直接压掉。","articleRects":[],"questionRects":[[226,557,522,38],[280,618,777,38],[280,679,801,38],[280,741,721,37],[280,802,722,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"37"},"html":"<h3>37题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>暂时保留：A、D。</p>\n<p>第一次留下A、D。A接住明星生育新闻几乎每周出现这一现象，D接住母子形象被持续美化这一意味。两项的区别是：这一段主要让我们看到媒体不断有明星话题，还是让我们看出生育在公众价值判断中的地位？目前封面事实同时容得下这两层理解，暂不把其中一层直接压掉。</p>\n"},{"section":"38题","raw":"## 38题\n\n> It is suggested in Paragraph 3 that childless folks ______.  \n> 第三段暗示，没有孩子的人处于怎样的处境？\n\n题干限定Paragraph 3，childless folks又出现在段末。先读完整段，再把unhappy parents与unhappy childless folks受到的对待并排。\n\n> 原文参考：\n> \n> In a society that so persistently celebrates **[xxx]**, is it any wonder that admitting you regret having children is **[xxx]** to admitting you support kitten-killing? It doesn’t seem quite fair, then, to compare the regrets of parents to the regrets of the childless. Unhappy parents rarely are **[xxx]** to wonder if they shouldn’t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the **[xxx]** baby-size holes in their lives.\n> \n> 开始精读：\n> \n> In a society that so persistently celebrates **[xxx]**, / is it any wonder that admitting you regret having children is **[xxx]** to admitting you support kitten-killing? / It doesn’t seem quite fair, then, to compare the regrets of parents to the regrets of the childless. / Unhappy parents rarely are **[xxx]** to wonder if they shouldn’t have had kids, / but unhappy childless folks are bothered with the message that children are the single most important thing in the world: / obviously their misery must be a direct result of the **[xxx]** baby-size holes in their lives.\n> \n> 在一个如此持续赞美**[xxx]**的社会中，/ 承认后悔生孩子与承认支持杀小猫是**[xxx]**的，这有什么奇怪？/ 那么，把父母的后悔和没有孩子者的后悔比较，似乎并不公平。/ 不幸福的父母很少被**[xxx]**去想自己当初是否不该生孩子，/ 但不幸福、没有孩子的人却被这样的信息困扰：孩子是世上最重要的东西；/ 显然，他们的痛苦一定直接来自生活中那个**[xxx]**的、婴儿大小的空洞。\n\n同样已经不幸福，父母与无子女者面对的评价却不相同。要区分作者描写他们受到什么对待，与作者亲自认定他们是什么样的人。\n\n接下来按A—D逐项看。","articleRects":[[274,1024,1122,38],[203,1071,1193,38],[202,1118,1194,38],[202,1165,1194,38],[203,1212,1193,38],[202,1260,1194,37],[202,1307,1163,38]],"questionRects":[[226,924,775,38],[280,985,555,38],[280,1046,525,38],[280,1107,626,38],[280,1168,680,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"38","initialReadingPids":[2]},"html":"<h2>38题</h2>\n<blockquote><p>It is suggested in Paragraph 3 that childless folks ______.<br />\n第三段暗示，没有孩子的人处于怎样的处境？</p>\n</blockquote>\n<p>题干限定Paragraph 3，childless folks又出现在段末。先读完整段，再把unhappy parents与unhappy childless folks受到的对待并排。</p>\n<blockquote><p>原文参考：</p>\n<p>In a society that so persistently celebrates <strong>[xxx]</strong>, is it any wonder that admitting you regret having children is <strong>[xxx]</strong> to admitting you support kitten-killing? It doesn’t seem quite fair, then, to compare the regrets of parents to the regrets of the childless. Unhappy parents rarely are <strong>[xxx]</strong> to wonder if they shouldn’t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the <strong>[xxx]</strong> baby-size holes in their lives.</p>\n<p>开始精读：</p>\n<p>In a society that so persistently celebrates <strong>[xxx]</strong>, / is it any wonder that admitting you regret having children is <strong>[xxx]</strong> to admitting you support kitten-killing? / It doesn’t seem quite fair, then, to compare the regrets of parents to the regrets of the childless. / Unhappy parents rarely are <strong>[xxx]</strong> to wonder if they shouldn’t have had kids, / but unhappy childless folks are bothered with the message that children are the single most important thing in the world: / obviously their misery must be a direct result of the <strong>[xxx]</strong> baby-size holes in their lives.</p>\n<p>在一个如此持续赞美<strong>[xxx]</strong>的社会中，/ 承认后悔生孩子与承认支持杀小猫是<strong>[xxx]</strong>的，这有什么奇怪？/ 那么，把父母的后悔和没有孩子者的后悔比较，似乎并不公平。/ 不幸福的父母很少被<strong>[xxx]</strong>去想自己当初是否不该生孩子，/ 但不幸福、没有孩子的人却被这样的信息困扰：孩子是世上最重要的东西；/ 显然，他们的痛苦一定直接来自生活中那个<strong>[xxx]</strong>的、婴儿大小的空洞。</p>\n</blockquote>\n<p>同样已经不幸福，父母与无子女者面对的评价却不相同。要区分作者描写他们受到什么对待，与作者亲自认定他们是什么样的人。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"38题","raw":"### A. are constantly exposed to criticism\n\n> 没有孩子的人不断面对指责。\n\n把A接回题干，它说的是：没有孩子的人不断面对指责。\n\nA的`criticism`说没有孩子的人受到否定。第3段的`are bothered with the message`就在讲他们被什么话打扰，我们把这条消息读完，再和前面的`Unhappy parents`比较。\n\n> In a society that so persistently celebrates **[xxx]**\n\n> Unhappy parents rarely are **[xxx]** to wonder if they shouldn’t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the **[xxx]** baby-size holes in their lives.\n\n前面一组是已经不快乐的父母，他们很少被追问当初是不是不该要孩子。后面一组是已经不快乐的无子女者，他们却被告知孩子是世界上最重要的事，自己的痛苦必定是因为生活里没有孩子。\n\n也就是说，同样不快乐，有孩子的人很少被用来证明生育是错的，没有孩子的人却被用来证明他们缺少孩子。这些话就在否定他们目前没有孩子的生活。\n\n段首的`persistently`还说这种社会风气一直存在，A的`constantly`能接上这种反复承受的压力。\n\n**无子女者已经不快乐，却不断被告知痛苦是因为没有孩子，这是否是在否定他们未生育的生活？**\n\n是。这种评价把没有孩子说成他们生活里的问题，A保留。\n\n**第一轮判断：A保留。**","articleRects":[[274,1024,1122,38],[203,1071,1193,38],[202,1118,1194,38],[202,1165,1194,38],[203,1212,1193,38],[202,1260,1194,37],[202,1307,1163,38]],"questionRects":[[280,985,555,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"38","paragraphPids":[2]},"html":"<h3>A. are constantly exposed to criticism</h3>\n<blockquote><p>没有孩子的人不断面对指责。</p>\n</blockquote>\n<p>把A接回题干，它说的是：没有孩子的人不断面对指责。</p>\n<p>A的<code>criticism</code>说没有孩子的人受到否定。第3段的<code>are bothered with the message</code>就在讲他们被什么话打扰，我们把这条消息读完，再和前面的<code>Unhappy parents</code>比较。</p>\n<blockquote><p>In a society that so persistently celebrates <strong>[xxx]</strong></p>\n</blockquote>\n<blockquote><p>Unhappy parents rarely are <strong>[xxx]</strong> to wonder if they shouldn’t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the <strong>[xxx]</strong> baby-size holes in their lives.</p>\n</blockquote>\n<p>前面一组是已经不快乐的父母，他们很少被追问当初是不是不该要孩子。后面一组是已经不快乐的无子女者，他们却被告知孩子是世界上最重要的事，自己的痛苦必定是因为生活里没有孩子。</p>\n<p>也就是说，同样不快乐，有孩子的人很少被用来证明生育是错的，没有孩子的人却被用来证明他们缺少孩子。这些话就在否定他们目前没有孩子的生活。</p>\n<p>段首的<code>persistently</code>还说这种社会风气一直存在，A的<code>constantly</code>能接上这种反复承受的压力。</p>\n<p><strong>无子女者已经不快乐，却不断被告知痛苦是因为没有孩子，这是否是在否定他们未生育的生活？</strong></p>\n<p>是。这种评价把没有孩子说成他们生活里的问题，A保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"38题","raw":"### B. are largely ignored by the **[xxx]**\n\n> 没有孩子的人大体被**[xxx]**忽略。\n\n把B接回题干，它说的是：没有孩子的人大体被**[xxx]**忽略。\n\nB说`ignored`，即被忽略。第3段描写无子女者时用的却是`are bothered with the message`。我们看这句话是在说没人理会他们，还是有人反复拿生育来评价他们。\n\n> Unhappy parents rarely are **[xxx]** to wonder if they shouldn’t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the **[xxx]** baby-size holes in their lives.\n\n原文先说孩子是最重要的事，这种话一直传到无子女者那里。接着，他们自己的不快乐也被解释成缺少孩子造成的。\n\n所以，这段把他们写成不断被评价的人：别人不仅告诉他们什么最重要，还替他们解释为什么不快乐。B的`ignored`却把处境说成没有受到理会。\n\nB后面谁在忽略他们还读不清，但用“被忽略”来概括这一段，会漏掉句中明确写出的这些打扰和评价。\n\n**不断有人告诉他们没孩子才不快乐，这段主要写的是他们被忽略吗？**\n\n不是。原文写的是他们受到怎样的否定评价，B的`ignored`没有接上。\n\n**第一轮判断：B排除。**","articleRects":[[274,1024,1122,38],[203,1071,1193,38],[202,1118,1194,38],[202,1165,1194,38],[203,1212,1193,38],[202,1260,1194,37],[202,1307,1163,38]],"questionRects":[[280,1046,525,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"38","paragraphPids":[2]},"html":"<h3>B. are largely ignored by the <strong>[xxx]</strong></h3>\n<blockquote><p>没有孩子的人大体被<strong>[xxx]</strong>忽略。</p>\n</blockquote>\n<p>把B接回题干，它说的是：没有孩子的人大体被<strong>[xxx]</strong>忽略。</p>\n<p>B说<code>ignored</code>，即被忽略。第3段描写无子女者时用的却是<code>are bothered with the message</code>。我们看这句话是在说没人理会他们，还是有人反复拿生育来评价他们。</p>\n<blockquote><p>Unhappy parents rarely are <strong>[xxx]</strong> to wonder if they shouldn’t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the <strong>[xxx]</strong> baby-size holes in their lives.</p>\n</blockquote>\n<p>原文先说孩子是最重要的事，这种话一直传到无子女者那里。接着，他们自己的不快乐也被解释成缺少孩子造成的。</p>\n<p>所以，这段把他们写成不断被评价的人：别人不仅告诉他们什么最重要，还替他们解释为什么不快乐。B的<code>ignored</code>却把处境说成没有受到理会。</p>\n<p>B后面谁在忽略他们还读不清，但用“被忽略”来概括这一段，会漏掉句中明确写出的这些打扰和评价。</p>\n<p><strong>不断有人告诉他们没孩子才不快乐，这段主要写的是他们被忽略吗？</strong></p>\n<p>不是。原文写的是他们受到怎样的否定评价，B的<code>ignored</code>没有接上。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"38题","raw":"### C. fail to fulfill their social responsibilities\n\n> 没有孩子的人没有履行社会责任。\n\n把C接回题干，它说的是：没有孩子的人没有履行社会责任。\n\nC说他们没有尽到`social responsibilities`，是在认定他们做错了。我们先看作者自己的`doesn’t seem quite fair`，再看后面哪些话是他们被迫听到的`message`。\n\n> It doesn’t seem quite fair, then, to compare the regrets of parents to the regrets of the childless.\n\n> but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the **[xxx]** baby-size holes in their lives.\n\n作者先说，这样比较父母与无子女者的后悔不太公平。随后才介绍无子女者听到的话：孩子最重要，没有孩子就是他们痛苦的原因。\n\n后面这些责备是作者拿来说明“不公平”怎样发生的。它们不能直接变成作者自己也认为无子女者有错。\n\nC却认定他们没有履行责任。段落没有给出生育必须承担的责任，作者反而在指出这些人受到的对待不公平。\n\n**作者把这些责备写出来，就表示他也认定无子女者没有尽到责任吗？**\n\n不表示。作者说的是这样对待他们不公平，C把被描述的责备当成了作者认可的判断。\n\n**第一轮判断：C排除。**","articleRects":[[274,1024,1122,38],[203,1071,1193,38],[202,1118,1194,38],[202,1165,1194,38],[203,1212,1193,38],[202,1260,1194,37],[202,1307,1163,38]],"questionRects":[[280,1107,626,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"38","paragraphPids":[2]},"html":"<h3>C. fail to fulfill their social responsibilities</h3>\n<blockquote><p>没有孩子的人没有履行社会责任。</p>\n</blockquote>\n<p>把C接回题干，它说的是：没有孩子的人没有履行社会责任。</p>\n<p>C说他们没有尽到<code>social responsibilities</code>，是在认定他们做错了。我们先看作者自己的<code>doesn’t seem quite fair</code>，再看后面哪些话是他们被迫听到的<code>message</code>。</p>\n<blockquote><p>It doesn’t seem quite fair, then, to compare the regrets of parents to the regrets of the childless.</p>\n</blockquote>\n<blockquote><p>but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the <strong>[xxx]</strong> baby-size holes in their lives.</p>\n</blockquote>\n<p>作者先说，这样比较父母与无子女者的后悔不太公平。随后才介绍无子女者听到的话：孩子最重要，没有孩子就是他们痛苦的原因。</p>\n<p>后面这些责备是作者拿来说明“不公平”怎样发生的。它们不能直接变成作者自己也认为无子女者有错。</p>\n<p>C却认定他们没有履行责任。段落没有给出生育必须承担的责任，作者反而在指出这些人受到的对待不公平。</p>\n<p><strong>作者把这些责备写出来，就表示他也认定无子女者没有尽到责任吗？</strong></p>\n<p>不表示。作者说的是这样对待他们不公平，C把被描述的责备当成了作者认可的判断。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"38题","raw":"### D. are less likely to be satisfied with their life\n\n> 没有孩子的人更难对生活满意。\n\n把D接回题干，它说的是：没有孩子的人更难对生活满意。\n\nD要比较没有孩子的人是否更不容易满意。第3段拿来比较的两组却都带着`unhappy`：`Unhappy parents`和`unhappy childless folks`。我们先看这两个限定。\n\n> Unhappy parents rarely are **[xxx]** to wonder if they shouldn’t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the **[xxx]** baby-size holes in their lives.\n\n被拿出来的父母已经不快乐，被拿出来的无子女者也已经不快乐。接下来的不同在于，一组很少被追问是否不该生育，另一组却总被告知自己是没孩子才痛苦。\n\n所以，这里能看出两组人受到的对待不同。我们还不知道所有父母中有多少人快乐，也不知道所有无子女者中有多少人快乐，不能从这两组已经不快乐的人推出谁总体更容易满意。\n\n最后关于痛苦来自没孩子的说法，又属于他们被迫听到的信息，不能把它直接拿来当作者统计出的原因。\n\n**两组已经不快乐的人受到不同对待，是否就能算出所有无子女者更不容易对生活满意？**\n\n不能。原文比较了别人怎样看待他们，没有比较两个完整群体的满意比例。\n\n**第一轮判断：D排除。**","articleRects":[[274,1024,1122,38],[203,1071,1193,38],[202,1118,1194,38],[202,1165,1194,38],[203,1212,1193,38],[202,1260,1194,37],[202,1307,1163,38]],"questionRects":[[280,1168,680,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"38","paragraphPids":[2]},"html":"<h3>D. are less likely to be satisfied with their life</h3>\n<blockquote><p>没有孩子的人更难对生活满意。</p>\n</blockquote>\n<p>把D接回题干，它说的是：没有孩子的人更难对生活满意。</p>\n<p>D要比较没有孩子的人是否更不容易满意。第3段拿来比较的两组却都带着<code>unhappy</code>：<code>Unhappy parents</code>和<code>unhappy childless folks</code>。我们先看这两个限定。</p>\n<blockquote><p>Unhappy parents rarely are <strong>[xxx]</strong> to wonder if they shouldn’t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the <strong>[xxx]</strong> baby-size holes in their lives.</p>\n</blockquote>\n<p>被拿出来的父母已经不快乐，被拿出来的无子女者也已经不快乐。接下来的不同在于，一组很少被追问是否不该生育，另一组却总被告知自己是没孩子才痛苦。</p>\n<p>所以，这里能看出两组人受到的对待不同。我们还不知道所有父母中有多少人快乐，也不知道所有无子女者中有多少人快乐，不能从这两组已经不快乐的人推出谁总体更容易满意。</p>\n<p>最后关于痛苦来自没孩子的说法，又属于他们被迫听到的信息，不能把它直接拿来当作者统计出的原因。</p>\n<p><strong>两组已经不快乐的人受到不同对待，是否就能算出所有无子女者更不容易对生活满意？</strong></p>\n<p>不能。原文比较了别人怎样看待他们，没有比较两个完整群体的满意比例。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"38题","raw":"### 38题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n目前保留A。bothered with the message及两组人的不同待遇共同说明他们持续承受指责，保留A。","articleRects":[],"questionRects":[[226,924,775,38],[280,985,555,38],[280,1046,525,38],[280,1107,626,38],[280,1168,680,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"38"},"html":"<h3>38题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>目前保留A。bothered with the message及两组人的不同待遇共同说明他们持续承受指责，保留A。</p>\n"},{"section":"39题","raw":"## 39题\n\n> According to Paragraph 4, the message conveyed by celebrity magazines is, ______.  \n> 第四段说明，明星杂志传达的信息是什么性质的？\n\n题干给出Paragraph 4，所问对象是celebrity magazines传出的信息。先读作者怎样比较普通单亲的工作量与明星的on their own。\n\n> 原文参考：\n> \n> Of course, the image of **[xxx]** that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock. According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all. No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with **[xxx]** help) is a piece of cake.\n> \n> 开始精读：\n> \n> Of course, the image of **[xxx]** that celebrity magazines like Us Weekly and People present is hugely unrealistic, / especially when the parents are single mothers like Bullock. / According to several studies concluding that parents are less happy than childless couples, / single parents are the least happy of all. / No shock there, considering how much work it is to raise a kid without a partner to lean on; / yet to hear Sandra and Britney tell it, / raising a kid on their “own” (read: with **[xxx]** help) is a piece of cake.\n> \n> 当然，《Us Weekly》《People》等明星杂志呈现的**[xxx]**形象极不真实，/ 特别是在父母是Bullock这样的单身母亲时。/ 几项研究得出父母比无子女夫妇更不幸福，/ 而单亲父母是所有人中最不幸福的。/ 这不奇怪，考虑到没有伴侣可以依靠，独自养孩子需要付出多少工作；/ 可听Sandra和Britney讲，/ 靠她们“自己”养孩子——实际应读作有人**[xxx]**地帮忙——轻而易举。\n\n杂志给出轻而易举的形象，作者又揭出实际帮助条件。四项在分别评价表达方式、读者感受或真实性，需要看哪一项接得上这组对照。\n\n接下来按A—D逐项看。","articleRects":[[274,1353,1123,39],[203,1401,1193,38],[202,1448,1194,38],[203,1495,1193,38],[203,1542,1193,38],[203,1588,1188,39],[206,1635,788,39]],"questionRects":[[226,1291,1195,37],[284,1352,27,30],[284,1413,170,38],[284,1474,202,38],[284,1535,245,38],[284,1596,204,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"39","initialReadingPids":[3]},"html":"<h2>39题</h2>\n<blockquote><p>According to Paragraph 4, the message conveyed by celebrity magazines is, ______.<br />\n第四段说明，明星杂志传达的信息是什么性质的？</p>\n</blockquote>\n<p>题干给出Paragraph 4，所问对象是celebrity magazines传出的信息。先读作者怎样比较普通单亲的工作量与明星的on their own。</p>\n<blockquote><p>原文参考：</p>\n<p>Of course, the image of <strong>[xxx]</strong> that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock. According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all. No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with <strong>[xxx]</strong> help) is a piece of cake.</p>\n<p>开始精读：</p>\n<p>Of course, the image of <strong>[xxx]</strong> that celebrity magazines like Us Weekly and People present is hugely unrealistic, / especially when the parents are single mothers like Bullock. / According to several studies concluding that parents are less happy than childless couples, / single parents are the least happy of all. / No shock there, considering how much work it is to raise a kid without a partner to lean on; / yet to hear Sandra and Britney tell it, / raising a kid on their “own” (read: with <strong>[xxx]</strong> help) is a piece of cake.</p>\n<p>当然，《Us Weekly》《People》等明星杂志呈现的<strong>[xxx]</strong>形象极不真实，/ 特别是在父母是Bullock这样的单身母亲时。/ 几项研究得出父母比无子女夫妇更不幸福，/ 而单亲父母是所有人中最不幸福的。/ 这不奇怪，考虑到没有伴侣可以依靠，独自养孩子需要付出多少工作；/ 可听Sandra和Britney讲，/ 靠她们“自己”养孩子——实际应读作有人<strong>[xxx]</strong>地帮忙——轻而易举。</p>\n</blockquote>\n<p>杂志给出轻而易举的形象，作者又揭出实际帮助条件。四项在分别评价表达方式、读者感受或真实性，需要看哪一项接得上这组对照。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"39题","raw":"### A. soothing\n\n> 明星杂志的信息能安慰人。\n\n把A接回题干，它说的是：明星杂志的信息能安慰人。\n\nA的`soothing`是让人得到安慰。第4段先说杂志形象`hugely unrealistic`，后面又比较普通单亲和明星各有什么帮助，我们看这个比较有没有写谁因此得到安慰。\n\n> the image of **[xxx]** that celebrity magazines like Us Weekly and People present is hugely unrealistic\n\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with **[xxx]** help) is a piece of cake.\n\n普通单亲没有伴侣可以依靠，独自养孩子的工作很多。明星却说自己养孩子很轻松，括号里又说明她们有别的帮助。\n\n这两种人的条件不一样，杂志却让明星的轻松看起来像任何人自己养孩子都能做到。段首的“不真实”正是从这里解释出来的。\n\nA需要我们读到这种消息让人安心、得到安慰。但这一段没有写读者看后安心了，而是在把画面中没有显出来的帮助指出来。\n\n**作者补出明星有人帮助，是为了说明读者得到安慰，还是说明杂志里的轻松不等于普通单亲的现实？**\n\n是后者。段落比较的是实际养育条件，没有写读者得到安慰。\n\n**第一轮判断：A排除。**","articleRects":[[274,1353,1123,39],[203,1401,1193,38],[202,1448,1194,38],[203,1495,1193,38],[203,1542,1193,38],[203,1588,1188,39],[206,1635,788,39]],"questionRects":[[284,1413,170,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"39","paragraphPids":[3]},"html":"<h3>A. soothing</h3>\n<blockquote><p>明星杂志的信息能安慰人。</p>\n</blockquote>\n<p>把A接回题干，它说的是：明星杂志的信息能安慰人。</p>\n<p>A的<code>soothing</code>是让人得到安慰。第4段先说杂志形象<code>hugely unrealistic</code>，后面又比较普通单亲和明星各有什么帮助，我们看这个比较有没有写谁因此得到安慰。</p>\n<blockquote><p>the image of <strong>[xxx]</strong> that celebrity magazines like Us Weekly and People present is hugely unrealistic</p>\n</blockquote>\n<blockquote><p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with <strong>[xxx]</strong> help) is a piece of cake.</p>\n</blockquote>\n<p>普通单亲没有伴侣可以依靠，独自养孩子的工作很多。明星却说自己养孩子很轻松，括号里又说明她们有别的帮助。</p>\n<p>这两种人的条件不一样，杂志却让明星的轻松看起来像任何人自己养孩子都能做到。段首的“不真实”正是从这里解释出来的。</p>\n<p>A需要我们读到这种消息让人安心、得到安慰。但这一段没有写读者看后安心了，而是在把画面中没有显出来的帮助指出来。</p>\n<p><strong>作者补出明星有人帮助，是为了说明读者得到安慰，还是说明杂志里的轻松不等于普通单亲的现实？</strong></p>\n<p>是后者。段落比较的是实际养育条件，没有写读者得到安慰。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"39题","raw":"### B. ambiguous\n\n> 明星杂志的信息模棱两可。\n\n把B接回题干，它说的是：明星杂志的信息模棱两可。\n\nB的`ambiguous`是意思含糊。明星怎样形容自己养孩子，原文用了`a piece of cake`。我们先读懂这句，再看括号里的帮助说明。\n\n> yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with **[xxx]** help) is a piece of cake.\n\n`a piece of cake`明确说很轻松，前面的`on their own`又把它说成自己养孩子。这句话传出的轻松印象并不含糊。\n\n作者给“自己”加引号，又插进`with [xxx] help`，是在提醒我们，她们实际还有帮助。即使那是什么帮助没有读清，`help`也已经让我们知道她们不是真的没有支援。\n\n所以，问题是这种轻松没有交代实际支援，不能把它读成杂志既说轻松、又说困难，叫人弄不清什么意思。\n\n**明星用`a piece of cake`说养孩子很轻松，这个意思含糊吗？**\n\n不含糊。意思很清楚，作者指出的是她们有帮助，轻松的形象并不真实。\n\n**第一轮判断：B排除。**","articleRects":[[274,1353,1123,39],[203,1401,1193,38],[202,1448,1194,38],[203,1495,1193,38],[203,1542,1193,38],[203,1588,1188,39],[206,1635,788,39]],"questionRects":[[284,1474,202,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"39","paragraphPids":[3]},"html":"<h3>B. ambiguous</h3>\n<blockquote><p>明星杂志的信息模棱两可。</p>\n</blockquote>\n<p>把B接回题干，它说的是：明星杂志的信息模棱两可。</p>\n<p>B的<code>ambiguous</code>是意思含糊。明星怎样形容自己养孩子，原文用了<code>a piece of cake</code>。我们先读懂这句，再看括号里的帮助说明。</p>\n<blockquote><p>yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with <strong>[xxx]</strong> help) is a piece of cake.</p>\n</blockquote>\n<p><code>a piece of cake</code>明确说很轻松，前面的<code>on their own</code>又把它说成自己养孩子。这句话传出的轻松印象并不含糊。</p>\n<p>作者给“自己”加引号，又插进<code>with [xxx] help</code>，是在提醒我们，她们实际还有帮助。即使那是什么帮助没有读清，<code>help</code>也已经让我们知道她们不是真的没有支援。</p>\n<p>所以，问题是这种轻松没有交代实际支援，不能把它读成杂志既说轻松、又说困难，叫人弄不清什么意思。</p>\n<p><strong>明星用<code>a piece of cake</code>说养孩子很轻松，这个意思含糊吗？</strong></p>\n<p>不含糊。意思很清楚，作者指出的是她们有帮助，轻松的形象并不真实。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"39题","raw":"### C. compensatory\n\n> 明星杂志的信息具有补偿作用。\n\n把C接回题干，它说的是：明星杂志的信息具有补偿作用。\n\nC的`compensatory`说有所补偿。原文一边写单亲父母`least happy`，一边写明星觉得`a piece of cake`，我们看这两边有没有连成“看了明星消息以后，原来的失落被弥补了”。\n\n> According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all.\n\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with **[xxx]** help) is a piece of cake.\n\n研究说单亲父母最不快乐，作者接着解释独自承担养育工作很难。`yet`后面才转到明星，说她们把自己养孩子讲得很轻松。\n\n普通单亲的困难和明星的说法在这里形成反差。接下来的括号又告诉我们，明星实际上得到帮助，这解释了为什么不能拿她们的轻松代表普通单亲。\n\n原文没有说普通单亲看过这些消息后，失落便得到弥补。C需要的这一段经历没有写出来。\n\n**先写单亲父母不快乐，再写明星说很轻松，就等于前一组人从明星消息里得到了补偿吗？**\n\n不等于。原文把两种处境放在一起比较，没有写看消息以后获得心理补偿。\n\n**第一轮判断：C排除。**","articleRects":[[274,1353,1123,39],[203,1401,1193,38],[202,1448,1194,38],[203,1495,1193,38],[203,1542,1193,38],[203,1588,1188,39],[206,1635,788,39]],"questionRects":[[284,1535,245,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"39","paragraphPids":[3]},"html":"<h3>C. compensatory</h3>\n<blockquote><p>明星杂志的信息具有补偿作用。</p>\n</blockquote>\n<p>把C接回题干，它说的是：明星杂志的信息具有补偿作用。</p>\n<p>C的<code>compensatory</code>说有所补偿。原文一边写单亲父母<code>least happy</code>，一边写明星觉得<code>a piece of cake</code>，我们看这两边有没有连成“看了明星消息以后，原来的失落被弥补了”。</p>\n<blockquote><p>According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all.</p>\n</blockquote>\n<blockquote><p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with <strong>[xxx]</strong> help) is a piece of cake.</p>\n</blockquote>\n<p>研究说单亲父母最不快乐，作者接着解释独自承担养育工作很难。<code>yet</code>后面才转到明星，说她们把自己养孩子讲得很轻松。</p>\n<p>普通单亲的困难和明星的说法在这里形成反差。接下来的括号又告诉我们，明星实际上得到帮助，这解释了为什么不能拿她们的轻松代表普通单亲。</p>\n<p>原文没有说普通单亲看过这些消息后，失落便得到弥补。C需要的这一段经历没有写出来。</p>\n<p><strong>先写单亲父母不快乐，再写明星说很轻松，就等于前一组人从明星消息里得到了补偿吗？</strong></p>\n<p>不等于。原文把两种处境放在一起比较，没有写看消息以后获得心理补偿。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"39题","raw":"### D. misleading\n\n> 明星杂志的信息有误导性。\n\n把D接回题干，它说的是：明星杂志的信息有误导性。\n\nD的`misleading`说会把人引向错误理解。段首直接评价杂志形象`hugely unrealistic`，后面又有`on their own`和`with [xxx] help`，我们看这两处怎么接在同一句里。\n\n> the image of **[xxx]** that celebrity magazines like Us Weekly and People present is hugely unrealistic\n\n> No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with **[xxx]** help) is a piece of cake.\n\n普通单亲的困难在于没有伴侣依靠，却要承担大量养育工作。明星说自己养孩子是`a piece of cake`，听起来也像独自承担这些工作却很轻松。\n\n但括号又说`with [xxx] help`。虽然具体的帮助还不认识，`with ... help`已经说明她们有支援。\n\n读者若只看到“自己养孩子很轻松”，就可能把有人帮忙时的轻松，想成普通单亲没有支援也能这样。D所说的误导，就是这两种实际条件被说得像同一回事。\n\n**有人帮助的明星把养育说成“自己来、很轻松”，会不会让人低估普通单亲独自承担的工作？**\n\n会。帮助条件不同，呈现出来的轻松却容易让人以为独自养孩子也一样。D保留。\n\n**第一轮判断：D保留。**","articleRects":[[274,1353,1123,39],[203,1401,1193,38],[202,1448,1194,38],[203,1495,1193,38],[203,1542,1193,38],[203,1588,1188,39],[206,1635,788,39]],"questionRects":[[284,1596,204,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"39","paragraphPids":[3]},"html":"<h3>D. misleading</h3>\n<blockquote><p>明星杂志的信息有误导性。</p>\n</blockquote>\n<p>把D接回题干，它说的是：明星杂志的信息有误导性。</p>\n<p>D的<code>misleading</code>说会把人引向错误理解。段首直接评价杂志形象<code>hugely unrealistic</code>，后面又有<code>on their own</code>和<code>with [xxx] help</code>，我们看这两处怎么接在同一句里。</p>\n<blockquote><p>the image of <strong>[xxx]</strong> that celebrity magazines like Us Weekly and People present is hugely unrealistic</p>\n</blockquote>\n<blockquote><p>No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with <strong>[xxx]</strong> help) is a piece of cake.</p>\n</blockquote>\n<p>普通单亲的困难在于没有伴侣依靠，却要承担大量养育工作。明星说自己养孩子是<code>a piece of cake</code>，听起来也像独自承担这些工作却很轻松。</p>\n<p>但括号又说<code>with [xxx] help</code>。虽然具体的帮助还不认识，<code>with ... help</code>已经说明她们有支援。</p>\n<p>读者若只看到“自己养孩子很轻松”，就可能把有人帮忙时的轻松，想成普通单亲没有支援也能这样。D所说的误导，就是这两种实际条件被说得像同一回事。</p>\n<p><strong>有人帮助的明星把养育说成“自己来、很轻松”，会不会让人低估普通单亲独自承担的工作？</strong></p>\n<p>会。帮助条件不同，呈现出来的轻松却容易让人以为独自养孩子也一样。D保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"39题","raw":"### 39题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n目前保留D。unrealistic给出评价，with…help解释误解怎样形成，保留D。","articleRects":[],"questionRects":[[226,1291,1195,37],[284,1352,27,30],[284,1413,170,38],[284,1474,202,38],[284,1535,245,38],[284,1596,204,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"39"},"html":"<h3>39题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>目前保留D。unrealistic给出评价，with…help解释误解怎样形成，保留D。</p>\n"},{"section":"40题","raw":"## 40题\n\n> Which of the following can be inferred from the last paragraph?  \n> 从最后一段可以推知什么？\n\n题干只问last paragraph。完整读过首句、But后的追问和末尾发型类比，分清哪些影响被否定，哪些较小的影响仍被保留。\n\n> 原文参考：\n> \n> It’s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so **[xxx]**: most adults understand that a baby is not a haircut. But it’s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren’t in some small, **[xxx]** way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting “the Rachel” might make us look just a little bit like Jennifer Aniston.\n> \n> 开始精读：\n> \n> It’s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so **[xxx]**: / most adults understand that a baby is not a haircut. / But it’s interesting to wonder / if the images we see every week of stress-free, happiness-enhancing parenthood / aren’t in some small, **[xxx]** way contributing to our own dissatisfactions with the actual experience, / in the same way that a small part of us hoped getting “the Rachel” / might make us look just a little bit like Jennifer Aniston.\n> \n> 很难想象很多人会愚蠢到仅仅因为Reese和Angelina把养孩子显得如此**[xxx]**，就想要孩子：/ 大多数成年人明白，孩子并不是一种发型。/ 但值得想一想，/ 我们每周看到的那些毫无压力、增进幸福的养育形象，/ 是否会以某种微小的、**[xxx]**的方式增加我们对实际经历的不满，/ 就像我们心里有那么一点希望，剪一个“Rachel”发型，/ 能让自己看起来稍微像Jennifer Aniston一样。\n\n作者不相信人们只因明星形象而决定生育，却追问这些形象是否改变对实际养育的感受。选项要保留作用来源、感受对象以及这种影响的程度。\n\n接下来按A—D逐项看。","articleRects":[[274,1684,1123,37],[202,1731,1194,37],[202,1778,1194,37],[202,1825,1189,38],[203,1872,1193,38],[202,1918,1189,39],[203,1962,837,47]],"questionRects":[[225,1719,1000,37],[280,1780,1039,38],[280,1841,1023,38],[280,1902,853,38],[280,1963,868,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"40","initialReadingPids":[4]},"html":"<h2>40题</h2>\n<blockquote><p>Which of the following can be inferred from the last paragraph?<br />\n从最后一段可以推知什么？</p>\n</blockquote>\n<p>题干只问last paragraph。完整读过首句、But后的追问和末尾发型类比，分清哪些影响被否定，哪些较小的影响仍被保留。</p>\n<blockquote><p>原文参考：</p>\n<p>It’s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so <strong>[xxx]</strong>: most adults understand that a baby is not a haircut. But it’s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren’t in some small, <strong>[xxx]</strong> way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting “the Rachel” might make us look just a little bit like Jennifer Aniston.</p>\n<p>开始精读：</p>\n<p>It’s hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so <strong>[xxx]</strong>: / most adults understand that a baby is not a haircut. / But it’s interesting to wonder / if the images we see every week of stress-free, happiness-enhancing parenthood / aren’t in some small, <strong>[xxx]</strong> way contributing to our own dissatisfactions with the actual experience, / in the same way that a small part of us hoped getting “the Rachel” / might make us look just a little bit like Jennifer Aniston.</p>\n<p>很难想象很多人会愚蠢到仅仅因为Reese和Angelina把养孩子显得如此<strong>[xxx]</strong>，就想要孩子：/ 大多数成年人明白，孩子并不是一种发型。/ 但值得想一想，/ 我们每周看到的那些毫无压力、增进幸福的养育形象，/ 是否会以某种微小的、<strong>[xxx]</strong>的方式增加我们对实际经历的不满，/ 就像我们心里有那么一点希望，剪一个“Rachel”发型，/ 能让自己看起来稍微像Jennifer Aniston一样。</p>\n</blockquote>\n<p>作者不相信人们只因明星形象而决定生育，却追问这些形象是否改变对实际养育的感受。选项要保留作用来源、感受对象以及这种影响的程度。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"40题","raw":"### A. Having children contributes little to the glamour of celebrity moms.\n\n> 有孩子几乎不增添明星妈妈的魅力。\n\n把A接回题干，它说的是：有孩子几乎不增添明星妈妈的魅力。\n\nA说有孩子给明星妈妈的魅力增加很少。原文的`Reese and Angelina make it look`也是在说明星和养孩子，我们先看这句是谁使什么显得怎样。\n\n> want children just because Reese and Angelina make it look so **[xxx]**: most adults understand that a baby is not a haircut.\n\n> if the images we see every week of stress-free, happiness-enhancing parenthood aren’t in some small, **[xxx]** way contributing to our own dissatisfactions with the actual experience\n\n这句的主语是Reese和Angelina，`it`接的是养孩子这件事。原文在说，明星把养孩子呈现成某种样子，普通人会不会因此想要孩子。\n\nA反过来让`Having children`作主语，问有孩子给明星本人增加了多少魅力。原文没有比较明星有孩子前后多了多少魅力。\n\n后面还在追问这些养育图像怎样影响`our own dissatisfactions`，说的仍是普通人的养育感受，不能从中得到A的“给明星增加很少魅力”。\n\n**原文在谈明星怎样让普通人看待养育，能否据此判断生孩子给明星本人增加了多少魅力？**\n\n不能。A把孩子对明星本人的作用换了进来，原文没有作这个比较。\n\n**第一轮判断：A排除。**","articleRects":[[274,1684,1123,37],[202,1731,1194,37],[202,1778,1194,37],[202,1825,1189,38],[203,1872,1193,38],[202,1918,1189,39],[203,1962,837,47]],"questionRects":[[280,1780,1039,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"40","paragraphPids":[4]},"html":"<h3>A. Having children contributes little to the glamour of celebrity moms.</h3>\n<blockquote><p>有孩子几乎不增添明星妈妈的魅力。</p>\n</blockquote>\n<p>把A接回题干，它说的是：有孩子几乎不增添明星妈妈的魅力。</p>\n<p>A说有孩子给明星妈妈的魅力增加很少。原文的<code>Reese and Angelina make it look</code>也是在说明星和养孩子，我们先看这句是谁使什么显得怎样。</p>\n<blockquote><p>want children just because Reese and Angelina make it look so <strong>[xxx]</strong>: most adults understand that a baby is not a haircut.</p>\n</blockquote>\n<blockquote><p>if the images we see every week of stress-free, happiness-enhancing parenthood aren’t in some small, <strong>[xxx]</strong> way contributing to our own dissatisfactions with the actual experience</p>\n</blockquote>\n<p>这句的主语是Reese和Angelina，<code>it</code>接的是养孩子这件事。原文在说，明星把养孩子呈现成某种样子，普通人会不会因此想要孩子。</p>\n<p>A反过来让<code>Having children</code>作主语，问有孩子给明星本人增加了多少魅力。原文没有比较明星有孩子前后多了多少魅力。</p>\n<p>后面还在追问这些养育图像怎样影响<code>our own dissatisfactions</code>，说的仍是普通人的养育感受，不能从中得到A的“给明星增加很少魅力”。</p>\n<p><strong>原文在谈明星怎样让普通人看待养育，能否据此判断生孩子给明星本人增加了多少魅力？</strong></p>\n<p>不能。A把孩子对明星本人的作用换了进来，原文没有作这个比较。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"40题","raw":"### B. Celebrity moms have influenced our attitude towards child rearing.\n\n> 明星妈妈影响了我们对养育孩子的态度。\n\n把B接回题干，它说的是：明星妈妈影响了我们对养育孩子的态度。\n\nB说明星妈妈影响了我们对养育的态度。末段的`the images`和`our own dissatisfactions`也在谈她们的图像与我们的感受，先把`But`前后都读上。\n\n> want children just because Reese and Angelina make it look so **[xxx]**: most adults understand that a baby is not a haircut.\n\n> if the images we see every week of stress-free, happiness-enhancing parenthood aren’t in some small, **[xxx]** way contributing to our own dissatisfactions with the actual experience\n\n> in the same way that a small part of us hoped getting “the Rachel” might make us look just a little bit like Jennifer Aniston.\n\n开头说，很难相信许多人会仅仅因为明星把养孩子说得好，就决定要孩子。这里的`just because`说的是只靠这一点便作出生育决定。\n\n`But`后又问，每周看到毫无压力、增进幸福的养育图像，会不会在某种较小的程度上增加我们对实际经历的不满。这样一来，人虽然没有照着明星决定生孩子，却仍可能拿明星的轻松图像和自己的辛苦比较。\n\nB只说态度受到影响，没有说生育决定全由明星造成。因此，它能接上后面这种对期待和感受的影响。\n\n**没有仅仅为了模仿明星而生孩子，还能不能受她们的轻松形象影响，觉得自己的养育不够好？**\n\n能。是否决定生孩子和怎样感受养育经历是两件事，B保留。\n\n**第一轮判断：B保留。**","articleRects":[[274,1684,1123,37],[202,1731,1194,37],[202,1778,1194,37],[202,1825,1189,38],[203,1872,1193,38],[202,1918,1189,39],[203,1962,837,47]],"questionRects":[[280,1841,1023,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"40","paragraphPids":[4]},"html":"<h3>B. Celebrity moms have influenced our attitude towards child rearing.</h3>\n<blockquote><p>明星妈妈影响了我们对养育孩子的态度。</p>\n</blockquote>\n<p>把B接回题干，它说的是：明星妈妈影响了我们对养育孩子的态度。</p>\n<p>B说明星妈妈影响了我们对养育的态度。末段的<code>the images</code>和<code>our own dissatisfactions</code>也在谈她们的图像与我们的感受，先把<code>But</code>前后都读上。</p>\n<blockquote><p>want children just because Reese and Angelina make it look so <strong>[xxx]</strong>: most adults understand that a baby is not a haircut.</p>\n</blockquote>\n<blockquote><p>if the images we see every week of stress-free, happiness-enhancing parenthood aren’t in some small, <strong>[xxx]</strong> way contributing to our own dissatisfactions with the actual experience</p>\n</blockquote>\n<blockquote><p>in the same way that a small part of us hoped getting “the Rachel” might make us look just a little bit like Jennifer Aniston.</p>\n</blockquote>\n<p>开头说，很难相信许多人会仅仅因为明星把养孩子说得好，就决定要孩子。这里的<code>just because</code>说的是只靠这一点便作出生育决定。</p>\n<p><code>But</code>后又问，每周看到毫无压力、增进幸福的养育图像，会不会在某种较小的程度上增加我们对实际经历的不满。这样一来，人虽然没有照着明星决定生孩子，却仍可能拿明星的轻松图像和自己的辛苦比较。</p>\n<p>B只说态度受到影响，没有说生育决定全由明星造成。因此，它能接上后面这种对期待和感受的影响。</p>\n<p><strong>没有仅仅为了模仿明星而生孩子，还能不能受她们的轻松形象影响，觉得自己的养育不够好？</strong></p>\n<p>能。是否决定生孩子和怎样感受养育经历是两件事，B保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"40题","raw":"### C. Having children **[xxx]** our dissatisfaction with life.\n\n> 生孩子**[xxx]**我们对生活的不满。\n\n把C接回题干，它说的是：生孩子**[xxx]**我们对生活的不满。\n\nC的`dissatisfaction`能找到末段的`dissatisfactions`。我们把`contributing to`前后的内容读完整，看看是什么使人不满，又是对什么不满。\n\n> if the images we see every week of stress-free, happiness-enhancing parenthood aren’t in some small, **[xxx]** way contributing to our own dissatisfactions with the actual experience\n\n前面的主语是`the images we see every week`，这些图像把养育呈现得没有压力、能增加幸福。后面说它们可能使我们对`the actual experience`更不满意，也就是对自己实际的养育经历不满。\n\nC却让`Having children`成为前面的主语，后面又说`with life`。这样就从“理想化图像影响养育感受”，变成了“生孩子影响对整个人生的不满”。\n\n中间的动作虽然还不认识，但前后的这两处已经不同，不能把图像造成的落差直接算成生育本身造成的感受。\n\n**原文说理想化图像影响我们对实际养育的感受，能直接改成生孩子影响我们对整个人生的不满吗？**\n\n不能。图像被换成了生育本身，实际养育经历又被扩大到了整个人生。\n\n**第一轮判断：C排除。**","articleRects":[[274,1684,1123,37],[202,1731,1194,37],[202,1778,1194,37],[202,1825,1189,38],[203,1872,1193,38],[202,1918,1189,39],[203,1962,837,47]],"questionRects":[[280,1902,853,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"40","paragraphPids":[4]},"html":"<h3>C. Having children <strong>[xxx]</strong> our dissatisfaction with life.</h3>\n<blockquote><p>生孩子<strong>[xxx]</strong>我们对生活的不满。</p>\n</blockquote>\n<p>把C接回题干，它说的是：生孩子<strong>[xxx]</strong>我们对生活的不满。</p>\n<p>C的<code>dissatisfaction</code>能找到末段的<code>dissatisfactions</code>。我们把<code>contributing to</code>前后的内容读完整，看看是什么使人不满，又是对什么不满。</p>\n<blockquote><p>if the images we see every week of stress-free, happiness-enhancing parenthood aren’t in some small, <strong>[xxx]</strong> way contributing to our own dissatisfactions with the actual experience</p>\n</blockquote>\n<p>前面的主语是<code>the images we see every week</code>，这些图像把养育呈现得没有压力、能增加幸福。后面说它们可能使我们对<code>the actual experience</code>更不满意，也就是对自己实际的养育经历不满。</p>\n<p>C却让<code>Having children</code>成为前面的主语，后面又说<code>with life</code>。这样就从“理想化图像影响养育感受”，变成了“生孩子影响对整个人生的不满”。</p>\n<p>中间的动作虽然还不认识，但前后的这两处已经不同，不能把图像造成的落差直接算成生育本身造成的感受。</p>\n<p><strong>原文说理想化图像影响我们对实际养育的感受，能直接改成生孩子影响我们对整个人生的不满吗？</strong></p>\n<p>不能。图像被换成了生育本身，实际养育经历又被扩大到了整个人生。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"40题","raw":"### D. We sometimes neglect the happiness from child rearing.\n\n> 我们有时忽视了养育孩子带来的幸福。\n\n把D接回题干，它说的是：我们有时忽视了养育孩子带来的幸福。\n\nD说我们`neglect the happiness`，忽视了养育中的幸福。原文的`happiness-enhancing`也有幸福，我们看看它修饰的是实际养育，还是每周看到的图像。\n\n> if the images we see every week of stress-free, happiness-enhancing parenthood aren’t in some small, **[xxx]** way contributing to our own dissatisfactions with the actual experience\n\n原文说的是`images ... of stress-free, happiness-enhancing parenthood`，即图像把养育表现成没有压力、能增加幸福。然后作者问，这种形象是否让人对实际经历更不满。\n\n这里有杂志里的理想形象，也有自己的实际感受。D要说的却是，现实中已经有的幸福被我们忽视了。\n\n要接上D，还得知道实际养育中哪些幸福被人漏看。原段没有写这个过程，只是提出理想形象是否影响了我们对现实的期待。\n\n**看了轻松的养育图像后对现实不满，就一定说明我们忽视了现实中已有的幸福吗？**\n\n不能这样确定。原文谈图像怎样影响期待，没有说人们漏看了哪些实际的幸福。\n\n**第一轮判断：D排除。**","articleRects":[[274,1684,1123,37],[202,1731,1194,37],[202,1778,1194,37],[202,1825,1189,38],[203,1872,1193,38],[202,1918,1189,39],[203,1962,837,47]],"questionRects":[[280,1963,868,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"40","paragraphPids":[4]},"html":"<h3>D. We sometimes neglect the happiness from child rearing.</h3>\n<blockquote><p>我们有时忽视了养育孩子带来的幸福。</p>\n</blockquote>\n<p>把D接回题干，它说的是：我们有时忽视了养育孩子带来的幸福。</p>\n<p>D说我们<code>neglect the happiness</code>，忽视了养育中的幸福。原文的<code>happiness-enhancing</code>也有幸福，我们看看它修饰的是实际养育，还是每周看到的图像。</p>\n<blockquote><p>if the images we see every week of stress-free, happiness-enhancing parenthood aren’t in some small, <strong>[xxx]</strong> way contributing to our own dissatisfactions with the actual experience</p>\n</blockquote>\n<p>原文说的是<code>images ... of stress-free, happiness-enhancing parenthood</code>，即图像把养育表现成没有压力、能增加幸福。然后作者问，这种形象是否让人对实际经历更不满。</p>\n<p>这里有杂志里的理想形象，也有自己的实际感受。D要说的却是，现实中已经有的幸福被我们忽视了。</p>\n<p>要接上D，还得知道实际养育中哪些幸福被人漏看。原段没有写这个过程，只是提出理想形象是否影响了我们对现实的期待。</p>\n<p><strong>看了轻松的养育图像后对现实不满，就一定说明我们忽视了现实中已有的幸福吗？</strong></p>\n<p>不能这样确定。原文谈图像怎样影响期待，没有说人们漏看了哪些实际的幸福。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"40题","raw":"### 40题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n目前保留B。But后的图像与不满之间的联系支持态度受到影响，small和a little bit限制了其程度，保留B。","articleRects":[],"questionRects":[[225,1719,1000,37],[280,1780,1039,38],[280,1841,1023,38],[280,1902,853,38],[280,1963,868,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"40"},"html":"<h3>40题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>目前保留B。But后的图像与不满之间的联系支持态度受到影响，small和a little bit限制了其程度，保留B。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | past-tense condition；can later be sources of intense **[xxx]** and delight | Senior用past-tense condition重新理解happiness，把养育当下的艰难与后来回顾时的幸福区分开。 | 先打破养孩子必须时时令人满足的简单想法，提出实际感受可以更复杂。 |\n| 第2段 | attractive mother；cute baby；Practically every week | attractive mother、cute baby与smiling构成正面的母子画面；Practically every week说明明星妈妈或准妈妈几乎每周出现在报摊上。 | 把个人感受放进一种反复出现的公共形象中：媒体持续展示母亲身份美好的一面。 |\n| 第3段 | bothered with the message；children are the single most important thing in the world | 社会把children are the single most important thing in the world的信息施加给无子女者；同样不幸福，两类人却受到不同评价。 | 说明这些积极形象所处的社会气氛，以及这种价值取向怎样转化成对个人的压力。 |\n| 第4段 | hugely unrealistic；on their “own”；with **[xxx]** help | 作者用hugely unrealistic评价杂志形象；明星所谓on their own实际上仍有with **[xxx]** help。 | 进一步检查形象与现实为什么不同，揭出被轻松叙述省去的养育条件。 |\n| 第5段 | the images we see every week；contributing to our own dissatisfactions | 作者追问the images we see every week是否contributing to our own dissatisfactions with the actual experience。 | 把媒体展示、社会价值与个人感受连起来：理想化图像可能在细微程度上改变期待，使现实经历显得更令人不满。 |\n\n文章并不是简单判定有孩子幸福或没有孩子幸福。它先承认养育感受的复杂性，再追问社会和媒体为何持续把生育描绘得美好，并说明这种不够真实的形象可能影响人们对实际养育的期待与感受。第2段的封面不是孤立的明星消息：第3段说明它背后的生育价值取向，第4段指出理想形象隐去的现实条件，第5段再说明普通人怎样受到影响。","articleRects":[[274,317,1123,38],[203,363,1193,39],[202,412,1194,38],[202,459,1194,38],[202,506,1194,38],[202,553,1194,38],[202,600,1194,38],[202,647,1194,38],[202,693,1194,39],[202,740,1006,39],[273,789,1123,37],[202,836,1194,37],[203,883,1193,38],[202,928,1195,40],[202,977,1167,38],[274,1024,1122,38],[203,1071,1193,38],[202,1118,1194,38],[202,1165,1194,38],[203,1212,1193,38],[202,1260,1194,37],[202,1307,1163,38],[274,1353,1123,39],[203,1401,1193,38],[202,1448,1194,38],[203,1495,1193,38],[203,1542,1193,38],[203,1588,1188,39],[206,1635,788,39],[274,1684,1123,37],[202,1731,1194,37],[202,1778,1194,37],[202,1825,1189,38],[203,1872,1193,38],[202,1918,1189,39],[203,1962,837,47]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>past-tense condition；can later be sources of intense <strong>[xxx]</strong> and delight</td><td>Senior用past-tense condition重新理解happiness，把养育当下的艰难与后来回顾时的幸福区分开。</td><td>先打破养孩子必须时时令人满足的简单想法，提出实际感受可以更复杂。</td></tr><tr><td>第2段</td><td>attractive mother；cute baby；Practically every week</td><td>attractive mother、cute baby与smiling构成正面的母子画面；Practically every week说明明星妈妈或准妈妈几乎每周出现在报摊上。</td><td>把个人感受放进一种反复出现的公共形象中：媒体持续展示母亲身份美好的一面。</td></tr><tr><td>第3段</td><td>bothered with the message；children are the single most important thing in the world</td><td>社会把children are the single most important thing in the world的信息施加给无子女者；同样不幸福，两类人却受到不同评价。</td><td>说明这些积极形象所处的社会气氛，以及这种价值取向怎样转化成对个人的压力。</td></tr><tr><td>第4段</td><td>hugely unrealistic；on their “own”；with <strong>[xxx]</strong> help</td><td>作者用hugely unrealistic评价杂志形象；明星所谓on their own实际上仍有with <strong>[xxx]</strong> help。</td><td>进一步检查形象与现实为什么不同，揭出被轻松叙述省去的养育条件。</td></tr><tr><td>第5段</td><td>the images we see every week；contributing to our own dissatisfactions</td><td>作者追问the images we see every week是否contributing to our own dissatisfactions with the actual experience。</td><td>把媒体展示、社会价值与个人感受连起来：理想化图像可能在细微程度上改变期待，使现实经历显得更令人不满。</td></tr></tbody></table>\n<p>文章并不是简单判定有孩子幸福或没有孩子幸福。它先承认养育感受的复杂性，再追问社会和媒体为何持续把生育描绘得美好，并说明这种不够真实的形象可能影响人们对实际养育的期待与感受。第2段的封面不是孤立的明星消息：第3段说明它背后的生育价值取向，第4段指出理想形象隐去的现实条件，第5段再说明普通人怎样受到影响。</p>\n"},{"section":"进阶回查","raw":"## 回查37题：A还是D？\n\n第一遍留下：\n\n- A. celebrity moms are a permanent source for gossip\n- D. having children is highly valued by the public\n\nA接回题干：明星妈妈持续给八卦报道提供话题。\n\nD接回题干：公众高度重视生儿育女。\n\n第2段几乎每周都有明星妈妈的报道，A能接上报道反复出现这一点。但它还用了`attractive mother`、`cute baby`和`smiling`，为什么要把母子反复写得这么美好？我们看紧接着的第3段。\n\n> In a society that so persistently celebrates **[xxx]**\n>\n> children are the single most important thing in the world\n\n第一句虽然有个词没有读清，后面这句话却很清楚：孩子被说成世界上最重要的事。无子女者还会被告知，自己的不幸福就是因为生活中没有孩子。\n\n所以，接下来的内容是在说社会有多看重生育，以及这种看法怎样影响普通人。D的`highly valued`就能接上“孩子是最重要的事”。回头再看第2段那些被持续、美好地展示出来的母子形象，它们和这种看法是连着的。\n\n第4段又指出：\n\n> the image of **[xxx]** that celebrity magazines like Us Weekly and People present is hugely unrealistic\n\n第5段接着问，每周看到的这种轻松幸福的养育图像，是否让我们对自己的实际经历更加不满。文章一直在看这些美好图像怎样影响人们看待生育，并没有继续讨论媒体靠什么维持八卦话题。\n\n**第2段之后接着写“孩子最重要”和普通人的养育期待，更能说明这些封面反映了哪一种看法？**\n\n更能说明生育受到重视。A说的报道频繁确实出现了，但D还能接住这些画面为什么被写得美好，以及后面怎样评价有孩子和没孩子的生活。\n\n> **37题选D。**\n","articleRects":[[273,789,1123,37],[202,836,1194,37],[203,883,1193,38],[202,928,1195,40],[202,977,1167,38],[274,1024,1122,38],[203,1071,1193,38],[202,1118,1194,38],[202,1165,1194,38],[203,1212,1193,38],[202,1260,1194,37],[202,1307,1163,38],[274,1353,1123,39],[203,1401,1193,38],[202,1448,1194,38],[203,1495,1193,38],[203,1542,1193,38],[203,1588,1188,39],[206,1635,788,39],[274,1684,1123,37],[202,1731,1194,37],[202,1778,1194,37],[202,1825,1189,38],[203,1872,1193,38],[202,1918,1189,39],[203,1962,837,47]],"questionRects":[[226,557,522,38],[280,618,777,38],[280,679,801,38],[280,741,721,37],[280,802,722,37]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","D"],"newEvidencePids":[3,4,5],"finalChoice":"D","qid":"37","paragraphPids":[0,1,2,3,4]},"html":"<h2>回查37题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul><li>A. celebrity moms are a permanent source for gossip</li><li>D. having children is highly valued by the public</li></ul>\n<p>A接回题干：明星妈妈持续给八卦报道提供话题。</p>\n<p>D接回题干：公众高度重视生儿育女。</p>\n<p>第2段几乎每周都有明星妈妈的报道，A能接上报道反复出现这一点。但它还用了<code>attractive mother</code>、<code>cute baby</code>和<code>smiling</code>，为什么要把母子反复写得这么美好？我们看紧接着的第3段。</p>\n<blockquote><p>In a society that so persistently celebrates <strong>[xxx]</strong></p>\n<p>children are the single most important thing in the world</p>\n</blockquote>\n<p>第一句虽然有个词没有读清，后面这句话却很清楚：孩子被说成世界上最重要的事。无子女者还会被告知，自己的不幸福就是因为生活中没有孩子。</p>\n<p>所以，接下来的内容是在说社会有多看重生育，以及这种看法怎样影响普通人。D的<code>highly valued</code>就能接上“孩子是最重要的事”。回头再看第2段那些被持续、美好地展示出来的母子形象，它们和这种看法是连着的。</p>\n<p>第4段又指出：</p>\n<blockquote><p>the image of <strong>[xxx]</strong> that celebrity magazines like Us Weekly and People present is hugely unrealistic</p>\n</blockquote>\n<p>第5段接着问，每周看到的这种轻松幸福的养育图像，是否让我们对自己的实际经历更加不满。文章一直在看这些美好图像怎样影响人们看待生育，并没有继续讨论媒体靠什么维持八卦话题。</p>\n<p><strong>第2段之后接着写“孩子最重要”和普通人的养育期待，更能说明这些封面反映了哪一种看法？</strong></p>\n<p>更能说明生育受到重视。A说的报道频繁确实出现了，但D还能接住这些画面为什么被写得美好，以及后面怎样评价有孩子和没孩子的生活。</p>\n<blockquote><p><strong>37题选D。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**36. C**\n\n**37. D**\n\n**38. A**\n\n**39. D**\n\n**40. B**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>36. C</strong></p>\n<p><strong>37. D</strong></p>\n<p><strong>38. A</strong></p>\n<p><strong>39. D</strong></p>\n<p><strong>40. B</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRvKyBQBXRUJQVlA4TOayBQAvV0Y1As34liTJkiTJtoCp+o5S///BZpHW9+7HiP5PwP5/bOef7j/urb+flAghqPvd85QPVW7dlVBOBXW3v8cVdeORo+6R+A37SGueJyvyWmHRh4pDoWq0id71ZdjDA9vRRsz7h4TprYpaKtXQh0NP6V1/SKlS6cvmuWMbzPI6ht190Au6LVl+7FoXPvTUz6cmRb/4Zbtj9n7bzbbZ7OnuC+cQJciRXzxf+lG/yJ0qdV4/bOxnez/vW1ftt78DzrrktT1CpuuDOqlySKKudMLtY+6qu5mdZXebrSe/2adKRdWZVJ7L0dUXlz1wlXiU1NS+uCu9X3+o+8OuWs/tqk8sMoS8DmHl00aJetyQfqco+NLzQqqU80yXcp8888t75Jm8/p2aHlEx9lafzp2uRNVVpDv3B4n7QDEUDiOcKs8+FEQqaIgsFL6Irq5LUaXX9eMH2pmfE5fX5bp8o1PrUexO3UlhfdmqVlfKKag6f+jO3ad2s8PmMDbOOFvdfcjdnXmGDPJey74kVL/141V6VSkfzJmZbTa3H2GmfRWdZ/V45hCF+lBJpUe/eP38zd5ts5mNvWZj2yeMGOmIMO/LPqb1PJUqVWt//z9MZmO229hY667nX68Peyg/Hiwr5bUvrdl0P1XcPS7R36PWq3HVNqrrD63tEz2Fhjwr78s+qykzpSlFLxl90N1VrVJX15SuHz/lePFaSgWFiw8LISuF6Ik874PoqiPycnXt7+65irzOj3+//8DuTlp1d/1TzHV32zXu/jn+m98waiPJkfljXgA78cKLbSNJilprHVP+4Z0Fz/wWQbZNJ3B/uMP0X23bNkyUubcf4EuDH1iXLxLwggLVABAEFMCATwUnITDFxQwnCJGTMJVbwSJwvPbpmqpimxvXoNOJMEB7CDcAsMv2M3AZ080shF+J/WxrXG4F1jhe3+PxlKjdyPJImh/iVZ6BggH/FaAmB20jSVKqij/q6293D0BETAD/W7orPdPciXXuB36pT56klndJdi5cg6aVRN1E4yIPkBRlmhINLY8YPewBZHHujrqz0kmLMfXJd4GcJAlo7EaCzRL57B64YN6FvZSzV0dK///vp+wtcdvuDRocBU6x97bLoUFiUWg8BOFBATxqyr3Hjd/v+/k/PwGoRDIUdCUdGo+CVKQkFZIMV4My5CEDLWhAsAvEdPjLcRmIQQb6kOc6sJEkqU3j/v9AQkIyIi8xbNvGEa/f/sv2+w9HbttIEns59xu6Z
