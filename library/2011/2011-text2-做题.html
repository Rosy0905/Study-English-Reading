<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"questionTop","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 26题题干\n\n**When McGee announced his departure, his manner can best be described as being ______.**\n\n> McGee宣布离职时，他的表达方式最适合用哪个词形容？\n\n题型：**具体细节题**。\n\n---","html":"<h2>26题题干</h2>\n<p><strong>When McGee announced his departure, his manner can best be described as being ______.</strong></p>\n<blockquote>\n<p>McGee宣布离职时，他的表达方式最适合用哪个词形容？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,200,1360,456]],"scrollTarget":"question","meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**According to Paragraph 2, senior executives’ quitting may be spurred by ______.**\n\n> 根据第2段，高管辞职可能由什么推动？\n\n题型：**具体细节题**。\n\n---","html":"<h2>27题题干</h2>\n<p><strong>According to Paragraph 2, senior executives’ quitting may be spurred by ______.</strong></p>\n<blockquote>\n<p>根据第2段，高管辞职可能由什么推动？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,661,1360,455]],"scrollTarget":"question","meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**The word “poached” (Line 3, Paragraph 4) most probably means ______.**\n\n> 第4段第3行的“poached”最可能是什么意思？\n\n题型：**词义题**。\n\n---","html":"<h2>28题题干</h2>\n<p><strong>The word “poached” (Line 3, Paragraph 4) most probably means ______.</strong></p>\n<blockquote>\n<p>第4段第3行的“poached”最可能是什么意思？</p>\n</blockquote>\n<p>题型：<strong>词义题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,1121,1360,390]],"scrollTarget":"question","meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**It can be inferred from the last paragraph that ______.**\n\n> 从最后一段可以推断出什么？\n\n题型：**局部推断题**。\n\n---","html":"<h2>29题题干</h2>\n<p><strong>It can be inferred from the last paragraph that ______.</strong></p>\n<blockquote>\n<p>从最后一段可以推断出什么？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,1516,1360,389]],"scrollTarget":"question","meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"## 30题题干\n\n**Which of the following is the best title for the text?**\n\n> 下面哪个标题最适合本文？\n\n题型：**全文标题／主旨题**。\n\n---","html":"<h2>30题题干</h2>\n<p><strong>Which of the following is the best title for the text?</strong></p>\n<blockquote>\n<p>下面哪个标题最适合本文？</p>\n</blockquote>\n<p>题型：<strong>全文标题／主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,1910,1360,330]],"scrollTarget":"question","meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到叙述是否从个案转成走向 | rather than, also, as, but |\n| 态度词 / 评价词 | 先抓做法被写成坦率、危险还是可接受 | straight up, cautious, unconventional, acceptable |\n| 动作词 | 先看高管离职后在做什么 | departed, quit, move on, jump |\n| 结果词 | 看离职后是否马上得到高位 | named CEO, opportunities, three years later |\n| 重复主题词 | 大概知道文章围着哪种职业动作转 | executives, CEO, position, job, rule |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到叙述是否从个案转成走向</td>\n  <td>rather than, also, as, but</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓做法被写成坦率、危险还是可接受</td>\n  <td>straight up, cautious, unconventional, acceptable</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看高管离职后在做什么</td>\n  <td>departed, quit, move on, jump</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看离职后是否马上得到高位</td>\n  <td>named CEO, opportunities, three years later</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道文章围着哪种职业动作转</td>\n  <td>executives, CEO, position, job, rule</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[227,351,1323,349],[227,717,1321,402],[228,1137,1320,245],[227,1399,1321,244],[227,1661,1321,297],[228,1975,1320,245]],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than **[xxx]** his exit in the usual vague excuses, he came right out and said he was leaving “to pursue my goal of running a company.” **[xxx]** his ambition was “very much my decision,” McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than <span class=\"mask\">[xxx]</span> his exit in the usual vague excuses, he came right out and said he was leaving “to pursue my goal of running a company.” <span class=\"mask\">[xxx]</span> his ambition was “very much my decision,” McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.</p>\n</div></div>","articleRects":[[227,351,1323,349]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true},"contextRaw":""},{"section":"读文章","raw":"When Liam McGee departed / as pre 定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> When McGee announced his departure, his manner can best be described as being ______.  \n> McGee宣布离职时，他的表达方式最适合用哪个词形容？\n\n题干问McGee宣布离职时的`manner`。粗读时好像在第1段见过`surprisingly straight up`和`came right out`，都是在写他说话方式，所以先读第1段。\n\n> 原文参考：\n>\n> When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than **[xxx]** his exit in the usual vague excuses, he came right out and said he was leaving “to pursue my goal of running a company.” **[xxx]** his ambition was “very much my decision,” McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\n>\n> 开始精读：\n>\n> When Liam McGee departed / as president of Bank of America / in August, / his explanation was surprisingly straight up. / Rather than **[xxx]** his exit / in the usual vague excuses, / he came right out / and said / he was leaving / “to pursue my goal / of running a company.” / **[xxx]** his ambition / was “very much my decision,” / McGee says. / Within two weeks, / he was talking for the first time / with the board / of Hartford Financial Services Group, / which named him CEO and chairman / on September 29.\n>\n> Liam McGee离职时 / 他当时是美国银行总裁 / 在八月 / 他的解释直截了当得令人意外 / 他没有把离职**[xxx]**起来 / 藏在常见的含糊借口里 / 而是直接说出来 / 并且说 / 自己离职 / “是为了追求目标 / 去经营一家公司” / 把野心**[xxx]**出来 / “完全是我自己的决定” / McGee说 / 两周之内 / 他第一次开始交谈 / 对象是董事会 / Hartford Financial Services Group的董事会 / 该公司任命他为CEO兼董事长 / 时间是9月29日\n\n现在回到题干。它不是问McGee离职决定好不好，也不是问他两周后找到什么工作，而是问他怎样把离职理由说出来。原文连续用“直截了当”和“直接说”给方式定性。\n\n接下来按A—D逐项看。","html":"<h2>26题</h2>\n<blockquote>\n<p>When McGee announced his departure, his manner can best be described as being ______.<br />\nMcGee宣布离职时，他的表达方式最适合用哪个词形容？</p>\n</blockquote>\n<p>题干问McGee宣布离职时的<code>manner</code>。粗读时好像在第1段见过<code>surprisingly straight up</code>和<code>came right out</code>，都是在写他说话方式，所以先读第1段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than <span class=\"mask\">[xxx]</span> his exit in the usual vague excuses, he came right out and said he was leaving “to pursue my goal of running a company.” <span class=\"mask\">[xxx]</span> his ambition was “very much my decision,” McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.</p>\n<p>开始精读：</p>\n<p>When Liam McGee departed / as president of Bank of America / in August, / his explanation was surprisingly straight up. / Rather than <span class=\"mask\">[xxx]</span> his exit / in the usual vague excuses, / he came right out / and said / he was leaving / “to pursue my goal / of running a company.” / <span class=\"mask\">[xxx]</span> his ambition / was “very much my decision,” / McGee says. / Within two weeks, / he was talking for the first time / with the board / of Hartford Financial Services Group, / which named him CEO and chairman / on September 29.</p>\n<p>Liam McGee离职时 / 他当时是美国银行总裁 / 在八月 / 他的解释直截了当得令人意外 / 他没有把离职<span class=\"mask\">[xxx]</span>起来 / 藏在常见的含糊借口里 / 而是直接说出来 / 并且说 / 自己离职 / “是为了追求目标 / 去经营一家公司” / 把野心<span class=\"mask\">[xxx]</span>出来 / “完全是我自己的决定” / McGee说 / 两周之内 / 他第一次开始交谈 / 对象是董事会 / Hartford Financial Services Group的董事会 / 该公司任命他为CEO兼董事长 / 时间是9月29日</p>\n</blockquote>\n<p>现在回到题干。它不是问McGee离职决定好不好，也不是问他两周后找到什么工作，而是问他怎样把离职理由说出来。原文连续用“直截了当”和“直接说”给方式定性。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[227,351,1323,349]],"questionRects":[[235,200,1360,456]],"scrollTarget":"article","meta":{"kind":"question","qid":"26"}},{"section":"26题","raw":"### A. **[xxx]**\n\n> **[xxx]** 的\n\n把A接回题干，它说的是：McGee宣布离职时表现得具有某种被遮挡的特征。\n\nA的整个评价词都被挡住。刚才精读时，好像可直接读出的方式只有`straight up`和`came right out`，先看A还剩什么可以核对。\n\n> his explanation was surprisingly straight up\n>\n> he came right out and said he was leaving\n\nA能接上题干的语法外壳，但核心形容词完全不可见；我们既不知道它的褒贬，也不知道它是否描述说话方式。\n\n原文说的是：McGee没有用含糊借口，而是直截了当地公开理由。\n\nA说的却是：他的方式具有一种目前无法确认的性质。\n\n不能自己给 **[xxx]** 补意思。B已经用完整可见的词与两处原文形成直接对应，A没有可见部分建立另一种同等完整的描述。\n\n**决定答案的形容词完全看不见时，仅凭它能接在`being`后面，能不能把A当成对离职方式的完整概括？**\n\n不能。语法位置对上不等于含义对上。\n\n要保留A，至少得确认 **[xxx]** 与“直截了当、直接说”同义；当前看不到，而B已有直接支持。\n\n**第一轮判断：A排除。**","html":"<h3>A. <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 的</p>\n</blockquote>\n<p>把A接回题干，它说的是：McGee宣布离职时表现得具有某种被遮挡的特征。</p>\n<p>A的整个评价词都被挡住。刚才精读时，好像可直接读出的方式只有<code>straight up</code>和<code>came right out</code>，先看A还剩什么可以核对。</p>\n<blockquote>\n<p>his explanation was surprisingly straight up</p>\n<p>he came right out and said he was leaving</p>\n</blockquote>\n<p>A能接上题干的语法外壳，但核心形容词完全不可见；我们既不知道它的褒贬，也不知道它是否描述说话方式。</p>\n<p>原文说的是：McGee没有用含糊借口，而是直截了当地公开理由。</p>\n<p>A说的却是：他的方式具有一种目前无法确认的性质。</p>\n<p>不能自己给 <span class=\"mask\">[xxx]</span> 补意思。B已经用完整可见的词与两处原文形成直接对应，A没有可见部分建立另一种同等完整的描述。</p>\n<p><strong>决定答案的形容词完全看不见时，仅凭它能接在<code>being</code>后面，能不能把A当成对离职方式的完整概括？</strong></p>\n<p>不能。语法位置对上不等于含义对上。</p>\n<p>要保留A，至少得确认 <span class=\"mask\">[xxx]</span> 与“直截了当、直接说”同义；当前看不到，而B已有直接支持。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[227,351,1323,349]],"questionRects":[[235,200,1360,456]],"scrollTarget":"article","meta":{"kind":"option","qid":"26","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"26题","raw":"### B. frank\n\n> 坦率、直截了当的\n\n把B接回题干，它说的是：McGee宣布离职时说得很坦率。\n\nB里的`frank`正好是一种说话方式。刚才精读时，好像`straight up`和`came right out`都在强调没有绕弯，先把两句放回来。\n\n> his explanation was surprisingly straight up\n>\n> Rather than **[xxx]** his exit in the usual vague excuses, he came right out and said ...\n\n原文先说他的解释`straight up`，又用“不是含糊借口，而是直接说”把这种坦率写具体；B同时接住概括和细节。\n\n原文说的是：他不遮掩、不绕弯，直接公开自己离职是为了经营一家公司。\n\nB说的却是：他的表达方式坦率。\n\n`frank`没有把他的职业目标评价成正确或自私，只准确概括他说出理由的方式，正好符合题干的`manner`。\n\n**`straight up`加`came right out`能不能直接支撑`frank`？**\n\n能。两处都在写坦白、直说。\n\nB的主体、评价对象和方式含义都由第1段直接写出。\n\n**第一轮判断：B保留。**","html":"<h3>B. frank</h3>\n<blockquote>\n<p>坦率、直截了当的</p>\n</blockquote>\n<p>把B接回题干，它说的是：McGee宣布离职时说得很坦率。</p>\n<p>B里的<code>frank</code>正好是一种说话方式。刚才精读时，好像<code>straight up</code>和<code>came right out</code>都在强调没有绕弯，先把两句放回来。</p>\n<blockquote>\n<p>his explanation was surprisingly straight up</p>\n<p>Rather than <span class=\"mask\">[xxx]</span> his exit in the usual vague excuses, he came right out and said ...</p>\n</blockquote>\n<p>原文先说他的解释<code>straight up</code>，又用“不是含糊借口，而是直接说”把这种坦率写具体；B同时接住概括和细节。</p>\n<p>原文说的是：他不遮掩、不绕弯，直接公开自己离职是为了经营一家公司。</p>\n<p>B说的却是：他的表达方式坦率。</p>\n<p><code>frank</code>没有把他的职业目标评价成正确或自私，只准确概括他说出理由的方式，正好符合题干的<code>manner</code>。</p>\n<p><strong><code>straight up</code>加<code>came right out</code>能不能直接支撑<code>frank</code>？</strong></p>\n<p>能。两处都在写坦白、直说。</p>\n<p>B的主体、评价对象和方式含义都由第1段直接写出。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[227,351,1323,349]],"questionRects":[[235,200,1360,456]],"scrollTarget":"article","meta":{"kind":"option","qid":"26","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"26题","raw":"### C. self-centered\n\n> 以自我为中心的\n\n把C接回题干，它说的是：McGee宣布离职时显得以自我为中心。\n\nC会让人想到引语里的`my goal`和`my decision`。刚才精读时，好像这些第一人称是在交代他自己的职业目标，但还要看是否足够说明自我中心。\n\n> “to pursue my goal of running a company.”\n>\n> his ambition was “very much my decision,” McGee says.\n\nC确实抓到原文反复使用“我的”，所以第一眼有一点像；不过一个人说明自己的离职目标，本来就会使用第一人称。\n\n原文说的是：McGee坦白说明离职是他自己的决定，目的是追求经营公司的目标。\n\nC说的却是：他在表达时只顾自己、缺乏对他人的考虑。\n\n原文没有写他伤害他人、无视公司或只考虑个人利益。`my decision`强调决定由他主动做出，不能自动升级成人格评价。\n\n**在解释个人离职理由时说“我的目标、我的决定”，是否就足以说明这个人自我中心？**\n\n不能。第一人称归属和负面人格判断之间还缺具体行为。\n\n要选C，原文至少还得写他不顾同事、股东或公司后果；第1段没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. self-centered</h3>\n<blockquote>\n<p>以自我为中心的</p>\n</blockquote>\n<p>把C接回题干，它说的是：McGee宣布离职时显得以自我为中心。</p>\n<p>C会让人想到引语里的<code>my goal</code>和<code>my decision</code>。刚才精读时，好像这些第一人称是在交代他自己的职业目标，但还要看是否足够说明自我中心。</p>\n<blockquote>\n<p>“to pursue my goal of running a company.”</p>\n<p>his ambition was “very much my decision,” McGee says.</p>\n</blockquote>\n<p>C确实抓到原文反复使用“我的”，所以第一眼有一点像；不过一个人说明自己的离职目标，本来就会使用第一人称。</p>\n<p>原文说的是：McGee坦白说明离职是他自己的决定，目的是追求经营公司的目标。</p>\n<p>C说的却是：他在表达时只顾自己、缺乏对他人的考虑。</p>\n<p>原文没有写他伤害他人、无视公司或只考虑个人利益。<code>my decision</code>强调决定由他主动做出，不能自动升级成人格评价。</p>\n<p><strong>在解释个人离职理由时说“我的目标、我的决定”，是否就足以说明这个人自我中心？</strong></p>\n<p>不能。第一人称归属和负面人格判断之间还缺具体行为。</p>\n<p>要选C，原文至少还得写他不顾同事、股东或公司后果；第1段没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[227,351,1323,349]],"questionRects":[[235,200,1360,456]],"scrollTarget":"article","meta":{"kind":"option","qid":"26","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"26题","raw":"### D. impulsive\n\n> 冲动的\n\n把D接回题干，它说的是：McGee宣布离职时显得冲动。\n\nD里的`impulsive`需要看决定是否未经思考。刚才精读时，好像只看到他两周内接触新董事会；速度快不一定等于离职宣布冲动。\n\n> Within two weeks, he was talking for the first time with the board ...\n>\n> leaving without a position **[xxx]** up gave him time to reflect on what kind of company he wanted to run.\n\n“两周之内”容易给人行动很快的感觉，但题干问宣布离职时的方式；而下一段还说空档给了他反思想经营什么公司的时间。\n\n原文说的是：他公开目标后很快接触新董事会，同时把没有预先安排职位的空档用于思考。\n\nD说的却是：他未经考虑、凭一时冲动宣布离职。\n\n时间间隔只能说明后续进展快，不能反推先前决定草率；原文也没有“突然失控、没想清楚”之类内容。\n\n**离职后两周内开始接触新董事会，能不能证明宣布离职本身是冲动行为？**\n\n不能。后续发生得快和决定未经思考不是同一件事。\n\n要选D，原文至少还得写到仓促、后悔或没有计划；现有叙述没有。\n\n**第一轮判断：D排除。**","html":"<h3>D. impulsive</h3>\n<blockquote>\n<p>冲动的</p>\n</blockquote>\n<p>把D接回题干，它说的是：McGee宣布离职时显得冲动。</p>\n<p>D里的<code>impulsive</code>需要看决定是否未经思考。刚才精读时，好像只看到他两周内接触新董事会；速度快不一定等于离职宣布冲动。</p>\n<blockquote>\n<p>Within two weeks, he was talking for the first time with the board ...</p>\n<p>leaving without a position <span class=\"mask\">[xxx]</span> up gave him time to reflect on what kind of company he wanted to run.</p>\n</blockquote>\n<p>“两周之内”容易给人行动很快的感觉，但题干问宣布离职时的方式；而下一段还说空档给了他反思想经营什么公司的时间。</p>\n<p>原文说的是：他公开目标后很快接触新董事会，同时把没有预先安排职位的空档用于思考。</p>\n<p>D说的却是：他未经考虑、凭一时冲动宣布离职。</p>\n<p>时间间隔只能说明后续进展快，不能反推先前决定草率；原文也没有“突然失控、没想清楚”之类内容。</p>\n<p><strong>离职后两周内开始接触新董事会，能不能证明宣布离职本身是冲动行为？</strong></p>\n<p>不能。后续发生得快和决定未经思考不是同一件事。</p>\n<p>要选D，原文至少还得写到仓促、后悔或没有计划；现有叙述没有。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[227,351,1323,349]],"questionRects":[[235,200,1360,456]],"scrollTarget":"article","meta":{"kind":"option","qid":"26","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"26题","raw":"### 26题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D排除；\n\n题干只问表达方式，`straight up`和`came right out`都直接指向坦率；C把第一人称升级成人格判断，D把后续速度升级成冲动，A核心不可见且无独立支撑。\n\n> **26题选B。**","html":"<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除；</li>\n</ul>\n<p>题干只问表达方式，<code>straight up</code>和<code>came right out</code>都直接指向坦率；C把第一人称升级成人格判断，D把后续速度升级成冲动，A核心不可见且无独立支撑。</p>\n<blockquote>\n<p><strong>26题选B。</strong></p>\n</blockquote>\n","articleRects":[[227,351,1323,349]],"questionRects":[[235,200,1360,456]],"scrollTarget":"question","meta":{"kind":"result","qid":"26"}},{"section":"27题","raw":"## 27题\n\n> According to Paragraph 2, senior executives’ quitting may be spurred by ______.  \n> 根据第2段，高管辞职可能由什么推动？\n\n题干明确写`According to Paragraph 2`。粗读时好像记得这一段出现`aspirations`、寻找CEO职位以及没被董事会选中的高管也可能离开，所以先把第2段一次读清。\n\n> 原文参考：\n>\n> McGee says leaving without a position **[xxx]** up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn’t alone. In recent weeks the No. 2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards **[xxx]** **[xxx]** plans in response to shareholder pressure, executives who don’t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague **[xxx]** **[xxx]** their reputations.\n>\n> 开始精读：\n>\n> McGee says / leaving without a position **[xxx]** up / gave him time / to reflect / on what kind of company / he wanted to run. / It also sent a clear message / to the outside world / about his aspirations. / And McGee isn’t alone. / In recent weeks / the No. 2 executives / at Avon and American Express / quit / with the explanation / that they were looking / for a CEO post. / As boards **[xxx]** **[xxx]** plans / in response to shareholder pressure, / executives / who don’t get the nod / also may wish to move on. / A turbulent business environment / also has senior managers cautious / of letting vague **[xxx]** / **[xxx]** their reputations.\n>\n> McGee说 / 离职时没有把下一职位**[xxx]**好 / 给了他时间 / 去思考 / 想经营哪种公司 / 这正是他想做的 / 这也传出一个清楚信息 / 传给外界 / 关于他的志向 / 而且McGee并非个例 / 最近几周 / 二号高管 / 来自Avon和American Express / 也辞职了 / 给出的解释是 / 他们正在寻找 / CEO职位 / 当董事会**[xxx]****[xxx]**计划 / 回应股东压力时 / 那些高管 / 没有被选中的 / 也可能想离开 / 动荡的商业环境 / 也让高级管理者谨慎 / 不愿让含糊的**[xxx]** / **[xxx]**自己的声誉\n\n现在回到题干。它问高管辞职可能由什么推动。第2段先用McGee说明“想经营怎样的公司、公开自己的志向”，再说另外两位二号高管为了寻找CEO职位而辞职，核心落在职业目标。\n\n接下来按A—D逐项看。","html":"<h2>27题</h2>\n<blockquote>\n<p>According to Paragraph 2, senior executives’ quitting may be spurred by ______.<br />\n根据第2段，高管辞职可能由什么推动？</p>\n</blockquote>\n<p>题干明确写<code>According to Paragraph 2</code>。粗读时好像记得这一段出现<code>aspirations</code>、寻找CEO职位以及没被董事会选中的高管也可能离开，所以先把第2段一次读清。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>McGee says leaving without a position <span class=\"mask\">[xxx]</span> up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn’t alone. In recent weeks the No. 2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards <span class=\"mask\">[xxx]</span> <span class=\"mask\">[xxx]</span> plans in response to shareholder pressure, executives who don’t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague <span class=\"mask\">[xxx]</span> <span class=\"mask\">[xxx]</span> their reputations.</p>\n<p>开始精读：</p>\n<p>McGee says / leaving without a position <span class=\"mask\">[xxx]</span> up / gave him time / to reflect / on what kind of company / he wanted to run. / It also sent a clear message / to the outside world / about his aspirations. / And McGee isn’t alone. / In recent weeks / the No. 2 executives / at Avon and American Express / quit / with the explanation / that they were looking / for a CEO post. / As boards <span class=\"mask\">[xxx]</span> <span class=\"mask\">[xxx]</span> plans / in response to shareholder pressure, / executives / who don’t get the nod / also may wish to move on. / A turbulent business environment / also has senior managers cautious / of letting vague <span class=\"mask\">[xxx]</span> / <span class=\"mask\">[xxx]</span> their reputations.</p>\n<p>McGee说 / 离职时没有把下一职位<span class=\"mask\">[xxx]</span>好 / 给了他时间 / 去思考 / 想经营哪种公司 / 这正是他想做的 / 这也传出一个清楚信息 / 传给外界 / 关于他的志向 / 而且McGee并非个例 / 最近几周 / 二号高管 / 来自Avon和American Express / 也辞职了 / 给出的解释是 / 他们正在寻找 / CEO职位 / 当董事会<strong>[xxx]****[xxx]</strong>计划 / 回应股东压力时 / 那些高管 / 没有被选中的 / 也可能想离开 / 动荡的商业环境 / 也让高级管理者谨慎 / 不愿让含糊的<span class=\"mask\">[xxx]</span> / <span class=\"mask\">[xxx]</span>自己的声誉</p>\n</blockquote>\n<p>现在回到题干。它问高管辞职可能由什么推动。第2段先用McGee说明“想经营怎样的公司、公开自己的志向”，再说另外两位二号高管为了寻找CEO职位而辞职，核心落在职业目标。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[227,717,1321,402]],"questionRects":[[235,661,1360,455]],"scrollTarget":"article","meta":{"kind":"question","qid":"27"}},{"section":"27题","raw":"### A. their expectation of better financial status\n\n> 他们对更好经济状况的期待\n\n把A接回题干，它说的是：高管辞职可能是因为期待获得更好的经济状况。\n\nA里最显眼的是`financial status`。刚才精读时，好像第2段谈的是职位、志向和董事会继任安排，没有工资、财富或个人财务。\n\n> gave him time to reflect on what kind of company he wanted to run\n>\n> they were looking for a CEO post\n\nA的“更好”与高管想向上发展表面上能搭在一起，但原文写的是想经营什么公司、寻找CEO职位，不是收入或经济身份。\n\n原文说的是：辞职者希望实现新的职位和经营目标。\n\nA说的却是：辞职者期待更好的财务状况。\n\n职位提升可能带来收入变化，但第2段没有把这层结果写成辞职动机。不能从“想当CEO”自动补成“为了钱”。\n\n**追求CEO职位，是否就等于原文明确说他们期待更好的财务状况？**\n\n不等于。职业职位和个人财务是两个不同对象。\n\n要选A，原文至少还得出现薪酬、收入、财富或经济改善；第2段没有。\n\n**第一轮判断：A排除。**","html":"<h3>A. their expectation of better financial status</h3>\n<blockquote>\n<p>他们对更好经济状况的期待</p>\n</blockquote>\n<p>把A接回题干，它说的是：高管辞职可能是因为期待获得更好的经济状况。</p>\n<p>A里最显眼的是<code>financial status</code>。刚才精读时，好像第2段谈的是职位、志向和董事会继任安排，没有工资、财富或个人财务。</p>\n<blockquote>\n<p>gave him time to reflect on what kind of company he wanted to run</p>\n<p>they were looking for a CEO post</p>\n</blockquote>\n<p>A的“更好”与高管想向上发展表面上能搭在一起，但原文写的是想经营什么公司、寻找CEO职位，不是收入或经济身份。</p>\n<p>原文说的是：辞职者希望实现新的职位和经营目标。</p>\n<p>A说的却是：辞职者期待更好的财务状况。</p>\n<p>职位提升可能带来收入变化，但第2段没有把这层结果写成辞职动机。不能从“想当CEO”自动补成“为了钱”。</p>\n<p><strong>追求CEO职位，是否就等于原文明确说他们期待更好的财务状况？</strong></p>\n<p>不等于。职业职位和个人财务是两个不同对象。</p>\n<p>要选A，原文至少还得出现薪酬、收入、财富或经济改善；第2段没有。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[227,717,1321,402]],"questionRects":[[235,661,1360,455]],"scrollTarget":"article","meta":{"kind":"option","qid":"27","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"27题","raw":"### B. their need to reflect on their **[xxx]** life\n\n> 他们需要反思自己的 **[xxx]** 生活\n\n把B接回题干，它说的是：高管辞职可能是因为需要反思自己某一方面的生活。\n\nB抓住了`reflect`这个原词，所以很像。刚才精读时，好像McGee确实获得时间思考，但他思考的是想经营哪种公司，不是宽泛的“生活”。\n\n> gave him time to reflect on what kind of company he wanted to run\n\n`reflect`和“离职后有时间”都与原文对应；真正要看的是反思的对象，以及这件事在句中是动机还是离职后的结果。\n\n原文说的是：没有预先安排职位这件事给了McGee时间，去思考他想经营哪种公司。\n\nB说的却是：高管因为需要反思某种生活而辞职。\n\n原文的对象是未来想经营的公司，仍属职业选择；B把对象改成被遮挡词修饰的`life`，还把“离职带来的时间”倒写成“促使离职的需要”。可见关系已经不合。\n\n**“离职后有时间思考想经营哪种公司”，能不能改成“为了反思自己的某种生活而离职”？**\n\n不能。对象和因果先后都变了。\n\n即使不认识 **[xxx]**，B的`life`和“need spurred quitting”也需要原文另写生活反思是先在动机；第2段没有。\n\n**第一轮判断：B排除。**","html":"<h3>B. their need to reflect on their <span class=\"mask\">[xxx]</span> life</h3>\n<blockquote>\n<p>他们需要反思自己的 <span class=\"mask\">[xxx]</span> 生活</p>\n</blockquote>\n<p>把B接回题干，它说的是：高管辞职可能是因为需要反思自己某一方面的生活。</p>\n<p>B抓住了<code>reflect</code>这个原词，所以很像。刚才精读时，好像McGee确实获得时间思考，但他思考的是想经营哪种公司，不是宽泛的“生活”。</p>\n<blockquote>\n<p>gave him time to reflect on what kind of company he wanted to run</p>\n</blockquote>\n<p><code>reflect</code>和“离职后有时间”都与原文对应；真正要看的是反思的对象，以及这件事在句中是动机还是离职后的结果。</p>\n<p>原文说的是：没有预先安排职位这件事给了McGee时间，去思考他想经营哪种公司。</p>\n<p>B说的却是：高管因为需要反思某种生活而辞职。</p>\n<p>原文的对象是未来想经营的公司，仍属职业选择；B把对象改成被遮挡词修饰的<code>life</code>，还把“离职带来的时间”倒写成“促使离职的需要”。可见关系已经不合。</p>\n<p><strong>“离职后有时间思考想经营哪种公司”，能不能改成“为了反思自己的某种生活而离职”？</strong></p>\n<p>不能。对象和因果先后都变了。</p>\n<p>即使不认识 <span class=\"mask\">[xxx]</span>，B的<code>life</code>和“need spurred quitting”也需要原文另写生活反思是先在动机；第2段没有。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[227,717,1321,402]],"questionRects":[[235,661,1360,455]],"scrollTarget":"article","meta":{"kind":"option","qid":"27","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"27题","raw":"### C. their strained relations with the boards\n\n> 他们与董事会关系紧张\n\n把C接回题干，它说的是：高管辞职可能是因为他们与董事会关系紧张。\n\nC里有`boards`，第2段也写了董事会。刚才精读时，好像董事会是在审视继任计划，没被点中的高管可能离开，但没有直接写双方关系恶化。\n\n> As boards **[xxx]** **[xxx]** plans in response to shareholder pressure, executives who don’t get the nod also may wish to move on.\n\nC抓住董事会这个参与者，第一眼容易把“没被选中”理解为矛盾；但原文只写继任选择和高管的职业判断。\n\n原文说的是：董事会在股东压力下处理继任安排，没得到认可的高管可能选择离开。\n\nC说的却是：高管因与董事会关系紧张而辞职。\n\n没有被选作接班人可以让人失望，却不等于关系已经紧张。原文没有争吵、冲突、信任破裂或敌对行为。\n\n**没有得到董事会的点头，是否就能直接推出双方关系紧张？**\n\n不能。职位选择结果和人际关系状态之间还缺信息。\n\n要选C，原文至少还得写高管与董事会发生冲突或关系恶化；这里没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. their strained relations with the boards</h3>\n<blockquote>\n<p>他们与董事会关系紧张</p>\n</blockquote>\n<p>把C接回题干，它说的是：高管辞职可能是因为他们与董事会关系紧张。</p>\n<p>C里有<code>boards</code>，第2段也写了董事会。刚才精读时，好像董事会是在审视继任计划，没被点中的高管可能离开，但没有直接写双方关系恶化。</p>\n<blockquote>\n<p>As boards <span class=\"mask\">[xxx]</span> <span class=\"mask\">[xxx]</span> plans in response to shareholder pressure, executives who don’t get the nod also may wish to move on.</p>\n</blockquote>\n<p>C抓住董事会这个参与者，第一眼容易把“没被选中”理解为矛盾；但原文只写继任选择和高管的职业判断。</p>\n<p>原文说的是：董事会在股东压力下处理继任安排，没得到认可的高管可能选择离开。</p>\n<p>C说的却是：高管因与董事会关系紧张而辞职。</p>\n<p>没有被选作接班人可以让人失望，却不等于关系已经紧张。原文没有争吵、冲突、信任破裂或敌对行为。</p>\n<p><strong>没有得到董事会的点头，是否就能直接推出双方关系紧张？</strong></p>\n<p>不能。职位选择结果和人际关系状态之间还缺信息。</p>\n<p>要选C，原文至少还得写高管与董事会发生冲突或关系恶化；这里没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[227,717,1321,402]],"questionRects":[[235,661,1360,455]],"scrollTarget":"article","meta":{"kind":"option","qid":"27","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"27题","raw":"### D. their pursuit of new career goals\n\n> 他们对新职业目标的追求\n\n把D接回题干，它说的是：高管辞职可能由追求新的职业目标推动。\n\nD里的`career goals`让人想到`aspirations`、经营公司和寻找CEO职位。刚才精读时，好像这些信息在同一段连续出现。\n\n> about his aspirations\n>\n> they were looking for a CEO post\n>\n> executives who don’t get the nod also may wish to move on\n\nMcGee想经营一家公司，另外两位二号高管寻找CEO职位，没被选中的人也可能另谋去处；这些都落在下一步职业目标上。\n\n原文说的是：高管主动离开现职，以便追求经营公司、担任CEO或寻找其他发展机会。\n\nD说的却是：他们为新的职业目标而辞职。\n\nD把几个例子抽成共同原因，没有把动机偷换成钱、私人生活或关系冲突；`pursuit`也与McGee原话`to pursue my goal`直接呼应。\n\n**`to pursue my goal`、`aspirations`和`looking for a CEO post`能不能共同支撑“追求新的职业目标”？**\n\n能。对象和动作都一致。\n\nD所需的职业追求在第2段被多个句子直接写出，已经形成完整支持。\n\n**第一轮判断：D保留。**","html":"<h3>D. their pursuit of new career goals</h3>\n<blockquote>\n<p>他们对新职业目标的追求</p>\n</blockquote>\n<p>把D接回题干，它说的是：高管辞职可能由追求新的职业目标推动。</p>\n<p>D里的<code>career goals</code>让人想到<code>aspirations</code>、经营公司和寻找CEO职位。刚才精读时，好像这些信息在同一段连续出现。</p>\n<blockquote>\n<p>about his aspirations</p>\n<p>they were looking for a CEO post</p>\n<p>executives who don’t get the nod also may wish to move on</p>\n</blockquote>\n<p>McGee想经营一家公司，另外两位二号高管寻找CEO职位，没被选中的人也可能另谋去处；这些都落在下一步职业目标上。</p>\n<p>原文说的是：高管主动离开现职，以便追求经营公司、担任CEO或寻找其他发展机会。</p>\n<p>D说的却是：他们为新的职业目标而辞职。</p>\n<p>D把几个例子抽成共同原因，没有把动机偷换成钱、私人生活或关系冲突；<code>pursuit</code>也与McGee原话<code>to pursue my goal</code>直接呼应。</p>\n<p><strong><code>to pursue my goal</code>、<code>aspirations</code>和<code>looking for a CEO post</code>能不能共同支撑“追求新的职业目标”？</strong></p>\n<p>能。对象和动作都一致。</p>\n<p>D所需的职业追求在第2段被多个句子直接写出，已经形成完整支持。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[227,717,1321,402]],"questionRects":[[235,661,1360,455]],"scrollTarget":"article","meta":{"kind":"option","qid":"27","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"27题","raw":"### 27题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C排除；\n- D保留；\n\n第2段反复写经营公司、志向和CEO职位，D概括为新的职业目标；A改成财务，B改了反思对象和因果，C把未获点头升级成关系紧张。\n\n> **27题选D。**","html":"<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留；</li>\n</ul>\n<p>第2段反复写经营公司、志向和CEO职位，D概括为新的职业目标；A改成财务，B改了反思对象和因果，C把未获点头升级成关系紧张。</p>\n<blockquote>\n<p><strong>27题选D。</strong></p>\n</blockquote>\n","articleRects":[[227,717,1321,402]],"questionRects":[[235,661,1360,455]],"scrollTarget":"question","meta":{"kind":"result","qid":"27"}},{"section":"28题","raw":"## 28题\n\n> The word “poached” (Line 3, Paragraph 4) most probably means ______.  \n> 第4段第3行的“poached”最可能是什么意思？\n\n题干直接给出第4段第3行的`poached`。粗读时好像这一段在讲董事会优先找仍在任的CEO，说明这是招聘语境，所以先把第4段读清。\n\n> 原文参考：\n>\n> The decision to quit a senior position to look for a better one is **[xxx]**. For years executives and **[xxx]** have **[xxx]** to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: “I can’t think of a single search I’ve done where a board has not instructed me to look at sitting CEOs first.”\n>\n> 开始精读：\n>\n> The decision / to quit a senior position / to look for a better one / is **[xxx]**. / For years / executives and **[xxx]** / have **[xxx]** to the rule / that the most attractive CEO candidates / are the ones / who must be poached. / Says Korn／Ferry senior partner Dennis Carey: / “I can’t think / of a single search / I’ve done / where a board / has not instructed me / to look at sitting CEOs first.”\n>\n> 这个决定 / 辞掉高级职位 / 去寻找更好的职位 / 是**[xxx]**的 / 多年来 / 高管和**[xxx]** / 一直**[xxx]**一条规矩 / 最有吸引力的CEO候选人 / 是那些人 / 必须被挖走的人 / Korn/Ferry的Dennis Carey说 / “我想不出 / 任何一次招聘 / 是我做过的 / 其中董事会 / 没有要求我 / 先看仍在任的CEO”\n\n现在看词义。句子说最有吸引力的CEO候选人是“必须被poached”的人，后面的猎头又说董事会要求先看`sitting CEOs`。这个词应描述主动寻找并从现职中挖人的动作。\n\n接下来按A—D逐项看。","html":"<h2>28题</h2>\n<blockquote>\n<p>The word “poached” (Line 3, Paragraph 4) most probably means ______.<br />\n第4段第3行的“poached”最可能是什么意思？</p>\n</blockquote>\n<p>题干直接给出第4段第3行的<code>poached</code>。粗读时好像这一段在讲董事会优先找仍在任的CEO，说明这是招聘语境，所以先把第4段读清。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The decision to quit a senior position to look for a better one is <span class=\"mask\">[xxx]</span>. For years executives and <span class=\"mask\">[xxx]</span> have <span class=\"mask\">[xxx]</span> to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: “I can’t think of a single search I’ve done where a board has not instructed me to look at sitting CEOs first.”</p>\n<p>开始精读：</p>\n<p>The decision / to quit a senior position / to look for a better one / is <span class=\"mask\">[xxx]</span>. / For years / executives and <span class=\"mask\">[xxx]</span> / have <span class=\"mask\">[xxx]</span> to the rule / that the most attractive CEO candidates / are the ones / who must be poached. / Says Korn／Ferry senior partner Dennis Carey: / “I can’t think / of a single search / I’ve done / where a board / has not instructed me / to look at sitting CEOs first.”</p>\n<p>这个决定 / 辞掉高级职位 / 去寻找更好的职位 / 是<span class=\"mask\">[xxx]</span>的 / 多年来 / 高管和<span class=\"mask\">[xxx]</span> / 一直<span class=\"mask\">[xxx]</span>一条规矩 / 最有吸引力的CEO候选人 / 是那些人 / 必须被挖走的人 / Korn/Ferry的Dennis Carey说 / “我想不出 / 任何一次招聘 / 是我做过的 / 其中董事会 / 没有要求我 / 先看仍在任的CEO”</p>\n</blockquote>\n<p>现在看词义。句子说最有吸引力的CEO候选人是“必须被poached”的人，后面的猎头又说董事会要求先看<code>sitting CEOs</code>。这个词应描述主动寻找并从现职中挖人的动作。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[227,1399,1321,244]],"questionRects":[[235,1121,1360,390]],"scrollTarget":"article","meta":{"kind":"question","qid":"28"}},{"section":"28题","raw":"### A. **[xxx]** of\n\n> 对……做出 **[xxx]**\n\n把A接回题干，它说的是：`poached`表示对候选人做出某种由 **[xxx]** 决定的动作。\n\nA的核心被挡住，只剩一个`of`。刚才精读时，好像上下文明确是董事会和猎头去寻找在任CEO，A的可见部分还不能说明这种招聘动作。\n\n> the most attractive CEO candidates are the ones who must be poached\n>\n> a board has ... instructed me to look at sitting CEOs first\n\nA在语法上可以作为词组答案，但决定意义的词完全不可见；`of`本身既不表示寻找，也不表示从别处挖人。\n\n原文说的是：董事会让猎头优先寻找仍在任的CEO，把他们从现职中招来。\n\nA说的却是：候选人被做了一个目前不知道的动作。\n\n不能把被挡住的词随意补成“认可”或其他意思。C用完整可见的`hunted for`直接接住后文`look at ... first`的搜寻关系。\n\n**只看见`of`、看不见核心动作时，A能不能比“寻找候选人”的上下文给出更完整的词义？**\n\n不能。可见部分没有表达招聘或搜寻。\n\n要保留A，至少得确认 **[xxx]** 组成的短语表示“物色、挖走”；当前无法确认，C已有完整上下文支持。\n\n**第一轮判断：A排除。**","html":"<h3>A. <span class=\"mask\">[xxx]</span> of</h3>\n<blockquote>\n<p>对……做出 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把A接回题干，它说的是：<code>poached</code>表示对候选人做出某种由 <span class=\"mask\">[xxx]</span> 决定的动作。</p>\n<p>A的核心被挡住，只剩一个<code>of</code>。刚才精读时，好像上下文明确是董事会和猎头去寻找在任CEO，A的可见部分还不能说明这种招聘动作。</p>\n<blockquote>\n<p>the most attractive CEO candidates are the ones who must be poached</p>\n<p>a board has ... instructed me to look at sitting CEOs first</p>\n</blockquote>\n<p>A在语法上可以作为词组答案，但决定意义的词完全不可见；<code>of</code>本身既不表示寻找，也不表示从别处挖人。</p>\n<p>原文说的是：董事会让猎头优先寻找仍在任的CEO，把他们从现职中招来。</p>\n<p>A说的却是：候选人被做了一个目前不知道的动作。</p>\n<p>不能把被挡住的词随意补成“认可”或其他意思。C用完整可见的<code>hunted for</code>直接接住后文<code>look at ... first</code>的搜寻关系。</p>\n<p><strong>只看见<code>of</code>、看不见核心动作时，A能不能比“寻找候选人”的上下文给出更完整的词义？</strong></p>\n<p>不能。可见部分没有表达招聘或搜寻。</p>\n<p>要保留A，至少得确认 <span class=\"mask\">[xxx]</span> 组成的短语表示“物色、挖走”；当前无法确认，C已有完整上下文支持。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[227,1399,1321,244]],"questionRects":[[235,1121,1360,390]],"scrollTarget":"article","meta":{"kind":"option","qid":"28","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"28题","raw":"### B. attended to\n\n> 被照料、被处理\n\n把B接回题干，它说的是：`poached`表示候选人被照料或被处理。\n\nB里的`attended to`通常强调照料或处理。刚才精读时，好像董事会是让猎头先“看在任CEO”，这个“看”是物色，不是照顾。\n\n> instructed me to look at sitting CEOs first\n\n`look at`表面上也有“注意到”的感觉，所以B可能让人犹豫；但整句处在`search`和`CEO candidates`的招聘场景。\n\n原文说的是：董事会让猎头先搜寻、考虑仍在任的CEO作为候选人。\n\nB说的却是：这些候选人被照料或处理。\n\n原文关注的是如何找到人，不是如何照顾或办理他们的事务。B没有解释为什么“最有吸引力的人必须从现职中弄来”。\n\n**招聘搜索里的`look at sitting CEOs first`能不能把`poached`解释成“照料他们”？**\n\n不能。动作目的完全不同。\n\n要选B，上下文至少应谈候选人的照顾、服务或事务处理；第4段没有。\n\n**第一轮判断：B排除。**","html":"<h3>B. attended to</h3>\n<blockquote>\n<p>被照料、被处理</p>\n</blockquote>\n<p>把B接回题干，它说的是：<code>poached</code>表示候选人被照料或被处理。</p>\n<p>B里的<code>attended to</code>通常强调照料或处理。刚才精读时，好像董事会是让猎头先“看在任CEO”，这个“看”是物色，不是照顾。</p>\n<blockquote>\n<p>instructed me to look at sitting CEOs first</p>\n</blockquote>\n<p><code>look at</code>表面上也有“注意到”的感觉，所以B可能让人犹豫；但整句处在<code>search</code>和<code>CEO candidates</code>的招聘场景。</p>\n<p>原文说的是：董事会让猎头先搜寻、考虑仍在任的CEO作为候选人。</p>\n<p>B说的却是：这些候选人被照料或处理。</p>\n<p>原文关注的是如何找到人，不是如何照顾或办理他们的事务。B没有解释为什么“最有吸引力的人必须从现职中弄来”。</p>\n<p><strong>招聘搜索里的<code>look at sitting CEOs first</code>能不能把<code>poached</code>解释成“照料他们”？</strong></p>\n<p>不能。动作目的完全不同。</p>\n<p>要选B，上下文至少应谈候选人的照顾、服务或事务处理；第4段没有。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[227,1399,1321,244]],"questionRects":[[235,1121,1360,390]],"scrollTarget":"article","meta":{"kind":"option","qid":"28","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"28题","raw":"### C. hunted for\n\n> 被搜寻、被物色\n\n把C接回题干，它说的是：`poached`表示那些候选人需要被主动搜寻和物色。\n\nC里的`hunted for`与招聘中的`search`最贴近。刚才精读时，好像下一句直接出现`a single search`和`look at sitting CEOs first`。\n\n> the most attractive CEO candidates are the ones who must be poached\n>\n> I can’t think of a single search ... where a board has not instructed me to look at sitting CEOs first\n\n前句说候选人必须被`poached`，后句立刻用招聘搜索解释：董事会总让猎头先找仍在任的CEO。C正好把这个动作概括成主动物色。\n\n原文说的是：最抢手的人不是等着来投简历，而是要由董事会和猎头去寻找并从现职中挖来。\n\nC说的却是：这些人需要被搜寻。\n\n`hunted for`不一定涵盖“从竞争者那里挖走”的全部色彩，但在四个选项中，它完整保留了主动寻找候选人的核心动作，和上下文最合。\n\n**后文的`search`和优先找在任CEO，能不能把`poached`确定为“主动物色”？**\n\n能。招聘语境和紧邻解释都指向搜寻。\n\nC同时符合被动语法、候选人对象和招聘搜索场景，已经足够确定。\n\n**第一轮判断：C保留。**","html":"<h3>C. hunted for</h3>\n<blockquote>\n<p>被搜寻、被物色</p>\n</blockquote>\n<p>把C接回题干，它说的是：<code>poached</code>表示那些候选人需要被主动搜寻和物色。</p>\n<p>C里的<code>hunted for</code>与招聘中的<code>search</code>最贴近。刚才精读时，好像下一句直接出现<code>a single search</code>和<code>look at sitting CEOs first</code>。</p>\n<blockquote>\n<p>the most attractive CEO candidates are the ones who must be poached</p>\n<p>I can’t think of a single search ... where a board has not instructed me to look at sitting CEOs first</p>\n</blockquote>\n<p>前句说候选人必须被<code>poached</code>，后句立刻用招聘搜索解释：董事会总让猎头先找仍在任的CEO。C正好把这个动作概括成主动物色。</p>\n<p>原文说的是：最抢手的人不是等着来投简历，而是要由董事会和猎头去寻找并从现职中挖来。</p>\n<p>C说的却是：这些人需要被搜寻。</p>\n<p><code>hunted for</code>不一定涵盖“从竞争者那里挖走”的全部色彩，但在四个选项中，它完整保留了主动寻找候选人的核心动作，和上下文最合。</p>\n<p><strong>后文的<code>search</code>和优先找在任CEO，能不能把<code>poached</code>确定为“主动物色”？</strong></p>\n<p>能。招聘语境和紧邻解释都指向搜寻。</p>\n<p>C同时符合被动语法、候选人对象和招聘搜索场景，已经足够确定。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[227,1399,1321,244]],"questionRects":[[235,1121,1360,390]],"scrollTarget":"article","meta":{"kind":"option","qid":"28","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"28题","raw":"### D. guarded against\n\n> 被防范\n\n把D接回题干，它说的是：`poached`表示这些候选人需要被防范。\n\nD里的`guarded against`带有防止、戒备的方向。刚才精读时，好像董事会反而主动要求先找这些在任CEO，并不是躲开他们。\n\n> a board has not instructed me to look at sitting CEOs first\n\nD也能接被动结构，但语义方向与上下文相反：最有吸引力的候选人是被优先寻找的对象，不是被防范的风险。\n\n原文说的是：董事会主动接近并寻找在任CEO。\n\nD说的却是：董事会防备这些CEO。\n\n若要“防范”，后文应出现避免、保护自己不受其影响或不让他们进入；实际是把他们排在搜索首位。\n\n**被董事会优先寻找的人，能不能同时被解释为董事会要防范的人？**\n\n不能。接近和回避的方向相反。\n\n要选D，原文至少还得写这些候选人构成威胁；第4段没有。\n\n**第一轮判断：D排除。**","html":"<h3>D. guarded against</h3>\n<blockquote>\n<p>被防范</p>\n</blockquote>\n<p>把D接回题干，它说的是：<code>poached</code>表示这些候选人需要被防范。</p>\n<p>D里的<code>guarded against</code>带有防止、戒备的方向。刚才精读时，好像董事会反而主动要求先找这些在任CEO，并不是躲开他们。</p>\n<blockquote>\n<p>a board has not instructed me to look at sitting CEOs first</p>\n</blockquote>\n<p>D也能接被动结构，但语义方向与上下文相反：最有吸引力的候选人是被优先寻找的对象，不是被防范的风险。</p>\n<p>原文说的是：董事会主动接近并寻找在任CEO。</p>\n<p>D说的却是：董事会防备这些CEO。</p>\n<p>若要“防范”，后文应出现避免、保护自己不受其影响或不让他们进入；实际是把他们排在搜索首位。</p>\n<p><strong>被董事会优先寻找的人，能不能同时被解释为董事会要防范的人？</strong></p>\n<p>不能。接近和回避的方向相反。</p>\n<p>要选D，原文至少还得写这些候选人构成威胁；第4段没有。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[227,1399,1321,244]],"questionRects":[[235,1121,1360,390]],"scrollTarget":"article","meta":{"kind":"option","qid":"28","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"28题","raw":"### 28题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D排除；\n\n`poached`后面紧跟招聘搜索和优先看在任CEO的解释，C的“被搜寻、被物色”最合；B、D动作不对，A核心不可见且无可见招聘意义。\n\n> **28题选C。**","html":"<h3>28题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除；</li>\n</ul>\n<p><code>poached</code>后面紧跟招聘搜索和优先看在任CEO的解释，C的“被搜寻、被物色”最合；B、D动作不对，A核心不可见且无可见招聘意义。</p>\n<blockquote>\n<p><strong>28题选C。</strong></p>\n</blockquote>\n","articleRects":[[227,1399,1321,244]],"questionRects":[[235,1121,1360,390]],"scrollTarget":"question","meta":{"kind":"result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> It can be inferred from the last paragraph that ______.  \n> 从最后一段可以推断出什么？\n\n题干锁定最后一段并要求推断。粗读时好像记得这里说旧日羞耻在消退、传统规矩被倒转、留下太久的人反而受伤最重，所以把最后一段读清。\n\n> 原文参考：\n>\n> Many **[xxx]** say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. “The traditional rule was it’s safer to stay where you are, but that’s been **[xxx]** inverted,” says one headhunter. “The people who’ve been hurt the worst are those who’ve stayed too long.”\n>\n> 开始精读：\n>\n> Many **[xxx]** say / the old disgrace is fading / for top performers. / The financial crisis / has made it more acceptable / to be between jobs / or to leave a bad one. / “The traditional rule / was it’s safer / to stay where you are, / but that’s been **[xxx]** inverted,” / says one headhunter. / “The people / who’ve been hurt the worst / are those / who’ve stayed too long.”\n>\n> 许多**[xxx]**说 / 过去那种羞耻正在消退 / 对表现最好的人而言 / 金融危机 / 让这件事更容易被接受 / 处于两份工作之间 / 或者离开一份糟糕的工作 / “传统规矩 / 过去认为更安全 / 是留在原位 / 但它已经被**[xxx]**颠倒” / 一位猎头说 / “那些人 / 受伤最重的 / 恰恰是 / 留下太久的人”\n\n现在回到题干。直接信息是：过去的规矩认为留在原位更安全；现在这种规矩被颠倒，留得太久的人反而受伤。推断要从“过去认为更安全”推出过去高管通常怎样做，不能把现在的结论倒回去。\n\n接下来按A—D逐项看。","html":"<h2>29题</h2>\n<blockquote>\n<p>It can be inferred from the last paragraph that ______.<br />\n从最后一段可以推断出什么？</p>\n</blockquote>\n<p>题干锁定最后一段并要求推断。粗读时好像记得这里说旧日羞耻在消退、传统规矩被倒转、留下太久的人反而受伤最重，所以把最后一段读清。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Many <span class=\"mask\">[xxx]</span> say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. “The traditional rule was it’s safer to stay where you are, but that’s been <span class=\"mask\">[xxx]</span> inverted,” says one headhunter. “The people who’ve been hurt the worst are those who’ve stayed too long.”</p>\n<p>开始精读：</p>\n<p>Many <span class=\"mask\">[xxx]</span> say / the old disgrace is fading / for top performers. / The financial crisis / has made it more acceptable / to be between jobs / or to leave a bad one. / “The traditional rule / was it’s safer / to stay where you are, / but that’s been <span class=\"mask\">[xxx]</span> inverted,” / says one headhunter. / “The people / who’ve been hurt the worst / are those / who’ve stayed too long.”</p>\n<p>许多<span class=\"mask\">[xxx]</span>说 / 过去那种羞耻正在消退 / 对表现最好的人而言 / 金融危机 / 让这件事更容易被接受 / 处于两份工作之间 / 或者离开一份糟糕的工作 / “传统规矩 / 过去认为更安全 / 是留在原位 / 但它已经被<span class=\"mask\">[xxx]</span>颠倒” / 一位猎头说 / “那些人 / 受伤最重的 / 恰恰是 / 留下太久的人”</p>\n</blockquote>\n<p>现在回到题干。直接信息是：过去的规矩认为留在原位更安全；现在这种规矩被颠倒，留得太久的人反而受伤。推断要从“过去认为更安全”推出过去高管通常怎样做，不能把现在的结论倒回去。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[228,1975,1320,245]],"questionRects":[[235,1516,1360,389]],"scrollTarget":"article","meta":{"kind":"question","qid":"29"}},{"section":"29题","raw":"### A. top performers used to cling to their posts\n\n> 顶尖人才过去常常守着自己的职位不走\n\n把A接回题干，它说的是：最后一段说明顶尖人才过去往往留在原岗位。\n\nA里的`used to`和`cling to their posts`要对过去的旧规矩。刚才精读时，好像原文正说过去认为“留在原位更安全”。\n\n> The traditional rule was it’s safer to stay where you are\n>\n> The people who’ve been hurt the worst are those who’ve stayed too long.\n\n原文没有逐字写“cling”，但它先交代过去的安全规则，再指出有人“stayed too long”；两句共同描出过去倾向于守住岗位。\n\n原文说的是：旧规则鼓励人留在现职，结果有些人留得过久。\n\nA说的却是：顶尖人才过去常常抓住岗位不放。\n\n这是从规则到行为的合理推断：若过去普遍认为留下更安全，表现好的人就更可能不主动离开；`used to`也准确限定在旧规则时期。\n\n**过去把“留在原位”当作更安全，又有人因此留得太久，能不能推到“过去常守着岗位”？**\n\n能。行为倾向正由旧规则和其后果共同支持。\n\nA没有把“所有人”说死，只概括过去的普遍倾向，符合推断力度。\n\n**第一轮判断：A保留。**","html":"<h3>A. top performers used to cling to their posts</h3>\n<blockquote>\n<p>顶尖人才过去常常守着自己的职位不走</p>\n</blockquote>\n<p>把A接回题干，它说的是：最后一段说明顶尖人才过去往往留在原岗位。</p>\n<p>A里的<code>used to</code>和<code>cling to their posts</code>要对过去的旧规矩。刚才精读时，好像原文正说过去认为“留在原位更安全”。</p>\n<blockquote>\n<p>The traditional rule was it’s safer to stay where you are</p>\n<p>The people who’ve been hurt the worst are those who’ve stayed too long.</p>\n</blockquote>\n<p>原文没有逐字写“cling”，但它先交代过去的安全规则，再指出有人“stayed too long”；两句共同描出过去倾向于守住岗位。</p>\n<p>原文说的是：旧规则鼓励人留在现职，结果有些人留得过久。</p>\n<p>A说的却是：顶尖人才过去常常抓住岗位不放。</p>\n<p>这是从规则到行为的合理推断：若过去普遍认为留下更安全，表现好的人就更可能不主动离开；<code>used to</code>也准确限定在旧规则时期。</p>\n<p><strong>过去把“留在原位”当作更安全，又有人因此留得太久，能不能推到“过去常守着岗位”？</strong></p>\n<p>能。行为倾向正由旧规则和其后果共同支持。</p>\n<p>A没有把“所有人”说死，只概括过去的普遍倾向，符合推断力度。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[228,1975,1320,245]],"questionRects":[[235,1516,1360,389]],"scrollTarget":"article","meta":{"kind":"option","qid":"29","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P6"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"29题","raw":"### B. loyalty of top performers is getting **[xxx]**\n\n> 顶尖人才的忠诚正在变得 **[xxx]**\n\n把B接回题干，它说的是：最后一段说明顶尖人才的忠诚正在发生某种被遮挡的变化。\n\nB的核心变化词被挡住，但可见主体是`loyalty`。刚才精读时，好像原文谈的是空档期的羞耻、职业规矩和留下多久，没有评价忠诚这种品格。\n\n> the old disgrace is fading for top performers\n>\n> The traditional rule ... has been **[xxx]** inverted\n\nB可能把“离开岗位更能被接受”联想到忠诚观变化，但原文直接变化的是社会污名和“留下更安全”的规则。\n\n原文说的是：顶尖人才处于工作空档不再那么丢脸，传统职业安全规则被倒转。\n\nB说的却是：顶尖人才对雇主的忠诚本身正在变成某种状态。\n\n一个人离职不必然等于不忠诚；文章也没有讨论忠诚是否过时、下降或被重新评价。即使不认识 **[xxx]**，主体已经换了。\n\n**“离职空档更能被接受”能不能直接改写成“顶尖人才的忠诚正在变化”？**\n\n不能。社会规则变化和个人忠诚变化不是同一关系。\n\n要保留B，原文至少还得直接讨论`loyalty`或雇主承诺；最后一段没有。\n\n**第一轮判断：B排除。**","html":"<h3>B. loyalty of top performers is getting <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>顶尖人才的忠诚正在变得 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把B接回题干，它说的是：最后一段说明顶尖人才的忠诚正在发生某种被遮挡的变化。</p>\n<p>B的核心变化词被挡住，但可见主体是<code>loyalty</code>。刚才精读时，好像原文谈的是空档期的羞耻、职业规矩和留下多久，没有评价忠诚这种品格。</p>\n<blockquote>\n<p>the old disgrace is fading for top performers</p>\n<p>The traditional rule ... has been <span class=\"mask\">[xxx]</span> inverted</p>\n</blockquote>\n<p>B可能把“离开岗位更能被接受”联想到忠诚观变化，但原文直接变化的是社会污名和“留下更安全”的规则。</p>\n<p>原文说的是：顶尖人才处于工作空档不再那么丢脸，传统职业安全规则被倒转。</p>\n<p>B说的却是：顶尖人才对雇主的忠诚本身正在变成某种状态。</p>\n<p>一个人离职不必然等于不忠诚；文章也没有讨论忠诚是否过时、下降或被重新评价。即使不认识 <span class=\"mask\">[xxx]</span>，主体已经换了。</p>\n<p><strong>“离职空档更能被接受”能不能直接改写成“顶尖人才的忠诚正在变化”？</strong></p>\n<p>不能。社会规则变化和个人忠诚变化不是同一关系。</p>\n<p>要保留B，原文至少还得直接讨论<code>loyalty</code>或雇主承诺；最后一段没有。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[228,1975,1320,245]],"questionRects":[[235,1516,1360,389]],"scrollTarget":"article","meta":{"kind":"option","qid":"29","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P6"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"29题","raw":"### C. top performers care more about reputations\n\n> 顶尖人才更在意声誉\n\n把C接回题干，它说的是：最后一段说明顶尖人才比以前更在意自己的声誉。\n\nC里的`reputations`在第2段出现过，所以看着眼熟。刚才精读最后一段时，好像没有这个词，只说旧日羞耻和职业安全。\n\n> the old disgrace is fading for top performers\n>\n> The people who’ve been hurt the worst are those who’ve stayed too long.\n\n“羞耻”确实和社会评价有关，但最后一段说的是这种负面评价在减弱，不是顶尖人才更重视声誉。\n\n原文说的是：离职空档带来的污名正在减少，留得过久反而可能受损。\n\nC说的却是：顶尖人才对声誉的在意程度提高。\n\n原文没有过去与现在的心理程度比较，也没有说他们因为更爱惜名声才离职。C把外部评价变化改成内部关心变化。\n\n**社会对空档期的羞耻感在消退，是否说明个人比以前更在意声誉？**\n\n不等于。外部污名变弱甚至与“更在意”没有同一方向。\n\n要选C，至少还得写顶尖人才怎样权衡名声、比过去更担心评价；最后一段没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. top performers care more about reputations</h3>\n<blockquote>\n<p>顶尖人才更在意声誉</p>\n</blockquote>\n<p>把C接回题干，它说的是：最后一段说明顶尖人才比以前更在意自己的声誉。</p>\n<p>C里的<code>reputations</code>在第2段出现过，所以看着眼熟。刚才精读最后一段时，好像没有这个词，只说旧日羞耻和职业安全。</p>\n<blockquote>\n<p>the old disgrace is fading for top performers</p>\n<p>The people who’ve been hurt the worst are those who’ve stayed too long.</p>\n</blockquote>\n<p>“羞耻”确实和社会评价有关，但最后一段说的是这种负面评价在减弱，不是顶尖人才更重视声誉。</p>\n<p>原文说的是：离职空档带来的污名正在减少，留得过久反而可能受损。</p>\n<p>C说的却是：顶尖人才对声誉的在意程度提高。</p>\n<p>原文没有过去与现在的心理程度比较，也没有说他们因为更爱惜名声才离职。C把外部评价变化改成内部关心变化。</p>\n<p><strong>社会对空档期的羞耻感在消退，是否说明个人比以前更在意声誉？</strong></p>\n<p>不等于。外部污名变弱甚至与“更在意”没有同一方向。</p>\n<p>要选C，至少还得写顶尖人才怎样权衡名声、比过去更担心评价；最后一段没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[228,1975,1320,245]],"questionRects":[[235,1516,1360,389]],"scrollTarget":"article","meta":{"kind":"option","qid":"29","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P6"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"29题","raw":"### D. it’s safer to stick to the traditional rules\n\n> 遵守传统规矩更安全\n\n把D接回题干，它说的是：最后一段说明继续遵守传统规矩更安全。\n\nD几乎复现了`traditional rule`和`safer`，很容易顺手选。刚才精读时，好像原文在这句话后面立刻用`but`说规矩已经被颠倒。\n\n> The traditional rule was it’s safer to stay where you are, but that’s been **[xxx]** inverted.\n>\n> The people who’ve been hurt the worst are those who’ve stayed too long.\n\nD确实抄到旧规则的表面内容；但`was`把它放在过去，`but`和`inverted`则明确说现在已经反过来。\n\n原文说的是：过去认为留下更安全，现在这一规则被颠倒，留太久反而伤得最重。\n\nD说的却是：现在继续按传统规则做仍更安全。\n\nD删掉时间变化和转折，只保留作者正在否定的旧结论。题干问从最后一段推断，不能停在`but`以前。\n\n**原文说旧规则已经被倒转，能不能只截取旧规则并把它当成作者现在的结论？**\n\n不能。转折后的信息正好推翻了它。\n\n要选D，原文应在结尾重新肯定留下更安全；实际结尾说留太久的人受伤最重。\n\n**第一轮判断：D排除。**","html":"<h3>D. it’s safer to stick to the traditional rules</h3>\n<blockquote>\n<p>遵守传统规矩更安全</p>\n</blockquote>\n<p>把D接回题干，它说的是：最后一段说明继续遵守传统规矩更安全。</p>\n<p>D几乎复现了<code>traditional rule</code>和<code>safer</code>，很容易顺手选。刚才精读时，好像原文在这句话后面立刻用<code>but</code>说规矩已经被颠倒。</p>\n<blockquote>\n<p>The traditional rule was it’s safer to stay where you are, but that’s been <span class=\"mask\">[xxx]</span> inverted.</p>\n<p>The people who’ve been hurt the worst are those who’ve stayed too long.</p>\n</blockquote>\n<p>D确实抄到旧规则的表面内容；但<code>was</code>把它放在过去，<code>but</code>和<code>inverted</code>则明确说现在已经反过来。</p>\n<p>原文说的是：过去认为留下更安全，现在这一规则被颠倒，留太久反而伤得最重。</p>\n<p>D说的却是：现在继续按传统规则做仍更安全。</p>\n<p>D删掉时间变化和转折，只保留作者正在否定的旧结论。题干问从最后一段推断，不能停在<code>but</code>以前。</p>\n<p><strong>原文说旧规则已经被倒转，能不能只截取旧规则并把它当成作者现在的结论？</strong></p>\n<p>不能。转折后的信息正好推翻了它。</p>\n<p>要选D，原文应在结尾重新肯定留下更安全；实际结尾说留太久的人受伤最重。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[228,1975,1320,245]],"questionRects":[[235,1516,1360,389]],"scrollTarget":"article","meta":{"kind":"option","qid":"29","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P6"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"29题","raw":"### 29题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C排除；\n- D排除；\n\n旧规则把留任写成更安全，又有人留得过久，A合理概括过去的行为倾向；B换成忠诚，C换成更在意声誉，D停在已被转折推翻的旧结论。\n\n> **29题选A。**","html":"<h3>29题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除；</li>\n</ul>\n<p>旧规则把留任写成更安全，又有人留得过久，A合理概括过去的行为倾向；B换成忠诚，C换成更在意声誉，D停在已被转折推翻的旧结论。</p>\n<blockquote>\n<p><strong>29题选A。</strong></p>\n</blockquote>\n","articleRects":[[228,1975,1320,245]],"questionRects":[[235,1516,1360,389]],"scrollTarget":"question","meta":{"kind":"result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n**Which of the following is the best title for the text?**\n\n下面哪个标题最适合本文？\n\n这是全文作者观点／全文主旨题。\n\n这类题先别急着数哪个词出现得最多，也别只凭一个局部句子下结论。更稳的办法是把每个选项当成作者真正想表达的中心或态度，看看全文按它应该怎么展开，再和文章实际写法对照。\n\n选项：\n\nA. **CEOs: Where to Go?**\n\nCEO们该去哪里？\n\nB. **CEOs: All the Way Up?**\n\nCEO之路：一路向上？\n\nC. **Top Managers Jump without a Net**\n\n高管不先找好下家就跳槽\n\nD. **The Only Way Out for Top Performers**\n\n顶尖人才唯一的出路\n\n---","html":"<h2>30题</h2>\n<p><strong>Which of the following is the best title for the text?</strong></p>\n<p>下面哪个标题最适合本文？</p>\n<p>这是全文作者观点／全文主旨题。</p>\n<p>这类题先别急着数哪个词出现得最多，也别只凭一个局部句子下结论。更稳的办法是把每个选项当成作者真正想表达的中心或态度，看看全文按它应该怎么展开，再和文章实际写法对照。</p>\n<p>选项：</p>\n<p>A. <strong>CEOs: Where to Go?</strong></p>\n<p>CEO们该去哪里？</p>\n<p>B. <strong>CEOs: All the Way Up?</strong></p>\n<p>CEO之路：一路向上？</p>\n<p>C. <strong>Top Managers Jump without a Net</strong></p>\n<p>高管不先找好下家就跳槽</p>\n<p>D. <strong>The Only Way Out for Top Performers</strong></p>\n<p>顶尖人才唯一的出路</p>\n<hr />\n","articleRects":[[227,351,1323,349],[227,717,1321,402],[228,1137,1320,245],[227,1399,1321,244],[227,1661,1321,297],[228,1975,1320,245]],"questionRects":[[235,1910,1360,330]],"scrollTarget":"articleTop","meta":{"kind":"main_overview","qid":"30"}},{"section":"30题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 用McGee公开裸辞、没有先安排下家求CEO职位开场 | 先摆出一个人采取的新做法 |\n| 第2段 | 说明这不是个例，其他高管也会为新的职业目标离开 | 再说这种做法并非个例 |\n| 第3段 | 说经济复苏会让更多副手愿意在没下家的情况下跳出去 | 接着说明时机正在变化 |\n| 第4段 | 回看旧规矩：最抢手的候选人过去通常是仍在任的人 | 回头解释原来为什么会这样 |\n| 第5段 | 举两个例子说明裸辞后未必很快做到高位 | 再举一个例子说明并不轻松 |\n| 第6段 | 结尾说空档期的羞耻在消退，留下更安全的旧规矩已倒转 | 最后说旧规矩已经倒过来 |\n\n---\n\n**Which of the following is the best title for the text?**","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>用McGee公开裸辞、没有先安排下家求CEO职位开场</td>\n  <td>先摆出一个人采取的新做法</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>说明这不是个例，其他高管也会为新的职业目标离开</td>\n  <td>再说这种做法并非个例</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>说经济复苏会让更多副手愿意在没下家的情况下跳出去</td>\n  <td>接着说明时机正在变化</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>回看旧规矩：最抢手的候选人过去通常是仍在任的人</td>\n  <td>回头解释原来为什么会这样</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>举两个例子说明裸辞后未必很快做到高位</td>\n  <td>再举一个例子说明并不轻松</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>结尾说空档期的羞耻在消退，留下更安全的旧规矩已倒转</td>\n  <td>最后说旧规矩已经倒过来</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<p><strong>Which of the following is the best title for the text?</strong></p>\n","articleRects":[[227,351,1323,349],[227,717,1321,402],[228,1137,1320,245],[227,1399,1321,244],[227,1661,1321,297],[228,1975,1320,245]],"questionRects":[[235,1910,1360,330]],"scrollTarget":"articleTop","meta":{"kind":"main_method","qid":"30","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"30题","raw":"### A. CEOs: Where to Go?\n\n> CEO们该去哪里？\n\n#### 如果 A 是主旨，全文应该怎么写？\n\n如果A是标题，全文应围绕CEO离职后“去哪里”展开，比较公司、行业或岗位去向，并给出选择答案。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先提出CEO离开后面临多个去向 | 先摆出一个人采取的新做法 |\n| 第2段 | 再比较不同公司或行业选择 | 再说这种做法并非个例 |\n| 第3段 | 接着说明哪类去向机会更多 | 接着说明时机正在变化 |\n| 第4段 | 回头解释过去的人通常选择哪里 | 回头解释原来为什么会这样 |\n| 第5段 | 再举一个例子展示不同去向结果 | 再举一个例子说明并不轻松 |\n| 第6段 | 最后给出CEO该去哪里的建议 | 最后说旧规矩已经倒过来 |\n\n**文章是在比较CEO离职后应该去哪一家，还是在反复写“没下家就先走”这种做法本身？**\n\n不能。文章提到McGee后来去了哪里，也提到两个案例最终得到什么职位，但这些地点只是例子。全文真正反复写的是“先辞再找”这种动作如何挑战旧规矩，而不是比较CEO应该去哪家公司。\n\n**判断：A排除。**","html":"<h3>A. CEOs: Where to Go?</h3>\n<blockquote>\n<p>CEO们该去哪里？</p>\n</blockquote>\n<h4>如果 A 是主旨，全文应该怎么写？</h4>\n<p>如果A是标题，全文应围绕CEO离职后“去哪里”展开，比较公司、行业或岗位去向，并给出选择答案。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先提出CEO离开后面临多个去向</td>\n  <td>先摆出一个人采取的新做法</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再比较不同公司或行业选择</td>\n  <td>再说这种做法并非个例</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着说明哪类去向机会更多</td>\n  <td>接着说明时机正在变化</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>回头解释过去的人通常选择哪里</td>\n  <td>回头解释原来为什么会这样</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>再举一个例子展示不同去向结果</td>\n  <td>再举一个例子说明并不轻松</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>最后给出CEO该去哪里的建议</td>\n  <td>最后说旧规矩已经倒过来</td>\n</tr>\n</tbody>\n</table>\n<p><strong>文章是在比较CEO离职后应该去哪一家，还是在反复写“没下家就先走”这种做法本身？</strong></p>\n<p>不能。文章提到McGee后来去了哪里，也提到两个案例最终得到什么职位，但这些地点只是例子。全文真正反复写的是“先辞再找”这种动作如何挑战旧规矩，而不是比较CEO应该去哪家公司。</p>\n<p><strong>判断：A排除。</strong></p>\n","articleRects":[[227,351,1323,349],[227,717,1321,402],[228,1137,1320,245],[227,1399,1321,244],[227,1661,1321,297],[228,1975,1320,245]],"questionRects":[[235,1910,1360,330]],"scrollTarget":"articleTop","meta":{"kind":"main_option","qid":"30","option":"A"}},{"section":"30题","raw":"### B. CEOs: All the Way Up?\n\n> CEO之路：一路向上？\n\n#### 如果 B 是主旨，全文应该怎么写？\n\n如果B是标题，全文应围绕高管是否能一路晋升到CEO展开，重点是晋升路径和上升结果。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先提出高管怎样一路晋升到CEO | 先摆出一个人采取的新做法 |\n| 第2段 | 再说明哪些经历有利于向上走 | 再说这种做法并非个例 |\n| 第3段 | 接着写晋升机会怎样增加 | 接着说明时机正在变化 |\n| 第4段 | 回头解释旧晋升路径是什么 | 回头解释原来为什么会这样 |\n| 第5段 | 再举一个例子说明有人升得快或慢 | 再举一个例子说明并不轻松 |\n| 第6段 | 最后判断能否一路升到最高位 | 最后说旧规矩已经倒过来 |\n\n**若中心是一路晋升，为什么文章要花大量篇幅写空档期、旧招聘规矩和“没有安全网”？**\n\n不能。文中几个人确实想当CEO，可第3、4、6段的重心是有没有先找好下家、董事会过去偏爱在任者以及规则是否倒转。标题若只写“一路向上”，无法解释空档期和跳槽方式为何占据全文。\n\n**判断：B排除。**","html":"<h3>B. CEOs: All the Way Up?</h3>\n<blockquote>\n<p>CEO之路：一路向上？</p>\n</blockquote>\n<h4>如果 B 是主旨，全文应该怎么写？</h4>\n<p>如果B是标题，全文应围绕高管是否能一路晋升到CEO展开，重点是晋升路径和上升结果。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先提出高管怎样一路晋升到CEO</td>\n  <td>先摆出一个人采取的新做法</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再说明哪些经历有利于向上走</td>\n  <td>再说这种做法并非个例</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着写晋升机会怎样增加</td>\n  <td>接着说明时机正在变化</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>回头解释旧晋升路径是什么</td>\n  <td>回头解释原来为什么会这样</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>再举一个例子说明有人升得快或慢</td>\n  <td>再举一个例子说明并不轻松</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>最后判断能否一路升到最高位</td>\n  <td>最后说旧规矩已经倒过来</td>\n</tr>\n</tbody>\n</table>\n<p><strong>若中心是一路晋升，为什么文章要花大量篇幅写空档期、旧招聘规矩和“没有安全网”？</strong></p>\n<p>不能。文中几个人确实想当CEO，可第3、4、6段的重心是有没有先找好下家、董事会过去偏爱在任者以及规则是否倒转。标题若只写“一路向上”，无法解释空档期和跳槽方式为何占据全文。</p>\n<p><strong>判断：B排除。</strong></p>\n","articleRects":[[227,351,1323,349],[227,717,1321,402],[228,1137,1320,245],[227,1399,1321,244],[227,1661,1321,297],[228,1975,1320,245]],"questionRects":[[235,1910,1360,330]],"scrollTarget":"articleTop","meta":{"kind":"main_option","qid":"30","option":"B"}},{"section":"30题","raw":"### C. Top Managers Jump without a Net\n\n> 高管不先找好下家就跳槽\n\n#### 如果 C 是主旨，全文应该怎么写？\n\n如果C是标题，全文应围绕高管在没有预先安排下家的情况下离职：先写个案，再写扩散、旧规矩、风险和新接受度。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写一个高管没有下家就主动离开 | 先摆出一个人采取的新做法 |\n| 第2段 | 再说其他人也为新目标这样做 | 再说这种做法并非个例 |\n| 第3段 | 接着说明环境变化会让更多人尝试 | 接着说明时机正在变化 |\n| 第4段 | 回头写过去更偏爱仍在任的人 | 回头解释原来为什么会这样 |\n| 第5段 | 再举一个例子说明这样做有风险 | 再举一个例子说明并不轻松 |\n| 第6段 | 最后说这种做法现在更能被接受 | 最后说旧规矩已经倒过来 |\n\n**从McGee开场到最后旧规矩倒转，是否都能被“高管没下家就跳”这一条线串起来？**\n\n能。实际结构完全对应：McGee没有下家就走；其他二号高管也这样追求CEO职位；复苏会增加机会；旧规则偏爱在任者；案例说明这样做不轻松；结尾说旧规则正在倒转。\n\n**判断：C保留。**","html":"<h3>C. Top Managers Jump without a Net</h3>\n<blockquote>\n<p>高管不先找好下家就跳槽</p>\n</blockquote>\n<h4>如果 C 是主旨，全文应该怎么写？</h4>\n<p>如果C是标题，全文应围绕高管在没有预先安排下家的情况下离职：先写个案，再写扩散、旧规矩、风险和新接受度。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先写一个高管没有下家就主动离开</td>\n  <td>先摆出一个人采取的新做法</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再说其他人也为新目标这样做</td>\n  <td>再说这种做法并非个例</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着说明环境变化会让更多人尝试</td>\n  <td>接着说明时机正在变化</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>回头写过去更偏爱仍在任的人</td>\n  <td>回头解释原来为什么会这样</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>再举一个例子说明这样做有风险</td>\n  <td>再举一个例子说明并不轻松</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>最后说这种做法现在更能被接受</td>\n  <td>最后说旧规矩已经倒过来</td>\n</tr>\n</tbody>\n</table>\n<p><strong>从McGee开场到最后旧规矩倒转，是否都能被“高管没下家就跳”这一条线串起来？</strong></p>\n<p>能。实际结构完全对应：McGee没有下家就走；其他二号高管也这样追求CEO职位；复苏会增加机会；旧规则偏爱在任者；案例说明这样做不轻松；结尾说旧规则正在倒转。</p>\n<p><strong>判断：C保留。</strong></p>\n","articleRects":[[227,351,1323,349],[227,717,1321,402],[228,1137,1320,245],[227,1399,1321,244],[227,1661,1321,297],[228,1975,1320,245]],"questionRects":[[235,1910,1360,330]],"scrollTarget":"articleTop","meta":{"kind":"main_option","qid":"30","option":"C"}},{"section":"30题","raw":"### D. The Only Way Out for Top Performers\n\n> 顶尖人才唯一的出路\n\n#### 如果 D 是主旨，全文应该怎么写？\n\n如果D是标题，文章应把离职写成顶尖人才唯一可行的出口，明确排除留下、内部晋升或其他方式。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先说顶尖人才只有辞职一条路 | 先摆出一个人采取的新做法 |\n| 第2段 | 再证明其他选择都已经失效 | 再说这种做法并非个例 |\n| 第3段 | 接着说明所有人都会被迫离开 | 接着说明时机正在变化 |\n| 第4段 | 回头解释过去为什么没有别的办法 | 回头解释原来为什么会这样 |\n| 第5段 | 再举一个例子证明不辞职就无法发展 | 再举一个例子说明并不轻松 |\n| 第6段 | 最后把辞职定成唯一出路 | 最后说旧规矩已经倒过来 |\n\n**原文只说这种选择越来越可接受，能不能扩大成顶尖人才唯一的出路？**\n\n不能。全文只说这种做法“不合常规”、可能增多并变得更可接受，没有说它是唯一办法。`may wish to move on`、`may be more willing`都保留选择空间，D的`Only`过头。\n\n**判断：D排除。**","html":"<h3>D. The Only Way Out for Top Performers</h3>\n<blockquote>\n<p>顶尖人才唯一的出路</p>\n</blockquote>\n<h4>如果 D 是主旨，全文应该怎么写？</h4>\n<p>如果D是标题，文章应把离职写成顶尖人才唯一可行的出口，明确排除留下、内部晋升或其他方式。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先说顶尖人才只有辞职一条路</td>\n  <td>先摆出一个人采取的新做法</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再证明其他选择都已经失效</td>\n  <td>再说这种做法并非个例</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着说明所有人都会被迫离开</td>\n  <td>接着说明时机正在变化</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>回头解释过去为什么
