<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"questionTop","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**Consumers may create “earned” media when they are ______.**\n\n> 消费者在什么情况下可能创造“赢得媒体”？\n\n题型：**具体细节题**。\n\n---","html":"<h2>31题题干</h2>\n<p><strong>Consumers may create “earned” media when they are ______.</strong></p>\n<blockquote>\n<p>消费者在什么情况下可能创造“赢得媒体”？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,200,1360,418]],"scrollTarget":"question","meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**According to Paragraph 2, sold media feature ______.**\n\n> 根据第2段，售出媒体具有什么特点？\n\n题型：**具体细节题**。\n\n---","html":"<h2>32题题干</h2>\n<p><strong>According to Paragraph 2, sold media feature ______.</strong></p>\n<blockquote>\n<p>根据第2段，售出媒体具有什么特点？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,623,1360,418]],"scrollTarget":"question","meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**The author indicates in Paragraph 3 that earned media ______.**\n\n> 作者在第3段说明，赢得媒体可能怎样？\n\n题型：**段落关系理解题**。\n\n---","html":"<h2>33题题干</h2>\n<p><strong>The author indicates in Paragraph 3 that earned media ______.</strong></p>\n<blockquote>\n<p>作者在第3段说明，赢得媒体可能怎样？</p>\n</blockquote>\n<p>题型：<strong>段落关系理解题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,1046,1360,417]],"scrollTarget":"question","meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"## 34题题干\n\n**Toyota Motor’s experience is cited as an example of ______.**\n\n> 丰田汽车的经历被用来说明什么？\n\n题型：**例子作用题**。\n\n---","html":"<h2>34题题干</h2>\n<p><strong>Toyota Motor’s experience is cited as an example of ______.</strong></p>\n<blockquote>\n<p>丰田汽车的经历被用来说明什么？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,1468,1360,418]],"scrollTarget":"question","meta":{"kind":"stem","qid":"34"}},{"section":"先读题干","raw":"## 35题题干\n\n**Which of the following is the text mainly about?**\n\n> 本文主要谈什么？\n\n题型：**全文主旨题**。\n\n---","html":"<h2>35题题干</h2>\n<p><strong>Which of the following is the text mainly about?</strong></p>\n<blockquote>\n<p>本文主要谈什么？</p>\n</blockquote>\n<p>题型：<strong>全文主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,1891,1360,349]],"scrollTarget":"question","meta":{"kind":"stem","qid":"35"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要转向、补充或下结论 | No longer, While, But, Besides, If |\n| 态度词 / 评价词 | 先抓大概是机会还是风险 | passionate, strong, damaging, at risk, alleviated |\n| 动作词 | 先看谁在创造、控制或回应什么 | create, control, sell, hijack, persuade, engage |\n| 结果词 | 看媒体变化最后造成什么 | expand user traffic, apply pressure, reputation at risk, alleviate damage |\n| 重复主题词 | 大概知道文章一直围着什么转 | paid media, owned media, earned media, sold media, hijacked media |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要转向、补充或下结论</td>\n  <td>No longer, While, But, Besides, If</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓大概是机会还是风险</td>\n  <td>passionate, strong, damaging, at risk, alleviated</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁在创造、控制或回应什么</td>\n  <td>create, control, sell, hijack, persuade, engage</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看媒体变化最后造成什么</td>\n  <td>expand user traffic, apply pressure, reputation at risk, alleviate damage</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道文章一直围着什么转</td>\n  <td>paid media, owned media, earned media, sold media, hijacked media</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[227,347,1321,420],[227,780,1322,662],[227,1455,1324,376],[228,1844,1320,324]],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"The **[xxx]** guide to marketing success used to be that you got what you paid for. No longer. While traditional “paid” media—such as television commercials and print advertisements—still play a major role, companies today can **[xxx]** many alternative forms of media. Consumers passionate about a product may create “earned” media by **[xxx]** promoting it to friends, and a company may **[xxx]** “owned” media by sending e-mail alerts about products and sales to customers **[xxx]** with its Web site. The way consumers now approach the process of making purchase decisions means that marketing’s impact **[xxx]** from a broad range of factors beyond conventional paid media.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>The <span class=\"mask\">[xxx]</span> guide to marketing success used to be that you got what you paid for. No longer. While traditional “paid” media—such as television commercials and print advertisements—still play a major role, companies today can <span class=\"mask\">[xxx]</span> many alternative forms of media. Consumers passionate about a product may create “earned” media by <span class=\"mask\">[xxx]</span> promoting it to friends, and a company may <span class=\"mask\">[xxx]</span> “owned” media by sending e-mail alerts about products and sales to customers <span class=\" 作用，也有多种替代媒体形式，超出传统付费媒体。</p>\n</div><div class=\"coarsePara coarseDone\"><p>2、付费和自有媒体受到控制；对赢得媒体而言，这些营销者充当引出用户回应；但有些情况下，一个营销者的自有媒体变成另一个营销者的付费媒体。</p>\n</div><div class=\"coarsePara coarseDone\"><p>3、也增加了风险：有热情的消费者会说出自己的意见，更快也更显眼；这种被劫持媒体与赢得媒体相反。</p>\n</div><div class=\"coarsePara currentFocus\"><p>4、如果发生这种事，有热情的消费者去劝说其他人，让目标公司的声誉陷入风险；丰田汽车靠相对迅速的行动和回应活动减轻了一些损害。</p>\n</div></div>","articleRects":[[228,1844,1320,324]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":3,"form":3,"coarse":true},"contextRaw":"1、关于营销成功，过去是花多少钱得到多少，现在不再如此；仍发挥重要作用，也有多种替代媒体形式，超出传统付费媒体。\n\n2、付费和自有媒体受到控制；对赢得媒体而言，这些营销者充当引出用户回应；但有些情况下，一个营销者的自有媒体变成另一个营销者的付费媒体。\n\n3、也增加了风险：有热情的消费者会说出自己的意见，更快也更显眼；这种被劫持媒体与赢得媒体相反。"},{"section":"读文章","raw":"粗读这一遍，只先留一个松轮廓：过去营销似乎讲“花多少钱得到多少”，现在不再只靠传统付费媒体；第1段连续出现paid、earned、owned几种媒体，第2段又写到owned media可以变成sold media，关键条件好像是流量很强；第3段转向风险，出现hijacked media、负面意见和给企业施压；最后一段写消费者可能让目标公司声誉受损，同时举丰田用较快的社交媒体回应减轻损害。\n\n现在还不用把几种媒体的定义全部背下来，也不用补出每个遮挡词。粗读只要先记住：第1段说传统付费媒体之外还有别的形式，第2段把其中几种形式写具体，第3段说明同一套变化也可能变成风险，第4段写风险发生后的回应。做31—34题时，再按题干回相应自然段精读。","html":"<p>粗读这一遍，只先留一个松轮廓：过去营销似乎讲“花多少钱得到多少”，现在不再只靠传统付费媒体；第1段连续出现paid、earned、owned几种媒体，第2段又写到owned media可以变成sold media，关键条件好像是流量很强；第3段转向风险，出现hijacked media、负面意见和给企业施压；最后一段写消费者可能让目标公司声誉受损，同时举丰田用较快的社交媒体回应减轻损害。</p>\n<p>现在还不用把几种媒体的定义全部背下来，也不用补出每个遮挡词。粗读只要先记住：第1段说传统付费媒体之外还有别的形式，第2段把其中几种形式写具体，第3段说明同一套变化也可能变成风险，第4段写风险发生后的回应。做31—34题时，再按题干回相应自然段精读。</p>\n","articleRects":[[227,347,1321,420],[227,780,1322,662],[227,1455,1324,376],[228,1844,1320,324]],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做31至34题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做31至34题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"31题","raw":"## 31题\n\n> Consumers may create “earned” media when they are ______.  \n> 消费者在什么情况下可能创造“赢得媒体”？\n\n题干问消费者在什么情况下创造`earned media`。粗读时好像在第1段中间见过`Consumers passionate about a product`，后面紧跟向朋友推广，所以先把第1段一次读清。\n\n> 原文参考：\n>\n> The **[xxx]** guide to marketing success used to be that you got what you paid for. No longer. While traditional “paid” media—such as television commercials and print advertisements—still play a major role, companies today can **[xxx]** many alternative forms of media. Consumers passionate about a product may create “earned” media by **[xxx]** promoting it to friends, and a company may **[xxx]** “owned” media by sending e-mail alerts about products and sales to customers **[xxx]** with its Web site. The way consumers now approach the process of making purchase decisions means that marketing’s impact **[xxx]** from a broad range of factors beyond conventional paid media.\n>\n> 开始精读：\n>\n> The **[xxx]** guide / to marketing success / used to be / that you got what you paid for. / No longer. / While traditional “paid” media—such as television commercials and print advertisements— / still play a major role, / companies today can **[xxx]** / many alternative forms of media. / Consumers passionate about a product / may create “earned” media / by **[xxx]** promoting it to friends, / and a company / may **[xxx]** “owned” media / by sending e-mail alerts / about products and sales / to customers **[xxx]** with its Web site. / The way consumers now approach / the process of making purchase decisions / means / that marketing’s impact **[xxx]** / from a broad range of factors / beyond conventional paid media.\n>\n> 营销成功的**[xxx]**指南 / 过去是 / 过去认为 / 花多少钱得到多少 / 现在不再如此 / 传统“付费”媒体——如电视广告和印刷广告—— / 仍然发挥重要作用 / 但今天的公司能**[xxx]** / 很多替代媒体形式 / 对产品有热情的消费者 / 可以创造“赢得媒体” / 通过**[xxx]**向朋友推荐产品 / 而公司 / 可以**[xxx]**“自有媒体” / 通过发送邮件提醒 / 内容是产品和促销 / 发给在网站上**[xxx]**的顾客 / 消费者现在采取的方式 / 在作购买决定时 / 意味着 / 营销影响**[xxx]** / 来自广泛因素 / 超出传统付费媒体\n\n现在回到题干。它问的是消费者创造“赢得媒体”的条件，判断点应同时保留两个关系：消费者对某个产品有热情，并且自愿把它推荐给朋友。公司发送邮件属于另一种媒体，不能混进来。\n\n接下来按A—D逐项看。","html":"<h2>31题</h2>\n<blockquote>\n<p>Consumers may create “earned” media when they are ______.<br />\n消费者在什么情况下可能创造“赢得媒体”？</p>\n</blockquote>\n<p>题干问消费者在什么情况下创造<code>earned media</code>。粗读时好像在第1段中间见过<code>Consumers passionate about a product</code>，后面紧跟向朋友推广，所以先把第1段一次读清。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The <span class=\"mask\">[xxx]</span> guide to marketing success used to be that you got what you paid for. No longer. While traditional “paid” media—such as television commercials and print advertisements—still play a major role, companies today can <span class=\"mask\">[xxx]</span> many alternative forms of media. Consumers passionate about a product may create “earned” media by <span class=\"mask\">[xxx]</span> promoting it to friends, and a company may <span class=\"mask\">[xxx]</span> “owned” media by sending e-mail alerts about products and sales to customers <span class=\"mask\">[xxx]</span> with its Web site. The way consumers now approach the process of making purchase decisions means that marketing’s impact <span class=\"mask\">[xxx]</span> from a broad range of factors beyond conventional paid media.</p>\n<p>开始精读：</p>\n<p>The <span class=\"mask\">[xxx]</span> guide / to marketing success / used to be / that you got what you paid for. / No longer. / While traditional “paid” media—such as television commercials and print advertisements— / still play a major role, / companies today can <span class=\"mask\">[xxx]</span> / many alternative forms of media. / Consumers passionate about a product / may create “earned” media / by <span class=\"mask\">[xxx]</span> promoting it to friends, / and a company / may <span class=\"mask\">[xxx]</span> “owned” media / by sending e-mail alerts / about products and sales / to customers <span class=\"mask\">[xxx]</span> with its Web site. / The way consumers now approach / the process of making purchase decisions / means / that marketing’s impact <span class=\"mask\">[xxx]</span> / from a broad range of factors / beyond conventional paid media.</p>\n<p>营销成功的<span class=\"mask\">[xxx]</span>指南 / 过去是 / 过去认为 / 花多少钱得到多少 / 现在不再如此 / 传统“付费”媒体——如电视广告和印刷广告—— / 仍然发挥重要作用 / 但今天的公司能<span class=\"mask\">[xxx]</span> / 很多替代媒体形式 / 对产品有热情的消费者 / 可以创造“赢得媒体” / 通过<span class=\"mask\">[xxx]</span>向朋友推荐产品 / 而公司 / 可以<span class=\"mask\">[xxx]</span>“自有媒体” / 通过发送邮件提醒 / 内容是产品和促销 / 发给在网站上<span class=\"mask\">[xxx]</span>的顾客 / 消费者现在采取的方式 / 在作购买决定时 / 意味着 / 营销影响<span class=\"mask\">[xxx]</span> / 来自广泛因素 / 超出传统付费媒体</p>\n</blockquote>\n<p>现在回到题干。它问的是消费者创造“赢得媒体”的条件，判断点应同时保留两个关系：消费者对某个产品有热情，并且自愿把它推荐给朋友。公司发送邮件属于另一种媒体，不能混进来。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[227,347,1321,420]],"questionRects":[[235,200,1360,418]],"scrollTarget":"article","meta":{"kind":"question","qid":"31"}},{"section":"31题","raw":"### A. **[xxx]** with online shopping at certain Web sites\n\n> 对某些网站的网上购物处于 **[xxx]** 状态\n\n把A接回题干，它说的是：消费者对某些网站的网上购物处于某种被遮挡的状态时，会创造赢得媒体。\n\nA的核心状态词被挡住，但可见对象是`online shopping at certain Web sites`。刚才精读时，好像原文说的是消费者对产品有热情并向朋友推广，不是对网购网站怎样。\n\n> Consumers passionate about a product may create “earned” media by **[xxx]** promoting it to friends.\n\nA和原文都谈消费者的某种状态，所以第一眼可能像是在补`passionate`；但要看这个状态落在什么对象上，以及后面有没有推广动作。\n\n原文说的是：消费者对一个产品有热情，并把这个产品推荐给朋友。\n\nA说的却是：消费者对某些网站上的网上购物处于某种状态。\n\n即使 **[xxx]** 恰好是表示投入或着迷的词，A也把热情的对象从`a product`换成`online shopping at certain Web sites`，还删掉了向朋友推广这一动作。可见部分已经和原句关系不一致。\n\n**只凭“消费者很投入”这一点，能不能把“热爱产品并向朋友推广”换成“热衷某些网站的网上购物”？**\n\n不能。对象和后续动作都换了。\n\n要选A，原文至少还得直接写消费者对特定购物网站或网购活动产生这种状态；第1段没有。\n\n**第一轮判断：A排除。**","html":"<h3>A. <span class=\"mask\">[xxx]</span> with online shopping at certain Web sites</h3>\n<blockquote>\n<p>对某些网站的网上购物处于 <span class=\"mask\">[xxx]</span> 状态</p>\n</blockquote>\n<p>把A接回题干，它说的是：消费者对某些网站的网上购物处于某种被遮挡的状态时，会创造赢得媒体。</p>\n<p>A的核心状态词被挡住，但可见对象是<code>online shopping at certain Web sites</code>。刚才精读时，好像原文说的是消费者对产品有热情并向朋友推广，不是对网购网站怎样。</p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by <span class=\"mask\">[xxx]</span> promoting it to friends.</p>\n</blockquote>\n<p>A和原文都谈消费者的某种状态，所以第一眼可能像是在补<code>passionate</code>；但要看这个状态落在什么对象上，以及后面有没有推广动作。</p>\n<p>原文说的是：消费者对一个产品有热情，并把这个产品推荐给朋友。</p>\n<p>A说的却是：消费者对某些网站上的网上购物处于某种状态。</p>\n<p>即使 <span class=\"mask\">[xxx]</span> 恰好是表示投入或着迷的词，A也把热情的对象从<code>a product</code>换成<code>online shopping at certain Web sites</code>，还删掉了向朋友推广这一动作。可见部分已经和原句关系不一致。</p>\n<p><strong>只凭“消费者很投入”这一点，能不能把“热爱产品并向朋友推广”换成“热衷某些网站的网上购物”？</strong></p>\n<p>不能。对象和后续动作都换了。</p>\n<p>要选A，原文至少还得直接写消费者对特定购物网站或网购活动产生这种状态；第1段没有。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[227,347,1321,420]],"questionRects":[[235,200,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"31","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"31题","raw":"### B. inspired by product-promoting e-mails sent to them\n\n> 受到发给他们的产品促销邮件鼓舞\n\n把B接回题干，它说的是：消费者受到产品促销邮件鼓舞时，会创造赢得媒体。\n\nB里的`e-mails`在第1段确实出现过，很容易眼熟。刚才精读时，好像发邮件的是公司，而且那一句在解释`owned media`，先把两种媒体分开。\n\n> Consumers passionate about a product may create “earned” media by **[xxx]** promoting it to friends.\n>\n> a company may **[xxx]** “owned” media by sending e-mail alerts about products and sales\n\nB抓到了同段里的产品邮件，所以表面材料来自文章；但原文把消费者主动推荐归到`earned media`，把公司发邮件归到`owned media`。\n\n原文说的是：消费者凭自己的热情向朋友推广，形成赢得媒体；公司给顾客发促销邮件，形成自有媒体。\n\nB说的却是：消费者先收到公司的促销邮件并受其鼓舞，随后才创造赢得媒体。\n\n文章没有建立“邮件激发消费者推荐”的因果链。B把两句各自定义不同媒体的内容接成一个新过程，改变了动作发起者和先后关系。\n\n**同一段里既有赢得媒体又有邮件，能不能把两句直接接成“邮件鼓舞消费者创造赢得媒体”？**\n\n不能。原文没有把这两件事接成因果。\n\n要选B，原文至少还得写消费者因为收到这些邮件而去向朋友推荐；第1段没有。\n\n**第一轮判断：B排除。**","html":"<h3>B. inspired by product-promoting e-mails sent to them</h3>\n<blockquote>\n<p>受到发给他们的产品促销邮件鼓舞</p>\n</blockquote>\n<p>把B接回题干，它说的是：消费者受到产品促销邮件鼓舞时，会创造赢得媒体。</p>\n<p>B里的<code>e-mails</code>在第1段确实出现过，很容易眼熟。刚才精读时，好像发邮件的是公司，而且那一句在解释<code>owned media</code>，先把两种媒体分开。</p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by <span class=\"mask\">[xxx]</span> promoting it to friends.</p>\n<p>a company may <span class=\"mask\">[xxx]</span> “owned” media by sending e-mail alerts about products and sales</p>\n</blockquote>\n<p>B抓到了同段里的产品邮件，所以表面材料来自文章；但原文把消费者主动推荐归到<code>earned media</code>，把公司发邮件归到<code>owned media</code>。</p>\n<p>原文说的是：消费者凭自己的热情向朋友推广，形成赢得媒体；公司给顾客发促销邮件，形成自有媒体。</p>\n<p>B说的却是：消费者先收到公司的促销邮件并受其鼓舞，随后才创造赢得媒体。</p>\n<p>文章没有建立“邮件激发消费者推荐”的因果链。B把两句各自定义不同媒体的内容接成一个新过程，改变了动作发起者和先后关系。</p>\n<p><strong>同一段里既有赢得媒体又有邮件，能不能把两句直接接成“邮件鼓舞消费者创造赢得媒体”？</strong></p>\n<p>不能。原文没有把这两件事接成因果。</p>\n<p>要选B，原文至少还得写消费者因为收到这些邮件而去向朋友推荐；第1段没有。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[227,347,1321,420]],"questionRects":[[235,200,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"31","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"31题","raw":"### C. eager to help their friends promote quality products\n\n> 热切地帮助朋友推广优质产品\n\n把C接回题干，它说的是：消费者热切地帮助朋友推广优质产品时，会创造赢得媒体。\n\nC里有`friends`、`promote`和`products`，几乎把原句的词都凑齐了。刚才精读时，好像动作方向是消费者把产品推荐给朋友，不是帮助朋友去推广。\n\n> Consumers passionate about a product may create “earned” media by **[xxx]** promoting it to friends.\n\nC确实对上了消费者、朋友、产品和推广这几个要素，因此第一眼很像；真正要比的是谁帮助谁、产品是否被评价为优质。\n\n原文说的是：消费者自己向朋友推广一个自己喜欢的产品。\n\nC说的却是：消费者帮助朋友去推广被说成优质的产品。\n\n`promoting it to friends`里，朋友是推广的接受者；C却让朋友变成需要被帮助的推广者。原文也只说消费者对产品有热情，没有断定产品一定`quality`。\n\n**“把产品推荐给朋友”能不能改成“帮助朋友推广优质产品”？**\n\n不能。朋友在两个说法中的角色相反，产品评价也被加上了。\n\n要选C，原文至少还得写朋友也在做推广、消费者是在帮助他们，并评价产品质量；这些都没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. eager to help their friends promote quality products</h3>\n<blockquote>\n<p>热切地帮助朋友推广优质产品</p>\n</blockquote>\n<p>把C接回题干，它说的是：消费者热切地帮助朋友推广优质产品时，会创造赢得媒体。</p>\n<p>C里有<code>friends</code>、<code>promote</code>和<code>products</code>，几乎把原句的词都凑齐了。刚才精读时，好像动作方向是消费者把产品推荐给朋友，不是帮助朋友去推广。</p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by <span class=\"mask\">[xxx]</span> promoting it to friends.</p>\n</blockquote>\n<p>C确实对上了消费者、朋友、产品和推广这几个要素，因此第一眼很像；真正要比的是谁帮助谁、产品是否被评价为优质。</p>\n<p>原文说的是：消费者自己向朋友推广一个自己喜欢的产品。</p>\n<p>C说的却是：消费者帮助朋友去推广被说成优质的产品。</p>\n<p><code>promoting it to friends</code>里，朋友是推广的接受者；C却让朋友变成需要被帮助的推广者。原文也只说消费者对产品有热情，没有断定产品一定<code>quality</code>。</p>\n<p><strong>“把产品推荐给朋友”能不能改成“帮助朋友推广优质产品”？</strong></p>\n<p>不能。朋友在两个说法中的角色相反，产品评价也被加上了。</p>\n<p>要选C，原文至少还得写朋友也在做推广、消费者是在帮助他们，并评价产品质量；这些都没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[227,347,1321,420]],"questionRects":[[235,200,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"31","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"31题","raw":"### D. enthusiastic about recommending their favorite products\n\n> 热衷于推荐自己喜欢的产品\n\n把D接回题干，它说的是：消费者热衷于推荐自己喜欢的产品时，会创造赢得媒体。\n\nD里的`enthusiastic`和`favorite products`能让人想起`passionate about a product`，`recommending`又对应向朋友推广。刚才精读时，好像两层关系正好都在原句里。\n\n> Consumers passionate about a product may create “earned” media by **[xxx]** promoting it to friends.\n\nD没有照搬原词，但保留了完整关系：因为喜欢某个产品，消费者主动把它推荐出去。\n\n原文说的是：消费者对产品有热情，并自愿向朋友推广该产品。\n\nD说的却是：消费者热衷于推荐自己喜欢的产品。\n\n`passionate`对应`enthusiastic`，`promoting it to friends`对应`recommending`，喜欢的产品也就是让消费者有热情的产品。D没有更换主体、对象或动作方向。\n\n**“对产品有热情并向朋友推广”能不能概括为“热衷推荐自己喜欢的产品”？**\n\n能。条件和动作都对上了。\n\nD已经覆盖题干所问的条件，不需要原文再补新的关系。\n\n**第一轮判断：D保留。**","html":"<h3>D. enthusiastic about recommending their favorite products</h3>\n<blockquote>\n<p>热衷于推荐自己喜欢的产品</p>\n</blockquote>\n<p>把D接回题干，它说的是：消费者热衷于推荐自己喜欢的产品时，会创造赢得媒体。</p>\n<p>D里的<code>enthusiastic</code>和<code>favorite products</code>能让人想起<code>passionate about a product</code>，<code>recommending</code>又对应向朋友推广。刚才精读时，好像两层关系正好都在原句里。</p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by <span class=\"mask\">[xxx]</span> promoting it to friends.</p>\n</blockquote>\n<p>D没有照搬原词，但保留了完整关系：因为喜欢某个产品，消费者主动把它推荐出去。</p>\n<p>原文说的是：消费者对产品有热情，并自愿向朋友推广该产品。</p>\n<p>D说的却是：消费者热衷于推荐自己喜欢的产品。</p>\n<p><code>passionate</code>对应<code>enthusiastic</code>，<code>promoting it to friends</code>对应<code>recommending</code>，喜欢的产品也就是让消费者有热情的产品。D没有更换主体、对象或动作方向。</p>\n<p><strong>“对产品有热情并向朋友推广”能不能概括为“热衷推荐自己喜欢的产品”？</strong></p>\n<p>能。条件和动作都对上了。</p>\n<p>D已经覆盖题干所问的条件，不需要原文再补新的关系。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[227,347,1321,420]],"questionRects":[[235,200,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"31","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"31题","raw":"### 31题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C排除；\n- D保留；\n\nD同时保留“喜欢产品”和“主动推荐”两层关系；A换了热情对象，B把公司邮件与消费者推荐硬接成因果，C倒转了朋友在推广中的角色。\n\n> **31题选D。**","html":"<h3>31题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留；</li>\n</ul>\n<p>D同时保留“喜欢产品”和“主动推荐”两层关系；A换了热情对象，B把公司邮件与消费者推荐硬接成因果，C倒转了朋友在推广中的角色。</p>\n<blockquote>\n<p><strong>31题选D。</strong></p>\n</blockquote>\n","articleRects":[[227,347,1321,420]],"questionRects":[[235,200,1360,418]],"scrollTarget":"question","meta":{"kind":"result","qid":"31"}},{"section":"32题","raw":"## 32题\n\n> According to Paragraph 2, sold media feature ______.  \n> 根据第2段，售出媒体具有什么特点？\n\n题干明确锁定第2段并问`sold media`的特点。粗读时好像记得定义句里出现`traffic is so strong`，后面说其他组织把内容放进这个环境，所以先把第2段读清。\n\n> 原文参考：\n>\n> Paid and owned media are controlled by marketers promoting their own products. For earned media, such marketers act as the **[xxx]** for users’ responses. But in some cases, one marketer’s owned media become another marketer’s paid media—for instance, when an e-commerce retailer sells ad space on its Web site. We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment. This trend, which we believe is still in its **[xxx]**, effectively began with retailers and travel providers such as airlines and hotels and will no doubt go further. Johnson & Johnson, for example, has created BabyCenter, a **[xxx]** media property that promotes **[xxx]** and even competitive products. Besides **[xxx]** income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies’ marketing, and may help expand user traffic for all companies concerned.\n>\n> 开始精读：\n>\n> Paid and owned media / are controlled / by marketers promoting their own products. / For earned media, / such marketers act / as the **[xxx]** / for users’ responses. / But in some cases, / one marketer’s owned media / become another marketer’s paid media— / for instance, / when an e-commerce retailer / sells ad space / on its Web site. / We define such sold media / as owned media / whose traffic is so strong / that other organizations / place their content or e-commerce engines / within that environment. / This trend, / which we believe / is still in its **[xxx]**, / effectively began / with retailers and travel providers / such as airlines and hotels / and will no doubt go further. / Johnson & Johnson, / for example, / has created BabyCenter, / a **[xxx]** media property / that promotes **[xxx]** and even competitive products. / Besides **[xxx]** income, / the presence of other marketers / makes the site seem objective, / gives companies opportunities / to learn valuable information / about the appeal / of other companies’ marketing, / and may help expand user traffic / for all companies concerned.\n>\n> 付费媒体和自有媒体 / 由营销者控制 / 他们推广自己的产品 / 对赢得媒体来说 / 营销者充当 / **[xxx]** / 引出用户回应 / 但有些情况下 / 一个营销者的自有媒体 / 会变成另一个营销者的付费媒体 / 比如 / 当一家电商零售商 / 出售广告位 / 在自己的网站上 / 我们把这种出售型媒体定义为 / 一种自有媒体 / 它的流量很强 / 以至于其他组织 / 把内容或电商入口放进来 / 放在这个环境里 / 这一走向 / 我们认为 / 仍处于**[xxx]**阶段 / 它实际上开始于 / 零售商和旅行服务商 / 如航空公司和酒店 / 而且无疑会继续发展 / Johnson & Johnson / 例如 / 创建了BabyCenter / 一个**[xxx]**媒体资产 / 它推广**[xxx]**甚至竞争性产品 / 除了**[xxx]**收入 / 其他营销者的存在 / 让网站显得客观 / 给公司提供机会 / 去了解有价值的信息 / 关于吸引力 / 其他公司的营销吸引力 / 并可能帮助扩大用户流量 / 让所有相关公司受益\n\n现在回到题干。第2段先给出直接定义：售出媒体本来是自有媒体，但它的流量强到足以吸引其他组织把内容或电商入口放进来。选项应抓住这个可观察的定义条件。\n\n接下来按A—D逐项看。","html":"<h2>32题</h2>\n<blockquote>\n<p>According to Paragraph 2, sold media feature ______.<br />\n根据第2段，售出媒体具有什么特点？</p>\n</blockquote>\n<p>题干明确锁定第2段并问<code>sold media</code>的特点。粗读时好像记得定义句里出现<code>traffic is so strong</code>，后面说其他组织把内容放进这个环境，所以先把第2段读清。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Paid and owned media are controlled by marketers promoting their own products. For earned media, such marketers act as the <span class=\"mask\">[xxx]</span> for users’ responses. But in some cases, one marketer’s owned media become another marketer’s paid media—for instance, when an e-commerce retailer sells ad space on its Web site. We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment. This trend, which we believe is still in its <span class=\"mask\">[xxx]</span>, effectively began with retailers and travel providers such as airlines and hotels and will no doubt go further. Johnson &amp; Johnson, for example, has created BabyCenter, a <span class=\"mask\">[xxx]</span> media property that promotes <span class=\"mask\">[xxx]</span> and even competitive products. Besides <span class=\"mask\">[xxx]</span> income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies’ marketing, and may help expand user traffic for all companies concerned.</p>\n<p>开始精读：</p>\n<p>Paid and owned media / are controlled / by marketers promoting their own products. / For earned media, / such marketers act / as the <span class=\"mask\">[xxx]</span> / for users’ responses. / But in some cases, / one marketer’s owned media / become another marketer’s paid media— / for instance, / when an e-commerce retailer / sells ad space / on its Web site. / We define such sold media / as owned media / whose traffic is so strong / that other organizations / place their content or e-commerce engines / within that environment. / This trend, / which we believe / is still in its <span class=\"mask\">[xxx]</span>, / effectively began / with retailers and travel providers / such as airlines and hotels / and will no doubt go further. / Johnson &amp; Johnson, / for example, / has created BabyCenter, / a <span class=\"mask\">[xxx]</span> media property / that promotes <span class=\"mask\">[xxx]</span> and even competitive products. / Besides <span class=\"mask\">[xxx]</span> income, / the presence of other marketers / makes the site seem objective, / gives companies opportunities / to learn valuable information / about the appeal / of other companies’ marketing, / and may help expand user traffic / for all companies concerned.</p>\n<p>付费媒体和自有媒体 / 由营销者控制 / 他们推广自己的产品 / 对赢得媒体来说 / 营销者充当 / <span class=\"mask\">[xxx]</span> / 引出用户回应 / 但有些情况下 / 一个营销者的自有媒体 / 会变成另一个营销者的付费媒体 / 比如 / 当一家电商零售商 / 出售广告位 / 在自己的网站上 / 我们把这种出售型媒体定义为 / 一种自有媒体 / 它的流量很强 / 以至于其他组织 / 把内容或电商入口放进来 / 放在这个环境里 / 这一走向 / 我们认为 / 仍处于<span class=\"mask\">[xxx]</span>阶段 / 它实际上开始于 / 零售商和旅行服务商 / 如航空公司和酒店 / 而且无疑会继续发展 / Johnson &amp; Johnson / 例如 / 创建了BabyCenter / 一个<span class=\"mask\">[xxx]</span>媒体资产 / 它推广<span class=\"mask\">[xxx]</span>甚至竞争性产品 / 除了<span class=\"mask\">[xxx]</span>收入 / 其他营销者的存在 / 让网站显得客观 / 给公司提供机会 / 去了解有价值的信息 / 关于吸引力 / 其他公司的营销吸引力 / 并可能帮助扩大用户流量 / 让所有相关公司受益</p>\n</blockquote>\n<p>现在回到题干。第2段先给出直接定义：售出媒体本来是自有媒体，但它的流量强到足以吸引其他组织把内容或电商入口放进来。选项应抓住这个可观察的定义条件。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[227,780,1322,662]],"questionRects":[[235,623,1360,418]],"scrollTarget":"article","meta":{"kind":"question","qid":"32"}},{"section":"32题","raw":"### A. a safe business environment\n\n> 安全的商业环境\n\n把A接回题干，它说的是：售出媒体的特点是提供一个安全的商业环境。\n\nA里的`environment`在定义句末尾确实出现过。刚才精读时，好像原文只说其他组织把内容放进那个环境，没有评价它是否安全。\n\n> other organizations place their content or e-commerce engines within that environment\n\nA抓到了`environment`这个同词，因此看着像能回原句；但题目要的是这个环境为什么能成为售出媒体。\n\n原文说的是：流量足够强，其他组织愿意把内容或电商入口放入其中。\n\nA说的却是：这个商业环境具有安全性。\n\n愿意投放内容可能有许多原因，不能自动推出“安全”。原文没有出现风险控制、保障或安全评价，A只保留了场所外壳，换掉了定义核心。\n\n**其他组织愿意进入某个媒体环境，能不能直接证明这个环境“安全”？**\n\n不能。原文只给出强流量这一条件。\n\n要选A，原文至少还得明确写这个环境受到保护、风险低或可安全经营；第2段没有。\n\n**第一轮判断：A排除。**","html":"<h3>A. a safe business environment</h3>\n<blockquote>\n<p>安全的商业环境</p>\n</blockquote>\n<p>把A接回题干，它说的是：售出媒体的特点是提供一个安全的商业环境。</p>\n<p>A里的<code>environment</code>在定义句末尾确实出现过。刚才精读时，好像原文只说其他组织把内容放进那个环境，没有评价它是否安全。</p>\n<blockquote>\n<p>other organizations place their content or e-commerce engines within that environment</p>\n</blockquote>\n<p>A抓到了<code>environment</code>这个同词，因此看着像能回原句；但题目要的是这个环境为什么能成为售出媒体。</p>\n<p>原文说的是：流量足够强，其他组织愿意把内容或电商入口放入其中。</p>\n<p>A说的却是：这个商业环境具有安全性。</p>\n<p>愿意投放内容可能有许多原因，不能自动推出“安全”。原文没有出现风险控制、保障或安全评价，A只保留了场所外壳，换掉了定义核心。</p>\n<p><strong>其他组织愿意进入某个媒体环境，能不能直接证明这个环境“安全”？</strong></p>\n<p>不能。原文只给出强流量这一条件。</p>\n<p>要选A，原文至少还得明确写这个环境受到保护、风险低或可安全经营；第2段没有。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[227,780,1322,662]],"questionRects":[[235,623,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"32","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"32题","raw":"### B. **[xxx]** competition\n\n> **[xxx]** 的竞争\n\n把B接回题干，它说的是：售出媒体的特点是具有某种被遮挡的竞争。\n\nB的核心修饰词被挡住，可见中心只剩`competition`。刚才精读时，好像BabyCenter会推广其他甚至竞争产品，但售出媒体的直接定义仍是流量强。\n\n> We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.\n>\n> BabyCenter ... promotes **[xxx]** and even competitive products.\n\nB可能让人想到后面确实出现`competitive products`，所以不算完全离题；但那是BabyCenter例子中的产品关系，不是定义句给出的媒体特点。\n\n原文说的是：售出媒体由强流量吸引其他组织进入；例子还说同一平台会出现竞争产品。\n\nB说的却是：售出媒体本身以某种竞争状态为定义特征。\n\n遮挡词无论表示随机、激烈还是别的程度，可见的`competition`都没有替代`traffic is so strong`。例子中的竞争产品只能说明平台容纳了哪些内容，不能改写售出媒体的核心条件。\n\n**例子里出现竞争产品，能不能把售出媒体的定义改成“具有某种竞争”？**\n\n不能。例子细节和定义条件不是一回事。\n\n要选B，定义句至少还得把竞争强度或竞争方式列为售出媒体的必要特征；第2段没有。\n\n**第一轮判断：B排除。**","html":"<h3>B. <span class=\"mask\">[xxx]</span> competition</h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 的竞争</p>\n</blockquote>\n<p>把B接回题干，它说的是：售出媒体的特点是具有某种被遮挡的竞争。</p>\n<p>B的核心修饰词被挡住，可见中心只剩<code>competition</code>。刚才精读时，好像BabyCenter会推广其他甚至竞争产品，但售出媒体的直接定义仍是流量强。</p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.</p>\n<p>BabyCenter ... promotes <span class=\"mask\">[xxx]</span> and even competitive products.</p>\n</blockquote>\n<p>B可能让人想到后面确实出现<code>competitive products</code>，所以不算完全离题；但那是BabyCenter例子中的产品关系，不是定义句给出的媒体特点。</p>\n<p>原文说的是：售出媒体由强流量吸引其他组织进入；例子还说同一平台会出现竞争产品。</p>\n<p>B说的却是：售出媒体本身以某种竞争状态为定义特征。</p>\n<p>遮挡词无论表示随机、激烈还是别的程度，可见的<code>competition</code>都没有替代<code>traffic is so strong</code>。例子中的竞争产品只能说明平台容纳了哪些内容，不能改写售出媒体的核心条件。</p>\n<p><strong>例子里出现竞争产品，能不能把售出媒体的定义改成“具有某种竞争”？</strong></p>\n<p>不能。例子细节和定义条件不是一回事。</p>\n<p>要选B，定义句至少还得把竞争强度或竞争方式列为售出媒体的必要特征；第2段没有。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[227,780,1322,662]],"questionRects":[[235,623,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"32","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"32题","raw":"### C. strong user traffic\n\n> 强大的用户流量\n\n把C接回题干，它说的是：售出媒体的特点是用户流量很强。\n\nC里的`strong`和`traffic`几乎就是定义句原词。刚才精读时，好像正因为流量足够强，其他组织才会把内容放进来。\n\n> We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.\n\nC直接抓住`sold media`定义中的条件，而不是从后面的例子另作推测。\n\n原文说的是：自有媒体的流量强到足以吸引其他组织进驻。\n\nC说的却是：售出媒体具有强大的用户流量。\n\n`whose traffic is so strong`与`strong user traffic`只做了词序调整；`other organizations`的进入还是这个特点带来的结果。\n\n**定义句里的`traffic is so strong`能不能直接概括成`strong user traffic`？**\n\n能。核心名词和程度都一致。\n\nC已经由直接定义支持，不需要依赖BabyCenter例子的其他细节。\n\n**第一轮判断：C保留。**","html":"<h3>C. strong user traffic</h3>\n<blockquote>\n<p>强大的用户流量</p>\n</blockquote>\n<p>把C接回题干，它说的是：售出媒体的特点是用户流量很强。</p>\n<p>C里的<code>strong</code>和<code>traffic</code>几乎就是定义句原词。刚才精读时，好像正因为流量足够强，其他组织才会把内容放进来。</p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.</p>\n</blockquote>\n<p>C直接抓住<code>sold media</code>定义中的条件，而不是从后面的例子另作推测。</p>\n<p>原文说的是：自有媒体的流量强到足以吸引其他组织进驻。</p>\n<p>C说的却是：售出媒体具有强大的用户流量。</p>\n<p><code>whose traffic is so strong</code>与<code>strong user traffic</code>只做了词序调整；<code>other organizations</code>的进入还是这个特点带来的结果。</p>\n<p><strong>定义句里的<code>traffic is so strong</code>能不能直接概括成<code>strong user traffic</code>？</strong></p>\n<p>能。核心名词和程度都一致。</p>\n<p>C已经由直接定义支持，不需要依赖BabyCenter例子的其他细节。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[227,780,1322,662]],"questionRects":[[235,623,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"32","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"32题","raw":"### D. flexibility in organization\n\n> 组织上的灵活性\n\n把D接回题干，它说的是：售出媒体的特点是组织方式灵活。\n\nD里的`organization`会让人想起定义句中的`other organizations`。刚才精读时，好像那里说的是其他组织进入平台，并没有说平台的组织结构灵活。\n\n> other organizations place their content or e-commerce engines within that environment\n\nD和原文共享`organization`这一词根，第一眼容易误接；但原文中的`organizations`是进入者，D中的`organization`变成媒体自身的组织方式。\n\n原文说的是：其他组织因为强流量而把内容放进该媒体环境。\n\nD说的却是：媒体在组织或结构安排上具有灵活性。\n\n主体和关系都变了。文章没有讨论内部架构、管理方式或调整能力，不能从“许多组织进入”推出“组织灵活”。\n\n**`other organizations`进入平台，能不能改写成平台具有`flexibility in organization`？**\n\n不能。一个是外部参与者，一个是内部组织特征。\n\n要选D，原文至少还得写平台如何灵活安排结构或管理；第2段没有。\n\n**第一轮判断：D排除。**","html":"<h3>D. flexibility in organization</h3>\n<blockquote>\n<p>组织上的灵活性</p>\n</blockquote>\n<p>把D接回题干，它说的是：售出媒体的特点是组织方式灵活。</p>\n<p>D里的<code>organization</code>会让人想起定义句中的<code>other organizations</code>。刚才精读时，好像那里说的是其他组织进入平台，并没有说平台的组织结构灵活。</p>\n<blockquote>\n<p>other organizations place their content or e-commerce engines within that environment</p>\n</blockquote>\n<p>D和原文共享<code>organization</code>这一词根，第一眼容易误接；但原文中的<code>organizations</code>是进入者，D中的<code>organization</code>变成媒体自身的组织方式。</p>\n<p>原文说的是：其他组织因为强流量而把内容放进该媒体环境。</p>\n<p>D说的却是：媒体在组织或结构安排上具有灵活性。</p>\n<p>主体和关系都变了。文章没有讨论内部架构、管理方式或调整能力，不能从“许多组织进入”推出“组织灵活”。</p>\n<p><strong><code>other organizations</code>进入平台，能不能改写成平台具有<code>flexibility in organization</code>？</strong></p>\n<p>不能。一个是外部参与者，一个是内部组织特征。</p>\n<p>要选D，原文至少还得写平台如何灵活安排结构或管理；第2段没有。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[227,780,1322,662]],"questionRects":[[235,623,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"32","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"32题","raw":"### 32题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D排除；\n\n第2段对售出媒体有直接定义，决定性条件就是流量很强，C正面复现；A、B、D都从环境、例子或词形相似处另换了关系。\n\n> **32题选C。**","html":"<h3>32题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除；</li>\n</ul>\n<p>第2段对售出媒体有直接定义，决定性条件就是流量很强，C正面复现；A、B、D都从环境、例子或词形相似处另换了关系。</p>\n<blockquote>\n<p><strong>32题选C。</strong></p>\n</blockquote>\n","articleRects":[[227,780,1322,662]],"questionRects":[[235,623,1360,418]],"scrollTarget":"question","meta":{"kind":"result","qid":"32"}},{"section":"33题","raw":"## 33题\n\n> The author indicates in Paragraph 3 that earned media ______.  \n> 作者在第3段说明，赢得媒体可能怎样？\n\n题干指定第3段并把主语写成`earned media`。粗读时好像记得这一段先说技术变化带来更多选择，也增加风险，随后写`hijacked media are the opposite of earned media`，所以先把第3段读清。\n\n> 原文参考：\n>\n> The same **[xxx]** technological changes that have provided marketers with more (and more **[xxx]**) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways. Such hijacked media are the opposite of earned media: an asset or campaign becomes **[xxx]** to consumers, other **[xxx]**, or activists who make negative **[xxx]** about a brand or product. Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.\n>\n> 开始精读：\n>\n> The same **[xxx]** technological changes / that have provided marketers / with more (and more **[xxx]**) communications choices / have also increased the risk / that passionate consumers / will voice their opinions / in quicker, more visible, and much more damaging ways. / Such hijacked media / are the opposite of earned media: / an asset or campaign / becomes **[xxx]** / to consumers, other **[xxx]**, or activists / who make negative **[xxx]** / about a brand or product. / Members of social networks, / for instance, / are learning / that they can hijack media / to apply pressure / on the businesses / that originally created them.\n>\n> 同样的**[xxx]**技术变化 / 它们给营销者提供 / 更多而且更**[xxx]**的传播选择 / 也增加了风险 / 有热情的消费者 / 会说出自己的意见 / 方式更快、更显眼、破坏更大 / 这种被劫持媒体 / 与赢得媒体相反 / 一个资产或传播活动 / 会成为**[xxx]** / 被消费者、其他**[xxx]**或行动者控制 / 他们提出负面的**[xxx]** / 针对一个品牌或产品 / 社交网络成员 / 例如 / 正在学会 / 他们可以劫持媒体 / 施加压力 / 给那些企业 / 原本创建这些媒体的企业\n\n现在回到题干。第3段并不是说赢得媒体天生有害，而是说带来更多传播选择的同一套变化也可能让媒体被消费者劫持，形成与赢得媒体相反的结果。选项应概括这种渠道可能被反向利用、给营销造成负面影响。\n\n接下来按A—D逐项看。","html":"<h2>33题</h2>\n<blockquote>\n<p>The author indicates in Paragraph 3 that earned media ______.<br />\n作者在第3段说明，赢得媒体可能怎样？</p>\n</blockquote>\n<p>题干指定第3段并把主语写成<code>earned media</code>。粗读时好像记得这一段先说技术变化带来更多选择，也增加风险，随后写<code>hijacked media are the opposite of earned media</code>，所以先把第3段读清。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The same <span class=\"mask\">[xxx]</span> technological changes that have provided marketers with more (and more <span class=\"mask\">[xxx]</span>) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways. Such hijacked media are the opposite of earned media: an asset or campaign becomes <span class=\"mask\">[xxx]</span> to consumers, other <span class=\"mask\">[xxx]</span>, or activists who make negative <span class=\"mask\">[xxx]</span> about a brand or product. Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.</p>\n<p>开始精读：</p>\n<p>The same <span class=\"mask\">[xxx]</span> technological changes / that have provided marketers / with more (and more <span class=\"mask\">[xxx]</span>) communications choices / have also increased the risk / that passionate consumers / will voice their opinions / in quicker, more visible, and much more damaging ways. / Such hijacked media / are the opposite of earned media: / an asset or campaign / becomes <span class=\"mask\">[xxx]</span> / to consumers, other <span class=\"mask\">[xxx]</span>, or activists / who make negative <span class=\"mask\">[xxx]</span> / about a brand or product. / Members of social networks, / for instance, / are learning / that they can hijack media / to apply pressure / on the businesses / that originally created them.</p>\n<p>同样的<span class=\"mask\">[xxx]</span>技术变化 / 它们给营销者提供 / 更多而且更<span class=\"mask\">[xxx]</span>的传播选择 / 也增加了风险 / 有热情的消费者 / 会说出自己的意见 / 方式更快、更显眼、破坏更大 / 这种被劫持媒体 / 与赢得媒体相反 / 一个资产或传播活动 / 会成为<span class=\"mask\">[xxx]</span> / 被消费者、其他<span class=\"mask\">[xxx]</span>或行动者控制 / 他们提出负面的<span class=\"mask\">[xxx]</span> / 针对一个品牌或产品 / 社交网络成员 / 例如 / 正在学会 / 他们可以劫持媒体 / 施加压力 / 给那些企业 / 原本创建这些媒体的企业</p>\n</blockquote>\n<p>现在回到题干。第3段并不是说赢得媒体天生有害，而是说带来更多传播选择的同一套变化也可能让媒体被消费者劫持，形成与赢得媒体相反的结果。选项应概括这种渠道可能被反向利用、给营销造成负面影响。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[227,1455,1324,376]],"questionRects":[[235,1046,1360,417]],"scrollTarget":"article","meta":{"kind":"question","qid":"33"}},{"section":"33题","raw":"### A. invite **[xxx]** conflicts with passionate consumers\n\n> 招来与热情消费者之间的 **[xxx]** 冲突\n\n把A接回题干，它说的是：赢得媒体会主动招来与热情消费者之间的某种冲突。\n\nA的冲突程度被挡住，但`invite conflicts`这个动作可见。刚才精读时，好像原文说的是技术变化增加风险，消费者可能接管媒体；没有说赢得媒体主动邀请冲突。\n\n> technological changes ... have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways\n>\n> Such hijacked media are the opposite of earned media\n\nA抓到了热情消费者与负面风险，因此表面方向有些接近；但它把风险写成赢得媒体主动“招来冲突”。\n\n原文说的是：同一套传播变化增加了消费者以更快、更显眼、更有破坏性的方式发声的风险，随后可能形成与赢得媒体相反的被劫持媒体。\n\nA说的却是：赢得媒体本身主动导致与消费者的冲突。\n\n原文把`earned media`与`hijacked media`区分开，并用`risk`说明可能性；A却把两者合并，还加上主动因果。被遮挡的程度词不能修复这个动作和类别错误。\n\n**“存在被消费者劫持的风险”能不能改成“赢得媒体主动招来消费者冲突”？**\n\n不能。媒体类别和因果方向都变了。\n\n要选A，原文至少还得说赢得媒体直接引发冲突，而不是说另一种被劫持媒体与它相反；第3段没有。\n\n**第一轮判断：A排除。**","html":"<h3>A. invite <span class=\"mask\">[xxx]</span> conflicts with passionate consumers</h3>\n<blockquote>\n<p>招来与热情消费者之间的 <span class=\"mask\">[xxx]</span> 冲突</p>\n</blockquote>\n<p>把A接回题干，它说的是：赢得媒体会主动招来与热情消费者之间的某种冲突。</p>\n<p>A的冲突程度被挡住，但<code>invite conflicts</code>这个动作可见。刚才精读时，好像原文说的是技术变化增加风险，消费者可能接管媒体；没有说赢得媒体主动邀请冲突。</p>\n<blockquote>\n<p>technological changes ... have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways</p>\n<p>Such hijacked media are the opposite of earned media</p>\n</blockquote>\n<p>A抓到了热情消费者与负面风险，因此表面方向有些接近；但它把风险写成赢得媒体主动“招来冲突”。</p>\n<p>原文说的是：同一套传播变化增加了消费者以更快、更显眼、更有破坏性的方式发声的风险，随后可能形成与赢得媒体相反的被劫持媒体。</p>\n<p>A说的却是：赢得媒体本身主动导致与消费者的冲突。</p>\n<p>原文把<code>earned media</code>与<code>hijacked media</code>区分开，并用<code>risk</code>说明可能性；A却把两者合并，还加上主动因果。被遮挡的程度词不能修复这个动作和类别错误。</p>\n<p><strong>“存在被消费者劫持的风险”能不能改成“赢得媒体主动招来消费者冲突”？</strong></p>\n<p>不能。媒体类别和因果方向都变了。</p>\n<p>要选A，原文至少还得说赢得媒体直接引发冲突，而不是说另一种被劫持媒体与它相反；第3段没有。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[227,1455,1324,376]],"questionRects":[[235,1046,1360,417]],"scrollTarget":"article","meta":{"kind":"option","qid":"33","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"33题","raw":"### B. can be used to produce negative effects in marketing\n\n> 可能被用来在营销中产生负面效果\n\n把B接回题干，它说的是：赢得媒体这类传播渠道可能被反向利用，从而给营销造成负面影响。\n\nB里的`negative effects`能让人想起`damaging ways`、负面指控和给企业施压。刚才精读时，好像原文正是从正向的赢得媒体转到其反面——被劫持媒体。\n\n> Such hijacked media are the opposite of earned media\n>\n> activists who make negative **[xxx]** about a brand or product\n>\n> they can hijack media to apply pressure on the businesses that originally created them\n\nB没有拘泥于媒体名称，而是概括了第3段的实际后果：原本可用于营销的媒体资产或活动会被消费者接管，转而伤害品牌。\n\n原文说的是：媒体资产或活动可能落入消费者或行动者控制，被用来作负面指控并向原企业施压。\n\nB说的却是：这些媒体渠道可能被用来产生负面营销效果。\n\n第3段用`opposite`、`negative`、`damaging`和`apply pressure`共同把负面结果写实。题干用`earned media`带出讨论对象，B则抓住其可能转成反面用途这一层。\n\n**媒体被接管后用于负面指控和施压，能不能概括为“在营销中产生负面效果”？**\n\n能。动作结果和影响方向都一致。\n\nB的表述比原文抽象，但没有多加竞争、道德评价或必然性，当前支持已经足够。\n\n**第一轮判断：B保留。**","html":"<h3>B. can be used to produce negative effects in marketing</h3>\n<blockquote>\n<p>可能被用来在营销中产生负面效果</p>\n</blockquote>\n<p>把B接回题干，它说的是：赢得媒体这类传播渠道可能被反向利用，从而给营销造成负面影响。</p>\n<p>B里的<code>negative effects</code>能让人想起<code>damaging ways</code>、负面指控和给企业施压。刚才精读时，好像原文正是从正向的赢得媒体转到其反面——被劫持媒体。</p>\n<blockquote>\n<p>Such hijacked media are the opposite of earned media</p>\n<p>activists who make negative <span class=\"mask\">[xxx]</span> about a brand or product</p>\n<p>they can hijack media to apply pressure on the businesses that originally created them</p>\n</blockquote>\n<p>B没有拘泥于媒体名称，而是概括了第3段的实际后果：原本可用于营销的媒体资产或活动会被消费者接管，转而伤害品牌。</p>\n<p>原文说的是：媒体资产或活动可能落入消费者或行动者控制，被用来作负面指控并向原企业施压。</p>\n<p>B说的却是：这些媒体渠道可能被用来产生负面营销效果。</p>\n<p>第3段用<code>opposite</code>、<code>negative</code>、<code>damaging</code>和<code>apply pressure</code>共同把负面结果写实。题干用<code>earned media</code>带出讨论对象，B则抓住其可能转成反面用途这一层。</p>\n<p><strong>媒体被接管后用于负面指控和施压，能不能概括为“在营销中产生负面效果”？</strong></p>\n<p>能。动作结果和影响方向都一致。</p>\n<p>B的表述比原文抽象，但没有多加竞争、道德评价或必然性，当前支持已经足够。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[227,1455,1324,376]],"questionRects":[[235,1046,1360,417]],"scrollTarget":"article","meta":{"kind":"option","qid":"33","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"33题","raw":"### C. may be responsible for fiercer competition\n\n> 可能导致更激烈的竞争\n\n把C接回题干，它说的是：赢得媒体可能造成更激烈的市场竞争。\n\nC里的`competition`在第2段例子中出现过，但题干锁定第3段。刚才精读第3段时，好像一直在写消费者负面发声和给企业施压，没有比较竞争强弱。\n\n> passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways\n>\n> they can hijack media to apply pressure on the businesses\n\n媒体传播变快、变显眼可能让人联想到企业竞争加剧，但这只是外推，原句给出的对象是消费者对品牌的负面行动。\n\n原文说的是：消费者利用媒体作负面指控并向原企业施压。\n\nC说的却是：企业之间的竞争因此变得更激烈。\n\n原文没有写竞争者之间的较量、市场份额变化或竞争程度比较。`more damaging`修饰的是消费者表达意见的方式，不等于`fiercer competition`。\n\n**消费者对企业施压、表达更有破坏性，能不能直接推出企业竞争更激烈？**\n\n不能。负面压力和竞争强度不是同一结果。\n\n要选C，第3段至少还得出现竞争主体及“比以前更激烈”的比较；这些都没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. may be responsible for fiercer competition</h3>\n<blockquote>\n<p>可能导致更激烈的竞争</p>\n</blockquote>\n<p>把C接回题干，它说的是：赢得媒体可能造成更激烈的市场竞争。</p>\n<p>C里的<code>competition</code>在第2段例子中出现过，但题干锁定第3段。刚才精读第3段时，好像一直在写消费者负面发声和给企业施压，没有比较竞争强弱。</p>\n<blockquote>\n<p>passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways</p>\n<p>they can hijack media to apply pressure on the businesses</p>\n</blockquote>\n<p>媒体传播变快、变显眼可能让人联想到企业竞争加剧，但这只是外推，原句给出的对象是消费者对品牌的负面行动。</p>\n<p>原文说的是：消费者利用媒体作负面指控并向原企业施压。</p>\n<p>C说的却是：企业之间的竞争因此变得更激烈。</p>\n<p>原文没有写竞争者之间的较量、市场份额变化或竞争程度比较。<code>more damaging</code>修饰的是消费者表达意见的方式，不等于<code>fiercer competition</code>。</p>\n<p><strong>消费者对企业施压、表达更有破坏性，能不能直接推出企业竞争更激烈？</strong></p>\n<p>不能。负面压力和竞争强度不是同一结果。</p>\n<p>要选C，第3段至少还得出现竞争主体及“比以前更激烈”的比较；这些都没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[227,1455,1324,376]],"questionRects":[[235,1046,1360,417]],"scrollTarget":"article","meta":{"kind":"option","qid":"33","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"33题","raw":"### D. deserve all the negative comments about them\n\n> 理应承受针对它们的所有负面评论\n\n把D接回题干，它说的是：赢得媒体理应受到全部负面评论。\n\nD里的`negative`和原文的负面指控表面很像。刚才精读时，好像原文只描述消费者会怎样做，没有判断媒体“活该”被批评。\n\n> activists who make negative **[xxx]** about a brand or product\n\nD抓到了`negative`这一方向，但原文的负面说法针对的是品牌或产品，而且是行动者的行为事实，不是作者的道德判定。\n\n原文说的是：消费者或行动者会对品牌或产品作负面指控。\n\nD说的却是：赢得媒体本身理应承受所有负面评论。\n\n`deserve`加入“应得”的评价，`all`又把范围扩大到全部；同时评论对象也从品牌或产品换成媒体。原文三处关系都没有支持。\n\n**“有人会作负面指控”能不能改成“赢得媒体理应承受所有负面评论”？**\n\n不能。事实描述被换成道德评价，范围和对象也变了。\n\n要选D，作者至少还得明确赞成这些评论、认定它们全部合理，并把对象指向赢得媒体；第3段没有。\n\n**第一轮判断：D排除。**","html":"<h3>D. deserve all the negative comments about them</h3>\n<blockquote>\n<p>理应承受针对它们的所有负面评论</p>\n</blockquote>\n<p>把D接回题干，它说的是：赢得媒体理应受到全部负面评论。</p>\n<p>D里的<code>negative</code>和原文的负面指控表面很像。刚才精读时，好像原文只描述消费者会怎样做，没有判断媒体“活该”被批评。</p>\n<blockquote>\n<p>activists who make negative <span class=\"mask\">[xxx]</span> about a brand or product</p>\n</blockquote>\n<p>D抓到了<code>negative</code>这一方向，但原文的负面说法针对的是品牌或产品，而且是行动者的行为事实，不是作者的道德判定。</p>\n<p>原文说的是：消费者或行动者会对品牌或产品作负面指控。</p>\n<p>D说的却是：赢得媒体本身理应承受所有负面评论。</p>\n<p><code>deserve</code>加入“应得”的评价，<code>all</code>又把范围扩大到全部；同时评论对象也从品牌或产品换成媒体。原文三处关系都没有支持。</p>\n<p><strong>“有人会作负面指控”能不能改成“赢得媒体理应承受所有负面评论”？</strong></p>\n<p>不能。事实描述被换成道德评价，范围和对象也变了。</p>\n<p>要选D，作者至少还得明确赞成这些评论、认定它们全部合理，并把对象指向赢得媒体；第3段没有。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[227,1455,1324,376]],"questionRects":[[235,1046,1360,417]],"scrollTarget":"article","meta":{"kind":"option","qid":"33","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P3"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"33题","raw":"### 33题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D排除；\n\n第3段的主线是媒体资产可能被消费者接管并反向伤害营销，B概括这一负面用途；A改成主动招来冲突，C改成竞争加剧，D加入“应得全部批评”的评价。\n\n> **33题选B。**","html":"<h3>33题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除；</li>\n</ul>\n<p>第3段的主线是媒体资产可能被消费者接管并反向伤害营销，B概括这一负面用途；A改成主动招来冲突，C改成竞争加剧，D加入“应得全部批评”的评价。</p>\n<blockquote>\n<p><strong>33题选B。</strong></p>\n</blockquote>\n","articleRects":[[227,1455,1324,376]],"questionRects":[[235,1046,1360,417]],"scrollTarget":"question","meta":{"kind":"result","qid":"33"}},{"section":"34题","raw":"## 34题\n\n> Toyota Motor’s experience is cited as an example of ______.  \n> 丰田汽车的经历被用来说明什么？\n\n题干直接问丰田这个例子的作用。粗读时好像在最后一段见过`alleviated some of the damage`和`quick ... social-media response campaign`，所以先把第4段读清，并看例子前的风险是什么。\n\n> 原文参考：\n>\n> If that happens, passionate consumers would try to persuade others to **[xxx]** products, putting the reputation of the target company at risk. In such a case, the company’s response may not be sufficiently quick or thoughtful, and the learning curve has been **[xxx]**. Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.\n>\n> 开始精读：\n>\n> If that happens, / passionate consumers / would try / to persuade others / to **[xxx]** products, / putting the reputation / of the target company / at risk. / In such a case, / the company’s response / may not be sufficiently quick or thoughtful, / and the learning curve / has been **[xxx]**. / Toyota Motor, / for example, / alleviated some of the damage / from its recall crisis / earlier this year / with a relatively quick / and well-orchestrated social-media response campaign, / which included efforts / to engage with consumers directly / on sites such as Twitter / and the social-news site Digg.\n>\n> 如果发生这种事 / 有热情的消费者 / 会试着 / 劝说其他人 / 去**[xxx]**产品 / 让声誉 / 目标公司的声誉 / 陷入风险 / 在这种情况下 / 公司的回应 / 可能不够快也不够周全 / 而学习过程 / 一直很**[xxx]** / Toyota Motor / 例如 / 减轻了一些损害 / 来自召回危机 / 就在今年早些时候 / 靠相对迅速的行动 / 以及组织良好的社交媒体回应活动 / 其中包括努力 / 与消费者直接互动 / 在Twitter等网站 / 以及社交新闻网站Digg\n\n现在回到题干。例子前先说媒体被劫持后，消费者可能劝别人抵制产品，企业回应又可能不够快或周全；丰田例子随后写它用较快、组织良好的社交媒体回应减轻损害。因此例子在说明怎样有效回应被劫持媒体造成的危机。\n\n接下来按A—D逐项看。","html":"<h2>34题</h2>\n<blockquote>\n<p>Toyota Motor’s experience is cited as an example of ______.<br />\n丰田汽车的经历被用来说明什么？</p>\n</blockquote>\n<p>题干直接问丰田这个例子的作用。粗读时好像在最后一段见过<code>alleviated some of the damage</code>和<code>quick ... social-media response campaign</code>，所以先把第4段读清，并看例子前的风险是什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>If that happens, passionate consumers would try to persuade others to <span class=\"mask\">[xxx]</span> products, putting the reputation of the target company at risk. In such a case, the company’s response may not be sufficiently quick or thoughtful, and the learning curve has been <span class=\"mask\">[xxx]</span>. Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.</p>\n<p>开始精读：</p>\n<p>If that happens, / passionate consumers / would try / to persuade others / to <span class=\"mask\">[xxx]</span> products, / putting the reputation / of the target company / at risk. / In such a case, / the company’s response / may not be sufficiently quick or thoughtful, / and the learning curve / has been <span class=\"mask\">[xxx]</span>. / Toyota Motor, / for example, / alleviated some of the damage / from its recall crisis / earlier this year / with a relatively quick / and well-orchestrated social-media response campaign, / which included efforts / to engage with consumers directly / on sites such as Twitter / and the social-news site Digg.</p>\n<p>如果发生这种事 / 有热情的消费者 / 会试着 / 劝说其他人 / 去<span class=\"mask\">[xxx]</span>产品 / 让声誉 / 目标公司的声誉 / 陷入风险 / 在这种情况下 / 公司的回应 / 可能不够快也不够周全 / 而学习过程 / 一直很<span class=\"mask\">[xxx]</span> / Toyota Motor / 例如 / 减轻了一些损害 / 来自召回危机 / 就在今年早些时候 / 靠相对迅速的行动 / 以及组织良好的社交媒体回应活动 / 其中包括努力 / 与消费者直接互动 / 在Twitter等网站 / 以及社交新闻网站Digg</p>\n</blockquote>\n<p>现在回到题干。例子前先说媒体被劫持后，消费者可能劝别人抵制产品，企业回应又可能不够快或周全；丰田例子随后写它用较快、组织良好的社交媒体回应减轻损害。因此例子在说明怎样有效回应被劫持媒体造成的危机。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[228,1844,1320,324]],"questionRects":[[235,1468,1360,418]],"scrollTarget":"article","meta":{"kind":"question","qid":"34"}},{"section":"34题","raw":"### A. responding effectively to hijacked media\n\n> 有效回应被劫持媒体\n\n把A接回题干，它说的是：丰田的经历说明企业可以有效回应被劫持媒体。\n\nA里的`responding`能让人想起`response campaign`，`effectively`又对应减轻损害。刚才精读时，好像丰田正是靠较快且组织良好的回应缓和召回危机。\n\n> Toyota Motor ... alleviated some of the damage from its recall crisis ... with a relatively quick and well-orchestrated social-media response campaign\n>\n> which included efforts to engage with consumers directly\n\nA同时抓住了例子的动作和结果：企业作出社交媒体回应，并实际减轻了部分损害。\n\n原文说的是：丰田以较快、组织良好的社交媒体活动直接接触消费者，缓和危机损害。\n\nA说的却是：企业有效回应被劫持媒体。\n\n`hijacked media`来自上一段和本段的`If that happens`，而`alleviated some of the damage`说明回应确实有效。A没有夸成彻底解决，只写`effectively`，力度合适。\n\n**较快而有组织的回应减轻了损害，能不能说明丰田在有效回应被劫持媒体？**\n\n能。例子的行动、背景和结果都对上了。\n\nA由例前风险和例中结果共同支持，不需要再补别的环节。\n\n**第一轮判断：A保留。**","html":"<h3>A. responding effectively to hijacked media</h3>\n<blockquote>\n<p>有效回应被劫持媒体</p>\n</blockquote>\n<p>把A接回题干，它说的是：丰田的经历说明企业可以有效回应被劫持媒体。</p>\n<p>A里的<code>responding</code>能让人想起<code>response campaign</code>，<code>effectively</code>又对应减轻损害。刚才精读时，好像丰田正是靠较快且组织良好的回应缓和召回危机。</p>\n<blockquote>\n<p>Toyota Motor ... alleviated some of the damage from its recall crisis ... with a relatively quick and well-orchestrated social-media response campaign</p>\n<p>which included efforts to engage with consumers directly</p>\n</blockquote>\n<p>A同时抓住了例子的动作和结果：企业作出社交媒体回应，并实际减轻了部分损害。</p>\n<p>原文说的是：丰田以较快、组织良好的社交媒体活动直接接触消费者，缓和危机损害。</p>\n<p>A说的却是：企业有效回应被劫持媒体。</p>\n<p><code>hijacked media</code>来自上一段和本段的<code>If that happens</code>，而<code>alleviated some of the damage</code>说明回应确实有效。A没有夸成彻底解决，只写<code>effectively</code>，力度合适。</p>\n<p><strong>较快而有组织的回应减轻了损害，能不能说明丰田在有效回应被劫持媒体？</strong></p>\n<p>能。例子的行动、背景和结果都对上了。</p>\n<p>A由例前风险和例中结果共同支持，不需要再补别的环节。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[228,1844,1320,324]],"questionRects":[[235,1468,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"34","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"34题","raw":"### B. persuading customers into boycotting products\n\n> 劝说顾客抵制产品\n\n把B接回题干，它说的是：丰田的经历说明企业劝说顾客去抵制产品。\n\nB里的`persuading`和`boycotting`对应本段前半句，所以很眼熟。刚才精读时，好像做这个动作的是热情消费者，而丰田随后是在减轻损害。\n\n> passionate consumers would try to persuade others to **[xxx]** products\n>\n> Toyota Motor ... alleviated some of the damage ... with a ... response campaign\n\nB确实复现了例子前的风险动作，但把动作发起者换成丰田，并把背景风险当成丰田的做法。\n\n原文说的是：消费者可能劝别人抵制产品；丰田则通过回应活动减轻这类危机造成的损害。\n\nB说的却是：丰田主动劝说顾客抵制产品。\n\n前者是对企业不利的消费者行动，后者是企业的应对。两者方向相反，不能因为相邻就把前一句的动作安到丰田身上。\n\n**例子前写消费者劝人抵制，能不能说这正是丰田被举出的做法？**\n\n不能。行为主体和目的正好相反。\n\n要选B，原文至少还得写丰田号召顾客抵制某些产品；例子没有。\n\n**第一轮判断：B排除。**","html":"<h3>B. persuading customers into boycotting products</h3>\n<blockquote>\n<p>劝说顾客抵制产品</p>\n</blockquote>\n<p>把B接回题干，它说的是：丰田的经历说明企业劝说顾客去抵制产品。</p>\n<p>B里的<code>persuading</code>和<code>boycotting</code>对应本段前半句，所以很眼熟。刚才精读时，好像做这个动作的是热情消费者，而丰田随后是在减轻损害。</p>\n<blockquote>\n<p>passionate consumers would try to persuade others to <span class=\"mask\">[xxx]</span> products</p>\n<p>Toyota Motor ... alleviated some of the damage ... with a ... response campaign</p>\n</blockquote>\n<p>B确实复现了例子前的风险动作，但把动作发起者换成丰田，并把背景风险当成丰田的做法。</p>\n<p>原文说的是：消费者可能劝别人抵制产品；丰田则通过回应活动减轻这类危机造成的损害。</p>\n<p>B说的却是：丰田主动劝说顾客抵制产品。</p>\n<p>前者是对企业不利的消费者行动，后者是企业的应对。两者方向相反，不能因为相邻就把前一句的动作安到丰田身上。</p>\n<p><strong>例子前写消费者劝人抵制，能不能说这正是丰田被举出的做法？</strong></p>\n<p>不能。行为主体和目的正好相反。</p>\n<p>要选B，原文至少还得写丰田号召顾客抵制某些产品；例子没有。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[228,1844,1320,324]],"questionRects":[[235,1468,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"34","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"34题","raw":"### C. cooperating with **[xxx]** consumers\n\n> 与 **[xxx]** 的消费者合作\n\n把C接回题干，它说的是：丰田的经历说明企业与某类被遮挡的消费者合作。\n\nC里可见的`cooperating with consumers`会让人想到丰田直接与消费者互动。刚才精读时，好像原文只写`engage with consumers directly`，没有说双方形成合作关系。\n\n> which included efforts to engage with consumers directly on sites such as Twitter\n\nC对上了丰田与消费者直接接触这一表面事实，所以第一眼有吸引力；但`engage with`只表示互动，未必达到共同合作。\n\n原文说的是：丰田努力在社交网站上直接接触并回应消费者。\n\nC说的却是：丰田与某一类消费者共同合作。\n\n合作通常要求双方共同完成目标，原文只写丰田单方面展开回应活动。被遮挡的消费者修饰词无论是什么，都不能补出双方合作这一关系。\n\n**“直接与消费者互动”能不能直接扩大成“与消费者合作”？**\n\n不能。接触回应不等于共同合作。\n\n要选C，原文至少还得写消费者配合丰田、双方共同采取行动；本段没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. cooperating with <span class=\"mask\">[xxx]</span> consumers</h3>\n<blockquote>\n<p>与 <span class=\"mask\">[xxx]</span> 的消费者合作</p>\n</blockquote>\n<p>把C接回题干，它说的是：丰田的经历说明企业与某类被遮挡的消费者合作。</p>\n<p>C里可见的<code>cooperating with consumers</code>会让人想到丰田直接与消费者互动。刚才精读时，好像原文只写<code>engage with consumers directly</code>，没有说双方形成合作关系。</p>\n<blockquote>\n<p>which included efforts to engage with consumers directly on sites such as Twitter</p>\n</blockquote>\n<p>C对上了丰田与消费者直接接触这一表面事实，所以第一眼有吸引力；但<code>engage with</code>只表示互动，未必达到共同合作。</p>\n<p>原文说的是：丰田努力在社交网站上直接接触并回应消费者。</p>\n<p>C说的却是：丰田与某一类消费者共同合作。</p>\n<p>合作通常要求双方共同完成目标，原文只写丰田单方面展开回应活动。被遮挡的消费者修饰词无论是什么，都不能补出双方合作这一关系。</p>\n<p><strong>“直接与消费者互动”能不能直接扩大成“与消费者合作”？</strong></p>\n<p>不能。接触回应不等于共同合作。</p>\n<p>要选C，原文至少还得写消费者配合丰田、双方共同采取行动；本段没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[228,1844,1320,324]],"questionRects":[[235,1468,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"34","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"34题","raw":"### D. taking advantage of hijacked media\n\n> 利用被劫持媒体获利或占便宜\n\n把D接回题干，它说的是：丰田的经历说明企业利用被劫持媒体为自己谋利。\n\nD里的`hijacked media`与例子背景一致，所以看着像对。刚才精读时，好像丰田是在危机中补救并减轻损害，不是在把危机当机会利用。\n\n> alleviated some of the damage from its recall crisis\n>\n> with a relatively quick and well-orchestrated social-media response campaign\n\nD抓住了回应发生在被劫持媒体背景下，但把“降低损失”改成“利用它取得好处”。\n\n原文说的是：丰田面对已经造成的召回危机，采取回应以缓和部分损害。\n\nD说的却是：丰田把被劫持媒体当成可利用的资源，从中取得优势。\n\n`alleviated some of the damage`说明它处于补救状态，效果也只是减少损失。原文没有写获利、扩大影响或借机得到额外利益。\n\n**危机回应减少了一部分损害，能不能改成丰田“利用被劫持媒体占便宜”？**\n\n不能。止损和获利不是同一结果。\n\n要选D，原文至少还得写丰田借此得到新的收益或优势；本段没有。\n\n**第一轮判断：D排除。**","html":"<h3>D. taking advantage of hijacked media</h3>\n<blockquote>\n<p>利用被劫持媒体获利或占便宜</p>\n</blockquote>\n<p>把D接回题干，它说的是：丰田的经历说明企业利用被劫持媒体为自己谋利。</p>\n<p>D里的<code>hijacked media</code>与例子背景一致，所以看着像对。刚才精读时，好像丰田是在危机中补救并减轻损害，不是在把危机当机会利用。</p>\n<blockquote>\n<p>alleviated some of the damage from its recall crisis</p>\n<p>with a relatively quick and well-orchestrated social-media response campaign</p>\n</blockquote>\n<p>D抓住了回应发生在被劫持媒体背景下，但把“降低损失”改成“利用它取得好处”。</p>\n<p>原文说的是：丰田面对已经造成的召回危机，采取回应以缓和部分损害。</p>\n<p>D说的却是：丰田把被劫持媒体当成可利用的资源，从中取得优势。</p>\n<p><code>alleviated some of the damage</code>说明它处于补救状态，效果也只是减少损失。原文没有写获利、扩大影响或借机得到额外利益。</p>\n<p><strong>危机回应减少了一部分损害，能不能改成丰田“利用被劫持媒体占便宜”？</strong></p>\n<p>不能。止损和获利不是同一结果。</p>\n<p>要选D，原文至少还得写丰田借此得到新的收益或优势；本段没有。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[228,1844,1320,324]],"questionRects":[[235,1468,1360,418]],"scrollTarget":"article","meta":{"kind":"option","qid":"34","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"34题","raw":"### 34题第一次结果\n\n这一轮看下来：\n\n- A保留；\n- B排除；\n- C排除；\n- D排除；\n\n丰田用较快、组织良好的社交媒体回应减轻危机损害，A完整概括；B把消费者的抵制动作安到丰田身上，C把互动扩大成合作，D把止损改成获利。\n\n> **34题选A。**","html":"<h3>34题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除；</li>\n</ul>\n<p>丰田用较快、组织良好的社交媒体回应减轻危机损害，A完整概括；B把消费者的抵制动作安到丰田身上，C把互动扩大成合作，D把止损改成获利。</p>\n<blockquote>\n<p><strong>34题选A。</strong></p>\n</blockquote>\n","articleRects":[[228,1844,1320,324]],"questionRects":[[235,1468,1360,418]],"scrollTarget":"question","meta":{"kind":"result","qid":"34"}},{"section":"35题","raw":"## 35题\n\n**Which of the following is the text mainly about?**\n\n本文主要谈什么？\n\n这是全文作者观点／全文主旨题。\n\n这类题先别急着数哪个词出现得最多，也别只凭一个局部句子下结论。更稳的办法是把每个选项当成作者真正想表达的中心或态度，看看全文按它应该怎么展开，再和文章实际写法对照。\n\n选项：\n\nA. **Alternatives to conventional paid media.**\n\n传统付费媒体之外的替代形式\n\nB. **Conflict between hijacked and earned media.**\n\n被劫持媒体与赢得媒体之间的冲突\n\nC. **Dominance of hijacked media.**\n\n被劫持媒体占据主导\n\nD. **Popularity of owned media.**\n\n自有媒体的流行\n\n---","html":"<h2>35题</h2>\n<p><strong>Which of the following is the text mainly about?</strong></p>\n<p>本文主要谈什么？</p>\n<p>这是全文作者观点／全文主旨题。</p>\n<p>这类题先别急着数哪个词出现得最多，也别只凭一个局部句子下结论。更稳的办法是把每个选项当成作者真正想表达的中心或态度，看看全文按它应该怎么展开，再和文章实际写法对照。</p>\n<p>选项：</p>\n<p>A. <strong>Alternatives to conventional paid media.</strong></p>\n<p>传统付费媒体之外的替代形式</p>\n<p>B. <strong>Conflict between hijacked and earned media.</strong></p>\n<p>被劫持媒体与赢得媒体之间的冲突</p>\n<p>C. <strong>Dominance of hijacked media.</strong></p>\n<p>被劫持媒体占据主导</p>\n<p>D. <strong>Popularity of owned media.</strong></p>\n<p>自有媒体的流行</p>\n<hr />\n","articleRects":[[227,347,1321,420],[227,780,1322,662],[227,1455,1324,376],[228,1844,1320,324]],"questionRects":[[235,1891,1360,349]],"scrollTarget":"articleTop","meta":{"kind":"main_overview","qid":"35"}},{"section":"35题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先否定“花多少钱得到多少”的旧说法，提出付费媒体之外还有赢得媒体和自有媒体等形式 | 先说原来的办法已经不够 |\n| 第2段 | 继续解释付费、自有、赢得和售出媒体怎样运作，并用平台例子写它们的收益 | 再把几种新办法写具体 |\n| 第3段 | 转向另一面：同样的传播变化也可能让媒体被消费者接管并伤害品牌 | 接着说同样变化也会反噬 |\n| 第4段 | 说明风险发生后企业可能应对不及，并用丰田写较好的补救方式 | 最后说出了问题怎样补救 |\n\n---\n\n**Which of the following is the text mainly about?**","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先否定“花多少钱得到多少”的旧说法，提出付费媒体之外还有赢得媒体和自有媒体等形式</td>\n  <td>先说原来的办法已经不够</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>继续解释付费、自有、赢得和售出媒体怎样运作，并用平台例子写它们的收益</td>\n  <td>再把几种新办法写具体</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>转向另一面：同样的传播变化也可能让媒体被消费者接管并伤害品牌</td>\n  <td>接着说同样变化也会反噬</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>说明风险发生后企业可能应对不及，并用丰田写较好的补救方式</td>\n  <td>最后说出了问题怎样补救</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<p><strong>Which of the following is the text mainly about?</strong></p>\n","articleRects":[[227,347,1321,420],[227,780,1322,662],[227,1455,1324,376],[228,1844,1320,324]],"questionRects":[[235,1891,1360,349]],"scrollTarget":"articleTop","meta":{"kind":"main_method","qid":"35","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"35题","raw":"### A. Alternatives to conventional paid media.\n\n> 传统付费媒体之外的替代形式\n\n#### 如果 A 是主旨，全文应该怎么写？\n\n如果A是主旨，文章应该从传统付费媒体不再够用写起，展开几种替代形式的定义、好处、风险和应对。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先说传统付费方式已经不能概括全部营销影响 | 先说原来的办法已经不够 |\n| 第2段 | 再写几种替代媒体的定义、转换和好处 | 再把几种新办法写具体 |\n| 第3段 | 接着写这些替代渠道也可能反过来造成伤害 | 接着说同样变化也会反噬 |\n| 第4段 | 最后写企业面对这种问题可以怎样回应 | 最后说出了问题怎样补救 |\n\n**从付费媒体之外的多种形式，到这些形式的好处、风险和应对，能不能被“传统付费媒体的替代形式”一条线串起来？**\n\n能。实际结构正好如此：第1段明确说传统付费媒体之外存在多种替代形式；第2段把这些形式写具体；第3段补它们可能被反向利用的风险；第4段写企业如何回应。风险和补救不是跑题，而是对替代媒体全貌的补充。\n\n**判断：A保留。**","html":"<h3>A. Alternatives to conventional paid media.</h3>\n<blockquote>\n<p>传统付费媒体之外的替代形式</p>\n</blockquote>\n<h4>如果 A 是主旨，全文应该怎么写？</h4>\n<p>如果A是主旨，文章应该从传统付费媒体不再够用写起，展开几种替代形式的定义、好处、风险和应对。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先说传统付费方式已经不能概括全部营销影响</td>\n  <td>先说原来的办法已经不够</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再写几种替代媒体的定义、转换和好处</td>\n  <td>再把几种新办法写具体</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着写这些替代渠道也可能反过来造成伤害</td>\n  <td>接着说同样变化也会反噬</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>最后写企业面对这种问题可以怎样回应</td>\n  <td>最后说出了问题怎样补救</td>\n</tr>\n</tbody>\n</table>\n<p><strong>从付费媒体之外的多种形式，到这些形式的好处、风险和应对，能不能被“传统付费媒体的替代形式”一条线串起来？</strong></p>\n<p>能。实际结构正好如此：第1段明确说传统付费媒体之外存在多种替代形式；第2段把这些形式写具体；第3段补它们可能被反向利用的风险；第4段写企业如何回应。风险和补救不是跑题，而是对替代媒体全貌的补充。</p>\n<p><strong>判断：A保留。</strong></p>\n","articleRects":[[227,347,1321,420],[227,780,1322,662],[227,1455,1324,376],[228,1844,1320,324]],"questionRects":[[235,1891,1360,349]],"scrollTarget":"articleTop","meta":{"kind":"main_option","qid":"35","option":"A"}},{"section":"35题","raw":"### B. Conflict between hijacked and earned media.\n\n> 被劫持媒体与赢得媒体之间的冲突\n\n#### 如果 B 是主旨，全文应该怎么写？\n\n如果B是主旨，全文应从头到尾把赢得媒体与被劫持媒体放成两股相互冲突的力量，并围绕冲突过程展开。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先把赢得媒体和被劫持媒体同时摆出来并制造冲突 | 先说原来的办法已经不够 |\n| 第2段 | 再比较两者各自怎样运作和争夺控制权 | 再把几种新办法写具体 |\n| 第3段 | 接着集中写二者冲突怎样升级并影响品牌 | 接着说同样变化也会反噬 |\n| 第4段 | 最后说明这场冲突如何解决或哪一方占上风 | 最后说出了问题怎样补救 |\n\n**如果中心是两种媒体的冲突，为什么前两段要大篇幅定义付费、自有和售出媒体，而且没有写双方直接交战？**\n\n不能。第3段确实说被劫持媒体是赢得媒体的反面，但第1、2段的大量内容还包括付费、自有和售出媒体，二者之间也没有被写成直接交战。B只能覆盖后半部分的一条关系。\n\n**判断：B排除。**","html":"<h3>B. Conflict between hijacked and earned media.</h3>\n<blockquote>\n<p>被劫持媒体与赢得媒体之间的冲突</p>\n</blockquote>\n<h4>如果 B 是主旨，全文应该怎么写？</h4>\n<p>如果B是主旨，全文应从头到尾把赢得媒体与被劫持媒体放成两股相互冲突的力量，并围绕冲突过程展开。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先把赢得媒体和被劫持媒体同时摆出来并制造冲突</td>\n  <td>先说原来的办法已经不够</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再比较两者各自怎样运作和争夺控制权</td>\n  <td>再把几种新办法写具体</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着集中写二者冲突怎样升级并影响品牌</td>\n  <td>接着说同样变化也会反噬</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>最后说明这场冲突如何解决或哪一方占上风</td>\n  <td>最后说出了问题怎样补救</td>\n</tr>\n</tbody>\n</table>\n<p><strong>如果中心是两种媒体的冲突，为什么前两段要大篇幅定义付费、自有和售出媒体，而且没有写双方直接交战？</strong></p>\n<p>不能。第3段确实说被劫持媒体是赢得媒体的反面，但第1、2段的大量内容还包括付费、自有和售出媒体，二者之间也没有被写成直接交战。B只能覆盖后半部分的一条关系。</p>\n<p><strong>判断：B排除。</strong></p>\n","articleRects":[[227,347,1321,420],[227,780,1322,662],[227,1455,1324,376],[228,1844,1320,324]],"questionRects":[[235,1891,1360,349]],"scrollTarget":"articleTop","meta":{"kind":"main_option","qid":"35","option":"B"}},{"section":"35题","raw":"### C. Dominance of hijacked media.\n\n> 被劫持媒体占据主导\n\n#### 如果 C 是主旨，全文应该怎么写？\n\n如果C是主旨，文章应证明被劫持媒体已经压过其他形式、处于主导地位，而不是到后半篇才作为风险出现。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先说明被劫持媒体已经成为最主要的营销形式 | 先说原来的办法已经不够 |\n| 第2段 | 再写它怎样压过其他各种媒体并扩大控制 | 再把几种新办法写具体 |\n| 第3段 | 接着集中展示它造成的普遍而强势的影响 | 接着说同样变化也会反噬 |\n| 第4段 | 最后确认企业只能围绕这种主导形式行动 | 最后说出了问题怎样补救 |\n\n**一种到第3段才作为风险出现、并只说可能被接管的媒体，能不能叫作已经占据主导？**\n\n不能。被劫持媒体直到第3段才出现，而且原文只说风险增加、消费者“can”接管媒体，没有说它已经普遍压过其他形式。`Dominance`需要的主导地位完全没有建立。\n\n**判断：C排除。**","html":"<h3>C. Dominance of hijacked media.</h3>\n<blockquote>\n<p>被劫持媒体占据主导</p>\n</blockquote>\n<h4>如果 C 是主旨，全文应该怎么写？</h4>\n<p>如果C是主旨，文章应证明被劫持媒体已经压过其他形式、处于主导地位，而不是到后半篇才作为风险出现。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先说明被劫持媒体已经成为最主要的营销形式</td>\n  <td>先说原来的办法已经不够</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再写它怎样压过其他各种媒体并扩大控制</td>\n  <td>再把几种新办法写具体</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着集中展示它造成的普遍而强势的影响</td>\n  <td>接着说同样变化也会反噬</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>最后确认企业只能围绕这种主导形式行动</td>\n  <td>最后说出了问题怎样补救</td>\n</tr>\n</tbody>\n</table>\n<p><strong>一种到第3段才作为风险出现、并只说可能被接管的媒体，能不能叫作已经占据主导？</strong></p>\n<p>不能。被劫持媒体直到第3段才出现，而且原文只说风险增加、消费者“can”接管媒体，没有说它已经普遍压过其他形式。<code>Dominance</code>需要的主导地位完全没有建立。</p>\n<p><strong>判断：C排除。</strong></p>\n","articleRects":[[227,347,1321,420],[227,780,1322,662],[227,1455,1324,376],[228,1844,1320,324]],"questionRects":[[235,1891,1360,349]],"scrollTarget":"articleTop","meta":{"kind":"main_option","qid":"35","option":"C"}},{"section":"35题","raw":"### D. Popularity of owned media.\n\n> 自有媒体的流行\n\n#### 如果 D 是主旨，全文应该怎么写？\n\n如果D是主旨，全文应主要说明自有媒体为什么越来越流行、企业怎样采用它以及它怎样取代别的形式。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先说明自有媒体正在迅速流行并取代付费媒体 | 先说原来的办法已经不够 |\n| 第2段 | 再集中写企业怎样建设自有平台及其收益 | 再把几种新办法写具体 |\n| 第3段 | 接着说明自有媒体扩张中出现的少量风险 | 接着说同样变化也会反噬 |\n| 第4段 | 最后给出继续发展自有媒体的办法 | 最后说出了问题怎样补救 |\n\n**自有媒体只是多种形式之一，能不能用它的“流行”覆盖赢得、售出、被劫持媒体和危机回应？**\n\n不能。自有媒体只是第1、2段中的一种形式，文章还详细写赢得、售出、被劫持媒体以及丰田回应。全文没有用采用率或替代结果证明自有媒体“流行”。\n\n**判断：D排除。**","html":"<h3>D. Popularity of owned media.</h3>\n<blockquote>\n<p>自有媒体的流行</p>\n</blockquote>\n<h4>如果 D 是主旨，全文应该怎么写？</h4>\n<p>如果D是主旨，全文应主要说明自有媒体为什么越来越流行、企业怎样采用它以及它怎样取代别的形式。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先说明自有媒体正在迅速流行并取代付费媒体</td>\n  <td>先说原来的办法已经不够</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再集中写企业怎样建设自有平台及其收益</td>\n  <td>再把几种新办法写具体</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着说明自有媒体扩张中出现的少量风险</td>\n  <td>接着说同样变化也会反噬</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>最后给出继续发展自有媒体的办法</td>\n  <td>最后说出了问题怎样补救</td>\n</tr>\n</tbody>\n</table>\n<p><strong>自有媒体只是多种形式之一，能不能用它的“流行”覆盖赢得、售出、被劫持媒体和危机回应？</strong></p>\n<p>不能。自有媒体只是第1、2段中的一种形式，文章还详细写赢得、售出、被劫持媒体以及丰田回应。全文没有用采用率或替代结果证明自有媒体“流行”。</p>\n<p><strong>判断：D排除。</strong></p>\n","articleRects":[[227,347,1321,420],[227,780,1322,662],[227,1455,1324,376],[228,1844,1320,324]],"questionRects":[[235,1891,1360,349]],"scrollTarget":"articleTop","meta":{"kind":"main_option","qid":"35","option":"D"}},{"section":"35题","raw":"### 35题结论\n\n**35. A. Alternatives to conventional paid media.**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Alternatives to conventional paid media / 传统付费媒体之外的替代形式**\n\n---","html":"<h3>35题结论</h3>\n<p><strong>35. A. Alternatives to conventional paid media.</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Alternatives to conventional paid media / 传统付费媒体之外的替代形式</strong></p>\n<hr />\n","articleRects":[[227,347,1321,420],[227,780,1322,662],[227,1455,1324,376],[228,1844,1320,324]],"questionRects":[[235,1891,1360,349]],"scrollTarget":"question","meta":{"kind":"main_result","qid":"35"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保3
