\n**做题模式中的状态：** 当时认识`curiosity`，也想到“任命成了话题”可能让人联想到好奇；但继续比较“Hooray! At last!”后，区分了想进一步了解的好奇与公开叫好，第一轮排除D。\n\n**错误类型：第三类——无中生有。**\n\nD借用了`has been the talk of the classical-music world`，把“大家在谈这件事”进一步补成“大家产生了好奇心”。讨论是一种行为，好奇是想了解未知信息的心理；原文没有给出这一步心理判断，反而用赞许与欢呼说明反应。\n\n**命题人借用的原文材料：**\n\n> The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the sudden announcement of his appointment in 2009.\n>\n> For the most part, the response has been favorable, to say the least.\n>\n> “Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 D选项","focus":[90,354,417,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":21,"option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q21-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>激起了好奇<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>curiosity<\/code>，也想到“任命成了话题”可能让人联想到好奇；但继续比较“Hooray! At last!”后，区分了想进一步了解的好奇与公开叫好，第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了<code>has been the talk of the classical-music world<\/code>，把“大家在谈这件事”进一步补成“大家产生了好奇心”。讨论是一种行为，好奇是想了解未知信息的心理；原文没有给出这一步心理判断，反而用赞许与欢呼说明反应。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the sudden announcement of his appointment in 2009.<\/p>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. aroused curiosity","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 从第1段可以知道，Gilbert的任命激起了好奇。\n\n题干的`appointment`对应第一句的任命，D容易使人联想到同一句的`the talk`。但要判断`curiosity`，还必须读后两句，看文章是否真的把谈论解释成了想进一步了解。\n\n第一句只交代任命成了热门话题；第二句将反应概括为`favorable`；第三句用欢呼给出实例。三句逐步由“受到讨论”推进到“总体获赞”，并没有走向“大家想查明更多情况”。\n\n讨论某事可能出于赞成、批评、惊讶或好奇，单凭`the talk`不能选定其中一种心理。这里不是让我们推想新闻通常会带来什么，而是让我们概括文章明写的反应。\n\n`sudden announcement`也只说明宣布得突然，不能单独推出人们好奇；“Hooray! At last!”表达的是期待的事终于发生后的欣喜，不是信息未知而想打听。\n\nD在真实的“引起讨论”之上增加了“激起好奇”的心理关系，跳过了后两句已经给出的赞许，因此找不到它的完整命题依据。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 D选项","focus":[90,354,417,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":21,"option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q21-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>激起了好奇<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>curiosity<\/code>，也想到“任命成了话题”可能让人联想到好奇；但继续比较“Hooray! At last!”后，区分了想进一步了解的好奇与公开叫好，第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了<code>has been the talk of the classical-music world<\/code>，把“大家在谈这件事”进一步补成“大家产生了好奇心”。讨论是一种行为，好奇是想了解未知信息的心理；原文没有给出这一步心理判断，反而用赞许与欢呼说明反应。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the sudden announcement of his appointment in 2009.<\/p>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第1段可以知道，Gilbert的任命激起了好奇。<\/p>\n<\/blockquote>\n<p>题干的<code>appointment<\/code>对应第一句的任命，D容易使人联想到同一句的<code>the talk<\/code>。但要判断<code>curiosity<\/code>，还必须读后两句，看文章是否真的把谈论解释成了想进一步了解。<\/p>\n<p>第一句只交代任命成了热门话题；第二句将反应概括为<code>favorable<\/code>；第三句用欢呼给出实例。三句逐步由“受到讨论”推进到“总体获赞”，并没有走向“大家想查明更多情况”。<\/p>\n<p>讨论某事可能出于赞成、批评、惊讶或好奇，单凭<code>the talk<\/code>不能选定其中一种心理。这里不是让我们推想新闻通常会带来什么，而是让我们概括文章明写的反应。<\/p>\n<p><code>sudden announcement<\/code>也只说明宣布得突然，不能单独推出人们好奇；“Hooray! At last!”表达的是期待的事终于发生后的欣喜，不是信息未知而想打听。<\/p>\n<p>D在真实的“引起讨论”之上增加了“激起好奇”的心理关系，跳过了后两句已经给出的赞许，因此找不到它的完整命题依据。<\/p>\n<\/section>"},{"title":"D. aroused curiosity","raw":"#### 写作视角法\n\n原文在“成为古典音乐界的话题”之后是这样写的：\n\n> For the most part, the response has been favorable, to say the least.\n>\n> “Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.\n>\n> 作者接着说明总体反响积极，并让评论家用欢呼表达欢迎。\n\n首句留下的是“大家在谈什么”的背景，后两句补上的则是“大家怎样评价”。文章没有让人物提出想了解的事情，而是让人物表达赞许。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The announcement made people eager to learn more about Gilbert. “What kind of musician is he?” asked listeners.\n>\n> 这项任命让人们急于进一步了解Gilbert。“他是怎样的一位音乐家？”听众们问道。\n\n假设写法需要出现想知道更多的心理或追问，才能把“引起讨论”接到“激起好奇”。实际例子只有欢迎和叫好，没有这一追问，所以不能用好奇替文章补写讨论的原因。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 D选项","focus":[90,354,417,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":21,"option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q21-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-D-0\"><blockquote>\n<p>激起了好奇<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>curiosity<\/code>，也想到“任命成了话题”可能让人联想到好奇；但继续比较“Hooray! At last!”后，区分了想进一步了解的好奇与公开叫好，第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了<code>has been the talk of the classical-music world<\/code>，把“大家在谈这件事”进一步补成“大家产生了好奇心”。讨论是一种行为，好奇是想了解未知信息的心理；原文没有给出这一步心理判断，反而用赞许与欢呼说明反应。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the sudden announcement of his appointment in 2009.<\/p>\n<p>For the most part, the response has been favorable, to say the least.<\/p 法<\/h3>\n<p>原文在“成为古典音乐界的话题”之后是这样写的：<\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<p>作者接着说明总体反响积极，并让评论家用欢呼表达欢迎。<\/p>\n<\/blockquote>\n<p>首句留下的是“大家在谈什么”的背景，后两句补上的则是“大家怎样评价”。文章没有让人物提出想了解的事情，而是让人物表达赞许。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The announcement made people eager to learn more about Gilbert. “What kind of musician is he?” asked listeners.<\/p>\n<p>这项任命让人们急于进一步了解Gilbert。“他是怎样的一位音乐家？”听众们问道。<\/p>\n<\/blockquote>\n<p>假设写法需要出现想知道更多的心理或追问，才能把“引起讨论”接到“激起好奇”。实际例子只有欢迎和叫好，没有这一追问，所以不能用好奇替文章补写讨论的原因。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入21题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对重振乐团这一前景持保留态度，不能判断首段的任命新闻是否激起了人们的好奇心。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>aroused curiosity<br>激起了好奇<\/p>\n<\/blockquote>\n<p>作者追问怎样改变乐团，并不等于任命公布时外界就在好奇Gilbert。前者是作者论证中的问题，后者是新闻带来的局部心理反应，不能相互代替。<\/p>\n<p>本项最终仍要根据“has been the talk”和“the response has been favorable”这处局部原文判断：前一句写讨论，后一句把讨论中的总体反应写成赞许，都没有证明D补出的好奇。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"21题结论","raw":"### 21题结论\n\n> **21. C. received acclaim**\n\nA把首段的肯定与欢呼改成了批评。\n\nB把任命受到欢迎改成引起怀疑，也不能借用后文作者的怀疑来填首段反应。\n\nC用`received acclaim`准确改写`favorable`与“Hooray! At last!”表达的赞许。\n\nD借“成为话题”补出了没有被原文说明的好奇心理。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[12,12,1450,405],"sourceW":1696,"sourceH":2551},"meta":{"kind":"conclusion","question":21},"level":3,"html":"<blockquote>\n<p><strong>21. C. received acclaim<\/strong><\/p>\n<\/blockquote>\n<p>A把首段的肯定与欢呼改成了批评。<\/p>\n<p>B把任命受到欢迎改成引起怀疑，也不能借用后文作者的怀疑来填首段反应。<\/p>\n<p>C用<code>received acclaim<\/code>准确改写<code>favorable<\/code>与“Hooray! At last!”表达的赞许。<\/p>\n<p>D借“成为话题”补出了没有被原文说明的好奇心理。<\/p>\n"},{"title":"22题 · 题干、题型与核心出处","raw":"## 22题\n\n> Tommasini regards Gilbert as an artist who is ______.  \n> Tommasini认为Gilbert是一位怎样的艺术家？\n\n### 题型\n\n这是一道人物评价细节题。题干把评价者限定为Tommasini，把评价对象限定为Gilbert，问的是Tommasini直接描述的个人特点，不是作者是否赞成任命，也不是其他评论家预测的改革能力。\n\n### 核心出处\n\n> One of the reasons why the appointment came as such a surprise, however, is that Gilbert is comparatively little known.\n>\n> Even Tommasini, who had advocated Gilbert’s appointment in the Times, calls him “an unpretentious musician with no air of the formidable conductor about him.”\n>\n> As a description of the next music director of an orchestra that has hitherto been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some Times readers as faint praise.\n\n题干的`Tommasini regards Gilbert as`对应`Tommasini ... calls him`，真正承载人物特点的是引号中的`unpretentious musician`及其后对“不摆大指挥家派头”的补充。前一句“不太出名”是背景，后一句`faint praise`是作者对这种描述可能产生的阅读效果的判断，都不能替代Tommasini的直接引语。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[12,522,1200,394],"sourceW":1696,"sourceH":2551},"meta":{"kind":"question","question":22},"level":2,"html":"<blockquote>\n<p>Tommasini regards Gilbert as an artist who is ______.<br>Tommasini认为Gilbert是一位怎样的艺术家？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道人物评价细节题。题干把评价者限定为Tommasini，把评价对象限定为Gilbert，问的是Tommasini直接描述的个人特点，不是作者是否赞成任命，也不是其他评论家预测的改革能力。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>One of the reasons why the appointment came as such a surprise, however, is that Gilbert is comparatively little known.<\/p>\n<p>Even Tommasini, who had advocated Gilbert’s appointment in the Times, calls him “an unpretentious musician with no air of the formidable conductor about him.”<\/p>\n<p>As a description of the next music director of an orchestra that has hitherto been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some Times readers as faint praise.<\/p>\n<\/blockquote>\n<p>题干的<code>Tommasini regards Gilbert as<\/code>对应<code>Tommasini ... calls him<\/code>，真正承载人物特点的是引号中的<code>unpretentious musician<\/code>及其后对“不摆大指挥家派头”的补充。前一句“不太出名”是背景，后一句<code>faint praise<\/code>是作者对这种描述可能产生的阅读效果的判断，都不能替代Tommasini的直接引语。<\/p>\n"},{"title":"A. influential","raw":"### A. influential\n\n> 有影响力的\n\n**做题模式中的状态：** 当时认识`influential`，读到原文的`little known`与`unpretentious musician`，没有在Tommasini的引语里找到影响别人、引领行业或具有号召力的评价，因此第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\nA借助音乐总监、指挥家这类身份，让人把任职地位联想到个人影响力。但Tommasini谈的是Gilbert不装腔、没有大指挥家的派头，没有评价他的行业影响。`comparatively little known`也不能单独证明他毫无影响力；本项缺的是“Tommasini认为他有影响力”这条关系。\n\n**命题人借用的原文材料：**\n\n> One of the reasons why the appointment came as such a surprise, however, is that Gilbert is comparatively little known.\n>\n> Even Tommasini, who had advocated Gilbert’s appointment in the Times, calls him “an unpretentious musician with no air of the formidable conductor about him.”","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题 A选项","focus":[90,608,279,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":22,"option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q22-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>有影响力的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>influential<\/code>，读到原文的<code>little known<\/code>与<code>unpretentious musician<\/code>，没有在Tommasini的引语里找到影响别人、引领行业或具有号召力的评价，因此第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借助音乐总监、指挥家这类身份，让人把任职地位联想到个人影响力。但Tommasini谈的是Gilbert不装腔、没有大指挥家的派头，没有评价他的行业影响。<code>comparatively little known<\/code>也不能单独证明他毫无影响力；本项缺的是“Tommasini认为他有影响力”这条关系。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>One of the reasons why the appointment came as such a surprise, however, is that Gilbert is comparatively little known.<\/p>\n<p>Even Tommasini, who had advocated Gilbert’s appointment in the Times, calls him “an unpretentious musician with no air of the formidable conductor about him.”<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. influential","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Tommasini认为Gilbert是一位有影响力的艺术家。\n\n题干以Tommasini为评价者，原文与之对应的是`Tommasini ... calls him`。需要查的是这个人究竟怎样评价Gilbert，不能把音乐总监的职位本身当作他的评价。\n\n出处先说Gilbert相对不知名，接着引入连支持任命的Tommasini也给出的描述：`an unpretentious musician`，身上没有大指挥家那种令人敬畏的派头。引语的两部分都在刻画气质和做派。\n\n`influential`要求人物能够影响他人、某个领域或某类决定；`unpretentious`只说明人物不故作姿态。一个人低调也可能有影响力，但这只能说明两者可以并存，不能说明原文已经表达了A。\n\n同样，“相对不知名”与“有影响力”也不是严格的反义关系。这里排除A，不靠把不出名扩大成没有影响，而靠Tommasini的直接评价没有涉及影响力这一内容。\n\nA把原文有关气质的描述延伸成了有关行业影响的判断，额外增加的评价找不到出处。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题 A选项","focus":[90,608,279,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":22,"option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q22-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>有影响力的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>influential<\/code>，读到原文的<code>little known<\/code>与<code>unpretentious musician<\/code>，没有在Tommasini的引语里找到影响别人、引领行业或具有号召力的评价，因此第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借助音乐总监、指挥家这类身份，让人把任职地位联想到个人影响力。但Tommasini谈的是Gilbert不装腔、没有大指挥家的派头，没有评价他的行业影响。<code>comparatively little known<\/code>也不能单独证明他毫无影响力；本项缺的是“Tommasini认为他有影响力”这条关系。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>One of the reasons why the appointment came as such a surprise, however, is that Gilbert is comparatively little known.<\/p>\n<p>Even Tommasini, who had advocated Gilbert’s appointment in the Times, calls him “an unpretentious musician with no air of the formidable conductor about him.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q22-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Tommasini认为Gilbert是一位有影响力的艺术家。<\/p>\n<\/blockquote>\n<p>题干以Tommasini为评价者，原文与之对应的是<code>Tommasini ... calls him<\/code>。需要查的是这个人究竟怎样评价Gilbert，不能把音乐总监的职位本身当作他的评价。<\/p>\n<p>出处先说Gilbert相对不知名，接着引入连支持任命的Tommasini也给出的描述：<code>an unpretentious musician<\/code>，身上没有大指挥家那种令人敬畏的派头。引语的两部分都在刻画气质和做派。<\/p>\n<p><code>influential<\/code>要求人物能够影响他人、某个领域或某类决定；<code>unpretentious<\/code>只说明人物不故作姿态。一个人低调也可能有影响力，但这只能说明两者可以并存，不能说明原文已经表达了A。<\/p>\n<p>同样，“相对不知名”与“有影响力”也不是严格的反义关系。这里排除A，不靠把不出名扩大成没有影响，而靠Tommasini的直接评价没有涉及影响力这一内容。<\/p>\n<p>A把原文有关气质的描述延伸成了有关行业影响的判断，额外增加的评价找不到出处。<\/p>\n<\/section>"},{"title":"A. influential","raw":"#### 写作视角法\n\n原文在Tommasini的描述之后是这样写的：\n\n> As a description of the next music director of an orchestra that has hitherto been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some Times readers as faint praise.\n>\n> 对于曾由马勒、布列兹这样的人物执掌的乐团来说，这种对下一任总监的描述，可能会让至少部分读者觉得赞美分量不足。\n\n作者拿Tommasini只谈不摆架子的描述，与乐团此前由大师执掌的背景作比较。这个比较没有替Tommasini补上“他能影响行业”的赞誉，而是保留了描述不够有分量的落差。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Tommasini calls Gilbert “an influential musician whose work shapes the choices of other conductors.”\n>\n> Tommasini称Gilbert为“一位有影响力的音乐家，他的工作影响着其他指挥家的选择”。\n\n假设写法必须让Tommasini明确谈到Gilbert对他人的作用，才能支撑影响力。实际写法谈的是不摆架子的个人气质，后面再解释这种赞美为何可能显得单薄；它没有增加假设中的影响关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题 A选项","focus":[90,608,279,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":22,"option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q22-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>有影响力的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>influential<\/code>，读到原文的<code>little known<\/code>与<code>unpretentious musician<\/code>，没有在Tommasini的引语里找到影响别人、引领行业或具有号召力的评价，因此第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借助音乐总监、指挥家这类身份，让人把任职地位联想到个人影响力。但Tommasini谈的是Gilbert不装腔、没有大指挥家的派头， n<\/section>"},{"title":"A. influential","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Doubtful about Gilbert’s ability to revitalize the Philharmonic  \n> 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。\n\n把这个主旨直接代入22题题干：\n\n> 全文主旨只能确认作者对Gilbert重振乐团的前景有所怀疑，不能判断Tommasini是否称Gilbert有影响力。\n\n但A实际说的是：\n\n> influential  \n> 有影响力的\n\n作者对一种改革能否成功的判断，不能代替另一位评论家对个人影响力的评价。即使一个人有影响力，改革仍可能遇到困难；因此不能把主旨里的怀疑当作“没有影响力”的证据。\n\n本项最终仍要根据“calls him ‘an unpretentious musician’”这处局部原文判断。这里确认的是Tommasini评价他不装腔，没有确认A所说的影响力。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题 A选项","focus":[90,608,279,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":22,"option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q22-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-A-0\"><blockquote>\n<p>有影响力的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>influential<\/code>，读到原文的<code>little known<\/code>与<code>unpretentious musician<\/code>，没有在Tommasini的引语里找到影响别人、引领行业或具有号召力的评价，因此第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借助音乐总监、指挥家这类身份，让人把任职地位联想到个人影响力。但Tommasini谈的是Gilbert不装腔、没有大指挥家的派头，没有评价他的行业影响。<code>comparatively little known<\/code>也不能单独证明他毫无影响力；本项缺的是“Tommasini认为他有影响力”这条关系。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>One of the reasons why the appointment came as such a surprise, however, is that Gilbert is comparatively little known.<\/p>\n<p>Even Tommasini, who had advocated Gilbert’s appointment in the Times, calls him “an unpretentious musician with no air of the formidable conductor about him.”<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q22-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>Tommasini认为Gilbert是一位有影响力的艺术家。<\/p>\n<\/blockquote>\n<p>题干以Tommasini为评价者，原文与之对应的是<code>Tommasini ... calls him<\/code>。需要查的是这个人究竟怎样评价Gilbert，不能把音乐总监的职位本身当作他的评价。<\/p>\n<p>出处先说Gilbert相对不知名，接着引入连支持任命的Tommasini也给出的描述：<code>an unpretentious musician<\/code>，身上没有大指挥家那种令人敬畏的派头。引语的两部分都在刻画气质和做派。<\/p>\n<p><code>influential<\/code>要求人物能够影响他人、某个领域或某类决定；<code>unpretentious<\/code>只说明人物不故作姿态。一个人低调也可能有影响力，但这只能说明两者可以并存，不能说明原文已经表达了A。<\/p>\n<p>同样，“相对不知名”与“有影响力”也不是严格的反义关系。这里排除A，不靠把不出名扩大成没有影响，而靠Tommasini的直接评价没有涉及影响力这一内容。<\/p>\n<p>A把原文有关气质的描述延伸成了有关行业影响的判断，额外增加的评价找不到出处。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q22-A-2\"><h3>写作视角法<\/h3>\n<p>原文在Tommasini的描述之后是这样写的：<\/p>\n<blockquote>\n<p>As a description of the next music director of an orchestra that has hitherto been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some Times readers as faint praise.<\/p>\n<p>对于曾由马勒、布列兹这样的人物执掌的乐团来说，这种对下一任总监的描述，可能会让至少部分读者觉得赞美分量不足。<\/p>\n<\/blockquote>\n<p>作者拿Tommasini只谈不摆架子的描述，与乐团此前由大师执掌的背景作比较。这个比较没有替Tommasini补上“他能影响行业”的赞誉，而是保留了描述不够有分量的落差。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Tommasini calls Gilbert “an influential musician whose work shapes the choices of other conductors.”<\/p>\n<p>Tommasini称Gilbert为“一位有影响力的音乐家，他的工作影响着其他指挥家的选择”。<\/p>\n<\/blockquote>\n<p>假设写法必须让Tommasini明确谈到Gilbert对他人的作用，才能支撑影响力。实际写法谈的是不摆架子的个人气质，后面再解释这种赞美为何可能显得单薄；它没有增加假设中的影响关系。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q22-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入22题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对Gilbert重振乐团的前景有所怀疑，不能判断Tommasini是否称Gilbert有影响力。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>influential<br>有影响力的<\/p>\n<\/blockquote>\n<p>作者对一种改革能否成功的判断，不能代替另一位评论家对个人影响力的评价。即使一个人有影响力，改革仍可能遇到困难；因此不能把主旨里的怀疑当作“没有影响力”的证据。<\/p>\n<p>本项最终仍要根据“calls him ‘an unpretentious musician’”这处局部原文判断。这里确认的是Tommasini评价他不装腔，没有确认A所说的影响力。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. modest","raw":"### B. modest\n\n> 谦逊低调的\n\n**做题模式中的状态：** 当时B的整个评价词`modest`显示为`[xxx]`，但原文`unpret r of a great conductor.<\/p>\n<p>Tommasini把Gilbert描述为一位谦逊的音乐家，不摆出大指挥家那种威严的派头。<\/p>\n<\/blockquote>\n<p>B所需要的写法能在原文的“特点加说明”中找到：<code>unpretentious<\/code>概括不装腔，<code>no air<\/code>补出没有大师派头。假设句只把这种关系换一种说法，没有要求作者增加新的才华、声望或影响力评价。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q22-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入22题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对重振乐团的成效持怀疑态度，不能判断Tommasini具体把Gilbert描述成怎样的性格或气质。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>modest<br>谦逊低调的<\/p>\n<\/blockquote>\n<p>谦逊是人物气质，能否重振乐团是行动成效；两者没有可以直接互推的关系。作者怀疑现有做法是否足够，不会否定别人称赞Gilbert低调，也不能单凭这种怀疑推出他低调。<\/p>\n<p>本项最终仍要根据“an unpretentious musician”这处局部原文判断；后面的<code>with no air<\/code>继续说明不摆架子。B正好概括这两部分合起来描写的气质。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<\/section>"},{"title":"C. respectable","raw":"### C. respectable\n\n> 值得尊敬的\n\n**做题模式中的状态：** 当时认识`respectable`，也注意到它与支持任命、不贬低Gilbert的语气都偏正面；但直接引语讲的是不装腔和低调，不能把好话一概换成值得尊敬，因此第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\nC利用了“支持任命”和正面人物描述，诱导我们再补出“值得尊敬”这一评价。`unpretentious`能够描述低调，却不自动等于Tommasini已经评价其品格、行为或专业表现值得敬重；引语没有说明这一层意思。\n\n**命题人借用的原文材料：**\n\n> Even Tommasini, who had advocated Gilbert’s appointment in the Times, calls him “an unpretentious musician with no air of the formidable conductor about him.”","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题 C选项","focus":[90,778,295,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":22,"option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q22-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-C-0\"><blockquote>\n<p>值得尊敬的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>respectable<\/code>，也注意到它与支持任命、不贬低Gilbert的语气都偏正面；但直接引语讲的是不装腔和低调，不能把好话一概换成值得尊敬，因此第一轮排除C。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n :1696,"sourceH":2551},"meta":{"kind":"option","question":22,"option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q22-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>有才华的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>talented<\/code>，也觉得它与音乐家身份相配；但Tommasini的引语谈的是外在气质和做派，没有给出指挥、演奏或创作能力的评价，第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D抓住<code>musician<\/code>这一艺术家身份，再把对低调做派的描述补成对才华的赞许。一个人从事音乐，不等于文中这位评论家就评价他有才华；<code>unpretentious<\/code>也不承担艺术能力高低这一判断。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>Even Tommasini, who had advocated Gilbert’s appointment in the Times, calls him “an unpretentious musician with no air of the formidable conductor about him.”<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. talented","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Tommasini认为Gilbert是一位有才华的艺术家。\n\n题干的`Tommasini`和`regards Gilbert as`对应第二段的说话者与`calls him`；必须在Tommasini的评价里查找`talented`，不能把全文任何一处对Gilbert的赞美都拿来回答。\n\n出处给出的评价是`unpretentious musician`，后面补充没有威严指挥家的派头。`musician`说明身份，`unpretentious`与`no air`说明气质，两者都没有列出艺术能力上的长处。\n\n`talented`说的是一个人在某一领域的才华。低调的人可以有才华，也可以没有，所以“不装腔”并不能证明“有才华”，更不能反过来证明没有才华。\n\n第3段作者自己说不知道Gilbert是不是好指挥家，第5段Alex Ross谈到他使乐团更有活力的潜力，都不能替Tommasini说话。本题需要的是指定人物实际给出的特点。\n\nD借艺术家身份补出能力评价，把原文“他是什么做派”变成“他有多大才华”；原文没有建立这条关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题 D选项","focus":[90,863,234,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":22,"option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q22-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q22-D-0\"><blockquote>\n<p>有才华的<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>talented<\/code>，也觉得它与音乐家身份相配；但Tommasini的引语谈的是外在气质和做派，没有给出指挥、演奏或创作能力的评价，第一轮排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D lbert重振乐团的成效有所怀疑，不能判断Tommasini是否评价他有艺术才华。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>talented<br>有才华的<\/p>\n<\/blockquote>\n<p>有艺术才华也未必能解决传统音乐会的观众与竞争问题，所以不能把作者的怀疑直接改成“Gilbert没有才华”。更不能把作者的立场移给Tommasini，替后者作人物评价。<\/p>\n<p>本项最终仍要根据“an unpretentious musician with no air”这处局部原文判断。它描写的是不摆架子的气质，D增加的才华评价并未出现。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"22题结论","raw":"### 22题结论\n\n> **22. B. modest**\n\nA借音乐总监与指挥家的身份补出影响力，Tommasini的引语没有作这种评价。\n\nB用`modest`准确概括`unpretentious`及没有大指挥家派头这一谦逊低调的特点。\n\nC把支持任命和低调的正面描述延伸成值得尊敬，增加了原文没有明确表达的评价。\n\nD把音乐家身份与不装腔的气质改成才华判断，评价内容从做派移到了能力。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[12,522,1200,394],"sourceW":1696,"sourceH":2551},"meta":{"kind":"conclusion","question":22},"level":3,"html":"<blockquote>\n<p><strong>22. B. modest<\/strong><\/p>\n<\/blockquote>\n<p>A借音乐总监与指挥家的身份补出影响力，Tommasini的引语没有作这种评价。<\/p>\n<p>B用<code>modest<\/code>准确概括<code>unpretentious<\/code>及没有大指挥家派头这一谦逊低调的特点。<\/p>\n<p>C把支持任命和低调的正面描述延伸成值得尊敬，增加了原文没有明确表达的评价。<\/p>\n<p>D把音乐家身份与不装腔的气质改成才华判断，评价内容从做派移到了能力。<\/p>\n"},{"title":"23题 · 题干、题型与核心出处","raw":"## 23题\n\n> The author believes that the devoted concertgoers ______.  \n> 作者认为那些忠实的音乐会观众怎么样？\n\n### 题型\n\n人物观点推断题。题干中的`The author believes`要求回答作者对忠实观众的判断，不能把观众自己的话当成作者认可的结论，也不能把作者列出的竞争条件直接说成观众已经做出的行为。\n\n### 核心出处\n\n> Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.\n>\n> For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.\n>\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.\n>\n> The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.\n\n`devoted concertgoers`直接对应第4段开头，定语从句说明他们主张录音不能替代现场演出，主句`are missing the point`才是作者的评价。后面三句依次补出竞争对象、录音优势和音乐会危机，让我们知道他们漏掉的“重点”是什么。\n\n从明示事实到推断，只需要走这一步：观众强调现场的不可替代性，作者却说明录音已经凭借多项优势形成现实竞争，所以作者认为这些观众把现场的价值估得过高。这里不必继续猜他们买不买录音、是否看票价或喜欢多少种演出。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[12,1031,1276,404],"sourceW":1696,"sourceH":2551},"meta":{"kind":"question","question":23},"level":2,"html":"<blockquote>\n<p>The author believes that the devoted concertgoers ______.<br>作者认为那些忠实的音乐会观众怎么样？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>人物观点推断题。题干中的<code>The author believes<\/code>要求回答作者对忠实观众的判断，不能把观众自己的话当成作者认可的结论，也不能把作者列出的竞争条件直接说成观众已经做出的行为。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<\/blockquote>\n<p><code>devoted concertgoers<\/code>直接对应第4段开头，定语从句说明他们主张录音不能替代现场演出，主句<code>are missing the point<\/code>才是作者的评价。后面三句依次补出竞争对象、录音优势和音乐会危机，让我们知道他们漏掉的“重点”是什么。<\/p>\n<p>从明示事实到推断，只需要走这一步：观众强调现场的不可替代性，作者却说明录音已经凭借多项优势形成现实竞争，所以作者认为这些观众把现场的价值估得过高。这里不必继续猜他们买不买录音、是否看票价或喜欢多少种演出。<\/p>\n"},{"title":"A. ignore the expenses of live performances","raw":"### A. ignore the expenses of live performances\n\n> 忽视现场演出的花费。\n\n**做题模式中的状态：** 当时A的英文没有遮挡，`expenses`能和后文的`money`接上。第一轮已经读到费用只是时间、注意力和金钱中的一个因素，也看到后文还写录音的质量与便利，但当时没有据此把A排掉，而是和D一起保留。25题形成主旨后才回查：全文关心录音对传统音乐会的整体竞争，不能把作者对观众的批评落实成“他们忽视费用”这一未经说明的判断，因此最后排除A。\n\n**错误类型：第三类——无中生有。**\n\n命题人借用了`money`和`cheap`：艺术活动要争夺公众的金钱，录音也确实便宜。看到这两处，很容易自己补成“忠实观众没有算现场演出的费用”。但原文没有报告这些观众怎样考虑费用；它报告的是他们认为录音不能替代现场。费用因素存在，不等于“观众忽视费用”这个完整判断已经存在。\n\n**命题人借用的原文材料：**\n\n> For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.\n>\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 A选项","focus":[90,1118,905,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":23,"option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q23-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>忽视现场演出的花费。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，<code>expenses<\/code>能和后文的<code>money<\/code>接上。第一轮已经读到费用只是时间、注意力和金钱中的一个因素，也看到后文还写录音的质量与便利，但当时没有据此把A排掉，而是和D一起保留。25题形成主旨后才回查：全文关心录音对传统音乐会的整体竞争，不能把作者对观众的批评落实成“他们忽视费用”这一未经说明的判断，因此最后排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>命题人借用了<code>money<\/code>和<code>cheap<\/code>：艺术活动要争夺公众的金钱，录音也确实便宜。看到这两处，很容易自己补成“忠实观众没有算现场演出的费用”。但原文没有报告这些观众怎样考虑费用；它报告的是他们认为录音不能替代现场。费用因素存在，不等于“观众忽视费用”这个完整判断已经存在。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. ignore the expenses of live performances","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为，那些忠实的音乐会观众忽视了现场演出的花费。\n\n用题干的`devoted concertgoers`找到第4段开头，再用A的`expenses`去对照后文的`money`和`cheap`。前一个定位词锁定被评价的人，后两个只能找到费用这一话题，不能自动替我们补出这些人对费用的态度。\n\n第一句明说观众认为录音不能替代现场，作者评价他们没有抓住要点。第二句则换成`classical instrumentalists`作主语，说明演奏者要争夺公众的时间、注意力和金钱；第三句的主语又是`These recordings`，介绍录音便宜及其他优势。这几句都没有把“没有考虑费用”作为观众的行为写出来。\n\nA的主语是忠实观众，动作是`ignore`，对象是现场演出的花费。原文提到金钱的那一句，主语却是古典乐器演奏家，动作是`compete`，对象是公众有限的投入。把“演奏者要争夺公众的钱”改成“观众忽视现场费用”，中间缺少关于观众如何判断花费的证据。\n\n此外，作者并列写可得性、质量以及自由选择时间地点，是要解释录音为什么能形成竞争。A只碰到了其中一个因素，不能因此视为作者已对观众作出相应指控。A的问题不只是内容窄，而是借真实的费用词，补出了原文没有表达的`ignore the expenses`这层人物判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 A选项","focus":[90,1118,905,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":23,"option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q23-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>忽视现场演出的花费。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，<code>expenses<\/code>能和后文的<code>money<\/code>接上。第一轮已经读到费用只是时间、注意力和金钱中的一个因素，也看到后文还写录音的质量与便利，但当时没有据此把A排掉，而是和D一起保留。25题形成主旨后才回查：全文关心录音对传统音乐会的整体竞争，不能把作者对观众的批评落实成“他们忽视费用”这一未经说明的判断，因此最后排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>命题人借用了<code>money<\/code>和<code>cheap<\/code>：艺术活动要争夺公众的金钱，录音也确实便宜。看到这两处，很容易自己补成“忠实观众没有算现场演出的费用”。但原文没有报告这些观众怎样考虑费用；它报告的是他们认为录音不能替代现场。费用因素存在，不等于“观众忽视费用”这个完整判断已经存在。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众忽视了现场演出的花费。<\/p>\n<\/blockquote>\n<p>用题干的<code>devoted concertgoers<\/code>找到第4段开头，再用A的<code>expenses<\/code>去对照后文的<code>money<\/code>和<code>cheap<\/code>。前一个定位词锁定被评价的人，后两个只能找到费用这一话题，不能自动替我们补出这些人对费用的态度。<\/p>\n<p>第一句明说观众认为录音不能替代现场，作者评价他们没有抓住要点。第二句则换成<code>classical instrumentalists<\/code>作主语，说明演奏者要争夺公众的时间、注意力和金钱；第三句的主语又是<code>These recordings<\/code>，介绍录音便宜及其他优势。这几句都没有把“没有考虑费用”作为观众的行为写出来。<\/p>\n<p>A的主语是忠实观众，动作是<code>ignore<\/code>，对象是现场演出的花费。原文提到金钱的那一句，主语却是古典乐器演奏家，动作是<code>compete<\/code>，对象是公众有限的投入。把“演奏者要争夺公众的钱”改成“观众忽视现场费用”，中间缺少关于观众如何判断花费的证据。<\/p>\n<p>此外，作者并列写可得性、质量以及自由选择时间地点，是要解释录音为什么能形成竞争。A只碰到了其中一个因素，不能因此视为作者已对观众作出相应指控。A的问题不只是内容窄，而是借真实的费用词，补出了原文没有表达的<code>ignore the expenses<\/code>这层人物判断。<\/p>\n<\/section>"},{"title":"A. ignore the expenses of live performances","raw":"#### 写作视角法\n\n原文第4段是这样往下写的：\n\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.\n>\n> The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.\n>\n> 录音不仅便宜，还随处可得、艺术质量往往更高、使用时间地点自由；这些录音的广泛可得性给传统音乐会带来了危机。\n\n实际文章从观众强调现场不可替代，转到消费者面对多种选择，再用多项录音优势解释竞争危机。这里的写作任务是说明现场演出的吸引力受到挑战，作者并没有接着检查忠实观众有没有把某笔费用算进去。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Devoted concertgoers fail to take the expense of attending live performances into account when they compare them with inexpensive recordings.\n>\n> 忠实的音乐会观众把现场演出与廉价录音比较时，没有把参加现场演出的花费考虑进去。\n\n假设写法只补出A成立必须有的那条关系：费用被这些观众忽略了。实际文章虽提供录音便宜这个条件，却没有完成“观众比较时漏算费用”的归因；后文还继续转向质量和便利，不能从这些竞争优势反推观众具体漏算了哪项开支。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 A选项","focus":[90,1118,905,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":23,"option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q23-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>忽视现场演出的花费。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，<code>expenses<\/code>能和后文的<code>money<\/code>接上。第一轮已经读到费用只是时间、注意力和金钱中的一个因素，也看到后文还写录音的质量与便利，但当时没有据此把A排掉，而是和D一起保留。25题形成主旨后才回查：全文关心录音对传统音乐会的整体竞争，不能把作者对观众的批评落实成“他们忽视费用”这一未经说明的判断，因此最后排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>命题人借用了<code>money<\/code>和<code>cheap<\/code>：艺术活动要争夺公众的金钱，录音也确实便宜。看到这两处，很容易自己补成“忠实观众没有算现场演出的费用”。但原文没有报告这些观众怎样考虑费用；它报告的是他们认为录音不能替代现场。费用因素存在，不等于“观众忽视费用”这个完整判断已经存在。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众忽视了现场演出的花费。<\/p>\n<\/blockquote>\n<p>用题干的<code>devoted concertgoers<\/code>找到第4段开头，再用A的<code>expenses<\/code>去对照后文的<code>money<\/code>和<code>cheap<\/code>。前一个定位词锁定被评价的人，后两个只能找到费用这一话题，不能自动替我们补出这些 ，仍然需要补上原文没有给出的那条人物判断。\n\n第4段的局部证据让这个差别更清楚：作者先针对“录音不能替代现场”作评价，再列出价格、质量、可得性与便利性，支持的是现场价值被高估，而没有说观众不考虑现场开支。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 A选项","focus":[90,1118,905,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":23,"option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q23-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-A-0\"><blockquote>\n<p>忽视现场演出的花费。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，<code>expenses<\/code>能和后文的<code>money<\/code>接上。第一轮已经读到费用只是时间、注意力和金钱中的一个因素，也看到后文还写录音的质量与便利，但当时没有据此把A排掉，而是和D一起保留。25题形成主旨后才回查：全文关心录音对传统音乐会的整体竞争，不能把作者对观众的批评落实成“他们忽视费用”这一未经说明的判断，因此最后排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>命题人借用了<code>money<\/code>和<code>cheap<\/code>：艺术活动要争夺公众的金钱，录音也确实便宜。看到这两处，很容易自己补成“忠实观众没有算现场演出的费用”。但原文没有报告这些观众怎样考虑费用；它报告的是他们认为录音不能替代现场。费用因素存在，不等于“观众忽视费用”这个完整判断已经存在。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众忽视了现场演出的花费。<\/p>\n<\/blockquote>\n<p>用题干的<code>devoted concertgoers<\/code>找到第4段开头，再用A的<code>expenses<\/code>去对照后文的<code>money<\/code>和<code>cheap<\/code>。前一个定位词锁定被评价的人，后两个只能找到费用这一话题，不能自动替我们补出这些人对费用的态度。<\/p>\n<p>第一句明说观众认为录音不能替代现场，作者评价他们没有抓住要点。第二句则换成<code>classical instrumentalists<\/code>作主语，说明演奏者要争夺公众的时间、注意力和金钱；第三句的主语又是<code>These recordings<\/code>，介绍录音便宜及其他优势。这几句都没有把“没有考虑费用”作为观众的行为写出来。<\/p>\n<p>A的主语是忠实观众，动作是<code>ignore<\/code>，对象是现场演出的花费。原文提到金钱的那一句，主语却是古典乐器演奏家，动作是<code>compete<\/code>，对象是公众有限的投入。把“演奏者要争夺公众的钱”改成“观众忽视现场费用”，中间缺少关于观众如何判断花费的证据。<\/p>\n<p>此外，作者并列写可得性、质量以及自由选择时间地点，是要解释录音为什么能形成竞争。A只碰到了其中一个因素，不能因此视为作者已对观众作出相应指控。A的问题不只是内容窄，而是借真实的费用词，补出了原文没有表达的<code>ignore the expenses<\/code>这层人物判断。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q23-A-2\"><h3>写作视角法<\/h3>\n<p>原文第4段是这样往下写的：<\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<p>录音不仅便宜，还随处可得、艺术质量往往更高、使用时间地点自由；这些录音的广泛可得性给传统音乐会带来了危机。<\/p>\n<\/blockquote>\n<p>实际文章从观众强调现场不可替代，转到消费者面对多种选择，再用多项录音优势解释竞争危机。这里的写作任务是说明现场演出的吸引力受到挑战，作者并没有接着检查忠实观众有没有把某笔费用算进去。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Devoted concertgoers fail to take the expense of attending live performances into account when they compare them with inexpensive recordings.<\/p>\n<p>忠实的音乐会观众把现场演出与廉价录音比较时，没有把参加现场演出的花费考虑进去。<\/p>\n<\/blockquote>\n<p>假设写法只补出A成立必须有的那条关系：费用被这些观众忽略了。实际文章虽提供录音便宜这个条件，却没有完成“观众比较时漏算费用”的归因；后文还继续转向质量和便利，不能从这些竞争优势反推观众具体漏算了哪项开支。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q23-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>作者对忠实观众的批评应当落在：他们过分倚重现场演出的不可替代性，没有正视录音竞争对传统音乐会吸引力的挑战；这也说明Gilbert仅靠增加曲目难以解决问题。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>ignore the expenses of live performances<br>忽视现场演出的花费。<\/p>\n<\/blockquote>\n<p>主旨把问题指向整个现场音乐会体制如何吸引观众，A却落实为观众忽视费用。费用可以参与这种竞争，却不能单独说明这些观众究竟怎样看待费用。把A作为答案，仍然需要补上原文没有给出的那条人物判断。<\/p>\n<p>第4段的局部证据让这个差别更清楚：作者先针对“录音不能替代现场”作评价，再列出价格、质量、可得性与便利性，支持的是现场价值被高估，而没有说观众不考虑现场开支。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. reject most kinds of recorded performances","raw":"### B. reject most kinds of recorded performances\n\n> 拒绝大多数种类的录音演出。\n\n**做题模式中的状态：** 当时B的英文没有遮挡，原文中的`substitute`显示为`[xxx]`。做题材料仍已把观众的意思理解为“录音不能替代现场”，并把这条价值判断与B的“拒绝大多数录音”作比较：前者不能推出拒绝收听的行为，`most kinds`也没有依据，所以第一轮排除B，后续没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nB借用了观众关于录音和现场的比较，把“录音不能取代现场”改成“拒绝大多数种类的录音”。一个人可以平时听录音，同时认为录音无法完整替代现场体验；原文对替代关系的判断，被改成了拒绝行为，还加上`most kinds`这一范围。\n\n**出处：**\n\n> Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 B选项","focus":[90,1203,949,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":23,"option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q23-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>拒绝大多数种类的录音演出。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，原文中的<code>substitute<\/code>显示为<code>[xxx]<\/code>。做题材料仍已把观众的意思理解为“录音不能替代现场”，并把这条价值判断与B的“拒绝大多数录音”作比较：前者不能推出拒绝收听的行为，<code>most kinds<\/code>也没有依据，所以第一轮排除B，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了观众关于录音和现场的比较，把“录音不能取代现场”改成“拒绝大多数种类的录音”。一个人可以平时听录音，同时认为录音无法完整替代现场体验；原文对替代关系的判断，被改成了拒绝行为，还加上<code>most kinds<\/code>这一范围。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. reject most kinds of recorded performances","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者认为，那些忠实的音乐会观众拒绝大多数种类的录音演出。\n\n题干的`devoted concertgoers`和B的`recorded performances`把我们带到第4段开头的观众回应，以及后文对录音竞争的讨论。判断B时，首先要读清观众到底说了什么，不能因为录音这个对象相同就略过动词。\n\n原句的观众作出一个比较判断：`recordings are no substitute for live performance`。`no substitute for`说明他们认为录音不能代替现场；主句`are missing the point`表示作者认为这个回应没有抓到问题，而不是接着报告观众拒听录音。\n\nB把`reply that`引出的看法改成`reject`这一拒绝行为。认为两件东西不能互相取代，与拒绝接受其中一件不是同一回事。比如喜欢在家听CD的人，也可以坚持音乐厅的体验不可替代；原句并没有排除这种情况。\n\n再看`most kinds`，它把拒绝范围扩大为大多数种类。原文没有统计这些观众接受或拒绝哪些录音，连拒绝动作都没有说，更谈不上大多数这一数量范围。\n\n因此，B不是对原句更简洁的概括，而是把“观众怎样判断录音与现场的关系”改成“观众怎样拒绝录音”，并额外加入了原文没有限定的多数范围。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 B选项","focus":[90,1203,949,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":23,"option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q23-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>拒绝大多数种类的录音演出。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，原文中的<code>substitute<\/code>显示为<code>[xxx]<\/code>。做题材料仍已把观众的意思理解为“录音不能替代现场”，并把这条价值判断与B的“拒绝大多数录音”作比较：前者不能推出拒绝收听的行为，<code>most kinds<\/code>也没有依据，所以第一轮排除B，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了观众关于录音和现场的比较，把“录音不能取代现场”改成“拒绝大多数种类的录音”。一个人可以平时听录音，同时认为录音无法完整替代现场体验；原文对替代关系的判断，被改成了拒绝行为，还加上<code>most kinds<\/code>这一范围。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众拒绝大多数种类的录音演出。<\/p>\n<\/blockquote>\n<p>题干的<code>devoted concertgoers<\/code>和B的<code>recorded performances<\/code>把我们带到第4段开头的观众回应，以及后文对录音竞争的讨论。判断B时，首先要读清观众到底说了什么，不能因为录音这个对象相同就略过动词。<\/p>\n<p>原句的观众作出一个比较判断：<code>recordings are no substitute for live performance<\/code>。<code>no substitute for<\/code>说明他们认为录音不能代替现场；主句<code>are missing the point<\/code>表示作者认为这个回应没有抓到问题，而不是接着报告观众拒听录音。<\/p>\n<p>B把<code>reply that<\/code>引出的看法改成<code>reject<\/code>这一拒绝行为。认为两件东西不能互相取代，与拒绝接受其中一件不是同一回事。比如喜欢在家听CD的人，也可以坚持音乐厅的体验不可替代；原句并没有排除这种情况。<\/p>\n<p>再看<code>most kinds<\/code>，它把拒绝范围扩大为大多数种类。原文没有统计这些观众接受或拒绝哪些录音，连拒绝动作都没有说，更谈不上大多数这一数量范围。<\/p>\n<p>因此，B不是对原句更简洁的概括，而是把“观众怎样判断录音与现场的关系”改成“观众怎样拒绝录音”，并额外加入了原文没有限定的多数范围。<\/p>\n<\/section>"},{"title":"B. reject most kinds of recorded performances","raw":"#### 写作视角法\n\n原文第4段是这样写的：\n\n> Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.\n>\n> For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.\n>\n> 作者先指出“录音不能替代现场”这一回应没抓住要点，再说明现场演出事实上必须与大师录音争夺公众的投入。\n\n后文没有调查忠实观众愿意听哪些录音，而是把视野扩大到艺术爱好公众的选择。即使忠实观众坚持现场体验独特，现实中的竞争仍然存在，这才是两句之间的推进。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Devoted concertgoers reject most kinds of recorded performances and generally refuse to listen to them.\n>\n> 忠实的音乐会观众拒绝大多数种类的录音演出，通常不愿收听这些录音。\n\n假设写法必须把“拒绝多数录音”作为观众的实际行为说出来。实际文章只引用他们对替代性的判断，随后讨论竞争，不曾把这种看法发展成拒听行为。B需要的行为线与原文的竞争线不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 B选项","focus":[90,1203,949,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":23,"option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q23-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>拒绝大多数种类的录音演出。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，原文中的<code>substitute<\/code>显示为<code>[xxx]<\/code>。做题材料仍已把观众的意思理解为“录音不能替代现场”，并把这条价值判断与B的“拒绝大多数录音”作比较：前者不能推出拒绝收听的行为，<code>most kinds<\/code>也没有依据，所以第一轮排除B，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了观众关于录音和现场的比较，把“录音不能取代现场”改成“拒绝大多数种类的录音”。一个人可以平时听录音，同时认为录音无法完整替代现场体验；原文对替代关系的判断，被改成了拒绝行为，还加上<code>most kinds<\/code>这一范围。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquot recorded performances","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Doubtful about Gilbert’s ability to revitalize the Philharmonic  \n> 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。\n\n把这个主旨直接代入23题题干：\n\n> 全文主旨只能确认作者认为忠实观众低估了录音对现场音乐会的竞争作用，不能判断他们实际接受或拒绝哪些录音，更不能判断“大多数种类”这一范围。\n\n但B实际说的是：\n\n> reject most kinds of recorded performances  \n> 拒绝大多数种类的录音演出。\n\n作者怀疑Gilbert仅靠曲目能否解决危机，是对现场吸引力及应对办法的判断。B说的则是观众拒听哪些录音，换成了另一种事实；不能因为作者批评观众，就把所有负面行为都安到他们身上。\n\n本项最终仍要根据“recordings are no substitute for live performance”这处局部原文判断。它给出了观众对替代关系的看法，没有给出`reject`的行为及`most kinds`的范围，B把两者补了进去。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 B选项","focus":[90,1203,949,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":23,"option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q23-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-B-0\"><blockquote>\n<p>拒绝大多数种类的录音演出。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，原文中的<code>substitute<\/code>显示为<code>[xxx]<\/code>。做题材料仍已把观众的意思理解为“录音不能替代现场”，并把这条价值判断与B的“拒绝大多数录音”作比较：前者不能推出拒绝收听的行为，<code>most kinds<\/code>也没有依据，所以第一轮排除B，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了观众关于录音和现场的比较，把“录音不能取代现场”改成“拒绝大多数种类的录音”。一个人可以平时听录音，同时认为录音无法完整替代现场体验；原文对替代关系的判断，被改成了拒绝行为，还加上<code>most kinds<\/code>这一范围。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众拒绝大多数种类的录音演出。<\/p>\n<\/blockquote>\n<p>题干的<code>devoted concertgoers<\/code>和B的<code>recorded performances<\/code>把我们带到第4段开头的观众回应，以及后文对录音竞争的讨论。判断B时，首先要读清观众到底说了什么，不能因为录音这个对象相同就略过动词。<\/p>\n<p>原句的观众作出一个比较判断：<code>recordings are no substitute for live performance<\/code>。<code>no substitute for<\/code>说明他们认为录音不能代替现场；主句<code>are missing the point<\/code>表示作者认为这个回应没有抓到问题，而不是接着报告观众拒听录音。<\/p>\n<p>B把<code>reply that<\/code>引出的看法改成<code>reject<\/code>这一拒绝行为。认为两件东西不能互相取代，与拒绝接受其中一件不是同一回事。比如喜欢在家听CD的人，也可以坚持音乐厅的体验不可替代；原句并没有排除这种情况。<\/p>\n<p>再看<code>most kinds<\/code>，它把拒绝范围扩大为大多数种类。原文没有统计这些观众接受或拒绝哪些录音，连拒绝动作都没有说，更谈不上大多数这一数量范围。<\/p>\n<p>因此，B不是对原句更简洁的概括，而是把“观众怎样判断录音与现场的关系”改成“观众怎样拒绝录音”，并额外加入了原文没有限定的多数范围。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q23-B-2\"><h3>写作视角法<\/h3>\n<p>原文第4段是这样写的：<\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>作者先指出“录音不能替代现场”这一回应没抓住要点，再说明现场演出事实上必须与大师录音争夺公众的投入。<\/p>\n<\/blockquote>\n<p>后文没有调查忠实观众愿意听哪些录音，而是把视野扩大到艺术爱好公众的选择。即使忠实观众坚持现场体验独特，现实中的竞争仍然存在，这才是两句之间的推进。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Devoted concertgoers reject most kinds of recorded performances and generally refuse to listen to them.<\/p>\n<p>忠实的音乐会观众拒绝大多数种类的录音演出，通常不愿收听这些录音。<\/p>\n<\/blockquote>\n<p>假设写法必须把“拒绝多数录音”作为观众的实际行为说出来。实际文章只引用他们对替代性的判断，随后讨论竞争，不曾把这种看法发展成拒听行为。B需要的行为线与原文的竞争线不同。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q23-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者认为忠实观众低估了录音对现场音乐会的竞争作用，不能判断他们实际接受或拒绝哪些录音，更不能判断“大多数种类”这一范围。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>reject most kinds of recorded performances<br>拒绝大多数种类的录音演出。<\/p>\n<\/blockquote>\n<p>作者怀疑Gilbert仅靠曲目能否解决危机，是对现场吸引力及应对办法的判断。B说的则是观众拒听哪些录音，换成了另一种事实；不能因为作者批评观众，就把所有负面行为都安到他们身上。<\/p>\n<p>本项最终仍要根据“recordings are no substitute for live performance”这处局部原文判断。它给出了观众对替代关系的看法，没有给出<code>reject<\/code>的行为及<code>most kinds<\/code>的范围，B把两者补了进去。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. exaggerate the variety of live performances","raw":"### C. exaggerate the variety of live performances\n\n> 夸大现场演出的多样性。\n\n**做题模式中的状态：** 当时C的英文没有遮挡，`variety`让人想到后文列出的歌剧、舞团、剧团等文化活动；其中原文的`troupes`当时显示为`[xxx]`。材料随后区分了名单的说话者和作用：这是作者列出的竞争者，不是观众声称现场演出种类丰富，所以第一轮排除C，后续没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\n命题人把原文列举多种文化活动的材料拿过来，把作者展示的竞争范围改成忠实观众对现场演出多样性的夸张评价。原文还提到Gilbert演出的作品很多，但那也是作者承认他的曲目特点，并非观众的夸口。看到种类多，不能就把谁在说、说的是什么一起省掉。\n\n**出处：**\n\n> For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.\n>\n> To be sure, he performs an impressive variety of interesting compositions, but it is not necessary for me to visit Avery Fisher Hall, or anywhere else, to hear interesting orchestral music.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 C选项","focus":[90,1288,951,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":23,"option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q23-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-C-0\"><blockquote>\n<p>夸大现场演出的多样性。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的英文没有遮挡，<code>variety<\/code>让人想到后文列出的歌剧、舞团、剧团等文化活动；其中原文的<code>troupes<\/code>当时显示为<code>[xxx]<\/code>。材料随后区分了名单的说话者和作用：这是作者列出的竞争者，不是观众声称现场演出种类丰富，所以第一轮排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人把原文列举多种文化活动的材料拿过来，把作者展示的竞争范围改成忠实观众对现场演出多样性的夸张评价。原文还提到Gilbert演出的作品很多，但那也是作者承认他的曲目特点，并非观众的夸口。看到种类多，不能就把谁在说、说的是什么一起省掉。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>To be sure, he performs an impressive variety of interesting compositions, but it is not necessary for me to visit Avery Fisher Hall, or anywhere else, to hear interesting orchestral music.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. exaggerate the variety of live performances","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者认为，那些忠实的音乐会观众夸大了现场演出的多样性。\n\n题干要求定位观众的言论，C的`variety`又容易把我们引向第3段的`an impressive variety`以及第4段文化活动的并列清单。两处都与“多”有关系，但必须分别核对它们的主体与评价对象。\n\n第3段的`he performs`主语是Gilbert，作者承认他演出许多有趣作品，再说明自己不必为此去音乐厅。第4段的清单则跟在`classical instrumentalists must compete`后面，列的是古典乐器演奏者争夺公众投入时面对的竞争者。\n\nC的主语却是忠实观众，动作是`exaggerate`，对象是现场演出的多样性。无论把它放到哪一处，原文都没有说这些观众列出了很多演出种类，更没有说他们把实际种类数说大了。\n\n观众真正被引述的观点仍是“录音不能替代现场”。这是对现场价值和体验的判断，不是对节目种类的描述；作者用`missing the point`批评的是前一种说法，不能将批评对象移到`variety`上。\n\nC保留了现场演出这一大话题，却把作者列举竞争者或承认曲目丰富的材料移给观众，再添上“夸大”的评价，改坏了说话主体、信息用途和被批评的内容。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 C选项","focus":[90,1288,951,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":23,"option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q23-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-C-0\"><blockquote>\n<p>夸大现场演出的多样性。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的英文没有遮挡，<code>variety<\/code>让人想到后文列出的歌剧、舞团、剧团等文化活动；其中原文的<code>troupes<\/code>当时显示为<code>[xxx]<\/code>。材料随后区分了名单的说话者和作用：这是作者列出的竞争者，不是观众声称现场演出种类丰富，所以第一轮排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人把原文列举多种文化活动的材料拿过来，把作者展示的竞争范围改成忠实观众对现场演出多样性的夸张评价。原文还提到Gilbert演出的作品很多，但那也是作者承认他的曲目特点，并非观众的夸口。看到种类多，不能就把谁在说、说的是什么一起省掉。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>To be sure, he performs an impressive variety of interesting compositions, but it is not necessary for me to visit Avery Fisher Hall, or anywhere else, to hear interesting orchestral music.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众夸大了现场演出的多样性。<\/p>\n<\/blockquote>\n<p>题干要求定位观众的言论，C的<code>variety<\/code>又容易把我们引向第3段的<code>an impressive variety<\/code>以及第4段文化活动的并列清单。两处都与“多”有关系，但必须分别核对它们的主体与评价对象。<\/p>\n<p>第3段的<code>he performs<\/code>主语是Gilbert，作者承认他演出许多有趣作品，再说明自己不必为此去音乐厅。第4段的清单则跟在<code>classical instrumentalists must compete<\/code>后面，列的是古典乐器演奏者争夺公众投入时面对的竞争者。<\/p>\n<p>C的主语却是忠实观众，动作是<code>exaggerate<\/code>，对象是现场演出的多样性。无论把它放到哪一处，原文都没有说这些观众列出了很多演出种类，更没有说他们把实际种类数说大了。<\/p>\n<p>观众真正被引述的观点仍是“录音不能替代现场”。这是对现场价值和体验的判断，不是对节目种类的描述；作者用<code>missing the point<\/code>批评的是前一种说法，不能将批评对象移到<code>variety<\/code>上。<\/p>\n<p>C保留了现场演出这一大话题，却把作者列举竞争者或承认曲目丰富的材料移给观众，再添上“夸大”的评价，改坏了说话主体、信息用途和被批评的内容。<\/p>\n<\/section>"},{"title":"C. exaggerate the variety of live performances","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.\n>\n> For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.\n>\n> 观众坚持的是现场不可替代；作者随后列举不同文化活动与录音，是为了说明公众的时间、注意力和金钱会被多方争夺。\n\n实际文章用清单把外部竞争铺开。列得越多，越能看出现场音乐会需要面对其他选择；这份清单并不是为了先重现观众的自夸，再逐项驳斥它。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Devoted concertgoers claim that live performances offer a far wider variety than they actually do.\n>\n> 忠实的音乐会观众声称现场演出的种类远比实际丰富。\n\n这种写法只改变C要求的关系：把过度的多样性判断归给观众。原文却没有写观众声称有哪些种类，也没有用实际种类去修正他们的估计；原文以竞争者数量说明现场的压力，C以种类被夸大说明观众认识错误，两条路线讨论的事情不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 C选项","focus":[90,1288,951,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":23,"option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q23-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-C-0\"><blockquote>\n<p>夸大现场演出的多样性。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的英文没有遮挡，<code>variety<\/code>让人想到后文列出的歌剧、舞团、剧团等文化活动；其中原文的<code>troupes<\/code>当时显示为<code>[xxx]<\/code>。材料随后区分了名单的说话者和作用：这是作者列出的竞争者，不是观众声称现场演出种类丰富，所以第一轮排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人把原文列举多种文化活动的材料拿过来，把作者展示的竞争范围改成忠实观众对现场演出多样性的夸张评价。原文还提到Gilbert演出的作品很多，但那也是作者承认他的曲目特点，并非观众的夸口。看到种类多，不能就把谁在说、说的是什么一起省掉。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>To be sure, he performs an impressive variety of interesting compositions, but it is not necessary for me to visit Avery Fisher Hall, or anywhere else, to hear interesting orchestral music.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众夸大了现场演出的多样性。<\/p>\n<\/blockquote>\n<p>题干要求定位观众的言论，C的<code>variety<\/code>又容易把我们引向第3段的<code>an impressive variety<\/code>以及第4段文化活动的并列清单。两处都与“多”有关系，但必须分别核对它们的主体与评价对象。<\/p>\n<p>第3段的<code>he performs<\/code>主语是Gilbert，作者承认他演出许多有趣作品，再说明自己不必为此去音乐厅。第4段的清单则跟在<code>classical instrumentalists must compete<\/code>后面，列的是古典乐器演奏者争夺公众投入时面对的竞争者。<\/p>\n<p>C的主语却是忠实观众，动作是<code>exaggerate<\/code>，对象是现场演出的多样性。无论把它放到哪一处 class=\"revealPart\" id=\"focus-q23-C-2\"><h3>写作视角法<\/h3>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>观众坚持的是现场不可替代；作者随后列举不同文化活动与录音，是为了说明公众的时间、注意力和金钱会被多方争夺。<\/p>\n<\/blockquote>\n<p>实际文章用清单把外部竞争铺开。列得越多，越能看出现场音乐会需要面对其他选择；这份清单并不是为了先重现观众的自夸，再逐项驳斥它。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Devoted concertgoers claim that live performances offer a far wider variety than they actually do.<\/p>\n<p>忠实的音乐会观众声称现场演出的种类远比实际丰富。<\/p>\n<\/blockquote>\n<p>这种写法只改变C要求的关系：把过度的多样性判断归给观众。原文却没有写观众声称有哪些种类，也没有用实际种类去修正他们的估计；原文以竞争者数量说明现场的压力，C以种类被夸大说明观众认识错误，两条路线讨论的事情不同。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q23-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>全文主旨说明作者反对过分依靠现场演出的既有吸引力，认为必须正视录音竞争；它不能证明忠实观众对现场演出的种类作过夸大陈述。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>exaggerate the variety of live performances<br>夸大现场演出的多样性。<\/p>\n<\/blockquote>\n<p>主旨中的问题是现有曲目与现场形式是否足以吸引新观众，C却把观众的错误写成对节目种类数量的夸张。文章最后说扩展曲目不够，也不是说观众把已有曲目数量估错了；“改革不能只靠种类增加”和“有人夸大种类”是两种命题。<\/p>\n<p>本项最终仍要根据“classical instrumentalists must compete”这处局部原文判断。后面的多种文化活动属于作者陈述的竞争环境，不属于观众的夸张话语，C把名单的主体和作用改了。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. overestimate the value of live performances","raw":"### D. overestimate the value of live performances\n\n> 高估现场演出的价值。\n\n**做题模式中的状态：** 当时D显示为`[xxx] the value of live performances`，开头的`overestimate`被遮挡；原文中的`substitute`也显示为`[xxx]`。第一轮能看到现场价值这一对象和作者`missing the point`的批评方向，但还不能确定D的动作词，因此将D与A一起保留。25题形成主旨后再回查，材料把观众坚持现场不可替代与录音的价格、质量、可得性和便利性连起来，最终排除只抓费用的A，选D；D不是第一轮就已确定的答案。\n\n**选项类型：正确局部推断。**\n\n命题人没有照抄`missing the point`，而是结合观众说了什么以及作者怎样反驳，把批评内容概括为`overestimate the value`。观众将现场看得不可替代，作者用录音的现实优势说明这种判断把现场的价值估得过高。这里没有说现场毫无价值，也没有断言任何录音都胜过任何现场。\n\n**出处：**\n\n> Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.\n>\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 D选项","focus":[90,1373,961,60],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":23,"option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q23-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>高估现场演出的价值。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D显示为<code>[xxx] the value of live performances<\/code>，开头的<code>overestimate<\/code>被遮挡；原文中的<code>substitute<\/code>也显示为<code>[xxx]<\/code>。第一轮能看到现场价值这一对象和作者<code>missing the point<\/code>的批评方向，但还不能确定D的动作词，因此将D与A一起保留。25题形成主旨后再回查，材料把观众坚持现场不可替代与录音的价格、质量、可得性和便利性连起来，最终排除只抓费用的A，选D；D不是第一轮就已确定的答案。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>命题人没有照抄<code>missing the point<\/code>，而是结合观众说了什么以及作者怎样反驳，把批评内容概括为<code>overestimate the value<\/code>。观众将现场看得不可替代，作者用录音的现实优势说明这种判断把现场的价值估得过高。这里没有说现场毫无价值，也没有断言任何录音都胜过任何现场。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. overestimate the value of live performances","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者认为，那些忠实的音乐会观众高估了现场演出的价值。\n\n题干的`devoted concertgoers`对应第4段第一句，D的`the value of live performances`对应他们对“录音是否能替代现场”的判断。`overestimate`需要结合作者的批评和后文的比较来确定，不能只因为段内有`live performance`就选择。\n\n第一句分开了两种立场：观众说录音不能代替现场，作者却说他们没抓住重点。后面的录音优势解释了作者为什么这样评价：录音便宜、到处可得，艺术质量往往更高，还能按听众自己的时间地点欣赏。\n\n这些信息共同削弱的是观众所强调的现场不可替代性在现实竞争中的分量。D的主语仍是这些观众，被估计的对象仍是现场演出的价值，`overestimate`则把作者对他们估计偏高的批评说清。\n\n要保留原文的程度：`very often`表示录音艺术质量在很多情况下更高，并不表示每一次都更高。D只说观众高估现场价值，没有把现场说成毫无价值，因此没有越过原文允许的推断范围。\n\n从“观众坚持不可替代”到“作者展示录音多方面的竞争优势”，两部分共同支持“现场价值被估得过高”。D概括的是这组关系，既解释了作者的否定评价，又保留了被评价的人和对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 D选项","focus":[90,1373,961,60],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":23,"option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q23-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>高估现场演出的价值。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D显示为<code>[xxx] the value of live performances<\/code>，开头的<code>overestimate<\/code>被遮挡；原文中的<code>substitute<\/code>也显示为<code>[xxx]<\/code>。第一轮能看到现场价值这一对象和作者<code>missing the point<\/code>的批评方向，但还不能确定D的动作词，因此将D与A一起保留。25题形成主旨后再回查，材料把观众坚持现场不可替代与录音的价格、质量、可得性和便利性连起来，最终排除只抓费用的A，选D；D不是第一轮就已确定的答案。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>命题人没有照抄<code>missing the point<\/code>，而是结合观众说了什么以及作者怎样反驳，把批评内容概括为<code>overestimate the value<\/code>。观众将现场看得不可替代，作者用录音的现实优势说明这种判断把现场的价值估得过高。这里没有说现场毫无价值，也没有断言任何录音都胜过任何现场。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众高估了现场演出的价值。<\/p>\n<\/blockquote>\n<p>题干的<code>devoted concertgoers<\/code>对应第4段第一句，D的<code>the value of live performances<\/code>对应他们对“录音是否能替代现场”的判断。<code>overestimate<\/code>需要结合作者的批评和后文的比较来确定，不能只因为段内有<code>live performance<\/code>就选择。<\/p>\n<p>第一句分开了两种立场：观众说录音不能代替现场，作者却说他们没抓住重点。后面的录音优势解释了作者为什么这样评价：录音便宜、到处可得，艺术质量往往更高，还能按听众自己的时间地点欣赏。<\/p>\n<p>这些信息共同削弱的是观众所强调的现场不可替代性在现实竞争中的分量。D的主语仍是这些观众，被估计的对象仍是现场演出的价值，<code>overestimate<\/code>则把作者对他们估计偏高的批评说清。<\/p>\n<p>要保留原文的程度：<code>very often<\/code>表示录音艺术质量在很多情况下更高，并不表示每一次都更高。D只说观众高估现场价值，没有把现场说成毫无价值，因此没有越过原文允许的推断范围。<\/p>\n<p>从“观众坚持不可替代”到“作者展示录音多方面的竞争优势”，两部分共同支持“现场价值被估得过高”。D概括的是这组关系，既解释了作者的否定评价，又保留了被评价的人和对象。<\/p>\n<\/section>"},{"title":"D. overestimate the value of live performances","raw":"#### 写作视角法\n\n原文第4段是这样往下写的：\n\n> Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.\n>\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.\n>\n> The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.\n>\n> 作者先反驳观众对现场不可替代性的坚持，再列出录音的优势，最后说明录音已给传统音乐会造成危机。\n\n这条路线让“没抓住重点”获得具体含义：观众过分倚重现场的价值，实际听众却有便宜、优质又便利的替代选择。危机不是因为现场突然没有价值，而是现场的价值不足以自动抵消外部竞争。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Devoted concertgoers overrate the value of live performances: inexpensive and convenient recordings can often offer greater artistic quality and compete for the same audience.\n>\n> 忠实的音乐会观众把现场演出的价值估得过高：便宜便利的录音往往能提供更高的艺术质量，并争夺同一群听众。\n\n这种写法需要“现场被抬得过高”和“录音确有足够竞争力”相互配合。原文已有的推进恰好提供了两端：先点出观众的不可替代论，再用录音优势及危机结果回应，D把这条反驳路线概括了出来。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 D选项","focus":[90,1373,961,60],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":23,"option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q23-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q23-D-0\"><blockquote>\n<p>高估现场演出的价值。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D显示为<code>[xxx] the value of live performances<\/code>，开头的<code>overestimate<\/code>被遮挡；原文中的<code>substitute<\/code>也显示为<code>[xxx]<\/code>。第一轮能看到现场价值这一对象和作者<code>missing the point<\/code>的批评方向，但还不能确定D的动作词，因此将D与A一起保留。25题形成主旨后再回查，材料把观众坚持现场不可替代与录音的价格、质量、可得性和便利性连起来，最终排除只抓费用的A，选D；D不是第一轮就已确定的答案。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>命题人没有照抄<code>missing the point<\/code>，而是结合观众说了什么以及作者怎样反驳，把批评内容概括为<code>overestimate the value<\/code>。观众将现场看得不可替代，作者用录音的现实优势说明这种判断把现场的价值估得过高。这里没有说现场毫无价值，也没有断言任何录音都胜过任何现场。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q23-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众高估了现场演出的价值。<\/p>\n<\/blockquote>\n<p>题干的<code>devoted concertgoers<\/code>对应第4段第一句，D的<code>the value of live performances<\/code>对应他们对“录音是否能替代现场”的判断。<code>overestimate<\/code>需要结合作者的批评和后文的比较来确定，不能只因为段内有<code>live performance<\/code>就选择。<\/p>\n<p>第一句分开了两种立场：观众说录音不能代替现场，作者却说他们没抓住重点。后面的录音优势解释了作者为什么这样评价：录音便宜、到处可得，艺术质量往往更高，还能按听众自己的时间地点欣赏。<\/p>\n<p>这些信息共同削弱的是观众所强调的现场不可替代性在现实竞争中的分量。D的主语仍是这些观众，被估计的对象仍是现场演出的价值，<code>overestimate<\/code>则把作者对他们估计偏高的批评说清。<\/p>\n<p>要保留原文的程度：<code>very often<\/code>表示录音艺术质量在很多情况下更高，并不表示每一次都更高。D只说观众高估现场价值，没有把现场说成毫无价值，因此没有越过原文允许的推断范围。<\/p>\n<p>从“观众坚持不可替代”到“作者展示录音多方面的竞争优势”，两部分共同支持“现场价值被估得过高”。D概括的是这组关系，既解释了作者的否定评价，又保留了被评价的人和对象。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q23-D-2\"><h3>写作视角法<\/h3>\n<p>原文第4段是这样往下写的：<\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<p>作者先反驳观众对现场不可替代性的坚持，再列出录音的优势，最后说明录音已给传统音乐会造成危机。<\/p>\n<\/blockquote>\n<p>这条路线让“没抓住重点”获得具体含义：观众过分倚重现场的价值，实际听众却有便宜、优质又便利的替代选择。危机不是因为现场突然没有价值，而是现场的价值不足以自动抵消外部竞争。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Devoted concertgoers overrate the value of live performances: inexpensive and convenient recordings can often offer greater artistic quality and compete for the same audience.<\/p>\n<p>忠实的音乐会观众把现场演出的价值估得过高：便宜便利的录音往往能提供更高的艺术质量，并争夺同一群听众。<\/p>\n<\/blockquote>\n<p>这种写法需要“现场被抬得过高”和“录音确有足够竞争力”相互配合。原文已有的推进恰好提供了两端：先点出观众的不可替代论，再用录音优势及危机结果回应，D把这条反驳路线概括了出来。<\/p>\n<\/section>"},{"title":"D. overestimate the value of live performances","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Doubtful about Gilbert’s ability to revitalize the Philharmonic  \n> 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。\n\n把这个主旨直接代入23题题干：\n\n> 作者认为，忠实观众过分看重现场演出的不可替代价值，忽略了录音竞争已改变听众的选择；这种既有认识不足以应对乐团重振所面对的现实困难。\n\nD实际说的是：\n\n> overestimate the value of live performances  \n> 高估现场演出的价值。\n\n主旨要求看见现场音乐会面临的深层压力，D指出观众对现场价值估计偏高，正好解释他们为什么没有正视这种压力。主体是忠实观众，对象是现场价值，批评方向是估得过高，三者都能与第4段接上。\n\n局部原文又让这条联系落到实处：观众说录音不可替代现场，作者列出录音多项优势并写出音乐会危机。D没有把问题缩成费用，也没有添加拒听行为或种类数量，保留了作者真正批评的价值判断。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题 D选项","focus":[90,1373,961,60],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","qu 。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q23-D-2\"><h3>写作视角法<\/h3>\n<p>原文第4段是这样往下写的：<\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<p>作者先反驳观众对现场不可替代性的坚持，再列出录音的优势，最后说明录音已给传统音乐会造成危机。<\/p>\n<\/blockquote>\n<p>这条路线让“没抓住重点”获得具体含义：观众过分倚重现场的价值，实际听众却有便宜、优质又便利的替代选择。危机不是因为现场突然没有价值，而是现场的价值不足以自动抵消外部竞争。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Devoted concertgoers overrate the value of live performances: inexpensive and convenient recordings can often offer greater artistic quality and compete for the same audience.<\/p>\n<p>忠实的音乐会观众把现场演出的价值估得过高：便宜便利的录音往往能提供更高的艺术质量，并争夺同一群听众。<\/p>\n<\/blockquote>\n<p>这种写法需要“现场被抬得过高”和“录音确有足够竞争力”相互配合。原文已有的推进恰好提供了两端：先点出观众的不可替代论，再用录音优势及危机结果回应，D把这条反驳路线概括了出来。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q23-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>作者认为，忠实观众过分看重现场演出的不可替代价值，忽略了录音竞争已改变听众的选择；这种既有认识不足以应对乐团重振所面对的现实困难。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>overestimate the value of live performances<br>高估现场演出的价值。<\/p>\n<\/blockquote>\n<p>主旨要求看见现场音乐会面临的深层压力，D指出观众对现场价值估计偏高，正好解释他们为什么没有正视这种压力。主体是忠实观众，对象是现场价值，批评方向是估得过高，三者都能与第4段接上。<\/p>\n<p>局部原文又让这条联系落到实处：观众说录音不可替代现场，作者列出录音多项优势并写出音乐会危机。D没有把问题缩成费用，也没有添加拒听行为或种类数量，保留了作者真正批评的价值判断。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<\/section>"},{"title":"23题结论","raw":"### 23题结论\n\n> **23. D. overestimate the value of live performances**\n\nA借用了`money`与录音便宜的事实，却额外补出了“观众忽视现场费用”的判断。\n\nB把“认为录音不能替代现场”改成“拒绝大多数录音”，同时改变动作并扩大范围。\n\nC把作者列举竞争者的材料移给忠实观众，改成他们夸大现场演出的多样性。\n\nD把观众的不可替代论与作者展示的录音优势合起来，准确推断出他们高估现场价值。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[12,1031,1276,404],"sourceW":1696,"sourceH":2551},"meta":{"kind":"conclusion","question":23},"level":3,"html":"<blockquote>\n<p><strong>23. D. overestimate the value of live performances<\/strong><\/p>\n<\/blockquote>\n<p>A借用了<code>money<\/code>与录音便宜的事实，却额外补出了“观众忽视现场费用”的判断。<\/p>\n<p>B把“认为录音不能替代现场”改成“拒绝大多数录音”，同时改变动作并扩大范围。<\/p>\n<p>C把作者列举竞争者的材料移给忠实观众，改成他们夸大现场演出的多样性。<\/p>\n<p>D把观众的不可替代论与作者展示的录音优势合起来，准确推断出他们高估现场价值。<\/p>\n"},{"title":"24题 · 题干、题型与核心出处","raw":"## 24题\n\n> According to the text, which of the following is true of recordings?  \n> 根据文章，下面哪一项对录音的描述是正确的？\n\n### 题型\n\n细节判断题。题干以`recordings`锁定录音，要求判断作者实际说明了录音的哪一项特点。需要逐一核对艺术质量、获取难易、是否改善音乐质量以及收录范围，不能把原文出现过的词直接当成整项成立的依据。\n\n### 核心出处\n\n> For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.\n>\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today's live performances; moreover, they can be \"consumed\" at a time and place of the listener's choosing.\n>\n> The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.\n\n题干中的`recordings`对应第四段的`recorded performances`与`These recordings`。第一句说明录音也是争夺公众时间、注意力和金钱的竞争者；第二句依次列出价格低、容易获得、艺术质量往往较高、欣赏时间地点自由这几项特点；第三句说明录音广泛可得给传统古典音乐会带来的压力。题目问录音的实际特点，因此要先辨清第二句中的并列事实，再检查选项有没有改变比较方向、添加因果，或添上原文没有的范围限制。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[12,1540,1478,405],"sourceW":1696,"sourceH":2551},"meta":{"kind":"question","question":24},"level":2,"html":"<blockquote>\n<p>According to the text, which of the following is true of recordings?<br>根据文章，下面哪一项对录音的描述是正确的？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>细节判断题。题干以<code>recordings<\/code>锁定录音，要求判断作者实际说明了录音的哪一项特点。需要逐一核对艺术质量、获取难易、是否改善音乐质量以及收录范围，不能把原文出现过的词直接当成整项成立的依据。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<\/blockquote>\n<p>题干中的<code>recordings<\/code>对应第四段的<code>recorded performances<\/code>与<code>These recordings<\/code>。第一句说明录音也是争夺公众时间、注意力和金钱的竞争者；第二句依次列出价格低、容易获得、艺术质量往往较高、欣赏时间地点自由这几项特点；第三句说明录音广泛可得给传统古典音乐会带来的压力。题目问录音的实际特点，因此要先辨清第二句中的并列事实，再检查选项有没有改变比较方向、添加因果，或添上原文没有的范围限制。<\/p>\n"},{"title":"A. They are often inferior to live concerts in quality.","raw":"### A. They are often inferior to live concerts in quality.\n\n> 它们在质量上经常不如现场音乐会。\n\n**做题模式中的状态：** 这一项没有选项词语遮挡。当时已经读到`very often much higher in artistic quality than today’s live performances`，把录音与现场演出的比较摆在一起，发现`higher`是更高，`inferior`却是不如；虽然`often`的频率可以对应，高低方向相反仍足以排除。第一轮排除A，后续没有恢复。\n\n**错误类型：第一类——歪曲原意。**\n\nA保留了录音、现场演出和质量这三个要素，也借用了原文的频率信息，却把录音所在的一侧倒了过来。作者说这些录音的艺术质量往往比今天的现场演出高得多，A改成录音经常不如现场音乐会；对象看似齐全，真正决定判断的比较关系已经相反。\n\n**出处：**\n\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today's live performances; moreover, they can be \"consumed\" at a time and place of the listener's choosing.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 A选项","focus":[90,1627,1086,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":24,"option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q24-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>它们在质量上经常不如现场音乐会。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时已经读到<code>very often much higher in artistic quality than today’s live performances<\/code>，把录音与现场演出的比较摆在一起，发现<code>higher<\/code>是更高，<code>inferior<\/code>却是不如；虽然<code>often<\/code>的频率可以对应，高低方向相反仍足以排除。第一轮排除A，后续没有恢复。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A保留了录音、现场演出和质量这三个要素，也借用了原文的频率信息，却把录音所在的一侧倒了过来。作者说这些录音的艺术质量往往比今天的现场演出高得多，A改成录音经常不如现场音乐会；对象看似齐全，真正决定判断的比较关系已经相反。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. They are often inferior to live concerts in quality.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据文章，录音在质量上经常不如现场音乐会。\n\n题干的`recordings`和选项的`quality`共同定位到第四段`These recordings`开头的一句；`live concerts`对应原文作为比较对象的`today's live performances`。本项问的是双方的质量高低，不是录音是否便宜，也不是听众在哪里欣赏。\n\n第一层出处先用`These recordings`确定主语，随后把`cheap`、`available everywhere`和`much higher in artistic quality`并列为这些录音的特点。`higher`后面的`than`引出今天的现场演出，所以更高的一方是录音，较低的一方是作为对照的现场演出。\n\nA的主语`They`仍然指录音，但`inferior to`表示“不如”。把两边都写成“录音与现场演出相比”之后，原文是录音艺术质量较高，A是录音质量较低；这里不是把同一种关系换一种说法，而是交换了比较结果。\n\n原文的`very often`保留了“很经常”的频率，不能读成每一次录音都胜过现场演出；A的`often`也不能让错误方向变成正确方向。比较关系没有对上，频率上存在相近表达并不能弥补它。\n\nA把原文“这些录音的艺术质量往往高于今天的现场演出”，改成“录音经常不如现场音乐会”；改变的是质量比较的方向。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 A选项","focus":[90,1627,1086,61],"sourceW":1696,"sourceH":2551 },{"title":"A. They are often inferior to live concerts in quality.","raw":"#### 写作视角法\n\n原文第四段是这样写的：\n\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today's live performances; moreover, they can be \"consumed\" at a time and place of the listener's choosing.\n>\n> The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.\n>\n> 这些录音价格低、获取方便，艺术质量还往往高于今天的现场演出，而且听众可以自行选择欣赏时间和地点。它们广泛可得，因此给传统古典音乐会带来了危机。\n\n作者把较高的艺术质量与价格、便利并列，说明录音为什么是现场演出不能忽视的竞争者；接下来的`thus`把这组优势接到传统音乐会面临的危机上。\n\n如果A真是作者的意思，文章至少得写成：\n\n> These recordings are cheap and available everywhere, but they are often lower in artistic quality than live concerts.\n>\n> 这些录音虽然便宜、到处可得，但艺术质量经常低于现场音乐会。\n\n这种写法只把本项需要改变的质量关系改成较低，并保留便宜、可得这两点。这样，质量就会成为录音的短处，作者只能靠其他优势解释它的竞争力。实际文章却将较高质量本身也列为录音的竞争优势，并没有作出这一步让步。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 A选项","focus":[90,1627,1086,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":24,"option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q24-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>它们在质量上经常不如现场音乐会。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时已经读到<code>very often much higher in artistic quality than today’s live performances<\/code>，把录音与现场演出的比较摆在一起，发现<code>higher<\/code>是更高，<code>inferior<\/code>却是不如；虽然<code>often<\/code>的频率可以对应，高低方向相反仍足以排除。第一轮排除A，后续没有恢复。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A保留了录音、现场演出和质量这三个要素，也借用了原文的频率信息，却把录音所在的一侧倒了过来。作者说这些录音的艺术质量往往比今天的现场演出高得多，A改成录音经常不如现场音乐会；对象看似齐全，真正决定判断的比较关系已经相反。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a
