释它的竞争力。实际文章却将较高质量本身也列为录音的竞争优势，并没有作出这一步让步。<\/p>\n<\/section>"},{"title":"A. They are often inferior to live concerts in quality.","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Doubtful about Gilbert’s ability to revitalize the Philharmonic  \n> 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。\n\n把这个主旨直接代入24题题干：\n\n> 全文主旨只能确认作者对Gilbert重振乐团持有保留态度，不能判断本项中录音与现场音乐会的具体质量高低关系。\n\n但A实际说的是：\n\n> They are often inferior to live concerts in quality.  \n> 它们在质量上经常不如现场音乐会。\n\n主旨回答的是作者怎样看Gilbert重振乐团的前景，A回答的是两种音乐欣赏形式的质量比较；主语和判断层次不同，不能只凭“怀疑重振前景”就倒推出录音必定更好或更差。\n\n本项最终仍要根据“very often much higher in artistic quality than today's live performances”这处局部原文判断。作者把录音放在质量较高的一侧，A的`inferior to`把它放在较低的一侧；这与原句的比较方向相反。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 A选项","focus":[90,1627,1086,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":24,"option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q24-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-A-0\"><blockquote>\n<p>它们在质量上经常不如现场音乐会。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时已经读到<code>very often much higher in artistic quality than today’s live performances<\/code>，把录音与现场演出的比较摆在一起，发现<code>higher<\/code>是更高，<code>inferior<\/code>却是不如；虽然<code>often<\/code>的频率可以对应，高低方向相反仍足以排除。第一轮排除A，后续没有恢复。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A保留了录音、现场演出和质量这三个要素，也借用了原文的频率信息，却把录音所在的一侧倒了过来。作者说这些录音的艺术质量往往比今天的现场演出高得多，A改成录音经常不如现场音乐会；对象看似齐全，真正决定判断的比较关系已经相反。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q24-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，录音在质量上经常不如现场音乐会。<\/ he Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对Gilbert重振乐团持有保留态度，不能判断本项中录音与现场音乐会的具体质量高低关系。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>They are often inferior to live concerts in quality.<br>它们在质量上经常不如现场音乐会。<\/p>\n<\/blockquote>\n<p>主旨回答的是作者怎样看Gilbert重振乐团的前景，A回答的是两种音乐欣赏形式的质量比较；主语和判断层次不同，不能只凭“怀疑重振前景”就倒推出录音必定更好或更差。<\/p>\n<p>本项最终仍要根据“very often much higher in artistic quality than today&#39;s live performances”这处局部原文判断。作者把录音放在质量较高的一侧，A的<code>inferior to<\/code>把它放在较低的一侧；这与原句的比较方向相反。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. They are easily accessible to the general public.","raw":"### B. They are easily accessible to the general public.\n\n> 普通公众很容易获得这些录音。\n\n**做题模式中的状态：** 当时`accessible`被遮挡成`[xxx]`，选项呈现为`They are easily [xxx] to the general public.`。已读到的`easily`、`general public`能够接上原文的`cheap`、`available everywhere`，但核心词当时仍不能确认，因此第一轮先保留B；A、C、D均排除后，B是唯一留下的一项，随后选择B，后续没有改变。\n\n**选项类型：正确同义改写。**\n\nB把`available everywhere`所说的“到处都能获得”，换成`easily accessible`所说的“容易获得”。原文的`cheap`进一步说明价格不是很高的门槛，前面的`art-loving public`给出这些录音争夺的公众受众；选项概括的是录音获取方便这一特点，没有把“普通公众能方便获得”说成“所有人都已经购买或欣赏”。\n\n**出处：**\n\n> For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.\n>\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today's live performances; moreover, they can be \"consumed\" at a time and place of the listener's choosing.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 B选项","focus":[90,1712,1047,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":24,"option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q24-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-B-0\"><blockquote>\n<p>普通公众很容易获得这些录音。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>accessible<\/code>被遮挡成<code>[xxx]<\/code>，选项呈现为<code>They are easily [xxx] to the general public.<\/code>。已读到的<code>easily<\/code>、<code>general public<\/code>能够接上原文的<code>cheap<\/code>、<code>available everywhere<\/code>，但核心词当时仍不能确认，因此第一轮先保留B；A、C、D均排除后，B是唯一留下的一项，随后选择B，后续没有改变。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>B把<code>available everywhere<\/code>所说的“到处都能获得”，换成<code>easily accessible<\/code>所说的“容易获得”。原文的<code>cheap<\/code>进一步说明价格不是很高的门槛，前面的<code>art-loving public<\/code>给出这些录音争夺的公众受众；选项概括的是录音获取方便这一特点，没有把“普通公众能方便获得”说成“所有人都已经购买或欣赏”。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. They are easily accessible to the general public.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 根据文章，普通公众很容易获得这些录音。\n\n`recordings`指向第四段的`These recordings`，`easily accessible`对应同一句的`available everywhere`，`general public`则把获取者明确为普通公众。判断重点在`accessible`，这里表示“可以获得、可以接触到”，不是“内容容易理解”。\n\n第一层的第一句写古典器乐演奏者与录音都要争夺公众的时间、注意力和金钱，说明讨论的是面向公众的音乐资源；第二句紧接着写这些录音`cheap, available everywhere`，说明公众获取它们时既有价格上的便利，也有渠道上的便利。\n\n原文和B的对象都是录音，关系都是录音与听众之间的可获得性。`available everywhere`从供应一侧说“很多地方都能得到”，`accessible to the general public`从听众一侧说“公众可以接触、获得”；两种表达把同一件事分别放在资源和使用者的角度说。\n\n`easily`概括了到处可得带来的方便。它没有要求每个人都实际拥有录音，也没有断言每个人都喜欢古典音乐；`general public`说明这并非只向少数专业人士开放的资源，而不是把公众偏好说成一致。\n\nB准确改写的是原文“录音便宜且到处可得”中的获取便利；`accessible`恢复完整词义后，原文与选项之间的对应也就清楚了。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 B选项","focus":[90,1712,1047,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":24,"option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q24-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-B-0\"><blockquote>\n<p>普通公众很容易获得这些录音。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>accessible<\/code>被遮挡成<code>[xxx]<\/code>，选项呈现为<code>They are easily [xxx] to the general public.<\/code>。已读到的<code>easily<\/code>、<code>general public<\/code>能够接上原文的<code>cheap<\/code>、<code>available everywhere<\/code>，但核心词当时仍不能确认，因此第一轮先保留B；A、C、D均排除后，B是唯一留下的一项，随后选择B，后续没有改变。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>B把<code>available everywhere<\/code>所说的“到处都能获得”，换成<code>easily accessible<\/code>所说的“容易获得”。原文的<code>cheap<\/code>进一步说明价格不是很高的门槛，前面的<code>art-loving public<\/code>给出这些录音争夺的公众受众；选项概括的是录音获取方便这一特点，没有把“普通公众能方便获得”说成“所有人都已经购买或欣赏”。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q24-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，普通公众很容易获得这些录音。<\/p>\n<\/blockquote>\n<p><code>recordings<\/code>指向第四段的<code>These recordings<\/code>，<code>easily accessible<\/code>对应同一句的<code>available everywhere<\/code>，<code>general public<\/code>则把获取者明确为普通公众。判断重点在<code>accessible<\/code>，这里表示“可以获得、可以接触到”，不是“内容容易理解”。<\/p>\n<p>第一层的第一句写古典器乐演奏者与录音都要争夺公众的时间、注意力和金钱，说明讨论的是面向公众的音乐资源；第二句紧接着写这些录音<code>cheap, available everywhere<\/code>，说明公众获取它们时既有价格上的便利，也有渠道上的便利。<\/p>\n<p>原文和B的对象都是录音，关系都是录音与听众之间的可获得性。<code>available everywhere<\/code>从供应一侧说“很多地方都能得到”，<code>accessible to the general public<\/code>从听众一侧说“公众可以接触、获得”；两种表达把同一件事分别放在资源和使用者的角度说。<\/p>\n<p><code>easily<\/code>概括了到处可得带来的方便。它没有要求每个人都实际拥有录音，也没有断言每个人都喜欢古典音乐；<code>general public<\/code>说明这并非只向少数专业人士开放的资源，而不是把公众偏好说成一致。<\/p>\n<p>B准确改写的是原文“录音便宜且到处可得”中的获取便利；<code>accessible<\/code>恢复完整词义后，原文与选项之间的对应也就清楚了。<\/p>\n<\/section>"},{"title":"B. They are easily accessible to the general public.","raw":"#### 写作视角法\n\n原文第三、四段是这样写的：\n\n> All I have to do is to go to my CD shelf, or boot up my computer and download still more recorded music from iTunes.\n>\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today's live performances; moreover, they can be \"consumed\" at a time and place of the listener's choosing.\n>\n> 作者拿取自己的CD或开电脑下载，就能听到更多录制音乐；随后把个人经历扩展为录音便宜、到处可得、欣赏时间地点自由的一般特点。\n\n文章先用“拿CD、开电脑下载”展示获取录音有多方便，再把这种便利放到公众选择音乐欣赏方式的竞争中。录音容易进入听众生活，正是它能给现场音乐会造成压力的一项原因。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Recordings are inexpensive and widely available, so ordinary listeners can obtain them easily.\n>\n> 录音价格不高，而且广泛可得，因此普通听众可以方便地获得它们。\n\n这个假设只把原文已有的价格、可得性与普通听众的获取过程接起来，没有再添加特殊渠道或资格。它所需要的写法在实际文章中已经出现：作者的CD和下载经历给出具体例子，第四段的`cheap, available everywhere`给出概括，方向与B一致。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 B选项","focus":[90,1712,1047,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":24,"option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q24-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-B-0\"><blockquote>\n<p>普通公众很容易获得这些录音。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>accessible<\/co 中的获取便利；<code>accessible<\/code>恢复完整词义后，原文与选项之间的对应也就清楚了。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q24-B-2\"><h3>写作视角法<\/h3>\n<p>原文第三、四段是这样写的：<\/p>\n<blockquote>\n<p>All I have to do is to go to my CD shelf, or boot up my computer and download still more recorded music from iTunes.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<p>作者拿取自己的CD或开电脑下载，就能听到更多录制音乐；随后把个人经历扩展为录音便宜、到处可得、欣赏时间地点自由的一般特点。<\/p>\n<\/blockquote>\n<p>文章先用“拿CD、开电脑下载”展示获取录音有多方便，再把这种便利放到公众选择音乐欣赏方式的竞争中。录音容易进入听众生活，正是它能给现场音乐会造成压力的一项原因。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Recordings are inexpensive and widely available, so ordinary listeners can obtain them easily.<\/p>\n<p>录音价格不高，而且广泛可得，因此普通听众可以方便地获得它们。<\/p>\n<\/blockquote>\n<p>这个假设只把原文已有的价格、可得性与普通听众的获取过程接起来，没有再添加特殊渠道或资格。它所需要的写法在实际文章中已经出现：作者的CD和下载经历给出具体例子，第四段的<code>cheap, available everywhere<\/code>给出概括，方向与B一致。<\/p>\n<\/section>"},{"title":"B. They are easily accessible to the general public.","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Doubtful about Gilbert’s ability to revitalize the Philharmonic  \n> 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。\n\n把这个主旨直接代入24题题干：\n\n> 全文主旨只能确认作者怀疑现有做法是否足以重振乐团，不能判断本项中普通公众获得录音是否容易这一具体特点。\n\nB实际说的是：\n\n> They are easily accessible to the general public.  \n> 普通公众很容易获得这些录音。\n\n主旨中的怀疑指向Gilbert与乐团能否成功，B的主体是录音，判断的是公众获取它的便利程度。容易获得的录音可以成为理解竞争压力的一条理由，但不能仅凭作者持怀疑态度就认定这条局部理由已经成立。\n\n本项最终仍要根据“cheap, available everywhere”这处局部原文判断。原文明确说明价格低、到处可得，B用`easily accessible`概括普通公众方便获得的特点，保持了同一对象和同一方向。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 B选项","focus":[90,1712,1047,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":24,"option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q24-B-3","html":"<secti :"C. They help improve the quality of music.","raw":"### C. They help improve the quality of music.\n\n> 它们有助于提高音乐质量。\n\n**做题模式中的状态：** 这一项没有选项词语遮挡。当时把`help improve the quality of music`接回题干，与原文“录音的艺术质量往往高于现场演出”相比，发现原文只作现有质量的高低比较，C却加入录音促进音乐质量提升的因果动作。第一轮排除C，后续没有恢复。\n\n**错误类型：第一类——歪曲原意。**\n\nC借用了原文的`quality`，却把“录音自身的艺术质量较高”改成“录音能帮助音乐质量提高”。前者比较两类现成演出的质量，后者需要说明录音怎样促进创作、演奏或音乐发展；评价对象与它们之间的关系都发生了变化。\n\n**出处：**\n\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today's live performances; moreover, they can be \"consumed\" at a time and place of the listener's choosing.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 C选项","focus":[90,1797,893,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":24,"option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q24-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>它们有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时把<code>help improve the quality of music<\/code>接回题干，与原文“录音的艺术质量往往高于现场演出”相比，发现原文只作现有质量的高低比较，C却加入录音促进音乐质量提升的因果动作。第一轮排除C，后续没有恢复。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了原文的<code>quality<\/code>，却把“录音自身的艺术质量较高”改成“录音能帮助音乐质量提高”。前者比较两类现成演出的质量，后者需要说明录音怎样促进创作、演奏或音乐发展；评价对象与它们之间的关系都发生了变化。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. They help improve the quality of music.","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 根据文章，录音有助于提高音乐质量。\n\n`recordings`和`quality`把我们带到第四段`These recordings`开头的一句。虽然两个词都出现了，但需要继续检查原文到底是在描述录音具有怎样的质量，还是在说明录音导致了怎样的质量变化。\n\n第一层出处说这些录音`very often much higher in artistic quality than today's live performances`。`higher ... than ...`构成比较，比较的一端是这些录音，另一端是今天的现场演出；原句没有描述音乐质量从较低到较高的发展过程。\n\nC的`They help improve`让录音成为推动变化的因素，`the quality of music`成为被改善的对象。这样就需要有一条“因为使用、传播或学习录音，音乐质量得到提高”的因果关系，而不再只是说明录音自身表现得较好。\n\n“某份演奏录音比今天某些现场演出质量高”可以说明听众有更好的欣赏选择，却不能证明这份录音让其他音乐变得更好。原文没有写音乐家通过录音改进技巧，也没有写录音促进了创作质量的上升；这些都是C要成立还需补出的内容。\n\nC把原句的静态质量比较改成了促进质量改善的作用。`quality`虽然相同，`are ... higher`与`help improve`承担的关系不同，不能互换。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 C选项","focus":[90,1797,893,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":24,"option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q24-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>它们有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时把<code>help improve the quality of music<\/code>接回题干，与原文“录音的艺术质量往往高于现场演出”相比，发现原文只作现有质量的高低比较，C却加入录音促进音乐质量提升的因果动作。第一轮排除C，后续没有恢复。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了原文的<code>quality<\/code>，却把“录音自身的艺术质量较高”改成“录音能帮助音乐质量提高”。前者比较两类现成演出的质量，后者需要说明录音怎样促进创作、演奏或音乐发展；评价对象与它们之间的关系都发生了变化。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q24-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，录音有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p><code>recordings<\/code>和<code>quality<\/code>把我们带到第四段<code>These recordings<\/code>开头的一句。虽然两个词都出现了，但需要继续检查原文到底是在描述录音具有怎样的质量，还是在说明录音导致了怎样的质量变化。<\/p>\n<p>第一层出处说这些录音<code>very often much higher in artistic quality than today&#39;s live performances<\/code>。<code>higher ... than ...<\/code>构成比较，比较的一端是这些录音，另一端是今天的现场演出；原句没有描述音乐质量从较低到较高的发展过程。<\/p>\n<p>C的<code>They help improve<\/code>让录音成为推动变化的因素，<code>the quality of music<\/code>成为被改善的对象。这样就需要有一条“因为使用、传播或学习录音，音乐质量得到提高”的因果关系，而不再只是说明录音自身表现得较好。<\/p>\n<p>“某份演奏录音比今天某些现场演出质量高”可以说明听众有更好的欣赏选择，却不能证明这份录音让其他音乐变得更好。原文没有写音乐家通过录音改进技巧，也没有写录音促进了创作质量的上升；这些都是C要成立还需补出的内容。<\/p>\n<p>C把原句的静态质量比较改成了促进质量改善的作用。<code>quality<\/code>虽然相同，<code>are ... higher<\/code>与<code>help improve<\/code>承担的关系不同，不能互换。<\/p>\n<\/section>"},{"title":"C. They help improve the quality of music.","raw":"#### 写作视角法\n\n原文第四段是这样写的：\n\n> These recordings are cheap, available everywhere, and very often much higher in artistic quality than today's live performances; moreover, they can be \"consumed\" at a time and place of the listener's choosing.\n>\n> The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.\n>\n> 作者先列出录音的价格、可得性、艺术质量和欣赏便利，接着说它们广泛可得给传统古典音乐会带来了危机。\n\n作者从“听众有这些录音可以选择”往下写到“现场音乐会面临竞争”。这里明确写出的后果是传统音乐会受到压力，较高质量是录音已有的优势，并不是录音带来的音乐进步。\n\n如果C真是作者的意思，文章至少得写成：\n\n> By studying these recordings, today's musicians can improve the artistic quality of their performances.\n>\n> 通过学习这些录音，今天的音乐家可以提高自己演奏的艺术质量。\n\n这段假设只补出C需要的最小桥梁：音乐家使用录音作为学习资源，因而使演奏质量提高。实际文章没有沿着“录音—学习—质量改进”写，而是沿着“录音有优势—听众有替代选择—现场音乐会承压”写；两条路线的作用对象和结果不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 C选项","focus":[90,1797,893,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":24,"option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q24-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>它们有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时把<code>help improve the quality of music<\/code>接回题干，与原文“录音的艺术质量往往高于现场演出”相比，发现原文只作现有质量的高低比较，C却加入录音促进音乐质量提升的因果动作。第一轮排除C，后续没有恢复。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了原文的<code>quality<\/code>，却把“录音自身的艺术质量较高”改成“录音能帮助音乐质量提高”。前者比较两类现成演出的质量，后者需要说明录音怎样促进创作、演奏或音乐发展；评价对象与它们之间的关系都发生了变化。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q24-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，录音有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p><code>recordings<\/code>和<code>quality<\/code>把我们带到第四段<code>These recordings<\/code>开头的一句。虽然两个词都出现了，但需要继续检查原文到底是在描述录音具有怎样的质量，还是在说明录音导致了怎样的质量变化。<\/p>\n<p>第一层出处说这些录音<code>very often much higher in artistic quality than today&#39;s live performances<\/code>。<code>higher ... than ...<\/code>构成比较，比较的一端是这些录音，另一端是今天的现场演出；原句没有描述音乐质量从较低到较高的发展过程。<\/p>\n<p>C的<code>They help improve<\/code>让录音成为推动变化的因素，<code>the quality of music<\/code>成为被改善的对象。这样就需要有一条“因为使用、传播或学习录音，音乐质量得到提高”的因果关系，而不再只是说明录音自身表现得较好。<\/p>\n<p>“某份演奏录音比今天某些现场演出质量高”可以说明听众有更好的欣赏选择，却不能证明这份录音让其他音乐变得更好。原文没有写音乐家通过录音改进技巧，也没有写录音促进了创作质量的上升；这些都是C要成立还需补出的内容。<\/p>\n<p>C把原句的静态质量比较改成了促进质量改善的作用。<code>quality<\/code>虽然相同，<code>are ... higher<\/code>与<code>help improve<\/code>承担的关系不同，不能互换。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q24-C-2\"><h3>写作视角法<\/h3>\n<p>原文第四段是这样写的：<\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<p>作者先列出录音的价格、可得性、艺术质量和欣赏便利，接着说它们广泛可得给传统古典音乐会带来了危机。<\/p>\n<\/blockquote>\n<p>作者从“听众有这些录音可以选择”往下写到“现场音乐会面临竞争”。这里明确写出的后果是传统音乐会受到压力，较高质量是录音已有的优势，并不是录音带来的音乐进步。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>By studying these recordings, today&#39;s musicians can improve the artistic quality of their performances.<\/p>\n<p>通过学习这些录音，今天的音乐家可以提高自己演奏的艺术质量。<\/p>\n<\/blockquote>\n<p>这段假设只补出C需要的最小桥梁：音乐家使用录音作为学习资源，因而使演奏质量提高。实际文章没有沿着“录音—学习—质量改进”写，而是沿着“录音有优势—听众有替代选择—现场音乐会承压”写；两条路线的作用对象和结果不同。<\/p>\n<\/section>"},{"title":"C. They help improve the quality of music.","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Doubtful about Gilbert’s ability to revitalize the Philharmonic  \n> 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。\n\n把这个主旨直接代入24题题干：\n\n> 全文主旨只能确认作者对Gilbert重振乐团持有疑虑，不能判断本项中录音是否帮助提高音乐质量这一具体因果关系。\n\n但C实际说的是：\n\n> They help improve the quality of music.  \n> 它们有助于提高音乐质量。\n\n“怀疑一位音乐总监能否重振乐团”与“录音能否帮助音乐进步”可以是两个不同问题。不能因为作者强调竞争压力，就反过来声称录音绝不可能帮助音乐进步；也不能把这项作用当作全文主旨自动提供的事实。\n\n本项最终仍要根据“much higher in artistic quality than today's live performances”这处局部原文判断。这句话比较的是已有录音与现场演出的质量高低，C说的却是录音帮助提高音乐质量，原文的比较不能承担这条新增因果关系。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 C选项","focus":[90,1797,893,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":24,"option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q24-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-C-0\"><blockquote>\n<p>它们有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时把<code>help improve the quality of music<\/code>接回题干，与原文“录音的艺术质量往往高于现场演出”相比，发现原文只作现有质量的高低比较，C却加入录音促进音乐质量提升的因果动作。第一轮排除C，后续没有恢复。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了原文的<code>quality<\/code>，却把“录音自身的艺术质量较高”改成“录音能帮助音乐质量提高”。前者比较两类现成演出的质量，后者需要说明录音怎样促进创作、演奏或音乐发展；评价对象与它们之间的关系都发生了变化。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q24-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，录音有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p><code>recordings<\/code>和<code>quality<\/code>把我们带到第四段<code>These recordings<\/code>开头的一句。虽然两个词都出现了，但需要继续检查原文到底是在描述录音具有怎样的质量，还是在说明录音导致了怎样的质量变化。<\/p>\n<p>第一层出处说这些录音<code>very often much higher in artistic quality than today&#39;s live performances<\/code>。<code>higher ... than ...<\/code>构成比较，比较的一端是这些录音，另一端是今天的现场演出；原句没有描述音乐质量从较低到较高的发展过程。<\/p>\n<p>C的<code>They help improve<\/code>让录音成为推动变化的因素，<code>the quality of music<\/code>成为被改善的对象。这样就需要有一条“因为使用、传播或学习录音，音乐质量得到提高”的因果关系，而不再只是说明录音自身表现得较好。<\/p>\n<p>“某份演奏录音比今天某些现场演出质量高”可以说明听众有更好的欣赏选择，却不能证明这份录音让其他音乐变得更好。原文没有写音乐家通过录音改进技巧，也没有写录音促进了创作质量的上升；这些都是C要成立还需补出的内容。<\/p>\n<p>C把原句的静态质量比较改成了促进质量改善的作用。<code>quality<\/code>虽然相同，<code>are ... higher<\/code>与<code>help improve<\/code>承担的关系不同，不能互换。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q24-C-2\"><h3>写作视角法<\/h3>\n<p>原文第四段是这样写的：<\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<p>作者先列出录音的价格、可得性、艺术质量和欣赏便利，接着说它们广泛可得给传统古典音乐会带来了危机。<\/p>\n<\/blockquote>\n<p>作者从“听众有这些录音可以选择”往下写到“现场音乐会面临竞争”。这里明确写出的后果是传统音乐会受到压力，较高质量是录音已有的优势，并不是录音带来的音乐进步。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>By studying these recordings, today&#39;s musicians can improve the artistic quality of their performances.<\/p>\n<p>通过学习这些录音，今天的音乐家可以提高自己演奏的艺术质量。<\/p>\n<\/blockquote>\n<p>这段假设只补出C需要的最小桥梁：音乐家使用录音作为学习资源，因而使演奏质量提高。实际文章没有沿着“录音—学习—质量改进”写，而是沿着“录音有优势—听众有替代选择—现场音乐会承压”写；两条路线的作用对象和结果不同。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q24-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对Gilbert重振乐团持有疑虑，不能判断本项中录音是否帮助提高音乐质量这一具体因果关系。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>They help improve the quality of music.<br>它们有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p>“怀疑一位音乐总监能否重振乐团”与“录音能否帮助音乐进步”可以是两个不同问题。不能因为作者强调竞争压力，就反过来声称录音绝不可能帮助音乐进步；也不能把这项作用当作全文主旨自动提供的事实。<\/p>\n<p>本项最终仍要根据“much higher in artistic quality than today&#39;s live performances”这处局部原文判断。这句话比较的是已有录音与现场演出的质量高低，C说的却是录音帮助提高音乐质量，原文的比较不能承担这条新增因果关系。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. They have only covered masterpieces.","raw":"### D. They have only covered masterpieces.\n\n> 它们只收录了杰作。\n\n**做题模式中的状态：** 这一项没有选项词语遮挡。当时从`recorded performances of the great classical musicians`想到杰出音乐家的录音，但继续检查`only`，发现举出这种高质量资源不等于限定全部录音只收杰作。文中没有排除普通作品、新作品和其他录音的收录可能，第一轮排除D，后续没有恢复。\n\n**错误类型：第三类——无中生有。**\n\nD借用“20世纪伟大古典音乐家的录制演出”，把对音乐家的评价移到作品类别上，又加上`only`，把录音内容限定为只有杰作。原文是在举出现场音乐会面对的一类有竞争力的录音，没有给出所有录音的收录规则，也没有说杰出音乐家的每一项录音都只能对应杰作。\n\n**命题人借用的原文材料：**\n\n> For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.\n>\n> One possible response is for classical performers to program attractive new music that is not yet available on record.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 D选项","focus":[90,1882,846,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":24,"option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q24-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-D-0\"><blockquote>\n<p>它们只收录了杰作。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时从<code>recorded performances of the great classical musicians<\/code>想到杰出音乐家的录音，但继续检查<code>only<\/code>，发现举出这种高质量资源不等于限定全部录音只收杰作。文中没有排除普通作品、新作品和其他录音的收录可能，第一轮排除D，后续没有恢复。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用“20世纪伟大古典音乐家的录制演出”，把对音乐家的评价移到作品类别上，又加上<code>only<\/code>，把录音内容限定为只有杰作。原文是在举出现场音乐会面对的一类有竞争力的录音，没有给出所有录音的收录规则，也没有说杰出音乐家的每一项录音都只能对应杰作。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>One possible response is for classical performers to program attractive new music that is not yet available on record.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. They have only covered masterpieces.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据文章，录音只收录了杰作。\n\n题干的`recordings`对应第四段的`recorded performances`，D的`masterpieces`容易使人联想到同一句的`great classical musicians`。但`only`要求的不只是找到优质音乐资源，还要找到“收录内容仅限于杰作、其他内容不包括在内”的限制。\n\n第一层第一处出处把20世纪伟大古典音乐家的录音列为古典器乐演奏者需要面对的竞争者。它回答的是“现场演出还与哪些资源竞争”，没有罗列录音全部收录什么；`great`修饰的是`musicians`，也不是一个用来划定作品类别的词。\n\nD把主语扩成题干所问的录音，并用`have only covered`给它附上一条排他性的收录结论。提到杰出音乐家的演出，只能说明这类录音存在并有竞争力，不能说明其他演出或作品都没有被录制。\n\n第一层第二处出处说可以安排“尚未有录音的有吸引力的新音乐”。`not yet`限定的是这类新音乐目前尚未录制的状态；作者并没有接着说因为它们不是杰作，所以录音永远不会收录。不能把某些新音乐暂时没有录音，反推成录音仅收杰作的规则。\n\nD先把音乐家的声望换成作品必须属于杰作，再用`only`排除其他全部收录内容。这两个限定都没有原文依据，完整的“只收录杰作”命题因此无法从出处得到。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 D选项","focus":[90,1882,846,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":24,"option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q24-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-D-0\"><blockquote>\n<p>它们只收录了杰作。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时从<code>recorded performances of the great classical musicians<\/code>想到杰出音乐家的录音，但继续检查<code>only<\/code>，发现举出这种高质量资源不等于限定全部录音只收杰作。文中没有排除普通作品、新作品和其他录音的收录可能，第一轮排除D，后续没有恢复。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用“20世纪伟大古典音乐家的录制演出”，把对音乐家的评价移到作品类别上，又加上<code>only<\/code>，把录音内容限定为只有杰作。原文是在举出现场音乐会面对的一类有竞争力的录音，没有给出所有录音的收录规则，也没有说杰出音乐家的每一项录音都只能对应杰作。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>One possible response is for classical performers to program attractive new music that is not yet available on record.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q24-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，录音只收录了杰作。<\/p>\n<\/blockquote>\n<p>题干的<code>recordings<\/code>对应第四段的<code>recorded performances<\/code>，D的<code>masterpieces<\/code>容易使人联想到同一句的<code>great classical musicians<\/code>。但<code>only<\/code>要求的不只是找到优质音乐资源，还要找到“收录内容仅限于杰作、其他内容不包括在内”的限制。<\/p>\n<p>第一层第一处出处把20世纪伟大古典音乐家的录音列为古典器乐演奏者需要面对的竞争者。它回答的是“现场演出还与哪些资源竞争”，没有罗列录音全部收录什么；<code>great<\/code>修饰的是<code>musicians<\/code>，也不是一个用来划定作品类别的词。<\/p>\n<p>D把主语扩成题干所问的录音，并用<code>have only covered<\/code>给它附上一条排他性的收录结论。提到杰出音乐家的演出，只能说明这类录音存在并有竞争力，不能说明其他演出或作品都没有被录制。<\/p>\n<p>第一层第二处出处说可以安排“尚未有录音的有吸引力的新音乐”。<code>not yet<\/code>限定的是这类新音乐目前尚未录制的状态；作者并没有接着说因为它们不是杰作，所以录音永远不会收录。不能把某些新音乐暂时没有录音，反推成录音仅收杰作的规则。<\/p>\n<p>D先把音乐家的声望换成作品必须属于杰作，再用<code>only<\/code>排除其他全部收录内容。这两个限定都没有原文依据，完整的“只收录杰作”命题因此无法从出处得到。<\/p>\n<\/section>"},{"title":"D. They have only covered masterpieces.","raw":"#### 写作视角法\n\n原文第四、五段是这样写的：\n\n> For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of 把这个主旨直接代入24题题干：\n\n> 全文主旨只能确认作者怀疑Gilbert仅靠现有做法重振乐团的可能，不能判断本项中录音是否只收录杰作这一具体范围限制。\n\n但D实际说的是：\n\n> They have only covered masterpieces.  \n> 它们只收录了杰作。\n\n主旨涉及乐团的前景和现有办法是否足够，D涉及所有录音的作品范围。即使知道作者认为乐团面临困难，也不能由此判断市场上的录音只包含哪一类作品，更不能自动补出`only`这样的排除条件。\n\n本项最终仍要根据“the recorded performances of the great classical musicians of the 20th century”这处局部原文判断。这里介绍的是参与竞争的录音资源，`great`评价音乐家，原文没有把作品限定为杰作，也没有排除其他收录内容。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题 D选项","focus":[90,1882,846,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":24,"option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q24-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q24-D-0\"><blockquote>\n<p>它们只收录了杰作。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时从<code>recorded performances of the great classical musicians<\/code>想到杰出音乐家的录音，但继续检查<code>only<\/code>，发现举出这种高质量资源不等于限定全部录音只收杰作。文中没有排除普通作品、新作品和其他录音的收录可能，第一轮排除D，后续没有恢复。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用“20世纪伟大古典音乐家的录制演出”，把对音乐家的评价移到作品类别上，又加上<code>only<\/code>，把录音内容限定为只有杰作。原文是在举出现场音乐会面对的一类有竞争力的录音，没有给出所有录音的收录规则，也没有说杰出音乐家的每一项录音都只能对应杰作。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>One possible response is for classical performers to program attractive new music that is not yet available on record.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q24-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，录音只收录了杰作。<\/p>\n<\/blockquote>\n<p>题干的<code>recordings<\/code>对应第四段的<code>recorded performances<\/code>，D的<code>masterpieces<\/code>容易使人联想到同一句的<code>great classical musicians<\/code>。但<code>only<\/code>要求的不只是找到优质音乐资源，还要找到“收录内容仅限于杰作、其他内容不包括在内”的限制。<\/p>\n<p>第一层第一处出处把20世纪伟大古典音乐家的录音列为古典器乐演奏者需要面对的竞争者。它回答的是“现场演出还与哪些资源竞争”，没有罗列录音全部收录什么；<code>great<\/code>修饰的是<code>musicians<\/code>，也不是一个用来划定作品类别的词。<\/p>\n<p>D把主语扩成题干所问的录音，并用<code>have only covered<\/code>给它附上一条排他性的收录结论。提到杰出音乐家的演出，只能说明这类录音存在并有竞争力，不能说明其他演出或作品都没有被录制。<\/p>\n<p>第一层第二处出处说可以安排“尚未有录音的有吸引力的新音乐”。<code>not yet<\/code>限定的是这类新音乐目前尚未录制的状态；作者并没有接着说因为它们不是杰作，所以录音永远不会收录。不能把某些新音乐暂时没有录音，反推成录音仅收杰作的规则。<\/p>\n<p>D先把音乐家的声望换成作品必须属于杰作，再用<code>only<\/code>排除其他全部收录内容。这两个限定都没有原文依据，完整的“只收录杰作”命题因此无法从出处得到。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q24-D-2\"><h3>写作视角法<\/h3>\n<p>原文第四、五段是这样写的：<\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>One possible response is for classical performers to program attractive new music that is not yet available on record.<\/p>\n<p>作者先指出杰出古典音乐家的录音参与争夺公众，后来提出一种可能的回应：现场演出可以安排尚无录音的新音乐。<\/p>\n<\/blockquote>\n<p>文章沿着“哪些资源形成竞争—现场演出能怎样回应”推进。新音乐的意义在于暂时不能通过录音听到，作者没有把讨论转成录音收录内容必须满足的作品等级。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The music covered by recordings consists exclusively of masterpieces; no other works have been included.<\/p>\n<p>录音收录的音乐完全由杰作构成，其他作品都没有被收录。<\/p>\n<\/blockquote>\n<p>这个假设明确写出<code>only<\/code>所需的排除：除了杰作，其他作品不在录音范围内。实际文章只举出伟大音乐家的录音，并提出演出尚未录制的新音乐；既没有把人物评价改成作品收录标准，也没有排除非杰作，因此无法接出D所要求的限制。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q24-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者怀疑Gilbert仅靠现有做法重振乐团的可能，不能判断本项中录音是否只收录杰作这一具体范围限制。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>They have only covered masterpieces.<br>它们只收录了杰作。<\/p>\n<\/blockquote>\n<p>主旨涉及乐团的前景和现有办法是否足够，D涉及所有录音的作品范围。即使知道作者认为乐团面临困难，也不能由此判断市场上的录音只包含哪一类作品，更不能自动补出<code>only<\/code>这样的排除条件。<\/p>\n<p>本项最终仍要根据“the recorded performances of the great classical musicians of the 20th century”这处局部原文判断。这里介绍的是参与竞争的录音资源，<code>great<\/code>评价音乐家，原文没有把作品限定为杰作，也没有排除其他收录内容。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"24题结论","raw":"### 24题结论\n\n> **24. B. They are easily accessible to the general public.**\n\nA借用了质量比较，却把录音往往较高改成录音经常较低，颠倒了高低方向。\n\nB用`easily accessible`准确改写`available everywhere`，概括普通公众容易获得录音这一特点。\n\nC借用了`quality`，却把已有质量的比较改成录音促进音乐质量提高的因果作用。\n\nD从杰出音乐家的录音补出“只收录杰作”，添加了作品类别和排他性的范围限制。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[12,1540,1478,405],"sourceW":1696,"sourceH":2551},"meta":{"kind":"conclusion","question":24},"level":3,"html":"<blockquote>\n<p><strong>24. B. They are easily accessible to the general public.<\/strong><\/p>\n<\/blockquote>\n<p>A借用了质量比较，却把录音往往较高改成录音经常较低，颠倒了高低方向。<\/p>\n<p>B用<code>easily accessible<\/code>准确改写<code>available everywhere<\/code>，概括普通公众容易获得录音这一特点。<\/p>\n<p>C借用了<code>quality<\/code>，却把已有质量的比较改成录音促进音乐质量提高的因果作用。<\/p>\n<p>D从杰出音乐家的录音补出“只收录杰作”，添加了作品类别和排他性的范围限制。<\/p>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"section":"第四鸟 · 新题型","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n## 段落与全文逻辑框架\n\n**逻辑层次1：任命反响与惊讶**（段落1-2总体评价） 吉尔伯特任命引发热议：（2009年突然宣布 → 古典音乐界热门话题）→ 反响积极：（托马西尼：\"万岁！终于！\"）// 但令人惊讶：【吉尔伯特相对不知名 + 被描述为\"不矫揉造作\"、\"没有令人敬畏的指挥家气质\"】→ 与前任对比：（马勒、布列兹等大师 // 吉尔伯特的描述显得苍白）\n\n↓（作者的个人立场）\n\n**逻辑层次2：作者的怀疑态度**（段落3个人观点） 对吉尔伯特能力不确定：（不知道他是否是好指挥家）→ 现场演出不是必需的：【虽然他演奏多样有趣的作品 // 但可以通过CD和iTunes听音乐】\n\n↓（深入分析问题）\n\n**逻辑层次3：古典音乐会面临的危机**（段落4核心问题） 忠实观众的误解：（认为录音不能替代现场 → 没抓住要点）→ 竞争现实：【古典演奏家不仅要与其他艺术形式竞争 + 还要与20世纪大师录音竞争】→ 录音的优势：（便宜 + 随处可得 + 质量往往更高 + 时间地点灵活）→ 结果：传统古典音乐会体制陷入危机\n\n↓（可能的解决方案）\n\n**逻辑层次4：改革的可能与挑战**（段落5未来展望） 可能方案：演奏还没有录音的新音乐 → 吉尔伯特的潜力：（对新音乐感兴趣 + 被认为能让爱乐乐团更有活力）// 但挑战依然存在：【仅扩展曲目不够 → 必须改变乐团与新观众的关系】\n\n↑（全文主旨）\n\n全文核心观点：虽然吉尔伯特的任命受到欢迎，但作者对其能否真正振兴纽约爱乐乐团持怀疑态度。在录音技术使古典音乐随处可得的时代，传统音乐会面临生存危机，仅仅扩展曲目是不够的，必须从根本上改变与观众的关系。\n\n## 小标题题\n\nRead the following text and choose the most suitable heading from the list A–G for each numbered section (41–45). There are two extra headings.\n\n[A] Making live concerts matter in an age of recordings\n\n[B] Replacing traditional concerts with recorded performances\n\n[C] Bridging a cultural gap that youth alone cannot close\n\n[D] Earning the audience’s support through communication\n\n[E] Making high culture part of ordinary human life\n\n[F] Restoring the celebrity conductor through television\n\n[G] Why elite institutions need a non-elite public\n\n### 41. ______\n\nFor the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with other arts organizations but also with recordings of the great musicians of the twentieth century. These recordings are cheap, widely available, often artistically superior to today’s live performances, and convenient to hear. Their availability has brought about a crisis in the traditional classical concert.\n\nOne possible response is to perform attractive new music that is not yet available on record. Alan Gilbert’s interest in new music has therefore attracted attention. But merely changing the New York Philharmonic’s repertoire will not be enough. If Gilbert and the orchestra are to succeed, they must change their relationship with the new audience they hope to attract.\n\n### 42. ______\n\nNews reports emphasized that Gilbert was forty. Another orchestra had hired the even younger Gustavo Dudamel. Yet their youthfulness alone was unlikely to persuade people under thirty to attend concerts. The generation gap went deeper than the age of a music director.\n\nLeonard Bernstein had been famous before becoming the Philharmonic’s music director, partly through recordings, Broadway, films, and television. Gilbert could not follow the same route: popular culture had withdrawn its attention from classical music, major labels recorded it only occasionally, and national media seldom covered it. Meanwhile, the dismantling of school music programs had left many young Americans knowing little about it. Gilbert therefore needed new ways of reaching them, including a sustained and intelligent use of web-based media.\n\n### 43. ______\n\nBeverly Sills’s death was mourned by many people who could have known little about the singing that originally made her famous. Her regular appearances on popular television programs had won the affection of millions who otherwise would never have heard of her.\n\nBernstein reached a mass audience in a different way but sent a similar message. On one television program, he introduced Aaron Copland as an ordinary-looking man in a business suit, who then conducted his own music. The point was that creating classical music was a normal human activity. Sills likewise challenged the image of opera singers as strange, foreign creatures by showing that they led ordinary lives with families, children, and problems.\n\n### 44. ______\n\nGreg Sandow argued that the fine arts could no longer remain separate from the wider culture and somehow above it. The author agreed in part: to revive a culture in which ordinary middle-class Americans respected and engaged with the arts, artists would have to learn to use today’s mass media.\n\nThere was nevertheless a serious argument for artistic elitism. Clement Greenberg had maintained that middlebrow culture could undermine high culture. But whatever one thought of that argument, a practical fact remained: orchestras, museums, ballet, opera, and theater companies were costly institutions. These elite enterprises could not survive without the wholehearted support of a non-elite democratic public that believed in their significance. Bernstein and Sills had tried to communicate that high culture was accessible to people willing to understand it.\n\n### 45. ______\n\nSince Bernstein’s time, the New York Philharmonic’s efforts to attract new audiences had rarely involved its music directors. Kurt Masur and Lorin Maazel saw their work as primarily musical and assumed that the wider community would recognize its value.\n\nGilbert could not enjoy that luxury. Simply exposing young people to masterpieces would not guarantee that they recognized their greatness, particularly if musicians treated listeners who failed to appreciate them as stupid. This condescending attitude reflected an entitlement mentality: musicians believed they deserved public support instead of having to earn it. Gilbert’s harder and more important task would be to become a great communicator, finding new ways to explain the value of high culture to a generation increasingly unfamiliar with it.","context":{"mode":"newtype","kind":"smallTitle","current":"","label":"小标题题"},"meta":{},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：任命反响与惊讶<\/strong>（段落1-2总体评价） 吉尔伯特任命引发热议：（2009年突然宣布 → 古典音乐界热门话题）→ 反响积极：（托马西尼：&quot;万岁！终于！&quot;）// 但令人惊讶：【吉尔伯特相对不知名 + 被描述为&quot;不矫揉造作&quot;、&quot;没有令人敬畏的指挥家气质&quot;】→ 与前任对比：（马勒、布列兹等大师 // 吉尔伯特的描述显得苍白）<\/p>\n<p>↓（作者的个人立场）<\/p>\n<p><strong>逻辑层次2：作者的怀疑态度<\/strong>（段落3个人观点） 对吉尔伯特能力不确定：（不知道他是否是好指挥家）→ 现场演出不是必需的：【虽然他演奏多样有趣的作品 // 但可以通过CD和iTunes听音乐】<\/p>\n<p>↓（深入分析问题）<\/p>\n<p><strong>逻辑层次3：古典音乐会面临的危机<\/strong>（段落4核心问题） 忠实观众的误解：（认为录音不能替代现场 → 没抓住要点）→ 竞争现实：【古典演奏家不仅要与其他艺术形式竞争 + 还要与20世纪大师录音竞争】→ 录音的优势：（便宜 + 随处可得 + 质量往往更高 + 时间地点灵活）→ 结果：传统古典音乐会体制陷入危机<\/p>\n<p>↓（可能的解决方案）<\/p>\n<p><strong>逻辑层次4：改革的可能与挑战<\/strong>（段落5未来展望） 可能方案：演奏还没有录音的新音乐 → 吉尔伯特的潜力：（对新音乐感兴趣 + 被认为能让爱乐乐团更有活力）// 但挑战依然存在：【仅扩展曲目不够 → 必须改变乐团与新观众的关系】<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：虽然吉尔伯特的任命受到欢迎，但作者对其能否真正振兴纽约爱乐乐团持怀疑态度。在录音技术使古典音乐随处可得的时代，传统音乐会面临生存危机，仅仅扩展曲目是不够的，必须从根本上改变与观众的关系。<\/p>\n"},{"title":"小标题题 · 41题","level":3,"section":"第四鸟 · 新题型","raw":"### 41题解析\n\n**答案：A — Making live concerts matter in an age of recordings。** 中文：在录音时代，让现场音乐会重新具有吸引人的价值。\n\n这一部分整体在回答：录音已经方便、便宜而且质量很高，现场音乐会凭什么继续争取观众？第一段建立竞争处境，第二段讨论出路，所以不能只用“录音有优势”概括整块内容。\n\n关键证据在两处。开头的 compete 把现场表演和录音放进同一个争夺观众时间与金钱的场景；第二段的 But 把“演奏未录制的新作品”降为不充分的办法，结尾真正落在 change their relationship with the new audience。\n\n段内推进链是：大师录音随手可得 → 传统音乐会陷入危机 → 新作品可以提供一点不同的东西 → 只改曲目还不够 → 需要改变与新观众的关系。\n\n标题中 in an age of recordings 对应录音造成的竞争环境；making live concerts matter 对应后半部分寻找现场音乐会继续吸引观众的理由。它把问题和解决方向一起收住。\n\n最强干扰项是B。它抓住了录音优势，却把作者的任务换成“用录音取代传统音乐会”。原文是在危机中寻找现场演出的生路，最后要求乐团主动改变与观众的关系，没有主张取消现场演出。\n\n**最终答案：41选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"41","label":"小标题题"},"meta":{},"html":"<h3>41题解析<\/h3>\n<p><strong>答案：A — Making live concerts matter in an age of recordings。<\/strong> 中文：在录音时代，让现场音乐会重新具有吸引人的价值。<\/p>\n<p>这一部分整体在回答：录音已经方便、便宜而且质量很高，现场音乐会凭什么继续争取观众？第一段建立竞争处境，第二段讨论出路，所以不能只用“录音有优势”概括整块内容。<\/p>\n<p>关键证据在两处。开头的 compete 把现场表演和录音放进同一个争夺观众时间与金钱的场景；第二段的 But 把“演奏未录制的新作品”降为不充分的办法，结尾真正落在 change their relationship with the new audience。<\/p>\n<p>段内推进链是：大师录音随手可得 → 传统音乐会陷入危机 → 新作品可以提供一点不同的东西 → 只改曲目还不够 → 需要改变与新观众的关系。<\/p>\n<p>标题中 in an age of recordings 对应录音造成的竞争环境；making live concerts matter 对应后半部分寻找现场音乐会继续吸引观众的理由。它把问题和解决方向一起收住。<\/p>\n<p>最强干扰项是B。它抓住了录音优势，却把作者的任务换成“用录音取代传统音乐会”。原文是在危机中寻找现场演出的生路，最后要求乐团主动改变与观众的关系，没有主张取消现场演出。<\/p>\n<p><strong>最终答案：41选A。<\/strong><\/p>\n"},{"title":"小标题题 · 42题","level":3,"section":"第四鸟 · 新题型","raw":"### 42题解析\n\n**答案：C — Bridging a cultural gap that youth alone cannot close。** 中文：跨越一个仅靠年轻指挥家无法弥合的文化隔阂。\n\n这一部分先否定“指挥家年轻，年轻观众自然会来”，再解释真正的隔阂从哪里产生，最后提出需要新的沟通渠道。年龄是进入问题的入口，文化环境和传播方式才是讨论主体。\n\n开头的 Yet 和 The generation gap went deeper 明确把读者从年龄带向深层原因。第二段接着用 Bernstein 的成名路径与 Gilbert 面对的环境作对照；结尾 therefore 把“旧路走不通”收束为“寻找新路”。\n\n段内推进链是：两位年轻指挥家上任 → 年轻不足以吸引年轻人 → 伯恩斯坦曾经拥有唱片和大众媒体入口 → 这些入口已缩小，学校音乐教育也遭削弱 → 新一代更陌生 → 需要持续而有效地使用网络等新渠道。\n\n标题的 cultural gap 对应公众关注与音乐教育共同变化造成的陌生；youth alone cannot close 对应第一段的明确否定；bridging 对应结尾主动接触年轻听众的方向，三个部分各有落点。\n\n最强干扰项是F。文中确实提到电视，也回顾了明星指挥家的成名条件，但这是为了说明 Gilbert 不能照搬旧路。把这部分概括成“通过电视恢复明星指挥家”，恰好颠倒了新旧环境的关系，也漏掉网络渠道与教育背景。\n\n**最终答案：42选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"42","label":"小标题题"},"meta":{},"html":"<h3>42题解析<\/h3>\n<p><strong>答案：C — Bridging a cultural gap that youth alone cannot close。<\/strong> 中文：跨越一个仅靠年轻指挥家无法弥合的文化隔阂。<\/p>\n<p>这一部分先否定“指挥家年轻，年轻观众自然会来”，再解释真正的隔阂从哪里产生，最后提出需要新的沟通渠道。年龄是进入问题的入口，文化环境和传播方式才是讨论主体。<\/p>\n<p>开头的 Yet 和 The generation gap went deeper 明确把读者从年龄带向深层原因。第二段接着用 Bernstein 的成名路径与 Gilbert 面对的环境作对照；结尾 therefore 把“旧路走不通”收束为“寻找新路”。<\/p>\n<p>段内推进链是：两位年轻指挥家上任 → 年轻不足以吸引年轻人 → 伯恩斯坦曾经拥有唱片和大众媒体入口 → 这些入口已缩小，学校音乐教育也遭削弱 → 新一代更陌生 → 需要持续而有效地使用网络等新渠道。<\/p>\n<p>标题的 cultural gap 对应公众关注与音乐教育共同变化造成的陌生；youth alone cannot close 对应第一段的明确否定；bridging 对应结尾主动接触年轻听众的方向，三个部分各有落点。<\/p>\n<p>最强干扰项是F。文中确实提到电视，也回顾了明星指挥家的成名条件，但这是为了说明 Gilbert 不能照搬旧路。把这部分概括成“通过电视恢复明星指挥家”，恰好颠倒了新旧环境的关系，也漏掉网络渠道与教育背景。<\/p>\n<p><strong>最终答案：42选C。<\/strong><\/p>\n"},{"title":"小标题题 · 43题","level":3,"section":"第四鸟 · 新题型","raw":"### 43题解析\n\n**答案：E — Making high culture part of ordinary human life。** 中文：让人们看到高雅文化也是普通人的生活的一部分。\n\n这一部分用 Sills 和 Bernstein 两个例子，解释有效传播究竟向公众传递什么。它不仅在说“他们上过电视”，而是在说他们怎样改变公众对古典音乐家的想象。\n\n第一段的 otherwise would never have heard of her 显示 Sills 接触到了原本圈外的人。第二段的 a similar message 把两个人的事例合并；normal human activity 和 ordinary lives 则直接点明两例共有的信息。\n\n段内推进链是：不熟悉演唱事业的人仍喜爱 Sills → 电视使她走近大众 → Bernstein 也让作曲家以普通人的形象出现 → Sills 展示家庭与日常烦恼 → 古典音乐不再显得属于遥远而奇怪的特殊人群。\n\n标题中的 high culture 对应古典音乐、作曲与歌剧；ordinary human life 对应普通人的外貌、工作、家庭和问题；making ... part of ... 概括的是两位传播者帮助观众建立亲近感的共同作用。\n\n最强干扰项是F。电视确实是这些例子使用的工具，但作者没有在这里论证如何重新制造明星指挥家。Sills 还是歌剧演唱家，范围也装不进“指挥家”。两例共同落点是拉近艺术家与普通人的距离，不能把传播渠道和名望当作整部分的主旨。\n\n**最终答案：43选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"43","label":"小标题题"},"meta":{},"html":"<h3>43题解析<\/h3>\n<p><strong>答案：E — Making high culture part of ordinary human life。<\/strong> 中文：让人们看到高雅文化也是普通人的生活的一部分。<\/p>\n<p>这一部分用 Sills 和 Bernstein 两个例子，解释有效传播究竟向公众传递什么。它不仅在说“他们上过电视”，而是在说他们怎样改变公众对古典音乐家的想象。<\/p>\n<p>第一段的 otherwise would never have heard of her 显示 Sills 接触到了原本圈外的人。第二段的 a similar message 把两个人的事例合并；normal human activity 和 ordinary lives 则直接点明两例共有的信息。<\/p>\n<p>段内推进链是：不熟悉演唱事业的人仍喜爱 Sills → 电视使她走近大众 → Bernstein 也让作曲家以普通人的形象出现 → Sills 展示家庭与日常烦恼 → 古典音乐不再显得属于遥远而奇怪的特殊人群。<\/p>\n<p>标题中的 high culture 对应古典音乐、作曲与歌剧；ordinary human life 对应普通人的外貌、工作、家庭和问题；making ... part of ... 概括的是两位传播者帮助观众建立亲近感的共同作用。<\/p>\n<p>最强干扰项是F。电视确实是这些例子使用的工具，但作者没有在这里论证如何重新制造明星指挥家。Sills 还是歌剧演唱家，范围也装不进“指挥家”。两例共同落点是拉近艺术家与普通人的距离，不能把传播渠道和名望当作整部分的主旨。<\/p>\n<p><strong>最终答案：43选E。<\/strong><\/p>\n"},{"title":"小标题题 · 44题","level":3,"section":"第四鸟 · 新题型","raw":"### 44题解析\n\n**答案：G — Why elite institutions need a non-elite public。** 中文：为什么精英艺术机构需要非精英公众的支持。\n\n这一部分先谈高雅艺术与大众文化的关系，再承认艺术精英主义有可讨论之处，最终把讨论落到机构生存的现实条件。关键不是要把高雅艺术改成大众娱乐，而是这些机构要持续运转，就必须让圈外公众认可其意义。\n\n关键证据是第二段的 But whatever one thought of that argument。作者暂时搁置审美争论，转向 could not survive without ... support 这个实际依赖关系。前面的 costly institutions 则解释了为什么需要这种支持。\n\n段内推进链是：艺术不能自居于社会之外 → 大众媒体可帮助公众接触艺术 → 精英主义仍有辩护空间 → 但机构运行需要资源和认可 → 非精英公众必须相信这些机构有价值 → 传播艺术的可接近性因此十分必要。\n\n标题的 elite institutions 对应交响乐团、博物馆、芭蕾、歌剧与剧院；non-elite public 对应拥有民主社会主体身份的普通公众；need 对应不能脱离其支持而生存的必要关系。\n\n最强干扰项是E。末句确实提到“艺术可以被普通人理解”，但在这里，它用来说明 Bernstein 和 Sills 怎样争取支撑艺术机构的公众。整块的中心是机构对公众的依赖，不是像上一部分那样展示艺术家的普通生活。必须根据同一细节在本段承担的功能判断范围。\n\n**最终答案：44选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"44","label":"小标题题"},"meta":{},"html":"<h3>44题解析<\/h3>\n<p><strong>答案：G — Why elite institutions need a non-elite public。<\/strong> 中文：为什么精英艺术机构需要非精英公众的支持。<\/p>\n<p>这一部分先谈高雅艺术与大众文化的关系，再承认艺术精英主义有可讨论之处，最终把讨论落到机构生存的现实条件。关键不是要把高雅艺术改成大众娱乐，而是这些机构要持续运转，就必须让圈外公众认可其意义。<\/p>\n<p>关键证据是第二段的 But whatever one thought of that argument。作者暂时搁置审美争论，转向 could not survive without ... support 这个实际依赖关系。前面的 costly institutions 则解释了为什么需要这种支持。<\/p>\n<p>段内推进链是：艺术不能自居于社会之外 → 大众媒体可帮助公众接触艺术 → 精英主义仍有辩护空间 → 但机构运行需要资源和认可 → 非精英公众必须相信这些机构有价值 → 传播艺术的可接近性因此十分必要。<\/p>\n<p>标题的 elite institutions 对应交响乐团、博物馆、芭蕾、歌剧与剧院；non-elite public 对应拥有民主社会主体身份的普通公众；need 对应不能脱离其支持而生存的必要关系。<\/p>\n<p>最强干扰项是E。末句确实提到“艺术可以被普通人理解”，但在这里，它用来说明 Bernstein 和 Sills 怎样争取支撑艺术机构的公众。整块的中心是机构对公众的依赖，不是像上一部分那样展示艺术家的普通生活。必须根据同一细节在本段承担的功能判断范围。<\/p>\n<p><strong>最终答案：44选G。<\/strong><\/p>\n"},{"title":"小标题题 · 45题","level":3,"section":"第四鸟 · 新题型","raw":"### 45题解析\n\n**答案：D — Earning the audience’s support through communication。** 中文：通过沟通赢得观众支持。\n\n这一部分从历任指挥家的职责观念切入，指出他们把社会认可当成理所当然，再要求 Gilbert 改变这种态度。整部分给出的办法，是主动向新一代解释艺术价值，从而把支持赢回来。\n\n前半段的 assumed 表明旧做法依赖一个未经争取的前提：音乐演好，社会就会认可。第二段的 could not enjoy that luxury 否定这个前提；deserved 与 earn 的对照说出观念差别，最后的 great communicator 给出新的工作重点。\n\n段内推进链是：前任只把工作理解成音乐事务 → 默认公众会认可 → 杰作曝光并不自动带来欣赏 → 居高临下反而隔开年轻人 → 放弃“我应得支持”的心态 → 靠新的沟通方式争取支持。\n\n标题中的 earning 对应 earn 与 deserved 的直接对照；audience’s support 对应乐团与年轻公众的关系；through communication 对应 Gilbert 应成为 great communicator 的结尾要求。\n\n最强干扰项是G。两项都谈公众支持，但G是在解释“为什么机构离不开公众”，而本部分重心已经推进到“艺术家该怎样做”。指挥家职责、傲慢态度以及新的沟通任务，都需要D才能完整覆盖。\n\n**最终答案：45选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"45","label":"小标题题"},"meta":{},"html":"<h3>45题解析<\/h3>\n<p><strong>答案：D — Earning the audience’s support through communication。<\/strong> 中文：通过沟通赢得观众支持。<\/p>\n<p>这一部分从历任指挥家的职责观念切入，指出他们把社会认可当成理所当然，再要求 Gilbert 改变这种态度。整部分给出的办法，是主动向新一代解释艺术价值，从而把支持赢回来。<\/p>\n<p>前半段的 assumed 表明旧做法依赖一个未经争取的前提：音乐演好，社会就会认可。第二段的 could not enjoy that luxury 否定这个前提；deserved 与 earn 的对照说出观念差别，最后的 great communicator 给出新的工作重点。<\/p>\n<p>段内推进链是：前任只把工作理解成音乐事务 → 默认公众会认可 → 杰作曝光并不自动带来欣赏 → 居高临下反而隔开年轻人 → 放弃“我应得支持”的心态 → 靠新的沟通方式争取支持。<\/p>\n<p>标题中的 earning 对应 earn 与 deserved 的直接对照；audience’s support 对应乐团与年轻公众的关系；through communication 对应 Gilbert 应成为 great communicator 的结尾要求。<\/p>\n<p>最强干扰项是G。两项都谈公众支持，但G是在解释“为什么机构离不开公众”，而本部分重心已经推进到“艺术家该怎样做”。指挥家职责、傲慢态度以及新的沟通任务，都需要D才能完整覆盖。<\/p>\n<p><strong>最终答案：45选D。<\/strong><\/p>\n"},{"title":"排序题","level":2,"section":"第四鸟 · 新题型","raw":"## 排序题\n\nThe following paragraphs are given in a wrong order. Reorganize them into a coherent text by choosing from the list A–H to fill in each numbered box (41–45). Paragraphs A, E and H have been correctly placed.\n\n| 已给位置 | 41 | 42 | 已给位置 | 43 | 44 | 45 | 已给位置 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| A | ______ | ______ | E | ______ | ______ | ______ | H |\n\n### [A]\n\nThe New York Philharmonic’s appointment of Alan Gilbert was warmly welcomed. Yet whether he was a fine conductor was only part of the problem facing him. Classical performers competed for the public’s time and money with cheap, convenient recordings of great musicians. Listeners could hear excellent performances without entering a concert hall. The availability of those recordings had created a crisis for the traditional concert and raised a question: what could a live orchestra offer that was not already on record?\n\n### [B]\n\nThe two performers’ television appearances conveyed more than musical excellence. Bernstein once introduced the composer Aaron Copland as an ordinary-looking man who then conducted his own work. Sills showed that opera singers had families, children, and everyday problems. Their shared message was that high culture was a human activity, accessible to ordinary people willing to make an effort to understand it. Communicating this accessibility helped connect cultural institutions with the wider public.\n\n### [C]\n\nYet the orchestra Bernstein had led largely forgot this responsibility. Its later music directors, including Kurt Masur and Lorin Maazel, treated their duties as purely musical and assumed that the community would appreciate their value. Such assumptions encouraged an entitlement mentality: musicians expected public support as something they deserved. Simply exposing young listeners to masterpieces, while looking down on those who did not immediately admire them, could not repair that relationship.\n\n### [D]\n\nOne possible answer was attractive new music not yet available on record. Gilbert’s interest in contemporary compositions made that response plausible. But merely adjusting the orchestra’s repertoire would not be enough; it had to change its relationship with a new audience. Nor could a younger director by himself bring young people into the hall. Gilbert’s youth, like that of Gustavo Dudamel in Los Angeles, did not remove the deeper cultural gap between classical music and younger Americans.\n\n### [E]\n\nAlthough those old routes to fame had narrowed, the purpose of the earlier outreach remained useful. Consider two performers who had used television to reach far beyond their regular audiences: Beverly Sills and Leonard Bernstein. Sills appeared on popular entertainment programs and won the affection of millions who knew little about her singing. Bernstein used televised concerts to talk about music. Despite the difference in their programs, both helped viewers feel that classical musicians belonged to the same world as themselves.\n\n### [F]\n\nThis message of accessibility had a practical importance as well as an idealistic one. A defense of artistic elitism might be intellectually serious, but symphony orchestras, museums, ballet, opera, and theater companies were expensive institutions. They could not survive without a non-elite public that believed in their significance. Their dependence on that public made communication a responsibility, not an optional addition to artistic work.\n\n### [G]\n\nThat cultural gap had widened because popular culture was paying less attention to classical music and school music programs had been dismantled. Bernstein had become famous through Broadway, films, recordings, and network television before he led the Philharmonic. Gilbert could not expect comparable publicity: major labels recorded classical music only sporadically, and national media rarely covered it. To reach unfamiliar listeners, he therefore needed new channels, such as web-based media; the old routes to fame were no longer open in the same way.\n\n### [H]\n\nGilbert therefore had to begin by earning the support that earlier conductors had taken for granted. Being a great conductor would matter, but becoming a great communicator would matter even more to the future of classical music. He would need to find new ways to do what Bernstein had done: make the case for high culture to a generation that knew little of its power and might even look down on it.\n\n## 排序题全局解析\n\n| 段落 | 本段功能 |\n| --- | --- |\n| A | 从Gilbert的任命引出录音竞争，并提出现场乐团还能提供什么的问题。 |\n| B | 解释两位传播者通过电视传递的共同信息：高雅艺术也是普通人的活动。 |\n| C | 指出乐团后来的指挥家忘记传播责任，并批评把公众支持视为应得之物的心态。 |\n| D | 回答A的新作品思路，同时指出只改曲目或只换年轻指挥家都不足够。 |\n| E | 在旧成名渠道已缩小的前提下，回看Sills与Bernstein曾怎样接触大众。 |\n| F | 解释可接近性信息的现实意义：昂贵艺术机构需要非精英公众，传播是责任。 |\n| G | 解释D所说的文化隔阂：媒体关注与学校音乐教育变化，使旧成名路径失效。 |\n| H | 面向Gilbert收束要求：争取支持，成为能向新一代说明艺术价值的沟通者。 |\n\n全文推进链是：录音竞争下提出问题 → 新曲目与年轻指挥家都不足以解决 → 找出文化与传播环境变化 → 回看过去成功的沟通者 → 提炼两人传达的信息 → 说明机构为什么需要这种传播 → 指出现实中遗忘责任与理所当然的心态 → 要求Gilbert重新赢得公众。\n\n这里有三组必须接稳的局部链：A提出“没有录音的东西”与D的One possible answer；D的cultural gap与G的That cultural gap；E引入两位传播者与B的The two performers。后半部分再由B的accessibility接F的This message of accessibility，由F的communication a responsibility接C的this responsibility，最后由C的expected public support接H的earning the support。\n\n**完整顺序：A—D—G—E—B—F—C—H。**\n\n**41—45：D、G、B、F、C。**","context":{"mode":"newtype","kind":"sorting","current":"","label":"排序题"},"meta":{},"html":"<h2>排序题全局解析<\/h2>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>本段功能<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>从Gilbert的任命引出录音竞争，并提出现场乐团还能提供什么的问题。<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>解释两位传播者通过电视传递的共同信息：高雅艺术也是普通人的活动。<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>指出乐团后来的指挥家忘记传播责任，并批评把公众支持视为应得之物的心态。<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>回答A的新作品思路，同时指出只改曲目或只换年轻指挥家都不足够。<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>在旧成名渠道已缩小的前提下，回看Sills与Bernstein曾怎样接触大众。<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>解释可接近性信息的现实意义：昂贵艺术机构需要非精英公众，传播是责任。<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>解释D所说的文化隔阂：媒体关注与学校音乐教育变化，使旧成名路径失效。<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>面向Gilbert收束要求：争取支持，成为能向新一代说明艺术价值的沟通者。<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>全文推进链是：录音竞争下提出问题 → 新曲目与年轻指挥家都不足以解决 → 找出文化与传播环境变化 → 回看过去成功的沟通者 → 提炼两人传达的信息 → 说明机构为什么需要这种传播 → 指出现实中遗忘责任与理所当然的心态 → 要求Gilbert重新赢得公众。<\/p>\n<p>这里有三组必须接稳的局部链：A提出“没有录音的东西”与D的One possible answer；D的cultural gap与G的That cultural gap；E引入两位传播者与B的The two performers。后半部分再由B的accessibility接F的This message of accessibility，由F的communication a responsibility接C的this responsibility，最后由C的expected public support接H的earning the support。<\/p>\n<p><strong>完整顺序：A—D—G—E—B—F—C—H。<\/strong><\/p>\n<p><strong>41—45：D、G、B、F、C。<\/strong><\/p>\n"},{"title":"排序题 · 41题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序41题解析\n\n当前空位在已给A之后、42题之前。A段末已经问：现场乐团能提供什么还没有录成唱片的东西？41题需要承接这个问题，随后才能把讨论推进到更深一层的障碍。\n\nA段尾是 what ... was not already on record；D段首是 One possible answer，紧接 attractive new music not yet available on record。问题对象、回答形式和“尚无录音”的限定连续吻合。D结尾再提出 deeper cultural gap，而后一空G的段首正是 That cultural gap。\n\n因此这里不是看见重复的 music 就配对，而是A提出问题，D作有限度的回答，再用 But 和 Nor 连续指出方案不足，给下一段留下需要解释的文化隔阂。\n\n局部推进链：A的录音竞争与提问 → D的新曲目方案 → 新曲目和年轻化都不够 → G解释文化隔阂。\n\n最强候选是G，因为它也讨论青年与古典音乐的关系。但若把G直接放在A后面，That cultural gap 在A中没有对应的已提出对象，A明确提出的“现场能提供什么”也没有先得到回答。D把这两端同时接通。\n\n**最终答案：41填D。**","context":{"mode":"newtype","kind":"sorting","current":"D","label":"排序题"},"meta":{},"html":"<h3>排序41题解析<\/h3>\n<p>当前空位在已给A之后、42题之前。A段末已经问：现场乐团能提供什么还没有录成唱片的东西？41题需要承接这个问题，随后才能把讨论推进到更深一层的障碍。<\/p>\n<p>A段尾是 what ... was not already on record；D段首是 One possible answer，紧接 attractive new music not yet available on record。问题对象、回答形式和“尚无录音”的限定连续吻合。D结尾再提出 deeper cultural gap，而后一空G的段首正是 That cultural gap。<\/p>\n<p>因此这里不是看见重复的 music 就配对，而是A提出问题，D作有限度的回答，再用 But 和 Nor 连续指出方案不足，给下一段留下需要解释的文化隔阂。<\/p>\n<p>局部推进链：A的录音竞争与提问 → D的新曲目方案 → 新曲目和年轻化都不够 → G解释文化隔阂。<\/p>\n<p>最强候选是G，因为它也讨论青年与古典音乐的关系。但若把G直接放在A后面，That cultural gap 在A中没有对应的已提出对象，A明确提出的“现场能提供什么”也没有先得到回答。D把这两端同时接通。<\/p>\n<p><strong>最终答案：41填D。<\/strong><\/p>\n"},{"title":"排序题 · 42题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序42题解析\n\n当前空位在已确定的D之后、已给E之前。两侧都要检查：D最后刚提出 deeper cultural gap，E开头却已经在说 those old routes to fame had narrowed，中间这一段必须把文化隔阂解释清楚，并引入已经缩小的旧成名渠道。\n\nG开头的 That cultural gap 精确回指D的结尾；G随后对照Bernstein与Gilbert的媒体条件，结尾直接说 the old routes to fame were no longer open in the same way。E再以 Although those old routes to fame had narrowed 接住这一结论。\n\n指代链把前端接稳，重复对象把后端接稳。更关键的是段落功能连续：D指出隔阂存在，G解释为什么存在，E转向“渠道虽变，过去传播的目的仍值得借鉴”。\n\n局部推进链：D提出年龄无法消除的隔阂 → G说明媒体与教育条件改变、旧路不再畅通 → E回看旧传播者可保留的价值。\n\n最强候选是F，它也谈高雅艺术与大众的距离，但段首 This message of accessibility 需要先出现某个具体传播信息；D还没有给出这个信息。F也无法为E的 those old routes to fame 提供前项。\n\n**最终答案：42填G。**","context":{"mode":"newtype","kind":"sorting","current":"G","label":"排序题"},"meta":{},"html":"<h3>排序42题解析<\/h3>\n<p>当前空位在已确定的D之后、已给E之前。两侧都要检查：D最后刚提出 deeper cultural gap，E开头却已经在说 those old routes to fame had narrowed，中间这一段必须把文化隔阂解释清楚，并引入已经缩小的旧成名渠道。<\/p>\n<p>G开头的 That cultural gap 精确回指D的结尾；G随后对照Bernstein与Gilbert的媒体条件，结尾直接说 the old routes to fame were no longer open in the same way。E再以 Although those old routes to fame had narrowed 接住这一结论。<\/p>\n<p>指代链把前端接稳，重复对象把后端接稳。更关键的是段落功能连续：D指出隔阂存在，G解释为什么存在，E转向“渠道虽变，过去传播的目的仍值得借鉴”。<\/p>\n<p>局部推进链：D提出年龄无法消除的隔阂 → G说明媒体与教育条件改变、旧路不再畅通 → E回看旧传播者可保留的价值。<\/p>\n<p>最强候选是F，它也谈高雅艺术与大众的距离，但段首 This message of accessibility 需要先出现某个具体传播信息；D还没有给出这个信息。F也无法为E的 those old routes to fame 提供前项。<\/p>\n<p><strong>最终答案：42填G。<\/strong><\/p>\n"},{"title":"排序题 · 43题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序43题解析\n\n当前空位在已给E之后、44题之前。E已经并列介绍Sills和Bernstein，还指出两人都使公众感到音乐家与自己属于同一个世界。下一段应把这个共同作用解释得更具体。\n\nE末尾的 both 对应B段首的 The two performers；B随后分别补充Copland普通人的外貌与Sills的家庭生活，结尾明确命名这个共同信息为 accessibility。后一空F则以 This message of accessibility 开始。\n\n人物指代要求B依赖E，概念命名又使F依赖B。E先介绍传播者及他们接近大众的渠道，B再解释传播内容，因此不能把“谁做了什么”和“这些行为传达了什么”倒置。\n\n局部推进链：E介绍两位电视传播者 → B用具体例子提炼普通人也可接近高雅艺术的信息 → F说明这个信息为什么关系机构的生存。\n\n最强候选是F。它似乎也能概括E的亲近感，但F的 This message of accessibility 指向的是B已明确表达的可接近性信息；若直接放F，就会把尚未展开的共同信息跳过去，B也无法再保持紧接E两个人物的说明关系。\n\n**最终答案：43填B。**","context":{"mode":"newtype","kind":"sorting","current":"B","label":"排序题"},"meta":{},"html":"<h3>排序43题解析<\/h3>\n<p>当前空位在已给E之后、44题之前。E已经并列介绍Sills和Bernstein，还指出两人都使公众感到音乐家与自己属于同一个世界。下一段应把这个共同作用解释得更具体。<\/p>\n<p>E末尾的 both 对应B段首的 The two performers；B随后分别补充Copland普通人的外貌与Sills的家庭生活，结尾明确命名这个共同信息为 accessibility。后一空F则以 This message of accessibility 开始。<\/p>\n<p>人物指代要求B依赖E，概念命名又使F依赖B。E先介绍传播者及他们接近大众的渠道，B再解释传播内容，因此不能把“谁做了什么”和“这些行为传达了什么”倒置。<\/p>\n<p>局部推进链：E介绍两位电视传播者 → B用具体例子提炼普通人也可接近高雅艺术的信息 → F说明这个信息为什么关系机构的生存。<\/p>\n<p>最强候选是F。它似乎也能概括E的亲近感，但F的 This message of accessibility 指向的是B已明确表达的可接近性信息；若直接放F，就会把尚未展开的共同信息跳过去，B也无法再保持紧接E两个人物的说明关系。<\/p>\n<p><strong>最终答案：43填B。<\/strong><\/p>\n"},{"title":"排序题 · 44题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序44题解析\n\n当前空位在已确定的B之后、45题之前。B结尾已经把两位艺术家的做法概括为向大众传达高雅文化的 accessibility，下面需要说明这种传播的意义，再转到后来的人有没有履行它。\n\nB段尾的 Communicating this accessibility 与F段首的 This message of accessibility 紧接。F解释昂贵艺术机构无法脱离非精英公众，最后把 communication 定义为 a responsibility。后一空C开头的 this responsibility 正好取用这个已明确的责任。\n\n这里的衔接不只靠相同词语。B回答“传播了什么”，F回答“为什么这件事不是可做可不做”，C才有根据批评后来忘记责任的指挥家。\n\n局部推进链：B的可接近性信息 → F的机构依赖公众 → 沟通成为责任 → C转折指出后来遗忘了这一责任。\n\n最强候选是C。它直接接B看似也能说“遗忘传播”，但 this responsibility 的明确前项尚未建立；更重要的是，必须先由F说明公众支持与机构生存的关系，C的批评才有完整的论证依据。把F放到C后还会打断C的问题与H的要求之间的收束关系。\n\n**最终答案：44填F。**","context":{"mode":"newtype","kind":"sorting","current":"F","label":"排序题"},"meta":{},"html":"<h3>排序44题解析<\/h3>\n<p>当前空位在已确定的B之后、45题之前。B结尾已经把两位艺术家的做法概括为向大众传达高雅文化的 accessibility，下面需要说明这种传播的意义，再转到后来的人有没有履行它。<\/p>\n<p>B段尾的 Communicating this accessibility 与F段首的 This message of accessibility 紧接。F解释昂贵艺术机构无法脱离非精英公众，最后把 communication 定义为 a responsibility。后一空C开头的 this responsibility 正好取用这个已明确的责任。<\/p>\n<p>这里的衔接不只靠相同词语。B回答“传播了什么”，F回答“为什么这件事不是可做可不做”，C才有根据批评后来忘记责任的指挥家。<\/p>\n<p>局部推进链：B的可接近性信息 → F的机构依赖公众 → 沟通成为责任 → C转折指出后来遗忘了这一责任。<\/p>\n<p>最强候选是C。它直接接B看似也能说“遗忘传播”，但 this responsibility 的明确前项尚未建立；更重要的是，必须先由F说明公众支持与机构生存的关系，C的批评才有完整的论证依据。把F放到C后还会打断C的问题与H的要求之间的收束关系。<\/p>\n<p><strong>最终答案：44填F。<\/strong><\/p>\n"},{"title":"排序题 · 45题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序45题解析\n\n当前空位在已确定的F之后、已给H之前。F刚证明沟通是一种责任；H则要求Gilbert去赢得早先指挥家视为理所当然的支持。45题必须既回接这份责任，也交代H批评的旧心态。\n\nF结尾的 communication a responsibility 对应C段首的 Yet ... forgot this responsibility。C随后点名Masur与Maazel，并说他们 expected public support as something they deserved；H的 earning the support that earlier conductors had taken for granted 正是对这一心态的回应。\n\nYet让C与F形成“本该如此，但现实并非如此”的转折；H的 therefore 则把C指出的问题转成Gilbert的行动要求。这里从规范、到偏离规范的现实、再到纠正现实的结论，方向完整。\n\n局部推进链：F说明传播责任 → C指出遗忘责任、默认应获支持及居高临下的问题 → H要求主动赢得支持并成为沟通者。\n\n最强候选是D，它也说旧办法不够，但D讨论的是新曲目和年轻化，并未涉及H中的 earlier conductors 或 taken for granted；而且D的段首必须回答A提出的问题。只有C同时满足F与H的两端衔接。\n\n**最终答案：45填C。**","context":{"mode":"newtype","kind":"sorting","current":"C","label":"排序题"},"meta":{},"html":"<h3>排序45题解析<\/h3>\n<p>当前空位在已确定的F之后、已给H之前。F刚证明沟通是一种责任；H则要求Gilbert去赢得早先指挥家视为理所当然的支持。45题必须既回接这份责任，也交代H批评的旧心态。<\/p>\n<p>F结尾的 communication a responsibility 对应C段首的 Yet ... forgot this responsibility。C随后点名Masur与Maazel，并说他们 expected public support as something they deserved；H的 earning the support that earlier conductors had taken for granted 正是对这一心态的回应。<\/p>\n<p>Yet让C与F形成“本该如此，但现实并非如此”的转折；H的 therefore 则把C指出的问题转成Gilbert的行动要求。这里从规范、到偏离规范的现实、再到纠正现实的结论，方向完整。<\/p>\n<p>局部推进链：F说明传播责任 → C指出遗忘责任、默认应获支持及居高临下的问题 → H要求主动赢得支持并成为沟通者。<\/p>\n<p>最强候选是D，它也说旧办法不够，但D讨论的是新曲目和年轻化，并未涉及H中的 earlier conductors 或 taken for granted；而且D的段首必须回答A提出的问题。只有C同时满足F与H的两端衔接。<\/p>\n<p><strong>最终答案：45填C。<\/strong><\/p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| artistic appreciation | 艺术欣赏 | 社会现象类—文化教育 | 个人主题 |\n| **cultural innovation** | **文化创新** | **社会现象类—文化教育** | **宏观主题** |\n| preserving traditional culture | 保护传统文化 | 社会现象类—文化教育 | 宏观主题 |\n| **cultural partic ore vibrant C. | 图画展现了A把B变成一个更有活力的C。 |\n| 图画题 | In the picture, A is trying to attract a new audience by offering B. | 图画中，A试图通过提供B吸引新的受众。 |\n| 图表题 | The chart shows the growing availability of A over the period from B to C. | 图表显示，从B到C这段时期，A变得越来越容易获得。 |\n| **图表题** | **According to the chart, A is markedly different from B in terms of C.** | **根据图表，在C方面，A与B有明显差异。** |\n| 图表题 | The chart compares the time and money spent on A, B and C. | 图表比较了花在A、B、C上的时间和金钱。 |\n| **文本评论题** | **The passage focuses on the relationship between A and B.** | **短文着重讨论A与B之间的关系。** |\n| 文本评论题 | The passage discusses how A can attract a new audience by changing B. | 短文讨论了A如何通过改变B吸引新的受众。 |\n| 文本评论题 | The passage raises the question of whether merely expanding A is enough to achieve B. | 短文提出了这样一个问题：仅仅扩大A是否足以实现B。 |","level":2,"section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<table>\n<thead>\n<tr>\n<th>适用题型<\/th>\n<th>考试时可复用的形式<\/th>\n<th>中文翻译<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>图画题<\/strong><\/td>\n<td><strong>In the picture, A is enjoying a variety of B.<\/strong><\/td>\n<td><strong>图画中，A正在欣赏各种各样的B。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The picture shows A turning B into a more vibrant C.<\/td>\n<td>图画展现了A把B变成一个更有活力的C。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>In the picture, A is trying to attract a new audience by offering B.<\/td>\n<td>图画中，A试图通过提供B吸引新的受众。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart shows the growing availability of A over the period from B to C.<\/td>\n<td>图表显示，从B到C这段时期，A变得越来越容易获得。<\/td>\n<\/tr>\n<tr>\n<td><strong>图表题<\/strong><\/td>\n<td><strong>According to the chart, A is markedly different from B in terms of C.<\/strong><\/td>\n<td><strong>根据图表，在C方面，A与B有明显差异。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart compares the time and money spent on A, B and C.<\/td>\n<td>图表比较了花在A、B、C上的时间和金钱。<\/td>\n<\/tr>\n<tr>\n<td><strong>文本评论题<\/strong><\/td>\n<td><strong>The passage focuses on the relationship between A and B.<\/strong><\/td>\n<td><strong>短文着重讨论A与B之间的关系。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage discusses how A can attract a new audience by changing B.<\/td>\n<td>短文讨论了A如何通过改变B吸引新的受众。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage raises the question of whether merely expanding A is enough to achieve B.<\/td>\n<td>短文提出了这样一个问题：仅仅扩大A是否足以实现B。<\/td>\n<\/tr>\n<\/tbody><\/table>\n"}];
