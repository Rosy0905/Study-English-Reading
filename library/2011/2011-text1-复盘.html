<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset:method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset:method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset:method_newtype_overview)\n\n![新题型考纲表格](asset:method_newtype_table)\n\n![七选五题型说明](asset:method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset:method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset:method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset:method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"# 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| decision | n. 决定 | New York | n. 纽约 | Philharmonic | n. 爱乐乐团 |\n| hire | v. 聘请 | music director | n. 音乐总监 | talk | n. 话题 |\n| classical music | n. 古典音乐 | ever since | 连词短语：自从 | sudden | adj. 突然的 |\n| announcement | n. 宣布 | appointment | n. 任命 | for the most part | 副词短语：总的来说 |\n| response | n. 反应 | favorable | adj. 积极的；赞同的 | to say the least | 插入语：至少可以这么说 |\n| Hooray | int. 好哇 | sober-sided | adj. 头脑冷静的；严肃的 | critic | n. 评论家 |","level":1,"section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[86,114,910,521],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"html":"<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>decision<\/td>\n<td>n. 决定<\/td>\n<td>New York<\/td>\n<td>n. 纽约<\/td>\n<td>Philharmonic<\/td>\n<td>n. 爱乐乐团<\/td>\n<\/tr>\n<tr>\n<td>hire<\/td>\n<td>v. 聘请<\/td>\n<td>music director<\/td>\n<td>n. 音乐总监<\/td>\n<td>talk<\/td>\n<td>n. 话题<\/td>\n<\/tr>\n<tr>\n<td>classical music<\/td>\n<td>n. 古典音乐<\/td>\n<td>ever since<\/td>\n<td>连词短语：自从<\/td>\n<td>sudden<\/td>\n<td>adj. 突然的<\/td>\n<\/tr>\n<tr>\n<td>announcement<\/td>\n<td>n. 宣布<\/td>\n<td>appointment<\/td>\n<td>n. 任命<\/td>\n<td>for the most part<\/td>\n<td>副词短语：总的来说<\/td>\n<\/tr>\n<tr>\n<td>response<\/td>\n<td>n. 反应<\/td>\n<td>favorable<\/td>\n<td>adj. 积极的；赞同的<\/td>\n<td>to say the least<\/td>\n<td>插入语：至少可以这么说<\/td>\n<\/tr>\n<tr>\n<td>Hooray<\/td>\n<td>int. 好哇<\/td>\n<td>sober-sided<\/td>\n<td>adj. 头脑冷静的；严肃的<\/td>\n<td>critic<\/td>\n<td>n. 评论家<\/td>\n<\/tr>\n<\/tbody><\/table>\n"},{"title":"第2段","raw":"# 第2段\n\n| 表达 | 词性＋ sic critic.<\/p>\n<\/section>"},{"title":"第1段","raw":"### 意群划分 · 第1段\n\nThe decision / of the New York Philharmonic / to hire Alan Gilbert / as its next music director / has been the talk / of the classical-music world / ever since / the sudden announcement / of his appointment / in 2009.\n\nFor the most part, / the response has been favorable, / to say the least.\n\n\"Hooray! At last!\" / wrote Anthony Tommasini, / a sober-sided classical-music critic.","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[86,114,910,521],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false},"focusId":"focus-paragraph-1-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段<\/h3>\n<p>The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the sudden announcement of his appointment in 2009. For the most part, the response has been favorable, to say the least. &quot;Hooray! At last!&quot; wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段<\/h3>\n<p>The decision / of the New York Philharmonic / to hire Alan Gilbert / as its next music director / has been the talk / of the classical-music world / ever since / the sudden announcement / of his appointment / in 2009.<\/p>\n<p>For the most part, / the response has been favorable, / to say the least.<\/p>\n<p>&quot;Hooray! At last!&quot; / wrote Anthony Tommasini, / a sober-sided classical-music critic.<\/p>\n<\/section>"},{"title":"第1段","raw":"### 意群翻译 · 第1段\n\n这个决定 / 纽约爱乐乐团的 / 聘请艾伦·吉尔伯特 / 作为其下一任音乐总监 / 一直是话题 / 在古典音乐界 / 自从 / 突然宣布 / 他的任命 / 在2009年。\n\n在很大程度上，/ 反应一直是积极的，/ 至少可以这么说。\n\n\"万岁！终于！\" / 安东尼·托马西尼写道，/ 一位严肃的古典音乐评论家。","level":3,"section":"第二鸟 · 精读与翻译","con aragraph-1-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-1-0\"><h3>完整原文 · 第1段<\/h3>\n<p>The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the sudden announcement of his appointment in 2009. For the most part, the response has been favorable, to say the least. &quot;Hooray! At last!&quot; wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-1-1\"><h3>意群划分 · 第1段<\/h3>\n<p>The decision / of the New York Philharmonic / to hire Alan Gilbert / as its next music director / has been the talk / of the classical-music world / ever since / the sudden announcement / of his appointment / in 2009.<\/p>\n<p>For the most part, / the response has been favorable, / to say the least.<\/p>\n<p>&quot;Hooray! At last!&quot; / wrote Anthony Tommasini, / a sober-sided classical-music critic.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-1-2\"><h3>意群翻译 · 第1段<\/h3>\n<p>这个决定 / 纽约爱乐乐团的 / 聘请艾伦·吉尔伯特 / 作为其下一任音乐总监 / 一直是话题 / 在古典音乐界 / 自从 / 突然宣布 / 他的任命 / 在2009年。<\/p>\n<p>在很大程度上，/ 反应一直是积极的，/ 至少可以这么说。<\/p>\n<p>&quot;万岁！终于！&quot; / 安东尼·托马西尼写道，/ 一位严肃的古典音乐评论家。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-1-3\"><h3>标准译文 · 第1段<\/h3>\n<p>纽约爱乐乐团决定聘请艾伦·吉尔伯特担任下一任音乐总监，自2009年突然宣布这一任命以来，一直是古典音乐界的热门话题。总的来说，反响至少可以说是积极的。严肃的古典音乐评论家安东尼·托马西尼写道：&quot;万岁！终于！&quot;<\/p>\n<\/section>"},{"title":"第2段","raw":"### 完整原文 · 第2段\n\nOne of the reasons why the appointment came as such a surprise, however, is that Gilbert is comparatively little known. Even Tommasini, who had advocated Gilbert's appointment in the Times, calls him \"an unpretentious musician with no air of the formidable conductor about him.\" As a description of the next music director of an orchestra that has hitherto been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some Times rea ven Tommasini, who had advocated Gilbert&#39;s appointment in the Times, calls him &quot;an unpretentious musician with no air of the formidable conductor about him.&quot; As a description of the next music director of an orchestra that has hitherto been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some Times readers as faint praise.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段<\/h3>\n<p>One of the reasons / why the appointment came / as such a surprise, / however, / is that Gilbert / is comparatively little known.<\/p>\n<p>Even Tommasini, / who had advocated / Gilbert&#39;s appointment / in the Times, / calls him / &quot;an unpretentious musician / with no air / of the formidable conductor / about him.&quot;<\/p>\n<p>As a description / of the next music director / of an orchestra / that has hitherto been led / by musicians / like Gustav Mahler and Pierre Boulez, / that seems likely / to have struck / at least some Times readers / as faint praise.<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-paragraph-2-2\"><h3>意群翻译 · 第2段<\/h3>\n<p>其中一个原因 / 为什么这个任命 / 如此令人惊讶，/ 然而，/ 是吉尔伯特 / 相对不太知名。<\/p>\n<p>即使托马西尼，/ 他曾经倡导 / 吉尔伯特的任命 / 在《泰晤士报》上，/ 称他为 / &quot;一位不矫揉造作的音乐家 / 没有气质 / 令人敬畏的指挥家的 / 在他身上。&quot;<\/p>\n<p>作为一个描述 / 下一任音乐总监的 / 一个乐团的 / 迄今为止一直由 / 音乐家们 / 像古斯塔夫·马勒和皮埃尔·布列兹这样的 / 领导，/ 这似乎可能 / 给人留下印象 / 至少一些《泰晤士报》读者 / 作为不太热情的赞扬。<\/p>\n<\/section>"},{"title":"第2段","raw":"### 标准译文 · 第2段\n\n然而，这个任命如此令人惊讶的原因之一是吉尔伯特相对不太知名。即使是在《泰晤士报》上倡导任命吉尔伯特的托马西尼，也称他为\"一位不矫揉造作的音乐家，没有令人敬畏的指挥家气质\"。对于一个迄今为止由古斯塔夫·马勒和皮埃尔·布列兹等音乐家领导的乐团的下一任音乐总监来说，这样的描述似乎会让至少一些《泰晤士报》的读者觉得是不太热情的赞扬。","level":3,"section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[86,638,910,718],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true},"focusId":"focus-paragraph-2-3","html":"<section 确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1696,"sourceH":2551},"meta":{"kind":"section-cover","mergedIntro":true},"level":1,"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n"},{"title":"25题 · 题干、题型与核心出处","raw":"## 25题\n\n**Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.**\n\n关于Gilbert在重振纽约爱乐乐团中所起的作用，作者持什么态度？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **doubtful**\n\n怀疑的。\n\nB. **enthusiastic**\n\n热情支持的。\n\nC. **confident**\n\n有信心的。\n\nD. **puzzled**\n\n困惑的。\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 任命公布后，古典音乐界总体叫好 | 先摆出一个新情况 |\n| 第2段 | 新人相对不出名，赞美也显得有所保留 | 再把反差拉出来 |\n| 第3段 | 作者暂不评价能力，转而说明录音选择很多 | 接着换个角度指出真正难处 |\n| 第4段 | 录音的优势让传统现场音乐会陷入危机 | 再把外部压力一层层铺开 |\n| 第5段 | 新曲目不够，还得改变与新观众的关系 | 最后说只改表面还不够 |\n\n---","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[12,2050,1672,489],"sourceW":1696,"sourceH":2551},"meta":{"kind":"question","question":25},"level":2,"html":"<p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.<\/strong><\/p>\n<p>关于Gilbert在重振纽约爱乐乐团中所起的作用，作者持什么态度？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>doubtful<\/strong><\/p>\n<p>怀疑的。<\/p>\n<p>B. <strong>enthusiastic<\/strong><\/p>\n<p>热情支持的。<\/p>\n<p>C. <strong>confident<\/strong><\/p>\n<p>有信心的。<\/p>\n<p>D. <strong>puzzled<\/strong><\/p>\n<p>困惑的。<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>第1段<\/td>\n<td>任命公布后，古典音乐界总体叫好<\/td>\n<td>先摆出一个新情况<\/td>\n<\/tr>\n<tr>\n<td>第2段<\/td>\n<td>新人相对不出名，赞美也显得有所保留<\/td>\n<td>再把反差拉出来<\/td>\n<\/tr>\n<tr>\n<td>第3段<\/td>\n<td>作者暂不评价能力，转而说明录音选择很多<\/td>\n<td>接着换个角度指出真正难处<\/td>\n<\/tr>\n<tr>\n<td>第4段<\/td>\n<td>录音的优势让传统现场音乐会陷入危机<\/td>\n<td>再把外部压力一层层铺开<\/td>\n<\/tr>\n<tr>\n<td>第5段<\/td>\n<td>新曲目不够，还得改变与新观众的关系<\/td>\n<td>最后说只改表面还不够<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n"},{"title":"A. doubtful","raw":"**Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.**\n\n### A. doubtful\n\n怀疑的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 A选项","focus":[90,2222,243,50],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":25,"option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q25-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-A-0\"><p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.<\/strong><\/p>\n<p>怀疑的。<\/p>\n<\/section>"},{"title":"A. doubtful","raw":"#### 如果 A 是主旨，文章5段应该怎么写？\n\n如果全文主旨真的是：\n\n作者对Gilbert能否真正重振纽约爱乐乐团持怀疑态度，认为受到欢迎和增加新曲目还不足以证明他能解决乐团面临的问题。\n\n那文章5段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 介绍Gilbert获任音乐总监、外界寄望他带来复兴这一新情况，同时指出受到欢迎不足以让作者确信重振能够实现 | 先摆出一个新情况 |\n| 第2段 | 把外界对复兴的高期待与Gilbert尚未充分建立的声望、有限的赞美放在一起，让人看到任命热度与成功依据之间的反差 | 再把反差拉出来 |\n| 第3段 | 从“指挥家演什么”转向“听众为何一定要到场”，说明录音已有丰富选择，使Gilbert仅凭曲目吸引观众的办法面临真正难处 | 接着换个角度指出真正难处 |\n| 第4段 | 依次展开其他艺术活动与优质录音对时间、注意力和金钱的争夺，说明这些外部压力使个人换任和曲目调整难以保证复兴 | 再把外部压力一层层铺开 |\n| 第5段 | 指出增加新曲目仍未触及乐团与新观众的关系，提出必须先改变这种关系的条件，对Gilbert能否完成重振保留判断 | 最后说只改表面还不够 |\n\n第1段写的是音乐界对任命的欢迎，先把“新指挥来了，大家很期待”摆出来，并不等于作者本人已经相信复兴会实现。第2段随即用`comparatively little known`和`faint praise`让这份期待遇到反差：新任者的名望及眼下得到的描述，并没有让作者看到重振乐团的充分依据。\n\n第3段的`For my part`才把作者本人请出来。他先暂不判断Gilbert是不是好指挥，随后把问题转到听众有CD和下载可选。第4段继续说明录音在价格、可得性、艺术质量和使用便利性上的优势；难题因此是现场音乐会在竞争中如何重新吸引观众，不只是一位指挥会不会演有趣的作品。\n\n末段虽承认新音乐是一种可能的回应，也转述Ross的乐观评价，但作者接着问这种改变究竟是什么，并明确说仅扩大曲目不够。`If ... are to succeed`与`must first change`是在提出成功条件，没有断言Gilbert已经做到。A能接住这条有理由、有条件的怀疑，也没有把怀疑夸大成“他必定失败”。\n\n判断：\n\n**A 保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 A选项","focus":[90,2222,243,50],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":25,"option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q25-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-A-0\"><p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.<\/strong><\/p>\n<p>怀疑的。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q25-A-1\"><h3>如果 A 是主旨，文章5段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>作者对Gilbert能否真正重振纽约爱乐乐团持怀疑态度，认为受到欢迎和增加新曲目还不足以证明他能解决乐团面临的问题。<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>第1段<\/td>\n<td>介绍Gilbert获任音乐总监、外界寄望他带来复兴这一新情况，同时指出受到欢迎不足以让作者确信重振能够实现<\/td>\n<td>先摆出一个新情况<\/td>\n<\/tr>\n<tr>\n<td>第2段<\/td>\n<td>把外界对复兴的高期待与Gilbert尚未充分建立的声望、有限的赞美放在一起，让人看到任命热度与成功依据之间的反差<\/td>\n<td>再把反差拉出来<\/td>\n<\/tr>\n<tr>\n<td>第3段<\/td>\n<td>从“指挥家演什么”转向“听众为何一定要到场”，说明录音已有丰富选择，使Gilbert仅凭曲目吸引观众的办法面临真正难处<\/td>\n<td>接着换个角度指出真正难处<\/td>\n<\/tr>\n<tr>\n<td>第4段<\/td>\n<td>依次展开其他艺术活动与优质录音对时间、注意力和金钱的争夺，说明这些外部压力使个人换任和曲目调整难以保证复兴<\/td>\n<td>再把外部压力一层层铺开<\/td>\n<\/tr>\n<tr>\n<td>第5段<\/td>\n<td>指出增加新曲目仍未触及乐团与新观众的关系，提出必须先改变这种关系的条件，对Gilbert能否完成重振保留判断<\/td>\n<td>最后说只改表面还不够<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>第1段写的是音乐界对任命的欢迎，先把“新指挥来了，大家很期待”摆出来，并不等于作者本人已经相信复兴会实现。第2段随即用<code>comparatively little known<\/code>和<code>faint praise<\/code>让这份期待遇到反差：新任者的名望及眼下得到的描述，并没有让作者看到重振乐团的充分依据。<\/p>\n<p>第3段的<code>For my part<\/code>才把作者本人请出来。他先暂不判断Gilbert是不是好指挥，随后把问题转到听众有CD和下载可选。第4段继续说明录音在价格、可得性、艺术质量和使用便利性上的优势；难题因此是现场音乐会在竞争中如何重新吸引观众，不只是一位指挥会不会演有趣的作品。<\/p>\n<p>末段虽承认新音乐是一种可能的回应，也转述Ross的乐观评价，但作者接着问这种改变究竟是什么，并明确说仅扩大曲目不够。<code>If ... are to succeed<\/code>与<code>must first change<\/code>是在提出成功条件，没有断言Gilbert已经做到。A能接住这条有理由、有条件的怀疑，也没有把怀疑夸大成“他必定失败”。<\/p>\n<p>判断：<\/p>\n<p><strong>A 保留。<\/strong><\/p>\n<\/section>"},{"title":"B. enthusiastic","raw":"**Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.**\n\n### B. enthusiastic\n\n热情支持的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 B选项","focus":[90,2307,305,50],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":25,"option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q25-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-B-0\"><p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.<\/strong><\/p>\n<p>热情支持的。<\/p>\n<\/section>"},{"title":"B. enthusiastic","raw":"#### 如果 B 是主旨，文章5段应该怎么写？\n\n如果全文主旨真的是：\n\n作者对Gilbert重振纽约爱乐乐团所能发挥的作用抱有热情，积极支持他推动这场改变。\n\n那文章5段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 介绍Gilbert上任给乐团带来改革契机这一新情况，作者与欢迎者一起表达对他推动复兴的热切期待 | 先摆出一个新情况 |\n| 第2段 | 对比Gilbert不显赫的名气与他令人振奋的改革热情，突出这个低调新人反而值得作者积极支持 | 再把反差拉出来 |\n| 第3段 | 从听众可以随时选择录音的角度指出留住观众的真正难处，并说明这正是作者热情支持Gilbert着手改革的原因 | 接着换个角度指出真正难处 |\n| 第4段 | 逐项写出艺术活动和录音对现场演出的外部挤压，把压力的加重写成作者更愿意支持Gilbert推动复兴的理由 | 再把外部压力一层层铺开 |\n| 第5段 | 强调换些曲目仍属表面变化，积极支持Gilbert进一步改变乐团与新观众的关系，把热情落在更深的改革上 | 最后说只改表面还不够 |\n\nB可以容纳“改革很难”和“只换曲目不够”，所以不能因为文章写了困难，就直接把热情支持排除。真正要找的是：指出这些困难后，作者有没有把自己的态度落到“因此我支持Gilbert带头去改”。\n\n实际第1段的欢呼来自Tommasini，第5段“能让乐团更有活力”的判断来自Ross。作者本人在第3段说不知道Gilbert是否优秀，末段又对“明显不同”追问其具体内容。文章把他人的热情与作者的保留分开，没有沿着假设表那样把压力化成支持Gilbert的理由，也没有把最后的必要条件写成对他改革行动的积极赞许。\n\n因此，B抓到了别人的乐观话语，却把这些话语的态度主体换成作者。全文落点是现有改变究竟够不够，作者没有表达B要求的热情支持。\n\n判断：\n\n**B 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 B选项","focus":[90,2307,305,50],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":25,"option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q25-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-B-0\"><p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.<\/strong><\/p>\n<p>热情支持的。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q25-B-1\"><h3>如果 B 是主旨，文章5段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>作者对Gilbert重振纽约爱乐乐团所能发挥的作用抱有热情，积极支持他推动这场改变。<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>第1段<\/td>\n<td>介绍Gilbert上任给乐团带来改革契机这一新情况，作者与欢迎者一起表达对他推动复兴的热切期待<\/td>\n<td>先摆出一个新情况<\/td>\n<\/tr>\n<tr>\n<td>第2段<\/td>\n<td>对比Gilbert不显赫的名气与他令人振奋的改革热情，突出这个低调新人反而值得作者积极支持<\/td>\n<td>再把反差拉出来<\/td>\n<\/tr>\n<tr>\n<td>第3段<\/td>\n<td>从听众可以随时选择录音的角度指出留住观众的真正难处，并说明这正是作者热情支持Gilbert着手改革的原因<\/td>\n<td>接着换个角度指出真正难处<\/td>\n<\/tr>\n<tr>\n<td>第4段<\/td>\n<td>逐项写出艺术活动和录音对现场演出的外部挤压，把压力的加重写成作者更愿意支持Gilbert推动复兴的理由<\/td>\n<td>再把外部压力一层层铺开<\/td>\n<\/tr>\n<tr>\n<td>第5段<\/td>\n<td>强调换些曲目仍属表面变化，积极支持Gilbert进一步改变乐团与新观众的关系，把热情落在更深的改革上<\/td>\n<td>最后说只改表面还不够<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>B可以容纳“改革很难”和“只换曲目不够”，所以不能因为文章写了困难，就直接把热情支持排除。真正要找的是：指出这些困难后，作者有没有把自己的态度落到“因此我支持Gilbert带头去改”。<\/p>\n<p>实际第1段的欢呼来自Tommasini，第5段“能让乐团更有活力”的判断来自Ross。作者本人在第3段说不知道Gilbert是否优秀，末段又对“明显不同”追问其具体内容。文章把他人的热情与作者的保留分开，没有沿着假设表那样把压力化成支持Gilbert的理由，也没有把最后的必要条件写成对他改革行动的积极赞许。<\/p>\n<p>因此，B抓到了别人的乐观话语，却把这些话语的态度主体换成作者。全文落点是现有改变究竟够不够，作者没有表达B要求的热情支持。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<\/section>"},{"title":"C. confident","raw":"**Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.**\n\n### C. confident\n\n有信心的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 C选项","focus":[90,2391,261,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":25,"option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q25-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-C-0\"><p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.<\/strong><\/p>\n<p>有信心的。<\/p>\n<\/section>"},{"title":"C. confident","raw":"#### 如果 C 是主旨，文章5段应该怎么写？\n\n如果全文主旨真的是：\n\n作者相信Gilbert能够发挥有效作用，带领纽约爱乐乐团克服困难并实现重振。\n\n那文章5段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 介绍Gilbert接手乐团这一新情况，并把他的到来确立为作者相信复兴可实现的新依据 | 先摆出一个新情况 |\n| 第2段 | 对比他相对不出名的外表与已展现的改革能力，用“名气有限却能办成事”的反差支持作者对他成功的信心 | 再把反差拉出来 |\n| 第3段 | 从听众拥有大量录音选择的角度指出吸引到场者的真正难处，再以Gilbert已经形成的观众策略说明作者为何相信他能应对 | 接着换个角度指出真正难处 |\n| 第4段 | 分层铺开其他艺术活动、录音价格、质量与便利性的外部压力，并把Gilbert应对各项压力的可靠能力写清，支撑成功有把握的判断 | 再把外部压力一层层铺开 |\n| 第5段 | 说明只扩大曲目还不够，但Gilbert已具备改变乐团与新观众关系的办法，因此作者相信他能跨过深层门槛、实现重振 | 最后说只改表面还不够 |\n\nC要求作者对Gilbert的作用有成功把握，并不要求作者否认录音竞争，也不要求所有段落只写好消息。即使承认困难，文章仍应拿出Gilbert能够应对困难的具体依据，把这些依据接到作者的信心上。\n\n实际第2段提出的是声望与期待之间的距离，第3段甚至暂不判断他是否是好指挥；第4段详细论证外部竞争，却没有同时给出Gilbert已能应对这些竞争的证据。第5段最接近C的是Ross的评价，但那是评论家的看法，作者紧接着用`But`追问，并否定仅扩充曲目的充分性。\n\n`must first change`只说明成功之前必须做什么，不能反过来读成“他已经具备这种改变，所以作者相信能成功”。条件被提出而尚未得到满足，正是C与实际结尾拉开的地方。\n\n判断：\n\n**C 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 C选项","focus":[90,2391,261,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":25,"option":"C","cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q25-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-C-0\"><p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.<\/strong><\/p>\n<p>有信心的。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q25-C-1\"><h3>如果 C 是主旨，文章5段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>作者相信Gilbert能够发挥有效作用，带领纽约爱乐乐团克服困难并实现重振。<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>第1段<\/td>\n<td>介绍Gilbert接手乐团这一新情况，并把他的到来确立为作者相信复兴可实现的新依据<\/td>\n<td>先摆出一个新情况<\/td>\n<\/tr>\n<tr>\n<td>第2段<\/td>\n<td>对比他相对不出名的外表与已展现的改革能力，用“名气有限却能办成事”的反差支持作者对他成功的信心<\/td>\n<td>再把反差拉出来<\/td>\n<\/tr>\n<tr>\n<td>第3段<\/td>\n<td>从听众拥有大量录音选择的角度指出吸引到场者的真正难处，再以Gilbert已经形成的观众策略说明作者为何相信他能应对<\/td>\n<td>接着换个角度指出真正难处<\/td>\n<\/tr>\n<tr>\n<td>第4段<\/td>\n<td>分层铺开其他艺术活动、录音价格、质量与便利性的外部压力，并把Gilbert应对各项压力的可靠能力写清，支撑成功有把握的判断<\/td>\n<td>再把外部压力一层层铺开<\/td>\n<\/tr>\n<tr>\n<td>第5段<\/td>\n<td>说明只扩大曲目还不够，但Gilbert已具备改变乐团与新观众关系的办法，因此作者相信他能跨过深层门槛、实现重振<\/td>\n<td>最后说只改表面还不够<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>C要求作者对Gilbert的作用有成功把握，并不要求作者否认录音竞争，也不要求所有段落只写好消息。即使承认困难，文章仍应拿出Gilbert能够应对困难的具体依据，把这些依据接到作者的信心上。<\/p>\n<p>实际第2段提出的是声望与期待之间的距离，第3段甚至暂不判断他是否是好指挥；第4段详细论证外部竞争，却没有同时给出Gilbert已能应对这些竞争的证据。第5段最接近C的是Ross的评价，但那是评论家的看法，作者紧接着用<code>But<\/code>追问，并否定仅扩充曲目的充分性。<\/p>\n<p><code>must first change<\/code>只说明成功之前必须做什么，不能反过来读成“他已经具备这种改变，所以作者相信能成功”。条件被提出而尚未得到满足，正是C与实际结尾拉开的地方。<\/p>\n<p>判断：<\/p>\n<p><strong>C 不保留。<\/strong><\/p>\n<\/section>"},{"title":"D. puzzled","raw":"**Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.**\n\n### D. puzzled\n\n困惑的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 D选项","focus":[90,2476,231,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":25,"option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q25-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-D-0\"><p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.<\/strong><\/p>\n<p>困惑的。<\/p>\n<\/section>"},{"title":"D. puzzled","raw":"#### 如果 D 是主旨，文章5段应该怎么写？\n\n如果全文主旨真的是：\n\n作者不明白Gilbert究竟会怎样发挥重振纽约爱乐乐团的作用，对他的作用与乐团复兴之间的联系感到困惑。\n\n那文章5段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 介绍外界把复兴希望寄托在Gilbert上任这一新情况，并提出作者不明白这次任命怎样带来重振的疑问 | 先摆出一个新情况 |\n| 第2段 | 把外界的强烈期待与对这位低调新人的有限说明并置，让这种反差加深作者对其重振作用究竟是什么的困惑 | 再把反差拉出来 |\n| 第3段 | 从听众已经能靠录音满足需求的角度指出真正难处，使作者更难理解Gilbert的曲目安排如何转化成观众回流 | 接着换个角度指出真正难处 |\n| 第4段 | 依次展开艺术活动和录音的多方面竞争，逐层追问这些压力与Gilbert的职能如何关联，把困惑集中在他的具体作用上 | 再把外部压力一层层铺开 |\n| 第5段 | 承认仅换曲目无法触及深层关系，同时仍不明白Gilbert改变观众关系究竟意味着什么，以未解的作用机制结束 | 最后说只改表面还不够 |\n\nD不等于作者什么都不懂。一个人完全可以看见录音竞争，也知道曲目调整不够，仍然困惑于新指挥具体怎样推动复兴。因此，要比较的是全文最终停在“我不明白其中联系”，还是已经有清楚的判断及其理由。\n\n第3段的`I have no idea whether Gilbert is a great conductor or even a good one`容易把人带向D，但它限定的是作者对Gilbert指挥水平没有判断。作者随后马上转到一个自己讲得很清楚的问题：听众不必进音乐厅也能获得优质音乐。第4段把录音优势怎样造成传统音乐会危机逐层讲明，第5段再提出必须改变与新观众的关系。\n\n末段的问句也不是单纯表示想不明白。它后面紧跟`Merely expanding ... will not be enough`，是在检验别人的乐观评价，并明确指出现有办法不足。作者有一条清楚的批评路线，因此总体态度应是对Gilbert能否做到持怀疑，而不是对其作用感到困惑。\n\n判断：\n\n**D 不保留。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题 D选项","focus":[90,2476,231,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":25,"option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q25-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q25-D-0\"><p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.<\/strong><\/p>\n<p>困惑的。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q25-D-1\"><h3>如果 D 是主旨，文章5段应该怎么写？<\/h3>\n<p>如果全文主旨真的是：<\/p>\n<p>作者不明白Gilbert究竟会怎样发挥重振纽约爱乐乐团的作用，对他的作用与乐团复兴之间的联系感到困惑。<\/p>\n<p>那文章5段应该大概这样展开：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>第1段<\/td>\n<td>介绍外界把复兴希望寄托在Gilbert上任这一新情况，并提出作者不明白这次任命怎样带来重振的疑问<\/td>\n<td>先摆出一个新情况<\/td>\n<\/tr>\n<tr>\n<td>第2段<\/td>\n<td>把外界的强烈期待与对这位低调新人的有限说明并置，让这种反差加深作者对其重振作用究竟是什么的困惑<\/td>\n<td>再把反差拉出来<\/td>\n<\/tr>\n<tr>\n<td>第3段<\/td>\n<td>从听众已经能靠录音满足需求的角度指出真正难处，使作者更难理解Gilbert的曲目安排如何转化成观众回流<\/td>\n<td>接着换个角度指出真正难处<\/td>\n<\/tr>\n<tr>\n<td>第4段<\/td>\n<td>依次展开艺术活动和录音的多方面竞争，逐层追问这些压力与Gilbert的职能如何关联，把困惑集中在他的具体作用上<\/td>\n<td>再把外部压力一层层铺开<\/td>\n<\/tr>\n<tr>\n<td>第5段<\/td>\n<td>承认仅换曲目无法触及深层关系，同时仍不明白Gilbert改变观众关系究竟意味着什么，以未解的作用机制结束<\/td>\n<td>最后说只改表面还不够<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>D不等于作者什么都不懂。一个人完全可以看见录音竞争，也知道曲目调整不够，仍然困惑于新指挥具体怎样推动复兴。因此，要比较的是全文最终停在“我不明白其中联系”，还是已经有清楚的判断及其理由。<\/p>\n<p>第3段的<code>I have no idea whether Gilbert is a great conductor or even a good one<\/code>容易把人带向D，但它限定的是作者对Gilbert指挥水平没有判断。作者随后马上转到一个自己讲得很清楚的问题：听众不必进音乐厅也能获得优质音乐。第4段把录音优势怎样造成传统音乐会危机逐层讲明，第5段再提出必须改变与新观众的关系。<\/p>\n<p>末段的问句也不是单纯表示想不明白。它后面紧跟<code>Merely expanding ... will not be enough<\/code>，是在检验别人的乐观评价，并明确指出现有办法不足。作者有一条清楚的批评路线，因此总体态度应是对Gilbert能否做到持怀疑，而不是对其作用感到困惑。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<\/section>"},{"title":"25题结论","raw":"### 25题结论\n\n**25. A. doubtful**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Doubtful about Gilbert’s ability to revitalize the Philharmonic / 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[12,2050,1672,489],"sourceW":1696,"sourceH":2551},"meta":{"kind":"conclusion","question":25},"level":3,"html":"<p><strong>25. A. doubtful<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>Doubtful about Gilbert’s ability to revitalize the Philharmonic / 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/strong><\/p>\n"},{"title":"21题 · 题干、题型与核心出处","raw":"## 21题\n\n> We learn from Paragraph 1 that Gilbert’s appointment has ______.  \n> 从第1段可以知道，Gilbert的任命引起了什么反应？\n\n### 题型\n\n这是一道局部细节题。题干用`Paragraph 1`限定第1段，用`Gilbert’s appointment`限定这次任命，要概括的是任命公布以后外界的反应，不是作者对Gilbert未来能否重振乐团的判断。\n\n### 核心出处\n\n> The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the sudden announcement of his appointment in 2009.\n>\n> For the most part, the response has been favorable, to say the least.\n>\n> “Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.\n\n第一句把`appointment`接到乐团聘请新音乐总监这件事，并交代任命成了古典音乐界的热门话题；第二句用`the response has been favorable`概括总体反应；第三句用Tommasini的欢呼展示这种反应。`For the most part`表示总体上如此，没有说所有人毫无例外地赞同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[12,12,1450,405],"sourceW":1696,"sourceH":2551},"meta":{"kind":"question","question":21},"level":2,"html":"<blockquote>\n<p>We learn from Paragraph 1 that Gilbert’s appointment has ______.<br>从第1段可以知道，Gilbert的任命引起了什么反应？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道局部细节题。题干用<code>Paragraph 1<\/code>限定第1段，用<code>Gilbert’s appointment<\/code>限定这次任命，要概括的是任命公布以后外界的反应，不是作者对Gilbert未来能否重振乐团的判断。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the sudden announcement of his appointment in 2009.<\/p>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<p>第一句把<code>appointment<\/code>接到乐团聘请新音乐总监这件事，并交代任命成了古典音乐界的热门话题；第二句用<code>the response has been favorable<\/code>概括总体反应；第三句用Tommasini的欢呼展示这种反应。<code>For the most part<\/code>表示总体上如此，没有说所有人毫无例外地赞同。<\/p>\n"},{"title":"A. incurred criticism","raw":"### A. incurred criticism\n\n> 招致了批评\n\n**做题模式中的状态：** 当时认识`criticism`，虽然原文概括反应的形容词还是`[xxx]`，但能读懂“Hooray! At last!”的直接叫好；把叫好与批评比较后，第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nA保留了“任命引发外界反应”的框架，却把反应从赞许改成批评。复盘时补全`favorable`，它表示赞同、肯定，与后面的欢呼相互印证；`criticism`把这条评价关系改成了负面指责。\n\n**出处：**\n\n> For the most part, the response has been favorable, to say the least.\n>\n> “Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 A选项","focus":[90,99,431,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q21-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>招致了批评<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>criticism<\/code>，虽然原文概括反应的形容词还是<code>[xxx]<\/code>，但能读懂“Hooray! At last!”的直接叫好；把叫好与批评比较后，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A保留了“任命引发外界反应”的框架，却把反应从赞许改成批评。复盘时补全<code>favorable<\/code>，它表示赞同、肯定，与后面的欢呼相互印证；<code>criticism<\/code>把这条评价关系改成了负面指责。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. incurred criticism","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 从第1段可以知道，Gilbert的任命招致了批评。\n\n题干的`Paragraph 1`把范围锁在开头，`appointment`对应任命，`incurred criticism`要与这一任命引发的`response`比较。不是只要文章后面出现担忧，就能拿来填这里的反应。\n\n出处中第二句先概括`the response has been favorable`，第三句再给出“Hooray! At last!”。前一句提供总体态度，后一句提供具体表现，两句都在说明欢迎这次任命。\n\n原文和A的评价对象都是Gilbert的任命，时间也都是任命公布以后；决定差别的是评价方向。`favorable`是赞同，`Hooray`是欢呼，`criticism`却要求出现批评、指责一类反应。\n\n`For the most part`没有排除个别人持不同看法，但“可能有人批评”需要额外证据，不能用这一限定词自行补出来。第1段真正给出的概括和例子仍然都是正向的。\n\nA把原文“任命总体受到欢迎”中的欢迎改成了批评，既不能概括第二句，也不能解释第三句为什么出现欢呼。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 A选项","focus":[90,99,431,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q21-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>招致了批评<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>criticism<\/code>，虽然原文概括反应的形容词还是<code>[xxx]<\/code>，但能读懂“Hooray! At last!”的直接叫好；把叫好与批评比较后，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A保留了“任命引发外界反应”的框架，却把反应从赞许改成批评。复盘时补全<code>favorable<\/code>，它表示赞同、肯定，与后面的欢呼相互印证；<code>criticism<\/code>把这条评价关系改成了负面指责。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第1段可以知道，Gilbert的任命招致了批评。<\/p>\n<\/blockquote>\n<p>题干的<code>Paragraph 1<\/code>把范围锁在开头，<code>appointment<\/code>对应任命，<code>incurred criticism<\/code>要与这一任命引发的<code>response<\/code>比较。不是只要文章后面出现担忧，就能拿来填这里的反应。<\/p>\n<p>出处中第二句先概括<code>the response has been favorable<\/code>，第三句再给出“Hooray! At last!”。前一句提供总体态度，后一句提供具体表现，两句都在说明欢迎这次任命。<\/p>\n<p>原文和A的评价对象都是Gilbert的任命，时间也都是任命公布以后；决定差别的是评价方向。<code>favorable<\/code>是赞同，<code>Hooray<\/code>是欢呼，<code>criticism<\/code>却要求出现批评、指责一类反应。<\/p>\n<p><code>For the most part<\/code>没有排除个别人持不同看法，但“可能有人批评”需要额外证据，不能用这一限定词自行补出来。第1段真正给出的概括和例子仍然都是正向的。<\/p>\n<p>A把原文“任命总体受到欢迎”中的欢迎改成了批评，既不能概括第二句，也不能解释第三句为什么出现欢呼。<\/p>\n<\/section>"},{"title":"A. incurred criticism","raw":"#### 写作视角法\n\n原文在交代任命成为话题后是这样写的：\n\n> For the most part, the response has been favorable, to say the least.\n>\n> “Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.\n>\n> 总体反应是肯定的；一向严肃的音乐评论家也写下“万岁！终于！”。\n\n作者先用一句话概括反响，再用一位严肃评论家的兴奋表达把反响写具体。“严肃的人也欢呼”加强了欢迎之意。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The appointment drew criticism. “This is the wrong choice,” wrote Anthony Tommasini, a sober-sided classical-music critic.\n>\n> 这项任命招来了批评。“这个选择是错误的，”一向严肃的音乐评论家Anthony Tommasini写道。\n\n要写出A所说的批评，就得把评论家举例中的叫好改成反对。实际段落选择的是欢呼这一例子，承担的是支持前面正面概括的作用；它没有提供假设写法所需的批评声音。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 A选项","focus":[90,99,431,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q21-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>招致了批评<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>criticism<\/code>，虽然原文概括反应的形容词还是<code>[xxx]<\/code>，但能读懂“Hooray! At last!”的直接叫好；把叫好与批评比较后，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A保留了“任命引发外界反应”的框架，却把反应从赞许改成批评。复盘时补全<code>favorable<\/code>，它表示赞同、肯定，与后面的欢呼相互印证；<code>criticism<\/code>把这条评价关系改成了负面指责。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第1段可以知道，Gilbert的任命招致了批评。<\/p>\n<\/blockquote>\n<p>题干的<code>Paragraph 1<\/code>把范围锁在开头，<code>appointment<\/code>对应任命，<code>incurred criticism<\/code>要与这一任命引发的<code>response<\/code>比较。不是只要文章后面出现担忧，就能拿来填这里的反应。<\/p>\n<p>出处中第二句先概括<code>the response has been favorable<\/code>，第三句再给出“Hooray! At last!”。前一句提供总体态度，后一句提供具体表现，两句都在说明欢迎这次任命。<\/p>\n<p>原文和A的评价对象都是Gilbert的任命，时间也都是任命公布以后；决定差别的是评价方向。<code>favorable<\/code>是赞同，<code>Hooray<\/code>是欢呼，<code>criticism<\/code>却要求出现批评、指责一类反应。<\/p>\n<p><code>For the most part<\/code>没有排除个别人持不同看法，但“可能有人批评”需要额外证据，不能用这一限定词自行补出来。第1段真正给出的概括和例子仍然都是正向的。<\/p>\n<p>A把原文“任命总体受到欢迎”中的欢迎改成了批评，既不能概括第二句，也不能解释第三句为什么出现欢呼。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-2\"><h3>写作视角法<\/h3>\n<p>原文在交代任命成为话题后是这样写的：<\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<p>总体反应是肯定的；一向严肃的音乐评论家也写下“万岁！终于！”。<\/p>\n<\/blockquote>\n<p>作者先用一句话概括反响，再用一位严肃评论家的兴奋表达把反响写具体。“严肃的人也欢呼”加强了欢迎之意。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The appointment drew criticism. “This is the wrong choice,” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<p>这项任命招来了批评。“这个选择是错误的，”一向严肃的音乐评论家Anthony Tommasini写道。<\/p>\n<\/blockquote>\n<p>要写出A所说的批评，就得把评论家举例中的叫好改成反对。实际段落选择的是欢呼这一例子，承担的是支持前面正面概括的作用；它没有提供假设写法所需的批评声音。<\/p>\n<\/section>"},{"title":"A. incurred criticism","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Doubtful about Gilbert’s ability to revitalize the Philharmonic  \n> 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。\n\n把这个主旨直接代入21题题干：\n\n> 全文主旨只能确认作者对Gilbert能否重振乐团持怀疑态度，不能判断第1段所说的任命反应是否包含批评。\n\n但A实际说的是：\n\n> incurred criticism  \n> 招致了批评\n\n主旨中的主体是作者，判断对象是未来能否重振乐团；A所说的是任命公布后引起的批评。一个作者不看好后续成效，并不能证明第1段报道的外界反应就是批评。\n\n本项最终仍要根据“the response has been favorable”这处局部原文判断；其后的欢呼又把肯定态度写得具体。A把这处局部态度改反了。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 A选项","focus":[90,99,431,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":21,"option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q21-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-A-0\"><blockquote>\n<p>招致了批评<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>criticism<\/code>，虽然原文概括反应的形容词还是<code>[xxx]<\/code>，但能读懂“Hooray! At last!”的直接叫好；把叫好与批评比较后，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A保留了“任命引发外界反应”的框架，却把反应从赞许改成批评。复盘时补全<code>favorable<\/code>，它表示赞同、肯定，与后面的欢呼相互印证；<code>criticism<\/code>把这条评价关系改成了负面指责。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第1段可以知道，Gilbert的任命招致了批评。<\/p>\n<\/blockquote>\n<p>题干的<code>Paragraph 1<\/code>把范围锁在开头，<code>appointment<\/code>对应任命，<code>incurred criticism<\/code>要与这一任命引发的<code>response<\/code>比较。不是只要文章后面出现担忧，就能拿来填这里的反应。<\/p>\n<p>出处中第二句先概括<code>the response has been favorable<\/code>，第三句再给出“Hooray! At last!”。前一句提供总体态度，后一句提供具体表现，两句都在说明欢迎这次任命。<\/p>\n<p>原文和A的评价对象都是Gilbert的任命，时间也都是任命公布以后；决定差别的是评价方向。<code>favorable<\/code>是赞同，<code>Hooray<\/code>是欢呼，<code>criticism<\/code>却要求出现批评、指责一类反应。<\/p>\n<p><code>For the most part<\/code>没有排除个别人持不同看法，但“可能有人批评”需要额外证据，不能用这一限定词自行补出来。第1段真正给出的概括和例子仍然都是正向的。<\/p>\n<p>A把原文“任命总体受到欢迎”中的欢迎改成了批评，既不能概括第二句，也不能解释第三句为什么出现欢呼。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-2\"><h3>写作视角法<\/h3>\n<p>原文在交代任命成为话题后是这样写的：<\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<p>总体反应是肯定的；一向严肃的音乐评论家也写下“万岁！终于！”。<\/p>\n<\/blockquote>\n<p>作者先用一句话概括反响，再用一位严肃评论家的兴奋表达把反响写具体。“严肃的人也欢呼”加强了欢迎之意。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The appointment drew criticism. “This is the wrong choice,” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<p>这项任命招来了批评。“这个选择是错误的，”一向严肃的音乐评论家Anthony Tommasini写道。<\/p>\n<\/blockquote>\n<p>要写出A所说的批评，就得把评论家举例中的叫好改成反对。实际段落选择的是欢呼这一例子，承担的是支持前面正面概括的作用；它没有提供假设写法所需的批评声音。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-A-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入21题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对Gilbert能否重振乐团持怀疑态度，不能判断第1段所说的任命反应是否包含批评。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>incurred criticism<br>招致了批评<\/p>\n<\/blockquote>\n<p>主旨中的主体是作者，判断对象是未来能否重振乐团；A所说的是任命公布后引起的批评。一个作者不看好后续成效，并不能证明第1段报道的外界反应就是批评。<\/p>\n<p>本项最终仍要根据“the response has been favorable”这处局部原文判断；其后的欢呼又把肯定态度写得具体。A把这处局部态度改反了。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<\/section>"},{"title":"B. raised suspicion","raw":"### B. raised suspicion\n\n> 引起了怀疑\n\n**做题模式中的状态：** 当时认识`suspicion`，原文的反应形容词仍被`[xxx]`遮挡，但“Hooray! At last!”能读成欢迎和赞许；没有读到第1段质疑任命的表达，第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\nB沿用了“任命带来一种态度反应”的关系，却把第一段的欢迎换成怀疑。文章后面确实有作者自己的保留态度，但那是对Gilbert及乐团未来的分析，不能改写成第1段报道的任命反响。\n\n**出处：**\n\n> For the most part, the response has been favorable, to say the least.\n>\n> “Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 B选项","focus":[90,184,394,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":21,"option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q21-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>引起了怀疑<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>suspicion<\/code>，原文的反应形容词仍被<code>[xxx]<\/code>遮挡，但“Hooray! At last!”能读成欢迎和赞许；没有读到第1段质疑任命的表达，第一轮排除B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B沿用了“任命带来一种态度反应”的关系，却把第一段的欢迎换成怀疑。文章后面确实有作者自己的保留态度，但那是对Gilbert及乐团未来的分析，不能改写成第1段报道的任命反响。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. raised suspicion","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 从第1段可以知道，Gilbert的任命引起了怀疑。\n\n`Paragraph 1`要求只在第1段确认任命的反应，`appointment`与前文的聘用决定相连；B的`suspicion`必须有相应的怀疑表现，不能借用第3段作者的`I have no idea`。\n\n第一层列出的两句实际给出的是`favorable`和“Hooray! At last!”。前者说明反应总体肯定，后者展示评论家因期待实现而叫好，没有提出任命是否可靠、是否合适之类的疑问。\n\n原文说“多数反应是支持的”，B说“任命引起怀疑”。不能因为怀疑和支持都属于态度词，就忽略它们所表达的具体方向。\n\n题干也没有问“作者最终怎样看待Gilbert”。后文作者保留判断，与首段报道评论家的支持可以同时存在；把两个说话者合成一个，会把别人的反应误认成作者的立场。\n\nB用怀疑替换了第1段已有的肯定反应，改变的是同一次任命所获评价的内容，而不是对同一句话作更简短的概括。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 B选项","focus":[90,184,394,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":21,"option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q21-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>引起了怀疑<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>suspicion<\/code>，原文的反应形容词仍被<code>[xxx]<\/code>遮挡，但“Hooray! At last!”能读成欢迎和赞许；没有读到第1段质疑任命的表达，第一轮排除B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B沿用了“任命带来一种态度反应”的关系，却把第一段的欢迎换成怀疑。文章后面确实有作者自己的保留态度，但那是对Gilbert及乐团未来的分析，不能改写成第1段报道的任命反响。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第1段可以知道，Gilbert的任命引起了怀疑。<\/p>\n<\/blockquote>\n<p><code>Paragraph 1<\/code>要求只在第1段确认任命的反应，<code>appointment<\/code>与前文的聘用决定相连；B的<code>suspicion<\/code>必须有相应的怀疑表现，不能借用第3段作者的<code>I have no idea<\/code>。<\/p>\n<p>第一层列出的两句实际给出的是<code>favorable<\/code>和“Hooray! At last!”。前者说明反应总体肯定，后者展示评论家因期待实现而叫好，没有提出任命是否可靠、是否合适之类的疑问。<\/p>\n<p>原文说“多数反应是支持的”，B说“任命引起怀疑”。不能因为怀疑和支持都属于态度词，就忽略它们所表达的具体方向。<\/p>\n<p>题干也没有问“作者最终怎样看待Gilbert”。后文作者保留判断，与首段报道评论家的支持可以同时存在；把两个说话者合成一个，会把别人的反应误认成作者的立场。<\/p>\n<p>B用怀疑替换了第1段已有的肯定反应，改变的是同一次任命所获评价的内容，而不是对同一句话作更简短的概括。<\/p>\n<\/section>"},{"title":"B. raised suspicion","raw":"#### 写作视角法\n\n原文在任命新闻之后是这样接着写的：\n\n> For the most part, the response has been favorable, to say the least.\n>\n> “Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.\n>\n> 作者先交代总体反响积极，再引用Tommasini如愿以偿般的欢呼。\n\n这一处选择的具体反应是“终于等到了”。它把任命写成受到欢迎的消息，并为后文作者转入自己的保留意见留下转折空间。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The appointment raised doubts. “Is Gilbert really the right choice?” asked Anthony Tommasini, a sober-sided classical-music critic.\n>\n> 这项任命引起了疑问。“Gilbert真的是合适的人选吗？”一向严肃的音乐评论家Anthony Tommasini问道。\n\n假设写法需要让首段的反应本身出现质疑。实际引语却没有问人选是否合适，而是在表示欢迎；后文作者再提出疑问，也不能把已经引用的欢呼变成首段评论家的怀疑。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 B选项","focus":[90,184,394,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":21,"option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q21-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>引起了怀疑<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>suspicion<\/code>，原文的反应形容词仍被<code>[xxx]<\/code>遮挡，但“Hooray! At last!”能读成欢迎和赞许；没有读到第1段质疑任命的表达，第一轮排除B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B沿用了“任命带来一种态度反应”的关系，却把第一段的欢迎换成怀疑。文章后面确实有作者自己的保留态度，但那是对Gilbert及乐团未来的分析，不能改写成第1段报道的任命反响。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第1段可以知道，Gilbert的任命引起了怀疑。<\/p>\n<\/blockquote>\n<p><code>Paragraph 1<\/code>要求只在第1段确认任命的反应，<code>appointment<\/code>与前文的聘用决定相连；B的<code>suspicion<\/code>必须有相应的怀疑表现，不能借用第3段作者的<code>I have no idea<\/code>。<\/p>\n<p>第一层列出的两句实际给出的是<code>favorable<\/code>和“Hooray! At last!”。前者说明反应总体肯定，后者展示评论家因期待实现而叫好，没有提出任命是否可靠、是否合适之类的疑问。<\/p>\n<p>原文说“多数反应是支持的”，B说“任命引起怀疑”。不能因为怀疑和支持都属于态度词，就忽略它们所表达的具体方向。<\/p>\n<p>题干也没有问“作者最终怎样看待Gilbert”。后文作者保留判断，与首段报道评论家的支持可以同时存在；把两个说话者合成一个，会把别人的反应误认成作者的立场。<\/p>\n<p>B用怀疑替换了第1段已有的肯定反应，改变的是同一次任命所获评价的内容，而不是对同一句话作更简短的概括。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-B-2\"><h3>写作视角法<\/h3>\n<p>原文在任命新闻之后是这样接着写的：<\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<p>作者先交代总体反响积极，再引用Tommasini如愿以偿般的欢呼。<\/p>\n<\/blockquote>\n<p>这一处选择的具体反应是“终于等到了”。它把任命写成受到欢迎的消息，并为后文作者转入自己的保留意见留下转折空间。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The appointment raised doubts. “Is Gilbert really the right choice?” asked Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<p>这项任命引起了疑问。“Gilbert真的是合适的人选吗？”一向严肃的音乐评论家Anthony Tommasini问道。<\/p>\n<\/blockquote>\n<p>假设写法需要让首段的反应本身出现质疑。实际引语却没有问人选是否合适，而是在表示欢迎；后文作者再提出疑问，也不能把已经引用的欢呼变成首段评论家的怀疑。<\/p>\n<\/section>"},{"title":"B. raised suspicion","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Doubtful about Gilbert’s ability to revitalize the Philharmonic  \n> 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。\n\n把这个主旨直接代入21题题干：\n\n> 全文主旨只能确认作者怀疑Gilbert现有做法的成效，不能判断第1段报道的外界是否因这次任命而产生怀疑。\n\n但B实际说的是：\n\n> raised suspicion  \n> 引起了怀疑\n\n`Doubtful`和`suspicion`看起来方向接近，但判断的主体和对象不同：主旨说作者怀疑改革能否奏效，B说任命引起怀疑。两个命题不能只靠“怀疑”这个共同意思互换。\n\n本项最终仍要根据“the response has been favorable”这处局部原文判断；第1段随后举出的也是欢呼。B不能拿全文作者的怀疑代替这处明确的正面反响。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 B选项","focus":[90,184,394,61],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":21,"option":"B","cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q21-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-B-0\"><blockquote>\n<p>引起了怀疑<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时认识<code>suspicion<\/code>，原文的反应形容词仍被<code>[xxx]<\/code>遮挡，但“Hooray! At last!”能读成欢迎和赞许；没有读到第1段质疑任命的表达，第一轮排除B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B沿用了“任命带来一种态度反应”的关系，却把第一段的欢迎换成怀疑。文章后面确实有作者自己的保留态度，但那是对Gilbert及乐团未来的分析，不能改写成第1段报道的任命反响。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第1段可以知道，Gilbert的任命引起了怀疑。<\/p>\n<\/blockquote>\n<p><code>Paragraph 1<\/code>要求只在第1段确认任命的反应，<code>appointment<\/code>与前文的聘用决定相连；B的<code>suspicion<\/code>必须有相应的怀疑表现，不能借用第3段作者的<code>I have no idea<\/code>。<\/p>\n<p>第一层列出的两句实际给出的是<code>favorable<\/code>和“Hooray! At last!”。前者说明反应总体肯定，后者展示评论家因期待实现而叫好，没有提出任命是否可靠、是否合适之类的疑问。<\/p>\n<p>原文说“多数反应是支持的”，B说“任命引起怀疑”。不能因为怀疑和支持都属于态度词，就忽略它们所表达的具体方向。<\/p>\n<p>题干也没有问“作者最终怎样看待Gilbert”。后文作者保留判断，与首段报道评论家的支持可以同时存在；把两个说话者合成一个，会把别人的反应误认成作者的立场。<\/p>\n<p>B用怀疑替换了第1段已有的肯定反应，改变的是同一次任命所获评价的内容，而不是对同一句话作更简短的概括。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-B-2\"><h3>写作视角法<\/h3>\n<p>原文在任命新闻之后是这样接着写的：<\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<p>作者先交代总体反响积极，再引用Tommasini如愿以偿般的欢呼。<\/p>\n<\/blockquote>\n<p>这一处选择的具体反应是“终于等到了”。它把任命写成受到欢迎的消息，并为后文作者转入自己的保留意见留下转折空间。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The appointment raised doubts. “Is Gilbert really the right choice?” asked Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<p>这项任命引起了疑问。“Gilbert真的是合适的人选吗？”一向严肃的音乐评论家Anthony Tommasini问道。<\/p>\n<\/blockquote>\n<p>假设写法需要让首段的反应本身出现质疑。实际引语却没有问人选是否合适，而是在表示欢迎；后文作者再提出疑问，也不能把已经引用的欢呼变成首段评论家的怀疑。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q21-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入21题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者怀疑Gilbert现有做法的成效，不能判断第1段报道的外界是否因这次任命而产生怀疑。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>raised suspicion<br>引起了怀疑<\/p>\n<\/blockquote>\n<p><code>Doubtful<\/code>和<code>suspicion<\/code>看起来方向接近，但判断的主体和对象不同：主旨说作者怀疑改革能否奏效，B说任命引起怀疑。两个命题不能只靠“怀疑”这个共同意思互换。<\/p>\n<p>本项最终仍要根据“the response has been favorable”这处局部原文判断；第1段随后举出的也是欢呼。B不能拿全文作者的怀疑代替这处明确的正面反响。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. received acclaim","raw":"### C. received acclaim\n\n> 获得了赞誉\n\n**做题模式中的状态：** 当时原文的`favorable`和选项中的`acclaim`都显示为`[xxx]`，只认识选项的`received`；凭“Hooray! At last!”确认正向反应后先保留C，A、B、D排除后选择C，并没有先认出`acclaim`再作答。\n\n**选项类型：正确同义改写。**\n\n`acclaim`指赞誉、喝彩。命题人把原文“反应总体肯定”与评论家的欢呼，改写成“任命获得赞誉”：从描述反应是什么样，变成任命收到了什么评价，赞许的方向保持不变。\n\n**出处：**\n\n> For the most part, the response has been favorable, to say the least.\n>\n> “Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 C选项","focus":[90,269,413,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"option","question":21,"option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q21-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>获得了赞誉<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时原文的<code>favorable<\/code>和选项中的<code>acclaim<\/code>都显示为<code>[xxx]<\/code>，只认识选项的<code>received<\/code>；凭“Hooray! At last!”确认正向反应后先保留C，A、B、D排除后选择C，并没有先认出<code>acclaim<\/code>再作答。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>acclaim<\/code>指赞誉、喝彩。命题人把原文“反应总体肯定”与评论家的欢呼，改写成“任命获得赞誉”：从描述反应是什么样，变成任命收到了什么评价，赞许的方向保持不变。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. received acclaim","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 从第1段可以知道，Gilbert的任命获得了赞誉。\n\n题干的`appointment`在第一句已经交代，C的`received`要接任命所获的外界反应，因此定位到`the response`及紧随其后的评论家引语。\n\n第二句的`favorable`给出肯定态度，第三句的“Hooray! At last!”把肯定态度写成公开的欢呼。一个是概括，一个是例子，它们共同解释了为什么这里可以用`acclaim`。\n\n原文以`the response`作主语，C接题干后以`Gilbert’s appointment`作主语。主语形式虽然变了，关系没有变：外界对任命的反应是肯定的，也就是这项任命获得赞誉。\n\n`received acclaim`没有补出“所有人都支持”或“任命已经取得成功”。它只说任命得到赞誉，保留了第1段所能确认的反应，不把欢迎扩大成对未来结果的保证。\n\nC用`acclaim`收拢了`favorable`及欢呼所表达的赞许，并用`received`把评价接回任命，人物、事件和评价方向都能对上。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 C选项","focus":[90,269,413,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":21,"option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q21-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>获得了赞誉<\/p>\n<\/blockquote>\n<p><strong>做 肯定反应具体表现为赞许和喝彩。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The appointment received acclaim. Even a sober-sided classical-music critic greeted it with “Hooray! At last!”<\/p>\n<p>这项任命获得了赞誉，连一向严肃的音乐评论家也以“万岁！终于！”来欢迎它。<\/p>\n<\/blockquote>\n<p>C所需要的写法正是原文已有的推进：前面概括反响积极，后面引用欢呼。假设写法只是把这两层关系明说出来，并不需要增加新的事件、评价者或成效。<\/p>\n<\/section>"},{"title":"C. received acclaim","raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Doubtful about Gilbert’s ability to revitalize the Philharmonic  \n> 作者怀疑Gilbert仅靠现有做法能否真正重振乐团。\n\n把这个主旨直接代入21题题干：\n\n> 全文主旨只能确认作者对未来成效的怀疑，不能判断第1段中的任命是否获得了外界赞誉。\n\nC实际说的是：\n\n> received acclaim  \n> 获得了赞誉\n\n主旨中的怀疑与C中的赞誉不构成矛盾。外界可以欢迎一位新任音乐总监，作者也可以继续追问他是否能解决传统音乐会的问题；说话者和判断对象各有范围。\n\n本项最终仍要根据“the response has been favorable”这处局部原文判断；“Hooray! At last!”提供了赞誉的具体表现。C准确概括了首段反响，没有要求作者也毫无保留地看好未来。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题 C选项","focus":[90,269,413,51],"sourceW":1696,"sourceH":2551},"meta":{"kind":"method","question":21,"option":"C","cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q21-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q21-C-0\"><blockquote>\n<p>获得了赞誉<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时原文的<code>favorable<\/code>和选项中的<code>acclaim<\/code>都显示为<code>[xxx]<\/code>，只认识选项的<code>received<\/code>；凭“Hooray! At last!”确认正向反应后先保留C，A、B、D排除后选择C，并没有先认出<code>acclaim<\/code>再作答。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p><code>acclaim<\/code>指赞誉、喝彩。命题人把原文“反应总体肯定”与评论家的欢呼，改写成“任命获得赞誉”：从描述反应是什么样，变成任命收到了什么评价，赞许的方向保持不变。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.<\/p>\n<p>“Hooray! At last!” wrote Anthony Tommasini, a sober-sided classical-music critic.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q21-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>从第1段可以知道，Gilbert的任命获得了赞誉。<\/p>\n<\/blockq
