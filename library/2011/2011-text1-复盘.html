_____.<br>作者认为那些忠实的音乐会观众怎么样？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>人物观点推断题。题干中的<code>The author believes<\/code>要求回答作者对忠实观众的判断，不能把观众自己的话当成作者认可的结论，也不能把作者列出的竞争条件直接说成观众已经做出的行为。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<\/blockquote>\n<p><code>devoted concertgoers<\/code>直接对应第4段开头，定语从句说明他们主张录音不能替代现场演出，主句<code>are missing the point<\/code>才是作者的评价。后面三句依次补出竞争对象、录音优势和音乐会危机，让我们知道他们漏掉的“重点”是什么。<\/p>\n<p>从明示事实到推断，只需要走这一步：观众强调现场的不可替代性，作者却说明录音已经凭借多项优势形成现实竞争，所以作者认为这些观众把现场的价值估得过高。这里不必继续猜他们买不买录音、是否看票价或喜欢多少种演出。<\/p>\n<h3>A. ignore the expenses of live performances<\/h3>\n<blockquote>\n<p>忽视现场演出的花费。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡，<code>expenses<\/code>能和后文的<code>money<\/code>接上。第一轮已经读到费用只是时间、注意力和金钱中的一个因素，也看到后文还写录音的质量与便利，但当时没有据此把A排掉，而是和D一起保留。25题形成主旨后才回查：全文关心录音对传统音乐会的整体竞争，不能把作者对观众的批评落实成“他们忽视费用”这一未经说明的判断，因此最后排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>命题人借用了<code>money<\/code>和<code>cheap<\/code>：艺术活动要争夺公众的金钱，录音也确实便宜。看到这两处，很容易自己补成“忠实观众没有算现场演出的费用”。但原文没有报告这些观众怎样考虑费用；它报告的是他们认为录音不能替代现场。费用因素存在，不等于“观众忽视费用”这个完整判断已经存在。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众忽视了现场演出的花费。<\/p>\n<\/blockquote>\n<p>用题干的<code>devoted concertgoers<\/code>找到第4段开头，再用A的<code>expenses<\/code>去对照后文的<code>money<\/code>和<code>cheap<\/code>。前一个定位词锁定被评价的人，后两个只能找到费用这一话题，不能自动替我们补出这些人对费用的态度。<\/p>\n<p>第一句明说观众认为录音不能替代现场，作者评价他们没有抓住要点。第二句则换成<code>classical instrumentalists<\/code>作主语，说明演奏者要争夺公众的时间、注意力和金钱；第三句的主语又是<code>These recordings<\/code>，介绍录音便宜及其他优势。这几句都没有把“没有考虑费用”作为观众的行为写出来。<\/p>\n<p>A的主语是忠实观众，动作是<code>ignore<\/code>，对象是现场演出的花费。原文提到金钱的那一句，主语却是古典乐器演奏家，动作是<code>compete<\/code>，对象是公众有限的投入。把“演奏者要争夺公众的钱”改成“观众忽视现场费用”，中间缺少关于观众如何判断花费的证据。<\/p>\n<p>此外，作者并列写可得性、质量以及自由选择时间地点，是要解释录音为什么能形成竞争。A只碰到了其中一个因素，不能因此视为作者已对观众作出相应指控。A的问题不只是内容窄，而是借真实的费用词，补出了原文没有表达的<code>ignore the expenses<\/code>这层人物判断。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文第4段是这样往下写的：<\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<p>录音不仅便宜，还随处可得、艺术质量往往更高、使用时间地点自由；这些录音的广泛可得性给传统音乐会带来了危机。<\/p>\n<\/blockquote>\n<p>实际文章从观众强调现场不可替代，转到消费者面对多种选择，再用多项录音优势解释竞争危机。这里的写作任务是说明现场演出的吸引力受到挑战，作者并没有接着检查忠实观众有没有把某笔费用算进去。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Devoted concertgoers fail to take the expense of attending live performances into account when they compare them with inexpensive recordings.<\/p>\n<p>忠实的音乐会观众把现场演出与廉价录音比较时，没有把参加现场演出的花费考虑进去。<\/p>\n<\/blockquote>\n<p>假设写法只补出A成立必须有的那条关系：费用被这些观众忽略了。实际文章虽提供录音便宜这个条件，却没有完成“观众比较时漏算费用”的归因；后文还继续转向质量和便利，不能从这些竞争优势反推观众具体漏算了哪项开支。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>作者对忠实观众的批评应当落在：他们过分倚重现场演出的不可替代性，没有正视录音竞争对传统音乐会吸引力的挑战；这也说明Gilbert仅靠增加曲目难以解决问题。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>ignore the expenses of live performances<br>忽视现场演出的花费。<\/p>\n<\/blockquote>\n<p>主旨把问题指向整个现场音乐会体制如何吸引观众，A却落实为观众忽视费用。费用可以参与这种竞争，却不能单独说明这些观众究竟怎样看待费用。把A作为答案，仍然需要补上原文没有给出的那条人物判断。<\/p>\n<p>第4段的局部证据让这个差别更清楚：作者先针对“录音不能替代现场”作评价，再列出价格、质量、可得性与便利性，支持的是现场价值被高估，而没有说观众不考虑现场开支。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. reject most kinds of recorded performances<\/h3>\n<blockquote>\n<p>拒绝大多数种类的录音演出。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，原文中的<code>substitute<\/code>显示为<code>[xxx]<\/code>。做题材料仍已把观众的意思理解为“录音不能替代现场”，并把这条价值判断与B的“拒绝大多数录音”作比较：前者不能推出拒绝收听的行为，<code>most kinds<\/code>也没有依据，所以第一轮排除B，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了观众关于录音和现场的比较，把“录音不能取代现场”改成“拒绝大多数种类的录音”。一个人可以平时听录音，同时认为录音无法完整替代现场体验；原文对替代关系的判断，被改成了拒绝行为，还加上<code>most kinds<\/code>这一范围。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众拒绝大多数种类的录音演出。<\/p>\n<\/blockquote>\n<p>题干的<code>devoted concertgoers<\/code>和B的<code>recorded performances<\/code>把我们带到第4段开头的观众回应，以及后文对录音竞争的讨论。判断B时，首先要读清观众到底说了什么，不能因为录音这个对象相同就略过动词。<\/p>\n<p>原句的观众作出一个比较判断：<code>recordings are no substitute for live performance<\/code>。<code>no substitute for<\/code>说明他们认为录音不能代替现场；主句<code>are missing the point<\/code>表示作者认为这个回应没有抓到问题，而不是接着报告观众拒听录音。<\/p>\n<p>B把<code>reply that<\/code>引出的看法改成<code>reject<\/code>这一拒绝行为。认为两件东西不能互相取代，与拒绝接受其中一件不是同一回事。比如喜欢在家听CD的人，也可以坚持音乐厅的体验不可替代；原句并没有排除这种情况。<\/p>\n<p>再看<code>most kinds<\/code>，它把拒绝范围扩大为大多数种类。原文没有统计这些观众接受或拒绝哪些录音，连拒绝动作都没有说，更谈不上大多数这一数量范围。<\/p>\n<p>因此，B不是对原句更简洁的概括，而是把“观众怎样判断录音与现场的关系”改成“观众怎样拒绝录音”，并额外加入了原文没有限定的多数范围。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文第4段是这样写的：<\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>作者先指出“录音不能替代现场”这一回应没抓住要点，再说明现场演出事实上必须与大师录音争夺公众的投入。<\/p>\n<\/blockquote>\n<p>后文没有调查忠实观众愿意听哪些录音，而是把视野扩大到艺术爱好公众的选择。即使忠实观众坚持现场体验独特，现实中的竞争仍然存在，这才是两句之间的推进。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Devoted concertgoers reject most kinds of recorded performances and generally refuse to listen to them.<\/p>\n<p>忠实的音乐会观众拒绝大多数种类的录音演出，通常不愿收听这些录音。<\/p>\n<\/blockquote>\n<p>假设写法必须把“拒绝多数录音”作为观众的实际行为说出来。实际文章只引用他们对替代性的判断，随后讨论竞争，不曾把这种看法发展成拒听行为。B需要的行为线与原文的竞争线不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者认为忠实观众低估了录音对现场音乐会的竞争作用，不能判断他们实际接受或拒绝哪些录音，更不能判断“大多数种类”这一范围。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>reject most kinds of recorded performances<br>拒绝大多数种类的录音演出。<\/p>\n<\/blockquote>\n<p>作者怀疑Gilbert仅靠曲目能否解决危机，是对现场吸引力及应对办法的判断。B说的则是观众拒听哪些录音，换成了另一种事实；不能因为作者批评观众，就把所有负面行为都安到他们身上。<\/p>\n<p>本项最终仍要根据“recordings are no substitute for live performance”这处局部原文判断。它给出了观众对替代关系的看法，没有给出<code>reject<\/code>的行为及<code>most kinds<\/code>的范围，B把两者补了进去。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. exaggerate the variety of live performances<\/h3>\n<blockquote>\n<p>夸大现场演出的多样性。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的英文没有遮挡，<code>variety<\/code>让人想到后文列出的歌剧、舞团、剧团等文化活动；其中原文的<code>troupes<\/code>当时显示为<code>[xxx]<\/code>。材料随后区分了名单的说话者和作用：这是作者列出的竞争者，不是观众声称现场演出种类丰富，所以第一轮排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>命题人把原文列举多种文化活动的材料拿过来，把作者展示的竞争范围改成忠实观众对现场演出多样性的夸张评价。原文还提到Gilbert演出的作品很多，但那也是作者承认他的曲目特点，并非观众的夸口。看到种类多，不能就把谁在说、说的是什么一起省掉。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>To be sure, he performs an impressive variety of interesting compositions, but it is not necessary for me to visit Avery Fisher Hall, or anywhere else, to hear interesting orchestral music.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众夸大了现场演出的多样性。<\/p>\n<\/blockquote>\n<p>题干要求定位观众的言论，C的<code>variety<\/code>又容易把我们引向第3段的<code>an impressive variety<\/code>以及第4段文化活动的并列清单。两处都与“多”有关系，但必须分别核对它们的主体与评价对象。<\/p>\n<p>第3段的<code>he performs<\/code>主语是Gilbert，作者承认他演出许多有趣作品，再说明自己不必为此去音乐厅。第4段的清单则跟在<code>classical instrumentalists must compete<\/code>后面，列的是古典乐器演奏者争夺公众投入时面对的竞争者。<\/p>\n<p>C的主语却是忠实观众，动作是<code>exaggerate<\/code>，对象是现场演出的多样性。无论把它放到哪一处，原文都没有说这些观众列出了很多演出种类，更没有说他们把实际种类数说大了。<\/p>\n<p>观众真正被引述的观点仍是“录音不能替代现场”。这是对现场价值和体验的判断，不是对节目种类的描述；作者用<code>missing the point<\/code>批评的是前一种说法，不能将批评对象移到<code>variety<\/code>上。<\/p>\n<p>C保留了现场演出这一大话题，却把作者列举竞争者或承认曲目丰富的材料移给观众，再添上“夸大”的评价，改坏了说话主体、信息用途和被批评的内容。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文相关位置是这样写的：<\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>观众坚持的是现场不可替代；作者随后列举不同文化活动与录音，是为了说明公众的时间、注意力和金钱会被多方争夺。<\/p>\n<\/blockquote>\n<p>实际文章用清单把外部竞争铺开。列得越多，越能看出现场音乐会需要面对其他选择；这份清单并不是为了先重现观众的自夸，再逐项驳斥它。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Devoted concertgoers claim that live performances offer a far wider variety than they actually do.<\/p>\n<p>忠实的音乐会观众声称现场演出的种类远比实际丰富。<\/p>\n<\/blockquote>\n<p>这种写法只改变C要求的关系：把过度的多样性判断归给观众。原文却没有写观众声称有哪些种类，也没有用实际种类去修正他们的估计；原文以竞争者数量说明现场的压力，C以种类被夸大说明观众认识错误，两条路线讨论的事情不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>全文主旨说明作者反对过分依靠现场演出的既有吸引力，认为必须正视录音竞争；它不能证明忠实观众对现场演出的种类作过夸大陈述。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>exaggerate the variety of live performances<br>夸大现场演出的多样性。<\/p>\n<\/blockquote>\n<p>主旨中的问题是现有曲目与现场形式是否足以吸引新观众，C却把观众的错误写成对节目种类数量的夸张。文章最后说扩展曲目不够，也不是说观众把已有曲目数量估错了；“改革不能只靠种类增加”和“有人夸大种类”是两种命题。<\/p>\n<p>本项最终仍要根据“classical instrumentalists must compete”这处局部原文判断。后面的多种文化活动属于作者陈述的竞争环境，不属于观众的夸张话语，C把名单的主体和作用改了。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. overestimate the value of live performances<\/h3>\n<blockquote>\n<p>高估现场演出的价值。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D显示为<code>[xxx] the value of live performances<\/code>，开头的<code>overestimate<\/code>被遮挡；原文中的<code>substitute<\/code>也显示为<code>[xxx]<\/code>。第一轮能看到现场价值这一对象和作者<code>missing the point<\/code>的批评方向，但还不能确定D的动作词，因此将D与A一起保留。25题形成主旨后再回查，材料把观众坚持现场不可替代与录音的价格、质量、可得性和便利性连起来，最终排除只抓费用的A，选D；D不是第一轮就已确定的答案。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>命题人没有照抄<code>missing the point<\/code>，而是结合观众说了什么以及作者怎样反驳，把批评内容概括为<code>overestimate the value<\/code>。观众将现场看得不可替代，作者用录音的现实优势说明这种判断把现场的价值估得过高。这里没有说现场毫无价值，也没有断言任何录音都胜过任何现场。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者认为，那些忠实的音乐会观众高估了现场演出的价值。<\/p>\n<\/blockquote>\n<p>题干的<code>devoted concertgoers<\/code>对应第4段第一句，D的<code>the value of live performances<\/code>对应他们对“录音是否能替代现场”的判断。<code>overestimate<\/code>需要结合作者的批评和后文的比较来确定，不能只因为段内有<code>live performance<\/code>就选择。<\/p>\n<p>第一句分开了两种立场：观众说录音不能代替现场，作者却说他们没抓住重点。后面的录音优势解释了作者为什么这样评价：录音便宜、到处可得，艺术质量往往更高，还能按听众自己的时间地点欣赏。<\/p>\n<p>这些信息共同削弱的是观众所强调的现场不可替代性在现实竞争中的分量。D的主语仍是这些观众，被估计的对象仍是现场演出的价值，<code>overestimate<\/code>则把作者对他们估计偏高的批评说清。<\/p>\n<p>要保留原文的程度：<code>very often<\/code>表示录音艺术质量在很多情况下更高，并不表示每一次都更高。D只说观众高估现场价值，没有把现场说成毫无价值，因此没有越过原文允许的推断范围。<\/p>\n<p>从“观众坚持不可替代”到“作者展示录音多方面的竞争优势”，两部分共同支持“现场价值被估得过高”。D概括的是这组关系，既解释了作者的否定评价，又保留了被评价的人和对象。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文第4段是这样往下写的：<\/p>\n<blockquote>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “consumed” at a time and place of the listener’s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<p>作者先反驳观众对现场不可替代性的坚持，再列出录音的优势，最后说明录音已给传统音乐会造成危机。<\/p>\n<\/blockquote>\n<p>这条路线让“没抓住重点”获得具体含义：观众过分倚重现场的价值，实际听众却有便宜、优质又便利的替代选择。危机不是因为现场突然没有价值，而是现场的价值不足以自动抵消外部竞争。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Devoted concertgoers overrate the value of live performances: inexpensive and convenient recordings can often offer greater artistic quality and compete for the same audience.<\/p>\n<p>忠实的音乐会观众把现场演出的价值估得过高：便宜便利的录音往往能提供更高的艺术质量，并争夺同一群听众。<\/p>\n<\/blockquote>\n<p>这种写法需要“现场被抬得过高”和“录音确有足够竞争力”相互配合。原文已有的推进恰好提供了两端：先点出观众的不可替代论，再用录音优势及危机结果回应，D把这条反驳路线概括了出来。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入23题题干：<\/p>\n<blockquote>\n<p>作者认为，忠实观众过分看重现场演出的不可替代价值，忽略了录音竞争已改变听众的选择；这种既有认识不足以应对乐团重振所面对的现实困难。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>overestimate the value of live performances<br>高估现场演出的价值。<\/p>\n<\/blockquote>\n<p>主旨要求看见现场音乐会面临的深层压力，D指出观众对现场价值估计偏高，正好解释他们为什么没有正视这种压力。主体是忠实观众，对象是现场价值，批评方向是估得过高，三者都能与第4段接上。<\/p>\n<p>局部原文又让这条联系落到实处：观众说录音不可替代现场，作者列出录音多项优势并写出音乐会危机。D没有把问题缩成费用，也没有添加拒听行为或种类数量，保留了作者真正批评的价值判断。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<h3>23题结论<\/h3>\n<blockquote>\n<p><strong>23. D. overestimate the value of live performances<\/strong><\/p>\n<\/blockquote>\n<p>A借用了<code>money<\/code>与录音便宜的事实，却额外补出了“观众忽视现场费用”的判断。<\/p>\n<p>B把“认为录音不能替代现场”改成“拒绝大多数录音”，同时改变动作并扩大范围。<\/p>\n<p>C把作者列举竞争者的材料移给忠实观众，改成他们夸大现场演出的多样性。<\/p>\n<p>D把观众的不可替代论与作者展示的录音优势合起来，准确推断出他们高估现场价值。<\/p>\n<h2>24题<\/h2>\n<blockquote>\n<p>According to the text, which of the following is true of recordings?<br>根据文章，下面哪一项对录音的描述是正确的？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>细节判断题。题干以<code>recordings<\/code>锁定录音，要求判断作者实际说明了录音的哪一项特点。需要逐一核对艺术质量、获取难易、是否改善音乐质量以及收录范围，不能把原文出现过的词直接当成整项成立的依据。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<\/blockquote>\n<p>题干中的<code>recordings<\/code>对应第四段的<code>recorded performances<\/code>与<code>These recordings<\/code>。第一句说明录音也是争夺公众时间、注意力和金钱的竞争者；第二句依次列出价格低、容易获得、艺术质量往往较高、欣赏时间地点自由这几项特点；第三句说明录音广泛可得给传统古典音乐会带来的压力。题目问录音的实际特点，因此要先辨清第二句中的并列事实，再检查选项有没有改变比较方向、添加因果，或添上原文没有的范围限制。<\/p>\n<h3>A. They are often inferior to live concerts in quality.<\/h3>\n<blockquote>\n<p>它们在质量上经常不如现场音乐会。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时已经读到<code>very often much higher in artistic quality than today’s live performances<\/code>，把录音与现场演出的比较摆在一起，发现<code>higher<\/code>是更高，<code>inferior<\/code>却是不如；虽然<code>often<\/code>的频率可以对应，高低方向相反仍足以排除。第一轮排除A，后续没有恢复。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A保留了录音、现场演出和质量这三个要素，也借用了原文的频率信息，却把录音所在的一侧倒了过来。作者说这些录音的艺术质量往往比今天的现场演出高得多，A改成录音经常不如现场音乐会；对象看似齐全，真正决定判断的比较关系已经相反。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，录音在质量上经常不如现场音乐会。<\/p>\n<\/blockquote>\n<p>题干的<code>recordings<\/code>和选项的<code>quality<\/code>共同定位到第四段<code>These recordings<\/code>开头的一句；<code>live concerts<\/code>对应原文作为比较对象的<code>today&#39;s live performances<\/code>。本项问的是双方的质量高低，不是录音是否便宜，也不是听众在哪里欣赏。<\/p>\n<p>第一层出处先用<code>These recordings<\/code>确定主语，随后把<code>cheap<\/code>、<code>available everywhere<\/code>和<code>much higher in artistic quality<\/code>并列为这些录音的特点。<code>higher<\/code>后面的<code>than<\/code>引出今天的现场演出，所以更高的一方是录音，较低的一方是作为对照的现场演出。<\/p>\n<p>A的主语<code>They<\/code>仍然指录音，但<code>inferior to<\/code>表示“不如”。把两边都写成“录音与现场演出相比”之后，原文是录音艺术质量较高，A是录音质量较低；这里不是把同一种关系换一种说法，而是交换了比较结果。<\/p>\n<p>原文的<code>very often<\/code>保留了“很经常”的频率，不能读成每一次录音都胜过现场演出；A的<code>often<\/code>也不能让错误方向变成正确方向。比较关系没有对上，频率上存在相近表达并不能弥补它。<\/p>\n<p>A把原文“这些录音的艺术质量往往高于今天的现场演出”，改成“录音经常不如现场音乐会”；改变的是质量比较的方向。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文第四段是这样写的：<\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<p>这些录音价格低、获取方便，艺术质量还往往高于今天的现场演出，而且听众可以自行选择欣赏时间和地点。它们广泛可得，因此给传统古典音乐会带来了危机。<\/p>\n<\/blockquote>\n<p>作者把较高的艺术质量与价格、便利并列，说明录音为什么是现场演出不能忽视的竞争者；接下来的<code>thus<\/code>把这组优势接到传统音乐会面临的危机上。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>These recordings are cheap and available everywhere, but they are often lower in artistic quality than live concerts.<\/p>\n<p>这些录音虽然便宜、到处可得，但艺术质量经常低于现场音乐会。<\/p>\n<\/blockquote>\n<p>这种写法只把本项需要改变的质量关系改成较低，并保留便宜、可得这两点。这样，质量就会成为录音的短处，作者只能靠其他优势解释它的竞争力。实际文章却将较高质量本身也列为录音的竞争优势，并没有作出这一步让步。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对Gilbert重振乐团持有保留态度，不能判断本项中录音与现场音乐会的具体质量高低关系。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>They are often inferior to live concerts in quality.<br>它们在质量上经常不如现场音乐会。<\/p>\n<\/blockquote>\n<p>主旨回答的是作者怎样看Gilbert重振乐团的前景，A回答的是两种音乐欣赏形式的质量比较；主语和判断层次不同，不能只凭“怀疑重振前景”就倒推出录音必定更好或更差。<\/p>\n<p>本项最终仍要根据“very often much higher in artistic quality than today&#39;s live performances”这处局部原文判断。作者把录音放在质量较高的一侧，A的<code>inferior to<\/code>把它放在较低的一侧；这与原句的比较方向相反。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. They are easily accessible to the general public.<\/h3>\n<blockquote>\n<p>普通公众很容易获得这些录音。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时<code>accessible<\/code>被遮挡成<code>[xxx]<\/code>，选项呈现为<code>They are easily [xxx] to the general public.<\/code>。已读到的<code>easily<\/code>、<code>general public<\/code>能够接上原文的<code>cheap<\/code>、<code>available everywhere<\/code>，但核心词当时仍不能确认，因此第一轮先保留B；A、C、D均排除后，B是唯一留下的一项，随后选择B，后续没有改变。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>B把<code>available everywhere<\/code>所说的“到处都能获得”，换成<code>easily accessible<\/code>所说的“容易获得”。原文的<code>cheap<\/code>进一步说明价格不是很高的门槛，前面的<code>art-loving public<\/code>给出这些录音争夺的公众受众；选项概括的是录音获取方便这一特点，没有把“普通公众能方便获得”说成“所有人都已经购买或欣赏”。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，普通公众很容易获得这些录音。<\/p>\n<\/blockquote>\n<p><code>recordings<\/code>指向第四段的<code>These recordings<\/code>，<code>easily accessible<\/code>对应同一句的<code>available everywhere<\/code>，<code>general public<\/code>则把获取者明确为普通公众。判断重点在<code>accessible<\/code>，这里表示“可以获得、可以接触到”，不是“内容容易理解”。<\/p>\n<p>第一层的第一句写古典器乐演奏者与录音都要争夺公众的时间、注意力和金钱，说明讨论的是面向公众的音乐资源；第二句紧接着写这些录音<code>cheap, available everywhere<\/code>，说明公众获取它们时既有价格上的便利，也有渠道上的便利。<\/p>\n<p>原文和B的对象都是录音，关系都是录音与听众之间的可获得性。<code>available everywhere<\/code>从供应一侧说“很多地方都能得到”，<code>accessible to the general public<\/code>从听众一侧说“公众可以接触、获得”；两种表达把同一件事分别放在资源和使用者的角度说。<\/p>\n<p><code>easily<\/code>概括了到处可得带来的方便。它没有要求每个人都实际拥有录音，也没有断言每个人都喜欢古典音乐；<code>general public<\/code>说明这并非只向少数专业人士开放的资源，而不是把公众偏好说成一致。<\/p>\n<p>B准确改写的是原文“录音便宜且到处可得”中的获取便利；<code>accessible<\/code>恢复完整词义后，原文与选项之间的对应也就清楚了。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文第三、四段是这样写的：<\/p>\n<blockquote>\n<p>All I have to do is to go to my CD shelf, or boot up my computer and download still more recorded music from iTunes.<\/p>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<p>作者拿取自己的CD或开电脑下载，就能听到更多录制音乐；随后把个人经历扩展为录音便宜、到处可得、欣赏时间地点自由的一般特点。<\/p>\n<\/blockquote>\n<p>文章先用“拿CD、开电脑下载”展示获取录音有多方便，再把这种便利放到公众选择音乐欣赏方式的竞争中。录音容易进入听众生活，正是它能给现场音乐会造成压力的一项原因。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Recordings are inexpensive and widely available, so ordinary listeners can obtain them easily.<\/p>\n<p>录音价格不高，而且广泛可得，因此普通听众可以方便地获得它们。<\/p>\n<\/blockquote>\n<p>这个假设只把原文已有的价格、可得性与普通听众的获取过程接起来，没有再添加特殊渠道或资格。它所需要的写法在实际文章中已经出现：作者的CD和下载经历给出具体例子，第四段的<code>cheap, available everywhere<\/code>给出概括，方向与B一致。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者怀疑现有做法是否足以重振乐团，不能判断本项中普通公众获得录音是否容易这一具体特点。<\/p>\n<\/blockquote>\n<p>B实际说的是：<\/p>\n<blockquote>\n<p>They are easily accessible to the general public.<br>普通公众很容易获得这些录音。<\/p>\n<\/blockquote>\n<p>主旨中的怀疑指向Gilbert与乐团能否成功，B的主体是录音，判断的是公众获取它的便利程度。容易获得的录音可以成为理解竞争压力的一条理由，但不能仅凭作者持怀疑态度就认定这条局部理由已经成立。<\/p>\n<p>本项最终仍要根据“cheap, available everywhere”这处局部原文判断。原文明确说明价格低、到处可得，B用<code>easily accessible<\/code>概括普通公众方便获得的特点，保持了同一对象和同一方向。<\/p>\n<p><strong>复盘判断：B正确。<\/strong><\/p>\n<h3>C. They help improve the quality of music.<\/h3>\n<blockquote>\n<p>它们有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时把<code>help improve the quality of music<\/code>接回题干，与原文“录音的艺术质量往往高于现场演出”相比，发现原文只作现有质量的高低比较，C却加入录音促进音乐质量提升的因果动作。第一轮排除C，后续没有恢复。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了原文的<code>quality<\/code>，却把“录音自身的艺术质量较高”改成“录音能帮助音乐质量提高”。前者比较两类现成演出的质量，后者需要说明录音怎样促进创作、演奏或音乐发展；评价对象与它们之间的关系都发生了变化。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，录音有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p><code>recordings<\/code>和<code>quality<\/code>把我们带到第四段<code>These recordings<\/code>开头的一句。虽然两个词都出现了，但需要继续检查原文到底是在描述录音具有怎样的质量，还是在说明录音导致了怎样的质量变化。<\/p>\n<p>第一层出处说这些录音<code>very often much higher in artistic quality than today&#39;s live performances<\/code>。<code>higher ... than ...<\/code>构成比较，比较的一端是这些录音，另一端是今天的现场演出；原句没有描述音乐质量从较低到较高的发展过程。<\/p>\n<p>C的<code>They help improve<\/code>让录音成为推动变化的因素，<code>the quality of music<\/code>成为被改善的对象。这样就需要有一条“因为使用、传播或学习录音，音乐质量得到提高”的因果关系，而不再只是说明录音自身表现得较好。<\/p>\n<p>“某份演奏录音比今天某些现场演出质量高”可以说明听众有更好的欣赏选择，却不能证明这份录音让其他音乐变得更好。原文没有写音乐家通过录音改进技巧，也没有写录音促进了创作质量的上升；这些都是C要成立还需补出的内容。<\/p>\n<p>C把原句的静态质量比较改成了促进质量改善的作用。<code>quality<\/code>虽然相同，<code>are ... higher<\/code>与<code>help improve<\/code>承担的关系不同，不能互换。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文第四段是这样写的：<\/p>\n<blockquote>\n<p>These recordings are cheap, available everywhere, and very often much higher in artistic quality than today&#39;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#39;s choosing.<\/p>\n<p>The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.<\/p>\n<p>作者先列出录音的价格、可得性、艺术质量和欣赏便利，接着说它们广泛可得给传统古典音乐会带来了危机。<\/p>\n<\/blockquote>\n<p>作者从“听众有这些录音可以选择”往下写到“现场音乐会面临竞争”。这里明确写出的后果是传统音乐会受到压力，较高质量是录音已有的优势，并不是录音带来的音乐进步。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>By studying these recordings, today&#39;s musicians can improve the artistic quality of their performances.<\/p>\n<p>通过学习这些录音，今天的音乐家可以提高自己演奏的艺术质量。<\/p>\n<\/blockquote>\n<p>这段假设只补出C需要的最小桥梁：音乐家使用录音作为学习资源，因而使演奏质量提高。实际文章没有沿着“录音—学习—质量改进”写，而是沿着“录音有优势—听众有替代选择—现场音乐会承压”写；两条路线的作用对象和结果不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者对Gilbert重振乐团持有疑虑，不能判断本项中录音是否帮助提高音乐质量这一具体因果关系。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>They help improve the quality of music.<br>它们有助于提高音乐质量。<\/p>\n<\/blockquote>\n<p>“怀疑一位音乐总监能否重振乐团”与“录音能否帮助音乐进步”可以是两个不同问题。不能因为作者强调竞争压力，就反过来声称录音绝不可能帮助音乐进步；也不能把这项作用当作全文主旨自动提供的事实。<\/p>\n<p>本项最终仍要根据“much higher in artistic quality than today&#39;s live performances”这处局部原文判断。这句话比较的是已有录音与现场演出的质量高低，C说的却是录音帮助提高音乐质量，原文的比较不能承担这条新增因果关系。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. They have only covered masterpieces.<\/h3>\n<blockquote>\n<p>它们只收录了杰作。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 这一项没有选项词语遮挡。当时从<code>recorded performances of the great classical musicians<\/code>想到杰出音乐家的录音，但继续检查<code>only<\/code>，发现举出这种高质量资源不等于限定全部录音只收杰作。文中没有排除普通作品、新作品和其他录音的收录可能，第一轮排除D，后续没有恢复。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用“20世纪伟大古典音乐家的录制演出”，把对音乐家的评价移到作品类别上，又加上<code>only<\/code>，把录音内容限定为只有杰作。原文是在举出现场音乐会面对的一类有竞争力的录音，没有给出所有录音的收录规则，也没有说杰出音乐家的每一项录音都只能对应杰作。<\/p>\n<p><strong>命题人借用的原文材料：<\/strong><\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>One possible response is for classical performers to program attractive new music that is not yet available on record.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据文章，录音只收录了杰作。<\/p>\n<\/blockquote>\n<p>题干的<code>recordings<\/code>对应第四段的<code>recorded performances<\/code>，D的<code>masterpieces<\/code>容易使人联想到同一句的<code>great classical musicians<\/code>。但<code>only<\/code>要求的不只是找到优质音乐资源，还要找到“收录内容仅限于杰作、其他内容不包括在内”的限制。<\/p>\n<p>第一层第一处出处把20世纪伟大古典音乐家的录音列为古典器乐演奏者需要面对的竞争者。它回答的是“现场演出还与哪些资源竞争”，没有罗列录音全部收录什么；<code>great<\/code>修饰的是<code>musicians<\/code>，也不是一个用来划定作品类别的词。<\/p>\n<p>D把主语扩成题干所问的录音，并用<code>have only covered<\/code>给它附上一条排他性的收录结论。提到杰出音乐家的演出，只能说明这类录音存在并有竞争力，不能说明其他演出或作品都没有被录制。<\/p>\n<p>第一层第二处出处说可以安排“尚未有录音的有吸引力的新音乐”。<code>not yet<\/code>限定的是这类新音乐目前尚未录制的状态；作者并没有接着说因为它们不是杰作，所以录音永远不会收录。不能把某些新音乐暂时没有录音，反推成录音仅收杰作的规则。<\/p>\n<p>D先把音乐家的声望换成作品必须属于杰作，再用<code>only<\/code>排除其他全部收录内容。这两个限定都没有原文依据，完整的“只收录杰作”命题因此无法从出处得到。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文第四、五段是这样写的：<\/p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.<\/p>\n<p>One possible response is for classical performers to program attractive new music that is not yet available on record.<\/p>\n<p>作者先指出杰出古典音乐家的录音参与争夺公众，后来提出一种可能的回应：现场演出可以安排尚无录音的新音乐。<\/p>\n<\/blockquote>\n<p>文章沿着“哪些资源形成竞争—现场演出能怎样回应”推进。新音乐的意义在于暂时不能通过录音听到，作者没有把讨论转成录音收录内容必须满足的作品等级。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>The music covered by recordings consists exclusively of masterpieces; no other works have been included.<\/p>\n<p>录音收录的音乐完全由杰作构成，其他作品都没有被收录。<\/p>\n<\/blockquote>\n<p>这个假设明确写出<code>only<\/code>所需的排除：除了杰作，其他作品不在录音范围内。实际文章只举出伟大音乐家的录音，并提出演出尚未录制的新音乐；既没有把人物评价改成作品收录标准，也没有排除非杰作，因此无法接出D所要求的限制。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>25题的正确答案是：<\/p>\n<blockquote>\n<p>Doubtful about Gilbert’s ability to revitalize the Philharmonic<br>作者怀疑Gilbert仅靠现有做法能否真正重振乐团。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入24题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者怀疑Gilbert仅靠现有做法重振乐团的可能，不能判断本项中录音是否只收录杰作这一具体范围限制。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>They have only covered masterpieces.<br>它们只收录了杰作。<\/p>\n<\/blockquote>\n<p>主旨涉及乐团的前景和现有办法是否足够，D涉及所有录音的作品范围。即使知道作者认为乐团面临困难，也不能由此判断市场上的录音只包含哪一类作品，更不能自动补出<code>only<\/code>这样的排除条件。<\/p>\n<p>本项最终仍要根据“the recorded performances of the great classical musicians of the 20th century”这处局部原文判断。这里介绍的是参与竞争的录音资源，<code>great<\/code>评价音乐家，原文没有把作品限定为杰作，也没有排除其他收录内容。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<h3>24题结论<\/h3>\n<blockquote>\n<p><strong>24. B. They are easily accessible to the general public.<\/strong><\/p>\n<\/blockquote>\n<p>A借用了质量比较，却把录音往往较高改成录音经常较低，颠倒了高低方向。<\/p>\n<p>B用<code>easily accessible<\/code>准确改写<code>available everywhere<\/code>，概括普通公众容易获得录音这一特点。<\/p>\n<p>C借用了<code>quality<\/code>，却把已有质量的比较改成录音促进音乐质量提高的因果作用。<\/p>\n<p>D从杰出音乐家的录音补出“只收录杰作”，添加了作品类别和排他性的范围限制。<\/p>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：任命反响与惊讶<\/strong>（段落1-2总体评价） 吉尔伯特任命引发热议：（2009年突然宣布 → 古典音乐界热门话题）→ 反响积极：（托马西尼：&quot;万岁！终于！&quot;）// 但令人惊讶：【吉尔伯特相对不知名 + 被描述为&quot;不矫揉造作&quot;、&quot;没有令人敬畏的指挥家气质&quot;】→ 与前任对比：（马勒、布列兹等大师 // 吉尔伯特的描述显得苍白）<\/p>\n<p>↓（作者的个人立场）<\/p>\n<p><strong>逻辑层次2：作者的怀疑态度<\/strong>（段落3个人观点） 对吉尔伯特能力不确定：（不知道他是否是好指挥家）→ 现场演出不是必需的：【虽然他演奏多样有趣的作品 // 但可以通过CD和iTunes听音乐】<\/p>\n<p>↓（深入分析问题）<\/p>\n<p><strong>逻辑层次3：古典音乐会面临的危机<\/strong>（段落4核心问题） 忠实观众的误解：（认为录音不能替代现场 → 没抓住要点）→ 竞争现实：【古典演奏家不仅要与其他艺术形式竞争 + 还要与20世纪大师录音竞争】→ 录音的优势：（便宜 + 随处可得 + 质量往往更高 + 时间地点灵活）→ 结果：传统古典音乐会体制陷入危机<\/p>\n<p>↓（可能的解决方案）<\/p>\n<p><strong>逻辑层次4：改革的可能与挑战<\/strong>（段落5未来展望） 可能方案：演奏还没有录音的新音乐 → 吉尔伯特的潜力：（对新音乐感兴趣 + 被认为能让爱乐乐团更有活力）// 但挑战依然存在：【仅扩展曲目不够 → 必须改变乐团与新观众的关系】<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：虽然吉尔伯特的任命受到欢迎，但作者对其能否真正振兴纽约爱乐乐团持怀疑态度。在录音技术使古典音乐随处可得的时代，传统音乐会面临生存危机，仅仅扩展曲目是不够的，必须从根本上改变与观众的关系。<\/p>\n<h2>小标题题<\/h2>\n<p>Read the following text and choose the most suitable heading from the list A–G for each numbered section (41–45). There are two extra headings.<\/p>\n<p>[A] Making live concerts matter in an age of recordings<\/p>\n<p>[B] Replacing traditional concerts with recorded performances<\/p>\n<p>[C] Bridging a cultural gap that youth alone cannot close<\/p>\n<p>[D] Earning the audience’s support through communication<\/p>\n<p>[E] Making high culture part of ordinary human life<\/p>\n<p>[F] Restoring the celebrity conductor through television<\/p>\n<p>[G] Why elite institutions need a non-elite public<\/p>\n<h3>41. ______<\/h3>\n<p>For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with other arts organizations but also with recordings of the great musicians of the twentieth century. These recordings are cheap, widely available, often artistically superior to today’s live performances, and convenient to hear. Their availability has brought about a crisis in the traditional classical concert.<\/p>\n<p>One possible response is to perform attractive new music that is not yet available on record. Alan Gilbert’s interest in new music has therefore attracted attention. But merely changing the New York Philharmonic’s repertoire will not be enough. If Gilbert and the orchestra are to succeed, they must change their relationship with the new audience they hope to attract.<\/p>\n<h3>42. ______<\/h3>\n<p>News reports emphasized that Gilbert was forty. Another orchestra had hired the even younger Gustavo Dudamel. Yet their youthfulness alone was unlikely to persuade people under thirty to attend concerts. The generation gap went deeper than the age of a music director.<\/p>\n<p>Leonard Bernstein had been famous before becoming the Philharmonic’s music director, partly through recordings, Broadway, films, and television. Gilbert could not follow the same route: popular culture had withdrawn its attention from classical music, major labels recorded it only occasionally, and national media seldom covered it. Meanwhile, the dismantling of school music programs had left many young Americans knowing little about it. Gilbert therefore needed new ways of reaching them, including a sustained and intelligent use of web-based media.<\/p>\n<h3>43. ______<\/h3>\n<p>Beverly Sills’s death was mourned by many people who could have known little about the singing that originally made her famous. Her regular appearances on popular television programs had won the affection of millions who otherwise would never have heard of her.<\/p>\n<p>Bernstein reached a mass audience in a different way but sent a similar message. On one television program, he introduced Aaron Copland as an ordinary-looking man in a business suit, who then conducted his own music. The point was that creating classical music was a normal human activity. Sills likewise challenged the image of opera singers as strange, foreign creatures by showing that they led ordinary lives with families, children, and problems.<\/p>\n<h3>44. ______<\/h3>\n<p>Greg Sandow argued that the fine arts could no longer remain separate from the wider culture and somehow above it. The author agreed in part: to revive a culture in which ordinary middle-class Americans respected and engaged with the arts, artists would have to learn to use today’s mass media.<\/p>\n<p>There was nevertheless a serious argument for artistic elitism. Clement Greenberg had maintained that middlebrow culture could undermine high culture. But whatever one thought of that argument, a practical fact remained: orchestras, museums, ballet, opera, and theater companies were costly institutions. These elite enterprises could not survive without the wholehearted support of a non-elite democratic public that believed in their significance. Bernstein and Sills had tried to communicate that high culture was accessible to people willing to understand it.<\/p>\n<h3>45. ______<\/h3>\n<p>Since Bernstein’s time, the New York Philharmonic’s efforts to attract new audiences had rarely involved its music directors. Kurt Masur and Lorin Maazel saw their work as primarily musical and assumed that the wider community would recognize its value.<\/p>\n<p>Gilbert could not enjoy that luxury. Simply exposing young people to masterpieces would not guarantee that they recognized their greatness, particularly if musicians treated listeners who failed to appreciate them as stupid. This condescending attitude reflected an entitlement mentality: musicians believed they deserved public support instead of having to earn it. Gilbert’s harder and more important task would be to become a great communicator, finding new ways to explain the value of high culture to a generation increasingly unfamiliar with it.<\/p>\n<h3>41题解析<\/h3>\n<p><strong>答案：A — Making live concerts matter in an age of recordings。<\/strong> 中文：在录音时代，让现场音乐会重新具有吸引人的价值。<\/p>\n<p>这一部分整体在回答：录音已经方便、便宜而且质量很高，现场音乐会凭什么继续争取观众？第一段建立竞争处境，第二段讨论出路，所以不能只用“录音有优势”概括整块内容。<\/p>\n<p>关键证据在两处。开头的 compete 把现场表演和录音放进同一个争夺观众时间与金钱的场景；第二段的 But 把“演奏未录制的新作品”降为不充分的办法，结尾真正落在 change their relationship with the new audience。<\/p>\n<p>段内推进链是：大师录音随手可得 → 传统音乐会陷入危机 → 新作品可以提供一点不同的东西 → 只改曲目还不够 → 需要改变与新观众的关系。<\/p>\n<p>标题中 in an age of recordings 对应录音造成的竞争环境；making live concerts matter 对应后半部分寻找现场音乐会继续吸引观众的理由。它把问题和解决方向一起收住。<\/p>\n<p>最强干扰项是B。它抓住了录音优势，却把作者的任务换成“用录音取代传统音乐会”。原文是在危机中寻找现场演出的生路，最后要求乐团主动改变与观众的关系，没有主张取消现场演出。<\/p>\n<p><strong>最终答案：41选A。<\/strong><\/p>\n<h3>42题解析<\/h3>\n<p><strong>答案：C — Bridging a cultural gap that youth alone cannot close。<\/strong> 中文：跨越一个仅靠年轻指挥家无法弥合的文化隔阂。<\/p>\n<p>这一部分先否定“指挥家年轻，年轻观众自然会来”，再解释真正的隔阂从哪里产生，最后提出需要新的沟通渠道。年龄是进入问题的入口，文化环境和传播方式才是讨论主体。<\/p>\n<p>开头的 Yet 和 The generation gap went deeper 明确把读者从年龄带向深层原因。第二段接着用 Bernstein 的成名路径与 Gilbert 面对的环境作对照；结尾 therefore 把“旧路走不通”收束为“寻找新路”。<\/p>\n<p>段内推进链是：两位年轻指挥家上任 → 年轻不足以吸引年轻人 → 伯恩斯坦曾经拥有唱片和大众媒体入口 → 这些入口已缩小，学校音乐教育也遭削弱 → 新一代更陌生 → 需要持续而有效地使用网络等新渠道。<\/p>\n<p>标题的 cultural gap 对应公众关注与音乐教育共同变化造成的陌生；youth alone cannot close 对应第一段的明确否定；bridging 对应结尾主动接触年轻听众的方向，三个部分各有落点。<\/p>\n<p>最强干扰项是F。文中确实提到电视，也回顾了明星指挥家的成名条件，但这是为了说明 Gilbert 不能照搬旧路。把这部分概括成“通过电视恢复明星指挥家”，恰好颠倒了新旧环境的关系，也漏掉网络渠道与教育背景。<\/p>\n<p><strong>最终答案：42选C。<\/strong><\/p>\n<h3>43题解析<\/h3>\n<p><strong>答案：E — Making high culture part of ordinary human life。<\/strong> 中文：让人们看到高雅文化也是普通人的生活的一部分。<\/p>\n<p>这一部分用 Sills 和 Bernstein 两个例子，解释有效传播究竟向公众传递什么。它不仅在说“他们上过电视”，而是在说他们怎样改变公众对古典音乐家的想象。<\/p>\n<p>第一段的 otherwise would never have heard of her 显示 Sills 接触到了原本圈外的人。第二段的 a similar message 把两个人的事例合并；normal human activity 和 ordinary lives 则直接点明两例共有的信息。<\/p>\n<p>段内推进链是：不熟悉演唱事业的人仍喜爱 Sills → 电视使她走近大众 → Bernstein 也让作曲家以普通人的形象出现 → Sills 展示家庭与日常烦恼 → 古典音乐不再显得属于遥远而奇怪的特殊人群。<\/p>\n<p>标题中的 high culture 对应古典音乐、作曲与歌剧；ordinary human life 对应普通人的外貌、工作、家庭和问题；making ... part of ... 概括的是两位传播者帮助观众建立亲近感的共同作用。<\/p>\n<p>最强干扰项是F。电视确实是这些例子使用的工具，但作者没有在这里论证如何重新制造明星指挥家。Sills 还是歌剧演唱家，范围也装不进“指挥家”。两例共同落点是拉近艺术家与普通人的距离，不能把传播渠道和名望当作整部分的主旨。<\/p>\n<p><strong>最终答案：43选E。<\/strong><\/p>\n<h3>44题解析<\/h3>\n<p><strong>答案：G — Why elite institutions need a non-elite public。<\/strong> 中文：为什么精英艺术机构需要非精英公众的支持。<\/p>\n<p>这一部分先谈高雅艺术与大众文化的关系，再承认艺术精英主义有可讨论之处，最终把讨论落到机构生存的现实条件。关键不是要把高雅艺术改成大众娱乐，而是这些机构要持续运转，就必须让圈外公众认可其意义。<\/p>\n<p>关键证据是第二段的 But whatever one thought of that argument。作者暂时搁置审美争论，转向 could not survive without ... support 这个实际依赖关系。前面的 costly institutions 则解释了为什么需要这种支持。<\/p>\n<p>段内推进链是：艺术不能自居于社会之外 → 大众媒体可帮助公众接触艺术 → 精英主义仍有辩护空间 → 但机构运行需要资源和认可 → 非精英公众必须相信这些机构有价值 → 传播艺术的可接近性因此十分必要。<\/p>\n<p>标题的 elite institutions 对应交响乐团、博物馆、芭蕾、歌剧与剧院；non-elite public 对应拥有民主社会主体身份的普通公众；need 对应不能脱离其支持而生存的必要关系。<\/p>\n<p>最强干扰项是E。末句确实提到“艺术可以被普通人理解”，但在这里，它用来说明 Bernstein 和 Sills 怎样争取支撑艺术机构的公众。整块的中心是机构对公众的依赖，不是像上一部分那样展示艺术家的普通生活。必须根据同一细节在本段承担的功能判断范围。<\/p>\n<p><strong>最终答案：44选G。<\/strong><\/p>\n<h3>45题解析<\/h3>\n<p><strong>答案：D — Earning the audience’s support through communication。<\/strong> 中文：通过沟通赢得观众支持。<\/p>\n<p>这一部分从历任指挥家的职责观念切入，指出他们把社会认可当成理所当然，再要求 Gilbert 改变这种态度。整部分给出的办法，是主动向新一代解释艺术价值，从而把支持赢回来。<\/p>\n<p>前半段的 assumed 表明旧做法依赖一个未经争取的前提：音乐演好，社会就会认可。第二段的 could not enjoy that luxury 否定这个前提；deserved 与 earn 的对照说出观念差别，最后的 great communicator 给出新的工作重点。<\/p>\n<p>段内推进链是：前任只把工作理解成音乐事务 → 默认公众会认可 → 杰作曝光并不自动带来欣赏 → 居高临下反而隔开年轻人 → 放弃“我应得支持”的心态 → 靠新的沟通方式争取支持。<\/p>\n<p>标题中的 earning 对应 earn 与 deserved 的直接对照；audience’s support 对应乐团与年轻公众的关系；through communication 对应 Gilbert 应成为 great communicator 的结尾要求。<\/p>\n<p>最强干扰项是G。两项都谈公众支持，但G是在解释“为什么机构离不开公众”，而本部分重心已经推进到“艺术家该怎样做”。指挥家职责、傲慢态度以及新的沟通任务，都需要D才能完整覆盖。<\/p>\n<p><strong>最终答案：45选D。<\/strong><\/p>\n<h2>排序题<\/h2>\n<p>The following paragraphs are given in a wrong order. Reorganize them into a coherent text by choosing from the list A–H to fill in each numbered box (41–45). Paragraphs A, E and H have been correctly placed.<\/p>\n<table>\n<thead>\n<tr>\n<th>已给位置<\/th>\n<th>41<\/th>\n<th>42<\/th>\n<th>已给位置<\/th>\n<th>43<\/th>\n<th>44<\/th>\n<th>45<\/th>\n<th>已给位置<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>E<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>______<\/td>\n<td>H<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h3>[A]<\/h3>\n<p>The New York Philharmonic’s appointment of Alan Gilbert was warmly welcomed. Yet whether he was a fine conductor was only part of the problem facing him. Classical performers competed for the public’s time and money with cheap, convenient recordings of great musicians. Listeners could hear excellent performances without entering a concert hall. The availability of those recordings had created a crisis for the traditional concert and raised a question: what could a live orchestra offer that was not already on record?<\/p>\n<h3>[B]<\/h3>\n<p>The two performers’ television appearances conveyed more than musical excellence. Bernstein once introduced the composer Aaron Copland as an ordinary-looking man who then conducted his own work. Sills showed that opera singers had families, children, and everyday problems. Their shared message was that high culture was a human activity, accessible to ordinary people willing to make an effort to understand it. Communicating this accessibility helped connect cultural institutions with the wider public.<\/p>\n<h3>[C]<\/h3>\n<p>Yet the orchestra Bernstein had led largely forgot this responsibility. Its later music directors, including Kurt Masur and Lorin Maazel, treated their duties as purely musical and assumed that the community would appreciate their value. Such assumptions encouraged an entitlement mentality: musicians expected public support as something they deserved. Simply exposing young listeners to masterpieces, while looking down on those who did not immediately admire them, could not repair that relationship.<\/p>\n<h3>[D]<\/h3>\n<p>One possible answer was attractive new music not yet available on record. Gilbert’s interest in contemporary compositions made that response plausible. But merely adjusting the orchestra’s repertoire would not be enough; it had to change its relationship with a new audience. Nor could a younger director by himself bring young people into the hall. Gilbert’s youth, like that of Gustavo Dudamel in Los Angeles, did not remove the deeper cultural gap between classical music and younger Americans.<\/p>\n<h3>[E]<\/h3>\n<p>Although those old routes to fame had narrowed, the purpose of the earlier outreach remained useful. Consider two performers who had used television to reach far beyond their regular audiences: Beverly Sills and Leonard Bernstein. Sills appeared on popular entertainment programs and won the affection of millions who knew little about her singing. Bernstein used televised concerts to talk about music. Despite the difference in their programs, both helped viewers feel that classical musicians belonged to the same world as themselves.<\/p>\n<h3>[F]<\/h3>\n<p>This message of accessibility had a practical importance as well as an idealistic one. A defense of artistic elitism might be intellectually serious, but symphony orchestras, museums, ballet, opera, and theater companies were expensive institutions. They could not survive without a non-elite public that believed in their significance. Their dependence on that public made communication a responsibility, not an optional addition to artistic work.<\/p>\n<h3>[G]<\/h3>\n<p>That cultural gap had widened because popular culture was paying less attention to classical music and school music programs had been dismantled. Bernstein had become famous through Broadway, films, recordings, and network television before he led the Philharmonic. Gilbert could not expect comparable publicity: major labels recorded classical music only sporadically, and national media rarely covered it. To reach unfamiliar listeners, he therefore needed new channels, such as web-based media; the old routes to fame were no longer open in the same way.<\/p>\n<h3>[H]<\/h3>\n<p>Gilbert therefore had to begin by earning the support that earlier conductors had taken for granted. Being a great conductor would matter, but becoming a great communicator would matter even more to the future of classical music. He would need to find new ways to do what Bernstein had done: make the case for high culture to a generation that knew little of its power and might even look down on it.<\/p>\n<h2>排序题全局解析<\/h2>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>本段功能<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>从Gilbert的任命引出录音竞争，并提出现场乐团还能提供什么的问题。<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>解释两位传播者通过电视传递的共同信息：高雅艺术也是普通人的活动。<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>指出乐团后来的指挥家忘记传播责任，并批评把公众支持视为应得之物的心态。<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>回答A的新作品思路，同时指出只改曲目或只换年轻指挥家都不足够。<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>在旧成名渠道已缩小的前提下，回看Sills与Bernstein曾怎样接触大众。<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>解释可接近性信息的现实意义：昂贵艺术机构需要非精英公众，传播是责任。<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>解释D所说的文化隔阂：媒体关注与学校音乐教育变化，使旧成名路径失效。<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>面向Gilbert收束要求：争取支持，成为能向新一代说明艺术价值的沟通者。<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>全文推进链是：录音竞争下提出问题 → 新曲目与年轻指挥家都不足以解决 → 找出文化与传播环境变化 → 回看过去成功的沟通者 → 提炼两人传达的信息 → 说明机构为什么需要这种传播 → 指出现实中遗忘责任与理所当然的心态 → 要求Gilbert重新赢得公众。<\/p>\n<p>这里有三组必须接稳的局部链：A提出“没有录音的东西”与D的One possible answer；D的cultural gap与G的That cultural gap；E引入两位传播者与B的The two performers。后半部分再由B的accessibility接F的This message of accessibility，由F的communication a responsibility接C的this responsibility，最后由C的expected public support接H的earning the support。<\/p>\n<p><strong>完整顺序：A—D—G—E—B—F—C—H。<\/strong><\/p>\n<p><strong>41—45：D、G、B、F、C。<\/strong><\/p>\n<h3>排序41题解析<\/h3>\n<p>当前空位在已给A之后、42题之前。A段末已经问：现场乐团能提供什么还没有录成唱片的东西？41题需要承接这个问题，随后才能把讨论推进到更深一层的障碍。<\/p>\n<p>A段尾是 what ... was not already on record；D段首是 One possible answer，紧接 attractive new music not yet available on record。问题对象、回答形式和“尚无录音”的限定连续吻合。D结尾再提出 deeper cultural gap，而后一空G的段首正是 That cultural gap。<\/p>\n<p>因此这里不是看见重复的 music 就配对，而是A提出问题，D作有限度的回答，再用 But 和 Nor 连续指出方案不足，给下一段留下需要解释的文化隔阂。<\/p>\n<p>局部推进链：A的录音竞争与提问 → D的新曲目方案 → 新曲目和年轻化都不够 → G解释文化隔阂。<\/p>\n<p>最强候选是G，因为它也讨论青年与古典音乐的关系。但若把G直接放在A后面，That cultural gap 在A中没有对应的已提出对象，A明确提出的“现场能提供什么”也没有先得到回答。D把这两端同时接通。<\/p>\n<p><strong>最终答案：41填D。<\/strong><\/p>\n<h3>排序42题解析<\/h3>\n<p>当前空位在已确定的D之后、已给E之前。两侧都要检查：D最后刚提出 deeper cultural gap，E开头却已经在说 those old routes to fame had narrowed，中间这一段必须把文化隔阂解释清楚，并引入已经缩小的旧成名渠道。<\/p>\n<p>G开头的 That cultural gap 精确回指D的结尾；G随后对照Bernstein与Gilbert的媒体条件，结尾直接说 the old routes to fame were no longer open in the same way。E再以 Although those old routes to fame had narrowed 接住这一结论。<\/p>\n<p>指代链把前端接稳，重复对象把后端接稳。更关键的是段落功能连续：D指出隔阂存在，G解释为什么存在，E转向“渠道虽变，过去传播的目的仍值得借鉴”。<\/p>\n<p>局部推进链：D提出年龄无法消除的隔阂 → G说明媒体与教育条件改变、旧路不再畅通 → E回看旧传播者可保留的价值。<\/p>\n<p>最强候选是F，它也谈高雅艺术与大众的距离，但段首 This message of accessibility 需要先出现某个具体传播信息；D还没有给出这个信息。F也无法为E的 those old routes to fame 提供前项。<\/p>\n<p><strong>最终答案：42填G。<\/strong><\/p>\n<h3>排序43题解析<\/h3>\n<p>当前空位在已给E之后、44题之前。E已经并列介绍Sills和Bernstein，还指出两人都使公众感到音乐家与自己属于同一个世界。下一段应把这个共同作用解释得更具体。<\/p>\n<p>E末尾的 both 对应B段首的 The two performers；B随后分别补充Copland普通人的外貌与Sills的家庭生活，结尾明确命名这个共同信息为 accessibility。后一空F则以 This message of accessibility 开始。<\/p>\n<p>人物指代要求B依赖E，概念命名又使F依赖B。E先介绍传播者及他们接近大众的渠道，B再解释传播内容，因此不能把“谁做了什么”和“这些行为传达了什么”倒置。<\/p>\n<p>局部推进链：E介绍两位电视传播者 → B用具体例子提炼普通人也可接近高雅艺术的信息 → F说明这个信息为什么关系机构的生存。<\/p>\n<p>最强候选是F。它似乎也能概括E的亲近感，但F的 This message of accessibility 指向的是B已明确表达的可接近性信息；若直接放F，就会把尚未展开的共同信息跳过去，B也无法再保持紧接E两个人物的说明关系。<\/p>\n<p><strong>最终答案：43填B。<\/strong><\/p>\n<h3>排序44题解析<\/h3>\n<p>当前空位在已确定的B之后、45题之前。B结尾已经把两位艺术家的做法概括为向大众传达高雅文化的 accessibility，下面需要说明这种传播的意义，再转到后来的人有没有履行它。<\/p>\n<p>B段尾的 Communicating this accessibility 与F段首的 This message of accessibility 紧接。F解释昂贵艺术机构无法脱离非精英公众，最后把 communication 定义为 a responsibility。后一空C开头的 this responsibility 正好取用这个已明确的责任。<\/p>\n<p>这里的衔接不只靠相同词语。B回答“传播了什么”，F回答“为什么这件事不是可做可不做”，C才有根据批评后来忘记责任的指挥家。<\/p>\n<p>局部推进链：B的可接近性信息 → F的机构依赖公众 → 沟通成为责任 → C转折指出后来遗忘了这一责任。<\/p>\n<p>最强候选是C。它直接接B看似也能说“遗忘传播”，但 this responsibility 的明确前项尚未建立；更重要的是，必须先由F说明公众支持与机构生存的关系，C的批评才有完整的论证依据。把F放到C后还会打断C的问题与H的要求之间的收束关系。<\/p>\n<p><strong>最终答案：44填F。<\/strong><\/p>\n<h3>排序45题解析<\/h3>\n<p>当前空位在已确定的F之后、已给H之前。F刚证明沟通是一种责任；H则要求Gilbert去赢得早先指挥家视为理所当然的支持。45题必须既回接这份责任，也交代H批评的旧心态。<\/p>\n<p>F结尾的 communication a responsibility 对应C段首的 Yet ... forgot this responsibility。C随后点名Masur与Maazel，并说他们 expected public support as something they deserved；H的 earning the support that earlier conductors had taken for granted 正是对这一心态的回应。<\/p>\n<p>Yet让C与F形成“本该如此，但现实并非如此”的转折；H的 therefore 则把C指出的问题转成Gilbert的行动要求。这里从规范、到偏离规范的现实、再到纠正现实的结论，方向完整。<\/p>\n<p>局部推进链：F说明传播责任 → C指出遗忘责任、默认应获支持及居高临下的问题 → H要求主动赢得支持并成为沟通者。<\/p>\n<p>最强候选是D，它也说旧办法不够，但D讨论的是新曲目和年轻化，并未涉及H中的 earlier conductors 或 taken for granted；而且D的段首必须回答A提出的问题。只有C同时满足F与H的两端衔接。<\/p>\n<p><strong>最终答案：45填C。<\/strong><\/p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词<\/h2>\n<table>\n<thead>\n<tr>\n<th>可积累的主题表达<\/th>\n<th>中文翻译<\/th>\n<th>所属类别<\/th>\n<th>使用层级<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>artistic appreciation<\/td>\n<td>艺术欣赏<\/td>\n<td>社会现象类—文化教育<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td><strong>cultural innovation<\/strong><\/td>\n<td><strong>文化创新<\/strong><\/td>\n<td><strong>社会现象类—文化教育<\/strong><\/td>\n<td><strong>宏观主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>preserving traditional culture<\/td>\n<td>保护传统文化<\/td>\n<td>社会现象类—文化教育<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td><strong>cultural participation<\/strong><\/td>\n<td><strong>文化参与<\/strong><\/td>\n<td><strong>社会现象类—文化教育<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>musical diversity<\/td>\n<td>音乐多样性<\/td>\n<td>教育文化类<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td><strong>keeping pace with the times<\/strong><\/td>\n<td><strong>与时俱进<\/strong><\/td>\n<td><strong>人生哲理类<\/strong><\/td>\n<td><strong>个人主题<\/strong><\/td>\n<\/tr>\n<tr>\n<td>rational consumption<\/td>\n<td>理性消费<\/td>\n<td>社会现象类—社会生活<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<tr>\n<td>cultural products<\/td>\n<td>文化产品<\/td>\n<td>经济消费类<\/td>\n<td>宏观主题<\/td>\n<\/tr>\n<tr>\n<td>creativity<\/td>\n<td>创造力<\/td>\n<td>人生哲理类<\/td>\n<td>个人主题<\/td>\n<\/tr>\n<\/tbody><\/table>\n<h2>2. 大作文第一段描述题目信息时可积累的表达<\/h2>\n<table>\n<thead>\n<tr>\n<th>适用题型<\/th>\n<th>考试时可复用的形式<\/th>\n<th>中文翻译<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><strong>图画题<\/strong><\/td>\n<td><strong>In the picture, A is enjoying a variety of B.<\/strong><\/td>\n<td><strong>图画中，A正在欣赏各种各样的B。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>The picture shows A turning B into a more vibrant C.<\/td>\n<td>图画展现了A把B变成一个更有活力的C。<\/td>\n<\/tr>\n<tr>\n<td>图画题<\/td>\n<td>In the picture, A is trying to attract a new audience by offering B.<\/td>\n<td>图画中，A试图通过提供B吸引新的受众。<\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart shows the growing availability of A over the period from B to C.<\/td>\n<td>图表显示，从B到C这段时期，A变得越来越容易获得。<\/td>\n<\/tr>\n<tr>\n<td><strong>图表题<\/strong><\/td>\n<td><strong>According to the chart, A is markedly different from B in terms of C.<\/strong><\/td>\n<td><strong>根据图表，在C方面，A与B有明显差异。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>图表题<\/td>\n<td>The chart compares the time and money spent on A, B and C.<\/td>\n<td>图表比较了花在A、B、C上的时间和金钱。<\/td>\n<\/tr>\n<tr>\n<td><strong>文本评论题<\/strong><\/td>\n<td><strong>The passage focuses on the relationship between A and B.<\/strong><\/td>\n<td><strong>短文着重讨论A与B之间的关系。<\/strong><\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage discusses how A can attract a new audience by changing B.<\/td>\n<td>短文讨论了A如何通过改变B吸引新的受众。<\/td>\n<\/tr>\n<tr>\n<td>文本评论题<\/td>\n<td>The passage raises the question of whether merely expanding A is enough to achieve B.<\/td>\n<td>短文提出了这样一个问题：仅仅扩大A是否足以实现B。<\/td>\n<\/tr>\n<\/tbody><\/table>\n";

 return new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true})});
}
function hydrateAssets(root){
 if(!root)return Promise.resolve();
 root.querySelectorAll('img.embedded-asset[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
 return Promise.all([...root.querySelectorAll('img')].map(imageReady));
}
function afterLayout(place,epoch,delay=80){

 img.alt=ctx.label||'';loadAsset(ctx.asset,function(src){img.src=src;});

 },epoch));
