td>prep.处于工作空档期\u003c/td>\n\u003ctd>traditional rule\u003c/td>\n\u003ctd>n.传统规则\u003c/td>\n\u003ctd>safer\u003c/td>\n\u003ctd>a.更安全的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fundamentally\u003c/td>\n\u003ctd>adv.根本上\u003c/td>\n\u003ctd>invert\u003c/td>\n\u003ctd>v.颠倒\u003c/td>\n\u003ctd>headhunter\u003c/td>\n\u003ctd>n.猎头\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>hurt\u003c/td>\n\u003ctd>v.伤害\u003c/td>\n\u003ctd>stay too long\u003c/td>\n\u003ctd>v.留任过久\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot; Broadcasting his ambition was &quot;very much my decision,&quot; McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>When Liam McGee departed / as president of Bank of America / in August, / his explanation was / surprisingly straight up.\u003c/p>\n\u003cp>Rather than cloaking his exit / in the usual vague excuses, / he came right out and said / he was leaving / &quot;to pursue my goal / of running a company.&quot;\u003c/p>\n\u003cp>Broadcasting his ambition / was &quot;very much my decision,&quot; / McGee says.\u003c/p>\n\u003cp>Within two weeks, / he was talking / for the first time / with the board / of Hartford Financial Services Group, / which named him / CEO and chairman / on September 29.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>当利亚姆·麦吉离开 / 作为美国银行的总裁 / 在八月，/ 他的解释是 / 出人意料地直率。\u003c/p>\n\u003cp>而不是掩饰他的离职 / 用通常的模糊借口，/ 他直接出来说 / 他要离开 / &quot;去追求我的目标 / 管理一家公司。&quot;\u003c/p>\n\u003cp>公开他的雄心 / 是&quot;完全是我的决定，&quot; / 麦吉说。\u003c/p>\n\u003cp>在两周内，/ 他正在交谈 / 第一次 / 与董事会 / 哈特福德金融服务集团的，/ 该集团任命他 / CEO和董事长 / 在9月29日。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>当利亚姆·麦吉在八月离开美国银行总裁职位时，他的解释出人意料地直率。他没有用通常的模糊借口来掩饰离职，而是直接说他要离开&quot;去追求管理一家公司的目标&quot;。麦吉说，公开自己的雄心&quot;完全是我的决定&quot;。两周内，他首次与哈特福德金融服务集团的董事会会谈，该集团在9月29日任命他为CEO和董事长。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>McGee says / leaving without a position lined up / gave him time / to reflect on / what kind of company / he wanted to run.\u003c/p>\n\u003cp>It also sent / a clear message / to the outside world / about his aspirations.\u003c/p>\n\u003cp>And McGee isn&#39;t alone.\u003c/p>\n\u003cp>In recent weeks / the No.2 executives / at Avon and American Express / quit / with the explanation / that they were looking for / a CEO post.\u003c/p>\n\u003cp>As boards scrutinize / succession plans / in response to / shareholder pressure, / executives who don&#39;t get the nod / also may wish to move on.\u003c/p>\n\u003cp>A turbulent business environment / also has senior managers / cautious of / letting vague pronouncements / cloud their reputations.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>麦吉说 / 离开时没有安排好职位 / 给了他时间 / 去思考 / 什么样的公司 / 他想要管理。\u003c/p>\n\u003cp>这也发出了 / 一个清晰的信息 / 给外界 / 关于他的抱负。\u003c/p>\n\u003cp>而且麦吉并不孤单。\u003c/p>\n\u003cp>在最近几周 / 二号高管们 / 在雅芳和美国运通 / 辞职了 / 带着解释 / 他们正在寻找 / CEO职位。\u003c/p>\n\u003cp>当董事会审查 / 继任计划 / 响应 / 股东压力，/ 没有获得认可的高管们 / 也可能希望离开。\u003c/p>\n\u003cp>动荡的商业环境 / 也让高级经理们 / 谨慎对待 / 让模糊的声明 / 损害他们的声誉。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>麦吉说，离职时没有安排好下一个职位给了他时间思考想要管理什么样的公司。这也向外界清楚地传达了他的抱负。而且麦吉并不孤单。最近几周，雅芳和美国运通的二号高管都辞职了，解释说他们正在寻找CEO职位。当董事会迫于股东压力审查继任计划时，没有获得认可的高管们也可能希望离开。动荡的商业环境也让高级经理们谨慎对待模糊的声明，以免损害他们的声誉。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>As the first signs of recovery begin to take hold, deputy chiefs may be more willing to make the jump without a net. In the third quarter, CEO turnover was down 23% from a year ago as nervous boards stuck with the leaders they had, according to Liberum Research. As the economy picks up, opportunities will abound for aspiring leaders.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>As the first signs / of recovery / begin to take hold, / deputy chiefs / may be more willing / to make the jump / without a net.\u003c/p>\n\u003cp>In the third quarter, / CEO turnover / was down 23% / from a year ago / as nervous boards / stuck with the leaders / they had, / according to Liberum Research.\u003c/p>\n\u003cp>As the economy picks up, / opportunities will abound / for aspiring leaders.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>随着最初的迹象 / 复苏的 / 开始站稳脚跟，/ 副总裁们 / 可能更愿意 / 做出跳跃 / 没有安全网的。\u003c/p>\n\u003cp>在第三季度，/ CEO更替 / 下降了23% / 与一年前相比 / 因为紧张的董事会 / 坚持使用领导者 / 他们已有的，/ 根据Liberum研究。\u003c/p>\n\u003cp>随着经济回升，/ 机会将大量出现 / 对有抱负的领导者。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>随着经济复苏的最初迹象开始显现，副总裁们可能更愿意在没有安全网的情况下跳槽。根据Liberum研究，第三季度CEO更替率比一年前下降了23%，因为紧张的董事会坚持使用现有的领导者。随着经济回升，有抱负的领导者将迎来大量机会。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>The decision / to quit a senior position / to look for a better one / is unconventional.\u003c/p>\n\u003cp>For years / executives and headhunters / have adhered to the rule / that the most attractive CEO candidates / are the ones / who must be poached.\u003c/p>\n\u003cp>Says Korn/Ferry senior partner / Dennis Carey: / &quot;I can&#39;t think of / a single search / I&#39;ve done / where a board / has not instructed me / to look at sitting CEOs first.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>这个决定 / 辞去高级职位 / 寻找更好的职位 / 是非传统的。\u003c/p>\n\u003cp>多年来 / 高管和猎头们 / 一直遵守规则 / 最有吸引力的CEO候选人 / 是那些人 / 必须被挖走的。\u003c/p>\n\u003cp>光辉国际高级合伙人说 / 丹尼斯·凯里：/ &quot;我想不出 / 任何一次搜寻 / 我做过的 / 其中董事会 / 没有指示我 / 首先看在职CEO。&quot;\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>辞去高级职位去寻找更好职位的决定是非传统的。多年来，高管和猎头们一直遵守这样的规则：最有吸引力的CEO候选人是那些必须被挖走的人。光辉国际高级合伙人丹尼斯·凯里说：&quot;在我做过的所有搜寻中，我想不出有哪一次董事会没有指示我首先考虑在职CEO。&quot;\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>Those who jumped without a job haven&#39;t always landed in top positions quickly. Ellen Marram quit as chief of Tropicana a decade ago, saying she wanted to be a CEO. It was a year before she became head of a tiny Internet-based commodities exchange. Robert Willumstad left Citigroup in 2005 with ambitions to be a CEO. He finally took that post at a major financial institution three years later.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>Those who jumped / without a job / haven&#39;t always landed / in top positions quickly.\u003c/p>\n\u003cp>Ellen Marram quit / as chief of Tropicana / a decade ago, / saying she wanted / to be a CEO.\u003c/p>\n\u003cp>It was a year / before she became head / of a tiny Internet-based / commodities exchange.\u003c/p>\n\u003cp>Robert Willumstad left / Citigroup in 2005 / with ambitions / to be a CEO.\u003c/p>\n\u003cp>He finally took that post / at a major financial institution / three years later.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>那些跳槽的人 / 没有工作 / 并不总是能找到 / 高级职位很快地。\u003c/p>\n\u003cp>艾伦·马拉姆辞职了 / 作为纯品康纳的首席执行官 / 十年前，/ 说她想要 / 成为CEO。\u003c/p>\n\u003cp>过了一年 / 她才成为负责人 / 一个小型的基于互联网的 / 商品交易所。\u003c/p>\n\u003cp>罗伯特·威勒姆斯塔德离开了 / 花旗集团在2005年 / 带着雄心 / 成为CEO。\u003c/p>\n\u003cp>他最终接受了那个职位 / 在一家主要金融机构 / 三年后。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>那些在没有找好下家就跳槽的人并不总是能很快找到高级职位。艾伦·马拉姆十年前辞去纯品康纳首席执行官职位时说她想成为CEO。一年后她才成为一家小型互联网商品交易所的负责人。罗伯特·威勒姆斯塔德2005年带着成为CEO的雄心离开花旗集团。三年后他才在一家主要金融机构获得了那个职位。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Many recruiters say / the old disgrace / is fading / for top performers.\u003c/p>\n\u003cp>The financial crisis / has made it / more acceptable / to be between jobs / or to leave a bad one.\u003c/p>\n\u003cp>&quot;The traditional rule / was it&#39;s safer / to stay where you are, / but that&#39;s been / fundamentally inverted,&quot; / says one headhunter.\u003c/p>\n\u003cp>&quot;The people / who&#39;ve been hurt the worst / are those / who&#39;ve stayed too long.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>许多招聘者说 / 旧的耻辱 / 正在消退 / 对顶尖表现者。\u003c/p>\n\u003cp>金融危机 / 已经使它 / 更可接受 / 处于工作之间 / 或离开糟糕的工作。\u003c/p>\n\u003cp>&quot;传统规则 / 是更安全 / 留在你现在的地方，/ 但那已经 / 根本颠倒了，&quot; / 一位猎头说。\u003c/p>\n\u003cp>&quot;那些人 / 受伤最严重的 / 是那些 / 待得太久的。&quot;\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>许多招聘者说，对于顶尖表现者来说，旧的耻辱感正在消退。金融危机使得处于工作空档期或离开糟糕的工作变得更可接受。一位猎头说：&quot;传统规则是留在原地更安全，但这已经被根本颠倒了。受伤最严重的是那些待得太久的人。&quot;\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读）\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>英文句子逻辑\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>When Liam McGee departed：(as president of Bank of America)：(in August) → his explanation was → surprisingly straight up.\u003c/p>\n\u003cp>Rather than cloaking his exit：(in the usual vague excuses) → he came right out and said → he was leaving：(&quot;to pursue my goal：(of running a company)&quot;).\u003c/p>\n\u003cp>Broadcasting his ambition → was &quot;very much my decision,&quot; → McGee says.\u003c/p>\n\u003cp>Within two weeks → he was talking：(for the first time)：(with the board：(of Hartford Financial Services Group))：(which named him → CEO and chairman：(on September 29)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>McGee says → leaving without a position lined up → gave him time：(to reflect on：(what kind of company → he wanted to run)).\u003c/p>\n\u003cp>It also sent → a clear message：(to the outside world)：(about his aspirations).\u003c/p>\n\u003cp>And McGee isn&#39;t alone.\u003c/p>\n\u003cp>In recent weeks → the No.2 executives：(at Avon and American Express) → quit：(with the explanation：(that they were looking for → a CEO post)).\u003c/p>\n\u003cp>As boards scrutinize → succession plans：(in response to → shareholder pressure) → executives who don&#39;t get the nod → also may wish to move on.\u003c/p>\n\u003cp>A turbulent business environment → also has senior managers → cautious of：(letting vague pronouncements → cloud their reputations).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>As the first signs：(of recovery) → begin to take hold → deputy chiefs → may be more willing：(to make the jump：(without a net)).\u003c/p>\n\u003cp>In the third quarter → CEO turnover → was down 23%：(from a year ago) → as nervous boards → stuck with the leaders：(they had) → according to Liberum Research.\u003c/p>\n\u003cp>As the economy picks up → opportunities will abound：(for aspiring leaders).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>The decision：(to quit a senior position：(to look for a better one)) → is unconventional.\u003c/p>\n\u003cp>For years → executives and headhunters → have adhered to the rule：(that the most attractive CEO candidates → are the ones：(who must be poached)).\u003c/p>\n\u003cp>Says Korn/Ferry senior partner Dennis Carey：(&quot;I can&#39;t think of → a single search：(I&#39;ve done)：(where a board → has not instructed me → to look at sitting CEOs first)&quot;).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Those who jumped：(without a job) → haven&#39;t always landed：(in top positions quickly).\u003c/p>\n\u003cp>Ellen Marram quit：(as chief of Tropicana)：(a decade ago) → saying she wanted：(to be a CEO).\u003c/p>\n\u003cp>It was a year → before she became head：(of a tiny Internet-based → commodities exchange).\u003c/p>\n\u003cp>Robert Willumstad left：(Citigroup in 2005)：(with ambitions：(to be a CEO)).\u003c/p>\n\u003cp>He finally took that post：(at a major financial institution)：(three years later).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Many recruiters say → the old disgrace → is fading：(for top performers).\u003c/p>\n\u003cp>The financial crisis → has made it → more acceptable：(to be between jobs // or to leave a bad one).\u003c/p>\n\u003cp>&quot;The traditional rule → was it&#39;s safer：(to stay where you are) // but that&#39;s been → fundamentally inverted,&quot; → says one headhunter.\u003c/p>\n\u003cp>&quot;The people：(who&#39;ve been hurt the worst) → are those：(who&#39;ve stayed too long).&quot;\u003c/p>\n\u003ch2>中文句子逻辑\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>当利亚姆·麦吉离开：(作为美国银行的总裁)：(在八月) → 他的解释是 → 出人意料地直率。\u003c/p>\n\u003cp>而不是掩饰他的离职：(用通常的模糊借口) → 他直接出来说 → 他要离开：(&quot;去追求我的目标：(管理一家公司)&quot;)。\u003c/p>\n\u003cp>公开他的雄心 → 是&quot;完全是我的决定，&quot; → 麦吉说。\u003c/p>\n\u003cp>在两周内 → 他正在交谈：(第一次)：(与董事会：(哈特福德金融服务集团的))：(该集团任命他 → CEO和董事长：(在9月29日))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>麦吉说 → 离开时没有安排好职位 → 给了他时间：(去思考：(什么样的公司 → 他想要管理))。\u003c/p>\n\u003cp>这也发出了 → 一个清晰的信息：(给外界)：(关于他的抱负)。\u003c/p>\n\u003cp>而且麦吉并不孤单。\u003c/p>\n\u003cp>在最近几周 → 二号高管们：(在雅芳和美国运通) → 辞职了：(带着解释：(他们正在寻找 → CEO职位))。\u003c/p>\n\u003cp>当董事会审查 → 继任计划：(响应 → 股东压力) → 没有获得认可的高管们 → 也可能希望离开。\u003c/p>\n\u003cp>动荡的商业环境 → 也让高级经理们 → 谨慎对待：(让模糊的声明 → 损害他们的声誉)。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>随着最初的迹象：(复苏的) → 开始站稳脚跟 → 副总裁们 → 可能更愿意：(做出跳跃：(没有安全网的))。\u003c/p>\n\u003cp>在第三季度 → CEO更替 → 下降了23%：(与一年前相比) → 因为紧张的董事会 → 坚持使用领导者：(他们已有的) → 根据Liberum研究。\u003c/p>\n\u003cp>随着经济回升 → 机会将大量出现：(对有抱负的领导者)。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>这个决定：(辞去高级职位：(寻找更好的职位)) → 是非传统的。\u003c/p>\n\u003cp>多年来 → 高管和猎头们 → 一直遵守规则：(最有吸引力的CEO候选人 → 是那些人：(必须被挖走的))。\u003c/p>\n\u003cp>光辉国际高级合伙人丹尼斯·凯里说：(&quot;我想不出 → 任何一次搜寻：(我做过的)：(其中董事会 → 没有指示我 → 首先看在职CEO)&quot;)。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>那些跳槽的人：(没有工作) → 并不总是能找到：(高级职位很快地)。\u003c/p>\n\u003cp>艾伦·马拉姆辞职了：(作为纯品康纳的首席执行官)：(十年前) → 说她想要：(成为CEO)。\u003c/p>\n\u003cp>过了一年 → 她才成为负责人：(一个小型的基于互联网的 → 商品交易所)。\u003c/p>\n\u003cp>罗伯特·威勒姆斯塔德离开了：(花旗集团在2005年)：(带着雄心：(成为CEO))。\u003c/p>\n\u003cp>他最终接受了那个职位：(在一家主要金融机构)：(三年后)。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>许多招聘者说 → 旧的耻辱 → 正在消退：(对顶尖表现者)。\u003c/p>\n\u003cp>金融危机 → 已经使它 → 更可接受：(处于工作之间 // 或离开糟糕的工作)。\u003c/p>\n\u003cp>&quot;传统规则 → 是更安全：(留在你现在的地方) // 但那已经 → 根本颠倒了，&quot; → 一位猎头说。\u003c/p>\n\u003cp>&quot;那些人：(受伤最严重的) → 是那些：(待得太久的)。&quot;\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第1段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Rather than cloaking his exit / in the usual vague excuses, / he came right out and said / he was leaving / &quot;to pursue my goal / of running a company.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>而不是掩饰他的离职 / 用通常的模糊借口，/ 他直接出来说 / 他要离开 / &quot;去追求我的目标 / 管理一家公司。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把他没有采用的说法合并：\u003c/p>\n\u003cblockquote>\n\u003cp>没有用通常的含糊借口掩饰离职\u003c/p>\n\u003c/blockquote>\n\u003cp>把他实际说出的目标合并：\u003c/p>\n\u003cblockquote>\n\u003cp>直接说要离开，去追求管理一家公司的目标\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>没有用通常的含糊借口掩饰离职\u003cbr>直接说要离开，去追求管理一家公司的目标\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>他直接说自己要离开。\u003c/p>\n\u003c/blockquote>\n\u003cp>先用“没有……而是……”作对照，把未采用的掩饰放在前，把真实目标紧接在“说”后面。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>他没有用通常的模糊借口掩饰离职，而是直接说他要离开，去追求管理一家公司的目标。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>“出来说”是英文动作的直搬，中文用“直接说”即可。\u003c/li>\n\u003cli>把目标部分保留为引语，读者能分清这是他本人公开给出的解释。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>他没有用通常的模糊借口来掩饰离职，而是直接说他要离开&quot;去追求管理一家公司的目标&quot;。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第2段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>McGee says / leaving without a position lined up / gave him time / to reflect on / what kind of company / he wanted to run.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>麦吉说 / 离开时没有安排好职位 / 给了他时间 / 去思考 / 什么样的公司 / 他想要管理。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把离职时的处境合并：\u003c/p>\n\u003cblockquote>\n\u003cp>在没有安排好下一职位时离开\u003c/p>\n\u003c/blockquote>\n\u003cp>再把这件事带来的时间和思考对象合并：\u003c/p>\n\u003cblockquote>\n\u003cp>给他时间思考自己想管理什么样的公司\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>在没有安排好下一职位时离开\u003cbr>给他时间思考自己想管理什么样的公司\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>离职给了他思考的时间。\u003c/p>\n\u003c/blockquote>\n\u003cp>最前面保留“麦吉说”，说明信息来源；随后用完整的离职处境作原因，再接时间与思考对象，不把公司类型改成私人生活。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>麦吉说，在没有安排好下一职位时离职，给了他时间思考自己想要管理什么样的公司。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>将“下一职位”明确为“下一个职位”，使离职前后关系更直接。\u003c/li>\n\u003cli>合并重复的“时离职”表达，保留“离职时没有安排好”的完整条件。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>麦吉说，离职时没有安排好下一个职位给了他时间思考想要管理什么样的公司。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第2段第5句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>As boards scrutinize / succession plans / in response to / shareholder pressure, / executives who don&#39;t get the nod / also may wish to move on.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>当董事会审查 / 继任计划 / 响应 / 股东压力，/ 没有获得认可的高管们 / 也可能希望离开。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把董事会的动作及原因合并：\u003c/p>\n\u003cblockquote>\n\u003cp>董事会因股东压力而审查继任计划\u003c/p>\n\u003c/blockquote>\n\u003cp>再把高管范围与可能选择合并：\u003c/p>\n\u003cblockquote>\n\u003cp>没有获得认可的高管们，也可能希望离开\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>董事会因股东压力而审查继任计划\u003cbr>没有获得认可的高管们，也可能希望离开\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>没有获得认可的高管也可能希望离开。\u003c/p>\n\u003c/blockquote>\n\u003cp>把董事会审查及股东压力放在句首作背景；后半句先限定是哪类高管，再写“也可能希望”，保留两层不确定性。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>当董事会响应股东压力而审查继任计划时，没有获得认可的高管们也可能想要离开。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>将“响应压力”改成“迫于压力”，使中文因果搭配自然。\u003c/li>\n\u003cli>“可能希望”保留愿望与可能性，不改成“必定离职”。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>当董事会迫于股东压力审查继任计划时，没有获得认可的高管们也可能希望离开。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第3段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>In the third quarter, CEO turnover was down 23% from a year ago as nervous boards stuck with the leaders they had, according to Liberum Research.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>In the third quarter, / CEO turnover / was down 23% / from a year ago / as nervous boards / stuck with the leaders / they had, / according to Liberum Research.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>在第三季度，/ CEO更替 / 下降了23% / 与一年前相比 / 因为紧张的董事会 / 坚持使用领导者 / 他们已有的，/ 根据Liberum研究。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把时间与比较结果合并：\u003c/p>\n\u003cblockquote>\n\u003cp>第三季度，CEO更替比一年前下降23%\u003c/p>\n\u003c/blockquote>\n\u003cp>把原因中的人和选择合并：\u003c/p>\n\u003cblockquote>\n\u003cp>不安的董事会继续使用已有的领导者\u003c/p>\n\u003c/blockquote>\n\u003cp>把数据出处单独留好：\u003c/p>\n\u003cblockquote>\n\u003cp>根据Liberum研究\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>第三季度，CEO更替比一年前下降23%\u003cbr>不安的董事会继续使用已有的领导者\u003cbr>根据Liberum研究\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>CEO更替比一年前下降了23%。\u003c/p>\n\u003c/blockquote>\n\u003cp>研究出处放在句首，然后交代季度、比较基准和幅度；原因放在结果后，不把下降23%误写成降到23%。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>根据Liberum研究，第三季度CEO更替比一年前下降了23%，因为紧张的董事会坚持使用已有的领导者。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>将“更替”明确为“更替率”，与百分比比较的指标相配。\u003c/li>\n\u003cli>“现有的领导者”比“已有的领导者”更适合任职语境；因果与同比方向不变。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>根据Liberum研究，第三季度CEO更替率比一年前下降了23%，因为紧张的董事会坚持使用现有的领导者。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Says Korn/Ferry senior partner / Dennis Carey: / &quot;I can&#39;t think of / a single search / I&#39;ve done / where a board / has not instructed me / to look at sitting CEOs first.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>光辉国际高级合伙人说 / 丹尼斯·凯里：/ &quot;我想不出 / 任何一次搜寻 / 我做过的 / 其中董事会 / 没有指示我 / 首先看在职CEO。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把说话人的职位和姓名合并：\u003c/p>\n\u003cblockquote>\n\u003cp>光辉国际高级合伙人丹尼斯·凯里说\u003c/p>\n\u003c/blockquote>\n\u003cp>把搜寻范围放在一起：\u003c/p>\n\u003cblockquote>\n\u003cp>在我做过的所有搜寻中\u003c/p>\n\u003c/blockquote>\n\u003cp>再合并想不出与否定例外：\u003c/p>\n\u003cblockquote>\n\u003cp>想不出哪一次董事会没有要求我先考虑在职CEO\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>光辉国际高级合伙人丹尼斯·凯里说\u003cbr>在我做过的所有搜寻中\u003cbr>想不出哪一次董事会没有要求我先考虑在职CEO\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>凯里说，他想不出一项例外。\u003c/p>\n\u003c/blockquote>\n\u003cp>先完整介绍说话人；引语中先限定所有做过的搜寻，再保留“想不出……没有……”的双层否定，说明每次均被要求优先看在职者。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>光辉国际高级合伙人丹尼斯·凯里说：“在我做过的搜寻里，我想不出任何一次董事会没有指示我首先看在职CEO。”\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>“首先看”在招聘语境中改为“首先考虑”，不是看外表。\u003c/li>\n\u003cli>“在我做过的所有搜寻中”与“有哪一次”搭配，使强调没有例外的语气完整。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>光辉国际高级合伙人丹尼斯·凯里说：&quot;在我做过的所有搜寻中，我想不出有哪一次董事会没有指示我首先考虑在职CEO。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>30题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一个是本文最佳标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>CEOs: Where to Go?\u003c/strong>\u003c/p>\n\u003cp>CEO们：该去哪里？\u003c/p>\n\u003cp>B. \u003cstrong>CEOs: All the Way Up?\u003c/strong>\u003c/p>\n\u003cp>CEO们：一路高升？\u003c/p>\n\u003cp>C. \u003cstrong>Top Managers Jump without a Net\u003c/strong>\u003c/p>\n\u003cp>高层管理者没有安全网也敢跳\u003c/p>\n\u003cp>D. \u003cstrong>The Only Way Out for Top Performers\u003c/strong>\u003c/p>\n\u003cp>优秀高管唯一的出路\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>McGee没找好下家就公开离职，很快获得新机会\u003c/td>\n\u003ctd>先摆出一个反常做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>其他二号高管也为追求CEO职位而离开\u003c/td>\n\u003ctd>再说这已经不是个例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>经济复苏可能让更多副手敢这样跳\u003c/td>\n\u003ctd>接着补上环境变化的机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>旧规则偏爱仍在任、需要被挖走的候选人\u003c/td>\n\u003ctd>回头解释旧规矩原来怎样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>有人裸辞后很久才得到理想职位\u003c/td>\n\u003ctd>再举一个例子说明有代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>危机让空档更可接受，久留反而可能受伤\u003c/td>\n\u003ctd>最后说旧规矩正在反过来\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>A. CEOs: Where to Go?\u003c/h3>\n\u003cp>CEO们：该去哪里？\u003c/p>\n\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>CEO们：该去哪里？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先以一位CEO反常离开熟悉岗位、重新寻找去处的故事，提出管理者该往哪里去的问题。\u003c/td>\n\u003ctd>先摆出一个反常做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>再写多位CEO也在重新选择行业和公司，说明去向困惑并非个例。\u003c/td>\n\u003ctd>再说这已经不是个例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>补充经济复苏打开的新行业与新公司机会，为可能去向提供环境背景。\u003c/td>\n\u003ctd>接着补上环境变化的机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾旧规则如何让CEO留在同类公司和熟悉行业，解释过去的去向限制。\u003c/td>\n\u003ctd>回头解释旧规矩原来怎样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举跨行业选择后长时间适应的例子，说明重新选择去处有代价。\u003c/td>\n\u003ctd>再举一个例子说明有代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>最后指出旧的去向限制正在松动，应以新的事业机会重新决定CEO往哪里去。\u003c/td>\n\u003ctd>最后说旧规矩正在反过来\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>A\u003c/code>要求文章比较\u003ccode>CEO\u003c/code>的具体去处或去向选择。实际\u003ccode>McGee\u003c/code>等人中不少是副手，他们正在追求\u003ccode>CEO\u003c/code>职位；第3段谈复苏机会，第4段谈在职候选人，第5段谈等待，第6段谈离职污名，反复处理的是尚无下家是否离开，而非去哪一种公司更好。标题主体和提问重心都偏离共同动作。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>B. CEOs: All the Way Up?\u003c/h3>\n\u003cp>CEO们：一路高升？\u003c/p>\n\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>CEO们：一路高升？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>用一位CEO反常放弃现有级别的案例，提出职业生涯是否只能一路向上的疑问。\u003c/td>\n\u003ctd>先摆出一个反常做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>再写多位CEO也遇到暂时退让或职位下降，表明升迁并非总是线性的。\u003c/td>\n\u003ctd>再说这已经不是个例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>补充经济变化带来的重新上升机会，说明短期下降后仍可能恢复职业发展。\u003c/td>\n\u003ctd>接着补上环境变化的机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾旧规则如何把每一步升职视为成功标志，解释“一路向上”的传统期待。\u003c/td>\n\u003ctd>回头解释旧规矩原来怎样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举暂时退让后经历长期等待的CEO，说明非线性发展也有明显成本。\u003c/td>\n\u003ctd>再举一个例子说明有代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>最后指出旧的连续升迁标准正在改变，职业发展应允许阶段性停顿与重新选择。\u003c/td>\n\u003ctd>最后说旧规矩正在反过来\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>B\u003c/code>的问号允许讨论升迁曲折，不能把它草率理解成保证所有人不断高升。即便如此，本文并未围绕\u003ccode>CEO\u003c/code>升降的完整历程组织材料：第4段的核心是在职与离职的招聘偏好，第6段的核心是留下与离开的安全判断。多个例子还不是\u003ccode>CEO\u003c/code>，而是争取第一把手职位的高管，因此\u003ccode>C\u003c/code>更准确地抓住统一动作和群体。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>C. Top Managers Jump without a Net\u003c/h3>\n\u003cp>高层管理者没有安全网也敢跳\u003c/p>\n\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>高层管理者没有安全网也敢跳\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以McGee未落实下一职位就公开离职的反常做法，展示没有安全网的跳跃。\u003c/td>\n\u003ctd>先摆出一个反常做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>再举其他副手为争取CEO职位而离开的例子，说明这种职业选择已不止一人采用。\u003c/td>\n\u003ctd>再说这已经不是个例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出经济复苏增加外部机会，使更多高管可能愿意在下家未定时离开。\u003c/td>\n\u003ctd>接着补上环境变化的机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾旧招聘规则优先寻找在职者，解释这种主动离开为何原本非常规。\u003c/td>\n\u003ctd>回头解释旧规矩原来怎样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举先辞职者等待一年或三年才获新职位的例子，说明无安全网仍有风险。\u003c/td>\n\u003ctd>再举一个例子说明有代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>最后说明空档污名减弱、久留也可能受损，旧的留任安全规则正被重新评价。\u003c/td>\n\u003ctd>最后说旧规矩正在反过来\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>C\u003c/code>同时写出人物范围\u003ccode>Top Managers\u003c/code>和共同动作\u003ccode>Jump without a Net\u003c/code>。它能容纳\u003ccode>McGee\u003c/code>的快速成功，也容纳第5段等待一年或三年的代价：没有安全网并不等于一定失败或成功。旧招聘规则与危机后的新判断，正是解释这种新做法为何出现及如何看待的背景。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>D. The Only Way Out for Top Performers\u003c/h3>\n\u003cp>优秀高管唯一的出路\u003c/p>\n\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>优秀高管唯一的出路\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以优秀高管反常放弃现职的个案，提出主动离开已成为唯一可行出路的判断。\u003c/td>\n\u003ctd>先摆出一个反常做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>再写多位优秀高管都因内部通道封闭而只能向外走，说明个案具有普遍性。\u003c/td>\n\u003ctd>再说这已经不是个例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明外部环境打开新机会而内部道路仍然堵死，使离开成为唯一能利用机会的方式。\u003c/td>\n\u003ctd>接着补上环境变化的机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾旧规则曾允许优秀人才留任等待晋升，解释旧选择如何构成过去的多条路径。\u003c/td>\n\u003ctd>回头解释旧规矩原来怎样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举唯一出路仍需漫长等待的例子，说明必须离开不代表离开没有代价。\u003c/td>\n\u003ctd>再举一个例子说明有代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>最后指出旧的内部留任路径彻底失效，优秀高管只能接受主动离开这条路。\u003c/td>\n\u003ctd>最后说旧规矩正在反过来\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>D\u003c/code>中的\u003ccode>Only\u003c/code>必须得到“其他路都走不通”的证据。原文却用\u003ccode>may be more willing\u003c/code>描述部分人的可能选择，第5段专门提醒等待成本；结尾说传统安全判断改变，也没有宣布所有优秀高管必须离开。\u003ccode>D\u003c/code>把一种逐渐可接受的策略扩大成唯一出路，程度超出全文。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>30题结论\u003c/h3>\n\u003cp>\u003cstrong>30. C. Top Managers Jump without a Net\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Top Managers Jump without a Net / 高层管理者没有安全网也敢跳\u003c/strong>\u003c/p>\n\u003ch2>26题\u003c/h2>\n\u003cblockquote>\n\u003cp>When McGee announced his departure, his manner can best be described as being ______.\u003cbr>McGee宣布离职时，他的方式最适合被描述为怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物表达态度题。题干限定\u003ccode>announced his departure\u003c/code>，问的是对外表达方式，不是离职决定是否稳妥。第1段用\u003ccode>Rather than\u003c/code>把通常含糊掩饰的借口与\u003ccode>McGee\u003c/code>直接说出管理公司目标作对比，接着强调向外界公开了雄心。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot; Broadcasting his ambition was &quot;very much my decision,&quot; McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\u003c/p>\n\u003c/blockquote>\n\u003cp>先点出他宣布离职时的不同，再列出所说的明确目标，随后用\u003ccode>broadcasting his ambition\u003c/code>概括公开程度，最后交代他很快获得\u003ccode>CEO\u003c/code>职位。新职位是后续结果，不决定宣布时是否傲慢或冲动。\u003c/p>\n\u003ch3>A. arrogant\u003c/h3>\n\u003cblockquote>\n\u003cp>傲慢的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“\u003ccode>A\u003c/code>把内容里的野心变成态度里的傲慢。原文没有给出这种负面姿态，因此排除”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>arrogant\u003c/code>表示傲慢，需要轻视别人或过分自负的表达。原文说他公开自己的\u003ccode>ambition\u003c/code>，说明目标清晰且不遮掩，并未写他贬低他人或夸口必然成功。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>借用了\u003ccode>ambition\u003c/code>带来的强烈印象，额外加入原文未展示的轻慢态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot; Broadcasting his ambition was &quot;very much my decision,&quot; McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>McGee宣布离职时，他的表达方式是傲慢的。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干限定\u003ccode>announced his departure\u003c/code>，问的是对外表达方式，不是离职决定是否稳妥。第1段用\u003ccode>Rather than\u003c/code>把通常含糊掩饰的借口与\u003ccode>McGee\u003c/code>直接说出管理公司目标作对比，接着强调向外界公开了雄心。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>arrogant\u003c/code>表示傲慢，需要轻视别人或过分自负的表达。原文说他公开自己的\u003ccode>ambition\u003c/code>，说明目标清晰且不遮掩，并未写他贬低他人或夸口必然成功。\u003c/p>\n\u003cp>很快被任命为\u003ccode>CEO\u003c/code>也只是后续事实，不能逆推他宣布时采用傲慢口气。公开雄心与态度傲慢不是可以互换的评价。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>借用了\u003ccode>ambition\u003c/code>带来的强烈印象，额外加入原文未展示的轻慢态度。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot; Broadcasting his ambition was &quot;very much my decision,&quot; McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\u003c/p>\n\u003cp>题干限定announced his departure，问的是对外表达方式，不是离职决定是否稳妥。第1段用Rather than把通常含糊掩饰的借口与McGee直接说出管理公司目标作对比，接着强调向外界公开了雄心。\u003c/p>\n\u003c/blockquote>\n\u003cp>先点出他宣布离职时的不同，再列出所说的明确目标，随后用\u003ccode>broadcasting his ambition\u003c/code>概括公开程度，最后交代他很快获得\u003ccode>CEO\u003c/code>职位。新职位是后续结果，不决定宣布时是否傲慢或冲动。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>McGee announced his departure in an arrogant tone, dismissing other people’s abilities.\u003c/p>\n\u003cp>McGee以傲慢的语气宣布离职，轻视他人的能力。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>需要出现自夸或贬低别人的具体说法。作者实际只引用他想经营一家公司的目标，再说明公开雄心可能吸引招募者；文章的证据沿“是否明说”推进，没有沿“是否轻视别人”推进。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文以McGee为例讨论高管在未落实下一职位时主动离开。这个主旨能确认他选择公开追求新目标，不能单独给性格下结论；本题的表达态度仍须由没有掩饰、直接说出目标的对照判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>arrogant\u003cbr>傲慢的\u003c/p>\n\u003c/blockquote>\n\u003cp>全文呈现一种冒风险寻找机会的职业做法，没有把例子用于谴责个人傲慢。\u003ccode>A\u003c/code>将明确目标换成负面性格，主旨不能补出这种评价，局部也没有轻慢他人的言语。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. frank\u003c/h3>\n\u003cblockquote>\n\u003cp>坦率的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>保留。当时选项显示为“[\u003ccode>xxx\u003c/code>]”。当时的判断依据是：“真正未知的只是那个形容词的具体意思；它很可能就是对这种方式的概括，所以先保留”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>frank\u003c/code>是坦率、直截了当。原文\u003ccode>Rather than\u003c/code>用含糊借口掩饰离开，他直接说明要追求管理一家公司的目标，正体现表达透明。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>准确概括了“未掩饰真实目标，而是公开说出”的表达方式。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot; Broadcasting his ambition was &quot;very much my decision,&quot; McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>McGee宣布离职时，他的表达方式是坦率的。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干限定\u003ccode>announced his departure\u003c/code>，问的是对外表达方式，不是离职决定是否稳妥。第1段用\u003ccode>Rather than\u003c/code>把通常含糊掩饰的借口与\u003ccode>McGee\u003c/code>直接说出管理公司目标作对比，接着强调向外界公开了雄心。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>frank\u003c/code>是坦率、直截了当。原文\u003ccode>Rather than\u003c/code>用含糊借口掩饰离开，他直接说明要追求管理一家公司的目标，正体现表达透明。\u003c/p>\n\u003cp>\u003ccode>broadcasting his ambition\u003c/code>承接这个明说的动作，说明外界能够知道他的意图；这里的坦率不等于其未来选择毫无风险。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>准确概括了“未掩饰真实目标，而是公开说出”的表达方式。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot; Broadcasting his ambition was &quot;very much my decision,&quot; McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\u003c/p>\n\u003cp>题干限定announced his departure，问的是对外表达方式，不是离职决定是否稳妥。第1段用Rather than把通常含糊掩饰的借口与McGee直接说出管理公司目标作对比，接着强调向外界公开了雄心。\u003c/p>\n\u003c/blockquote>\n\u003cp>先点出他宣布离职时的不同，再列出所说的明确目标，随后用\u003ccode>broadcasting his ambition\u003c/code>概括公开程度，最后交代他很快获得\u003ccode>CEO\u003c/code>职位。新职位是后续结果，不决定宣布时是否傲慢或冲动。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>McGee frankly said that he was leaving to pursue his goal of running a company.\u003c/p>\n\u003cp>McGee坦率地说，他离开是为了追求管理一家公司的目标。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>所需的对比是一般人用模糊借口、他却直接交代目标。原文先有\u003ccode>Rather than\u003c/code>，再有明确引语，随后说公开了雄心；连续三处都围绕公开而非遮掩展开。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文以McGee为例讨论高管在未落实下一职位时主动离开。这个主旨能确认他选择公开追求新目标，不能单独给性格下结论；本题的表达态度仍须由没有掩饰、直接说出目标的对照判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cb 的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>排除。当时的判断依据是：“\u003ccode>D\u003c/code>需要原文写他仓促、后悔或未经考虑；段落没有这些信息，反而强调这是他的决定”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>impulsive\u003c/code>表示没有充分思考就贸然行动。原文给出清楚的职业目标，且题干问宣布方式，不是问先辞职是否风险较大。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把有风险的职业选择换成缺少思考的心理状态，还偏离了宣布时的表达方式。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot; Broadcasting his ambition was &quot;very much my decision,&quot; McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>McGee宣布离职时，他的表达方式是冲动的。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干限定\u003ccode>announced his departure\u003c/code>，问的是对外表达方式，不是离职决定是否稳妥。第1段用\u003ccode>Rather than\u003c/code>把通常含糊掩饰的借口与\u003ccode>McGee\u003c/code>直接说出管理公司目标作对比，接着强调向外界公开了雄心。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>impulsive\u003c/code>表示没有充分思考就贸然行动。原文给出清楚的职业目标，且题干问宣布方式，不是问先辞职是否风险较大。\u003c/p>\n\u003cp>尚未找到下一职位就离开可以是经过考虑的冒险，并不能仅凭动作非常规认定冲动。后文反而提到他借此有时间思考想经营哪类公司。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把有风险的职业选择换成缺少思考的心理状态，还偏离了宣布时的表达方式。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot; Broadcasting his ambition was &quot;very much my decision,&quot; McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\u003c/p>\n\u003cp>题干限定announced his departure，问的是对外表达方式，不是离职决定是否稳妥。第1段用Rather than把通常含糊掩饰的借口与McGee直接说出管理公司目标作对比，接着强调向外界公开了雄心。\u003c/p>\n\u003c/blockquote>\n\u003cp>先点出他宣布离职时的不同，再列出所说的明确目标，随后用\u003ccode>broadcasting his ambition\u003c/code>概括公开程度，最后交代他很快获得\u003ccode>CEO\u003c/code>职位。新职位是后续结果，不决定宣布时是否傲慢或冲动。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>McGee announced his departure impulsively, without a clear goal or prior reflection.\u003c/p>\n\u003cp>McGee在没有明确目标或事先考虑的情况下，冲动地宣布离职。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>需要突发决定、事前无目标等证据。实际开场明确引用管理公司的目标，下一段补充对公司类型的思考；路线强调目标与选择，不能把没有下一份工作当成没有思考。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文以McGee为例讨论高管在未落实下一职位时主动离开。这个主旨能确认他选择公开追求新目标，不能单独给性格下结论；本题的表达态度仍须由没有掩饰、直接说出目标的对照判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>impulsive\u003cbr>冲动的\u003c/p>\n\u003c/blockquote>\n\u003cp>没有安全网的跳跃是全文讨论的职业风险，并非对所有离职者冲动性格的判断。\u003ccode>D\u003c/code>把策略风险等同于心理冲动，原文的\u003ccode>goal\u003c/code>与\u003ccode>reflect\u003c/code>恰要求把两者分开。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>26题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>26. B. frank\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>借用了\u003ccode>ambition\u003c/code>带来的强烈印象，额外加入原文未展示的轻慢态度。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>准确概括了“未掩饰真实目标，而是公开说出”的表达方式。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把“说明自己的职业目标”加重为“只考虑自己的需要”，新增了价值评价。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把有风险的职业选择换成缺少思考的心理状态，还偏离了宣布时的表达方式。\u003c/p>\n\u003ch2>27题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Paragraph 2, senior executives’ quitting may be spurred by ______.\u003cbr>根据第2段，高管离职可能受到什么推动？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>离职动因细节题。第2段依次写\u003ccode>McGee\u003c/code>思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求\u003ccode>CEO\u003c/code>职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003c/blockquote>\n\u003cp>从一个人的新目标扩展到其他副手追求第一把手职位，再解释继任审查为何促使未获认可者离开。段末提醒含糊说法可能损害声誉，是沟通风险，不能当作前面各人的离职动机。\u003c/p>\n\u003ch3>A. their expectation of better financial status\u003c/h3>\n\u003cblockquote>\n\u003cp>期待更好的经济地位\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“\u003ccode>A\u003c/code>把职业角色换成财务结果。要成立，文中至少要出现薪酬、收入或经济待遇，段落没有”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>提出更好的经济地位。原文\u003ccode>CEO position\u003c/code>是职位目标，\u003ccode>running a company\u003c/code>是工作内容，均未说明他们希望增加薪酬或个人财富。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>将职业地位的追求换成金钱追求，并把未写出的经济收益设为推动力。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第2段，高管离职可能受到期待更好的经济地位的推动。\u003c/p>\n\u003c/blockquote>\n\u003cp>第2段依次写\u003ccode>McGee\u003c/code>思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求\u003ccode>CEO\u003c/code>职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>提出更好的经济地位。原文\u003ccode>CEO position\u003c/code>是职位目标，\u003ccode>running a company\u003c/code>是工作内容，均未说明他们希望增加薪酬或个人财富。\u003c/p>\n\u003cp>更高职位可能带来更高收入，但可能伴随的结果不能替代文章明说的动机。段内也没有比较离职前后的财务状态。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>将职业地位的追求换成金钱追求，并把未写出的经济收益设为推动力。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003cp>第2段依次写McGee思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求CEO职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>从一个人的新目标扩展到其他副手追求第一把手职位，再解释继任审查为何促使未获认可者离开。段末提醒含糊说法可能损害声誉，是沟通风险，不能当作前面各人的离职动机。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Senior executives quit because they expect higher pay and better financial status.\u003c/p>\n\u003cp>高管离职，是因为他们期待更高薪酬和更好的经济地位。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>A\u003c/code>成立，应有现有报酬不足、外部薪资更高的说明。实际先说希望经营哪类公司，再举寻找\u003ccode>CEO\u003c/code>职位的副手，推进的是职责和职业位置，没有转到收入比较。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讨论高管为新的领导机会主动离职，因此本题的动因应落到下一阶段的职业目标。主旨不能证明每个人与董事会不和或薪资不满；这些具体原因必须有第2段直接证据才能加入。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>their expectation of better financial status\u003cbr>期待更好的经济地位\u003c/p>\n\u003c/blockquote>\n\u003cp>全文里的新机会主要是新的管理职位，不等于更高收入。\u003ccode>A\u003c/code>需要额外的金钱证据，不能仅凭\u003ccode>CEO\u003c/code>通常收入高来补足；其动机对象与第2段反复出现的职业目标不同。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. their need to reflect on their private life\u003c/h3>\n\u003cblockquote>\n\u003cp>需要反思私人生活\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>排除。当时的判断依据是：“\u003ccode>B\u003c/code>换掉了反思对象，所以即使有原词也不能回答题干”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留\u003ccode>reflect\u003c/code>这个动作，却把对象换成\u003ccode>private life\u003c/code>。原文\u003ccode>reflect on what kind of company he wanted to run\u003c/code>明确限定思考的是将来经营什么公司。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>将职业反思改成私生活反思，换掉了反思对象。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第2段，高管离职可能受到需要反思私人生活的推动。\u003c/p>\n\u003c/blockquote>\n\u003cp>第2段依次写\u003ccode>McGee\u003c/code>思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求\u003ccode>CEO\u003c/code>职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>保留\u003ccode>reflect\u003c/code>这个动作，却把对象换成\u003ccode>private life\u003c/code>。原文\u003ccode>reflect on what kind of company he wanted to run\u003c/code>明确限定思考的是将来经营什么公司。\u003c/p>\n\u003cp>这句话交代辞职后得到的反思空间，也不能不加区分就说所有高管因为要整理私人生活而辞职。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>将职业反思改成私生活反思，换掉了反思对象。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003cp>第2段依次写McGee思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求CEO职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>从一个人的新目标扩展到其他副手追求第一把手职位，再解释继任审查为何促使未获认可者离开。段末提醒含糊说法可能损害声誉，是沟通风险，不能当作前面各人的离职动机。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Quitting gave McGee time to reflect on his private life rather than his next company.\u003c/p>\n\u003cp>离职让McGee有时间反思私人生活，而不是下一家要经营的公司。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>成立时应随后说明家庭、个人关系或生活安排。实际后文马上说\u003ccode>aspirations\u003c/code>及\u003ccode>CEO\u003c/code>职位，继续扩展职业志向；反思之后并未转向私人生活。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讨论高管为新的领导机会主动离职，因此本题的动因应落到下一阶段的职业目标。主旨不能证明每个人与董事会不和或薪资不满；这些具体原因必须有第2段直接证据才能加入。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>their need to reflect on their private life\u003cbr>需要反思私人生活\u003c/p>\n\u003c/blockquote>\n\u003cp>全文的新职业机会与第2段公司类型、\u003ccode>CEO\u003c/code>职位相互呼应。\u003ccode>B\u003c/code>把这条职业发展线切换成私生活，在原文没有这种转向；最直接的限制就是\u003ccode>reflect\u003c/code>后面完整的宾语。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. their strained relations with the boards\u003c/h3>\n\u003cblockquote>\n\u003cp>他们与董事会关系紧张\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>排除。当时的判断依据是：“\u003ccode>C\u003c/code>需要争执、不和或信任破裂的内容，本段没有”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>strained relations\u003c/code>表示关系紧张。原文\u003ccode>not getting the nod\u003c/code>只说未获董事会认可成为接班人，没有描写争执、敌对或关系恶化。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>从“未被选中”补出“关系紧张”，再把补出的状态设为辞职原因。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第2段，高管离职可能受到他们与董事会关系紧张的推动。\u003c/p>\n\u003c/blockquote>\n\u003cp>第2段依次写\u003ccode>McGee\u003c/code>思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求\u003ccode>CEO\u003c/code>职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>strained relations\u003c/code>表示关系紧张。原文\u003ccode>not getting the nod\u003c/code>只说未获董事会认可成为接班人，没有描写争执、敌对或关系恶化。\u003c/p>\n\u003cp>董事会受股东压力审查继任计划，是制度背景；某位副手没有得到接班机会，可以因为职位有限而离开，不必先与董事会失和。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>从“未被选中”补出“关系紧张”，再把补出的状态设为辞职原因。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003cp>第2段依次写McGee思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求CEO职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>从一个人的新目标扩展到其他副手追求第一把手职位，再解释继任审查为何促使未获认可者离开。段末提醒含糊说法可能损害声誉，是沟通风险，不能当作前面各人的离职动机。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Executives quit because their relations with the boards have become strained.\u003c/p>\n\u003cp>高管因与董事会的关系变得紧张而辞职。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>C\u003c/code>成立，作者应说明冲突如何产生并推动离职。实际先写继任计划受到审查，再说未获认可者可能另寻出路；这是一条机会分配链，未出现关系由好变坏的过程。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讨论高管为新的领导机会主动离职，因此本题的动因应落到下一阶段的职业目标。主旨不能证明每个人与董事会不和或薪资不满；这些具体原因必须有第2段直接证据才能加入。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>their strained relations with the boards\u003cbr>他们与董事会关系紧张\u003c/p>\n\u003c/blockquote>\n\u003cp>追求外部机会不要求内部关系已经破裂。全文强调职业选择规则变化，\u003ccode>C\u003c/code>却另造董事会冲突这一原因；主旨无法补出冲突，局部\u003ccode>not getting the nod\u003c/code>也只证明没有获得认可。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. their pursuit of new career goals\u003c/h3>\n\u003cblockquote>\n\u003cp>追求新的职业目标\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>保留。当时选项显示为“\u003ccode>their pursuit of new\u003c/code> [\u003ccode>xxx\u003c/code>] \u003ccode>goals\u003c/code>”。当时的判断依据是：“剩下只需确认那个词具体指什么；它很可能概括职业方向，所以第一轮保留”。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确跨句概括。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>new career goals\u003c/code>概括管理一家公司的目标、向招聘者传递的专业抱负，以及其他副手寻找\u003ccode>CEO\u003c/code>职位。三者都围绕下一阶段职业角色。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>跨句概括共同动因，没有将职位目标缩成薪资或私人生活。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第2段，高管离职可能受到追求新的职业目标的推动。\u003c/p>\n\u003c/blockquote>\n\u003cp>第2段依次写\u003ccode>McGee\u003c/code>思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求\u003ccode>CEO\u003c/code>职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>new career goals\u003c/code>概括管理一家公司的目标、向招聘者传递的专业抱负，以及其他副手寻找\u003ccode>CEO\u003c/code>职位。三者都围绕下一阶段职业角色。\u003c/p>\n\u003cp>\u003ccode>not getting the nod\u003c/code>的人可能离开，补充了原公司内部机会未兑现时向外追求目标的情形；题干\u003ccode>may\u003c/code>保留可能性，不要求每名高管都因同一原因离职。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>跨句概括共同动因，没有将职位目标缩成薪资或私人生活。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003cp>第2段依次写McGee思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求CEO职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>从一个人的新目标扩展到其他副手追求第一把手职位，再解释继任审查为何促使未获认可者离开。段末提醒含糊说法可能损害声誉，是沟通风险，不能当作前面各人的离职动机。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Executives may leave their current posts to pursue new goals such as running a company as CEO.\u003c/p>\n\u003cp>高管可能离开现职，去追求出任CEO、经营一家公司的新目标。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>要求个体目标、同类例子与继任背景指向同一职业方向。原文从\u003ccode>McGee\u003c/code>要经营公司扩展到\u003ccode>Avon\u003c/code>和\u003ccode>American Express\u003c/code>的副手，再到未获接班认可者，正好逐层扩大这个共同动因。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讨论高管为新的领导机会主动离职，因此本题的动因应落到下一阶段的职业目标。主旨不能证明每个人与董事会不和或薪资不满；这些具体原因必须有第2段直接证据才能加入。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>their pursuit of new career goals\u003cbr>追求新的职业目标\u003c/p>\n\u003c/blockquote>\n\u003cp>没有落实下一职位便离开，是为争取新的管理机会承担风险。\u003ccode>D\u003c/code>说明了这种做法的职业目的，并与第2段多个例子相合；它只说可能推动离职，保留原文\u003ccode>wish\u003c/code>和\u003ccode>may\u003c/code>的语气。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>27题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>27. D. their pursuit of new career goals\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>将职业地位的追求换成金钱追求，并把未写出的经济收益设为推动力。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>将职业反思改成私生活反思，换掉了反思对象。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>从“未被选中”补出“关系紧张”，再把补出的状态设为辞职原因。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>跨句概括共同动因，没有将职位目标缩成薪资或私人生活。\u003c/p>\n\u003ch2>28题\u003c/h2>\n\u003cblockquote>\n\u003cp>The word “poached” (Line 3, Paragraph 4) most probably means ______.\u003cbr>第4段第3行的poached最可能是什么意思？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>语境词义题。目标词位于\u003ccode>For years\u003c/code>所引出的旧招聘惯例：最有吸引力的\u003ccode>CEO\u003c/code>候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职\u003ccode>CEO\u003c/code>，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>先说先辞职后找下一份工作非常规，再回顾旧时候选人通常从在职者中被挖走，最后由猎头的搜索经验作证。后一句不是新话题，而是解释没有求职的人怎样成为候选人。\u003c/p>\n\u003ch3>A. approved of\u003c/h3>\n\u003cblockquote>\n\u003cp>被赞同、获认可\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“\u003ccode>A\u003c/code>缺少“挖走、招来”的移动和招聘含义，无法接住整个场景”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>approved of\u003c/code>是赞同或认可，不能交代一个仍在任的人怎样被招揽进入候选名单。\u003ccode>must be poached\u003c/code>的被动结构需要外部招聘者主动寻找、争取这些人。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把招揽过程弱化为态度上的认可，遗漏从现有岗位寻找人才这一关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第4段中的poached最可能表示被赞同、获认可。\u003c/p>\n\u003c/blockquote>\n\u003cp>目标词位于\u003ccode>For years\u003c/code>所引出的旧招聘惯例：最有吸引力的\u003ccode>CEO\u003c/code>候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职\u003ccode>CEO\u003c/code>，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>approved of\u003c/code>是赞同或认可，不能交代一个仍在任的人怎样被招揽进入候选名单。\u003ccode>must be poached\u003c/code>的被动结构需要外部招聘者主动寻找、争取这些人。\u003c/p>\n\u003cp>猎头得到的指示是先考虑在职\u003ccode>CEO\u003c/code>，体现主动物色；认为候选人优秀是前提，但并不等同于\u003ccode>poached\u003c/code>这个招募动作。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把招揽过程弱化为态度上的认可，遗漏从现有岗位寻找人才这一关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003cp>目标词位于For years所引出的旧招聘惯例：最有吸引力的CEO候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职CEO，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003c/blockquote>\n\u003cp>先说先辞职后找下一份工作非常规，再回顾旧时候选人通常从在职者中被挖走，最后由猎头的搜索经验作证。后一句不是新话题，而是解释没有求职的人怎样成为候选人。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The most attractive CEO candidates were merely approved of by boards.\u003c/p>\n\u003cp>最有吸引力的CEO候选人只是获得董事会的认可。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>A\u003c/code>成立，后文应主要讲董事会如何评价候选人。实际接着给出猎头\u003ccode>searches\u003c/code>和优先考虑在职\u003ccode>CEO\u003c/code>的操作要求，说明的是去哪里主动找人，单纯认可无法承接这一过程。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讨论主动离职的新做法，必然需要交代旧惯例：招聘方优先在仍有职位的管理者中寻找人选。主旨能判断动作与招聘有关，具体近义词仍要由must be poached与look at sitting CEOs first之间的关系确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>approved of\u003cbr>被赞同、获认可\u003c/p>\n\u003c/blockquote>\n\u003cp>旧规则与新做法的区别在于是否留在岗位等待外部招揽。\u003ccode>A\u003c/code>没有招揽动作，不能解释仍在任的候选人如何被招揽的路径，因此不足以完成全文对旧惯例的回顾。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. attended to\u003c/h3>\n\u003cblockquote>\n\u003cp>被照料、被处理\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>排除。当时的判断依据是：“\u003ccode>B\u003c/code>把具体的招聘动作说得过于宽泛，也丢掉了“从别处带走”的含义”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>attended to\u003c/code>是受到照料或事情被处理。段落没有服务对象、照料需求或负责处理事务的人，谈的是招聘\u003ccode>CEO\u003c/code>候选人。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>引入了与招聘无关的照料关系，找不到能接入上下文的完整命题。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第4段中的poached最可能表示被照料、被处理。\u003c/p>\n\u003c/blockquote>\n\u003cp>目标词位于\u003ccode>For years\u003c/code>所引出的旧招聘惯例：最有吸引力的\u003ccode>CEO\u003c/code>候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职\u003ccode>CEO\u003c/code>，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>attended to\u003c/code>是受到照料或事情被处理。段落没有服务对象、照料需求或负责处理事务的人，谈的是招聘\u003ccode>CEO\u003c/code>候选人。\u003c/p>\n\u003cp>猎头优先搜索在职\u003ccode>CEO\u003c/code>，是为新职位物色人才，不是为这些人提供个人照料。两者即便都含“有人对他们做事”，动作目的也完全不同。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>引入了与招聘无关的照料关系，找不到能接入上下文的完整命题。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitt
