udgment about the executive’s character, but in making a career intention visible before the destination is certain.\u003c/p>\n\u003ch4>42. ______\u003c/h4>\n\u003cp>Such an announcement becomes more important when other ambitious deputies make similar moves. Some have waited for a chief executive’s position that may never become available inside their current company. Others discover, during a review of succession plans, that the board prefers someone else. Leaving can then communicate a willingness to pursue a different opportunity. The common element is not necessarily a quarrel with the board or a demand for higher pay. It is the wish to obtain a kind of responsibility the present role does not offer. Several individual departures can therefore reveal a pattern of career decisions rather than a collection of unrelated personal incidents.\u003c/p>\n\u003ch4>43. ______\u003c/h4>\n\u003cp>A recovering economy may make this pattern easier to sustain by creating more openings for aspiring leaders. Yet the new opportunities meet an older recruitment preference. Boards have often instructed headhunters to consider executives who are still securely employed, treating a current post as evidence of desirability. A candidate who resigns first loses that visible protection. The issue is therefore not simply whether more jobs will exist. It is whether an expanding market will make recruiters more willing to consider capable people between positions. New openings create a reason to take the risk, while the inherited preference explains why it remains a risk at all.\u003c/p>\n\u003ch4>44. ______\u003c/h4>\n\u003cp>The risk is visible in executives who leave before another appointment is ready and then wait much longer than expected. A capable manager may spend a year outside a desired position; another may need several years to obtain the role originally sought. These intervals do not by themselves prove that leaving was a mistake. They do show that competence and ambition cannot determine the timetable of a suitable vacancy. A company must need the candidate at the right moment, and its board must agree. The gap between deciding to move and receiving an acceptable offer is a real cost that a story of rapid success can easily hide.\u003c/p>\n\u003ch4>45. ______\u003c/h4>\n\u003cp>Waiting costs should be compared with the costs of remaining, not with an imaginary world free of risk. A company in serious difficulty may offer a familiar title while narrowing an executive’s future choices. In such circumstances, staying can damage a career more than an honest period between jobs. Recruiters may also become less inclined to treat every gap as a sign of failure. None of this makes resignation the only sensible response to uncertainty. It does remove the assumption that keeping the present post is automatically the safer course. A sound decision now requires examining both sides of the choice rather than obeying an inherited rule.\u003c/p>\n"},{"title":"小标题题 41","raw":"## 小标题题 41\n\n**E. Making a career goal public before securing the next job**\n\n未落实下一工作就公开职业目标\n\n对照常见含糊解释与直接公布抱负，突出公开目标时下一份工作仍不确定。\n\n### 关键证据\n\n> keep the explanation vague\n\n先交代惯常的隐瞒或模糊处理，建立对照。\n\n> Recruiters can hear the ambition\n\n公开目标给外部招聘者传递信息。\n\n> before the destination is certain\n\n结尾限定公开的时间点，是下一岗位尚未确定时。\n\n### 段内推进\n\n离职通常解释含糊 → 直接宣布想经营公司 → 招聘者听见目标也看见不确定性 → 开放表达与风险同时存在。\n\n### 标题对应与干扰项比对\n\n`E`的`Making` ... `public`对应`visible`和`hear the ambition`，`before securing` ...对应未有下家，两个条件缺一不可。\n\n`F`把公开目标当性格问题，但段尾明确排除`judgment about` ... `character`。这里分析信息和风险，不是在评价自私、傲慢或冲动。\n\n**最终答案：41 E。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"bird":4,"kind":"small-title-analysis","question":41,"answer":"E"},"html":"\u003cp>\u003cstrong>E. Making a career goal public before securing the next job\u003c/strong>\u003c/p>\n\u003cp>未落实下一工作就公开职业目标\u003c/p>\n\u003cp>对照常见含糊解释与直接公布抱负，突出公开目标时下一份工作仍不确定。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>keep the explanation vague\u003c/p>\n\u003c/blockquote>\n\u003cp>先交代惯常的隐瞒或模糊处理，建立对照。\u003c/p>\n\u003cblockquote>\n\u003cp>Recruiters can hear the ambition\u003c/p>\n\u003c/blockquote>\n\u003cp>公开目标给外部招聘者传递信息。\u003c/p>\n\u003cblockquote>\n\u003cp>before the destination is certain\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾限定公开的时间点，是下一岗位尚未确定时。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>离职通常解释含糊 → 直接宣布想经营公司 → 招聘者听见目标也看见不确定性 → 开放表达与风险同时存在。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>E\u003c/code>的\u003ccode>Making\u003c/code> ... \u003ccode>public\u003c/code>对应\u003ccode>visible\u003c/code>和\u003ccode>hear the ambition\u003c/code>，\u003ccode>before securing\u003c/code> ...对应未有下家，两个条件缺一不可。\u003c/p>\n\u003cp>\u003ccode>F\u003c/code>把公开目标当性格问题，但段尾明确排除\u003ccode>judgment about\u003c/code> ... \u003ccode>character\u003c/code>。这里分析信息和风险，不是在评价自私、傲慢或冲动。\u003c/p>\n\u003cp>\u003cstrong>最终答案：41 E。\u003c/strong>\u003c/p>\n"},{"title":"小标题题 42","raw":"## 小标题题 42\n\n**B. A move from individual ambition to a wider pattern**\n\n从个人抱负到更广泛的现象\n\n由公开离职的一个例子扩大到多位副手，提炼共同职业动因并排除无证据的金钱或冲突解释。\n\n### 关键证据\n\n> other ambitious deputies make similar moves\n\n开头`other`与`similar`把现象从个体扩展到同类。\n\n> not necessarily a quarrel with the board or a demand for higher pay\n\n不将未被接班选中机械等同于冲突或薪资不满。\n\n> a pattern of career decisions\n\n结尾明确多个事件所形成的共同模式。\n\n### 段内推进\n\n更多副手采取类似行动 → 内部CEO机会有限或接班落空 → 向外表达追求新责任 → 个人事件形成职业选择模式。\n\n### 标题对应与干扰项比对\n\n`B`的`individual ambition`对应起点，`wider pattern`对应多个副手及共同职业责任；不是只给其中一人寻找新理由。\n\n`F`将共同动因定位为性格缺陷，但本段具体解释的是职位机会及职责追求，还明确不必归为争吵。由职业处境转成性格归因，换掉了论证层面。\n\n**最终答案：42 B。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"bird":4,"kind":"small-title-analysis","question":42,"answer":"B"},"html":"\u003cp>\u003cstrong>B. A move from individual ambition to a wider pattern\u003c/strong>\u003c/p>\n\u003cp>从个人抱负到更广泛的现象\u003c/p>\n\u003cp>由公开离职的一个例子扩大到多位副手，提炼共同职业动因并排除无证据的金钱或冲突解释。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>other ambitious deputies make similar moves\u003c/p>\n\u003c/blockquote>\n\u003cp>开头\u003ccode>other\u003c/code>与\u003ccode>similar\u003c/code>把现象从个体扩展到同类。\u003c/p>\n\u003cblockquote>\n\u003cp>not necessarily a quarrel with the board or a demand for higher pay\u003c/p>\n\u003c/blockquote>\n\u003cp>不将未被接班选中机械等同于冲突或薪资不满。\u003c/p>\n\u003cblockquote>\n\u003cp>a pattern of career decisions\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾明确多个事件所形成的共同模式。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>更多副手采取类似行动 → 内部CEO机会有限或接班落空 → 向外表达追求新责任 → 个人事件形成职业选择模式。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>individual ambition\u003c/code>对应起点，\u003ccode>wider pattern\u003c/code>对应多个副手及共同职业责任；不是只给其中一人寻找新理由。\u003c/p>\n\u003cp>\u003ccode>F\u003c/code>将共同动因定位为性格缺陷，但本段具体解释的是职位机会及职责追求，还明确不必归为争吵。由职业处境转成性格归因，换掉了论证层面。\u003c/p>\n\u003cp>\u003cstrong>最终答案：42 B。\u003c/strong>\u003c/p>\n"},{"title":"小标题题 43","raw":"## 小标题题 43\n\n**G. New opportunities against an old recruitment preference**\n\n新机会与旧招聘偏好的碰撞\n\n把复苏带来的机会与招聘方偏爱在职者的旧规则并置，说明新策略为何有吸引力又有风险。\n\n### 关键证据\n\n> A recovering economy may make this pattern easier to sustain by creating more openings for aspiring leaders.\n\n先给出愿意跳的环境理由。\n\n> consider executives who are still securely employed\n\n旧偏好的对象是仍在任者，解释离职为何会损失优势。\n\n> New openings create a reason to take the risk, while the inherited preference explains why it remains a risk at all.\n\n结尾两面对照，不能只取机会或只取风险。\n\n### 段内推进\n\n复苏增加岗位 → 但旧偏好仍以在职为优势 → 先辞职者失去保护 → 市场能否接纳空档者成为问题。\n\n### 标题对应与干扰项比对\n\n`G`的`New opportunities`和`old recruitment preference`分别对应段落两半，`against`保留二者之间的张力。\n\n`C`以`Guaranteed`把可能机会改成必定晋升，违背`may`和段内两次`risk`。更多岗位只增加可能性，旧偏好还在形成障碍。\n\n**最终答案：43 G。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"bird":4,"kind":"small-title-analysis","question":43,"answer":"G"},"html":"\u003cp>\u003cstrong>G. New opportunities against an old recruitment preference\u003c/strong>\u003c/p>\n\u003cp>新机会与旧招聘偏好的碰撞\u003c/p>\n\u003cp>把复苏带来的机会与招聘方偏爱在职者的旧规则并置，说明新策略为何有吸引力又有风险。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>A recovering economy may make this pattern easier to sustain by creating more openings for aspiring leaders.\u003c/p>\n\u003c/blockquote>\n\u003cp>先给出愿意跳的环境理由。\u003c/p>\n\u003cblockquote>\n\u003cp>consider executives who are still securely employed\u003c/p>\n\u003c/blockquote>\n\u003cp>旧偏好的对象是仍在任者，解释离职为何会损失优势。\u003c/p>\n\u003cblockquote>\n\u003cp>New openings create a reason to take the risk, while the inherited preference explains why it remains a risk at all.\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾两面对照，不能只取机会或只取风险。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>复苏增加岗位 → 但旧偏好仍以在职为优势 → 先辞职者失去保护 → 市场能否接纳空档者成为问题。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>G\u003c/code>的\u003ccode>New opportunities\u003c/code>和\u003ccode>old recruitment preference\u003c/code>分别对应段落两半，\u003ccode>against\u003c/code>保留二者之间的张力。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>以\u003ccode>Guaranteed\u003c/code>把可能机会改成必定晋升，违背\u003ccode>may\u003c/code>和段内两次\u003ccode>risk\u003c/code>。更多岗位只增加可能性，旧偏好还在形成障碍。\u003c/p>\n\u003cp>\u003cstrong>最终答案：43 G。\u003c/strong>\u003c/p>\n"},{"title":"小标题题 44","raw":"## 小标题题 44\n\n**D. The waiting costs of leaving before the next offer**\n\n下一份邀约未定就离开的等待成本\n\n用漫长等待修正只看快速成功的印象，指出能力和抱负无法控制合适职位何时出现。\n\n### 关键证据\n\n> wait much longer than expected\n\n直接提出先离职后的时间风险。\n\n> competence and ambition cannot determine the timetable\n\n解释为什么优秀和有目标仍不能保证迅速落地。\n\n> a real cost that a story of rapid success can easily hide\n\n结尾回扣个别迅速成功会遮住等待成本。\n\n### 段内推进\n\n先离职再等邀约 → 等待可能一年或多年 → 人才优秀不控制职位时点 → 决策与合适邀约之间存在实际成本。\n\n### 标题对应与干扰项比对\n\n`D`的`waiting costs`对应`intervals`和`gap`，`before the next offer`对应先离职且邀约未定，既包含行为也包含代价。\n\n`C`将辞职与晋升写成保证关系，本段恰用等待削弱这一保证；即使后来找到理想职位，也不能将时间和结果都写成必然。\n\n**最终答案：44 D。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"bird":4,"kind":"small-title-analysis","question":44,"answer":"D"},"html":"\u003cp>\u003cstrong>D. The waiting costs of leaving before the next offer\u003c/strong>\u003c/p>\n\u003cp>下一份邀约未定就离开的等待成本\u003c/p>\n\u003cp>用漫长等待修正只看快速成功的印象，指出能力和抱负无法控制合适职位何时出现。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>wait much longer than expected\u003c/p>\n\u003c/blockquote>\n\u003cp>直接提出先离职后的时间风险。\u003c/p>\n\u003cblockquote>\n\u003cp>competence and ambition cannot determine the timetable\u003c/p>\n\u003c/blockquote>\n\u003cp>解释为什么优秀和有目标仍不能保证迅速落地。\u003c/p>\n\u003cblockquote>\n\u003cp>a real cost that a story of rapid success can easily hide\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾回扣个别迅速成功会遮住等待成本。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>先离职再等邀约 → 等待可能一年或多年 → 人才优秀不控制职位时点 → 决策与合适邀约之间存在实际成本。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>waiting costs\u003c/code>对应\u003ccode>intervals\u003c/code>和\u003ccode>gap\u003c/code>，\u003ccode>before the next offer\u003c/code>对应先离职且邀约未定，既包含行为也包含代价。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>将辞职与晋升写成保证关系，本段恰用等待削弱这一保证；即使后来找到理想职位，也不能将时间和结果都写成必然。\u003c/p>\n\u003cp>\u003cstrong>最终答案：44 D。\u003c/strong>\u003c/p>\n"},{"title":"小标题题 45","raw":"## 小标题题 45\n\n**A. Reconsidering the safety of staying put**\n\n重新考虑留任的安全性\n\n把离职等待与留任损失比较，推翻留任自动更安全的假定，同时保留具体判断空间。\n\n### 关键证据\n\n> compared with the costs of remaining\n\n开头增加比较另一端，不能只统计辞职风险。\n\n> staying can damage a career more\n\n处境恶化时，留任也能更伤事业。\n\n> None of this makes resignation the only sensible response\n\n排除把新判断绝对化为唯一应该辞职。\n\n### 段内推进\n\n等待有代价 → 留任也有风险 → 空档未必代表失败 → 留下不自动更安全 → 对照具体两端再决定。\n\n### 标题对应与干扰项比对\n\n`A`的`Reconsidering`是重新评估而非一律否定，`safety of staying put`正是被检验的旧假定，与末句的双向权衡一致。\n\n`C`声称保证晋升，与本段保留风险、否定唯一答案不符。段落降低了空档污名，不等于能保证新的职位或更高层级。\n\n**最终答案：45 A。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"bird":4,"kind":"small-title-analysis","question":45,"answer":"A"},"html":"\u003cp>\u003cstrong>A. Reconsidering the safety of staying put\u003c/strong>\u003c/p>\n\u003cp>重新考虑留任的安全性\u003c/p>\n\u003cp>把离职等待与留任损失比较，推翻留任自动更安全的假定，同时保留具体判断空间。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>compared with the costs of remaining\u003c/p>\n\u003c/blockquote>\n\u003cp>开头增加比较另一端，不能只统计辞职风险。\u003c/p>\n\u003cblockquote>\n\u003cp>staying can damage a career more\u003c/p>\n\u003c/blockquote>\n\u003cp>处境恶化时，留任也能更伤事业。\u003c/p>\n\u003cblockquote>\n\u003cp>None of this makes resignation the only sensible response\u003c/p>\n\u003c/blockquote>\n\u003cp>排除把新判断绝对化为唯一应该辞职。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>等待有代价 → 留任也有风险 → 空档未必代表失败 → 留下不自动更安全 → 对照具体两端再决定。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>Reconsidering\u003c/code>是重新评估而非一律否定，\u003ccode>safety of staying put\u003c/code>正是被检验的旧假定，与末句的双向权衡一致。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>声称保证晋升，与本段保留风险、否定唯一答案不符。段落降低了空档污名，不等于能保证新的职位或更高层级。\u003c/p>\n\u003cp>\u003cstrong>最终答案：45 A。\u003c/strong>\u003c/p>\n"},{"title":"排序题 · 完整题面与全局解析","raw":"### 排序题\n\n**训练用改编文本，不是外刊原文。**\n\nArrange paragraphs A–H into a coherent text. A, E and H are already in position.\n\n**A → 41 → 42 → E → 43 → 44 → 45 → H**\n\n#### [A]\n\nA departing executive can hide an uncertain future behind a vague explanation. One who openly says he wants to run a company makes another choice: he tells potential recruiters what he hopes to do before securing the next position. The announcement exposes a risk, but it also sends a clear message. It raises a question about whether other ambitious deputies are beginning to act similarly.\n\n#### [B]\n\nThat assumption has consequently become less secure. Recruiters can distinguish someone leaving a deteriorating situation from someone unable to perform, rather than treating both as the same kind of applicant. Greater acceptance of a gap does not guarantee the next appointment. It does mean that keeping the present job is no longer automatically the safer option.\n\n#### [C]\n\nOther deputies have indeed made comparable departures. Some want a chief executive’s role unavailable inside their existing firms; others have failed to win support in a succession review. Their decisions need not indicate a personal dispute. They can instead express a common wish for different professional responsibility. Whether these ambitions find an outlet depends partly on the wider supply of leadership jobs.\n\n#### [D]\n\nThat wait could be substantial. An executive might spend a year seeking the desired role, while another might take several years to arrive at it. During that interval, the manager must continue explaining a professional goal without being able to name its final destination. These cases qualify the impression created by a rapid success: ambition does not control when a suitable company will need a leader. Yet the cost of waiting outside a company is not the only cost a decision must consider.\n\n#### [E]\n\nHistorically, boards often preferred candidates who still held a senior post. Headhunters were asked to look first at sitting executives, whose current employment seemed to certify their value. Resigning before a search was complete ran against that convention. For a person without the protection of an existing position, the test was how long it would take to secure another suitable appointment.\n\n#### [F]\n\nThat supply may expand as the economy begins to recover. More vacancies could make a move without a firm offer seem less hazardous than it did during a contraction. But available jobs are only one side of a recruitment market. The other is the kind of candidate that boards ask headhunters to find, and that preference has a long history.\n\n#### [G]\n\nRemaining inside a troubled company can also damage an executive’s prospects. A familiar title may conceal a shrinking business and diminishing chances to develop. The crisis made such damage harder to ignore. If staying could be dangerous, recruiters needed to reconsider the old assumption that a period between jobs necessarily marked a failed or undesirable candidate.\n\n#### [H]\n\nThe change is best understood as a wider range of career choices, not a universal instruction to resign. Ambitious managers may pursue a goal openly, new opportunities may make movement easier, and old preferences may weaken. Waiting still has a price. The question is now how that price compares with the risk of remaining, instead of whether an unbroken job record should decide the matter in advance.\n\n### 全局解析\n\n| 段落 | 在全文中的作用 |\n| --- | --- |\n| A | 以公开目标的个案提问是否形成趋势 |\n| B | 重估空档，把新旧安全判断翻转 |\n| C | 扩大到同类动因，转向岗位供给 |\n| D | 展示等待代价，提示还有另一端成本 |\n| E | 回顾在职偏好，提出先辞职者等待问题 |\n| F | 说明复苏机会，转问招聘偏好 |\n| G | 补充留任风险，要求重估空档污名 |\n| H | 综合新机会与两端风险，反对唯一处方 |\n\n全文推进：\n\n以公开目标的个案提问是否形成趋势 → 扩大到同类动因，转向岗位供给 → 说明复苏机会，转问招聘偏好 → 回顾在职偏好，提出先辞职者等待问题 → 展示等待代价，提示还有另一端成本 → 补充留任风险，要求重估空档污名 → 重估空档，把新旧安全判断翻转 → 综合新机会与两端风险，反对唯一处方\n\n**完整顺序：A—C—F—E—D—G—B—H。**\n\n**41—45：C、F、D、G、B。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"bird":4,"kind":"sorting-overview"},"html":"\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>训练用改编文本，不是外刊原文。\u003c/strong>\u003c/p>\n\u003cp>Arrange paragraphs A–H into a coherent text. A, E and H are already in position.\u003c/p>\n\u003cp>\u003cstrong>A → 41 → 42 → E → 43 → 44 → 45 → H\u003c/strong>\u003c/p>\n\u003ch4>[A]\u003c/h4>\n\u003cp>A departing executive can hide an uncertain future behind a vague explanation. One who openly says he wants to run a company makes another choice: he tells potential recruiters what he hopes to do before securing the next position. The announcement exposes a risk, but it also sends a clear message. It raises a question about whether other ambitious deputies are beginning to act similarly.\u003c/p>\n\u003ch4>[B]\u003c/h4>\n\u003cp>That assumption has consequently become less secure. Recruiters can distinguish someone leaving a deteriorating situation from someone unable to perform, that preference has a long history.\u003c/p>\n\u003ch4>[G]\u003c/h4>\n\u003cp>Remaining inside a troubled company can also damage an executive’s prospects. A familiar title may conceal a shrinking business and diminishing chances to develop. The crisis made such damage harder to ignore. If staying could be dangerous, recruiters needed to reconsider the old assumption that a period between jobs necessarily marked a failed or undesirable candidate.\u003c/p>\n\u003ch4>[H]\u003c/h4>\n\u003cp>The change is best understood as a wider range of career choices, not a universal instruction to resign. Ambitious managers may pursue a goal openly, new opportunities may make movement easier, and old preferences may weaken. Waiting still has a price. The question is now how that price compares with the risk of remaining, instead of whether an unbroken job record should decide the matter in advance.\u003c/p>\n\u003ch3>全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>在全文中的作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>以公开目标的个案提问是否形成趋势\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>重估空档，把新旧安全判断翻转\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>扩大到同类动因，转向岗位供给\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>展示等待代价，提示还有另一端成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>回顾在职偏好，提出先辞职者等待问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>说明复苏机会，转问招聘偏好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>补充留任风险，要求重估空档污名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>综合新机会与两端风险，反对唯一处方\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cp>以公开目标的个案提问是否形成趋势 → 扩大到同类动因，转向岗位供给 → 说明复苏机会，转问招聘偏好 → 回顾在职偏好，提出先辞职者等待问题 → 展示等待代价，提示还有另一端成本 → 补充留任风险，要求重估空档污名 → 重估空档，把新旧安全判断翻转 → 综合新机会与两端风险，反对唯一处方\u003c/p>\n\u003cp>\u003cstrong>完整顺序：A—C—F—E—D—G—B—H。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>41—45：C、F、D、G、B。\u003c/strong>\u003c/p>\n"},{"title":"排序题 41","raw":"## 排序题 41\n\n这是全文第2个位置。先承接前段A，再接后段F；与相邻待排段构成的组合还要同时满足前后两侧证据。\n\n### 前后衔接的关键证据\n\n前段A末尾：\n\n> whether other ambitious deputies are beginning to act similarly.\n\n候选段C开头：\n\n> Other deputies have indeed made comparable departures.\n\n候选段C末尾：\n\n> the wider supply of leadership jobs.\n\n后段F开头：\n\n> That supply\n\n### 为什么能接起来\n\n`A`末尾问其他副手是否类似，`C`以`Other deputies`和`indeed`直接作答，归纳职业责任的追求，再把能否实现接到岗位供给；`F`的`That supply`承接这个新对象。\n\n局部推进：以公开目标的个案提问是否形成趋势 → 扩大到同类动因，转向岗位供给 → 说明复苏机会，转问招聘偏好。\n\n### 最强候选比对\n\nB段的开头是：\n\n> That assumption\n\n`B`需要传统空档污名这一判断，`A`还未介绍招聘旧规则，不能用`That assumption`回指一个尚未提出的假设。\n\n**最终答案：41 C。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"bird":4,"kind":"sorting-analysis","question":41,"answer":"C"},"html":"\u003cp>这是全文第2个位置。先承接前段A，再接后段F；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段A末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>whether other ambitious deputies are beginning to act similarly.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段C开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Other deputies have indeed made comparable departures.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段C末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the wider supply of leadership jobs.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That supply\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>A\u003c/code>末尾问其他副手是否类似，\u003ccode>C\u003c/code>以\u003ccode>Other deputies\u003c/code>和\u003ccode>indeed\u003c/code>直接作答，归纳职业责任的追求，再把能否实现接到岗位供给；\u003ccode>F\u003c/code>的\u003ccode>That supply\u003c/code>承接这个新对象。\u003c/p>\n\u003cp>局部推进：以公开目标的个案提问是否形成趋势 → 扩大到同类动因，转向岗位供给 → 说明复苏机会，转问招聘偏好。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>B段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That assumption\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>需要传统空档污名这一判断，\u003ccode>A\u003c/code>还未介绍招聘旧规则，不能用\u003ccode>That assumption\u003c/code>回指一个尚未提出的假设。\u003c/p>\n\u003cp>\u003cstrong>最终答案：41 C。\u003c/strong>\u003c/p>\n"},{"title":"排序题 42","raw":"## 排序题 42\n\n这是全文第3个位置。先承接前段C，再接后段E；后面的E是题面已给定的固定位置。\n\n### 前后衔接的关键证据\n\n前段C末尾：\n\n> the wider supply of leadership jobs.\n\n候选段F开头：\n\n> That supply may expand\n\n候选段F末尾：\n\n> the kind of candidate that boards ask headhunters to find\n\n后段E开头：\n\n> Historically, boards often preferred candidates\n\n### 为什么能接起来\n\n`F`先回应`C`的岗位供给，说明复苏可扩机会，再用`But`将市场拆成岗位与候选人偏好两面；末尾提偏好有历史，`E`才以`Historically`展开在职者优先。\n\n局部推进：扩大到同类动因，转向岗位供给 → 说明复苏机会，转问招聘偏好 → 回顾在职偏好，提出先辞职者等待问题。\n\n### 最强候选比对\n\nD段的开头是：\n\n> That wait\n\n`D`要回指寻找下一职位的等待，`C`只说目标与岗位供给，并没有提出这段具体等待；且`D`不能引出`E`的历史偏好。\n\n**最终答案：42 F。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"bird":4,"kind":"sorting-analysis","question":42,"answer":"F"},"html":"\u003cp>这是全文第3个位置。先承接前段C，再接后段E；后面的E是题面已给定的固定位置。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段C末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the wider supply of leadership jobs.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段F开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That supply may expand\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段F末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the kind of candidate that boards ask headhunters to find\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Historically, boards often preferred candidates\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>F\u003c/code>先回应\u003ccode>C\u003c/code>的岗位供给，说明复苏可扩机会，再用\u003ccode>But\u003c/code>将市场拆成岗位与候选人偏好两面；末尾提偏好有历史，\u003ccode>E\u003c/code>才以\u003ccode>Historically\u003c/code>展开在职者优先。\u003c/p>\n\u003cp>局部推进：扩大到同类动因，转向岗位供给 → 说明复苏机会，转问招聘偏好 → 回顾在职偏好，提出先辞职者等待问题。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>D段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That wait\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>要回指寻找下一职位的等待，\u003ccode>C\u003c/code>只说目标与岗位供给，并没有提出这段具体等待；且\u003ccode>D\u003c/code>不能引出\u003ccode>E\u003c/code>的历史偏好。\u003c/p>\n\u003cp>\u003cstrong>最终答案：42 F。\u003c/strong>\u003c/p>\n"},{"title":"排序题 43","raw":"## 排序题 43\n\n这是全文第5个位置。先承接前段E，再接后段G；与相邻待排段构成的组合还要同时满足前后两侧证据。\n\n### 前后衔接的关键证据\n\n前段E末尾：\n\n> how long it would take to secure another suitable appointment.\n\n候选段D开头：\n\n> That wait could be substantial.\n\n候选段D末尾：\n\n> not the only cost a decision must consider.\n\n后段G开头：\n\n> Remaining inside a troubled company\n\n### 为什么能接起来\n\n`E`把先辞职者的检验收在要等多久，`D`用一年与数年回答，再说等待不是唯一成本；`G`从`Remaining`转到留任，正补足另一端。\n\n局部推进：回顾在职偏好，提出先辞职者等待问题 → 展示等待代价，提示还有另一端成本 → 补充留任风险，要求重估空档污名。\n\n### 最强候选比对\n\nC段的开头是：\n\n> Other deputies\n\n`C`会回到趋势与动因，不能回答`E`刚提出的等待长度，也不能为`G`的另一端风险建立比较。\n\n**最终答案：43 D。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"bird":4,"kind":"sorting-analysis","question":43,"answer":"D"},"html":"\u003cp>这是全文第5个位置。先承接前段E，再接后段G；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段E末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>how long it would take to secure another suitable appointment.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段D开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That wait could be substantial.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段D末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>not the only cost a decision must consider.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Remaining inside a troubled company\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>E\u003c/code>把先辞职者的检验收在要等多久，\u003ccode>D\u003c/code>用一年与数年回答，再说等待不是唯一成本；\u003ccode>G\u003c/code>从\u003ccode>Remaining\u003c/code>转到留任，正补足另一端。\u003c/p>\n\u003cp>局部推进：回顾在职偏好，提出先辞职者等待问题 → 展示等待代价，提示还有另一端成本 → 补充留任风险，要求重估空档污名。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>C段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Other deputies\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>C\u003c/code>会回到趋势与动因，不能回答\u003ccode>E\u003c/code>刚提出的等待长度，也不能为\u003ccode>G\u003c/code>的另一端风险建立比较。\u003c/p>\n\u003cp>\u003cstrong>最终答案：43 D。\u003c/strong>\u003c/p>\n"},{"title":"排序题 44","raw":"## 排序题 44\n\n这是全文第6个位置。先承接前段D，再接后段B；与相邻待排段构成的组合还要同时满足前后两侧证据。\n\n### 前后衔接的关键证据\n\n前段D末尾：\n\n> not the only cost a decision must consider.\n\n候选段G开头：\n\n> Remaining inside a troubled company\n\n候选段G末尾：\n\n> a period between jobs necessarily marked a failed or undesirable candidate.\n\n后段B开头：\n\n> That assumption\n\n### 为什么能接起来\n\n`G`接`D`的另一种成本，说明留在困境企业也会受损，继而质疑空档必然代表失败的旧判断；`B`的`That assumption`明确回指这个完整命题。\n\n局部推进：展示等待代价，提示还有另一端成本 → 补充留任风险，要求重估空档污名 → 重估空档，把新旧安全判断翻转。\n\n### 最强候选比对\n\nF段的开头是：\n\n> That supply\n\n`F`讨论岗位供给，既不是`D`要求补充的留任损失，也没有给`B`提供关于空档污名的假设。\n\n**最终答案：44 G。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"bird":4,"kind":"sorting-analysis","question":44,"answer":"G"},"html":"\u003cp>这是全文第6个位置。先承接前段D，再接后段B；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段D末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>not the only cost a decision must consider.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段G开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Remaining inside a troubled company\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段G末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>a period between jobs necessarily marked a failed or undesirable candidate.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That assumption\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>G\u003c/code>接\u003ccode>D\u003c/code>的另一种成本，说明留在困境企业也会受损，继而质疑空档必然代表失败的旧判断；\u003ccode>B\u003c/code>的\u003ccode>That assumption\u003c/code>明确回指这个完整命题。\u003c/p>\n\u003cp>局部推进：展示等待代价，提示还有另一端成本 → 补充留任风险，要求重估空档污名 → 重估空档，把新旧安全判断翻转。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>F段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That supply\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>F\u003c/code>讨论岗位供给，既不是\u003ccode>D\u003c/code>要求补充的留任损失，也没有给\u003ccode>B\u003c/code>提供关于空档污名的假设。\u003c/p>\n\u003cp>\u003cstrong>最终答案：44 G。\u003c/strong>\u003c/p>\n"},{"title":"排序题 45","raw":"## 排序题 45\n\n这是全文第7个位置。先承接前段G，再接后段H；后面的H是题面已给定的固定结尾。\n\n### 前后衔接的关键证据\n\n前段G末尾：\n\n> a period between jobs necessarily marked a failed or undesirable candidate.\n\n候选段B开头：\n\n> That assumption has consequently become less secure.\n\n候选段B末尾：\n\n> keeping the present job is no longer automatically the safer option.\n\n后段H开头：\n\n> The change is best understood as a wider range of career choices\n\n### 为什么能接起来\n\n`B`先削弱`G`提出的空档即失败假设，再区分辞职处境与能力问题，最后翻转留任自动安全的判断。`H`据此总结为选择增加，并重新保留等待代价。\n\n局部推进：补充留任风险，要求重估空档污名 → 重估空档，把新旧安全判断翻转 → 综合新机会与两端风险，反对唯一处方。\n\n### 最强候选比对\n\nD段的开头是：\n\n> That wait\n\n`D`会回到先辞职等待的长度，没有完成对空档污名的重新评价，也无法形成`H`所总结的新选择范围。\n\n**最终答案：45 B。**","section":"第四鸟 · 新题型","level":2,"context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"bird":4,"kind":"sorting-analysis","question":45,"answer":"B"},"html":"\u003cp>这是全文第7个位置。先承接前段G，再接后段H；后面的H是题面已给定的固定结尾。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段G末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>a period between jobs necessarily marked a failed or undesirable candidate.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段B开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That assumption has consequently become less secure.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段B末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>keeping the present job is no longer automatically the safer option.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The change is best understood as a wider range of career choices\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>B\u003c/code>先削弱\u003ccode>G\u003c/code>提出的空档即失败假设，再区分辞职处境与能力问题，最后翻转留任自动安全的判断。\u003ccode>H\u003c/code>据此总结为选择增加，并重新保留等待代价。\u003c/p>\n\u003cp>局部推进：补充留任风险，要求重估空档污名 → 重估空档，把新旧安全判断翻转 → 综合新机会与两端风险，反对唯一处方。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>D段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That wait\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>会回到先辞职等待的长度，没有完成对空档污名的重新评价，也无法形成\u003ccode>H\u003c/code>所总结的新选择范围。\u003c/p>\n\u003cp>\u003cstrong>最终答案：45 B。\u003c/strong>\u003c/p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **rational career choices** | **理性择业** | **社会现象类·社会生活** | **个人主题** |\n| ambition | 抱负 | 人生哲理类 | 个人主题 |\n| independent thinking | 独立思考 | 人生哲理类 | 个人主题 |\n| **keeping pace with the times** | **与时俱进** | **人生哲理类** | **个人主题** |\n| career planning | 职业规划 | 教育文化类 | 个人主题 |\n| stress management | 压力管理 | 人生哲理类 | 个人主题 |\n| **employment competitiveness** | **就业竞争力** | **社会现象类·社会生活** | **个人主题** |\n| economic recovery | 经济复苏 | 经济消费类 | 宏观主题 |\n| opportunities for promotion | 晋升机会 | 教育文化类 | 个人主题 |","section":"第五鸟 · 写作积累","level":2,"context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{"bird":5,"kind":"writing-table"},"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>rational career choices\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>理性择业\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类·社会生活\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ambition\u003c/td>\n\u003ctd>抱负\u003c/td>\n\u003ctd>人生哲理类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>independent thinking\u003c/td>\n\u003ctd>独立思考\u003c/td>\n\u003ctd>人生哲理类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>keeping pace with the times\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>与时俱进\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人 tle":true},"meta":{"bird":5,"kind":"writing-table"},"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>In the picture, A leaves B to pursue the goal of C.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图中，A离开B以追求C这一目标。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>Rather than following A, the person chooses to do B.\u003c/td>\n\u003ctd>画中人没有遵循A，而是选择做B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene shows A reflecting on what kind of B to choose.\u003c/td>\n\u003ctd>画面展示A在思考应选择哪一种B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>In the third quarter, A was down X% from a year earlier.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>第三季度，A比一年前下降了X%。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>As A recovered, opportunities for B increased.\u003c/td>\n\u003ctd>随着A恢复，B的机会增加了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The chart shows a change in A over a period of B years.\u003c/td>\n\u003ctd>图表展示A在B年间的变化。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage questions the traditional rule that A is safer than B.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文质疑了A比B更安全这一传统规则。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author suggests that A is becoming more acceptable.\u003c/td>\n\u003ctd>作者认为A正变得更可接受。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion explains why A may be more willing to do B.\u003c/td>\n\u003ctd>讨论解释了A为何可能更愿意做B。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003ch2>小标题题\u003c/h2>\u003cp>训练用改编文本，不是外刊原文。\u003c/p>\u003cp>Choose the most suitable heading. Two headings are extra.\u003c/p>\u003cp>\u003cstrong>A.\u003c/strong> Reconsidering the safety of staying put\u003c/p>\u003cp>\u003cstrong>B.\u003c/strong> A move from individual ambition to a wider pattern\u003c/p>\u003cp>\u003cstrong>C.\u003c/strong> Guaranteed promotion after resignation\u003c/p>\u003cp>\u003cstrong>D.\u003c/strong> The waiting costs of leaving before the next offer\u003c/p>\u003cp>\u003cstrong>E.\u003c/strong> Making a career goal public before securing the next job\u003c/p>\u003cp>\u003cstrong>F.\u003c/strong> Character flaws behind executive departures\u003c/p>\u003cp>\u003cstrong>G.\u003c/strong> New opportunities against an old recruitment preference\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41. ______\u003c/h3>\u003cp>A senior executive who leaves a prestigious position normally has reasons to keep the explanation vague. A private disagreement can be disguised as a wish for more time, and an uncertain future need not be advertised. An executive who instead announces a desire to run a company makes a different choice. Recruiters can hear the ambition, but they can also see that the next position has not yet been secured. The announcement therefore combines openness about a goal with exposure to a risk. Its significance lies neither in a promise of success nor in a judgment about the executive’s character, but in making a career intention visible before the destination is certain.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42. ______\u003c/h3>\u003cp>Such an announcement becomes more important when other ambitious deputies make similar moves. Some have waited for a chief executive’s position that may never become available inside their current company. Others discover, during a review of succession plans, that the board prefers someone else. Leaving can then communicate a willingness to pursue a different opportunity. The common element is not necessarily a quarrel with the board or a demand for higher pay. It is the wish to obtain a kind of responsibility the present role does not offer. Several individual departures can therefore reveal a pattern of career decisions rather than a collection of unrelated personal incidents.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43. ______\u003c/h3>\u003cp>A recovering economy may make this pattern easier to sustain by creating more openings for aspiring leaders. Yet the new opportunities meet an older recruitment preference. Boards have often instructed headhunters to consider executives who are still securely employed, treating a current post as evidence of desirability. A candidate who resigns first loses that visible protection. The issue is therefore not simply whether more jobs will exist. It is whether an expanding market will make recruiters more willing to consider capable people between positions. New openings create a reason to take the risk, while the inherited preference explains why it remains a risk at all.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44. ______\u003c/h3>\u003cp>The risk is visible in executives who leave before another appointment is ready and then wait much longer than expected. A capable manager may spend a year outside a desired position; another may need several years to obtain the role originally sought. These intervals do not by themselves prove that leaving was a mistake. They do show that competence and ambition cannot determine the timetable of a suitable vacancy. A company must need the candidate at the right moment, and its board must agree. The gap between deciding to move and receiving an acceptable offer is a real cost that a story of rapid success can easily hide.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45. ______\u003c/h3>\u003cp>Waiting costs should be compared with the costs of remaining, not with an imaginary world free of risk. A company in serious difficulty may offer a familiar title while narrowing an executive’s future choices. In such circumstances, staying can damage a career more than an honest period between jobs. Recruiters may also become less inclined to treat every gap as a sign of failure. None of this makes resignation the only sensible response to uncertainty. It does remove the assumption that keeping the present post is automatically the safer course. A sound decision now requires examining both sides of the choice rather than obeying an inherited rule.\u003c/p>\u003c/section>","sorting":"\u003ch2>排序题\u003c/h2>\u003cp>训练用改编文本，不是外刊原文。\u003c/p>\u003cp>A → 41 → 42 → E → 43 → 44 → 45 → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>[A]\u003c/h3>\u003cp>A departing executive can hide an uncertain future behind a vague explanation. One who openly says he wants to run a company makes another choice: he tells potential recruiters what he hopes to do before securing the next position. The announcement exposes a risk, but it also sends a clear message. It raises a question about whether other ambitious deputies are beginning to act similarly.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>[B]\u003c/h3>\u003cp>That assumption has consequently become less secure. Recruiters can distinguish someone leaving a deteriorating situation from someone unable to perform, rather than treating both as the same kind of applicant. Greater acceptance of a gap does not guarantee the next appointment. It does mean that keeping the present job is no longer automatically the safer option.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>[C]\u003c/h3>\u003cp>Other deputies have indeed made comparable departures. Some want a chief executive’s role unavailable inside their existing firms; others have failed to win support in a succession review. Their decisions need not indicate a personal dispute. They can instead express a common wish for different professional responsibility. Whether these ambitions find an outlet depends partly on the wider supply of leadership jobs.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>[D]\u003c/h3>\u003cp>That wait could be substantial. An executive might spend a year seeking the desired role, while another might take several years to arrive at it. During that interval, the manager must continue explaining a professional goal without being able to name its final destination. These cases qualify the impression created by a rapid success: ambition does not control when a suitable company will need a leader. Yet the cost of waiting outside a company is not the only cost a decision must consider.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>[E]\u003c/h3>\u003cp>Historically, boards often preferred candidates who still held a senior post. Headhunters were asked to look first at sitting executives, whose current employment seemed to certify their value. Resigning before a search was complete ran against that convention. For a person without the protection of an existing position, the test was how long it would take to secure another suitable appointment.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>[F]\u003c/h3>\u003cp>That supply may expand as the economy begins to recover. More vacancies could make a move without a firm offer seem less hazardous than it did during a contraction. But available jobs are only one side of a recruitment market. The other is the kind of candidate that boards ask headhunters to find, and that preference has a long history.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>[G]\u003c/h3>\u003cp>Remaining inside a troubled company can also damage an executive’s prospects. A familiar title may conceal a shrinking business and diminishing chances to develop. The crisis made such damage harder to ignore. If staying could be dangerous, recruiters needed to reconsider the old assumption that a period between jobs necessarily marked a failed or undesirable candidate.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>[H]\u003c/h3>\u003cp>The change is best understood as a wider range of career choices, not a universal instruction to resign. Ambitious managers may pursue a goal openly, new opportunities may make movement easier, and old preferences may weaken. Waiting still has a price. The question is now how that price compares with the risk of remaining, instead of whether an unbroken job record should decide the matter in advance.\u003c/p>\u003c/section>"};
const FULL = "\u003ch1>0.阅前须知\u003c/h1>\n\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文词汇与译文标注长图\">\u003c/p>\n\u003ch1>第1段\u003c/h1>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u00
