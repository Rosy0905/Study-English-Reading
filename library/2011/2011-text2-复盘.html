<script>
const DATA = [{"title":"史上最强阅读复盘法：一石五鸟法","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","section":"方法总览","level":2,"context":null,"meta":{"bird":0},"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"title":"第1段","raw":"# 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| depart | v.离职 | president | n.总裁 | explanation | n.解释 |\n| surprisingly | adv.出人意料地 | straight up | a.坦率直接的 | rather than | conj.而不是 |\n| cloak | v.掩饰 | exit | n.离开 | usual | a.通常的 |\n| vague excuse | n.含糊借口 | come right out | v.直截了当地说 | pursue | v.追求 |\n| goal | n.目标 | run a company | v.经营公司 | broadcast | v.公开宣扬 |\n| ambition | n.抱负 | decision | n.决定 | board | n.董事会 |\n| name | v.任命 | chairman | n.董事长 |  |  |","section":"第一鸟 · 词汇","level":1,"context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[85,112,925,680],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{"bird":1,"kind":"vocabulary","paragraph":1},"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>depart\u003c/td>\n\u003ctd>v.离职\u003c/td>\n\u003ctd>president\u003c/td>\n\u003ctd>n he nod → also may wish to move on.\u003c/p>\n\u003cp>A turbulent business environment → also has senior managers → cautious of：(letting vague pronouncements → cloud their reputations).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>As the first signs：(of recovery) → begin to take hold → deputy chiefs → may be more willing：(to make the jump：(without a net)).\u003c/p>\n\u003cp>In the third quarter → CEO turnover → was down 23%：(from a year ago) → as nervous boards → stuck with the leaders：(they had) → according to Liberum Research.\u003c/p>\n\u003cp>As the economy picks up → opportunities will abound：(for aspiring leaders).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>The decision：(to quit a senior position：(to look for a better one)) → is unconventional.\u003c/p>\n\u003cp>For years → executives and headhunters → have adhered to the rule：(that the most attractive CEO candidates → are the ones：(who must be poached)).\u003c/p>\n\u003cp>Says Korn/Ferry senior partner Dennis Carey：(&quot;I can&#39;t think of → a single search：(I&#39;ve done)：(where a board → has not instructed me → to look at sitting CEOs first)&quot;).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Those who jumped：(without a job) → haven&#39;t always landed：(in top positions quickly).\u003c/p>\n\u003cp>Ellen Marram quit：(as chief of Tropicana)：(a decade ago) → saying she wanted：(to be a CEO).\u003c/p>\n\u003cp>It was a year → before she became head：(of a tiny Internet-based → commodities exchange).\u003c/p>\n\u003cp>Robert Willumstad left：(Citigroup in 2005)：(with ambitions：(to be a CEO)).\u003c/p>\n\u003cp>He finally took that post：(at a major financial institution)：(three years later).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Many recruiters say → the old disgrace → is fading：(for top performers).\u003c/p>\n\u003cp>The financial crisis → has made it → more acceptable：(to be between jobs // or to leave a bad one).\u003c/p>\n\u003cp>&quot;The traditional rule → was it&#39;s safer：(to stay where you are) // but that&#39;s been → fundamentally inverted,&quot; → says one headhunter.\u003c/p>\n\u003cp>&quot;The people：(who&#39;ve been hurt the worst) → are those：(who&#39;ve stayed too long).&quot;\u003c/p>\n"},{"title":"中文句子逻辑","raw":"## 中文句子逻辑\n\n### 第1段\n\n当利亚姆·麦吉离开：(作为美国银行的总裁)：(在八月) → 他的解释是 → 出人意料地直率。\n\n而不是掩饰他的离职：(用通常的模糊借口) → 他直接出来说 → 他要离开：(\"去追求我的目标：(管理一家公司)\")。\n\n公开他的雄心 → 是\"完全是我的决定，\" → 麦吉说。\n\n在两周内 → 他正在交谈：(第一次)：(与董事会：(哈特福德金融服务集团的))：(该集团任命他 → CEO和董事长：(在9月29日))。\n\n### 第2段\n\n麦吉说 → 离开时没有安排好职位 → 给了他时间：(去思考：(什么样的公司 → 他想要管理))。\n\n这也发出了 → 一个清晰的信息：(给外界)：(关于他的抱负)。\n\n而且麦吉并不孤单。\n\n在最近几周 → 二号高管们：(在雅芳和美国运通) → 辞职了：(带着解释：(他们正在寻找 → CEO职位))。\n\n当董事会审查 → 继任计划：(响应 → 股东压力) → 没有获得认可的高管们 → 也可能希望离开。\n\n动荡的商业环境 → 也让高级经理们 → 谨慎对待：(让模糊的声明 → 损害他们的声誉)。\n\n### 第3段\n\n随着最初的迹象：(复苏的) → 开始站稳脚跟 → 副总裁们 → 可能更愿意：(做出跳跃：(没有安全网的))。\n\n在第三季度 → CEO更替 → 下降了23%：(与一年前相比) → 因为紧张的董事会 → 坚持使用领导者：(他们已有的) → 根据Liberum研究。\n\n随着经济回升 → 机会将大量出现：(对有抱负的领导者)。\n\n### 第4段\n\n这个决定：(辞去高级职位：(寻找更好的职位)) → 是非传统的。\n\n多年来 → 高管和猎头们 → 一直遵守规则：(最有吸引力的CEO候选人 → 是那些人：(必须被挖走的))。\n\n光辉国际高级合伙人丹尼斯·凯里说：(\"我想不出 → 任何一次搜寻：(我做过的)：(其中董事会 → 没有指示我 → 首先看在职CEO)\")。\n\n### 第5段\n\n那些跳槽的人：(没有工作) → 并不总是能找到：(高级职位很快地)。\n\n艾伦·马拉姆辞职了：(作为纯品康纳的首席执行官)：(十年前) → 说她想要：(成为CEO)。\n\n过了一年 → 她才成为负责人：(一个小型的基于互联网的 → 商品交易所)。\n\n罗伯特·威勒姆斯塔德离开了：(花旗集团在2005年)：(带着雄心：(成为CEO))。\n\n他最终接受了那个职位：(在一家主要金融机构)：(三年后)。\n\n### 第6段\n\n许多招聘者说 → 旧的耻辱 → 正在消退：(对顶尖表现者)。\n\n金融危机 → 已经使它 → 更可接受：(处于工作之间 // 或离开糟糕的工作)。\n\n\"传统规则 → 是更安全：(留在你现在的地方) // 但那已经 → 根本颠倒了，\" → 一位猎头说。\n\n\"那些人：(受伤最严重的) → 是那些：(待得太久的)。\"","section":"第二鸟 · 精读与翻译","level":2,"context":{"mode":"image","asset":"articleAnnotated","label":"文章句内逻辑","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{"bird":2,"kind":"logic"},"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>当利亚姆·麦吉离开：(作为美国银行的总裁)：(在八月) → 他的解释是 → 出人意料地直率。\u003c/p>\n\u003cp>而不是掩饰他的离职：(用通常的模糊借口) → 他直接出来说 → 他要离开：(&quot;去追求我的目标：(管理一家公司)&quot;)。\u003c/p>\n\u003cp>公开他的雄心 → 是&quot;完全是我的决定，&quot; → 麦吉说。\u003c/p>\n\u003cp>在两周内 → 他正在交谈：(第一次)：(与董事会：(哈特福德金融服务集团的))：(该集团任命他 → "long-sentence","paragraph":4,"sentence":3,"cumulative":true,"cumulativeGroup":"long-4-3","partIndex":5,"cumulativeFinal":true},"focusId":"focus-long-4-3-5","html":"\u003csection class=\"revealPart\" id=\"focus-long-4-3-0\">\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-4-3-1\">\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Says Korn/Ferry senior partner / Dennis Carey: / &quot;I can&#39;t think of / a single search / I&#39;ve done / where a board / has not instructed me / to look at sitting CEOs first.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-4-3-2\">\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>光辉国际高级合伙人说 / 丹尼斯·凯里：/ &quot;我想不出 / 任何一次搜寻 / 我做过的 / 其中董事会 / 没有指示我 / 首先看在职CEO。&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-4-3-3\">\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把说话人的职位和姓名合并：\u003c/p>\n\u003cblockquote>\n\u003cp>光辉国际高级合伙人丹尼斯·凯里说\u003c/p>\n\u003c/blockquote>\n\u003cp>把搜寻范围放在一起：\u003c/p>\n\u003cblockquote>\n\u003cp>在我做过的所有搜寻中\u003c/p>\n\u003c/blockquote>\n\u003cp>再合并想不出与否定例外：\u003c/p>\n\u003cblockquote>\n\u003cp>想不出哪一次董事会没有要求我先考虑在职CEO\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>光辉国际高级合伙人丹尼斯·凯里说\u003cbr>在我做过的所有搜寻中\u003cbr>想不出哪一次董事会没有要求我先考虑在职CEO\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-4-3-4\">\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>凯里说，他想不出一项例外。\u003c/p>\n\u003c/blockquote>\n\u003cp>先完整介绍说话人；引语中先限定所有做过的搜寻，再保留“想不出……没有……”的双层否定，说明每次均被要求优先看在职者。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>光辉国际高级合伙人丹尼斯·凯里说：“在我做过的搜寻里，我想不出任何一次董事会没有指示我首先看在职CEO。”\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-4-3-5\">\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cul>\n\u003cli>“首先看”在招聘语境中改为“首先考虑”，不是看外表。\u003c/li>\n\u003cli>“在我做过的所有搜寻中”与“有哪一次”搭配，使强调没有例外的语气完整。\u003c/li>\n\u003c/ul>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>光辉国际高级合伙人丹尼斯·凯里说：&quot;在我做过的所有搜寻中，我想不出有哪一次董事会没有指示我首先考虑在职CEO。&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","section":"第三鸟 · 题目复盘","level":1,"context":{"mode":"image","asset":"questions","label":"30题","focus":[250,2381,1800,490],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"section-cover","mergedIntro":true},"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"title":"30题 · 题干、题型与核心出处","raw":"## 30题\n\n**Which of the following is the best title for the text?**\n\n下面哪一个是本文最佳标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **CEOs: Where to Go?**\n\nCEO们：该去哪里？\n\nB. **CEOs: All the Way Up?**\n\nCEO们：一路高升？\n\nC. **Top Managers Jump without a Net**\n\n高层管理者没有安全网也敢跳\n\nD. **The Only Way Out for Top Performers**\n\n优秀高管唯一的出路\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | McGee没找好下家就公开离职，很快获得新机会 | 先摆出一个反常做法 |\n| 第2段 | 其他二号高管也为追求CEO职位而离开 | 再说这已经不是个例 |\n| 第3段 | 经济复苏可能让更多副手敢这样跳 | 接着补上环境变化的机会 |\n| 第4段 | 旧规则偏爱仍在任、需要被挖走的候选人 | 回头解释旧规矩原来怎样 |\n| 第5段 | 有人裸辞后很久才得到理想职位 | 再举一个例子说明有代价 |\n| 第6段 | 危机让空档更可接受，久留反而可能受伤 | 最后说旧规矩正在反过来 |","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"30题","focus":[250,2381,1800,490],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"question","question":30},"html":"\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一个是本文最佳标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>CEOs: Where to Go?\u003c/strong>\u003c/p>\n\u003cp>CEO们：该去哪里？\u003c/p>\n\u003cp>B. \u003cstrong>CEOs: All the Way Up?\u003c/strong>\u003c/p>\n\u003cp>CEO们：一路高升？\u003c/p>\n\u003cp>C. \u003cstrong>Top Managers Jump without a Net\u003c/strong>\u003c/p>\n\u003cp>高层管理者没有安全网也敢跳\u003c/p>\n\u003cp>D. \u003cstrong>The Only Way Out for Top Performers\u003c/strong>\u003c/p>\n\u003cp>优秀高管唯一的出路\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>McGee没找好下家就公开离职，很快获得新机会\u003c/td>\n\u003ctd>先摆出一个反常做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>其他二号高管也为追求CEO职位而离开\u003c/td>\n\u003ctd>再说这已经不是个例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>经济复苏可能让更多副手敢这样跳\u003c/td>\n\u003ctd>接着补上环境变化的机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>旧规则偏爱仍在任、需要被挖走的候选人\u003c/td>\n\u003ctd>回头解释旧规矩原来怎样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>有人裸辞后很久才得到理想职位\u003c/td>\n\u003ctd>再举一个例子说明有代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>危机让空档更可接受，久留反而可能受伤\u003c/td>\n\u003ctd>最后说旧规矩正在反过来\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"title":"A. CEOs: Where to Go?","raw":"**Which of the following is the best title for the text?**\n\n### A. CEOs: Where to Go?\n\nCEO们：该去哪里？","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"30题A选项","focus":[250,2475,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"main-option","question":30,"option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q30-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>CEO们：该去哪里？\u003c/p>\n\u003c/section>"},{"title":"A. CEOs: Where to Go?","raw":"#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\nCEO们：该去哪里？\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先以一位CEO反常离开熟悉岗位、重新寻找去处的故事，提出管理者该往哪里去的问题。 | 先摆出一个反常做法 |\n| 第2段 | 再写多位CEO也在重新选择行业和公司，说明去向困惑并非个例。 | 再说这已经不是个例 |\n| 第3段 | 补充经济复苏打开的新行业与新公司机会，为可能去向提供环境背景。 | 接着补上环境变化的机会 |\n| 第4段 | 回顾旧规则如何让CEO留在同类公司和熟悉行业，解释过去的去向限制。 | 回头解释旧规矩原来怎样 |\n| 第5段 | 举跨行业选择后长时间适应的例子，说明重新选择去处有代价。 | 再举一个例子说明有代价 |\n| 第6段 | 最后指出旧的去向限制正在松动，应以新的事业机会重新决定CEO往哪里去。 | 最后说旧规矩正在反过来 |\n\n`A`要求文章比较`CEO`的具体去处或去向选择。实际`McGee`等人中不少是副手，他们正在追求`CEO`职位；第3段谈复苏机会，第4段谈在职候选人，第5段谈等待，第6段谈离职污名，反复处理的是尚无下家是否离开，而非去哪一种公司更好。标题主体和提问重心都偏离共同动作。\n\n判断：\n\n**A 不保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"30题A选项","focus":[250,2475,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"main-hypothesis","question":30,"option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q30-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>CEO们：该去哪里？\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-A-1\">\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>CEO们：该去哪里？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先以一位CEO反常离开熟悉岗位、重新寻找去处的故事，提出管理者该往哪里去的问题。\u003c/td>\n\u003ctd>先摆出一个反常做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>再写多位CEO也在重新选择行业和公司，说明去向困惑并非个例。\u003c/td>\n\u003ctd>再说这已经不是个例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>补充经济复苏打开的新行业与新公司机会，为可能去向提供环境背景。\u003c/td>\n\u003ctd>接着补上环境变化的机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾旧规则如何让CEO留在同类公司和熟悉行业，解释过去的去向限制。\u003c/td>\n\u003ctd>回头解释旧规矩原来怎样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举跨行业选择后长时间适应的例子，说明重新选择去处有代价。\u003c/td>\n\u003ctd>再举一个例子说明有代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>最后指出旧的去向限制正在松动，应以新的事业机会重新决定CEO往哪里去。\u003c/td>\n\u003ctd>最后说旧规矩正在反过来\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>A\u003c/code>要求文章比较\u003ccode>CEO\u003c/code>的具体去处或去向选择。实际\u003ccode>McGee\u003c/code>等人中不少是副手，他们正在追求\u003ccode>CEO\u003c/code>职位；第3段谈复苏机会，第4段谈在职候选人，第5段谈等待，第6段谈离职污名，反复处理的是尚无下家是否离开，而非去哪一种公司更好。标题主体和提问重心都偏离共同动作。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"B. CEOs: All the Way Up?","raw":"**Which of the following is the best title for the text?**\n\n### B. CEOs: All the Way Up?\n\nCEO们：一路高升？","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"30题B选项","focus":[250,2557,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"main-option","question":30,"option":"B","cumulative":true,"cumulativeGroup":"question-30-option-B","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q30-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>CEO们：一路高升？\u003c/p>\n\u003c/section>"},{"title":"B. CEOs: All the Way Up?","raw":"#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\nCEO们：一路高升？\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 用一位CEO反常放弃现有级别的案例，提出职业生涯是否只能一路向上的疑问。 | 先摆出一个反常做法 |\n| 第2段 | 再写多位CEO也遇到暂时退让或职位下降，表明升迁并非总是线性的。 | 再说这已经不是个例 |\n| 第3段 | 补充经济变化带来的重新上升机会，说明短期下降后仍可能恢复职业发展。 | 接着补上环境变化的机会 |\n| 第4段 | 回顾旧规则如何把每一步升职视为成功标志，解释“一路向上”的传统期待。 | 回头解释旧规矩原来怎样 |\n| 第5段 | 举暂时退让后经历长期等待的CEO，说明非线性发展也有明显成本。 | 再举一个例子说明有代价 |\n| 第6段 | 最后指出旧的连续升迁标准正在改变，职业发展应允许阶段性停顿与重新选择。 | 最后说旧规矩正在反过来 |\n\n`B`的问号允许讨论升迁曲折，不能把它草率理解成保证所有人不断高升。即便如此，本文并未围绕`CEO`升降的完整历程组织材料：第4段的核心是在职与离职的招聘偏好，第6段的核心是留下与离开的安全判断。多个例子还不是`CEO`，而是争取第一把手职位的高管，因此`C`更准确地抓住统一动作和群体。\n\n判断：\n\n**B 不保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"30题B选项","focus":[250,2557,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"main-hypothesis","question":30,"option":"B","cumulative":true,"cumulativeGroup":"question-30-option-B","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q30-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>CEO们：一路高升？\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-B-1\">\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>CEO们：一路高升？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>用一位CEO反常放弃现有级别的案例，提出职业生涯是否只能一路向上的疑问。\u003c/td>\n\u003ctd>先摆出一个反常做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>再写多位CEO也遇到暂时退让或职位下降，表明升迁并非总是线性的。\u003c/td>\n\u003ctd>再说这已经不是个例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>补充经济变化带来的重新上升机会，说明短期下降后仍可能恢复职业发展。\u003c/td>\n\u003ctd>接着补上环境变化的机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾旧规则如何把每一步升职视为成功标志，解释“一路向上”的传统期待。\u003c/td>\n\u003ctd>回头解释旧规矩原来怎样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举暂时退让后经历长期等待的CEO，说明非线性发展也有明显成本。\u003c/td>\n\u003ctd>再举一个例子说明有代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>最后指出旧的连续升迁标准正在改变，职业发展应允许阶段性停顿与重新选择。\u003c/td>\n\u003ctd>最后说旧规矩正在反过来\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>B\u003c/code>的问号允许讨论升迁曲折，不能把它草率理解成保证所有人不断高升。即便如此，本文并未围绕\u003ccode>CEO\u003c/code>升降的完整历程组织材料：第4段的核心是在职与离职的招聘偏好，第6段的核心是留下与离开的安全判断。多个例子还不是\u003ccode>CEO\u003c/code>，而是争取第一把手职位的高管，因此\u003ccode>C\u003c/code>更准确地抓住统一动作和群体。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"C. Top Managers Jump without a Net","raw":"**Which of the following is the best title for the text?**\n\n### C. Top Managers Jump without a Net\n\n高层管理者没有安全网也敢跳","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"30题C选项","focus":[250,2639,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"main-option","question":30,"option":"C","cumulative":true,"cumulativeGroup":"question-30-option-C","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q30-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-C-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/section>"},{"title":"C. Top Managers Jump without a Net","raw":"#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n高层管理者没有安全网也敢跳\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 以McGee未落实下一职位就公开离职的反常做法，展示没有安全网的跳跃。 | 先摆出一个反常做法 |\n| 第2段 | 再举其他副手为争取CEO职位而离开的例子，说明这种职业选择已不止一人采用。 | 再说这已经不是个例 |\n| 第3段 | 指出经济复苏增加外部机会，使更多高管可能愿意在下家未定时离开。 | 接着补上环境变化的机会 |\n| 第4段 | 回顾旧招聘规则优先寻找在职者，解释这种主动离开为何原本非常规。 | 回头解释旧规矩原来怎样 |\n| 第5段 | 举先辞职者等待一年或三年才获新职位的例子，说明无安全网仍有风险。 | 再举一个例子说明有代价 |\n| 第6段 | 最后说明空档污名减弱、久留也可能受损，旧的留任安全规则正被重新评价。 | 最后说旧规矩正在反过来 |\n\n`C`同时写出人物范围`Top Managers`和共同动作`Jump without a Net`。它能容纳`McGee`的快速成功，也容纳第5段等待一年或三年的代价：没有安全网并不等于一定失败或成功。旧招聘规则与危机后的新判断，正是解释这种新做法为何出现及如何看待的背景。\n\n判断：\n\n**C 保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"30题C选项","focus":[250,2639,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"main-hypothesis","question":30,"option":"C","cumulative":true,"cumulativeGroup":"question-30-option-C","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q30-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-C-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-C-1\">\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>高层管理者没有安全网也敢跳\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以McGee未落实下一职位就公开离职的反常做法，展示没有安全网的跳跃。\u003c/td>\n\u003ctd>先摆出一个反常做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>再举其他副手为争取CEO职位而离开的例子，说明这种职业选择已不止一人采用。\u003c/td>\n\u003ctd>再说这已经不是个例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出经济复苏增加外部机会，使更多高管可能愿意在下家未定时离开。\u003c/td>\n\u003ctd>接着补上环境变化的机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾旧招聘规则优先寻找在职者，解释这种主动离开为何原本非常规。\u003c/td>\n\u003ctd>回头解释旧规矩原来怎样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举先辞职者等待一年或三年才获新职位的例子，说明无安全网仍有风险。\u003c/td>\n\u003ctd>再举一个例子说明有代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>最后说明空档污名减弱、久留也可能受损，旧的留任安全规则正被重新评价。\u003c/td>\n\u003ctd>最后说旧规矩正在反过来\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>C\u003c/code>同时写出人物范围\u003ccode>Top Managers\u003c/code>和共同动作\u003ccode>Jump without a Net\u003c/code>。它能容纳\u003ccode>McGee\u003c/code>的快速成功，也容纳第5段等待一年或三年的代价：没有安全网并不等于一定失败或成功。旧招聘规则与危机后的新判断，正是解释这种新做法为何出现及如何看待的背景。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"D. The Only Way Out for Top Performers","raw":"**Which of the following is the best title for the text?**\n\n### D. The Only Way Out for Top Performers\n\n优秀高管唯一的出路","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"30题D选项","focus":[250,2722,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"main-option","question":30,"option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q30-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>优秀高管唯一的出路\u003c/p>\n\u003c/section>"},{"title":"D. The Only Way Out for Top Performers","raw":"#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n优秀高管唯一的出路\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 以优秀高管反常放弃现职的个案，提出主动离开已成为唯一可行出路的判断。 | 先摆出一个反常做法 |\n| 第2段 | 再写多位优秀高管都因内部通道封闭而只能向外走，说明个案具有普遍性。 | 再说这已经不是个例 |\n| 第3段 | 说明外部环境打开新机会而内部道路仍然堵死，使离开成为唯一能利用机会的方式。 | 接着补上环境变化的机会 |\n| 第4段 | 回顾旧规则曾允许优秀人才留任等待晋升，解释旧选择如何构成过去的多条路径。 | 回头解释旧规矩原来怎样 |\n| 第5段 | 举唯一出路仍需漫长等待的例子，说明必须离开不代表离开没有代价。 | 再举一个例子说明有代价 |\n| 第6段 | 最后指出旧的内部留任路径彻底失效，优秀高管只能接受主动离开这条路。 | 最后说旧规矩正在反过来 |\n\n`D`中的`Only`必须得到“其他路都走不通”的证据。原文却用`may be more willing`描述部分人的可能选择，第5段专门提醒等待成本；结尾说传统安全判断改变，也没有宣布所有优秀高管必须离开。`D`把一种逐渐可接受的策略扩大成唯一出路，程度超出全文。\n\n判断：\n\n**D 不保留。**","section":"第三鸟 · 题目复盘","level":4,"context":{"mode":"image","asset":"questions","label":"30题D选项","focus":[250,2722,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"main-hypothesis","question":30,"option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","partIndex":1,"cumulativeFinal":true},"focusId":"focus-q30-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>Which of the following is the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>优秀高管唯一的出路\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-D-1\">\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>优秀高管唯一的出路\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以优秀高管反常放弃现职的个案，提出主动离开已成为唯一可行出路的判断。\u003c/td>\n\u003ctd>先摆出一个反常做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>再写多位优秀高管都因内部通道封闭而只能向外走，说明个案具有普遍性。\u003c/td>\n\u003ctd>再说这已经不是个例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明外部环境打开新机会而内部道路仍然堵死，使离开成为唯一能利用机会的方式。\u003c/td>\n\u003ctd>接着补上环境变化的机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾旧规则曾允许优秀人才留任等待晋升，解释旧选择如何构成过去的多条路径。\u003c/td>\n\u003ctd>回头解释旧规矩原来怎样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>举唯一出路仍需漫长等待的例子，说明必须离开不代表离开没有代价。\u003c/td>\n\u003ctd>再举一个例子说明有代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>最后指出旧的内部留任路径彻底失效，优秀高管只能接受主动离开这条路。\u003c/td>\n\u003ctd>最后说旧规矩正在反过来\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>D\u003c/code>中的\u003ccode>Only\u003c/code>必须得到“其他路都走不通”的证据。原文却用\u003ccode>may be more willing\u003c/code>描述部分人的可能选择，第5段专门提醒等待成本；结尾说传统安全判断改变，也没有宣布所有优秀高管必须离开。\u003ccode>D\u003c/code>把一种逐渐可接受的策略扩大成唯一出路，程度超出全文。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"30题结论","raw":"### 30题结论\n\n**30. C. Top Managers Jump without a Net**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Top Managers Jump without a Net / 高层管理者没有安全网也敢跳**","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"30题结论","focus":[250,2381,1800,490],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"conclusion","question":30},"html":"\u003cp>\u003cstrong>30. C. Top Managers Jump without a Net\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Top Managers Jump without a Net / 高层管理者没有安全网也敢跳\u003c/strong>\u003c/p>\n"},{"title":"26题 · 题干、题型与核心出处","raw":"## 26题\n\n> When McGee announced his departure, his manner can best be described as being ______.  \n> McGee宣布离职时，他的方式最适合被描述为怎样？\n\n### 题型\n\n人物表达态度题。题干限定`announced his departure`，问的是对外表达方式，不是离职决定是否稳妥。第1段用`Rather than`把通常含糊掩饰的借口与`McGee`直接说出管理公司目标作对比，接着强调向外界公开了雄心。\n\n### 核心出处\n\n> When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving \"to pursue my goal of running a company.\" Broadcasting his ambition was \"very much my decision,\" McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\n\n先点出他宣布离职时的不同，再列出所说的明确目标，随后用`broadcasting his ambition`概括公开程度，最后交代他很快获得`CEO`职位。新职位是后续结果，不决定宣布时是否傲慢或冲动。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"26题","focus":[250,243,1800,510],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"question","question":26},"html":"\u003cblockquote>\n\u003cp>When McGee announced his departure, his manner can best be described as being ______.\u003cbr>McGee宣布离职时，他的方式最适合被描述为怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物表达态度题。题干限定\u003ccode>announced his departure\u003c/code>，问的是对外表达方式，不是离职决定是否稳妥。第1段用\u003ccode>Rather than\u003c/code>把通常含糊掩饰的借口与\u003ccode>McGee\u003c/code>直接说出管理公司目标作对比，接着强调向外界公开了雄心。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot; Broadcasting his ambition was &quot;very much my decision,&quot; McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\u003c/p>\n\u003c/blockquote>\n\u003cp>先点出他宣布离职时的不同，再列出所说的明确目标，随后用\u003ccode>broadcasting his ambition\u003c/code>概括公开程度，最后交代他很快获得\u003ccode>CEO\u003c/code>职位。新职位是后续结果，不决定宣布时是否傲慢或冲动。\u003c/p>\n"},{"title":"A. arrogant","raw":"### A. arrogant\n\n> 傲慢的\n\n**做题模式中的状态：**第一轮`A`排除。当时的判断依据是：“`A`把内容里的野心变成态度里的傲慢。原文没有给出这种负面姿态，因此排除”。\n\n**错误类型：第三类——无中生有。**\n\n`A`的`arrogant`表示傲慢，需要轻视别人或过分自负的表达。原文说他公开自己的`ambition`，说明目标清晰且不遮掩，并未写他贬低他人或夸口必然成功。\n\n`A`借用了`ambition`带来的强烈印象，额外加入原文未展示的轻慢态度。\n\n**命题人借用的原文材料：**\n\n> When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving \"to pursue my goal of running a company.\" Broadcasting his ambition was \"very much my decision,\" McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"26题A选项","focus":[250,419,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"option","question":26,"option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q26-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>傲慢的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“\u003ccode>A\u003c/code>把内容里的野心变成态度里的傲慢。原文没有给出这种负面姿态，因此排除”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>arrogant\u003c/code>表示傲慢，需要轻视别人或过分自负的表达。原文说他公开自己的\u003ccode>ambition\u003c/code>，说明目标清晰且不遮掩，并未写他贬低他人或夸口必然成功。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>借用了\u003ccode>ambition\u003c/code>带来的强烈印象，额外加入原文未展示的轻慢态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot; Broadcasting his ambition was &quot;very much my decision,&quot; McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"title":"A. arrogant","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> McGee宣布离职时，他的表达方式是傲慢的。\n\n题干限定`announced his departure`，问的是对外表达方式，不是离职决定是否稳妥。第1段用`Rather tha 选择公开追求新目标，不能单独给性格下结论；本题的表达态度仍须由没有掩饰、直接说出目标的对照判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>self-centered\u003cbr>以自我为中心的\u003c/p>\n\u003c/blockquote>\n\u003cp>全文关注高管离职策略及招聘规则的变化，并未以道德评判为中心。\u003ccode>C\u003c/code>把职业目标变成自私动机，既不能解释开头强调表达直接的用意，也缺少忽略他人的事实依据。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"D. impulsive","raw":"### D. impulsive\n\n> 冲动的\n\n**做题模式中的状态：**第一轮`D`排除。当时的判断依据是：“`D`需要原文写他仓促、后悔或未经考虑；段落没有这些信息，反而强调这是他的决定”。\n\n**错误类型：第一类——歪曲原意。**\n\n`D`的`impulsive`表示没有充分思考就贸然行动。原文给出清楚的职业目标，且题干问宣布方式，不是问先辞职是否风险较大。\n\n`D`把有风险的职业选择换成缺少思考的心理状态，还偏离了宣布时的表达方式。\n\n**命题人借用的原文材料：**\n\n> When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up. Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving \"to pursue my goal of running a company.\" Broadcasting his ambition was \"very much my decision,\" McGee says. Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"26题D选项","focus":[250,667,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"option","question":26,"option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q26-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-D-0\">\u003cblockquote>\n\u003cp>冲动的\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>排除。当时的判断依据是：“\u003ccode>D\u003c/code>需要原文写他仓促、后悔或未经考虑；段落没有这些信息，反而强调这是他的决定”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>impulsive\u003c/code>表示没有充分思考就贸然行动。原文给出清楚的职业目标，且题干问宣布方式，不是问先辞职是否风险较大。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code> 达态度仍须由没有掩饰、直接说出目标的对照判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>impulsive\u003cbr>冲动的\u003c/p>\n\u003c/blockquote>\n\u003cp>没有安全网的跳跃是全文讨论的职业风险，并非对所有离职者冲动性格的判断。\u003ccode>D\u003c/code>把策略风险等同于心理冲动，原文的\u003ccode>goal\u003c/code>与\u003ccode>reflect\u003c/code>恰要求把两者分开。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"26题结论","raw":"### 26题结论\n\n> **26. B. frank**\n\n`A`借用了`ambition`带来的强烈印象，额外加入原文未展示的轻慢态度。\n\n`B`准确概括了“未掩饰真实目标，而是公开说出”的表达方式。\n\n`C`把“说明自己的职业目标”加重为“只考虑自己的需要”，新增了价值评价。\n\n`D`把有风险的职业选择换成缺少思考的心理状态，还偏离了宣布时的表达方式。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"26题","focus":[250,243,1800,510],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"conclusion","question":26},"html":"\u003cblockquote>\n\u003cp>\u003cstrong>26. B. frank\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>借用了\u003ccode>ambition\u003c/code>带来的强烈印象，额外加入原文未展示的轻慢态度。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>准确概括了“未掩饰真实目标，而是公开说出”的表达方式。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>把“说明自己的职业目标”加重为“只考虑自己的需要”，新增了价值评价。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把有风险的职业选择换成缺少思考的心理状态，还偏离了宣布时的表达方式。\u003c/p>\n"},{"title":"27题 · 题干、题型与核心出处","raw":"## 27题\n\n> According to Paragraph 2, senior executives’ quitting may be spurred by ______.  \n> 根据第2段，高管离职可能受到什么推动？\n\n### 题型\n\n离职动因细节题。第2段依次写`McGee`思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求`CEO`职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\n\n### 核心出处\n\n> McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn't alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don't get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\n\n从一个人的新目标扩展到其他副手追求第一把手职位，再解释继任审查为何促使未获认可者离开。段末提醒含糊说法可能损害声誉，是沟通风险，不能当作前面各人的离职动机。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"27题","focus":[250,820,1800,510],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"question","question":27},"html":"\u003cblockquote>\n\u003cp>According to Paragraph 2, senior executives’ quitting may be spurred by ______.\u003cbr>根据第2段，高管离职可能受到什么推动？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>离职动因细节题。第2段依次写\u003ccode>McGee\u003c/code>思考要经营什么公司、辞职向招聘者传递抱负、其他副手寻求\u003ccode>CEO\u003c/code>职位，以及未获接班认可的高管可能离开。这些信息共同指向职业目标和发展机会，未把金钱或私生活设成原因。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run. It also sent a clear message to the outside world about his aspirations. And McGee isn&#39;t alone. In recent weeks the No.2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post. As boards scrutinize succession plans in response to shareholder pressure, executives who don&#39;t get the nod also may wish to move on. A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.\u003c/p>\n\u003c/blockquote>\n\u003cp>从一个人的新目标扩展到其他副手追求第一把手职位，再解释继任审查为何促使未获认可者离开。段末提醒含糊说法可能损害声誉，是沟通风险，不能当作前面各人的离职动机。\u003c/p>\n"},{"title":"A. their expectation of better financial status","raw":"### A. their expectation of better financial status\n\n> 期待更好的经济地位\n\n**做题模式中的状态：**第一轮`A`排除。当时的判断依据是：“`A`把职业角色换成财务结果。要成立，文中至少要出现薪酬、收入或经济待遇，段落没有”。\n\n**错误类型：第三类——无中生有。**\n\n`A`提出更好的经济地位。原文`CEO position`是职位目标，`running a company`是工作内容，均未说明他们希望增加薪酬或个人财富。\n\n`A`将职业地位的追求换成金钱追求，并把未写出的经济收益设为推动力。\n\n**命题人借用的原文材料：**\n\n> McGee says leaving without a position lined up gave him time e rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: \"I can't think of a single search I've done where a board has not instructed me to look at sitting CEOs first.\"\n\n先说先辞职后找下一份工作非常规，再回顾旧时候选人通常从在职者中被挖走，最后由猎头的搜索经验作证。后一句不是新话题，而是解释没有求职的人怎样成为候选人。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"28题","focus":[250,1395,1800,488],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"question","question":28},"html":"\u003cblockquote>\n\u003cp>The word “poached” (Line 3, Paragraph 4) most probably means ______.\u003cbr>第4段第3行的poached最可能是什么意思？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>语境词义题。目标词位于\u003ccode>For years\u003c/code>所引出的旧招聘惯例：最有吸引力的\u003ccode>CEO\u003c/code>候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职\u003ccode>CEO\u003c/code>，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>先说先辞职后找下一份工作非常规，再回顾旧时候选人通常从在职者中被挖走，最后由猎头的搜索经验作证。后一句不是新话题，而是解释没有求职的人怎样成为候选人。\u003c/p>\n"},{"title":"A. approved of","raw":"### A. approved of\n\n> 被赞同、获认可\n\n**做题模式中的状态：**第一轮`A`排除。当时的判断依据是：“`A`缺少“挖走、招来”的移动和招聘含义，无法接住整个场景”。\n\n**错误类型：第一类——歪曲原意。**\n\n`A`的`approved of`是赞同或认可，不能交代一个仍在任的人怎样被招揽进入候选名单。`must be poached`的被动结构需要外部招聘者主动寻找、争取这些人。\n\n`A`把招揽过程弱化为态度上的认可，遗漏从现有岗位寻找人才这一关系。\n\n**命题人借用的原文材料：**\n\n> The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: \"I can't think of a single search I've done where a board has not instructed me to look at sitting CEOs first.\"","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"28题A选项","focus":[250,1488,1800,85],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"option","question":28,"option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","partIndex":0,"cumulativeFinal":false},"focusId":"focus-q28-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q28-A-0\">\u003cblockquote>\n\u003cp>被赞同、获认可\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>排除。当时的判断依据是：“\u003ccode>A\u003c/code>缺少“挖走、招来”的移动和招聘含义，无法接住整个场景”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>approved of\u003c/code>是赞同或认可，不能交代一个仍在任的人怎样被招揽进入候选名单。\u003ccode>must be poached\u003c/code>的被动结构需要外部招聘者主动寻找、争取这些人。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把招揽过程弱化为态度上的认可，遗漏从现有岗位寻找人才这一关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"title":"A. approved of","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第4段中的poached最可能表示被赞同、获认可。\n\n目标词位于`For years`所引出的旧招聘惯例：最有吸引力的`CEO`候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职`CEO`，为这个被动动作提供主动招揽的招聘语境。\n\n`A`的`approved of`是赞同或认可，不能交代一个仍在任的人怎样被招揽进入候选名单。`must be poached`的被动结构需要外部招聘者主动寻找、争取这些人。\n\n猎头得到的指示是先考虑在职`CEO`，体现主动物色；认为候选人优秀是前提，但并不等同于`poached`这个招募动作。\n\n`A`把招揽过程弱化为态度上的认可，遗漏从现有岗位寻找人才这一关系。","sectio 3c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q28-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第4段中的poached最可能表示被赞同、获认可。\u003c/p>\n\u003c/blockquote>\n\u003cp>目标词位于\u003ccode>For years\u003c/code>所引出的旧招聘惯例：最有吸引力的\u003ccode>CEO\u003c/code>候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职\u003ccode>CEO\u003c/code>，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>approved of\u003c/code>是赞同或认可，不能交代一个仍在任的人怎样被招揽进入候选名单。\u003ccode>must be poached\u003c/code>的被动结构需要外部招聘者主动寻找、争取这些人。\u003c/p>\n\u003cp>猎头得到的指示是先考虑在职\u003ccode>CEO\u003c/code>，体现主动物色；认为候选人优秀是前提，但并不等同于\u003ccode>poached\u003c/code>这个招募动作。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>把招揽过程弱化为态度上的认可，遗漏从现有岗位寻找人才这一关系。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q28-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003cp>目标词位于For years所引出的旧招聘惯例：最有吸引力的CEO候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职CEO，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003c/blockquote>\n\u003cp>先说先辞职后找下一份工作非常规，再回顾旧时候选人通常从在职者中被挖走，最后由猎头的搜索经验作证。后一句不是新话题，而是解释没有求职的人怎样成为候选人。\u003c/ q28-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第4段中的poached最可能表示被防范。\u003c/p>\n\u003c/blockquote>\n\u003cp>目标词位于\u003ccode>For years\u003c/code>所引出的旧招聘惯例：最有吸引力的\u003ccode>CEO\u003c/code>候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职\u003ccode>CEO\u003c/code>，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>guarded against\u003c/code>是被防范，意味着候选人构成需要避开的风险。原文却称他们\u003ccode>the most attractive\u003c/code>，并说明董事会优先考虑在职\u003ccode>CEO\u003c/code>。\u003c/p>\n\u003cp>被吸引、主动搜索和优先考虑都指向争取这些人，不是对他们保持防范。不能因为后文谈董事会谨慎，就把谨慎的范围改成排斥候选人。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把招聘者争取人选的方向反写成防备人选。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q28-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003cp>目标词位于For years所引出的旧招聘惯例：最有吸引力的CEO候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职CEO，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003c/blockquote>\n\u003cp>先说先辞职后找下一份工作非常规，再回顾旧时候选人通常从在职者中被挖走，最后由猎头的搜索经验作证。后一句不是新话题，而是解释没有求职的人怎样成为候选人。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Boards guarded against the most attractive sitting CEOs instead of seeking them out.\u003c/p>\n\u003cp>董事会防范这些最有吸引力的在职CEO，而不是主动物色他们。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>D\u003c/code>成立，后文应说明为何排除在职\u003ccode>CEO\u003c/code>。实际猎头说被要求先考虑的恰恰是他们；假设与后句明确的优先名单方向相反。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q28-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讨论主动离职的新做法，必然需要交代旧惯例：招聘方优先在仍有职位的管理者中寻找人选。主旨能判断动作与招聘有关，具体近义词仍要由must be poached与look at sitting CEOs first之间的关系确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>guarded against\u003cbr>被防范\u003c/p>\n\u003c/blockquote>\n\u003cp>旧规则把有现职看成竞争优势，\u003ccode>D\u003c/code>却把这类人设为防范对象，会使先辞职反而更符合旧偏好。它反转了全文新旧规则对照的基础，也违反\u003ccode>most attractive\u003c/code>这一局部评价。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"title":"28题结论","raw":"### 28题结论\n\n> **28. C. hunted for**\n\n`A`把招揽过程弱化为态度上的认可，遗漏从现有岗位寻找人才这一关系。\n\n`B`引入了与招聘无关的照料关系，找不到能接入上下文的完整命题。\n\n`C`保留被动招揽关系与招聘语境，能够连上前后句。\n\n`D`把招聘者争取人选的方向反写成防备人选。","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"28题","focus":[250,1395,1800,488],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"conclusion","question":28},"html":"\u003cblockquote>\n\u003cp>\u003cstrong>28. C. hunted for\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>把招揽过程弱化为态度上的认可，遗漏从现有岗位寻找人才这一关系。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>引入了与招聘无关的照料关系，找不到能接入上下文的完整命题。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>保留被动招揽关系与招聘语境，能够连上前后句。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把招聘者争取人选的方向反写成防备人选。\u003c/p>\n"},{"title":"29题 · 题干、题型与核心出处","raw":"## 29题\n\n> It can be inferred from the last paragraph that ______.  \n> 从最后一段可以推断出什么？\n\n### 题型\n\n末段推断题。末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\n\n### 核心出处\n\n> Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. \"The traditional rule was it's safer to stay where you are, but that's been fundamentally inverted,\" says one headhunter. \"The people who've been hurt the worst are those who've stayed too long.\"\n\n先承认两份工作之间空档的旧污名在减弱，再用金融危机解释为何离开困境公司现在可被接受，接着明确新旧安全判断倒转，最后以留太久者受损作证。","section":"第三鸟 · 题目复盘","level":2,"context":{"mode":"image","asset":"questions","label":"29题","focus":[250,1888,1800,488],"sourceW":2256,"sourceH":3142},"meta":{"bird":3,"kind":"question","question":29},"html":"\u003cblockquote>\n\u003cp>It can be inferred from the last paragraph that ______.\u003cbr>从最后一段可以推断出什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>末段推断题。末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>先承认两份工作之间空档的旧污名在减弱，再用金融危机解释为何离开困境公司现在可被接受，接着明确新旧安全判断倒转，最后以留太久者受损作证。\u003c/p>\n"},{"title":"A. top performers used to cling to their posts","raw":"### A. top performers used to cling to their posts\n\n> 优秀高管过去常常抓住现职不放\n\n**做题模式中的状态：**第一轮`A`保留。当时`cling`被遮挡，但`used to`、`posts`及末段的`stay`仍可对齐，先保留“过去与职位有关的做法”。`B`也保留；确定全文讨论职业选择规则变化后，用过去的留任与现在的离开相对照，选择`A`，排除把行为变化上升为忠诚价值过时的`B`。\n\n**选项类型：正确局部推断。**\n\n`A`的`used to`把判断限定在过去，`cling to their posts`指抓住现职不放。原文`traditional rule`所说留任较安全，解释了优秀高管过去倾向不轻易离开。\n\n`A`准确回推被新趋势挑战的过去做法，保留时间方向。\n\n**出处：**\n\n> Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. \"The traditional rule was it's safer to stay where you are, but that's been fundamentally inverted,\" says one headhunter. \"The people who've been hurt the worst are those who've stayed too long.\"","section":"第三鸟 · 题目复盘","level":3,"context":{"mode":"image","asset":"questions","label":"29题A选项","focus":[250,1981,1800,85 出比较。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把文中被推翻的旧判断，当作作者对当前处境的结论。\u003c/p>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此这里依据本篇阅读的主题与论证关系，扩写、改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：麦吉的直率离职**（段落1核心事件） 麦吉离职的特点：出人意料地直率（没有用模糊借口）→ 明确目标：\"追求管理一家公司\" → 快速成功：两周内与哈特福德会谈，9月29日成为CEO\n\n↓（更广泛的现象）\n\n**逻辑层次2：高管离职新趋势**（段落2现象分析） 麦吉的收获：【时间思考想管理什么公司 + 向外界传达清晰信息】→ 不是个例：雅芳和美国运通二号高管也为寻找CEO职位而离职 → 原因：【董事会审查继任计划 + 高管不想让模糊声明损害声誉】\n\n↓（经济背景）\n\n**逻辑层次3：经济复苏带来的机遇**（段落3时机分析） 经济复苏初现 → 副总裁们更愿意\"无网跳跃\" // 但第三季度CEO更替率下降23%（董事会谨慎）→ 未来预期：经济回升将带来大量机会\n\n↓（传统观念）\n\n**逻辑层次4：传统招聘理念**（段落4传统vs现实） 非传统做法：辞职找更好工作 → 传统规则：【最有吸引力的候选人必须被挖走 + 猎头被指示首先考虑在职CEO】\n\n↓（现实挑战）\n\n**逻辑层次5：跳槽的实际困难**（段落5案例分析） 快速找到高位并不容易：【艾伦·马拉姆：一年后才成为小公司负责人 + 罗伯特·威勒姆斯塔德：三年后才获得CEO职位】\n\n↓（观念转变）\n\n**逻辑层次6：新的职业观念**（段落6观念革新） 旧耻辱感消退：金融危机使工作空档期更可接受 → 规则颠倒：【传统：\"留在原地更安全\" // 现在：\"待太久的人受伤最重\"】\n\n↑（全文主旨）\n\n全文核心观点：在经济环境变化和职业观念转变的背景下，高管们开始采取更直接、更冒险的方式追求职业目标，虽然\"无网跳跃\"存在风险，但传统的\"安全\"策略可能反而带来更大的职业损失。\n\n### 小标题题\n\n**训练用改编文本，不是外刊原文。**\n\nChoose the most suitable heading from the list A–G for each paragraph. There are two extra headings.\n\nA. Reconsidering the safety of staying put\n\nB. A move from individual ambition to a wider pattern\n\nC. Guaranteed promotion after resignation\n\nD. The waiting costs of leaving before the next offer\n\nE. Making a career goal public before securing the next job\n\nF. Character flaws behind executive departures\n\nG. New opportunities against an old recruitment preference\n\n#### 41. ______\n\nA senior executive who leaves a prestigious position normally has reasons to keep the explanation vague. A private disagreement can be disguised as a wish for more time, and an uncertain future need not be advertised. An executive who instead announces a desire to run a company makes a different choice. Recruiters can hear the ambition, but they can also see that the next position has not yet been secured. The announcement therefore combines openness about a goal with exposure to a risk. Its significance lies neither in a promise of success nor in a judgment about the executive’s character, but in making a career intention visible before the destination is certain.\n\n#### 42. ______\n\nSuch an announcement becomes more important when other ambitious deputies make similar moves. Some have waited for a chief executive’s position that may never become available inside their current company. Others discover, during a review of succession plans, that the board prefers someone else. Leaving can then communicate a willingness to pursue a different opportunity. The common element is not necessarily a quarrel with the board or a demand for higher pay. It is the wish to obtain a kind of responsibility the present role does not offer. Several individual departures can therefore reveal a pattern of career decisions rather than a collection of unrelated personal incidents.\n\n#### 43. ______\n\nA recovering economy may make this pattern easier to sustain by creating more openings for aspiring leaders. Yet the new opportunities meet an older recruitment preference. Boards have often instructed headhunters to consider executives who are still securely employed, treating a current post as evidence of desirability. A candidate who resigns first loses that visible protection. The issue is therefore not simply whether more jobs will exist. It is whether an expanding market will make recruiters more willing to consider capable people between positions. New openings create a reason to take the risk, while the inherited preference explains why it remains a risk at all.\n\n#### 44. ______\n\nThe risk is visible in executives who leave before another appointment is ready and then wait much longer than expected. A capable manager may spend a year outside a desired position; another may need several years to obtain the role originally sought. These intervals do not by themselves prove that leaving was a mistake. They do show that competence and ambition cannot determine the timetable of a suitable vacancy. A company must need the candidate at the right moment, and its board must agree. The gap between deciding to move and receiving an acceptable offer is a real cost that a story of rapid success can easily hide.\n\n#### 45. ______\n\nWaiting costs should be compared with the costs of remaining, not with an imaginary world free of risk. A company in serious difficulty may offer a familiar title while narrowing an executive’s future choices. In such circumstances, staying can damage a career more than an honest period between jobs. Recruiters may also become less inclined to treat every gap as a sign of failure. None of this makes resignation the only sensible response to uncertainty. It does remove the assumption that keeping the present post is automatically the safer course. A sound decision now requires examining both sides of the choice rather than obeying an inherited rule.","section":"第四鸟 · 新题型","level":1,"context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"bird":4,"kind":"newtype-intro","status":"ready"},"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此这里依据本篇阅读的主题与论证关系，扩写、改编成小标题题和排序题供大家练习。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：麦吉的直率离职\u003c/strong>（段落1核心事件） 麦吉离职的特点：出人意料地直率（没有用模糊借口）→ 明确目标：&quot;追求管理一家公司&quot; → 快速成功：两周内与哈特福德会谈，9月29日成为CEO\u003c/p>\n\u003cp>↓（更广泛的现象）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：高管离职新趋势\u003c/strong>（段落2现象分析） 麦吉的收获：【时间思考想管理什么公司 + 向外界传达清晰信息】→ 不是个例：雅芳和美国运通二号高管也为寻找CEO职位而离职 → 原因：【董事会审查继任计划 + 高管不想让模糊声明损害声誉】\u003c/p>\n\u003cp>↓（经济背景）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：经济复苏带来的机遇\u003c/strong>（段落3时机分析） 经济复
