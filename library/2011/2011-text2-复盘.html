\u003ccode>CEO\u003c/code>，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>guarded against\u003c/code>是被防范，意味着候选人构成需要避开的风险。原文却称他们\u003ccode>the most attractive\u003c/code>，并说明董事会优先考虑在职\u003ccode>CEO\u003c/code>。\u003c/p>\n\u003cp>被吸引、主动搜索和优先考虑都指向争取这些人，不是对他们保持防范。不能因为后文谈董事会谨慎，就把谨慎的范围改成排斥候选人。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把招聘者争取人选的方向反写成防备人选。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The decision to quit a senior position to look for a better one is unconventional. For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached. Says Korn/Ferry senior partner Dennis Carey: &quot;I can&#39;t think of a single search I&#39;ve done where a board has not instructed me to look at sitting CEOs first.&quot;\u003c/p>\n\u003cp>目标词位于For years所引出的旧招聘惯例：最有吸引力的CEO候选人是必须从现有岗位挖来的人。后面的猎头说董事会要求先考虑在职CEO，为这个被动动作提供主动招揽的招聘语境。\u003c/p>\n\u003c/blockquote>\n\u003cp>先说先辞职后找下一份工作非常规，再回顾旧时候选人通常从在职者中被挖走，最后由猎头的搜索经验作证。后一句不是新话题，而是解释没有求职的人怎样成为候选人。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Boards guarded against the most attractive sitting CEOs instead of seeking them out.\u003c/p>\n\u003cp>董事会防范这些最有吸引力的在职CEO，而不是主动物色他们。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>D\u003c/code>成立，后文应说明为何排除在职\u003ccode>CEO\u003c/code>。实际猎头说被要求先考虑的恰恰是他们；假设与后句明确的优先名单方向相反。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讨论主动离职的新做法，必然需要交代旧惯例：招聘方优先在仍有职位的管理者中寻找人选。主旨能判断动作与招聘有关，具体近义词仍要由must be poached与look at sitting CEOs first之间的关系确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>guarded against\u003cbr>被防范\u003c/p>\n\u003c/blockquote>\n\u003cp>旧规则把有现职看成竞争优势，\u003ccode>D\u003c/code>却把这类人设为防范对象，会使先辞职反而更符合旧偏好。它反转了全文新旧规则对照的基础，也违反\u003ccode>most attractive\u003c/code>这一局部评价。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>28题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>28. C. hunted for\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>把招揽过程弱化为态度上的认可，遗漏从现有岗位寻找人才这一关系。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>引入了与招聘无关的照料关系，找不到能接入上下文的完整命题。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>保留被动招揽关系与招聘语境，能够连上前后句。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把招聘者争取人选的方向反写成防备人选。\u003c/p>\n\u003ch2>29题\u003c/h2>\n\u003cblockquote>\n\u003cp>It can be inferred from the last paragraph that ______.\u003cbr>从最后一段可以推断出什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>末段推断题。末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>先承认两份工作之间空档的旧污名在减弱，再用金融危机解释为何离开困境公司现在可被接受，接着明确新旧安全判断倒转，最后以留太久者受损作证。\u003c/p>\n\u003ch3>A. top performers used to cling to their posts\u003c/h3>\n\u003cblockquote>\n\u003cp>优秀高管过去常常抓住现职不放\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>A\u003c/code>保留。当时\u003ccode>cling\u003c/code>被遮挡，但\u003ccode>used to\u003c/code>、\u003ccode>posts\u003c/code>及末段的\u003ccode>stay\u003c/code>仍可对齐，先保留“过去与职位有关的做法”。\u003ccode>B\u003c/code>也保留；确定全文讨论职业选择规则变化后，用过去的留任与现在的离开相对照，选择\u003ccode>A\u003c/code>，排除把行为变化上升为忠诚价值过时的\u003ccode>B\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>used to\u003c/code>把判断限定在过去，\u003ccode>cling to their posts\u003c/code>指抓住现职不放。原文\u003ccode>traditional rule\u003c/code>所说留任较安全，解释了优秀高管过去倾向不轻易离开。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>准确回推被新趋势挑战的过去做法，保留时间方向。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据最后一段可以推断，优秀高管过去常常抓住现职不放。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>used to\u003c/code>把判断限定在过去，\u003ccode>cling to their posts\u003c/code>指抓住现职不放。原文\u003ccode>traditional rule\u003c/code>所说留任较安全，解释了优秀高管过去倾向不轻易离开。\u003c/p>\n\u003cp>最后的\u003ccode>stayed too long\u003c/code>提供有人实际长期留任而受损的结果。由旧观念与旧行为可作局部推断，但不能把\u003ccode>used to\u003c/code>删掉，变成现在一律仍应留任。\u003c/p>\n\u003cp>\u003ccode>A\u003c/code>准确回推被新趋势挑战的过去做法，保留时间方向。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003cp>末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\u003c/p>\n\u003c/blockquote>\n\u003cp>先承认两份工作之间空档的旧污名在减弱，再用金融危机解释为何离开困境公司现在可被接受，接着明确新旧安全判断倒转，最后以留太久者受损作证。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Top performers used to hold on to their posts because staying was traditionally considered safer.\u003c/p>\n\u003cp>优秀高管过去常抓住现职，因为传统观念认为留下更安全。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>要求作者先交代过去的留任倾向，再说明这套策略如今为何受到冲击。原文由\u003ccode>traditional rule\u003c/code>转到\u003ccode>inverted\u003c/code>，再指出留太久者受损，正好构成从旧做法到新判断的变化。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是优秀管理者敢于在下一职位未定时离开，末段以传统留任策略受到挑战来收束。本题可推知旧惯例曾使人抓住现职；至于忠诚价值或声誉重视程度，并不由这种策略变化自动推出。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>top performers used to cling to their posts\u003cbr>优秀高管过去常常抓住现职不放\u003c/p>\n\u003c/blockquote>\n\u003cp>“没有安全网也敢跳”相对于过去更愿抓住现职才显得新。\u003ccode>A\u003c/code>说的是这种旧做法，因而与全文趋势不矛盾；局部\u003ccode>used to\u003c/code>和\u003ccode>traditional\u003c/code>共同确定时间，不能因为全文鼓励新选择就排除过去的事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. loyalty of top performers is getting out-dated\u003c/h3>\n\u003cblockquote>\n\u003cp>优秀高管的忠诚正在过时\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>B\u003c/code>保留：当时根据离职污名减弱和传统规则倒转，暂将“不再一直留下”理解为旧忠诚观受挑战。与30题主旨交叉验证时，确认文章只谈职业策略和安全判断，没有否定忠诚价值，最终排除\u003ccode>B\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把\u003ccode>loyalty\u003c/code>这种价值判断设为正在过时。原文讨论的是离开是否带污名、留任是否更安全，以及经济危机中的职业策略，没有评价忠诚本身是否应被废弃。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把特定情境下的留任策略改变，上升为整体道德价值的过时。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据最后一段可以推断，优秀高管的忠诚正在过时。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把\u003ccode>loyalty\u003c/code>这种价值判断设为正在过时。原文讨论的是离开是否带污名、留任是否更安全，以及经济危机中的职业策略，没有评价忠诚本身是否应被废弃。\u003c/p>\n\u003cp>同一个人可以认同忠诚，同时在公司陷入困境、职业目标改变时合理离开；离职行为增加不能直接推出忠诚失去价值。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把特定情境下的留任策略改变，上升为整体道德价值的过时。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003cp>末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\u003c/p>\n\u003c/blockquote>\n\u003cp>先承认两份工作之间空档的旧污名在减弱，再用金融危机解释为何离开困境公司现在可被接受，接着明确新旧安全判断倒转，最后以留太久者受损作证。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Loyalty itself is becoming an outdated value among top performers.\u003c/p>\n\u003cp>忠诚本身正在优秀高管中变成过时的价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>B\u003c/code>成立，作者应明确评价忠诚无益或不再值得提倡。实际引语始终比较\u003ccode>staying\u003c/code>和\u003ccode>leaving\u003c/code>的安全性，并以危机中留太久的损失说明策略变化；评价对象是选择的风险，不是道德品质。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是优秀管理者敢于在下一职位未定时离开，末段以传统留任策略受到挑战来收束。本题可推知旧惯例曾使人抓住现职；至于忠诚价值或声誉重视程度，并不由这种策略变化自动推出。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>loyalty of top performers is getting out-dated\u003cbr>优秀高管的忠诚正在过时\u003c/p>\n\u003c/blockquote>\n\u003cp>全文支持重新考虑职业机会，不等于反对忠诚。\u003ccode>B\u003c/code>跨过了从工作处境到价值观的边界；主旨只容许比较离开与留任的时机，不能给\u003ccode>loyalty is outdated\u003c/code>提供结论。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. top performers care more about reputations\u003c/h3>\n\u003cblockquote>\n\u003cp>优秀高管更在意声誉\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>C\u003c/code>排除。当时的判断依据是：“\u003ccode>C\u003c/code>把前文的一个词移到最后一段，并增加了程度比较，超出了本段可推内容”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>care more about reputations\u003c/code>要求声誉重视程度比以前或别人更高。末段说\u003ccode>leaving\u003c/code>所带的\u003ccode>stigma\u003c/code>减弱，是外界负面评价变化，不是高管更在意声誉。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>将声誉环境的变化改成个人关注程度的增加，并补出比较。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据最后一段可以推断，优秀高管更在意声誉。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>的\u003ccode>care more about reputations\u003c/code>要求声誉重视程度比以前或别人更高。末段说\u003ccode>leaving\u003c/code>所带的\u003ccode>stigma\u003c/code>减弱，是外界负面评价变化，不是高管更在意声誉。\u003c/p>\n\u003cp>第2段确实谈含糊说法可能\u003ccode>cloud their reputations\u003c/code>，但本题限定最后一段；即便引用那句，也只能说明声誉有风险，不能证明\u003ccode>more\u003c/code>。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>将声誉环境的变化改成个人关注程度的增加，并补出比较。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003cp>末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\u003c/p>\n\u003c/blockquote>\n\u003cp>先承认两份工作之间空档的旧污名在减弱，再用金融危机解释为何离开困境公司现在可被接受，接着明确新旧安全判断倒转，最后以留太久者受损作证。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Top performers now care more about their reputations than they did before.\u003c/p>\n\u003cp>优秀高管现在比过去更加在意自己的声誉。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>C\u003c/code>成立时后文应显示他们更谨慎维护形象、避免离职。实际末段解释污名减弱为何让空档更可接受，并用旧安全规则被颠倒收束；叙述的是风险评价降低，不是对声誉越来越敏感。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是优秀管理者敢于在下一职位未定时离开，末段以传统留任策略受到挑战来收束。本题可推知旧惯例曾使人抓住现职；至于忠诚价值或声誉重视程度，并不由这种策略变化自动推出。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>top performers care more about reputations\u003cbr>优秀高管更在意声誉\u003c/p>\n\u003c/blockquote>\n\u003cp>全文呈现更敢主动离开的趋势。\u003ccode>C\u003c/code>把社会评价的宽容换成高管对名声的关注上升，这并非主旨所说明的变化；\u003ccode>more\u003c/code>的比较还必须由局部证据证明，文中没有。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. it’s safer to stick to the traditional rules\u003c/h3>\n\u003cblockquote>\n\u003cp>坚持传统规则更安全\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>第一轮\u003ccode>D\u003c/code>排除。当时的判断依据是：“最后一句还用结果继续否定久留安全，因此\u003ccode>D\u003c/code>与段落结论方向相反”。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>说遵循传统规则更安全，原文却明确传统留任更安全的规则已经\u003ccode>fundamentally inverted\u003c/code>。引语后的留太久者受伤最深继续反驳旧规则。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把文中被推翻的旧判断，当作作者对当前处境的结论。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据最后一段可以推断，坚持传统规则更安全。\u003c/p>\n\u003c/blockquote>\n\u003cp>末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>说遵循传统规则更安全，原文却明确传统留任更安全的规则已经\u003ccode>fundamentally inverted\u003c/code>。引语后的留太久者受伤最深继续反驳旧规则。\u003c/p>\n\u003cp>作者没有断言任何时候离职都更安全，但他确实否定一概遵循过去留任规则即可安全。保留情境限制也不能让\u003ccode>D\u003c/code>的概括成立。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把文中被推翻的旧判断，当作作者对当前处境的结论。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Many recruiters say the old disgrace is fading for top performers. The financial crisis has made it more acceptable to be between jobs or to leave a bad one. &quot;The traditional rule was it&#39;s safer to stay where you are, but that&#39;s been fundamentally inverted,&quot; says one headhunter. &quot;The people who&#39;ve been hurt the worst are those who&#39;ve stayed too long.&quot;\u003c/p>\n\u003cp>末段说离职污名正在减弱，传统观念中“留下比离开安全”的判断已被颠倒，受伤最深的包括留得太久的人。由规则正在改变，可以回推过去优秀高管倾向留在岗位，但不能推出忠诚作为价值已经过时。\u003c/p>\n\u003c/blockquote>\n\u003cp>先承认两份工作之间空档的旧污名在减弱，再用金融危机解释为何离开困境公司现在可被接受，接着明确新旧安全判断倒转，最后以留太久者受损作证。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>It remains safer to stay in a job and follow the traditional rule.\u003c/p>\n\u003cp>继续留在岗位、遵循传统规则仍然更安全。\u003c/p>\n\u003c/blockquote>\n\u003cp>若\u003ccode>D\u003c/code>成立，后句应举轻率辞职者受损来维护旧规则。实际例子是留得太久的人受伤最深；支持对象恰好相反，\u003ccode>inverted\u003c/code>也直接宣布了判断方向的改变。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Top Managers Jump without a Net\u003cbr>高层管理者没有安全网也敢跳\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文的中心是优秀管理者敢于在下一职位未定时离开，末段以传统留任策略受到挑战来收束。本题可推知旧惯例曾使人抓住现职；至于忠诚价值或声誉重视程度，并不由这种策略变化自动推出。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>it’s safer to stick to the traditional rules\u003cbr>坚持传统规则更安全\u003c/p>\n\u003c/blockquote>\n\u003cp>全文说明先离职再找机会逐渐可行，结尾特意反转旧安全规则。\u003ccode>D\u003c/code>把全文所挑战的传统判断恢复为当前结论，与主旨的变化方向及局部\u003ccode>stayed too long\u003c/code>的反证都冲突。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>29题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>29. A. top performers used to cling to their posts\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>A\u003c/code>准确回推被新趋势挑战的过去做法，保留时间方向。\u003c/p>\n\u003cp>\u003ccode>B\u003c/code>把特定情境下的留任策略改变，上升为整体道德价值的过时。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>将声誉环境的变化改成个人关注程度的增加，并补出比较。\u003c/p>\n\u003cp>\u003ccode>D\u003c/code>把文中被推翻的旧判断，当作作者对当前处境的结论。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此这里依据本篇阅读的主题与论证关系，扩写、改编成小标题题和排序题供大家练习。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：麦吉的直率离职\u003c/strong>（段落1核心事件） 麦吉离职的特点：出人意料地直率（没有用模糊借口）→ 明确目标：&quot;追求管理一家公司&quot; → 快速成功：两周内与哈特福德会谈，9月29日成为CEO\u003c/p>\n\u003cp>↓（更广泛的现象）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：高管离职新趋势\u003c/strong>（段落2现象分析） 麦吉的收获：【时间思考想管理什么公司 + 向外界传达清晰信息】→ 不是个例：雅芳和美国运通二号高管也为寻找CEO职位而离职 → 原因：【董事会审查继任计划 + 高管不想让模糊声明损害声誉】\u003c/p>\n\u003cp>↓（经济背景）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：经济复苏带来的机遇\u003c/strong>（段落3时机分析） 经济复苏初现 → 副总裁们更愿意&quot;无网跳跃&quot; // 但第三季度CEO更替率下降23%（董事会谨慎）→ 未来预期：经济回升将带来大量机会\u003c/p>\n\u003cp>↓（传统观念）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：传统招聘理念\u003c/strong>（段落4传统vs现实） 非传统做法：辞职找更好工作 → 传统规则：【最有吸引力的候选人必须被挖走 + 猎头被指示首先考虑在职CEO】\u003c/p>\n\u003cp>↓（现实挑战）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：跳槽的实际困难\u003c/strong>（段落5案例分析） 快速找到高位并不容易：【艾伦·马拉姆：一年后才成为小公司负责人 + 罗伯特·威勒姆斯塔德：三年后才获得CEO职位】\u003c/p>\n\u003cp>↓（观念转变）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次6：新的职业观念\u003c/strong>（段落6观念革新） 旧耻辱感消退：金融危机使工作空档期更可接受 → 规则颠倒：【传统：&quot;留在原地更安全&quot; // 现在：&quot;待太久的人受伤最重&quot;】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：在经济环境变化和职业观念转变的背景下，高管们开始采取更直接、更冒险的方式追求职业目标，虽然&quot;无网跳跃&quot;存在风险，但传统的&quot;安全&quot;策略可能反而带来更大的职业损失。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>训练用改编文本，不是外刊原文。\u003c/strong>\u003c/p>\n\u003cp>Choose the most suitable heading from the list A–G for each paragraph. There are two extra headings.\u003c/p>\n\u003cp>A. Reconsidering the safety of staying put\u003c/p>\n\u003cp>B. A move from individual ambition to a wider pattern\u003c/p>\n\u003cp>C. Guaranteed promotion after resignation\u003c/p>\n\u003cp>D. The waiting costs of leaving before the next offer\u003c/p>\n\u003cp>E. Making a career goal public before securing the next job\u003c/p>\n\u003cp>F. Character flaws behind executive departures\u003c/p>\n\u003cp>G. New opportunities against an old recruitment preference\u003c/p>\n\u003ch4>41. ______\u003c/h4>\n\u003cp>A senior executive who leaves a prestigious position normally has reasons to keep the explanation vague. A private disagreement can be disguised as a wish for more time, and an uncertain future need not be advertised. An executive who instead announces a desire to run a company makes a different choice. Recruiters can hear the ambition, but they can also see that the next position has not yet been secured. The announcement therefore combines openness about a goal with exposure to a risk. Its significance lies neither in a promise of success nor in a judgment about the executive’s character, but in making a career intention visible before the destination is certain.\u003c/p>\n\u003ch4>42. ______\u003c/h4>\n\u003cp>Such an announcement becomes more important when other ambitious deputies make similar moves. Some have waited for a chief executive’s position that may never become available inside their current company. Others discover, during a review of succession plans, that the board prefers someone else. Leaving can then communicate a willingness to pursue a different opportunity. The common element is not necessarily a quarrel with the board or a demand for higher pay. It is the wish to obtain a kind of responsibility the present role does not offer. Several individual departures can therefore reveal a pattern of career decisions rather than a collection of unrelated personal incidents.\u003c/p>\n\u003ch4>43. ______\u003c/h4>\n\u003cp>A recovering economy may make this pattern easier to sustain by creating more openings for aspiring leaders. Yet the new opportunities meet an older recruitment preference. Boards have often instructed headhunters to consider executives who are still securely employed, treating a current post as evidence of desirability. A candidate who resigns first loses that visible protection. The issue is therefore not simply whether more jobs will exist. It is whether an expanding market will make recruiters more willing to consider capable people between positions. New openings create a reason to take the risk, while the inherited preference explains why it remains a risk at all.\u003c/p>\n\u003ch4>44. ______\u003c/h4>\n\u003cp>The risk is visible in executives who leave before another appointment is ready and then wait much longer than expected. A capable manager may spend a year outside a desired position; another may need several years to obtain the role originally sought. These intervals do not by themselves prove that leaving was a mistake. They do show that competence and ambition cannot determine the timetable of a suitable vacancy. A company must need the candidate at the right moment, and its board must agree. The gap between deciding to move and receiving an acceptable offer is a real cost that a story of rapid success can easily hide.\u003c/p>\n\u003ch4>45. ______\u003c/h4>\n\u003cp>Waiting costs should be compared with the costs of remaining, not with an imaginary world free of risk. A company in serious difficulty may offer a familiar title while narrowing an executive’s future choices. In such circumstances, staying can damage a career more than an honest period between jobs. Recruiters may also become less inclined to treat every gap as a sign of failure. None of this makes resignation the only sensible response to uncertainty. It does remove the assumption that keeping the present post is automatically the safer course. A sound decision now requires examining both sides of the choice rather than obeying an inherited rule.\u003c/p>\n\u003ch2>小标题题 41\u003c/h2>\n\u003cp>\u003cstrong>E. Making a career goal public before securing the next job\u003c/strong>\u003c/p>\n\u003cp>未落实下一工作就公开职业目标\u003c/p>\n\u003cp>对照常见含糊解释与直接公布抱负，突出公开目标时下一份工作仍不确定。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>keep the explanation vague\u003c/p>\n\u003c/blockquote>\n\u003cp>先交代惯常的隐瞒或模糊处理，建立对照。\u003c/p>\n\u003cblockquote>\n\u003cp>Recruiters can hear the ambition\u003c/p>\n\u003c/blockquote>\n\u003cp>公开目标给外部招聘者传递信息。\u003c/p>\n\u003cblockquote>\n\u003cp>before the destination is certain\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾限定公开的时间点，是下一岗位尚未确定时。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>离职通常解释含糊 → 直接宣布想经营公司 → 招聘者听见目标也看见不确定性 → 开放表达与风险同时存在。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>E\u003c/code>的\u003ccode>Making\u003c/code> ... \u003ccode>public\u003c/code>对应\u003ccode>visible\u003c/code>和\u003ccode>hear the ambition\u003c/code>，\u003ccode>before securing\u003c/code> ...对应未有下家，两个条件缺一不可。\u003c/p>\n\u003cp>\u003ccode>F\u003c/code>把公开目标当性格问题，但段尾明确排除\u003ccode>judgment about\u003c/code> ... \u003ccode>character\u003c/code>。这里分析信息和风险，不是在评价自私、傲慢或冲动。\u003c/p>\n\u003cp>\u003cstrong>最终答案：41 E。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 42\u003c/h2>\n\u003cp>\u003cstrong>B. A move from individual ambition to a wider pattern\u003c/strong>\u003c/p>\n\u003cp>从个人抱负到更广泛的现象\u003c/p>\n\u003cp>由公开离职的一个例子扩大到多位副手，提炼共同职业动因并排除无证据的金钱或冲突解释。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>other ambitious deputies make similar moves\u003c/p>\n\u003c/blockquote>\n\u003cp>开头\u003ccode>other\u003c/code>与\u003ccode>similar\u003c/code>把现象从个体扩展到同类。\u003c/p>\n\u003cblockquote>\n\u003cp>not necessarily a quarrel with the board or a demand for higher pay\u003c/p>\n\u003c/blockquote>\n\u003cp>不将未被接班选中机械等同于冲突或薪资不满。\u003c/p>\n\u003cblockquote>\n\u003cp>a pattern of career decisions\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾明确多个事件所形成的共同模式。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>更多副手采取类似行动 → 内部CEO机会有限或接班落空 → 向外表达追求新责任 → 个人事件形成职业选择模式。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>B\u003c/code>的\u003ccode>individual ambition\u003c/code>对应起点，\u003ccode>wider pattern\u003c/code>对应多个副手及共同职业责任；不是只给其中一人寻找新理由。\u003c/p>\n\u003cp>\u003ccode>F\u003c/code>将共同动因定位为性格缺陷，但本段具体解释的是职位机会及职责追求，还明确不必归为争吵。由职业处境转成性格归因，换掉了论证层面。\u003c/p>\n\u003cp>\u003cstrong>最终答案：42 B。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 43\u003c/h2>\n\u003cp>\u003cstrong>G. New opportunities against an old recruitment preference\u003c/strong>\u003c/p>\n\u003cp>新机会与旧招聘偏好的碰撞\u003c/p>\n\u003cp>把复苏带来的机会与招聘方偏爱在职者的旧规则并置，说明新策略为何有吸引力又有风险。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>A recovering economy may make this pattern easier to sustain by creating more openings for aspiring leaders.\u003c/p>\n\u003c/blockquote>\n\u003cp>先给出愿意跳的环境理由。\u003c/p>\n\u003cblockquote>\n\u003cp>consider executives who are still securely employed\u003c/p>\n\u003c/blockquote>\n\u003cp>旧偏好的对象是仍在任者，解释离职为何会损失优势。\u003c/p>\n\u003cblockquote>\n\u003cp>New openings create a reason to take the risk, while the inherited preference explains why it remains a risk at all.\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾两面对照，不能只取机会或只取风险。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>复苏增加岗位 → 但旧偏好仍以在职为优势 → 先辞职者失去保护 → 市场能否接纳空档者成为问题。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>G\u003c/code>的\u003ccode>New opportunities\u003c/code>和\u003ccode>old recruitment preference\u003c/code>分别对应段落两半，\u003ccode>against\u003c/code>保留二者之间的张力。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>以\u003ccode>Guaranteed\u003c/code>把可能机会改成必定晋升，违背\u003ccode>may\u003c/code>和段内两次\u003ccode>risk\u003c/code>。更多岗位只增加可能性，旧偏好还在形成障碍。\u003c/p>\n\u003cp>\u003cstrong>最终答案：43 G。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 44\u003c/h2>\n\u003cp>\u003cstrong>D. The waiting costs of leaving before the next offer\u003c/strong>\u003c/p>\n\u003cp>下一份邀约未定就离开的等待成本\u003c/p>\n\u003cp>用漫长等待修正只看快速成功的印象，指出能力和抱负无法控制合适职位何时出现。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>wait much longer than expected\u003c/p>\n\u003c/blockquote>\n\u003cp>直接提出先离职后的时间风险。\u003c/p>\n\u003cblockquote>\n\u003cp>competence and ambition cannot determine the timetable\u003c/p>\n\u003c/blockquote>\n\u003cp>解释为什么优秀和有目标仍不能保证迅速落地。\u003c/p>\n\u003cblockquote>\n\u003cp>a real cost that a story of rapid success can easily hide\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾回扣个别迅速成功会遮住等待成本。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>先离职再等邀约 → 等待可能一年或多年 → 人才优秀不控制职位时点 → 决策与合适邀约之间存在实际成本。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>D\u003c/code>的\u003ccode>waiting costs\u003c/code>对应\u003ccode>intervals\u003c/code>和\u003ccode>gap\u003c/code>，\u003ccode>before the next offer\u003c/code>对应先离职且邀约未定，既包含行为也包含代价。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>将辞职与晋升写成保证关系，本段恰用等待削弱这一保证；即使后来找到理想职位，也不能将时间和结果都写成必然。\u003c/p>\n\u003cp>\u003cstrong>最终答案：44 D。\u003c/strong>\u003c/p>\n\u003ch2>小标题题 45\u003c/h2>\n\u003cp>\u003cstrong>A. Reconsidering the safety of staying put\u003c/strong>\u003c/p>\n\u003cp>重新考虑留任的安全性\u003c/p>\n\u003cp>把离职等待与留任损失比较，推翻留任自动更安全的假定，同时保留具体判断空间。\u003c/p>\n\u003ch3>关键证据\u003c/h3>\n\u003cblockquote>\n\u003cp>compared with the costs of remaining\u003c/p>\n\u003c/blockquote>\n\u003cp>开头增加比较另一端，不能只统计辞职风险。\u003c/p>\n\u003cblockquote>\n\u003cp>staying can damage a career more\u003c/p>\n\u003c/blockquote>\n\u003cp>处境恶化时，留任也能更伤事业。\u003c/p>\n\u003cblockquote>\n\u003cp>None of this makes resignation the only sensible response\u003c/p>\n\u003c/blockquote>\n\u003cp>排除把新判断绝对化为唯一应该辞职。\u003c/p>\n\u003ch3>段内推进\u003c/h3>\n\u003cp>等待有代价 → 留任也有风险 → 空档未必代表失败 → 留下不自动更安全 → 对照具体两端再决定。\u003c/p>\n\u003ch3>标题对应与干扰项比对\u003c/h3>\n\u003cp>\u003ccode>A\u003c/code>的\u003ccode>Reconsidering\u003c/code>是重新评估而非一律否定，\u003ccode>safety of staying put\u003c/code>正是被检验的旧假定，与末句的双向权衡一致。\u003c/p>\n\u003cp>\u003ccode>C\u003c/code>声称保证晋升，与本段保留风险、否定唯一答案不符。段落降低了空档污名，不等于能保证新的职位或更高层级。\u003c/p>\n\u003cp>\u003cstrong>最终答案：45 A。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>训练用改编文本，不是外刊原文。\u003c/strong>\u003c/p>\n\u003cp>Arrange paragraphs A–H into a coherent text. A, E and H are already in position.\u003c/p>\n\u003cp>\u003cstrong>A → 41 → 42 → E → 43 → 44 → 45 → H\u003c/strong>\u003c/p>\n\u003ch4>[A]\u003c/h4>\n\u003cp>A departing executive can hide an uncertain future behind a vague explanation. One who openly says he wants to run a company makes another choice: he tells potential recruiters what he hopes to do before securing the next position. The announcement exposes a risk, but it also sends a clear message. It raises a question about whether other ambitious deputies are beginning to act similarly.\u003c/p>\n\u003ch4>[B]\u003c/h4>\n\u003cp>That assumption has consequently become less secure. Recruiters can distinguish someone leaving a deteriorating situation from someone unable to perform, rather than treating both as the same kind of applicant. Greater acceptance of a gap does not guarantee the next appointment. It does mean that keeping the present job is no longer automatically the safer option.\u003c/p>\n\u003ch4>[C]\u003c/h4>\n\u003cp>Other deputies have indeed made comparable departures. Some want a chief executive’s role unavailable inside their existing firms; others have failed to win support in a succession review. Their decisions need not indicate a personal dispute. They can instead express a common wish for different professional responsibility. Whether these ambitions find an outlet depends partly on the wider supply of leadership jobs.\u003c/p>\n\u003ch4>[D]\u003c/h4>\n\u003cp>That wait could be substantial. An executive might spend a year seeking the desired role, while another might take several years to arrive at it. During that interval, the manager must continue explaining a professional goal without being able to name its final destination. These cases qualify the impression created by a rapid success: ambition does not control when a suitable company will need a leader. Yet the cost of waiting outside a company is not the only cost a decision must consider.\u003c/p>\n\u003ch4>[E]\u003c/h4>\n\u003cp>Historically, boards often preferred candidates who still held a senior post. Headhunters were asked to look first at sitting executives, whose current employment seemed to certify their value. Resigning before a search was complete ran against that convention. For a person without the protection of an existing position, the test was how long it would take to secure another suitable appointment.\u003c/p>\n\u003ch4>[F]\u003c/h4>\n\u003cp>That supply may expand as the economy begins to recover. More vacancies could make a move without a firm offer seem less hazardous than it did during a contraction. But available jobs are only one side of a recruitment market. The other is the kind of candidate that boards ask headhunters to find, and that preference has a long history.\u003c/p>\n\u003ch4>[G]\u003c/h4>\n\u003cp>Remaining inside a troubled company can also damage an executive’s prospects. A familiar title may conceal a shrinking business and diminishing chances to develop. The crisis made such damage harder to ignore. If staying could be dangerous, recruiters needed to reconsider the old assumption that a period between jobs necessarily marked a failed or undesirable candidate.\u003c/p>\n\u003ch4>[H]\u003c/h4>\n\u003cp>The change is best understood as a wider range of career choices, not a universal instruction to resign. Ambitious managers may pursue a goal openly, new opportunities may make movement easier, and old preferences may weaken. Waiting still has a price. The question is now how that price compares with the risk of remaining, instead of whether an unbroken job record should decide the matter in advance.\u003c/p>\n\u003ch3>全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>在全文中的作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>以公开目标的个案提问是否形成趋势\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>重估空档，把新旧安全判断翻转\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>扩大到同类动因，转向岗位供给\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>展示等待代价，提示还有另一端成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>回顾在职偏好，提出先辞职者等待问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>说明复苏机会，转问招聘偏好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>补充留任风险，要求重估空档污名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>综合新机会与两端风险，反对唯一处方\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cp>以公开目标的个案提问是否形成趋势 → 扩大到同类动因，转向岗位供给 → 说明复苏机会，转问招聘偏好 → 回顾在职偏好，提出先辞职者等待问题 → 展示等待代价，提示还有另一端成本 → 补充留任风险，要求重估空档污名 → 重估空档，把新旧安全判断翻转 → 综合新机会与两端风险，反对唯一处方\u003c/p>\n\u003cp>\u003cstrong>完整顺序：A—C—F—E—D—G—B—H。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>41—45：C、F、D、G、B。\u003c/strong>\u003c/p>\n\u003ch2>排序题 41\u003c/h2>\n\u003cp>这是全文第2个位置。先承接前段A，再接后段F；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段A末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>whether other ambitious deputies are beginning to act similarly.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段C开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Other deputies have indeed made comparable departures.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段C末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the wider supply of leadership jobs.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That supply\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>A\u003c/code>末尾问其他副手是否类似，\u003ccode>C\u003c/code>以\u003ccode>Other deputies\u003c/code>和\u003ccode>indeed\u003c/code>直接作答，归纳职业责任的追求，再把能否实现接到岗位供给；\u003ccode>F\u003c/code>的\u003ccode>That supply\u003c/code>承接这个新对象。\u003c/p>\n\u003cp>局部推进：以公开目标的个案提问是否形成趋势 → 扩大到同类动因，转向岗位供给 → 说明复苏机会，转问招聘偏好。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>B段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That assumption\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>B\u003c/code>需要传统空档污名这一判断，\u003ccode>A\u003c/code>还未介绍招聘旧规则，不能用\u003ccode>That assumption\u003c/code>回指一个尚未提出的假设。\u003c/p>\n\u003cp>\u003cstrong>最终答案：41 C。\u003c/strong>\u003c/p>\n\u003ch2>排序题 42\u003c/h2>\n\u003cp>这是全文第3个位置。先承接前段C，再接后段E；后面的E是题面已给定的固定位置。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段C末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the wider supply of leadership jobs.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段F开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That supply may expand\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段F末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>the kind of candidate that boards ask headhunters to find\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Historically, boards often preferred candidates\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>F\u003c/code>先回应\u003ccode>C\u003c/code>的岗位供给，说明复苏可扩机会，再用\u003ccode>But\u003c/code>将市场拆成岗位与候选人偏好两面；末尾提偏好有历史，\u003ccode>E\u003c/code>才以\u003ccode>Historically\u003c/code>展开在职者优先。\u003c/p>\n\u003cp>局部推进：扩大到同类动因，转向岗位供给 → 说明复苏机会，转问招聘偏好 → 回顾在职偏好，提出先辞职者等待问题。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>D段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That wait\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>要回指寻找下一职位的等待，\u003ccode>C\u003c/code>只说目标与岗位供给，并没有提出这段具体等待；且\u003ccode>D\u003c/code>不能引出\u003ccode>E\u003c/code>的历史偏好。\u003c/p>\n\u003cp>\u003cstrong>最终答案：42 F。\u003c/strong>\u003c/p>\n\u003ch2>排序题 43\u003c/h2>\n\u003cp>这是全文第5个位置。先承接前段E，再接后段G；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段E末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>how long it would take to secure another suitable appointment.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段D开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That wait could be substantial.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段D末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>not the only cost a decision must consider.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Remaining inside a troubled company\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>E\u003c/code>把先辞职者的检验收在要等多久，\u003ccode>D\u003c/code>用一年与数年回答，再说等待不是唯一成本；\u003ccode>G\u003c/code>从\u003ccode>Remaining\u003c/code>转到留任，正补足另一端。\u003c/p>\n\u003cp>局部推进：回顾在职偏好，提出先辞职者等待问题 → 展示等待代价，提示还有另一端成本 → 补充留任风险，要求重估空档污名。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>C段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Other deputies\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>C\u003c/code>会回到趋势与动因，不能回答\u003ccode>E\u003c/code>刚提出的等待长度，也不能为\u003ccode>G\u003c/code>的另一端风险建立比较。\u003c/p>\n\u003cp>\u003cstrong>最终答案：43 D。\u003c/strong>\u003c/p>\n\u003ch2>排序题 44\u003c/h2>\n\u003cp>这是全文第6个位置。先承接前段D，再接后段B；与相邻待排段构成的组合还要同时满足前后两侧证据。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段D末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>not the only cost a decision must consider.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段G开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Remaining inside a troubled company\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段G末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>a period between jobs necessarily marked a failed or undesirable candidate.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That assumption\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>G\u003c/code>接\u003ccode>D\u003c/code>的另一种成本，说明留在困境企业也会受损，继而质疑空档必然代表失败的旧判断；\u003ccode>B\u003c/code>的\u003ccode>That assumption\u003c/code>明确回指这个完整命题。\u003c/p>\n\u003cp>局部推进：展示等待代价，提示还有另一端成本 → 补充留任风险，要求重估空档污名 → 重估空档，把新旧安全判断翻转。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>F段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That supply\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>F\u003c/code>讨论岗位供给，既不是\u003ccode>D\u003c/code>要求补充的留任损失，也没有给\u003ccode>B\u003c/code>提供关于空档污名的假设。\u003c/p>\n\u003cp>\u003cstrong>最终答案：44 G。\u003c/strong>\u003c/p>\n\u003ch2>排序题 45\u003c/h2>\n\u003cp>这是全文第7个位置。先承接前段G，再接后段H；后面的H是题面已给定的固定结尾。\u003c/p>\n\u003ch3>前后衔接的关键证据\u003c/h3>\n\u003cp>前段G末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>a period between jobs necessarily marked a failed or undesirable candidate.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段B开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That assumption has consequently become less secure.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选段B末尾：\u003c/p>\n\u003cblockquote>\n\u003cp>keeping the present job is no longer automatically the safer option.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The change is best understood as a wider range of career choices\u003c/p>\n\u003c/blockquote>\n\u003ch3>为什么能接起来\u003c/h3>\n\u003cp>\u003ccode>B\u003c/code>先削弱\u003ccode>G\u003c/code>提出的空档即失败假设，再区分辞职处境与能力问题，最后翻转留任自动安全的判断。\u003ccode>H\u003c/code>据此总结为选择增加，并重新保留等待代价。\u003c/p>\n\u003cp>局部推进：补充留任风险，要求重估空档污名 → 重估空档，把新旧安全判断翻转 → 综合新机会与两端风险，反对唯一处方。\u003c/p>\n\u003ch3>最强候选比对\u003c/h3>\n\u003cp>D段的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That wait\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ccode>D\u003c/code>会回到先辞职等待的长度，没有完成对空档污名的重新评价，也无法形成\u003ccode>H\u003c/code>所总结的新选择范围。\u003c/p>\n\u003cp>\u003cstrong>最终答案：45 B。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>rational career choices\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>理性择业\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类·社会生活\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ambition\u003c/td>\n\u003ctd>抱负\u003c/td>\n\u003ctd>人生哲理类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>independent thinking\u003c/td>\n\u003ctd>独立思考\u003c/td>\n\u003ctd>人生哲理类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>keeping pace with the times\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>与时俱进\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>career planning\u003c/td>\n\u003ctd>职业规划\u003c/td>\n\u003ctd>教育文化类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stress management\u003c/td>\n\u003ctd>压力管理\u003c/td>\n\u003ctd>人生哲理类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>employment competitiveness\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>就业竞争力\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类·社会生活\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>economic recovery\u003c/td>\n\u003ctd>经济复苏\u003c/td>\n\u003ctd>经济消费类\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>opportunities for promotion\u003c/td>\n\u003ctd>晋升机会\u003c/td>\n\u003ctd>教育文化类\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>In the picture, A leaves B to pursue the goal of C.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图中，A离开B以追求C这一目标。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>Rather than following A, the person chooses to do B.\u003c/td>\n\u003ctd>画中人没有遵循A，而是选择做B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene shows A reflecting on what kind of B to choose.\u003c/td>\n\u003ctd>画面展示A在思考应选择哪一种B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>In the third quarter, A was down X% from a year earlier.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>第三季度，A比一年前下降了X%。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>As A recovered, opportunities for B increased.\u003c/td>\n\u003ctd>随着A恢复，B的机会增加了。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The chart shows a change in A over a period of B years.\u003c/td>\n\u003ctd>图表展示A在B年间的变化。\u003c/td>\
