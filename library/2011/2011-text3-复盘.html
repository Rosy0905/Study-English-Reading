const NEWTYPE={"smallTitle":"<h2>小标题题<\/h2><p>Choose the most suitable heading from A–G for each section (41–45). There are two extra headings.<\/p><p><b>[A]<\/b> Building an organization for sustained and coordinated action<\/p><p><b>[B]<\/b> Replacing paid advertising with entirely free promotion<\/p><p><b>[C]<\/b> Expanding the media framework to include new opportunities and risks<\/p><p><b>[D]<\/b> Turning customer conversations into responses and improvements<\/p><p><b>[E]<\/b> Connecting channels and publishing partners for richer experiences<\/p><p><b>[F]<\/b> Protecting a brand by removing unfavorable customer comments<\/p><p><b>[G]<\/b> Spreading personally relevant experiences through consumer networks<\/p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41. ______<\/h3><p>Marketing success can no longer be understood simply in terms of how much a company pays for advertising. Paid media still matter, but companies also use their own channels and benefit when consumers willingly promote their products. Even this familiar framework of paid, owned, and earned media is becoming too limited.<\/p><p>Two further categories are needed. An owned site with enough traffic can sell space to other marketers, turning part of its audience into a source of income. At the same time, consumers or activists can take over a company&#x27;s media or campaign to spread negative claims and put its reputation at risk. These sold and hijacked forms extend the framework in opposite directions: one offers additional commercial possibilities, while the other exposes a loss of control. Together they show why choosing where to buy advertisements is no longer an adequate marketing plan.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42. ______<\/h3><p>The different media increasingly work together. Paid advertising can draw people into a company&#x27;s owned channels, where a brief encounter can develop into repeated, more targeted contact. JetBlue, for example, promoted its Twitter offering through many channels and used the resulting audience to distribute timely ticket deals at a low variable cost.<\/p><p>Companies also turn to publishing partners because they cannot provide every part of a richer experience themselves. Dell and Nissan worked with the Sundance Channel on a television talk show whose advertising blended into its content. The partnership gave the brands access to an engaged audience. Useful digital services offer further possibilities: mobile tools compare product prices or show where drinks are sold, while food manufacturers can collaborate with a recipe platform. Across these examples, the task is to connect channels, content, and partners so that marketing offers consumers more than an isolated advertisement.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43. ______<\/h3><p>A personal conversation might seem an unlikely way to achieve the scale marketers want. Yet newer media allow richer interactions and more precise targeting, encouraging consumers to share experiences that please them. Personal relevance and wide circulation can therefore support each other.<\/p><p>McDonald&#x27;s in Japan used Twitter and blogging platforms to draw on a large fan base when promoting products and offers. Some praise arose spontaneously; other promotion was encouraged by giving fans free meals. The important link was between a consumer&#x27;s enthusiasm and the decision to talk about it. The company&#x27;s own and paid efforts could help generate earned media as satisfied people spread the message. The example shows how marketing can reach further through experiences that consumers want to make part of their own conversations.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44. ______<\/h3><p>As consumers talk in real time, companies need to do more than watch the conversation. An electronics company responded to every comment within 24 hours. Positive feedback received thanks and invitations or offers; negative comments received help with product problems, guidance on using an interface, or questions designed to discover what the customer disliked.<\/p><p>Hotel chains similarly encouraged satisfied guests to post reviews while employing staff to follow and answer complaints. These exchanges also supplied information for future improvements. Giving consumers a voice reduced the control marketers had traditionally sought, but it could bring the company closer to problems that needed attention. To weaken the basis of justified criticism, a company ultimately had to make the design or service improvements that customers reasonably requested. The conversation thus became part of delivering better goods and services, as well as responding to reputational risk.<\/p><\/section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45. ______<\/h3><p>These changes require more than a collection of new promotional tools. Companies must decide what each media type is for and coordinate the content and placement of advertising accordingly. Owned channels need continuing programs, fresh content, adequate budgets, focused management, and suitable measures of performance.<\/p><p>They also need agreed rules for handling attacks and an experienced community manager with authority to coordinate marketing, public relations, legal, and other units. Creativity and analysis both remain necessary, but execution becomes more important as the work grows more complex. Teams must be able to operate across different channels, use data effectively, and manage quality and risk. Priorities will vary with the organization, so leaders should support carefully designed pilots and invest in approaches that can grow. The broader media landscape can deepen consumer engagement only if the organization develops the resources and coordination needed to act on it.<\/p><\/section>","sorting":"<h2>排序题<\/h2><p>Reorganize paragraphs A–H. Paragraphs A, E and H have been correctly placed.<\/p><p>A → 41. ______ → 42. ______ → E → 43. ______ → 44. ______ → 45. ______ → H<\/p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>[A]<\/h3><p>Paid advertising still plays an important role, but it does not account for everything that shapes a purchase. Companies also reach customers through their own channels, and enthusiastic consumers may promote products for them. Even the familiar classification of paid, owned, and earned media leaves important questions unanswered. What happens when a company sells advertising space on its own site? What happens when activists take hold of its campaign to spread negative claims? Answering these questions requires a broader media framework.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>[B]<\/h3><p>In these real-time conversations, listening by itself is not enough. An electronics company, for instance, answered every comment within 24 hours: it thanked pleased users and offered explanations or follow-up questions to dissatisfied ones. Hotel chains likewise followed negative reviews and gathered information for future improvements. These activities place marketers on the front line of service delivery and require continuing work. That work raises an organizational question: who will do it, with what resources and authority?<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>[C]<\/h3><p>Personal relevance need not come at the expense of scale. New media can encourage consumers to share experiences they enjoy. McDonald&#x27;s in Japan, for example, used Twitter and blogging platforms to encourage fans to talk about its products. Some promotion was spontaneous, while some was encouraged with free meals. Thus the company&#x27;s paid and owned efforts could generate earned media through consumers&#x27; enthusiasm. The same opportunities for users to express themselves also bring companies into real-time conversations.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>[D]<\/h3><p>This interaction is particularly clear when paid media feed consumers into owned-media channels. There a company can turn a brief encounter into an ongoing relationship. JetBlue promoted its Twitter offering through several channels and then sent timely ticket deals to the audience it had built, at a low variable cost. The approach reduced reliance on expensive paid media while strengthening contact with consumers. But sustaining richer experiences can require publishing capabilities that a marketer cannot supply alone.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>[E]<\/h3><p>When marketers cannot supply everything themselves, media publishers can help. Dell and Nissan, for example, worked with the Sundance Channel to create a television talk show, with advertising blended into its content. The brands gained exposure to a highly engaged audience and connected with their target groups. Mobile information tools and collaborations with recipe platforms offer other ways to make content useful. Such collaborations are one way to build a richer experience; another is to make the experience personally relevant.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>[F]<\/h3><p>Two additions complete this broader framework. Sold media arise when a company&#x27;s owned channel attracts enough traffic to host another marketer&#x27;s content or advertising. Hijacked media arise when consumers or activists turn a channel or campaign against the brand. These categories bring opportunities as well as reputational risks. Adding them changes more than the names in a classification: marketers must look beyond buying space and allocating budgets. The five types do not operate in isolation; their growing interaction is changing the marketer&#x27;s work.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>[G]<\/h3><p>Answering that organizational question requires a reassessment of both resources and responsibility. Owned channels need fresh content, sustained investment, management, and appropriate performance measures. A community manager needs clear rules and authority to coordinate with marketing, public relations, legal, and other units. Creativity and analysis must be joined by effective execution across many different channels. The precise priorities will depend on the company&#x27;s circumstances. These changes are too varied to be imposed by a simple order from the top.<\/p><\/section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>[H]<\/h3><p>Instead, leaders should put together carefully designed pilots and seek support for investments that can be applied at scale. Hiring staff to answer social-media comments may initially be difficult to justify, but such work may become essential to limiting brand hijacking. Companies must also make the legitimate product and service improvements consumers seek. More media types can deepen engagement cost effectively; realizing that opportunity calls for renewed attention to execution, coordination, speed, and performance.<\/p><\/section>"};
const FULL="<h1>0.阅前须知<\/h1>\n<h2>史上最强阅读复盘法：一石五鸟法<\/h2>\n<h3>省流：一石五鸟法怎么做<\/h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。<\/p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟<\/strong>阅读训练法，<strong>同时<\/strong>备考<strong>单词，阅读，新题型，翻译，作文<\/strong>。<\/p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词<\/strong>；<\/p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了<\/strong>；<\/p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案<\/strong>；<\/p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的<\/strong>；<\/p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。<\/strong><\/p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。<\/strong><\/p>\n<h3>一石五鸟法的原理<\/h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。<\/p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。<\/p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间<\/strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义<\/strong>，这块主要也是一个资料的问题，我们给大家都做好了。<\/p>\n<p>例如：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例<\/figcaption><\/figure>\n<p>这样效率就是最高的。<\/p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升<\/h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：<\/p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西<\/strong>拆开讲两遍。<\/p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译<\/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。<\/p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾<\/strong>，逻辑混乱。<\/p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例<\/figcaption><\/figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分<\/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解<\/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。<\/p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？<\/strong><\/p>\n<p>具体操作如下：<\/p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：<\/strong><\/p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群<\/strong><\/p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群<\/strong><\/p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序<\/strong><\/p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。<\/strong><\/p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。<\/strong><\/p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。<\/p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：<\/p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。<\/p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。<\/p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。<\/strong><\/p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升<\/h4>\n<p>首先，这大概率是你们的新题型备考思路：<\/p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料<\/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。<\/p>\n<p>那么，新题型的备考真相是什么？<\/p>\n<p>我们先看看考纲考新题型是想考你们什么：<\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格<\/figcaption><\/figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明<\/figcaption><\/figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点<\/figcaption><\/figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点<\/figcaption><\/figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性<\/strong><\/p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点<\/figcaption><\/figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架<\/strong><\/p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：<\/p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练<\/strong>，就这么简单。<\/p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的<\/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。<\/p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。<\/p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。<\/p>\n<p>这里顺便说下<strong>完型<\/strong>，我个人看法是<strong>直接随缘<\/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。<\/p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“<\/p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；<\/strong><\/p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；<\/strong><\/p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。<\/strong><\/p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用<\/strong><\/p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。<\/strong><\/p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。<\/strong><\/p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。<\/p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升<\/h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。<\/p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。<\/p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量<\/h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。<\/p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。<\/p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。<\/p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。<\/p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。<\/p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。<\/p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升<\/h1>\n<h1>第1段<\/h1>\n<table>\n<thead>\n<tr>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<th>表达<\/th>\n<th>词性＋意思<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>rough<\/td>\n<td>adj. 粗略的<\/td>\n<td>guide<\/td>\n<td>n. 指南<\/td>\n<td>marketing success<\/td>\n<td>名词短语：营销成功<\/td>\n<\/tr>\n<tr>\n<td>used to<\/td>\n<td>动词短语：过去常常<\/td>\n<td>paid for<\/td>\n<td>动词短语：为……付费<\/td>\n<td>no longer<\/td>\n<td>副词短语：不再<\/td>\n<\/tr>\n<tr>\n<td>traditional<\/td>\n<td>adj. 传统的<\/td>\n<td>paid media<\/td>\n<td>名词短语：付费媒体<\/td>\n<td>such as<\/td>\n<td>介词短语：例如<\/td>\n<\/tr>\n<tr>\n<td>television commercials<\/td>\n<td>名词短语：电视广告<\/td>\n<td>print advertisements<\/td>\n<td>名词短语：印刷广告<\/td>\n<td>play a major role<\/td>\n<td>动词短语：发挥主要作用<\/td>\n<\/tr>\n<tr>\n<td>companies<\/td>\n<td>n. 公司<\/td>\n<td>exploit<\/td>\n<td>v. 利用<\/td>\n<td>alternative forms of media<\/td>\n<td>名词短语：可供选择的其他媒体形式<\/td>\n<\/tr>\n<tr>\n<td>consumers<\/td>\n<td>n. y alternative forms of media. Consumers passionate about a product may create &quot;earned&quot; media by willingly promoting it to friends, and a company may leverage &quot;owned&quot; media by sending e-mail alerts about products and sales to customers registered with its Web site. The way consumers now approach the process of making purchase decisions means that marketing&#39;s impact stems from a broad range of factors beyond conventional paid media.<\/p>\n<h3>意群划分 · 第1段<\/h3>\n<p>The rough guide / to marketing success / used to be / that you got / what you paid for.<\/p>\n<p>No longer.<\/p>\n<p>While traditional &quot;paid&quot; media – / such as television commercials / and print advertisements – / still play a major role, / companies today / can exploit / many alternative forms of media.<\/p>\n<p>Consumers passionate about a product / may create &quot;earned&quot; media / by willingly promoting it / to friends, / and a company / may leverage &quot;owned&quot; media / by sending e-mail alerts / about products and sales / to customers registered / with its Web site.<\/p>\n<p>The way consumers / now approach / the process of making purchase decisions / means that / marketing&#39;s impact / stems from / a broad range of factors / beyond conventional paid media.<\/p>\n<h3>意群翻译 · 第1段<\/h3>\n<p>粗略的指南 / 对于营销成功 / 过去是 / 你得到 / 你所付费的。<\/p>\n<p>不再如此了。<\/p>\n<p>尽管传统的&quot;付费&quot;媒体 – / 比如电视广告 / 和印刷广告 – / 仍然发挥主要作用，/ 今天的公司 / 可以利用 / 许多替代形式的媒体。<\/p>\n<p>对产品充满热情的消费者 / 可能创造&quot;赚得&quot;媒体 / 通过自愿推广它 / 给朋友们，/ 而公司 / 可能利用&quot;自有&quot;媒体 / 通过发送电子邮件提醒 / 关于产品和销售 / 给注册的客户 / 在其网站上。<\/p>\n<p>消费者的方式 / 现在接近 / 做出购买决定的过程 / 意味着 / 营销的影响 / 源于 / 广泛的因素 / 超越传统付费媒体。<\/p>\n<h3>标准译文 · 第1段<\/h3>\n<p>营销成功的粗略指南过去是&quot;一分钱一分货&quot;。但现在不再如此了。尽管传统的&quot;付费&quot;媒体——如电视广告和印刷广告——仍然发挥主要作用，但今天的公司可以利用许多替代形式的媒体。对产品充满热情的消费者可能通过自愿向朋友推广来创造&quot;赚得&quot;媒体，而公司可能通过向在其网站注册的客户发送关于产品和销售的电子邮件提醒来利用&quot;自有&quot;媒体。消费者现在做出购买决定的方式意味着，营销的影响源于超越传统付费媒体的广泛因素。<\/p>\n<h2>第2段<\/h2>\n<h3>完整原文 · 第2段<\/h3>\n<p>Paid and owned media are controlled by marketers promoting their own products. For earned media, such marketers act as the initiator for users&#39; responses. But in some cases, one marketer&#39;s owned media become another marketer&#39;s paid media – for instance, when an e-commerce retailer sells ad space on its Web site. We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment. This trend, which we believe is still in its infancy, effectively began with retailers and travel providers such as airlines and hotels and will no doubt go further. Johnson &amp; Johnson, for example, has created BabyCenter, a stand-alone media property that promotes complementary and even competitive products. Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies&#39; marketing, and may help expand user traffic for all companies concerned.<\/p>\n<h3>意群划分 · 第2段<\/h3>\n<p>Paid and owned media / are controlled by marketers / promoting their own products.<\/p>\n<p>For earned media, / such marketers / act as the initiator / for users&#39; responses.<\/p>\n<p>But in some cases, / one marketer&#39;s owned media / become another marketer&#39;s paid media – / for instance, / when an e-commerce retailer / sells ad space / on its Web site.<\/p>\n<p>We define such sold media / as owned media / whose traffic is so strong / that other organizations / place their content / or e-commerce engines / within that environment.<\/p>\n<p>This trend, / which we believe / is still in its infancy, / effectively began / with retailers and travel providers / such as airlines and hotels / and will no doubt go further.<\/p>\n<p>Johnson &amp; Johnson, / for example, / has created BabyCenter, / a stand-alone media property / that promotes / complementary and even competitive products.<\/p>\n<p>Besides generating income, / the presence of other marketers / makes the site seem objective, / gives companies opportunities / to learn valuable information / about the appeal / of other companies&#39; marketing, / and may help expand / user traffic / for all companies concerned.<\/p>\n<h3>意群翻译 · 第2段<\/h3>\n<p>付费和自有媒体 / 被营销人员控制 / 推广他们自己的产品。<\/p>\n<p>对于赚得媒体，/ 这些营销人员 / 充当发起者 / 对于用户的回应。<\/p>\n<p>但在某些情况下，/ 一个营销者的自有媒体 / 成为另一个营销者的付费媒体 – / 例如，/ 当电子商务零售商 / 出售广告空间 / 在其网站上。<\/p>\n<p>我们定义这种出售媒体 / 作为自有媒体 / 其流量如此强大 / 以至于其他组织 / 放置他们的内容 / 或电子商务引擎 / 在那个环境中。<\/p>\n<p>这个趋势，/ 我们相信 / 仍处于初期阶段，/ 实际上开始于 / 零售商和旅游供应商 / 比如航空公司和酒店 / 并且无疑会走得更远。<\/p>\n<p>强生公司，/ 例如，/ 创建了BabyCenter，/ 一个独立的媒体资产 / 推广 / 互补甚至竞争性的产品。<\/p>\n<p>除了产生收入，/ 其他营销者的存在 / 使网站显得客观，/ 给公司机会 / 学习有价值的信息 / 关于吸引力 / 其他公司营销的，/ 并可能帮助扩大 / 用户流量 / 为所有相关公司。<\/p>\n<h3>标准译文 · 第2段<\/h3>\n<p>付费和自有媒体由营销人员控制，用于推广他们自己的产品。对于赚得媒体，这些营销人员充当用户回应的发起者。但在某些情况下，一个营销者的自有媒体会成为另一个营销者的付费媒体——例如，当电子商务零售商在其网站上出售广告空间时。我们将这种出售媒体定义为流量如此强大的自有媒体，以至于其他组织会在其中放置他们的内容或电子商务引擎。这个趋势我们相信仍处于初期阶段，实际上始于零售商和旅游供应商（如航空公司和酒店），并且无疑会走得更远。例如，强生公司创建了BabyCenter，这是一个独立的媒体资产，推广互补甚至竞争性的产品。除了产生收入，其他营销者的存在使网站显得客观，给公司机会学习关于其他公司营销吸引力的有价值信息，并可能帮助为所有相关公司扩大用户流量。<\/p>\n<h2>第3段<\/h2>\n<h3>完整原文 · 第3段<\/h3>\n<p>The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways. Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholders, or activists who make negative allegations about a brand or product. Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.<\/p>\n<h3>意群划分 · 第3段<\/h3>\n<p>The same dramatic technological changes / that have provided marketers / with more (and more diverse) / communications choices / have also increased the risk / that passionate consumers / will voice their opinions / in quicker, more visible, / and much more damaging ways.<\/p>\n<p>Such hijacked media / are the opposite / of earned media: / an asset or campaign / becomes hostage / to consumers, other stakeholders, / or activists / who make negative allegations / about a brand or product.<\/p>\n<p>Members of social networks, / for instance, / are learning / that they can hijack media / to apply pressure / on the businesses / that originally created them.<\/p>\n<h3>意群翻译 · 第3段<\/h3>\n<p>同样的戏剧性技术变革 / 这些为营销人员提供了 / 更多（且更多样化的）/ 沟通选择 / 也增加了风险 / 充满热情的消费者 / 将表达他们的意见 / 以更快、更可见、/ 且更具破坏性的方式。<\/p>\n<p>这种被劫持的媒体 / 是相反的 / 对于赚得媒体：/ 一项资产或活动 / 成为人质 / 对于消费者、其他利益相关者、/ 或活动家 / 他们做出负面指控 / 关于品牌或产品。<\/p>\n<p>社交网络的成员，/ 例如，/ 正在学习 / 他们可以劫持媒体 / 施加压力 / 对企业 / 最初创建它们的。<\/p>\n<h3>标准译文 · 第3段<\/h3>\n<p>为营销人员提供更多、更多样化沟通选择的同样的戏剧性技术变革，也增加了充满热情的消费者以更快、更可见、更具破坏性的方式表达意见的风险。这种被劫持的媒体与赚得媒体相反：一项资产或活动成为消费者、其他利益相关者或活动家的人质，他们对品牌或产品做出负面指控。例如，社交网络的成员正在学习他们可以劫持媒体，对最初创建这些媒体的企业施加压力。<\/p>\n<h2>第4段<\/h2>\n<h3>完整原文 · 第4段<\/h3>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk. In such a case, the company&#39;s response may not be sufficiently quick or thoughtful, and the learning curve has been steep. Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<h3>意群划分 · 第4段<\/h3>\n<p>If that happens, / passionate consumers / would try to persuade others / to boycott products, / putting the reputation / of the target company / at risk.<\/p>\n<p>In such a case, / the company&#39;s response / may not be / sufficiently quick or thoughtful, / and the learning curve / has been steep.<\/p>\n<p>Toyota Motor, / for example, / alleviated some of the damage / from its recall crisis / earlier this year / with a relatively quick / and well-orchestrated / social-media response campaign, / which included efforts / to engage with consumers directly / on sites / such as Twitter / and the social-news site Digg.<\/p>\n<h3>意群翻译 · 第4段<\/h3>\n<p>如果那发生，/ 充满热情的消费者 / 会试图说服其他人 / 抵制产品，/ 使声誉 / 目标公司的 / 处于风险中。<\/p>\n<p>在这种情况下，/ 公司的回应 / 可能不会 / 足够快速或周到，/ 而学习曲线 / 一直很陡峭。<\/p>\n<p>丰田汽车，/ 例如，/ 减轻了一些损害 / 从其召回危机 / 今年早些时候 / 通过相对快速 / 且精心策划的 / 社交媒体回应活动，/ 包括努力 / 直接与消费者互动 / 在网站上 / 比如推特 / 和社交新闻网站Digg。<\/p>\n<h3>标准译文 · 第4段<\/h3>\n<p>如果发生这种情况，充满热情的消费者会试图说服其他人抵制产品，使目标公司的声誉处于风险之中。在这种情况下，公司的回应可能不够快速或周到，而学习曲线一直很陡峭。例如，丰田汽车通过相对快速且精心策划的社交媒体回应活动，减轻了今年早些时候召回危机造成的一些损害，其中包括在推特和社交新闻网站Digg等网站上直接与消费者互动的努力。<\/p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)<\/h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。<\/p>\n<p>符号的作用：<\/p>\n<ul>\n<li><code>→<\/code>：主要叙述继续向下推进；<\/li>\n<li><code>+<\/code>：并列；<\/li>\n<li><code>：<\/code>：解释、修饰或补充；<\/li>\n<li><code>//<\/code>：转折或对比；<\/li>\n<li>括号：把同一层的信息捆成一个整体。<\/li>\n<\/ul>\n<h2>句子逻辑梳理（选修，按照自身语法基础而定)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>The rough guide：(to marketing success) → used to be：(that you got → what you paid for).<\/p>\n<p>No longer.<\/p>\n<p>While traditional &quot;paid&quot; media：(such as television commercials + print advertisements) → still play a major role // companies today → can exploit → many alternative forms of media.<\/p>\n<p>Consumers passionate about a product → may create &quot;earned&quot; media：(by willingly promoting it：(to friends)) + a company → may leverage &quot;owned&quot; media：(by sending e-mail alerts：(about products and sales)：(to customers registered：(with its Web site))).<\/p>\n<p>The way：(consumers → now approach → the process of making purchase decisions) → means：(that marketing&#39;s impact → stems from → a broad range of factors：(beyond conventional paid media)).<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>Paid and owned media → are controlled by marketers：(promoting their own products).<\/p>\n<p>For earned media → such marketers → act as the initiator：(for users&#39; responses).<\/p>\n<p>But in some cases → one marketer&#39;s owned media → become another marketer&#39;s paid media – for instance：(when an e-commerce retailer → sells ad space：(on its Web site)).<\/p>\n<p>We define such sold media → as owned media：(whose traffic is so strong：(that other organizations → place their content + e-commerce engines：(within that environment))).<\/p>\n<p>This trend：(which we believe → is still in its infancy) → effectively began：(with retailers and travel providers：(such as airlines and hotels)) + will no doubt go further.<\/p>\n<p>Johnson &amp; Johnson → for example → has created BabyCenter：(a stand-alone media property：(that promotes → complementary and even competitive products)).<\/p>\n<p>Besides generating income → the presence of other marketers → makes the site seem objective + gives companies opportunities：(to learn valuable information：(about the appeal：(of other companies&#39; marketing))) + may help expand → user traffic：(for all companies concerned).<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>The same dramatic technological changes：(that have provided marketers：(with more (and more diverse) communications choices)) → have also increased the risk：(that passionate consumers → will voice their opinions：(in quicker + more visible + much more damaging ways)).<\/p>\n<p>Such hijacked media → are the opposite：(of earned media)：an asset or campaign → becomes hostage：(to consumers + other stakeholders + activists：(who make negative allegations：(about a brand or product))).<\/p>\n<p>Members of social networks → for instance → are learning：(that they can hijack media → to apply pressure：(on the businesses：(that originally created them))).<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>If that happens → passionate consumers → would try to persuade others：(to boycott products) → putting the reputation：(of the target company)：(at risk).<\/p>\n<p>In such a case → the company&#39;s response → may not be：(sufficiently quick or thoughtful) + the learning curve → has been steep.<\/p>\n<p>Toyota Motor → for example → alleviated some of the damage：(from its recall crisis：(earlier this year))：(with a relatively quick + well-orchestrated social-media response campaign：(which included efforts：(to engage with consumers directly：(on sites：(such as Twitter + the social-news site Digg))))).<\/p>\n<h2>中文版句子逻辑（选修)<\/h2>\n<p><strong>第1段<\/strong><\/p>\n<p>粗略的指南：(对于营销成功) → 过去是：(你得到 → 你所付费的)。<\/p>\n<p>不再如此了。<\/p>\n<p>尽管传统的&quot;付费&quot;媒体：(比如电视广告 + 印刷广告) → 仍然发挥主要作用 // 今天的公司 → 可以利用 → 许多替代形式的媒体。<\/p>\n<p>对产品充满热情的消费者 → 可能创造&quot;赚得&quot;媒体：(通过自愿推广它：(给朋友们)) + 公司 → 可能利用&quot;自有&quot;媒体：(通过发送电子邮件提醒：(关于产品和销售)：(给注册的客户：(在其网站上)))。<\/p>\n<p>方式：(消费者 → 现在接近 → 做出购买决定的过程) → 意味着：(营销的影响 → 源于 → 广泛的因素：(超越传统付费媒体))。<\/p>\n<p><strong>第2段<\/strong><\/p>\n<p>付费和自有媒体 → 被营销人员控制：(推广他们自己的产品)。<\/p>\n<p>对于赚得媒体 → 这些营销人员 → 充当发起者：(对于用户的回应)。<\/p>\n<p>但在某些情况下 → 一个营销者的自有媒体 → 成为另一个营销者的付费媒体 – 例如：(当电子商务零售商 → 出售广告空间：(在其网站上))。<\/p>\n<p>我们定义这种出售媒体 → 作为自有媒体：(其流量如此强大：(以至于其他组织 → 放置他们的内容 + 电子商务引擎：(在那个环境中)))。<\/p>\n<p>这个趋势：(我们相信 → 仍处于初期阶段) → 实际上开始于：(零售商和旅游供应商：(比如航空公司和酒店)) + 无疑会走得更远。<\/p>\n<p>强生公司 → 例如 → 创建了BabyCenter：(一个独立的媒体资产：(推广 → 互补甚至竞争性的产品))。<\/p>\n<p>除了产生收入 → 其他营销者的存在 → 使网站显得客观 + 给公司机会：(学习有价值的信息：(关于吸引力：(其他公司营销的))) + 可能帮助扩大 → 用户流量：(为所有相关公司)。<\/p>\n<p><strong>第3段<\/strong><\/p>\n<p>同样的戏剧性技术变革：(为营销人员提供了：(更多（且更多样化的）沟通选择)) → 也增加了风险：(充满热情的消费者 → 将表达他们的意见：(以更快 + 更可见 + 更具破坏性的方式))。<\/p>\n<p>这种被劫持的媒体 → 是相反的：(对于赚得媒体)：一项资产或活动 → 成为人质：(对于消费者 + 其他利益相关者 + 活动家：(他们做出负面指控：(关于品牌或产品)))。<\/p>\n<p>社交网络的成员 → 例如 → 正在学习：(他们可以劫持媒体 → 施加压力：(对企业：(最初创建它们的)))。<\/p>\n<p><strong>第4段<\/strong><\/p>\n<p>如果那发生 → 充满热情的消费者 → 会试图说服其他人：(抵制产品) → 使声誉：(目标公司的)：(处于风险中)。<\/p>\n<p>在这种情况下 → 公司的回应 → 可能不会：(足够快速或周到) + 学习曲线 → 一直很陡峭。<\/p>\n<p>丰田汽车 → 例如 → 减轻了一些损害：(从其召回危机：(今年早些时候))：(通过相对快速 + 精心策划的社交媒体回应活动：(包括努力：(直接与消费者互动：(在网站上：(比如推特 + 社交新闻网站Digg)))))。<\/p>\n<h2>长难句翻译练习（英一必修，英二选修)<\/h2>\n<p>对于长难句的翻译，流程一共五步：<\/p>\n<ol>\n<li>划分意群；<\/li>\n<li>逐个意群直译；<\/li>\n<li>按照中文语感，把应该放在一起的意群合并起来；<\/li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；<\/li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。<\/li>\n<\/ol>\n<h3>1. 第1段第4句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>Consumers passionate about a product may create &quot;earned&quot; media by willingly promoting it to friends, and a company may leverage &quot;owned&quot; media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>Consumers passionate about a product / may create &quot;earned&quot; media / by willingly promoting it / to friends, / and a company / may leverage &quot;owned&quot; media / by sending e-mail alerts / about products and sales / to customers registered / with its Web site.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>对产品充满热情的消费者 / 可能创造&quot;赚得&quot;媒体 / 通过自愿推广它 / 给朋友们，/ 而公司 / 可能利用&quot;自有&quot;媒体 / 通过发送电子邮件提醒 / 关于产品和销售 / 给注册的客户 / 在其网站上。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把推广的对象接到动作前面：<\/p>\n<blockquote>\n<p>自愿向朋友推广产品<\/p>\n<\/blockquote>\n<p>后半句先说清楚是哪一类客户，把“在其网站上”接回“注册”：<\/p>\n<blockquote>\n<p>在公司网站上注册的客户<\/p>\n<\/blockquote>\n<p>再合并邮件的内容和发送对象：<\/p>\n<blockquote>\n<p>向这些客户发送关于产品和销售的电子邮件提醒<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>对产品充满热情的消费者，通过自愿向朋友推广，可能创造“赚得”媒体\n公司通过向网站注册客户发送产品和销售信息的邮件，可能利用“自有”媒体<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>消费者可能创造一种媒体，而公司可能利用另一种媒体。<\/p>\n<\/blockquote>\n<p>先说消费者怎样创造“赚得”媒体，再用“而”接出公司怎样利用“自有”媒体。两处“通过……”都放在对应动作前：向朋友推广是消费者做的，向网站注册客户发邮件是公司做的。客户是注册在公司网站上的人，“关于产品和销售”说明邮件提醒的内容。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>对产品充满热情的消费者可能通过自愿向朋友推广产品来创造“赚得”媒体，而公司可能通过向在其网站注册的客户发送关于产品和销售的电子邮件提醒来利用“自有”媒体。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>前半句已说“对产品充满热情”，后面“推广产品”的“产品”可以省去，避免同一对象重复出现。<\/li>\n<li>保留两处“可能”和“通过……来……”：前者保留原文语气，后者让两种媒体各自的形成方式对应清楚。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>对产品充满热情的消费者可能通过自愿向朋友推广来创造&quot;赚得&quot;媒体，而公司可能通过向在其网站注册的客户发送关于产品和销售的电子邮件提醒来利用&quot;自有&quot;媒体。<\/p>\n<\/blockquote>\n<h3>2. 第2段第4句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>We define such sold media / as owned media / whose traffic is so strong / that other organizations / place their content / or e-commerce engines / within that environment.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>我们定义这种出售媒体 / 作为自有媒体 / 其流量如此强大 / 以至于其他组织 / 放置他们的内容 / 或电子商务引擎 / 在那个环境中。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把“其流量”接回它说明的媒体：<\/p>\n<blockquote>\n<p>流量如此强大的自有媒体<\/p>\n<\/blockquote>\n<p>再把其他组织做的事合并起来，“内容”和“电子商务引擎”是两个可选对象：<\/p>\n<blockquote>\n<p>其他组织在那个环境中放置他们的内容或电子商务引擎<\/p>\n<\/blockquote>\n<p>最后把程度与结果接起来：<\/p>\n<blockquote>\n<p>流量如此强大，以至于其他组织在其中放置内容或电子商务引擎<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>我们把这种出售媒体定义为一种自有媒体\n其流量如此强大，以至于其他组织在其中放置他们的内容或电子商务引擎<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>我们把这种出售媒体定义为一种自有媒体。<\/p>\n<\/blockquote>\n<p>先用“把……定义为……”说明定义对象及其类别；把“流量如此强大”放在“自有媒体”前，说明是哪一种自有媒体。后面再用“以至于”接出流量带来的结果，“在那个环境中”放到“放置”前。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>我们把这种出售媒体定义为流量如此强大的自有媒体，以至于其他组织会在那个环境中放置他们的内容或电子商务引擎。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“把……定义为……”整理为“将……定义为……”，适合这里给概念下定义的表达。<\/li>\n<li>“在那个环境中”指的就是前面的自有媒体，可收成“在其中”，连接更紧凑；仍保留“如此……以至于……”的程度和结果关系。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>我们将这种出售媒体定义为流量如此强大的自有媒体，以至于其他组织会在其中放置他们的内容或电子商务引擎。<\/p>\n<\/blockquote>\n<h3>3. 第2段第7句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies&#39; marketing, and may help expand user traffic for all companies concerned.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>Besides generating income, / the presence of other marketers / makes the site seem objective, / gives companies opportunities / to learn valuable information / about the appeal / of other companies&#39; marketing, / and may help expand / user traffic / for all companies concerned.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>除了产生收入，/ 其他营销者的存在 / 使网站显得客观，/ 给公司机会 / 学习有价值的信息 / 关于吸引力 / 其他公司营销的，/ 并可能帮助扩大 / 用户流量 / 为所有相关公司。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把第二项好处中层层说明的信息接起来，从“其他公司”一路接到“信息”：<\/p>\n<blockquote>\n<p>关于其他公司营销吸引力的有价值信息<\/p>\n<\/blockquote>\n<p>再把机会和能做的事情接起来：<\/p>\n<blockquote>\n<p>给公司学习这些有价值信息的机会<\/p>\n<\/blockquote>\n<p>最后把扩大流量的受益对象接到动作前：<\/p>\n<blockquote>\n<p>为所有相关公司扩大用户流量<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>除了产生收入，其他营销者的存在使网站显得客观\n给公司学习其他公司营销吸引力相关信息的机会\n并可能帮助所有相关公司扩大用户流量<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>其他营销者的存在带来几项好处。<\/p>\n<\/blockquote>\n<p>句首先保留“除了产生收入”，然后让“其他营销者的存在”统领后面三项：使网站显得客观、给公司学习信息的机会、可能帮助扩大用户流量。“关于其他公司营销吸引力”放在“有价值信息”前；“为所有相关公司”放到“扩大用户流量”前。最后一项才有“可能”，不要把三项好处都改成确定发生。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>除了产生收入，其他营销者的存在使网站显得客观，给公司学习关于其他公司营销吸引力的有价值信息的机会，并可能帮助为所有相关公司扩大用户流量。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“给公司学习……信息的机会”中，说明过长，读到句末才能等到“机会”；改成“给公司机会学习……信息”，先交代获得机会，再说机会用来做什么。<\/li>\n<li>保留“显得客观”的“显得”和最后一项的“可能”，不把网站给人的观感写成绝对客观，也不把潜在收益写成必然收益。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>除了产生收入，其他营销者的存在使网站显得客观，给公司机会学习关于其他公司营销吸引力的有价值信息，并可能帮助为所有相关公司扩大用户流量。<\/p>\n<\/blockquote>\n<h3>4. 第3段第1句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>The same dramatic technological changes / that have provided marketers / with more (and more diverse) / communications choices / have also increased the risk / that passionate consumers / will voice their opinions / in quicker, more visible, / and much more damaging ways.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>同样的戏剧性技术变革 / 这些为营销人员提供了 / 更多（且更多样化的）/ 沟通选择 / 也增加了风险 / 充满热情的消费者 / 将表达他们的意见 / 以更快、更可见、/ 且更具破坏性的方式。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把沟通选择的两个特点合并到一起：<\/p>\n<blockquote>\n<p>更多、更多样化的沟通选择<\/p>\n<\/blockquote>\n<p>再把技术变革已经带来的好处接到它前面：<\/p>\n<blockquote>\n<p>为营销人员提供更多、更多样化沟通选择的同样的戏剧性技术变革<\/p>\n<\/blockquote>\n<p>后半句先合并表达意见的三种方式，再接回消费者的动作：<\/p>\n<blockquote>\n<p>充满热情的消费者以更快、更可见、且更具破坏性的方式表达意见<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>为营销人员提供更多、更多样化沟通选择的同样的戏剧性技术变革\n也增加了风险：消费者以更快、更可见、更具破坏性的方式表达意见<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>同样的技术变革也增加了风险。<\/p>\n<\/blockquote>\n<p>先把“为营销人员提供更多、更多样化沟通选择”放在“同样的戏剧性技术变革”前，交代这仍是带来新选择的那一场变化。后半句把“风险”先留在句末，再在它前面说明谁以什么方式做什么：消费者以更快、更可见、更具破坏性的方式表达意见。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>为营销人员提供更多、更多样化沟通选择的同样的戏剧性技术变革，也增加了充满热情的消费者将以更快、更可见、且更具破坏性的方式表达他们的意见的风险。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“表达他们的意见”中的“他们的”与前面的消费者重复，收成“表达意见”。<\/li>\n<li>“风险”已经表达可能发生的情况，“将”可以省去；三个并列方式用顿号连接，省去“且”，让长句收束得更紧。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>为营销人员提供更多、更多样化沟通选择的同样的戏剧性技术变革，也增加了充满热情的消费者以更快、更可见、更具破坏性的方式表达意见的风险。<\/p>\n<\/blockquote>\n<h3>5. 第3段第2句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholders, or activists who make negative allegations about a brand or product.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>Such hijacked media / are the opposite / of earned media: / an asset or campaign / becomes hostage / to consumers, other stakeholders, / or activists / who make negative allegations / about a brand or product.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>这种被劫持的媒体 / 是相反的 / 对于赚得媒体：/ 一项资产或活动 / 成为人质 / 对于消费者、其他利益相关者、/ 或活动家 / 他们做出负面指控 / 关于品牌或产品。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把“相反”两边的对象放在一起：<\/p>\n<blockquote>\n<p>这种被劫持的媒体与赚得媒体相反<\/p>\n<\/blockquote>\n<p>“成为人质”要接出受谁控制，三个对象并列保留：<\/p>\n<blockquote>\n<p>成为消费者、其他利益相关者或活动家的人质<\/p>\n<\/blockquote>\n<p>再把负面指控针对的对象放回动作前：<\/p>\n<blockquote>\n<p>他们对品牌或产品做出负面指控<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>这种被劫持的媒体与赚得媒体相反\n一项资产或活动成为消费者、其他利益相关者或活动家的人质\n他们对品牌或产品做出负面指控<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>被劫持的媒体与赚得媒体相反，资产或活动成了人质。<\/p>\n<\/blockquote>\n<p>先说两种媒体的相反关系，再用冒号解释被劫持是什么样。解释中先放“资产或活动”，再说它成为谁的人质；最后接“他们对品牌或产品做出负面指控”，把这些人做的事交代完整。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>这种被劫持的媒体对于赚得媒体是相反的：一项资产或活动成为消费者、其他利益相关者或活动家的人质，他们做出关于品牌或产品的负面指控。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“对于赚得媒体是相反的”改成“与赚得媒体相反”，把中文中比较双方的搭配接顺。<\/li>\n<li>“做出关于品牌或产品的负面指控”改成“对品牌或产品做出负面指控”，先交代指控针对谁，表达更自然。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>这种被劫持的媒体与赚得媒体相反：一项资产或活动成为消费者、其他利益相关者或活动家的人质，他们对品牌或产品做出负面指控。<\/p>\n<\/blockquote>\n<h3>6. 第4段第3句<\/h3>\n<h4>原文<\/h4>\n<blockquote>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<h4>第一步：划分意群<\/h4>\n<blockquote>\n<p>Toyota Motor, / for example, / alleviated some of the damage / from its recall crisis / earlier this year / with a relatively quick / and well-orchestrated / social-media response campaign, / which included efforts / to engage with consumers directly / on sites / such as Twitter / and the social-news site Digg.<\/p>\n<\/blockquote>\n<h4>第二步：逐个意群直译<\/h4>\n<blockquote>\n<p>丰田汽车，/ 例如，/ 减轻了一些损害 / 从其召回危机 / 今年早些时候 / 通过相对快速 / 且精心策划的 / 社交媒体回应活动，/ 包括努力 / 直接与消费者互动 / 在网站上 / 比如推特 / 和社交新闻网站Digg。<\/p>\n<\/blockquote>\n<h4>第三步：按照中文语感合并意群<\/h4>\n<p>先把时间、危机和损害接成一块，保留“部分”的限制：<\/p>\n<blockquote>\n<p>今年早些时候召回危机造成的一些损害<\/p>\n<\/blockquote>\n<p>再合并回应活动的两个特点：<\/p>\n<blockquote>\n<p>相对快速且精心策划的社交媒体回应活动<\/p>\n<\/blockquote>\n<p>最后把网站例子与互动方式接到动作前面：<\/p>\n<blockquote>\n<p>在推特和社交新闻网站Digg等网站上直接与消费者互动的努力<\/p>\n<\/blockquote>\n<p>先得到：<\/p>\n<blockquote>\n<p>例如，丰田汽车通过相对快速且精心策划的社交媒体回应活动\n减轻了今年早些时候召回危机造成的一些损害\n活动包括在推特和Digg等网站上直接与消费者互动的努力<\/p>\n<\/blockquote>\n<h4>第四步：寻找句子骨干并按照中文语序调整<\/h4>\n<p>接着找中文句子的骨干：<\/p>\n<blockquote>\n<p>丰田汽车通过回应活动减轻了一些损害。<\/p>\n<\/blockquote>\n<p>先把“例如”放在句首，说明这里是举例；“通过……”交代办法，放到“减轻了”前面。“今年早些时候召回危机造成的”放在“损害”前，说明损害来源。最后另接“其中包括……”，补充这项回应活动做了什么，网站位置放在“直接与消费者互动”之前。<\/p>\n<p>按照中文语序调整后是：<\/p>\n<blockquote>\n<p>例如，丰田汽车通过一项相对快速且精心策划的社交媒体回应活动，减轻了来自今年早些时候召回危机的一些损害，其中包括在推特和社交新闻网站Digg等网站上直接与消费者互动的努力。<\/p>\n<\/blockquote>\n<h4>第五步：艺术加工<\/h4>\n<p>第四步已经把意思说明白了，接下来让表达更加准确、自然：<\/p>\n<ul>\n<li>“来自……危机的一些损害”改成“……危机造成的一些损害”，把中文中危机与损害的关系接顺。<\/li>\n<li>“通过一项……活动”可省去“一项”；“相对”和“一些”仍保留，分别限制回应速度和损害减轻的程度。<\/li>\n<\/ul>\n<p>参考译文：<\/p>\n<blockquote>\n<p>例如，丰田汽车通过相对快速且精心策划的社交媒体回应活动，减轻了今年早些时候召回危机造成的一些损害，其中包括在推特和社交新闻网站Digg等网站上直接与消费者互动的努力。<\/p>\n<\/blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升<\/h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。<\/p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：<\/p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；<\/li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；<\/li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。<\/li>\n<\/ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：<\/p>\n<ul>\n<li><strong>定位比对：<\/strong>检查选项有没有准确改写局部原文；<\/li>\n<li><strong>写作视角：<\/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；<\/li>\n<li><strong>全文主旨：<\/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。<\/li>\n<\/ul>\n<p>命题人的命题手法主要有三类，如下：<\/p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意<\/h2><h3>定义<\/h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。<\/p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：<\/p>\n<ul>\n<li>肯定改成否定；<\/li>\n<li>原因改成结果；<\/li>\n<li>目的改成原因；<\/li>\n<li>主体或对象偷换；<\/li>\n<li>时间范围改变；<\/li>\n<li>程度扩大或缩小；<\/li>\n<li>动词词义改变；<\/li>\n<li>语法结构改变；<\/li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。<\/p>\n<p>所以这一类不能只问：<\/p>\n<blockquote>\n<p>这个词文章里有没有？<\/p>\n<\/blockquote>\n<p>而要问：<\/p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答<\/h2><h3>定义<\/h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。<\/p>\n<p>它错的不是“原文没这么说”，而是：<\/p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。<\/strong><\/p>\n<\/blockquote>\n<p>常见情况包括：<\/p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；<\/li>\n<li>题目问全文主旨，选项只是某一段的内容；<\/li>\n<li>题目问例子作用，选项只是例子内部发生了什么；<\/li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；<\/li>\n<li>题目限定某一段，选项出处却在其他段；<\/li>\n<li>题目问论点，选项给的是论据；<\/li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。<\/p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：<\/p>\n<blockquote>\n<p>这个选项能不能准确回答题干？<\/p>\n<\/blockquote>\n<p>所以这一类最常见的错误脑回路是：<\/p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。<\/p>\n<\/blockquote>\n<p>真正应该继续追问：<\/p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？<\/p>\n<\/blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有<\/h2><h3>定义<\/h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。<\/p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。<\/p>\n<p>在本篇文章里，常见的脑补包括：<\/p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；<\/li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；<\/li>\n<li>原文有研究耗能，脑补出已经造成严重后果；<\/li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；<\/li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；<\/li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；<\/li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。<\/li>\n<\/ul>\n<p>这一类的关键是：<\/p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。<\/strong><\/p>\n<\/blockquote>\n<h3>典型误选脑回路<\/h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：<\/p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。<\/p>\n<\/blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。<\/p>\n<p>无中生有的分析不能只写：<\/p>\n<blockquote>\n<p>原文没提，所以错。<\/p>\n<\/blockquote>\n<p>而要写清楚：<\/p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。<\/p>\n<\/blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：<\/p>\n<p>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。<\/p>\n<h2>35题<\/h2>\n<p><strong>Which of the following is the text mainly about?<\/strong><\/p>\n<p>本文主要讨论什么？<\/p>\n<p>这是全文作者观点 / 全文主旨题。<\/p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。<\/p>\n<p>选项：<\/p>\n<p>A. <strong>Alternatives to conventional paid media.<\/strong><\/p>\n<p>传统付费媒体之外的多种营销媒体形式。<\/p>\n<p>B. <strong>Conflict between hijacked and earned media.<\/strong><\/p>\n<p>被劫持媒体与赢得媒体之间的冲突。<\/p>\n<p>C. <strong>Dominance of hijacked media.<\/strong><\/p>\n<p>被劫持媒体的主导地位。<\/p>\n<p>D. <strong>Popularity of owned media.<\/strong><\/p>\n<p>自有媒体的流行。<\/p>\n<h3>用写作视角确定主旨的方法分析每个选项<\/h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>这一段在说什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>第1段<\/td>\n<td>传统付费媒体仍重要，但营销影响已来自更多形式<\/td>\n<td>先说原来的单一路径不够了<\/td>\n<\/tr>\n<tr>\n<td>第2段<\/td>\n<td>解释自有、赢得和售卖媒体如何运作<\/td>\n<td>再把几种新做法摆出来<\/td>\n<\/tr>\n<tr>\n<td>第3段<\/td>\n<td>说明新传播选择也可能被消费者劫持并伤害品牌<\/td>\n<td>接着提醒新做法也会反过来<\/td>\n<\/tr>\n<tr>\n<td>第4段<\/td>\n<td>用Toyota说明公司怎样回应被劫持媒体<\/td>\n<td>最后说出了问题怎样应对<\/td>\n<\/tr>\n<\/tbody><\/table>\n<hr>\n<p><strong>Which of the following is the text mainly about?<\/strong><\/p>\n<h3>A. Alternatives to conventional paid media.<\/h3>\n<p>传统付费媒体之外的多种营销媒体形式。<\/p>\n<h4>如果 A 是主旨，文章4段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>传统付费媒体之外的多种营销媒体形式。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 A 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>第1段<\/td>\n<td>说明仅靠购买广告已经不能涵盖影响消费者购买的全部途径，引出企业还可以利用的多种营销媒体形式<\/td>\n<td>先说原来的单一路径不够了<\/td>\n<\/tr>\n<tr>\n<td>第2段<\/td>\n<td>分别介绍消费者自愿传播、企业经营自有渠道和向其他营销者出售媒介空间的做法，讲清几种付费广告之外的形式怎样运作<\/td>\n<td>再把几种新做法摆出来<\/td>\n<\/tr>\n<tr>\n<td>第3段<\/td>\n<td>说明这些新传播途径在扩大营销选择的同时，也会被消费者用来散布负面指控，使原本能帮助品牌的媒体反过来伤害品牌<\/td>\n<td>接着提醒新做法也会反过来<\/td>\n<\/tr>\n<tr>\n<td>第4段<\/td>\n<td>针对替代媒体被劫持后出现的抵制和声誉风险，展示企业怎样通过及时、有组织的直接沟通减轻损害，补全运用这些媒体时的应对办法<\/td>\n<td>最后说出了问题怎样应对<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>第1段先承认传统付费媒体仍然重要，再用<code>many alternative forms of media<\/code>引出更多选择，段末又把营销影响的来源落在<code>beyond conventional paid media<\/code>上。A的范围正好是“传统付费媒体之外还有哪些形式”，并没有说传统广告已经失效或被完全取代。<\/p>\n<p>第2段把这一范围里的内容展开：付费和自有媒体由营销者控制，赢得媒体要靠用户回应；有强大流量的自有媒体还可以吸引其他企业付费入驻，成为售卖媒体。BabyCenter的例子进一步解释这种形式的收入、信息和流量价值。这些内容都在回答不同媒体怎样运作，而不是证明某一种媒体压倒其他媒体。<\/p>\n<p>第3段以<code>The same dramatic technological changes<\/code>接回前文：带来更多选择的技术也带来风险，媒体会被消费者劫持。第4段再用Toyota说明企业怎样回应这种风险。后两段没有离开替代媒体这个中心，而是把介绍从运作和好处推进到风险与应对。因此，A能够统摄四段，也能解释文章为什么这样展开。<\/p>\n<p>判断：<\/p>\n<p><strong>A 保留。<\/strong><\/p>\n<hr>\n<p><strong>Which of the following is the text mainly about?<\/strong><\/p>\n<h3>B. Conflict between hijacked and earned media.<\/h3>\n<p>被劫持媒体与赢得媒体之间的冲突。<\/p>\n<h4>如果 B 是主旨，文章4段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>被劫持媒体与赢得媒体之间的冲突。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 B 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>第1段<\/td>\n<td>说明仅靠投放广告已经无法处理消费者正面推荐与负面动员之间的对抗，把赢得媒体与被劫持媒体的冲突确立为企业面对的新问题<\/td>\n<td>先说原来的单一路径不够了<\/td>\n<\/tr>\n<tr>\n<td>第2段<\/td>\n<td>摆出发动用户推荐、建立品牌交流渠道和组织对负面号召的回应几种新做法，逐一说明它们怎样介入两类媒体之间的冲突<\/td>\n<td>再把几种新做法摆出来<\/td>\n<\/tr>\n<tr>\n<td>第3段<\/td>\n<td>说明原本用于积累正面口碑的新活动也会被负面动员者接管，使赢得媒体的推荐受到被劫持媒体的攻击，推动双方冲突加剧<\/td>\n<td>接着提醒新做法也会反过来<\/td>\n<\/tr>\n<tr>\n<td>第4段<\/td>\n<td>展示企业在负面动员压过正面推荐后如何回应指控、恢复支持者的传播，以此说明怎样缓解赢得媒体与被劫持媒体之间的冲突<\/td>\n<td>最后说出了问题怎样应对<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>B把全文中心限定为两类媒体之间的冲突。它不只是要求文中出现<code>hijacked media<\/code>和<code>earned media<\/code>，还要求作者围绕二者如何对抗、对抗怎样发展以及怎样处理这场冲突来组织全文。<\/p>\n<p>实际第1段并未提出两类媒体的对抗，而是在传统付费广告之外并列引出赢得媒体与自有媒体。第2段的大量内容用于说明自有媒体怎样转为售卖媒体，以及其他营销者入驻的好处；这些信息并不是在安排赢得媒体与被劫持媒体之间的交锋。<\/p>\n<p>第3段的<code>the opposite of earned media<\/code>确实容易让人想到B，但后面的解释是：本来可能带来正面口碑的媒体资产或活动，如今成为负面指控的载体。这里是在对照两类传播对品牌的作用方向，不能直接改写成两类媒体彼此发生冲突。第4段中Toyota回应的也是消费者的负面压力，作者没有继续讲正面推荐与负面动员双方如何争夺。因此，B既缩窄了全文范围，又在“作用相反”之外多加了“彼此冲突”这层关系。<\/p>\n<p>判断：<\/p>\n<p><strong>B 不保留。<\/strong><\/p>\n<hr>\n<p><strong>Which of the following is the text mainly about?<\/strong><\/p>\n<h3>C. Dominance of hijacked media.<\/h3>\n<p>被劫持媒体的主导地位。<\/p>\n<h4>如果 C 是主旨，文章4段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>被劫持媒体的主导地位。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 C 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>第1段<\/td>\n<td>说明只靠购买广告已难以决定公众对品牌的看法，因为被劫持媒体正在主导品牌传播，企业必须围绕这一主导力量调整营销<\/td>\n<td>先说原来的单一路径不够了<\/td>\n<\/tr>\n<tr>\n<td>第2段<\/td>\n<td>摆出自有渠道澄清、发动用户支持和在其他平台组织传播几种新做法，说明它们都要围绕被劫持媒体提出的议题展开，以显示其主导地位<\/td>\n<td>再把几种新做法摆出来<\/td>\n<\/tr>\n<tr>\n<td>第3段<\/td>\n<td>说明这些新做法又会被负面动员接管和放大，企业越积极传播越容易被带回对方设定的议题，进一步呈现被劫持媒体的主导作用<\/td>\n<td>接着提醒新做法也会反过来<\/td>\n<\/tr>\n<tr>\n<td>第4段<\/td>\n<td>展示企业在被劫持媒体主导舆论后如何及时回应并减少损失，同时说明应对仍须围绕这种媒体设定的问题展开<\/td>\n<td>最后说出了问题怎样应对<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>C的完整命题是被劫持媒体居于主导地位。主导并不等于其他媒体全部消失，也不等于企业完全无法减少损失；即使文章写了有效回应，也不能只凭这一点排除C。真正需要检查的是：作者有没有把其他媒体及企业行动都放在被劫持媒体主导的格局下讲述。<\/p>\n<p>实际第1段仍明确承认传统付费媒体<code>still play a major role<\/code>，随后介绍多种替代形式，没有把被劫持媒体确立为决定其他形式的中心。第2段自有、赢得和售卖媒体各自的运作也不是为了服从被劫持媒体的议题，而是在解释营销者控制、用户回应和强流量变现等不同机制。<\/p>\n<p>第3段确实写到表达变得更快、更显眼、更具破坏性，但这些比较说明的是技术增加了负面传播的风险，不能推出这种传播已在全部媒体中占主导地位。第4段的Toyota例子承接这个风险，说明怎样减轻损害，也没有论证被劫持媒体支配其他营销形式。C把后半篇讨论的一种重要风险抬高为全文的支配力量，所需的地位判断没有得到文章支持。<\/p>\n<p>判断：<\/p>\n<p><strong>C 不保留。<\/strong><\/p>\n<hr>\n<p><strong>Which of the following is the text mainly about?<\/strong><\/p>\n<h3>D. Popularity of owned media.<\/h3>\n<p>自有媒体的流行。<\/p>\n<h4>如果 D 是主旨，文章4段应该怎么写？<\/h4>\n<p>如果全文主旨真的是：<\/p>\n<p>自有媒体的流行。<\/p>\n<p>那文章4段应该大概这样展开：<\/p>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>如果 D 对，这段应该写什么<\/th>\n<th>逻辑<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>第1段<\/td>\n<td>说明仅购买广告已不能满足企业直接联系用户的需要，越来越多企业因而采用自己经营的媒体，把自有媒体的流行作为新变化引出<\/td>\n<td>先说原来的单一路径不够了<\/td>\n<\/tr>\n<tr>\n<td>第2段<\/td>\n<td>摆出企业网站、订阅邮件和自营用户社区几种新做法，通过各类企业的广泛采用展示自有媒体流行的具体表现<\/td>\n<td>再把几种新做法摆出来<\/td>\n<\/tr>\n<tr>\n<td>第3段<\/td>\n<td>说明随着自有媒体广泛使用和用户聚集，这些新渠道也更容易被消费者拿来传播负面意见，揭示自有媒体流行伴随的反向风险<\/td>\n<td>接着提醒新做法也会反过来<\/td>\n<\/tr>\n<tr>\n<td>第4段<\/td>\n<td>展示广泛使用自有网站和订阅邮件的企业如何及时回应负面意见、恢复渠道信誉，说明自有媒体普及后出现问题应怎样处理<\/td>\n<td>最后说出了问题怎样应对<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>D只说自有媒体流行，并没有说它最受欢迎或必将取代其他媒体。流行的事物也可以有风险，所以不能因为后半篇出现负面内容，就认为它一定与D矛盾。假如D是主旨，四段的介绍、风险和应对都应持续围绕自有媒体的广泛采用展开。<\/p>\n<p>实际第1段只是把自有媒体作为多种替代形式之一，用向注册用户发送邮件说明它怎样使用；同段还并列介绍消费者创造的赢得媒体。第2段虽然多次出现<code>owned media<\/code>，重点却是它怎样成为其他营销者的付费媒体，即售卖媒体的定义和运作。<code>This trend<\/code>承接的是前面这种售卖媒体的发展，不能直接拿来证明整篇都在讲自有媒体流行。<\/p>\n<p>第3段把范围拉到技术增加的多种沟通选择，以及媒体被劫持的共同风险，没有限定为自有媒体因普及而出现的问题。第4段Toyota通过Twitter和Digg直接接触消费者，也不是在展示自有媒体有多流行。D抓住了前两段的一类媒体，却不能统摄其他形式，更没有把“广泛采用”这项判断贯穿全文。<\/p>\n<p>判断：<\/p>\n<p><strong>D 不保留。<\/strong><\/p>\n<hr>\n<h3>35题结论<\/h3>\n<p><strong>35. A. Alternatives to conventional paid media.<\/strong><\/p>\n<p>这句话就是本文后续做题的主旨底牌：<\/p>\n<p><strong>Alternatives to conventional paid media / 传统付费媒体之外的多种营销媒体形式。<\/strong><\/p>\n<h2>31题<\/h2>\n<blockquote>\n<p>Consumers may create “earned” media when they are ______.<br>消费者在什么情况下可能创造“赢得媒体”？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道概念细节题。题干用<code>Consumers<\/code>限定行动者，用<code>create “earned” media<\/code>限定媒体类型，问的是消费者通过什么态度和行动形成赢得媒体；不能把同段中公司运用另一种媒体的方式直接移过来。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<p>这个并列句分开介绍两种媒体。前半句的主体是热爱某产品的消费者，动作是自愿把产品推荐给朋友，形成的是<code>earned media<\/code>；后半句的主体是公司，动作是向网站注册客户发邮件，运用的是<code>owned media<\/code>。题干所问的产生条件在前半句，<code>passionate about a product<\/code>说明消费者喜欢什么，<code>by willingly promoting it to friends<\/code>说明他们怎样把这种喜欢变成传播。<\/p>\n<h3>A. obsessed with online shopping at certain Web sites<\/h3>\n<blockquote>\n<p>沉迷于在某些网站上购物<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时原文的<code>willingly<\/code>被<code>[xxx]<\/code>遮挡，但能读懂消费者<code>promoting it to friends<\/code>；A中的网站让人联想到同段内容，比较后发现自己购物不等于向朋友推荐，而且热爱的对象也从产品变成网站购物，第一轮排除A。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A保留“消费者对某事很热衷”的外形，却把原文的热爱产品、向朋友推广改成沉迷于在特定网站购物。原文中的网站属于后半句公司发邮件的场景，不能用来把前半句的传播行为改写为购物行为。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>消费者沉迷于在某些网站上购物时，可能创造“赢得媒体”。<\/p>\n<\/blockquote>\n<p>题干的<code>Consumers<\/code>和<code>earned media<\/code>同时出现在定义句的前半句，所以需要读清两者之间由什么动作连接；A的<code>Web sites<\/code>虽然能在后半句找到相近字样，但那个网站属于公司向注册客户发邮件的场景。<\/p>\n<p>出处先说消费者<code>passionate about a product<\/code>，再说他们<code>by willingly promoting it to friends<\/code>创造赢得媒体。前一部分交代对产品的喜爱，后一部分交代自愿传播；这两部分共同构成题干所问的条件。<\/p>\n<p>原文和A的主体都是消费者，但对象和动作不同。原文喜欢的是产品，并把产品推荐给别人；A沉迷的是特定网站上的购物，写的是消费者自己的购买活动。一个人反复买东西，并不就意味着他向其他人传播了产品信息。<\/p>\n<p><code>may create<\/code>只表示这种主动推荐可能形成赢得媒体，没有说所有购物者都会成为推荐者。A需要额外补出“在网上购物后便向别人推荐”这一步，原文没有建立这种必然或通常的连接。<\/p>\n<p>A把“消费者自愿向朋友推广所喜爱的产品”换成了“消费者自己沉迷网上购物”，丢掉了定义中把个人喜爱变成对外传播的关键动作。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文介绍消费者创造赢得媒体时是这样写的：<\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<p>消费者自愿向朋友推广产品，可以形成赢得媒体；公司向注册客户发邮件，则是在运用自有媒体。<\/p>\n<\/blockquote>\n<p>作者用两个并列分句区分信息由谁发出、发给谁。消费者这一边的后续动作是推荐给朋友，公司这一边才出现网站注册与邮件发送，文章没有把消费者留在个人购物活动里。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Consumers obsessed with shopping at certain Web sites may create “earned” media through their purchases there.<\/p>\n<p>沉迷于在某些网站购物的消费者，可能通过在这些网站上的购买创造赢得媒体。<\/p>\n<\/blockquote>\n<p>假设写法必须让购物本身承担形成媒体传播的作用，才能支持A。实际写法却专门保留<code>promoting it to friends<\/code>，把消费者的信息传递写成产生条件；网站则放在另一种媒体的介绍中，两条推进方式不同。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认消费者创造的“赢得媒体”属于传统付费媒体之外的形式，不能判断消费者沉迷某些网站购物是否就是它的产生条件。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>obsessed with online shopping at certain Web sites<br>沉迷于在某些网站上购物<\/p>\n<\/blockquote>\n<p>全文介绍的是营销信息怎样通过不同媒体传播，A却只写消费者自己的购物活动。购物可以发生在这个媒体环境中，但身处这种环境与主动形成一种传播方式不是同一件事，主旨也没有把任何网购行为都归为赢得媒体。<\/p>\n<p>本项最终仍要根据“by willingly promoting it to friends”这处局部原文判断。它要求消费者把产品信息传给朋友，A没有保留这一动作，不能用“网上购物也与营销有关”补足。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. inspired by product-promoting e-mails sent to them<\/h3>\n<blockquote>\n<p>受到发给他们的产品推广邮件的激发<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时看见同段确有公司发送产品推广邮件，但该分句的媒体名称是<code>owned media<\/code>，题干问的却是消费者创造的<code>earned media<\/code>；区分公司主动发邮件与消费者主动传播后，第一轮排除B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用后半句真实的推广邮件场景，却把公司运用自有媒体的行为改成消费者创造赢得媒体的条件。原文只说公司向注册客户发出提醒，没有说收到邮件的客户受到激发，更没有把收信这一动作写成赢得媒体的定义。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>消费者受到发给他们的产品推广邮件的激发时，可能创造“赢得媒体”。<\/p>\n<\/blockquote>\n<p><code>earned media<\/code>把题干定位到并列句前半句，B中的<code>e-mails<\/code>则对应后半句的<code>e-mail alerts<\/code>。两处在同一句里，却分别受<code>Consumers<\/code>和<code>a company<\/code>支配，必须先看发起动作的人是谁。<\/p>\n<p>出处前半句说消费者自愿向朋友推荐产品，后半句说公司通过向注册客户发送提醒来运用自有媒体。前者的信息从消费者发往朋友，后者的信息从公司发往客户；B取用了后者的邮件，却把它放回前者的媒体名称下。<\/p>\n<p>原文中，公司是邮件发送者，消费者在这一关系中只是接收者。题干却要求消费者怎样创造媒体传播，单纯受到邮件影响没有交代消费者随后把信息传给了谁，也没有完成原文的<code>promoting it to friends<\/code>。<\/p>\n<p>收到推广邮件后，一个人可能进一步向朋友推荐，也可能只自己看完。文章没有在两个并列分句之间写出“邮件先激发消费者，再由消费者创造赢得媒体”的因果关系，不能把可能发生的后续情节当成既有定义。<\/p>\n<p>B把“公司发邮件运用自有媒体”改成“消费者因收到邮件而创造赢得媒体”，混合了两种媒体的行动主体、传播方向与产生条件。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文接着比较媒体控制权时是这样写的：<\/p>\n<blockquote>\n<p>Paid and owned media are controlled by marketers promoting their own products.<\/p>\n<p>For earned media, such marketers act as the initiator for users&#39; responses.<\/p>\n<p>付费媒体和自有媒体由营销者控制；在赢得媒体中，营销者是用户回应的发起者。<\/p>\n<\/blockquote>\n<p>作者继续区分公司控制的传播与用户作出的回应，说明两者可能有关联，却不能被当作同一个动作。第1段的发邮件属于公司运用自己的渠道，消费者创造赢得媒体还需要自己对外传播。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Consumers may create “earned” media when promotional e-mails sent to them inspire them to respond.<\/p>\n<p>当发给消费者的推广邮件激发他们作出回应时，他们可能创造赢得媒体。<\/p>\n<\/blockquote>\n<p>假设写法必须让客户接受邮件后的心理反应足以构成赢得媒体。实际文章却把消费者主动推荐与公司发邮件分列，并继续比较媒体控制权，没有省掉用户对外传播这一步。公司发起某种活动，也不表示客户收到信息就已经完成了赢得媒体的传播。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认消费者创造的“赢得媒体”是多种替代形式之一，不能判断收到推广邮件后的激发是否就是创造这种媒体的条件。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>inspired by product-promoting e-mails sent to them<br>受到发给他们的产品推广邮件的激发<\/p>\n<\/blockquote>\n<p>介绍多种媒体形式，意味着同属营销活动的动作仍需要分清类别。B中的邮件确实落在文章讨论范围里，但“与主题有关”不能把公司运用自有渠道自动变成消费者创造赢得媒体。<\/p>\n<p>本项最终仍要根据“by willingly promoting it to friends”与“owned media”这处局部原文判断：前者是消费者主动推荐，后者才对应公司邮件。B在没有消费者继续传播的情况下移用了另一个分句的产生方式。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. eager to help their friends promote quality products<\/h3>\n<blockquote>\n<p>急于帮助他们的朋友推广优质产品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C与原文都出现朋友、推广和产品，但把<code>promote it to friends<\/code>与<code>help friends promote it<\/code>接成完整动作后，发现前者是推荐给朋友，后者是帮助朋友去推广；朋友的角色发生变化，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了定义句中的<code>friends<\/code>、<code>promote<\/code>和<code>product<\/code>，却把朋友从推广信息的接收者变成得到帮助的推广者。它还把消费者主观喜欢的产品改成具有客观质量判断的优质产品，原文并未以产品质量高低定义赢得媒体。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>消费者急于帮助他们的朋友推广优质产品时，可能创造“赢得媒体”。<\/p>\n<\/blockquote>\n<p>题干的<code>Consumers<\/code>与<code>earned media<\/code>对应前半句，C的<code>friends<\/code>和<code>promote<\/code>也都在这里。定位之后真正需要比较的是<code>to friends<\/code>与<code>help their friends promote<\/code>，不能因为名词和动词熟悉就略过它们之间的关系。<\/p>\n<p>出处先确定消费者热爱一种产品，再用<code>by willingly promoting it to friends<\/code>说明创造赢得媒体的方式。<code>it<\/code>指前面的产品，<code>to friends<\/code>说明推荐的接收者；句子没有另起一层“朋友要推广，所以消费者帮助他们”。<\/p>\n<p>原文的动作可以读成“我把产品推荐给朋友”，C则是“我帮助朋友推广产品”。前者中的朋友接收信息，后者中的朋友已经承担推广活动，消费者提供帮助。两种情况可能都涉及传播，但不是同一个被定义的关系。<\/p>\n<p><code>passionate about a product<\/code>描述消费者的喜爱，不评价产品客观上是否优质。消费者可能热爱某产品，并不需要作者先证明该产品质量高；C的<code>quality<\/code>又多加了一项定义里没有的要求。<\/p>\n<p>C虽然复用了朋友、产品和推广，却改动了朋友在动作中的角色，并把主观喜爱换成产品质量，不能作为原文这一产生条件的同义表达。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文介绍赢得媒体的实际写法是：<\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<p>作者先写消费者把自己喜欢的产品推荐给朋友，再转向公司向客户发邮件的另一种形式。<\/p>\n<\/blockquote>\n<p>作者对消费者这一边的说明停在“推荐给朋友”，随后就切换公司这一主体。朋友没有被安排为另一个需要帮助的推广者，文章也没有从产品质量论证消费者为何帮助朋友。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Consumers may create “earned” media by eagerly helping their friends promote quality products to other people.<\/p>\n<p>消费者急于帮助朋友把优质产品推广给其他人，由此可能创造赢得媒体。<\/p>\n<\/blockquote>\n<p>假设写法需要把朋友放进推广者的位置，并增加朋友向其他人推广的动作。实际写法只把朋友列为接收者，消费者的热情也指向产品本身；角色安排和推荐的去向都没有沿着C的方式展开。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认“赢得媒体”是一种由消费者参与形成的替代媒体，不能判断消费者是在向朋友推荐，还是在帮助朋友向别人推广。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>eager to help their friends promote quality products<br>急于帮助他们的朋友推广优质产品<\/p>\n<\/blockquote>\n<p>两种动作都可以被笼统地说成参与产品传播，所以仅凭“多种营销媒体”这个范围无法排除其中一种。题目问的是文章给出的具体产生条件，必须看清消费者和朋友在这个条件里各做什么。<\/p>\n<p>本项最终仍要根据“promoting it to friends”这处局部原文判断。这里的朋友接收推荐，C却让朋友成为被帮助的推广者；全文介绍多种传播形式，并不允许随意交换某一种形式内部的角色。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<h3>D. enthusiastic about recommending their favorite products<\/h3>\n<blockquote>\n<p>热衷于推荐自己喜爱的产品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的<code>enthusiastic<\/code>显示为<code>[xxx]<\/code>，原文的<code>willingly<\/code>也被遮挡；凭<code>passionate about a product<\/code>与<code>promoting it to friends<\/code>，能把喜爱产品和主动推荐接起来，因此先保留D，A、B、C排除后选择D，并非先认出了被遮挡的态度词。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>D把原文分开的两层意思合成一个短语：<code>passionate about a product<\/code>对应喜爱产品，<code>willingly promoting it to friends<\/code>对应热衷于向别人推荐。<code>enthusiastic<\/code>补全为热情积极，<code>recommending<\/code>用推荐改写推广，消费者、产品与主动传播的方向保持不变。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>消费者热衷于推荐自己喜爱的产品时，可能创造“赢得媒体”。<\/p>\n<\/blockquote>\n<p><code>Consumers<\/code>与<code>earned media<\/code>把范围锁定在定义句前半句；D中的<code>their favorite products<\/code>对应消费者热爱的产品，<code>recommending<\/code>对应原文向朋友推广产品的动作。<\/p>\n<p>出处先用<code>passionate about a product<\/code>交代消费者对产品有热情，再用<code>by willingly promoting it to friends<\/code>交代这种热情怎样变成自愿传播。D把这两个部分合并，保留“喜欢产品，因此愿意推荐”的态度与行为组合。<\/p>\n<p>原文的主体是消费者，推荐对象是他们热爱的产品，接收者是朋友；D接回题干后主体仍是消费者，动作仍是对外推荐。<code>favorite<\/code>没有要求这些产品经过客观质量认证，只表达消费者自己喜欢它们，与<code>passionate about<\/code>相接。<\/p>\n<p><code>enthusiastic<\/code>说明对推荐有热情，<code>willingly<\/code>说明推广出于自愿，两者与原文已有的产品热情共同支持D。题干保留了<code>may<\/code>，没有把这种推荐说成每次都会产生同样效果，也没有加入必须付费或先收到邮件的条件。<\/p>\n<p>D用“热衷于推荐喜爱产品”收拢原文“热爱产品＋自愿向朋友推广”，同义变化发生在表达方式上，没有更换信息的发出者、对象或传播方向。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文先承认传统广告仍然重要，随后这样介绍替代形式：<\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<p>消费者可以自愿向朋友推广产品，公司则可以向注册客户发邮件，两种动作分别形成或运用不同媒体。<\/p>\n<\/blockquote>\n<p>作者给消费者安排的是主动推荐这一传播角色，再与公司利用自己的渠道作比较。这使“传统广告之外还有哪些办法”落到具体行动上，D对应的就是消费者主动参与的这一种。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Consumers who are enthusiastic about recommending their favorite products to friends may create “earned” media through those recommendations.<\/p>\n<p>热衷于向朋友推荐自己喜爱产品的消费者，可能通过这些推荐创造赢得媒体。<\/p>\n<\/blockquote>\n<p>D所需要的写法正是文章已有的推进：先交代对产品的热情，再写自愿向朋友推荐。假设写法只是把两个分开的说明合在一起，无须增加新的购买情节、邮件刺激或朋友推广活动。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认消费者创造的“赢得媒体”属于传统付费媒体之外的形式，不能单靠主旨确定其具体条件是否为热衷推荐喜爱的产品。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>enthusiastic about recommending their favorite products<br>热衷于推荐自己喜爱的产品<\/p>\n<\/blockquote>\n<p>D把消费者写成主动的信息传播者，这与全文介绍传统广告之外的传播途径可以衔接；但“热爱产品并自愿推荐”这一具体条件仍来自定义句，不能只由标题推出。<\/p>\n<p>本项最终仍要根据“passionate about a product”与“by willingly promoting it to friends”这处局部原文判断。前者对应喜爱产品，后者对应热情推荐，两部分共同支持D，也解释了消费者怎样参与一种替代媒体。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<h3>31题结论<\/h3>\n<blockquote>\n<p><strong>31. D. enthusiastic about recommending their favorite products<\/strong><\/p>\n<\/blockquote>\n<p>A把消费者向朋友推广产品改成了自己沉迷网站购物，丢掉了对外传播这一动作。<\/p>\n<p>B借用公司发推广邮件的自有媒体场景，把它改成消费者创造赢得媒体的条件。<\/p>\n<p>C把接收推荐的朋友改成得到消费者帮助的推广者，颠倒了动作关系。<\/p>\n<p>D用热衷推荐喜爱产品，准确合并消费者热爱产品并自愿向朋友推广这两层信息。<\/p>\n<h2>32题<\/h2>\n<blockquote>\n<p>According to Paragraph 2, sold media feature ______.<br>根据第2段，售卖媒体具有什么特征？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道概念细节题。<code>According to Paragraph 2<\/code>限定第2段，<code>sold media feature<\/code>要求找出这一媒体类别的特征。要先读作者对售卖媒体的定义，再看后面的例子怎样落实定义，不能把网站上出现的某个词或自己对运作形式的感受当成定义。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>But in some cases, one marketer&#39;s owned media become another marketer&#39;s paid media – for instance, when an e-commerce retailer sells ad space on its Web site.<\/p>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<p>第一句交代自有媒体怎样成为别人的付费媒体，并以电商零售商出售网站广告位为例；第二句用<code>We define<\/code>正式定义售卖媒体，说明自有媒体的流量很强，强到吸引其他组织把内容或电商引擎放进来。题干的特征与<code>whose traffic is so strong<\/code>对应，后面的结果从句说明这种流量为什么能支持售卖。<\/p>\n<h3>A. a safe business environment<\/h3>\n<blockquote>\n<p>安全的商业环境<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>environment<\/code>能接到定义句的<code>within that environment<\/code>，但看清其他组织入驻是由强流量引出的结果后，没有找到安全、保护或低风险的评价，第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借用了定义句末尾的<code>environment<\/code>，又从其他组织愿意进入这个环境补出“环境安全”。原文给出的吸引条件是流量强，没有评价这个场所的安全性；有人愿意入驻也不自动等于风险低。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是安全的商业环境。<\/p>\n<\/blockquote>\n<p>题干的<code>sold media<\/code>出现在<code>We define such sold media<\/code>中，<code>feature<\/code>对应后面用来定义它的特征。A的<code>environment<\/code>位于结果从句末尾，指其他组织放置内容或电商引擎的这个自有媒体空间。<\/p>\n<p>出处先写<code>whose traffic is so strong<\/code>，再用<code>that<\/code>引出其他组织入驻。作者是在解释网站为什么能吸引其他公司的内容与服务，已经把强流量放在解释原因的位置，没有在<code>environment<\/code>前后加入安全性说明。<\/p>\n<p>原文中的环境是内容放在哪里的场所，A则把它改成被评价的对象，并添加<code>safe<\/code>。这个形容词需要风险低、受到保护或交易有保障等事实支持，不能由“有组织愿意进入”直接推出。<\/p>\n<p>其他公司可能因为曝光量大而使用某个平台，即使仍需承担风险。原文只规定这类媒体具有吸引入驻的流量条件，没有说流量越大环境越安全，也没有说售卖媒体能替入驻者消除风险。<\/p>\n<p>A从真实的媒体环境和入驻行为中补出了未经说明的安全评价，越过了原文已经明确给出的强流量特征。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文在介绍BabyCenter后这样说明其他营销者入驻的作用：<\/p>\n<blockquote>\n<p>Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies&#39; marketing, and may help expand user traffic for all companies concerned.<\/p>\n<p>其他营销者的加入可以带来收入，让网站显得客观，提供学习他人营销的信息，并可能扩大相关公司的用户流量。<\/p>\n<\/blockquote>\n<p>作者沿着入驻的收入、外观、信息和流量作用继续解释，没有转而谈安全保障。即使<code>seem objective<\/code>也只是看起来客观，不等于安全可靠。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Other organizations place their content within this environment because it offers protection from business risks and provides a safe place to operate.<\/p>\n<p>其他组织把内容放进来，是因为这个环境能防范商业风险，为经营提供安全场所。<\/p>\n<\/blockquote>\n<p>假设写法需要增加风险防护或安全保障，才能把入驻与<code>safe<\/code>连接起来。实际文章把强流量写为吸引条件，后续补充的也是收益和营销信息，没有转向A所需的保障关系。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认第2段在介绍售卖媒体这种形式及其运作特点，不能判断这种媒体是否提供安全的商业环境。<\/p>\n<\/blockquote>\n<p>但A实际说的是：<\/p>\n<blockquote>\n<p>a safe business environment<br>安全的商业环境<\/p>\n<\/blockquote>\n<p>介绍一种替代媒体，并不等于给它作安全担保。A所问及的风险评价不包含在“多种营销媒体形式”这个主旨中，也不能因为这种形式有商业用途就补上安全属性。<\/p>\n<p>本项最终仍要根据“whose traffic is so strong”这处局部原文判断。定义写的是吸引其他组织入驻的流量，<code>within that environment<\/code>仅交代入驻地点，没有提供A需要的安全评价。<\/p>\n<p><strong>复盘判断：A错误。<\/strong><\/p>\n<h3>B. random competition<\/h3>\n<blockquote>\n<p>随机竞争<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时能把<code>competition<\/code>联想到BabyCenter推广<code>competitive products<\/code>，但原文并没有说这些产品无计划、偶然或随机出现；区分有竞争产品与竞争是随机的后，第一轮排除B。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>B借用了例子中的<code>competitive products<\/code>，却补出了<code>random<\/code>这一安排方式，再把它概括为整类售卖媒体的特征。原文说平台可以推广互补甚至竞争性产品，没有说明内容如何随机分配，也没有把随机竞争写进定义。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<p>Johnson &amp; Johnson, for example, has created BabyCenter, a stand-alone media property that promotes complementary and even competitive products.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是随机竞争。<\/p>\n<\/blockquote>\n<p>题干的<code>sold media<\/code>先对应定义句；B的<code>competition<\/code>则让人转向后面的BabyCenter例子，其中<code>competitive products<\/code>说明这个媒体可以推广与自身产品有竞争关系的产品。必须同时查看定义与例子，不能停在相近词上。<\/p>\n<p>第一处出处把强流量写为其他组织放入内容的条件；第二处出处说明BabyCenter推广互补甚至竞争性产品。前者解释售卖媒体怎样形成，后者展示可以容纳哪些产品，都没有介绍随机选择或随机竞争。<\/p>\n<p><code>competitive<\/code>描述产品之间的竞争关系，<code>random<\/code>描述事情的安排是否随机。一个平台推广竞争性产品，可以是经营者主动选择的结果，也可能出于多种具体考虑，原文没有交代，不能只由产品相互竞争来决定安排方式。<\/p>\n<p>题干还问整类媒体的特征，例子中的竞争性产品并不代表每一种售卖媒体都有这种产品。更不用说B增加的随机性，在定义句和例子中都没有依据。<\/p>\n<p>B把“某个平台推广竞争性产品”扩写成“售卖媒体具有随机竞争”，新增了随机这一属性，也没有回答定义中最明确的强流量特征。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文在BabyCenter的例子后这样继续写：<\/p>\n<blockquote>\n<p>Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies&#39; marketing, and may help expand user traffic for all companies concerned.<\/p>\n<p>作者接着解释其他营销者入驻能带来的收入、客观印象、学习机会和流量增长。<\/p>\n<\/blockquote>\n<p>文章用这个例子说明容纳其他营销者可能产生的具体好处，顺着商业合作与媒体使用继续推进，没有把竞争场面写成无计划或偶然发生。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>On sold media, competing products appear through random selection, so competition among marketers is organized without a planned pattern.<\/p>\n<p>在售卖媒体上，竞争产品通过随机选择出现，因此营销者之间的竞争没有预定安排。<\/p>\n<\/blockquote>\n<p>假设写法必须补出内容如何被随机选择，以及这种选择如何让竞争具有随机性。实际后文讨论的是入驻带来的作用，既没有随机机制，也没有对竞争安排作这种评价，不能用<code>competitive<\/code>一个词替B完成整条推断。<\/p>\n<h4>主旨交叉验证法<\/h4>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认售卖媒体是传统付费媒体之外介绍的一种形式，不能判断这类媒体中的竞争是否随机。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>random competition<br>随机竞争<\/p>\n<\/blockquote>\n<p>主旨要求看清各类媒体怎样运作，不会自动给其中的竞争加上“随机”这一性质。即使竞争产品出现在某个例子里，也要先有关于随机安排的具体证据，才能用它回答特征。<\/p>\n<p>本项最终仍要根据“competitive products”与“whose traffic is so strong”这处局部原文判断：前者只交代产品关系，后者才给定义性特征，两处都没有B增加的随机属性。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<h3>C. strong user traffic<\/h3>\n<blockquote>\n<p>强大的用户流量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的<code>strong<\/code>显示为<code>[xxx]<\/code>，但<code>user traffic<\/code>能接到定义句，原文的<code>so strong<\/code>及吸引其他组织进驻的结果也可读懂，因此第一轮保留C，与D一起暂存；读完全文后回查，C对应定义中的流量条件，D只是对形式的宽泛感受，最终选择C。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>C把定义句的<code>owned media whose traffic is so strong<\/code>压缩成“强大的用户流量”。定义句中的强流量吸引其他组织放入内容或电商引擎，后文又用<code>user traffic<\/code>说明入驻可能继续扩大流量，因此这里的<code>traffic<\/code>指用户访问流量。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<p>Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies&#39; marketing, and may help expand user traffic for all companies concerned.<\/p>\n<\/blockquote>\n<h4>定位比对法<\/h4>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是强大的用户流量。<\/p>\n<\/blockquote>\n<p><code>sold media<\/code>与<code>feature<\/code>把题干指向<code>We define such sold media<\/code>之后的定义，C的<code>traffic<\/code>对应<code>whose traffic is so strong<\/code>。段末的<code>user traffic<\/code>还说明这里谈的是网站用户访问量，并非交通工具的通行量。<\/p>\n<p>第一处出处直接写出流量强，并用其他组织愿意放入内容或电商引擎作为结果；第二处出处补充其他营销者入驻后，可能帮助所有相关公司进一步扩大用户流量。前一句确立特征，后一句说明运作后可能带来的收益。<\/p>\n<p>原文的<code>whose<\/code>修饰自有媒体，说明强流量属于承载其他组织内容的平台。C把这个定语从句变成名词短语，接在<code>feature<\/code>之后，媒体类别、流量对象与强弱程度均保持一致。<\/p>\n<p>需要分清两次出现的流量关系：先有强流量，才吸引其他组织进入；进入以后，又可能进一步扩大流量。C只概括原有特征，没有把“可能继续扩大”说成每个网站都会增长，也没有把后果倒置成唯一原因。<\/p>\n<p>C用<code>strong user traffic<\/code>直接概括定义里的强流量，并保留了这种流量对售卖媒体成立的意义：平台有足够吸引力，其他组织才愿意借用它触达用户。<\/p>\n<h4>写作视角法<\/h4>\n<p>原文先举零售商售卖广告位的情况，再作定义：<\/p>\n<blockquote>\n<p>But in some cases, one marketer&#39;s owned media become another marketer&#39;s paid media – for instance, when an e-commerce retailer sells ad space on its Web site.<\/p>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<p>自有网站可以向其他营销者出售使用空间，作者随后用强流量解释为什么其他组织会把内容放进来。<\/p>\n<\/blockquote>\n<p>文章从媒体之间的转化走到吸引入驻的条件，再给BabyCenter例子和后续收益。强流量位于定义的中心，承担着连接“自有平台”与“他人使用这个平台”的解释作用。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Sold media feature strong user traffic, which attracts other organizations to place their content or e-commerce engines on these owned platforms.<\/p>\n<p>售卖媒体具有强大的用户流量，
