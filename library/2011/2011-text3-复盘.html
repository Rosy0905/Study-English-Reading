<p>假设写法必须让客户接受邮件后的心理反应足以构成赢得媒体。实际文章却把消费者主动推荐与公司发邮件分列，并继续比较媒体控制权，没有省掉用户对外传播这一步。公司发起某种活动，也不表示客户收到信息就已经完成了赢得媒体的传播。<\/p>\n<\/section>"},{"title":"B. inspired by product-promoting e-mails sent to them","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Alternatives to conventional paid media  \n> 传统付费媒体之外的多种营销媒体形式。\n\n把这个主旨直接代入31题题干：\n\n> 全文主旨只能确认消费者创造的“赢得媒体”是多种替代形式之一，不能判断收到推广邮件后的激发是否就是创造这种媒体的条件。\n\n但B实际说的是：\n\n> inspired by product-promoting e-mails sent to them  \n> 受到发给他们的产品推广邮件的激发\n\n介绍多种媒体形式，意味着同属营销活动的动作仍需要分清类别。B中的邮件确实落在文章讨论范围里，但“与主题有关”不能把公司运用自有渠道自动变成消费者创造赢得媒体。\n\n本项最终仍要根据“by willingly promoting it to friends”与“owned media”这处局部原文判断：前者是消费者主动推荐，后者才对应公司邮件。B在没有消费者继续传播的情况下移用了另一个分句的产生方式。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 B选项","focus":[93,197,1125,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":31,"option":"B","cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q31-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-B-0\"><blockquote>\n<p>受到发给他们的产品推广邮件的激发<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时看见同段确有公司发送产品推广邮件，但该分句的媒体名称是<code>owned media<\/code>，题干问的却是消费者创造的<code>earned media<\/code>；区分公司主动发邮件与消费者主动传播后，第一轮排除B。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用后半句真实的推广邮件场景，却把公司运用自有媒体的行为改成消费者创造赢得媒体的条件。原文只说公司向注册客户发出提醒，没有说收到邮件的客户受到激发，更没有把收信这一动作写成赢得媒体的定义。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>消费者受到发给他们的产品推广邮件的激发时，可能创造“赢得媒体”。<\/p>\n<\/blockquote>\n<p><code>earned media<\/code>把题干定位到并列句前半句，B中的<code>e-mails<\/code>则对应后半句的<code>e-mail alerts<\/code>。两处在同一句里，却分别受<code>Consumers<\/code>和<code>a company<\/code>支配，必须先看发起动作的人是谁。<\/p>\n<p>出处前半句说消费者自愿向朋友推荐产品，后半句说公司通过向注册客户发送提醒来运用自有媒体。前者的信息从消费者发往朋友，后者的信息从公司发往客户；B取用了后者的邮件，却把它放回前者的媒体名称下。<\/p>\n<p>原文中，公司是邮件发送者，消费者在这一关系中只是接收者。题干却要求消费者怎样创造媒体传播，单纯受到邮件影响没有交代消费者随后把信息传给了谁，也没有完成原文的<code>promoting it to friends<\/code>。<\/p>\n<p>收到推广邮件后，一个人可能进一步向朋友推荐，也可能只自己看完。文章没有在两个并列分句之间写出“邮件先激发消费者，再由消费者创造赢得媒体”的因果关系，不能把可能发生的后续情节当成既有定义。<\/p>\n<p>B把“公司发邮件运用自有媒体”改成“消费者因收到邮件而创造赢得媒体”，混合了两种媒体的行动主体、传播方向与产生条件。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-B-2\"><h3>写作视角法<\/h3>\n<p>原文接着比较媒体控制权时是这样写的：<\/p>\n<blockquote>\n<p>Paid and owned media are controlled by marketers promoting their own products.<\/p>\n<p>For earned media, such marketers act as the initiator for users&#39; responses.<\/p>\n<p>付费媒体和自有媒体由营销者控制；在赢得媒体中，营销者是用户回应的发起者。<\/p>\n<\/blockquote>\n<p>作者继续区分公司控制的传播与用户作出的回应，说明两者可能有关联，却不能被当作同一个动作。第1段的发邮件属于公司运用自己的渠道，消费者创造赢得媒体还需要自己对外传播。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Consumers may create “earned” media when promotional e-mails sent to them inspire them to respond.<\/p>\n<p>当发给消费者的推广邮件激发他们作出回应时，他们可能创造赢得媒体。<\/p>\n<\/blockquote>\n<p>假设写法必须让客户接受邮件后的心理反应足以构成赢得媒体。实际文章却把消费者主动推荐与公司发邮件分列，并继续比较媒体控制权，没有省掉用户对外传播这一步。公司发起某种活动，也不表示客户收到信息就已经完成了赢得媒体的传播。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认消费者创造的“赢得媒体”是多种替代形式之一，不能判断收到推广邮件后的激发是否就是创造这种媒体的条件。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>inspired by product-promoting e-mails sent to them<br>受到发给他们的产品推广邮件的激发<\/p>\n<\/blockquote>\n<p>介绍多种媒体形式，意味着同属营销活动的动作仍需要分清类别。B中的邮件确实落在文章讨论范围里，但“与主题有关”不能把公司运用自有渠道自动变成消费者创造赢得媒体。<\/p>\n<p>本项最终仍要根据“by willingly promoting it to friends”与“owned media”这处局部原文判断：前者是消费者主动推荐，后者才对应公司邮件。B在没有消费者继续传播的情况下移用了另一个分句的产生方式。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. eager to help their friends promote quality products","raw":"### C. eager to help their friends promote quality products\n\n> 急于帮助他们的朋友推广优质产品\n\n**做题模式中的状态：** 当时C与原文都出现朋友、推广和产品，但把`promote it to friends`与`help friends promote it`接成完整动作后，发现前者是推荐给朋友，后者是帮助朋友去推广；朋友的角色发生变化，第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\nC借用了定义句中的`friends`、`promote`和`product`，却把朋友从推广信息的接收者变成得到帮助的推广者。它还把消费者主观喜欢的产品改成具有客观质量判断的优质产品，原文并未以产品质量高低定义赢得媒体。\n\n**出处：**\n\n> Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,285,1125,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q31-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>急于帮助他们的朋友推广优质产品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C与原文都出现朋友、推广和产品，但把<code>promote it to friends<\/code>与<code>help friends promote it<\/code>接成完整动作后，发现前者是推荐给朋友，后者是帮助朋友去推广；朋友的角色发生变化，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了定义句中的<code>friends<\/code>、<code>promote<\/code>和<code>product<\/code>，却把朋友从推广信息的接收者变成得到帮助的推广者。它还把消费者主观喜欢的产品改成具有客观质量判断的优质产品，原文并未以产品质量高低定义赢得媒体。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. eager to help their friends promote quality products","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 消费者急于帮助他们的朋友推广优质产品时，可能创造“赢得媒体”。\n\n题干的`Consumers`与`earned media`对应前半句，C的`friends`和`promote`也都在这里。定位之后真正需要比较的是`to friends`与`help their friends promote`，不能因为名词和动词熟悉就略过它们之间的关系。\n\n出处先确定消费者热爱一种产品，再用`by willingly promoting it to friends`说明创造赢得媒体的方式。`it`指前面的产品，`to friends`说明推荐的接收者；句子没有另起一层“朋友要推广，所以消费者帮助他们”。\n\n原文的动作可以读成“我把产品推荐给朋友”，C则是“我帮助朋友推广产品”。前者中的朋友接收信息，后者中的朋友已经承担推广活动，消费者提供帮助。两种情况可能都涉及传播，但不是同一个被定义的关系。\n\n`passionate about a product`描述消费者的喜爱，不评价产品客观上是否优质。消费者可能热爱某产品，并不需要作者先证明该产品质量高；C的`quality`又多加了一项定义里没有的要求。\n\nC虽然复用了朋友、产品和推广，却改动了朋友在动作中的角色，并把主观喜爱换成产品质量，不能作为原文这一产生条件的同义表达。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,285,1125,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q31-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>急于帮助他们的朋友推广优质产品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C与原文都出现朋友、推广和产品，但把<code>promote it to friends<\/code>与<code>help friends promote it<\/code>接成完整动作后，发现前者是推荐给朋友，后者是帮助朋友去推广；朋友的角色发生变化，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了定义句中的<code>friends<\/code>、<code>promote<\/code>和<code>product<\/code>，却把朋友从推广信息的接收者变成得到帮助的推广者。它还把消费者主观喜欢的产品改成具有客观质量判断的优质产品，原文并未以产品质量高低定义赢得媒体。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>消费者急于帮助他们的朋友推广优质产品时，可能创造“赢得媒体”。<\/p>\n<\/blockquote>\n<p>题干的<code>Consumers<\/code>与<code>earned media<\/code>对应前半句，C的<code>friends<\/code>和<code>promote<\/code>也都在这里。定位之后真正需要比较的是<code>to friends<\/code>与<code>help their friends promote<\/code>，不能因为名词和动词熟悉就略过它们之间的关系。<\/p>\n<p>出处先确定消费者热爱一种产品，再用<code>by willingly promoting it to friends<\/code>说明创造赢得媒体的方式。<code>it<\/code>指前面的产品，<code>to friends<\/code>说明推荐的接收者；句子没有另起一层“朋友要推广，所以消费者帮助他们”。<\/p>\n<p>原文的动作可以读成“我把产品推荐给朋友”，C则是“我帮助朋友推广产品”。前者中的朋友接收信息，后者中的朋友已经承担推广活动，消费者提供帮助。两种情况可能都涉及传播，但不是同一个被定义的关系。<\/p>\n<p><code>passionate about a product<\/code>描述消费者的喜爱，不评价产品客观上是否优质。消费者可能热爱某产品，并不需要作者先证明该产品质量高；C的<code>quality<\/code>又多加了一项定义里没有的要求。<\/p>\n<p>C虽然复用了朋友、产品和推广，却改动了朋友在动作中的角色，并把主观喜爱换成产品质量，不能作为原文这一产生条件的同义表达。<\/p>\n<\/section>"},{"title":"C. eager to help their friends promote quality products","raw":"#### 写作视角法\n\n原文介绍赢得媒体的实际写法是：\n\n> Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.\n>\n> 作者先写消费者把自己喜欢的产品推荐给朋友，再转向公司向客户发邮件的另一种形式。\n\n作者对消费者这一边的说明停在“推荐给朋友”，随后就切换公司这一主体。朋友没有被安排为另一个需要帮助的推广者，文章也没有从产品质量论证消费者为何帮助朋友。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Consumers may create “earned” media by eagerly helping their friends promote quality products to other people.\n>\n> 消费者急于帮助朋友把优质产品推广给其他人，由此可能创造赢得媒体。\n\n假设写法需要把朋友放进推广者的位置，并增加朋友向其他人推广的动作。实际写法只把朋友列为接收者，消费者的热情也指向产品本身；角色安排和推荐的去向都没有沿着C的方式展开。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,285,1125,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q31-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>急于帮助他们的朋友推广优质产品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C与原文都出现朋友、推广和产品，但把<code>promote it to friends<\/code>与<code>help friends promote it<\/code>接成完整动作后，发现前者是推荐给朋友，后者是帮助朋友去推广；朋友的角色发生变化，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了定义句中的<code>friends<\/code>、<code>promote<\/code>和<code>product<\/code>，却把朋友从推广信 进推广者的位置，并增加朋友向其他人推广的动作。实际写法只把朋友列为接收者，消费者的热情也指向产品本身；角色安排和推荐的去向都没有沿着C的方式展开。<\/p>\n<\/section>"},{"title":"C. eager to help their friends promote quality products","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Alternatives to conventional paid media  \n> 传统付费媒体之外的多种营销媒体形式。\n\n把这个主旨直接代入31题题干：\n\n> 全文主旨只能确认“赢得媒体”是一种由消费者参与形成的替代媒体，不能判断消费者是在向朋友推荐，还是在帮助朋友向别人推广。\n\n但C实际说的是：\n\n> eager to help their friends promote quality products  \n> 急于帮助他们的朋友推广优质产品\n\n两种动作都可以被笼统地说成参与产品传播，所以仅凭“多种营销媒体”这个范围无法排除其中一种。题目问的是文章给出的具体产生条件，必须看清消费者和朋友在这个条件里各做什么。\n\n本项最终仍要根据“promoting it to friends”这处局部原文判断。这里的朋友接收推荐，C却让朋友成为被帮助的推广者；全文介绍多种传播形式，并不允许随意交换某一种形式内部的角色。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 C选项","focus":[94,285,1125,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":31,"option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q31-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-C-0\"><blockquote>\n<p>急于帮助他们的朋友推广优质产品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C与原文都出现朋友、推广和产品，但把<code>promote it to friends<\/code>与<code>help friends promote it<\/code>接成完整动作后，发现前者是推荐给朋友，后者是帮助朋友去推广；朋友的角色发生变化，第一轮排除C。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>C借用了定义句中的<code>friends<\/code>、<code>promote<\/code>和<code>product<\/code>，却把朋友从推广信息的接收者变成得到帮助的推广者。它还把消费者主观喜欢的产品改成具有客观质量判断的优质产品，原文并未以产品质量高低定义赢得媒体。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>消费者急于帮助他们的朋友推广优质产品时，可能创造“赢得媒体”。<\/p>\n<\/blockquote>\n<p>题干的<code>Consumers<\/code>与<code>earned media<\/code>对应前半句，C的<code>friends<\/code>和<code>promote<\/code>也都在这里。定位之后真正需要比较的是<code>to friends<\/code>与<code>help their friends promote<\/code>，不能因为名词和动词熟悉就略过它们之间的关系。<\/p>\n<p>出处先确定消费者热爱一种产品，再用<code>by willingly promoting it to friends<\/code>说明创造赢得媒体的方式。<code>it<\/code>指前面的产品，<code>to friends<\/code>说明推荐的接收者；句子没有另起一层“朋友要推广，所以消费者帮助他们”。<\/p>\n<p>原文的动作可以读成“我把产品推荐给朋友”，C则是“我帮助朋友推广产品”。前者中的朋友接收信息，后者中的朋友已经承担推广活动，消费者提供帮助。两种情况可能都涉及传播，但不是同一个被定义的关系。<\/p>\n<p><code>passionate about a product<\/code>描述消费者的喜爱，不评价产品客观上是否优质。消费者可能热爱某产品，并不需要作者先证明该产品质量高；C的<code>quality<\/code>又多加了一项定义里没有的要求。<\/p>\n<p>C虽然复用了朋友、产品和推广，却改动了朋友在动作中的角色，并把主观喜爱换成产品质量，不能作为原文这一产生条件的同义表达。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-C-2\"><h3>写作视角法<\/h3>\n<p>原文介绍赢得媒体的实际写法是：<\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<p>作者先写消费者把自己喜欢的产品推荐给朋友，再转向公司向客户发邮件的另一种形式。<\/p>\n<\/blockquote>\n<p>作者对消费者这一边的说明停在“推荐给朋友”，随后就切换公司这一主体。朋友没有被安排为另一个需要帮助的推广者，文章也没有从产品质量论证消费者为何帮助朋友。<\/p>\n<p>如果C真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Consumers may create “earned” media by eagerly helping their friends promote quality products to other people.<\/p>\n<p>消费者急于帮助朋友把优质产品推广给其他人，由此可能创造赢得媒体。<\/p>\n<\/blockquote>\n<p>假设写法需要把朋友放进推广者的位置，并增加朋友向其他人推广的动作。实际写法只把朋友列为接收者，消费者的热情也指向产品本身；角色安排和推荐的去向都没有沿着C的方式展开。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认“赢得媒体”是一种由消费者参与形成的替代媒体，不能判断消费者是在向朋友推荐，还是在帮助朋友向别人推广。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>eager to help their friends promote quality products<br>急于帮助他们的朋友推广优质产品<\/p>\n<\/blockquote>\n<p>两种动作都可以被笼统地说成参与产品传播，所以仅凭“多种营销媒体”这个范围无法排除其中一种。题目问的是文章给出的具体产生条件，必须看清消费者和朋友在这个条件里各做什么。<\/p>\n<p>本项最终仍要根据“promoting it to friends”这处局部原文判断。这里的朋友接收推荐，C却让朋友成为被帮助的推广者；全文介绍多种传播形式，并不允许随意交换某一种形式内部的角色。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. enthusiastic about recommending their favorite products","raw":"### D. enthusiastic about recommending their favorite products\n\n> 热衷于推荐自己喜爱的产品\n\n**做题模式中的状态：** 当时D的`enthusiastic`显示为`[xxx]`，原文的`willingly`也被遮挡；凭`passionate about a product`与`promoting it to friends`，能把喜爱产品和主动推荐接起来，因此先保留D，A、B、C排除后选择D，并非先认出了被遮挡的态度词。\n\n**选项类型：正确同义改写。**\n\nD把原文分开的两层意思合成一个短语：`passionate about a product`对应喜爱产品，`willingly promoting it to friends`对应热衷于向别人推荐。`enthusiastic`补全为热情积极，`recommending`用推荐改写推广，消费者、产品与主动传播的方向保持不变。\n\n**出处：**\n\n> Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[93,373,1215,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":31,"option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q31-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>热衷于推荐自己喜爱的产品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的<code>enthusiastic<\/code>显示为<code>[xxx]<\/code>，原文的<code>willingly<\/code>也被遮挡；凭<code>passionate about a product<\/code>与<code>promoting it to friends<\/code>，能把喜爱产品和主动推荐接起来，因此先保留D，A、B、C排除后选择D，并非先认出了被遮挡的态度词。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>D把原文分开的两层意思合成一个短语：<code>passionate about a product<\/code>对应喜爱产品，<code>willingly promoting it to friends<\/code>对应热衷于向别人推荐。<code>enthusiastic<\/code>补全为热情积极，<code>recommending<\/code>用推荐改写推广，消费者、产品与主动传播的方向保持不变。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. enthusiastic about recommending their favorite products","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 消费者热衷于推荐自己喜爱的产品时，可能创造“赢得媒体”。\n\n`Consumers`与`earned media`把范围锁定在定义句前半句；D中的`their favorite products`对应消费者热爱的产品，`recommending`对应原文向朋友推广产品的动作。\n\n出处先用`passionate about a product`交代消费者对产品有热情，再用`by willingly promoting it to friends`交代这种热情怎样变成自愿传播。D把这两个部分合并，保留“喜欢产品，因此愿意推荐”的态度与行为组合。\n\n原文的主体是消费者，推荐对象是他们热爱的产品，接收者是朋友；D接回题干后主体仍是消费者，动作仍是对外推荐。`favorite`没有要求这些产品经过客观质量认证，只表达消费者自己喜欢它们，与`passionate about`相接。\n\n`enthusiastic`说明对推荐有热情，`willingly`说明推广出于自愿，两者与原文已有的产品热情共同支持D。题干保留了`may`，没有把这种推荐说成每次都会产生同样效果，也没有加入必须付费或先收到邮件的条件。\n\nD用“热衷于推荐喜爱产品”收拢原文“热爱产品＋自愿向朋友推广”，同义变化发生在表达方式上，没有更换信息的发出者、对象或传播方向。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[93,373,1215,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":31,"option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q31-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q31-D-0\"><blockquote>\n<p>热衷于推荐自己喜爱的产品<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的<code>enthusiastic<\/code>显示为<code>[xxx]<\/code>，原文的<code>willingly<\/code>也被遮挡；凭<code>passionate about a product<\/code>与<code>promoting it to friends<\/code>，能把喜爱产品和主动推荐接起来，因此先保留D，A、B、C排除后选择D，并非先认出了被遮挡的态度词。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>D把原文分开的两层意思合成一个短语：<code>passionate about a product<\/code>对应喜爱产品，<code>willingly promoting it to friends<\/code>对应热衷于向别人推荐。<code>enthusiastic<\/code>补全为热情积极，<code>recommending<\/code>用推荐改写推广，消费者、产品与主动传播的方向保持不变。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>消费者热衷于推荐自己喜爱的产品时，可能创造“赢得媒体”。<\/p>\n<\/blockquote>\n<p><code>Consumers<\/code>与<code>earned media<\/code>把范围锁定在定义句前半句；D中的<code>their favorite products<\/code>对应消费者热爱的产品，<code>recommending<\/code>对应原文向朋友推广产品的动作。<\/p>\n<p>出处先用<code>passionate about a product<\/code>交代消费者对产品有热情，再用<code>by willingly promoting it to friends<\/code>交代这种热情怎样变成自愿传播。D把这两个部分合并，保留“喜欢产品，因此愿意推荐”的态度与行为组合。<\/p>\n<p>原文的主体是消费者，推荐对象是他们热爱的产品，接收者是朋友；D接回题干后主体仍是消费者，动作仍是对外推荐。<code>favorite<\/code>没有要求这些产品经过客观质量认证，只表达消费者自己喜欢它们，与<code>passionate about<\/code>相接。<\/p>\n<p><code>enthusiastic<\/code>说明对推荐有热情，<code>willingly<\/code>说明推广出于自愿，两者与原文已有的产品热情共同支持D。题干保留了<code>may<\/code>，没有把这种推荐说成每次都会产生同样效果，也没有加入必须付费或先收到邮件的条件。<\/p>\n<p>D用“热衷于推荐喜爱产品”收拢原文“热爱产品＋自愿向朋友推广”，同义变化发生在表达方式上，没有更换信息的发出者、对象或传播方向。<\/p>\n<\/section>"},{"title":"D. enthusiastic about recommending their favorite products","raw":"#### 写作视角法\n\n原文先承认传统广告仍然重要，随后这样介绍替代形式：\n\n> Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.\n>\n> 消费者可以自愿向朋友推广产品，公司则可以向注册客户发邮件，两种动作分别形成或运用不同媒体。\n\n作者给消费者安排的是主动推荐这一传播角色，再与公司利用自己的渠道作比较。这使“传统广告之外还有哪些办法”落到具体行动上，D对应的就是消费者主动参与的这一种。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Consumers who are enthusiastic about recommending their favorite products to friends may create “earned” media through those recommendations.\n>\n> 热衷于向朋友推荐自己喜爱产品的消费者，可能通过这些推荐创造赢得媒体。\n\nD所需要的写法正是文章已有的推进：先交代对产品的热情，再写自愿向朋友推荐。假设写法只是把两个分开的说明合在一起，无须增加新的购买情节、邮件刺激或朋友推广活动。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题 D选项","focus":[93,373,1215,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method" kquote>\n<p>作者给消费者安排的是主动推荐这一传播角色，再与公司利用自己的渠道作比较。这使“传统广告之外还有哪些办法”落到具体行动上，D对应的就是消费者主动参与的这一种。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Consumers who are enthusiastic about recommending their favorite products to friends may create “earned” media through those recommendations.<\/p>\n<p>热衷于向朋友推荐自己喜爱产品的消费者，可能通过这些推荐创造赢得媒体。<\/p>\n<\/blockquote>\n<p>D所需要的写法正是文章已有的推进：先交代对产品的热情，再写自愿向朋友推荐。假设写法只是把两个分开的说明合在一起，无须增加新的购买情节、邮件刺激或朋友推广活动。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q31-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入31题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认消费者创造的“赢得媒体”属于传统付费媒体之外的形式，不能单靠主旨确定其具体条件是否为热衷推荐喜爱的产品。<\/p>\n<\/blockquote>\n<p>D实际说的是：<\/p>\n<blockquote>\n<p>enthusiastic about recommending their favorite products<br>热衷于推荐自己喜爱的产品<\/p>\n<\/blockquote>\n<p>D把消费者写成主动的信息传播者，这与全文介绍传统广告之外的传播途径可以衔接；但“热爱产品并自愿推荐”这一具体条件仍来自定义句，不能只由标题推出。<\/p>\n<p>本项最终仍要根据“passionate about a product”与“by willingly promoting it to friends”这处局部原文判断。前者对应喜爱产品，后者对应热情推荐，两部分共同支持D，也解释了消费者怎样参与一种替代媒体。<\/p>\n<p><strong>复盘判断：D正确。<\/strong><\/p>\n<\/section>"},{"title":"31题结论","raw":"### 31题结论\n\n> **31. D. enthusiastic about recommending their favorite products**\n\nA把消费者向朋友推广产品改成了自己沉迷网站购物，丢掉了对外传播这一动作。\n\nB借用公司发推广邮件的自有媒体场景，把它改成消费者创造赢得媒体的条件。\n\nC把接收推荐的朋友改成得到消费者帮助的推广者，颠倒了动作关系。\n\nD用热衷推荐喜爱产品，准确合并消费者热爱产品并自愿向朋友推广这两层信息。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[18,18,1376,423],"sourceW":1432,"sourceH":2573},"meta":{"kind":"conclusion","question":31},"level":3,"html":"<blockquote>\n<p><strong>31. D. enthusiastic about recommending their favorite products<\/strong><\/p>\n<\/blockquote>\n<p>A把消费者向朋友推广产品改成了自己沉迷网站购物，丢掉了对外传播这一动作。<\/p>\n<p>B借用公司发推广邮件的自有媒体场景，把它改成消费者创造赢得媒体的条件。<\/p>\n<p>C把接收推荐的朋友改成得到消费者帮助的推广者，颠倒了动作关系。<\/p>\n<p>D用热衷推荐喜爱产品，准确合并消费者热爱产品并自愿向朋友推广这两层信息。<\/p>\n"},{"title":"32题 · 题干、题型与核心出处","raw":"## 32题\n\n> According to Paragraph 2, sold media feature ______.  \n> 根据第2段，售卖媒体具有什么特征？\n\n### 题型\n\n这是一道概念细节题。`According to Paragraph 2`限定第2段，`sold media feature`要求找出这一媒体类别的特征。要先读作者对售卖媒体的定义，再看后面的例子怎样落实定义，不能把网站上出现的某个词或自己对运作形式的感受当成定义。\n\n### 核心出处\n\n> But in some cases, one marketer's owned media become another marketer's paid media – for instance, when an e-commerce retailer sells ad space on its Web site.\n>\n> We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.\n\n第一句交代自有媒体怎样成为别人的付费媒体，并以电商零售商出售网站广告位为例；第二句用`We define`正式定义售卖媒体，说明自有媒体的流量很强，强到吸引其他组织把内容或电商引擎放进来。题干的特征与`whose traffic is so strong`对应，后面的结果从句说明这种流量为什么能支持售卖。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[18,549,1028,421],"sourceW":1432,"sourceH":2573},"meta":{"kind":"question","question":32},"level":2,"html":"<blockquote>\n<p>According to Paragraph 2, sold media feature ______.<br>根据第2段，售卖媒体具有什么特征？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>这是一道概念细节题。<code>According to Paragraph 2<\/code>限定第2段，<code>sold media feature<\/code>要求找出这一媒体类别的特征。要先读作者对售卖媒体的定义，再看后面的例子怎样落实定义，不能把网站上出现的某个词或自己对运作形式的感受当成定义。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>But in some cases, one marketer&#39;s owned media become another marketer&#39;s paid media – for instance, when an e-commerce retailer sells ad space on its Web site.<\/p>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<p>第一句交代自有媒体怎样成为别人的付费媒体，并以电商零售商出售网站广告位为例；第二句用<code>We define<\/code>正式定义售卖媒体，说明自有媒体的流量很强，强到吸引其他组织把内容或电商引擎放进来。题干的特征与<code>whose traffic is so strong<\/code>对应，后面的结果从句说明这种流量为什么能支持售卖。<\/p>\n"},{"title":"A. a safe business environment","raw":"### A. a safe business environment\n\n> 安全的商业环境\n\n**做题模式中的状态：** 当时A的`environment`能接到定义句的`within that environment`，但看清其他组织入驻是由强流量引出的结果后，没有找到安全、保护或低风险的评价，第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\nA借用了定义句末尾的`environment`，又从其他组织愿意进入这个环境补出“环境安全”。原文给出的吸引条件是流量强，没有评价这个场所的安全性；有人愿意入驻也不自动等于风险低。\n\n**出处：**\n\n> We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,637,651,58],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q32-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>安全的商业环境<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>environment<\/code>能接到定义句的<code>within that environment<\/code>，但看清其他组织入驻是由强流量引出的结果后，没有找到安全、保护或低风险的评价，第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借用了定义句末尾的<code>environment<\/code>，又从其他组织愿意进入这个环境补出“环境安全”。原文给出的吸引条件是流量强，没有评价这个场所的安全性；有人愿意入驻也不自动等于风险低。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. a safe business environment","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第2段，售卖媒体的特征是安全的商业环境。\n\n题干的`sold media`出现在`We define such sold media`中，`feature`对应后面用来定义它的特征。A的`environment`位于结果从句末尾，指其他组织放置内容或电商引擎的这个自有媒体空间。\n\n出处先写`whose traffic is so strong`，再用`that`引出其他组织入驻。作者是在解释网站为什么能吸引其他公司的内容与服务，已经把强流量放在解释原因的位置，没有在`environment`前后加入安全性说明。\n\n原文中的环境是内容放在哪里的场所，A则把它改成被评价的对象，并添加`safe`。这个形容词需要风险低、受到保护或交易有保障等事实支持，不能由“有组织愿意进入”直接推出。\n\n其他公司可能因为曝光量大而使用某个平台，即使仍需承担风险。原文只规定这类媒体具有吸引入驻的流量条件，没有说流量越大环境越安全，也没有说售卖媒体能替入驻者消除风险。\n\nA从真实的媒体环境和入驻行为中补出了未经说明的安全评价，越过了原文已经明确给出的强流量特征。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,637,651,58],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q32-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>安全的商业环境<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>environment<\/code>能接到定义句的<code>within that environment<\/code>，但看清其他组织入驻是由强流量引出的结果后，没有找到安全、保护或低风险的评价，第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借用了定义句末尾的<code>environment<\/code>，又从其他组织愿意进入这个环境补出“环境安全”。原文给出的吸引条件是流量强，没有评价这个场所的安全性；有人愿意入驻也不自动等于风险低。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是安全的商业环境。<\/p>\n<\/blockquote>\n<p>题干的<code>sold media<\/code>出现在<code>We define such sold media<\/code>中，<code>feature<\/code>对应后面用来定义它的特征。A的<code>environment<\/code>位于结果从句末尾，指其他组织放置内容或电商引擎的这个自有媒体空间。<\/p>\n<p>出处先写<code>whose traffic is so strong<\/code>，再用<code>that<\/code>引出其他组织入驻。作者是在解释网站为什么能吸引其他公司的内容与服务，已经把强流量放在解释原因的位置，没有在<code>environment<\/code>前后加入安全性说明。<\/p>\n<p>原文中的环境是内容放在哪里的场所，A则把它改成被评价的对象，并添加<code>safe<\/code>。这个形容词需要风险低、受到保护或交易有保障等事实支持，不能由“有组织愿意进入”直接推出。<\/p>\n<p>其他公司可能因为曝光量大而使用某个平台，即使仍需承担风险。原文只规定这类媒体具有吸引入驻的流量条件，没有说流量越大环境越安全，也没有说售卖媒体能替入驻者消除风险。<\/p>\n<p>A从真实的媒体环境和入驻行为中补出了未经说明的安全评价，越过了原文已经明确给出的强流量特征。<\/p>\n<\/section>"},{"title":"A. a safe business environment","raw":"#### 写作视角法\n\n原文在介绍BabyCenter后这样说明其他营销者入驻的作用：\n\n> Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies' marketing, and may help expand user traffic for all companies concerned.\n>\n> 其他营销者的加入可以带来收入，让网站显得客观，提供学习他人营销的信息，并可能扩大相关公司的用户流量。\n\n作者沿着入驻的收入、外观、信息和流量作用继续解释，没有转而谈安全保障。即使`seem objective`也只是看起来客观，不等于安全可靠。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Other organizations place their content within this environment because it offers protection from business risks and provides a safe place to operate.\n>\n> 其他组织把内容放进来，是因为这个环境能防范商业风险，为经营提供安全场所。\n\n假设写法需要增加风险防护或安全保障，才能把入驻与`safe`连接起来。实际文章把强流量写为吸引条件，后续补充的也是收益和营销信息，没有转向A所需的保障关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,637,651,58],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q32-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>安全的商业环境<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>environment<\/code>能接到定义句的<code>within that environment<\/code>，但看清其他组织入驻是由强流量引出的结果后，没有找到安全、保护或低风险的评价，第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借用了定义句末尾的<code>environment<\/code>，又从其他组织愿意进入这个环境补出“环境安全”。原文给出的吸引条件是流量强，没有评价这个场所的安全性；有人愿意入驻也不自动等于风险低。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是安全的商业环境。<\/p>\n<\/blockquote>\n<p>题干的<code>sold media<\/code>出现在<code>We define such sold media<\/code>中，<code>feature<\/code>对应后面用来定义它的特征。A的<code>environment<\/code>位于结果从句末尾，指其他组织放置内容或电商引擎的这个自有媒体空间。<\/p>\n<p>出处先写<code>whose traffic is so strong<\/code>，再用<code>that<\/code>引出其他组织入驻。作者是在解释网站为什么能吸引其他公司的内容与服务，已经把强流量放在解释原因的位置，没有在<code>environment<\/code>前后加入安全性说明。<\/p>\n<p>原文中的环境是内容放在哪里的场所，A则把它改成被评价的对象，并添加<code>safe<\/code>。这个形容词需要风险低、受到保护或交易有保障等事实支持，不能由“有组织愿意进入”直接推出。<\/p>\n<p>其他公司可能因为曝光量大而使用某个平台，即使仍需承担风险。原文只规定这类媒体具有吸引入驻的流量条件，没有说流量越大环境越安全，也没有说售卖媒体能替入驻者消除风险。<\/p>\n<p>A从真实的媒体环境和入驻行为中补出了未经说明的安全评价，越过了原文已经明确给出的强流量特征。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-2\"><h3>写作视角法<\/h3>\n<p>原文在介绍BabyCenter后这样说明其他营销者入驻的作用：<\/p>\n<blockquote>\n<p>Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies&#39; marketing, and may help expand user traffic for all companies concerned.<\/p>\n<p>其他营销者的加入可以带来收入，让网站显得客观，提供学习他人营销的信息，并可能扩大相关公司的用户流量。<\/p>\n<\/blockquote>\n<p>作者沿着入驻的收入、外观、信息和流量作用继续解释，没有转而谈安全保障。即使<code>seem objective<\/code>也只是看起来客观，不等于安全可靠。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Other organizations place their content within this environment because it offers protection from business risks and provides a safe place to operate.<\/p>\n<p>其他组织把内容放进来，是因为这个环境能防范商业风险，为经营提供安全场所。<\/p>\n<\/blockquote>\n<p>假设写法需要增加风险防护或安全保障，才能把入驻与<code>safe<\/code>连接起来。实际文章把强流量写为吸引条件，后续补充的也是收益和营销信息，没有转向A所需的保障关系。<\/p>\n<\/section>"},{"title":"A. a safe business environment","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Alternatives to conventional paid media  \n> 传统付费媒体之外的多种营销媒体形式。\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨只能确认第2段在介绍售卖媒体这种形式及其运作特点，不能判断这种媒体是否提供安全的商业环境。\n\n但A实际说的是：\n\n> a safe business environment  \n> 安全的商业环境\n\n介绍一种替代媒体，并不等于给它作安全担保。A所问及的风险评价不包含在“多种营销媒体形式”这个主旨中，也不能因为这种形式有商业用途就补上安全属性。\n\n本项最终仍要根据“whose traffic is so strong”这处局部原文判断。定义写的是吸引其他组织入驻的流量，`within that environment`仅交代入驻地点，没有提供A需要的安全评价。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 A选项","focus":[93,637,651,58],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":32,"option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q32-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-A-0\"><blockquote>\n<p>安全的商业环境<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>environment<\/code>能接到定义句的<code>within that environment<\/code>，但看清其他组织入驻是由强流量引出的结果后，没有找到安全、保护或低风险的评价，第一轮排除A。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>A借用了定义句末尾的<code>environment<\/code>，又从其他组织愿意进入这个环境补出“环境安全”。原文给出的吸引条件是流量强，没有评价这个场所的安全性；有人愿意入驻也不自动等于风险低。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是安全的商业环境。<\/p>\n<\/blockquote>\n<p>题干的<code>sold media<\/code>出现在<code>We define such sold media<\/code>中，<code>feature<\/code>对应后面用来定义它的特征。A的<code>environment<\/code>位于结果从句末尾，指其他组织放置内容或电商引擎的这个自有媒体空间。<\/p>\n<p>出处先写<code>whose traffic is so strong<\/code>，再用<code>that<\/code>引出其他组织入驻。作者是在解释网站为什么能吸引其他公司的内容与服务，已经把强流量放在解释原因的位置，没有在<code>environment<\/code>前后加入安全性说明。<\/p>\n<p>原文中的环境是内容放在哪里的场所，A则把它改成被评价的对象，并添加<code>safe<\/code>。这个形容词需要风险低、受到保护或交易有保障等事实支持，不能由“有组织愿意进入”直接推出。<\/p>\n<p>其他公司可能因为曝光量大而使用某个平台，即使仍需承担风险。原文只规定这类媒体具有吸引入驻的流量条件，没有说流量越大环境越安全，也没有说售卖媒体能替入驻者消除风险。<\/p>\n<p>A从真实的媒体环境和入驻行为中补出了未经说明的安全评价，越过了原文已经明确给出的强流量特征。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-A-2\"><h3>写作视角法<\/h3>\n<p>原文在介绍BabyCenter后这样说明其他营销者入驻的作用：<\/p>\n<blockquote>\n<p>Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies&#39; marketing, and may help expand user traffic for all companies concerned.<\/p>\n<p>其他营销者的加入可以带来收入，让网站显得客观，提供学习他人营销的信息，并可能扩大相关公司的用户流量。<\/p>\n<\/blockquote>\n<p>作者沿着入驻的收入、外观、信息和流量作用继续解释，没有转而谈安全保障。即使<code>seem objective<\/code>也只是看起来客观，不等于安全可靠。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Other organizations place their content within this environment because it offers protection from business risks \n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<p>Johnson &amp; Johnson, for example, has created BabyCenter, a stand-alone media property that promotes complementary and even competitive products.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是随机竞争。<\/p>\n<\/blockquote>\n<p>题干的<code>sold media<\/code>先对应定义句；B的<code>competition<\/code>则让人转向后面的BabyCenter例子，其中<code>competitive products<\/code>说明这个媒体可以推广与自身产品有竞争关系的产品。必须同时查看定义与例子，不能停在相近词上。<\/p>\n<p>第一处出处把强流量写为其他组织放入内容的条件；第二处出处说明BabyCenter推广互补甚至竞争性产品。前者解释售卖媒体怎样形成，后者展示可以容纳哪些产品，都没有介绍随机选择或随机竞争。<\/p>\n<p><code>competitive<\/code>描述产品之间的竞争关系，<code>random<\/code>描述事情的安排是否随机。一个平台推广竞争性产品，可以是经营者主动选择的结果，也可能出于多种具体考虑，原文没有交代，不能只由产品相互竞争来决定安排方式。<\/p>\n<p>题干还问整类媒体的特征，例子中的竞争性产品并不代表每一种售卖媒体都有这种产品。更不用说B增加的随机性，在定义句和例子中都没有依据。<\/p>\n<p>B把“某个平台推广竞争性产品”扩写成“售卖媒体具有随机竞争”，新增了随机这一属性，也没有回答定义中最明确的强流量特征。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-B-2\"><h3>写作视角法<\/h3>\n<p>原文在BabyCenter的例子后这样继续写：<\/p>\n<blockquote>\n<p>Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies&#39; marketing, and may help expand user traffic for all companies concerned.<\/p>\n<p>作者接着解释其他营销者入驻能带来的收入、客观印象、学习机会和流量增长。<\/p>\n<\/blockquote>\n<p>文章用这个例子说明容纳其他营销者可能产生的具体好处，顺着商业合作与媒体使用继续推进，没有把竞争场面写成无计划或偶然发生。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>On sold media, competing products appear through random selection, so competition among marketers is organized without a planned pattern.<\/p>\n<p>在售卖媒体上，竞争产品通过随机选择出现，因此营销者之间的竞争没有预定安排。<\/p>\n<\/blockquote>\n<p>假设写法必须补出内容如何被随机选择，以及这种选择如何让竞争具有随机性。实际后文讨论的是入驻带来的作用，既没有随机机制，也没有对竞争安排作这种评价，不能用<code>competitive<\/code>一个词替B完成整条推断。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认售卖媒体是传统付费媒体之外介绍的一种形式，不能判断这类媒体中的竞争是否随机。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>random competition<br>随机竞争<\/p>\n<\/blockquote>\n<p>主旨要求看清各类媒体怎样运作，不会自动给其中的竞争加上“随机”这一性质。即使竞争产品出现在某个例子里，也要先有关于随机安排的具体证据，才能用它回答特征。<\/p>\n<p>本项最终仍要根据“competitive products”与“whose traffic is so strong”这处局部原文判断：前者只交代产品关系，后者才给定义性特征，两处都没有B增加的随机属性。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. strong user traffic","raw":"### C. strong user traffic\n\n> 强大的用户流量\n\n**做题模式中的状态：** 当时C的`strong`显示为`[xxx]`，但`user traffic`能接到定义句，原文的`so strong`及吸引其他组织进驻的结果也可读懂，因此第一轮保留C，与D一起暂存；读完全文后回查，C对应定义中的流量条件，D只是对形式的宽泛感受，最终选择C。\n\n**选项类型：正确同义改写。**\n\nC把定义句的`owned media whose traffic is so strong`压缩成“强大的用户流量”。定义句中的强流量吸引其他组织放入内容或电商引擎，后文又用`user traffic`说明入驻可能继续扩大流量，因此这里的`traffic`指用户访问流量。\n\n**出处：**\n\n> We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.\n>\n> Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies' marketing, and may help expand user traffic for all companies concerned.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 C选项","focus":[94,813,438,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":32,"option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q32-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>强大的用户流量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的<code>strong<\/code>显示为<code>[xxx]<\/ fic is so strong that other organizations place their content or e-commerce engines within that environment.\n>\n> 自有网站可以向其他营销者出售使用空间，作者随后用强流量解释为什么其他组织会把内容放进来。\n\n文章从媒体之间的转化走到吸引入驻的条件，再给BabyCenter例子和后续收益。强流量位于定义的中心，承担着连接“自有平台”与“他人使用这个平台”的解释作用。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Sold media feature strong user traffic, which attracts other organizations to place their content or e-commerce engines on these owned platforms.\n>\n> 售卖媒体具有强大的用户流量，吸引其他组织把内容或电商引擎放在这些自有平台上。\n\nC所需要的写法正是原文已有的推进：先说网站空间可被他人购买使用，再以强流量说明吸引力，后文补充参与者还可能扩大流量。假设写法只把定义的重点提到句首，无须补出新的组织制度或安全条件。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 C选项","focus":[94,813,438,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":32,"option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q32-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>强大的用户流量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的<code>strong<\/code>显示为<code>[xxx]<\/code>，但<code>user traffic<\/code>能接到定义句，原文的<code>so strong<\/code>及吸引其他组织进驻的结果也可读懂，因此第一轮保留C，与D一起暂存；读完全文后回查，C对应定义中的流量条件，D只是对形式的宽泛感受，最终选择C。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>C把定义句的<code>owned media whose traffic is so strong<\/code>压缩成“强大的用户流量”。定义句中的强流量吸引其他组织放入内容或电商引擎，后文又用<code>user traffic<\/code>说明入驻可能继续扩大流量，因此这里的<code>traffic<\/code>指用户访问流量。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<p>Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies&#39; marketing, and may help expand user traffic for all companies concerned.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-1\"><h3>定位比对法<  \n> 强大的用户流量\n\n全文分别介绍不同形式怎样运作，C能落实到售卖媒体区别于一般自有媒体的具体条件：流量强到吸引其他组织放入内容。这个方向与主旨相接，但强弱程度本身仍须由第2段的定义确定。\n\n本项最终仍要根据“whose traffic is so strong”这处局部原文判断。它直接给出强流量，又写出其他组织进驻的结果；与第一轮留下的D相比，C有定义句支持，不需要再把容纳外部内容解释成某种组织特性。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 C选项","focus":[94,813,438,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":32,"option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":true},"level":4,"focusId":"focus-q32-C-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-C-0\"><blockquote>\n<p>强大的用户流量<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的<code>strong<\/code>显示为<code>[xxx]<\/code>，但<code>user traffic<\/code>能接到定义句，原文的<code>so strong<\/code>及吸引其他组织进驻的结果也可读懂，因此第一轮保留C，与D一起暂存；读完全文后回查，C对应定义中的流量条件，D只是对形式的宽泛感受，最终选择C。<\/p>\n<p><strong>选项类型：正确同义改写。<\/strong><\/p>\n<p>C把定义句的<code>owned media whose traffic is so strong<\/code>压缩成“强大的用户流量”。定义句中的强流量吸引其他组织放入内容或电商引擎，后文又用<code>user traffic<\/code>说明入驻可能继续扩大流量，因此这里的<code>traffic<\/code>指用户访问流量。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<p>Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies&#39; marketing, and may help expand user traffic for all companies concerned.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是强大的用户流量。<\/p>\n<\/blockquote>\n<p><code>sold media<\/code>与<code>feature<\/code>把题干指向<code>We define such sold media<\/code>之后的定义，C的<code>traffic<\/code>对应<code>whose traffic is so strong<\/code>。段末的<code>user traffic<\/code>还说明这里谈的是网站用户访问量，并非交通工具的通行量。<\/p>\n<p>第一处出 容纳外部内容解释成某种组织特性。<\/p>\n<p><strong>复盘判断：C正确。<\/strong><\/p>\n<\/section>"},{"title":"D. flexibility in organization","raw":"### D. flexibility in organization\n\n> 组织方式上的灵活性\n\n**做题模式中的状态：** 当时由其他组织能放入内容或电商引擎、一个自有网站能成为他人的付费媒体，联想到形式具有可变性，第一轮暂时保留D，与C二选一；全文读完后回查，发现灵活只是对运作的宽泛感受，没有定义句中的强流量依据，最终排除D。\n\n**错误类型：第三类——无中生有。**\n\nD借用`other organizations`与自有媒体承载外部内容的现象，进一步推成组织方式灵活。`organizations`在原文中指其他公司或机构，不是平台内部如何组织；可以容纳外部内容，也没有说明组织结构能灵活调整。\n\n**出处：**\n\n> But in some cases, one marketer's owned media become another marketer's paid media – for instance, when an e-commerce retailer sells ad space on its Web site.\n>\n> We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[93,902,597,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q32-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>组织方式上的灵活性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由其他组织能放入内容或电商引擎、一个自有网站能成为他人的付费媒体，联想到形式具有可变性，第一轮暂时保留D，与C二选一；全文读完后回查，发现灵活只是对运作的宽泛感受，没有定义句中的强流量依据，最终排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用<code>other organizations<\/code>与自有媒体承载外部内容的现象，进一步推成组织方式灵活。<code>organizations<\/code>在原文中指其他公司或机构，不是平台内部如何组织；可以容纳外部内容，也没有说明组织结构能灵活调整。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in some cases, one marketer&#39;s owned media become another marketer&#39;s paid media – for instance, when an e-commerce retailer sells ad space on its Web site.<\/p>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. flexibility in organization","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 根据第2段，售卖媒体的特征是组织方式上的灵活性。\n\n`According to Paragraph 2`要求读第2段对`sold media`的说明；D的`organization`容易让人联想到定义句的`other organizations`，但这里复数形式指入驻的其他组织，不能先把它读成媒体平台的组织方式。\n\n出处第一句说一方的自有媒体可以成为另一方的付费媒体，第二句说平台流量强到其他组织会把内容或电商引擎放进来。两句共同说明媒介的使用关系及其吸引条件，没有写平台怎样调整结构、规则或内部安排。\n\n“其他组织进入”说的是谁来使用平台；“组织方式灵活”说的是平台怎样安排事物。两者涉及的对象不同。即使一个网站容纳了多家公司的内容，也可能始终按照固定广告位和固定规则运行，原文没有给出相反说明。\n\n媒体从一方的自有媒体变为另一方的付费媒体，是从双方所处位置描述同一次使用：拥有者出售空间，购买者借用空间。它不要求平台内部结构发生灵活变化，不能把使用身份的差异直接当成组织方式的特征。\n\nD把真实的外部机构入驻和媒体使用关系，扩展成作者没有给出的组织灵活性；定义句实际强调的是强流量带来入驻，未以灵活组织作为售卖媒体的识别条件。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[93,902,597,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q32-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>组织方式上的灵活性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由其他组织能放入内容或电商引擎、一个自有网站能成为他人的付费媒体，联想到形式具有可变性，第一轮暂时保留D，与C二选一；全文读完后回查，发现灵活只是对运作的宽泛感受，没有定义句中的强流量依据，最终排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用<code>other organizations<\/code>与自有媒体承载外部内容的现象，进一步推成组织方式灵活。<code>organizations<\/code>在原文中指其他公司或机构，不是平台内部如何组织；可以容纳外部内容，也没有说明组织结构能灵活调整。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in some cases, one marketer&#39;s owned media become another marketer&#39;s paid media – for instance, when an e-commerce retailer sells ad space on its Web site.<\/p>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是组织方式上的灵活性。<\/p>\n<\/blockquote>\n<p><code>According to Paragraph 2<\/code>要求读第2段对<code>sold media<\/code>的说明；D的<code>organization<\/code>容易让人联想到定义句的<code>other organizations<\/code>，但这里复数形式指入驻的其他组织，不能先把它读成媒体平台的组织方式。<\/p>\n<p>出处第一句说一方的自有媒体可以成为另一方的付费媒体，第二句说平台流量强到其他组织会把内容或电商引擎放进来。两句共同说明媒介的使用关系及其吸引条件，没有写平台怎样调整结构、规则或内部安排。<\/p>\n<p>“其他组织进入”说的是谁来使用平台；“组织方式灵活”说的是平台怎样安排事物。两者涉及的对象不同。即使一个网站容纳了多家公司的内容，也可能始终按照固定广告位和固定规则运行，原文没有给出相反说明。<\/p>\n<p>媒体从一方的自有媒体变为另一方的付费媒体，是从双方所处位置描述同一次使用：拥有者出售空间，购买者借用空间。它不要求平台内部结构发生灵活变化，不能把使用身份的差异直接当成组织方式的特征。<\/p>\n<p>D把真实的外部机构入驻和媒体使用关系，扩展成作者没有给出的组织灵活性；定义句实际强调的是强流量带来入驻，未以灵活组织作为售卖媒体的识别条件。<\/p>\n<\/section>"},{"title":"D. flexibility in organization","raw":"#### 写作视角法\n\n原文解释自有媒体怎样成为售卖媒体时是这样写的：\n\n> We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.\n>\n> 作者用平台流量强来解释其他组织为何进入，并以此定义售卖媒体。\n\n接下来的趋势、BabyCenter案例和入驻收益继续围绕这个平台如何被其他营销者利用展开。文章没有在定义后转向组织结构的调整，也没有比较不同平台的管理弹性。\n\n如果D真是作者的意思，文章至少得写成：\n\n> We define sold media by their flexibility in organization: these platforms can readily reorganize their structures and arrangements to accommodate different marketers.\n>\n> 我们以组织方式的灵活性定义售卖媒体：这些平台能迅速重新安排结构与运作方式，以容纳不同营销者。\n\n假设写法需要把平台自身的可调整能力写出来，并让它承担定义作用。实际写法把这个位置留给强流量，`other organizations`只是入驻者，不能因为两处都有`organization`就把整条定义换成D。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[93,902,597,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q32-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>组织方式上的灵活性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由其他组织能放入内容或电商引擎、一个自有网站能成为他人的付费媒体，联想到形式具有可变性，第一轮暂时保留D，与C二选一；全文读完后回查，发现灵活只是对运作的宽泛感受，没有定义句中的强流量依据，最终排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用<code>other organizations<\/code>与自有媒体承载外部内容的现象，进一步推成组织方式灵活。<code>organizations<\/code>在原文中指其他公司或机构，不是平台内部如何组织；可以容纳外部内容，也没有说明组织结构能灵活调整。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in some cases, one marketer&#39;s owned media become another marketer&#39;s paid media – for instance, when an e-commerce retailer sells ad space on its Web site.<\/p>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是组织方式上的灵活性。<\/p>\n<\/blockquote>\n<p><code>According to Paragraph 2<\/code>要求读第2段对<code>sold media<\/code>的说明；D的<code>organization<\/code>容易让人联想到定义句的<code>other organizations<\/code>，但这里复数形式指入驻的其他组织，不能先把它读成媒体平台的组织方式。<\/p>\n<p>出处第一句说一方的自有媒体可以成为另一方的付费媒体，第二句说平台流量强到其他组织会把内容或电商引擎放进来。两句共同说明媒介的使用关系及其吸引条件，没有写平台怎样调整结构、规则或内部安排。<\/p>\n<p>“其他组织进入”说的是谁来使用平台；“组织方式灵活”说的是平台怎样安排事物。两者涉及的对象不同。即使一个网站容纳了多家公司的内容，也可能始终按照固定广告位和固定规则运行，原文没有给出相反说明。<\/p>\n<p>媒体从一方的自有媒体变为另一方的付费媒体，是从双方所处位置描述同一次使用：拥有者出售空间，购买者借用空间。它不要求平台内部结构发生灵活变化，不能把使用身份的差异直接当成组织方式的特征。<\/p>\n<p>D把真实的外部机构入驻和媒体使用关系，扩展成作者没有给出的组织灵活性；定义句实际强调的是强流量带来入驻，未以灵活组织作为售卖媒体的识别条件。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-2\"><h3>写作视角法<\/h3>\n<p>原文解释自有媒体怎样成为售卖媒体时是这样写的：<\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<p>作者用平台流量强来解释其他组织为何进入，并以此定义售卖媒体。<\/p>\n<\/blockquote>\n<p>接下来的趋势、BabyCenter案例和入驻收益继续围绕这个平台如何被其他营销者利用展开。文章没有在定义后转向组织结构的调整，也没有比较不同平台的管理弹性。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>We define sold media by their flexibility in organization: these platforms can readily reorganize their structures and arrangements to accommodate different marketers.<\/p>\n<p>我们以组织方式的灵活性定义售卖媒体：这些平台能迅速重新安排结构与运作方式，以容纳不同营销者。<\/p>\n<\/blockquote>\n<p>假设写法需要把平台自身的可调整能力写出来，并让它承担定义作用。实际写法把这个位置留给强流量，<code>other organizations<\/code>只是入驻者，不能因为两处都有<code>organization<\/code>就把整条定义换成D。<\/p>\n<\/section>"},{"title":"D. flexibility in organization","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Alternatives to conventional paid media  \n> 传统付费媒体之外的多种营销媒体形式。\n\n把这个主旨直接代入32题题干：\n\n> 全文主旨只能确认本题要找售卖媒体区别于其他媒体形式的运作特征，不能判断这种特征是不是组织方式灵活。\n\n但D实际说的是：\n\n> flexibility in organization  \n> 组织方式上的灵活性\n\n全文介绍多种媒体形式，会让人感到营销选择更丰富，但形式多样属于整篇的讨论范围，并不能转写为某一类平台内部组织灵活。D需要额外的组织安排证据，主旨无法替它提供。\n\n本项最终仍要根据“whose traffic is so strong”这处局部原文判断。作者用强流量解释其他组织入驻；D只把这一现象说成灵活，没有说明这种灵活怎样构成售卖媒体的定义。因此回查时应保留有明确定义依据的C，排除只靠宽泛感受推出的D。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题 D选项","focus":[93,902,597,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":32,"option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q32-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q32-D-0\"><blockquote>\n<p>组织方式上的灵活性<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时由其他组织能放入内容或电商引擎、一个自有网站能成为他人的付费媒体，联想到形式具有可变性，第一轮暂时保留D，与C二选一；全文读完后回查，发现灵活只是对运作的宽泛感受，没有定义句中的强流量依据，最终排除D。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用<code>other organizations<\/code>与自有媒体承载外部内容的现象，进一步推成组织方式灵活。<code>organizations<\/code>在原文中指其他公司或机构，不是平台内部如何组织；可以容纳外部内容，也没有说明组织结构能灵活调整。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>But in some cases, one marketer&#39;s owned media become another marketer&#39;s paid media – for instance, when an e-commerce retailer sells ad space on its Web site.<\/p>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>根据第2段，售卖媒体的特征是组织方式上的灵活性。<\/p>\n<\/blockquote>\n<p><code>According to Paragraph 2<\/code>要求读第2段对<code>sold media<\/code>的说明；D的<code>organization<\/code>容易让人联想到定义句的<code>other organizations<\/code>，但这里复数形式指入驻的其他组织，不能先把它读成媒体平台的组织方式。<\/p>\n<p>出处第一句说一方的自有媒体可以成为另一方的付费媒体，第二句说平台流量强到其他组织会把内容或电商引擎放进来。两句共同说明媒介的使用关系及其吸引条件，没有写平台怎样调整结构、规则或内部安排。<\/p>\n<p>“其他组织进入”说的是谁来使用平台；“组织方式灵活”说的是平台怎样安排事物。两者涉及的对象不同。即使一个网站容纳了多家公司的内容，也可能始终按照固定广告位和固定规则运行，原文没有给出相反说明。<\/p>\n<p>媒体从一方的自有媒体变为另一方的付费媒体，是从双方所处位置描述同一次使用：拥有者出售空间，购买者借用空间。它不要求平台内部结构发生灵活变化，不能把使用身份的差异直接当成组织方式的特征。<\/p>\n<p>D把真实的外部机构入驻和媒体使用关系，扩展成作者没有给出的组织灵活性；定义句实际强调的是强流量带来入驻，未以灵活组织作为售卖媒体的识别条件。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-2\"><h3>写作视角法<\/h3>\n<p>原文解释自有媒体怎样成为售卖媒体时是这样写的：<\/p>\n<blockquote>\n<p>We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.<\/p>\n<p>作者用平台流量强来解释其他组织为何进入，并以此定义售卖媒体。<\/p>\n<\/blockquote>\n<p>接下来的趋势、BabyCenter案例和入驻收益继续围绕这个平台如何被其他营销者利用展开。文章没有在定义后转向组织结构的调整，也没有比较不同平台的管理弹性。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>We define sold media by their flexibility in organization: these platforms can readily reorganize their structures and arrangements to accommodate different marketers.<\/p>\n<p>我们以组织方式的灵活性定义售卖媒体：这些平台能迅速重新安排结构与运作方式，以容纳不同营销者。<\/p>\n<\/blockquote>\n<p>假设写法需要把平台自身的可调整能力写出来，并让它承担定义作用。实际写法把这个位置留给强流量，<code>other organizations<\/code>只是入驻者，不能因为两处都有<code>organization<\/code>就把整条定义换成D。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q32-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入32题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认本题要找售卖媒体区别于其他媒体形式的运作特征，不能判断这种特征是不是组织方式灵活。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>flexibility in organization<br>组织方式上的灵活性<\/p>\n<\/blockquote>\n<p>全文介绍多种媒体形式，会让人感到营销选择更丰富，但形式多样属于整篇的讨论范围，并不能转写为某一类平台内部组织灵活。D需要额外的组织安排证据，主旨无法替它提供。<\/p>\n<p>本项最终仍要根据“whose traffic is so strong”这处局部原文判断。作者用强流量解释其他组织入驻；D只把这一现象说成灵活，没有说明这种灵活怎样构成售卖媒体的定义。因此回查时应保留有明确定义依据的C，排除只靠宽泛感受推出的D。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"32题结论","raw":"### 32题结论\n\n> **32. C. strong user traffic**\n\nA由其他组织愿意入驻补出环境安全，原文没有作安全评价。\n\nB借例子中的竞争性产品增加随机属性，竞争关系不等于随机安排。\n\nC准确概括定义中的强流量，并由吸引其他组织进驻的结果得到说明。\n\nD把其他组织入驻及媒体使用关系推成组织方式灵活，没有保留作者用来下定义的流量条件。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[18,549,1028,421],"sourceW":1432,"sourceH":2573},"meta":{"kind":"conclusion","question":32},"level":3,"html":"<blockquote>\n<p><strong>32. C. strong user traffic<\/strong><\/p>\n<\/blockquote>\n<p>A由其他组织愿意入驻补出环境安全，原文没有作安全评价。<\/p>\n<p>B借例子中的竞争性产品增加随机属性，竞争关系不等于随机安排。<\/p>\n<p>C准确概括定义中的强流量，并由吸引其他组织进驻的结果得到说明。<\/p>\n<p>D把其他组织入驻及媒体使用关系推成组织方式灵活，没有保留作者用来下定义的流量条件。<\/p>\n"},{"title":"33题 · 题干、题型与核心出处","raw":"## 33题\n\n> The author indicates in Paragraph 3 that earned media ______.  \n> 作者在第3段指出，赢得媒体具有怎样的情况？\n\n### 题型\n\n段落推断题。题干用`Paragraph 3`限定判断范围，以`earned media`为入口，要求读出消费者参与传播时可能产生什么结果。需要把本段开头的风险、`hijacked media`的解释和最后的施压例子接起来，不能只看`earned media`这个词，也不能把风险直接说成必然、持续发生的事实。\n\n### 核心出处\n\n> The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways.\n>\n> Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholders, or activists who make negative allegations about a brand or product.\n>\n> Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.\n\n第3段第一句说，同样的技术既增加传播选择，也增加消费者用更具破坏性的方式发声的风险；第二句把这种反向情形称为`hijacked media`，说明品牌资产或活动会被消费者等用于负面指控；第三句再举社交网络成员向原创建企业施压的例子。\n\n把三句接起来，最小限度的推断是：企业希望获得消费者传播的媒体资源，也可能被消费者反过来利用，对营销产生负面影响。这里没有把`earned media`直接定义成负面传播；原文用`opposite`区分有利的赢得媒体与有害的被劫持媒体，提醒我们传播方向并非始终受企业控制。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[18,1077,1373,421],"sourceW":1432,"sourceH":2573},"meta":{"kind":"question","question":33},"level":2,"html":"<blockquote>\n<p>The author indicates in Paragraph 3 that earned media ______.<br>作者在第3段指出，赢得媒体具有怎样的情况？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>段落推断题。题干用<code>Paragraph 3<\/code>限定判断范围，以<code>earned media<\/code>为入口，要求读出消费者参与传播时可能产生什么结果。需要把本段开头的风险、<code>hijacked media<\/code>的解释和最后的施压例子接起来，不能只看<code>earned media<\/code>这个词，也不能把风险直接说成必然、持续发生的事实。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways.<\/p>\n<p>Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholders, or activists who make negative allegations about a brand or product.<\/p>\n<p>Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.<\/p>\n<\/blockquote>\n<p>第3段第一句说，同样的技术既增加传播选择，也增加消费者用更具破坏性的方式发声的风险；第二句把这种反向情形称为<code>hijacked media<\/code>，说明品牌资产或活动会被消费者等用于负面指控；第三句再举社交网络成员向原创建企业施压的例子。<\/p>\n<p>把三句接起来，最小限度的推断是：企业希望获得消费者传播的媒体资源，也可能被消费者反过来利用，对营销产生负面影响。这里没有把<code>earned media<\/code>直接定义成负面传播；原文用<code>opposite<\/code>区分有利的赢得媒体与有害的被劫持媒体，提醒我们传播方向并非始终受企业控制。<\/p>\n"},{"title":"A. invite constant conflicts with passionate consumers","raw":"### A. invite constant conflicts with passionate consumers\n\n> 不断招致与热情消费者的冲突。\n\n**做题模式中的状态：** 当时A的英文没有遮挡。虽然第三段中的`diverse`、`hostage`、`allegations`显示为`[xxx]`，仍已读到`increased the risk`和消费者以更具破坏性的方式表达意见。第一轮将风险的可能性与A的`constant conflicts`比较，发现原文没有说冲突持续不断，因此排除A，后续没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nA借用了消费者表达负面意见、向企业施压这一风险，把“有可能出现反向传播”改成赢得媒体不断引发与消费者的冲突。原文的`risk`保留未必发生的余地，A的`constant`却把持续性直接写成特点；双方发生冲突也不是每一次消费者发声都必然具备的关系。\n\n**出处：**\n\n> The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways.\n>\n> Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1165,1113,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q33-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>不断招致与热情消费者的冲突。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡。虽然第三段中的<code>diverse<\/code>、<code>hostage<\/code>、<code>allegations<\/code>显示为<code>[xxx]<\/code>，仍已读到<code>increased the risk<\/code>和消费者以更具破坏性的方式表达意见。第一轮将风险的可能性与A的<code>constant conflicts<\/code>比较，发现原文没有说冲突持续不断，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了消费者表达负面意见、向企业施压这一风险，把“有可能出现反向传播”改成赢得媒体不断引发与消费者的冲突。原文的<code>risk<\/code>保留未必发生的余地，A的<code>constant<\/code>却把持续性直接写成特点；双方发生冲突也不是每一次消费者发声都必然具备的关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways.<\/p>\n<p>Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. invite constant conflicts with passionate consumers","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者在第3段指出，赢得媒体会不断招致与热情消费者的冲突。\n\n题干的`Paragraph 3`限定第3段，A的`passionate consumers`对应首句发声的消费者，`conflicts`则容易让人联想到末句的`apply pressure`。找到这些相同或相近内容后，还要继续核对作者究竟是在说风险，还是在陈述已经持续发生的冲突。\n\n首句主语是技术变革，谓语是`have also increased the risk`，意思是负面表达更容易发生；末句的社交网络成员`can hijack media`，说的是他们能够劫持媒体向企业施压。这两句提供了风险和能力，没有提供冲突发生的固定频率。\n\nA把赢得媒体作为招致冲突的因素，又用`constant`要求冲突连续或反复存在。风险增加可以意味着需要更谨慎，却不能推出某种行为一直发生；`can`说明能够做到，也不能当成每次都如此的保证。\n\n此外，原文重点是消费者借传播渠道对品牌造成损害，未将所有消费者参与都概括成企业与消费者的持续对抗。A将“传播可能反过来伤害企业”改成“赢得媒体不断招致冲突”，扩大了发生程度，也把潜在风险写成了恒常状态。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1165,1113,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q33-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>不断招致与热情消费者的冲突。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡。虽然第三段中的<code>diverse<\/code>、<code>hostage<\/code>、<code>allegations<\/code>显示为<code>[xxx]<\/code>，仍已读到<code>increased the risk<\/code>和消费者以更具破坏性的方式表达意见。第一轮将风险的可能性与A的<code>constant conflicts<\/code>比较，发现原文没有说冲突持续不断，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了消费者表达负面意见、向企业施压这一风险，把“有可能出现反向传播”改成赢得媒体不断引发与消费者的冲突。原文的<code>risk<\/code>保留未必发生的余地，A的<code>constant<\/code>却把持续性直接写成特点；双方发生冲突也不是每一次消费者发声都必然具备的关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways.<\/p>\n<p>Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第3段指出，赢得媒体会不断招致与热情消费者的冲突。<\/p>\n<\/blockquote>\n<p>题干的<code>Paragraph 3<\/code>限定第3段，A的<code>passionate consumers<\/code>对应首句发声的消费者，<code>conflicts<\/code>则容易让人联想到末句的<code>apply pressure<\/code>。找到这些相同或相近内容后，还要继续核对作者究竟是在说风险，还是在陈述已经持续发生的冲突。<\/p>\n<p>首句主语是技术变革，谓语是<code>have also increased the risk<\/code>，意思是负面表达更容易发生；末句的社交网络成员<code>can hijack media<\/code>，说的是他们能够劫持媒体向企业施压。这两句提供了风险和能力，没有提供冲突发生的固定频率。<\/p>\n<p>A把赢得媒体作为招致冲突的因素，又用<code>constant<\/code>要求冲突连续或反复存在。风险增加可以意味着需要更谨慎，却不能推出某种行为一直发生；<code>can<\/code>说明能够做到，也不能当成每次都如此的保证。<\/p>\n<p>此外，原文重点是消费者借传播渠道对品牌造成损害，未将所有消费者参与都概括成企业与消费者的持续对抗。A将“传播可能反过来伤害企业”改成“赢得媒体不断招致冲突”，扩大了发生程度，也把潜在风险写成了恒常状态。<\/p>\n<\/section>"},{"title":"A. invite constant conflicts with passionate consumers","raw":"#### 写作视角法\n\n原文第3段结尾和第4段开头是这样衔接的：\n\n> Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.\n>\n> If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.\n>\n> 社交网络成员能够借媒体向企业施压；如果出现这种情形，消费者会试图说服别人抵制产品，使公司声誉面临风险。\n\n实际文章先展示传播被反向利用的可能，再用`If that happens`进入条件成立后的后果与应对。作者接下来的问题是“发生这种情况时怎么办”，并没有把持续冲突当作所有赢得媒体的日常状态。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Earned media continually bring businesses into conflict with passionate consumers.\n>\n> 赢得媒体不断使企业与热情消费者发生冲突。\n\n假设写法必须明确写出持续发生的冲突，后文才可以在这个既定状态上讨论处理办法。实际文章保留条件入口，从可能被劫持转到可能抵制，再说明企业怎样回应；它没有将这一条风险路线提升为A要求的持续冲突。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1165,1113,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false},"level":4,"focusId":"focus-q33-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>不断招致与热情消费者的冲突。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡。虽然第三段中的<code>diverse<\/code>、<code>hostage<\/code>、<code>allegations<\/code>显示为<code>[xxx]<\/code>，仍已读到<code>increased the risk<\/code>和消费者以更具破坏性的方式表达意见。第一轮将风险的可能性与A的<code>constant conflicts<\/code>比较，发现原文没有说冲突持续不断，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了消费者表达负面意见、向企业施压这一风险，把“有可能出现反向传播”改成赢得媒体不断引发与消费者的冲突。原文的<code>risk<\/code>保留未必发生的余地，A的<code>constant<\/code>却把持续性直接写成特点；双方发生冲突也不是每一次消费者发声都必然具备的关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways.<\/p>\n<p>Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-1\"><h3>定位比对法<\/h3>\n<p>先把A接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第3段指出，赢得媒体会不断招致与热情消费者的冲突。<\/p>\n<\/blockquote>\n<p>题干的<code>Paragraph 3<\/code>限定第3段，A的<code>passionate consumers<\/code>对应首句发声的消费者，<code>conflicts<\/code>则容易让人联想到末句的<code>apply pressure<\/code>。找到这些相同或相近内容后，还要继续核对作者究竟是在说风险，还是在陈述已经持续发生的冲突。<\/p>\n<p>首句主语是技术变革，谓语是<code>have also increased the risk<\/code>，意思是负面表达更容易发生；末句的社交网络成员<code>can hijack media<\/code>，说的是他们能够劫持媒体向企业施压。这两句提供了风险和能力，没有提供冲突发生的固定频率。<\/p>\n<p>A把赢得媒体作为招致冲突的因素，又用<code>constant<\/code>要求冲突连续或反复存在。风险增加可以意味着需要更谨慎，却不能推出某种行为一直发生；<code>can<\/code>说明能够做到，也不能当成每次都如此的保证。<\/p>\n<p>此外，原文重点是消费者借传播渠道对品牌造成损害，未将所有消费者参与都概括成企业与消费者的持续对抗。A将“传播可能反过来伤害企业”改成“赢得媒体不断招致冲突”，扩大了发生程度，也把潜在风险写成了恒常状态。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-A-2\"><h3>写作视角法<\/h3>\n<p>原文第3段结尾和第4段开头是这样衔接的：<\/p>\n<blockquote>\n<p>Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.<\/p>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>社交网络成员能够借媒体向企业施压；如果出现这种情形，消费者会试图说服别人抵制产品，使公司声誉面临风险。<\/p>\n<\/blockquote>\n<p>实际文章先展示传播被反向利用的可能，再用<code>If that happens<\/code>进入条件成立后的后果与应对。作者接下来的问题是“发生这种情况时怎么办”，并没有把持续冲突当作所有赢得媒体的日常状态。<\/p>\n<p>如果A真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Earned media continually bring businesses into conflict with passionate consumers.<\/p>\n<p>赢得媒体不断使企业与热情消费者发生冲突。<\/p>\n<\/blockquote>\n<p>假设写法必须明确写出持续发生的冲突，后文才可以在这个既定状态上讨论处理办法。实际文章保留条件入口，从可能被劫持转到可能抵制，再说明企业怎样回应；它没有将这一条风险路线提升为A要求的持续冲突。<\/p>\n<\/section>"},{"title":"A. invite constant conflicts with passionate consumers","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Alternatives to conventional paid media  \n> 传统付费媒体之外的多种营销媒体形式。\n\n把这个主旨直接代入33题题干：\n\n> 全文主旨只能确认第3段仍在说明传统付费媒体之外的传播形式及其运作情况，不能单独判断赢得媒体是否不断引发与消费者的冲突。\n\n但A实际说的是：\n\n> invite constant conflicts with passionate consumers  \n> 不断招致与热情消费者的冲突。\n\n介绍多种媒体形式，可以包括它们的机会和风险，却不能由“存在新传播形式”推出“企业与消费者持续冲突”。A需要额外证明冲突的发生频率，全文主旨没有提供这一限制。\n\n本项最终仍要根据“increased the risk”和“can hijack media”这两处局部原文判断。它们支持可能产生不利影响，后文也以`If that happens`引出后果；A的`constant`把可能性改成持续性，超出了原文。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 A选项","focus":[93,1165,1113,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":33,"option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":true},"level":4,"focusId":"focus-q33-A-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-A-0\"><blockquote>\n<p>不断招致与热情消费者的冲突。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的英文没有遮挡。虽然第三段中的<code>diverse<\/code>、<code>hostage<\/code>、<code>allegations<\/code>显示为<code>[xxx]<\/code>，仍已读到<code>increased the risk<\/code>和消费者以更具破坏性的方式表达意见。第一轮将风险的可能性与A的<code>constant conflicts<\/code>比较，发现原文没有说冲突持续不断，因此排除A，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>A借用了消费者表达负面意见、向企业施压这一风险，把“有可能出现反向传播”改成赢得媒体不断引发与消费者的冲突。原文的<code>risk<\/code>保留未必发生的余地，A的<code>constant<\/code>却把持续性直接写成特点；双方发生冲突也不是每一次消费者发声都必然具备的关系。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The same dramati ure on the businesses that originally created them.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 B选项","focus":[93,1254,1155,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":33,"option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q33-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>可能被利用，在营销中产生负面影响。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项中的<code>negative<\/code>显示为<code>[xxx]<\/code>，第三段的<code>hostage<\/code>与<code>allegations<\/code>也有遮挡。第一轮已通过<code>damaging<\/code>、原文中仍可见的<code>negative<\/code>以及对企业施压的动作读出负面方向；B的<code>can be used<\/code>与<code>effects in marketing<\/code>又能接上媒体被利用和品牌受到影响，所以先保留B。A、C、D均排除后选择B，后续没有改变。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>B把本段三个层次合起来：技术增加破坏性发声的风险，媒体资产或活动可能被他人控制，社交网络成员还能借此向企业施压。<code>can be used<\/code>概括被利用的可能，<code>negative effects in marketing<\/code>概括对品牌或产品的不利后果。这不是把有利口碑与被劫持媒体说成同一种定义，而是从原文对二者方向的对照，读出企业期待的消费者传播可能反过来损害营销。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways.<\/p>\n<p>Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholders, or activists who make negative allegations about a brand or product.<\/p>\n<p>Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. can be used to produce negative effects in marketing","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者在第3段指出，赢得媒体所涉及的传播资源可能被反过来利用，在营销中产生负面影响。\n\n用`Paragraph 3`找到本段，`earned media`对应第二句的对照，B的`be used`对应资产或活动受消费者等控制以及`hijack media`，`negative effects`对应`damaging`、`negative allegations`和`apply pressure`。本题要核对的是传播被利用后可能产生的后果。\n\n首句先明确同样的技术带来更多选择，也增加破坏性意见传播的风险。第二句补出利用过程：资产或活动成为消费者、利益相关者或行动者的工具，用于对品牌或产品提出负面指控。第三句把结果写得更具体：媒体原本由企业创建，却可以被别人拿来向这些企业施压。\n\n`earned media`本来指消费者自愿传播所带来的有利口碑；这里的`hijacked media`则是这种有利方向的反面。B成立需要的推断只到“相关传播资源可能被反向利用”为止，不需要把每一次赢得媒体传播都叫作被劫持，也不需要假定所有消费者都会批评品牌。\n\n原文中的`risk`和`can hijack`保留可能性，B的`can be used`也只说可能被利用；原文的不利作用落在品牌、产品和企业，B把它概括为营销中的负面影响，没有添加持续发生、竞争加剧或评论合理等其他结论。\n\nB用一句话概括了“传播选择增加，同时可能失去有利方向并被用于施压”的段内关系，保留了可能性与负面结果这两个关键限制。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 B选项","focus":[93,1254,1155,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":33,"option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q33-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-B-0\"><blockquote>\n<p>可能被利用，在营销中产生负面影响。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时选项中的<code>negative<\/code>显示为<code>[xxx]<\/code>，第三段的<code>hostage<\/code>与<code>allegations<\/code>也有遮挡。第一轮已通过<code>damaging<\/code>、原文中仍可见的<code>negative<\/code>以及对企业施压的动作读出负面方向；B的<code>can be used<\/code>与<code>effects in marketing<\/code>又能接上媒体被利用和品牌受到影响，所以先保留B。A、C、D均排除后选择B，后续没有改变。<\/p>\n<p><strong>选项类型：正确局部推断。<\/strong><\/p>\n<p>B把本段三个层次合起来：技术增加破坏性发声的风险，媒体资产或活动可能被他人控制，社交网络成员还能借此向企业施压。<code>can be used<\/code>概括被利用的可能，<code>negative effects in marketing<\/code>概括对品牌或产品的不利后果。这不是把有利口碑与被劫持媒体说成同一种定义，而是从原文对二者方向的对照，读出企业期待的消费者传播可能反过来损害营销。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways.<\/p>\n<p>Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholder
