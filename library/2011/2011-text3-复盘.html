he negative comments directed at earned media are justified, and these media deserve them.\n>\n> 所有针对赢得媒体的负面评论都有道理，这些媒体理应受到这些评论。\n\n这段假设必须把评论对象、全部范围和作者认可一起写明。实际文章只解释品牌如何遭到负面指控及其后果，既没有把评论对象换成赢得媒体本身，也没有给出评论均属正当的论证。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[93,1430,1022,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q33-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>理应受到所有针对它们的负面评论。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡，原文的<code>allegations<\/code>显示为<code>[xxx]<\/code>。第一轮仍已读出行动者会对品牌提出负面说法，并比较了事实描述与<code>deserve<\/code>的价值判断：有人批评不能说明全部批评都应得，<code>all<\/code>也没有依据，因此排除D，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了<code>negative allegations<\/code>这一负面说法，增加“理应承受”的正当性评价，又用<code>all<\/code>认可全部评论。原文没有调查指控是否属实，也没有判断被批评的一方是否应得这些评论。与此同时，原文的指控对象是品牌或产品，D接回题干后却把赢得媒体本身放在承受评论的位置。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholders, or activists who make negative allegations about a brand or product.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第3段指出，赢得媒体理应受到所有针对它们的负面评论。<\/p>\n<\/blockquote>\n<p>用D的<code>negative comments<\/code>找到第三段的<code>negative allegations<\/code>，再读清<code>who make<\/code>和<code>about a brand or product<\/code>：前者交代谁提出说法，后者交代说法针对什么。这些信息不包含作者是否认可评论的判断。<\/p>\n<p>原句说消费者、利益相关者或行动者对品牌或产品作出负面指控，媒体资产或营销活动因此受到他们控制。说“有人提出指控”，只是在说明传播中发生什么，并没有把指控内容确认为事实，更没有评定对象理应受到批评。<\/p>\n<p>D的<code>deserve<\/code>要求作者作出正当性判断，<code>all<\/code>又要求对全部负面评论都作相同判断。即使某条批评恰好有根据，也不能据此推出每条批评都合理；而本段连某条指控是否属实都没有核实。<\/p>\n<p>再看对象，原文的<code>about a brand or product<\/code>指品牌或产品，D的<code>them<\/code>接回题干后指向赢得媒体。把传播渠道当成指控对象，已经偏离原句；添上<code>deserve all<\/code>后，更将传播风险的描述变成了作者对全部负面评论的认可。<\/p>\n<p>D依靠相近的负面词块，补出了评价立场、全部范围和新的被评论对象，不能作为第3段实际表达的意思。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-2\"><h3>写作视角法<\/h3>\n<p>原文说明负面指控后，沿着企业所受影响往下写：<\/p>\n<blockquote>\n<p>Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.<\/p>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>负面传播可能被用来向企业施压，并进一步引发抵制与声誉风险。<\/p>\n<\/blockquote>\n<p>作者追踪的是指控怎样传播、怎样影响企业，以及企业怎样回应。后文没有核查每条评论，也没有转而证明被指控一方理应承受它们。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>All the negative comments directed at earned media are justified, and these media deserve them.<\/p>\n<p>所有针对赢得媒体的负面评论都有道理，这些媒体理应受到这些评论。<\/p>\n<\/blockquote>\n<p>这段假设必须把评论对象、全部范围和作者认可一起写明。实际文章只解释品牌如何遭到负面指控及其后果，既没有把评论对象换成赢得媒体本身，也没有给出评论均属正当的论证。<\/p>\n<\/section>"},{"title":"D. deserve all the negative comments about them","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Alternatives to conventional paid media  \n> 传统付费媒体之外的多种营销媒体形式。\n\n把这个主旨直接代入33题题干：\n\n> 全文主旨只能确认作者在介绍营销媒体形式，不能判断针对赢得媒体的全部负面评论是否正当、是否理应承受。\n\n但D实际说的是：\n\n> deserve all the negative comments about them  \n> 理应受到所有针对它们的负面评论。\n\nD将对传播形式的说明变成对全部负面评论的裁决。作者可以在介绍媒体时提醒它可能被用于批评品牌，但介绍这种风险并不意味着站到批评者一边，也不能产生`all`这一全称判断。\n\n本项最终仍要根据“make negative allegations about a brand or product”这处局部原文判断。它描述提出指控的行为和对象，没有提供`deserve`所需的正当性证据，更没有认可所有负面评论。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题 D选项","focus":[93,1430,1022,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":33,"option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q33-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q33-D-0\"><blockquote>\n<p>理应受到所有针对它们的负面评论。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡，原文的<code>allegations<\/code>显示为<code>[xxx]<\/code>。第一轮仍已读出行动者会对品牌提出负面说法，并比较了事实描述与<code>deserve<\/code>的价值判断：有人批评不能说明全部批评都应得，<code>all<\/code>也没有依据，因此排除D，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>D借用了<code>negative allegations<\/code>这一负面说法，增加“理应承受”的正当性评价，又用<code>all<\/code>认可全部评论。原文没有调查指控是否属实，也没有判断被批评的一方是否应得这些评论。与此同时，原文的指控对象是品牌或产品，D接回题干后却把赢得媒体本身放在承受评论的位置。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholders, or activists who make negative allegations about a brand or product.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者在第3段指出，赢得媒体理应受到所有针对它们的负面评论。<\/p>\n<\/blockquote>\n<p>用D的<code>negative comments<\/code>找到第三段的<code>negative allegations<\/code>，再读清<code>who make<\/code>和<code>about a brand or product<\/code>：前者交代谁提出说法，后者交代说法针对什么。这些信息不包含作者是否认可评论的判断。<\/p>\n<p>原句说消费者、利益相关者或行动者对品牌或产品作出负面指控，媒体资产或营销活动因此受到他们控制。说“有人提出指控”，只是在说明传播中发生什么，并没有把指控内容确认为事实，更没有评定对象理应受到批评。<\/p>\n<p>D的<code>deserve<\/code>要求作者作出正当性判断，<code>all<\/code>又要求对全部负面评论都作相同判断。即使某条批评恰好有根据，也不能据此推出每条批评都合理；而本段连某条指控是否属实都没有核实。<\/p>\n<p>再看对象，原文的<code>about a brand or product<\/code>指品牌或产品，D的<code>them<\/code>接回题干后指向赢得媒体。把传播渠道当成指控对象，已经偏离原句；添上<code>deserve all<\/code>后，更将传播风险的描述变成了作者对全部负面评论的认可。<\/p>\n<p>D依靠相近的负面词块，补出了评价立场、全部范围和新的被评论对象，不能作为第3段实际表达的意思。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-2\"><h3>写作视角法<\/h3>\n<p>原文说明负面指控后，沿着企业所受影响往下写：<\/p>\n<blockquote>\n<p>Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.<\/p>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>负面传播可能被用来向企业施压，并进一步引发抵制与声誉风险。<\/p>\n<\/blockquote>\n<p>作者追踪的是指控怎样传播、怎样影响企业，以及企业怎样回应。后文没有核查每条评论，也没有转而证明被指控一方理应承受它们。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>All the negative comments directed at earned media are justified, and these media deserve them.<\/p>\n<p>所有针对赢得媒体的负面评论都有道理，这些媒体理应受到这些评论。<\/p>\n<\/blockquote>\n<p>这段假设必须把评论对象、全部范围和作者认可一起写明。实际文章只解释品牌如何遭到负面指控及其后果，既没有把评论对象换成赢得媒体本身，也没有给出评论均属正当的论证。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q33-D-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入33题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认作者在介绍营销媒体形式，不能判断针对赢得媒体的全部负面评论是否正当、是否理应承受。<\/p>\n<\/blockquote>\n<p>但D实际说的是：<\/p>\n<blockquote>\n<p>deserve all the negative comments about them<br>理应受到所有针对它们的负面评论。<\/p>\n<\/blockquote>\n<p>D将对传播形式的说明变成对全部负面评论的裁决。作者可以在介绍媒体时提醒它可能被用于批评品牌，但介绍这种风险并不意味着站到批评者一边，也不能产生<code>all<\/code>这一全称判断。<\/p>\n<p>本项最终仍要根据“make negative allegations about a brand or product”这处局部原文判断。它描述提出指控的行为和对象，没有提供<code>deserve<\/code>所需的正当性证据，更没有认可所有负面评论。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"33题结论","raw":"### 33题结论\n\n> **33. B. can be used to produce negative effects in marketing**\n\nA把负面传播的风险扩大成与消费者持续发生的冲突。\n\nB保留可能性，概括传播资源被反向利用、对品牌营销产生负面影响的段内关系。\n\nC借消费者施压这一背景，补出市场竞争加剧的因果。\n\nD借负面指控的词块，增加全部评论都理应承受的价值判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[18,1077,1373,421],"sourceW":1432,"sourceH":2573},"meta":{"kind":"conclusion","question":33},"level":3,"html":"<blockquote>\n<p><strong>33. B. can be used to produce negative effects in marketing<\/strong><\/p>\n<\/blockquote>\n<p>A把负面传播的风险扩大成与消费者持续发生的冲突。<\/p>\n<p>B保留可能性，概括传播资源被反向利用、对品牌营销产生负面影响的段内关系。<\/p>\n<p>C借消费者施压这一背景，补出市场竞争加剧的因果。<\/p>\n<p>D借负面指控的词块，增加全部评论都理应承受的价值判断。<\/p>\n"},{"title":"34题 · 题干、题型与核心出处","raw":"## 34题\n\n> Toyota Motor's experience is cited as an example of ______.  \n> 作者引用丰田汽车的经历，是为了举例说明什么？\n\n### 题型\n\n例子作用题。`Toyota Motor's experience`锁定第4段的丰田案例，`is cited as an example of`要求说明作者为什么举这个例子。需要将前文的被劫持媒体风险、企业回应困难与例子中的实际行动和结果连起来，不能把例子附近出现过的任一动作都当成例子所证明的观点。\n\n### 核心出处\n\n> Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.\n>\n> If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.\n>\n> In such a case, the company's response may not be sufficiently quick or thoughtful, and the learning curve has been steep.\n>\n> Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.\n\n第3段末句交代被劫持媒体用于对企业施压，第4段先写抵制与声誉风险，再指出企业回应可能不够及时、周到；随后`for example`引入丰田。丰田用相对迅速、组织周到的回应活动减轻部分损害，直接展示这种风险下怎样作出有效回应。\n\n例子是全文最后一句，后面没有另设评价句。评价已经写在例句里面：`alleviated some of the damage`给出减损结果，`relatively quick and well-orchestrated`说明回应的特点；`some`同时限定成效是部分减损，并非消除全部危机。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[18,1606,1170,420],"sourceW":1432,"sourceH":2573},"meta":{"kind":"question","question":34},"level":2,"html":"<blockquote>\n<p>Toyota Motor&#39;s experience is cited as an example of ______.<br>作者引用丰田汽车的经历，是为了举例说明什么？<\/p>\n<\/blockquote>\n<h3>题型<\/h3>\n<p>例子作用题。<code>Toyota Motor&#39;s experience<\/code>锁定第4段的丰田案例，<code>is cited as an example of<\/code>要求说明作者为什么举这个例子。需要将前文的被劫持媒体风险、企业回应困难与例子中的实际行动和结果连起来，不能把例子附近出现过的任一动作都当成例子所证明的观点。<\/p>\n<h3>核心出处<\/h3>\n<blockquote>\n<p>Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.<\/p>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>In such a case, the company&#39;s response may not be sufficiently quick or thoughtful, and the learning curve has been steep.<\/p>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<p>第3段末句交代被劫持媒体用于对企业施压，第4段先写抵制与声誉风险，再指出企业回应可能不够及时、周到；随后<code>for example<\/code>引入丰田。丰田用相对迅速、组织周到的回应活动减轻部分损害，直接展示这种风险下怎样作出有效回应。<\/p>\n<p>例子是全文最后一句，后面没有另设评价句。评价已经写在例句里面：<code>alleviated some of the damage<\/code>给出减损结果，<code>relatively quick and well-orchestrated<\/code>说明回应的特点；<code>some<\/code>同时限定成效是部分减损，并非消除全部危机。<\/p>\n"},{"title":"A. responding effectively to hijacked media","raw":"### A. responding effectively to hijacked media\n\n> 有效回应被劫持媒体。\n\n**做题模式中的状态：** 当时A的`effectively`显示为`[xxx]`，例句中的`alleviated`与`well-orchestrated`也有遮挡。做题材料已将句子理解为丰田通过较快、组织良好的社交媒体回应减轻部分损害，并用可见的`responding`和`hijacked media`接上例子前后的问题。第一轮保留A，其他三项排除后选择A，后续没有改变。\n\n**选项类型：正确概括例子作用。**\n\nA把丰田的具体经历提升为它在段落中的作用：前面提出媒体被劫持后企业可能回应不足，丰田则用相对迅速、周到的社交媒体回应减轻损害。`responding`对应回应活动，`effectively`概括已有的减损结果，`to hijacked media`承接前文的风险场景，而不是凭空增加另一场危机。\n\n**出处：**\n\n> In such a case, the company's response may not be sufficiently quick or thoughtful, and the learning curve has been steep.\n>\n> Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 A选项","focus":[93,1694,906,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":34,"option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false},"level":3,"focusId":"focus-q34-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-A-0\"><blockquote>\n<p>有效回应被劫持媒体。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时A的<code>effectively<\/code>显示为<code>[xxx]<\/code>，例句中的<code>alleviated<\/code>与<code>well-orchestrated<\/code>也有遮挡。做题材料已将句子理解为丰田通过较快、组织良好的社交媒体回应减轻部分损害，并用可见的<code>responding<\/code>和<code>hijacked media<\/code>接上例子前后的问题。第一轮保留A，其他三项排除后选择A，后续没有改变。<\/p>\n<p><strong>选项类型：正确概括例子作用。<\/strong><\/p>\n<p>A把丰田的具体经历提升为它在段落中的作用：前面提出媒体被劫持后企业可能回应不足，丰田则用相对迅速、周到的社交媒体回应减轻损害。<code>responding<\/code>对应回应活动，<code>effectively<\/code>概括已有的减损结果，<code>to hijacked media<\/code>承接前文的风险场景，而不是凭空增加另一场危机。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>In such a case, the company&#39;s response may not be sufficiently quick or thoughtful, and the learning curve has been steep.<\/p>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"A. responding effectively to hijacked media","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者引用丰田汽车的经历，是为了举例说明企业能够有效回应被劫持媒体。\n\n`Toyota Motor`定位第4段末句，`example`对应句中的`for example`，A的`responding`对应`social-media response campaign`。但题目问例子作用，还要向前接上`In such a case`所指的情形：媒体被用来施压，消费者可能号召抵制，企业声誉因此面临风险。\n\n前一句先说明企业的回应可能不够快或不够周到，提出应对上的困难。丰田例句随后给出动作与结果：它开展相对迅速、组织良好的社交媒体回应活动，直接接触消费者，并减轻召回危机造成的部分损害。\n\nA的动作是回应，原文不是只说丰田发布了信息，而是明确有`response campaign`。A的`effectively`要求回应产生实际作用，原文的`alleviated some of the damage`恰好提供结果，因此不能把它仅理解为作者赞美行动速度。\n\n这里的有效不等于完全成功。原文用`some`说明只减轻了一部分损害，用`relatively`限定回应相对迅速；A没有写消除所有损害，保留了这种有限成效的余地。\n\nA准确概括了前文问题与丰田案例的关系：面对被劫持媒体风险，企业可以通过适当回应取得减损效果。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 A选项","focus":[93,1694,906,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":34,"option" e":"image","asset":"questions","label":"34题 B选项","focus":[93,1782,1016,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":34,"option":"B","cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false},"level":3,"focusId":"focus-q34-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-B-0\"><blockquote>\n<p>说服顾客抵制产品。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，段首的<code>boycott<\/code>显示为<code>[xxx]<\/code>。第一轮已读出劝别人抵制的是热情消费者，而丰田开展的是回应活动；将主体与动作比较后，排除把抵制行为安到丰田身上的B，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了例子前真实存在的说服抵制，把消费者给企业带来的风险移成丰田经历要展示的行为。原文先让消费者号召他人抵制，再让企业面对声誉风险并回应；B把造成风险的一方和处理风险的一方混在一起，改变了例子的作用。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"B. persuading customers into boycotting products","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者引用丰田汽车的经历，是为了举例说明说服顾客抵制产品。\n\nB的`persuading`和`boycotting`对应第4段第一句的`persuade others to boycott products`，但题干的`Toyota Motor's experience`定位到段末例句。两处都在同一段，并不说明它们具有同一主语或同一论证作用。\n\n段首的主语是`passionate consumers`，他们试图说服别人抵制产品，结果是目标公司的声誉面临风险。段末的主语是`Toyota Motor`，它用回应活动减轻部分损害；消费者的抵制与企业的应对处在事情的两个不同环节。\n\n若把B理解为丰田说服顾客抵制产品，就把段首消费者的动作移给了丰田。若把B理解为丰田事件只是说明消费者怎样号召抵制，仍然没有对上例句：作者详细写的是丰田的回应方式和减损结果，并未描述某位消费者怎样说服他人抵制丰田产品。\n\n题目要回答例子被用来证明什么，不能只证明“段落里存在抵制一词”。`for example`前最直接的问题是企业回应可能不够快或不够周到，丰田例句正用较快、组织良好的回应接住这一问题。\n\nB将案例前的风险行为当成案例本身所展示的作用，混淆了消费者施压与企业回应的主体和先后关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 B选项","focus":[93,1782,1016,68]," s into boycotting products","raw":"#### 写作视角法\n\n原文从风险到例子这样过渡：\n\n> If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.\n>\n> In such a case, the company's response may not be sufficiently quick or thoughtful, and the learning curve has been steep.\n>\n> Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.\n>\n> 消费者可能号召抵制，企业因而面临回应挑战；丰田案例展示回应活动如何减轻部分损害。\n\n作者在抵制风险与丰田例子之间特意加了企业回应这一层，说明例子接住的是如何应对，而不是再重复说明抵制怎样被发起。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Toyota's experience shows how passionate consumers persuaded other customers to boycott its products.\n>\n> 丰田的经历说明，热情消费者怎样说服其他顾客抵制其产品。\n\n这种假设不必让丰田自己发起抵制，但至少需要作者在案例中展示说服者、被说服的顾客和抵制过程。实际例句写的却是丰田回应、直接接触消费者与减损结果，案例的信息重心并不在说服抵制上。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 B选项","focus":[93,1782,1016,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":34,"option":"B","cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":false},"level":4,"focusId":"focus-q34-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-B-0\"><blockquote>\n<p>说服顾客抵制产品。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，段首的<code>boycott<\/code>显示为<code>[xxx]<\/code>。第一轮已读出劝别人抵制的是热情消费者，而丰田开展的是回应活动；将主体与动作比较后，排除把抵制行为安到丰田身上的B，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了例子前真实存在的说服抵制，把消费者给企业带来的风险移成丰田经历要展示的行为。原文先让消费者号召他人抵制，再让企业面对声誉风险并回应；B把造成风险的一方和处理风险的一方混在一起，改变了例子的作用。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>Toyota Motor, for example, alleviated some of the damage suaded other customers to boycott its products.<\/p>\n<p>丰田的经历说明，热情消费者怎样说服其他顾客抵制其产品。<\/p>\n<\/blockquote>\n<p>这种假设不必让丰田自己发起抵制，但至少需要作者在案例中展示说服者、被说服的顾客和抵制过程。实际例句写的却是丰田回应、直接接触消费者与减损结果，案例的信息重心并不在说服抵制上。<\/p>\n<\/section>"},{"title":"B. persuading customers into boycotting products","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Alternatives to conventional paid media  \n> 传统付费媒体之外的多种营销媒体形式。\n\n把这个主旨直接代入34题题干：\n\n> 全文主旨只能确认丰田案例与新的营销媒体形式有关，不能仅凭这一点判断案例是在展示消费者发起抵制，还是企业作出回应；必须读清例子在本段的承接关系。\n\n但B实际说的是：\n\n> persuading customers into boycotting products  \n> 说服顾客抵制产品。\n\n抵制确实是新传播环境中可能出现的风险，因而B看起来并未离开全文大话题；但题目问丰田例子的作用，讨论范围相近不足以替代主语与作用的核对。\n\n本项最终仍要根据“the company's response”和“social-media response campaign”这两处局部原文判断。丰田例子承接企业回应问题，并报告部分减损；B把前面的抵制风险移到了例子作用的位置。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 B选项","focus":[93,1782,1016,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":34,"option":"B","cumulative":true,"cumulativeGroup":"question-34-option-B","cumulativeFinal":true},"level":4,"focusId":"focus-q34-B-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-B-0\"><blockquote>\n<p>说服顾客抵制产品。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时B的英文没有遮挡，段首的<code>boycott<\/code>显示为<code>[xxx]<\/code>。第一轮已读出劝别人抵制的是热情消费者，而丰田开展的是回应活动；将主体与动作比较后，排除把抵制行为安到丰田身上的B，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>B借用了例子前真实存在的说服抵制，把消费者给企业带来的风险移成丰田经历要展示的行为。原文先让消费者号召他人抵制，再让企业面对声誉风险并回应；B把造成风险的一方和处理风险的一方混在一起，改变了例子的作用。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-B-1\"><h3>定位比对法<\/h3>\n<p>先把B接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者引用丰田汽车的经历，是为了举例说明说服顾客抵制产品。<\/p>\n<\/blockquote>\n<p>B的<code>persuading<\/code>和<code>boycotting<\/code>对应第4段第一句的<code>persuade others to boycott products<\/code>，但题干的<code>Toyota Motor&#39;s experience<\/code>定位到段末例句。两处都在同一段，并不说明它们具有同一主语或同一论证作用。<\/p>\n<p>段首的主语是<code>passionate consumers<\/code>，他们试图说服别人抵制产品，结果是目标公司的声誉面临风险。段末的主语是<code>Toyota Motor<\/code>，它用回应活动减轻部分损害；消费者的抵制与企业的应对处在事情的两个不同环节。<\/p>\n<p>若把B理解为丰田说服顾客抵制产品，就把段首消费者的动作移给了丰田。若把B理解为丰田事件只是说明消费者怎样号召抵制，仍然没有对上例句：作者详细写的是丰田的回应方式和减损结果，并未描述某位消费者怎样说服他人抵制丰田产品。<\/p>\n<p>题目要回答例子被用来证明什么，不能只证明“段落里存在抵制一词”。<code>for example<\/code>前最直接的问题是企业回应可能不够快或不够周到，丰田例句正用较快、组织良好的回应接住这一问题。<\/p>\n<p>B将案例前的风险行为当成案例本身所展示的作用，混淆了消费者施压与企业回应的主体和先后关系。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-B-2\"><h3>写作视角法<\/h3>\n<p>原文从风险到例子这样过渡：<\/p>\n<blockquote>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>In such a case, the company&#39;s response may not be sufficiently quick or thoughtful, and the learning curve has been steep.<\/p>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<p>消费者可能号召抵制，企业因而面临回应挑战；丰田案例展示回应活动如何减轻部分损害。<\/p>\n<\/blockquote>\n<p>作者在抵制风险与丰田例子之间特意加了企业回应这一层，说明例子接住的是如何应对，而不是再重复说明抵制怎样被发起。<\/p>\n<p>如果B真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Toyota&#39;s experience shows how passionate consumers persuaded other customers to boycott its products.<\/p>\n<p>丰田的经历说明，热情消费者怎样说服其他顾客抵制其产品。<\/p>\n<\/blockquote>\n<p>这种假设不必让丰田自己发起抵制，但至少需要作者在案例中展示说服者、被说服的顾客和抵制过程。实际例句写的却是丰田回应、直接接触消费者与减损结果，案例的信息重心并不在说服抵制上。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-B-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认丰田案例与新的营销媒体形式有关，不能仅凭这一点判断案例是在展示消费者发起抵制，还是企业作出回应；必须读清例子在本段的承接关系。<\/p>\n<\/blockquote>\n<p>但B实际说的是：<\/p>\n<blockquote>\n<p>persuading customers into boycotting products<br>说服顾客抵制产品。<\/p>\n<\/blockquote>\n<p>抵制确实是新传播环境中可能出现的风险，因而B看起来并未离开全文大话题；但题目问丰田例子的作用，讨论范围相近不足以替代主语与作用的核对。<\/p>\n<p>本项最终仍要根据“the company&#39;s response”和“social-media response campaign”这两处局部原文判断。丰田例子承接企业回应问题，并报告部分减损；B把前面的抵制风险移到了例子作用的位置。<\/p>\n<p><strong>复盘判断：B错误。<\/strong><\/p>\n<\/section>"},{"title":"C. cooperating with supportive consumers","raw":"### C. cooperating with supportive consumers\n\n> 与支持自己的消费者合作。\n\n**做题模式中的状态：** 当时C的英文没有遮挡。第一轮用`engage with consumers directly`与`cooperating with supportive consumers`比较，发现接触消费者没有交代这些人都是支持者，也没有确认双方合作这一关系，因此排除C，后续没有改变。\n\n**错误类型：第三类——无中生有。**\n\nC借用了丰田直接接触消费者的动作，将消费者进一步限定为支持丰田的人，又把接触具体化为双方合作。原文只给出与消费者互动的应对措施，没有说明对方预先持支持态度，也没有写双方共同采取行动；不能从“进行了接触”自行补成“与支持者合作”。\n\n**出处：**\n\n> Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 C选项","focus":[94,1870,865,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":34,"option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false},"level":3,"focusId":"focus-q34-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-C-0\"><blockquote>\n<p>与支持自己的消费者合作。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的英文没有遮挡。第一轮用<code>engage with consumers directly<\/code>与<code>cooperating with supportive consumers<\/code>比较，发现接触消费者没有交代这些人都是支持者，也没有确认双方合作这一关系，因此排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用了丰田直接接触消费者的动作，将消费者进一步限定为支持丰田的人，又把接触具体化为双方合作。原文只给出与消费者互动的应对措施，没有说明对方预先持支持态度，也没有写双方共同采取行动；不能从“进行了接触”自行补成“与支持者合作”。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"C. cooperating with supportive consumers","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者引用丰田汽车的经历，是为了举例说明企业与支持自己的消费者合作。\n\n题干的`Toyota Motor`定位末句，C的`consumers`对应定语从句中的`engage with consumers directly`。判断时要读清`engage with`所表达的互动，以及`consumers`有没有被原文限定为支持者。\n\n例句先写丰田通过回应活动减轻部分损害，再用`which included efforts`补充活动包含的做法：在Twitter、Digg等网站上直接接触消费者。这一细节说明沟通方式和渠道，并没有介绍这些消费者对丰田的原有态度。\n\nC的`supportive`加入“支持丰田”这一限定，原句中没有对应词。企业在危机中接触消费者，可以面对疑问、批评或不同意见；仅仅发生沟通，无法确定对方已经支持企业。\n\n`cooperating`还要求双方有合作关系，而`engage with`在这里说明接触、互动。沟通可能成为合作的开始，但原文没有继续说消费者与丰田共同执行回应活动，所以不能把更具体的合作过程直接读进去。\n\nC借用了真实的消费者互动，额外增加对方的支持态度与双方合作关系；这两项都不是原文已给出的丰田经历。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 C选项","focus":[94,1870,865,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":34,"option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q34-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-C-0\"><blockquote>\n<p>与支持自己的消费者合作。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的英文没有遮挡。第一轮用<code>engage with consumers directly<\/code>与<code>cooperating with supportive consumers<\/code>比较，发现接触消费者没有交代这些人都是支持者，也没有确认双方合作这一关系，因此排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用了丰田直接接触消费者的动作，将消费者进一步限定为支持丰田的人，又把接触具体化为双方合作。原文只给出与消费者互动的应对措施，没有说明对方预先持支持态度，也没有写双方共同采取行动；不能从“进行了接触”自行补成“与支持者合作”。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者引用丰田汽车的经历，是为了举例说明企业与支持自己的消费者合作。<\/p>\n<\/blockquote>\n<p>题干的<code>Toyota Motor<\/code>定位末句，C的<code>consumers<\/code>对应定语从句中的<code>engage with consumers directly<\/code>。判断时要读清<code>engage with<\/code>所表达的互动，以及<code>consumers<\/code>有没有被原文限定为支持者。<\/p>\n<p>例句先写丰田通过回应活动减轻部分损害，再用<code>which included efforts<\/code>补充活动包含的做法：在Twitter、Digg等网站上直接接触消费者。这一细节说明沟通方式和渠道，并没有介绍这些消费者对丰田的原有态度。<\/p>\n<p>C的<code>supportive<\/code>加入“支持丰田”这一限定，原句中没有对应词。企业在危机中接触消费者，可以面对疑问、批评或不同意见；仅仅发生沟通，无法确定对方已经支持企业。<\/p>\n<p><code>cooperating<\/code>还要求双方有合作关系，而<code>engage with<\/code>在这里说明接触、互动。沟通可能成为合作的开始，但原文没有继续说消费者与丰田共同执行回应活动，所以不能把更具体的合作过程直接读进去。<\/p>\n<p>C借用了真实的消费者互动，额外增加对方的支持态度与双方合作关系；这两项都不是原文已给出的丰田经历。<\/p>\n<\/section>"},{"title":"C. cooperating with supportive consumers","raw":"#### 写作视角法\n\n原文在例子中这样安排信息：\n\n> Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.\n>\n> 作者先交代部分损害得到缓解，再说明所用的回应活动，并补充在社交网站上直接接触消费者这一做法。\n\n实际例句围绕“回应怎样起作用”组织材料，直接接触消费者是回应活动的一部分。文章并没有接着区分支持者与反对者，也没有把成效归因于消费者与丰田共同合作。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Toyota worked together with consumers who supported the company to carry out its social-media response campaign.\n>\n> 丰田与支持公司的消费者合作，共同开展社交媒体回应活动。\n\n这段假设只补出C必需的支持态度和共同合作，便能让案例用于说明C。实际文章没有写这两条关系，而是以丰田为行动主体，说它努力直接接触消费者；回应取得成效也不能反向证明对方原本就是支持者或合作伙伴。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 C选项","focus":[94,1870,865,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":34,"option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false},"level":4,"focusId":"focus-q34-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-C-0\"><blockquote>\n<p>与支持自己的消费者合作。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时C的英文没有遮挡。第一轮用<code>engage with consumers directly<\/code>与<code>cooperating with supportive consumers<\/code>比较，发现接触消费者没有交代这些人都是支持者，也没有确认双方合作这一关系，因此排除C，后续没有改变。<\/p>\n<p><strong>错误类型：第三类——无中生有。<\/strong><\/p>\n<p>C借用了丰田直接接触消费者的动作，将消费者进一步限定为支持丰田的人，又把接触具体化为双方合作。原文只给出与消费者互动的应对措施，没有说明对方预先持支持态度，也没有写双方共同采取行动；不能从“进行了接触”自行补成“与支持者合作”。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-C-1\"><h3>定位比对法<\/h3>\n<p>先把C接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者引用丰田汽车的经历，是为了举例说明企业与支持自己的消费者合作。<\/p>\n<\/blockquote>\n<p>题干的<code>Toyota Motor<\/code>定位末句，C的<code>consumers<\/code>对应定语从句中的<code>engage with consumers directly<\/code>。判断时要读清<code>engage with<\/code>所表达的互动，以及<code>consumers<\/code>有没有被原文限定为支持者。<\/p>\n<p>例句先写丰田通过回应活动减轻部分损害，再用<code>which included efforts<\/code>补充活动包含的做法：在Twitter、Digg等网站上直接接触消费者。这一细节说明沟通方式和渠道，并没有介绍这些消费者对丰田的原有态度。<\/p>\n<p>C的<code>supportive<\/code>加入“支持丰田”这一限定，原句中没有对应词。企业在危机中接触消费者，可以面对疑问、批评或不同意见；仅仅发生沟通，无法确定对方已经支持企业。<\/p>\n<p><code>cooperating<\/code>还要求双方有合作关系，而<code>engage with<\/code>在这里说明接触、互动。沟通可能成为合作的开始，但原文没有继续说消费者与丰田共同执行回应活动，所以不能把更具体的合作过程直接读进去。<\/p>\n<p>C借用了真实的消费者互动，额外增加对方的支持态度与双方合作关系；这两项都不是原文已给出的丰田经历。<\/p>\n<\/section><section class=\"revealPart\" id=\"f te>\n<p>Toyota worked together with consumers who supported the company to carry out its social-media response campaign.<\/p>\n<p>丰田与支持公司的消费者合作，共同开展社交媒体回应活动。<\/p>\n<\/blockquote>\n<p>这段假设只补出C必需的支持态度和共同合作，便能让案例用于说明C。实际文章没有写这两条关系，而是以丰田为行动主体，说它努力直接接触消费者；回应取得成效也不能反向证明对方原本就是支持者或合作伙伴。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-C-3\"><h3>主旨交叉验证法<\/h3>\n<p>35题的正确答案是：<\/p>\n<blockquote>\n<p>Alternatives to conventional paid media<br>传统付费媒体之外的多种营销媒体形式。<\/p>\n<\/blockquote>\n<p>把这个主旨直接代入34题题干：<\/p>\n<blockquote>\n<p>全文主旨只能确认丰田经历用于说明新营销媒体环境中的具体做法，不能判断它接触的消费者是否支持丰田，也不能判断双方是否建立了合作关系。<\/p>\n<\/blockquote>\n<p>但C实际说的是：<\/p>\n<blockquote>\n<p>cooperating with supportive consumers<br>与支持自己的消费者合作。<\/p>\n<\/blockquote>\n<p>全文确实介绍消费者参与传播，这让C表面上与主题相近；但消费者参与并不只有支持企业这一种方向，第3、4段恰好还写他们可能提出负面指控与抵制。不能从主题中的消费者参与，直接推到某次沟通对象都是支持者。<\/p>\n<p>本项最终仍要根据“engage with consumers directly”这处局部原文判断。它只说明丰田直接与消费者互动，没有确认<code>supportive<\/code>的态度和<code>cooperating<\/code>的合作行为，C增添了案例中没有交代的信息。<\/p>\n<p><strong>复盘判断：C错误。<\/strong><\/p>\n<\/section>"},{"title":"D. taking advantage of hijacked media","raw":"### D. taking advantage of hijacked media\n\n> 利用被劫持媒体为自己取得好处。\n\n**做题模式中的状态：** 当时D的英文没有遮挡。第一轮注意到`hijacked media`与段落主题相同，但把丰田减轻部分损害的回应，与D利用被劫持媒体获益的说法比较后，认为原文没有把危机本身写成可利用的机会，因此排除D，后续没有改变。\n\n**错误类型：第一类——歪曲原意。**\n\nD借用了丰田使用社交媒体回应危机的事实，把“借社交媒体减少被劫持带来的损害”改成“利用被劫持媒体取得好处”。`taking advantage of`并不专指赚到金钱，关键在于把某物当成有利资源加以利用；原文把媒体被劫持呈现为需要应对的风险，实际用来应对的是回应活动与消费者沟通，不能直接把这两者合并。\n\n**出处：**\n\n> If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.\n>\n> Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1958,803,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"option","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false},"level":3,"focusId":"focus-q34-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>利用被劫持媒体为自己取得好处。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮注意到<code>hijacked media<\/code>与段落主题相同，但把丰田减轻部分损害的回应，与D利用被劫持媒体获益的说法比较后，认为原文没有把危机本身写成可利用的机会，因此排除D，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了丰田使用社交媒体回应危机的事实，把“借社交媒体减少被劫持带来的损害”改成“利用被劫持媒体取得好处”。<code>taking advantage of<\/code>并不专指赚到金钱，关键在于把某物当成有利资源加以利用；原文把媒体被劫持呈现为需要应对的风险，实际用来应对的是回应活动与消费者沟通，不能直接把这两者合并。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<\/section>"},{"title":"D. taking advantage of hijacked media","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者引用丰田汽车的经历，是为了举例说明企业利用被劫持媒体为自己取得好处。\n\nD的`hijacked media`要接回第3段末和第4段开头的施压、抵制风险；题干的`Toyota Motor`则定位例句。需要同时看清企业面对的是什么问题，以及它实际使用了什么应对手段。\n\n前文说媒体被劫持后，企业可能遭到消费者抵制，声誉处于风险之中。例句写丰田`alleviated some of the damage`，所用手段是`a ... social-media response campaign`，活动包括直接接触消费者。句子明确的是丰田通过回应减少损害。\n\nD把`hijacked media`直接放到`taking advantage of`后面，使被劫持媒体成为企业利用的有利资源。原句却没有说丰田借负面指控扩展营销、吸引客户或获得其他新的机会；它报告的是面对负面局面采取回应，而不是把负面传播本身作为有利条件来经营。\n\n减少损害当然对企业有好处，但“行动产生好处”不等于“利用造成风险的那个对象”。就像及时处理投诉能减少损失，不等于企业把投诉本身当作营销资源；还需要原文明确写出后一种利用关系。\n\nD将应对的风险对象与采取的传播手段合在一起，把有效补救改成利用被劫持媒体的机会，没有保持例句的动作与对象关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1958,803,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q34-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>利用被劫持媒体为自己取得好处。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮注意到<code>hijacked media<\/code>与段落主题相同，但把丰田减轻部分损害的回应，与D利用被劫持媒体获益的说法比较后，认为原文没有把危机本身写成可利用的机会，因此排除D，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了丰田使用社交媒体回应危机的事实，把“借社交媒体减少被劫持带来的损害”改成“利用被劫持媒体取得好处”。<code>taking advantage of<\/code>并不专指赚到金钱，关键在于把某物当成有利资源加以利用；原文把媒体被劫持呈现为需要应对的风险，实际用来应对的是回应活动与消费者沟通，不能直接把这两者合并。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者引用丰田汽车的经历，是为了举例说明企业利用被劫持媒体为自己取得好处。<\/p>\n<\/blockquote>\n<p>D的<code>hijacked media<\/code>要接回第3段末和第4段开头的施压、抵制风险；题干的<code>Toyota Motor<\/code>则定位例句。需要同时看清企业面对的是什么问题，以及它实际使用了什么应对手段。<\/p>\n<p>前文说媒体被劫持后，企业可能遭到消费者抵制，声誉处于风险之中。例句写丰田<code>alleviated some of the damage<\/code>，所用手段是<code>a ... social-media response campaign<\/code>，活动包括直接接触消费者。句子明确的是丰田通过回应减少损害。<\/p>\n<p>D把<code>hijacked media<\/code>直接放到<code>taking advantage of<\/code>后面，使被劫持媒体成为企业利用的有利资源。原句却没有说丰田借负面指控扩展营销、吸引客户或获得其他新的机会；它报告的是面对负面局面采取回应，而不是把负面传播本身作为有利条件来经营。<\/p>\n<p>减少损害当然对企业有好处，但“行动产生好处”不等于“利用造成风险的那个对象”。就像及时处理投诉能减少损失，不等于企业把投诉本身当作营销资源；还需要原文明确写出后一种利用关系。<\/p>\n<p>D将应对的风险对象与采取的传播手段合在一起，把有效补救改成利用被劫持媒体的机会，没有保持例句的动作与对象关系。<\/p>\n<\/section>"},{"title":"D. taking advantage of hijacked media","raw":"#### 写作视角法\n\n原文关于丰田的结尾写道：\n\n> Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.\n>\n> 丰田通过相对迅速、组织良好的社交媒体回应活动减轻了部分危机损害，其中包括直接接触消费者。\n\n这句话用减损结果收束前文的风险与回应挑战。作者没有继续介绍丰田如何把被劫持的传播转成营销机会，案例在“缓解损害”这里结束。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Toyota turned the hijacked media surrounding its recall crisis into an opportunity to promote its brand.\n>\n> 丰田把召回危机周围的被劫持媒体转化为推广品牌的机会。\n\n假设写法给被劫持媒体增加了可被利用的机会这一角色。实际例句只是说明丰田及时回应并减轻部分损害，未把反向传播变成新的推广资源；仅仅借社交网站接触消费者，不能替代这一步利用关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1958,803,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false},"level":4,"focusId":"focus-q34-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>利用被劫持媒体为自己取得好处。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮注意到<code>hijacked media<\/code>与段落主题相同，但把丰田减轻部分损害的回应，与D利用被劫持媒体获益的说法比较后，认为原文没有把危机本身写成可利用的机会，因此排除D，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了丰田使用社交媒体回应危机的事实，把“借社交媒体减少被劫持带来的损害”改成“利用被劫持媒体取得好处”。<code>taking advantage of<\/code>并不专指赚到金钱，关键在于把某物当成有利资源加以利用；原文把媒体被劫持呈现为需要应对的风险，实际用来应对的是回应活动与消费者沟通，不能直接把这两者合并。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者引用丰田汽车的经历，是为了举例说明企业利用被劫持媒体为自己取得好处。<\/p>\n<\/blockquote>\n<p>D的<code>hijacked media<\/code>要接回第3段末和第4段开头的施压、抵制风险；题干的<code>Toyota Motor<\/code>则定位例句。需要同时看清企业面对的是什么问题，以及它实际使用了什么应对手段。<\/p>\n<p>前文说媒体被劫持后，企业可能遭到消费者抵制，声誉处于风险之中。例句写丰田<code>alleviated some of the damage<\/code>，所用手段是<code>a ... social-media response campaign<\/code>，活动包括直接接触消费者。句子明确的是丰田通过回应减少损害。<\/p>\n<p>D把<code>hijacked media<\/code>直接放到<code>taking advantage of<\/code>后面，使被劫持媒体成为企业利用的有利资源。原句却没有说丰田借负面指控扩展营销、吸引客户或获得其他新的机会；它报告的是面对负面局面采取回应，而不是把负面传播本身作为有利条件来经营。<\/p>\n<p>减少损害当然对企业有好处，但“行动产生好处”不等于“利用造成风险的那个对象”。就像及时处理投诉能减少损失，不等于企业把投诉本身当作营销资源；还需要原文明确写出后一种利用关系。<\/p>\n<p>D将应对的风险对象与采取的传播手段合在一起，把有效补救改成利用被劫持媒体的机会，没有保持例句的动作与对象关系。<\/p>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-2\"><h3>写作视角法<\/h3>\n<p>原文关于丰田的结尾写道：<\/p>\n<blockquote>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<p>丰田通过相对迅速、组织良好的社交媒体回应活动减轻了部分危机损害，其中包括直接接触消费者。<\/p>\n<\/blockquote>\n<p>这句话用减损结果收束前文的风险与回应挑战。作者没有继续介绍丰田如何把被劫持的传播转成营销机会，案例在“缓解损害”这里结束。<\/p>\n<p>如果D真是作者的意思，文章至少得写成：<\/p>\n<blockquote>\n<p>Toyota turned the hijacked media surrounding its recall crisis into an opportunity to promote its brand.<\/p>\n<p>丰田把召回危机周围的被劫持媒体转化为推广品牌的机会。<\/p>\n<\/blockquote>\n<p>假设写法给被劫持媒体增加了可被利用的机会这一角色。实际例句只是说明丰田及时回应并减轻部分损害，未把反向传播变成新的推广资源；仅仅借社交网站接触消费者，不能替代这一步利用关系。<\/p>\n<\/section>"},{"title":"D. taking advantage of hijacked media","raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Alternatives to conventional paid media  \n> 传统付费媒体之外的多种营销媒体形式。\n\n把这个主旨直接代入34题题干：\n\n> 全文主旨只能确认丰田案例说明企业与新营销媒体之间的关系，不能单独判断它是在把被劫持媒体转成机会，还是在回应这一风险并减少损害。\n\n但D实际说的是：\n\n> taking advantage of hijacked media  \n> 利用被劫持媒体为自己取得好处。\n\n全文介绍各种媒体形式，并不等于每一种形式都以给企业创造机会的方式出现。第3、4段专门补充被劫持媒体的风险，D不能因为开头说企业可以利用多种媒体，就把结尾处理风险的案例也一律读成利用机会。\n\n本项最终仍要根据“alleviated some of the damage”和“social-media response campaign”这两处局部原文判断。实际行动是通过回应限制损害，原文没有赋予被劫持媒体本身可供丰田利用的有利角色；D混淆了应对风险与利用风险来源的关系。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题 D选项","focus":[93,1958,803,68],"sourceW":1432,"sourceH":2573},"meta":{"kind":"method","question":34,"option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":true},"level":4,"focusId":"focus-q34-D-3","html":"<section class=\"revealPart optionLead\" id=\"focus-q34-D-0\"><blockquote>\n<p>利用被劫持媒体为自己取得好处。<\/p>\n<\/blockquote>\n<p><strong>做题模式中的状态：<\/strong> 当时D的英文没有遮挡。第一轮注意到<code>hijacked media<\/code>与段落主题相同，但把丰田减轻部分损害的回应，与D利用被劫持媒体获益的说法比较后，认为原文没有把危机本身写成可利用的机会，因此排除D，后续没有改变。<\/p>\n<p><strong>错误类型：第一类——歪曲原意。<\/strong><\/p>\n<p>D借用了丰田使用社交媒体回应危机的事实，把“借社交媒体减少被劫持带来的损害”改成“利用被劫持媒体取得好处”。<code>taking advantage of<\/code>并不专指赚到金钱，关键在于把某物当成有利资源加以利用；原文把媒体被劫持呈现为需要应对的风险，实际用来应对的是回应活动与消费者沟通，不能直接把这两者合并。<\/p>\n<p><strong>出处：<\/strong><\/p>\n<blockquote>\n<p>If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.<\/p>\n<p>Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.<\/p>\n<\/blockquote>\n<\/section><section class=\"revealPart\" id=\"focus-q34-D-1\"><h3>定位比对法<\/h3>\n<p>先把D接回题干，整句话就变成：<\/p>\n<blockquote>\n<p>作者引用丰田汽车的经历，是为了举例说明企业利用被劫持媒体为自己取得好处。<\/p>\n<\/blockquote>\n<p>D的<code>hijacked media<\/code>要接回第3段末和第4段开头的施压、抵制风险；题干的<code>Toyota Motor<\/code>则定位例句。需要同时看清企业面对的是什么问题，以及它实际使用 局部原文判断。实际行动是通过回应限制损害，原文没有赋予被劫持媒体本身可供丰田利用的有利角色；D混淆了应对风险与利用风险来源的关系。<\/p>\n<p><strong>复盘判断：D错误。<\/strong><\/p>\n<\/section>"},{"title":"34题结论","raw":"### 34题结论\n\n> **34. A. responding effectively to hijacked media**\n\nA把前文的回应挑战与丰田取得部分减损效果的经历接起来，准确概括例子作用。\n\nB把案例之前消费者号召抵制的风险行为，移成丰田例子要展示的内容。\n\nC借直接接触消费者这一做法，补出对方支持丰田及双方合作的关系。\n\nD把利用社交媒体回应风险，改成利用被劫持媒体本身取得好处。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[18,1606,1170,420],"sourceW":1432,"sourceH":2573},"meta":{"kind":"conclusion","question":34},"level":3,"html":"<blockquote>\n<p><strong>34. A. responding effectively to hijacked media<\/strong><\/p>\n<\/blockquote>\n<p>A把前文的回应挑战与丰田取得部分减损效果的经历接起来，准确概括例子作用。<\/p>\n<p>B把案例之前消费者号召抵制的风险行为，移成丰田例子要展示的内容。<\/p>\n<p>C借直接接触消费者这一做法，补出对方支持丰田及双方合作的关系。<\/p>\n<p>D把利用社交媒体回应风险，改成利用被劫持媒体本身取得好处。<\/p>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"section":"第四鸟 · 新题型","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n## 段落与全文逻辑框架\n\n**逻辑层次1：营销媒体的演变**（段落1核心观点） 传统观念：营销成功=付费投入 → 现状转变：【传统付费媒体仍重要 // 但出现多种替代形式】→ 三种媒体类型：（付费媒体：电视广告、印刷广告）+（赚得媒体：消费者自愿向朋友推广）+（自有媒体：公司向注册客户发送邮件）→ 核心变化：营销影响力来源超越传统付费媒体\n\n↓（深入分析媒体类型）\n\n**逻辑层次2：媒体类型的控制权与转化**（段落2媒体分类详解） 控制权差异：（付费/自有媒体：营销者控制）//（赚得媒体：营销者只是发起者）→ 媒体转化现象：自有媒体→他人的付费媒体（如电商网站卖广告位）→ 出售媒体定义：流量强大到其他组织愿意入驻 → 发展趋势：【始于零售商和旅游业 → 案例：强生BabyCenter（推广竞品）→ 多重好处：（创收+显得客观+学习他人营销+扩大流量）】\n\n↓（技术变革的双面性）\n\n**逻辑层次3：技术变革带来的风险**（段落3负面影响） 技术双刃剑：提供更多沟通选择 // 增加负面表达风险 → 劫持媒体定义：【与赚得媒体相反：品牌/活动成为负面指控的人质】→ 实施方式：社交网络成员学会劫持媒体向企业施压\n\n↓（应对策略）\n\n**逻辑层次4：企业应对劫持媒体的挑战**（段落4应对案例） 劫持后果：消费者说服他人抵制→公司声誉受损 → 应对困境：（反应可能不够快速/周到+学习曲线陡峭）→ 成功案例：丰田汽车（召回危机时快速精心的社交媒体回应：直接在Twitter和Digg与消费者互动）\n\n↑（全文主旨）\n\n全文核心观点：数字时代的营销已经从单纯的付费模式演变为包含付费、自有、赚得和出售媒体的多元化体系，技术变革在提供更多机会的同时也带来了劫持媒体的风险，企业需要学会在这个复杂的媒体环境中有效应对。\n\n## 小标题题\n\nRead the following text and choose the most suitable heading from the list A–G for each numbered section (41–45). There are two extra headings.\n\n[A] Building an organization for sustained and coordinated action\n\n[B] Replacing paid advertising with entirely free promotion\n\n[C] Expanding the media framework to include new opportunities and risks\n\n[D] Turning customer conversations into responses and improvements\n\n[E] Connecting channels and publishing partners for richer experiences\n\n[F] Protecting a brand by removing unfavorable customer comments\n\n[G] Spreading personally relevant experiences through consumer networks\n\n### 41. ______\n\nMarketing success can no longer be understood simply in terms of how much a company pays for advertising. Paid media still matter, but companies also use their own channels and benefit when consumers willingly promote their products. Even this familiar framework of paid, owned, and earned media is becoming too limited.\n\nTwo further categories are needed. An owned site with enough traffic can sell space to other marketers, turning part of its audience into a source of income. At the same time, consumers or activists can take over a company's media or campaign to spread negative claims and put its reputation at risk. These sold and hijacked forms extend the framework in opposite directions: one offers additional commercial possibilities, while the other exposes a loss of control. Together they show why choosing where to buy advertisements is no longer an adequate marketing plan.\n\n### 42. ______\n\nThe different media increasingly work together. Paid advertising can draw people into a company's owned channels, where a brief encounter can develop into repeated, more targeted contact. JetBlue, for example, promoted its Twitter offering through many channels and used the resulting audience to distribute timely ticket deals at a low variable cost.\n\nCompanies also turn to publishing partners because they cannot provide every part of a richer experience themselves. Dell and Nissan worked with the Sundance Channel on a television talk show whose advertising blended into its content. The partnership gave the brands access to an engaged audience. Useful digital services offer further possibilities: mobile tools compare product prices or show where drinks are sold, while food manufacturers can collaborate with a recipe platform. Across these examples, the task is to connect channels, content, and partners so that marketing offers consumers more than an isolated advertisement.\n\n### 43. ______\n\nA personal conversation might seem an unlikely way to achieve the scale marketers want. Yet newer media allow richer interactions and more precise targeting, encouraging consumers to share experiences that please them. Personal relevance and wide circulation can therefore support each other.\n\nMcDonald's in Japan used Twitter and blogging platforms to draw on a large fan base when promoting products and offers. Some praise arose spontaneously; other promotion was encouraged by giving fans free meals. The important link was between a consumer's enthusiasm and the decision to talk about it. The company's own and paid efforts could help generate earned media as satisfied people spread the message. The example shows how marketing can reach further through experiences that consumers want to make part of their own conversations.\n\n### 44. ______\n\nAs consumers talk in real time, companies need to do more than watch the conversation. An electronics company responded to every comment within 24 hours. Positive feedback received thanks and invitations or offers; negative comments received help with product problems, guidance on using an interface, or questions designed to discover what the customer disliked.\n\nHotel chains similarly encouraged satisfied guests to post reviews while employing staff to follow and answer complaints. These exchanges also supplied information for future improvements. Giving consumers a voice reduced the control marketers had traditionally sought, but it could bring the company closer to problems that needed attention. To weaken the basis of justified criticism, a company ultimately had to make the design or service improvements that customers reasonably requested. The conversation thus became part of delivering better goods and services, as well as responding to reputational risk.\n\n### 45. ______\n\nThese changes require more than a collection of new promotional tools. Companies must decide what each media type is for and coordinate the content and placement of advertising accordingly. Owned channels need continuing programs, fresh content, adequate budgets, focused management, and suitable measures of performance.\n\nThey also need agreed rules for handling attacks and an experienced community manager with authority to coordinate marketing, public relations, legal, and other units. Creativity and analysis both remain necessary, but execution becomes more important as the work grows more complex. Teams must be able to operate across different channels, use data effectively, and manage quality and risk. Priorities will vary with the organization, so leaders should support carefully designed pilots and invest in approaches that can grow. The broader media landscape can deepen consumer engagement only if the organization develops the resources and coordination needed to act on it.","context":{"mode":"newtype","kind":"smallTitle","current":"","label":"小标题题"},"meta":{},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们溯源了本篇阅读的命题人修改之前的版本，改编成小标题题和排序题供大家练习。<\/p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：<\/p>\n<h2>段落与全文逻辑框架<\/h2>\n<p><strong>逻辑层次1：营销媒体的演变<\/strong>（段落1核心观点） 传统观念：营销成功=付费投入 → 现状转变：【传统付费媒体仍重要 // 但出现多种替代形式】→ 三种媒体类型：（付费媒体：电视广告、印刷广告）+（赚得媒体：消费者自愿向朋友推广）+（自有媒体：公司向注册客户发送邮件）→ 核心变化：营销影响力来源超越传统付费媒体<\/p>\n<p>↓（深入分析媒体类型）<\/p>\n<p><strong>逻辑层次2：媒体类型的控制权与转化<\/strong>（段落2媒体分类详解） 控制权差异：（付费/自有媒体：营销者控制）//（赚得媒体：营销者只是发起者）→ 媒体转化现象：自有媒体→他人的付费媒体（如电商网站卖广告位）→ 出售媒体定义：流量强大到其他组织愿意入驻 → 发展趋势：【始于零售商和旅游业 → 案例：强生BabyCenter（推广竞品）→ 多重好处：（创收+显得客观+学习他人营销+扩大流量）】<\/p>\n<p>↓（技术变革的双面性）<\/p>\n<p><strong>逻辑层次3：技术变革带来的风险<\/strong>（段落3负面影响） 技术双刃剑：提供更多沟通选择 // 增加负面表达风险 → 劫持媒体定义：【与赚得媒体相反：品牌/活动成为负面指控的人质】→ 实施方式：社交网络成员学会劫持媒体向企业施压<\/p>\n<p>↓（应对策略）<\/p>\n<p><strong>逻辑层次4：企业应对劫持媒体的挑战<\/strong>（段落4应对案例） 劫持后果：消费者说服他人抵制→公司声誉受损 → 应对困境：（反应可能不够快速/周到+学习曲线陡峭）→ 成功案例：丰田汽车（召回危机时快速精心的社交媒体回应：直接在Twitter和Digg与消费者互动）<\/p>\n<p>↑（全文主旨）<\/p>\n<p>全文核心观点：数字时代的营销已经从单纯的付费模式演变为包含付费、自有、赚得和出售媒体的多元化体系，技术变革在提供更多机会的同时也带来了劫持媒体的风险，企业需要学会在这个复杂的媒体环境中有效应对。<\/p>\n"},{"title":"小标题题 · 41题","level":3,"section":"第四鸟 · 新题型","raw":"### 41题解析\n\n**答案：C — Expanding the media framework to include new opportunities and risks。** 中文：扩展媒体分类框架，把新的机会与风险纳入其中。\n\n这一部分整体在说明：只考虑付费广告不够，连“付费、自有、赚得”这套三分类也需要扩充。第二段给出两个新类别，分别代表商业机会和声誉风险，因此这部分的中心是分类框架的扩展及其必要性。\n\n关键证据是第一段的 Even this familiar framework ... is becoming too limited，和第二段开头的 Two further categories are needed。结尾的 Together 把出售与劫持两类重新收拢，回到“购买广告位置不足以构成完整营销计划”的判断。\n\n段内推进链是：付费多少不能解释全部营销效果 → 原有三类有用但覆盖不足 → 自有流量可以出售 → 自有传播也可能被负面力量接管 → 新的机会与风险要求扩充框架。\n\n标题中的 Expanding 对应 too limited 与 two further categories；media framework 对应五种媒体的分类；new opportunities 对应出售媒体增加收入的可能；risks 对应被劫持后声誉受威胁。标题覆盖了两段共同要解决的问题。\n\n最强干扰项是B。它抓住了“付费广告不是全部”和消费者自愿推广，却把补充原有框架改成彻底替代付费广告。开头已明确 Paid media still matter，出售媒体还涉及收入，整块更不是在保证所有推广完全免费。\n\n**最终答案：41选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"41","label":"小标题题"},"meta":{},"html":"<h3>41题解析<\/h3>\n<p><strong>答案：C — Expanding the media framework to include new opportunities and risks。<\/strong> 中文：扩展媒体分类框架，把新的机会与风险纳入其中。<\/p>\n<p>这一部分整体在说明：只考虑付费广告不够，连“付费、自有、赚得”这套三分类也需要扩充。第二段给出两个新类别，分别代表商业机会和声誉风险，因此这部分的中心是分类框架的扩展及其必要性。<\/p>\n<p>关键证据是第一段的 Even this familiar framework ... is becoming too limited，和第二段开头的 Two further categories are needed。结尾的 Together 把出售与劫持两类重新收拢，回到“购买广告位置不足以构成完整营销计划”的判断。<\/p>\n<p>段内推进链是：付费多少不能解释全部营销效果 → 原有三类有用但覆盖不足 → 自有流量可以出售 → 自有传播也可能被负面力量接管 → 新的机会与风险要求扩充框架。<\/p>\n<p>标题中的 Expanding 对应 too limited 与 two further categories；media framework 对应五种媒体的分类；new opportunities 对应出售媒体增加收入的可能；risks 对应被劫持后声誉受威胁。标题覆盖了两段共同要解决的问题。<\/p>\n<p>最强干扰项是B。它抓住了“付费广告不是全部”和消费者自愿推广，却把补充原有框架改成彻底替代付费广告。开头已明确 Paid media still matter，出售媒体还涉及收入，整块更不是在保证所有推广完全免费。<\/p>\n<p><strong>最终答案：41选C。<\/strong><\/p>\n"},{"title":"小标题题 · 42题","level":3,"section":"第四鸟 · 新题型","raw":"### 42题解析\n\n**答案：E — Connecting channels and publishing partners for richer experiences。** 中文：连接不同渠道与内容出版合作方，提供更丰富的体验。\n\n这一部分整体在解释：媒体类型不是彼此孤立的广告位置，公司可以把渠道接起来，也可以借助合作方补充内容和服务能力。两段分别从渠道整合和出版合作展开，落点都是丰富消费者的接触体验。\n\n开头的 increasingly work together 直接给出整合方向。第二段的 also turn to publishing partners 在已有渠道连接上增加合作关系；结尾的 Across these examples 把机票信息、电视节目和数字服务统一概括为连接 channels、content、partners。\n\n段内推进链是：付费渠道引入自有渠道 → 一次接触变成持续联系 → JetBlue用多个渠道积累受众并发送优惠 → 企业自身能力有限 → 通过节目与信息服务合作丰富体验。\n\n标题的 Connecting channels 对应付费媒体导流和JetBlue多渠道推广；publishing partners 对应Sundance Channel及其他内容、信息服务平台；richer experiences 对应消费者获得持续优惠、有吸引力的节目或有用信息。它能同时统摄两段。\n\n最强干扰项是G。文中确实出现更有针对性的联系，但本部分没有把“消费者自发向他人分享”作为共同机制。JetBlue发送优惠、品牌与电视台合作、工具提供价格信息，主要讲渠道和合作方怎样配合；G需要的消费者分享链在下一部分才成为中心。\n\n**最终答案：42选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"42","label":"小标题题"},"meta":{},"html":"<h3>42题解析<\/h3>\n<p><strong>答案：E — Connecting channels and publishing partners for richer experiences。<\/strong> 中文：连接不同渠道与内容出版合作方，提供更丰富的体验。<\/p>\n<p>这一部分整体在解释：媒体类型不是彼此孤立的广告位置，公司可以把渠道接起来，也可以借助合作方补充内容和服务能力。两段分别从渠道整合和出版合作展开，落点都是丰富消费者的接触体验。<\/p>\n<p>开头的 increasingly work together 直接给出整合方向。第二段的 also turn to publishing partners 在已有渠道连接上增加合作关系；结尾的 Across these examples 把机票信息、电视节目和数字服务统一概括为连接 channels、content、partners。<\/p>\n<p>段内推进链是：付费渠道引入自有渠道 → 一次接触变成持续联系 → JetBlue用多个渠道积累受众并发送优惠 → 企业自身能力有限 → 通过节目与信息服务合作丰富体验。<\/p>\n<p>标题的 Connecting channels 对应付费媒体导流和JetBlue多渠道推广；publishing partners 对应Sundance Channel及其他内容、信息服务平台；richer experiences 对应消费者获得持续优惠、有吸引力的节目或有用信息。它能同时统摄两段。<\/p>\n<p>最强干扰项是G。文中确实出现更有针对性的联系，但本部分没有把“消费者自发向他人分享”作为共同机制。JetBlue发送优惠、品牌与电视台合作、工具提供价格信息，主要讲渠道和合作方怎样配合；G需要的消费者分享链在下一部分才成为中心。<\/p>\n<p><strong>最终答案：42选E。<\/strong><\/p>\n"},{"title":"小标题题 · 43题","level":3,"section":"第四鸟 · 新题型","raw":"### 43题解析\n\n**答案：G — Spreading personally relevant experiences through consumer networks。** 中文：通过消费者网络传播与个人相关的体验。\n\n这一部分整体在回答：看似一对一、个性化的体验，怎样获得营销所需的广泛传播？作者先指出个人相关性与传播规模可以相互支持，再用麦当劳的例子说明消费者如何把自己的喜爱传给别人。\n\n开头的 might seem 提出“个人交流难以形成规模”的直觉，Yet 随即转折；第二段的 The important link 则明确连接 enthusiasm 与 talk about it。结尾把效果收束到消费者愿意纳入自己谈话的体验。\n\n段内推进链是：个人交流看似覆盖有限 → 新媒体加强互动和精准触达 → 快乐体验促使分享 → 麦当劳吸引并鼓励粉丝表达喜爱 → 企业自身投入带动消费者传播 → 个性化体验获得更大覆盖。\n\n标题的 personally relevant experiences 对应更精准的互动、消费者的喜爱与满意；consumer networks 对应Twitter、博客及粉丝之间的交流；Spreading 对应talk about it、spread the message，概括的是体验怎样经由消费者扩大影响。\n\n最强干扰项是B。earned media容易让人想到免费宣传，但这里还明确出现paid efforts和free meals。免费餐是企业提供给粉丝的激励，并不等于企业没有投入；原文讲付费、自有、赚得相互带动，不能概括成用完全免费的推广替代付费广告。\n\n**最终答案：43选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"43","label":"小标题题"},"meta":{},"html":"<h3>43题解析<\/h3>\n<p><strong>答案：G — Spreading personally relevant experiences through consumer networks。<\/strong> 中文：通过消费者网络传播与个人相关的体验。<\/p>\n<p>这一部分整体在回答：看似一对一、个性化的体验，怎样获得营销所需的广泛传播？作者先指出个人相关性与传播规模可以相互支持，再用麦当劳的例子说明消费者如何把自己的喜爱传给别人。<\/p>\n<p>开头的 might seem 提出“个人交流难以形成规模”的直觉，Yet 随即转折；第二段的 The important link 则明确连接 enthusiasm 与 talk about it。结尾把效果收束到消费者愿意纳入自己谈话的体验。<\/p>\n<p>段内推进链是：个人交流看似覆盖有限 → 新媒体加强互动和精准触达 → 快乐体验促使分享 → 麦当劳吸引并鼓励粉丝表达喜爱 → 企业自身投入带动消费者传播 → 个性化体验获得更大覆盖。<\/p>\n<p>标题的 personally relevant experiences 对应更精准的互动、消费者的喜爱与满意；consumer networks 对应Twitter、博客及粉丝之间的交流；Spreading 对应talk about it、spread the message，概括的是体验怎样经由消费者扩大影响。<\/p>\n<p>最强干扰项是B。earned media容易让人想到免费宣传，但这里还明确出现paid efforts和free meals。免费餐是企业提供给粉丝的激励，并不等于企业没有投入；原文讲付费、自有、赚得相互带动，不能概括成用完全免费的推广替代付费广告。<\/p>\n<p><strong>最终答案：43选G。<\/strong><\/p>\n"},{"title":"小标题题 · 44题","level":3,"section":"第四鸟 · 新题型","raw":"### 44题解析\n\n**答案：D — Turning customer conversations into responses and improvements。** 中文：把消费者交流转化为回应与改进。\n\n这一部分整体在解释企业怎样参与实时对话：不仅观察声量，还要回答问题、了解不满，并把交流所得用于改进商品和服务。电子公司和酒店的例子都服务于这条行动链。\n\n开头的 do more than watch 明确排除只监测不行动；第二段的 also supplied information for future improvements 把回应推进到信息用途；最后的 ultimately had to make ... improvements 则说明沟通不能代替合理的实质改进。\n\n段内推进链是：消费者实时表达 → 企业及时区分好评与差评并回应 → 从追问和评论中发现问题 → 收集未来改进所需信息 → 落实合理的设计或服务改进 → 同时提高交付质量与应对声誉风险。\n\n标题中的 customer conversations 对应评论、追问和酒店评价；responses 对应感谢、使用指导与问题解释；improvements 对应收集信息及落实正当诉求。这三个部分和原文的先后推进逐一对应。\n\n最强干扰项是F。它利用负面评论和声誉风险两个词，把“回应问题、消除合理批评的依据”偷换成“删掉不利评论”。本部分明确保留消费者表达，甚至主动追问其不满；最终改变的是产品和服务的问题，没有提出删除评论。\n\n**最终答案：44选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"44","label":"小标题题"},"meta":{},"html":"<h3>44题解析<\/h3>\n<p><strong>答案：D — Turning customer conversations into responses and improvements。<\/strong> 中文：把消费者交流转化为回应与改进。<\/p>\n<p>这一部分整体在解释企业怎样参与实时对话：不仅观察声量，还要回答问题、了解不满，并把交流所得用于改进商品和服务。电子公司和酒店的例子都服务于这条行动链。<\/p>\n<p>开头的 do more than watch 明确排除只监测不行动；第二段的 also supplied information for future improvements 把回应推进到信息用途；最后的 ultimately had to make ... improvements 则说明沟通不能代替合理的实质改进。<\/p>\n<p>段内推进链是：消费者实时表达 → 企业及时区分好评与差评并回应 → 从追问和评论中发现问题 → 收集未来改进所需信息 → 落实合理的设计或服务改进 → 同时提高交付质量与应对声誉风险。<\/p>\n<p>标题中的 customer conversations 对应评论、追问和酒店评价；responses 对应感谢、使用指导与问题解释；improvements 对应收集信息及落实正当诉求。这三个部分和原文的先后推进逐一对应。<\/p>\n<p>最强干扰项是F。它利用负面评论和声誉风险两个词，把“回应问题、消除合理批评的依据”偷换成“删掉不利评论”。本部分明确保留消费者表达，甚至主动追问其不满；最终改变的是产品和服务的问题，没有提出删除评论。<\/p>\n<p><strong>最终答案：44选D。<\/strong><\/p>\n"},{"title":"小标题题 · 45题","level":3,"section":"第四鸟 · 新题型","raw":"### 45题解析\n\n**答案：A — Building an organization for sustained and coordinated action。** 中文：建设能够持续投入、协调行动的组织。\n\n这一部分整体在把前面的媒体变化转化为企业内部的建设任务：明确各类媒体的角色、持续安排资源、授予管理者协调权限，并通过团队执行与试点落实。它关注的是组织怎样具备长期行动能力。\n\n开头的 require more than a collection of new promotional tools 把重点从工具转向支撑工具的组织。随后 need continuing programs、budgets、management 和 manager with authority 连续列出条件；结尾的 only if 把营销机会与资源、协调能力建立必要联系。\n\n段内推进链是：先确定媒体分工 → 为自有渠道提供持续内容与预算 → 建立应对规则和跨部门授权 → 把创意、分析转化为执行 → 按企业实际开展试点 → 通过资源与协调把机会变成效果。\n\n标题的 Building an organization 对应管理者、团队与职责安排；sustained 对应持续内容、预算和投入；coordinated action 对应广告协作、跨部门联动和跨渠道执行。它把分散的管理建议收在共同目标下。\n\n最强干扰项是E。这里也提到不同渠道及广告内容，但它们用于说明企业内部如何分工、预算和执行，并没有像42题那样以外部出版合作为中心。只用“连接渠道与合作方”会漏掉授权、绩效指标、风险管理和试点这些主体内容。\n\n**最终答案：45选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"45","label":"小标题题"},"meta":{},"html":"<h3>45题解析<\/h3>\n<p><strong>答案：A — Building an organization for sustained and coordinated action。<\/strong> 中文：建设能够持续投入、协调行动的组织。<\/p>\n<p>这一部分整体在把前面的媒体变化转化为企业内部的建设任务：明确各类媒体的角色、持续安排资源、授予管理者协调权限，并通过团队执行与试点落实。它关注的是组织怎样具备长期行动能力。<\/p>\n<p>开头的 require more than a collection of new promotional tools 把重点从工具转向支撑工具的组织。随后 need continuing programs、budgets、management 和 manager with authority 连续列出条件；结尾的 only if 把营销机会与资源、协调能力建立必要联系。<\/p>\n<p>段内推进链是：先确定媒体分工 → 为自有渠道提供持续内容与预算 → 建立应对规则和跨部门授权 → 把创意、分析转化为执行 → 按企业实际开展试点 → 通过资源与协调把机会变成效果。<\/p>\n<p>标题的 Building an organization 对应管理者、团队与职责安排；sustained 对应持续内容、预算和投入；coordinated action 对应广告协作、跨部门联动和跨渠道执行。它把分散的管理建议收在共同目标下。<\/p>\n<p>最强干扰项是E。这里也提到不同渠道及广告内容，但它们用于说明企业内部如何分工、预算和执行，并没有像42题那样以外部出版合作为中心。只用“连接渠道与合作方”会漏掉授权、绩效指标、风险管理和试点这些主体内容。<\/p>\n<p><strong>最终答案：45选A。<\/strong><\/p>\n"},{"title":"排序题","level":2,"section":"第四鸟 · 新题型","raw":"## 排序题\n\nThe following paragraphs are given in a wrong order. Reorganize them into a coherent text by choosing from the list A–H to fill in each numbered box (41–45). Paragraphs A, E and H have been correctly placed.\n\n| 已给位置 | 41 | 42 | 已给位置 | 43 | 44 | 45 | 已给位置 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| A | ______ | ______ | E | ______ | ______ | ______ | H |\n\n### [A]\n\nPaid advertising still plays an important role, but it does not account for everything that shapes a purchase. Companies also reach customers through their own channels, and enthusiastic consumers may promote products for them. Even the familiar classification of paid, owned, and earned media leaves important questions unanswered. What happens when a company sells advertising space on its own site? What happens when activists take hold of its campaign to spread negative claims? Answering these questions requires a broader media framework.\n\n### [B]\n\nIn these real-time conversations, listening by itself is not enough. An electronics company, for instance, answered every comment within 24 hours: it thanked pleased users and offered explanations or follow-up questions to dissatisfied ones. Hotel chains likewise followed negative reviews and gathered information for future improvements. These activities place marketers on the front line of service delivery and require continuing work. That work raises an organizational question: who will do it, with what resources and authority?\n\n### [C]\n\nPersonal relevance need not come at the expense of scale. New media can encourage consumers to share experiences they enjoy. McDonald's in Japan, for example, used Twitter and blogging platforms to encourage fans to talk about its products. Some promotion was spontaneous, while some was encouraged with free meals. Thus the company's paid and owned efforts could generate earned media through consumers' enthusiasm. The same opportunities for users to express themselves also bring companies into real-time conversations.\n\n### [D]\n\nThis interaction is particularly clear when paid media feed consumers into owned-media channels. There a company can turn a brief encounter into an ongoing relationship. JetBlue promoted its Twitter offering through several channels and then sent timely ticket deals to the audience it had built, at a low variable cost. The approach reduced reliance on expensive paid media while strengthening contact with consumers. But sustaining richer experiences can require publishing capabilities that a marketer cannot supply alone.\n\n### [E]\n\nWhen marketers cannot supply everything themselves, media publishers can help. Dell and Nissan, for example, worked with the Sundance Channel to create a television talk show, with advertising blended into its content. The brands gained exposure to a highly engaged audience and connected with their target groups. Mobile information tools and collaborations with recipe platforms offer other ways to make content useful. Such collaborations are one way to build a richer experience; another is to make the experience personally relevant.\n\n### [F]\n\nTwo additions complete this broader framework. Sold media arise when a company's owned channel attracts enough traffic to host another marketer's content or advertising. Hijacked media arise when consumers or activists turn a channel or campaign against the brand. These categories bring opportunities as well as reputational risks. Adding them changes more than the names in a classification: marketers must look beyond buying space and allocating budgets. The five types do not operate in isolation; their growing interaction is changing the marketer's work.\n\n### [G]\n\nAnswering that organizational question requires a reassessment of both resources and responsibility. Owned channels need fresh content, sustained investment, management, and appropriate performance measures. A community manager needs clear rules and authority to coordinate with marketing, public relations, legal, and other units. Creativity and analysis must be joined by effective execution across many different channels. The precise priorities will depend on the company's circumstances. These changes are too varied to be imposed by a simple order from the top.\n\n### [H]\n\nInstead, leaders should put together carefully designed pilots and seek support for investments that can be applied at scale. Hiring staff to answer social-media comments may initially be difficult to justify, but such work may become essential to limiting brand hijacking. Companies must also make the legitimate product and service improvements consumers seek. More media types can deepen engagement cost effectively; realizing that opportunity calls for renewed attention to execution, coordination, speed, and performance.\n\n## 排序题全局解析\n\n| 段落 | 本段功能 |\n| --- | --- |\n| A | 保留付费媒体的重要性，指出原有三分类无法解释出售与负面接管两个现象。 |\n| B | 承接实时交流，说明企业需要及时回应并改进服务，再提出人员、资源和权限问题。 |\n| C | 说明个性化体验可以扩大传播，用麦当劳展示企业投入怎样带动消费者分享。 |\n| D | 说明媒体整合怎样形成持续关系，用JetBlue举例，末尾提出企业内容能力的局限。 |\n| E | 说明出版合作如何补足能力并丰富体验，随后引出个人相关性这条方向。 |\n| F | 用出售和劫持补齐分类，并把关注点从分类转向五类媒体之间的互动。 |\n| G | 回答资源与权限问题，提出持续投入、管理授权和执行要求，指出不能简单自上而下强推。 |\n| H | 用试点和可推广的投入落实变化，最后收束为执行、协调、速度和绩效。 |\n\n全文推进链是：原有分类出现解释缺口 → 增加两类并认识媒体互动 → 整合渠道形成持续关系 → 借助出版合作补足体验能力 → 用个人相关性带动消费者分享 → 参与实时对话并回应、改进 → 建立组织资源与协调能力 → 通过试点落实并提高执行表现。\n\nA末尾提出broader media framework，F开头用Two additions完成补充。F结尾的interaction接D的This interaction；D末尾的cannot supply alone接E开头的cannot supply everything themselves。E结尾先提出personally relevant，C才具体解释Personal relevance；C结尾引出real-time conversations，B再讨论In these real-time conversations该怎样回应。B末尾提出organizational question，G直接回答；G最后否定简单命令，H用Instead转向试点。\n\n**完整顺序：A—F—D—E—C—B—G—H。**\n\n**41—45：F、D、C、B、G。**","context":{"mode":"newtype","kind":"sorting","current":"","label":"排序题"},"meta":{},"html":"<h2>排序题全局解析<\/h2>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>本段功能<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>A<\/td>\n<td>保留付费媒体的重要性，指出原有三分类无法解释出售与负面接管两个现象。<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>承接实时交流，说明企业需要及时回应并改进服务，再提出人员、资源和权限问题。<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>说明个性化体验可以扩大传播，用麦当劳展示企业投入怎样带动消费者分享。<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>说明媒体整合怎样形成持续关系，用JetBlue举例，末尾提出企业内容能力的局限。<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>说明出版合作如何补足能力并丰富体验，随后引出个人相关性这条方向。<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>用出售和劫持补齐分类，并把关注点从分类转向五类媒体之间的互动。<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>回答资源与权限问题，提出持续投入、管理授权和执行要求，指出不能简单自上而下强推。<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>用试点和可推广的投入落实变化，最后收束为执行、协调、速度和绩效。<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>全文推进链是：原有分类出现解释缺口 → 增加两类并认识媒体互动 → 整合渠道形成持续关系 → 借助出版合作补足体验能力 → 用个人相关性带动消费者分享 → 参与实时对话并回应、改进 → 建立组织资源与协调能力 → 通过试点落实并提高执行表现。<\/p>\n<p>A末尾提出broader media framework，F开头用Two additions完成补充。F结尾的interaction接D的This interaction；D末尾的cannot supply alone接E开头的cannot supply everything themselves。E结尾先提出personally relevant，C才具体解释Personal relevance；C结尾引出real-time conversations，B再讨论In these real-time conversations该怎样回应。B末尾提出organizational question，G直接回答；G最后否定简单命令，H用Instead转向试点。<\/p>\n<p><strong>完整顺序：A—F—D—E—C—B—G—H。<\/strong><\/p>\n<p><strong>41—45：F、D、C、B、G。<\/strong><\/p>\n"},{"title":"排序题 · 41题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序41题解析\n\n当前空位在已给A之后、42题之前。A末尾提出两个原有三分类解释不了的问题：自有网站出售广告位，以及活动被人接管后传播负面指控。因此41题应先补齐分类，再引出其后媒体怎样互动。\n\nA段尾是 Answering these questions requires a broader media framework；F段首用 Two additions complete this broader framework 接住。F紧接着解释sold与hijacked，分别回答A的两个问题；F结尾的 their growing interaction 则为后一空D的 This interaction 提供明确前项。\n\n这里的衔接有两层：these questions要求回答刚才那两个分类缺口，this broader framework要求承接已经提出的扩充任务。F先完成这个任务，再从“有哪几类”转向“各类怎样共同工作”，功能连续。\n\n局部推进链：A列出现有分类解释不了的两种情况 → F补入出售、劫持两类 → F提出五类相互作用 → D具体说明付费媒体怎样引入自有渠道。\n\n最强候选是D，因为A也提到paid和owned。但D段首This interaction需要前文已明确提出互动关系，A还在提问分类为何不足；直接放D会跳过两个问题的回答，也让F后来失去紧接问题的落点。\n\n**最终答案：41填F。**","context":{"mode":"newtype","kind":"sorting","current":"F","label":"排序题"},"meta":{},"html":"<h3>排序41题解析<\/h3>\n<p>当前空位在已给A之后、42题之前。A末尾提出两个原有三分类解释不了的问题：自有网站出售广告位，以及活动被人接管后传播负面指控。因此41题应先补齐分类，再引出其后媒体怎样互动。<\/p>\n<p>A段尾是 Answering these questions requires a broader media framework；F段首用 Two additions complete this broader framework 接住。F紧接着解释sold与hijacked，分别回答A的两个问题；F结尾的 their growing interaction 则为后一空D的 This interaction 提供明确前项。<\/p>\n<p>这里的衔接有两层：these questions要求回答刚才那两个分类缺口，this broader framework要求承接已经提出的扩充任务。F先完成这个任务，再从“有哪几类”转向“各类怎样共同工作”，功能连续。<\/p>\n<p>局部推进链：A列出现有分类解释不了的两种情况 → F补入出售、劫持两类 → F提出五类相互作用 → D具体说明付费媒体怎样引入自有渠道。<\/p>\n<p>最强候选是D，因为A也提到paid和owned。但D段首This interaction需要前文已明确提出互动关系，A还在提问分类为何不足；直接放D会跳过两个问题的回答，也让F后来失去紧接问题的落点。<\/p>\n<p><strong>最终答案：41填F。<\/strong><\/p>\n"},{"title":"排序题 · 42题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序42题解析\n\n当前空位在已确定的F之后、已给E之前。F已经从媒体分类转向五类之间的interaction；E开头则说，当营销者无法独立提供全部东西时，出版合作方可以帮助。中间需要既展示互动，也引出企业自身能力有限。\n\nF段尾的 their growing interaction 对应D段首的 This interaction。D解释付费媒体向自有渠道导流并用JetBlue举例，末尾转为 publishing capabilities that a marketer cannot supply alone；E段首的 When marketers cannot supply everything themselves 随即接住能力不足。\n\n前端由抽象关系进入具体机制，后端由But提出新问题，再由E给出合作办法。D因此不是简单重复“媒体”一词，而是把两个已给讨论阶段接成一条因果和问题解决链。\n\n局部推进链：F提出五类媒体相互作用 → D展示渠道整合形成长期联系 → D指出丰富体验仍可能超出自身能力 → E说明合作方怎样补足。\n\n最强候选是C。C同样讲媒体相互带动，但中心是个性化体验和消费者分享，结尾引出实时交流，没有为E的“不能独自提供全部能力”建立问题。把C放在这里也会让E末尾刚提出的个人相关性失去下一段解释。\n\n**最终答案：42填D。**","context":{"mode":"newtype","kind":"sorting","current":"D","label":"排序题"},"meta":{},"html":"<h3>排序42题解析<\/h3>\n<p>当前空位在已确定的F之后、已给E之前。F已经从媒体分类转向五类之间的interaction；E开头则说，当营销者无法独立提供全部东西时，出版合作方可以帮助。中间需要既展示互动，也引出企业自身能力有限。<\/p>\n<p>F段尾的 their growing interaction 对应D段首的 This interaction。D解释付费媒体向自有渠道导流并用JetBlue举例，末尾转为 publishing capabilities that a marketer cannot supply alone；E段首的 When marketers cannot supply everything themselves 随即接住能力不足。<\/p>\n<p>前端由抽象关系进入具体机制，后端由But提出新问题，再由E给出合作办法。D因此不是简单重复“媒体”一词，而是把两个已给讨论阶段接成一条因果和问题解决链。<\/p>\n<p>局部推进链：F提出五类媒体相互作用 → D展示渠道整合形成长期联系 → D指出丰富体验仍可能超出自身能力 → E说明合作方怎样补足。<\/p>\n<p>最强候选是C。C同样讲媒体相互带动，但中心是个性化体验和消费者分享，结尾引出实时交流，没有为E的“不能独自提供全部能力”建立问题。把C放在这里也会让E末尾刚提出的个人相关性失去下一段解释。<\/p>\n<p><strong>最终答案：42填D。<\/strong><\/p>\n"},{"title":"排序题 · 43题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序43题解析\n\n当前空位在已给E之后、44题之前。E末尾把丰富体验的方式分为两条：前文已经说明合作，另一条是make the experience personally relevant。下一段应展开第二条，并向后面的实时对话过渡。\n\nE段尾的 personally relevant 与C段首的 Personal relevance 精确呼应。C先说明个人相关性不必牺牲规模，再用麦当劳粉丝分享说明为什么，末尾引出 real-time conversations；后一空B便以 In these real-time conversations 开始。\n\nE的another提示一个待展开的新方向，C负责展开；C结尾又把用户表达从主动分享推广到实时交流，给B讨论具体应答留出接口。前后都是“先命名对象，再具体展开”，不能颠倒。\n\n局部推进链：E提出个人相关性这条体验路径 → C解释精准互动如何带动分享并扩大覆盖 → C引出用户实时表达 → B讨论企业该怎样参与这些对话。\n\n最强候选是B，因为它也有消费者体验与产品服务。但B首句中的these real-time conversations尚未由E建立，E刚提出的personal relevance也没有得到解释。C既回答E的新方向，又给B的指代提供前项。\n\n**最终答案：43填C。**","context":{"mode":"newtype","kind":"sorting","current":"C","label":"排序题"},"meta":{},"html":"<h3>排序43题解析<\/h3>\n<p>当前空位在已给E之后、44题之前。E末尾把丰富体验的方式分为两条：前文已经说明合作，另一条是make the experience personally relevant。下一段应展开第二条，并向后面的实时对话过渡。<\/p>\n<p>E段尾的 personally relevant 与C段首的 Personal relevance 精确呼应。C先说明个人相关性不必牺牲规模，再用麦当劳粉丝分享说明为什么，末尾引出 real-time conversations；后一空B便以 In these real-time conversations 开始。<\/p>\n<p>E的another提示一个待展开的新方向，C负责展开；C结尾又把用户表达从主动分享推广到实时交流，给B讨论具体应答留出接口。前后都是“先命名对象，再具体展开”，不能颠倒。<\/p>\n<p>局部推进链：E提出个人相关性这条体验路径 → C解释精准互动如何带动分享并扩大覆盖 → C引出用户实时表达 → B讨论企业该怎样参与这些对话。<\/p>\n<p>最强候选是B，因为它也有消费者体验与产品服务。但B首句中的these real-time conversations尚未由E建立，E刚提出的personal relevance也没有得到解释。C既回答E的新方向，又给B的指代提供前项。<\/p>\n<p><strong>最终答案：43填C。<\/strong><\/p>\n"},{"title":"排序题 · 44题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序44题解析\n\n当前空位在已确定的C之后、45题之前。C刚把消费者表达引向实时交流；45题所填G会回答一个organizational question。因此44题要先说明交流带来哪些实际工作，再提出由谁、用什么资源完成这些工作。\n\nC段尾的 real-time conversations 对应B开头的 In these real-time conversations。B用电子公司和酒店说明回应、追问及改进的具体工作，结尾问 who will do it, with what resources and authority；G段首的 Answering that organizational question 正好指回这个问题。\n\n前端是重复对象和these指代，后端是明确的问答关系。更深一层，B把消费者层面的交流变化转成企业层面的持续任务，G才有理由讨论资源、人员和授权。\n\n局部推进链：C出现实时交流 → B说明及时应答与改进需要持续工作 → B提出执行人员、资源和权限问题 → G给出组织建设要求。\n\n最强候选是G。它看似可以直接接C谈管理，但that organizational question在C里没有明确前项；C还没有说明应答评论和改善服务为什么需要专门工作。若越过B，组织要求就缺少这里具体的问题来源。\n\n**最终答案：44填B。**","context":{"mode":"newtype","kind":"sorting","current":"B","label":"排序题"},"meta":{},"html":"<h3>排序44题解析<\/h3>\n<p>当前空位在已确定的C之后、45题之前。C刚把消费者表达引向实时交流；45题所填G会回答一个organizational question。因此44题要先说明交流带来哪些实际工作，再提出由谁、用什么资源完成这些工作。<\/p>\n<p>C段尾的 real-time conversations 对应B开头的 In these real-time conversations。B用电子公司和酒店说明回应、追问及改进的具体工作，结尾问 who will do it, with what resources and authority；G段首的 Answering that organizational question 正好指回这个问题。<\/p>\n<p>前端是重复对象和these指代，后端是明确的问答关系。更深一层，B把消费者层面的交流变化转成企业层面的持续任务，G才有理由讨论资源、人员和授权。<\/p>\n<p>局部推进链：C出现实时交流 → B说明及时应答与改进需要持续工作 → B提出执行人员、资源和权限问题 → G给出组织建设要求。<\/p>\n<p>最强候选是G。它看似可以直接接C谈管理，但that organizational question在C里没有明确前项；C还没有说明应答评论和改善服务为什么需要专门工作。若越过B，组织要求就缺少这里具体的问题来源。<\/p>\n<p><strong>最终答案：44填B。<\/strong><\/p>\n"},{"title":"排序题 · 45题","level":3,"section":"第四鸟 · 新题型","raw":"### 排序45题解析\n\n当前空位在已确定的B之后、已给H之前。B末尾问谁负责、需要什么资源和权限；H开头用Instead提出试点方案。45题既要回答B的组织问题，也要提供被Instead替换的旧推进方式。\n\nB段尾的 organizational question 与G段首的 Answering that organizational question 形成问答。G分别写持续投资、管理、绩效标准和跨部门授权，末尾否定 a simple order from the top；H随后用 Instead, leaders should ... pilots 转为有支持、有试验的推进方式。\n\n资源和responsibility接住前端，Instead接住后端否定。段落功能也完整：先弄清要建立哪些能力，再指出这些多样变化无法只靠命令，最后由H提出可逐步验证和推广的落实办法。\n\n局部推进链：B提出组织问题 → G明确资源、管理权限和执行要求 → G否定简单自上而下强推 → H提出试点、投入和可规模化应用。\n\n最强候选是F。F也说营销工作不能停留在预算分配，但它是在扩充媒体分类，没有回应B中的人员与authority，也没有提供H的Instead所反对的“自上而下命令”。它还必须紧接A回答两个分类缺口，不能移到收尾处。\n\n**最终答案：45填G。**","context":{"mode":"newtype","kind":"sorting","current":"G","label":"排序题"},"meta":{},"html":"<h3>排序45题解析<\/h3>\n<p>当前空位在已确定的B之后、已给H之前。B末尾问谁负责、需要什么资源和权限；H开头用Instead提出试点方案。45题既要回答B的组织问题，也要提供被Instead替换的旧推进方式。<\/p>\n<p>B段尾的 organizational question 与G段首的 Answering that organizational question 形成问答。G分别写持续投资、管理、绩效标准和跨部门授权，末尾否定 a simple order from the top；H随后用 Instead, leaders should ... pilots 转为有支持、有试验的推进方式。<\/p>\n<p>资源和responsibility接住前端，Instead接住后端否定。段落功能也完整：先弄清要建立哪些能力，再指出这些多样变化无法只靠命令，最后由H提出可逐步验证和推广的落实办法。<\/p>\n<p>局部推进链：B提出组织问题 → G明确资源、管理权限和执行要求 → G否定简单自上而下强推 → H提出试点、投入和可规模化应用。<\/p>\n<p>最强候选是F。F也说营销工作不能停留在预算分配，但它是在扩充媒体分类，没有回应B中的人员与authority，也没有提供H的Instead所反对的“自上而下命令”。它还必须紧接A回答两个分类缺口，不能移到收尾处。<\/p>\n<p><strong>最终答案：45填G。<\/strong><\/p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| keeping pace with the times | 与时俱进 | 人生哲理类 | 个人主题 |\n| rational consumption | 理性消费 | 社会现象类—社会生活 | 个人主题 |\n| **assessing online information critically** | **批判性地甄别网络信息** | **社会现象类—科技经济** | **个人主题** |\n| proper use of the Internet | 合理使用互联网 | 社会现象类—科技经济 | 个人主题 |\n| **building a healthy Net** | **构建网络文明** | **社会现象类—科技经济** | **宏观主题** |\n| a sense of responsibility | 责任感 | 人生哲理类 | 个人主题 |\n| technological innovation | 科技创新 | 经济消费类 | 宏观主题 |\n| e-co
