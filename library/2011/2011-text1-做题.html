<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"questionTop","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 21题题干\n\n**We learn from Paragraph 1 that Gilbert’s appointment has ______.**\n\n> 从第1段可以知道，Gilbert的任命产生了怎样的反响？\n\n题型：**具体细节题**。\n\n---","html":"<h2>21题题干</h2>\n<p><strong>We learn from Paragraph 1 that Gilbert’s appointment has ______.</strong></p>\n<blockquote>\n<p>从第1段可以知道，Gilbert的任命产生了怎样的反响？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,200,1360,403]],"scrollTarget":"question","meta":{"kind":"stem","qid":"21"}},{"section":"先读题干","raw":"## 22题题干\n\n**Tommasini regards Gilbert as an artist who is ______.**\n\n> Tommasini认为Gilbert是一位怎样的艺术家？\n\n题型：**具体细节题**。\n\n---","html":"<h2>22题题干</h2>\n<p><strong>Tommasini regards Gilbert as an artist who is ______.</strong></p>\n<blockquote>\n<p>Tommasini认为Gilbert是一位怎样的艺术家？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,608,1360,402]],"scrollTarget":"question","meta":{"kind":"stem","qid":"22"}},{"section":"先读题干","raw":"## 23题题干\n\n**The author believes that the devoted concertgoers ______.**\n\n> 作者认为那些忠实的音乐会观众怎么了？\n\n题型：**局部推断题**。\n\n---","html":"<h2>23题题干</h2>\n<p><strong>The author believes that the devoted concertgoers ______.</strong></p>\n<blockquote>\n<p>作者认为那些忠实的音乐会观众怎么了？</p>\n</blockquote>\n<p>题型：<strong>局部推断题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,1015,1360,403]],"scrollTarget":"question","meta":{"kind":"stem","qid":"23"}},{"section":"先读题干","raw":"## 24题题干\n\n**According to the text, which of the following is true of recordings?**\n\n> 根据文章，下面哪一项对录音的说法正确？\n\n题型：**具体细节题**。\n\n---","html":"<h2>24题题干</h2>\n<p><strong>According to the text, which of the following is true of recordings?</strong></p>\n<blockquote>\n<p>根据文章，下面哪一项对录音的说法正确？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,1423,1360,402]],"scrollTarget":"question","meta":{"kind":"stem","qid":"24"}},{"section":"先读题干","raw":"## 25题题干\n\n**Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.**\n\n> 对于Gilbert振兴纽约爱乐的作用，作者持什么态度？\n\n题型：**全文作者态度／主旨题**。\n\n---","html":"<h2>25题题干</h2>\n<p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.</strong></p>\n<blockquote>\n<p>对于Gilbert振兴纽约爱乐的作用，作者持什么态度？</p>\n</blockquote>\n<p>题型：<strong>全文作者态度／主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[235,1830,1360,410]],"scrollTarget":"question","meta":{"kind":"stem","qid":"25"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | however, but, moreover, thus |\n| 态度词 / 评价词 | 先抓大概是赞同、怀疑还是转折 | favorable, surprise, faint praise, missing the point |\n| 动作词 | 先看谁对谁做了什么 | hire, compete, program, change |\n| 结果词 | 看最后造成了什么局面 | crisis, will not be enough, succeed |\n| 重复主题词 | 大概知道文章一直围着什么转 | Philharmonic, Gilbert, recordings, audience |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>however, but, moreover, thus</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓大概是赞同、怀疑还是转折</td>\n  <td>favorable, surprise, faint praise, missing the point</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁对谁做了什么</td>\n  <td>hire, compete, program, change</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后造成了什么局面</td>\n  <td>crisis, will not be enough, succeed</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道文章一直围着什么转</td>\n  <td>Philharmonic, Gilbert, recordings, audience</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[227,360,1321,236],[228,621,1322,348],[228,987,1321,288],[227,1300,1323,497],[227,1822,1321,401]],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the **[xxx]** announcement of his appointment in 2009. For the most part, the response has been favorable, to say the least. “Hooray! At last!” wrote Anthony Tommasini, a **[xxx]** classical-music critic.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the <span class=\"mask\">[xxx]</span> announcement of his appointment in 2009. For the most part, the response has been favorable, to say the least. “Hooray! At last!” wrote Anthony Tommasini, a <span class=\"mask\">[xxx]</span> classical-music critic.</p>\n</div></div>","articleRects":[[227,360,1321,236]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true},"contextRaw":""},{"section":"读文章","raw":"The decision of the New York Philharmonic to hire Alan Gilbert as its next music director / has been the talk of the classical-music world / ever since the **[xxx]** announcement of his appointment in 2009. / For the most part, / the response has been favorable, / to say the least. / “Ho eDone\"><p>2、原因之一：如此令人意外；吉尔伯特，一个不摆架子的音乐家，像轻淡的赞扬。</p>\n</div><div class=\"coarsePara coarseDone\"><p>3、就我而言，我不知道吉尔伯特是否是伟大指挥；但这没有必要。</p>\n</div><div class=\"coarsePara coarseDone\"><p>4、忠实现场观众没有抓住要点；时间注意力和金钱必须竞争，和录制演出竞争；这些录音很便宜，于是带来一场危机。</p>\n</div><div class=\"coarsePara currentFocus\"><p>5、一种可能的应对：安排有吸引力的新音乐；能够改变纽约爱乐并不够，他们首先必须改变关系。</p>\n</div></div>","articleRects":[[227,1822,1321,401]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":4,"form":3,"coarse":true},"contextRaw":"1、这一决定：纽约爱乐乐团聘请艾伦吉尔伯特，一直备受议论，反应一直很赞同。\n\n2、原因之一：如此令人意外；吉尔伯特，一个不摆架子的音乐家，像轻淡的赞扬。\n\n3、就我而言，我不知道吉尔伯特是否是伟大指挥；但这没有必要。\n\n4、忠实现场观众没有抓住要点；时间注意力和金钱必须竞争，和录制演出竞争；这些录音很便宜，于是带来一场危机。"},{"section":"读文章","raw":"粗读这一遍，只需要先留下一个松轮廓：开头在谈纽约爱乐聘请Gilbert，外界反应偏正面，但这个人又让人意外；作者随后说自己并不知道他到底够不够好，又把现场音乐会和录音放到一起比较；后面出现录音便宜、随时可听、给传统音乐会带来危机，以及新音乐还不够、还得改变与新观众的关系。\n\n现在还不用把每个遮挡词补出来，也不用立刻判断Gilbert到底能不能成功。粗读已经帮我们记住了几个位置：第1段是任命反响，第2段是Tommasini怎样评价Gilbert，第4段集中写现场演出和录音的竞争，第5段收在“现成办法还不够”。做21—24题时，再按题干回这些位置精读即可。","html":"<p>粗读这一遍，只需要先留下一个松轮廓：开头在谈纽约爱乐聘请Gilbert，外界反应偏正面，但这个人又让人意外；作者随后说自己并不知道他到底够不够好，又把现场音乐会和录音放到一起比较；后面出现录音便宜、随时可听、给传统音乐会带来危机，以及新音乐还不够、还得改变与新观众的关系。</p>\n<p>现在还不用把每个遮挡词补出来，也不用立刻判断Gilbert到底能不能成功。粗读已经帮我们记住了几个位置：第1段是任命反响，第2段是Tommasini怎样评价Gilbert，第4段集中写现场演出和录音的竞争，第5段收在“现成办法还不够”。做21—24题时，再按题干回这些位置精读即可。</p>\n","articleRects":[[227,360,1321,236],[228,621,1322,348],[228,987,1321,288],[227,1300,1323,497],[227,1822,1321,401]],"questionRects":[],"scrollTarget":"articleTop","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做21至24题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"21题","raw":"## 21题\n\n> We learn from Paragraph 1 that Gilbert’s appointment has ______.  \n> 从第1段可以知道，Gilbert的任命产生了怎样的反响？\n\n题干明确点名第1段。粗读时好像记得开头有`talk`、`favorable`和一声“Hooray”，整体反响偏正面，所以先把第1段一次读清。\n\n> 原文参考：\n>\n> The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the **[xxx]** announcement of his appointment in 2009. For the most part, the response has been favorable, to say the least. “Hooray! At last!” wrote Anthony Tommasini, a **[xxx]** classical-music critic.\n>\n> 开始精读：\n>\n> The decision of the New York Philharmonic to hire Alan Gilbert as its next music director / has been the talk of the classical-music world / ever since the **[xxx]** announcement of his appointment in 2009. / For the most part, / the response has been favorable, / to say the least. / “Hooray! At last!” / wrote Anthony Tommasini, / a **[xxx]** classical-music critic.\n>\n> 纽约爱乐决定聘请Alan Gilbert担任下一任音乐总监 / 一直是古典音乐界议论的话题 / 自2009年那次**[xxx]**任命公告以来 / 大体上 / 外界反应一直很赞同 / 至少可以这么说 / “好啊！终于等到了！” / Anthony Tommasini写道 / 他是一位**[xxx]**的古典音乐评论家\n\n现在回到题干。它问的是任命已经得到怎样的整体反响，不是问任命为什么突然，也不是问Gilbert本人是否出名。最直接的判断点是`the response has been favorable`以及后面的欢呼。\n\n接下来按A—D逐项看。","html":"<h2>21题</h2>\n<blockquote>\n<p>We learn from Paragraph 1 that Gilbert’s appointment has ______.<br />\n从第1段可以知道，Gilbert的任命产生了怎样的反响？</p>\n</blockquote>\n<p>题干明确点名第1段。粗读时好像记得开头有<code>talk</code>、<code>favorable</code>和一声“Hooray”，整体反响偏正面，所以先把第1段一次读清。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the <span class=\"mask\">[xxx]</span> announcement of his appointment in 2009. For the most part, the response has been favorable, to say the least. “Hooray! At last!” wrote Anthony Tommasini, a <span class=\"mask\">[xxx]</span> classical-music critic.</p>\n<p>开始精读：</p>\n<p>The decision of the New York Philharmonic to hire Alan Gilbert as its next music director / has been the talk of the classical-music world / ever since the <span class=\"mask\">[xxx]</span> announcement of his appointment in 2009. / For the most part, / the response has been favorable, / to say the least. / “Hooray! At last!” / wrote Anthony Tommasini, / a <span class=\"mask\">[xxx]</span> classical-music critic.</p>\n<p>纽约爱乐决定聘请Alan Gilbert担任下一任音乐总监 / 一直是古典音乐界议论的话题 / 自2009年那次<span class=\"mask\">[xxx]</span>任命公告以来 / 大体上 / 外界反应一直很赞同 / 至少可以这么说 / “好啊！终于等到了！” / Anthony Tommasini写道 / 他是一位<span class=\"mask\">[xxx]</span>的古典音乐评论家</p>\n</blockquote>\n<p>现在回到题干。它问的是任命已经得到怎样的整体反响，不是问任命为什么突然，也不是问Gilbert本人是否出名。最直接的判断点是<code>the response has been favorable</code>以及后面的欢呼。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[227,360,1321,236]],"questionRects":[[235,200,1360,403]],"scrollTarget":"article","meta":{"kind":"question","qid":"21"}},{"section":"21题","raw":"### A. incurred criticism\n\n> 招来了批评\n\n把A接回题干，它说的是：Gilbert的任命招来了批评。\n\nA里最显眼的是负面的`criticism`。刚才精读时，好像只记得第1段明确说反应是正面的，先回去看那两句。\n\n> For the most part, the response has been favorable, to say the least.\n>\n> “Hooray! At last!” wrote Anthony Tommasini.\n\nA和原文谈的是同一件任命，所以第一眼不算跑题；真正要比的是外界反响的方向。\n\n原文说的是：大体反应是`favorable`，一位评论家还直接欢呼“终于等到了”。\n\nA说的却是：这次任命引来了批评。\n\n`has been the talk`只说明大家一直在议论，不能把议论自动读成批评；后面已经给出明确的正面评价，A却把方向翻成负面。\n\n**“大家都在谈”能不能压过明确的`favorable`和“Hooray”，直接改成“招来批评”？**\n\n不能。议论本身没有褒贬，真正带方向的是后面的正面反应和欢呼。\n\n要选A，原文至少还得写到有人反对、责难或批评这次任命；第1段没有。\n\n**第一轮判断：A排除。**","html":"<h3>A. incurred criticism</h3>\n<blockquote>\n<p>招来了批评</p>\n</blockquote>\n<p>把A接回题干，它说的是：Gilbert的任命招来了批评。</p>\n<p>A里最显眼的是负面的<code>criticism</code>。刚才精读时，好像只记得第1段明确说反应是正面的，先回去看那两句。</p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.</p>\n<p>“Hooray! At last!” wrote Anthony Tommasini.</p>\n</blockquote>\n<p>A和原文谈的是同一件任命，所以第一眼不算跑题；真正要比的是外界反响的方向。</p>\n<p>原文说的是：大体反应是<code>favorable</code>，一位评论家还直接欢呼“终于等到了”。</p>\n<p>A说的却是：这次任命引来了批评。</p>\n<p><code>has been the talk</code>只说明大家一直在议论，不能把议论自动读成批评；后面已经给出明确的正面评价，A却把方向翻成负面。</p>\n<p><strong>“大家都在谈”能不能压过明确的<code>favorable</code>和“Hooray”，直接改成“招来批评”？</strong></p>\n<p>不能。议论本身没有褒贬，真正带方向的是后面的正面反应和欢呼。</p>\n<p>要选A，原文至少还得写到有人反对、责难或批评这次任命；第1段没有。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[227,360,1321,236]],"questionRects":[[235,200,1360,403]],"scrollTarget":"article","meta":{"kind":"option","qid":"21","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"21题","raw":"### B. raised suspicion\n\n> 引起了怀疑\n\n把B接回题干，它说的是：Gilbert的任命引起了怀疑。\n\nB里的`suspicion`也是负面反应。刚才精读时，好像见到的是`favorable`和欢呼，没有见到谁怀疑任命，所以回原句核对。\n\n> the response has been favorable\n>\n> “Hooray! At last!”\n\nB仍然抓住了“任命引发某种反应”这个外壳，因此看着像能接题干；但决定答案的是反应究竟是什么。\n\n原文说的是：文章把总体反应写成赞同，并用欢呼把这种正面反应写具体。\n\nB说的却是：文章说人们对任命产生疑心。\n\n第2段说任命令人意外，是因为Gilbert不太出名；“意外”回答的是为什么出乎预料，不等于第1段的公众反应是怀疑。\n\n**“任命出乎意料”是否就等于“人们怀疑这次任命”？**\n\n不等于。意外可以和赞同同时存在，而第1段恰好明确写了赞同。\n\n要选B，原文至少还得出现不信任、质疑其资格或怀疑任命决定的内容；现有句子没有。\n\n**第一轮判断：B排除。**","html":"<h3>B. raised suspicion</h3>\n<blockquote>\n<p>引起了怀疑</p>\n</blockquote>\n<p>把B接回题干，它说的是：Gilbert的任命引起了怀疑。</p>\n<p>B里的<code>suspicion</code>也是负面反应。刚才精读时，好像见到的是<code>favorable</code>和欢呼，没有见到谁怀疑任命，所以回原句核对。</p>\n<blockquote>\n<p>the response has been favorable</p>\n<p>“Hooray! At last!”</p>\n</blockquote>\n<p>B仍然抓住了“任命引发某种反应”这个外壳，因此看着像能接题干；但决定答案的是反应究竟是什么。</p>\n<p>原文说的是：文章把总体反应写成赞同，并用欢呼把这种正面反应写具体。</p>\n<p>B说的却是：文章说人们对任命产生疑心。</p>\n<p>第2段说任命令人意外，是因为Gilbert不太出名；“意外”回答的是为什么出乎预料，不等于第1段的公众反应是怀疑。</p>\n<p><strong>“任命出乎意料”是否就等于“人们怀疑这次任命”？</strong></p>\n<p>不等于。意外可以和赞同同时存在，而第1段恰好明确写了赞同。</p>\n<p>要选B，原文至少还得出现不信任、质疑其资格或怀疑任命决定的内容；现有句子没有。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[227,360,1321,236]],"questionRects":[[235,200,1360,403]],"scrollTarget":"article","meta":{"kind":"option","qid":"21","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"21题","raw":"### C. received acclaim\n\n> 获得了称赞\n\n把C接回题干，它说的是：Gilbert的任命获得了称赞。\n\nC里的`acclaim`要和正面反响对照。刚才精读时，好像`favorable`和“Hooray”正好都在写称赞，先把关系摆回来。\n\n> For the most part, the response has been favorable, to say the least.\n>\n> “Hooray! At last!” wrote Anthony Tommasini.\n\nC没有只抓一个孤立熟词：`favorable`给出总体方向，“Hooray! At last!”又给出具体的公开赞许，两处都落在任命反响上。\n\n原文说的是：任命得到大体正面的回应，并收到评论家的欢呼。\n\nC说的却是：任命获得赞誉。\n\n主体、对象和评价方向都一致；`received acclaim`正好把“正面回应＋欢呼”压成一句话，没有额外增加怀疑、争议或结果。\n\n**`favorable`加公开欢呼，能不能共同支撑“获得称赞”？**\n\n能。两句都在直接给这次任命正面评价。\n\n到这里，C已经有完整的可见关系支撑，不需要再补别的条件。\n\n**第一轮判断：C保留。**","html":"<h3>C. received acclaim</h3>\n<blockquote>\n<p>获得了称赞</p>\n</blockquote>\n<p>把C接回题干，它说的是：Gilbert的任命获得了称赞。</p>\n<p>C里的<code>acclaim</code>要和正面反响对照。刚才精读时，好像<code>favorable</code>和“Hooray”正好都在写称赞，先把关系摆回来。</p>\n<blockquote>\n<p>For the most part, the response has been favorable, to say the least.</p>\n<p>“Hooray! At last!” wrote Anthony Tommasini.</p>\n</blockquote>\n<p>C没有只抓一个孤立熟词：<code>favorable</code>给出总体方向，“Hooray! At last!”又给出具体的公开赞许，两处都落在任命反响上。</p>\n<p>原文说的是：任命得到大体正面的回应，并收到评论家的欢呼。</p>\n<p>C说的却是：任命获得赞誉。</p>\n<p>主体、对象和评价方向都一致；<code>received acclaim</code>正好把“正面回应＋欢呼”压成一句话，没有额外增加怀疑、争议或结果。</p>\n<p><strong><code>favorable</code>加公开欢呼，能不能共同支撑“获得称赞”？</strong></p>\n<p>能。两句都在直接给这次任命正面评价。</p>\n<p>到这里，C已经有完整的可见关系支撑，不需要再补别的条件。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[227,360,1321,236]],"questionRects":[[235,200,1360,403]],"scrollTarget":"article","meta":{"kind":"option","qid":"21","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"21题","raw":"### D. aroused **[xxx]**\n\n> 激起了 **[xxx]**\n\n把D接回题干，它说的是：Gilbert的任命激起了某种被遮挡的反应。\n\nD真正决定意思的是被挡住的名词。刚才精读时，好像只能确认文章写了正面反响；`aroused`本身只表示“引起”，还没有告诉我们引起了什么。\n\n> the response has been favorable\n>\n> “Hooray! At last!”\n\nD的动词外壳和题干能接上，但核心反应完全被挡住。可见部分既没有说明褒贬，也没有把它和原文的赞同、欢呼连起来。\n\n原文说的是：原文已经明确给出可判断的正面反响。\n\nD说的却是：任命引起一种目前不知道内容的反应。\n\n现在不能自己给 **[xxx]** 补意思。与此同时，C已经用完整可见的内容把原文两处正面信号都接住；D的可见部分没有提供第二条独立关系去超过C。\n\n**只认识`aroused`、却不知道它后面引起的究竟是什么，能不能把D当成对第1段反响的完整概括？**\n\n不能。决定方向和内容的核心仍被挡住，单靠“引起”无法回答题干。\n\n要保留D，至少得确认 **[xxx]** 本身和`favorable`、欢呼是同一类反应；当前看不到这一点，而C已有完整支持。\n\n**第一轮判断：D排除。**","html":"<h3>D. aroused <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>激起了 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把D接回题干，它说的是：Gilbert的任命激起了某种被遮挡的反应。</p>\n<p>D真正决定意思的是被挡住的名词。刚才精读时，好像只能确认文章写了正面反响；<code>aroused</code>本身只表示“引起”，还没有告诉我们引起了什么。</p>\n<blockquote>\n<p>the response has been favorable</p>\n<p>“Hooray! At last!”</p>\n</blockquote>\n<p>D的动词外壳和题干能接上，但核心反应完全被挡住。可见部分既没有说明褒贬，也没有把它和原文的赞同、欢呼连起来。</p>\n<p>原文说的是：原文已经明确给出可判断的正面反响。</p>\n<p>D说的却是：任命引起一种目前不知道内容的反应。</p>\n<p>现在不能自己给 <span class=\"mask\">[xxx]</span> 补意思。与此同时，C已经用完整可见的内容把原文两处正面信号都接住；D的可见部分没有提供第二条独立关系去超过C。</p>\n<p><strong>只认识<code>aroused</code>、却不知道它后面引起的究竟是什么，能不能把D当成对第1段反响的完整概括？</strong></p>\n<p>不能。决定方向和内容的核心仍被挡住，单靠“引起”无法回答题干。</p>\n<p>要保留D，至少得确认 <span class=\"mask\">[xxx]</span> 本身和<code>favorable</code>、欢呼是同一类反应；当前看不到这一点，而C已有完整支持。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[227,360,1321,236]],"questionRects":[[235,200,1360,403]],"scrollTarget":"article","meta":{"kind":"option","qid":"21","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P1"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"21题","raw":"### 21题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C保留；\n- D排除；\n\nC把`favorable`和“Hooray”压成“获得称赞”，主体、对象、方向都完整；A、B与原文方向不合，D的决定性核心被挡住且可见部分不足以构成另一条完整解释。\n\n> **21题选C。**","html":"<h3>21题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除；</li>\n</ul>\n<p>C把<code>favorable</code>和“Hooray”压成“获得称赞”，主体、对象、方向都完整；A、B与原文方向不合，D的决定性核心被挡住且可见部分不足以构成另一条完整解释。</p>\n<blockquote>\n<p><strong>21题选C。</strong></p>\n</blockquote>\n","articleRects":[[227,360,1321,236]],"questionRects":[[235,200,1360,403]],"scrollTarget":"question","meta":{"kind":"result","qid":"21"}},{"section":"22题","raw":"## 22题\n\n> Tommasini regards Gilbert as an artist who is ______.  \n> Tommasini认为Gilbert是一位怎样的艺术家？\n\n题干锁定Tommasini对Gilbert的看法。粗读时好像记得第2段有一句直接引语，还出现了`unpretentious`和`faint praise`，所以把第2段完整读清。\n\n> 原文参考：\n>\n> One of the reasons why the appointment came as such a surprise, however, is that Gilbert is **[xxx]** little known. Even Tommasini, who had **[xxx]** Gilbert’s appointment in the Times, calls him “an unpretentious musician with no air of the **[xxx]** conductor about him.” As a description of the next music director of an orchestra that has **[xxx]** been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some Times readers as faint praise.\n>\n> 开始精读：\n>\n> One of the reasons / why the appointment came as such a surprise, / however, / is that Gilbert is **[xxx]** little known. / Even Tommasini, / who had **[xxx]** Gilbert’s appointment in the Times, / calls him / “an unpretentious musician / with no air of the **[xxx]** conductor about him.” / As a description / of the next music director / of an orchestra / that has **[xxx]** been led / by musicians like Gustav Mahler and Pierre Boulez, / that seems likely / to have struck at least some Times readers / as faint praise.\n>\n> 原因之一 / 这次任命为何如此令人意外 / 不过 / 是Gilbert的知名度**[xxx]**低 / 连Tommasini也如此 / 他曾在《泰晤士报》**[xxx]**任命Gilbert / 却称他为 / “一个不摆架子的音乐家 / 身上没有那种**[xxx]**指挥家的气场” / 这样的描述 / 用来形容下一任音乐总监 / 对这样一支乐团而言 / 它此前**[xxx]**由 / Mahler和Boulez这类音乐家领导 / 这很可能 / 让至少一些《泰晤士报》读者觉得 / 只是轻淡的赞扬\n\n现在看题干，它问Tommasini把Gilbert看成怎样的艺术家。最贴近的句子是他亲自使用的描述；后面`faint praise`则提醒我们，这个评价并不是在盛赞Gilbert多有才华。\n\n接下来按A—D逐项看。","html":"<h2>22题</h2>\n<blockquote>\n<p>Tommasini regards Gilbert as an artist who is ______.<br />\nTommasini认为Gilbert是一位怎样的艺术家？</p>\n</blockquote>\n<p>题干锁定Tommasini对Gilbert的看法。粗读时好像记得第2段有一句直接引语，还出现了<code>unpretentious</code>和<code>faint praise</code>，所以把第2段完整读清。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>One of the reasons why the appointment came as such a surprise, however, is that Gilbert is <span class=\"mask\">[xxx]</span> little known. Even Tommasini, who had <span class=\"mask\">[xxx]</span> Gilbert’s appointment in the Times, calls him “an unpretentious musician with no air of the <span class=\"mask\">[xxx]</span> conductor about him.” As a description of the next music director of an orchestra that has <span class=\"mask\">[xxx]</span> been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some Times readers as faint praise.</p>\n<p>开始精读：</p>\n<p>One of the reasons / why the appointment came as such a surprise, / however, / is that Gilbert is <span class=\"mask\">[xxx]</span> little known. / Even Tommasini, / who had <span class=\"mask\">[xxx]</span> Gilbert’s appointment in the Times, / calls him / “an unpretentious musician / with no air of the <span class=\"mask\">[xxx]</span> conductor about him.” / As a description / of the next music director / of an orchestra / that has <span class=\"mask\">[xxx]</span> been led / by musicians like Gustav Mahler and Pierre Boulez, / that seems likely / to have struck at least some Times readers / as faint praise.</p>\n<p>原因之一 / 这次任命为何如此令人意外 / 不过 / 是Gilbert的知名度<span class=\"mask\">[xxx]</span>低 / 连Tommasini也如此 / 他曾在《泰晤士报》<span class=\"mask\">[xxx]</span>任命Gilbert / 却称他为 / “一个不摆架子的音乐家 / 身上没有那种<span class=\"mask\">[xxx]</span>指挥家的气场” / 这样的描述 / 用来形容下一任音乐总监 / 对这样一支乐团而言 / 它此前<span class=\"mask\">[xxx]</span>由 / Mahler和Boulez这类音乐家领导 / 这很可能 / 让至少一些《泰晤士报》读者觉得 / 只是轻淡的赞扬</p>\n</blockquote>\n<p>现在看题干，它问Tommasini把Gilbert看成怎样的艺术家。最贴近的句子是他亲自使用的描述；后面<code>faint praise</code>则提醒我们，这个评价并不是在盛赞Gilbert多有才华。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[228,621,1322,348]],"questionRects":[[235,608,1360,402]],"scrollTarget":"article","meta":{"kind":"question","qid":"22"}},{"section":"22题","raw":"### A. influential\n\n> 有影响力的\n\n把A接回题干，它说的是：Tommasini认为Gilbert是一位有影响力的艺术家。\n\nA里最显眼的是“影响力”。刚才精读时，好像原文只说Gilbert知名度低，并直接形容他不摆架子，没有写他能影响谁。\n\n> Gilbert is **[xxx]** little known.\n>\n> calls him “an unpretentious musician with no air of the **[xxx]** conductor about him.”\n\nA的主体没有错，确实是在问Tommasini眼中的Gilbert；但原句给的是为人和气场，不是社会影响力。\n\n原文说的是：Gilbert知名度低，Tommasini称他不摆架子，也没有某类强势指挥家的气场。\n\nA说的却是：Gilbert具有影响力。\n\n知名度低与“有影响力”并不是同一个维度；即使某人可以低调而有影响力，原文也没有建立这种关系。\n\n**“不摆架子、没有强势气场”能不能直接说明“很有影响力”？**\n\n不能。原句描述的是姿态和气质，没有写影响范围或号召力。\n\n要选A，原文至少还得写到Gilbert左右了乐团、同行或公众；第2段没有。\n\n**第一轮判断：A排除。**","html":"<h3>A. influential</h3>\n<blockquote>\n<p>有影响力的</p>\n</blockquote>\n<p>把A接回题干，它说的是：Tommasini认为Gilbert是一位有影响力的艺术家。</p>\n<p>A里最显眼的是“影响力”。刚才精读时，好像原文只说Gilbert知名度低，并直接形容他不摆架子，没有写他能影响谁。</p>\n<blockquote>\n<p>Gilbert is <span class=\"mask\">[xxx]</span> little known.</p>\n<p>calls him “an unpretentious musician with no air of the <span class=\"mask\">[xxx]</span> conductor about him.”</p>\n</blockquote>\n<p>A的主体没有错，确实是在问Tommasini眼中的Gilbert；但原句给的是为人和气场，不是社会影响力。</p>\n<p>原文说的是：Gilbert知名度低，Tommasini称他不摆架子，也没有某类强势指挥家的气场。</p>\n<p>A说的却是：Gilbert具有影响力。</p>\n<p>知名度低与“有影响力”并不是同一个维度；即使某人可以低调而有影响力，原文也没有建立这种关系。</p>\n<p><strong>“不摆架子、没有强势气场”能不能直接说明“很有影响力”？</strong></p>\n<p>不能。原句描述的是姿态和气质，没有写影响范围或号召力。</p>\n<p>要选A，原文至少还得写到Gilbert左右了乐团、同行或公众；第2段没有。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[228,621,1322,348]],"questionRects":[[235,608,1360,402]],"scrollTarget":"article","meta":{"kind":"option","qid":"22","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"22题","raw":"### B. modest\n\n> 谦逊、不摆架子的\n\n把B接回题干，它说的是：Tommasini认为Gilbert是一位谦逊的艺术家。\n\nB里的`modest`让人想到“不摆架子”。刚才精读时，好像引语里正有`unpretentious`，先把完整描述放回来。\n\n> calls him “an unpretentious musician with no air of the **[xxx]** conductor about him.”\n\n`unpretentious`直接写一个人不装腔、不摆架子；后半句又说他没有那种强势指挥家的架势，两处都往低调朴实的方向走。\n\n原文说的是：Tommasini把Gilbert称为不摆架子的音乐家。\n\nB说的却是：Tommasini认为他谦逊。\n\n这里不是凭“好像人不错”去猜，而是人物、评价位置和含义都能直接对应；后面的`faint praise`也不否定“谦逊”，只说明这番赞扬力度不大。\n\n**`unpretentious musician`能不能直接概括成`modest`？**\n\n能。两者都指向不张扬、不摆架子的个人姿态。\n\nB已经被Tommasini的原话直接支撑，没有增加原文未写的能力或成就。\n\n**第一轮判断：B保留。**","html":"<h3>B. modest</h3>\n<blockquote>\n<p>谦逊、不摆架子的</p>\n</blockquote>\n<p>把B接回题干，它说的是：Tommasini认为Gilbert是一位谦逊的艺术家。</p>\n<p>B里的<code>modest</code>让人想到“不摆架子”。刚才精读时，好像引语里正有<code>unpretentious</code>，先把完整描述放回来。</p>\n<blockquote>\n<p>calls him “an unpretentious musician with no air of the <span class=\"mask\">[xxx]</span> conductor about him.”</p>\n</blockquote>\n<p><code>unpretentious</code>直接写一个人不装腔、不摆架子；后半句又说他没有那种强势指挥家的架势，两处都往低调朴实的方向走。</p>\n<p>原文说的是：Tommasini把Gilbert称为不摆架子的音乐家。</p>\n<p>B说的却是：Tommasini认为他谦逊。</p>\n<p>这里不是凭“好像人不错”去猜，而是人物、评价位置和含义都能直接对应；后面的<code>faint praise</code>也不否定“谦逊”，只说明这番赞扬力度不大。</p>\n<p><strong><code>unpretentious musician</code>能不能直接概括成<code>modest</code>？</strong></p>\n<p>能。两者都指向不张扬、不摆架子的个人姿态。</p>\n<p>B已经被Tommasini的原话直接支撑，没有增加原文未写的能力或成就。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[228,621,1322,348]],"questionRects":[[235,608,1360,402]],"scrollTarget":"article","meta":{"kind":"option","qid":"22","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"22题","raw":"### C. **[xxx]**\n\n> **[xxx]** 的\n\n把C接回题干，它说的是：Tommasini认为Gilbert是一位具有某种被遮挡特征的艺术家。\n\nC的整个评价词都被挡住。刚才精读时，好像唯一能直接确认的评价是`unpretentious`；先看可见内容到底还剩多少。\n\n> “an unpretentious musician with no air of the **[xxx]** conductor about him.”\n>\n> that seems likely ... as faint praise\n\nC只有题干外壳，决定性形容词完全不可见。我们不能把第2段中另一个被挡住的词随意搬来，也不能因为“轻淡的赞扬”就自造一种性格。\n\n原文说的是：可直接读出的评价是“不摆架子”，整句话甚至被作者称为力度很轻的赞扬。\n\nC说的却是：Gilbert具有一种目前不知道的特征。\n\nB已经把唯一清楚的直接描述完整接住。C没有可见词告诉我们它和`unpretentious`相同，也没有别的可见关系能独立成立。\n\n**整个形容词都看不见时，能不能仅凭它占着一个选项位置就把它当成Tommasini的明确评价？**\n\n不能。当前连评价方向和内容都无法确认。\n\n要保留C，至少要能看见或从结构中确认 **[xxx]** 与“不摆架子”同义；现有材料不支持，B则已经直接对应。\n\n**第一轮判断：C排除。**","html":"<h3>C. <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 的</p>\n</blockquote>\n<p>把C接回题干，它说的是：Tommasini认为Gilbert是一位具有某种被遮挡特征的艺术家。</p>\n<p>C的整个评价词都被挡住。刚才精读时，好像唯一能直接确认的评价是<code>unpretentious</code>；先看可见内容到底还剩多少。</p>\n<blockquote>\n<p>“an unpretentious musician with no air of the <span class=\"mask\">[xxx]</span> conductor about him.”</p>\n<p>that seems likely ... as faint praise</p>\n</blockquote>\n<p>C只有题干外壳，决定性形容词完全不可见。我们不能把第2段中另一个被挡住的词随意搬来，也不能因为“轻淡的赞扬”就自造一种性格。</p>\n<p>原文说的是：可直接读出的评价是“不摆架子”，整句话甚至被作者称为力度很轻的赞扬。</p>\n<p>C说的却是：Gilbert具有一种目前不知道的特征。</p>\n<p>B已经把唯一清楚的直接描述完整接住。C没有可见词告诉我们它和<code>unpretentious</code>相同，也没有别的可见关系能独立成立。</p>\n<p><strong>整个形容词都看不见时，能不能仅凭它占着一个选项位置就把它当成Tommasini的明确评价？</strong></p>\n<p>不能。当前连评价方向和内容都无法确认。</p>\n<p>要保留C，至少要能看见或从结构中确认 <span class=\"mask\">[xxx]</span> 与“不摆架子”同义；现有材料不支持，B则已经直接对应。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[228,621,1322,348]],"questionRects":[[235,608,1360,402]],"scrollTarget":"article","meta":{"kind":"option","qid":"22","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"22题","raw":"### D. talented\n\n> 有才华的\n\n把D接回题干，它说的是：Tommasini认为Gilbert是一位有才华的艺术家。\n\nD说的是能力。刚才精读时，好像Tommasini只谈了他不摆架子；作者还说这种描述像`faint praise`，并没有直接夸才华。\n\n> calls him “an unpretentious musician ...”\n>\n> that seems likely ... as faint praise\n\n“音乐家”这个身份会让D第一眼显得顺，但身份不等于评价；原文必须真的写到能力、天赋或水平，才能支撑`talented`。\n\n原文说的是：Tommasini评价他的姿态低调，作者认为这听起来只是轻淡的赞扬。\n\nD说的却是：Tommasini肯定他的才华。\n\n第3段反而由作者说“我不知道他是不是伟大，甚至是不是好的指挥”，这也提醒我们不能把一段低调描述升级成能力认定。\n\n**称一个人“不摆架子”，能不能自动推出“他很有才华”？**\n\n不能。品格姿态和艺术能力是两件事。\n\n要选D，原文至少还得出现对Gilbert演奏或指挥能力的直接肯定；Tommasini的原话没有。\n\n**第一轮判断：D排除。**","html":"<h3>D. talented</h3>\n<blockquote>\n<p>有才华的</p>\n</blockquote>\n<p>把D接回题干，它说的是：Tommasini认为Gilbert是一位有才华的艺术家。</p>\n<p>D说的是能力。刚才精读时，好像Tommasini只谈了他不摆架子；作者还说这种描述像<code>faint praise</code>，并没有直接夸才华。</p>\n<blockquote>\n<p>calls him “an unpretentious musician ...”</p>\n<p>that seems likely ... as faint praise</p>\n</blockquote>\n<p>“音乐家”这个身份会让D第一眼显得顺，但身份不等于评价；原文必须真的写到能力、天赋或水平，才能支撑<code>talented</code>。</p>\n<p>原文说的是：Tommasini评价他的姿态低调，作者认为这听起来只是轻淡的赞扬。</p>\n<p>D说的却是：Tommasini肯定他的才华。</p>\n<p>第3段反而由作者说“我不知道他是不是伟大，甚至是不是好的指挥”，这也提醒我们不能把一段低调描述升级成能力认定。</p>\n<p><strong>称一个人“不摆架子”，能不能自动推出“他很有才华”？</strong></p>\n<p>不能。品格姿态和艺术能力是两件事。</p>\n<p>要选D，原文至少还得出现对Gilbert演奏或指挥能力的直接肯定；Tommasini的原话没有。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[228,621,1322,348]],"questionRects":[[235,608,1360,402]],"scrollTarget":"article","meta":{"kind":"option","qid":"22","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P2"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"22题","raw":"### 22题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D排除；\n\nTommasini的原话把Gilbert写成`unpretentious musician`，B直接对应；A、D换成影响力和才华，C的核心完全不可见且没有独立关系支撑。\n\n> **22题选B。**","html":"<h3>22题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除；</li>\n</ul>\n<p>Tommasini的原话把Gilbert写成<code>unpretentious musician</code>，B直接对应；A、D换成影响力和才华，C的核心完全不可见且没有独立关系支撑。</p>\n<blockquote>\n<p><strong>22题选B。</strong></p>\n</blockquote>\n","articleRects":[[228,621,1322,348]],"questionRects":[[235,608,1360,402]],"scrollTarget":"question","meta":{"kind":"result","qid":"22"}},{"section":"23题","raw":"## 23题\n\n> The author believes that the devoted concertgoers ______.  \n> 作者认为那些忠实的音乐会观众怎么了？\n\n题干中的`devoted concertgoers`是非常具体的人。粗读时好像在第4段开头见过这组词，后面紧跟`missing the point`，所以先把第4段整段读清。\n\n> 原文参考：\n>\n> Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point. For the time, attention, and money of the art-loving public, classical **[xxx]** must compete not only with opera houses, dance **[xxx]**, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century. These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “**[xxx]**” at a time and place of the listener’s choosing. The **[xxx]** availability of such recordings has thus brought about a crisis in the **[xxx]** of the traditional classical concert.\n>\n> 开始精读：\n>\n> Devoted concertgoers / who reply / that recordings are no substitute / for live performance / are missing the point. / For the time, attention, and money / of the art-loving public, / classical **[xxx]** must compete / not only with opera houses, dance **[xxx]**, theater companies, and museums, / but also with the recorded performances / of the great classical musicians / of the 20th century. / These recordings are cheap, / available everywhere, / and very often much higher / in artistic quality / than today’s live performances; / moreover, / they can be “**[xxx]**” / at a time and place / of the listener’s choosing. / The **[xxx]** availability / of such recordings / has thus brought about a crisis / in the **[xxx]** / of the traditional classical concert.\n>\n> 忠实的音乐会观众 / 他们回应说 / 录音不能替代 / 现场演出 / 他们没有抓住要点 / 为了争夺时间、注意力和金钱 / 这些都来自爱艺术的公众 / 古典**[xxx]**必须竞争 / 不仅要和歌剧院、舞蹈**[xxx]**、剧院和博物馆竞争 / 还要和录制好的演出竞争 / 这些演出来自伟大的古典音乐家 / 属于20世纪 / 这些录音很便宜 / 到处都能得到 / 而且往往高得多 / 在艺术质量上 / 比今天的现场演出 / 此外 / 它们还能被“**[xxx]**” / 在任何时间地点 / 由听众自己选择 / 这种录音的**[xxx]**可得性 / 已经如此普遍 / 于是带来一场危机 / 发生在**[xxx]**中 / 传统古典音乐会\n\n现在回到题干。作者先复述忠实观众的看法——录音不能替代现场——随即说他们`are missing the point`，再列录音的价格、可得性、质量和使用便利。答案应概括作者认为这些观众在哪一点判断失准。\n\n接下来按A—D逐项看。","html":"<h2>23题</h2>\n<blockquote>\n<p>The author believes that the devoted concertgoers ______.<br />\n作者认为那些忠实的音乐会观众怎么了？</p>\n</blockquote>\n<p>题干中的<code>devoted concertgoers</code>是非常具体的人。粗读时好像在第4段开头见过这组词，后面紧跟<code>missing the point</code>，所以先把第4段整段读清。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point. For the time, attention, and money of the art-loving public, classical <span class=\"mask\">[xxx]</span> must compete not only with opera houses, dance <span class=\"mask\">[xxx]</span>, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century. These recordings are cheap, available everywhere, and very often much higher in artistic quality than today’s live performances; moreover, they can be “<span class=\"mask\">[xxx]</span>” at a time and place of the listener’s choosing. The <span class=\"mask\">[xxx]</span> availability of such recordings has thus brought about a crisis in the <span class=\"mask\">[xxx]</span> of the traditional classical concert.</p>\n<p>开始精读：</p>\n<p>Devoted concertgoers / who reply / that recordings are no substitute / for live performance / are missing the point. / For the time, attention, and money / of the art-loving public, / classical <span class=\"mask\">[xxx]</span> must compete / not only with opera houses, dance <span class=\"mask\">[xxx]</span>, theater companies, and museums, / but also with the recorded performances / of the great classical musicians / of the 20th century. / These recordings are cheap, / available everywhere, / and very often much higher / in artistic quality / than today’s live performances; / moreover, / they can be “<span class=\"mask\">[xxx]</span>” / at a time and place / of the listener’s choosing. / The <span class=\"mask\">[xxx]</span> availability / of such recordings / has thus brought about a crisis / in the <span class=\"mask\">[xxx]</span> / of the traditional classical concert.</p>\n<p>忠实的音乐会观众 / 他们回应说 / 录音不能替代 / 现场演出 / 他们没有抓住要点 / 为了争夺时间、注意力和金钱 / 这些都来自爱艺术的公众 / 古典<span class=\"mask\">[xxx]</span>必须竞争 / 不仅要和歌剧院、舞蹈<span class=\"mask\">[xxx]</span>、剧院和博物馆竞争 / 还要和录制好的演出竞争 / 这些演出来自伟大的古典音乐家 / 属于20世纪 / 这些录音很便宜 / 到处都能得到 / 而且往往高得多 / 在艺术质量上 / 比今天的现场演出 / 此外 / 它们还能被“<span class=\"mask\">[xxx]</span>” / 在任何时间地点 / 由听众自己选择 / 这种录音的<span class=\"mask\">[xxx]</span>可得性 / 已经如此普遍 / 于是带来一场危机 / 发生在<span class=\"mask\">[xxx]</span>中 / 传统古典音乐会</p>\n</blockquote>\n<p>现在回到题干。作者先复述忠实观众的看法——录音不能替代现场——随即说他们<code>are missing the point</code>，再列录音的价格、可得性、质量和使用便利。答案应概括作者认为这些观众在哪一点判断失准。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1015,1360,403]],"scrollTarget":"article","meta":{"kind":"question","qid":"23"}},{"section":"23题","raw":"### A. ignore the expenses of live performances\n\n> 忽视现场演出的花费\n\n把A接回题干，它说的是：作者认为忠实观众忽视了现场演出的花费。\n\nA里有`expenses`。刚才精读时，好像确实看到`time, attention, and money`，所以它第一眼很像；先看原文到底把“钱”放在哪个关系里。\n\n> For the time, attention, and money of the art-loving public, classical **[xxx]** must compete ...\n>\n> These recordings are cheap.\n\nA能对上“钱”和现场、录音竞争的背景，但原文是在说明各种演出争夺公众资源，没有说忠实观众主观上忽略了票价。\n\n原文说的是：现场古典演出要和其他去处及录音竞争公众的时间、注意力和金钱；录音便宜。\n\nA说的却是：忠实观众没有注意现场演出的费用。\n\n“某样东西参与金钱竞争”不等于“某群人忽视它的费用”。主体动作被换了：原文写市场竞争，A写观众的认知疏忽。\n\n**原文列出`money`，能不能直接改写成“这些观众忽视现场演出的花费”？**\n\n不能。钱出现了，但“忽视”这个动作没有出现。\n\n要选A，原文至少还得写这些观众不考虑票价或成本；第4段没有建立这种心理状态。\n\n**第一轮判断：A排除。**","html":"<h3>A. ignore the expenses of live performances</h3>\n<blockquote>\n<p>忽视现场演出的花费</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为忠实观众忽视了现场演出的花费。</p>\n<p>A里有<code>expenses</code>。刚才精读时，好像确实看到<code>time, attention, and money</code>，所以它第一眼很像；先看原文到底把“钱”放在哪个关系里。</p>\n<blockquote>\n<p>For the time, attention, and money of the art-loving public, classical <span class=\"mask\">[xxx]</span> must compete ...</p>\n<p>These recordings are cheap.</p>\n</blockquote>\n<p>A能对上“钱”和现场、录音竞争的背景，但原文是在说明各种演出争夺公众资源，没有说忠实观众主观上忽略了票价。</p>\n<p>原文说的是：现场古典演出要和其他去处及录音竞争公众的时间、注意力和金钱；录音便宜。</p>\n<p>A说的却是：忠实观众没有注意现场演出的费用。</p>\n<p>“某样东西参与金钱竞争”不等于“某群人忽视它的费用”。主体动作被换了：原文写市场竞争，A写观众的认知疏忽。</p>\n<p><strong>原文列出<code>money</code>，能不能直接改写成“这些观众忽视现场演出的花费”？</strong></p>\n<p>不能。钱出现了，但“忽视”这个动作没有出现。</p>\n<p>要选A，原文至少还得写这些观众不考虑票价或成本；第4段没有建立这种心理状态。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1015,1360,403]],"scrollTarget":"article","meta":{"kind":"option","qid":"23","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"23题","raw":"### B. **[xxx]** most kinds of recorded performances\n\n> 对大多数种类的录音表演做出 **[xxx]**\n\n把B接回题干，它说的是：作者认为忠实观众对大多数种类的录音表演采取了某种被遮挡的态度。\n\nB里决定动作的词被挡住，但`most kinds of`和`recorded performances`是可见的。刚才精读时，好像观众只说“录音不能替代现场”，并没有给录音分类。\n\n> recordings are no substitute for live performance\n>\n> the recorded performances of the great classical musicians of the 20th century\n\nB确实碰到录音这个对象，因此看着不远；不过原文复述的是“不能替代现场”这一比较关系，不是对“大多数种类”逐类采取某种行动。\n\n原文说的是：忠实观众把录音与现场作替代关系判断，作者随后强调录音对现场构成竞争。\n\nB说的却是：忠实观众对大多数种类的录音表演作出一种未知动作。\n\n即使暂时不补 **[xxx]**，可见的`most kinds`也已经多出范围限定；原文没有说只针对大多数类型，更没有写他们拒绝购买、拒绝收听或否定大多数录音。\n\n**“认为录音不能替代现场”能不能扩成“对大多数种类的录音都采取某种否定行动”？**\n\n不能。前者是替代价值判断，后者增加了类型范围和行为。\n\n要保留B，原文至少还得出现对录音种类的划分，并说明这些观众针对其中大多数怎么做；这里没有。\n\n**第一轮判断：B排除。**","html":"<h3>B. <span class=\"mask\">[xxx]</span> most kinds of recorded performances</h3>\n<blockquote>\n<p>对大多数种类的录音表演做出 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为忠实观众对大多数种类的录音表演采取了某种被遮挡的态度。</p>\n<p>B里决定动作的词被挡住，但<code>most kinds of</code>和<code>recorded performances</code>是可见的。刚才精读时，好像观众只说“录音不能替代现场”，并没有给录音分类。</p>\n<blockquote>\n<p>recordings are no substitute for live performance</p>\n<p>the recorded performances of the great classical musicians of the 20th century</p>\n</blockquote>\n<p>B确实碰到录音这个对象，因此看着不远；不过原文复述的是“不能替代现场”这一比较关系，不是对“大多数种类”逐类采取某种行动。</p>\n<p>原文说的是：忠实观众把录音与现场作替代关系判断，作者随后强调录音对现场构成竞争。</p>\n<p>B说的却是：忠实观众对大多数种类的录音表演作出一种未知动作。</p>\n<p>即使暂时不补 <span class=\"mask\">[xxx]</span>，可见的<code>most kinds</code>也已经多出范围限定；原文没有说只针对大多数类型，更没有写他们拒绝购买、拒绝收听或否定大多数录音。</p>\n<p><strong>“认为录音不能替代现场”能不能扩成“对大多数种类的录音都采取某种否定行动”？</strong></p>\n<p>不能。前者是替代价值判断，后者增加了类型范围和行为。</p>\n<p>要保留B，原文至少还得出现对录音种类的划分，并说明这些观众针对其中大多数怎么做；这里没有。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1015,1360,403]],"scrollTarget":"article","meta":{"kind":"option","qid":"23","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"23题","raw":"### C. exaggerate the variety of live performances\n\n> 夸大现场演出的多样性\n\n把C接回题干，它说的是：作者认为忠实观众夸大了现场演出的种类。\n\nC里的`variety`让人想起文章列了歌剧院、舞团、剧院和博物馆。刚才精读时，好像这些对象是在竞争名单里，不是观众夸口的内容。\n\n> must compete not only with opera houses, dance **[xxx]**, theater companies, and museums, but also with the recorded performances ...\n\n原文确实列出多个文化去处，所以C会有“种类很多”的表面相似；但这张名单由作者列出，用来说明竞争面很广。\n\n原文说的是：现场古典演出面对多种其他去处和录音的竞争。\n\nC说的却是：忠实观众把现场演出的种类说得过多。\n\n名单里的歌剧院、剧院和博物馆并不是“现场古典音乐演出的种类”，也不是忠实观众的陈述。主体、对象都对不上。\n\n**作者列出多个竞争者，是否等于观众夸大了现场演出的多样性？**\n\n不等于。那是在画竞争范围，不是在评价观众怎样描述现场节目。\n\n要选C，原文至少还得写到这些观众宣称现场节目极其多样，而作者认为这种说法过头；没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. exaggerate the variety of live performances</h3>\n<blockquote>\n<p>夸大现场演出的多样性</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为忠实观众夸大了现场演出的种类。</p>\n<p>C里的<code>variety</code>让人想起文章列了歌剧院、舞团、剧院和博物馆。刚才精读时，好像这些对象是在竞争名单里，不是观众夸口的内容。</p>\n<blockquote>\n<p>must compete not only with opera houses, dance <span class=\"mask\">[xxx]</span>, theater companies, and museums, but also with the recorded performances ...</p>\n</blockquote>\n<p>原文确实列出多个文化去处，所以C会有“种类很多”的表面相似；但这张名单由作者列出，用来说明竞争面很广。</p>\n<p>原文说的是：现场古典演出面对多种其他去处和录音的竞争。</p>\n<p>C说的却是：忠实观众把现场演出的种类说得过多。</p>\n<p>名单里的歌剧院、剧院和博物馆并不是“现场古典音乐演出的种类”，也不是忠实观众的陈述。主体、对象都对不上。</p>\n<p><strong>作者列出多个竞争者，是否等于观众夸大了现场演出的多样性？</strong></p>\n<p>不等于。那是在画竞争范围，不是在评价观众怎样描述现场节目。</p>\n<p>要选C，原文至少还得写到这些观众宣称现场节目极其多样，而作者认为这种说法过头；没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1015,1360,403]],"scrollTarget":"article","meta":{"kind":"option","qid":"23","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"23题","raw":"### D. overestimate the value of live performances\n\n> 高估了现场演出的价值\n\n把D接回题干，它说的是：作者认为忠实观众高估了现场演出的价值。\n\nD把重点放在`value of live performances`。刚才精读时，好像作者先否定“录音不能替代现场”的说法，再连续写录音更便宜、更方便、质量常常更高。\n\n> recordings are no substitute for live performance are missing the point\n>\n> These recordings are cheap ... and very often much higher in artistic quality than today’s live performances; moreover, they can be “**[xxx]**” at a time and place of the listener’s choosing.\n\nD不是原句里的一个单词替换，而是概括作者的反驳：观众把现场看成不可替代，作者却给出录音在价格、质量和便利上的优势。\n\n原文说的是：忠实观众强调现场不可替代，作者说他们没抓住要点，并说明录音在多方面足以竞争甚至更优。\n\nD说的却是：这些观众把现场演出的价值估得过高。\n\n从“不可替代”到“高估价值”是合理的局部推断，因为作者后面的每个事实都在削弱现场的独占地位；D没有把录音说成完全取代现场，只说观众估得过高。\n\n**作者明确说他们“没抓住要点”，又连续列录音优势，能不能推到“他们把现场价值看得过高”？**\n\n能。这正好概括作者反驳的方向。\n\nD需要的是作者对观众判断的整体评价，第4段从`missing the point`到录音优势已经把这条关系接完整。\n\n**第一轮判断：D保留。**","html":"<h3>D. overestimate the value of live performances</h3>\n<blockquote>\n<p>高估了现场演出的价值</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为忠实观众高估了现场演出的价值。</p>\n<p>D把重点放在<code>value of live performances</code>。刚才精读时，好像作者先否定“录音不能替代现场”的说法，再连续写录音更便宜、更方便、质量常常更高。</p>\n<blockquote>\n<p>recordings are no substitute for live performance are missing the point</p>\n<p>These recordings are cheap ... and very often much higher in artistic quality than today’s live performances; moreover, they can be “<span class=\"mask\">[xxx]</span>” at a time and place of the listener’s choosing.</p>\n</blockquote>\n<p>D不是原句里的一个单词替换，而是概括作者的反驳：观众把现场看成不可替代，作者却给出录音在价格、质量和便利上的优势。</p>\n<p>原文说的是：忠实观众强调现场不可替代，作者说他们没抓住要点，并说明录音在多方面足以竞争甚至更优。</p>\n<p>D说的却是：这些观众把现场演出的价值估得过高。</p>\n<p>从“不可替代”到“高估价值”是合理的局部推断，因为作者后面的每个事实都在削弱现场的独占地位；D没有把录音说成完全取代现场，只说观众估得过高。</p>\n<p><strong>作者明确说他们“没抓住要点”，又连续列录音优势，能不能推到“他们把现场价值看得过高”？</strong></p>\n<p>能。这正好概括作者反驳的方向。</p>\n<p>D需要的是作者对观众判断的整体评价，第4段从<code>missing the point</code>到录音优势已经把这条关系接完整。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1015,1360,403]],"scrollTarget":"article","meta":{"kind":"option","qid":"23","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"23题","raw":"### 23题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B排除；\n- C排除；\n- D保留；\n\n第4段的核心不是观众忽视票价，也不是他们怎样对待某些录音，而是作者认为“现场不可替代”的价值判断过头；D最完整。\n\n> **23题选D。**","html":"<h3>23题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留；</li>\n</ul>\n<p>第4段的核心不是观众忽视票价，也不是他们怎样对待某些录音，而是作者认为“现场不可替代”的价值判断过头；D最完整。</p>\n<blockquote>\n<p><strong>23题选D。</strong></p>\n</blockquote>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1015,1360,403]],"scrollTarget":"question","meta":{"kind":"result","qid":"23"}},{"section":"24题","raw":"## 24题\n\n> According to the text, which of the following is true of recordings?  \n> 根据文章，下面哪一项对录音的说法正确？\n\n题干改问录音本身。粗读时好像仍是在第4段集中见过价格、可得性、质量和使用时间；上一题已经把第4段完整精读，这里直接复用，不重复拆一遍。\n\n把上一题读出的信息留在眼前：录音便宜、到处可得、艺术质量往往高于今天的现场演出，还能由听众选择时间和地点。现在只需检查四个选项有没有准确复述其中一项，或把方向、范围改掉。\n\n接下来按A—D逐项看。","html":"<h2>24题</h2>\n<blockquote>\n<p>According to the text, which of the following is true of recordings?<br />\n根据文章，下面哪一项对录音的说法正确？</p>\n</blockquote>\n<p>题干改问录音本身。粗读时好像仍是在第4段集中见过价格、可得性、质量和使用时间；上一题已经把第4段完整精读，这里直接复用，不重复拆一遍。</p>\n<p>把上一题读出的信息留在眼前：录音便宜、到处可得、艺术质量往往高于今天的现场演出，还能由听众选择时间和地点。现在只需检查四个选项有没有准确复述其中一项，或把方向、范围改掉。</p>\n<p>接下来按A—D逐项看。</p>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1423,1360,402]],"scrollTarget":"article","meta":{"kind":"question","qid":"24"}},{"section":"24题","raw":"### A. They are often inferior to live concerts in quality.\n\n> 它们在质量上往往不如现场音乐会\n\n把A接回题干，它说的是：录音在质量上往往低于现场音乐会。\n\nA里最显眼的是`inferior`和`quality`。刚才精读时，好像原文也比较了质量，但方向是录音更高，先回那句。\n\n> These recordings are ... very often much higher in artistic quality than today’s live performances.\n\nA和原文比较的是同一对象、同一维度，也有`often`这个频率，所以第一眼极像；唯一关键就是高低方向。\n\n原文说的是：录音的艺术质量往往比今天的现场演出更高。\n\nA说的却是：录音的质量往往更低。\n\n`higher than`和`inferior to`方向正相反，其他词再像也不能抵消这个翻转。\n\n**原文的“录音往往更高”能不能改成“录音往往更低”？**\n\n不能。比较方向完全相反。\n\n要选A，原文至少应写`lower`或现场质量更好；实际写的是相反关系。\n\n**第一轮判断：A排除。**","html":"<h3>A. They are often inferior to live concerts in quality.</h3>\n<blockquote>\n<p>它们在质量上往往不如现场音乐会</p>\n</blockquote>\n<p>把A接回题干，它说的是：录音在质量上往往低于现场音乐会。</p>\n<p>A里最显眼的是<code>inferior</code>和<code>quality</code>。刚才精读时，好像原文也比较了质量，但方向是录音更高，先回那句。</p>\n<blockquote>\n<p>These recordings are ... very often much higher in artistic quality than today’s live performances.</p>\n</blockquote>\n<p>A和原文比较的是同一对象、同一维度，也有<code>often</code>这个频率，所以第一眼极像；唯一关键就是高低方向。</p>\n<p>原文说的是：录音的艺术质量往往比今天的现场演出更高。</p>\n<p>A说的却是：录音的质量往往更低。</p>\n<p><code>higher than</code>和<code>inferior to</code>方向正相反，其他词再像也不能抵消这个翻转。</p>\n<p><strong>原文的“录音往往更高”能不能改成“录音往往更低”？</strong></p>\n<p>不能。比较方向完全相反。</p>\n<p>要选A，原文至少应写<code>lower</code>或现场质量更好；实际写的是相反关系。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1423,1360,402]],"scrollTarget":"article","meta":{"kind":"option","qid":"24","option":"A","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"24题","raw":"### B. They are easily accessible to the general public.\n\n> 普通公众很容易获得这些录音\n\n把B接回题干，它说的是：录音很容易被普通公众获得。\n\nB里的`accessible`让人想到“到处都有”。刚才精读时，好像原文还把录音放在`art-loving public`的竞争背景中，先看两处能不能接上。\n\n> These recordings are cheap, available everywhere.\n>\n> For the time, attention, and money of the art-loving public ...\n\n`available everywhere`直接写可获得性；前文又明确把消费和选择主体放在公众身上，因此B没有凭空换人。\n\n原文说的是：这些录音便宜且到处可得，公众可以按自己的时间地点使用。\n\nB说的却是：普通公众很容易接触和获得录音。\n\n`easily accessible`是对`available everywhere`的自然压缩，既没有把“到处可得”夸成免费，也没有加上只有专家才能得到之类限制。\n\n**`available everywhere`能不能支持“公众容易获得”？**\n\n能。地点上的普遍可得正是容易接触的直接依据。\n\nB所需的可得性已经被原句直接写出，主体也与前后文的公众一致。\n\n**第一轮判断：B保留。**","html":"<h3>B. They are easily accessible to the general public.</h3>\n<blockquote>\n<p>普通公众很容易获得这些录音</p>\n</blockquote>\n<p>把B接回题干，它说的是：录音很容易被普通公众获得。</p>\n<p>B里的<code>accessible</code>让人想到“到处都有”。刚才精读时，好像原文还把录音放在<code>art-loving public</code>的竞争背景中，先看两处能不能接上。</p>\n<blockquote>\n<p>These recordings are cheap, available everywhere.</p>\n<p>For the time, attention, and money of the art-loving public ...</p>\n</blockquote>\n<p><code>available everywhere</code>直接写可获得性；前文又明确把消费和选择主体放在公众身上，因此B没有凭空换人。</p>\n<p>原文说的是：这些录音便宜且到处可得，公众可以按自己的时间地点使用。</p>\n<p>B说的却是：普通公众很容易接触和获得录音。</p>\n<p><code>easily accessible</code>是对<code>available everywhere</code>的自然压缩，既没有把“到处可得”夸成免费，也没有加上只有专家才能得到之类限制。</p>\n<p><strong><code>available everywhere</code>能不能支持“公众容易获得”？</strong></p>\n<p>能。地点上的普遍可得正是容易接触的直接依据。</p>\n<p>B所需的可得性已经被原句直接写出，主体也与前后文的公众一致。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1423,1360,402]],"scrollTarget":"article","meta":{"kind":"option","qid":"24","option":"B","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"保留"}}},{"section":"24题","raw":"### C. They help improve the quality of music.\n\n> 它们有助于提高音乐质量\n\n把C接回题干，它说的是：录音能够帮助提高音乐本身的质量。\n\nC也出现`quality`。刚才精读时，好像原文只比较录音和现场的现有质量，没有写录音让音乐变得更好。\n\n> very often much higher in artistic quality than today’s live performances\n\nC抓到同一个质量词，所以容易让人顺手选；但比较“谁现在更高”和说明“谁促使质量提高”是两种关系。\n\n原文说的是：录音成品的艺术质量往往高于今天的现场演出。\n\nC说的却是：录音对音乐质量产生提升作用。\n\n原文没有前后时间对比，也没有说因为有录音，作曲、演奏或音乐整体质量被改善。C新增了因果和变化。\n\n**“录音本身质量较高”是否就等于“录音提高了音乐质量”？**\n\n不等于。一个是静态比较，一个是因果作用。\n\n要选C，原文至少还得写录音促使音乐制作或演奏改进；第4段没有。\n\n**第一轮判断：C排除。**","html":"<h3>C. They help improve the quality of music.</h3>\n<blockquote>\n<p>它们有助于提高音乐质量</p>\n</blockquote>\n<p>把C接回题干，它说的是：录音能够帮助提高音乐本身的质量。</p>\n<p>C也出现<code>quality</code>。刚才精读时，好像原文只比较录音和现场的现有质量，没有写录音让音乐变得更好。</p>\n<blockquote>\n<p>very often much higher in artistic quality than today’s live performances</p>\n</blockquote>\n<p>C抓到同一个质量词，所以容易让人顺手选；但比较“谁现在更高”和说明“谁促使质量提高”是两种关系。</p>\n<p>原文说的是：录音成品的艺术质量往往高于今天的现场演出。</p>\n<p>C说的却是：录音对音乐质量产生提升作用。</p>\n<p>原文没有前后时间对比，也没有说因为有录音，作曲、演奏或音乐整体质量被改善。C新增了因果和变化。</p>\n<p><strong>“录音本身质量较高”是否就等于“录音提高了音乐质量”？</strong></p>\n<p>不等于。一个是静态比较，一个是因果作用。</p>\n<p>要选C，原文至少还得写录音促使音乐制作或演奏改进；第4段没有。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1423,1360,402]],"scrollTarget":"article","meta":{"kind":"option","qid":"24","option":"C","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"24题","raw":"### D. They have only covered **[xxx]**.\n\n> 它们只涵盖了 **[xxx]**\n\n把D接回题干，它说的是：录音只涵盖某一类被遮挡的内容。\n\nD的对象被挡住，但可见的`only covered`已经把范围锁得很死。刚才精读时，好像文章提到20世纪伟大古典音乐家的录音，却没有说录音“只”覆盖某一类。\n\n> the recorded performances of the great classical musicians of the 20th century\n>\n> These recordings are cheap, available everywhere ...\n\nD可能让人联想到“伟大古典音乐家的录音”，但原文拿它们作为竞争者举出来，并没有给全部录音划一个排他的覆盖范围。\n\n原文说的是：文章说存在一批20世纪伟大音乐家的录制演出，并讨论这些录音的优势。\n\nD说的却是：所有这些录音只涵盖某种被遮挡内容。\n\n`only`是可见的强限制。无论 **[xxx]** 是什么，要成立都需要原文明确排除其他内容；第4段没有这种“仅仅”关系。\n\n**原文举出一类重要录音，能不能直接说录音“只”涵盖这一类？**\n\n不能。举例或点名一类，不等于排他限定。\n\n要保留D，原文至少还得出现`only`一类的限制并说明其他内容没有被录制；当前没有。\n\n**第一轮判断：D排除。**","html":"<h3>D. They have only covered <span class=\"mask\">[xxx]</span>.</h3>\n<blockquote>\n<p>它们只涵盖了 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把D接回题干，它说的是：录音只涵盖某一类被遮挡的内容。</p>\n<p>D的对象被挡住，但可见的<code>only covered</code>已经把范围锁得很死。刚才精读时，好像文章提到20世纪伟大古典音乐家的录音，却没有说录音“只”覆盖某一类。</p>\n<blockquote>\n<p>the recorded performances of the great classical musicians of the 20th century</p>\n<p>These recordings are cheap, available everywhere ...</p>\n</blockquote>\n<p>D可能让人联想到“伟大古典音乐家的录音”，但原文拿它们作为竞争者举出来，并没有给全部录音划一个排他的覆盖范围。</p>\n<p>原文说的是：文章说存在一批20世纪伟大音乐家的录制演出，并讨论这些录音的优势。</p>\n<p>D说的却是：所有这些录音只涵盖某种被遮挡内容。</p>\n<p><code>only</code>是可见的强限制。无论 <span class=\"mask\">[xxx]</span> 是什么，要成立都需要原文明确排除其他内容；第4段没有这种“仅仅”关系。</p>\n<p><strong>原文举出一类重要录音，能不能直接说录音“只”涵盖这一类？</strong></p>\n<p>不能。举例或点名一类，不等于排他限定。</p>\n<p>要保留D，原文至少还得出现<code>only</code>一类的限制并说明其他内容没有被录制；当前没有。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1423,1360,402]],"scrollTarget":"article","meta":{"kind":"option","qid":"24","option":"D","sourceMode":"within_initial_range","evidenceRangeIds":["P4"],"extraPrecisionRangeIds":[],"optionFlowVersion":"attach_stem_then_evidence_compare_v2","optionFlow":{"schema":"ordinary-option-flow-v2","sequence":["option_title","direct_chinese","stem_reconnect","uncertain_memory_cue","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceMode":"already_read","status":"排除"}}},{"section":"24题","raw":"### 24题第一次结果\n\n这一轮看下来：\n\n- A排除；\n- B保留；\n- C排除；\n- D排除；\n\nB直接复述`available everywhere`；A把质量比较方向倒置，C把静态高质量改成提升作用，D增加了原文没有的`only`排他范围。\n\n> **24题选B。**","html":"<h3>24题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C排除；</li>\n<li>D排除；</li>\n</ul>\n<p>B直接复述<code>available everywhere</code>；A把质量比较方向倒置，C把静态高质量改成提升作用，D增加了原文没有的<code>only</code>排他范围。</p>\n<blockquote>\n<p><strong>24题选B。</strong></p>\n</blockquote>\n","articleRects":[[227,1300,1323,497]],"questionRects":[[235,1423,1360,402]],"scrollTarget":"question","meta":{"kind":"result","qid":"24"}},{"section":"25题","raw":"## 25题\n\n**Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.**\n\n对于Gilbert振兴纽约爱乐的作用，作者持什么态度？\n\n这是全文作者观点／全文主旨题。\n\n这类题先别急着数哪个词出现得最多，也别只凭一个局部句子下结论。更稳的办法是把每个选项当成作者真正想表达的中心或态度，看看全文按它应该怎么展开，再和文章实际写法对照。\n\n选项：\n\nA. **doubtful**\n\n怀疑的\n\nB. **enthusiastic**\n\n热情支持的\n\nC. **confident**\n\n有信心的\n\nD. **puzzled**\n\n困惑的\n\n---","html":"<h2>25题</h2>\n<p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.</strong></p>\n<p>对于Gilbert振兴纽约爱乐的作用，作者持什么态度？</p>\n<p>这是全文作者观点／全文主旨题。</p>\n<p>这类题先别急着数哪个词出现得最多，也别只凭一个局部句子下结论。更稳的办法是把每个选项当成作者真正想表达的中心或态度，看看全文按它应该怎么展开，再和文章实际写法对照。</p>\n<p>选项：</p>\n<p>A. <strong>doubtful</strong></p>\n<p>怀疑的</p>\n<p>B. <strong>enthusiastic</strong></p>\n<p>热情支持的</p>\n<p>C. <strong>confident</strong></p>\n<p>有信心的</p>\n<p>D. <strong>puzzled</strong></p>\n<p>困惑的</p>\n<hr />\n","articleRects":[[227,360,1321,236],[228,621,1322,348],[228,987,1321,288],[227,1300,1323,497],[227,1822,1321,401]],"questionRects":[[235,1830,1360,410]],"scrollTarget":"articleTop","meta":{"kind":"main_overview","qid":"25"}},{"section":"25题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 开头写任命得到赞同，但这位人选又出乎意料 | 先摆出一件大家都在谈的事 |\n| 第2段 | 追问任命为什么意外，并指出对他的称赞听起来很轻 | 再说它为什么让人意外 |\n| 第3段 | 作者承认不知道他是否优秀，并把注意力转到录音对现场的替代 | 接着把注意力转到真正难点 |\n| 第4段 | 解释录音如何争夺公众并给传统音乐会造成危机 | 补一个更大的背景说明并非偶然 |\n| 第5段 | 承认新音乐是一种回应，但说只扩曲目不够，还要改变与新观众的关系 | 最后说现成办法还不够 |\n\n---\n\n**Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.**","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>开头写任命得到赞同，但这位人选又出乎意料</td>\n  <td>先摆出一件大家都在谈的事</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>追问任命为什么意外，并指出对他的称赞听起来很轻</td>\n  <td>再说它为什么让人意外</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>作者承认不知道他是否优秀，并把注意力转到录音对现场的替代</td>\n  <td>接着把注意力转到真正难点</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>解释录音如何争夺公众并给传统音乐会造成危机</td>\n  <td>补一个更大的背景说明并非偶然</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>承认新音乐是一种回应，但说只扩曲目不够，还要改变与新观众的关系</td>\n  <td>最后说现成办法还不够</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<p><strong>Regarding Gilbert’s role in revitalizing the Philharmonic, the author feels ______.</strong></p>\n","articleRects":[[227,360,1321,236],[228,621,1322,348],[228,987,1321,288],[227,1300,1323,497],[227,1822,1321,401]],"questionRects":[[235,1830,1360,410]],"scrollTarget":"articleTop","meta":{"kind":"main_method","qid":"25","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"25题","raw":"### A. doubtful\n\n> 怀疑的\n\n#### 如果 A 是主旨，全文应该怎么写？\n\n如果A是作者态度，全文应不断降低对Gilbert“能否振兴乐团”的确定性：先承认任命受欢迎，再写赞扬有限，随后把真正难题扩大到录音竞争和新观众，结尾强调现有做法不够。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先写任命虽然受欢迎，但这个人是否真能带来改变仍不确定 | 先摆出一件大家都在谈的事 |\n| 第2段 | 再写赞扬力度有限，继续压低确定性 | 再说它为什么让人意外 |\n| 第3段 | 接着点出真正危机不只取决于指挥个人水平 | 接着把注意力转到真正难点 |\n| 第4段 | 补充外部竞争，让振兴任务显得更难 | 补一个更大的背景说明并非偶然 |\n| 第5段 | 最后说现有方案不足，成功仍取决于更深层改变 | 最后说现成办法还不够 |\n\n**作者先说“不知道他是否优秀”，最后又说现成办法“不够”，这条写法是否一直在降低对振兴成功的确定性？**\n\n能。实际文章正是一路压低确定性：作者直说不知道Gilbert是不是好指挥；录音危机又不是换一个指挥就能自动解决；最后还说扩大曲目“不够”，成功必须先改变与新观众的关系。这里不是完全否定Gilbert，而是对他能否承担“振兴”这件事持保留。\n\n**判断：A保留。**","html":"<h3>A. doubtful</h3>\n<blockquote>\n<p>怀疑的</p>\n</blockquote>\n<h4>如果 A 是主旨，全文应该怎么写？</h4>\n<p>如果A是作者态度，全文应不断降低对Gilbert“能否振兴乐团”的确定性：先承认任命受欢迎，再写赞扬有限，随后把真正难题扩大到录音竞争和新观众，结尾强调现有做法不够。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先写任命虽然受欢迎，但这个人是否真能带来改变仍不确定</td>\n  <td>先摆出一件大家都在谈的事</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再写赞扬力度有限，继续压低确定性</td>\n  <td>再说它为什么让人意外</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着点出真正危机不只取决于指挥个人水平</td>\n  <td>接着把注意力转到真正难点</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>补充外部竞争，让振兴任务显得更难</td>\n  <td>补一个更大的背景说明并非偶然</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>最后说现有方案不足，成功仍取决于更深层改变</td>\n  <td>最后说现成办法还不够</td>\n</tr>\n</tbody>\n</table>\n<p><strong>作者先说“不知道他是否优秀”，最后又说现成办法“不够”，这条写法是否一直在降低对振兴成功的确定性？</strong></p>\n<p>能。实际文章正是一路压低确定性：作者直说不知道Gilbert是不是好指挥；录音危机又不是换一个指挥就能自动解决；最后还说扩大曲目“不够”，成功必须先改变与新观众的关系。这里不是完全否定Gilbert，而是对他能否承担“振兴”这件事持保留。</p>\n<p><strong>判断：A保留。</strong></p>\n","articleRects":[[227,360,1321,236],[228,621,1322,348],[228,987,1321,288],[227,1300,1323,497],[227,1822,1321,401]],"questionRects":[[235,1830,1360,410]],"scrollTarget":"articleTop","meta":{"kind":"main_option","qid":"25","option":"A"}},{"section":"25题","raw":"### B. enthusiastic\n\n> 热情支持的\n\n#### 如果 B 是主旨，全文应该怎么写？\n\n如果B是作者态度，全文应把Gilbert写成令人振奋的答案，持续赞扬他的能力和方案，并在结尾给出积极预期。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先热烈欢迎任命，并把它写成明确利好 | 先摆出一件大家都在谈的事 |\n| 第2段 | 再集中赞扬他的能力和声望 | 再说它为什么让人意外 |\n| 第3段 | 接着说明他已经有办法解决现场音乐困境 | 接着把注意力转到真正难点 |\n| 第4段 | 补充背景以衬托他方案的优势 | 补一个更大的背景说明并非偶然 |\n| 第5段 | 最后肯定他将带领乐团成功振兴 | 最后说现成办法还不够 |\n\n**外界的一声“Hooray”能否覆盖作者后面连续的保留和条件，把全文态度变成热情支持？**\n\n不能。文章开头虽有欢呼，但作者随即把赞扬写成`faint praise`，又说自己不知道Gilbert是否优秀。结尾也没有表达兴奋，而是在增加成功条件。B只能抓住开头外界的反应，不能代表作者自己的全文态度。\n\n**判断：B排除。**","html":"<h3>B. enthusiastic</h3>\n<blockquote>\n<p>热情支持的</p>\n</blockquote>\n<h4>如果 B 是主旨，全文应该怎么写？</h4>\n<p>如果B是作者态度，全文应把Gilbert写成令人振奋的答案，持续赞扬他的能力和方案，并在结尾给出积极预期。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先热烈欢迎任命，并把它写成明确利好</td>\n  <td>先摆出一件大家都在谈的事</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再集中赞扬他的能力和声望</td>\n  <td>再说它为什么让人意外</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着说明他已经有办法解决现场音乐困境</td>\n  <td>接着把注意力转到真正难点</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>补充背景以衬托他方案的优势</td>\n  <td>补一个更大的背景说明并非偶然</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>最后肯定他将带领乐团成功振兴</td>\n  <td>最后说现成办法还不够</td>\n</tr>\n</tbody>\n</table>\n<p><strong>外界的一声“Hooray”能否覆盖作者后面连续的保留和条件，把全文态度变成热情支持？</strong></p>\n<p>不能。文章开头虽有欢呼，但作者随即把赞扬写成<code>faint praise</code>，又说自己不知道Gilbert是否优秀。结尾也没有表达兴奋，而是在增加成功条件。B只能抓住开头外界的反应，不能代表作者自己的全文态度。</p>\n<p><strong>判断：B排除。</strong></p>\n","articleRects":[[227,360,1321,236],[228,621,1322,348],[228,987,1321,288],[227,1300,1323,497],[227,1822,1321,401]],"questionRects":[[235,1830,1360,410]],"scrollTarget":"articleTop","meta":{"kind":"main_option","qid":"25","option":"B"}},{"section":"25题","raw":"### C. confident\n\n> 有信心的\n\n#### 如果 C 是主旨，全文应该怎么写？\n\n如果C是作者态度，文章应提供足够事实证明他能解决危机，尤其应在最后明确说新音乐或其他方案足以带来成功。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先把任命写成可靠的成功起点 | 先摆出一件大家都在谈的事 |\n| 第2段 | 再给出足以信任他的能力依据 | 再说它为什么让人意外 |\n| 第3段 | 接着说明关键问题已经被他的方案抓住 | 接着把注意力转到真正难点 |\n| 第4段 | 补充背景后证明方案能够应对危机 | 补一个更大的背景说明并非偶然 |\n| 第5段 | 最后明确预测乐团会因此成功 | 最后说现成办法还不够 |\n\n**当结尾明确说一种方案不够、成功还要先满足新条件时，能否称作者已经有信心？**\n\n不能。“有信心”需要文章给出成功把握。实际第5段用`will not be enough`否定了最现成的方案，还用条件句`If ... are to succeed`说明成功尚未落实。C的确定性过高。\n\n**判断：C排除。**","html":"<h3>C. confident</h3>\n<blockquote>\n<p>有信心的</p>\n</blockquote>\n<h4>如果 C 是主旨，全文应该怎么写？</h4>\n<p>如果C是作者态度，文章应提供足够事实证明他能解决危机，尤其应在最后明确说新音乐或其他方案足以带来成功。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先把任命写成可靠的成功起点</td>\n  <td>先摆出一件大家都在谈的事</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再给出足以信任他的能力依据</td>\n  <td>再说它为什么让人意外</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着说明关键问题已经被他的方案抓住</td>\n  <td>接着把注意力转到真正难点</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>补充背景后证明方案能够应对危机</td>\n  <td>补一个更大的背景说明并非偶然</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>最后明确预测乐团会因此成功</td>\n  <td>最后说现成办法还不够</td>\n</tr>\n</tbody>\n</table>\n<p><strong>当结尾明确说一种方案不够、成功还要先满足新条件时，能否称作者已经有信心？</strong></p>\n<p>不能。“有信心”需要文章给出成功把握。实际第5段用<code>will not be enough</code>否定了最现成的方案，还用条件句<code>If ... are to succeed</code>说明成功尚未落实。C的确定性过高。</p>\n<p><strong>判断：C排除。</strong></p>\n","articleRects":[[227,360,1321,236],[228,621,1322,348],[228,987,1321,288],[227,1300,1323,497],[227,1822,1321,401]],"questionRects":[[235,1830,1360,410]],"scrollTarget":"articleTop","meta":{"kind":"main_option","qid":"25","option":"C"}},{"section":"25题","raw":"### D. puzzled\n\n> 困惑的\n\n#### 如果 D 是主旨，全文应该怎么写？\n\n如果D是作者态度，文章应表现为作者不知道问题在哪里、也不知道该怎样判断各条信息，结尾仍没有方向。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先摆出任命，但说不清该怎样评价 | 先摆出一件大家都在谈的事 |\n| 第2段 | 再罗列互相打架的信息而不作取舍 | 再说它为什么让人意外 |\n| 第3段 | 接着在个人能力和外部危机之间来回摇摆 | 接着把注意力转到真正难点 |\n| 第4段 | 补充背景却仍找不到问题中心 | 补一个更大的背景说明并非偶然 |\n| 第5段 | 最后停在不知道下一步该怎么办 | 最后说现成办法还不够 |\n\n**能准确指出危机来源和下一步关系调整的人，是否只是“不知道怎么办”的困惑？**\n\n不能。作者并不困惑。他清楚指出危机来自录音竞争，也清楚指出仅扩曲目不够、要改变与新观众的关系。问题和方向都说得很明白，只是对Gilbert能否做到保持怀疑。\n\n**判断：D排除。**","html":"<h3>D. puzzled</h3>\n<blockquote>\n<p>困惑的</p>\n</blockquote>\n<h4>如果 D 是主旨，全文应该怎么写？</h4>\n<p>如果D是作者态度，文章应表现为作者不知道问题在哪里、也不知道该怎样判断各条信息，结尾仍没有方向。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>先摆出任命，但说不清该怎样评价</td>\n  <td>先摆出一件大家都在谈的事</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>再罗列互相打架的信息而不作取舍</td>\n  <td>再说它为什么让人意外</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>接着在个人能力和外部危机之间来回摇摆</td>\n  <td>接着把注意力转到真正难点</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>补充背景却仍找不到问题中心</td>\n  <td>补一个更大的背景说明并非偶然</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>最后停在不知道下一步该怎么办</td>\n  <td>最后说现成办法还不够</td>\n</tr>\n</tbody>\n</table>\n<p><strong>能准确指出危机来源和下一步关系调整的人，是否只是“不知道怎么办”的困惑？</strong></p>\n<p>不能。作者并不困惑。他清楚指出危机来自录音竞争，也清楚指出仅扩曲目不够、要改变与新观众的关系。问题和方向都说得很明白，只是对Gilbert能否做到保持怀疑。</p>\n<p><strong>判断：D排除。</strong></p>\n","articleRects":[[227,360,1321,236],[228,621,1322,348],[2
