s the text centered on?**\n\n### A. The debates over a program.\n\n关于一个项目的争论。\n\n#### 如果 A 是主旨，文章8段应该怎么写？\n\n如果A是中心，每段的展开就应围绕这一点。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先摆出引发争论的项目变化。 | 先摆出变化并提出可能原因 |\n| 第2段 | 介绍项目及支持方已有理由。 | 再说具体做法与已有好处 |\n| 第3段 | 呈现另一方反对的意见。 | 接着说以往忽略了另一面 |\n| 第4段 | 用背景和例子展开双方争论。 | 再补一个背景和已有例子 |\n| 第5段 | 说明一方怎样反驳另一方。 | 但是又说结果不必总如此 |\n| 第6段 | 继续给出对争议双方立场的比较。 | 接着摆出另一处的实际结果 |\n| 第7段 | 解释争论为什么持续发生。 | 回头解释这种结果怎样发生 |\n| 第8段 | 最后评价双方意见并作出取舍。 | 最后说适用限度和所得好处 |\n\nA的debates需要文章持续呈现关于项目的争论者、双方意见或交锋。文中确实提到常见看法，也用墨西哥与印尼形成不同结果，但这些是在建立研究问题并展示项目可能产生不同环境效果。第6、7段提供结果和解释，第8段评价价值，没有回到争论双方逐一回应。把背景中的传统看法当成整篇争论，会漏掉文章主要在说明实际产生什么结果。\n\n**传统看法与新结果不一样，就能把全文写成围绕项目的争论吗？**\n\n不能。不同看法在这里帮助提出效果问题，后续篇幅用于结果、解释和价值，没有形成持续的双方争论。\n\n**判断：A排除。**\n\n---","html":"<p><strong>What is the text centered on?</strong></p>\n<h3>A. The debates over a program.</h3>\n<p>关于一个项目的争论。</p>\n<h4>如果 A 是主旨，文章8段应该怎么写？</h4>\n<p>如果A是中心，每段的展开就应围绕这一点。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先摆出引发争论的项目变化。</td>\n<td>先摆出变化并提出可能原因</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍项目及支持方已有理由。</td>\n<td>再说具体做法与已有好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>呈现另一方反对的意见。</td>\n<td>接着说以往忽略了另一面</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用背景和例子展开双方争论。</td>\n<td>再补一个背景和已有例子</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>说明一方怎样反驳另一方。</td>\n<td>但是又说结果不必总如此</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>继续给出对争议双方立场的比较。</td>\n<td>接着摆出另一处的实际结果</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>解释争论为什么持续发生。</td>\n<td>回头解释这种结果怎样发生</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最后评价双方意见并作出取舍。</td>\n<td>最后说适用限度和所得好处</td>\n</tr>\n</tbody></table>\n<p>A的debates需要文章持续呈现关于项目的争论者、双方意见或交锋。文中确实提到常见看法，也用墨西哥与印尼形成不同结果，但这些是在建立研究问题并展示项目可能产生不同环境效果。第6、7段提供结果和解释，第8段评价价值，没有回到争论双方逐一回应。把背景中的传统看法当成整篇争论，会漏掉文章主要在说明实际产生什么结果。</p>\n<p><strong>传统看法与新结果不一样，就能把全文写成围绕项目的争论吗？</strong></p>\n<p>不能。不同看法在这里帮助提出效果问题，后续篇幅用于结果、解释和价值，没有形成持续的双方争论。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,536,32],[315,1984,513,35]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"A"}},{"section":"30题","raw":"**What is the text centered on?**\n\n### B. The effects of a program.\n\n一个项目的效果。\n\n#### 如果 B 是主旨，文章8段应该怎么写？\n\n如果B是中心，每段的展开就应围绕这一点。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先用明显变化引出项目可能产生的效果。 | 先摆出变化并提出可能原因 |\n| 第2段 | 说明原定减贫目标与已知生活效果。 | 再说具体做法与已有好处 |\n| 第3段 | 转出项目另一个常被忽略的环境方面。 | 接着说以往忽略了另一面 |\n| 第4段 | 用背景和前例说明可能出现不利效果。 | 再补一个背景和已有例子 |\n| 第5段 | 提出在新地点考察是否也有这种效果。 | 但是又说结果不必总如此 |\n| 第6段 | 给出实际观察到的森林变化。 | 接着摆出另一处的实际结果 |\n| 第7段 | 解释产生有利变化的可能办法。 | 回头解释这种结果怎样发生 |\n| 第8段 | 讨论效果能否推广以及其总体价值。 | 最后说适用限度和所得好处 |\n\nB的effects能够同时容纳减贫、儿童成长以及森林砍伐这些结果。文章开头就把砍伐放慢与扶贫项目联系，第2段交代项目通常要改善贫困生活，第3至5段追問它是否对环境不利，第6段给出减少砍伐的发现，第7段解释现金为什么可能代替清地，第8段再说结果的推广限度和环境价值。研究是弄清效果的途径，推广性只是结果出现后的一项讨论，整条行文持续围绕项目对人和环境产生什么影响。\n\n**减贫目的、森林结果、形成原因及最后的价值，能否都纳入项目的效果？**\n\n能。各段从已知效果转到额外环境效果，再说明其机制和意义，B保留了贯穿全文的考察对象。\n\n**判断：B保留。**\n\n---","html":"<p><strong>What is the text centered on?</strong></p>\n<h3>B. The effects of a program.</h3>\n<p>一个项目的效果。</p>\n<h4>如果 B 是主旨，文章8段应该怎么写？</h4>\n<p>如果B是中心，每段的展开就应围绕这一点。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先用明显变化引出项目可能产生的效果。</td>\n<td>先摆出变化并提出可能原因</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明原定减贫目标与已知生活效果。</td>\n<td>再说具体做法与已有好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>转出项目另一个常被忽略的环境方面。</td>\n<td>接着说以往忽略了另一面</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用背景和前例说明可能出现不利效果。</td>\n<td>再补一个背景和已有例子</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>提出在新地点考察是否也有这种效果。</td>\n<td>但是又说结果不必总如此</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>给出实际观察到的森林变化。</td>\n<td>接着摆出另一处的实际结果</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>解释产生有利变化的可能办法。</td>\n<td>回头解释这种结果怎样发生</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>讨论效果能否推广以及其总体价值。</td>\n<td>最后说适用限度和所得好处</td>\n</tr>\n</tbody></table>\n<p>B的effects能够同时容纳减贫、儿童成长以及森林砍伐这些结果。文章开头就把砍伐放慢与扶贫项目联系，第2段交代项目通常要改善贫困生活，第3至5段追問它是否对环境不利，第6段给出减少砍伐的发现，第7段解释现金为什么可能代替清地，第8段再说结果的推广限度和环境价值。研究是弄清效果的途径，推广性只是结果出现后的一项讨论，整条行文持续围绕项目对人和环境产生什么影响。</p>\n<p><strong>减贫目的、森林结果、形成原因及最后的价值，能否都纳入项目的效果？</strong></p>\n<p>能。各段从已知效果转到额外环境效果，再说明其机制和意义，B保留了贯穿全文的考察对象。</p>\n<p><strong>判断：B保留。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,536,32],[315,2051,461,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"B"}},{"section":"30题","raw":"**What is the text centered on?**\n\n### C. The transferability of a study.\n\n一项研究的可推广性。\n\n#### 如果 C 是主旨，文章8段应该怎么写？\n\n如果C是中心，每段的展开就应围绕这一点。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先从一个地方的变化引出向外移用问题。 | 先摆出变化并提出可能原因 |\n| 第2段 | 交代项目在各地使用的情况。 | 再说具体做法与已有好处 |\n| 第3段 | 提出跨地区移用时的环境差别。 | 接着说以往忽略了另一面 |\n| 第4段 | 用已有地区比较哪些条件适合推广。 | 再补一个背景和已有例子 |\n| 第5段 | 再选择一个新地点测试推广条件。 | 但是又说结果不必总如此 |\n| 第6段 | 报告该地是否满足相同条件。 | 接着摆出另一处的实际结果 |\n| 第7段 | 解释哪些条件决定可推广性。 | 回头解释这种结果怎样发生 |\n| 第8段 | 最后对推广范围与限制作总体判断。 | 最后说适用限度和所得好处 |\n\nC的transferability正好碰到第8段开头的elsewhere和other parts of Asia。但是前面大部分篇幅问的不是研究能否移用到别处，而是印尼扶贫项目对森林有什么效果、为什么有这种效果。最后说推广尚不确定之后，还继续强调人和环境可能共同受益及环保价值。可推广性是已经得到结果后的限制性讨论，不能倒过来覆盖前面的项目目的、研究发现和机制解释。\n\n**末段才提出的能否推广，是否一直是前七段围绕的中心问题？**\n\n不是。前面先要弄清项目产生什么结果，末段才顺带限定这些结果能否用于别处，C缩小了全文范围。\n\n**判断：C排除。**\n\n---","html":"<p><strong>What is the text centered on?</strong></p>\n<h3>C. The transferability of a study.</h3>\n<p>一项研究的可推广性。</p>\n<h4>如果 C 是主旨，文章8段应该怎么写？</h4>\n<p>如果C是中心，每段的展开就应围绕这一点。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先从一个地方的变化引出向外移用问题。</td>\n<td>先摆出变化并提出可能原因</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>交代项目在各地使用的情况。</td>\n<td>再说具体做法与已有好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>提出跨地区移用时的环境差别。</td>\n<td>接着说以往忽略了另一面</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用已有地区比较哪些条件适合推广。</td>\n<td>再补一个背景和已有例子</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>再选择一个新地点测试推广条件。</td>\n<td>但是又说结果不必总如此</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>报告该地是否满足相同条件。</td>\n<td>接着摆出另一处的实际结果</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>解释哪些条件决定可推广性。</td>\n<td>回头解释这种结果怎样发生</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最后对推广范围与限制作总体判断。</td>\n<td>最后说适用限度和所得好处</td>\n</tr>\n</tbody></table>\n<p>C的transferability正好碰到第8段开头的elsewhere和other parts of Asia。但是前面大部分篇幅问的不是研究能否移用到别处，而是印尼扶贫项目对森林有什么效果、为什么有这种效果。最后说推广尚不确定之后，还继续强调人和环境可能共同受益及环保价值。可推广性是已经得到结果后的限制性讨论，不能倒过来覆盖前面的项目目的、研究发现和机制解释。</p>\n<p><strong>末段才提出的能否推广，是否一直是前七段围绕的中心问题？</strong></p>\n<p>不是。前面先要弄清项目产生什么结果，末段才顺带限定这些结果能否用于别处，C缩小了全文范围。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,536,32],[315,2119,528,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"C"}},{"section":"30题","raw":"**What is the text centered on?**\n\n### D. The process of a study.\n\n一项研究的过程。\n\n#### 如果 D 是主旨，文章8段应该怎么写？\n\n如果D是中心，每段的展开就应围绕这一点。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先交代研究从某项变化开始。 | 先摆出变化并提出可能原因 |\n| 第2段 | 说明被研究项目作为研究准备。 | 再说具体做法与已有好处 |\n| 第3段 | 提出研究前面对的理论问题。 | 接着说以往忽略了另一面 |\n| 第4段 | 介绍已有研究怎样帮助形成步骤。 | 再补一个背景和已有例子 |\n| 第5段 | 确立研究地点和具体研究问题。 | 但是又说结果不必总如此 |\n| 第6段 | 详细交代研究如何收集并处理资料。 | 接着摆出另一处的实际结果 |\n| 第7段 | 继续说明检验解释所用的操作步骤。 | 回头解释这种结果怎样发生 |\n| 第8段 | 最后交代研究完成的程序及下一步。 | 最后说适用限度和所得好处 |\n\nD的process会把重点放在研究怎样逐步开展。第5段说研究意图，第6段提卫星数据与时间地点，确实交代了一点过程；但第6段随即给出砍伐减少的结果，第7段讲的是现金如何影响人们的用地选择，不是研究人员又进行了哪一步操作，第8段评价的是效果的价值。过程只占为发现提供依据的少量文字，并未持续组织全文。\n\n**文章详细展开的是研究人员的操作步骤，还是项目对生活与环境产生的结果？**\n\n后者。数据和研究方式为结果作依据，后面解释的是项目影响的原因和价值，D把支撑信息提升成了中心。\n\n**判断：D排除。**\n\n---","html":"<p><strong>What is the text centered on?</strong></p>\n<h3>D. The process of a study.</h3>\n<p>一项研究的过程。</p>\n<h4>如果 D 是主旨，文章8段应该怎么写？</h4>\n<p>如果D是中心，每段的展开就应围绕这一点。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先交代研究从某项变化开始。</td>\n<td>先摆出变化并提出可能原因</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明被研究项目作为研究准备。</td>\n<td>再说具体做法与已有好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>提出研究前面对的理论问题。</td>\n<td>接着说以往忽略了另一面</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>介绍已有研究怎样帮助形成步骤。</td>\n<td>再补一个背景和已有例子</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>确立研究地点和具体研究问题。</td>\n<td>但是又说结果不必总如此</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>详细交代研究如何收集并处理资料。</td>\n<td>接着摆出另一处的实际结果</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>继续说明检验解释所用的操作步骤。</td>\n<td>回头解释这种结果怎样发生</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最后交代研究完成的程序及下一步。</td>\n<td>最后说适用限度和所得好处</td>\n</tr>\n</tbody></table>\n<p>D的process会把重点放在研究怎样逐步开展。第5段说研究意图，第6段提卫星数据与时间地点，确实交代了一点过程；但第6段随即给出砍伐减少的结果，第7段讲的是现金如何影响人们的用地选择，不是研究人员又进行了哪一步操作，第8段评价的是效果的价值。过程只占为发现提供依据的少量文字，并未持续组织全文。</p>\n<p><strong>文章详细展开的是研究人员的操作步骤，还是项目对生活与环境产生的结果？</strong></p>\n<p>后者。数据和研究方式为结果作依据，后面解释的是项目影响的原因和价值，D把支撑信息提升成了中心。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,536,32],[315,2187,427,36]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"D"}},{"section":"30题","raw":"### 30题结论\n\n**30. B. The effects of a program.**\n\n全文追问扶贫项目除了原定减贫目标，还会给环境带来什么效果；通过印尼的森林结果与可能机制说明对人好的项目也可能对环境好，并讨论这种效果的适用范围和价值。\n\n这句话就是本文后续做题的主旨底牌：\n\n**The effects of a program. / 一个项目的效果。**\n\n---","html":"<h3>30题结论</h3>\n<p><strong>30. B. The effects of a program.</strong></p>\n<p>全文追问扶贫项目除了原定减贫目标，还会给环境带来什么效果；通过印尼的森林结果与可能机制说明对人好的项目也可能对环境好，并讨论这种效果的适用范围和价值。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>The effects of a program. / 一个项目的效果。</strong></p>\n<hr>\n","articleRects":[],"questionRects":[[255,1915,536,32]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"30"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命 些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>26题题干</h2>\n<p><strong>According to the first two paragraphs, CCT programs aim to ______.</strong></p>\n<blockquote>\n<p>根据前两段，CCT项目旨在做什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>27题题干</h2>\n<p><strong>The study based on an area in Mexico is cited to show that ______.</strong></p>\n<blockquote>\n<p>引用墨西哥一个地区的研究，是为了说明什么？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n<hr>\n<h2>28题题干</h2>\n<p><strong>In his study about Indonesia, Ferraro intends to find out ______.</strong></p>\n<blockquote>\n<p>在关于印度尼西亚的研究中，Ferraro打算弄清什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>29题题干</h2>\n<p><strong>According to Ferraro, the CCT program in Indonesia is most valuable in that ______.</strong></p>\n<blockquote>\n<p>根据Ferraro，印度尼西亚的CCT项目最有价值的是哪一点？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr>\n<h2>30题题干</h2>\n<p><strong>What is the text centered on?</strong></p>\n<blockquote>\n<p>本文围绕什么展开？</p>\n</blockquote>\n<p>题型：<strong>全文主旨题</strong>。</p>\n<hr>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>But；However；though；Even if</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>good；negatively；severe</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>gives；reduce；analyzed；supplement</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>slowed；reduction；forest loss</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>CCTs；poverty；environment；deforestation</td>\n</tr>\n</tbody></table>\n<h3>第1段</h3>\n<p><strong>原文参考：</strong></p>\n<p>Last year marked the third year in a row that Indonesia’s <strong>[xxx]</strong> rate of deforestation has slowed in pace. One reason for the <strong>[xxx]</strong> may be the country’s antipoverty program.</p>\n<p><strong>开始粗读：</strong></p>\n<p>Last year marked the third year in a row / that Indonesia’s <strong>[xxx]</strong> rate of deforestation / has slowed in pace. / One reason for the <strong>[xxx]</strong> / may be the country’s antipoverty program.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>去年 marked 连续第三年 / that Indonesia’s <strong>[xxx]</strong> rate of deforestation / has 放慢步伐. / One reason for the <strong>[xxx]</strong> / may be the country’s 扶贫项目.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>1、去年、连续第三年、放慢步伐、扶贫项目。</p>\n<h3>第2段</h3>\n<p><strong>原文参考：</strong></p>\n<p>In 2007, Indonesia started <strong>[xxx]</strong> in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care. Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce <strong>[xxx]</strong> and break the cycle of poverty. They’re already used in dozens of countries worldwide. In Indonesia, the program has provided enough food and medicine to <strong>[xxx]</strong> reduce severe growth problems among children.</p>\n<p><strong>开始粗读：</strong></p>\n<p>In 2007, Indonesia started <strong>[xxx]</strong> in a program / that gives money to its poorest residents / under certain conditions, / such as requiring people to keep kids in school / or get regular medical care. / Called conditional cash transfers or CCTs, / these social assistance programs are designed / to reduce <strong>[xxx]</strong> and break the cycle of poverty. / They’re already used in dozens of countries worldwide. / In Indonesia, the program has provided enough food and medicine / to <strong>[xxx]</strong> reduce severe growth problems among children.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>In 2007, Indonesia started <strong>[xxx]</strong> in a program / that 给钱 to its 最贫困的居民 / 在某些条件下, / such as requiring people to 让孩子继续上学 / or get regular medical care. / Called conditional cash transfers or CCTs, / these social assistance programs are designed / to reduce <strong>[xxx]</strong> and 打破贫穷的循环. / They’re already used in dozens of countries worldwide. / In Indonesia, the program has provided enough 食物与药品 / to <strong>[xxx]</strong> reduce severe growth problems among children.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>2、给钱、最贫困的居民、在某些条件下、让孩子继续上学、打破贫穷的循环、食物与药品。</p>\n<h3>第3段</h3>\n<p><strong>原文参考：</strong></p>\n<p>But CCT programs don’t generally consider effects on the environment. In fact, poverty <strong>[xxx]</strong> and environmental protection are often viewed as <strong>[xxx]</strong> goals, says Paul Ferraro, an economist at Johns Hopkins University.</p>\n<p><strong>开始粗读：</strong></p>\n<p>But CCT programs don’t generally consider / effects on the environment. / In fact, poverty <strong>[xxx]</strong> and environmental protection / are often viewed as <strong>[xxx]</strong> goals, / says Paul Ferraro, / an economist at Johns Hopkins University.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>But CCT programs don’t generally consider / 对环境的影响. / In fact, poverty <strong>[xxx]</strong> and 环境保护 / are often viewed as <strong>[xxx]</strong> 目标, / says Paul Ferraro, / an economist at Johns Hopkins University.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>3、对环境的影响、环境保护、目标。</p>\n<h3>第4段</h3>\n<p><strong>原文参考：</strong></p>\n<p>That’s because economic growth can be correlated with environmental <strong>[xxx]</strong>, while protecting the environment is sometimes correlated with greater poverty. However, those correlations don’t prove cause and effect. The only previous study analyzing <strong>[xxx]</strong>, based on an area in Mexico that had <strong>[xxx]</strong> CCTs, supported the traditional view. There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.</p>\n<p><strong>开始粗读：</strong></p>\n<p>That’s because economic growth can be correlated / with environmental <strong>[xxx]</strong>, / while protecting the environment / is sometimes correlated with greater poverty. / However, those correlations don’t prove cause and effect. / The only previous study analyzing <strong>[xxx]</strong>, / based on an area in Mexico / that had <strong>[xxx]</strong> CCTs, / supported the traditional view. / There, as people got more money, / some of them may have more cleared land / for cattle to raise for meat, / Ferraro says.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>That’s because 经济增长 can be correlated / with environmental <strong>[xxx]</strong>, / while 保护环境 / is sometimes correlated with 更大的贫穷. / However, those correlations don’t prove 原因和结果. / The only previous study analyzing <strong>[xxx]</strong>, / based on 墨西哥的一个地区 / that had <strong>[xxx]</strong> CCTs, / supported the traditional view. / There, as people 得到更多钱, / some of them may have more cleared land / for cattle to raise for meat, / Ferraro says.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>4、经济增长、保护环境、更大的贫穷、原因和结果、墨西哥的一个地区、得到更多钱。</p>\n<h3>第5段</h3>\n<p><strong>原文参考：</strong></p>\n<p>Such programs do not have to negatively affect the environment, though. Ferraro wanted to see if Indonesia’s poverty-alleviation program was affecting deforestation. Indonesia has the third-largest area of <strong>[xxx]</strong> forest in the world and one of the highest deforestation rates.</p>\n<p><strong>开始粗读：</strong></p>\n<p>Such programs do not have to / negatively affect the environment, though. / Ferraro wanted to see / if Indonesia’s poverty-alleviation program was affecting deforestation. / Indonesia has the third-largest area / of <strong>[xxx]</strong> forest in the world / and one of the highest deforestation rates.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>Such programs do not have to / 对环境造成负面影响, though. / Ferraro 想看看 / if Indonesia’s poverty-alleviation program was affecting deforestation. / Indonesia has the third-largest area / of <strong>[xxx]</strong> forest in the world / and one of the highest 森林砍伐率.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>5、对环境造成负面影响、想看看、森林砍伐率。</p>\n<h3>第6段</h3>\n<p><strong>原文参考：</strong></p>\n<p>Ferraro analyzed satellite data showing annual forest loss from 2008 to 2012— including during Indonesia’s phase-in of the antipoverty program—in 7,468 <strong>[xxx]</strong> villages across 15 provinces. “We see that the program is associated with a 30 percent reduction in deforestation,” Ferraro says.</p>\n<p><strong>开始粗读：</strong></p>\n<p>Ferraro analyzed satellite data / showing annual forest loss from 2008 to 2012 / — including during Indonesia’s phase-in of the antipoverty program— / in 7,468 <strong>[xxx]</strong> villages across 15 provinces. / “We see that the program is associated / with a 30 percent reduction in deforestation,” / Ferraro says.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>Ferraro 分析了卫星数据 / showing 每年的森林损失 from 2008 to 2012 / — including during Indonesia’s phase-in of the antipoverty program— / in 7,468 <strong>[xxx]</strong> villages across 15 provinces. / “We see that the program is associated / with a 30 percent 森林砍伐减少,” / Ferraro says.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>6、分析了卫星数据、每年的森林损失、森林砍伐减少。</p>\n<h3>第7段</h3>\n<p><strong>原文参考：</strong></p>\n<p>That’s likely because the rural poor are using the money as <strong>[xxx]</strong> insurance policies against <strong>[xxx]</strong> weather, Ferraro says. Typically, if rains are delayed, people may clear land to plant more rice to <strong>[xxx]</strong> their harvests. With the CCTs, individuals instead can use the money to supplement their harvests.</p>\n<p><strong>开始粗读：</strong></p>\n<p>That’s likely because the rural poor / are using the money / as <strong>[xxx]</strong> insurance policies / against <strong>[xxx]</strong> weather, Ferraro says. / Typically, if rains are delayed, / people may clear land to plant more rice / to <strong>[xxx]</strong> their harvests. / With the CCTs, individuals instead can use the money / to supplement their harvests.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>That’s likely because 农村贫困人口 / are using the money / as <strong>[xxx]</strong> insurance policies / against <strong>[xxx]</strong> weather, Ferraro says. / Typically, if 降雨推迟, / people may clear land to 种更多水稻 / to <strong>[xxx]</strong> their harvests. / With the CCTs, individuals instead can use the money / to 补充他们的收成.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>7、农村贫困人口、降雨推迟、种更多水稻、补充他们的收成。</p>\n<h3>第8段</h3>\n<p><strong>原文参考：</strong></p>\n<p>Whether this research translates elsewhere is anybody’s guess. Ferraro suggests the results may transfer to other parts of Asia, due to <strong>[xxx]</strong> such as the importance of growing rice and market access. And regardless of <strong>[xxx]</strong>, the study shows that what’s good for people may also be good for the environment. Even if this program didn’t reduce poverty, Ferraro says, “the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.”</p>\n<p><strong>开始粗读：</strong></p>\n<p>Whether this research translates elsewhere / is anybody’s guess. / Ferraro suggests / the results may transfer to other parts of Asia, / due to <strong>[xxx]</strong> / such as the importance of growing rice and market access. / And regardless of <strong>[xxx]</strong>, / the study shows / that what’s good for people / may also be good for the environment. / Even if this program didn’t reduce poverty, / Ferraro says, / “the value of the avoided deforestation / just for carbon dioxide emissions alone / is more than the program costs.”</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>Whether 这项研究 translates elsewhere / 谁都说不准. / Ferraro suggests / the results 可能移用 to 亚洲其他地区, / due to <strong>[xxx]</strong> / such as the importance of growing rice and market access. / And regardless of <strong>[xxx]</strong>, / 这项研究表明 / that 对人有好处的事 / may also be 对环境有好处. / Even if this program 没有减少贫穷, / Ferraro says, / “the value of the avoided deforestation / just for 单就二氧化碳排放 / is 超过这个项目的成本.”</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>8、这项研究、谁都说不准、可能移用、亚洲其他地区、这项研究表明、对人有好处的事、对环境有好处、没有减少贫穷、单就二氧化碳排放、超过这个项目的成本。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到去年、连续第三年、放慢步伐、扶贫项目；接着是给钱、贫困居民、孩子上学和贫穷循环。中间好像有环境影响、经济增长、墨西哥、得到更多钱，后面又出现卫星数据、森林砍伐减少、降雨推迟、种水稻。结尾留下亚洲其他地区、对人有好处、对环境有好处、成本。</p>\n<p>到这里还不能自然地说清楚：扶贫项目和放慢步伐究竟如何联系，经济增长、墨西哥和环境之间是什么关系，降雨推迟与给钱又怎样接起来，这项研究能不能移到其他地方。粗读时只要能判断“这篇文章大概与扶贫项目、贫困居民与环境有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住给钱、贫困居民、环境影响、墨西哥、森林砍伐减少、种水稻和项目成本；这些信息之间到底是什么关系，等题目问到再精读。</p>\n<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n<h2>26题</h2>\n<blockquote>\n<p>According to the first two paragraphs, CCT programs aim to ______.<br>根据前两段，CCT项目旨在做什么？</p>\n</blockquote>\n<p>题干明示 first two paragraphs，所以直接把第1、2段完整读完，尤其分清项目要求居民做什么、项目本身要达到什么目的。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Last year marked the third year in a row that Indonesia’s <strong>[xxx]</strong> rate of deforestation has slowed in pace. One reason for the <strong>[xxx]</strong> may be the country’s antipoverty program.</p>\n<p>开始精读：</p>\n<p>Last year marked the third year in a row / that Indonesia’s <strong>[xxx]</strong> rate of deforestation / has slowed in pace. / One reason for the <strong>[xxx]</strong> / may be the country’s antipoverty program.</p>\n<p>去年标志着连续第三年 / 印度尼西亚 <strong>[xxx]</strong> 的森林砍伐速度 / 已经放慢了步伐。/ 这种 <strong>[xxx]</strong> 的一个原因 / 可能是这个国家的扶贫项目。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>In 2007, Indonesia started <strong>[xxx]</strong> in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care. Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce <strong>[xxx]</strong> and break the cycle of poverty. They’re already used in dozens of countries worldwide. In Indonesia, the program has provided enough food and medicine to <strong>[xxx]</strong> reduce severe growth problems among children.</p>\n<p>开始精读：</p>\n<p>In 2007, Indonesia started <strong>[xxx]</strong> in a program / that gives money to its poorest residents / under certain conditions, / such as requiring people to keep kids in school / or get regular medical care. / Called conditional cash transfers or CCTs, / these social assistance programs are designed / to reduce <strong>[xxx]</strong> and break the cycle of poverty. / They’re already used in dozens of countries worldwide. / In Indonesia, the program has provided enough food and medicine / to <strong>[xxx]</strong> reduce severe growth problems among children.</p>\n<p>在2007年，印度尼西亚开始在一个项目中 <strong>[xxx]</strong> / 这个项目给最贫困的居民钱 / 在某些条件下，/ 例如要求人们让孩子继续上学 / 或得到定期医疗照护。/ 被称为有条件现金转移或CCTs，/ 这些社会援助项目被设计 / 来减少 <strong>[xxx]</strong> 并打破贫穷的循环。/ 它们已经在全世界数十个国家被使用。/ 在印度尼西亚，这个项目已经提供足够的食物与药品 / 来 <strong>[xxx]</strong> 地减少儿童中的严重生长问题。</p>\n</blockquote>\n<p>第1段写森林砍伐速度放慢及可能的原因，第2段才正式介绍CCT：向贫困居民给钱，附带上学或医疗条件，目的写在are designed之后。题干中的aim to问的是项目的目标。</p>\n<h3>A. improve local education systems</h3>\n<blockquote>\n<p>改善当地的教育系统。</p>\n</blockquote>\n<p>把A接回题干，它说的是：CCT的目标是改善当地教育系统。</p>\n<p>A的 education systems 与第2段 keep kids in school 都涉及教育，但一个是教育系统，一个是孩子是否继续上学，因此回到列举领取钱款条件的句子。</p>\n<blockquote>\n<p>In 2007, Indonesia started <strong>[xxx]</strong> in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care.</p>\n</blockquote>\n<p>原文的 keep kids in school 是 requiring people 后面的条件：居民要让孩子继续上学，才能满足项目要求。A的 education systems 把对象从贫困家庭及孩子换成教育制度或系统，也把一项领取钱款的条件改成整个项目的目标。要求孩子上学不等于改造学校制度、课程或管理；这些内容不在原句的要求中。</p>\n<p><strong>对家庭提出孩子上学的条件，能等同于改善教育系统这一项目目标吗？</strong></p>\n<p>不能。条件要求的是家庭的具体行为，A却变成对整个教育系统进行改善，动作对象与条件的作用都发生了变化。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. lower deforestation rates</h3>\n<blockquote>\n<p>降低森林砍伐率。</p>\n</blockquote>\n<p>把B接回题干，它说的是：CCT最初就是以降低森林砍伐率为目标。</p>\n<p>B的 lower deforestation rates 对应第1段森林砍伐步伐放慢，而 may be 引出扶贫项目作为可能的原因；两处都涉及砍伐变化，所以回到首段，并联系第2段明写设计目的的句子。</p>\n<blockquote>\n<p>One reason for the <strong>[xxx]</strong> may be the country’s antipoverty program.</p>\n</blockquote>\n<blockquote>\n<p>Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce <strong>[xxx]</strong> and break the cycle of poverty.</p>\n</blockquote>\n<p>首段的 may be 说扶贫项目可能是砍伐速度放慢的原因，这是后来观察到的效果。第2段are designed接的目标则是减少 <strong>[xxx]</strong> 和打破贫穷循环。B的 lower deforestation rates 把可能产生的森林效果换成项目原先的目的。项目给最贫困居民钱，条件是上学、医疗；这套介绍的目标对象仍是贫困居民的生活。</p>\n<p><strong>项目可能产生了森林方面的好效果，是否就能说它原本以此为目标？</strong></p>\n<p>不能。第1段给的是可能的结果解释，第2段才专门写设计目的；B把效果与目的的位置倒换了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. help poor families get better off</h3>\n<blockquote>\n<p>帮助贫困家庭过得更好。</p>\n</blockquote>\n<p>把C接回题干，它说的是：CCT旨在帮助贫困家庭改善生活。</p>\n<p>C的 poor families get better off 指贫困家庭摆脱窘境，与第2段 break the cycle of poverty 都在说改变贫穷生活，因此回到are designed所在句，并看钱给谁。</p>\n<blockquote>\n<p>that gives money to its poorest residents under certain conditions</p>\n</blockquote>\n<blockquote>\n<p>Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce <strong>[xxx]</strong> and break the cycle of poverty.</p>\n</blockquote>\n<p>原文的钱给 poorest residents，目的之一是 break the cycle of poverty。C的 poor families get better off 把“给贫困居民援助、打破贫穷循环”概括为让贫困家庭过得更好。对象相同，改善生活的方向也能接上；它没有把上学、医疗的附带条件提升成改革制度的总目标。</p>\n<p><strong>钱给最贫困居民并要打破贫穷循环，能支持帮助贫困家庭改善生活吗？</strong></p>\n<p>能。目标群体和改变贫困状况的方向都明确，C把目的概括出来，且没有增加其他改革对象。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. <strong>[xxx]</strong> health care reform</h3>\n<blockquote>\n<p>对医疗改革做 <strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把D接回题干，它说的是：CCT旨在对医疗改革采取某种 <strong>[xxx]</strong> 行动。</p>\n<p>D的 health care reform 提到医疗改革，第2段 get regular medical care 则要求居民得到定期医疗照护；都提到医疗，因此回到领取钱款条件的末尾，分清照护和改革。</p>\n<blockquote>\n<p>In 2007, Indonesia started <strong>[xxx]</strong> in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care.</p>\n</blockquote>\n<p>原文的 get regular medical care 是个人定期接受照护，与保持孩子上学并列，属于给钱时附加的条件。D的 health care reform 则把对象改成医疗制度改革。<strong>[xxx]</strong> 会决定怎样对待改革，却不会把reform变回居民接受照护；即使两边都出现医疗，也不能把行为要求直接变成制度层面的项目目的。</p>\n<p><strong>要求个人定期就医，能等同于推动某种医疗改革吗？</strong></p>\n<p>不能。原文让居民接受服务，D讨论改革服务体系；未知的动作不会改变reform这个已经写出的对象。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>26题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>C对应给贫困居民援助、打破贫穷循环。A、D把个人条件改成制度改革，B把可能产生的环境效果改成设计目的。</p>\n<blockquote>\n<p><strong>26题选C。</strong></p>\n</blockquote>\n<h2>27题</h2>\n<blockquote>\n<p>The study based on an area in Mexico is cited to show that ______.<br>引用墨西哥一个地区的研究，是为了说明什么？</p>\n</blockquote>\n<p>题干直接点出 Mexico，对应第4段的 an area in Mexico。先读完第4段；其中traditional view回接相邻第3段的两个目标，要判断这项研究在说明什么，再把第3段完整读一遍。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>That’s because economic growth can be correlated with environmental <strong>[xxx]</strong>, while protecting the environment is sometimes correlated with greater poverty. However, those correlations don’t prove cause and effect. The only previous study analyzing <strong>[xxx]</strong>, based on an area in Mexico that had <strong>[xxx]</strong> CCTs, supported the traditional view. There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.</p>\n<p>开始精读：</p>\n<p>That’s because economic growth can be correlated / with environmental <strong>[xxx]</strong>, / while protecting the environment / is sometimes correlated with greater poverty. / However, those correlations don’t prove cause and effect. / The only previous study analyzing <strong>[xxx]</strong>, / based on an area in Mexico / that had <strong>[xxx]</strong> CCTs, / supported the traditional view. / There, as people got more money, / some of them may have more cleared land / for cattle to raise for meat, / Ferraro says.</p>\n<p>那是因为经济增长可能相关联 / 与环境的 <strong>[xxx]</strong>，/ 而保护环境 / 有时与更大的贫穷相关联。/ 然而，那些关联不能证明原因和结果。/ 之前唯一一项分析 <strong>[xxx]</strong> 的研究，/ 基于墨西哥的一个地区 / 那里已经 <strong>[xxx]</strong> 了CCTs，/ 支持传统观点。/ 在那里，当人们得到更多钱时，/ 他们中的一些人可能有更多清出的土地 / 用于养牛来获得肉类，/ Ferraro说。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>But CCT programs don’t generally consider effects on the environment. In fact, poverty <strong>[xxx]</strong> and environmental protection are often viewed as <strong>[xxx]</strong> goals, says Paul Ferraro, an economist at Johns Hopkins University.</p>\n<p>开始精读：</p>\n<p>But CCT programs don’t generally consider / effects on the environment. / In fact, poverty <strong>[xxx]</strong> and environmental protection / are often viewed as <strong>[xxx]</strong> goals, / says Paul Ferraro, / an economist at Johns Hopkins University.</p>\n<p>但是CCT项目通常不考虑 / 对环境的影响。/ 事实上，贫穷 <strong>[xxx]</strong> 与环境保护 / 经常被视为 <strong>[xxx]</strong> 的目标，/ Paul Ferraro说，/ 他是约翰斯·霍普金斯大学的经济学家。</p>\n</blockquote>\n<p>第3段提到贫困与环保目标的关系，第4段先说经济增长和环境变化可能有关联，再用墨西哥居民得到钱、清地养牛的情况说明传统看法。题目问引用研究的作用，要看事例中的变化怎样接回前面的观点。</p>\n<h3>A. economic growth tends to cause environmental degradation</h3>\n<blockquote>\n<p>经济增长往往造成环境退化。</p>\n</blockquote>\n<p>把A接回题干，它说的是：墨西哥研究用来说明经济增长倾向于带来环境退化。</p>\n<p>A的 economic growth tends to cause 把经济改善连到环境后果，第4段 as people got more money 后面正写居民清地养牛，收入变化和土地变化构成相应的前后联系，所以回看事例末句及它支持traditional view的说明。</p>\n<blockquote>\n<p>The only previous study analyzing <strong>[xxx]</strong>, based on an area in Mexico that had <strong>[xxx]</strong> CCTs, supported the traditional view.</p>\n</blockquote>\n<blockquote>\n<p>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.</p>\n</blockquote>\n<p>事例里的 as people got more money 是收入增加，后面写一些人可能有更多清出的土地来养牛取肉。A的 economic growth tends to cause 同样把经济改善和环境受损接在一起。这里要保留原文程度：some、may并没有证明每次收入增长都必然毁林，前一句也提醒一般关联不能直接证明因果；但本题问研究被拿来说明哪种传统看法，事例支持的是收入增长可能伴随扩大清地的方向，不是宣称普遍必然规律。</p>\n<p><strong>收入增加后扩大清地养牛的例子，是否在支持经济改善可能带来环境损失这一传统看法？</strong></p>\n<p>能。前提是把tends to理解为一种倾向，不当成所有情况下都必然发生；作为引用作用，它与段落提出的经济和环境关系相接。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. cattle rearing has been a major means of <strong>[xxx]</strong> for the poor</h3>\n<blockquote>\n<p>养牛一直是贫困者的一种主要 <strong>[xxx]</strong> 方式。</p>\n</blockquote>\n<p>把B接回题干，它说的是：这项研究主要用来证明贫困者一直靠养牛作为主要的某种方式。</p>\n<p>B的 has been a major means 要说明长期主要方式，第4段 as people got more money 则把养牛放在得到更多钱之后；两处都涉及养牛，所以回看收入变化后清地养牛的完整句子。</p>\n<blockquote>\n<p>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.</p>\n</blockquote>\n<p>原文的 as people got more money 是情形变化的起点，接着只有some of them may说明一部分人的可能反应。B的 has been a major means 却将养牛写成贫困者长期的主要方式：major把一部分可能行为放大为主要地位，has been又将得到钱以后可能扩地的过程改成长期状况。即使 <strong>[xxx]</strong> 暂时不懂，这两处限定也已经不同。</p>\n<p><strong>一些人得到钱后可能多清地养牛，能证明养牛一直是贫困者的主要方式吗？</strong></p>\n<p>不能。原句讲局部人群在收入变化后的可能行为，B却要求长期且主要的地位，范围和时间都扩大了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. CCT programs have helped preserve traditional lifestyles</h3>\n<blockquote>\n<p>CCT项目已经帮助保留传统生活方式。</p>\n</blockquote>\n<p>把C接回题干，它说的是：引用墨西哥研究是为了说明CCT保持了当地传统生活方式。</p>\n<p>C的 preserve traditional lifestyles 和第4段 supported the traditional view 都有traditional，但一个修饰生活方式，一个修饰观点，因此回到研究支持什么的句子，再看末句行为变化。</p>\n<blockquote>\n<p>The only previous study analyzing <strong>[xxx]</strong>, based on an area in Mexico that had <strong>[xxx]</strong> CCTs, supported the traditional view.</p>\n</blockquote>\n<blockquote>\n<p>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.</p>\n</blockquote>\n<p>原文的 supported the traditional view 说研究结果支持前面关于经济和环境的传统看法，不是给传统生活方式提供帮助。C的 preserve traditional lifestyles 把被支持的对象从观点换成生活方式，又把得到更多钱后可能增加清地的变化写成保持原来的生活；traditional在两处修饰的中心词不同。</p>\n<p><strong>研究支持传统观点，等于项目保留传统生活方式吗？</strong></p>\n<p>不等于。view是对关系的看法，lifestyles是人的生活安排；原文还写了收入和用地变化，不能将support转换成preserve生活方式。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. antipoverty efforts require the participation of local farmers</h3>\n<blockquote>\n<p>扶贫工作需要当地农民参与。</p>\n</blockquote>\n<p>把D接回题干，它说的是：墨西哥研究用来说明当地农民参与是扶贫工作的必要条件。</p>\n<p>D的 require the participation 说项目需要居民参与，第4段 some of them may 也提到当地人做什么，所以回看居民得到钱后清地的句子，确认行为发生在项目效果还是成立条件的位置。</p>\n<blockquote>\n<p>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.</p>\n</blockquote>\n<p>原文的 some of them may 写一部分人获得更多钱以后的可能反应，句子以as people got more money引出变化。D的 require the participation 却说农民参与是扶贫所必需的前提，把项目影响到的人及其后续行动改成了项目实施条件；may所说的可能也不能支持require的必要性。</p>\n<p><strong>得到钱后可能发生的居民行为，能转换成扶贫项目必需的参与条件吗？</strong></p>\n<p>不能。原句在解释钱带来什么变化，D在规定项目先需要什么，前提与后果倒换，而且把可能变成了必须。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>27题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D排除。</li>\n</ul>\n<p>A与收入增加、清地养牛所支持的经济与环境关系相接。B把局部可能行为写成长期主要方式，C误接traditional的对象，D把项目之后的反应改成项目之前的必要条件。</p>\n<blockquote>\n<p><strong>27题选A。</strong></p>\n</blockquote>\n<h2>28题</h2>\n<blockquote>\n<p>In his study about Indonesia, Ferraro intends to find out ______.<br>在关于印度尼西亚的研究中，Ferraro打算弄清什么？</p>\n</blockquote>\n<p>题干给出 Indonesia 和 Ferraro，并问 intends to find out。第5段的 Ferraro wanted to see 正好写研究意图，直接回到第5段把这句话及前后背景读全。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Such programs do not have to negatively affect the environment, though. Ferraro wanted to see if Indonesia’s poverty-alleviation program was affecting deforestation. Indonesia has the third-largest area of <strong>[xxx]</strong> forest in the world and one of the highest deforestation rates.</p>\n<p>开始精读：</p>\n<p>Such programs do not have to / negatively affect the environment, though. / Ferraro wanted to see / if Indonesia’s poverty-alleviation program was affecting deforestation. / Indonesia has the third-largest area / of <strong>[xxx]</strong> forest in the world / and one of the highest deforestation rates.</p>\n<p>不过，这样的项目不一定要 / 对环境造成负面影响。/ Ferraro想看看 / 印度尼西亚的扶贫项目是否正在影响森林砍伐。/ 印度尼西亚拥有第三大的面积 / 就世界上 <strong>[xxx]</strong> 森林来说 / 而且有最高的森林砍伐率之一。</p>\n</blockquote>\n<p>wanted to see之后的if引出他要研究的问题：印度尼西亚的扶贫项目是否影响森林砍伐。随后关于森林面积和砍伐率的介绍说明为什么在这个国家考察这种关系。</p>\n<h3>A. its acceptance level of CCTs</h3>\n<blockquote>\n<p>它对CCT的接受程度。</p>\n</blockquote>\n<p>把A接回题干，它说的是：Ferraro要研究印度尼西亚接受CCT的程度。</p>\n<p>A的 acceptance level 问居民或国家接受项目多少，第5段 was affecting deforestation 问项目影响森林砍伐与否；两处都以CCT为中心，因此回到wanted to see引出的研究问题。</p>\n<blockquote>\n<p>Ferraro wanted to see if Indonesia’s poverty-alleviation program was affecting deforestation.</p>\n</blockquote>\n<p>原文的 was affecting deforestation 把扶贫项目放在可能施加影响的一端，把森林砍伐放在受到影响的一端。A的 acceptance level 则把项目变成被接受的对象，研究对象从森林变化换成接受态度或程度。研究项目有没有环境影响，并不是调查人们是否愿意接受项目。</p>\n<p><strong>项目是否影响森林砍伐，和人们多大程度接受项目，是同一个研究问题吗？</strong></p>\n<p>不是。原句的作用方向从项目到森林，A改成接受者对项目的态度，研究对象已经不同。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. its annual rate of poverty <strong>[xxx]</strong></h3>\n<blockquote>\n<p>它每年的贫穷 <strong>[xxx]</strong> 率。</p>\n</blockquote>\n<p>把B接回题干，它说的是：Ferraro打算测量印度尼西亚每年的某种贫穷变化率。</p>\n<p>B的 annual rate of poverty 关注贫穷的年度数值，原句 affecting deforestation 关注扶贫项目对森林砍伐的影响，二者都可能与扶贫项目有关，所以回到wanted to see后实际提出的问题。</p>\n<blockquote>\n<p>Ferraro wanted to see if Indonesia’s poverty-alleviation program was affecting deforestation.</p>\n</blockquote>\n<p>原文的 affecting deforestation 已把要考察的结果明确写成森林砍伐。B的 annual rate of poverty 则把结果换成贫穷的某种年度比率。poverty-alleviation在原句修饰program，说明是什么项目，并不是把poverty本身设为研究指标；<strong>[xxx]</strong> 只能补贫穷方面的变化，不能把poverty换回deforestation。</p>\n<p><strong>扶贫是项目名称的一部分，能因此把研究结果改成贫穷的年度变化率吗？</strong></p>\n<p>不能。原句用扶贫项目来解释森林变化，B把项目的类别当成结果指标，且增加了年度比率这一测量方式。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. the role of its forests in climate change</h3>\n<blockquote>\n<p>它的森林在气候变化中的作用。</p>\n</blockquote>\n<p>把C接回题干，它说的是：Ferraro想知道印度尼西亚森林对气候变化有什么作用。</p>\n<p>C的 climate change 要接森林对气候的影响，而原句 poverty-alleviation program 指对森林施加影响的项目；两处都涉及森林的作用关系，所以回看wanted to see的主语、动作和对象。</p>\n<blockquote>\n<p>Ferraro wanted to see if Indonesia’s poverty-alleviation program was affecting deforestation.</p>\n</blockquote>\n<p>原文以 poverty-alleviation program 为影响的起点，研究其是否影响森林砍伐。C的 climate change 则让森林成为影响的起点，气候成为结果。森林虽在两种说法中都出现，前者问“项目到森林”，后者问“森林到气候”，具体两端已经不同；后一句介绍森林面积也没有把研究目的改成后一条关系。</p>\n<p><strong>研究项目对森林的影响，等于研究森林对气候的作用吗？</strong></p>\n<p>不等于。C把中间共同出现的森林换了位置，还另加气候作为结果，未保留原句要研究的两个对象。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. the relation of CCTs to its forest loss</h3>\n<blockquote>\n<p>CCT与它的森林损失之间的关系。</p>\n</blockquote>\n<p>把D接回题干，它说的是：Ferraro要考察CCT与印度尼西亚森林损失是否有关。</p>\n<p>D的 forest loss 是森林损失，与第5段 affecting deforestation 所说影响砍伐相连；森林被砍伐会成为森林损失，因此回到wanted to see后的整句，确认关系的另一端。</p>\n<blockquote>\n<p>Ferraro wanted to see if Indonesia’s poverty-alleviation program was affecting deforestation.</p>\n</blockquote>\n<p>原文的 affecting deforestation 问项目是否影响森林砍伐，D的 forest loss 概括了砍伐所涉及的森林损失。关系的另一端仍是CCT，也就是原句Indonesia’s poverty-alleviation program。D没有换成项目接受程度、贫困比率或森林对气候的作用，两端和研究是否相联系的动作都能对上。</p>\n<p><strong>扶贫项目是否影响森林砍伐，能概括为CCT与森林损失的关系吗？</strong></p>\n<p>能。一个是可能起作用的项目，另一个是被考察的森林变化，D保留了这两个对象及两者间的联系。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>28题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>D保留了扶贫项目与森林损失这两端。A改成对项目的接受程度，B改成贫困比率，C改成森林对气候的作用。</p>\n<blockquote>\n<p><strong>28题选D。</strong></p>\n</blockquote>\n<h2>29题</h2>\n<blockquote>\n<p>According to Ferraro, the CCT program in Indonesia is most valuable in that ______.<br>根据Ferraro，印度尼西亚的CCT项目最有价值的是哪一点？</p>\n</blockquote>\n<p>题干的 Ferraro 和 most valuable 要我们找他对价值的判断。末段以 Ferraro says 引出the value和program costs的比较，因此回到第8段完整读完，连同前面的推广可能一起看。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Whether this research translates elsewhere is anybody’s guess. Ferraro suggests the results may transfer to other parts of Asia, due to <strong>[xxx]</strong> such as the importance of growing rice and market access. And regardless of <strong>[xxx]</strong>, the study shows that what’s good for people may also be good for the environment. Even if this program didn’t reduce poverty, Ferraro says, “the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.”</p>\n<p>开始精读：</p>\n<p>Whether this research translates elsewhere / is anybody’s guess. / Ferraro suggests / the results may transfer to other parts of Asia, / due to <strong>[xxx]</strong> / such as the importance of growing rice and market access. / And regardless of <strong>[xxx]</strong>, / the study shows / that what’s good for people / may also be good for the environment. / Even if this program didn’t reduce poverty, / Ferraro says, / “the value of the avoided deforestation / just for carbon dioxide emissions alone / is more than the program costs.”</p>\n<p>这项研究能否移用于别处 / 谁都说不准。/ Ferraro提出 / 结果可能移用于亚洲其他地区，/ 由于 <strong>[xxx]</strong> / 例如种植水稻的重要性和市场准入。/ 而且不管 <strong>[xxx]</strong>，/ 这项研究表明 / 对人有好处的事 / 也可能对环境有好处。/ 即使这个项目没有减少贫穷，/ Ferraro说，/ “避免砍伐森林的价值 / 单就二氧化碳排放而言 / 就超过这个项目的成本。”</p>\n</blockquote>\n<p>末段先说研究能否推广还不确定，再说对人好的事也可能对环境好，最后即使不减贫，单就避免砍伐所涉及的二氧化碳排放而言，价值也超过成本。题目问most valuable，要比较选项是否接住这个价值。</p>\n<h3>A. it will benefit other Asian countries</h3>\n<blockquote>\n<p>它将使亚洲其他国家受益。</p>\n</blockquote>\n<p>把A接回题干，它说的是：这一项目最有价值的是必将让亚洲其他国家受益。</p>\n<p>A的 will benefit 说未来确定受益，第8段 may transfer 说研究结果可能移用到亚洲其他地区，两处都谈向外推广，所以回看段首关于推广的两句。</p>\n<blockquote>\n<p>Whether this research translates elsewhere is anybody’s guess.</p>\n</blockquote>\n<blockquote>\n<p>Ferraro suggests the results may transfer to other parts of Asia, due to <strong>[xxx]</strong> such as the importance of growing rice and market access.</p>\n</blockquote>\n<p>原文先说能否移用于别处谁都说不准，再用 may transfer 表达一种可能。A的 will benefit 却把可能移用的研究结果，改成其他国家将确定受益的项目效果。移用结果尚不能确定，更不能把可能移用直接升级为必然受益；题干还问已讨论的最重要价值，A把它放到未确定的外部地区。</p>\n<p><strong>研究结果可能移用，能说成其他亚洲国家必将从项目中受益吗？</strong></p>\n<p>不能。may与开头的不确定提醒共同限定了程度，A的will去掉了这个限制，把可能性写成确定结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. it will reduce regional inequality</h3>\n<blockquote>\n<p>它将减少区域不平等。</p>\n</blockquote>\n<p>把B接回题干，它说的是：项目最有价值的是能够缩小地区之间的不平等。</p>\n<p>B的 regional inequality 说地区之间的差距，第8段 what’s good for people 说对人的好处，两者都涉及福利，因此回到研究总结及even if让步的两句，看作者实际比较什么。</p>\n<blockquote>\n<p>And regardless of <strong>[xxx]</strong>, the study shows that what’s good for people may also be good for the environment.</p>\n</blockquote>\n<blockquote>\n<p>Even if this program didn’t reduce poverty, Ferraro says, “the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.”</p>\n</blockquote>\n<p>原文的 what’s good for people 与good for the environment并列，讨论人的利益和环境利益可以一致；最后还明确即使没有减贫，环境方面的价值也超过成本。B的 regional inequality 却把两类利益的联系换成地区之间的分配差距。贫困与地区间不平等不是同一指标，even if这句独立评价的是避免砍伐的价值，并非比较哪一个地区得到更多。</p>\n<p><strong>人与环境两方面的好处，能改写成地区之间差距缩小吗？</strong></p>\n<p>不能。原文比较的是利益类别和项目成本，B比较不同地区的分配结果，替换了比较对象。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. it can <strong>[xxx]</strong> grain production</h3>\n<blockquote>\n<p>它能够对粮食生产做 <strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把C接回题干，它说的是：CCT最有价值的是能够使粮食生产发生某种 <strong>[xxx]</strong>。</p>\n<p>C的 grain production 提到粮食生产，粗读第7段留下了种水稻这个碎片，rice就是水稻，粮食与水稻在这里相连，所以先把第7段整段读完，再看现金究竟怎样与收成联系。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>That’s likely because the rural poor are using the money as <strong>[xxx]</strong> insurance policies against <strong>[xxx]</strong> weather, Ferraro says. Typically, if rains are delayed, people may clear land to plant more rice to <strong>[xxx]</strong> their harvests. With the CCTs, individuals instead can use the money to supplement their harvests.</p>\n<p>开始精读：</p>\n<p>That’s likely because the rural poor / are using the money / as <strong>[xxx]</strong> insurance policies / against <strong>[xxx]</strong> weather, Ferraro says. / Typically, if rains are delayed, / people may clear land to plant more rice / to <strong>[xxx]</strong> their harvests. / With the CCTs, individuals instead can use the money / to supplement their harvests.</p>\n<p>那很可能是因为农村贫困人口 / 正在使用这笔钱 / 作为 <strong>[xxx]</strong> 的保险安排 / 针对 <strong>[xxx]</strong> 的天气，Ferraro说。/ 通常，如果降雨推迟，/ 人们可能清理土地来种更多水稻 / 来 <strong>[xxx]</strong> 他们的收成。/ 有了CCTs，个人反而可以使用这笔钱 / 来补充他们的收成。</p>\n</blockquote>\n<p>回到C提到的粮食生产。刚读的第7段分别写降雨推迟时清地种稻，以及有现金后改用钱补充收成，下面把这两种做法摆在一起。</p>\n<blockquote>\n<p>Typically, if rains are delayed, people may clear land to plant more rice to <strong>[xxx]</strong> their harvests.</p>\n</blockquote>\n<blockquote>\n<p>With the CCTs, individuals instead can use the money to supplement their harvests.</p>\n</blockquote>\n<p>原文的 plant more rice 发生在降雨推迟后，人们可能通过清地多种水稻来处理收成问题；有了CCT，instead写他们可以改用钱补充收成。C的 grain production 与这组水稻、收成事实确有联系，但 <strong>[xxx]</strong> 没有读明，不能判断它究竟声称怎样改变粮食生产。现金替代清地多种，并不等于收成完全不受影响，也不能将未知动词擅自当成“增加”或“减少”。</p>\n<p><strong>知道现金能补充收成，就足以判断C究竟主张怎样改变粮食生产吗？</strong></p>\n<p>还不能。收成与资金的联系已经读到，但C的核心动作不懂，现有内容不能把这种粮食方面的作用一概否定。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. it can protect the environment</h3>\n<blockquote>\n<p>它能够保护环境。</p>\n</blockquote>\n<p>把D接回题干，它说的是：这一项目最有价值的是能够保护环境。</p>\n<p>D的 protect the environment 是保护环境，第8段 avoided deforestation 指本来可能发生但被避免的森林砍伐，少砍森林就是环境方面的好处，因此回到Ferraro最后直接谈价值的整句。</p>\n<blockquote>\n<p>Even if this program didn’t reduce poverty, Ferraro says, “the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.”</p>\n</blockquote>\n<p>原文的 avoided deforestation 是减少森林砍伐造成的环境利益，Ferraro甚至说单就二氧化碳排放这一方面，其价值就超过项目成本。D的 protect the environment 概括这一利益，与even if并列的贫困效果不同：即使不靠减贫来证明价值，避免砍伐也足以超过成本。题干问最有价值处，D正好接到这条明确的价值比较。</p>\n<p><strong>仅避免砍伐带来的环境价值就超过成本，能支持项目的环保价值吗？</strong></p>\n<p>能。原句既点出环境结果，又把它与成本比较，D对应的不是随手提到的相关现象，而是Ferraro直接评价价值的内容。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>29题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D保留。</li>\n</ul>\n<p>D对应避免砍伐的价值超过成本。C说对粮食生产的某种作用，核心动作不懂，而刚读的现金与收成确有联系，因此先留C、D。A把可能推广变成确定受益，B换成地区间分配差距。</p>\n<blockquote>\n<p><strong>29题暂时留下C和D。</strong></p>\n</blockquote>\n<h2>30题</h2>\n<p><strong>What is the text centered on?</strong></p>\n<p>本文围绕什么展开？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>The debates over a program.</strong></p>\n<p>关于一个项目的争论。</p>\n<p>B. <strong>The effects of a program.</strong></p>\n<p>一个项目的效果。</p>\n<p>C. <strong>The transferability of a study.</strong></p>\n<p>一项研究的可推广性。</p>\n<p>D. <strong>The process of a study.</strong></p>\n<p>一项研究的过程。</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Ferraro analyzed satellite data showing annual forest loss from 2008 to 2012— including during Indonesia’s phase-in of the antipoverty program—in 7,468 <strong>[xxx]</strong> villages across 15 provinces. “We see that the program is associated with a 30 percent reduction in deforestation,” Ferraro says.</p>\n<p>开始精读：</p>\n<p>Ferraro analyzed satellite data / showing annual forest loss from 2008 to 2012 / — including during Indonesia’s phase-in of the antipoverty program— / in 7,468 <strong>[xxx]</strong> villages across 15 provinces. / “We see that the program is associated / with a 30 percent reduction in deforestation,” / Ferraro says.</p>\n<p>Ferraro分析了卫星数据 / 显示从2008年到2012年每年的森林损失 / ——包括印度尼西亚逐步引入扶贫项目期间—— / 在跨15个省的7,468个 <strong>[xxx]</strong> 村庄里。/ “我们看到这个项目相关联 / 与森林砍伐减少30%，”/ Ferraro说。</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>从印尼砍伐速度连续放慢引出扶贫项目的可能作用。</td>\n<td>先摆出变化并提出可能原因</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍现金援助的做法、减贫目的以及儿童方面的效果。</td>\n<td>再说具体做法与已有好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>转出通常未考虑环境影响及两目标之间的看法。</td>\n<td>接着说以往忽略了另一面</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>解释传统看法及墨西哥居民得钱后清地养牛的情况。</td>\n<td>再补一个背景和已有例子</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>转回印尼，提出项目是否影响森林砍伐的考察。</td>\n<td>但是又说结果不必总如此</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>给出卫星数据与砍伐减少百分之三十的关联结果。</td>\n<td>接着摆出另一处的实际结果</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>解释现金如何替代降雨推迟时清地多种水稻。</td>\n<td>回头解释这种结果怎样发生</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>限制推广结论并总结对人与环境的好处及价值。</td>\n<td>最后说适用限度和所得好处</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>What is the text centered on?</strong></p>\n<h3>A. The debates over a program.</h3>\n<p>关于一个项目的争论。</p>\n<h4>如果 A 是主旨，文章8段应该怎么写？</h4>\n<p>如果A是中心，每段的展开就应围绕这一点。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先摆出引发争论的项目变化。</td>\n<td>先摆出变化并提出可能原因</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>介绍项目及支持方已有理由。</td>\n<td>再说具体做法与已有好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>呈现另一方反对的意见。</td>\n<td>接着说以往忽略了另一面</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用背景和例子展开双方争论。</td>\n<td>再补一个背景和已有例子</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>说明一方怎样反驳另一方。</td>\n<td>但是又说结果不必总如此</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>继续给出对争议双方立场的比较。</td>\n<td>接着摆出另一处的实际结果</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>解释争论为什么持续发生。</td>\n<td>回头解释这种结果怎样发生</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最后评价双方意见并作出取舍。</td>\n<td>最后说适用限度和所得好处</td>\n</tr>\n</tbody></table>\n<p>A的debates需要文章持续呈现关于项目的争论者、双方意见或交锋。文中确实提到常见看法，也用墨西哥与印尼形成不同结果，但这些是在建立研究问题并展示项目可能产生不同环境效果。第6、7段提供结果和解释，第8段评价价值，没有回到争论双方逐一回应。把背景中的传统看法当成整篇争论，会漏掉文章主要在说明实际产生什么结果。</p>\n<p><strong>传统看法与新结果不一样，就能把全文写成围绕项目的争论吗？</strong></p>\n<p>不能。不同看法在这里帮助提出效果问题，后续篇幅用于结果、解释和价值，没有形成持续的双方争论。</p>\n<p><strong>判断：A排除。</strong></p>\n<hr>\n<p><strong>What is the text centered on?</strong></p>\n<h3>B. The effects of a program.</h3>\n<p>一个项目的效果。</p>\n<h4>如果 B 是主旨，文章8段应该怎么写？</h4>\n<p>如果B是中心，每段的展开就应围绕这一点。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先用明显变化引出项目可能产生的效果。</td>\n<td>先摆出变化并提出可能原因</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明原定减贫目标与已知生活效果。</td>\n<td>再说具体做法与已有好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>转出项目另一个常被忽略的环境方面。</td>\n<td>接着说以往忽略了另一面</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用背景和前例说明可能出现不利效果。</td>\n<td>再补一个背景和已有例子</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>提出在新地点考察是否也有这种效果。</td>\n<td>但是又说结果不必总如此</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>给出实际观察到的森林变化。</td>\n<td>接着摆出另一处的实际结果</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>解释产生有利变化的可能办法。</td>\n<td>回头解释这种结果怎样发生</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>讨论效果能否推广以及其总体价值。</td>\n<td>最后说适用限度和所得好处</td>\n</tr>\n</tbody></table>\n<p>B的effects能够同时容纳减贫、儿童成长以及森林砍伐这些结果。文章开头就把砍伐放慢与扶贫项目联系，第2段交代项目通常要改善贫困生活，第3至5段追問它是否对环境不利，第6段给出减少砍伐的发现，第7段解释现金为什么可能代替清地，第8段再说结果的推广限度和环境价值。研究是弄清效果的途径，推广性只是结果出现后的一项讨论，整条行文持续围绕项目对人和环境产生什么影响。</p>\n<p><strong>减贫目的、森林结果、形成原因及最后的价值，能否都纳入项目的效果？</strong></p>\n<p>能。各段从已知效果转到额外环境效果，再说明其机制和意义，B保留了贯穿全文的考察对象。</p>\n<p><strong>判断：B保留。</strong></p>\n<hr>\n<p><strong>What is the text centered on?</strong></p>\n<h3>C. The transferability of a study.</h3>\n<p>一项研究的可推广性。</p>\n<h4>如果 C 是主旨，文章8段应该怎么写？</h4>\n<p>如果C是中心，每段的展开就应围绕这一点。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先从一个地方的变化引出向外移用问题。</td>\n<td>先摆出变化并提出可能原因</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>交代项目在各地使用的情况。</td>\n<td>再说具体做法与已有好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>提出跨地区移用时的环境差别。</td>\n<td>接着说以往忽略了另一面</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>用已有地区比较哪些条件适合推广。</td>\n<td>再补一个背景和已有例子</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>再选择一个新地点测试推广条件。</td>\n<td>但是又说结果不必总如此</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>报告该地是否满足相同条件。</td>\n<td>接着摆出另一处的实际结果</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>解释哪些条件决定可推广性。</td>\n<td>回头解释这种结果怎样发生</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最后对推广范围与限制作总体判断。</td>\n<td>最后说适用限度和所得好处</td>\n</tr>\n</tbody></table>\n<p>C的transferability正好碰到第8段开头的elsewhere和other parts of Asia。但是前面大部分篇幅问的不是研究能否移用到别处，而是印尼扶贫项目对森林有什么效果、为什么有这种效果。最后说推广尚不确定之后，还继续强调人和环境可能共同受益及环保价值。可推广性是已经得到结果后的限制性讨论，不能倒过来覆盖前面的项目目的、研究发现和机制解释。</p>\n<p><strong>末段才提出的能否推广，是否一直是前七段围绕的中心问题？</strong></p>\n<p>不是。前面先要弄清项目产生什么结果，末段才顺带限定这些结果能否用于别处，C缩小了全文范围。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>What is the text centered on?</strong></p>\n<h3>D. The process of a study.</h3>\n<p>一项研究的过程。</p>\n<h4>如果 D 是主旨，文章8段应该怎么写？</h4>\n<p>如果D是中心，每段的展开就应围绕这一点。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先交代研究从某项变化开始。</td>\n<td>先摆出变化并提出可能原因</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明被研究项目作为研究准备。</td>\n<td>再说具体做法与已有好处</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>提出研究前面对的理论问题。</td>\n<td>接着说以往忽略了另一面</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>介绍已有研究怎样帮助形成步骤。</td>\n<td>再补一个背景和已有例子</td>\n</tr>\n<tr>\n<td>第5段</td>\n<td>确立研究地点和具体研究问题。</td>\n<td>但是又说结果不必总如此</td>\n</tr>\n<tr>\n<td>第6段</td>\n<td>详细交代研究如何收集并处理资料。</td>\n<td>接着摆出另一处的实际结果</td>\n</tr>\n<tr>\n<td>第7段</td>\n<td>继续说明检验解释所用的操作步骤。</td>\n<td>回头解释这种结果怎样发生</td>\n</tr>\n<tr>\n<td>第8段</td>\n<td>最后交代研究完成的程序及下一步。</td>\n<td>最后说适用限度和所得好处</td>\n</tr>\n</tbody></table>\n<p>D的process会把重点放在研究怎样逐步开展。第5段说研究意图，第6段提卫星数据与时间地点，确实交代了一点过程；但第6段随即给出砍伐减少的结果，第7段讲的是现金如何影响人们的用地选择，不是研究人员又进行了哪一步操作，第8段评价的是效果的价值。过程只占为发现提供依据的少量文字，并未持续组织全文。</p>\n<p><strong>文章详细展开的是研究人员的操作步骤，还是项目对生活与环境产生的结果？</strong></p>\n<p>后者。数据和研究方式为结果作依据，后面解释的是项目影响的原因和价值，D把支撑信息提升成了中心。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<h3>30题结论</h3>\n<p><strong>30. B. The effects of a program.</strong></p>\n<p>全文追问扶贫项目除了原定减贫目标，还会给环境带来什么效果；通过印尼的森林结果与可能机制说明对人好的项目也可能对环境好，并讨论这种效果的适用范围和价值。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>The effects of a program. / 一个项目的效果。</strong></p>\n<hr>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查29题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>C. it can <strong>[xxx]</strong> grain production</li>\n<li>D. it can protect the environment</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>The effects of a program.</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>一个项目的效果。</p>\n</blockquote>\n<p>第一遍C和D没完全拉开，是因为D已经对应末段避免砍伐的价值，而C中怎样影响粮食生产的动作没有读清；第7段又确实说了降雨、水稻、收成和现金，不能因为不懂这个动词就把它当成与文章毫无关系。我们先把题干和两个选项接起来。C说项目最有价值之处在于对粮食生产产生某种作用，D说最有价值之处在于保护环境。它们不是在比较文章有没有提到粮食和环境，而是在回答Ferraro为何如此评价这个项目。现在拿主旨来检查。全文围绕项目的效果，尤其从原定改善贫困生活转向考察森林方面的效果。C所联系的水稻和收成处在解释这种效果的环节：降雨推迟时原本可能清地多种，有了现金则可以补充收成，因此不必用扩大清地来应对困难。粮食在这里解释人们为什么改变用地选择，C的未知动作却没有说明一种能够独立承担“最有价值”评价的生产结果；不能把这个词自动补成作者没有明确说出的最大粮食收益。D则接住全文新考察的环境效果，末段又在即使没有减贫的假设下，直接说明避免砍伐的二氧化碳排放价值超过成本。回到第一遍的原句，avoided deforestation已经是D的具体事实，more than the program costs又给出价值比较。全文的效果方向和这句直接评价都支持D；C只有与中间收成说明的联系，尚不能把解释环节变成题干所问的最高价值。</p>\n<blockquote>\n<p><strong>29题选D。</strong></p>\n</blockquote>\n<hr>\n<h2>最终答案：</h2>\n<p><strong>26. C</strong></p>\n<p><strong>27. A</strong></p>\n<p><strong>28. D</strong></p>\n<p><strong>29. D</strong></p>\n<p><strong>30. B</strong></p>\n","analysisStartIndex":42,"maskInventory":{"token":"[xxx]","count":130},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vo
