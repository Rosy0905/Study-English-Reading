全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The payments increase grain output by encouraging additional rice cultivation.\u003c/p>\n\u003cp>现金通过鼓励多种水稻来增加粮食产量。\u003c/p>\n\u003c/blockquote>\n\u003cp>第7段恰恰是用现金补足收成，替代清地扩种。现金抵御歉收风险与粮食增产不是一回事；把项目外的常见应对办法算到项目效果上，方向便反了。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认项目效果值得评价，不能单独决定哪一项最有价值；应以费拉罗的价值比较为准，保留推广范围及效果方向的限制。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>it can boost grain production\u003cbr>它能够提高粮食产量\u003c/p>\n\u003c/blockquote>\n\u003cp>项目提供的是替代扩种的现金缓冲，并非更多粮食的生产机制。减少家庭因歉收而遭受的经济冲击，不等于作物产量提高；反而是不再为扩种多清林地，才接上第8段森林保护与减排价值的评价。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：解释现金如何替代降雨推迟时清地多种水稻。限制推广结论并总结对人与环境的好处及价值。\u003c/p>\n\u003cp>本项最终仍要根据“carbon dioxide emissions alone”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. it can protect the environment\u003c/h3>\n\u003cblockquote>\n\u003cp>它能够保护环境\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 protect the environment 是保护环境，第8段 avoided deforestation 指本来可能发生但被避免的森林砍伐，少砍森林就是环境方面的好处，因此回到Ferraro最后直接谈价值的整句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文的 avoided deforestation 是减少森林砍伐造成的环境利益，Ferraro甚至说单就二氧化碳排放这一方面，其价值就超过项目成本。D的 protect the environment 概括这一利益，与even if并列的贫困效果不同：即使不靠减贫来证明价值，避免砍伐也足以超过成本。题干问最有价值处，D正好接到这条明确的价值比较。\u003c/p>\n\u003cp>原句既点出环境结果，又把它与成本比较，D对应的不是随手提到的相关现象，而是Ferraro直接评价价值的内容。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗认为印尼CCT项目最有价值之处在于它能够保护环境。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 protect the environment 是保护环境，第8段 avoided deforestation 指本来可能发生但被避免的森林砍伐，少砍森林就是环境方面的好处，因此回到Ferraro最后直接谈价值的整句。\u003c/p>\n\u003cp>原文的 avoided deforestation 是减少森林砍伐造成的环境利益，Ferraro甚至说单就二氧化碳排放这一方面，其价值就超过项目成本。D的 protect the environment 概括这一利益，与even if并列的贫困效果不同：即使不靠减贫来证明价值，避免砍伐也足以超过成本。题干问最有价值处，D正好接到这条明确的价值比较。\u003c/p>\n\u003cp>原句既点出环境结果，又把它与成本比较，D对应的不是随手提到的相关现象，而是Ferraro直接评价价值的内容。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第7、8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003cp>现金可让家庭在收成不佳时不必多清林地，第8段进一步说，即便不计算减贫，单是避免砍伐的减排价值也超过成本；同时限制了向别处推广的把握。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：解释现金如何替代降雨推迟时清地多种水稻。限制推广结论并总结对人与环境的好处及价值。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The program protects forests, and its avoided carbon emissions alone can justify its cost.\u003c/p>\n\u003cp>项目保护森林，仅避免砍伐的减排价值就足以超过成本。\u003c/p>\n\u003c/blockquote>\n\u003cp>这与even if、alone、more than costs构成同一比较：暂不算扶贫收益，生态一项已很有价值。它没有否认项目的减贫作用，也没有把效益无限推广。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认项目效果值得评价，不能单独决定哪一项最有价值；应以费拉罗的价值比较为准，保留推广范围及效果方向的限制。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>it can protect the environment\u003cbr>它能够保护环境\u003c/p>\n\u003c/blockquote>\n\u003cp>原句既点出环境结果，又把它与成本比较，D对应的不是随手提到的相关现象，而是Ferraro直接评价价值的内容。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：解释现金如何替代降雨推迟时清地多种水稻。限制推广结论并总结对人与环境的好处及价值。\u003c/p>\n\u003cp>本项最终仍要根据“carbon dioxide emissions alone”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>29题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>29. D. it can protect the environment\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文不确定能推广到哪里，不能保证其他亚洲国家必然受益。\u003c/p>\n\u003cp>B：前面的减贫目标不能替代末段最突出的环境价值比较。\u003c/p>\n\u003cp>C：现金补足收成替代清地扩种，并不等于项目提高粮食产量。\u003c/p>\n\u003cp>D：仅避免砍伐的减排价值就超过成本，直接支持环保价值。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：现象与假设\u003c/strong>（段落1引入） 印度尼西亚森林砍伐率连续三年放缓 → 可能原因：该国的反贫困项目\u003c/p>\n\u003cp>↓（项目介绍）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：CCT项目的本质与成效\u003c/strong>（段落2项目说明） 项目概况：【2007年开始实施 → 有条件现金转移（要求：孩子上学 + 定期医疗）→ 目的：减少不平等 + 打破贫困循环】→ 成效：提供食物和药品，减少儿童生长问题\u003c/p>\n\u003cp>↓（传统观点）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：扶贫与环保的传统矛盾\u003c/strong>（段落3-4传统认知） 普遍问题：CCT项目通常不考虑环境影响 → 传统观点：【扶贫与环保相互冲突：（经济增长↔环境退化）+（环境保护↔更严重贫困）】→ 墨西哥案例：（人们获得更多钱 → 清理土地养牛）\u003c/p>\n\u003cp>//（研究转折）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：印度尼西亚的特殊发现\u003c/strong>（段落5-6研究发现） 研究背景：印度尼西亚拥有世界第三大热带森林 + 最高森林砍伐率之一 → 费拉罗的研究：【分析2008-2012年卫星数据（7468个村庄，15个省）】→ 发现：CCT项目与森林砍伐减少30%相关\u003c/p>\n\u003cp>↓（机制解释）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：作用机制与价值评估\u003c/strong>（段落7-8解释与评价） 作用机制：农村贫困人口将现金作为应对恶劣天气的保险（降雨延迟时不必清理土地种稻）→ 可转移性：可能适用于亚洲其他地区（共同点：种稻重要性 + 市场准入）→ 核心价值：【对人有益的也可能对环境有益 + 避免森林砍伐的价值超过项目成本】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：印度尼西亚的CCT反贫困项目不仅达到了扶贫目标，还意外地减少了森林砍伐，证明了扶贫与环保可以实现双赢，挑战了两者必然冲突的传统观点。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Making Farmers Produce More Rice\u003c/p>\n\u003cp>B. When Extra Income Encourages More Clearing\u003c/p>\n\u003cp>C. Cash as a Buffer against a Bad Harvest\u003c/p>\n\u003cp>D. An Association Still Needs an Explanation\u003c/p>\n\u003cp>E. Ending Poverty in Every Country\u003c/p>\n\u003cp>F. Testing the Boundaries of a Promising Result\u003c/p>\n\u003cp>G. Separating a Program’s Purpose from Its Conditions\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A cash-transfer program can require families to keep children in school or attend health checks. These requirements describe what recipients must do; they should not be confused with the program’s larger purpose. The money is intended to ease severe poverty and help prevent disadvantage from passing to the next generation. Education and health conditions support that aim by linking immediate assistance to children’s future prospects. A rise in school attendance may therefore be evidence that one part is working, without turning the whole program into a reform of the education system.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>More money does not necessarily leave a forest untouched. A household may spend additional income on cattle, and a larger herd may create demand for more grazing land. Where that land is obtained by clearing trees, a financial gain can be accompanied by an environmental loss. A Mexican case discussed in poverty research illustrates this possibility. Its importance is not that cattle farming defines the lives of all poor people. It reveals one route by which a policy designed to improve livelihoods can place new pressure on the surrounding landscape.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>In a rice-growing village, late rain can put a family’s expected harvest at risk. Clearing an additional plot may seem like a way to recover the missing income, even though it costs the village more forest. A regular cash payment offers another response. The family can use the money to cover part of the shortfall instead of expanding the cultivated area. In this account, the environmental benefit does not depend on producing more rice. It arises because financial support makes a damaging response to an uncertain harvest less necessary.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>Satellite records can reveal whether forest loss slowed after a payment program reached a village. They cannot, by themselves, explain every choice made by the people living there. A change in crop prices or a separate conservation measure might also affect clearing. Researchers therefore need to ask whether the timing, comparisons and household evidence support the proposed link. An observed association is a starting point for this investigation, not a reason to abandon it. The strongest account connects the measured change in trees with a plausible change in decisions on the ground.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>A useful result in one setting is an invitation to compare, not a guarantee of success elsewhere. Cash may replace forest clearing where families can buy what a poor harvest fails to provide. It may work differently where markets are inaccessible or new income makes land-intensive activities more attractive. These limits do not erase the benefit already observed. They indicate which circumstances should be examined before extending the policy. Even a carefully bounded environmental gain can matter: avoiding some clearing may add substantial value to assistance originally designed for people.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】G. Separating a Program’s Purpose from Its Conditions\u003c/p>\n\u003cblockquote>\n\u003cp>区分项目目的与领取条件\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分用领取条件、减贫目标和就学结果的区分，防止将政策手段误当制度改革目的。\u003c/p>\n\u003cp>先看上学与检查被放在哪个位置：\u003c/p>\n\u003cblockquote>\n\u003cp>what recipients must do\u003c/p>\n\u003c/blockquote>\n\u003cp>这些是受助家庭需要履行的领取条件，不是政府正在改革哪些制度。首句的require明确了行为要求。\u003c/p>\n\u003cp>然后确认现金项目的较大目标：\u003c/p>\n\u003cblockquote>\n\u003cp>ease severe poverty and help prevent disadvantage from passing to the next generation\u003c/p>\n\u003c/blockquote>\n\u003cp>目标同时包含当下减贫与阻止代际贫困延续；教育和健康条件服务于儿童未来，因此能支持该目标。\u003c/p>\n\u003cp>结尾再用一个可能结果检验区分：\u003c/p>\n\u003cblockquote>\n\u003cp>without turning the whole program into a reform of the education system\u003c/p>\n\u003c/blockquote>\n\u003cp>上学率改善可以说明一个环节奏效，却不能将整个项目改称教育体系改革。目的、条件和观察结果仍是三种角色。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>列领取现金的条件 → 说明项目的减贫目标 → 解释条件怎样支持目标 → 就学效果不等于教育制度改革\u003c/p>\n\u003c/blockquote>\n\u003cp>Purpose对应ease severe poverty及代际改善，Conditions对应上学和健康检查要求。Separating概括作者反复辨别的逻辑层次，而不是把两者割裂为毫无关系。\u003c/p>\n\u003cp>再看最强干扰项E：Ending Poverty in Every Country。\u003c/p>\n\u003cp>Ending Poverty in Every Country虽然也有poverty，却把目标扩大为各国彻底消除贫困。原段说ease并讨论条件怎样服务于目标，没有全球覆盖或完全消除的承诺，也不以推广范围为中心。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】B. When Extra Income Encourages More Clearing\u003c/p>\n\u003cblockquote>\n\u003cp>收入增加可能促使更多清地\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分沿收入增加、购牛、牧地需求和清树的链条，说明经济改善可能伴随环境代价。\u003c/p>\n\u003cp>开头先否定哪种自动推论：\u003c/p>\n\u003cblockquote>\n\u003cp>does not necessarily leave a forest untouched\u003c/p>\n\u003c/blockquote>\n\u003cp>收入上升不保证森林完全不受影响；not necessarily给的是风险可能性，并非所有项目必然毁林。\u003c/p>\n\u003cp>中间把风险拆成具体行为链：\u003c/p>\n\u003cblockquote>\n\u003cp>a larger herd may create demand for more grazing land\u003c/p>\n\u003c/blockquote>\n\u003cp>额外收入可以买牛，牛群变大会增加牧地需要；只有当土地靠砍树取得时，才出现下句的环境损失。\u003c/p>\n\u003cp>结尾明确墨西哥案例要说明什么：\u003c/p>\n\u003cblockquote>\n\u003cp>one route by which a policy designed to improve livelihoods can place new pressure\u003c/p>\n\u003c/blockquote>\n\u003cp>one route把结论限定为一种机制。案例证明的是经济改善可能增加环境压力，而非描述穷人的统一生活方式。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>更多现金未必保住森林 → 购牛增多带来牧地需求 → 清地使经济收益伴随环境损失 → 案例说明扶贫的潜在环境代价\u003c/p>\n\u003c/blockquote>\n\u003cp>Extra Income对应additional income与financial gain，More Clearing对应为牧地clearing trees。When保留条件性：收入怎样花、土地怎样来都影响结果，没有把二者写成无条件必然关系。\u003c/p>\n\u003cp>再看最强干扰项A：Making Farmers Produce More Rice。\u003c/p>\n\u003cp>让农民多种水稻也把现金与农业联系起来，但本段的产品是cattle，土地用途是grazing，结论关注清林压力。它既没有增加水稻产量的方案，也不是在推荐扩大农业生产。\u003c/p>\n\u003cp>\u003cstrong>42题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】C. Cash as a Buffer against a Bad Harvest\u003c/p>\n\u003cblockquote>\n\u003cp>现金充当歉收时的缓冲\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释现金怎样替代歉收时的清地扩种，使保护森林来自财务缓冲而非粮食增产。\u003c/p>\n\u003cp>先确认家庭面临的是哪种冲击：\u003c/p>\n\u003cblockquote>\n\u003cp>late rain can put a family’s expected harvest at risk\u003c/p>\n\u003c/blockquote>\n\u003cp>降雨推迟使预期收成不稳，后面的清新地是家庭可能采取的补收入办法，不是项目已经带来的效果。\u003c/p>\n\u003cp>现金出现后改变了哪一步：\u003c/p>\n\u003cblockquote>\n\u003cp>cover part of the shortfall instead of expanding the cultivated area\u003c/p>\n\u003c/blockquote>\n\u003cp>instead of把现金补缺口与扩大耕地设为替代关系。土地不必继续扩张，才可能减少森林损失。\u003c/p>\n\u003cp>结尾用否定排除一个误解：\u003c/p>\n\u003cblockquote>\n\u003cp>does not depend on producing more rice\u003c/p>\n\u003c/blockquote>\n\u003cp>环保收益并不依赖增产，而是依赖家庭少作破坏性应对。financial support与less necessary共同说明缓冲的作用。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>降雨不稳威胁收成 → 清地扩种可能补收入 → 现金成为另一种补缺口办法 → 少清地来自风险缓冲而非增产\u003c/p>\n\u003c/blockquote>\n\u003cp>Bad Harvest对应expected harvest at risk与shortfall，Buffer对应cover part和降低破坏性应对的必要。Cash准确标出替代清地的工具，标题因此涵盖冲击、手段和行为改变。\u003c/p>\n\u003cp>再看最强干扰项A：Making Farmers Produce More Rice。\u003c/p>\n\u003cp>Making Farmers Produce More Rice会被rice和扩种吸引，但原段明确否定环境收益依赖更多水稻。扩种是现金可能替代的办法，不是现金项目要鼓励的产出目标，这正是段中instead of划出的区别。\u003c/p>\n\u003cp>\u003cstrong>43题选C。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】D. An Association Still Needs an Explanation\u003c/p>\n\u003cblockquote>\n\u003cp>关联仍需解释\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分承认卫星资料能显示关联，同时要求用比较、时序和家庭行为解释原因。\u003c/p>\n\u003cp>先分清卫星资料能看到与看不到的内容：\u003c/p>\n\u003cblockquote>\n\u003cp>cannot, by themselves, explain every choice\u003c/p>\n\u003c/blockquote>\n\u003cp>图像能显示森林损失的变化，但by themselves限制其解释家庭决策的能力，不能看到树变少就直接锁定原因。\u003c/p>\n\u003cp>随后列出需要排查的其他影响：\u003c/p>\n\u003cblockquote>\n\u003cp>A change in crop prices or a separate conservation measure\u003c/p>\n\u003c/blockquote>\n\u003cp>作物价格与另一项保护措施也可能改变清地行为，因此后文要求时间、比较对象和家庭证据共同支持现金项目的联系。\u003c/p>\n\u003cp>结尾提出更强解释应连接哪两端：\u003c/p>\n\u003cblockquote>\n\u003cp>the measured change in trees with a plausible change in decisions\u003c/p>\n\u003c/blockquote>\n\u003cp>一端是已测量的森林变化，一端是可能且有证据的决策变化。关联是研究起点，而不是既可直接定因果、又不必继续调查的终点。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>卫星记录显示变化 → 单独不能解释选择 → 排查价格和其他政策等影响 → 用时序、比较与家庭行为支撑机制\u003c/p>\n\u003c/blockquote>\n\u003cp>Association对应forest loss与项目到村时间的共同变化；Needs an Explanation对应问决策为何改变及检验其他因素。标题保留观测的价值，同时强调解释工作还没完成。\u003c/p>\n\u003cp>再看最强干扰项C：Cash as a Buffer against a Bad Harvest。\u003c/p>\n\u003cp>Cash as a Buffer提供了一种可能机制，却不能概括本段对证据的整体检验。这里没有具体的降雨或歉收情境，重点是包括现金缓冲在内的任何解释都应接受时间、对照与替代因素的核查。\u003c/p>\n\u003cp>\u003cstrong>44题选D。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】F. Testing the Boundaries of a Promising Result\u003c/p>\n\u003cblockquote>\n\u003cp>检验积极结果的适用边界\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分说明市场与收入用途会限制结果外推，同时保留已发生环境收益的价值。\u003c/p>\n\u003cp>开头直接规定如何看待一个地区的成功：\u003c/p>\n\u003cblockquote>\n\u003cp>an invitation to compare, not a guarantee of success elsewhere\u003c/p>\n\u003c/blockquote>\n\u003cp>可以据此去比较其他地方，但不能直接保证别处成功。后面整段都在展开需要比较的背景条件。\u003c/p>\n\u003cp>再看哪些条件可能改变效果：\u003c/p>\n\u003cblockquote>\n\u003cp>markets are inaccessible or new income makes land-intensive activities more attractive\u003c/p>\n\u003c/blockquote>\n\u003cp>如果买不到补偿歉收的商品，现金未必替代扩种；若收入鼓励占地活动，也可能反而增加压力，两个条件解释为何不可机械推广。\u003c/p>\n\u003cp>结尾为什么没有因此否定项目：\u003c/p>\n\u003cblockquote>\n\u003cp>These limits do not erase the benefit already observed\u003c/p>\n\u003c/blockquote>\n\u003cp>适用限制只约束外推，并不抹去已观察收益。末句继续肯定即使有边界的森林收益，也能给原来扶贫的援助增值。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>当地成功不保证处处成功 → 比较市场和新增收入用途 → 先核查条件再推广 → 有限范围的环境收益仍有价值\u003c/p>\n\u003c/blockquote>\n\u003cp>Promising Result对应已观察到的environmental gain，Boundaries对应不同市场与土地利用条件，Testing对应extending之前应examine的工作。三个部分合起来是谨慎推广并保留价值。\u003c/p>\n\u003cp>再看最强干扰项E：Ending Poverty in Every Country。\u003c/p>\n\u003cp>在所有国家消除贫困把适用范围扩大成全球，把环境附加收益又换成彻底脱贫。段首恰恰拒绝success elsewhere的保证，结尾也只说some clearing，标题中的绝对程度两处都得不到支持。\u003c/p>\n\u003cp>\u003cstrong>45题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>Programs that increase poor families’ incomes are usually judged by what they do for people. Their effects on nearby forests may receive less attention. One familiar concern is that a household with more money can afford to expand farming. Under that view, a gain in income may be followed by additional clearing.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>One explanation begins with a late rainy season. A rice-growing household may fear that its harvest will not cover its needs and respond by opening another plot. That response can turn a weather-related income shock into forest loss. The key question is whether the household has another way to meet the shortfall.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Access to such exchange cannot be assumed everywhere. If markets are difficult to reach, or if cash makes a land-intensive activity more profitable, the same payment may lead to another decision. Researchers should therefore compare local conditions before projecting the Indonesian result abroad. These qualifications limit the reach of the finding, not the value of the benefit where it occurs.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>That concern has a concrete form when extra cash is used to buy cattle. A larger herd needs somewhere to graze, and clearing trees can supply the land. Evidence from a Mexican setting has been used to illustrate this sequence. But one such sequence does not establish what every household will do with a payment.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>In those villages, satellite data allowed researchers to follow annual forest loss across the years when assistance was introduced. The study associated participation in the program with less deforestation. This finding challenged the assumption that extra income must always harm forests. It also created a new task: explaining why fewer trees were cleared.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>Regular cash can provide that alternative. Instead of clearing land for more rice, a family can use the payment to supplement what its harvest supplies. In this sense the money acts as a buffer against uncertainty, rather than as a tool for increasing crop output. The explanation relies on the family being able to obtain what it needs through exchange.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>Different uses of the payment could produce different results. A family might expand its activities, or it might avoid an action previously forced on it by hardship. To discover which response occurs, researchers need to examine a setting where assistance and forest loss can be compared. That question led to a study of Indonesian villages.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>That local benefit can be significant even when assessed on its own. Forest preserved through a poverty program adds an environmental gain to assistance intended for families. A cautious conclusion is therefore stronger than either an automatic conflict or an automatic harmony: support for people can also help nature, but the connection depends on how people can respond.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>从扶贫评价引出收入增长可能增加清地的传统担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用降雨推迟解释歉收为何可能促使清地，并寻找替代办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>由市场条件限制跨地区推广，保留当地收益价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>用现金购牛并清地的机制具体说明担忧，再限制其普遍性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>呈现印尼的森林减少损失结果，并提出行为机制问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>说明现金可替代清地补足需求，同时点出交易条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>由现金用途可能不同提出在印尼检验环境效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>在适用限制内肯定扶贫与环保可以相互支持\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从扶贫评价引出收入增长可能增加清地的传统担忧 → 用现金购牛并清地的机制具体说明担忧，再限制其普遍性 → 由现金用途可能不同提出在印尼检验环境效果 → 呈现印尼的森林减少损失结果，并提出行为机制问题 → 用降雨推迟解释歉收为何可能促使清地，并寻找替代办法 → 说明现金可替代清地补足需求，同时点出交易条件 → 由市场条件限制跨地区推广，保留当地收益价值 → 在适用限制内肯定扶贫与环保可以相互支持\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → G → E → B → F → C → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、G、B、F、C。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → G的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Under that view, a gain in income may be followed by additional clearing.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That concern has a concrete form when extra cash is used to buy cattle.\u003c/p>\n\u003c/blockquote>\n\u003cp>开篇末句是收入增长可能伴随additional clearing；That concern将其概括为一种担忧，再用cash买cattle把抽象关系具体化。不是突然转到养殖常识，而是在说明刚提出的环境风险怎样发生。\u003c/p>\n\u003cp>购牛后需要牧地，清树可以供地，因而形成收入—牛群—土地的连续机制。结尾But随即限制一个地区的这条链不能代表所有家庭，为下一段比较其他现金用途留下入口。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>But one such sequence does not establish what every household will do with a payment.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Different uses of the payment could produce different results.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Different uses of the payment直接回应not…every household will do。必须先呈现并限制一种用途，才有理由追问另一些家庭会扩张活动还是避免被贫困迫出的行为。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从扶贫评价引出收入增长可能增加清地的传统担忧 → 用现金购牛并清地的机制具体说明担忧，再限制其普遍性 → 由现金用途可能不同提出在印尼检验环境效果\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Regular cash can provide that alternative.\u003c/p>\n\u003c/blockquote>\n\u003cp>Regular cash can provide that alternative也谈现金，却要前面先提出一种需要替代的歉收应对办法。开篇只有额外收入可能促使扩种的担忧，没有shortfall或另找办法的问题；直接放入会缺少alternative的具体对象。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → G → E的关系。\u003c/p>\n\u003cp>先看前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>But one such sequence does not establish what every household will do with a payment.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Different uses of the payment could produce different results.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后否认一种清地机制能够代表所有家庭，本段Different uses顺接这一限定，分出扩大活动与避免困境驱动行为两种用途。它不是重复收入一定破坏森林，而是把结论重新变成可检验的问题。\u003c/p>\n\u003cp>作者先提出相反的可能，再说need to examine一个能够比较援助与森林损失的环境，最后落到Indonesian villages。研究地点由要检验的问题引出，避免直接列数据而无研究动机。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>That question led to a study of Indonesian villages.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>In those villages, satellite data allowed researchers to follow annual forest loss across the years when assistance was introduced.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知后段In those villages只能承接刚出现的印尼村庄；接着卫星资料与项目引入时期提供了前段要求的比较。先提出研究目标和地点，再给方法与结果，时间与论证顺序均连贯。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>用现金购牛并清地的机制具体说明担忧，再限制其普遍性 → 由现金用途可能不同提出在印尼检验环境效果 → 呈现印尼的森林减少损失结果，并提出行为机制问题\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One explanation begins with a late rainy season.\u003c/p>\n\u003c/blockquote>\n\u003cp>One explanation begins with a late rainy season已经在解释一个结果，而目前尚未报告印尼的积极发现。它也不引出villages这一后段指代对象，因此不能用提前介绍机制替代研究问题和选址。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → B → F的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>It also created a new task: explaining why fewer trees were cleared.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One explanation begins with a late rainy season.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知前段最后明确提出解释why fewer trees were cleared的新任务，本段One explanation回应任务，并从降雨推迟而不是政策口号切入家庭决策。这里的explanation有刚报告的少清树结果作对象。\u003c/p>\n\u003cp>先写歉收风险，再写家庭可能开新地补收入，将天气冲击与森林损失连接。段尾问有没有another way to meet the shortfall，使解释尚未完成，等待现金怎样改变这一步选择。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The key question is whether the household has another way to meet the shortfall.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Regular cash can provide that alternative.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Regular cash can provide that alternative把现金放到刚提出的替代位置；随后Instead of clearing将前段opening another plot明确替换掉。若没有歉收与清地链，现金缓冲的机制便不完整。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>呈现印尼的森林减少损失结果，并提出行为机制问题 → 用降雨推迟解释歉收为何可能促使清地，并寻找替代办法 → 说明现金可替代清地补足需求，同时点出交易条件\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Access to such exchange cannot be assumed everywhere.\u003c/p>\n\u003c/blockquote>\n\u003cp>Access to such exchange一段直接谈交易渠道的边界，必须先知道家庭靠现金购买所需、用交易替代扩种。当前仅有统计结果及解释任务，exchange尚未引入，提前讲限制会失去限制对象。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成B → F → C的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The key question is whether the household has another way to meet the shortfall.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Regular cash can provide that alternative.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末尾寻找应对shortfall的另一办法，that alternative立即由Regular cash填充。现金替代的是为满足家庭需求而清地扩种，不是替代降雨本身，也不是保证水稻不歉收。\u003c/p>\n\u003cp>Instead of把两种行为严格分开，随后buffer against uncertainty说明现金的保险式作用，并明确rather than增加作物产量。段末提出通过exchange获得所需这一机制成立的条件。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The explanation relies on the family being able to obtain what it needs through exchange.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Access to such exchange cannot be assumed everywhere.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Access to such exchange承接交易条件，再讨论市场难到达或现金鼓励占地活动时的不同选择。从“机制依靠什么”进入“该条件不处处存在”，才能解释推广限制。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>用降雨推迟解释歉收为何可能促使清地，并寻找替代办法 → 说明现金可替代清地补足需求，同时点出交易条件 → 由市场条件限制跨地区推广，保留当地收益价值\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That concern has a concrete form when extra cash is used to buy cattle.\u003c/p>\n\u003c/blockquote>\n\u003cp>That concern及买牛段呈现的是现金刺激新增用地，属于开头的负面机制。这里前段具体寻找歉收扩种的替代办法，它既不回答替代如何发生，结尾也没有为下一段such exchange提供交易条件。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → C → H的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The explanation relies on the family being able to obtain what it needs through exchange.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Access to such exchange cannot be assumed everywhere.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段收束为家庭必须能通过exchange取得物品，本段such exchange原词回接，并用cannot be assumed everywhere把视角从当地机制转到跨地区条件。地区变化为什么重要因而有了具体依据。\u003c/p>\n\u003cp>不可达市场会阻碍现金补需求，盈利的占地活动则可能让家庭选择扩张；两种情况都说明同额付款不一定带来同样决策。段末只限制结论reach，没有抹去当地已经发生的benefit。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>These qualifications limit the reach of the finding, not the value of the benefit where it occurs.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That local benefit can be significant even when assessed on its own.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知末段That local benefit回指本段仍承认的发生地收益，再单独评价它的意义。因此结尾能同时反对必然冲突与自动和谐，保留“有条件地帮助自然”的判断。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明现金可替代清地补足需求，同时点出交易条件 → 由市场条件限制跨地区推广，保留当地收益价值 → 在适用限制内肯定扶贫与环保可以相互支持\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Different uses of the payment could produce different results.\u003c/p>\n\u003c/blockquote>\n\u003cp>Different uses段也强调结果可能不同，但它的任务是从墨西哥例子走向印尼调查，结尾引入研究地点。放到这里会倒退到已完成的研究起点，而且不能像local benefit那样接住末段的收益评价。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>environmental protection\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>环境保护\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>环境保护类：环境保护\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>the conservation of forests\u003c/td>\n\u003ctd>森林保护\u003c/td>\n\u003ctd>环境保护类：生态平衡\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sustainable use of resources\u003c/td>\n\u003ctd>资源的可持续利用\u003c/td>\n\u003ctd>环境保护类：节约资源\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>improved living standards\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>生活水平的提高\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会生活类：生活质量\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>equal educational opportunities\u003c/td>\n\u003ctd>平等的教育机会\u003c/td>\n\u003ctd>教育文化类：学习生活\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>economic security\u003c/td>\n\u003ctd>经济保障\u003c/td>\n\u003ctd>经济消费类：经济收入\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>evidence-based judgement\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>依据证据的判断\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：批判、独立、全局思维\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>an awareness of unintended effects\u003c/td>\n\u003ctd>对意外效果的认识\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a long-term perspective\u003c/td>\n\u003ctd>长远眼光\u003c/td>\n\u003ctd>人生哲理类：延迟满足、具有远见\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A using X to cope with an unexpected difficulty.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示A利用X应对意外困难。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, support for A also brings a benefit to B.\u003c/td>\n\u003ctd>图中对A的支持也给B带来益处。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene highlights a possible connection between X and Y.\u003c/td>\n\u003ctd>这一场景凸显X与Y之间可能存在的联系。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The rate of X has fallen for the third year in a row.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>X的比率已连续第三年下降。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Participation in X is associated with a reduction in Y.\u003c/td>\n\u003ctd>参与X与Y的减少相关。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The value of X alone exceeds the cost of Y.\u003c/td>\n\u003ctd>仅X一项的价值就超过Y的成本。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage examines effects that were not part of a program’s original purpose.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章考察一项计划最初目标以外的效果。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text suggests that progress in X need not come at the expense of Y.\u003c/td>\n\u003ctd>文章指出X的进步不一定要以Y为代价。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue is whether support for X can also contribute to Y.\u003c/td>\n\u003ctd>问题在于对X的支持能否同时促进Y。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":9},{"label":"句内逻辑","index":41},{"label":"长难句手译","index":44},{"label":"第三鸟 · 题目复盘","index":63},{"label":"30题","index":64},{"label":"26题","index":74},{"label":"27题","index":92},{"label":"28题","index":110},{"label":"29题","index":128},{"label":"第四鸟 · 新题型","index":146},{"label":"小标题题","index":146},{"label":"排序题","index":152},{"label":"第五鸟 · 写作积累","index":158}];
const allIndices = [0,1,2,3,4,5,6,7,8,12,16,20,24,28,32,36,40,41,42,43,44,50,56,62,63,64,66,68,70,72,73,74,78,82,86,90,91,92,96,100,104,108,109,110,114,118,122,126,127,128,132,136,140,144,145,146,147,148,149,150,151,152,153,154,155,156,157,158,159];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
 const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
 const top=rightScroll.scrollTop+er.top-sr.top;
 const target=height<=view-2*margin?top+height/2-view/2:top-margin;
 rightScroll.scrollTop=clampScroll(target,rightScroll.scrollHeight-view);
}
function positionRight(st,token,restore){
 guardedSchedule(token,()=>{
  if(isLongSentenceCumulative(st)){
   positionLongSentence(st);
   if(!restore)return;
  }
  if(restore){
   rightScroll.scrollTop=saved.right;
   window.scrollTo(0,saved.win);
   return;
  }
  if(!st.meta.cumulative||st.meta.partIndex===0){rightScroll.scrollTop=0;return;}
  const el=document.getElementById(st.focusId);
  if(!el)return;
  if(isParagraphCumulative(st)){
   // Match the sample: no artificial tail; real content height limits the scroll.
   const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const top=rightScroll.scrollTop+er.top-sr.top;
   rightScroll.scrollTop=clampScroll(top-34,rightScroll.scrollHeight-rightScroll.clientHeight);
   return;
  }
  // A short final layer still needs enough trailing room to bring its heading into view.
  const tail=rightContent.querySelector('.longScrollTail');
  if(tail)tail.style.minHeight=Math.max(420,rightScroll.clientHeight*.9-el.offsetHeight)+'px';
  const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
  const top=rightScroll.scrollTop+er.top-sr.top;
  rightScroll.scrollTop=latestTarget(top,rightScroll.clientHeight,rightScroll.scrollHeight-rightScroll.clientHeight);
 });
}
function render(options={}){
 const token=++renderToken; // stale image and scroll callbacks may never reset a newer step
 document.body.classList.toggle('allMode',all);
 toggleAll.classList.toggle('active',all);
 toggleAll.textContent=all?'返回交互':'显示全部';
 if(all){
  layout.className='layout single';leftPanel.hidden=true;
  rightContent.innerHTML='<div class="fullContent">'+FULL+'</div>';
  hydrateAssets(rightContent);rightScroll.scrollTop=0;
  progress.textContent='全文';
  prev.disabled=next.disabled=reset.disabled=jump.disabled=true;
  return;
 }
 const st=DATA[idx],previous=lastRenderedIdx<0?null:DATA[lastRenderedIdx];
 const sameGroup=previous&&st.meta.cumulative&&previous.meta.cumulative&&st.meta.cumulativeGroup===previous.meta.cumulativeGroup;
 reset.disabled=jump.disabled=false;prev.disabled=idx===0;next.disabled=idx===DATA.length-1;
 progress.textContent=(idx+1)+' / '+DATA.length;
 if(st.context){
  layout.className='layout split';leftPanel.hidden=false;
  renderContext(st.context,token,options.restore===true);
 }else{
  layout.className='layout single';leftPanel.hidden=true;
  leftStage.innerHTML='';delete leftStage.dataset.kind;
 }
 const holder=rightContent.querySelector('.cumulativeParts');
 let kept=false;
 if(sameGroup&&holder&&!options.restore){
  if(st.html.startsWith(previous.html)){
   holder.insertAdjacentHTML('beforeend',st.html.slice(previous.html.length));kept=true;
  }else if(previous.html.startsWith(st.html)){
   while(holder.children.length>st.meta.partIndex+1)holder.lastElementChild.remove();
   kept=true;
  }
 }
 if(!kept){
