目的减贫作用，也没有把效益无限推广。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. it can protect the environment","level":4,"raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> The effects of a program.  \n> 一个项目的效果。\n\n把这个主旨直接代入29题题干：\n\n> 全文主旨只能确认项目效果值得评价，不能单独决定哪一项最有价值；应以费拉罗的价值比较为准，保留推广范围及效果方向的限制。\n\nD实际说的是：\n\n> it can protect the environment  \n> 它能够保护环境\n\n原句既点出环境结果，又把它与成本比较，D对应的不是随手提到的相关现象，而是Ferraro直接评价价值的内容。\n\n从全文推进看，这一处的作用是：解释现金如何替代降雨推迟时清地多种水稻。限制推广结论并总结对人与环境的好处及价值。\n\n本项最终仍要根据“carbon dioxide emissions alone”这处局部原文判断。\n\n**复盘判断：D正确。**","context":{"mode":"image","asset":"questions","focus":[250,2209,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"29","option":"D"},"focusId":"focus-q29-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-D-0\">\u003cblockquote>\n\u003cp>它能够保护环境\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 protect the environment 是保护环境，第8段 avoided deforestation 指本来可能发生但被避免的森林砍伐，少砍森林就是环境方面的好处，因此回到Ferraro最后直接谈价值的整句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文的 avoided deforestation 是减少森林砍伐造成的环境利益，Ferraro甚至说单就二氧化碳排放这一方面，其价值就超过项目成本。D的 protect the environment 概括这一利益，与even if并列的贫困效果不同：即使不靠减贫来证明价值，避免砍伐也足以超过成本。题干问最有价值处，D正好接到这条明确的价值比较。\u003c/p>\n\u003cp>原句既点出环境结果，又把它与成本比较，D对应的不是随手提到的相关现象，而是Ferraro直接评价价值的内容。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗认为印尼CCT项目最有价值之处在于它能够保护环境。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 protect the environment 是保护环境，第8段 avoided deforestation 指本来可能发生但被避免的森林砍伐，少砍森林就是环境方面的好处，因此回到Ferraro最后直接谈价值的整句。\u003c/p>\n\u003cp>原文的 avoided deforestation 是减少森林砍伐造成的环境利益，Ferraro甚至说单就二氧化碳排放这一方面，其价值就超过项目成本。D的 protect the environment 概括这一利益，与even if并列的贫困效果不同：即使不靠减贫来证明价值，避免砍伐也足以超过成本。题干问最有价值处，D正好接到这条明确的价值比较。\u003c/p>\n\u003cp>原句既点出环境结果，又把它与成本比较，D对应的不是随手提到的相关现象，而是Ferraro直接评价价值的内容。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第7、8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003cp>现金可让家庭在收成不佳时不必多清林地，第8段进一步说，即便不计算减贫，单是避免砍伐的减排价值也超过成本；同时限制了向别处推广的把握。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：解释现金如何替代降雨推迟时清地多种水稻。限制推广结论并总结对人与环境的好处及价值。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The program protects forests, and its avoided carbon emissions alone can justify its cost.\u003c/p>\n\u003cp>项目保护森林，仅避免砍伐的减排价值就足以超过成本。\u003c/p>\n\u003c/blockquote>\n\u003cp>这与even if、alone、more than costs构成同一比较：暂不算扶贫收益，生态一项已很有价值。它没有否认项目的减贫作用，也没有把效益无限推广。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认项目效果值得评价，不能单独决定哪一项最有价值；应以费拉罗的价值比较为准，保留推广范围及效果方向的限制。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>it can protect the environment\u003cbr>它能够保护环境\u003c/p>\n\u003c/blockquote>\n\u003cp>原句既点出环境结果，又把它与成本比较，D对应的不是随手提到的相关现象，而是Ferraro直接评价价值的内容。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：解释现金如何替代降雨推迟时清地多种水稻。限制推广结论并总结对人与环境的好处及价值。\u003c/p>\n\u003cp>本项最终仍要根据“carbon dioxide emissions alone”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"29题结论","level":2,"raw":"### 29题结论\n\n> **29. D. it can protect the environment**\n\nA：原文不确定能推广到哪里，不能保证其他亚洲国家必然受益。\n\nB：前面的减贫目标不能替代末段最突出的环境价值比较。\n\nC：现金补足收成替代清地扩种，并不等于项目提高粮食产量。\n\nD：仅避免砍伐的减排价值就超过成本，直接支持环保价值。","context":{"mode":"image","asset":"questions","focus":[250,1774,1800,524],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 2题目"},"meta":{"question":"29","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>29. D. it can protect the environment\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文不确定能推广到哪里，不能保证其他亚洲国家必然受益。\u003c/p>\n\u003cp>B：前面的减贫目标不能替代末段最突出的环境价值比较。\u003c/p>\n\u003cp>C：现金补足收成替代清地扩种，并不等于项目提高粮食产量。\u003c/p>\n\u003cp>D：仅避免砍伐的减排价值就超过成本，直接支持环保价值。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：现象与假设**（段落1引入） 印度尼西亚森林砍伐率连续三年放缓 → 可能原因：该国的反贫困项目\n\n↓（项目介绍）\n\n**逻辑层次2：CCT项目的本质与成效**（段落2项目说明） 项目概况：【2007年开始实施 → 有条件现金转移（要求：孩子上学 + 定期医疗）→ 目的：减少不平等 + 打破贫困循环】→ 成效：提供食物和药品，减少儿童生长问题\n\n↓（传统观点）\n\n**逻辑层次3：扶贫与环保的传统矛盾**（段落3-4传统认知） 普遍问题：CCT项目通常不考虑环境影响 → 传统观点：【扶贫与环保相互冲突：（经济增长↔环境退化）+（环境保护↔更严重贫困）】→ 墨西哥案例：（人们获得更多钱 → 清理土地养牛）\n\n//（研究转折）\n\n**逻辑层次4：印度尼西亚的特殊发现**（段落5-6研究发现） 研究背景：印度尼西亚拥有世界第三大热带森林 + 最高森林砍伐率之一 → 费拉罗的研究：【分析2008-2012年卫星数据（7468个村庄，15个省）】→ 发现：CCT项目与森林砍伐减少30%相关\n\n↓（机制解释）\n\n**逻辑层次5：作用机制与价值评估**（段落7-8解释与评价） 作用机制：农村贫困人口将现金作为应对恶劣天气的保险（降雨延迟时不必清理土地种稻）→ 可转移性：可能适用于亚洲其他地区（共同点：种稻重要性 + 市场准入）→ 核心价值：【对人有益的也可能对环境有益 + 避免森林砍伐的价值超过项目成本】\n\n↑（全文主旨）\n\n全文核心观点：印度尼西亚的CCT反贫困项目不仅达到了扶贫目标，还意外地减少了森林砍伐，证明了扶贫与环保可以实现双赢，挑战了两者必然冲突的传统观点。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：现象与假设\u003c/strong>（段落1引入） 印度尼西亚森林砍伐率连续三年放缓 → 可能原因：该国的反贫困项目\u003c/p>\n\u003cp>↓（项目介绍）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：CCT项目的本质与成效\u003c/strong>（段落2项目说明） 项目概况：【2007年开始实施 → 有条件现金转移（要求：孩子上学 + 定期医疗）→ 目的：减少不平等 + 打破贫困循环】→ 成效：提供食物和药品，减少儿童生长问题\u003c/p>\n\u003cp>↓（传统观点）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：扶贫与环保的传统矛盾\u003c/strong>（段落3-4传统认知） 普遍问题：CCT项目通常不考虑环境影响 → 传统观点：【扶贫与环保相互冲突：（经济增长↔环境退化）+（环境保护↔更严重贫困）】→ 墨西哥案例：（人们获得更多钱 → 清理土地养牛）\u003c/p>\n\u003cp>//（研究转折）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：印度尼西亚的特殊发现\u003c/strong>（段落5-6研究发现） 研究背景：印度尼西亚拥有世界第三大热带森林 + 最高森林砍伐率之一 → 费拉罗的研究：【分析2008-2012年卫星数据（7468个村庄，15个省）】→ 发现：CCT项目与森林砍伐减少30%相关\u003c/p>\n\u003cp>↓（机制解释）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：作用机制与价值评估\u003c/strong>（段落7-8解释与评价） 作用机制：农村贫困人口将现金作为应对恶劣天气的保险（降雨延迟时不必清理土地种稻）→ 可转移性：可能适用于亚洲其他地区（共同点：种稻重要性 + 市场准入）→ 核心价值：【对人有益的也可能对环境有益 + 避免森林砍伐的价值超过项目成本】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：印度尼西亚的CCT反贫困项目不仅达到了扶贫目标，还意外地减少了森林砍伐，证明了扶贫与环保可以实现双赢，挑战了两者必然冲突的传统观点。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n【答案】G. Separating a Program’s Purpose from Its Conditions\n\n> 区分项目目的与领取条件\n\n这一部分用领取条件、减贫目标和就学结果的区分，防止将政策手段误当制度改革目的。\n\n先看上学与检查被放在哪个位置：\n\n> what recipients must do\n\n这些是受助家庭需要履行的领取条件，不是政府正在改革哪些制度。首句的require明确了行为要求。\n\n然后确认现金项目的较大目标：\n\n> ease severe poverty and help prevent disadvantage from passing to the next generation\n\n目标同时包含当下减贫与阻止代际贫困延续；教育和健康条件服务于儿童未来，因此能支持该目标。\n\n结尾再用一个可能结果检验区分：\n\n> without turning the whole program into a reform of the education system\n\n上学率改善可以说明一个环节奏效，却不能将整个项目改称教育体系改革。目的、条件和观察结果仍是三种角色。\n\n这一部分的推进关系是：\n\n> 列领取现金的条件 → 说明项目的减贫目标 → 解释条件怎样支持目标 → 就学效果不等于教育制度改革\n\nPurpose对应ease severe poverty及代际改善，Conditions对应上学和健康检查要求。Separating概括作者反复辨别的逻辑层次，而不是把两者割裂为毫无关系。\n\n再看最强干扰项E：Ending Poverty in Every Country。\n\nEnding Poverty in Every Country虽然也有poverty，却把目标扩大为各国彻底消除贫困。原段说ease并讨论条件怎样服务于目标，没有全球覆盖或完全消除的承诺，也不以推广范围为中心。\n\n**41题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】G. Separating a Program’s Purpose from Its Conditions\u003c/p>\n\u003cblockquote>\n\u003cp>区分项目目的与领取条件\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分用领取条件、减贫目标和就学结果的区分，防止将政策手段误当制度改革目的。\u003c/p>\n\u003cp>先看上学与检查被放在哪个位置：\u003c/p>\n\u003cblockquote>\n\u003cp>what recipients must do\u003c/p>\n\u003c/blockquote>\n\u003cp>这些是受助家庭需要履行的领取条件，不是政府正在改革哪些制度。首句的require明确了行为要求。\u003c/p>\n\u003cp>然后确认现金项目的较大目标：\u003c/p>\n\u003cblockquote>\n\u003cp>ease severe poverty and help prevent disadvantage from passing to the next generation\u003c/p>\n\u003c/blockquote>\n\u003cp>目标同时包含当下减贫与阻止代际贫困延续；教育和健康条件服务于儿童未来，因此能支持该目标。\u003c/p>\n\u003cp>结尾再用一个可能结果检验区分：\u003c/p>\n\u003cblockquote>\n\u003cp>without turning the whole program into a reform of the education system\u003c/p>\n\u003c/blockquote>\n\u003cp>上学率改善可以说明一个环节奏效，却不能将整个项目改称教育体系改革。目的、条件和观察结果仍是三种角色。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>列领取现金的条件 → 说明项目的减贫目标 → 解释条件怎样支持目标 → 就学效果不等于教育制度改革\u003c/p>\n\u003c/blockquote>\n\u003cp>Purpose对应ease severe poverty及代际改善，Conditions对应上学和健康检查要求。Separating概括作者反复辨别的逻辑层次，而不是把两者割裂为毫无关系。\u003c/p>\n\u003cp>再看最强干扰项E：Ending Poverty in Every Country。\u003c/p>\n\u003cp>Ending Poverty in Every Country虽然也有poverty，却把目标扩大为各国彻底消除贫困。原段说ease并讨论条件怎样服务于目标，没有全球覆盖或完全消除的承诺，也不以推广范围为中心。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】B. When Extra Income Encourages More Clearing\n\n> 收入增加可能促使更多清地\n\n这一部分沿收入增加、购牛、牧地需求和清树的链条，说明经济改善可能伴随环境代价。\n\n开头先否定哪种自动推论：\n\n> does not necessarily leave a forest untouched\n\n收入上升不保证森林完全不受影响；not necessarily给的是风险可能性，并非所有项目必然毁林。\n\n中间把风险拆成具体行为链：\n\n> a larger herd may create demand for more grazing land\n\n额外收入可以买牛，牛群变大会增加牧地需要；只有当土地靠砍树取得时，才出现下句的环境损失。\n\n结尾明确墨西哥案例要说明什么：\n\n> one route by which a policy designed to improve livelihoods can place new pressure\n\none route把结论限定为一种机制。案例证明的是经济改善可能增加环境压力，而非描述穷人的统一生活方式。\n\n这一部分的推进关系是：\n\n> 更多现金未必保住森林 → 购牛增多带来牧地需求 → 清地使经济收益伴随环境损失 → 案例说明扶贫的潜在环境代价\n\nExtra Income对应additional income与financial gain，More Clearing对应为牧地clearing trees。When保留条件性：收入怎样花、土地怎样来都影响结果，没有把二者写成无条件必然关系。\n\n再看最强干扰项A：Making Farmers Produce More Rice。\n\n让农民多种水稻也把现金与农业联系起来，但本段的产品是cattle，土地用途是grazing，结论关注清林压力。它既没有增加水稻产量的方案，也不是在推荐扩大农业生产。\n\n**42题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】B. When Extra Income Encourages More Clearing\u003c/p>\n\u003cblockquote>\n\u003cp>收入增加可能促使更多清地\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分沿收入增加、购牛、牧地需求和清树的链条，说明经济改善可能伴随环境代价。\u003c/p>\n\u003cp>开头先否定哪种自动推论：\u003c/p>\n\u003cblockquote>\n\u003cp>does not necessarily leave a forest untouched\u003c/p>\n\u003c/blockquote>\n\u003cp>收入上升不保证森林完全不受影响；not necessarily给的是风险可能性，并非所有项目必然毁林。\u003c/p>\n\u003cp>中间把风险拆成具体行为链：\u003c/p>\n\u003cblockquote>\n\u003cp>a larger herd may create demand for more grazing land\u003c/p>\n\u003c/blockquote>\n\u003cp>额外收入可以买牛，牛群变大会增加牧地需要；只有当土地靠砍树取得时，才出现下句的环境损失。\u003c/p>\n\u003cp>结尾明确墨西哥案例要说明什么：\u003c/p>\n\u003cblockquote>\n\u003cp>one route by which a policy designed to improve livelihoods can place new pressure\u003c/p>\n\u003c/blockquote>\n\u003cp>one route把结论限定为一种机制。案例证明的是经济改善可能增加环境压力，而非描述穷人的统一生活方式。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>更多现金未必保住森林 → 购牛增多带来牧地需求 → 清地使经济收益伴随环境损失 → 案例说明扶贫的潜在环境代价\u003c/p>\n\u003c/blockquote>\n\u003cp>Extra Income对应additional income与financial gain，More Clearing对应为牧地clearing trees。When保留条件性：收入怎样花、土地怎样来都影响结果，没有把二者写成无条件必然关系。\u003c/p>\n\u003cp>再看最强干扰项A：Making Farmers Produce More Rice。\u003c/p>\n\u003cp>让农民多种水稻也把现金与农业联系起来，但本段的产品是cattle，土地用途是grazing，结论关注清林压力。它既没有增加水稻产量的方案，也不是在推荐扩大农业生产。\u003c/p>\n\u003cp>\u003cstrong>42题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n【答案】C. Cash as a Buffer against a Bad Harvest\n\n> 现金充当歉收时的缓冲\n\n这一部分解释现金怎样替代歉收时的清地扩种，使保护森林来自财务缓冲而非粮食增产。\n\n先确认家庭面临的是哪种冲击：\n\n> late rain can put a family’s expected harvest at risk\n\n降雨推迟使预期收成不稳，后面的清新地是家庭可能采取的补收入办法，不是项目已经带来的效果。\n\n现金出现后改变了哪一步：\n\n> cover part of the shortfall instead of expanding the cultivated area\n\ninstead of把现金补缺口与扩大耕地设为替代关系。土地不必继续扩张，才可能减少森林损失。\n\n结尾用否定排除一个误解：\n\n> does not depend on producing more rice\n\n环保收益并不依赖增产，而是依赖家庭少作破坏性应对。financial support与less necessary共同说明缓冲的作用。\n\n这一部分的推进关系是：\n\n> 降雨不稳威胁收成 → 清地扩种可能补收入 → 现金成为另一种补缺口办法 → 少清地来自风险缓冲而非增产\n\nBad Harvest对应expected harvest at risk与shortfall，Buffer对应cover part和降低破坏性应对的必要。Cash准确标出替代清地的工具，标题因此涵盖冲击、手段和行为改变。\n\n再看最强干扰项A：Making Farmers Produce More Rice。\n\nMaking Farmers Produce More Rice会被rice和扩种吸引，但原段明确否定环境收益依赖更多水稻。扩种是现金可能替代的办法，不是现金项目要鼓励的产出目标，这正是段中instead of划出的区别。\n\n**43题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】C. Cash as a Buffer against a Bad Harvest\u003c/p>\n\u003cblockquote>\n\u003cp>现金充当歉收时的缓冲\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释现金怎样替代歉收时的清地扩种，使保护森林来自财务缓冲而非粮食增产。\u003c/p>\n\u003cp>先确认家庭面临的是哪种冲击：\u003c/p>\n\u003cblockquote>\n\u003cp>late rain can put a family’s expected harvest at risk\u003c/p>\n\u003c/blockquote>\n\u003cp>降雨推迟使预期收成不稳，后面的清新地是家庭可能采取的补收入办法，不是项目已经带来的效果。\u003c/p>\n\u003cp>现金出现后改变了哪一步：\u003c/p>\n\u003cblockquote>\n\u003cp>cover part of the shortfall instead of expanding the cultivated area\u003c/p>\n\u003c/blockquote>\n\u003cp>instead of把现金补缺口与扩大耕地设为替代关系。土地不必继续扩张，才可能减少森林损失。\u003c/p>\n\u003cp>结尾用否定排除一个误解：\u003c/p>\n\u003cblockquote>\n\u003cp>does not depend on producing more rice\u003c/p>\n\u003c/blockquote>\n\u003cp>环保收益并不依赖增产，而是依赖家庭少作破坏性应对。financial support与less necessary共同说明缓冲的作用。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>降雨不稳威胁收成 → 清地扩种可能补收入 → 现金成为另一种补缺口办法 → 少清地来自风险缓冲而非增产\u003c/p>\n\u003c/blockquote>\n\u003cp>Bad Harvest对应expected harvest at risk与shortfall，Buffer对应cover part和降低破坏性应对的必要。Cash准确标出替代清地的工具，标题因此涵盖冲击、手段和行为改变。\u003c/p>\n\u003cp>再看最强干扰项A：Making Farmers Produce More Rice。\u003c/p>\n\u003cp>Making Farmers Produce More Rice会被rice和扩种吸引，但原段明确否定环境收益依赖更多水稻。扩种是现金可能替代的办法，不是现金项目要鼓励的产出目标，这正是段中instead of划出的区别。\u003c/p>\n\u003cp>\u003cstrong>43题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】D. An Association Still Needs an Explanation\n\n> 关联仍需解释\n\n这一部分承认卫星资料能显示关联，同时要求用比较、时序和家庭行为解释原因。\n\n先分清卫星资料能看到与看不到的内容：\n\n> cannot, by themselves, explain every choice\n\n图像能显示森林损失的变化，但by themselves限制其解释家庭决策的能力，不能看到树变少就直接锁定原因。\n\n随后列出需要排查的其他影响：\n\n> A change in crop prices or a separate conservation measure\n\n作物价格与另一项保护措施也可能改变清地行为，因此后文要求时间、比较对象和家庭证据共同支持现金项目的联系。\n\n结尾提出更强解释应连接哪两端：\n\n> the measured change in trees with a plausible change in decisions\n\n一端是已测量的森林变化，一端是可能且有证据的决策变化。关联是研究起点，而不是既可直接定因果、又不必继续调查的终点。\n\n这一部分的推进关系是：\n\n> 卫星记录显示变化 → 单独不能解释选择 → 排查价格和其他政策等影响 → 用时序、比较与家庭行为支撑机制\n\nAssociation对应forest loss与项目到村时间的共同变化；Needs an Explanation对应问决策为何改变及检验其他因素。标题保留观测的价值，同时强调解释工作还没完成。\n\n再看最强干扰项C：Cash as a Buffer against a Bad Harvest。\n\nCash as a Buffer提供了一种可能机制，却不能概括本段对证据的整体检验。这里没有具体的降雨或歉收情境，重点是包括现金缓冲在内的任何解释都应接受时间、对照与替代因素的核查。\n\n**44题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】D. An Association Still Needs an Explanation\u003c/p>\n\u003cblockquote>\n\u003cp>关联仍需解释\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分承认卫星资料能显示关联，同时要求用比较、时序和家庭行为解释原因。\u003c/p>\n\u003cp>先分清卫星资料能看到与看不到的内容：\u003c/p>\n\u003cblockquote>\n\u003cp>cannot, by themselves, explain every choice\u003c/p>\n\u003c/blockquote>\n\u003cp>图像能显示森林损失的变化，但by themselves限制其解释家庭决策的能力，不能看到树变少就直接锁定原因。\u003c/p>\n\u003cp>随后列出需要排查的其他影响：\u003c/p>\n\u003cblockquote>\n\u003cp>A change in crop prices or a separate conservation measure\u003c/p>\n\u003c/blockquote>\n\u003cp>作物价格与另一项保护措施也可能改变清地行为，因此后文要求时间、比较对象和家庭证据共同支持现金项目的联系。\u003c/p>\n\u003cp>结尾提出更强解释应连接哪两端：\u003c/p>\n\u003cblockquote>\n\u003cp>the measured change in trees with a plausible change in decisions\u003c/p>\n\u003c/blockquote>\n\u003cp>一端是已测量的森林变化，一端是可能且有证据的决策变化。关联是研究起点，而不是既可直接定因果、又不必继续调查的终点。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>卫星记录显示变化 → 单独不能解释选择 → 排查价格和其他政策等影响 → 用时序、比较与家庭行为支撑机制\u003c/p>\n\u003c/blockquote>\n\u003cp>Association对应forest loss与项目到村时间的共同变化；Needs an Explanation对应问决策为何改变及检验其他因素。标题保留观测的价值，同时强调解释工作还没完成。\u003c/p>\n\u003cp>再看最强干扰项C：Cash as a Buffer against a Bad Harvest。\u003c/p>\n\u003cp>Cash as a Buffer提供了一种可能机制，却不能概括本段对证据的整体检验。这里没有具体的降雨或歉收情境，重点是包括现金缓冲在内的任何解释都应接受时间、对照与替代因素的核查。\u003c/p>\n\u003cp>\u003cstrong>44题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】F. Testing the Boundaries of a Promising Result\n\n> 检验积极结果的适用边界\n\n这一部分说明市场与收入用途会限制结果外推，同时保留已发生环境收益的价值。\n\n开头直接规定如何看待一个地区的成功：\n\n> an invitation to compare, not a guarantee of success elsewhere\n\n可以据此去比较其他地方，但不能直接保证别处成功。后面整段都在展开需要比较的背景条件。\n\n再看哪些条件可能改变效果：\n\n> markets are inaccessible or new income makes land-intensive activities more attractive\n\n如果买不到补偿歉收的商品，现金未必替代扩种；若收入鼓励占地活动，也可能反而增加压力，两个条件解释为何不可机械推广。\n\n结尾为什么没有因此否定项目：\n\n> These limits do not erase the benefit already observed\n\n适用限制只约束外推，并不抹去已观察收益。末句继续肯定即使有边界的森林收益，也能给原来扶贫的援助增值。\n\n这一部分的推进关系是：\n\n> 当地成功不保证处处成功 → 比较市场和新增收入用途 → 先核查条件再推广 → 有限范围的环境收益仍有价值\n\nPromising Result对应已观察到的environmental gain，Boundaries对应不同市场与土地利用条件，Testing对应extending之前应examine的工作。三个部分合起来是谨慎推广并保留价值。\n\n再看最强干扰项E：Ending Poverty in Every Country。\n\n在所有国家消除贫困把适用范围扩大成全球，把环境附加收益又换成彻底脱贫。段首恰恰拒绝success elsewhere的保证，结尾也只说some clearing，标题中的绝对程度两处都得不到支持。\n\n**45题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】F. Testing the Boundaries of a Promising Result\u003c/p>\n\u003cblockquote>\n\u003cp>检验积极结果的适用边界\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分说明市场与收入用途会限制结果外推，同时保留已发生环境收益的价值。\u003c/p>\n\u003cp>开头直接规定如何看待一个地区的成功：\u003c/p>\n\u003cblockquote>\n\u003cp>an invitation to compare, not a guarantee of success elsewhere\u003c/p>\n\u003c/blockquote>\n\u003cp>可以据此去比较其他地方，但不能直接保证别处成功。后面整段都在展开需要比较的背景条件。\u003c/p>\n\u003cp>再看哪些条件可能改变效果：\u003c/p>\n\u003cblockquote>\n\u003cp>markets are inaccessible or new income makes land-intensive activities more attractive\u003c/p>\n\u003c/blockquote>\n\u003cp>如果买不到补偿歉收的商品，现金未必替代扩种；若收入鼓励占地活动，也可能反而增加压力，两个条件解释为何不可机械推广。\u003c/p>\n\u003cp>结尾为什么没有因此否定项目：\u003c/p>\n\u003cblockquote>\n\u003cp>These limits do not erase the benefit already observed\u003c/p>\n\u003c/blockquote>\n\u003cp>适用限制只约束外推，并不抹去已观察收益。末句继续肯定即使有边界的森林收益，也能给原来扶贫的援助增值。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>当地成功不保证处处成功 → 比较市场和新增收入用途 → 先核查条件再推广 → 有限范围的环境收益仍有价值\u003c/p>\n\u003c/blockquote>\n\u003cp>Promising Result对应已观察到的environmental gain，Boundaries对应不同市场与土地利用条件，Testing对应extending之前应examine的工作。三个部分合起来是谨慎推广并保留价值。\u003c/p>\n\u003cp>再看最强干扰项E：Ending Poverty in Every Country。\u003c/p>\n\u003cp>在所有国家消除贫困把适用范围扩大成全球，把环境附加收益又换成彻底脱贫。段首恰恰拒绝success elsewhere的保证，结尾也只说some clearing，标题中的绝对程度两处都得不到支持。\u003c/p>\n\u003cp>\u003cstrong>45题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 从扶贫评价引出收入增长可能增加清地的传统担忧 |\n| B | 用降雨推迟解释歉收为何可能促使清地，并寻找替代办法 |\n| C | 由市场条件限制跨地区推广，保留当地收益价值 |\n| D | 用现金购牛并清地的机制具体说明担忧，再限制其普遍性 |\n| E | 呈现印尼的森林减少损失结果，并提出行为机制问题 |\n| F | 说明现金可替代清地补足需求，同时点出交易条件 |\n| G | 由现金用途可能不同提出在印尼检验环境效果 |\n| H | 在适用限制内肯定扶贫与环保可以相互支持 |\n\n全文推进：\n\n> 从扶贫评价引出收入增长可能增加清地的传统担忧 → 用现金购牛并清地的机制具体说明担忧，再限制其普遍性 → 由现金用途可能不同提出在印尼检验环境效果 → 呈现印尼的森林减少损失结果，并提出行为机制问题 → 用降雨推迟解释歉收为何可能促使清地，并寻找替代办法 → 说明现金可替代清地补足需求，同时点出交易条件 → 由市场条件限制跨地区推广，保留当地收益价值 → 在适用限制内肯定扶贫与环保可以相互支持\n\n完整顺序：\n\n**A → D → G → E → B → F → C → H**\n\n41—45：D、G、B、F、C。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>从扶贫评价引出收入增长可能增加清地的传统担忧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用降雨推迟解释歉收为何可能促使清地，并寻找替代办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>由市场条件限制跨地区推广，保留当地收益价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>用现金购牛并清地的机制具体说明担忧，再限制其普遍性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>呈现印尼的森林减少损失结果，并提出行为机制问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>说明现金可替代清地补足需求，同时点出交易条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>由现金用途可能不同提出在印尼检验环境效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>在适用限制内肯定扶贫与环保可以相互支持\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从扶贫评价引出收入增长可能增加清地的传统担忧 → 用现金购牛并清地的机制具体说明担忧，再限制其普遍性 → 由现金用途可能不同提出在印尼检验环境效果 → 呈现印尼的森林减少损失结果，并提出行为机制问题 → 用降雨推迟解释歉收为何可能促使清地，并寻找替代办法 → 说明现金可替代清地补足需求，同时点出交易条件 → 由市场条件限制跨地区推广，保留当地收益价值 → 在适用限制内肯定扶贫与环保可以相互支持\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → G → E → B → F → C → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、G、B、F、C。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → G的关系。\n\n先看前段A的结尾：\n\n> Under that view, a gain in income may be followed by additional clearing.\n\n再看候选D的开头：\n\n> That concern has a concrete form when extra cash is used to buy cattle.\n\n开篇末句是收入增长可能伴随additional clearing；That concern将其概括为一种担忧，再用cash买cattle把抽象关系具体化。不是突然转到养殖常识，而是在说明刚提出的环境风险怎样发生。\n\n购牛后需要牧地，清树可以供地，因而形成收入—牛群—土地的连续机制。结尾But随即限制一个地区的这条链不能代表所有家庭，为下一段比较其他现金用途留下入口。\n\nD段最终落在：\n\n> But one such sequence does not establish what every household will do with a payment.\n\n后段G的开头是：\n\n> Different uses of the payment could produce different results.\n\n后段Different uses of the payment直接回应not…every household will do。必须先呈现并限制一种用途，才有理由追问另一些家庭会扩张活动还是避免被贫困迫出的行为。\n\n这三段的局部推进是：\n\n> 从扶贫评价引出收入增长可能增加清地的传统担忧 → 用现金购牛并清地的机制具体说明担忧，再限制其普遍性 → 由现金用途可能不同提出在印尼检验环境效果\n\n再检验容易混淆的候选F。它的开头是：\n\n> Regular cash can provide that alternative.\n\nRegular cash can provide that alternative也谈现金，却要前面先提出一种需要替代的歉收应对办法。开篇只有额外收入可能促使扩种的担忧，没有shortfall或另找办法的问题；直接放入会缺少alternative的具体对象。\n\n**41题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → D → G的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Under that view, a gain in income may be followed by additional clearing.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That concern has a concrete form when extra cash is used to buy cattle.\u003c/p>\n\u003c/blockquote>\n\u003cp>开篇末句是收入增长可能伴随additional clearing；That concern将其概括为一种担忧，再用cash买cattle把抽象关系具体化。不是突然转到养殖常识，而是在说明刚提出的环境风险怎样发生。\u003c/p>\n\u003cp>购牛后需要牧地，清树可以供地，因而形成收入—牛群—土地的连续机制。结尾But随即限制一个地区的这条链不能代表所有家庭，为下一段比较其他现金用途留下入口。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>But one such sequence does not establish what every household will do with a payment.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Different uses of the payment could produce different results.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Different uses of the payment直接回应not…every household will do。必须先呈现并限制一种用途，才有理由追问另一些家庭会扩张活动还是避免被贫困迫出的行为。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从扶贫评价引出收入增长可能增加清地的传统担忧 → 用现金购牛并清地的机制具体说明担忧，再限制其普遍性 → 由现金用途可能不同提出在印尼检验环境效果\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Regular cash can provide that alternative.\u003c/p>\n\u003c/blockquote>\n\u003cp>Regular cash can provide that alternative也谈现金，却要前面先提出一种需要替代的歉收应对办法。开篇只有额外收入可能促使扩种的担忧，没有shortfall或另找办法的问题；直接放入会缺少alternative的具体对象。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → G → E的关系。\n\n先看前段D的结尾：\n\n> But one such sequence does not establish what every household will do with a payment.\n\n再看候选G的开头：\n\n> Different uses of the payment could produce different results.\n\n前段最后否认一种清地机制能够代表所有家庭，本段Different uses顺接这一限定，分出扩大活动与避免困境驱动行为两种用途。它不是重复收入一定破坏森林，而是把结论重新变成可检验的问题。\n\n作者先提出相反的可能，再说need to examine一个能够比较援助与森林损失的环境，最后落到Indonesian villages。研究地点由要检验的问题引出，避免直接列数据而无研究动机。\n\nG段最终落在：\n\n> That question led to a study of Indonesian villages.\n\n后段E的开头是：\n\n> In those villages, satellite data allowed researchers to follow annual forest loss across the years when assistance was introduced.\n\n已知后段In those villages只能承接刚出现的印尼村庄；接着卫星资料与项目引入时期提供了前段要求的比较。先提出研究目标和地点，再给方法与结果，时间与论证顺序均连贯。\n\n这三段的局部推进是：\n\n> 用现金购牛并清地的机制具体说明担忧，再限制其普遍性 → 由现金用途可能不同提出在印尼检验环境效果 → 呈现印尼的森林减少损失结果，并提出行为机制问题\n\n再检验容易混淆的候选B。它的开头是：\n\n> One explanation begins with a late rainy season.\n\nOne explanation begins with a late rainy season已经在解释一个结果，而目前尚未报告印尼的积极发现。它也不引出villages这一后段指代对象，因此不能用提前介绍机制替代研究问题和选址。\n\n**42题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成D → G → E的关系。\u003c/p>\n\u003cp>先看前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>But one such sequence does not establish what every household will do with a payment.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Different uses of the payment could produce different results.\u003c/p>\n\u003c/blockquote>\ 出行为机制问题 → 用降雨推迟解释歉收为何可能促使清地，并寻找替代办法 → 说明现金可替代清地补足需求，同时点出交易条件\n\n再检验容易混淆的候选C。它的开头是：\n\n> Access to such exchange cannot be assumed everywhere.\n\nAccess to such exchange一段直接谈交易渠道的边界，必须先知道家庭靠现金购买所需、用交易替代扩种。当前仅有统计结果及解释任务，exchange尚未引入，提前讲限制会失去限制对象。\n\n**43题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → B → F的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>It also created a new task: explaining why fewer trees were cleared.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One explanation begins with a late rainy season.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知前段最后明确提出解释why fewer trees were cleared的新任务，本段One explanation回应任务，并从降雨推迟而不是政策口号切入家庭决策。这里的explanation有刚报告的少清树结果作对象。\u003c/p>\n\u003cp>先写歉收风险，再写家庭可能开新地补收入，将天气冲击与森林损失连接。段尾问有没有another way to meet the shortfall，使解释尚未完成，等待现金怎样改变这一步选择。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The key question is whether the household has another way to meet the shortfall.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Regular cash can provide that alternative.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Regular cash can provide that alternative把现金放到刚提出的替代位置；随后Instead of clearing将前段opening another plot明确替换掉。若没有歉收与清地链，现金缓冲的机制便不完整。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>呈现印尼的森林减少损失结果，并提出行为机制问题 → 用降雨推迟解释歉收为何可能促使清地，并寻找替代办法 → 说明现金可替代清地补足需求，同时点出交易条件\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Access to such exchange cannot be assumed everywhere.\u003c/p>\n\u003c/blockquote>\n\u003cp>Access to such exchange一段直接谈交易渠道的边界，必须先知道家庭靠现金购买所需、用交易替代扩种。当前仅有统计结果及解释任务，exchange尚未引入，提前讲限制会失去限制对象。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成B → F → C的关系。\n\n先看前段B的结尾：\n\n> The key question is whether the household has another way to meet the shortfall.\n\n再看候选F的开头：\n\n> Regular cash can provide that alternative.\n\n前段末尾寻找应对shortfall的另一办法，that alternative立即由Regular cash填充。现金替代的是为满足家庭需求而清地扩种，不是替代降雨本身，也不是保证水稻不歉收。\n\nInstead of把两种行为严格分开，随后buffer against uncertainty说明现金的保险式作用，并明确rather than增加作物产量。段末提出通过exchange获得所需这一机制成立的条件。\n\nF段最终落在：\n\n> The explanation relies on the family being able to obtain what it needs through exchange.\n\n后段C的开头是：\n\n> Access to such exchange cannot be assumed everywhere.\n\n后段Access to such exchange承接交易条件，再讨论市场难到达或现金鼓励占地活动时的不同选择。从“机制依靠什么”进入“该条件不处处存在”，才能解释推广限制。\n\n这三段的局部推进是：\n\n> 用降雨推迟解释歉收为何可能促使清地，并寻找替代办法 → 说明现金可替代清地补足需求，同时点出交易条件 → 由市场条件限制跨地区推广，保留当地收益价值\n\n再检验容易混淆的候选D。它的开头是：\n\n> That concern has a concrete form when extra cash is used to buy cattle.\n\nThat concern及买牛段呈现的是现金刺激新增用地，属于开头的负面机制。这里前段具体寻找歉收扩种的替代办法，它既不回答替代如何发生，结尾也没有为下一段such exchange提供交易条件。\n\n**44题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成B → F → C的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The key question is whether the household has another way to meet the shortfall.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Regular cash can provide that alternative.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末尾寻找应对shortfall的另一办法，that alternative立即由Regular cash填充。现金替代的是为满足家庭需求而清地扩种，不是替代降雨本身，也不是保证水稻不歉收。\u003c/p>\n\u003cp>Instead of把两种行为严格分开，随后buffer against uncertainty说明现金的保险式作用，并明确rather than增加作物产量。段末提出通过exchange获得所需这一机制成立的条件。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The explanation relies on the family being able to obtain what it needs through exchange.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Access to such exchange cannot be assumed everywhere.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Access to such exchange承接交易条件，再讨论市场难到达或现金鼓励占地活动时的不同选择。从“机制依靠什么”进入“该条件不处处存在”，才能解释推广限制。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>用降雨推迟解释歉收为何可能促使清地，并寻找替代办法 → 说明现金可替代清地补足需求，同时点出交易条件 → 由市场条件限制跨地区推广，保留当地收益价值\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That concern has a concrete form when extra cash is used to buy cattle.\u003c/p>\n\u003c/blockquote>\n\u003cp>That concern及买牛段呈现的是现金刺激新增用地，属于开头的负面机制。这里前段具体寻找歉收扩种的替代办法，它既不回答替代如何发生，结尾也没有为下一段such exchange提供交易条件。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → C → H的关系。\n\n先看前段F的结尾：\n\n> The explanation relies on the family being able to obtain what it needs through exchange.\n\n再看候选C的开头：\n\n> Access to such exchange cannot be assumed everywhere.\n\n前段收束为家庭必须能通过exchange取得物品，本段such exchange原词回接，并用cannot be assumed everywhere把视角从当地机制转到跨地区条件。地区变化为什么重要因而有了具体依据。\n\n不可达市场会阻碍现金补需求，盈利的占地活动则可能让家庭选择扩张；两种情况都说明同额付款不一定带来同样决策。段末只限制结论reach，没有抹去当地已经发生的benefit。\n\nC段最终落在：\n\n> These qualifications limit the reach of the finding, not the value of the benefit where it occurs.\n\n后段H的开头是：\n\n> That local benefit can be significant even when assessed on its own.\n\n已知末段That local benefit回指本段仍承认的发生地收益，再单独评价它的意义。因此结尾能同时反对必然冲突与自动和谐，保留“有条件地帮助自然”的判断。\n\n这三段的局部推进是：\n\n> 说明现金可替代清地补足需求，同时点出交易条件 → 由市场条件限制跨地区推广，保留当地收益价值 → 在适用限制内肯定扶贫与环保可以相互支持\n\n再检验容易混淆的候选G。它的开头是：\n\n> Different uses of the payment could produce different results.\n\nDifferent uses段也强调结果可能不同，但它的任务是从墨西哥例子走向印尼调查，结尾引入研究地点。放到这里会倒退到已完成的研究起点，而且不能像local benefit那样接住末段的收益评价。\n\n**45题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → C → H的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The explanation relies on the family being able to obtain what it needs through exchange.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Access to such exchange cannot be assumed everywhere.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段收束为家庭必须能通过exchange取得物品，本段such exchange原词回接，并用cannot be assumed everywhere把视角从当地机制转到跨地区条件。地区变化为什么重要因而有了具体依据。\u003c/p>\n\u003cp>不可达市场会阻碍现金补需求，盈利的占地活动则可能让家庭选择扩张；两种情况都说明同额付款不一定带来同样决策。段末只限制结论reach，没有抹去当地已经发生的benefit。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>These qualifications limit the reach of the finding, not the value of the benefit where it occurs.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That local benefit can be significant even when assessed on its own.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知末段That local benefit回指本段仍承认的发生地收益，再单独评价它的意义。因此结尾能同时反对必然冲突与自动和谐，保留“有条件地帮助自然”的判断。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明现金可替代清地补足需求，同时点出交易条件 → 由市场条件限制跨地区推广，保留当地收益价值 → 在适用限制内肯定扶贫与环保可以相互支持\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Different uses of the payment could produce different results.\u003c/p>\n\u003c/blockquote>\n\u003cp>Different uses段也强调结果可能不同，但它的任务是从墨西哥例子走向印尼调查，结尾引入研究地点。放到这里会倒退到已完成的研究起点，而且不能像local benefit那样接住末段的收益评价。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **environmental protection** | **环境保护** | **环境保护类：环境保护** | **宏观主题** |\n| the conservation of forests | 森林保护 | 环境保护类：生态平衡 | 宏观主题 |\n| sustainable use of resources | 资源的可持续利用 | 环境保护类：节约资源 | 宏观主题 |\n| **improved living standards** | **生活水平的提高** | **社会生活类：生活质量** | **宏观主题** |\n| equal educational opportunities | 平等的教育机会 | 教育文化类：学习生活 | 宏观主题 |\n| economic security | 经济保障 | 经济消费类：经济收入 | 宏观主题 |\n| **evidence-based judgement** | **依据证据的判断** | **人生哲理类：批判、独立、全局思维** | **个人主题** |\n| an awareness of unintended effects | 对意外效果的认识 | 人 、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a long-term perspective\u003c/td>\n\u003ctd>长远眼光\u003c/td>\n\u003ctd>人生哲理类：延迟满足、具有远见\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第五鸟 · 写作积累","title":"2. 大作文第一段描述题目信息时可积累的表达","level":2,"raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画题** | **The picture shows A using X to cope with an unexpected difficulty.** | **图画展示A利用X应对意外困难。** |\n| 图画题 | In the picture, support for A also brings a benefit to B. | 图中对A的支持也给B带来益处。 |\n| 图画题 | The scene highlights a possible connection between X and Y. | 这一场景凸显X与Y之间可能存在的联系。 |\n| **图表题** | **The rate of X has fallen for the third year in a row.** | **X的比率已连续第三年下降。** |\n| 图表题 | Participation in X is associated with a reduction in Y. | 参与X与Y的减少相关。 |\n| 图表题 | The value of X alone exceeds the cost of Y. | 仅X一项的价值就超过Y的成本。 |\n| **文本评论题** | **The passage examines effects that were not part of a program’s original purpose.** | **文章考察一项计划最初目标以外的效果。** |\n| 文本评论题 | The text suggests that progress in X need not come at the expense of Y. | 文章指出X的进步不一定要以Y为代价。 |\n| 文本评论题 | The issue is whether support for X can also contribute to Y. | 问题在于对X的支持能否同时促进Y。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A using X to cope with an unexpected difficulty.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示A利用X应对意外困难。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, support for A also brings a benefit to B.\u003c/td>\n\u003ctd>图中对A的支持也给B带来益处。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene highlights a possible connection between X and Y.\u003c/td>\n\u003ctd>这一场景凸显X与Y之间可能存在的联系。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The rate of X has fallen for the third year in a row.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>X的比率已连续第三年下降。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Participation in X is associated with a reduction in Y.\u003c/td>\n\u003ctd>参与X与Y的减少相关。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The value of X alone exceeds the cost of Y.\u003c/td>\n\u003ctd>仅X一项的价值就超过Y的成本。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage examines effects that were not part of a program’s original purpose.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章考察一项计划最初目标以外的效果。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text suggests that progress in X need not come at the expense of Y.\u003c/td>\n\u003ctd>文章指出X的进步不一定要以Y为代价。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue is whether support for X can also contribute to Y.\u003c/td>\n\u003ctd>问题在于对X的支持能否同时促进Y。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Making Farmers Produce More Rice\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. When Extra Income Encourages More Clearing\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Cash as a Buffer against a Bad Harvest\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. An Association Still Needs an Explanation\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Ending Poverty in Every Country\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Testing the Boundaries of a Promising Result\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Separating a Program’s Purpose from Its Conditions\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>A cash-transfer program can require families to keep children in school or attend health checks. These requirements describe what recipients must do; they should not be confused with the program’s larger purpose. The money is intended to ease severe poverty and help prevent disadvantage from passing to the next generation. Education and health conditions support that aim by linking immediate assistance to children’s future prospects. A rise in school attendance may therefore be evidence that one part is working, without turning the whole program into a reform of the education system.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>More money does not necessarily leave a forest untouched. A household may spend additional income on cattle, and a larger herd may create demand for more grazing land. Where that land is obtained by clearing trees, a financial gain can be accompanied by an environmental loss. A Mexican case discussed in poverty research illustrates this possibility. Its importance is not that cattle farming defines the lives of all poor people. It reveals one route by which a policy designed to improve livelihoods can place new pressure on the surrounding landscape.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>In a rice-growing village, late rain can put a family’s expected harvest at risk. Clearing an additional plot may seem like a way to recover the missing income, even though it costs the village more forest. A regular cash payment offers another response. The family can use the money to cover part of the shortfall instead of expanding the cultivated area. In this account, the environmental benefit does not depend on producing more rice. It arises because financial support makes a damaging response to an uncertain harvest less necessary.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>Satellite records can reveal whether forest loss slowed after a payment program reached a village. They cannot, by themselves, explain every choice made by the people living there. A change in crop prices or a separate conservation measure might also affect clearing. Researchers therefore need to ask whether the timing, comparisons and household evidence support the proposed link. An observed association is a starting point for this investigation, not a reason to abandon it. The strongest account connects the measured change in trees with a plausible change in decisions on the ground.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>A useful result in one setting is an invitation to compare, not a guarantee of success elsewhere. Cash may replace forest clearing where families can buy what a poor harvest fails to provide. It may work differently where markets are inaccessible or new income makes land-intensive activities more attractive. These limits do not erase the benefit already observed. They indicate which circumstances should be examined before extending the policy. Even a carefully bounded environmental gain can matter: avoiding some clearing may add substantial value to assistance originally designed for people.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>Programs that increase poor families’ incomes are usually judged by what they do for people. Their effects on nearby forests may receive less attention. One familiar concern is that a household with more money can afford to expand farming. Under that view, a gain in income may be followed by additional clearing.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>One explanation begins with a late rainy season. A rice-growing household may fear that its harvest will not cover its needs and respond by opening another plot. That response can turn a weather-related income shock into forest loss. The key question is whether the household has another way to meet the shortfall.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>Access to such exchange cannot be assumed everywhere. If markets are difficult to reach, or if cash makes a land-intensive activity more profitable, the same payment may lead to another decision. Researchers should therefore compare local conditions before projecting the Indonesian result abroad. These qualifications limit the reach of the finding, not the value of the benefit where it occurs.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>That concern has a concrete form when extra cash is used to buy cattle. A larger herd needs somewhere to graze, and clearing trees can supply the land. Evidence from a Mexican setting has been used to illustrate this sequence. But one such sequence does not establish what every household will do with a payment.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>In those villages, satellite data allowed researchers to follow annual forest loss across the years when assistance was introduced. The study associated participation in the program with less deforestation. This finding challenged the assumption that extra income must always harm forests. It also created a new task: explaining why fewer trees were cleared.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>Regular cash can provide that alternative. Instead of clearing land for more rice, a family can use the payment to supplement what its harvest supplies. In this sense the money acts as a buffer against uncertainty, rather than as a tool for increasing crop output. The explanation relies on the family being able to obtain what it needs through exchange.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>Different uses of the payment could produce different results. A family might expand its activities, or it might avoid an action previously forced on it by hardship. To discover which response occurs, researchers need to examine a setting where assistance and forest loss can be compared. That question led to a study of Indonesian villages.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>That local benefit can be significant even when assessed on its own. Forest preserved through a poverty program adds an environmental gain to assistance intended for families. A cautious conclusion is therefore stronger than either an automatic conflict or an automatic harmony: support for people can also help nature, but the connection depends on how people can respond.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2021英语一Text 2重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>mark\u003c/td>\n\u003ctd>v.标志着\u003c/td>\n\u003ctd>in a row\u003c/td>\n\u003ctd>phr.连续地\u003c/td>\n\u003ctd>Indo d>\n\u003ctd>typically\u003c/td>\n\u003ctd>adv.通常\u003c/td>\n\u003ctd>if rains are delayed\u003c/td>\n\u003ctd>phr.如果降雨推迟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>clear land\u003c/td>\n\u003ctd>phr.开垦土地\u003c/td>\n\u003ctd>rice\u003c/td>\n\u003ctd>n.水稻\u003c/td>\n\u003ctd>supplement\u003c/td>\n\u003ctd>v.补充\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>harvest\u003c/td>\n\u003ctd>n.收成\u003c/td>\n\u003ctd>individual\u003c/td>\n\u003ctd>n.个人\u003c/td>\n\u003ctd>instead\u003c/td>\n\u003ctd>adv.转而；替代地\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>第8段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>whether\u003c/td>\n\u003ctd>conj.是否\u003c/td>\n\u003ctd>translate elsewhere\u003c/td>\n\u003ctd>phr.在别处同样适用\u003c/td>\n\u003ctd>suggest\u003c/td>\n\u003ctd>v.提出；认为\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>result\u003c/td>\n\u003ctd>n.结果\u003c/td>\n\u003ctd>transfer\u003c/td>\n\u003ctd>v.迁移；推广\u003c/td>\n\u003ctd>Asia\u003c/td>\n\u003ctd>n.亚洲\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>due to\u003c/td>\n\u003ctd>phr.由于\u003c/td>\n\u003ctd>commonality\u003c/td>\n\u003ctd>n.共同点\u003c/td>\n\u003ctd>importance\u003c/td>\n\u003ctd>n.重要性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>market access\u003c/td>\n\u003ctd>n.进入市场的条件\u003c/td>\n\u003ctd>regardless of\u003c/td>\n\u003ctd>phr.不论；不管\u003c/td>\n\u003ctd>transferability\u003c/td>\n\u003ctd>n.可推广性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>environment\u003c/td>\n\u003ctd>n.环境\u003c/td>\n\u003ctd>even if\u003c/td>\n\u003ctd>conj.即使\u003c/td>\n\u003ctd>reduce poverty\u003c/td>\n\u003ctd>phr.减少贫困\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>value\u003c/td>\n\u003ctd>n.价值\u003c/td>\n\u003ctd>avoided deforestation\u003c/td>\n\u003ctd>n.避免的森林砍伐\u003c/td>\n\u003ctd>carbon dioxide emission\u003c/td>\n\u003ctd>n.二氧化碳排放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cost\u003c/td>\n\u003ctd>n.成本\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Last year marked the third year in a row of when Indonesia&#39;s bleak rate of deforestation has slowed in pace. One reason for the turnaround may be the country&#39;s antipoverty program.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Last year marked / the third year in a row / of when Indonesia&#39;s bleak rate of deforestation / has slowed in pace.\u003c/p>\n\u003cp>One reason / for the turnaround / may be / the country&#39;s antipoverty program.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>去年标志着 / 连续第三年 / 印度尼西亚严峻的森林砍伐率 / 放缓了速度。\u003c/p>\n\u003cp>一个原因 / 对于这种转变 / 可能是 / 该国的反贫困项目。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>去年是印度尼西亚严峻的森林砍伐率连续第三年放缓。这种转变的一个原因可能是该国的反贫困项目。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care. Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty. They&#39;re already used in dozens of countries worldwide. In Indonesia, the program has provided enough food and medicine to substantially reduce severe growth problems among children.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>In 2007, / Indonesia started phasing in / a program / that gives money / to its poorest residents / under certain conditions, / such as requiring people / to keep kids in school / or get regular medical care.\u003c/p>\n\u003cp>Called conditional cash transfers or CCTs, / these social assistance programs / are designed / to reduce inequality / and break the cycle of poverty.\u003c/p>\n\u003cp>They&#39;re already used / in dozens of countries / worldwide.\u003c/p>\n\u003cp>In Indonesia, / the program has provided / enough food and medicine / to substantially reduce / severe growth problems / among children.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>在2007年，/ 印度尼西亚开始逐步实施 / 一个项目 / 给予金钱 / 给其最贫困的居民 / 在特定条件下，/ 比如要求人们 / 让孩子继续上学 / 或获得定期医疗护理。\u003c/p>\n\u003cp>被称为有条件现金转移或CCTs，/ 这些社会援助项目 / 被设计 / 来减少不平等 / 并打破贫困循环。\u003c/p>\n\u003cp>它们已经被使用 / 在数十个国家 / 全世界范围内。\u003c/p>\n\u003cp>在印度尼西亚，/ 该项目已经提供了 / 足够的食物和药品 / 来大幅减少 / 严重的生长问题 / 在儿童中。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>2007年，印度尼西亚开始逐步实施一个项目，在特定条件下向最贫困的居民发放现金，比如要求他们让孩子继续上学或获得定期医疗护理。这些被称为有条件现金转移（CCTs）的社会援助项目旨在减少不平等并打破贫困循环。它们已在全球数十个国家使用。在印度尼西亚，该项目已经提供了足够的食物和药品，大幅减少了儿童中的严重生长问题。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>But CCT programs don&#39;t generally consider effects on the environment. In fact, poverty alleviation and environmental protection are often viewed as conflicting goals, says Paul Ferraro, an economist at Johns Hopkins University.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>But CCT programs / don&#39;t generally consider / effects on the environment.\u003c/p>\n\u003cp>In fact, / poverty alleviation and environmental protection / are often viewed / as conflicting goals, / says Paul Ferraro, / an economist / at Johns Hopkins University.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>但CCT项目 / 通常不考虑 / 对环境的影响。\u003c/p>\n\u003cp>事实上，/ 扶贫和环境保护 / 经常被视为 / 相互冲突的目标，/ 保罗·费拉罗说，/ 一位经济学家 / 在约翰霍普金斯大学。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>但CCT项目通常不考虑对环境的影响。约翰霍普金斯大学的经济学家保罗·费拉罗说，事实上，扶贫和环境保护经常被视为相互冲突的目标。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>That&#39;s because economic growth can be correlated with environmental degradation, while protecting the environment is sometimes correlated with greater poverty. However, those correlations don&#39;t prove cause and effect. The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view. There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>That&#39;s because / economic growth / can be correlated / with environmental degradation, / while protecting the environment / is sometimes correlated / with greater poverty.\u003c/p>\n\u003cp>However, / those correlations / don&#39;t prove / cause and effect.\u003c/p>\n\u003cp>The only previous study / analyzing causality, / based on an area in Mexico / that had instituted CCTs, / supported the traditional view.\u003c/p>\n\u003cp>There, / as people got more money, / some of them / may have more cleared land / for cattle / to raise for meat, / Ferraro says.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>那是因为 / 经济增长 / 可能相关 / 与环境退化，/ 而保护环境 / 有时相关 / 与更严重的贫困。\u003c/p>\n\u003cp>然而，/ 这些相关性 / 不能证明 / 因果关系。\u003c/p>\n\u003cp>唯一之前的研究 / 分析因果关系的，/ 基于墨西哥的一个地区 / 已经实施了CCTs的，/ 支持了传统观点。\u003c/p>\n\u003cp>在那里，/ 当人们获得更多钱时，/ 他们中的一些人 / 可能更多地清理土地 / 为了牛 / 来饲养作肉用，/ 费拉罗说。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>那是因为经济增长可能与环境退化相关，而保护环境有时与更严重的贫困相关。然而，这些相关性并不能证明因果关系。唯一一项分析因果关系的先前研究基于墨西哥一个已实施CCTs的地区，支持了传统观点。费拉罗说，在那里，当人们获得更多钱时，他们中的一些人可能会清理更多土地来饲养肉牛。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>Such programs do not have to negatively affect the environment, though. Ferraro wanted to see if Indonesia&#39;s poverty-alleviation program was affecting deforestation. Indonesia has the third-largest area of tropical forest in the world and one of the highest deforestation rates.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>Such programs / do not have to / negatively affect / the environment, / though.\u003c/p>\n\u003cp>Ferraro wanted to see / if Indonesia&#39;s poverty-alleviation program / was affecting / deforestation.\u003c/p>\n\u003cp>Indonesia has / the third-largest area / of tropical forest / in the world / and one of the highest / deforestation rates.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>这些项目 / 不必 / 负面影响 / 环境，/ 然而。\u003c/p>\n\u003cp>费拉罗想要看看 / 印度尼西亚的扶贫项目是否 / 正在影响 / 森林砍伐。\u003c/p>\n\u003cp>印度尼西亚拥有 / 第三大面积 / 热带森林的 / 在世界上 / 以及最高之一 / 森林砍伐率。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>然而，这些项目不一定对环境产生负面影响。费拉罗想要看看印度尼西亚的扶贫项目是否正在影响森林砍伐。印度尼西亚拥有世界第三大热带森林面积和最高的森林砍伐率之一。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Ferraro analyzed satellite data showing annual forest loss from 2008 to 2012—including during Indonesia&#39;s phase-in of the antipoverty program—in 7,468 forested villages across 15 provinces. &quot;We see that the program is associated with a 30 percent reduction in deforestation,&quot; Ferraro says.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Ferraro analyzed / satellite data / showing annual forest loss / from 2008 to 2012— / including during Indonesia&#39;s phase-in / of the antipoverty program— / in 7,468 forested villages / across 15 provinces.\u003c/p>\n\u003cp>&quot;We see / that the program / is associated with / a 30 percent reduction / in deforestation,&quot; / Ferraro says.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>费拉罗分析了 / 卫星数据 / 显示年度森林损失的 / 从2008年到2012年— / 包括在印度尼西亚逐步实施期间 / 反贫困项目的— / 在7468个森林村庄 / 跨越15个省份。\u003c/p>\n\u003cp>&quot;我们看到 / 该项目 / 与...相关 / 30%的减少 / 在森林砍伐方面，&quot; / 费拉罗说。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>\u003cfont style=\"color:black;\">费拉罗分析了2008年至2012年的卫星数据，显示了印度尼西亚实施反贫困项目期间的年度森林损失情况，涵盖了15个省的7，468个森林村庄。\u003c/font>费拉罗说：&quot;我们看到该项目与森林砍伐减少30%相关。&quot;\u003c/p>\n\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>That&#39;s likely because the rural poor are using the money as makeshift insurance policies against inclement weather, Ferraro says. Typically, if rains are delayed, people may clear land to plant more rice to supplement their harvests.\u003c/p>\n\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>That&#39;s likely because / the rural poor / are using the money / as makeshift insurance policies / against inclement weather, / Ferraro says.\u003c/p>\n\u003cp>Typically, / if rains are delayed, / people may clear land / to plant more rice / to supplement their harvests.\u003c/p>\n\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>那可能是因为 / 农村贫困人口 / 正在使用这些钱 / 作为临时保险政策 / 对抗恶劣天气，/ 费拉罗说。\u003c/p>\n\u003cp>通常，/ 如果降雨延迟，/ 人们可能清理土地 / 来种植更多稻米 / 来补充他们的收成。\u003c/p>\n\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>费拉罗说，那可能是因为农村贫困人口正在将这些钱用作应对恶劣天气的临时保险。通常，如果降雨延迟，人们可能会清理土地来种植更多稻米以补充收成。\u003c/p>\n\u003ch3>完整原文 · 第8段\u003c/h3>\n\u003cp>Whether this research translates elsewhere is anybody&#39;s guess. Ferraro suggests the results may transfer to other parts of Asia, due to commonalities such as the importance of growing rice and market access. And regardless of transferability, the study shows that what&#39;s good for people may also be good for the environment. Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003ch3>意群划分 · 第8段\u003c/h3>\n\u003cp>Whether this research / translates elsewhere / is anybody&#39;s guess.\u003c/p>\n\u003cp>Ferraro suggests / the results may transfer / to other parts of Asia, / due to commonalities / such as the importance / of growing rice / and market access.\u003c/p>\n\u003cp>And regardless of transferability, / the study shows / that what&#39;s good for people / may also be good / for the environment.\u003c/p>\n\u003cp>Even if this program / didn&#39;t reduce poverty, / Ferraro says, / &quot;the value of the avoided deforestation / just for carbon dioxide emissions alone / is more than / the program costs.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第8段\u003c/h3>\n\u003cp>这项研究是否 / 适用于其他地方 / 是任何人的猜测。\u003c/p>\n\u003cp>费拉罗建议 / 结果可能转移 / 到亚洲其他地区，/ 由于共同点 / 比如重要性 / 种植水稻的 / 和市场准入。\u003c/p>\n\u003cp>不管可转移性如何，/ 研究表明 / 对人有益的 / 可能也有益 / 对环境。\u003c/p>\n\u003cp>即使这个项目 / 没有减少贫困，/ 费拉罗说，/ &quot;避免的森林砍伐的价值 / 仅就二氧化碳排放而言 / 就超过了 / 项目成本。&quot;\u003c/p>\n\u003ch3>标准译文 · 第8段\u003c/h3>\n\u003cp>这项研究是否适用于其他地方还有待观察。费拉罗建议，由于种植水稻的重要性和市场准入等共同点，结果可能适用于亚洲其他地区。不管可转移性如何，研究表明对人有益的也可能对环境有益。费拉罗说，即使这个项目没有减少贫困，&quot;仅就二氧化碳排放而言，避免的森林砍伐的价值就超过了项目成本。&quot;\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>Last year marked → the third year in a row：(of when Indonesia&#39;s bleak rate of deforestation → has slowed in pace).\u003c/p>\n\u003cp>One reason：(for the turnaround) → may be → the country&#39;s antipoverty program.\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>In 2007 → Indonesia started phasing in → a program：(that gives money → to its poorest residents：(under certain conditions：(such as requiring people → to keep kids in school + get regular medical care))).\u003c/p>\n\u003cp>Called conditional cash transfers or CCTs → these social assistance programs → are designed：(to reduce inequality + break the cycle of poverty).\u003c/p>\n\u003cp>They&#39;re already used：(in dozens of countries：(worldwide)).\u003c/p>\n\u003cp>In Indonesia → the program has provided → enough food and medicine：(to substantially reduce → severe growth problems：(among children)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>But CCT programs → don&#39;t generally consider → effects on the environment.\u003c/p>\n\u003cp>In fact → poverty alleviation and environmental protection → are often viewed：(as conflicting goals) → says Paul Ferraro：(an economist：(at Johns Hopkins University)).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>That&#39;s because → economic growth → can be correlated：(with environmental degradation) // while protecting the environment → is sometimes correlated：(with greater poverty).\u003c/p>\n\u003cp>However → those correlations → don&#39;t prove → cause and effect.\u003c/p>\n\u003cp>The only previous study：(analyzing causality)：(based on an area in Mexico：(that had instituted CCTs)) → supported the traditional view.\u003c/p>\n\u003cp>There → as people got more money → some of them → may have more cleared land：(for cattle：(to raise for meat)) → Ferraro says.\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Such programs → do not have to → negatively affect → the environment // though.\u003c/p>\n\u003cp>Ferraro wanted to see：(if Indonesia&#39;s poverty-alleviation program → was affecting → deforestation).\u003c/p>\n\u003cp>Indonesia has → the third-largest area：(of tropical forest：(in the world)) + one of the highest：(deforestation rates).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Ferraro analyzed → satellite data：(showing annual forest loss：(from 2008 to 2012))：(including during Indonesia&#39;s phase-in：(of the antipoverty program))：(in 7,468 forested villages：(across 15 provinces)).\u003c/p>\n\u003cp>&quot;We see：(that the program → is associated with → a 30 percent reduction：(in deforestation))&quot; → Ferraro says.\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>That&#39;s likely because → the rural poor → are using the money：(as makeshift insurance policies：(against inclement weather)) → Ferraro says.\u003c/p>\n\u003cp>Typically → if rains are delayed → people may clear land：(to plant more rice：(to supplement their harvests)).\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>Whether this research → translates elsewhere → is anybody&#39;s guess.\u003c/p>\n\u003cp>Ferraro suggests：(the results may transfer → to other parts of Asia)：(due to commonalities：(such as the importance：(of growing rice) + market access)).\u003c/p>\n\u003cp>And regardless of transferability → the study shows：(that what&#39;s good for people → may also be good → for the environment).\u003c/p>\n\u003cp>Even if this program → didn&#39;t reduce poverty → Ferraro says → &quot;the value of the avoided deforestation：(just for carbon dioxide emissions alone) → is more than → the program costs.&quot;\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>去年标志着 → 连续第三年：(印度尼西亚严峻的森林砍伐率 → 放缓了速度)。\u003c/p>\n\u003cp>一个原因：(对于这种转变) → 可能是 → 该国的反贫困项目。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>在2007年 → 印度尼西亚开始逐步实施 → 一个项目：(给予金钱 → 给其最贫困的居民：(在特定条件下：(比如要求人们 → 让孩子继续上学 + 获得定期医疗护理)))。\u003c/p>\n\u003cp>被称为有条件现金转移或CCTs → 这些社会援助项目 → 被设计：(来减少不平等 + 打破贫困循环)。\u003c/p>\n\u003cp>它们已经被使用：(在数十个国家：(全世界范围内))。\u003c/p>\n\u003cp>在印度尼西亚 → 该项目已经提供了 → 足够的食物和药品：(来大幅减少 → 严重的生长问题：(在儿童中))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>但CCT项目 → 通常不考虑 → 对环境的影响。\u003c/p>\n\u003cp>事实上 → 扶贫和环境保护 → 经常被视为：(相互冲突的目标) → 保罗·费拉罗说：(一位经济学家：(在约翰霍普金斯大学))。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>那是因为 → 经济增长 → 可能相关：(与环境退化) // 而保护环境 → 有时相关：(与更严重的贫困)。\u003c/p>\n\u003cp>然而 → 这些相关性 → 不能证明 → 因果关系。\u003c/p>\n\u003cp>唯一之前的研究：(分析因果关系的)：(基于墨西哥的一个地区：(已经实施了CCTs的)) → 支持了传统观点。\u003c/p>\n\u003cp>在那里 → 当人们获得更多钱时 → 他们中的一些人 → 可能更多地清理土地：(为了牛：(来饲养作肉用)) → 费拉罗说。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>这些项目 → 不必 → 负面影响 → 环境 // 然而。\u003c/p>\n\u003cp>费拉罗想要看看：(印度尼西亚的扶贫项目是否 → 正在影响 → 森林砍伐)。\u003c/p>\n\u003cp>印度尼西亚拥有 → 第三大面积：(热带森林的：(在世界上)) + 最高之一：(森林砍伐率)。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>费拉罗分析了 → 卫星数据：(显示年度森林损失的：(从2008年到2012年))：(包括在印度尼西亚逐步实施期间：(反贫困项目的))：(在7468个森林村庄：(跨越15个省份))。\u003c/p>\n\u003cp>&quot;我们看到：(该项目 → 与...相关 → 30%的减少：(在森林砍伐方面))&quot; → 费拉罗说。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>那可能是因为 → 农村贫困人口 → 正在使用这些钱：(作为临时保险政策：(对抗恶劣天气)) → 费拉罗说。\u003c/p>\n\u003cp>通常 → 如果降雨延迟 → 人们可能清理土地：(来种植更多稻米：(来补充他们的收成))。\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>这项研究是否 → 适用于其他地方 → 是任何人的猜测。\u003c/p>\n\u003cp>费拉罗建议：(结果可能转移 → 到亚洲其他地区)：(由于共同点：(比如重要性：(种植水稻的) + 市场准入))。\u003c/p>\n\u003cp>不管可转移性如何 → 研究表明：(对人有益的 → 可能也有益 → 对环境)。\u003c/p>\n\u003cp>即使这个项目 → 没有减少贫困 → 费拉罗说 → &quot;避免的森林砍伐的价值：(仅就二氧化碳排放而言) → 就超过了 → 项目成本。&quot;\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第2段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>In 2007, / Indonesia started phasing in / a program / that gives money / to its poorest residents / under certain conditions, / such as requiring people / to keep kids in school / or get regular medical care.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>在2007年，/ 印度尼西亚开始逐步实施 / 一个项目 / 给予金钱 / 给其最贫困的居民 / 在特定条件下，/ 比如要求人们 / 让孩子继续上学 / 或获得定期医疗护理。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先连起开始时间、实施方式与受益对象：\u003c/p>\n\u003cblockquote>\n\u003cp>2007年，印度尼西亚开始逐步推行一个向最贫困居民发钱的项目\u003c/p>\n\u003c/blockquote>\n\u003cp>再将条件及例子接回“发钱”：\u003c/p>\n\u003cblockquote>\n\u003cp>领取援助有一定条件，例如让孩子继续上学，或定期接受医疗服务\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>2007年，印度尼西亚开始逐步推行一个向最贫困居民发钱的项目；领取援助有一定条件，例如让孩子继续上学，或定期接受医疗服务。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>印度尼西亚开始逐步推行一项有条件的现金援助计划。\u003c/p>\n\u003c/blockquote>\n\u003cp>that从句修饰program，说明项目做什么；under certain conditions约束发放而非贫困本身。such as举例解释conditions，把上学和医疗两项放在条件后面。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>2007年，印度尼西亚开始逐步推行一项计划，有条件地向最贫困居民发放现金，例如要求他们让孩子持续就学或定期接受医疗服务。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>phasing in强调分阶段引入，不能译成2007年已一次覆盖全部居民。poorest是受益群体的程度限定。\u003c/p>\n\u003cp>keep kids in school侧重持续就学，get regular medical care侧重定期接受服务；两者是领取现金的条件，不可译成项目直接改革教育或医疗制度。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>2007年，印度尼西亚开始逐步实施一个项目，在特定条件下向最贫困的居民发放现金，比如要求他们让孩子继续上学或获得定期医疗护理。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Ferraro analyzed satellite data showing annual forest loss from 2008 to 2012— including during Indonesia&#39;s phase-in of the antipoverty program— in 7,468 forested villages across 15 provinces.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Ferraro analyzed / satellite data / showing annual forest loss / from 2008 to 2012— / including during Indonesia&#39;s phase-in / of the antipoverty program— / in 7,468 forested villages / across 15 provinces.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>费拉罗分析了 / 卫星数据 / 显示年度森林损失的 / 从2008年到2012年— / 包括在印度尼西亚逐步实施期间 / 反贫困项目的— / 在7468个森林村庄 / 跨越15个省份。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并研究者、方法及观察对象：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗分析了卫星数据，以考察2008年至2012年每年的森林损失\u003c/p>\n\u003c/blockquote>\n\u003cp>再补齐时间插入语和空间范围：\u003c/p>\n\u003cblockquote>\n\u003cp>其中包括印尼逐步推行扶贫项目的时期，数据涉及15个省的7468个有林村庄\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗分析了卫星数据，以考察2008年至2012年每年的森林损失；其中包括印尼逐步推行扶贫项目的时期，数据涉及15个省的7468个有林村庄。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗分析了反映年度森林损失的卫星数据。\u003c/p>\n\u003c/blockquote>\n\u003cp>showing修饰data，而from 2008 to 2012限定annual forest loss的观察区间。两条破折号之间补充该区间与项目推行的重叠；in 7,468 villages补充数据覆盖地点，译到整句后部即可。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗分析了反映2008年至2012年年度森林损失的卫星数据，数据覆盖15个省的7468个有林村庄，这一时期也包括印尼逐步推行扶贫项目的阶段。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>annual forest loss译为“每年的森林损失”，保留逐年观察的设计；这里还没有给出减少多少，不要在翻译中提前添入结果。\u003c/p>\n\u003cp>forested villages是有林村庄，不是全部村庄；15 provinces限定覆盖范围，不能扩大为印尼所有地区。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cfont style=\"color:black;\">费拉罗分析了2008年至2012年的卫星数据，显示了印度尼西亚实施反贫困项目期间的年度森林损失情况，涵盖了15个省的7，468个森林村庄。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第8段第4句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Even if this program / didn&#39;t reduce poverty, / Ferraro says, / &quot;the value of the avoided deforestation / just for carbon dioxide emissions alone / is more than / the program costs.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>即使这个项目 / 没有减少贫困，/ 费拉罗说，/ &quot;避免的森林砍伐的价值 / 仅就二氧化碳排放而言 / 就超过了 / 项目成本。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把让步假设与引述者分开：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗说，即使这个项目没有减少贫困\u003c/p>\n\u003c/blockquote>\n\u003cp>再将价值比较完整译出：\u003c/p>\n\u003cblockquote>\n\u003cp>仅从避免森林砍伐所减少的二氧化碳排放来计算，其价值就已经超过项目成本\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗说，即使这个项目没有减少贫困；仅从避免森林砍伐所减少的二氧化碳排放来计算，其价值就已经超过项目成本。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>即使没有减贫，仅避免砍伐的减排价值也超过项目成本。\u003c/p>\n\u003c/blockquote>\n\u003cp>Ferraro says是插入的消息来源，先移到句首。Even if引导让步假设，主句the value…is more than…才是结论；just和alone共同限制估值只计算碳排放这一项。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗说，即使这项计划没有减少贫困，仅仅计算避免森林砍伐所带来的减排价值，也已经超过项目的成本。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>didn’t reduce置于Even if之后，不是在报告项目实际未减贫；中文必须保留“即使”，不能写成“项目虽然没有减贫”。\u003c/p>\n\u0
