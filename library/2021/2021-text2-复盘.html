03cp>avoided deforestation指本会发生而被避免的砍伐；“仅……就……”能够同时表达核算范围小与价值仍超过成本的关系。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗说，即使这个项目没有减少贫困，&quot;仅就二氧化碳排放而言，避免的森林砍伐的价值就超过了项目成本。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>30题\u003c/h2>\n\u003cp>\u003cstrong>What is the text centered on?\u003c/strong>\u003c/p>\n\u003cp>本文围绕什么展开？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>The debates over a program.\u003c/strong>\u003c/p>\n\u003cp>关于一个项目的争论。\u003c/p>\n\u003cp>B. \u003cstrong>The effects of a program.\u003c/strong>\u003c/p>\n\u003cp>一个项目的效果。\u003c/p>\n\u003cp>C. \u003cstrong>The transferability of a study.\u003c/strong>\u003c/p>\n\u003cp>一项研究的可推广性。\u003c/p>\n\u003cp>D. \u003cstrong>The process of a study.\u003c/strong>\u003c/p>\n\u003cp>一项研究的过程。\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从印尼砍伐速度连续放慢引出扶贫项目的可能作用。\u003c/td>\n\u003ctd>先摆出变化并提出可能原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>介绍现金援助的做法、减贫目的以及儿童方面的效果。\u003c/td>\n\u003ctd>再说具体做法与已有好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>转出通常未考虑环境影响及两目标之间的看法。\u003c/td>\n\u003ctd>接着说以往忽略了另一面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释传统看法及墨西哥居民得钱后清地养牛的情况。\u003c/td>\n\u003ctd>再补一个背景和已有例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转回印尼，提出项目是否影响森林砍伐的考察。\u003c/td>\n\u003ctd>但是又说结果不必总如此\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>给出卫星数据与砍伐减少百分之三十的关联结果。\u003c/td>\n\u003ctd>接着摆出另一处的实际结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>解释现金如何替代降雨推迟时清地多种水稻。\u003c/td>\n\u003ctd>回头解释这种结果怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>限制推广结论并总结对人与环境的好处及价值。\u003c/td>\n\u003ctd>最后说适用限度和所得好处\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>What is the text centered on?\u003c/strong>\u003c/p>\n\u003ch3>A. The debates over a program.\u003c/h3>\n\u003cp>关于一个项目的争论。\u003c/p>\n\u003ch4>如果 A 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>关于一个项目的争论。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从某地现金援助项目出现新结果开篇，提出它为何使既有争论发生变化。\u003c/td>\n\u003ctd>先摆出变化并提出可能原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>介绍项目规则及支持者用减贫和儿童改善来为项目辩护的理由。\u003c/td>\n\u003ctd>再说具体做法与已有好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>转向此前被忽视的环境维度，说明批评者如何质疑扶贫与环保能否兼容。\u003c/td>\n\u003ctd>接着说以往忽略了另一面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>交代争论的理论背景，并以墨西哥案例展示反对方据以发言的材料。\u003c/td>\n\u003ctd>再补一个背景和已有例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>提出印尼经验对单方面批评的挑战，使双方意见进入新一轮交锋。\u003c/td>\n\u003ctd>但是又说结果不必总如此\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>呈现印尼数据及各方怎样解读同一个结果，明确分歧具体落在哪里。\u003c/td>\n\u003ctd>接着摆出另一处的实际结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>解释双方为何从家庭行为机制中得出不同判断，区分对证据和因果的争执。\u003c/td>\n\u003ctd>回头解释这种结果怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>划定现有证据能解决与尚不能解决的争点，并评价继续讨论可能带来的政策收益。\u003c/td>\n\u003ctd>最后说适用限度和所得好处\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A的debates需要文章持续呈现关于项目的争论者、双方意见或交锋。文中确实提到常见看法，也用墨西哥与印尼形成不同结果，但这些是在建立研究问题并展示项目可能产生不同环境效果。第6、7段提供结果和解释，第8段评价价值，没有回到争论双方逐一回应。把背景中的传统看法当成整篇争论，会漏掉文章主要在说明实际产生什么结果。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>What is the text centered on?\u003c/strong>\u003c/p>\n\u003ch3>B. The effects of a program.\u003c/h3>\n\u003cp>一个项目的效果。\u003c/p>\n\u003ch4>如果 B 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>一个项目的效果。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从印尼砍伐放缓切入，提出扶贫现金项目可能产生了未预期的环境效果。\u003c/td>\n\u003ctd>先摆出变化并提出可能原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明有条件发钱的具体办法、减贫目的及已经观察到的儿童收益。\u003c/td>\n\u003ctd>再说具体做法与已有好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出环境后果常不进入项目设计，而扶贫和环保往往被看成相冲突。\u003c/td>\n\u003ctd>接着说以往忽略了另一面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>解释传统担忧，并用收入增加后清地养牛的案例呈现可能的负面效果。\u003c/td>\n\u003ctd>再补一个背景和已有例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转向印尼说明结果也可能不同，提出用当地经验检验环境影响。\u003c/td>\n\u003ctd>但是又说结果不必总如此\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>给出村庄卫星数据与森林损失减少的关联，呈现另一种实际效果。\u003c/td>\n\u003ctd>接着摆出另一处的实际结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>说明现金怎样替代歉收时清林扩种的做法，为积极结果提出机制解释。\u003c/td>\n\u003ctd>回头解释这种结果怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>限定结论可推广的条件，并分别评价对家庭生活和避免砍伐的收益。\u003c/td>\n\u003ctd>最后说适用限度和所得好处\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的effects能够同时容纳减贫、儿童成长以及森林砍伐这些结果。文章开头就把砍伐放慢与扶贫项目联系，第2段交代项目通常要改善贫困生活，第3至5段追問它是否对环境不利，第6段给出减少砍伐的发现，第7段解释现金为什么可能代替清地，第8段再说结果的推广限度和环境价值。研究是弄清效果的途径，推广性只是结果出现后的一项讨论，整条行文持续围绕项目对人和环境产生什么影响。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>What is the text centered on?\u003c/strong>\u003c/p>\n\u003ch3>C. The transferability of a study.\u003c/h3>\n\u003cp>一项研究的可推广性。\u003c/p>\n\u003ch4>如果 C 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>一项研究的可推广性。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从一项研究在新地区被采用后出现不同结果写起，提出研究结论可转移到何处的问题。\u003c/td>\n\u003ctd>先摆出变化并提出可能原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>介绍原研究的方案及其在最初地区取得的好处，给后续比较建立基准。\u003c/td>\n\u003ctd>再说具体做法与已有好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出以往讨论只看平均效果，忽略气候、市场或生计条件对迁移的限制。\u003c/td>\n\u003ctd>接着说以往忽略了另一面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>用另一地区实施同类研究的案例，说明背景变化可能改变结果。\u003c/td>\n\u003ctd>再补一个背景和已有例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>转向印尼，提出即使外地发现负面影响，本地也不必得到同一结论。\u003c/td>\n\u003ctd>但是又说结果不必总如此\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>给出印尼的不同观察结果，直接比较原研究与新地区是否一致。\u003c/td>\n\u003ctd>接着摆出另一处的实际结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>解释降雨风险、种植选择和市场条件为何影响跨地区结论迁移。\u003c/td>\n\u003ctd>回头解释这种结果怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>列出适用地区的必要相似性及推广边界，并说明有条件迁移能带来什么收益。\u003c/td>\n\u003ctd>最后说适用限度和所得好处\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C的transferability正好碰到第8段开头的elsewhere和other parts of Asia。但是前面大部分篇幅问的不是研究能否移用到别处，而是印尼扶贫项目对森林有什么效果、为什么有这种效果。最后说推广尚不确定之后，还继续强调人和环境可能共同受益及环保价值。可推广性是已经得到结果后的限制性讨论，不能倒过来覆盖前面的项目目的、研究发现和机制解释。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>What is the text centered on?\u003c/strong>\u003c/p>\n\u003ch3>D. The process of a study.\u003c/h3>\n\u003cp>一项研究的过程。\u003c/p>\n\u003ch4>如果 D 是主旨，文章8段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>一项研究的过程。\u003c/p>\n\u003cp>那文章8段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从森林变化引出一个待解释现象，说明研究者为何怀疑现金项目可能是原因。\u003c/td>\n\u003ctd>先摆出变化并提出可能原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>介绍他据以提出假设的项目规则与既有福利研究，交代研究起点。\u003c/td>\n\u003ctd>再说具体做法与已有好处\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出既有方法没有测量环境变化，因此新研究要补足这一观测维度。\u003c/td>\n\u003ctd>接着说以往忽略了另一面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>回顾此前相关性研究和墨西哥实证的设计，形成研究方法的背景。\u003c/td>\n\u003ctd>再补一个背景和已有例子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>说明研究者选择印尼而非直接照搬既有结论，列出案例选择依据。\u003c/td>\n\u003ctd>但是又说结果不必总如此\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>详细展开卫星资料、样本选取和时期对比，呈现研究执行及主要结果。\u003c/td>\n\u003ctd>接着摆出另一处的实际结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第7段\u003c/td>\n\u003ctd>说明研究者怎样进一步调查家庭决策，检验解释结果的行为机制。\u003c/td>\n\u003ctd>回头解释这种结果怎样发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第8段\u003c/td>\n\u003ctd>总结方法适用范围、数据限制及这套研究过程对未来调查的帮助。\u003c/td>\n\u003ctd>最后说适用限度和所得好处\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D的process会把重点放在研究怎样逐步开展。第5段说研究意图，第6段提卫星数据与时间地点，确实交代了一点过程；但第6段随即给出砍伐减少的结果，第7段讲的是现金如何影响人们的用地选择，不是研究人员又进行了哪一步操作，第8段评价的是效果的价值。过程只占为发现提供依据的少量文字，并未持续组织全文。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>30题结论\u003c/h3>\n\u003cp>\u003cstrong>30. B. The effects of a program.\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>The effects of a program. / 一个项目的效果。\u003c/strong>\u003c/p>\n\u003ch2>26题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to the first two paragraphs, CCT programs aim to ______.\u003cbr>根据前两段，CCT项目旨在做什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>项目目的题。题干要求判断“根据前两段，CCT项目旨在做什么？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Last year marked the third year in a row that Indonesia&#39;s bleak rate of deforestation has slowed in pace. One reason for the turnaround may be the country&#39;s antipoverty program.\u003c/p>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care. Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty. They&#39;re already used in dozens of countries worldwide. In Indonesia, the program has provided enough food and medicine to substantially reduce severe growth problems among children.\u003c/p>\n\u003c/blockquote>\n\u003cp>首段介绍砍伐减少这一可能效果，第2段才明确项目设计目的：向最贫困居民有条件地发钱，以减少不平等、打破代际贫困循环。上学和医疗是条件。\u003c/p>\n\u003ch3>A. improve local education systems\u003c/h3>\n\u003cblockquote>\n\u003cp>改善当地教育制度\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 education systems 与第2段 keep kids in school 都涉及教育，但一个是教育系统，一个是孩子是否继续上学，因此回到列举领取钱款条件的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 keep kids in school 是 requiring people 后面的条件：居民要让孩子继续上学，才能满足项目要求。A的 education systems 把对象从贫困家庭及孩子换成教育制度或系统，也把一项领取钱款的条件改成整个项目的目标。要求孩子上学不等于改造学校制度、课程或管理；这些内容不在原句的要求中。\u003c/p>\n\u003cp>条件要求的是家庭的具体行为，A却变成对整个教育系统进行改善，动作对象与条件的作用都发生了变化。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>CCT项目旨在改善当地教育制度。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 education systems 与第2段 keep kids in school 都涉及教育，但一个是教育系统，一个是孩子是否继续上学，因此回到列举领取钱款条件的句子。\u003c/p>\n\u003cp>原文的 keep kids in school 是 requiring people 后面的条件：居民要让孩子继续上学，才能满足项目要求。A的 education systems 把对象从贫困家庭及孩子换成教育制度或系统，也把一项领取钱款的条件改成整个项目的目标。要求孩子上学不等于改造学校制度、课程或管理；这些内容不在原句的要求中。\u003c/p>\n\u003cp>条件要求的是家庭的具体行为，A却变成对整个教育系统进行改善，动作对象与条件的作用都发生了变化。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care.\u003c/p>\n\u003cp>首段介绍砍伐减少这一可能效果，第2段才明确项目设计目的：向最贫困居民有条件地发钱，以减少不平等、打破代际贫困循环。上学和医疗是条件。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从印尼砍伐速度连续放慢引出扶贫项目的可能作用。介绍现金援助的做法、减贫目的以及儿童方面的效果。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>CCTs are designed to reform and improve local education systems.\u003c/p>\n\u003cp>CCT项目被设计用来改革和改善当地教育制度。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文要求家庭让孩子持续上学，没有谈课程、师资、学校治理等制度改革。提高就学机会能与项目相容，却不能把给钱所附的家庭行为条件升格为教育制度目的。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章评估一个项目的效果，不能将任何效果都倒推成设计目的；本题必须区分最初目标、领取条件和后来的环境发现。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>improve local education systems\u003cbr>改善当地教育制度\u003c/p>\n\u003c/blockquote>\n\u003cp>条件要求的是家庭的具体行为，A却变成对整个教育系统进行改善，动作对象与条件的作用都发生了变化。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从印尼砍伐速度连续放慢引出扶贫项目的可能作用。介绍现金援助的做法、减贫目的以及儿童方面的效果。\u003c/p>\n\u003cp>本项最终仍要根据“break the cycle of poverty”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. lower deforestation rates\u003c/h3>\n\u003cblockquote>\n\u003cp>降低森林砍伐率\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 lower deforestation rates 对应第1段森林砍伐步伐放慢，而 may be 引出扶贫项目作为可能的原因；两处都涉及砍伐变化，所以回到首段，并联系第2段明写设计目的的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>首段的 may be 说扶贫项目可能是砍伐速度放慢的原因，这是后来观察到的效果。B的 lower deforestation rates 把可能产生的森林效果换成项目原先的目的。项目给最贫困居民钱，条件是上学、医疗；这套介绍的目标对象仍是贫困居民的生活。\u003c/p>\n\u003cp>第1段给的是可能的结果解释，第2段才专门写设计目的；B把效果与目的的位置倒换了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>One reason for the turnaround may be the country&#39;s antipoverty program.\u003c/p>\n\u003cp>Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>CCT项目旨在降低森林砍伐率。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 lower deforestation rates 对应第1段森林砍伐步伐放慢，而 may be 引出扶贫项目作为可能的原因；两处都涉及砍伐变化，所以回到首段，并联系第2段明写设计目的的句子。\u003c/p>\n\u003cp>首段的 may be 说扶贫项目可能是砍伐速度放慢的原因，这是后来观察到的效果。B的 lower deforestation rates 把可能产生的森林效果换成项目原先的目的。项目给最贫困居民钱，条件是上学、医疗；这套介绍的目标对象仍是贫困居民的生活。\u003c/p>\n\u003cp>第1段给的是可能的结果解释，第2段才专门写设计目的；B把效果与目的的位置倒换了。\u003c/p>\n\u003cp>首段介绍砍伐减少这一可能效果，第2段才明确项目设计目的：向最贫困居民有条件地发钱，以减少不平等、打破代际贫困循环。上学和医疗是条件。\u003c/p>\n\u003cp>首段环境变化是研究要解释的现象，后文还说这类项目通常不考虑环境效果。把新发现的附带效果写成最初目标，会抹去全文所强调的意外联系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>One reason for the turnaround may be the country&#39;s antipoverty program.\u003c/p>\n\u003cp>Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty.\u003c/p>\n\u003cp>首段介绍砍伐减少这一可能效果，第2段才明确项目设计目的：向最贫困居民有条件地发钱，以减少不平等、打破代际贫困循环。上学和医疗是条件。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从印尼砍伐速度连续放慢引出扶贫项目的可能作用。介绍现金援助的做法、减贫目的以及儿童方面的效果。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>CCTs were introduced with the aim of lowering deforestation rates.\u003c/p>\n\u003cp>推出CCT项目的目标是降低森林砍伐率。\u003c/p>\n\u003c/blockquote>\n\u003cp>首段环境变化是研究要解释的现象，后文还说这类项目通常不考虑环境效果。把新发现的附带效果写成最初目标，会抹去全文所强调的意外联系。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章评估一个项目的效果，不能将任何效果都倒推成设计目的；本题必须区分最初目标、领取条件和后来的环境发现。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>lower deforestation rates\u003cbr>降低森林砍伐率\u003c/p>\n\u003c/blockquote>\n\u003cp>第1段给的是可能的结果解释，第2段才专门写设计目的；B把效果与目的的位置倒换了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从印尼砍伐速度连续放慢引出扶贫项目的可能作用。介绍现金援助的做法、减贫目的以及儿童方面的效果。\u003c/p>\n\u003cp>本项最终仍要根据“break the cycle of poverty”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. help poor families get better off\u003c/h3>\n\u003cblockquote>\n\u003cp>帮助贫困家庭改善经济状况\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的 poor families get better off 指贫困家庭摆脱窘境，与第2段 break the cycle of poverty 都在说改变贫穷生活，因此回到are designed所在句，并看钱给谁。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文的钱给 poorest residents，目的之一是 break the cycle of poverty。C的 poor families get better off 把“给贫困居民援助、打破贫穷循环”概括为让贫困家庭过得更好。对象相同，改善生活的方向也能接上；它没有把上学、医疗的附带条件提升成改革制度的总目标。\u003c/p>\n\u003cp>目标群体和改变贫困状况的方向都明确，C把目的概括出来，且没有增加其他改革对象。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>CCT项目旨在帮助贫困家庭改善经济状况。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 poor families get better off 指贫困家庭摆脱窘境，与第2段 break the cycle of poverty 都在说改变贫穷生活，因此回到are designed所在句，并看钱给谁。\u003c/p>\n\u003cp>原文的钱给 poorest residents，目的之一是 break the cycle of poverty。C的 poor families get better off 把“给贫困居民援助、打破贫穷循环”概括为让贫困家庭过得更好。对象相同，改善生活的方向也能接上；它没有把上学、医疗的附带条件提升成改革制度的总目标。\u003c/p>\n\u003cp>目标群体和改变贫困状况的方向都明确，C把目的概括出来，且没有增加其他改革对象。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty.\u003c/p>\n\u003cp>首段介绍砍伐减少这一可能效果，第2段才明确项目设计目的：向最贫困居民有条件地发钱，以减少不平等、打破代际贫困循环。上学和医疗是条件。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从印尼砍伐速度连续放慢引出扶贫项目的可能作用。介绍现金援助的做法、减贫目的以及儿童方面的效果。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>CCTs aim to improve poor families’ economic circumstances and break the cycle of poverty.\u003c/p>\n\u003cp>CCT项目旨在改善贫困家庭的经济状况，打破贫困循环。\u003c/p>\n\u003c/blockquote>\n\u003cp>这同时接住poorest residents和break the cycle of poverty，get better off概括的是家庭经济处境。学校与医疗条件服务于长期减贫，没有另立制度改革目标。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章评估一个项目的效果，不能将任何效果都倒推成设计目的；本题必须区分最初目标、领取条件和后来的环境发现。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>help poor families get better off\u003cbr>帮助贫困家庭改善经济状况\u003c/p>\n\u003c/blockquote>\n\u003cp>目标群体和改变贫困状况的方向都明确，C把目的概括出来，且没有增加其他改革对象。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从印尼砍伐速度连续放慢引出扶贫项目的可能作用。介绍现金援助的做法、减贫目的以及儿童方面的效果。\u003c/p>\n\u003cp>本项最终仍要根据“break the cycle of poverty”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. facilitate health care reform\u003c/h3>\n\u003cblockquote>\n\u003cp>促进医疗保健改革\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时选项呈现为“[xxx] health care reform”，保留了相应遮挡。当时的定位线索是：D的 health care reform 提到医疗改革，第2段 get regular medical care 则要求居民得到定期医疗照护；都提到医疗，因此回到领取钱款条件的末尾，分清照护和改革。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 get regular medical care 是个人定期接受照护，与保持孩子上学并列，属于给钱时附加的条件。D的 health care reform 则把对象改成医疗制度改革。\u003c/p>\n\u003cp>原文让居民接受服务，D讨论改革服务体系；未知的动作不会改变reform这个已经写出的对象。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>CCT项目旨在促进医疗保健改革。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 health care reform 提到医疗改革，第2段 get regular medical care 则要求居民得到定期医疗照护；都提到医疗，因此回到领取钱款条件的末尾，分清照护和改革。\u003c/p>\n\u003cp>原文的 get regular medical care 是个人定期接受照护，与保持孩子上学并列，属于给钱时附加的条件。D的 health care reform 则把对象改成医疗制度改革。\u003c/p>\n\u003cp>原文让居民接受服务，D讨论改革服务体系；未知的动作不会改变reform这个已经写出的对象。\u003c/p>\n\u003cp>首段介绍砍伐减少这一可能效果，第2段才明确项目设计目的：向最贫困居民有条件地发钱，以减少不平等、打破代际贫困循环。上学和医疗是条件。\u003c/p>\n\u003cp>regular medical care指受助者接受服务的行为。改革医疗体系需要机构、供给或规则变化的材料，原文并未给出；不能因为条件中出现医疗，就补出改革目标。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care.\u003c/p>\n\u003cp>首段介绍砍伐减少这一可能效果，第2段才明确项目设计目的：向最贫困居民有条件地发钱，以减少不平等、打破代际贫困循环。上学和医疗是条件。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从印尼砍伐速度连续放慢引出扶贫项目的可能作用。介绍现金援助的做法、减贫目的以及儿童方面的效果。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>CCTs are intended to bring about reform of the health-care system.\u003c/p>\n\u003cp>CCT项目旨在推动医疗保健制度改革。\u003c/p>\n\u003c/blockquote>\n\u003cp>regular medical care指受助者接受服务的行为。改革医疗体系需要机构、供给或规则变化的材料，原文并未给出；不能因为条件中出现医疗，就补出改革目标。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章评估一个项目的效果，不能将任何效果都倒推成设计目的；本题必须区分最初目标、领取条件和后来的环境发现。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>facilitate health care reform\u003cbr>促进医疗保健改革\u003c/p>\n\u003c/blockquote>\n\u003cp>原文让居民接受服务，D讨论改革服务体系；未知的动作不会改变reform这个已经写出的对象。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从印尼砍伐速度连续放慢引出扶贫项目的可能作用。介绍现金援助的做法、减贫目的以及儿童方面的效果。\u003c/p>\n\u003cp>本项最终仍要根据“break the cycle of poverty”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>26题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>26. C. help poor families get better off\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：让孩子上学是领取条件，不能推出改革当地教育制度的目标。\u003c/p>\n\u003cp>B：少砍森林是后来研究的效果，不能倒推为项目最初目的。\u003c/p>\n\u003cp>C：向最贫困者提供支持并打破贫困循环，正是改善贫困家庭处境。\u003c/p>\n\u003cp>D：定期接受医疗是家庭行为条件，不是医疗体系改革。\u003c/p>\n\u003ch2>27题\u003c/h2>\n\u003cblockquote>\n\u003cp>The study based on an area in Mexico is cited to show that ______.\u003cbr>引用墨西哥一个地区的研究，是为了说明什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>研究例证作用题。题干要求判断“引用墨西哥一个地区的研究，是为了说明什么？”，先按第3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>But CCT programs don&#39;t generally consider effects on the environment. In fact, poverty alleviation and environmental protection are often viewed as conflicting goals, says Paul Ferraro, an economist at Johns Hopkins University.\u003c/p>\n\u003cp>That&#39;s because economic growth can be correlated with environmental degradation, while protecting the environment is sometimes correlated with greater poverty. However, those correlations don&#39;t prove cause and effect. The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view. There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003c/blockquote>\n\u003cp>第3段说减贫与环保常被看成冲突的目标，第4段先给经济增长与环境退化的关联，再用墨西哥现金使居民清地养牛的研究说明这种传统看法。\u003c/p>\n\u003ch3>A. economic growth tends to cause environmental degradation\u003c/h3>\n\u003cblockquote>\n\u003cp>经济增长往往造成环境退化\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 economic growth tends to cause 把经济改善连到环境后果，第4段 as people got more money 后面正写居民清地养牛，收入变化和土地变化构成相应的前后联系，所以回看事例末句及它支持traditional view的说明。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>事例里的 as people got more money 是收入增加，后面写一些人可能有更多清出的土地来养牛取肉。A的 economic growth tends to cause 同样把经济改善和环境受损接在一起。这里要保留原文程度：some、may并没有证明每次收入增长都必然毁林，前一句也提醒一般关联不能直接证明因果；但本题问研究被拿来说明哪种传统看法，事例支持的是收入增长可能伴随扩大清地的方向，不是宣称普遍必然规律。\u003c/p>\n\u003cp>前提是把tends to理解为一种倾向，不当成所有情况下都必然发生；作为引用作用，它与段落提出的经济和环境关系相接。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view.\u003c/p>\n\u003cp>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>墨西哥地区的研究被用来说明经济增长往往造成环境退化。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 economic growth tends to cause 把经济改善连到环境后果，第4段 as people got more money 后面正写居民清地养牛，收入变化和土地变化构成相应的前后联系，所以回看事例末句及它支持traditional view的说明。\u003c/p>\n\u003cp>事例里的 as people got more money 是收入增加，后面写一些人可能有更多清出的土地来养牛取肉。A的 economic growth tends to cause 同样把经济改善和环境受损接在一起。这里要保留原文程度：some、may并没有证明每次收入增长都必然毁林，前一句也提醒一般关联不能直接证明因果；但本题问研究被拿来说明哪种传统看法，事例支持的是收入增长可能伴随扩大清地的方向，不是宣称普遍必然规律。\u003c/p>\n\u003cp>前提是把tends to理解为一种倾向，不当成所有情况下都必然发生；作为引用作用，它与段落提出的经济和环境关系相接。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view.\u003c/p>\n\u003cp>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003cp>第3段说减贫与环保常被看成冲突的目标，第4段先给经济增长与环境退化的关联，再用墨西哥现金使居民清地养牛的研究说明这种传统看法。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转出通常未考虑环境影响及两目标之间的看法。解释传统看法及墨西哥居民得钱后清地养牛的情况。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Mexican case illustrates how economic gains can be accompanied by environmental damage.\u003c/p>\n\u003cp>墨西哥案例说明经济收益如何可能伴随环境损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>居民获得更多现金之后清理土地养牛，将收入增加与森林破坏相接。tends to保留倾向，不把一个案例提升为所有扶贫项目必然破坏环境。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认扶贫项目可能有多方面效果，不能直接决定墨西哥这个例子支持哪种关系；须看它在转向印尼之前具体说明了什么。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>economic growth tends to cause environmental degradation\u003cbr>经济增长往往造成环境退化\u003c/p>\n\u003c/blockquote>\n\u003cp>前提是把tends to理解为一种倾向，不当成所有情况下都必然发生；作为引用作用，它与段落提出的经济和环境关系相接。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转出通常未考虑环境影响及两目标之间的看法。解释传统看法及墨西哥居民得钱后清地养牛的情况。\u003c/p>\n\u003cp>本项最终仍要根据“as people got more money”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. cattle rearing has been a major means of livelihood for the poor\u003c/h3>\n\u003cblockquote>\n\u003cp>养牛一直是穷人的一种主要谋生方式\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时选项呈现为“cattle rearing has been a major means of [xxx] for the poor”，保留了相应遮挡。当时的定位线索是：B的 has been a major means 要说明长期主要方式，第4段 as people got more money 则把养牛放在得到更多钱之后；两处都涉及养牛，所以回看收入变化后清地养牛的完整句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>原文的 as people got more money 是情形变化的起点，接着只有some of them may说明一部分人的可能反应。B的 has been a major means 却将养牛写成贫困者长期的主要方式：major把一部分可能行为放大为主要地位，has been又将得到钱以后可能扩地的过程改成长期状况。\u003c/p>\n\u003cp>原句讲局部人群在收入变化后的可能行为，B却要求长期且主要的地位，范围和时间都扩大了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>墨西哥地区的研究被用来说明养牛一直是穷人的一种主要谋生方式。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 has been a major means 要说明长期主要方式，第4段 as people got more money 则把养牛放在得到更多钱之后；两处都涉及养牛，所以回看收入变化后清地养牛的完整句子。\u003c/p>\n\u003cp>原文的 as people got more money 是情形变化的起点，接着只有some of them may说明一部分人的可能反应。B的 has been a major means 却将养牛写成贫困者长期的主要方式：major把一部分可能行为放大为主要地位，has been又将得到钱以后可能扩地的过程改成长期状况。\u003c/p>\n\u003cp>原句讲局部人群在收入变化后的可能行为，B却要求长期且主要的地位，范围和时间都扩大了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003cp>第3段说减贫与环保常被看成冲突的目标，第4段先给经济增长与环境退化的关联，再用墨西哥现金使居民清地养牛的研究说明这种传统看法。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转出通常未考虑环境影响及两目标之间的看法。解释传统看法及墨西哥居民得钱后清地养牛的情况。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The study is cited mainly to establish cattle raising as the poor population’s major livelihood.\u003c/p>\n\u003cp>引用这项研究主要是为确立养牛在穷人生计中的主要地位。\u003c/p>\n\u003c/blockquote>\n\u003cp>养牛是案例中的土地用途，作者借它说明得到现金后为何多清地。原文没有各行业生计占比，也未以主要谋生方式为待证明观点；把例子细节当成了例子结论。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认扶贫项目可能有多方面效果，不能直接决定墨西哥这个例子支持哪种关系；须看它在转向印尼之前具体说明了什么。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>cattle rearing has been a major means of livelihood for the poor\u003cbr>养牛一直是穷人的一种主要谋生方式\u003c/p>\n\u003c/blockquote>\n\u003cp>原句讲局部人群在收入变化后的可能行为，B却要求长期且主要的地位，范围和时间都扩大了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转出通常未考虑环境影响及两目标之间的看法。解释传统看法及墨西哥居民得钱后清地养牛的情况。\u003c/p>\n\u003cp>本项最终仍要根据“as people got more money”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. CCT programs have helped preserve traditional lifestyles\u003c/h3>\n\u003cblockquote>\n\u003cp>CCT项目帮助保留了传统生活方式\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 preserve traditional lifestyles 和第4段 supported the traditional view 都有traditional，但一个修饰生活方式，一个修饰观点，因此回到研究支持什么的句子，再看末句行为变化。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 supported the traditional view 说研究结果支持前面关于经济和环境的传统看法，不是给传统生活方式提供帮助。C的 preserve traditional lifestyles 把被支持的对象从观点换成生活方式，又把得到更多钱后可能增加清地的变化写成保持原来的生活；traditional在两处修饰的中心词不同。\u003c/p>\n\u003cp>view是对关系的看法，lifestyles是人的生活安排；原文还写了收入和用地变化，不能将support转换成preserve生活方式。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view.\u003c/p>\n\u003cp>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>墨西哥地区的研究被用来说明CCT项目帮助保留了传统生活方式。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 preserve traditional lifestyles 和第4段 supported the traditional view 都有traditional，但一个修饰生活方式，一个修饰观点，因此回到研究支持什么的句子，再看末句行为变化。\u003c/p>\n\u003cp>原文的 supported the traditional view 说研究结果支持前面关于经济和环境的传统看法，不是给传统生活方式提供帮助。C的 preserve traditional lifestyles 把被支持的对象从观点换成生活方式，又把得到更多钱后可能增加清地的变化写成保持原来的生活；traditional在两处修饰的中心词不同。\u003c/p>\n\u003cp>view是对关系的看法，lifestyles是人的生活安排；原文还写了收入和用地变化，不能将support转换成preserve生活方式。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view.\u003c/p>\n\u003cp>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003cp>第3段说减贫与环保常被看成冲突的目标，第4段先给经济增长与环境退化的关联，再用墨西哥现金使居民清地养牛的研究说明这种传统看法。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转出通常未考虑环境影响及两目标之间的看法。解释传统看法及墨西哥居民得钱后清地养牛的情况。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Mexican study shows that cash transfers preserve traditional lifestyles.\u003c/p>\n\u003cp>墨西哥研究说明现金转移能保护传统生活方式。\u003c/p>\n\u003c/blockquote>\n\u003cp>该例写收入改变后清地养牛这一新增活动，而不是维持原状。preserve traditional需要前后生活方式延续的证据，与文中讨论的环境代价并非同一关系。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认扶贫项目可能有多方面效果，不能直接决定墨西哥这个例子支持哪种关系；须看它在转向印尼之前具体说明了什么。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>CCT programs have helped preserve traditional lifestyles\u003cbr>CCT项目帮助保留了传统生活方式\u003c/p>\n\u003c/blockquote>\n\u003cp>view是对关系的看法，lifestyles是人的生活安排；原文还写了收入和用地变化，不能将support转换成preserve生活方式。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转出通常未考虑环境影响及两目标之间的看法。解释传统看法及墨西哥居民得钱后清地养牛的情况。\u003c/p>\n\u003cp>本项最终仍要根据“as people got more money”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. antipoverty efforts require the participation of local farmers\u003c/h3>\n\u003cblockquote>\n\u003cp>扶贫工作需要当地农民参与\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 require the participation 说项目需要居民参与，第4段 some of them may 也提到当地人做什么，所以回看居民得到钱后清地的句子，确认行为发生在项目效果还是成立条件的位置。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 some of them may 写一部分人获得更多钱以后的可能反应，句子以as people got more money引出变化。D的 require the participation 却说农民参与是扶贫所必需的前提，把项目影响到的人及其后续行动改成了项目实施条件；may所说的可能也不能支持require的必要性。\u003c/p>\n\u003cp>原句在解释钱带来什么变化，D在规定项目先需要什么，前提与后果倒换，而且把可能变成了必须。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>墨西哥地区的研究被用来说明扶贫工作需要当地农民参与。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 require the participation 说项目需要居民参与，第4段 some of them may 也提到当地人做什么，所以回看居民得到钱后清地的句子，确认行为发生在项目效果还是成立条件的位置。\u003c/p>\n\u003cp>原文的 some of them may 写一部分人获得更多钱以后的可能反应，句子以as people got more money引出变化。D的 require the participation 却说农民参与是扶贫所必需的前提，把项目影响到的人及其后续行动改成了项目实施条件；may所说的可能也不能支持require的必要性。\u003c/p>\n\u003cp>原句在解释钱带来什么变化，D在规定项目先需要什么，前提与后果倒换，而且把可能变成了必须。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003cp>第3段说减贫与环保常被看成冲突的目标，第4段先给经济增长与环境退化的关联，再用墨西哥现金使居民清地养牛的研究说明这种传统看法。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转出通常未考虑环境影响及两目标之间的看法。解释传统看法及墨西哥居民得钱后清地养牛的情况。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The study demonstrates that poverty programs cannot work without local farmers’ participation.\u003c/p>\n\u003cp>这项研究证明扶贫项目没有当地农民参与就无法奏效。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文农民是受助及改变土地利用的人，没有比较参与与不参与的效果。require是一项必要条件判断，不能从案例恰有农民便推出。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认扶贫项目可能有多方面效果，不能直接决定墨西哥这个例子支持哪种关系；须看它在转向印尼之前具体说明了什么。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>antipoverty efforts require the participation of local farmers\u003cbr>扶贫工作需要当地农民参与\u003c/p>\n\u003c/blockquote>\n\u003cp>原句在解释钱带来什么变化，D在规定项目先需要什么，前提与后果倒换，而且把可能变成了必须。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转出通常未考虑环境影响及两目标之间的看法。解释传统看法及墨西哥居民得钱后清地养牛的情况。\u003c/p>\n\u003cp>本项最终仍要根据“as people got more money”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>27题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>27. A. economic growth tends to cause environmental degradation\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：收入增加后清地养牛具体说明经济改善可能伴随环境代价。\u003c/p>\n\u003cp>B：养牛是案例里的具体用途，不是作者要证明的穷人主要生计。\u003c/p>\n\u003cp>C：案例写现金后的清地变化，没有证明传统生活方式被保护。\u003c/p>\n\u003cp>D：农民出现在案例中，不等于其参与已被证明为扶贫必要条件。\u003c/p>\n\u003ch2>28题\u003c/h2>\n\u003cblockquote>\n\u003cp>In his study about Indonesia, Ferraro intends to find out ______.\u003cbr>在关于印度尼西亚的研究中，Ferraro打算弄清什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>研究目标题。题干要求判断“在关于印度尼西亚的研究中，Ferraro打算弄清什么？”，先按第5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Such programs do not have to negatively affect the environment, though. Ferraro wanted to see if Indonesia&#39;s poverty-alleviation program was affecting deforestation. Indonesia has the third-largest area of tropical forest in the world and one of the highest deforestation rates.\u003c/p>\n\u003cp>Ferraro analyzed satellite data showing annual forest loss from 2008 to 2012—including during Indonesia&#39;s phase-in of the antipoverty program—in 7,468 forested villages across 15 provinces. &quot;We see that the program is associated with a 30 percent reduction in deforestation,&quot; Ferraro says.\u003c/p>\n\u003c/blockquote>\n\u003cp>他先指出扶贫和环保不一定负相关，再在森林面积大且流失快的印尼考察项目；随后将项目推行时期与村庄年度森林损失相比较。\u003c/p>\n\u003ch3>A. its acceptance level of CCTs\u003c/h3>\n\u003cblockquote>\n\u003cp>该国对CCT项目的接受程度\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 acceptance level 问居民或国家接受项目多少，第5段 was affecting deforestation 问项目影响森林砍伐与否；两处都以CCT为中心，因此回到wanted to see引出的研究问题。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 was affecting deforestation 把扶贫项目放在可能施加影响的一端，把森林砍伐放在受到影响的一端。A的 acceptance level 则把项目变成被接受的对象，研究对象从森林变化换成接受态度或程度。研究项目有没有环境影响，并不是调查人们是否愿意接受项目。\u003c/p>\n\u003cp>原句的作用方向从项目到森林，A改成接受者对项目的态度，研究对象已经不同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro wanted to see if Indonesia&#39;s poverty-alleviation program was affecting deforestation.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗研究印度尼西亚，是要弄清该国对CCT项目的接受程度。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 acceptance level 问居民或国家接受项目多少，第5段 was affecting deforestation 问项目影响森林砍伐与否；两处都以CCT为中心，因此回到wanted to see引出的研究问题。\u003c/p>\n\u003cp>原文的 was affecting deforestation 把扶贫项目放在可能施加影响的一端，把森林砍伐放在受到影响的一端。A的 acceptance level 则把项目变成被接受的对象，研究对象从森林变化换成接受态度或程度。研究项目有没有环境影响，并不是调查人们是否愿意接受项目。\u003c/p>\n\u003cp>原句的作用方向从项目到森林，A改成接受者对项目的态度，研究对象已经不同。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro wanted to see if Indonesia&#39;s poverty-alleviation program was affecting deforestation.\u003c/p>\n\u003cp>他先指出扶贫和环保不一定负相关，再在森林面积大且流失快的印尼考察项目；随后将项目推行时期与村庄年度森林损失相比较。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回印尼，提出项目是否影响森林砍伐的考察。给出卫星数据与砍伐减少百分之三十的关联结果。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro set out to measure how widely Indonesian residents accepted CCTs.\u003c/p>\n\u003cp>费拉罗打算测量印尼居民接受CCT的程度。\u003c/p>\n\u003c/blockquote>\n\u003cp>接受度研究应调查态度、报名意愿或参与比例。此处分析的是森林年度损失的卫星数据，观测变量与接受意愿不同。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章关注项目效果，不能单独确定这项研究测量的变量；研究者想查什么，仍须由研究目的和数据对象确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>its acceptance level of CCTs\u003cbr>该国对CCT项目的接受程度\u003c/p>\n\u003c/blockquote>\n\u003cp>原句的作用方向从项目到森林，A改成接受者对项目的态度，研究对象已经不同。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转回印尼，提出项目是否影响森林砍伐的考察。给出卫星数据与砍伐减少百分之三十的关联结果。\u003c/p>\n\u003cp>本项最终仍要根据“affecting deforestation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. its annual rate of poverty alleviation\u003c/h3>\n\u003cblockquote>\n\u003cp>该国每年的减贫率\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时选项呈现为“its annual rate of poverty [xxx]”，保留了相应遮挡。当时的定位线索是：B的 annual rate of poverty 关注贫穷的年度数值，原句 affecting deforestation 关注扶贫项目对森林砍伐的影响，二者都可能与扶贫项目有关，所以回到wanted to see后实际提出的问题。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 affecting deforestation 已把要考察的结果明确写成森林砍伐。B的 annual rate of poverty 则把结果换成贫穷的某种年度比率。\u003c/p>\n\u003cp>原句用扶贫项目来解释森林变化，B把项目的类别当成结果指标，且增加了年度比率这一测量方式。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro wanted to see if Indonesia&#39;s poverty-alleviation program was affecting deforestation.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗研究印度尼西亚，是要弄清该国每年的减贫率。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 annual rate of poverty 关注贫穷的年度数值，原句 affecting deforestation 关注扶贫项目对森林砍伐的影响，二者都可能与扶贫项目有关，所以回到wanted to see后实际提出的问题。\u003c/p>\n\u003cp>原文的 affecting deforestation 已把要考察的结果明确写成森林砍伐。B的 annual rate of poverty 则把结果换成贫穷的某种年度比率。\u003c/p>\n\u003cp>原句用扶贫项目来解释森林变化，B把项目的类别当成结果指标，且增加了年度比率这一测量方式。\u003c/p>\n\u003cp>他先指出扶贫和环保不一定负相关，再在森林面积大且流失快的印尼考察项目；随后将项目推行时期与村庄年度森林损失相比较。\u003c/p>\n\u003cp>annual修饰forest loss，不能把逐年统计的对象换成贫困率。村庄和省份是森林研究覆盖范围，也不是全国年度脱贫统计。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro wanted to see if Indonesia&#39;s poverty-alleviation program was affecting deforestation.\u003c/p>\n\u003cp>他先指出扶贫和环保不一定负相关，再在森林面积大且流失快的印尼考察项目；随后将项目推行时期与村庄年度森林损失相比较。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回印尼，提出项目是否影响森林砍伐的考察。给出卫星数据与砍伐减少百分之三十的关联结果。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro intended to calculate Indonesia’s annual rate of poverty reduction.\u003c/p>\n\u003cp>费拉罗想计算印尼每年的减贫率。\u003c/p>\n\u003c/blockquote>\n\u003cp>annual修饰forest loss，不能把逐年统计的对象换成贫困率。村庄和省份是森林研究覆盖范围，也不是全国年度脱贫统计。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章关注项目效果，不能单独确定这项研究测量的变量；研究者想查什么，仍须由研究目的和数据对象确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>its annual rate of poverty alleviation\u003cbr>该国每年的减贫率\u003c/p>\n\u003c/blockquote>\n\u003cp>原句用扶贫项目来解释森林变化，B把项目的类别当成结果指标，且增加了年度比率这一测量方式。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转回印尼，提出项目是否影响森林砍伐的考察。给出卫星数据与砍伐减少百分之三十的关联结果。\u003c/p>\n\u003cp>本项最终仍要根据“affecting deforestation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. the role of its forests in climate change\u003c/h3>\n\u003cblockquote>\n\u003cp>该国森林在气候变化中的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 climate change 要接森林对气候的影响，而原句 poverty-alleviation program 指对森林施加影响的项目；两处都涉及森林的作用关系，所以回看wanted to see的主语、动作和对象。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>原文以 poverty-alleviation program 为影响的起点，研究其是否影响森林砍伐。C的 climate change 则让森林成为影响的起点，气候成为结果。森林虽在两种说法中都出现，前者问“项目到森林”，后者问“森林到气候”，具体两端已经不同；后一句介绍森林面积也没有把研究目的改成后一条关系。\u003c/p>\n\u003cp>C把中间共同出现的森林换了位置，还另加气候作为结果，未保留原句要研究的两个对象。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro wanted to see if Indonesia&#39;s poverty-alleviation program was affecting deforestation.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗研究印度尼西亚，是要弄清该国森林在气候变化中的作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 climate change 要接森林对气候的影响，而原句 poverty-alleviation program 指对森林施加影响的项目；两处都涉及森林的作用关系，所以回看wanted to see的主语、动作和对象。\u003c/p>\n\u003cp>原文以 poverty-alleviation program 为影响的起点，研究其是否影响森林砍伐。C的 climate change 则让森林成为影响的起点，气候成为结果。森林虽在两种说法中都出现，前者问“项目到森林”，后者问“森林到气候”，具体两端已经不同；后一句介绍森林面积也没有把研究目的改成后一条关系。\u003c/p>\n\u003cp>C把中间共同出现的森林换了位置，还另加气候作为结果，未保留原句要研究的两个对象。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro wanted to see if Indonesia&#39;s poverty-alleviation program was affecting deforestation.\u003c/p>\n\u003cp>他先指出扶贫和环保不一定负相关，再在森林面积大且流失快的印尼考察项目；随后将项目推行时期与村庄年度森林损失相比较。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回印尼，提出项目是否影响森林砍伐的考察。给出卫星数据与砍伐减少百分之三十的关联结果。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro’s main purpose was to assess the contribution of Indonesian forests to climate change.\u003c/p>\n\u003cp>费拉罗的主要目的是评估印尼森林对气候变化的作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>森林在气候中的地位解释研究的重要性，却不是卫星数据与CCT推行相比较的具体问题。研究主体关系是项目与森林损失，碳价值出现在后面的意义评价。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章关注项目效果，不能单独确定这项研究测量的变量；研究者想查什么，仍须由研究目的和数据对象确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the role of its forests in climate change\u003cbr>该国森林在气候变化中的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>C把中间共同出现的森林换了位置，还另加气候作为结果，未保留原句要研究的两个对象。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转回印尼，提出项目是否影响森林砍伐的考察。给出卫星数据与砍伐减少百分之三十的关联结果。\u003c/p>\n\u003cp>本项最终仍要根据“affecting deforestation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. the relation of CCTs to its forest loss\u003c/h3>\n\u003cblockquote>\n\u003cp>CCT项目与该国森林损失之间的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 forest loss 是森林损失，与第5段 affecting deforestation 所说影响砍伐相连；森林被砍伐会成为森林损失，因此回到wanted to see后的整句，确认关系的另一端。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文的 affecting deforestation 问项目是否影响森林砍伐，D的 forest loss 概括了砍伐所涉及的森林损失。关系的另一端仍是CCT，也就是原句Indonesia’s poverty-alleviation program。D没有换成项目接受程度、贫困比率或森林对气候的作用，两端和研究是否相联系的动作都能对上。\u003c/p>\n\u003cp>一个是可能起作用的项目，另一个是被考察的森林变化，D保留了这两个对象及两者间的联系。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro wanted to see if Indonesia&#39;s poverty-alleviation program was affecting deforestation.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗研究印度尼西亚，是要弄清CCT项目与该国森林损失之间的关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 forest loss 是森林损失，与第5段 affecting deforestation 所说影响砍伐相连；森林被砍伐会成为森林损失，因此回到wanted to see后的整句，确认关系的另一端。\u003c/p>\n\u003cp>原文的 affecting deforestation 问项目是否影响森林砍伐，D的 forest loss 概括了砍伐所涉及的森林损失。关系的另一端仍是CCT，也就是原句Indonesia’s poverty-alleviation program。D没有换成项目接受程度、贫困比率或森林对气候的作用，两端和研究是否相联系的动作都能对上。\u003c/p>\n\u003cp>一个是可能起作用的项目，另一个是被考察的森林变化，D保留了这两个对象及两者间的联系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro wanted to see if Indonesia&#39;s poverty-alleviation program was affecting deforestation.\u003c/p>\n\u003cp>他先指出扶贫和环保不一定负相关，再在森林面积大且流失快的印尼考察项目；随后将项目推行时期与村庄年度森林损失相比较。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回印尼，提出项目是否影响森林砍伐的考察。给出卫星数据与砍伐减少百分之三十的关联结果。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Ferraro examined whether CCT participation was associated with changes in forest loss.\u003c/p>\n\u003cp>费拉罗考察参与CCT是否与森林损失变化相关。\u003c/p>\n\u003c/blockquote>\n\u003cp>这保留了现金项目和森林损失两个变量，也与下一段减少30%的关联结果相接。选项不声称已经完全排除所有其他原因，因而没有超过研究在文中的表述。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章关注项目效果，不能单独确定这项研究测量的变量；研究者想查什么，仍须由研究目的和数据对象确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the relation of CCTs to its forest loss\u003cbr>CCT项目与该国森林损失之间的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>一个是可能起作用的项目，另一个是被考察的森林变化，D保留了这两个对象及两者间的联系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转回印尼，提出项目是否影响森林砍伐的考察。给出卫星数据与砍伐减少百分之三十的关联结果。\u003c/p>\n\u003cp>本项最终仍要根据“affecting deforestation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>28题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>28. D. the relation of CCTs to its forest loss\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：森林卫星资料没有测量居民对现金项目的接受意愿。\u003c/p>\n\u003cp>B：年度统计对象是森林损失，不是全国年度减贫率。\u003c/p>\n\u003cp>C：森林与气候的背景意义不能替代项目与砍伐的研究关系。\u003c/p>\n\u003cp>D：选项保留了扶贫项目和森林损失这两个研究变量。\u003c/p>\n\u003ch2>29题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Ferraro, the CCT program in Indonesia is most valuable in that ______.\u003cbr>根据Ferraro，印度尼西亚的CCT项目最有价值的是哪一点？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>价值评价题。题干要求判断“根据Ferraro，印度尼西亚的CCT项目最有价值的是哪一点？”，先按第7、8段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>That&#39;s likely because the rural poor are using the money as makeshift insurance policies against inclement weather, Ferraro says. Typically, if rains are delayed, people may clear land to plant more rice to supplement their harvests. With the CCTs, individuals instead can use the money to supplement their harvests.\u003c/p>\n\u003cp>Whether this research translates elsewhere is anybody&#39;s guess. Ferraro suggests the results may transfer to other parts of Asia, due to commonalities such as the importance of growing rice and market access. And regardless of transferability, the study shows that what&#39;s good for people may also be good for the environment. Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>现金可让家庭在收成不佳时不必多清林地，第8段进一步说，即便不计算减贫，单是避免砍伐的减排价值也超过成本；同时限制了向别处推广的把握。\u003c/p>\n\u003ch3>A. it will benefit other Asian countries\u003c/h3>\n\u003cblockquote>\n\u003cp>它将使其他亚洲国家受益\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 will benefit 说未来确定受益，第8段 may transfer 说研究结果可能移用到亚洲其他地区，两处都谈向外推广，所以回看段首关于推广的两句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文先说不确定能推广到哪里，再以may概括相似环境。will取消了这种条件与不确定性；即使可能推广，也不是末句用价值超过成本突出强调的核心好处。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Whether this research translates elsewhere is anybody&#39;s guess.\u003c/p>\n\u003cp>Ferraro suggests the results may transfer to other parts of Asia, due to commonalities such as the importance of growing rice and market access.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗认为印尼CCT项目最有价值之处在于它将使其他亚洲国家受益。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 will benefit 说未来确定受益，第8段 may transfer 说研究结果可能移用到亚洲其他地区，两处都谈向外推广，所以回看段首关于推广的两句。\u003c/p>\n\u003cp>原文先说能否移用于别处谁都说不准，再用 may transfer 表达一种可能。A的 will benefit 却把可能移用的研究结果，改成其他国家将确定受益的项目效果。\u003c/p>\n\u003cp>现金可让家庭在收成不佳时不必多清林地，第8段进一步说，即便不计算减贫，单是避免砍伐的减排价值也超过成本；同时限制了向别处推广的把握。\u003c/p>\n\u003cp>原文先说不确定能推广到哪里，再以may概括相似环境。will取消了这种条件与不确定性；即使可能推广，也不是末句用价值超过成本突出强调的核心好处。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第7、8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Whether this research translates elsewhere is anybody&#39;s guess.\u003c/p>\n\u003cp>Ferraro suggests the results may transfer to other parts of Asia, due to commonalities such as the importance of growing rice and market access.\u003c/p>\n\u003cp>现金可让家庭在收成不佳时不必多清林地，第8段进一步说，即便不计算减贫，单是避免砍伐的减排价值也超过成本；同时限制了向别处推广的把握。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：解释现金如何替代降雨推迟时清地多种水稻。限制推广结论并总结对人与环境的好处及价值。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Indonesian program will certainly deliver benefits in other Asian countries.\u003c/p>\n\u003cp>印尼项目必定会让其他亚洲国家受益。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文先说不确定能推广到哪里，再以may概括相似环境。will取消了这种条件与不确定性；即使可能推广，也不是末句用价值超过成本突出强调的核心好处。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认项目效果值得评价，不能单独决定哪一项最有价值；应以费拉罗的价值比较为准，保留推广范围及效果方向的限制。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>it will benefit other Asian countries\u003cbr>它将使其他亚洲国家受益\u003c/p>\n\u003c/blockquote>\n\u003cp>原文先说能否移用于别处谁都说不准，再用 may transfer 表达一种可能。A的 will benefit 却把可能移用的研究结果，改成其他国家将确定受益的项目效果。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：解释现金如何替代降雨推迟时清地多种水稻。限制推广结论并总结对人与环境的好处及价值。\u003c/p>\n\u003cp>本项最终仍要根据“carbon dioxide emissions alone”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. it will reduce regional inequality\u003c/h3>\n\u003cblockquote>\n\u003cp>它将减少地区不平等\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 regional inequality 说地区之间的差距，第8段 what’s good for people 说对人的好处，两者都涉及福利，因此回到研究总结及even if让步的两句，看作者实际比较什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>原文的 what’s good for people 与good for the environment并列，讨论人的利益和环境利益可以一致；最后还明确即使没有减贫，环境方面的价值也超过成本。B的 regional inequality 却把两类利益的联系换成地区之间的分配差距。贫困与地区间不平等不是同一指标，even if这句独立评价的是避免砍伐的价值，并非比较哪一个地区得到更多。\u003c/p>\n\u003cp>原文比较的是利益类别和项目成本，B比较不同地区的分配结果，替换了比较对象。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And regardless of transferability, the study shows that what&#39;s good for people may also be good for the environment.\u003c/p>\n\u003cp>Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>费拉罗认为印尼CCT项目最有价值之处在于它将减少地区不平等。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 regional inequality 说地区之间的差距，第8段 what’s good for people 说对人的好处，两者都涉及福利，因此回到研究总结及even if让步的两句，看作者实际比较什么。\u003c/p>\n\u003cp>原文的 what’s good for people 与good for the environment并列，讨论人的利益和环境利益可以一致；最后还明确即使没有减贫，环境方面的价值也超过成本。B的 regional inequality 却把两类利益的联系换成地区之间的分配差距。贫困与地区间不平等不是同一指标，even if这句独立评价的是避免砍伐的价值，并非比较哪一个地区得到更多。\u003c/p>\n\u003cp>原文比较的是利益类别和项目成本，B比较不同地区的分配结果，替换了比较对象。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第7、8段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>And regardless of transferability, the study shows that what&#39;s good for people may also be good for the environment.\u003c/p>\n\u003cp>Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003cp>现金可让家庭在收成不佳时不必多清林地，第8段进一步说，即便不计算减贫，单是避免砍伐的减排价值也超过成本；同时限制了向别处推广的把握。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：解释现金如何替代降雨推迟时清地多种水稻。限制推广结论并总结对人与环境的好处及价值。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The program’s greatest value lies in reducing inequality between regions.\u003c/p>\n\u003cp>项目最大的价值在于减少地区之间的不平等。\u003c/p>\n\u003c/blockquote>\n\u003cp>第2段减少不平等是最初政策目标，末段价值比较却以避免砍伐及碳排放为依据。地区差异更没有具体指标，不能用前文概括目标替代费拉罗此处最强调的效果。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The effects of a program.\u003cbr>一个项目的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认项目效果值得评价，不能单独决定哪一项最有价值；应以费拉罗的价值比较为准，保留推广范围及效果方向的限制。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>it will reduce regional inequality\u003cbr>它将减少地区不平等\u003c/p>\n\u003c/blockquote>\n\u003cp>原文比较的是利益类别和项目成本，B比较不同地区的分配结果，替换了比较对象。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：解释现金如何替代降雨推迟时清地多种水稻。限制推广结论并总结对人与环境的好处及价值。\u003c/p>\n\u003cp>本项最终仍要根据“carbon dioxide emissions alone”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. it can boost grain production\u003c/h3>\n\u003cblockquote>\n\u003cp>它能够提高粮食产量\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“it can [xxx] grain production”，保留了相应遮挡。当时的定位线索是：C的 grain production 提
