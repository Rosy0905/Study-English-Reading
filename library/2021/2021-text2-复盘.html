const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| mark | v.标志着 | in a row | phr.连续地 | Indonesia | n.印度尼西亚 |\n| bleak | adj.严峻的；令人沮丧的 | deforestation | n.森林砍伐 | slow | v.放慢 |\n| pace | n.速度；步伐 | turnaround | n.好转；转变 | country | n.国家 |\n| antipoverty | adj.反贫困的；扶贫的 |  |  |  |  |","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 2重点词与语境","focus":[85,135,925,319],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>mark\u003c/td>\n\u003ctd>v.标志着\u003c/td>\n\u003ctd>in a row\u003c/td>\n\u003ctd>phr.连续地\u003c/td>\n\u003ctd>Indonesia\u003c/td>\n\u003ctd>n.印度尼西亚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>bleak\u003c/td>\ ing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care. Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty. They're already used in dozens of countries worldwide. In Indonesia, the program has provided enough food and medicine to substantially reduce severe growth problems among children.","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,463,925,682],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-2-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care. Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty. They&#39;re already used in dozens of countries worldwide. In Indonesia, the program has provided enough food and medicine to substantially reduce severe growth problems among children.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 意群划分 · 第2段\n\nIn 2007, / Indonesia started phasing in / a program / that gives money / to its poorest residents / under certain conditions, / such as requiring people / to keep kids in school / or get regular medical care.\n\nCalled conditional cash transfers or CCTs, / these social assistance programs / are designed / to reduce inequality / and break the cycle of poverty.\n\nThey're already used / in dozens of countries / worldwide.\n\nIn Indonesia, / the program has provided / enough food and medicine / to substantially reduce / severe growth problems / among children.","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,463,925,682],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-2-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care. Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty. They&#39;re already used in dozens of countries worldwide. In Indonesia, the program has provided enough food and medicine to substantially reduce severe growth problems among children.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>In 2007, / Indonesia started phasing in / a program / that gives money / to its poorest residents / under certain conditions, / such as requiring people / to keep kids in school / or get regular medical care.\u003c/p>\n\u003cp>Called conditional cash transfers or CCTs, / these social assistance programs / are designed / to reduce inequality / and break the cycle of poverty.\u003c/p>\n\u003cp>They&#39;re already used / in dozens of countries / worldwide.\u003c/p>\n\u003cp>In Indonesia, / the program has provided / enough food and medicine / to substantially reduce / severe growth problems / among children.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 意群翻译 · 第2段\n\n在2007年，/ 印度尼西亚开始逐步实施 / 一个项目 / 给予金钱 / 给其最贫困的居民 / 在特定条件下，/ 比如要求人们 / 让孩子继续上学 / 或获得定期医疗护理。\n\n被称为有条件现金转移或CCTs，/ 这些社会援助项目 / 被设计 / 来减少不平等 / 并打破贫困循环。\n\n它们已经被使用 / 在数十个国家 / 全世界范围内。\n\n在印度尼西亚，/ 该项目已经提供了 / 足够的食物和药品 / 来大幅减少 / 严重的生长问题 / 在儿童中。","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,463,925,682],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-2-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care. Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty. They&#39;re already used in dozens of countries worldwide. In Indonesia, the program has provided enough food and medicine to substantially reduce severe growth problems among children.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>In 2007, / Indonesia started phasing in / a program / that gives money / to its poorest residents / under certain conditions, / such as requiring people / to keep kids in school / or get regular medical care.\u003c/p>\n\u003cp>Called conditional cash transfers or CCTs, / these social assistance programs / are designed / to reduce inequality / and break the cycle of poverty.\u003c/p>\n\u003cp>They&#39;re already used / in dozens of countries / worldwide.\u003c/p>\n\u003cp>In Indonesia, / the program has provided / enough food and medicine / to substantially reduce / severe growth problems / among children.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-2\">\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>在2007年，/ 印度尼西亚开始逐步实施 / 一个项目 / 给予金钱 / 给其最贫困的居民 / 在特定条件下，/ 比如要求人们 / 让孩子继续上学 / 或获得定期医疗护理。\u003c/p>\n\u003cp>被称为有条件现金转移或CCTs，/ 这些社会援助项目 / 被设计 / 来减少不平等 / 并打破贫困循环。\u003c/p>\n\u003cp>它们已经被使用 / 在数十个国家 / 全世界范围内。\u003c/p>\n\u003cp>在印度尼西亚，/ 该项目已经提供了 / 足够的食物和药品 / 来大幅减少 / 严重的生长问题 / 在儿童中。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 标准译文 · 第2段\n\n2007年，印度尼西亚开始逐步实施一个项目，在特定条件下向最贫困的居民发放现金，比如要求他们让孩子继续上学或获得定期医疗护理。这些被称为有条件现金转移（CCTs）的社会援助项目旨在减少不平等并打破贫困循环。它们已在全球数十个国家使用。在印度尼西亚，该项目已经提供了足够的食物和药品，大幅减少了儿童中的严重生长问题。","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,463,925,682],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-2-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care. Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty. They&#39;re already used in dozens of countries worldwide. In Indonesia, the program has provided enough food and medicine to substantially reduce severe growth problems among children.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>In 2007, / Indonesia started phasing in / a program / that gives money / to its poorest residents / under certain conditions, / such as requiring people / to keep kids in school / or get regular medical care.\u003c/p>\n\u003cp>Called conditional cash transfers or CCTs, / these social assistance programs / are designed / to reduce inequality / and break the cycle of poverty.\u003c/p>\n\u003cp>They&#39;re already used / in dozens of countries / worldwide.\u003c/p>\n\u003cp>In Indonesia, / the program has provided / enough food and medicine / to substantially reduce / severe growth problems / among children.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-2\">\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>在2007年，/ 印度尼西亚开始逐步实施 / 一个项目 / 给予金钱 / 给其最贫困的居民 / 在特定条件下，/ 比如要求人们 / 让孩子继续上学 / 或获得定期医疗护理。\u003c/p>\n\u003cp>被称为有条件现金转移或CCTs，/ 这些社会援助项目 / 被设计 / 来减少不平等 / 并打破贫困循环。\u003c/p>\n\u003cp>它们已经被使用 / 在数十个国家 / 全世界范围内。\u003c/p>\n\u003cp>在印度尼西亚，/ 该项目已经提供了 / 足够的食物和药品 / 来大幅减少 / 严重的生长问题 / 在儿童中。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-3\">\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>2007年，印度尼西亚开始逐步实施一个项目，在特定条件下向最贫困的居民发放现金，比如要求他们让孩子继续上学或获得定期医疗护理。这些被称为有条件现金转移（CCTs）的社会援助项目旨在减少不平等并打破贫困循环。它们已在全球数十个国家使用。在印度尼西亚，该项目已经提供了足够的食物和药品，大幅减少了儿童中的严重生长问题。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 完整原文 · 第3段\n\nBut CCT programs don't generally consider effects on the environment. In fact, poverty alleviation and environmental protection are often viewed as conflicting goals, says Paul Ferraro, an economist at Johns Hopkins University.","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1154,925,537],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-3-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>But CCT programs don&#39;t generally consider effects on the environment. In fact, poverty alleviation and environmental protection are often viewed as conflicting goals, says Paul Ferraro, an economist at Johns Hopkins University.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 意群划分 · 第3段\n\nBut CCT programs / don't generally conside ection class=\"revealPart\" id=\"focus-paragraph-3-2\">\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>但CCT项目 / 通常不考虑 / 对环境的影响。\u003c/p>\n\u003cp>事实上，/ 扶贫和环境保护 / 经常被视为 / 相互冲突的目标，/ 保罗·费拉罗说，/ 一位经济学家 / 在约翰霍普金斯大学。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-3\">\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>但CCT项目通常不考虑对环境的影响。约翰霍普金斯大学的经济学家保罗·费拉罗说，事实上，扶贫和环境保护经常被视为相互冲突的目标。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 完整原文 · 第4段\n\nThat's because economic growth can be correlated with environmental degradation, while protecting the environment is sometimes correlated with greater poverty. However, those correlations don't prove cause and effect. The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view. There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,1706,925,576],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-4-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>That&#39;s because economic growth can be correlated with environmental degradation, while protecting the environment is sometimes correlated with greater poverty. However, those correlations don&#39;t prove cause and effect. The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view. There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群划分 · 第4段\n\nThat's because / economic growth / can be correlated / with environmental degradation, / while protecting the environment / is sometimes correlated / with greater poverty.\n\nHowever, / those correlations / don't prove / cause and effect.\n\nThe only previous study / analyzing causality, / based on an area in Mexico / that had instituted CCTs, / supported the traditional view.\n\nThere, / as people got more money, / some of them / may have more cleared land / for cattle / to raise for meat, / Ferraro says.","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,1706,925,576],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-4-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>That&#39;s because economic growth can be correlated with environmental degradation, while protecting the environment is sometimes correlated with greater poverty. However, those correlations don&#39;t prove cause and effect. The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view. There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>That&#39;s because / economic growth / can be correlated / with environmental degradation, / while protecting the environment / is sometimes correlated / with greater poverty.\u003c/p>\n\u003cp>However, / those correlations / don&#39;t prove / cause and effect.\u003c/p>\n\u003cp>The only previous study / analyzing causality, / based on an area in Mexico / that had instituted CCTs, / supported the traditional view.\u003c/p>\n\u003cp>There, / as people got more money, / some of them / may have more cleared land / for cattle / to raise for meat, / Ferraro says.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群翻译 · 第4段\n\n那是因为 / 经济增长 / 可能相关 / 与环境退化，/ 而保护环境 / 有时相关 / 与更严重的贫困。\n\n然而，/ 这些相关性 / 不能证明 / 因果关系。\n\n唯一之前的研究 / 分析因果关系的，/ 基于墨西哥的一个地区 / 已经实施了CCTs的，/ 支持了传统观点。\n\n在那里，/ 当人们获得更多钱时，/ 他们中的一些人 / 可能更多地清理土地 / 为了牛 / 来饲养作肉用，/ 费拉罗说。","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,1706,925,576],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-4-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>That&#39;s because economic growth can be correlated with environmental degradation, while protecting the environment is sometimes correlated with greater poverty. However, those correlations don&#39;t prove cause and effect. The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view. There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>That&#39;s because / economic growth / can be correlated / with environmental degradation, / while protecting the environment / is sometimes correlated / with greater poverty.\u003c/p>\n\u003cp>However, / those correlations / don&#39;t prove / cause and effect.\u003c/p>\n\u003cp>The only previous study / analyzing causality, / based on an area in Mexico / that had instituted CCTs, / supported the traditional view.\u003c/p>\n\u003cp>There, / as people got more money, / some of them / may have more cleared land / for cattle / to raise for meat, / Ferraro says.\u003c/p>\n\u003c/secti re rice / to supplement their harvests.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第7段","level":3,"raw":"### 意群翻译 · 第7段\n\n那可能是因为 / 农村贫困人口 / 正在使用这些钱 / 作为临时保险政策 / 对抗恶劣天气，/ 费拉罗说。\n\n通常，/ 如果降雨延迟，/ 人们可能清理土地 / 来种植更多稻米 / 来补充他们的收成。","context":{"mode":"image","asset":"articleAnnotated","label":"第7段精读与翻译","focus":[85,3263,925,482],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-7-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-7-0\">\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>That&#39;s likely because the rural poor are using the money as makeshift insurance policies against inclement weather, Ferraro says. Typically, if rains are delayed, people may clear land to plant more rice to supplement their harvests.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-7-1\">\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>That&#39;s likely because / the rural poor / are using the money / as makeshift insurance policies / against inclement weather, / Ferraro says.\u003c/p>\n\u003cp>Typically, / if rains are delayed, / people may clear land / to plant more rice / to supplement their harvests.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-7-2\">\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>那可能是因为 / 农村贫困人口 / 正在使用这些钱 / 作为临时保险政策 / 对抗恶劣天气，/ 费拉罗说。\u003c/p>\n\u003cp>通常，/ 如果降雨延迟，/ 人们可能清理土地 / 来种植更多稻米 / 来补充他们的收成。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第7段","level":3,"raw":"### 标准译文 · 第7段\n\n费拉罗说，那可能是因为农村贫困人口正在将这些钱用作应对恶劣天气的临时保险。通常，如果降雨延迟，人们可能会清理土地来种植更多稻米以补充收成。","context":{"mode":"image","asset":"articleAnnotated","label":"第7段精读与翻译","focus":[85,3263,925,482],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-7-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-7-0\">\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>That&#39;s likely because the rural poor are using the money as makeshift insurance policies against inclement weather, Ferraro says. Typically, if rains are delayed, people may clear land to plant more rice to supplement their harvests.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-7-1\">\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>That&#39;s likely because / the rural poor / are using the money / as makeshift insurance policies / against inclement weather, / Ferraro says.\u003c/p>\n\u003cp>Typically, / if rains are delayed, / people may clear land / to plant more rice / to supplement their harvests.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-7-2\">\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>那可能是因为 / 农村贫困人口 / 正在使用这些钱 / 作为临时保险政策 / 对抗恶劣天气，/ 费拉罗说。\u003c/p>\n\u003cp>通常，/ 如果降雨延迟，/ 人们可能清理土地 / 来种植更多稻米 / 来补充他们的收成。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-7-3\">\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>费拉罗说，那可能是因为农村贫困人口正在将这些钱用作应对恶劣天气的临时保险。通常，如果降雨延迟，人们可能会清理土地来种植更多稻米以补充收成。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第8段","level":3,"raw":"### 完整原文 · 第8段\n\nWhether this research translates elsewhere is anybody's guess. Ferraro suggests the results may transfer to other parts of Asia, due to commonalities such as the importance of growing rice and market access. And regardless of transferability, the study shows that what's good for people may also be good for the environment. Even if this program didn't reduce poverty, Ferraro says, \"the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.\"","context":{"mode":"image","asset":"articleAnnotated","label":"第8段精读与翻译","focus":[85,3755,925,646],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-8","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-8-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-8-0\">\u003ch3>完整原文 · 第8段\u003c/h3>\n\u003cp>Whether this research translates elsewhere is anybody&#39;s guess. Ferraro suggests the results may transfer to other parts of Asia, due to commonalities such as the importance of growing rice and market access. And regardless of transferability, the study shows that what&#39;s good for people may also be good for the environment. Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第8段","level":3,"raw":"### 意群划分 · 第8段\n\nWhether this research / translates elsewhere / is anybody's guess.\n\nFerraro suggests / the results may transfer / to other parts of Asia, / due to commonalities / such as the importance / of growing rice / and market access.\n\nAnd regardless of transferability, / the study shows / that what's good for people / may also be good / for the environment.\n\nEven if this program / didn't reduce poverty, / Ferraro says, / \"the value of the avoided deforestation / just for carbon dioxide emissions alone / is more than / the program costs.\"","context":{"mode":"image","asset":"articleAnnotated","label":"第8段精读与翻译","focus":[85,3755,925,646],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-8","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-8-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-8-0\">\u003ch3>完整原文 · 第8段\u003c/h3>\n\u003cp>Whether this research translates elsewhere is anybody&#39;s guess. Ferraro suggests the results may transfer to other parts of Asia, due to commonalities such as the importance of growing rice and market access. And regardless of transferability, the study shows that what&#39;s good for people may also be good for the environment. Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-8-1\">\u003ch3>意群划分 · 第8段\u003c/h3>\n\u003cp>Whether this research / translates elsewhere / is anybody&#39;s guess.\u003c/p>\n\u003cp>Ferraro suggests / the results may transfer / to other parts of Asia, / due to commonalities / such as the importance / of growing rice / and market access.\u003c/p>\n\u003cp>And regardless of transferability, / the study shows / that what&#39;s good for people / may also be good / for the environment.\u003c/p>\n\u003cp>Even if this program / didn&#39;t reduce poverty, / Ferraro says, / &quot;the value of the avoided deforestation / just for carbon dioxide emissions alone / is more than / the program costs.&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第8段","level":3,"raw":"### 意群翻译 · 第8段\n\n这项研究是否 / 适用于其他地方 / 是任何人的猜测。\n\n费拉罗建议 / 结果可能转移 / 到亚洲其他地区，/ 由于共同点 / 比如重要性 / 种植水稻的 / 和市场准入。\n\n不管可转移性如何，/ 研究表明 / 对人有益的 / 可能也有益 / 对环境。\n\n即使这个项目 / 没有减少贫困，/ 费拉罗说，/ \"避免的森林砍伐的价值 / 仅就二氧化碳排放而言 / 就超过了 / 项目成本。\"","context":{"mode":"image","asset":"articleAnnotated","label":"第8段精读与翻译","focus":[85,3755,925,646],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-8","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-8-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-8-0\">\u003ch3>完整原文 · 第8段\u003c/h3>\n\u003cp>Whether this research translates elsewhere is anybody&#39;s guess. Ferraro suggests the results may transfer to other parts of Asia, due to commonalities such as the importance of growing rice and market access. And regardless of transferability, the study shows that what&#39;s good for people may also be good for the environment. Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-8-1\">\u003ch3>意群划分 · 第8段\u003c/h3>\n\u003cp>Whether this research / translates elsewhere / is anybody&#39;s guess.\u003c/p>\n\u003cp>Ferraro suggests / the results may transfer / to other parts of Asia, / due to commonalities / such as the importance / of growing rice / and market access.\u003c/p>\n\u003cp>And regardless of transferability, / the study shows / that what&#39;s good for people / may also be good / for the environment.\u003c/p>\n\u003cp>Even if this program / didn&#39;t reduce poverty, / Ferraro says, / &quot;the value of the avoided deforestation / just for carbon dioxide emissions alone / is more than / the program costs.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-8-2\">\u003ch3>意群翻译 · 第8段\u003c/h3>\n\u003cp>这项研究是否 / 适用于其他地方 / 是任何人的猜测。\u003c/p>\n\u003cp>费拉罗建议 / 结果可能转移 / 到亚洲其他地区，/ 由于共同点 / 比如重要性 / 种植水稻的 / 和市场准入。\u003c/p>\n\u003cp>不管可转移性如何，/ 研究表明 / 对人有益的 / 可能也有益 / 对环境。\u003c/p>\n\u003cp>即使这个项目 / 没有减少贫困，/ 费拉罗说，/ &quot;避免的森林砍伐的价值 / 仅就二氧化碳排放而言 / 就超过了 / 项目成本。&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第8段","level":3,"raw":"### 标准译文 · 第8段\n\n这项研究是否适用于其他地方还有待观察。费拉罗建议，由于种植水稻的重要性和市场准入等共同点，结果可能适用于亚洲其他地区。不管可转移性如何，研究表明对人有益的也可能对环境有益。费拉罗说，即使这个项目没有减少贫困，\"仅就二氧化碳排放而言，避免的森林砍伐的价值就超过了项目成本。\"","context":{"mode":"image","asset":"articleAnnotated","label":"第8段精读与翻译","focus":[85,3755,925,646],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-8","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-8-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-8-0\">\u003ch3>完整原文 · 第8段\u003c/h3>\n\u003cp>Whether this research translates elsewhere is anybody&#39;s guess. Ferraro suggests the results may transfer to other parts of Asia, due to commonalities such as the importance of growing rice and market access. And regardless of transferability, the study shows that what&#39;s good for people may also be good for the environment. Even if this program didn&#39;t reduce poverty, Ferraro says, &quot;the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-8-1\">\u003ch3>意群划分 · 第8段\u003c/h3>\n\u003cp>Whether this research / translates elsewhere / is anybody&#39;s guess.\u003c/p>\n\u003cp>Ferraro suggests / the results may transfer / to other parts of Asia, / due to commonalities / such as the importance / of growing rice / and market access.\u003c/p>\n\u003cp>And regardless of transferability, / the study shows / that what&#39;s good for people / may also be good / for the environment.\u003c/p>\n\u003cp>Even if this program / didn&#39;t reduce poverty, / Ferraro says, / &quot;the value of the avoided deforestation / just for carbon dioxide emissions alone / is more than / the program costs.&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-8-2\">\u003ch3>意群翻译 · 第8段\u003c/h3>\n\u003cp>这项研究是否 / 适用于其他地方 / 是任何人的猜测。\u003c/p>\n\u003cp>费拉罗建议 / 结果可能转移 / 到亚洲其他地区，/ 由于共同点 / 比如重要性 / 种植水稻的 / 和市场准入。\u003c/p>\n\u003cp>不管可转移性如何，/ 研究表明 / 对人有益的 / 可能也有益 / 对环境。\u003c/p>\n\u003cp>即使这个项目 / 没有减少贫困，/ 费拉罗说，/ &quot;避免的森林砍伐的价值 / 仅就二氧化碳排放而言 / 就超过了 / 项目成本。&quot;\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-8-3\">\u003ch3>标准译文 · 第8段\u003c/h3>\n\u003cp>这项研究是否适用于其他地方还有待观察。费拉罗建议，由于种植水稻的重要性和市场准入等共同点，结果可能适用于亚洲其他地区。不管可转移性如何，研究表明对人有益的也可能对环境有益。费拉罗说，即使这个项目没有减少贫困，&quot;仅就二氧化碳排放而言，避免的森林砍伐的价值就超过了项目成本。&quot;\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"文章的句内逻辑（大家自行根据需求阅读)","level":2,"raw":"## 文章的句内逻辑（大家自行根据需求阅读)\n\n我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\n\n符号的作用：\n\n- `→`：主要叙述继续向下推进；\n- `+`：并列；\n- `：`：解释、修饰或补充；\n- `//`：转折或对比；\n- 括号：把同一层的信息捆成一个整体。","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n"},{"section":"第二鸟 · 精读与翻译","title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n### 第1段\n\nLast year marked → the third year in a row：(of when Indonesia's bleak rate of deforestation → has slowed in pace).\n\nOne reason：(for the turnaround) → may be → the country's antipoverty program.\n\n### 第2段\n\nIn 2007 → Indonesia started phasing in → a program：(that gives money → to its poorest residents：(under certain conditions：(such as requiring people → to keep kids in school + get regular medical care))).\n\nCalled conditional cash transfers or CCTs → these social assistance programs → are designed：(to reduce inequality + break the cycle of poverty).\n\nThey're already used：(in dozens of countries：(worldwide)).\n\nIn Indonesia → the program has provided → enough food and medicine：(to substantially reduce → severe growth problems：(among children)).\n\n### 第3段\n\nBut CCT programs → don't generally consider → effects on the environment.\n\nIn fact → poverty alleviation and environmental protection → are often viewed：(as conflicting goals) → says Paul Ferraro：(an economist：(at Johns Hopkins University)).\n\n### 第4段\n\nThat's because → economic growth → can be correlated：(with environmental degradation) // while protecting the environment → is sometimes correlated：(with greater poverty).\n\nHowever → those correlations → don't prove → cause and effect.\n\nThe only previous study：(analyzing causality)：(based on an area in Mexico：(that had instituted CCTs)) → supported the traditional view.\n\nThere → as people got more money → some of them → may have more cleared land：(for cattle：(to raise for meat)) → Ferraro says.\n\n### 第5段\n\nSuch programs → do not have to → negatively affect → the environment // though.\n\nFerraro wanted to see：(if Indonesia's poverty-alleviation program → was affecting → deforestation).\n\nIndonesia has → the third-largest area：(of tropical forest：(in the world)) + one of the highest：(deforestation rates).\n\n### 第6段\n\nFerraro analyzed → satellite data：(showing annual forest loss：(from 2008 to 2012))：(including during Indonesia's phase-in：(of the antipoverty program))：(in 7,468 forested villages：(across 15 provinces)).\n\n\"We see：(that the program → is associated with → a 30 percent reduction：(in deforestation))\" → Ferraro says.\n\n### 第7段\n\nThat's likely because → the rural poor → are using the money：(as makeshift insurance policies：(against inclement weather)) → Ferraro says.\n\nTypically → if rains are delayed → people may clear land：(to plant more rice：(to supplement their harvests)).\n\n### 第8段\n\nWhether this research → translates elsewhere → is anybody's guess.\n\nFerraro suggests：(the results may transfer → to other parts of Asia)：(due to commonalities：(such as the importance：(of growing rice) + market access)).\n\nAnd regardless of transferability → the study shows：(that what's good for people → may also be good → for the environment).\n\nEven if this program → didn't reduce poverty → Ferraro says → \"the value of the avoided deforestation：(just for carbon dioxide emissions alone) → is more than → the program costs.\"","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>Last year marked → the third year in a row：(of when Indonesia&#39;s bleak rate of deforestation → has slowed in pace).\u003c/p>\n\u003cp>One reason：(for the turnaround) → may be → the country&#39;s antipoverty program.\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>In 2007 → Indonesia started phasing in → a program：(that gives money → to its poorest residents：(under certain conditions：(such as requiring people → to keep kids in school + get regular medical care))).\u003c/p>\n\u003cp>Called conditional cash transfers or CCTs → these social assistance programs → are designed：(to reduce inequality + break the cycle of poverty).\u003c/p>\n\u003cp>They&#39;re already used：(in dozens of countries：(worldwide)).\u003c/p>\n\u003cp>In Indonesia → the program has provided → enough food and medicine：(to substantially reduce → severe growth problems：(among children)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>But CCT programs → don&#39;t generally consider → effects on the environment.\u003c/p>\n\u003cp>In fact → poverty alleviation and environmental protection → are often viewed：(as conflicting goals) → says Paul Ferraro：(an economist：(at Johns Hopkins University)).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>That&#39;s because → economic growth → can be correlated：(with environmental degradation) // while protecting the environment → is sometimes correlated：(with greater poverty).\u003c/p>\n\u003cp>However → those correlations → don&#39;t prove → cause and effect.\u003c/p>\n\u003cp>The only previous study：(analyzing causality)：(based on an area in Mexico：(that had instituted CCTs)) → supported the traditional view.\u003c/p>\n\u003cp>There → as people got more money → some of them → may have more cleared land：(for cattle：(to raise for meat)) → Ferraro says.\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Such programs → do not have to → negatively affect → the environment // though.\u003c/p>\n\u003cp>Ferraro wanted to see：(if Indonesia&#39;s poverty-alleviation program → was affecting → deforestation).\u003c/p>\n\u003cp>Indonesia has → the third-largest area：(of tropical forest：(in the world)) + one of the highest：(deforestation rates).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Ferraro analyzed → satellite data：(showing annual forest loss：(from 2008 to 2012))：(including during Indonesia&#39;s phase-in：(of the antipoverty program))：(in 7,468 forested villages：(across 15 provinces)).\u003c/p>\n\u003cp>&quot;We see：(that the program → is associated with → a 30 percent reduction：(in deforestation))&quot; → Ferraro says.\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>That&#39;s likely because → the rural poor → are using the money：(as makeshift insurance policies：(against inclement weather)) → Ferraro says.\u003c/p>\n\u003cp>Typically → if rains are delayed → people may clear land：(to plant more rice：(to supplement their harvests)).\u003c/p>\n\u003ch3>第8段\u003c/h3>\n\u003cp>Whether this research → translates elsewhere → is anybody&#39;s guess.\u003c/p>\n\u003cp>Ferraro suggests：(the results may transfer → to other parts of Asia)：(due to commonalities：(such as the importance：(of growing rice) + market access)).\u003c/p>\n\u003cp>And regardless of transferability → the study shows：(that what&#39;s good for people → may also be good → for the environment).\u003c/p>\n\u003cp>Even if this program → didn&#39;t reduce poverty → Ferraro says → &quot;the value of the avoided deforestation：(just for carbon dioxide emissions alone) → is more than → the program costs.&quot;\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n去年标志着 → 连续第三年：(印度尼西亚严峻的森林砍伐率 → 放缓了速度)。\n\n一个原因：(对于这种转变) → 可能是 → 该国的反贫困项目。\n\n### 第2段\n\n在2007年 → 印度尼西亚开始逐步实施 → 一个项目：(给予金钱 → 给其最贫困的居民：(在特定条件下：(比如要求人们 → 让孩子继续上学 + 获得定期医疗护理)))。\n\n被称为有条件现金转移或CCTs → 这些社会援助项目 → 被设计：(来减少不平等 + 打破贫困循环)。\n\n它们已经被使用：(在数十个国家：(全世界范围内))。\n\n在印度尼西亚 → 该项目已经提供了 → 足够的食物和药品：(来大幅减少 → 严重的生长问题：(在儿童中))。\n\n### 第3段\n\n但CCT项目 → 通常不考虑 → 对环境的影响。\n\n事实上 → 扶贫和环境保护 → 经常被视为：(相互冲突的目标) → 保罗·费拉罗说：(一位经济学家：(在约翰霍普金斯大学))。\n\n### 第4段\n\n那是因为 → 经济增长 → 可能相关：(与环境退化) // 而保护环境 → 有时相关：(与更严重的贫困)。\n\n然而 → 这些相关性 → 不能证明 → 因果关系。\n\n唯一之前的研究：(分析因果关系的)：(基于墨西哥的一个地区：(已经实施了CCTs的)) → 支持了传统观点。\n\n在那里 → 当人们获得更多钱时 → 他们中的一些人 → 可能更多地清理土地：(为了牛：(来饲养作肉用)) → 费拉罗说。\n\n### 第5段\n\n这些项目 → 不必 → 负面影响 → 环境 // 然而。\n\n费拉罗想要看看：(印度尼西亚的扶贫项目是否 → 正在影响 → 森林砍伐)。\n\n印度尼西亚拥有 → 第三大面积：(热带森林的：(在世界上)) + 最高之一：(森林砍伐率)。\n\n### 第6段\n\n费拉罗分析了 → 卫星数据：(显示年度森林损失的：(从2008年到2012年))：(包括在印度尼西亚逐步实施期间：(反贫困项目的))：(在7468个森林村庄：(跨越15个省份))。\n\n\"我们看到：(该项目 → 与...相关 → 30%的减少：(在森林砍伐方面))\" → 费拉罗说。\n\n### 第7段\n\n那可能是因为 → 农村贫困人口 → 正在使用这些钱：(作为临时保险政策：(对抗恶劣天气)) → 费拉罗说。\n\n通常 → 如果降雨延迟 → 人们可能清理土地：(来种植更多稻米：(来补充他们的收成))。\n\n### 第8段\n\n这项研究是否 → 适用于其他地方 → 是任何人的猜测。\n\n费拉罗建议：(结果可能转移 → 到亚洲其他地区)：(由于共同点：(比如重要性：(种植水稻的) + 市场准入))。\n\n不管可转移性如何 → 研究表明：(对人有益的 → 可能也有益 → 对环境)。\n\n即使这个项目 → 没有减少贫困 → 费拉罗说 → \"避免的森林砍伐的价值：(仅就二氧化碳排放而言) → 就超过了 → 项目成本。\"","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>去年标志着 → 连续第三年：(印度尼西亚严峻的森林砍伐率 → 放缓了速度)。\u003c/p>\n\u003cp>一个原因：(对于这种转变) → 可能是 → 该国的反贫困项目。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>在2007年 → 印度尼西亚开始逐步实施 → 一个项目：(给予金钱 → 给其最贫困的居民：(在特定条件下：(比如要求人们 → 让孩子继续上学 + 获得定期医疗护理)))。\u003c/p>\n\u003cp>被称为有条件现金转移或CCTs → 这些社会援助项目 → 被设计：(来减少不平等 + 打破贫困循环)。\u003c/p>\n\u003cp>它们已经被使用：(在数十个国家：(全世界范围内))。\u003c/p>\n\u003cp>在印度尼西亚 → 该项目已经提供了 → 足够的食物和药品：(来大幅减少 → 严重的生长问题：(在儿童中))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>但CCT项目 → 通常不考虑 → 对环境的影响。\u003c/p>\n\u003cp>事实上 → 扶贫和环境保护 → 经常被视为：(相互冲突的目标) → 保罗·费拉罗说：(一位经济学家：(在约翰霍普金斯大学))。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>那是因为 → 经济增长 → 可能相关：(与环境退化) // 而保护环境 → 有
