仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>People in the 1890s avoided smiles because standing before a camera made them nervous.\u003c/p>\n\u003cp>十九世纪九十年代的人不笑，是因为面对相机会紧张。\u003c/p>\n\u003c/blockquote>\n\u003cp>早期难以保持表情不等于心理紧张，第4段还已排除技术慢这一障碍。要支持tension，作者需明确描述焦虑反应；牙齿糟糕并不能自动推出怕相机。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章寻找严肃表情的原因，不能直接确定1890年代仍成立的是哪种原因；必须把当时的技术条件与后续解释连起来。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Their tension before the camera.\u003cbr>他们面对相机时的紧张。\u003c/p>\n\u003c/blockquote>\n\u003cp>九十年代的技术已容易记录微笑，作者接着解释的是露出笑容的体面顾虑，C把原因换成面对设备的紧张。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。\u003c/p>\n\u003cp>本项最终仍要根据“mouths were often in a shocking state of hygiene”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Their distrust of new inventions.","level":3,"raw":"### D. Their distrust of new inventions.\n\n> 他们对新发明的不信任。\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D的 distrust of new inventions 会让我们回看第4段 introduction of the Box Brownie，那里确实介绍新相机，因此要看作者写新设备带来的究竟是拍摄便利还是人的怀疑。\n\n**错误类型：第三类——无中生有。**\n\n原文的 introduction of the Box Brownie 用来说明曝光更快，自然微笑可以更容易被记录；随后作者去找别的解释，第5段谈牙齿和体面。D的 distrust of new inventions 却把新设备当成使人不笑的心理原因。原句给新相机的作用是解除拍摄微笑的技术障碍，D则把它改成引起不信任、阻止微笑的对象。文中没有把hesitated的对象写成新发明，而是hesitated to smile。\n\n原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不愿微笑的心理障碍。\n\n**命题人借用的原文材料：**\n\n> But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today's digital standards, the exposure was almost instantaneous.\n>\n> One explanation might be the loss of dignity displayed through a cheesy grin.","context":{"mode":"image","asset":"questions","focus":[250,1614,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"33","option":"D"},"focusId":"focus-q33-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-D-0\">\u003cblockquote>\n\u003cp>他们对新发明的不信任。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 distrust of new inventions 会让我们回看第4段 introduction of the Box Brownie，那里确实介绍新相机，因此要看作者写新设备带来的究竟是拍摄便利还是人的怀疑。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 introduction of the Box Brownie 用来说明曝光更快，自然微笑可以更容易被记录；随后作者去找别的解释，第5段谈牙齿和体面。D的 distrust of new inventions 却把新设备当成使人不笑的心理原因。原句给新相机的作用是解除拍摄微笑的技术障碍，D则把它改成引起不信任、阻止微笑的对象。文中没有把hesitated的对象写成新发明，而是hesitated to smile。\u003c/p>\n\u003cp>原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不愿微笑的心理障碍。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today&#39;s digital standards, the exposure was almost instantaneous.\u003c/p>\n\u003cp>One explanation might be the loss of dignity displayed through a cheesy grin.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Their distrust of new inventions.","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 十九世纪九十年代，维多利亚时代的人拍照不笑，可能是因为他们对新发明的不信任。\n\nD的 distrust of new inventions 会让我们回看第4段 introduction of the Box Brownie，那里确实介绍新相机，因此要看作者写新设备带来的究竟是拍摄便利还是人的怀疑。\n\n原文的 introduction of the Box Brownie 用来说明曝光更快，自然微笑可以更容易被记录；随后作者去找别的解释，第5段谈牙齿和体面。D的 distrust of new inventions 却把新设备当成使人不笑的心理原因。原句给新相机的作用是解除拍摄微笑的技术障碍，D则把它改成引起不信任、阻止微笑的对象。文中没有把hesitated的对象写成新发明，而是hesitated to smile。\n\n原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不愿微笑的心理障碍。","context":{"mode":"image","asset":"questions","focus":[250,1614,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"33","option":"D"},"focusId":"focus-q33-D-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-D-0\">\u003cblockquote>\n\u003cp>他们对新发明的不信任。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 distrust of new inventions 会让我们回看第4段 introduction of the Box Brownie，那里确实介绍新相机，因此要看作者写新设备带来的究竟是拍摄便利还是人的怀疑。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 introduction of the Box Brownie 用来说明曝光更快，自然微笑可以更容易被记录；随后作者去找别的解释，第5段谈牙齿和体面。D的 distrust of new inventions 却把新设备当成使人不笑的心理原因。原句给新相机的作用是解除拍摄微笑的技术障碍，D则把它改成引起不信任、阻止微笑的对象。文中没有把hesitated的对象写成新发明，而是hesitated to smile。\u003c/p>\n\u003cp>原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不愿微笑的心理障碍。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today&#39;s digital standards, the exposure was almost instantaneous.\u003c/p>\n\u003cp>One explanation might be the loss of dignity displayed through a cheesy grin.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>十九世纪九十年代，维多利亚时代的人拍照不笑，可能是因为他们对新发明的不信任。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 distrust of new inventions 会让我们回看第4段 introduction of the Box Brownie，那里确实介绍新相机，因此要看作者写新设备带来的究竟是拍摄便利还是人的怀疑。\u003c/p>\n\u003cp>原文的 introduction of the Box Brownie 用来说明曝光更快，自然微笑可以更容易被记录；随后作者去找别的解释，第5段谈牙齿和体面。D的 distrust of new inventions 却把新设备当成使人不笑的心理原因。原句给新相机的作用是解除拍摄微笑的技术障碍，D则把它改成引起不信任、阻止微笑的对象。文中没有把hesitated的对象写成新发明，而是hesitated to smile。\u003c/p>\n\u003cp>原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不愿微笑的心理障碍。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Their distrust of new inventions.","level":4,"raw":"#### 写作视角法\n\n原文第4、5段是这样写的：\n\n> But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today's digital standards, the exposure was almost instantaneous.\n>\n> One explanation might be the loss of dignity displayed through a cheesy grin.\n>\n> 第4段明确当时相机已能迅速捕捉自然微笑，因此单靠早期长曝光解释不了；第5段转向露齿失体面，并说明当时牙齿卫生很差。\n\n把这一处放回全文，它承担的写作任务是：指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The Victorians refused to smile because they distrusted newly invented technology.\n>\n> 维多利亚人因不信任新发明而拒绝微笑。\n\n原文承认技术进步让自然表情更易捕捉，没有说人们怀疑相机可靠性或抵制发明。不能从新技术出现与旧习惯持续的先后关系补出不信任。","context":{"mode":"image","asset":"questions","focus":[250,1614,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"33","option":"D"},"focusId":"focus-q33-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-D-0\">\u003cblockquote>\n\u003cp>他们对新发明的不信任。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 distrust of new inventions 会让我们回看第4段 introduction of the Box Brownie，那里确实介绍新相机，因此要看作者写新设备带来的究竟是拍摄便利还是人的怀疑。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 introduction of the Box Brownie 用来说明曝光更快，自然微笑可以更容易被记录；随后作者去找别的解释，第5段谈牙齿和体面。D的 distrust of new inventions 却把新设备当成使人不笑的心理原因。原句给新相机的作用是解除拍摄微笑的技术障碍，D则把它改成引起不信任、阻止微笑的对象。文中没有把hesitated的对象写成新发明，而是hesitated to smile。\u003c/p>\n\u003cp>原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不 nation might be the loss of dignity displayed through a cheesy grin.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>十九世纪九十年代，维多利亚时代的人拍照不笑，可能是因为他们对新发明的不信任。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 distrust of new inventions 会让我们回看第4段 introduction of the Box Brownie，那里确实介绍新相机，因此要看作者写新设备带来的究竟是拍摄便利还是人的怀疑。\u003c/p>\n\u003cp>原文的 introduction of the Box Brownie 用来说明曝光更快，自然微笑可以更容易被记录；随后作者去找别的解释，第5段谈牙齿和体面。D的 distrust of new inventions 却把新设备当成使人不笑的心理原因。原句给新相机的作用是解除拍摄微笑的技术障碍，D则把它改成引起不信任、阻止微笑的对象。文中没有把hesitated的对象写成新发明，而是hesitated to smile。\u003c/p>\n\u003cp>原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不愿微笑的心理障碍。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4、5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today&#39;s digital standards, the exposure was almost instantaneous.\u003c/p>\n\u003cp>One explanation might be the loss of dignity displayed through a cheesy grin.\u003c/p>\n\u003cp>第4段明确当时相机已能迅速捕捉自然微笑，因此单靠早期长曝光解释不了；第5段转向露齿失体面，并说明当时牙齿卫生很差。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Victorians refused to smile because they distrusted newly invented technology.\u003c/p>\n\u003cp>维多利亚人因不信任新发明而拒绝微笑。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文承认技术进步让自然表情更易捕捉，没有说人们怀疑相机可靠性或抵制发明。不能从新技术出现与旧习惯持续的先后关系补出不信任。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章寻找严肃表情的原因，不能直接确定1890年代仍成立的是哪种原因；必须把当时的技术条件与后续解释连起来。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Their distrust of new inventions.\u003cbr>他们对新发明的不信任。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不愿微笑的心理障碍。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。\u003c/p>\n\u003cp>本项最终仍要根据“mouths were often in a shocking state of hygiene”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"33题结论","level":2,"raw":"### 33题结论\n\n> **33. A. Their unhealthy dental condition.**\n\nA：技术改善后坏牙仍可能让露齿失体面，符合年代和原因限定。\n\nB：体面规范没有被原文写成天生的社交敏感性。\n\nC：长曝光下难保持表情不等于面对相机心理紧张。\n\nD：新技术出现没有被写成人们不信任新发明的原因。","context":{"mode":"image","asset":"questions","focus":[250,1264,1800,429],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"question":"33","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>33. A. Their unhealthy dental condition.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：技术改善后坏牙仍可能让露齿失体面，符合年代和原因限定。\u003c/p>\n\u003cp>B：体面规范没有被原文写成天生的社交敏感性。\u003c/p>\n\u003cp>C：长曝光下难保持表情不等于面对相机心理紧张。\u003c/p>\n\u003cp>D：新技术出现没有被写成人们不信任新发明的原因。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"34题 · 题干、题型与核心出处","level":2,"raw":"## 34题\n\n> Mark Twain is quoted to show that the disapproval of smiles in pictures was ______.  \n> 引用Mark Twain的话，是为了说明反对照片中微笑是一种怎样的看法？\n\n### 题型\n\n引语作用题。题干要求判断“引用Mark Twain的话，是为了说明反对照片中微笑是一种怎样的看法？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> A toothy grin (especially when there were gaps or blackened teeth) lacked class: drunks, tramps and music hall performers might gurn and grin with a smile as wide as Lewis Carroll's gum-exposing Cheshire Cat, but it was not a becoming look for properly bred persons. Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be \"nothing more damning than a silly, foolish smile fixed forever\".\n\n本段先解释露齿大笑被视为缺乏格调，再以even Mark Twain强调：连以喜爱笑著称的人也不愿留下被后代看作傻笑的永久照片。","context":{"mode":"image","asset":"questions","focus":[250,1774,1800,514],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"question":"34","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Mark Twain is quoted to show that the disapproval of smiles in pictures was ______.\u003cbr>引用Mark Twain的话，是为了说明反对照片中微笑是一种怎样的看法？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>引语作用题。题干要求判断“引用Mark Twain的话，是为了说明反对照片中微笑是一种怎样的看法？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>A toothy grin (especially when there were gaps or blackened teeth) lacked class: drunks, tramps and music hall performers might gurn and grin with a smile as wide as Lewis Carroll&#39;s gum-exposing Cheshire Cat, but it was not a becoming look for properly bred persons. Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段先解释露齿大笑被视为缺乏格调，再以even Mark Twain强调：连以喜爱笑著称的人也不愿留下被后代看作傻笑的永久照片。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. a thought-provoking idea","level":3,"raw":"### A. a thought-provoking idea\n\n> 一种发人深省的想法\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 thought-provoking idea 要看引语是否提出一种让人重新思考的新想法，所以回看第6段 Even Mark Twain 怎样接在 not a becoming look 后面。\n\n**错误类型：第三类——无中生有。**\n\n原文的 Even Mark Twain 表示连这个喜欢大笑的人也持类似看法，前面还先给出不适合有教养者的社会评价。A的 thought-provoking idea 却把引用功能变成提出一个值得重新思索的观点。Twain的反差在于他日常爱笑，却仍然不赞成照片里的傻笑，并不是他的说法引起了思想转折。\n\nTwain在这里继续证实前面已经写出的社会评价，A把强化既有看法的例子改成引发新思考的观点。\n\n**命题人借用的原文材料：**\n\n> Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be \"nothing more damning than a silly, foolish smile fixed forever\".","context":{"mode":"image","asset":"questions","focus":[250,1953,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"A"},"focusId":"focus-q34-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-A-0\">\u003cblockquote>\n\u003cp>一种发人深省的想法\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 thought-provoking idea 要看引语是否提出一种让人重新思考的新想法，所以回看第6段 Even Mark Twain 怎样接在 not a becoming look 后面。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 Even Mark Twain 表示连这个喜欢大笑的人也持类似看法，前面还先给出不适合有教养者的社会评价。A的 thought-provoking idea 却把引用功能变成提出一个值得重新思索的观点。Twain的反差在于他日常爱笑，却仍然不赞成照片里的傻笑，并不是他的说法引起了思想转折。\u003c/p>\n\u003cp>Twain在这里继续证实前面已经写出的社会评价，A把强化既有看法的例子改成引发新思考的观点。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. a thought-provoking idea","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 引用马克·吐温，是为了说明拍照不宜微笑的观念一种发人深省的想法。\n\nA的 thought-provoking idea 要看引语是否提出一种让人重新思考的新想法，所以回看第6段 Even Mark Twain 怎样接在 not a becoming look 后面。\n\n原文的 Even Mark Twain 表示连这个喜欢大笑的人也持类似看法，前面还先给出不适合有教养者的社会评价。A的 thought-provoking idea 却把引用功能变成提出一个值得重新思索的观点。Twain的反差在于他日常爱笑，却仍然不赞成照片里的傻笑，并不是他的说法引起了思想转折。\n\nTwain在这里继续证实前面已经写出的社会评价，A把强化既有看法的例子改成引发新思考的观点。","context":{"mode":"image","asset":"questions","focus":[250,1953,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":fa wain也反对傻笑强调观念影响。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Twain is quoted primarily to make readers reconsider a stimulating philosophical idea.\n>\n> 引用吐温，主要为了让读者重新思考一种有启发性的哲学观念。\n\n这需要把引语作为待讨论的思想展开。实际even点出出人意料的认同者，用他的反差证明不宜笑的规范有多强，而不是评价引语能否激发思考。","context":{"mode":"image","asset":"questions","focus":[250,1953,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"34","option":"A"},"focusId":"focus-q34-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q34-A-0\">\u003cblockquote>\n\u003cp>一种发人深省的想法\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 thought-provoking idea 要看引语是否提出一种让人重新思考的新想法，所以回看第6段 Even Mark Twain 怎样接在 not a becoming look 后面。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 Even Mark Twain 表示连这个喜欢大笑的人也持类似看法，前面还先给出不适合有教养者的社会评价。A的 thought-provoking idea 却把引用功能变成提出一个值得重新思索的观点。Twain的反差在于他日常爱笑，却仍然不赞成照片里的傻笑，并不是他的说法引起了思想转折。\u003c/p>\n\u003cp>Twain在这里继续证实前面已经写出的社会评价，A把强化既有看法的例子改成引发新思考的观点。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用马克·吐温，是为了说明拍照不宜微笑的观念一种发人深省的想法。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 thought-provoking idea 要看引语是否提出一种让人重新思考的新想法，所以回看第6段 Even Mark Twain 怎样接在 not a becoming look 后面。\u003c/p>\n\u003cp>原文的 Even Mark Twain 表示连这个喜欢大笑的人也持类似看法，前面还先给出不适合有教养者的社会评价。A的 thought-provoking idea 却把引用功能变成提出一个值得重新思索的观点。Twain的反差在于他日常爱笑，却仍然不赞成照片里的傻笑，并不是他的说法引起了思想转折。\u003c/p>\ raits.\u003c/p>\n\u003cp>即使喜爱笑的人，也接受了肖像中不宜笑的强大规范。\u003c/p>\n\u003c/blockquote>\n\u003cp>even与known love of laughter构成让步反差：最可能不遵守的人也受影响，说明观念根深蒂固。这个推断依赖人物特征与态度的关系，不只是看到一句反对微笑的话。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨要求解释不笑的习惯，吐温应为某种原因提供支持；但引语是在说明观念影响深、评价其错误还是展示争议，仍取决于引语前的人物限定。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a deep-rooted belief\u003cbr>一种根深蒂固的观念\u003c/p>\n\u003c/blockquote>\n\u003cp>Twain本来似乎更可能赞成笑，却仍在肖像问题上接受同样的禁忌，使根深蒂固这一描述有了具体支持。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。\u003c/p>\n\u003cp>本项最终仍要根据“Even Mark Twain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. a misguided attitude","level":3,"raw":"### C. a misguided attitude\n\n> 一种错误的态度\n\n**做题模式中的状态：** 第一轮C保留。当时选项呈现为“a [xxx] attitude”，保留了相应遮挡。当时的定位线索是：C的 attitude 指反对微笑的态度，对应第6段 not a becoming look 和 silly, foolish smile，两处都在评价照片里的笑容，所以回看这一社会评价怎样接到Twain的引语。读完全文后，做题模式再经交叉验证排除C，最终选择B。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\nmisguided是“错误的、受误导的”，C判断反对拍照微笑这种态度本身不正确。原文引用吐温并没有随后反驳他，而是用Even突出一个爱笑的人在正式肖像中也不愿笑。\n\n爱笑是人物本来可能成为例外的条件，仍遵守规范才显示规范深植人心。引语证明的是观念的影响强度，而不是作者对观念真假的裁决；把今天对微笑的喜好带进去，不能替代例证在本段的功能。\n\n**命题人借用的原文材料：**\n\n> Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be \"nothing more damning than a silly, foolish smile fixed forever\".","context":{"mode":"image","asset":"questions","focus":[250,2123,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","quest kquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Twain’s statement is used to show that Victorians were divided over smiling in photographs.\u003c/p>\n\u003cp>吐温的说法被用来说明当时人对拍照微笑存在分歧。\u003c/p>\n\u003c/blockquote>\n\u003cp>争议需要同时呈现支持与反对的阵营。这里even把看似可能例外的人也纳入同一观念，作用是扩大共识强度，而不是建立对立。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q34-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨要求解释不笑的习惯，吐温应为某种原因提供支持；但引语是在说明观念影响深、评价其错误还是展示争议，仍取决于引语前的人物限定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a controversial view\u003cbr>一种有争议的看法\u003c/p>\n\u003c/blockquote>\n\u003cp>Twain对肖像的评价与前文一致，差别在日常生活和正式照片的场合，D把场合反差误写成观点争议。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。\u003c/p>\n\u003cp>本项最终仍要根据“Even Mark Twain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"34题结论","level":2,"raw":"### 34题结论\n\n> **34. B. a deep-rooted belief**\n\nA：引语用于证明规范的影响，作者没有以启发思考作为例证结论。\n\nB：连爱笑的吐温也遵守禁忌，显示这种观念根深蒂固。\n\nC：解释观念影响不等于作者借引语判定观念错误。\n\nD：连可能的例外也遵从是在加强共识，不是在呈现两派争论。","context":{"mode":"image","asset":"questions","focus":[250,1774,1800,514],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"question":"34","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>34. B. a deep-rooted belief\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：引语用于证明规范的影响，作者没有以启发思考作为例证结论。\u003c/p>\n\u003cp>B：连爱笑的吐温也遵守禁忌，显示这种观念根深蒂固。\u003c/p>\n\u003cp>C：解释观念影响不等于作者借引语判定观念错误。\u003c/p>\n\u003cp>D：连可能的例外也遵从是在加强共识，不是在呈现两派争论。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：研究发现与公众反应**（段落1核心发现） 作者的研究：寻找维多利亚时代微笑照片（打破19世纪拘谨形象）→ 推特发布引起轰动 → 公众反应：【惊讶发现维多利亚人也会笑 → 通过笑的共同体验，维多利亚人变得更有人性】\n\n↓（承认局限性）\n\n**逻辑层次2：微笑照片的稀少性**（段落2现象描述） 事实承认：微笑照片只占极小比例（1840-1900年间）→ 大多数照片特征：【悲惨僵硬的姿势 + 茫然的凝视】→ 提出问题：如何解释这种趋势？\n\n↓（技术原因分析）\n\n**逻辑层次3：早期技术限制**（段落3-4技术发展） 早期（1840s-1850s）：【银版照相法曝光需几分钟 → 保持微笑太困难 → 茫然凝视成为常态】// 后期（1880s-1890s）：【曝光时间大大缩短 + 便携相机出现 → 捕捉微笑变得容易】→ 新问题：为什么1890s维多利亚人仍不愿微笑？\n\n↓（社会文化原因）\n\n**逻辑层次4：社会观念与牙齿健康**（段落5-6深层原因） 尊严观念：咧嘴笑被视为失去尊严 → 牙齿问题：【维多利亚格言：\"嘴唇是用来遮掩牙齿的\" → 牙科不发达导致口腔卫生差 → 好牙齿是富人专属且不能保证】→ 阶级观念：【露齿笑缺乏品位（醉汉、流浪汉、表演者的标志）// 不适合有教养的人】→ 权威支持：马克·吐温也反对照片中的傻笑\n\n↑（全文主旨）\n\n全文核心观点：维多利亚时代照片中人们很少微笑，不仅因为早期技术限制，更重要的是社会文化因素——微笑（尤其是露齿笑）被视为失去尊严、缺乏品位的表现，这与当时糟糕的牙齿健康状况和严格的阶级观念密切相关。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：研究发现与公众反应\u003c/strong>（段落1核心发现） 作者的研究：寻找维多利亚时代微笑照片（打破19世纪拘谨形象）→ 推特发布引起轰动 → 公众反应：【惊讶发现维多利亚人也会笑 → 通过笑的共同体验，维多利亚人变得更有人性】\u003c/p>\n\u003cp>↓（承认局限性）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：微笑照片的稀少性\u003c/strong>（段落2现象描述） 事实承认：微笑照片只占极小比例（1840-1900年间）→ 大多数照片特征：【悲惨僵硬的姿势 + 茫然的凝视】→ 提出问题：如何解释这种趋势？\u003c/p>\n\u003cp>↓（技术原因分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：早期技术限制\u003c/strong>（段落3-4技术发展） 早期（1840s-1850s）：【银版照相法曝光需几分钟 → 保持微笑太困难 → 茫然凝视成为常态】// 后期（1880s-1890s）：【曝光时间大大缩短 + 便携相机出现 → 捕捉微笑变得容易】→ 新问题：为什么1890s维多利亚人仍不愿微笑？\u003c/p>\n\u003cp>↓（社会文化原因）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：社会观念与牙齿健康\u003c/strong>（段落5-6深层原因） 尊严观念：咧嘴笑被视为失去尊严 → 牙齿问题：【维多利亚格言：&quot;嘴唇是用来遮掩牙齿的&quot; → 牙科不发达导致口腔卫生差 → 好牙齿是富人专属且不能保证】→ 阶级观念：【露齿笑缺乏品位（醉汉、流浪汉、表演者的标志）// 不适合有教养的人】→ 权威支持：马克·吐温也反对照片中的傻笑\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：维多利亚时代照片中人们很少微笑，不仅因为早期技术限制，更重要的是社会文化因素——微笑（尤其是露齿笑）被视为失去尊严、缺乏品位的表现，这与当时糟糕的牙齿健康状况和严格的阶级观念密切相关。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n【答案】F. An Exception Can Challenge an Impression\n\n> 例外也能挑战既有印象\n\n这一部分区分微笑照片改变印象的作用和它们在总体中的比例，保留对多数严肃肖像的疑问。\n\n先看少数微笑照片对今天观看者的作用：\n\n> interrupts the assumption that distant ancestors lacked familiar emotions\n\n它们打断“遥远古人没有熟悉情感”的假设，使历史人物与当代经验相连。作用是改变印象，而不是证明数量很多。\n\n随后Yet加入哪项限制：\n\n> a small fraction of the surviving record\n\n这类收藏可能只占留存照片的一小部分。心理上的冲击力大，不等于统计上代表常态，后句直接把二者分开。\n\n结尾保留了什么未解问题：\n\n> why formal portraits so often concealed it\n\n微笑证明古人有欢笑，却仍需解释正式肖像为什么常把它藏起来。it回指laughter，不是说照片掩盖了某种摄影技术。\n\n这一部分的推进关系是：\n\n> 微笑旧照使人惊讶 → 打破古人没有熟悉情感的印象 → 数量少仍不能代表常态 → 转问正式肖像为何常不呈现欢笑\n\nException对应small fraction，Challenge an Impression对应interrupts the assumption。Can保留少数例子改变认识的能力，但没有把例外夸大成多数，贴合段中的双重限定。\n\n再看最强干扰项C：A Society without Laughter。\n\nA Society without Laughter把多数肖像严肃当成整个社会没有笑。段末却明确They show that laughter existed，正在区分照片的常见表情与现实人的情感，因此该标题把被反驳的印象误当成结论。\n\n**41题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】F. An Exception Can Challenge an Impression\u003c/p>\n\u003cblockquote>\n\u003cp>例外也能挑战既有印象\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分区分微笑照片改变印象的作用和它们在总体中的比例，保留对多数严肃肖像的疑问。\u003c/p>\n\u003cp>先看少数微笑照片对今天观看者的作用：\u003c/p>\n\u003cblockquote>\n\u003cp>interrupts the assumption that distant ancestors lacked familiar emotions\u003c/p>\n\u003c/blockquote>\n\u003cp>它们打断“遥远古人没有熟悉情感”的假设，使历史人物与当代经验相连。作用是改变印象，而不是证明数量很多。\u003c/p>\n\u003cp>随后Yet加入哪项限制：\u003c/p>\n\u003cblockquote>\n\u003cp>a small fraction of the surviving record\u003c/p>\n\u003c/blockquote>\n\u003cp>这类收藏可能只占留存照片的一小部分。心理上的冲击力大，不等于统计上代表常态，后句直接把二者分开。\u003c/p>\n\u003cp>结尾保留了什么未解问题：\u003c/p>\n\u003cblockquote>\n\u003cp>why formal portraits so often concealed it\u003c/p>\n\u003c/blockquote>\n\u003cp>微笑证明古人有欢笑，却仍需解释正式肖像为什么常把它藏起来。it回指laughter，不是说照片掩盖了某种摄影技术。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>微笑旧照使人惊讶 → 打破古人没有熟悉情感的印象 → 数量少仍不能代表常态 → 转问正式肖像为何常不呈现欢笑\u003c/p>\n\u003c/blockquote>\n\u003cp>Exception对应small fraction，Challenge an Impression对应interrupts the assumption。Can保留少数例子改变认识的能力，但没有把例外夸大成多数，贴合段中的双重限定。\u003c/p>\n\u003cp>再看最强干扰项C：A Society without Laughter。\u003c/p>\n\u003cp>A Society without Laughter把多数肖像严肃当成整个社会没有笑。段末却明确They show that laughter existed，正在区分照片的常见表情与现实人的情感，因此该标题把被反驳的印象误当成结论。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】E. The Practical Difficulty of Holding a Smile\n\n> 保持笑容的实际困难\n\n这一部分将早期不笑解释为长曝光下维持静止的实际选择，不以不快乐作为必要前提。\n\n先明确早期拍摄对人物提出的要求：\n\n> remain still while the image was recorded\n\n成像期间必须尽量不动，为下面笑容难以保持提供技术前提。不是泛泛说古人拍照紧张。\n\n再比较生活中的笑与拍摄中的固定表情：\n\n> difficult to hold unchanged for a prolonged exposure\n\n短暂笑一下容易，长曝光全程维持不变却困难；头部或身体调整还会使画面模糊，因此平淡表情有实际优势。\n\n结尾限定这条解释适用于哪个层面：\n\n> the demands of the process\n\n解释对象是拍摄工艺的要求，不是人物是否幸福、有没有幽默感。最后一句专门阻止从表情反推内心。\n\n这一部分的推进关系是：\n\n> 曝光时需要静止 → 笑容难以长时间不变 → 移动可能模糊成像 → 中性表情更实用，但不代表人物没有快乐\n\nHolding a Smile对应hold unchanged，Practical Difficulty对应长曝光、移动模糊与维持表情的努力。标题准确限定为操作困难，不把技术约束扩大成整个社会的性格。\n\n再看最强干扰项C：A Society without Laughter。\n\n没有欢笑的社会把拍摄时不笑推成生活中不会笑。本段恰说普通谈话中的brief laugh容易，而且最后否定需要用unhappy解释；不笑在这里是工艺选择，不是情感缺失。\n\n**42题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】E. The Practical Difficulty of Holding a Smile\u003c/p>\n\u003cblockquote>\n\u003cp>保持笑容的实际困难\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分将早期不笑解释为长曝光下维持静止的实际选择，不以不快乐作为必要前提。\u  that survived说明设备进步没有自动清除习惯，不能把反事实前提当成作者认可的规律。\n\n**43题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】A. A Faster Camera Does Not Explain Every Face\u003c/p>\n\u003cblockquote>\n\u003cp>更快的相机解释不了所有表情\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分用曝光变快而严肃仍存检验技术解释，把研究转向持续存在的社会期待。\u003c/p>\n\u003cp>时间变化首先削弱了什么解释：\u003c/p>\n\u003cblockquote>\n\u003cp>the old technical explanation became incomplete\u003c/p>\n\u003c/blockquote>\n\u003cp>曝光缩短后，自然表情更容易记录，早期工艺原因便不再充分。incomplete不是说早期长曝光从不存在。\u003c/p>\n\u003cp>中间用条件假设检查“技术决定一切”：\u003c/p>\n\u003cblockquote>\n\u003cp>If speed alone determined the face in a photograph\u003c/p>\n\u003c/blockquote>\n\u003cp>假如只有速度决定表情，每次设备改进都应带来笑容；实际不少正式肖像仍不笑，因而需要额外原因。\u003c/p>\n\u003cp>结尾指出研究视线应移往何处：\u003c/p>\n\u003cblockquote>\n\u003cp>the expectations that survived after the camera could record a smile\u003c/p>\n\u003c/blockquote>\n\u003cp>技术障碍降低后仍保留的社会期待成为解释对象。相机能拍到，与人们愿不愿以此示人，是不同条件。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>曝光变快 → 技术原因不再充分 → 严肃肖像仍然持续 → 从设备能力转查人物呈现自己的社会期待\u003c/p>\n\u003c/blockquote>\n\u003cp>Faster Camera对应shorter exposures，Does Not Explain Every Face对应incomplete与continued absence。标题不是否定技术影响，而是拒绝它包办所有年代、所有表情的解释。\u003c/p>\n\u003cp>再看最强干扰项G：Technology Automatically Changes Habits。\u003c/p>\n\u003cp>Technology Automatically Changes Habits恰好是If speed alone构造后被检验出不足的假设。continued absence与expectations that survived说明设备进步没有自动清除习惯，不能把反事实前提当成作者认可的规律。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】B. The Social Meaning of Showing One’s Teeth\n\n> 露齿的社会含义\n\n这一部分把牙齿外观与体面规范连接，说明露齿如何被解读成身份信息。\n\n作者先补充身体层面的顾虑：\n\n> Poor dental health could make an open smile embarrassing\n\n牙齿状况差会使露齿尴尬，这是实际外貌问题；while随后引入另一种社会约束，不能只停在医学解释。\n\n再看大笑与什么身份相联系：\n\n> people thought to lack refinement\n\n露齿大笑可能被归给表演者或被认为不够文雅的人，thought强调这是社会评价，不是笑容真的证明人的品质。\n\n结尾把两种约束合起来：\n\n> a statement about status\n\n牙齿本身不好看与露出来暗示错误身份共同作用，使正式肖像成为社会身份的表达；相机再快也不能直接解除这种顾虑。\n\n这一部分的推进关系是：\n\n> 坏牙使露齿尴尬 → 体面规范再加约束 → 大笑可能暗示不被认可的身份 → 正式肖像因社会含义而避免露齿\n\nShowing One’s Teeth覆盖牙齿外露的动作，Social Meaning对应refinement、wrong kind of person与status。标题统摄身体状况如何被社会阅读，比只谈牙齿卫生更完整。\n\n再看最强干扰项E：The Practical Difficulty of Holding a Smile。\n\n保持笑容的实际困难解释的是曝光期间维持不动。本段已明确even if the camera was fast enough，重点是表情会被看成什么身份；技术上能做到与社会上愿意做不能混同。\n\n**44题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】B. The Social Meaning of Showing One’s Teeth\u003c/p>\n\u003cblockquote>\n\u003cp>露齿的社会含义\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把牙齿外观与体面规范连接，说明露齿如何被解读成身份信息。\u003c/p>\n\u003cp>作者先补充身体层面的顾虑：\u003c/p>\n\u003cblockquote>\n\u003cp>Poor dental health could make an open smile embarrassing\u003c/p>\n\u003c/blockquote>\n\u003cp>牙齿状况差会使露齿尴尬，这是实际外貌问题；while随后引入另一种社会约束，不能只停在医学解释。\u003c/p>\n\u003cp>再看大笑与什么身份相联系：\u003c/p>\n\u003cblockquote>\n\u003cp>people thought to lack refinement\u003c/p>\n\u003c/blockquote>\n\u003cp>露齿大笑可能被归给表演者或被认为不够文雅的人，thought强调这是社会评价，不是笑容真的证明人的品质。\u003c/p>\n\u003cp>结尾把两种约束合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>a statement about status\u003c/p>\n\u003c/blockquote>\n\u003cp>牙齿本身不好看与露出来暗示错误身份共同作用，使正式肖像成为社会身份的表达；相机再快也不能直接解除这种顾虑。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>坏牙使露齿尴尬 → 体面规范再加约束 → 大笑可能暗示不被认可的身份 → 正式肖像因社会含义而避免露齿\u003c/p>\n\u003c/blockquote>\n\u003cp>Showing One’s Teeth覆盖牙齿外露的动作，Social Meaning对应refinement、wrong kind of person与status。标题统摄身体状况如何被社会阅读，比只谈牙齿卫生更完整。\u003c/p>\n\u003cp>再看最强干扰项E：The Practical Difficulty of Holding a Smile。\u003c/p>\n\u003cp>保持笑容的实际困难解释的是曝光期间维持不动。本段已明确even if the camera was fast enough，重点是表情会被看成什么身份；技术上能做到与社会上愿意做不能混同。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】D. A Portrait Is a Chosen Public Image\n\n> 肖像是经过选择的公众形象\n\n这一部分以爱笑者也拒绝留下傻笑的反差，解释肖像中的公众形象选择为何不同于日常情绪。\n\nEven先制造哪一层反差：\n\n> a person who enjoyed laughter might refuse to preserve a grin\n\n平时爱笑与不愿留下露齿肖像可以共存，因而不能简单把严肃照片等同于严肃性格。吐温接着作为具体例子。\n\n选择表情时面对的观众是谁：\n\n> unknown viewers who would see the portrait later\n\n观众超出房间里的摄影师，还包括未来不认识的人。控制他们的判断解释了为什么正式留影可能选择严肃。\n\n结尾归纳照片记录了什么：\n\n> a decision about presentation as well as a face\n\nas well as加入主动呈现的选择。照片既有人脸，也有被看见的方式，所以不能当成日常快乐程度的透明测量。\n\n这一部分的推进关系是：\n\n> 爱笑者也可能拒绝留下笑容 → 考虑未来陌生观众的判断 → 选择严肃表情来管理形象 → 肖像不能直接测量日常快乐\n\nChosen对应Choosing与decision，Public Image对应未来viewers对人物的judgement。标题抓住正式肖像的呈现选择，能够解释吐温的反差及最后对照片阅读方式的提醒。\n\n再看最强干扰项C：A Society without Laughter。\n\n无欢笑社会的标题直接被enjoyed laughter否定。这个例子不是说吐温不会笑，而是说他区分日常欢笑与留给未来观众的正式形象；把两者合并，便丢掉整段最重要的反差。\n\n**45题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】D. A Portrait Is a Chosen Public Image\u003c/p>\n\u003cblockquote>\n\u003cp>肖像是经过选择的公众形象\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分以爱笑者也拒绝留下傻笑的反差，解释肖像中的公众形象选择为何不同于日常情绪。\u003c/p>\n\u003cp>Even先制造哪一层反差：\u003c/p>\n\u003cblockquote>\n\u003cp>a person who enjoyed laughter might refuse to preserve a grin\u003c/p>\n\u003c/blockquote>\n\u003cp>平时爱笑与不愿留下露齿肖像可以共存，因而不能简单把严肃照片等同于严肃性格。吐温接着作为具体例子。\u003c/p>\n\u003cp>选择表情时面对的观众是谁：\u003c/p>\n\u003cblockquote>\n\u003cp>unknown viewers who would see the portrait later\u003c/p>\n\u003c/blockquote>\n\u003cp>观众超出房间里的摄影师，还包括未来不认识的人。控制他们的判断解释了为什么正式留影可能选择严肃。\u003c/p>\n\u003cp>结尾归纳照片记录了什么：\u003c/p>\n\u003cblockquote>\n\u003cp>a decision about presentation as well as a face\u003c/p>\n\u003c/blockquote>\n\u003cp>as well as加入主动呈现的选择。照片既有人脸，也有被看见的方式，所以不能当成日常快乐程度的透明测量。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>爱笑者也可能拒绝留下笑容 → 考虑未来陌生观众的判断 → 选择严肃表情来管理形象 → 肖像不能直接测量日常快乐\u003c/p>\n\u003c/blockquote>\n\u003cp>Chosen对应Choosing与decision，Public Image对应未来viewers对人物的judgement。标题抓住正式肖像的呈现选择，能够解释吐温的反差及最后对照片阅读方式的提醒。\u003c/p>\n\u003cp>再看最强干扰项C：A Society without Laughter。\u003c/p>\n\u003cp>无欢笑社会的标题直接被enjoyed laughter否定。这个例子不是说吐温不会笑，而是说他区分日常欢笑与留给未来观众的正式形象；把两者合并，便丢掉整段最重要的反差。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 以微笑旧照改变印象，追问这类照片的数量地位 |\n| B | 用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同 |\n| C | 承认微笑照片稀少，将问题转为为何拍照常不笑 |\n| D | 以长曝光与保持不动解释早期严肃表情 |\n| E | 指出技术改善后严肃仍存，提出寻找其他约束 |\n| F | 说明露齿的阶层含义与规范影响不只限于严肃性格者 |\n| G | 从牙齿外观引入体面顾虑，再转向露齿者的身份 |\n| H | 综合技术、外貌与规范，提醒不能由严肃肖像推断无快乐人生 |\n\n全文推进：\n\n> 以微笑旧照改变印象，追问这类照片的数量地位 → 承认微笑照片稀少，将问题转为为何拍照常不笑 → 以长曝光与保持不动解释早期严肃表情 → 指出技术改善后严肃仍存，提出寻找其他约束 → 从牙齿外观引入体面顾虑，再转向露齿者的身份 → 说明露齿的阶层含义与规范影响不只限于严肃性格者 → 用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同 → 综合技术、外貌与规范，提醒不能由严肃肖像推断无快乐人生\n\n完整顺序：\n\n**A → C → D → E → G → F → B → H**\n\n41—45：C、D、G、F、B。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>以微笑旧照改变印象，追问这类照片的数量地位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>承认微笑照片稀少，将问题转为为何拍照常不笑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>以长曝光与保持不动解释早期严肃表情\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>指出技术改善后严肃仍存，提出寻找其他约束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>说明露齿的阶层含义与规范影响不只限于严肃性格者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>从牙齿外观引入体面顾虑，再转向露齿者的身份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>综合技术、外貌与规范，提醒不能由严肃肖像推断无快乐人生\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以微笑旧照改变印象，追问这类照片的数量地位 → 承认微笑照片稀少，将问题转为为何拍照常不笑 → 以长曝光与保持不动解释早期严肃表情 → 指出技术改善后严肃仍存，提出寻找其他约束 → 从牙齿外观引入体面顾虑，再转向露齿者的身份 → 说明露齿的阶层含义与规范影响不只限于严肃性格者 → 用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同 → 综合技术、外貌与规范，提醒不能由严肃肖像推断无快乐人生\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → C → D → E → G → F → B → H\u003c/strong>\u003c/p>\n\u003cp>41—45：C、D、G、F、B。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → C → D的关系。\n\n先看前段A的结尾：\n\n> But the emotional force of that discovery leaves a different question unanswered: how common were these smiling portraits?\n\n再看候选C的开头：\n\n> They form only a small part of the surviving collection.\n\n前段最后明确问how common were these smiling portraits，本段They以这些微笑肖像为先行词，only a small part直接回答比例。不是另开话题讨论照片质量，而是给刚才的数量问题一个限制。\n\nMost formal portraits接着提供总体常态，与少数例外对比。由此将“是否曾笑”改成“为什么拍照时常不笑”，问题对象从生活中的情绪转到正式留影行为。\n\nC段最终落在：\n\n> Instead of asking whether people ever laughed, the more useful question is why they so often avoided a smile when photographed.\n\n后段D的开头是：\n\n> One answer lies in the early photographic process.\n\n后段One answer需要一个正在等待原因的问题，正接本段末尾why…avoided a smile。先界定多数肖像的现象，再给早期工艺解释，避免把技术史当成毫无目的的插入。\n\n这三段的局部推进是：\n\n> 以微笑旧照改变印象，追问这类照片的数量地位 → 承认微笑照片稀少，将问题转为为何拍照常不笑 → 以长曝光与保持不动解释早期严肃表情\n\n再检验容易混淆的候选F。它的开头是：\n\n> That question of identity gave the grin a social meaning.\n\nThat question of identity也像是在回答问题，但此时开篇问的是微笑照片常不常见，还未提出露齿会显示何种身份。候选所需的identity问题要到牙齿段末才出现，不能凭question一词就提前放置。\n\n**41题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → C → D的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>But the emotional force of that discovery leaves a different question unanswered: how common were these smiling portraits?\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>They form only a small part of the surviving collection.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最 前提。技术条件由慢变快，解释力因此变弱，这是一条清楚的时间与因果连续线。\n\n这三段的局部推进是：\n\n> 承认微笑照片稀少，将问题转为为何拍照常不笑 → 以长曝光与保持不动解释早期严肃表情 → 指出技术改善后严肃仍存，提出寻找其他约束\n\n再检验容易混淆的候选G。它的开头是：\n\n> One such restraint concerned the appearance of the mouth.\n\nOne such restraint段讨论牙齿外观，但such要求前面已提出另一个约束；当前还没有解释过技术因素。更直接的是，它结尾不含initial explanation或长曝光，无法支撑已知段对“曝光缩短后这一解释不充分”的评价。\n\n**42题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成C → D → E的关系。\u003c/p>\n\u003cp>先看前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Instead of asking whether people ever laughed, the more useful question is why they so often avoided a smile when photographed.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One answer lies in the early photographic process.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后问为什么拍照常不笑，本段One answer立即给出早期拍摄流程这一原因。Long exposures与remain in the same position把答案落实为持续保持表情的身体要求。\u003c/p>\n\u003cp>长曝光导致笑容难以保持，微小移动又会毁掉影像，因此中性表情有实用优势。结尾用initial explanation主动限定这只是初步解释，为后来条件改变预留空间。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>A neutral face therefore had an immediate practical advantage, making the demands of the camera an important initial explanation.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That initial explanation became less complete as exposures shortened.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知后段That initial explanation原词回接，并以exposures shortened改变前段long exposures的前提。技术条件由慢变快，解释力因此变弱，这是一条清楚的时间与因果连续线。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>承认微笑照片稀少，将问题转为为何拍照常不笑 → 以长曝光与保持不动解释早期严肃表情 → 指出技术改善后严肃仍存，提出寻找其他约束\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One such restraint concerned the appearance of the mouth.\u003c/p>\n\u003c/blockquote>\n\u003cp>One such restraint段讨论牙齿外观，但such要求前面已提出另一个约束；当前还没有解释过技术因素。更直接的是，它结尾不含initial explanation或长曝光，无法支撑已知段对“曝光缩短后这一解释不充分”的评价。\u003c/p>\n\u003cp>\u003cstrong>42题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → F的关系。\n\n先看前段E的结尾：\n\n> The persistence of the convention after a technical obstacle had weakened suggests that another restraint was at work.\n\n再看候选G的开头：\n\n> One such restraint concerned the appearance of the mouth.\n\n已知前段末尾推测another restraint，本段One such restraint直接落实为嘴部外观。两句之间不是重复相机速度，而是用牙齿这一非技术原因回答设备改进后为何仍不笑。\n\n牙齿卫生差使人想隐藏外观，露齿会损害正式形象的体面。但段尾But进一步说不只牙齿好不好看，还涉及什么样的人会露齿，把身体问题推进到身份评价。\n\nG段最终落在：\n\n> But the judgement went beyond whether the teeth were attractive: it also concerned what kind of person would display them.\n\n后段F的开头是：\n\n> That question of identity gave the grin a social meaning.\n\n后段That question of identity正接what kind of person would display them，随后列表演者与不够文雅者。前段先提出身份问题，后段才解释笑容怎样带有社会含义，层次由外观向规范深入。\n\n这三段的局部推进是：\n\n> 指出技术改善后严肃仍存，提出寻找其他约束 → 从牙齿外观引入体面顾虑，再转向露齿者的身份 → 说明露齿的阶层含义与规范影响不只限于严肃性格者\n\n再检验容易混淆的候选D。它的开头是：\n\n> One answer lies in the early photographic process.\n\n重新放入早期长曝光段会回到刚被限定的技术原因。已知前段明说技术障碍已经减弱，需要another restraint；长曝光不是另一个约束，而且结尾仍是initial explanation，不能引出后段identity。\n\n**43题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → F的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The persistence of the convention after a technical obstacle had weakened suggests that another restraint was at work.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One such restraint concerned the appearance of the mouth.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知前段末尾推测another restraint，本段One such restraint直接落实为嘴部外观。两句之间不是重复相机速度，而是用牙齿这一非技术原因回答设备改进后为何仍不笑。\u003c/p>\n\u003cp>牙齿卫生差使人想隐藏外观，露齿会损害正式形象的体面。但段尾But进一步说不只牙齿好不好看，还涉及什么样的人会露齿，把身体问题推进到身份评价。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>But the judgement went beyond whether the teeth were attractive: it also concerned what kind of person would display them.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That question of identity gave the grin a social meaning.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段That question of identity正接what kind of person would display them，随后列表演者与不够文雅者。前段先提出身份问题，后段才解释笑容怎样带有社会含义，层次由外观向规范深入。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>指出技术改善后严肃仍存，提出寻找其他约束 → 从牙齿外观引入体面顾虑，再转向露齿者的身份 → 说明露齿的阶层含义与规范影响不只限于严肃性格者\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One answer lies in the early photographic process.\u003c/p>\n\u003c/blockquote>\n\u003cp>重新放入早期长曝光段会回到刚被限定的技术原因。已知前段明说技术障碍已经减弱，需要another restraint；长曝光不是另一个约束，而且结尾仍是initial explanation，不能引出后段identity。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → F → B的关系。\n\n先看前段G的结尾：\n\n> But the judgement went beyond whether the teeth were attractive: it also concerned what kind of person would display them.\n\n再看候选F的开头：\n\n> That question of identity gave the grin a social meaning.\n\n前段最后问露齿暗示what kind of person，本段That question of identity将其抽象为身份问题，social meaning随即给出解释方向。指代既有词义联系，也有从疑问到解答的功能联系。\n\n表演者及被视为不够文雅的人是被关联的群体，正式肖像的主人则想保留respectable image。避免露齿因而可表示遵从公共标准；结尾把规范影响扩展到日常并不严肃的人。\n\nF段最终落在：\n\n> The standard could influence people whose ordinary temperament was anything but solemn.\n\n后段B的开头是：\n\n> Mark Twain provides a telling example of this contrast.\n\n后段this contrast回指“公共标准仍影响日常不严肃者”的反差，吐温enjoyed laughter却反对固定傻笑正好将其具体化。若只看到Twain姓名而忽略反差，会失去例子证明哪一点。\n\n这三段的局部推进是：\n\n> 从牙齿外观引入体面顾虑，再转向露齿者的身份 → 说明露齿的阶层含义与规范影响不只限于严肃性格者 → 用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同\n\n再检验容易混淆的候选B。它的开头是：\n\n> Mark Twain provides a telling example of this contrast.\n\n吐温段本身可以举例，但若放在这里，this contrast之前只有牙齿是否好看与身份问题，尚未形成日常性格活泼也受规范影响的对照。身份规范段必须先建立这一可被例证的概括。\n\n**44题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → F → B的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>But the judgement went beyond whether the teeth were attractive: it also concerned what kind of person would display them.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That question of identity gave the grin a social meaning.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后问露齿暗示what kind of person，本段That question of identity将其抽象为身份问题，social meaning随即给出解释方向。指代既有词义联系，也有从疑问到解答的功能联系。\u003c/p>\n\u003cp>表演者及被视为不够文雅的人是被关联的群体，正式肖像的主人则想保留respectable image。避免露齿因而可表示遵从公共标准；结尾把规范影响扩展到日常并不严肃的人。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The standard could influence people whose ordinary temperament was anything but solemn.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Mark Twain provides a telling example of this contrast.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段this contrast回指“公共标准仍影响日常不严肃者”的反差，吐温enjoyed laughter却反对固定傻笑正好将其具体化。若只看到Twain姓名而忽略反差，会失去例子证明哪一点。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从牙齿外观引入体面顾虑，再转向露齿者的身份 → 说明露齿的阶层含义与规范影响不只限于严肃性格者 → 用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Mark Twain provides a telling example of this contrast.\u003c/p>\n\u003c/blockquote>\n\u003cp>吐温段本身可以举例，但若放在这里，this contrast之前只有牙齿是否好看与身份问题，尚未形成日常性格活泼也受规范影响的对照。身份规范段必须先建立这一可被例证的概括。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → B → H的关系。\n\n先看前段F的结尾：\n\n> The standard could influence people whose ordinary temperament was anything but solemn.\n\n再看候选B的开头：\n\n> Mark Twain provides a telling example of this contrast.\n\n前段末尾说规范也能影响ordinary temperament并不solemn的人，本段开头给出this contrast的实例。Although he enjoyed laughter与objected to…smile分别对应私下爱笑和正式照片拒笑。\n\n段中进一步点明在意的是future viewers的判断，而不是不会快乐。末句把人物行为抽象为public presentation与private habits的区别，使个别引语能够承担更广泛的解释功能。\n\nB段最终落在：\n\n> His response shows how a decision about public presentation can differ from private habits.\n\n后段H的开头是：\n\n> That difference should guide the reading of old photographs.\n\n已知末段That difference承接刚概括的公开呈现与私下习惯之别，再指导如何读旧照片。它不是直接从一句名人话跳到全部历史，而是经由明确区别收束前面的多种原因。\n\n这三段的局部推进是：\n\n> 说明露齿的阶层含义与规范影响不只限于严肃性格者 → 用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同 → 综合技术、外貌与规范，提醒不能由严肃肖像推断无快乐人生\n\n再检验容易混淆的候选G。它的开头是：\n\n> One such restraint concerned the appearance of the mouth.\n\n牙齿段的末尾是露齿者属于哪种人的疑问，不能给That difference提供两项完整对照。它也没有爱笑者拒绝笑容的反差证据，因此不能在此替代吐温把私人习惯与公共形象分开的例证。\n\n**45题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → B → H的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The standard could influence people whose ordinary temperament was anything but solemn.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Mark Twain provides a telling example of this contrast.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末尾说规范也能影响ordinary temperament并不solemn的人，本段开头给出this contrast的实例。Although he enjoyed laughter与objected to…smile分别对应私下爱笑和正式照片拒笑。\u003c/p>\n\u003cp>段中进一步点明在意的是future viewers的判断，而不是不会快乐。末句把人物行为抽象为public presentation与private habits的区别，使个别引语能够承担更广泛的解释功能。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>His response shows how a decision about public presentation can differ from private habits.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That difference should guide the reading of old photographs.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知末段That difference承接刚概括的公开呈现与私下习惯之别，再指导如何读旧照片。它不是直接从一句名人话跳到全部历史，而是经由明确区别收束前面的多种原因。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明露齿的阶层含义与规范影响不只限于严肃性格者 → 用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同 → 综合技术、外貌与规范，提醒不能由严肃肖像推断无快乐人生\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One such restraint concerned the appearance of the mouth.\u003c/p>\n\u003c/blockquote>\n\u003cp>牙齿段的末尾是露齿者属于哪种人的疑问，不能给That difference提供两项完整对照。它也没有爱笑者拒绝笑容的反差证据，因此不能在此替代吐温把私人习惯与公共形象分开的例证。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **historical curiosity** | **对历史的好奇心** | **人生哲理类：好奇、求知** | **个人主题** |\n| critical examination of assumptions | 对既有假设的审视 | 人生哲理类：批判、独立、全局思维 | 个人主题 |\n| openness to new evidence | 对新证据的开放态度 | 人生哲理类：谦虚、承认不足 | 个人主题 |\n| **shared human experience** | **共同的人类体验** | **教育文化类：文化交流** | **宏观主题** |\n| an understanding of cultural differences | 对文化差异的理解 | 人生哲理类：理解、信任、宽容 | 个人主题 |\n| access to historical information | 获取历史信息的渠道 | 社会生活类：获取信息的方式 | 宏观主题 |\n| **technological progress** | **技术进步** | **经济消费类：科技发展** | **宏观主题** |\n| independent thinking | 独立思考 | 人生哲理类：批判、独立、全局思维 | 个人主题 |\n| a willingness to reconsider the past | 重新认识过去的意愿 | 人生哲理类：谦虚、承认不足 | 个人主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>historical curiosity\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>对历史的好奇心\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：好奇、求知\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>critical examination of assumptions\u003c/td>\n\u003ctd>对既有假设的审视\u003  | The majority of the examples display X rather than Y. | 多数样本呈现X而非Y。 |\n| 图表题 | By the end of the period, the time required for X had become much shorter. | 到该时期末，X所需时间已大幅缩短。 |\n| **文本评论题** | **The passage asks why X persisted even after Y had changed.** | **文章追问为何Y变化后X仍然持续。** |\n| 文本评论题 | The text offers both a technical explanation and a social explanation for X. | 文章为X提供技术和社会两方面的解释。 |\n| 文本评论题 | The author uses an apparent exception to reveal the strength of X. | 作者用一个看似可能的例外显示X的强大影响。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture challenges a familiar impression of X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画挑战了人们对X的熟悉印象。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The people in the picture seem more familiar through their shared experience of X.\u003c/td>\n\u003ctd>画中人物因共同的X体验而显得更亲近。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast invites us to reconsider an assumption about X.\u003c/td>\n\u003ctd>这一对比促使我们重新思考关于X的假设。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>X accounts for only a tiny percentage of the total.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>X只占总量的极小比例。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The majority of the examples display X rather than Y.\u003c/td>\n\u003ctd>多数样本呈现X而非Y。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>By the end of the period, the time required for X had become much shorter.\u003c/td>\n\u003ctd>到该时期末，X所需时间已大幅缩短。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage asks why X persisted even after Y had changed.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章追问为何Y变化后X仍然持续。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text offers both a technical explanation and a social explanation for X.\u003c/td>\n\u003ctd>文章为X提供技术和社会两方面的解释。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author uses an apparent exception to reveal the strength of X.\u003c/td>\n\u003ctd>作者用一个看似可能的例外显示X的强大影响。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. A Faster Camera Does Not Explain Every Face\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. The Social Meaning of Showing One’s Teeth\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. A Society without Laughter\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. A Portrait Is a Chosen Public Image\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. The Practical Difficulty of Holding a Smile\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. An Exception Can Challenge an Impression\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Technology Automatically Changes Habits\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>A smiling Victorian portrait can surprise a modern viewer accustomed to solemn faces in history books. The surprise is useful: it interrupts the assumption that distant ancestors lacked familiar emotions. Yet a collection of such portraits may remain a small fraction of the surviving record. Its power to change an impression does not make it statistically typical. The right response is neither to dismiss the smiles nor to treat them as the dominant convention. They show that laughter existed, while leaving open the question of why formal portraits so often concealed it.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>In early photography, a sitter could be required to remain still while the image was recorded. A brief laugh was easy in ordinary conversation but difficult to hold unchanged for a prolonged exposure. Moving the head or adjusting the body could blur the result. Under those conditions, a neutral expression offered a practical advantage: there was less effort to sustain and less movement to spoil the picture. This explanation concerns the demands of the process. It does not require the person being photographed to be unhappy or incapable of amusement.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>Once shorter exposures made spontaneous expressions easier to capture, the old technical explanation became incomplete. If speed alone determined the face in a photograph, smiles should have followed every improvement in the camera. Their continued absence from many formal portraits points to something else. People were choosing not merely how to remain still but how to appear. The change in equipment therefore helps the historian by removing one obstacle from the explanation. It directs attention towards the expectations that survived after the camera could record a smile.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>Showing teeth was not simply a matter of moving the mouth. Poor dental health could make an open smile embarrassing, while ideas of respectable behaviour added another restraint. A wide grin might be associated with performers or people thought to lack refinement. Someone preparing a formal portrait could therefore avoid it even if the camera was fast enough. Physical appearance and social judgement worked together: the teeth themselves might be unattractive, and displaying them might also suggest the wrong kind of person. The image was being read as a statement about status.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>Even a person who enjoyed laughter might refuse to preserve a grin in a formal photograph. Mark Twain’s objection to a foolish smile fixed for the future illustrates that distinction. The relevant audience was not only the photographer in the room but also unknown viewers who would see the portrait later. Choosing a serious expression could be an attempt to control their judgement. A photograph consequently records a decision about presentation as well as a face. It should not be treated as a transparent measure of the sitter’s everyday capacity for joy.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>Smiling faces in old portraits can disturb a familiar image of a joyless past. When such pictures are shared today, viewers recognize expressions much like their own. The discovery makes distant people seem more human. But the emotional force of that discovery leaves a different question unanswered: how common were these smiling portraits?\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Mark Twain provides a telling example of this contrast. Although he enjoyed laughter, he objected to leaving a foolish smile permanently attached to his likeness. What mattered was the judgement of future viewers, not an inability to enjoy himself. His response shows how a decision about public presentation can differ from private habits.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>They form only a small part of the surviving collection. Most formal portraits present still, serious faces, so the exceptions cannot stand for the whole. Recognizing this imbalance changes the historian’s task. Instead of asking whether people ever laughed, the more useful question is why they so often avoided a smile when photographed.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>One answer lies in the early photographic process. Long exposures required a sitter to remain in the same position, and a sustained smile could be difficult to hold. A small movement might spoil the image. A neutral face therefore had an immediate practical advantage, making the demands of the camera an important initial explanation.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>That initial explanation became less complete as exposures shortened. A camera able to catch a spontaneous expression no longer imposed exactly the same demand on its subject. Yet serious faces remained familiar in formal portraits. The persistence of the convention after a technical obstacle had weakened suggests that another restraint was at work.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>That question of identity gave the grin a social meaning. Wide smiles could be associated with entertainers or people considered insufficiently refined, rather than with the respectable image a sitter wanted to preserve. Avoiding one could therefore signal conformity to a public standard. The standard could influence people whose ordinary temperament was anything but solemn.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>One such restraint concerned the appearance of the mouth. Where dental health was poor, showing teeth could expose something the sitter preferred to hide. An open grin might undermine the dignity expected of a formal image. But the judgement went beyond whether the teeth were attractive: it also concerned what kind of person would display them.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>That difference should guide the reading of old photographs. A serious face may reflect a technical constraint, concern about appearance or a convention about dignity, rather than a life without pleasure. Smiling exceptions help us recognize shared humanity; the larger pattern asks us to reconstruct the circumstances in which people chose how to be seen.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2021英语一Text 3重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>historian\u003c/td>\n\u003ctd>n.历史学家\u003c/td>\n\u003ctd>search for\u003c/td>\n\u003ctd>phr.寻找\u003c/td>\n\u003c
