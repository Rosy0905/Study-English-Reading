gaps or blackened gnashers) lacked class: drunks, tramps, and music hall performers might gurn and grin with a smile as wide as Lewis Carroll&#39;s gum-exposing Cheshire Cat, but it was not a becoming look for properly bred persons.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-1\">\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>A toothy grin / (especially when there were / gaps or blackened gnashers) / lacked class: / drunks, tramps, / and music hall performers / might gurn and grin / with a smile / as wide as / Lewis Carroll&#39;s gum-exposing Cheshire Cat, / but it was not / a becoming look / for properly bred persons.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-2\">\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>露齿的咧嘴笑 / （尤其是当有 / 缺口或发黑的牙齿时）/ 缺乏品位：/ 醉汉、流浪汉，/ 和音乐厅表演者 / 可能扮鬼脸和咧嘴笑 / 带着微笑 / 宽得像 / 刘易斯·卡罗尔笔下露出牙龈的柴郡猫，/ 但这不是 / 一个得体的样子 / 对于有教养的人来说。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-3\">\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把外貌特征与社会评价连起来：\u003c/p>\n\u003cblockquote>\n\u003cp>露齿大笑，尤其露出缺牙或发黑的牙齿，被认为不够体面\u003c/p>\n\u003c/blockquote>\n\u003cp>再把可这样笑的人与不适合的人对照：\u003c/p>\n\u003cblockquote>\n\u003cp>醉汉、流浪汉或歌舞杂耍演员可以像柴郡猫一样咧嘴露牙，但这不是有教养的人应有的样子\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>露齿大笑，尤其露出缺牙或发黑的牙齿，被认为不够体面；醉汉、流浪汉或歌舞杂耍演员可以像柴郡猫一样咧嘴露牙，但这不是有教养的人应有的样子。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-4\">\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>露齿大笑被视为没格调，不适合有教养的人。\u003c/p>\n\u003c/blockquote>\n\u003cp>冒号把lacked class展开为不同社会身份的行为规范；but连接两类人的对照。as wide as修饰smile的幅度，properly bred修饰persons，不要把“教养”误接到猫的形象上。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>露齿大笑，尤其露出缺牙或发黑的牙齿，会被视为没格调：醉汉、流浪汉和歌舞杂耍演员可以像刘易斯·卡罗尔笔下露着牙床的柴郡猫一样做怪相、咧嘴笑，有教养的人却被认为不该如此。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-5\">\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>gurn and grin包含做怪相、咧嘴笑的意味，用它说明当时的体面观念，不要平直译成所有人共同的欢乐。\u003c/p>\n\u003cp>becoming在此是“合宜、得体”，不是become的变化义；译文应标明这是当时的社会评价，而不是替作者给今日人物下等级判断。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>露齿的咧嘴笑（尤其是有缺牙或黑牙时）显得缺乏品位：醉汉、流浪汉和音乐厅表演者可能会扮鬼脸，咧嘴笑得像刘易斯·卡罗尔笔下露出牙龈的柴郡猫那样宽，但这对有教养的人来说并不得体。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"35题 · 题干、题型与核心出处","level":2,"raw":"## 35题\n\n**Which of the following questions does the text answer?**\n\n下面哪一个问题是本文主要回答的问题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **When did the Victorians start to view photography differently?**\n\n维多利亚时代的人何时开始以不同方式看待摄影？\n\nB. **What made photography develop slowly in the Victorian period?**\n\n是什么让摄影在维多利亚时代发展缓慢？\n\nC. **Why did most Victorians look stern in photographs?**\n\n为什么大多数维多利亚时代的人在照片中显得严肃？\n\nD. **How did smiling in photographs become a post-Victorian norm?**\n\n照片中微笑怎样成为维多利亚时代之后的常态？\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。 | 先摆出一种让人意外的现象 |\n| 第2段 | 说明微笑照片只是少数，多数肖像僵硬严肃，提出为什么会这样。 | 再说多数其实相反并问为什么 |\n| 第3段 | 先用早期长曝光和难以保持固定笑容解释不笑的习惯。 | 先说过去为何会这样 |\n| 第4段 | 指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。 | 再说条件变了还得另找原因 |\n| 第5段 | 提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。 | 再说另一种更具体的原因 |\n| 第6段 | 补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。 | 最后说这种看法连例外也影响 |","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,443],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"question":"35","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003cp>下面哪一个问题是本文主要回答的问题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>When did the Victorians start to view photography differently?\u003c/strong>\u003c/p>\n\u003cp>维多利亚时代的人何时开始以不同方式看待摄影？\u003c/p>\n\u003cp>B. \u003cstrong>What made photography develop slowly in the Victorian period?\u003c/strong>\u003c/p>\n\u003cp>是什么让摄影在维多利亚时代发展缓慢？\u003c/p>\n\u003cp>C. \u003cstrong>Why did most Victorians look stern in photographs?\u003c/strong>\u003c/p>\n\u003cp>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003cp>D. \u003cstrong>How did smiling in photographs become a post-Victorian norm?\u003c/strong>\u003c/p>\n\u003cp>照片中微笑怎样成为维多利亚时代之后的常态？\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。\u003c/td>\n\u003ctd>先摆出一种让人意外的现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明微笑照片只是少数，多数肖像僵硬严肃，提出为什么会这样。\u003c/td>\n\u003ctd>再说多数其实相反并问为什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>先用早期长曝光和难以保持固定笑容解释不笑的习惯。\u003c/td>\n\u003ctd>先说过去为何会这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。\u003c/td>\n\u003ctd>再说条件变了还得另找原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。\u003c/td>\n\u003ctd>再说另一种更具体的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。\u003c/td>\n\u003ctd>最后说这种看法连例外也影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. When did the Victorians start to view photography differently?","level":3,"raw":"**Which of the following questions does the text answer?**\n\n### A. When did the Victorians start to view photography differently?\n\n维多利亚时代的人何时开始以不同方式看待摄影？","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,443],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"A"},"focusId":"focus-q35-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-A-0\">\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003cp>维多利亚时代的人何时开始以不同方式看待摄影？\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. When did the Victorians start to view photography differently?","level":3,"raw":"#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n维多利亚时代的人何时开始以不同方式看待摄影？\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从一组出人意料的旧照片切入，提出维多利亚人何时开始改变对摄影的理解。 | 先摆出一种让人意外的现象 |\n| 第2段 | 说明起初多数人仍将摄影视作严肃肖像形式，由此提出态度转变的时间问题。 | 再说多数其实相反并问为什么 |\n| 第3段 | 回顾早期长曝光和正式拍摄场景，解释旧观念形成的背景。 | 先说过去为何会这样 |\n| 第4段 | 写便携相机出现后新使用方式逐渐成熟，寻找观念开始变化的具体时期。 | 再说条件变了还得另找原因 |\n| 第5段 | 进一步从家庭留影、休闲记录等用途辨认转变开始发生的迹象。 | 再说另一种更具体的原因 |\n| 第6段 | 说明旧体面规范仍约束部分人，借知名人物的迟疑限定转变并非人人同步。 | 最后说这种看法连例外也影响 |\n\nA要求全文回答when，关键应是维多利亚时代人对摄影的认识何时变化。文章确实出现年代，却用来检验“不笑是否因为曝光慢”：到九十年代仍然犹豫着不笑，说明要找别的原因。开头印象改变的是当代看Twitter的人，也不是维多利亚人自己。末两段解释牙齿和体面标准，没有给出摄影观念发生转变的时点。\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,443],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"A"},"focusId":"focus-q35-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-A-0\">\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003cp>维多利亚时代的人何时开始以不同方式看待摄影？\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-A-1\">\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>维多利亚时代的人何时开始以不同方式看待摄影？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从一组出人意料的旧照片切入，提出维多利亚人何时开始改变对摄影的理解。\u003c/td>\n\u003ctd>先摆出一种让人意外的现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明起初多数人仍将摄影视作严肃肖像形式，由此提出态度转变的时间问题。\u003c/td>\n\u003ctd>再说多数其实相反并问为什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>回顾早期长曝光和正式拍摄场景，解释旧观念形成的背景。\u003c/td>\n\u003ctd>先说过去为何会这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>写便携相机出现后新使用方式逐渐成熟，寻找观念开始变化的具体时期。\u003c/td>\n\u003ctd>再说条件变了还得另找原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>进一步从家庭留影、休闲记录等用途辨认转变开始发生的迹象。\u003c/td>\n\u003ctd>再说另一种更具体的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明旧体面规范仍约束部分人，借知名人物的迟疑限定转变并非人人同步。\u003c/td>\n\u003ctd>最后说这种看法连例外也影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A要求全文回答when，关键应是维多利亚时代人对摄影的认识何时变化。文章确实出现年代，却用来检验“不笑是否因为曝光慢”：到九十年代仍然犹豫着不笑，说明要找别的原因。开头印象改变的是当代看Twitter的人，也不是维多利亚人自己。末两段解释牙齿和体面标准，没有给出摄影观念发生转变的时点。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. What made photography develop slowly in the Victorian period?","level":3,"raw":"**Which of the following questions does the text answer?**\n\n### B. What made photography develop slowly in the Victorian period?\n\n是什么让摄影在维多利亚时代发展缓慢？","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,443],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"B"},"focusId":"focus-q35-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-B-0\">\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003cp>是什么让摄影在维多利亚时代发展缓慢？\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. What made photography develop slowly in the Victorian period?","level":3,"raw":"#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n是什么让摄影在维多利亚时代发展缓慢？\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从少数先进摄影成果引起惊讶开篇，引出技术普及为何比预期缓慢。 | 先摆出一种让人意外的现象 |\n| 第2段 | 展示多数设备和作品仍停留在旧阶段的现实，明确发展迟缓这一待解释问题。 | 再说多数其实相反并问为什么 |\n| 第3段 | 说明早期材料、曝光和制版方面的技术障碍怎样拖慢改良。 | 先说过去为何会这样 |\n| 第4段 | 转到曝光缩短后的时期，指出原有障碍减弱而进步仍受其他因素限制。 | 再说条件变了还得另找原因 |\n| 第5段 | 分析费用、制造条件或市场规模怎样继续限制摄影技术发展。 | 再说另一种更具体的原因 |\n| 第6段 | 说明保守观念对新器材的接受形成阻力，连可能支持创新的人也受影响。 | 最后说这种看法连例外也影响 |\n\nB抓住了曝光技术，却把发展缓慢当作全文要解释的现象。第4段明确写曝光时间快了，自然微笑容易捕捉，作者随后寻找的是仍然不笑的原因。牙齿卫生差和有教养者不宜露牙，能解释被摄者选择什么表情，却不能说明相机技术为什么发展慢。它们并未被写成发明或推广摄影的障碍。\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,443],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"B"},"focusId":"focus-q35-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-B-0\">\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003cp>是什么让摄影在维多利亚时代发展缓慢？\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-B-1\">\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>是什么让摄影在维多利亚时代发展缓慢？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从少数先进摄影成果引起惊讶开篇，引出技术普及为何比预期缓慢。\u003c/td>\n\u003ctd>先摆出一种让人意外的现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>展示多数设备和作品仍停留在旧阶段的现实，明确发展迟缓这一待解释问题。\u003c/td>\n\u003ctd>再说多数其实相反并问为什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明早期材料、曝光和制版方面的技术障碍怎样拖慢改良。\u003c/td>\n\u003ctd>先说过去为何会这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>转到曝光缩短后的时期，指出原有障碍减弱而进步仍受其他因素限制。\u003c/td>\n\u003ctd>再说条件变了还得另找原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>分析费用、制造条件或市场规模怎样继续限制摄影技术发展。\u003c/td>\n\u003ctd>再说另一种更具体的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明保守观念对新器材的接受形成阻力，连可能支持创新的人也受影响。\u003c/td>\n\u003ctd>最后说这种看法连例外也影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B抓住了曝光技术，却把发展缓慢当作全文要解释的现象。第4段明确写曝光时间快了，自然微笑容易捕捉，作者随后寻找的是仍然不笑的原因。牙齿卫生差和有教养者不宜露牙，能解释被摄者选择什么表情，却不能说明相机技术为什么发展慢。它们并未被写成发明或推广摄影的障碍。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Why did most Victorians look stern in photographs?","level":3,"raw":"**Which of the following questions does the text answer?**\n\n### C. Why did most Victorians look stern in photographs?\n\n为什么大多数维多利亚时代的人在照片中显得严肃？","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,443],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"C"},"focusId":"focus-q35-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-C-0\">\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003cp>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Why did most Victorians look stern in photographs?","level":3,"raw":"#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n为什么大多数维多利亚时代的人在照片中显得严肃？\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 以少数微笑旧照片给今日观看者带来的意外感受，呈现与既有严肃印象的反差。 | 先摆出一种让人意外的现象 |\n| 第2段 | 承认微笑照片只占少数，转而提出为什么大部分肖像表情僵硬严肃。 | 再说多数其实相反并问为什么 |\n| 第3段 | 先从早期长曝光说明自然笑容难以保持，解释技术条件下的严肃姿态。 | 先说过去为何会这样 |\n| 第4段 | 指出技术变快后微笑容易捕捉，因而仍不笑必须有其他解释。 | 再说条件变了还得另找原因 |\n| 第5段 | 从牙齿状况与露齿失体面解释人们在技术改善后仍不愿微笑。 | 再说另一种更具体的原因 |\n| 第6段 | 补充社会阶层对露齿笑的评价，并用爱笑者也遵守的例子显示观念影响。 | 最后说这种看法连例外也影响 |\n\nC同时保留了most、Victorians和in photographs三个限定。开头证明他们日常可以笑，第2段却说照片里大多数严肃，这才有需要解释的反差。后面每一步都围绕原因推进：技术困难先能解释，后来技术改善，牙齿和社会体面观念继续解释。结尾Twain平日爱笑而不赞成照片傻笑，恰好再次说明文章讨论的是摄影肖像中的表情，并不是维多利亚人普遍没有快乐。\n\n判断：\n\n**C 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,443],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"C"},"focusId":"focus-q35-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-C-0\">\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003cp>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-C-1\">\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以少数微笑旧照片给今日观看者带来的意外感受，呈现与既有严肃印象的反差。\u003c/td>\n\u003ctd>先摆出一种让人意外的现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>承认微笑照片只占少数，转而提出为什么大部分肖像表情僵硬严肃。\u003c/td>\n\u003ctd>再说多数其实相反并问为什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>先从早期长曝光说明自然笑容难以保持，解释技术条件下的严肃姿态。\u003c/td>\n\u003ctd>先说过去为何会这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出技术变快后微笑容易捕捉，因而仍不笑必须有其他解释。\u003c/td>\n\u003ctd>再说条件变了还得另找原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>从牙齿状况与露齿失体面解释人们在技术改善后仍不愿微笑。\u003c/td>\n\u003ctd>再说另一种更具体的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>补充社会阶层对露齿笑的评价，并用爱笑者也遵守的例子显示观念影响。\u003c/td>\n\u003ctd>最后说这种看法连例外也影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C同时保留了most、Victorians和in photographs三个限定。开头证明他们日常可以笑，第2段却说照片里大多数严肃，这才有需要解释的反差。后面每一步都围绕原因推进：技术困难先能解释，后来技术改善，牙齿和社会体面观念继续解释。结尾Twain平日爱笑而不赞成照片傻笑，恰好再次说明文章讨论的是摄影肖像中的表情，并不是维多利亚人普遍没有快乐。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. How did smiling in photographs become a post-Victorian norm?","level":3,"raw":"**Which of the following questions does the text answer?**\n\n### D. How did smiling in photographs become a post-Victorian norm?\n\n照片中微笑怎样成为维多利亚时代之后的常态？","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,443],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"D"},"focusId":"focus-q35-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-D-0\">\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003cp>照片中微笑怎样成为维多利亚时代之后的常态？\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. How did smiling in photographs become a post-Victorian norm?","level":3,"raw":"#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n照片中微笑怎样成为维多利亚时代之后的常态？\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从后世笑容灿烂的家庭照片令人惊讶写起，提出微笑后来为何成为常态。 | 先摆出一种让人意外的现象 |\n| 第2段 | 回顾此前多数肖像严肃的相反惯例，明确需要解释的历史转变。 | 再说多数其实相反并问为什么 |\n| 第3段 | 说明长曝光曾迫使人物保持静止，为后来变化交代起点。 | 先说过去为何会这样 |\n| 第4段 | 写快速相机普及使自然微笑易于捕捉，同时提出技术之外还需哪些改变。 | 再说条件变了还得另找原因 |\n| 第5段 | 具体解释消费广告、私人相册或审美变化怎样赋予笑容新的正面意义。 | 再说另一种更具体的原因 |\n| 第6段 | 呈现旧规范对新常态的抵抗，说明连爱笑的人也曾受约束，从而凸显后来转变的幅度。 | 最后说这种看法连例外也影响 |\n\nD所问的是post-Victorian norm，意味着文章要走到维多利亚时代之后，解释微笑如何普及。实际最后两段仍停在那个时代的牙齿、格调和Twain对照片傻笑的反对。第4段技术变快也没有带来文中所说的微笑常态，作者反而强调still hesitated。因此D需要的后续转变过程和结果都不是文章的落点。\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,443],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"D"},"focusId":"focus-q35-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-D-0\">\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003cp>照片中微笑怎样成为维多利亚时代之后的常态？\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-D-1\">\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>照片中微笑怎样成为维多利亚时代之后的常态？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从后世笑容灿烂的家庭照片令人惊讶写起，提出微笑后来为何成为常态。\u003c/td>\n\u003ctd>先摆出一种让人意外的现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回顾此前多数肖像严肃的相反惯例，明确需要解释的历史转变。\u003c/td>\n\u003ctd>再说多数其实相反并问为什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明长曝光曾迫使人物保持静止，为后来变化交代起点。\u003c/td>\n\u003ctd>先说过去为何会这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>写快速相机普及使自然微笑易于捕捉，同时提出技术之外还需哪些改变。\u003c/td>\n\u003ctd>再说条件变了还得另找原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>具体解释消费广告、私人相册或审美变化怎样赋予笑容新的正面意义。\u003c/td>\n\u003ctd>再说另一种更具体的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>呈现旧规范对新常态的抵抗，说明连爱笑的人也曾受约束，从而凸显后来转变的幅度。\u003c/td>\n\u003ctd>最后说这种看法连例外也影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D所问的是post-Victorian norm，意味着文章要走到维多利亚时代之后，解释微笑如何普及。实际最后两段仍停在那个时代的牙齿、格调和Twain对照片傻笑的反对。第4段技术变快也没有带来文中所说的微笑常态，作者反而强调still hesitated。因此D需要的后续转变过程和结果都不是文章的落点。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"35题结论","level":2,"raw":"### 35题结论\n\n**35. C. Why did most Victorians look stern in photographs?**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Why did most Victorians look stern in photographs? / 为什么大多数维多利亚时代的人在照片中显得严肃？**","context":{"mode":"image","asset":"questions","focus":[250,2369,1800,443],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"question":"35","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>35. C. Why did most Victorians look stern in photographs?\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Why did most Victorians look stern in photographs? / 为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"31题 · 题干、题型与核心出处","level":2,"raw":"## 31题\n\n> According to Paragraph 1, the author’s posts on Twitter ______.  \n> 根据第1段，作者发布在Twitter上的内容产生了什么作用？\n\n### 题型\n\n信息结果题。题干要求判断“根据第1段，作者发布在Twitter上的内容产生了什么作用？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> As a historian who's always searching for the text or the image that makes us re-evaluate the past, I've become preoccupied with looking for photographs that show our Victorian ancestors smiling (what better way to shatter the image of 19th-century prudery?). I've found quite a few, and—since I started posting them on Twitter—they have been causing quite a stir. People have been surprised to see evidence that Victorians had fun and could, and did, laugh. They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\n\n作者发出微笑的维多利亚时代肖像，人们从这些人脸上看见与自己一样的笑声；原本被当作严肃古人的对象因此显得有人情味。","context":{"mode":"image","asset":"questions","focus":[250,244,1800,439],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"question":"31","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>According to Paragraph 1, the author’s posts on Twitter ______.\u003cbr>根据第1段，作者发布在Twitter上的内容产生了什么作用？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>信息结果题。题干要求判断“根据第1段，作者发布在Twitter上的内容产生了什么作用？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>As a historian who&#39;s always searching for the text or the image that makes us re-evaluate the past, I&#39;ve become preoccupied with looking for photographs that show our Victorian ancestors smiling (what better way to shatter the image of 19th-century prudery?). I&#39;ve found quite a few, and—since I started posting them on Twitter—they have been causing quite a stir. People have been surprised to see evidence that Victorians had fun and could, and did, laugh. They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者发出微笑的维多利亚时代肖像，人们从这些人脸上看见与自己一样的笑声；原本被当作严肃古人的对象因此显得有人情味。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. illustrated the development of Victorian photography","level":3,"raw":"### A. illustrated the development of Victorian photography\n\n> 说明了维多利亚时代摄影的发展\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 development of Victorian photography 要找摄影怎样发展，所以回看第1段 photographs that show our Victorian ancestors smiling，确认帖子里的照片具体展示什么。\n\n**错误类型：第三类——无中生有。**\n\n原文的 photographs that show our Victorian ancestors smiling 说明照片展示的是人物微笑；后面的人们也针对他们会享乐和大笑而惊讶。A的 development of Victorian photography 把展示对象改成摄影技术的发展，应该涉及方法、设备或拍摄效果的变化。这段没有按发展阶段排列照片，而是用微笑这一共同内容使过去的人更亲近。照片是工具，不等于帖子在介绍工具自身的演进。\n\n原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。\n\n**命题人借用的原文材料：**\n\n> People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\n>\n> They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.","context":{"mode":"image","asset":"questions","focus":[250,338,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option":"A"},"focusId":"focus-q31-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>说明了维多利亚时代摄影的发展\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 development of Victorian photography 要找摄影怎样发展，所以回看第1段 photographs that show our Victorian ancestors smiling，确认帖子里的照片具体展示什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 photographs that show our Victorian ancestors smiling 说明照片展示的是人物微笑；后面的人们也针对他们会享乐和大笑而惊讶。A的 development of Victorian photography 把展示对象改成摄影技术的发展，应该涉及方法、设备或拍摄效果的变化。这段没有按发展阶段排列照片，而是用微笑这一共同内容使过去的人更亲近。照片是工具，不等于帖子在介绍工具自身的演进。\u003c/p>\n\u003cp>原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\u003c/p>\n\u003cp>They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. illustrated the development of Victorian photography","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者在Twitter发布的内容说明了维多利亚时代摄影的发展。\n\nA的 development of Victorian photography 要找摄影怎样发展，所以回看第1段 photographs that show our Victorian ancestors smiling，确认帖子里的照片具体展示什么。\n\n原文的 photographs that show our Victorian ancestors smiling 说明照片展示的是人物微笑；后面的人们也针对他们会享乐和大笑而惊讶。A的 development of Victorian photography 把展示对象改成摄影技术的发展，应该涉及方法、设备或拍摄效果的变化。这段没有按发展阶段排列照片，而是用微笑这一共同内容使过去的人更亲近。照片是工具，不等于帖子在介绍工具自身的演进。\n\n原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。","context":{"mode":"image","asset":"questions","focus":[250,338,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"31","option":"A"},"focusId":"focus-q31-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>说明了维多利亚时代摄影的发展\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 development of Victorian photography 要找摄影怎样发展，所以回看第1段 photographs that show our Victorian ancestors smiling，确认帖子里的照片具体展示什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 photographs that show our Victorian ancestors smiling 说明照片展示的是人物微笑；后面的人们也针对他们会享乐和大笑而惊讶。A的 development of Victorian photography 把展示对象改成摄影技术的发展，应该涉及方法、设备或拍摄效果的变化。这段没有按发展阶段排列照片，而是用微笑这一共同内容使过去的人更亲近。照片是工具，不等于帖子在介绍工具自身的演进。\u003c/p>\n\u003cp>原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\u003c/p>\n\u003cp>They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者在Twitter发布的内容说明了维多利亚时代摄影的发展。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 development of Victorian photography 要找摄影怎样发展，所以回看第1段 photographs that show our Victorian ancestors smiling，确认帖子里的照片具体展示什么。\u003c/p>\n\u003cp>原文的 photographs that show our Victorian ancestors smiling 说明照片展示的是人物微笑；后面的人们也针对他们会享乐和大笑而惊讶。A的 development of Victorian photography 把展示对象改成摄影技术的发展，应该涉及方法、设备或拍摄效果的变化。这段没有按发展阶段排列照片，而是用微笑这一共同内容使过去的人更亲近。照片是工具，不等于帖子在介绍工具自身的演进。\u003c/p>\n\u003cp>原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. illustrated the development of Victorian photography","level":4,"raw":"#### 写作视角法\n\n原文第1段是这样写的：\n\n> People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\n>\n> They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\n>\n> 作者发出微笑的维多利亚时代肖像，人们从这些人脸上看见与自己一样的笑声；原本被当作严肃古人的对象因此显得有人情味。\n\n把这一处放回全文，它承担的写作任务是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The Twitter posts traced successive stages in the development of Victorian photography.\n>\n> 这些帖子追踪了维多利亚时代摄影发展的连续阶段。\n\n技术发展路线需要按时间比较设备或拍摄方法。首段展示微笑脸孔以及当代读者的惊讶，时间变化要到后面的曝光讨论才出现，不能倒置到发帖结果上。","context":{"mode":"image","asset":"questions","focus":[250,338,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"31","option":"A"},"focusId":"focus-q31-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>说明了维多利亚时代摄影的发展\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 development of Victorian photography 要找摄影怎样发展，所以回看第1段 photographs that show our Victorian ancestors smiling，确认帖子里的照片具体展示什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 photographs that show our Victorian ancestors smiling 说明照片展示的是人物微笑；后面的人们也针对他们会享乐和大笑而惊讶。A的 development of Victorian photography 把展示对象改成摄影技术的发展，应该涉及方法、设备或拍摄效果的变化。这段没有按发展阶段排列照片，而是用微笑这一共同内容使过去的人更亲近。照片是工具，不等于帖子在介绍工具自身的演进。\u003c/p>\n\u003cp>原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\u003c/p>\n\u003cp>They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者在Twitter发布的内容说明了维多利亚时代摄影的发展。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 development of Victorian photography 要找摄影怎样发展，所以回看第1段 photographs that show our Victorian ancestors smiling，确认帖子里的照片具体展示什么。\u003c/p>\n\u003cp>原文的 photographs that show our Victorian ancestors smiling 说明照片展示的是人物微笑；后面的人们也针对他们会享乐和大笑而惊讶。A的 development of Victorian photography 把展示对象改成摄影技术的发展，应该涉及方法、设备或拍摄效果的变化。这段没有按发展阶段排列照片，而是用微笑这一共同内容使过去的人更亲近。照片是工具，不等于帖子在介绍工具自身的演进。\u003c/p>\n\u003cp>原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\u003c/p>\n\u003cp>They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003cp>作者发出微笑的维多利亚时代肖像，人们从这些人脸上看见与自己一样的笑声；原本被当作严肃古人的对象因此显得有人情味。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Twitter posts traced successive stages in the development of Victorian photography.\u003c/p>\n\u003cp>这些帖子追踪了维多利亚时代摄影发展的连续阶段。\u003c/p>\n\u003c/blockquote>\n\u003cp>技术发展路线需要按时间比较设备或拍摄方法。首段展示微笑脸孔以及当代读者的惊讶，时间变化要到后面的曝光讨论才出现，不能倒置到发帖结果上。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. illustrated the development of Victorian photography","level":4,"raw":"#### 主旨交叉验证法\n\n35题的正确答案是：\n\n> Why did most Victorians look stern in photographs?  \n> 为什么大多数维多利亚时代的人在照片中显得严肃？\n\n把这个主旨直接代入31题题干：\n\n> 全文主旨在解释严肃肖像，因此开头的微笑照片应与这种印象形成反差；但帖子实际改变了谁的认识、是否涉及研究媒介的作用，仍须由首段说明。\n\n但A实际说的是：\n\n> illustrated the development of Victorian photography  \n> 说明了维多利亚时代摄影的发展\n\n原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。\n\n从全文推进看，这一处的作用是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。\n\n本项最终仍要根据“become more human”这处局部原文判断。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,338,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021 n\u003cp>全文主旨在解释严肃肖像，因此开头的微笑照片应与这种印象形成反差；但帖子实际改变了谁的认识、是否涉及研究媒介的作用，仍须由首段说明。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>changed people’s impression of the Victorians\u003cbr>改变了人们对维多利亚时代人的印象\u003c/p>\n\u003c/blockquote>\n\u003cp>这些都是当代观看者对维多利亚时代人的新感受，B把两句共同说明的影响概括了出来。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。\u003c/p>\n\u003cp>本项最终仍要根据“become more human”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. highlighted social media’s role in Victorian studies","level":3,"raw":"### C. highlighted social media’s role in Victorian studies\n\n> 凸显了社交媒体在维多利亚时代研究中的作用\n\n**做题模式中的状态：** 第一轮C保留。当时选项呈现为“[xxx] social media’s role in Victorian studies”，保留了相应遮挡。当时的定位线索是：C的 social media’s role 让我们找到第1段 posting them on Twitter，因为Twitter就是发帖的平台，所以回看发帖以后引起轰动的那句话。读完全文后，做题模式再经交叉验证排除C，最终选择B。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\nhighlighted是“凸显”，C完整地声称帖子凸显了社交媒体对维多利亚研究的作用。Twitter确实是传播照片的媒介，但段中专门描述的结果是观看者惊讶，发现古人也会欢笑、因而更有人情味。\n\n作者没有评估社交媒体如何改变史料研究、学术方法或知识生产。C将消息传播所用的途径提升为全文开头要证明的对象；B则直接接住people与become more human之间的观感变化，覆盖作者实际写出的效果。\n\n**命题人借用的原文材料：**\n\n> I've found quite a few, and—since I started posting them on Twitter—they have been causing quite a stir.","context":{"mode":"image","asset":"questions","focus":[250,508,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option":"C"},"focusId":"focus-q31-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-C-0\">\u003cblockquote>\n\u003cp>凸显了社交媒体在维多利亚时代研究中的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“[xxx] social media’s role in Victorian studies”，保留了相应遮挡。当时的定位线索是：C的 social media’s role 让我们找到第1段 posting them on Twitter，因为Twitter就是发帖的平台，所以回看发帖以后引起轰动的那句话。读完全文后，做题模式再经交叉验证排除C，最 研究中的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>作者没有评估社交媒体如何改变史料研究、学术方法或知识生产。C将消息传播所用的途径提升为全文开头要证明的对象；B则直接接住people与become more human之间的观感变化，覆盖作者实际写出的效果。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。\u003c/p>\n\u003cp>本项最终仍要根据“become more human”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. re-evaluated the Victorians’ notion of public image","level":3,"raw":"### D. re-evaluated the Victorians’ notion of public image\n\n> 重新评价了维多利亚时代人对公众形象的观念\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D的 the Victorians’ notion of public image 说过去那些人的观念，所以回看第1段 People have been surprised，确认改变的是当时被摄者的观念，还是现在观看照片者的感受。\n\n**错误类型：第一类——歪曲原意。**\n\n原文的 People have been surprised 接在Twitter发帖之后，说的是当代读者看到旧照片的反应；他们觉得旧时代的人变得更有人性。D的 the Victorians’ notion of public image 却把讨论对象放在维多利亚时代的人对自己公众形象的观念上。照片改变“我们怎样看他们”，不等于重新评价“他们怎样看自己的公众形象”。两个方向都提到Victorians，但拥有观念的人不同。\n\n第1段明确展示的是看帖者的惊讶和亲近感，D把观看者的印象换成被观看者自己的观念。\n\n**命题人借用的原文材料：**\n\n> People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\n>\n> They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.","context":{"mode":"image","asset":"questions","focus":[250,594,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option":"D"},"focusId":"focus-q31-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-D-0\">\u003cblockquote>\n\u003cp>重新评价了维多利亚时代人对公众形象的观念\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 the Victorians’ notion of public image 说过去那些人的观念，所以回看第1段 People have been surprised，确认改变的是当时被摄者的观念，还是现在观看照片者的感受。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 People h more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003cp>作者发出微笑的维多利亚时代肖像，人们从这些人脸上看见与自己一样的笑声；原本被当作严肃古人的对象因此显得有人情味。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The posts reassessed what Victorians themselves believed about their public image.\u003c/p>\n\u003cp>这些帖子重新评价了维多利亚人自己如何看待公众形象。\u003c/p>\n\u003c/blockquote>\n\u003cp>本段的观察者是今天看照片的人，被改变的是他们对古人的印象。维多利亚人当年的体面观念在后文出现，不能把两群人的观念相互替换。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨在解释严肃肖像，因此开头的微笑照片应与这种印象形成反差；但帖子实际改变了谁的认识、是否涉及研究媒介的作用，仍须由首段说明。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>re-evaluated the Victorians’ notion of public image\u003cbr>重新评价了维多利亚时代人对公众形象的观念\u003c/p>\n\u003c/blockquote>\n\u003cp>第1段明确展示的是看帖者的惊讶和亲近感，D把观看者的印象换成被观看者自己的观念。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。\u003c/p>\n\u003cp>本项最终仍要根据“become more human”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"31题结论","level":2,"raw":"### 31题结论\n\n> **31. B. changed people’s impression of the Victorians**\n\nA：首段写观看者反应，没有按阶段展示摄影技术的发展。\n\nB：微笑照片让古人更有人情味，改变的是今天观看者的印象。\n\nC：Twitter是传播途径，首段没有评估社交媒体对学科研究的总体作用。\n\nD：帖子改变当代人的印象，不是重新评价古人自己的公众形象观。","context":{"mode":"image","asset":"questions","focus":[250,244,1800,439],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"question":"31","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>31. B. changed people’s impression of the Victorians\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：首段写观看者反应，没有按阶段展示摄影技术的发展。\u003c/p>\n\u003cp>B：微笑照片让古人更有人情味，改变的是今天观看者的印象。\u003c/p>\n\u003cp>C：Twitter是传播途径，首段没有评估社交媒体对学科研究的总体作用。\u003c/p>\n\u003cp>D：帖子改变当代人的印象，不是重新评价古人自己的公众形象观。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"32题 · 题干、题型与核心出处","level":2,"raw":"## 32题\n\n> What does the author say about the Victorian portraits he has collected?  \n> 作者怎样描述他所收集的维多利亚时代肖像照片？\n\n### 题型\n\n收藏特征题。题干要求判断“作者怎样描述他所收集的维多利亚时代肖像照片？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Of course, I need to concede that my collection of 'Smiling Victorians' makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance. How do we explain this trend?\n\nmy collection指微笑照片；作者承认它们只占1840至1900年海量肖像的极小比例，多数照片反而是僵硬、严肃的姿态。","context":{"mode":"image","asset":"questions","focus":[250,754,1800,439],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"question":"32","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>What does the author say about the Victorian portraits he has collected?\u003cbr>作者怎样描述他所收集的维多利亚时代肖像照片？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>收藏特征题。题干要求判断“作者怎样描述他所收集的维多利亚时代肖像照片？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance. How do we explain this trend?\u003c/p>\n\u003c/blockquote>\n\u003cp>my collection指微笑照片；作者承认它们只占1840至1900年海量肖像的极小比例，多数照片反而是僵硬、严肃的姿态。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. They are in popular use among historians.","level":3,"raw":"### A. They are in popular use among historians.\n\n> 它们在历史学家中被广泛使用。\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 in popular use among historians 说很多历史学家在使用，第2段 my collection 则说作者持有的资料，两处都涉及谁在接触这些照片，所以回看my collection所在的完整句子，确认所说的是个人还是同行。\n\n**错误类型：第三类——无中生有。**\n\nA的 in popular use among historians 却把一位历史学家收集照片改成历史学家这个群体普遍使用它们。作者本人是历史学家，只能连接个人职业与个人收藏，不能把my换成很多历史学家的共同使用情况。这里的数量比较也在比较照片类型的多少，并不是比较使用者人数。\n\nmy限定了收藏的主人，A把这一位的行为扩成整个研究群体的普遍做法，原句的比例也不是使用率。\n\n**命题人借用的原文材料：**\n\n> Of course, I need to concede that my collection of 'Smiling Victorians' makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance. How do we explain this trend?","context":{"mode":"image","asset":"questions","focus":[250,848,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"A"},"focusId":"focus-q32-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>它们在历史学家中被广泛使用。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 in popular use among historians 说很多历史学家在使用，第2段 my collection 则说作者持有的资料，两处都涉及谁在接触这些照片，所以回看my collection所在的完整句子，确认所说的是个人还是同行。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>A的 in popular use among historians 却把一位历史学家收集照片改成历史学家这个群体普遍使用它们。作者本人是历史学家，只能连接个人职业与个人收藏，不能把my换成很多历史学家的共同使用情况。这里的数量比较也在比较照片类型的多少，并不是比较使用者人数。\u003c/p>\n\u003cp>my限定了收藏的主人，A把这一位的行为扩成整个研究群体的普遍做法，原句的比例也不是使用率。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance. How do we explain this trend?\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. They are in popular use among historians.","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者所收集的维多利亚时代肖像它们在历史学家中被广泛使用。\n\nA的 in popular use among historians 说很多历史学家在使用，第2段 my collection 则说作者持有的资料，两处都涉及谁在接触这些照片，所以回看my collection所在的完整句子，确认所说的是个人还是同行。\n\nA的 in popular use among historians 却把一位历史学家收集照片改成历史学家这个群体普遍使用它们。作者本人是历史学家，只能连接个人职业与个人收藏，不能把my换成很多历史学家的共同使用情况。这里的数量比较也在比较照片类型的多少，并不是比较使用者人数。\n\nmy限定了收藏的主人，A把这一位的行为扩成整个研究群体的普遍做法，原句的比例也不是使用率。","context":{"mode":"image","asset":"questions","focus":[250,848,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"32","option":"A"},"focusId":"focus-q32-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>它们在历史学家中被广泛使用。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 in popular use among historians 说很多历史学家在使用，第2段 my collection 则说作者持有的资料，两处都涉及谁在接触这些照片，所以回看my collection所在的完整句子，确认所说的是个人还是同行。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>A的 in popular use among historians 却把一位历史学家收集照片改成历史学家这个群体普遍使用它们。作者本人是历史学家，只能连接个人职业与个人收藏，不能把my换成很多历史学家的共同使用情况。这里的数量比较也在比较照片类型的多少，并不是比较使用者人数。\u003c/p>\n\u003cp>my限定了收藏的主人，A把这一位的行为扩成整个研究群体的普遍做法，原句的比例也不是使用率。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentag ain this trend?","context":{"mode":"image","asset":"questions","focus":[250,934,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"B"},"focusId":"focus-q32-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-B-0\">\u003cblockquote>\n\u003cp>它们展示了不同曝光时间的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 different exposure times 说曝光时间差别，粗读第3、4段留下了exposure times、曝光时间和快得多，这些都涉及拍一张照片要多久，所以回到这两段，从头到尾读完，再看它们与作者收藏的联系。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>现在回到B说的这些收藏：曝光时间的变化是否被作者用来描述这批微笑照片，要与第2段的my collection分开看。\u003c/p>\n\u003cp>技术段解释的是大众肖像少笑的原因，收藏则因都展示微笑而被挑出；B把后面的解释对象换成了作者这批收藏。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance. How do we explain this trend?\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. They show effects of different exposure times.","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者所收集的维多利亚时代肖像它们展示了不同曝光时间的效果。\n\nB的 different exposure times 说曝光时间差别，粗读第3、4段留下了exposure times、曝光时间和快得多，这些都涉及拍一张照片要多久，所以回到这两段，从头到尾读完，再看它们与作者收藏的联系。\n\n现在回到B说的这些收藏：曝光时间的变化是否被作者用来描述这批微笑照片，要与第2段的my collection分开看。\n\n第3段的 exposure times were 说早期曝光很长，第4段又说后来容易捕捉自然微笑。B的 different exposure times 把这两段的技术解释当成作者收藏的展示内容。但作者对这批收藏的共同描述是“Smiling Victorians”，并说它们是少数；后两段是在解释为什么整个时代的大多数肖像少有笑容，没有说收藏按曝光长短配对、展现了各自效果。把一般摄影条件的变化改成某一批微笑照片的共同特征，谈论的照片范围变了。\n\n技术段解释的是大众肖像少笑的原因，收藏则因都展示微笑而被挑出；B把后面的解释对象换成了作者这批收藏。","context":{"mode":"image","asset":"questions","focus":[250,934,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"32","option":"B"},"focusId":"focus-q32-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-B-0\">\u003cblockquote>\n\u003cp>它们展示了不同曝光时间的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 different exposure times 说曝光时间差别，粗读第3、4段留下了exposure times、曝光时间和快得多，这些都涉及拍一张照片要多久，所以回到这两段，从头到尾读完，再看它们与作者收藏的联系。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>现在回到B说的这些收藏：曝光时间的变化是否被作者用来描述这批微笑照片，要与第2段的my collection分开看。\u003c/p>\n\u003cp>技术段解释的是大众肖像少笑的原因，收藏则因都展示微笑而被挑出；B把后面的解释对象换成了作者这批收藏。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance. How do we explain this trend?\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者所收集的维多利亚时代肖像它们展示了不同曝光时间的效果。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 different exposure times 说曝光时间差别，粗读第3、4段留下了exposure times、曝光时间和快得多，这些都涉及拍一张照片要多久，所以回到这两段，从头到尾读完，再看它们与作者收藏的联系。\u003c/p>\n\u003cp>现在回到B说的这些收藏：曝光时间的变化是否被作者用来描述这批微笑照片，要与第2段的my collection分开看。\u003c/p>\n\u003cp>第3段的 exposure times were 说早期曝光很长，第4段又说后来容易捕捉自然微笑。B的 different exposure times 把这两段的技术解释当成作者收藏的展示内容。但作者对这批收藏的共同描述是“Smiling Victorians”，并说它们是少数；后两段是在解释为什么整个时代的大多数肖像少有笑容，没有说收藏按曝光长短配对、展现了各自效果。把一般摄影条件的变化改成某一批微笑照片的共同特征，谈论 ns.\n\n> 它们反映了19世纪的社会习俗。\n\n**做题模式中的状态：** 第一轮D保留。当时选项呈现为“They mirror 19th-century social [xxx].”，保留了相应遮挡。当时的定位线索是：D的 19th-century social 谈那个时代的社会情况，第2段 created between 1840 and 1900 给出了照片年代，所以回看这个年份范围以及作者对照片表情的描述。读完全文后，做题模式再经交叉验证排除D，最终选择C。\n\n**错误类型：第一类——歪曲原意。**\n\nsocial conventions是“社会习俗”。作者这批收藏特指微笑照片，而不是1840年至1900年所有肖像；only a tiny percentage表明它们是少数，多数反而摆着僵硬严肃的姿势。\n\n后文的体面规范解释为何多数人不露齿。不能因这些照片拍于十九世纪，就认为作者挑出的微笑例外代表了当时的主流习俗；D混淆了特别收藏与总体常态，C才保留了段中最明确的数量关系。\n\n**命题人借用的原文材料：**\n\n> Of course, I need to concede that my collection of 'Smiling Victorians' makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance.","context":{"mode":"image","asset":"questions","focus":[250,1103,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"D"},"focusId":"focus-q32-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-D-0\">\u003cblockquote>\n\u003cp>它们反映了19世纪的社会习俗。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“They mirror 19th-century social [xxx].”，保留了相应遮挡。当时的定位线索是：D的 19th-century social 谈那个时代的社会情况，第2段 created between 1840 and 1900 给出了照片年代，所以回看这个年份范围以及作者对照片表情的描述。读完全文后，做题模式再经交叉验证排除D，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>social conventions是“社会习俗”。作者这批收藏特指微笑照片，而不是1840年至1900年所有肖像；only a tiny percentage表明它们是少数，多数反而摆着僵硬严肃的姿势。\u003c/p>\n\u003cp>后文的体面规范解释为何多数人不露齿。不能因这些照片拍于十九世纪，就认为作者挑出的微笑例外代表了当时的主流习俗；D混淆了特别收藏与总体常态，C才保留了段中最明确的数量关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage o lify the dominant social convention of the nineteenth century.\u003c/p>\n\u003cp>这些微笑肖像体现了十九世纪占主导的社会习俗。\u003c/p>\n\u003c/blockquote>\n\u003cp>多数严肃肖像才与后文不宜露齿的观念相合。收藏中能看到真实微笑，恰好构成常态之外的例外；不能因照片来自十九世纪就认定它代表主流习俗。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q32-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认多数肖像严肃，不能单独证明作者所藏照片的使用范围和代表性；本题须看作者如何界定这批微笑照片与总体的关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>They mirror 19th-century social conventions.\u003cbr>它们反映了19世纪的社会习俗。\u003c/p>\n\u003c/blockquote>\n\u003cp>后文的体面规范解释为何多数人不露齿。不能因这些照片拍于十九世纪，就认为作者挑出的微笑例外代表了当时的主流习俗；D混淆了特别收藏与总体常态，C才保留了段中最明确的数量关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明微笑照片只是少数，多数肖像僵硬严肃，提出为什么会这样。\u003c/p>\n\u003cp>本项最终仍要根据“only a tiny percentage”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"32题结论","level":2,"raw":"### 32题结论\n\n> **32. C. They are rare among photographs of that age.**\n\nA：作者个人收藏与分享，不能推出历史学家普遍使用这些照片。\n\nB：曝光是后文解释变量，不是本段对微笑收藏的数量描述。\n\nC：极小比例准确对应这些照片在当时影像中很少见。\n\nD：特别挑选的微笑例外不能代表多数严肃肖像背后的主流习俗。","context":{"mode":"image","asset":"questions","focus":[250,754,1800,439],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"question":"32","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>32. C. They are rare among photographs of that age.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：作者个人收藏与分享，不能推出历史学家普遍使用这些照片。\u003c/p>\n\u003cp>B：曝光是后文解释变量，不是本段对微笑收藏的数量描述。\u003c/p>\n\u003cp>C：极小比例准确对应这些照片在当时影像中很少见。\u003c/p>\n\u003cp>D：特别挑选的微笑例外不能代表多数严肃肖像背后的主流习俗。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"33题 · 题干、题型与核心出处","level":2,"raw":"## 33题\n\n> What might have kept the Victorians from smiling for pictures in the 1890s?  \n> 十九世纪九十年代，什么可能仍让维多利亚时代的人不愿在照片中微笑？\n\n### 题型\n\n限定年代原因题。题干要求判断“十九世纪九十年代，什么可能仍让维多利亚时代的人不愿在照片中微笑？”，先按第4、5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today's digital standards, the exposure was almost instantaneous. Spontaneous smiles were relatively easy to capture by the 1890s, so we must look elsewhere for an explanation of why Victorians still hesitated to smile.\n>\n> One explanation might be the loss of dignity displayed through a cheesy grin. \"Nature gave us lips to conceal our teeth,\" ran one popular Victorian saying, alluding to the fact that before the birth of proper dentistry, mouths were often in a shocking state of hygiene. A flashing set of healthy and clean, regular 'pearly whites' was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not guaranteed).\n\n第4段明确当时相机已能迅速捕捉自然微笑，因此单靠早期长曝光解释不了；第5段转向露齿失体面，并说明当时牙齿卫生很差。","context":{"mode":"image","asset":"questions","focus":[250,1264,1800,429],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"question":"33","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>What might have kept the Victorians from smiling for pictures in the 1890s?\u003cbr>十九世纪九十年代，什么可能仍让维多利亚时代的人不愿在照片中微笑？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>限定年代原因题。题干要求判断“十九世纪九十年代，什么可能仍让维多利亚时代的人不愿在照片中微笑？”，先按第4、5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today&#39;s digital standards, the exposure was almost instantaneous. Spontaneous smiles were relatively easy to capture by the 1890s, so we must look elsewhere for an explanation of why Victorians still hesitated to smile.\u003c/p>\n\u003cp>One explanation might be the loss of dignity displayed through a cheesy grin. &quot;Nature gave us lips to conceal our teeth,&quot; ran one popular Victorian saying, alluding to the fact that before the birth of proper dentistry, mouths were often in a shocking state of hygiene. A flashing set of healthy and clean, regular &#39;pearly whites&#39; was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not guaranteed).\u003c/p>\n\u003c/blockquote>\n\u003cp>第4段明确当时相机已能迅速捕捉自然微笑，因此单靠早期长曝光解释不了；第5段转向露齿失体面，并说明当时牙齿卫生很差。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. Their unhealthy dental condition.","level":3,"raw":"### A. Their unhealthy dental condition.\n\n> 他们不健康的牙齿状况。\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“Their unhealthy dental [xxx].”，保留了相应遮挡。当时的定位线索是：A的 unhealthy dental 对应第5段 mouths were often in a shocking state of hygiene，都是在说口腔健康不好，所以回看这句以及后面健康干净牙齿很罕见的补充。\n\n**选项类型：正确同义改写。**\n\ndental condition是“牙齿状况”，unhealthy明确限定健康不佳。第5段指出口腔卫生经常糟糕，整齐洁白的牙齿很少见，甚至富人也不能保证牙齿卫生；这会使露齿笑损害当时重视的体面。\n\n题干限定1890s：此时第4段已说自然微笑容易捕捉，所以早期长曝光不能单独解释仍然不笑。牙齿不佳在技术改善后仍可能成立，A同时满足年代限定和紧接其后的具体原因。\n\n**出处：**\n\n> A flashing set of healthy and clean, regular 'pearly whites' was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not guaranteed).","context":{"mode":"image","asset":"questions","focus":[250,1358,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"33","option":"A"},"focusId":"focus-q33-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>他们不健康的牙齿状况。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“Their unhealthy dental [xxx].”，保留了相应遮挡。当时的定位线索是：A的 unhealthy dental 对应第5段 mouths were often in a shocking state of hygiene，都是在说口腔健康不好，所以回看这句以及后面健康干净牙齿很罕见的补充。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>dental condition是“牙齿状况”，unhealthy明确限定健康不佳。第5段指出口腔卫生经常糟糕，整齐洁白的牙齿很少见，甚至富人也不能保证牙齿卫生；这会使露齿笑损害当时重视的体面。\u003c/p>\n\u003cp>题干限定1890s：此时第4段已说自然微笑容易捕捉，所以早期长曝光不能单独解释仍然不笑。牙齿不佳在技术改善后仍可能成立，A同时满足年代限定和紧接其后的具体原因。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A flashing set of healthy and clean, regular &#39;pearly whites&#39; was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not guaranteed).\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. Their unhealthy dental condition.","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 十九世纪九十年代，维多利亚时代的人拍照不笑，可能是因为他们不健康的牙齿状况。\n\nA的 unhealthy dental 对应第5段 mouths were often in a shocking state of hygiene，都是在说口腔健康不好，所以回看这句以及后面健康干净牙齿很罕见的补充。\n\ndental condition是“牙齿状况”，unhealthy明确限定健康不佳。第5段指出口腔卫生经常糟糕，整齐洁白的牙齿很少见，甚至富人也不能保证牙齿卫生；这会使露齿笑损害当时重视的体面。\n\n题干限定1890s：此时第4段已说自然微笑容易捕捉，所以早期长曝光不能单独解释仍然不笑。牙齿不佳在技术改善后仍可能成立，A同时满足年代限定和紧接其后的具体原因。\n\n第4段明确当时相机已能迅速捕捉自然微笑，因此单靠早期长曝光解释不了；第5段转向露齿失体面，并说明当时牙齿卫生很差。\n\n第5段的dental hygiene was not to be taken for granted与a rare sight具体支持露齿顾虑。might与可能性相合，没有说所有人都同样缺牙。","context":{"mode":"image","asset":"questions","focus":[250,1358,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"33","option":"A"},"focusId":"focus-q33-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>他们不健康的牙齿状况。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“Their unhealthy dental [xxx].”，保留了相应遮挡。当时的定位线索是：A的 unhealthy dental 对应第5段 mouths were often in a shocking state of hygiene，都是在说口腔健康不好，所以回看这句以及后面健康干净牙齿很罕见的补充。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>dental condition是“牙齿状况”，unhealthy明确限定健康不佳。第5段指出口腔卫生经常糟糕，整齐洁白的牙齿很少见，甚至富人也不能保证牙齿卫生；这会使露齿笑损害当时重视的体面。\u003c/p>\n\u003cp>题干限定1890s：此时第4段已说自然微笑容易捕捉，所以早期长曝光不能单独解释仍然不笑。牙齿不佳在技术改善后仍可能成立，A同时满足年代限定和紧接其后的具体原因。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A flashing set of healthy and clean, regular &#39;pearly whites&#39; was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not guaranteed).\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>十九世纪九十年代，维多利亚时代的人拍照不笑，可能是因为他们不健康的牙齿状况。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 unhealthy dental 对应第5段 mouths were often in a shocking state of hygiene，都是在说口腔健康不好，所以回看这句以及后面健康干净牙齿很罕见的补充。\u003c/p>\n\u003cp>dental condition是“牙齿状况”，unhealthy明确限定健康不佳。第5段指出口腔卫生经常糟糕，整齐洁白的牙齿很少见，甚至富人也不能保证牙齿卫生；这会使露齿笑损害当时重视的体面。\u003c/p>\n\u003cp>题干限定1890s：此时第4段已说自然微笑容易捕捉，所以早期长曝光不能单独解释仍然不笑。牙齿不佳在技术改善后仍可能成立，A同时满足年代限定和紧接其后的具体原因。\u003c/p>\n\u003cp>第4段明确当时相机已能迅速捕捉自然微笑，因此单靠早期长曝光解释不了；第5段转向露齿失体面，并说明当时牙齿卫生很差。\u003c/p>\n\u003cp>第5段的dental hygiene was not to be taken for granted与a rare sight具体支持露齿顾虑。might与可能性相合，没有说所有人都同样缺牙。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. Their unhealthy dental condition.","level":4,"raw":"#### 写作视角法\n\n原文第4、5段是这样写的：\n\n> A flashing set of healthy and clean, regular 'pearly whites' was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not guaranteed).\n>\n> 第4段明确当时相机已能迅速捕捉自然微笑，因此单靠早期长曝光解释不了；第5段转向露齿失体面，并说明当时牙齿卫生很差。\n\n把这一处放回全文，它承担的写作任务是：指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Poor dental health may have discouraged people from showing their teeth in photographs.\n>\n> 糟糕的牙齿状况可能使人不愿在照片中露齿。\n\n第5段的dental hygiene was not to be taken for granted与a rare sight具体支持露齿顾虑。might与可能性相合，没有说所有人都同样缺牙。","context":{"mode":"image","asset":"questions","focus":[250,1358,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"33","option":"A"},"focusId":"focus-q33-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-A-0\">\u003cblockquote>\n\u003cp>他们不健康的牙齿状况。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“Their unhealthy dental [xxx].”，保留了相应遮挡。当时的定位线索是：A的 unhealthy dental 对应第5段 mouths were often in a shocking state of hygiene，都是在说口腔健康不好，所以回看这句以及后面健康干净牙齿很罕见的补充。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>dental condition是“牙齿状况”，unhealthy明确限定健康不佳。第5段指出口腔卫生经常糟糕，整齐洁白的牙齿很少见，甚至富人也不能保证牙齿卫生；这会使露齿笑损害当时重视的体面。\u003c/p>\n\u003cp>题干限定1890s：此时第4段已说自然微笑容易捕捉，所以早期长曝光不能单独解释仍然不笑。牙齿不佳在技术改善后仍可能成立，A同时满足年代限定和紧接其后的具体原因。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A flashing set of healthy and clean, regular &#39;pearly whites&#39; was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not guaranteed).\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>十九世纪九十年代，维多利亚时代的人拍照不笑，可能是因为他们不健康的牙齿状况。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 unhealthy dental 对应第5段 mouths were often in a shocking state of hygiene，都是在说口腔健康不好，所以回看这句以及后面健康干净牙齿很罕见的补充。\u003c/p>\n\u003cp>dental condition是“牙齿状况”，unhealthy明确限定健康不佳。第5段指出口腔卫生经常糟糕，整齐洁白的牙齿很少见，甚至富人也不能保证牙齿卫生；这会使露齿笑损害当时重视的体面。\u003c/p>\n\u003cp>题干限定1890s：此时第4段已说自然微笑容易捕捉，所以早期长曝光不能单独解释仍然不笑。牙齿不佳在技术改善后仍可能成立，A同时满足年代限定和紧接其后的具体原因。\u003c/p>\n\u003cp>第4段明确当时相机已能迅速捕捉自然微笑，因此单靠早期长曝光解释不了；第5段转向露齿失体面，并说明当时牙齿卫生很差。\u003c/p>\n\u003cp>第5段的dental hygiene was not to be taken for granted与a rare sight具体支持 5段转向露齿失体面，并说明当时牙齿卫生很差。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Poor dental health may have discouraged people from showing their teeth in photographs.\u003c/p>\n\u003cp>糟糕的牙齿状况可能使人不愿在照片中露齿。\u003c/p>\n\u003c/blockquote>\n\u003cp>第5段的dental hygiene was not to be taken for granted与a rare sight具体支持露齿顾虑。might与可能性相合，没有说所有人都同样缺牙。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章寻找严肃表情的原因，不能直接确定1890年代仍成立的是哪种原因；必须把当时的技术条件与后续解释连起来。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Their unhealthy dental condition.\u003cbr>他们不健康的牙齿状况。\u003c/p>\n\u003c/blockquote>\n\u003cp>题干限定1890s：此时第4段已说自然微笑容易捕捉，所以早期长曝光不能单独解释仍然不笑。牙齿不佳在技术改善后仍可能成立，A同时满足年代限定和紧接其后的具体原因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。\u003c/p>\n\u003cp>本项最终仍要根据“mouths were often in a shocking state of hygiene”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Their inherent social sensitiveness.","level":3,"raw":"### B. Their inherent social sensitiveness.\n\n> 他们固有的社交敏感性。\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B的 inherent social sensitiveness 说一种生来就有的社交心理，所以回看第5段 one popular Victorian saying 及其后具体的牙齿卫生解释，确认作者归因于性格还是当时的身体和社会处境。\n\n**错误类型：第三类——无中生有。**\n\nB的 inherent social sensitiveness 却把原因定为天生的敏感性格。对露牙是否体面的顾虑，出现在具体时代的流行观念和牙齿卫生处境中；把这些处境解释换成“他们生来敏感”，多加了inherent这个性质。作者没有把他们写成天生不会自然笑的人，第4段反而说自然微笑已容易捕捉。\n\nB把具体时代的观念与卫生问题变成内在天性，inherent所限定的原因不是这一段给出的解释。\n\n**命题人借用的原文材料：**\n\n> One expla 数维多利亚时代的人在照片中显得严肃？\n\n把这个主旨直接代入33题题干：\n\n> 全文主旨只能确认文章寻找严肃表情的原因，不能直接确定1890年代仍成立的是哪种原因；必须把当时的技术条件与后续解释连起来。\n\n但B实际说的是：\n\n> Their inherent social sensitiveness.  \n> 他们固有的社交敏感性。\n\nB把具体时代的观念与卫生问题变成内在天性，inherent所限定的原因不是这一段给出的解释。\n\n从全文推进看，这一处的作用是：指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。\n\n本项最终仍要根据“mouths were often in a shocking state of hygiene”这处局部原文判断。\n\n**复盘判断：B错误。**","context":{"mode":"image","asset":"questions","focus":[250,1444,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"33","option":"B"},"focusId":"focus-q33-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q33-B-0\">\u003cblockquote>\n\u003cp>他们固有的社交敏感性。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 inherent social sensitiveness 说一种生来就有的社交心理，所以回看第5段 one popular Victorian saying 及其后具体的牙齿卫生解释，确认作者归因于性格还是当时的身体和社会处境。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>B的 inherent social sensitiveness 却把原因定为天生的敏感性格。对露牙是否体面的顾虑，出现在具体时代的流行观念和牙齿卫生处境中；把这些处境解释换成“他们生来敏感”，多加了inherent这个性质。作者没有把他们写成天生不会自然笑的人，第4段反而说自然微笑已容易捕捉。\u003c/p>\n\u003cp>B把具体时代的观念与卫生问题变成内在天性，inherent所限定的原因不是这一段给出的解释。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>One explanation might be the loss of dignity displayed through a cheesy grin.\u003c/p>\n\u003cp>&quot;Nature gave us lips to conceal our teeth,&quot; ran one popular Victorian saying, alluding to the fact that before the birth of proper dentistry, mouths were often in a shocking state of hygiene.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q33-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>十九世纪九十年代，维多利亚时代的人拍照不笑，可能是因为他们固有的社交敏感性。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 inherent social sensit
