the text or the image that makes us re-evaluate the past, I&#39;ve become preoccupied with looking for photographs that show our Victorian ancestors smiling (what better way to shatter the image of 19th-century prudery?). I&#39;ve found quite a few, and—since I started posting them on Twitter—they have been causing quite a stir. People have been surprised to see evidence that Victorians had fun and could, and did, laugh. They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>As a historian / who&#39;s always searching for / the text or the image / that makes us re-evaluate the past, / I&#39;ve become preoccupied / with looking for photographs / that show our Victorian ancestors smiling / (what better way / to shatter the image / of 19th-century prudery?).\u003c/p>\n\u003cp>I&#39;ve found quite a few, / and—since I started posting them / on Twitter— / they have been causing / quite a stir.\u003c/p>\n\u003cp>People have been surprised / to see evidence / that Victorians had fun / and could, and did, laugh.\u003c/p>\n\u003cp>They are noting / that the Victorians suddenly seem / to become more human / as the hundred-or-so years / that separate us / fade away / through our common experience / of laughter.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>作为一名历史学家 / 一直在寻找 / 文本或图像 / 让我们重新评估过去的，/ 我变得专注于 / 寻找照片 / 展示我们维多利亚时代祖先微笑的 / （还有什么更好的方式 / 来打破形象 / 19世纪拘谨的？）。\u003c/p>\n\u003cp>我已经找到了不少，/ 而且——自从我开始发布它们 / 在推特上—— / 它们一直在引起 / 相当大的轰动。\u003c/p>\n\u003cp>人们一直很惊讶 / 看到证据 / 维多利亚时代的人有乐趣 / 并且能够，也确实会笑。\u003c/p>\n\u003cp>他们正在注意到 / 维多利亚时代的人突然似乎 / 变得更有人性 / 随着大约一百年 / 分隔我们的 / 消失 / 通过我们共同的经历 / 笑的。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>作为一名历史学家，我一直在寻找能让我们重新评估过去的文本或图像，因此我开始专注于寻找展示维多利亚时代祖先微笑的照片（还有什么比这更能打破19世纪拘谨形象的方式呢？）。我已经找到了不少这样的照片，自从我开始在推特上发布它们以来，引起了相当大的轰动。人们惊讶地发现，原来维多利亚时代的人也会享受乐趣，也能够开怀大笑。他们注意到，通过笑这个共同的人类体验，分隔我们一百多年的时光似乎消失了，维多利亚时代的人突然变得更有人情味。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance. How do we explain this trend?\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Of course, / I need to concede / that my collection / of &#39;Smiling Victorians&#39; / makes up / only a tiny percentage / of the vast catalogue / of photographic portraiture / created between 1840 and 1900, / the majority of which / show sitters / posing miserably and stiffly / in front of painted backdrops, / or staring absently / into the middle distance.\u003c/p>\n\u003cp>How do we explain / this trend?\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>当然，/ 我需要承认 / 我的收藏 / &quot;微笑的维多利亚人&quot;的 / 只占 / 很小的百分比 / 在庞大的目录中 / 摄影肖像的 / 创作于1840年到1900年之间的，/ 其中大多数 / 展示拍摄对象 / 摆姿势悲惨而僵硬地 / 在彩绘背景前，/ 或茫然地凝视 / 中等距离。\u003c/p>\n\u003cp>我们如何解释 / 这种趋势？\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>当然，我必须承认，我收集的&quot;微笑的维多利亚人&quot;照片只占1840年到1900年间创作的庞大摄影肖像目录中的极小一部分，其中大多数照片展示的是拍摄对象在彩绘背景前悲惨而僵硬地摆着姿势，或者茫然地凝视着中景。我们该如何解释这种现象呢？\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>During the 1840s and 1850s, in the early days of photography, exposure times were notoriously long: the daguerreotype photographic method (producing an image on a silvered copper plate) could take several minutes to complete, resulting in blurred images as sitters shifted position or adjusted their limbs. The thought of holding a fixed grin as the camera performed its magical duties was too much to contemplate, and so a non-committal blank stare became the norm.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>During the 1840s and 1850s, / in the early days of photography, / exposure times / were notoriously long: / the daguerreotype photographic method / (producing an image / on a silvered copper plate) / could take / several minutes to complete, / resulting in blurred images / as sitters shifted position / or adjusted their limbs.\u003c/p>\n\u003cp>The thought / of holding a fixed grin / as the camera performed / its magical duties / was too much to contemplate, / and so a non-committal blank stare / became the norm.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>在1840年代和1850年代，/ 在摄影的早期，/ 曝光时间 / 出了名地长：/ 银版照相法 / （产生图像 / 在镀银的铜板上）/ 可能需要 / 几分钟才能完成，/ 导致模糊的图像 / 当拍摄对象改变位置 / 或调整他们的肢体时。\u003c/p>\n\u003cp>想法 / 保持固定的咧嘴笑 / 当相机执行 / 它的神奇职责时 / 太难以考虑了，/ 因此一种不带感情的茫然凝视 / 成为了常态。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>在19世纪40年代和50年代，也就是摄影技术的早期，曝光时间出了名地长：银版照相法（在镀银的铜板上成像）可能需要几分钟才能完成，如果拍摄对象改变位置或调整肢体，就会导致图像模糊。在相机执行其神奇职责时保持固定的咧嘴笑实在太困难了，因此一种不带感情的茫然凝视成为了常态。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today&#39;s digital standards, the exposure was almost instantaneous. Spontaneous smiles were relatively easy to capture by the 1890s, so we must look elsewhere for an explanation of why Victorians still hesitated to smile.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>But exposure times / were much quicker / by the 1880s, / and the introduction / of the Box Brownie / and other portable cameras / meant that, / though slow / by today&#39;s digital standards, / the exposure / was almost instantaneous.\u003c/p>\n\u003cp>Spontaneous smiles / were relatively easy to capture / by the 1890s, / so we must look elsewhere / for an explanation / of why Victorians / still hesitated to smile.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>但曝光时间 / 变得快多了 / 到1880年代，/ 而且引入 / 盒式布朗尼相机 / 和其他便携式相机 / 意味着，/ 虽然缓慢 / 按今天的数字标准，/ 曝光 / 几乎是瞬间的。\u003c/p>\n\u003cp>自然的微笑 / 相对容易捕捉 / 到1890年代，/ 所以我们必须在别处寻找 / 解释 / 为什么维多利亚时代的人 / 仍然不愿意微笑。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>但到了19世纪80年代，曝光时间已经大大缩短，盒式布朗尼相机和其他便携式相机的出现意味着，虽然按今天的数字标准来看仍然缓慢，但曝光几乎是瞬间完成的。到19世纪90年代，捕捉自然的微笑已经相对容易，所以我们必须从别处寻找维多利亚时代的人仍然不愿意微笑的原因。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>One explanation might be the loss of dignity displayed through a cheesey grin. &quot;Nature gave us lips to conceal our teeth,&quot; ran one popular Victorian maxim, alluding to the fact that before the birth of proper dentistry, mouths were often in a shocking state of hygiene. A flashing set of healthy and clean, regular &#39;pearly whites&#39; was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not guaranteed).\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>One explanation / might be / the loss of dignity / displayed through a cheesey grin.\u003c/p>\n\u003cp>&quot;Nature gave us lips / to conceal our teeth,&quot; / ran one popular Victorian maxim, / alluding to the fact / that before the birth / of proper dentistry, / mouths were often / in a shocking state / of hygiene.\u003c/p>\n\u003cp>A flashing set / of healthy and clean, / regular &#39;pearly whites&#39; / was a rare sight / in Victorian society, / the preserve of the super-rich / (and even then, / dental hygiene / was not guaranteed).\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>一个解释 / 可能是 / 尊严的丧失 / 通过俗气的咧嘴笑展现的。\u003c/p>\n\u003cp>&quot;大自然给了我们嘴唇 / 来遮掩我们的牙齿，&quot; / 是一句流行的维多利亚格言，/ 暗指事实 / 在正规牙科诞生之前，/ 口腔经常 / 处于令人震惊的状态 / 卫生方面。\u003c/p>\n\u003cp>一套闪亮的 / 健康干净的，/ 整齐的&quot;珍珠白&quot; / 是罕见的景象 / 在维多利亚社会中，/ 超级富豪的专属 / （即使那样，/ 牙齿卫生 / 也不能保证）。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>一个可能的解释是，俗气的咧嘴笑会显得失去尊严。&quot;大自然给了我们嘴唇来遮掩我们的牙齿&quot;，这是维多利亚时代的一句流行格言，暗指在正规牙科诞生之前，人们的口腔卫生状况经常令人震惊。在维多利亚社会，拥有一口健康干净、整齐的&quot;珍珠白&quot;牙齿是罕见的，只有超级富豪才有可能拥有（即使是他们，牙齿卫生也不能保证）。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>A toothy grin (especially when there were gaps or blackened gnashers) lacked class: drunks, tramps, and music hall performers might gurn and grin with a smile as wide as Lewis Carroll&#39;s gum-exposing Cheshire Cat, but it was not a becoming look for properly bred persons. Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>A toothy grin / (especially when there were / gaps or blackened gnashers) / lacked class: / drunks, tramps, / and music hall performers / might gurn and grin / with a smile / as wide as / Lewis Carroll&#39;s gum-exposing Cheshire Cat, / but it was not / a becoming look / for properly bred persons.\u003c/p>\n\u003cp>Even Mark Twain, / a man who enjoyed / a hearty laugh, / said that / when it came to / photographic portraits / there could be / &quot;nothing more damning / than a silly, foolish smile / fixed forever&quot;.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>露齿的咧嘴笑 / （尤其是当有 / 缺口或发黑的牙齿时）/ 缺乏品位：/ 醉汉、流浪汉，/ 和音乐厅表演者 / 可能扮鬼脸和咧嘴笑 / 带着微笑 / 宽得像 / 刘易斯·卡罗尔笔下露出牙龈的柴郡猫，/ 但这不是 / 一个得体的样子 / 对于有教养的人来说。\u003c/p>\n\u003cp>甚至马克·吐温，/ 一个喜欢 / 开怀大笑的人，/ 说 / 当涉及到 / 摄影肖像时 / 不可能有 / &quot;比愚蠢、傻乎乎的微笑 / 永远固定下来更糟糕的了&quot;。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>露齿的咧嘴笑（尤其是有缺牙或黑牙时）显得缺乏品位：醉汉、流浪汉和音乐厅表演者可能会扮鬼脸，咧嘴笑得像刘易斯·卡罗尔笔下露出牙龈的柴郡猫那样宽，但这对有教养的人来说并不得体。即使是喜欢开怀大笑的马克·吐温也说过，在拍摄肖像照时，&quot;没有什么比永远固定下来的愚蠢、傻乎乎的微笑更糟糕的了&quot;。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>As a historian：(who&#39;s always searching for → the text or the image：(that makes us re-evaluate the past)) → I&#39;ve become preoccupied：(with looking for photographs：(that show our Victorian ancestors smiling))：(what better way → to shatter the image：(of 19th-century prudery?)).\u003c/p>\n\u003cp>I&#39;ve found quite a few + and—since I started posting them：(on Twitter)— → they have been causing → quite a stir.\u003c/p>\n\u003cp>People have been surprised → to see evidence：(that Victorians had fun + could, and did, laugh).\u003c/p>\n\u003cp>They are noting：(that the Victorians suddenly seem → to become more human)：(as the hundred-or-so years：(that separate us) → fade away：(through our common experience：(of laughter))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Of course → I need to concede：(that my collection：(of &#39;Smiling Victorians&#39;) → makes up → only a tiny percentage：(of the vast catalogue：(of photographic portraiture：(created between 1840 and 1900))))，the majority of which → show sitters：(posing miserably and stiffly：(in front of painted backdrops)) // or staring absently：(into the middle distance).\u003c/p>\n\u003cp>How do we explain → this trend?\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>During the 1840s and 1850s：(in the early days of photography) → exposure times → were notoriously long：the daguerreotype photographic method：(producing an image：(on a silvered copper plate)) → could take → several minutes to complete → resulting in blurred images：(as sitters shifted position // or adjusted their limbs).\u003c/p>\n\u003cp>The thought：(of holding a fixed grin)：(as the camera performed → its magical duties) → was too much to contemplate + and so a non-committal blank stare → became the norm.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>But exposure times → were much quicker：(by the 1880s) + and the introduction：(of the Box Brownie + other portable cameras) → meant：(that, though slow：(by today&#39;s digital standards)，the exposure → was almost instantaneous).\u003c/p>\n\u003cp>Spontaneous smiles → were relatively easy to capture：(by the 1890s) → so we must look elsewhere → for an explanation：(of why Victorians → still hesitated to smile).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>One explanation → might be → the loss of dignity：(displayed through a cheesey grin).\u003c/p>\n\u003cp>&quot;Nature gave us lips → to conceal our teeth,&quot; → ran one popular Victorian maxim → alluding to the fact：(that before the birth：(of proper dentistry) → mouths were often → in a shocking state：(of hygiene)).\u003c/p>\n\u003cp>A flashing set：(of healthy and clean, regular &#39;pearly whites&#39;) → was a rare sight：(in Victorian society) → the preserve of the super-rich：(and even then → dental hygiene → was not guaranteed).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>A toothy grin：(especially when there were → gaps or blackened gnashers) → lacked class：drunks + tramps + music hall performers → might gurn and grin：(with a smile：(as wide as → Lewis Carroll&#39;s gum-exposing Cheshire Cat)) // but it was not → a becoming look：(for properly bred persons).\u003c/p>\n\u003cp>Even Mark Twain：(a man who enjoyed → a hearty laugh) → said：(that when it came to → photographic portraits → there could be → &quot;nothing more damning：(than a silly, foolish smile：(fixed forever))&quot;).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>作为一名历史学家：(一直在寻找 → 文本或图像：(让我们重新评估过去的)) → 我变得专注于：(寻找照片：(展示我们维多利亚时代祖先微笑的))：(还有什么更好的方式 → 来打破形象：(19世纪拘谨的？))。\u003c/p>\n\u003cp>我已经找到了不少 + 而且——自从我开始发布它们：(在推特上)—— → 它们一直在引起 → 相当大的轰动。\u003c/p>\n\u003cp>人们一直很惊讶 → 看到证据：(维多利亚时代的人有乐趣 + 能够，也确实会笑)。\u003c/p>\n\u003cp>他们正在注意到：(维多利亚时代的人突然似乎 → 变得更有人性)：(随着大约一百年：(分隔我们的) → 消失：(通过我们共同的经历：(笑的)))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>当然 → 我需要承认：(我的收藏：(&quot;微笑的维多利亚人&quot;的) → 只占 → 很小的百分比：(在庞大的目录中：(摄影肖像的：(创作于1840年到1900年之间的))))，其中大多数 → 展示拍摄对象：(摆姿势悲惨而僵硬地：(在彩绘背景前)) // 或茫然地凝视：(中等距离)。\u003c/p>\n\u003cp>我们如何解释 → 这种趋势？\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>在1840年代和1850年代：(在摄影的早期) → 曝光时间 → 出了名地长：银版照相法：(产生图像：(在镀银的铜板上)) → 可能需要 → 几分钟才能完成 → 导致模糊的图像：(当拍摄对象改变位置 // 或调整他们的肢体时)。\u003c/p>\n\u003cp>想法：(保持固定的咧嘴笑)：(当相机执行 → 它的神奇职责时) → 太难以考虑了 + 因此一种不带感情的茫然凝视 → 成为了常态。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>但曝光时间 → 变得快多了：(到1880年代) + 而且引入：(盒式布朗尼相机 + 其他便携式相机) → 意味着：(虽然缓慢：(按今天的数字标准)，曝光 → 几乎是瞬间的)。\u003c/p>\n\u003cp>自然的微笑 → 相对容易捕捉：(到1890年代) → 所以我们必须在别处寻找 → 解释：(为什么维多利亚时代的人 → 仍然不愿意微笑)。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>一个解释 → 可能是 → 尊严的丧失：(通过俗气的咧嘴笑展现的)。\u003c/p>\n\u003cp>&quot;大自然给了我们嘴唇 → 来遮掩我们的牙齿，&quot; → 是一句流行的维多利亚格言 → 暗指事实：(在正规牙科诞生之前 → 口腔经常 → 处于令人震惊的状态：(卫生方面))。\u003c/p>\n\u003cp>一套闪亮的：(健康干净的，整齐的&quot;珍珠白&quot;) → 是罕见的景象：(在维多利亚社会中) → 超级富豪的专属：(即使那样 → 牙齿卫生 → 也不能保证)。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>露齿的咧嘴笑：(尤其是当有 → 缺口或发黑的牙齿时) → 缺乏品位：醉汉 + 流浪汉 + 音乐厅表演者 → 可能扮鬼脸和咧嘴笑：(带着微笑：(宽得像 → 刘易斯·卡罗尔笔下露出牙龈的柴郡猫)) // 但这不是 → 一个得体的样子：(对于有教养的人来说)。\u003c/p>\n\u003cp>甚至马克·吐温：(一个喜欢 → 开怀大笑的人) → 说：(当涉及到 → 摄影肖像时 → 不可能有 → &quot;比愚蠢、傻乎乎的微笑：(永远固定下来)更糟糕的了&quot;)。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第2段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Of course, / I need to concede / that my collection / of &#39;Smiling Victorians&#39; / makes up / only a tiny percentage / of the vast catalogue / of photographic portraiture / created between 1840 and 1900, / the majority of which / show sitters / posing miserably and stiffly / in front of painted backdrops, / or staring absently / into the middle distance.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>当然，/ 我需要承认 / 我的收藏 / &quot;微笑的维多利亚人&quot;的 / 只占 / 很小的百分比 / 在庞大的目录中 / 摄影肖像的 / 创作于1840年到1900年之间的，/ 其中大多数 / 展示拍摄对象 / 摆姿势悲惨而僵硬地 / 在彩绘背景前，/ 或茫然地凝视 / 中等距离。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把让步和收藏占比连起来：\u003c/p>\n\u003cblockquote>\n\u003cp>当然，我得承认，我收集的“微笑的维多利亚人”只占1840年至1900年海量肖像照片中极小的一部分\u003c/p>\n\u003c/blockquote>\n\u003cp>再补上多数照片的样子：\u003c/p>\n\u003cblockquote>\n\u003cp>大部分照片中的人僵硬而愁苦地站在绘制的背景前，或茫然凝视着不远处\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>当然，我得承认，我收集的“微笑的维多利亚人”只占1840年至1900年海量肖像照片中极小的一部分；大部分照片中的人僵硬而愁苦地站在绘制的背景前，或茫然凝视着不远处。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>我的微笑照片收藏只占当时肖像照片的极小部分。\u003c/p>\n\u003c/blockquote>\n\u003cp>that从句是concede承认的内容；created修饰catalogue中的肖像照片，日期不是收藏活动的时间。the majority of which回指全部肖像照片，不回指我的微笑收藏。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>当然，我必须承认，我收藏的“微笑的维多利亚人”只占1840年至1900年海量肖像照片中的极小一部分；其中大多数照片上的人都在绘制的背景前僵硬愁苦地摆姿势，或茫然地凝视着不远处。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>only a tiny percentage与the majority形成少数和多数的对照，不能将后面的严肃姿态安到少数微笑照片身上。\u003c/p>\n\u003cp>painted backdrops是人工绘制的摄影背景；middle distance译为“不远处”更自然，保留茫然望去的神情，而不作精确距离测量。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>当然，我必须承认，我收集的&quot;微笑的维多利亚人&quot;照片只占1840年到1900年间创作的庞大摄影肖像目录中的极小一部分，其中大多数照片展示的是拍摄对象在彩绘背景前悲惨而僵硬地摆着姿势，或者茫然地凝视着中景。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第3段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>During the 1840s and 1850s, in the early days of photography, exposure times were notoriously long: the daguerreotype photographic method (producing an image on a silvered copper plate) could take several minutes to complete, resulting in blurred images as sitters shifted position or adjusted their limbs.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>During the 1840s and 1850s, / in the early days of photography, / exposure times / were notoriously long: / the daguerreotype photographic method / (producing an image / on a silvered copper plate) / could take / several minutes to complete, / resulting in blurred images / as sitters shifted position / or adjusted their limbs.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>在1840年代和1850年代，/ 在摄影的早期，/ 曝光时间 / 出了名地长：/ 银版照相法 / （产生图像 / 在镀银的铜板上）/ 可能需要 / 几分钟才能完成，/ 导致模糊的图像 / 当拍摄对象改变位置 / 或调整他们的肢体时。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把时代背景与长曝光的判断合并：\u003c/p>\n\u003cblockquote>\n\u003cp>十九世纪四五十年代摄影刚出现时，曝光时间长是出了名的\u003c/p>\n\u003c/blockquote>\n\u003cp>再解释具体工艺及其后果：\u003c/p>\n\u003cblockquote>\n\u003cp>在镀银铜板上成像的银版摄影法可能要几分钟，拍摄对象一旦挪动身体或调整四肢，影像就会模糊\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>十九世纪四五十年代摄影刚出现时，曝光时间长是出了名的；在镀银铜板上成像的银版摄影法可能要几分钟，拍摄对象一旦挪动身体或调整四肢，影像就会模糊。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>早期曝光很久，人物移动会使影像模糊。\u003c/p>\n\u003c/blockquote>\n\u003cp>冒号后的daguerreotype是前面“曝光长”的具体解释；括号只补充工艺。resulting in给出结果，as在这里说明人物移动与模糊之间的原因关系，不再译成另一段年代背景。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>十九世纪四五十年代摄影刚起步时，曝光时间出了名地长：在镀银铜板上成像的银版摄影法可能需要几分钟，其间被摄者挪动身体或四肢就会导致影像模糊。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>notoriously突出广为人知的缺点，可译为“出了名地长”；could take保留可能需要的时间，不写成每次都恰好几分钟。\u003c/p>\n\u003cp>sitters是被拍摄的人，不必限定为始终坐着。把shifted position与adjusted their limbs并列成“挪动身子或四肢”，保留动作导致成像失败。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>在19世纪40年代和50年代，也就是摄影技术的早期，曝光时间出了名地长：银版照相法（在镀银的铜板上成像）可能需要几分钟才能完成，如果拍摄对象改变位置或调整肢体，就会导致图像模糊。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>A toothy grin (especially when there were gaps or blackened gnashers) lacked class: drunks, tramps, and music hall performers might gurn and grin with a smile as wide as Lewis Carroll&#39;s gum-exposing Cheshire Cat, but it was not a becoming look for properly bred persons.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>A toothy grin / (especially when there were / gaps or blackened gnashers) / lacked class: / drunks, tramps, / and music hall performers / might gurn and grin / with a smile / as wide as / Lewis Carroll&#39;s gum-exposing Cheshire Cat, / but it was not / a becoming look / for properly bred persons.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>露齿的咧嘴笑 / （尤其是当有 / 缺口或发黑的牙齿时）/ 缺乏品位：/ 醉汉、流浪汉，/ 和音乐厅表演者 / 可能扮鬼脸和咧嘴笑 / 带着微笑 / 宽得像 / 刘易斯·卡罗尔笔下露出牙龈的柴郡猫，/ 但这不是 / 一个得体的样子 / 对于有教养的人来说。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把外貌特征与社会评价连起来：\u003c/p>\n\u003cblockquote>\n\u003cp>露齿大笑，尤其露出缺牙或发黑的牙齿，被认为不够体面\u003c/p>\n\u003c/blockquote>\n\u003cp>再把可这样笑的人与不适合的人对照：\u003c/p>\n\u003cblockquote>\n\u003cp>醉汉、流浪汉或歌舞杂耍演员可以像柴郡猫一样咧嘴露牙，但这不是有教养的人应有的样子\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>露齿大笑，尤其露出缺牙或发黑的牙齿，被认为不够体面；醉汉、流浪汉或歌舞杂耍演员可以像柴郡猫一样咧嘴露牙，但这不是有教养的人应有的样子。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>露齿大笑被视为没格调，不适合有教养的人。\u003c/p>\n\u003c/blockquote>\n\u003cp>冒号把lacked class展开为不同社会身份的行为规范；but连接两类人的对照。as wide as修饰smile的幅度，properly bred修饰persons，不要把“教养”误接到猫的形象上。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>露齿大笑，尤其露出缺牙或发黑的牙齿，会被视为没格调：醉汉、流浪汉和歌舞杂耍演员可以像刘易斯·卡罗尔笔下露着牙床的柴郡猫一样做怪相、咧嘴笑，有教养的人却被认为不该如此。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>gurn and grin包含做怪相、咧嘴笑的意味，用它说明当时的体面观念，不要平直译成所有人共同的欢乐。\u003c/p>\n\u003cp>becoming在此是“合宜、得体”，不是become的变化义；译文应标明这是当时的社会评价，而不是替作者给今日人物下等级判断。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>露齿的咧嘴笑（尤其是有缺牙或黑牙时）显得缺乏品位：醉汉、流浪汉和音乐厅表演者可能会扮鬼脸，咧嘴笑得像刘易斯·卡罗尔笔下露出牙龈的柴郡猫那样宽，但这对有教养的人来说并不得体。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>35题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003cp>下面哪一个问题是本文主要回答的问题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>When did the Victorians start to view photography differently?\u003c/strong>\u003c/p>\n\u003cp>维多利亚时代的人何时开始以不同方式看待摄影？\u003c/p>\n\u003cp>B. \u003cstrong>What made photography develop slowly in the Victorian period?\u003c/strong>\u003c/p>\n\u003cp>是什么让摄影在维多利亚时代发展缓慢？\u003c/p>\n\u003cp>C. \u003cstrong>Why did most Victorians look stern in photographs?\u003c/strong>\u003c/p>\n\u003cp>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003cp>D. \u003cstrong>How did smiling in photographs become a post-Victorian norm?\u003c/strong>\u003c/p>\n\u003cp>照片中微笑怎样成为维多利亚时代之后的常态？\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。\u003c/td>\n\u003ctd>先摆出一种让人意外的现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明微笑照片只是少数，多数肖像僵硬严肃，提出为什么会这样。\u003c/td>\n\u003ctd>再说多数其实相反并问为什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>先用早期长曝光和难以保持固定笑容解释不笑的习惯。\u003c/td>\n\u003ctd>先说过去为何会这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。\u003c/td>\n\u003ctd>再说条件变了还得另找原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。\u003c/td>\n\u003ctd>再说另一种更具体的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。\u003c/td>\n\u003ctd>最后说这种看法连例外也影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003ch3>A. When did the Victorians start to view photography differently?\u003c/h3>\n\u003cp>维多利亚时代的人何时开始以不同方式看待摄影？\u003c/p>\n\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>维多利亚时代的人何时开始以不同方式看待摄影？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从一组出人意料的旧照片切入，提出维多利亚人何时开始改变对摄影的理解。\u003c/td>\n\u003ctd>先摆出一种让人意外的现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明起初多数人仍将摄影视作严肃肖像形式，由此提出态度转变的时间问题。\u003c/td>\n\u003ctd>再说多数其实相反并问为什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>回顾早期长曝光和正式拍摄场景，解释旧观念形成的背景。\u003c/td>\n\u003ctd>先说过去为何会这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>写便携相机出现后新使用方式逐渐成熟，寻找观念开始变化的具体时期。\u003c/td>\n\u003ctd>再说条件变了还得另找原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>进一步从家庭留影、休闲记录等用途辨认转变开始发生的迹象。\u003c/td>\n\u003ctd>再说另一种更具体的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明旧体面规范仍约束部分人，借知名人物的迟疑限定转变并非人人同步。\u003c/td>\n\u003ctd>最后说这种看法连例外也影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A要求全文回答when，关键应是维多利亚时代人对摄影的认识何时变化。文章确实出现年代，却用来检验“不笑是否因为曝光慢”：到九十年代仍然犹豫着不笑，说明要找别的原因。开头印象改变的是当代看Twitter的人，也不是维多利亚人自己。末两段解释牙齿和体面标准，没有给出摄影观念发生转变的时点。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003ch3>B. What made photography develop slowly in the Victorian period?\u003c/h3>\n\u003cp>是什么让摄影在维多利亚时代发展缓慢？\u003c/p>\n\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>是什么让摄影在维多利亚时代发展缓慢？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从少数先进摄影成果引起惊讶开篇，引出技术普及为何比预期缓慢。\u003c/td>\n\u003ctd>先摆出一种让人意外的现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>展示多数设备和作品仍停留在旧阶段的现实，明确发展迟缓这一待解释问题。\u003c/td>\n\u003ctd>再说多数其实相反并问为什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明早期材料、曝光和制版方面的技术障碍怎样拖慢改良。\u003c/td>\n\u003ctd>先说过去为何会这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>转到曝光缩短后的时期，指出原有障碍减弱而进步仍受其他因素限制。\u003c/td>\n\u003ctd>再说条件变了还得另找原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>分析费用、制造条件或市场规模怎样继续限制摄影技术发展。\u003c/td>\n\u003ctd>再说另一种更具体的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>说明保守观念对新器材的接受形成阻力，连可能支持创新的人也受影响。\u003c/td>\n\u003ctd>最后说这种看法连例外也影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B抓住了曝光技术，却把发展缓慢当作全文要解释的现象。第4段明确写曝光时间快了，自然微笑容易捕捉，作者随后寻找的是仍然不笑的原因。牙齿卫生差和有教养者不宜露牙，能解释被摄者选择什么表情，却不能说明相机技术为什么发展慢。它们并未被写成发明或推广摄影的障碍。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003ch3>C. Why did most Victorians look stern in photographs?\u003c/h3>\n\u003cp>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以少数微笑旧照片给今日观看者带来的意外感受，呈现与既有严肃印象的反差。\u003c/td>\n\u003ctd>先摆出一种让人意外的现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>承认微笑照片只占少数，转而提出为什么大部分肖像表情僵硬严肃。\u003c/td>\n\u003ctd>再说多数其实相反并问为什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>先从早期长曝光说明自然笑容难以保持，解释技术条件下的严肃姿态。\u003c/td>\n\u003ctd>先说过去为何会这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>指出技术变快后微笑容易捕捉，因而仍不笑必须有其他解释。\u003c/td>\n\u003ctd>再说条件变了还得另找原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>从牙齿状况与露齿失体面解释人们在技术改善后仍不愿微笑。\u003c/td>\n\u003ctd>再说另一种更具体的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>补充社会阶层对露齿笑的评价，并用爱笑者也遵守的例子显示观念影响。\u003c/td>\n\u003ctd>最后说这种看法连例外也影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C同时保留了most、Victorians和in photographs三个限定。开头证明他们日常可以笑，第2段却说照片里大多数严肃，这才有需要解释的反差。后面每一步都围绕原因推进：技术困难先能解释，后来技术改善，牙齿和社会体面观念继续解释。结尾Twain平日爱笑而不赞成照片傻笑，恰好再次说明文章讨论的是摄影肖像中的表情，并不是维多利亚人普遍没有快乐。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following questions does the text answer?\u003c/strong>\u003c/p>\n\u003ch3>D. How did smiling in photographs become a post-Victorian norm?\u003c/h3>\n\u003cp>照片中微笑怎样成为维多利亚时代之后的常态？\u003c/p>\n\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>照片中微笑怎样成为维多利亚时代之后的常态？\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从后世笑容灿烂的家庭照片令人惊讶写起，提出微笑后来为何成为常态。\u003c/td>\n\u003ctd>先摆出一种让人意外的现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回顾此前多数肖像严肃的相反惯例，明确需要解释的历史转变。\u003c/td>\n\u003ctd>再说多数其实相反并问为什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明长曝光曾迫使人物保持静止，为后来变化交代起点。\u003c/td>\n\u003ctd>先说过去为何会这样\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>写快速相机普及使自然微笑易于捕捉，同时提出技术之外还需哪些改变。\u003c/td>\n\u003ctd>再说条件变了还得另找原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>具体解释消费广告、私人相册或审美变化怎样赋予笑容新的正面意义。\u003c/td>\n\u003ctd>再说另一种更具体的原因\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>呈现旧规范对新常态的抵抗，说明连爱笑的人也曾受约束，从而凸显后来转变的幅度。\u003c/td>\n\u003ctd>最后说这种看法连例外也影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D所问的是post-Victorian norm，意味着文章要走到维多利亚时代之后，解释微笑如何普及。实际最后两段仍停在那个时代的牙齿、格调和Twain对照片傻笑的反对。第4段技术变快也没有带来文中所说的微笑常态，作者反而强调still hesitated。因此D需要的后续转变过程和结果都不是文章的落点。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>35题结论\u003c/h3>\n\u003cp>\u003cstrong>35. C. Why did most Victorians look stern in photographs?\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Why did most Victorians look stern in photographs? / 为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/strong>\u003c/p>\n\u003ch2>31题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Paragraph 1, the author’s posts on Twitter ______.\u003cbr>根据第1段，作者发布在Twitter上的内容产生了什么作用？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>信息结果题。题干要求判断“根据第1段，作者发布在Twitter上的内容产生了什么作用？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>As a historian who&#39;s always searching for the text or the image that makes us re-evaluate the past, I&#39;ve become preoccupied with looking for photographs that show our Victorian ancestors smiling (what better way to shatter the image of 19th-century prudery?). I&#39;ve found quite a few, and—since I started posting them on Twitter—they have been causing quite a stir. People have been surprised to see evidence that Victorians had fun and could, and did, laugh. They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者发出微笑的维多利亚时代肖像，人们从这些人脸上看见与自己一样的笑声；原本被当作严肃古人的对象因此显得有人情味。\u003c/p>\n\u003ch3>A. illustrated the development of Victorian photography\u003c/h3>\n\u003cblockquote>\n\u003cp>说明了维多利亚时代摄影的发展\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 development of Victorian photography 要找摄影怎样发展，所以回看第1段 photographs that show our Victorian ancestors smiling，确认帖子里的照片具体展示什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 photographs that show our Victorian ancestors smiling 说明照片展示的是人物微笑；后面的人们也针对他们会享乐和大笑而惊讶。A的 development of Victorian photography 把展示对象改成摄影技术的发展，应该涉及方法、设备或拍摄效果的变化。这段没有按发展阶段排列照片，而是用微笑这一共同内容使过去的人更亲近。照片是工具，不等于帖子在介绍工具自身的演进。\u003c/p>\n\u003cp>原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\u003c/p>\n\u003cp>They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者在Twitter发布的内容说明了维多利亚时代摄影的发展。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 development of Victorian photography 要找摄影怎样发展，所以回看第1段 photographs that show our Victorian ancestors smiling，确认帖子里的照片具体展示什么。\u003c/p>\n\u003cp>原文的 photographs that show our Victorian ancestors smiling 说明照片展示的是人物微笑；后面的人们也针对他们会享乐和大笑而惊讶。A的 development of Victorian photography 把展示对象改成摄影技术的发展，应该涉及方法、设备或拍摄效果的变化。这段没有按发展阶段排列照片，而是用微笑这一共同内容使过去的人更亲近。照片是工具，不等于帖子在介绍工具自身的演进。\u003c/p>\n\u003cp>原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\u003c/p>\n\u003cp>They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003cp>作者发出微笑的维多利亚时代肖像，人们从这些人脸上看见与自己一样的笑声；原本被当作严肃古人的对象因此显得有人情味。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Twitter posts traced successive stages in the development of Victorian photography.\u003c/p>\n\u003cp>这些帖子追踪了维多利亚时代摄影发展的连续阶段。\u003c/p>\n\u003c/blockquote>\n\u003cp>技术发展路线需要按时间比较设备或拍摄方法。首段展示微笑脸孔以及当代读者的惊讶，时间变化要到后面的曝光讨论才出现，不能倒置到发帖结果上。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨在解释严肃肖像，因此开头的微笑照片应与这种印象形成反差；但帖子实际改变了谁的认识、是否涉及研究媒介的作用，仍须由首段说明。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>illustrated the development of Victorian photography\u003cbr>说明了维多利亚时代摄影的发展\u003c/p>\n\u003c/blockquote>\n\u003cp>原句围绕人的表情和观看者的印象展开，A却把照片里的人的变化感受改成摄影技术的发展。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。\u003c/p>\n\u003cp>本项最终仍要根据“become more human”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. changed people’s impression of the Victorians\u003c/h3>\n\u003cblockquote>\n\u003cp>改变了人们对维多利亚时代人的印象\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的 people’s impression 对应第1段 People have been surprised 和 become more human，都是观看者怎样看那些人的变化，所以回看第1段最后两句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文用 People have been surprised 写观看者的惊讶，又写那些维多利亚时代的人似乎突然 become more human。B的 people’s impression 概括的就是这种观看印象：原本隔着一百多年显得遥远的人，因为同样会笑而更亲近。changed没有说他们的真实生活被帖子改变，而是说看帖者对他们的认识变了，人物和变化落点都能对上。\u003c/p>\n\u003cp>这些都是当代观看者对维多利亚时代人的新感受，B把两句共同说明的影响概括了出来。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\u003c/p>\n\u003cp>They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者在Twitter发布的内容改变了人们对维多利亚时代人的印象。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 people’s impression 对应第1段 People have been surprised 和 become more human，都是观看者怎样看那些人的变化，所以回看第1段最后两句。\u003c/p>\n\u003cp>原文用 People have been surprised 写观看者的惊讶，又写那些维多利亚时代的人似乎突然 become more human。B的 people’s impression 概括的就是这种观看印象：原本隔着一百多年显得遥远的人，因为同样会笑而更亲近。changed没有说他们的真实生活被帖子改变，而是说看帖者对他们的认识变了，人物和变化落点都能对上。\u003c/p>\n\u003cp>这些都是当代观看者对维多利亚时代人的新感受，B把两句共同说明的影响概括了出来。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\u003c/p>\n\u003cp>They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003cp>作者发出微笑的维多利亚时代肖像，人们从这些人脸上看见与自己一样的笑声；原本被当作严肃古人的对象因此显得有人情味。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以发到Twitter的 3cp>从全文推进看，这一处的作用是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。\u003c/p>\n\u003cp>本项最终仍要根据“become more human”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. re-evaluated the Victorians’ notion of public image\u003c/h3>\n\u003cblockquote>\n\u003cp>重新评价了维多利亚时代人对公众形象的观念\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 the Victorians’ notion of public image 说过去那些人的观念，所以回看第1段 People have been surprised，确认改变的是当时被摄者的观念，还是现在观看照片者的感受。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 People have been surprised 接在Twitter发帖之后，说的是当代读者看到旧照片的反应；他们觉得旧时代的人变得更有人性。D的 the Victorians’ notion of public image 却把讨论对象放在维多利亚时代的人对自己公众形象的观念上。照片改变“我们怎样看他们”，不等于重新评价“他们怎样看自己的公众形象”。两个方向都提到Victorians，但拥有观念的人不同。\u003c/p>\n\u003cp>第1段明确展示的是看帖者的惊讶和亲近感，D把观看者的印象换成被观看者自己的观念。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\u003c/p>\n\u003cp>They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者在Twitter发布的内容重新评价了维多利亚时代人对公众形象的观念。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 the Victorians’ notion of public image 说过去那些人的观念，所以回看第1段 People have been surprised，确认改变的是当时被摄者的观念，还是现在观看照片者的感受。\u003c/p>\n\u003cp>原文的 People have been surprised 接在Twitter发帖之后，说的是当代读者看到旧照片的反应；他们觉得旧时代的人变得更有人性。D的 the Victorians’ notion of public image 却把讨论对象放在维多利亚时代的人对自己公众形象的观念上。照片改变“我们怎样看他们”，不等于重新评价“他们怎样看自己的公众形象”。两个方向都提到Victorians，但拥有观念的人不同。\u003c/p>\n\u003cp>第1段明确展示的是看帖者的惊讶和亲近感，D把观看者的印象换成被观看者自己的观念。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>People have been surprised to see evidence that Victorians had fun and could, and did, laugh.\u003c/p>\n\u003cp>They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.\u003c/p>\n\u003cp>作者发出微笑的维多利亚时代肖像，人们从这些人脸上看见与自己一样的笑声；原本被当作严肃古人的对象因此显得有人情味。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The posts reassessed what Victorians themselves believed about their public image.\u003c/p>\n\u003cp>这些帖子重新评价了维多利亚人自己如何看待公众形象。\u003c/p>\n\u003c/blockquote>\n\u003cp>本段的观察者是今天看照片的人，被改变的是他们对古人的印象。维多利亚人当年的体面观念在后文出现，不能把两群人的观念相互替换。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨在解释严肃肖像，因此开头的微笑照片应与这种印象形成反差；但帖子实际改变了谁的认识、是否涉及研究媒介的作用，仍须由首段说明。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>re-evaluated the Victorians’ notion of public image\u003cbr>重新评价了维多利亚时代人对公众形象的观念\u003c/p>\n\u003c/blockquote>\n\u003cp>第1段明确展示的是看帖者的惊讶和亲近感，D把观看者的印象换成被观看者自己的观念。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以发到Twitter的微笑旧照片引起惊讶切入，显示它们改变当代人的印象。\u003c/p>\n\u003cp>本项最终仍要根据“become more human”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>31题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>31. B. changed people’s impression of the Victorians\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：首段写观看者反应，没有按阶段展示摄影技术的发展。\u003c/p>\n\u003cp>B：微笑照片让古人更有人情味，改变的是今天观看者的印象。\u003c/p>\n\u003cp>C：Twitter是传播途径，首段没有评估社交媒体对学科研究的总体作用。\u003c/p>\n\u003cp>D：帖子改变当代人的印象，不是重新评价古人自己的公众形象观。\u003c/p>\n\u003ch2>32题\u003c/h2>\n\u003cblockquote>\n\u003cp>What does the author say about the Victorian portraits he has collected?\u003cbr>作者怎样描述他所收集的维多利亚时代肖像照片？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>收藏特征题。题干要求判断“作者怎样描述他所收集的维多利亚时代肖像照片？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance. How do we explain this trend?\u003c/p>\n\u003c/blockquote>\n\u003cp>my collection指微笑照片；作者承认它们只占1840至1900年海量肖像的极小比例，多数照片反而是僵硬、严肃的姿态。\u003c/p>\n\u003ch3>A. They are in popular use among historians.\u003c/h3>\n\u003cblockquote>\n\u003cp>它们在历史学家中被广泛使用。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 in popular use among historians 说很多历史学家在使用，第2段 my collection 则说作者持有的资料，两处都涉及谁在接触这些照片，所以回看my collection所在的完整句子，确认所说的是个人还是同行。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>A的 in popular use among historians 却把一位历史学家收集照片改成历史学家这个群体普遍使用它们。作者本人是历史学家，只能连接个人职业与个人收藏，不能把my换成很多历史学家的共同使用情况。这里的数量比较也在比较照片类型的多少，并不是比较使用者人数。\u003c/p>\n\u003cp>my限定了收藏的主人，A把这一位的行为扩成整个研究群体的普遍做法，原句的比例也不是使用率。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance. How do we explain this trend?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者所收集的维多利亚时代肖像它们在历史学家中被广泛使用。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 in popular use among historians 说很多历史学家在使用，第2段 my collection 则说作者持有的资料，两处都涉及谁在接触这些照片，所以回看my collection所在的完整句子，确认所说的是个人还是同行。\u003c/p>\n\u003cp>A的 in popular use among historians 却把一位历史学家收集照片改成历史学家这个群体普遍使用它们。作者本人是历史学家，只能连接个人职业与个人收藏，不能把my换成很多历史学家的共同使用情况。这里的数量比较也在比较照片类型的多少，并不是比较使用者人数。\u003c/p>\n\u003cp>my限定了收藏的主人，A把这一位的行为扩成整个研究群体的普遍做法，原句的比例也不是使用率。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance. How do we explain this trend?\u003c/p>\n\u003cp>my collection指微笑照片；作者承认它们只占1840至1900年海量肖像的极小比例，多数照片反而是僵硬、严肃的姿态。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明微笑照片只是少数，多数肖像僵硬严肃，提出为什么会这样。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>These portraits have become widely used research materials among historians.\u003c/p>\n\u003cp>这些肖像已成为历史学家普遍使用的研究材料。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文只有作者作为研究者收藏并分享，没有其他历史学家的采用情况。个人使用不能推出in popular use所需的广泛程度。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认多数肖像严肃，不能单独证明作者所藏照片的使用范围和代表性；本题须看作者如何界定这批微笑照片与总体的关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>They are in popular use among historians.\u003cbr>它们在历史学家中被广泛使用。\u003c/p>\n\u003c/blockquote>\n\u003cp>my限定了收藏的主人，A把这一位的行为扩成整个研究群体的普遍做法，原句的比例也不是使用率。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明微笑照片只是少数，多数肖像僵硬严肃，提出为什么会这样。\u003c/p>\n\u003cp>本项最终仍要根据“only a tiny percentage”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3 03cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者所收集的维多利亚时代肖像它们在那个时代的照片中很罕见。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 rare among photographs 对应第2段 only a tiny percentage，都是拿这批照片和当时总体比较，所以回看收藏所占比例以及后面大多数肖像的表情。\u003c/p>\n\u003cp>原文说这批微笑收藏 only a tiny percentage，接着说大多数肖像中的人神情愁苦、姿势僵硬。rare不等于一张都没有，也不等于没人收藏，而是承认作者确实找到了一些，同时指出它们与大多数照片不同。这个说法既保留少数，也保留同时代的比较范围。\u003c/p>\n\u003cp>only a tiny percentage直接给出了相对数量，C的rare正好接上这种少数情况。\u003c/p>\n\u003cp>my collection指微笑照片；作者承认它们只占1840至1900年海量肖像的极小比例，多数照片反而是僵硬、严肃的姿态。\u003c/p>\n\u003cp>only a tiny percentage直接限定收藏占比，rare保留数量少的含义。它不表示维多利亚时代没有微笑照片，而是承认作者展示的并非多数。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Of course, I need to concede that my collection of &#39;Smiling Victorians&#39; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance.\u003c/p>\n\u003cp>my collection指微笑照片；作者承认它们只占1840至1900年海量肖像的极小比例，多数照片反而是僵硬、严肃的姿态。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明微笑照片只是少数，多数肖像僵硬严肃，提出为什么会这样。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The smiling portraits are uncommon within the photographic record of the period.\u003c/p>\n\u003cp>这些微笑肖像在当时留下的照片中并不常见。\u003c/p>\n\u003c/blockquote>\n\u003cp>only a tiny percentage直接限定收藏占比，rare保留数量少的含义。它不表示维多利亚时代没有微 3c/p>\n\u003cp>本项最终仍要根据“only a tiny percentage”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>32题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>32. C. They are rare among photographs of that age.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：作者个人收藏与分享，不能推出历史学家普遍使用这些照片。\u003c/p>\n\u003cp>B：曝光是后文解释变量，不是本段对微笑收藏的数量描述。\u003c/p>\n\u003cp>C：极小比例准确对应这些照片在当时影像中很少见。\u003c/p>\n\u003cp>D：特别挑选的微笑例外不能代表多数严肃肖像背后的主流习俗。\u003c/p>\n\u003ch2>33题\u003c/h2>\n\u003cblockquote>\n\u003cp>What might have kept the Victorians from smiling for pictures in the 1890s?\u003cbr>十九世纪九十年代，什么可能仍让维多利亚时代的人不愿在照片中微笑？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>限定年代原因题。题干要求判断“十九世纪九十年代，什么可能仍让维多利亚时代的人不愿在照片中微笑？”，先按第4、5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today&#39;s digital standards, the exposure was almost instantaneous. Spontaneous smiles were relatively easy to capture by the 1890s, so we must look elsewhere for an explanation of why Victorians still hesitated to smile.\u003c/p>\n\u003cp>One explanation might be the loss of dignity displayed through a cheesy grin. &quot;Nature gave us lips to conceal our teeth,&quot; ran one popular Victorian saying, alluding to the fact that before the birth of proper dentistry, mouths were often in a shocking state of hygiene. A flashing set of healthy and clean, regular &#39;pearly whites&#39; was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not guaranteed).\u003c/p>\n\u003c/blockquote>\n\u003cp>第4段明确当时相机已能迅速捕捉自然微笑，因此单靠早期长曝光解释不了；第5段转向露齿失体面，并说明当时牙齿卫生很差。\u003c/p>\n\u003ch3>A. Their unhealthy dental condition.\u003c/h3>\n\u003cblockquote>\n\u003cp>他们不健康的牙齿状况。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/st
