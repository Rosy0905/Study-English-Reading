u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 introduction of the Box Brownie 用来说明曝光更快，自然微笑可以更容易被记录；随后作者去找别的解释，第5段谈牙齿和体面。D的 distrust of new inventions 却把新设备当成使人不笑的心理原因。原句给新相机的作用是解除拍摄微笑的技术障碍，D则把它改成引起不信任、阻止微笑的对象。文中没有把hesitated的对象写成新发明，而是hesitated to smile。\u003c/p>\n\u003cp>原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不愿微笑的心理障碍。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today&#39;s digital standards, the exposure was almost instantaneous.\u003c/p>\n\u003cp>One explanation might be the loss of dignity displayed through a cheesy grin.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>十九世纪九十年代，维多利亚时代的人拍照不笑，可能是因为他们对新发明的不信任。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 distrust of new inventions 会让我们回看第4段 introduction of the Box Brownie，那里确实介绍新相机，因此要看作者写新设备带来的究竟是拍摄便利还是人的怀疑。\u003c/p>\n\u003cp>原文的 introduction of the Box Brownie 用来说明曝光更快，自然微笑可以更容易被记录；随后作者去找别的解释，第5段谈牙齿和体面。D的 distrust of new inventions 却把新设备当成使人不笑的心理原因。原句给新相机的作用是解除拍摄微笑的技术障碍，D则把它改成引起不信任、阻止微笑的对象。文中没有把hesitated的对象写成新发明，而是hesitated to smile。\u003c/p>\n\u003cp>原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不愿微笑的心理障碍。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4、5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today&#39;s digital standards, the exposure was almost instantaneous.\u003c/p>\n\u003cp>One explanation might be the loss of dignity displayed through a cheesy grin.\u003c/p>\n\u003cp>第4段明确当时相机已能迅速捕捉自然微笑，因此单靠早期长曝光解释不了；第5段转向露齿失体面，并说明当时牙齿卫生很差。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Victorians refused to smile because they distrusted newly invented technology.\u003c/p>\n\u003cp>维多利亚人因不信任新发明而拒绝微笑。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文承认技术进步让自然表情更易捕捉，没有说人们怀疑相机可靠性或抵制发明。不能从新技术出现与旧习惯持续的先后关系补出不信任。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认文章寻找严肃表情的原因，不能直接确定1890年代仍成立的是哪种原因；必须把当时的技术条件与后续解释连起来。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Their distrust of new inventions.\u003cbr>他们对新发明的不信任。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文介绍设备是为了说明技术已方便拍笑容，D把这种便利的技术背景换成了不愿微笑的心理障碍。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出技术变快后自然微笑已易捕捉，但仍然少笑，因此需要另找解释。提出露牙带来的体面损失，具体说明当时口腔卫生糟糕、好牙罕见。\u003c/p>\n\u003cp>本项最终仍要根据“mouths were often in a shocking state of hygiene”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>33题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>33. A. Their unhealthy dental condition.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：技术改善后坏牙仍可能让露齿失体面，符合年代和原因限定。\u003c/p>\n\u003cp>B：体面规范没有被原文写成天生的社交敏感性。\u003c/p>\n\u003cp>C：长曝光下难保持表情不等于面对相机心理紧张。\u003c/p>\n\u003cp>D：新技术出现没有被写成人们不信任新发明的原因。\u003c/p>\n\u003ch2>34题\u003c/h2>\n\u003cblockquote>\n\u003cp>Mark Twain is quoted to show that the disapproval of smiles in pictures was ______.\u003cbr>引用Mark Twain的话，是为了说明反对照片中微笑是一种怎样的看法？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>引语作用题。题干要求判断“引用Mark Twain的话，是为了说明反对照片中微笑是一种怎样的看法？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>A toothy grin (especially when there were gaps or blackened teeth) lacked class: drunks, tramps and music hall performers might gurn and grin with a smile as wide as Lewis Carroll&#39;s gum-exposing Cheshire Cat, but it was not a becoming look for properly bred persons. Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段先解释露齿大笑被视为缺乏格调，再以even Mark Twain强调：连以喜爱笑著称的人也不愿留下被后代看作傻笑的永久照片。\u003c/p>\n\u003ch3>A. a thought-provoking idea\u003c/h3>\n\u003cblockquote>\n\u003cp>一种发人深省的想法\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 thought-provoking idea 要看引语是否提出一种让人重新思考的新想法，所以回看第6段 Even Mark Twain 怎样接在 not a becoming look 后面。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的 Even Mark Twain 表示连这个喜欢大笑的人也持类似看法，前面还先给出不适合有教养者的社会评价。A的 thought-provoking idea 却把引用功能变成提出一个值得重新思索的观点。Twain的反差在于他日常爱笑，却仍然不赞成照片里的傻笑，并不是他的说法引起了思想转折。\u003c/p>\n\u003cp>Twain在这里继续证实前面已经写出的社会评价，A把强化既有看法的例子改成引发新思考的观点。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用马克·吐温，是为了说明拍照不宜微笑的观念一种发人深省的想法。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 thought-provoking idea 要看引语是否提出一种让人重新思考的新想法，所以回看第6段 Even Mark Twain 怎样接在 not a becoming look 后面。\u003c/p>\n\u003cp>原文的 Even Mark Twain 表示连这个喜欢大笑的人也持类似看法，前面还先给出不适合有教养者的社会评价。A的 thought-provoking idea 却把引用功能变成提出一个值得重新思索的观点。Twain的反差在于他日常爱笑，却仍然不赞成照片里的傻笑，并不是他的说法引起了思想转折。\u003c/p>\n\u003cp>Twain在这里继续证实前面已经写出的社会评价，A把强化既有看法的例子改成引发新思考的观点。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003cp>本段先解释露齿大笑被视为缺乏格调，再以even Mark Twain强调：连以喜爱笑著称的人也不愿留下被后代看作傻笑的永久照片。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Twain is quoted primarily to make readers reconsider a stimulating philosophical idea.\u003c/p>\n\u003cp>引用吐温，主要为了让读者重新思考一种有启发性的哲学观念。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要把引语作为待讨论的思想展开。实际even点出出人意料的认同者，用他的反差证明不宜笑的规范有多强，而不是评价引语能否激发思考。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨要求解释不笑的习惯，吐温应为某种原因提供支持；但引语是在说明观念影响深、评价其错误还是展示争议，仍取决于引语前的人物限定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a thought-provoking idea\u003cbr>一种发人深省的想法\u003c/p>\n\u003c/blockquote>\n\u003cp>Twain在这里继续证实前面已经写出的社会评价，A把强化既有看法的例子改成引发新思考的观点。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。\u003c/p>\n\u003cp>本项最终仍要根据“Even Mark Twain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. a deep-rooted belief\u003c/h3>\n\u003cblockquote>\n\u003cp>一种根深蒂固的观念\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的 deep-rooted belief 对应第6段 Even Mark Twain 后面对一个爱笑之人的描述，因为连这样的人也反对照片里的傻笑，能显示这种观念的影响，所以回看Even所在的完整句子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文的 Even Mark Twain 先说明“连他也这样”，又特别强调他enjoyed a hearty laugh，使读者看到平时爱笑与拍肖像不赞成笑可以同时存在。B的 deep-rooted belief 恰好接上这种观念并不会因为个人爱笑就轻易松动的情况。前面已经有“有教养的人不宜这样”的社会标准，Twain的例子继续说明这个标准对一个爱笑的人也有约束，并不只是某一个严肃人物的个人偏好。\u003c/p>\n\u003cp>Twain本来似乎更可能赞成笑，却仍在肖像问题上接受同样的禁忌，使根深蒂固这一描述有了具体支持。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用马克·吐温，是为了说明拍照不宜微笑的观念一种根深蒂固的观念。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 deep-rooted belief 对应第6段 Even Mark Twain 后面对一个爱笑之人的描述，因为连这样的人也反对照片里的傻笑，能显示这种观念的影响，所以回看Even所在的完整句子。\u003c/p>\n\u003cp>原文的 Even Mark Twain 先说明“连他也这样”，又特别强调他enjoyed a hearty laugh，使读者看到平时爱笑与拍肖像不赞成笑可以同时存在。B的 deep-rooted belief 恰好接上这种观念并不会因为个人爱笑就轻易松动的情况。前面已经有“有教养的人不宜这样”的社会标准，Twain的例子继续说明这个标准对一个爱笑的人也有约束，并不只是某一个严肃人物的个人偏好。\u003c/p>\n\u003cp>Twain本来似乎更可能赞成笑，却仍在肖像问题上接受同样的禁忌，使根深蒂固这一描述有了具体支持。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003cp>本段先解释露齿大笑被视为缺乏格调，再以even Mark Twain强调：连以喜爱笑著称的人也不愿留下被后代看作傻笑的永久照片。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Even a man who loved laughter accepted the powerful convention against smiling in portraits.\u003c/p>\n\u003cp>即使喜爱笑的人，也接受了肖像中不宜笑的强大规范。\u003c/p>\n\u003c/blockquote>\n\u003cp>even与known love of laughter构成让步反差：最可能不遵守的人也受影响，说明观念根深蒂固。这个推断依赖人物特征与态度的关系，不只是看到一句反对微笑的话。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨要求解释不笑的习惯，吐温应为某种原因提供支持；但引语是在说明观念影响深、评价其错误还是展示争议，仍取决于引语前的人物限定。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a deep-rooted belief\u003cbr>一种根深蒂固的观念\u003c/p>\n\u003c/blockquote>\n\u003cp>Twain本来似乎更可能赞成笑，却仍在肖像问题上接受同样的禁忌，使根深蒂固这一描述有了具体支持。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。\u003c/p>\n\u003cp>本项最终仍要根据“Even Mark Twain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. a misguided attitude\u003c/h3>\n\u003cblockquote>\n\u003cp>一种错误的态度\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“a [xxx] attitude”，保留了相应遮挡。当时的定位线索是：C的 attitude 指反对微笑的态度，对应第6段 not a becoming look 和 silly, foolish smile，两处都在评价照片里的笑容，所以回看这一社会评价怎样接到Twain的引语。读完全文后，做题模式再经交叉验证排除C，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>misguided是“错误的、受误导的”，C判断反对拍照微笑这种态度本身不正确。原文引用吐温并没有随后反驳他，而是用Even突出一个爱笑的人在正式肖像中也不愿笑。\u003c/p>\n\u003cp>爱笑是人物本来可能成为例外的条件，仍遵守规范才显示规范深植人心。引语证明的是观念的影响强度，而不是作者对观念真假的裁决；把今天对微笑的喜好带进去，不能替代例证在本段的功能。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用马克·吐温，是为了说明拍照不宜微笑的观念一种错误的态度。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 attitude 指反对微笑的态度，对应第6段 not a becoming look 和 silly, foolish smile，两处都在评价照片里的笑容，所以回看这一社会评价怎样接到Twain的引语。\u003c/p>\n\u003cp>misguided是“错误的、受误导的”，C判断反对拍照微笑这种态度本身不正确。原文引用吐温并没有随后反驳他，而是用Even突出一个爱笑的人在正式肖像中也不愿笑。\u003c/p>\n\u003cp>爱笑是人物本来可能成为例外的条件，仍遵守规范才显示规范深植人心。引语证明的是观念的影响强度，而不是作者对观念真假的裁决；把今天对微笑的喜好带进去，不能替代例证在本段的功能。\u003c/p>\n\u003cp>本段先解释露齿大笑被视为缺乏格调，再以even Mark Twain强调：连以喜爱笑著称的人也不愿留下被后代看作傻笑的永久照片。\u003c/p>\n\u003cp>若在纠错，作者应指出吐温论断哪里失真，再给出反驳。原文把他列作也遵守规范的人，用来解释习俗影响，并没有以今日审美给当时观念判错。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003cp>本段先解释露齿大笑被视为缺乏格调，再以even Mark Twain强调：连以喜爱笑著称的人也不愿留下被后代看作傻笑的永久照片。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Twain’s words are cited to prove that the Victorians’ attitude to smiles was mistaken.\u003c/p>\n\u003cp>引用吐温的话，是为了证明维多利亚人对微笑的态度错误。\u003c/p>\n\u003c/blockquote>\n\u003cp>若在纠错，作者应指出吐温论断哪里失真，再给出反驳。原文把他列作也遵守规范的人，用来解释习俗影响，并没有以今日审美给当时观念判错。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨要求解释不笑的习惯，吐温应为某种原因提供支持；但引语是在说明观念影响深、评价其错误还是展示争议，仍取决于引语前的人物限定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a misguided attitude\u003cbr>一种错误的态度\u003c/p>\n\u003c/blockquote>\n\u003cp>爱笑是人物本来可能成为例外的条件，仍遵守规范才显示规范深植人心。引语证明的是观念的影响强度，而不是作者对观念真假的裁决；把今天对微笑的喜好带进去，不能替代例证在本段的功能。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。\u003c/p>\n\u003cp>本项最终仍要根据“Even Mark Twain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. a controversial view\u003c/h3>\n\u003cblockquote>\n\u003cp>一种有争议的看法\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 controversial view 要求有彼此冲突的意见，我们回看第6段 Even Mark Twain，确认他是在反对前面的有教养者标准，还是也接受同一评价。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 Even Mark Twain 让Twain加入前面那种反对照片傻笑的看法。虽然他平时喜欢开怀大笑，但句子明说when it came to photographic portraits，他照样给出负面评价。D的 controversial view 却需要他在照片该不该微笑的问题上与前面的看法发生争论。日常爱笑与拍肖像反对傻笑是两种场合，不能把场合不同当成同一个问题上的意见对立。\u003c/p>\n\u003cp>Twain对肖像的评价与前文一致，差别在日常生活和正式照片的场合，D把场合反差误写成观点争议。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用马克·吐温，是为了说明拍照不宜微笑的观念一种有争议的看法。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 controversial view 要求有彼此冲突的意见，我们回看第6段 Even Mark Twain，确认他是在反对前面的有教养者标准，还是也接受同一评价。\u003c/p>\n\u003cp>原文的 Even Mark Twain 让Twain加入前面那种反对照片傻笑的看法。虽然他平时喜欢开怀大笑，但句子明说when it came to photographic portraits，他照样给出负面评价。D的 controversial view 却需要他在照片该不该微笑的问题上与前面的看法发生争论。日常爱笑与拍肖像反对傻笑是两种场合，不能把场合不同当成同一个问题上的意见对立。\u003c/p>\n\u003cp>Twain对肖像的评价与前文一致，差别在日常生活和正式照片的场合，D把场合反差误写成观点争议。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be &quot;nothing more damning than a silly, foolish smile fixed forever&quot;.\u003c/p>\n\u003cp>本段先解释露齿大笑被视为缺乏格调，再以even Mark Twain强调：连以喜爱笑著称的人也不愿留下被后代看作傻笑的永久照片。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Twain’s statement is used to show that Victorians were divided over smiling in photographs.\u003c/p>\n\u003cp>吐温的说法被用来说明当时人对拍照微笑存在分歧。\u003c/p>\n\u003c/blockquote>\n\u003cp>争议需要同时呈现支持与反对的阵营。这里even把看似可能例外的人也纳入同一观念，作用是扩大共识强度，而不是建立对立。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Why did most Victorians look stern in photographs?\u003cbr>为什么大多数维多利亚时代的人在照片中显得严肃？\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨要求解释不笑的习惯，吐温应为某种原因提供支持；但引语是在说明观念影响深、评价其错误还是展示争议，仍取决于引语前的人物限定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a controversial view\u003cbr>一种有争议的看法\u003c/p>\n\u003c/blockquote>\n\u003cp>Twain对肖像的评价与前文一致，差别在日常生活和正式照片的场合，D把场合反差误写成观点争议。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：补充露牙笑缺乏格调的社会评价，并用连爱笑的Twain也反对傻笑强调观念影响。\u003c/p>\n\u003cp>本项最终仍要根据“Even Mark Twain”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>34题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>34. B. a deep-rooted belief\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：引语用于证明规范的影响，作者没有以启发思考作为例证结论。\u003c/p>\n\u003cp>B：连爱笑的吐温也遵守禁忌，显示这种观念根深蒂固。\u003c/p>\n\u003cp>C：解释观念影响不等于作者借引语判定观念错误。\u003c/p>\n\u003cp>D：连可能的例外也遵从是在加强共识，不是在呈现两派争论。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：研究发现与公众反应\u003c/strong>（段落1核心发现） 作者的研究：寻找维多利亚时代微笑照片（打破19世纪拘谨形象）→ 推特发布引起轰动 → 公众反应：【惊讶发现维多利亚人也会笑 → 通过笑的共同体验，维多利亚人变得更有人性】\u003c/p>\n\u003cp>↓（承认局限性）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：微笑照片的稀少性\u003c/strong>（段落2现象描述） 事实承认：微笑照片只占极小比例（1840-1900年间）→ 大多数照片特征：【悲惨僵硬的姿势 + 茫然的凝视】→ 提出问题：如何解释这种趋势？\u003c/p>\n\u003cp>↓（技术原因分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：早期技术限制\u003c/strong>（段落3-4技术发展） 早期（1840s-1850s）：【银版照相法曝光需几分钟 → 保持微笑太困难 → 茫然凝视成为常态】// 后期（1880s-1890s）：【曝光时间大大缩短 + 便携相机出现 → 捕捉微笑变得容易】→ 新问题：为什么1890s维多利亚人仍不愿微笑？\u003c/p>\n\u003cp>↓（社会文化原因）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：社会观念与牙齿健康\u003c/strong>（段落5-6深层原因） 尊严观念：咧嘴笑被视为失去尊严 → 牙齿问题：【维多利亚格言：&quot;嘴唇是用来遮掩牙齿的&quot; → 牙科不发达导致口腔卫生差 → 好牙齿是富人专属且不能保证】→ 阶级观念：【露齿笑缺乏品位（醉汉、流浪汉、表演者的标志）// 不适合有教养的人】→ 权威支持：马克·吐温也反对照片中的傻笑\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：维多利亚时代照片中人们很少微笑，不仅因为早期技术限制，更重要的是社会文化因素——微笑（尤其是露齿笑）被视为失去尊严、缺乏品位的表现，这与当时糟糕的牙齿健康状况和严格的阶级观念密切相关。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. A Faster Camera Does Not Explain Every Face\u003c/p>\n\u003cp>B. The Social Meaning of Showing One’s Teeth\u003c/p>\n\u003cp>C. A Society without Laughter\u003c/p>\n\u003cp>D. A Portrait Is a Chosen Public Image\u003c/p>\n\u003cp>E. The Practical Difficulty of Holding a Smile\u003c/p>\n\u003cp>F. An Exception Can Challenge an Impression\u003c/p>\n\u003cp>G. Technology Automatically Changes Habits\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A smiling Victorian portrait can surprise a modern viewer accustomed to solemn faces in history books. The surprise is useful: it interrupts the assumption that distant ancestors lacked familiar emotions. Yet a collection of such portraits may remain a small fraction of the surviving record. Its power to change an impression does not make it statistically typical. The right response is neither to dismiss the smiles nor to treat them as the dominant convention. They show that laughter existed, while leaving open the question of why formal portraits so often concealed it.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>In early photography, a sitter could be required to remain still while the image was recorded. A brief laugh was easy in ordinary conversation but difficult to hold unchanged for a prolonged exposure. Moving the head or adjusting the body could blur the result. Under those conditions, a neutral expression offered a practical advantage: there was less effort to sustain and less movement to spoil the picture. This explanation concerns the demands of the process. It does not require the person being photographed to be unhappy or incapable of amusement.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>Once shorter exposures made spontaneous expressions easier to capture, the old technical explanation became incomplete. If speed alone determined the face in a photograph, smiles should have followed every improvement in the camera. Their continued absence from many formal portraits points to something else. People were choosing not merely how to remain still but how to appear. The change in equipment therefore helps the historian by removing one obstacle from the explanation. It directs attention towards the expectations that survived after the camera could record a smile.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>Showing teeth was not simply a matter of moving the mouth. Poor dental health could make an open smile embarrassing, while ideas of respectable behaviour added another restraint. A wide grin might be associated with performers or people thought to lack refinement. Someone preparing a formal portrait could therefore avoid it even if the camera was fast enough. Physical appearance and social judgement worked together: the teeth themselves might be unattractive, and displaying them might also suggest the wrong kind of person. The image was being read as a statement about status.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>Even a person who enjoyed laughter might refuse to preserve a grin in a formal photograph. Mark Twain’s objection to a foolish smile fixed for the future illustrates that distinction. The relevant audience was not only the photographer in the room but also unknown viewers who would see the portrait later. Choosing a serious expression could be an attempt to control their judgement. A photograph consequently records a decision about presentation as well as a face. It should not be treated as a transparent measure of the sitter’s everyday capacity for joy.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】F. An Exception Can Challenge an Impression\u003c/p>\n\u003cblockquote>\n\u003cp>例外也能挑战既有印象\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分区分微笑照片改变印象的作用和它们在总体中的比例，保留对多数严肃肖像的疑问。\u003c/p>\n\u003cp>先看少数微笑照片对今天观看者的作用：\u003c/p>\n\u003cblockquote>\n\u003cp>interrupts the assumption that distant ancestors lacked familiar emotions\u003c/p>\n\u003c/blockquote>\n\u003cp>它们打断“遥远古人没有熟悉情感”的假设，使历史人物与当代经验相连。作用是改变印象，而不是证明数量很多。\u003c/p>\n\u003cp>随后Yet加入哪项限制：\u003c/p>\n\u003cblockquote>\n\u003cp>a small fraction of the surviving record\u003c/p>\n\u003c/blockquote>\n\u003cp>这类收藏可能只占留存照片的一小部分。心理上的冲击力大，不等于统计上代表常态，后句直接把二者分开。\u003c/p>\n\u003cp>结尾保留了什么未解问题：\u003c/p>\n\u003cblockquote>\n\u003cp>why formal portraits so often concealed it\u003c/p>\n\u003c/blockquote>\n\u003cp>微笑证明古人有欢笑，却仍需解释正式肖像为什么常把它藏起来。it回指laughter，不是说照片掩盖了某种摄影技术。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>微笑旧照使人惊讶 → 打破古人没有熟悉情感的印象 → 数量少仍不能代表常态 → 转问正式肖像为何常不呈现欢笑\u003c/p>\n\u003c/blockquote>\n\u003cp>Exception对应small fraction，Challenge an Impression对应interrupts the assumption。Can保留少数例子改变认识的能力，但没有把例外夸大成多数，贴合段中的双重限定。\u003c/p>\n\u003cp>再看最强干扰项C：A Society without Laughter。\u003c/p>\n\u003cp>A Society without Laughter把多数肖像严肃当成整个社会没有笑。段末却明确They show that laughter existed，正在区分照片的常见表情与现实人的情感，因此该标题把被反驳的印象误当成结论。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】E. The Practical Difficulty of Holding a Smile\u003c/p>\n\u003cblockquote>\n\u003cp>保持笑容的实际困难\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分将早期不笑解释为长曝光下维持静止的实际选择，不以不快乐作为必要前提。\u003c/p>\n\u003cp>先明确早期拍摄对人物提出的要求：\u003c/p>\n\u003cblockquote>\n\u003cp>remain still while the image was recorded\u003c/p>\n\u003c/blockquote>\n\u003cp>成像期间必须尽量不动，为下面笑容难以保持提供技术前提。不是泛泛说古人拍照紧张。\u003c/p>\n\u003cp>再比较生活中的笑与拍摄中的固定表情：\u003c/p>\n\u003cblockquote>\n\u003cp>difficult to hold unchanged for a prolonged exposure\u003c/p>\n\u003c/blockquote>\n\u003cp>短暂笑一下容易，长曝光全程维持不变却困难；头部或身体调整还会使画面模糊，因此平淡表情有实际优势。\u003c/p>\n\u003cp>结尾限定这条解释适用于哪个层面：\u003c/p>\n\u003cblockquote>\n\u003cp>the demands of the process\u003c/p>\n\u003c/blockquote>\n\u003cp>解释对象是拍摄工艺的要求，不是人物是否幸福、有没有幽默感。最后一句专门阻止从表情反推内心。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>曝光时需要静止 → 笑容难以长时间不变 → 移动可能模糊成像 → 中性表情更实用，但不代表人物没有快乐\u003c/p>\n\u003c/blockquote>\n\u003cp>Holding a Smile对应hold unchanged，Practical Difficulty对应长曝光、移动模糊与维持表情的努力。标题准确限定为操作困难，不把技术约束扩大成整个社会的性格。\u003c/p>\n\u003cp>再看最强干扰项C：A Society without Laughter。\u003c/p>\n\u003cp>没有欢笑的社会把拍摄时不笑推成生活中不会笑。本段恰说普通谈话中的brief laugh容易，而且最后否定需要用unhappy解释；不笑在这里是工艺选择，不是情感缺失。\u003c/p>\n\u003cp>\u003cstrong>42题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】A. A Faster Camera Does Not Explain Every Face\u003c/p>\n\u003cblockquote>\n\u003cp>更快的相机解释不了所有表情\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分用曝光变快而严肃仍存检验技术解释，把研究转向持续存在的社会期待。\u003c/p>\n\u003cp>时间变化首先削弱了什么解释：\u003c/p>\n\u003cblockquote>\n\u003cp>the old technical explanation became incomplete\u003c/p>\n\u003c/blockquote>\n\u003cp>曝光缩短后，自然表情更容易记录，早期工艺原因便不再充分。incomplete不是说早期长曝光从不存在。\u003c/p>\n\u003cp>中间用条件假设检查“技术决定一切”：\u003c/p>\n\u003cblockquote>\n\u003cp>If speed alone determined the face in a photograph\u003c/p>\n\u003c/blockquote>\n\u003cp>假如只有速度决定表情，每次设备改进都应带来笑容；实际不少正式肖像仍不笑，因而需要额外原因。\u003c/p>\n\u003cp>结尾指出研究视线应移往何处：\u003c/p>\n\u003cblockquote>\n\u003cp>the expectations that survived after the camera could record a smile\u003c/p>\n\u003c/blockquote>\n\u003cp>技术障碍降低后仍保留的社会期待成为解释对象。相机能拍到，与人们愿不愿以此示人，是不同条件。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>曝光变快 → 技术原因不再充分 → 严肃肖像仍然持续 → 从设备能力转查人物呈现自己的社会期待\u003c/p>\n\u003c/blockquote>\n\u003cp>Faster Camera对应shorter exposures，Does Not Explain Every Face对应incomplete与continued absence。标题不是否定技术影响，而是拒绝它包办所有年代、所有表情的解释。\u003c/p>\n\u003cp>再看最强干扰项G：Technology Automatically Changes Habits。\u003c/p>\n\u003cp>Technology Automatically Changes Habits恰好是If speed alone构造后被检验出不足的假设。continued absence与expectations that survived说明设备进步没有自动清除习惯，不能把反事实前提当成作者认可的规律。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】B. The Social Meaning of Showing One’s Teeth\u003c/p>\n\u003cblockquote>\n\u003cp>露齿的社会含义\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把牙齿外观与体面规范连接，说明露齿如何被解读成身份信息。\u003c/p>\n\u003cp>作者先补充身体层面的顾虑：\u003c/p>\n\u003cblockquote>\n\u003cp>Poor dental health could make an open smile embarrassing\u003c/p>\n\u003c/blockquote>\n\u003cp>牙齿状况差会使露齿尴尬，这是实际外貌问题；while随后引入另一种社会约束，不能只停在医学解释。\u003c/p>\n\u003cp>再看大笑与什么身份相联系：\u003c/p>\n\u003cblockquote>\n\u003cp>people thought to lack refinement\u003c/p>\n\u003c/blockquote>\n\u003cp>露齿大笑可能被归给表演者或被认为不够文雅的人，thought强调这是社会评价，不是笑容真的证明人的品质。\u003c/p>\n\u003cp>结尾把两种约束合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>a statement about status\u003c/p>\n\u003c/blockquote>\n\u003cp>牙齿本身不好看与露出来暗示错误身份共同作用，使正式肖像成为社会身份的表达；相机再快也不能直接解除这种顾虑。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>坏牙使露齿尴尬 → 体面规范再加约束 → 大笑可能暗示不被认可的身份 → 正式肖像因社会含义而避免露齿\u003c/p>\n\u003c/blockquote>\n\u003cp>Showing One’s Teeth覆盖牙齿外露的动作，Social Meaning对应refinement、wrong kind of person与status。标题统摄身体状况如何被社会阅读，比只谈牙齿卫生更完整。\u003c/p>\n\u003cp>再看最强干扰项E：The Practical Difficulty of Holding a Smile。\u003c/p>\n\u003cp>保持笑容的实际困难解释的是曝光期间维持不动。本段已明确even if the camera was fast enough，重点是表情会被看成什么身份；技术上能做到与社会上愿意做不能混同。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】D. A Portrait Is a Chosen Public Image\u003c/p>\n\u003cblockquote>\n\u003cp>肖像是经过选择的公众形象\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分以爱笑者也拒绝留下傻笑的反差，解释肖像中的公众形象选择为何不同于日常情绪。\u003c/p>\n\u003cp>Even先制造哪一层反差：\u003c/p>\n\u003cblockquote>\n\u003cp>a person who enjoyed laughter might refuse to preserve a grin\u003c/p>\n\u003c/blockquote>\n\u003cp>平时爱笑与不愿留下露齿肖像可以共存，因而不能简单把严肃照片等同于严肃性格。吐温接着作为具体例子。\u003c/p>\n\u003cp>选择表情时面对的观众是谁：\u003c/p>\n\u003cblockquote>\n\u003cp>unknown viewers who would see the portrait later\u003c/p>\n\u003c/blockquote>\n\u003cp>观众超出房间里的摄影师，还包括未来不认识的人。控制他们的判断解释了为什么正式留影可能选择严肃。\u003c/p>\n\u003cp>结尾归纳照片记录了什么：\u003c/p>\n\u003cblockquote>\n\u003cp>a decision about presentation as well as a face\u003c/p>\n\u003c/blockquote>\n\u003cp>as well as加入主动呈现的选择。照片既有人脸，也有被看见的方式，所以不能当成日常快乐程度的透明测量。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>爱笑者也可能拒绝留下笑容 → 考虑未来陌生观众的判断 → 选择严肃表情来管理形象 → 肖像不能直接测量日常快乐\u003c/p>\n\u003c/blockquote>\n\u003cp>Chosen对应Choosing与decision，Public Image对应未来viewers对人物的judgement。标题抓住正式肖像的呈现选择，能够解释吐温的反差及最后对照片阅读方式的提醒。\u003c/p>\n\u003cp>再看最强干扰项C：A Society without Laughter。\u003c/p>\n\u003cp>无欢笑社会的标题直接被enjoyed laughter否定。这个例子不是说吐温不会笑，而是说他区分日常欢笑与留给未来观众的正式形象；把两者合并，便丢掉整段最重要的反差。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>Smiling faces in old portraits can disturb a familiar image of a joyless past. When such pictures are shared today, viewers recognize expressions much like their own. The discovery makes distant people seem more human. But the emotional force of that discovery leaves a different question unanswered: how common were these smiling portraits?\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Mark Twain provides a telling example of this contrast. Although he enjoyed laughter, he objected to leaving a foolish smile permanently attached to his likeness. What mattered was the judgement of future viewers, not an inability to enjoy himself. His response shows how a decision about public presentation can differ from private habits.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>They form only a small part of the surviving collection. Most formal portraits present still, serious faces, so the exceptions cannot stand for the whole. Recognizing this imbalance changes the historian’s task. Instead of asking whether people ever laughed, the more useful question is why they so often avoided a smile when photographed.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>One answer lies in the early photographic process. Long exposures required a sitter to remain in the same position, and a sustained smile could be difficult to hold. A small movement might spoil the image. A neutral face therefore had an immediate practical advantage, making the demands of the camera an important initial explanation.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>That initial explanation became less complete as exposures shortened. A camera able to catch a spontaneous expression no longer imposed exactly the same demand on its subject. Yet serious faces remained familiar in formal portraits. The persistence of the convention after a technical obstacle had weakened suggests that another restraint was at work.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>That question of identity gave the grin a social meaning. Wide smiles could be associated with entertainers or people considered insufficiently refined, rather than with the respectable image a sitter wanted to preserve. Avoiding one could therefore signal conformity to a public standard. The standard could influence people whose ordinary temperament was anything but solemn.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>One such restraint concerned the appearance of the mouth. Where dental health was poor, showing teeth could expose something the sitter preferred to hide. An open grin might undermine the dignity expected of a formal image. But the judgement went beyond whether the teeth were attractive: it also concerned what kind of person would display them.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>That difference should guide the reading of old photographs. A serious face may reflect a technical constraint, concern about appearance or a convention about dignity, rather than a life without pleasure. Smiling exceptions help us recognize shared humanity; the larger pattern asks us to reconstruct the circumstances in which people chose how to be seen.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>以微笑旧照改变印象，追问这类照片的数量地位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>承认微笑照片稀少，将问题转为为何拍照常不笑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>以长曝光与保持不动解释早期严肃表情\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>指出技术改善后严肃仍存，提出寻找其他约束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>说明露齿的阶层含义与规范影响不只限于严肃性格者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>从牙齿外观引入体面顾虑，再转向露齿者的身份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>综合技术、外貌与规范，提醒不能由严肃肖像推断无快乐人生\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以微笑旧照改变印象，追问这类照片的数量地位 → 承认微笑照片稀少，将问题转为为何拍照常不笑 → 以长曝光与保持不动解释早期严肃表情 → 指出技术改善后严肃仍存，提出寻找其他约束 → 从牙齿外观引入体面顾虑，再转向露齿者的身份 → 说明露齿的阶层含义与规范影响不只限于严肃性格者 → 用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同 → 综合技术、外貌与规范，提醒不能由严肃肖像推断无快乐人生\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → C → D → E → G → F → B → H\u003c/strong>\u003c/p>\n\u003cp>41—45：C、D、G、F、B。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → C → D的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>But the emotional force of that discovery leaves a different question unanswered: how common were these smiling portraits?\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>They form only a small part of the surviving collection.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后明确问how common were these smiling portraits，本段They以这些微笑肖像为先行词，only a small part直接回答比例。不是另开话题讨论照片质量，而是给刚才的数量问题一个限制。\u003c/p>\n\u003cp>Most formal portraits接着提供总体常态，与少数例外对比。由此将“是否曾笑”改成“为什么拍照时常不笑”，问题对象从生活中的情绪转到正式留影行为。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Instead of asking whether people ever laughed, the more useful question is why they so often avoided a smile when photographed.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One answer lies in the early photographic process.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段One answer需要一个正在等待原因的问题，正接本段末尾why…avoided a smile。先界定多数肖像的现象，再给早期工艺解释，避免把技术史当成毫无目的的插入。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>以微笑旧照改变印象，追问这类照片的数量地位 → 承认微笑照片稀少，将问题转为为何拍照常不笑 → 以长曝光与保持不动解释早期严肃表情\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That question of identity gave the grin a social meaning.\u003c/p>\n\u003c/blockquote>\n\u003cp>That question of identity也像是在回答问题，但此时开篇问的是微笑照片常不常见，还未提出露齿会显示何种身份。候选所需的identity问题要到牙齿段末才出现，不能凭question一词就提前放置。\u003c/p>\n\u003cp>\u003cstrong>41题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成C → D → E的关系。\u003c/p>\n\u003cp>先看前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Instead of asking whether people ever laughed, the more useful question is why they so often avoided a smile when photographed.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One answer lies in the early photographic process.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后问为什么拍照常不笑，本段One answer立即给出早期拍摄流程这一原因。Long exposures与remain in the same position把答案落实为持续保持表情的身体要求。\u003c/p>\n\u003cp>长曝光导致笑容难以保持，微小移动又会毁掉影像，因此中性表情有实用优势。结尾用initial explanation主动限定这只是初步解释，为后来条件改变预留空间。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>A neutral face therefore had an immediate practical advantage, making the demands of the camera an important initial explanation.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That initial explanation became less complete as exposures shortened.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知后段That initial explanation原词回接，并以exposures shortened改变前段long exposures的前提。技术条件由慢变快，解释力因此变弱，这是一条清楚的时间与因果连续线。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>承认微笑照片稀少，将问题转为为何拍照常不笑 → 以长曝光与保持不动解释早期严肃表情 → 指出技术改善后严肃仍存，提出寻找其他约束\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One such restraint concerned the appearance of the mouth.\u003c/p>\n\u003c/blockquote>\n\u003cp>One such restraint段讨论牙齿外观，但such要求前面已提出另一个约束；当前还没有解释过技术因素。更直接的是，它结尾不含initial explanation或长曝光，无法支撑已知段对“曝光缩短后这一解释不充分”的评价。\u003c/p>\n\u003cp>\u003cstrong>42题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → F的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The persistence of the convention after a technical obstacle had weakened suggests that another restraint was at work.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One such restraint concerned the appearance of the mouth.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知前段末尾推测another restraint，本段One such restraint直接落实为嘴部外观。两句之间不是重复相机速度，而是用牙齿这一非技术原因回答设备改进后为何仍不笑。\u003c/p>\n\u003cp>牙齿卫生差使人想隐藏外观，露齿会损害正式形象的体面。但段尾But进一步说不只牙齿好不好看，还涉及什么样的人会露齿，把身体问题推进到身份评价。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>But the judgement went beyond whether the teeth were attractive: it also concerned what kind of person would display them.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That question of identity gave the grin a social meaning.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段That question of identity正接what kind of person would display them，随后列表演者与不够文雅者。前段先提出身份问题，后段才解释笑容怎样带有社会含义，层次由外观向规范深入。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>指出技术改善后严肃仍存，提出寻找其他约束 → 从牙齿外观引入体面顾虑，再转向露齿者的身份 → 说明露齿的阶层含义与规范影响不只限于严肃性格者\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One answer lies in the early photographic process.\u003c/p>\n\u003c/blockquote>\n\u003cp>重新放入早期长曝光段会回到刚被限定的技术原因。已知前段明说技术障碍已经减弱，需要another restraint；长曝光不是另一个约束，而且结尾仍是initial explanation，不能引出后段identity。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → F → B的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>But the judgement went beyond whether the teeth were attractive: it also concerned what kind of person would display them.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That question of identity gave the grin a social meaning.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后问露齿暗示what kind of person，本段That question of identity将其抽象为身份问题，social meaning随即给出解释方向。指代既有词义联系，也有从疑问到解答的功能联系。\u003c/p>\n\u003cp>表演者及被视为不够文雅的人是被关联的群体，正式肖像的主人则想保留respectable image。避免露齿因而可表示遵从公共标准；结尾把规范影响扩展到日常并不严肃的人。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The standard could influence people whose ordinary temperament was anything but solemn.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Mark Twain provides a telling example of this contrast.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段this contrast回指“公共标准仍影响日常不严肃者”的反差，吐温enjoyed laughter却反对固定傻笑正好将其具体化。若只看到Twain姓名而忽略反差，会失去例子证明哪一点。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从牙齿外观引入体面顾虑，再转向露齿者的身份 → 说明露齿的阶层含义与规范影响不只限于严肃性格者 → 用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Mark Twain provides a telling example of this contrast.\u003c/p>\n\u003c/blockquote>\n\u003cp>吐温段本身可以举例，但若放在这里，this contrast之前只有牙齿是否好看与身份问题，尚未形成日常性格活泼也受规范影响的对照。身份规范段必须先建立这一可被例证的概括。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → B → H的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The standard could influence people whose ordinary temperament was anything but solemn.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Mark Twain provides a telling example of this contrast.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末尾说规范也能影响ordinary temperament并不solemn的人，本段开头给出this contrast的实例。Although he enjoyed laughter与objected to…smile分别对应私下爱笑和正式照片拒笑。\u003c/p>\n\u003cp>段中进一步点明在意的是future viewers的判断，而不是不会快乐。末句把人物行为抽象为public presentation与private habits的区别，使个别引语能够承担更广泛的解释功能。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>His response shows how a decision about public presentation can differ from private habits.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That difference should guide the reading of old photographs.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知末段That difference承接刚概括的公开呈现与私下习惯之别，再指导如何读旧照片。它不是直接从一句名人话跳到全部历史，而是经由明确区别收束前面的多种原因。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明露齿的阶层含义与规范影响不只限于严肃性格者 → 用爱笑的吐温也拒绝傻笑肖像说明公开形象与私下习惯不同 → 综合技术、外貌与规范，提醒不能由严肃肖像推断无快乐人生\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>One such restraint concerned the appearance of the mouth.\u003c/p>\n\u003c/blockquote>\n\u003cp>牙齿段的末尾是露齿者属于哪种人的疑问，不能给That difference提供两项完整对照。它也没有爱笑者拒绝笑容的反差证据，因此不能在此替代吐温把私人习惯与公共形象分开的例证。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>historical curiosity\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>对历史的好奇心\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：好奇、求知\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>critical examination of assumptions\u003c/td>\n\u003ctd>对既有假设的审视\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>openness to new evidence\u003c/td>\n\u003ctd>对新证据的开放态度\u003c/td>\n\u003ctd>人生哲理类：谦虚、承认不足\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>shared human experience\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>共同的人类体验\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>教育文化类：文化交流\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>an understanding of cultural differences\u003c/td>\n\u003ctd>对文化差异的理解\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>access to historical information\u003c/td>\n\u003ctd>获取历史信息的渠道\u003c/td>\n\u003ctd>社会生活类：获取信息的方式\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>technological progress\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>技术进步\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>经济消费类：科技发展\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>independent thinking\u003c/td>\n\u003ctd>独立思考\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a willingness to reconsider the past\u003c/td>\n\u003ctd>重新认识过去的意愿\u003c/td>\n\u003ctd>人生哲理类：谦虚、承认不足\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture challenges a familiar impression of X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画挑战了人们对X的熟悉印象。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The people in the picture seem more familiar through their shared experience of X.\u003c/td>\n\u003ctd>画中人物因共同的X体验而显得更亲近。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast invites us to reconsider an assumption about X.\u003c/td>\n\u003ctd>这一对比促使我们重新思考关于X的假设。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>X accounts for only a tiny percentage of the total.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>X只占总量的极小比例。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The majority of the examples display X rather than Y.\u003c/td>\n\u003ctd>多数样本呈现X而非Y。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>By the end of the period, the time required for X had become much shorter.\u003c/td>\n\u003ctd>到该时期末，X所需时间已大幅缩短。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage asks why X persisted even after Y had changed.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章追问为何Y变化后X仍然持续。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text offers both a technical explanation and a social explanation for X.\u003c/td>\n\u003ctd>文章为X提供技术和社会两方面的解释。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author uses an apparent exception to reveal the strength of X.\u003c/td>\n\u003ctd>作者用一个看似可能的例外显示X的强大影响。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":7},{"label":"句内逻辑","index":31},{"label":"长难句手译","index":34},{"label":"第三鸟 · 题目复盘","index":53},{"label":"35题","index":54},{"label":"31题","index":64},{"label":"32题","index":82},{"label":"33题","index":100},{"label":"34题","index":118},{"label":"第四鸟 · 新题型","index":136},{"label":"小标题题","index":136},{"label":"排序题","index":142},{"label":"第五鸟 · 写作积累","index":148}];
const allIndices = [0,1,2,3,4,5,6,10,14,18,22,26,30,31,32,33,34,40,46,52,53,54,56,58,60,62,63,64,68,72,76,80,81,82,86,90,94,98,99,100,104,108,112,116,117,118,122,126,130,134,135,136,137,138,139,140,141,142,143,144,145,146,147,148,149];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
 const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
 const top=rightScroll.scrollTop+er.top-sr.top;
 const target=height<=view-2*margin?top+height/2-view/2:top-margin;
 rightScroll.scrollTop=clampScroll(target,rightScroll.scrollHeight-view);
}
function positionRight(st,token,restore){
 guardedSchedule(token,()=>{
  if(isLongSentenceCumulative(st)){
   positionLongSentence(st);
   if(!restore)return;
  }
  if(restore){
   rightScroll.scrollTop=saved.right;
   window.scrollTo(0,saved.win);
   return;
  }
  if(!st.meta.cumulative||st.meta.partIndex===0){rightScroll.scrollTop=0;return;}
  const el=document.getElementById(st.focusId);
  if(!el)return;
  if(isParagraphCumulative(st)){
   // Match the sample: no artificial tail; real content height limits the scroll.
   const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const top=rightScroll.scrollTop+er.top-sr.top;
   rightScroll.scrollTop=clampScroll(top-34,rightScroll.scrollHeight-rightScroll.clientHeight);
   return;
  }
  // A short final layer still needs enough trailing room to bring its heading into view.
  const tail=rightContent.querySelector('.longScrollTail');
  if(tail)tail.style.minHeight=Math.max(420,rightScroll.clientHeight*.9-el.offsetHeight)+'px';
  const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
  const top=rightScroll.scrollTop+er.top-sr.top;
  rightScroll.scrollTop=latestTarget(top,rightScroll.clientHeight,rightScroll.scrollHeight-rightScroll.clientHeight);
 });
}
function render(options={}){
 const token=++renderToken; // stale image and scroll callbacks may never reset a newer step
 document.body.classList.toggle('allMode',all);
 toggleAll.classList.toggle('active',all);
 toggleAll.textContent=all?'返回交互':'显示全部';
 if(all){
  layout.className='layout single';leftPanel.hidden=true;
  rightContent.innerHTML='<div class="fullContent">'+FULL+'</div>';
  hydrateAssets(rightContent);rightScroll.scrollTop=0;
  progress.textContent='全文';
  prev.disabled=next.disabled=reset.disabled=jump.disabled=true;
  return;
 }
 const st=DATA[idx],previous=lastRenderedIdx<0?null:DATA[lastRenderedIdx];
 const sameGroup=previous&&st.meta.cumulative&&previous.meta.cumulative&&st.meta.cumulativeGroup===previous.meta.cumulativeGroup;
 reset.disabled=jump.disabled=false;prev.disabled=idx===0;next.disabled=idx===DATA.length-1;
 progress.textContent=(idx+1)+' / '+DATA.length;
 if(st.context){
  layout.className='layout split';leftPanel.hidden=false;
  renderContext(st.context,token,options.restore===true);
 }else{
  layout.className='layout single';leftPanel.hidden=true;
  leftStage.innerHTML='';delete leftStage.dataset.kind;
 }
 const holder=rightContent.querySelector('.cumulativeParts');
 let kept=false;
 if(sameGroup&&holder&&!options.restore){
  if(st.html.startsWith(previous.html)){
