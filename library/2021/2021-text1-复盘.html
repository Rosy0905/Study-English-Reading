const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| train operator | n.火车运营商 | possibly | adv.可能 | justify | v.证明……合理 |\n| increase | n.增加 | rail | adj.铁路的 | passenger fare | n.乘客票价 |\n| grimly | adv.令人不快地 | reliable | adj.可靠的；此处指总会发生的 | annual ritual | n.年度惯例 |\n| January | n.一月 | cost | n.费用 | travel | v.旅行；出行 |\n| rise | v.上涨 | impose | v.施加 | significant | adj.显著的 |\n| extra burden | n.额外负担 | option | n.选择 | rail network | n.铁路网 |\n| otherwise | adv.在其他情形下 | average | n.平均数 | fraction | n.小部分；少量 |\n| still | adv.仍然 | official | adj.官方的 | Consumer Price Index | n.消费者价格指数 |\n| measure | n.衡量指标 | inflation | n.通货膨胀 |  |  |","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 1重点词与语境","focus":[85,159,925,617],"sourceW":1080,"sourceH":4587,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表 t rises, / have received too much attention / compared to those / who must endure / the relatively poor infrastructure / of the Midlands and the North.","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,790,925,959],"sourceW":1080,"sourceH":4587,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-2-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer. Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey? Equally, there is a sense that the travails of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor infrastructure of the Midlands and the North.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Successive governments / have permitted such increases / on the grounds / that the cost of investing in / and running the rail network / should be borne by / those who use it, / rather than the general taxpayer.\u003c/p>\n\u003cp>Why, / the argument goes, / should a car-driving pensioner / from Lincolnshire / have to subsidise / the daily commute / of a stockbroker from Surrey?\u003c/p>\n\u003cp>Equally, / there is a sense / that the travails of commuters / in the South East, / many of whom will face / among the biggest rises, / have received too much attention / compared to those / who must endure / the relatively poor infrastructure / of the Midlands and the North.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 意群翻译 · 第2段\n\n历届政府 / 已经允许这样的增长 / 基于这个理由 / 投资的成本 / 和运营铁路网络 / 应该由承担 / 使用它的人，/ 而不是一般纳税人。\n\n为什么，/ 这个论点说，/ 一个开车的养老金领取者 / 来自林肯郡的 / 必须补贴 / 每日通勤 / 一个来自萨里的股票经纪人的？\n\n同样地，/ 有一种感觉 / 通勤者的困境 / 在东南部的，/ 他们中的许多人将面临 / 最大涨幅之一，/ 已经获得了太多关注 / 相比于那些人 / 他们必须忍受 / 相对较差的基础设施 / 中部和北部的。","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,790,925,959],"sourceW":1080,"sourceH":4587,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-2-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer. Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey? Equally, there is a sense that the travails of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor infrastructure of the Midlands and the North.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Successive governments / have permitted such increases / on the grounds / that the cost of investing in / and running the rail network / should be borne by / those who use it, / rather than the general taxpayer.\u003c/p>\n\u003cp>Why, / the argument goes, / should a car-driving pensioner / from Lincolnshire / have to subsidise / the daily commute / of a stockbroker from Surrey?\u003c/p>\n\u003cp>Equally, / there is a sense / that the travails of commuters / in the South East, / many of whom will face / among the biggest rises, / have received too much attention / compared to those / who must endure / the relatively poor infrastructure / of the Midlands and the North.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-2\">\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>历届政府 / 已经允许这样的增长 / 基于这个理由 / 投资的成本 / 和运营铁路网络 / 应该由承担 / 使用它的人，/ 而不是一般纳税人。\u003c/p>\n\u003cp>为什么，/ 这个论点说，/ 一个开车的养老金领取者 / 来自林肯郡的 / 必须补贴 / 每日通勤 / 一个来自萨里的股票经纪人的？\u003c/p>\n\u003cp>同样地，/ 有一种感觉 / 通勤者的困境 / 在东南部的，/ 他们中的许多人将面临 / 最大涨幅之一，/ 已经获得了太多关注 / 相比于那些人 / 他们必须忍受 / 相对较差的基础设施 / 中部和北部的。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 标准译文 · 第2段\n\n历届政府都允许这样的涨价，理由是投资和运营铁路网络的成本应该由使用者承担，而不是一般纳税人。这个论点认为：为什么林肯郡一个开车的养老金领取者要补贴萨里股票经纪人的每日通勤？同样，人们感觉东南部通勤者的困境（他们中许多人将面临最大幅度的涨价）获得了太多关注，相比之下，中部和北部地区的人们必须忍受相对较差的基础设施。","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,790,925,959],"sourceW":1080,"sourceH":4587,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-2-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer. Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey? Equally, there is a sense that the travails of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor infrastructure of the Midlands and the North.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-1\">\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Successive governments / have permitted such increases / on the grounds / that the cost of investing in / and running the rail network / should be borne by / those who use it, / rather than the general taxpayer.\u003c/p>\n\u003cp>Why, / the argument goes, / should a car-driving pensioner / from Lincolnshire / have to subsidise / the daily commute / of a stockbroker from Surrey?\u003c/p>\n\u003cp>Equally, / there is a sense / that the travails of commuters / in the South East, / many of whom will face / among the biggest rises, / have received too much attention / compared to those / who must endure / the relatively poor infrastructure / of the Midlands and the North.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-2\">\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>历届政府 / 已经允许这样的增长 / 基于这个理由 / 投资的成本 / 和运营铁路网络 / 应该由承担 / 使用它的人，/ 而不是一般纳税人。\u003c/p>\n\u003cp>为什么，/ 这个论点说，/ 一个开车的养老金领取者 / 来自林肯郡的 / 必须补贴 / 每日通勤 / 一个来自萨里的股票经纪人的？\u003c/p>\n\u003cp>同样地，/ 有一种感觉 / 通勤者的困境 / 在东南部的，/ 他们中的许多人将面临 / 最大涨幅之一，/ 已经获得了太多关注 / 相比于那些人 / 他们必须忍受 / 相对较差的基础设施 / 中部和北部的。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-2-3\">\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>历届政府都允许这样的涨价，理由是投资和运营铁路网络的成本应该由使用者承担，而不是一般纳税人。这个论点认为：为什么林肯郡一个开车的养老金领取者要补贴萨里股票经纪人的每日通勤？同样，人们感觉东南部通勤者的困境（他们中许多人将面临最大幅度的涨价）获得了太多关注，相比之下，中部和北部地区的人们必须忍受相对较差的基础设施。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 完整原文 · 第3段\n\nHowever, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years. It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel. The responsibility for the latest wave of strikes rests on the unions. However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.","c /section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 标准译文 · 第3段\n\n然而，在过去的12个月里，这些通勤者还经历了多年来最严重的一些铁路罢工。火车运营商吹嘘他们对铁路网络的改进固然很好，但考虑到乘客现在支付的可观费用，他们应该能够期待基本水平的服务。最近一波罢工的责任在于工会。然而，有充分的理由认为，那些受工业行动影响最严重的人应该为他们所遭受的干扰获得补偿。","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1763,925,673],"sourceW":1080,"sourceH":4587,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-3-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years. It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel. The responsibility for the latest wave of strikes rests on the unions. However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-1\">\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>However, / over the past 12 months, / those commuters / have also experienced / some of the worst rail strikes / in years.\u003c/p>\n\u003cp>It is all very well / train operators trumpeting / the improvements / they are making to the network, / but passengers should be able to expect / a basic level of service / for the substantial sums / they are now paying to travel.\u003c/p>\n\u003cp>The responsibility / for the latest wave of strikes / rests on the unions.\u003c/p>\n\u003cp>However, / there is a strong case / that those / who have been worst affected / by industrial action / should receive compensation / for the disruption / they have s , even when strikes occur, services can continue to operate. This should form part of a wider package of measures to address the long-running problems on Britain&#39;s railways. Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, punctuated by regular chaos when timetables are changed, or planned maintenance is managed incompetently. The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群划分 · 第4段\n\nThe Government has pledged / to change the law / to introduce / a minimum service requirement / so that, / even when strikes occur, / services can continue to operate.\n\nThis should form part / of a wider package of measures / to address / the long-running problems / on Britain's railways.\n\nYes, / more investment is needed, / but passengers will not be willing / to pay more indefinitely / if they must also endure / cramped, unreliable services, / punctuated by regular chaos / when timetables are changed, / or planned maintenance / is managed incompetently.\n\nThe threat of nationalisation / may have been seen off / for now, / but it will return / with a vengeance / if the justified anger of passengers / is not addressed / in short order.","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,2478,925,1056],"sourceW":1080,"sourceH":4587,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-4-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>The Government has pledged to change the law to introduce a minimum service requirement so that, even when strikes H":4587,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-4-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>The Government has pledged to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate. This should form part of a wider package of measures to address the long-running problems on Britain&#39;s railways. Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, punctuated by regular chaos when timetables are changed, or planned maintenance is managed incompetently. The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>The Government has pledged / to change the law / to introduce / a minimum service requirement / so that, / even when strikes occur, / services can continue to operate.\u003c/p>\n\u003cp>This should form part / of a wider package of measures / to address / the long-running problems / on Britain&#39;s railways.\u003c/p>\n\u003cp>Yes, / more investment is needed, / but passengers will not be willing / to pay more indefinitely / if they must also endure / cramped, unreliable services, / punctuated by regular chaos / when timetables are changed, / or planned maintenance / is managed incompetently.\u003c/p>\n\u003cp>The threat of nationalisation / may have been seen off / for now, / but it will return / with a vengeance / if the justified anger of passengers / is not addressed / in short order.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-2\">\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>政府已经承诺 / 改变法律 / 来引入 / 最低服务要求 / 以便，/ 即使罢工发生时，/ 服务可以继续运营。\u003c/p>\n\u003cp>这应该构成一部分 / 更广泛的措施包 / 来解决 / 长期存在的问题 / 在英国铁路上。\u003c/p>\n\u003cp>是的，/ 需要更多投资，/ 但乘客不会愿意 / 无限期地支付更多 / 如果他们还必须忍受 / 拥挤、不可靠的服务，/ 被定期混乱打断 / 当时间表被更改时，/ 或计划维护 / 被管理得无能。\u003c/p>\n\u003cp>国有化的威胁 / 可能已经被击退 / 目前，/ 但它将返回 / 猛烈地 / 如果乘客的正当愤怒 / 没有被解决 / 在短期内。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 标准译文 · 第4段\n\n政府已承诺修改法律，引入最低服务要求，以便即使在罢工期间，服务也能继续运营。这应该成为解决英国铁路长期问题的更广泛措施的一部分。是的，需要更多投资，但如果乘客还必须忍受拥挤、不可靠的服务，以及时间表更改或计划维护管理不善造成的定期混乱，他们不会愿意无限期地支付更多费用。国有化的威胁可能暂时被击退了，但如果不尽快解决乘客的正当愤怒，它将猛烈地卷土重来。","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,2478,925,1056],"sourceW":1080,"sourceH":4587,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-4-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>The Government has pledged to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate. This should form part of a wider package of measures to address the long-running problems on Britain&#39;s railways. Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, punctuated by regular chaos when timetables are changed, or planned maintenance is managed incompetently. The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>The Government has pledged / to change the law / to introduce / a minimum service requirement / u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n"},{"section":"第二鸟 · 精读与翻译","title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n### 第1段\n\nHow can the train operators → possibly justify → yet another increase：(to rail passenger fares)?\n\nIt has become → a grimly reliable annual ritual：every January → the cost of travelling by train rises → imposing a significant extra burden：(on those：(who have no option → but to use the rail network：(to get to work or otherwise))).\n\nThis year's rise：(an average of 2.7 per cent) → may be a fraction lower：(than last year's) // but it is still well above → the official Consumer Price Index (CPI)：(measure of inflation).\n\n### 第2段\n\nSuccessive governments → have permitted such increases：(on the grounds：(that the cost：(of investing in + running the rail network) → should be borne by → those who use it // rather than the general taxpayer)).\n\nWhy：(the argument goes) → should a car-driving pensioner：(from Lincolnshire) → have to subsidise → the daily commute：(of a stockbroker from Surrey)?\n\nEqually → there is a sense：(that the travails of commuters：(in the South East)：(many of whom will face → among the biggest rises) → have received too much attention：(compared to those：(who must endure → the relatively poor infrastructure：(of the Midlands and the North)))).\n\n### 第3段\n\nHowever → over the past 12 months → those commuters → have also experienced → some of the worst rail strikes：(in years).\n\nIt is all very well：(train operators trumpeting → the improvements：(they are making to the network)) // but passengers should be able to expect → a basic level of service：(for the substantial sums：(they are now paying to travel)).\n\nThe responsibility：(for the latest wave of strikes) → rests on the unions.\n\nHowever → there is a strong case：(that those：(who have been worst affected：(by industrial action)) → should receive compensation：(for the disruption：(they have suffered))).\n\n### 第4段\n\nThe Government has pledged → to change the law → to introduce → a minimum service requirement：(so that：(even when strikes occur) → services can continue to operate).\n\nThis should form part：(of a wider package of measures) → to address → the long-running problems：(on Britain's railways).\n\nYes → more investment is needed // but passengers will not be willing → to pay more indefinitely：(if they must also endure → cramped, unreliable services：(punctuated by regular chaos：(when timetables are changed // or planned maintenance → is managed incompetently))).\n\nThe threat of nationalisation → may have been seen off：(for now) // but it will return：(with a vengeance)：(if the justified anger of passengers → is not addressed：(in short order)).","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 1重点词与语境","focus":[0,0,1080,4587],"sourceW":1080,"sourceH":4587,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>How can the train operators → possibly justify → yet another increase：(to rail passenger fares)?\u003c/p>\n\u003cp>It has become → a grimly reliable annual ritual：every January → the cost of travelling by train rises → imposing a significant extra burden：(on those：(who have no option → but to use the rail network：(to get to work or otherwise))).\u003c/p>\n\u003cp>This year&#39;s rise：(an average of 2.7 per cent) → may be a fraction lower：(than last year&#39;s) // but it is still well above → the official Consumer Price Index (CPI)：(measure of inflation).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Successive governments → have permitted such increases：(on the grounds：(that the cost：(of investing in + running the rail network) → should be borne by → those who use it // rather than the general taxpayer)).\u003c/p>\n\u003cp>Why：(the argument goes) → should a car-driving pensioner：(from Lincolnshire) → have to subsidise → the daily commute：(of a stockbroker from Surrey)?\u003c/p>\n\u003cp>Equally → there is a sense：(that the travails of commuters：(in the South East)：(many of whom will face → among the biggest rises) → have received too much attention：(compared to those：(who must endure → the relatively poor infrastructure：(of the Midlands and the North)))).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>However → over the past 12 months → those commuters → have also experienced → some of the worst rail strikes：(in years).\u003c/p>\n\u003cp>It is all very well：(train operators trumpeting → the improvements：(they are making to the network)) // but passengers should be able to expect → a basic level of service：(for the substantial sums：(they are now paying to travel)).\u003c/p>\n\u003cp>The responsibility：(for the latest wave of strikes) → rests on the unions.\u003c/p>\n\u003cp>However → there is a strong case：(that those：(who have been worst affected：(by industrial action)) → should receive compensation：(for the disruption：(they have suffered))).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>The Government has pledged → to change the law → to introduce → a minimum service requirement：(so that：(even when strikes occur) → services can continue to operate).\u003c/p>\n\u003cp>This should form part：(of a wider package of measures) → to address → the long-running problems：(on Britain&#39;s railways).\u003c/p>\n\u003cp>Yes → more investment is needed // but passengers will not be willing → to pay more indefinitely：(if they must also endure → cramped, unreliable services：(punctuated by regular chaos：(when timetables are changed // or planned maintenance → is managed incompetently))).\u003c/p>\n\u003cp>The threat of nationalisation → may have been seen off：(for now) // but it will return：(with a vengeance)：(if the justified anger of passengers → is not addressed：(in short order)).\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n火车运营商怎么能 → 可能证明合理 → 又一次增加：(铁路乘客票价)？\n\n它已经成为 → 一个严峻可靠的年度惯例：每年一月 → 乘火车旅行的费用上涨 → 施加了显著的额外负担：(给那些人：(他们别无选择 → 只能使用铁路网络：(去上班或其他用途)))。\n\n今年的涨幅：(平均2.7%) → 可能略低一点：(比去年的) // 但它仍然远高于 → 官方消费者价格指数（CPI）：(通货膨胀衡量标准)。\n\n### 第2段\n\n历届政府 → 已经允许这样的增长：(基于这个理由：(成本：(投资 + 运营铁路网络) → 应该由承担 → 使用它的人 // 而不是一般纳税人))。\n\n为什么：(这个论点说) → 一个开车的养老金领取者：(来自林肯郡的) → 必须补贴 → 每日通勤：(一个来自萨里的股票经纪人的)？\n\n同样地 → 有一种感觉：(通勤者的困境：(在东南部的)：(他们中的许多人将面临 → 最大涨幅之一) → 已经获得了太多关注：(相比于那些人：(他们必须忍受 → 相对较差的基础设施：(中部和北部的))))。\n\n### 第3段\n\n然而 → 在过去的12个月里 → 这些通勤者 → 也经历了 → 一些最严重的铁路罢工：(多年来的)。\n\n这都很好：(火车运营商吹嘘 → 改进：(他们正在对网络进行的)) // 但乘客应该能够期待 → 基本水平的服务：(为了可观的金额：(他们现在支付的旅行费用))。\n\n责任：(最近一波罢工的) → 在于工会。\n\n然而 → 有一个强有力的理由：(那些人：(受影响最严重的：(被工业行动)) → 应该得到补偿：(为了干扰：(他们所遭受的)))。\n\n### 第4段\n\n政府已经承诺 → 改变法律 → 来引入 → 最低服务要求：(以便：(即使罢工发生时) → 服务可以继续运营)。\n\n这应该构成一部分：(更广泛的措施包) → 来解决 → 长期存在的问题：(在英国铁路上)。\n\n是的 → 需要更多投资 // 但乘客不会愿意 → 无限期地支付更多：(如果他们还必须忍受 → 拥挤、不可靠的服务：(被定期混乱打断：(当时间表被更改时 // 或计划维护 → 被管理得无能)))。\n\n国有化的威胁 → 可能已经被击退：(目前) // 但它将返回：(猛烈地)：(如果乘客的正当愤怒 → 没有被解决：(在短期内))。","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 1重点词与语境","focus":[0,0,1080,4587],"sourceW":1080,"sourceH":4587,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>火车运营商怎么能 → 可能证明合理 → 又一次增加：(铁路乘客票价)？\u003c/p>\n\u003cp>它已经成为 → 一个严峻可靠的年度惯例：每年一月 → 乘火车旅行的费用上涨 → 施加了显著的额外负担：(给那些人：(他们别无选择 → 只能使用铁路网络：(去上班或其他用途)))。\u003c/p>\n\u003cp>今年的涨幅：(平均2.7%) → 可能略低一点：(比去年的) // 但它仍然远高于 → 官方消费者价格指数（CPI）：(通货膨胀衡量标准)。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>历届政府 → 已经允许这样的增长：(基于这个理由：(成本：(投资 + 运营铁路网络) → 应该由承担 → 使用它的人 // 而不是一般纳税人))。\u003c/p>\n\u003cp>为什么：(这个论点说) → 一个开车的养老金领取者：(来自林肯郡的) → 必须补贴 → 每日通勤：(一个来自萨里的股票经纪人的)？\u003c/p>\n\u003cp>同样地 → 有一种感觉：(通勤者的困境：(在东南部的)：(他们中的许多人将面临 → 最大涨幅之一) → 已经获得了太多关注：(相比于那些人：(他们必须忍受 → 相对较差的基础设施：(中部和北部的))))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>然而 → 在过去的12个月里 → 这些通勤者 → 也经历了 → 一些最严重的铁路罢工：(多年来的)。\u003c/p>\n\u0 三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"25题 · 题干、题型与核心出处","level":2,"raw":"## 25题\n\n**Which of the following would be the best title for the text?**\n\n下列哪一项最适合做这篇文章的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Ever-rising Fares Aren’t Sustainable**\n\n不断上涨的票价难以持续\n\nB. **Who Are to Blame for the Strikes?**\n\n罢工应该归咎于谁？\n\nC. **Constant Complaining Doesn’t Work**\n\n不停抱怨并不起作用\n\nD. **Can Nationalisation Bring Hope?**\n\n国有化能带来希望吗？\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。 | 先说xxx继续这样没道理 |\n| 第2段 | 说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。 | 再说支持xxx的人怎么解释 |\n| 第3段 | 转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。 | 但话说回来实际并没有做好 |\n| 第4段 | 提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。 | 最后说不改好会有更大麻烦 |","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"question":"25","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下列哪一项最适合做这篇文章的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Ever-rising Fares Aren’t Sustainable\u003c/strong>\u003c/p>\n\u003cp>不断上涨的票价难以持续\u003c/p>\n\u003cp>B. \u003cstrong>Who Are to Blame for the Strikes?\u003c/strong>\u003c/p>\n\u003cp>罢工应该归咎于谁？\u003c/p>\n\u003cp>C. \u003cstrong>Constant Complaining Doesn’t Work\u003c/strong>\u003c/p>\n\u003cp>不停抱怨并不起作用\u003c/p>\n\u003cp>D. \u003cstrong>Can Nationalisation Bring Hope?\u003c/strong>\u003c/p>\n\u003cp>国有化能带来希望吗？\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\u003c/td>\n\u003ctd>先说xxx继续这样没道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。\u003c/td>\n\u003ctd>再说支持xxx的人怎么解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。\u003c/td>\n\u003ctd>但话说回来实际并没有做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\u003c/td>\n\u003ctd>最后说不改好会有更大麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. Ever-rising Fares Aren’t Sustainable","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### A. Ever-rising Fares Aren’t Sustainable\n\n不断上涨的票价难以持续","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"A"},"focusId":"focus-q25-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>不断上涨的票价难以持续\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. Ever-rising Fares Aren’t Sustainable","level":3,"raw":"#### 如果 A 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\n不断上涨的票价难以持续\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从新一轮票价涨幅仍超过通胀写起，提出持续向通勤者加价是否还有合理基础。 | 先说xxx继续这样没道理 |\n| 第2段 | 解释支持涨价者的使用者付费逻辑，并说明其为何认为非乘客不应补贴通勤成本。 | 再说支持xxx的人怎么解释 |\n| 第3段 | 转到严重罢工和基本服务欠账，检验付费理由是否在现实服务中得到兑现。 | 但话说回来实际并没有做好 |\n| 第4段 | 提出服务改革与补偿方向，指出若仍不解决不满，持续涨价将引来所有权层面的更大压力。 | 最后说不改好会有更大麻烦 |\n\nA可以把每段的动作接起来。第1段问又一次涨价如何justify，第2段摆出成本由使用者承担的理由，第3段的However再把严重罢工和基本服务摆到这些理由面前，第4段直接说乘客在服务不可靠时不会愿意继续多付。A中的Aren’t Sustainable说这种不断上涨的做法难以持续，并不等于否认铁路需要任何投资；作者明说more investment is needed，问题在于不能只要求乘客加钱，却不处理服务与愤怒。国有化威胁正是这种矛盾继续下去的后果。\n\n判断：\n\n**A 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"A"},"focusId":"focus-q25-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>不断上涨的票价难以持续\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-A-1\">\u003ch4>如果 A 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>不断上涨的票价难以持续\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从新一轮票价涨幅仍超过通胀写起，提出持续向通勤者加价是否还有合理基础。\u003c/td>\n\u003ctd>先说xxx继续这样没道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释支持涨价者的使用者付费逻辑，并说明其为何认为非乘客不应补贴通勤成本。\u003c/td>\n\u003ctd>再说支持xxx的人怎么解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>转到严重罢工和基本服务欠账，检验付费理由是否在现实服务中得到兑现。\u003c/td>\n\u003ctd>但话说回来实际并没有做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>提出服务改革与补偿方向，指出若仍不解决不满，持续涨价将引来所有权层面的更大压力。\u003c/td>\n\u003ctd>最后说不改好会有更大麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A可以把每段的动作接起来。第1段问又一次涨价如何justify，第2段摆出成本由使用者承担的理由，第3段的However再把严重罢工和基本服务摆到这些理由面前，第4段直接说乘客在服务不可靠时不会愿意继续多付。A中的Aren’t Sustainable说这种不断上涨的做法难以持续，并不等于否认铁路需要任何投资；作者明说more investment is needed，问题在于不能只要求乘客加钱，却不处理服务与愤怒。国有化威胁正是这种矛盾继续下去的后果。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Who Are to Blame for the Strikes?","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### B. Who Are to Blame for the Strikes?\n\n罢工应该归咎于谁？","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"B"},"focusId":"focus-q25-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>罢工应该归咎于谁？\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Who Are to Blame for the Strikes?","level":3,"raw":"#### 如果 B 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\n罢工应该归咎于谁？\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 以又一轮铁路罢工引发出行损失开篇，说明责任推诿继续下去无法接受。 | 先说xxx继续这样没道理 |\n| 第2段 | 让工会、运营商和政府分别陈述对罢工原因及责任归属的解释。 | 再说支持xxx的人怎么解释 |\n| 第3段 | 核对各方实际履约与谈判行为，指出已有辩护无法解释哪些服务中断。 | 但话说回来实际并没有做好 |\n| 第4段 | 说明不厘清责任并改进劳资协调，未来罢工将进一步破坏铁路体系的公众信任。 | 最后说不改好会有更大麻烦 |\n\n第3段确实有The responsibility...rests on the unions，工会承担最新罢工责任这一点非常明确。但前两段大部分内容与“谁造成罢工”无关：票价年年上涨、今年高于通胀、使用者承担成本，都是围绕付费合理性展开。作者指明工会责任后马上又要求受影响乘客得到补偿，末段回到服务、投资和多付钱的条件。因此罢工是服务未达到期待的一部分，不是全文要反复追查的中心问题。\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"B"},"focusId":"focus-q25-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>罢工应该归咎于谁？\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-B-1\">\u003ch4>如果 B 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>罢工应该归咎于谁？\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以又一轮铁路罢工引发出行损失开篇，说明责任推诿继续下去无法接受。\u003c/td>\n\u003ctd>先说xxx继续这样没道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>让工会、运营商和政府分别陈述对罢工原因及责任归属的解释。\u003c/td>\n\u003ctd>再说支持xxx的人怎么解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>核对各方实际履约与谈判行为，指出已有辩护无法解释哪些服务中断。\u003c/td>\n\u003ctd>但话说回来实际并没有做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明不厘清责任并改进劳资协调，未来罢工将进一步破坏铁路体系的公众信任。\u003c/td>\n\u003ctd>最后说不改好会有更大麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第3段确实有The responsibility...rests on the unions，工会承担最新罢工责任这一点非常明确。但前两段大部分内容与“谁造成罢工”无关：票价年年上涨、今年高于通胀、使用者承担成本，都是围绕付费合理性展开。作者指明工会责任后马上又要求受影响乘客得到补偿，末段回到服务、投资和多付钱的条件。因此罢工是服务未达到期待的一部分，不是全文要反复追查的中心问题。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Constant Complaining Doesn’t Work","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### C. Constant Complaining Doesn’t Work\n\n不停抱怨并不起作用","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"C"},"focusId":"focus-q25-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>不停抱怨并不起作用\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Constant Complaining Doesn’t Work","level":3,"raw":"#### 如果 C 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\n不停抱怨并不起作用\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 从乘客年复一年投诉却仍遭涨价和中断的现象切入，提出单靠抱怨不足以解决问题。 | 先说xxx继续这样没道理 |\n| 第2段 | 介绍相信投诉有效的一方如何解释舆论、客服和乘客组织可以推动改进。 | 再说支持xxx的人怎么解释 |\n| 第3段 | 检验这些投诉渠道的实际效果，展示反复表达不满后服务仍未改善的落差。 | 但话说回来实际并没有做好 |\n| 第4段 | 提出比抱怨更有约束力的行动或制度渠道，并说明继续只抱怨会使问题恶化。 | 最后说不改好会有更大麻烦 |\n\nC把Constant Complaining作为需要否定的行为，但原文开头并没有责备乘客抱怨，而是替乘客质问运营商为何再次涨价。末段又用justified anger把愤怒说成有理由的，要求及时处理；中间还主张受影响乘客应得到补偿。第2段对某些通勤者受到关注的说法只是被摆出的一个角度，后面的However把讨论重新带回他们确实遭受的服务问题。全文并没有用“抱怨没用”来否定乘客的要求。\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"C"},"focusId":"focus-q25-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>不停抱怨并不起作用\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-C-1\">\u003ch4>如果 C 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>不停抱怨并不起作用\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从乘客年复一年投诉却仍遭涨价和中断的现象切入，提出单靠抱怨不足以解决问题。\u003c/td>\n\u003ctd>先说xxx继续这样没道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>介绍相信投诉有效的一方如何解释舆论、客服和乘客组织可以推动改进。\u003c/td>\n\u003ctd>再说支持xxx的人怎么解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>检验这些投诉渠道的实际效果，展示反复表达不满后服务仍未改善的落差。\u003c/td>\n\u003ctd>但话说回来实际并没有做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>提出比抱怨更有约束力的行动或制度渠道，并说明继续只抱怨会使问题恶化。\u003c/td>\n\u003ctd>最后说不改好会有更大麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C把Constant Complaining作为需要否定的行为，但原文开头并没有责备乘客抱怨，而是替乘客质问运营商为何再次涨价。末段又用justified anger把愤怒说成有理由的，要求及时处理；中间还主张受影响乘客应得到补偿。第2段对某些通勤者受到关注的说法只是被摆出的一个角度，后面的However把讨论重新带回他们确实遭受的服务问题。全文并没有用“抱怨没用”来否定乘客的要求。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Can Nationalisation Bring Hope?","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### D. Can Nationalisation Bring Hope?\n\n国有化能带来希望吗？","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"25","option":"D"},"focusId":"focus-q25-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q25-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>国有化能带来希望吗？\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Can Nationalisation Bring Hope?","level":3,"raw":"#### 如果 D 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\n国有化能带来希望吗？\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 以现有铁路所有权安排下反复出现的涨价和服务问题开篇，提出继续维持是否合理。 | 先说xxx继续这样没道理 |\n| 第2段 | 介绍国有化支持者如何解释公共所有权能改变成本、投资和服务目标。 | 再说支持xxx的人怎么解释 |\n| 第3段 | 回到已有公共管理经验，检查国有化承诺是否真正解决效率和服务欠账。 | 但话说回来实际并没有做好 |\n| 第4段 | 讨论国有化要带来希望还需哪些治理改革，以及不配套改革可能留下的新风险。 | 最后说不改好会有更大麻烦 |\n\nD抓住第4段末尾的nationalisation，但文章把它称为threat，是现有运营安排若不及时处理乘客愤怒可能再次面对的后果。正文没有比较国有铁路和其他所有权安排的运营成绩，也没有说明国有化如何出资、怎样解决罢工。前三段展开的是乘客为什么不断被要求多付钱，以及基本服务是否做到；最后才用所有权可能改变加重警告。一个结尾的条件后果，不能替换前三段持续展开的票价与服务问题。\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"25","option":"D"},"focusId":"focus-q25-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q25-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>国有化能带来希望吗？\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q25-D-1\">\u003ch4>如果 D 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>国有化能带来希望吗？\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以现有铁路所有权安排下反复出现的涨价和服务问题开篇，提出继续维持是否合理。\u003c/td>\n\u003ctd>先说xxx继续这样没道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>介绍国有化支持者如何解释公共所有权能改变成本、投资和服务目标。\u003c/td>\n\u003ctd>再说支持xxx的人怎么解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>回到已有公共管理经验，检查国有化承诺是否真正解决效率和服务欠账。\u003c/td>\n\u003ctd>但话说回来实际并没有做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>讨论国有化要带来希望还需哪些治理改革，以及不配套改革可能留下的新风险。\u003c/td>\n\u003ctd>最后说不改好会有更大麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D抓住第4段末尾的nationalisation，但文章把它称为threat，是现有运营安排若不及时处理乘客愤怒可能再次面对的后果。正文没有比较国有铁路和其他所有权安排的运营成绩，也没有说明国有化如何出资、怎样解决罢工。前三段展开的是乘客为什么不断被要求多付钱，以及基本服务是否做到；最后才用所有权可能改变加重警告。一个结尾的条件后果，不能替换前三段持续展开的票价与服务问题。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"25题结论","level":2,"raw":"### 25题结论\n\n**25. A. Ever-rising Fares Aren’t Sustainable**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Ever-rising Fares Aren’t Sustainable / 不断上涨的票价难以持续**","context":{"mode":"image","asset":"questions","focus":[250,2357,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"question":"25","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>25. A. Ever-rising Fares Aren’t Sustainable\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Ever-rising Fares Aren’t Sustainable / 不断上涨的票价难以持续\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"21题 · 题干、题型与核心出处","level":2,"raw":"## 21题\n\n> The author holds that this year’s increase in rail passenger fares ______.  \n> 作者认为，今年铁路乘客票价上涨怎么样？\n\n### 题型\n\n作者评价题。题干要求判断“作者认为，今年铁路乘客票价上涨怎么样？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> How can Britain’s train operators possibly justify yet another increase to rail passenger fares? It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise. This year's rise, an average of 2.7 per cent, may be a fraction lower than last year's, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\n\n首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。","context":{"mode":"image","asset":"questions","focus":[250,244,1800,441],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"question":"21","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The author holds that this year’s increase in rail passenger fares ______.\u003cbr>作者认为，今年铁路乘客票价上涨怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>作者评价题。题干要求判断“作者认为，今年铁路乘客票价上涨怎么样？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>How can Britain’s train operators possibly justify yet another increase to rail passenger fares? It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise. This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003c/blockquote>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. will ease train operators’ burden","level":3,"raw":"### A. will ease train operators’ burden\n\n> 将减轻火车运营商的负担\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 train operators’ burden 与第1段 extra burden 都谈负担，所以回看 imposing a significant extra burden 后面的on those，确认负担落在运营商还是只能乘火车的人身上。\n\n**错误类型：第三类——无中生有。**\n\n原文 extra burden 后面接的是别无选择、必须坐火车通勤的人，涨价让这些乘客多付钱。A的 train operators’ burden 则把负担的承受者换成运营商，并把增加改成ease所说的减轻。题干要作者对今年涨价的判断，原文写乘客因涨价更沉重，A却写企业从涨价中得到缓解，人物和动作方向都变了。\n\n原文评价的对象是乘客多付的钱，A换成运营商并反转了负担变化，不能作为这处作者判断。\n\n**命题人借用的原文材料：**\n\n> It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.","context":{"mode":"image","asset":"questi 年，仍明显超过通胀，所以作者追问凭什么涨。\n\n把这一处放回全文，它承担的写作任务是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> This year’s fare increase relieves the financial pressure on train operators.\n>\n> 今年涨价减轻了铁路运营商的财务压力。\n\n这需要作者给出运营商成本、亏损或涨价后的收支变化。实际extra burden落在依赖铁路的乘客身上，无法把乘客负担转成运营商压力缓解的证据。","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"21","option":"A"},"focusId":"focus-q21-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-A-0\">\u003cblockquote>\n\u003cp>将减轻火车运营商的负担\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 train operators’ burden 与第1段 extra burden 都谈负担，所以回看 imposing a significant extra burden 后面的on those，确认负担落在运营商还是只能乘火车的人身上。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 extra burden 后面接的是别无选择、必须坐火车通勤的人，涨价让这些乘客多付钱。A的 train operators’ burden 则把负担的承受者换成运营商，并把增加改成ease所说的减轻。题干要作者对今年涨价的判断，原文写乘客因涨价更沉重，A却写企业从涨价中得到缓解，人物和动作方向都变了。\u003c/p>\n\u003cp>原文评价的对象是乘客多付的钱，A换成运营商并反转了负担变化，不能作为这处作者判断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>今年列车票价上涨将减轻火车运营商的负担。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 train operators’ burden 与第1段 extra burden 都谈负担，所以回看 imposing a significant extra burden 后面的on those，确认负担落在运营商还是只能乘火车的人身上。\u003c/p>\n\u003cp>原文 extra burden 后面接的是别无选择、必须坐火车通勤的人，涨价让这些乘客多付钱。A的 train operators’ burden 则把负担的承受者换成运营商，并把增加改成ease所说的减轻。题干要作者对今年涨价的判断，原文写乘客因涨价更沉重，A却写企业从涨价中得到缓解，人物和动作方向都变了。\u003c/p>\n\u003cp>原文评价的对象是乘客多付的钱，A换成运营商并反转了负担变化，不能作为这处作者判断。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.\u003c/p>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>This year’s fare increase relieves the financial pressure on train operators.\u003c/p>\n\u003cp>今年涨价减轻了铁路运营商的财务压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要作者给出运营商成本、亏损或涨价后的收支变化。实际extra burden落在依赖铁路的乘客身上，无法把乘客负担转成运营商压力缓解的证据。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. will ease train operators’ burden","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Ever-rising Fares Aren’t Sustainable  \n> 不断上涨的票价难以持续\n\n把这个主旨直接代入21题题干：\n\n> 全文主旨质疑持续涨价能否维持，因此本题应检查今年涨价是否仍有合理性问题；但主旨本身不能确定今年涨幅、通胀差距或乘客是否意外，仍须核对首段。\n\n但A实际说的是：\n\n> will ease train operators’ burden  \n> 将减轻火车运营商的负担\n\n原文评价的对象是乘客多付的钱，A换成运营商并反转了负担变化，不能作为这处作者判断。\n\n从全文推进看，这一处的作用是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\n\n本项最终仍要根据“but it is still well above”这处局部原文判断。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"21","option":"A"},"focusId":"focus-q21-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-A-0\">\u003cblockquote>\n\u0 明显超过通胀。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>This year’s fare increase relieves the financial pressure on train operators.\u003c/p>\n\u003cp>今年涨价减轻了铁路运营商的财务压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要作者给出运营商成本、亏损或涨价后的收支变化。实际extra burden落在依赖铁路的乘客身上，无法把乘客负担转成运营商压力缓解的证据。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨质疑持续涨价能否维持，因此本题应检查今年涨价是否仍有合理性问题；但主旨本身不能确定今年涨幅、通胀差距或乘客是否意外，仍须核对首段。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>will ease train operators’ burden\u003cbr>将减轻火车运营商的负担\u003c/p>\n\u003c/blockquote>\n\u003cp>原文评价的对象是乘客多付的钱，A换成运营商并反转了负担变化，不能作为这处作者判断。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\u003c/p>\n\u003cp>本项最终仍要根据“but it is still well above”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. has kept pace with inflation","level":3,"raw":"### B. has kept pace with inflation\n\n> 与通货膨胀保持同步\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B的 kept pace with inflation 要与通胀比较，而第1段明确写 well above，因此回看 This year’s rise 后面比较今年、去年与官方CPI的那一句。\n\n**错误类型：第一类——歪曲原意。**\n\nB的 kept pace with inflation 是大致同步，而well above是明显高于。即使今年低于去年，也只是今年与去年之间的比较，不能因此把今年相对于通胀的“明显超过”改成“同步”。\n\n两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\n\n**命题人借用的原文材料：**\n\n> This year's rise, an average of 2.7 per cent, may be a fraction lower than last year's, but it is still well above the official Consumer Price Index (CPI) measure of inflation.","context":{"mode":"image","asset":"questions","focus":[250,430,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"21","option":"B"},"focusId":"focus-q21-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-B-0\">\u003cblockquote>\n\u003cp>与通货膨胀保持同步\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 kept pace with inflation 要与通胀比较，而第1段明确写 well above，因此回看 This year’s rise 后面比较今年、去年与官方CPI的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>B的 kept pace with inflation 是大致同步，而well above是明显高于。即使今年低于去年，也只是今年与去年之间的比较，不能因此把今年相对于通胀的“明显超过”改成“同步”。\u003c/p>\n\u003cp>两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. has kept pace with inflation","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 今年列车票价上涨与通货膨胀保持同步。\n\nB的 kept pace with inflation 要与通胀比较，而第1段明确写 well above，因此回看 This year’s rise 后面比较今年、去年与官方CPI的那一句。\n\nB的 kept pace with inflation 是大致同步，而well above是明显高于。即使今年低于去年，也只是今年与去年之间的比较，不能因此把今年相对于通胀的“明显超过”改成“同步”。\n\n两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\n\n首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\n\nmatches要求两种涨幅基本相等；原文well above却说票价明显高于CPI。略低于去年比较的是两年的票价涨幅，不能拿它冲淡票价与通胀的差距。","context":{"mode":"image","asset":"questions","focus":[250,430,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"21","option":"B"},"focusId":"focus-q21-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-B-0\">\u003cblockquote>\n\u003cp>与通货膨胀保持同步\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong>
