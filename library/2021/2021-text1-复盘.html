er\u003c/td>\n\u003ctd>phr.迅速地\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>How can the train operators possibly justify yet another increase to rail passenger fares? It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise. This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>How can the train operators / possibly justify / yet another increase / to rail passenger fares?\u003c/p>\n\u003cp>It has become / a grimly reliable annual ritual: / every January / the cost of travelling by train rises, / imposing a significant extra burden / on those / who have no option / but to use the rail network / to get to work or otherwise.\u003c/p>\n\u003cp>This year&#39;s rise, / an average of 2.7 per cent, / may be a fraction lower / than last year&#39;s, / but it is still well above / the official Consumer Price Index (CPI) / measure of inflation.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>火车运营商怎么能 / 可能证明合理 / 又一次增加 / 铁路乘客票价？\u003c/p>\n\u003cp>它已经成为 / 一个严峻可靠的年度惯例：/ 每年一月 / 乘火车旅行的费用上涨，/ 施加了显著的额外负担 / 给那些人 / 他们别无选择 / 只能使用铁路网络 / 去上班或其他用途。\u003c/p>\n\u003cp>今年的涨幅，/ 平均2.7%，/ 可能略低一点 / 比去年的，/ 但它仍然远高于 / 官方消费者价格指数（CPI）/ 通货膨胀衡量标准。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>火车运营商怎么可能为铁路乘客票价的又一次上涨辩护？这已经成为一个令人沮丧但可靠的年度惯例：每年一月，乘火车的费用都会上涨，给那些别无选择只能依靠铁路网络上班或出行的人带来了显著的额外负担。今年平均2.7%的涨幅虽然可能比去年略低一点，但仍然远高于官方消费者价格指数（CPI）的通货膨胀率。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer. Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey? Equally, there is a sense that the travails of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor infrastructure of the Midlands and the North.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Successive governments / have permitted such increases / on the grounds / that the cost of investing in / and running the rail network / should be borne by / those who use it, / rather than the general taxpayer.\u003c/p>\n\u003cp>Why, / the argument goes, / should a car-driving pensioner / from Lincolnshire / have to subsidise / the daily commute / of a stockbroker from Surrey?\u003c/p>\n\u003cp>Equally, / there is a sense / that the travails of commuters / in the South East, / many of whom will face / among the biggest rises, / have received too much attention / compared to those / who must endure / the relatively poor infrastructure / of the Midlands and the North.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>历届政府 / 已经允许这样的增长 / 基于这个理由 / 投资的成本 / 和运营铁路网络 / 应该由承担 / 使用它的人，/ 而不是一般纳税人。\u003c/p>\n\u003cp>为什么，/ 这个论点说，/ 一个开车的养老金领取者 / 来自林肯郡的 / 必须补贴 / 每日通勤 / 一个来自萨里的股票经纪人的？\u003c/p>\n\u003cp>同样地，/ 有一种感觉 / 通勤者的困境 / 在东南部的，/ 他们中的许多人将面临 / 最大涨幅之一，/ 已经获得了太多关注 / 相比于那些人 / 他们必须忍受 / 相对较差的基础设施 / 中部和北部的。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>历届政府都允许这样的涨价，理由是投资和运营铁路网络的成本应该由使用者承担，而不是一般纳税人。这个论点认为：为什么林肯郡一个开车的养老金领取者要补贴萨里股票经纪人的每日通勤？同样，人们感觉东南部通勤者的困境（他们中许多人将面临最大幅度的涨价）获得了太多关注，相比之下，中部和北部地区的人们必须忍受相对较差的基础设施。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years. It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel. The responsibility for the latest wave of strikes rests on the unions. However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>However, / over the past 12 months, / those commuters / have also experienced / some of the worst rail strikes / in years.\u003c/p>\n\u003cp>It is all very well / train operators trumpeting / the improvements / they are making to the network, / but passengers should be able to expect / a basic level of service / for the substantial sums / they are now paying to travel.\u003c/p>\n\u003cp>The responsibility / for the latest wave of strikes / rests on the unions.\u003c/p>\n\u003cp>However, / there is a strong case / that those / who have been worst affected / by industrial action / should receive compensation / for the disruption / they have suffered.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>然而，/ 在过去的12个月里，/ 这些通勤者 / 也经历了 / 一些最严重的铁路罢工 / 多年来的。\u003c/p>\n\u003cp>这都很好 / 火车运营商吹嘘 / 改进 / 他们正在对网络进行的，/ 但乘客应该能够期待 / 基本水平的服务 / 为了可观的金额 / 他们现在支付的旅行费用。\u003c/p>\n\u003cp>责任 / 最近一波罢工的 / 在于工会。\u003c/p>\n\u003cp>然而，/ 有一个强有力的理由 / 那些人 / 受影响最严重的 / 被工业行动 / 应该得到补偿 / 为了干扰 / 他们所遭受的。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>然而，在过去的12个月里，这些通勤者还经历了多年来最严重的一些铁路罢工。火车运营商吹嘘他们对铁路网络的改进固然很好，但考虑到乘客现在支付的可观费用，他们应该能够期待基本水平的服务。最近一波罢工的责任在于工会。然而，有充分的理由认为，那些受工业行动影响最严重的人应该为他们所遭受的干扰获得补偿。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>The Government has pledged to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate. This should form part of a wider package of measures to address the long-running problems on Britain&#39;s railways. Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, punctuated by regular chaos when timetables are changed, or planned maintenance is managed incompetently. The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>The Government has pledged / to change the law / to introduce / a minimum service requirement / so that, / even when strikes occur, / services can continue to operate.\u003c/p>\n\u003cp>This should form part / of a wider package of measures / to address / the long-running problems / on Britain&#39;s railways.\u003c/p>\n\u003cp>Yes, / more investment is needed, / but passengers will not be willing / to pay more indefinitely / if they must also endure / cramped, unreliable services, / punctuated by regular chaos / when timetables are changed, / or planned maintenance / is managed incompetently.\u003c/p>\n\u003cp>The threat of nationalisation / may have been seen off / for now, / but it will return / with a vengeance / if the justified anger of passengers / is not addressed / in short order.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>政府已经承诺 / 改变法律 / 来引入 / 最低服务要求 / 以便，/ 即使罢工发生时，/ 服务可以继续运营。\u003c/p>\n\u003cp>这应该构成一部分 / 更广泛的措施包 / 来解决 / 长期存在的问题 / 在英国铁路上。\u003c/p>\n\u003cp>是的，/ 需要更多投资，/ 但乘客不会愿意 / 无限期地支付更多 / 如果他们还必须忍受 / 拥挤、不可靠的服务，/ 被定期混乱打断 / 当时间表被更改时，/ 或计划维护 / 被管理得无能。\u003c/p>\n\u003cp>国有化的威胁 / 可能已经被击退 / 目前，/ 但它将返回 / 猛烈地 / 如果乘客的正当愤怒 / 没有被解决 / 在短期内。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>政府已承诺修改法律，引入最低服务要求，以便即使在罢工期间，服务也能继续运营。这应该成为解决英国铁路长期问题的更广泛措施的一部分。是的，需要更多投资，但如果乘客还必须忍受拥挤、不可靠的服务，以及时间表更改或计划维护管理不善造成的定期混乱，他们不会愿意无限期地支付更多费用。国有化的威胁可能暂时被击退了，但如果不尽快解决乘客的正当愤怒，它将猛烈地卷土重来。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>How can the train operators → possibly justify → yet another increase：(to rail passenger fares)?\u003c/p>\n\u003cp>It has become → a grimly reliable annual ritual：every January → the cost of travelling by train rises → imposing a significant extra burden：(on those：(who have no option → but to use the rail network：(to get to work or otherwise))).\u003c/p>\n\u003cp>This year&#39;s rise：(an average of 2.7 per cent) → may be a fraction lower：(than last year&#39;s) // but it is still well above → the official Consumer Price Index (CPI)：(measure of inflation).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Successive governments → have permitted such increases：(on the grounds：(that the cost：(of investing in + running the rail network) → should be borne by → those who use it // rather than the general taxpayer)).\u003c/p>\n\u003cp>Why：(the argument goes) → should a car-driving pensioner：(from Lincolnshire) → have to subsidise → the daily commute：(of a stockbroker from Surrey)?\u003c/p>\n\u003cp>Equally → there is a sense：(that the travails of commuters：(in the South East)：(many of whom will face → among the biggest rises) → have received too much attention：(compared to those：(who must endure → the relatively poor infrastructure：(of the Midlands and the North)))).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>However → over the past 12 months → those commuters → have also experienced → some of the worst rail strikes：(in years).\u003c/p>\n\u003cp>It is all very well：(train operators trumpeting → the improvements：(they are making to the network)) // but passengers should be able to expect → a basic level of service：(for the substantial sums：(they are now paying to travel)).\u003c/p>\n\u003cp>The responsibility：(for the latest wave of strikes) → rests on the unions.\u003c/p>\n\u003cp>However → there is a strong case：(that those：(who have been worst affected：(by industrial action)) → should receive compensation：(for the disruption：(they have suffered))).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>The Government has pledged → to change the law → to introduce → a minimum service requirement：(so that：(even when strikes occur) → services can continue to operate).\u003c/p>\n\u003cp>This should form part：(of a wider package of measures) → to address → the long-running problems：(on Britain&#39;s railways).\u003c/p>\n\u003cp>Yes → more investment is needed // but passengers will not be willing → to pay more indefinitely：(if they must also endure → cramped, unreliable services：(punctuated by regular chaos：(when timetables are changed // or planned maintenance → is managed incompetently))).\u003c/p>\n\u003cp>The threat of nationalisation → may have been seen off：(for now) // but it will return：(with a vengeance)：(if the justified anger of passengers → is not addressed：(in short order)).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>火车运营商怎么能 → 可能证明合理 → 又一次增加：(铁路乘客票价)？\u003c/p>\n\u003cp>它已经成为 → 一个严峻可靠的年度惯例：每年一月 → 乘火车旅行的费用上涨 → 施加了显著的额外负担：(给那些人：(他们别无选择 → 只能使用铁路网络：(去上班或其他用途)))。\u003c/p>\n\u003cp>今年的涨幅：(平均2.7%) → 可能略低一点：(比去年的) // 但它仍然远高于 → 官方消费者价格指数（CPI）：(通货膨胀衡量标准)。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>历届政府 → 已经允许这样的增长：(基于这个理由：(成本：(投资 + 运营铁路网络) → 应该由承担 → 使用它的人 // 而不是一般纳税人))。\u003c/p>\n\u003cp>为什么：(这个论点说) → 一个开车的养老金领取者：(来自林肯郡的) → 必须补贴 → 每日通勤：(一个来自萨里的股票经纪人的)？\u003c/p>\n\u003cp>同样地 → 有一种感觉：(通勤者的困境：(在东南部的)：(他们中的许多人将面临 → 最大涨幅之一) → 已经获得了太多关注：(相比于那些人：(他们必须忍受 → 相对较差的基础设施：(中部和北部的))))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>然而 → 在过去的12个月里 → 这些通勤者 → 也经历了 → 一些最严重的铁路罢工：(多年来的)。\u003c/p>\n\u003cp>这都很好：(火车运营商吹嘘 → 改进：(他们正在对网络进行的)) // 但乘客应该能够期待 → 基本水平的服务：(为了可观的金额：(他们现在支付的旅行费用))。\u003c/p>\n\u003cp>责任：(最近一波罢工的) → 在于工会。\u003c/p>\n\u003cp>然而 → 有一个强有力的理由：(那些人：(受影响最严重的：(被工业行动)) → 应该得到补偿：(为了干扰：(他们所遭受的)))。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>政府已经承诺 → 改变法律 → 来引入 → 最低服务要求：(以便：(即使罢工发生时) → 服务可以继续运营)。\u003c/p>\n\u003cp>这应该构成一部分：(更广泛的措施包) → 来解决 → 长期存在的问题：(在英国铁路上)。\u003c/p>\n\u003cp>是的 → 需要更多投资 // 但乘客不会愿意 → 无限期地支付更多：(如果他们还必须忍受 → 拥挤、不可靠的服务：(被定期混乱打断：(当时间表被更改时 // 或计划维护 → 被管理得无能)))。\u003c/p>\n\u003cp>国有化的威胁 → 可能已经被击退：(目前) // 但它将返回：(猛烈地)：(如果乘客的正当愤怒 → 没有被解决：(在短期内))。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第1段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>It has become / a grimly reliable annual ritual: / every January / the cost of travelling by train rises, / imposing a significant extra burden / on those / who have no option / but to use the rail network / to get to work or otherwise.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>它已经成为 / 一个严峻可靠的年度惯例：/ 每年一月 / 乘火车旅行的费用上涨，/ 施加了显著的额外负担 / 给那些人 / 他们别无选择 / 只能使用铁路网络 / 去上班或其他用途。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把冒号前的判断译完整：\u003c/p>\n\u003cblockquote>\n\u003cp>这已经成了每年准时上演、却让人无奈的惯例\u003c/p>\n\u003c/blockquote>\n\u003cp>再将涨价及其承受者连起来：\u003c/p>\n\u003cblockquote>\n\u003cp>每年一月火车票价都会上涨，让那些除了乘火车以外别无选择的上班族或其他出行者增加一笔沉重负担\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>这已经成了每年准时上演、却让人无奈的惯例；每年一月火车票价都会上涨，让那些除了乘火车以外别无选择的上班族或其他出行者增加一笔沉重负担。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>惯例是：票价上涨，给乘客增加负担。\u003c/p>\n\u003c/blockquote>\n\u003cp>冒号不是另起一个无关事实，而是在解释ritual究竟是什么。imposing的逻辑主语是前面的涨价事实，译成结果；who从句只限定those这一人群，放在“乘客”之前。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>这已成为每年准时上演却令人无奈的惯例：每逢一月，火车票价就会上涨，给那些上班或因其他事由出行而不得不依靠铁路的人增加沉重的负担。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>grimly不是票价涨得“阴森”，而是说这项年年发生的惯例令人沮丧；reliable在这里带有讽刺，译为“准时上演”。\u003c/p>\n\u003cp>no option but to use强调无从避开这笔成本，不能弱化成一般乘客。or otherwise把用途扩展到上班以外的出行。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>这已经成为一个令人沮丧但可靠的年度惯例：每年一月，乘火车的费用都会上涨，给那些别无选择只能依靠铁路网络上班或出行的人带来了显著的额外负担。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第2段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Equally, there is a sense that the travails of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor infrastructure of the Midlands and the North.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Equally, / there is a sense / that the travails of commuters / in the South East, / many of whom will face / among the biggest rises, / have received too much attention / compared to those / who must endure / the relatively poor infrastructure / of the Midlands and the North.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>同样地，/ 有一种感觉 / 通勤者的困境 / 在东南部的，/ 他们中的许多人将面临 / 最大涨幅之一，/ 已经获得了太多关注 / 相比于那些人 / 他们必须忍受 / 相对较差的基础设施 / 中部和北部的。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并“有一种看法”及其议论对象：\u003c/p>\n\u003cblockquote>\n\u003cp>同样，也有人觉得英格兰东南部通勤者的困境受到了过多关注，其中许多人将面对幅度最大的涨价\u003c/p>\n\u003c/blockquote>\n\u003cp>再补上衡量关注多少的比较对象：\u003c/p>\n\u003cblockquote>\n\u003cp>相比之下，中部和北部的乘客却必须忍受相对落后的基础设施\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>同样，也有人觉得英格兰东南部通勤者的困境受到了过多关注，其中许多人将面对幅度最大的涨价；相比之下，中部和北部的乘客却必须忍受相对落后的基础设施。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>人们觉得，东南部通勤者受到的关注过多。\u003c/p>\n\u003c/blockquote>\n\u003cp>主干是there is a sense that，that之后才是看法内容。many of whom是对通勤者的插入补充，译成独立小分句；compared to后面的those也是乘客，比较的是两地乘客受到的关注，不是把困境与人比较。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>同样，有人觉得，与必须忍受中部和北部相对落后基础设施的乘客相比，东南部通勤者的困境受到了过多关注，其中不少人将面临最高之列的涨价幅度。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>travails译为“艰辛”或“困境”，与面临涨价相连；among the biggest保留“最高之列”，不扩大成人人面临唯一最高涨幅。\u003c/p>\n\u003cp>poor infrastructure是基础设施较差；全文中的区域对照不能译成北方乘客的道德或经济品质较差。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>同样，人们感觉东南部通勤者的困境（他们中许多人将面临最大幅度的涨价）获得了太多关注，相比之下，中部和北部地区的人们必须忍受相对较差的基础设施。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, punctuated by regular chaos when timetables are changed, or planned maintenance is managed incompetently.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Yes, / more investment is needed, / but passengers will not be willing / to pay more indefinitely / if they must also endure / cramped, unreliable services, / punctuated by regular chaos / when timetables are changed, / or planned maintenance / is managed incompetently.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>是的，/ 需要更多投资，/ 但乘客不会愿意 / 无限期地支付更多 / 如果他们还必须忍受 / 拥挤、不可靠的服务，/ 被定期混乱打断 / 当时间表被更改时，/ 或计划维护 / 被管理得无能。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把承认与转折合并：\u003c/p>\n\u003cblockquote>\n\u003cp>确实需要更多投资，但乘客不会愿意无休止地多付钱\u003c/p>\n\u003c/blockquote>\n\u003cp>再把条件及服务问题连成一组：\u003c/p>\n\u003cblockquote>\n\u003cp>如果他们还得忍受拥挤、不可靠的服务，而且调整时刻表或维修管理不善时又经常出现混乱\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>确实需要更多投资，但乘客不会愿意无休止地多付钱；如果他们还得忍受拥挤、不可靠的服务，而且调整时刻表或维修管理不善时又经常出现混乱。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>需要投资，但在服务如此糟糕的情况下，乘客不会一直多付钱。\u003c/p>\n\u003c/blockquote>\n\u003cp>Yes与but构成让步后转折，重点落在will not be willing。if从句说明乘客不愿继续付款的条件；punctuated修饰services，when说明混乱发生的具体场景。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>确实需要更多投资，但如果乘客还得忍受拥挤、不可靠的服务，并在调整时刻表或维修管理不善时经常遭遇混乱，他们就不会愿意无休止地多付钱。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>indefinitely修饰持续多付钱的时间，译为“无休止地”，不能误成乘客对付款数额心里没数。\u003c/p>\n\u003cp>punctuated by regular chaos不是标点意义，而是服务中反复夹杂混乱；把两个when场景并列，保留时刻表变更与维修管理不善。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>是的，需要更多投资，但如果乘客还必须忍受拥挤、不可靠的服务，以及时间表更改或计划维护管理不善造成的定期混乱，他们不会愿意无限期地支付更多费用。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>25题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下列哪一项最适合做这篇文章的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Ever-rising Fares Aren’t Sustainable\u003c/strong>\u003c/p>\n\u003cp>不断上涨的票价难以持续\u003c/p>\n\u003cp>B. \u003cstrong>Who Are to Blame for the Strikes?\u003c/strong>\u003c/p>\n\u003cp>罢工应该归咎于谁？\u003c/p>\n\u003cp>C. \u003cstrong>Constant Complaining Doesn’t Work\u003c/strong>\u003c/p>\n\u003cp>不停抱怨并不起作用\u003c/p>\n\u003cp>D. \u003cstrong>Can Nationalisation Bring Hope?\u003c/strong>\u003c/p>\n\u003cp>国有化能带来希望吗？\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\u003c/td>\n\u003ctd>先说xxx继续这样没道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。\u003c/td>\n\u003ctd>再说支持xxx的人怎么解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。\u003c/td>\n\u003ctd>但话说回来实际并没有做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\u003c/td>\n\u003ctd>最后说不改好会有更大麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>A. Ever-rising Fares Aren’t Sustainable\u003c/h3>\n\u003cp>不断上涨的票价难以持续\u003c/p>\n\u003ch4>如果 A 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>不断上涨的票价难以持续\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从新一轮票价涨幅仍超过通胀写起，提出持续向通勤者加价是否还有合理基础。\u003c/td>\n\u003ctd>先说xxx继续这样没道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释支持涨价者的使用者付费逻辑，并说明其为何认为非乘客不应补贴通勤成本。\u003c/td>\n\u003ctd>再说支持xxx的人怎么解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>转到严重罢工和基本服务欠账，检验付费理由是否在现实服务中得到兑现。\u003c/td>\n\u003ctd>但话说回来实际并没有做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>提出服务改革与补偿方向，指出若仍不解决不满，持续涨价将引来所有权层面的更大压力。\u003c/td>\n\u003ctd>最后说不改好会有更大麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A可以把每段的动作接起来。第1段问又一次涨价如何justify，第2段摆出成本由使用者承担的理由，第3段的However再把严重罢工和基本服务摆到这些理由面前，第4段直接说乘客在服务不可靠时不会愿意继续多付。A中的Aren’t Sustainable说这种不断上涨的做法难以持续，并不等于否认铁路需要任何投资；作者明说more investment is needed，问题在于不能只要求乘客加钱，却不处理服务与愤怒。国有化威胁正是这种矛盾继续下去的后果。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>B. Who Are to Blame for the Strikes?\u003c/h3>\n\u003cp>罢工应该归咎于谁？\u003c/p>\n\u003ch4>如果 B 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>罢工应该归咎于谁？\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以又一轮铁路罢工引发出行损失开篇，说明责任推诿继续下去无法接受。\u003c/td>\n\u003ctd>先说xxx继续这样没道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>让工会、运营商和政府分别陈述对罢工原因及责任归属的解释。\u003c/td>\n\u003ctd>再说支持xxx的人怎么解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>核对各方实际履约与谈判行为，指出已有辩护无法解释哪些服务中断。\u003c/td>\n\u003ctd>但话说回来实际并没有做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明不厘清责任并改进劳资协调，未来罢工将进一步破坏铁路体系的公众信任。\u003c/td>\n\u003ctd>最后说不改好会有更大麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第3段确实有The responsibility...rests on the unions，工会承担最新罢工责任这一点非常明确。但前两段大部分内容与“谁造成罢工”无关：票价年年上涨、今年高于通胀、使用者承担成本，都是围绕付费合理性展开。作者指明工会责任后马上又要求受影响乘客得到补偿，末段回到服务、投资和多付钱的条件。因此罢工是服务未达到期待的一部分，不是全文要反复追查的中心问题。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>C. Constant Complaining Doesn’t Work\u003c/h3>\n\u003cp>不停抱怨并不起作用\u003c/p>\n\u003ch4>如果 C 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>不停抱怨并不起作用\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从乘客年复一年投诉却仍遭涨价和中断的现象切入，提出单靠抱怨不足以解决问题。\u003c/td>\n\u003ctd>先说xxx继续这样没道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>介绍相信投诉有效的一方如何解释舆论、客服和乘客组织可以推动改进。\u003c/td>\n\u003ctd>再说支持xxx的人怎么解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>检验这些投诉渠道的实际效果，展示反复表达不满后服务仍未改善的落差。\u003c/td>\n\u003ctd>但话说回来实际并没有做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>提出比抱怨更有约束力的行动或制度渠道，并说明继续只抱怨会使问题恶化。\u003c/td>\n\u003ctd>最后说不改好会有更大麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C把Constant Complaining作为需要否定的行为，但原文开头并没有责备乘客抱怨，而是替乘客质问运营商为何再次涨价。末段又用justified anger把愤怒说成有理由的，要求及时处理；中间还主张受影响乘客应得到补偿。第2段对某些通勤者受到关注的说法只是被摆出的一个角度，后面的However把讨论重新带回他们确实遭受的服务问题。全文并没有用“抱怨没用”来否定乘客的要求。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>D. Can Nationalisation Bring Hope?\u003c/h3>\n\u003cp>国有化能带来希望吗？\u003c/p>\n\u003ch4>如果 D 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>国有化能带来希望吗？\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>以现有铁路所有权安排下反复出现的涨价和服务问题开篇，提出继续维持是否合理。\u003c/td>\n\u003ctd>先说xxx继续这样没道理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>介绍国有化支持者如何解释公共所有权能改变成本、投资和服务目标。\u003c/td>\n\u003ctd>再说支持xxx的人怎么解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>回到已有公共管理经验，检查国有化承诺是否真正解决效率和服务欠账。\u003c/td>\n\u003ctd>但话说回来实际并没有做好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>讨论国有化要带来希望还需哪些治理改革，以及不配套改革可能留下的新风险。\u003c/td>\n\u003ctd>最后说不改好会有更大麻烦\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D抓住第4段末尾的nationalisation，但文章把它称为threat，是现有运营安排若不及时处理乘客愤怒可能再次面对的后果。正文没有比较国有铁路和其他所有权安排的运营成绩，也没有说明国有化如何出资、怎样解决罢工。前三段展开的是乘客为什么不断被要求多付钱，以及基本服务是否做到；最后才用所有权可能改变加重警告。一个结尾的条件后果，不能替换前三段持续展开的票价与服务问题。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>25题结论\u003c/h3>\n\u003cp>\u003cstrong>25. A. Ever-rising Fares Aren’t Sustainable\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Ever-rising Fares Aren’t Sustainable / 不断上涨的票价难以持续\u003c/strong>\u003c/p>\n\u003ch2>21题\u003c/h2>\n\u003cblockquote>\n\u003cp>The author holds that this year’s increase in rail passenger fares ______.\u003cbr>作者认为，今年铁路乘客票价上涨怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>作者评价题。题干要求判断“作者认为，今年铁路乘客票价上涨怎么样？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>How can Britain’s train operators possibly justify yet another increase to rail passenger fares? It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise. This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003c/blockquote>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003ch3>A. will ease train operators’ burden\u003c/h3>\n\u003cblockquote>\n\u003cp>将减轻火车运营商的负担\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 train operators’ burden 与第1段 extra burden 都谈负担，所以回看 imposing a significant extra burden 后面的on those，确认负担落在运营商还是只能乘火车的人身上。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 extra burden 后面接的是别无选择、必须坐火车通勤的人，涨价让这些乘客多付钱。A的 train operators’ burden 则把负担的承受者换成运营商，并把增加改成ease所说的减轻。题干要作者对今年涨价的判断，原文写乘客因涨价更沉重，A却写企业从涨价中得到缓解，人物和动作方向都变了。\u003c/p>\n\u003cp>原文评价的对象是乘客多付的钱，A换成运营商并反转了负担变化，不能作为这处作者判断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>今年列车票价上涨将减轻火车运营商的负担。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 train operators’ burden 与第1段 extra burden 都谈负担，所以回看 imposing a significant extra burden 后面的on those，确认负担落在运营商还是只能乘火车的人身上。\u003c/p>\n\u003cp>原文 extra burden 后面接的是别无选择、必须坐火车通勤的人，涨价让这些乘客多付钱。A的 train operators’ burden 则把负担的承受者换成运营商，并把增加改成ease所说的减轻。题干要作者对今年涨价的判断，原文写乘客因涨价更沉重，A却写企业从涨价中得到缓解，人物和动作方向都变了。\u003c/p>\n\u003cp>原文评价的对象是乘客多付的钱，A换成运营商并反转了负担变化，不能作为这处作者判断。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.\u003c/p>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>This year’s fare increase relieves the financial pressure on train operators.\u003c/p>\n\u003cp>今年涨价减轻了铁路运营商的财务压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要作者给出运营商成本、亏损或涨价后的收支变化。实际extra burden落在依赖铁路的乘客身上，无法把乘客负担转成运营商压力缓解的证据。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨质疑持续涨价能否维持，因此本题应检查今年涨价是否仍有合理性问题；但主旨本身不能确定今年涨幅、通胀差距或乘客是否意外，仍须核对首段。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>will ease train operators’ burden\u003cbr>将减轻火车运营商的负担\u003c/p>\n\u003c/blockquote>\n\u003cp>原文评价的对象是乘客多付的钱，A换成运营商并反转了负担变化，不能作为这处作者判断。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\u003c/p>\n\u003cp>本项最终仍要根据“but it is still well above”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. has kept pace with inflation\u003c/h3>\n\u003cblockquote>\n\u003cp>与通货膨胀保持同步\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 kept pace with inflation 要与通胀比较，而第1段明确写 well above，因此回看 This year’s rise 后面比较今年、去年与官方CPI的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>B的 kept pace with inflation 是大致同步，而well above是明显高于。即使今年低于去年，也只是今年与去年之间的比较，不能因此把今年相对于通胀的“明显超过”改成“同步”。\u003c/p>\n\u003cp>两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>今年列车票价上涨与通货膨胀保持同步。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 kept pace with inflation 要与通胀比较，而第1段明确写 well above，因此回看 This year’s rise 后面比较今年、去年与官方CPI的那一句。\u003c/p>\n\u003cp>B的 kept pace with inflation 是大致同步，而well above是明显高于。即使今年低于去年，也只是今年与去年之间的比较，不能因此把今年相对于通胀的“明显超过”改成“同步”。\u003c/p>\n\u003cp>两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\u003c/p>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003cp>matches要求两种涨幅基本相等；原文well above却说票价明显高于CPI。略低于去年比较的是两年的票价涨幅，不能拿它冲淡票价与通胀的差距。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The fare increase simply matches the rise in consumer prices.\u003c/p>\n\u003cp>票价涨幅只是与消费价格涨幅相当。\u003c/p>\n\u003c/blockquote>\n\u003cp>matches要求两种涨幅基本相等；原文well above却说票价明显高于CPI。略低于去年比较的是两年的票价涨幅，不能拿它冲淡票价与通胀的差距。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨质疑持续涨价能否维持，因此本题应检查今年涨价是否仍有合理性问题；但主旨本身不能确定今年涨幅、通胀差距或乘客是否意外，仍须核对首段。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>has kept pace with inflation\u003cbr>与通货膨胀保持同步\u003c/p>\n\u003c/blockquote>\n\u003cp>两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\u003c/p>\n\u003cp>本项最终仍要根据“but it is still well above”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. is a big surprise to commuters\u003c/h3>\n\u003cblockquote>\n\u003cp>令通勤者非常意外\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 a big surprise 要找意外感，第1段却写 every January，二者都涉及人们是否能预料涨价，所以回看年度涨价和乘客负担相连的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文 every January 明确说每年一月都会涨价，前面还用reliable annual描述这种年年出现的情况。C的 a big surprise 却把今年涨价说成难以预料的意外。作者提出质问，是在问反复涨价是否有道理，不是在说乘客从来没见过涨价；不满意一种反复发生的事，也不等于这件事突然出现令人惊讶。\u003c/p>\n\u003cp>原文强调反复出现和额外负担，C强调意外，两种反应不能互换。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>今年列车票价上涨令通勤者非常意外。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 a big surprise 要找意外感，第1段却写 every January，二者都涉及人们是否能预料涨价，所以回看年度涨价和乘客负担相连的那一句。\u003c/p>\n\u003cp>原文 every January 明确说每年一月都会涨价，前面还用reliable annual描述这种年年出现的情况。C的 a big surprise 却把今年涨价说成难以预料的意外。作者提出质问，是在问反复涨价是否有道理，不是在说乘客从来没见过涨价；不满意一种反复发生的事，也不等于这件事突然出现令人惊讶。\u003c/p>\n\u003cp>原文强调反复出现和额外负担，C强调意外，两种反应不能互换。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.\u003c/p>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Commuters were surprised by a fare increase they had not expected.\u003c/p>\n\u003cp>通勤者对未曾预料的票价上涨感到意外。\u003c/p>\n\u003c/blockquote>\n\u003cp>若是意外，作者应写涨价难以预料。grimly reliable annual ritual却强调年年准时发生；令人不满与出乎意料不是同一种反应。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨质疑持续涨价能否维持，因此本题应检查今年涨价是否仍有合理性问题；但主旨本身不能确定今年涨幅、通胀差距或乘客是否意外，仍须核对首段。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>is a big surprise to commuters\u003cbr>令通勤者非常意外\u003c/p>\n\u003c/blockquote>\n\u003cp>原文强调反复出现和额外负担，C强调意外，两种反应不能互换。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\u003c/p>\n\u003cp>本项最终仍要根据“but it is still well above”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. remains an unreasonable measure\u003c/h3>\n\u003cblockquote>\n\u003cp>仍然是一项不合理的措施\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“remains an [xxx] measure”，保留了相应遮挡。当时的定位线索是：D的 remains 保留“即使有变化也仍如此”的意思，第1段but it is still也有这个转折，所以回看今年涨幅和CPI的比较，并接上开头justify提出的质问。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>unreasonable是“不合理的”，remains保留“仍然”的判断。作者先用justify质问再次涨价，再以but it is still强调今年虽比去年略低、却仍高于通胀。D把让步之后没有改变的评价概括出来，既对准涨价措施，也保留转折后的重心。\u003c/p>\n\u003cp>需要比较的不是今年涨幅有没有下降，而是下降后是否已足以合理化乘客的额外负担。原文没有接受涨价理由，因此不能因a fraction lower而把作者态度改成赞同。D与全文要求改善服务后再谈持续付费的方向一致。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>How can Britain’s train operators possibly justify yet another increase to rail passenger fares?\u003c/p>\n\u003cp>This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>今年列车票价上涨仍然是一项不合理的措施。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 remains 保留“即使有变化也仍如此”的意思，第1段but it is still也有这个转折，所以回看今年涨幅和CPI的比较，并接上开头justify提出的质问。\u003c/p>\n\u003cp>unreasonable是“不合理的”，remains保留“仍然”的判断。作者先用justify质问再次涨价，再以but it is still强调今年虽比去年略低、却仍高于通胀。D把让步之后没有改变的评价概括出来，既对准涨价措施，也保留转折后的重心。\u003c/p>\n\u003cp>需要比较的不是今年涨幅有没有下降，而是下降后是否已足以合理化乘客的额外负担。原文没有接受涨价理由，因此不能因a fraction lower而把作者态度改成赞同。D与全文要求改善服务后再谈持续付费的方向一致。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>How can Britain’s train operators possibly justify yet another increase to rail passenger fares?\u003c/p>\n\u003cp>This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The annual increase remains difficult to justify, despite a slightly smaller rise this year.\u003c/p>\n\u003cp>尽管今年涨幅略低，年度涨价仍难以得到合理解释。\u003c/p>\n\u003c/blockquote>\n\u003cp>这保留了让步与转折的轻重：略低于去年只是让步，明显高于通胀和question mark才指向合理性。unreasonable概括作者的追问，并非否认铁路需要投入。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨质疑持续涨价能否维持，因此本题应检查今年涨价是否仍有合理性问题；但主旨本身不能确定今年涨幅、通胀差距或乘客是否意外，仍须核对首段。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>remains an unreasonable measure\u003cbr>仍然是一项不合理的措施\u003c/p>\n\u003c/blockquote>\n\u003cp>需要比较的不是今年涨幅有没有下降，而是下降后是否已足以合理化乘客的额外负担。原文没有接受涨价理由，因此不能因a fraction lower而把作者态度改成赞同。D与全文要求改善服务后再谈持续付费的方向一致。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\u003c/p>\n\u003cp>本项最终仍要根据“but it is still well above”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>21题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>21. D. remains an unreasonable measure\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文写乘客多负担，没有给出运营商因此减压的财务依据。\u003c/p>\n\u003cp>B：票价涨幅明显高于通胀，不是与通胀同步。\u003c/p>\n\u003cp>C：年年准时涨价是可预料的惯例，不能写成意外。\u003c/p>\n\u003cp>D：今年略少的涨幅没有消除其仍高于通胀的合理性质疑。\u003c/p>\n\u003ch2>22题\u003c/h2>\n\u003cblockquote>\n\u003cp>The stockbroker in Paragraph 2 is used to stand for ______.\u003cbr>第2段中的股票经纪人被用来代表哪一类人？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物举例作用题。题干要求判断“第2段中的股票经纪人被用来代表哪一类人？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer. Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey? Equally, there is a sense that the travails of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor infrastructure of the Midlands and the North.\u003c/p>\n\u003c/blockquote>\n\u003cp>政府以使用者而非普通纳税人承担铁路成本为理由，拿开车的林肯郡退休者与乘火车的萨里郡股票经纪人作对照。职业和居住地帮助塑造例子，决定分组的是是否使用铁路。\u003c/p>\n\u003ch3>A. car drivers\u003c/h3>\n\u003cblockquote>\n\u003cp>汽车驾驶者\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 car drivers 对应第2段 car-driving pensioner里的开车动作，所以回看Why开头的反问，确认开车的修饰语跟退休者还是股票经纪人相连。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文 car-driving pensioner 把开车明确放在来自林肯郡的退休者身上，另一边才是来自萨里郡的股票经纪人及其daily commute。A的 car drivers 把退休者的交通方式搬给了题干所问的股票经纪人。两个人在一个句子里出现，但分别承担前一句中的两类角色，不能把修饰其中一人的词贴给另一个人。\u003c/p>\n\u003cp>A取的是反问另一边那个人的交通方式，不能代表题干所问的股票经纪人。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的股票经纪人代表汽车驾驶者。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 car drivers 对应第2段 car-driving pensioner里的开车动作，所以回看Why开头的反问，确认开车的修饰语跟退休者还是股票经纪人相连。\u003c/p>\n\u003cp>原文 car-driving pensioner 把开车明确放在来自林肯郡的退休者身上，另一边才是来自萨里郡的股票经纪人及其daily commute。A的 car drivers 把退休者的交通方式搬给了题干所问的股票经纪人。两个人在一个句子里出现，但分别承担前一句中的两类角色，不能把修饰其中一人的词贴给另一个人。\u003c/p>\n\u003cp>A取的是反问另一边那个人的交通方式，不能代表题干所问的股票经纪人。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey?\u003c/p>\n\u003cp>政府以使用者而非普通纳税人承担铁路成本为理由，拿开车的林肯郡退休者与乘火车的萨里郡股票经纪人作对照。职业和居住地帮助塑造例子，决定分组的是是否使用铁路。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Surrey stockbroker illustrates people who drive rather than use the railway.\u003c/p>\n\u003cp>萨里郡股票经纪人代表开车而不乘铁路的人。\u003c/p>\n\u003c/blockquote>\n\u003cp>开车对应Lincolnshire pensioner，而股票经纪人承担rail commute。假设把两个人在对照中的身份调换，政府要求使用者付费的理由也就接不上。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认票价与乘客负担需要合理解释，不能单独判断股票经纪人在该例中代表哪类人；这一身份必须按例子前的成本分担关系确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>car drivers\u003cbr>汽车驾驶者\u003c/p>\n\u003c/blockquote>\n\u003cp>A取的是反问另一边那个人的交通方式，不能代表题干所问的股票经纪人。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。\u003c/p>\n\u003cp>本项最终仍要根据“those who use it”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. rail travellers\u003c/h3>\n\u003cblockquote>\n\u003cp>铁路乘客\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的 rail travellers 与第2段 those who use it指向同一类铁路使用者，所以把费用由谁承担的句子和stockbroker每日通勤的反问连着回看，确定这个例子接在哪一边。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>原文先把those who use it与general taxpayer对照，再让开车退休者与股票经纪人的daily commute对照。subsidise是“补贴”，问题在于不坐铁路的人为何要补贴坐铁路的人，而不是比较两个人的职业收入。\u003c/p>\n\u003cp>B的rail travellers提取的是股票经纪人在这个例子中的铁路使用者身份。使用者承担成本正是政府允许涨价的理由；选项概括例子的论证功能，没有要求我们靠生活常识猜股票经纪人怎样出行。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer.\u003c/p>\n\u003cp>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的股票经纪人代表铁路乘客。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 rail travellers 与第2段 those who use it指向同一类铁路使用者，所以把费用由谁承担的句子和stockbroker每日通勤的反问连着回看，确定这个例子接在哪一边。\u003c/p>\n\u003cp>原文先把those who use it与general taxpayer对照，再让开车退休者与股票经纪人的daily commute对照。subsidise是“补贴”，问题在于不坐铁路的人为何要补贴坐铁路的人，而不是比较两个人的职业收入。\u003c/p>\n\u003cp>B的rail travellers提取的是股票经纪人在这个例子中的铁路使用者身份。使用者承担成本正是政府允许涨价的理由；选项概括例子的论证功能，没有要求我们靠生活常识猜股票经纪人怎样出行。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer.\u003c/p>\n\u003cp>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey?\u003c/p>\n\u003cp>政府以使用者而非普通纳税人承担铁路成本为理由，拿开车的林肯郡退休者与乘火车的萨里郡股票经纪人作对照。职业和居住地帮助塑造例子，决定分组的是是否使用铁路。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The stockbroker represents commuters who use trains and therefore pay for the service.\u003c/p>\n\u003cp>股票经纪人代表使用铁路、因此被要求为服务付费的通勤者。\u003c/p>\n\u003c/blockquote>\n\u003cp>这里提取的是rail commute给出的身份，正与car-driving pensioner形成使用与不使用的对照。它保留例子功能，不把经纪人的收入或投资行为加进问题。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认票价与乘客负担需要合理解释，不能单独判断股票经纪人在该例中代表哪类人；这一身份必须按例子前的成本分担关系确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>rail travellers\u003cbr>铁路乘客\u003c/p>\n\u003c/blockquote>\n\u003cp>B的rail travellers提取的是股票经纪人在这个例子中的铁路使用者身份。使用者承担成本正是政府允许涨价的理由；选项概括例子的论证功能，没有要求我们靠生活常识猜股票经纪人怎样出行。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。\u003c/p>\n\u003cp>本项最终仍要根据“those who use it”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. local investors\u003c/h3>\n\u003cblockquote>\n\u003cp>当地投资者\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“local [xxx]”，保留了相应遮挡。当时的定位线索是：C的 local 说所在地，第2段的 from Surrey 也提供人物来自哪里，所以回看stockbroker所在反问，分清地点与这个例子代表的身份。读完全文后，做题模式再经交叉验证排除C，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>investors是“投资者”，stockbroker确实与投资职业有关，from Surrey也能给local提供表面联系。但题干问stand for，即作者拿这个人物代表哪一类人，而非要求把人物的职业重新归类。\u003c/p>\n\u003cp>原文在投资和运营成本由谁承担的问题上，划分的是使用者与普通纳税人。股票经纪人之所以进入例子，是因为他的铁路通勤会产生费用；段中没有他的投资行为或当地资本流动。C抓住职业与地点，漏掉例子的功能。\u003c/p>\n\u003c
