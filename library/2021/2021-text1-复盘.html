n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Passenger anger may lead to the collapse of railway operations.\u003c/p>\n\u003cp>乘客愤怒可能导致铁路运营崩溃。\u003c/p>\n\u003c/blockquote>\n\u003cp>不可靠服务和时刻表混乱是现有缺陷，国有化是所有权改变，均不等于整个系统停止运营。collapse把制度调整风险歪曲为更极端的经营终结。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认铁路不能一直忽视乘客不满，不能决定具体后果是所有权、收入、投资还是运营变化；需要末段明确写出的条件后果。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the collapse of operations\u003cbr>运营的崩溃\u003c/p>\n\u003c/blockquote>\n\u003cp>国有化改变铁路归谁所有，不等于铁路停止运营。minimum service还以罢工期间继续运行作目标；D把服务缺陷和所有权压力合并成运营终结，加入了原文没有作出的极端判断。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\u003c/p>\n\u003cp>本项最终仍要根据“The threat of nationalisation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"24题结论","level":2,"raw":"### 24题结论\n\n> **24. A. a change of ownership**\n\nA：国有化改变铁路归谁所有，概括成可能的所有权变化准确。\n\nB：末句给出国有化压力，没有给出收入下降这一后果。\n\nC：需要更多投资不等于投资者已经或将要撤资。\n\nD：所有权转移不等于运营崩溃，选项把后果极端化。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,451],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"question":"24","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>24. A. a change of ownership\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：国有化改变铁路归谁所有，概括成可能的所有权变化准确。\u003c/p>\n\u003cp>B：末句给出国有化压力，没有给出收入下降这一后果。\u003c/p>\n\u003cp>C：需要更多投资不等于投资者已经或将要撤资。\u003c/p>\n\u003cp>D：所有权转移不等于运营崩溃，选项把后果极端化。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：票价上涨的不合理性**（段落1问题提出） 质疑：火车运营商如何为又一次涨价辩护？→ 年度惯例：（每年一月涨价 → 给别无选择的通勤者带来负担）→ 具体数据：【今年涨幅2.7%（虽比去年略低）// 但仍远高于CPI通胀率】\n\n↓（官方理由）\n\n**逻辑层次2：政府的涨价理由与地区矛盾**（段落2官方立场） 政府立场：使用者承担成本 // 而非一般纳税人 → 举例论证：（林肯郡开车养老金领取者 vs 萨里股票经纪人）→ 地区不平衡：【东南部通勤者困境受关注过多 // 中北部基础设施差却被忽视】\n\n//（现实反驳）\n\n**逻辑层次3：服务质量与票价不匹配**（段落3服务问题） 现实困境：过去12个月经历多年来最严重罢工 → 核心矛盾：【运营商吹嘘改进 // 但乘客支付高额费用却得不到基本服务】→ 责任归属：（罢工责任在工会）+ 补偿诉求：（受影响最严重者应获补偿）\n\n↓（解决方案与警告）\n\n**逻辑层次4：改革措施与国有化威胁**（段落4未来展望） 政府措施：引入最低服务要求（罢工期间保证运营）→ 需要更广泛改革 → 乘客忍耐有限：【需要更多投资 // 但服务糟糕（拥挤+不可靠+混乱）乘客不会无限期付费】→ 最终警告：【国有化威胁暂时消除 // 但不解决乘客愤怒将猛烈回归】\n\n↑（全文主旨）\n\n全文核心观点：铁路票价持续上涨缺乏合理性，特别是在服务质量糟糕、罢工频发的情况下。如果不能及时解决乘客的正当不满，铁路系统可能面临国有化的命运。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：票价上涨的不合理性\u003c/strong>（段落1问题提出） 质疑：火车运营商如何为又一次涨价辩护？→ 年度惯例：（每年一月涨价 → 给别无选择的通勤者带来负担）→ 具体数据：【今年涨幅2.7%（虽比去年略低）// 但仍远高于CPI通胀率】\u003c/p>\n\u003cp>↓（官方理由）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：政府的涨价理由与地区矛盾\u003c/strong>（段落2官方立场） 政府立场：使用者承担成本 // 而非一般纳税人 → 举例论证：（林肯郡开车养老金领取者 vs 萨里股票经纪人）→ 地区不平衡：【东南部通勤者困境受关注过多 // 中北部基础设施差却被忽视】\u003c/p>\n\u003cp>//（现实反驳）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：服务质量与票价不匹配\u003c/strong>（段落3服务问题） 现实困境：过去12个月经历多年来最严重罢工 → 核心矛盾：【运营商吹嘘改进 // 但乘客支付高额费用却得不到基本服务】→ 责任归属：（罢工责任在工会）+ 补偿诉求：（受影响最严重者应获补偿）\u003c/p>\n\u003cp>↓（解决方案与警告）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：改革措施与国有化威胁\u003c/strong>（段落4未来展望） 政府措施：引入最低服务要求（罢工期间保证运营）→ 需要更广泛改革 → 乘客忍耐有限：【需要更多投资 // 但服务糟糕（拥挤+不可靠+混乱）乘客不会无限期付费】→ 最终警告：【国有化威胁暂时消除 // 但不解决乘客愤怒将猛烈回归】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：铁路票价持续上涨缺乏合理性，特别是在服务质量糟糕、罢工频发的情况下。如果不能及时解决乘客的正当不满，铁路系统可能面临国有化的命运。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n【答案】F. A Higher Price Needs a Better Service\n\n> 更高票价需要更好服务\n\n这一部分先承认今年涨幅可能略低，再把评价标准从年度数字转到额外付费实际买到的服务。\n\n先看作者为什么不接受“涨得比去年少”作为充分理由：\n\n> still be difficult to defend\n\nstill说明合理性疑问没有因涨幅略降而消失，后面的无替代路线进一步解释乘客为何无法避开这项开支。\n\n接着，作者明确更换比较的两端：\n\n> between the extra payment and the journey that payment buys\n\n不再只比较两年百分比，而是比较多付的钱与实际买到的旅程；论证中心从涨价幅度转向付费应得到的服务。\n\n结尾给出判断标准：\n\n> a service that passengers can actually depend on\n\n取消班次和拥挤都是可靠性不足的例子。depend on把“更好”具体化为日常可以依赖，而非运营商口头承诺。\n\n这一部分的推进关系是：\n\n> 涨幅略降仍不一定合理 → 乘客没有替代选择 → 比较额外付费与实际旅程 → 提价须配得上可靠服务\n\n标题的Higher Price对应extra payment与higher price；Better Service对应结尾可以depend on的服务。Needs把二者连成条件要求，覆盖段落从费用转到服务标准的完整论证。\n\n再看最强干扰项D：Making Every Journey Free。\n\nMaking Every Journey Free也谈票价，容易吸引只看乘客负担的读者。但文中没有取消收费的倡议，最后要求的是提价与可靠服务相伴；“多付的钱应买到什么”不能换成“所有人都不应付钱”。\n\n**41题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】F. A Higher Price Needs a Better Service\u003c/p>\n\u003cblockquote>\n\u003cp>更高票价需要更好服务\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分先承认今年涨幅可能略低，再把评价标准从年度数字转到额外付费实际买到的服务。\u003c/p>\n\u003cp>先看作者为什么不接受“涨得比去年少”作为充分理由：\u003c/p>\n\u003cblockquote>\n\u003cp>still be difficult to defend\u003c/p>\n\u003c/blockquote>\n\u003cp>still说明合理性疑问没有因涨幅略降而消失，后面的无替代路线进一步解释乘客为何无法避开这项开支。\u003c/p>\n\u003cp>接着，作者明确更换比较的两端：\u003c/p>\n\u003cblockquote>\n\u003cp>between the extra payment and the journey that payment buys\u003c/p>\n\u003c/blockquote>\n\u003cp>不再只比较两年百分比，而是比较多付的钱与实际买到的旅程；论证中心从涨价幅度转向付费应得到的服务。\u003c/p>\n\u003cp>结尾给出判断标准：\u003c/p>\n\u003cblockquote>\n\u003cp>a service that passengers can actually depend on\u003c/p>\n\u003c/blockquote>\n\u003cp>取消班次和拥挤都是可靠性不足的例子。depend on把“更好”具体化为日常可以依赖，而非运营商口头承诺。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>涨幅略降仍不一定合理 → 乘客没有替代选择 → 比较额外付费与实际旅程 → 提价须配得上可靠服务\u003c/p>\n\u003c/blockquote>\n\u003cp>标题的Higher Price对应extra payment与higher price；Better Service对应结尾可以depend on的服务。Needs把二者连成条件要求，覆盖段落从费用转到服务标准的完整论证。\u003c/p>\n\u003cp>再看最强干扰项D：Making Every Journey Free。\u003c/p>\n\u003cp>Making Every Journey Free也谈票价，容易吸引只看乘客负担的读者。但文中没有取消收费的倡议，最后要求的是提价与可靠服务相伴；“多付的钱应买到什么”不能换成“所有人都不应付钱”。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】C. Looking Beyond the Individual Ticket Holder\n\n> 将眼光放到购票乘客之外\n\n这一部分承认乘客应分担，同时通过道路和雇主说明铁路受益者超出购票人。\n\n段首先承认一个有限的道理：\n\n> Asking passengers to contribute to railway costs is reasonable\n\n作者接受乘客分担，并没有主张免费。but随后限定：接受分担仍未决定各群体应付多少。\n\n再看两个非乘客的获益渠道：\n\n> roads become less crowded\n\n有人改乘铁路会减少道路拥挤，未上车者也可能受益；接着的雇主依靠员工通勤进一步扩大受益者范围。\n\n结论明确否定了哪一种假设：\n\n> as if its buyer were the railway’s only beneficiary\n\nonly是问题所在。作者反对把购票者当成唯一受益者，因此成本讨论要越出车厢和个人票据。\n\n这一部分的推进关系是：\n\n> 乘客可以分担成本 → 未乘车者与雇主也会受益 → 不等于所有旅程免费 → 资金分担应考虑车厢之外的收益\n\nIndividual Ticket Holder对应its buyer；Beyond对应roads和employers这些购票之外的受益联系。标题要求扩大成本讨论的视野，恰好保留“乘客可付费，但不是唯一受益者”的两层意思。\n\n再看最强干扰项D：Making Every Journey Free。\n\n免费标题抓住非乘客也获益这一事实，却跨过了These connections do not prove…travel for nothing的明确限制。扩大分担依据不等于免去乘客的全部贡献，两者在责任范围上不同。\n\n**42题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】C. Looking Beyond the Individual Ticket Holder\u003c/p>\n\u003cblockquote>\n\u003cp>将眼光放到购票乘客之外\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分承认乘客应分担，同时通过道路和雇主说明铁路受益者超出购票人。\u003c/p>\n\u003cp>段首先承认一个有限的道理：\u003c/p>\n\u003cblockquote>\n\u003cp>Asking passengers to contribute to railway costs is reasonable\u003c/p>\n\u003c/blockquote>\n\u003cp>作者接受乘客分担，并没有主张免费。but随后限定：接受分担仍未决定各群体应付多少。\u003c/p>\n\u003cp>再看两个非乘客的获益渠道：\u003c/p>\n\u003cblockquote>\n\u003cp>roads become less crowded\u003c/p>\n\u003c/blockquote>\n\u003cp>有人改乘铁路会减少道路拥挤，未上车者也可能受益；接着的雇主依靠员工通勤进一步扩大受益者范围。\u003c/p>\n\u003cp>结论明确否定了哪一种假设：\u003c/p>\n\u003cblockquote>\n\u003cp>as if its buyer were the railway’s only beneficiary\u003c/p>\n\u003c/blockquote>\n\u003cp>only是问题所在。作者反对把购票者当成唯一受益者，因此成本讨论要越出车厢和个人票据。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>乘客可以分担成本 → 未乘车者与雇主也会受益 → 不等于所有旅程免费 → 资金分担应考虑车厢之外的收益\u003c/p>\n\u003c/blockquote>\n\u003cp>Individual Ticket Holder对应its buyer；Beyond对应roads和employers这些购票之外的受益联系。标题要求扩大成本讨论的视野，恰好保留“乘客可付费，但不是唯一受益者”的两层意思。\u003c/p>\n\u003cp>再看最强干扰项D：Making Every Journey Free。\u003c/p>\n\u003cp>免费标题抓住非乘客也获益这一事实，却跨过了These connections do not prove…travel for nothing的明确限制。扩大分担依据不等于免去乘客的全部贡献，两者在责任范围上不同。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n【答案】E. Compensation Is Not a Verdict on a Strike\n\n> 补偿不是对罢工责任的裁决\n\n这一部分将罢工责任与乘客应获补救分开，说明调查归责不应抹去付费旅程落空的损失。\n\n开头先摆出容易吞没乘客的争论：\n\n> who caused a strike\n\n这是工会与管理层之间的致因和责任问题，随后说双方都可能需要解释自己的决定。\n\n转折处把两个问题明确拆开：\n\n> deciding where blame belongs is different from deciding what is owed\n\nblame belongs问谁该受责；what is owed问未完成付费旅程后欠乘客什么。不同的提问不能混作同一道门槛。\n\n再看补偿具体承认什么：\n\n> the failure to deliver that journey\n\n补偿依据是已付款的旅程没有兑现，不要求乘客先判完每一步劳资谈判。结尾仍允许调查责任，说明两者可以并行。\n\n这一部分的推进关系是：\n\n> 罢工归责争论使乘客被忽视 → 归责与应付乘客之物不同 → 补偿对应未兑现旅程 → 调查责任不应拖成乘客损失无人处理\n\nCompensation对应补偿未兑现旅程；Verdict on a Strike对应blame及labour negotiation的责任裁决。Is Not准确表达段中different from的区分，而非否认罢工可以被调查。\n\n再看最强干扰项G：Holding Unions Responsible for Every Failure。\n\n工会责任标题只抓住Unions，却忽略management也在被要求说明，而且主句重点是乘客补偿无需等归责结束。Every Failure还把一次罢工责任扩大成全部服务故障，与段中对问题的区分相反。\n\n**43题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】E. Compensation Is Not a Verdict on a Strike\u003c/p>\n\u003cblockquote>\n\u003cp>补偿不是对罢工责任的裁决\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分将罢工责任与乘客应获补救分开，说明调查归责不应抹去付费旅程落空的损失。\u003c/p>\n\u003cp>开头先摆出容易吞没乘客的争论：\u003c/p>\n\u003cblockquote>\n\u003cp>who caused a strike\u003c/p>\n\u003c/blockquote>\n\u003cp>这是工会与管理层之间的致因和责任问题，随后说双方都可能需要解释自己的决定。\u003c/p>\n\u003cp>转折处把两个问题明确拆开：\u003c/p>\n\u003cblockquote>\n\u003cp>deciding where blame belongs is different from deciding what is owed\u003c/p>\n\u003c/blockquote>\n\u003cp>blame belongs问谁该受责；what is owed问未完成付费旅程后欠乘客什么。不同的提问不能混作同一道门槛。\u003c/p>\n\u003cp>再看补偿具体承认什么：\u003c/p>\n\u003cblockquote>\n\u003cp>the failure to deliver that journey\u003c/p>\n\u003c/blockquote>\n\u003cp>补偿依据是已付款的旅程没有兑现，不要求乘客先判完每一步劳资谈判。结尾仍允许调查责任，说明两者可以并行。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>罢工归责争论使乘客被忽视 → 归责与应付乘客之物不同 → 补偿对应未兑现旅程 → 调查责任不应拖成乘客损失无人处理\u003c/p>\n\u003c/blockquote>\n\u003cp>Compensation对应补偿未兑现旅程；Verdict on a Strike对应blame及labour negotiation的责任裁决。Is Not准确表达段中different from的区分，而非否认罢工可以被调查。\u003c/p>\n\u003cp>再看最强干扰项G：Holding Unions Responsible for Every Failure。\u003c/p>\n\u003cp>工会责任标题只抓住Unions，却忽略management也在被要求说明，而且主句重点是乘客补偿无需等归责结束。Every Failure还把一次罢工责任扩大成全部服务故障，与段中对问题的区分相反。\u003c/p>\n\u003cp>\u003cstrong>43题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】B. Making Investment Visible in Everyday Journeys\n\n> 让投资体现在日常出行中\n\n这一部分承认施工的必要中断，同时要求用普通一周的出行改善来检验投资。\n\n先承认施工可能造成合理中断：\n\n> disruption before they deliver an improvement\n\nbefore把短期不便和未来收益连起来。作者不是要求铁路永远不施工，而是给理解维修留出位置。\n\n再看信任为什么会被破坏：\n\n> a repeated gap between the promised timetable and the actual journey\n\n反复落空的是承诺时刻表与实际行程的对应，问题不在所有关闭线路行为本身。\n\n最后将投资的成功标准落到日常：\n\n> the traveller’s ordinary week becomes more predictable\n\n少取消、可靠换乘、提前告知都是可感受的结果；ordinary week收束这些例子，取代单看支出总额的评价。\n\n这一部分的推进关系是：\n\n> 施工可能暂时中断服务 → 乘客能够理解必要工作 → 反复违背承诺损害理解 → 以日常行程能否更可预期检验投资\n\nMaking Investment Visible不是要求展示工程照片，而是让投入通过fewer cancellations等结果被乘客察觉。Everyday Journeys对应ordinary week，完整概括从花钱数字转向实际体验的标准。\n\n再看最强干扰项F：A Higher Price Needs a Better Service。\n\n更高票价配更好服务与本段主题接近，但这里没有展开涨价是否合理。段首讨论的是施工带来的暂时中断，结尾检验工程投入如何变成可靠行程；投资成效比提价关系更准确地覆盖整段。\n\n**44题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】B. Making Investment Visible in Everyday Journeys\u003c/p>\n\u003cblockquote>\n\u003cp>让投资体现在日常出行中\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分承认施工的必要中断，同时要求用普通一周的出行改善来检验投资。\u003c/p>\n\u003cp>先承认施工可能造成合理中断：\u003c/p>\n\u003cblockquote>\n\u003cp>disruption before they deliver an improvement\u003c/p>\n\u003c/blockquote>\n\u003cp>before把短期不便和未来收益连起来。作者不是要求铁路永远不施工，而是给理解维修留出位置。\u003c/p>\n\u003cp>再看信任为什么会被破坏：\u003c/p>\n\u003cblockquote>\n\u003cp>a repeated gap between the promised timetable and the actual journey\u003c/p>\n\u003c/blockquote>\n\u003cp>反复落空的是承诺时刻表与实际行程的对应，问题不在所有关闭线路行为本身。\u003c/p>\n\u003cp>最后将投资的成功标准落到日常：\u003c/p>\n\u003cblockquote>\n\u003cp>the traveller’s ordinary week becomes more predictable\u003c/p>\n\u003c/blockquote>\n\u003cp>少取消、可靠换乘、提前告知都是可感受的结果；ordinary week收束这些例子，取代单看支出总额的评价。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>施工可能暂时中断服务 → 乘客能够理解必要工作 → 反复违背承诺损害理解 → 以日常行程能否更可预期检验投资\u003c/p>\n\u003c/blockquote>\n\u003cp>Making Investment Visible不是要求展示工程照片，而是让投入通过fewer cancellations等结果被乘客察觉。Everyday Journeys对应ordinary week，完整概括从花钱数字转向实际体验的标准。\u003c/p>\n\u003cp>再看最强干扰项F：A Higher Price Needs a Better Service。\u003c/p>\n\u003cp>更高票价配更好服务与本段主题接近，但这里没有展开涨价是否合理。段首讨论的是施工带来的暂时中断，结尾检验工程投入如何变成可靠行程；投资成效比提价关系更准确地覆盖整段。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】A. Ownership Debates Begin with Broken Trust\n\n> 所有权争论始于信任破裂\n\n这一部分解释失约如何催生所有权诉求，再指出新旧所有者都须交代可问责的服务。\n\n先看投诉为何升级为制度要求：\n\n> a demand for a different owner\n\n触发因素是反复承诺却看不到改变，抱怨因此从一次服务失败升级为所有者能否自我纠正的问题。\n\nhowever随后限制换所有者的作用：\n\n> does not automatically repair a signal or produce a workable timetable\n\n改所有权并不会自动修好信号或排好时刻表，作者因此要求继续交代实际管理和纠错机制。\n\n结尾回到回应信任危机的标准：\n\n> an accountable service\n\n后面的whatever name表明判断不取决于站牌上写谁，而取决于决策、报告失败和违约后果能否被追问。\n\n这一部分的推进关系是：\n\n> 承诺反复落空 → 乘客要求改变所有者 → 换所有权不能自动改善服务 → 新旧安排都须接受问责\n\nOwnership Debates对应different owner和public ownership；Broken Trust对应no longer trust及crisis of trust。Begin with说明争论由信任破裂触发，同时容纳后面对换所有权不能包办解决的限制。\n\n再看最强干扰项B：Making Investment Visible in Everyday Journeys。\n\n投资标题也要求看实际结果，但本段没有追踪新轨道或花费如何见效。贯穿始终的是投诉升级、所有权更换及其问责条件，若只写投资，便漏掉这条制度与信任的主线。\n\n**45题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】A. Ownership Debates Begin with Broken Trust\u003c/p>\n\u003cblockquote>\n\u003cp>所有权争论始于信任破裂\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释失约如何催生所有权诉求，再指出新旧所有者都须交代可问责的服务。\u003c/p>\n\u003cp>先看投诉为何升级为制度要求：\u003c/p>\n\u003cblockquote>\n\u003cp>a demand for a different owner\u003c/p>\n\u003c/blockquote>\n\u003cp>触发因素是反复承诺却看不到改变，抱怨因此从一次服务失败升级为所有者能否自我纠正的问题。\u003c/p>\n\u003cp>however随后限制换所有者的作用：\u003c/p>\n\u003cblockquote>\n\u003cp>does not automatically repair a signal or produce a workable timetable\u003c/p>\n\u003c/blockquote>\n\u003cp>改所有权并不会自动修好信号或排好时刻表，作者因此要求继续交代实际管理和纠错机制。\u003c/p>\n\u003cp>结尾回到回应信任危机的标准：\u003c/p>\n\u003cblockquote>\n\u003cp>an accountable service\u003c/p>\n\u003c/blockquote>\n\u003cp>后面的whatever name表明判断不取决于站牌上写谁，而取决于决策、报告失败和违约后果能否被追问。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>承诺反复落空 → 乘客要求改变所有者 → 换所有权不能自动改善服务 → 新旧安排都须接受问责\u003c/p>\n\u003c/blockquote>\n\u003cp>Ownership Debates对应different owner和public ownership；Broken Trust对应no longer trust及crisis of trust。Begin with说明争论由信任破裂触发，同时容纳后面对换所有权不能包办解决的限制。\u003c/p>\n\u003cp>再看最强干扰项B：Making Investment Visible in Everyday Journeys。\u003c/p>\n\u003cp>投资标题也要求看实际结果，但本段没有追踪新轨道或花费如何见效。贯穿始终的是投诉升级、所有权更换及其问责条件，若只写投资，便漏掉这条制度与信任的主线。\u003c/p>\n\u003cp>\u003cstrong>45题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 以被迫增加的通勤支出提出付费与可靠服务的基本约定 |\n| B | 从旅程未兑现转到对乘客的即时补偿 |\n| C | 指出退款只补过去，进而提出罢工时的最低服务 |\n| D | 要求共同出资对应可核查的服务承诺 |\n| E | 限定最低服务的作用，并引出日常改善所需投资 |\n| F | 由地区服务差异引出非乘客受益和共同分担成本 |\n| G | 将投资付费原则放到地区服务不均的现实中检验 |\n| H | 以可核查表现收束信任与所有权压力 |\n\n全文推进：\n\n> 以被迫增加的通勤支出提出付费与可靠服务的基本约定 → 从旅程未兑现转到对乘客的即时补偿 → 指出退款只补过去，进而提出罢工时的最低服务 → 限定最低服务的作用，并引出日常改善所需投资 → 将投资付费原则放到地区服务不均的现实中检验 → 由地区服务差异引出非乘客受益和共同分担成本 → 要求共同出资对应可核查的服务承诺 → 以可核查表现收束信任与所有权压力\n\n完整顺序：\n\n**A → B → C → E → G → F → D → H**\n\n41—45：B、C、G、F、D。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>以被迫增加的通勤支出提出付费与可靠服务的基本约定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>从旅程未兑现转到对乘客的即时补偿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>指出退款只补过去，进而提出罢工时的最低服务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>要求共同出资对应可核查的服务承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>限定最低服务的作用，并引出日常改善所需投资\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>由地区服务差异引出非乘客受益和共同分担成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>将投资付费原则放到地区服务不均的现实中检验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以可核查表现收束信任与所有权压力\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以被迫增加的通勤支出提出付费与可靠服务的基本约定 → 从旅程未兑现转到对乘客的即时补偿 → 指出退款只补过去，进而提出罢工时的最低服务 → 限定最低服务的作用，并引出日常改善所需投资 → 将投资付费原则放到地区服务不均的现实中检验 → 由地区服务差异引出非乘客受益和共同分担成本 → 要求共同出资对应可核查的服务承诺 → 以可核查表现收束信任与所有权压力\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → B → C → E → G → F → D → H\u003c/strong>\u003c/p>\n\u003cp>41—45：B、C、G、F、D。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → B → C的关系。\n\n先看前段A的结尾：\n\n> It rests on a basic bargain: passengers provide the money and the railway provides a dependable journey.\n\n再看候选B的开头：\n\n> That bargain is broken when a passenger pays for a journey that is then cancelled.\n\n前段最后明确把基本约定写为乘客给钱、铁路提供可靠旅程。That bargain只需回指这组交换关系，随后broken与cancelled写约定怎样被打破，形成“提出标准—呈现违约”的承接。\n\n本段没有立即争论哪一方该为罢工负责，而是指出归责不能让已失去的旅程回来。由customer needs a remedy推进到compensation，把下一步讨论对象具体限定为补偿。\n\nB段最终落在：\n\n> For a journey that cannot be restored, the immediate remedy is compensation.\n\n后段C的开头是：\n\n> Compensation looks backwards, however, and tomorrow’s commuter needs something more.\n\n当前段最后首次明确即时补救是compensation，后段便以Compensation looks backwards评价它的时间范围。先提出补偿，再指出它只能补过去，才有理由转向下一次出行的保障。\n\n这三段的局部推进是：\n\n> 以被迫增加的通勤支出提出付费与可靠服务的基本约定 → 从旅程未兑现转到对乘客的即时补偿 → 指出退款只补过去，进而提出罢工时的最低服务\n\n再检验容易混淆的候选G。它的开头是：\n\n> That investment is often defended on the principle that users should pay.\n\n另一候选也以That开头，但That investment需要前段先提出投资；开篇只有付费换可靠旅程的约定，没有投资来源问题。它还会提前进入地区公平，跳过已付款却没有旅程这一即时损失。\n\n**41题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → B → C的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>It rests on a basic bargain: passengers provide the money and the railway provides a dependable journey.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That bargain is broken when a passenger pays for a journey that is then cancelled.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最 程未兑现转到对乘客的即时补偿 → 指出退款只补过去，进而提出罢工时的最低服务 → 限定最低服务的作用，并引出日常改善所需投资\n\n再检验容易混淆的候选D。它的开头是：\n\n> Such sharing needs a clear account of what the money will achieve.\n\nSuch sharing一段要求前面存在多群体共同分担的方案。补偿是运营方对失去旅程的乘客的补救，不是共同出资；放在这里会把收款方向与资金用途一并换掉，也接不上已知段的最低服务。\n\n**42题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成B → C → E的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>For a journey that cannot be restored, the immediate remedy is compensation.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Compensation looks backwards, however, and tomorrow’s commuter needs something more.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段落在immediate remedy is compensation，本段同词承接后马上用however限制其作用。looks backwards与tomorrow对照，说明退款处理的是过去，乘客还需要未来能出行。\u003c/p>\n\u003cp>由退款不能防止再次中断，作者才提出工业行动期间保护基本运行。段末minimum service给这一前瞻安排命名，并以plan around说明它对通勤安排的用途。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This is the case for a minimum service that passengers can plan around.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A minimum service sets a floor; it does not guarantee a comfortable or reliable network on ordinary days.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知后段以A minimum service sets a floor承接刚命名的安排，再区分最低底线与普通日子的质量。两段连续评价方案的作用范围：补偿不足以防未来，最低服务又不足以包办日常改善。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从旅程未兑现转到对乘客的即时补偿 → 指出退款只补过去，进而提出罢工时的最低服务 → 限定最低服务的作用，并引出日常改善所需投资\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such sharing needs a clear account of what the money will achieve.\u003c/p>\n\u003c/blockquote>\n\u003cp>Such sharing一段要求前面存在多群体共同分担的方案。补偿是运营方对失去旅程的乘客的补救，不是共同出资；放在这里会把收款方向与资金用途一并换掉，也接不上已知段的最低服务。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → F的关系。\n\n先看前段E的结尾：\n\n> It also raises the question of who will finance renewed investment.\n\n再看候选G的开头：\n\n> That investment is often defended on the principle that users should pay.\n\n已知前段结尾问谁来为renewed investment出钱，That investment精确回指这一新投入。随后users should pay直接回答融资原则，形成“提出资金问题—给出原则并检验”的关系。\n\n作者用Yet把抽象使用者付费放到具体服务差异中：一边班次频繁，一边线路被忽视。因此段末不是泛谈票价，而是收束为national funding必须面对的regional imbalance。\n\nG段最终落在：\n\n> A national funding debate must therefore confront this regional imbalance.\n\n后段F的开头是：\n\n> This regional imbalance also matters to people who do not buy train tickets.\n\n后段This regional imbalance直接接住段末名词，再通过also把受影响者扩展到不买票的人。必须先建立两地乘客服务不同，才谈这项不均如何影响城镇就业与商业。\n\n这三段的局部推进是：\n\n> 限定最低服务的作用，并引出日常改善所需投资 → 将投资付费原则放到地区服务不均的现实中检验 → 由地区服务差异引出非乘客受益和共同分担成本\n\n再检验容易混淆的候选B。它的开头是：\n\n> That bargain is broken when a passenger pays for a journey that is then cancelled.\n\nThat bargain一段能谈收费与服务，却从已购买旅程遭取消转向补偿，无法回答前段刚提出的投资由谁承担。它也不会引出下一段所需的regional imbalance，前后两端均缺少对应。\n\n**43题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → F的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>It also raises the question of who will finance renewed investment.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That investment is often defended on the principle that users should pay.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知前段结尾问谁来为renewed investment出钱，That investment精确回指这一新投入。随后users should pay直接回答融资原则，形成“提出资金问题—给出原则并检验”的关系。\u003c/p>\n\u003cp>作者用Yet把抽象使用者付费放到具体服务差异中：一边班次频繁，一边线路被忽视。因此段末不是泛谈票价，而是收束为national funding必须面对的regional imbalance。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>A national funding debate must therefore confront this regional imbalance.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>This regional imbalance also matters  regional imbalance.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>This regional imbalance also matters to people who do not buy train tickets.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段对比频繁列车与被忽视线路，最后用regional imbalance命名。This regional imbalance加also，既保留同一地区差异，又把考察对象从乘客推向非购票者。\u003c/p>\n\u003cp>连接不佳的城镇难以吸引劳动力和企业，是非乘客受影响的具体路径。由此才说乘客与其他人的二分被复杂化，最后提出several groups分担成本，而非一开始就无依据地要求所有人付款。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest a reason for several groups to share the costs.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such sharing needs a clear account of what the money will achieve.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Such sharing回指本段最后的多群体share the costs，然后追问钱能换来什么。这条承接把“谁应出钱”推进成“共同出钱后怎样核查结果”，逻辑任务发生了明确变化。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>将投资付费原则放到地区服务不均的现实中检验 → 由地区服务差异引出非乘客受益和共同分担成本 → 要求共同出资对应可核查的服务承诺\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such sharing needs a clear account of what the money will achieve.\u003c/p>\n\u003c/blockquote>\n\u003cp>若先放Such sharing段，前面只有用户付费与地区不均，尚未论证非乘客也获益，更未提出多个群体共同分担。它所需的sharing会提前出现，同时漏掉成本分担范围扩大的理由。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → D → H的关系。\n\n先看前段F的结尾：\n\n> They suggest a reason for several groups to share the costs.\n\n再看候选D的开头：\n\n> Such sharing needs a clear account of what the money will achieve.\n\n前段结尾建议several groups共同分担，本段Such sharing回指这一安排，needs a clear account随即给它加条件：扩大出资群体必须说明资金效果。\n\notherwise说明没有可查承诺会把通勤者的失望传给更多出资人；后面给可靠换乘、提前告知等可观察项目，最终收束到published performance benchmarks，而不是只笼统要求问责。\n\nD段最终落在：\n\n> Those paying should be able to compare the promises with published performance benchmarks.\n\n后段H的开头是：\n\n> Those benchmarks cannot prevent every failure, but they can make a persistent failure harder to hide.\n\n后段Those benchmarks准确接住公开绩效基准，并区分它不能消除每次故障、却能使长期失约难以掩盖。可核查承诺先建立，才有结尾以持续失约重新引出所有权压力的判断基础。\n\n这三段的局部推进是：\n\n> 由地区服务差异引出非乘客受益和共同分担成本 → 要求共同出资对应可核查的服务承诺 → 以可核查表现收束信任与所有权压力\n\n再检验容易混淆的候选G。它的开头是：\n\n> That investment is often defended on the principle that users should pay.\n\nThat investment一段会重新回到使用者付费和地区不均，而这些问题已经讨论完毕；它的结尾仍是regional imbalance，不能为已知末段Those benchmarks提供先行词。因此并非多谈一次投资就能替代核查承诺。\n\n**45题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → D → H的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest a reason for several groups to share the costs.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Such sharing needs a clear account of what the money will achieve.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段结尾建议several groups共同分担，本段Such sharing回指这一安排，needs a clear account随即给它加条件：扩大出资群体必须说明资金效果。\u003c/p>\n\u003cp>otherwise说明没有可查承诺会把通勤者的失望传给更多出资人；后面给可靠换乘、提前告知等可观察项目，最终收束到published performance benchmarks，而不是只笼统要求问责。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Those paying should be able to compare the promises with published performance benchmarks.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those benchmarks cannot prevent every failure, but they can make a persistent failure harder to hide.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Those benchmarks准确接住公开绩效基准，并区分它不能消除每次故障、却能使长期失约难以掩盖。可核查承诺先建立，才有结尾以持续失约重新引出所有权压力的判断基础。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>由地区服务差异引出非乘客受益和共同分担成本 → 要求共同出资对应可核查的服务承诺 → 以可核查表现收束信任与所有权压力\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That investment is often defended on the principle that users should pay.\u003c/p>\n\u003c/blockquote>\n\u003cp>That investment一段会重新回到使用者付费和地区不均，而这些问题已经讨论完毕；它的结尾仍是regional imbalance，不能为已知末段Those benchmarks提供先行词。因此并非多谈一次投资就能替代核查承诺。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **reliable public services** | **可靠的公共服务** | **社会生活类：生活质量** | **宏观主题** |\n| responsibility to service users | 对服务使用者的责任 | 人生哲理类：责任感、奉献精神 | 宏观主题 |\n| fair cost sharing | 公平的成本分担 | 人生哲理类：理解、信任、宽容 | 宏观主题 |\n| **long-term investment** | **长期投资** | **经济消费类：企业经营** | **宏观主题** |\n| attention to regional needs | 对地区需求的关注 | 人生哲理类：批判、独立、全局思维 | 宏观主题 |\n| constructive problem-solving | 建设性地解决问题 | 人生哲理类：创新、开拓、与时俱进 | 个人主题 |\n| **public trust** | **公众信任** | **人生哲理类：理解、信任、宽容** | **宏观主题** |\n| effective cooperation | 有效合作 | 人生哲理类：团结合作 | 宏观主题 |\n| a willingness to honour commitments | 履行承诺的意愿 | 人生哲理类：责任感、奉献精神 | 个人主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 1重点词与语境","focus":[0,0,1080,4587],"sourceW":1080,"sourceH":4587,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>reliable public services\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>可靠的公共服务\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会生活类：生活质量\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsibility to service users\u003c/td>\n\u003ctd>对服务使用者的责任\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fair cost sharing\u003c/td>\n\u003ctd>公平的成本分担\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>long-term investment\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>长期投资\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>经济消费类：企业经营\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>attention to regional needs\u003c/td>\n\u003ctd>对地区需求的关注\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>constructive problem-solving\u003c/td>\n\u003ctd>建设性地解决问题\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>public trust\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>公众信任\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>effective cooperation\u003c/td>\n\u003ctd>有效合作\u003c/td>\n\u003ctd>人生哲理类：团结合作\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a willingness to honour commitments\u003c/td>\n\u003ctd>履行承诺的意愿\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第五鸟 · 写作积累","title":"2. 大作文第一段描述题目信息时可积累的表达","level":2,"raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画题** | **The picture shows A bearing an extra burden imposed by X.** | **图画展示A承受X带来的额外负担。** |\n| 图画题 | In the picture, A expects a basic level of X in return for Y. | 图中A期待以Y换来基本水平的X。 |\n| 图画题 | The scene contrasts the needs of A with the experience of B. | 这一场景把A的需求与B的经历作对照。 |\n| **图表题** | **The cost of X has risen by Y per cent.** | **X的成本上涨了百分之Y。** |\n| 图表题 | The increase in X remains well above the rise in Y. | X的涨幅仍明显高于Y。 |\n| 图表题 | A larger share of the cost is now borne by X. | 如今更大比例的成本由X承担。 |\n| **文本评论题** | **The passage questions whether another increase in X can be justified.** | **文章质疑再次提高X是否合理。** |\n| 文本评论题 | The text acknowledges the need for X while calling for improvements in Y. | 文章承认X的必要，同时呼吁改善Y。 |\n| 文本评论题 | The issue concerns how to match rising costs with reliable services. | 问题涉及如何让上涨的成本与可靠服务相匹配。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2021英语一Text 1重点词与语境","focus":[0,0,1080,4587],"sourceW":1080,"sourceH":4587,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A bearing an extra burden imposed by X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示A承受X带来的额外负担。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, A expects a basic level of X in return for Y.\u003c/td>\n\u003ctd>图中A期待以Y换来基本水平的X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene contrasts the needs of A with the experience of B.\u003c/td>\n\u003ctd>这一场景把A的需求与B的经历作对照。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The cost of X has risen by Y per cent.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>X的成本上涨了百分之Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The increase in X remains well above the rise in Y.\u003c/td>\n\u003ctd>X的涨幅仍明显高于Y。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>A larger share of the cost is now borne by X.\u003c/td>\n\u003ctd>如今更大比例的成本由X承担。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage questions whether another increase in X can be justified.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章质疑再次提高X是否合理。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text acknowledges the need for X while calling for improvements in Y.\u003c/td>\n\u003ctd>文章承认X的必要，同时呼吁改善Y。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue concerns how to match rising costs with reliable services.\u003c/td>\n\u003ctd>问题涉及如何让上涨的成本与可靠服务相匹配。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Ownership Debates Begin with Broken Trust\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Making Investment Visible in Everyday Journeys\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Looking Beyond the Individual Ticket Holder\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. Making Every Journey Free\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Compensation Is Not a Verdict on a Strike\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. A Higher Price Needs a Better Service\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Holding Unions Responsible for Every Failure\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>A fare increase may look modest beside last year’s rise and still be difficult to defend. For a worker who cannot reach the office by any other route, it is an unavoidable addition to household spending. The relevant comparison is therefore not simply between two annual percentages. It is between the extra payment and the journey that payment buys. If cancellations and overcrowding remain familiar experiences, an announcement about a slightly smaller increase offers little reassurance. A higher price needs to be accompanied by a service that passengers can actually depend on.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>Asking passengers to contribute to railway costs is reasonable, but it does not settle how much each group should pay. A person who never boards a train may still benefit when others leave their cars at home and roads become less crowded. Employers also depend on workers arriving from places beyond walking distance. These connections do not prove that passengers should travel for nothing. They show why the price of a ticket cannot be discussed as if its buyer were the railway’s only beneficiary. A funding argument must consider benefits beyond the carriage.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>A dispute about who caused a strike can become so heated that the passenger disappears from view. Unions and management may each be asked to explain their decisions. Yet deciding where blame belongs is different from deciding what is owed to someone whose paid journey never took place. Compensation recognizes the failure to deliver that journey. It does not require passengers to judge every move in a labour negotiation before receiving help. Keeping these questions separate allows responsibility for disruption to be investigated without treating the customer’s loss as an afterthought.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>New tracks and signalling equipment can require disruption before they deliver an improvement. Passengers can understand that a line must sometimes close for work. What undermines this understanding is a repeated gap between the promised timetable and the actual journey. Investment therefore needs to be explained through outcomes that people can notice: fewer cancellations, dependable connections and clear warnings about planned closures. A large spending figure is not, by itself, evidence of a successful service. The test is whether the traveller’s ordinary week becomes more predictable once the work is done.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>When repeated promises produce little visible change, complaints can become a demand for a different owner. Calls for public ownership express more than irritation at a single cancelled train; they suggest that people no longer trust the existing arrangement to correct itself. Changing ownership, however, does not automatically repair a signal or produce a workable timetable. Any new arrangement must still explain who makes decisions, how failures are reported and what happens when promises are broken. The strongest response to a crisis of trust is therefore an accountable service, whatever name appears above the station.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>For a commuter with no practical alternative, another fare increase is not an optional purchase. It must be paid before the day’s work can begin. The justification for asking for more therefore rests on more than the operator’s announcement. It rests on a basic bargain: passengers provide the money and the railway provides a dependable journey.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>That bargain is broken when a passenger pays for a journey that is then cancelled. Arguments about whether management or a union caused the cancellation do not make the lost journey reappear. The customer needs a remedy that recognizes the service already purchased. For a journey that cannot be restored, the immediate remedy is compensation.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>Compensation looks backwards, however, and tomorrow’s commuter needs something more. A refund can acknowledge yesterday’s failure without preventing the next one. Rules for periods of industrial action should therefore protect a basic level of operation while disputes are being resolved. This is the case for a minimum service that passengers can plan around.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Such sharing needs a clear account of what the money will achieve. Otherwise, a wider group of contributors simply inherits the frustration already felt by commuters. Funding decisions should specify improvements that can be checked, including reliable connections and notice of disruption. Those paying should be able to compare the promises with published performance benchmarks.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>A minimum service sets a floor; it does not guarantee a comfortable or reliable network on ordinary days. Ageing equipment, weak connections and overcrowded trains may remain even when no strike is taking place. Addressing these everyday problems requires work beyond a rule about industrial action. It also raises the question of who will finance renewed investment.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>This regional imbalance also matters to people who do not buy train tickets. A poorly connected town can struggle to attract workers and businesses, while a well-served area gains benefits extending beyond the carriage. Such effects complicate the division between passengers and everyone else. They suggest a reason for several groups to share the costs.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>That investment is often defended on the principle that users should pay. Yet applying the principle requires attention to the different services users receive. A commuter with frequent trains is not in the same position as someone with a neglected local line. A national funding debate must therefore confront this regional imbalance.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>Those benchmarks cannot prevent every failure, but they can make a persistent failure harder to hide. If promises repeatedly remain unmet, demands for a different owner will return. Public or private management must answer the same practical question: can passengers see that the money they provide is buying a service worthy of their trust?\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2021英语一Text 1重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>train operator\u003c/td>\n\u003ctd>n.火车运营商\u003c/td>\n\u003ctd>possibly\u003c/td>\n\u003ctd>adv.可能\u003c/td>\n\u
