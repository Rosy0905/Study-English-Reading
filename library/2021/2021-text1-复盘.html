与通胀的差距。","context":{"mode":"image","asset":"questions","focus":[250,430,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"21","option":"B"},"focusId":"focus-q21-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-B-0\">\u003cblockquote>\n\u003cp>与通货膨胀保持同步\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 kept pace with inflation 要与通胀比较，而第1段明确写 well above，因此回看 This year’s rise 后面比较今年、去年与官方CPI的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>B的 kept pace with inflation 是大致同步，而well above是明显高于。即使今年低于去年，也只是今年与去年之间的比较，不能因此把今年相对于通胀的“明显超过”改成“同步”。\u003c/p>\n\u003cp>两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>今年列车票价上涨与通货膨胀保持同步。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 kept pace with inflation 要与通胀比较，而第1段明确写 well above，因此回看 This year’s rise 后面比较今年、去年与官方CPI的那一句。\u003c/p>\n\u003cp>B的 kept pace with inflation 是大致同步，而well above是明显高于。即使今年低于去年，也只是今年与去年之间的比较，不能因此把今年相对于通胀的“明显超过”改成“同步”。\u003c/p>\n\u003cp>两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\u003c/p>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003cp>matches要求两种涨幅基本相等；原文well above却说票价明显高于CPI。略低于去年比较的是两年的票价涨幅，不能拿它冲淡票价与通胀的差距。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The fare increase simply matches the rise in consumer prices.\u003c/p>\n\u003cp>票价涨幅只是与消费价格涨幅相当。\u003c/p>\n\u003c/blockquote>\n\u003cp>matches要求两种涨幅基本相等；原文well above却说票价明显高于CPI。略低于去年比较的是两年的票价涨幅，不能拿它冲淡票价与通胀的差距。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. has kept pace with inflation","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Ever-rising Fares Aren’t Sustainable  \n> 不断上涨的票价难以持续\n\n把这个主旨直接代入21题题干：\n\n> 全文主旨质疑持续涨价能否维持，因此本题应检查今年涨价是否仍有合理性问题；但主旨本身不能确定今年涨幅、通胀差距或乘客是否意外，仍须核对首段。\n\n但B实际说的是：\n\n> has kept pace with inflation  \n> 与通货膨胀保持同步\n\n两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\n\n从全文推进看，这一处的作用是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\n\n本项最终仍要根据“but it is still well above”这处局部原文判断。\n\n**复盘判断：B错误。**","context":{"mode":"image","asset":"questions","focus":[250,430,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"21","option":"B"},"focusId":"focus-q21-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-B-0\">\u003cblockquote>\n\u003cp>与通货膨胀保持同步\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 kept pace with inflation 要与通胀比较，而第1段明确写 well above，因此回看 This year’s rise 后面比较今年、去年与官方CPI的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>B的 kept pace with inflation 是大致同步，而well above是明显高于。即使今年低于去年，也只是今年与去年之间的比较，不能因此把今年相对于通胀的“明显超过”改成“同步”。\u003c/p>\n\u003cp>两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>今年列车票价上涨与通货膨胀保持同步。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 kept pace with inflation 要与通胀比较，而第1段明确写 well above，因此回看 This year’s rise 后面比较今年、去年与官方CPI的那一句。\u003c/p>\n\u003cp>B的 kept pace with inflation 是大致同步，而well above是明显高于。即使今年低于去年，也只是今年与去年之间的比较，不能因此把今年相对于通胀的“明显超过”改成“同步”。\u003c/p>\n\u003cp>两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\u003c/p>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003cp>matches要求两种涨幅基本相等；原文well above却说票价明显高于CPI。略低于去年比较的是两年的票价涨幅，不能拿它冲淡票价与通胀的差距。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>This year&#39;s rise, an average of 2.7 per cent, may be a fraction lower than last year&#39;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.\u003c/p>\n\u003cp>首段把年年涨价称为令人无奈的惯例，指出它给无替代出行方式的人增加负担；今年涨幅虽略低于去年，仍明显超过通胀，所以作者追问凭什么涨。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The fare increase simply matches the rise in consumer prices.\u003c/p>\n\u003cp>票价涨幅只是与消费价格涨幅相当。\u003c/p>\n\u003c/blockquote>\n\u003cp>matches要求两种涨幅基本相等；原文well above却说票价明显高于CPI。略低于去年比较的是两年的票价涨幅，不能拿它冲淡票价与通胀的差距。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨质疑持续涨价能否维持，因此本题应检查今年涨价是否仍有合理性问题；但主旨本身不能确定今年涨幅、通胀差距或乘客是否意外，仍须核对首段。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>has kept pace with inflation\u003cbr>与通货膨胀保持同步\u003c/p>\n\u003c/blockquote>\n\u003cp>两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\u003c/p>\n\u003cp>本项最终仍要根据“but it is still well above”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. is a big surprise to commuters","level":3,"raw":"### C. is a big surprise to commuters\n\n> 令通勤者非常意外\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C的 a big surprise 要找意外感，第1段却写 every January，二者都涉及人们是否能预料涨价，所以回看年度涨价和乘客负担相连的那一句。\n\n**错误类型：第一类——歪曲原意。**\n\n原文 every January 明确说每年一月都会涨价，前面还用reliable annual描述这种年年出现的情况。C的 a big surprise 却把今年涨价说成难以预料的意外。作者提出质问，是在问反复涨价是否有道理，不是在说乘客从来没见过涨价；不满意一种反复发生的事，也不等于这件事突然出现令人惊讶。\n\n原文强调反复出现和额外负担，C强调意外，两种反应不能互换。\n\n**命题人借用的原文材料：**\n\n> It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.","context":{"mode":"image","asset":"questions","focus":[250,517,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"21","option":"C"},"focusId":"focus-q21-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-C-0\">\u003cblockquote>\n\u003cp>令通勤者非常意外\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 a big surprise 要找意外感，第1段却写 every January，二者都涉及人们是否能预料涨价，所以回看年度涨价和乘客负担相连的那一句。\u003c/p>\n\u003cp>\u003cst 涨感到意外。\u003c/p>\n\u003c/blockquote>\n\u003cp>若是意外，作者应写涨价难以预料。grimly reliable annual ritual却强调年年准时发生；令人不满与出乎意料不是同一种反应。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. is a big surprise to commuters","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Ever-rising Fares Aren’t Sustainable  \n> 不断上涨的票价难以持续\n\n把这个主旨直接代入21题题干：\n\n> 全文主旨质疑持续涨价能否维持，因此本题应检查今年涨价是否仍有合理性问题；但主旨本身不能确定今年涨幅、通胀差距或乘客是否意外，仍须核对首段。\n\n但C实际说的是：\n\n> is a big surprise to commuters  \n> 令通勤者非常意外\n\n原文强调反复出现和额外负担，C强调意外，两种反应不能互换。\n\n从全文推进看，这一处的作用是：质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。\n\n本项最终仍要根据“but it is still well above”这处局部原文判断。\n\n**复盘判断：C错误。**","context":{"mode":"image","asset":"questions","focus":[250,517,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"21","option":"C"},"focusId":"focus-q21-C-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-C-0\">\u003cblockquote>\n\u003cp>令通勤者非常意外\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 a big surprise 要找意外感，第1段却写 every January，二者都涉及人们是否能预料涨价，所以回看年度涨价和乘客负担相连的那一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文 every January 明确说每年一月都会涨价，前面还用reliable annual描述这种年年出现的情况。C的 a big surprise 却把今年涨价说成难以预料的意外。作者提出质问，是在问反复涨价是否有道理，不是在说乘客从来没见过涨价；不满意一种反复发生的事，也不等于这件事突然出现令人惊讶。\u003c/p>\n\u003cp>原文强调反复出现和额外负担，C强调意外，两种反应不能互换。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q21-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>今年 03c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. remains an unreasonable measure","level":3,"raw":"### D. remains an unreasonable measure\n\n> 仍然是一项不合理的措施\n\n**做题模式中的状态：** 第一轮D保留。当时选项呈现为“remains an [xxx] measure”，保留了相应遮挡。当时的定位线索是：D的 remains 保留“即使有变化也仍如此”的意思，第1段but it is still也有这个转折，所以回看今年涨幅和CPI的比较，并接上开头justify提出的质问。\n\n**选项类型：正确同义改写。**\n\nunreasonable是“不合理的”，remains保留“仍然”的判断。作者先用justify质问再次涨价，再以but it is still强调今年虽比去年略低、却仍高于通胀。D把让步之后没有改变的评价概括出来，既对准涨价措施，也保留转折后的重心。\n\n需要比较的不是今年涨幅有没有下降，而是下降后是否已足以合理化乘客的额外负担。原文没有接受涨价理由，因此不能因a fraction lower而把作者态度改成赞同。D与全文要求改善服务后再谈持续付费的方向一致。\n\n**出处：**\n\n> How can Britain’s train operators possibly justify yet another increase to rail passenger fares?\n>\n> This year's rise, an average of 2.7 per cent, may be a fraction lower than last year's, but it is still well above the official Consumer Price Index (CPI) measure of inflation.","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"21","option":"D"},"focusId":"focus-q21-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q21-D-0\">\u003cblockquote>\n\u003cp>仍然是一项不合理的措施\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“remains an [xxx] measure”，保留了相应遮挡。当时的定位线索是：D的 remains 保留“即使有变化也仍如此”的意思，第1段but it is still也有这个转折，所以回看今年涨幅和CPI的比较，并接上开头justify提出的质问。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>unreasonable是“不合理的”，remains保留“仍然”的判断。作者先用justify质问再次涨价，再以but it is still强调今年虽比去年略低、却仍高于通胀。D把让步之后没有改变的评价概括出来，既对准涨价措施，也保留转折后的重心。\u003c/p>\n\u003cp>需要比较的不是今年涨幅有没有下降，而是下降后是否已足以合理化乘客的额外负担。原文没有接受涨价理由，因此不能因a fraction lower而把作者态度改成赞同。D与全文要求改善服务后再谈持续付费的方向一致。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>How can Britain’s train operators possibly just ed such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer. Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey? Equally, there is a sense that the travails of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor infrastructure of the Midlands and the North.\n\n政府以使用者而非普通纳税人承担铁路成本为理由，拿开车的林肯郡退休者与乘火车的萨里郡股票经纪人作对照。职业和居住地帮助塑造例子，决定分组的是是否使用铁路。","context":{"mode":"image","asset":"questions","focus":[250,772,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"question":"22","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The stockbroker in Paragraph 2 is used to stand for ______.\u003cbr>第2段中的股票经纪人被用来代表哪一类人？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物举例作用题。题干要求判断“第2段中的股票经纪人被用来代表哪一类人？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer. Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey? Equally, there is a sense that the travails of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor infrastructure of the Midlands and the North.\u003c/p>\n\u003c/blockquote>\n\u003cp>政府以使用者而非普通纳税人承担铁路成本为理由，拿开车的林肯郡退休者与乘火车的萨里郡股票经纪人作对照。职业和居住地帮助塑造例子，决定分组的是是否使用铁路。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. car drivers","level":3,"raw":"### A. car drivers\n\n> 汽车驾驶者\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 car drivers 对应第2段 car-driving pensioner里的开车动作，所以回看Why开头的反问，确认开车的修饰语跟退休者还是股票经纪人相连。\n\n**错误类型：第一类——歪曲原意。**\n\n原文 car-driving pensioner 把开车明确放在来自林肯郡的退休者身上，另一边才是来自萨里郡的股票经纪人及其daily commute。A的 car drivers 把退休者的交通方式搬给了题干所问的股票经纪人。两个人在一个句子里出现，但分别承担前一句中的两类角色，不能把修饰其中一人的词贴给另一个人。\n\nA取的是反问另一边那个人的交通方式，不能代表题干所问的股票经纪人。\n\n**命题人借用的原文材料：**\n\n> Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey?","context":{"mode":"image","asset":"questions","focus":[250,870,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"22","option":"A"},"focusId":"focus-q22-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q22-A-0\">\u003cblockquote>\n\u003cp>汽车驾驶者\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 car drivers 对应第2段 car-driving pensioner里的开车动作，所以回看Why开头的反问，确认开车的修饰语跟退休者还是股票经纪人相连。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文 car-driving pensioner 把开车明确放在来自林肯郡的退休者身上，另一边才是来自萨里郡的股票经纪人及其daily commute。A的 car drivers 把退休者的交通方式搬给了题干所问的股票经纪人。两个人在一个句子里出现，但分别承担前一句中的两类角色，不能把修饰其中一人的词贴给另一个人。\u003c/p>\n\u003cp>A取的是反问另一边那个人的交通方式，不能代表题干所问的股票经纪人。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey?\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. car drivers","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第2段的股票经纪人代表汽车驾驶者。\n\nA的 car drivers 对应第2段 car-driving pensioner里的开车动作，所以回看Why开头的反问，确认开车的修饰语跟退休者还是股票经纪人相连。\n\n原文 car-driving pensioner 把开车明确放在来自林肯郡的退休者身上，另一边才是来自萨里郡的股票经纪人及其daily commute。A的 car drivers 把退休者的交通方式搬给了题干所问的股票经纪人。两个人在一个句子里出现，但分别承担前一 r把一般纳税人与铁路使用者区别开，接着用不坐火车的开车退休者对照股票经纪人的通勤。D的 ordinary taxpayers 把股票经纪人代表的对象换成了另一边的一般纳税人。股票经纪人在生活中也可能纳税，但题干问作者拿他代表哪类人，不是问他是否有纳税身份；在这里他的daily commute对应的是铁路使用者承担成本这一边。\u003c/p>\n\u003cp>例子的对照角色由前一句费用由谁承担决定，D把作为铁路使用者的通勤者换到了一般纳税人那一边。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer.\u003c/p>\n\u003cp>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey?\u003c/p>\n\u003cp>政府以使用者而非普通纳税人承担铁路成本为理由，拿开车的林肯郡退休者与乘火车的萨里郡股票经纪人作对照。职业和居住地帮助塑造例子，决定分组的是是否使用铁路。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The stockbroker stands for ordinary taxpayers who finance services they do not use.\u003c/p>\n\u003cp>股票经纪人代表为自己不用的服务付费的普通纳税人。\u003c/p>\n\u003c/blockquote>\n\u003cp>政府论点明确把users与general taxpayer分开，股票经纪人属于前者。一个铁路乘客现实中也可能纳税，但不能据此将例子承担的论证位置换到另一边。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q22-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认票价与乘客负担需要合理解释，不能单独判断股票经纪人在该例中代表哪类人；这一身份必须按例子前的成本分担关系确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>ordinary taxpayers\u003cbr>普通纳税人\u003c/p>\n\u003c/blockquote>\n\u003cp>例子的对照角色由前一句费用由谁承担决定，D把作为铁路使用者的通勤者换到了一般纳税人那一边。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。\u003c/p>\n\u003cp>本项最终仍要根据“those who use it”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"22题结论","level":2,"raw":"### 22题结论\n\n> **22. B. rail travellers**\n\nA：开车的是反问中的退休者，不是股票经纪人所代表的群体。\n\nB：股票经纪人的铁路通勤代表使用铁路、被要求承担成本的人。\n\nC：投资职业和居住地只是人物细节，不能替代例子的乘客身份。\n\nD：普通纳税人是与铁路使用者对照的一方，不能与例中通勤者对调。","context":{"mode":"image","asset":"questions","focus":[250,772,1800,452],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"question":"22","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>22. B. rail travellers\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：开车的是反问中的退休者，不是股票经纪人所代表的群体。\u003c/p>\n\u003cp>B：股票经纪人的铁路通勤代表使用铁路、被要求承担成本的人。\u003c/p>\n\u003cp>C：投资职业和居住地只是人物细节，不能替代例子的乘客身份。\u003c/p>\n\u003cp>D：普通纳税人是与铁路使用者对照的一方，不能与例中通勤者对调。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"23题 · 题干、题型与核心出处","level":2,"raw":"## 23题\n\n> It is indicated in Paragraph 3 that train operators ______.  \n> 第3段表明，火车运营商怎么样？\n\n### 题型\n\n段落推断题。题干要求判断“第3段表明，火车运营商怎么样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years. It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel. The responsibility for the latest wave of strikes rests on the unions. However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\n\n运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。","context":{"mode":"image","asset":"questions","focus":[250,1301,1800,451],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"question":"23","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>It is indicated in Paragraph 3 that train operators ______.\u003cbr>第3段表明，火车运营商怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>段落推断题。题干要求判断“第3段表明，火车运营商怎么样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years. It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel. The responsibility for the latest wave of strikes rests on the unions. However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003c/blockquote>\n\u003cp>运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. are offering compensation to commuters","level":3,"raw":"### A. are offering compensation to commuters\n\n> 正在向通勤者提供补偿\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 are offering compensation 与第3段 should receive compensation 都谈补偿，所以回看段末there is a strong case之后，判断它是在提出应当怎样做，还是报道运营商正在支付。\n\n**错误类型：第一类——歪曲原意。**\n\n原文should receive compensation提出应当履行的补救，并未报告补偿已经实施。把应然换成正在发生，会消除作者对实际服务和补偿的批评。\n\n**命题人借用的原文材料：**\n\n> However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"23","option":"A"},"focusId":"focus-q23-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-A-0\">\u003cblockquote>\n\u003cp>正在向通勤者提供补偿\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 are offering compensation 与第3段 should receive compensation 都谈补偿，所以回看段末there is a strong case之后，判断它是在提出应当怎样做，还是报道运营商正在支付。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文should receive compensation提出应当履行的补救，并未报告补偿已经实施。把应然换成正在发生，会消除作者对实际服务和补偿的批评。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. are offering compensation to commuters","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第3段表明铁路运营商正在向通勤者提供补偿。\n\nA的 are offering compensation 与第3段 should receive compensation 都谈补偿，所以回看段末there is a strong case之后，判断它是在提出应当怎样做，还是报道运营商正在支付。\n\n原文 should receive compensation 是说受影响最严重的人应当得到补偿，there is a strong case也在说明这样做有充分理由。A的 are offering compensation 却说运营商已经正在补偿，把应当采取的行动写成已经发生的事实。句中没有把支付者的实际动作放在现在进行时里，作者正在提出的是对乘客应有待遇的要求。","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"23","option":"A"},"focusId":"focus-q23-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-A-0\">\u003cblockquote>\n\u003cp>正在向通勤者提供补偿\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 are offering compensation 与第3段 should receive compensation 都谈补偿，所以回看段末there is a strong case之后，判断它是在提出应当怎样做，还是报道运营商正在支付。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文should receive compensation提出应当履行的补救，并未报告补偿已经实施。把应然换成正在发生，会消除作者对实际服务和补偿的批评。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第3段表明铁路运营商正在向通勤者提供补偿。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 are offering compensation 与第3段 should receive compensation 都谈补偿，所以回看段末there is a strong case之后，判断它是在提出应当怎样做，还是报道运营商正在支付。\u003c/p>\n\u003cp>原文 should receive compensation 是说受影响最严重的人应当得到补偿，there is a strong case也在说明这样做有充分理由。A的 are offering compensation 却说运营商已经正在补偿，把应当采取的行动写成已经发生的事实。句中没有把支付者的实际动作放在现在进行时里，作者正在提出的是对乘客应有待遇的要求。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. are offering compensation to commuters","level":4,"raw":"#### 写作视角法\n\n原文第3段是这样写的：\n\n> However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\n>\n> 运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\n\n把这一处放回全文，它承担的写作任务是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Train operators are already compensating commuters for the disruption.\n>\n> 铁路运营商已经在补偿受中断影响的通勤者。\n\n原文should receive compensation提出应当履行的补救，并未报告补偿已经实施。把应然换成正在发生，会消除作者对实际服务和补偿的批评。","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"23","option":"A"},"focusId":"focus-q23-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-A-0\">\u003cblockquote>\n\u003cp>正在向通勤者提供补偿\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 are offering compensation 与第3段 should receive compensation 都谈补偿，所以回看段末there is a strong case之后，判断它是在提出应当怎样做，还是报道运营商正在支付。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文should receive compensation提出应当履行的补救，并未报告补偿已经实施。把应然换成正在发生，会消除作者对实际服务和补偿的批评。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第3段表明铁路运营商正在向通勤者提供补偿。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 are offering compensation 与第3段 should receive compensation 都谈补偿，所以回看段末there is a strong case之后，判断它是在提出应当怎样做，还是报道运营商正在支付。\u003c/p>\n\u003cp>原文 should receive compensation 是说受影响最严重的人应当得到补偿，there is a strong case也在说明这样做有充分理由。A的 are offering compensation 却说运营商已经正在补偿，把应当采取的行动写成已经发生的事实。句中没有把支付者的实际动作放在现在进行时里，作者正在提出的是对乘客应有待遇的要求。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003cp>运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Train operators are already compensating commuters for the disruption.\u003c/p>\n\u003cp>铁路运营商已经在补偿受中断影响的通勤者。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文should receive compensation提出应当履行的补救，并未报告补偿已经实施。把应然换成正在发生，会消除作者对实际服务和补偿的批评。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. are offering compensation to commuters","level":4," title":"B. are trying to repair relations with the unions","level":3,"raw":"### B. are trying to repair relations with the unions\n\n> 正在努力修复与工会的关系\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B的 repair relations with the unions 指向运营商与工会，但第3段改善的对象是 the network，而工会出现在strikes责任那句，因此把这两处回看在一起，确认改善和工会有没有连成同一动作。\n\n**错误类型：第三类——无中生有。**\n\n原文 the network 接在improvements之后，说运营商对铁路网络的改善；工会则是最新罢工责任所在。B的 repair relations with the unions 把“改善铁路网络”换成“修复劳资关系”，又把工会从承担罢工责任的一方放进运营商正在修复关系的动作里。两句话分别谈服务改善和罢工责任，不能把它们拼成运营商与工会正在和解。\n\nthe network是实际改善的对象，unions是责任所归的一方，B把两个不同句子的关系重新连接了。\n\n**命题人借用的原文材料：**\n\n> It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel.\n>\n> The responsibility for the latest wave of strikes rests on the unions.","context":{"mode":"image","asset":"questions","focus":[250,1487,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"23","option":"B"},"focusId":"focus-q23-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-B-0\">\u003cblockquote>\n\u003cp>正在努力修复与工会的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 repair relations with the unions 指向运营商与工会，但第3段改善的对象是 the network，而工会出现在strikes责任那句，因此把这两处回看在一起，确认改善和工会有没有连成同一动作。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 the network 接在improvements之后，说运营商对铁路网络的改善；工会则是最新罢工责任所在。B的 repair relations with the unions 把“改善铁路网络”换成“修复劳资关系”，又把工会从承担罢工责任的一方放进运营商正在修复关系的动作里。两句话分别谈服务改善和罢工责任，不能把它们拼成运营商与工会正在和解。\u003c/p>\n\u003cp>the network是实际改善的对象，unions是责任所归的一方，B把两个不同句子的关系重新连接了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It is all very well train operators trumpeting the improvements they ar  level of service 就是服务要求，因此回看乘客经历严重罢工与but后面应有服务的两处。\u003c/p>\n\u003cp>adequate是“足够的、达到要求的”。严重罢工造成的现实中断，与作者要求a basic level of service之间形成落差；have failed to provide概括的正是乘客付了可观费用却未得到应有服务。\u003c/p>\n\u003cp>作者说明当前罢工责任在工会，并不撤回运营商向付费乘客交付基本服务的要求。C也没有把提供不足说成完全没有任何列车，更没有擅自量化公司的经济损失，因而概括的范围受原文支持。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-C-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years.\u003c/p>\n\u003cp>It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel.\u003c/p>\n\u003cp>运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers have paid for a basic service that operators have failed to deliver adequately.\u003c/p>\n\u003cp>乘客已经购买基本服务，运营商却未能充分兑现。\u003c/p>\n\u003c/blockquote>\n\u003cp>basic service对应adequate service，罢工造成的中断说明承诺没有充分兑现。作者承认工会负有当前罢工责任，也仍强调乘客付钱后应得到服务，这两点并不冲突。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认持续涨价正受到质疑，不能单独证明运营商采取了哪些行动或遭受多少损失；本题仍要看第3段付费乘客实际得到的服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>have failed to provide an adequate service\u003cbr>未能提供足够好的服务\u003c/p>\n\u003c/blockquote>\n\u003cp>作者说明当前罢工责任在工会，并不撤回运营商向付费乘客交付基本服务的要求。C也没有把提供不足说成完全没有任何列车，更没有擅自量化公司的经济损失，因而概括的范围受原文支持。\u erienced some of the worst rail strikes in years.\u003c/p>\n\u003cp>However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003cp>运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The strikes have caused huge financial losses for the train operators.\u003c/p>\n\u003cp>罢工让铁路运营商遭受巨大财务损失。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要说明损失承担者、收入变化及巨大程度。段中承受不便、应获补偿的是passengers；不能从乘客的遭遇推算运营商的损失规模。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. have suffered huge losses owing to the strikes","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Ever-rising Fares Aren’t Sustainable  \n> 不断上涨的票价难以持续\n\n把这个主旨直接代入23题题干：\n\n> 全文主旨只能确认持续涨价正受到质疑，不能单独证明运营商采取了哪些行动或遭受多少损失；本题仍要看第3段付费乘客实际得到的服务。\n\n但D实际说的是：\n\n> have suffered huge losses owing to the strikes  \n> 因罢工遭受了巨大损失\n\nD把这群乘客的遭遇转给了运营商，又补成巨额损失，主体与遭受的具体内容都变了。\n\n从全文推进看，这一处的作用是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。\n\n本项最终仍要根据“a basic level of service”这处局部原文判断。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,1663,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"23","option":"D"},"focusId":"focus-q23-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-D-0\">\u003cblockquote>\n\u003cp>因罢工遭受了巨大损失\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 have suffered huge losses 与段末 they have suffered 都说遭受了什么，所以回看they之前的those who，并接上段首those commuters，确认受影响的人是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 they have suffered 成：\u003c/p>\n\u003cblockquote>\n\u003cp>The strikes have caused huge financial losses for the train operators.\u003c/p>\n\u003cp>罢工让铁路运营商遭受巨大财务损失。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要说明损失承担者、收入变化及巨大程度。段中承受不便、应获补偿的是passengers；不能从乘客的遭遇推算运营商的损失规模。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认持续涨价正受到质疑，不能单独证明运营商采取了哪些行动或遭受多少损失；本题仍要看第3段付费乘客实际得到的服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>have suffered huge losses owing to the strikes\u003cbr>因罢工遭受了巨大损失\u003c/p>\n\u003c/blockquote>\n\u003cp>D把这群乘客的遭遇转给了运营商，又补成巨额损失，主体与遭受的具体内容都变了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。\u003c/p>\n\u003cp>本项最终仍要根据“a basic level of service”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"23题结论","level":2,"raw":"### 23题结论\n\n> **23. C. have failed to provide an adequate service**\n\nA：应当获赔是作者提出的补救要求，不是补偿已经实施的报告。\n\nB：原文评价罢工责任，没有报告运营商修复工会关系的行动。\n\nC：严重出行中断与付费后应得的基本服务形成落差，支持服务不足。\n\nD：乘客遭遇中断不能推出运营商的财务损失及其巨大程度。","context":{"mode":"image","asset":"questions","focus":[250,1301,1800,451],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"question":"23","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>23. C. have failed to provide an adequate service\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：应当获赔是作者提出的补救要求，不是补偿已经实施的报告。\u003c/p>\n\u003cp>B：原文评价罢工责任，没有报告运营商修复工会关系的行动。\u003c/p>\n\u003cp>C：严重出行中断与付费后应得的基本服务形成落差，支持服务不足。\u003c/p>\n\u003cp>D：乘客遭遇中断不能推出运营商的财务损失及其巨大程度。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"24题 · 题干、题型与核心出处","level":2,"raw":"## 24题\n\n> If unable to calm down passengers, the railways may have to face ______.  \n> 如果不能平息乘客的不满，铁路方面可能不得不面对什么？\n\n### 题型\n\n条件后果推断题。题干要求判断“如果不能平息乘客的不满，铁路方面可能不得不面对什么？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> The Government has pledged to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate. This should form part of a wider package of measures to address the long-running problems on Britain's railways. Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, interrupted by regular chaos when timetables are changed, or planned maintenance is managed incompetently. The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\n\n末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,451],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"question":"24","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>If unable to calm down passengers, the railways may have to face ______.\u003cbr>如果不能平息乘客的不满，铁路方面可能不得不面对什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>条件后果推断题。题干要求判断“如果不能平息乘客的不满，铁路方面可能不得不面对什么？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The Government has pledged to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate. This should form part of a wider package of measures to address the long-running problems on Britain&#39;s railways. Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, interrupted by regular chaos when timetables are changed, or planned maintenance is managed incompetently. The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. a change of ownership","level":3,"raw":"### A. a change of ownership\n\n> 所有权的改变\n\n**做题模式中的状态：** 第一轮A保留。当时的定位线索是：A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\n\n**选项类型：正确局部推断。**\n\n原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\n\nnationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\n\n**出处：**\n\n> The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"24","option":"A"},"focusId":"focus-q24-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-A-0\">\u003cblockquote>\n\u003cp>所有权的改变\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\u003c/p>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. a change of ownership","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 如果不能平息乘客不满，铁路可能不得不面对所有权的改变。\n\nA的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\n\n原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\n\nnationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"24","option":"A"},"focusId":"focus-q24-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-A-0\">\u003cblockquote>\n\u003cp>所有权的改变\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\u003c/p>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能平息乘客不满，铁路可能不得不面对所有权的改变。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\u003c/p>\n\u003cp>原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\u003c/p>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. a change of ownership","level":4,"raw":"#### 写作视角法\n\n原文第4段是这样写的：\n\n> The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\n>\n> 末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\n\n把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Unless passengers’ anger is addressed, the railways may come under state ownership.\n>\n> 如果不处理乘客愤怒，铁路可能转为国家所有。\n\nnationalisation就是所有权向国家转移；may保持原文threat的可能性，没有说已经决定国有化。ownership概括的是制度层面的后果。","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"24","option":"A"},"focusId":"focus-q24-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-A-0\">\u003cblockquote>\n\u003cp>所有权的改变\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\u003c/p>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能平息乘客不满，铁路可能不得不面对所有权的改变。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\u003c/p>\n\u003cp>原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\u003c/p>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Unless passengers’ anger is addressed, the railways may come under state ownership.\u003c/p>\n\u003cp>如果不处理乘客愤怒，铁路可能转为国家所有。\u003c/p>\n\u003c/blockquote>\n\u003cp>nationalisation就是所有权向国家转移；may保持原文threat的可能性，没有说已经决定国有化。ownership概括的是制度层面的后果。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. a change of ownership","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Ever-rising Fares Aren’t Sustainable  \n> 不断上涨的票价难以持续\n\n把这个主旨直接代入24题题干：\n\n> 全文主旨只能确认铁路不能一直忽视乘客不满，不能决定具体后果是所有权、收入、投资还是运营变化；需要末段明确写出的条件后果。\n\nA实际说的是：\n\n> a change of ownership  \n> 所有权的改变\n\nnationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\n\n从全文推进看，这一处的作用是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\n\n本项最终仍要根据“The threat of nationalisation”这处局部原文判断。\n\n**复盘判断：A正确。**","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"24","option":"A"},"focusId":"focus-q24-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-A-0\">\u003cblockquote>\n\u003cp>所有权的改变\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\u003c/p>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能平息乘客不满，铁路可能不得不面对所有权的改变。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\u003c/p>\n\u003cp>原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\u003c/p>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Unless passengers’ anger is addressed, the railways may come under state ownership.\u003c/p>\n\u003cp>如果不处理乘客愤怒，铁路可能转为国家所有。\u003c/p>\n\u003c/blockquote>\n\u003cp>nationalisation就是所有权向国家转移；may保持原文threat的可能性，没有说已经决定国有化。ownership概括的是制度层面的后果。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认铁路不能一直忽视乘客不满，不能决定具体后果是所有权、收入、投资还是运营变化；需要末段明确写出的条件后果。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a change of ownership\u003cbr>所有权的改变\u003c/p>\n\u003c/blockquote>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\u003c/p>\n\u003cp>本项最终仍要根据“The threat of nationalisation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. a reduction of revenue","level":3,"raw":"### B. a reduction of revenue\n\n> 收入的减少\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B的 a reduction of revenue 涉及收入变化，第4段相近的是pay more，都是乘客付款与铁路收钱的问题，因此回看乘客不愿多付钱的条件句，再对照末句明确说要回来的威胁。\n\n**错误类型：第三类——无中生有。**\n\n原文pay more是在说乘客不愿继续增加支付，条件是同时忍受不可靠的服务；B的a reduction of revenue却说铁路收入比原来减少。不愿再多付与总收入减少不是同一种变化，不能把拒绝继续加价写成已经少付。题干的无法平息愤怒更直接接末句国有化威胁回来，B还把这个明确条件后果换成了财务总额变化。\n\n前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。\n\n**命题人借用的原文材料：**\n\n> Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, interrupted by regular chaos when timetables are changed, or planned maintenance is managed incompetently.\n>\n> The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.","context":{"mode":"image","asset":"questions","focus":[250,2015,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"24","option":"B"},"focusId":"focus-q24-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-B-0\">\u003cblockquote>\n\u003cp>收入的减少\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 a reduction of revenue 涉及收入变化，第4段相近的是pay more，都是乘客付款与铁路收钱的问题，因此回看乘客不愿多付钱的条件句，再对照末句明确说要回来的威胁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文pay more是在说乘客不愿继续增加支付，条件是同时忍受不可靠的服务；B的a reduction of revenue却说铁路收入比原来减少。不愿再多付与总收入减少不是同一种变化，不能把拒绝继续加价写成已经少付。题干的无法平息愤怒更直接接末句国有化威胁回来，B还把这个明确条件后果换成了财务总额变化。\u003c/p>\n\u003cp>前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, interrupted by regular chaos when timetables are changed, or planned maintenance is managed incompetently.\u003c/p>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. a reduction of revenue","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 如果不能平息乘客不满，铁路可能不得不面对收入的减少。\n\nB的 a reduction of revenue 涉及收入变化，第4段相近的是pay more，都是乘客付款与铁路收钱的问题，因此回看乘客不愿多付钱的条件句，再对照末句明确说要回来的威胁。\n\n原文pay more是在说乘客不愿继续增加支付，条件是同时忍受不可靠的服务；B的a reduction of revenue却说铁路收入比原来减少。不愿再多付与总收入减少不是同一种变化，不能把拒绝继续加价写成已经少付。题干的无法平息愤怒更直接接末句国有化威胁回来，B还把这个明确条件后果换成了财务总额变化。\n\n前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。","context":{"mode":"image","asset":"questions","focus":[250,2015,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"24","option":"B"},"focusId":"focus-q24-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-B-0\">\u003cblockquote>\n\u003cp>收入的减少\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 a reduction of revenue 涉及收入变化，第4段相近的是pay more，都是乘客付款与铁路收钱的问题，因此回看乘客不愿多付钱的条件句，再对照末句明确说要回来的威胁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文pay more是在说乘客不愿继续增加支付，条件是同时忍受不可靠的服务；B的a reduction of revenue却说铁路收入比原来减少。不愿再多付与总收入减少不是同一种变化，不能把拒绝继续加价写成已经少付。题干的无法平息愤怒更直接接末句国有化威胁回来，B还把这个明确条件后果换成了财务总额变化。\u003c/p>\n\u003cp>前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, interrupted by regular chaos when timetables are changed, or planned maintenance is managed incompetently.\u003c/p>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-B-1\  not addressed in short order.\u003c/p>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Failure to calm passengers will reduce railway revenue.\u003c/p>\n\u003cp>无法安抚乘客会使铁路收入下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>收入下降需要退票、客流减少或收入数据的后续说明。文中乘客不少没有替代出行方式，末句也没有转向营收，而是明确点出国有化压力。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. a reduction of revenue","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> Ever-rising Fares Aren’t Sustainable  \n> 不断上涨的票价难以持续\n\n把这个主旨直接代入24题题干：\n\n> 全文主旨只能确认铁路不能一直忽视乘客不满，不能决定具体后果是所有权、收入、投资还是运营变化；需要末段明确写出的条件后果。\n\n但B实际说的是：\n\n> a reduction of revenue  \n> 收入的减少\n\n前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。\n\n从全文推进看，这一处的作用是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\n\n本项最终仍要根据“The threat of nationalisation”这处局部原文判断。\n\n**复盘判断：B错误。**","context":{"mode":"image","asset":"questions","focus":[250,2015,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"24","option":"B"},"focusId":"focus-q24-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-B-0\">\u003cblockquote>\n\u003cp>收入的减少\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 a reduction of revenue 涉及收入变化，第4段相近的是pay more，都是乘客付款与铁路收钱的问题，因此回看乘客不愿多付钱的条件句，再对照末句明确说要回来的威胁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文pay more是在说乘客不愿继续增加支付，条件是同时忍受不可靠的服务；B的a reduction of revenue却说铁路收入比原来减少。不愿再多付与总收入减少不是同一种变化，不能把拒绝继续加价写成已经少付。题干的无法平息愤怒更直接接末句国有化威胁回来，B还把这个明确条件后果换成了财务总额变化。\u003c/p>\n\u003cp>前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, interrupted by regular chaos when timetables are changed, or planned maintenance is managed incompetently.\u003c/p>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能平息乘客不满，铁路可能不得不面对收入的减少。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 a reduction of revenue 涉及收入变化，第4段相近的是pay more，都是乘客付款与铁路收钱的问题，因此回看乘客不愿多付钱的条件句，再对照末句明确说要回来的威胁。\u003c/p>\n\u003cp>原文pay more是在说乘客不愿继续增加支付，条件是同时忍受不可靠的服务；B的a reduction of revenue却说铁路收入比原来减少。不愿再多付与总收入减少不是同一种变化，不能把拒绝继续加价写成已经少付。题干的无法平息愤怒更直接接末句国有化威胁回来，B还把这个明确条件后果换成了财务总额变化。\u003c/p>\n\u003cp>前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, interrupted by regular chaos when timetables are changed, or planned maintenance is managed incompetently.\u003c/p>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Failure to calm passengers will reduce railway revenue.\u003c/p>\n\u003cp>无法安抚乘客会使铁路收入下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>收入下降需要退票、客流减少或收入数据的后续说明。文中乘客不少没有替代出行方式，末句也没有转向营收，而是明确点出国有化压力。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认铁路不能一直忽视乘客不满，不能决定具体后果是所有权、收入、投资还是运营变化；需要末段明确写出的条件后果。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a reduction of revenue\u003cbr>收入的减少\u003c/p>\n\u003c/blockquote>\n\u003cp>前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\u003c/p>\n\u003cp>本项最终仍要根据“The threat of nationalisation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. the loss of investment","level":3,"raw":"### C. the loss of investment\n\n> 投资的流失\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C的 the loss of investment 让我们回看more investment is needed，两边都提投资，所以把投资需求那句与末尾乘客愤怒的条件一起看，分清需要更多和失去已有投资。\n\n**错误类型：第三类——无中生有。**\n\n原文more investment is needed承认铁路需要增加投入；C的the loss of investment则说乘客愤怒将造成投资流失。需要更多投入不能自动反转成已有资金会被撤走；而且末句if直接连接的是国有化威胁重新出现，不是投资方撤资。这里投资属于作者承认的改善需求，C把需求改成乘客不满导致的资金损失。\n\n一个是投入需求，一个是带着因果的资金流失，原文明确的条件结果又是国有化威胁，C把这两处重新拼成了另一条关系。\n\n**命题人借用的原文材料：**\n\n> The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.","context":{"mode":"image","asset":"questions","focus":[250,2103,1800,85],"sourceW":2256,"sourceH":3142,"label":"2021英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"24","option":"C"},"focusId":"focus-q24-C-0","html":"\u003csection class=\"reveal rong>\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能平息乘客不满，铁路可能不得不面对投资的流失。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 the loss of investment 让我们回看more investment is needed，两边都提投资，所以把投资需求那句与末尾乘客愤怒的条件一起看，分清需要更多和失去已有投资。\u003c/p>\n\u003cp>原文more investment is needed承认铁路需要增加投入；C的the loss of investment则说乘客愤怒将造成投资流失。需要更多投入不能自动反转成已有资金会被撤走；而且末句if直接连接的是国有化威胁重新出现，不是投资方撤资。这里投资属于作者承认的改善需求，C把需求改成乘客不满导致的资金损失。\u003c/p>\n\u003cp>一个是投入需求，一个是带着因果的资金流失，原文明确的条件结果又是国有化威胁，C把这两处重新拼成了另一条关系。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-C-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Angry passengers will cause investors to withdraw their money from the railways.\u003c/p>\n\u003cp>乘客愤怒将使投资者撤出铁路资金。\u003c/p>\n\u003c/blockquote>\n\u003cp>more investment is needed是在承认铁路需要投入，不是报告资金撤出。要支持loss，作者必须交代投资者的反应，不能把投资需求直接改成投资流失。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨
