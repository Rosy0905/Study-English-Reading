所以进入例子，是因为他的铁路通勤会产生费用；段中没有他的投资行为或当地资本流动。C抓住职业与地点，漏掉例子的功能。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。\u003c/p>\n\u003cp>本项最终仍要根据“those who use it”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. ordinary taxpayers\u003c/h3>\n\u003cblockquote>\n\u003cp>普通纳税人\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 ordinary taxpayers 与第2段 the general taxpayer意思相近，所以回看rather than前后，再看股票经纪人和开车退休者分别接到哪一边。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文用rather than the general taxpayer把一般纳税人与铁路使用者区别开，接着用不坐火车的开车退休者对照股票经纪人的通勤。D的 ordinary taxpayers 把股票经纪人代表的对象换成了另一边的一般纳税人。股票经纪人在生活中也可能纳税，但题干问作者拿他代表哪类人，不是问他是否有纳税身份；在这里他的daily commute对应的是铁路使用者承担成本这一边。\u003c/p>\n\u003cp>例子的对照角色由前一句费用由谁承担决定，D把作为铁路使用者的通勤者换到了一般纳税人那一边。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer.\u003c/p>\n\u003cp>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的股票经纪人代表普通纳税人。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 ordinary taxpayers 与第2段 the general taxpayer意思相近，所以回看rather than前后，再看股票经纪人和开车退休者分别接到哪一边。\u003c/p>\n\u003cp>原文用rather than the general taxpayer把一般纳税人与铁路使用者区别开，接着用不坐火车的开车退休者对照股票经纪人的通勤。D的 ordinary taxpayers 把股票经纪人代表的对象换成了另一边的一般纳税人。股票经纪人在生活中也可能纳税，但题干问作者拿他代表哪类人，不是问他是否有纳税身份；在这里他的daily commute对应的是铁路使用者承担成本这一边。\u003c/p>\n\u003cp>例子的对照角色由前一句费用由谁承担决定，D把作为铁路使用者的通勤者换到了一般纳税人那一边。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer.\u003c/p>\n\u003cp>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey?\u003c/p>\n\u003cp>政府以使用者而非普通纳税人承担铁路成本为理由，拿开车的林肯郡退休者与乘火车的萨里郡股票经纪人作对照。职业和居住地帮助塑造例子，决定分组的是是否使用铁路。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The stockbroker stands for ordinary taxpayers who finance services they do not use.\u003c/p>\n\u003cp>股票经纪人代表为自己不用的服务付费的普通纳税人。\u003c/p>\n\u003c/blockquote>\n\u003cp>政府论点明确把users与general taxpayer分开，股票经纪人属于前者。一个铁路乘客现实中也可能纳税，但不能据此将例子承担的论证位置换到另一边。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认票价与乘客负担需要合理解释，不能单独判断股票经纪人在该例中代表哪类人；这一身份必须按例子前的成本分担关系确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>ordinary taxpayers\u003cbr>普通纳税人\u003c/p>\n\u003c/blockquote>\n\u003cp>例子的对照角色由前一句费用由谁承担决定，D把作为铁路使用者的通勤者换到了一般纳税人那一边。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。\u003c/p>\n\u003cp>本项最终仍要根据“those who use it”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>22题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>22. B. rail travellers\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：开车的是反问中的退休者，不是股票经纪人所代表的群体。\u003c/p>\n\u003cp>B：股票经纪人的铁路通勤代表使用铁路、被要求承担成本的人。\u003c/p>\n\u003cp>C：投资职业和居住地只是人物细节，不能替代例子的乘客身份。\u003c/p>\n\u003cp>D：普通纳税人是与铁路使用者对照的一方，不能与例中通勤者对调。\u003c/p>\n\u003ch2>23题\u003c/h2>\n\u003cblockquote>\n\u003cp>It is indicated in Paragraph 3 that train operators ______.\u003cbr>第3段表明，火车运营商怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>段落推断题。题干要求判断“第3段表明，火车运营商怎么样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years. It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel. The responsibility for the latest wave of strikes rests on the unions. However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003c/blockquote>\n\u003cp>运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\u003c/p>\n\u003ch3>A. are offering compensation to commuters\u003c/h3>\n\u003cblockquote>\n\u003cp>正在向通勤者提供补偿\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 are offering compensation 与第3段 should receive compensation 都谈补偿，所以回看段末there is a strong case之后，判断它是在提出应当怎样做，还是报道运营商正在支付。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文should receive compensation提出应当履行的补救，并未报告补偿已经实施。把应然换成正在发生，会消除作者对实际服务和补偿的批评。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第3段表明铁路运营商正在向通勤者提供补偿。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 are offering compensation 与第3段 should receive compensation 都谈补偿，所以回看段末there is a strong case之后，判断它是在提出应当怎样做，还是报道运营商正在支付。\u003c/p>\n\u003cp>原文 should receive compensation 是说受影响最严重的人应当得到补偿，there is a strong case也在说明这样做有充分理由。A的 are offering compensation 却说运营商已经正在补偿，把应当采取的行动写成已经发生的事实。句中没有把支付者的实际动作放在现在进行时里，作者正在提出的是对乘客应有待遇的要求。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003cp>运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Train operators are already compensating commuters for the disruption.\u003c/p>\n\u003cp>铁路运营商已经在补偿受中断影响的通勤者。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文should receive compensation提出应当履行的补救，并未报告补偿已经实施。把应然换成正在发生，会消除作者对实际服务和补偿的批评。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认持续涨价正受到质疑，不能单独证明运营商采取了哪些行动或遭受多少损失；本题仍要看第3段付费乘客实际得到的服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>are offering compensation to commuters\u003cbr>正在向通勤者提供补偿\u003c/p>\n\u003c/blockquote>\n\u003cp>原文 should receive compensation 是说受影响最严重的人应当得到补偿，there is a strong case也在说明这样做有充分理由。A的 are offering compensation 却说运营商已经正在补偿，把应当采取的行动写成已经发生的事实。句中没有把支付者的实际动作放在现在进行时里，作者正在提出的是对乘客应有待遇的要求。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。\u003c/p>\n\u003cp>本项最终仍要根据“a basic level of service”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. are trying to repair relations with the unions\u003c/h3>\n\u003cblockquote>\n\u003cp>正在努力修复与工会的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 repair relations with the unions 指向运营商与工会，但第3段改善的对象是 the network，而工会出现在strikes责任那句，因此把这两处回看在一起，确认改善和工会有没有连成同一动作。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 the network 接在improvements之后，说运营商对铁路网络的改善；工会则是最新罢工责任所在。B的 repair relations with the unions 把“改善铁路网络”换成“修复劳资关系”，又把工会从承担罢工责任的一方放进运营商正在修复关系的动作里。两句话分别谈服务改善和罢工责任，不能把它们拼成运营商与工会正在和解。\u003c/p>\n\u003cp>the network是实际改善的对象，unions是责任所归的一方，B把两个不同句子的关系重新连接了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel.\u003c/p>\n\u003cp>The responsibility for the latest wave of strikes rests on the unions.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第3段表明铁路运营商正在努力修复与工会的关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 repair relations with the unions 指向运营商与工会，但第3段改善的对象是 the network，而工会出现在strikes责任那句，因此把这两处回看在一起，确认改善和工会有没有连成同一动作。\u003c/p>\n\u003cp>原文 the network 接在improvements之后，说运营商对铁路网络的改善；工会则是最新罢工责任所在。B的 repair relations with the unions 把“改善铁路网络”换成“修复劳资关系”，又把工会从承担罢工责任的一方放进运营商正在修复关系的动作里。两句话分别谈服务改善和罢工责任，不能把它们拼成运营商与工会正在和解。\u003c/p>\n\u003cp>the network是实际改善的对象，unions是责任所归的一方，B把两个不同句子的关系重新连接了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel.\u003c/p>\n\u003cp>The responsibility for the latest wave of strikes rests on the unions.\u003c/p>\n\u003cp>运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Operators are taking steps to rebuild their relations with the unions.\u003c/p>\n\u003cp>运营商正在采取措施修复与工会的关系。\u003c/p>\n\u003c/blockquote>\n\u003cp>这一路线应交代谈判、让步或和解行动。原文分辨谁对罢工负责，却没有叙述关系修复；提到工会并不足以证明运营商在改善关系。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认持续涨价正受到质疑，不能单独证明运营商采取了哪些行动或遭受多少损失；本题仍要看第3段付费乘客实际得到的服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>are trying to repair relations with the unions\u003cbr>正在努力修复与工会的关系\u003c/p>\n\u003c/blockquote>\n\u003cp>the network是实际改善的对象，unions是责任所归的一方，B把两个不同句子的关系重新连接了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。\u003c/p>\n\u003cp>本项最终仍要根据“a basic level of service”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. have failed to provide an adequate service\u003c/h3>\n\u003cblockquote>\n\u003cp>未能提供足够好的服务\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“have failed to provide an [xxx] service”，保留了相应遮挡。当时的定位线索是：C的 have failed to provide 要与乘客实际收到的服务比较，第3段的 a basic level of service 就是服务要求，因此回看乘客经历严重罢工与but后面应有服务的两处。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>adequate是“足够的、达到要求的”。严重罢工造成的现实中断，与作者要求a basic level of service之间形成落差；have failed to provide概括的正是乘客付了可观费用却未得到应有服务。\u003c/p>\n\u003cp>作者说明当前罢工责任在工会，并不撤回运营商向付费乘客交付基本服务的要求。C也没有把提供不足说成完全没有任何列车，更没有擅自量化公司的经济损失，因而概括的范围受原文支持。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years.\u003c/p>\n\u003cp>It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第3段表明铁路运营商未能提供足够好的服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 have failed to provide 要与乘客实际收到的服务比较，第3段的 a basic level of service 就是服务要求，因此回看乘客经历严重罢工与but后面应有服务的两处。\u003c/p>\n\u003cp>adequate是“足够的、达到要求的”。严重罢工造成的现实中断，与作者要求a basic level of service之间形成落差；have failed to provide概括的正是乘客付了可观费用却未得到应有服务。\u003c/p>\n\u003cp>作者说明当前罢工责任在工会，并不撤回运营商向付费乘客交付基本服务的要求。C也没有把提供不足说成完全没有任何列车，更没有擅自量化公司的经济损失，因而概括的范围受原文支持。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years.\u003c/p>\n\u003cp>It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel.\u003c/p>\n\u003cp>运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Passengers have paid for a basic service that operators have failed to deliver adequately.\u003c/p>\n\u003cp>乘客已经购买基本服务，运营商却未能充分兑现。\u003c/p>\n\u003c/blockquote>\n\u003cp>basic service对应adequate service，罢工造成的中断说明承诺没有充分兑现。作者承认工会负有当前罢工责任，也仍强调乘客付钱后应得到服务，这两点并不冲突。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认持续涨价正受到质疑，不能单独证明运营商采取了哪些行动或遭受多少损失；本题仍要看第3段付费乘客实际得到的服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>have failed to provide an adequate service\u003cbr>未能提供足够好的服务\u003c/p>\n\u003c/blockquote>\n\u003cp>作者说明当前罢工责任在工会，并不撤回运营商向付费乘客交付基本服务的要求。C也没有把提供不足说成完全没有任何列车，更没有擅自量化公司的经济损失，因而概括的范围受原文支持。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。\u003c/p>\n\u003cp>本项最终仍要根据“a basic level of service”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. have suffered huge losses owing to the strikes\u003c/h3>\n\u003cblockquote>\n\u003cp>因罢工遭受了巨大损失\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 have suffered huge losses 与段末 they have suffered 都说遭受了什么，所以回看they之前的those who，并接上段首those commuters，确认受影响的人是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文 they have suffered 接在应当得到补偿的受影响者之后，前面连续谈的是遭遇罢工、付钱出行的乘客。D的 have suffered huge losses 却把遭受者换成题干里的火车运营商，并给出huge losses这一具体巨大损失。\u003c/p>\n\u003cp>D把这群乘客的遭遇转给了运营商，又补成巨额损失，主体与遭受的具体内容都变了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years.\u003c/p>\n\u003cp>However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第3段表明铁路运营商因罢工遭受了巨大损失。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 have suffered huge losses 与段末 they have suffered 都说遭受了什么，所以回看they之前的those who，并接上段首those commuters，确认受影响的人是谁。\u003c/p>\n\u003cp>原文 they have suffered 接在应当得到补偿的受影响者之后，前面连续谈的是遭遇罢工、付钱出行的乘客。D的 have suffered huge losses 却把遭受者换成题干里的火车运营商，并给出huge losses这一具体巨大损失。\u003c/p>\n\u003cp>D把这群乘客的遭遇转给了运营商，又补成巨额损失，主体与遭受的具体内容都变了。\u003c/p>\n\u003cp>运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\u003c/p>\n\u003cp>这需要说明损失承担者、收入变化及巨大程度。段中承受不便、应获补偿的是passengers；不能从乘客的遭遇推算运营商的损失规模。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years.\u003c/p>\n\u003cp>However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.\u003c/p>\n\u003cp>运营商一面强调改善网络，一面让乘客遭遇严重罢工。作者说基本服务是乘客已经付费购买的东西，最受影响的人应当得到赔偿；should而非正在赔偿是关键。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The strikes have caused huge financial losses for the train operators.\u003c/p>\n\u003cp>罢工让铁路运营商遭受巨大财务损失。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要说明损失承担者、收入变化及巨大程度。段中承受不便、应获补偿的是passengers；不能从乘客的遭遇推算运营商的损失规模。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认持续涨价正受到质疑，不能单独证明运营商采取了哪些行动或遭受多少损失；本题仍要看第3段付费乘客实际得到的服务。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>have suffered huge losses owing to the strikes\u003cbr>因罢工遭受了巨大损失\u003c/p>\n\u003c/blockquote>\n\u003cp>D把这群乘客的遭遇转给了运营商，又补成巨额损失，主体与遭受的具体内容都变了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。\u003c/p>\n\u003cp>本项最终仍要根据“a basic level of service”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>23题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>23. C. have failed to provide an adequate service\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：应当获赔是作者提出的补救要求，不是补偿已经实施的报告。\u003c/p>\n\u003cp>B：原文评价罢工责任，没有报告运营商修复工会关系的行动。\u003c/p>\n\u003cp>C：严重出行中断与付费后应得的基本服务形成落差，支持服务不足。\u003c/p>\n\u003cp>D：乘客遭遇中断不能推出运营商的财务损失及其巨大程度。\u003c/p>\n\u003ch2>24题\u003c/h2>\n\u003cblockquote>\n\u003cp>If unable to calm down passengers, the railways may have to face ______.\u003cbr>如果不能平息乘客的不满，铁路方面可能不得不面对什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>条件后果推断题。题干要求判断“如果不能平息乘客的不满，铁路方面可能不得不面对什么？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The Government has pledged to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate. This should form part of a wider package of measures to address the long-running problems on Britain&#39;s railways. Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, interrupted by regular chaos when timetables are changed, or planned maintenance is managed incompetently. The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003ch3>A. a change of ownership\u003c/h3>\n\u003cblockquote>\n\u003cp>所有权的改变\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\u003c/p>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能平息乘客不满，铁路可能不得不面对所有权的改变。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。\u003c/p>\n\u003cp>原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。\u003c/p>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Unless passengers’ anger is addressed, the railways may come under state ownership.\u003c/p>\n\u003cp>如果不处理乘客愤怒，铁路可能转为国家所有。\u003c/p>\n\u003c/blockquote>\n\u003cp>nationalisation就是所有权向国家转移；may保持原文threat的可能性，没有说已经决定国有化。ownership概括的是制度层面的后果。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认铁路不能一直忽视乘客不满，不能决定具体后果是所有权、收入、投资还是运营变化；需要末段明确写出的条件后果。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a change of ownership\u003cbr>所有权的改变\u003c/p>\n\u003c/blockquote>\n\u003cp>nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\u003c/p>\n\u003cp>本项最终仍要根据“The threat of nationalisation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. a reduction of revenue\u003c/h3>\n\u003cblockquote>\n\u003cp>收入的减少\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 a reduction of revenue 涉及收入变化，第4段相近的是pay more，都是乘客付款与铁路收钱的问题，因此回看乘客不愿多付钱的条件句，再对照末句明确说要回来的威胁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文pay more是在说乘客不愿继续增加支付，条件是同时忍受不可靠的服务；B的a reduction of revenue却说铁路收入比原来减少。不愿再多付与总收入减少不是同一种变化，不能把拒绝继续加价写成已经少付。题干的无法平息愤怒更直接接末句国有化威胁回来，B还把这个明确条件后果换成了财务总额变化。\u003c/p>\n\u003cp>前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, interrupted by regular chaos when timetables are changed, or planned maintenance is managed incompetently.\u003c/p>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能平息乘客不满，铁路可能不得不面对收入的减少。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 a reduction of revenue 涉及收入变化，第4段相近的是pay more，都是乘客付款与铁路收钱的问题，因此回看乘客不愿多付钱的条件句，再对照末句明确说要回来的威胁。\u003c/p>\n\u003cp>原文pay more是在说乘客不愿继续增加支付，条件是同时忍受不可靠的服务；B的a reduction of revenue却说铁路收入比原来减少。不愿再多付与总收入减少不是同一种变化，不能把拒绝继续加价写成已经少付。题干的无法平息愤怒更直接接末句国有化威胁回来，B还把这个明确条件后果换成了财务总额变化。\u003c/p>\n\u003cp>前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, interrupted by regular chaos when timetables are changed, or planned maintenance is managed incompetently.\u003c/p>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Failure to calm passengers will reduce railway revenue.\u003c/p>\n\u003cp>无法安抚乘客会使铁路收入下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>收入下降需要退票、客流减少或收入数据的后续说明。文中乘客不少没有替代出行方式，末句也没有转向营收，而是明确点出国有化压力。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认铁路不能一直忽视乘客不满，不能决定具体后果是所有权、收入、投资还是运营变化；需要末段明确写出的条件后果。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>a reduction of revenue\u003cbr>收入的减少\u003c/p>\n\u003c/blockquote>\n\u003cp>前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\u003c/p>\n\u003cp>本项最终仍要根据“The threat of nationalisation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. the loss of investment\u003c/h3>\n\u003cblockquote>\n\u003cp>投资的流失\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 the loss of investment 让我们回看more investment is needed，两边都提投资，所以把投资需求那句与末尾乘客愤怒的条件一起看，分清需要更多和失去已有投资。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文more investment is needed承认铁路需要增加投入；C的the loss of investment则说乘客愤怒将造成投资流失。需要更多投入不能自动反转成已有资金会被撤走；而且末句if直接连接的是国有化威胁重新出现，不是投资方撤资。这里投资属于作者承认的改善需求，C把需求改成乘客不满导致的资金损失。\u003c/p>\n\u003cp>一个是投入需求，一个是带着因果的资金流失，原文明确的条件结果又是国有化威胁，C把这两处重新拼成了另一条关系。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能平息乘客不满，铁路可能不得不面对投资的流失。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 the loss of investment 让我们回看more investment is needed，两边都提投资，所以把投资需求那句与末尾乘客愤怒的条件一起看，分清需要更多和失去已有投资。\u003c/p>\n\u003cp>原文more investment is needed承认铁路需要增加投入；C的the loss of investment则说乘客愤怒将造成投资流失。需要更多投入不能自动反转成已有资金会被撤走；而且末句if直接连接的是国有化威胁重新出现，不是投资方撤资。这里投资属于作者承认的改善需求，C把需求改成乘客不满导致的资金损失。\u003c/p>\n\u003cp>一个是投入需求，一个是带着因果的资金流失，原文明确的条件结果又是国有化威胁，C把这两处重新拼成了另一条关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Angry passengers will cause investors to withdraw their money from the railways.\u003c/p>\n\u003cp>乘客愤怒将使投资者撤出铁路资金。\u003c/p>\n\u003c/blockquote>\n\u003cp>more investment is needed是在承认铁路需要投入，不是报告资金撤出。要支持loss，作者必须交代投资者的反应，不能把投资需求直接改成投资流失。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认铁路不能一直忽视乘客不满，不能决定具体后果是所有权、收入、投资还是运营变化；需要末段明确写出的条件后果。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the loss of investment\u003cbr>投资的流失\u003c/p>\n\u003c/blockquote>\n\u003cp>一个是投入需求，一个是带着因果的资金流失，原文明确的条件结果又是国有化威胁，C把这两处重新拼成了另一条关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\u003c/p>\n\u003cp>本项最终仍要根据“The threat of nationalisation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. the collapse of operations\u003c/h3>\n\u003cblockquote>\n\u003cp>运营的崩溃\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“the [xxx] of operations”，保留了相应遮挡。当时的定位线索是：D的 operations 指铁路运营，第4段services can continue to operate也在说能否继续运行，所以回看最低服务要求和末尾国有化威胁两处，看运营的什么变化被当成后果。读完全文后，做题模式再经交叉验证排除D，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>collapse是“崩溃”，the collapse of operations指运营体系垮掉。原文虽然批评拥挤、不可靠和混乱，却在最后把不满未解决的后果明确落到nationalisation，即国有化威胁重新出现。\u003c/p>\n\u003cp>国有化改变铁路归谁所有，不等于铁路停止运营。minimum service还以罢工期间继续运行作目标；D把服务缺陷和所有权压力合并成运营终结，加入了原文没有作出的极端判断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The Government has pledged to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate.\u003c/p>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>如果不能平息乘客不满，铁路可能不得不面对运营的崩溃。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 operations 指铁路运营，第4段services can continue to operate也在说能否继续运行，所以回看最低服务要求和末尾国有化威胁两处，看运营的什么变化被当成后果。\u003c/p>\n\u003cp>collapse是“崩溃”，the collapse of operations指运营体系垮掉。原文虽然批评拥挤、不可靠和混乱，却在最后把不满未解决的后果明确落到nationalisation，即国有化威胁重新出现。\u003c/p>\n\u003cp>国有化改变铁路归谁所有，不等于铁路停止运营。minimum service还以罢工期间继续运行作目标；D把服务缺陷和所有权压力合并成运营终结，加入了原文没有作出的极端判断。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The Government has pledged to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate.\u003c/p>\n\u003cp>The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.\u003c/p>\n\u003cp>末段先承认投资需求，再指出乘客不愿为拥挤且不可靠的服务无限多付钱；若不化解这种合理愤怒，国有化威胁就会重新出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Passenger anger may lead to the collapse of railway operations.\u003c/p>\n\u003cp>乘客愤怒可能导致铁路运营崩溃。\u003c/p>\n\u003c/blockquote>\n\u003cp>不可靠服务和时刻表混乱是现有缺陷，国有化是所有权改变，均不等于整个系统停止运营。collapse把制度调整风险歪曲为更极端的经营终结。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever-rising Fares Aren’t Sustainable\u003cbr>不断上涨的票价难以持续\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文主旨只能确认铁路不能一直忽视乘客不满，不能决定具体后果是所有权、收入、投资还是运营变化；需要末段明确写出的条件后果。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the collapse of operations\u003cbr>运营的崩溃\u003c/p>\n\u003c/blockquote>\n\u003cp>国有化改变铁路归谁所有，不等于铁路停止运营。minimum service还以罢工期间继续运行作目标；D把服务缺陷和所有权压力合并成运营终结，加入了原文没有作出的极端判断。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。\u003c/p>\n\u003cp>本项最终仍要根据“The threat of nationalisation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>24题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>24. A. a change of ownership\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：国有化改变铁路归谁所有，概括成可能的所有权变化准确。\u003c/p>\n\u003cp>B：末句给出国有化压力，没有给出收入下降这一后果。\u003c/p>\n\u003cp>C：需要更多投资不等于投资者已经或将要撤资。\u003c/p>\n\u003cp>D：所有权转移不等于运营崩溃，选项把后果极端化。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：票价上涨的不合理性\u003c/strong>（段落1问题提出） 质疑：火车运营商如何为又一次涨价辩护？→ 年度惯例：（每年一月涨价 → 给别无选择的通勤者带来负担）→ 具体数据：【今年涨幅2.7%（虽比去年略低）// 但仍远高于CPI通胀率】\u003c/p>\n\u003cp>↓（官方理由）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：政府的涨价理由与地区矛盾\u003c/strong>（段落2官方立场） 政府立场：使用者承担成本 // 而非一般纳税人 → 举例论证：（林肯郡开车养老金领取者 vs 萨里股票经纪人）→ 地区不平衡：【东南部通勤者困境受关注过多 // 中北部基础设施差却被忽视】\u003c/p>\n\u003cp>//（现实反驳）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：服务质量与票价不匹配\u003c/strong>（段落3服务问题） 现实困境：过去12个月经历多年来最严重罢工 → 核心矛盾：【运营商吹嘘改进 // 但乘客支付高额费用却得不到基本服务】→ 责任归属：（罢工责任在工会）+ 补偿诉求：（受影响最严重者应获补偿）\u003c/p>\n\u003cp>↓（解决方案与警告）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：改革措施与国有化威胁\u003c/strong>（段落4未来展望） 政府措施：引入最低服务要求（罢工期间保证运营）→ 需要更广泛改革 → 乘客忍耐有限：【需要更多投资 // 但服务糟糕（拥挤+不可靠+混乱）乘客不会无限期付费】→ 最终警告：【国有化威胁暂时消除 // 但不解决乘客愤怒将猛烈回归】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：铁路票价持续上涨缺乏合理性，特别是在服务质量糟糕、罢工频发的情况下。如果不能及时解决乘客的正当不满，铁路系统可能面临国有化的命运。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Ownership Debates Begin with Broken Trust\u003c/p>\n\u003cp>B. Making Investment Visible in Everyday Journeys\u003c/p>\n\u003cp>C. Looking Beyond the Individual Ticket Holder\u003c/p>\n\u003cp>D. Making Every Journey Free\u003c/p>\n\u003cp>E. Compensation Is Not a Verdict on a Strike\u003c/p>\n\u003cp>F. A Higher Price Needs a Better Service\u003c/p>\n\u003cp>G. Holding Unions Responsible for Every Failure\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A fare increase may look modest beside last year’s rise and still be difficult to defend. For a worker who cannot reach the office by any other route, it is an unavoidable addition to household spending. The relevant comparison is therefore not simply between two annual percentages. It is between the extra payment and the journey that payment buys. If cancellations and overcrowding remain familiar experiences, an announcement about a slightly smaller increase offers little reassurance. A higher price needs to be accompanied by a service that passengers can actually depend on.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>Asking passengers to contribute to railway costs is reasonable, but it does not settle how much each group should pay. A person who never boards a train may still benefit when others leave their cars at home and roads become less crowded. Employers also depend on workers arriving from places beyond walking distance. These connections do not prove that passengers should travel for nothing. They show why the price of a ticket cannot be discussed as if its buyer were the railway’s only beneficiary. A funding argument must consider benefits beyond the carriage.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>A dispute about who caused a strike can become so heated that the passenger disappears from view. Unions and management may each be asked to explain their decisions. Yet deciding where blame belongs is different from deciding what is owed to someone whose paid journey never took place. Compensation recognizes the failure to deliver that journey. It does not require passengers to judge every move in a labour negotiation before receiving help. Keeping these questions separate allows responsibility for disruption to be investigated without treating the customer’s loss as an afterthought.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>New tracks and signalling equipment can require disruption before they deliver an improvement. Passengers can understand that a line must sometimes close for work. What undermines this understanding is a repeated gap between the promised timetable and the actual journey. Investment therefore needs to be explained through outcomes that people can notice: fewer cancellations, dependable connections and clear warnings about planned closures. A large spending figure is not, by itself, evidence of a successful service. The test is whether the traveller’s ordinary week becomes more predictable once the work is done.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>When repeated promises produce little visible change, complaints can become a demand for a different owner. Calls for public ownership express more than irritation at a single cancelled train; they suggest that people no longer trust the existing arrangement to correct itself. Changing ownership, however, does not automatically repair a signal or produce a workable timetable. Any new arrangement must still explain who makes decisions, how failures are reported and what happens when promises are broken. The strongest response to a crisis of trust is therefore an accountable service, whatever name appears above the station.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】F. A Higher Price Needs a Better Service\u003c/p>\n\u003cblockquote>\n\u003cp>更高票价需要更好服务\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分先承认今年涨幅可能略低，再把评价标准从年度数字转到额外付费实际买到的服务。\u003c/p>\n\u003cp>先看作者为什么不接受“涨得比去年少”作为充分理由：\u003c/p>\n\u003cblockquote>\n\u003cp>still be difficult to defend\u003c/p>\n\u003c/blockquote>\n\u003cp>still说明合理性疑问没有因涨幅略降而消失，后面的无替代路线进一步解释乘客为何无法避开这项开支。\u003c/p>\n\u003cp>接着，作者明确更换比较的两端：\u003c/p>\n\u003cblockquote>\n\u003cp>between the extra payment and the journey that payment buys\u003c/p>\n\u003c/blockquote>\n\u003cp>不再只比较两年百分比，而是比较多付的钱与实际买到的旅程；论证中心从涨价幅度转向付费应得到的服务。\u003c/p>\n\u003cp>结尾给出判断标准：\u003c/p>\n\u003cblockquote>\n\u003cp>a service that passengers can actually depend on\u003c/p>\n\u003c/blockquote>\n\u003cp>取消班次和拥挤都是可靠性不足的例子。depend on把“更好”具体化为日常可以依赖，而非运营商口头承诺。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>涨幅略降仍不一定合理 → 乘客没有替代选择 → 比较额外付费与实际旅程 → 提价须配得上可靠服务\u003c/p>\n\u003c/blockquote>\n\u003cp>标题的Higher Price对应extra payment与higher price；Better Service对应结尾可以depend on的服务。Needs把二者连成条件要求，覆盖段落从费用转到服务标准的完整论证。\u003c/p>\n\u003cp>再看最强干扰项D：Making Every Journey Free。\u003c/p>\n\u003cp>Making Every Journey Free也谈票价，容易吸引只看乘客负担的读者。但文中没有取消收费的倡议，最后要求的是提价与可靠服务相伴；“多付的钱应买到什么”不能换成“所有人都不应付钱”。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】C. Looking Beyond the Individual Ticket Holder\u003c/p>\n\u003cblockquote>\n\u003cp>将眼光放到购票乘客之外\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分承认乘客应分担，同时通过道路和雇主说明铁路受益者超出购票人。\u003c/p>\n\u003cp>段首先承认一个有限的道理：\u003c/p>\n\u003cblockquote>\n\u003cp>Asking passengers to contribute to railway costs is reasonable\u003c/p>\n\u003c/blockquote>\n\u003cp>作者接受乘客分担，并没有主张免费。but随后限定：接受分担仍未决定各群体应付多少。\u003c/p>\n\u003cp>再看两个非乘客的获益渠道：\u003c/p>\n\u003cblockquote>\n\u003cp>roads become less crowded\u003c/p>\n\u003c/blockquote>\n\u003cp>有人改乘铁路会减少道路拥挤，未上车者也可能受益；接着的雇主依靠员工通勤进一步扩大受益者范围。\u003c/p>\n\u003cp>结论明确否定了哪一种假设：\u003c/p>\n\u003cblockquote>\n\u003cp>as if its buyer were the railway’s only beneficiary\u003c/p>\n\u003c/blockquote>\n\u003cp>only是问题所在。作者反对把购票者当成唯一受益者，因此成本讨论要越出车厢和个人票据。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>乘客可以分担成本 → 未乘车者与雇主也会受益 → 不等于所有旅程免费 → 资金分担应考虑车厢之外的收益\u003c/p>\n\u003c/blockquote>\n\u003cp>Individual Ticket Holder对应its buyer；Beyond对应roads和employers这些购票之外的受益联系。标题要求扩大成本讨论的视野，恰好保留“乘客可付费，但不是唯一受益者”的两层意思。\u003c/p>\n\u003cp>再看最强干扰项D：Making Every Journey Free。\u003c/p>\n\u003cp>免费标题抓住非乘客也获益这一事实，却跨过了These connections do not prove…travel for nothing的明确限制。扩大分担依据不等于免去乘客的全部贡献，两者在责任范围上不同。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】E. Compensation Is Not a Verdict on a Strike\u003c/p>\n\u003cblockquote>\n\u003cp>补偿不是对罢工责任的裁决\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分将罢工责任与乘客应获补救分开，说明调查归责不应抹去付费旅程落空的损失。\u003c/p>\n\u003cp>开头先摆出容易吞没乘客的争论：\u003c/p>\n\u003cblockquote>\n\u003cp>who caused a strike\u003c/p>\n\u003c/blockquote>\n\u003cp>这是工会与管理层之间的致因和责任问题，随后说双方都可能需要解释自己的决定。\u003c/p>\n\u003cp>转折处把两个问题明确拆开：\u003c/p>\n\u003cblockquote>\n\u003cp>deciding where blame belongs is different from deciding what is owed\u003c/p>\n\u003c/blockquote>\n\u003cp>blame belongs问谁该受责；what is owed问未完成付费旅程后欠乘客什么。不同的提问不能混作同一道门槛。\u003c/p>\n\u003cp>再看补偿具体承认什么：\u003c/p>\n\u003cblockquote>\n\u003cp>the failure to deliver that journey\u003c/p>\n\u003c/blockquote>\n\u003cp>补偿依据是已付款的旅程没有兑现，不要求乘客先判完每一步劳资谈判。结尾仍允许调查责任，说明两者可以并行。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>罢工归责争论使乘客被忽视 → 归责与应付乘客之物不同 → 补偿对应未兑现旅程 → 调查责任不应拖成乘客损失无人处理\u003c/p>\n\u003c/blockquote>\n\u003cp>Compensation对应补偿未兑现旅程；Verdict on a Strike对应blame及labour negotiation的责任裁决。Is Not准确表达段中different from的区分，而非否认罢工可以被调查。\u003c/p>\n\u003cp>再看最强干扰项G：Holding Unions Responsible for Every Failure。\u003c/p>\n\u003cp>工会责任标题只抓住Unions，却忽略management也在被要求说明，而且主句重点是乘客补偿无需等归责结束。Every Failure还把一次罢工责任扩大成全部服务故障，与段中对问题的区分相反。\u003c/p>\n\u003cp>\u003cstrong>43题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】B. Making Investment Visible in Everyday Journeys\u003c/p>\n\u003cblockquote>\n\u003cp>让投资体现在日常出行中\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分承认施工的必要中断，同时要求用普通一周的出行改善来检验投资。\u003c/p>\n\u003cp>先承认施工可能造成合理中断：\u003c/p>\n\u003cblockquote>\n\u003cp>disruption before they deliver an improvement\u003c/p>\n\u003c/blockquote>\n\u003cp>before把短期不便和未来收益连起来。作者不是要求铁路永远不施工，而是给理解维修留出位置。\u003c/p>\n\u003cp>再看信任为什么会被破坏：\u003c/p>\n\u003cblockquote>\n\u003cp>a repeated gap between the promised timetable and the actual journey\u003c/p>\n\u003c/blockquote>\n\u003cp>反复落空的是承诺时刻表与实际行程的对应，问题不在所有关闭线路行为本身。\u003c/p>\n\u003cp>最后将投资的成功标准落到日常：\u003c/p>\n\u003cblockquote>\n\u003cp>the traveller’s ordinary week becomes more predictable\u003c/p>\n\u003c/blockquote>\n\u003cp>少取消、可靠换乘、提前告知都是可感受的结果；ordinary week收束这些例子，取代单看支出总额的评价。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>施工可能暂时中断服务 → 乘客能够理解必要工作 → 反复违背承诺损害理解 → 以日常行程能否更可预期检验投资\u003c/p>\n\u003c/blockquote>\n\u003cp>Making Investment Visible不是要求展示工程照片，而是让投入通过fewer cancellations等结果被乘客察觉。Everyday Journeys对应ordinary week，完整概括从花钱数字转向实际体验的标准。\u003c/p>\n\u003cp>再看最强干扰项F：A Higher Price Needs a Better Service。\u003c/p>\n\u003cp>更高票价配更好服务与本段主题接近，但这里没有展开涨价是否合理。段首讨论的是施工带来的暂时中断，结尾检验工程投入如何变成可靠行程；投资成效比提价关系更准确地覆盖整段。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】A. Ownership Debates Begin with Broken Trust\u003c/p>\n\u003cblockquote>\n\u003cp>所有权争论始于信任破裂\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分解释失约如何催生所有权诉求，再指出新旧所有者都须交代可问责的服务。\u003c/p>\n\u003cp>先看投诉为何升级为制度要求：\u003c/p>\n\u003cblockquote>\n\u003cp>a demand for a different owner\u003c/p>\n\u003c/blockquote>\n\u003cp>触发因素是反复承诺却看不到改变，抱怨因此从一次服务失败升级为所有者能否自我纠正的问题。\u003c/p>\n\u003cp>however随后限制换所有者的作用：\u003c/p>\n\u003cblockquote>\n\u003cp>does not automatically repair a signal or produce a workable timetable\u003c/p>\n\u003c/blockquote>\n\u003cp>改所有权并不会自动修好信号或排好时刻表，作者因此要求继续交代实际管理和纠错机制。\u003c/p>\n\u003cp>结尾回到回应信任危机的标准：\u003c/p>\n\u003cblockquote>\n\u003cp>an accountable service\u003c/p>\n\u003c/blockquote>\n\u003cp>后面的whatever name表明判断不取决于站牌上写谁，而取决于决策、报告失败和违约后果能否被追问。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>承诺反复落空 → 乘客要求改变所有者 → 换所有权不能自动改善服务 → 新旧安排都须接受问责\u003c/p>\n\u003c/blockquote>\n\u003cp>Ownership Debates对应different owner和public ownership；Broken Trust对应no longer trust及crisis of trust。Begin with说明争论由信任破裂触发，同时容纳后面对换所有权不能包办解决的限制。\u003c/p>\n\u003cp>再看最强干扰项B：Making Investment Visible in Everyday Journeys。\u003c/p>\n\u003cp>投资标题也要求看实际结果，但本段没有追踪新轨道或花费如何见效。贯穿始终的是投诉升级、所有权更换及其问责条件，若只写投资，便漏掉这条制度与信任的主线。\u003c/p>\n\u003cp>\u003cstrong>45题选A。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>For a commuter with no practical alternative, another fare increase is not an optional purchase. It must be paid before the day’s work can begin. The justification for asking for more therefore rests on more than the operator’s announcement. It rests on a basic bargain: passengers provide the money and the railway provides a dependable journey.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>That bargain is broken when a passenger pays for a journey that is then cancelled. Arguments about whether management or a union caused the cancellation do not make the lost journey reappear. The customer needs a remedy that recognizes the service already purchased. For a journey that cannot be restored, the immediate remedy is compensation.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Compensation looks backwards, however, and tomorrow’s commuter needs something more. A refund can acknowledge yesterday’s failure without preventing the next one. Rules for periods of industrial action should therefore protect a basic level of operation while disputes are being resolved. This is the case for a minimum service that passengers can plan around.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Such sharing needs a clear account of what the money will achieve. Otherwise, a wider group of contributors simply inherits the frustration already felt by commuters. Funding decisions should specify improvements that can be checked, including reliable connections and notice of disruption. Those paying should be able to compare the promises with published performance benchmarks.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>A minimum service sets a floor; it does not guarantee a comfortable or reliable network on ordinary days. Ageing equipment, weak connections and overcrowded trains may remain even when no strike is taking place. Addressing these everyday problems requires work beyond a rule about industrial action. It also raises the question of who will finance renewed investment.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>This regional imbalance also matters to people who do not buy train tickets. A poorly connected town can struggle to attract workers and businesses, while a well-served area gains benefits extending beyond the carriage. Such effects complicate the division between passengers and everyone else. They suggest a reason for several groups to share the costs.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>That investment is often defended on the principle that users should pay. Yet applying the principle requires attention to the different services users receive. A commuter with frequent trains is not in the same position as someone with a neglected local line. A national funding debate must therefore confront this regional imbalance.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>Those benchmarks cannot prevent every failure, but they can make a persistent failure harder to hide. If promises repeatedly remain unmet, demands for a different owner will return. Public or private management must answer the same practical question: can passengers see that the money they provide is buying a service worthy of their trust?\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>以被迫增加的通勤支出提出付费与可靠服务的基本约定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>从旅程未兑现转到对乘客的即时补偿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>指出退款只补过去，进而提出罢工时的最低服务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>要求共同出资对应可核查的服务承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>限定最低服务的作用，并引出日常改善所需投资\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>由地区服务差异引出非乘客受益和共同分担成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>将投资付费原则放到地区服务不均的现实中检验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以可核查表现收束信任与所有权压力\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以被迫增加的通勤支出提出付费与可靠服务的基本约定 → 从旅程未兑现转到对乘客的即时补偿 → 指出退款只补过去，进而提出罢工时的最低服务 → 限定最低服务的作用，并引出日常改善所需投资 → 将投资付费原则放到地区服务不均的现实中检验 → 由地区服务差异引出非乘客受益和共同分担成本 → 要求共同出资对应可核查的服务承诺 → 以可核查表现收束信任与所有权压力\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → B → C → E → G → F → D → H\u003c/strong>\u003c/p>\n\u003cp>41—45：B、C、G、F、D。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → B → C的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>It rests on a basic bargain: passengers provide the money and the railway provides a dependable journey.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That bargain is broken when a passenger pays for a journey that is then cancelled.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段最后明确把基本约定写为乘客给钱、铁路提供可靠旅程。That bargain只需回指这组交换关系，随后broken与cancelled写约定怎样被打破，形成“提出标准—呈现违约”的承接。\u003c/p>\n\u003cp>本段没有立即争论哪一方该为罢工负责，而是指出归责不能让已失去的旅程回来。由customer needs a remedy推进到compensation，把下一步讨论对象具体限定为补偿。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>For a journey that cannot be restored, the immediate remedy is compensation.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Compensation looks backwards, however, and tomorrow’s commuter needs something more.\u003c/p>\n\u003c/blockquote>\n\u003cp>当前段最后首次明确即时补救是compensation，后段便以Compensation looks backwards评价它的时间范围。先提出补偿，再指出它只能补过去，才有理由转向下一次出行的保障。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>以被迫增加的通勤支出提出付费与可靠服务的基本约定 → 从旅程未兑现转到对乘客的即时补偿 → 指出退款只补过去，进而提出罢工时的最低服务\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That investment is often defended on the principle that users should pay.\u003c/p>\n\u003c/blockquote>\n\u003cp>另一候选也以That开头，但That investment需要前段先提出投资；开篇只有付费换可靠旅程的约定，没有投资来源问题。它还会提前进入地区公平，跳过已付款却没有旅程这一即时损失。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成B → C → E的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>For a journey that cannot be restored, the immediate remedy is compensation.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Compensation looks backwards, however, and tomorrow’s commuter needs something more.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段落在immediate remedy is compensation，本段同词承接后马上用however限制其作用。looks backwards与tomorrow对照，说明退款处理的是过去，乘客还需要未来能出行。\u003c/p>\n\u003cp>由退款不能防止再次中断，作者才提出工业行动期间保护基本运行。段末minimum service给这一前瞻安排命名，并以plan around说明它对通勤安排的用途。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>This is the case for a minimum service that passengers can plan around.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A minimum service sets a floor; it does not guarantee a comfortable or reliable network on ordinary days.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知后段以A minimum service sets a floor承接刚命名的安排，再区分最低底线与普通日子的质量。两段连续评价方案的作用范围：补偿不足以防未来，最低服务又不足以包办日常改善。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>从旅程未兑现转到对乘客的即时补偿 → 指出退款只补过去，进而提出罢工时的最低服务 → 限定最低服务的作用，并引出日常改善所需投资\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such sharing needs a clear account of what the money will achieve.\u003c/p>\n\u003c/blockquote>\n\u003cp>Such sharing一段要求前面存在多群体共同分担的方案。补偿是运营方对失去旅程的乘客的补救，不是共同出资；放在这里会把收款方向与资金用途一并换掉，也接不上已知段的最低服务。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → F的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>It also raises the question of who will finance renewed investment.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That investment is often defended on the principle that users should pay.\u003c/p>\n\u003c/blockquote>\n\u003cp>已知前段结尾问谁来为renewed investment出钱，That investment精确回指这一新投入。随后users should pay直接回答融资原则，形成“提出资金问题—给出原则并检验”的关系。\u003c/p>\n\u003cp>作者用Yet把抽象使用者付费放到具体服务差异中：一边班次频繁，一边线路被忽视。因此段末不是泛谈票价，而是收束为national funding必须面对的regional imbalance。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>A national funding debate must therefore confront this regional imbalance.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>This regional imbalance also matters to people who do not buy train tickets.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段This regional imbalance直接接住段末名词，再通过also把受影响者扩展到不买票的人。必须先建立两地乘客服务不同，才谈这项不均如何影响城镇就业与商业。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>限定最低服务的作用，并引出日常改善所需投资 → 将投资付费原则放到地区服务不均的现实中检验 → 由地区服务差异引出非乘客受益和共同分担成本\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That bargain is broken when a passenger pays for a journey that is then cancelled.\u003c/p>\n\u003c/blockquote>\n\u003cp>That bargain一段能谈收费与服务，却从已购买旅程遭取消转向补偿，无法回答前段刚提出的投资由谁承担。它也不会引出下一段所需的regional imbalance，前后两端均缺少对应。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → F → D的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A national funding debate must therefore confront this regional imbalance.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>This regional imbalance also matters to people who do not buy train tickets.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段对比频繁列车与被忽视线路，最后用regional imbalance命名。This regional imbalance加also，既保留同一地区差异，又把考察对象从乘客推向非购票者。\u003c/p>\n\u003cp>连接不佳的城镇难以吸引劳动力和企业，是非乘客受影响的具体路径。由此才说乘客与其他人的二分被复杂化，最后提出several groups分担成本，而非一开始就无依据地要求所有人付款。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest a reason for several groups to share the costs.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such sharing needs a clear account of what the money will achieve.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Such sharing回指本段最后的多群体share the costs，然后追问钱能换来什么。这条承接把“谁应出钱”推进成“共同出钱后怎样核查结果”，逻辑任务发生了明确变化。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>将投资付费原则放到地区服务不均的现实中检验 → 由地区服务差异引出非乘客受益和共同分担成本 → 要求共同出资对应可核查的服务承诺\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Such sharing needs a clear account of what the money will achieve.\u003c/p>\n\u003c/blockquote>\n\u003cp>若先放Such sharing段，前面只有用户付费与地区不均，尚未论证非乘客也获益，更未提出多个群体共同分担。它所需的sharing会提前出现，同时漏掉成本分担范围扩大的理由。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成F → D → H的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest a reason for several groups to share the costs.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Such sharing needs a clear account of what the money will achieve.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段结尾建议several groups共同分担，本段Such sharing回指这一安排，needs a clear account随即给它加条件：扩大出资群体必须说明资金效果。\u003c/p>\n\u003cp>otherwise说明没有可查承诺会把通勤者的失望传给更多出资人；后面给可靠换乘、提前告知等可观察项目，最终收束到published performance benchmarks，而不是只笼统要求问责。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Those paying should be able to compare the promises with published performance benchmarks.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those benchmarks cannot prevent every failure, but they can make a persistent failure harder to hide.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段Those benchmarks准确接住公开绩效基准，并区分它不能消除每次故障、却能使长期失约难以掩盖。可核查承诺先建立，才有结尾以持续失约重新引出所有权压力的判断基础。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>由地区服务差异引出非乘客受益和共同分担成本 → 要求共同出资对应可核查的服务承诺 → 以可核查表现收束信任与所有权压力\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That investment is often defended on the principle that users should pay.\u003c/p>\n\u003c/blockquote>\n\u003cp>That investment一段会重新回到使用者付费和地区不均，而这些问题已经讨论完毕；它的结尾仍是regional imbalance，不能为已知末段Those benchmarks提供先行词。因此并非多谈一次投资就能替代核查承诺。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>reliable public services\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>可靠的公共服务\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会生活类：生活质量\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsibility to service users\u003c/td>\n\u003ctd>对服务使用者的责任\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fair cost sharing\u003c/td>\n\u003ctd>公平的成本分担\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>long-term investment\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>长期投资\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>经济消费类：企业经营\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>attention to regional needs\u003c/td>\n\u003ctd>对地区需求的关注\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>constructive problem-solving\u003c/td>\n\u003ctd>建设性地解决问题\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>public trust\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>公众信任\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>effective cooperation\u003c/td>\n\u003ctd>有效合作\u003c/td>\n\u003ctd>人生哲理类：团结合作\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a willingness to honour commitments\u003c/td>\n\u003ctd>履行承诺的意愿\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A bearing an extra burden imposed by X.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画展示A承受X带来的额外负担。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, A expects a basic level of X in return for Y.\u003c/td>\n\u003ctd>图中A期待以Y换来基本水平的X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene contrasts the needs of A with the experience of B.\u003c/td>\n\u003ctd>这一场景把A的需求与B的经历作对照。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The cost of X has risen by Y per cent.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>X的成本上涨了百分之Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The increase in X remains well above the rise in Y.\u003c/td>\n\u003ctd>X的涨幅仍明显高于Y。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>A larger share of the cost is now borne by X.\u003c/td>\n\u003ctd>如今更大比例的成本由X承担。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage questions whether another increase in X can be justified.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>文章质疑再次提高X是否合理。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The text acknowledges the need for X while calling for improvements in Y.\u003c/td>\n\u003ctd>文章承认X的必要，同时呼吁改善Y。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The issue concerns how to match rising costs with reliable services.\u003c/td>\n\u003ctd>问题涉及如何让上涨的成本与可靠服务相匹配。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":5},{"label":"句内逻辑","index":21},{"label":"长难句手译","index":24},{"label":"第三鸟 · 题目复盘","index":43},{"label":"25题","index":44},{"label":"21题","index":54},{"label":"22题","index":72},{"label":"23题","index":90},{"label":"24题","index":108},{"label":"第四鸟 · 新题型","index":126},{"label":"小标题题","index":126},{"label":"排序题","index":132},{"label":"第五鸟 · 写作积累","index":138}];
const allIndices = [0,1,2,3,4,8,12,16,20,21,22,23,24,30,36,42,43,44,46,48,50,52,53,54,58,62,66,70,71,72,76,80,84,88,89,90,94,98,102,106,107,108,112,116,120,124,125,126,127,128,129,130,131,132,133,134,135,136,137,138,139];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
 const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
 const top=rightScroll.scrollTop+er.top-sr.top;
 const target=height<=view-2*margin?top+height/2-view/2:top-margin;
 rightScroll.scrollTop=clampScroll(target,rightScroll.scrollHeight-view);
}
function positionRight(st,token,restore){
 guardedSchedule(token,()=>{
  if(isLongSentenceCumulative(st)){
   positionLongSentence(st);
   if(!restore)return;
  }
  if(restore){
   rightScroll.scrollTop=saved.right;
   window.scrollTo(0,saved.win);
   return;
  }
  if(!st.meta.cumulative||st.meta.partIndex===0){rightScroll.scrollTop=0;return;}
  const el=document.getElementById(st.focusId);
  if(!el)return;
  if(isParagraphCumulative(st)){
   // Match the sample: no artificial tail; real content height limits the scroll.
   const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const top=rightScroll.scrollTop+er.top-sr.top;
   rightScroll.scrollTop=clampScroll(top-34,rightScroll.scrollHeight-rightScroll.clientHeight);
   return;
  }
  // A short final layer still needs enough trailing room to bring its heading into view.
