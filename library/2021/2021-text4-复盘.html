filiated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n<p>从宽带早期起，消费者及网络企业的倡导者就担心，销售宽带连接的有线和电话公司有权力也有动机，优待关联网站而非其竞争对手。因此人们强烈要求规则，防止宽带提供商决定网上谁赢谁输，维护一直是互联网生命力所在的自由和创新。</p>\n</blockquote>\n<p>提供商凭网络接入权优待关联服务，作者因此希望规则维护自由和创新，而非讨论提供商如何加强竞争。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Broadband providers would intensify competition with their rivals.</p>\n<p>长期以来人们担心宽带提供商会加剧与自身对手的竞争。</p>\n</blockquote>\n<p>D需要竞争强度增加的描述。关联网站占优势不等于竞争更充分或更激烈，不能仅凭rivals把两种关系合并。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"36题结论","raw":"### 36题结论\n\n> **36. A**\n\n- A：favor...over表示优待关联网站、使竞争对手处于不利位置，show partiality概括这种差别待遇。\n- B：影响网站竞争结果不等于把网络公司置于自身控制之下。原文担忧的是服务上的偏袒，未建立对公司本身的控制关系。\n- C：slow down是具体降低传输速度，原文只确定关联网站得到优待，未将这种偏袒限定为整体网络传输减慢。\n- D：挑选谁赢谁输意味着偏袒并改变竞争条件，intensify competition则说与对手的竞争更激烈，动作和比较关系不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"36题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"36","questionConclusion":true},"html":"<blockquote>\n<p><strong>36. A</strong></p>\n</blockquote>\n<ul>\n<li>A：favor...over表示优待关联网站、使竞争对手处于不利位置，show partiality概括这种差别待遇。</li>\n<li>B：影响网站竞争结果不等于把网络公司置于自身控制之下。原文担忧的是服务上的偏袒，未建立对公司本身的控制关系。</li>\n<li>C：slow down是具体降低传输速度，原文只确定关联网站得到优待，未将这种偏袒限定为整体网络传输减慢。</li>\n<li>D：挑选谁赢谁输意味着偏袒并改变竞争条件，intensify competition则说与对手的竞争更激烈，动作和比较关系不同。</li>\n</ul>\n"},{"title":"37题 · 题干、题型与核心出处","raw":"## 37题\n\n> Faced with the demand for net neutrality rules, the FCC ______.\n>\n> 面对制定网络中立性规则的要求，联邦通信委员会做了什么？\n\n### 题型\n\n行为概括题：将取消规则、否定权限和排除州监管归纳为FCC的回应方向。\n\n题干直接给出FCC，并问它如何面对net neutrality rules的要求。第二段出现了这个机构的全称，还说明2017年的命令如何处理此前的规则，先完整读第二段。\n\n### 核心出处\n\n> At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission's authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn't regulate broadband providers either.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"37","questionIntro":true},"html":"<blockquote>\n<p>Faced with the demand for net neutrality rules, the FCC ______.</p>\n<p>面对制定网络中立性规则的要求，联邦通信委员会做了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>行为概括题：将取消规则、否定权限和排除州监管归纳为FCC的回应方向。</p>\n<p>题干直接给出FCC，并问它如何面对net neutrality rules的要求。第二段出现了这个机构的全称，还说明2017年的命令如何处理此前的规则，先完整读第二段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n"},{"title":"A. sticks to an out-of-date order","raw":"### A. sticks to an out-of-date order\n\n> 面对网络中立规则的需求，FCC坚持一项过时命令。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n第二段写撤销2015年规则、否定监管权限及禁止州监管，A却概括为坚持一项过时命令，未说明这一回应方向。\n\n**出处：**\n\n> At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission's authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn't regulate broadband providers either.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-A-0\"><blockquote>\n<p>面对网络中立规则的需求，FCC坚持一项过时命令。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第二段写撤销2015年规则、否定监管权限及禁止州监管，A却概括为坚持一项过时命令，未说明这一回应方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section>"},{"title":"A. sticks to an out-of-date order","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 面对网络中立规则的需求，FCC坚持一项过时命令。\n\n`sticks to an out-of-date order`既包含坚持某项命令的动作，也把该命令判为过时，回看第二段第四句的`eliminated the strict net neutrality rules`以及随后对监管权力的处理，核对委员会回应要求的具体做法。\n\n原文说委员会的命令`eliminated the strict net neutrality rules`，并否定委员会要求提供商采取行动的权力，具体写出的是撤销规则和否定监管权限。本项的`sticks to an out-of-date order`改为坚持一项被判定过时的命令，额外建立了委员会坚持该命令的关系，也加入了过时的评价。这里不能因为命令发表于2017年就认定它不会过时；问题在于，本段已经明确写出的委员会做法，并不是本项所说的坚持某项过时命令。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-A-0\"><blockquote>\n<p>面对网络中立规则的需求，FCC坚持一项过时命令。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第二段写撤销2015年规则、否定监管权限及禁止州监管，A却概括为坚持一项过时命令，未说明这一回应方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC坚持一项过时命令。</p>\n</blockquote>\n<p><code>sticks to an out-of-date order</code>既包含坚持某项命令的动作，也把该命令判为过时，回看第二段第四句的<code>eliminated the strict net neutrality rules</code>以及随后对监管权力的处理，核对委员会回应要求的具体做法。</p>\n<p>原文说委员会的命令<code>eliminated the strict net neutrality rules</code>，并否定委员会要求提供商采取行动的权力，具体写出的是撤销规则和否定监管权限。本项的<code>sticks to an out-of-date order</code>改为坚持一项被判定过时的命令，额外建立了委员会坚持该命令的关系，也加入了过时的评价。这里不能因为命令发表于2017年就认定它不会过时；问题在于，本段已经明确写出的委员会做法，并不是本项所说的坚持某项过时命令。</p>\n</section>"},{"title":"A. sticks to an out-of-date order","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission's authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn't regulate broadband providers either.\n>\n> 哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。\n\n作者从规则需求难满足转到2017年命令的具体内容，三个动作共同展示退出监管。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The FCC sticks to an out-of-date order.\n>\n> 面对网络中立规则的需求，FCC坚持一项过时命令。\n\nA需要FCC坚持某项旧命令这一关系。后文法官确实批评结果脱离现代现实，但那是对法院结果的评价，不能直接搬来替代本段FCC的行动。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"A","cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-A-0\"><blockquote>\n<p>面对网络中立规则的需求，FCC坚持一项过时命令。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第二段写撤销2015年规则、否定监管权限及禁止州监管，A却概括为坚持一项过时命令，未说明这一回应方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC坚持一项过时命令。</p>\n</blockquote>\n<p><code>sticks to an out-of-date order</code>既包含坚持某项命令的动作，也把该命令判为过时，回看第二段第四句的<code>eliminated the strict net neutrality rules</code>以及随后对监管权力的处理，核对委员会回应要求的具体做法。</p>\n<p>原文说委员会的命令<code>eliminated the strict net neutrality rules</code>，并否定委员会要求提供商采取行动的权力，具体写出的是撤销规则和否定监管权限。本项的<code>sticks to an out-of-date order</code>改为坚持一项被判定过时的命令，额外建立了委员会坚持该命令的关系，也加入了过时的评价。这里不能因为命令发表于2017年就认定它不会过时；问题在于，本段已经明确写出的委员会做法，并不是本项所说的坚持某项过时命令。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n<p>哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。</p>\n</blockquote>\n<p>作者从规则需求难满足转到2017年命令的具体内容，三个动作共同展示退出监管。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The FCC sticks to an out-of-date order.</p>\n<p>面对网络中立规则的需求，FCC坚持一项过时命令。</p>\n</blockquote>\n<p>A需要FCC坚持某项旧命令这一关系。后文法官确实批评结果脱离现代现实，但那是对法院结果的评价，不能直接搬来替代本段FCC的行动。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. has allowed the states to intervene","raw":"### B. has allowed the states to intervene\n\n> 面对网络中立规则的需求，FCC已允许各州介入。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n命令明确宣布州和地方政府也不能监管，B却说FCC允许各州介入，方向相反。\n\n**出处：**\n\n> At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission's authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn't regulate broadband providers either.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-B-0\"><blockquote>\n<p>面对网络中立规则的需求，FCC已允许各州介入。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命令明确宣布州和地方政府也不能监管，B却说FCC允许各州介入，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section>"},{"title":"B. has allowed the states to intervene","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 面对网络中立规则的需求，FCC已允许各州介入。\n\n`has allowed the states to intervene`涉及各州能否监管，直接接到第二段末句的`state and local governments couldn’t regulate`，回看这一句中命令的规定。\n\n原文的命令宣布`state and local governments couldn’t regulate`，即州和地方政府也不能监管宽带提供商。本项的`has allowed the states to intervene`说委员会允许各州介入。同样谈各州参与，原文给的是禁止，选项却写成允许，方向相反。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-B-0\"><blockquote>\n<p>面对网络中立规则的需求，FCC已允许各州介入。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命令明确宣布州和地方政府也不能监管，B却说FCC允许各州介入，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC已允许各州介入。</p>\n</blockquote>\n<p><code>has allowed the states to intervene</code>涉及各州能否监管，直接接到第二段末句的<code>state and local governments couldn’t regulate</code>，回看这一句中命令的规定。</p>\n<p>原文的命令宣布<code>state and local governments couldn’t regulate</code>，即州和地方政府也不能监管宽带提供商。本项的<code>has allowed the states to intervene</code>说委员会允许各州介入。同样谈各州参与，原文给的是禁止，选项却写成允许，方向相反。</p>\n</section>"},{"title":"B. has allowed the states to intervene","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission's authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn't regulate broadband providers either.\n>\n> 哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。\n\n取消联邦严格规则之后，命令又将禁止监管扩展到州与地方，either让两层退出相接。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The FCC has allowed the states to intervene.\n>\n> 面对网络中立规则的需求，FCC已允许各州介入。\n\nB需要由FCC给各州开放权限。后面法院撤销全面封堵州法的企图属于法院行动，不能当作FCC主动允许。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"B","cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-B-0\"><blockquote>\n<p>面对网络中立规则的需求，FCC已允许各州介入。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命令明确宣布州和地方政府也不能监管，B却说FCC允许各州介入，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC已允许各州介入。</p>\n</blockquote>\n<p><code>has allowed the states to intervene</code>涉及各州能否监管，直接接到第二段末句的<code>state and local governments couldn’t regulate</code>，回看这一句中命令的规定。</p>\n<p>原文的命令宣布<code>state and local governments couldn’t regulate</code>，即州和地方政府也不能监管宽带提供商。本项的<code>has allowed the states to intervene</code>说委员会允许各州介入。同样谈各州参与，原文给的是禁止，选项却写成允许，方向相反。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n<p>哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。</p>\n</blockquote>\n<p>取消联邦严格规则之后，命令又将禁止监管扩展到州与地方，either让两层退出相接。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The FCC has allowed the states to intervene.</p>\n<p>面对网络中立规则的需求，FCC已允许各州介入。</p>\n</blockquote>\n<p>B需要由FCC给各州开放权限。后面法院撤销全面封堵州法的企图属于法院行动，不能当作FCC主动允许。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":" ority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section>"},{"title":"C. has issued a special resolution","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 面对网络中立规则的需求，FCC已发布一项特别决议。\n\n经过投票形成命令确属正式决定，C与这一形式有联系；但它没有说明FCC怎样回应监管需求，D能概括实际撤销和拒绝监管的立场。\n\nadopted先交代决定产生，后文连续用eliminated、rejected、couldn't regulate说明决定具体做了什么。\n\n不能因order与resolution字面不同就否认存在正式决定。C的special也没有独立依据；更关键的是它停在发文形式，D直接回答监管需求得到什么方向的回应。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-C-0\"><blockquote>\n<p>面对网络中立规则的需求，FCC已发布一项特别决议。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时C尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>经过投票形成命令确属正式决定，C与这一形式有联系；但它没有说明FCC怎样回应监管需求，D能概括实际撤销和拒绝监管的立场。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC已发布一项特别决议。</p>\n</blockquote>\n<p>经过投票形成命令确属正式决定，C与这一形式有联系；但它没有说明FCC怎样回应监管需求，D能概括实际撤销和拒绝监管的立场。</p>\n<p>adopted先交代决定产生，后文连续用eliminated、rejected、couldn&#39;t regulate说明决定具体做了什么。</p>\n<p>不能因order与resolution字面不同就否认存在正式决定。C的special也没有独立依据；更关键的是它停在发文形式，D直接回答监管需求得到什么方向的回应。</p>\n</section>"},{"title":"C. has issued a special resolution","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission's authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn't regulate broadband providers either.\n>\n> 哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。\n\nadopted先交代决定产生，后文连续用eliminated、rejected、couldn't regulate说明决定具体做了什么。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The FCC has issued a special resolution.\n>\n> 面对网络中立规则的需求，FCC已发布一项特别决议。\n\n不能因order与resolution字面不同就否认存在正式决定。C的special也没有独立依据；更关键的是它停在发文形式，D直接回答监管需求得到什么方向的回应。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"C","cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-C-0\"><blockquote>\n<p>面对网络中立规则的需求，FCC已发布一项特别决议。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时C尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>经过投票形成命令确属正 ommission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section>"},{"title":"D. takes an anti-regulatory stance","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 面对网络中立规则的需求，FCC采取反监管立场。\n\n`takes an anti-regulatory stance`要由委员会如何处理监管来判断，第二段第四句的`rejected the commission’s authority`与取消既有规则一起写出了它的决定，接着末句又谈州和地方政府，回看这两句。\n\n原文说命令取消严格的网络中立性规则，又`rejected the commission’s authority`，否定委员会要求宽带提供商采取行动的权力，还宣布州和地方政府不能监管。三处动作都在撤去或阻止对提供商的监管。本项的`takes an anti-regulatory stance`正是把这些决定概括为反对监管的立场，主体仍然是作出命令的委员会。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>面对网络中立规则的需求，FCC采取反监管立场。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>取消严格规则、否定自身监管权、禁止州与地方监管，三项决定共同指向anti-regulatory stance。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC采取反监管立场。</p>\n</blockquote>\n<p><code>takes an anti-regulatory stance</code>要由委员会如何处理监管来判断，第二段第四句的<code>rejected the commission’s authority</code>与取消既有规则一起写出了它的决定，接着末句又谈州和地方政府，回看这两句。</p>\n<p>原文说命令取消严格的网络中立性规则，又<code>rejected the commission’s authority</code>，否定委员会要求宽带提供商采取行动的权力，还宣布州和地方政府不能监管。三处动作都在撤去或阻止对提供商的监管。本项的<code>takes an anti-regulatory stance</code>正是把这些决定概括为反对监管的立场，主体仍然是作出命令的委员会。</p>\n</section>"},{"title":"D. takes an anti-regulatory stance","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission's authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn't regulate broadband providers either.\n>\n> 哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。\n\n第二段从未满足的中立规则需求出发，逐项解释新命令撤去哪些监管安排，而第三段结束调查继续体现这一方向。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The FCC takes an anti-regulatory stance.\n>\n> 面对网络中立规则的需求，FCC采取反监管立场。\n\nD以反监管概括具体行动，并未额外声称FCC反对一切领域的所有监管；语境仍是宽带提供商的网络中立问题。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>面对网络中立规则的需求，FCC采取反监管立场。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>取消严格规则、否定自身监管权、禁止州与地方监管，三项决定共同指向anti-regulatory stance。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC采取反监管立场。</p>\n</blockquote>\n<p><code>takes an anti-regulatory stance</code>要由委员会如何处理监管来判断，第二段第四句的<code>rejected the commission’s authority</code>与取消既有规则一起写出了它的决定，接着末句又谈州和地方政府，回看这两句。</p>\n<p>原文说命令取消严格的网络中立性规则，又<code>rejected the commission’s authority</code>，否定委员会要求宽带提供商采取行动的权力，还宣布州和地方政府不能监管。三处动作都在撤去或阻止对提供商的监管。本项的<code>takes an anti-regulatory stance</code>正是把这些决定概括为反对监管的立场，主体仍然是作出命令的委员会。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n<p>哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。</p>\n</blockquote>\n<p>第二段从未满足的中立规则需求出发，逐项解释新命令撤去哪些监管安排，而第三段结束调查继续体现这一方向。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The FCC takes an anti-regulatory stance.</p>\n<p>面对网络中立规则的需求，FCC采取反监管立场。</p>\n</blockquote>\n<p>D以反监管概括具体行动，并未额外声称FCC反对一切领域的所有监管；语境仍是宽带提供商的网络中立问题。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"37题结论","raw":"### 37题结论\n\n> **37. D**\n\n- A：第二段写撤销2015年规则、否定监管权限及禁止州监管，A却概括为坚持一项过时命令，未说明这一回应方向。\n- B：命令明确宣布州和地方政府也不能监管，B却说FCC允许各州介入，方向相反。\n- C：经过投票形成命令确属正式决定，C与这一形式有联系；但它没有说明FCC怎样回应监管需求，D能概括实际撤销和拒绝监管的立场。\n- D：取消严格规则、否定自身监管权、禁止州与地方监管，三项决定共同指向anti-regulatory stance。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"37","questionConclusion":true},"html":"<blockquote>\n<p><strong>37. D</strong></p>\n</blockquote>\n<ul>\n<li>A：第二段写撤销2015年规则、否定监管权限及禁止州监管，A却概括为坚持一项过时命令，未说明这一回应方向。</li>\n<li>B：命令明确宣布州和地方政府也不能监管，B却说FCC允许各州介入，方向相反。</li>\n<li>C：经过投票形成命令确属正式决定，C与这一形式有联系；但它没有说明FCC怎样回应监管需求，D能概括实际撤销和拒绝监管的立场。</li>\n<li>D：取消严格规则、否定自身监管权、禁止州与地方监管，三项决定共同指向anti-regulatory stance。</li>\n</ul>\n"},{"title":"38题 · 题干、题型与核心出处","raw":"## 38题\n\n> What can be learned about AT&T from Paragraph 3?\n>\n> 从第三段可以了解美国电话电报公司的什么情况？\n\n### 题型\n\n主体与行为细节题：分清防范者、反竞争行为的例子及调查状态。\n\n题干明确指定Paragraph 3，并点名AT&T，直接完整阅读第三段，检查这家公司出现的位置以及它被用来说明的行为。\n\n### 核心出处\n\n> The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"38","questionIntro":true},"html":"<blockquote>\n<p>What can be learned about AT&amp;T from Paragraph 3?</p>\n<p>从第三段可以了解美国电话电报公司的什么情况？</p>\n</blockquote>\n<h3>题型</h3>\n<p>主体与行为细节题：分清防范者、反竞争行为的例子及调查状态。</p>\n<p>题干明确指定Paragraph 3，并点名AT&amp;T，直接完整阅读第三段，检查这家公司出现的位置以及它被用来说明的行为。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n"},{"title":"A. It is in pursuit of quality service.","raw":"### A. It is in pursuit of quality service.\n\n> 第三段表明AT&T追求优质服务。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nfavoring its own service是利用接入地位优待自家服务，at the expense of说明对手受损，不是在说提升服务质量。\n\n**出处：**\n\n> The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>第三段表明AT&amp;T追求优质服务。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>favoring its own service是利用接入地位优待自家服务，at the expense of说明对手受损，不是在说提升服务质量。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section>"},{"title":"A. It is in pursuit of quality service.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第三段表明AT&T追求优质服务。\n\n`in pursuit of quality service`涉及这家公司如何发展服务，第三段第一句的`favoring its own video-streaming service`正好写它对自身服务的做法，因此回看这句话及随后说明代价的部分。\n\n原文的`favoring its own video-streaming service`是利用提供宽带的地位优待自己的视频服务，并明确把奈飞和苹果电视的利益受损作为代价。本项的`in pursuit of quality service`把公司的行为解释为追求服务质量。优待自己的服务与提高服务质量不是同一个动作，尤其原句具体交代了竞争对手承担代价，本项却把这种竞争中的差别待遇改成了改善服务的目标。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>第三段表明AT&amp;T追求优质服务。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>favoring its own service是利用接入地位优待自家服务，at the expense of说明对手受损，不是在说提升服务质量。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T追求优质服务。</p>\n</blockquote>\n<p><code>in pursuit of quality service</code>涉及这家公司如何发展服务，第三段第一句的<code>favoring its own video-streaming service</code>正好写它对自身服务的做法，因此回看这句话及随后说明代价的部分。</p>\n<p>原文的<code>favoring its own video-streaming service</code>是利用提供宽带的地位优待自己的视频服务，并明确把奈飞和苹果电视的利益受损作为代价。本项的<code>in pursuit of quality service</code>把公司的行为解释为追求服务质量。优待自己的服务与提高服务质量不是同一个动作，尤其原句具体交代了竞争对手承担代价，本项却把这种竞争中的差别待遇改成了改善服务的目标。</p>\n</section>"},{"title":"A. It is in pursuit of quality service.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.\n>\n> 委员会声称，其他机构会防范反竞争行为，例如AT&T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。\n\nAT&T作为反竞争行为的例子出现，下一句又说明给对手而不给自己的服务设流量上限。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> It is in pursuit of quality service.\n>\n> 第三段表明AT&T追求优质服务。\n\nA需要改善品质的目标或行动。自己的业务获得优待与业务质量提高并不相同，不能把偏袒包装为质量追求。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>第三段表明AT&amp;T追求优质服务。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>favoring its own service是利用接入地位优待自家服务，at the expense of说明对手受损，不是在说提升服务质量。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T追求优质服务。</p>\n</blockquote>\n<p><code>in pursuit of quality service</code>涉及这家公司如何发展服务，第三段第一句的<code>favoring its own video-streaming service</code>正好写它对自身服务的做法，因此回看这句话及随后说明代价的部分。</p>\n<p>原文的<code>favoring its own video-streaming service</code>是利用提供宽带的地位优待自己的视频服务，并明确把奈飞和苹果电视的利益受损作为代价。本项的<code>in pursuit of quality service</code>把公司的行为解释为追求服务质量。优待自己的服务与提高服务质量不是同一个动作，尤其原句具体交代了竞争对手承担代价，本项却把这种竞争中的差别待遇改成了改善服务的目标。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n<p>委员会声称，其他机构会防范反竞争行为，例如AT&amp;T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。</p>\n</blockquote>\n<p>AT&amp;T作为反竞争行为的例子出现，下一句又说明给对手而不给自己的服务设流量上限。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It is in pursuit of quality service.</p>\n<p>第三段表明AT&amp;T追求优质服务。</p>\n</blockquote>\n<p>A需要改善品质的目标或行动。自己的业务获得优待与业务质量提高并不相同，不能把偏袒包装为质量追求。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. It is under the FCC’s investigation.","raw":"### B. It is under the FCC’s investigation.\n\n> 第三段表明AT&T正在接受FCC调查。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n关于相关提供商，文中明确说调查已经结束，且没有单独确立AT&T此时正在被查。B的当前调查状态缺少支持。\n\n**出处：**\n\n> The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>第三段表明AT&amp;T正在接受FCC调查。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>关于相关提供商，文中明确说调查已经结束，且没有单独确立AT&amp;T此时正在被查。B的当前调查状态缺少支持。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section>"},{"title":"B. It is under the FCC’s investigation.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 第三段表明AT&T正在接受FCC调查。\n\n`under the FCC’s investigation`直接涉及调查状态，第三段第二句出现`ended the investigations`，因此回看这句中调查是否仍在进行。\n\n原文的`ended the investigations`说委员会已经结束对相关宽带提供商的调查，调查针对的是只给对手的流媒体服务设置流量上限的提供商。本项的`under the FCC’s investigation`却说美国电话电报公司正处在委员会调查之中。段落没有单独确立这家公司的调查状态，而且关于这类提供商明确给出的动作是终止调查，本项把已结束的调查写成正在进行。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>第三段表明AT&amp;T正在接受FCC调查。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>关于相关提供商，文中明确说调查已经结束，且没有单独确立AT&amp;T此时正在被查。B的当前调查状态缺少支持。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T正在接受FCC调查。</p>\n</blockquote>\n<p><code>under the FCC’s investigation</code>直接涉及调查状态，第三段第二句出现<code>ended the investigations</code>，因此回看这句中调查是否仍在进行。</p>\n<p>原文的<code>ended the investigations</code>说委员会已经结束对相关宽带提供商的调查，调查针对的是只给对手的流媒体服务设置流量上限的提供商。本项的<code>under the FCC’s investigation</code>却说美国电话电报公司正处在委员会调查之中。段落没有单独确立这家公司的调查状态，而且关于这类提供商明确给出的动作是终止调查，本项把已结束的调查写成正在进行。</p>\n</section>"},{"title":"B. It is under the FCC’s investigation.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.\n>\n> 委员会声称，其他机构会防范反竞争行为，例如AT&T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。\n\n第一句以AT&T说明反竞争风险，第二句转到FCC结束对设差别流量上限者的调查。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> It is under the FCC’s investigation.\n>\n> 第三段表明AT&T正在接受FCC调查。\n\n不能把两句直接合成AT&T一定是那项调查的对象；即使只看相关调查，其状态也是ended，并非under investigation。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>第三段表明AT&amp;T正在接受FCC调查。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>关于相关提供商，文中明确说调查已经结束，且没有单独确立AT&amp;T此时正在被查。B的当前调查状态缺少支持。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T正在接受FCC调查。</p>\n</blockquote>\n<p><code>under the FCC’s investigation</code>直接涉及调查状态，第三段第二句出现<code>ended the investigations</code>，因此回看这句中调查是否仍在进行。</p>\n<p>原文的<code>ended the investigations</code>说委员会已经结束对相关宽带提供商的调查，调查针对的是只给对手的流媒体服务设置流量上限的提供商。本项的<code>under the FCC’s investigation</code>却说美国电话电报公司正处在委员会调查之中。段落没有单独确立这家公司的调查状态，而且关于这类提供商明确给出的动作是终止调查，本项把已结束的调查写成正在进行。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n<p>委员会声称，其他机构会防范反竞争行为，例如AT&amp;T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。</p>\n</blockquote>\n<p>第一句以AT&amp;T说明反竞争风险，第二句转到FCC结束对设差别流量上限者的调查。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It is under the FCC’s investigation.</p>\n<p>第三段表明AT&amp;T正在接受FCC调查。</p>\n</blockquote>\n<p>不能把两句直接合成AT&amp;T一定是那项调查的对象；即使只看相关调查，其状态也是ended，并非under investigation。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. It protects against unfair competition.","raw":"### C. It protects against unfair competition.\n\n> 第三段表明AT&T防范不公平竞争。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\n防范反竞争行为的主语是other agencies，AT&T被举为需要防范的行为例子。C把行为实施者改成防范者。\n\n**出处：**\n\n> The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-C-0\"><blockquote>\n<p>第三段表明AT&amp;T防范不公平竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>防范反竞争行为的主语是other agencies，AT&amp;T被举为需要防范的行为例子。C把行为实施者改成防范者。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section>"},{"title":"C. It protects against unfair competition.","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 第三段表明AT&T防范不公平竞争。\n\n`protects against unfair competition`与第一句的`other agencies would protect against anti-competitive behavior`意思相接，要回看这句是谁负责防范，以及美国电话电报公司在句中扮演什么角色。\n\n原文中`other agencies would protect against anti-competitive behavior`把防范反竞争行为的职责交给其他机构，随后用美国电话电报公司优待自家服务、损害对手利益来举例说明需要防范的行为。本项的`protects against unfair competition`把防范者换成了美国电话电报公司。它在原句里是问题行为的例子，不是负责防止该行为的机构，两处角色相反。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-C-0\"><blockquote>\n<p>第三段表明AT&amp;T防范不公平竞争。</p>\n</blockquote ects却换掉主语。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-C-0\"><blockquote>\n<p>第三段表明AT&amp;T防范不公平竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>防范反竞争行为的主语是other agencies，AT&amp;T被举为需要防范的行为例子。C把行为实施者改成防范者。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T防范不公平竞争。</p>\n</blockquote>\n<p><code>protects against unfair competition</code>与第一句的<code>other agencies would protect against anti-competitive behavior</code>意思相接，要回看这句是谁负责防范，以及美国电话电报公司在句中扮演什么角色。</p>\n<p>原文中<code>other agencies would protect against anti-competitive behavior</code>把防范反竞争行为的职责交给其他机构，随后用美国电话电报公司优待自家服务、损害对手利益来举例说明需要防范的行为。本项的<code>protects against unfair competition</code>把防范者换成了美国电话电报公司。它在原句里是问题行为的例子，不是负责防止该行为的机构，两处角色相反。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n<p>委员会声称，其他机构会防范反竞争行为，例如AT&amp;T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。</p>\n</blockquote>\n<p>FCC声称其他机构会提供保护，such as随后列出宽带企业优待自家视频服务、损害Netflix和Apple TV。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It protects against unfair competition.</p>\n<p>第三段表明AT&amp;T防范不公平竞争。</p>\n</blockquote>\n<p>C需要AT&amp;T承担制止不公平竞争的作用。实际它在举例结构中位于被批评行为的一侧，不能沿用protects却换掉主语。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. It engages in anti-competitive practices.","raw":"### D. It engages in anti-competitive practices.\n\n> 第三段表明AT&T从事反竞争做法。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\nsuch as把AT&T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。\n\n**出处：**\n\n> The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>第三段表明AT&amp;T从事反竞争做法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>such as把AT&amp;T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section>"},{"title":"D. It engages in anti-competitive practices.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 第三段表明AT&T从事反竞争做法。\n\nsuch as把AT&T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。\n\n作者先提出其他机构应防范的行为类别，再以AT&T式宽带综合企业的自我优待说明类别内容。\n\npractices是做法，与behavior对应。D不需要补出已被法院定罪的结论，仅概括文章赋予这类行为的反竞争性质。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>第三段表明AT&amp;T从事反竞争做法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>such as把AT&amp;T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T从事反竞争做法。</p>\n</blockquote>\n<p>such as把AT&amp;T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。</p>\n<p>作者先提出其他机构应防范的行为类别，再以AT&amp;T式宽带综合企业的自我优待说明类别内容。</p>\n<p>practices是做法，与behavior对应。D不需要补出已被法院定罪的结论，仅概括文章赋予这类行为的反竞争性质。</p>\n</section>"},{"title":"D. It engages in anti-competitive practices.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.\n>\n> 委员会声称，其他机构会防范反竞争行为，例如AT&T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。\n\n作者先提出其他机构应防范的行为类别，再以AT&T式宽带综合企业的自我优待说明类别内容。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> It engages in anti-competitive practices.\n>\n> 第三段表明AT&T从事反竞争做法。\n\npractices是做法，与behavior对应。D不需要补出已被法院定罪的结论，仅概括文章赋予这类行为的反竞争性质。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>第三段表明AT&amp;T从事反竞争做法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>such as把AT&amp;T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T从事反竞争做法。</p>\n</blockquote>\n<p>such as把AT&amp;T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。</p>\n<p>作者先提出其他机构应防范的行为类别，再以AT&amp;T式宽带综合企业的自我优待说明类别内容。</p>\n<p>practices是做法，与behavior对应。D不需要补出已被法院定罪的结论，仅概括文章赋予这类行为的反竞争性质。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n<p>委员会声称，其他机构会防范反竞争行为，例如AT&amp;T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。</p>\n</blockquote>\n<p>作者先提出其他机构应防范的行为类别，再以AT&amp;T式宽带综合企业的自我优待说明类别内容。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It engages in anti-competitive practices.</p>\n<p>第三段表明AT&amp;T从事反竞争做法。</p>\n</blockquote>\n<p>practices是做法，与behavior对应。D不需要补出已被法院定罪的结论，仅概括文章赋予这类行为的反竞争性质。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"38题结论","raw":"### 38题结论\n\n> **38. D**\n\n- A：favoring its own service是利用接入地位优待自家服务，at the expense of说明对手受损，不是在说提升服务质量。\n- B：关于相关提供商，文中明确说调查已经结束，且没有单独确立AT&T此时正在被查。B的当前调查状态缺少支持。\n- C：防范反竞争行为的主语是other agencies，AT&T被举为需要防范的行为例子。C把行为实施者改成防范者。\n- D：such as把AT&T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"38","questionConclusion":true},"html":"<blockquote>\n<p><strong>38. D</strong></p>\n</blockquote>\n<ul>\n<li>A：favoring its own service是利用接入地位优待自家服务，at the expense of说明对手受损，不是在说提升服务质量。</li>\n<li>B：关于相关提供商，文中明确说调查已经结束，且没有单独确立AT&amp;T此时正在被查。B的当前调查状态缺少支持。</li>\n<li>C：防范反竞争行为的主语是other agencies，AT&amp;T被举为需要防范的行为例子。C把行为实施者改成防范者。</li>\n<li>D：such as把AT&amp;T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。</li>\n</ul>\n"},{"title":"39题 · 题干、题型与核心出处","raw":"## 39题\n\n> Judge Patricia Millett argues that the appeals court’s decision ______.\n>\n> 帕特里夏·米利特法官认为，上诉法院的决定怎么样？\n\n### 题型\n\n人物观点题：直接对应法官对现实适合性的评价，分清援引的旧裁定来自哪个法院。\n\n题干点名Judge Patricia Millett，第四段直接出现她的名字以及argued和said，先把这一段完整读完，分清法院的决定与她对决定的评价。\n\n### 核心出处\n\n> On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that \"the result is unhinged from the realities of modern broadband service,\" and said Congress or the Supreme Court could intervene to \"avoid trapping Internet regulation in technological anachronism.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"39","questionIntro":true},"html":"<blockquote>\n<p>Judge Patricia Millett argues that the appeals court’s decision ______.</p>\n<p>帕特里夏·米利特法官认为，上诉法院的决定怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点题：直接对应法官对现实适合性的评价，分清援引的旧裁定来自哪个法院。</p>\n<p>题干点名Judge Patricia Millett，第四段直接出现她的名字以及argued和said，先把这一段完整读完，分清法院的决定与她对决定的评价。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n</blockquote>\n"},{"title":"A. conveys an ambiguous message","raw":"### A. conveys an ambiguous message\n\n> 米利特法官认为上诉法院的决定传达含糊信息。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n法官说结果脱离现代宽带现实，评价的是与现实是否相符；ambiguous message评价表达是否含糊，换了批评角度。\n\n**出处：**\n\n> On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that \"the result is unhinged from the realities of modern broadband service,\" and said Congress or the Supreme Court could intervene to \"avoid trapping Internet regulation in technological anachronism.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>米利特法官认为上诉法院的决定传达含糊信息。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>法官说结果脱离现代宽带现实，评价的是与现实是否相符；ambiguous message评价表达是否含糊，换了批评角度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n</blockquote>\n</section>"},{"title":"A. conveys an ambiguous message","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 米利特法官认为上诉法院的决定传达含糊信息。\n\n`conveys an ambiguous message`是对决定表达是否清楚的评价，而第四段她直接评价结果时用了`unhinged from the realities`，回看第二句，看她批评的到底是哪一点。\n\n原文的`unhinged from the realities`批评结果脱离现代宽带服务的现实，比较的是决定与现实是否相合。本项的`conveys an ambiguous message`却说决定传达的信息含糊，比较的是表达是否清楚。法官明确指出的问题是决定没有贴合现代服务状况，本项换成了决定让人读不清其意思，改变了评价所针对的方面。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>米利特法官认为上诉法院的决定传达含糊信息。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>法官说结果脱离现代宽带现实，评价的是与现实是否相符；ambiguous message评价表达是否含糊，换了批评角度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>米利特法官认为上诉法院的决定传达含糊信息。</p>\n</blockquote>\n<p><code>conveys an ambiguous message</code>是对决定表达是否清楚的评价，而第四段她直接评价结果时用了<code>unhinged from the realities</code>，回看第二句，看她批评的到底是哪一点。</p>\n<p>原文的<code>unhinged from the realities</code>批评结果脱离现代宽带服务的现实，比较的是决定与现实是否相合。本项的< ly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that \"the result is unhinged from the realities of modern broadband service,\" and said Congress or the Supreme Court could intervene to \"avoid trapping Internet regulation in technological anachronism.\"\n>\n> 周二，上诉法院一致维持2017年放松宽带提供商监管的命令，援引最高法院2005年支持类似放松监管行动的裁定。但Patricia Millett法官在赞同裁决结果的意见中恰当地指出，结果脱离现代宽带服务的现实，并说国会或最高法院可以介入，以免互联网监管被困在过时的技术框架中。\n\n现代宽带服务是判断现实适合性的背景，technological anachronism又说明不能将监管困在过时技术框架。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The appeals court’s decision is out of touch with reality.\n>\n> 米利特法官认为上诉法院的决定脱离现实。\n\nB压缩了具体背景而未更换判断对象；它没有说决定无法理解，也没有把不适应现实改成违反旧判例。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"B","cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-39-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-B-0\"><blockquote>\n<p>米利特法官认为上诉法院的决定脱离现实。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>unhinged from the realities和out of touch with reality都说决定与现实脱节，保留了法官的直接评价。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p> n broadband service,\" and said Congress or the Supreme Court could intervene to \"avoid trapping Internet regulation in technological anachronism.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-C-0\"><blockquote>\n<p>米利特法官认为上诉法院的决定与该法院先前裁决冲突。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>所引旧裁定来自最高法院，且支持类似的放松监管行动。C却说与上诉法院自身旧裁决冲突，法院与关系都变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n</blockquote>\n</section>"},{"title":"C. is at odds with its earlier rulings","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 米利特法官认为上诉法院的决定与该法院先前裁决冲突。\n\n`at odds with its earlier rulings`要找此次决定与旧裁决之间的关系，第四段第一句的`a similarly deregulatory move`涉及2005年的先前决定，第二句才是法官的评价，因而把两句连起来核对。\n\n这里写出的旧材料属于最高法院，而且其处理方向与此次类似。米利特批评的是此次结果脱离现代宽带服务的现实。本项的`at odds with its earlier rulings`把比较对象换成上诉法院自己的旧裁决，还把关系写成相冲突，与本段实际给出的法院、比较对象和关系均不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"C","cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"kind":"method"},"f
