const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. The demand for rules against preferential treatment</strong></p><p><strong>B. Ending investigations while promising other protection</strong></p><p><strong>C. A legislative answer to recurring regulatory conflict</strong></p><p><strong>D. The FCC’s retreat from neutrality regulation</strong></p><p><strong>E. A court ruling that leaves further battles unresolved</strong></p><p><strong>F. A final settlement accepted by every government</strong></p><p><strong>G. The absence of any commercial incentive to discriminate</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#x27;. That&#x27;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>Yet that demand has been almost impossible to fill—— in part because of pushback from broadband providers, anti-regulatory conservatives and the courts. A federal appeals court weighed in again Tuesday, but instead of providing a badly needed resolution, it only prolonged the fight. At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#x27;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#x27;t regulate broadband providers either.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#x27; streaming services but not their own.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot; In the meantime, the court threw out the FCC&#x27;s attempt to block all state rules on net neutrality, while preserving the commission&#x27;s power to preempt individual state laws that undermine its order. That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC&#x27;s abdication.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Broadband providers can have both the ability and the incentive to favour websites connected to their own businesses. This possibility has long worried consumers and online companies. Rules on net neutrality are demanded because access providers should not be able to decide which competitors succeed on the internet.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>At the same time, the panel refused to let the FCC block every state neutrality rule automatically. The commission retained power to challenge particular laws that undermined its order. This distinction preserved room for further disputes rather than supplying one clear rule applicable everywhere.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>The commission defended this retreat by saying that other agencies could address anti-competitive behaviour. A provider favouring its own streaming service over rivals illustrates the concern. Yet the FCC also ended investigations into practices that placed limits on competitors’ services while sparing a provider’s own.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>Ending this uncertainty requires more than another reversal inside the FCC. Congress can give the commission explicit authority to prevent providers from interfering with network traffic. A clear legislative basis would address the recurring argument over whether the regulator has the power to act at all.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>The courts did not resolve the underlying conflict when an appeals panel upheld the deregulatory order. The decision relied on an earlier Supreme Court ruling. A concurring judge nevertheless warned that its result was detached from the realities of modern broadband and might require intervention at a higher level.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>Those further disputes were already visible in the conflict involving California’s tougher neutrality law. The state had acted after the FCC withdrew from regulation, and federal authorities challenged its approach. The case illustrated how uncertainty at one level encouraged legal battles at another.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Meeting that demand has proved difficult because providers, opponents of regulation and courts have resisted different proposals. A major FCC order in 2017 removed earlier neutrality rules and rejected broad regulatory authority. It also attempted to prevent state and local governments from imposing their own requirements.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>That authority should support rules protecting openness and innovation online. The purpose is to constrain discriminatory control by access providers, not to protect their freedom to favour affiliates. Durable protection depends on a stable framework rather than an endless sequence of orders and lawsuits.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>broadband</td>\n<td>n.宽带</td>\n<td>advocates</td>\n<td>n.倡导者</td>\n<td>incentive</td>\n<td>n.动机</td>\n</tr>\n<tr>\n<td>affiliated</td>\n<td>adj.关联的</td>\n<td>rivals</td>\n<td>n.竞争对手</td>\n<td>preserve</td>\n<td>v.保护</td>\n</tr>\n<tr>\n<td>innovation</td>\n<td>n.创新</td>\n<td>lifeblood</td>\n<td>n.命脉</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>pushback</td>\n<td>n.抵制</td>\n<td>anti-regulatory</td>\n<td>adj.反监管的</td>\n<td>appeals court</td>\n<td>上诉法院</td>\n</tr>\n<tr>\n<td>resolution</td>\n<td>n.解决</td>\n<td>prolong</td>\n<td>v.延长</td>\n<td>net neutrality</td>\n<td>网络中立</td>\n</tr>\n<tr>\n<td>party-line vote</td>\n<td>按党派立场投票</td>\n<td>eliminate</td>\n<td>v.取消</td>\n<td>authority</td>\n<td>n.权限</td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>agencies</td>\n<td>n.机构</td>\n<td>anti-competitive</td>\n<td>adj.反竞争的</td>\n<td>conglomerate</td>\n<td>n.企业集团</td>\n</tr>\n<tr>\n<td>video-streaming</td>\n<td>视频流媒体</td>\n<td>at the expense of</td>\n<td>以损害……为代价</td>\n<td>investigations</td>\n<td>n.调查</td>\n</tr>\n<tr>\n<td>impose</td>\n<td>v.施加</td>\n<td>data caps</td>\n<td>流量上限</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第4段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>unanimously</td>\n<td>adv.一致地</td>\n<td>upheld</td>\n<td>v.维持</td>\n<td>deregulating</td>\n<td>v.放松监管</td>\n</tr>\n<tr>\n<td>citing</td>\n<td>v.援引</td>\n<td>concurring opinion</td>\n<td>同意意见</td>\n<td>unhinged from</td>\n<td>与……脱节</td>\n</tr>\n<tr>\n<td>intervene</td>\n<td>v.干预</td>\n<td>anachronism</td>\n<td>n.时代错位</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第5段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>in the meantime</td>\n<td>与此同时</td>\n<td>threw out</td>\n<td>否决</td>\n<td>block</td>\n<td>v.阻止</td>\n</tr>\n<tr>\n<td>preempt</td>\n<td>v.优先排除</td>\n<td>undermine</td>\n<td>v.削弱</td>\n<td>enacted</td>\n<td>v.颁布</td>\n</tr>\n<tr>\n<td>in the wake of</td>\n<td>在……之后</td>\n<td>abdication</td>\n<td>n.放弃职责</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第6段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>back-and-forth</td>\n<td>n.反复变动</td>\n<td>cry out for</td>\n<td>迫切需要</td>\n<td>explicit</td>\n<td>adj.明确的</td>\n</tr>\n<tr>\n<td>once and for all</td>\n<td>彻底地</td>\n<td>bar</td>\n<td>v.禁止</td>\n<td>meddle in</td>\n<td>干预</td>\n</tr>\n<tr>\n<td>traffic</td>\n<td>n.网络流量</td>\n<td>openness</td>\n<td>n.开放性</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n<h3>意群划分 · 第1段</h3>\n<p>From the early days of broadband, / advocates for consumers and web-based companies / worried that / the cable and phone companies / selling broadband connections / had the power and incentive / to favor affiliated websites / over their rivals&#39;.</p>\n<p>That&#39;s why / there has been such a strong demand / for rules / that would prevent broadband providers / from picking winners and losers online, / preserving the freedom and innovation / that have been the lifeblood of the Internet.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>从宽带的早期开始，/ 消费者和网络公司的倡导者们 / 担心 / 有线电视和电话公司 / 销售宽带连接的 / 拥有权力和动机 / 偏爱关联网站 / 超过他们的竞争对手。</p>\n<p>这就是为什么 / 一直有如此强烈的需求 / 对于规则 / 这些规则将阻止宽带提供商 / 在网上挑选赢家和输家，/ 保护自由和创新 / 这些一直是互联网的命脉。</p>\n<h3>标准译文 · 第1段</h3>\n<p>从宽带时代早期开始，消费者和网络公司的倡导者们就担心，销售宽带连接的有线电视和电话公司有能力也有动机偏爱其关联网站而非竞争对手。这就是为什么一直有强烈的呼声要求制定规则，防止宽带提供商在网上挑选赢家和输家，以保护作为互联网命脉的自由和创新。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Yet that demand has been almost impossible to fill—— in part because of pushback from broadband providers, anti-regulatory conservatives and the courts. A federal appeals court weighed in again Tuesday, but instead of providing a badly needed resolution, it only prolonged the fight. At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n<h3>意群划分 · 第2段</h3>\n<p>Yet that demand / has been almost impossible to fill—— / in part because of pushback / from broadband providers, / anti-regulatory conservatives / and the courts.</p>\n<p>A federal appeals court / weighed in again Tuesday, / but instead of providing / a badly needed resolution, / it only prolonged the fight.</p>\n<p>At issue / before the U. S. Court of Appeals / for the District of Columbia Circuit / was the latest take / of the Federal Communications Commission (FCC) / on net neutrality, / adopted on a party-line vote / in 2017.</p>\n<p>The Republican-penned order / not only eliminated / the strict net neutrality rules / the FCC had adopted / when it had a Democratic majority / in 2015, / but rejected / the commission&#39;s authority / to require broadband providers / to do much of anything.</p>\n<p>The order also declared / that state and local governments / couldn&#39;t regulate / broadband providers either.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>然而这个需求 / 几乎不可能被满足—— / 部分因为反对 / 来自宽带提供商、/ 反监管的保守派 / 和法院。</p>\n<p>一个联邦上诉法院 / 周二再次介入，/ 但它没有提供 / 急需的解决方案，/ 只是延长了这场斗争。</p>\n<p>争议的焦点 / 在美国上诉法院 / 哥伦比亚特区巡回法院 / 是最新的立场 / 联邦通信委员会（FCC）的 / 关于网络中立性，/ 通过党派投票通过 / 在2017年。</p>\n<p>共和党起草的命令 / 不仅取消了 / 严格的网络中立性规则 / FCC曾经采纳的 / 当它拥有民主党多数时 / 在2015年，/ 而且拒绝了 / 委员会的权力 / 要求宽带提供商 / 做任何事情。</p>\n<p>该命令还宣布 / 州和地方政府 / 也不能监管 / 宽带提供商。</p>\n<h3>标准译文 · 第2段</h3>\n<p>然而，这一需求几乎不可能得到满足——部分原因是来自宽带提供商、反监管保守派和法院的反对。周二，一个联邦上诉法院再次介入，但它没有提供急需的解决方案，只是延长了这场斗争。哥伦比亚特区巡回上诉法院面临的争议是FCC在2017年通过党派投票通过的关于网络中立性的最新立场。这项由共和党起草的命令不仅取消了FCC在2015年民主党占多数时采纳的严格网络中立性规则，还拒绝了委员会要求宽带提供商做任何事情的权力。该命令还宣布州和地方政府也不能监管宽带提供商。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n<h3>意群划分 · 第3段</h3>\n<p>The commission argued / that other agencies / would protect / against anti-competitive behavior, / such as a broadband-providing conglomerate / like AT&amp;T / favoring its own video-streaming service / at the expense of Netflix and Apple TV.</p>\n<p>Yet the FCC / also ended the investigations / of broadband providers / that imposed data caps / on their rivals&#39; streaming services / but not their own.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>委员会辩称 / 其他机构 / 会保护 / 免受反竞争行为，/ 例如提供宽带的企业集团 / 像AT&amp;T / 偏爱自己的视频流媒体服务 / 以牺牲Netflix和Apple TV为代价。</p>\n<p>然而FCC / 也结束了调查 / 对宽带提供商的 / 那些施加数据上限的 / 对他们竞争对手的流媒体服务 / 但不对自己的。</p>\n<h3>标准译文 · 第3段</h3>\n<p>委员会辩称，其他机构会防止反竞争行为，例如像AT&amp;T这样的宽带企业集团以牺牲Netflix和Apple TV为代价偏爱自己的视频流媒体服务。然而，FCC也终止了对那些对竞争对手的流媒体服务施加数据上限但对自己服务不设限的宽带提供商的调查。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n<h3>意群划分 · 第4段</h3>\n<p>On Tuesday, / the appeals court / unanimously upheld / the 2017 order / deregulating broadband providers, / citing a Supreme Court ruling / from 2005 / that upheld / a similarly deregulatory move.</p>\n<p>But Judge Patricia Millett / rightly argued / in a concurring opinion / that &quot;the result is unhinged / from the realities / of modern broadband service,&quot; / and said / Congress or the Supreme Court / could intervene / to &quot;avoid trapping Internet regulation / in technological anachronism.&quot;</p>\n<h3>意群翻译 · 第4段</h3>\n<p>周二，/ 上诉法院 / 一致支持 / 2017年的命令 / 解除对宽带提供商的监管，/ 引用了最高法院的裁决 / 从2005年 / 该裁决支持 / 类似的去监管举措。</p>\n<p>但帕特里夏·米利特法官 / 正确地论证 / 在赞同意见中 / &quot;结果是脱离的 / 从现实中 / 现代宽带服务的，&quot; / 并说 / 国会或最高法院 / 可以介入 / 来&quot;避免将互联网监管困在 / 技术时代错误中。&quot;</p>\n<h3>标准译文 · 第4段</h3>\n<p>周二，上诉法院一致支持2017年解除对宽带提供商监管的命令，引用了2005年最高法院支持类似去监管举措的裁决。但帕特里夏·米利特法官在赞同意见中正确地指出，&quot;这一结果脱离了现代宽带服务的现实&quot;，并表示国会或最高法院可以介入，以&quot;避免将互联网监管困在技术时代错误中&quot;。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>In the meantime, the court threw out the FCC&#39;s attempt to block all state rules on net neutrality, while preserving the commission&#39;s power to preempt individual state laws that undermine its order. That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC&#39;s abdication.</p>\n<h3>意群划分 · 第5段</h3>\n<p>In the meantime, / the court threw out / the FCC&#39;s attempt / to block all state rules / on net neutrality, / while preserving / the commission&#39;s power / to preempt individual state laws / that undermine its order.</p>\n<p>That means / more battles / like the one / now going on / between the Justice Department and California, / which enacted / a tough net neutrality law / in the wake of / the FCC&#39;s abdication.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>与此同时，/ 法院推翻了 / FCC的企图 / 阻止所有州规则 / 关于网络中立性的，/ 同时保留 / 委员会的权力 / 优先于个别州法律 / 那些破坏其命令的。</p>\n<p>这意味着 / 更多的战斗 / 像那个 / 现在正在进行的 / 在司法部和加利福尼亚州之间，/ 该州制定了 / 严格的网络中立性法律 / 在之后 / FCC的放弃。</p>\n<h3>标准译文 · 第5段</h3>\n<p>与此同时，法院推翻了FCC试图阻止所有州网络中立性规则的企图，但保留了委员会优先于破坏其命令的个别州法律的权力。这意味着会有更多像司法部和加利福尼亚州之间正在进行的战斗，加州在FCC放弃职责后制定了严格的网络中立性法律。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n<h3>意群划分 · 第6段</h3>\n<p>The endless legal battles / and back-and-forth / at the FCC / cry out / for Congress to act.</p>\n<p>It needs to give / the commission / explicit authority / once and for all / to bar broadband providers / from meddling in the traffic / on their network / and to create clear rules / protecting openness and innovation / online.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>无休止的法律战斗 / 和反复 / 在FCC / 迫切需要 / 国会采取行动。</p>\n<p>它需要给予 / 委员会 / 明确的权力 / 一劳永逸地 / 禁止宽带提供商 / 干预流量 / 在他们的网络上 / 并创建明确的规则 / 保护开放性和创新 / 在线上。</p>\n<h3>标准译文 · 第6段</h3>\n<p>FCC无休止的法律战斗和反复无常迫切需要国会采取行动。国会需要一劳永逸地赋予委员会明确的权力，禁止宽带提供商干预其网络上的流量，并创建保护在线开放性和创新的明确规则。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>From the early days of broadband → advocates for consumers and web-based companies → worried：(that the cable and phone companies：(selling broadband connections) → had the power and incentive → to favor affiliated websites：(over their rivals&#39;)).</p>\n<p>That&#39;s why → there has been such a strong demand：(for rules：(that would prevent broadband providers → from picking winners and losers online))，preserving the freedom and innovation：(that have been the lifeblood of the Internet).</p>\n<p><strong>第2段</strong></p>\n<p>Yet that demand → has been almost impossible to fill：(in part because of pushback：(from broadband providers + anti-regulatory conservatives + the courts)).</p>\n<p>A federal appeals court → weighed in again Tuesday // but instead of providing：(a badly needed resolution) → it only prolonged the fight.</p>\n<p>At issue：(before the U. S. Court of Appeals：(for the District of Columbia Circuit)) → was the latest take：(of the Federal Communications Commission (FCC))：(on net neutrality)：(adopted on a party-line vote：(in 2017)).</p>\n<p>The Republican-penned order → not only eliminated：(the strict net neutrality rules：(the FCC had adopted：(when it had a Democratic majority：(in 2015)))) // but rejected：(the commission&#39;s authority：(to require broadband providers：(to do much of anything))).</p>\n<p>The order also declared：(that state and local governments → couldn&#39;t regulate：(broadband providers either)).</p>\n<p><strong>第3段</strong></p>\n<p>The commission argued：(that other agencies → would protect：(against anti-competitive behavior))：(such as a broadband-providing conglomerate：(like AT&amp;T) → favoring its own video-streaming service：(at the expense of Netflix and Apple TV)).</p>\n<p>Yet the FCC → also ended the investigations：(of broadband providers：(that imposed data caps：(on their rivals&#39; streaming services) // but not their own)).</p>\n<p><strong>第4段</strong></p>\n<p>On Tuesday → the appeals court → unanimously upheld：(the 2017 order：(deregulating broadband providers))，citing a Supreme Court ruling：(from 2005)：(that upheld：(a similarly deregulatory move)).</p>\n<p>But Judge Patricia Millett → rightly argued：(in a concurring opinion)：(that &quot;the result is unhinged：(from the realities：(of modern broadband service))&quot;) + said：(Congress or the Supreme Court → could intervene：(to &quot;avoid trapping Internet regulation：(in technological anachronism)&quot;)).</p>\n<p><strong>第5段</strong></p>\n<p>In the meantime → the court threw out：(the FCC&#39;s attempt：(to block all state rules：(on net neutrality))) // while preserving：(the commission&#39;s power：(to preempt individual state laws：(that undermine its order))).</p>\n<p>That means → more battles：(like the one：(now going on：(between the Justice Department and California)))：(which enacted：(a tough net neutrality law)：(in the wake of：(the FCC&#39;s abdication))).</p>\n<p><strong>第6段</strong></p>\n<p>The endless legal battles + back-and-forth：(at the FCC) → cry out：(for Congress to act).</p>\n<p>It needs to give：(the commission) → explicit authority：(once and for all)：(to bar broadband providers：(from meddling in the traffic：(on their network))) + (to create clear rules：(protecting openness and innovation：(online))).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>从宽带的早期开始 → 消费者和网络公司的倡导者们 → 担心：(有线电视和电话公司：(销售宽带连接的) → 拥有权力和动机 → 偏爱关联网站：(超过他们的竞争对手))。</p>\n<p>这就是为什么 → 一直有如此强烈的需求：(对于规则：(这些规则将阻止宽带提供商 → 在网上挑选赢家和输家))，保护自由和创新：(这些一直是互联网的命脉)。</p>\n<p><strong>第2段</strong></p>\n<p>然而这个需求 → 几乎不可能被满足：(部分因为反对：(来自宽带提供商 + 反监管的保守派 + 法院))。</p>\n<p>一个联邦上诉法院 → 周二再次介入 // 但它没有提供：(急需的解决方案) → 只是延长了这场斗争。</p>\n<p>争议的焦点：(在美国上诉法院：(哥伦比亚特区巡回法院)) → 是最新的立场：(联邦通信委员会（FCC）的)：(关于网络中立性)：(通过党派投票通过：(在2017年))。</p>\n<p>共和党起草的命令 → 不仅取消了：(严格的网络中立性规则：(FCC曾经采纳的：(当它拥有民主党多数时：(在2015年)))) // 而且拒绝了：(委员会的权力：(要求宽带提供商：(做任何事情)))。</p>\n<p>该命令还宣布：(州和地方政府 → 也不能监管：(宽带提供商))。</p>\n<p><strong>第3段</strong></p>\n<p>委员会辩称：(其他机构 → 会保护：(免受反竞争行为))：(例如提供宽带的企业集团：(像AT&amp;T) → 偏爱自己的视频流媒体服务：(以牺牲Netflix和Apple TV为代价))。</p>\n<p>然而FCC → 也结束了调查：(对宽带提供商的：(那些施加数据上限的：(对他们竞争对手的流媒体服务) // 但不对自己的))。</p>\n<p><strong>第4段</strong></p>\n<p>周二 → 上诉法院 → 一致支持：(2017年的命令：(解除对宽带提供商的监管))，引用了最高法院的裁决：(从2005年)：(该裁决支持：(类似的去监管举措))。</p>\n<p>但帕特里夏·米利特法官 → 正确地论证：(在赞同意见中)：(&quot;结果是脱离的：(从现实中：(现代宽带服务的))&quot;) + 说：(国会或最高法院 → 可以介入：(来&quot;避免将互联网监管困在：(技术时代错误中)&quot;))。</p>\n<p><strong>第5段</strong></p>\n<p>与此同时 → 法院推翻了：(FCC的企图：(阻止所有州规则：(关于网络中立性的))) // 同时保留：(委员会的权力：(优先于个别州法律：(那些破坏其命令的)))。</p>\n<p>这意味着 → 更多的战斗：(像那个：(现在正在进行的：(在司法部和加利福尼亚州之间)))：(该州制定了：(严格的网络中立性法律)：(在之后：(FCC的放弃)))。</p>\n<p><strong>第6段</strong></p>\n<p>无休止的法律战斗 + 反复：(在FCC) → 迫切需要：(国会采取行动)。</p>\n<p>它需要给予：(委员会) → 明确的权力：(一劳永逸地)：(禁止宽带提供商：(干预流量：(在他们的网络上))) + (创建明确的规则：(保护开放性和创新：(在线上)))。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>From the early days of broadband, / advocates for consumers and web-based companies / worried that / the cable and phone companies / selling broadband connections / had the power and incentive / to favor affiliated websites / over their rivals&#39;.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>从宽带的早期开始，/ 消费者和网络公司的倡导者们 / 担心 / 有线电视和电话公司 / 销售宽带连接的 / 拥有权力和动机 / 偏爱关联网站 / 超过他们的竞争对手。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>将selling broadband connections接到cable and phone companies，再把power and incentive与favor相连。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>从宽带的早期开始， 消费者和网络公司的倡导者们  担心  有线电视和电话公司  销售宽带连接的  拥有权力和动机  偏爱关联网站  超过他们的竞争对手。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>消费者与网络企业担心宽带提供商会偏袒关联网站。</p>\n</blockquote>\n<p>先说担忧者与时间背景，再说谁可能利用怎样的能力和动机做什么。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>从宽带时代早期开始，消费者和网络公司的倡导者们就担心，销售宽带连接的有线电视和电话公司有能力也有动机偏爱其关联网站而非竞争对手。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>their rivals指关联网站的对手，不能把差别优待写成控制所有网络公司。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>从宽带时代早期开始，消费者和网络公司的倡导者们就担心，销售宽带连接的有线电视和电话公司有能力也有动机偏爱其关联网站而非竞争对手。</p>\n</blockquote>\n<h2>2. 第2段第4句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>The Republican-penned order / not only eliminated / the strict net neutrality rules / the FCC had adopted / when it had a Democratic majority / in 2015, / but rejected / the commission&#39;s authority / to require broadband providers / to do much of anything.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>共和党起草的命令 / 不仅取消了 / 严格的网络中立性规则 / FCC曾经采纳的 / 当它拥有民主党多数时 / 在2015年，/ 而且拒绝了 / 委员会的权力 / 要求宽带提供商 / 做任何事情。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>not only ... but连接两个并列撤退动作，when补充2015年委员会多数党的背景。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>共和党起草的命令  不仅取消了  严格的网络中立性规则  FCC曾经采纳的  当它拥有民主党多数时  在2015年， 而且拒绝了  委员会的权力  要求宽带提供商  做任何事情。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>命令既取消严格规则，也否认委员会的监管权限。</p>\n</blockquote>\n<p>先叙述取消旧规则，再说明对权限的进一步否定。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>这项由共和党起草的命令不仅取消了FCC在2015年民主党占多数时采纳的严格网络中立性规则，还拒绝了委员会要求宽带提供商做任何事情的权力。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>2017年命令与2015年规则分清，不能将两个时间和党派背景混在一起。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>这项由共和党起草的命令不仅取消了FCC在2015年民主党占多数时采纳的严格网络中立性规则，还拒绝了委员会要求宽带提供商做任何事情的权力。</p>\n</blockquote>\n<h2>3. 第5段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>In the meantime, the court threw out the FCC&#39;s attempt to block all state rules on net neutrality, while preserving the commission&#39;s power to preempt individual state laws that undermine its order.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>In the meantime, / the court threw out / the FCC&#39;s attempt / to block all state rules / on net neutrality, / while preserving / the commission&#39;s power / to preempt individual state laws / that undermine its order.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>与此同时，/ 法院推翻了 / FCC的企图 / 阻止所有州规则 / 关于网络中立性的，/ 同时保留 / 委员会的权力 / 优先于个别州法律 / 那些破坏其命令的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>while连接否定全面封锁与保留个别优先权，that限定哪些州法可能被排除。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>与此同时， 法院推翻了  FCC的企图  阻止所有州规则  关于网络中立性的， 同时保留  委员会的权力  优先于个别州法律  那些破坏其命令的。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>法院否定全面阻止州规则，但保留排除特定州法的权力。</p>\n</blockquote>\n<p>先说明法院驳回的范围，再指出仍保留的具体权限。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>与此同时，法院推翻了FCC试图阻止所有州网络中立性规则的企图，但保留了委员会优先于破坏其命令的个别州法律的权力。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>all与individual的范围差异是主干，不能译成州法完全无约束或完全不得存在。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>与此同时，法院推翻了FCC试图阻止所有州网络中立性规则的企图，但保留了委员会优先于破坏其命令的个别州法律的权力。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>36题</h2>\n<blockquote>\n<p>There has long been concern that broadband providers would ______.</p>\n<p>长期以来，人们一直担心宽带提供商会做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>担忧内容细节题：区分偏袒关系与可能的具体技术手段，不自行补限速或公司控制。</p>\n<p>题干中的long been concern和broadband providers让人想起第一段粗读中的advocates for consumers、selling broadband connections以及to favor affiliated websites。这里讨论的是从宽带早期就存在的担忧，先把第一段完整读一遍。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n</blockquote>\n<h3>A. show partiality in treating clients</h3>\n<blockquote>\n<p>长期以来人们担心宽带提供商会对客户区别偏袒。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>favor...over表示优待关联网站、使竞争对手处于不利位置，show partiality概括这种差别待遇。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>长期以来人们担心宽带提供商会对客户区别偏袒。</p>\n</blockquote>\n<p>favor...over表示优待关联网站、使竞争对手处于不利位置，show partiality概括这种差别待遇。</p>\n<p>首句提出提供商有偏袒的权力与动机，That&#39;s why再用这一风险解释为何需要防止它们挑选网上赢家输家的规则。</p>\n<p>clients在此概括使用网络接入的一方。A保留对不同使用方不公平对待的核心，没有额外指定限速等具体手段。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n<p>从宽带早期起，消费者及网络企业的倡导者就担心，销售宽带连接的有线和电话公司有权力也有动机，优待关联网站而非其竞争对手。因此人们强烈要求规则，防止宽带提供商决定网上谁赢谁输，维护一直是互联网生命力所在的自由和创新。</p>\n</blockquote>\n<p>首句提出提供商有偏袒的权力与动机，That&#39;s why再用这一风险解释为何需要防止它们挑选网上赢家输家的规则。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Broadband providers would show partiality in treating clients.</p>\n<p>长期以来人们担心宽带提供商会对客户区别偏袒。</p>\n</blockquote>\n<p>clients在此概括使用网络接入的一方。A保留对不同使用方不公平对待的核心，没有额外指定限速等具体手段。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. bring web-based firms under control</h3>\n<blockquote>\n<p>长期以来人们担心宽带提供商会把网络公司置于控制之下。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>影响网站竞争结果不等于把网络公司置于自身控制之下。原文担忧的是服务上的偏袒，未建立对公司本身的控制关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>长期以来人们担心宽带提供商会把网络公司置于控制之下。</p>\n</blockquote>\n<p><code>bring web-based firms under control</code>谈提供商对网络公司的控制，第一段的<code>picking winners and losers online</code>则谈提供商影响网上竞争结果，因此把第一段两句连起来看它具体担心哪种行为。</p>\n<p>原文先明确写优待关联网站，再以<code>picking winners and losers online</code>概括这种差别待遇对网上竞争的影响：提供商能够偏向一方、使另一方处于劣势。本项的<code>bring web-based firms under control</code>则把网络公司本身作为控制对象，说提供商将这些公司置于自己的控制之下。影响网站之间的竞争结果，并没有建立提供商控制网络公司本身的关系；本项把原文已经说清的偏袒做法改成了对公司的控制。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n<p>从宽带早期起，消费者及网络企业的倡导者就担心，销售宽带连接的有线和电话公司有权力也有动机，优待关联网站而非其竞争对手。因此人们强烈要求规则，防止宽带提供商决定网上谁赢谁输，维护一直是互联网生命力所在的自由和创新。</p>\n</blockquote>\n<p>作者先以关联网站与对手作比较，再把差别待遇的竞争效果概括为挑选赢家输家。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Broadband providers would bring web-based firms under control.</p>\n<p>长期以来人们担心宽带提供商会把网络公司置于控制之下。</p>\n</blockquote>\n<p>B需要提供商取得支配网络公司的关系。可以影响谁占优势，不自动意味着控制公司的组织、经营或行动。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. slow down the traffic on their network</h3>\n<blockquote>\n<p>长期以来人们担心宽带提供商会减缓网络上的流量传输。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>slow down是具体降低传输速度，原文只确定关联网站得到优待，未将这种偏袒限定为整体网络传输减慢。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>长期以来人们担心宽带提供商会减缓网络上的流量传输。</p>\n</blockquote>\n<p><code>slow down the traffic</code>说的是传输速度；回到第一段表达担忧的第一句，那里写的是<code>to favor affiliated websites</code>，需要分清原文担心的做法与本项添加的具体手段。</p>\n<p>原文明确写销售宽带连接的公司能够<code>to favor affiliated websites</code>，让关联网站比竞争对手更受优待。本项的<code>slow down the traffic</code>把担忧落在减缓网络流量传输上。</p>\n<p>优待一方是一种差别待遇，减缓传输则是具体的速度操作；原句并没有把前者接到这个具体手段上。</p>\n<p>本项因此把原文的偏袒关系改写成了降低传输速度的行为。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n<p>从宽带早期起，消费者及网络企业的倡导者就担心，销售宽带连接的有线和电话公司有权力也有动机，优待关联网站而非其竞争对手。因此人们强烈要求规则，防止宽带提供商决定网上谁赢谁输，维护一直是互联网生命力所在的自由和创新。</p>\n</blockquote>\n<p>担忧从商业关联关系和区别对待引出，后面的规则目的仍是防止提供商左右竞争。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Broadband providers would slow down the traffic on their network.</p>\n<p>长期以来人们担心宽带提供商会减缓网络上的流量传输。</p>\n</blockquote>\n<p>C需要网络流量变慢这一明确结果。限速可以是想得到的技术方式，但不能把可能手段当作本段已经写出的担忧内容。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. intensify competition with their rivals</h3>\n<blockquote>\n<p>长期以来人们担心宽带提供商会加剧与自身对手的竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>挑选谁赢谁输意味着偏袒并改变竞争条件，intensify competition则说与对手的竞争更激烈，动作和比较关系不同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>长期以来人们担心宽带提供商会加剧与自身对手的竞争。</p>\n</blockquote>\n<p><code>intensify competition</code>说的是竞争强度增加，第一段的<code>favor affiliated websites</code>描述偏袒网站，后一句又以<code>picking winners and losers online</code>概括这种做法，因此回看这两处动作之间是否相同。</p>\n<p>原文中的<code>favor affiliated websites</code>明确写提供商优待关联网站，后面的<code>picking winners and losers online</code>说明这种差别待遇使提供商能够影响网上竞争的结果。本项的<code>intensify competition with their rivals</code>则说提供商加剧与对手的竞争。</p>\n<p>偏袒网站、左右谁赢谁输，与让竞争变得更激烈，是两种不同的动作；原文没有把前者接成竞争强度增加。</p>\n<p>本项因此改变了题干所问的担忧内容。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n<p>从宽带早期起，消费者及网络企业的倡导者就担心，销售宽带连接的有线和电话公司有权力也有动机，优待关联网站而非其竞争对手。因此人们强烈要求规则，防止宽带提供商决定网上谁赢谁输，维护一直是互联网生命力所在的自由和创新。</p>\n</blockquote>\n<p>提供商凭网络接入权优待关联服务，作者因此希望规则维护自由和创新，而非讨论提供商如何加强竞争。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Broadband providers would intensify competition with their rivals.</p>\n<p>长期以来人们担心宽带提供商会加剧与自身对手的竞争。</p>\n</blockquote>\n<p>D需要竞争强度增加的描述。关联网站占优势不等于竞争更充分或更激烈，不能仅凭rivals把两种关系合并。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>36题结论</h3>\n<blockquote>\n<p><strong>36. A</strong></p>\n</blockquote>\n<ul>\n<li>A：favor...over表示优待关联网站、使竞争对手处于不利位置，show partiality概括这种差别待遇。</li>\n<li>B：影响网站竞争结果不等于把网络公司置于自身控制之下。原文担忧的是服务上的偏袒，未建立对公司本身的控制关系。</li>\n<li>C：slow down是具体降低传输速度，原文只确定关联网站得到优待，未将这种偏袒限定为整体网络传输减慢。</li>\n<li>D：挑选谁赢谁输意味着偏袒并改变竞争条件，intensify competition则说与对手的竞争更激烈，动作和比较关系不同。</li>\n</ul>\n<h2>37题</h2>\n<blockquote>\n<p>Faced with the demand for net neutrality rules, the FCC ______.</p>\n<p>面对制定网络中立性规则的要求，联邦通信委员会做了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>行为概括题：将取消规则、否定权限和排除州监管归纳为FCC的回应方向。</p>\n<p>题干直接给出FCC，并问它如何面对net neutrality rules的要求。第二段出现了这个机构的全称，还说明2017年的命令如何处理此前的规则，先完整读第二段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n<h3>A. sticks to an out-of-date order</h3>\n<blockquote>\n<p>面对网络中立规则的需求，FCC坚持一项过时命令。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第二段写撤销2015年规则、否定监管权限及禁止州监管，A却概括为坚持一项过时命令，未说明这一回应方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC坚持一项过时命令。</p>\n</blockquote>\n<p><code>sticks to an out-of-date order</code>既包含坚持某项命令的动作，也把该命令判为过时，回看第二段第四句的<code>eliminated the strict net neutrality rules</code>以及随后对监管权力的处理，核对委员会回应要求的具体做法。</p>\n<p>原文说委员会的命令<code>eliminated the strict net neutrality rules</code>，并否定委员会要求提供商采取行动的权力，具体写出的是撤销规则和否定监管权限。本项的<code>sticks to an out-of-date order</code>改为坚持一项被判定过时的命令，额外建立了委员会坚持该命令的关系，也加入了过时的评价。这里不能因为命令发表于2017年就认定它不会过时；问题在于，本段已经明确写出的委员会做法，并不是本项所说的坚持某项过时命令。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n<p>哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。</p>\n</blockquote>\n<p>作者从规则需求难满足转到2017年命令的具体内容，三个动作共同展示退出监管。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The FCC sticks to an out-of-date order.</p>\n<p>面对网络中立规则的需求，FCC坚持一项过时命令。</p>\n</blockquote>\n<p>A需要FCC坚持某项旧命令这一关系。后文法官确实批评结果脱离现代现实，但那是对法院结果的评价，不能直接搬来替代本段FCC的行动。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. has allowed the states to intervene</h3>\n<blockquote>\n<p>面对网络中立规则的需求，FCC已允许各州介入。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命令明确宣布州和地方政府也不能监管，B却说FCC允许各州介入，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC已允许各州介入。</p>\n</blockquote>\n<p><code>has allowed the states to intervene</code>涉及各州能否监管，直接接到第二段末句的<code>state and local governments couldn’t regulate</code>，回看这一句中命令的规定。</p>\n<p>原文的命令宣布<code>state and local governments couldn’t regulate</code>，即州和地方政府也不能监管宽带提供商。本项的<code>has allowed the states to intervene</code>说委员会允许各州介入。同样谈各州参与，原文给的是禁止，选项却写成允许，方向相反。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n<p>哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。</p>\n</blockquote>\n<p>取消联邦严格规则之后，命令又将禁止监管扩展到州与地方，either让两层退出相接。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The FCC has allowed the states to intervene.</p>\n<p>面对网络中立规则的需求，FCC已允许各州介入。</p>\n</blockquote>\n<p>B需要由FCC给各州开放权限。后面法院撤销全面封堵州法的企图属于法院行动，不能当作FCC主动允许。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. has issued a special resolution</h3>\n<blockquote>\n<p>面对网络中立规则的需求，FCC已发布一项特别决议。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时C尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>经过投票形成命令确属正式决定，C与这一形式有联系；但它没有说明FCC怎样回应监管需求，D能概括实际撤销和拒绝监管的立场。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC已发布一项特别决议。</p>\n</blockquote>\n<p>经过投票形成命令确属正式决定，C与这一形式有联系；但它没有说明FCC怎样回应监管需求，D能概括实际撤销和拒绝监管的立场。</p>\n<p>adopted先交代决定产生，后文连续用eliminated、rejected、couldn&#39;t regulate说明决定具体做了什么。</p>\n<p>不能因order与resolution字面不同就否认存在正式决定。C的special也没有独立依据；更关键的是它停在发文形式，D直接回答监管需求得到什么方向的回应。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n<p>哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。</p>\n</blockquote>\n<p>adopted先交代决定产生，后文连续用eliminated、rejected、couldn&#39;t regulate说明决定具体做了什么。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The FCC has issued a special resolution.</p>\n<p>面对网络中立规则的需求，FCC已发布一项特别决议。</p>\n</blockquote>\n<p>不能因order与resolution字面不同就否认存在正式决定。C的special也没有独立依据；更关键的是它停在发文形式，D直接回答监管需求得到什么方向的回应。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. takes an anti-regulatory stance</h3>\n<blockquote>\n<p>面对网络中立规则的需求，FCC采取反监管立场。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>取消严格规则、否定自身监管权、禁止州与地方监管，三项决定共同指向anti-regulatory stance。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>面对网络中立规则的需求，FCC采取反监管立场。</p>\n</blockquote>\n<p><code>takes an anti-regulatory stance</code>要由委员会如何处理监管来判断，第二段第四句的<code>rejected the commission’s authority</code>与取消既有规则一起写出了它的决定，接着末句又谈州和地方政府，回看这两句。</p>\n<p>原文说命令取消严格的网络中立性规则，又<code>rejected the commission’s authority</code>，否定委员会要求宽带提供商采取行动的权力，还宣布州和地方政府不能监管。三处动作都在撤去或阻止对提供商的监管。本项的<code>takes an anti-regulatory stance</code>正是把这些决定概括为反对监管的立场，主体仍然是作出命令的委员会。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n<p>哥伦比亚特区巡回上诉法院面前的争议是FCC对网络中立的最新立场，该立场在2017年按党派划线的投票中通过。共和党拟定的命令不仅取消FCC在2015年民主党占多数时采用的严格网络中立规则，还否定委员会要求宽带提供商做许多事情的权限。命令还宣布，州和地方政府同样不能监管宽带提供商。</p>\n</blockquote>\n<p>第二段从未满足的中立规则需求出发，逐项解释新命令撤去哪些监管安排，而第三段结束调查继续体现这一方向。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The FCC takes an anti-regulatory stance.</p>\n<p>面对网络中立规则的需求，FCC采取反监管立场。</p>\n</blockquote>\n<p>D以反监管概括具体行动，并未额外声称FCC反对一切领域的所有监管；语境仍是宽带提供商的网络中立问题。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>37题结论</h3>\n<blockquote>\n<p><strong>37. D</strong></p>\n</blockquote>\n<ul>\n<li>A：第二段写撤销2015年规则、否定监管权限及禁止州监管，A却概括为坚持一项过时命令，未说明这一回应方向。</li>\n<li>B：命令明确宣布州和地方政府也不能监管，B却说FCC允许各州介入，方向相反。</li>\n<li>C：经过投票形成命令确属正式决定，C与这一形式有联系；但它没有说明FCC怎样回应监管需求，D能概括实际撤销和拒绝监管的立场。</li>\n<li>D：取消严格规则、否定自身监管权、禁止州与地方监管，三项决定共同指向anti-regulatory stance。</li>\n</ul>\n<h2>38题</h2>\n<blockquote>\n<p>What can be learned about AT&amp;T from Paragraph 3?</p>\n<p>从第三段可以了解美国电话电报公司的什么情况？</p>\n</blockquote>\n<h3>题型</h3>\n<p>主体与行为细节题：分清防范者、反竞争行为的例子及调查状态。</p>\n<p>题干明确指定Paragraph 3，并点名AT&amp;T，直接完整阅读第三段，检查这家公司出现的位置以及它被用来说明的行为。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n<h3>A. It is in pursuit of quality service.</h3>\n<blockquote>\n<p>第三段表明AT&amp;T追求优质服务。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>favoring its own service是利用接入地位优待自家服务，at the expense of说明对手受损，不是在说提升服务质量。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T追求优质服务。</p>\n</blockquote>\n<p><code>in pursuit of quality service</code>涉及这家公司如何发展服务，第三段第一句的<code>favoring its own video-streaming service</code>正好写它对自身服务的做法，因此回看这句话及随后说明代价的部分。</p>\n<p>原文的<code>favoring its own video-streaming service</code>是利用提供宽带的地位优待自己的视频服务，并明确把奈飞和苹果电视的利益受损作为代价。本项的<code>in pursuit of quality service</code>把公司的行为解释为追求服务质量。优待自己的服务与提高服务质量不是同一个动作，尤其原句具体交代了竞争对手承担代价，本项却把这种竞争中的差别待遇改成了改善服务的目标。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n<p>委员会声称，其他机构会防范反竞争行为，例如AT&amp;T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。</p>\n</blockquote>\n<p>AT&amp;T作为反竞争行为的例子出现，下一句又说明给对手而不给自己的服务设流量上限。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It is in pursuit of quality service.</p>\n<p>第三段表明AT&amp;T追求优质服务。</p>\n</blockquote>\n<p>A需要改善品质的目标或行动。自己的业务获得优待与业务质量提高并不相同，不能把偏袒包装为质量追求。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. It is under the FCC’s investigation.</h3>\n<blockquote>\n<p>第三段表明AT&amp;T正在接受FCC调查。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>关于相关提供商，文中明确说调查已经结束，且没有单独确立AT&amp;T此时正在被查。B的当前调查状态缺少支持。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T正在接受FCC调查。</p>\n</blockquote>\n<p><code>under the FCC’s investigation</code>直接涉及调查状态，第三段第二句出现<code>ended the investigations</code>，因此回看这句中调查是否仍在进行。</p>\n<p>原文的<code>ended the investigations</code>说委员会已经结束对相关宽带提供商的调查，调查针对的是只给对手的流媒体服务设置流量上限的提供商。本项的<code>under the FCC’s investigation</code>却说美国电话电报公司正处在委员会调查之中。段落没有单独确立这家公司的调查状态，而且关于这类提供商明确给出的动作是终止调查，本项把已结束的调查写成正在进行。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n<p>委员会声称，其他机构会防范反竞争行为，例如AT&amp;T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。</p>\n</blockquote>\n<p>第一句以AT&amp;T说明反竞争风险，第二句转到FCC结束对设差别流量上限者的调查。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It is under the FCC’s investigation.</p>\n<p>第三段表明AT&amp;T正在接受FCC调查。</p>\n</blockquote>\n<p>不能把两句直接合成AT&amp;T一定是那项调查的对象；即使只看相关调查，其状态也是ended，并非under investigation。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. It protects against unfair competition.</h3>\n<blockquote>\n<p>第三段表明AT&amp;T防范不公平竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>防范反竞争行为的主语是other agencies，AT&amp;T被举为需要防范的行为例子。C把行为实施者改成防范者。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T防范不公平竞争。</p>\n</blockquote>\n<p><code>protects against unfair competition</code>与第一句的<code>other agencies would protect against anti-competitive behavior</code>意思相接，要回看这句是谁负责防范，以及美国电话电报公司在句中扮演什么角色。</p>\n<p>原文中<code>other agencies would protect against anti-competitive behavior</code>把防范反竞争行为的职责交给其他机构，随后用美国电话电报公司优待自家服务、损害对手利益来举例说明需要防范的行为。本项的<code>protects against unfair competition</code>把防范者换成了美国电话电报公司。它在原句里是问题行为的例子，不是负责防止该行为的机构，两处角色相反。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n<p>委员会声称，其他机构会防范反竞争行为，例如AT&amp;T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。</p>\n</blockquote>\n<p>FCC声称其他机构会提供保护，such as随后列出宽带企业优待自家视频服务、损害Netflix和Apple TV。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It protects against unfair competition.</p>\n<p>第三段表明AT&amp;T防范不公平竞争。</p>\n</blockquote>\n<p>C需要AT&amp;T承担制止不公平竞争的作用。实际它在举例结构中位于被批评行为的一侧，不能沿用protects却换掉主语。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. It engages in anti-competitive practices.</h3>\n<blockquote>\n<p>第三段表明AT&amp;T从事反竞争做法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>such as把AT&amp;T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第三段表明AT&amp;T从事反竞争做法。</p>\n</blockquote>\n<p>such as把AT&amp;T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。</p>\n<p>作者先提出其他机构应防范的行为类别，再以AT&amp;T式宽带综合企业的自我优待说明类别内容。</p>\n<p>practices是做法，与behavior对应。D不需要补出已被法院定罪的结论，仅概括文章赋予这类行为的反竞争性质。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n<p>委员会声称，其他机构会防范反竞争行为，例如AT&amp;T这类提供宽带的综合企业优待自己的视频流媒体服务，牺牲Netflix和Apple TV的利益。然而FCC也结束了对某些宽带提供商的调查；这些提供商给竞争对手的流媒体服务设流量上限，却不给自己的设限。</p>\n</blockquote>\n<p>作者先提出其他机构应防范的行为类别，再以AT&amp;T式宽带综合企业的自我优待说明类别内容。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It engages in anti-competitive practices.</p>\n<p>第三段表明AT&amp;T从事反竞争做法。</p>\n</blockquote>\n<p>practices是做法，与behavior对应。D不需要补出已被法院定罪的结论，仅概括文章赋予这类行为的反竞争性质。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>38题结论</h3>\n<blockquote>\n<p><strong>38. D</strong></p>\n</blockquote>\n<ul>\n<li>A：favoring its own service是利用接入地位优待自家服务，at the expense of说明对手受损，不是在说提升服务质量。</li>\n<li>B：关于相关提供商，文中明确说调查已经结束，且没有单独确立AT&amp;T此时正在被查。B的当前调查状态缺少支持。</li>\n<li>C：防范反竞争行为的主语是other agencies，AT&amp;T被举为需要防范的行为例子。C把行为实施者改成防范者。</li>\n<li>D：such as把AT&amp;T优待自家服务、损害对手的做法归入anti-competitive behavior，D保留这个主体与行为性质。</li>\n</ul>\n<h2>39题</h2>\n<blockquote>\n<p>Judge Patricia Millett argues that the appeals court’s decision ______.</p>\n<p>帕特里夏·米利特法官认为，上诉法院的决定怎么样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点题：直接对应法官对现实适合性的评价，分清援引的旧裁定来自哪个法院。</p>\n<p>题干点名Judge Patricia Millett，第四段直接出现她的名字以及argued和said，先把这一段完整读完，分清法院的决定与她对决定的评价。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n</blockquote>\n<h3>A. conveys an ambiguous message</h3>\n<blockquote>\n<p>米利特法官认为上诉法院的决定传达含糊信息。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>法官说结果脱离现代宽带现实，评价的是与现实是否相符；ambiguous message评价表达是否含糊，换了批评角度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>米利特法官认为上诉法院的决定传达含糊信息。</p>\n</blockquote>\n<p><code>conveys an ambiguous message</code>是对决定表达是否清楚的评价，而第四段她直接评价结果时用了<code>unhinged from the realities</code>，回看第二句，看她批评的到底是哪一点。</p>\n<p>原文的<code>unhinged from the realities</code>批评结果脱离现代宽带服务的现实，比较的是决定与现实是否相合。本项的<code>conveys an ambiguous message</code>却说决定传达的信息含糊，比较的是表达是否清楚。法官明确指出的问题是决定没有贴合现代服务状况，本项换成了决定让人读不清其意思，改变了评价所针对的方面。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n<p>周二，上诉法院一致维持2017年放松宽带提供商监管的命令，援引最高法院2005年支持类似放松监管行动的裁定。但Patricia Millett法官在赞同裁决结果的意见中恰当地指出，结果脱离现代宽带服务的现实，并说国会或最高法院可以介入，以免互联网监管被困在过时的技术框架中。</p>\n</blockquote>\n<p>法院援引2005年的类似放松监管裁定后，法官转而指出结果与当代服务不相适应，并建议更高层介入。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The appeals court’s decision conveys an ambiguous message.</p>\n<p>米利特法官认为上诉法院的决定传达含糊信息。</p>\n</blockquote>\n<p>A需要法官说决定含义不明。她的批评本身十分明确，脱离现实也不等于决定让人看不懂。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. is out of touch with reality</h3>\n<blockquote>\n<p>米利特法官认为上诉法院的决定脱离现实。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>unhinged from the realities和out of touch with reality都说决定与现实脱节，保留了法官的直接评价。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>米利特法官认为上诉法院的决定脱离现实。</p>\n</blockquote>\n<p><code>out of touch with reality</code>与第四段的<code>unhinged from the realities</code>都在说与现实脱节，直接回看法官在第二句中对结果的评价。</p>\n<p>原文说法院结果<code>unhinged from the realities of modern broadband service</code>，脱离现代宽带服务的现实。本项说决定<code>out of touch with reality</code>，是对同一评价的简洁改述。它没有换掉被评价的法院决定，也没有改变脱离现实这一判断；现代宽带服务的具体背景由本段提供。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n<p>周二，上诉法院一致维持2017年放松宽带提供商监管的命令，援引最高法院2005年支持类似放松监管行动的裁定。但Patricia Millett法官在赞同裁决结果的意见中恰当地指出，结果脱离现代宽带服务的现实，并说国会或最高法院可以介入，以免互联网监管被困在过时的技术框架中。</p>\n</blockquote>\n<p>现代宽带服务是判断现实适合性的背景，technological anachronism又说明不能将监管困在过时技术框架。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The appeals court’s decision is out of touch with reality.</p>\n<p>米利特法官认为上诉法院的决定脱离现实。</p>\n</blockquote>\n<p>B压缩了具体背景而未更换判断对象；它没有说决定无法理解，也没有把不适应现实改成违反旧判例。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. is at odds with its earlier rulings</h3>\n<blockquote>\n<p>米利特法官认为上诉法院的决定与该法院先前裁决冲突。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>所引旧裁定来自最高法院，且支持类似的放松监管行动。C却说与上诉法院自身旧裁决冲突，法院与关系都变了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句
