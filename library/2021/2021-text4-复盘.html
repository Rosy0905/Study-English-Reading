 service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>米利特法官认为上诉法院的决定关注琐事。</p>\n</blockquote>\n<p>technological anachronism指技术上的时代错位或过时框架，法官担忧监管脱离现代服务，未说法院只关注琐事。</p>\n<p>法官先评价结果与现实不符，再建议国会或最高法院介入，避免监管被旧技术认识束缚。</p>\n<p>D需要决定将注意力放在无关紧要事项上的描述。规则依据过时和议题本身琐碎是两种不同批评，不能互换。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot;</p>\n<p>周二，上诉法院一致维持2017年放松宽带提供商监管的命令，援引最高法院2005年支持类似放松监管行动的裁定。但Patricia Millett法官在赞同裁决结果的意见中恰当地指出，结果脱离现代宽带服务的现实，并说国会或最高法院可以介入，以免互联网监管被困在过时的技术框架中。</p>\n</blockquote>\n<p>法官先评价结果与现实不符，再建议国会或最高法院介入，避免监管被旧技术认识束缚。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The appeals court’s decision focuses on trivialities.</p>\n<p>米利特法官认为上诉法院的决定关注琐事。</p>\n</blockquote>\n<p>D需要决定将注意力放在无关紧要事项上的描述。规则依据过时和议题本身琐碎是两种不同批评，不能互换。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>39题结论</h3>\n<blockquote>\n<p><strong>39. B</strong></p>\n</blockquote>\n<ul>\n<li>A：法官说结果脱离现代宽带现实，评价的是与现实是否相符；ambiguous message评价表达是否含糊，换了批评角度。</li>\n<li>B：unhinged from the realities和out of touch with reality都说决定与现实脱节，保留了法官的直接评价。</li>\n<li>C：所引旧裁定来自最高法院，且支持类似的放松监管行动。C却说与上诉法院自身旧裁决冲突，法院与关系都变了。</li>\n<li>D：technological anachronism指技术上的时代错位或过时框架，法官担忧监管脱离现代服务，未说法院只关注琐事。</li>\n</ul>\n<h2>40题</h2>\n<blockquote>\n<p>What does the author argue in the last paragraph?</p>\n<p>作者在最后一段主张什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落主张题：明确国会、FCC与宽带提供商各自角色，以及授权要保护的目标。</p>\n<p>题干明确指定last paragraph，直接完整阅读第六段，注意作者把行动要求交给谁，以及希望采取什么行动。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n</blockquote>\n<h3>A. Broadband providers’ rights should be protected.</h3>\n<blockquote>\n<p>作者在末段主张，应保护宽带提供商的权利。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文要保护的是网络开放与创新，提供商是其干预行为需被限制的一方。A把保护对象改成提供商权利。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段主张，应保护宽带提供商的权利。</p>\n</blockquote>\n<p><code>providers’ rights should be protected</code>谈保护的对象，第六段第二句既写<code>bar broadband providers</code>，又写<code>protecting openness and innovation online</code>，需要把它们连起来核对谁受到约束、什么得到保护。</p>\n<p>原文要求禁止提供商干预网络流量，并制定规则<code>protecting openness and innovation online</code>，保护的是网络开放与创新。宽带提供商在这里是其行为需要被约束的一方。本项的<code>providers’ rights should be protected</code>却把提供商的权利改成需要保护的对象，改变了作者提出监管的对象和目的。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n<p>无休止的法律争斗和FCC的来回反复迫切要求国会行动。国会需一次性给予委员会明确权限，禁止宽带提供商干预其网络流量，并制定清晰规则，保护网上开放和创新。</p>\n</blockquote>\n<p>末段由法律争斗转向国会授权，让FCC能够禁止流量干预并制定保护开放的规则。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Broadband providers’ rights should be protected.</p>\n<p>作者在末段主张，应保护宽带提供商的权利。</p>\n</blockquote>\n<p>A需要以维护提供商权利为行动目的。实际规则限制它们左右流量的行为，不能把被约束者改作这里被保护的对象。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. The FCC should be put under strict supervision.</h3>\n<blockquote>\n<p>作者在末段主张，应严格监督FCC。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>give the commission explicit authority是授予FCC明确权力，让它监管提供商；B却让FCC成为被严格监督者。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段主张，应严格监督FCC。</p>\n</blockquote>\n<p>give the commission explicit authority是授予FCC明确权力，让它监管提供商；B却让FCC成为被严格监督者。</p>\n<p>国会是授权者，FCC是获授权实施监管者，宽带提供商是被约束者，三者位置清楚。</p>\n<p>B需要对FCC另设监督约束的主张。批评它反复变动可以构成改革背景，却不等于末段要求对它严格监督。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n<p>无休止的法律争斗和FCC的来回反复迫切要求国会行动。国会需一次性给予委员会明确权限，禁止宽带提供商干预其网络流量，并制定清晰规则，保护网上开放和创新。</p>\n</blockquote>\n<p>国会是授权者，FCC是获授权实施监管者，宽带提供商是被约束者，三者位置清楚。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The FCC should be put under strict supervision.</p>\n<p>作者在末段主张，应严格监督FCC。</p>\n</blockquote>\n<p>B需要对FCC另设监督约束的主张。批评它反复变动可以构成改革背景，却不等于末段要求对它严格监督。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Congress needs to take action to ensure net neutrality.</h3>\n<blockquote>\n<p>作者在末段主张，国会需行动以保障网络中立。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>cry out for Congress to act直接提出国会行动；明确授权、禁止流量干预和保护开放创新说明行动要保障网络中立。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段主张，国会需行动以保障网络中立。</p>\n</blockquote>\n<p><code>Congress needs to take action</code>对应第六段第一句的<code>cry out for Congress to act</code>；<code>ensure net neutrality</code>还需要接上第二句禁止干预网络流量、保护开放与创新的目的，因此完整核对末段这两句。</p>\n<p>原文先用<code>cry out for Congress to act</code>明确要求国会行动，再要求国会授权委员会，禁止提供商干预流量，并制定保护开放与创新的规则。本项的<code>Congress needs to take action</code>保留了同一行动者；<code>ensure net neutrality</code>把后面的禁止干预和保护开放概括为保障网络中立。行动要求与目的都能接上。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n<p>无休止的法律争斗和FCC的来回反复迫切要求国会行动。国会需一次性给予委员会明确权限，禁止宽带提供商干预其网络流量，并制定清晰规则，保护网上开放和创新。</p>\n</blockquote>\n<p>反复诉讼与FCC来回改变构成问题，国会给出稳定明确权限和规则是作者提出的应对。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Congress needs to take action to ensure net neutrality.</p>\n<p>作者在末段主张，国会需行动以保障网络中立。</p>\n</blockquote>\n<p>C同时保留行动主体与目的，没有把授权写成国会亲自执行每项调查，能概括末段完整主张。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. Rules need to be set to diversify online services.</h3>\n<blockquote>\n<p>作者在末段主张，需制定规则使网络服务更多样化。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>开放与创新是规则保护的网络条件，diversify services却限定为增加服务种类。相关可能性不等于本文给出的规则目标。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者在末段主张，需制定规则使网络服务更多样化。</p>\n</blockquote>\n<p><code>diversify online services</code>说的是制定规则的目的，第六段末尾的<code>create clear rules protecting openness and innovation online</code>也说明规则要做什么，因此回看第二句的这个目的。</p>\n<p>原文要求制定明确规则，<code>protecting openness and innovation online</code>，即保护网络开放与创新，并把这与禁止提供商干预流量并列。本项的<code>diversify online services</code>则把规则的目的改为让网络服务更加多样，着眼于服务种类的增加。保护开放和创新可以涉及许多发展可能，但原句明确要求的是保护这些条件，并未把规则目标收束为增加服务种类；本项改接了规则与目标之间的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n<p>无休止的法律争斗和FCC的来回反复迫切要求国会行动。国会需一次性给予委员会明确权限，禁止宽带提供商干预其网络流量，并制定清晰规则，保护网上开放和创新。</p>\n</blockquote>\n<p>作者将禁止不当流量干预与保护开放创新并列，为的是稳定网络中立规则，未列发展更多服务品类的计划。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Rules need to be set to diversify online services.</p>\n<p>作者在末段主张，需制定规则使网络服务更多样化。</p>\n</blockquote>\n<p>D需要以服务多样化为明确目标。更开放可能给新服务机会，但这种后续可能不能替代作者直接写出的监管目的。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>40题结论</h3>\n<blockquote>\n<p><strong>40. C</strong></p>\n</blockquote>\n<ul>\n<li>A：原文要保护的是网络开放与创新，提供商是其干预行为需被限制的一方。A把保护对象改成提供商权利。</li>\n<li>B：give the commission explicit authority是授予FCC明确权力，让它监管提供商；B却让FCC成为被严格监督者。</li>\n<li>C：cry out for Congress to act直接提出国会行动；明确授权、禁止流量干预和保护开放创新说明行动要保障网络中立。</li>\n<li>D：开放与创新是规则保护的网络条件，diversify services却限定为增加服务种类。相关可能性不等于本文给出的规则目标。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：网络中立性的核心担忧</strong>（段落1背景介绍） 早期担忧：宽带提供商有权力和动机偏爱关联网站 → 强烈需求：制定规则防止挑选赢家和输家 → 目标：保护互联网的自由和创新</p>\n<p>↓（实施困境）</p>\n<p><strong>逻辑层次2：网络中立性规则的挫败</strong>（段落2政策变化） 需求难以满足：（宽带提供商 + 反监管保守派 + 法院的反对）→ 2017年FCC命令：【取消2015年严格规则 + 拒绝监管权力 + 禁止州和地方政府监管】→ 法院介入但只是延长斗争</p>\n<p>↓（具体问题）</p>\n<p><strong>逻辑层次3：反竞争行为的现实</strong>（段落3实例说明） FCC的矛盾立场：【声称其他机构会防止反竞争行为（如AT&amp;T偏爱自己的服务）// 但终止了对差别化数据上限的调查】</p>\n<p>↓（法律裁决）</p>\n<p><strong>逻辑层次4：法院裁决及其问题</strong>（段落4-5司法判决） 上诉法院裁决：【支持2017年去监管命令（引用2005年先例）// 但米利特法官批评：脱离现代宽带现实】→ 州权问题：（推翻FCC阻止所有州规则 // 但保留优先于个别州法律的权力）→ 结果：更多法律战（如司法部vs加州）</p>\n<p>↓（解决方案）</p>\n<p><strong>逻辑层次5：呼吁国会行动</strong>（段落6作者建议） 现状：无休止的法律战斗和FCC的反复 → 解决方案：国会需要【赋予FCC明确权力：（禁止宽带商干预流量 + 创建保护开放和创新的规则）】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：网络中立性规则的反复和法律斗争表明，只有国会采取决定性行动，明确赋予FCC监管权力，才能真正保护互联网的开放性和创新。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. The demand for rules against preferential treatment</p>\n<p>B. Ending investigations while promising other protection</p>\n<p>C. A legislative answer to recurring regulatory conflict</p>\n<p>D. The FCC’s retreat from neutrality regulation</p>\n<p>E. A court ruling that leaves further battles unresolved</p>\n<p>F. A final settlement accepted by every government</p>\n<p>G. The absence of any commercial incentive to discriminate</p>\n<p><strong>41.</strong></p>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;. That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n<p><strong>42.</strong></p>\n<p>Yet that demand has been almost impossible to fill—— in part because of pushback from broadband providers, anti-regulatory conservatives and the courts. A federal appeals court weighed in again Tuesday, but instead of providing a badly needed resolution, it only prolonged the fight. At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n<p><strong>43.</strong></p>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n<p><strong>44.</strong></p>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot; In the meantime, the court threw out the FCC&#39;s attempt to block all state rules on net neutrality, while preserving the commission&#39;s power to preempt individual state laws that undermine its order. That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC&#39;s abdication.</p>\n<p><strong>45.</strong></p>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act. It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】A. The demand for rules against preferential treatment</p>\n<blockquote>\n<p>要求禁止差别优待的规则</p>\n</blockquote>\n<p>由宽带提供商偏袒关联网站的权力与动机，推出防止挑选赢家输家、保护开放创新的规则需求。</p>\n<blockquote>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#39;.</p>\n</blockquote>\n<p>提供商有能力和动机优待关联网站，形成要求监管的具体风险。</p>\n<blockquote>\n<p>That&#39;s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.</p>\n</blockquote>\n<p>That&#39;s why把风险与强烈规则需求接起，目的在防止挑选赢家输家并保护自由创新。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>商业关联产生偏袒风险 → 需要中立规则 → 保护网上自由与创新</p>\n</blockquote>\n<p>preferential treatment对应favor affiliated websites；demand对应That’s why后的规则要求。</p>\n<p>再看最强干扰项G：The absence of any commercial incentive to discriminate。</p>\n<p>第一段明确写有power and incentive，不能概括成没有动机。</p>\n<p><strong>41题选A。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】D. The FCC’s retreat from neutrality regulation</p>\n<blockquote>\n<p>FCC退出中立监管</p>\n</blockquote>\n<p>第二段先说规则需求难满足，再写2017年命令取消旧规则、否认委员会权限并排除州监管。</p>\n<blockquote>\n<p>Yet that demand has been almost impossible to fill—— in part because of pushback from broadband providers, anti-regulatory conservatives and the courts.</p>\n</blockquote>\n<p>Yet说明首段规则需求一直难满足，阻力来自提供商、反监管者和法院。</p>\n<blockquote>\n<p>At issue before the U. S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission&#39;s authority to require broadband providers to do much of anything.</p>\n</blockquote>\n<p>2017年命令撤销严格规则并否定FCC权限，具体展示反监管回应；不能只保留发文这一形式。</p>\n<blockquote>\n<p>The order also declared that state and local governments couldn&#39;t regulate broadband providers either.</p>\n</blockquote>\n<p>either再把不能监管扩展到州和地方，标题需概括多层监管退出，而非一次单独争议。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>规则需求遭遇阻力 → FCC撤销规则和自身权限 → 同时排除州与地方监管</p>\n</blockquote>\n<p>retreat对应三方面撤回约束，标题概括回应的实质而非只说颁布文件。</p>\n<p>再看最强干扰项F：A final settlement accepted by every government。</p>\n<p>法院只是延长争端，各方并未最终解决。</p>\n<p><strong>42题选D。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】B. Ending investigations while promising other protection</p>\n<blockquote>\n<p>承诺其他保护的同时结束调查</p>\n</blockquote>\n<p>FCC称其他机构可防范反竞争行为，却又结束对宽带提供商的调查。</p>\n<blockquote>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV.</p>\n</blockquote>\n<p>FCC声称其他机构会防范反竞争行为，AT&amp;T式自家服务优待是需要防范的实例。</p>\n<blockquote>\n<p>Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals&#39; streaming services but not their own.</p>\n</blockquote>\n<p>Yet将这一保护承诺与FCC结束调查对照，表明退出行动并未直接实现所承诺的保护。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>声称其他机构可防范反竞争 → 自家优待显示风险 → FCC仍结束调查</p>\n</blockquote>\n<p>while突出承诺保护与停止调查之间的反差；AT&amp;T是被防范行为的例子。</p>\n<p>再看最强干扰项G：The absence of any commercial incentive to discriminate。</p>\n<p>这里的企业偏袒自家服务正说明竞争动机存在。</p>\n<p><strong>43题选B。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】E. A court ruling that leaves further battles unresolved</p>\n<blockquote>\n<p>仍留下后续争议的法院裁决</p>\n</blockquote>\n<p>法院维持放松监管命令但法官批评其脱离现实，同时否定全面排除州规则的企图，预计仍有更多诉讼。</p>\n<blockquote>\n<p>On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move.</p>\n</blockquote>\n<p>法院维持放松监管命令，依据是2005年的类似裁定，先交代决定方向。</p>\n<blockquote>\n<p>But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could intervene to &quot;avoid trapping Internet regulation in technological anachronism.&quot; In the meantime, the court threw out the FCC&#39;s attempt to block all state rules on net neutrality, while preserving the commission&#39;s power to preempt individual state laws that undermine its order.</p>\n</blockquote>\n<p>法官批评现实脱节；同时法院否定全面封堵州法，却留下个别州法可被排除的权限，裁定没有彻底终结冲突。</p>\n<blockquote>\n<p>That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC&#39;s abdication.</p>\n</blockquote>\n<p>That means把上述权限分界推到更多诉讼，加州冲突就是例子，标题须保留争议仍继续的结果。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>维持放松监管命令 → 现实脱节批评与州法权限分界 → 后续争议仍将持续</p>\n</blockquote>\n<p>leaves battles unresolved贯通现实脱节与州法争端，不能把部分维持写成完全结束。</p>\n<p>再看最强干扰项F：A final settlement accepted by every government。</p>\n<p>原文明说more battles，结尾也要求国会另行解决。</p>\n<p><strong>44题选E。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】C. A legislative answer to recurring regulatory conflict</p>\n<blockquote>\n<p>以立法回应反复的监管冲突</p>\n</blockquote>\n<p>末段由无尽诉讼和FCC反复变化转向国会行动，要求明确授权并建立保护开放创新的规则。</p>\n<blockquote>\n<p>The endless legal battles and back-and-forth at the FCC cry out for Congress to act.</p>\n</blockquote>\n<p>无尽诉讼和FCC反复变化提供国会必须行动的理由，不是在泛泛要求任何机构行动。</p>\n<blockquote>\n<p>It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n</blockquote>\n<p>give...explicit authority把方案落实到国会明确授权FCC，之后两项动作说明禁止流量干预、保护开放创新。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>反复监管冲突 → 国会明确授权 → 建立保护开放创新的稳定规则</p>\n</blockquote>\n<p>legislative answer对应Congress，recurring conflict对应endless battles和back-and-forth。</p>\n<p>再看最强干扰项D：The FCC’s retreat from neutrality regulation。</p>\n<p>末段不是继续报告FCC退让，而是提出解决途径。</p>\n<p><strong>45题选C。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Broadband providers can have both the ability and the incentive to favour websites connected to their own businesses. This possibility has long worried consumers and online companies. Rules on net neutrality are demanded because access providers should not be able to decide which competitors succeed on the internet.</p>\n<p><strong>B.</strong></p>\n<p>At the same time, the panel refused to let the FCC block every state neutrality rule automatically. The commission retained power to challenge particular laws that undermined its order. This distinction preserved room for further disputes rather than supplying one clear rule applicable everywhere.</p>\n<p><strong>C.</strong></p>\n<p>The commission defended this retreat by saying that other agencies could address anti-competitive behaviour. A provider favouring its own streaming service over rivals illustrates the concern. Yet the FCC also ended investigations into practices that placed limits on competitors’ services while sparing a provider’s own.</p>\n<p><strong>D.</strong></p>\n<p>Ending this uncertainty requires more than another reversal inside the FCC. Congress can give the commission explicit authority to prevent providers from interfering with network traffic. A clear legislative basis would address the recurring argument over whether the regulator has the power to act at all.</p>\n<p><strong>E.</strong></p>\n<p>The courts did not resolve the underlying conflict when an appeals panel upheld the deregulatory order. The decision relied on an earlier Supreme Court ruling. A concurring judge nevertheless warned that its result was detached from the realities of modern broadband and might require intervention at a higher level.</p>\n<p><strong>F.</strong></p>\n<p>Those further disputes were already visible in the conflict involving California’s tougher neutrality law. The state had acted after the FCC withdrew from regulation, and federal authorities challenged its approach. The case illustrated how uncertainty at one level encouraged legal battles at another.</p>\n<p><strong>G.</strong></p>\n<p>Meeting that demand has proved difficult because providers, opponents of regulation and courts have resisted different proposals. A major FCC order in 2017 removed earlier neutrality rules and rejected broad regulatory authority. It also attempted to prevent state and local governments from imposing their own requirements.</p>\n<p><strong>H.</strong></p>\n<p>That authority should support rules protecting openness and innovation online. The purpose is to constrain discriminatory control by access providers, not to protect their freedom to favour affiliates. Durable protection depends on a stable framework rather than an endless sequence of orders and lawsuits.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从商业偏袒风险引出中立规则需求</td>\n</tr>\n<tr>\n<td>B</td>\n<td>解释全面排除州法被否决及后续争议空间</td>\n</tr>\n<tr>\n<td>C</td>\n<td>对照替代监管承诺与结束调查</td>\n</tr>\n<tr>\n<td>D</td>\n<td>提出国会明确授权以解决权限争论</td>\n</tr>\n<tr>\n<td>E</td>\n<td>说明法院维持命令但存在现实脱节批评</td>\n</tr>\n<tr>\n<td>F</td>\n<td>以加州冲突具体说明监管反复的代价</td>\n</tr>\n<tr>\n<td>G</td>\n<td>介绍需求难满足及FCC放松监管</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结授权服务于开放创新及稳定规则</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从商业偏袒风险引出中立规则需求 → 介绍需求难满足及FCC放松监管 → 对照替代监管承诺与结束调查 → 说明法院维持命令但存在现实脱节批评 → 解释全面排除州法被否决及后续争议空间 → 以加州冲突具体说明监管反复的代价 → 提出国会明确授权以解决权限争论 → 总结授权服务于开放创新及稳定规则</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → G → C → E → B → F → D → H</strong></p>\n<p>41—45：G、C、B、F、D。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → G → C。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Rules on net neutrality are demanded because access providers should not be able to decide which competitors succeed on the internet.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Meeting that demand has proved difficult because providers, opponents of regulation and courts have resisted different proposals.</p>\n</blockquote>\n<p>前段已提出net neutrality规则需求，Meeting that demand以that准确承接，转入为何难以满足。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A major FCC order in 2017 removed earlier neutrality rules and rejected broad regulatory authority. It also attempted to prevent state and local governments from imposing their own requirements.</p>\n</blockquote>\n<p>先列阻力，再列2017年撤销规则、否定权限及排除州监管的行动，说明需求受阻的实际表现。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>The commission defended this retreat by saying that other agencies could address anti-competitive behaviour.</p>\n</blockquote>\n<p>this retreat回指当前的监管退出，下一段才说明FCC怎样为退出作辩护。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从商业偏袒风险引出中立规则需求 → 介绍需求难满足及FCC放松监管 → 对照替代监管承诺与结束调查</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>At the same time, the panel refused to let the FCC block every state neutrality rule automatically.</p>\n</blockquote>\n<p>法院拒绝全面排除州法是后面的裁定内容；此处尚须介绍FCC退出，否则this retreat缺少先行内容。</p>\n<p><strong>41题选G。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为G → C → E。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>It also attempted to prevent state and local governments from imposing their own requirements.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>The commission defended this retreat by saying that other agencies could address anti-competitive behaviour.</p>\n</blockquote>\n<p>前段结束于阻止州及地方监管，The commission defended this retreat接住联邦与地方监管退出。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A provider favouring its own streaming service over rivals illustrates the concern. Yet the FCC also ended investigations into practices that placed limits on competitors’ services while sparing a provider’s own.</p>\n</blockquote>\n<p>先以其他机构可防范反竞争作解释，再举自家优待例子，Yet转到FCC结束差别流量限制调查，形成承诺与行动的张力。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The courts did not resolve the underlying conflict when an appeals panel upheld the deregulatory order.</p>\n</blockquote>\n<p>The courts转向司法处理，underlying conflict概括前面的监管需求与退出行动之间的冲突。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>介绍需求难满足及FCC放松监管 → 对照替代监管承诺与结束调查 → 说明法院维持命令但存在现实脱节批评</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>At the same time, the panel refused to let the FCC block every state neutrality rule automatically.</p>\n</blockquote>\n<p>At the same time, the panel必须接在已介绍上诉法庭决定之后；这里还在交代FCC行动，不能提前使用未建立的panel。</p>\n<p><strong>42题选C。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → B → F。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>A concurring judge nevertheless warned that its result was detached from the realities of modern broadband and might require intervention at a higher level.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>At the same time, the panel refused to let the FCC block every state neutrality rule automatically.</p>\n</blockquote>\n<p>前段已介绍法院决定及法官批评，At the same time和the panel接同一法庭，补充州法部分的处理。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The commission retained power to challenge particular laws that undermined its order. This distinction preserved room for further disputes rather than supplying one clear rule applicable everywhere.</p>\n</blockquote>\n<p>拒绝自动封堵全部州法，同时保留挑战个别冲突州法的权限，This distinction总结两种处理的边界。</p>\n<p>后段F开头是：</p>\n<blockquote>\n<p>Those further disputes were already visible in the conflict involving California’s tougher neutrality law.</p>\n</blockquote>\n<p>Those further disputes直接回指本段further disputes，后面用California将争议具体化。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明法院维持命令但存在现实脱节批评 → 解释全面排除州法被否决及后续争议空间 → 以加州冲突具体说明监管反复的代价</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>Ending this uncertainty requires more than another reversal inside the FCC.</p>\n</blockquote>\n<p>Ending this uncertainty属于提出解决方案，此处应先交代为何还有州法争议，才能让后面的加州冲突有明确来源。</p>\n<p><strong>43题选B。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为B → F → D。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>This distinction preserved room for further disputes rather than supplying one clear rule applicable everywhere.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Those further disputes were already visible in the conflict involving California’s tougher neutrality law.</p>\n</blockquote>\n<p>前段留下further disputes的空间，Those further disputes准确承接，并引入加州更严格的中立法。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The state had acted after the FCC withdrew from regulation, and federal authorities challenged its approach. The case illustrated how uncertainty at one level encouraged legal battles at another.</p>\n</blockquote>\n
