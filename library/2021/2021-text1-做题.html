<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 21题题干\n\n**The author holds that this year’s increase in rail passenger fares ______.**\n\n> 作者认为，今年铁路乘客票价上涨怎么样？\n\n题型：**作者对具体事件的态度题**。\n\n---","html":"<h2>21题题干</h2>\n<p><strong>The author holds that this year’s increase in rail passenger fares ______.</strong></p>\n<blockquote>\n<p>作者认为，今年铁路乘客票价上涨怎么样？</p>\n</blockquote>\n<p>题型：<strong>作者对具体事件的态度题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,215,1206,37]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"21"}},{"section":"先读题干","raw":"## 22题题干\n\n**The stockbroker in Paragraph 2 is used to stand for ______.**\n\n> 第2段中的股票经纪人被用来代表哪一类人？\n\n题型：**例子身份作用题**。\n\n---","html":"<h2>22题题干</h2>\n<p><strong>The stockbroker in Paragraph 2 is used to stand for ______.</strong></p>\n<blockquote>\n<p>第2段中的股票经纪人被用来代表哪一类人？</p>\n</blockquote>\n<p>题型：<strong>例子身份作用题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,638,1007,36]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"22"}},{"section":"先读题干","raw":"## 23题题干\n\n**It is indicated in Paragraph 3 that train operators ______.**\n\n> 第3段表明，火车运营商怎么样？\n\n题型：**段落推断题**。\n\n---","html":"<h2>23题题干</h2>\n<p><strong>It is indicated in Paragraph 3 that train operators ______.</strong></p>\n<blockquote>\n<p>第3段表明，火车运营商怎么样？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,1060,962,37]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"23"}},{"section":"先读题干","raw":"## 24题题干\n\n**If unable to calm down passengers, the railways may have to face ______.**\n\n> 如果不能平息乘客的不满，铁路方面可能不得不面对什么？\n\n题型：**条件结果推断题**。\n\n---","html":"<h2>24题题干</h2>\n<p><strong>If unable to calm down passengers, the railways may have to face ______.</strong></p>\n<blockquote>\n<p>如果不能平息乘客的不满，铁路方面可能不得不面对什么？</p>\n</blockquote>\n<p>题型：<strong>条件结果推断题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,1483,1252,37]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"24"}},{"section":"先读题干","raw":"## 25题题干\n\n**Which of the following would be the best title for the text?**\n\n> 下列哪一项最适合做这篇文章的标题？\n\n题型：**最佳标题题**。\n\n---","html":"<h2>25题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下列哪一项最适合做这篇文章的标题？</p>\n</blockquote>\n<p>题型：<strong>最佳标题题</strong>。</p>\n<hr>\n","articleRects":[],"questionRects":[[254,1906,1008,35]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"25"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but、rather than、However、if |\n| 态度词 / 评价词 | 先抓个大概好坏 | worst、unreliable、justified |\n| 动作词 | 先看谁做了什么 | rises、paying、operate |\n| 结果词 | 看最后出了什么事 | burden、strikes、compensation |\n| 重复主题词 | 大概知道老在说什么 | passengers、train、service、fares |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>but、rather than、However、if</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>worst、unreliable、justified</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>rises、paying、operate</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>burden、strikes、compensation</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>passengers、train、service、fares</td>\n</tr>\n</tbody></table>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"How can Britain’s train operators possibly justify yet another increase to rail passenger fares? It has become a **[xxx]** reliable annual **[xxx]**: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise. This year’s rise, an average of 2.7 per cent, may be a **[xxx]** lower than last year’s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>How can Britain’s train operators possibly justify yet another increase to rail passenger fares? It has become a <strong>[xxx]</strong> reliable annual <strong>[xxx]</strong>: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise. This year’s rise, an average of 2.7 per cent, may be a <strong>[xxx]</strong> lower than last year’s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.</p>\n</div></div>","articleRects":[[307,356,1241,36],[227,415,1321,44],[228,483,1320,35],[228,546,1320,35],[227,605,1321,43],[229,671,1251,35]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true},"contextRaw":""},{"section":"读文章","raw":"How can Britain’s train operators / possibly justify / yet another increase to rail passenger fares? / It has become a **[xxx]** reliable annual **[xxx]**: / every January the cost of travelling by train rises, / imposing a significant extra burden / on those who have no option / but
