骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>21题题干</h2>\n<p><strong>The author holds that this year’s increase in rail passenger fares ______.</strong></p>\n<blockquote>\n<p>作者认为，今年铁路乘客票价上涨怎么样？</p>\n</blockquote>\n<p>题型：<strong>作者对具体事件的态度题</strong>。</p>\n<hr>\n<h2>22题题干</h2>\n<p><strong>The stockbroker in Paragraph 2 is used to stand for ______.</strong></p>\n<blockquote>\n<p>第2段中的股票经纪人被用来代表哪一类人？</p>\n</blockquote>\n<p>题型：<strong>例子身份作用题</strong>。</p>\n<hr>\n<h2>23题题干</h2>\n<p><strong>It is indicated in Paragraph 3 that train operators ______.</strong></p>\n<blockquote>\n<p>第3段表明，火车运营商怎么样？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n<hr>\n<h2>24题题干</h2>\n<p><strong>If unable to calm down passengers, the railways may have to face ______.</strong></p>\n<blockquote>\n<p>如果不能平息乘客的不满，铁路方面可能不得不面对什么？</p>\n</blockquote>\n<p>题型：<strong>条件结果推断题</strong>。</p>\n<hr>\n<h2>25题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下列哪一项最适合做这篇文章的标题？</p>\n</blockquote>\n<p>题型：<strong>最佳标题题</strong>。</p>\n<hr>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>but、rather than、However、if</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>worst、unreliable、justified</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>rises、paying、operate</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>burden、strikes、compensation</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>passengers、train、service、fares</td>\n</tr>\n</tbody></table>\n<h3>第1段</h3>\n<p><strong>原文参考：</strong></p>\n<p>How can Britain’s train operators possibly justify yet another increase to rail passenger fares? It has become a <strong>[xxx]</strong> reliable annual <strong>[xxx]</strong>: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise. This year’s rise, an average of 2.7 per cent, may be a <strong>[xxx]</strong> lower than last year’s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.</p>\n<p><strong>开始粗读：</strong></p>\n<p>How can Britain’s train operators / possibly justify / yet another increase to rail passenger fares? / It has become a <strong>[xxx]</strong> reliable annual <strong>[xxx]</strong>: / every January the cost of travelling by train rises, / imposing a significant extra burden / on those who have no option / but to use the rail network / to get to work or otherwise. / This year’s rise, an average of 2.7 per cent, / may be a <strong>[xxx]</strong> lower than last year’s, / but it is still well above / the official Consumer Price Index (CPI) measure of inflation.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>How can 英国的火车运营商 / possibly justify / 又一次提高 to 铁路乘客票价? / It has become a <strong>[xxx]</strong> reliable annual <strong>[xxx]</strong>: / 每年一月 乘火车旅行的费用 rises, / imposing 显著的额外负担 / on those who have no option / but to use the rail network / 去上班 or otherwise. / 今年的上涨, 平均 2.7 per cent, / may be a <strong>[xxx]</strong> lower than last year’s, / but it is still 大大超过 / the official Consumer Price Index (CPI) measure of 通货膨胀.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>1、英国的火车运营商、又一次提高、铁路乘客票价、每年一月、乘火车旅行的费用、显著的额外负担、去上班、今年的上涨、平均、2.7、大大超过、通货膨胀。</p>\n<h3>第2段</h3>\n<p><strong>原文参考：</strong></p>\n<p>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer. Why, the argument goes, should a car-driving pensioner from Lincolnshire have to <strong>[xxx]</strong> the daily commute of a stockbroker from Surrey? Equally, there is a sense that the <strong>[xxx]</strong> of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor <strong>[xxx]</strong> of the Midlands and the North.</p>\n<p><strong>开始粗读：</strong></p>\n<p>Successive governments / have permitted such increases / on the grounds / that the cost of investing in and running the rail network / should be borne by those who use it, / rather than the general taxpayer. / Why, the argument goes, / should a car-driving pensioner from Lincolnshire / have to <strong>[xxx]</strong> / the daily commute of a stockbroker from Surrey? / Equally, there is a sense / that the <strong>[xxx]</strong> of commuters in the South East, / many of whom will face among the biggest rises, / have received too much attention / compared to those who must endure / the relatively poor <strong>[xxx]</strong> of the Midlands and the North.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>历届政府 / have permitted 这样的上涨 / on the grounds / that the cost of investing in and running the rail network / should be borne by those who use it, / rather than 普通纳税人. / Why, the argument goes, / should 一位开车的退休者 from Lincolnshire / have to <strong>[xxx]</strong> / 每日通勤 of a stockbroker from Surrey? / Equally, there is a sense / that the <strong>[xxx]</strong> of commuters in the South East, / many of whom will face among the biggest rises, / have received 太多关注 / compared to those who must endure / the relatively poor <strong>[xxx]</strong> of 中部和北部.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>2、历届政府、这样的上涨、普通纳税人、一位开车的退休者、每日通勤、太多关注、中部和北部。</p>\n<h3>第3段</h3>\n<p><strong>原文参考：</strong></p>\n<p>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years. It is all very well train operators <strong>[xxx]</strong> the improvements they are making to the network, but passengers should be able to expect a basic level of service for the <strong>[xxx]</strong> sums they are now paying to travel. The responsibility for the latest wave of strikes rests on the unions. However, there is a strong case that those who have been worst affected by <strong>[xxx]</strong> action should receive compensation for the <strong>[xxx]</strong> they have suffered.</p>\n<p><strong>开始粗读：</strong></p>\n<p>However, / over the past 12 months, / those commuters have also experienced / some of the worst rail strikes in years. / It is all very well train operators <strong>[xxx]</strong> / the improvements they are making to the network, / but passengers should be able to expect / a basic level of service / for the <strong>[xxx]</strong> sums / they are now paying to travel. / The responsibility for the latest wave of strikes / rests on the unions. / However, there is a strong case / that those who have been worst affected / by <strong>[xxx]</strong> action / should receive compensation / for the <strong>[xxx]</strong> they have suffered.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>However, / 在过去12个月里, / 那些通勤者 have also experienced / some of the worst 铁路罢工 in years. / It is all very well train operators <strong>[xxx]</strong> / the improvements they are making to the network, / but passengers should be able to expect / 一个基本的服务水平 / for the <strong>[xxx]</strong> sums / they are now paying to travel. / 责任 for the latest wave of strikes / rests on the unions. / However, there is a strong case / that those who have been worst affected / by <strong>[xxx]</strong> action / 应当收到补偿 / for the <strong>[xxx]</strong> they have suffered.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>3、在过去12个月里、那些通勤者、铁路罢工、一个基本的服务水平、责任、应当收到补偿。</p>\n<h3>第4段</h3>\n<p><strong>原文参考：</strong></p>\n<p>The Government has <strong>[xxx]</strong> to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate. This should form part of a wider package of measures to address the long-running problems on Britain’s railways. Yes, more investment is needed, but passengers will not be willing to pay more <strong>[xxx]</strong> if they must also endure <strong>[xxx]</strong>, unreliable services, interrupted by regular <strong>[xxx]</strong> when timetables are changed, or planned maintenance is managed <strong>[xxx]</strong>. The threat of nationalisation may have been seen off for now, but it will return with a <strong>[xxx]</strong> if the justified anger of passengers is not addressed in short order.</p>\n<p><strong>开始粗读：</strong></p>\n<p>The Government has <strong>[xxx]</strong> / to change the law / to introduce a minimum service requirement / so that, even when strikes occur, / services can continue to operate. / This should form part of a wider package of measures / to address the long-running problems on Britain’s railways. / Yes, more investment is needed, / but passengers will not be willing / to pay more <strong>[xxx]</strong> / if they must also endure <strong>[xxx]</strong>, unreliable services, / interrupted by regular <strong>[xxx]</strong> / when timetables are changed, / or planned maintenance is managed <strong>[xxx]</strong>. / The threat of nationalisation / may have been seen off for now, / but it will return with a <strong>[xxx]</strong> / if the justified anger of passengers / is not addressed in short order.</p>\n<p><strong>顺着英文顺序读：</strong></p>\n<p>The Government has <strong>[xxx]</strong> / to 改变法律 / to introduce 一个最低服务要求 / so that, 即使罢工发生时, / 服务能继续运行. / This should form part of a wider package of measures / to address 长期存在的问题 on Britain’s railways. / Yes, 需要更多投资, / but 乘客不会愿意 / to pay more <strong>[xxx]</strong> / if they must also endure <strong>[xxx]</strong>, 不可靠的服务, / interrupted by regular <strong>[xxx]</strong> / when timetables are changed, / or planned maintenance is managed <strong>[xxx]</strong>. / 国有化的威胁 / may have been seen off for now, / but it will return with a <strong>[xxx]</strong> / if 乘客合理的愤怒 / is not addressed in short order.</p>\n<p><strong>这一段留下的碎片：</strong></p>\n<p>4、改变法律、一个最低服务要求、即使罢工发生时、服务能继续运行、长期存在的问题、需要更多投资、乘客不会愿意、不可靠的服务、国有化的威胁、乘客合理的愤怒。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：文章大概和英国火车票价及乘客有关；开头有每年一月、票价、额外负担和2.7，中间有普通纳税人、开车的退休者、每日通勤、铁路罢工和补偿，最后有最低服务要求、更多投资、不可靠的服务、国有化的威胁和乘客的愤怒。</p>\n<p>到这里还不能自然地说清楚：退休者和通勤者为什么会放在一起，罢工和票价是什么关系，为什么后面谈补偿，国有化的威胁又为什么与乘客愤怒连在一起。粗读时只要能判断“这篇文章大概与英国火车票价、乘客和铁路服务有关”，并知道这些信息大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住每年一月、票价、额外负担、通勤、铁路罢工、补偿、最低服务要求和乘客愤怒；这些信息之间到底是什么关系，等题目问到再精读。</p>\n<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr>\n<h2>21题</h2>\n<blockquote>\n<p>The author holds that this year’s increase in rail passenger fares ______.<br>作者认为，今年铁路乘客票价上涨怎么样？</p>\n</blockquote>\n<p>题干问 this year 的票价上涨，第1段直接出现 This year’s rise。先读完整开头，看看作者怎样提出涨价，以及今年的涨幅与通胀怎样比较。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>How can Britain’s train operators possibly justify yet another increase to rail passenger fares? It has become a <strong>[xxx]</strong> reliable annual <strong>[xxx]</strong>: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise. This year’s rise, an average of 2.7 per cent, may be a <strong>[xxx]</strong> lower than last year’s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.</p>\n<p>开始精读：</p>\n<p>How can Britain’s train operators / possibly justify / yet another increase to rail passenger fares? / It has become a <strong>[xxx]</strong> reliable annual <strong>[xxx]</strong>: / every January the cost of travelling by train rises, / imposing a significant extra burden / on those who have no option / but to use the rail network / to get to work or otherwise. / This year’s rise, an average of 2.7 per cent, / may be a <strong>[xxx]</strong> lower than last year’s, / but it is still well above / the official Consumer Price Index (CPI) measure of inflation.</p>\n<p>英国的火车运营商怎么能 / 可能证明合理 / 又一次提高铁路乘客票价？/ 它已成为一个 <strong>[xxx]</strong> 可靠的年度 <strong>[xxx]</strong>：/ 每年一月乘火车旅行的费用上涨，/ 加上显著的额外负担 / 给那些别无选择的人 / 除了使用铁路网络 / 去上班或作其他用途。/ 今年的上涨，平均2.7%，/ 可能是一个 <strong>[xxx]</strong> 更低的比去年，/ 但它仍大大超过 / 官方消费者价格指数（CPI）所衡量的通货膨胀。</p>\n</blockquote>\n<p>开头用How can...justify质问运营商怎样证明再次涨价合理，中间说乘客增加额外负担，末尾则比较今年涨幅和官方通胀。空格要补作者对今年涨价的判断，不能只取2.7这个数字。</p>\n<h3>A. will ease train operators’ burden</h3>\n<blockquote>\n<p>将减轻火车运营商的负担</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为，今年票价上涨会减轻火车运营商的负担。</p>\n<p>A的 train operators’ burden 与第1段 extra burden 都谈负担，所以回看 imposing a significant extra burden 后面的on those，确认负担落在运营商还是只能乘火车的人身上。</p>\n<blockquote>\n<p>every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.</p>\n</blockquote>\n<p>原文 extra burden 后面接的是别无选择、必须坐火车通勤的人，涨价让这些乘客多付钱。A的 train operators’ burden 则把负担的承受者换成运营商，并把增加改成ease所说的减轻。题干要作者对今年涨价的判断，原文写乘客因涨价更沉重，A却写企业从涨价中得到缓解，人物和动作方向都变了。</p>\n<p><strong>给乘客增加负担，可以换成作者认为运营商的负担得到减轻吗？</strong></p>\n<p>不能。原文评价的对象是乘客多付的钱，A换成运营商并反转了负担变化，不能作为这处作者判断。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. has kept pace with inflation</h3>\n<blockquote>\n<p>已经与通货膨胀保持同步</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为，今年票价涨幅和通货膨胀保持同步。</p>\n<p>B的 kept pace with inflation 要与通胀比较，而第1段明确写 well above，因此回看 This year’s rise 后面比较今年、去年与官方CPI的那一句。</p>\n<blockquote>\n<p>This year’s rise, an average of 2.7 per cent, may be a <strong>[xxx]</strong> lower than last year’s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.</p>\n</blockquote>\n<p>原文先说今年平均上涨2.7%，与去年比较时中间还有一个 <strong>[xxx]</strong>，但转折后明确说 well above 官方CPI衡量的通胀。B的 kept pace with inflation 是大致同步，而well above是明显高于。即使今年低于去年，也只是今年与去年之间的比较，不能因此把今年相对于通胀的“明显超过”改成“同步”。</p>\n<p><strong>低于去年的涨幅，是否就等于今年与通胀同步？</strong></p>\n<p>不能。两个比较基准不同；原文对通胀用的是well above，已经与B所说的同步拉开差别。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. is a big surprise to commuters</h3>\n<blockquote>\n<p>让通勤者大吃一惊</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为，今年的票价上涨令通勤者非常意外。</p>\n<p>C的 a big surprise 要找意外感，第1段却写 every January，二者都涉及人们是否能预料涨价，所以回看年度涨价和乘客负担相连的那一句。</p>\n<blockquote>\n<p>It has become a <strong>[xxx]</strong> reliable annual <strong>[xxx]</strong>: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.</p>\n</blockquote>\n<p>原文 every January 明确说每年一月都会涨价，前面还用reliable annual描述这种年年出现的情况。C的 a big surprise 却把今年涨价说成难以预料的意外。作者提出质问，是在问反复涨价是否有道理，不是在说乘客从来没见过涨价；不满意一种反复发生的事，也不等于这件事突然出现令人惊讶。</p>\n<p><strong>对年年一月出现的涨价不满，就等于今年涨价出乎意料吗？</strong></p>\n<p>不等于。原文强调反复出现和额外负担，C强调意外，两种反应不能互换。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. remains an <strong>[xxx]</strong> measure</h3>\n<blockquote>\n<p>仍然是一项 <strong>[xxx]</strong> 的措施</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为，今年票价上涨仍是一项带有 <strong>[xxx]</strong> 评价的措施。</p>\n<p>D的 remains 保留“即使有变化也仍如此”的意思，第1段but it is still也有这个转折，所以回看今年涨幅和CPI的比较，并接上开头justify提出的质问。</p>\n<blockquote>\n<p>How can Britain’s train operators possibly justify yet another increase to rail passenger fares?</p>\n</blockquote>\n<blockquote>\n<p>This year’s rise, an average of 2.7 per cent, may be a <strong>[xxx]</strong> lower than last year’s, but it is still well above the official Consumer Price Index (CPI) measure of inflation.</p>\n</blockquote>\n<p>原文开头问运营商怎么能justify再次涨价，末尾又用but it is still说今年涨幅仍明显超过通胀。D的 remains 与这个“仍然”接得上：今年与去年相比有变化，作者的疑问却没有消失。D真正给措施的评价词是 <strong>[xxx]</strong>，目前不能直接翻出来；但它是在评价同一项涨价措施，没有把对象换成企业减负、通胀同步或乘客惊讶。</p>\n<p><strong>D的“仍然”能承接今年涨幅变化以后，作者依旧保留的质问吗？</strong></p>\n<p>能。but it is still维持了前面的质疑方向；评价词还未读懂，但其余三项已经各自与原文比较或对象发生冲突，D应当留下。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>21题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>A把乘客增加的负担换成企业减负，B把高于通胀改成同步，C把年年出现的涨价改成意外。D仍评价同一项措施，留下D。</p>\n<blockquote>\n<p><strong>21题选D。</strong></p>\n</blockquote>\n<h2>22题</h2>\n<blockquote>\n<p>The stockbroker in Paragraph 2 is used to stand for ______.<br>第2段中的股票经纪人被用来代表哪一类人？</p>\n</blockquote>\n<p>题干直接给出 Paragraph 2 和 stockbroker。回到第2段，先看政府用什么理由允许涨价，再看开车的退休者与股票经纪人被怎样放在两边。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer. Why, the argument goes, should a car-driving pensioner from Lincolnshire have to <strong>[xxx]</strong> the daily commute of a stockbroker from Surrey? Equally, there is a sense that the <strong>[xxx]</strong> of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor <strong>[xxx]</strong> of the Midlands and the North.</p>\n<p>开始精读：</p>\n<p>Successive governments / have permitted such increases / on the grounds / that the cost of investing in and running the rail network / should be borne by those who use it, / rather than the general taxpayer. / Why, the argument goes, / should a car-driving pensioner from Lincolnshire / have to <strong>[xxx]</strong> / the daily commute of a stockbroker from Surrey? / Equally, there is a sense / that the <strong>[xxx]</strong> of commuters in the South East, / many of whom will face among the biggest rises, / have received too much attention / compared to those who must endure / the relatively poor <strong>[xxx]</strong> of the Midlands and the North.</p>\n<p>历届政府 / 已允许这样的上涨 / 依据这个理由 / 投资和运营铁路网络的成本 / 应由使用它的人承担，/ 而不是普通纳税人。/ 为什么，这个说法是，/ 一位开车的退休者来自林肯郡 / 必须去 <strong>[xxx]</strong> / 一位股票经纪人来自萨里郡的每日通勤？/ 同样，有一种感觉 / 东南部通勤者的 <strong>[xxx]</strong>，/ 其中很多人将面对最大的涨幅之一，/ 已受到太多关注 / 与那些必须忍受的人相比 / 中部和北部相对差的 <strong>[xxx]</strong>。</p>\n</blockquote>\n<p>前一句把费用承担者分成使用铁路的人与一般纳税人，后一句用退休者和股票经纪人把这两边写具体。题干问股票经纪人代表谁，职业名称不是要比较的重点。</p>\n<h3>A. car drivers</h3>\n<blockquote>\n<p>汽车驾驶者</p>\n</blockquote>\n<p>把A接回题干，它说的是：第2段中的股票经纪人代表开车的人。</p>\n<p>A的 car drivers 对应第2段 car-driving pensioner里的开车动作，所以回看Why开头的反问，确认开车的修饰语跟退休者还是股票经纪人相连。</p>\n<blockquote>\n<p>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to <strong>[xxx]</strong> the daily commute of a stockbroker from Surrey?</p>\n</blockquote>\n<p>原文 car-driving pensioner 把开车明确放在来自林肯郡的退休者身上，另一边才是来自萨里郡的股票经纪人及其daily commute。A的 car drivers 把退休者的交通方式搬给了题干所问的股票经纪人。两个人在一个句子里出现，但分别承担前一句中的两类角色，不能把修饰其中一人的词贴给另一个人。</p>\n<p><strong>句中的car-driving修饰退休者，还是股票经纪人？</strong></p>\n<p>前者。A取的是反问另一边那个人的交通方式，不能代表题干所问的股票经纪人。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. rail travellers</h3>\n<blockquote>\n<p>铁路乘客</p>\n</blockquote>\n<p>把B接回题干，它说的是：第2段中的股票经纪人代表乘铁路出行的人。</p>\n<p>B的 rail travellers 与第2段 those who use it指向同一类铁路使用者，所以把费用由谁承担的句子和stockbroker每日通勤的反问连着回看，确定这个例子接在哪一边。</p>\n<blockquote>\n<p>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer.</p>\n</blockquote>\n<blockquote>\n<p>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to <strong>[xxx]</strong> the daily commute of a stockbroker from Surrey?</p>\n</blockquote>\n<p>原文先说铁路投资和运营成本应由those who use it承担，再把这些人同一般纳税人区别开；随后问开车退休者为什么要对股票经纪人的每日通勤做 <strong>[xxx]</strong>。B的 rail travellers 接上的是使用铁路的一边，股票经纪人的daily commute正是例子中要支出铁路出行费用的事。这里不是靠“股票经纪人必然坐火车”的生活猜测，而是顺着前一句使用者与非使用者的对照，把例中通勤者接回去。</p>\n<p><strong>B是在根据职业猜交通工具，还是把例子接回前句的铁路使用者？</strong></p>\n<p>后者。前句已经说明费用承担的两类人，后句让开车者与通勤者相对，股票经纪人是在代表铁路使用者。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. local <strong>[xxx]</strong></h3>\n<blockquote>\n<p>当地的 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把C接回题干，它说的是：第2段中的股票经纪人代表当地某类 <strong>[xxx]</strong>。</p>\n<p>C的 local 说所在地，第2段的 from Surrey 也提供人物来自哪里，所以回看stockbroker所在反问，分清地点与这个例子代表的身份。</p>\n<blockquote>\n<p>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to <strong>[xxx]</strong> the daily commute of a stockbroker from Surrey?</p>\n</blockquote>\n<p>原文 from Surrey 给股票经纪人一个地点，C的 local 也与地方有关，但local后面的 <strong>[xxx]</strong> 才决定是哪类人。仅有地点不能说明例子在代表什么；不过这个身份名词未读懂，也不能判断它是否与铁路使用者重合。原文已有每日通勤和地点，C没有出现一个明确相反的动作，目前不能只因为地方信息不是讨论重点就把未知身份直接排除。</p>\n<p><strong>知道股票经纪人来自萨里郡，就已经读懂C让他代表哪一类人了吗？</strong></p>\n<p>不能。local只说明地方属性，真正的身份仍在后面的名词里；这项暂时留下，但地点本身还不能回答题干的“代表谁”。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. ordinary taxpayers</h3>\n<blockquote>\n<p>普通纳税人</p>\n</blockquote>\n<p>把D接回题干，它说的是：第2段的股票经纪人用来代表普通纳税人。</p>\n<p>D的 ordinary taxpayers 与第2段 the general taxpayer意思相近，所以回看rather than前后，再看股票经纪人和开车退休者分别接到哪一边。</p>\n<blockquote>\n<p>Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer.</p>\n</blockquote>\n<blockquote>\n<p>Why, the argument goes, should a car-driving pensioner from Lincolnshire have to <strong>[xxx]</strong> the daily commute of a stockbroker from Surrey?</p>\n</blockquote>\n<p>原文用rather than the general taxpayer把一般纳税人与铁路使用者区别开，接着用不坐火车的开车退休者对照股票经纪人的通勤。D的 ordinary taxpayers 把股票经纪人代表的对象换成了另一边的一般纳税人。股票经纪人在生活中也可能纳税，但题干问作者拿他代表哪类人，不是问他是否有纳税身份；在这里他的daily commute对应的是铁路使用者承担成本这一边。</p>\n<p><strong>股票经纪人可能纳税，是否就说明这个例子用他代表一般纳税人？</strong></p>\n<p>不能。例子的对照角色由前一句费用由谁承担决定，D把作为铁路使用者的通勤者换到了一般纳税人那一边。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>22题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B保留；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>A把退休者的开车身份移给股票经纪人，D把例子两边对调；B接上铁路使用者，C的身份名词仍不清楚。先留下B和C。</p>\n<blockquote>\n<p><strong>22题暂时留下B和C。</strong></p>\n</blockquote>\n<h2>23题</h2>\n<blockquote>\n<p>It is indicated in Paragraph 3 that train operators ______.<br>第3段表明，火车运营商怎么样？</p>\n</blockquote>\n<p>题干直接限定 Paragraph 3，回到第3段。这里把乘客经历的罢工、运营商的改善、基本服务与补偿放在一起，要区分运营商、乘客和工会分别承担什么动作。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years. It is all very well train operators <strong>[xxx]</strong> the improvements they are making to the network, but passengers should be able to expect a basic level of service for the <strong>[xxx]</strong> sums they are now paying to travel. The responsibility for the latest wave of strikes rests on the unions. However, there is a strong case that those who have been worst affected by <strong>[xxx]</strong> action should receive compensation for the <strong>[xxx]</strong> they have suffered.</p>\n<p>开始精读：</p>\n<p>However, / over the past 12 months, / those commuters have also experienced / some of the worst rail strikes in years. / It is all very well train operators <strong>[xxx]</strong> / the improvements they are making to the network, / but passengers should be able to expect / a basic level of service / for the <strong>[xxx]</strong> sums / they are now paying to travel. / The responsibility for the latest wave of strikes / rests on the unions. / However, there is a strong case / that those who have been worst affected / by <strong>[xxx]</strong> action / should receive compensation / for the <strong>[xxx]</strong> they have suffered.</p>\n<p>然而，/ 在过去12个月里，/ 那些通勤者也经历了 / 几年来一些最糟糕的铁路罢工。/ 火车运营商 <strong>[xxx]</strong> 这件事固然很好 / 他们正在对铁路网络作的改善，/ 但乘客应当能够期待 / 一个基本的服务水平 / 对于那些 <strong>[xxx]</strong> 的款项 / 他们现在为旅行支付的。/ 对最新这一轮罢工的责任 / 在工会身上。/ 然而，有一个很强的理由 / 那些受到最严重影响的人 / 由 <strong>[xxx]</strong> 行动 / 应当收到补偿 / 为他们已经遭受的 <strong>[xxx]</strong>。</p>\n</blockquote>\n<p>第3段的but把网络改善与乘客应得到的基本服务作对照，随后把罢工责任归到工会，并提出受影响者应收到补偿。空格要补运营商的情况，不能把建议写成已经实行，也不能把乘客遭遇写到公司身上。</p>\n<h3>A. are offering compensation to commuters</h3>\n<blockquote>\n<p>正在向通勤者提供补偿</p>\n</blockquote>\n<p>把A接回题干，它说的是：第3段表明，火车运营商已经在向通勤者提供补偿。</p>\n<p>A的 are offering compensation 与第3段 should receive compensation 都谈补偿，所以回看段末there is a strong case之后，判断它是在提出应当怎样做，还是报道运营商正在支付。</p>\n<blockquote>\n<p>However, there is a strong case that those who have been worst affected by <strong>[xxx]</strong> action should receive compensation for the <strong>[xxx]</strong> they have suffered.</p>\n</blockquote>\n<p>原文 should receive compensation 是说受影响最严重的人应当得到补偿，there is a strong case也在说明这样做有充分理由。A的 are offering compensation 却说运营商已经正在补偿，把应当采取的行动写成已经发生的事实。句中没有把支付者的实际动作放在现在进行时里，作者正在提出的是对乘客应有待遇的要求。</p>\n<p><strong>“受影响者应当得到补偿”，等于“运营商已经正在支付补偿”吗？</strong></p>\n<p>不等于。应当收到与已经提供分别是要求和事实，A把这一步提前了。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. are trying to repair relations with the unions</h3>\n<blockquote>\n<p>正在设法修复与工会的关系</p>\n</blockquote>\n<p>把B接回题干，它说的是：第3段表明，运营商正努力改善与工会的关系。</p>\n<p>B的 repair relations with the unions 指向运营商与工会，但第3段改善的对象是 the network，而工会出现在strikes责任那句，因此把这两处回看在一起，确认改善和工会有没有连成同一动作。</p>\n<blockquote>\n<p>It is all very well train operators <strong>[xxx]</strong> the improvements they are making to the network, but passengers should be able to expect a basic level of service for the <strong>[xxx]</strong> sums they are now paying to travel.</p>\n</blockquote>\n<blockquote>\n<p>The responsibility for the latest wave of strikes rests on the unions.</p>\n</blockquote>\n<p>原文 the network 接在improvements之后，说运营商对铁路网络的改善；工会则是最新罢工责任所在。B的 repair relations with the unions 把“改善铁路网络”换成“修复劳资关系”，又把工会从承担罢工责任的一方放进运营商正在修复关系的动作里。两句话分别谈服务改善和罢工责任，不能把它们拼成运营商与工会正在和解。</p>\n<p><strong>改善网络与指出工会的罢工责任，能拼成正在修复双方关系吗？</strong></p>\n<p>不能。the network是实际改善的对象，unions是责任所归的一方，B把两个不同句子的关系重新连接了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. have failed to provide an <strong>[xxx]</strong> service</h3>\n<blockquote>\n<p>未能提供一种 <strong>[xxx]</strong> 的服务</p>\n</blockquote>\n<p>把C接回题干，它说的是：第3段表明，运营商没有提供某种应有水平的 <strong>[xxx]</strong> 服务。</p>\n<p>C的 have failed to provide 要与乘客实际收到的服务比较，第3段的 a basic level of service 就是服务要求，因此回看乘客经历严重罢工与but后面应有服务的两处。</p>\n<blockquote>\n<p>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years.</p>\n</blockquote>\n<blockquote>\n<p>but passengers should be able to expect a basic level of service for the <strong>[xxx]</strong> sums they are now paying to travel.</p>\n</blockquote>\n<p>原文先写乘客经历几年来最严重的一些铁路罢工，随后说乘客付钱出行应当期待 a basic level of service。C的 have failed to provide 在说运营商未能提供应有服务，能接上现实遭遇与基本要求之间的落差。形容service的 <strong>[xxx]</strong> 仍不认识，不能替它挑一个具体词义；但C没有把补偿要求说成已经支付，也没有把工会责任写成双方正在修复关系，谈的正是服务没有达到应有状态。</p>\n<p><strong>严重罢工的遭遇，与“付钱乘客应当得到基本服务”的要求，是否表现出服务上的落差？</strong></p>\n<p>能。现实中出行受到严重影响，作者才把乘客应得的基本服务摆出来；C围绕这项服务落差，应当保留，形容词暂时仍写作 <strong>[xxx]</strong>。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. have suffered huge losses owing to the strikes</h3>\n<blockquote>\n<p>由于罢工遭受了巨大损失</p>\n</blockquote>\n<p>把D接回题干，它说的是：第3段表明，火车运营商因罢工遭受巨额损失。</p>\n<p>D的 have suffered huge losses 与段末 they have suffered 都说遭受了什么，所以回看they之前的those who，并接上段首those commuters，确认受影响的人是谁。</p>\n<blockquote>\n<p>However, over the past 12 months, those commuters have also experienced some of the worst rail strikes in years.</p>\n</blockquote>\n<blockquote>\n<p>However, there is a strong case that those who have been worst affected by <strong>[xxx]</strong> action should receive compensation for the <strong>[xxx]</strong> they have suffered.</p>\n</blockquote>\n<p>原文 they have suffered 接在应当得到补偿的受影响者之后，前面连续谈的是遭遇罢工、付钱出行的乘客。D的 have suffered huge losses 却把遭受者换成题干里的火车运营商，并给出huge losses这一具体巨大损失。这里作者要求受影响乘客获得补偿，并未把公司的财务损失当成补偿理由；遭受的那个 <strong>[xxx]</strong> 还未知，也不能替它加上巨额公司的损失。</p>\n<p><strong>段末应当得到补偿、已经遭受影响的人，是乘客还是运营商？</strong></p>\n<p>前者。D把这群乘客的遭遇转给了运营商，又补成巨额损失，主体与遭受的具体内容都变了。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>23题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A排除；</li>\n<li>B排除；</li>\n<li>C保留；</li>\n<li>D排除。</li>\n</ul>\n<p>A把应补偿写成正在补偿，B把网络改善与工会责任拼成修复关系，D把乘客遭遇写成公司损失；C与基本服务要求和实际罢工的落差相连，留下C。</p>\n<blockquote>\n<p><strong>23题选C。</strong></p>\n</blockquote>\n<h2>24题</h2>\n<blockquote>\n<p>If unable to calm down passengers, the railways may have to face ______.<br>如果不能平息乘客的不满，铁路方面可能不得不面对什么？</p>\n</blockquote>\n<p>题干要找无法平息passengers之后的后果。第4段末尾直接出现the justified anger of passengers，回到这一段，先读服务措施与付费条件，再看结尾if引出的后果。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The Government has <strong>[xxx]</strong> to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate. This should form part of a wider package of measures to address the long-running problems on Britain’s railways. Yes, more investment is needed, but passengers will not be willing to pay more <strong>[xxx]</strong> if they must also endure <strong>[xxx]</strong>, unreliable services, interrupted by regular <strong>[xxx]</strong> when timetables are changed, or planned maintenance is managed <strong>[xxx]</strong>. The threat of nationalisation may have been seen off for now, but it will return with a <strong>[xxx]</strong> if the justified anger of passengers is not addressed in short order.</p>\n<p>开始精读：</p>\n<p>The Government has <strong>[xxx]</strong> / to change the law / to introduce a minimum service requirement / so that, even when strikes occur, / services can continue to operate. / This should form part of a wider package of measures / to address the long-running problems on Britain’s railways. / Yes, more investment is needed, / but passengers will not be willing / to pay more <strong>[xxx]</strong> / if they must also endure <strong>[xxx]</strong>, unreliable services, / interrupted by regular <strong>[xxx]</strong> / when timetables are changed, / or planned maintenance is managed <strong>[xxx]</strong>. / The threat of nationalisation / may have been seen off for now, / but it will return with a <strong>[xxx]</strong> / if the justified anger of passengers / is not addressed in short order.</p>\n<p>政府已 <strong>[xxx]</strong> / 去改变法律 / 去引入一个最低服务要求 / 以便，即使罢工发生时，/ 服务能继续运行。/ 这应构成更广的一套措施的一部分 / 去处理英国铁路长期存在的问题。/ 是的，需要更多投资，/ 但乘客不会愿意 / 支付更多 <strong>[xxx]</strong> / 如果他们还必须忍受 <strong>[xxx]</strong>、不可靠的服务，/ 被经常性的 <strong>[xxx]</strong> 中断 / 当时刻表改变时，/ 或计划好的维修被管理得 <strong>[xxx]</strong>。/ 国有化的威胁 / 也许暂时已被挡开，/ 但它将带着一个 <strong>[xxx]</strong> 回来 / 如果乘客合理的愤怒 / 没有很快得到处理。</p>\n</blockquote>\n<p>第4段提出最低服务要求，随后说乘客不会愿意在服务仍不可靠时多付钱；最后的it will return承接前面的国有化威胁，而条件正是乘客的合理愤怒没有及时得到处理。空格要补这个条件对应的后果。</p>\n<h3>A. a change of ownership</h3>\n<blockquote>\n<p>所有权的改变</p>\n</blockquote>\n<p>把A接回题干，它说的是：如果安抚不了乘客，铁路方面可能面临所有权改变。</p>\n<p>A的 a change of ownership 说铁路归谁所有，第4段nationalisation正是转为国家所有的变化，所以回看国有化威胁与乘客愤怒相连的末句。</p>\n<blockquote>\n<p>The threat of nationalisation may have been seen off for now, but it will return with a <strong>[xxx]</strong> if the justified anger of passengers is not addressed in short order.</p>\n</blockquote>\n<p>原文的nationalisation指国有化，改变的是铁路由谁所有；it will return承接的是这种威胁，if后面给出乘客愤怒未解决的条件。A的 a change of ownership 把国有化概括为所有权变化，保留了题干may所说的可能，并没有宣布铁路已经归国家所有。条件、后果和发生程度都与末句相连。</p>\n<p><strong>国有化威胁重新出现，能作为可能发生所有权变化的依据吗？</strong></p>\n<p>能。nationalisation本身就是所有权转向国家，A只说may face，没有把威胁写成已经完成的国有化。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. a reduction of revenue</h3>\n<blockquote>\n<p>营收的减少</p>\n</blockquote>\n<p>把B接回题干，它说的是：如果不能平息乘客不满，铁路将可能收入减少。</p>\n<p>B的 a reduction of revenue 涉及收入变化，第4段相近的是pay more，都是乘客付款与铁路收钱的问题，因此回看乘客不愿多付钱的条件句，再对照末句明确说要回来的威胁。</p>\n<blockquote>\n<p>but passengers will not be willing to pay more <strong>[xxx]</strong> if they must also endure <strong>[xxx]</strong>, unreliable services, interrupted by regular <strong>[xxx]</strong> when timetables are changed, or planned maintenance is managed <strong>[xxx]</strong>.</p>\n</blockquote>\n<blockquote>\n<p>The threat of nationalisation may have been seen off for now, but it will return with a <strong>[xxx]</strong> if the justified anger of passengers is not addressed in short order.</p>\n</blockquote>\n<p>原文pay more是在说乘客不愿继续增加支付，条件是同时忍受不可靠的服务；B的a reduction of revenue却说铁路收入比原来减少。不愿再多付与总收入减少不是同一种变化，不能把拒绝继续加价写成已经少付。题干的无法平息愤怒更直接接末句国有化威胁回来，B还把这个明确条件后果换成了财务总额变化。</p>\n<p><strong>不愿继续多付钱，是否就等于铁路总收入将减少？</strong></p>\n<p>不能。前者拒绝的是进一步增加，后者断言总额下降；末句针对乘客愤怒给出的也不是收入下降，而是国有化威胁回来。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. the loss of investment</h3>\n<blockquote>\n<p>投资的流失</p>\n</blockquote>\n<p>把C接回题干，它说的是：如果不能安抚乘客，铁路可能失去投资。</p>\n<p>C的 the loss of investment 让我们回看more investment is needed，两边都提投资，所以把投资需求那句与末尾乘客愤怒的条件一起看，分清需要更多和失去已有投资。</p>\n<blockquote>\n<p>Yes, more investment is needed,</p>\n</blockquote>\n<blockquote>\n<p>The threat of nationalisation may have been seen off for now, but it will return with a <strong>[xxx]</strong> if the justified anger of passengers is not addressed in short order.</p>\n</blockquote>\n<p>原文more investment is needed承认铁路需要增加投入；C的the loss of investment则说乘客愤怒将造成投资流失。需要更多投入不能自动反转成已有资金会被撤走；而且末句if直接连接的是国有化威胁重新出现，不是投资方撤资。这里投资属于作者承认的改善需求，C把需求改成乘客不满导致的资金损失。</p>\n<p><strong>“铁路需要更多投资”可以改成“乘客不满会让已有投资流失”吗？</strong></p>\n<p>不能。一个是投入需求，一个是带着因果的资金流失，原文明确的条件结果又是国有化威胁，C把这两处重新拼成了另一条关系。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. the <strong>[xxx]</strong> of operations</h3>\n<blockquote>\n<p>运营的 <strong>[xxx]</strong></p>\n</blockquote>\n<p>把D接回题干，它说的是：如果不能安抚乘客，铁路可能面对运营上的某种 <strong>[xxx]</strong>。</p>\n<p>D的 operations 指铁路运营，第4段services can continue to operate也在说能否继续运行，所以回看最低服务要求和末尾国有化威胁两处，看运营的什么变化被当成后果。</p>\n<blockquote>\n<p>to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate.</p>\n</blockquote>\n<blockquote>\n<p>The threat of nationalisation may have been seen off for now, but it will return with a <strong>[xxx]</strong> if the justified anger of passengers is not addressed in short order.</p>\n</blockquote>\n<p>原文services can continue to operate是最低服务要求想达到的结果，末句则把乘客愤怒连到国有化威胁。D的operations确实在铁路运营范围内，但它前面的 <strong>[xxx]</strong> 才说明运营将发生什么。这个名词没有读清，不能直接说D指停运，也不能直接把它解释成国有化；它是否与所有权变化重合，目前还无法确定。</p>\n<p><strong>只看operations，能确定D说的是哪一种运营变化吗？</strong></p>\n<p>不能。原文已经有继续运行和国有化威胁两种不同内容，D的核心名词决定它要接哪一种，目前先把D留下。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>24题第一次结果</h3>\n<p>这一轮看下来：</p>\n<ul>\n<li>A保留；</li>\n<li>B排除；</li>\n<li>C排除；</li>\n<li>D保留。</li>\n</ul>\n<p>A能把国有化概括为所有权变化，D的运营变化名词仍不认识；B把不愿多付改成总收入下降，C把投入需求改成投资流失。先留下A和D。</p>\n<blockquote>\n<p><strong>24题暂时留下A和D。</strong></p>\n</blockquote>\n<h2>25题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下列哪一项最适合做这篇文章的标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Ever-rising Fares Aren’t Sustainable</strong></p>\n<p>不断上涨的票价难以持续</p>\n<p>B. <strong>Who Are to Blame for the Strikes?</strong></p>\n<p>罢工应该归咎于谁？</p>\n<p>C. <strong>Constant Complaining Doesn’t Work</strong></p>\n<p>不停抱怨并不起作用</p>\n<p>D. <strong>Can Nationalisation Bring Hope?</strong></p>\n<p>国有化能带来希望吗？</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>质问铁路为何又涨票价，指出乘客负担增加，今年涨幅仍明显超过通胀。</td>\n<td>先说xxx继续这样没道理</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明政府允许涨价的理由是使用者承担成本，并补充东南部通勤者受到的关注。</td>\n<td>再说支持xxx的人怎么解释</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>转回乘客遭遇严重罢工，强调付钱应有基本服务，并主张受影响者得到补偿。</td>\n<td>但话说回来实际并没有做好</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>提出最低服务等措施；承认需要投资，但服务不可靠就难让乘客多付钱，不解决愤怒会重新招来国有化威胁。</td>\n<td>最后说不改好会有更大麻烦</td>\n</tr>\n</tbody></table>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>A. Ever-rising Fares Aren’t Sustainable</h3>\n<p>不断上涨的票价难以持续</p>\n<h4>如果 A 是主旨，文章4段应该怎么写？</h4>\n<p>如果A是标题，全文应讨论反复涨价为什么难以继续成立：先看负担，再看涨价理由是否能经受服务现实的检验。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先质问铁路不断涨价给乘客造成的负担。</td>\n<td>先说xxx继续这样没道理</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>交代支持使用者多付费的一方有什么理由。</td>\n<td>再说支持xxx的人怎么解释</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>拿实际服务表现检验这些理由，说明乘客付钱却未得到应有服务。</td>\n<td>但话说回来实际并没有做好</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>提出改善要求，并警告若服务和不满得不到处理，继续涨价难以维持。</td>\n<td>最后说不改好会有更大麻烦</td>\n</tr>\n</tbody></table>\n<p>A可以把每段的动作接起来。第1段问又一次涨价如何justify，第2段摆出成本由使用者承担的理由，第3段的However再把严重罢工和基本服务摆到这些理由面前，第4段直接说乘客在服务不可靠时不会愿意继续多付。A中的Aren’t Sustainable说这种不断上涨的做法难以持续，并不等于否认铁路需要任何投资；作者明说more investment is needed，问题在于不能只要求乘客加钱，却不处理服务与愤怒。国有化威胁正是这种矛盾继续下去的后果。</p>\n<p><strong>“不断上涨的票价难以持续”能同时容纳投资需求、服务要求与最后的警告吗？</strong></p>\n<p>能。它承认铁路要资金，同时要求付费与服务相配；如果涨价一直发生而服务问题不改，乘客不愿多付，现有铁路安排也会承受压力。四段共同围绕这个问题展开。</p>\n<p><strong>判断：A保留。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>B. Who Are to Blame for the Strikes?</h3>\n<p>罢工应该归咎于谁？</p>\n<h4>如果 B 是主旨，文章4段应该怎么写？</h4>\n<p>如果B是标题，文章应以罢工责任为中心，先提出争议，再比较有关各方的责任，最后作出归责。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先提出铁路罢工究竟该怪谁。</td>\n<td>先说xxx继续这样没道理</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明为某一方辩护的人有什么理由。</td>\n<td>再说支持xxx的人怎么解释</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用罢工事实检验各方说法，找出真正责任者。</td>\n<td>但话说回来实际并没有做好</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>最后提出追究罢工责任的办法与不处理的后果。</td>\n<td>最后说不改好会有更大麻烦</td>\n</tr>\n</tbody></table>\n<p>第3段确实有The responsibility...rests on the unions，工会承担最新罢工责任这一点非常明确。但前两段大部分内容与“谁造成罢工”无关：票价年年上涨、今年高于通胀、使用者承担成本，都是围绕付费合理性展开。作者指明工会责任后马上又要求受影响乘客得到补偿，末段回到服务、投资和多付钱的条件。因此罢工是服务未达到期待的一部分，不是全文要反复追查的中心问题。</p>\n<p><strong>一个关于罢工责任的标题，能解释前两段为什么持续讨论票价与成本由谁承担吗？</strong></p>\n<p>不能。B只接到第3段一个明确判断，却无法统领开头的反复涨价和结尾的付费条件；文章讨论的是乘客持续承担更多费用是否还能成立。</p>\n<p><strong>判断：B排除。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>C. Constant Complaining Doesn’t Work</h3>\n<p>不停抱怨并不起作用</p>\n<h4>如果 C 是主旨，文章4段应该怎么写？</h4>\n<p>如果C是标题，全文应认为乘客不断抱怨没有效果，先指出抱怨的问题，再说明为什么不该依靠抱怨。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先质问为什么还有人在不停抱怨。</td>\n<td>先说xxx继续这样没道理</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>交代支持抱怨的一方提出什么理由。</td>\n<td>再说支持xxx的人怎么解释</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用实际结果说明抱怨没有改善情况。</td>\n<td>但话说回来实际并没有做好</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>最后警告继续抱怨会有麻烦，并要求改变这种做法。</td>\n<td>最后说不改好会有更大麻烦</td>\n</tr>\n</tbody></table>\n<p>C把Constant Complaining作为需要否定的行为，但原文开头并没有责备乘客抱怨，而是替乘客质问运营商为何再次涨价。末段又用justified anger把愤怒说成有理由的，要求及时处理；中间还主张受影响乘客应得到补偿。第2段对某些通勤者受到关注的说法只是被摆出的一个角度，后面的However把讨论重新带回他们确实遭受的服务问题。全文并没有用“抱怨没用”来否定乘客的要求。</p>\n<p><strong>作者把乘客愤怒说成justified并要求处理，能用“不断抱怨没用”统领全文吗？</strong></p>\n<p>不能。原文支持认真回应乘客的服务要求，C却把乘客的反应当作应被否定的中心，两边评价的对象和方向都不同。</p>\n<p><strong>判断：C排除。</strong></p>\n<hr>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<h3>D. Can Nationalisation Bring Hope?</h3>\n<p>国有化能带来希望吗？</p>\n<h4>如果 D 是主旨，文章4段应该怎么写？</h4>\n<p>如果D是标题，全文应围绕国有化能否改善铁路来展开，比较支持理由、实际可能性和最终希望。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>第1段</td>\n<td>先质问为什么还未选择或继续考虑国有化。</td>\n<td>先说xxx继续这样没道理</td>\n</tr>\n<tr>\n<td>第2段</td>\n<td>说明支持国有化的一方有什么理由。</td>\n<td>再说支持xxx的人怎么解释</td>\n</tr>\n<tr>\n<td>第3段</td>\n<td>用服务现实检验国有化究竟能带来哪些改善。</td>\n<td>但话说回来实际并没有做好</td>\n</tr>\n<tr>\n<td>第4段</td>\n<td>最后判断国有化能否解决问题以及需要满足什么条件。</td>\n<td>最后说不改好会有更大麻烦</td>\n</tr>\n</tbody></table>\n<p>D抓住第4段末尾的nationalisation，但文章把它称为threat，是现有运营安排若不及时处理乘客愤怒可能再次面对的后果。正文没有比较国有铁路和其他所有权安排的运营成绩，也没有说明国有化如何出资、怎样解决罢工。前三段展开的是乘客为什么不断被要求多付钱，以及基本服务是否做到；最后才用所有权可能改变加重警告。一个结尾的条件后果，不能替换前三段持续展开的票价与服务问题。</p>\n<p><strong>国有化在文中是被充分讨论的希望方案，还是不解决乘客不满可能引来的警告？</strong></p>\n<p>后者。作者并未论证国有化能带来什么具体改善，D把最后一个警告提升为全文研究的问题，开头到中段的付费讨论反而无处安放。</p>\n<p><strong>判断：D排除。</strong></p>\n<hr>\n<h3>25题结论</h3>\n<p><strong>25. A. Ever-rising Fares Aren’t Sustainable</strong></p>\n<p>作者先质疑反复涨价，再检验使用者承担成本的理由，最后明确要求改善服务和回应乘客愤怒。A能够贯穿票价、服务与后果三者。</p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Ever-rising Fares Aren’t Sustainable / 不断上涨的票价难以持续</strong></p>\n<hr>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查22题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. rail travellers</li>\n<li>C. local <strong>[xxx]</strong></li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Ever-rising Fares Aren’t Sustainable</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>不断上涨的票价难以持续</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。B说第2段股票经纪人代表铁路乘客；C说他代表当地某类 <strong>[xxx]</strong>。第一遍我们把B接到了those who use it，也看见股票经纪人的每日通勤与开车退休者形成对照，但C里的身份名词没有读懂，from Surrey又确实给了这个人地方属性，因此不能只因为local不够直接就排除。</p>\n<p>现在拿主旨来检查。全文讨论不断上涨的票价难以持续，政府在第2段为涨价给出的理由，是投资和运营成本应该由使用铁路的人承担。股票经纪人被放在这个论点之后，需要把“谁在使用铁路、谁应为这种使用付费”写得具体。B的铁路乘客身份正能承担这个作用：他的每日通勤对应使用铁路，而开车退休者代表不使用铁路却属于一般纳税人的另一边。</p>\n<p>C里的local只能说明地点，主旨没有给那个未知身份添加新的意思。即使某个当地身份也可能坐火车，我们仍需要知道它是否把“使用者承担成本”这一点表达出来，不能拿萨里郡这个地点替代这种作用。回到第一遍读过的原文，those who use it与rather than the general taxpayer先划出两边，后面的反问再用两个人把两边具体化。B同时得到这一局部对照和全文付费争论的支持；C的身份仍未读清，因此最终选B。</p>\n<blockquote>\n<p><strong>22题选B。</strong></p>\n</blockquote>\n<hr>\n<h2>回查24题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. a change of ownership</li>\n<li>D. the <strong>[xxx]</strong> of operations</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Ever-rising Fares Aren’t Sustainable</strong></p>\n</blockquote>\n<p>也就是：</p>\n<blockquote>\n<p>不断上涨的票价难以持续</p>\n</blockquote>\n<p>我们先把题干和两个选项接起来。A说如果不能平息乘客不满，铁路可能面对所有权变化；D说铁路可能面对运营的某种 <strong>[xxx]</strong>。第一遍A已能接到nationalisation，但D的核心名词没有读懂，operations又确实是铁路相关内容，所以没有把它先猜成停运或别的具体后果。</p>\n<p>现在拿主旨来检查。不断上涨的票价难以持续，全文要运营方正视乘客付出更多却仍遇到不可靠服务的矛盾。结尾的警告是在说，如果现有安排继续让乘客愤怒而又不处理，更大的改变就可能回来。A的所有权变化能承接这个警告：国有化不是某一次班次的调整，而是铁路由谁所有发生改变，这会让现有运营安排承受直接压力。</p>\n<p>D只读到“运营的某种变化”，主旨能说明运营服务需要改进，却不能替它把 <strong>[xxx]</strong> 读成题干这个条件所接的结果。最低服务要求想让罢工期间仍能运行，是前面提出的改善措施；末句关于平息愤怒的条件，则另接国有化威胁重新出现。再回到第一遍的原文，The threat of nationalisation在前，it will return承接它，if后面才是乘客愤怒没有得到处理。A既忠实于这条条件连接，也体现全文对现有涨价与服务安排的警告；D的具体变化仍未确定，最后选择A。</p>\n<blockquote>\n<p><strong>24题选A。</strong></p>\n</blockquote>\n<hr>\n<h2>最终答案：</h2>\n<p><strong>21. D</strong></p>\n<p><strong>22. B</strong></p>\n<p><strong>23. C</strong></p>\n<p><strong>24. A</strong></p>\n<p><strong>25. A</strong></p>\n","analysisStartIndex":26,"maskInventory":{"token":"[xxx]","count":144},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"ordinaryFirstRoundCandidates":{"21":["D"],"22":["B","C"],"23":["C"],"24":["A","D"]},"maskAdjustmentState":"not_needed","mainIdeaQid":"25"},"questionOptionFlowVersion":"question_scope_whole_paragraph_then_option_compare_v3","questionFlowPlan":[{"schema":"question-flow-plan-v3","qid":"21","questionType":"ordinary","paragraphPids":[0],"locator":{"basis":"stem_entity","anchors":["this year"],"paragraphPids":[0]},"initialReadingMode":"new","in
