<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 36题题干\n\n**There has long been concern that broadband providers would ______.**\n\n> 长期以来，人们一直担心宽带提供商会做什么？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,190,951,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"36"},"html":"<h2>36题题干</h2>\n<p><strong>There has long been concern that broadband providers would ______.</strong></p>\n<blockquote><p>长期以来，人们一直担心宽带提供商会做什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 37题题干\n\n**Faced with the demand for net neutrality rules, the FCC ______.**\n\n> 面对制定网络中立性规则的要求，联邦通信委员会做了什么？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,570,888,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"37"},"html":"<h2>37题题干</h2>\n<p><strong>Faced with the demand for net neutrality rules, the FCC ______.</strong></p>\n<blockquote><p>面对制定网络中立性规则的要求，联邦通信委员会做了什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 38题题干\n\n**What can be learned about AT&T from Paragraph 3?**\n\n> 从第三段可以了解美国电话电报公司的什么情况？\n\n题型：**细节推断题**。","articleRects":[],"questionRects":[[226,951,834,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"38"},"html":"<h2>38题题干</h2>\n<p><strong>What can be learned about AT&amp;T from Paragraph 3?</strong></p>\n<blockquote><p>从第三段可以了解美国电话电报公司的什么情况？</p>\n</blockquote>\n<p>题型：<strong>细节推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 39题题干\n\n**Judge Patricia Millett argues that the appeals court’s decision ______.**\n\n> 帕特里夏·米利特法官认为，上诉法院的决定怎么样？\n\n题型：**人物观点题**。","articleRects":[],"questionRects":[[226,1331,954,38],[1186,1363,104,7]],"scrollTarget":"question","meta":{"kind":"stem","qid":"39"},"html":"<h2>39题题干</h2>\n<p><strong>Judge Patricia Millett argues that the appeals court’s decision ______.</strong></p>\n<blockquote><p>帕特里夏·米利特法官认为，上诉法院的决定怎么样？</p>\n</blockquote>\n<p>题型：<strong>人物观点题</strong>。</p>\n"},{"section":"先读题干","raw":"## 40题题干\n\n**What does the author argue in the last paragraph?**\n\n> 作者在最后一段主张什么？\n\n题型：**段落观点题**。","articleRects":[],"questionRects":[[225,1712,790,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"40"},"html":"<h2>40题题干</h2>\n<p><strong>What does the author argue in the last paragraph?</strong></p>\n<blockquote><p>作者在最后一段主张什么？</p>\n</blockquote>\n<p>题型：<strong>段落观点题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Yet, instead of, But |\n| 态度词／评价词 | 先抓个大概好坏 | anti-regulatory, rightly, unhinged |\n| 动作词 | 先看谁做了什么 | favoring, eliminated, upheld |\n| 结果词 | 看最后出了什么事 | freedom, openness, innovation |\n| 重复主题词 | 大概知道老在说什么 | FCC, broadband, rules |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>Yet, instead of, But</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>anti-regulatory, rightly, unhinged</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>favoring, eliminated, upheld</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>freedom, openness, innovation</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>FCC, broadband, rules</td></tr></tbody></table>\n"},{"section":"读文章","raw":"From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and **[xxx]** to favor affiliated websites over their rivals’. That’s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the **[xxx]** of the internet.","articleRects":[[273,297,1123,38],[202,344,1194,37],[202,390,1195,38],[202,436,1194,38],[202,483,1194,38],[202,529,1050,31]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and <strong>[xxx]</strong> to favor affiliated websites over their rivals’. That’s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the <strong>[xxx]</strong> of the internet.</p>\n</div></div>"},{"section":"读文章","raw":"From the early days of broadband, / advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and **[xxx]** to favor affiliated websites over their rivals’. / That’s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, / preserving the freedom and innovation that have been the **[xxx]** of the internet.","articleRects":[[273,297,1123,38],[20 命令、对宽带提供商放松监管、现代宽带服务的现实、国会或最高法院；法院否决了、各州所有规则、更多争斗、制定严格的网络中立性法律；结尾还有无休止的法律争斗、迫切要求国会行动、制定明确规则、保护网络开放和创新。</p>\n<p>到这里还不能自然地说清楚：联邦机构、法院、州与国会分别做了什么，规则变化怎样影响用户和网站，作者希望谁采取行动。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"36题","raw":"## 36题\n\n> There has long been concern that broadband providers would ______.  \n> 长期以来，人们一直担心宽带提供商会做什么？\n\n题干中的long been concern和broadband providers让人想起第一段粗读中的advocates for consumers、selling broadband connections以及to favor affiliated websites。这里讨论的是从宽带早期就存在的担忧，先把第一段完整读一遍。\n\n> 原文参考：\n> \n> From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and **[xxx]** to favor affiliated websites over their rivals’. That’s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the **[xxx]** of the internet.\n> \n> 开始精读：\n> \n> From the early days of broadband, / advocates for consumers and web-based companies worried / that the cable and phone companies selling broadband connections / had the power and **[xxx]** / to favor affiliated websites over their rivals’. / That’s why there has been such a strong demand for rules / that would prevent broadband providers from picking winners and losers online, / preserving the freedom and innovation / that have been the **[xxx]** of the internet.\n> \n> 从宽带出现的早期开始， / 消费者和网络公司的权益倡导者就担心， / 销售宽带连接服务的有线电视公司和电话公司 / 有权力和**[xxx]**， / 去优待关联网站，而使其竞争对手的网站处于不利地位。 / 这就是为什么人们如此强烈地要求制定规则， / 防止宽带提供商在网上决定谁赢谁输， / 从而维护自由和创新， / 它们一直是互联网的**[xxx]**。\n\n题干要补的是人们担心宽带提供商会采取的做法。第一段先写倡导者担心什么，再写因此要求规则防止什么，要看选项是否准确接上这个担忧。\n\n接下来按A—D逐项看。","articleRects":[[273,297,1123,38],[202,344,1194,37],[202,390,1195,38],[202,436,1194,38],[202,483,1194,38],[202,529,1050,31]],"questionRects":[[226,190,951,38],[280,253,531,38],[280,317,579,38],[280,380,613,31],[280,444,599,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"36","initialReadingPids":[0]},"html":"<h2>36题</h2>\n<blockquote><p>There has long been concern that broadband providers would ______.<br />\n长期以来，人们一直担心宽带提供商会做什么？</p>\n</blockquote>\n<p>题干中的long been concern和broadband providers让人想起第一段粗读中的advocates for consumers、selling broadband connections以及to favor affiliated websites。这里讨论的是从宽带早期就存在的担忧，先把第一段完整读一遍。</p>\n<blockquote><p>原文参考：</p>\n<p>From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and <strong>[xxx]</strong> to favor affiliated websites over their rivals’. That’s why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the <strong>[xxx]</strong> of the internet.</p>\n<p>开始精读：</p>\n<p>From the early days of broadband, / advocates for consumers and web-based companies worried / that the cable and phone companies selling broadband connections / had the power and <strong>[xxx]</strong> / to favor affiliated websites over their rivals’. / That’s why there has been such a strong demand for rules / that would prevent broadband providers from picking winners and losers online, / preserving the freedom and innovation / that have been the <strong>[xxx]</strong> of the internet.</p>\n<p>从宽带出现的早期开始， / 消费者和网络公司的权益倡导者就担心， / 销售宽带连接服务的有线电视公司和电话公司 / 有权力和<strong>[xxx]</strong>， / 去优待关联网站，而使其竞争对手的网站处于不利地位。 / 这就是为什么人们如此强烈地要求制定规则， / 防止宽带提供商在网上决定谁赢谁输， / 从而维护自由和创新， / 它们一直是互联网的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>题干要补的是人们担心宽带提供商会采取的做法。第一段先写倡导者担心什么，再写因此要求规则防止什么，要看选项是否准确接上这个担忧。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"36题","raw":"### A. show partiality in treating clients\n\n> 在对待客户时表现出偏袒\n\n把A接回题干，它说的是：长期以来，人们一直担心宽带提供商在对待客户时表现出偏袒。\n\nA说区别对待、偏袒客户。第1段的`favor affiliated websites over their rivals’`直接写偏向哪一方，我们把两边找清。\n\n> had the power and **[xxx]** to favor affiliated websites over their rivals’.\n\n宽带公司可能优待关联网站，而让竞争对手的网站处于劣势。两类网站经过同一个宽带网络，却没有得到相同待遇。\n\n下一句因此要求防止提供商在网上挑选赢家与输家，说明担心的正是它用自己的位置来扶持一方、压低另一方。\n\nA的`partiality`概括这种偏袒，没有另加所有客户都会被减速或受控制，正好接住本段的差别对待。\n\n**关联网站被优待、对手网站处于劣势，是否就是提供商在对待客户时有所偏袒？**\n\n是。A对应原句两类网站待遇不同的担忧。\n\n**第一轮判断：A保留。**","articleRects":[[273,297,1123,38],[202,344,1194,37],[202,390,1195,38],[202,436,1194,38],[202,483,1194,38],[202,529,1050,31]],"questionRects":[[280,253,531,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"36","paragraphPids":[0]},"html":"<h3>A. show partiality in treating clients</h3>\n<blockquote><p>在对待客户时表现出偏袒</p>\n</blockquote>\n<p>把A接回题干，它说的是：长期以来，人们一直担心宽带提供商在对待客户时表现出偏袒。</p>\n<p>A说区别对待、偏袒客户。第1段的<code>favor affiliated websites over their rivals’</code>直接写偏向哪一方，我们把两边找清。</p>\n<blockquote><p>had the power and <strong>[xxx]</strong> to favor affiliated websites over their rivals’.</p>\n</blockquote>\n<p>宽带公司可能优待关联网站，而让竞争对手的网站处于劣势。两类网站经过同一个宽带网络，却没有得到相同待遇。</p>\n<p>下一句因此要求防止提供商在网上挑选赢家与输家，说明担心的正是它用自己的位置来扶持一方、压低另一方。</p>\n<p>A的<code>partiality</code>概括这种偏袒，没有另加所有客户都会被减速或受控制，正好接住本段的差别对待。</p>\n<p><strong>关联网站被优待、对手网站处于劣势，是否就是提供商在对待客户时有所偏袒？</strong></p>\n<p>是。A对应原句两类网站待遇不同的担忧。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"36题","raw":"### B. bring web-based firms under control\n\n> 把网络公司置于控制之下\n\n把B接回题干，它说的是：长期以来，人们一直担心宽带提供商会把网络公司置于控制之下。\n\nB说把网络公司置于控制之下。原文写的是`favor`及`picking winners and losers`，我们看这种影响具体发生在哪一步。\n\n> to favor affiliated websites over their rivals’.\n\n> prevent broadband providers from picking winners and losers online\n\n提供商能让关联网站比对手更受优待，从而影响网上的竞争。这里说它如何利用宽带连接决定待遇。\n\nB的控制网络公司则更进一步，像是公司本身的行动、经营都被宽带提供商掌握。原句没有建立这种全面管理关系。\n\n能影响一家公司在网络竞争中的处境，不等于把这家公司本身置于控制之下。A的偏袒比B直接贴合原文的动作。\n\n**提供商通过连接待遇影响竞争，就等于控制了网络公司本身吗？**\n\n不等于。B把具体的差别待遇扩大成了公司受控制。\n\n**第一轮判断：B排除。**","articleRects":[[273,297,1123,38],[202,344,1194,37],[202,390,1195,38],[202,436,1194,38],[202,483,1194,38],[202,529,1050,31]],"questionRects":[[280,317,579,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>B. bring web-based firms under control</h3>\n<blockquote><p>把网络公司置于控制之下</p>\n</blockquote>\n<p>把B接回题干，它说的是：长期以来，人们一直担心宽带提供商会把网络公司置于控制之下。</p>\n<p>B说把网络公司置于控制之下。原文写的是<code>favor</code>及<code>picking winners and losers</code>，我们看这种影响具体发生在哪一步。</p>\n<blockquote><p>to favor affiliated websites over their rivals’.</p>\n</blockquote>\n<blockquote><p>prevent broadband providers from picking winners and losers online</p>\n</blockquote>\n<p>提供商能让关联网站比对手更受优待，从而影响网上的竞争。这里说它如何利用宽带连接决定待遇。</p>\n<p>B的控制网络公司则更进一步，像是公司本身的行动、经营都被宽带提供商掌握。原句没有建立这种全面管理关系。</p>\n<p>能影响一家公司在网络竞争中的处境，不等于把这家公司本身置于控制之下。A的偏袒比B直接贴合原文的动作。</p>\n<p><strong>提供商通过连接待遇影响竞争，就等于控制了网络公司本身吗？</strong></p>\n<p>不等于。B把具体的差别待遇扩大成了公司受控制。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"36题","raw":"### C. slow down the traffic on their network\n\n> 减缓其网络上的流量传输\n\n把C接回题干，它说的是：长期以来，人们一直担心宽带提供商会减缓其网络上的流量传输。\n\nC说减慢自身网络流量。第1段担忧的是关联网站与对手待遇不同，我们检查有没有把普遍减速说成这件事。\n\n> the cable and phone companies selling broadband connections had the power and **[xxx]** to favor affiliated websites over their rivals’.\n\n`favor ... over ...`是让一方比另一方占优，可以说明不公平，却没有在这一段具体写一项减速操作。\n\nC只说减慢网络上的流量，没有说明减慢谁、优待谁。即使差别待遇有时可以通过限速完成，也不能拿可能的手段直接代替原句的担忧。\n\n原文关心的是提供商自己挑赢家和输家，C把这一方与另一方的比较丢了，只剩流量变慢。\n\n**原文明确担心的是一方获优待、一方吃亏，还是网络流量普遍变慢？**\n\n是前者。C既没有明确的减速出处，也没保留差别待遇。\n\n**第一轮判断：C排除。**","articleRects":[[273,297,1123,38],[202,344,1194,37],[202,390,1195,38],[202,436,1194,38],[202,483,1194,38],[202,529,1050,31]],"questionRects":[[280,380,613,31]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>C. slow down the traffic on their network</h3>\n<blockquote><p>减缓其网络上的流量传输</p>\n</blockquote>\n<p>把C接回题干，它说的是：长期以来，人们一直担心宽带提供商会减缓其网络上的流量传输。</p>\n<p>C说减慢自身网络流量。第1段担忧的是关联网站与对手待遇不同，我们检查有没有把普遍减速说成这件事。</p>\n<blockquote><p>the cable and phone companies selling broadband connections had the power and <strong>[xxx]</strong> to favor affiliated websites over their rivals’.</p>\n</blockquote>\n<p><code>favor ... over ...</code>是让一方比另一方占优，可以说明不公平，却没有在这一段具体写一项减速操作。</p>\n<p>C只说减慢网络上的流量，没有说明减慢谁、优待谁。即使差别待遇有时可以通过限速完成，也不能拿可能的手段直接代替原句的担忧。</p>\n<p>原文关心的是提供商自己挑赢家和输家，C把这一方与另一方的比较丢了，只剩流量变慢。</p>\n<p><strong>原文明确担心的是一方获优待、一方吃亏，还是网络流量普遍变慢？</strong></p>\n<p>是前者。C既没有明确的减速出处，也没保留差别待遇。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"36题","raw":"### D. intensify competition with their rivals\n\n> 加剧与其竞争对手之间的竞争\n\n把D接回题干，它说的是：长期以来，人们一直担心宽带提供商会加剧与其竞争对手之间的竞争。\n\nD说加剧与对手竞争。原文的`rivals’`指对手的网站，我们看担心的是竞争多了，还是竞争不公平。\n\n> to favor affiliated websites over their rivals’.\n\n> prevent broadband providers from picking winners and losers online\n\n消费者和网络公司担心宽带提供商优待关联网站。随后要求规则防止它直接挑赢家和输家。\n\n这不是说只要竞争激烈就不好，而是说提供商可借网络连接给自己一方额外优势。\n\nD的竞争加剧可以发生在公平市场中，也没有说明偏袒。它把原文担心的不公平做法换成了竞争强度。\n\n**人们担心提供商偏袒自己一方，是只在担心双方竞争变得更激烈吗？**\n\n不是。问题在差别待遇，D没有说出这个关键。\n\n**第一轮判断：D排除。**","articleRects":[[273,297,1123,38],[202,344,1194,37],[202,390,1195,38],[202,436,1194,38],[202,483,1194,38],[202,529,1050,31]],"questionRects":[[280,444,599,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"36","paragraphPids":[0]},"html":"<h3>D. intensify competition with their rivals</h3>\n<blockquote><p>加剧与其竞争对手之间的竞争</p>\n</blockquote>\n<p>把D接回题干，它说的是：长期以来，人们一直担心宽带提供商会加剧与其竞争对手之间的竞争。</p>\n<p>D说加剧与对手竞争。原文的<code>rivals’</code>指对手的网站，我们看担心的是竞争多了，还是竞争不公平。</p>\n<blockquote><p>to favor affiliated websites over their rivals’.</p>\n</blockquote>\n<blockquote><p>prevent broadband providers from picking winners and losers online</p>\n</blockquote>\n<p>消费者和网络公司担心宽带提供商优待关联网站。随后要求规则防止它直接挑赢家和输家。</p>\n<p>这不是说只要竞争激烈就不好，而是说提供商可借网络连接给自己一方额外优势。</p>\n<p>D的竞争加剧可以发生在公平市场中，也没有说明偏袒。它把原文担心的不公平做法换成了竞争强度。</p>\n<p><strong>人们担心提供商偏袒自己一方，是只在担心双方竞争变得更激烈吗？</strong></p>\n<p>不是。问题在差别待遇，D没有说出这个关键。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"36题","raw":"### 36题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。第一段直接担心宽带提供商优待关联网站，对不同使用方表现出偏袒。","articleRects":[],"questionRects":[[226,190,951,38],[280,253,531,38],[280,317,579,38],[280,380,613,31],[280,444,599,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"36"},"html":"<h3>36题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。第一段直接担心宽带提供商优待关联网站，对不同使用方表现出偏袒。</p>\n"},{"section":"37题","raw":"## 37题\n\n> Faced with the demand for net neutrality rules, the FCC ______.  \n> 面对制定网络中立性规则的要求，联邦通信委员会做了什么？\n\n题干直接给出FCC，并问它如何面对net neutrality rules的要求。第二段出现了这个机构的全称，还说明2017年的命令如何处理此前的规则，先完整读第二段。\n\n> 原文参考：\n> \n> Yet that demand has been almost impossible to fill—in part because of pushback from broadband providers, anti-regulatory conservatives and the courts. A federal appeals court **[xxx]** in again Tuesday, but instead of providing a badly needed **[xxx]**, it only prolonged the fight. At issue before the US Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission’s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn’t regulate broadband providers either.\n> \n> 开始精读：\n> \n> Yet that demand has been almost impossible to fill—in part / because of pushback from broadband providers, anti-regulatory conservatives and the courts. / A federal appeals court **[xxx]** in again Tuesday, / but instead of providing a badly needed **[xxx]**, / it only prolonged the fight. / At issue before the US Court of Appeals for the District of Columbia Circuit / was the latest take of the Federal Communications Commission (FCC) on net neutrality, / adopted on a party-line vote in 2017. / The Republican penned order not only eliminated the strict net neutrality rules / the FCC had adopted when it had a Democratic majority in 2015, / but rejected the commission’s authority / to require broadband providers to do much of anything. / The order also declared / that state and local governments couldn’t regulate broadband providers either.\n> \n> 然而，这种要求几乎不可能得到满足——部分原因 / 是宽带提供商、反对监管的保守派以及法院的抵制。 / 一家联邦上诉法院周二再次**[xxx]**进来， / 但它没有提供急需的**[xxx]**， / 反而只是延长了争斗。 / 摆在美国哥伦比亚特区巡回上诉法院面前的争议， / 是联邦通信委员会对网络中立性的最新立场， / 该立场于2017年按党派划线的投票中通过。 / 共和党起草的命令不仅取消了严格的网络中立性规则， / 这些规则是联邦通信委员会在2015年民主党占多数时通过的， / 而且否定了该委员会的权力， / 使其几乎不能要求宽带提供商做任何事。 / 这项命令还宣布， / 州政府和地方政府同样不能监管宽带提供商。\n\n要查的是面对这些规则要求时，联邦通信委员会实际作出了什么决定。第二段把要求难以满足的背景与委员会命令的内容接在一起，空格应补委员会的做法。\n\n接下来按A—D逐项看。","articleRects":[[274,575,1125,38],[202,622,1184,37],[202,668,1195,38],[202,714,1194,38],[202,761,1194,38],[202,806,1194,39],[203,853,1193,38],[202,900,1189,38],[202,946,1194,38],[202,992,1194,38],[202,1039,525,38]],"questionRects":[[226,570,888,38],[280,634,477,30],[280,697,551,31],[280,757,489,46],[280,824,494,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"37","initialReadingPids":[1]},"html":"<h2>37题</h2>\n<blockquote><p>Faced with the demand for net neutrality rules, the FCC ______.<br />\n面对制定网络中立性规则的要求，联邦通信委员会做了什么？</p>\n</blockquote>\n<p>题干直接给出FCC，并问它如何面对net neutrality rules的要求。第二段出现了这个机构的全称，还说明2017年的命令如何处理此前的规则，先完整读第二段。</p>\n<blockquote><p>原文参考：</p>\n<p>Yet that demand has been almost impossible to fill—in part because of pushback from broadband providers, anti-regulatory conservatives and the courts. A federal appeals court <strong>[xxx]</strong> in again Tuesday, but instead of providing a badly needed <strong>[xxx]</strong>, it only prolonged the fight. At issue before the US Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017. The Republican penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission’s authority to require broadband providers to do much of anything. The order also declared that state and local governments couldn’t regulate broadband providers either.</p>\n<p>开始精读：</p>\n<p>Yet that demand has been almost impossible to fill—in part / because of pushback from broadband providers, anti-regulatory conservatives and the courts. / A federal appeals court <strong>[xxx]</strong> in again Tuesday, / but instead of providing a badly needed <strong>[xxx]</strong>, / it only prolonged the fight. / At issue before the US Court of Appeals for the District of Columbia Circuit / was the latest take of the Federal Communications Commission (FCC) on net neutrality, / adopted on a party-line vote in 2017. / The Republican penned order not only eliminated the strict net neutrality rules / the FCC had adopted when it had a Democratic majority in 2015, / but rejected the commission’s authority / to require broadband providers to do much of anything. / The order also declared / that state and local governments couldn’t regulate broadband providers either.</p>\n<p>然而，这种要求几乎不可能得到满足——部分原因 / 是宽带提供商、反对监管的保守派以及法院的抵制。 / 一家联邦上诉法院周二再次<strong>[xxx]</strong>进来， / 但它没有提供急需的<strong>[xxx]</strong>， / 反而只是延长了争斗。 / 摆在美国哥伦比亚特区巡回上诉法院面前的争议， / 是联邦通信委员会对网络中立性的最新立场， / 该立场于2017年按党派划线的投票中通过。 / 共和党起草的命令不仅取消了严格的网络中立性规则， / 这些规则是联邦通信委员会在2015年民主党占多数时通过的， / 而且否定了该委员会的权力， / 使其几乎不能要求宽带提供商做任何事。 / 这项命令还宣布， / 州政府和地方政府同样不能监管宽带提供商。</p>\n</blockquote>\n<p>要查的是面对这些规则要求时，联邦通信委员会实际作出了什么决定。第二段把要求难以满足的背景与委员会命令的内容接在一起，空格应补委员会的做法。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"37题","raw":"### A. sticks to an out-of-date order\n\n> 坚持一项过时的命令\n\n把A接回题干，它说的是：面对制定网络中立性规则的要求，联邦通信委员会坚持一项过时的命令。\n\nA说坚持旧命令。第2段同时提到2015和2017，我们按时间看新命令对旧规则做了什么。\n\n> The Republican penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission’s authority to require broadband providers to do much of anything.\n\n2015年委员会在民主党占多数时采用严格规则；2017年的新命令却把这些规则取消，还否定了委员会自己的监管权。\n\n所以这不是坚持原来的严格安排，而是通过新的命令撤销它。题干问FCC面对规则要求怎样做，必须分清这两次决定。\n\nA也没有说明所谓过时的命令是哪项，不能把后来法院沿用旧依据的讨论挪来代替这里FCC的动作。\n\n**2017年命令取消2015年严格规则，能说FCC只是坚持旧命令吗？**\n\n不能。原段明确发生了撤销旧规则的新决定。\n\n**第一轮判断：A排除。**","articleRects":[[274,575,1125,38],[202,622,1184,37],[202,668,1195,38],[202,714,1194,38],[202,761,1194,38],[202,806,1194,39],[203,853,1193,38],[202,900,1189,38],[202,946,1194,38],[202,992,1194,38],[202,1039,525,38]],"questionRects":[[280,634,477,30]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"37","paragraphPids":[1]},"html":"<h3>A. sticks to an out-of-date order</h3>\n<blockquote><p>坚持一项过时的命令</p>\n</blockquote>\n<p>把A接回题干，它说的是：面对制定网络中立性规则的要求，联邦通信委员会坚持一项过时的命令。</p>\n<p>A说坚持旧命令。第2段同时提到2015和2017，我们按时间看新命令对旧规则做了什么。</p>\n<blockquote><p>The Republican penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission’s authority to require broadband providers to do much of anything.</p>\n</blockquote>\n<p>2015年委员会在民主党占多数时采用严格规则；2017年的新命令却把这些规则取消，还否定了委员会自己的监管权。</p>\n<p>所以这不是坚持原来的严格安排，而是通过新的命令撤销它。题干问FCC面对规则要求怎样做，必须分清这两次决定。</p>\n<p>A也没有说明所谓过时的命令是哪项，不能把后来法院沿用旧依据的讨论挪来代替这里FCC的动作。</p>\n<p><strong>2017年命令取消2015年严格规则，能说FCC只是坚持旧命令吗？</strong></p>\n<p>不能。原段明确发生了撤销旧规则的新决定。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"37题","raw":"### B. has allowed the states to intervene\n\n> 已允许各州介入\n\n把B接回题干，它说的是：面对制定网络中立性规则的要求，联邦通信委员会已允许各州介入。\n\nB说允许各州介入。第2段末就写`state and local governments couldn’t regulate`，我们看这是谁宣布的。\n\n> The order also declared that state and local governments couldn’t regulate broadband providers either.\n\n宣布各州和地方政府不能监管的是FCC的这项命令。它不仅撤掉自己的规则，还要阻止其他层级监管提供商。\n\nB却说FCC已允许各州介入，与这句`couldn’t`相反。\n\n这里先按委员会自己发出的命令回答，不能把后面法院怎样处理这项禁止，提前当成FCC主动允许的结果。\n\n**FCC命令说州和地方政府不能监管，等于它允许各州介入吗？**\n\n不等于。B把明说的禁止写成了许可。\n\n**第一轮判断：B排除。**","articleRects":[[274,575,1125,38],[202,622,1184,37],[202,668,1195,38],[202,714,1194,38],[202,761,1194,38],[202,806,1194,39],[203,853,1193,38],[202,900,1189,38],[202,946,1194,38],[202,992,1194,38],[202,1039,525,38]],"questionRects":[[280,697,551,31]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"37","paragraphPids":[1]},"html":"<h3>B. has allowed the states to intervene</h3>\n<blockquote><p>已允许各州介入</p>\n</blockquote>\n<p>把B接回题干，它说的是：面对制定网络中立性规则的要求，联邦通信委员会已允许各州介入。</p>\n<p>B说允许各州介入。第2段末就写<code>state and local governments couldn’t regulate</code>，我们看这是谁宣布的。</p>\n<blockquote><p>The order also declared that state and local governments couldn’t regulate broadband providers either.</p>\n</blockquote>\n<p>宣布各州和地方政府不能监管的是FCC的这项命令。它不仅撤掉自己的规则，还要阻止其他层级监管提供商。</p>\n<p>B却说FCC已允许各州介入，与这句<code>couldn’t</code>相反。</p>\n<p>这里先按委员会自己发出的命令回答，不能把后面法院怎样处理这项禁止，提前当成FCC主动允许的结果。</p>\n<p><strong>FCC命令说州和地方政府不能监管，等于它允许各州介入吗？</strong></p>\n<p>不等于。B把明说的禁止写成了许可。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"37题","raw":"### C. has issued a special resolution\n\n> 已经发布一项特别决议\n\n把C接回题干，它说的是：面对制定网络中立性规则的要求，联邦通信委员会已经发布一项特别决议。\n\nC说发布特别决议。第2段确实写2017年经过投票的`order`，我们先确认是否存在正式决定。\n\n> the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017.\n\n> The Republican penned order not only eliminated the strict net neutrality rules\n\n原文说委员会按党派投票通过新安排，并用`order`称它。若把C的`resolution`宽泛理解成正式决议，确实可以说委员会作出了这样一项决定。\n\n不过，题干还有面对网络中立规则的要求这一前提。光说发布了决定，还不知道它是建立规则还是取消规则。\n\n所以C先保留，但要与D比较具体内容。不能只因都是正式文件，就把委员会怎样回应公众要求这一点漏掉。\n\n**原文确实有投票通过的命令，C作为作出正式决定的描述能否先考虑？**\n\n可以先考虑。它是否足以回答委员会面对监管要求的回应，还需与D比较。\n\n**第一轮判断：C保留。**","articleRects":[[274,575,1125,38],[202,622,1184,37],[202,668,1195,38],[202,714,1194,38],[202,761,1194,38],[202,806,1194,39],[203,853,1193,38],[202,900,1189,38],[202,946,1194,38],[202,992,1194,38],[202,1039,525,38]],"questionRects":[[280,757,489,46]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"37","paragraphPids":[1]},"html":"<h3>C. has issued a special resolution</h3>\n<blockquote><p>已经发布一项特别决议</p>\n</blockquote>\n<p>把C接回题干，它说的是：面对制定网络中立性规则的要求，联邦通信委员会已经发布一项特别决议。</p>\n<p>C说发布特别决议。第2段确实写2017年经过投票的<code>order</code>，我们先确认是否存在正式决定。</p>\n<blockquote><p>the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017.</p>\n</blockquote>\n<blockquote><p>The Republican penned order not only eliminated the strict net neutrality rules</p>\n</blockquote>\n<p>原文说委员会按党派投票通过新安排，并用<code>order</code>称它。若把C的<code>resolution</code>宽泛理解成正式决议，确实可以说委员会作出了这样一项决定。</p>\n<p>不过，题干还有面对网络中立规则的要求这一前提。光说发布了决定，还不知道它是建立规则还是取消规则。</p>\n<p>所以C先保留，但要与D比较具体内容。不能只因都是正式文件，就把委员会怎样回应公众要求这一点漏掉。</p>\n<p><strong>原文确实有投票通过的命令，C作为作出正式决定的描述能否先考虑？</strong></p>\n<p>可以先考虑。它是否足以回答委员会面对监管要求的回应，还需与D比较。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"37题","raw":"### D. takes an anti-regulatory stance\n\n> 采取反对监管的立场\n\n把D接回题干，它说的是：面对制定网络中立性规则的要求，联邦通信委员会采取反对监管的立场。\n\nD说反监管。第2段的命令连续做了三件事，我们分别看它对规则、自己的权限和州的权限怎样处理。\n\n> not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission’s authority to require broadband providers to do much of anything.\n\n> state and local governments couldn’t regulate broadband providers either.\n\n它取消2015年的严格网络中立规则，否定委员会要求提供商采取行动的权限，又宣布州和地方也不能监管。\n\n三项都不是在加强约束提供商，而是在减少或阻止这种约束。D的`anti-regulatory`正把这些动作放在一起概括。\n\n题干问面对制定规则的要求，委员会的回应却是撤规则、撤权限，D能把这个反向回应说出来。\n\n**取消规则、否定自身监管权限并阻止州监管，这三件事是否共同表现出反监管立场？**\n\n是。D对应命令的具体内容，先留下。\n\n**第一轮判断：D保留。**","articleRects":[[274,575,1125,38],[202,622,1184,37],[202,668,1195,38],[202,714,1194,38],[202,761,1194,38],[202,806,1194,39],[203,853,1193,38],[202,900,1189,38],[202,946,1194,38],[202,992,1194,38],[202,1039,525,38]],"questionRects":[[280,824,494,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"37","paragraphPids":[1]},"html":"<h3>D. takes an anti-regulatory stance</h3>\n<blockquote><p>采取反对监管的立场</p>\n</blockquote>\n<p>把D接回题干，它说的是：面对制定网络中立性规则的要求，联邦通信委员会采取反对监管的立场。</p>\n<p>D说反监管。第2段的命令连续做了三件事，我们分别看它对规则、自己的权限和州的权限怎样处理。</p>\n<blockquote><p>not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission’s authority to require broadband providers to do much of anything.</p>\n</blockquote>\n<blockquote><p>state and local governments couldn’t regulate broadband providers either.</p>\n</blockquote>\n<p>它取消2015年的严格网络中立规则，否定委员会要求提供商采取行动的权限，又宣布州和地方也不能监管。</p>\n<p>三项都不是在加强约束提供商，而是在减少或阻止这种约束。D的<code>anti-regulatory</code>正把这些动作放在一起概括。</p>\n<p>题干问面对制定规则的要求，委员会的回应却是撤规则、撤权限，D能把这个反向回应说出来。</p>\n<p><strong>取消规则、否定自身监管权限并阻止州监管，这三件事是否共同表现出反监管立场？</strong></p>\n<p>是。D对应命令的具体内容，先留下。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"37题","raw":"### 37题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D保留。\n\n暂时保留：C、D。\n\n第一遍留下C、D。C可以宽泛概括投票通过并形成命令这件事；D则能接上命令取消规则、否定监管权力的具体内容。","articleRects":[],"questionRects":[[226,570,888,38],[280,634,477,30],[280,697,551,31],[280,757,489,46],[280,824,494,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"37"},"html":"<h3>37题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D保留。</li></ul>\n<p>暂时保留：C、D。</p>\n<p>第一遍留下C、D。C可以宽泛概括投票通过并形成命令这件事；D则能接上命令取消规则、否定监管权力的具体内容。</p>\n"},{"section":"38题","raw":"## 38题\n\n> What can be learned about AT&T from Paragraph 3?  \n> 从第三段可以了解美国电话电报公司的什么情况？\n\n题干明确指定Paragraph 3，并点名AT&T，直接完整阅读第三段，检查这家公司出现的位置以及它被用来说明的行为。\n\n> 原文参考：\n> \n> The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing **[xxx]** like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals’ streaming services but not their own.\n> \n> 开始精读：\n> \n> The commission argued that other agencies would protect against anti-competitive behavior, / such as a broadband-providing **[xxx]** like AT&T / favoring its own video-streaming service / at the expense of Netflix and Apple TV. / Yet the FCC also ended the investigations of broadband providers / that imposed data caps on their rivals’ streaming services but not their own.\n> \n> 该委员会主张，其他机构会防范反竞争行为， / 例如像美国电话电报公司这样提供宽带的**[xxx]**， / 优待自己的视频流媒体服务， / 以牺牲奈飞和苹果电视服务的利益为代价。 / 然而，联邦通信委员会也终止了对宽带提供商的调查， / 这些提供商对竞争对手的流媒体服务设置数据流量上限，却不对自己的服务设限。\n\n题目要查第三段对于这家公司给出了什么信息。先分清委员会的主张、公司例子所展示的做法，以及紧接着的调查情况，再判断选项能否由这些句子推出。\n\n接下来按A—D逐项看。","articleRects":[[273,1085,1123,38],[202,1132,1194,37],[202,1178,1184,38],[202,1224,1194,38],[202,1271,917,37]],"questionRects":[[226,951,834,38],[280,1014,533,38],[280,1078,562,38],[280,1141,594,38],[280,1205,630,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"38","initialReadingPids":[2]},"html":"<h2>38题</h2>\n<blockquote><p>What can be learned about AT&amp;T from Paragraph 3?<br />\n从第三段可以了解美国电话电报公司的什么情况？</p>\n</blockquote>\n<p>题干明确指定Paragraph 3，并点名AT&amp;T，直接完整阅读第三段，检查这家公司出现的位置以及它被用来说明的行为。</p>\n<blockquote><p>原文参考：</p>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing <strong>[xxx]</strong> like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV. Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals’ streaming services but not their own.</p>\n<p>开始精读：</p>\n<p>The commission argued that other agencies would protect against anti-competitive behavior, / such as a broadband-providing <strong>[xxx]</strong> like AT&amp;T / favoring its own video-streaming service / at the expense of Netflix and Apple TV. / Yet the FCC also ended the investigations of broadband providers / that imposed data caps on their rivals’ streaming services but not their own.</p>\n<p>该委员会主张，其他机构会防范反竞争行为， / 例如像美国电话电报公司这样提供宽带的<strong>[xxx]</strong>， / 优待自己的视频流媒体服务， / 以牺牲奈飞和苹果电视服务的利益为代价。 / 然而，联邦通信委员会也终止了对宽带提供商的调查， / 这些提供商对竞争对手的流媒体服务设置数据流量上限，却不对自己的服务设限。</p>\n</blockquote>\n<p>题目要查第三段对于这家公司给出了什么信息。先分清委员会的主张、公司例子所展示的做法，以及紧接着的调查情况，再判断选项能否由这些句子推出。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"38题","raw":"### A. It is in pursuit of quality service.\n\n> 它在追求优质服务。\n\n把A接回题干，它说的是：第三段表明，美国电话电报公司在追求优质服务。\n\nA说AT&T追求优质服务。第3段说它`favoring its own video-streaming service at the expense of`对手，我们看优待与优质是不是一样。\n\n> such as a broadband-providing **[xxx]** like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV.\n\n优待自家服务，是让自己的业务在宽带网络中更占便宜；`at the expense of`还说明Netflix和Apple TV因此吃亏。\n\n这并没有说AT&T提高了画质、稳定性或顾客体验。受到优待的是服务在竞争中的待遇，不是服务质量变高。\n\nA把给自己优势写成追求好质量，忽略了作者把它列为反竞争行为的例子。\n\n**自家流媒体被偏袒、对手受到损害，是否证明公司在提升服务质量？**\n\n没有。A把竞争待遇与服务品质混在一起。\n\n**第一轮判断：A排除。**","articleRects":[[273,1085,1123,38],[202,1132,1194,37],[202,1178,1184,38],[202,1224,1194,38],[202,1271,917,37]],"questionRects":[[280,1014,533,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"38","paragraphPids":[2]},"html":"<h3>A. It is in pursuit of quality service.</h3>\n<blockquote><p>它在追求优质服务。</p>\n</blockquote>\n<p>把A接回题干，它说的是：第三段表明，美国电话电报公司在追求优质服务。</p>\n<p>A说AT&amp;T追求优质服务。第3段说它<code>favoring its own video-streaming service at the expense of</code>对手，我们看优待与优质是不是一样。</p>\n<blockquote><p>such as a broadband-providing <strong>[xxx]</strong> like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV.</p>\n</blockquote>\n<p>优待自家服务，是让自己的业务在宽带网络中更占便宜；<code>at the expense of</code>还说明Netflix和Apple TV因此吃亏。</p>\n<p>这并没有说AT&amp;T提高了画质、稳定性或顾客体验。受到优待的是服务在竞争中的待遇，不是服务质量变高。</p>\n<p>A把给自己优势写成追求好质量，忽略了作者把它列为反竞争行为的例子。</p>\n<p><strong>自家流媒体被偏袒、对手受到损害，是否证明公司在提升服务质量？</strong></p>\n<p>没有。A把竞争待遇与服务品质混在一起。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"38题","raw":"### B. It is under the FCC’s investigation.\n\n> 它正在接受联邦通信委员会的调查。\n\n把B接回题干，它说的是：第三段表明，美国电话电报公司正在接受联邦通信委员会的调查。\n\nB说AT&T正在接受FCC调查。第3段末有调查，我们看动词是继续还是`ended`。\n\n> Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals’ streaming services but not their own.\n\nFCC结束了对一些提供商的调查，这些提供商限制竞争对手流媒体的数据用量，却不限制自己的。\n\n原文没有在这里明确把每一家被查者都点名为AT&T；即使将AT&T与这种做法联系起来，时间也已经是调查被结束。\n\nB的`is under`表示正受调查，与`ended`不合。不能只见到调查一词，就忽略它已停止。\n\n**原文说FCC结束调查，能接成AT&T现在仍在这项调查之中吗？**\n\n不能。B把已经结束写成正在进行，也没有明确的点名依据。\n\n**第一轮判断：B排除。**","articleRects":[[273,1085,1123,38],[202,1132,1194,37],[202,1178,1184,38],[202,1224,1194,38],[202,1271,917,37]],"questionRects":[[280,1078,562,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"38","paragraphPids":[2]},"html":"<h3>B. It is under the FCC’s investigation.</h3>\n<blockquote><p>它正在接受联邦通信委员会的调查。</p>\n</blockquote>\n<p>把B接回题干，它说的是：第三段表明，美国电话电报公司正在接受联邦通信委员会的调查。</p>\n<p>B说AT&amp;T正在接受FCC调查。第3段末有调查，我们看动词是继续还是<code>ended</code>。</p>\n<blockquote><p>Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals’ streaming services but not their own.</p>\n</blockquote>\n<p>FCC结束了对一些提供商的调查，这些提供商限制竞争对手流媒体的数据用量，却不限制自己的。</p>\n<p>原文没有在这里明确把每一家被查者都点名为AT&amp;T；即使将AT&amp;T与这种做法联系起来，时间也已经是调查被结束。</p>\n<p>B的<code>is under</code>表示正受调查，与<code>ended</code>不合。不能只见到调查一词，就忽略它已停止。</p>\n<p><strong>原文说FCC结束调查，能接成AT&amp;T现在仍在这项调查之中吗？</strong></p>\n<p>不能。B把已经结束写成正在进行，也没有明确的点名依据。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"38题","raw":"### C. It protects against unfair competition.\n\n> 它防范不公平竞争。\n\n把C接回题干，它说的是：第三段表明，美国电话电报公司防范不公平竞争。\n\nC说AT&T防范不公平竞争。第3段先说`other agencies would protect`，后面才以`such as`举AT&T，我们把主语分开。\n\n> The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing **[xxx]** like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV.\n\n防范反竞争行为的，是FCC声称会承担这件事的其他机构。AT&T则被举作可能优待自家流媒体、使对手受损的宽带提供商。\n\n因此，一方是要监管的人，另一方是行为可能受监管的公司。C把防范职责移到了例子中的公司身上。\n\n原句不是说AT&T帮助阻止不公平，而是用它说明何种不公平行为需要被阻止。\n\n**原文说要防范反竞争的是其他机构，还是举例中的AT&T？**\n\n是其他机构。C把防范者和被举出的行为实施者换了。\n\n**第一轮判断：C排除。**","articleRects":[[273,1085,1123,38],[202,1132,1194,37],[202,1178,1184,38],[202,1224,1194,38],[202,1271,917,37]],"questionRects":[[280,1141,594,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"38","paragraphPids":[2]},"html":"<h3>C. It protects against unfair competition.</h3>\n<blockquote><p>它防范不公平竞争。</p>\n</blockquote>\n<p>把C接回题干，它说的是：第三段表明，美国电话电报公司防范不公平竞争。</p>\n<p>C说AT&amp;T防范不公平竞争。第3段先说<code>other agencies would protect</code>，后面才以<code>such as</code>举AT&amp;T，我们把主语分开。</p>\n<blockquote><p>The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing <strong>[xxx]</strong> like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV.</p>\n</blockquote>\n<p>防范反竞争行为的，是FCC声称会承担这件事的其他机构。AT&amp;T则被举作可能优待自家流媒体、使对手受损的宽带提供商。</p>\n<p>因此，一方是要监管的人，另一方是行为可能受监管的公司。C把防范职责移到了例子中的公司身上。</p>\n<p>原句不是说AT&amp;T帮助阻止不公平，而是用它说明何种不公平行为需要被阻止。</p>\n<p><strong>原文说要防范反竞争的是其他机构，还是举例中的AT&amp;T？</strong></p>\n<p>是其他机构。C把防范者和被举出的行为实施者换了。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"38题","raw":"### D. It engages in anti-competitive **[xxx]**.\n\n> 它从事反竞争的**[xxx]**。\n\n把D接回题干，它说的是：第三段表明，美国电话电报公司从事反竞争的**[xxx]**。\n\nD最后一个词被挡住，但`engages in anti-competitive`已能读懂。原文直接把AT&T放在`anti-competitive behavior, such as`后面。\n\n> other agencies would protect against anti-competitive behavior, such as a broadband-providing **[xxx]** like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV.\n\n`such as`后说AT&T优待自己的流媒体，让Netflix和Apple TV付出代价。这就是前面反竞争行为的具体例子。\n\n后句对竞争对手设数据上限、对自己不设，也把差别待遇怎样影响竞争讲得更清楚。\n\n因此，不必填出D的遮挡词，也能确认它已知的“从事反竞争……”与原文举例方向相合。\n\n**AT&T被放在反竞争行为的例子里，并被写成优待自己、损害对手，能否支持D已知部分？**\n\n能。D与该例直接对应，遮挡词仍不补译。\n\n**第一轮判断：D保留。**","articleRects":[[273,1085,1123,38],[202,1132,1194,37],[202,1178,1184,38],[202,1224,1194,38],[202,1271,917,37]],"questionRects":[[280,1205,630,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"38","paragraphPids":[2]},"html":"<h3>D. It engages in anti-competitive <strong>[xxx]</strong>.</h3>\n<blockquote><p>它从事反竞争的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把D接回题干，它说的是：第三段表明，美国电话电报公司从事反竞争的<strong>[xxx]</strong>。</p>\n<p>D最后一个词被挡住，但<code>engages in anti-competitive</code>已能读懂。原文直接把AT&amp;T放在<code>anti-competitive behavior, such as</code>后面。</p>\n<blockquote><p>other agencies would protect against anti-competitive behavior, such as a broadband-providing <strong>[xxx]</strong> like AT&amp;T favoring its own video-streaming service at the expense of Netflix and Apple TV.</p>\n</blockquote>\n<p><code>such as</code>后说AT&amp;T优待自己的流媒体，让Netflix和Apple TV付出代价。这就是前面反竞争行为的具体例子。</p>\n<p>后句对竞争对手设数据上限、对自己不设，也把差别待遇怎样影响竞争讲得更清楚。</p>\n<p>因此，不必填出D的遮挡词，也能确认它已知的“从事反竞争……”与原文举例方向相合。</p>\n<p><strong>AT&amp;T被放在反竞争行为的例子里，并被写成优待自己、损害对手，能否支持D已知部分？</strong></p>\n<p>能。D与该例直接对应，遮挡词仍不补译。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"38题","raw":"### 38题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。第三段明确把这家公司优待自身服务的做法列为反竞争行为的例子；选项中的**[xxx]**仍保留原样。","articleRects":[],"questionRects":[[226,951,834,38],[280,1014,533,38],[280,1078,562,38],[280,1141,594,38],[280,1205,630,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"38"},"html":"<h3>38题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。第三段明确把这家公司优待自身服务的做法列为反竞争行为的例子；选项中的<strong>[xxx]</strong>仍保留原样。</p>\n"},{"section":"39题","raw":"## 39题\n\n> Judge Patricia Millett argues that the appeals court’s decision ______.  \n> 帕特里夏·米利特法官认为，上诉法院的决定怎么样？\n\n题干点名Judge Patricia Millett，第四段直接出现她的名字以及argued和said，先把这一段完整读完，分清法院的决定与她对决定的评价。\n\n> 原文参考：\n> \n> On Tuesday, the appeals court **[xxx]** upheld the 2017 order deregulating broadband providers, citing a Supreme Court **[xxx]** from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a **[xxx]** opinion that “the result is unhinged from the realities of modern broadband service,” and said Congress or the Supreme Court could intervene to “avoid trapping internet regulation in technological **[xxx]**.”\n> \n> 开始精读：\n> \n> On Tuesday, / the appeals court **[xxx]** upheld the 2017 order deregulating broadband providers, / citing a Supreme Court **[xxx]** from 2005 / that upheld a similarly deregulatory move. / But Judge Patricia Millett rightly argued in a **[xxx]** opinion / that “the result is unhinged from the realities of modern broadband service,” / and said Congress or the Supreme Court could intervene / to “avoid trapping internet regulation in technological **[xxx]**.”\n> \n> 周二， / 上诉法院**[xxx]**维持了2017年对宽带提供商放松监管的命令， / 援引了最高法院在2005年的一个**[xxx]**， / 它曾维持一项类似的放松监管举措。 / 但帕特里夏·米利特法官在一份**[xxx]**意见中正确地主张， / “这个结果脱离了现代宽带服务的现实”， / 并表示国会或最高法院可以介入， / 以“避免把互联网监管困在技术上的**[xxx]**之中”。\n\n空格要补米利特法官怎样评价上诉法院的决定。第四段先交代法院维持命令所援引的依据，再引出她的意见，需要把评价接回法院的结果。\n\n接下来按A—D逐项看。","articleRects":[[274,1317,1123,38],[202,1363,1194,38],[202,1410,1194,37],[203,1455,1193,39],[202,1501,1194,39],[204,1547,977,40]],"questionRects":[[226,1331,954,38],[1186,1363,104,7],[280,1395,510,38],[280,1458,442,38],[280,1522,524,38],[280,1585,360,30]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"39","initialReadingPids":[3]},"html":"<h2>39题</h2>\n<blockquote><p>Judge Patricia Millett argues that the appeals court’s decision ______.<br />\n帕特里夏·米利特法官认为，上诉法院的决定怎么样？</p>\n</blockquote>\n<p>题干点名Judge Patricia Millett，第四段直接出现她的名字以及argued和said，先把这一段完整读完，分清法院的决定与她对决定的评价。</p>\n<blockquote><p>原文参考：</p>\n<p>On Tuesday, the appeals court <strong>[xxx]</strong> upheld the 2017 order deregulating broadband providers, citing a Supreme Court <strong>[xxx]</strong> from 2005 that upheld a similarly deregulatory move. But Judge Patricia Millett rightly argued in a <strong>[xxx]</strong> opinion that “the result is unhinged from the realities of modern broadband service,” and said Congress or the Supreme Court could intervene to “avoid trapping internet regulation in technological <strong>[xxx]</strong>.”</p>\n<p>开始精读：</p>\n<p>On Tuesday, / the appeals court <strong>[xxx]</strong> upheld the 2017 order deregulating broadband providers, / citing a Supreme Court <strong>[xxx]</strong> from 2005 / that upheld a similarly deregulatory move. / But Judge Patricia Millett rightly argued in a <strong>[xxx]</strong> opinion / that “the result is unhinged from the realities of modern broadband service,” / and said Congress or the Supreme Court could intervene / to “avoid trapping internet regulation in technological <strong>[xxx]</strong>.”</p>\n<p>周二， / 上诉法院<strong>[xxx]</strong>维持了2017年对宽带提供商放松监管的命令， / 援引了最高法院在2005年的一个<strong>[xxx]</strong>， / 它曾维持一项类似的放松监管举措。 / 但帕特里夏·米利特法官在一份<strong>[xxx]</strong>意见中正确地主张， / “这个结果脱离了现代宽带服务的现实”， / 并表示国会或最高法院可以介入， / 以“避免把互联网监管困在技术上的<strong>[xxx]</strong>之中”。</p>\n</blockquote>\n<p>空格要补米利特法官怎样评价上诉法院的决定。第四段先交代法院维持命令所援引的依据，再引出她的意见，需要把评价接回法院的结果。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"39题","raw":"### A. conveys an ambiguous message\n\n> 传达了含糊不清的信息\n\n把A接回题干，它说的是：米利特法官认为上诉法院的决定传达了含糊不清的信息。\n\nA说决定含糊。法官说的是`unhinged from the realities`，我们看她批评的是表达不清，还是没有贴合现代宽带。\n\n> “the result is unhinged from the realities of modern broadband service,”\n\n法院维持放松监管的命令，这个处理结果本身明确。米利特批评它与现代宽带服务的现实脱节。\n\nA若说信息含糊，就要结果让人不知道到底许可还是禁止什么。原句没有说读不懂法院决定，而是说决定不符合今天的服务状况。\n\n判得不合现实和说得不清楚不能互换。她知道这个裁决在做什么，正因此才指出它不适合现代宽带。\n\n**法官说结果脱离现代宽带现实，是指结果让人看不懂吗？**\n\n不是。A把现实不相符改成了信息不明确。\n\n**第一轮判断：A排除。**","articleRects":[[274,1317,1123,38],[202,1363,1194,38],[202,1410,1194,37],[203,1455,1193,39],[202,1501,1194,39],[204,1547,977,40]],"questionRects":[[280,1395,510,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"39","paragraphPids":[3]},"html":"<h3>A. conveys an ambiguous message</h3>\n<blockquote><p>传达了含糊不清的信息</p>\n</blockquote>\n<p>把A接回题干，它说的是：米利特法官认为上诉法院的决定传达了含糊不清的信息。</p>\n<p>A说决定含糊。法官说的是<code>unhinged from the realities</code>，我们看她批评的是表达不清，还是没有贴合现代宽带。</p>\n<blockquote><p>“the result is unhinged from the realities of modern broadband service,”</p>\n</blockquote>\n<p>法院维持放松监管的命令，这个处理结果本身明确。米利特批评它与现代宽带服务的现实脱节。</p>\n<p>A若说信息含糊，就要结果让人不知道到底许可还是禁止什么。原句没有说读不懂法院决定，而是说决定不符合今天的服务状况。</p>\n<p>判得不合现实和说得不清楚不能互换。她知道这个裁决在做什么，正因此才指出它不适合现代宽带。</p>\n<p><strong>法官说结果脱离现代宽带现实，是指结果让人看不懂吗？</strong></p>\n<p>不是。A把现实不相符改成了信息不明确。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"39题","raw":"### B. is out of touch with reality\n\n> 脱离现实\n\n把B接回题干，它说的是：米利特法官认为上诉法院的决定脱离现实。\n\nB说脱离现实。法官引语里有`the result is unhinged from the realities of modern broadband service`，我们直接对照。\n\n> “the result is unhinged from the realities of modern broadband service,”\n\n`the result`就是法院维持2017年命令的结果；后面说它与现代宽带服务的现实脱开。\n\nB的`out of touch with reality`同样说没有与现实状况接上。它没有把评价对象换成某位法官的生活，也没有说法院表达含糊。\n\n随后要求国会或最高法院介入，也是因为旧处理方式无法妥善面对如今的技术，和B这份批评一致。\n\n**与现代宽带服务的现实脱节，是否就是B的`out of touch with reality`？**\n\n是。两者对决定作的是同一评价。\n\n**第一轮判断：B保留。**","articleRects":[[274,1317,1123,38],[202,1363,1194,38],[202,1410,1194,37],[203,1455,1193,39],[202,1501,1194,39],[204,1547,977,40]],"questionRects":[[280,1458,442,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"39","paragraphPids":[3]},"html":"<h3>B. is out of touch with reality</h3>\n<blockquote><p>脱离现实</p>\n</blockquote>\n<p>把B接回题干，它说的是：米利特法官认为上诉法院的决定脱离现实。</p>\n<p>B说脱离现实。法官引语里有<code>the result is unhinged from the realities of modern broadband service</code>，我们直接对照。</p>\n<blockquote><p>“the result is unhinged from the realities of modern broadband service,”</p>\n</blockquote>\n<p><code>the result</code>就是法院维持2017年命令的结果；后面说它与现代宽带服务的现实脱开。</p>\n<p>B的<code>out of touch with reality</code>同样说没有与现实状况接上。它没有把评价对象换成某位法官的生活，也没有说法院表达含糊。</p>\n<p>随后要求国会或最高法院介入，也是因为旧处理方式无法妥善面对如今的技术，和B这份批评一致。</p>\n<p><strong>与现代宽带服务的现实脱节，是否就是B的<code>out of touch with reality</code>？</strong></p>\n<p>是。两者对决定作的是同一评价。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"39题","raw":"### C. is at odds with its earlier rulings\n\n> 与该法院此前的裁决相冲突\n\n把C接回题干，它说的是：米利特法官认为上诉法院的决定与该法院此前的裁决相冲突。\n\nC说与法院先前裁决冲突。第4段出现2005年，我们看法院引用它是为支持现在决定，还是承认两次决定矛盾。\n\n> citing a Supreme Court **[xxx]** from 2005 that upheld a similarly deregulatory move.\n\n> “the result is unhinged from the realities of modern broadband service,”\n\n上诉法院引用2005年最高法院的依据，那次也支持类似的放松监管举措。这是在寻找相似的既有依据。\n\n米利特随后批评的是现实已经不同，结果脱离现代宽带，而不是两项裁决在文字上相反。\n\nC还把较早的最高法院依据写成“该上诉法院此前裁决”。无论对象还是冲突关系，都不是原段给出的。\n\n**法院用较早的类似放松监管依据支持现在决定，能读成米利特批评它与该法院旧裁决相冲突吗？**\n\n不能。她指出的是与现代现实脱节，原文并未写这类前后裁决冲突。\n\n**第一轮判断：C排除。**","articleRects":[[274,1317,1123,38],[202,1363,1194,38],[202,1410,1194,37],[203,1455,1193,39],[202,1501,1194,39],[204,1547,977,40]],"questionRects":[[280,1522,524,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"39","paragraphPids":[3]},"html":"<h3>C. is at odds with its earlier rulings</h3>\n<blockquote><p>与该法院此前的裁决相冲突</p>\n</blockquote>\n<p>把C接回题干，它说的是：米利特法官认为上诉法院的决定与该法院此前的裁决相冲突。</p>\n<p>C说与法院先前裁决冲突。第4段出现2005年，我们看法院引用它是为支持现在决定，还是承认两次决定矛盾。</p>\n<blockquote><p>citing a Supreme Court <strong>[xxx]</strong> from 2005 that upheld a similarly deregulatory move.</p>\n</blockquote>\n<blockquote><p>“the result is unhinged from the realities of modern broadband service,”</p>\n</blockquote>\n<p>上诉法院引用2005年最高法院的依据，那次也支持类似的放松监管举措。这是在寻找相似的既有依据。</p>\n<p>米利特随后批评的是现实已经不同，结果脱离现代宽带，而不是两项裁决在文字上相反。</p>\n<p>C还把较早的最高法院依据写成“该上诉法院此前裁决”。无论对象还是冲突关系，都不是原段给出的。</p>\n<p><strong>法院用较早的类似放松监管依据支持现在决定，能读成米利特批评它与该法院旧裁决相冲突吗？</strong></p>\n<p>不能。她指出的是与现代现实脱节，原文并未写这类前后裁决冲突。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"39题","raw":"### D. focuses on trivialities\n\n> 关注琐碎事项\n\n把D接回题干，它说的是：米利特法官认为上诉法院的决定关注琐碎事项。\n\nD说关注琐事。原文法官提到现代宽带现实和互联网监管，我们看她是否嫌法院管了不重要的小问题。\n\n> “the result is unhinged from the realities of modern broadband service,”\n\n> Congress or the Supreme Court could intervene to “avoid trapping internet regulation in technological **[xxx]**.”\n\n她认为监管结果没有贴合现代宽带服务，希望国会或最高法院介入，避免监管被旧技术认识困住。\n\n这反而把问题视为需要高层机构处理的事情。原句没有说法院关注了鸡毛蒜皮的小细节，也没有把争议说成无关紧要。\n\nD用琐碎与重大来评价，法官实际比较的却是现有决定与今天服务现实能否相符。\n\n**法官要求国会或最高法院介入现代监管难题，是在批评法院只管琐事吗？**\n\n不是。她批评的是决定脱离现实，D换了批评内容。\n\n**第一轮判断：D排除。**","articleRects":[[274,1317,1123,38],[202,1363,1194,38],[202,1410,1194,37],[203,1455,1193,39],[202,1501,1194,39],[204,1547,977,40]],"questionRects":[[280,1585,360,30]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"39","paragraphPids":[3]},"html":"<h3>D. focuses on trivialities</h3>\n<blockquote><p>关注琐碎事项</p>\n</blockquote>\n<p>把D接回题干，它说的是：米利特法官认为上诉法院的决定关注琐碎事项。</p>\n<p>D说关注琐事。原文法官提到现代宽带现实和互联网监管，我们看她是否嫌法院管了不重要的小问题。</p>\n<blockquote><p>“the result is unhinged from the realities of modern broadband service,”</p>\n</blockquote>\n<blockquote><p>Congress or the Supreme Court could intervene to “avoid trapping internet regulation in technological <strong>[xxx]</strong>.”</p>\n</blockquote>\n<p>她认为监管结果没有贴合现代宽带服务，希望国会或最高法院介入，避免监管被旧技术认识困住。</p>\n<p>这反而把问题视为需要高层机构处理的事情。原句没有说法院关注了鸡毛蒜皮的小细节，也没有把争议说成无关紧要。</p>\n<p>D用琐碎与重大来评价，法官实际比较的却是现有决定与今天服务现实能否相符。</p>\n<p><strong>法官要求国会或最高法院介入现代监管难题，是在批评法院只管琐事吗？</strong></p>\n<p>不是。她批评的是决定脱离现实，D换了批评内容。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"39题","raw":"### 39题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n第一遍留下B。法官直接说法院结果脱离现代宽带服务的现实。","articleRects":[],"questionRects":[[226,1331,954,38],[1186,1363,104,7],[280,1395,510,38],[280,1458,442,38],[280,1522,524,38],[280,1585,360,30]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"39"},"html":"<h3>39题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一遍留下B。法官直接说法院结果脱离现代宽带服务的现实。</p>\n"},{"section":"40题","raw":"## 40题\n\n> What does the author argue in the last paragraph?  \n> 作者在最后一段主张什么？\n\n题干明确指定last paragraph，直接完整阅读第六段，注意作者把行动要求交给谁，以及希望采取什么行动。\n\n> 原文参考：\n> \n> The endless legal battles and **[xxx]** at the FCC cry out for Congress to act. It needs to give the commission **[xxx]** authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.\n> \n> 开始精读：\n> \n> The endless legal battles and **[xxx]** at the FCC / cry out for Congress to act. / It needs to give the commission **[xxx]** authority once and for all / to bar broadband providers from meddling in the traffic on their network / and to create clear rules protecting openness and innovation online.\n> \n> 无休止的法律争斗以及联邦通信委员会的**[xxx]**， / 迫切要求国会采取行动。 / 国会需要一劳永逸地赋予该委员会**[xxx]**权力， / 以禁止宽带提供商干预其网络上的流量， / 并制定保护网络开放与创新的明确规则。\n\n题目要的是末段主张。末段从持续的争斗引出行动要求，再用It needs to说明所需行动，要把执行者、授权对象与规则目的连起来判断。\n\n接下来按A—D逐项看。","articleRects":[[273,1827,1123,37],[202,1873,1195,38],[202,1920,1194,37],[202,1966,786,38]],"questionRects":[[225,1712,790,38],[281,1775,757,38],[280,1839,751,38],[280,1902,839,38],[280,1965,761,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"40","initialReadingPids":[5]},"html":"<h2>40题</h2>\n<blockquote><p>What does the author argue in the last paragraph?<br />\n作者在最后一段主张什么？</p>\n</blockquote>\n<p>题干明确指定last paragraph，直接完整阅读第六段，注意作者把行动要求交给谁，以及希望采取什么行动。</p>\n<blockquote><p>原文参考：</p>\n<p>The endless legal battles and <strong>[xxx]</strong> at the FCC cry out for Congress to act. It needs to give the commission <strong>[xxx]</strong> authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n<p>开始精读：</p>\n<p>The endless legal battles and <strong>[xxx]</strong> at the FCC / cry out for Congress to act. / It needs to give the commission <strong>[xxx]</strong> authority once and for all / to bar broadband providers from meddling in the traffic on their network / and to create clear rules protecting openness and innovation online.</p>\n<p>无休止的法律争斗以及联邦通信委员会的<strong>[xxx]</strong>， / 迫切要求国会采取行动。 / 国会需要一劳永逸地赋予该委员会<strong>[xxx]</strong>权力， / 以禁止宽带提供商干预其网络上的流量， / 并制定保护网络开放与创新的明确规则。</p>\n</blockquote>\n<p>题目要的是末段主张。末段从持续的争斗引出行动要求，再用It needs to说明所需行动，要把执行者、授权对象与规则目的连起来判断。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"40题","raw":"### A. Broadband providers’ rights should be protected.\n\n> 宽带提供商的权利应当得到保护。\n\n把A接回题干，它说的是：作者在末段主张保护宽带提供商的权利。\n\nA说保护宽带提供商的权利。末段同时有提供商和`protecting`，我们看保护一词直接接着什么。\n\n> to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.\n\n作者要求禁止提供商干预自身网络中的流量，再建立清楚规则，保护的是网上开放与创新。\n\n提供商在这里是要受到约束的一方，开放创新才是要保存的东西。A把这两方的位置调了过来。\n\n原段没有提出让提供商免受规则干预或获得更多权利，反而要求给监管机构权力约束它们。\n\n**原文明说要保护的是网络开放创新，还是宽带提供商自行处置流量的权利？**\n\n是开放创新。A换了保护对象。\n\n**第一轮判断：A排除。**","articleRects":[[273,1827,1123,37],[202,1873,1195,38],[202,1920,1194,37],[202,1966,786,38]],"questionRects":[[281,1775,757,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"40","paragraphPids":[5]},"html":"<h3>A. Broadband providers’ rights should be protected.</h3>\n<blockquote><p>宽带提供商的权利应当得到保护。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者在末段主张保护宽带提供商的权利。</p>\n<p>A说保护宽带提供商的权利。末段同时有提供商和<code>protecting</code>，我们看保护一词直接接着什么。</p>\n<blockquote><p>to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n</blockquote>\n<p>作者要求禁止提供商干预自身网络中的流量，再建立清楚规则，保护的是网上开放与创新。</p>\n<p>提供商在这里是要受到约束的一方，开放创新才是要保存的东西。A把这两方的位置调了过来。</p>\n<p>原段没有提出让提供商免受规则干预或获得更多权利，反而要求给监管机构权力约束它们。</p>\n<p><strong>原文明说要保护的是网络开放创新，还是宽带提供商自行处置流量的权利？</strong></p>\n<p>是开放创新。A换了保护对象。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"40题","raw":"### B. The FCC should be put under strict supervision.\n\n> 联邦通信委员会应当受到严格监督。\n\n把B接回题干，它说的是：作者在末段主张把联邦通信委员会置于严格监督之下。\n\nB说严格监督FCC。末段的`give the commission ... authority`也涉及委员会，我们先看它是得到权力还是被加上约束。\n\n> It needs to give the commission **[xxx]** authority once and for all to bar broadband providers from meddling in the traffic on their network\n\n国会需要给委员会明确的监管权力，使其能禁止提供商操纵流量。委员会是获得授权、执行监管的一方。\n\nB却把FCC改成要被严格监督的对象，没有说出对宽带提供商的约束。\n\n国会采取行动不一定就是监督委员会；原句已经把行动写成授权，我们不能把它换成另一种国会职责。\n\n**国会给FCC权力去约束提供商，等于把FCC本身置于严格监督之下吗？**\n\n不等于。B把授权执行者换成了被监督对象。\n\n**第一轮判断：B排除。**","articleRects":[[273,1827,1123,37],[202,1873,1195,38],[202,1920,1194,37],[202,1966,786,38]],"questionRects":[[280,1839,751,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"40","paragraphPids":[5]},"html":"<h3>B. The FCC should be put under strict supervision.</h3>\n<blockquote><p>联邦通信委员会应当受到严格监督。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者在末段主张把联邦通信委员会置于严格监督之下。</p>\n<p>B说严格监督FCC。末段的<code>give the commission ... authority</code>也涉及委员会，我们先看它是得到权力还是被加上约束。</p>\n<blockquote><p>It needs to give the commission <strong>[xxx]</strong> authority once and for all to bar broadband providers from meddling in the traffic on their network</p>\n</blockquote>\n<p>国会需要给委员会明确的监管权力，使其能禁止提供商操纵流量。委员会是获得授权、执行监管的一方。</p>\n<p>B却把FCC改成要被严格监督的对象，没有说出对宽带提供商的约束。</p>\n<p>国会采取行动不一定就是监督委员会；原句已经把行动写成授权，我们不能把它换成另一种国会职责。</p>\n<p><strong>国会给FCC权力去约束提供商，等于把FCC本身置于严格监督之下吗？</strong></p>\n<p>不等于。B把授权执行者换成了被监督对象。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"40题","raw":"### C. Congress needs to take action to ensure net neutrality.\n\n> 国会需要采取行动，确保网络中立。\n\n把C接回题干，它说的是：作者在末段主张国会采取行动，确保网络中立。\n\nC说国会行动以确保网络中立。末段开头`cry out for Congress to act`已点名国会，我们接着看行动内容。\n\n> The endless legal battles and **[xxx]** at the FCC cry out for Congress to act.\n\n> to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.\n\n国会要使委员会获得权限，禁止宽带提供商干预网络流量，还要制定保护开放与创新的清楚规则。\n\n这些具体做法正是防止提供商偏袒某些网站、挑选赢家和输家，从而维护前文所谈的网络中立。\n\nC既保留国会这个行动者，也把授权和规则的共同目的说出来，没有只停在结束争吵本身。\n\n**要求国会授权监管、建立开放规则，能否概括成国会行动保障网络中立？**\n\n能。C把行动者和目标都接上了。\n\n**第一轮判断：C保留。**","articleRects":[[273,1827,1123,37],[202,1873,1195,38],[202,1920,1194,37],[202,1966,786,38]],"questionRects":[[280,1902,839,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"40","paragraphPids":[5]},"html":"<h3>C. Congress needs to take action to ensure net neutrality.</h3>\n<blockquote><p>国会需要采取行动，确保网络中立。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者在末段主张国会采取行动，确保网络中立。</p>\n<p>C说国会行动以确保网络中立。末段开头<code>cry out for Congress to act</code>已点名国会，我们接着看行动内容。</p>\n<blockquote><p>The endless legal battles and <strong>[xxx]</strong> at the FCC cry out for Congress to act.</p>\n</blockquote>\n<blockquote><p>to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n</blockquote>\n<p>国会要使委员会获得权限，禁止宽带提供商干预网络流量，还要制定保护开放与创新的清楚规则。</p>\n<p>这些具体做法正是防止提供商偏袒某些网站、挑选赢家和输家，从而维护前文所谈的网络中立。</p>\n<p>C既保留国会这个行动者，也把授权和规则的共同目的说出来，没有只停在结束争吵本身。</p>\n<p><strong>要求国会授权监管、建立开放规则，能否概括成国会行动保障网络中立？</strong></p>\n<p>能。C把行动者和目标都接上了。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"40题","raw":"### D. Rules need to be set to diversify online services.\n\n> 需要制定规则，让网络服务更加多样化。\n\n把D接回题干，它说的是：作者在末段主张制定规则，让网络服务更加多样化。\n\nD说规则要使服务多样化。原文规则后面接`protecting openness and innovation online`，我们看是否要求增加服务种类。\n\n> to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.\n\n开放让各方公平进入、创新不受提供商偏袒阻碍，是作者明确写出的保护目标。\n\n服务种类将来可能因创新增加，但这一段没有把不同种类的数量列为规则要实现的目标。创新也不只表现为多一种服务。\n\nD把开放竞争与创新换成了服务多样化，跳过了本篇反复强调的流量差别待遇问题。\n\n**保障开放与创新，就等于原文明说要靠规则增加网络服务种类吗？**\n\n不等于。D把可能想到的后续结果代替了作者明确提出的目标。\n\n**第一轮判断：D排除。**","articleRects":[[273,1827,1123,37],[202,1873,1195,38],[202,1920,1194,37],[202,1966,786,38]],"questionRects":[[280,1965,761,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"40","paragraphPids":[5]},"html":"<h3>D. Rules need to be set to diversify online services.</h3>\n<blockquote><p>需要制定规则，让网络服务更加多样化。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者在末段主张制定规则，让网络服务更加多样化。</p>\n<p>D说规则要使服务多样化。原文规则后面接<code>protecting openness and innovation online</code>，我们看是否要求增加服务种类。</p>\n<blockquote><p>to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.</p>\n</blockquote>\n<p>开放让各方公平进入、创新不受提供商偏袒阻碍，是作者明确写出的保护目标。</p>\n<p>服务种类将来可能因创新增加，但这一段没有把不同种类的数量列为规则要实现的目标。创新也不只表现为多一种服务。</p>\n<p>D把开放竞争与创新换成了服务多样化，跳过了本篇反复强调的流量差别待遇问题。</p>\n<p><strong>保障开放与创新，就等于原文明说要靠规则增加网络服务种类吗？</strong></p>\n<p>不等于。D把可能想到的后续结果代替了作者明确提出的目标。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"40题","raw":"### 40题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一遍留下C。作者要求国会行动，授权委员会禁止提供商干预网络流量，并保护开放与创新。","articleRects":[],"questionRects":[[225,1712,790,38],[281,1775,757,38],[280,1839,751,38],[280,1902,839,38],[280,1965,761,38],[581,2092,484,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"40"},"html":"<h3>40题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍留下C。作者要求国会行动，授权委员会禁止提供商干预网络流量，并保护开放与创新。</p>\n"},{"section":"进阶方法","raw":"### 把还没细读的段落接上\n\n> 原文参考：\n> \n> In the meantime, the court threw out the FCC’s attempt to block all state rules on net neutrality, while preserving the commission’s power to preempt individual state laws that undermine its order. That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC’s **[xxx]**.\n> \n> 开始精读：\n> \n> In the meantime, / the court threw out the FCC’s attempt to block all state rules on net neutrality, / while preserving the commission’s power / to preempt individual state laws that undermine its order. / That means more battles like the one now going on / between the Justice Department and California, / which enacted a tough net neutrality law / in the wake of the FCC’s **[xxx]**.\n> \n> 与此同时， / 法院否决了联邦通信委员会阻止各州所有网络中立性规则的企图， / 同时保留了该委员会的权力， / 可以排除那些削弱其命令的个别州法律的适用。 / 这意味着会有更多争斗，就像目前正在进行的那一场， / 发生在司法部与加利福尼亚州之间， / 加州制定了一部严格的网络中立性法律， / 是在联邦通信委员会的**[xxx]**之后。","articleRects":[[274,1595,1122,38],[202,1641,1194,38],[202,1688,1194,30],[202,1734,1194,38],[202,1780,932,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_reading","readingPids":[5],"role":"whole_text_precision","paragraphPids":[4]},"html":"<h3>把还没细读的段落接上</h3>\n<blockquote><p>原文参考：</p>\n<p>In the meantime, the court threw out the FCC’s attempt to block all state rules on net neutrality, while preserving the commission’s power to preempt individual state laws that undermine its order. That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC’s <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>In the meantime, / the court threw out the FCC’s attempt to block all state rules on net neutrality, / while preserving the commission’s power / to preempt individual state laws that undermine its order. / That means more battles like the one now going on / between the Justice Department and California, / which enacted a tough net neutrality law / in the wake of the FCC’s <strong>[xxx]</strong>.</p>\n<p>与此同时， / 法院否决了联邦通信委员会阻止各州所有网络中立性规则的企图， / 同时保留了该委员会的权力， / 可以排除那些削弱其命令的个别州法律的适用。 / 这意味着会有更多争斗，就像目前正在进行的那一场， / 发生在司法部与加利福尼亚州之间， / 加州制定了一部严格的网络中立性法律， / 是在联邦通信委员会的<strong>[xxx]</strong>之后。</p>\n</blockquote>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | favor affiliated websites；picking winners and losers online | 从“favor affiliated websites”与“picking winners and losers online”读出担忧：宽带提供商可能优待关联网站，左右网络竞争结果，因此人们要求规则保护自由与创新。这为后面的监管争议提出了问题。 | 提出宽带提供商可能干预网络流量的问题。 |\n| 第2段 | almost impossible to fill；eliminated the strict net neutrality rules | “almost impossible to fill”说明这种要求难以满足；委员会的命令“eliminated the strict net neutrality rules”，并否定自身监管权限、禁止州与地方政府监管，把首段的规则需求引向撤去监管的现实。 | 交代规则被撤销后的监管缺口。 |\n| 第3段 | other agencies；ended the investigations | 委员会把防范反竞争行为交给“other agencies”，却又“ended the investigations”；美国电话电报公司优待自家视频服务的例子说明问题行为仍然具体存在，本段承接上一段展示委员会撤去监管的后果。 | 继续说明其他机构难以补位，并用调查终止的实例落实现实影响。 |\n| 第4段 | a similarly deregulatory move；unhinged from the realities | 上诉法院维持2017年的放松监管命令，援引曾支持“a similarly deregulatory move”的旧材料；米利特法官认为结果“unhinged from the realities”，并提出国会或最高法院可以介入。本段把行政决定的争议推进到司法处理及其局限。 | 从监管后果转向法院裁决及其争议，引出进一步干预的需求。 |\n| 第5段 | threw out；preempt individual state laws | 法院“threw out”阻止各州所有规则的企图，同时保留委员会排除个别州法适用的权力，这意味着“more battles”。它承接上一段说明法院的处理没有结束争执，而是留下联邦与州继续冲突的局面。 | 说明法院对州监管空间的处理仍未结束争端。 |\n| 第6段 | cry out for Congress to act；protecting openness and innovation online | “cry out for Congress to act”把无休止的争斗转成对国会的行动要求，目标是授权委员会禁止提供商干预流量，并制定规则“protecting openness and innovation online”。 | 把持续争斗转为对国会行动的要求，明确授权监管的目的。 |\n\n全文主张由国会采取行动，为委员会监管宽带提供商、保障网络开放与创新建立明确规则，结束一再延续的监管争执。","articleRects":[[273,297,1123,38],[202,344,1194,37],[202,390,1195,38],[202,436,1194,38],[202,483,1194,38],[202,529,1050,31],[274,575,1125,38],[202,622,1184,37],[202,668,1195,38],[202,714,1194,38],[202,761,1194,38],[202,806,1194,39],[203,853,1193,38],[202,900,1189,38],[202,946,1194,38],[202,992,1194,38],[202,1039,525,38],[273,1085,1123,38],[202,1132,1194,37],[202,1178,1184,38],[202,1224,1194,38],[202,1271,917,37],[274,1317,1123,38],[202,1363,1194,38],[202,1410,1194,37],[203,1455,1193,39],[202,1501,1194,39],[204,1547,977,40],[274,1595,1122,38],[202,1641,1194,38],[202,1688,1194,30],[202,1734,1194,38],[202,1780,932,38],[273,1827,1123,37],[202,1873,1195,38],[202,1920,1194,37],[202,1966,786,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>favor affiliated websites；picking winners and losers online</td><td>从“favor affiliated websites”与“picking winners and losers online”读出担忧：宽带提供商可能优待关联网站，左右网络竞争结果，因此人们要求规则保护自由与创新。这为后面的监管争议提出了问题。</td><td>提出宽带提供商可能干预网络流量的问题。</td></tr><tr><td>第2段</td><td>almost impossible to fill；eliminated the strict net neutrality rules</td><td>“almost impossible to fill”说明这种要求难以满足；委员会的命令“eliminated the strict net neutrality rules”，并否定自身监管权限、禁止州与地方政府监管，把首段的规则需求引向撤去监管的现实。</td><td>交代规则被撤销后的监管缺口。</td></tr><tr><td>第3段</td><td>other agencies；ended the investigations</td><td>委员会把防范反竞争行为交给“other agencies”，却又“ended the investigations”；美国电话电报公司优待自家视频服务的例子说明问题行为仍然具体存在，本段承接上一段展示委员会撤去监管的后果。</td><td>继续说明其他机构难以补位，并用调查终止的实例落实现实影响。</td></tr><tr><td>第4段</td><td>a similarly deregulatory move；unhinged from the realities</td><td>上诉法院维持2017年的放松监管命令，援引曾支持“a similarly deregulatory move”的旧材料；米利特法官认为结果“unhinged from the realities”，并提出国会或最高法院可以介入。本段把行政决定的争议推进到司法处理及其局限。</td><td>从监管后果转向法院裁决及其争议，引出进一步干预的需求。</td></tr><tr><td>第5段</td><td>threw out；preempt individual state laws</td><td>法院“threw out”阻止各州所有规则的企图，同时保留委员会排除个别州法适用的权力，这意味着“more battles”。它承接上一段说明法院的处理没有结束争执，而是留下联邦与州继续冲突的局面。</td><td>说明法院对州监管空间的处理仍未结束争端。</td></tr><tr><td>第6段</td><td>cry out for Congress to act；protecting openness and innovation online</td><td>“cry out for Congress to act”把无休止的争斗转成对国会的行动要求，目标是授权委员会禁止提供商干预流量，并制定规则“protecting openness and innovation online”。</td><td>把持续争斗转为对国会行动的要求，明确授权监管的目的。</td></tr></tbody></table>\n<p>全文主张由国会采取行动，为委员会监管宽带提供商、保障网络开放与创新建立明确规则，结束一再延续的监管争执。</p>\n"},{"section":"进阶回查","raw":"## 回查37题：C还是D？\n\nC. has issued a special resolution\n\nD. takes an anti-regulatory stance\n\nC说委员会发布了一项特别决议，D说它反对监管。第2段确实有投票通过的命令，因此不能仅凭文件名称不同，就断言C与事件完全无关。\n\n但题干还有一句：面对要求制定网络中立规则的呼声。我们需要回答FCC作出了怎样的回应。\n\n命令的内容连续写了三层：\n\n> eliminated the strict net neutrality rules\n>\n> rejected the commission’s authority\n>\n> state and local governments couldn’t regulate broadband providers either\n\n原有规则被取消，自己的权限被否定，州和地方也被禁止监管。这些不是单纯“发了文件”，而是文件明确把监管往回撤。\n\n第3段又写：\n\n> the FCC also ended the investigations of broadband providers\n\n实际调查也被停止。最后作者提出国会应重新授权委员会，正是在补前面被撤掉或否认的约束能力。\n\nC只说发布正式决定，无法告诉我们它是在回应公众要求还是反着做；也没有解释“特别”具体指什么。D则让取消规则、否定权限、禁止州监管与停止调查都能接到一起。\n\n**面对加强网络中立规则的要求，FCC这份决定是在增加监管，还是撤回并阻止监管？**\n\n是后者。D直接说明了题干所问的回应方向。C可以描述事件形式，但没有回答决定究竟怎样处理这项要求。\n\n> **37题选D。**","articleRects":[[274,575,1125,38],[202,622,1184,37],[202,668,1195,38],[202,714,1194,38],[202,761,1194,38],[202,806,1194,39],[203,853,1193,38],[202,900,1189,38],[202,946,1194,38],[202,992,1194,38],[202,1039,525,38],[273,1085,1123,38],[202,1132,1194,37],[202,1178,1184,38],[202,1224,1194,38],[202,1271,917,37],[274,1595,1122,38],[202,1641,1194,38],[202,1688,1194,30],[202,1734,1194,38],[202,1780,932,38],[273,1827,1123,37],[202,1873,1195,38],[202,1920,1194,37],[202,1966,786,38]],"questionRects":[[226,570,888,38],[280,634,477,30],[280,697,551,31],[280,757,489,46],[280,824,494,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["C","D"],"newEvidencePids":[3,5,6],"finalChoice":"D","qid":"37","paragraphPids":[0,1,2,3,4,5]},"html":"<h2>回查37题：C还是D？</h2>\n<p>C. has issued a special resolution</p>\n<p>D. takes an anti-regulatory stance</p>\n<p>C说委员会发布了一项特别决议，D说它反对监管。第2段确实有投票通过的命令，因此不能仅凭文件名称不同，就断言C与事件完全无关。</p>\n<p>但题干还有一句：面对要求制定网络中立规则的呼声。我们需要回答FCC作出了怎样的回应。</p>\n<p>命令的内容连续写了三层：</p>\n<blockquote><p>eliminated the strict net neutrality rules</p>\n<p>rejected the commission’s authority</p>\n<p>state and local governments couldn’t regulate broadband providers either</p>\n</blockquote>\n<p>原有规则被取消，自己的权限被否定，州和地方也被禁止监管。这些不是单纯“发了文件”，而是文件明确把监管往回撤。</p>\n<p>第3段又写：</p>\n<blockquote><p>the FCC also ended the investigations of broadband providers</p>\n</blockquote>\n<p>实际调查也被停止。最后作者提出国会应重新授权委员会，正是在补前面被撤掉或否认的约束能力。</p>\n<p>C只说发布正式决定，无法告诉我们它是在回应公众要求还是反着做；也没有解释“特别”具体指什么。D则让取消规则、否定权限、禁止州监管与停止调查都能接到一起。</p>\n<p><strong>面对加强网络中立规则的要求，FCC这份决定是在增加监管，还是撤回并阻止监管？</strong></p>\n<p>是后者。D直接说明了题干所问的回应方向。C可以描述事件形式，但没有回答决定究竟怎样处理这项要求。</p>\n<blockquote><p><strong>37题选D。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**36. A**\n\n**37. D**\n\n**38. D**\n\n**39. B**\n\n**40. C**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>36. A</strong></p>\n<p><strong>37. D</strong></p>\n<p><strong>38. D</strong></p>\n<p><strong>39. B</strong></p>\n<p><strong>40. C</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRlKNBABXRUJQVlA4TEaNBAAvV0Y1AlUTg7aNJCU9/qj3694dgIiYAPxtYMHSNJ2maZLI6mEjieqqSIV5ZX7DFkCr7rzyehyZnnxYFagkau0uUCuzbFxVBSqJYynR9KDkeGBxBfT8KlOv8v+vv9X/Hy7jjLu7u7u7u7u7u7NYst2W4e7u7u7u7u4uM6/n42nbxh5PXhvrzO44negJkntzPwI6kQNwT9BJDAfguhLDITB0h066N7SRmC2RZpvkvtJO0B0SjVOA5N5onAJ0l66v2Z3hANyTO4m2EgfhibY77knXrE7bJ0B3OAE9gt333LHkieEASJ52w93TJnn0BG9p7/QmvTV6c0+6Zp/A27O/38mjt3fy9/sU9jv5OIxs20klbRHmrOT4+YBZXUmSbFq5/8UdXOPZNn77DwuSJEVV9nMdDlkc9uwDKFDo7z+KiPDC/v/+qf/lpNtu92TbpHt6trvp2ctmt7vtbruXPbu93O457bZ7ds/u9uw2PXu2m+622e12N90927Sn7Z5uL3fbvUybbTe73V43m2zanLTdbbfNxdnNttvr7lXbbLfX193uNtvdXPW624r5vJ6v9/vznoHvF36/f78YFIagMGTEoDAEhUGBwpARg8IQxASDAoVBEQyKERMMChQGRTAoRkwwKIJBYQgGxQiCQRHEA4UhGBT5JBMUhowYFIZgUChQGDJiUBiCwqBAYciICQYFCoMChSEjCAYF4hM
