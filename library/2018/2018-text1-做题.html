<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 21题题干\n\n**Who will be most threatened by automation?**\n\n> 谁将受到自动化的最大威胁？\n\n题型：**对象判断题**。","articleRects":[],"questionRects":[[226,190,716,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"21"},"html":"<h2>21题题干</h2>\n<p><strong>Who will be most threatened by automation?</strong></p>\n<blockquote><p>谁将受到自动化的最大威胁？</p>\n</blockquote>\n<p>题型：<strong>对象判断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 22题题干\n\n**Which of the following best represents the author’s view?**\n\n> 下列哪项最能代表作者的观点？\n\n题型：**观点判断题**。","articleRects":[],"questionRects":[[226,567,904,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"22"},"html":"<h2>22题题干</h2>\n<p><strong>Which of the following best represents the author’s view?</strong></p>\n<blockquote><p>下列哪项最能代表作者的观点？</p>\n</blockquote>\n<p>题型：<strong>观点判断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 23题题干\n\n**Education in the age of automation should put more emphasis on ______.**\n\n> 自动化时代的教育应该更加重视______。\n\n题型：**教育重点细节题**。","articleRects":[],"questionRects":[[226,945,1012,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"23"},"html":"<h2>23题题干</h2>\n<p><strong>Education in the age of automation should put more emphasis on ______.</strong></p>\n<blockquote><p>自动化时代的教育应该更加重视______。</p>\n</blockquote>\n<p>题型：<strong>教育重点细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 24题题干\n\n**The author suggests that tax policies be aimed at ______.**\n\n> 作者建议税收政策应以______为目标。\n\n题型：**政策目的题**。","articleRects":[],"questionRects":[[226,1322,775,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"24"},"html":"<h2>24题题干</h2>\n<p><strong>The author suggests that tax policies be aimed at ______.</strong></p>\n<blockquote><p>作者建议税收政策应以______为目标。</p>\n</blockquote>\n<p>题型：<strong>政策目的题</strong>。</p>\n"},{"section":"先读题干","raw":"## 25题题干\n\n**In this text, the author presents a problem with ______.**\n\n> 在本文中，作者以______的方式呈现了一个问题。\n\n题型：**行文方式概括题**。","articleRects":[],"questionRects":[[226,1699,753,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"25"},"html":"<h2>25题题干</h2>\n<p><strong>In this text, the author presents a problem with ______.</strong></p>\n<blockquote><p>在本文中，作者以______的方式呈现了一个问题。</p>\n</blockquote>\n<p>题型：<strong>行文方式概括题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, Likewise, Finally |\n| 态度词／评价词 | 先抓个大概好坏 | annoying, fine, nuts |\n| 动作词 | 先看谁做了什么 | automated, adapt, improve |\n| 结果词 | 看最后出了什么事 | gap, incomes, inequality |\n| 重复主题词 | 大概知道老在说什么 | robots, jobs, workers |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, Likewise, Finally</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>annoying, fine, nuts</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>automated, adapt, improve</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>gap, incomes, inequality</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>robots, jobs, workers</td></tr></tbody></table>\n"},{"section":"读文章","raw":"Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next **[xxx]** campaign: What happens when the robots come for their jobs?","articleRects":[[274,297,1121,38],[202,341,1194,38],[202,385,455,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next <strong>[xxx]</strong> campaign: What happens when the robots come for their jobs?</p>\n</div></div>"},{"section":"读文章","raw":"Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next **[xxx]** campaign: / What happens when the robots come for their jobs?","articleRects":[[274,297,1121,38],[202,341,1194,38],[202,385,455,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next <strong>[xxx]</strong> campaign: / What happens when the robots come for their jobs?</p>\n</div></div>"},{"section":"读文章","raw":"Among the 令人烦恼的挑战 中产阶级面对的 is one that will probably go unmentioned in the next **[xxx]** campaign: / What happens when the 机器人冲着他们工作而来?","articleRects":[[274,297,1121,38],[202,341,1194,38],[202,385,455,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":2,"coarse":true,"literalReplacements":[{"group":0,"source":"annoying challenges","zh":"令人烦恼的挑战"},{"group":0,"source":"facing the middle class","zh":"中产阶级面对的"},{"group":1,"source":"robots come 总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到令人烦恼的挑战、中产阶级面对的、中产阶级面对的、机器人冲着他们工作而来；中间又出现处于被自动化的高风险、低收入工作、不能吸引机器人、富人拥有机器人；已经使工人受益、提高生活水平、使工人摆脱、帮助适应；重新思考教育与工作培训、记忆事实、掌握新技能、无需陷入债务；创办新公司、必须变得更容易、把劳动与机器结合、需要这些新公司；扩大差距、资本收入与劳动收入、针对低工资劳动的税、减少不平等；结尾还有技术将改善社会、以大大小小的方式、帮助工人适应、将必不可少。</p>\n<p>到这里还不能自然地说清楚：机器人与哪些人的工作有关，过去的技术变化和眼前的问题怎样联系，教育、企业与税收为何接连出现。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"21题","raw":"## 21题\n\n> Who will be most threatened by automation?  \n> 谁将受到自动化的最大威胁？\n\n题干问automation会威胁谁。粗读第2段时见到at high risk of being automated，并且同段分别提到低收入工作和富人，直接完整读第2段，比较文中各类人的工作与机器人的关系。\n\n> 原文参考：\n> \n> Don’t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class **[xxx]** squeezed. Lower-income jobs like gardening or day care don’t appeal to robots. But many middle-class **[xxx]**—**[xxx]**, financial advice, software engineering—have aroused their interest, or soon will. The rich own the robots, so they will be fine.\n> \n> 开始精读：\n> \n> Don’t dismiss that possibility entirely. / About half of U.S. jobs are at high risk of being automated, / according to a University of Oxford study, / with the middle class **[xxx]** squeezed. / Lower-income jobs like gardening or day care don’t appeal to robots. / But many middle-class **[xxx]**—**[xxx]**, financial advice, software engineering—have aroused their interest, / or soon will. / The rich own the robots, / so they will be fine.\n> \n> 不要彻底否定这种可能性。 / 美国约一半的工作都面临被自动化的高风险， / 这是根据牛津大学的一项研究得出的， / 其中中产阶级**[xxx]**受到挤压。 / 像园艺或日间照料这样的低收入工作对机器人没有吸引力。 / 但许多中产阶级的**[xxx]**——**[xxx]**、财务咨询、软件工程——已经引起了它们的兴趣， / 或者很快就会。 / 富人拥有机器人， / 因此他们不会有事。\n\n本题要确定最受自动化威胁的人群，需看原文把哪种工作写成容易被自动化，以及对不同收入群体作了怎样的区分。\n\n接下来按A—D逐项看。","articleRects":[[274,429,1122,38],[202,473,1194,38],[202,517,1195,38],[202,557,1192,46],[202,605,1184,37],[202,649,679,37]],"questionRects":[[226,190,716,38],[280,253,335,38],[280,316,335,38],[280,379,257,30],[280,442,368,30]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"21","initialReadingPids":[1]},"html":"<h2>21题</h2>\n<blockquote><p>Who will be most threatened by automation?<br />\n谁将受到自动化的最大威胁？</p>\n</blockquote>\n<p>题干问automation会威胁谁。粗读第2段时见到at high risk of being automated，并且同段分别提到低收入工作和富人，直接完整读第2段，比较文中各类人的工作与机器人的关系。</p>\n<blockquote><p>原文参考：</p>\n<p>Don’t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class <strong>[xxx]</strong> squeezed. Lower-income jobs like gardening or day care don’t appeal to robots. But many middle-class <strong>[xxx]</strong>—<strong>[xxx]</strong>, financial advice, software engineering—have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n<p>开始精读：</p>\n<p>Don’t dismiss that possibility entirely. / About half of U.S. jobs are at high risk of being automated, / according to a University of Oxford study, / with the middle class <strong>[xxx]</strong> squeezed. / Lower-income jobs like gardening or day care don’t appeal to robots. / But many middle-class <strong>[xxx]</strong>—<strong>[xxx]</strong>, financial advice, software engineering—have aroused their interest, / or soon will. / The rich own the robots, / so they will be fine.</p>\n<p>不要彻底否定这种可能性。 / 美国约一半的工作都面临被自动化的高风险， / 这是根据牛津大学的一项研究得出的， / 其中中产阶级<strong>[xxx]</strong>受到挤压。 / 像园艺或日间照料这样的低收入工作对机器人没有吸引力。 / 但许多中产阶级的<strong>[xxx]</strong>——<strong>[xxx]</strong>、财务咨询、软件工程——已经引起了它们的兴趣， / 或者很快就会。 / 富人拥有机器人， / 因此他们不会有事。</p>\n</blockquote>\n<p>本题要确定最受自动化威胁的人群，需看原文把哪种工作写成容易被自动化，以及对不同收入群体作了怎样的区分。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"21题","raw":"### A. Leading politicians.\n\n> 主要政治人物。\n\n把A接回题干，它说的是：主要政治人物将受到自动化的最大威胁。\n\nA说政治人物受到最大威胁。第2段讨论自动化风险时把中产、低收入者和富人分开，我们看看有没有把政治人物放进这一比较。\n\n> About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class **[xxx]** squeezed.\n\n> Lower-income jobs like gardening or day care don’t appeal to robots.\n\n> The rich own the robots, so they will be fine.\n\n原文说美国约一半工作有较高自动化风险，接着点出中产受到挤压，又解释低收入工作不吸引机器人、富人拥有机器人。\n\n这些都是在看谁的工作会被取代。没有一句说政治人物的工作最容易被机器人接走。\n\n即使文章开头提到某种竞选，竞选中是否提及这个问题，也不是政治人物自身被自动化取代的风险。A不能由政治背景变成受威胁对象。\n\n**原文把最大风险写到中产工作的比较中，有没有把主要政治人物说成最容易被取代的人？**\n\n没有。A找不到对应的工作风险说明。\n\n**第一轮判断：A排除。**","articleRects":[[274,429,1122,38],[202,473,1194,38],[202,517,1195,38],[202,557,1192,46],[202,605,1184,37],[202,649,679,37]],"questionRects":[[280,253,335,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"21","paragraphPids":[1]},"html":"<h3>A. Leading politicians.</h3>\n<blockquote><p>主要政治人物。</p>\n</blockquote>\n<p>把A接回题干，它说的是：主要政治人物将受到自动化的最大威胁。</p>\n<p>A说政治人物受到最大威胁。第2段讨论自动化风险时把中产、低收入者和富人分开，我们看看有没有把政治人物放进这一比较。</p>\n<blockquote><p>About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class <strong>[xxx]</strong> squeezed.</p>\n</blockquote>\n<blockquote><p>Lower-income jobs like gardening or day care don’t appeal to robots.</p>\n</blockquote>\n<blockquote><p>The rich own the robots, so they will be fine.</p>\n</blockquote>\n<p>原文说美国约一半工作有较高自动化风险，接着点出中产受到挤压，又解释低收入工作不吸引机器人、富人拥有机器人。</p>\n<p>这些都是在看谁的工作会被取代。没有一句说政治人物的工作最容易被机器人接走。</p>\n<p>即使文章开头提到某种竞选，竞选中是否提及这个问题，也不是政治人物自身被自动化取代的风险。A不能由政治背景变成受威胁对象。</p>\n<p><strong>原文把最大风险写到中产工作的比较中，有没有把主要政治人物说成最容易被取代的人？</strong></p>\n<p>没有。A找不到对应的工作风险说明。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"21题","raw":"### B. Low-wage laborers.\n\n> 低工资劳动者。\n\n把B接回题干，它说的是：低工资劳动者将受到自动化的最大威胁。\n\nB说低工资劳动者。原文直接写`Lower-income jobs`，我们看它后面接的`don’t appeal to robots`。\n\n> Lower-income jobs like gardening or day care don’t appeal to robots.\n\n园艺和日间照料被用作低收入工作的例子，作者说这些工作不吸引机器人。接下来`But`才转到引起机器人兴趣的中产工作。\n\n所以，低收入者在本段用于与受挤压的中产对照，并不是因工资低就更容易被替代。\n\nB把工资低自动当成最大风险，但原句已经给出相反的比较：列出的低收入工作不受机器人青睐。\n\n**低收入工作的例子被写成不吸引机器人，能把它们所在的人群选为本段最受威胁者吗？**\n\n不能。原文用它们衬出中产工作的风险。\n\n**第一轮判断：B排除。**","articleRects":[[274,429,1122,38],[202,473,1194,38],[202,517,1195,38],[202,557,1192,46],[202,605,1184,37],[202,649,679,37]],"questionRects":[[280,316,335,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"21","paragraphPids":[1]},"html":"<h3>B. Low-wage laborers.</h3>\n<blockquote><p>低工资劳动者。</p>\n</blockquote>\n<p>把B接回题干，它说的是：低工资劳动者将受到自动化的最大威胁。</p>\n<p>B说低工资劳动者。原文直接写<code>Lower-income jobs</code>，我们看它后面接的<code>don’t appeal to robots</code>。</p>\n<blockquote><p>Lower-income jobs like gardening or day care don’t appeal to robots.</p>\n</blockquote>\n<p>园艺和日间照料被用作低收入工作的例子，作者说这些工作不吸引机器人。接下来<code>But</code>才转到引起机器人兴趣的中产工作。</p>\n<p>所以，低收入者在本段用于与受挤压的中产对照，并不是因工资低就更容易被替代。</p>\n<p>B把工资低自动当成最大风险，但原句已经给出相反的比较：列出的低收入工作不受机器人青睐。</p>\n<p><strong>低收入工作的例子被写成不吸引机器人，能把它们所在的人群选为本段最受威胁者吗？</strong></p>\n<p>不能。原文用它们衬出中产工作的风险。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"21题","raw":"### C. Robot owners.\n\n> 机器人所有者。\n\n把C接回题干，它说的是：机器人所有者将受到自动化的最大威胁。\n\nC说机器人所有者。第2段末的`own the robots`正对应这些人，我们看作者用`so`得出了什么。\n\n> The rich own the robots, so they will be fine.\n\n原句说富人拥有机器人，`so they will be fine`因此他们不会有事。拥有机器人在这里成了避免受害的理由。\n\nC却把机器人所有者说成最受威胁的人，和这句明确给出的结论反着来。\n\n题干问谁的工作或处境受冲击，不能因为他们与机器人关系密切，就把这种拥有关系当成更高风险。\n\n**作者说拥有机器人所以处境不会有问题，是否能接成他们受到最大威胁？**\n\n不能。原文明确把所有者放在相对无碍的一边。\n\n**第一轮判断：C排除。**","articleRects":[[274,429,1122,38],[202,473,1194,38],[202,517,1195,38],[202,557,1192,46],[202,605,1184,37],[202,649,679,37]],"questionRects":[[280,379,257,30]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"21","paragraphPids":[1]},"html":"<h3>C. Robot owners.</h3>\n<blockquote><p>机器人所有者。</p>\n</blockquote>\n<p>把C接回题干，它说的是：机器人所有者将受到自动化的最大威胁。</p>\n<p>C说机器人所有者。第2段末的<code>own the robots</code>正对应这些人，我们看作者用<code>so</code>得出了什么。</p>\n<blockquote><p>The rich own the robots, so they will be fine.</p>\n</blockquote>\n<p>原句说富人拥有机器人，<code>so they will be fine</code>因此他们不会有事。拥有机器人在这里成了避免受害的理由。</p>\n<p>C却把机器人所有者说成最受威胁的人，和这句明确给出的结论反着来。</p>\n<p>题干问谁的工作或处境受冲击，不能因为他们与机器人关系密切，就把这种拥有关系当成更高风险。</p>\n<p><strong>作者说拥有机器人所以处境不会有问题，是否能接成他们受到最大威胁？</strong></p>\n<p>不能。原文明确把所有者放在相对无碍的一边。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"21题","raw":"### D. Middle-class workers.\n\n> 中产阶级劳动者。\n\n把D接回题干，它说的是：中产阶级劳动者将受到自动化的最大威胁。\n\nD说中产劳动者。第2段既写`middle class ... squeezed`，又列出中产的具体工作，我们把它们与两边人群比较。\n\n> with the middle class **[xxx]** squeezed.\n\n> Lower-income jobs like gardening or day care don’t appeal to robots.\n\n> But many middle-class **[xxx]**—**[xxx]**, financial advice, software engineering—have aroused their interest, or soon will.\n\n> The rich own the robots, so they will be fine.\n\n中产被写成受到挤压，接着财务咨询、软件工程等工作已经或很快会引起机器人兴趣。这些例子把“受挤压”落实到会被替代的工作上。\n\n相较之下，所列低收入工作不吸引机器人，富人又拥有机器人、处境无碍。三类人放在一起，中产的工作最直接面临这项风险。\n\nD没有仅凭阶层名称作判断，它能同时接上受挤压的描述和后面的工作例子。\n\n**把三类人放在一起看，哪一类既被说成受到挤压，又有工作正吸引机器人？**\n\n是中产劳动者。D对应这两处说明。\n\n**第一轮判断：D保留。**","articleRects":[[274,429,1122,38],[202,473,1194,38],[202,517,1195,38],[202,557,1192,46],[202,605,1184,37],[202,649,679,37]],"questionRects":[[280,442,368,30]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"21","paragraphPids":[1]},"html":"<h3>D. Middle-class workers.</h3>\n<blockquote><p>中产阶级劳动者。</p>\n</blockquote>\n<p>把D接回题干，它说的是：中产阶级劳动者将受到自动化的最大威胁。</p>\n<p>D说中产劳动者。第2段既写<code>middle class ... squeezed</code>，又列出中产的具体工作，我们把它们与两边人群比较。</p>\n<blockquote><p>with the middle class <strong>[xxx]</strong> squeezed.</p>\n</blockquote>\n<blockquote><p>Lower-income jobs like gardening or day care don’t appeal to robots.</p>\n</blockquote>\n<blockquote><p>But many middle-class <strong>[xxx]</strong>—<strong>[xxx]</strong>, financial advice, software engineering—have aroused their interest, or soon will.</p>\n</blockquote>\n<blockquote><p>The rich own the robots, so they will be fine.</p>\n</blockquote>\n<p>中产被写成受到挤压，接着财务咨询、软件工程等工作已经或很快会引起机器人兴趣。这些例子把“受挤压”落实到会被替代的工作上。</p>\n<p>相较之下，所列低收入工作不吸引机器人，富人又拥有机器人、处境无碍。三类人放在一起，中产的工作最直接面临这项风险。</p>\n<p>D没有仅凭阶层名称作判断，它能同时接上受挤压的描述和后面的工作例子。</p>\n<p><strong>把三类人放在一起看，哪一类既被说成受到挤压，又有工作正吸引机器人？</strong></p>\n<p>是中产劳动者。D对应这两处说明。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"21题","raw":"### 21题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。第2段将中产阶级的受挤压及工作引起机器人兴趣，与低收入工作和富人的处境相对照。","articleRects":[],"questionRects":[[226,190,716,38],[280,253,335,38],[280,316,335,38],[280,379,257,30],[280,442,368,30]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"21"},"html":"<h3>21题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。第2段将中产阶级的受挤压及工作引起机器人兴趣，与低收入工作和富人的处境相对照。</p>\n"},{"section":"22题","raw":"## 22题\n\n> Which of the following best represents the author’s view?  \n> 下列哪项最能代表作者的观点？\n\n题干问author’s view，没有指定段落。粗读第3段时既见到has benefited workers，也见到help adjusting，这一段在讨论技术对工人的影响时作了转折。先把第3段完整读完，分清作者承认的长远结果与眼下提出的判断。\n\n> 原文参考：\n> \n> This isn’t to be alarmist. Optimists point out that technological **[xxx]** has benefited workers in the past. The Industrial Revolution didn’t go so well for Luddites whose jobs were displaced by mechanized **[xxx]**, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost **[xxx]**, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.\n> \n> 开始精读：\n> \n> This isn’t to be alarmist. / Optimists point out that technological **[xxx]** has benefited workers in the past. / The Industrial Revolution didn’t go so well for Luddites whose jobs were displaced by mechanized **[xxx]**, / but it eventually raised living standards and created more jobs than it destroyed. / Likewise, automation should eventually boost **[xxx]**, / stimulate demand by driving down prices, / and free workers from hard, boring work. / But in the medium term, / middle-class workers may need a lot of help adjusting.\n> \n> 这并不是要危言耸听。 / 乐观者指出，过去技术**[xxx]**已经使工人受益。 / 工业革命对那些工作被机械化**[xxx]**取代的卢德派人士来说并不顺利， / 但它最终提高了生活水平，而且创造的工作比毁掉的更多。 / 同样，自动化最终应当提升**[xxx]**， / 通过压低价格来刺激需求， / 并使工人摆脱艰苦、乏味的劳动。 / 但从中期来看， / 中产阶级工人在调整适应时可能需要大量帮助。\n\n本题要核对作者对自动化及工人处境的判断，特别要保持原文对过去、最终和中期的时间区分，不能把不同时间的影响混在一起。\n\n接下来按A—D逐项看。","articleRects":[[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46]],"questionRects":[[226,567,904,38],[281,630,760,38],[280,693,795,38],[280,756,784,38],[280,819,809,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"22","initialReadingPids":[2]},"html":"<h2>22题</h2>\n<blockquote><p>Which of the following best represents the author’s view?<br />\n下列哪项最能代表作者的观点？</p>\n</blockquote>\n<p>题干问author’s view，没有指定段落。粗读第3段时既见到has benefited workers，也见到help adjusting，这一段在讨论技术对工人的影响时作了转折。先把第3段完整读完，分清作者承认的长远结果与眼下提出的判断。</p>\n<blockquote><p>原文参考：</p>\n<p>This isn’t to be alarmist. Optimists point out that technological <strong>[xxx]</strong> has benefited workers in the past. The Industrial Revolution didn’t go so well for Luddites whose jobs were displaced by mechanized <strong>[xxx]</strong>, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost <strong>[xxx]</strong>, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n<p>开始精读：</p>\n<p>This isn’t to be alarmist. / Optimists point out that technological <strong>[xxx]</strong> has benefited workers in the past. / The Industrial Revolution didn’t go so well for Luddites whose jobs were displaced by mechanized <strong>[xxx]</strong>, / but it eventually raised living standards and created more jobs than it destroyed. / Likewise, automation should eventually boost <strong>[xxx]</strong>, / stimulate demand by driving down prices, / and free workers from hard, boring work. / But in the medium term, / middle-class workers may need a lot of help adjusting.</p>\n<p>这并不是要危言耸听。 / 乐观者指出，过去技术<strong>[xxx]</strong>已经使工人受益。 / 工业革命对那些工作被机械化<strong>[xxx]</strong>取代的卢德派人士来说并不顺利， / 但它最终提高了生活水平，而且创造的工作比毁掉的更多。 / 同样，自动化最终应当提升<strong>[xxx]</strong>， / 通过压低价格来刺激需求， / 并使工人摆脱艰苦、乏味的劳动。 / 但从中期来看， / 中产阶级工人在调整适应时可能需要大量帮助。</p>\n</blockquote>\n<p>本题要核对作者对自动化及工人处境的判断，特别要保持原文对过去、最终和中期的时间区分，不能把不同时间的影响混在一起。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"22题","raw":"### A. Worries about automation are in fact groundless.\n\n> 对自动化的担忧实际上毫无根据。\n\n把A接回题干，它说的是：作者认为对自动化的担忧实际上毫无根据。\n\nA说担忧毫无根据。第3段首句是`This isn’t to be alarmist`，我们再接上段末`need a lot of help adjusting`。\n\n> This isn’t to be alarmist.\n\n> But in the medium term, middle-class workers may need a lot of help adjusting.\n\n作者说自己不是危言耸听，是说明这些提醒不在故意吓人，并不是收回前面关于就业风险的判断。\n\n段末仍强调中产工人在中期适应中可能需要大量帮助。如果问题完全没有根据，就不需要接着提出这种帮助需求。\n\nA把“不故意夸大危险”读成“危险担忧全无根据”，把作者仍然认真对待的适应困难抹掉了。\n\n**不想危言耸听，同时又说工人需要大量帮助，能说明担忧毫无根据吗？**\n\n不能。作者承认需要应对的问题，只是不夸大它。\n\n**第一轮判断：A排除。**","articleRects":[[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46]],"questionRects":[[281,630,760,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"22","paragraphPids":[2]},"html":"<h3>A. Worries about automation are in fact groundless.</h3>\n<blockquote><p>对自动化的担忧实际上毫无根据。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为对自动化的担忧实际上毫无根据。</p>\n<p>A说担忧毫无根据。第3段首句是<code>This isn’t to be alarmist</code>，我们再接上段末<code>need a lot of help adjusting</code>。</p>\n<blockquote><p>This isn’t to be alarmist.</p>\n</blockquote>\n<blockquote><p>But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<p>作者说自己不是危言耸听，是说明这些提醒不在故意吓人，并不是收回前面关于就业风险的判断。</p>\n<p>段末仍强调中产工人在中期适应中可能需要大量帮助。如果问题完全没有根据，就不需要接着提出这种帮助需求。</p>\n<p>A把“不故意夸大危险”读成“危险担忧全无根据”，把作者仍然认真对待的适应困难抹掉了。</p>\n<p><strong>不想危言耸听，同时又说工人需要大量帮助，能说明担忧毫无根据吗？</strong></p>\n<p>不能。作者承认需要应对的问题，只是不夸大它。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"22题","raw":"### B. Optimists’ opinions on new tech find little support.\n\n> 乐观者关于新技术的看法几乎得不到支持。\n\n把B接回题干，它说的是：作者认为乐观者关于新技术的看法几乎得不到支持。\n\nB说乐观者的观点几乎没有支持。原文介绍乐观者后，紧接着写工业革命的最终结果，我们看作者有没有提供依据。\n\n> Optimists point out that technological **[xxx]** has benefited workers in the past.\n\n> but it eventually raised living standards and created more jobs than it destroyed.\n\n> Likewise, automation should eventually boost **[xxx]**, stimulate demand by driving down prices, and free workers from hard, boring work.\n\n工业革命起初使一些工人失去工作，但最后提高生活水平，创造的工作多于毁掉的。作者用`but eventually`承认这份长远好处。\n\n随后`Likewise`又说明自动化最终也应降价、刺激需求、解放辛苦乏味的劳动。这里延续了技术可能有益的判断。\n\nB却说乐观者几乎没有支持，忽略了作者亲自列出的历史结果和相似推论。承认中期困难，并不等于否定长远好处。\n\n**作者先给出工业革命的好结果，再说自动化也应带来好处，能说乐观看法几乎没支持吗？**\n\n不能。原段明确承认了这些支持，只是接着补出中期难题。\n\n**第一轮判断：B排除。**","articleRects":[[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46]],"questionRects":[[280,693,795,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"22","paragraphPids":[2]},"html":"<h3>B. Optimists’ opinions on new tech find little support.</h3>\n<blockquote><p>乐观者关于新技术的看法几乎得不到支持。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为乐观者关于新技术的看法几乎得不到支持。</p>\n<p>B说乐观者的观点几乎没有支持。原文介绍乐观者后，紧接着写工业革命的最终结果，我们看作者有没有提供依据。</p>\n<blockquote><p>Optimists point out that technological <strong>[xxx]</strong> has benefited workers in the past.</p>\n</blockquote>\n<blockquote><p>but it eventually raised living standards and created more jobs than it destroyed.</p>\n</blockquote>\n<blockquote><p>Likewise, automation should eventually boost <strong>[xxx]</strong>, stimulate demand by driving down prices, and free workers from hard, boring work.</p>\n</blockquote>\n<p>工业革命起初使一些工人失去工作，但最后提高生活水平，创造的工作多于毁掉的。作者用<code>but eventually</code>承认这份长远好处。</p>\n<p>随后<code>Likewise</code>又说明自动化最终也应降价、刺激需求、解放辛苦乏味的劳动。这里延续了技术可能有益的判断。</p>\n<p>B却说乐观者几乎没有支持，忽略了作者亲自列出的历史结果和相似推论。承认中期困难，并不等于否定长远好处。</p>\n<p><strong>作者先给出工业革命的好结果，再说自动化也应带来好处，能说乐观看法几乎没支持吗？</strong></p>\n<p>不能。原段明确承认了这些支持，只是接着补出中期难题。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"22题","raw":"### C. Issues arising from automation need to be tackled.\n\n> 自动化引发的问题需要得到处理。\n\n把C接回题干，它说的是：作者认为自动化引发的问题需要得到处理。\n\nC说自动化的问题需要处理。第3段最后`But in the medium term`把时间从最终结果拉回来，我们看接下来要求什么。\n\n> But in the medium term, middle-class workers may need a lot of help adjusting.\n\n前面说最终可能增加工作、提高生活，末句却提醒，处在过渡中的中产工人可能需要很多帮助。\n\n这说明不能拿最终的社会好处，直接代替现在这些工人的适应工作。新技能怎样获得、就业怎样过渡，都需要有人处理。\n\nC的`need to be tackled`就是不能把这些问题放着不管，与`need a lot of help adjusting`说的是同一项要求。\n\n**长远可能受益，却仍有工人需要大量帮助，是否说明自动化带来的问题必须处理？**\n\n是。C直接接住作者在转折后提出的帮助需求。\n\n**第一轮判断：C保留。**","articleRects":[[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46]],"questionRects":[[280,756,784,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"22","paragraphPids":[2]},"html":"<h3>C. Issues arising from automation need to be tackled.</h3>\n<blockquote><p>自动化引发的问题需要得到处理。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为自动化引发的问题需要得到处理。</p>\n<p>C说自动化的问题需要处理。第3段最后<code>But in the medium term</code>把时间从最终结果拉回来，我们看接下来要求什么。</p>\n<blockquote><p>But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<p>前面说最终可能增加工作、提高生活，末句却提醒，处在过渡中的中产工人可能需要很多帮助。</p>\n<p>这说明不能拿最终的社会好处，直接代替现在这些工人的适应工作。新技能怎样获得、就业怎样过渡，都需要有人处理。</p>\n<p>C的<code>need to be tackled</code>就是不能把这些问题放着不管，与<code>need a lot of help adjusting</code>说的是同一项要求。</p>\n<p><strong>长远可能受益，却仍有工人需要大量帮助，是否说明自动化带来的问题必须处理？</strong></p>\n<p>是。C直接接住作者在转折后提出的帮助需求。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"22题","raw":"### D. Negative consequences of new tech can be avoided.\n\n> 新技术的负面后果可以避免。\n\n把D接回题干，它说的是：作者认为新技术的负面后果可以避免。\n\nD说负面后果可以避免。第3段已经写过有人失去工作，末句又提出帮助适应，我们先看它对将来帮助的结果说了多少。\n\n> The Industrial Revolution didn’t go so well for Luddites whose jobs were displaced by mechanized **[xxx]**\n\n> But in the medium term, middle-class workers may need a lot of help adjusting.\n\n工业革命中失去工作的例子说明技术会给一部分人带来冲击，但过去有损失，并不能直接证明未来的损失都无法预防。\n\n眼下作者说中产工人需要帮助，还没有在这一段展开帮助如何发挥作用。有些措施也许能预防部分损失，有些可能是冲击发生后帮助调整。\n\n因此，D不能仅凭过去的失业被直接排除，也还不能由“需要帮助”就确定作者强调的是避免负面后果的可能性。先留下，看后面的办法具体在做什么。\n\n**这一段尚未展开帮助措施，现在能确定它们是预防损失，还是帮助承受冲击的人适应吗？**\n\n还不能完全分清。D先与C保留，继续看后文。\n\n**第一轮判断：D保留。**","articleRects":[[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46]],"questionRects":[[280,819,809,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"22","paragraphPids":[2]},"html":"<h3>D. Negative consequences of new tech can be avoided.</h3>\n<blockquote><p>新技术的负面后果可以避免。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为新技术的负面后果可以避免。</p>\n<p>D说负面后果可以避免。第3段已经写过有人失去工作，末句又提出帮助适应，我们先看它对将来帮助的结果说了多少。</p>\n<blockquote><p>The Industrial Revolution didn’t go so well for Luddites whose jobs were displaced by mechanized <strong>[xxx]</strong></p>\n</blockquote>\n<blockquote><p>But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<p>工业革命中失去工作的例子说明技术会给一部分人带来冲击，但过去有损失，并不能直接证明未来的损失都无法预防。</p>\n<p>眼下作者说中产工人需要帮助，还没有在这一段展开帮助如何发挥作用。有些措施也许能预防部分损失，有些可能是冲击发生后帮助调整。</p>\n<p>因此，D不能仅凭过去的失业被直接排除，也还不能由“需要帮助”就确定作者强调的是避免负面后果的可能性。先留下，看后面的办法具体在做什么。</p>\n<p><strong>这一段尚未展开帮助措施，现在能确定它们是预防损失，还是帮助承受冲击的人适应吗？</strong></p>\n<p>还不能完全分清。D先与C保留，继续看后文。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"22题","raw":"### 22题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D保留。\n\n暂时保留：C、D。\n\n第一遍留下C、D。作者明确提出中期适应需要帮助；这种帮助是否还意味着负面后果可以避免，单看本段仍未展开。","articleRects":[],"questionRects":[[226,567,904,38],[281,630,760,38],[280,693,795,38],[280,756,784,38],[280,819,809,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"22"},"html":"<h3>22题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D保留。</li></ul>\n<p>暂时保留：C、D。</p>\n<p>第一遍留下C、D。作者明确提出中期适应需要帮助；这种帮助是否还意味着负面后果可以避免，单看本段仍未展开。</p>\n"},{"section":"23题","raw":"## 23题\n\n> Education in the age of automation should put more emphasis on ______.  \n> 自动化时代的教育应该更加重视______。\n\n题干直接点出Education，并问more emphasis。第4段开头出现education and job training，随后又有focus less与more on的对照，先完整精读第4段。\n\n> 原文参考：\n> \n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. **[xxx]**—from grammar school to college—should evolve to focus less on memorizing facts and more on creativity and complex communication. **[xxx]** schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.\n> \n> 开始精读：\n> \n> The first step, / as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, / should be rethinking education and job training. / **[xxx]**—from grammar school to college—should evolve / to focus less on memorizing facts and more on creativity and complex communication. / **[xxx]** schools should do a better job of fostering problem-solving skills / and helping students work alongside robots. / Online education can supplement the traditional kind. / It could make extra training and instruction affordable. / Professionals trying to acquire new skills will be able to do so without going into debt.\n> \n> 第一步， / 正如埃里克·布林约尔松和安德鲁·麦卡菲在《第二次机器时代》中所主张的， / 应该是重新思考教育和工作培训。 / **[xxx]**——从文法学校到大学——应该发展变化， / 减少对记忆事实的侧重，增加对创造力和复杂沟通的侧重。 / **[xxx]**学校应该更好地培养解决问题的技能， / 并帮助学生与机器人一起工作。 / 在线教育可以补充传统教育。 / 它可以使额外的培训和教学费用变得负担得起。 / 试图掌握新技能的专业人士将能够做到这一点，而无需陷入债务。\n\n空格需要填教育应当更加重视的内容，要核对作者把记忆事实、创造力、沟通以及解决问题的能力分别放在什么位置。\n\n接下来按A—D逐项看。","articleRects":[[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38]],"questionRects":[[226,945,1012,38],[280,1008,299,37],[280,1071,301,37],[280,1133,285,31],[280,1196,301,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"23","initialReadingPids":[3]},"html":"<h2>23题</h2>\n<blockquote><p>Education in the age of automation should put more emphasis on ______.<br />\n自动化时代的教育应该更加重视______。</p>\n</blockquote>\n<p>题干直接点出Education，并问more emphasis。第4段开头出现education and job training，随后又有focus less与more on的对照，先完整精读第4段。</p>\n<blockquote><p>原文参考：</p>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. <strong>[xxx]</strong>—from grammar school to college—should evolve to focus less on memorizing facts and more on creativity and complex communication. <strong>[xxx]</strong> schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n<p>开始精读：</p>\n<p>The first step, / as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, / should be rethinking education and job training. / <strong>[xxx]</strong>—from grammar school to college—should evolve / to focus less on memorizing facts and more on creativity and complex communication. / <strong>[xxx]</strong> schools should do a better job of fostering problem-solving skills / and helping students work alongside robots. / Online education can supplement the traditional kind. / It could make extra training and instruction affordable. / Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n<p>第一步， / 正如埃里克·布林约尔松和安德鲁·麦卡菲在《第二次机器时代》中所主张的， / 应该是重新思考教育和工作培训。 / <strong>[xxx]</strong>——从文法学校到大学——应该发展变化， / 减少对记忆事实的侧重，增加对创造力和复杂沟通的侧重。 / <strong>[xxx]</strong>学校应该更好地培养解决问题的技能， / 并帮助学生与机器人一起工作。 / 在线教育可以补充传统教育。 / 它可以使额外的培训和教学费用变得负担得起。 / 试图掌握新技能的专业人士将能够做到这一点，而无需陷入债务。</p>\n</blockquote>\n<p>空格需要填教育应当更加重视的内容，要核对作者把记忆事实、创造力、沟通以及解决问题的能力分别放在什么位置。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"23题","raw":"### A. creative potential\n\n> 创造潜能。\n\n把A接回题干，它说的是：自动化时代的教育应该更加重视创造潜能。\n\nA说创造潜能，原文直接有`more on creativity`。我们把`less`和`more`各自接的内容读清。\n\n> **[xxx]**—from grammar school to college—should evolve to focus less on memorizing facts and more on creativity and complex communication.\n\n要减少侧重的是记忆事实，要增加侧重的是创造力和复杂沟通。原文不是笼统说教育要多教知识，而是明确改变侧重。\n\nA的`creative potential`说学生的创造潜能，与`creativity`相接。教育着重培养这种能力，就是把潜能发展出来。\n\n选A不需要把旁边的沟通删掉，只要它属于作者明确说应该增加关注的一项即可。\n\n**A的创造潜能，能否对应原文明确放在`more on`后面的创造力？**\n\n能。它正是作者要求教育更重视的能力之一。\n\n**第一轮判断：A保留。**","articleRects":[[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38]],"questionRects":[[280,1008,299,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"23","paragraphPids":[3]},"html":"<h3>A. creative potential</h3>\n<blockquote><p>创造潜能。</p>\n</blockquote>\n<p>把A接回题干，它说的是：自动化时代的教育应该更加重视创造潜能。</p>\n<p>A说创造潜能，原文直接有<code>more on creativity</code>。我们把<code>less</code>和<code>more</code>各自接的内容读清。</p>\n<blockquote><p><strong>[xxx]</strong>—from grammar school to college—should evolve to focus less on memorizing facts and more on creativity and complex communication.</p>\n</blockquote>\n<p>要减少侧重的是记忆事实，要增加侧重的是创造力和复杂沟通。原文不是笼统说教育要多教知识，而是明确改变侧重。</p>\n<p>A的<code>creative potential</code>说学生的创造潜能，与<code>creativity</code>相接。教育着重培养这种能力，就是把潜能发展出来。</p>\n<p>选A不需要把旁边的沟通删掉，只要它属于作者明确说应该增加关注的一项即可。</p>\n<p><strong>A的创造潜能，能否对应原文明确放在<code>more on</code>后面的创造力？</strong></p>\n<p>能。它正是作者要求教育更重视的能力之一。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"23题","raw":"### B. job-hunting skills\n\n> 求职技巧。\n\n把B接回题干，它说的是：自动化时代的教育应该更加重视求职技巧。\n\nB说求职技巧，原文也有`skills`，我们看这些技能前面到底是什么。\n\n> **[xxx]** schools should do a better job of fostering problem-solving skills and helping students work alongside robots.\n\n> Professionals trying to acquire new skills will be able to do so without going into debt.\n\n学校要培养的是`problem-solving skills`，解决问题的技能，并帮助学生与机器人一起工作。后面专业人士获取新技能，也是在说继续学会新的工作能力。\n\nB的求职技巧则是怎样找到工作，例如怎样申请、面试。这不是解决工作中的问题，也不等于掌握与机器人共事的本领。\n\n两者都可能对就业有帮助，但题干问教育具体更重视什么，不能把原文明说的技能换成另一种。\n\n**解决问题、与机器人一起工作，是求职过程中申请工作的技巧吗？**\n\n不是。原文关注实际能力，B换成了找工作的技巧。\n\n**第一轮判断：B排除。**","articleRects":[[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38]],"questionRects":[[280,1071,301,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"23","paragraphPids":[3]},"html":"<h3>B. job-hunting skills</h3>\n<blockquote><p>求职技巧。</p>\n</blockquote>\n<p>把B接回题干，它说的是：自动化时代的教育应该更加重视求职技巧。</p>\n<p>B说求职技巧，原文也有<code>skills</code>，我们看这些技能前面到底是什么。</p>\n<blockquote><p><strong>[xxx]</strong> schools should do a better job of fostering problem-solving skills and helping students work alongside robots.</p>\n</blockquote>\n<blockquote><p>Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</blockquote>\n<p>学校要培养的是<code>problem-solving skills</code>，解决问题的技能，并帮助学生与机器人一起工作。后面专业人士获取新技能，也是在说继续学会新的工作能力。</p>\n<p>B的求职技巧则是怎样找到工作，例如怎样申请、面试。这不是解决工作中的问题，也不等于掌握与机器人共事的本领。</p>\n<p>两者都可能对就业有帮助，但题干问教育具体更重视什么，不能把原文明说的技能换成另一种。</p>\n<p><strong>解决问题、与机器人一起工作，是求职过程中申请工作的技巧吗？</strong></p>\n<p>不是。原文关注实际能力，B换成了找工作的技巧。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"23题","raw":"### C. individual needs\n\n> 个人需求。\n\n把C接回题干，它说的是：自动化时代的教育应该更加重视个人需求。\n\nC说个人需求。第4段的`more on`后面列了具体能力，我们看有没有把因人而异的需求写成重点。\n\n> should evolve to focus less on memorizing facts and more on creativity and complex communication.\n\n> **[xxx]** schools should do a better job of fostering problem-solving skills and helping students work alongside robots.\n\n原文要求少背事实，多培养创造力、沟通和解决问题能力。这些是教育要培养的内容。\n\nC若说个人需求，重点会变成不同学生需要什么、怎样满足各人的差异。原段没有这样比较学生，也没有把不同人的需求逐一列为调整教学的依据。\n\n在线教育让培训负担得起，确实方便个人学习，但这种方便也不等于文章把“个人需求”选为教育的新重点。\n\n**作者列出的创造力和解决问题能力，能直接换成按每个人的需求安排教育吗？**\n\n不能。C另加了原段没有说明的个体需求安排。\n\n**第一轮判断：C排除。**","articleRects":[[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38]],"questionRects":[[280,1133,285,31]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"23","paragraphPids":[3]},"html":"<h3>C. individual needs</h3>\n<blockquote><p>个人需求。</p>\n</blockquote>\n<p>把C接回题干，它说的是：自动化时代的教育应该更加重视个人需求。</p>\n<p>C说个人需求。第4段的<code>more on</code>后面列了具体能力，我们看有没有把因人而异的需求写成重点。</p>\n<blockquote><p>should evolve to focus less on memorizing facts and more on creativity and complex communication.</p>\n</blockquote>\n<blockquote><p><strong>[xxx]</strong> schools should do a better job of fostering problem-solving skills and helping students work alongside robots.</p>\n</blockquote>\n<p>原文要求少背事实，多培养创造力、沟通和解决问题能力。这些是教育要培养的内容。</p>\n<p>C若说个人需求，重点会变成不同学生需要什么、怎样满足各人的差异。原段没有这样比较学生，也没有把不同人的需求逐一列为调整教学的依据。</p>\n<p>在线教育让培训负担得起，确实方便个人学习，但这种方便也不等于文章把“个人需求”选为教育的新重点。</p>\n<p><strong>作者列出的创造力和解决问题能力，能直接换成按每个人的需求安排教育吗？</strong></p>\n<p>不能。C另加了原段没有说明的个体需求安排。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"23题","raw":"### D. cooperative spirit\n\n> 合作精神。\n\n把D接回题干，它说的是：自动化时代的教育应该更加重视合作精神。\n\nD说合作精神，容易让人想到`communication`和`work alongside robots`。我们看看原文是在谈怎样沟通、怎样工作，还是在要求一种精神品质。\n\n> should evolve to focus less on memorizing facts and more on creativity and complex communication.\n\n> **[xxx]** schools should do a better job of fostering problem-solving skills and helping students work alongside robots.\n\n复杂沟通是一种能力，与机器人一起工作是一种需要学会的工作方式。原文还同时要求解决问题，都是让人适应新的工作。\n\nD说合作精神，强调愿意合作、重视集体的态度。能和机器人并行工作，并没有自动说明这里要培养这种精神。\n\n不能只因`alongside`有“一起”的意思，就把具体工作能力译成合作精神。原句的重点仍是创造力、沟通和技能。\n\n**学会与机器人一起工作，就等于原文明说教育要更重视合作精神吗？**\n\n不等于。一起工作的本领与合作精神不是同一项要求，D没有明确对应。\n\n**第一轮判断：D排除。**","articleRects":[[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38]],"questionRects":[[280,1196,301,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"23","paragraphPids":[3]},"html":"<h3>D. cooperative spirit</h3>\n<blockquote><p>合作精神。</p>\n</blockquote>\n<p>把D接回题干，它说的是：自动化时代的教育应该更加重视合作精神。</p>\n<p>D说合作精神，容易让人想到<code>communication</code>和<code>work alongside robots</code>。我们看看原文是在谈怎样沟通、怎样工作，还是在要求一种精神品质。</p>\n<blockquote><p>should evolve to focus less on memorizing facts and more on creativity and complex communication.</p>\n</blockquote>\n<blockquote><p><strong>[xxx]</strong> schools should do a better job of fostering problem-solving skills and helping students work alongside robots.</p>\n</blockquote>\n<p>复杂沟通是一种能力，与机器人一起工作是一种需要学会的工作方式。原文还同时要求解决问题，都是让人适应新的工作。</p>\n<p>D说合作精神，强调愿意合作、重视集体的态度。能和机器人并行工作，并没有自动说明这里要培养这种精神。</p>\n<p>不能只因<code>alongside</code>有“一起”的意思，就把具体工作能力译成合作精神。原句的重点仍是创造力、沟通和技能。</p>\n<p><strong>学会与机器人一起工作，就等于原文明说教育要更重视合作精神吗？</strong></p>\n<p>不等于。一起工作的本领与合作精神不是同一项要求，D没有明确对应。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"23题","raw":"### 23题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。原文在增加侧重的内容中明确写出creativity，支持创造潜能。","articleRects":[],"questionRects":[[226,945,1012,38],[280,1008,299,37],[280,1071,301,37],[280,1133,285,31],[280,1196,301,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"23"},"html":"<h3>23题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。原文在增加侧重的内容中明确写出creativity，支持创造潜能。</p>\n"},{"section":"24题","raw":"## 24题\n\n> The author suggests that tax policies be aimed at ______.  \n> 作者建议税收政策应以______为目标。\n\n题干直接出现tax policies，第6段同时谈taxes、具体税收调整及This would后的效果，完整精读第6段，区分采取的做法与希望实现的结果。\n\n> 原文参考：\n> \n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage **[xxx]** such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.\n> \n> 开始精读：\n> \n> Finally, / because automation threatens to widen the gap between capital income and labor income, / taxes and the safety net will have to be rethought. / Taxes on low-wage labor need to be cut, / and wage **[xxx]** such as the earned income tax credit should be expanded: / This would boost incomes, / encourage work, / reward companies for job creation, / and reduce inequality.\n> \n> 最后， / 由于自动化有可能扩大资本收入与劳动收入之间的差距， / 税收和社会保障网将不得不被重新思考。 / 针对低工资劳动的税需要降低， / 而工资**[xxx]**，如劳动所得税收抵免，应当扩大： / 这将提高收入， / 鼓励工作， / 奖励创造就业的公司， / 并减少不平等。\n\n空格要填税收政策的目标，既要看自动化引发哪种收入差距，也要看减税和扩大相关安排之后作者列出的收入、就业及不平等效果。\n\n接下来按A—D逐项看。","articleRects":[[274,1615,1122,38],[202,1659,1184,37],[202,1703,1194,37],[202,1747,1194,37],[202,1791,954,37]],"questionRects":[[226,1322,775,38],[280,1385,689,38],[280,1448,669,38],[280,1511,662,37],[280,1574,662,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"24","initialReadingPids":[5]},"html":"<h2>24题</h2>\n<blockquote><p>The author suggests that tax policies be aimed at ______.<br />\n作者建议税收政策应以______为目标。</p>\n</blockquote>\n<p>题干直接出现tax policies，第6段同时谈taxes、具体税收调整及This would后的效果，完整精读第6段，区分采取的做法与希望实现的结果。</p>\n<blockquote><p>原文参考：</p>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage <strong>[xxx]</strong> such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n<p>开始精读：</p>\n<p>Finally, / because automation threatens to widen the gap between capital income and labor income, / taxes and the safety net will have to be rethought. / Taxes on low-wage labor need to be cut, / and wage <strong>[xxx]</strong> such as the earned income tax credit should be expanded: / This would boost incomes, / encourage work, / reward companies for job creation, / and reduce inequality.</p>\n<p>最后， / 由于自动化有可能扩大资本收入与劳动收入之间的差距， / 税收和社会保障网将不得不被重新思考。 / 针对低工资劳动的税需要降低， / 而工资<strong>[xxx]</strong>，如劳动所得税收抵免，应当扩大： / 这将提高收入， / 鼓励工作， / 奖励创造就业的公司， / 并减少不平等。</p>\n</blockquote>\n<p>空格要填税收政策的目标，既要看自动化引发哪种收入差距，也要看减税和扩大相关安排之后作者列出的收入、就业及不平等效果。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"24题","raw":"### A. encouraging the development of automation\n\n> 鼓励自动化发展。\n\n把A接回题干，它说的是：作者建议税收政策应以鼓励自动化发展为目标。\n\nA说税收要鼓励自动化。第6段开头用`because`说为什么重想税收，我们看自动化在这里带来的是希望促进的结果，还是需要应对的问题。\n\n> because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\n\n> This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.\n\n自动化威胁到资本收入与劳动收入的差距，所以作者才提出税收调整。自动化在这里是引发分配问题的原因。\n\n后面列出的目标是提高收入、鼓励工作、奖励创造就业以及减少不平等，没有把推动更多自动化列进去。\n\nA把税收要应对的原因改成税收要促进的目标。原文并没有提出通过减税去加快机器人取代工作。\n\n**作者因自动化可能拉大收入差距而调整税收，是要促进自动化本身吗？**\n\n不是。税收措施用于帮助收入和就业、缓解差距。\n\n**第一轮判断：A排除。**","articleRects":[[274,1615,1122,38],[202,1659,1184,37],[202,1703,1194,37],[202,1747,1194,37],[202,1791,954,37]],"questionRects":[[280,1385,689,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"24","paragraphPids":[5]},"html":"<h3>A. encouraging the development of automation</h3>\n<blockquote><p>鼓励自动化发展。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者建议税收政策应以鼓励自动化发展为目标。</p>\n<p>A说税收要鼓励自动化。第6段开头用<code>because</code>说为什么重想税收，我们看自动化在这里带来的是希望促进的结果，还是需要应对的问题。</p>\n<blockquote><p>because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.</p>\n</blockquote>\n<blockquote><p>This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n<p>自动化威胁到资本收入与劳动收入的差距，所以作者才提出税收调整。自动化在这里是引发分配问题的原因。</p>\n<p>后面列出的目标是提高收入、鼓励工作、奖励创造就业以及减少不平等，没有把推动更多自动化列进去。</p>\n<p>A把税收要应对的原因改成税收要促进的目标。原文并没有提出通过减税去加快机器人取代工作。</p>\n<p><strong>作者因自动化可能拉大收入差距而调整税收，是要促进自动化本身吗？</strong></p>\n<p>不是。税收措施用于帮助收入和就业、缓解差距。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"24题","raw":"### B. increasing the return on capital investment\n\n> 提高资本投资回报。\n\n把B接回题干，它说的是：作者建议税收政策应以提高资本投资回报为目标。\n\nB说提高资本投资回报。原文同时写资本收入和劳动收入，我们看减税具体落到哪一边。\n\n> automation threatens to widen the gap between capital income and labor income\n\n> Taxes on low-wage labor need to be cut\n\n> This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.\n\n作者要降低低工资劳动的税负，并扩大与工资有关的安排。直接受帮助的是劳动所得，尤其低工资劳动。\n\n原因又是资本收入与劳动收入的差距可能扩大。作者希望改善劳动收入、减少不平等，不是在这一段给资本投资增加回报。\n\n`boost incomes`也要接着前面的具体措施读，不能见到“提高收入”就把它换成提高资本回报。\n\n**作者明确提出给低工资劳动减税，能把目标改成提高资本投资回报吗？**\n\n不能。B把受帮助的收入一方换了。\n\n**第一轮判断：B排除。**","articleRects":[[274,1615,1122,38],[202,1659,1184,37],[202,1703,1194,37],[202,1747,1194,37],[202,1791,954,37]],"questionRects":[[280,1448,669,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"24","paragraphPids":[5]},"html":"<h3>B. increasing the return on capital investment</h3>\n<blockquote><p>提高资本投资回报。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者建议税收政策应以提高资本投资回报为目标。</p>\n<p>B说提高资本投资回报。原文同时写资本收入和劳动收入，我们看减税具体落到哪一边。</p>\n<blockquote><p>automation threatens to widen the gap between capital income and labor income</p>\n</blockquote>\n<blockquote><p>Taxes on low-wage labor need to be cut</p>\n</blockquote>\n<blockquote><p>This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n<p>作者要降低低工资劳动的税负，并扩大与工资有关的安排。直接受帮助的是劳动所得，尤其低工资劳动。</p>\n<p>原因又是资本收入与劳动收入的差距可能扩大。作者希望改善劳动收入、减少不平等，不是在这一段给资本投资增加回报。</p>\n<p><code>boost incomes</code>也要接着前面的具体措施读，不能见到“提高收入”就把它换成提高资本回报。</p>\n<p><strong>作者明确提出给低工资劳动减税，能把目标改成提高资本投资回报吗？</strong></p>\n<p>不能。B把受帮助的收入一方换了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"24题","raw":"### C. easing the hostility between rich and poor\n\n> 缓解穷人与富人之间的敌意。\n\n把C接回题干，它说的是：作者建议税收政策应以缓解穷人与富人之间的敌意为目标。\n\nC说减少穷富之间的敌意。原段写收入差距和不平等，我们检查有没有进一步谈两类人彼此怎样看待。\n\n> automation threatens to widen the gap between capital income and labor income\n\n> This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.\n\n原文需要处理的是资本与劳动收入之间的差距，随后提出提高收入、鼓励工作、增加岗位和减少不平等。\n\n这些都是收入和就业安排。它没有描述穷人仇视富人，或富人对穷人怀有敌意。\n\n收入差距可能让人想到社会矛盾，但那是我们接着联想的一步，不能替换题干所问的作者政策目的。C把经济差距改成了相互敌意。\n\n**减少收入不平等，是否已经等于作者明确要缓解穷富双方的敌意？**\n\n不等于。原文没有建立这种心理上的敌对关系。\n\n**第一轮判断：C排除。**","articleRects":[[274,1615,1122,38],[202,1659,1184,37],[202,1703,1194,37],[202,1747,1194,37],[202,1791,954,37]],"questionRects":[[280,1511,662,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"24","paragraphPids":[5]},"html":"<h3>C. easing the hostility between rich and poor</h3>\n<blockquote><p>缓解穷人与富人之间的敌意。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者建议税收政策应以缓解穷人与富人之间的敌意为目标。</p>\n<p>C说减少穷富之间的敌意。原段写收入差距和不平等，我们检查有没有进一步谈两类人彼此怎样看待。</p>\n<blockquote><p>automation threatens to widen the gap between capital income and labor income</p>\n</blockquote>\n<blockquote><p>This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n<p>原文需要处理的是资本与劳动收入之间的差距，随后提出提高收入、鼓励工作、增加岗位和减少不平等。</p>\n<p>这些都是收入和就业安排。它没有描述穷人仇视富人，或富人对穷人怀有敌意。</p>\n<p>收入差距可能让人想到社会矛盾，但那是我们接着联想的一步，不能替换题干所问的作者政策目的。C把经济差距改成了相互敌意。</p>\n<p><strong>减少收入不平等，是否已经等于作者明确要缓解穷富双方的敌意？</strong></p>\n<p>不等于。原文没有建立这种心理上的敌对关系。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"24题","raw":"### D. preventing the income gap from widening\n\n> 防止收入差距扩大。\n\n把D接回题干，它说的是：作者建议税收政策应以防止收入差距扩大为目标。\n\nD说防止收入差距扩大。第6段以`widen the gap`提出风险，以`reduce inequality`结束，我们把中间的政策接起来。\n\n> because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\n\n> This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.\n\n资本与劳动收入可能越拉越开，是作者重想税收的原因。对低工资劳动减税，可以让劳动者留下更多收入；鼓励工作和创造岗位，也在帮助劳动收入。\n\n因此，后面说减少不平等，正是在回应前面的差距扩大。D把这项前后相接的目标直接说出来。\n\n这里防止差距扩大，不等于承诺所有人收入一样，D没有增加这种绝对结果。\n\n**从可能扩大收入差距写到减少不平等，能否看出税收调整要防止差距继续扩大？**\n\n能。D同时对应政策的起因和预期作用。\n\n**第一轮判断：D保留。**","articleRects":[[274,1615,1122,38],[202,1659,1184,37],[202,1703,1194,37],[202,1747,1194,37],[202,1791,954,37]],"questionRects":[[280,1574,662,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"24","paragraphPids":[5]},"html":"<h3>D. preventing the income gap from widening</h3>\n<blockquote><p>防止收入差距扩大。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者建议税收政策应以防止收入差距扩大为目标。</p>\n<p>D说防止收入差距扩大。第6段以<code>widen the gap</code>提出风险，以<code>reduce inequality</code>结束，我们把中间的政策接起来。</p>\n<blockquote><p>because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.</p>\n</blockquote>\n<blockquote><p>This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n<p>资本与劳动收入可能越拉越开，是作者重想税收的原因。对低工资劳动减税，可以让劳动者留下更多收入；鼓励工作和创造岗位，也在帮助劳动收入。</p>\n<p>因此，后面说减少不平等，正是在回应前面的差距扩大。D把这项前后相接的目标直接说出来。</p>\n<p>这里防止差距扩大，不等于承诺所有人收入一样，D没有增加这种绝对结果。</p>\n<p><strong>从可能扩大收入差距写到减少不平等，能否看出税收调整要防止差距继续扩大？</strong></p>\n<p>能。D同时对应政策的起因和预期作用。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"24题","raw":"### 24题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。税收调整由收入差距可能扩大这一风险引出，并以减少不平等为目标。","articleRects":[],"questionRects":[[226,1322,775,38],[280,1385,689,38],[280,1448,669,38],[280,1511,662,37],[280,1574,662,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"24"},"html":"<h3>24题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。税收调整由收入差距可能扩大这一风险引出，并以减少不平等为目标。</p>\n"},{"section":"25题","raw":"## 25题\n\n> In this text, the author presents a problem with ______.  \n> 在本文中，作者以______的方式呈现了一个问题。\n\n题干用In this text把范围放在整篇，并问作者怎样presents a problem。开头以机器人冲着工作而来的问题起笔，需按自然段把之后怎样展开以及结尾怎样回应读全；先完整读此前未读的第1、5、7段，再接上已读过的其余段落。\n\n> 原文参考：\n> \n> Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next **[xxx]** campaign: What happens when the robots come for their jobs?\n> \n> 开始精读：\n> \n> Among the annoying challenges facing the middle class / is one that will probably go unmentioned in the next **[xxx]** campaign: / What happens when the robots come for their jobs?\n> \n> 在中产阶级面临的那些令人烦恼的挑战中， / 有一项大概不会在下一场**[xxx]**活动中被提到： / 当机器人冲着他们的工作而来时，会发生什么？\n\n> 原文参考：\n> \n> The challenge of coping with automation underlines the need for the U.S. to revive its fading business **[xxx]**: Starting new companies must be made easier. In previous **[xxx]** of **[xxx]** technological change, **[xxx]** smoothed the transition by dreaming up ways to combine labor and machines. The best uses of 3D printers and virtual reality haven’t been invented yet. The U.S. needs the new companies that will invent them.\n> \n> 开始精读：\n> \n> The challenge of coping with automation underlines the need for the U.S. to revive its fading business **[xxx]**: / Starting new companies must be made easier. / In previous **[xxx]** of **[xxx]** technological change, / **[xxx]** smoothed the transition by dreaming up ways to combine labor and machines. / The best uses of 3D printers and virtual reality haven’t been invented yet. / The U.S. needs the new companies that will invent them.\n> \n> 应对自动化的挑战，突出了美国需要重振其正在衰退的商业**[xxx]**： / 必须使创办新公司更容易。 / 在以往**[xxx]**技术变革的**[xxx]**中， / **[xxx]**通过想出把劳动与机器结合的方法，使过渡变得平稳。 / 3D打印机和虚拟现实的最佳用途还没有被发明出来。 / 美国需要那些将发明这些用途的新公司。\n\n> 原文参考：\n> \n> Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation. Destroying the machines that are coming for our jobs would be nuts. But policies to help workers adapt will be indispensable.\n> \n> 开始精读：\n> \n> Technology will improve society in ways big and small over the next few years, / yet this will be little comfort to those who find their lives and careers upended by automation. / Destroying the machines that are coming for our jobs would be nuts. / But policies to help workers adapt will be indispensable.\n> \n> 未来几年，技术将以大大小小的方式改善社会， / 然而，对那些发现自己的生活和职业被自动化颠覆的人来说，这带不了多少安慰。 / 摧毁那些冲着我们的工作而来的机器将是疯狂之举。 / 但帮助工人适应的政策将必不可少。\n\n本题要判断作者呈现自动化就业问题的方式，需要把问题的提出、各段继续写的内容和结尾的回应连起来，而不是只抽出一句关于技术影响的判断。\n\n接下来按A—D逐项看。","articleRects":[[274,297,1121,38],[202,341,1194,38],[202,385,455,38],[274,1351,1122,38],[202,1395,1194,38],[202,1439,1194,38],[202,1483,1194,38],[202,1527,1194,38],[202,1571,551,38],[274,1834,1122,38],[202,1878,1194,38],[202,1922,1194,38],[202,1966,1065,38]],"questionRects":[[226,1699,753,38],[280,1762,355,38],[280,1825,377,38],[280,1888,343,38],[280,1951,331,38],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0,4,6],"qid":"25","initialReadingPids":[0,4,6]},"html":"<h2>25题</h2>\n<blockquote><p>In this text, the author presents a problem with ______.<br />\n在本文中，作者以______的方式呈现了一个问题。</p>\n</blockquote>\n<p>题干用In this text把范围放在整篇，并问作者怎样presents a problem。开头以机器人冲着工作而来的问题起笔，需按自然段把之后怎样展开以及结尾怎样回应读全；先完整读此前未读的第1、5、7段，再接上已读过的其余段落。</p>\n<blockquote><p>原文参考：</p>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next <strong>[xxx]</strong> campaign: What happens when the robots come for their jobs?</p>\n<p>开始精读：</p>\n<p>Among the annoying challenges facing the middle class / is one that will probably go unmentioned in the next <strong>[xxx]</strong> campaign: / What happens when the robots come for their jobs?</p>\n<p>在中产阶级面临的那些令人烦恼的挑战中， / 有一项大概不会在下一场<strong>[xxx]</strong>活动中被提到： / 当机器人冲着他们的工作而来时，会发生什么？</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>The challenge of coping with automation underlines the need for the U.S. to revive its fading business <strong>[xxx]</strong>: Starting new companies must be made easier. In previous <strong>[xxx]</strong> of <strong>[xxx]</strong> technological change, <strong>[xxx]</strong> smoothed the transition by dreaming up ways to combine labor and machines. The best uses of 3D printers and virtual reality haven’t been invented yet. The U.S. needs the new companies that will invent them.</p>\n<p>开始精读：</p>\n<p>The challenge of coping with automation underlines the need for the U.S. to revive its fading business <strong>[xxx]</strong>: / Starting new companies must be made easier. / In previous <strong>[xxx]</strong> of <strong>[xxx]</strong> technological change, / <strong>[xxx]</strong> smoothed the transition by dreaming up ways to combine labor and machines. / The best uses of 3D printers and virtual reality haven’t been invented yet. / The U.S. needs the new companies that will invent them.</p>\n<p>应对自动化的挑战，突出了美国需要重振其正在衰退的商业<strong>[xxx]</strong>： / 必须使创办新公司更容易。 / 在以往<strong>[xxx]</strong>技术变革的<strong>[xxx]</strong>中， / <strong>[xxx]</strong>通过想出把劳动与机器结合的方法，使过渡变得平稳。 / 3D打印机和虚拟现实的最佳用途还没有被发明出来。 / 美国需要那些将发明这些用途的新公司。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation. Destroying the machines that are coming for our jobs would be nuts. But policies to help workers adapt will be indispensable.</p>\n<p>开始精读：</p>\n<p>Technology will improve society in ways big and small over the next few years, / yet this will be little comfort to those who find their lives and careers upended by automation. / Destroying the machines that are coming for our jobs would be nuts. / But policies to help workers adapt will be indispensable.</p>\n<p>未来几年，技术将以大大小小的方式改善社会， / 然而，对那些发现自己的生活和职业被自动化颠覆的人来说，这带不了多少安慰。 / 摧毁那些冲着我们的工作而来的机器将是疯狂之举。 / 但帮助工人适应的政策将必不可少。</p>\n</blockquote>\n<p>本题要判断作者呈现自动化就业问题的方式，需要把问题的提出、各段继续写的内容和结尾的回应连起来，而不是只抽出一句关于技术影响的判断。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"25题","raw":"### A. opposing views on it\n\n> 围绕它的对立观点。\n\n把A接回题干，它说的是：作者呈现自动化就业问题时，同时展示了围绕它的对立观点。\n\nA说文章展示围绕问题的对立观点。第3段有乐观者，也有`But`，我们看看两边是否真在对同一件事作相反判断。\n\n> Optimists point out that technological **[xxx]** has benefited workers in the past.\n\n> Likewise, automation should eventually boost **[xxx]**, stimulate demand by driving down prices, and free workers from hard, boring work.\n\n> But in the medium term, middle-class workers may need a lot of help adjusting.\n\n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\n\n乐观者说技术长远可以使工人受益，作者也接着认可工业革命的最终结果。转折后说的却是中期过渡需要帮助。\n\n长远有益和中期有困难可以同时成立，作者不是把它们当成必须二选一的两派争论。\n\n后面又以`The first step`进入教育等办法，没有持续让赞成和反对自动化的双方交锋。A把时间不同的两种判断读成了全文的对立观点安排。\n\n**长远受益和中期需要帮助互相排斥吗，文章随后又是在争论两派还是提出办法？**\n\n并不排斥，随后是在提出帮助办法。A没有接住全文展开。\n\n**第一轮判断：A排除。**","articleRects":[[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46],[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38]],"questionRects":[[280,1762,355,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"25","paragraphPids":[2,3]},"html":"<h3>A. opposing views on it</h3>\n<blockquote><p>围绕它的对立观点。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者呈现自动化就业问题时，同时展示了围绕它的对立观点。</p>\n<p>A说文章展示围绕问题的对立观点。第3段有乐观者，也有<code>But</code>，我们看看两边是否真在对同一件事作相反判断。</p>\n<blockquote><p>Optimists point out that technological <strong>[xxx]</strong> has benefited workers in the past.</p>\n</blockquote>\n<blockquote><p>Likewise, automation should eventually boost <strong>[xxx]</strong>, stimulate demand by driving down prices, and free workers from hard, boring work.</p>\n</blockquote>\n<blockquote><p>But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<blockquote><p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n</blockquote>\n<p>乐观者说技术长远可以使工人受益，作者也接着认可工业革命的最终结果。转折后说的却是中期过渡需要帮助。</p>\n<p>长远有益和中期有困难可以同时成立，作者不是把它们当成必须二选一的两派争论。</p>\n<p>后面又以<code>The first step</code>进入教育等办法，没有持续让赞成和反对自动化的双方交锋。A把时间不同的两种判断读成了全文的对立观点安排。</p>\n<p><strong>长远受益和中期需要帮助互相排斥吗，文章随后又是在争论两派还是提出办法？</strong></p>\n<p>并不排斥，随后是在提出帮助办法。A没有接住全文展开。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"25题","raw":"### B. possible solutions to it\n\n> 解决它的可能办法。\n\n把B接回题干，它说的是：作者在呈现自动化就业问题的同时，给出解决它的可能办法。\n\nB说提出问题后给出可能办法。第3段末说需要帮助，第4段开头直接说第一步，我们顺着后面的行动句看。\n\n> middle-class workers may need a lot of help adjusting.\n\n> should be rethinking education and job training.\n\n> Starting new companies must be made easier.\n\n> taxes and the safety net will have to be rethought.\n\n> But policies to help workers adapt will be indispensable.\n\n先重新思考教育与培训，再让创办新公司更容易，最后调整税收与保障。每一项都在回答自动化改变就业后该怎样帮助人。\n\n结尾又说帮助工人适应的政策必不可少，正把这些建议收回来。\n\nB没有说这些办法已经全部实施或保证解决一切，只说可能的解决办法，符合文中`should`、`must`这些提出建议的写法。\n\n**从帮助需求接到教育、创业、税收建议，是否就是提出问题并给出应对办法？**\n\n是。B能接上中间几段的具体行动和结尾的政策要求。\n\n**第一轮判断：B保留。**","articleRects":[[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46],[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38],[274,1351,1122,38],[202,1395,1194,38],[202,1439,1194,38],[202,1483,1194,38],[202,1527,1194,38],[202,1571,551,38],[274,1615,1122,38],[202,1659,1184,37],[202,1703,1194,37],[202,1747,1194,37],[202,1791,954,37],[274,1834,1122,38],[202,1878,1194,38],[202,1922,1194,38],[202,1966,1065,38]],"questionRects":[[280,1825,377,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"25","paragraphPids":[2,3,4,5,6]},"html":"<h3>B. possible solutions to it</h3>\n<blockquote><p>解决它的可能办法。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者在呈现自动化就业问题的同时，给出解决它的可能办法。</p>\n<p>B说提出问题后给出可能办法。第3段末说需要帮助，第4段开头直接说第一步，我们顺着后面的行动句看。</p>\n<blockquote><p>middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<blockquote><p>should be rethinking education and job training.</p>\n</blockquote>\n<blockquote><p>Starting new companies must be made easier.</p>\n</blockquote>\n<blockquote><p>taxes and the safety net will have to be rethought.</p>\n</blockquote>\n<blockquote><p>But policies to help workers adapt will be indispensable.</p>\n</blockquote>\n<p>先重新思考教育与培训，再让创办新公司更容易，最后调整税收与保障。每一项都在回答自动化改变就业后该怎样帮助人。</p>\n<p>结尾又说帮助工人适应的政策必不可少，正把这些建议收回来。</p>\n<p>B没有说这些办法已经全部实施或保证解决一切，只说可能的解决办法，符合文中<code>should</code>、<code>must</code>这些提出建议的写法。</p>\n<p><strong>从帮助需求接到教育、创业、税收建议，是否就是提出问题并给出应对办法？</strong></p>\n<p>是。B能接上中间几段的具体行动和结尾的政策要求。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"25题","raw":"### C. its alarming impacts\n\n> 它令人担忧的影响。\n\n把C接回题干，它说的是：作者在呈现自动化就业问题时，展示了它令人担忧的影响。\n\nC说展示令人担忧的影响。开头有高风险就业，结尾也有生活和职业被打乱，我们先确认这些影响确实存在。\n\n> About half of U.S. jobs are at high risk of being automated\n\n> This isn’t to be alarmist.\n\n> yet this will be little comfort to those who find their lives and careers upended by automation.\n\n约一半工作面临高自动化风险，中产工作受到挤压，最后又写人们的生活与职业会被颠覆。这些确实是令人担忧的后果。\n\n`This isn’t to be alarmist`不能直接拿来否定C。作者说自己不是故意危言耸听，并没有否认后果会使人担心。\n\n不过，文中还写了教育、企业和税收的办法。C能否概括整篇怎样呈现问题，要看这些影响与建议谁在推动后面的展开，先留下。\n\n**文中有工作风险和生活被打乱的描写，能否先保留“展示担忧影响”这一概括？**\n\n能。C有事实可接，随后再与B比较它是否概括了全文展开。\n\n**第一轮判断：C保留。**","articleRects":[[274,429,1122,38],[202,473,1194,38],[202,517,1195,38],[202,557,1192,46],[202,605,1184,37],[202,649,679,37],[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46],[274,1834,1122,38],[202,1878,1194,38],[202,1922,1194,38],[202,1966,1065,38]],"questionRects":[[280,1888,343,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"25","paragraphPids":[1,2,6]},"html":"<h3>C. its alarming impacts</h3>\n<blockquote><p>它令人担忧的影响。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者在呈现自动化就业问题时，展示了它令人担忧的影响。</p>\n<p>C说展示令人担忧的影响。开头有高风险就业，结尾也有生活和职业被打乱，我们先确认这些影响确实存在。</p>\n<blockquote><p>About half of U.S. jobs are at high risk of being automated</p>\n</blockquote>\n<blockquote><p>This isn’t to be alarmist.</p>\n</blockquote>\n<blockquote><p>yet this will be little comfort to those who find their lives and careers upended by automation.</p>\n</blockquote>\n<p>约一半工作面临高自动化风险，中产工作受到挤压，最后又写人们的生活与职业会被颠覆。这些确实是令人担忧的后果。</p>\n<p><code>This isn’t to be alarmist</code>不能直接拿来否定C。作者说自己不是故意危言耸听，并没有否认后果会使人担心。</p>\n<p>不过，文中还写了教育、企业和税收的办法。C能否概括整篇怎样呈现问题，要看这些影响与建议谁在推动后面的展开，先留下。</p>\n<p><strong>文中有工作风险和生活被打乱的描写，能否先保留“展示担忧影响”这一概括？</strong></p>\n<p>能。C有事实可接，随后再与B比较它是否概括了全文展开。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"25题","raw":"### D. its major variations\n\n> 它的主要变体。\n\n把D接回题干，它说的是：作者在呈现自动化就业问题时，展示了这一问题的主要变体。\n\nD说展示问题的主要变体。我们回看中间几段开头，教育、新企业、税收各是在介绍一种问题，还是要求采取一种行动。\n\n> What happens when the robots come for their jobs?\n\n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\n\n> Starting new companies must be made easier.\n\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\n\n教育段说应重新思考教育与培训，企业段说应使创业更容易，税收段说应调整税负与保障。这些动词都在提出怎么办。\n\n它们不是把自动化就业问题分成几种版本，逐一介绍每种有何不同。即使措施来自不同领域，也不能因此把措施当成问题的变体。\n\nD把建议的分类换成了问题的分类，原文段落的实际动作对不上。\n\n**教育、创业和税收三段是在列出问题的变体，还是从不同方面提出应对措施？**\n\n是在提出应对措施。D把这些办法说成了问题本身的几种变体。\n\n**第一轮判断：D排除。**","articleRects":[[274,297,1121,38],[202,341,1194,38],[202,385,455,38],[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38],[274,1351,1122,38],[202,1395,1194,38],[202,1439,1194,38],[202,1483,1194,38],[202,1527,1194,38],[202,1571,551,38],[274,1615,1122,38],[202,1659,1184,37],[202,1703,1194,37],[202,1747,1194,37],[202,1791,954,37]],"questionRects":[[280,1951,331,38],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"25","paragraphPids":[0,3,4,5]},"html":"<h3>D. its major variations</h3>\n<blockquote><p>它的主要变体。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者在呈现自动化就业问题时，展示了这一问题的主要变体。</p>\n<p>D说展示问题的主要变体。我们回看中间几段开头，教育、新企业、税收各是在介绍一种问题，还是要求采取一种行动。</p>\n<blockquote><p>What happens when the robots come for their jobs?</p>\n</blockquote>\n<blockquote><p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n</blockquote>\n<blockquote><p>Starting new companies must be made easier.</p>\n</blockquote>\n<blockquote><p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.</p>\n</blockquote>\n<p>教育段说应重新思考教育与培训，企业段说应使创业更容易，税收段说应调整税负与保障。这些动词都在提出怎么办。</p>\n<p>它们不是把自动化就业问题分成几种版本，逐一介绍每种有何不同。即使措施来自不同领域，也不能因此把措施当成问题的变体。</p>\n<p>D把建议的分类换成了问题的分类，原文段落的实际动作对不上。</p>\n<p><strong>教育、创业和税收三段是在列出问题的变体，还是从不同方面提出应对措施？</strong></p>\n<p>是在提出应对措施。D把这些办法说成了问题本身的几种变体。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"25题","raw":"### 25题第一次结果\n\n- A排除。\n- B保留。\n- C保留。\n- D排除。\n\n暂时保留：B、C。\n\n第一遍留下B、C。文章既写出工作与生活受到冲击，也提出教育、企业和税收方面的应对建议；两项分别概括了真实存在的内容。","articleRects":[],"questionRects":[[226,1699,753,38],[280,1762,355,38],[280,1825,377,38],[280,1888,343,38],[280,1951,331,38],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"25"},"html":"<h3>25题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂时保留：B、C。</p>\n<p>第一遍留下B、C。文章既写出工作与生活受到冲击，也提出教育、企业和税收方面的应对建议；两项分别概括了真实存在的内容。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | robots come for their jobs | 用“robots come for their jobs”提出中产阶级工作面临机器人介入时会发生什么，将全文问题落在就业处境上。 | 以中产阶级面临的就业变化提出问题。 |\n| 第2段 | at high risk of being automated | 承接这个可能性，以“at high risk of being automated”说明大量工作面临风险，并区分低收入工作、中产阶级和拥有机器人的富人，具体说明为何需要关注中产阶级的处境。 | 比较不同群体的风险，说明问题如何落到收入与工作上。 |\n| 第3段 | raised living standards；in the medium term | 先承认技术能够“raised living standards”，再用“in the medium term”转向中期适应困难；最终收益并不取消劳动者当前需要帮助的问题，这为后面的行动建议作准备。 | 区分长期收益与转型期困难，引出帮助工人适应的必要性。 |\n| 第4段 | The first step；work alongside robots | 用“The first step”承接帮助需求，提出重新思考教育与工作培训，增加创造力、沟通和解决问题的能力，并以“work alongside robots”说明训练要让人能够适应改变后的工作。 | 提出教育培训这一应对办法，让劳动者能够与技术配合。 |\n| 第5段 | Starting new companies；combine labor and machines | 将应对扩展到企业，要求“Starting new companies”变得更容易，又用“combine labor and machines”说明劳动与机器如何结合关系到过渡，新公司还要发明新技术的用途。 | 从现有劳动者的能力转向创造新工作，继续展开适应办法。 |\n| 第6段 | widen the gap；reduce inequality | 以“widen the gap”转向自动化可能扩大的资本与劳动收入差距，提出税收及保障网的调整，并以“reduce inequality”说明其分配目标。 | 补充收入分配问题，把政策应对扩展到税收与保障。 |\n| 第7段 | lives and careers upended；help workers adapt | 再次承认技术会改善社会，但指出这不足以安慰“lives and careers upended”的人；作者反对毁掉机器，并以“help workers adapt”总结政策必须承担的任务。 | 将技术收益与个人冲击合在一起，收束为帮助工人适应的主张。 |\n\n全文观点：自动化可能带来长远收益，也会给劳动者的工作、生活和收入分配带来压力。需要通过教育培训、企业发展和税收保障等政策帮助工人适应，而不能因最终收益而忽略过渡中的困难。","articleRects":[[274,297,1121,38],[202,341,1194,38],[202,385,455,38],[274,429,1122,38],[202,473,1194,38],[202,517,1195,38],[202,557,1192,46],[202,605,1184,37],[202,649,679,37],[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46],[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38],[274,1351,1122,38],[202,1395,1194,38],[202,1439,1194,38],[202,1483,1194,38],[202,1527,1194,38],[202,1571,551,38],[274,1615,1122,38],[202,1659,1184,37],[202,1703,1194,37],[202,1747,1194,37],[202,1791,954,37],[274,1834,1122,38],[202,1878,1194,38],[202,1922,1194,38],[202,1966,1065,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>robots come for their jobs</td><td>用“robots come for their jobs”提出中产阶级工作面临机器人介入时会发生什么，将全文问题落在就业处境上。</td><td>以中产阶级面临的就业变化提出问题。</td></tr><tr><td>第2段</td><td>at high risk of being automated</td><td>承接这个可能性，以“at high risk of being automated”说明大量工作面临风险，并区分低收入工作、中产阶级和拥有机器人的富人，具体说明为何需要关注中产阶级的处境。</td><td>比较不同群体的风险，说明问题如何落到收入与工作上。</td></tr><tr><td>第3段</td><td>raised living standards；in the medium term</td><td>先承认技术能够“raised living standards”，再用“in the medium term”转向中期适应困难；最终收益并不取消劳动者当前需要帮助的问题，这为后面的行动建议作准备。</td><td>区分长期收益与转型期困难，引出帮助工人适应的必要性。</td></tr><tr><td>第4段</td><td>The first step；work alongside robots</td><td>用“The first step”承接帮助需求，提出重新思考教育与工作培训，增加创造力、沟通和解决问题的能力，并以“work alongside robots”说明训练要让人能够适应改变后的工作。</td><td>提出教育培训这一应对办法，让劳动者能够与技术配合。</td></tr><tr><td>第5段</td><td>Starting new companies；combine labor and machines</td><td>将应对扩展到企业，要求“Starting new companies”变得更容易，又用“combine labor and machines”说明劳动与机器如何结合关系到过渡，新公司还要发明新技术的用途。</td><td>从现有劳动者的能力转向创造新工作，继续展开适应办法。</td></tr><tr><td>第6段</td><td>widen the gap；reduce inequality</td><td>以“widen the gap”转向自动化可能扩大的资本与劳动收入差距，提出税收及保障网的调整，并以“reduce inequality”说明其分配目标。</td><td>补充收入分配问题，把政策应对扩展到税收与保障。</td></tr><tr><td>第7段</td><td>lives and careers upended；help workers adapt</td><td>再次承认技术会改善社会，但指出这不足以安慰“lives and careers upended”的人；作者反对毁掉机器，并以“help workers adapt”总结政策必须承担的任务。</td><td>将技术收益与个人冲击合在一起，收束为帮助工人适应的主张。</td></tr></tbody></table>\n<p>全文观点：自动化可能带来长远收益，也会给劳动者的工作、生活和收入分配带来压力。需要通过教育培训、企业发展和税收保障等政策帮助工人适应，而不能因最终收益而忽略过渡中的困难。</p>\n"},{"section":"进阶回查","raw":"## 回查22题：C还是D？\n\nC. Issues arising from automation need to be tackled.\n\nD. Negative consequences of new tech can be avoided.\n\nC要求处理自动化引发的问题，D判断负面后果可以避免。第一遍作者只说工人需要帮助，还没展开这种帮助，所以两项先留下。\n\n现在看后面的办法到底在做什么。第4段说：\n\n> fostering problem-solving skills and helping students work alongside robots\n>\n> Professionals trying to acquire new skills\n\n机器进入工作后，人要学习新本领、学会一起工作。第5段再说：\n\n> combine labor and machines\n>\n> Starting new companies must be made easier.\n\n这里也接受劳动方式已经或将要改变，要求通过新企业和新组合使过渡平稳。不是保证机器不替代工作，而是帮助人在改变中找到出路。\n\n第6段减少不平等，确实可以预防或减轻一些损失。但结尾仍写：\n\n> those who find their lives and careers upended by automation\n>\n> policies to help workers adapt will be indispensable\n\n受冲击的人仍在，作者最终要求他们得到适应帮助。文中既有防止差距扩大的办法，也有冲击发生后学新技能、重新工作的办法。\n\n**作者最后强调的是负面后果可以避免这一可能性，还是不能只等技术带来好处、必须处理这些适应问题？**\n\n是后者。D可以让人想到部分损失能够预防，但它没有说出作者贯穿全文的要求：对已经或即将受影响的人提供实际帮助。C更准确。\n\n> **22题选C。**","articleRects":[[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46],[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38],[274,1351,1122,38],[202,1395,1194,38],[202,1439,1194,38],[202,1483,1194,38],[202,1527,1194,38],[202,1571,551,38],[274,1615,1122,38],[202,1659,1184,37],[202,1703,1194,37],[202,1747,1194,37],[202,1791,954,37],[274,1834,1122,38],[202,1878,1194,38],[202,1922,1194,38],[202,1966,1065,38]],"questionRects":[[226,567,904,38],[281,630,760,38],[280,693,795,38],[280,756,784,38],[280,819,809,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["C","D"],"newEvidencePids":[4,5,6,7],"finalChoice":"C","qid":"22","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查22题：C还是D？</h2>\n<p>C. Issues arising from automation need to be tackled.</p>\n<p>D. Negative consequences of new tech can be avoided.</p>\n<p>C要求处理自动化引发的问题，D判断负面后果可以避免。第一遍作者只说工人需要帮助，还没展开这种帮助，所以两项先留下。</p>\n<p>现在看后面的办法到底在做什么。第4段说：</p>\n<blockquote><p>fostering problem-solving skills and helping students work alongside robots</p>\n<p>Professionals trying to acquire new skills</p>\n</blockquote>\n<p>机器进入工作后，人要学习新本领、学会一起工作。第5段再说：</p>\n<blockquote><p>combine labor and machines</p>\n<p>Starting new companies must be made easier.</p>\n</blockquote>\n<p>这里也接受劳动方式已经或将要改变，要求通过新企业和新组合使过渡平稳。不是保证机器不替代工作，而是帮助人在改变中找到出路。</p>\n<p>第6段减少不平等，确实可以预防或减轻一些损失。但结尾仍写：</p>\n<blockquote><p>those who find their lives and careers upended by automation</p>\n<p>policies to help workers adapt will be indispensable</p>\n</blockquote>\n<p>受冲击的人仍在，作者最终要求他们得到适应帮助。文中既有防止差距扩大的办法，也有冲击发生后学新技能、重新工作的办法。</p>\n<p><strong>作者最后强调的是负面后果可以避免这一可能性，还是不能只等技术带来好处、必须处理这些适应问题？</strong></p>\n<p>是后者。D可以让人想到部分损失能够预防，但它没有说出作者贯穿全文的要求：对已经或即将受影响的人提供实际帮助。C更准确。</p>\n<blockquote><p><strong>22题选C。</strong></p>\n</blockquote>\n"},{"section":"进阶回查","raw":"## 回查25题：B还是C？\n\nB. possible solutions to it\n\nC. its alarming impacts\n\nB说文章提出问题并给出可能办法，C说展示令人担忧的影响。工作风险和生活受冲击确实写了，不能因为作者说不危言耸听就把C当作全错。\n\n我们按顺序接一次全文。开头问机器人来取代中产工作怎么办，第2段说明风险，第3段把长远收益与中期困难分开，最后落到：\n\n> middle-class workers may need a lot of help adjusting.\n\n到这里，问题已经变成“工人需要什么帮助”。第4段马上接：\n\n> The first step ... should be rethinking education and job training.\n\n第一步是教育培训。第5段再提出让创业更容易，第6段以`Finally`接上税收和保障。这三段都在补充办法，没有继续把各种坏影响一项项铺开。\n\n末段再次说生活和职业被颠覆，是提醒技术总体进步不能安慰每个受冲击的人，接着收在：\n\n> But policies to help workers adapt will be indispensable.\n\n也就是说，影响是提出帮助需求的理由，后文重点回答怎样帮助，结尾再强调这些政策不可少。\n\n**文章在说明就业风险后，主要继续列举更多坏后果，还是提出了教育、创业和税收等办法？**\n\n是提出办法。C概括了文中确有的影响描写，B却能把开头问题、中间建议和结尾要求连成整篇的展开。\n\n> **25题选B。**","articleRects":[[274,297,1121,38],[202,341,1194,38],[202,385,455,38],[274,429,1122,38],[202,473,1194,38],[202,517,1195,38],[202,557,1192,46],[202,605,1184,37],[202,649,679,37],[274,692,1122,38],[202,736,1195,38],[202,780,1193,38],[202,824,1189,38],[203,868,1193,38],[202,912,1189,38],[202,952,804,46],[273,1000,1123,38],[202,1044,1184,38],[202,1088,1194,38],[202,1132,1194,38],[203,1176,1193,37],[203,1219,1192,38],[203,1263,1193,38],[202,1307,984,38],[274,1351,1122,38],[202,1395,1194,38],[202,1439,1194,38],[202,1483,1194,38],[202,1527,1194,38],[202,1571,551,38],[274,1615,1122,38],[202,1659,1184,37],[202,1703,1194,37],[202,1747,1194,37],[202,1791,954,37],[274,1834,1122,38],[202,1878,1194,38],[202,1922,1194,38],[202,1966,1065,38]],"questionRects":[[226,1699,753,38],[280,1762,355,38],[280,1825,377,38],[280,1888,343,38],[280,1951,331,38],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["B","C"],"newEvidencePids":[],"finalChoice":"B","qid":"25","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查25题：B还是C？</h2>\n<p>B. possible solutions to it</p>\n<p>C. its alarming impacts</p>\n<p>B说文章提出问题并给出可能办法，C说展示令人担忧的影响。工作风险和生活受冲击确实写了，不能因为作者说不危言耸听就把C当作全错。</p>\n<p>我们按顺序接一次全文。开头问机器人来取代中产工作怎么办，第2段说明风险，第3段把长远收益与中期困难分开，最后落到：</p>\n<blockquote><p>middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<p>到这里，问题已经变成“工人需要什么帮助”。第4段马上接：</p>\n<blockquote><p>The first step ... should be rethinking education and job training.</p>\n</blockquote>\n<p>第一步是
