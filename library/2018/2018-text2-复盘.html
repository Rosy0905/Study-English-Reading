c/td>\n\u003ctd>v.抵制；抵消\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>editor in chief\u003c/td>\n\u003ctd>主编\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>第6段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>critical of\u003c/td>\n\u003ctd>批评\u003c/td>\n\u003ctd>over-tweeting\u003c/td>\n\u003ctd>过量发推\u003c/td>\n\u003ctd>reveal\u003c/td>\n\u003ctd>v.显示\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>mental discipline\u003c/td>\n\u003ctd>思维自律\u003c/td>\n\u003ctd>thinking skill\u003c/td>\n\u003ctd>思维技能\u003c/td>\n\u003ctd>choice\u003c/td>\n\u003ctd>n.选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>share\u003c/td>\n\u003ctd>v.分享\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump&#39;s use of Twitter. The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president&#39;s social media platform.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>A new survey / by Harvard University / finds / more than two-thirds / of young Americans / disapprove of / President Trump&#39;s use of Twitter.\u003c/p>\n\u003cp>The implication is / that Millennials prefer / news from the White House / to be filtered / through other sources, / not a president&#39;s social media platform.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>一项新调查 / 由哈佛大学进行的 / 发现 / 超过三分之二 / 年轻美国人的 / 不赞成 / 特朗普总统使用推特。\u003c/p>\n\u003cp>其含义是 / 千禧一代更喜欢 / 来自白宫的新闻 / 被过滤 / 通过其他来源，/ 而不是总统的社交媒体平台。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>哈佛大学的一项新调查发现，超过三分之二的年轻美国人不赞成特朗普总统使用推特。这意味着千禧一代更希望白宫的新闻通过其他来源过滤，而不是通过总统的社交媒体平台直接发布。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Most Americans rely on social media to check daily headlines. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Most Americans / rely on social media / to check daily headlines.\u003c/p>\n\u003cp>Yet / as distrust has risen / toward all media, / people may be starting / to beef up / their media literacy skills.\u003c/p>\n\u003cp>Such a trend / is badly needed.\u003c/p>\n\u003cp>During the 2016 presidential campaign, / nearly a quarter / of web content / shared by Twitter users / in the politically critical state of Michigan / was fake news, / according to the University of Oxford.\u003c/p>\n\u003cp>And a survey / conducted for BuzzFeed News / found / 44 percent of Facebook users / rarely or never trust / news from the media giant.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>大多数美国人 / 依赖社交媒体 / 来查看每日头条。\u003c/p>\n\u003cp>然而 / 随着不信任感上升 / 对所有媒体，/ 人们可能正在开始 / 加强 / 他们的媒体素养技能。\u003c/p>\n\u003cp>这样的趋势 / 非常需要。\u003c/p>\n\u003cp>在2016年总统竞选期间，/ 将近四分之一 / 网络内容的 / 由推特用户分享的 / 在政治关键州密歇根 / 是假新闻，/ 根据牛津大学的调查。\u003c/p>\n\u003cp>而且一项调查 / 为BuzzFeed新闻进行的 / 发现 / 44%的脸书用户 / 很少或从不相信 / 来自这个媒体巨头的新闻。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>大多数美国人依赖社交媒体查看每日头条。然而，随着对所有媒体的不信任感上升，人们可能正在开始加强他们的媒体素养技能。这样的趋势非常必要。牛津大学的调查显示，在2016年总统竞选期间，政治关键州密歇根的推特用户分享的网络内容中，有近四分之一是假新闻。而为BuzzFeed新闻进行的一项调查发现，44%的脸书用户很少或从不相信来自这个媒体巨头的新闻。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. &quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Young people / who are digital natives / are indeed becoming / more skillful / at separating fact from fiction / in cyberspace.\u003c/p>\n\u003cp>A Knight Foundation focus-group survey / of young people / between ages 14 and 24 / found / they use &quot;distributed trust&quot; / to verify stories.\u003c/p>\n\u003cp>They cross-check sources / and prefer news / from different perspectives – / especially those / that are open / about any bias.\u003c/p>\n\u003cp>&quot;Many young people / assume a great deal of personal responsibility / for educating themselves / and actively seeking out / opposing viewpoints,&quot; / the survey concluded.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>年轻人 / 作为数字原住民的 / 确实正在变得 / 更加熟练 / 在区分事实与虚构方面 / 在网络空间中。\u003c/p>\n\u003cp>骑士基金会的焦点小组调查 / 对年轻人的 / 14到24岁之间的 / 发现 / 他们使用&quot;分布式信任&quot; / 来验证故事。\u003c/p>\n\u003cp>他们交叉核对信息源 / 并且更喜欢新闻 / 来自不同视角的 – / 尤其是那些 / 公开承认的 / 关于任何偏见。\u003c/p>\n\u003cp>&quot;许多年轻人 / 承担了大量个人责任 / 为教育自己 / 并积极寻找 / 相反的观点，&quot; / 调查总结道。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>作为数字原住民的年轻人确实正在变得更加熟练于在网络空间中区分事实与虚构。骑士基金会对14到24岁年轻人的焦点小组调查发现，他们使用&quot;分布式信任&quot;来验证故事。他们交叉核对信息源，更喜欢来自不同视角的新闻——尤其是那些公开承认偏见的新闻。调查总结道：&quot;许多年轻人承担了大量个人责任来教育自己并积极寻找相反的观点。&quot;\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Such active research can have another effect. A 2014 survey conducted in Australia, Britain, and the United States by the University of Wisconsin-Madison found that young people&#39;s reliance on social media led to greater political engagement.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Such active research / can have another effect.\u003c/p>\n\u003cp>A 2014 survey / conducted in Australia, Britain, and the United States / by the University of Wisconsin-Madison / found / that young people&#39;s reliance on social media / led to / greater political engagement.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>这种积极的研究 / 可以产生另一种效果。\u003c/p>\n\u003cp>一项2014年的调查 / 在澳大利亚、英国和美国进行的 / 由威斯康星大学麦迪逊分校 / 发现 / 年轻人对社交媒体的依赖 / 导致了 / 更大的政治参与。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>这种积极的研究可以产生另一种效果。威斯康星大学麦迪逊分校2014年在澳大利亚、英国和美国进行的一项调查发现，年轻人对社交媒体的依赖导致了更大的政治参与。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and interests. This forces users to be more conscious of their role in passing along information. A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting. About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of actual news&quot; via social media. In other words, the choice to share news on social media may be the heart of the issue. &quot;This indicates there is a real personal responsibility in counteracting this problem,&quot; says Roxanne Stone, editor in chief at Barna Group.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>Social media / allows users / to experience news events / more intimately and immediately / while also permitting them / to re-share news / as a projection / of their values and interests.\u003c/p>\n\u003cp>This forces users / to be more conscious / of their role / in passing along information.\u003c/p>\n\u003cp>A survey / by Barna research group / found / the top reason / given by Americans / for the fake news phenomenon / is &quot;reader error,&quot; / more so than / made-up stories / or factual mistakes in reporting.\u003c/p>\n\u003cp>About a third / say / the problem of fake news / lies in / &quot;misinterpretation or exaggeration of actual news&quot; / via social media.\u003c/p>\n\u003cp>In other words, / the choice to share news / on social media / may be / the heart of the issue.\u003c/p>\n\u003cp>&quot;This indicates / there is a real personal responsibility / in counteracting this problem,&quot; / says Roxanne Stone, / editor in chief at Barna Group.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>社交媒体 / 允许用户 / 体验新闻事件 / 更亲密和即时地 / 同时也允许他们 / 重新分享新闻 / 作为一种投射 / 他们的价值观和兴趣的。\u003c/p>\n\u003cp>这迫使用户 / 更加意识到 / 他们的角色 / 在传递信息方面。\u003c/p>\n\u003cp>一项调查 / 由巴纳研究小组进行的 / 发现 / 首要原因 / 美国人给出的 / 对于假新闻现象 / 是&quot;读者错误，&quot; / 更甚于 / 编造的故事 / 或报道中的事实错误。\u003c/p>\n\u003cp>大约三分之一 / 说 / 假新闻的问题 / 在于 / &quot;对实际新闻的误解或夸大&quot; / 通过社交媒体。\u003c/p>\n\u003cp>换句话说，/ 选择分享新闻 / 在社交媒体上 / 可能是 / 问题的核心。\u003c/p>\n\u003cp>&quot;这表明 / 存在真正的个人责任 / 在对抗这个问题上，&quot; / 罗克珊·斯通说，/ 巴纳集团主编。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>社交媒体允许用户更亲密和即时地体验新闻事件，同时也允许他们重新分享新闻作为其价值观和兴趣的投射。这迫使用户更加意识到他们在传递信息方面的角色。巴纳研究小组的一项调查发现，美国人认为假新闻现象的首要原因是&quot;读者错误&quot;，而不是编造的故事或报道中的事实错误。大约三分之一的人说，假新闻的问题在于通过社交媒体&quot;对实际新闻的误解或夸大&quot;。换句话说，在社交媒体上选择分享新闻可能是问题的核心。巴纳集团主编罗克珊·斯通说：&quot;这表明在对抗这个问题上存在真正的个人责任。&quot;\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>So when young people are critical of an over-tweeting president, they reveal a mental discipline in thinking skills – and in their choices on when to share on social media.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>So / when young people / are critical of / an over-tweeting president, / they reveal / a mental discipline / in thinking skills – / and in their choices / on when to share / on social media.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>所以 / 当年轻人 / 批评 / 一个过度发推特的总统时，/ 他们展现了 / 一种思维纪律 / 在思考技能方面 – / 以及在他们的选择上 / 关于何时分享 / 在社交媒体上。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>所以，当年轻人批评一个过度发推特的总统时，他们展现了在思考技能方面的思维纪律——以及在何时在社交媒体上分享信息的选择上的纪律。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>A new survey：(by Harvard University) → finds：(more than two-thirds：(of young Americans) → disapprove of：(President Trump&#39;s use of Twitter)).\u003c/p>\n\u003cp>The implication is：(that Millennials prefer：(news from the White House → to be filtered：(through other sources))，not a president&#39;s social media platform).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Most Americans → rely on social media → to check daily headlines.\u003c/p>\n\u003cp>Yet // as distrust has risen：(toward all media) → people may be starting → to beef up：(their media literacy skills).\u003c/p>\n\u003cp>Such a trend → is badly needed.\u003c/p>\n\u003cp>During the 2016 presidential campaign → nearly a quarter：(of web content：(shared by Twitter users：(in the politically critical state of Michigan))) → was fake news：(according to the University of Oxford).\u003c/p>\n\u003cp>And a survey：(conducted for BuzzFeed News) → found：(44 percent of Facebook users → rarely or never trust：(news from the media giant)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Young people：(who are digital natives) → are indeed becoming → more skillful：(at separating fact from fiction：(in cyberspace)).\u003c/p>\n\u003cp>A Knight Foundation focus-group survey：(of young people：(between ages 14 and 24)) → found：(they use &quot;distributed trust&quot; → to verify stories).\u003c/p>\n\u003cp>They cross-check sources + prefer news：(from different perspectives) – especially those：(that are open：(about any bias)).\u003c/p>\n\u003cp>&quot;Many young people → assume a great deal of personal responsibility：(for educating themselves + actively seeking out：(opposing viewpoints)),&quot; → the survey concluded.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Such active research → can have another effect.\u003c/p>\n\u003cp>A 2014 survey：(conducted in Australia, Britain, and the United States：(by the University of Wisconsin-Madison)) → found：(that young people&#39;s reliance on social media → led to → greater political engagement).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Social media → allows users → to experience news events：(more intimately and immediately) // while also permitting them → to re-share news：(as a projection：(of their values and interests)).\u003c/p>\n\u003cp>This forces users → to be more conscious：(of their role：(in passing along information)).\u003c/p>\n\u003cp>A survey：(by Barna research group) → found：(the top reason：(given by Americans：(for the fake news phenomenon)) → is &quot;reader error&quot;) // more so than：(made-up stories + factual mistakes in reporting).\u003c/p>\n\u003cp>About a third → say：(the problem of fake news → lies in：(&quot;misinterpretation or exaggeration of actual news&quot;：(via social media))).\u003c/p>\n\u003cp>In other words → the choice to share news：(on social media) → may be → the heart of the issue.\u003c/p>\n\u003cp>&quot;This indicates：(there is a real personal responsibility：(in counteracting this problem)),&quot; → says Roxanne Stone：(editor in chief at Barna Group).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>So // when young people → are critical of：(an over-tweeting president) → they reveal → a mental discipline：(in thinking skills) – and in their choices：(on when to share：(on social media)).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>一项新调查：(由哈佛大学进行的) → 发现：(超过三分之二：(年轻美国人的) → 不赞成：(特朗普总统使用推特))。\u003c/p>\n\u003cp>其含义是：(千禧一代更喜欢：(来自白宫的新闻 → 被过滤：(通过其他来源))，而不是总统的社交媒体平台)。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>大多数美国人 → 依赖社交媒体 → 来查看每日头条。\u003c/p>\n\u003cp>然而 // 随着不信任感上升：(对所有媒体) → 人们可能正在开始 → 加强：(他们的媒体素养技能)。\u003c/p>\n\u003cp>这样的趋势 → 非常需要。\u003c/p>\n\u003cp>在2016年总统竞选期间 → 将近四分之一：(网络内容的：(由推特用户分享的：(在政治关键州密歇根))) → 是假新闻：(根据牛津大学的调查)。\u003c/p>\n\u003cp>而且一项调查：(为BuzzFeed新闻进行的) → 发现：(44%的脸书用户 → 很少或从不相信：(来自这个媒体巨头的新闻))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>年轻人：(作为数字原住民的) → 确实正在变得 → 更加熟练：(在区分事实与虚构方面：(在网络空间中))。\u003c/p>\n\u003cp>骑士基金会的焦点小组调查：(对年轻人的：(14到24岁之间的)) → 发现：(他们使用&quot;分布式信任&quot; → 来验证故事)。\u003c/p>\n\u003cp>他们交叉核对信息源 + 更喜欢新闻：(来自不同视角的) – 尤其是那些：(公开承认的：(关于任何偏见))。\u003c/p>\n\u003cp>&quot;许多年轻人 → 承担了大量个人责任：(为教育自己 + 积极寻找：(相反的观点))，&quot; → 调查总结道。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>这种积极的研究 → 可以产生另一种效果。\u003c/p>\n\u003cp>一项2014年的调查：(在澳大利亚、英国和美国进行的：(由威斯康星大学麦迪逊分校)) → 发现：(年轻人对社交媒体的依赖 → 导致了 → 更大的政治参与)。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>社交媒体 → 允许用户 → 体验新闻事件：(更亲密和即时地) // 同时也允许他们 → 重新分享新闻：(作为一种投射：(他们的价值观和兴趣的))。\u003c/p>\n\u003cp>这迫使用户 → 更加意识到：(他们的角色：(在传递信息方面))。\u003c/p>\n\u003cp>一项调查：(由巴纳研究小组进行的) → 发现：(首要原因：(美国人给出的：(对于假新闻现象)) → 是&quot;读者错误&quot;) // 更甚于：(编造的故事 + 报道中的事实错误)。\u003c/p>\n\u003cp>大约三分之一 → 说：(假新闻的问题 → 在于：(&quot;对实际新闻的误解或夸大&quot;：(通过社交媒体)))。\u003c/p>\n\u003cp>换句话说 → 选择分享新闻：(在社交媒体上) → 可能是 → 问题的核心。\u003c/p>\n\u003cp>&quot;这表明：(存在真正的个人责任：(在对抗这个问题上))，&quot; → 罗克珊·斯通说：(巴纳集团主编)。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>所以 // 当年轻人 → 批评：(一个过度发推特的总统) → 他们展现了 → 一种思维纪律：(在思考技能方面) – 以及在他们的选择上：(关于何时分享：(在社交媒体上))。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第2段第4句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>During the 2016 presidential campaign, / nearly a quarter / of web content / shared by Twitter users / in the politically critical state of Michigan / was fake news, / according to the University of Oxford.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>在2016年总统竞选期间，/ 将近四分之一 / 网络内容的 / 由推特用户分享的 / 在政治关键州密歇根 / 是假新闻，/ 根据牛津大学的调查。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把时间、地区与分享者合并，确定统计范围。：\u003c/p>\n\u003cblockquote>\n\u003cp>2016年总统竞选期间，政治关键州密歇根的推特用户分享的网络内容\u003c/p>\n\u003c/blockquote>\n\u003cp>再合并比例、性质和信息来源。：\u003c/p>\n\u003cblockquote>\n\u003cp>其中将近四分之一是假新闻，这是牛津大学给出的调查结果\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>2016年总统竞选期间，政治关键州密歇根的推特用户分享的网络内容；其中将近四分之一是假新闻，这是牛津大学给出的调查结果。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>调查显示，指定用户分享的网络内容近四分之一是假新闻。\u003c/p>\n\u003c/blockquote>\n\u003cp>把according to移到句首交代来源；时间和地区放在比例判断前，shared by限定内容的传播主体。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>据牛津大学的调查，在2016年总统竞选期间，政治上很关键的密歇根州推特用户分享的网络内容，接近四分之一是假新闻。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>nearly a quarter是接近四分之一，不是超过四分之一。\u003c/p>\n\u003cp>统计对象是被这些用户分享的内容，不能扩大成互联网上全部内容或全部美国用户。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>牛津大学的调查显示，在2016年总统竞选期间，政治关键州密歇根的推特用户分享的网络内容中，有近四分之一是假新闻。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>A 2014 survey conducted in Australia, Britain, and the United States by the University of Wisconsin-Madison found that young people&#39;s reliance on social media led to greater political engagement.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>A 2014 survey / conducted in Australia, Britain, and the United States / by the University of Wisconsin-Madison / found / that young people&#39;s reliance on social media / led to / greater political engagement.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>一项2014年的调查 / 在澳大利亚、英国和美国进行的 / 由威斯康星大学麦迪逊分校 / 发现 / 年轻人对社交媒体的依赖 / 导致了 / 更大的政治参与。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并调查的时间、机构和三个开展地点。：\u003c/p>\n\u003cblockquote>\n\u003cp>威斯康星大学麦迪逊分校2014年在澳大利亚、英国和美国开展的调查\u003c/p>\n\u003c/blockquote>\n\u003cp>再合并found后的发现。：\u003c/p>\n\u003cblockquote>\n\u003cp>年轻人依赖社交媒体与更多政治参与相连\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>威斯康星大学麦迪逊分校2014年在澳大利亚、英国和美国开展的调查；年轻人依赖社交媒体与更多政治参与相连。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>一项调查发现，年轻人依赖社交媒体会带来更多政治参与。\u003c/p>\n\u003c/blockquote>\n\u003cp>把长的调查修饰语放在“调查”之前，found后接结果；三国只是调查地点，不是三个分别作出同一结论的机构。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>威斯康星大学麦迪逊分校在2014年于澳大利亚、英国和美国开展的一项调查发现，年轻人对社交媒体的依赖，带来了更多的政治参与。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>greater比较参与程度，不能译成所有年轻人都积极参政。\u003c/p>\n\u003cp>按原句表达调查发现，同时不自行补入实验设计或超出材料范围的因果机制。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>威斯康星大学麦迪逊分校2014年在澳大利亚、英国和美国进行的一项调查发现，年轻人对社交媒体的依赖导致了更大的政治参与。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第5段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>A survey / by Barna research group / found / the top reason / given by Americans / for the fake news phenomenon / is &quot;reader error,&quot; / more so than / made-up stories / or factual mistakes in reporting.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>一项调查 / 由巴纳研究小组进行的 / 发现 / 首要原因 / 美国人给出的 / 对于假新闻现象 / 是&quot;读者错误，&quot; / 更甚于 / 编造的故事 / 或报道中的事实错误。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把survey与found合成调查的报告动作，再合并Americans给出的解释。：\u003c/p>\n\u003cblockquote>\n\u003cp>调查发现，美国人为假新闻现象提出的首要原因是读者错误\u003c/p>\n\u003c/blockquote>\n\u003cp>最后合并比较项，辨清它比较的是解释的重要性。：\u003c/p>\n\u003cblockquote>\n\u003cp>这一解释比编造故事或报道事实错误更受重视\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>调查发现，美国人为假新闻现象提出的首要原因是读者错误；这一解释比编造故事或报道事实错误更受重视。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>调查发现，美国人把读者错误视为假新闻的首要原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>先交代调查来源，再讲人们的判断；more so than接在读者错误之后，不接成事实错误出现频率的统计。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>巴纳研究小组的调查发现，美国人为假新闻现象给出的首要解释是“读者错误”，这一解释的重要性超过编造故事或报道事实上的错误。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>given by Americans说明这是受访者给出的原因，不替换成研究者已经独立证明的唯一原因。\u003c/p>\n\u003cp>reader error译为读者理解和处理信息方面的错误，不限定为读者自己编造新闻。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>巴纳研究小组的一项调查发现，美国人认为假新闻现象的首要原因是&quot;读者错误&quot;，而不是编造的故事或报道中的事实错误。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>30题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪个最适合作为文章的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>A Counteraction Against the Over-tweeting Trend\u003c/strong>\u003c/p>\n\u003cp>对过度发推趋势的反制\u003c/p>\n\u003cp>B. \u003cstrong>A Rise in Critical Skills for Sharing News Online\u003c/strong>\u003c/p>\n\u003cp>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003cp>C. \u003cstrong>The Accumulation of Mutual Trust on Social Media\u003c/strong>\u003c/p>\n\u003cp>社交媒体上相互信任的积累\u003c/p>\n\u003cp>D. \u003cstrong>The Platforms for Projection of Personal Interests\u003c/strong>\u003c/p>\n\u003cp>展示个人兴趣的平台\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。\u003c/td>\n\u003ctd>先摆出一个现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。\u003c/td>\n\u003ctd>再说为什么需要发生变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。\u003c/td>\n\u003ctd>接着把已有变化写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>补充2014年的调查，指出年轻人依赖社交媒体与更多政治参与相联系，展示主动研究的另一种效果。\u003c/td>\n\u003ctd>接着补上另一种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。\u003c/td>\n\u003ctd>再把问题落到每个人身上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到年轻人批评过度发推的总统，把这一表现接到thinking skills与选择何时分享，收回到用户的判断。\u003c/td>\n\u003ctd>最后收回来再作判断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>A. A Counteraction Against the Over-tweeting Trend\u003c/h3>\n\u003cp>对过度发推趋势的反制\u003c/p>\n\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对过度发推趋势的反制\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>摆出年轻人反对过度发推的现象，确立抵制这一趋势的主题。\u003c/td>\n\u003ctd>先摆出一个现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释过量推送造成的信息负担，说明为什么需要改变这种发布方式。\u003c/td>\n\u003ctd>再说为什么需要发生变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>具体写用户已经如何限制、回避或反对频繁发推。\u003c/td>\n\u003ctd>接着把已有变化写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>补充这些反制行动对公众参与或信息环境产生的另一种效果。\u003c/td>\n\u003ctd>接着补上另一种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>把抵制过度发布的责任落到每个人如何发推、如何转发。\u003c/td>\n\u003ctd>再把问题落到每个人身上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到开头判断反制行动如何约束了过度发推的趋势。\u003c/td>\n\u003ctd>最后收回来再作判断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第一段和最后一段确实提到总统发推，所以A不是凭空出现的标题。但看中间的展开，第2段用Twitter和Facebook的调查谈的是新闻可信度；第3段写交叉核对来源、寻找不同观点；第5段还把责任放在读者的理解和分享选择上。这些事情不限于发推多不多，更不是减少发推次数的具体措施。若A是标题，中间几段需要持续说明怎样反对过度发推；实际作者持续说明怎样判断、核实与分享消息。开头的总统行为是观察这种判断变化的一个入口，不能反过来让这个入口包办全部内容。\u003c/p>\n\u003cp>只把标题定为反制过度发推，能覆盖中间核实来源、辨别真假与审慎分享的展开吗？\u003c/p>\n\u003cp>不能。它抓住首尾的一个现象，却把中间持续讨论的新闻判断技能缩掉了。\u003c/p>\n\u003cp>标题要能带着读完整篇，而不只是找出首尾重复的人物行为。A把用来引入与回扣的例子放大成全文目的。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>B. A Rise in Critical Skills for Sharing News Online\u003c/h3>\n\u003cp>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从年轻人不赞同总统推特用法的现象，展示他们开始审慎选择新闻渠道。\u003c/td>\n\u003ctd>先摆出一个现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释假消息与不信任为何要求提高媒介素养。\u003c/td>\n\u003ctd>再说为什么需要发生变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>用多来源核查、寻找不同观点等行为具体展示批判技能的增长。\u003c/td>\n\u003ctd>接着把已有变化写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>补充主动研究与社交媒体使用还关联更高政治参与这一结果。\u003c/td>\n\u003ctd>接着补上另一种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>把误读与夸大新闻的问题落到个人转发责任，说明技能必须用于分享选择。\u003c/td>\n\u003ctd>再把问题落到每个人身上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到开头，将批评过度发推理解为判断与分享上的思维训练。\u003c/td>\n\u003ctd>最后收回来再作判断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的A Rise说一种提升，第3段indeed becoming more skillful直接表现了这种变化；Critical Skills不是逢新闻必反对，而是能够区分事实与虚构、核对来源并接触相反观点。for Sharing News Online又把能力放在网上接收、处理和转发新闻的环境中，能接到第5段的reader error与the choice to share news，也能接到末段when to share。第2段给出为什么需要这种能力，第3段给出已有做法，第5段说明每个人为什么要在分享时承担责任。首尾的总统例子放在这个标题下，正好成为判断能力变化的表现，不必把全文改成对某一个人的专项批评。\u003c/p>\n\u003cp>以在线分享新闻时的判断技能提升作标题，能把需要、具体做法、个人责任和首尾现象连在一起吗？\u003c/p>\n\u003cp>能。各段都能在这个标题下保留自己原本的作用。\u003c/p>\n\u003cp>B没有把谨慎判断读成对平台全盘不信任，也没有把主动查证读成互相盲信。它既涵盖技能变得更好的方向，也涵盖这些技能被用于分享新闻的场景。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>C. The Accumulation of Mutual Trust on Social Media\u003c/h3>\n\u003cp>社交媒体上相互信任的积累\u003c/p>\n\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>社交媒体上相互信任的积累\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>摆出用户通过社交媒体逐渐建立相互信任的现象。\u003c/td>\n\u003ctd>先摆出一个现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释过去不信任和假消息为何需要被新的互信机制改变。\u003c/td>\n\u003ctd>再说为什么需要发生变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>具体写用户怎样核实身份、互动验证并逐步积累彼此信任。\u003c/td>\n\u003ctd>接着把已有变化写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>补充互信增长如何产生参与社会等另一种效果。\u003c/td>\n\u003ctd>接着补上另一种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>说明每个人真实、负责地分享消息怎样为共同信任继续添砖加瓦。\u003c/td>\n\u003ctd>再把问题落到每个人身上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到开头判断社交媒体中的互信确实在积累，并说明这种积累的意义。\u003c/td>\n\u003ctd>最后收回来再作判断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C里的Trust会让人想到第3段“distributed trust”，但不能只在标题和原文之间配一个同词。第2段恰好说distrust has risen、很多用户rarely or never trust news，描写的并不是相互信任越来越多。第3段的做法也不是“因为相信对方，所以接受消息”，而是主动交叉核对不同来源，甚至寻找opposing viewpoints。第5段进一步提醒转发者可能误读，必须对自己的分享负责。C把核实消息时分散依赖来源的方法，改成社交媒体上互信积累的总体趋势；这样第2段的信任降低与第5段的误读风险就很难承接。\u003c/p>\n\u003cp>交叉核对不同来源、避免轻信消息，能够直接概括成社交媒体上的相互信任不断积累吗？\u003c/p>\n\u003cp>不能。核实新闻的方法不等于互信增长的趋势，前文还明确写了不信任增加。\u003c/p>\n\u003cp>C既读错整体变化方向，又把“distributed trust”的具体用法扩成全文主线，无法让几项调查共同服务于这个标题。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>D. The Platforms for Projection of Personal Interests\u003c/h3>\n\u003cp>展示个人兴趣的平台\u003c/p>\n\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>展示个人兴趣的平台\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从用户的社交媒体选择展示平台能够投射个人兴趣。\u003c/td>\n\u003ctd>先摆出一个现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释人们为何需要能表达自身价值和兴趣的信息平台。\u003c/td>\n\u003ctd>再说为什么需要发生变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>具体写用户怎样选材、评论与分享来展示不同的个人兴趣。\u003c/td>\n\u003ctd>接着把已有变化写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>补充兴趣表达还带来社群参与或联系等另一种效果。\u003c/td>\n\u003ctd>接着补上另一种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>把平台的展示功能落到每个用户如何选择自己希望呈现的形象。\u003c/td>\n\u003ctd>再把问题落到每个人身上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到最初选择，判断社交平台作为个人兴趣展示空间的作用。\u003c/td>\n\u003ctd>最后收回来再作判断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D最接近第5段开头values and interests，但那只是说明人们为什么会重新分享消息的一层背景。紧接着作者不是分类介绍兴趣平台，也不是评价平台哪一种展示功能最好，而是谈用户传递信息时的角色，再用Barna调查解释reader error。往前看，第2段的假新闻、第3段的核实来源，都在问消息是否可靠，不在问个人爱好怎样呈现。D把一段中的分享动机拿来覆盖全文，还把题目写成介绍平台的文章；这样年轻人越来越擅长辨别真假的变化就从标题中消失了。\u003c/p>\n\u003cp>第5段提到兴趣与价值观，就足以让整篇变成介绍个人兴趣展示平台的文章吗？\u003c/p>\n\u003cp>不够。该处只是分享行为的一个背景，后面的重点仍是判断新闻和对转发负责。\u003c/p>\n\u003cp>D保留了社交媒体，却丢掉“怎样判断新闻”这一贯穿内容，用局部动机替代全文讨论的能力变化。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>30题结论\u003c/h3>\n\u003cp>\u003cstrong>30. B. A Rise in Critical Skills for Sharing News Online\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>A Rise in Critical Skills for Sharing News Online / 在线分享新闻所需批判性技能的提升\u003c/strong>\u003c/p>\n\u003ch2>26题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Paragraphs 1 and 2, many young Americans cast doubt on ______.\u003cbr>根据第1、2段，许多美国年轻人对什么抱有怀疑？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>跨段细节题。题干要求判断“根据第1、2段，许多美国年轻人对什么抱有怀疑？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump&#39;s use of Twitter. The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president&#39;s social media platform.\u003c/p>\n\u003cp>Most Americans rely on social media to check daily headlines. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003c/blockquote>\n\u003cp>首段以年轻人反对总统推特用法切入，第二段扩展到社交媒体假消息与不信任，继而提出提高媒介素养。\u003c/p>\n\u003ch3>A. the justification of the news-filtering practice\u003c/h3>\n\u003cblockquote>\n\u003cp>对新闻进行筛选的正当性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。年轻人选择的是“经过筛选”，不是“未经筛选”。A用justification把怀疑落在筛选本身的正当性上，相当于把他们偏好的办法说成他们质疑的办法。句首那个名词没有读清，也不会改变prefer后面这组取舍。这里不能因为题干有cast doubt、原文有not，就随便把否定搬到filtered上；not对照的是后面的平台。\u003c/p>\n\u003cp>两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president&#39;s social media platform.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>许多美国年轻人怀疑的是对新闻进行筛选的正当性。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。\u003c/p>\n\u003cp>先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。年轻人选择的是“经过筛选”，不是“未经筛选”。A用justification把怀疑落在筛选本身的正当性上，相当于把他们偏好的办法说成他们质疑的办法。句首那个名词没有读清，也不会改变prefer后面这组取舍。这里不能因为题干有cast doubt、原文有not，就随便把否定搬到filtered上；not对照的是后面的平台。\u003c/p>\n\u003cp>原句把筛选后的新闻放在偏好的一边，A却把筛选做法放到被怀疑的一边。\u003c/p>\n\u003cp>两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president&#39;s social media platform.\u003c/p>\n\u003cp>首段以年轻人反对总统推特用法切入，第二段扩展到社交媒体假消息与不信任，继而提出提高媒介素养。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Young people doubt whether news should be filtered through other sources.\u003c/p>\n\u003cp>年轻人怀疑新闻是否应该经由其他来源筛选。\u003c/p>\n\u003c/blockquote>\n\u003cp>首段说prefer过滤后的新闻，假设则怀疑过滤正当性，颠倒了他们的选择。后文交叉核对渠道也在积极筛选。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题关注在线分享新闻的批判技能，怀疑的对象应与新闻是否可信相连；不能把对消息可靠性的审查改成否定筛选本身。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the justification of the news-filtering practice\u003cbr>对新闻进行筛选的正当性\u003c/p>\n\u003c/blockquote>\n\u003cp>两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. people’s preference for social media platforms\u003c/h3>\n\u003cblockquote>\n\u003cp>人们对社交媒体平台的偏好\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的people’s preference谈人们喜不喜欢用平台，第2段rely on social media也谈平台使用，因此先看这一句承认了什么，再看Yet后面转到哪件事。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>rely on social media先把很多人依赖社交媒体这件事说出来；Yet后面并没有否认这些人在使用平台，而是转到distrust，也就是使用时对所接收内容的不信任。B的people’s preference问“大家的使用偏好是否如此”，把“使用一个渠道”和“相信渠道里的新闻”混成同一问题。人完全可能继续使用平台，同时不轻信上面的消息。段落正是把这两件事并列后转折，不能把后面的不信任倒过来解释成作者在否认前面的普遍使用。\u003c/p>\n\u003cp>原文把依赖平台作为现状，再说信任发生变化；B则把现状本身改成怀疑的对象，问题落错了地方。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Most Americans rely on social media to check daily headlines.\u003c/p>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>许多美国年轻人怀疑的是人们对社交媒体平台的偏好。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的people’s preference谈人们喜不喜欢用平台，第2段rely on social media也谈平台使用，因此先看这一句承认了什么，再看Yet后面转到哪件事。\u003c/p>\n\u003cp>rely on social media先把很多人依赖社交媒体这件事说出来；Yet后面并没有否认这些人在使用平台，而是转到distrust，也就是使用时对所接收内容的不信任。B的people’s preference问“大家的使用偏好是否如此”，把“使用一个渠道”和“相信渠道里的新闻”混成同一问题。人完全可能继续使用平台，同时不轻信上面的消息。段落正是把这两件事并列后转折，不能把后面的不信任倒过来解释成作者在否认前面的普遍使用。\u003c/p>\n\u003cp>B换了被质疑的对象：原文质疑内容是否可信，B质疑人们是否偏爱平台。\u003c/p>\n\u003cp>原文把依赖平台作为现状，再说信任发生变化；B则把现状本身改成怀疑的对象，问题落错了地方。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Most Americans rely on social media to check daily headlines.\u003c/p>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003cp>首段以年轻人反对总统推特用法切入，第二段扩展到社交媒体假消息与不信任，继而提出提高媒介素养。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Young people question whether Americans really prefer social media platforms.\u003c/p>\n\u003cp>年轻人质疑美国人是否真的偏好社交媒体平台。\u003c/p>\n\u003c/blockquote>\n\u003cp>most Americans rely on作为背景直接陈述，并未把大众是否偏好平台设为待证问题；不信任消息与是否使用平台可以并存。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题关注在线分享新闻的批判技能，怀疑的对象应与新闻是否可信相连；不能把对消息可靠性的审查改成否定筛选本身。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>people’s preference for social media platforms\u003cbr>人们对社交媒体平台的偏好\u003c/p>\n\u003c/blockquote>\n\u003cp>原文把依赖平台作为现状，再说信任发生变化；B则把现状本身改成怀疑的对象，问题落错了地方。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. the administration’s ability to handle information\u003c/h3>\n\u003cblockquote>\n\u003cp>政府处理信息的能力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时选项呈现为“the [xxx]’s ability to handle information”，保留了相应遮挡。当时的定位线索是：C的ability to handle information是在评价某一方处理信息的能力，第2段rarely or never trust news是在评价收到的新闻是否可信，二者都涉及信息但对象不同，因此回看调查具体让谁不信任什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>rarely or never trust news的主体是Facebook用户，宾语是从媒体来的news。原文说他们很少或从不相信这些新闻，不是在测量另一方能不能办理、整理或处置信息。第1段“希望新闻经过其他来源筛选”也是选择接收渠道，并不能变成某一方没有处理信息的本领。不要把“新闻不可信”直接改写成“处理者没有能力”。\u003c/p>\n\u003cp>这里的差别不是C前面的名词该怎么翻，而是后半句已经把调查的新闻可信度问题改成了信息处理能力问题。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>许多美国年轻人怀疑的是政府处理信息的能力。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的ability to handle information是在评价某一方处理信息的能力，第2段rarely or never trust news是在评价收到的新闻是否可信，二者都涉及信息但对象不同，因此回看调查具体让谁不信任什么。\u003c/p>\n\u003cp>rarely or never trust news的主体是Facebook用户，宾语是从媒体来的news。原文说他们很少或从不相信这些新闻，不是在测量另一方能不能办理、整理或处置信息。第1段“希望新闻经过其他来源筛选”也是选择接收渠道，并不能变成某一方没有处理信息的本领。不要把“新闻不可信”直接改写成“处理者没有能力”。\u003c/p>\n\u003cp>这里的差别不是C前面的名词该怎么翻，而是后半句已经把调查的新闻可信度问题改成了信息处理能力问题。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003cp>首段以年轻人反对总统推特用法切入，第二段扩展到社交媒体假消息与不信任，继而提出提高媒介素养。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Young people question the administration’s ability to process information.\u003c/p>\n\u003cp>年轻人质疑政府处理信息的能力。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文针对总统发布方式，并扩展到各类媒体；没有对政府处理资料的行政能力作评价，平台使用不能替代能力判断。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题关注在线分享新闻的批判技能，怀疑的对象应与新闻是否可信相连；不能把对消息可靠性的审查改成否定筛选本身。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the administration’s ability to handle information\u003cbr>政府处理信息的能力\u003c/p>\n\u003c/blockquote>\n\u003cp>这里的差别不是C前面的名词该怎么翻，而是后半句已经把调查的新闻可信度问题改成了信息处理能力问题。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. social media as a reliable source of news\u003c/h3>\n\u003cblockquote>\n\u003cp>作为可靠新闻来源的社交媒体\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的reliable source of news问新闻来源是否可靠，第2段distrust has risen正是在说信任降低，因此把这句与后面的假新闻、Facebook用户信任调查放在一起看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>distrust has risen说明不是“已经放心相信”，而是不信任在增加。后面具体到Twitter分享内容中的fake news，以及Facebook用户rarely or never trust news，都仍围绕新闻能不能相信。D的reliable source of news把三个例子共同涉及的对象保留下来：社交媒体作为新闻来源的可靠性。它没有把来源换成政府能力，也没有否认人们使用平台；它只是接在cast doubt on后面说可靠性受到怀疑。第1段年轻人更喜欢经其他来源筛选，也能与这种谨慎接收消息的选择接上。\u003c/p>\n\u003cp>从第1段的接收选择，到第2段的不信任和假新闻例子，主体的行为与怀疑的对象能够连贯地读下来。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003cp>During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford.\u003c/p>\n\u003cp>And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>许多美国年轻人怀疑的是作为可靠新闻来源的社交媒体。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的reliable source of news问新闻来源是否可靠，第2段distrust has risen正是在说信任降低，因此把这句与后面的假新闻、Facebook用户信任调查放在一起看。\u003c/p>\n\u003cp>distrust has risen说明不是“已经放心相信”，而是不信任在增加。后面具体到Twitter分享内容中的fake news，以及Facebook用户rarely or never trust news，都仍围绕新闻能不能相信。D的reliable source of news把三个例子共同涉及的对象保留下来：社交媒体作为新闻来源的可靠性。它没有把来源换成政府能力，也没有否认人们使用平台；它只是接在cast doubt on后面说可靠性受到怀疑。第1段年轻人更喜欢经其他来源筛选，也能与这种谨慎接收消息的选择接上。\u003c/p>\n\u003cp>从第1段的接收选择，到第2段的不信任和假新闻例子，主体的行为与怀疑的对象能够连贯地读下来。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003cp>During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford.\u003c/p>\n\u003cp>And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003cp>首段以年轻人反对总统推特用法切入，第二段扩展到社交媒体假消息与不信任，继而提出提高媒介素养。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Young people are becoming skeptical of social media as a dependable source of news.\u003c/p>\n\u003cp>年轻人开始怀疑社交媒体是否为可靠的新闻来源。\u003c/p>\n\u003c/blockquote>\n\u003cp>从反对总统直接推文到假新闻比例和Facebook不信任，证据都落在消息可信度，下一步提高辨别能力由此自然引出。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题关注在线分享新闻的批判技能，怀疑的对象应与新闻是否可信相连；不能把对消息可靠性的审查改成否定筛选本身。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>social media as a reliable source of news\u003cbr>作为可靠新闻来源的社交媒体\u003c/p>\n\u003c/blockquote>\n\u003cp>从第1段的接收选择，到第2段的不信任和假新闻例子，主体的行为与怀疑的对象能够连贯地读下来。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>26题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>26. D. social media as a reliable source of news\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。\u003c/p>\n\u003cp>B：rely on social media先把很多人依赖社交媒体这件事说出来；Yet后面并没有否认这些人在使用平台，而是转到distrust，也就是使用时对所接收内容的不信任。\u003c/p>\n\u003cp>C：rarely or never trust news的主体是Facebook用户，宾语是从媒体来的news。\u003c/p>\n\u003cp>D：distrust has risen说明不是“已经放心相信”，而是不信任在增加。\u003c/p>\n\u003ch2>27题\u003c/h2>\n\u003cblockquote>\n\u003cp>The phrase “beef up” (Para. 2) is closest in meaning to ______.\u003cbr>第2段的短语“beef up”与下面哪个意思最接近？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>词义题。题干要求判断“第2段的短语“beef up”与下面哪个意思最接近？”，先按第2、3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Most Americans rely on social media to check daily headlines. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003cp>Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. &quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003c/blockquote>\n\u003cp>不信任上升后，人们开始增强媒介素养，下一段以更善于区分事实与虚构、核对来源说明能力变化。\u003c/p>\n\u003ch3>A. boast\u003c/h3>\n\u003cblockquote>\n\u003cp>吹嘘\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的boast说的是把自己说得很好，原句beef up their media literacy skills谈人们对技能做什么，因此回看技能前面的动作与Such a trend is badly needed怎样衔接。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>beef up their media literacy skills的前因是对媒体的不信任上升，后面又说这种趋势badly needed。接下去的假新闻和低信任比例，说明遇到的难题是消息难辨真假；因此这里需要的是让判断新闻的能力发生实际变化。boast却只让人夸耀自己有能力，既不改变能力，也不解决真假难辨。不能把“对自己的技能有信心”和“把技能练得更好”当作一回事，原句紧接着强调需求，是在说后一种实际应对。\u003c/p>\n\u003cp>把boast放回句子，前面的信任问题与后面的“非常需要”就接不上了：问题需要处理，不需要自我夸耀。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的beef up在这里表示吹嘘。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的boast说的是把自己说得很好，原句beef up their media literacy skills谈人们对技能做什么，因此回看技能前面的动作与Such a trend is badly needed怎样衔接。\u003c/p>\n\u003cp>beef up their media literacy skills的前因是对媒体的不信任上升，后面又说这种趋势badly needed。接下去的假新闻和低信任比例，说明遇到的难题是消息难辨真假；因此这里需要的是让判断新闻的能力发生实际变化。boast却只让人夸耀自己有能力，既不改变能力，也不解决真假难辨。不能把“对自己的技能有信心”和“把技能练得更好”当作一回事，原句紧接着强调需求，是在说后一种实际应对。\u003c/p>\n\u003cp>把boast放回句子，前面的信任问题与后面的“非常需要”就接不上了：问题需要处理，不需要自我夸耀。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003cp>不信任上升后，人们开始增强媒介素养，下一段以更善于区分事实与虚构、核对来源说明能力变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>People are starting to boast about media skills they already possess.\u003c/p>\n\u003cp>人们正开始夸耀自己已经拥有的媒介技能。\u003c/p>\n\u003c/blockquote>\n\u003cp>吹嘘强调谈论自己的能力，实际starting to与more skillful写能力在增长，不是自我宣传变多。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>技能提升的主旨给出正向变化，beef up的对象是skills；具体同义应保留能力得到增强这一动作。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>boast\u003cbr>吹嘘\u003c/p>\n\u003c/blockquote>\n\u003cp>把boast放回句子，前面的信任问题与后面的“非常需要”就接不上了：问题需要处理，不需要自我夸耀。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. define\u003c/h3>\n\u003cblockquote>\n\u003cp>界定\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的define是给出定义，media literacy skills是原句被处理的对象；都与技能有关，因此回看作者是在讨论概念的含义，还是说人们怎样应对不可信的消息。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>define会把人们正在做的事改成给概念划界、解释定义。但本段后续列的是假新闻比例和不相信平台新闻的用户比例，不是在列这个概念的几种定义。更重要的是，不信任增加之后，人们需要改善自己接收和判断消息的方式，而不只是把技能名称说清楚。B把实际能力的变化换成概念解释，动作并不相同。\u003c/p>\n\u003cp>原句把一个现实问题接到人们技能上的变化，B却把话题带到定义上，后面的具体新闻问题也没有转向概念辨析。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的beef up在这里表示界定。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的define是给出定义，media literacy skills是原句被处理的对象；都与技能有关，因此回看作者是在讨论概念的含义，还是说人们怎样应对不可信的消息。\u003c/p>\n\u003cp>define会把人们正在做的事改成给概念划界、解释定义。但本段后续列的是假新闻比例和不相信平台新闻的用户比例，不是在列这个概念的几种定义。更重要的是，不信任增加之后，人们需要改善自己接收和判断消息的方式，而不只是把技能名称说清楚。B把实际能力的变化换成概念解释，动作并不相同。\u003c/p>\n\u003cp>原句把一个现实问题接到人们技能上的变化，B却把话题带到定义上，后面的具体新闻问题也没有转向概念辨析。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003cp>不信任上升后，人们开始增强媒介素养，下一段以更善于区分事实与虚构、核对来源说明能力变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>People are starting to define what media literacy means.\u003c/p>\n\u003cp>人们正开始定义媒介素养的含义。\u003c/p>\n\u003c/blockquote>\n\u003cp>定义需要概念说明，原文却列出核实消息的行为与更熟练的结果，没有在给名词下定义。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>技能提升的主旨给出正向变化，beef up的对象是skills；具体同义应保留能力得到增强这一动作。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>define\u003cbr>界定\u003c/p>\n\u003c/blockquote>\n\u003cp>原句把一个现实问题接到人们技能上的变化，B却把话题带到定义上，后面的具体新闻问题也没有转向概念辨析。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. sharpen\u003c/h3>\n\u003cblockquote>\n\u003cp>磨炼；提高\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的sharpen用在skills上表示使技能更敏锐，后句badly needed说明这种变化正是现实所需要的，因此回看“信任降低—技能变化—需要这种变化”的前后次序。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>先有distrust has risen，再有人们开始对skills做某件事，作者随后肯定它badly needed。sharpen放进来，意思是消息不容易相信，人们就提高辨别消息的技能，而这种改进又确实必要，前后的关系能接上。这里不是先认定beef与哪个词长得像，而是把四个动作分别代回去，比较哪一个能回应实际困难。sharpen保留了“技能变得更好”的方向，也没有添出向他人传播技能或炫耀技能的对象。\u003c/p>\n\u003cp>“非常需要”肯定的是这种能力改进。C的sharpen因此可以作为beef up在这里的近义表达，而不是把它理解为字面上的磨一件东西。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第2段的beef up在这里表示磨炼；提高。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的sharpen用在skills上表示使技能更敏锐，后句badly needed说明这种变化正是现实所需要的，因此回看“信任降低—技能变化—需要这种变化”的前后次序。\u003c/p>\n\u003cp>先有distrust has risen，再有人们开始对skills做某件事，作者随后肯定它badly needed。sharpen放进来，意思是消息不容易相信，人们就提高辨别消息的技能，而这种改进又确实必要，前后的关系能接上。这里不是先认定beef与哪个词长得像，而是把四个动作分别代回去，比较哪一个能回应实际困难。sharpen保留了“技能变得更好”的方向，也没有添出向他人传播技能或炫耀技能的对象。\u003c/p>\n\u003cp>“非常需要”肯定的是这种能力改进。C的sharpen因此可以作为beef up在这里的近义表达，而不是把它理解为字面上的磨一件东西。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003cp>不信任上升后，人们开始增强媒介素养，下一段以更善于区分事实与虚构、核对来源说明能力变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>People are beginning to sharpen their media literacy skills.\u003c/p>\n\u003cp>人们开始提高媒介素养技能。\u003c/p>\n\u003c 03cp>第2段的beef up在这里表示分享。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的share容易让人想到同段shared by Twitter users，两处都可能出现“分享”，因此回看Twitter用户分享的究竟是什么，再看beef up后面的宾语。\u003c/p>\n\u003cp>shared by Twitter users修饰的是web content，分享的是网络内容；beef up后面则是their media literacy skills，人们要处理的是自己的技能。D的share把“分享新闻内容”的动作挪给了“媒体素养技能”，但把技能传给别人并不等于自己的技能有所提高。这一段先提出需要，再举假新闻说明需要为什么迫切，不是在介绍人们已经怎样给别人讲授技能。两个句子都涉及网络，并不代表动词和宾语可以互相搬动。\u003c/p>\n\u003cp>D改变了动词作用的对象，也把个人面对新闻时的能力改进换成了向外分享。不能仅凭同段出现shared就选它。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003cp>During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford.\u003c/p>\n\u003cp>不信任上升后，人们开始增强媒介素养，下一段以更善于区分事实与虚构、核对来源说明能力变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>People are starting to share their media skills with others.\u003c/p>\n\u003cp>人们开始与他人分享媒介技能。\u003c/p>\n\u003c/blockquote>\n\u003cp>分享技能要求教给或传给别人；实际分享对象是新闻，beef up的宾语是自己的媒介素养，不能把两种宾语混用。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入27题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>技能提升的主旨给出正向变化，beef up的对象是skills；具体同义应保留能力得到增强这一动作。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>share\u003cbr>分享\u003c/p>\n\u003c/blockquote>\n\u003cp>D改变了动词作用的对象，也把个人面对新闻时的能力改进换成了向外分享。不能仅凭同段出现shared就选它。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>27题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>27. C. sharpen\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：beef up their media literacy skills的前因是对媒体的不信任上升，后面又说这种趋势badly needed。\u003c/p>\n\u003cp>B：define会把人们正在做的事改成给概念划界、解释定义。\u003c/p>\n\u003cp>C：先有distrust has risen，再有人们开始对skills做某件事，作者随后肯定它badly needed。\u003c/p>\n\u003cp>D：shared by Twitter users修饰的是web content，分享的是网络内容；beef up后面则是their media literacy skills，人们要处理的是自己的技能。\u003c/p>\n\u003ch2>28题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to the Knight Foundation survey, young people ______.\u003cbr>根据Knight Foundation的调查，年轻人怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>调查发现题。题干要求判断“根据Knight Foundation的调查，年轻人怎么样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. &quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003c/blockquote>\n\u003cp>调查对象用分布式信任核实新闻，交叉检查来源、主动寻找不同观点；自我学习责任服务于这种核实行动。\u003c/p>\n\u003ch3>A. tend to voice their opinions in cyberspace\u003c/h3>\n\u003cblockquote>\n\u003cp>倾向于在网络空间表达意见\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时选项呈现为“tend to voice their opinions in [xxx]”，保留了相应遮挡。当时的定位线索是：A的voice their opinions和第3段seeking out opposing viewpoints都提到观点，但一个可能是往外说、一个是往外找，因此回看年轻人实际在做什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>seeking out opposing viewpoints的动作是主动寻找，找到的是与自己不一样的看法，前面还接着educating themselves，说明年轻人在通过获取信息学习。A的voice their opinions则让他们把自己的想法说出去：动作从接收、寻找变成发声，观点也从相反观点变成自己的观点。这里不能因为两边都有“观点”就忽略信息流向。\u003c/p>\n\u003cp>这一调查具体展示的是核实消息与自我学习，A把同一批人的动作和所面对的观点都换了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Knight Foundation调查发现，年轻人倾向于在网络空间表达意见。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的voice their opinions和第3段seeking out opposing viewpoints都提到观点，但一个可能是往外说、一个是往外找，因此回看年轻人实际在做什么。\u003c/p>\n\u003cp>seeking out opposing viewpoints的动作是主动寻找，找到的是与自己不一样的看法，前面还接着educating themselves，说明年轻人在通过获取信息学习。A的voice their opinions则让他们把自己的想法说出去：动作从接收、寻找变成发声，观点也从相反观点变成自己的观点。这里不能因为两边都有“观点”就忽略信息流向。\u003c/p>\n\u003cp>这一调查具体展示的是核实消息与自我学习，A把同一批人的动作和所面对的观点都换了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003cp>调查对象用分布式信任核实新闻，交叉检查来源、主动寻找不同观点；自我学习责任服务于这种核实行动。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Young people mainly use cyberspace to broadcast their own opinions.\u003c/p>\n\u003cp>年轻人主要利用网络空间传播自己的意见。\u003c/p>\n\u003c/blockquote>\n\u003cp>网上发声并非该调查报告的中心动作，实际seek out opposing viewpoints是去读不同意见，不是向外发表自己的意见。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u00
