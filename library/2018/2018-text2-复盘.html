const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| survey | n.调查 | two-thirds | 三分之二 | young Americans | 美国年轻人 |\n| disapprove of | 不赞成 | president | n.总统 | implication | n.含义 |\n| Millennial | n.千禧一代 | prefer | v.更喜欢 | filter | v.筛选 |\n| source | n.来源 | social media platform | 社交媒体平台 |  |  |","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 2重点词与语境","focus":[85,153,925,413],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>survey\u003c/td>\n\u003ctd>n.调查\u003c/td>\n\u003ctd>two-thirds\u003c/td>\n\u003ctd>三分之二\u003c/td>\n\u003ctd>young Americans\u003c/td>\n\u003ctd>美国年轻人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003c mp&#39;s use of Twitter.\u003c/p>\n\u003cp>The implication is / that Millennials prefer / news from the White House / to be filtered / through other sources, / not a president&#39;s social media platform.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-2\">\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>一项新调查 / 由哈佛大学进行的 / 发现 / 超过三分之二 / 年轻美国人的 / 不赞成 / 特朗普总统使用推特。\u003c/p>\n\u003cp>其含义是 / 千禧一代更喜欢 / 来自白宫的新闻 / 被过滤 / 通过其他来源，/ 而不是总统的社交媒体平台。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 标准译文 · 第1段\n\n哈佛大学的一项新调查发现，超过三分之二的年轻美国人不赞成特朗普总统使用推特。这意味着千禧一代更希望白宫的新闻通过其他来源过滤，而不是通过总统的社交媒体平台直接发布。","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,153,925,413],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-1-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump&#39;s use of Twitter. The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president&#39;s social media platform.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>A new survey / by Harvard University / finds / more than two-thirds / of young Americans / disapprove of / President Trump&#39;s use of Twitter.\u003c/p>\n\u003cp>The implication is / that Millennials prefer / news from the White House / to be filtered / through other sources, / not a president&#39;s social media platform.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-2\">\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>一项新调查 / 由哈佛大学进行的 / 发现 / 超过三分之二 / 年轻美国人的 / 不赞成 / 特朗普总统使用推特。\u003c/p>\n\u003cp>其含义是 / 千禧一代更喜欢 / 来自白宫的新闻 / 被过滤 / 通过其他来源，/ 而不是总统的社交媒体平台。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-3\">\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>哈佛大学的一项新调查发现，超过三分之二的年轻美国人不赞成特朗普总统使用推特。这意味着千禧一代更希望白宫的新闻通过其他来源过滤，而不是通过总统的社交媒体平台直接发布。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 完整原文 · 第2段\n\nMost Americans rely on social media to check daily headlines. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,575,925,718],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-2-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Most Americans rely on social media to check daily headlines. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 意群划分 · 第2段\n\nMost Americans / rely on social media / to ng out opposing viewpoints,\" the survey concluded.","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1329,925,902],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-3-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. &quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 意群划分 · 第3段\n\nYoung people / who are digital natives / are indeed becoming / more skillful / at separating fact from fiction / in cyberspace.\n\nA Knight Foundation focus-group survey / of young people / between ages 14 and 24 / found / they use \"distributed trust\" / to verify stories.\n\nThey cross-check sources / and prefer news / from different perspectives – / especially those / that are open / about any bias.\n\n\"Many young people / assume a great deal of personal responsibility / for educating themselves / and actively seeking out / opposing viewpoints,\" / the survey concluded.","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1329,925,902],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-3-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. &quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-1\">\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Young people / who are digital natives / are indeed becoming / more skillful / at separating fact from fiction / in cyberspace.\u003c/p>\n\u003cp>A Knight Foundation focus-group survey / of young people / between ages 14 and 24 / found / they use &quot;distributed trust&quot; / to verify stories.\u003c/p>\n\u003cp>They cross-check sources / and prefer news / from different perspectives – / especially those / that are open / about any bias.\u003c/p>\n\u003cp>&quot;Many young people / assume a great deal of personal responsibility / for educating themselves / and actively seeking out / opposing viewpoints,&quot; / the survey concluded.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 意群翻译 · 第3段\n\n年轻人 / 作为数字原住民的 / 确实正在变得 / 更加熟练 / 在区分事实与虚构方面 / 在网络空间中。\n\n骑士基金会的焦点小组调查 / 对年轻人的 / 14到24岁之间的 / 发现 / 他们使用\"分布式信任\" / 来验证故事。\n\n他们交叉核对信息源 / 并且更喜欢新闻 / 来自不同视角的 – / 尤其是那些 / 公开承认的 / 关于任何偏见。\n\n\"许多年轻人 / 承担了大量个人责任 / 为教育自己 / 并积极寻找 / 相反的观点，\" / 调查总结道。","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1329,925,902],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-3-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. &quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-1\">\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Young people / who are digital natives / are indeed becoming / more skillful / at separating fact from fiction / in cyberspace.\u003c/p>\n\u003cp>A Knight Foundation focus-group survey / of young people / between ages 14 and 24 / found / they use &quot;distributed trust&quot; / to verify stories.\u003c/p>\n\u003cp>They cross-check sources / and prefer news / from different perspectives – / especially those / that are open / about any bias.\u003c/p>\n\u003cp>&quot;Many young people / assume a great deal of personal responsibility / for educating themselves / and actively seeking out / opposing viewpoints,&quot; / the survey concluded.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-2\">\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>年轻人 / 作为数字原住民的 / 确实正在变得 / 更加熟练 / 在区分事实与虚构方面 / 在网络空间中。\u003c/p>\n\u003cp>骑士基金会的焦点小组调查 / 对年轻人的 / 14到24岁之间的 / 发现 / 他们使用&quot;分布式信任&quot; / 来验证故事。\u003c/p>\n\u003cp>他们交叉核对信息源 / 并且更喜欢新闻 / 来自不同视角的 – / 尤其是那些 / 公开承认的 / 关于任何偏见。\u003c/p>\n\u003cp>&quot;许多年轻人 / 承担了大量个人责任 / 为教育自己 / 并积极寻找 / 相反的观点，&quot; / 调查总结道。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 标准译文 · 第3段\n\n作为数字原住民的年轻人确实正在变得更加熟练于在网络空间中区分事实与虚构。骑士基金会对14到24岁年轻人的焦点小组调查发现，他们使用\"分布式信任\"来验证故事。他们交叉核对信息源，更喜欢来自不同视角的新闻——尤其是那些公开承认偏见的新闻。调查总结道：\"许多年轻人承担了大量个人责任来教育自己并积极寻找相反的观点。\"","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1329,925,902],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-3-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. &quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-3-1\">\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Young people / who are digital natives / are indeed becoming / more skillful / at separating fact from fiction / in cyberspace.\u003c/p>\n\u003cp>A Knight Foundation focus-group survey / of young people / between ages 14 and 24 / found / they use &quot;distributed trust&quot; / to verify stories.\u003c/p>\n\u003cp>They cross-check sources / and prefer news / from different perspectives – / especially those / that are open / about any bias.\u003c/p>\n\u003cp>&quot;Many young people / assume a great deal of personal responsibility / for educating themselves / and actively seeking out / opposing viewpoints,&quot; / the survey concluded.\u003c/p 种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\n\n符号的作用：\n\n- `→`：主要叙述继续向下推进；\n- `+`：并列；\n- `：`：解释、修饰或补充；\n- `//`：转折或对比；\n- 括号：把同一层的信息捆成一个整体。","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n"},{"section":"第二鸟 · 精读与翻译","title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n### 第1段\n\nA new survey：(by Harvard University) → finds：(more than two-thirds：(of young Americans) → disapprove of：(President Trump's use of Twitter)).\n\nThe implication is：(that Millennials prefer：(news from the White House → to be filtered：(through other sources))，not a president's social media platform).\n\n### 第2段\n\nMost Americans → rely on social media → to check daily headlines.\n\nYet // as distrust has risen：(toward all media) → people may be starting → to beef up：(their media literacy skills).\n\nSuch a trend → is badly needed.\n\nDuring the 2016 presidential campaign → nearly a quarter：(of web content：(shared by Twitter users：(in the politically critical state of Michigan))) → was fake news：(according to the University of Oxford).\n\nAnd a survey：(conducted for BuzzFeed News) → found：(44 percent of Facebook users → rarely or never trust：(news from the media giant)).\n\n### 第3段\n\nYoung people：(who are digital natives) → are indeed becoming → more skillful：(at separating fact from fiction：(in cyberspace)).\n\nA Knight Foundation focus-group survey：(of young people：(between ages 14 and 24)) → found：(they use \"distributed trust\" → to verify stories).\n\nThey cross-check sources + prefer news：(from different perspectives) – especially those：(that are open：(about any bias)).\n\n\"Many young people → assume a great deal of personal responsibility：(for educating themselves + actively seeking out：(opposing viewpoints)),\" → the survey concluded.\n\n### 第4段\n\nSuch active research → can have another effect.\n\nA 2014 survey：(conducted in Australia, Britain, and the United States：(by the University of Wisconsin-Madison)) → found：(that young people's reliance on social media → led to → greater political engagement).\n\n### 第5段\n\nSocial media → allows users → to experience news events：(more intimately and immediately) // while also permitting them → to re-share news：(as a projection：(of their values and interests)).\n\nThis forces users → to be more conscious：(of their role：(in passing along information)).\n\nA survey：(by Barna research group) → found：(the top reason：(given by Americans：(for the fake news phenomenon)) → is \"reader error\") // more so than：(made-up stories + factual mistakes in reporting).\n\nAbout a third → say：(the problem of fake news → lies in：(\"misinterpretation or exaggeration of actual news\"：(via social media))).\n\nIn other words → the choice to share news：(on social media) → may be → the heart of the issue.\n\n\"This indicates：(there is a real personal responsibility：(in counteracting this problem)),\" → says Roxanne Stone：(editor in chief at Barna Group).\n\n### 第6段\n\nSo // when young people → are critical of：(an over-tweeting president) → they reveal → a mental discipline：(in thinking skills) – and in their choices：(on when to share：(on social media)).","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>A new survey：(by Harvard University) → finds：(more than two-thirds：(of young Americans) → disapprove of：(President Trump&#39;s use of Twitter)).\u003c/p>\n\u003cp>The implication is：(that Millennials prefer：(news from the White House → to be filtered：(through other sources))，not a president&#39;s social media platform).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Most Americans → rely on social media → to check daily headlines.\u003c/p>\n\u003cp>Yet // as distrust has risen：(toward all media) → people may be starting → to beef up：(their media literacy skills).\u003c/p>\n\u003cp>Such a trend → is badly needed.\u003c/p>\n\u003cp>During the 2016 presidential campaign → nearly a quarter：(of web content：(shared by Twitter users：(in the politically critical state of Michigan))) → was fake news：(according to the University of Oxford).\u003c/p>\n\u003cp>And a survey：(conducted for BuzzFeed News) → found：(44 percent of Facebook users → rarely or never trust：(news from the media giant)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Young people：(who are digital natives) → are indeed becoming → more skillful：(at separating fact from fiction：(in cyberspace)).\u003c/p>\n\u003cp>A Knight Foundation focus-group survey：(of young people：(between ages 14 and 24)) → found：(they use &quot;distributed trust&quot; → to verify stories).\u003c/p>\n\u003cp>They cross-check sources + prefer news：(from different perspectives) – especially those：(that are open：(about any bias)).\u003c/p>\n\u003cp>&quot;Many young people → assume a great deal of personal responsibility：(for educating themselves + actively seeking out：(opposing viewpoints)),&quot; → the survey concluded.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Such active research → can have another effect.\u003c/p>\n\u003cp>A 2014 survey：(conducted in Australia, Britain, and the United States：(by the University of Wisconsin-Madison)) → found：(that young people&#39;s reliance on social media → led to → greater political engagement).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Social media → allows users → to experience news events：(more intimately and immediately) // while also permitting them → to re-share news：(as a projection：(of their values and interests)).\u003c/p>\n\u003cp>This forces users → to be more conscious：(of their role：(in passing along information)).\u003c/p>\n\u003cp>A survey：(by Barna research group) → found：(the top reason：(given by Americans：(for the fake news phenomenon)) → is &quot;reader error&quot;) // more so than：(made-up stories + factual mistakes in reporting).\u003c/p>\n\u003cp>About a third → say：(the problem of fake news → lies in：(&quot;misinterpretation or exaggeration of actual news&quot;：(via social media))).\u003c/p>\n\u003cp>In other words → the choice to share news：(on social media) → may be → the heart of the issue.\u003c/p>\n\u003cp>&quot;This indicates：(there is a real personal responsibility：(in counteracting this problem)),&quot; → says Roxanne Stone：(editor in chief at Barna Group).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>So // when young people → are critical of：(an over-tweeting president) → they reveal → a mental discipline：(in thinking skills) – and in their choices：(on when to share：(on social media)).\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n一项新调查：(由哈佛大学进行的) → 发现：(超过三分之二：(年轻美国人的) → 不赞成：(特朗普总统使用推特))。\n\n其含义是：(千禧一代更喜欢：(来自白宫的新闻 → 被过滤：(通过其他来源))，而不是总统的社交媒体平台)。\n\n### 第2段\n\n大多数美国人 → 依赖社交媒体 → 来查看每日头条。\n\n然而 // 随着不信任感上升：(对所有媒体) → 人们可能正在开始 → 加强：(他们的媒体素养技能)。\n\n这样的趋势 → 非常需要。\n\n在2016年总统竞选期间 → 将近四分之一：(网络内容的：(由推特用户分享的：(在政治关键州密歇根))) → 是假新闻：(根据牛津大学的调查)。\n\n而且一项调查：(为BuzzFeed新闻进行的) → 发现：(44%的脸书用户 → 很少或从不相信：(来自这个媒体巨头的新闻))。\n\n### 第3段\n\n年轻人：(作为数字原住民的) → 确实正在变得 → 更加熟练：(在区分事实与虚构方面：(在网络空间中))。\n\n骑士基金会的焦点小组调查：(对年轻人的：(14到24岁之间的)) → 发现：(他们使用\"分布式信任\" → 来验证故事)。\n\n他们交叉核对信息源 + 更喜欢新闻：(来自不同视角的) – 尤其是那些：(公开承认的：(关于任何偏见))。\n\n\"许多年轻人 → 承担了大量个人责任：(为教育自己 + 积极寻找：(相反的观点))，\" → 调查总结道。\n\n### 第4段\n\n这种积极的研究 → 可以产生另一种效果。\n\n一项2014年的调查：(在澳大利亚、英国和美国进行的：(由威斯康星大学麦迪逊分校)) → 发现：(年轻人对社交媒体的依赖 → 导致了 → 更大的政治参与)。\n\n### 第5段\n\n社交媒体 → 允许用户 → 体验新闻事件：(更亲密和即时地) // 同时也允许他们 → 重新分享新闻：(作为一种投射：(他们的价值观和兴趣的))。\n\n这迫使用户 → 更加意识到：(他们的角色：(在传递信息方面))。\n\n一项调查：(由巴纳研究小组进行的) → 发现：(首要原因：(美国人给出的：(对于假新闻现象)) → 是\"读者错误\") // 更甚于：(编造的故事 + 报道中的事实错误)。\n\n大约三分之一 → 说：(假新闻的问题 → 在于：(\"对实际新闻的误解或夸大\"：(通过社交媒体)))。\n\n换句话说 → 选择分享新闻：(在社交媒体上) → 可能是 → 问题的核心。\n\n\"这表明：(存在真正的个人责任：(在对抗这个问题上))，\" → 罗克珊·斯通说：(巴纳集团主编)。\n\n### 第6段\n\n所以 // 当年轻人 → 批评：(一个过度发推特的总统) → 他们展现了 → 一种思维纪律：(在思考技能方面) – 以及在他们的选择上：(关于何时分享：(在社交媒体上))。","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>一项新调查：(由哈佛大学进行的) → 发现：(超过三分之二：(年轻美国人的) → 不赞成：(特朗普总统使用推特))。\u003c/p>\n\u003cp>其含义是：(千禧一代更喜欢：(来自白宫的新闻 → 被过滤：(通过其他来源))，而不是总统的社交媒体平台)。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>大多数美国人 → 依赖社交媒体 → 来查看每日头条。\u003c/p>\n\u003cp>然而 // 随着不信任感上升：(对所有媒体) → 人们可能正在开始 → 加强：(他们的媒体素养技能)。\u003c/p>\n\u003cp>这样的趋势 → 非常需要。\u003c/p>\n\u003cp>在2016年总统竞选期间 → 将近四分之一：(网络内容的：(由推特用户分享的：(在政治关键州密歇根))) → 是假新闻：(根据牛津大学的调查)。\u003c/p>\n\u003cp>而且一项调查：(为BuzzFeed新闻进行的) → 发现：(44%的脸书用户 → 很少或从不相信：(来自这个媒体巨头的新闻))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>年轻人：(作为数字原住民的) → 确实正在变得 → 更加熟练：(在区分事实与虚构方面：(在网络空间中))。\u003c/p>\n\u003cp>骑士基金会的焦点小组调查：(对年轻人的：(14到24岁之间的)) → 发现：(他们使用&quot;分布式信任&quot; → 来验证故事)。\u003c/p>\n\u003cp>他们交叉核对信息源 + 更喜欢新闻：(来自不同视角的) – 尤其是那些：(公开承认的：(关于任何偏见))。\u003c/p>\n\u003cp>&quot;许多年轻人 → 承担了大量个人责任：(为教育自己 + 积极寻找：(相反的观点))，&quot; → 调查总结道。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>这种积极的研究 → 可以产生另一种效果。\u003c/p>\n\u003cp>一项2014年的调查：(在澳大利亚、英国和美国进行的：(由威斯康星大学麦迪逊分校)) → 发现：(年轻人对社交媒体的依赖 → 导致了 → 更大的政治参与)。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>社交媒体 → 允许用户 → 体验新闻事件：(更亲密和即时地) // 同时也允许他们 → 重新分享新闻：(作为一种投射：(他们的价值观和兴趣的))。\u003c/p>\n\u003cp>这迫使用户 → 更加意识到：(他们的角色：(在传递信息方面))。\u003c/p>\n\u003cp>一项调查：(由巴纳研究小组进行的) → 发现：(首要原因：(美国人给出的：(对于假新闻现象)) → 是&quot;读者错误&quot;) // 更甚于：(编造的故事 + 报道中的事实错误)。\u003c/p>\n\u003cp>大约三分之一 → 说：(假新闻的问题 → 在于：(&quot;对实际新闻的误解或夸大&quot;：(通过社交媒体)))。\u003c/p>\n\u003cp>换句话说 → 选择分享新闻：(在社交媒体上) → 可能是 → 问题的核心。\u003c/p>\n\u003cp>&quot;这表明：(存在真正的个人责任：(在对抗这个问题上))，&quot; → 罗克珊·斯通说：(巴纳集团主编)。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>所以 // 当年轻人 → 批评：(一个过度发推特的总统) → 他们展现了 → 一种思维纪律：(在思考技能方面) – 以及在他们的选择上：(关于何时分享：(在社交媒体上))。\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"长难句翻译练习（英一必修，英二选修)","level":2,"raw":"## 长难句翻译练习（英一必修，英二选修)\n\n对于长难句的翻译，流程一共五步：\n\n1. 划分意群；\n2. 逐个意群直译；\n3. 按照中文语感，把应该放在一起的意群合并起来；\n4. 找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\n5. 对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 2重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n"},{"section":"第二鸟 · 精读与翻译","title":"第2段第4句","level":3,"raw":"### 原文\n\n> During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford.","context":{"mode":"image","asset":"articleAnnotated","label":"第2段第4句","focus":[85,712,925,202],"sourceW":1080,"sourceH":6116,"focusUnit":"sentence","focusAlign":"center"},"meta":{"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-long-1-0","html":"\u003csection class=\"revealPart\" id=\"focus-long-1-0\">\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段第4句","level":3,"raw":"### 第一步：划分意群\n\n> During the 2016 presidentia 3cp>reader error译为读者理解和处理信息方面的错误，不限定为读者自己编造新闻。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>巴纳研究小组的一项调查发现，美国人认为假新闻现象的首要原因是&quot;读者错误&quot;，而不是编造的故事或报道中的事实错误。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"30题 · 题干、题型与核心出处","level":2,"raw":"## 30题\n\n**Which of the following would be the best title for the text?**\n\n下面哪个最适合作为文章的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **A Counteraction Against the Over-tweeting Trend**\n\n对过度发推趋势的反制\n\nB. **A Rise in Critical Skills for Sharing News Online**\n\n在线分享新闻所需批判性技能的提升\n\nC. **The Accumulation of Mutual Trust on Social Media**\n\n社交媒体上相互信任的积累\n\nD. **The Platforms for Projection of Personal Interests**\n\n展示个人兴趣的平台\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。 | 先摆出一个现象 |\n| 2 | 写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。 | 再说为什么需要发生变化 |\n| 3 | 用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。 | 接着把已有变化写具体 |\n| 4 | 补充2014年的调查，指出年轻人依赖社交媒体与更多政治参与相联系，展示主动研究的另一种效果。 | 接着补上另一种结果 |\n| 5 | 解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。 | 再把问题落到每个人身上 |\n| 6 | 回到年轻人批评过度发推的总统，把这一表现接到thinking skills与选择何时分享，收回到用户的判断。 | 最后收回来再作判断 |","context":{"mode":"image","asset":"questions","focus":[250,2381,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"question":"30","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪个最适合作为文章的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>A Counteraction Against the Over-tweeting Trend\u003c/strong>\u003c/p>\n\u003cp>对过度发推趋势的反制\u003c/p>\n\u003cp>B. \u003cstrong>A Rise in Critical Skills for Sharing News Online\u003c/strong>\u003c/p>\n\u003cp>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003cp>C. \u003cstrong>The Accumulation of Mutual Trust on Social Media\u003c/strong>\u003c/p>\n\u003cp>社交媒体上相互信任的积累\u003c/p>\n\u003cp>D. \u003cstrong>The Platforms for Projection of Personal Interests\u003c/strong>\u003c/p>\n\u003cp>展示个人兴趣的平台\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。\u003c/td>\n\u003ctd>先摆出一个现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。\u003c/td>\n\u003ctd>再说为什么需要发生变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。\u003c/td>\n\u003ctd>接着把已有变化写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>补充2014年的调查，指出年轻人依赖社交媒体与更多政治参与相联系，展示主动研究的另一种效果。\u003c/td>\n\u003ctd>接着补上另一种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。\u003c/td>\n\u003ctd>再把问题落到每个人身上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到年轻人批评过度发推的总统，把这一表现接到thinking skills与选择何时分享，收回到用户的判断。\u003c/td>\n\u003ctd>最后收回来再作判断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. A Counteraction Against the Over-tweeting Trend","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### A. A Counteraction Against the Over-tweeting Trend\n\n对过度发推趋势的反制","context":{"mode":"image","asset":"questions","focus":[250,2381,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"A"},"focusId":"focus-q30-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>对过度发推趋势的反制\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. A Counteraction Against the Over-tweeting Trend","level":3,"raw":"#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n对过度发推趋势的反制\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 摆出年轻人反对过度发推的现象，确立抵制这一趋势的主题。 | 先摆出一个现象 |\n| 2 | 解释过量推送造成的信息负担，说明为什么需要改变这种发布方式。 | 再说为什么需要发生变化 |\n| 3 | 具体写用户已经如何限制、回避或反对频繁发推。 | 接着把已有变化写具体 |\n| 4 | 补充这些反制行动对公众参与或信息环境产生的另一种效果。 | 接着补上另一种结果 |\n| 5 | 把抵制过度发布的责任落到每个人如何发推、如何转发。 | 再把问题落到每个人身上 |\n| 6 | 回到开头判断反制行动如何约束了过度发推的趋势。 | 最后收回来再作判断 |\n\n第一段和最后一段确实提到总统发推，所以A不是凭空出现的标题。但看中间的展开，第2段用Twitter和Facebook的调查谈的是新闻可信度；第3段写交叉核对来源、寻找不同观点；第5段还把责任放在读者的理解和分享选择上。这些事情不限于发推多不多，更不是减少发推次数的具体措施。若A是标题，中间几段需要持续说明怎样反对过度发推；实际作者持续说明怎样判断、核实与分享消息。开头的总统行为是观察这种判断变化的一个入口，不能反过来让这个入口包办全部内容。\n\n只把标题定为反制过度发推，能覆盖中间核实来源、辨别真假与审慎分享的展开吗？\n\n不能。它抓住首尾的一个现象，却把中间持续讨论的新闻判断技能缩掉了。\n\n标题要能带着读完整篇，而不只是找出首尾重复的人物行为。A把用来引入与回扣的例子放大成全文目的。\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2381,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"A"},"focusId":"focus-q30-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>对过度发推趋势的反制\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-A-1\">\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对过度发推趋势的反制\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>摆出年轻人反对过度发推的现象，确立抵制这一趋势的主题。\u003c/td>\n\u003ctd>先摆出一个现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释过量推送造成的信息负担，说明为什么需要改变这种发布方式。\u003c/td>\n\u003ctd>再说为什么需要发生变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>具体写用户已经如何限制、回避或反对频繁发推。\u003c/td>\n\u003ctd>接着把已有变化写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>补充这些反制行动对公众参与或信息环境产生的另一种效果。\u003c/td>\n\u003ctd>接着补上另一种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td> 说明技能必须用于分享选择。 | 再把问题落到每个人身上 |\n| 6 | 回到开头，将批评过度发推理解为判断与分享上的思维训练。 | 最后收回来再作判断 |\n\nB的A Rise说一种提升，第3段indeed becoming more skillful直接表现了这种变化；Critical Skills不是逢新闻必反对，而是能够区分事实与虚构、核对来源并接触相反观点。for Sharing News Online又把能力放在网上接收、处理和转发新闻的环境中，能接到第5段的reader error与the choice to share news，也能接到末段when to share。第2段给出为什么需要这种能力，第3段给出已有做法，第5段说明每个人为什么要在分享时承担责任。首尾的总统例子放在这个标题下，正好成为判断能力变化的表现，不必把全文改成对某一个人的专项批评。\n\n以在线分享新闻时的判断技能提升作标题，能把需要、具体做法、个人责任和首尾现象连在一起吗？\n\n能。各段都能在这个标题下保留自己原本的作用。\n\nB没有把谨慎判断读成对平台全盘不信任，也没有把主动查证读成互相盲信。它既涵盖技能变得更好的方向，也涵盖这些技能被用于分享新闻的场景。\n\n判断：\n\n**B 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2381,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"B"},"focusId":"focus-q30-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-B-1\">\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从年轻人不赞同总统推特用法的现象，展示他们开始审慎选择新闻渠道。\u003c/td>\n\u003ctd>先摆出一个现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释假消息与不信任为何要求提高媒介素养。\u003c/td>\n\u003ctd>再说为什么需要发生变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>用多来源核查、寻找不同观点等行为具体展示批判技能的增长。\u003c/td>\n\u003ctd>接着把已有变化写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>补充主动研究与社交媒体使用还关联更高政治参与这一结果。\u003c/td>\n\u003ctd>接着补上另一种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>把误读与夸大新闻的问题落到个人转发责任，说明技能必须用于分享选择。\u003c/td>\n\u003ctd>再把问题落到每个人身上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到开头，将批评过度发推理解为判断与分享上的思维训练。\u003c/td>\n\u003ctd>最后收回来再作判断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的A Rise说一种提升，第3段indeed becoming more skillful直接表现了这种变化；Critical Skills不是逢新闻必反对，而是能够区分事实与虚构、核对来源并接触相反观点。for Sharing News Online又把能力放在网上接收、处理和转发新闻的环境中，能接到第5段的reader error与the choice to share news，也能接到末段when to share。第2段给出为什么需要这种能力，第3段给出已有做法，第5段说明每个人为什么要在分享时承担责任。首尾的总统例子放在这个标题下，正好成为判断能力变化的表现，不必把全文改成对某一个人的专项批评。\u003c/p>\n\u003cp>以在线分享新闻时的判断技能提升作标题，能把需要、具体做法、个人责任和首尾现象连在一起吗？\u003c/p>\n\u003cp>能。各段都能在这个标题下保留自己原本的作用。\u003c/p>\n\u003cp>B没有把谨慎判断读成对平台全盘不信任，也没有把主动查证读成互相盲信。它既涵盖技能变得更好的方向，也涵盖这些技能被用于分享新闻的场景。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. The Accumulation of Mutual Trust on Social Media","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### C. The Accumulation of Mutual Trust on Social Media\n\n社交媒体上相互信任的积累","context":{"mode":"image","asset":"questions","focus":[250,2381,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"C"},"focusId":"focus-q30-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>社交媒体上相互信任的积累\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. The Accumulation of Mutual Trust on Social Media","level":3,"raw":"#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n社交媒体上相互信任的积累\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 摆出用户通过社交媒体逐渐建立相互信任的现象。 | 先摆出一个现象 |\n| 2 | 解释过去不信任和假消息为何需要被新的互信机制改变。 | 再说为什么需要发生变化 |\n| 3 | 具体写用户怎样核实身份、互动验证并逐步积累彼此信任。 | 接着把已有变化写具体 |\n| 4 | 补充互信增长如何产生参与社会等另一种效果。 | 接着补上另一种结果 |\n| 5 | 说明每个人真实、负责地分享消息怎样为共同信任继续添砖加瓦。 | 再把问题落到每个人身上 |\n| 6 | 回到开头判断社交媒体中的互信确实在积累，并说明这种积累的意义。 | 最后收回来再作判断 |\n\nC里的Trust会让人想到第3段“distributed trust”，但不能只在标题和原文之间配一个同词。第2段恰好说distrust has risen、很多用户rarely or never trust news，描写的并不是相互信任越来越多。第3段的做法也不是“因为相信对方，所以接受消息”，而是主动交叉核对不同来源，甚至寻找opposing viewpoints。第5段进一步提醒转发者可能误读，必须对自己的分享负责。C把核实消息时分散依赖来源的方法，改成社交媒体上互信积累的总体趋势；这样第2段的信任降低与第5段的误读风险就很难承接。\n\n交叉核对不同来源、避免轻信消息，能够直接概括成社交媒体上的相互信任不断积累吗？\n\n不能。核实新闻的方法不等于互信增长的趋势，前文还明确写了不信任增加。\n\nC既读错整体变化方向，又把“distributed trust”的具体用法扩成全文主线，无法让几项调查共同服务于这个标题。\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2381,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"C"},"focusId":"focus-q30-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>社交媒体上相互信任的积累\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-C-1\">\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>社交媒体上相互信任的积累\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>摆出用户通过社交媒体逐渐建立相互信任的现象。\u003c/td>\n\u003ctd>先摆出一个现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释过去不信任和假消息为何需要被新的互信机制改变。\u003c/td>\n\u003ctd>再说为什么需要发生变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>具体写用户怎样核实身份、互动验证并逐步积累彼此信任。\u003c/td>\n\u003ctd>接着把已有变化写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>补充互信增长如何产生参与社会等另一种效果。\u003c/td>\n\u003ctd>接着补上另一种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>说明每个人真实、负责地分享消息怎样为共同信任继续添砖加瓦。\u003c/td>\n\u003ctd>再把问题落到每个人身上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到开头判断社交媒体中的互信确实在积累，并说明这种积累的意义。\u003c/td>\n\u003ctd>最后收回来再作判断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C里的Trust会让人想到第3段“distributed trust”，但不能只在标题和原文之间配一个同词。第2段恰好说distrust has risen、很多用户rarely or never trust news，描写的并不是相互信任越来越多。第3段的做法也不是“因为相信对方，所以接受消息”，而是主动交叉核对不同来源，甚至寻找opposing viewpoints。第5段进一步提醒转发者可能误读，必须对自己的分享负责。C把核实消息时分散依赖来源的方法，改成社交媒体上互信积累的总体趋势；这样第2段的信任降低与第5段的误读风险就很难承接。\u003c/p>\n\u003cp>交叉核对不同来源、避免轻信消息，能够直接概括成社交媒体上的相互信任不断积累吗？\u003c/p>\n\u003cp>不能。核实新闻的方法不等于互信增长的趋势，前文还明确写了不信任增加。\u003c/p>\n\u003cp>C既读错整体变化方向，又把“distributed trust”的具体用法扩成全文主线，无法让几项调查共同服务于这个标题。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. The Platforms for Projection of Personal Interests","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### D. The Platforms for Projection of Personal Interests\n\n展示个人兴趣的平台","context":{"mode":"image","asset":"questions","focus":[250,2381,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"30","option":"D"},"focusId":"focus-q30-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>展示个人兴趣的平台\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. The Platforms for Projection of Personal Interests","level":3,"raw":"#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n展示个人兴趣的平台\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 从用户的社交媒体选择展示平台能够投射个人兴趣。 | 先摆出一个现象 |\n| 2 | 解释人们为何需要能表达自身价值和兴趣的信息平台。 | 再说为什么需要发生变化 |\n| 3 | 具体写用户怎样选材、评论与分享来展示不同的个人兴趣。 | 接着把已有变化写具体 |\n| 4 | 补充兴趣表达还带来社群参与或联系等另一种效果。 | 接着补上另一种结果 |\n| 5 | 把平台的展示功能落到每个用户如何选择自己希望呈现的形象。 | 再把问题落到每个人身上 |\n| 6 | 回到最初选择，判断社交平台作为个人兴趣展示空间的作用。 | 最后收回来再作判断 |\n\nD最接近第5段开头values and interests，但那只是说明人们为什么会重新分享消息的一层背景。紧接着作者不是分类介绍兴趣平台，也不是评价平台哪一种展示功能最好，而是谈用户传递信息时的角色，再用Barna调查解释reader error。往前看，第2段的假新闻、第3段的核实来源，都在问消息是否可靠，不在问个人爱好怎样呈现。D把一段中的分享动机拿来覆盖全文，还把题目写成介绍平台的文章；这样年轻人越来越擅长辨别真假的变化就从标题中消失了。\n\n第5段提到兴趣与价值观，就足以让整篇变成介绍个人兴趣展示平台的文章吗？\n\n不够。该处只是分享行为的一个背景，后面的重点仍是判断新闻和对转发负责。\n\nD保留了社交媒体，却丢掉“怎样判断新闻”这一贯穿内容，用局部动机替代全文讨论的能力变化。\n\n判断：\n\n**D 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2381,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"30","option":"D"},"focusId":"focus-q30-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q30-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>展示个人兴趣的平台\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q30-D-1\">\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>展示个人兴趣的平台\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>从用户的社交媒体选择展示平台能够投射个人兴趣。\u003c/td>\n\u003ctd>先摆出一个现象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释人们为何需要能表达自身价值和兴趣的信息平台。\u003c/td>\n\u003ctd>再说为什么需要发生变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>具体写用户怎样选材、评论与分享来展示不同的个人兴趣。\u003c/td>\n\u003ctd>接着把已有变化写具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>补充兴趣表达还带来社群参与或联系等另一种效果。\u003c/td>\n\u003ctd>接着补上另一种结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>把平台的展示功能落到每个用户如何选择自己希望呈现的形象。\u003c/td>\n\u003ctd>再把问题落到每个人身上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>回到最初选择，判断社交平台作为个人兴趣展示空间的作用。\u003c/td>\n\u003ctd>最后收回来再作判断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D最接近第5段开头values and interests，但那只是说明人们为什么会重新分享消息的一层背景。紧接着作者不是分类介绍兴趣平台，也不是评价平台哪一种展示功能最好，而是谈用户传递信息时的角色，再用Barna调查解释reader error。往前看，第2段的假新闻、第3段的核实来源，都在问消息是否可靠，不在问个人爱好怎样呈现。D把一段中的分享动机拿来覆盖全文，还把题目写成介绍平台的文章；这样年轻人越来越擅长辨别真假的变化就从标题中消失了。\u003c/p>\n\u003cp>第5段提到兴趣与价值观，就足以让整篇变成介绍个人兴趣展示平台的文章吗？\u003c/p>\n\u003cp>不够。该处只是分享行为的一个背景，后面的重点仍是判断新闻和对转发负责。\u003c/p>\n\u003cp>D保留了社交媒体，却丢掉“怎样判断新闻”这一贯穿内容，用局部动机替代全文讨论的能力变化。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"30题结论","level":2,"raw":"### 30题结论\n\n**30. B. A Rise in Critical Skills for Sharing News Online**\n\n这句话就是本文后续做题的主旨底牌：\n\n**A Rise in Critical Skills for Sharing News Online / 在线分享新闻所需批判性技能的提升**","context":{"mode":"image","asset":"questions","focus":[250,2381,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"question":"30","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>30. B. A Rise in Critical Skills for Sharing News Online\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>A Rise in Critical Skills for Sharing News Online / 在线分享新闻所需批判性技能的提升\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"26题 · 题干、题型与核心出处","level":2,"raw":"## 26题\n\n> According to Paragraphs 1 and 2, many young Americans cast doubt on ______.  \n> 根据第1、2段，许多美国年轻人对什么抱有怀疑？\n\n### 题型\n\n跨段细节题。题干要求判断“根据第1、2段，许多美国年轻人对什么抱有怀疑？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump's use of Twitter. The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president's social media platform.\n>\n> Most Americans rely on social media to check daily headlines. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\n\n首段以年轻人反对总统推特用法切入，第二段扩展到社交媒体假消息与不信任，继而提出提高媒介素养。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"question":"26","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>According to Paragraphs 1 and 2, many young Americans cast doubt on ______.\u003cbr>根据第1、2段，许多美国年轻人对什么抱有怀疑？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>跨段细节题。题干要求判断“根据第1、2段，许多美国年轻人对什么抱有怀疑？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump&#39;s use of Twitter. The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president&#39;s social media platform.\u003c/p>\n\u003cp>Most Americans rely on social media to check daily headlines. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003c/blockquote>\n\u003cp>首段以年轻人反对总统推特用法切入，第二段扩展到社交媒体假消息与不信任，继而提出提高媒介素养。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. the justification of the news-filtering practice","level":3,"raw":"### A. the justification of the news-filtering practice\n\n> 对新闻进行筛选的正当性\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。\n\n**错误类型：第一类——歪曲原意。**\n\n先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。年轻人选择的是“经过筛选”，不是“未经筛选”。A用justification把怀疑落在筛选本身的正当性上，相当于把他们偏好的办法说成他们质疑的办法。句首那个名词没有读清，也不会改变prefer后面这组取舍。这里不能因为题干有cast doubt、原文有not，就随便把否定搬到filtered上；not对照的是后面的平台。\n\n两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。\n\n**命题人借用的原文材料：**\n\n> The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president's social media platform.","context":{"mode":"image","asset":"questions","focus":[250,418,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"26","option":"A"},"focusId":"focus-q26-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>对新闻进行筛选的正当性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。年轻人选择的是“经过筛选”，不是“未经筛选”。A用justification把怀疑落在筛选本身的正当性上，相当于把他们偏好的办法说成他们质疑的办法。句首那个名词没有读清，也不会改变prefer后面这组取舍。这里不能因为题干有cast doubt、原文有not，就随便把否定搬到filtered上；not对照的是后面的平台。\u003c/p>\n\u003cp>两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president&#39;s social media platform.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. the justification of the news-filtering practice","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 许多美国年轻人怀疑的是对新闻进行筛选的正当性。\n\nA的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。\n\n先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。年轻人选择的是“经过筛选”，不是“未经筛选”。A用justification把怀疑落在筛选本身的正当性上，相当于把他们偏好的办法说成他们质疑的办法。句首那个名词没有读清，也不会改变prefer后面这组取舍。这里不能因为题干有cast doubt、原文有not，就随便把否定搬到filtered上；not对照的是后面的平台。\n\n原句把筛选后的新闻放在偏好的一边，A却把筛选做法放到被怀疑的一边。\n\n两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。","context":{"mode":"image","asset":"questions","focus":[250,418,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"26","option":"A"},"focusId":"focus-q26-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>对新闻进行筛选的正当性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。年轻人选择的是“经过筛选”，不是“未经筛选”。A用justification把怀疑落在筛选本身的正当性上，相当于把他们偏好的办法说成他们质疑的办法。句首那个名词没有读清，也不会改变prefer后面这组取舍。这里不能因为题干有cast doubt、原文有not，就随便把否定搬到filtered上；not对照的是后面的平台。\u003c/p>\n\u003cp>两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president&#39;s social media platform.\u003c/p>\n\u003c/bl 文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Young people doubt whether news should be filtered through other sources.\u003c/p>\n\u003cp>年轻人怀疑新闻是否应该经由其他来源筛选。\u003c/p>\n\u003c/blockquote>\n\u003cp>首段说prefer过滤后的新闻，假设则怀疑过滤正当性，颠倒了他们的选择。后文交叉核对渠道也在积极筛选。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. the justification of the news-filtering practice","level":4,"raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A Rise in Critical Skills for Sharing News Online  \n> 在线分享新闻所需批判性技能的提升\n\n把这个主旨直接代入26题题干：\n\n> 标题关注在线分享新闻的批判技能，怀疑的对象应与新闻是否可信相连；不能把对消息可靠性的审查改成否定筛选本身。\n\nA实际说的是：\n\n> the justification of the news-filtering practice  \n> 对新闻进行筛选的正当性\n\n两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。\n\n从全文推进看，这一处的作用是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,418,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"26","option":"A"},"focusId":"focus-q26-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-A-0\">\u003cblockquote>\n\u003cp>对新闻进行筛选的正当性\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。年轻人选择的是“经过筛选”，不是“未经筛选”。A用justification把怀疑落在筛选本身的正当性上，相当于把他们偏好的办法说成他们质疑的办法。句首那个名词没有读清，也不会改变prefer后面这组取舍。这里不能因为题干有cast doubt、原文有not，就随便把否定搬到filtered上；not对照的是后面的平台。\u003c/p>\n\u003cp>两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp ote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题关注在线分享新闻的批判技能，怀疑的对象应与新闻是否可信相连；不能把对消息可靠性的审查改成否定筛选本身。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the justification of the news-filtering practice\u003cbr>对新闻进行筛选的正当性\u003c/p>\n\u003c/blockquote>\n\u003cp>两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. people’s preference for social media platforms","level":3,"raw":"### B. people’s preference for social media platforms\n\n> 人们对社交媒体平台的偏好\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B的people’s preference谈人们喜不喜欢用平台，第2段rely on social media也谈平台使用，因此先看这一句承认了什么，再看Yet后面转到哪件事。\n\n**错误类型：第三类——无中生有。**\n\nrely on social media先把很多人依赖社交媒体这件事说出来；Yet后面并没有否认这些人在使用平台，而是转到distrust，也就是使用时对所接收内容的不信任。B的people’s preference问“大家的使用偏好是否如此”，把“使用一个渠道”和“相信渠道里的新闻”混成同一问题。人完全可能继续使用平台，同时不轻信上面的消息。段落正是把这两件事并列后转折，不能把后面的不信任倒过来解释成作者在否认前面的普遍使用。\n\n原文把依赖平台作为现状，再说信任发生变化；B则把现状本身改成怀疑的对象，问题落错了地方。\n\n**命题人借用的原文材料：**\n\n> Most Americans rely on social media to check daily headlines.\n>\n> Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.","context":{"mode":"image","asset":"questions","focus":[250,500,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"26","option":"B"},"focusId":"focus-q26-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-B-0\">\u003cblockquote>\n\u003cp>人们对社交媒体平台的偏好\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的people’s preference谈人们喜不喜欢用平台，第2段re \n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Young people question whether Americans really prefer social media platforms.\u003c/p>\n\u003cp>年轻人质疑美国人是否真的偏好社交媒体平台。\u003c/p>\n\u003c/blockquote>\n\u003cp>most Americans rely on作为背景直接陈述，并未把大众是否偏好平台设为待证问题；不信任消息与是否使用平台可以并存。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题关注在线分享新闻的批判技能，怀疑的对象应与新闻是否可信相连；不能把对消息可靠性的审查改成否定筛选本身。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>people’s preference for social media platforms\u003cbr>人们对社交媒体平台的偏好\u003c/p>\n\u003c/blockquote>\n\u003cp>原文把依赖平台作为现状，再说信任发生变化；B则把现状本身改成怀疑的对象，问题落错了地方。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. the administration’s ability to handle information","level":3,"raw":"### C. the administration’s ability to handle information\n\n> 政府处理信息的能力\n\n**做题模式中的状态：** 第一轮C排除。当时选项呈现为“the [xxx]’s ability to handle information”，保留了相应遮挡。当时的定位线索是：C的ability to handle information是在评价某一方处理信息的能力，第2段rarely or never trust news是在评价收到的新闻是否可信，二者都涉及信息但对象不同，因此回看调查具体让谁不信任什么。\n\n**错误类型：第三类——无中生有。**\n\nrarely or never trust news的主体是Facebook用户，宾语是从媒体来的news。原文说他们很少或从不相信这些新闻，不是在测量另一方能不能办理、整理或处置信息。第1段“希望新闻经过其他来源筛选”也是选择接收渠道，并不能变成某一方没有处理信息的本领。不要把“新闻不可信”直接改写成“处理者没有能力”。\n\n这里的差别不是C前面的名词该怎么翻，而是后半句已经把调查的新闻可信度问题改成了信息处理能力问题。\n\n**命题人借用的原文材料：**\n\n> And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.","context":{"mode":"
