的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Young people question the administration’s ability to process information.\n>\n> 年轻人质疑政府处理信息的能力。\n\n原文针对总统发布方式，并扩展到各类媒体；没有对政府处理资料的行政能力作评价，平台使用不能替代能力判断。","context":{"mode":"image","asset":"questions","focus":[250,582,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"26","option":"C"},"focusId":"focus-q26-C-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q26-C-0\">\u003cblockquote>\n\u003cp>政府处理信息的能力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时选项呈现为“the [xxx]’s ability to handle information”，保留了相应遮挡。当时的定位线索是：C的ability to handle information是在评价某一方处理信息的能力，第2段rarely or never trust news是在评价收到的新闻是否可信，二者都涉及信息但对象不同，因此回看调查具体让谁不信任什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>rarely or never trust news的主体是Facebook用户，宾语是从媒体来的news。原文说他们很少或从不相信这些新闻，不是在测量另一方能不能办理、整理或处置信息。第1段“希望新闻经过其他来源筛选”也是选择接收渠道，并不能变成某一方没有处理信息的本领。不要把“新闻不可信”直接改写成“处理者没有能力”。\u003c/p>\n\u003cp>这里的差别不是C前面的名词该怎么翻，而是后半句已经把调查的新闻可信度问题改成了信息处理能力问题。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>许多美国年轻人怀疑的是政府处理信息的能力。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的ability to handle information是在评价某一方处理信息的能力，第2段rarely or never trust news是在评价收到的新闻是否可信，二者都涉及信息但对象不同，因此回看调查具体让谁不信任什么。\u003c/p>\n\u003cp>rarely or never trust news的主体是Facebook用户，宾语是从媒体来的news。原文说他们很少或从不相信这些新闻，不是在测量另一方能不能办理、整理或处置信息。第1段“希望新闻经过其他来源筛选”也是选择接收渠道，并不能变成某一方没有处理信息的本领。不要把“新闻 ，主体的行为与怀疑的对象能够连贯地读下来。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003cp>During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford.\u003c/p>\n\u003cp>And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003cp>首段以年轻人反对总统推特用法切入，第二段扩展到社交媒体假消息与不信任，继而提出提高媒介素养。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Young people are becoming skeptical of social media as a dependable source of news.\u003c/p>\n\u003cp>年轻人开始怀疑社交媒体是否为可靠的新闻来源。\u003c/p>\n\u003c/blockquote>\n\u003cp>从反对总统直接推文到假新闻比例和Facebook不信任，证据都落在消息可信度，下一步提高辨别能力由此自然引出。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q26-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入26题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>标题关注在线分享新闻的批判技能，怀疑的对象应与新闻是否可信相连；不能把对消息可靠性的审查改成否定筛选本身。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>social media as a reliable source of news\u003cbr>作为可靠新闻来源的社交媒体\u003c/p>\n\u003c/blockquote>\n\u003cp>从第1段的接收选择，到第2段的不信任和假新闻例子，主体的行为与怀疑的对象能够连贯地读下来。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"26题结论","level":2,"raw":"### 26题结论\n\n> **26. D. social media as a reliable source of news**\n\nA：先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。\n\nB：rely on social media先把很多人依赖社交媒体这件事说出来；Yet后面并没有否认这些人在使用平台，而是转到distrust，也就是使用时对所接收内容的不信任。\n\nC：rarely or never trust news的主体是Facebook用户，宾语是从媒体来的news。\n\nD：distrust has risen说明不是“已经放心相信”，而是不信任在增加。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"question":"26","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>26. D. social media as a reliable source of news\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。\u003c/p>\n\u003cp>B：rely on social media先把很多人依赖社交媒体这件事说出来；Yet后面并没有否认这些人在使用平台，而是转到distrust，也就是使用时对所接收内容的不信任。\u003c/p>\n\u003cp>C：rarely or never trust news的主体是Facebook用户，宾语是从媒体来的news。\u003c/p>\n\u003cp>D：distrust has risen说明不是“已经放心相信”，而是不信任在增加。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"27题 · 题干、题型与核心出处","level":2,"raw":"## 27题\n\n> The phrase “beef up” (Para. 2) is closest in meaning to ______.  \n> 第2段的短语“beef up”与下面哪个意思最接近？\n\n### 题型\n\n词义题。题干要求判断“第2段的短语“beef up”与下面哪个意思最接近？”，先按第2、3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Most Americans rely on social media to check daily headlines. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\n>\n> Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use \"distributed trust\" to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. \"Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,\" the survey concluded.\n\n不信任上升后，人们开始增强媒介素养，下一段以更善于区分事实与虚构、核对来源说明能力变化。","context":{"mode":"image","asset":"questions","focus":[250,820,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"question":"27","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The phrase “beef up” (Para. 2) is closest in meaning to ______.\u003cbr>第2段的短语“beef up”与下面哪个意思最接近？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>词义题。题干要求判断“第2段的短语“beef up”与下面哪个意思最接近？”，先按第2、3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Most Americans rely on social media to check daily headlines. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.\u003c/p>\n\u003cp>Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. &quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003c/blockquote>\n\u003cp>不信任上升后，人们开始增强媒介素养，下一段以更善于区分事实与虚构、核对来源说明能力变化。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. boast","level":3,"raw":"### A. boast\n\n> 吹嘘\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的boast说的是把自己说得很好，原句beef up their media literacy skills谈人们对技能做什么，因此回看技能前面的动作与Such a trend is badly needed怎样衔接。\n\n**错误类型：第一类——歪曲原意。**\n\nbeef up their media literacy skills的前因是对媒体的不信任上升，后面又说这种趋势badly needed。接下去的假新闻和低信任比例，说明遇到的难题是消息难辨真假；因此这里需要的是让判断新闻的能力发生实际变化。boast却只让人夸耀自己有能力，既不改变能力，也不解决真假难辨。不能把“对自己的技能有信心”和“把技能练得更好”当作一回事，原句紧接着强调需求，是在说后一种实际应对。\n\n把boast放回句子，前面的信任问题与后面的“非常需要”就接不上了：问题需要处理，不需要自我夸耀。\n\n**命题人借用的原文材料：**\n\n> Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.","context":{"mode":"image","asset":"questions","focus":[250,911,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"27","option":"A"},"focusId":"focus-q27-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q27-A-0\">\u003cblockquote>\n\u003cp>吹嘘\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的boast说的是把自己说得很好，原句beef up their media literacy skills谈人们对技能做什么，因此回看技能前面的动作与Such a trend is badly needed怎样衔接。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>beef up their media literacy skills的前因是对媒体的不信任上升，后面又说这种趋势badly needed。接下去的假新闻和低信任比例，说明遇到的难题是消息难辨真假；因此这里需要的是让判断新闻的能力发生实际变化。boast却只让人夸耀自己有能力，既不改变能力，也不解决真假难辨。不能把“对自己的技能有信心”和“把技能练得更好”当作一回事，原句紧接着强调需求，是在说后一种实际应对。\u003c/p>\n\u003cp>把boast放回句子，前面的信任问题与后面的“非常需要”就接不上了：问题需要处理，不需要自我夸耀。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as dis  literacy skills，人们要处理的是自己的技能。D的share把“分享新闻内容”的动作挪给了“媒体素养技能”，但把技能传给别人并不等于自己的技能有所提高。这一段先提出需要，再举假新闻说明需要为什么迫切，不是在介绍人们已经怎样给别人讲授技能。两个句子都涉及网络，并不代表动词和宾语可以互相搬动。\n\nD改变了动词作用的对象，也把个人面对新闻时的能力改进换成了向外分享。不能仅凭同段出现shared就选它。\n\n**命题人借用的原文材料：**\n\n> Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\n>\n> During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford.","context":{"mode":"image","asset":"questions","focus":[250,1158,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"27","option":"D"},"focusId":"focus-q27-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q27-D-0\">\u003cblockquote>\n\u003cp>分享\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的share容易让人想到同段shared by Twitter users，两处都可能出现“分享”，因此回看Twitter用户分享的究竟是什么，再看beef up后面的宾语。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>shared by Twitter users修饰的是web content，分享的是网络内容；beef up后面则是their media literacy skills，人们要处理的是自己的技能。D的share把“分享新闻内容”的动作挪给了“媒体素养技能”，但把技能传给别人并不等于自己的技能有所提高。这一段先提出需要，再举假新闻说明需要为什么迫切，不是在介绍人们已经怎样给别人讲授技能。两个句子都涉及网络，并不代表动词和宾语可以互相搬动。\u003c/p>\n\u003cp>D改变了动词作用的对象，也把个人面对新闻时的能力改进换成了向外分享。不能仅凭同段出现shared就选它。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\u003c/p>\n\u003cp>During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title" on的调查，年轻人怎么样？\n\n### 题型\n\n调查发现题。题干要求判断“根据Knight Foundation的调查，年轻人怎么样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use \"distributed trust\" to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. \"Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,\" the survey concluded.\n\n调查对象用分布式信任核实新闻，交叉检查来源、主动寻找不同观点；自我学习责任服务于这种核实行动。","context":{"mode":"image","asset":"questions","focus":[250,1312,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"question":"28","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>According to the Knight Foundation survey, young people ______.\u003cbr>根据Knight Foundation的调查，年轻人怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>调查发现题。题干要求判断“根据Knight Foundation的调查，年轻人怎么样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories. They cross-check sources and prefer news from different perspectives – especially those that are open about any bias. &quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003c/blockquote>\n\u003cp>调查对象用分布式信任核实新闻，交叉检查来源、主动寻找不同观点；自我学习责任服务于这种核实行动。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. tend to voice their opinions 因此回看to verify stories与cross-check之间的连接。\u003c/p>\n\u003cp>to verify stories先说目的：核实消息。紧接着They cross-check sources再说怎样核实：把不同来源对照起来。B的diverse sources没有额外增加一种新行为，而是把交叉核对所涉及的多个来源说出来，再用verify news保留核实新闻的目的。B同时接住目的和做法，不是只碰巧有一个同义词。\u003c/p>\n\u003cp>调查对象用分布式信任核实新闻，交叉检查来源、主动寻找不同观点；自我学习责任服务于这种核实行动。\u003c/p>\n\u003cp>verify stories给目的，cross-check sources给方法，different perspectives补足范围，三处共同构成选项的核实动作。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. verify news by referring to diverse sources","level":4,"raw":"#### 写作视角法\n\n原文第3段是这样写的：\n\n> A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use \"distributed trust\" to verify stories.\n>\n> They cross-check sources and prefer news from different perspectives – especially those that are open about any bias.\n>\n> 调查对象用分布式信任核实新闻，交叉检查来源、主动寻找不同观点；自我学习责任服务于这种核实行动。\n\n把这一处放回全文，它承担的写作任务是：用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Young people verify stories by comparing information from different sources.\n>\n> 年轻人通过比较不同来源的信息来核实报道。\n\nverify stories给目的，cross-check sources给方法，different perspectives补足范围，三处共同构成选项的核实动作。","context":{"mode":"image","asset":"questions","focus":[250,1487,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"28","option":"B"},"focusId":"focus-q28-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q28-B-0\">\u003cblockquote>\n\u003cp>通过参考不同来源核实新闻\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的diverse sources说不止一个来源，原文cross-check sources说把来源交叉核对；两者都涉及用不同来源核实同一消息，因此回看to verify stories与cross-check之间的连接。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>verify stories给目的，cross-check sources给方法，different perspectives补足范围，三处共同构成选项的核实动作。\u003c/p>\n\u00 供的是怎样核实新闻的具体例子。责任感须受for educating themselves限定，不能泛化为一切社会责任。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>verify news by referring to diverse sources\u003cbr>通过参考不同来源核实新闻\u003c/p>\n\u003c/blockquote>\n\u003cp>to verify stories先说目的：核实消息。紧接着They cross-check sources再说怎样核实：把不同来源对照起来。B的diverse sources没有额外增加一种新行为，而是把交叉核对所涉及的多个来源说出来，再用verify news保留核实新闻的目的。B同时接住目的和做法，不是只碰巧有一个同义词。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. have a strong sense of social responsibility","level":3,"raw":"### C. have a strong sense of social responsibility\n\n> 具有强烈的社会责任感\n\n**做题模式中的状态：** 第一轮C保留。当时选项呈现为“have a strong sense of social [xxx]”，保留了相应遮挡。当时的定位线索是：C的social指向人与社会有关的某种意识，原文personal responsibility谈个人主动承担什么；二者可能有联系，因此回看这个责任具体接着哪些行为，而不要先把social后面的词补出来。读完全文后，做题模式再经交叉验证排除C，最终选择B。\n\n**错误类型：第一类——歪曲原意。**\n\n第3段的确出现personal responsibility，但后面紧接educating themselves和actively seeking out opposing viewpoints，责任范围是主动了解、核实新闻及接触不同观点。\n\nB的verify news by referring to diverse sources直接对应verify stories、cross-check sources及different perspectives。它既说明做什么，也保留怎样做；C只抓住responsibility这个显眼词，却弱化了段落实际展开的核实方法。\n\n**命题人借用的原文材料：**\n\n> \"Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,\" the survey concluded.","context":{"mode":"image","asset":"questions","focus":[250,1568,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"28","option":"C"},"focusId":"focus-q28-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q28-C-0\">\u003cblockquote>\n\u003cp>具有强烈的社会责任感\u003c/p>\n\u003c/blockquote>\n\u003cp>\u0 c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"28题结论","level":2,"raw":"### 28题结论\n\n> **28. B. verify news by referring to diverse sources**\n\nA：seeking out opposing viewpoints的动作是主动寻找，找到的是与自己不一样的看法，前面还接着educating themselves，说明年轻人在通过获取信息学习。\n\nB：verify stories给目的，cross-check sources给方法，different perspectives补足范围，三处共同构成选项的核实动作。\n\nC：第3段的确出现personal responsibility，但后面紧接educating themselves和actively seeking out opposing viewpoints，责任范围是主动了解、核实新闻及接触不同观点。\n\nD：use “distributed trust” to verify stories说“使用某种办法去核实新闻”，不是“对这个办法本身展开讨论”。","context":{"mode":"image","asset":"questions","focus":[250,1312,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"question":"28","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>28. B. verify news by referring to diverse sources\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：seeking out opposing viewpoints的动作是主动寻找，找到的是与自己不一样的看法，前面还接着educating themselves，说明年轻人在通过获取信息学习。\u003c/p>\n\u003cp>B：verify stories给目的，cross-check sources给方法，different perspectives补足范围，三处共同构成选项的核实动作。\u003c/p>\n\u003cp>C：第3段的确出现personal responsibility，但后面紧接educating themselves和actively seeking out opposing viewpoints，责任范围是主动了解、核实新闻及接触不同观点。\u003c/p>\n\u003cp>D：use “distributed trust” to verify stories说“使用某种办法去核实新闻”，不是“对这个办法本身展开讨论”。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"29题 · 题干、题型与核心出处","level":2,"raw":"## 29题\n\n> The Barna survey found that a main cause for the fake news problem is ______.  \n> Barna的调查发现，假新闻问题的一个主要原因是什么？\n\n### 题型\n\n原因细节题。题干要求判断“Barna的调查发现，假新闻问题的一个主要原因是什么？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and interests. This forces users to be more conscious of their role in passing along information. A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is \"reader error,\" more so than made-up stories or factual mistakes in reporting. About a third say the problem of fake news lies in \"misinterpretation or exaggeration of actual news\" via social media. In other words, the choice to share news on social media may be the heart of the issue. \"This indicates there is a real personal responsibility in counteracting this problem,\" says Roxanne Stone, editor in chief at Barna Group.\n\n调查将reader error列为首要原因，并以误读、夸大实际新闻解释它，接着强调转发选择和个人责任。","context":{"mode":"image","asset":"questions","focus":[250,1806,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"question":"29","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The Barna survey found that a main cause for the fake news problem is ______.\u003cbr>Barna的调查发现，假新闻问题的一个主要原因是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“Barna的调查发现，假新闻问题的一个主要原因是什么？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and interests. This forces users to be more conscious of their role in passing along information. A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting. About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of actual news&quot; via social media. In other words, the choice to share news on social media may be the heart of the issue. &quot;This indicates there is a real personal responsibility in counteracting this problem,&quot; says Roxanne Stone, editor in chief at Barna Group.\u003c/p>\n\u003c/blockquote>\n\u003cp>调查将reader error列为首要原因，并以误读、夸大实际新闻解释它，接着强调转发选择和个人责任。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. readers’ misinterpretation","level":3,"raw":"### A. readers’ misinterpretation\n\n> 读者的误读\n\n**做题模式中的状态：** 第一轮A保留。当时的定位线索是：A的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。\n\n**选项类型：正确同义改写。**\n\nreader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。\n\nA没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\n\n**正确选项的原文依据：**\n\n> A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is \"reader error,\" more so than made-up stories or factual mistakes in reporting.\n>\n> About a third say the problem of fake news lies in \"misinterpretation or exaggeration of actual news\" via social media.","context":{"mode":"image","asset":"questions","focus":[250,1979,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"29","option":"A"},"focusId":"focus-q29-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-A-0\">\u003cblockquote>\n\u003cp>读者的误读\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。\u003c/p>\n\u003cp>A没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003cp>About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of actual news&quot; via social media.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. readers’ misinterpretation","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Barna调查认为，假新闻的一个主要原因是读者的误读。\n\nA的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。\n\nreader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。\n\nA没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。","context":{"mode":"image","asset":"questions","focus":[250,1979,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"29","option":"A"},"focusId":"focus-q29-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-A-0\">\u003cblockquote>\n\u003cp>读者的误读\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。\u003c/p>\n\u003cp>A没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003cp>About a third say the problem of fake news lies in &quot;misinterpretation or e sinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。\u003c/p>\n\u003cp>A没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003cp>About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of actual news&quot; via social media.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Barna调查认为，假新闻的一个主要原因是读者的误读。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。\u003c/p>\n\u003cp>reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。\u003c/p>\n\u003cp>A没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003cp>About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of actual news&quot; via social media.\u003c/p>\n\u003cp>调查将reader error列为首要原因，并以误读、夸大实际新闻解释它，接着强调转发选择和个人责任。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Readers’ misinterpretation of actual news is a leading cause of the problem.\u003c/p>\n\u003cp>读者对真实新闻的误解是这一问题的主要原因之一。\u003c/p>\n\u003c/blockquote>\n\u003cp>选项保留读者主体和误解动作，misinterpretation是reader error的具体解释。它没有声称所有假消息都由读者造成。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. readers’ misinterpretation","level":4,"raw":"#### 主旨交叉验证法\n\n30题的正确答案是：\n\n> A Rise in Critical Skills for Sharing News Online  \n> 在线分享新闻所需批判性技能的提升\n\n把这个主旨直接代入29题题干：\n\n> 主旨要求用户提高判断和分享技能，本段把责任落到读者对真实消息的误解与扩张；记者问题即使存在，也不能取代该调查排列的主要原因。\n\nA实际说的是：\n\n> readers’ misinterpretation  \n> 读者的误读\n\nA没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\n\n从全文推进看，这一处的作用是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。\n\n这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\n\n**复盘判断：A正确。**","context":{"mode":"image","asset":"questions","focus":[250,1979,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"29","option":"A"},"focusId":"focus-q29-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-A-0\">\u003cblockquote>\n\u003cp>读者的误读\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。\u003c/p>\n\u003cp>A没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003c l":4,"raw":"#### 写作视角法\n\n原文第5段是这样写的：\n\n> Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and interests.\n>\n> About a third say the problem of fake news lies in \"misinterpretation or exaggeration of actual news\" via social media.\n>\n> 调查将reader error列为首要原因，并以误读、夸大实际新闻解释它，接着强调转发选择和个人责任。\n\n把这一处放回全文，它承担的写作任务是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果C真是作者的意思，文章至少得写成：\n\n> The problem mainly comes from readers holding outdated values.\n>\n> 这一问题主要源于读者持有过时的价值观。\n\nvalues and interests解释分享的自我投射，并未评价这些价值观过时。假设需另加outdated的时间评价，不能由有立场推得。","context":{"mode":"image","asset":"questions","focus":[250,2143,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"29","option":"C"},"focusId":"focus-q29-C-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q29-C-0\">\u003cblockquote>\n\u003cp>读者过时的价值观\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的outdated values容易让人想到本段前面的values and interests，两者都说价值观，因此先看前句怎样使用这个词，再看调查怎样说明错误。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>values and interests出现在介绍用户重新分享新闻的行为时，原句并没有给这些价值观排一个新旧次序。到了调查解释原因的位置，词变成misinterpretation，说的是对真实新闻理解出了问题。C的outdated values却把原因改成价值观已经过时，多出了outdated这一时间和评价判断，也把“如何理解消息”改成“持有什么年代的观念”。即使一个人的分享与兴趣有关，也不能因此说他的兴趣或价值观落后，更不能将它自动设为误读的原因。\u003c/p>\n\u003cp>C不仅增加了原句没有作出的新旧判断，还把两个相邻的话题强接成因果，改变了调查所写的具体错误。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and interests.\u003c/p>\n\u003cp>About a third say the problem of fake news 任。原文当然没有宣称编造毫无影响，但这不能抹掉top reason的明确排序。\u003c/p>\n\u003cp>D抓到了原词，却读反了这组词承担的比较作用；题干要的不是所有出现过的负面现象，而是调查强调的原因。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Barna调查认为，假新闻的一个主要原因是记者编造的故事。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的journalists’ made-up stories与原文made-up stories词面相近，但原文把它接在more so than made-up stories这一比较后半边，因此回看被比较的前一项是什么。\u003c/p>\n\u003cp>more so than made-up stories的前项是reader error：调查认为读者错误比编造的故事更突出。D的journalists’ made-up stories保留了后项的词，却丢了它在比较中的位置。这样选相当于看到“编造故事”就停下，不再读“比它更主要的是什么”。另外，原句只写made-up stories，D还把这些故事限定为记者编造；题目要找的读者责任因此被替换成新闻生产者责任。原文当然没有宣称编造毫无影响，但这不能抹掉top reason的明确排序。\u003c/p>\n\u003cp>D抓到了原词，却读反了这组词承担的比较作用；题干要的不是所有出现过的负面现象，而是调查强调的原因。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003cp>调查将reader error列为首要原因，并以误读、夸大实际新闻解释它，接着强调转发选择和个人责任。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The survey finds that fabricated stories by journalists are the chief cause.\u003c/p>\n\u003cp>调查发现记者编造报道是首要原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>编造故事作为比较项出现，实际more so than将读者错误排在它前面。假设把被比较的一方换成作者强调的主要原因。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q29-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求用户提高判断和分享技能，本段把责任落到读者对真实消息的误解与扩张；记者问题即使存在，也不能取代该调查排列的主要原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>journalists’ made-up stories\u003cbr>记者编造的故事\u003c/p>\n\u003c/blockquote>\n\u003cp>D抓到了原词，却读反了这组词承担的比较作用；题干要的不是所有出现过的负面现象，而是调查强调的原因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"29题结论","level":2,"raw":"### 29题结论\n\n> **29. A. readers’ misinterpretation**\n\nA：reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。\n\nB：more so than不是把前后两类原因排在同样的位置，而是把reader error放得比报道中的问题更突出。\n\nC：values and interests出现在介绍用户重新分享新闻的行为时，原句并没有给这些价值观排一个新旧次序。\n\nD：more so than made-up stories的前项是reader error：调查认为读者错误比编造的故事更突出。","context":{"mode":"image","asset":"questions","focus":[250,1806,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 2题目"},"meta":{"question":"29","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>29. A. readers’ misinterpretation\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。\u003c/p>\n\u003cp>B：more so than不是把前后两类原因排在同样的位置，而是把reader error放得比报道中的问题更突出。\u003c/p>\n\u003cp>C：values and interests出现在介绍用户重新分享新闻的行为时，原句并没有给这些价值观排一个新旧次序。\u003c/p>\n\u003cp>D：more so than made-up stories的前项是reader error：调查认为读者错误比编造的故事更突出。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：年轻人对总统社交媒体使用的质疑**（段落1引入话题） 调查发现：超过2/3年轻美国人不赞成特朗普使用推特 → 含义：千禧一代更希望白宫新闻通过其他来源过滤（而非总统社交媒体平台）\n\n↓（现状与需求）\n\n**逻辑层次2：社交媒体的问题与媒体素养的需求**（段落2问题呈现） 现状矛盾：【大多数美国人依赖社交媒体看新闻 // 但对所有媒体的不信任上升】→ 应对：人们开始加强媒体素养技能（急需的趋势）→ 问题严重性：【密歇根1/4推特内容是假新闻 + 44%脸书用户不信任脸书新闻】\n\n↓（年轻人的应对）\n\n**逻辑层次3：年轻人的媒体素养技能提升**（段落3解决方案） 数字原住民优势：年轻人更擅长区分网络事实与虚构 → 具体方法：【使用\"分布式信任\"验证 + 交叉核对信息源 + 偏好不同视角（特别是公开偏见的）】→ 态度：承担个人责任主动寻找相反观点\n\n↓（积极影响）\n\n**逻辑层次4：媒体素养带来的额外效果**（段落4补充效果） 研究发现：年轻人对社交媒体的依赖 → 导致更大的政治参与\n\n↓（深层分析）\n\n**逻辑层次5：假新闻的根源与个人责任**（段落5问题本质） 社交媒体特性：【允许亲密即时体验新闻 + 重新分享作为价值观投射】→ 迫使用户意识到传播责任 → 巴纳调查：假新闻首要原因是\"读者错误\"（误解或夸大实际新闻）// 而非编造或事实错误 → 核心：分享选择是问题关键 → 个人责任的重要性\n\n↑（总结升华）\n\n**逻辑层次6：年轻人展现的思维纪律**（段落6结论） 年轻人批评过度发推特的总统 → 展现了：【思考技能的思维纪律 + 社交媒体分享选择的纪律】\n\n全文核心观点：年轻人对总统过度使用社交媒体的批评，反映出他们正在发展更强的媒体素养技能。面对假新闻问题，他们通过分布式信任、交叉验证等方法提升辨别能力，并在社交媒体分享时展现出思维纪律和个人责任感。\n\n****","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：年轻人对总统社交媒体使用的质疑\u003c/strong>（段落1引入话题） 调查发现：超过2/3年轻美国人不赞成特朗普使用推特 → 含义：千禧一代更希望白宫新闻通过其他来源过滤（而非总统社交媒体平台）\u003c/p>\n\u003cp>↓（现状与需求）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：社交媒体的问题与媒体素养的需求\u003c/strong>（段落2问题呈现） 现状矛盾：【大多数美国人依赖社交媒体看新闻 // 但对所有媒体的不信任上升】→ 应对：人们开始加强媒体素养技能（急需的趋势）→ 问题严重性：【密歇根1/4推特内容是假新闻 + 44%脸书用户不信任脸书新闻】\u003c/p>\n\u003cp>↓（年轻人的应对）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：年轻人的媒体素养技能提升\u003c/strong>（段落3解决方案） 数字原住民优势：年轻人更擅长区分网络事实与虚构 → 具体方法：【使用&quot;分布式信任&quot;验证 + 交叉核对信息源 + 偏好不同视角（特别是公开偏见的）】→ 态度：承担个人责任主动寻找相反观点\u003c/p>\n\u003cp>↓（积极影响）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：媒体素养带来的额外效果\u003c/strong>（段落4补充效果） 研究发现：年轻人对社交媒体的依赖 → 导致更大的政治参与\u003c/p>\n\u003cp>↓（深层分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：假新闻的根源与个人责任\u003c/strong>（段落5问题本质） 社交媒体特性：【允许亲密即时体验新闻 + 重新分享作为价值观投射】→ 迫使用户意识到传播责任 → 巴纳调查：假新闻首要原因是&quot;读者错误&quot;（误解或夸大实际新闻）// 而非编造或事实错误 → 核心：分享选择是问题关键 → 个人责任的重要性\u003c/p>\n\u003cp>↑（总结升华）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次6：年轻人展现的思维纪律\u003c/strong>（段落6结论） 年轻人批评过度发推特的总统 → 展现了：【思考技能的思维纪律 + 社交媒体分享选择的纪律】\u003c/p>\n\u003cp>全文核心观点：年轻人对总统过度使用社交媒体的批评，反映出他们正在发展更强的媒体素养技能。面对假新闻问题，他们通过分布式信任、交叉验证等方法提升辨别能力，并在社交媒体分享时展现出思维纪律和个人责任感。\u003c/p>\n\u003chr>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n**答案：E. Distrust Can Prompt a More Active Reader / 不信任可促成更主动的读者**\n\n从不赞成直接发声转向主动筛选和核查的可能。\n\n> Disapproval of a prominent person’s social media habits does not necessarily signal a retreat from news.\n>\n> The important development is the response to uncertainty: an audience may become more demanding instead of merely more cynical.\n\n段内推进：\n\n> 从不赞成直接发声转向主动筛选和核查的可能。\n\nDistrust对应不再仅因账号熟悉便相信帖子，Active Reader对应检查和筛选信息；can保留可能的发展方向，没有说每个怀疑者都必然进步。\n\n最强干扰项C（Proof That All Social Media News Is False）容易因相同话题进入考虑。但要求审查来源没有断言所有社交媒体消息都虚假。\n\n**41题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：E. Distrust Can Prompt a More Active Reader / 不信任可促成更主动的读者\u003c/strong>\u003c/p>\n\u003cp>从不赞成直接发声转向主动筛选和核查的可能。\u003c/p>\n\u003cblockquote>\n\u003cp>Disapproval of a prominent person’s social media habits does not necessarily signal a retreat from news.\u003c/p>\n\u003cp>The important development is the response to uncertainty: an audience may become more demanding instead of merely more cynical.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从不赞成直接发声转向主动筛选和核查的可能。\u003c/p>\n\u003c/blockquote>\n\u003cp>Distrust对应不再仅因账号熟悉便相信帖子，Active Reader对应检查和筛选信息；can保留可能的发展方向，没有说每个怀疑者都必然进步。\u003c/p>\n\u003cp>最强干扰项C（Proof That All Social Media News Is False）容易因相同话题进入考虑。但要求审查来源没有断言所有社交媒体消息都虚假。\u003c/p>\n\u003cp>\u003cstrong>41题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n**答案：F. Trusting Several Sources with Care / 审慎信任多种来源**\n\n说明交叉核查、识别偏向和寻找相反观点怎样组成分散信任。\n\n> A careful reader does not need to place complete faith in one source.\n>\n> What matters is the reader’s willingness to examine evidence instead of treating familiarity as a guarantee.\n\n段内推进：\n\n> 说明交叉核查、识别偏向和寻找相反观点怎样组成分散信任。\n\nSeveral Sources对应比较不同报道并寻找相反观点，with Care对应观察证据和来源偏向；标题不是让人无差别相信所有声音。\n\n最强干扰项B（Leaving Verification Entirely to Publishers）容易因相同话题进入考虑。但比较过程需要读者主动参与，不能把责任完全交还发布机构。\n\n**42题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：F. Trusting Several Sources with Care / 审慎信任多种来源\u003c/strong>\u003c/p>\n\u003cp>说明交叉核查、识别偏向和寻找相反观点怎样组成分散信任。\u003c/p>\n\u003cblockquote>\n\u003cp>A careful reader does not need to place complete faith in one source.\u003c/p>\n\u003cp>What matters is the reader’s willingness to examine evidence instead of treating familiarity as a guarantee.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明交叉核查、识别偏向和寻找相反观点怎样组成分散信任。\u003c/p>\n\u003c/blockquote>\n\u003cp>Several Sources对应比较不同报道并寻找相反观点，with Care对应观察证据和来源偏向；标题不是让人无差别相信所有声音。\u003c/p>\n\u003cp>最强干扰项B（Leaving Verification Entirely to Publishers）容易因相同话题进入考虑。但比较过程需要读者主动参与，不能把责任完全交还发布机构。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n**答案：A. From Checking Information to Public Participation / 从核查信息到公共参与**\n\n将主动研究与政治参与联系起来，并限定不是媒介自动保证结果。\n\n> The effort to investigate news can affect more than the accuracy of a single belief.\n>\n> The connection depends on what people do with the information they encounter.\n\n段内推进：\n\n> 将主动研究与政治参与联系起来 → 并限定不是媒介自动保证结果。\n\nChecking Information对应追踪议题证据和利益差异，Public Participation对应进一步关注公共决策、参与议题；标题保留从核查到参与的推进。\n\n最强干扰项C（Proof That All Social Media News Is False）容易因相同话题进入考虑。但本段讨论积极参与的可能，与认定媒介全部失实不是同一命题。\n\n**43题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：A. From Checking Information to Public Participation / 从核查信息到公共参与\u003c/strong>\u003c/p>\n\u003cp>将主动研究与政治参与联系起来，并限定不是媒介自动保证结果。\u003c/p>\n\u003cblockquote>\n\u003cp>The effort to investigate news can affect more than the accuracy of a single belief.\u003c/p>\n\u003cp>The connection depends on what people do with the information they encounter.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>将主动研究与政治参与联系起来 → 并限定不是媒介自动保证结果。\u003c/p>\n\u003c/blockquote>\n\u003cp>Checking Information对应追踪议题证据和利益差异，Public Participation对应进一步关注公共决策、参与议题；标题保留从核查到参与的推进。\u003c/p>\n\u003cp>最强干扰项C（Proof That All Social Media News Is False）容易因相同话题进入考虑。但本段讨论积极参与的可能，与认定媒介全部失实不是同一命题。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n**答案：G. Sharing Makes the Reader Part of the Problem / 分享使读者成为问题的一环**\n\n从即时分享和身份表达解释读者误读对传播的影响。\n\n> News travels further when readers choose to pass it on.\n>\n> People who redistribute information help shape what others understand, and they need to consider whether their own interpretation introduces an error into the chain.\n\n段内推进：\n\n> 从即时分享和身份表达解释读者误读对传播的影响。\n\nSharing对应读者转发的选择，Part of the Problem对应误解、夸大可在传播中引入错误；责任并未停留在新闻原作者。\n\n最强干扰项B（Leaving Verification Entirely to Publishers）容易因相同话题进入考虑。但段落直接把责任延伸到转发者，否定核实只属于原作者。\n\n**44题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：G. Sharing Makes the Reader Part of the Problem / 分享使读者成为问题的一环\u003c/strong>\u003c/p>\n\u003cp>从即时分享和身份表达解释读者误读对传播的影响。\u003c/p>\n\u003cblockquote>\n\u003cp>News travels further when readers choose to pass it on.\u003c/p>\n\u003cp>People who redistribute information help shape what others understand, and they need to consider whether their own interpretation introduces an error into the chain.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从即时分享和身份表达解释读者误读对传播的影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>Sharing对应读者转发的选择，Part of the Problem对应误解、夸大可在传播中引入错误；责任并未停留在新闻原作者。\u003c/p>\n\u003cp>最强干扰项B（Leaving Verification Entirely to Publishers）容易因相同话题进入考虑。但段落直接把责任延伸到转发者，否定核实只属于原作者。\u003c/p>\n\u003cp>\u003cstrong>44题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n**答案：D. A Skill under Development Rather Than a Perfect Defence / 正在发展的技能而非完美防线**\n\n肯定技能进步，同时保留错误仍会发生的限度。\n\n> There is no need to claim that young readers have solved misinformation in order to recognise improvement.\n>\n> Seeing this progress also changes the practical question: how can emerging habits of responsibility be supported so that more readers use them more consistently?\n\n段内推进：\n\n> 肯定技能进步 → 同时保留错误仍会发生的限度。\n\nSkill under Development对应核实、比较和分享习惯改善，Rather Than a Perfect Defence对应错误仍会继续出现；标题肯定进步但不夸成已经免疫。\n\n最强干扰项C（Proof That All Social Media News Is False）容易因相同话题进入考虑。但承认错误未消失与宣布全部信息虚假有明显程度差异。\n\n**45题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：D. A Skill under Development Rather Than a Perfect Defence / 正在发展的技能而非完美防线\u003c/strong>\u003c/p>\n\u003cp>肯定技能进步，同时保留错误仍会发生的限度。\u003c/p>\n\u003cblockquote>\n\u003cp>There is no need to claim that young readers have solved misinformation in order to recognise improvement.\u003c/p>\n\u003cp>Seeing this progress also changes the practical question: how can emerging habits of responsibility be supported so that more readers use them more consistently?\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>肯定技能进步 → 同时保留错误仍会发生的限度。\u003c/p>\n\u003c/blockquote>\n\u003cp>Skill under Development对应核实、比较和分享习惯改善，Rather Than a Perfect Defence对应错误仍会继续出现；标题肯定进步但不夸成已经免疫。\u003c/p>\n\u003cp>最强干扰项C（Proof That All Social Media News Is False）容易因相同话题进入考虑。但承认错误未消失与宣布全部信息虚假有明显程度差异。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出不信任可能促成主动研究 |\n| B | 说明表达自我如何导致误读和夸大 |\n| C | 转换角色，从读者到分享者 |\n| D | 将主动研究具体化为多源比较 |\n| E | 由核查推进到政治参与 |\n| F | 提出分享前可执行的核查责任 |\n| G | 解释相反观点与偏向透明的作用 |\n| H | 肯定正在形成的媒介素养 |\n\n全文推进：\n\n> 提出不信任可能促成主动研究 → 将主动研究具体化为多源比较 → 解释相反观点与偏向透明的作用 → 由核查推进到政治参与 → 转换角色，从读者到分享者 → 说明表达自我如何导致误读和夸大 → 提出分享前可执行的核查责任 → 肯定正在形成的媒介素养\n\n完整顺序：\n\n**A → D → G → E → C → B → F → H**\n\n41—45：D、G、C、B、F。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出不信任可能促成主动研究\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>说明表达自我如何导致误读和夸大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>转换角色，从读者到分享者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>将主动研究具体化为多源比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>由核查推进到政治参与\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>提出分享前可执行的核查责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>解释相反观点与偏向透明的作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>肯定正在形成的媒介素养\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出不信任可能促成主动研究 → 将主动研究具体化为多源比较 → 解释相反观点与偏向透明的作用 → 由核查推进到政治参与 → 转换角色，从读者到分享者 → 说明表达自我如何导致误读和夸大 → 提出分享前可执行的核查责任 → 肯定正在形成的媒介素养\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → G → E → C → B → F → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、G、C、B、F。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41位于全文第2个位置，完整衔接是A → D → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段A的结尾：\n\n> The second response turns uncertainty into a reason for active investigation, making distrust a possible starting point for better news habits.\n\n候选D的开头：\n\n> Active investigation begins with checking where a claim comes from.\n\n后段G的开头：\n\n> A broader base becomes especially useful when it includes views that challenge the reader’s first impression.\n\n前文已经落到`active investigation`，D继续处理这一对象，完成“将主动研究具体化为多源比较”。到本段末尾，讨论又落到`a broader base`，这正好为下一段“解释相反观点与偏向透明的作用”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 提出不信任可能促成主动研究 → 将主动研究具体化为多源比较 → 解释相反观点与偏向透明的作用\n\n最强候选G的功能是“解释相反观点与偏向透明的作用”。它也属于同一论题，但若直接放在这里，就会跳过“将主动研究具体化为多源比较”这一必要环节；其段首“A broader base becomes especially useful when it includes views that challenge the reader’s first impression.”需要的前提与A当前收束的对象不一致，后续也接不出G所需的`a broader base`。\n\n**41题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41位于全文第2个位置，完整衔接是A → D → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The second response turns uncertainty into a reason for active investigation, making distrust a possible starting point for better news habits.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Active investigation begins with checking where a claim comes from.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A broader base becomes especially useful when it includes views that challenge the reader’s first impression.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>active investigation\u003c/code>，D继续处理这一对 F所需的`interpretation during circulation`。\n\n**44题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44位于全文第6个位置，完整衔接是C → B → F。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The choice may project the reader’s values and interests, making sharing an act of self-expression as well as a way of distributing information.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Self-expression can distort a report if excitement or anger replaces attention to its actual meaning.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Care over interpretation during circulation gives readers a responsibility they can act on.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>self-expression\u003c/code>，B继续处理这一对象，完成“说明表达自我如何导致误读和夸大”。到本段末尾，讨论又落到\u003ccode>interpretation during circulation\u003c/code>，这正好为下一段“提出分享前可执行的核查责任”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>转换角色，从读者到分享者 → 说明表达自我如何导致误读和夸大 → 提出分享前可执行的核查责任\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“转换角色，从读者到分享者”。它也属于同一论题，但若直接放在这里，就会跳过“说明表达自我如何导致误读和夸大”这一必要环节；其段首“Those effects change again when a reader becomes a sharer.”需要的前提与C当前收束的对象不一致，后续也接不出F所需的\u003ccode>interpretation during circulation\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45位于全文第7个位置，完整衔接是B → F → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段B的结尾：\n\n> This is why misinformation cannot always be explained solely by mistakes at the point of publication: interpretation during circulation matters too.\n\n候选F的开头：\n\n> Care over interpretation during circulation gives readers a responsibility they can act on.\n\n后段H的开头：\n\n> That discipline is a developing skill rather than proof that an audience never errs.\n\n前文已经落到`interpretation during circulation`，F继续处理这一对象，完成“提出分享前可执行的核查责任”。到本段末尾，讨论又落到`the same discipline`，这正好为下一段“肯定正在形成的媒介素养”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 说明表达自我如何导致误读和夸大 → 提出分享前可执行的核查责任 → 肯定正在形成的媒介素养\n\n最强候选B的功能是“说明表达自我如何导致误读和夸大”。它也属于同一论题，但若直接放在这里，就会跳过“提出分享前可执行的核查责任”这一必要环节；其段首“Self-expression can distort a report if excitement or anger replaces attention to its actual meaning.”需要的前提与B当前收束的对象不一致，后续也接不出H所需的`the same discipline`。\n\n**45题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45位于全文第7个位置，完整衔接是B → F → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This is why misinformation cannot always be explained solely by mistakes at the point of publication: interpretation during circulation matters too.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Care over interpretation during circulation gives readers a responsibility they can act on.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That discipline is a developing skill rather than proof that an audience never errs.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>interpretation during circulation\u003c/code>，F继续处理这一对象，完成“提出分享前可执行的核查责任”。到本段末尾，讨论又落到\u003ccode>the same discipline\u003c/code>，这正好为下一段“肯定正在形成的媒介素养”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明表达自我如何导致误读和夸大 → 提出分享前可执行的核查责任 → 肯定正在形成的媒介素养\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“说明表达自我如何导致误读和夸大”。它也属于同一论题，但若直接放在这里，就会跳过“提出分享前可执行的核查责任”这一必要环节；其段首“Self-expression can distort a report if excitement or anger replaces attention to its actual meaning.”需要的前提与B当前收束的对象不一致，后续也接不出H所需的\u003ccode>the same discipline\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选F。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | eW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A checking several sources before sharing a claim.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画显示A在分享某个说法之前核查多个来源。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is comparing opposing viewpoints instead of accepting the first account encountered.\u003c/td>\n\u003ctd>A正比较相反观点，而非接受最先遇到的说法。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene highlights the reader’s responsibility in passing information to others.\u003c/td>\n\u003ctd>画面突出读者向他人传递信息时的责任。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The share of readers using A increased from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>使用A的读者比例由X升至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures indicate a rise in the use of multiple sources.\u003c/td>\n\u003ctd>这些数字表明使用多种来源的情况增加。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Nearly a quarter of the recorded items belonged to category A.\u003c/td>\n\u003ctd>记录的项目中近四分之一属于A类。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage describes a growing ability to distinguish fact from fiction.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文描述区分事实与虚构的能力正在增强。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author links active research with more responsible participation.\u003c/td>\n\u003ctd>作者将主动研究与更负责任的参与相联系。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion shifts attention const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. From Checking Information to Public Participation\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Leaving Verification Entirely to Publishers\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Proof That All Social Media News Is False\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. A Skill under Development Rather Than a Perfect Defence\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Distrust Can Prompt a More Active Reader\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Trusting Several Sources with Care\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Sharing Makes the Reader Part of the Problem\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>Disapproval of a prominent person’s social media habits does not necessarily signal a retreat from news. It may reveal a preference for information that has been filtered and examined. When readers become less willing to accept a post simply because it comes from a familiar account, distrust can become a reason to check. The important development is the response to uncertainty: an audience may become more demanding instead of merely more cynical.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>A careful reader does not need to place complete faith in one source. Different accounts can be compared, and a source’s declared point of view can help explain how it selects information. Seeking an opposing view is useful when it tests an assumption rather than simply adding noise. Trust becomes distributed across a process of comparison. What matters is the reader’s willingness to examine evidence instead of treating familiarity as a guarantee.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>The effort to investigate news can affect more than the accuracy of a single belief. A person who follows an issue across several sources may become more aware of competing interests and possible public responses. Social media use can thus accompany greater political engagement when it involves active inquiry. The medium alone does not ensure that outcome. The connection depends on what people do with the information they encounter.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>News travels further when readers choose to pass it on. That choice can express identity, sympathy or anger as much as a judgement about accuracy. An honest report may also become misleading when its meaning is exaggerated in sharing. Responsibility therefore cannot end with the original writer. People who redistribute information help shape what others understand, and they need to consider whether their own interpretation introduces an error into the chain.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>There is no need to claim that young readers have solved misinformation in order to recognise improvement. Greater care in checking, comparing and sharing can be a meaningful development even while mistakes continue. The standard should be a disciplined process, not an impossible promise of perfect judgement. Seeing this progress also changes the practical question: how can emerging habits of responsibility be supported so that more readers use them more consistently?\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>A reader who distrusts a social media post has several possible responses. One is to stop caring whether it is true. Another is to look more closely. The second response turns uncertainty into a reason for active investigation, making distrust a possible starting point for better news habits.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Self-expression can distort a report if excitement or anger replaces attention to its actual meaning. A reader may exaggerate a sound story without inventing a false one. This is why misinformation cannot always be explained solely by mistakes at the point of publication: interpretation during circulation matters too.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>Those effects change again when a reader becomes a sharer. Passing a story to friends adds a new decision to the chain of communication. The choice may project the reader’s values and interests, making sharing an act of self-expression as well as a way of distributing information.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Active investigation begins with checking where a claim comes from. The reader can compare accounts rather than relying on a single familiar page. Differences among sources may reveal missing context or competing interpretations. This work does not eliminate judgement; it gives judgement a broader base of information.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>Such a checking process may also draw people further into public issues. Following the evidence can reveal decisions they care about and encourage participation. Social media is therefore not necessarily a route to passive consumption; its effects depend in part on whether people use it to pursue questions actively.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>Care over interpretation during circulation gives readers a responsibility they can act on. Before sharing, they can revisit the source, compare their summary with its claim and ask whether important qualifications have disappeared. These practices apply the same discipline used in checking to the act of passing information onward.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>A broader base becomes especially useful when it includes views that challenge the reader’s first impression. A source that openly acknowledges its perspective can sometimes be easier to evaluate than one that conceals it. Trust, on this approach, is spread across a checking process instead of being surrendered to one voice.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>That discipline is a developing skill rather than proof that an audience never errs. Its growth is still worth recognising. The constructive response to unreliable information is to strengthen habits of checking, comparison and responsible sharing, so that readers become more capable participants in the news environment they help create.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2018英语一Text 2重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>survey\u003c/td>\n\u003ctd>n.调查\u003c/td>\n\u003ctd>two-thirds\u003c/td>\n\u003ctd>三分之二\u003c/td>\n\u003ctd>youn
