esponsibility for educating themselves and actively seeking out opposing viewpoints,&quot; the survey concluded.\u003c/p>\n\u003cp>调查对象用分布式信任核实新闻，交叉检查来源、主动寻找不同观点；自我学习责任服务于这种核实行动。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Young people demonstrate a strong sense of responsibility.\u003c/p>\n\u003cp>年轻人表现出强烈的责任感。\u003c/p>\n\u003c/blockquote>\n\u003cp>personal responsibility后面具体接自我教育和寻找反对观点。假设把限定对象换成社会整体，宽泛品质不能替代调查明确报告的核实方式。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调分享前的批判技能，本调查提供的是怎样核实新闻的具体例子。责任感须受for educating themselves限定，不能泛化为一切社会责任。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>have a strong sense of social responsibility\u003cbr>具有强烈的社会责任感\u003c/p>\n\u003c/blockquote>\n\u003cp>B的verify news by referring to diverse sources直接对应verify stories、cross-check sources及different perspectives。它既说明做什么，也保留怎样做；C只抓住responsibility这个显眼词，却弱化了段落实际展开的核实方法。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. like to exchange views on “distributed trust”\u003c/h3>\n\u003cblockquote>\n\u003cp>喜欢就分布式信任交换意见\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的exchange views把“distributed trust”当讨论的话题，原句use “distributed trust” to verify stories把它放在核实消息的方法位置；词相同但用途可能不同，因此回看use后面的to短语。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>use “distributed trust” to verify stories说“使用某种办法去核实新闻”，不是“对这个办法本身展开讨论”。D的exchange views后面接on “distributed trust”，把方法变成交换看法的话题。下一句交叉核对sources，是在解释怎么使用这个办法，并没有把年轻人安排成讨论这一术语定义或价值的小组。focus-group survey也只是调查形式，不能看到这个词就把调查结论改成“他们爱讨论这个概念”。要分开他们怎样被调查与调查发现他们怎样核实新闻。\u003c/p>\n\u003cp>D把to verify所指向的新闻核实活动改成了on所指向的概念讨论，原文中的方法和目的都被改换了位置。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories.\u003c/p>\n\u003cp>They cross-check sources and prefer news from different perspectives – especially those that are open about any bias.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Knight Foundation调查发现，年轻人喜欢就分布式信任交换意见。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的exchange views把“distributed trust”当讨论的话题，原句use “distributed trust” to verify stories把它放在核实消息的方法位置；词相同但用途可能不同，因此回看use后面的to短语。\u003c/p>\n\u003cp>use “distributed trust” to verify stories说“使用某种办法去核实新闻”，不是“对这个办法本身展开讨论”。D的exchange views后面接on “distributed trust”，把方法变成交换看法的话题。下一句交叉核对sources，是在解释怎么使用这个办法，并没有把年轻人安排成讨论这一术语定义或价值的小组。focus-group survey也只是调查形式，不能看到这个词就把调查结论改成“他们爱讨论这个概念”。要分开他们怎样被调查与调查发现他们怎样核实新闻。\u003c/p>\n\u003cp>D把to verify所指向的新闻核实活动改成了on所指向的概念讨论，原文中的方法和目的都被改换了位置。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use &quot;distributed trust&quot; to verify stories.\u003c/p>\n\u003cp>They cross-check sources and prefer news from different perspectives – especially those that are open about any bias.\u003c/p>\n\u003cp>调查对象用分布式信任核实新闻，交叉检查来源、主动寻找不同观点；自我学习责任服务于这种核实行动。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Young people enjoy exchanging opinions about the idea of distributed trust.\u003c/p>\n\u003cp>年轻人喜欢就分散信任这一概念交换意见。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文use distributed trust把它当方法，选项exchange views on把它变成谈论对象；使用一种方法不等于讨论该方法。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入28题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调分享前的批判技能，本调查提供的是怎样核实新闻的具体例子。责任感须受for educating themselves限定，不能泛化为一切社会责任。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>like to exchange views on “distributed trust”\u003cbr>喜欢就分布式信任交换意见\u003c/p>\n\u003c/blockquote>\n\u003cp>D把to verify所指向的新闻核实活动改成了on所指向的概念讨论，原文中的方法和目的都被改换了位置。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>28题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>28. B. verify news by referring to diverse sources\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：seeking out opposing viewpoints的动作是主动寻找，找到的是与自己不一样的看法，前面还接着educating themselves，说明年轻人在通过获取信息学习。\u003c/p>\n\u003cp>B：verify stories给目的，cross-check sources给方法，different perspectives补足范围，三处共同构成选项的核实动作。\u003c/p>\n\u003cp>C：第3段的确出现personal responsibility，但后面紧接educating themselves和actively seeking out opposing viewpoints，责任范围是主动了解、核实新闻及接触不同观点。\u003c/p>\n\u003cp>D：use “distributed trust” to verify stories说“使用某种办法去核实新闻”，不是“对这个办法本身展开讨论”。\u003c/p>\n\u003ch2>29题\u003c/h2>\n\u003cblockquote>\n\u003cp>The Barna survey found that a main cause for the fake news problem is ______.\u003cbr>Barna的调查发现，假新闻问题的一个主要原因是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“Barna的调查发现，假新闻问题的一个主要原因是什么？”，先按第5段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and interests. This forces users to be more conscious of their role in passing along information. A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting. About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of actual news&quot; via social media. In other words, the choice to share news on social media may be the heart of the issue. &quot;This indicates there is a real personal responsibility in counteracting this problem,&quot; says Roxanne Stone, editor in chief at Barna Group.\u003c/p>\n\u003c/blockquote>\n\u003cp>调查将reader error列为首要原因，并以误读、夸大实际新闻解释它，接着强调转发选择和个人责任。\u003c/p>\n\u003ch3>A. readers’ misinterpretation\u003c/h3>\n\u003cblockquote>\n\u003cp>读者的误读\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。\u003c/p>\n\u003cp>A没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003cp>About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of actual news&quot; via social media.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Barna调查认为，假新闻的一个主要原因是读者的误读。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。\u003c/p>\n\u003cp>reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。\u003c/p>\n\u003cp>A没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003cp>About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of actual news&quot; via social media.\u003c/p>\n\u003cp>调查将reader error列为首要原因，并以误读、夸大实际新闻解释它，接着强调转发选择和个人责任。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Readers’ misinterpretation of actual news is a leading cause of the problem.\u003c/p>\n\u003cp>读者对真实新闻的误解是这一问题的主要原因之一。\u003c/p>\n\u003c/blockquote>\n\u003cp>选项保留读者主体和误解动作，misinterpretation是reader error的具体解释。它没有声称所有假消息都由读者造成。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求用户提高判断和分享技能，本段把责任落到读者对真实消息的误解与扩张；记者问题即使存在，也不能取代该调查排列的主要原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>readers’ misinterpretation\u003cbr>读者的误读\u003c/p>\n\u003c/blockquote>\n\u003cp>A没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. journalists’ biased reporting\u003c/h3>\n\u003cblockquote>\n\u003cp>记者带偏见的报道\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时选项呈现为“journalists’ [xxx] reporting”，保留了相应遮挡。当时的定位线索是：B的journalists’把原因放在记者一边，原文more so than正把读者错误与报道问题比较，因此回看比较前后哪一边被列为top reason。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>more so than不是把前后两类原因排在同样的位置，而是把reader error放得比报道中的问题更突出。B即使有一个修饰报道的词没有读懂，journalists’仍明确把责任主体选为记者；原文top reason先落在读者，再用than把报道一侧放作比较。不能把“报道问题在比较句里出现过”当成“它就是题目要找的主要一项”。B的选择会把调查最强调的责任一方从读者移到记者，比较方向也随之改了。\u003c/p>\n\u003cp>这不是说报道绝对不会出问题，而是本题问这项调查突出发现了什么；B把比较中的另一方提到了主要位置。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Barna调查认为，假新闻的一个主要原因是记者带偏见的报道。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的journalists’把原因放在记者一边，原文more so than正把读者错误与报道问题比较，因此回看比较前后哪一边被列为top reason。\u003c/p>\n\u003cp>more so than不是把前后两类原因排在同样的位置，而是把reader error放得比报道中的问题更突出。B即使有一个修饰报道的词没有读懂，journalists’仍明确把责任主体选为记者；原文top reason先落在读者，再用than把报道一侧放作比较。不能把“报道问题在比较句里出现过”当成“它就是题目要找的主要一项”。B的选择会把调查最强调的责任一方从读者移到记者，比较方向也随之改了。\u003c/p>\n\u003cp>这不是说报道绝对不会出问题，而是本题问这项调查突出发现了什么；B把比较中的另一方提到了主要位置。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003cp>调查将reader error列为首要原因，并以误读、夸大实际新闻解释它，接着强调转发选择和个人责任。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The survey identifies journalists’ biased reporting as the main cause.\u003c/p>\n\u003cp>该调查认为记者带有偏向的报道是主要原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>有偏报道与误读不是同一主体动作。调查把reader error置于made-up stories和factual mistakes之上，没有把记者偏见列为首位。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求用户提高判断和分享技能，本段把责任落到读者对真实消息的误解与扩张；记者问题即使存在，也不能取代该调查排列的主要原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>journalists’ biased reporting\u003cbr>记者带偏见的报道\u003c/p>\n\u003c/blockquote>\n\u003cp>这不是说报道绝对不会出问题，而是本题问这项调查突出发现了什么；B把比较中的另一方提到了主要位置。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. readers’ outdated values\u003c/h3>\n\u003cblockquote>\n\u003cp>读者过时的价值观\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的outdated values容易让人想到本段前面的values and interests，两者都说价值观，因此先看前句怎样使用这个词，再看调查怎样说明错误。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>values and interests出现在介绍用户重新分享新闻的行为时，原句并没有给这些价值观排一个新旧次序。到了调查解释原因的位置，词变成misinterpretation，说的是对真实新闻理解出了问题。C的outdated values却把原因改成价值观已经过时，多出了outdated这一时间和评价判断，也把“如何理解消息”改成“持有什么年代的观念”。即使一个人的分享与兴趣有关，也不能因此说他的兴趣或价值观落后，更不能将它自动设为误读的原因。\u003c/p>\n\u003cp>C不仅增加了原句没有作出的新旧判断，还把两个相邻的话题强接成因果，改变了调查所写的具体错误。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and interests.\u003c/p>\n\u003cp>About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of actual news&quot; via social media.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Barna调查认为，假新闻的一个主要原因是读者过时的价值观。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的outdated values容易让人想到本段前面的values and interests，两者都说价值观，因此先看前句怎样使用这个词，再看调查怎样说明错误。\u003c/p>\n\u003cp>values and interests出现在介绍用户重新分享新闻的行为时，原句并没有给这些价值观排一个新旧次序。到了调查解释原因的位置，词变成misinterpretation，说的是对真实新闻理解出了问题。C的outdated values却把原因改成价值观已经过时，多出了outdated这一时间和评价判断，也把“如何理解消息”改成“持有什么年代的观念”。即使一个人的分享与兴趣有关，也不能因此说他的兴趣或价值观落后，更不能将它自动设为误读的原因。\u003c/p>\n\u003cp>前句只把价值观与分享联系起来，并没有认定它过时，更没有用过时解释误读。\u003c/p>\n\u003cp>C不仅增加了原句没有作出的新旧判断，还把两个相邻的话题强接成因果，改变了调查所写的具体错误。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and interests.\u003c/p>\n\u003cp>About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of actual news&quot; via social media.\u003c/p>\n\u003cp>调查将reader error列为首要原因，并以误读、夸大实际新闻解释它，接着强调转发选择和个人责任。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The problem mainly comes from readers holding outdated values.\u003c/p>\n\u003cp>这一问题主要源于读者持有过时的价值观。\u003c/p>\n\u003c/blockquote>\n\u003cp>values and interests解释分享的自我投射，并未评价这些价值观过时。假设需另加outdated的时间评价，不能由有立场推得。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求用户提高判断和分享技能，本段把责任落到读者对真实消息的误解与扩张；记者问题即使存在，也不能取代该调查排列的主要原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>readers’ outdated values\u003cbr>读者过时的价值观\u003c/p>\n\u003c/blockquote>\n\u003cp>C不仅增加了原句没有作出的新旧判断，还把两个相邻的话题强接成因果，改变了调查所写的具体错误。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. journalists’ made-up stories\u003c/h3>\n\u003cblockquote>\n\u003cp>记者编造的故事\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的journalists’ made-up stories与原文made-up stories词面相近，但原文把它接在more so than made-up stories这一比较后半边，因此回看被比较的前一项是什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>more so than made-up stories的前项是reader error：调查认为读者错误比编造的故事更突出。D的journalists’ made-up stories保留了后项的词，却丢了它在比较中的位置。这样选相当于看到“编造故事”就停下，不再读“比它更主要的是什么”。另外，原句只写made-up stories，D还把这些故事限定为记者编造；题目要找的读者责任因此被替换成新闻生产者责任。原文当然没有宣称编造毫无影响，但这不能抹掉top reason的明确排序。\u003c/p>\n\u003cp>D抓到了原词，却读反了这组词承担的比较作用；题干要的不是所有出现过的负面现象，而是调查强调的原因。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>Barna调查认为，假新闻的一个主要原因是记者编造的故事。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的journalists’ made-up stories与原文made-up stories词面相近，但原文把它接在more so than made-up stories这一比较后半边，因此回看被比较的前一项是什么。\u003c/p>\n\u003cp>more so than made-up stories的前项是reader error：调查认为读者错误比编造的故事更突出。D的journalists’ made-up stories保留了后项的词，却丢了它在比较中的位置。这样选相当于看到“编造故事”就停下，不再读“比它更主要的是什么”。另外，原句只写made-up stories，D还把这些故事限定为记者编造；题目要找的读者责任因此被替换成新闻生产者责任。原文当然没有宣称编造毫无影响，但这不能抹掉top reason的明确排序。\u003c/p>\n\u003cp>D抓到了原词，却读反了这组词承担的比较作用；题干要的不是所有出现过的负面现象，而是调查强调的原因。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is &quot;reader error,&quot; more so than made-up stories or factual mistakes in reporting.\u003c/p>\n\u003cp>调查将reader error列为首要原因，并以误读、夸大实际新闻解释它，接着强调转发选择和个人责任。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The survey finds that fabricated stories by journalists are the chief cause.\u003c/p>\n\u003cp>调查发现记者编造报道是首要原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>编造故事作为比较项出现，实际more so than将读者错误排在它前面。假设把被比较的一方换成作者强调的主要原因。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>30题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Rise in Critical Skills for Sharing News Online\u003cbr>在线分享新闻所需批判性技能的提升\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入29题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求用户提高判断和分享技能，本段把责任落到读者对真实消息的误解与扩张；记者问题即使存在，也不能取代该调查排列的主要原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>journalists’ made-up stories\u003cbr>记者编造的故事\u003c/p>\n\u003c/blockquote>\n\u003cp>D抓到了原词，却读反了这组词承担的比较作用；题干要的不是所有出现过的负面现象，而是调查强调的原因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>29题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>29. A. readers’ misinterpretation\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。\u003c/p>\n\u003cp>B：more so than不是把前后两类原因排在同样的位置，而是把reader error放得比报道中的问题更突出。\u003c/p>\n\u003cp>C：values and interests出现在介绍用户重新分享新闻的行为时，原句并没有给这些价值观排一个新旧次序。\u003c/p>\n\u003cp>D：more so than made-up stories的前项是reader error：调查认为读者错误比编造的故事更突出。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：年轻人对总统社交媒体使用的质疑\u003c/strong>（段落1引入话题） 调查发现：超过2/3年轻美国人不赞成特朗普使用推特 → 含义：千禧一代更希望白宫新闻通过其他来源过滤（而非总统社交媒体平台）\u003c/p>\n\u003cp>↓（现状与需求）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：社交媒体的问题与媒体素养的需求\u003c/strong>（段落2问题呈现） 现状矛盾：【大多数美国人依赖社交媒体看新闻 // 但对所有媒体的不信任上升】→ 应对：人们开始加强媒体素养技能（急需的趋势）→ 问题严重性：【密歇根1/4推特内容是假新闻 + 44%脸书用户不信任脸书新闻】\u003c/p>\n\u003cp>↓（年轻人的应对）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：年轻人的媒体素养技能提升\u003c/strong>（段落3解决方案） 数字原住民优势：年轻人更擅长区分网络事实与虚构 → 具体方法：【使用&quot;分布式信任&quot;验证 + 交叉核对信息源 + 偏好不同视角（特别是公开偏见的）】→ 态度：承担个人责任主动寻找相反观点\u003c/p>\n\u003cp>↓（积极影响）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：媒体素养带来的额外效果\u003c/strong>（段落4补充效果） 研究发现：年轻人对社交媒体的依赖 → 导致更大的政治参与\u003c/p>\n\u003cp>↓（深层分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：假新闻的根源与个人责任\u003c/strong>（段落5问题本质） 社交媒体特性：【允许亲密即时体验新闻 + 重新分享作为价值观投射】→ 迫使用户意识到传播责任 → 巴纳调查：假新闻首要原因是&quot;读者错误&quot;（误解或夸大实际新闻）// 而非编造或事实错误 → 核心：分享选择是问题关键 → 个人责任的重要性\u003c/p>\n\u003cp>↑（总结升华）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次6：年轻人展现的思维纪律\u003c/strong>（段落6结论） 年轻人批评过度发推特的总统 → 展现了：【思考技能的思维纪律 + 社交媒体分享选择的纪律】\u003c/p>\n\u003cp>全文核心观点：年轻人对总统过度使用社交媒体的批评，反映出他们正在发展更强的媒体素养技能。面对假新闻问题，他们通过分布式信任、交叉验证等方法提升辨别能力，并在社交媒体分享时展现出思维纪律和个人责任感。\u003c/p>\n\u003chr>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. From Checking Information to Public Participation\u003c/p>\n\u003cp>B. Leaving Verification Entirely to Publishers\u003c/p>\n\u003cp>C. Proof That All Social Media News Is False\u003c/p>\n\u003cp>D. A Skill under Development Rather Than a Perfect Defence\u003c/p>\n\u003cp>E. Distrust Can Prompt a More Active Reader\u003c/p>\n\u003cp>F. Trusting Several Sources with Care\u003c/p>\n\u003cp>G. Sharing Makes the Reader Part of the Problem\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>Disapproval of a prominent person’s social media habits does not necessarily signal a retreat from news. It may reveal a preference for information that has been filtered and examined. When readers become less willing to accept a post simply because it comes from a familiar account, distrust can become a reason to check. The important development is the response to uncertainty: an audience may become more demanding instead of merely more cynical.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>A careful reader does not need to place complete faith in one source. Different accounts can be compared, and a source’s declared point of view can help explain how it selects information. Seeking an opposing view is useful when it tests an assumption rather than simply adding noise. Trust becomes distributed across a process of comparison. What matters is the reader’s willingness to examine evidence instead of treating familiarity as a guarantee.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>The effort to investigate news can affect more than the accuracy of a single belief. A person who follows an issue across several sources may become more aware of competing interests and possible public responses. Social media use can thus accompany greater political engagement when it involves active inquiry. The medium alone does not ensure that outcome. The connection depends on what people do with the information they encounter.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>News travels further when readers choose to pass it on. That choice can express identity, sympathy or anger as much as a judgement about accuracy. An honest report may also become misleading when its meaning is exaggerated in sharing. Responsibility therefore cannot end with the original writer. People who redistribute information help shape what others understand, and they need to consider whether their own interpretation introduces an error into the chain.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>There is no need to claim that young readers have solved misinformation in order to recognise improvement. Greater care in checking, comparing and sharing can be a meaningful development even while mistakes continue. The standard should be a disciplined process, not an impossible promise of perfect judgement. Seeing this progress also changes the practical question: how can emerging habits of responsibility be supported so that more readers use them more consistently?\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>\u003cstrong>答案：E. Distrust Can Prompt a More Active Reader / 不信任可促成更主动的读者\u003c/strong>\u003c/p>\n\u003cp>从不赞成直接发声转向主动筛选和核查的可能。\u003c/p>\n\u003cblockquote>\n\u003cp>Disapproval of a prominent person’s social media habits does not necessarily signal a retreat from news.\u003c/p>\n\u003cp>The important development is the response to uncertainty: an audience may become more demanding instead of merely more cynical.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从不赞成直接发声转向主动筛选和核查的可能。\u003c/p>\n\u003c/blockquote>\n\u003cp>Distrust对应不再仅因账号熟悉便相信帖子，Active Reader对应检查和筛选信息；can保留可能的发展方向，没有说每个怀疑者都必然进步。\u003c/p>\n\u003cp>最强干扰项C（Proof That All Social Media News Is False）容易因相同话题进入考虑。但要求审查来源没有断言所有社交媒体消息都虚假。\u003c/p>\n\u003cp>\u003cstrong>41题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>\u003cstrong>答案：F. Trusting Several Sources with Care / 审慎信任多种来源\u003c/strong>\u003c/p>\n\u003cp>说明交叉核查、识别偏向和寻找相反观点怎样组成分散信任。\u003c/p>\n\u003cblockquote>\n\u003cp>A careful reader does not need to place complete faith in one source.\u003c/p>\n\u003cp>What matters is the reader’s willingness to examine evidence instead of treating familiarity as a guarantee.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明交叉核查、识别偏向和寻找相反观点怎样组成分散信任。\u003c/p>\n\u003c/blockquote>\n\u003cp>Several Sources对应比较不同报道并寻找相反观点，with Care对应观察证据和来源偏向；标题不是让人无差别相信所有声音。\u003c/p>\n\u003cp>最强干扰项B（Leaving Verification Entirely to Publishers）容易因相同话题进入考虑。但比较过程需要读者主动参与，不能把责任完全交还发布机构。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>\u003cstrong>答案：A. From Checking Information to Public Participation / 从核查信息到公共参与\u003c/strong>\u003c/p>\n\u003cp>将主动研究与政治参与联系起来，并限定不是媒介自动保证结果。\u003c/p>\n\u003cblockquote>\n\u003cp>The effort to investigate news can affect more than the accuracy of a single belief.\u003c/p>\n\u003cp>The connection depends on what people do with the information they encounter.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>将主动研究与政治参与联系起来 → 并限定不是媒介自动保证结果。\u003c/p>\n\u003c/blockquote>\n\u003cp>Checking Information对应追踪议题证据和利益差异，Public Participation对应进一步关注公共决策、参与议题；标题保留从核查到参与的推进。\u003c/p>\n\u003cp>最强干扰项C（Proof That All Social Media News Is False）容易因相同话题进入考虑。但本段讨论积极参与的可能，与认定媒介全部失实不是同一命题。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>\u003cstrong>答案：G. Sharing Makes the Reader Part of the Problem / 分享使读者成为问题的一环\u003c/strong>\u003c/p>\n\u003cp>从即时分享和身份表达解释读者误读对传播的影响。\u003c/p>\n\u003cblockquote>\n\u003cp>News travels further when readers choose to pass it on.\u003c/p>\n\u003cp>People who redistribute information help shape what others understand, and they need to consider whether their own interpretation introduces an error into the chain.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从即时分享和身份表达解释读者误读对传播的影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>Sharing对应读者转发的选择，Part of the Problem对应误解、夸大可在传播中引入错误；责任并未停留在新闻原作者。\u003c/p>\n\u003cp>最强干扰项B（Leaving Verification Entirely to Publishers）容易因相同话题进入考虑。但段落直接把责任延伸到转发者，否定核实只属于原作者。\u003c/p>\n\u003cp>\u003cstrong>44题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>\u003cstrong>答案：D. A Skill under Development Rather Than a Perfect Defence / 正在发展的技能而非完美防线\u003c/strong>\u003c/p>\n\u003cp>肯定技能进步，同时保留错误仍会发生的限度。\u003c/p>\n\u003cblockquote>\n\u003cp>There is no need to claim that young readers have solved misinformation in order to recognise improvement.\u003c/p>\n\u003cp>Seeing this progress also changes the practical question: how can emerging habits of responsibility be supported so that more readers use them more consistently?\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>肯定技能进步 → 同时保留错误仍会发生的限度。\u003c/p>\n\u003c/blockquote>\n\u003cp>Skill under Development对应核实、比较和分享习惯改善，Rather Than a Perfect Defence对应错误仍会继续出现；标题肯定进步但不夸成已经免疫。\u003c/p>\n\u003cp>最强干扰项C（Proof That All Social Media News Is False）容易因相同话题进入考虑。但承认错误未消失与宣布全部信息虚假有明显程度差异。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>A reader who distrusts a social media post has several possible responses. One is to stop caring whether it is true. Another is to look more closely. The second response turns uncertainty into a reason for active investigation, making distrust a possible starting point for better news habits.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Self-expression can distort a report if excitement or anger replaces attention to its actual meaning. A reader may exaggerate a sound story without inventing a false one. This is why misinformation cannot always be explained solely by mistakes at the point of publication: interpretation during circulation matters too.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Those effects change again when a reader becomes a sharer. Passing a story to friends adds a new decision to the chain of communication. The choice may project the reader’s values and interests, making sharing an act of self-expression as well as a way of distributing information.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Active investigation begins with checking where a claim comes from. The reader can compare accounts rather than relying on a single familiar page. Differences among sources may reveal missing context or competing interpretations. This work does not eliminate judgement; it gives judgement a broader base of information.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>Such a checking process may also draw people further into public issues. Following the evidence can reveal decisions they care about and encourage participation. Social media is therefore not necessarily a route to passive consumption; its effects depend in part on whether people use it to pursue questions actively.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>Care over interpretation during circulation gives readers a responsibility they can act on. Before sharing, they can revisit the source, compare their summary with its claim and ask whether important qualifications have disappeared. These practices apply the same discipline used in checking to the act of passing information onward.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>A broader base becomes especially useful when it includes views that challenge the reader’s first impression. A source that openly acknowledges its perspective can sometimes be easier to evaluate than one that conceals it. Trust, on this approach, is spread across a checking process instead of being surrendered to one voice.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>That discipline is a developing skill rather than proof that an audience never errs. Its growth is still worth recognising. The constructive response to unreliable information is to strengthen habits of checking, comparison and responsible sharing, so that readers become more capable participants in the news environment they help create.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出不信任可能促成主动研究\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>说明表达自我如何导致误读和夸大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>转换角色，从读者到分享者\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>将主动研究具体化为多源比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>由核查推进到政治参与\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>提出分享前可执行的核查责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>解释相反观点与偏向透明的作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>肯定正在形成的媒介素养\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出不信任可能促成主动研究 → 将主动研究具体化为多源比较 → 解释相反观点与偏向透明的作用 → 由核查推进到政治参与 → 转换角色，从读者到分享者 → 说明表达自我如何导致误读和夸大 → 提出分享前可执行的核查责任 → 肯定正在形成的媒介素养\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → G → E → C → B → F → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、G、C、B、F。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41位于全文第2个位置，完整衔接是A → D → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The second response turns uncertainty into a reason for active investigation, making distrust a possible starting point for better news habits.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Active investigation begins with checking where a claim comes from.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A broader base becomes especially useful when it includes views that challenge the reader’s first impression.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>active investigation\u003c/code>，D继续处理这一对象，完成“将主动研究具体化为多源比较”。到本段末尾，讨论又落到\u003ccode>a broader base\u003c/code>，这正好为下一段“解释相反观点与偏向透明的作用”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出不信任可能促成主动研究 → 将主动研究具体化为多源比较 → 解释相反观点与偏向透明的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选G的功能是“解释相反观点与偏向透明的作用”。它也属于同一论题，但若直接放在这里，就会跳过“将主动研究具体化为多源比较”这一必要环节；其段首“A broader base becomes especially useful when it includes views that challenge the reader’s first impression.”需要的前提与A当前收束的对象不一致，后续也接不出G所需的\u003ccode>a broader base\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42位于全文第3个位置，完整衔接是D → G → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This work does not eliminate judgement; it gives judgement a broader base of information.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A broader base becomes especially useful when it includes views that challenge the reader’s first impression.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Such a checking process may also draw people further into public issues.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a broader base\u003c/code>，G继续处理这一对象，完成“解释相反观点与偏向透明的作用”。到本段末尾，讨论又落到\u003ccode>a checking process\u003c/code>，这正好为下一段“由核查推进到政治参与”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>将主动研究具体化为多源比较 → 解释相反观点与偏向透明的作用 → 由核查推进到政治参与\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“将主动研究具体化为多源比较”。它也属于同一论题，但若直接放在这里，就会跳过“解释相反观点与偏向透明的作用”这一必要环节；其段首“Active investigation begins with checking where a claim comes from.”需要的前提与D当前收束的对象不一致，后续也接不出E所需的\u003ccode>a checking process\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43位于全文第5个位置，完整衔接是E → C → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Social media is therefore not necessarily a route to passive consumption; its effects depend in part on whether people use it to pursue questions actively.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those effects change again when a reader becomes a sharer.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Self-expression can distort a report if excitement or anger replaces attention to its actual meaning.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>effects\u003c/code>，C继续处理这一对象，完成“转换角色，从读者到分享者”。到本段末尾，讨论又落到\u003ccode>self-expression\u003c/code>，这正好为下一段“说明表达自我如何导致误读和夸大”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由核查推进到政治参与 → 转换角色，从读者到分享者 → 说明表达自我如何导致误读和夸大\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“说明表达自我如何导致误读和夸大”。它也属于同一论题，但若直接放在这里，就会跳过“转换角色，从读者到分享者”这一必要环节；其段首“Self-expression can distort a report if excitement or anger replaces attention to its actual meaning.”需要的前提与E当前收束的对象不一致，后续也接不出B所需的\u003ccode>self-expression\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44位于全文第6个位置，完整衔接是C → B → F。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The choice may project the reader’s values and interests, making sharing an act of self-expression as well as a way of distributing information.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Self-expression can distort a report if excitement or anger replaces attention to its actual meaning.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Care over interpretation during circulation gives readers a responsibility they can act on.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>self-expression\u003c/code>，B继续处理这一对象，完成“说明表达自我如何导致误读和夸大”。到本段末尾，讨论又落到\u003ccode>interpretation during circulation\u003c/code>，这正好为下一段“提出分享前可执行的核查责任”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>转换角色，从读者到分享者 → 说明表达自我如何导致误读和夸大 → 提出分享前可执行的核查责任\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“转换角色，从读者到分享者”。它也属于同一论题，但若直接放在这里，就会跳过“说明表达自我如何导致误读和夸大”这一必要环节；其段首“Those effects change again when a reader becomes a sharer.”需要的前提与C当前收束的对象不一致，后续也接不出F所需的\u003ccode>interpretation during circulation\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45位于全文第7个位置，完整衔接是B → F → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This is why misinformation cannot always be explained solely by mistakes at the point of publication: interpretation during circulation matters too.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Care over interpretation during circulation gives readers a responsibility they can act on.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That discipline is a developing skill rather than proof that an audience never errs.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>interpretation during circulation\u003c/code>，F继续处理这一对象，完成“提出分享前可执行的核查责任”。到本段末尾，讨论又落到\u003ccode>the same discipline\u003c/code>，这正好为下一段“肯定正在形成的媒介素养”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明表达自我如何导致误读和夸大 → 提出分享前可执行的核查责任 → 肯定正在形成的媒介素养\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“说明表达自我如何导致误读和夸大”。它也属于同一论题，但若直接放在这里，就会跳过“提出分享前可执行的核查责任”这一必要环节；其段首“Self-expression can distort a report if excitement or anger replaces attention to its actual meaning.”需要的前提与B当前收束的对象不一致，后续也接不出H所需的\u003ccode>the same discipline\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选F。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>media literacy\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>媒介素养\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类：获取信息的方式\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>critical thinking\u003c/td>\n\u003ctd>批判性思维\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsible sharing\u003c/td>\n\u003ctd>负责任的分享\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>mental discipline\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>思维自律\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：自律\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>openness to different views\u003c/td>\n\u003ctd>对不同观点的开放态度\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>informed participation\u003c/td>\n\u003ctd>知情参 \n\u003ctd>Nearly a quarter of the recorded items belonged to category A.\u003c/td>\n\u003ctd>记录的项目中近四分之一属于A类。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage describes a growing ability to distinguish fact from fiction.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文描述区分事实与虚构的能力正在增强。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author links active research with more responsible participation.\u003c/td>\n\u003ctd>作者将主动研究与更负责任的参与相联系。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion shifts attention from errors in production to errors in interpretation and sharing.\u003c/td>\n\u003ctd>讨论把注意力从生产环节的错误转向理解与分享中的错误。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
