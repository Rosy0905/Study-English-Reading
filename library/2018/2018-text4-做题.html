<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","contextRaw":"","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","contextRaw":"","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 36题题干\n\n**The financial problem with the USPS is caused partly by ______.**\n\n> USPS的财务问题，部分是由什么造成的？\n\n题型：**具体细节题**。","contextRaw":"","html":"<h2>36题题干</h2>\n<p><strong>The financial problem with the USPS is caused partly by ______.</strong></p>\n<blockquote>\n<p>USPS的财务问题，部分是由什么造成的？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,208.333,1140.0,48.333]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"36"}},{"section":"先读题干","raw":"## 37题题干\n\n**According to Paragraph 2, the USPS fails to modernize itself due to ______.**\n\n> 根据第2段，USPS未能实现现代化的原因是什么？\n\n题型：**具体细节题**。","contextRaw":"","html":"<h2>37题题干</h2>\n<p><strong>According to Paragraph 2, the USPS fails to modernize itself due to ______.</strong></p>\n<blockquote>\n<p>根据第2段，USPS未能实现现代化的原因是什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,615.0,1323.333,50.0]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"37"}},{"section":"先读题干","raw":"## 38题题干\n\n**The long-standing complaint by the USPS and its unions can be addressed by ______.**\n\n> USPS及其工会长期以来的抱怨，可以通过什么办法得到解决？\n\n题型：**具体细节题**。","contextRaw":"","html":"<h2>38题题干</h2>\n<p><strong>The long-standing complaint by the USPS and its unions can be addressed by ______.</strong></p>\n<blockquote>\n<p>USPS及其工会长期以来的抱怨，可以通过什么办法得到解决？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,1023.333,1335.0,115.0]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"38"}},{"section":"先读题干","raw":"## 39题题干\n\n**In the last paragraph, the author seems to view legislators with ______.**\n\n> 从最后一段来看，作者对立法者表现出的态度是怎样的？\n\n题型：**局部作者态度题**。","contextRaw":"","html":"<h2>39题题干</h2>\n<p><strong>In the last paragraph, the author seems to view legislators with ______.</strong></p>\n<blockquote>\n<p>从最后一段来看，作者对立法者表现出的态度是怎样的？</p>\n</blockquote>\n<p>题型：<strong>局部作者态度题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,1498.333,1243.333,48.333]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"39"}},{"section":"先读题干","raw":"## 40题题干\n\n**Which of the following would be the best title for the text?**\n\n> 下面哪个最适合作为文章的标题？\n\n题型：**全文作者观点／全文主旨题**。","contextRaw":"","html":"<h2>40题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下面哪个最适合作为文章的标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n","articleRects":[],"questionRects":[[246.667,1906.667,1041.667,48.333]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"40"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Meanwhile, This is why, latter, however |\n| 态度词 / 评价词 | 先抓个大概好坏 | unable, bare minimum, missing |\n| 动作词 | 先看谁做了什么 | adjust, protect, save, transform |\n| 结果词 | 看最后出了什么事 | net loss, failed, costs |\n| 重复主题词 | 大概知道老在说什么 | USPS, Postal Service, reform |","contextRaw":"","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tb 达成一致；修补这个系统；五年内；新车辆；大部分资金；后一种措施；财务负担；医疗；抱怨。","html":"<div class=\"coarseStack\"><div class=\"coarseDone\"><p>1、邮政局；赤字；净亏损；支出已经超过收入；员工医疗和退休费用；破产；技术变革；一类邮件。</p>\n</div><div class=\"coarseDone\"><p>2、利益群体；邮政工会；Congress；改革立法；已经失败；无力支付账单；现代化。</p>\n</div><div class=\"coarseDone\"><p>3、现在有消息；终于达成一致；修补这个系统；五年内；新车辆；大部分资金；后一种措施；财务负担；医疗；抱怨。</p>\n</div><div class=\"coarsePara currentFocus\"><p>4、通过参议院；最最基本的最低限度；没有任何改变；同样缺少；取消周六信件投递；广泛公众支持；特殊利益群体；立法者；改造邮政系统。</p>\n</div></div>","articleRects":[[220.0,1598.333,1335.0,631.667]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","coarse":true,"pid":3,"form":3}},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，做题时不至于完全不知道往哪里找。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头有邮政局、赤字、净亏损、技术变革；中间有利益群体、Congress、改革立法、无力支付账单、新车辆和财务负担；后面又出现最低限度、没有任何改变、周六信件投递和改造邮政系统。\n\n到这里还不能自然地说清楚：为什么会亏损，各方怎样影响改革，新车辆与财务负担有什么关系，最后的“最低限度”在评价哪件事。现在只留下已经看到的对象和位置，等具体题目问到再把关系接起来。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。","contextRaw":"","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，做题时不至于完全不知道往哪里找。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头有邮政局、赤字、净亏损、技术变革；中间有利益群体、Congress、改革立法、无力支付账单、新车辆和财务负担；后面又出现最低限度、没有任何改变、周六信件投递和改造邮政系统。</p>\n<p>到这里还不能自然地说清楚：为什么会亏损，各方怎样影响改革，新车辆与财务负担有什么关系，最后的“最低限度”在评价哪件事。现在只留下已经看到的对象和位置，等具体题目问到再把关系接起来。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做36至39题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","contextRaw":"","html":"<h1>3. 开始做36至39题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"36题","raw":"## 36题\n\n> The financial problem with the USPS is caused partly by ______.  \n> USPS的财务问题，部分是由什么造成的？\n\n题干给出USPS，并把问题限定在financial problem的部分原因。先回到第1段USPS的财务叙述，完整读这一段，再分清开头写的财务表现和后面解释的原因。\n\n> 原文参考：\n>\n> The U.S. Postal Service (USPS) continues to **[xxx]** red ink. It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue. Meanwhile, it has more than $120 billion in unfunded **[xxx]**, mostly for employee health and retirement costs. There are many reasons this formerly stable federal institution finds itself on the **[xxx]** of bankruptcy. Fundamentally, the USPS is in a historic **[xxx]** between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a **[xxx]** structure that denies management the flexibility to adjust its operations to the new reality.\n>\n> 开始精读：\n>\n> The U.S. Postal Service (USPS) continues to **[xxx]** red ink. / It reported a net loss of $5.6 billion for fiscal 2016, / the 10th straight year its expenses have exceeded revenue. / Meanwhile, it has more than $120 billion in unfunded **[xxx]**, / mostly for employee health and retirement costs. / There are many reasons / this formerly stable federal institution / finds itself on the **[xxx]** of bankruptcy. / Fundamentally, the USPS is in a historic **[xxx]** / between technological change / that has permanently decreased demand / for its bread-and-butter product, first-class mail, / and a **[xxx]** structure / that denies management the flexibility / to adjust its operations to the new reality.\n>\n> 顺着英文顺序读：\n>\n> 美国邮政局（USPS）继续 **[xxx]** 赤字。 / 它报告2016财年净亏损五十六亿美元， / 这是连续第十年支出超过收入。 / 同时，它还有超过一千二百亿美元没有资金保障的 **[xxx]**， / 主要涉及员工医疗和退休费用。 / 存在许多原因 / 使这个原本稳定的联邦机构 / 发现自己处于破产的 **[xxx]**。 / 从根本上说，美国邮政局处在历史性的 **[xxx]** 中 / 一边是技术变革 / 它已经永久性地减少需求 / 对其主要产品一类邮件的需求， / 另一边是一种 **[xxx]** 结构 / 它不让管理层拥有灵活性 / 来调整经营以适应新的现实。","contextRaw":"","html":"<h2>36题</h2>\n<blockquote>\n<p>The financial problem with the USPS is caused partly by ______.<br />\nUSPS的财务问题，部分是由什么造成的？</p>\n</blockquote>\n<p>题干给出USPS，并把问题限定在financial problem的部分原因。先回到第1段USPS的财务叙述，完整读这一段，再分清开头写的财务表现和后面解释的原因。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The U.S. Postal Service (USPS) continues to <span class=\"mask\">[xxx]</span> red ink. It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue. Meanwhile, it has more than $120 billion in unfunded <span class=\"mask\">[xxx]</span>, mostly for employee health and retirement costs. There are many reasons this formerly stable federal institution finds itself on the <span class=\"mask\">[xxx]</span> of bankruptcy. Fundamentally, the USPS is in a historic <span class=\"mask\">[xxx]</span> between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a <span class=\"mask\">[xxx]</span> structure that denies management the flexibility to adjust its operations to the new reality.</p>\n<p>开始精读：</p>\n<p>The U.S. Postal Service (USPS) continues to <span class=\"mask\">[xxx]</span> red ink. / It reported a net loss of $5.6 billion for fiscal 2016, / the 10th straight year its expenses have exceeded revenue. / Meanwhile, it ly另讲技术变化与管理灵活性，提示原因不能只按“也涉及钱”来选；但budget前面的词还没有读清，也不能先替A说成某种已经能判错的安排。当前B有直接原因，A则还留着预算特点这一处疑问，先分别保留。\n\n当前还不能确定A的预算特点与后面的原因句是否接上。\n\n**还没读清预算是什么特点，能立刻断定A只是在重复亏损结果、绝不可能涉及原因吗？**\n\n还不能。budget与收支有关，但它在A里具体说的是什么预算问题，还差前面的意思。\n\n这里先不把“沾到收支”当作确定答案，也不因为B更直接就将A抹掉。把预算这一处留着，等全文读清后再比较题目真正问的原因。\n\n**第一轮判断：A保留。**","contextRaw":"","html":"<h3>A. its <span class=\"mask\">[xxx]</span> budget</h3>\n<blockquote>\n<p>它的 <span class=\"mask\">[xxx]</span> 预算</p>\n</blockquote>\n<p>把A接回题干，它说的是：USPS的财务问题，部分来自它的 <span class=\"mask\">[xxx]</span> 预算。</p>\n<p>A的budget涉及收支安排，第1段its expenses have exceeded revenue也谈支出和收入，因此先回看开头的财务描述，再看Fundamentally之后的原因说明，别先替budget前面的词定意思。</p>\n<blockquote>\n<p>It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.</p>\n</blockquote>\n<blockquote>\n<p>Fundamentally, the USPS is in a historic <span class=\"mask\">[xxx]</span> between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a <span class=\"mask\">[xxx]</span> structure that denies management the flexibility to adjust its operations to the new reality.</p>\n</blockquote>\n<p>its expenses have exceeded revenue说明支出长期超过收入，所以budget与这一段的财务内容确实有关。A没有写清我们认识的具体预算特点，暂时不能确定它是在重复收支结果，还是在说某种导致结果的预算安排。后面的Fundamentally另讲技术变化与管理灵活性，提示原因不能只按“也涉及钱”来选；但budget前面的词还没有读清，也不能先替A说成某种已经能判错的安排。当前B有直接原因，A则还留着预算特点这一处疑问，先分别保留。</p>\n<p>当前还不能确定A的预算特点与后面的原因句是否接上。</p>\n<p><strong>还没读清预算是什么特点，能立刻断定A只是在重复亏损结果、绝不可能涉及原因吗？</strong></p>\n<p>还不能。budget与收支有关，但它在A里具体说的是什么预算问题，还差前面的意思。</p>\n<p>这里先不把“沾到收支”当作确定答案，也不因为B更直接就将A抹掉。把预算这一处留着，等全文读清后再比较题目真正问的原因。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[221.667,326.667,1335.0,473.333]],"questionRects":[[248.333,208.333,1140.0,48.333],[308.333,276.667,413.333,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的budget涉及收支安排，第1段its expenses have exceeded revenue也谈支出和收入，因此先回看开头的财务描述，再看Fundamentally之后的原因说明，别先替budget前面的词定意思。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"its expenses have exceeded revenue","visibleOptionAnchor":"budget"}}}},{"section":"36题","raw":"### B. its rigid management\n\n> 它僵化的管理\n\n把B接回题干，它说的是：USPS的财务问题，部分来自管理缺少灵活性。\n\nB的rigid management说管理僵硬、不灵活，原文denies management the flexibility也直接出现management和flexibility，因此回看这种缺少灵活性妨碍了什么。\n\n> Fundamentally, the USPS is in a historic **[xxx]** between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a **[xxx]** structure that denies management the flexibility to adjust its operations to the new reality.\n\ndenies management the flexibility后面接to adjust its operations to the new reality，说管理层缺乏调整经营以适应新现实的余地。B的rigid management把这种缺少灵活性的状况简写成僵化管理，并没有额外说管理人员智力低或道德差。原句用between…and摆出两个方面：技术改变需求，制度结构又让运营难以调整。题干有partly，所以B只回答管理这一方面即可，不必同时把技术因素塞进去。它接的是Fundamentally之后的原因，而不只是开头亏损数字。\n\n因此，两者在管理缺少灵活性这一点上能够接上。\n\n**管理层没有灵活调整经营的余地，是否能够解释这里的rigid management？**\n\n能够。rigid说的正是不能随新现实灵活改变的管理状况。\n\nB保留了管理与运营调整之间的关系，也符合题干只问部分原因的范围。不能把“结构限制管理”误读成与管理僵化毫无关系。\n\n**第一轮判断：B保留。**","contextRaw":"","html":"<h3>B. its rigid management</h3>\n<blockquote>\n<p>它僵化的管理</p>\n</blockquote>\n<p>把B接回题干，它说的是：USPS的财务问题，部分来自管理缺少灵活性。</p>\n<p>B的rigid management说管理僵硬、不灵活，原文denies management the flexibility也直接出现management和flexibility，因此回看这种缺少灵活性妨碍了什么。</p>\n<blockquote>\n<p>Fundamentally, the USPS is in a historic <span class=\"mask\">[xxx]</span> between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a <span class=\"mask\">[xxx]</span> structure that denies management the flexibility to adjust its operations to the new reality.</p>\n</blockquote>\n<p>denies management the flexibility后面接to adjust its operations to the new reality，说管理层缺乏调整经营以适应新现实的余地。B的rigid management把这种缺少灵活性的状况简写成僵化管理，并没有额外说管理人员智力低或道德差。原句用between…and摆出两个方面：技术改变需求，制度结构又让运营难以调整。题干有partly，所以B只回答管理这一方面即可，不必同时把技术因素塞进去。它接的是Fundamentally之后的原因，而不只是开头亏损数字。</p>\n<p>因此，两者在管理缺少灵活性这一点上能够接上。</p>\n<p><strong>管理层没有灵活调整经营的余地，是否能够解释这里的rigid management？</strong></p>\n<p>能够。rigid说的正是不能随新现实灵活改变的管理状况。</p>\n<p>B保留了管理与运营调整之间的关系，也符合题干只问部分原因的范围。不能把“结构限制管理”误读成与管理僵化毫无关系。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[221.667,326.667,1335.0,473.333]],"questionRects":[[248.333,208.333,1140.0,48.333],[308.333,343.333,401.667,50.0]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的rigid management说管理僵硬、不灵活，原文denies management the flexibility也直接出现management和flexibility，因此回看这种缺少灵活性妨碍了什么。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"denies management the flexibility","visibleOptionAnchor":"rigid management"}}}},{"section":"36题","raw":"### C. the cost for technical upgrading\n\n> 技术升级的费用\n\n把C接回题干，它说的是：USPS的财务问题，部分是因为技术升级花费太高。\n\nC的cost for technical upgrading与第1段technological change都提到技术，但原文紧接permanently decreased demand说需求变化，因此回看技术在原因链里改变的是支出还是需求。\n\n> Fundamentally, the USPS is in a historic **[xxx]** between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a **[xxx]** structure that denies management the flexibility to adjust its operations to the new reality.\n\npermanently decreased demand的宾语是demand，技术变革让一类邮件的需求减少，描述的是外部市场变了。C的cost for technical upgrading则把技术影响改成邮政局自己购买、升级技术的费用，描述的是内部多花了钱。即使两种情况都可能与财务困难有关，它们也不是同一条因果：原文写“业务需求少了”，C写“升级支出多了”。这里的technical与technological相近，只能帮助找到讨论技术的句子，不能让后面的demand和cost自动变成同义词。\n\n**技术使邮件需求减少，能够改写成USPS花了太多钱升级技术吗？**\n\n不能。前者是需求下降，后者是升级支出增加。\n\nC把技术作用的方向和对象同时换掉了。原因题必须保留这条因果，不能找到“技术”这个主题词就停。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. the cost for technical upgrading</h3>\n<blockquote>\n<p>技术升级的费用</p>\n</blockquote>\n<p>把C接回题干，它说的是：USPS的财务问题，部分是因为技术升级花费太高。</p>\n<p>C的cost for technical upgrading与第1段technological change都提到技术，但原文紧接permanently decreased demand说需求变化，因此回看技术在原因链里改变的是支出还是需求。</p>\n<blockquote>\n<p>Fundamentally, the USPS is in a historic <span class=\"mask\">[xxx]</span> between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a <span class=\"mask\">[xxx]</span> structure that denies management the flexibility to adjust its operations to the new reality.</p>\n</blockquote>\n<p>permanently decreased demand的宾语是demand，技术变革让一类邮件的需求减少，描述的是外部市场变了。C的cost for technical upgrading则把技术影响改成邮政局自己购买、升级技术的费用，描述的是内部多花了钱。即使两种情况都可能与财务困难有关，它们也不是同一条因果：原文写“业务需求少了”，C写“升级支出多了”。这里的technical与technological相近，只能帮助找到讨论技术的句子，不能让后面的demand和cost自动变成同义词。</p>\n<p><strong>技术使邮件需求减少，能够改写成USPS花了太多钱升级技术吗？</strong></p>\n<p>不能。前者是需求下降，后者是升级支出增加。</p>\n<p>C把技术作用的方向和对象同时换掉了。原因题必须保留这条因果，不能找到“技术”这个主题词就停。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","art 更不能把“资金不足”自动变成“银行怎样了”。\n\n**看到资金没有保障，就能把银行支持的某种变化当作文中给出的原因吗？**\n\n不能。缺钱的状态本身并没有确定资金原本来自银行，也没有建立银行支持变化导致困难的关系。\n\nD不是对原句财务词的简写，而是另添一个参与者和一条因果。题目问文章说明的部分原因，不能用这条新关系代替已经写出的原因。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. the <span class=\"mask\">[xxx]</span> of bank support</h3>\n<blockquote>\n<p>银行支持的 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把D接回题干，它说的是：USPS的财务问题，部分来自银行支持发生了 <span class=\"mask\">[xxx]</span>。</p>\n<p>D的bank support说资金支持来自银行，第1段unfunded涉及资金未获保障，因此回看这一财务描述具体指向什么费用，以及原因句有没有把资金关系落在银行身上。</p>\n<blockquote>\n<p>Meanwhile, it has more than $120 billion in unfunded <span class=\"mask\">[xxx]</span>, mostly for employee health and retirement costs.</p>\n</blockquote>\n<blockquote>\n<p>Fundamentally, the USPS is in a historic <span class=\"mask\">[xxx]</span> between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a <span class=\"mask\">[xxx]</span> structure that denies management the flexibility to adjust its operations to the new reality.</p>\n</blockquote>\n<p>unfunded后面那个名词没有读清，但后面的mostly for把费用指向员工医疗与退休。D的bank support却增加了银行这一资金提供者，还把银行支持发生的变化用来解释财务困难。围绕银行支持怎样变化，这一段找不到一句能直接说到这件事。资金没有着落不等于已知是某家银行的支持出了变化；原文的明确原因继续落到需求和经营灵活性，不是银行—邮政局之间的融资关系。D开头不认识的动作不能替bank support补出来源证据，更不能把“资金不足”自动变成“银行怎样了”。</p>\n<p><strong>看到资金没有保障，就能把银行支持的某种变化当作文中给出的原因吗？</strong></p>\n<p>不能。缺钱的状态本身并没有确定资金原本来自银行，也没有建立银行支持变化导致困难的关系。</p>\n<p>D不是对原句财务词的简写，而是另添一个参与者和一条因果。题目问文章说明的部分原因，不能用这条新关系代替已经写出的原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[221.667,326.667,1335.0,473.333]],"questionRects":[[248.333,208.333,1140.0,48.333],[308.333,480.0,568.333,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"36","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"so urceAnchor":"This is why","visibleOptionAnchor":"shrinking demand"}}}},{"section":"37题","raw":"### D. the incompetence of postal unions\n\n> 邮政工会的无能\n\n把D接回题干，它说的是：USPS无法现代化，是因为邮政工会缺乏能力。\n\nD的incompetence评价工会有没有能力，原文self-interested pressure说的是利益群体为了谁而提出要求；工会属于这些群体，因此回看作者是在批评本领不足还是维护自身利益。\n\n> And interest groups ranging from postal unions to greeting-card makers **[xxx]** self-interested pressure on the USPS’s ultimate **[xxx]**—Congress—insisting that whatever else happens to the Postal Service, aspects of the status quo they depend on get protected.\n\nself-interested pressure中的self-interested指向自身利益，后面的insisting进一步写出它们坚持旧安排受到保护。D的incompetence却改成工会无能，没有能力推动事情。这两种批评方向不同：为了自己的好处有力地维护现状，并不是因为不知道如何做事或没有组织能力。原文还从postal unions写到greeting-card makers，涉及一系列群体；D既把原因收缩到工会，又把利益动机改为能力不足。不能把作者不赞成某个群体的行为，都翻成那个群体“无能”。\n\n**工会坚持保护自身依赖的现状，就说明它没有能力做事吗？**\n\n不是。自利的要求与能力不足不是同一种判断。\n\nD改变了作者解释行为的原因，还丢掉同列其他利益群体，不能承接这段改革受阻的叙述。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. the incompetence of postal unions</h3>\n<blockquote>\n<p>邮政工会的无能</p>\n</blockquote>\n<p>把D接回题干，它说的是：USPS无法现代化，是因为邮政工会缺乏能力。</p>\n<p>D的incompetence评价工会有没有能力，原文self-interested pressure说的是利益群体为了谁而提出要求；工会属于这些群体，因此回看作者是在批评本领不足还是维护自身利益。</p>\n<blockquote>\n<p>And interest groups ranging from postal unions to greeting-card makers <span class=\"mask\">[xxx]</span> self-interested pressure on the USPS’s ultimate <span class=\"mask\">[xxx]</span>—Congress—insisting that whatever else happens to the Postal Service, aspects of the status quo they depend on get protected.</p>\n</blockquote>\n<p>self-interested pressure中的self-interested指向自身利益，后面的insisting进一步写出它们坚持旧安排受到保护。D的incompetence却改成工会无能，没有能力推动事情。这两种批评方向不同：为了自己的好处有力地维护现状，并不是因为不知道如何做事或没有组织能力。原文还从postal unions写到greeting-card makers，涉及一系列群体；D既把原因收缩到工会，又把利益动机改为能力不足。不能把作者不赞成某个群体的行为，都翻成那个群体“无能”。</p>\n<p><strong>工会坚持保护自身依赖的现状，就说明它没有能力做事吗？</strong></p>\n<p>不是。自利的要求与能力不足不是同一种判断。</p>\n<p>D改变了作者解释行为的原因，还丢掉同列其他利益群体，不能承接这段改革受阻的叙述。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[  unions and the system’s heaviest users—has finally agreed on a plan to fix the system. Legislation is moving through the House that would save USPS an **[xxx]** $28.6 billion over five years, which could help pay for new vehicles, among other survival measures. Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare. The latter step would largely **[xxx]** the financial burden of annually **[xxx]** retiree health care, thus addressing a long-standing complaint by the USPS and its unions.\n>\n> 开始精读：\n>\n> Now comes word / that everyone involved—Democrats, Republicans, the Postal Service, / the unions and the system’s heaviest users— / has finally agreed on a plan / to fix the system. / Legislation is moving through the House / that would save USPS an **[xxx]** $28.6 billion over five years, / which could help pay for new vehicles, / among other survival measures. / Most of the money would come / from a penny-per-letter permanent rate increase / and from shifting postal retirees into Medicare. / The latter step would largely **[xxx]** / the financial burden of annually **[xxx]** retiree health care, / thus addressing a long-standing complaint / by the USPS and its unions.\n>\n> 顺着英文顺序读：\n>\n> 现在有消息传来 / 所有相关方面——民主党、共和党、邮政局、 / 工会以及这个系统最大的用户—— / 终于就一个方案达成一致 / 来修补这个系统。 / 有立法正在众议院推进 / 它将在五年内为邮政局节省 **[xxx]** 的二百八十六亿美元， / 这可以帮助支付购买新车辆的费用， / 以及其他维持生存的措施。 / 大部分资金将来自 / 每封信永久提高一美分的邮费 / 以及将邮政退休人员转入Medicare。 / 后一种措施将在很大程度上 **[xxx]** / 每年 **[xxx]** 退休人员医疗的财务负担， / 从而回应一项长期存在的抱怨 / 来自邮政局及其工会的。","contextRaw":"","html":"<h2>38题</h2>\n<blockquote>\n<p>The long-standing complaint by the USPS and its unions can be addressed by ______.<br />\nUSPS及其工会长期以来的抱怨，可以通过什么办法得到解决？</p>\n</blockquote>\n<p>题干的long-standing complaint在第3段末尾直接出现，抱怨者也是USPS and its unions。要读懂The latter step指哪一步，先把整段两项资金安排都读完，不能只盯最后一句。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Now comes word that everyone involved—Democrats, Republicans, the Postal Service, the 过采用新的邮费涨价机制来处理。</p>\n<p>C的rate-increase mechanism与前句rate increase词面相近，但后句The latter step特意选了后一项措施，因此回看前一句，把两个from依次读出来，确认涨邮费排在前还是后。</p>\n<blockquote>\n<p>Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare.</p>\n</blockquote>\n<blockquote>\n<p>The latter step would largely <span class=\"mask\">[xxx]</span> the financial burden of annually <span class=\"mask\">[xxx]</span> retiree health care, thus addressing a long-standing complaint by the USPS and its unions.</p>\n</blockquote>\n<p>The latter step指“后一个措施”。前句先写from a penny-per-letter permanent rate increase，后写and from shifting postal retirees into Medicare，所以latter回指转入Medicare，不是邮费上涨。C的rate-increase mechanism把前一项省钱来源选成了后一项处理医疗负担的办法。两者都可能改善总账，仍不能因此取消原句特意作出的先后区分。题目不问哪项措施让钱更多，而问长期抱怨具体由哪一步处理，答案必须跟着latter往回接。</p>\n<p>这是前后两项之间的指代对象错位。</p>\n<p><strong>前句第二项是转入Medicare，能把The latter step读成第一项涨邮费吗？</strong></p>\n<p>不能。latter在两项之间明确指后者。</p>\n<p>C保留了同段原词，却换错指代对象；这种错位不是“都能省钱”就可以弥补的。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[221.667,1121.667,1333.333,465.0]],"questionRects":[[248.333,1023.333,1335.0,115.0],[308.333,1295.0,716.667,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"38","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的rate-increase mechanism与前句rate increase词面相近，但后句The latter step特意选了后一项措施，因此回看前一句，把两个from依次读出来，确认涨邮费排在前还是后。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["visible_link","object","relati ects":[[248.333,1023.333,1335.0,115.0]],"scrollTarget":"auto","meta":{"kind":"result","qid":"38"}},{"section":"39题","raw":"## 39题\n\n> In the last paragraph, the author seems to view legislators with ______.  \n> 从最后一段来看，作者对立法者表现出的态度是怎样的？\n\n题干问the last paragraph里作者怎样看legislators。直接读第4段，不把第3段“终于达成一致”先当成作者最后态度。尤其读清末尾It is not, however后面否定的内容。\n\n> 原文参考：\n>\n> If it clears the House, this measure would still have to get through the Senate—where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service **[xxx]**, not **[xxx]** reform. There’s no change to collective **[xxx]** at the USPS, a major **[xxx]** considering that **[xxx]** accounts for 80 percent of the agency’s costs. Also missing is any discussion of eliminating Saturday letter delivery. That common-sense change enjoys wide public support and would save the USPS $2 billion per year. But postal special-interest groups seem to have killed it, at least in the House. The emerging **[xxx]** around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term **[xxx]** at the USPS. It is not, however, a sign that they’re getting serious about transforming the postal system for the 21st century.\n>\n> 开始精读：\n>\n> If it clears the House, / this measure would still have to get through the Senate— / where someone is bound to point out / that it amounts to the bare, bare minimum / necessary to keep the Postal Service **[xxx]**, / not **[xxx]** reform. / There’s no change to collective **[xxx]** at the USPS, / a major **[xxx]** / considering that **[xxx]** accounts for 80 percent of the agency’s costs. / Also missing is any discussion / of eliminating Saturday letter delivery. / That common-sense change enjoys wide public support / and would save the USPS $2 billion per year. / But postal special-interest groups seem to have killed it, / at least in the House. / The emerging **[xxx]** around the bill / is a sign that legislators are getting frightened / about a politically embarrassing short-term **[xxx]** at the USPS. / It is not, however, a sign / that they’re getting serious / about transforming the postal system for the 21st century.\n>\n> 顺着英文顺序读：\n>\n> 如果它通过众议院， / 这一措施仍然必须通过参议院—— / 在那里必定有人指出 / 它只相当于最最基本的最低限度 / 为了让邮政局保持 **[xxx]** 所必需的， / 而不是 **[xxx]** 改革。 / 邮政局的集体 **[xxx]** 没有任何改变， / 这是一个重大的 **[xxx]** / 考虑到 **[xxx]** 占该机构成本的百分之八十。 / 同样缺少的是任何讨论 / 关于取消周六信件投递。 / 这一合乎常识的改变得到广泛公众支持 / 而且每年将为邮政局节省二十亿美元。 / 但邮政特殊利益群体似乎已经否决了它， / 至少在众议院是这样。 / 围绕这项法案新出现的 **[xxx]** / 表明立法者正变得害怕 / 对于邮政局短期内在政治上令人尴尬的 **[xxx]**。 / 然而，这并不表明 / 他们正认真对待 / 为21世纪改造邮政系统这件事。","contextRaw":"","html":"<h2>39题</h2>\n<blockquote>\n<p>In the last paragraph, the author seems to view legislators with ______.<br />\n从最后一段来看，作者对立法者表现出的态度是怎样的？</p>\n</blockquote>\n<p>题干问the last paragraph里作者怎样看legislators。直接读第4段，不把第3段“终于达成一致”先当成作者最后态度。尤其读清末尾It is not, however后面否定的内容。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>If it clears the House, this measure would still have to get through the Senate—where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service <span class=\"mask\">[xxx]</span>, not <span class=\"mask\">[xxx]</span> reform. There’s no change to collective <span class=\"mask\">[xxx]</span> at the USPS, a major <span class=\"mask\">[xxx]</span> considering that <span class=\"mask\">[xxx]</span> accounts for 80 percent of the agency’s costs. Also missing is any discussion of eliminating Saturday letter delivery. That common-sense change enjoys wide public support and would save the USPS $2 billion per year. But postal special-interest groups seem to have killed it, at least in the House. The emerging <span class=\"mask\">[xxx]</span> around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term <span class=\"mask\">[xxx]</span> at the USPS. It is not, however, a sign that they’re getting serious about transforming the postal system for the 21st century.</p>\n<p>开始精读：</p>\n<p>If it clears the House, / this measure would still have to get through the Senate— / where someone is bound to point out / that it amounts to the bare, bare minimum / necessary to keep the Postal Service <span class=\"mask\">[xxx]</span>, / not <span class=\"mask\">[xxx]</span> reform. / There’s no change to collective <span class=\"mask\">[xxx]</span> at the USPS, / a major <span class=\"mask\">[xxx]</span> / considering that <span class=\"mask\">[xxx]</span> accounts for 80 percent of the agency’s costs. / Also missing is any discussion / of eliminating Saturday letter delivery. / That common-sense change enjoys wide public support / and would save the USPS $2 billion per year. / But postal special-interest groups seem to have killed it, / at least in the House. / The emerging <span class=\"mask\">[xxx]</span> around the bill / is a sign that legislators are getting frightened / about a politically embarrassing short-term <span class=\"mask\">[xxx]</span> at the USPS. / It is not, however, a sign / that they’re getting serious / about transforming the postal system for the 21st century.</p>\n<p>顺着英文顺序读：</p>\n<p>如果它通过众议院， / 这一措施仍然必须通过参议院—— / 在那里必定有人指出 / 它只相当于最最基本的最低限度 / 为了让邮政局保持 <span class=\"mask\">[xxx]</span> 所必需的， / 而不是 <span class=\"mask\">[xxx]</span> 改革。 / 邮政局的集体 <span class=\"mask\">[xxx]</span> 没有任何改变， / 这是一个重大的 <span class=\"mask\">[xxx]</span> / 考虑到 <span class=\"mask\">[xxx]</span> 占该机构成本的百分之八十。 / 同样缺少的是任何讨论 / 关于取消周六信件投递。 / 这一合乎常识的改变得到广泛公众支持 / 而且每年将为邮政局节省二十亿美元。 / 但邮政特殊利益群体似乎已经否决了它， / 至少在众议院是这样。 / 围绕这项法案新出现的 <span class=\"mask\">[xxx]</span> / 表明立法者正变得害怕 / 对于邮政局短期内在政治上令人尴尬的 <span class=\"mask\">[xxx]</span>。 / 然而，这并不表明 / 他们正认真对待 / 为21世纪改造邮政系统这件事。</p>\n</blockquote>\n","articleRects":[[220.0,1598.333,1335.0,631.667]],"questionRects":[[248.333,1498.333,1243.333,48.333]],"scrollTarget":"auto","meta":{"kind":"question","qid":"39"}},{"section":"39题","raw":"### A. respect\n\n> 尊重；敬重\n\n把A接回题干，它说的是：在最后一段，作者以敬重的态度看待立法者。\n\nA的respect说作者敬重立法者，第4段getting serious涉及他们是否认真对待改革，因此回看这句话前面有没有否定，以及前面列出的未做事项。\n\n> There’s no change to collective **[xxx]** at the USPS, a major **[xxx]** considering that **[xxx]** accounts for 80 percent of the agency’s costs.\n\n> It is not, however, a sign that they’re getting serious about transforming the postal system for the 21st century.\n\ngetting serious前面受It is not…a sign管着，作者不是表扬他们终于认真改造邮政体系，而是否认法案共识足以证明这种认真。A的respect要求正面的敬重，但本段反复写no change、Also missing，再说只是害怕短期出现政治难堪的情况。这里不能因为legislators取得一致就把评价自动转成尊敬；作者恰恰把达成一致与真正改革区分开，认为前一件事远远不够。\n\nA的态度方向与not给出的否定相反。\n\n**作者否认这表明立法者认真改革，又接连指出没有做的事，能据此读出敬重吗？**\n\n不能。这些句子是在追究他们做得不够，而不是肯定其认真负责。\n\nA把作者明确的否定方向翻成正面敬重，忽略了末句not与整段列举缺项的共同作用。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. respect</h3>\n<blockquote>\n<p>尊重；敬重</p>\n</blockquote>\n<p>把A接回题干，它说的是：在最后一段，作者以敬重的态度看待立法者。</p>\n<p>A的respect说作者敬重立法者，第4段getting serious涉及他们是否认真对待改革，因此回看这句话前面有没有否定，以及前面列出的未做事项。</p>\n<blockquote>\n<p>There’s no change to collective <span class=\"mask\">[xxx]</span> at the USPS, a major <span class=\"mask\">[xxx]</span> considering that <span class=\"mask\">[xxx]</span> accounts for 80 percent of the agency’s costs.</p>\n</blockquote>\n<blockquote>\n<p>It is not, however, a sign that they’re getting serious about transforming the postal system for the 21st century.</p>\n</blockquote>\n<p>getting serious前面受It is not…a sign管着，作者不是表扬他们终于认真改造邮政体系，而是否认法案共识足以证明这种认真。A的respect要求正面的敬重，但本段反复写no change、Also missing，再说只是害怕短期出现政治难堪的情况。这里不能因为legislators取得一致就把评价自动转成尊敬；作者恰恰把达成一致与真正改革区分开，认为前一件事远远不够。</p>\n<p>A的态度方向与not给出的否定相反。</p>\n<p><strong>作者否认这表明立法者认真改革，又接连指出没有做的事，能据此读出敬重吗？</strong></p>\n<p>不能。这些句子是在追究他们做得不够，而不是肯定其认真负责。</p>\n<p>A把作者明确的否定方向翻成正面敬重，忽略了末句not与整段列举缺项的共同作用。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[220.0,1598.333,1335.0,631.667]],"questionRects":[[248.333,1498.333,1243.333,48.333],[308.333,1571.667,175.0,43.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的respect说作者敬重立法者，第4段getting serious涉及他们是否认真对待改革，因此回看这句话前面有没有否定，以及前面列出的未做事项。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","negation"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"getting serious","visibleOptionAnchor":"respect"}}}},{"section":"39题","raw":"### B. tolerance\n\n> 宽容；容忍\n\n把B接回题干，它说的是：在最后一段，作者认为立法者虽有不足，但可以宽容接受。\n\nB的tolerance意味着作者对不足表示容忍，原文bare, bare minimum也承认法案能做到最低限度，因此回看这种有限作用后面接的是体谅，还是继续追问缺少什么。\n\n> If it clears the House, this measure would still have to get through the Senate—where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service **[xxx]**, not **[xxx]** reform.\n\n> It is not, however, a sign that they’re getting serious about transforming the postal system for the 21st century.\n\nbare, bare minimum里bare重复一次，把法案的作用压在最低限度，不是替立法者说“能做到这些已经值得谅解”。B的tolerance需要作者接受这种不足，但原文随后追列未改变的安排、未讨论的周六投递，最后还否认他们已经认真改革。承认一项措施至少有一点作用，不等于愿意原谅它停留在这里。作者的落点不是“现实困难多，所以这样也行”，而是“这并不表明真正改造已经开始”。\n\n**承认法案只能做到最低限度，就等于作者愿意容忍立法者停在最低限度吗？**\n\n不等于。作者承认作用有限之后，仍继续批评缺项和缺少认真改革的表现。\n\nB把一处有限事实让步读成了整体态度上的宽容，漏掉整段向不足之处推进的方向。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. tolerance</h3>\n<blockquote>\n<p>宽容；容忍</p>\n</blockquote>\n<p>把B接回题干，它说的是：在最后一段，作者认为立法者虽有不足，但可以宽容接受。</p>\n<p>B的tolerance意味着作者对不足表示容忍，原文bare, bare minimum也承认法案能做到最低限度，因此回看这种有限作用后面接的是体谅，还是继续追问缺少什么。</p>\n<blockquote>\n<p>If it clears the House, this measure would still have to get through the Senate—where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service <span class=\"mask\">[xxx]</span>, not <span class=\"mask\">[xxx]</span> reform.</p>\n</blockquote>\n<blockquote>\n<p>It is not, however, a sign that they’re getting serious about transforming the postal system for the 21st century.</p>\n</blockquote>\n<p>bare, bare minimum里bare重复一次，把法案的作用压在最低限度，不是替立法者说“能做到这些已经值得谅解”。B的tolerance需要作者接受这种不足，但原文随后追列未改变的安排、未讨论的周六投递，最后还否认他们已经认真改革。承认一项措施至少有一点作用，不等于愿意原谅它停留在这里。作者的落点不是“现实困难多，所以这样也行”，而是“这并不表明真正改造已经开始”。</p>\n<p><strong>承认法案只能做到最低限度，就等于作者愿意容忍立法者停在最低限度吗？</strong></p>\n<p>不等于。作者承认作用有限之后，仍继续批评缺项和缺少认真改革的表现。</p>\n<p>B把一处有限事实让步读成了整体态度上的宽容，漏掉整段向不足之处推进的方向。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[220.0,1598.333,1335.0,631.667]],"questionRects":[[248.333,1498.333,1243.333,48.333],[308.333,1635.0,205.0,40.0]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的tolerance意味着作者对不足表示容忍，原文bare, bare minimum也承认法案能做到最低限度，因此回看这种有限作用后面接的是体谅，还是继续追问缺少什么。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"bare, bare minimum","visibleOptionAnchor":"tolerance"}}}},{"section":"39题","raw":"### C. discontent\n\n> 不满\n\n把C接回题干，它说的是：在最后一段，作者对立法者表现出不满。\n\nC的discontent说作者不满意，末句It is not, however, a sign直接否认立法者已经认真改革的说法，因此回看这个否定，再把它与前面的no change、Also missing一起读。\n\n> Also missing is any discussion of eliminating Saturday letter delivery.\n\n> The emerging **[xxx]** around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term **[xxx]** at the USPS. It is not, however, a sign that they’re getting serious about transforming the postal system for the 21st century.\n\nIt is not, however, a sign把“害怕短期政治尴尬”与“认真为21世纪改造系统”分开，作者认为前者不能证明后者。C的discontent正好承接这种对动机和行动不足的不满意。前面列未改事项与未讨论事项，不是在中性统计数量，而是在解释为什么法案只够最低限度。即使局部名词没读清，no change、missing和not serious这一连串否定仍给出清楚态度。C只说不满，没有进一步夸成仇恨所有立法者。\n\n**作者指出遗漏，又认为立法者只是怕眼前难堪、没有表现出真正改革的认真，这体现不满吗？**\n\n能看出这种不满。评价针对的是他们做得不足、着眼点过短。\n\nC既与末句的否定一致，也与前面的缺项说明相合，程度上没有强行扩大成轻蔑或全盘敌视，因此保留。\n\n**第一轮判断：C保留。**","contextRaw":"","html":"<h3>C. discontent</h3>\n<blockquote>\n<p>不满</p>\n</blockquote>\n<p>把C接回题干，它说的是：在最后一段，作者对立法者表现出不满。</p>\n<p>C的discontent说作者不满意，末句It is not, however, a sign直接否认立法者已经认真改革的说法，因此回看这个否定，再把它与前面的no change、Also missing一起读。</p>\n<blockquote>\n<p>Also missing is any discussion of eliminating Saturday letter delivery.</p>\n</blockquote>\n<blockquote>\n<p>The emerging <span class=\"mask\">[xxx]</span> around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term <span class=\"mask\">[xxx]</span> at the USPS. It is not, however, a sign that they’re getting serious about transforming the postal system for the 21st century.</p>\n</blockquote>\n<p>It is not, however, a sign把“害怕短期政治尴尬”与“认真为21世纪改造系统”分开，作者认为前者不能证明后者。C的discontent正好承接这种对动机和行动不足的不满意。前面列未改事项与未讨论事项，不是在中性统计数量，而是在解释为什么法案只够最低限度。即使局部名词没读清，no change、missing和not serious这一连串否定仍给出清楚态度。C只说不满，没有进一步夸成仇恨所有立法者。</p>\n<p><strong>作者指出遗漏，又认为立法者只是怕眼前难堪、没有表现出真正改革的认真，这体现不满吗？</strong></p>\n<p>能看出这种不满。评价针对的是他们做得不足、着眼点过短。</p>\n<p>C既与末句的否定一致，也与前面的缺项说明相合，程度上没有强行扩大成轻蔑或全盘敌视，因此保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[220.0,1598.333,1335.0,631.667]],"questionRects":[[248.333,1498.333,1243.333,48.333],[308.333,1703.333,223.333,40.0]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的discontent说作者不满意，末句It is not, however, a sign直接否认立法者已经认真改革的说法，因此回看这个否定，再把它与前面的no change、Also missing一起读。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"It is not, however, a sign","visibleOptionAnchor":"discontent"}}}},{"section":"39题","raw":"### D. gratitude\n\n> 感激\n\n把D接回题干，它说的是：在最后一段，作者对立法者表示感谢。\n\nD的gratitude需要作者把法案看成值得感谢的帮助，原文getting frightened则解释立法者为什么达成一致，因此回看作者把他们的举动归结为什么动机，并怎样评价结果。\n\n> The emerging **[xxx]** around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term **[xxx]** at the USPS. It is not, however, a sign that they’re getting serious about transforming the postal system for the 21st century.\n\ngetting frightened说立法者怕出现短期政治难堪的局面，后一句又否认这代表认真改造邮政系统。D的gratitude却把作者写成感谢他们的贡献，把这种带批评意味的动机解释读成肯定与谢意。第3段说法案能节省资金，是介绍方案预计产生的效果；到本段，作者特意说明这种帮助只到最低限度，不能据前一段有省钱数字就取消最后的转折。\n\n这里的评价不同：原文在批评，D却改成感谢。\n\n**作者把达成一致归结为害怕眼前的政治难堪，并说这不是认真改革的表现，是在表达感谢吗？**\n\n不是。这里是在指出局限，而非感谢对方已经完成应做的改革。\n\nD与末段评价方向相反；一项措施可能省钱，不等于作者就会对推动它的人持感激态度。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. gratitude</h3>\n<blockquote>\n<p>感激</p>\n</blockquote>\n<p>把D接回题干，它说的是：在最后一段，作者对立法者表示感谢。</p>\n<p>D的gratitude需要作者把法案看成值得感谢的帮助，原文getting frightened则解释立法者为什么达成一致，因此回看作者把他们的举动归结为什么动机，并怎样评价结果。</p>\n<blockquote>\n<p>The emerging <span class=\"mask\">[xxx]</span> around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term <span class=\"mask\">[xxx]</span> at the USPS. It is not, however, a sign that they’re getting serious about transforming the postal system for the 21st century.</p>\n</blockquote>\n<p>getting frightened说立法者怕出现短期政治难堪的局面，后一句又否认这代表认真改造邮政系统。D的gratitude却把作者写成感谢他们的贡献，把这种带批评意味的动机解释读成肯定与谢意。第3段说法案能节省资金，是介绍方案预计产生的效果；到本段，作者特意说明这种帮助只到最低限度，不能据前一段有省钱数字就取消最后的转折。</p>\n<p>这里的评价不同：原文在批评，D却改成感谢。</p>\n<p><strong>作者把达成一致归结为害怕眼前的政治难堪，并说这不是认真改革的表现，是在表达感谢吗？</strong></p>\n<p>不是。这里是在指出局限，而非感谢对方已经完成应做的改革。</p>\n<p>D与末段评价方向相反；一项措施可能省钱，不等于作者就会对推动它的人持感激态度。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[220.0,1598.333,1335.0,631.667]],"questionRects":[[248.333,1498.333,1243.333,48.333],[310.0,1771.667,200.0,46.667]],"scrollTarget":"auto","meta":{"kind":"option","qid":"39","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的gratitude需要作者把法案看成值得感谢的帮助，原文getting frightened则解释立法者为什么达成一致，因此回看作者把他们的举动归结为什么动机，并怎样评价结果。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"getting frightened","visibleOptionAnchor":"gratitude"}}}},{"section":"39题","raw":"### 39题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n末段不断指出缺项，并否认立法者已认真改造邮政体系。C的discontent符合这种不满；有限承认法案有作用，并不等于敬重、宽容或感激。\n\n> **39题选C。**","contextRaw":"","html":"<h3>39题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>末段不断指出缺项，并否认立法者已认真改造邮政体系。C的discontent符合这种不满；有限承认法案有作用，并不等于敬重、宽容或感激。</p>\n<blockquote>\n<p><strong>39题选C。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[248.333,1498.333,1243.333,48.333]],"scrollTarget":"auto","meta":{"kind":"result","qid":"39"}},{"section":"40题","raw":"## 40题\n\n**Which of the following would be the best title for the text?**\n\n下面哪个最适合作为文章的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **The USPS Starts to Miss Its Good Old Days**\n\nUSPS开始怀念过去的好日子\n\nB. **The Postal Service: Keep Away from My Cheese**\n\n邮政局：别动我的奶酪\n\nC. **The USPS: Chronic Illness Requires a Quick Cure**\n\nUSPS：慢性病需要速治\n\nD. **The Postal Service Needs More than a Band-Aid**\n\n邮政局需要的不只是一块创可贴","contextRaw":"","html":"<h2>40题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下面哪个最适合作为文章的标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>The USPS Starts to Miss Its Good Old Days</strong></p>\n<p>USPS开始怀念过去的好日子</p>\n<p>B. <strong>The Postal Service: Keep Away from My Cheese</strong></p>\n<p>邮政局：别动我的奶酪</p>\n<p>C. <strong>The USPS: Chronic Illness Requires a Quick Cure</strong></p>\n<p>USPS：慢性病需要速治</p>\n<p>D. <strong>The Postal Service Needs More than a Band-Aid</strong></p>\n<p>邮政局需要的不只是一块创可贴</p>\n","articleRects":[],"questionRects":[[246.667,1906.667,1041.667,48.333],[308.333,1975.0,786.667,46.667],[310.0,2041.667,868.333,50.0],[308.333,2110.0,886.667,48.333],[308.333,2178.333,856.667,40.0]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"40"}},{"section":"40题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。 | 先摆出眼前的难题 |\n| 2 | 写利益群体坚持维护现状，对国会形成压力，使改革立法反复失败，现代化也受到拖累。 | 再说为什么一直没有解决 |\n| 3 | 介绍各方终于同意的方案，包括提高每封信邮费、转移医疗承担，以及五年节省资金等预计效果。 | 接着摆出一个看似可行的办法 |\n| 4 | 指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。 | 最后说这样还是不够 |","contextRaw":"","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。</td>\n<td>先摆出眼前的难题</td>\n</tr>\n<tr>\n<td>2</td>\n<td>写利益群体坚持维护现状，对国会形成压力，使改革立法反复失败，现代化也受到拖累。</td>\n<td>再说为什么一直没有解决</td>\n</tr>\n<tr>\n<td>3</td>\n<td>介绍各方终于同意的方案，包括提高每封信邮费、转移医疗承担，以及五年节省资金等预计效果。</td>\n<td>接着摆出一个看似可行的办法</td>\n</tr>\n<tr>\n<td>4</td>\n<td>指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。</td>\n<td>最后说这样还是不够</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[221.667,326.667,1335.0,473.333],[221.667,803.333,1333.333,313.333],[221.667,1121.667,1333.333,465.0],[220.0,1598.333,1335.0,631.667]],"questionRects":[[246.667,1906.667,1041.667,48.333]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"40","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"40题","raw":"### A. The USPS Starts to Miss Its Good Old Days\n\n> USPS开始怀念过去的好日子\n\n如果A是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 写邮政局现在的困难，引出对昔日繁荣的怀念。 | 先摆出眼前的难题 |\n| 2 | 解释为什么再也回不到过去的好日子。 | 再说为什么一直没有解决 |\n| 3 | 写邮政局为重温旧日生活提出的办法。 | 接着摆出一个看似可行的办法 |\n| 4 | 最后仍围绕过去与现在的感伤，强调它开始怀旧。 | 最后说这样还是不够 |\n\nA中的Good Old Days能让人想到首段formerly stable，但那三个词只是把过去稳定与如今困难作一个背景对照。后面作者并没有叙述过去服务有多好、员工有多自豪，或邮政局现在怎样怀念旧日生活；第2段在讲改革为什么被阻挡，第3段介绍新方案，第4段批评方案没有真正面向21世纪。文章的方向是应该怎样改变，而不是邮政局的怀旧心理。A把开头的一处时间对照扩大成感伤主题，无法解释中后段具体的立法措施和作者对改革力度的判断。\n\n**首段说机构原本稳定，就足以让三段改革讨论变成邮政局怀念过去的故事吗？**\n\n不能。作者用过去作对照，是为了说明眼前需要改变，不是在描述怀旧情绪。\n\nA需要全文沿着“怀念往日”走，实际全文却沿着“困难—阻力—方案—仍然不足”往前推进。\n\n**判断：A排除。**","contextRaw":"","html":"<h3>A. The USPS Starts to Miss Its Good Old Days</h3>\n<blockquote>\n<p>USPS开始怀念过去的好日子</p>\n</blockquote>\n<p>如果A是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>写邮政局现在的困难，引出对昔日繁荣的怀念。</td>\n<td>先摆出眼前的难题</td>\n</tr>\n<tr>\n<td>2</td>\n<td>解释为什么再也回不到过去的好日子。</td>\n<td>再说为什么一直没有解决</td>\n</tr>\n<tr>\n<td>3</td>\n<td>写邮政局为重温旧日生活提出的办法。</td>\n<td>接着摆出一个看似可行的办法</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后仍围绕过去与现在的感伤，强调它开始怀旧。</td>\n<td>最后说这样还是不够</td>\n</tr>\n</tbody>\n</table>\n<p>A中的Good Old Days能让人想到首段formerly stable，但那三个词只是把过去稳定与如今困难作一个背景对照。后面作者并没有叙述过去服务有多好、员工有多自豪，或邮政局现在怎样怀念旧日生活；第2段在讲改革为什么被阻挡，第3段介绍新方案，第4段批评方案没有真正面向21世纪。文章的方向是应该怎样改变，而不是邮政局的怀旧心理。A把开头的一处时间对照扩大成感伤主题，无法解释中后段具体的立法措施和作者对改革力度的判断。</p>\n<p><strong>首段说机构原本稳定，就足以让三段改革讨论变成邮政局怀念过去的故事吗？</strong></p>\n<p>不能。作者用过去作对照，是为了说明眼前需要改变，不是在描述怀旧情绪。</p>\n<p>A需要全文沿着“怀念往日”走，实际全文却沿着“困难—阻力—方案—仍然不足”往前推进。</p>\n<p><strong>判断：A排除。</strong></p>\n","articleRects":[[221.667,326.667,1335.0,473.333],[221.667,803.333,1333.333,313.333],[221.667,1121.667,1333.333,465.0],[220.0,1598.333,1335.0,631.667]],"questionRects":[[246.667,1906.667,1041.667,48.333],[308.333,1975.0,786.667,46.667]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"A"}},{"section":"40题","raw":"### B. The Postal Service: Keep Away from My Cheese\n\n> 邮政局：别动我的奶酪\n\n如果B是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 用邮政困难引出各方把既有利益当作不可触动的东西。 | 先摆出眼前的难题 |\n| 2 | 重点写利益群体如何保护自己依赖的旧安排。 | 再说为什么一直没有解决 |\n| 3 | 展示新方案怎样继续保住这些既得利益。 | 接着摆出一个看似可行的办法 |\n| 4 | 最后主要谴责各方只顾保住自己的利益。 | 最后说这样还是不够 |\n\nB的Keep Away from My Cheese用“别动我的奶酪”表现守住既有利益，确实能接上第2段的status quo they depend on get protected，也能接到末段特殊利益群体挡下周六投递改变。因此它比怀旧题材更贴近文章的一部分。但作者还用整段介绍达成一致的法案和省钱安排，最后的核心判断是这些办法只够维持最低限度，不能替代真正改造。利益群体是改革为什么难的原因之一，不是全文唯一的被讨论对象。若B统领全文，第三段措施的作用会只剩下“保护奶酪”，而实际作者承认它能改善资金，只是认为远远不够。\n\n**维护既有利益能解释改革阻力，但能否独自覆盖作者对新方案“有作用却仍不足”的完整评价？**\n\n不能。它抓住了一个重要原因，却没有说出本文最后落下的改革要求。\n\nB用局部阻力替代对整个改革方案的判断，容易读到第2段便停住，而忽略第3、4段之间先介绍再批评的推进。\n\n**判断：B排除。**","contextRaw":"","html":"<h3>B. The Postal Service: Keep Away from My Cheese</h3>\n<blockquote>\n<p>邮政局：别动我的奶酪</p>\n</blockquote>\n<p>如果B是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>用邮政困难引出各方把既有利益当作不可触动的东西。</td>\n<td>先摆出眼前的难题</td>\n</tr>\n<tr>\n<td>2</td>\n<td>重点写利益群体如何保护自己依赖的旧安排。</td>\n<td>再说为什么一直没有解决</td>\n</tr>\n<tr>\n<td>3</td>\n<td>展示新方案怎样继续保住这些既得利益。</td>\n<td>接着摆出一个看似可行的办法</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后主要谴责各方只顾保住自己的利益。</td>\n<td>最后说这样还是不够</td>\n</tr>\n</tbody>\n</table>\n<p>B的Keep Away from My Cheese用“别动我的奶酪”表现守住既有利益，确实能接上第2段的status quo they depend on get protected，也能接到末段特殊利益群体挡下周六投递改变。因此它比怀旧题材更贴近文章的一部分。但作者还用整段介绍达成一致的法案和省钱安排，最后的核心判断是这些办法只够维持最低限度，不能替代真正改造。利益群体是改革为什么难的原因之一，不是全文唯一的被讨论对象。若B统领全文，第三段措施的作用会只剩下“保护奶酪”，而实际作者承认它能改善资金，只是认为远远不够。</p>\n<p><strong>维护既有利益能解释改革阻力，但能否独自覆盖作者对新方案“有作用却仍不足”的完整评价？</strong></p>\n<p>不能。它抓住了一个重要原因，却没有说出本文最后落下的改革要求。</p>\n<p>B用局部阻力替代对整个改革方案的判断，容易读到第2段便停住，而忽略第3、4段之间先介绍再批评的推进。</p>\n<p><strong>判断：B排除。</strong></p>\n","articleRects":[[221.667,326.667,1335.0,473.333],[221.667,803.333,1333.333,313.333],[221.667,1121.667,1333.333,465.0],[220.0,1598.333,1335.0,631.667]],"questionRects":[[246.667,1906.667,1041.667,48.333],[310.0,2041.667,868.333,50.0]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"B"}},{"section":"40题","raw":"### C. The USPS: Chronic Illness Requires a Quick Cure\n\n> USPS：慢性病需要速治\n\n如果C是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 以长期困难表现邮政局患上慢性病。 | 先摆出眼前的难题 |\n| 2 | 解释为什么疾病拖延已久，突出时间紧迫。 | 再说为什么一直没有解决 |\n| 3 | 提出可以快速治愈的办法。 | 接着摆出一个看似可行的办法 |\n| 4 | 最后要求赶快采取速效治疗，重点落在快。 | 最后说这样还是不够 |\n\nC的Chronic Illness能接上首段连续十年收支失衡，但Quick Cure把解决方向落在迅速治好。实际第3段已经有一项旨在维持生存、改善近期财务的方案，第4段却批评它只是bare, bare minimum，并非足以改造邮政体系。作者不是嫌这种短期办法动作不够快，主要是嫌它动得不够深、关键安排没有改变。末句将short-term与for the 21st century放在对照里，更说明眼前解围与长期转型不是同一件事。C只讲迅速，反而容易把作者认为不能满足的急救办法读成他所追求的终点。\n\n**作者嫌方案只够眼前最低限度，这个判断主要是在要求更快治，还是要求不止于眼前修补？**\n\n后者。关键是改革的深度和范围，而不是单纯速度。\n\nC正确识别困难长期存在，却把作者所要求的改革性质换成了速效处理，不能保留末段的主要对照。\n\n**判断：C排除。**","contextRaw":"","html":"<h3>C. The USPS: Chronic Illness Requires a Quick Cure</h3>\n<blockquote>\n<p>USPS：慢性病需要速治</p>\n</blockquote>\n<p>如果C是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>以长期困难表现邮政局患上慢性病。</td>\n<td>先摆出眼前的难题</td>\n</tr>\n<tr>\n<td>2</td>\n<td>解释为什么疾病拖延已久，突出时间紧迫。</td>\n<td>再说为什么一直没有解决</td>\n</tr>\n<tr>\n<td>3</td>\n<td>提出可以快速治愈的办法。</td>\n<td>接着摆出一个看似可行的办法</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后要求赶快采取速效治疗，重点落在快。</td>\n<td>最后说这样还是不够</td>\n</tr>\n</tbody>\n</table>\n<p>C的Chronic Illness能接上首段连续十年收支失衡，但Quick Cure把解决方向落在迅速治好。实际第3段已经有一项旨在维持生存、改善近期财务的方案，第4段却批评它只是bare, bare minimum，并非足以改造邮政体系。作者不是嫌这种短期办法动作不够快，主要是嫌它动得不够深、关键安排没有改变。末句将short-term与for the 21st century放在对照里，更说明眼前解围与长期转型不是同一件事。C只讲迅速，反而容易把作者认为不能满足的急救办法读成他所追求的终点。</p>\n<p><strong>作者嫌方案只够眼前最低限度，这个判断主要是在要求更快治，还是要求不止于眼前修补？</strong></p>\n<p>后者。关键是改革的深度和范围，而不是单纯速度。</p>\n<p>C正确识别困难长期存在，却把作者所要求的改革性质换成了速效处理，不能保留末段的主要对照。</p>\n<p><strong>判断：C排除。</strong></p>\n","articleRects":[[221.667,326.667,1335.0,473.333],[221.667,803.333,1333.333,313.333],[221.667,1121.667,1333.333,465.0],[220.0,1598.333,1335.0,631.667]],"questionRects":[[246.667,1906.667,1041.667,48.333],[308.333,2110.0,886.667,48.333]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"C"}},{"section":"40题","raw":"### D. The Postal Service Needs More than a Band-Aid\n\n> 邮政局需要的不只是一块创可贴\n\n如果D是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先摆出持续困难，让人看到需要处理的不只是一个偶然小问题。 | 先摆出眼前的难题 |\n| 2 | 解释长期难改的阻力，表明不能简单补一个缺口就结束。 | 再说为什么一直没有解决 |\n| 3 | 介绍眼前可以缓和困难的方案，承认它有实际用途。 | 接着摆出一个看似可行的办法 |\n| 4 | 指出这种修补仍触不到重要安排，需要比临时补救更充分的改变。 | 最后说这样还是不够 |\n\nD的Band-Aid先按字面读作创可贴，代回文章是在比喻只能短期缓解的修补。Needs More than没有否认眼前方案能省钱，而是说不止需要这些：第3段的资金效果可以保留，第4段的最低限度、未改变事项和未讨论事项也都能接上。首段给出长期财务与运营结构的难题，第2段给出改革阻力，因此最后要求的不可能只是一项临时补账办法。D比B多保留了对新方案的评价，又比C准确地区分“快一点”和“改得更充分”。\n\n**把现有方案看成有帮助但远远不够的修补，是否能够贯通困难、阻力、方案和最后的批评？**\n\n能够。D同时容纳方案的有限作用和作者对更充分改革的要求。\n\n这个标题不需要抹掉第3段的正面数字，也不需要弱化第4段的否定。More than正好把“已经做了一点”与“仍需要更多”接在一起。\n\n**判断：D保留。**","contextRaw":"","html":"<h3>D. The Postal Service Needs More than a Band-Aid</h3>\n<blockquote>\n<p>邮政局需要的不只是一块创可贴</p>\n</blockquote>\n<p>如果D是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先摆出持续困难，让人看到需要处理的不只是一个偶然小问题。</td>\n<td>先摆出眼前的难题</td>\n</tr>\n<tr>\n<td>2</td>\n<td>解释长期难改的阻力，表明不能简单补一个缺口就结束。</td>\n<td>再说为什么一直没有解决</td>\n</tr>\n<tr>\n<td>3</td>\n<td>介绍眼前可以缓和困难的方案，承认它有实际用途。</td>\n<td>接着摆出一个看似可行的办法</td>\n</tr>\n<tr>\n<td>4</td>\n<td>指出这种修补仍触不到重要安排，需要比临时补救更充分的改变。</td>\n<td>最后说这样还是不够</td>\n</tr>\n</tbody>\n</table>\n<p>D的Band-Aid先按字面读作创可贴，代回文章是在比喻只能短期缓解的修补。Needs More than没有否认眼前方案能省钱，而是说不止需要这些：第3段的资金效果可以保留，第4段的最低限度、未改变事项和未讨论事项也都能接上。首段给出长期财务与运营结构的难题，第2段给出改革阻力，因此最后要求的不可能只是一项临时补账办法。D比B多保留了对新方案的评价，又比C准确地区分“快一点”和“改得更充分”。</p>\n<p><strong>把现有方案看成有帮助但远远不够的修补，是否能够贯通困难、阻力、方案和最后的批评？</strong></p>\n<p>能够。D同时容纳方案的有限作用和作者对更充分改革的要求。</p>\n<p>这个标题不需要抹掉第3段的正面数字，也不需要弱化第4段的否定。More than正好把“已经做了一点”与“仍需要更多”接在一起。</p>\n<p><strong>判断：D保留。</strong></p>\n","articleRects":[[221.667,326.667,1335.0,473.333],[221.667,803.333,1333.333,313.333],[221.667,1121.667,1333.333,465.0],[220.0,1598.333,1335.0,631.667]],"questionRects":[[246.667,1906.667,1041.667,48.333],[308.333,2178.333,856.667,40.0]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"40","option":"D"}},{"section":"40题","raw":"### 40题主旨结果\n\n四项与全文的展开逐段比较后，D能够保留文章最后落实的判断。\n\n> **40题选D。**\n\n这句话就是本文后续做题的主旨底牌：\n\n**The Postal Service Needs More than a Band-Aid / 邮政局需要的不只是一块创可贴**","contextRaw":"","html":"<h3>40题主旨结果</h3>\n<p>四项与全文的展开逐段比较后，D能够保留文章最后落实的判断。</p>\n<blockquote>\n<p><strong>40题选D。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>The Postal Service Needs More than a Band-Aid / 邮政局需要的不只是一块创可贴</strong></p>\n","articleRects":[],"questionRects":[[246.667,1906.667,1041.667,48.333],[308.333,2178.333,856.667,40.0]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"40"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保40题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","contextRaw":"","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保40题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查36题：A还是B？\n\n第一遍留下：\n\n- A. its **[xxx]** budget\n- B. its rigid management\n\n主旨底牌是：\n\n> **The Postal Service Needs More than a Band-Aid / 邮政局需要的不只是一块创可贴**\n\n也就是：眼前改善资金的办法确实可能有帮助，但如果仍不能改变旧的运营安排，就没有完成作者所要求的改革。不能把短期补洞当成长期问题已经解决。\n\n我们先把题干和两个选项接起来。\n\nA说财务问题部分来自某种 **[xxx]** 预算；B说财务问题部分来自僵化管理。A先指向收支安排，具体特点还没读清；B指向管理不能灵活调整的状况。\n\n第一遍之所以两项都留下，是因为首段明确写了费用长期超过收入，budget确实与收支有关，但它前面的意思没有读出，不能抢先将A固定解释成某种预算问题。B则有denies management the flexibility的直接支持。那时先把“有关”与“已经明确”分开，不用B更直接这一点强行结束比较。\n\n现在拿主旨来检查。\n\n先看B。Needs More than a Band-Aid要求我们区别表面资金缓解与更深的改革。首段说结构不给管理层适应新现实的灵活性，这正是在解释为什么技术改变需求之后，邮政局不能相应调整运营。B保留的rigid management因此既是本段明确的原因，也是全文为什么不能只靠临时修补的起点。主旨没有为B另造原因，只是让已经读过的原因在全文要求中有了位置。\n\n再看A。收支和预算当然与财务问题有关，但题干问的是caused partly by，不是问困境表现在哪些账目上。只把budget与亏损放在一起，尚不能说明哪一种预算安排造成了困难；更不能把“支出超过收入”这件困难本身重新当作完整原因。放在这个主旨下，能补钱的安排与必须改变的经营机制还需要分开，A现在没有把这个原因关系说明白。\n\n因此，B同时得到首段原因句与全文改革要求的支持；A仍只留下了一个与收支有关、具体特点和因果尚未接全的说法。这里最终选B，不把A的 **[xxx]** 擅自翻出来，也不把主旨用成“凡是说预算都错”的口号，决定差别的是哪一项保留了文中已经建立的原因。\n\n> **36题选B。**","contextRaw":"","html":"<h2>回查36题：A还是B？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. its <span class=\"mask\">[xxx]</span> budget</li>\n<li>B. its rigid management</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>The Postal Service Needs More than a Band-Aid / 邮政局需要的不只是一块创可贴</strong></p>\n</blockquote>\n<p>也就是：眼前改善资金的办法确实可能有帮助，但如果仍不能改变旧的运营安排，就没有完成作者所要求的改革。不能把短期补洞当成长期问题已经解决。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A说财务问题部分来自某种 <span class=\"mask\">[xxx]</span> 预算；B说财务问题部分来自僵化管理。A先指向收支安排，具体特点还没读清；B指向管理不能灵活调整的状况。</p>\n<p>第一遍之所以两项都留下，是因为首段明确写了费用长期超过收入，budget确实与收支有关，但它前面的意思没有读出，不能抢先将A固定解释成某种预算问题。B则有denies management the flexibility的直接支持。那时先把“有关”与“已经明确”分开，不用B更直接这一点强行结束比较。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。Needs More than a Band-Aid要求我们区别表面资金缓解与更深的改革。首段说结构不给管理层适应新现实的灵活性，这正是在解释为什么技术改变需求之后，邮政局不能相应调整运营。B保留的rigid management因此既是本段明确的原因，也是全文为什么不能只靠临时修补的起点。主旨没有为B另造原因，只是让已经读过的原因在全文要求中有了位置。</p>\n<p>再看A。收支和预算当然与财务问题有关，但题干问的是caused partly by，不是问困境表现在哪些账目上。只把budget与亏损放在一起，尚不能说明哪一种预算安排造成了困难；更不能把“支出超过收入”这件困难本身重新当作完整原因。放在这个主旨下，能补钱的安排与必须改变的经营机制还需要分开，A现在没有把这个原因关系说明白。</p>\n<p>因此，B同时得到首段原因句与全文改革要求的支持；A仍只留下了一个与收支有关、具体特点和因果尚未接全的说法。这里最终选B，不把A的 <span class=\"mask\">[xxx]</span> 擅自翻出来，也不把主旨用成“凡是说预算都错”的口号，决定差别的是哪一项保留了文中已经建立的原因。</p>\n<blockquote>\n<p><strong>36题选B。</strong></p>\n</blockquote>\n","articleRects":[[221.667,326.667
