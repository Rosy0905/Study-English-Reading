意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Attracting more first-class mail users would answer the unions’ complaint.\u003c/p>\n\u003cp>吸引更多一类邮件用户会回应工会的诉求。\u003c/p>\n\u003c/blockquote>\n\u003cp>首段已说需求永久减少，第三段也未提出新增用户方案；抱怨具体针对预存医疗费用，不是用户数本身。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨承认眼前财务方案有有限帮助，本题只问其中哪项对应长期抱怨，不能用“方案里的任意一项”替代latter的具体指代。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>attracting more first-class mail users\u003cbr>吸引更多一类邮件用户\u003c/p>\n\u003c/blockquote>\n\u003cp>D把自己想到的一种业务办法放进原文的措施列表，又让它替代明确的医疗负担处理，动作和对象都不相同。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍各方终于同意的方案，包括提高每封信邮费、转移医疗承担，以及五年节省资金等预计效果。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>38题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>38. A. removing its burden of retiree health care\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：financial burden后面明确接医疗相关支出，thus addressing又直接说明处理这项负担会回应长期抱怨。\u003c/p>\n\u003cp>B：help pay for new vehicles是省下的钱可以帮助支付的一种用途，后面among other survival measures说明它属于若干维持经营的安排之一。\u003c/p>\n\u003cp>C：The latter step指“后一个措施”。\u003c/p>\n\u003cp>D：Most of the money would come后面列一封信增加一美分，以及退休人员转入Medicare。\u003c/p>\n\u003ch2>39题\u003c/h2>\n\u003cblockquote>\n\u003cp>In the last paragraph, the author seems to view legislators with ______.\u003cbr>从最后一段来看，作者对立法者表现出的态度是怎样的？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>作者态度题。题干要求判断“从最后一段来看，作者对立法者表现出的态度是怎样的？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform. There&#39;s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency&#39;s costs. Also missing is any discussion of eliminating Saturday letter delivery. That common-sense change enjoys wide public support and would save the USPS $2 billion per year. But postal special-interest groups seem to have killed it, at least in the House. The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS. It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者承认法案能勉强维持邮政，却批评遗漏人员成本与周六投递改革，结尾说立法者只怕短期崩溃，尚未认真长期转型。\u003c/p>\n\u003ch3>A. respect\u003c/h3>\n\u003cblockquote>\n\u003cp>尊重\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的respect说作者敬重立法者，第4段getting serious涉及他们是否认真对待改革，因此回看这句话前面有没有否定，以及前面列出的未做事项。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>getting serious前面受It is not…a sign管着，作者不是表扬他们终于认真改造邮政体系，而是否认法案共识足以证明这种认真。A的respect要求正面的敬重，但本段反复写no change、Also missing，再说只是害怕短期出现政治难堪的情况。这里不能因为legislators取得一致就把评价自动转成尊敬；作者恰恰把达成一致与真正改革区分开，认为前一件事远远不够。\u003c/p>\n\u003cp>A把作者明确的否定方向翻成正面敬重，忽略了末句not与整段列举缺项的共同作用。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>There&#39;s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency&#39;s costs.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者对立法者的表现感到尊重。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的respect说作者敬重立法者，第4段getting serious涉及他们是否认真对待改革，因此回看这句话前面有没有否定，以及前面列出的未做事项。\u003c/p>\n\u003cp>getting serious前面受It is not…a sign管着，作者不是表扬他们终于认真改造邮政体系，而是否认法案共识足以证明这种认真。A的respect要求正面的敬重，但本段反复写no change、Also missing，再说只是害怕短期出现政治难堪的情况。这里不能因为legislators取得一致就把评价自动转成尊敬；作者恰恰把达成一致与真正改革区分开，认为前一件事远远不够。\u003c/p>\n\u003cp>A把作者明确的否定方向翻成正面敬重，忽略了末句not与整段列举缺项的共同作用。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>There&#39;s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency&#39;s costs.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003cp>作者承认法案能勉强维持邮政，却批评遗漏人员成本与周六投递改革，结尾说立法者只怕短期崩溃，尚未认真长期转型。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The legislators deserve respect for carrying out comprehensive postal reform.\u003c/p>\n\u003cp>立法者因实施全面邮政改革而值得尊重。\u003c/p>\n\u003c/blockquote>\n\u003cp>实际not comprehensive reform否定全面改革，列遗漏再批评动机，不能因共识出现就推成赞许。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>需要的不只是创可贴，说明作者对止于最低救急的立法不满足；态度应结合bare minimum、major omission及not serious，而非仅看终于达成共识。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>respect\u003cbr>尊重\u003c/p>\n\u003c/blockquote>\n\u003cp>A把作者明确的否定方向翻成正面敬重，忽略了末句not与整段列举缺项的共同作用。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. tolerance\u003c/h3>\n\u003cblockquote>\n\u003cp>容忍\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的tolerance意味着作者对不足表示容忍，原文bare, bare minimum也承认法案能做到最低限度，因此回看这种有限作用后面接的是体谅，还是继续追问缺少什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>bare, bare minimum里bare重复一次，把法案的作用压在最低限度，不是替立法者说“能做到这些已经值得谅解”。B的tolerance需要作者接受这种不足，但原文随后追列未改变的安排、未讨论的周六投递，最后还否认他们已经认真改革。作者的落点不是“现实困难多，所以这样也行”，而是“这并不表明真正改造已经开始”。\u003c/p>\n\u003cp>B把一处有限事实让步读成了整体态度上的宽容，漏掉整段向不足之处推进的方向。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者对立法者的表现感到容忍。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的tolerance意味着作者对不足表示容忍，原文bare, bare minimum也承认法案能做到最低限度，因此回看这种有限作用后面接的是体谅，还是继续追问缺少什么。\u003c/p>\n\u003cp>bare, bare minimum里bare重复一次，把法案的作用压在最低限度，不是替立法者说“能做到这些已经值得谅解”。B的tolerance需要作者接受这种不足，但原文随后追列未改变的安排、未讨论的周六投递，最后还否认他们已经认真改革。作者的落点不是“现实困难多，所以这样也行”，而是“这并不表明真正改造已经开始”。\u003c/p>\n\u003cp>作者承认作用有限之后，仍继续批评缺项和缺少认真改革的表现。\u003c/p>\n\u003cp>B把一处有限事实让步读成了整体态度上的宽容，漏掉整段向不足之处推进的方向。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003cp>作者承认法案能勉强维持邮政，却批评遗漏人员成本与周六投递改革，结尾说立法者只怕短期崩溃，尚未认真长期转型。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The legislators’ limited response is acceptable despite its shortcomings.\u003c/p>\n\u003cp>尽管存在不足，立法者的有限回应仍可被接受。\u003c/p>\n\u003c/blockquote>\n\u003cp>容忍应在指出不足后接受这种局限，实际反复强调遗漏并要求真正转型，批评并未收回。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>需要的不只是创可贴，说明作者对止于最低救急的立法不满足；态度应结合bare minimum、major omission及not serious，而非仅看终于达成共识。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>tolerance\u003cbr>容忍\u003c/p>\n\u003c/blockquote>\n\u003cp>B把一处有限事实让步读成了整体态度上的宽容，漏掉整段向不足之处推进的方向。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. discontent\u003c/h3>\n\u003cblockquote>\n\u003cp>不满\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的discontent说作者不满意，末句It is not, however, a sign直接否认立法者已经认真改革的说法，因此回看这个否定，再把它与前面的no change、Also missing一起读。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>It is not, however, a sign把“害怕短期政治尴尬”与“认真为21世纪改造系统”分开，作者认为前者不能证明后者。C的discontent正好承接这种对动机和行动不足的不满意。前面列未改事项与未讨论事项，不是在中性统计数量，而是在解释为什么法案只够最低限度。C只说不满，没有进一步夸成仇恨所有立法者。\u003c/p>\n\u003cp>C既与末句的否定一致，也与前面的缺项说明相合，程度上没有强行扩大成轻蔑或全盘敌视，因此保留。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Also missing is any discussion of eliminating Saturday letter delivery.\u003c/p>\n\u003cp>The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者对立法者的表现感到不满。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的discontent说作者不满意，末句It is not, however, a sign直接否认立法者已经认真改革的说法，因此回看这个否定，再把它与前面的no change、Also missing一起读。\u003c/p>\n\u003cp>It is not, however, a sign把“害怕短期政治尴尬”与“认真为21世纪改造系统”分开，作者认为前者不能证明后者。C的discontent正好承接这种对动机和行动不足的不满意。前面列未改事项与未讨论事项，不是在中性统计数量，而是在解释为什么法案只够最低限度。C只说不满，没有进一步夸成仇恨所有立法者。\u003c/p>\n\u003cp>C既与末句的否定一致，也与前面的缺项说明相合，程度上没有强行扩大成轻蔑或全盘敌视，因此保留。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Also missing is any discussion of eliminating Saturday letter delivery.\u003c/p>\n\u003cp>The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003cp>作者承认法案能勉强维持邮政，却批评遗漏人员成本与周六投递改革，结尾说立法者只怕短期崩溃，尚未认真长期转型。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The legislators are addressing short-term embarrassment while failing to undertake serious reform.\u003c/p>\n\u003cp>立法者正在处理短期难堪，却没有开展认真改革。\u003c/p>\n\u003c/blockquote>\n\u003cp>这段假设保留短期恐慌与长期不作为的反差，对应末两句的not...however，discontent概括这种不满。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>需要的不只是创可贴，说明作者对止于最低救急的立法不满足；态度应结合bare minimum、major omission及not serious，而非仅看终于达成共识。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>discontent\u003cbr>不满\u003c/p>\n\u003c/blockquote>\n\u003cp>C既与末句的否定一致，也与前面的缺项说明相合，程度上没有强行扩大成轻蔑或全盘敌视，因此保留。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. gratitude\u003c/h3>\n\u003cblockquote>\n\u003cp>感激\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的gratitude需要作者把法案看成值得感谢的帮助，原文getting frightened则解释立法者为什么达成一致，因此回看作者把他们的举动归结为什么动机，并怎样评价结果。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>getting frightened说立法者怕出现短期政治难堪的局面，后一句又否认这代表认真改造邮政系统。D的gratitude却把作者写成感谢他们的贡献，把这种带批评意味的动机解释读成肯定与谢意。第3段说法案能节省资金，是介绍方案预计产生的效果；到本段，作者特意说明这种帮助只到最低限度，不能据前一段有省钱数字就取消最后的转折。\u003c/p>\n\u003cp>D与末段评价方向相反；一项措施可能省钱，不等于作者就会对推动它的人持感激态度。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者对立法者的表现感到感激。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的gratitude需要作者把法案看成值得感谢的帮助，原文getting frightened则解释立法者为什么达成一致，因此回看作者把他们的举动归结为什么动机，并怎样评价结果。\u003c/p>\n\u003cp>getting frightened说立法者怕出现短期政治难堪的局面，后一句又否认这代表认真改造邮政系统。D的gratitude却把作者写成感谢他们的贡献，把这种带批评意味的动机解释读成肯定与谢意。第3段说法案能节省资金，是介绍方案预计产生的效果；到本段，作者特意说明这种帮助只到最低限度，不能据前一段有省钱数字就取消最后的转折。\u003c/p>\n\u003cp>D与末段评价方向相反；一项措施可能省钱，不等于作者就会对推动它的人持感激态度。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003cp>作者承认法案能勉强维持邮政，却批评遗漏人员成本与周六投递改革，结尾说立法者只怕短期崩溃，尚未认真长期转型。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The author is grateful to legislators for finally saving the system.\u003c/p>\n\u003cp>作者感谢立法者终于挽救了这个体系。\u003c/p>\n\u003c/blockquote>\n\u003cp>感谢需要对立法行动作肯定收束，实际以未认真转型结尾。暂时维持运转的效用不能抹去全文对立法局限的批评。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>需要的不只是创可贴，说明作者对止于最低救急的立法不满足；态度应结合bare minimum、major omission及not serious，而非仅看终于达成共识。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>gratitude\u003cbr>感激\u003c/p>\n\u003c/blockquote>\n\u003cp>D与末段评价方向相反；一项措施可能省钱，不等于作者就会对推动它的人持感激态度。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>39题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>39. C. discontent\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：getting serious前面受It is not…a sign管着，作者不是表扬他们终于认真改造邮政体系，而是否认法案共识足以证明这种认真。\u003c/p>\n\u003cp>B：bare, bare minimum里bare重复一次，把法案的作用压在最低限度，不是替立法者说“能做到这些已经值得谅解”。\u003c/p>\n\u003cp>C：It is not, however, a sign把“害怕短期政治尴尬”与“认真为21世纪改造系统”分开，作者认为前者不能证明后者。\u003c/p>\n\u003cp>D：getting frightened说立法者怕出现短期政治难堪的局面，后一句又否认这代表认真改造邮政系统。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：USPS的财务危机现状\u003c/strong>（段落1问题呈现） 财务困境：【连续10年亏损（2016年亏56亿）+ 1200亿未备资金负债（主要是员工健康和退休成本）】→ 根本原因：【技术变革减少一类邮件需求 + 监管结构缺乏灵活性】\u003c/p>\n\u003cp>↓（阻碍改革的原因）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：改革失败的深层原因\u003c/strong>（段落2利益纠葛） 利益集团施压：（邮政工会到贺卡制造商 → 向国会施压保护现状）→ 结果：改革立法反复失败 → USPS只能推迟现代化来支付账单\u003c/p>\n\u003cp>↓（新的改革尝试）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：最新改革方案\u003c/strong>（段落3妥协方案） 各方达成一致：【5年节省286亿（用于新车辆等）】→ 资金来源：（每封信涨1美分 + 退休人员转入医疗保险）→ 解决长期投诉：抵消预先资助退休医疗的负担\u003c/p>\n\u003cp>↓（方案的局限性）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：改革的不彻底性\u003c/strong>（段落4批判分析） 参议院可能批评：只是最低限度措施 // 非全面改革 → 重大遗漏：【未改变集体谈判（人员成本占80%）+ 未讨论取消周六投递（可年省20亿）】→ 特殊利益集团扼杀改革 → 立法者动机：害怕短期崩溃 // 而非真正改造系统\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：USPS面临严重财务危机，虽然各方终于达成改革共识，但这只是维持运转的最低限度措施，而非21世纪所需的全面改革。真正的结构性问题（监管僵化、利益集团阻挠）仍未解决。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Caught between Declining Demand and Rigid Rules\u003c/p>\n\u003cp>B. Declaring the Financial Problem Permanently Solved\u003c/p>\n\u003cp>C. Proof That Management Can Change Everything Alone\u003c/p>\n\u003cp>D. A Short-term Patch Is Not a Transformation\u003c/p>\n\u003cp>E. When Defending the Status Quo Blocks Adaptation\u003c/p>\n\u003cp>F. Important Costs Left Outside the Agreement\u003c/p>\n\u003cp>G. A Compromise That Buys Breathing Space\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>A postal service can lose revenue because technology changes the demand for its central product. If its managers also lack the freedom to adjust operations, the difficulty becomes a squeeze from two sides. Reducing costs then requires more than recognising that fewer letters are being sent. The organisation needs room to respond to the new reality. Without that room, a long-term shift in demand can become a recurring financial crisis.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>Different groups may each have a plausible reason to protect one feature of the existing system. Employees value particular working arrangements; businesses depend on familiar services and charges. Together, their pressure on lawmakers can make reform difficult even when the need for change is widely recognised. Protecting every separate interest may leave the organisation unable to modernise. The total effect of these demands can therefore conflict with the survival of the system on which the groups rely.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>An agreement among parties that usually disagree can still have practical value. Changes to charges and retirement-related obligations may release money for vehicles or other urgent needs. Such a package can reduce immediate financial pressure and make collapse less likely. That achievement should be described accurately: it buys breathing space. It does not follow that every difficult question about operations and costs has been resolved by the appearance of a compromise.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>The limits become clearer when the agreement is compared with the largest sources of expenditure. If major personnel costs remain untouched and a change to delivery frequency is excluded, the scope of reform is narrow. A measure can be politically achievable precisely because it avoids powerful interests. That may help it pass, but passage alone does not show that the business has been redesigned to match the environment in which it now operates.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>A short-term rescue and a lasting transformation should not be confused. The first may be necessary to keep services running while the second is debated. Trouble arises when relief from immediate pressure is presented as proof that adaptation is complete. Lawmakers can reasonably welcome an agreement and still demand more. The standard is whether the organisation can function under changed technological and economic conditions, not merely whether it can survive the next embarrassment.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>\u003cstrong>答案：A. Caught between Declining Demand and Rigid Rules / 夹在需求下降与僵化规则之间\u003c/strong>\u003c/p>\n\u003cp>把长期需求变化与制度限制结合为双重困境。\u003c/p>\n\u003cblockquote>\n\u003cp>A postal service can lose revenue because technology changes the demand for its central product.\u003c/p>\n\u003cp>Without that room, a long-term shift in demand can become a recurring financial crisis.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>把长期需求变化与制度限制结合为双重困境。\u003c/p>\n\u003c/blockquote>\n\u003cp>Declining Demand对应技术变化减少传统邮件需求，Rigid Rules对应管理层无权灵活调整；Caught between把两种压力合在同一困境中。\u003c/p>\n\u003cp>最强干扰项C（Proof That Management Can Change Everything Alone）容易因相同话题进入考虑。但段落强调管理层缺乏调整空间，不能概括成它可独自改变一切。\u003c/p>\n\u003cp>\u003cstrong>41题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>\u003cstrong>答案：E. When Defending the Status Quo Blocks Adaptation / 保卫现状如何阻碍调整\u003c/strong>\u003c/p>\n\u003cp>说明集团各自维护利益如何合成阻碍现代化的压力。\u003c/p>\n\u003cblockquote>\n\u003cp>Different groups may each have a plausible reason to protect one feature of the existing system.\u003c/p>\n\u003cp>The total effect of these demands can therefore conflict with the survival of the system on which the groups rely.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明集团各自维护利益如何合成阻碍现代化的压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>Defending the Status Quo对应各群体保护已有服务和待遇，Blocks Adaptation对应合起来的国会压力使必要现代化难以推进。\u003c/p>\n\u003cp>最强干扰项C（Proof That Management Can Change Everything Alone）容易因相同话题进入考虑。但关键决策受到国会与利益集团约束，不只取决于管理者意愿。\u003c/p>\n\u003cp>\u003cstrong>42题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>\u003cstrong>答案：G. A Compromise That Buys Breathing Space / 争取喘息空间的折中方案\u003c/strong>\u003c/p>\n\u003cp>肯定折中措施的短期财务作用，同时限定其成效。\u003c/p>\n\u003cblockquote>\n\u003cp>An agreement among parties that usually disagree can still have practical value.\u003c/p>\n\u003cp>It does not follow that every difficult question about operations and costs has been resolved by the appearance of a compromise.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>肯定折中措施的短期财务作用 → 同时限定其成效。\u003c/p>\n\u003c/blockquote>\n\u003cp>Compromise对应通常意见相左的各方就费用和退休义务达成一致，Breathing Space对应暂时释放资金、缓解崩溃压力，而不是永久治愈。\u003c/p>\n\u003cp>最强干扰项B（Declaring the Financial Problem Permanently Solved）容易因相同话题进入考虑。但争取时间不等于永久解决，结尾明确保留未处理的问题。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>\u003cstrong>答案：F. Important Costs Left Outside the Agreement / 协议之外的重要成本\u003c/strong>\u003c/p>\n\u003cp>通过人员与投递成本检验方案未覆盖的结构领域。\u003c/p>\n\u003cblockquote>\n\u003cp>The limits become clearer when the agreement is compared with the largest sources of expenditure.\u003c/p>\n\u003cp>That may help it pass, but passage alone does not show that the business has been redesigned to match the environment in which it now operates.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>通过人员与投递成本检验方案未覆盖的结构领域。\u003c/p>\n\u003c/blockquote>\n\u003cp>Important Costs对应人员成本和投递频率，Left Outside对应方案为避开强大利益而不作调整；标题检查方案的实质缺口。\u003c/p>\n\u003cp>最强干扰项B（Declaring the Financial Problem Permanently Solved）容易因相同话题进入考虑。但指出重大成本未处理，正是在拒绝财务问题已经彻底解决的判断。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>\u003cstrong>答案：D. A Short-term Patch Is Not a Transformation / 短期修补不是整体转型\u003c/strong>\u003c/p>\n\u003cp>区分保运转与适应新环境，对立法者提出长期改革要求。\u003c/p>\n\u003cblockquote>\n\u003cp>A short-term rescue and a lasting transformation should not be confused.\u003c/p>\n\u003cp>The standard is whether the organisation can function under changed technological and economic conditions, not merely whether it can survive the next embarrassment.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>区分保运转与适应新环境 → 对立法者提出长期改革要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>Short-term Patch对应暂时维持服务和缓解压力，Transformation对应适应技术、经济新环境的持续能力；Not把两种成效清楚分开。\u003c/p>\n\u003cp>最强干扰项G（A Compromise That Buys Breathing Space）容易因相同话题进入考虑。但喘息空间是前提，本段总结为何不能以短期救助替代结构转型。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>The financial difficulty of a postal service cannot be explained by one disappointing year alone. Technology has changed demand for its traditional product, while rules restrict the way management can respond. Understanding the crisis therefore requires looking at both the market and the organisation’s ability to adapt.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Despite that combined pressure, a compromise can sometimes emerge. Lawmakers and affected groups may agree on changes to charges or retirement obligations that promise substantial savings. Such an agreement is useful if it releases resources for immediate operational needs and prevents a worsening crisis in the near term.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Political difficulty does not disappear when a seemingly sensible proposal gains public support. A concentrated group may still have enough influence to remove it from a bill. This helps explain why a package can attract broad celebration while avoiding an option that would otherwise appear worth serious consideration.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Its ability to adapt is limited further when influential groups defend the arrangements on which they depend. Each group may seek to preserve a particular benefit or service. Their combined pressure on legislators can leave little room for changes that the organisation needs in order to modernise.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>The near-term benefit should not be mistaken for comprehensive reform. A measure may provide just enough support to keep the organisation operating while leaving its largest structural questions unanswered. To judge its significance, one must examine what the agreement does not attempt as carefully as what it includes.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>Among the changes it may fail to attempt are reforms affecting major personnel costs or the frequency of delivery. These are politically difficult precisely because established groups care about them. Leaving them untouched can make agreement easier, but it also restricts how far the measure can change the underlying business.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>Broad celebration may reflect relief rather than confidence in a transformed system. Legislators can be eager to avoid a visible short-term failure and still be reluctant to confront the interests blocking long-term change. The distinction matters because success at preventing embarrassment is a much lower standard than successful adaptation.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>Successful adaptation remains the larger task. A rescue package can serve as a useful first step, but only if its limits remain clear and further reform continues. The organisation needs more than enough money to reach the next deadline: it needs a structure capable of operating in the world its customers now inhabit.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出市场需求与调整能力两方面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>转入达成折中方案的短期收益\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>解释特殊集团可排除获支持的措施\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>解释利益集团如何限制调整\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>强调短期利益不足并引出缺项审查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>列举未涉及的主要结构成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>分析庆祝反映避免短期难堪的动机\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以长期结构适应收束\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出市场需求与调整能力两方面 → 解释利益集团如何限制调整 → 转入达成折中方案的短期收益 → 强调短期利益不足并引出缺项审查 → 列举未涉及的主要结构成本 → 解释特殊集团可排除获支持的措施 → 分析庆祝反映避免短期难堪的动机 → 以长期结构适应收束\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → B → E → F → C → G → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、B、F、C、G。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41位于全文第2个位置，完整衔接是A → D → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Understanding the crisis therefore requires looking at both the market and the organisation’s ability to adapt.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Its ability to adapt is limited further when influential groups defend the arrangements on which they depend.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Despite that combined pressure, a compromise can sometimes emerge.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>ability to adapt\u003c/code>，D继续处理这一对象，完成“解释利益集团如何限制调整”。到本段末尾，讨论又落到\u003ccode>combined pressure\u003c/code>，这正好为下一段“转入达成折中方案的短期收益”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出市场需求与调整能力两方面 → 解释利益集团如何限制调整 → 转入达成折中方案的短期收益\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“转入达成折中方案的短期收益”。它也属于同一论题，但若直接放在这里，就会跳过“解释利益集团如何限制调整”这一必要环节；其段首“Despite that combined pressure, a compromise can sometimes emerge.”需要的前提与A当前收束的对象不一致，后续也接不出B所需的\u003ccode>combined pressure\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42位于全文第3个位置，完整衔接是D → B → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Their combined pressure on legislators can leave little room for changes that the organisation needs in order to modernise.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Despite that combined pressure, a compromise can sometimes emerge.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The near-term benefit should not be mistaken for comprehensive reform.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>combined pressure\u003c/code>，B继续处理这一对象，完成“转入达成折中方案的短期收益”。到本段末尾，讨论又落到\u003ccode>near term\u003c/code>，这正好为下一段“强调短期利益不足并引出缺项审查”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释利益集团如何限制调整 → 转入达成折中方案的短期收益 → 强调短期利益不足并引出缺项审查\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“解释利益集团如何限制调整”。它也属于同一论题，但若直接放在这里，就会跳过“转入达成折中方案的短期收益”这一必要环节；其段首“Its ability to adapt is limited further when influential groups defend the arrangements on which they depend.”需要的前提与D当前收束的对象不一致，后续也接不出E所需的\u003ccode>near term\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43位于全文第5个位置，完整衔接是E → F → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To judge its significance, one must examine what the agreement does not attempt as carefully as what it includes.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Among the changes it may fail to attempt are reforms affecting major personnel costs or the frequency of delivery.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Political difficulty does not disappear when a seemingly sensible proposal gains public support.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>does not attempt\u003c/code>，F继续处理这一对象，完成“列举未涉及的主要结构成本”。到本段末尾，讨论又落到\u003ccode>politically difficult\u003c/code>，这正好为下一段“解释特殊集团可排除获支持的措施”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>强调短期利益不足并引出缺项审查 → 列举未涉及的主要结构成本 → 解释特殊集团可排除获支持的措施\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“解释特殊集团可排除获支持的措施”。它也属于同一论题，但若直接放在这里，就会跳过“列举未涉及的主要结构成本”这一必要环节；其段首“Political difficulty does not disappear when a seemingly sensible proposal gains public support.”需要的前提与E当前收束的对象不一致，后续也接不出C所需的\u003ccode>politically difficult\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44位于全文第6个位置，完整衔接是F → C → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Leaving them untouched can make agreement easier, but it also restricts how far the measure can change the underlying business.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Political difficulty does not disappear when a seemingly sensible proposal gains public support.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Broad celebration may reflect relief rather than confidence in a transformed system.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>politically difficult\u003c/code>，C继续处理这一对象，完成“解释特殊集团可排除获支持的措施”。到本段末尾，讨论又落到\u003ccode>broad celebration\u003c/code>，这正好为下一段“分析庆祝反映避免短期难堪的动机”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>列举未涉及的主要结构成本 → 解释特殊集团可排除获支持的措施 → 分析庆祝反映避免短期难堪的动机\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“列举未涉及的主要结构成本”。它也属于同一论题，但若直接放在这里，就会跳过“解释特殊集团可排除获支持的措施”这一必要环节；其段首“Among the changes it may fail to attempt are reforms affecting major personnel costs or the frequency of delivery.”需要的前提与F当前收束的对象不一致，后续也接不出G所需的\u003ccode>broad celebration\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45位于全文第7个位置，完整衔接是C → G → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This helps explain why a package can attract broad celebration while avoiding an option that would otherwise appear worth serious consideration.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Broad celebration may reflect relief rather than confidence in a transformed system.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Successful adaptation remains the larger task.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>broad celebration\u003c/code>，G继续处理这一对象，完成“分析庆祝反映避免短期难堪的动机”。到本段末尾，讨论又落到\u003ccode>successful adaptation\u003c/code>，这正好为下一段“以长期结构适应收束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释特殊集团可排除获支持的措施 → 分析庆祝反映避免短期难堪的动机 → 以长期结构适应收束\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“解释特殊集团可排除获支持的措施”。它也属于同一论题，但若直接放在这里，就会跳过“分析庆祝反映避免短期难堪的动机”这一必要环节；其段首“Political difficulty does not disappear when a seemingly sensible proposal gains public support.”需要的前提与C当前收束的对象不一致，后续也接不出H所需的\u003ccode>successful adaptation\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选G。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>adaptability to change\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>适应变化的能力\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：创新、开拓、与时俱进\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sustainable public services\u003c/td>\n\u003ctd>可持续公共服务\u003c/td>\n\u003ctd>社会现象类：生活质量\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>long-term planning\u003c/td>\n\u003ctd>长期规划\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>cooperation among stakeholders\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>利益相关方合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsible reform\u003c/td>\n\u003ctd>负责任的改革\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>efficient use of resources\u003c/td>\n\u003ctd>高效利用资源\u003c/td>\n\u003ctd>人生哲理类：勤俭节约\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>institutional innovation\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>制度创新\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：创新、开拓、与时俱进\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a broader perspective\u003c/td>\n\u003ctd>全局视野\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>commitment to improvement\u003c/td>\n\u003ctd>致力于改进\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A caught between changing demand and inflexible rules.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画显示A夹在变化的需求与僵化的规则之间。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>Several groups are defending familiar arrangements while the system struggles to adapt.\u003c/td>\n\u003ctd>多个群体在维护熟悉安排，而整个体系艰难适应变化。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene contrasts an immediate repair with a lasting solution.\u003c/td>\n\u003ctd>画面将即时修补与长久解决方案作对比。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Expenditure on A exceeded revenue for X consecutive years.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>A的支出连续X年超过收入。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The demand for A declined while the cost of maintaining it remained high.\u003c/td>\n\u003ctd>对A的需求下降，而维持A的费用仍然很高。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Personnel expenses accounted for X percent of total costs.\u003c/td>\n\u003ctd>人员支出占总成本的X%。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage describes a reform intended to relieve immediate financial pressure.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文介绍旨在缓解眼前财务压力的改革。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author welcomes limited progress but questions whether it addresses the underlying problem.\u003c/td>\n\u003ctd>作者认可有限进展，但质疑其是否触及根本问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion argues that A needs more than a temporary repair to adapt to a changing world.\u003c/td>\n\u003ctd>讨论认为A需要超越临时修补，才能适应变化的世界。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";

function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);

function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){

 });
}

 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
