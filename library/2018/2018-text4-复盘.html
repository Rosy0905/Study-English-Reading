const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| Postal Service | 邮政局 | continue | v.继续 | bleed red ink | 持续亏损 |\n| net loss | 净亏损 | fiscal | a.财政的 | straight year | 连续的年份 |\n| expense | n.支出 | exceed revenue | 超过收入 | meanwhile | ad.与此同时 |\n| unfunded liability | 无资金保障的负债 | employee health | 员工医疗 | retirement cost | 退休成本 |\n| formerly | ad.以前 | stable | a.稳定的 | federal institution | 联邦机构 |\n| bankruptcy | n.破产 | fundamentally | ad.从根本上说 | historic squeeze | 历史性困境 |\n| technological change | 技术变革 | permanently decrease | 永久性减少 | demand | n.需求 |\n| bread-and-butter product | 核心产品 | first-class mail | 一类邮件 | regulatory structure | 监管结构 |\n| deny | v.不给予 | management | n.管理层 | flexibility | n.灵活性 |\n| adjust operations | 调整运营 | new reality | 新现实 |  |  |","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 4重点词与语境","focus":[85,149,925,843],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html" ceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-3-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-3-0\">\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Now comes word that everyone involved – Democrats, Republicans, the Postal Service, the unions and the system&#39;s heaviest users – has finally agreed on a plan to fix the system. Legislation is moving through the House that would save USPS an estimated $28.6 billion over five years, which could help pay for new vehicles, among other survival measures. Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare. The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第3段","level":3,"raw":"### 意群划分 · 第3段\n\nNow comes word / that everyone involved – / Democrats, Republicans, / the Postal Service, / the unions / and the system's heaviest users – / has finally agreed / on a plan / to fix the system.\n\nLegislation is moving / through the House / that would save USPS / an estimated $28.6 billion / over five years, / which could help pay / for new vehicles, / among other survival measures.\n\nMost of the money / would come from / a penny-per-letter / permanent rate increase / and from shifting / postal retirees / into Medicare.\n\nThe latter step / would largely offset / the financial burden / of annually pre-funding / retiree health care, / thus addressing / a long-standing complaint / by the USPS and its unions.","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[85,1810,925,843],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativ no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency's costs. Also missing is any discussion of eliminating Saturday letter delivery. That common-sense change enjoys wide public support and would save the USPS $2 billion per year. But postal special-interest groups seem to have killed it, at least in the House. The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS. It is not, however, a sign that they're getting serious about transforming the postal system for the 21st century.","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,2662,925,1329],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-4-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform. There&#39;s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency&#39;s costs. Also missing is any discussion of eliminating Saturday letter delivery. That common-sense change enjoys wide public support and would save the USPS $2 billion per year. But postal special-interest groups seem to have killed it, at least in the House. The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS. It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群划分 · 第4段\n\nIf it clears the House, / this measure would still have to / get through the Senate – / where someone is bound to point out / that it amounts to / the bare, bare minimum / necessary to keep / the Postal Service afloat, / not comprehensive reform.\n\nThere's no change / to collective bargaining / at the USPS, / a major omission / considering that / personnel accounts for / 80 percent / of the agency's costs.\n\nAlso missing / is any discussion / of eliminating / Saturday letter delivery.\n\nThat common-sense change / enjoys wide public support / and would save / the USPS / $2 billion per year.\n\nBut postal special-interest groups / seem to have killed it, / at least in the House.\n\nThe emerging consensus / around the bill / is a sign / that legislators are getting frightened / about a politically embarrassing / short-term collapse / at the USPS.\n\nIt is not, however, / a sign / that they're getting serious / about transforming / the postal system / for the 21st century.","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,2662,925,1329],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-4-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform. There&#39;s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency&#39;s costs. Also missing is any discussion of eliminating Saturday letter delivery. That common-sense change enjoys wide public support and would save the USPS $2 billion per year. But postal special-interest groups seem to have killed it, at least in the House. The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS. It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>If it clears the House, / this measure would still have to / get through the Senate – / where someone is bound to point out / that it amounts to / the bare, bare minimum / necessary to keep / the Postal Service afloat, / not comprehensive reform.\u003c/p>\n\u003cp>There&#39;s no change / to collective bargaining / at the USPS, / a major omission / considering that / personnel accounts for / 80 percent / of the agency&#39;s costs.\u003c/p>\n\u003cp>Also missing / is any discussion / of eliminating / Saturday letter delivery.\u003c/p>\n\u003cp>That common-sense change / enjoys wide public support / and would save / the USPS / $2 billion per year.\u003c/p>\n\u003cp>But postal special-interest groups / seem to have killed it, / at least in the House.\u003c/p>\n\u003cp>The emerging consensus / around the bill / is a sign / that legislators are getting frightened / about a politically embarrassing / short-term collapse / at the USPS.\u003c/p>\n\u003cp>It is not, however, / a sign / that they&#39;re getting serious / about transforming / the postal system / for the 21st century.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 意群翻译 · 第4段\n\n如果它通过众议院，/ 这项措施仍然必须 / 通过参议院—— / 在那里肯定有人会指出 / 它只相当于 / 最低限度的最低限度 / 必要的来维持 / 邮政服务运转，/ 而非全面改革。\n\n没有改变 / 集体谈判 / 在USPS，/ 一个重大遗漏 / 考虑到 / 人员开支占 / 80% / 该机构成本的。\n\n同样缺失的 / 是任何讨论 / 关于取消 / 周六信件投递。\n\n这个常识性的改变 / 享有广泛的公众支持 / 并将节省 / USPS / 每年20亿美元。\n\n但邮政特殊利益集团 / 似乎已经扼杀了它，/ 至少在众议院。\n\n正在形成的共识 / 围绕该法案 / 是一个迹象 / 立法者正在害怕 / 关于政治上尴尬的 / 短期崩溃 / 在USPS。\n\n然而，它不是 / 一个迹象 / 他们正在认真对待 / 关于改造 / 邮政系统 / 为21世纪。","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,2662,925,1329],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-4-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-4-0\">\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform. There&#39;s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency&#39;s costs. Also missing is any discussion of eliminating Saturday letter delivery. That common-sense change enjoys wide public support and would save the USPS $2 billion per year. But postal special-interest groups seem to have killed it, at least in the House. The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS. It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-1\">\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>If it clears the House, / this measure would still have to / get through the Senate – / where someone is bound to point out / that it amounts to / the bare, bare minimum / necessary to keep / the Postal Service afloat, / not comprehensive reform.\u003c/p>\n\u003cp>There&#39;s no change / to collective bargaining / at the USPS, / a major omission / considering that / personnel accounts for / 80 percent / of the agency&#39;s costs.\u003c/p>\n\u003cp>Also missing / is any discussion / of eliminating / Saturday letter delivery.\u003c/p>\n\u003cp>That common-sense change / enjoys wide public support / and would save / the USPS / $2 billion per year.\u003c/p>\n\u003cp>But postal special-interest groups / seem to have killed it, / at least in the House.\u003c/p>\n\u003cp>The emerging consensus / around the bill / is a sign / that legislators are getting frightened / about a politically embarrassing / short-term collapse / at the USPS.\u003c/p>\n\u003cp>It is not, however, / a sign / that they&#39;re getting serious / about transforming / the postal system / for the 21st century.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-4-2\">\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>如果它通过众议院，/ 这项措施仍然必须 / 通过参议院—— / 在那里肯定有人会指出 / 它只相当于 / 最低限度的最低限度 / 必要的来维持 / 邮政服务运转，/ 而非全面改革。\u003c/p>\n\u003cp>没有改变 / 集体谈判 / 在USPS，/ 一个重大遗漏 / 考虑到 / 人员开支占 / 80% / 该机构成本的。\u003c/p>\n\u003cp>同样缺失的 / 是任何讨论 / 关于取消 / 周六信件投递。\u003c/p>\n\u003cp>这个常识性的改变 / 享有广泛的公众支持 / 并将节省 / USPS / 每年20亿美元。\u003c/p>\n\u003cp>但邮政特殊利益集团 / 似乎已经扼杀了它，/ 至少在众议院。\u003c/p>\n\u003cp>正在形成的共识 / 围绕该法案 / 是一个迹象 / 立法者正在害怕 / 关于政治上尴尬的 / 短期崩溃 / 在USPS。\u003c/p>\n\u003cp>然而，它不是 / 一个迹象 / 他们正在认真对待 / 关于改造 / 邮政系统 / 为21世纪。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第4段","level":3,"raw":"### 标准译文 · 第4段\n\n如果该措施通过众议院，仍需通过参议院——在那里肯定有人会指出，这只是维持邮政服务运转的最低限度措施，而非全面改革。USPS的集体谈判没有任何改变，考虑到人员成本占该机构成本的80%，这是一个重大遗漏。同样缺失的是关于取消周六信件投递的任何讨论。这个常识性的改变享有广泛的公众支持，每年可为USPS节省20亿美元。但邮政特殊利益集团似乎已经扼杀了它，至少在众议院是这样。围绕该法案形成的共识表明，立法者正在害怕USPS出现政治上尴尬的短期崩溃。然而，这并不表明他们正在认真对待为21世纪改造邮政系统。","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[85,2662,925,1329],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-4-3","html":"\u003csection n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n"},{"section":"第二鸟 · 精读与翻译","title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n### 第1段\n\nThe U.S. Postal Service (USPS) → continues to bleed red ink.\n\nIt reported → a net loss of $5.6 billion：(for fiscal 2016)：(the 10th straight year：(its expenses have exceeded revenue)).\n\nMeanwhile → it has more than $120 billion：(in unfunded liabilities)：(mostly for employee health + retirement costs).\n\nThere are many reasons：(this formerly stable federal institution → finds itself：(at the brink of bankruptcy)).\n\nFundamentally → the USPS is in a historic squeeze：(between technological change：(that has permanently decreased demand：(for its bread-and-butter product：(first-class mail))) + a regulatory structure：(that denies management → the flexibility：(to adjust its operations：(to the new reality)))).\n\n### 第2段\n\nAnd interest groups：(ranging from postal unions → to greeting-card makers) → exert self-interested pressure：(on the USPS's ultimate overseer – Congress)：(insisting that：(whatever else happens：(to the Postal Service) → aspects of the status quo：(they depend on) → get protected)).\n\nThis is why → repeated attempts：(at reform legislation) → have failed：(in recent years) → leaving the Postal Service：(unable to pay its bills：(except by deferring：(vital modernization))).\n\n### 第3段\n\nNow comes word：(that everyone involved – Democrats + Republicans + the Postal Service + the unions + the system's heaviest users – → has finally agreed：(on a plan：(to fix the system))).\n\nLegislation is moving：(through the House)：(that would save USPS → an estimated $28.6 billion：(over five years))：(which could help pay：(for new vehicles)：(among other survival measures)).\n\nMost of the money → would come from：(a penny-per-letter：(permanent rate increase) + shifting：(postal retirees：(into Medicare))).\n\nThe latter step → would largely offset → the financial burden：(of annually pre-funding：(retiree health care)) → thus addressing → a long-standing complaint：(by the USPS and its unions).\n\n### 第4段\n\nIf it clears the House → this measure would still have to → get through the Senate：(where someone is bound to point out：(that it amounts to → the bare, bare minimum：(necessary to keep → the Postal Service afloat) // not comprehensive reform)).\n\nThere's no change：(to collective bargaining：(at the USPS)) → a major omission：(considering that：(personnel accounts for → 80 percent：(of the agency's costs))).\n\nAlso missing → is any discussion：(of eliminating：(Saturday letter delivery)).\n\nThat common-sense change → enjoys wide public support + would save → the USPS → $2 billion per year.\n\nBut postal special-interest groups → seem to have killed it：(at least in the House).\n\nThe emerging consensus：(around the bill) → is a sign：(that legislators are getting frightened：(about a politically embarrassing：(short-term collapse：(at the USPS)))).\n\nIt is not, however → a sign：(that they're getting serious：(about transforming：(the postal system：(for the 21st century)))).","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>The U.S. Postal Service (USPS) → continues to bleed red ink.\u003c/p>\n\u003cp>It reported → a net loss of $5.6 billion：(for fiscal 2016)：(the 10th straight year：(its expenses have exceeded revenue)).\u003c/p>\n\u003cp>Meanwhile → it has more than $120 billion：(in unfunded liabilities)：(mostly for employee health + retirement costs).\u003c/p>\n\u003cp>There are many reasons：(this formerly stable federal institution → finds itself：(at the brink of bankruptcy)).\u003c/p>\n\u003cp>Fundamentally → the USPS is in a historic squeeze：(between technological change：(that has permanently decreased demand：(for its bread-and-butter product：(first-class mail))) + a regulatory structure：(that denies management → the flexibility：(to adjust its operations：(to the new reality)))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>And interest groups：(ranging from postal unions → to greeting-card makers) → exert self-interested pressure：(on the USPS&#39;s ultimate overseer – Congress)：(insisting that：(whatever else happens：(to the Postal Service) → aspects of the status quo：(they depend on) → get protected)).\u003c/p>\n\u003cp>This is why → repeated attempts：(at reform legislation) → have failed：(in recent years) → leaving the Postal Service：(unable to pay its bills：(except by deferring：(vital modernization))).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Now comes word：(that everyone involved – Democrats + Republicans + the Postal Service + the unions + the system&#39;s heaviest users – → has finally agreed：(on a plan：(to fix the system))).\u003c/p>\n\u003cp>Legislation is moving：(through the House)：(that would save USPS → an estimated $28.6 billion：(over five years))：(which could help pay：(for new vehicles)：(among other survival measures)).\u003c/p>\n\u003cp>Most of the money → would come from：(a penny-per-letter：(permanent rate increase) + shifting：(postal retirees：(into Medicare))).\u003c/p>\n\u003cp>The latter step → would largely offset → the financial burden：(of annually pre-funding：(retiree health care)) → thus addressing → a long-standing complaint：(by the USPS and its unions).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>If it clears the House → this measure would still have to → get through the Senate：(where someone is bound to point out：(that it amounts to → the bare, bare minimum：(necessary to keep → the Postal Service afloat) // not comprehensive reform)).\u003c/p>\n\u003cp>There&#39;s no change：(to collective bargaining：(at the USPS)) → a major omission：(considering that：(personnel accounts for → 80 percent：(of the agency&#39;s costs))).\u003c/p>\n\u003cp>Also missing → is any discussion：(of eliminating：(Saturday letter delivery)).\u003c/p>\n\u003cp>That common-sense change → enjoys wide public support + would save → the USPS → $2 billion per year.\u003c/p>\n\u003cp>But postal special-interest groups → seem to have killed it：(at least in the House).\u003c/p>\n\u003cp>The emerging consensus：(around the bill) → is a sign：(that legislators are getting frightened：(about a politically embarrassing：(short-term collapse：(at the USPS)))).\u003c/p>\n\u003cp>It is not, however → a sign：(that they&#39;re getting serious：(about transforming：(the postal system：(for the 21st century)))).\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n美国邮政服务（USPS）→ 继续流血赤字。\n\n它报告了 → 56亿美元的净亏损：(在2016财年)：(连续第10年：(其支出超过收入))。\n\n与此同时 → 它有超过1200亿美元：(未备资金的负债)：(主要用于员工健康 + 退休成本)。\n\n有许多原因：(这个曾经稳定的联邦机构 → 发现自己：(处于破产边缘))。\n\n从根本上说 → USPS处于历史性的夹缝中：(在技术变革之间：(这已经永久性地减少了需求：(对其核心产品：(一类邮件))) + 监管结构：(这拒绝给管理层 → 灵活性：(来调整其运营：(以适应新现实))))。\n\n### 第2段\n\n而利益集团：(从邮政工会 → 到贺卡制造商) → 施加自私的压力：(对USPS的最终监督者——国会)：(坚持：(无论发生什么：(对邮政服务) → 现状的方面：(他们所依赖的) → 得到保护))。\n\n这就是为什么 → 反复的尝试：(改革立法的) → 已经失败：(在最近几年) → 使邮政服务：(无法支付账单：(除了通过推迟：(重要的现代化)))。\n\n### 第3段\n\n现在传来消息：(所有相关方——民主党人 + 共和党人 + 邮政服务 + 工会 + 系统的主要用户—— → 终于达成一致：(关于一个计划：(来修复这个系统)))。\n\n立法正在推进：(通过众议院)：(这将为USPS节省 → 估计286亿美元：(在五年内))：(这可以帮助支付：(新车辆)：(以及其他生存措施))。\n\n大部分资金 → 将来自：(每封信一美分的：(永久性费率上涨) + 将：(邮政退休人员：(转入医疗保险)))。\n\n后一步骤 → 将大大抵消 → 财务负担：(每年预先资助：(退休人员医疗保健的)) → 从而解决 → 一个长期的投诉：(由USPS及其工会提出的)。\n\n### 第4段\n\n如果它通过众议院 → 这项措施仍然必须 → 通过参议院：(在那里肯定有人会指出：(它只相当于 → 最低限度的最低限度：(必要的来维持 → 邮政服务运转) // 而非全面改革))。\n\n没有改变：(集体谈判：(在USPS)) → 一个重大遗漏：(考虑到：(人员开支占 → 80%：(该机构成本的)))。\n\n同样缺失的 → 是任何讨论：(关于取消：(周六信件投递))。\n\n这个常识性的改变 → 享有广泛的公众支持 + 将节省 → USPS → 每年20亿美元。\n\n但邮政特殊利益集团 → 似乎已经扼杀了它：(至少在众议院)。\n\n正在形成的共识：(围绕该法案) → 是一个迹象：(立法者正在害怕：(关于政治上尴尬的：(短期崩溃：(在USPS))))。\n\n然而，它不是 → 一个迹象：(他们正在认真对待：(关于改造：(邮政系统：(为21世纪))))。","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003c  through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-1\">\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>If it clears the House, / this measure would still have to / get through the Senate – / where someone is bound to point out / that it amounts to / the bare, bare minimum / necessary to keep / the Postal Service afloat, / not comprehensive reform.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-2\">\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>如果它通过众议院，/ 这项措施仍然必须 / 通过参议院—— / 在那里肯定有人会指出 / 它只相当于 / 最低限度的最低限度 / 必要的来维持 / 邮政服务运转，/ 而非全面改革。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-3\">\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把两个院的程序先后合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>即便通过众议院，该措施仍须通过参议院\u003c/p>\n\u003c/blockquote>\n\u003cp>再把where之后对措施力度的评价合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>有人必会指出，它只是维持邮政服务的最低限度补救，而非全面改革\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>即便通过众议院，该措施仍须通过参议院；有人必会指出，它只是维持邮政服务的最低限度补救，而非全面改革。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-4\">\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>措施还须过参议院，并会被指出只是最低限度补救。\u003c/p>\n\u003c/blockquote>\n\u003cp>if条件先放在句首；where在此接参议院中的议论；bare, bare minimum的重复保留为强烈的最低限度。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>如果这项措施通过众议院，它还必须通过参议院；在那里，一定有人会指出，这只是让邮政服务维持运转所必需的最低限度办法，并不是全面改革。\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-long-3-5\">\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>keep afloat按企业维持运转译，不写成已经让邮政扭亏为盈。\u003c/p>\n\u003cp>not comprehensive reform限定法案的不足，不等于作者认为它一无用处。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>如果该措施通过众议院，仍需通过参议院——在那里肯定有人会指出，这只是维持邮政服务运转的最低限度措施，而非全面改革。\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"raw":"# 3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\n\n其中三个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"40题 · 题干、题型与核心出处","level":2,"raw":"## 40题\n\n**Which of the following would be the best title for the text?**\n\n下面哪个最适合作为文章的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **The USPS Starts to Miss Its Good Old Days**\n\nUSPS开始怀念过去的好日子\n\nB. **The Postal Service: Keep Away from My Cheese**\n\n邮政局：别动我的奶酪\n\nC. **The USPS: Chronic Illness Requires a Quick Cure**\n\nUSPS：慢性病需要速治\n\nD. **The Postal Service Needs More than a Band-Aid**\n\n邮政局需要的不只是一块创可贴\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。 | 先摆出眼前的难题 |\n| 2 | 写利益群体坚持维护现状，对国会形成压力，使改革立法反复失败，现代化也受到拖累。 | 再说为什么一直没有解决 |\n| 3 | 介绍各方终于同意的方案，包括提高每封信邮费、转移医疗承担，以及五年节省资金等预计效果。 | 接着摆出一个看似可行的办法 |\n| 4 | 指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。 | 最后说这样还是不够 |","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"question":"40","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪个最适合作为文章的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>The USPS Starts to Miss Its Good Old Days\u003c/strong>\u003c/p>\n\u003cp>USPS开始怀念过去的好日子\u003c/p>\n\u003cp>B. \u003cstrong>The Postal Service: Keep Away from My Cheese\u003c/strong>\u003c/p>\n\u003cp>邮政局：别动我的奶酪\u003c/p>\n\u003cp>C. \u003cstrong>The USPS: Chronic Illness Requires a Quick Cure\u003c/strong>\u003c/p>\n\u003cp>USPS：慢性病需要速治\u003c/p>\n\u003cp>D. \u003cstrong>The Postal Service Needs More than a Band-Aid\u003c/strong>\u003c/p>\n\u003cp>邮政局需要的不只是一块创可贴\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。\u003c/td>\n\u003ctd>先摆出眼前的难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>写利益群体坚持维护现状，对国会形成压力，使改革立法反复失败，现代化也受到拖累。\u003c/td>\n\u003ctd>再说为什么一直没有解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>介绍各方终于同意的方案，包括提高每封信邮费、转移医疗承担，以及五年节省资金等预计效果。\u003c/td>\n\u003ctd>接着摆出一个看似可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。\u003c/td>\n\u003ctd>最后说这样还是不够\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. The USPS Starts to Miss Its Good Old Days","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### A. The USPS Starts to Miss Its Good Old Days\n\nUSPS开始怀念过去的好日子","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"A"},"focusId":"focus-q40-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>USPS开始怀念过去的好日子\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. The USPS Starts to Miss Its Good Old Days","level":3,"raw":"#### 如果 A 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\nUSPS开始怀念过去的好日子\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 以邮政当前亏损为难题，突出它开始怀念昔日稳定繁荣。 | 先摆出眼前的难题 |\n| 2 | 说明过去支持邮政的条件为何消失，使怀旧与现实之间迟迟无法调和。 | 再说为什么一直没有解决 |\n| 3 | 介绍一种仿效旧时代运营方式、恢复昔日好景的办法。 | 接着摆出一个看似可行的办法 |\n| 4 | 指出这办法仍不能带回从前，从而收束邮政对旧日的怀念。 | 最后说这样还是不够 |\n\nA中的Good Old Days能让人想到首段formerly stable，但那三个词只是把过去稳定与如今困难作一个背景对照。后面作者并没有叙述过去服务有多好、员工有多自豪，或邮政局现在怎样怀念旧日生活；第2段在讲改革为什么被阻挡，第3段介绍新方案，第4段批评方案没有真正面向21世纪。文章的方向是应该怎样改变，而不是邮政局的怀旧心理。A把开头的一处时间对照扩大成感伤主题，无法解释中后段具体的立法措施和作者对改革力度的判断。\n\n首段说机构原本稳定，就足以让三段改革讨论变成邮政局怀念过去的故事吗？\n\n不能。作者用过去作对照，是为了说明眼前需要改变，不是在描述怀旧情绪。\n\nA需要全文沿着“怀念往日”走，实际全文却沿着“困难—阻力—方案—仍然不足”往前推进。\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"A"},"focusId":"focus-q40-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>USPS开始怀念过去的好日子\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-A-1\">\u003ch4>如果 A 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>USPS开始怀念过去的好日子\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以邮政当前亏损为难题，突出它开始怀念昔日稳定繁荣。\u003c/td>\n\u003ctd>先摆出眼前的难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明过去支持邮政的条件为何消失，使怀旧与现实之间迟迟无法调和。\u003c/td>\n\u003ctd>再说为什么一直没有解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>介绍一种仿效旧时代运营方式、恢复昔日好景的办法。\u003c/td>\n\u003ctd>接着摆出一个看似可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出这办法仍不能带回从前，从而收束邮政对旧日的怀念。\u003c/td>\n\u003ctd>最后说这样还是不够\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A中的Good Old Days能让人想到首段formerly stable，但那三个词只是把过去稳定与如今困难作一个背景对照。后面作者并没有叙述过去服务有多好、员工有多自豪，或邮政局现在怎样怀念旧日生活；第2段在讲改革为什么被阻挡，第3段介绍新方案，第4段批评方案没有真正面向21世纪。文章的方向是应该怎样改变，而不是邮政局的怀旧心理。A把开头的一处时间对照扩大成感伤主题，无法解释中后段具体的立法措施和作者对改革力度的判断。\u003c/p>\n\u003cp>首段说机构原本稳定，就足以让三段改革讨论变成邮政局怀念过去的故事吗？\u003c/p>\n\u003cp>不能。作者用过去作对照，是为了说明眼前需要改变，不是在描述怀旧情绪。\u003c/p>\n\u003cp>A需要全文沿着“怀念往日”走，实际全文却沿着“困难—阻力—方案—仍然不足”往前推进。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. The Postal Service: Keep Away from My Cheese","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### B. The Postal Service: Keep Away from My Cheese\n\n邮政局：别动我的奶酪","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"B"},"focusId":"focus-q40-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>邮政局：别动我的奶酪\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. The Postal Service: Keep Away from My Cheese","level":3,"raw":"#### 如果 B 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\n邮政局：别动我的奶酪\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 把邮政改革困境表现为各利益方不肯让人动自己利益的冲突。 | 先摆出眼前的难题 |\n| 2 | 说明保护各自份额的群体为何不断阻碍改革，维持旧有利益。 | 再说为什么一直没有解决 |\n| 3 | 介绍一个试图不触碰各方既得利益而达成的折中方案。 | 接着摆出一个看似可行的办法 |\n| 4 | 指出只求别动各人的利益仍不能解决问题，把中心落回利益保护造成的阻滞。 | 最后说这样还是不够 |\n\nB的Keep Away from My Cheese用“别动我的奶酪”表现守住既有利益，确实能接上第2段的status quo they depend on get protected，也能接到末段特殊利益群体挡下周六投递改变。因此它比怀旧题材更贴近文章的一部分。但作者还用整段介绍达成一致的法案和省钱安排，最后的核心判断是这些办法只够维持最低限度，不能替代真正改造。利益群体是改革为什么难的原因之一，不是全文唯一的被讨论对象。若B统领全文，第三段措施的作用会只剩下“保护奶酪”，而实际作者承认它能改善资金，只是认为远远不够。\n\n维护既有利益能解释改革阻力，但能否独自覆盖作者对新方案“有作用却仍不足”的完整评价？\n\n不能。它抓住了一个重要原因，却没有说出本文最后落下的改革要求。\n\nB用局部阻力替代对整个改革方案的判断，容易读到第2段便停住，而忽略第3、4段之间先介绍再批评的推进。\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"B"},"focusId":"focus-q40-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>邮政局：别动我的奶酪\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-B-1\">\u003ch4>如果 B 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>邮政局：别动我的奶酪\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>把邮政改革困境表现为各利益方不肯让人动自己利益的冲突。\u003c/td>\n\u003ctd>先摆出眼前的难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明保护各自份额的群体为何不断阻碍改革，维持旧有利益。\u003c/td>\n\u003ctd>再说为什么一直没有解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>介绍一个试图不触碰各方既得利益而达成的折中方案。\u003c/td>\n\u003ctd>接着摆出一个看似可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出只求别动各人的利益仍不能解决问题，把中心落回利益保护造成的阻滞。\u003c/td>\n\u003ctd>最后说这样还是不够\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的Keep Away from My Cheese用“别动我的奶酪”表现守住既有利益，确实能接上第2段的status quo they depend on get protected，也能接到末段特殊利益群体挡下周六投递改变。因此它比怀旧题材更贴近文章的一部分。但作者还用整段介绍达成一致的法案和省钱安排，最后的核心判断是这些办法只够维持最低限度，不能替代真正改造。利益群体是改革为什么难的原因之一，不是全文唯一的被讨论对象。若B统领全文，第三段措施的作用会只剩下“保护奶酪”，而实际作者承认它能改善资金，只是认为远远不够。\u003c/p>\n\u003cp>维护既有利益能解释改革阻力，但能否独自覆盖作者对新方案“有作用却仍不足”的完整评价？\u003c/p>\n\u003cp>不能。它抓住了一个重要原因，却没有说出本文最后落下的改革要求。\u003c/p>\n\u003cp>B用局部阻力替代对整个改革方案的判断，容易读到第2段便停住，而忽略第3、4段之间先介绍再批评的推进。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. The USPS: Chronic Illness Requires a Quick Cure","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### C. The USPS: Chronic Illness Requires a Quick Cure\n\nUSPS：慢性病需要速治","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"C"},"focusId":"focus-q40-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>USPS：慢性病需要速治\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. The USPS: Chronic Illness Requires a Quick Cure","level":3,"raw":"#### 如果 C 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\nUSPS：慢性病需要速治\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 把长期亏损比作慢性病，强调邮政当下急需快速治疗。 | 先摆出眼前的难题 |\n| 2 | 说明反复拖延的原因，以拖延代价强化迅速干预的必要性。 | 再说为什么一直没有解决 |\n| 3 | 摆出能够立即推进的方案，论证它为什么有望迅速缓解病情。 | 接着摆出一个看似可行的办法 |\n| 4 | 指出现有速度和力度仍不够，要求进一步加快治疗以免慢病恶化。 | 最后说这样还是不够 |\n\nC的Chronic Illness能接上首段连续十年收支失衡，但Quick Cure把解决方向落在迅速治好。实际第3段已经有一项旨在维持生存、改善近期财务的方案，第4段却批评它只是bare, bare minimum，并非足以改造邮政体系。作者不是嫌这种短期办法动作不够快，主要是嫌它动得不够深、关键安排没有改变。末句将short-term与for the 21st century放在对照里，更说明眼前解围与长期转型不是同一件事。C只讲迅速，反而容易把作者认为不能满足的急救办法读成他所追求的终点。\n\n作者嫌方案只够眼前最低限度，这个判断主要是在要求更快治，还是要求不止于眼前修补？\n\n后者。关键是改革的深度和范围，而不是单纯速度。\n\nC正确识别困难长期存在，却把作者所要求的改革性质换成了速效处理，不能保留末段的主要对照。\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"C"},"focusId":"focus-q40-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>USPS：慢性病需要速治\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-C-1\">\u003ch4>如果 C 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>USPS：慢性病需要速治\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>把长期亏损比作慢性病，强调邮政当下急需快速治疗。\u003c/td>\n\u003ctd>先摆出眼前的难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明反复拖延的原因，以拖延代价强化迅速干预的必要性。\u003c/td>\n\u003ctd>再说为什么一直没有解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>摆出能够立即推进的方案，论证它为什么有望迅速缓解病情。\u003c/td>\n\u003ctd>接着摆出一个看似可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出现有速度和力度仍不够，要求进一步加快治疗以免慢病恶化。\u003c/td>\n\u003ctd>最后说这样还是不够\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C的Chronic Illness能接上首段连续十年收支失衡，但Quick Cure把解决方向落在迅速治好。实际第3段已经有一项旨在维持生存、改善近期财务的方案，第4段却批评它只是bare, bare minimum，并非足以改造邮政体系。作者不是嫌这种短期办法动作不够快，主要是嫌它动得不够深、关键安排没有改变。末句将short-term与for the 21st century放在对照里，更说明眼前解围与长期转型不是同一件事。C只讲迅速，反而容易把作者认为不能满足的急救办法读成他所追求的终点。\u003c/p>\n\u003cp>作者嫌方案只够眼前最低限度，这个判断主要是在要求更快治，还是要求不止于眼前修补？\u003c/p>\n\u003cp>后者。关键是改革的深度和范围，而不是单纯速度。\u003c/p>\n\u003cp>C正确识别困难长期存在，却把作者所要求的改革性质换成了速效处理，不能保留末段的主要对照。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. The Postal Service Needs More than a Band-Aid","level":3,"raw":"**Which of the following would be the best title for the text?**\n\n### D. The Postal Service Needs More than a Band-Aid\n\n邮政局需要的不只是一块创可贴","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"D"},"focusId":"focus-q40-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. The Postal Service Needs More than a Band-Aid","level":3,"raw":"#### 如果 D 是主旨，文章4段应该怎么写？\n\n如果全文主旨真的是：\n\n邮政局需要的不只是一块创可贴\n\n那文章4段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 列出亏损与结构性困境，说明问题不只是眼前的资金缺口。 | 先摆出眼前的难题 |\n| 2 | 解释利益群体保现状如何阻挡改革，使深层运营问题长期得不到解决。 | 再说为什么一直没有解决 |\n| 3 | 介绍涨价和退休医疗安排，承认它们能提供实际但有限的财务缓解。 | 接着摆出一个看似可行的办法 |\n| 4 | 指出最低限度救急未改人员成本和投递安排，要求超越创可贴式修补的全面改革。 | 最后说这样还是不够 |\n\nD的Band-Aid先按字面读作创可贴，代回文章是在比喻只能短期缓解的修补。Needs More than没有否认眼前方案能省钱，而是说不止需要这些：第3段的资金效果可以保留，第4段的最低限度、未改变事项和未讨论事项也都能接上。首段给出长期财务与运营结构的难题，第2段给出改革阻力，因此最后要求的不可能只是一项临时补账办法。D比B多保留了对新方案的评价，又比C准确地区分“快一点”和“改得更充分”。\n\n把现有方案看成有帮助但远远不够的修补，是否能够贯通困难、阻力、方案和最后的批评？\n\n能够。D同时容纳方案的有限作用和作者对更充分改革的要求。\n\n这个标题不需要抹掉第3段的正面数字，也不需要弱化第4段的否定。More than正好把“已经做了一点”与“仍需要更多”接在一起。\n\n判断：\n\n**D 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"D"},"focusId":"focus-q40-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-D-1\">\u003ch4>如果 D 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>邮政局需要的不只是一块创可贴\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>列出亏损与结构性困境，说明问题不只是眼前的资金缺口。\u003c/td>\n\u003ctd>先摆出眼前的难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释利益群体保现状如何阻挡改革，使深层运营问题长期得不到解决。\u003c/td>\n\u003ctd>再说为什么一直没有解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>介绍涨价和退休医疗安排，承认它们能提供实际但有限的财务缓解。\u003c/td>\n\u003ctd>接着摆出一个看似可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出最低限度救急未改人员成本和投递安排，要求超越创可贴式修补的全面改革。\u003c/td>\n\u003ctd>最后说这样还是不够\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D的Band-Aid先按字面读作创可贴，代回文章是在比喻只能短期缓解的修补。Needs More than没有否认眼前方案能省钱，而是说不止需要这些：第3段的资金效果可以保留，第4段的最低限度、未改变事项和未讨论事项也都能接上。首段给出长期财务与运营结构的难题，第2段给出改革阻力，因此最后要求的不可能只是一项临时补账办法。D比B多保留了对新方案的评价，又比C准确地区分“快一点”和“改得更充分”。\u003c/p>\n\u003cp>把现有方案看成有帮助但远远不够的修补，是否能够贯通困难、阻力、方案和最后的批评？\u003c/p>\n\u003cp>能够。D同时容纳方案的有限作用和作者对更充分改革的要求。\u003c/p>\n\u003cp>这个标题不需要抹掉第3段的正面数字，也不需要弱化第4段的否定。More than正好把“已经做了一点”与“仍需要更多”接在一起。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"40题结论","level":2,"raw":"### 40题结论\n\n**40. D. The Postal Service Needs More than a Band-Aid**\n\n这句话就是本文后续做题的主旨底牌：\n\n**The Postal Service Needs More than a Band-Aid / 邮政局需要的不只是一块创可贴**","context":{"mode":"image","asset":"questions","focus":[250,2366,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"question":"40","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>40. D. The Postal Service Needs More than a Band-Aid\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>The Postal Service Needs More than a Band-Aid / 邮政局需要的不只是一块创可贴\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"36题 · 题干、题型与核心出处","level":2,"raw":"## 36题\n\n> The financial problem with the USPS is caused partly by ______.  \n> USPS的财务问题，部分是由什么造成的？\n\n### 题型\n\n原因细节题。题干要求判断“USPS的财务问题，部分是由什么造成的？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> The U.S. Postal Service (USPS) continues to bleed red ink. It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue. Meanwhile, it has more than $120 billion in unfunded liabilities, mostly for employee health and retirement costs. There are many reasons this formerly stable federal institution finds itself at the brink of bankruptcy. Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\n\n首段先报告连续亏损与负债，再用Fundamentally解释两面夹击：技术使需求下降，监管结构又不许管理层灵活调整。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"question":"36","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The financial problem with the USPS is caused partly by ______.\u003cbr>USPS的财务问题，部分是由什么造成的？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“USPS的财务问题，部分是由什么造成的？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The U.S. Postal Service (USPS) continues to bleed red ink. It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue. Meanwhile, it has more than $120 billion in unfunded liabilities, mostly for employee health and retirement costs. There are many reasons this formerly stable federal institution finds itself at the brink of bankruptcy. Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003cp>首段先报告连续亏损与负债，再用Fundamentally解释两面夹击：技术使需求下降，监管结构又不许管理层灵活调整。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. its unbalanced budget","level":3,"raw":"### A. its unbalanced budget\n\n> 其失衡的预算\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“its [xxx] budget”，保留了相应遮挡。当时的定位线索是：A的budget涉及收支安排，第1段its expenses have exceeded revenue也谈支出和收入，因此先回看开头的财务描述，再看Fundamentally之后的原因说明，别先替budget前面的词定意思。读完全文后，做题模式再经交叉验证排除A，最终选择B。\n\n**错误类型：第一类——歪曲原意。**\n\n第1段列支出超过收入，确实描述了收支不平衡的财务结果。但题干问问题部分由什么造成，不能把亏损这个表现直接当成作者给出的原因。\n\nA把财务表现改写成unbalanced budget，缺少原文明确给出的因果说明。报告已经亏损，不等于说制定失衡预算是导致亏损的原因；B保留了监管结构妨碍调整这一解释。\n\n**命题人借用的原文材料：**\n\n> It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.\n>\n> Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.","context":{"mode":"image","asset":"questions","focus":[250,338,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"36","option":"A"},"focusId":"focus-q36-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-A-0\">\u003cblockquote>\n\u003cp>其失衡的预算\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“its [xxx] budget”，保留了相应遮挡。当时的定位线索是：A的budget涉及收支安排，第1段its expenses have exceeded revenue也谈支出和收入，因此先回看开头的财务描述，再看Fundamentally之后的原因说明，别先替budget前面的词定意思。读完全文后，做题模式再经交叉验证排除A，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>第1段列支出超过收入，确实描述了收支不平衡的财务结果。但题干问问题部分由什么造成，不能把亏损这个表现直接当成作者给出的原因。\u003c/p>\n\u003cp>A把财务表现改写成unbalanced budget，缺少原文明确给出的因果说明。报告已经亏损，不等于说制定失衡预算是导致亏损的原因；B保留了监管结构妨碍调整这一解释。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.\u003c/p>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. its unbalanced budget","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> USPS的财务问题部分由其失衡的预算造成。\n\nA的budget涉及收支安排，第1段its expenses have exceeded revenue也谈支出和收入，因此先回看开头的财务描述，再看Fundamentally之后的原因说明，别先替budget前面的词定意思。\n\n第1段列支出超过收入，确实描述了收支不平衡的财务结果。但题干问问题部分由什么造成，不能把亏损这个表现直接当成作者给出的原因。\n\nFundamentally引出双重挤压：技术变化减少核心邮件需求，监管结构又不给管理层调整运营的灵活性。B的rigid management对应后一个制度限制，并非责怪管理者个人态度僵硬。\n\nA把财务表现改写成unbalanced budget，缺少原文明确给出的因果说明。报告已经亏损，不等于说制定失衡预算是导致亏损的原因；B保留了监管结构妨碍调整这一解释。","context":{"mode":"image","asset":"questions","focus":[250,338,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"36","option":"A"},"focusId":"focus-q36-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-A-0\">\u003cblockquote>\n\u003cp>其失衡的预算\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“its [xxx] budget”，保留了相应遮挡。当时的定位线索是：A的budget涉及收支安排，第1段its expenses have exceeded revenue也谈支出和收入，因此先回看开头的财务描述，再看Fundamentally之后的原因说明，别先替budget前面的词定意思。读完全文后，做题模式再经交叉验证排除A，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>第1段列支出超过收入，确实描述了收支不平衡的财务结果。但题干问问题部分由什么造成，不能把亏损这个表现直接当成作者给出的原因。\u003c/p>\n\u003cp>A把财务表现改写成unbalanced budget，缺少原文明确给出的因果说明。报告已经亏损，不等于说制定失衡预算是导致亏损的原因；B保留了监管结构妨碍调整这一解释。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.\u003c/p>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003 as permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003cp>首段先报告连续亏损与负债，再用Fundamentally解释两面夹击：技术使需求下降，监管结构又不许管理层灵活调整。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The USPS is in difficulty because it had an unbalanced budget.\u003c/p>\n\u003cp>USPS陷入困境是因为它存在收支不平衡的预算。\u003c/p>\n\u003c/blockquote>\n\u003cp>支出超过收入说明实际亏损，不等于预算编制失衡已被证明为原因。原段在Fundamentally后转向需求与调整机制，不能把结果再写成原因。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. its unbalanced budget","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> The Postal Service Needs More than a Band-Aid  \n> 邮政局需要的不只是一块创可贴\n\n把这个主旨直接代入36题题干：\n\n> 主旨认为短期补钱不够，本题应区分账目困境与导致困境的制度原因。僵化如何阻碍适应，要由denies management the flexibility坐实。\n\nA实际说的是：\n\n> its unbalanced budget  \n> 其失衡的预算\n\nA把财务表现改写成unbalanced budget，缺少原文明确给出的因果说明。报告已经亏损，不等于说制定失衡预算是导致亏损的原因；B保留了监管结构妨碍调整这一解释。\n\n从全文推进看，这一处的作用是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,338,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"36","option":"A"},"focusId":"focus-q36-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-A-0\">\u003cblockquote>\n\u003cp>其失衡的预算\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“its [xxx] budget”，保留了相应遮挡。当时的定位线索是：A的budget涉及收支安排，第1段its expenses have exceeded revenue也谈支出和收入，因此先回看开头的财务描述，再看Fundamentally之后的原因说明，别先替budget前面的词定意思。读完全文后，做题模式再经交叉验证排除A，最终选择B。\u003c/p>\n\u003cp>\u >\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨认为短期补钱不够，本题应区分账目困境与导致困境的制度原因。僵化如何阻碍适应，要由denies management the flexibility坐实。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>its rigid management\u003cbr>其僵化的管理\u003c/p>\n\u003c/blockquote>\n\u003cp>B保留了管理与运营调整之间的关系，也符合题干只问部分原因的范围。不能把“结构限制管理”误读成与管理僵化毫无关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. the cost for technical upgrading","level":3,"raw":"### C. the cost for technical upgrading\n\n> 技术升级的成本\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C的cost for technical upgrading与第1段technological change都提到技术，但原文紧接permanently decreased demand说需求变化，因此回看技术在原因链里改变的是支出还是需求。\n\n**错误类型：第一类——歪曲原意。**\n\npermanently decreased demand的宾语是demand，技术变革让一类邮件的需求减少，描述的是外部市场变了。C的cost for technical upgrading则把技术影响改成邮政局自己购买、升级技术的费用，描述的是内部多花了钱。即使两种情况都可能与财务困难有关，它们也不是同一条因果：原文写“业务需求少了”，C写“升级支出多了”。这里的technical与technological相近，只能帮助找到讨论技术的句子，不能让后面的demand和cost自动变成同义词。\n\nC把技术作用的方向和对象同时换掉了。原因题必须保留这条因果，不能找到“技术”这个主题词就停。\n\n**命题人借用的原文材料：**\n\n> Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.","context":{"mode":"image","asset":"questions","focus":[250,508,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false,"partIndex
