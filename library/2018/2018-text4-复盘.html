。\n\nC实际说的是：\n\n> the cost for technical upgrading  \n> 技术升级的成本\n\nC把技术作用的方向和对象同时换掉了。原因题必须保留这条因果，不能找到“技术”这个主题词就停。\n\n从全文推进看，这一处的作用是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：C错误。**","context":{"mode":"image","asset":"questions","focus":[250,508,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"36","option":"C"},"focusId":"focus-q36-C-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-C-0\">\u003cblockquote>\n\u003cp>技术升级的成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的cost for technical upgrading与第1段technological change都提到技术，但原文紧接permanently decreased demand说需求变化，因此回看技术在原因链里改变的是支出还是需求。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>permanently decreased demand的宾语是demand，技术变革让一类邮件的需求减少，描述的是外部市场变了。C的cost for technical upgrading则把技术影响改成邮政局自己购买、升级技术的费用，描述的是内部多花了钱。即使两种情况都可能与财务困难有关，它们也不是同一条因果：原文写“业务需求少了”，C写“升级支出多了”。这里的technical与technological相近，只能帮助找到讨论技术的句子，不能让后面的demand和cost自动变成同义词。\u003c/p>\n\u003cp>C把技术作用的方向和对象同时换掉了。原因题必须保留这条因果，不能找到“技术”这个主题词就停。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>USPS的财务问题部分由技术升级的成本造成。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的cost for technical upgrading与第1段technological change都提到技术，但原文紧接permanently decreased demand说需求变化，因此回看技术在原因链里改变的是支出还是需求。\u003c/p>\n\u003cp>permanently decreased demand的宾语是demand，技术变革让一类邮件的需求减少，描述的是外部市场变了。C的cost for technical upgrading则把技术影响改成邮政局自己购买、升级技术的费用，描述的是内部多花了钱。即使两种情况都可能与财务困难有关，它们也不是同一条因果：原文写“业务需求少了”，C写“升级支出多了”。这里的technical与technological相近，只能帮助找到讨论技术的句子，不能让后面的demand和cost自动变成同义词。\u003c/p>\n\u003cp>C把技术作用的方向和对象同时换掉了。原因题必须保留这条因果，不能找到“技术”这个主题词就停。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-C-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003cp>首段先报告连续亏损与负债，再用Fundamentally解释两面夹击：技术使需求下降，监管结构又不许管理层灵活调整。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The cost of upgrading its technology has caused the financial problem.\u003c/p>\n\u003cp>升级技术的成本导致了这一财务问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>第二段说因无法支付账单而推迟现代化，方向是缺钱妨碍升级，不是已经大量升级导致亏损。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨认为短期补钱不够，本题应区分账目困境与导致困境的制度原因。僵化如何阻碍适应，要由denies management the flexibility坐实。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the cost for technical upgrading\u003cbr>技术升级的成本\u003c/p>\n\u003c/blockquote>\n\u003cp>C把技术作用的方向和对象同时换掉了。原因题必须保留这条因果，不能找到“技术”这个主题词就停。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. the withdrawal of bank support","level":3,"raw":"### D. the withdrawal of bank support\n\n> 银行撤回支持\n\n**做题模式中的状态：** 第一轮D排除。当时选项呈现为“the [xxx] of bank support”，保留了相应遮挡。当时的定位线索是：D的bank support说资金支持来自银行，第1段unfunded涉及资金未获保障，因此回看这一财务描述具体指向什么费用，以及原因句有没有把资金关系落在银行身上。\n\n**错误类型：第三类——无中生有。**\n\nunfunded后面那个名词没有读清，但后面的mostly for把费用指向员工医疗与退休。D的bank support却增加了银行这一资金提供者，还把银行支持发生的变化用来解释财务困难。围绕银行支持怎样变化，这一段找不到一句能直接说到这件事。资金没有着落不等于已知是某家银行的支持出了变化；原文的明确原因继续落到需求和经营灵活性，不是银行—邮政局之间的融资关系。\n\nD不是对原句财务词的简写，而是另添一个参与者和一条因果。题目问文章说明的部分原因，不能用这条新关系代替已经写出的原因。\n\n**命题人借用的原文材料：**\n\n> Meanwhile, it has more than $120 billion in unfunded liabilities, mostly for employee health and retirement costs.\n>\n> Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.","context":{"mode":"image","asset":"questions","focus":[250,593,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"36","option":"D"},"focusId":"focus-q36-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-D-0\">\u003cblockquote>\n\u003cp>银行撤回支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时选项呈现为“the [xxx] of bank support”，保留了相应遮挡。当时的定位线索是：D的bank support说资金支持来自银行，第1段unfunded涉及资金未获保障，因此回看这一财务描述具体指向什么费用，以及原因句有没有把资金关系落在银行身上。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>unfunded后面那个名词没有读清，但后面的mostly for把费用指向员工医疗与退休。D的bank support却增加了银行这一资金提供者，还把银行支持发生的变化用来解释财务困难。围绕银行支持怎样变化，这一段找不到一句能直接说到这件事。资金没有着落不等于已知 与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"36题结论","level":2,"raw":"### 36题结论\n\n> **36. B. its rigid management**\n\nA：第1段列支出超过收入，确实描述了收支不平衡的财务结果。\n\nB：denies management the flexibility后面接to adjust its operations to the new reality，说管理层缺乏调整经营以适应新现实的余地。\n\nC：permanently decreased demand的宾语是demand，技术变革让一类邮件的需求减少，描述的是外部市场变了。\n\nD：unfunded后面那个名词没有读清，但后面的mostly for把费用指向员工医疗与退休。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"question":"36","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>36. B. its rigid management\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：第1段列支出超过收入，确实描述了收支不平衡的财务结果。\u003c/p>\n\u003cp>B：denies management the flexibility后面接to adjust its operations to the new reality，说管理层缺乏调整经营以适应新现实的余地。\u003c/p>\n\u003cp>C：permanently decreased demand的宾语是demand，技术变革让一类邮件的需求减少，描述的是外部市场变了。\u003c/p>\n\u003cp>D：unfunded后面那个名词没有读清，但后面的mostly for把费用指向员工医疗与退休。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"37题 · 题干、题型与核心出处","level":2,"raw":"## 37题\n\n> According to Paragraph 2, the USPS fails to modernize itself due to ______.  \n> 根据第2段，USPS未能实现现代化的原因是什么？\n\n### 题型\n\n原因细节题。题干要求判断“根据第2段，USPS未能实现现代化的原因是什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS's ultimate overseer – Congress – insisting that whatever else happens to the Postal Service, aspects of the status quo they depend on get protected. This is why repeated attempts at reform legislation have failed in recent years, leaving the Postal Service unable to pay its bills except by deferring vital modernization.\n\n利益群体要求国会保护自己依赖的现状，使多次改革立法失败，邮政只能推迟重要现代化来应付账单。","context":{"mode":"image","asset":"questions","fo ected.\n>\n> 利益群体要求国会保护自己依赖的现状，使多次改革立法失败，邮政只能推迟重要现代化来应付账单。\n\n把这一处放回全文，它承担的写作任务是：写利益群体坚持维护现状，对国会形成压力，使改革立法反复失败，现代化也受到拖累。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The postal unions are too incompetent to carry out modernization.\n>\n> 邮政工会因能力不足而无法实施现代化。\n\n工会是施压的利益主体之一，原文批评自利地阻止改变，不评判其执行技术升级的能力；其他群体也参与阻挡。","context":{"mode":"image","asset":"questions","focus":[250,1103,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"37","option":"D"},"focusId":"focus-q37-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-D-0\">\u003cblockquote>\n\u003cp>邮政工会的无能\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的incompetence评价工会有没有能力，原文self-interested pressure说的是利益群体为了谁而提出要求；工会属于这些群体，因此回看作者是在批评本领不足还是维护自身利益。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>self-interested pressure中的self-interested指向自身利益，后面的insisting进一步写出它们坚持旧安排受到保护。D的incompetence却改成工会无能，没有能力推动事情。这两种批评方向不同：为了自己的好处有力地维护现状，并不是因为不知道如何做事或没有组织能力。原文还从postal unions写到greeting-card makers，涉及一系列群体；D既把原因收缩到工会，又把利益动机改为能力不足。不能把作者不赞成某个群体的行为，都翻成那个群体“无能”。\u003c/p>\n\u003cp>D改变了作者解释行为的原因，还丢掉同列其他利益群体，不能承接这段改革受阻的叙述。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS&#39;s ultimate overseer – Congress – insisting that whatever else happens to the Postal Service, aspects of the status quo they depend on get protected.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>USPS未能现代化，原因在于邮政工会的无能。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的incompetence评价工会有没有能力，原文self-interested pressure说的是利益群体为了 0,753,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"question":"37","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>37. A. the interference from interest groups\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：接下去This is why直接把这些要求与改革立法屡次失败连起来，再落到现代化无法正常推进。\u003c/p>\n\u003cp>B：pressure on说明压力指向国会，后面跟着改革立法失败；国会在这条叙述里与立法和利益要求相连。\u003c/p>\n\u003cp>C：This is why紧接利益群体要求现状得到保护，说明本段在解释改革立法为什么失败。\u003c/p>\n\u003cp>D：self-interested pressure中的self-interested指向自身利益，后面的insisting进一步写出它们坚持旧安排受到保护。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"38题 · 题干、题型与核心出处","level":2,"raw":"## 38题\n\n> The long-standing complaint by the USPS and its unions can be addressed by ______.  \n> USPS及其工会长期以来的抱怨，可以通过什么办法得到解决？\n\n### 题型\n\n细节对应题。题干要求判断“USPS及其工会长期以来的抱怨，可以通过什么办法得到解决？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Now comes word that everyone involved – Democrats, Republicans, the Postal Service, the unions and the system's heaviest users – has finally agreed on a plan to fix the system. Legislation is moving through the House that would save USPS an estimated $28.6 billion over five years, which could help pay for new vehicles, among other survival measures. Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare. The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.\n\n第三段列涨价与将退休人员转入Medicare两项节支来源，The latter step专指后者，抵消每年预存退休医疗费的负担。","context":{"mode":"image","asset":"questions","focus":[250,1263,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"question":"38","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The long-standing complaint by the USPS and its unions can be addressed by ______.\u003cbr>USPS及其工会长期以来的抱怨，可以通过什么办法得到解决？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>细节对应题。题干要求判断“USPS及其工会长期以来的抱怨，可以通过什么办法得到解决？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Now comes word that everyone involved – Democrats, Republicans, the Postal Service, the unions and the system&#39;s heaviest users – has finally agreed on a plan to fix the system. Legislation is moving through the House that would save USPS an estimated $28.6 billion over five years, which could help pay for new vehicles, among other survival measures. Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare. The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.\u003c/p>\n\u003c/blockquote>\n\u003cp>第三段列涨价与将退休人员转入Medicare两项节支来源，The latter step专指后者，抵消每年预存退休医疗费的负担。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. removing its burden of retiree health care","level":3,"raw":"### A. removing its burden of retiree health care\n\n> 解除退休人员医疗保健负担\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“removing its burden of [xxx] health care”，保留了相应遮挡。当时的定位线索是：A的burden of health care与末句financial burden、health care都说医疗负担，因此回看The latter step指向的转入Medicare怎样与addressing a long-standing complaint连接。\n\n**选项类型：正确同义改写。**\n\nfinancial burden后面明确接医疗相关支出，thus addressing又直接说明处理这项负担会回应长期抱怨。A的burden of保留了这一对象，removing说的是解除机构背负的负担，并不是取消患者获得医疗的权利。The latter step回指两项措施中的后一项，即把邮政退休人员转入Medicare；这样前面的安排、后面的医疗负担和抱怨才能串起来。\n\n这里的解除负担按原句largely理解为实质减轻这项承担，不夸成所有医疗成本都彻底消失。A保留了被处理的具体负担。\n\n**正确选项的原文依据：**\n\n> Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare.\n>\n> The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.","context":{"mode":"image","asset 哪项措施让钱更多，而问长期抱怨具体由哪一步处理，答案必须跟着latter往回接。\n\nC保留了同段原词，却换错指代对象；这种错位不是“都能省钱”就可以弥补的。\n\n**命题人借用的原文材料：**\n\n> Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare.\n>\n> The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.","context":{"mode":"image","asset":"questions","focus":[250,1611,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"38","option":"C"},"focusId":"focus-q38-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-C-0\">\u003cblockquote>\n\u003cp>采用新的涨价机制\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的rate-increase mechanism与前句rate increase词面相近，但后句The latter step特意选了后一项措施，因此回看前一句，把两个from依次读出来，确认涨邮费排在前还是后。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>The latter step指“后一个措施”。前句先写from a penny-per-letter permanent rate increase，后写and from shifting postal retirees into Medicare，所以latter回指转入Medicare，不是邮费上涨。C的rate-increase mechanism把前一项省钱来源选成了后一项处理医疗负担的办法。两者都可能改善总账，仍不能因此取消原句特意作出的先后区分。题目不问哪项措施让钱更多，而问长期抱怨具体由哪一步处理，答案必须跟着latter往回接。\u003c/p>\n\u003cp>C保留了同段原词，却换错指代对象；这种错位不是“都能省钱”就可以弥补的。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare.\u003c/p>\n\u003cp>The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. adopting a new rate-increase mechanism","le c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨承认眼前财务方案有有限帮助，本题只问其中哪项对应长期抱怨，不能用“方案里的任意一项”替代latter的具体指代。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>attracting more first-class mail users\u003cbr>吸引更多一类邮件用户\u003c/p>\n\u003c/blockquote>\n\u003cp>D把自己想到的一种业务办法放进原文的措施列表，又让它替代明确的医疗负担处理，动作和对象都不相同。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：介绍各方终于同意的方案，包括提高每封信邮费、转移医疗承担，以及五年节省资金等预计效果。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"38题结论","level":2,"raw":"### 38题结论\n\n> **38. A. removing its burden of retiree health care**\n\nA：financial burden后面明确接医疗相关支出，thus addressing又直接说明处理这项负担会回应长期抱怨。\n\nB：help pay for new vehicles是省下的钱可以帮助支付的一种用途，后面among other survival measures说明它属于若干维持经营的安排之一。\n\nC：The latter step指“后一个措施”。\n\nD：Most of the money would come后面列一封信增加一美分，以及退休人员转入Medicare。","context":{"mode":"image","asset":"questions","focus":[250,1263,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"question":"38","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>38. A. removing its burden of retiree health care\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：financial burden后面明确接医疗相关支出，thus addressing又直接说明处理这项负担会回应长期抱怨。\u003c/p>\n\u003cp>B：help pay for new vehicles是省下的钱可以帮助支付的一种用途，后面among other survival measures说明它属于若干维持经营的安排之一。\u003c/p>\n\u003cp>C：The latter step指“后一个措施”。\u003c/p>\n\u003cp>D：Most of the money would come后面列一封信增加一美分，以及退休人员转入Medicare。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"39题 · 题干、题型与核心出处","level":2,"raw":"## 39题\n\n> In the last paragraph, the author seems to view legislators with ______.  \n> 从最后一段来看，作者对立法者表现出的态度是怎样的？\n\n### 题型\n\n作者态度题。题干要求判断“从最后一段来看，作者对立法者表现出的态度是怎样的？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform. There's no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency's costs. Also missing is any discussion of eliminating Saturday letter delivery. That common-sense change enjoys wide public support and would save the USPS $2 billion per year. But postal special-interest groups seem to have killed it, at least in the House. The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS. It is not, however, a sign that they're getting serious about transforming the postal system for the 21st century.\n\n作者承认法案能勉强维持邮政，却批评遗漏人员成本与周六投递改革，结尾说立法者只怕短期崩溃，尚未认真长期转型。","context":{"mode":"image","asset":"questions","focus":[250,1857,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"question":"39","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>In the last paragraph, the author seems to view legislators with ______.\u003cbr>从最后一段来看，作者对立法者表现出的态度是怎样的？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>作者态度题。题干要求判断“从最后一段来看，作者对立法者表现出的态度是怎样的？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform. There&#39;s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency&#39;s costs. Also missing is any discussion of eliminating Saturday letter delivery. That common-sense change enjoys wide public support and would save the USPS $2 billion per year. But postal special-interest groups seem to have killed it, at least in the House. The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS. It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者承认法案能勉强维持邮政，却批评遗漏人员成本与周六投递改革，结尾说立法者只怕短期崩溃，尚未认真长期转型。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. respect","level":3,"raw":"### A. respect\n\n> 尊重\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的respect说作者敬重立法者，第4段getting serious涉及他们是否认真对待改革，因此回看这句话前面有没有否定，以及前面列出的未做事项。\n\n**错误类型：第一类——歪曲原意。**\n\ngetting serious前面受It is not…a sign管着，作者不是表扬他们终于认真改造邮政体系，而是否认法案共识足以证明这种认真。A的respect要求正面的敬重，但本段反复写no change、Also missing，再说只是害怕短期出现政治难堪的情况。这里不能因为legislators取得一致就把评价自动转成尊敬；作者恰恰把达成一致与真正改革区分开，认为前一件事远远不够。\n\nA把作者明确的否定方向翻成正面敬重，忽略了末句not与整段列举缺项的共同作用。\n\n**命题人借用的原文材料：**\n\n> There's no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency's costs.\n>\n> It is not, however, a sign that they're getting serious about transforming the postal system for the 21st century.","context":{"mode":"image","asset":"questions","focus":[250,1951,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"39","option":"A"},"focusId":"focus-q39-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-A-0\">\u003cblockquote>\n\u003cp>尊重\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的respec  is not, however, a sign that they're getting serious about transforming the postal system for the 21st century.\n>\n> 作者承认法案能勉强维持邮政，却批评遗漏人员成本与周六投递改革，结尾说立法者只怕短期崩溃，尚未认真长期转型。\n\n把这一处放回全文，它承担的写作任务是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The legislators’ limited response is acceptable despite its shortcomings.\n>\n> 尽管存在不足，立法者的有限回应仍可被接受。\n\n容忍应在指出不足后接受这种局限，实际反复强调遗漏并要求真正转型，批评并未收回。","context":{"mode":"image","asset":"questions","focus":[250,2036,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"39","option":"B"},"focusId":"focus-q39-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-B-0\">\u003cblockquote>\n\u003cp>容忍\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的tolerance意味着作者对不足表示容忍，原文bare, bare minimum也承认法案能做到最低限度，因此回看这种有限作用后面接的是体谅，还是继续追问缺少什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>bare, bare minimum里bare重复一次，把法案的作用压在最低限度，不是替立法者说“能做到这些已经值得谅解”。B的tolerance需要作者接受这种不足，但原文随后追列未改变的安排、未讨论的周六投递，最后还否认他们已经认真改革。作者的落点不是“现实困难多，所以这样也行”，而是“这并不表明真正改造已经开始”。\u003c/p>\n\u003cp>B把一处有限事实让步读成了整体态度上的宽容，漏掉整段向不足之处推进的方向。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp  id=\"focus-q39-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003cp>作者承认法案能勉强维持邮政，却批评遗漏人员成本与周六投递改革，结尾说立法者只怕短期崩溃，尚未认真长期转型。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The legislators’ limited response is acceptable despite its shortcomings.\u003c/p>\n\u003cp>尽管存在不足，立法者的有限回应仍可被接受。\u003c/p>\n\u003c/blockquote>\n\u003cp>容忍应在指出不足后接受这种局限，实际反复强调遗漏并要求真正转型，批评并未收回。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>需要的不只是创可贴，说明作者对止于最低救急的立法不满足；态度应结合bare minimum、major omission及not serious，而非仅看终于达成共识。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>tolerance\u003cbr>容忍\u003c/p>\n\u003c/blockquote>\n\u003cp>B把一处有限事实让步读成了整体态度上的宽容，漏掉整段向不足之处推进的方向。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. discontent","level":3,"raw":"### C. discontent\n\n> 不满\n\n**做题模式中的状态：** 第一轮C保留。当时的定位线索是：C的discontent说作者不满意，末句It is not, however, a sign直接否认立法者已经认真改革的说法，因此回看这个否定，再把它与前面的no change、Also missing一起读。\n\n**选项类型：正确同义改写。**\n\nIt is not, however, a sign把“害怕短期政治尴尬”与“认真为21世纪改造系统”分开，作者认为前者不能证明后者。C的discontent正好承接这种对动机和行动不足的不满意。前面列未改事项与未讨论事项，不是在中性统计数量，而是在解释为什么法案只够最低限度。C只说不满，没有进一步夸成仇恨所有立法者。\n\nC既与末句的否定一致，也与前面的缺项说明相合，程度上没有强行扩大成轻蔑或全盘敌视，因此保留。\n\n**正确选项的原文依据：**\n\n> Also missing is any discussion of eliminating Saturday letter delivery.\n>\n> The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS.\n>\n> It is not, however, a sign that they're getting serious about transforming the postal system for the 21st century.","context":{"mode":"image","asset":"questions","focus":[250,2121,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"39","option":"C"},"focusId":"focus-q39-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-C-0\">\u003cblockquote>\n\u003cp>不满\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的discontent说作者不满意，末句It is not, however, a sign直接否认立法者已经认真改革的说法，因此回看这个否定，再把它与前面的no change、Also missing一起读。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>It is not, however, a sign把“害怕短期政治尴尬”与“认真为21世纪改造系统”分开，作者认为前者不能证明后者。C的discontent正好承接这种对动机和行动不足的不满意。前面列未改事项与未讨论事项，不是在中性统计数量，而是在解释为什么法案只够最低限度。C只说不满，没有进一步夸成仇恨所有立法者。\u003c/p>\n\u003cp>C既与末句的否定一致，也与前面的缺项说明相合，程度上没有强行扩大成轻蔑或全盘敌视，因此保留。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Also missing is any discussion of eliminating Saturday letter delivery.\u003c/p>\n\u003cp>The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming th e emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS.\u003c/p>\n\u003cp>It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003cp>作者承认法案能勉强维持邮政，却批评遗漏人员成本与周六投递改革，结尾说立法者只怕短期崩溃，尚未认真长期转型。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The author is grateful to legislators for finally saving the system.\u003c/p>\n\u003cp>作者感谢立法者终于挽救了这个体系。\u003c/p>\n\u003c/blockquote>\n\u003cp>感谢需要对立法行动作肯定收束，实际以未认真转型结尾。暂时维持运转的效用不能抹去全文对立法局限的批评。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. gratitude","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> The Postal Service Needs More than a Band-Aid  \n> 邮政局需要的不只是一块创可贴\n\n把这个主旨直接代入39题题干：\n\n> 需要的不只是创可贴，说明作者对止于最低救急的立法不满足；态度应结合bare minimum、major omission及not serious，而非仅看终于达成共识。\n\nD实际说的是：\n\n> gratitude  \n> 感激\n\nD与末段评价方向相反；一项措施可能省钱，不等于作者就会对推动它的人持感激态度。\n\n从全文推进看，这一处的作用是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,2206,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"39","option":"D"},"focusId":"focus-q39-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-D-0\">\u003cblockquote>\n\u003cp>感激\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的gratitude需要作者把法案看成值得感谢的帮助，原文getting frightened则解释立法者为什么达成一致，因此回看作者把他们的举动归结为什么动机，并怎样评价结果。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>getting fr 03c/p>\n\u003cp>作者感谢立法者终于挽救了这个体系。\u003c/p>\n\u003c/blockquote>\n\u003cp>感谢需要对立法行动作肯定收束，实际以未认真转型结尾。暂时维持运转的效用不能抹去全文对立法局限的批评。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>需要的不只是创可贴，说明作者对止于最低救急的立法不满足；态度应结合bare minimum、major omission及not serious，而非仅看终于达成共识。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>gratitude\u003cbr>感激\u003c/p>\n\u003c/blockquote>\n\u003cp>D与末段评价方向相反；一项措施可能省钱，不等于作者就会对推动它的人持感激态度。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"39题结论","level":2,"raw":"### 39题结论\n\n> **39. C. discontent**\n\nA：getting serious前面受It is not…a sign管着，作者不是表扬他们终于认真改造邮政体系，而是否认法案共识足以证明这种认真。\n\nB：bare, bare minimum里bare重复一次，把法案的作用压在最低限度，不是替立法者说“能做到这些已经值得谅解”。\n\nC：It is not, however, a sign把“害怕短期政治尴尬”与“认真为21世纪改造系统”分开，作者认为前者不能证明后者。\n\nD：getting frightened说立法者怕出现短期政治难堪的局面，后一句又否认这代表认真改造邮政系统。","context":{"mode":"image","asset":"questions","focus":[250,1857,1800,470],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 4题目"},"meta":{"question":"39","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>39. C. discontent\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：getting serious前面受It is not…a sign管着，作者不是表扬他们终于认真改造邮政体系，而是否认法案共识足以证明这种认真。\u003c/p>\n\u003cp>B：bare, bare minimum里bare重复一次，把法案的作用压在最低限度，不是替立法者说“能做到这些已经值得谅解”。\u003c/p>\n\u003cp>C：It is not, however, a sign把“害怕短期政治尴尬”与“认真为21世纪改造系统”分开，作者认为前者不能证明后者。\u003c/p>\n\u003cp>D：getting frightened说立法者怕出现短期政治难堪的局面，后一句又否认这代表认真改造邮政系统。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：USPS的财务危机现状**（段落1问题呈现） 财务困境：【连续10年亏损（2016年亏56亿）+ 1200亿未备资金负债（主要是员工健康和退休成本）】→ 根本原因：【技术变革减少一类邮件需求 + 监管结构缺乏灵活性】\n\n↓（阻碍改革的原因）\n\n**逻辑层次2：改革失败的深层原因**（段落2利益纠葛） 利益集团施压：（邮政工会到贺卡制造商 → 向国会施压保护现状）→ 结果：改革立法反复失败 → USPS只能推迟现代化来支付账单\n\n↓（新的改革尝试）\n\n**逻辑层次3：最新改革方案**（段落3妥协方案） 各方达成一致：【5年节省286亿（用于新车辆等）】→ 资金来源：（每封信涨1美分 + 退休人员转入医疗保险）→ 解决长期投诉：抵消预先资助退休医疗的负担\n\n↓（方案的局限性）\n\n**逻辑层次4：改革的不彻底性**（段落4批判分析） 参议院可能批评：只是最低限度措施 // 非全面改革 → 重大遗漏：【未改变集体谈判（人员成本占80%）+ 未讨论取消周六投递（可年省20亿）】→ 特殊利益集团扼杀改革 → 立法者动机：害怕短期崩溃 // 而非真正改造系统\n\n↑（全文主旨）\n\n全文核心观点：USPS面临严重财务危机，虽然各方终于达成改革共识，但这只是维持运转的最低限度措施，而非21世纪所需的全面改革。真正的结构性问题（监管僵化、利益集团阻挠）仍未解决。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：USPS的财务危机现状\u003c/strong>（段落1问题呈现） 财务困境：【连续10年亏损（2016年亏56亿）+ 1200亿未备资金负债（主要是员工健康和退休成本）】→ 根本原因：【技术变革减少一类邮件需求 + 监管结构缺乏灵活性】\u003c/p>\n\u003cp>↓（阻碍改革的原因）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：改革失败的深层原因\u003c/strong>（段落2利益纠葛） 利益集团施压：（邮政工会到贺卡制造商 → 向国会施压保护现状）→ 结果：改革立法反复失败 → USPS只能推迟现代化来支付账单\u003c/p>\n\u003cp>↓（新的改革尝试）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：最新改革方案\u003c/strong>（段落3妥协方案） 各方达成一致：【5年节省286亿（用于新车辆等）】→ 资金来源：（每封信涨1美分 + 退休人员转入医疗保险）→ 解决长期投诉：抵消预先资助退休医疗的负担\u003c/p>\n\u003cp>↓（方案的局限性）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：改革的不彻底性\u003c/strong>（段落4批判分析） 参议院可能批评：只是最低限度措施 // 非全面改革 → 重大遗漏：【未改变集体谈判（人员成本占80%）+ 未讨论取消周六投递（可年省20亿）】→ 特殊利益集团扼杀改革 → 立法者动机：害怕短期崩溃 // 而非真正改造系统\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：USPS面临严重财务危机，虽然各方终于达成改革共识，但这只是维持运转的最低限度措施，而非21世纪所需的全面改革。真正的结构性问题（监管僵化、利益集团阻挠）仍未解决。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n**答案：A. Caught between Declining Demand and Rigid Rules / 夹在需求下降与僵化规则之间**\n\n把长期需求变化与制度限制结合为双重困境。\n\n> A postal service can lose revenue because technology changes the demand for its central product.\n>\n> Without that room, a long-term shift in demand can become a recurring financial crisis.\n\n段内推进：\n\n> 把长期需求变化与制度限制结合为双重困境。\n\nDeclining Demand对应技术变化减少传统邮件需求，Rigid Rules对应管理层无权灵活调整；Caught between把两种压力合在同一困境中。\n\n最强干扰项C（Proof That Management Can Change Everything Alone）容易因相同话题进入考虑。但段落强调管理层缺乏调整空间，不能概括成它可独自改变一切。\n\n**41题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：A. Caught between Declining Demand and Rigid Rules / 夹在需求下降与僵化规则之间\u003c/strong>\u003c/p>\n\u003cp>把长期需求变化与制度限制结合为双重困境。\u003c/p>\n\u003cblockquote>\n\u003cp>A postal service can lose revenue because technology changes the demand for its central product.\u003c/p>\n\u003cp>Without that room, a long-term shift in demand can become a recurring financial crisis.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>把长期需求变化与制度限制结合为双重困境。\u003c/p>\n\u003c/blockquote>\n\u003cp>Declining Demand对应技术变化减少传统邮件需求，Rigid Rules对应管理层无权灵活调整；Caught between把两种压力合在同一困境中。\u003c/p>\n\u003cp>最强干扰项C（Proof That Management Can Change Everything Alone）容易因相同话题进入考虑。但段落强调管理层缺乏调整空间，不能概括成它可独自改变一切。\u003c/p>\n\u003cp>\u003cstrong>41题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n**答案：E. When Defending the Status Quo Blocks Adaptation / 保卫现状如何阻碍调整**\n\n说明集团各自维护利益如何合成阻碍现代化的压力。\n\n> Different groups may each have a plausible reason to protect one feature of the existing system.\n>\n> The total effect of these demands can therefore conflict with the survival of the system on which the groups rely.\n\n段内推进：\n\n> 说明集团各自维护利益如何合成阻碍现代化的压力。\n\nDefending the Status Quo对应各群体保护已有服务和待遇，Blocks Adaptation对应合起来的国会压力使必要现代化难以推进。\n\n最强干扰项C（Proof That Management Can Change Everything Alone）容易因相同话题进入考虑。但关键决策受到国会与利益集团约束，不只取决于管理者意愿。\n\n**42题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：E. When Defending the Status Quo Blocks Adaptation / 保卫现状如何阻碍调整\u003c/strong>\u003c/p>\n\u003cp>说明集团各自维护利益如何合成阻碍现代化的压力。\u003c/p>\n\u003cblockquote>\n\u003cp>Different groups may each have a plausible reason to protect one feature of the existing system.\u003c/p>\n\u003cp>The total effect of these demands can therefore conflict with the survival of the system on which the groups rely.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明集团各自维护利益如何合成阻碍现代化的压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>Defending the Status Quo对应各群体保护已有服务和待遇，Blocks Adaptation对应合起来的国会压力使必要现代化难以推进。\u003c/p>\n\u003cp>最强干扰项C（Proof That Management Can Change Everything Alone）容易因相同话题进入考虑。但关键决策受到国会与利益集团约束，不只取决于管理者意愿。\u003c/p>\n\u003cp>\u003cstrong>42题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n**答案：G. A Compromise That Buys Breathing Space / 争取喘息空间的折中方案**\n\n肯定折中措施的短期财务作用，同时限定其成效。\n\n> An agreement among parties that usually disagree can still have practical value.\n>\n> It does not follow that every difficult question about operations and costs has been resolved by the appearance of a compromise.\n\n段内推进：\n\n> 肯定折中措施的短期财务作用 → 同时限定其成效。\n\nCompromise对应通常意见相左的各方就费用和退休义务达成一致，Breathing Space对应暂时释放资金、缓解崩溃压力，而不是永久治愈。\n\n最强干扰项B（Declaring the Financial Problem Permanently Solved）容易因相同话题进入考虑。但争取时间不等于永久解决，结尾明确保留未处理的问题。\n\n**43题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：G. A Compromise That Buys Breathing Space / 争取喘息空间的折中方案\u003c/strong>\u003c/p>\n\u003cp>肯定折中措施的短期财务作用，同时限定其成效。\u003c/p>\n\u003cblockquote>\n\u003cp>An agreement among parties that usually disagree can still have practical value.\u003c/p>\n\u003cp>It does not follow that every difficult question about operations and costs has been resolved by the appearance of a compromise.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>肯定折中措施的短期财务作用 → 同时限定其成效。\u003c/p>\n\u003c/blockquote>\n\u003cp>Compromise对应通常意见相左的各方就费用和退休义务达成一致，Breathing Space对应暂时释放资金、缓解崩溃压力，而不是永久治愈。\u003c/p>\n\u003cp>最强干扰项B（Declaring the Financial Problem Permanently Solved）容易因相同话题进入考虑。但争取时间不等于永久解决，结尾明确保留未处理的问题。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n**答案：F. Important Costs Left Outside the Agreement / 协议之外的重要成本**\n\n通过人员与投递成本检验方案未覆盖的结构领域。\n\n> The limits become clearer when the agreement is compared with the largest sources of expenditure.\n>\n> That may help it pass, but passage alone does not show that the business has been redesigned to match the environment in which it now operates.\n\n段内推进：\n\n> 通过人员与投递成本检验方案未覆盖的结构领域。\n\nImportant Costs对应人员成本和投递频率，Left Outside对应方案为避开强大利益而不作调整；标题检查方案的实质缺口。\n\n最强干扰项B（Declaring the Financial Problem Permanently Solved）容易因相同话题进入考虑。但指出重大成本未处理，正是在拒绝财务问题已经彻底解决的判断。\n\n**44题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：F. Important Costs Left Outside the Agreement / 协议之外的重要成本\u003c/strong>\u003c/p>\n\u003cp>通过人员与投递成本检验方案未覆盖的结构领域。\u003c/p>\n\u003cblockquote>\n\u003cp>The limits become clearer when the agreement is compared with the largest sources of expenditure.\u003c/p>\n\u003cp>That may help it pass, but passage alone does not show that the business has been redesigned to match the environment in which it now operates.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>通过人员与投递成本检验方案未覆盖的结构领域。\u003c/p>\n\u003c/blockquote>\n\u003cp>Important Costs对应人员成本和投递频率，Left Outside对应方案为避开强大利益而不作调整；标题检查方案的实质缺口。\u003c/p>\n\u003cp>最强干扰项B（Declaring the Financial Problem Permanently Solved）容易因相同话题进入考虑。但指出重大成本未处理，正是在拒绝财务问题已经彻底解决的判断。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n**答案：D. A Short-term Patch Is Not a Transformation / 短期修补不是整体转型**\n\n区分保运转与适应新环境，对立法者提出长期改革要求。\n\n> A short-term rescue and a lasting transformation should not be confused.\n>\n> The standard is whether the organisation can function under changed technological and economic conditions, not merely whether it can survive the next embarrassment.\n\n段内推进：\n\n> 区分保运转与适应新环境 → 对立法者提出长期改革要求。\n\nShort-term Patch对应暂时维持服务和缓解压力，Transformation对应适应技术、经济新环境的持续能力；Not把两种成效清楚分开。\n\n最强干扰项G（A Compromise That Buys Breathing Space）容易因相同话题进入考虑。但喘息空间是前提，本段总结为何不能以短期救助替代结构转型。\n\n**45题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：D. A Short-term Patch Is Not a Transformation / 短期修补不是整体转型\u003c/strong>\u003c/p>\n\u003cp>区分保运转与适应新环境，对立法者提出长期改革要求。\u003c/p>\n\u003cblockquote>\n\u003cp>A short-term rescue and a lasting transformation should not be confused.\u003c/p>\n\u003cp>The standard is whether the organisation can function under changed technological and economic conditions, not merely whether it can survive the next embarrassment.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>区分保运转与适应新环境 → 对立法者提出长期改革要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>Short-term Patch对应暂时维持服务和缓解压力，Transformation对应适应技术、经济新环境的持续能力；Not把两种成效清楚分开。\u003c/p>\n\u003cp>最强干扰项G（A Compromise That Buys Breathing Space）容易因相同话题进入考虑。但喘息空间是前提，本段总结为何不能以短期救助替代结构转型。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出市场需求与调整能力两方面 |\n| B | 转入达成折中方案的短期收益 |\n| C | 解释特殊集团可排除获支持的措施 |\n| D | 解释利益集团如何限制调整 |\n| E | 强调短期利益不足并引出缺项审查 |\n| F | 列举未涉及的主要结构成本 |\n| G | 分析庆祝反映避免短期难堪的动机 |\n| H | 以长期结构适应收束 |\n\n全文推进：\n\n> 提出市场需求与调整能力两方面 → 解释利益集团如何限制调整 → 转入达成折中方案的短期收益 → 强调短期利益不足并引出缺项审查 → 列举未涉及的主要结构成本 → 解释特殊集团可排除获支持的措施 → 分析庆祝反映避免短期难堪的动机 → 以长期结构适应收束\n\n完整顺序：\n\n**A → D → B → E → F → C → G → H**\n\n41—45：D、B、F、C、G。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出市场需求与调整能力两方面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>转入达成折中方案的短期收益\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>解释特殊集团可排除获支持的措施\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>解释利益集团如何限制调整\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>强调短期利益不足并引出缺项审查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>列举未涉及的主要结构成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>分析庆祝反映避免短期难堪的动机\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>以长期结构适应收束\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出市场需求与调整能力两方面 → 解释利益集团如何限制调整 → 转入达成折中方案的短期收益 → 强调短期利益不足并引出缺项审查 → 列举未涉及的主要结构成本 → 解释特殊集团可排除获支持的措施 → 分析庆祝反映避免短期难堪的动机 → 以长期结构适应收束\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → B → E → F → C → G → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、B、F、C、G。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41位于全文第2个位置，完整衔接是A → D → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段A的结尾：\n\n> Understanding the crisis therefore requires looking at both the market and the organisation’s ability to adapt.\n\n候选D的开头：\n\n> Its ability to adapt is limited further when influential groups defend the arrangements on which they depend.\n\n后段B的开头：\n\n> Despite that combined pressure, a compromise can sometimes emerge.\n\n前文已经落到`ability to adapt`，D继续处理这一对象，完成“解释利益集团如何限制调整”。到本段末尾，讨论又落到`combined pressure`，这正好为下一段“转入达成折中方案的短期收益”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 提出市场需求与调整能力两方面 → 解释利益集团如何限制调整 → 转入达成折中方案的短期收益\n\n最强候选B的功能是“转入达成折中方案的短期收益”。它也属于同一论题，但若直接放在这里，就会跳过“解释利益集团如何限制调整”这一必要环节；其段首“Despite that combined pressure, a compromise can sometimes emerge.”需要的前提与A当前收束的对象不一致，后续也接不出B所需的`combined pressure`。\n\n**41题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41位于全文第2个位置，完整衔接是A → D → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Understanding the crisis therefore requires looking at both the market and the organisation’s ability to adapt.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Its ability to adapt is limited further when influential groups defend the arrangements on which they depend.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Despite that combined pressure, a compromise can sometimes emerge.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>ability to adapt\u003c/code>，D继续处理这一对象，完成“解释利益集团如何限制调整”。到本段末尾，讨论又落到\u003ccode>combined pressure\u003c/code>，这正好为下一段“转入达成折中方案的短期收益”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出市场需求与调整能力两方面 → 解释利益集团如何限制调整 → 转入达成折中方案的短期收益\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“转入达成折中方案的短期收益”。它也属于同一论题，但若直接放在这里，就会跳过“解释利益集团如何限制调整”这一必要环节；其段首“Despite that combined pressure, a compromise can sometimes emerge.”需要的前提与A当前收束的对象不一致，后续也接不出B所需的\u003ccode>combined pressure\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42位于全文第3个位置，完整衔接是D → B → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段D的结尾：\n\n> Their combined pressure on legislators can leave little room for changes that the organisation needs in order to modernise.\n\n候选B的开头：\n\n> Despite that combined pressure, a compromise can sometimes emerge.\n\n后段E的开头：\n\n> The near-term benefit should not be mistaken for comprehensive reform.\n\n前文已经落到`combined pressure`，B继续处理这一对象，完成“转入达成折中方案的短期收益”。到本段末尾，讨论又落到`near term`，这正好为下一段“强调短期利益不足并引出缺项审查”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 解释利益集团如何限制调整 → 转入达成折中方案的短期收益 → 强调短期利益不足并引出缺项审查\n\n最强候选D的功能是“解释利益集团如何限制调整”。它也属于同一论题，但若直接放在这里，就会跳过“转入达成折中方案的短期收益”这一必要环节；其段首“Its ability to adapt is limited further when influential groups defend the arrangements on which they depend.”需要的前提与D当前收束的对象不一致，后续也接不出E所需的`near term`。\n\n**42题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42位于全文第3个位置，完整衔接是D → B → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Their combined pressure on legislators can leave little room for changes that the organisation needs in order to modernise.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Despite that combined pressure, a compromise can sometimes emerge.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The near-term benefit should not be mistaken for comprehensive reform.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>combined pressure\u003c/code>，B继续处理这一对象，完成“转入达成折中方案的短期收益”。到本段末尾，讨论又落到\u003ccode>near term\u003c/code>，这正好为下一段“强调短期利益不足并引出缺项审查”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释利益集团如何限制调整 → 转入达成折中方案的短期收益 → 强调短期利益不足并引出缺项审查\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“解释利益集团如何限制调整”。它也属于同一论题，但若直接放在这里，就会跳过“转入达成折中方案的短期收益”这一必要环节；其段首“Its ability to adapt is limited further when influential groups defend the arrangements on which they depend.”需要的前提与D当前收束的对象不一致，后续也接不出E所需的\u003ccode>near term\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43位于全文第5个位置，完整衔接是E → F → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段E的结尾：\n\n> To judge its significance, one must examine what the agreement does not attempt as carefully as what it includes.\n\n候选F的开头：\n\n> Among the changes it may fail to attempt are reforms affecting major personnel costs or the frequency of delivery.\n\n后段C的开头：\n\n> Political difficulty does not disappear when a seemingly sensible proposal gains public support.\n\n前文已经落到`does not attempt`，F继续处理这一对象，完成“列举未涉及的主要结构成本”。到本段末尾，讨论又落到`politically difficult`，这正好为下一段“解释特殊集团可排除获支持的措施”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 强调短期利益不足并引出缺项审查 → 列举未涉及的主要结构成本 → 解释特殊集团可排除获支持的措施\n\n最强候选C的功能是“解释特殊集团可排除获支持的措施”。它也属于同一论题，但若直接放在这里，就会跳过“列举未涉及的主要结构成本”这一必要环节；其段首“Political difficulty does not disappear when a seemingly sensible proposal gains public support.”需要的前提与E当前收束的对象不一致，后续也接不出C所需的`politically difficult`。\n\n**43题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43位于全文第5个位置，完整衔接是E → F → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To judge its significance, one must examine what the agreement does not attempt as carefully as what it includes.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Among the changes it may fail to attempt are reforms affecting major personnel costs or the frequency of delivery.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Political difficulty does not disappear when a seemingly sensible proposal gains public support.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>does not attempt\u003c/code>，F继续处理这一对象，完成“列举未涉及的主要结构成本”。到本段末尾，讨论又落到\u003ccode>politically difficult\u003c/code>，这正好为下一段“解释特殊集团可排除获支持的措施”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>强调短期利益不足并引出缺项审查 → 列举未涉及的主要结构成本 → 解释特殊集团可排除获支持的措施\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“解释特殊集团可排除获支持的措施”。它也属于同一论题，但若直接放在这里，就会跳过“列举未涉及的主要结构成本”这一必要环节；其段首“Political difficulty does not disappear when a seemingly sensible proposal gains public support.”需要的前提与E当前收束的对象不一致，后续也接不出C所需的\u003ccode>politically difficult\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44位于全文第6个位置，完整衔接是F → C → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段F的结尾：\n\n> Leaving them untouched can make agreement easier, but it also restricts how far the measure can change the underlying business.\n\n候选C的开头：\n\n> Political difficulty does not disappear when a seemingly sensible proposal gains public support.\n\n后段G的开头：\n\n> Broad celebration may reflect relief rather than confidence in a transformed system.\n\n前文已经落到`politically difficult`，C继续处理这一对象，完成“解释特殊集团可排除获支持的措施”。到本段末尾，讨论又落到`broad celebration`，这正好为下一段“分析庆祝反映避免短期难堪的动机”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 列举未涉及的主要结构成本 → 解释特殊集团可排除获支持的措施 → 分析庆祝反映避免短期难堪的动机\n\n最强候选F的功能是“列举未涉及的主要结构成本”。它也属于同一论题，但若直接放在这里，就会跳过“解释特殊集团可排除获支持的措施”这一必要环节；其段首“Among the changes it may fail to attempt are reforms affecting major personnel costs or the frequency of delivery.”需要的前提与F当前收束的对象不一致，后续也接不出G所需的`broad celebration`。\n\n**44题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44位于全文第6个位置，完整衔接是F → C → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Leaving them untouched can make agreement easier, but it also restricts how far the measure can change the underlying business.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Political difficulty does not disappear when a seemingly sensible proposal gains public support.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Broad celebration may reflect relief rather than confidence in a transformed system.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>politically difficult\u003c/code>，C继续处理这一对象，完成“解释特殊集团可排除获支持的措施”。到本段末尾，讨论又落到\u003ccode>broad celebration\u003c/code>，这正好为下一段“分析庆祝反映避免短期难堪的动机”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>列举未涉及的主要结构成本 → 解释特殊集团可排除获支持的措施 → 分析庆祝反映避免短期难堪的动机\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“列举未涉及的主要结构成本”。它也属于同一论题，但若直接放在这里，就会跳过“解释特殊集团可排除获支持的措施”这一必要环节；其段首“Among the changes it may fail to attempt are reforms affecting major personnel costs or the frequency of delivery.”需要的前提与F当前收束的对象不一致，后续也接不出G所需的\u003ccode>broad celebration\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45位于全文第7个位置，完整衔接是C → G → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段C的结尾：\n\n> This helps explain why a package can attract broad celebration while avoiding an option that would otherwise appear worth serious consideration.\n\n候选G的开头：\n\n> Broad celebration may reflect relief rather than confidence in a transformed system.\n\n后段H的开头：\n\n> Successful adaptation remains the larger task.\n\n前文已经落到`broad celebration`，G继续处理这一对象，完成“分析庆祝反映避免短期难堪的动机”。到本段末尾，讨论又落到`successful adaptation`，这正好为下一段“以长期结构适应收束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 解释特殊集团可排除获支持的措施 → 分析庆祝反映避免短期难堪的动机 → 以长期结构适应收束\n\n最强候选C的功能是“解释特殊集团可排除获支持的措施”。它也属于同一论题，但若直接放在这里，就会跳过“分析庆祝反映避免短期难堪的动机”这一必要环节；其段首“Political difficulty does not disappear when a seemingly sensible proposal gains public support.”需要的前提与C当前收束的对象不一致，后续也接不出H所需的`successful adaptation`。\n\n**45题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45位于全文第7个位置，完整衔接是C → G → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This helps explain why a package can attract broad celebration while avoiding an option that would otherwise appear worth serious consideration.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Broad celebration may reflect relief rather than confidence in a transformed system.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Successful adaptation remains the larger task.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>broad celebration\u003c/code>，G继续处理这一对象，完成“分析庆祝反映避免短期难堪的动机”。到本段末尾，讨论又落到\u003ccode>successful adaptation\u003c/code>，这正好为下一段“以长期结构适应收束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释特殊集团可排除获支持的措施 → 分析庆祝反映避免短期难堪的动机 → 以长期结构适应收束\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“解释特殊集团可排除获支持的措施”。它也属于同一论题，但若直接放在这里，就会跳过“分析庆祝反映避免短期难堪的动机”这一必要环节；其段首“Political difficulty does not disappear when a seemingly sensible proposal gains public support.”需要的前提与C当前收束的对象不一致，后续也接不出H所需的\u003ccode>successful adaptation\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选G。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **adaptability to change** | **适应变化的能力** | **人生哲理类：创新、开拓、与时俱进** | **个人主题** |\n| sustainable public services | 可持续公共服务 | 社会现象类：生活质量 | 宏观主题 |\n| long-term planning | 长期规划 | 人生哲理类：批判、独立、全局思维 | 个人主题 |\n| **cooperation among stakeholders** | **利益相关方合作** | **人生哲理类：团结合作** | **宏观主题** |\n| responsible reform | 负责任的改革 | 人生哲理类：责任感、奉献精神 | 宏观主题 |\n| efficient use of resources | 高效利用资源 | 人生哲理类：勤俭节约 | 宏观主题 |\n| **institutional innovation** | **制度创新** | **人生哲理类：创新、开拓、与时俱进** | **宏观主题** |\n| a broader perspective | 全局视野 | 人生哲理类：批判、独立、全局思维 | 个人主题 |\n| commitment to improvement | 致力于改进 | 人生哲理类：责任感、奉献精神 | 个人主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>adaptability to change\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>适应变化的能力\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：创新、开拓、与时俱进\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sustainable public services\u003c/td>\n\u003ctd>可持续公共服务\u003c/td>\n\u003ctd>社会现象类：生活质量\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>long-term planning\u003c/td>\n\u003ctd>长期规划\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>cooperation among stakeholders\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>利益相关方合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsible reform\u003c/td>\n\u003ctd>负责任的改革\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>efficient use of resources\u003c/td>\n\u003ctd>高效利用资源\u003c/td>\n\u003ctd>人生哲理类：勤俭节约\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>institutional innovation\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>制度创新\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：创新、开拓、与时俱进\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a broader perspective\u003c/td>\n\u003ctd>全局视野\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>commitment to improvement\u003c/td>\n\u003ctd>致力于改进\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第五鸟 · 写作积累","title":"2. 大作文第一段描述题目信息时可积累的表达","level":2,"raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画题** | **The picture shows A caught between changing demand and inflexible rules.** | **图画显示A夹在变化的需求与僵化的规则之间。** |\n| 图画题 | Several groups are defending familiar arrangements while the system struggles to adapt. | 多个群体在维护熟悉安排，而整个体系艰难适应变化。 |\n| 图画题 | The scene contrasts an immediate repair with a lasting solution. | 画面将即时修补与长久解决方案作对比。 |\n| **图表题** | **Expenditure on A exceeded revenue for X consecutive years.** | **A的支出连续X年超过收入。** |\n| 图表题 | The demand for A declined while the cost of maintaining it remained high. | 对A的需求下降，而维持A的费用仍然很高。 |\n| 图表题 | Personnel expenses accounted for X percent of total costs. | 人员支出占总成本的X%。 |\n| **文本评论题** | **The passage describes a reform intended to relieve immediate financial pressure.** | **短文介绍旨在缓解眼前财务压力的改革。** |\n| 文本评论题 | The author welcomes limited progress but questions whether it addresses the underlying problem. | 作者认可有限进展，但质疑其是否触及根本问题。 |\n| 文本评论题 | The discussion argues that A needs more than a temporary repair to adapt to a changing world. | 讨论认为A需要超越临时修补，才能适应变化的世界。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture shows A caught between changing demand and inflexible rules.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画显示A夹在变化的需求与僵化的规则之间。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>Several groups are defending familiar arrangements while the system struggles to adapt.\u003c/td>\n\u003ctd>多个群体在维护熟悉安排，而整个体系艰难适应变化。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene contrasts an immediate repair with a lasting solution.\u003c/td>\n\u003ctd>画面将即时修补与长久解决方案作对比。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Expenditure on A exceeded revenue for X consecutive years.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>A的支出连续X年超过收入。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The demand for A declined while the cost of maintaining it remained high.\u003c/td>\n\u003ctd>对A的需求下降，而维持A的费用仍然很高。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Personnel expenses accounted for X percent of total costs.\u003c/td>\n\u003ctd>人员支出占总成本的X%。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage describes a reform intended to relieve immediate financial pressure.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文介绍旨在缓解眼前财务压力的改革。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author welcomes limited progress but questions whether it addresses the underlying problem.\u003c/td>\n\u003ctd>作者认可有限进展，但质疑其是否触及根本问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion argues that A needs more than a temporary repair to adapt to a changing world.\u003c/td>\n\u003ctd>讨论认为A需要超越临时修补，才能适应变化的世界。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Caught between Declining Demand and Rigid Rules\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Declaring the Financial Problem Permanently Solved\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Proof That Management Can Change Everything Alone\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. A Short-term Patch Is Not a Transformation\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. When Defending the Status Quo Blocks Adaptation\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Important Costs Left Outside the Agreement\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. A Compromise That Buys Breathing Space\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>A postal service can lose revenue because technology changes the demand for its central product. If its managers also lack the freedom to adjust operations, the difficulty becomes a squeeze from two sides. Reducing costs then requires more than recognising that fewer letters are being sent. The organisation needs room to respond to the new reality. Without that room, a long-term shift in demand can become a recurring financial crisis.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>Different groups may each have a plausible reason to protect one feature of the existing system. Employees value particular working arrangements; businesses depend on familiar services and charges. Together, their pressure on lawmakers can make reform difficult even when the need for change is widely recognised. Protecting every separate interest may leave the organisation unable to modernise. The total effect of these demands can therefore conflict with the survival of the system on which the groups rely.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>An agreement among parties that usually disagree can still have practical value. Changes to charges and retirement-related obligations may release money for vehicles or other urgent needs. Such a package can reduce immediate financial pressure and make collapse less likely. That achievement should be described accurately: it buys breathing space. It does not follow that every difficult question about operations and costs has been resolved by the appearance of a compromise.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>The limits become clearer when the agreement is compared with the largest sources of expenditure. If major personnel costs remain untouched and a change to delivery frequency is excluded, the scope of reform is narrow. A measure can be politically achievable precisely because it avoids powerful interests. That may help it pass, but passage alone does not show that the business has been redesigned to match the environment in which it now operates.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>A short-term rescue and a lasting transformation should not be confused. The first may be necessary to keep services running while the second is debated. Trouble arises when relief from immediate pressure is presented as proof that adaptation is complete. Lawmakers can reasonably welcome an agreement and still demand more. The standard is whether the organisation can function under changed technological and economic conditions, not merely whether it can survive the next embarrassment.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>The financial difficulty of a postal service cannot be explained by one disappointing year alone. Technology has changed demand for its traditional product, while rules restrict the way management can respond. Understanding the crisis therefore requires looking at both the market and the organisation’s ability to adapt.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Despite that combined pressure, a compromise can sometimes emerge. Lawmakers and affected groups may agree on changes to charges or retirement obligations that promise substantial savings. Such an agreement is useful if it releases resources for immediate operational needs and prevents a worsening crisis in the near term.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>Political difficulty does not disappear when a seemingly sensible proposal gains public support. A concentrated group may still have enough influence to remove it from a bill. This helps explain why a package can attract broad celebration while avoiding an option that would otherwise appear worth serious consideration.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Its ability to adapt is limited further when influential groups defend the arrangements on which they depend. Each group may seek to preserve a particular benefit or service. Their combined pressure on legislators can leave little room for changes that the organisation needs in order to modernise.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>The near-term benefit should not be mistaken for comprehensive reform. A measure may provide just enough support to keep the organisation operating while leaving its largest structural questions unanswered. To judge its significance, one must examine what the agreement does not attempt as carefully as what it includes.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>Among the changes it may fail to attempt are reforms affecting major personnel costs or the frequency of delivery. These are politically difficult precisely because established groups care about them. Leaving them untouched can make agreement easier, but it also restricts how far the measure can change the underlying business.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>Broad celebration may reflect relief rather than confidence in a transformed system. Legislators can be eager to avoid a visible short-term failure and still be reluctant to confront the interests blocking long-term change. The distinction matters because success at preventing embarrassment is a much lower standard than successful adaptation.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>Successful adaptation remains the larger task. A rescue package can serve as a useful first step, but only if its limits remain clear and further reform continues. The organisation needs more than enough money to reach the next deadline: it needs a structure capable of operating in the world its customers now inhabit.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2018英语一Text 4重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Postal Service\u003c/td>\n\u003ctd>邮政局\u003c/td>\n\u003ctd>continue\u003c/td>\n\u003ctd>v.继续\u003c/td>\n\u003ctd
