n $120 billion in unfunded liabilities, mostly for employee health and retirement costs. There are many reasons this formerly stable federal institution finds itself at the brink of bankruptcy. Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>The U.S. Postal Service (USPS) / continues to bleed red ink.\u003c/p>\n\u003cp>It reported / a net loss of $5.6 billion / for fiscal 2016, / the 10th straight year / its expenses have exceeded revenue.\u003c/p>\n\u003cp>Meanwhile, / it has more than $120 billion / in unfunded liabilities, / mostly for employee health / and retirement costs.\u003c/p>\n\u003cp>There are many reasons / this formerly stable federal institution / finds itself / at the brink of bankruptcy.\u003c/p>\n\u003cp>Fundamentally, / the USPS is in a historic squeeze / between technological change / that has permanently decreased demand / for its bread-and-butter product, / first-class mail, / and a regulatory structure / that denies management / the flexibility / to adjust its operations / to the new reality.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>美国邮政服务（USPS）/ 继续流血赤字。\u003c/p>\n\u003cp>它报告了 / 56亿美元的净亏损 / 在2016财年，/ 连续第10年 / 其支出超过收入。\u003c/p>\n\u003cp>与此同时，/ 它有超过1200亿美元 / 未备资金的负债，/ 主要用于员工健康 / 和退休成本。\u003c/p>\n\u003cp>有许多原因 / 这个曾经稳定的联邦机构 / 发现自己 / 处于破产边缘。\u003c/p>\n\u003cp>从根本上说，/ USPS处于历史性的夹缝中 / 在技术变革之间 / 这已经永久性地减少了需求 / 对其核心产品，/ 一类邮件，/ 和监管结构 / 这拒绝给管理层 / 灵活性 / 来调整其运营 / 以适应新现实。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>美国邮政服务（USPS）继续亏损。2016财年报告净亏损56亿美元，这是连续第10年支出超过收入。同时，它有超过1200亿美元的未备资金负债，主要是员工健康和退休成本。这个曾经稳定的联邦机构濒临破产有诸多原因。从根本上说，USPS处于历史性的困境中：一方面是技术变革永久性地减少了对其核心产品——一类邮件的需求，另一方面是监管结构不给管理层调整运营以适应新现实的灵活性。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS&#39;s ultimate overseer – Congress – insisting that whatever else happens to the Postal Service, aspects of the status quo they depend on get protected. This is why repeated attempts at reform legislation have failed in recent years, leaving the Postal Service unable to pay its bills except by deferring vital modernization.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>And interest groups / ranging from postal unions / to greeting-card makers / exert self-interested pressure / on the USPS&#39;s ultimate overseer – Congress – / insisting that / whatever else happens / to the Postal Service, / aspects of the status quo / they depend on / get protected.\u003c/p>\n\u003cp>This is why / repeated attempts / at reform legislation / have failed / in recent years, / leaving the Postal Service / unable to pay its bills / except by deferring / vital modernization.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>而利益集团 / 从邮政工会 / 到贺卡制造商 / 施加自私的压力 / 对USPS的最终监督者——国会—— / 坚持 / 无论发生什么 / 对邮政服务，/ 现状的方面 / 他们所依赖的 / 得到保护。\u003c/p>\n\u003cp>这就是为什么 / 反复的尝试 / 改革立法的 / 已经失败 / 在最近几年，/ 使邮政服务 / 无法支付账单 / 除了通过推迟 / 重要的现代化。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>从邮政工会到贺卡制造商等利益集团对USPS的最终监督者——国会施加自私的压力，坚持无论邮政服务发生什么变化，他们所依赖的现状必须得到保护。这就是为什么近年来反复的改革立法尝试都失败了，导致邮政服务除了推迟重要的现代化外，无法支付账单。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Now comes word that everyone involved – Democrats, Republicans, the Postal Service, the unions and the system&#39;s heaviest users – has finally agreed on a plan to fix the system. Legislation is moving through the House that would save USPS an estimated $28.6 billion over five years, which could help pay for new vehicles, among other survival measures. Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare. The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Now comes word / that everyone involved – / Democrats, Republicans, / the Postal Service, / the unions / and the system&#39;s heaviest users – / has finally agreed / on a plan / to fix the system.\u003c/p>\n\u003cp>Legislation is moving / through the House / that would save USPS / an estimated $28.6 billion / over five years, / which could help pay / for new vehicles, / among other survival measures.\u003c/p>\n\u003cp>Most of the money / would come from / a penny-per-letter / permanent rate increase / and from shifting / postal retirees / into Medicare.\u003c/p>\n\u003cp>The latter step / would largely offset / the financial burden / of annually pre-funding / retiree health care, / thus addressing / a long-standing complaint / by the USPS and its unions.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>现在传来消息 / 所有相关方—— / 民主党人、共和党人、/ 邮政服务、/ 工会 / 和系统的主要用户—— / 终于达成一致 / 关于一个计划 / 来修复这个系统。\u003c/p>\n\u003cp>立法正在推进 / 通过众议院 / 这将为USPS节省 / 估计286亿美元 / 在五年内，/ 这可以帮助支付 / 新车辆，/ 以及其他生存措施。\u003c/p>\n\u003cp>大部分资金 / 将来自 / 每封信一美分的 / 永久性费率上涨 / 以及将 / 邮政退休人员 / 转入医疗保险。\u003c/p>\n\u003cp>后一步骤 / 将大大抵消 / 财务负担 / 每年预先资助 / 退休人员医疗保健的，/ 从而解决 / 一个长期的投诉 / 由USPS及其工会提出的。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>现在传来消息，所有相关方——民主党人、共和党人、邮政服务、工会和系统的主要用户——终于就修复系统的计划达成一致。正在众议院推进的立法将在五年内为USPS节省估计286亿美元，这可以帮助支付新车辆等生存措施。大部分资金将来自每封信一美分的永久性费率上涨和将邮政退休人员转入医疗保险。后一步骤将大大抵消每年预先资助退休人员医疗保健的财务负担，从而解决USPS及其工会的长期投诉。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform. There&#39;s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency&#39;s costs. Also missing is any discussion of eliminating Saturday letter delivery. That common-sense change enjoys wide public support and would save the USPS $2 billion per year. But postal special-interest groups seem to have killed it, at least in the House. The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS. It is not, however, a sign that they&#39;re getting serious about transforming the postal system for the 21st century.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>If it clears the House, / this measure would still have to / get through the Senate – / where someone is bound to point out / that it amounts to / the bare, bare minimum / necessary to keep / the Postal Service afloat, / not comprehensive reform.\u003c/p>\n\u003cp>There&#39;s no change / to collective bargaining / at the USPS, / a major omission / considering that / personnel accounts for / 80 percent / of the agency&#39;s costs.\u003c/p>\n\u003cp>Also missing / is any discussion / of eliminating / Saturday letter delivery.\u003c/p>\n\u003cp>That common-sense change / enjoys wide public support / and would save / the USPS / $2 billion per year.\u003c/p>\n\u003cp>But postal special-interest groups / seem to have killed it, / at least in the House.\u003c/p>\n\u003cp>The emerging consensus / around the bill / is a sign / that legislators are getting frightened / about a politically embarrassing / short-term collapse / at the USPS.\u003c/p>\n\u003cp>It is not, however, / a sign / that they&#39;re getting serious / about transforming / the postal system / for the 21st century.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>如果它通过众议院，/ 这项措施仍然必须 / 通过参议院—— / 在那里肯定有人会指出 / 它只相当于 / 最低限度的最低限度 / 必要的来维持 / 邮政服务运转，/ 而非全面改革。\u003c/p>\n\u003cp>没有改变 / 集体谈判 / 在USPS，/ 一个重大遗漏 / 考虑到 / 人员开支占 / 80% / 该机构成本的。\u003c/p>\n\u003cp>同样缺失的 / 是任何讨论 / 关于取消 / 周六信件投递。\u003c/p>\n\u003cp>这个常识性的改变 / 享有广泛的公众支持 / 并将节省 / USPS / 每年20亿美元。\u003c/p>\n\u003cp>但邮政特殊利益集团 / 似乎已经扼杀了它，/ 至少在众议院。\u003c/p>\n\u003cp>正在形成的共识 / 围绕该法案 / 是一个迹象 / 立法者正在害怕 / 关于政治上尴尬的 / 短期崩溃 / 在USPS。\u003c/p>\n\u003cp>然而，它不是 / 一个迹象 / 他们正在认真对待 / 关于改造 / 邮政系统 / 为21世纪。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>如果该措施通过众议院，仍需通过参议院——在那里肯定有人会指出，这只是维持邮政服务运转的最低限度措施，而非全面改革。USPS的集体谈判没有任何改变，考虑到人员成本占该机构成本的80%，这是一个重大遗漏。同样缺失的是关于取消周六信件投递的任何讨论。这个常识性的改变享有广泛的公众支持，每年可为USPS节省20亿美元。但邮政特殊利益集团似乎已经扼杀了它，至少在众议院是这样。围绕该法案形成的共识表明，立法者正在害怕USPS出现政治上尴尬的短期崩溃。然而，这并不表明他们正在认真对待为21世纪改造邮政系统。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>The U.S. Postal Service (USPS) → continues to bleed red ink.\u003c/p>\n\u003cp>It reported → a net loss of $5.6 billion：(for fiscal 2016)：(the 10th straight year：(its expenses have exceeded revenue)).\u003c/p>\n\u003cp>Meanwhile → it has more than $120 billion：(in unfunded liabilities)：(mostly for employee health + retirement costs).\u003c/p>\n\u003cp>There are many reasons：(this formerly stable federal institution → finds itself：(at the brink of bankruptcy)).\u003c/p>\n\u003cp>Fundamentally → the USPS is in a historic squeeze：(between technological change：(that has permanently decreased demand：(for its bread-and-butter product：(first-class mail))) + a regulatory structure：(that denies management → the flexibility：(to adjust its operations：(to the new reality)))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>And interest groups：(ranging from postal unions → to greeting-card makers) → exert self-interested pressure：(on the USPS&#39;s ultimate overseer – Congress)：(insisting that：(whatever else happens：(to the Postal Service) → aspects of the status quo：(they depend on) → get protected)).\u003c/p>\n\u003cp>This is why → repeated attempts：(at reform legislation) → have failed：(in recent years) → leaving the Postal Service：(unable to pay its bills：(except by deferring：(vital modernization))).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Now comes word：(that everyone involved – Democrats + Republicans + the Postal Service + the unions + the system&#39;s heaviest users – → has finally agreed：(on a plan：(to fix the system))).\u003c/p>\n\u003cp>Legislation is moving：(through the House)：(that would save USPS → an estimated $28.6 billion：(over five years))：(which could help pay：(for new vehicles)：(among other survival measures)).\u003c/p>\n\u003cp>Most of the money → would come from：(a penny-per-letter：(permanent rate increase) + shifting：(postal retirees：(into Medicare))).\u003c/p>\n\u003cp>The latter step → would largely offset → the financial burden：(of annually pre-funding：(retiree health care)) → thus addressing → a long-standing complaint：(by the USPS and its unions).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>If it clears the House → this measure would still have to → get through the Senate：(where someone is bound to point out：(that it amounts to → the bare, bare minimum：(necessary to keep → the Postal Service afloat) // not comprehensive reform)).\u003c/p>\n\u003cp>There&#39;s no change：(to collective bargaining：(at the USPS)) → a major omission：(considering that：(personnel accounts for → 80 percent：(of the agency&#39;s costs))).\u003c/p>\n\u003cp>Also missing → is any discussion：(of eliminating：(Saturday letter delivery)).\u003c/p>\n\u003cp>That common-sense change → enjoys wide public support + would save → the USPS → $2 billion per year.\u003c/p>\n\u003cp>But postal special-interest groups → seem to have killed it：(at least in the House).\u003c/p>\n\u003cp>The emerging consensus：(around the bill) → is a sign：(that legislators are getting frightened：(about a politically embarrassing：(short-term collapse：(at the USPS)))).\u003c/p>\n\u003cp>It is not, however → a sign：(that they&#39;re getting serious：(about transforming：(the postal system：(for the 21st century)))).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>美国邮政服务（USPS）→ 继续流血赤字。\u003c/p>\n\u003cp>它报告了 → 56亿美元的净亏损：(在2016财年)：(连续第10年：(其支出超过收入))。\u003c/p>\n\u003cp>与此同时 → 它有超过1200亿美元：(未备资金的负债)：(主要用于员工健康 + 退休成本)。\u003c/p>\n\u003cp>有许多原因：(这个曾经稳定的联邦机构 → 发现自己：(处于破产边缘))。\u003c/p>\n\u003cp>从根本上说 → USPS处于历史性的夹缝中：(在技术变革之间：(这已经永久性地减少了需求：(对其核心产品：(一类邮件))) + 监管结构：(这拒绝给管理层 → 灵活性：(来调整其运营：(以适应新现实))))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>而利益集团：(从邮政工会 → 到贺卡制造商) → 施加自私的压力：(对USPS的最终监督者——国会)：(坚持：(无论发生什么：(对邮政服务) → 现状的方面：(他们所依赖的) → 得到保护))。\u003c/p>\n\u003cp>这就是为什么 → 反复的尝试：(改革立法的) → 已经失败：(在最近几年) → 使邮政服务：(无法支付账单：(除了通过推迟：(重要的现代化)))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>现在传来消息：(所有相关方——民主党人 + 共和党人 + 邮政服务 + 工会 + 系统的主要用户—— → 终于达成一致：(关于一个计划：(来修复这个系统)))。\u003c/p>\n\u003cp>立法正在推进：(通过众议院)：(这将为USPS节省 → 估计286亿美元：(在五年内))：(这可以帮助支付：(新车辆)：(以及其他生存措施))。\u003c/p>\n\u003cp>大部分资金 → 将来自：(每封信一美分的：(永久性费率上涨) + 将：(邮政退休人员：(转入医疗保险)))。\u003c/p>\n\u003cp>后一步骤 → 将大大抵消 → 财务负担：(每年预先资助：(退休人员医疗保健的)) → 从而解决 → 一个长期的投诉：(由USPS及其工会提出的)。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>如果它通过众议院 → 这项措施仍然必须 → 通过参议院：(在那里肯定有人会指出：(它只相当于 → 最低限度的最低限度：(必要的来维持 → 邮政服务运转) // 而非全面改革))。\u003c/p>\n\u003cp>没有改变：(集体谈判：(在USPS)) → 一个重大遗漏：(考虑到：(人员开支占 → 80%：(该机构成本的)))。\u003c/p>\n\u003cp>同样缺失的 → 是任何讨论：(关于取消：(周六信件投递))。\u003c/p>\n\u003cp>这个常识性的改变 → 享有广泛的公众支持 + 将节省 → USPS → 每年20亿美元。\u003c/p>\n\u003cp>但邮政特殊利益集团 → 似乎已经扼杀了它：(至少在众议院)。\u003c/p>\n\u003cp>正在形成的共识：(围绕该法案) → 是一个迹象：(立法者正在害怕：(关于政治上尴尬的：(短期崩溃：(在USPS))))。\u003c/p>\n\u003cp>然而，它不是 → 一个迹象：(他们正在认真对待：(关于改造：(邮政系统：(为21世纪))))。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第1段第5句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Fundamentally, / the USPS is in a historic squeeze / between technological change / that has permanently decreased demand / for its bread-and-butter product, / first-class mail, / and a regulatory structure / that denies management / the flexibility / to adjust its operations / to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>从根本上说，/ USPS处于历史性的夹缝中 / 在技术变革之间 / 这已经永久性地减少了需求 / 对其核心产品，/ 一类邮件，/ 和监管结构 / 这拒绝给管理层 / 灵活性 / 来调整其运营 / 以适应新现实。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把between连接的两股压力分别合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>技术变革永久减少了对核心产品一类邮件的需求\u003c/p>\n\u003c/blockquote>\n\u003cp>再合并另一股压力及其限制动作。：\u003c/p>\n\u003cblockquote>\n\u003cp>监管结构不给管理层调整运营、适应新现实的灵活性\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>技术变革永久减少了对核心产品一类邮件的需求；监管结构不给管理层调整运营、适应新现实的灵活性。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>USPS夹在需求下降与监管限制之间。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写根本困境，再用一方面、另一方面呈现两股力量；first-class mail作核心产品的同位说明。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>从根本上讲，USPS受到历史性的双向挤压：技术变化永久降低了对其核心产品一类邮件的需求，而监管结构又不让管理层拥有调整运营、适应新现实的灵活性。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>bread-and-butter指赖以维持经营的核心业务，不按食品直译。\u003c/p>\n\u003cp>permanently说明需求变化具有长期性；denies指制度不给灵活空间，不能归因于管理层不愿调整。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>从根本上说，USPS处于历史性的困境中：一方面是技术变革永久性地减少了对其核心产品——一类邮件的需求，另一方面是监管结构不给管理层调整运营以适应新现实的灵活性。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第2段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS&#39;s ultimate overseer – Congress – insisting that whatever else happens to the Postal Service, aspects of the status quo they depend on get protected.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>And interest groups / ranging from postal unions / to greeting-card makers / exert self-interested pressure / on the USPS&#39;s ultimate overseer – Congress – / insisting that / whatever else happens / to the Postal Service, / aspects of the status quo / they depend on / get protected.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>而利益集团 / 从邮政工会 / 到贺卡制造商 / 施加自私的压力 / 对USPS的最终监督者——国会—— / 坚持 / 无论发生什么 / 对邮政服务，/ 现状的方面 / 他们所依赖的 / 得到保护。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把ranging from的两个端点合并为利益集团的范围。：\u003c/p>\n\u003cblockquote>\n\u003cp>从邮政工会到贺卡制造商等利益集团\u003c/p>\n\u003c/blockquote>\n\u003cp>再合并施压对象和坚持的要求。：\u003c/p>\n\u003cblockquote>\n\u003cp>向最终监管者国会施加利己压力，要求无论怎样变化都保护自身依赖的现状\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>从邮政工会到贺卡制造商等利益集团；向最终监管者国会施加利己压力，要求无论怎样变化都保护自身依赖的现状。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>利益集团向国会施压，要求保住自身依赖的现状。\u003c/p>\n\u003c/blockquote>\n\u003cp>范围放在主体内；破折号说明监督者就是国会；whatever引导让步，放在保护现状前说明要求不随其他变化而改变。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>从邮政工会到贺卡制造商的利益集团，出于自身利益，向USPS的最终监督者国会施压，坚持不论邮政服务有其他什么变化，都要保护他们所依赖的现状。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>ultimate overseer的对象是国会，不是邮政工会或企业管理层。\u003c/p>\n\u003cp>they depend on指集团依赖的既得安排，不能译成所有公众都依赖的必要服务。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>从邮政工会到贺卡制造商等利益集团对USPS的最终监督者——国会施加自私的压力，坚持无论邮政服务发生什么变化，他们所依赖的现状必须得到保护。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>If it clears the House, / this measure would still have to / get through the Senate – / where someone is bound to point out / that it amounts to / the bare, bare minimum / necessary to keep / the Postal Service afloat, / not comprehensive reform.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>如果它通过众议院，/ 这项措施仍然必须 / 通过参议院—— / 在那里肯定有人会指出 / 它只相当于 / 最低限度的最低限度 / 必要的来维持 / 邮政服务运转，/ 而非全面改革。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把两个院的程序先后合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>即便通过众议院，该措施仍须通过参议院\u003c/p>\n\u003c/blockquote>\n\u003cp>再把where之后对措施力度的评价合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>有人必会指出，它只是维持邮政服务的最低限度补救，而非全面改革\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>即便通过众议院，该措施仍须通过参议院；有人必会指出，它只是维持邮政服务的最低限度补救，而非全面改革。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>措施还须过参议院，并会被指出只是最低限度补救。\u003c/p>\n\u003c/blockquote>\n\u003cp>if条件先放在句首；where在此接参议院中的议论；bare, bare minimum的重复保留为强烈的最低限度。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>如果这项措施通过众议院，它还必须通过参议院；在那里，一定有人会指出，这只是让邮政服务维持运转所必需的最低限度办法，并不是全面改革。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>keep afloat按企业维持运转译，不写成已经让邮政扭亏为盈。\u003c/p>\n\u003cp>not comprehensive reform限定法案的不足，不等于作者认为它一无用处。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>如果该措施通过众议院，仍需通过参议院——在那里肯定有人会指出，这只是维持邮政服务运转的最低限度措施，而非全面改革。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>40题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪个最适合作为文章的标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>The USPS Starts to Miss Its Good Old Days\u003c/strong>\u003c/p>\n\u003cp>USPS开始怀念过去的好日子\u003c/p>\n\u003cp>B. \u003cstrong>The Postal Service: Keep Away from My Cheese\u003c/strong>\u003c/p>\n\u003cp>邮政局：别动我的奶酪\u003c/p>\n\u003cp>C. \u003cstrong>The USPS: Chronic Illness Requires a Quick Cure\u003c/strong>\u003c/p>\n\u003cp>USPS：慢性病需要速治\u003c/p>\n\u003cp>D. \u003cstrong>The Postal Service Needs More than a Band-Aid\u003c/strong>\u003c/p>\n\u003cp>邮政局需要的不只是一块创可贴\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。\u003c/td>\n\u003ctd>先摆出眼前的难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>写利益群体坚持维护现状，对国会形成压力，使改革立法反复失败，现代化也受到拖累。\u003c/td>\n\u003ctd>再说为什么一直没有解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>介绍各方终于同意的方案，包括提高每封信邮费、转移医疗承担，以及五年节省资金等预计效果。\u003c/td>\n\u003ctd>接着摆出一个看似可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出法案只到最低限度，仍缺重要改变，周六投递的讨论也被挡下；结尾说怕眼前政治难堪不等于认真改造21世纪邮政体系。\u003c/td>\n\u003ctd>最后说这样还是不够\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>A. The USPS Starts to Miss Its Good Old Days\u003c/h3>\n\u003cp>USPS开始怀念过去的好日子\u003c/p>\n\u003ch4>如果 A 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>USPS开始怀念过去的好日子\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以邮政当前亏损为难题，突出它开始怀念昔日稳定繁荣。\u003c/td>\n\u003ctd>先摆出眼前的难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明过去支持邮政的条件为何消失，使怀旧与现实之间迟迟无法调和。\u003c/td>\n\u003ctd>再说为什么一直没有解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>介绍一种仿效旧时代运营方式、恢复昔日好景的办法。\u003c/td>\n\u003ctd>接着摆出一个看似可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出这办法仍不能带回从前，从而收束邮政对旧日的怀念。\u003c/td>\n\u003ctd>最后说这样还是不够\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A中的Good Old Days能让人想到首段formerly stable，但那三个词只是把过去稳定与如今困难作一个背景对照。后面作者并没有叙述过去服务有多好、员工有多自豪，或邮政局现在怎样怀念旧日生活；第2段在讲改革为什么被阻挡，第3段介绍新方案，第4段批评方案没有真正面向21世纪。文章的方向是应该怎样改变，而不是邮政局的怀旧心理。A把开头的一处时间对照扩大成感伤主题，无法解释中后段具体的立法措施和作者对改革力度的判断。\u003c/p>\n\u003cp>首段说机构原本稳定，就足以让三段改革讨论变成邮政局怀念过去的故事吗？\u003c/p>\n\u003cp>不能。作者用过去作对照，是为了说明眼前需要改变，不是在描述怀旧情绪。\u003c/p>\n\u003cp>A需要全文沿着“怀念往日”走，实际全文却沿着“困难—阻力—方案—仍然不足”往前推进。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>B. The Postal Service: Keep Away from My Cheese\u003c/h3>\n\u003cp>邮政局：别动我的奶酪\u003c/p>\n\u003ch4>如果 B 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>邮政局：别动我的奶酪\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>把邮政改革困境表现为各利益方不肯让人动自己利益的冲突。\u003c/td>\n\u003ctd>先摆出眼前的难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明保护各自份额的群体为何不断阻碍改革，维持旧有利益。\u003c/td>\n\u003ctd>再说为什么一直没有解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>介绍一个试图不触碰各方既得利益而达成的折中方案。\u003c/td>\n\u003ctd>接着摆出一个看似可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出只求别动各人的利益仍不能解决问题，把中心落回利益保护造成的阻滞。\u003c/td>\n\u003ctd>最后说这样还是不够\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的Keep Away from My Cheese用“别动我的奶酪”表现守住既有利益，确实能接上第2段的status quo they depend on get protected，也能接到末段特殊利益群体挡下周六投递改变。因此它比怀旧题材更贴近文章的一部分。但作者还用整段介绍达成一致的法案和省钱安排，最后的核心判断是这些办法只够维持最低限度，不能替代真正改造。利益群体是改革为什么难的原因之一，不是全文唯一的被讨论对象。若B统领全文，第三段措施的作用会只剩下“保护奶酪”，而实际作者承认它能改善资金，只是认为远远不够。\u003c/p>\n\u003cp>维护既有利益能解释改革阻力，但能否独自覆盖作者对新方案“有作用却仍不足”的完整评价？\u003c/p>\n\u003cp>不能。它抓住了一个重要原因，却没有说出本文最后落下的改革要求。\u003c/p>\n\u003cp>B用局部阻力替代对整个改革方案的判断，容易读到第2段便停住，而忽略第3、4段之间先介绍再批评的推进。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>C. The USPS: Chronic Illness Requires a Quick Cure\u003c/h3>\n\u003cp>USPS：慢性病需要速治\u003c/p>\n\u003ch4>如果 C 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>USPS：慢性病需要速治\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>把长期亏损比作慢性病，强调邮政当下急需快速治疗。\u003c/td>\n\u003ctd>先摆出眼前的难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明反复拖延的原因，以拖延代价强化迅速干预的必要性。\u003c/td>\n\u003ctd>再说为什么一直没有解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>摆出能够立即推进的方案，论证它为什么有望迅速缓解病情。\u003c/td>\n\u003ctd>接着摆出一个看似可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出现有速度和力度仍不够，要求进一步加快治疗以免慢病恶化。\u003c/td>\n\u003ctd>最后说这样还是不够\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C的Chronic Illness能接上首段连续十年收支失衡，但Quick Cure把解决方向落在迅速治好。实际第3段已经有一项旨在维持生存、改善近期财务的方案，第4段却批评它只是bare, bare minimum，并非足以改造邮政体系。作者不是嫌这种短期办法动作不够快，主要是嫌它动得不够深、关键安排没有改变。末句将short-term与for the 21st century放在对照里，更说明眼前解围与长期转型不是同一件事。C只讲迅速，反而容易把作者认为不能满足的急救办法读成他所追求的终点。\u003c/p>\n\u003cp>作者嫌方案只够眼前最低限度，这个判断主要是在要求更快治，还是要求不止于眼前修补？\u003c/p>\n\u003cp>后者。关键是改革的深度和范围，而不是单纯速度。\u003c/p>\n\u003cp>C正确识别困难长期存在，却把作者所要求的改革性质换成了速效处理，不能保留末段的主要对照。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title for the text?\u003c/strong>\u003c/p>\n\u003ch3>D. The Postal Service Needs More than a Band-Aid\u003c/h3>\n\u003cp>邮政局需要的不只是一块创可贴\u003c/p>\n\u003ch4>如果 D 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>邮政局需要的不只是一块创可贴\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>列出亏损与结构性困境，说明问题不只是眼前的资金缺口。\u003c/td>\n\u003ctd>先摆出眼前的难题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释利益群体保现状如何阻挡改革，使深层运营问题长期得不到解决。\u003c/td>\n\u003ctd>再说为什么一直没有解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>介绍涨价和退休医疗安排，承认它们能提供实际但有限的财务缓解。\u003c/td>\n\u003ctd>接着摆出一个看似可行的办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出最低限度救急未改人员成本和投递安排，要求超越创可贴式修补的全面改革。\u003c/td>\n\u003ctd>最后说这样还是不够\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D的Band-Aid先按字面读作创可贴，代回文章是在比喻只能短期缓解的修补。Needs More than没有否认眼前方案能省钱，而是说不止需要这些：第3段的资金效果可以保留，第4段的最低限度、未改变事项和未讨论事项也都能接上。首段给出长期财务与运营结构的难题，第2段给出改革阻力，因此最后要求的不可能只是一项临时补账办法。D比B多保留了对新方案的评价，又比C准确地区分“快一点”和“改得更充分”。\u003c/p>\n\u003cp>把现有方案看成有帮助但远远不够的修补，是否能够贯通困难、阻力、方案和最后的批评？\u003c/p>\n\u003cp>能够。D同时容纳方案的有限作用和作者对更充分改革的要求。\u003c/p>\n\u003cp>这个标题不需要抹掉第3段的正面数字，也不需要弱化第4段的否定。More than正好把“已经做了一点”与“仍需要更多”接在一起。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 保留。\u003c/strong>\u003c/p>\n\u003ch3>40题结论\u003c/h3>\n\u003cp>\u003cstrong>40. D. The Postal Service Needs More than a Band-Aid\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>The Postal Service Needs More than a Band-Aid / 邮政局需要的不只是一块创可贴\u003c/strong>\u003c/p>\n\u003ch2>36题\u003c/h2>\n\u003cblockquote>\n\u003cp>The financial problem with the USPS is caused partly by ______.\u003cbr>USPS的财务问题，部分是由什么造成的？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“USPS的财务问题，部分是由什么造成的？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The U.S. Postal Service (USPS) continues to bleed red ink. It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue. Meanwhile, it has more than $120 billion in unfunded liabilities, mostly for employee health and retirement costs. There are many reasons this formerly stable federal institution finds itself at the brink of bankruptcy. Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003cp>首段先报告连续亏损与负债，再用Fundamentally解释两面夹击：技术使需求下降，监管结构又不许管理层灵活调整。\u003c/p>\n\u003ch3>A. its unbalanced budget\u003c/h3>\n\u003cblockquote>\n\u003cp>其失衡的预算\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“its [xxx] budget”，保留了相应遮挡。当时的定位线索是：A的budget涉及收支安排，第1段its expenses have exceeded revenue也谈支出和收入，因此先回看开头的财务描述，再看Fundamentally之后的原因说明，别先替budget前面的词定意思。读完全文后，做题模式再经交叉验证排除A，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>第1段列支出超过收入，确实描述了收支不平衡的财务结果。但题干问问题部分由什么造成，不能把亏损这个表现直接当成作者给出的原因。\u003c/p>\n\u003cp>A把财务表现改写成unbalanced budget，缺少原文明确给出的因果说明。报告已经亏损，不等于说制定失衡预算是导致亏损的原因；B保留了监管结构妨碍调整这一解释。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.\u003c/p>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>USPS的财务问题部分由其失衡的预算造成。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的budget涉及收支安排，第1段its expenses have exceeded revenue也谈支出和收入，因此先回看开头的财务描述，再看Fundamentally之后的原因说明，别先替budget前面的词定意思。\u003c/p>\n\u003cp>第1段列支出超过收入，确实描述了收支不平衡的财务结果。但题干问问题部分由什么造成，不能把亏损这个表现直接当成作者给出的原因。\u003c/p>\n\u003cp>Fundamentally引出双重挤压：技术变化减少核心邮件需求，监管结构又不给管理层调整运营的灵活性。B的rigid management对应后一个制度限制，并非责怪管理者个人态度僵硬。\u003c/p>\n\u003cp>A把财务表现改写成unbalanced budget，缺少原文明确给出的因果说明。报告已经亏损，不等于说制定失衡预算是导致亏损的原因；B保留了监管结构妨碍调整这一解释。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.\u003c/p>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003cp>首段先报告连续亏损与负债，再用Fundamentally解释两面夹击：技术使需求下降，监管结构又不许管理层灵活调整。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The USPS is in difficulty because it had an unbalanced budget.\u003c/p>\n\u003cp>USPS陷入困境是因为它存在收支不平衡的预算。\u003c/p>\n\u003c/blockquote>\n\u003cp>支出超过收入说明实际亏损，不等于预算编制失衡已被证明为原因。原段在Fundamentally后转向需求与调整机制，不能把结果再写成原因。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨认为短期补钱不够，本题应区分账目困境与导致困境的制度原因。僵化如何阻碍适应，要由denies management the flexibility坐实。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>its unbalanced budget\u003cbr>其失衡的预算\u003c/p>\n\u003c/blockquote>\n\u003cp>A把财务表现改写成unbalanced budget，缺少原文明确给出的因果说明。报告已经亏损，不等于说制定失衡预算是导致亏损的原因；B保留了监管结构妨碍调整这一解释。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. its rigid management\u003c/h3>\n\u003cblockquote>\n\u003cp>其僵化的管理\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的rigid management说管理僵硬、不灵活，原文denies management the flexibility也直接出现management和flexibility，因此回看这种缺少灵活性妨碍了什么。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>denies management the flexibility后面接to adjust its operations to the new reality，说管理层缺乏调整经营以适应新现实的余地。B的rigid management把这种缺少灵活性的状况简写成僵化管理，并没有额外说管理人员智力低或道德差。原句用between…and摆出两个方面：技术改变需求，制度结构又让运营难以调整。题干有partly，所以B只回答管理这一方面即可，不必同时把技术因素塞进去。它接的是Fundamentally之后的原因，而不只是开头亏损数字。\u003c/p>\n\u003cp>B保留了管理与运营调整之间的关系，也符合题干只问部分原因的范围。不能把“结构限制管理”误读成与管理僵化毫无关系。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>USPS的财务问题部分由其僵化的管理造成。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的rigid management说管理僵硬、不灵活，原文denies management the flexibility也直接出现management和flexibility，因此回看这种缺少灵活性妨碍了什么。\u003c/p>\n\u003cp>denies management the flexibility后面接to adjust its operations to the new reality，说管理层缺乏调整经营以适应新现实的余地。B的rigid management把这种缺少灵活性的状况简写成僵化管理，并没有额外说管理人员智力低或道德差。原句用between…and摆出两个方面：技术改变需求，制度结构又让运营难以调整。题干有partly，所以B只回答管理这一方面即可，不必同时把技术因素塞进去。它接的是Fundamentally之后的原因，而不只是开头亏损数字。\u003c/p>\n\u003cp>B保留了管理与运营调整之间的关系，也符合题干只问部分原因的范围。不能把“结构限制管理”误读成与管理僵化毫无关系。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003cp>首段先报告连续亏损与负债，再用Fundamentally解释两面夹击：技术使需求下降，监管结构又不许管理层灵活调整。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The USPS cannot flexibly adjust operations because of its rigid regulatory management structure.\u003c/p>\n\u003cp>USPS因僵化的监管管理结构而无法灵活调整运营。\u003c/p>\n\u003c/blockquote>\n\u003cp>denies...flexibility直接说明管理僵化怎样妨碍运营调整，和需求永久下降共同构成财务夹击。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨认为短期补钱不够，本题应区分账目困境与导致困境的制度原因。僵化如何阻碍适应，要由denies management the flexibility坐实。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>its rigid management\u003cbr>其僵化的管理\u003c/p>\n\u003c/blockquote>\n\u003cp>B保留了管理与运营调整之间的关系，也符合题干只问部分原因的范围。不能把“结构限制管理”误读成与管理僵化毫无关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. the cost for technical upgrading\u003c/h3>\n\u003cblockquote>\n\u003cp>技术升级的成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的cost for technical upgrading与第1段technological change都提到技术，但原文紧接permanently decreased demand说需求变化，因此回看技术在原因链里改变的是支出还是需求。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>permanently decreased demand的宾语是demand，技术变革让一类邮件的需求减少，描述的是外部市场变了。C的cost for technical upgrading则把技术影响改成邮政局自己购买、升级技术的费用，描述的是内部多花了钱。即使两种情况都可能与财务困难有关，它们也不是同一条因果：原文写“业务需求少了”，C写“升级支出多了”。这里的technical与technological相近，只能帮助找到讨论技术的句子，不能让后面的demand和cost自动变成同义词。\u003c/p>\n\u003cp>C把技术作用的方向和对象同时换掉了。原因题必须保留这条因果，不能找到“技术”这个主题词就停。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>USPS的财务问题部分由技术升级的成本造成。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的cost for technical upgrading与第1段technological change都提到技术，但原文紧接permanently decreased demand说需求变化，因此回看技术在原因链里改变的是支出还是需求。\u003c/p>\n\u003cp>permanently decreased demand的宾语是demand，技术变革让一类邮件的需求减少，描述的是外部市场变了。C的cost for technical upgrading则把技术影响改成邮政局自己购买、升级技术的费用，描述的是内部多花了钱。即使两种情况都可能与财务困难有关，它们也不是同一条因果：原文写“业务需求少了”，C写“升级支出多了”。这里的technical与technological相近，只能帮助找到讨论技术的句子，不能让后面的demand和cost自动变成同义词。\u003c/p>\n\u003cp>C把技术作用的方向和对象同时换掉了。原因题必须保留这条因果，不能找到“技术”这个主题词就停。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003cp>首段先报告连续亏损与负债，再用Fundamentally解释两面夹击：技术使需求下降，监管结构又不许管理层灵活调整。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The cost of upgrading its technology has caused the financial problem.\u003c/p>\n\u003cp>升级技术的成本导致了这一财务问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>第二段说因无法支付账单而推迟现代化，方向是缺钱妨碍升级，不是已经大量升级导致亏损。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨认为短期补钱不够，本题应区分账目困境与导致困境的制度原因。僵化如何阻碍适应，要由denies management the flexibility坐实。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the cost for technical upgrading\u003cbr>技术升级的成本\u003c/p>\n\u003c/blockquote>\n\u003cp>C把技术作用的方向和对象同时换掉了。原因题必须保留这条因果，不能找到“技术”这个主题词就停。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. the withdrawal of bank support\u003c/h3>\n\u003cblockquote>\n\u003cp>银行撤回支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时选项呈现为“the [xxx] of bank support”，保留了相应遮挡。当时的定位线索是：D的bank support说资金支持来自银行，第1段unfunded涉及资金未获保障，因此回看这一财务描述具体指向什么费用，以及原因句有没有把资金关系落在银行身上。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>unfunded后面那个名词没有读清，但后面的mostly for把费用指向员工医疗与退休。D的bank support却增加了银行这一资金提供者，还把银行支持发生的变化用来解释财务困难。围绕银行支持怎样变化，这一段找不到一句能直接说到这件事。资金没有着落不等于已知是某家银行的支持出了变化；原文的明确原因继续落到需求和经营灵活性，不是银行—邮政局之间的融资关系。\u003c/p>\n\u003cp>D不是对原句财务词的简写，而是另添一个参与者和一条因果。题目问文章说明的部分原因，不能用这条新关系代替已经写出的原因。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Meanwhile, it has more than $120 billion in unfunded liabilities, mostly for employee health and retirement costs.\u003c/p>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>USPS的财务问题部分由银行撤回支持造成。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的bank support说资金支持来自银行，第1段unfunded涉及资金未获保障，因此回看这一财务描述具体指向什么费用，以及原因句有没有把资金关系落在银行身上。\u003c/p>\n\u003cp>unfunded后面那个名词没有读清，但后面的mostly for把费用指向员工医疗与退休。D的bank support却增加了银行这一资金提供者，还把银行支持发生的变化用来解释财务困难。围绕银行支持怎样变化，这一段找不到一句能直接说到这件事。资金没有着落不等于已知是某家银行的支持出了变化；原文的明确原因继续落到需求和经营灵活性，不是银行—邮政局之间的融资关系。\u003c/p>\n\u003cp>缺钱的状态本身并没有确定资金原本来自银行，也没有建立银行支持变化导致困难的关系。\u003c/p>\n\u003cp>D不是对原句财务词的简写，而是另添一个参与者和一条因果。题目问文章说明的部分原因，不能用这条新关系代替已经写出的原因。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Meanwhile, it has more than $120 billion in unfunded liabilities, mostly for employee health and retirement costs.\u003c/p>\n\u003cp>Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.\u003c/p>\n\u003cp>首段先报告连续亏损与负债，再用Fundamentally解释两面夹击：技术使需求下降，监管结构又不许管理层灵活调整。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Banks have withdrawn the financial support on which the USPS relied.\u003c/p>\n\u003cp>银行撤回了USPS所依赖的资金支持。\u003c/p>\n\u003c/blockquote>\n\u003cp>净负债不说明银行撤资，原段也无借贷机构的行动。假设必须增加融资关系，不能从濒临破产自行补出。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨认为短期补钱不够，本题应区分账目困境与导致困境的制度原因。僵化如何阻碍适应，要由denies management the flexibility坐实。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the withdrawal of bank support\u003cbr>银行撤回支持\u003c/p>\n\u003c/blockquote>\n\u003cp>D不是对原句财务词的简写，而是另添一个参与者和一条因果。题目问文章说明的部分原因，不能用这条新关系代替已经写出的原因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先列长期亏损、员工医疗和退休费用等财务困境，再解释技术减少邮件需求与结构不给管理调整灵活性这两方面。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>36题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>36. B. its rigid management\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：第1段列支出超过收入，确实描述了收支不平衡的财务结果。\u003c/p>\n\u003cp>B：denies management the flexibility后面接to adjust its operations to the new reality，说管理层缺乏调整经营以适应新现实的余地。\u003c/p>\n\u003cp>C：permanently decreased demand的宾语是demand，技术变革让一类邮件的需求减少，描述的是外部市场变了。\u003c/p>\n\u003cp>D：unfunded后面那个名词没有读清，但后面的mostly for把费用指向员工医疗与退休。\u003c/p>\n\u003ch2>37题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Paragraph 2, the USPS fails to modernize itself due to ______.\u003cbr>根据第2段，USPS未能实现现代化的原因是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“根据第2段，USPS未能实现现代化的原因是什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS&#39;s ultimate overseer – Congress – insisting that whatever else happens to the Postal Service, aspects of the status quo they depend on get protected. This is why repeated attempts at reform legislation have failed in recent years, leaving the Postal Service unable to pay its bills except by deferring vital modernization.\u003c/p>\n\u003c/blockquote>\n\u003cp>利益群体要求国会保护自己依赖的现状，使多次改革立法失败，邮政只能推迟重要现代化来应付账单。\u003c/p>\n\u003ch3>A. the interference from interest groups\u003c/h3>\n\u003cblockquote>\n\u003cp>利益群体的干预\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“the [xxx] from interest groups”，保留了相应遮挡。当时的定位线索是：A的from interest groups明确说事情来自利益群体，原文interest groups也正是段首主语；因此回看它们对国会做什么，再把This is why后的后果接上。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>接下去This is why直接把这些要求与改革立法屡次失败连起来，再落到现代化无法正常推进。A的from interest groups保留了这一原因的发出者，没有把国会写成资金提供者，也没有把工会描写成没有能力做事。A的名词先照原样留着，但前后所指的来源能和本段整条因果接上。\u003c/p>\n\u003cp>段内This is why已经把前面的要求与后面的受阻连接起来。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>This is why repeated attempts at reform legislation have failed in recent years, leaving the Postal Service unable to pay \u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>细节对应题。题干要求判断“USPS及其工会长期以来的抱怨，可以通过什么办法得到解决？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Now comes word that everyone involved – Democrats, Republicans, the Postal Service, the unions and the system&#39;s heaviest users – has finally agreed on a plan to fix the system. Legislation is moving through the House that would save USPS an estimated $28.6 billion over five years, which could help pay for new vehicles, among other survival measures. Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare. The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.\u003c/p>\n\u003c/blockquote>\n\u003cp>第三段列涨价与将退休人员转入Medicare两项节支来源，The latter step专指后者，抵消每年预存退休医疗费的负担。\u003c/p>\n\u003ch3>A. removing its burden of retiree health care\u003c/h3>\n\u003cblockquote>\n\u003cp>解除退休人员医疗保健负担\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“removing its burden of [xxx] health care”，保留了相应遮挡。当时的定位线索是：A的burden of health care与末句financial burden、health care都说医疗负担，因此回看The latter step指向的转入Medicare怎样与addressing a long-standing complaint连接。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>financial burden后面明确接医疗相关支出，thus addressing又直接说明处理这项负担会回应长期抱怨。A的burden of保留了这一对象，removing说的是解除机构背负的负担，并不是取消患者获得医疗的权利。The latter step回指两项措施中的后一项，即把邮政退休人员转入Medicare；这样前面的安排、后面的医疗负担和抱怨才能串起来。\u003c/p>\n\u003cp>这里的解除负担按原句largely理解为实质减轻这项承担，不夸成所有医疗成本都彻底消失。A保留了被处理的具体负担。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare.\u003c/p>\n\u003cp>The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>USPS和工会的长期抱怨可以通过解除退休人员医疗保健负担得到缓解。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的burden of health care与末句financial burden、health care都说医疗负担，因此回看The latter step指向的转入Medicare怎样与addressing a long-standing complaint连接。\u003c/p>\n\u003cp>financial burden后面明确接医疗相关支出，thus addressing又直接说明处理这项负担会回应长期抱怨。A的burden of保留了这一对象，removing说的是解除机构背负的负担，并不是取消患者获得医疗的权利。The latter step回指两项措施中的后一项，即把邮政退休人员转入Medicare；这样前面的安排、后面的医疗负担和抱怨才能串起来。\u003c/p>\n\u003cp>题目问的抱怨对象正是这一项，而非该方案所有花钱和省钱的事项。\u003c/p>\n\u003cp>这里的解除负担按原句largely理解为实质减轻这项承担，不夸成所有医疗成本都彻底消失。A保留了被处理的具体负担。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare.\u003c/p>\n\u003cp>The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.\u003c/p>\n\u003cp>第三段列涨价与将退休人员转入Medicare两项节支来源，The latter step专指后者，抵消每年预存退休医疗费的负担。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：介绍各方终于同意的方案，包括提高每封信邮费、转移医疗承担，以及五年节省资金等预计效果。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Shifting retirees into Medicare would largely offset the pre-funding burden for retiree health care.\u003c/p>\n\u003cp>将退休人员转入联邦医疗保险，会大幅抵消为退休医疗预先筹资的负担。\u003c/p>\n\u003c/blockquote>\n\u003cp>the latter step精确回指Medicare安排，thus addressing说明它为何回应抱怨；largely offset仍保留缓解程度，不夸成消灭所有负债。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The Postal Service Needs More than a Band-Aid\u003cbr>邮政局需要的不只是一块创可贴\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c
