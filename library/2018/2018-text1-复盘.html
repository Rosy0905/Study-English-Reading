able to do so / without going into debt.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>第一步，/ 正如埃里克·布林约尔松和安德鲁·麦卡菲所论证的 / 在《第二机器时代》中，/ 应该是重新思考 / 教育和职业培训。</p>\n<p>课程 – / 从文法学校到大学 – / 应该演变 / 更少关注 / 记忆事实 / 而更多 / 关注创造力和复杂沟通。</p>\n<p>职业学校 / 应该做得更好 / 在培养解决问题的技能方面 / 并帮助学生 / 与机器人一起工作。</p>\n<p>在线教育 / 可以补充 / 传统教育。</p>\n<p>它可以使 / 额外的培训和指导 / 负担得起。</p>\n<p>专业人士 / 试图获得新技能的 / 将能够这样做 / 而不用负债。</p>\n<h3>标准译文 · 第4段</h3>\n<p>第一步，正如埃里克·布林约尔松和安德鲁·麦卡菲在《第二机器时代》中所论证的，应该重新思考教育和职业培训。从文法学校到大学的课程应该演变，减少对记忆事实的关注，更多关注创造力和复杂沟通。职业学校应该在培养解决问题的技能方面做得更好，并帮助学生学会与机器人一起工作。在线教育可以补充传统教育，使额外的培训和指导变得负担得起。试图获得新技能的专业人士将能够在不负债的情况下做到这一点。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier. In previous eras of drastic technological change, entrepreneurs smoothed the transition by dreaming up ways to combine labor and machines. The best uses of 3D printers and virtual reality haven&#39;t been invented yet. The U.S. needs the new companies that will invent them.</p>\n<h3>意群划分 · 第5段</h3>\n<p>The challenge / of coping with automation / underlines the need / for the U.S. / to revive / its fading business dynamism: / Starting new companies / must be made easier.</p>\n<p>In previous eras / of drastic technological change, / entrepreneurs / smoothed the transition / by dreaming up ways / to combine labor and machines.</p>\n<p>The best uses / of 3D printers and virtual reality / haven&#39;t been invented yet.</p>\n<p>The U.S. needs / the new companies / that will invent them.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>挑战 / 应对自动化的 / 凸显了需求 / 对美国来说 / 重振 / 其衰退的商业活力：/ 创办新公司 / 必须变得更容易。</p>\n<p>在以前的时代 / 剧烈技术变革的，/ 企业家们 / 平滑了过渡 / 通过想出方法 / 来结合劳动力和机器。</p>\n<p>最佳用途 / 3D打印机和虚拟现实的 / 还没有被发明出来。</p>\n<p>美国需要 / 新公司 / 将会发明它们的。</p>\n<h3>标准译文 · 第5段</h3>\n<p>应对自动化的挑战凸显了美国重振其衰退的商业活力的需求：必须让创办新公司变得更容易。在以前剧烈技术变革的时代，企业家们通过想出结合劳动力和机器的方法来平滑过渡。3D打印机和虚拟现实的最佳用途还没有被发明出来。美国需要将会发明它们的新公司。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n<h3>意群划分 · 第6段</h3>\n<p>Finally, / because automation threatens / to widen the gap / between capital income and labor income, / taxes and the safety net / will have to be rethought.</p>\n<p>Taxes / on low-wage labor / need to be cut, / and wage subsidies / such as the earned income tax credit / should be expanded: / This would boost incomes, / encourage work, / reward companies / for job creation, / and reduce inequality.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>最后，/ 因为自动化威胁 / 扩大差距 / 在资本收入和劳动收入之间，/ 税收和安全网 / 将不得不被重新考虑。</p>\n<p>税收 / 对低工资劳动的 / 需要被削减，/ 而工资补贴 / 比如劳动所得税抵免 / 应该被扩大：/ 这将提高收入，/ 鼓励工作，/ 奖励公司 / 创造就业，/ 并减少不平等。</p>\n<h3>标准译文 · 第6段</h3>\n<p>最后，因为自动化威胁要扩大资本收入和劳动收入之间的差距，税收和安全网将不得不被重新考虑。对低工资劳动的税收需要削减，而工资补贴（如劳动所得税抵免）应该扩大：这将提高收入、鼓励工作、奖励公司创造就业，并减少不平等。</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation. Destroying the machines that are coming for our jobs would be nuts. But policies to help workers adapt will be indispensable.</p>\n<h3>意群划分 · 第7段</h3>\n<p>Technology / will improve society / in ways big and small / over the next few years, / yet this will be / little comfort / to those / who find their lives and careers / upended by automation.</p>\n<p>Destroying the machines / that are coming for our jobs / would be nuts.</p>\n<p>But policies / to help workers adapt / will be indispensable.</p>\n<h3>意群翻译 · 第7段</h3>\n<p>技术 / 将改善社会 / 以大大小小的方式 / 在接下来的几年里，/ 然而这将是 / 很少的安慰 / 对那些人 / 发现他们的生活和职业 / 被自动化颠覆的。</p>\n<p>摧毁机器 / 那些来抢夺我们工作的 / 将是疯狂的。</p>\n<p>但政策 / 帮助工人适应的 / 将是不可或缺的。</p>\n<h3>标准译文 · 第7段</h3>\n<p>技术将在接下来的几年里以大大小小的方式改善社会，然而这对那些发现自己的生活和职业被自动化颠覆的人来说，将是很少的安慰。摧毁那些来抢夺我们工作的机器将是疯狂的。但帮助工人适应的政策将是不可或缺的。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>Among the annoying challenges：(facing the middle class) → is one：(that will probably go unmentioned：(in the next presidential campaign))：What happens：(when the robots come：(for their jobs))?</p>\n<p><strong>第2段</strong></p>\n<p>Don&#39;t dismiss → that possibility → entirely.</p>\n<p>About half of U.S. jobs → are at high risk：(of being automated)：(according to a University of Oxford study)：(with the middle class → disproportionately squeezed).</p>\n<p>Lower-income jobs：(like gardening or day care) → don&#39;t appeal to robots.</p>\n<p>But many middle-class occupations：(trucking + financial advice + software engineering) → have aroused their interest // or soon will.</p>\n<p>The rich own the robots → so they will be fine.</p>\n<p><strong>第3段</strong></p>\n<p>This isn&#39;t → to be alarmist.</p>\n<p>Optimists point out：(that technological upheaval → has benefited workers：(in the past)).</p>\n<p>The Industrial Revolution → didn&#39;t go so well：(for Luddites：(whose jobs were displaced：(by mechanized looms))) // but it eventually → raised living standards + created more jobs：(than it destroyed).</p>\n<p>Likewise → automation should eventually → boost productivity + stimulate demand：(by driving down prices) + free workers：(from hard, boring work).</p>\n<p>But in the medium term → middle-class workers → may need a lot of help：(adjusting).</p>\n<p><strong>第4段</strong></p>\n<p>The first step：(as Erik Brynjolfsson and Andrew McAfee argue：(in The Second Machine Age)) → should be rethinking：(education and job training).</p>\n<p>Curriculums：(from grammar school to college) → should evolve → to focus less：(on memorizing facts) + more：(on creativity and complex communication).</p>\n<p>Vocational schools → should do a better job：(of fostering problem-solving skills) + (helping students：(work alongside robots)).</p>\n<p>Online education → can supplement → the traditional kind.</p>\n<p>It could make → extra training and instruction → affordable.</p>\n<p>Professionals：(trying to acquire new skills) → will be able to do so：(without going into debt).</p>\n<p><strong>第5段</strong></p>\n<p>The challenge：(of coping with automation) → underlines the need：(for the U.S. → to revive → its fading business dynamism)：Starting new companies → must be made easier.</p>\n<p>In previous eras：(of drastic technological change) → entrepreneurs → smoothed the transition：(by dreaming up ways：(to combine labor and machines)).</p>\n<p>The best uses：(of 3D printers and virtual reality) → haven&#39;t been invented yet.</p>\n<p>The U.S. needs → the new companies：(that will invent them).</p>\n<p><strong>第6段</strong></p>\n<p>Finally → because automation threatens → to widen the gap：(between capital income and labor income) → taxes and the safety net → will have to be rethought.</p>\n<p>Taxes：(on low-wage labor) → need to be cut + wage subsidies：(such as the earned income tax credit) → should be expanded：This would boost incomes + encourage work + reward companies：(for job creation) + reduce inequality.</p>\n<p><strong>第7段</strong></p>\n<p>Technology → will improve society：(in ways big and small)：(over the next few years) // yet this will be → little comfort：(to those：(who find their lives and careers → upended by automation)).</p>\n<p>Destroying the machines：(that are coming for our jobs) → would be nuts.</p>\n<p>But policies：(to help workers adapt) → will be indispensable.</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>在那些恼人的挑战中：(面对中产阶级的) → 有一个：(可能不会被提及：(在下次总统竞选中))：会发生什么：(当机器人来：(抢夺他们的工作))？</p>\n<p><strong>第2段</strong></p>\n<p>不要忽视 → 那种可能性 → 完全地。</p>\n<p>大约一半的美国工作 → 处于高风险：(被自动化的)：(根据牛津大学的一项研究)：(中产阶级 → 不成比例地受到挤压)。</p>\n<p>低收入工作：(像园艺或日托) → 对机器人没有吸引力。</p>\n<p>但许多中产阶级职业：(卡车运输 + 财务咨询 + 软件工程) → 已经引起了它们的兴趣 // 或很快会。</p>\n<p>富人拥有机器人 → 所以他们会没事的。</p>\n<p><strong>第3段</strong></p>\n<p>这不是 → 为了危言耸听。</p>\n<p>乐观主义者指出：(技术剧变 → 使工人受益：(在过去))。</p>\n<p>工业革命 → 进展不太顺利：(对卢德分子来说：(他们的工作被取代：(被机械化织布机))) // 但它最终 → 提高了生活水平 + 创造了更多工作：(比它摧毁的)。</p>\n<p>同样地 → 自动化最终应该 → 提高生产力 + 刺激需求：(通过降低价格) + 解放工人：(从艰苦、无聊的工作中)。</p>\n<p>但在中期 → 中产阶级工人 → 可能需要很多帮助：(来适应)。</p>\n<p><strong>第4段</strong></p>\n<p>第一步：(正如埃里克·布林约尔松和安德鲁·麦卡菲所论证的：(在《第二机器时代》中)) → 应该是重新思考：(教育和职业培训)。</p>\n<p>课程：(从文法学校到大学) → 应该演变 → 更少关注：(记忆事实) + 更多：(创造力和复杂沟通)。</p>\n<p>职业学校 → 应该做得更好：(在培养解决问题的技能方面) + (帮助学生：(与机器人一起工作))。</p>\n<p>在线教育 → 可以补充 → 传统教育。</p>\n<p>它可以使 → 额外的培训和指导 → 负担得起。</p>\n<p>专业人士：(试图获得新技能的) → 将能够这样做：(而不用负债)。</p>\n<p><strong>第5段</strong></p>\n<p>挑战：(应对自动化的) → 凸显了需求：(对美国来说 → 重振 → 其衰退的商业活力)：创办新公司 → 必须变得更容易。</p>\n<p>在以前的时代：(剧烈技术变革的) → 企业家们 → 平滑了过渡：(通过想出方法：(来结合劳动力和机器))。</p>\n<p>最佳用途：(3D打印机和虚拟现实的) → 还没有被发明出来。</p>\n<p>美国需要 → 新公司：(将会发明它们的)。</p>\n<p><strong>第6段</strong></p>\n<p>最后 → 因为自动化威胁 → 扩大差距：(在资本收入和劳动收入之间) → 税收和安全网 → 将不得不被重新考虑。</p>\n<p>税收：(对低工资劳动的) → 需要被削减 + 工资补贴：(比如劳动所得税抵免) → 应该被扩大：这将提高收入 + 鼓励工作 + 奖励公司：(创造就业) + 减少不平等。</p>\n<p><strong>第7段</strong></p>\n<p>技术 → 将改善社会：(以大大小小的方式)：(在接下来的几年里) // 然而这将是 → 很少的安慰：(对那些人：(发现他们的生活和职业 → 被自动化颠覆的))。</p>\n<p>摧毁机器：(那些来抢夺我们工作的) → 将是疯狂的。</p>\n<p>但政策：(帮助工人适应的) → 将是不可或缺的。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第3段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>The Industrial Revolution / didn&#39;t go so well / for Luddites / whose jobs were displaced / by mechanized looms, / but it eventually / raised living standards / and created more jobs / than it destroyed.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>工业革命 / 进展不太顺利 / 对卢德分子来说 / 他们的工作被取代 / 被机械化织布机，/ 但它最终 / 提高了生活水平 / 并创造了更多工作 / 比它摧毁的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把whose解释为Luddites所失去的工作，再保留but后的两个积极结果。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>工业革命  进展不太顺利  对卢德分子来说  他们的工作被取代  被机械化织布机， 但它最终  提高了生活水平  并创造了更多工作  比它摧毁的。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>工业革命最初让一些工人失业，但最终创造了更多工作。</p>\n</blockquote>\n<p>先说特定工人在转型中的损失，再说最终生活水平与岗位总量变化。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>工业革命对那些被机械化织布机取代的卢德分子来说确实不太顺利，但最终提高了生活水平，创造的工作岗位超过了摧毁的。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>eventually限定时间，不能把长期总收益当成每个人当下都获益。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>工业革命对那些被机械化织布机取代的卢德分子来说确实不太顺利，但最终提高了生活水平，创造的工作岗位超过了摧毁的。</p>\n</blockquote>\n<h2>2. 第4段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Curriculums – / from grammar school to college – / should evolve / to focus less / on memorizing facts / and more / on creativity and complex communication.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>课程 – / 从文法学校到大学 – / 应该演变 / 更少关注 / 记忆事实 / 而更多 / 关注创造力和复杂沟通。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>插入语from grammar school to college说明课程范围，less与more形成成对比较。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>课程 –  从文法学校到大学 –  应该演变  更少关注  记忆事实  而更多  关注创造力和复杂沟通。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>课程应更少重事实记忆，更重创造和复杂沟通。</p>\n</blockquote>\n<p>先说各学段课程的发展方向，再并列两种需要增加的能力。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>从文法学校到大学的课程应该演变，减少对记忆事实的关注，更多关注创造力和复杂沟通。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>less不是完全取消记忆，more也不是只教创造而不要其他能力。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>从文法学校到大学的课程应该演变，减少对记忆事实的关注，更多关注创造力和复杂沟通。</p>\n</blockquote>\n<h2>3. 第6段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Taxes / on low-wage labor / need to be cut, / and wage subsidies / such as the earned income tax credit / should be expanded: / This would boost incomes, / encourage work, / reward companies / for job creation, / and reduce inequality.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>税收 / 对低工资劳动的 / 需要被削减，/ 而工资补贴 / 比如劳动所得税抵免 / 应该被扩大：/ 这将提高收入，/ 鼓励工作，/ 奖励公司 / 创造就业，/ 并减少不平等。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把冒号前两项政策与冒号后四项作用分别合并成并列组。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>税收  对低工资劳动的  需要被削减， 而工资补贴  比如劳动所得税抵免  应该被扩大： 这将提高收入， 鼓励工作， 奖励公司  创造就业， 并减少不平等。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>减轻低薪劳动税负并增加工资补贴可支持收入和就业。</p>\n</blockquote>\n<p>先说减税及扩补贴，再说明增加收入、鼓励劳动、奖励创造岗位和减少不平等。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>对低工资劳动的税收需要削减，而工资补贴（如劳动所得税抵免）应该扩大：这将提高收入、鼓励工作、奖励公司创造就业，并减少不平等。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>This回指前面的政策组合，不是回指自动化本身。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>对低工资劳动的税收需要削减，而工资补贴（如劳动所得税抵免）应该扩大：这将提高收入、鼓励工作、奖励公司创造就业，并减少不平等。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>21题</h2>\n<blockquote>\n<p>Who will be most threatened by automation?</p>\n<p>谁将受到自动化的最大威胁？</p>\n</blockquote>\n<h3>题型</h3>\n<p>比较细节题：找受威胁最大的群体，须将中产与低收入者、机器人所有者在同一段中的处境对照。</p>\n<p>题干问automation会威胁谁。粗读第2段时见到at high risk of being automated，并且同段分别提到低收入工作和富人，直接完整读第2段，比较文中各类人的工作与机器人的关系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n</blockquote>\n<h3>A. Leading politicians.</h3>\n<blockquote>\n<p>受到自动化最大威胁的是主要政治人物。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>总统竞选只是首段说这项挑战可能不会被提及的场合，不是风险最大的人群。第2段明确比较中产、低收入者与富人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>受到自动化最大威胁的是主要政治人物。</p>\n</blockquote>\n<p><code>Leading politicians</code>指定政治领域的一群人，第2段在<code>at high risk of being automated</code>之后用<code>the middle class</code>说明受到挤压的群体，因此回看这句与随后按收入群体作出的比较。</p>\n<p>原文在自动化风险下明确写到<code>the middle class</code>受到挤压，并与不吸引机器人的低收入工作、拥有机器人的富人作区分。<code>A</code>的<code>Leading politicians</code>换成了主要政治人物，把按收入和工作处境区分的人群改成特定政治身份。原句没有把这种政治身份与最大的自动化威胁接起来，不能把中产阶级这一群体直接改写为主要政治人物。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n<p>不要完全排除这种可能。牛津大学研究称，美国约半数岗位自动化风险很高，中产阶级受到不成比例的挤压。园艺、日间照料等低收入工作不吸引机器人，卡车运输、财务咨询、软件工程等许多中产职业却已经或即将吸引它们。富人拥有机器人，所以会安然无事。</p>\n</blockquote>\n<p>作者从中产工作会怎样受到机器人影响起笔，再用职业类型和机器人所有权解释风险分布。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Leading politicians will be most threatened by automation.</p>\n<p>受到自动化最大威胁的是主要政治人物。</p>\n</blockquote>\n<p>A需要主要政治人物的工作被自动化威胁的证据。竞选中未谈某问题，不会使参选者变成该问题最主要的受害者。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. Low-wage laborers.</h3>\n<blockquote>\n<p>受到自动化最大威胁的是低工资劳动者。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>园艺、日间照料这类低收入工作不吸引机器人，文中没有将它们列为最易被替代。B与这项比较的方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>受到自动化最大威胁的是低工资劳动者。</p>\n</blockquote>\n<p><code>Low-wage laborers</code>与第2段的<code>Lower-income jobs</code>都涉及收入较低的工作，原句紧跟<code>don’t appeal to robots</code>，回看这句对机器人兴趣的判断。</p>\n<p>原文用园艺和日间照料作例子，说<code>Lower-income jobs</code>对机器人没有吸引力，即这类工作并不是这里特别指出的机器人介入对象。<code>B</code>的<code>Low-wage laborers</code>却把低工资劳动者列为最受自动化威胁者。两边谈的是同一类收入处境，但原文的“不吸引机器人”被改写成最大的工作替代威胁。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n<p>不要完全排除这种可能。牛津大学研究称，美国约半数岗位自动化风险很高，中产阶级受到不成比例的挤压。园艺、日间照料等低收入工作不吸引机器人，卡车运输、财务咨询、软件工程等许多中产职业却已经或即将吸引它们。富人拥有机器人，所以会安然无事。</p>\n</blockquote>\n<p>作者以低收入工作作一端，再列吸引机器人的中产职业，强调就业风险不是平均落在所有人身上。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Low-wage laborers will be most threatened by automation.</p>\n<p>受到自动化最大威胁的是低工资劳动者。</p>\n</blockquote>\n<p>B需要低工资者比另外两类承受更大风险。实际低收入工作在比较中相对不受吸引，不能只因收入低就按常识选为最受威胁。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Robot owners.</h3>\n<blockquote>\n<p>受到自动化最大威胁的是机器人所有者。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>富人拥有机器人，原句用so they will be fine说明其有利处境。C却将同一身份放进最大威胁的位置。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>受到自动化最大威胁的是机器人所有者。</p>\n</blockquote>\n<p><code>Robot owners</code>直接对应第2段末句的<code>own the robots</code>，这句还用<code>so</code>说明拥有机器人的结果，因此回看末句。</p>\n<p>原文说富人<code>own the robots</code>，因此<code>they will be fine</code>，把拥有机器人写成他们不必担心自身处境的理由。<code>C</code>却把<code>Robot owners</code>说成自动化最严重的受威胁者。原句对于这一身份给出的结果是会安然无事，选项接回题干后的结果则是最大威胁，方向相反。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n<p>不要完全排除这种可能。牛津大学研究称，美国约半数岗位自动化风险很高，中产阶级受到不成比例的挤压。园艺、日间照料等低收入工作不吸引机器人，卡车运输、财务咨询、软件工程等许多中产职业却已经或即将吸引它们。富人拥有机器人，所以会安然无事。</p>\n</blockquote>\n<p>作者在中产职业被挤压之后，转到富人拥有技术资产所带来的保护，完成三类人的对照。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Robot owners will be most threatened by automation.</p>\n<p>受到自动化最大威胁的是机器人所有者。</p>\n</blockquote>\n<p>C需要机器人所有权造成更大就业损害。实际so引出的结果是安然无事，拥有者与被替代的劳动者不能混在一起。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Middle-class workers.</h3>\n<blockquote>\n<p>受到自动化最大威胁的是中产阶级劳动者。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>middle class disproportionately squeezed直接说中产承受不成比例的挤压，随后职业例子和两端对照进一步支持D。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>受到自动化最大威胁的是中产阶级劳动者。</p>\n</blockquote>\n<p><code>Middle-class workers</code>对应第2段的<code>the middle class</code>受到挤压，随后<code>financial advice</code>、<code>software engineering</code>已使机器人<code>have aroused their interest</code>；需要连同低收入工作和富人的两端比较一起看。</p>\n<p>原文把中产阶级写成受到挤压的一方，又说财务咨询、软件工程等已经<code>have aroused their interest</code>或即将如此。与之对照，低收入工作不吸引机器人，富人因拥有机器人而会安然无事。<code>D</code>的<code>Middle-class workers</code>正是这一比较中承受工作压力的人群。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n<p>不要完全排除这种可能。牛津大学研究称，美国约半数岗位自动化风险很高，中产阶级受到不成比例的挤压。园艺、日间照料等低收入工作不吸引机器人，卡车运输、财务咨询、软件工程等许多中产职业却已经或即将吸引它们。富人拥有机器人，所以会安然无事。</p>\n</blockquote>\n<p>财务咨询、软件工程等中产职业吸引机器人，低收入例子不吸引，富人又拥有机器人，风险因此集中落向中产劳动者。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Middle-class workers will be most threatened by automation.</p>\n<p>受到自动化最大威胁的是中产阶级劳动者。</p>\n</blockquote>\n<p>D保持收入群体与就业处境的对应，没有把某一具体职业扩大为唯一受威胁者，也没有宣称每位中产都会失业。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>21题结论</h3>\n<blockquote>\n<p><strong>21. D</strong></p>\n</blockquote>\n<ul>\n<li>A：总统竞选只是首段说这项挑战可能不会被提及的场合，不是风险最大的人群。第2段明确比较中产、低收入者与富人。</li>\n<li>B：园艺、日间照料这类低收入工作不吸引机器人，文中没有将它们列为最易被替代。B与这项比较的方向相反。</li>\n<li>C：富人拥有机器人，原句用so they will be fine说明其有利处境。C却将同一身份放进最大威胁的位置。</li>\n<li>D：middle class disproportionately squeezed直接说中产承受不成比例的挤压，随后职业例子和两端对照进一步支持D。</li>\n</ul>\n<h2>22题</h2>\n<blockquote>\n<p>Which of the following best represents the author’s view?</p>\n<p>下列哪项最能代表作者的观点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>观点概括题：将长期收益与中期适应困难分开，并用后文提出的措施检验哪项最能概括作者主张。</p>\n<p>题干问author’s view，没有指定段落。粗读第3段时既见到has benefited workers，也见到help adjusting，这一段在讨论技术对工人的影响时作了转折。先把第3段完整读完，分清作者承认的长远结果与眼下提出的判断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<h3>A. Worries about automation are in fact groundless.</h3>\n<blockquote>\n<p>最能代表作者观点的是：自动化担忧实际上毫无根据。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者不是危言耸听，却仍承认中期适应困难需要大量帮助。A把不夸大风险误写成担忧没有根据。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>最能代表作者观点的是：自动化担忧实际上毫无根据。</p>\n</blockquote>\n<p><code>Worries</code>和<code>groundless</code>涉及担忧有没有实际理由，第3段开头的<code>isn’t to be alarmist</code>与段末<code>may need a lot of help adjusting</code>分别说明作者并非危言耸听、工人仍需要帮助，合看这两处。</p>\n<p>原文先说并非要危言耸听，随后承认技术最终可能有益，但仍用<code>But in the medium term</code>提出中产阶级工人<code>may need a lot of help adjusting</code>。作者保留了实际的适应困难。<code>A</code>的<code>groundless</code>却把对自动化的担忧整体判为没有根据，将“不夸大风险”改成了“没有值得担忧的风险”，也消去了原文明确提出的中期困难。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n<p>这并非危言耸听。乐观者指出过去技术剧变使工人受益；工业革命使机器织布机替代的工人处境不佳，却最终提高生活水平并创造了多于被摧毁的岗位。同样，自动化应会最终提高生产率、降价刺激需求，并让工人摆脱艰苦单调劳动。但在中期，中产劳动者可能需要很多帮助来适应。</p>\n</blockquote>\n<p>This isn’t to be alarmist之后先承认长期收益，But in the medium term又明确转向现实过渡困难。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Worries about automation are in fact groundless.</p>\n<p>最能代表作者观点的是：自动化担忧实际上毫无根据。</p>\n</blockquote>\n<p>A若成立，就不需要继续说明怎样帮助调整。实际三个政策段和结尾indispensable都建立在困难真实存在的前提上。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. Optimists’ opinions on new tech find little support.</h3>\n<blockquote>\n<p>最能代表作者观点的是：乐观者对新技术的看法几乎没有支持。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>工业革命提高生活水平、创造更多就业的例子支持乐观者关于长期收益的看法。B说其几乎无支持，忽略了作者实际给出的论据。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>最能代表作者观点的是：乐观者对新技术的看法几乎没有支持。</p>\n</blockquote>\n<p><code>Optimists’ opinions</code>对应第3段的<code>Optimists point out</code>，<code>find little support</code>要求检查作者怎样接着论述这项看法，因此读它后面的工业革命例子及<code>Likewise</code>一句。</p>\n<p>原文先陈述乐观者认为过去技术使工人受益，随后以工业革命<code>eventually raised living standards</code>并创造更多工作来说明这种收益，再用<code>Likewise</code>把最终收益推到自动化上。<code>B</code>的<code>find little support</code>却把乐观者的看法描述成缺少支持。作者这里给的是历史例子和同样的长远预期；随后即使转向中期困难，也没有把已经展开的长期收益理由撤销。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n<p>这并非危言耸听。乐观者指出过去技术剧变使工人受益；工业革命使机器织布机替代的工人处境不佳，却最终提高生活水平并创造了多于被摧毁的岗位。同样，自动化应会最终提高生产率、降价刺激需求，并让工人摆脱艰苦单调劳动。但在中期，中产劳动者可能需要很多帮助来适应。</p>\n</blockquote>\n<p>先转述Optimists point out，再用工业革命说明，Likewise随后把长期生产率、需求与劳动解放的益处延伸到自动化。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Optimists’ opinions on new tech find little support.</p>\n<p>最能代表作者观点的是：乐观者对新技术的看法几乎没有支持。</p>\n</blockquote>\n<p>中期有困难并不推翻长期有收益，二者时间不同。B将转折当成对前面全部理由的否定，不能解释作者为何仍用Likewise认可收益。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Issues arising from automation need to be tackled.</h3>\n<blockquote>\n<p>最能代表作者观点的是：自动化带来的问题需要得到处理。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时C尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>中产需要帮助适应，后文又逐项提出教育、创业与税收措施，说明自动化产生的问题应得到应对。C能接住这一行动方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>最能代表作者观点的是：自动化带来的问题需要得到处理。</p>\n</blockquote>\n<p><code>Issues arising from automation</code>指自动化带来的困难，<code>need to be tackled</code>对应第3段末句中工人<code>may need a lot of help adjusting</code>，因此回看作者转向中期处境的这句。</p>\n<p>原文在承认最终可能有益之后，仍指出中产阶级工人在中期<code>may need a lot of help adjusting</code>，说明自动化的过渡阶段存在需要帮助处理的适应困难。<code>C</code>的<code>need to be tackled</code>将这种帮助需求概括为自动化引发的问题要得到应对，没有把最终收益改成损害，也没有把困难说成无法解决。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n<p>这并非危言耸听。乐观者指出过去技术剧变使工人受益；工业革命使机器织布机替代的工人处境不佳，却最终提高生活水平并创造了多于被摧毁的岗位。同样，自动化应会最终提高生产率、降价刺激需求，并让工人摆脱艰苦单调劳动。但在中期，中产劳动者可能需要很多帮助来适应。</p>\n</blockquote>\n<p>作者先把长期收益与中期困难分开，再由帮助需求转入具体办法，末段重申适应政策不可或缺。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Issues arising from automation need to be tackled.</p>\n<p>最能代表作者观点的是：自动化带来的问题需要得到处理。</p>\n</blockquote>\n<p>C没有否定技术进步，也没有保证所有不利结果都能避免；它只说问题需要处理，既与转折相符，也能解释后文建议为何出现。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. Negative consequences of new tech can be avoided.</h3>\n<blockquote>\n<p>最能代表作者观点的是：新技术的负面后果可以避免。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>帮助人们适应冲击与证明负面后果可以避免有区别。作者提出缓冲和应对，却仍承认生活、职业可能被打乱。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>最能代表作者观点的是：新技术的负面后果可以避免。</p>\n</blockquote>\n<p>D的<code>can be avoided</code>要求我们判断能否避免负面后果。第3段实际写的是<code>may need a lot of help adjusting</code>，说明工人需要帮助来适应，尚未承诺不利影响不发生。</p>\n<p>后文培养新技能、支持创业与工资补贴，是让劳动者面对变化仍能学习、工作、获得收入。末段依然承认有人的生活和职业会被自动化打乱，紧接着才说帮助适应的政策不可或缺。</p>\n<p>因此不要擅自把D加成“所有后果都可避免”再反驳，也不必声称任何后果都不可能预防。比较C与D：C直接说问题需要处理，能与各项建议相接；D进一步概括预防效果，却不是文中明确形成的主要判断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n<p>这并非危言耸听。乐观者指出过去技术剧变使工人受益；工业革命使机器织布机替代的工人处境不佳，却最终提高生活水平并创造了多于被摧毁的岗位。同样，自动化应会最终提高生产率、降价刺激需求，并让工人摆脱艰苦单调劳动。但在中期，中产劳动者可能需要很多帮助来适应。</p>\n</blockquote>\n<p>先承认技术替代过旧工作，再提出中期帮助；末段即使肯定未来改善，仍保留部分人遭遇职业冲击的事实。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Negative consequences of new tech can be avoided.</p>\n<p>最能代表作者观点的是：新技术的负面后果可以避免。</p>\n</blockquote>\n<p>D并未明写“所有后果”，不能靠擅加all来排除。它的不足是把帮助应对概括成能够避免，而本文明确主张的是适应政策的必要，C比这项预防效果判断更有依据。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>22题结论</h3>\n<blockquote>\n<p><strong>22. C</strong></p>\n</blockquote>\n<ul>\n<li>A：作者不是危言耸听，却仍承认中期适应困难需要大量帮助。A把不夸大风险误写成担忧没有根据。</li>\n<li>B：工业革命提高生活水平、创造更多就业的例子支持乐观者关于长期收益的看法。B说其几乎无支持，忽略了作者实际给出的论据。</li>\n<li>C：中产需要帮助适应，后文又逐项提出教育、创业与税收措施，说明自动化产生的问题应得到应对。C能接住这一行动方向。</li>\n<li>D：帮助人们适应冲击与证明负面后果可以避免有区别。作者提出缓冲和应对，却仍承认生活、职业可能被打乱。</li>\n</ul>\n<h2>23题</h2>\n<blockquote>\n<p>Education in the age of automation should put more emphasis on ______.</p>\n<p>自动化时代的教育应该更加重视______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：题干问more emphasis，与课程less ... more ...的明确对照相接，区分能力、求职方法、个人需求和态度。</p>\n<p>题干直接点出Education，并问more emphasis。第4段开头出现education and job training，随后又有focus less与more on的对照，先完整精读第4段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</blockquote>\n<h3>A. creative potential</h3>\n<blockquote>\n<p>自动化时代的教育应更重视创造潜能。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>more on creativity与more emphasis on creative potential对应，都是把创造能力作为教育更应培养的内容。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>自动化时代的教育应更重视创造潜能。</p>\n</blockquote>\n<p><code>creative potential</code>与第4段的<code>creativity</code>直接相接，题干的<code>more emphasis</code>也对应<code>more on</code>，因此回看教育重点的这一组对照。</p>\n<p>原文明确要求从较少侧重记忆事实，转向<code>more on creativity and complex communication</code>。<code>A</code>的<code>creative potential</code>说的是人的创造潜能，与<code>creativity</code>所指的创造能力相合，作为更加重视的一个方面，也没有把沟通能力排除在外。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n<p>正如两位作者在《第二次机器时代》中所说，第一步应重新思考教育与职业培训。从初等学校到大学，课程应减少事实记忆，更多关注创造力与复杂沟通；职业学校应更好培养问题解决能力，帮助学生与机器人共同工作。在线教育可补充传统教育，使额外培训与指导费用可承受，让试图掌握新技能的职业人士不必为此负债。</p>\n</blockquote>\n<p>作者以less memorizing、more creativity and complex communication设置教学重点的变化，再补问题解决与人机协作。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Education should put more emphasis on creative potential.</p>\n<p>自动化时代的教育应更重视创造潜能。</p>\n</blockquote>\n<p>A选取明确要求中的一项，不意味着排除沟通能力。creative potential保留创造力方向，与原句的比较重点相接。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. job-hunting skills</h3>\n<blockquote>\n<p>自动化时代的教育应更重视求职技巧。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>解决问题、与机器人共同工作是工作能力，job-hunting skills是寻找岗位的技巧。职业培训不能直接等同于求职培训。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>自动化时代的教育应更重视求职技巧。</p>\n</blockquote>\n<p><code>job-hunting skills</code>涉及寻找和取得工作的技巧，第4段具体提到<code>problem-solving skills</code>及<code>work alongside robots</code>，需要核对这些技能是服务于求职过程还是实际工作，因此回看学校培养能力的句子。</p>\n<p>原文明确说学校要培养<code>problem-solving skills</code>，并帮助学生<code>work alongside robots</code>；段末掌握新技能的主体是已有专业身份的人，所讨论的是他们能否负担学习费用。<code>B</code>的<code>job-hunting skills</code>把这些应对工作问题、与机器协作的能力改成寻找工作的技巧。职业培训并不自动等于求职培训，原句在这里给出的技能对象是实际问题与人机协作。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n<p>正如两位作者在《第二次机器时代》中所说，第一步应重新思考教育与职业培训。从初等学校到大学，课程应减少事实记忆，更多关注创造力与复杂沟通；职业学校应更好培养问题解决能力，帮助学生与机器人共同工作。在线教育可补充传统教育，使额外培训与指导费用可承受，让试图掌握新技能的职业人士不必为此负债。</p>\n</blockquote>\n<p>段落具体列课程与技能内容，末尾又说明已有职业的人怎样负担新增培训，目标在工作变化中的能力更新。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Education should put more emphasis on job-hunting skills.</p>\n<p>自动化时代的教育应更重视求职技巧。</p>\n</blockquote>\n<p>B需要简历、面试或寻找岗位这类求职过程的技能。文中强调的是能怎样完成新工作，而非怎样获得应聘机会。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. individual needs</h3>\n<blockquote>\n<p>自动化时代的教育应更重视个人需求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>individual needs是个人需求，原文more on后面给的是创造力与复杂沟通，并未提出按个体需求安排教学的原则。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>自动化时代的教育应更重视个人需求。</p>\n</blockquote>\n<p><code>individual needs</code>要求看教育是否转向满足各个个体的需要，第4段的<code>focus less</code>与<code>more on</code>直接列出重点转移，回看这句及其后具体培养能力的安排。</p>\n<p>原文的<code>more on</code>后面具体接<code>creativity and complex communication</code>，随后补充解决问题的能力及与机器人一起工作。这里按自动化环境所需的能力确定教育内容。</p>\n<p><code>C</code>的<code>individual needs</code>则把更加重视的对象改成个人需求，要求教育以不同个人的需要为重点。</p>\n<p>原句没有把这些共同提出的工作能力写成按个人需求安排教学的原则。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n<p>正如两位作者在《第二次机器时代》中所说，第一步应重新思考教育与职业培训。从初等学校到大学，课程应减少事实记忆，更多关注创造力与复杂沟通；职业学校应更好培养问题解决能力，帮助学生与机器人共同工作。在线教育可补充传统教育，使额外培训与指导费用可承受，让试图掌握新技能的职业人士不必为此负债。</p>\n</blockquote>\n<p>课程转向适应自动化所需的共同能力，职业教育和在线教育分别补技能与费用条件。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Education should put more emphasis on individual needs.</p>\n<p>自动化时代的教育应更重视个人需求。</p>\n</blockquote>\n<p>C需要教育更关注各人不同需求的对应。培训帮助个人受益并不等于以个性化需求作重点，不能把benefit individuals转成emphasise individual needs。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. cooperative spirit</h3>\n<blockquote>\n<p>自动化时代的教育应更重视合作精神。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>complex communication和work alongside robots说沟通与协作能力，cooperative spirit则是愿意合作的精神态度，两者不能直接互换。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>自动化时代的教育应更重视合作精神。</p>\n</blockquote>\n<p><code>cooperative spirit</code>涉及愿意与他人协作的态度，第4段的<code>complex communication</code>和<code>work alongside robots</code>都涉及交流或共同工作，需要核对作者要求加强的是哪一种内容，因此回看教育重点和学校训练的两句。</p>\n<p>原文要求更多侧重创造力和<code>complex communication</code>，再要求培养解决问题的技能、帮助学生<code>work alongside robots</code>，列出的都是沟通和完成工作所需的能力。<code>D</code>的<code>cooperative spirit</code>则把重点写成合作精神，讲的是乐于合作的态度。共同工作的确可能需要配合，但“能与机器人一起工作”不能直接改成“更重视合作意愿”；原句具体训练的能力内容被换掉了。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n<p>正如两位作者在《第二次机器时代》中所说，第一步应重新思考教育与职业培训。从初等学校到大学，课程应减少事实记忆，更多关注创造力与复杂沟通；职业学校应更好培养问题解决能力，帮助学生与机器人共同工作。在线教育可补充传统教育，使额外培训与指导费用可承受，让试图掌握新技能的职业人士不必为此负债。</p>\n</blockquote>\n<p>作者连续给能做什么的训练目标：创造、复杂沟通、解决问题以及与机器共同完成工作。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Education should put more emphasis on cooperative spirit.</p>\n<p>自动化时代的教育应更重视合作精神。</p>\n</blockquote>\n<p>D需要强化合作意愿的论述。共同工作可能要合作，但该句具体要求掌握相关能力，不能据alongside一词改成培养合作精神。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>23题结论</h3>\n<blockquote>\n<p><strong>23. A</strong></p>\n</blockquote>\n<ul>\n<li>A：more on creativity与more emphasis on creative potential对应，都是把创造能力作为教育更应培养的内容。</li>\n<li>B：解决问题、与机器人共同工作是工作能力，job-hunting skills是寻找岗位的技巧。职业培训不能直接等同于求职培训。</li>\n<li>C：individual needs是个人需求，原文more on后面给的是创造力与复杂沟通，并未提出按个体需求安排教学的原则。</li>\n<li>D：complex communication和work alongside robots说沟通与协作能力，cooperative spirit则是愿意合作的精神态度，两者不能直接互换。</li>\n</ul>\n<h2>24题</h2>\n<blockquote>\n<p>The author suggests that tax policies be aimed at ______.</p>\n<p>作者建议税收政策应以______为目标。</p>\n</blockquote>\n<h3>题型</h3>\n<p>目的细节题：把收入差距风险、减税补贴措施与预期结果连接起来，区分应对自动化后果和促进自动化本身。</p>\n<p>题干直接出现tax policies，第6段同时谈taxes、具体税收调整及This would后的效果，完整精读第6段，区分采取的做法与希望实现的结果。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n<h3>A. encouraging the development of automation</h3>\n<blockquote>\n<p>作者主张税收政策应旨在鼓励自动化发展。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>自动化扩大收入差距是需要应对的原因，鼓励劳动是政策目标。A把导致风险的技术发展改成了要促进的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者主张税收政策应旨在鼓励自动化发展。</p>\n</blockquote>\n<p><code>encouraging the development of automation</code>把自动化当作要促进的对象，而第6段一方面写<code>automation threatens to widen the gap</code>，另一方面在政策效果中写<code>encourage work</code>，因此合看原因和结果。</p>\n<p>原文把自动化可能扩大资本收入与劳动收入差距当作重新考虑税收的原因，再把<code>encourage work</code>、增加收入和减少不平等写成政策效果。<code>A</code>的<code>encouraging the development of automation</code>则把需要应对的变化改成政策要鼓励的发展对象。原句要鼓励的是劳动、要奖励的是创造就业的公司，并未把这两者改接到自动化扩张上。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n<p>最后，因为自动化可能扩大资本收入与劳动收入的差距，税收与保障网需要重新考虑。低工资劳动的税负应减少，劳动所得税抵免等工资补贴应扩大。这将增加收入、鼓励劳动、奖励创造岗位的公司，并减少不平等。</p>\n</blockquote>\n<p>because引出调整税收的理由，后面的减税与工资补贴则指向低工资劳动者和创造就业的企业。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Tax policies should aim at encouraging the development of automation.</p>\n<p>作者主张税收政策应旨在鼓励自动化发展。</p>\n</blockquote>\n<p>A需要税收措施鼓励自动化扩张的作用。原文encourage接work，不能因为段落讨论自动化就将被鼓励者换掉。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. increasing the return on capital investment</h3>\n<blockquote>\n<p>作者主张税收政策应旨在提高资本投资回报。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>政策担心资本与劳动收入差距扩大，具体为低工资劳动减税并补贴工资。B反而将目标移到提高资本回报。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者主张税收政策应旨在提高资本投资回报。</p>\n</blockquote>\n<p><code>return on capital investment</code>与第6段的<code>capital income</code>都涉及资本所得，<code>increasing</code>则要检查政策把哪一方收入作为改善对象，因此回看差距的两端与低工资劳动减税的安排。</p>\n<p>原文担心<code>capital income</code>与<code>labor income</code>的差距扩大，因此具体提出减轻低工资劳动的税负，并以提高收入、鼓励工作、奖励创造就业和减少不平等作结果。<code>B</code>的<code>increasing the return on capital investment</code>把政策目标移到提高资本投资收益上。原文列出的企业受奖励条件是<code>job creation</code>，不是投入资本即可提高回报；两者受益的依据和要处理的差距都被改变了。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n<p>最后，因为自动化可能扩大资本收入与劳动收入的差距，税收与保障网需要重新考虑。低工资劳动的税负应减少，劳动所得税抵免等工资补贴应扩大。这将增加收入、鼓励劳动、奖励创造岗位的公司，并减少不平等。</p>\n</blockquote>\n<p>收入差距先给出调整方向，随后boost incomes、encourage work和reward job creation说明支持劳动一端的路径。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Tax policies should aim at increasing the return on capital investment.</p>\n<p>作者主张税收政策应旨在提高资本投资回报。</p>\n</blockquote>\n<p>企业获奖励有创造就业这一条件，不等于所有资本投资回报应提高。B既换了受益依据，也未接住减少不平等的目标。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. easing the hostility between rich and poor</h3>\n<blockquote>\n<p>作者主张税收政策应旨在缓解贫富之间的敌意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>gap限定资本与劳动收入，reduce inequality也指经济差距。hostility是贫富之间的敌意，原文没有建立这种情绪关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者主张税收政策应旨在缓解贫富之间的敌意。</p>\n</blockquote>\n<p><code>hostility between rich and poor</code>涉及贫富群体的敌对情绪，第6段的<code>gap between capital income and labor income</code>以及<code>reduce inequality</code>则谈两方差距，需要核对作者说的是哪种关系。</p>\n<p>原文的<code>gap</code>具体限定为资本收入与劳动收入的差距，政策效果的<code>reduce inequality</code>也接在提高收入和创造就业之后，说明要改善的是收入与经济分配。<code>C</code>的<code>hostility</code>把这种不平等换成穷人与富人的敌意，又把减小差距换成缓和情绪。收入差距可能让人联想到群体关系，但原句没有把收入不平等与双方敌视连成这里的政策目的。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n<p>最后，因为自动化可能扩大资本收入与劳动收入的差距，税收与保障网需要重新考虑。低工资劳动的税负应减少，劳动所得税抵免等工资补贴应扩大。这将增加收入、鼓励劳动、奖励创造岗位的公司，并减少不平等。</p>\n</blockquote>\n<p>作者从收入分配风险走到减税、工资补贴及就业激励，讨论始终围绕收入与工作机会。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Tax policies should aim at easing the hostility between rich and poor.</p>\n<p>作者主张税收政策应旨在缓解贫富之间的敌意。</p>\n</blockquote>\n<p>C需要两群体已经或可能互相敌视、政策旨在缓和敌意的证据。收入差距可能使人联想到社会矛盾，却不能据此替换文章给定的经济目标。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. preventing the income gap from widening</h3>\n<blockquote>\n<p>作者主张税收政策应旨在防止收入差距扩大。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>自动化可能widen the gap，政策预期reduce inequality。D把风险与措施接成防止收入差距扩大的目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者主张税收政策应旨在防止收入差距扩大。</p>\n</blockquote>\n<p><code>income gap from widening</code>与第6段的<code>widen the gap between capital income and labor income</code>对应同一种变化，<code>preventing</code>又需要和末尾<code>reduce inequality</code>合看，检查政策方向。</p>\n<p>原文先把自动化可能<code>widen the gap</code>写成调整税收的原因，接着把<code>reduce inequality</code>写成调整后的效果。<code>D</code>的<code>preventing the income gap from widening</code>把两端接成明确目的：通过政策应对收入差距扩大的风险。它说的是阻止文中担心的分配变化，并没有把资本所得或技术发展另当作应增加的对象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n<p>最后，因为自动化可能扩大资本收入与劳动收入的差距，税收与保障网需要重新考虑。低工资劳动的税负应减少，劳动所得税抵免等工资补贴应扩大。这将增加收入、鼓励劳动、奖励创造岗位的公司，并减少不平等。</p>\n</blockquote>\n<p>先说明资本与劳动所得分化风险，再以降低劳动税负、增加工资补贴提高劳动收入，形成原因、行动、效果的连续关系。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Tax policies should aim at preventing the income gap from widening.</p>\n<p>作者主张税收政策应旨在防止收入差距扩大。</p>\n</blockquote>\n<p>D没有要求消除所有收入差别，只应对扩大趋势；既保留income gap的对象，也保持政策抵消风险的方向。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>24题结论</h3>\n<blockquote>\n<p><strong>24. D</strong></p>\n</blockquote>\n<ul>\n<li>A：自动化扩大收入差距是需要应对的原因，鼓励劳动是政策目标。A把导致风险的技术发展改成了要促进的对象。</li>\n<li>B：政策担心资本与劳动收入差距扩大，具体为低工资劳动减税并补贴工资。B反而将目标移到提高资本回报。</li>\n<li>C：gap限定资本与劳动收入，reduce inequality也指经济差距。hostility是贫富之间的敌意，原文没有建立这种情绪关系。</li>\n<li>D：自动化可能widen the gap，政策预期reduce inequality。D把风险与措施接成防止收入差距扩大的目的。</li>\n</ul>\n<h2>25题</h2>\n<blockquote>\n<p>In this text, the author presents a problem with ______.</p>\n<p>在本文中，作者以______的方式呈现了一个问题。</p>\n</blockquote>\n<h3>题型</h3>\n<p>篇章组织题：看提出问题之后主体各段完成什么任务，再与结尾照应，不能只按某一段出现过的内容判断。</p>\n<p>题干用In this text把范围放在整篇，并问作者怎样presents a problem。开头以机器人冲着工作而来的问题起笔，需按自然段把之后怎样展开以及结尾怎样回应读全；先完整读此前未读的第1、5、7段，再接上已读过的其余段落。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?</p>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n<p>The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.</p>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.</p>\n<p>But policies to help workers adapt will be indispensable.</p>\n</blockquote>\n<h3>A. opposing views on it</h3>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了围绕问题的对立观点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>长期收益与中期困难可以同时存在，不是两派围绕同一结论争论。后文主要提出帮助办法，A把时间层次读成对立观点。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了围绕问题的对立观点。</p>\n</blockquote>\n<p><code>opposing views</code>容易让人想到第3段的<code>Optimists point out</code>及<code>But in the medium term</code>，需回看这两处是在争论同一个结论，还是分别讨论不同时间的处境，并接到第4段的<code>The first step</code>。</p>\n<p>原文先认可技术过去的收益，并以<code>eventually</code>谈最终收益，再用<code>in the medium term</code>提出中期适应困难，随后进入<code>The first step</code>所引出的行动。这是把长远收益与过渡阶段的困难并置，两者可以同时成立。<code>A</code>的<code>opposing views</code>则把这种时间区分写成对同一问题相互对立的观点，仿佛文章围绕两方争论展开；原文实际接下去讨论的是怎样帮助工人。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n<p>这并非危言耸听。乐观者指出过去技术剧变使工人受益；工业革命使机器织布机替代的工人处境不佳，却最终提高生活水平并创造了多于被摧毁的岗位。同样，自动化应会最终提高生产率、降价刺激需求，并让工人摆脱艰苦单调劳动。但在中期，中产劳动者可能需要很多帮助来适应。</p>\n<p>第一项措施，是两位作者在《第二次机器时代》中所主张的重新思考教育和职业培训。</p>\n</blockquote>\n<p>乐观者的历史依据得到承认，作者再用medium term指出仍需帮助，随后进入教育、创业、税收三个建议段。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author presents the problem together with opposing views on it.</p>\n<p>作者呈现这一问题时，同时给出了围绕问题的对立观点。</p>\n</blockquote>\n<p>A需要不同立场相互反驳成为主要组织线索。实际前后判断的时间范围不同，文章用它们说明为什么既接受进步又需要政策。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. possible solutions to it</h3>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了解决问题的可能办法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、C，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>开头提出自动化就业压力，主体给教育培训、创业和分配政策，结尾要求帮助适应。B概括问题与可能解决办法的结构。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\nThe challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\nFinally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\nBut policies to help workers adapt will be indispensable.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了解决问题的可能办法。</p>\n</blockquote>\n<p>原文由中产阶级工人需要帮助调整，推进到重新思考教育与培训、让创办公司更容易、调整税收和保障网，最后用<code>policies to help workers adapt</code>收束。<code>B</code>的<code>possible solutions</code>把这些应对建议概括为解决问题的可能办法。<code>possible</code>没有声称办法已完全奏效，也没有说技术不再影响工作，保留了作者提出政策建议的性质。</p>\n<p><code>possible solutions</code>要找作者提出哪些应对做法，第4段的<code>rethinking education and job training</code>、第5段的<code>Starting new companies</code>以及第6段的<code>taxes and the safety net</code>分别对应教育、企业和税收方面的行动，因此将这些段落接到第3段的帮助需求与第7段结尾。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\nThe challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\nFinally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\nBut policies to help workers adapt will be indispensable.</p>\n<p>中产面临的一项恼人挑战，是机器人来争夺其工作时会怎样，这可能不会在下次总统竞选中被提及。第一步应重新思考教育和职业培训。应对自动化还要求美国恢复减弱的商业活力，让创办新公司更容易。自动化可能扩大资本与劳动收入差距，所以税收和保障网也须重新考虑。帮助劳动者适应的政策不可或缺。</p>\n</blockquote>\n<p>The first step引入教育，下一段要求创业更容易，Finally引入税收和安全网，三项都回答可以怎样帮助劳动者。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author presents the problem together with possible solutions to it.</p>\n<p>作者呈现这一问题时，同时给出了解决问题的可能办法。</p>\n</blockquote>\n<p>possible保留建议性质，没有说办法已经完全奏效。B能解释三个主体段的功能，而不仅复述开头风险。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. its alarming impacts</h3>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了问题令人担忧的影响。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、C，此时C尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>工作高风险和职业生活被打乱确实出现，C对部分内容有根据；但这些影响引出的是应对政策，不能覆盖文章主体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation. Destroying the machines that are coming for our jobs would be nuts. But policies to help workers adapt will be indispensable.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了问题令人担忧的影响。</p>\n</blockquote>\n<p>工作高风险和职业生活被打乱确实出现，C对部分内容有根据；但这些影响引出的是应对政策，不能覆盖文章主体。</p>\n<p>风险先说明需要帮助的理由，教育、创业、税收随后占据主要展开，末段再次把冲击接到政策不可缺少。</p>\n<p>不能因not alarmist就否认后果令人担忧。C的不足在篇章覆盖：它解释了问题为何重要，却没有概括作者随后逐项提出办法的主要工作。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation. Destroying the machines that are coming for our jobs would be nuts. But policies to help workers adapt will be indispensable.</p>\n<p>未来几年技术会从大小各方面改善社会，但这对生活和职业被自动化打乱的人几乎没有安慰。砸毁来争夺工作的机器很荒唐，但帮助劳动者适应的政策不可或缺。</p>\n</blockquote>\n<p>风险先说明需要帮助的理由，教育、创业、税收随后占据主要展开，末段再次把冲击接到政策不可缺少。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author presents the problem together with its alarming impacts.</p>\n<p>作者呈现这一问题时，同时给出了问题令人担忧的影响。</p>\n</blockquote>\n<p>不能因not alarmist就否认后果令人担忧。C的不足在篇章覆盖：它解释了问题为何重要，却没有概括作者随后逐项提出办法的主要工作。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. its major variations</h3>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了问题的主要变体。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>教育、创业、税收是三种应对方向，不是自动化问题的三个变体。D把解决办法的分类当成了问题本身的分类。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\nThe challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\nFinally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\nBut policies to help workers adapt will be indispensable.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了问题的主要变体。</p>\n</blockquote>\n<p><code>major variations</code>要求文章区分问题本身的不同形式；第1段用<code>robots come for their jobs</code>提出问题，第4段以<code>The first step</code>进入教育培训，第6段以<code>Finally</code>进入税收，回看这些分段展开的是问题类别还是行动方向。</p>\n<p>原文提出的是机器人介入工作后人们怎样应对这一问题。后面的<code>The first step</code>、创办新公司和<code>Finally</code>引出教育、企业、税收等行动方向。<code>D</code>的<code>major variations</code>则把这些分项理解成问题的主要变体，即对问题形式作分类；但各段给的是应该做什么的要求，并不是给自动化就业问题划分不同版本。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\nThe challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\nFinally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\nBut policies to help workers adapt will be indispensable.</p>\n<p>中产面临的一项恼人挑战，是机器人来争夺其工作时会怎样，这可能不会在下次总统竞选中被提及。第一步应重新思考教育和职业培训。应对自动化还要求美国恢复减弱的商业活力，让创办新公司更容易。自动化可能扩大资本与劳动收入差距，所以税收和保障网也须重新考虑。帮助劳动者适应的政策不可或缺。</p>\n</blockquote>\n<p>first step与Finally连起的是应如何改教育、怎样鼓励企业、如何调税收等行动要求。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author presents the problem together with its major variations.</p>\n<p>作者呈现这一问题时，同时给出了问题的主要变体。</p>\n</blockquote>\n<p>D需要作者分别定义不同类型的自动化就业问题。实际各段没有划分问题版本，而是围绕同一适应困难提供不同政策工具。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>25题结论</h3>\n<blockquote>\n<p><strong>25. B</strong></p>\n</blockquote>\n<ul>\n<li>A：长期收益与中期困难可以同时存在，不是两派围绕同一结论争论。后文主要提出帮助办法，A把时间层次读成对立观点。</li>\n<li>B：开头提出自动化就业压力，主体给教育培训、创业和分配政策，结尾要求帮助适应。B概括问题与可能解决办法的结构。</li>\n<li>C：工作高风险和职业生活被打乱确实出现，C对部分内容有根据；但这些影响引出的是应对政策，不能覆盖文章主体。</li>\n<li>D：教育、创业、税收是三种应对方向，不是自动化问题的三个变体。D把解决办法的分类当成了问题本身的分类。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：问题提出——自动化对中产阶级的威胁</strong>（段落1-2核心问题） 提出问题：机器人抢夺中产阶级工作（总统竞选中被忽视的议题）→ 威胁现实：【牛津研究：50%美国工作面临自动化风险 → 中产阶级受冲击最大：（低收入工作对机器人无吸引力 // 中产阶级职业引起机器人兴趣）→ 富人拥有机器人不受影响】</p>\n<p>↓（历史视角与辩证分析）</p>\n<p><strong>逻辑层次2：历史经验与现实挑战</strong>（段落3辩证分析） 非危言耸听：【历史经验：工业革命（短期：卢德分子失业 // 长期：提高生活水平+创造更多工作）】→ 自动化的积极面：（提高生产力 + 降价刺激需求 + 解放工人）// 但中期挑战：中产阶级需要帮助适应</p>\n<p>↓（解决方案）</p>\n<p><strong>逻辑层次3：教育改革方案</strong>（段落4教育对策） 第一步重新思考教育：【课程改革：（减少记忆事实 → 增加创造力和复杂沟通）+ 职业学校：（培养问题解决能力 + 学习与机器人协作）+ 在线教育：（补充传统教育 + 降低成本 + 无债务获得新技能）】</p>\n<p>→（更多解决方案）</p>\n<p><strong>逻辑层次4：商业创新需求</strong>（段落5创业对策） 重振商业活力：让创办公司更容易 → 历史借鉴：企业家通过结合劳动力和机器平滑过渡 → 当前机遇：3D打印和VR的最佳用途待发明 → 需要新公司来创新</p>\n<p>→（政策层面）</p>\n<p><strong>逻辑层次5：税收和社会保障改革</strong>（段落6政策对策） 背景：自动化扩大资本与劳动收入差距 → 税收改革：【削减低工资劳动税收 + 扩大工资补贴（如劳动所得税抵免）】→ 效果：（提高收入 + 鼓励工作 + 奖励创造就业 + 减少不平等）</p>\n<p>↑（总结）</p>\n<p><strong>逻辑层次6：理性应对的必要性</strong>（段落7结论） 承认现实：技术进步vs个人困境的矛盾 → 理性态度：摧毁机器是疯狂的 // 但帮助工人适应的政策不可或缺</p>\n<p>全文核心观点：自动化虽然长期有益，但对中产阶级构成严重威胁，需要通过教育改革、鼓励创业、税收政策调整等综合措施帮助工人适应，而非阻止技术进步。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. Education that prepares people to work with technology</p>\n<p>B. Supporting incomes while helping workers adapt</p>\n<p>C. The uneven employment risks of automation</p>\n<p>D. Guaranteed protection against every negative consequence</p>\n<p>E. New businesses as a bridge through technological change</p>\n<p>F. Long-run gains do not remove the need for help now</p>\n<p>G. Restoring the economy by destroying machines</p>\n<p><strong>41.</strong></p>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs? Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n<p><strong>42.</strong></p>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n<p><strong>43.</strong></p>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n<p><strong>44.</strong></p>\n<p>The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier. In previous eras of drastic technological change, entrepreneurs smoothed the transition by dreaming up ways to combine labor and machines. The best uses of 3D printers and virtual reality haven&#39;t been invented yet. The U.S. needs the new companies that will invent them.</p>\n<p><strong>45.</strong></p>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality. Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation. Destroying the machines that are coming for our jobs would be nuts. But policies to help workers adapt will be indispensable.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】C. The uneven employment risks of automation</p>\n<blockquote>\n<p>自动化造成的不均衡就业风险</p>\n</blockquote>\n<p>先问机器争夺中产工作会怎样，再比较低收入工作、中产职业及拥有机器的富人。</p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?</p>\n</blockquote>\n<p>首段直接问机器人取代中产工作会怎样，竞选只是可能忽视这个问题的背景。</p>\n<blockquote>\n<p>About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed.</p>\n</blockquote>\n<p>disproportionately squeezed表明风险在群体间并不均匀，随后低收入与中产职业的差别具体说明谁更受挤压。</p>\n<blockquote>\n<p>The rich own the robots, so they will be fine.</p>\n</blockquote>\n<p>富人因拥有机器人而处境无碍，与依赖劳动收入的中产形成另一端对照，标题应概括这种不均衡。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>中产工作受到挑战 → 职业替代风险有差异 → 机器人所有权又使富人处境不同</p>\n</blockquote>\n<p>uneven对应disproportionately，employment risks指受到威胁的岗位而非所有人一律受损。</p>\n<p>再看最强干扰项D：Guaranteed protection against every negative consequence。</p>\n<p>风险已明确存在，没有保证所有群体免受后果。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】F. Long-run gains do not remove the need for help now</p>\n<blockquote>\n<p>长期收益不会消除当下帮助的需要</p>\n</blockquote>\n<p>作者承认工业革命和自动化的最终收益，But之后强调中期仍需帮助。</p>\n<blockquote>\n<p>This isn&#39;t to be alarmist.</p>\n</blockquote>\n<p>not alarmist先说明并非夸大风险，随后引入乐观者关于技术收益的依据。</p>\n<blockquote>\n<p>The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed.</p>\n</blockquote>\n<p>工业革命先替代一些旧岗位，却最终改善生活并创造更多工作，eventually限定了受益的长时段。</p>\n<blockquote>\n<p>But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<p>But in the medium term转向过渡期，最终收益并未取消当前帮助需求，两层可以同时成立。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>承认历史与长期技术收益 → 区分中期过渡困难 → 劳动者仍需帮助适应</p>\n</blockquote>\n<p>long-run与now对应eventually和in the medium term；标题保留两层时间判断。</p>\n<p>再看最强干扰项G：Restoring the economy by destroying machines。</p>\n<p>历史不是号召毁机器，下一段明确转向教育与培训。</p>\n<p><strong>42题选F。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】A. Education that prepares people to work with technology</p>\n<blockquote>\n<p>让人具备与技术协作能力的教育</p>\n</blockquote>\n<p>教育应少记忆、多创造和复杂沟通，职业培训帮助人与机器协作，在线教育降低额外学习成本。</p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n</blockquote>\n<p>The first step将上一段的适应需求落到教育与培训，课程具体转向创造、沟通、问题解决等能力。</p>\n<blockquote>\n<p>Online education can supplement the traditional kind.</p>\n</blockquote>\n<p>在线教育作为补充，解决额外学习的可获得性和费用问题，延续的是技能更新的实现条件。</p>\n<blockquote>\n<p>Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</blockquote>\n<p>without going into debt强调已有职业者也能负担学习，标题需连起能力培养与继续培训，而非单说求职技巧。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>重设课程能力重点 → 训练人机协作 → 在线补充降低继续学习成本</p>\n</blockquote>\n<p>prepares people对应能力训练，work with technology对应alongside robots。</p>\n<p>再看最强干扰项D：Guaranteed protection against every negative consequence。</p>\n<p>训练帮助适应，不能保证一切负面后果不存在。</p>\n<p><strong>43题选A。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】E. New businesses as a bridge through technological change</p>\n<blockquote>\n<p>以新企业帮助渡过技术转型</p>\n</blockquote>\n<p>提出降低创业门槛，回顾创业者组合劳动和机器的作用，再指出新技术用途仍待发明。</p>\n<blockquote>\n<p>The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.</p>\n</blockquote>\n<p>应对自动化要求恢复商业活力，具体行动是使创办新公司更容易，给后面创业者作用定下主题。</p>\n<blockquote>\n<p>The best uses of 3D printers and virtual reality haven&#39;t been invented yet.</p>\n</blockquote>\n<p>3D打印与虚拟现实的最佳用途尚未发明，说明新技术还有等待企业探索的劳动组合方式。</p>\n<blockquote>\n<p>The U.S. needs the new companies that will invent them.</p>\n</blockquote>\n<p>new companies that will invent them回答谁来开发这些用途，支持用新企业帮助技术转型的标题。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>降低创业门槛 → 回顾劳动与机器新组合 → 新企业开发尚未出现的技术用途</p>\n</blockquote>\n<p>bridge对应smoothed the transition，新企业提供新的技术应用与工作组合。</p>\n<p>再看最强干扰项A：Education that prepares people to work with technology。</p>\n<p>这里的行动主体已由教育机构转为创业企业。</p>\n<p><strong>44题选E。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】B. Supporting incomes while helping workers adapt</p>\n<blockquote>\n<p>支持收入并帮助劳动者适应</p>\n</blockquote>\n<p>税收和安全网回应资本与劳动收入差距，末段肯定技术进步但强调适应政策必要。</p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.</p>\n</blockquote>\n<p>资本与劳动收入差距可能扩大，因而税收和保障网要调，措施针对劳动所得和就业机会。</p>\n<blockquote>\n<p>Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation.</p>\n</blockquote>\n<p>技术总体改善与部分人生活职业被打乱构成yet转折，提醒不能让总体收
