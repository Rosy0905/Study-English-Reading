<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| annoying | adj.令人烦恼的 | challenges | n.挑战 | middle class | 中产阶级 |\n| unmentioned | adj.未被提及的 | presidential campaign | 总统竞选 | probably | adv.很可能 |\n| come for | 前来夺取 | jobs | n.工作 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,141,900,220],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>annoying</td>\n<td>adj.令人烦恼的</td>\n<td>challenges</td>\n<td>n.挑战</td>\n<td>middle class</td>\n<td>中产阶级</td>\n</tr>\n<tr>\n<td>unmentioned</td>\n<td>adj.未被提及的</td>\n<td>presidential campaign</td>\n<td>总统竞选</td>\n<td>probably</td>\n<td>adv.很可能</td>\n</tr>\n<tr>\n<td>come for</td>\n<td>前来夺取</td>\n<td>jobs</td>\n<td>n.工作</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| dismiss | v.不予考虑 | automated | adj.自动化的 | disproportionately | adv.不成比例地 |\n| squeezed | adj.受挤压的 | day care | 日间照料 | appeal to | 吸引 |\n| occupations | n.职业 | arouse | v.引起 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,469,900,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>dismiss</td>\n<td>v.不予考虑</td>\n<td>automated</td>\n<td>adj.自动化的</td>\n<td>disproportionately</td>\n<td>adv.不成比例地</td>\n</tr>\n<tr>\n<td>squeez \n</section>"},{"title":"第3段","raw":"### 标准译文 · 第3段\n\n这并非危言耸听。乐观主义者指出，技术剧变在过去曾使工人受益。工业革命对那些被机械化织布机取代的卢德分子来说确实不太顺利，但最终提高了生活水平，创造的工作岗位超过了摧毁的。同样，自动化最终应该会提高生产力，通过降低价格刺激需求，并将工人从艰苦、无聊的工作中解放出来。但在中期，中产阶级工人可能需要大量帮助来适应。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第3段精读与翻译","focus":[95,1091,900,668],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":true},"focusId":"focus-paragraph-3-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3>\n<p>This isn&#39;t / to be alarmist.</p>\n<p>Optimists point out / that technological upheaval / has benefited workers / in the past.</p>\n<p>The Industrial Revolution / didn&#39;t go so well / for Luddites / whose jobs were displaced / by mechanized looms, / but it eventually / raised living standards / and created more jobs / than it destroyed.</p>\n<p>Likewise, / automation should eventually / boost productivity, / stimulate demand / by driving down prices, / and free workers / from hard, boring work.</p>\n<p>But in the medium term, / middle-class workers / may need a lot of help / adjusting.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3>\n<p>这不是 / 为了危言耸听。</p>\n<p>乐观主义者指出 / 技术剧变 / 使工人受益 / 在过去。</p>\n<p raining and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</section>"},{"title":"第4段","raw":"### 意群划分 · 第4段\n\nThe first step, / as Erik Brynjolfsson and Andrew McAfee argue / in The Second Machine Age, / should be rethinking / education and job training.\n\nCurriculums – / from grammar school to college – / should evolve / to focus less / on memorizing facts / and more / on creativity and complex communication.\n\nVocational schools / should do a better job / of fostering problem-solving skills / and helping students / work alongside robots.\n\nOnline education / can supplement / the traditional kind.\n\nIt could make / extra training and instruction / affordable.\n\nProfessionals / trying to acquire new skills / will be able to do so / without going into debt.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第4段精读与翻译","focus":[95,1965,900,548],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false},"focusId":"focus-paragraph-4-1","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3>\n<p>The first step, / as Erik Brynjolfsson  / 帮助工人适应的 / 将是不可或缺的。</p>\n</section>"},{"title":"第7段","raw":"### 标准译文 · 第7段\n\n技术将在接下来的几年里以大大小小的方式改善社会，然而这对那些发现自己的生活和职业被自动化颠覆的人来说，将是很少的安慰。摧毁那些来抢夺我们工作的机器将是疯狂的。但帮助工人适应的政策将是不可或缺的。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第7段精读与翻译","focus":[95,4051,900,285],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":true},"focusId":"focus-paragraph-7-3","html":"<section class=\"revealPart\" id=\"focus-paragraph-7-0\"><h3>完整原文 · 第7段</h3>\n<p>Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation. Destroying the machines that are coming for our jobs would be nuts. But policies to help workers adapt will be indispensable.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-7-1\"><h3>意群划分 · 第7段</h3>\n<p>Technology / will improve society / in ways big and small / over the next few years, / yet this will be / little comfort / to those / who find their lives and careers / upended by automation.</p>\n<p>Destroying the machines / that are coming for our jobs / would be nuts.</p>\n<p>But policies / to help workers adapt / will be indispensable.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-7-2\"><h3>意群翻译 · 第7段</h3>\n<p>技术 / 将改善社会 / 以大大小小的方式 / 在接下来的几年里，/ 然而这将是 / 很少的安慰 / 对那些人 / 发现他们的生活和职业 / 被自动化颠覆的。</p>\n<p>摧毁机器 / 那些来抢夺我们工作的 / 将是疯狂的。</p>\n<p>但政策 / 帮助工人适应的 / 将是不可或缺的。</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-7-3\"><h3>标准译文 · 第7段</h3>\n<p>技术将在接下来的几年里以大大小小的方式改善社会，然而这对那些发现自己的生活和职业被自动化颠覆的人来说，将是很少的安慰。摧毁那些来抢夺我们工作的机器将是疯狂的。但帮助工人适应的政策将是不可或缺的。</p>\n</section>"},{"title":"文章的句内逻辑（大家自行根据需求阅读)","raw":"## 文章的句内逻辑（大家自行根据需求阅读)\n\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code ob training).\n\nCurriculums：(from grammar school to college) → should evolve → to focus less：(on memorizing facts) + more：(on creativity and complex communication).\n\nVocational schools → should do a better job：(of fostering problem-solving skills) + (helping students：(work alongside robots)).\n\nOnline education → can supplement → the traditional kind.\n\nIt could make → extra training and instruction → affordable.\n\nProfessionals：(trying to acquire new skills) → will be able to do so：(without going into debt).\n\n**第5段**\n\nThe challenge：(of coping with automation) → underlines the need：(for the U.S. → to revive → its fading business dynamism)：Starting new companies → must be made easier.\n\nIn previous eras：(of drastic technological change) → entrepreneurs → smoothed the transition：(by dreaming up ways：(to combine labor and machines)).\n\nThe best uses：(of 3D printers and virtual reality) → haven't been invented yet.\n\nThe U.S. needs → the new companies：(that will invent them).\n\n**第6段**\n\nFinally → because automation threatens → to widen the gap：(between capital income and labor income) → taxes and the safety net → will have to be rethought.\n\nTaxes：(on low-wage labor) → need to be cut + wage subsidies：(such as the earned income tax credit) → should be expanded：This would boost incomes + encourage work + reward companies：(for job creation) + reduce inequality.\n\n**第7段**\n\nTechnology → will improve society：(in ways big and small)：(over the next few years) // yet this will be → little comfort：(to those：(who find their lives and careers → upended by automation)).\n\nDestroying the machines：(that are coming for our jobs) → would be nuts.\n\nBut policies：(to help workers adapt) → will be indispensable.","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>Among the annoying challenges：(facing the middle class) → i  debt).</p>\n<p><strong>第5段</strong></p>\n<p>The challenge：(of coping with automation) → underlines the need：(for the U.S. → to revive → its fading business dynamism)：Starting new companies → must be made easier.</p>\n<p>In previous eras：(of drastic technological change) → entrepreneurs → smoothed the transition：(by dreaming up ways：(to combine labor and machines)).</p>\n<p>The best uses：(of 3D printers and virtual reality) → haven&#39;t been invented yet.</p>\n<p>The U.S. needs → the new companies：(that will invent them).</p>\n<p><strong>第6段</strong></p>\n<p>Finally → because automation threatens → to widen the gap：(between capital income and labor income) → taxes and the safety net → will have to be rethought.</p>\n<p>Taxes：(on low-wage labor) → need to be cut + wage subsidies：(such as the earned income tax credit) → should be expanded：This would boost incomes + encourage work + reward companies：(for job creation) + reduce inequality.</p>\n<p><strong>第7段</strong></p>\n<p>Technology → will improve society：(in ways big and small)：(over the next few years) // yet this will be → little comfort：(to those：(who find their lives and careers → upended by automation)).</p>\n<p>Destroying the machines：(that are coming for our jobs) → would be nuts.</p>\n<p>But policies：(to help workers adapt) → will be indispensable.</p>\n"},{"title":"中文版句子逻辑（选修）","raw":"## 中文版句子逻辑（选修）\n\n**第1段**\n\n在那些恼人的挑战中：(面对中产阶级的) → 有一个：(可能不会被提及：(在下次总统竞选中))：会发生什么：(当机器人来：(抢夺他们的工作))？\n\n**第2段**\n\n不要忽视 → 那种可能性 → 完全地。\n\n大约一半的美国工作 → 处于高风险：(被自动化的)：(根据牛津大学的一项研究)：(中产阶级 → 不成比例地受到挤压)。\n\n低收入工作：(像园艺或日托) → 对机器人没有吸引力。\n\n但许多中产阶级职业：(卡车运输 + 财务咨询 + 软件工程) → 已经引起了它们的兴趣 // 或很快会。\n\n富人拥有机器人 → 所以他们会没事的。\n\n**第3段**\n\n这不是 → 为了危言耸听。\n\n乐观主义者指出：(技术剧变 → 使工人受益：(在过去))。\n\n工业革命 → 进展不太顺利：(对卢德分子来说：(他们的工作被取代：(被机械化织布机))) // 但它最终 → 提高了生活水平 + 创造了更多工作：(比它摧毁的)。\n\n同样地 → 自动化最终应该 → 提高生产力 + 刺激需求：(通过降低价格) + 解放工人：(从艰苦、无聊的工作中)。\n\n但在中期 → 中产阶级工人 → 可能需要很多帮助：(来适应)。\n\n**第4段**\n\n第一步：(正如埃里克·布林约尔松和安德鲁·麦卡菲所论证的：(在《第二机器时代》中)) → 应该是重新思考：(教育和职业培训)。\n\n课程：(从文法学校到大学) → 应该演变 → 更少关注：(记忆事实) + 更多：(创造力和复杂沟通)。\n\n职业学校 → 应该做得更好：(在培养解决问题的技能方面) + (帮助学生：(与机器人一起工作))。\n\n在线教育 → 可以补充 → 传统教育。\n\n它可以使 → 额外的培训和指导 → 负担得起。\n\n专业人士：(试图获得新技能的) → 将能够这样做：(而不用负债)。\n\n**第5段**\n\n挑战：(应对自动化的) → 凸显了需求：(对美国来说 → 重振 → 其衰退的商业活力)：创办新公司 → 必须变得更容易。\n\n在以前的时代：(剧烈技术变革的) → 企业家们 → 平滑了过渡：(通过想出方法：(来结合劳动力和机器))。\n\n最佳用途：(3D打印机和虚拟现实的) → 还没有被发明出来。\n\n美国需要 → 新公司：(将会发明它们的)。\n\n**第6段**\n\n最后 → 因为自动化威胁 → 扩大差距：(在资本收入和劳动收入之间) → 税收和安全网 → 将不得不被重新考虑。\n\n税收：(对低工资劳动的) → 需要被削减 + 工资补贴：(比如劳动所得税抵免) → 应该被扩大：这将提高收入 + 鼓励工作 + 奖励公司：(创造就业) + 减少不平等。\n\n**第7段**\n\n技术 → 将改善社会：(以大大小小的方式)：(在接下来的几年里) // 然而这将是 → 很少的安慰：(对那些人：(发现他们的生活和职业 → 被自动化颠覆的))。\n\n摧毁机器：(那些来抢夺我们工作的) → 将是疯狂的。\n\n但政策：(帮助工人适应的) → 将是不可或缺的。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>在那些恼人的挑战中：(面对中产阶级的) → 有一个：(可能不会被提及：(在下次总统竞选中))：会发生什么：(当机器人来：(抢夺他们的工作))？</p>\n<p><strong>第2段</strong></p>\n<p>不要忽视 → 那种可能性 → 完全地。</p>\n<p>大约一半的美国工作 → 处于高风险：(被自动化的)：(根据牛津大学的一项研究)：(中产阶级 → 不成比例地受到挤压)。</p>\n<p>低收入工作：(像园艺或日托) → 对机器人没有吸引力。</p>\n<p>但许多中产阶级职业：(卡车运输 + 财务咨询 + 软件工程) → 已经引起了它们的兴趣 // 或很快会。</p>\n<p>富人拥有机器人 → 所以他们会没事的。</p>\n<p><strong>第3段</strong></p>\n<p>这不是 → 为了危言耸听。</p>\n<p>乐观主义者指出：(技术剧变 → 使工人受益：(在过去))。</p>\n<p>工业革命 → 进展不太顺利：(对卢德分子来说：(他们的工作被取代：(被机械化织布机))) // 但它最终 → 提高了生活水平 + 创造了更多工作：(比它摧毁的)。</p>\n<p>同样地 → 自动化最终应该 → 提高生产力 + 刺激需求：(通过降低价格) + 解放工人：(从艰苦、无聊的工作中)。</p>\n<p>但在中期 → 中产阶级工人 → 可能需要很多帮助：(来适应)。</p>\n<p><strong>第4段</strong></p>\n<p>第一步：(正如埃里克·布林约尔松和安德鲁·麦卡菲所论证的：(在《第二机器时代》中)) → 应该是重新思考：(教育和职业培训)。</p>\n<p>课程：(从文法学校到大学) → 应该演变 → 更少关注：(记忆事实) + 更多：(创造力和复杂沟通)。</p>\n<p>职业学校 → 应该做得更好：(在培养解决问题的技能方面) + (帮助学生：(与机器人一起工作))。</p>\n<p>在线教育 → 可以补充 → 传统教育。</p>\n<p>它可以使 → 额外的培训和指导 → 负担得起。</p>\n<p>专业人士：(试图获得新技能的) → 将能够这样做：(而不用负债)。</p>\n<p><strong>第5段</strong></p>\n<p>挑战：(应对自动化的) → 凸显了需求：(对美国来说 → 重振 → 其衰退的商业活力)：创办新公司 → 必须变得更容易。</p>\n<p>在以前的时代：(剧烈技术变革的) → 企业家们 → 平滑了过渡：(通过想出方法：(来结合劳动力和机器))。</p>\n<p>最佳用途：(3 一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"21题 · 题干、题型与核心出处","raw":"## 21题\n\n> Who will be most threatened by automation?\n>\n> 谁将受到自动化的最大威胁？\n\n### 题型\n\n比较细节题：找受威胁最大的群体，须将中产与低收入者、机器人所有者在同一段中的处境对照。\n\n题干问automation会威胁谁。粗读第2段时见到at high risk of being automated，并且同段分别提到低收入工作和富人，直接完整读第2段，比较文中各类人的工作与机器人的关系。\n\n### 核心出处\n\n> Don't dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don't appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,377],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"21","questionIntro":true},"html":"<blockquote>\n<p>Who will be most threatened by automation?</p>\n<p>谁将受到自动化的最大威胁？</p>\n</blockquote>\n<h3>题型</h3>\n<p>比较细节题：找受威胁最大的群体，须将中产与低收入者、机器人所有者在同一段中的处境对照。</p>\n<p>题干问automation会威胁谁。粗读第2段时见到at high risk of being automated，并且同段分别提到低收入工作和富人，直接完整读第2段，比较文中各类人的工作与机器人的关系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n</blockquote>\n"},{"title":"A. Leading politicians.","raw":"### A. Leading politicians.\n\n> 受到自动化最大威胁的是主要政治人物。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n总统竞选只是首段说这项挑战可能不会被提及的场合，不是风险最大的人群。第2段明确比较中产、低收入者与富人。\n\n**出处：**\n\n> Don't dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don't appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,377],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-A-0\"><blockquote>\n<p>受到自动化最大威胁的是主要政治人物。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>总统竞选只是首段说这项挑战可能不会被提及的场合，不是风险最大的人群。第2段明确比较中产、低收入者与富人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n</blockquote>\n</section>"},{"title":"A. Leading politicians.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 受到自动化最大威胁的是主要政治人物。\n\n`Leading politicians`指定政治领域的一群人，第2段在`at high risk of being automated`之后用`the middle class`说明受到挤压的群体，因此回看这句与随后按收入群体作出的比较。\n\n原文在自动化风险下明确写到`the middle class`受到挤压，并与不吸引机器人的低收入工作、拥有机器人的富人作区分。`A`的`Leading politicians`换成了主要政治人物，把按收入和工作处境区分的人群改成特定政治身份。原句没有把这种政治身份与最大的自动化威胁接起来，不能把中产阶级这一群体直接改写为主要政治人物。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-A-0\"><blockquote>\n<p>受到自动化最大威胁的是主要政治人物。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>总统竞选只是首段说这项挑战可能不会被提及的场合，不是风险最大的人群。第2段明确比较中产、低收入者与富人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>受到自动化最大威胁的是主要政治人物。</p>\n</blockquote>\n<p><code>Leading politicians</code>指定政治领域的一群人，第2段在<code>at high risk of being automated</code>之后用<code>the middle class</code>说明受到挤压的群体，因此回看这句与随后按收入群体作出的比较。</p>\n<p>原文在自动化风险下明确写到<code>the middle class</code>受到挤压，并与不吸引机器人的低收入工作、拥有机器人的富人作区分。<code>A</code>的<code>Leading politicians</code>换成了主要政治人物，把按收入和工作处境区分的人群改成特定政治身份。原句没有把这种政治身份与最大的自动化威胁接起来，不能把中产阶级这一群体直接改写为主要政治人物。</p>\n</section>"},{"title":"A. Leading politicians.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Don't dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don't appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.\n>\n> 不要完全排除这种可能。牛津大学研究称，美国约半数岗位自动化风险很高，中产阶级受到不成比例的挤压。园艺、日间照料等低收入工作不吸引机器人，卡车运输、财务咨询、软件工程等许多中产职业却已经或即将吸引它们。富人拥有机器人，所以会安然无事。\n\n作者从中产工作会怎样受到机器人影响起笔，再用职业类型和机器人所有权解释风险分布。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Leading politicians will be most threatened by automation.\n>\n> 受到自动化最大威胁的是主要政治人物。\n\nA需要主要政治人物的工作被自动化威胁的证据。竞选中未谈某问题，不会使参选者变成该问题最主要的受害者。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"21","option":"A","cumulative":true,"cumulativeGroup":"question-21-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-21-option-A-2","html s, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,535,1344,378],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"22","questionIntro":true},"html":"<blockquote>\n<p>Which of the following best represents the author’s view?</p>\n<p>下列哪项最能代表作者的观点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>观点概括题：将长期收益与中期适应困难分开，并用后文提出的措施检验哪项最能概括作者主张。</p>\n<p>题干问author’s view，没有指定段落。粗读第3段时既见到has benefited workers，也见到help adjusting，这一段在讨论技术对工人的影响时作了转折。先把第3段完整读完，分清作者承认的长远结果与眼下提出的判断。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n"},{"title":"A. Worries about automation are in fact groundless.","raw":"### A. Worries about automation are in fact groundless.\n\n> 最能代表作者观点的是：自动化担忧实际上毫无根据。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n作者不是危言耸听，却仍承认中期适应困难需要大量帮助。A把不夸大风险误写成担忧没有根据。\n\n**出处：**\n\n> This isn't to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn't go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, a  term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n</section>"},{"title":"C. Issues arising from automation need to be tackled.","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 最能代表作者观点的是：自动化带来的问题需要得到处理。\n\n`Issues arising from automation`指自动化带来的困难，`need to be tackled`对应第3段末句中工人`may need a lot of help adjusting`，因此回看作者转向中期处境的这句。\n\n原文在承认最终可能有益之后，仍指出中产阶级工人在中期`may need a lot of help adjusting`，说明自动化的过渡阶段存在需要帮助处理的适应困难。`C`的`need to be tackled`将这种帮助需求概括为自动化引发的问题要得到应对，没有把最终收益改成损害，也没有把困难说成无法解决。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,535,1344,378],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-C-0\"><blockquote>\n<p>最能代表作者观点的是：自动化带来的问题需要得到处理。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时C尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>中产需要帮助适应，后文又逐项提出教育、创业与税收措施，说明自动化产生的问题应得到应对。C能接住这一行动方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>最能代表作者观点的是：自动化带来的问题需要得到处理。</p>\n</blockquote>\n<p><code>Issues arising from auto /p>\n<p>这并非危言耸听。乐观者指出过去技术剧变使工人受益；工业革命使机器织布机替代的工人处境不佳，却最终提高生活水平并创造了多于被摧毁的岗位。同样，自动化应会最终提高生产率、降价刺激需求，并让工人摆脱艰苦单调劳动。但在中期，中产劳动者可能需要很多帮助来适应。</p>\n</blockquote>\n<p>先承认技术替代过旧工作，再提出中期帮助；末段即使肯定未来改善，仍保留部分人遭遇职业冲击的事实。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Negative consequences of new tech can be avoided.</p>\n<p>最能代表作者观点的是：新技术的负面后果可以避免。</p>\n</blockquote>\n<p>D并未明写“所有后果”，不能靠擅加all来排除。它的不足是把帮助应对概括成能够避免，而本文明确主张的是适应政策的必要，C比这项预防效果判断更有依据。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"22题结论","raw":"### 22题结论\n\n> **22. C**\n\n- A：作者不是危言耸听，却仍承认中期适应困难需要大量帮助。A把不夸大风险误写成担忧没有根据。\n- B：工业革命提高生活水平、创造更多就业的例子支持乐观者关于长期收益的看法。B说其几乎无支持，忽略了作者实际给出的论据。\n- C：中产需要帮助适应，后文又逐项提出教育、创业与税收措施，说明自动化产生的问题应得到应对。C能接住这一行动方向。\n- D：帮助人们适应冲击与证明负面后果可以避免有区别。作者提出缓冲和应对，却仍承认生活、职业可能被打乱。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,535,1344,378],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"22","questionConclusion":true},"html":"<blockquote>\n<p><strong>22. C</strong></p>\n</blockquote>\n<ul>\n<li>A：作者不是危言耸听，却仍承认中期适应困难需要大量帮助。A把不夸大风险误写成担忧没有根据。</li>\n<li>B：工业革命提高生活水平、创造更多就业的例子支持乐观者关于长期收益的看法。B说其几乎无支持，忽略了作者实际给出的论据。</li>\n<li>C：中产需要帮助适应，后文又逐项提出教育、创业与税收措施，说明自动化产生的问题应得到应对。C能接住这一行动方向。</li>\n<li>D：帮助人们适应冲击与证明负面后果可以避免有区别。作者提出缓冲和应对，却仍承认生活、职业可能被打乱。</li>\n</ul>\n"},{"title":"23题 · 题干、题型与核心出处","raw":"## 23题\n\n> Education in the age of automation should put more emphasis on ______.\n>\n> 自动化时代的教育应该更加重视______。\n\n### 题型\n\n细节题：题干问more emphasis，与课程less ... more ...的明确对照相接，区分能力、求职方法、个人需求和态度。\n\n题干直接点出Education，并问more emphasis。第4段开头出现education and job training，随后又有focus less与more on的对照，先完整精读第4段。\n\n### 核心出处\n\n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,913,1344,377],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"23","questionIntro":true},"html":"<blockquote>\n<p>Education in the age of automation should put more emphasis on ______.</p>\n<p>自动化时代的教育应该更加重视______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：题干问more emphasis，与课程less ... more ...的明确对照相接，区分能力、求职方法、个人需求和态度。</p>\n<p>题干直接点出Education，并问more emphasis。第4段开头出现education and job training，随后又有focus less与more on的对照，先完整精读第4段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</blockquote>\n"},{"title":"A. creative potential","raw":"### A. creative potential\n\n> 自动化时代的教育应更重视创造潜能。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\nmore on creativity与more emphasis on creative potential对应，都是把创造能力作为教育更应培养的内容。\n\n**出处：**\n\n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity e Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.\n>\n> 正如两位作者在《第二次机器时代》中所说，第一步应重新思考教育与职业培训。从初等学校到大学，课程应减少事实记忆，更多关注创造力与复杂沟通；职业学校应更好培养问题解决能力，帮助学生与机器人共同工作。在线教育可补充传统教育，使额外培训与指导费用可承受，让试图掌握新技能的职业人士不必为此负债。\n\n作者以less memorizing、more creativity and complex communication设置教学重点的变化，再补问题解决与人机协作。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Education should put more emphasis on creative potential.\n>\n> 自动化时代的教育应更重视创造潜能。\n\nA选取明确要求中的一项，不意味着排除沟通能力。creative potential保留创造力方向，与原句的比较重点相接。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,913,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>自动化时代的教育应更重视创造潜能。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>more on creativity与more emphasis on creative potential对应，都是把创造能力作为教育更应培养的内容。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering pro ar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.\n>\n> 正如两位作者在《第二次机器时代》中所说，第一步应重新思考教育与职业培训。从初等学校到大学，课程应减少事实记忆，更多关注创造力与复杂沟通；职业学校应更好培养问题解决能力，帮助学生与机器人共同工作。在线教育可补充传统教育，使额外培训与指导费用可承受，让试图掌握新技能的职业人士不必为此负债。\n\n作者连续给能做什么的训练目标：创造、复杂沟通、解决问题以及与机器共同完成工作。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Education should put more emphasis on cooperative spirit.\n>\n> 自动化时代的教育应更重视合作精神。\n\nD需要强化合作意愿的论述。共同工作可能要合作，但该句具体要求掌握相关能力，不能据alongside一词改成培养合作精神。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,913,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-D-0\"><blockquote>\n<p>自动化时代的教育应更重视合作精神。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>complex communication和work alongside robots说沟通与协作能力，cooperative spirit则是愿意合作的精神态度，两者不能直接互换。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>自动化时代的教育应更重视合作精神。</p>\n</blockquote>\n<p><code>cooperative spirit</code>涉及愿意与他人协作的态度，第4段的<code>complex communication</code>和<code>work alongside robots</code>都涉及交流或共同工作，需要核对作者要求加强的是哪一种内容，因此回看教育重点和学校训练的两句。</p>\n<p>原文要求更多侧重创造力和<code>complex communication</code>，再要求培养解决问题的技能、帮助学生<code>work alongside robots</code>，列出的都是沟通和完成工作所需的能力。<code>D</code>的<code>cooperative spirit</code>则把重点写成合作精神，讲的是乐于合作的态度。共同工作的确可能需要配合，但“能与机器人一起工作”不能直接改成“更重视合作意愿”；原句具体训练的能力内容被换掉了。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n<p>正如两位作者在《第二次机器时代》中所说，第一步应重新思考教育与职业培训。从初等学校到大学，课程应减少事实记忆，更多关注创造力与复杂沟通；职业学校应更好培养问题解决能力，帮助学生与机器人共同工作。在线教育可补充传统教育，使额外培训与指导费用可承受，让试图掌握新技能的职业人士不必为此负债。</p>\n</blockquote>\n<p>作者连续给能做什么的训练目标：创造、复杂沟通、解决问题以及与机器共同完成工作。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Education should put more emphasis on cooperative spirit.</p>\n<p>自动化时代的教育应更重视合作精神。</p>\n</blockquote>\n<p>D需要强化合作意愿的论述。共同工作可能要合作，但该句具体要求掌握相关能力，不能据alongside一词改成培养合作精神。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"23题结论","raw":"### 23题结论\n\n> **23. A**\n\n- A：more on creativity与more emphasis on creative potential对应，都是把创造能力作为教育更应培养的内容。\n- B：解决问题、与机器人共同工作是工作能力，job-hunting skills是寻找岗位的技巧。职业培训不能直接等同于求职培训。\n- C：individual needs是个人需求，原文more on后面给的是创造力与复杂沟通，并未提出按个体需求安排教学的原则。\n- D：complex communication和work alongside robots说沟通与协作能力，cooperative spirit则是愿意合作的精神态度，两者不能直接互换。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,913,1344,377],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"23","questionConclusion":true},"html":"<blockquote>\n<p><strong>23. A</strong></p>\n</blockquote>\n<ul>\n<li>A：more on creativity与more emphasis on creative potential对应，都是把创造能力作为教育更应培养的内容。</li>\n<li>B：解决问题、与机器人共同工作是工作能力，job-hunting skills是寻找岗位的技巧。职业培训不能直接等同于求职培训。</li>\n<li>C：individual needs是个人需求，原文more on后面给的是创造力与复杂沟通，并未提出按个体需求安排教学的原则。</li>\n<li>D：complex communication和work alongside robots说沟通与协作能力，cooperative spirit则是愿意合作的精神态度，两者不能直接互换。</li>\n</ul>\n"},{"title":"24题 · 题干、题型与核心出处","raw":"## 24题\n\n> The author suggests that tax policies be aimed at ______.\n>\n> 作者建议税收政策应以______为目标。\n\n### 题型\n\n目的细节题：把收入差距风险、减税补贴措施与预期结果连接起来，区分应对自动化后果和促进自动化本身。\n\n题干直接出现tax policies，第6段同时谈taxes、具体税收调整及This would后的效果，完整精读第6段，区分采取的做法与希望实现的结果。\n\n### 核心出处\n\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"24","questionIntro":true},"html":"<blockquote>\n<p>The author suggests that tax policies be aimed at ______.</p>\n<p>作者建议税收政策应以______为目标。</p>\n</blockquote>\n<h3>题型</h3>\n<p>目的细节题：把收入差距风险、减税补贴措施与预期结果连接起来，区分应对自动化后果和促进自动化本身。</p>\n<p>题干直接出现tax policies，第6段同时谈taxes、具体税收调整及This would后的效果，完整精读第6段，区分采取的做法与希望实现的结果。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n"},{"title":"A. encouraging the development of automation","raw":"### A. encouraging the development of automation\n\n> 作者主张税收政策应旨在鼓励自动化发展。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n自动化扩大收入差距是需要应对的原因，鼓励劳动是政策目标。A把导致风险的技术发展改成了要促进的对象。\n\n**出处：**\n\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>作者主张税收政策应旨在鼓励自动化发展。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>自动化扩大收入差距是需要应对的原因，鼓励劳动是政策目标。A把导致风险的技术发展改成了要促进的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n</section>"},{"title":"A. encouraging the development of automation","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者主张税收政策应旨在鼓励自动化发展。\n\n`encouraging the development of automation`把自动化当作要促进的对象，而第6段一方面写`automation threatens to widen the gap`，另一方面在政策效果中写`encourage work`，因此合看原因和结果。\n\n原文把自动化可能扩大资本收入与劳动收入差距当作重新考虑税收的原因，再把`encourage work`、增加收入和减少不平等写成政策效果。`A`的`encouraging the development of automation`则把需要应对的变化改成政策要鼓励的发展对象。原句要鼓励的是劳动、要奖励的是创造就业的公司，并未把这两者改接到自动化扩张上。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>作者主张税收政策应旨在鼓励自动化发展。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>自动化扩大收入差距是需要应对的原因，鼓励劳动是政策目标。A把导致风险的技术发展改成了要促进的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者主张税收政策应旨在鼓励自动化发展。</p>\n</blockquote>\n<p><code>encouraging the development of automation</code>把自动化当作要促进的对象，而第6段一方面写<code>automation threatens to widen the gap</code>，另一方面在政策效果中写<code>encourage work</code>，因此合看原因和结果。</p>\n<p>原文把自动化可能扩大资本收入与劳动收入差距当作重新考虑税收的原因，再把<code>encourage work</code>、增加收入和减少不平等写成政策效果。<code>A</code>的<code>encouraging the development of automation</code>则把需要应对的变化改成政策要鼓励的发展对象。原句要鼓励的是劳动、要奖励的是创造就业的公司，并未把这两者改接到自动化扩张上。</p>\n</section>"},{"title":"A. encouraging the development of automation","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.\n>\n> 最后，因为自动化可能扩大资本收入与劳动收入的差距，税收与保障网需要重新考虑。低工资劳动的税负应减少，劳动所得税抵免等工资补贴应扩大。这将增加收入、鼓励劳动、奖励创造岗位的公司，并减少不平等。\n\nbecause引出调整税收的理由，后面的减税与工资补贴则指向低工资劳动者和创造就业的企业。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Tax policies should aim at encouraging the development of automation.\n>\n> 作者主张税收政策应旨在鼓励自动化发展。\n\nA需要税收措施鼓励自动化扩张的作用。原文encourage接work，不能因为段落讨论自动化就将被鼓励者换掉。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>作者主张税收政策应旨在鼓励自动化发展。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>自动化扩大收入差距是需要应对的原因，鼓励劳动是政策目标。A把导致风险的技术发展改成了要促进的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies su 动的税负应减少，劳动所得税抵免等工资补贴应扩大。这将增加收入、鼓励劳动、奖励创造岗位的公司，并减少不平等。\n\n收入差距先给出调整方向，随后boost incomes、encourage work和reward job creation说明支持劳动一端的路径。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Tax policies should aim at increasing the return on capital investment.\n>\n> 作者主张税收政策应旨在提高资本投资回报。\n\n企业获奖励有创造就业这一条件，不等于所有资本投资回报应提高。B既换了受益依据，也未接住减少不平等的目标。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-B-0\"><blockquote>\n<p>作者主张税收政策应旨在提高资本投资回报。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>政策担心资本与劳动收入差距扩大，具体为低工资劳动减税并补贴工资。B反而将目标移到提高资本回报。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者主张税收政策应旨在提高资本投资回报。</p>\n</blockquote>\n<p><code>return on capital investment</code>与第6段的<code>capital income</code>都涉及资本所得，<code>increasing</code>则要检查政策把哪一方收入作为改善对象，因此回看差距的两端与低工资劳动减税的安排。</p>\n<p>原文担心<code>capital income</code>与<code>labor income</code>的差距扩大，因此具体提出减轻低工资劳动的税负，并以提高收入、鼓励工作、奖励创造就业和减少不平等作结果。<code>B</code>的<code>increasing the return on capital investment</code>把政策目标移到提高资本投资收益上。原文列出的企业受奖励条件是<code>job creation</code>，不是投入资本即可提高回报；两者受益的依据和要处理的差距都被改变了。</p>\n</section><section c -option-C-0\"><blockquote>\n<p>作者主张税收政策应旨在缓解贫富之间的敌意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>gap限定资本与劳动收入，reduce inequality也指经济差距。hostility是贫富之间的敌意，原文没有建立这种情绪关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n</section>"},{"title":"C. easing the hostility between rich and poor","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 作者主张税收政策应旨在缓解贫富之间的敌意。\n\n`hostility between rich and poor`涉及贫富群体的敌对情绪，第6段的`gap between capital income and labor income`以及`reduce inequality`则谈两方差距，需要核对作者说的是哪种关系。\n\n原文的`gap`具体限定为资本收入与劳动收入的差距，政策效果的`reduce inequality`也接在提高收入和创造就业之后，说明要改善的是收入与经济分配。`C`的`hostility`把这种不平等换成穷人与富人的敌意，又把减小差距换成缓和情绪。收入差距可能让人联想到群体关系，但原句没有把收入不平等与双方敌视连成这里的政策目的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-C-0\"><blockquote>\n<p>作者主张税收政策应旨在缓解贫富之间的敌意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>gap限定资本与劳动收入，reduce inequality也指经济差距。hostility是贫富之间的敌意，原文没有建立这种情绪关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者主张税收政策应旨在缓解贫富之间的敌意。</p>\n</blockquote>\n<p><code>hostility between rich and poor</code>涉及贫富群体的敌对情绪，第6段的<code>gap between capital income and labor income</code>以及<code>reduce inequality</code>则谈两方差距，需要核对作者说的是哪种关系。</p>\n<p>原文的<code>gap</code>具体限定为资本收入与劳动收入的差距，政策效果的<code>reduce inequality</code>也接在提高收入和创造就业之后，说明要改善的是收入与经济分配。<code>C</code>的<code>hostility</code>把这种不平等换成穷人与富人的敌意，又把减小差距换成缓和情绪。收入差距可能让人联想到群体关系，但原句没有把收入不平等与双方敌视连成这里的政策目的。</p>\n</section>"},{"title":"C. easing the hostility between rich and poor","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.\n>\n> 最后，因为自动化可能扩大资本收入与劳动收入的差距，税收与保障网需要重新考虑。低工资劳动的税负应减少，劳动所得税抵免等工资补贴应扩大。这将增加收入、鼓励劳动、奖励创造岗位的公司，并减少不平等。\n\n作者从收入分配风险走到减税、工资补贴及就业激励，讨论始终围绕收入与工作机会。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> Tax policies should aim at easing the hostility between rich and poor.\n>\n> 作者主张税收政策应旨在缓解贫富之间的敌意。\n\nC需要两群体已经或可能互相敌视、政策旨在缓和敌意的证据。收入差距可能使人联想到社会矛盾，却不能据此替换文章给定的经济目标。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"C","cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-C-0\"><blockquot
