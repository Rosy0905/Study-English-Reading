<p>作者主张税收政策应旨在缓解贫富之间的敌意。</p>\n</blockquote>\n<p>C需要两群体已经或可能互相敌视、政策旨在缓和敌意的证据。收入差距可能使人联想到社会矛盾，却不能据此替换文章给定的经济目标。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. preventing the income gap from widening","raw":"### D. preventing the income gap from widening\n\n> 作者主张税收政策应旨在防止收入差距扩大。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n自动化可能widen the gap，政策预期reduce inequality。D把风险与措施接成防止收入差距扩大的目的。\n\n**出处：**\n\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>作者主张税收政策应旨在防止收入差距扩大。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>自动化可能widen the gap，政策预期reduce inequality。D把风险与措施接成防止收入差距扩大的目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n</section>"},{"title":"D. preventing the income gap from widening","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者主张税收政策应旨在防止收入差距扩大。\n\n`income gap from widening`与第6段的`widen the gap between capital income and labor income`对应同一种变化，`preventing`又需要和末尾`reduce inequality`合看，检查政策方向。\n\n原文先把自动化可能`widen the gap`写成调整税收的原因，接着把`reduce inequality`写成调整后的效果。`D`的`preventing the income gap from widening`把两端接成明确目的：通过政策应对收入差距扩大的风险。它说的是阻止文中担心的分配变化，并没有把资本所得或技术发展另当作应增加的对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>作者主张税收政策应旨在防止收入差距扩大。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>自动化可能widen the gap，政策预期reduce inequality。D把风险与措施接成防止收入差距扩大的目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者主张税收政策应旨在防止收入差距扩大。</p>\n</blockquote>\n<p><code>income gap from widening</code>与第6段的<code>widen the gap between capital income and labor income</code>对应同一种变化，<code>preventing</code>又需要和末尾<code>reduce inequality</code>合看，检查政策方向。</p>\n<p>原文先把自动化可能<code>widen the gap</code>写成调整税收的原因，接着把<code>reduce inequality</code>写成调整后的效果。<code>D</code>的<code>preventing the income gap from widening</code>把两端接成明确目的：通过政策应对收入差距扩大的风险。它说的是阻止文中担心的分配变化，并没有把资本所得或技术发展另当作应增加的对象。</p>\n</section>"},{"title":"D. preventing the income gap from widening","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.\n>\n> 最后，因为自动化可能扩大资本收入与劳动收入的差距，税收与保障网需要重新考虑。低工资劳动的税负应减少，劳动所得税抵免等工资补贴应扩大。这将增加收入、鼓励劳动、奖励创造岗位的公司，并减少不平等。\n\n先说明资本与劳动所得分化风险，再以降低劳动税负、增加工资补贴提高劳动收入，形成原因、行动、效果的连续关系。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Tax policies should aim at preventing the income gap from widening.\n>\n> 作者主张税收政策应旨在防止收入差距扩大。\n\nD没有要求消除所有收入差别，只应对扩大趋势；既保留income gap的对象，也保持政策抵消风险的方向。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>作者主张税收政策应旨在防止收入差距扩大。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>自动化可能widen the gap，政策预期reduce inequality。D把风险与措施接成防止收入差距扩大的目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者主张税收政策应旨在防止收入差距扩大。</p>\n</blockquote>\n<p><code>income gap from widening</code>与第6段的<code>widen the gap between capital income and labor income</code>对应同一种变化，<code>preventing</code>又需要和末尾<code>reduce inequality</code>合看，检查政策方向。</p>\n<p>原文先把自动化可能<code>widen the gap</code>写成调整税收的原因，接着把<code>reduce inequality</code>写成调整后的效果。<code>D</code>的<code>preventing the income gap from widening</code>把两端接成明确目的：通过政策应对收入差距扩大的风险。它说的是阻止文中担心的分配变化，并没有把资本所得或技术发展另当作应增加的对象。</p>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.</p>\n<p>最后，因为自动化可能扩大资本收入与劳动收入的差距，税收与保障网需要重新考虑。低工资劳动的税负应减少，劳动所得税抵免等工资补贴应扩大。这将增加收入、鼓励劳动、奖励创造岗位的公司，并减少不平等。</p>\n</blockquote>\n<p>先说明资本与劳动所得分化风险，再以降低劳动税负、增加工资补贴提高劳动收入，形成原因、行动、效果的连续关系。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Tax policies should aim at preventing the income gap from widening.</p>\n<p>作者主张税收政策应旨在防止收入差距扩大。</p>\n</blockquote>\n<p>D没有要求消除所有收入差别，只应对扩大趋势；既保留income gap的对象，也保持政策抵消风险的方向。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"24题结论","raw":"### 24题结论\n\n> **24. D**\n\n- A：自动化扩大收入差距是需要应对的原因，鼓励劳动是政策目标。A把导致风险的技术发展改成了要促进的对象。\n- B：政策担心资本与劳动收入差距扩大，具体为低工资劳动减税并补贴工资。B反而将目标移到提高资本回报。\n- C：gap限定资本与劳动收入，reduce inequality也指经济差距。hostility是贫富之间的敌意，原文没有建立这种情绪关系。\n- D：自动化可能widen the gap，政策预期reduce inequality。D把风险与措施接成防止收入差距扩大的目的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1290,1344,377],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"24","questionConclusion":true},"html":"<blockquote>\n<p><strong>24. D</strong></p>\n</blockquote>\n<ul>\n<li>A：自动化扩大收入差距是需要应对的原因，鼓励劳动是政策目标。A把导致风险的技术发展改成了要促进的对象。</li>\n<li>B：政策担心资本与劳动收入差距扩大，具体为低工资劳动减税并补贴工资。B反而将目标移到提高资本回报。</li>\n<li>C：gap限定资本与劳动收入，reduce inequality也指经济差距。hostility是贫富之间的敌意，原文没有建立这种情绪关系。</li>\n<li>D：自动化可能widen the gap，政策预期reduce inequality。D把风险与措施接成防止收入差距扩大的目的。</li>\n</ul>\n"},{"title":"25题 · 题干、题型与核心出处","raw":"## 25题\n\n> In this text, the author presents a problem with ______.\n>\n> 在本文中，作者以______的方式呈现了一个问题。\n\n### 题型\n\n篇章组织题：看提出问题之后主体各段完成什么任务，再与结尾照应，不能只按某一段出现过的内容判断。\n\n题干用In this text把范围放在整篇，并问作者怎样presents a problem。开头以机器人冲着工作而来的问题起笔，需按自然段把之后怎样展开以及结尾怎样回应读全；先完整读此前未读的第1、5、7段，再接上已读过的其余段落。\n\n### 核心出处\n\n> Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\n>\n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\n>\n> The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\n>\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\n>\n> But policies to help workers adapt will be indispensable.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1667,1344,410],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"25","questionIntro":true},"html":"<blockquote>\n<p>In this text, the author presents a problem with ______.</p>\n<p>在本文中，作者以______的方式呈现了一个问题。</p>\n</blockquote>\n<h3>题型</h3>\n<p>篇章组织题：看提出问题之后主体各段完成什么任务，再与结尾照应，不能只按某一段出现过的内容判断。</p>\n<p>题干用In this text把范围放在整篇，并问作者怎样presents a problem。开头以机器人冲着工作而来的问题起笔，需按自然段把之后怎样展开以及结尾怎样回应读全；先完整读此前未读的第1、5、7段，再接上已读过的其余段落。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?</p>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n<p>The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.</p>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.</p>\n<p>But policies to help workers adapt will be indispensable.</p>\n</blockquote>\n"},{"title":"A. opposing views on it","raw":"### A. opposing views on it\n\n> 作者呈现这一问题时，同时给出了围绕问题的对立观点。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n长期收益与中期困难可以同时存在，不是两派围绕同一结论争论。后文主要提出帮助办法，A把时间层次读成对立观点。\n\n**出处：**\n\n> This isn't to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn't go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.\n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1667,1344,410],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>作者呈现这一问题时，同时给出了围绕问题的对立观点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>长期收益与中期困难可以同时存在，不是两派围绕同一结论争论。后文主要提出帮助办法，A把时间层次读成对立观点。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n</blockquote>\n</section>"},{"title":"A. opposing views on it","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者呈现这一问题时，同时给出了围绕问题的对立观点。\n\n`opposing views`容易让人想到第3段的`Optimists point out`及`But in the medium term`，需回看这两处是在争论同一个结论，还是分别讨论不同时间的处境，并接到第4段的`The first step`。\n\n原文先认可技术过去的收益，并以`eventually`谈最终收益，再用`in the medium term`提出中期适应困难，随后进入`The first step`所引出的行动。这是把长远收益与过渡阶段的困难并置，两者可以同时成立。`A`的`opposing views`则把这种时间区分写成对同一问题相互对立的观点，仿佛文章围绕两方争论展开；原文实际接下去讨论的是怎样帮助工人。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1667,1344,410],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>作者呈现这一问题时，同时给出了围绕问题的对立观点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>长期收益与中期困难可以同时存在，不是两派围绕同一结论争论。后文主要提出帮助办法，A把时间层次读成对立观点。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了围绕问题的对立观点。</p>\n</blockquote>\n<p><code>opposing views</code>容易让人想到第3段的<code>Optimists point out</code>及<code>But in the medium term</code>，需回看这两处是在争论同一个结论，还是分别讨论不同时间的处境，并接到第4段的<code>The first step</code>。</p>\n<p>原文先认可技术过去的收益，并以<code>eventually</code>谈最终收益，再用<code>in the medium term</code>提出中期适应困难，随后进入<code>The first step</code>所引出的行动。这是把长远收益与过渡阶段的困难并置，两者可以同时成立。<code>A</code>的<code>opposing views</code>则把这种时间区分写成对同一问题相互对立的观点，仿佛文章围绕两方争论展开；原文实际接下去讨论的是怎样帮助工人。</p>\n</section>"},{"title":"A. opposing views on it","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> This isn't to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn't go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.\n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\n>\n> 这并非危言耸听。乐观者指出过去技术剧变使工人受益；工业革命使机器织布机替代的工人处境不佳，却最终提高生活水平并创造了多于被摧毁的岗位。同样，自动化应会最终提高生产率、降价刺激需求，并让工人摆脱艰苦单调劳动。但在中期，中产劳动者可能需要很多帮助来适应。\n>\n> 第一项措施，是两位作者在《第二次机器时代》中所主张的重新思考教育和职业培训。\n\n乐观者的历史依据得到承认，作者再用medium term指出仍需帮助，随后进入教育、创业、税收三个建议段。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The author presents the problem together with opposing views on it.\n>\n> 作者呈现这一问题时，同时给出了围绕问题的对立观点。\n\nA需要不同立场相互反驳成为主要组织线索。实际前后判断的时间范围不同，文章用它们说明为什么既接受进步又需要政策。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1667,1344,410],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>作者呈现这一问题时，同时给出了围绕问题的对立观点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>长期收益与中期困难可以同时存在，不是两派围绕同一结论争论。后文主要提出帮助办法，A把时间层次读成对立观点。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了围绕问题的对立观点。</p>\n</blockquote>\n<p><code>opposing views</code>容易让人想到第3段的<code>Optimists point out</code>及<code>But in the medium term</code>，需回看这两处是在争论同一个结论，还是分别讨论不同时间的处境，并接到第4段的<code>The first step</code>。</p>\n<p>原文先认可技术过去的收益，并以<code>eventually</code>谈最终收益，再用<code>in the medium term</code>提出中期适应困难，随后进入<code>The first step</code>所引出的行动。这是把长远收益与过渡阶段的困难并置，两者可以同时成立。<code>A</code>的<code>opposing views</code>则把这种时间区分写成对同一问题相互对立的观点，仿佛文章围绕两方争论展开；原文实际接下去讨论的是怎样帮助工人。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n<p>这并非危言耸听。乐观者指出过去技术剧变使工人受益；工业革命使机器织布机替代的工人处境不佳，却最终提高生活水平并创造了多于被摧毁的岗位。同样，自动化应会最终提高生产率、降价刺激需求，并让工人摆脱艰苦单调劳动。但在中期，中产劳动者可能需要很多帮助来适应。</p>\n<p>第一项措施，是两位作者在《第二次机器时代》中所主张的重新思考教育和职业培训。</p>\n</blockquote>\n<p>乐观者的历史依据得到承认，作者再用medium term指出仍需帮助，随后进入教育、创业、税收三个建议段。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author presents the problem together with opposing views on it.</p>\n<p>作者呈现这一问题时，同时给出了围绕问题的对立观点。</p>\n</blockquote>\n<p>A需要不同立场相互反驳成为主要组织线索。实际前后判断的时间范围不同，文章用它们说明为什么既接受进步又需要政策。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. possible solutions to it","raw":"### B. possible solutions to it\n\n> 作者呈现这一问题时，同时给出了解决问题的可能办法。\n\n**做题模式中的状态：** 第一轮保留B、C，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\n开头提出自动化就业压力，主体给教育培训、创业和分配政策，结尾要求帮助适应。B概括问题与可能解决办法的结构。\n\n**出处：**\n\n> Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\n> The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\n> But policies to help workers adapt will be indispensable.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1667,1344,410],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-B-0\"><blockquote>\n<p>作者呈现这一问题时，同时给出了解决问题的可能办法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、C，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>开头提出自动化就业压力，主体给教育培训、创业和分配政策，结尾要求帮助适应。B概括问题与可能解决办法的结构。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\nThe challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\nFinally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\nBut policies to help workers adapt will be indispensable.</p>\n</blockquote>\n</section>"},{"title":"B. possible solutions to it","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者呈现这一问题时，同时给出了解决问题的可能办法。\n\n原文由中产阶级工人需要帮助调整，推进到重新思考教育与培训、让创办公司更容易、调整税收和保障网，最后用`policies to help workers adapt`收束。`B`的`possible solutions`把这些应对建议概括为解决问题的可能办法。`possible`没有声称办法已完全奏效，也没有说技术不再影响工作，保留了作者提出政策建议的性质。\n\n`possible solutions`要找作者提出哪些应对做法，第4段的`rethinking education and job training`、第5段的`Starting new companies`以及第6段的`taxes and the safety net`分别对应教育、企业和税收方面的行动，因此将这些段落接到第3段的帮助需求与第7段结尾。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1667,1344,410],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-B-0\"><blockquote>\n<p>作者呈现这一问题时，同时给出了解决问题的可能办法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B、C，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>开头提出自动化就业压力，主体给教育培训、创业和分配政策，结尾要求帮助适应。B概括问题与可能解决办法的结构。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\nThe challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\nFinally, because automation threatens to widen the gap between capital income and labor income, taxes and the s olicies to help workers adapt will be indispensable.</p>\n</blockquote>\n</section>"},{"title":"D. its major variations","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者呈现这一问题时，同时给出了问题的主要变体。\n\n`major variations`要求文章区分问题本身的不同形式；第1段用`robots come for their jobs`提出问题，第4段以`The first step`进入教育培训，第6段以`Finally`进入税收，回看这些分段展开的是问题类别还是行动方向。\n\n原文提出的是机器人介入工作后人们怎样应对这一问题。后面的`The first step`、创办新公司和`Finally`引出教育、企业、税收等行动方向。`D`的`major variations`则把这些分项理解成问题的主要变体，即对问题形式作分类；但各段给的是应该做什么的要求，并不是给自动化就业问题划分不同版本。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1667,1344,410],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>作者呈现这一问题时，同时给出了问题的主要变体。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>教育、创业、税收是三种应对方向，不是自动化问题的三个变体。D把解决办法的分类当成了问题本身的分类。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\nThe challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\nFinally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\nBut policies to help workers adapt will be indispensable.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了问题的主要变体。</p>\n</blockquote>\n<p><code>major variations</code>要求文章区分问题本身的不同形式；第1段用<code>robots come for their jobs</code>提出问题，第4段以<code>The first step</code>进入教育培训，第6段以<code>Finally</code>进入税收，回看这些分段展开的是问题类别还是行动方向。</p>\n<p>原文提出的是机器人介入工作后人们怎样应对这一问题。后面的<code>The first step</code>、创办新公司和<code>Finally</code>引出教育、企业、税收等行动方向。<code>D</code>的<code>major variations</code>则把这些分项理解成问题的主要变体，即对问题形式作分类；但各段给的是应该做什么的要求，并不是给自动化就业问题划分不同版本。</p>\n</section>"},{"title":"D. its major variations","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\n> The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\n> But policies to help workers adapt will be indispensable.\n>\n> 中产面临的一项恼人挑战，是机器人来争夺其工作时会怎样，这可能不会在下次总统竞选中被提及。第一步应重新思考教育和职业培训。应对自动化还要求美国恢复减弱的商业活力，让创办新公司更容易。自动化可能扩大资本与劳动收入差距，所以税收和保障网也须重新考虑。帮助劳动者适应的政策不可或缺。\n\nfirst step与Finally连起的是应如何改教育、怎样鼓励企业、如何调税收等行动要求。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The author presents the problem together with its major variations.\n>\n> 作者呈现这一问题时，同时给出了问题的主要变体。\n\nD需要作者分别定义不同类型的自动化就业问题。实际各段没有划分问题版本，而是围绕同一适应困难提供不同政策工具。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1667,1344,410],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>作者呈现这一问题时，同时给出了问题的主要变体。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>教育、创业、税收是三种应对方向，不是自动化问题的三个变体。D把解决办法的分类当成了问题本身的分类。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\nThe challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\nFinally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\nBut policies to help workers adapt will be indispensable.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者呈现这一问题时，同时给出了问题的主要变体。</p>\n</blockquote>\n<p><code>major variations</code>要求文章区分问题本身的不同形式；第1段用<code>robots come for their jobs</code>提出问题，第4段以<code>The first step</code>进入教育培训，第6段以<code>Finally</code>进入税收，回看这些分段展开的是问题类别还是行动方向。</p>\n<p>原文提出的是机器人介入工作后人们怎样应对这一问题。后面的<code>The first step</code>、创办新公司和<code>Finally</code>引出教育、企业、税收等行动方向。<code>D</code>的<code>major variations</code>则把这些分项理解成问题的主要变体，即对问题形式作分类；但各段给的是应该做什么的要求，并不是给自动化就业问题划分不同版本。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\nThe first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\nThe challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\nFinally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\nBut policies to help workers adapt will be indispensable.</p>\n<p>中产面临的一项恼人挑战，是机器人来争夺其工作时会怎样，这可能不会在下次总统竞选中被提及。第一步应重新思考教育和职业培训。应对自动化还要求美国恢复减弱的商业活力，让创办新公司更容易。自动化可能扩大资本与劳动收入差距，所以税收和保障网也须重新考虑。帮助劳动者适应的政策不可或缺。</p>\n</blockquote>\n<p>first step与Finally连起的是应如何改教育、怎样鼓励企业、如何调税收等行动要求。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author presents the problem together with its major variations.</p>\n<p>作者呈现这一问题时，同时给出了问题的主要变体。</p>\n</blockquote>\n<p>D需要作者分别定义不同类型的自动化就业问题。实际各段没有划分问题版本，而是围绕同一适应困难提供不同政策工具。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"25题结论","raw":"### 25题结论\n\n> **25. B**\n\n- A：长期收益与中期困难可以同时存在，不是两派围绕同一结论争论。后文主要提出帮助办法，A把时间层次读成对立观点。\n- B：开头提出自动化就业压力，主体给教育培训、创业和分配政策，结尾要求帮助适应。B概括问题与可能解决办法的结构。\n- C：工作高风险和职业生活被打乱确实出现，C对部分内容有根据；但这些影响引出的是应对政策，不能覆盖文章主体。\n- D：教育、创业、税收是三种应对方向，不是自动化问题的三个变体。D把解决办法的分类当成了问题本身的分类。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1667,1344,410],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"25","questionConclusion":true},"html":"<blockquote>\n<p><strong>25. B</strong></p>\n</blockquote>\n<ul>\n<li>A：长期收益与中期困难可以同时存在，不是两派围绕同一结论争论。后文主要提出帮助办法，A把时间层次读成对立观点。</li>\n<li>B：开头提出自动化就业压力，主体给教育培训、创业和分配政策，结尾要求帮助适应。B概括问题与可能解决办法的结构。</li>\n<li>C：工作高风险和职业生活被打乱确实出现，C对部分内容有根据；但这些影响引出的是应对政策，不能覆盖文章主体。</li>\n<li>D：教育、创业、税收是三种应对方向，不是自动化问题的三个变体。D把解决办法的分类当成了问题本身的分类。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：问题提出——自动化对中产阶级的威胁**（段落1-2核心问题） 提出问题：机器人抢夺中产阶级工作（总统竞选中被忽视的议题）→ 威胁现实：【牛津研究：50%美国工作面临自动化风险 → 中产阶级受冲击最大：（低收入工作对机器人无吸引力 // 中产阶级职业引起机器人兴趣）→ 富人拥有机器人不受影响】\n\n↓（历史视角与辩证分析）\n\n**逻辑层次2：历史经验与现实挑战**（段落3辩证分析） 非危言耸听：【历史经验：工业革命（短期：卢德分子失业 // 长期：提高生活水平+创造更多工作）】→ 自动化的积极面：（提高生产力 + 降价刺激需求 + 解放工人）// 但中期挑战：中产阶级需要帮助适应\n\n↓（解决方案）\n\n**逻辑层次3：教育改革方案**（段落4教育对策） 第一步重新思考教育：【课程改革：（减少记忆事实 → 增加创造力和复杂沟通）+ 职业学校：（培养问题解决能力 + 学习与机器人协作）+ 在线教育：（补充传统教育 + 降低成本 + 无债务获得新技能）】\n\n→（更多解决方案）\n\n**逻辑层次4：商业创新需求**（段落5创业对策） 重振商业活力：让创办公司更容易 → 历史借鉴：企业家通过结合劳动力和机器平滑过渡 → 当前机遇：3D打印和VR的最佳用途待发明 → 需要新公司来创新\n\n→（政策层面）\n\n**逻辑层次5：税收和社会保障改革**（段落6政策对策） 背景：自动化扩大资本与劳动收入差距 → 税收改革：【削减低工资劳动税收 + 扩大工资补贴（如劳动所得税抵免）】→ 效果：（提高收入 + 鼓励工作 + 奖励创造就业 + 减少不平等）\n\n↑（总结）\n\n**逻辑层次6：理性应对的必要性**（段落7结论） 承认现实：技术进步vs个人困境的矛盾 → 理性态度：摧毁机器是疯狂的 // 但帮助工人适应的政策不可或缺\n\n全文核心观点：自动化虽然长期有益，但对中产阶级构成严重威胁，需要通过教育改革、鼓励创业、税收政策调整等综合措施帮助工人适应，而非阻止技术进步。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：问题提出——自动化对中产阶级的威胁</strong>（段落1-2核心问题） 提出问题：机器人抢夺中产阶级工作（总统竞选中被忽视的议题）→ 威胁现实：【牛津研究：50%美国工作面临自动化风险 → 中产阶级受冲击最大：（低收入工作对机器人无吸引力 // 中产阶级职业引起机器人兴趣）→ 富人拥有机器人不受影响】</p>\n<p>↓（历史视角与辩证分析）</p>\n<p><strong>逻辑层次2：历史经验与现实挑战</strong>（段落3辩证分析） 非危言耸听：【历史经验：工业革命（短期：卢德分子失业 // 长期：提高生活水平+创造更多工作）】→ 自动化的积极面：（提高生产力 + 降价刺激需求 + 解放工人）// 但中期挑战：中产阶级需要帮助适应</p>\n<p>↓（解决方案）</p>\n<p><strong>逻辑层次3：教育改革方案</strong>（段落4教育对策） 第一步重新思考教育：【课程改革：（减少记忆事实 → 增加创造力和复杂沟通）+ 职业学校：（培养问题解决能力 + 学习与机器人协作）+ 在线教育：（补充传统教育 + 降低成本 + 无债务获得新技能）】</p>\n<p>→（更多解决方案）</p>\n<p><strong>逻辑层次4：商业创新需求</strong>（段落5创业对策） 重振商业活力：让创办公司更容易 → 历史借鉴：企业家通过结合劳动力和机器平滑过渡 → 当前机遇：3D打印和VR的最佳用途待发明 → 需要新公司来创新</p>\n<p>→（政策层面）</p>\n<p><strong>逻辑层次5：税收和社会保障改革</strong>（段落6政策对策） 背景：自动化扩大资本与劳动收入差距 → 税收改革：【削减低工资劳动税收 + 扩大工资补贴（如劳动所得税抵免）】→ 效果：（提高收入 + 鼓励工作 + 奖励创造就业 + 减少不平等）</p>\n<p>↑（总结）</p>\n<p><strong>逻辑层次6：理性应对的必要性</strong>（段落7结论） 承认现实：技术进步vs个人困境的矛盾 → 理性态度：摧毁机器是疯狂的 // 但帮助工人适应的政策不可或缺</p>\n<p>全文核心观点：自动化虽然长期有益，但对中产阶级构成严重威胁，需要通过教育改革、鼓励创业、税收政策调整等综合措施帮助工人适应，而非阻止技术进步。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. The uneven employment risks of automation\n\n> 自动化造成的不均衡就业风险\n\n先问机器争夺中产工作会怎样，再比较低收入工作、中产职业及拥有机器的富人。\n\n> Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?\n\n首段直接问机器人取代中产工作会怎样，竞选只是可能忽视这个问题的背景。\n\n> About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed.\n\ndisproportionately squeezed表明风险在群体间并不均匀，随后低收入与中产职业的差别具体说明谁更受挤压。\n\n> The rich own the robots, so they will be fine.\n\n富人因拥有机器人而处境无碍，与依赖劳动收入的中产形成另一端对照，标题应概括这种不均衡。\n\n这一部分的推进关系是：\n\n> 中产工作受到挑战 → 职业替代风险有差异 → 机器人所有权又使富人处境不同\n\nuneven对应disproportionately，employment risks指受到威胁的岗位而非所有人一律受损。\n\n再看最强干扰项D：Guaranteed protection against every negative consequence。\n\n风险已明确存在，没有保证所有群体免受后果。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. The uneven employment risks of automation</p>\n<blockquote>\n<p>自动化造成的不均衡就业风险</p>\n</blockquote>\n<p>先问机器争夺中产工作会怎样，再比较低收入工作、中产职业及拥有机器的富人。</p>\n<blockquote>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?</p>\n</blockquote>\n<p>首段直接问机器人取代中产工作会怎样，竞选只是可能忽视这个问题的背景。</p>\n<blockquote>\n<p>About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed.</p>\n</blockquote>\n<p>disproportionately squeezed表明风险在群体间并不均匀，随后低收入与中产职业的差别具体说明谁更受挤压。</p>\n<blockquote>\n<p>The rich own the robots, so they will be fine.</p>\n</blockquote>\n<p>富人因拥有机器人而处境无碍，与依赖劳动收入的中产形成另一端对照，标题应概括这种不均衡。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>中产工作受到挑战 → 职业替代风险有差异 → 机器人所有权又使富人处境不同</p>\n</blockquote>\n<p>uneven对应disproportionately，employment risks指受到威胁的岗位而非所有人一律受损。</p>\n<p>再看最强干扰项D：Guaranteed protection against every negative consequence。</p>\n<p>风险已明确存在，没有保证所有群体免受后果。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】F. Long-run gains do not remove the need for help now\n\n> 长期收益不会消除当下帮助的需要\n\n作者承认工业革命和自动化的最终收益，But之后强调中期仍需帮助。\n\n> This isn't to be alarmist.\n\nnot alarmist先说明并非夸大风险，随后引入乐观者关于技术收益的依据。\n\n> The Industrial Revolution didn't go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed.\n\n工业革命先替代一些旧岗位，却最终改善生活并创造更多工作，eventually限定了受益的长时段。\n\n> But in the medium term, middle-class workers may need a lot of help adjusting.\n\nBut in the medium term转向过渡期，最终收益并未取消当前帮助需求，两层可以同时成立。\n\n这一部分的推进关系是：\n\n> 承认历史与长期技术收益 → 区分中期过渡困难 → 劳动者仍需帮助适应\n\nlong-run与now对应eventually和in the medium term；标题保留两层时间判断。\n\n再看最强干扰项G：Restoring the economy by destroying machines。\n\n历史不是号召毁机器，下一段明确转向教育与培训。\n\n**42题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】F. Long-run gains do not remove the need for help now</p>\n<blockquote>\n<p>长期收益不会消除当下帮助的需要</p>\n</blockquote>\n<p>作者承认工业革命和自动化的最终收益，But之后强调中期仍需帮助。</p>\n<blockquote>\n<p>This isn&#39;t to be alarmist.</p>\n</blockquote>\n<p>not alarmist先说明并非夸大风险，随后引入乐观者关于技术收益的依据。</p>\n<blockquote>\n<p>The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed.</p>\n</blockquote>\n<p>工业革命先替代一些旧岗位，却最终改善生活并创造更多工作，eventually限定了受益的长时段。</p>\n<blockquote>\n<p>But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n</blockquote>\n<p>But in the medium term转向过渡期，最终收益并未取消当前帮助需求，两层可以同时成立。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>承认历史与长期技术收益 → 区分中期过渡困难 → 劳动者仍需帮助适应</p>\n</blockquote>\n<p>long-run与now对应eventually和in the medium term；标题保留两层时间判断。</p>\n<p>再看最强干扰项G：Restoring the economy by destroying machines。</p>\n<p>历史不是号召毁机器，下一段明确转向教育与培训。</p>\n<p><strong>42题选F。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】A. Education that prepares people to work with technology\n\n> 让人具备与技术协作能力的教育\n\n教育应少记忆、多创造和复杂沟通，职业培训帮助人与机器协作，在线教育降低额外学习成本。\n\n> The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.\n\nThe first step将上一段的适应需求落到教育与培训，课程具体转向创造、沟通、问题解决等能力。\n\n> Online education can supplement the traditional kind.\n\n在线教育作为补充，解决额外学习的可获得性和费用问题，延续的是技能更新的实现条件。\n\n> Professionals trying to acquire new skills will be able to do so without going into debt.\n\nwithout going into debt强调已有职业者也能负担学习，标题需连起能力培养与继续培训，而非单说求职技巧。\n\n这一部分的推进关系是：\n\n> 重设课程能力重点 → 训练人机协作 → 在线补充降低继续学习成本\n\nprepares people对应能力训练，work with technology对应alongside robots。\n\n再看最强干扰项D：Guaranteed protection against every negative consequence。\n\n训练帮助适应，不能保证一切负面后果不存在。\n\n**43题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】A. Education that prepares people to work with technology</p>\n<blockquote>\n<p>让人具备与技术协作能力的教育</p>\n</blockquote>\n<p>教育应少记忆、多创造和复杂沟通，职业培训帮助人与机器协作，在线教育降低额外学习成本。</p>\n<blockquote>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.</p>\n</blockquote>\n<p>The first step将上一段的适应需求落到教育与培训，课程具体转向创造、沟通、问题解决等能力。</p>\n<blockquote>\n<p>Online education can supplement the traditional kind.</p>\n</blockquote>\n<p>在线教育作为补充，解决额外学习的可获得性和费用问题，延续的是技能更新的实现条件。</p>\n<blockquote>\n<p>Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n</blockquote>\n<p>without going into debt强调已有职业者也能负担学习，标题需连起能力培养与继续培训，而非单说求职技巧。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>重设课程能力重点 → 训练人机协作 → 在线补充降低继续学习成本</p>\n</blockquote>\n<p>prepares people对应能力训练，work with technology对应alongside robots。</p>\n<p>再看最强干扰项D：Guaranteed protection against every negative consequence。</p>\n<p>训练帮助适应，不能保证一切负面后果不存在。</p>\n<p><strong>43题选A。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】E. New businesses as a bridge through technological change\n\n> 以新企业帮助渡过技术转型\n\n提出降低创业门槛，回顾创业者组合劳动和机器的作用，再指出新技术用途仍待发明。\n\n> The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.\n\n应对自动化要求恢复商业活力，具体行动是使创办新公司更容易，给后面创业者作用定下主题。\n\n> The best uses of 3D printers and virtual reality haven't been invented yet.\n\n3D打印与虚拟现实的最佳用途尚未发明，说明新技术还有等待企业探索的劳动组合方式。\n\n> The U.S. needs the new companies that will invent them.\n\nnew companies that will invent them回答谁来开发这些用途，支持用新企业帮助技术转型的标题。\n\n这一部分的推进关系是：\n\n> 降低创业门槛 → 回顾劳动与机器新组合 → 新企业开发尚未出现的技术用途\n\nbridge对应smoothed the transition，新企业提供新的技术应用与工作组合。\n\n再看最强干扰项A：Education that prepares people to work with technology。\n\n这里的行动主体已由教育机构转为创业企业。\n\n**44题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】E. New businesses as a bridge through technological change</p>\n<blockquote>\n<p>以新企业帮助渡过技术转型</p>\n</blockquote>\n<p>提出降低创业门槛，回顾创业者组合劳动和机器的作用，再指出新技术用途仍待发明。</p>\n<blockquote>\n<p>The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.</p>\n</blockquote>\n<p>应对自动化要求恢复商业活力，具体行动是使创办新公司更容易，给后面创业者作用定下主题。</p>\n<blockquote>\n<p>The best uses of 3D printers and virtual reality haven&#39;t been invented yet.</p>\n</blockquote>\n<p>3D打印与虚拟现实的最佳用途尚未发明，说明新技术还有等待企业探索的劳动组合方式。</p>\n<blockquote>\n<p>The U.S. needs the new companies that will invent them.</p>\n</blockquote>\n<p>new companies that will invent them回答谁来开发这些用途，支持用新企业帮助技术转型的标题。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>降低创业门槛 → 回顾劳动与机器新组合 → 新企业开发尚未出现的技术用途</p>\n</blockquote>\n<p>bridge对应smoothed the transition，新企业提供新的技术应用与工作组合。</p>\n<p>再看最强干扰项A：Education that prepares people to work with technology。</p>\n<p>这里的行动主体已由教育机构转为创业企业。</p>\n<p><strong>44题选E。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Supporting incomes while helping workers adapt\n\n> 支持收入并帮助劳动者适应\n\n税收和安全网回应资本与劳动收入差距，末段肯定技术进步但强调适应政策必要。\n\n> Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.\n\n资本与劳动收入差距可能扩大，因而税收和保障网要调，措施针对劳动所得和就业机会。\n\n> Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation.\n\n技术总体改善与部分人生活职业被打乱构成yet转折，提醒不能让总体收益掩盖具体适应困难。\n\n> But policies to help workers adapt will be indispensable.\n\nindispensable收束在帮助适应的政策必要性，税收支持就是其中一条，不能概括为让技术停止发展。\n\n这一部分的推进关系是：\n\n> 收入差距风险 → 减税补贴支持劳动与就业 → 技术进步仍需政策帮助适应\n\nsupporting incomes对应减税与工资补贴，helping adapt对应末句政策方向。\n\n再看最强干扰项G：Restoring the economy by destroying machines。\n\n末段明确说毁机器是疯狂的，主张的是帮助适应。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Supporting incomes while helping workers adapt</p>\n<blockquote>\n<p>支持收入并帮助劳动者适应</p>\n</blockquote>\n<p>税收和安全网回应资本与劳动收入差距，末段肯定技术进步但强调适应政策必要。</p>\n<blockquote>\n<p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.</p>\n</blockquote>\n<p>资本与劳动收入差距可能扩大，因而税收和保障网要调，措施针对劳动所得和就业机会。</p>\n<blockquote>\n<p>Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation.</p>\n</blockquote>\n<p>技术总体改善与部分人生活职业被打乱构成yet转折，提醒不能让总体收益掩盖具体适应困难。</p>\n<blockquote>\n<p>But policies to help workers adapt will be indispensable.</p>\n</blockquote>\n<p>indispensable收束在帮助适应的政策必要性，税收支持就是其中一条，不能概括为让技术停止发展。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>收入差距风险 → 减税补贴支持劳动与就业 → 技术进步仍需政策帮助适应</p>\n</blockquote>\n<p>supporting incomes对应减税与工资补贴，helping adapt对应末句政策方向。</p>\n<p>再看最强干扰项G：Restoring the economy by destroying machines。</p>\n<p>末段明确说毁机器是疯狂的，主张的是帮助适应。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 指出自动化对不同群体的不均衡冲击 |\n| B | 指出技能与创业之外的收入分配问题 |\n| C | 给出劳动减税和工资补贴措施 |\n| D | 把适应需求落实为能力教育 |\n| E | 补充培训可负担性和在职学习 |\n| F | 承认长期收益同时提出适应期困难 |\n| G | 由劳动者能力转向企业创造新用途 |\n| H | 总结承认冲击并以政策帮助适应 |\n\n全文推进：\n\n> 指出自动化对不同群体的不均衡冲击 → 承认长期收益同时提出适应期困难 → 把适应需求落实为能力教育 → 补充培训可负担性和在职学习 → 由劳动者能力转向企业创造新用途 → 指出技能与创业之外的收入分配问题 → 给出劳动减税和工资补贴措施 → 总结承认冲击并以政策帮助适应\n\n完整顺序：\n\n**A → F → D → E → G → B → C → H**\n\n41—45：F、D、G、B、C。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>指出自动化对不同群体的不均衡冲击</td>\n</tr>\n<tr>\n<td>B</td>\n<td>指出技能与创业之外的收入分配问题</td>\n</tr>\n<tr>\n<td>C</td>\n<td>给出劳动减税和工资补贴措施</td>\n</tr>\n<tr>\n<td>D</td>\n<td>把适应需求落实为能力教育</td>\n</tr>\n<tr>\n<td>E</td>\n<td>补充培训可负担性和在职学习</td>\n</tr>\n<tr>\n<td>F</td>\n<td>承认长期收益同时提出适应期困难</td>\n</tr>\n<tr>\n<td>G</td>\n<td>由劳动者能力转向企业创造新用途</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结承认冲击并以政策帮助适应</td>\n</tr>\n</tb hat have not yet been invented.\n\n创业者过去组合劳动与机器，新公司更易进入则有助探索新工具用途，将企业作用接到技术转型。\n\n后段B开头是：\n\n> Even with new skills and new businesses, the distribution of income remains a concern.\n\nB的Even with new skills and new businesses同时收束前面的培训与创业，再提出两者之外仍有收入分配难题。\n\n这三段的推进关系：\n\n> 补充培训可负担性和在职学习 → 由劳动者能力转向企业创造新用途 → 指出技能与创业之外的收入分配问题\n\n再检验候选C：\n\n> Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies.\n\nC开头that gap要求已经说明收入差距，E此时只谈学习负债和就业能力，不能跳过B提出的资本与劳动收入分化。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Workers who already have careers need opportunities to learn without taking on unsustainable debt merely to remain employable.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Employability also depends on businesses that discover new ways of combining labour and technology.</p>\n</blockquote>\n<p>E末句谈在职者学习以remain employable，G的Employability also depends承接就业能力，再补企业一侧的条件。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>In earlier transitions, entrepreneurs helped create these combinations. Easier entry for new firms can encourage uses of emerging tools that have not yet been invented.</p>\n</blockquote>\n<p>创业者过去组合劳动与机器，新公司更易进入则有助探索新工具用途，将企业作用接到技术转型。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Even with new skills and new businesses, the distribution of income remains a concern.</p>\n</blockquote>\n<p>B的Even with new skills and new businesses同时收束前面的培训与创业，再提出两者之外仍有收入分配难题。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>补充培训可负担性和在职学习 → 由劳动者能力转向企业创造新用途 → 指出技能与创业之外的收入分配问题</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies.</p>\n</blockquote>\n<p>C开头that gap要求已经说明收入差距，E此时只谈学习负债和就业能力，不能跳过B提出的资本与劳动收入分化。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → B → C。\n\n先看前段G的结尾：\n\n> Easier entry for new firms can encourage uses of emerging tools that have not yet been invented.\n\n再看B段开头：\n\n> Even with new skills and new businesses, the distribution of income remains a concern.\n\nG末句讲新企业探索用途，B的Even with new skills and new businesses把前面的两类办法合起，再用remains a concern提出未解决的问题。\n\n本段内部继续写道：\n\n> Automation can widen the gap between returns to capital and earnings from work. Tax policy and the safety net must therefore address a problem that education alone cannot solve.\n\n资本回报与劳动所得差距可能扩大，therefore把这一风险接到税收和安全网，说明教育不能独自解决。\n\n后段C开头是：\n\n> Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies.\n\nC的Addressing that gap明确回指资本与劳动收入差距，然后给出减税与工资补贴的具体做法。\n\n这三段的推进关系：\n\n> 由劳动者能力转向企业创造新用途 → 指出技能与创业之外的收入分配问题 → 给出劳动减税和工资补贴措施\n\n再检验候选F：\n\n> Attention to that risk need not mean denying the long-run gains from technology.\n\nF返回长期收益与风险的关系，尚未建立收入gap，先接它会使C的that gap缺乏明确对象。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Easier entry for new firms can encourage uses of emerging tools that have not yet been invented.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Even with new skills and new businesses, the distribution of income remains a concern.</p>\n</blockquote>\n<p>G末句讲新企业探索用途，B的Even with new skills and new businesses把前面的两类办法合起，再用remains a concern提出未解决的问题。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Automation can widen the gap between returns to capital and earnings from work. Tax policy and the safety net must therefore address a problem that education alone cannot solve.</p>\n</blockquote>\n<p>资本回报与劳动所得差距可能扩大，therefore把这一风险接到税收和安全网，说明教育不能独自解决。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies.</p>\n</blockquote>\n<p>C的Addressing that gap明确回指资本与劳动收入差距，然后给出减税与工资补贴的具体做法。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由劳动者能力转向企业创造新用途 → 指出技能与创业之外的收入分配问题 → 给出劳动减税和工资补贴措施</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Attention to that risk need not mean denying the long-run gains from technology.</p>\n</blockquote>\n<p>F返回长期收益与风险的关系，尚未建立收入gap，先接它会使C的that gap缺乏明确对象。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → C → H。\n\n先看前段B的结尾：\n\n> Tax policy and the safety net must therefore address a problem that education alone cannot solve.\n\n再看C段开头：\n\n> Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies.\n\nB说税收与安全网要处理教育无法独解的收入差距，C用Addressing that gap接住，并给出低工资劳动减税与补贴。\n\n本段内部继续写道：\n\n> These measures would support incomes while encouraging employment and rewarding job creation. Their purpose is to help workers share in economic change, not simply to increase returns to those who own machines.\n\nThese measures指两项措施，support incomes、encouraging employment等说明其如何使工人分享经济变化收益。\n\n后段H开头是：\n\n> Such support does not promise that every disrupted career can remain unchanged.\n\nH的Such support概括C的收入就业支持，再提醒这种帮助不保证所有职业维持原状，回到适应而非阻止一切变化。\n\n这三段的推进关系：\n\n> 指出技能与创业之外的收入分配问题 → 给出劳动减税和工资补贴措施 → 总结承认冲击并以政策帮助适应\n\n再检验候选F：\n\n> Attention to that risk need not mean denying the long-run gains from technology.\n\nF重新解释长期技术收益，没有给收入支持措施，不能使H的Such support紧接相应内容，也中断从分配问题到具体工具的推进。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Tax policy and the safety net must therefore address a problem that education alone cannot solve.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies.</p>\n</blockquote>\n<p>B说税收与安全网要处理教育无法独解的收入差距，C用Addressing that gap接住，并给出低工资劳动减税与补贴。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>These measures would support incomes while encouraging employment and rewarding job creation. Their purpose is to help workers share in economic change, not simply to increase returns to those who own machines.</p>\n</blockquote>\n<p>These measures指两项措施，support incomes、encouraging employment等说明其如何使工人分享经济变化收益。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Such support does not promise that every disrupted career can remain unchanged.</p>\n</blockquote>\n<p>H的Such support概括C的收入就业支持，再提醒这种帮助不保证所有职业维持原状，回到适应而非阻止一切变化。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>指出技能与创业之外的收入分配问题 → 给出劳动减税和工资补贴措施 → 总结承认冲击并以政策帮助适应</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Attention to that risk need not mean denying the long-run gains from technology.</p>\n</blockquote>\n<p>F重新解释长期技术收益，没有给收入支持措施，不能使H的Such support紧接相应内容，也中断从分配问题到具体工具的推进。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **lifelong learning** | **终身学习** | **社会现象类｜文化教育** | **宏观主题** |\n| creative potential | 创造潜能 | 人生哲理类｜创新 | 个人主题 |\n| problem-solving skills | 解决问题的能力 | 人生哲理类｜实践与思考 | 个人主题 |\n| **adaptability** | **适应能力** | **人生哲理类｜与时俱进** | **个人主题** |\n| entrepreneurship | 创业精神 | 人生哲理类｜进取与创新 | 个人主题 |\n| inclusive growth | 包容性增长 | 社会现象类｜科技经济 | 宏观主题 |\n| equal opportunities | 平等机会 | 社会现象类｜社会生活 | 宏观主题 |\n| employment support | 就业支持 | 社会现象类｜社会生活 | 宏观主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>lifelong learning</strong></td>\n<td><strong>终身学习</strong></td>\n<td><strong>社会现象类｜文化教育</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>creative potential</td>\n<td>创造潜能</td>\n<td>人生哲理类｜创新</td>\n<td>个人主题</t  perform a task alongside a machine.</strong></td>\n<td><strong>劳动者正在学习与机器共同完成任务。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The picture contrasts the promise of technology with the difficulty of adjustment.</td>\n<td>图画对比了技术的前景与适应的困难。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene highlights the importance of acquiring new skills.</td>\n<td>场景凸显了掌握新技能的重要性。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>The figures show that the risks are distributed unevenly across occupations.</strong></td>\n<td><strong>数据显示风险在不同职业之间分布不均。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The gap between two sources of income has widened.</td>\n<td>两种收入来源之间的差距扩大了。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>Productivity has increased while some workers face a period of transition.</td>\n<td>生产率有所提高，而部分劳动者面临转型期。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement stresses that long-term progress does not remove short-term difficulties.</td>\n<td>这句话强调长期进步不会消除短期困难。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage calls for policies that help people adapt to technological change.</td>\n<td>这段文字呼吁制定帮助人们适应技术变化的政策。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. Education that prepares people to work with technology</strong></p><p><strong>B. Supporting incomes while helping workers adapt</strong></p><p><strong>C. The uneven employment risks of automation</strong></p><p><strong>D. Guaranteed protection against every negative consequence</strong></p><p><strong>E. New businesses as a bridge through technological change</strong></p><p><strong>F. Long-run gains do not remove the need for help now</strong></p><p><strong>G. Restoring the economy by destroying machines</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs? Don&#x27;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#x27;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>This isn&#x27;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#x27;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier. In previous eras of drastic technological change, entrepreneurs smoothed the transition by dreaming up ways to combine labor and machines. The best uses of 3D printers and virtual reality haven&#x27;t been invented yet. The U.S. needs the new companies that will invent them.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought. Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality. Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation. Destroying the machines that are coming for our jobs would be nuts. But policies to help workers adapt will be indispensable.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Automation threatens jobs unevenly, and middle-class workers may face particular pressure. Some low-income services are less attractive to machines, while wealthy owners may benefit from the technology. The risk to the middle class therefore deserves attention rather than dismissal.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>Even with new skills and new businesses, the distribution of income remains a concern. Automation can widen the gap between returns to capital and earnings from work. Tax policy and the safety net must therefore address a problem that education alone cannot solve.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies. These measures would support incomes while encouraging employment and rewarding job creation. Their purpose is to help workers share in economic change, not simply to increase returns to those who own machines.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>Helping people through that period begins with education and job training. Schools should place more emphasis on creativity, complex communication and problem-solving. These capabilities prepare people for changing work and for cooperation with machines instead of relying only on the memorisation of facts.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>Making such training accessible is also essential. Online education can supplement traditional courses and reduce the cost of acquiring new skills. Workers who already have careers need opportunities to learn without taking on unsustainable debt merely to remain employable.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>Attention to that risk need not mean denying the long-run gains from technology. Earlier industrial changes eventually raised living standards and created new jobs. Automation may likewise increase productivity and lower prices, but these eventual benefits do not eliminate a difficult period of adjustment.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Employability also depends on businesses that discover new ways of combining labour and technology. In earlier transitions, entrepreneurs helped create these combinations. Easier entry for new firms can encourage uses of emerging tools that have not yet been invented.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>Such support does not promise that every disrupted career can remain unchanged. It recognises that technological progress offers little immediate comfort to someone whose work disappears. The practical response is to help people adapt, rather than attempting to destroy the machines or ignoring the adjustment they require.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>annoying</td>\n<td>adj.令人烦恼的</td>\n<td>challenges</td>\n<td>n.挑战</td>\n<td>middle class</td>\n<td>中产阶级</td>\n</tr>\n<tr>\n<td>unmentioned</td>\n<td>adj.未被提及的</td>\n<td>presidential campaign</td>\n<td>总统竞选</td>\n<td>probably</td>\n<td>adv.很可能</td>\n</tr>\n<tr>\n<td>come for</td>\n<td>前来夺取</td>\n<td>jobs</td>\n<td>n.工作</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>dismiss</td>\n<td>v.不予考虑</td>\n<td>automated</td>\n<td>adj.自动化的</td>\n<td>disproportionately</td>\n<td>adv.不成比例地</td>\n</tr>\n<tr>\n<td>squeezed</td>\n<td>adj.受挤压的</td>\n<td>day care</td>\n<td>日间照料</td>\n<td>appeal to</td>\n<td>吸引</td>\n</tr>\n<tr>\n<td>occupations</td>\n<td>n.职业</td>\n<td>arouse</td>\n<td>v.引起</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<t td>adj.低工资的</td>\n<td>subsidies</td>\n<td>n.补贴</td>\n<td>tax credit</td>\n<td>税收抵免</td>\n</tr>\n<tr>\n<td>boost</td>\n<td>v.提高</td>\n<td>job creation</td>\n<td>创造就业</td>\n<td>inequality</td>\n<td>n.不平等</td>\n</tr>\n</tbody></table></div>\n<h2>第7段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>comfort</td>\n<td>n.安慰</td>\n<td>careers</td>\n<td>n.职业生涯</td>\n<td>upended</td>\n<td>adj.被颠覆的</td>\n</tr>\n<tr>\n<td>automation</td>\n<td>n.自动化</td>\n<td>destroy</td>\n<td>v.摧毁</td>\n<td>nuts</td>\n<td>adj.疯狂的</td>\n</tr>\n<tr>\n<td>adapt</td>\n<td>v.适应</td>\n<td>indispensable</td>\n<td>adj.不可缺少的</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?</p>\n<h3>意群划分 · 第1段</h3>\n<p>Among the annoying challenges / facing the middle class / is one / that will probably go unmentioned / in the next presidential campaign: / What happens / when the robots come / for their jobs?</p>\n<h3>意群翻译 · 第1段</h3>\n<p>在那些恼人的挑战中 / 面对中产阶级的 / 有一个 / 可能不会被提及 / 在下次总统竞选中：/ 会发生什么 / 当机器人来 / 抢夺他们的工作？</p>\n<h3>标准译文 · 第1段</h3>\n<p>在中产阶级面临的诸多恼人挑战中，有一个可能不会在下次总统竞选中被提及：当机器人来抢夺他们的工作时会发生什么？</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Don&#39;t dismiss that possibility entirely. About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed. Lower-income jobs like gardening or day care don&#39;t appeal to robots. But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will. The rich own the robots, so they will be fine.</p>\n<h3>意群划分 · 第2段</h3>\n<p>Don&#39;t dismiss / that possibility / entirely.</p>\n<p>About half of U.S. jobs / are at high risk / of being automated, / according to a University of Oxford study, / with the middle class / disproportionately squeezed.</p>\n<p>Lower-income jobs / like gardening or day care / don&#39;t appeal to robots.</p>\n<p>But many middle-class occupations – / trucking, financial advice, software engineering – / have aroused their interest, / or soon will.</p>\n<p>The rich own the robots, / so they will be fine.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>不要忽视 / 那种可能性 / 完全地。</p>\n<p>大约一半的美国工作 / 处于高风险 / 被自动化的，/ 根据牛津大学的一项研究，/ 中产阶级 / 不成比例地受到挤压。</p>\n<p>低收入工作 / 像园艺或日托 / 对机器人没有吸引力。</p>\n<p>但许多中产阶级职业 – / 卡车运输、财务咨询、软件工程 – / 已经引起了它们的兴趣，/ 或很快会。</p>\n<p>富人拥有机器人，/ 所以他们会没事的。</p>\n<h3>标准译文 · 第2段</h3>\n<p>不要完全忽视这种可能性。根据牛津大学的一项研究，大约一半的美国工作面临被自动化的高风险，中产阶级受到的冲击尤为严重。像园艺或日托这样的低收入工作对机器人没有吸引力。但许多中产阶级职业——卡车运输、财务咨询、软件工程——已经或即将引起机器人的兴趣。富人拥有机器人，所以他们会没事的。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>This isn&#39;t to be alarmist. Optimists point out that technological upheaval has benefited workers in the past. The Industrial Revolution didn&#39;t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed. Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work. But in the medium term, middle-class workers may need a lot of help adjusting.</p>\n<h3>意群划分 · 第3段</h3>\n<p>This isn&#39;t / to be alarmist.</p>\n<p>Optimists point out / that technological upheaval / has benefited workers / in the past.</p>\n<p>The Industrial Revolution / didn&#39;t go so well / for Luddites / whose jobs were displaced / by mechanized looms, / but it eventually / raised living standards / and created more jobs / than it destroyed.</p>\n<p>Likewise, / automation should eventually / boost productivity, / stimulate demand / by driving down prices, / and free workers / from hard, boring work.</p>\n<p>But in the medium term, / middle-class workers / may need a lot of help / adjusting.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>这不是 / 为了危言耸听。</p>\n<p>乐观主义者指出 / 技术剧变 / 使工人受益 / 在过去。</p>\n<p>工业革命 / 进展不太顺利 / 对卢德分子来说 / 他们的工作被取代 / 被机械化织布机，/ 但它最终 / 提高了生活水平 / 并创造了更多工作 / 比它摧毁的。</p>\n<p>同样地，/ 自动化最终应该 / 提高生产力，/ 刺激需求 / 通过降低价格，/ 并解放工人 / 从艰苦、无聊的工作中。</p>\n<p>但在中期，/ 中产阶级工人 / 可能需要很多帮助 / 来适应。</p>\n<h3>标准译文 · 第3段</h3>\n<p>这并非危言耸听。乐观主义者指出，技术剧变在过去曾使工人受益。工业革命对那些被机械化织布机取代的卢德分子来说确实不太顺利，但最终提高了生活水平，创造的工作岗位超过了摧毁的。同样，自动化最终应该会提高生产力，通过降低价格刺激需求，并将工人从艰苦、无聊的工作中解放出来。但在中期，中产阶级工人可能需要大量帮助来适应。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training. Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication. Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots. Online education can supplement the traditional kind. It could make extra training and instruction affordable. Professionals trying to acquire new skills will be able to do so without going into debt.</p>\n<h3>意群划分 · 第4段</h3>\n<p>The first step, / as Erik Brynjolfsson and Andrew McAfee argue / in The Second Machine Age, / should be rethinking / education and job training.</p>\n<p>Curriculums – / from grammar school to college – / should evolve / to focus less / on memorizing facts / and more / on creativity and complex communication.</p>\n<p>Vocational schools / should do a better job / of fostering problem-solving skills / and helping students / work alongside robots.</p>\n<p>Online education / can supplement / the traditional kind.</p>\n<p>It could make / extra training and instruction / affordable.</p>\n<p>Professionals / trying to acquire new skills / will be
