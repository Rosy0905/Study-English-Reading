益掩盖具体适应困难。</p>\n<blockquote>\n<p>But policies to help workers adapt will be indispensable.</p>\n</blockquote>\n<p>indispensable收束在帮助适应的政策必要性，税收支持就是其中一条，不能概括为让技术停止发展。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>收入差距风险 → 减税补贴支持劳动与就业 → 技术进步仍需政策帮助适应</p>\n</blockquote>\n<p>supporting incomes对应减税与工资补贴，helping adapt对应末句政策方向。</p>\n<p>再看最强干扰项G：Restoring the economy by destroying machines。</p>\n<p>末段明确说毁机器是疯狂的，主张的是帮助适应。</p>\n<p><strong>45题选B。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Automation threatens jobs unevenly, and middle-class workers may face particular pressure. Some low-income services are less attractive to machines, while wealthy owners may benefit from the technology. The risk to the middle class therefore deserves attention rather than dismissal.</p>\n<p><strong>B.</strong></p>\n<p>Even with new skills and new businesses, the distribution of income remains a concern. Automation can widen the gap between returns to capital and earnings from work. Tax policy and the safety net must therefore address a problem that education alone cannot solve.</p>\n<p><strong>C.</strong></p>\n<p>Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies. These measures would support incomes while encouraging employment and rewarding job creation. Their purpose is to help workers share in economic change, not simply to increase returns to those who own machines.</p>\n<p><strong>D.</strong></p>\n<p>Helping people through that period begins with education and job training. Schools should place more emphasis on creativity, complex communication and problem-solving. These capabilities prepare people for changing work and for cooperation with machines instead of relying only on the memorisation of facts.</p>\n<p><strong>E.</strong></p>\n<p>Making such training accessible is also essential. Online education can supplement traditional courses and reduce the cost of acquiring new skills. Workers who already have careers need opportunities to learn without taking on unsustainable debt merely to remain employable.</p>\n<p><strong>F.</strong></p>\n<p>Attention to that risk need not mean denying the long-run gains from technology. Earlier industrial changes eventually raised living standards and created new jobs. Automation may likewise increase productivity and lower prices, but these eventual benefits do not eliminate a difficult period of adjustment.</p>\n<p><strong>G.</strong></p>\n<p>Employability also depends on businesses that discover new ways of combining labour and technology. In earlier transitions, entrepreneurs helped create these combinations. Easier entry for new firms can encourage uses of emerging tools that have not yet been invented.</p>\n<p><strong>H.</strong></p>\n<p>Such support does not promise that every disrupted career can remain unchanged. It recognises that technological progress offers little immediate comfort to someone whose work disappears. The practical response is to help people adapt, rather than attempting to destroy the machines or ignoring the adjustment they require.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>指出自动化对不同群体的不均衡冲击</td>\n</tr>\n<tr>\n<td>B</td>\n<td>指出技能与创业之外的收入分配问题</td>\n</tr>\n<tr>\n<td>C</td>\n<td>给出劳动减税和工资补贴措施</td>\n</tr>\n<tr>\n<td>D</td>\n<td>把适应需求落实为能力教育</td>\n</tr>\n<tr>\n<td>E</td>\n<td>补充培训可负担性和在职学习</td>\n</tr>\n<tr>\n<td>F</td>\n<td>承认长期收益同时提出适应期困难</td>\n</tr>\n<tr>\n<td>G</td>\n<td>由劳动者能力转向企业创造新用途</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结承认冲击并以政策帮助适应</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>指出自动化对不同群体的不均衡冲击 → 承认长期收益同时提出适应期困难 → 把适应需求落实为能力教育 → 补充培训可负担性和在职学习 → 由劳动者能力转向企业创造新用途 → 指出技能与创业之外的收入分配问题 → 给出劳动减税和工资补贴措施 → 总结承认冲击并以政策帮助适应</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>The risk to the middle class therefore deserves attention rather than dismissal.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Attention to that risk need not mean denying the long-run gains from technology.</p>\n</blockquote>\n<p>A要求认真看待中产风险，F的Attention to that risk回指同一风险，need not denying说明关注风险不等于否定技术收益。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Earlier industrial changes eventually raised living standards and created new jobs. Automation may likewise increase productivity and lower prices, but these eventual benefits do not eliminate a difficult period of adjustment.</p>\n</blockquote>\n<p>历史工业变迁与自动化的潜在收益先展开，but再指出eventual benefits不能取消困难的调整时期。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Helping people through that period begins with education and job training.</p>\n</blockquote>\n<p>D的Helping people through that period接F末句的period of adjustment，顺势将帮助需求落到教育培训。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>指出自动化对不同群体的不均衡冲击 → 承认长期收益同时提出适应期困难 → 把适应需求落实为能力教育</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Employability also depends on businesses that discover new ways of combining labour and technology.</p>\n</blockquote>\n<p>G的Employability also depends需要先说劳动者自身能力与培训；A还只提出风险，直接also补企业会跳过适应期及个人能力这一层。</p>\n<p><strong>41题选F。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Automation may likewise increase productivity and lower prices, but these eventual benefits do not eliminate a difficult period of adjustment.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Helping people through that period begins with education and job training.</p>\n</blockquote>\n<p>F留下a difficult period of adjustment，D以that period承接，并以education and job training回答怎么帮人度过。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Schools should place more emphasis on creativity, complex communication and problem-solving. These capabilities prepare people for changing work and for cooperation with machines instead of relying only on the memorisation of facts.</p>\n</blockquote>\n<p>创造、复杂沟通、解决问题与人机协作具体说明培训内容，区别于单纯记忆事实。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Making such training accessible is also essential.</p>\n</blockquote>\n<p>E的Making such training accessible指D列出的技能培训，再继续处理谁能负担和参加学习。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>承认长期收益同时提出适应期困难 → 把适应需求落实为能力教育 → 补充培训可负担性和在职学习</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Employability also depends on businesses that discover new ways of combining labour and technology.</p>\n</blockquote>\n<p>G转向企业发现新组合，虽也与就业有关，却不能给E的such training提供具体课程内容，also也缺少已展开的第一类能力措施。</p>\n<p><strong>42题选D。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Workers who already have careers need opportunities to learn without taking on unsustainable debt merely to remain employable.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Employability also depends on businesses that discover new ways of combining labour and technology.</p>\n</blockquote>\n<p>E末句谈在职者学习以remain employable，G的Employability also depends承接就业能力，再补企业一侧的条件。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>In earlier transitions, entrepreneurs helped create these combinations. Easier entry for new firms can encourage uses of emerging tools that have not yet been invented.</p>\n</blockquote>\n<p>创业者过去组合劳动与机器，新公司更易进入则有助探索新工具用途，将企业作用接到技术转型。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Even with new skills and new businesses, the distribution of income remains a concern.</p>\n</blockquote>\n<p>B的Even with new skills and new businesses同时收束前面的培训与创业，再提出两者之外仍有收入分配难题。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>补充培训可负担性和在职学习 → 由劳动者能力转向企业创造新用途 → 指出技能与创业之外的收入分配问题</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies.</p>\n</blockquote>\n<p>C开头that gap要求已经说明收入差距，E此时只谈学习负债和就业能力，不能跳过B提出的资本与劳动收入分化。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Easier entry for new firms can encourage uses of emerging tools that have not yet been invented.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Even with new skills and new businesses, the distribution of income remains a concern.</p>\n</blockquote>\n<p>G末句讲新企业探索用途，B的Even with new skills and new businesses把前面的两类办法合起，再用remains a concern提出未解决的问题。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Automation can widen the gap between returns to capital and earnings from work. Tax policy and the safety net must therefore address a problem that education alone cannot solve.</p>\n</blockquote>\n<p>资本回报与劳动所得差距可能扩大，therefore把这一风险接到税收和安全网，说明教育不能独自解决。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies.</p>\n</blockquote>\n<p>C的Addressing that gap明确回指资本与劳动收入差距，然后给出减税与工资补贴的具体做法。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由劳动者能力转向企业创造新用途 → 指出技能与创业之外的收入分配问题 → 给出劳动减税和工资补贴措施</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Attention to that risk need not mean denying the long-run gains from technology.</p>\n</blockquote>\n<p>F返回长期收益与风险的关系，尚未建立收入gap，先接它会使C的that gap缺乏明确对象。</p>\n<p><strong>44题选B。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Tax policy and the safety net must therefore address a problem that education alone cannot solve.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Addressing that gap could include lower taxes on low-paid work and stronger wage subsidies.</p>\n</blockquote>\n<p>B说税收与安全网要处理教育无法独解的收入差距，C用Addressing that gap接住
