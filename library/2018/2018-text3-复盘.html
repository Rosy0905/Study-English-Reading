alPart\" id=\"focus-q34-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>谨慎态度的关键是公共资源创造的价值是否集中到巨头手中。题干问real worry，应回答这种权力归属，不能只回到前面已经讨论的隐私执法。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the uncontrolled use of new software\u003cbr>新软件的失控使用\u003c/p>\n\u003c/blockquote>\n\u003cp>C抓住了软件，却换掉了作者明确指出的所有权问题，不能把各种可能的软件风险都归进这里的real worry。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出仅用隐私法处理没有触及真正担忧：公共资源开发的成果归私人垄断企业；最后强调长期应对，同时肯定报告是可喜的开始。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. the ineffective enforcement of privacy law","level":3,"raw":"### D. the ineffective enforcement of privacy law\n\n> 隐私法执行不力\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D的ineffective enforcement说法律执行不起作用，原文does not address the real worry说这种做法没触及真正担忧；都谈当前处理的不足，因此回看后一句把不足具体落到哪里。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\ndoes not address the real worry不是直接说“法律条文已经对准问题，只是执行太差”，而是紧接着另提What matters，把真正要讨论的东西放在公共资源开发的成果属于私人垄断者。D的ineffective enforcement却让人把原因继续理解成原有隐私法律执行得不够好。执行强弱与处理角度是否触及更深的问题不同：即便患者许可等隐私事项按要求处理，成果和权力由谁掌握的问题仍需要回答。D把作者往深一层追问的方向，又拉回眼前的执行成效。\n\nD把“没有解决真正担忧”缩成“执行效果不好”，遗漏了What matters后作者亲自指出的问题对象。\n\n**命题人借用的原文材料：**\n\n> The use of privacy law to curb the tech giants in this instance feels slightly maladapted.\n>\n> This practice does not address the real worry.\n>\n> What matters is that they will belong to a private monopoly which developed them using public resources.","context":{"mode":"image","asset":"questions","focus":[250,2206,1800,85],"sourceW":2256,"sourceH":3142,"label":"2018英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"34","option":"D"},"focusId":"focus-q3 托改正做法 + 未来安排将被审查）→ 需要学习知情同意的教训 // 但隐私不是唯一甚至最重要的角度 → 法律区分的局限：【德纳姆责备NHS（控制数据）而非DeepMind（处理数据）// 但忽略了要点：数据价值来自处理和聚合，非仅仅拥有】\n\n↓（核心问题探讨）\n\n**逻辑层次3：数据经济的本质**（段落3理论分析） 根本问题：谁应从数据分析中受益？→ 隐私法的局限：（基于对个人可识别知识造成损害的概念）→ 忽略了监控经济的运作方式：【个人数据只有与无数人的数据比较时才有价值】\n\n↓（真正的担忧）\n\n**逻辑层次4：数字封建主义的威胁**（段落4深层担忧与警示） 隐私法约束科技巨头不适应 → 真正担忧：【算法将属于私人垄断（使用公共资源开发）】→ 类比：大数据可能像大型制药公司一样行事 → 警示：【现在处于革命开始 + 小选择可能产生巨大后果 → 需要长期斗争避免数字封建主义】→ 德纳姆报告是受欢迎的开始\n\n↑（全文主旨）\n\n全文核心观点：虽然NHS与DeepMind的数据协议违反了患者隐私权，但更深层的问题是：使用公共资源开发的AI算法将被私人垄断，可能导致数字封建主义。需要超越隐私法的框架来应对这一挑战。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：背景介绍与问题呈现\u003c/strong>（段落1核心事件） 双方善意的合作：（NHS与DeepMind的交易）→ AI医疗应用潜力巨大 // 但可能导致权力集中 → 信息专员裁决：【皇家免费医院信托违规：（2015年移交160万患者记录 + 基于模糊协议 + 太少考虑患者权利和隐私期望）】\u003c/p>\n\u003cp>↓（各方反应与改进）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：表面改进与深层问题\u003c/strong>（段落2问题剖析） 表面反应：（DeepMind几乎道歉 + NHS信托改正做法 + 未来安排将被审查）→ 需要学习知情同意的教训 // 但隐私不是唯一甚至最重要的角度 → 法律区分的局限：【德纳姆责备NHS（控制数据）而非DeepMind（处理数据）// 但忽略了要点：数据价值来自处理和聚合，非仅仅拥有】\u003c/p>\n\u003cp>↓（核心问题探讨）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：数据经济的本质\u003c/strong>（段落3理论分析） 根本问题：谁应从数据分析中受益？→ 隐私法的局限：（基于对个人可识别知识造成损害的概念）→ 忽略了监控经济的运作方式：【个人数据只有与无数人的数据比较时才有价值】\u003c/p>\n\u003cp>↓（真正的担忧）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：数字封建主义的威胁\u003c/strong>（段落4深层担忧与警示） 隐私法约束科技巨头不适应 → 真正担忧：【算法将属于私人垄断（使用公共资源开发）】→ 类比：大数据可能像大型制药公司一样行事 → 警示：【现在处于革命开始 + 小选择可能产生巨大后果 → 需要长期斗争避免数字封建主义】→ 德纳姆报告是受欢迎的开始\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：虽然NHS与DeepMind的数据协议违反了患者隐私权，但更深层的问题是：使用公共资源开发的AI算法将被私人垄断，可能导致数字封建主义。需要超越隐私法的框架来应对这一挑战。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n**答案：C. A Promising Tool and an Unequal Concentration of Power / 有前景的工具与不平衡的权力集中**\n\n同时承认医疗潜力与技术巨头权力集中的风险。\n\n> Artificial intelligence may help clinicians recognise a danger early enough to protect a patient.\n>\n> A judgement based only on benefits, or only on fear, misses the tension that makes the agreement worth examining.\n\n段内推进：\n\n> 同时承认医疗潜力与技术巨头权力集中的风险。\n\nPromising Tool对应人工智能帮助医疗的潜力，Concentration of Power对应少数科技公司扩大影响；标题把正反两面放进同一次审视。\n\n最强干扰项E（Keeping Every Patient’s Data Permanently Unused）容易因相同话题进入考虑。但讨论治理风险并未要求全部数据永远停止使用。\n\n**41题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：C. A Promising Tool and an Unequal Concentration of Power / 有前景的工具与不平衡的权力集中\u003c/strong>\u003c/p>\n\u003cp>同时承认医疗潜力与技术巨头权力集中的风险。\u003c/p>\n\u003cblockquote>\n\u003cp>Artificial intelligence may help clinicians recognise a danger early enough to protect a patient.\u003c/p>\n\u003cp>A judgement based only on benefits, or only on fear, misses the tension that makes the agreement worth examining.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>同时承认医疗潜力与技术巨头权力集中的风险。\u003c/p>\n\u003c/blockquote>\n\u003cp>Promising Tool对应人工智能帮助医疗的潜力，Concentration of Power对应少数科技公司扩大影响；标题把正反两面放进同一次审视。\u003c/p>\n\u003cp>最强干扰项E（Keeping Every Patient’s Data Permanently Unused）容易因相同话题进入考虑。但讨论治理风险并未要求全部数据永远停止使用。\u003c/p>\n\u003cp>\u003cstrong>41题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n**答案：F. Consent Repairs an Important Part of the Deal / 知情同意修补协议的重要一环**\n\n说明授权和数据清理的必要性，再留下收益归属问题。\n\n> An agreement that gives too little attention to patients’ expectations creates a serious problem.\n>\n> It does not yet determine who should gain from the knowledge produced through the arrangement.\n\n段内推进：\n\n> 说明授权和数据清理的必要性 → 再留下收益归属问题。\n\nConsent对应解释用途、取得许可及去掉不必要记录，Important Part对应这些补救有效但尚未解决知识收益归谁的问题。\n\n最强干扰项G（Treating an Apology as a Complete Solution）容易因相同话题进入考虑。但道歉之后仍需要实际整改，且整改尚不能结束全部讨论。\n\n**42题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：F. Consent Repairs an Important Part of the Deal / 知情同意修补协议的重要一环\u003c/strong>\u003c/p>\n\u003cp>说明授权和数据清理的必要性，再留下收益归属问题。\u003c/p>\n\u003cblockquote>\n\u003cp>An agreement that gives too little attention to patients’ expectations creates a serious problem.\u003c/p>\n\u003cp>It does not yet determine who should gain from the knowledge produced through the arrangement.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明授权和数据清理的必要性 → 再留下收益归属问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>Consent对应解释用途、取得许可及去掉不必要记录，Important Part对应这些补救有效但尚未解决知识收益归谁的问题。\u003c/p>\n\u003cp>最强干扰项G（Treating an Apology as a Complete Solution）容易因相同话题进入考虑。但道歉之后仍需要实际整改，且整改尚不能结束全部讨论。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n**答案：D. Value Emerges When Records Are Combined / 记录结合时产生价值**\n\n从单份隐私转向聚合处理的价值来源及收益分配。\n\n> One record can reveal something about an individual; millions compared together can produce knowledge of a different order.\n>\n> The central question widens from who had access to a particular record to who benefits from the combined knowledge that many lives make possible.\n\n段内推进：\n\n> 从单份隐私转向聚合处理的价值来源及收益分配。\n\nRecords Are Combined对应比较数百万人的记录，Value Emerges对应聚合分析产生单份文件没有的模式知识；标题抓住价值产生的过程。\n\n最强干扰项E（Keeping Every Patient’s Data Permanently Unused）容易因相同话题进入考虑。但既然分析能创造价值，问题是如何治理这种创造，而非让资料一概闲置。\n\n**43题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：D. Value Emerges When Records Are Combined / 记录结合时产生价值\u003c/strong>\u003c/p>\n\u003cp>从单份隐私转向聚合处理的价值来源及收益分配。\u003c/p>\n\u003cblockquote>\n\u003cp>One record can reveal something about an individual; millions compared together can produce knowledge of a different order.\u003c/p>\n\u003cp>The central question widens from who had access to a particular record to who benefits from the combined knowledge that many lives make possible.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从单份隐私转向聚合处理的价值来源及收益分配。\u003c/p>\n\u003c/blockquote>\n\u003cp>Records Are Combined对应比较数百万人的记录，Value Emerges对应聚合分析产生单份文件没有的模式知识；标题抓住价值产生的过程。\u003c/p>\n\u003cp>最强干扰项E（Keeping Every Patient’s Data Permanently Unused）容易因相同话题进入考虑。但既然分析能创造价值，问题是如何治理这种创造，而非让资料一概闲置。\u003c/p>\n\u003cp>\u003cstrong>43题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n**答案：A. Public Inputs and Privately Controlled Results / 公共投入与私人控制的成果**\n\n指出公共数据投入与私人垄断成果之间的制度矛盾。\n\n> An algorithm may be developed with information collected through a public health system and still become the property of a private monopoly.\n>\n> The issue is not simply whether software saves lives, but how control over valuable tools is organised after they have been developed.\n\n段内推进：\n\n> 指出公共数据投入与私人垄断成果之间的制度矛盾。\n\nPublic Inputs对应公共医疗体系收集的信息，Privately Controlled Results对应算法成为私人垄断财产；标题展示投入来源与成果控制的不对称。\n\n最强干扰项G（Treating an Apology as a Complete Solution）容易因相同话题进入考虑。但收益与控制权结构无法仅凭一封道歉改变。\n\n**44题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：A. Public Inputs and Privately Controlled Results / 公共投入与私人控制的成果\u003c/strong>\u003c/p>\n\u003cp>指出公共数据投入与私人垄断成果之间的制度矛盾。\u003c/p>\n\u003cblockquote>\n\u003cp>An algorithm may be developed with information collected through a public health system and still become the property of a private monopoly.\u003c/p>\n\u003cp>The issue is not simply whether software saves lives, but how control over valuable tools is organised after they have been developed.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>指出公共数据投入与私人垄断成果之间的制度矛盾。\u003c/p>\n\u003c/blockquote>\n\u003cp>Public Inputs对应公共医疗体系收集的信息，Privately Controlled Results对应算法成为私人垄断财产；标题展示投入来源与成果控制的不对称。\u003c/p>\n\u003cp>最强干扰项G（Treating an Apology as a Complete Solution）容易因相同话题进入考虑。但收益与控制权结构无法仅凭一封道歉改变。\u003c/p>\n\u003cp>\u003cstrong>44题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n**答案：B. Small Choices with Long-term Institutional Effects / 小决定的长期制度后果**\n\n把早期协议选择放进长期知识控制和制度形成过程。\n\n> At the beginning of a technological change, a narrow administrative decision can establish a much larger pattern.\n>\n> Early scrutiny is valuable because arrangements are easier to question before they harden into a system on which everyone else depends.\n\n段内推进：\n\n> 把早期协议选择放进长期知识控制和制度形成过程。\n\nSmall Choices对应初期看似狭窄的协议决定，Long-term Institutional Effects对应它们累积形成知识、价格及竞争控制格局。\n\n最强干扰项C（A Promising Tool and an Unequal Concentration of Power）容易因相同话题进入考虑。但医疗潜力与风险是起点，这一段进一步强调早期规则的长期后果。\n\n**45题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：B. Small Choices with Long-term Institutional Effects / 小决定的长期制度后果\u003c/strong>\u003c/p>\n\u003cp>把早期协议选择放进长期知识控制和制度形成过程。\u003c/p>\n\u003cblockquote>\n\u003cp>At the beginning of a technological change, a narrow administrative decision can establish a much larger pattern.\u003c/p>\n\u003cp>Early scrutiny is valuable because arrangements are easier to question before they harden into a system on which everyone else depends.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>把早期协议选择放进长期知识控制和制度形成过程。\u003c/p>\n\u003c/blockquote>\n\u003cp>Small Choices对应初期看似狭窄的协议决定，Long-term Institutional Effects对应它们累积形成知识、价格及竞争控制格局。\u003c/p>\n\u003cp>最强干扰项C（A Promising Tool and an Unequal Concentration of Power）容易因相同话题进入考虑。但医疗潜力与风险是起点，这一段进一步强调早期规则的长期后果。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出医疗价值与权力风险并存 |\n| B | 区分疗效与所有权正当性 |\n| C | 指出公共投入与私人控制的关系 |\n| D | 讨论知情同意并保留更广问题 |\n| E | 说明仅区分持有和处理不足以分配收益 |\n| F | 解释小协议如何形成长期制度 |\n| G | 引入数据聚合创造知识 |\n| H | 总结创新、隐私、权力及收益的综合治理 |\n\n全文推进：\n\n> 提出医疗价值与权力风险并存 → 讨论知情同意并保留更广问题 → 引入数据聚合创造知识 → 说明仅区分持有和处理不足以分配收益 → 指出公共投入与私人控制的关系 → 区分疗效与所有权正当性 → 解释小协议如何形成长期制度 → 总结创新、隐私、权力及收益的综合治理\n\n完整顺序：\n\n**A → D → G → E → C → B → F → H**\n\n41—45：D、G、C、B、F。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出医疗价值与权力风险并存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>区分疗效与所有权正当性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>指出公共投入与私人控制的关系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>讨论知情同意并保留更广问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>说明仅区分持有和处理不足以分配收益\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>解释小协议如何形成长期制度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>引入数据聚合创造知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>总结创新、隐私、权力及收益的综合治理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出医疗价值与权力风险并存 → 讨论知情同意并保留更广问题 → 引入数据聚合创造知识 → 说明仅区分持有和处理不足以分配收益 → 指出公共投入与私人控制的关系 → 区分疗效与所有权正当性 → 解释小协议如何形成长期制度 → 总结创新、隐私、权力及收益的综合治理\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → G → E → C → B → F → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、G、C、B、F。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41位于全文第2个位置，完整衔接是A → D → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段A的结尾：\n\n> To judge the arrangement fairly, it is necessary to acknowledge the medical promise before asking how that promise is being organised.\n\n候选D的开头：\n\n> The arrangement first raises a question of permission.\n\n后段G的开头：\n\n> A further question concerns where the value of the exchange comes from.\n\n前文已经落到`the arrangement`，D继续处理这一对象，完成“讨论知情同意并保留更广问题”。到本段末尾，讨论又落到`every question`，这正好为下一段“引入数据聚合创造知识”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 提出医疗价值与权力风险并存 → 讨论知情同意并保留更广问题 → 引入数据聚合创造知识\n\n最强候选G的功能是“引入数据聚合创造知识”。它也属于同一论题，但若直接放在这里，就会跳过“讨论知情同意并保留更广问题”这一必要环节；其段首“A further question concerns where the value of the exchange comes from.”需要的前提与A当前收束的对象不一致，后续也接不出G所需的`every question`。\n\n**41题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41位于全文第2个位置，完整衔接是A → D → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To judge the arrangement fairly, it is necessary to acknowledge the medical promise before asking how that promise is being organised.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The arrangement first raises a question of permission.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A further question concerns where the value of the exchange comes from.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>the arrangement\u003c/code>，D继续处理这一对象，完成“讨论知情同意并保留更广问题”。到本段末尾，讨论又落到\u003ccode>every question\u003c/code>，这正好为下一段“引入数据聚合创造知识”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出医疗价值与权力风险并存 → 讨论知情同意并保留更广问题 → 引入数据聚合创造知识\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选G的功能是“引入数据聚合创造知识”。它也属于同一论题，但若直接放在这里，就会跳过“讨论知情同意并保留更广问题”这一必要环节；其段首“A further question concerns where the value of the exchange comes from.”需要的前提与A当前收束的对象不一致，后续也接不出G所需的\u003ccode>every question\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42位于全文第3个位置，完整衔接是D → G → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段D的结尾：\n\n> Correcting these failures can improve a flawed agreement, but it does not settle every question the exchange creates.\n\n候选G的开头：\n\n> A further question concerns where the value of the exchange comes from.\n\n后段E的开头：\n\n> Knowledge produced by analysis can have considerable commercial value.\n\n前文已经落到`every question`，G继续处理这一对象，完成“引入数据聚合创造知识”。到本段末尾，讨论又落到`knowledge produced by analysis`，这正好为下一段“说明仅区分持有和处理不足以分配收益”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 讨论知情同意并保留更广问题 → 引入数据聚合创造知识 → 说明仅区分持有和处理不足以分配收益\n\n最强候选D的功能是“讨论知情同意并保留更广问题”。它也属于同一论题，但若直接放在这里，就会跳过“引入数据聚合创造知识”这一必要环节；其段首“The arrangement first raises a question of permission.”需要的前提与D当前收束的对象不一致，后续也接不出E所需的`knowledge produced by analysis`。\n\n**42题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42位于全文第3个位置，完整衔接是D → G → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Correcting these failures can improve a flawed agreement, but it does not settle every question the exchange creates.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A further question concerns where the value of the exchange comes from.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Knowledge produced by analysis can have considerable commercial value.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>every question\u003c/code>，G继续处理这一对象，完成“引入数据聚合创造知识”。到本段末尾，讨论又落到\u003ccode>knowledge produced by analysis\u003c/code>，这正好为下一段“说明仅区分持有和处理不足以分配收益”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>讨论知情同意并保留更广问题 → 引入数据聚合创造知识 → 说明仅区分持有和处理不足以分配收益\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“讨论知情同意并保留更广问题”。它也属于同一论题，但若直接放在这里，就会跳过“引入数据聚合创造知识”这一必要环节；其段首“The arrangement first raises a question of permission.”需要的前提与D当前收束的对象不一致，后续也接不出E所需的\u003ccode>knowledge produced by analysis\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43位于全文第5个位置，完整衔接是E → C → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段E的结尾：\n\n> Possession and processing are different activities, but that distinction alone cannot tell us who should receive the resulting benefits.\n\n候选C的开头：\n\n> The resulting benefits may be privately controlled even when public resources helped create them.\n\n后段B的开头：\n\n> Those conditions matter even if the tool fulfils its promise to improve treatment.\n\n前文已经落到`resulting benefits`，C继续处理这一对象，完成“指出公共投入与私人控制的关系”。到本段末尾，讨论又落到`conditions`，这正好为下一段“区分疗效与所有权正当性”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 说明仅区分持有和处理不足以分配收益 → 指出公共投入与私人控制的关系 → 区分疗效与所有权正当性\n\n最强候选B的功能是“区分疗效与所有权正当性”。它也属于同一论题，但若直接放在这里，就会跳过“指出公共投入与私人控制的关系”这一必要环节；其段首“Those conditions matter even if the tool fulfils its promise to improve treatment.”需要的前提与E当前收束的对象不一致，后续也接不出B所需的`conditions`。\n\n**43题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43位于全文第5个位置，完整衔接是E → C → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Possession and processing are different activities, but that distinction alone cannot tell us who should receive the resulting benefits.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The resulting benefits may be privately controlled even when public resources helped create them.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those conditions matter even if the tool fulfils its promise to improve treatment.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>resulting benefits\u003c/code>，C继续处理这一对象，完成“指出公共投入与私人控制的关系”。到本段末尾，讨论又落到\u003ccode>conditions\u003c/code>，这正好为下一段“区分疗效与所有权正当性”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c kquote>\n\u003cp>Future use is shaped by decisions made early in the development of a system.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That institutional pattern is why scrutiny must extend beyond an apology or a repaired consent form.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>future use\u003c/code>，F继续处理这一对象，完成“解释小协议如何形成长期制度”。到本段末尾，讨论又落到\u003ccode>institutional pattern\u003c/code>，这正好为下一段“总结创新、隐私、权力及收益的综合治理”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>区分疗效与所有权正当性 → 解释小协议如何形成长期制度 → 总结创新、隐私、权力及收益的综合治理\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“区分疗效与所有权正当性”。它也属于同一论题，但若直接放在这里，就会跳过“解释小协议如何形成长期制度”这一必要环节；其段首“Those conditions matter even if the tool fulfils its promise to improve treatment.”需要的前提与B当前收束的对象不一致，后续也接不出H所需的\u003ccode>institutional pattern\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选F。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **responsible technological innovation** | **负责任的技术创新** | **社会现象类：科技发展** | **宏观主题** |\n| respect for privacy | 尊重隐私 | 人生哲理类：理解、信任、宽容 | 个人主题 |\n| fair access to medical benefits | 公平获得医疗收益 | 社会现象类：生活质量 | 宏观主题 |\n| **public trust** | **公众信任** | **人生哲理类：理解、信任、宽容** | **宏观主题** |\n| independent scrutiny | 独立审视 | 人生哲理类：批判、独立、全局思维 | 个人主题 |\n| cooperation for public benefit | 为公共利益合作 | 人生哲理类：团结合作 | 宏观主题 |\n| **long-term responsibility** | **长期责任** | **人生哲理类：责任感、奉献精神** | **个人主题** |\n| informed choice | 知情选择 | 人生哲理类：批判、独立、全局思维 | 个人主题 |\n| shared scientific progress | 共享科学进步 | 社会现象类：科技发展 | 宏观主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003c \n| **图画题** | **The picture places the promise of a new technology beside questions about its control.** | **图画将新技术的潜力与其控制权问题并列呈现。** |\n| 图画题 | A is turning information supplied by many people into a valuable tool. | A正把许多人提供的信息转化为有价值的工具。 |\n| 图画题 | The contrast raises a question about who should benefit from shared resources. | 这一对比引出谁应从共享资源中受益的问题。 |\n| **图表题** | **The amount of data used by A grew from X to Y.** | **A使用的数据量由X增至Y。** |\n| 图表题 | The figures show that control over A became concentrated in fewer organisations. | 这些数字显示A的控制权集中到更少的机构手中。 |\n| 图表题 | The scale of A increased much faster than the number of groups benefiting from it. | A的规模增长远快于受益群体数量的增长。 |\n| **文本评论题** | **The passage acknowledges the promise of A while warning about the power it may concentrate.** | **短文承认A的潜力，同时警惕它可能集中的权力。** |\n| 文本评论题 | The author asks who should benefit from knowledge produced with public resources. | 作者追问谁应从利用公共资源产生的知识中受益。 |\n| 文本评论题 | The discussion suggests that a small decision today may have far-reaching consequences. | 讨论表明今天的一个小决定可能产生深远后果。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2018英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture places the promise of a new technology beside questions about its control.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画将新技术的潜力与其控制权问题并列呈现。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is turning information supplied by many people into a valuable tool.\u003c/td>\n\u003ctd>A正把许多人提供的信息转化为有价值的工具。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast raises a question about who should benefit from shared resources.\u003c/td>\n\u003ctd>这一对比引出谁应从共享资源中受益的问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The amount of data used by A grew from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>A使用的数据量由X增至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures show that control over A became concentrated in fewer organisations.\u003c/td>\n\u003ctd>这些数字显示A的控制权集中到更少的机构手中。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The scale of A increased much faster than the number of groups benefiting from it.\u003c/td>\n\u003ctd>A的规模增长远快于受益群体数量的增长。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage acknowledges the promise of A while warning about the power it may concentrate.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文承认A的潜力，同时警惕它可能集中的权力。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author asks who should benefit from knowledge produced with public resources.\u003c/td>\n\u003ctd>作者追问谁应从利用公共资源产生的知识中受益。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion suggests that a small decision today may have far-reaching consequences.\u003c/td>\n\u003ctd>讨论表明今天的一个小决定可能产生深远后果。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Public Inputs and Privately Controlled Results\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Small Choices with Long-term Institutional Effects\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. A Promising Tool and an Unequal Concentration of Power\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. Value Emerges When Records Are Combined\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Keeping Every Patient’s Data Permanently Unused\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Consent Repairs an Important Part of the Deal\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Treating an Apology as a Complete Solution\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>Artificial intelligence may help clinicians recognise a danger early enough to protect a patient. Acknowledging that promise is essential to a fair assessment of a health data agreement. Yet a useful application can also place more influence in the hands of a small number of technology companies. The two possibilities belong in the same discussion. A judgement based only on benefits, or only on fear, misses the tension that makes the agreement worth examining.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>An agreement that gives too little attention to patients’ expectations creates a serious problem. Obtaining the necessary permission, removing unnecessary records and explaining future arrangements can address that problem. These steps are more substantial than a simple apology because they change how information is handled. Even so, repairing the consent process answers only part of the debate. It does not yet determine who should gain from the knowledge produced through the arrangement.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>One record can reveal something about an individual; millions compared together can produce knowledge of a different order. Patterns become visible through aggregation and analysis, not merely through possession of separate files. A legal distinction between the body holding data and the company processing it may consequently overlook where economic value arises. The central question widens from who had access to a particular record to who benefits from the combined knowledge that many lives make possible.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>An algorithm may be developed with information collected through a public health system and still become the property of a private monopoly. Its medical usefulness does not settle whether that ownership arrangement is fair. Public resources contribute to the process, so the public has an interest in the terms on which the result can be used. The issue is not simply whether software saves lives, but how control over valuable tools is organised after they have been developed.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>At the beginning of a technological change, a narrow administrative decision can establish a much larger pattern. Repeated agreements may gradually determine who controls knowledge, who sets prices and who can develop competing tools. Decisions about permissions remain important, but they should be accompanied by attention to these institutional effects. Early scrutiny is valuable because arrangements are easier to question before they harden into a system on which everyone else depends.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>A proposed medical application can be both valuable and troubling. Software may help improve care, while the data agreement supporting it can increase a company’s power. To judge the arrangement fairly, it is necessary to acknowledge the medical promise before asking how that promise is being organised.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Those conditions matter even if the tool fulfils its promise to improve treatment. Effectiveness answers a medical question; it does not automatically justify every arrangement for ownership or access. A life-saving technology can still operate within a concentrated market in which the public has little influence over its future use.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>The resulting benefits may be privately controlled even when public resources helped create them. Information collected through a health service can support an algorithm that becomes a company’s property. Patients and taxpayers then have a reason to ask about the conditions under which the tool will later be available to them.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>The arrangement first raises a question of permission. Patients need appropriate information about the use of their records, and unnecessary data should not be retained merely because it is available. Correcting these failures can improve a flawed agreement, but it does not settle every question the exchange creates.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>Knowledge produced by analysis can have considerable commercial value. A rule concerned only with who originally held the records may fail to account for the company that transforms them into a powerful tool. Possession and processing are different activities, but that distinction alone cannot tell us who should receive the resulting benefits.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>Future use is shaped by decisions made early in the development of a system. One apparently small agreement may become a model for many others. If the same distribution of control is repeated, it can turn a temporary choice into a durable institutional pattern that later users find difficult to change.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>A further question concerns where the value of the exchange comes from. A single patient’s record has one kind of significance; comparing it with millions of others can reveal patterns that no isolated file supplies. The knowledge produced by analysis therefore deserves attention alongside the protection of individual privacy.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>That institutional pattern is why scrutiny must extend beyond an apology or a repaired consent form. Both medical innovation and privacy protection remain necessary, but so does public discussion of power and benefit. A useful technology deserves rules that make its value broadly accessible rather than automatically concentrating control.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2018英语一Text 3重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>fair-minded\u003c/td>\n\u003ctd>a.公正的\u003c/td>\n\u003ctd>assessment\u003c/td>\n\u003ctd>n.评估\u003c/td>\n\u003ct
