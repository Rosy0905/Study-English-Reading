3ctd>巨大后果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>struggle\u003c/td>\n\u003ctd>n.斗争\u003c/td>\n\u003ctd>avoid\u003c/td>\n\u003ctd>v.避免\u003c/td>\n\u003ctd>digital feudalism\u003c/td>\n\u003ctd>数字封建制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>report\u003c/td>\n\u003ctd>n.报告\u003c/td>\n\u003ctd>welcome\u003c/td>\n\u003ctd>a.受欢迎的\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Any fair-minded assessment of the dangers of the deal between Britain&#39;s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well. DeepMind is one of the leading artificial intelligence (AI) companies in the world. The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants. It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a vague agreement which took far too little account of the patients&#39; rights and their expectations of privacy.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Any fair-minded assessment / of the dangers / of the deal / between Britain&#39;s National Health Service (NHS) and DeepMind / must start / by acknowledging / that both sides mean well.\u003c/p>\n\u003cp>DeepMind is / one of the leading artificial intelligence (AI) companies / in the world.\u003c/p>\n\u003cp>The potential / of this work / applied to healthcare / is very great, / but it could also lead to / further concentration of power / in the tech giants.\u003c/p>\n\u003cp>It is against that background / that the information commissioner, / Elizabeth Denham, / has issued her damning verdict / against the Royal Free hospital trust / under the NHS, / which handed over to DeepMind / the records of 1.6 million patients / in 2015 / on the basis of a vague agreement / which took far too little account / of the patients&#39; rights / and their expectations of privacy.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>任何公正的评估 / 关于危险 / 这项交易的 / 在英国国家卫生服务体系（NHS）和DeepMind之间 / 必须开始 / 通过承认 / 双方都是善意的。\u003c/p>\n\u003cp>DeepMind是 / 世界领先的人工智能（AI）公司之一 / 在世界上。\u003c/p>\n\u003cp>潜力 / 这项工作的 / 应用于医疗保健 / 是非常巨大的，/ 但它也可能导致 / 权力的进一步集中 / 在科技巨头手中。\u003c/p>\n\u003cp>正是在这种背景下 / 信息专员，/ 伊丽莎白·德纳姆，/ 发布了她的严厉裁决 / 针对皇家免费医院信托 / 在NHS下，/ 该信托向DeepMind移交了 / 160万患者的记录 / 在2015年 / 基于一个模糊的协议 / 该协议太少考虑 / 患者的权利 / 和他们对隐私的期望。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>对英国国家卫生服务体系（NHS）与DeepMind之间交易危险性的任何公正评估，都必须首先承认双方都是出于善意。DeepMind是世界领先的人工智能公司之一。这项工作应用于医疗保健的潜力巨大，但也可能导致权力进一步集中在科技巨头手中。正是在这种背景下，信息专员伊丽莎白·德纳姆对NHS旗下的皇家免费医院信托发布了严厉裁决，该信托在2015年基于一个模糊的协议向DeepMind移交了160万患者的记录，而这个协议对患者权利和他们的隐私期望考虑得太少。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>DeepMind has almost apologized. The NHS trust has mended its ways. Further arrangements – and there may be many – between the NHS and DeepMind will be carefully scrutinised to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned. There are lessons about informed patient consent to learn. But privacy is not the only angle in this case and not even the most important. Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it &quot;controlled&quot; the data and DeepMind merely &quot;processed&quot; it. But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>DeepMind has almost apologized.\u003c/p>\n\u003cp>The NHS trust / has mended its ways.\u003c/p>\n\u003cp>Further arrangements – / and there may be many – / between the NHS and DeepMind / will be carefully scrutinised / to ensure / that all necessary permissions / have been asked of patients / and all unnecessary data / has been cleaned.\u003c/p>\n\u003cp>There are lessons / about informed patient consent / to learn.\u003c/p>\n\u003cp>But privacy is not / the only angle / in this case / and not even the most important.\u003c/p>\n\u003cp>Ms Denham chose / to concentrate the blame / on the NHS trust, / since under existing law / it &quot;controlled&quot; the data / and DeepMind merely &quot;processed&quot; it.\u003c/p>\n\u003cp>But this distinction / misses the point / that it is processing and aggregation, / not the mere possession of bits, / that gives the data value.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>DeepMind几乎道歉了。\u003c/p>\n\u003cp>NHS信托 / 已经改正了它的做法。\u003c/p>\n\u003cp>进一步的安排 – / 可能会有很多 – / 在NHS和DeepMind之间 / 将被仔细审查 / 以确保 / 所有必要的许可 / 已经向患者征求 / 并且所有不必要的数据 / 已经被清理。\u003c/p>\n\u003cp>有一些教训 / 关于知情患者同意 / 需要学习。\u003c/p>\n\u003cp>但隐私不是 / 唯一的角度 / 在这个案例中 / 甚至不是最重要的。\u003c/p>\n\u003cp>德纳姆女士选择 / 把责任集中 / 在NHS信托上，/ 因为根据现行法律 / 它&quot;控制&quot;数据 / 而DeepMind仅仅&quot;处理&quot;它。\u003c/p>\n\u003cp>但这种区分 / 忽略了要点 / 即是处理和聚合，/ 而不是仅仅拥有比特，/ 赋予数据价值。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>DeepMind几乎道了歉。NHS信托已经改正了做法。NHS和DeepMind之间的进一步安排——可能会有很多——将被仔细审查，以确保已经向患者征求了所有必要的许可，并清理了所有不必要的数据。关于知情患者同意，有一些教训需要学习。但隐私不是这个案例中的唯一角度，甚至不是最重要的。德纳姆女士选择把责任集中在NHS信托上，因为根据现行法律，它&quot;控制&quot;数据，而DeepMind仅仅&quot;处理&quot;数据。但这种区分忽略了要点：是处理和聚合，而不是仅仅拥有比特，赋予了数据价值。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>The great question is who should benefit from the analysis of all the data that our lives now generate. Privacy law builds on the concept of damage to an individual from identifiable knowledge about them. That misses the way the surveillance economy works. The data of an individual there gains its value only when it is compared with the data of countless millions more.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>The great question is / who should benefit / from the analysis / of all the data / that our lives now generate.\u003c/p>\n\u003cp>Privacy law / builds on the concept / of damage to an individual / from identifiable knowledge / about them.\u003c/p>\n\u003cp>That misses / the way / the surveillance economy works.\u003c/p>\n\u003cp>The data of an individual / there / gains its value / only when it is compared / with the data / of countless millions more.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>这个重大问题是 / 谁应该受益 / 从分析中 / 所有数据的 / 我们的生活现在产生的。\u003c/p>\n\u003cp>隐私法 / 建立在概念上 / 对个人的损害 / 从可识别的知识 / 关于他们。\u003c/p>\n\u003cp>那忽略了 / 方式 / 监控经济运作的。\u003c/p>\n\u003cp>一个人的数据 / 在那里 / 获得它的价值 / 只有当它被比较 / 与数据 / 无数百万人的。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>重大问题是：谁应该从我们生活现在产生的所有数据的分析中受益。隐私法建立在这样的概念上：个人因关于他们的可识别知识而受到损害。这忽略了监控经济的运作方式。在那里，个人数据只有在与无数百万人的数据进行比较时才获得价值。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>The use of privacy law to curb the tech giants in this instance feels slightly maladapted. This practice does not address the real worry. It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives. What matters is that they will belong to a private monopoly which developed them using public resources. If software promises to save lives on the scale that drugs now can, big data may be expected to behave as a big pharma has done. We are still at the beginning of this revolution and small choices now may turn out to have gigantic consequences later. A long struggle will be needed to avoid a future of digital feudalism. Ms Denham&#39;s report is a welcome start.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>The use of privacy law / to curb the tech giants / in this instance / feels slightly maladapted.\u003c/p>\n\u003cp>This practice / does not address / the real worry.\u003c/p>\n\u003cp>It is not enough / to say / that the algorithms / DeepMind develops / will benefit patients / and save lives.\u003c/p>\n\u003cp>What matters is / that they will belong to / a private monopoly / which developed them / using public resources.\u003c/p>\n\u003cp>If software promises / to save lives / on the scale / that drugs now can, / big data may be expected / to behave / as a big pharma has done.\u003c/p>\n\u003cp>We are still / at the beginning / of this revolution / and small choices now / may turn out / to have gigantic consequences later.\u003c/p>\n\u003cp>A long struggle / will be needed / to avoid / a future of digital feudalism.\u003c/p>\n\u003cp>Ms Denham&#39;s report / is a welcome start.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>使用隐私法 / 来约束科技巨头 / 在这个例子中 / 感觉有些不适应。\u003c/p>\n\u003cp>这种做法 / 没有解决 / 真正的担忧。\u003c/p>\n\u003cp>这是不够的 / 说 / 算法 / DeepMind开发的 / 将使患者受益 / 并拯救生命。\u003c/p>\n\u003cp>重要的是 / 它们将属于 / 一个私人垄断 / 开发它们的 / 使用公共资源。\u003c/p>\n\u003cp>如果软件承诺 / 拯救生命 / 在规模上 / 药物现在能做到的，/ 大数据可能被期望 / 表现 / 像大型制药公司所做的那样。\u003c/p>\n\u003cp>我们仍然 / 在开始阶段 / 这场革命的 / 现在的小选择 / 可能会 / 产生巨大的后果在以后。\u003c/p>\n\u003cp>一场漫长的斗争 / 将是必要的 / 为了避免 / 数字封建主义的未来。\u003c/p>\n\u003cp>德纳姆女士的报告 / 是一个受欢迎的开始。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>在这个例子中，使用隐私法来约束科技巨头感觉有些不适应。这种做法没有解决真正的担忧。仅仅说DeepMind开发的算法将使患者受益并拯救生命是不够的。重要的是，这些算法将属于一个使用公共资源开发它们的私人垄断企业。如果软件承诺能像药物现在所能做到的那样大规模拯救生命，大数据可能会像大型制药公司那样行事。我们仍处于这场革命的开始阶段，现在的小选择可能会在以后产生巨大的后果。需要一场漫长的斗争来避免数字封建主义的未来。德纳姆女士的报告是一个受欢迎的开始。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>Any fair-minded assessment：(of the dangers：(of the deal：(between Britain&#39;s National Health Service (NHS) and DeepMind))) → must start：(by acknowledging：(that both sides mean well)).\u003c/p>\n\u003cp>DeepMind is → one of the leading artificial intelligence (AI) companies：(in the world).\u003c/p>\n\u003cp>The potential：(of this work：(applied to healthcare)) → is very great // but it could also lead to → further concentration of power：(in the tech giants).\u003c/p>\n\u003cp>It is against that background → that the information commissioner：(Elizabeth Denham) → has issued her damning verdict：(against the Royal Free hospital trust：(under the NHS))：(which handed over to DeepMind → the records of 1.6 million patients：(in 2015)：(on the basis of a vague agreement：(which took far too little account：(of the patients&#39; rights + their expectations of privacy)))).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>DeepMind has almost apologized.\u003c/p>\n\u003cp>The NHS trust → has mended its ways.\u003c/p>\n\u003cp>Further arrangements：(and there may be many)：(between the NHS and DeepMind) → will be carefully scrutinised → to ensure：(that all necessary permissions → have been asked of patients) + (all unnecessary data → has been cleaned).\u003c/p>\n\u003cp>There are lessons：(about informed patient consent) → to learn.\u003c/p>\n\u003cp>But privacy is not → the only angle：(in this case) + not even the most important.\u003c/p>\n\u003cp>Ms Denham chose → to concentrate the blame：(on the NHS trust)：(since under existing law → it &quot;controlled&quot; the data + DeepMind merely &quot;processed&quot; it).\u003c/p>\n\u003cp>But this distinction → misses the point：(that it is processing and aggregation + not the mere possession of bits → that gives the data value).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>The great question is → who should benefit：(from the analysis：(of all the data：(that our lives now generate))).\u003c/p>\n\u003cp>Privacy law → builds on the concept：(of damage to an individual：(from identifiable knowledge：(about them))).\u003c/p>\n\u003cp>That misses → the way：(the surveillance economy works).\u003c/p>\n\u003cp>The data of an individual there → gains its value → only when it is compared：(with the data：(of countless millions more)).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>The use of privacy law：(to curb the tech giants)：(in this instance) → feels slightly maladapted.\u003c/p>\n\u003cp>This practice → does not address → the real worry.\u003c/p>\n\u003cp>It is not enough → to say：(that the algorithms：(DeepMind develops) → will benefit patients + save lives).\u003c/p>\n\u003cp>What matters is → that they will belong to → a private monopoly：(which developed them：(using public resources)).\u003c/p>\n\u003cp>If software promises → to save lives：(on the scale：(that drugs now can)) → big data may be expected → to behave：(as a big pharma has done).\u003c/p>\n\u003cp>We are still → at the beginning：(of this revolution) + small choices now → may turn out → to have gigantic consequences later.\u003c/p>\n\u003cp>A long struggle → will be needed → to avoid：(a future of digital feudalism).\u003c/p>\n\u003cp>Ms Denham&#39;s report → is a welcome start.\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>任何公正的评估：(关于危险：(这项交易的：(在英国国家卫生服务体系（NHS）和DeepMind之间))) → 必须开始：(通过承认：(双方都是善意的))。\u003c/p>\n\u003cp>DeepMind是 → 世界领先的人工智能（AI）公司之一：(在世界上)。\u003c/p>\n\u003cp>潜力：(这项工作的：(应用于医疗保健)) → 是非常巨大的 // 但它也可能导致 → 权力的进一步集中：(在科技巨头手中)。\u003c/p>\n\u003cp>正是在这种背景下 → 信息专员：(伊丽莎白·德纳姆) → 发布了她的严厉裁决：(针对皇家免费医院信托：(在NHS下))：(该信托向DeepMind移交了 → 160万患者的记录：(在2015年)：(基于一个模糊的协议：(该协议太少考虑：(患者的权利 + 他们对隐私的期望))))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>DeepMind几乎道歉了。\u003c/p>\n\u003cp>NHS信托 → 已经改正了它的做法。\u003c/p>\n\u003cp>进一步的安排：(可能会有很多)：(在NHS和DeepMind之间) → 将被仔细审查 → 以确保：(所有必要的许可 → 已经向患者征求) + (所有不必要的数据 → 已经被清理)。\u003c/p>\n\u003cp>有一些教训：(关于知情患者同意) → 需要学习。\u003c/p>\n\u003cp>但隐私不是 → 唯一的角度：(在这个案例中) + 甚至不是最重要的。\u003c/p>\n\u003cp>德纳姆女士选择 → 把责任集中：(在NHS信托上)：(因为根据现行法律 → 它&quot;控制&quot;数据 + DeepMind仅仅&quot;处理&quot;它)。\u003c/p>\n\u003cp>但这种区分 → 忽略了要点：(即是处理和聚合 + 而不是仅仅拥有比特 → 赋予数据价值)。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>这个重大问题是 → 谁应该受益：(从分析中：(所有数据的：(我们的生活现在产生的)))。\u003c/p>\n\u003cp>隐私法 → 建立在概念上：(对个人的损害：(从可识别的知识：(关于他们)))。\u003c/p>\n\u003cp>那忽略了 → 方式：(监控经济运作的)。\u003c/p>\n\u003cp>一个人的数据在那里 → 获得它的价值 → 只有当它被比较：(与数据：(无数百万人的))。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>使用隐私法：(来约束科技巨头)：(在这个例子中) → 感觉有些不适应。\u003c/p>\n\u003cp>这种做法 → 没有解决 → 真正的担忧。\u003c/p>\n\u003cp>这是不够的 → 说：(算法：(DeepMind开发的) → 将使患者受益 + 拯救生命)。\u003c/p>\n\u003cp>重要的是 → 它们将属于 → 一个私人垄断：(开发它们的：(使用公共资源))。\u003c/p>\n\u003cp>如果软件承诺 → 拯救生命：(在规模上：(药物现在能做到的)) → 大数据可能被期望 → 表现：(像大型制药公司所做的那样)。\u003c/p>\n\u003cp>我们仍然 → 在开始阶段：(这场革命的) + 现在的小选择 → 可能会 → 产生巨大的后果在以后。\u003c/p>\n\u003cp>一场漫长的斗争 → 将是必要的 → 为了避免：(数字封建主义的未来)。\u003c/p>\n\u003cp>德纳姆女士的报告 → 是一个受欢迎的开始。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第1段第4句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a vague agreement which took far too little account of the patients&#39; rights and their expectations of privacy.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>It is against that background / that the information commissioner, / Elizabeth Denham, / has issued her damning verdict / against the Royal Free hospital trust / under the NHS, / which handed over to DeepMind / the records of 1.6 million patients / in 2015 / on the basis of a vague agreement / which took far too little account / of the patients&#39; rights / and their expectations of privacy.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>正是在这种背景下 / 信息专员，/ 伊丽莎白·德纳姆，/ 发布了她的严厉裁决 / 针对皇家免费医院信托 / 在NHS下，/ 该信托向DeepMind移交了 / 160万患者的记录 / 在2015年 / 基于一个模糊的协议 / 该协议太少考虑 / 患者的权利 / 和他们对隐私的期望。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并强调句中的背景与监管行动。：\u003c/p>\n\u003cblockquote>\n\u003cp>正是在这种背景下，信息专员对皇家免费医院信托作出严厉裁决\u003c/p>\n\u003c/blockquote>\n\u003cp>再将两个which逐层接回各自对象。：\u003c/p>\n\u003cblockquote>\n\u003cp>该信托依据模糊协议移交160万患者记录，而该协议对患者权利和隐私期望考虑过少\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>正是在这种背景下，信息专员对皇家免费医院信托作出严厉裁决；该信托依据模糊协议移交160万患者记录，而该协议对患者权利和隐私期望考虑过少。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>信息专员严厉裁决了依据问题协议移交记录的医院信托。\u003c/p>\n\u003c/blockquote>\n\u003cp>先写背景、裁决人与被裁决者；随后说明信托在2015年的行为，再解释协议的缺陷，避免两个which都接到同一名词上。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>正是在这种背景下，信息专员伊丽莎白·德纳姆对NHS旗下皇家免费医院信托作出了严厉裁决：该信托在2015年依照一份模糊协议，将160万患者的记录交给DeepMind，而该协议对患者权利和他们的隐私期望考虑得太少。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>第一个which指医院信托，第二个which指协议，主体不同要译清。\u003c/p>\n\u003cp>far too little account不是完全没有文字条款，而是对权利和隐私考虑严重不足。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>正是在这种背景下，信息专员伊丽莎白·德纳姆对NHS旗下的皇家免费医院信托发布了严厉裁决，该信托在2015年基于一个模糊的协议向DeepMind移交了160万患者的记录，而这个协议对患者权利和他们的隐私期望考虑得太少。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第2段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Further arrangements – and there may be many – between the NHS and DeepMind will be carefully scrutinised to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Further arrangements – / and there may be many – / between the NHS and DeepMind / will be carefully scrutinised / to ensure / that all necessary permissions / have been asked of patients / and all unnecessary data / has been cleaned.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>进一步的安排 – / 可能会有很多 – / 在NHS和DeepMind之间 / 将被仔细审查 / 以确保 / 所有必要的许可 / 已经向患者征求 / 并且所有不必要的数据 / 已经被清理。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并被审查的合作安排及其可能数量。：\u003c/p>\n\u003cblockquote>\n\u003cp>NHS和DeepMind后续的合作安排可能很多，都将受到细致审查\u003c/p>\n\u003c/blockquote>\n\u003cp>再把ensure后两项必要保障并列。：\u003c/p>\n\u003cblockquote>\n\u003cp>已取得患者所需授权，并清除不必要的数据\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>NHS和DeepMind后续的合作安排可能很多，都将受到细致审查；已取得患者所需授权，并清除不必要的数据。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>后续安排将被审查，以确保授权到位并清除多余数据。\u003c/p>\n\u003c/blockquote>\n\u003cp>主句先写审查，再接目的；插入语单独交代数量可能多，all necessary与all unnecessary分别跟授权和数据。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>NHS与DeepMind今后的安排可能有很多，这些安排将被仔细审查，以确保已经向患者征求所有必要许可，并且清理了所有不必要的数据。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>there may be many只是可能，不能译成已确认存在许多违规项目。\u003c/p>\n\u003cp>必要授权与不必要数据方向相反，不能合并成清除全部数据或取得全部无关授权。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>NHS和DeepMind之间的进一步安排——可能会有很多——将被仔细审查，以确保已经向患者征求了所有必要的许可，并清理了所有不必要的数据。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第5句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>If software promises to save lives on the scale that drugs now can, big data may be expected to behave as a big pharma has done.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>If software promises / to save lives / on the scale / that drugs now can, / big data may be expected / to behave / as a big pharma has done.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>如果软件承诺 / 拯救生命 / 在规模上 / 药物现在能做到的，/ 大数据可能被期望 / 表现 / 像大型制药公司所做的那样。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把if的条件与比较尺度合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>如果软件承诺能像药物一样大规模拯救生命\u003c/p>\n\u003c/blockquote>\n\u003cp>再把后半句对行业行为的类比合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>大数据企业可能会像大型制药公司那样行事\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>如果软件承诺能像药物一样大规模拯救生命；大数据企业可能会像大型制药公司那样行事。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>若软件能承诺大规模救人，大数据行业也可能效仿制药行业。\u003c/p>\n\u003c/blockquote>\n\u003cp>把药物目前的能力放进条件比较，不当作对软件已经实现疗效的断言；后半句再接行业行为风险。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>如果软件承诺能以药物如今达到的规模挽救生命，人们也许可以预期，大数据行业会像大型制药企业曾经那样行事。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>promises保留承诺层面，不译成软件已全面兑现所有医疗收益。\u003c/p>\n\u003cp>类比承接私有垄断的担忧，不能孤立理解成称赞两种行业都会救人。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>如果软件承诺能像药物现在所能做到的那样大规模拯救生命，大数据可能会像大型制药公司那样行事。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>35题\u003c/h2>\n\u003cp>\u003cstrong>The author’s attitude toward the application of AI to healthcare is ______.\u003c/strong>\u003c/p>\n\u003cp>作者对把人工智能应用于医疗持什么态度？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>ambiguous\u003c/strong>\u003c/p>\n\u003cp>含糊不清的\u003c/p>\n\u003cp>B. \u003cstrong>appreciative\u003c/strong>\u003c/p>\n\u003cp>赞赏的\u003c/p>\n\u003cp>C. \u003cstrong>cautious\u003c/strong>\u003c/p>\n\u003cp>谨慎的\u003c/p>\n\u003cp>D. \u003cstrong>contemptuous\u003c/strong>\u003c/p>\n\u003cp>轻蔑的\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。\u003c/td>\n\u003ctd>先承认一面再摆出另一面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。\u003c/td>\n\u003ctd>再说事情不止眼前这一层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。\u003c/td>\n\u003ctd>接着追问更深一层的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出仅用隐私法处理没有触及真正担忧：公共资源开发的成果归私人垄断企业；最后强调长期应对，同时肯定报告是可喜的开始。\u003c/td>\n\u003ctd>最后说清担心并留下出路\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>The author’s attitude toward the application of AI to healthcare is ______.\u003c/strong>\u003c/p>\n\u003ch3>A. ambiguous\u003c/h3>\n\u003cp>含糊不清的\u003c/p>\n\u003ch4>如果 A 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>含糊不清的\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>先说医疗AI有潜力再说有风险，两面并列却不交代最终更重视什么。\u003c/td>\n\u003ctd>先承认一面再摆出另一面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>指出隐私之外还有价值问题，但对这些问题仍给出多种未取舍判断。\u003c/td>\n\u003ctd>再说事情不止眼前这一层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>追问谁应获益，又不明确赞成何种分配或规制原则。\u003c/td>\n\u003ctd>接着追问更深一层的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>列出垄断担忧与可能出路后仍不作立场选择，使态度保持含糊。\u003c/td>\n\u003ctd>最后说清担心并留下出路\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A的ambiguous不是“文章出现了两面”，而是读完仍不知道作者的态度。实际第1段把善意和医疗潜力说得明确，也把权力集中写成需要关注的风险；第2段又明说隐私不是最重要角度；末段用What matters指向私人垄断问题，并以a long struggle will be needed和welcome start表明需要继续应对、同时肯定这一步。这些并非互相打架而让人无法判断，而是在不同层面分别作出清楚评价。不能看到作者既有肯定又有担忧，就把有层次的态度误判成含糊。\u003c/p>\n\u003cp>作者明确承认潜力，又明确指出垄断风险和应对方向，还能说其态度含糊不清吗？\u003c/p>\n\u003cp>不能。不同层面的判断都很清楚，不是没有立场。\u003c/p>\n\u003cp>A要求全文写完仍无法落点，但实际作者不断用not the most important、What matters和末段收束区分轻重，立场是可以读出来的。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>The author’s attitude toward the application of AI to healthcare is ______.\u003c/strong>\u003c/p>\n\u003ch3>B. appreciative\u003c/h3>\n\u003cp>赞赏的\u003c/p>\n\u003ch4>如果 B 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>赞赏的\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>承认合作存在风险后，把技术救人的益处作为主要评价落点。\u003c/td>\n\u003ctd>先承认一面再摆出另一面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>从隐私局限推进到处理数据创造价值，赞赏医疗AI拓展了公共收益。\u003c/td>\n\u003ctd>再说事情不止眼前这一层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>追问谁将获益，并论证AI应用能够让各方尤其患者得到改善。\u003c/td>\n\u003ctd>接着追问更深一层的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>承认潜在垄断问题可以处理，最后强调其应用值得欣赏与推广。\u003c/td>\n\u003ctd>最后说清担心并留下出路\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的appreciative能接上首段very great，却很难容纳随后那么多篇幅。作者并没有写“许可补齐以后，这类应用就值得充分赞扬”，而是继续说privacy甚至不是最重要的角度，再追问谁从数据分析中获益。末段还特意说It is not enough to say…benefit patients and save lives，意思是只凭能让患者受益并不能结束讨论。最后的welcome start肯定的是Denham报告这一开始，不是将所有人工智能医疗应用整体称为令人欣赏。B把一面的好处与对报告的一点评价，拿来代替了对应用整体的态度。\u003c/p>\n\u003cp>开头承认医疗潜力很大，是否足以抹掉后面对归属与垄断风险的持续追问，整体选赞赏？\u003c/p>\n\u003cp>不足以。作者明确说只讲好处还不够，后面讨论的正是为什么不能停在赞赏上。\u003c/p>\n\u003cp>B能接住局部肯定，却接不住全文重点所在的保留与警惕，评价范围也把对报告的肯定混成对应用的整体赞赏。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>The author’s attitude toward the application of AI to healthcare is ______.\u003c/strong>\u003c/p>\n\u003ch3>C. cautious\u003c/h3>\n\u003cp>谨慎的\u003c/p>\n\u003ch4>如果 C 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>谨慎的\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>承认双方善意与医疗潜力，再指出患者权益和权力集中的风险。\u003c/td>\n\u003ctd>先承认一面再摆出另一面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明补好隐私许可仍不够，数据处理与汇聚会产生新的价值和权力。\u003c/td>\n\u003ctd>再说事情不止眼前这一层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>追问谁分享数据分析收益，要求超出个人隐私层面看待应用。\u003c/td>\n\u003ctd>接着追问更深一层的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>明确担忧公共成果归私人垄断者，提出长期规制并肯定现有报告的开端。\u003c/td>\n\u003ctd>最后说清担心并留下出路\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C的cautious可以同时容纳首段的两面：潜力很大，但可能让权力更集中。第2段不是否认隐私处理，而是认为还要看数据怎样产生价值；第3段再把问题推到谁应受益；末段则具体落在公共资源与私人垄断的归属冲突。末尾说报告是welcome start，说明作者仍认可改善的可能，并不主张把技术全部丢掉。这样的写法不是一味夸赞，也不是轻蔑技术，而是在承认益处的同时要求认真看待条件、权力和长期后果。\u003c/p>\n\u003cp>承认人工智能医疗有很大潜力，同时持续追问风险、归属和长期应对，是谨慎态度吗？\u003c/p>\n\u003cp>是的。肯定潜力并未取消风险，警惕风险也未变成否认全部价值。\u003c/p>\n\u003cp>C能让四段都保留实际作用：先承认、再深入、再追问、最后提出需要继续应对并肯定起点。它不需要删去任何一面的判断。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>The author’s attitude toward the application of AI to healthcare is ______.\u003c/strong>\u003c/p>\n\u003ch3>D. contemptuous\u003c/h3>\n\u003cp>轻蔑的\u003c/p>\n\u003ch4>如果 D 是主旨，文章4段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>轻蔑的\u003c/p>\n\u003cp>那文章4段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>提及技术益处后把它视为掩饰危险的表面说辞，转而贬斥医疗AI应用。\u003c/td>\n\u003ctd>先承认一面再摆出另一面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>从隐私推进到数据价值，说明这种应用背后只剩逐利动机。\u003c/td>\n\u003ctd>再说事情不止眼前这一层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>追问受益者并用轻蔑口吻断言公众不会获得真正价值。\u003c/td>\n\u003ctd>接着追问更深一层的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>把垄断危险作为否定应用的理由，以贬斥和拒斥而非审慎改进收束。\u003c/td>\n\u003ctd>最后说清担心并留下出路\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D的contemptuous是轻蔑、不屑，不只是发现风险。首段却认真承认both sides mean well和医疗潜力very great；第2、3段还细分控制、处理、数据比较与受益归属，说明作者把这些问题当作值得认真讨论的事情。末段既承认benefit patients and save lives，又肯定报告是一个好的开始。若是轻蔑，文章应让读者觉得这种应用不值得当回事；实际作者正因为看见其力量与潜力，才认为现在的小选择和未来的应对非常重要。\u003c/p>\n\u003cp>认真承认潜力、细究归属并肯定改善的起点，能整体读成对这种应用不屑一顾吗？\u003c/p>\n\u003cp>不能。这里的担心来自认真看待其影响，而非轻蔑地否认其价值。\u003c/p>\n\u003cp>D把风险批评扩大成轻蔑，态度程度过强，也与首段的明确肯定及末段留下的出路冲突。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>35题结论\u003c/h3>\n\u003cp>\u003cstrong>35. C. cautious\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>cautious / 谨慎的\u003c/strong>\u003c/p>\n\u003ch2>31题\u003c/h2>\n\u003cblockquote>\n\u003cp>What is true of the agreement between the NHS and DeepMind?\u003cbr>关于NHS与DeepMind之间的协议，哪个说法是正确的？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>具体细节题。题干要求判断“关于NHS与DeepMind之间的协议，哪个说法是正确的？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Any fair-minded assessment of the dangers of the deal between Britain&#39;s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well. DeepMind is one of the leading artificial intelligence (AI) companies in the world. The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants. It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a vague agreement which took far too little account of the patients&#39; rights and their expectations of privacy.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者承认双方意图与技术潜力，再说模糊协议对患者权利和隐私期待考虑太少，这成为信息专员批评NHS的背景。\u003c/p>\n\u003ch3>A. It fell short of the latter’s expectations.\u003c/h3>\n\u003cblockquote>\n\u003cp>它未达到后者的期待\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“It fell short of the [xxx]’s expectations.”，保留了相应遮挡。当时的定位线索是：A的fell short of说没有达到期待，原文末尾expectations of privacy也谈期待，而且前面有far too little，因此回看期待属于谁，以及协议在哪一点做得不够。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>题干并列的是NHS与DeepMind，因此选项the latter明确回指后者DeepMind。原文的their expectations of privacy则紧接patients’ rights，期待的主体是患者，不能接给科技公司。\u003c/p>\n\u003cp>判断A不需要再保留未知指代：题干已经提供the latter的先行对象。C把患者权利考虑不足准确说出来，A则借用expectations把受损对象从患者换成了协议中的科技合作方。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a vague agreement which took far too little account of the patients&#39; rights and their expectations of privacy.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>NHS与DeepMind的协议存在的问题是：它未达到后者的期待。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的fell short of说没有达到期待，原文末尾expectations of privacy也谈期待，而且前面有far too little，因此回看期待属于谁，以及协议在哪一点做得不够。\u003c/p>\n\u003cp>题干并列的是NHS与DeepMind，因此选项the latter明确回指后者DeepMind。原文的their expectations of privacy则紧接patients’ rights，期待的主体是患者，不能接给科技公司。\u003c/p>\n\u003cp>两边都有expectations，且fell short of与far too little都带有不足意味，这正是容易混淆的词面。把所有者恢复之后，A说公司期待未获满足，原文说患者的隐私期待被协议忽视，两个主体不同。\u003c/p>\n\u003cp>判断A不需要再保留未知指代：题干已经提供the latter的先行对象。C把患者权利考虑不足准确说出来，A则借用expectations把受损对象从患者换成了协议中的科技合作方。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a vague agreement which took far too little account of the patients&#39; rights and their expectations of privacy.\u003c/p>\n\u003cp>作者承认双方意图与技术潜力，再说模糊协议对患者权利和隐私期待考虑太少，这成为信息专员批评NHS的背景。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The agreement failed to meet DeepMind’s expectations.\u003c/p>\n\u003cp>协议没有达到DeepMind的期望。\u003c/p>\n\u003c/blockquote>\n\u003cp>the latter指DeepMind，但原文expectations属于patients。假设要交代公司期待与落差，实际交代的是患者对隐私的期待被忽略。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>谨慎态度要求把潜力与权益风险一起看，本题应指出协议中确实被忽略的权利。态度本身不能证明某家公司期待落空。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>It fell short of the latter’s expectations.\u003cbr>它未达到后者的期待\u003c/p>\n\u003c/blockquote>\n\u003cp>判断A不需要再保留未知指代：题干已经提供the latter的先行对象。C把患者权利考虑不足准确说出来，A则借用expectations把受损对象从患者换成了协议中的科技合作方。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. It caused conflicts among tech giants.\u003c/h3>\n\u003cblockquote>\n\u003cp>它引发科技巨头间的冲突\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的conflicts among tech giants与原文concentration of power in the tech giants都有tech giants，但前者说巨头之间发生什么，后者说权力向哪里集中，因此回看power这句话的主干。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>concentration of power in the tech giants说权力进一步聚集在巨头手中，巨头是权力流向的一方。B的conflicts among tech giants却让各家巨头彼此争斗，among把关系放在多家企业之间。集中与冲突不是同一个现象：即使权力集中到少数公司，也不能直接推出它们因此发生冲突。另外原句是could also lead to，谈可能的后果，B用caused断定已经造成冲突，又把可能性写成既成事实。两处差别都不取决于段末那个协议修饰词。\u003c/p>\n\u003cp>B留下了tech giants，却改变了巨头在句子中的关系和事件的确定程度，不能只按同一名词判断。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>NHS与DeepMind的协议存在的问题是：它引发科技巨头间的冲突。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的conflicts among tech giants与原文concentration of power in the tech giants都有tech giants，但前者说巨头之间发生什么，后者说权力向哪里集中，因此回看power这句话的主干。\u003c/p>\n\u003cp>concentration of power in the tech giants说权力进一步聚集在巨头手中，巨头是权力流向的一方。B的conflicts among tech giants却让各家巨头彼此争斗，among把关系放在多家企业之间。集中与冲突不是同一个现象：即使权力集中到少数公司，也不能直接推出它们因此发生冲突。另外原句是could also lead to，谈可能的后果，B用caused断定已经造成冲突，又把可能性写成既成事实。两处差别都不取决于段末那个协议修饰词。\u003c/p>\n\u003cp>B留下了tech giants，却改变了巨头在句子中的关系和事件的确定程度，不能只按同一名词判断。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.\u003c/p>\n\u003cp>作者承认双方意图与技术潜力，再说模糊协议对患者权利和隐私期待考虑太少，这成为信息专员批评NHS的背景。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The agreement caused a conflict among competing technology companies.\u003c/p>\n\u003cp>协议引发了相互竞争的科技公司之间的冲突。\u003c/p>\n\u003c/blockquote>\n\u003cp>权力向巨头集中是一种结构风险，不等于几家公司已经冲突；原段没有报告争执双方或竞争行动。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>谨慎态度要求把潜力与权益风险一起看，本题应指出协议中确实被忽略的权利。态度本身不能证明某家公司期待落空。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>It caused conflicts among tech giants.\u003cbr>它引发科技巨头间的冲突\u003c/p>\n\u003c/blockquote>\n\u003cp>B留下了tech giants，却改变了巨头在句子中的关系和事件的确定程度，不能只按同一名词判断。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. It failed to pay due attention to patients’ rights.\u003c/h3>\n\u003cblockquote>\n\u003cp>它未充分重视患者权利\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的pay due attention说给应有的重视，原文took far too little account说考虑得太少；两者对同一对象都可描述重视不足，因此回看account of后面有没有patients’ rights。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>which指向前面的agreement，took far too little account明确说这份协议考虑得不够，of后面第一项就是the patients’ rights。C用failed to接pay due attention，意思仍是没有达到应有的重视程度，而不是说患者根本没有权利。这里主体是协议，评价是关注不足，对象是患者权利，三点都能接上。原句还并列隐私期待，C只选其中患者权利这一项，并不等于否认另一项；题干问一个正确说法，不要求把所有并列内容全部写进同一选项。\u003c/p>\n\u003cp>C没有把不足夸成完全无视所有权利，也没有把患者换成合作机构。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Any fair-minded assessment of the dangers of the deal between Britain&#39;s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well. DeepMind is one of the leading artificial intelligence (AI) companies in the world. The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants. It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a vague agreement which took far too little account of the patients&#39; rights and their expectations of privacy.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>NHS与DeepMind的协议存在的问题是：它未充分重视患者权利。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的pay due attention说给应有的重视，原文took far too little account说考虑得太少；两者对同一对象都可描述重视不足，因此回看account of后面有没有patients’ rights。\u003c/p>\n\u003cp>which指向前面的agreement，took far too little account明确说这份协议考虑得不够，of后面第一项就是the patients’ rights。C用failed to接pay due attention，意思仍是没有达到应有的重视程度，而不是说患者根本没有权利。这里主体是协议，评价是关注不足，对象是患者权利，三点都能接上。原句还并列隐私期待，C只选其中患者权利这一项，并不等于否认另一项；题干问一个正确说法，不要求把所有并列内容全部写进同一选项。\u003c/p>\n\u003cp>C没有把不足夸成完全无视所有权利，也没有把患者换成合作机构。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Any fair-minded assessment of the dangers of the deal between Britain&#39;s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well. DeepMind is one of the leading artificial intelligence (AI) companies in the world. The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants. It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a vague agreement which took far too little account of the patients&#39; rights and their expectations of privacy.\u003c/p>\n\u003cp>作者承认双方意图与技术潜力，再说模糊协议对患者权利和隐私期待考虑太少，这成为信息专员批评NHS的背景。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The agreement gave far too little consideration to patients’ rights and privacy expectations.\u003c/p>\n\u003cp>协议对患者权利与隐私期望考虑得太少。\u003c/p>\n\u003c/blockquote>\n\u003cp>pay due attention与take account of表达同一照顾关系，failed与far too little都指出不足，主体和权利对象保持一致。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>谨慎态度要求把潜力与权益风险一起看，本题应指出协议中确实被忽略的权利。态度本身不能证明某家公司期待落空。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>It failed to pay due attention to patients’ rights.\u003cbr>它未充分重视患者权利\u003c/p>\n\u003c/blockquote>\n\u003cp>C没有把不足夸成完全无视所有权利，也没有把患者换成合作机构。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. It put both sides into a dangerous situation.\u003c/h3>\n\u003cblockquote>\n\u003cp>它使双方都陷入危险处境\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的put both sides into a dangerous situation把双方都说成陷入危险，原文both sides mean well也出现双方，但说的是意图；因此先看双方的身份，再看后文具体担心谁的权利与什么权力变化。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>both sides mean well只说明合作双方出发点是好的，不能拿“双方”这个词替后面的危险指定承受者。原文接着担忧的是权力集中到科技巨头手里，段末又具体落到患者权利与隐私期待；它没有把NHS与DeepMind同时安排在被这种危险损害的位置。D的put both sides into a dangerous situation把“这项合作存在风险”改成“两个合作机构都陷入危险”。尤其DeepMind所在的一方在权力集中描述中可能获得更多权力，不能径直把这种担忧改写为它也被协议置于危险中。\u003c/p>\n\u003cp>D把风险影响的对象从具体的权利和权力关系移到了双方机构本身，还用both把两家都包进去，超过了这里所描述的后果。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Any fair-minded assessment of the dangers of the deal between Britain&#39;s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well.\u003c/p>\n\u003cp>The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>NHS与DeepMind的协议存在的问题是：它使双方都陷入危险处境。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的put both sides into a dangerous situation把双方都说成陷入危险，原文both sides mean well也出现双方，但说的是意图；因此先看双方的身份，再看后文具体担心谁的权利与什么权力变化。\u003c/p>\n\u003cp>both sides mean well只说明合作双方出发点是好的，不能拿“双方”这个词替后面的危险指定承受者。原文接着担忧的是权力集中到科技巨头手里，段末又具体落到患者权利与隐私期待；它没有把NHS与DeepMind同时安排在被这种危险损害的位置。D的put both sides into a dangerous situation把“这项合作存在风险”改成“两个合作机构都陷入危险”。尤其DeepMind所在的一方在权力集中描述中可能获得更多权力，不能径直把这种担忧改写为它也被协议置于危险中。\u003c/p>\n\u003cp>D把风险影响的对象从具体的权利和权力关系移到了双方机构本身，还用both把两家都包进去，超过了这里所描述的后果。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Any fair-minded assessment of the dangers of the deal between Britain&#39;s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well.\u003c/p>\n\u003cp>The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.\u003c/p>\n\u003cp>作者承认双方意图与技术潜力，再说模糊协议对患者权利和隐私期待考虑太少，这成为信息专员批评NHS的背景。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The agreement placed both the NHS and DeepMind in danger.\u003c/p>\n\u003cp>协议使NHS和DeepMind双方都陷入危险。\u003c/p>\n\u003c/blockquote>\n\u003cp>首句评估deal的风险不能自动理解为双方都处境危险。实际风险分析落在患者权益和巨头权力，需要另证才能把双方均列为受威胁者。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>谨慎态度要求把潜力与权益风险一起看，本题应指出协议中确实被忽略的权利。态度本身不能证明某家公司期待落空。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>It put both sides into a dangerous situation.\u003cbr>它使双方都陷入危险处境\u003c/p>\n\u003c/blockquote>\n\u003cp>D把风险影响的对象从具体的权利和权力关系移到了双方机构本身，还用both把两家都包进去，超过了这里所描述的后果。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>31题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>31. C. It failed to pay due attention to patients’ rights.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：题干并列的是NHS与DeepMind，因此选项the latter明确回指后者DeepMind。\u003c/p>\n\u003cp>B：concentration of power in the tech giants说权力进一步聚集在巨头手中，巨头是权力流向的一方。\u003c/p>\n\u003cp>C：which指向前面的agreement，took far too little account明确说这份协议考虑得不够，of后面第一项就是the patients’ rights。\u003c/p>\n\u003cp>D：both sides mean well只说明合作双方出发点是好的，不能拿“双方”这个词替后面的危险指定承受者。\u003c/p>\n\u003ch2>32题\u003c/h2>\n\u003cblockquote>\n\u003cp>The NHS trust responded to Denham’s verdict with ______.\u003cbr>NHS下属的这家机构如何回应Denham的裁定？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>反应细节题。题干要求判断“NHS下属的这家机构如何回应Denham的裁定？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>DeepMind has almost apologized. The NHS trust has mended its ways. Further arrangements – and there may be many – between the NHS and DeepMind will be carefully scrutinised to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned. There are lessons about informed patient consent to learn. But privacy is not the only angle in this case and not even the most important. Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it &quot;controlled&quot; the data and DeepMind merely &quot;processed&quot; it. But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.\u003c/p>\n\u003c/blockquote>\n\u003cp>第二段分开两方反应：DeepMind几乎道歉，NHS机构已经改正做法；后续合作须审查授权并删除不必要数据。\u003c/p>\n\u003ch3>A. empty promises\u003c/h3>\n\u003cblockquote>\n\u003cp>空洞承诺\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的empty promises说只有承诺没有实质内容，第2段all unnecessary data has been cleaned却提到数据处理，因此回看前面的许可要求与这项清理如何成为后续安排的检查内容。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>all unnecessary data has been cleaned与permissions have been asked并列，是后续安排要确保的两项具体处理。A的empty promises反而给这种回应加上“空洞、没有实际内容”的评价，把具体要求抹成没有落实意义的许诺。未来安排还需进一步检查，不等于现有回应已经被作者判定为虚假或敷衍；不能把will一见就读成只说不做。\u003c/p>\n\u003cp>A把原文列出的实际整改事项换成了“没有实质内容”的评价，而这段所展示的回应方向是对这些事项作出处理。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The NHS trust has mended its ways.\u003c/p>\n\u003cp>Further arrangements – and there may be many – between the NHS and DeepMind will be carefully scrutinised to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>NHS下属机构对裁定的回应是空洞承诺。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的empty promises说只有承诺没有实质内容，第2段all unnecessary data has been cleaned却提到数据处理，因此回看前面的许可要求与这项清理如何成为后续安排的检查内容。\u003c/p>\n\u003cp>all unnecessary data has been cleaned与permissions have been asked并列，是后续安排要确保的两项具体处理。A的empty promises反而给这种回应加上“空洞、没有实际内容”的评价，把具体要求抹成没有落实意义的许诺。未来安排还需进一步检查，不等于现有回应已经被作者判定为虚假或敷衍；不能把will一见就读成只说不做。\u003c/p>\n\u003cp>A把原文列出的实际整改事项换成了“没有实质内容”的评价，而这段所展示的回应方向是对这些事项作出处理。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The NHS trust has mended its ways.\u003c/p>\n\u003cp>Further arrangements – and there may be many – between the NHS and DeepMind will be carefully scrutinised to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.\u003c/p>\n\u003cp>第二段分开两方反应：DeepMind几乎道歉，NHS机构已经改正做法；后续合作须审查授权并删除不必要数据。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The NHS trust offered promises but changed nothing.\u003c/p>\n\u003cp>NHS信托机构作出承诺，却没有改变任何做法。\u003c/p>\n\u003c/blockquote>\n\u003cp>空洞承诺应无实际改动，原句has mended its ways报告已经纠正做法，不只是口头表示。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>谨慎运用医疗AI要求补足授权和数据规则，但不能从主旨猜出哪一方道歉；本项最终由The NHS trust has mended its ways判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>empty promises\u003cbr>空洞承诺\u003c/p>\n\u003c/blockquote>\n\u003cp>A把原文列出的实际整改事项换成了“没有实质内容”的评价，而这段所展示的回应方向是对这些事项作出处理。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. tough resistance\u003c/h3>\n\u003cblockquote>\n\u003cp>强硬抵抗\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的tough resistance意味着对要求强硬反抗，原文ensure that all necessary permissions谈确保必要许可；二者都是对裁定后要求的反应，因此回 address the shortcomings identified.\u003c/p>\n\u003cp>NHS信托机构改变了做法，以解决被指出的不足。\u003c/p>\n\u003c/blockquote>\n\u003cp>改正做法概括为necessary adjustments，后续核实许可与清理数据说明要纠正哪类问题，而不是另添态度表演。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>谨慎运用医疗AI要求补足授权和数据规则，但不能从主旨猜出哪一方道歉；本项最终由The NHS trust has mended its ways判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>necessary adjustments\u003cbr>必要调整\u003c/p>\n\u003c/blockquote>\n\u003cp>D既没有把道歉动作移错主语，也没有把后续处理说成拒绝裁定，更没有夸大为解决全部问题，因此能够保留。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>32题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>32. D. necessary adjustments\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：all unnecessary data has been cleaned与permissions have been asked并列，是后续安排要确保的两项具体处理。\u003c/p>\n\u003cp>B：ensure that all necessary permissions把患者许可设为后续合作需要确保的事项，清理不必要数据也同样列进安排。\u003c/p>\n\u003cp>C：DeepMind has almost apologised的主语是DeepMind；句号之后才另起The NHS trust，讲另外一方的做法。\u003c/p>\n\u003cp>D：permissions have been asked所说的患者许可，加上不必要数据has been cleaned，是这段明确列出的变化内容。\u003c/p>\n\u003ch2>33题\u003c/h2>\n\u003cblockquote>\n\u003cp>The author argues in Paragraph 2 that ______.\u003cbr>作者在第2段主张什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>作者观点题。题干要求判断“作者在第2段主张什么？”，先按第2、3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>DeepMind has almost apologized. The NHS trust has mended its ways. Further arrangements – and there may be many – between the NHS and DeepMind will be carefully scrutinised to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned. There are lessons about informed patient consent to learn. But privacy is not the only angle in this case and not even the most important. Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it &quot;controlled&quot; the data and DeepMind merely &quot;processed&quot; it. But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.\u003c/p>\n\u003cp>The great question is who should benefit from the analysis of all the data that our lives now generate. Privacy law builds on the concept of damage to an individual from identifiable knowledge about them. That misses the way the surveillance economy works. The data of an individual there gains its value only when it is compared with the data of countless millions more.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先承认隐私与授权教训，再指出区分控制数据与处理数据错过关键：处理和汇聚才使数据获得价值。\u003c/p>\n\u003ch3>A. privacy protection must be secured at all costs\u003c/h3>\n\u003cblockquote>\n\u003cp>必须不惜一切代价保护隐私\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的at all costs给隐私保护放上不惜一切的程度，原文not even the most important却在限定隐私的地位；它们都在评价隐私有多重要，因此回看But之后的完整判断。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>not even the most important说隐私甚至不是这一案例最重要的角度，前半句还说它不是唯一角度。A的at all costs则把隐私保障写成可以压倒其他考虑、不惜任何代价的要求。原文当然没有否定患者隐私值得保护，前面征求许可也说明这件事需要做；但“需要做”并不自动成为“其他任何代价都可以不顾”。这一题问作者的主张，不能把他已经往后退的一层关注反而推到绝对优先的位置。\u003c/p>\n\u003cp>A把原文的限定改成绝对化要求，还忽略But将讨论引向另外层面的作用，因此排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But privacy is not the only angle in this case and not even the most important.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者在第2段主张：必须不惜一切代价保护隐私。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的at all costs给隐私保护放上不惜一切的程度，原文not even the most important却在限定隐私的地位；它们都在评价隐私有多重要，因此回看But之后的完整判断。\u003c/p>\n\u003cp>not even the most important说隐私甚至不是这一案例最重要的角度，前半句还说它不是唯一角度。A的at all costs则把隐私保障写成可以压倒其他考虑、不惜任何代价的要求。原文当然没有否定患者隐私值得保护，前面征求许可也说明这件事需要做；但“需要做”并不自动成为“其他任何代价都可以不顾”。这一题问作者的主张，不能把他已经往后退的一层关注反而推到绝对优先的位置。\u003c/p>\n\u003cp>A把原文的限定改成绝对化要求，还忽略But将讨论引向另外层面的作用，因此排除。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But privacy is not the only angle in this case and not even the most important.\u003c/p>\n\u003cp>作者先承认隐私与授权教训，再指出区分控制数据与处理数据错过关键：处理和汇聚才使数据获得价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Privacy must be protected at any cost, regardless of other considerations.\u003c/p>\n\u003cp>无论其他考虑如何，都必须不惜任何代价保护隐私。\u003c/p>\n\u003c/blockquote>\n\u003cp>实际not even the most important把讨论转到更广的利益归属，假设则把隐私设为压倒其他考虑的绝对原则。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文谨慎关注数据权力，题干应答出价值从哪一种活动产生，不能把肯定隐私直接放大为不计代价的唯一原则。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>privacy protection must be secured at all costs\u003cbr>必须不惜一切代价保护隐私\u003c/p>\n\u003c/blockquote>\n\u003cp>A把原文的限定改成绝对化要求，还忽略But将讨论引向另外层面的作用，因此排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. the value of data comes from the processing of it\u003c/h3>\n\u003cblockquote>\n\u003cp>数据的价值来自对它的处理\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的comes from the processing说价值从处理而来，原文it is processing在强调谁赋予数据价值，两者都在谈价值来源，因此把末句的that gives the data value接回强调部分读。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>B的comes from the processing将这种“某种活动给予价值”改写成“价值来自某种活动”，因果方向没有反转。B没有写only，也没有说除此之外再无其他活动，因此不能因原句还有and就要求B把两个并列项目都列全。真正的对比是价值不在于一个表面身份或简单地拿着数据，而在于对数据做什么。\u003c/p>\n\u003cp>这一句正是作者用But纠正前面区分的地方。B回答的是他的纠正性判断，不是把监管者的归责方式当作作者自己的全部结论。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者在第2段主张：数据的价值来自对它的处理。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的comes from the processing说价值从处理而来，原文it is processing在强调谁赋予数据价值，两者都在谈价值来源，因此把末句的that gives the data value接回强调部分读。\u003c/p>\n\u003cp>B的comes from the processing将这种“某种活动给予价值”改写成“价值来自某种活动”，因果方向没有反转。B没有写only，也没有说除此之外再无其他活动，因此不能因原句还有and就要求B把两个并列项目都列全。真正的对比是价值不在于一个表面身份或简单地拿着数据，而在于对数据做什么。\u003c/p>\n\u003cp>B没有增加“唯一”二字，只把原句已经肯定的处理活动接成价值来源。\u003c/p>\n\u003cp>这一句正是作者用But纠正前面区分的地方。B回答的是他的纠正性判断，不是把监管者的归责方式当作作者自己的全部结论。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.\u003c/p>\n\u003cp>作者先承认隐私与授权教训，再指出区分控制数据与处理数据错过关键：处理和汇聚才使数据获得价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Data acquires its value through processing and aggregation rather than mere possession.\u003c/p>\n\u003cp>数据通过处理和聚合，而非仅仅被持有，获得其价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>it is...that的强调中心是processing and a >\n\u003cp>作者在第2段主张：利用患者数据获利是违法的。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的making profits谈获利是否合法，第2段under existing law确实出现法律，因此回看法律在这里区分的是什么行为，以及作者随后如何回应。\u003c/p>\n\u003cp>under existing law后面区分的是NHS控制数据、DeepMind处理数据，解释Denham为什么把责备集中在NHS。作者接着说这一区分没抓住赋予数据价值的活动，并没有在这里把making profits设成一律违法的行为。C把监管归责的控制与处理之分，改写成利润合法性的判断；又把作者讨论“价值怎么产生”，读成他禁止一切获利。value不是illegal的同义表达，描述数据有价值也不等于宣布取得这种价值就是犯罪。\u003c/p>\n\u003cp>法律在这一句解释的是归责，而C另外加上了获利一律违法的判断。\u003c/p>\n\u003cp>C既换了被讨论的行为，也把一项特定案件中的区分扩大为普遍禁令，不能从existing law几个字跳到这个结论。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it &quot;controlled&quot; the data and DeepMind merely &quot;processed&quot; it.\u003c/p>\n\u003cp>But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.\u003c/p>\n\u003cp>作者先承认隐私与授权教训，再指出区分控制数据与处理数据错过关键：处理和汇聚才使数据获得价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Any profit made from patients’ data is illegal.\u003c/p>\n\u003cp>从患者数据获取的任何利润都是非法的。\u003c/p>\n\u003c/blockquote>\n\u003cp>文章追问谁应分享价值，不宣布所有获利违法。现有法律解释控制与处理的角色，也没有给出这个一概禁止的结论。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文谨慎关注数据权力，题干应答出价值从哪一种活动产生，不能把肯定隐私直接放大为不计代价的唯一原则。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>making profits from patients’ data is illegal\u003cbr>利用患者数据获利是违法的\u003c/p>\n\u003c/blockquote>\n\u003cp>C既换了被讨论的行为，也把一项特定案件中的区分扩大为普遍禁令，不能从existing law几个字跳到这个结论。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. leaking patients’ data is worse than selling it\u003c/h3>\n\u003cblockquote>\n\u003cp>泄露患者数据比出售数据更恶劣\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时选项呈现为“[xxx] patients’ data is worse than selling it”，保留了相应遮挡。当时的定位线索是：D的worse than selling it要求比较两种行为的坏处，第2段gives the data value却比较什么使数据有价值；两边都是数据行为的区分，因此回看作者比较所用的标准。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>泄露与出售的严重性排序需要比较两种行为后果。原文比较的是处理与持有对价值的作用，不是两种侵害行为谁更恶劣。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者在第2段主张：泄露患者数据比出售数据更恶劣。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的worse than selling it要求比较两种行为的坏处，第2段gives the data value却比较什么使数据有价值；两边都是数据行为的区分，因此回看作者比较所用的标准。\u003c/p>\n\u003cp>gives the data value问的是价值由什么活动产生，原句用it is和not把赋予价值的一边与另一边区分开。D的worse than selling it则问哪一种行为更糟，而且把selling设为明确比较项。原文在这里不是说“处理比出售更坏”，也不是给两种隐私侵害排严重程度；它在解释把责任只放在控制者身上为什么遗漏了处理的意义。\u003c/p>\n\u003cp>作者先承认隐私与授权教训，再指出区分控制数据与处理数据错过关键：处理和汇聚才使数据获得价值。\u003c/p>\n\u003cp>泄露与出售的严重性排序需要比较两种行为后果。原文比较的是处理与持有对价值的作用，不是两种侵害行为谁更恶劣。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.\u003c/p>\n\u003cp>作者先承认隐私与授权教训，再指出区分控制数据与处理数据错过关键：处理和汇聚才使数据获得价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Leaking patients’ data is worse than selling it.\u003c/p>\n\u003cp>泄露患者数据比出售数据更恶劣。\u003c/p>\n\u003c/blockquote>\n\u003cp>泄露与出售的严重性排序需要比较两种行为后果。原文比较的是处理与持有对价值的作用，不是两种侵害行为谁更恶劣。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文谨慎关注数据权力，题干应答出价值从哪一种活动产生，不能把肯定隐私直接放大为不计代价的唯一原则。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>leaking patients’ data is worse than selling it\u003cbr>泄露患者数据比出售数据更恶劣\u003c/p>\n\u003c/blockquote>\n\u003cp>gives the data value问的是价值由什么活动产生，原句用it is和not把赋予价值的一边与另一边区分开。D的worse than selling it则问哪一种行为更糟，而且把selling设为明确比较项。原文在这里不是说“处理比出售更坏”，也不是给两种隐私侵害排严重程度；它在解释把责任只放在控制者身上为什么遗漏了处理的意义。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>33题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>33. B. the value of data comes from the processing of it\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：not even the most important说隐私甚至不是这一案例最重要的角度，前半句还说它不是唯一角度。\u003c/p>\n\u003cp>B：B的comes from the processing将这种“某种活动给予价值”改写成“价值来自某种活动”，因果方向没有反转。\u003c/p>\n\u003cp>C：under existing law后面区分的是NHS控制数据、DeepMind处理数据，解释Denham为什么把责备集中在NHS。\u003c/p>\n\u003cp>D：泄露与出售的严重性排序需要比较两种行为后果。\u003c/p>\n\u003ch2>34题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to the last paragraph, the real worry arising from this deal is ______.\u003cbr>根据最后一段，这项合作带来的真正担忧是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>段落核心问题题。题干要求判断“根据最后一段，这项合作带来的真正担忧是什么？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The use of privacy law to curb the tech giants in this instance feels slightly maladapted. This practice does not address the real worry. It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives. What matters is that they will belong to a private monopoly which developed them using public resources. If software promises to save lives on the scale that drugs now can, big data may be expected to behave as a big pharma has done. We are still at the beginning of this revolution and small choices now may turn out to have gigantic consequences later. A long struggle will be needed to avoid a future of digital feudalism. Ms Denham&#39;s report is a welcome start.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者承认算法可能救人，随即强调利用公共资源开发的成果将归私人垄断者所有，担心走向数字封建制。\u003c/p>\n\u003ch3>A. the monopoly of big data by tech giants\u003c/h3>\n\u003cblockquote>\n\u003cp>科技巨头对大数据的垄断\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的monopoly of big data说大数据由少数科技企业独占，原文belong to a private monopoly说开发出的东西将属于私人垄断企业；两者都涉及归谁控制，因此回看What matters后面的完整句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>belong to a private monopoly中的they接前面的algorithms，作者担心用公共资源开发出的成果最后归一家私人垄断企业。A的monopoly of big data不是说技术没有医疗作用，而是把数据及其处理成果带来的控制权归属概括出来。What matters把重点明确放在“归私人垄断者所有”，与前面“仅仅说能救人还不够”形成递进。因此A能回答为什么一项可能有益的合作仍值得担心：公共资源产生的价值和力量可能被科技巨头掌握。\u003c/p>\n\u003cp>A保留了企业、数据及价值归属之间的关系，没有把“有益”与“存在垄断风险”当成互相排斥的两件事。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives.\u003c/p>\n\u003cp>What matters is that they will belong to a private monopoly which developed them using public resources.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最后一段所说的真正担忧是科技巨头对大数据的垄断。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的monopoly of big data说大数据由少数科技企业独占，原文belong to a private monopoly说开发出的东西将属于私人垄断企业；两者都涉及归谁控制，因此回看What matters后面的完整句。\u003c/p>\n\u003cp>belong to a private monopoly中的they接前面的algorithms，作者担心用公共资源开发出的成果最后归一家私人垄断企业。A的monopoly of big data不是说技术没有医疗作用，而是把数据及其处理成果带来的控制权归属概括出来。What matters把重点明确放在“归私人垄断者所有”，与前面“仅仅说能救人还不够”形成递进。因此A能回答为什么一项可能有益的合作仍值得担心：公共资源产生的价值和力量可能被科技巨头掌握。\u003c/p>\n\u003cp>担心的不只是眼前有没有医疗收益，还包括这些成果最终归谁拥有。\u003c/p>\n\u003cp>A保留了企业、数据及价值归属之间的关系，没有把“有益”与“存在垄断风险”当成互相排斥的两件事。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives.\u003c/p>\n\u003cp>What matters is that they will belong to a private monopoly which developed them using public resources.\u003c/p>\n\u003cp>作者承认算法可能救人，随即强调利用公共资源开发的成果将归私人垄断者所有，担心走向数字封建制。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出仅用隐私法处理没有触及真正担忧：公共资源开发的成果归私人垄断企业；最后强调长期应对，同时肯定报告是可喜的开始。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Publicly generated data and the resulting algorithms may become the exclusive power of a private monopoly.\u003c/p>\n\u003cp>由公共资源产生的数据和相应算法可能成为私人垄断者的专属权力。\u003c/p>\n\u003c/blockquote>\n\u003cp>what matters引出belong to a private monopoly，末句digital feudalism放大这一风险。选项抓住归属与垄断，不否认救人潜力。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>谨慎态度的关键是公共资源创造的价值是否集中到巨头手中。题干问real worry，应回答这种权力归属，不能只回到前面已经讨论的隐私执法。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the monopoly of big data by tech giants\u003cbr>科技巨头对大数据的垄断\u003c/p>\n\u003c/blockquote>\n\u003cp>A保留了企业、数据及价值归属之间的关系，没有把“有益”与“存在垄断风险”当成互相排斥的两件事。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出仅用隐私法处理没有触及真正担忧：公共资源开发的成果归私人垄断企业；最后强调长期应对，同时肯定报告是可喜的开始。\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. the vicious rivalry among big pharmas\u003c/h3>\n\u003cblockquote>\n\u003cp>大型制药企业之间的恶性竞争\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时选项呈现为“the [xxx] rivalry among big pharmas”，保留了相应遮挡。当时的定位线索是：B的rivalry among big pharmas让人想到末段big pharma，但原句big data may be expected to behave as big pharma has done是在作类比，因此回看被说明的一方到底是谁。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>big data may be expected to behave as big pharma has done把大数据企业的未来行为，与大型制药企业已经有过的做法相类比。句子的主要对象仍是big data，big pharma是拿来帮助理解的一方。B的rivalry among big pharmas却将主题改成制药公司之间的竞争，among还添了企业互相竞争的关系。前面的形容词不清楚，也改变不了对象已经从数据企业移到制药企业、类比已经变成内部竞争这两件事。药物能救人只是引出类似力量的一座桥，不是说这项医疗数据协议会令制药公司相互争斗。\u003c/p>\n\u003cp>B把帮助说明问题的另一行业拿来当问题本身，又增加企业之间的竞争，主体与关系都移动了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>If software promises to save lives on the scale that drugs now can, big data may be expected to behave as a big pharma has done.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>最后一段所说的真正担忧是大型制药企业之间的恶性竞争。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的rivalry among big pharmas让人想到末段big pharma，但原句big data may be expected to behave as big pharma has done是在作类比，因此回看被说明的一方到底是谁。\u003c/p>\n\u003cp>big data may be expected to behave as big pharma has done把大数据企业的未来行为，与大型制药企业已经有过的做法相类比。句子的主要对象仍是big data，big pharma是拿来帮助理解的一方。B的rivalry among big pharmas却将主题改成制药公司之间的竞争，among还添了企业互相竞争的关系。前面的形容词不清楚，也改变不了对象已经从数据企业移到制药企业、类比已经变成内部竞争这两件事。药物能救人只是引出类似力量的一座桥，不是说这项医疗数据协议会令制药公司相互争斗。\u003c/p>\n\u003cp>类比用来说明大数据一方，而不是把制药业竞争改成这项合作的核心问题。\u003c/p>\n\u003cp>B把帮助说明问题的另一行业拿来当问题本身，又增加企业之间的竞争，主体与关系都移动了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>If software promises to save lives on the scale that drugs now can, big
