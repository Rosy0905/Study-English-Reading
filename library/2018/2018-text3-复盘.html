法律条文已经对准问题，只是执行太差”，而是紧接着另提What matters，把真正要讨论的东西放在公共资源开发的成果属于私人垄断者。D的ineffective enforcement却让人把原因继续理解成原有隐私法律执行得不够好。执行强弱与处理角度是否触及更深的问题不同：即便患者许可等隐私事项按要求处理，成果和权力由谁掌握的问题仍需要回答。D把作者往深一层追问的方向，又拉回眼前的执行成效。\u003c/p>\n\u003cp>后文明确提出的是另外一层的垄断与归属，而不是给原有执法力度打分。\u003c/p>\n\u003cp>D把“没有解决真正担忧”缩成“执行效果不好”，遗漏了What matters后作者亲自指出的问题对象。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The use of privacy law to curb the tech giants in this instance feels slightly maladapted.\u003c/p>\n\u003cp>This practice does not address the real worry.\u003c/p>\n\u003cp>What matters is that they will belong to a private monopoly which developed them using public resources.\u003c/p>\n\u003cp>作者承认算法可能救人，随即强调利用公共资源开发的成果将归私人垄断者所有，担心走向数字封建制。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出仅用隐私法处理没有触及真正担忧：公共资源开发的成果归私人垄断企业；最后强调长期应对，同时肯定报告是可喜的开始。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The fundamental problem is simply that privacy laws are not enforced effectively.\u003c/p>\n\u003cp>根本问题仅仅是隐私法未获有效执行。\u003c/p>\n\u003c/blockquote>\n\u003cp>作者说隐私法角度本身不够适配，不能触及真正担忧。假设把问题缩为执行不力，忽略即使执行旧法也可能存在私人垄断。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>cautious\u003cbr>谨慎的\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>谨慎态度的关键是公共资源创造的价值是否集中到巨头手中。题干问real worry，应回答这种权力归属，不能只回到前面已经讨论的隐私执法。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the ineffective enforcement of privacy law\u003cbr>隐私法执行不力\u003c/p>\n\u003c/blockquote>\n\u003cp>D把“没有解决真正担忧”缩成“执行效果不好”，遗漏了What matters后作者亲自指出的问题对象。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出仅用隐私法处理没有触及真正担忧：公共资源开发的成果归私人垄断企业；最后强调长期应对，同时肯定报告是可喜的开始。\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>34题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>34. A. the monopoly of big data by tech giants\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：belong to a private monopoly中的they接前面的algorithms，作者担心用公共资源开发出的成果最后归一家私人垄断企业。\u003c/p>\n\u003cp>B：big data may be expected to behave as big pharma has done把大数据企业的未来行为，与大型制药企业已经有过的做法相类比。\u003c/p>\n\u003cp>C：belong to a private monopoly指出的是所有权集中：用公共资源开发，却归私人垄断企业。\u003c/p>\n\u003cp>D：does not address the real worry不是直接说“法律条文已经对准问题，只是执行太差”，而是紧接着另提What matters，把真正要讨论的东西放在公共资源开发的成果属于私人垄断者。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：背景介绍与问题呈现\u003c/strong>（段落1核心事件） 双方善意的合作：（NHS与DeepMind的交易）→ AI医疗应用潜力巨大 // 但可能导致权力集中 → 信息专员裁决：【皇家免费医院信托违规：（2015年移交160万患者记录 + 基于模糊协议 + 太少考虑患者权利和隐私期望）】\u003c/p>\n\u003cp>↓（各方反应与改进）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：表面改进与深层问题\u003c/strong>（段落2问题剖析） 表面反应：（DeepMind几乎道歉 + NHS信托改正做法 + 未来安排将被审查）→ 需要学习知情同意的教训 // 但隐私不是唯一甚至最重要的角度 → 法律区分的局限：【德纳姆责备NHS（控制数据）而非DeepMind（处理数据）// 但忽略了要点：数据价值来自处理和聚合，非仅仅拥有】\u003c/p>\n\u003cp>↓（核心问题探讨）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：数据经济的本质\u003c/strong>（段落3理论分析） 根本问题：谁应从数据分析中受益？→ 隐私法的局限：（基于对个人可识别知识造成损害的概念）→ 忽略了监控经济的运作方式：【个人数据只有与无数人的数据比较时才有价值】\u003c/p>\n\u003cp>↓（真正的担忧）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：数字封建主义的威胁\u003c/strong>（段落4深层担忧与警示） 隐私法约束科技巨头不适应 → 真正担忧：【算法将属于私人垄断（使用公共资源开发）】→ 类比：大数据可能像大型制药公司一样行事 → 警示：【现在处于革命开始 + 小选择可能产生巨大后果 → 需要长期斗争避免数字封建主义】→ 德纳姆报告是受欢迎的开始\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：虽然NHS与DeepMind的数据协议违反了患者隐私权，但更深层的问题是：使用公共资源开发的AI算法将被私人垄断，可能导致数字封建主义。需要超越隐私法的框架来应对这一挑战。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Public Inputs and Privately Controlled Results\u003c/p>\n\u003cp>B. Small Choices with Long-term Institutional Effects\u003c/p>\n\u003cp>C. A Promising Tool and an Unequal Concentration of Power\u003c/p>\n\u003cp>D. Value Emerges When Records Are Combined\u003c/p>\n\u003cp>E. Keeping Every Patient’s Data Permanently Unused\u003c/p>\n\u003cp>F. Consent Repairs an Important Part of the Deal\u003c/p>\n\u003cp>G. Treating an Apology as a Complete Solution\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>Artificial intelligence may help clinicians recognise a danger early enough to protect a patient. Acknowledging that promise is essential to a fair assessment of a health data agreement. Yet a useful application can also place more influence in the hands of a small number of technology companies. The two possibilities belong in the same discussion. A judgement based only on benefits, or only on fear, misses the tension that makes the agreement worth examining.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>An agreement that gives too little attention to patients’ expectations creates a serious problem. Obtaining the necessary permission, removing unnecessary records and explaining future arrangements can address that problem. These steps are more substantial than a simple apology because they change how information is handled. Even so, repairing the consent process answers only part of the debate. It does not yet determine who should gain from the knowledge produced through the arrangement.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>One record can reveal something about an individual; millions compared together can produce knowledge of a different order. Patterns become visible through aggregation and analysis, not merely through possession of separate files. A legal distinction between the body holding data and the company processing it may consequently overlook where economic value arises. The central question widens from who had access to a particular record to who benefits from the combined knowledge that many lives make possible.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>An algorithm may be developed with information collected through a public health system and still become the property of a private monopoly. Its medical usefulness does not settle whether that ownership arrangement is fair. Public resources contribute to the process, so the public has an interest in the terms on which the result can be used. The issue is not simply whether software saves lives, but how control over valuable tools is organised after they have been developed.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>At the beginning of a technological change, a narrow administrative decision can establish a much larger pattern. Repeated agreements may gradually determine who controls knowledge, who sets prices and who can develop competing tools. Decisions about permissions remain important, but they should be accompanied by attention to these institutional effects. Early scrutiny is valuable because arrangements are easier to question before they harden into a system on which everyone else depends.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>\u003cstrong>答案：C. A Promising Tool and an Unequal Concentration of Power / 有前景的工具与不平衡的权力集中\u003c/strong>\u003c/p>\n\u003cp>同时承认医疗潜力与技术巨头权力集中的风险。\u003c/p>\n\u003cblockquote>\n\u003cp>Artificial intelligence may help clinicians recognise a danger early enough to protect a patient.\u003c/p>\n\u003cp>A judgement based only on benefits, or only on fear, misses the tension that makes the agreement worth examining.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>同时承认医疗潜力与技术巨头权力集中的风险。\u003c/p>\n\u003c/blockquote>\n\u003cp>Promising Tool对应人工智能帮助医疗的潜力，Concentration of Power对应少数科技公司扩大影响；标题把正反两面放进同一次审视。\u003c/p>\n\u003cp>最强干扰项E（Keeping Every Patient’s Data Permanently Unused）容易因相同话题进入考虑。但讨论治理风险并未要求全部数据永远停止使用。\u003c/p>\n\u003cp>\u003cstrong>41题选C。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>\u003cstrong>答案：F. Consent Repairs an Important Part of the Deal / 知情同意修补协议的重要一环\u003c/strong>\u003c/p>\n\u003cp>说明授权和数据清理的必要性，再留下收益归属问题。\u003c/p>\n\u003cblockquote>\n\u003cp>An agreement that gives too little attention to patients’ expectations creates a serious problem.\u003c/p>\n\u003cp>It does not yet determine who should gain from the knowledge produced through the arrangement.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明授权和数据清理的必要性 → 再留下收益归属问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>Consent对应解释用途、取得许可及去掉不必要记录，Important Part对应这些补救有效但尚未解决知识收益归谁的问题。\u003c/p>\n\u003cp>最强干扰项G（Treating an Apology as a Complete Solution）容易因相同话题进入考虑。但道歉之后仍需要实际整改，且整改尚不能结束全部讨论。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>\u003cstrong>答案：D. Value Emerges When Records Are Combined / 记录结合时产生价值\u003c/strong>\u003c/p>\n\u003cp>从单份隐私转向聚合处理的价值来源及收益分配。\u003c/p>\n\u003cblockquote>\n\u003cp>One record can reveal something about an individual; millions compared together can produce knowledge of a different order.\u003c/p>\n\u003cp>The central question widens from who had access to a particular record to who benefits from the combined knowledge that many lives make possible.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从单份隐私转向聚合处理的价值来源及收益分配。\u003c/p>\n\u003c/blockquote>\n\u003cp>Records Are Combined对应比较数百万人的记录，Value Emerges对应聚合分析产生单份文件没有的模式知识；标题抓住价值产生的过程。\u003c/p>\n\u003cp>最强干扰项E（Keeping Every Patient’s Data Permanently Unused）容易因相同话题进入考虑。但既然分析能创造价值，问题是如何治理这种创造，而非让资料一概闲置。\u003c/p>\n\u003cp>\u003cstrong>43题选D。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>\u003cstrong>答案：A. Public Inputs and Privately Controlled Results / 公共投入与私人控制的成果\u003c/strong>\u003c/p>\n\u003cp>指出公共数据投入与私人垄断成果之间的制度矛盾。\u003c/p>\n\u003cblockquote>\n\u003cp>An algorithm may be developed with information collected through a public health system and still become the property of a private monopoly.\u003c/p>\n\u003cp>The issue is not simply whether software saves lives, but how control over valuable tools is organised after they have been developed.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>指出公共数据投入与私人垄断成果之间的制度矛盾。\u003c/p>\n\u003c/blockquote>\n\u003cp>Public Inputs对应公共医疗体系收集的信息，Privately Controlled Results对应算法成为私人垄断财产；标题展示投入来源与成果控制的不对称。\u003c/p>\n\u003cp>最强干扰项G（Treating an Apology as a Complete Solution）容易因相同话题进入考虑。但收益与控制权结构无法仅凭一封道歉改变。\u003c/p>\n\u003cp>\u003cstrong>44题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>\u003cstrong>答案：B. Small Choices with Long-term Institutional Effects / 小决定的长期制度后果\u003c/strong>\u003c/p>\n\u003cp>把早期协议选择放进长期知识控制和制度形成过程。\u003c/p>\n\u003cblockquote>\n\u003cp>At the beginning of a technological change, a narrow administrative decision can establish a much larger pattern.\u003c/p>\n\u003cp>Early scrutiny is valuable because arrangements are easier to question before they harden into a system on which everyone else depends.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>把早期协议选择放进长期知识控制和制度形成过程。\u003c/p>\n\u003c/blockquote>\n\u003cp>Small Choices对应初期看似狭窄的协议决定，Long-term Institutional Effects对应它们累积形成知识、价格及竞争控制格局。\u003c/p>\n\u003cp>最强干扰项C（A Promising Tool and an Unequal Concentration of Power）容易因相同话题进入考虑。但医疗潜力与风险是起点，这一段进一步强调早期规则的长期后果。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>A proposed medical application can be both valuable and troubling. Software may help improve care, while the data agreement supporting it can increase a company’s power. To judge the arrangement fairly, it is necessary to acknowledge the medical promise before asking how that promise is being organised.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Those conditions matter even if the tool fulfils its promise to improve treatment. Effectiveness answers a medical question; it does not automatically justify every arrangement for ownership or access. A life-saving technology can still operate within a concentrated market in which the public has little influence over its future use.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>The resulting benefits may be privately controlled even when public resources helped create them. Information collected through a health service can support an algorithm that becomes a company’s property. Patients and taxpayers then have a reason to ask about the conditions under which the tool will later be available to them.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>The arrangement first raises a question of permission. Patients need appropriate information about the use of their records, and unnecessary data should not be retained merely because it is available. Correcting these failures can improve a flawed agreement, but it does not settle every question the exchange creates.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>Knowledge produced by analysis can have considerable commercial value. A rule concerned only with who originally held the records may fail to account for the company that transforms them into a powerful tool. Possession and processing are different activities, but that distinction alone cannot tell us who should receive the resulting benefits.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>Future use is shaped by decisions made early in the development of a system. One apparently small agreement may become a model for many others. If the same distribution of control is repeated, it can turn a temporary choice into a durable institutional pattern that later users find difficult to change.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>A further question concerns where the value of the exchange comes from. A single patient’s record has one kind of significance; comparing it with millions of others can reveal patterns that no isolated file supplies. The knowledge produced by analysis therefore deserves attention alongside the protection of individual privacy.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>That institutional pattern is why scrutiny must extend beyond an apology or a repaired consent form. Both medical innovation and privacy protection remain necessary, but so does public discussion of power and benefit. A useful technology deserves rules that make its value broadly accessible rather than automatically concentrating control.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出医疗价值与权力风险并存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>区分疗效与所有权正当性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>指出公共投入与私人控制的关系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>讨论知情同意并保留更广问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>说明仅区分持有和处理不足以分配收益\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>解释小协议如何形成长期制度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>引入数据聚合创造知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>总结创新、隐私、权力及收益的综合治理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出医疗价值与权力风险并存 → 讨论知情同意并保留更广问题 → 引入数据聚合创造知识 → 说明仅区分持有和处理不足以分配收益 → 指出公共投入与私人控制的关系 → 区分疗效与所有权正当性 → 解释小协议如何形成长期制度 → 总结创新、隐私、权力及收益的综合治理\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → D → G → E → C → B → F → H\u003c/strong>\u003c/p>\n\u003cp>41—45：D、G、C、B、F。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41位于全文第2个位置，完整衔接是A → D → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To judge the arrangement fairly, it is necessary to acknowledge the medical promise before asking how that promise is being organised.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The arrangement first raises a question of permission.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A further question concerns where the value of the exchange comes from.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>the arrangement\u003c/code>，D继续处理这一对象，完成“讨论知情同意并保留更广问题”。到本段末尾，讨论又落到\u003ccode>every question\u003c/code>，这正好为下一段“引入数据聚合创造知识”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出医疗价值与权力风险并存 → 讨论知情同意并保留更广问题 → 引入数据聚合创造知识\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选G的功能是“引入数据聚合创造知识”。它也属于同一论题，但若直接放在这里，就会跳过“讨论知情同意并保留更广问题”这一必要环节；其段首“A further question concerns where the value of the exchange comes from.”需要的前提与A当前收束的对象不一致，后续也接不出G所需的\u003ccode>every question\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42位于全文第3个位置，完整衔接是D → G → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Correcting these failures can improve a flawed agreement, but it does not settle every question the exchange creates.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A further question concerns where the value of the exchange comes from.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Knowledge produced by analysis can have considerable commercial value.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>every question\u003c/code>，G继续处理这一对象，完成“引入数据聚合创造知识”。到本段末尾，讨论又落到\u003ccode>knowledge produced by analysis\u003c/code>，这正好为下一段“说明仅区分持有和处理不足以分配收益”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>讨论知情同意并保留更广问题 → 引入数据聚合创造知识 → 说明仅区分持有和处理不足以分配收益\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“讨论知情同意并保留更广问题”。它也属于同一论题，但若直接放在这里，就会跳过“引入数据聚合创造知识”这一必要环节；其段首“The arrangement first raises a question of permission.”需要的前提与D当前收束的对象不一致，后续也接不出E所需的\u003ccode>knowledge produced by analysis\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43位于全文第5个位置，完整衔接是E → C → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Possession and processing are different activities, but that distinction alone cannot tell us who should receive the resulting benefits.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The resulting benefits may be privately controlled even when public resources helped create them.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those conditions matter even if the tool fulfils its promise to improve treatment.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>resulting benefits\u003c/code>，C继续处理这一对象，完成“指出公共投入与私人控制的关系”。到本段末尾，讨论又落到\u003ccode>conditions\u003c/code>，这正好为下一段“区分疗效与所有权正当性”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明仅区分持有和处理不足以分配收益 → 指出公共投入与私人控制的关系 → 区分疗效与所有权正当性\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“区分疗效与所有权正当性”。它也属于同一论题，但若直接放在这里，就会跳过“指出公共投入与私人控制的关系”这一必要环节；其段首“Those conditions matter even if the tool fulfils its promise to improve treatment.”需要的前提与E当前收束的对象不一致，后续也接不出B所需的\u003ccode>conditions\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44位于全文第6个位置，完整衔接是C → B → F。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Patients and taxpayers then have a reason to ask about the conditions under which the tool will later be available to them.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those conditions matter even if the tool fulfils its promise to improve treatment.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Future use is shaped by decisions made early in the development of a system.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>conditions\u003c/code>，B继续处理这一对象，完成“区分疗效与所有权正当性”。到本段末尾，讨论又落到\u003ccode>future use\u003c/code>，这正好为下一段“解释小协议如何形成长期制度”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>指出公共投入与私人控制的关系 → 区分疗效与所有权正当性 → 解释小协议如何形成长期制度\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“指出公共投入与私人控制的关系”。它也属于同一论题，但若直接放在这里，就会跳过“区分疗效与所有权正当性”这一必要环节；其段首“The resulting benefits may be privately controlled even when public resources helped create them.”需要的前提与C当前收束的对象不一致，后续也接不出F所需的\u003ccode>future use\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45位于全文第7个位置，完整衔接是B → F → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A life-saving technology can still operate within a concentrated market in which the public has little influence over its future use.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Future use is shaped by decisions made early in the development of a system.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That institutional pattern is why scrutiny must extend beyond an apology or a repaired consent form.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>future use\u003c/code>，F继续处理这一对象，完成“解释小协议如何形成长期制度”。到本段末尾，讨论又落到\u003ccode>institutional pattern\u003c/code>，这正好为下一段“总结创新、隐私、权力及收益的综合治理”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>区分疗效与所有权正当性 → 解释小协议如何形成长期制度 → 总结创新、隐私、权力及收益的综合治理\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“区分疗效与所有权正当性”。它也属于同一论题，但若直接放在这里，就会跳过“解释小协议如何形成长期制度”这一必要环节；其段首“Those conditions matter even if the tool fulfils its promise to improve treatment.”需要的前提与B当前收束的对象不一致，后续也接不出H所需的\u003ccode>institutional pattern\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选F。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>responsible technological innovation\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>负责任的技术创新\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类：科技发展\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>respect for privacy\u003c/td>\n\u003ctd>尊重隐私\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fair access to medical benefits\u003c/td>\n\u003ctd>公平获得医疗收益\u003c/td>\n\u003ctd>社会现象类：生活质量\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>public trust\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>公众信任\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：理解、信任、宽容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>independent scrutiny\u003c/td>\n\u003ctd>独立审视\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cooperation for public benefit\u003c/td>\n\u003ctd>为公共利益合作\u003c/td>\n\u003ctd>人生哲理类：团结合作\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>long-term responsibility\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>长期责任\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：责任感、奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>informed choice\u003c/td>\n\u003ctd>知情选择\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>shared scientific progress\u003c/td>\n\u003ctd>共享科学进步\u003c/td>\n\u003ctd>社会现象类：科技发展\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture places the promise of a new technology beside questions about its control.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画将新技术的潜力与其控制权问题并列呈现。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is turning information supplied by many people into a valuable tool.\u003c/td>\n\u003ctd>A正把许多人提供的信息转化为有价值的工具。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast raises a question about who should benefit from shared resources.\u003c/td>\n\u003ctd>这一对比引出谁应从共享资源中受益的问题。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The amount of data used by A grew from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>A使用的数据量由X增至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures show that control over A became concentrated in fewer organisations.\u003c/td>\n\u003ctd>这些数字显示A的控制权集中到更少的机构手中。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The scale of A increased much faster than the number of groups benefiting from it.\u003c/td>\n\u003ctd>A的规模增长远快于受益群体数量的增长。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage acknowledges the promise of A while warning about the power it may concentrate.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文承认A的潜力，同时警惕它可能集中的权力。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author asks who should benefit from knowledge produced with public resources.\u003c/td>\n\u003ctd>作者追问谁应从利用公共资源产生的知识中受益。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion suggests that a small decision today may have far-reaching consequences.\u003c/td>\n\u003ctd>讨论表明今天的一个小决定可能产生深远后果。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":5},{"label":"句内逻辑","index":21},{"label":"长难句手译","index":24},{"label":"第三鸟 · 题目复盘","index":43},{"label":"35题","index":44},{"label":"31题","index":54},{"label":"32题","index":72},{"label":"33题","index":90},{"label":"34题","index":108},{"label":"第四鸟 · 新题型","index":126},{"label":"小标题题","index":126},{"label":"排序题","index":132},{"label":"第五鸟 · 写作积累","index":138}];

function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function imageTarget(ctx,metrics){

  const margin=Math.max(24,Math.min(72,view*.09));

 }

 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};

}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){

 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
