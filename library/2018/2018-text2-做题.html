<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","contextRaw":"","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","contextRaw":"","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 26题题干\n\n**According to Paragraphs 1 and 2, many young Americans cast doubt on ______.**\n\n> 根据第1、2段，许多美国年轻人对什么抱有怀疑？\n\n题型：**具体细节题**。","contextRaw":"","html":"<h2>26题题干</h2>\n<p><strong>According to Paragraphs 1 and 2, many young Americans cast doubt on ______.</strong></p>\n<blockquote>\n<p>根据第1、2段，许多美国年轻人对什么抱有怀疑？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,208.333,1335.0,113.333]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"26"}},{"section":"先读题干","raw":"## 27题题干\n\n**The phrase “beef up” (Para. 2) is closest in meaning to ______.**\n\n> 第2段的短语“beef up”与下面哪个意思最接近？\n\n题型：**词义猜测题**。","contextRaw":"","html":"<h2>27题题干</h2>\n<p><strong>The phrase “beef up” (Para. 2) is closest in meaning to ______.</strong></p>\n<blockquote>\n<p>第2段的短语“beef up”与下面哪个意思最接近？</p>\n</blockquote>\n<p>题型：<strong>词义猜测题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,666.667,1140.0,50.0]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"27"}},{"section":"先读题干","raw":"## 28题题干\n\n**According to the Knight Foundation survey, young people ______.**\n\n> 根据Knight Foundation的调查，年轻人怎么样？\n\n题型：**具体细节题**。","contextRaw":"","html":"<h2>28题题干</h2>\n<p><strong>According to the Knight Foundation survey, young people ______.</strong></p>\n<blockquote>\n<p>根据Knight Foundation的调查，年轻人怎么样？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,1063.333,1165.0,48.333]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"28"}},{"section":"先读题干","raw":"## 29题题干\n\n**The Barna survey found that a main cause for the fake news problem is ______.**\n\n> Barna的调查发现，假新闻问题的一个主要原因是什么？\n\n题型：**具体细节题**。","contextRaw":"","html":"<h2>29题题干</h2>\n<p><strong>The Barna survey found that a main cause for the fake news problem is ______.</strong></p>\n<blockquote>\n<p>Barna的调查发现，假新闻问题的一个主要原因是什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,1456.667,1335.0,113.333]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"29"}},{"section":"先读题干","raw":"## 30题题干\n\n**Which of the following would be the best title for the text?**\n\n> 下面哪个最适合作为文章的标题？\n\n题型：**全文作者观点／全文主旨题**。","contextRaw":"","html":"<h2>30题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下面哪个最适合作为文章的标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,1918.333,1040.0,48.333]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"30"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | Yet, So, In other words |\n| 态度词 / 评价词 | 先抓个大概好坏 | disapprove, skillful, needed |\n| 动作词 | 先看谁做了什么 | verify, cross-check, share |\n| 结果词 | 看最后出了什么事 | fake news, reader error |\n| 重复主题词 | 大概知道老在说什么 | young people, social media, news |","contextRaw":"","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>Yet, So, In other words</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>disapprove, skillful, needed</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>verify, cross-check, share</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>fake news, reader error</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>young people, social media, news</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump’s use of Twitter. The **[xxx]** is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.","contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump’s use of Twitter. The <span class=\"mask\">[xxx]</span> is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.</p>\n</div></div>","articleRects":[[221.667,321.667,1333.333,206.667]],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","coarse":true,"pid":0,"form":0}},{"section":"读文章","raw":"A new survey / by Harvard University / finds / more than two-thirds of young Americans / disapprove of President Trump’s use of Twitter. / The **[xxx]** is / that Millennials prefer news from the White House / to be filtered through other sources, / not a president’s social media platform.","contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>A new survey / by Harvard University / finds / more than two-thirds of young Americans / disapprove of President Trump’s use of Twitter. / The <span class=\"mask\">[xxx]</span> is / that Millennials prefer news from the W 时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做26至29题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","contextRaw":"","html":"<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"26题","raw":"## 26题\n\n> According to Paragraphs 1 and 2, many young Americans cast doubt on ______.  \n> 根据第1、2段，许多美国年轻人对什么抱有怀疑？\n\n题干已经写出Paragraphs 1 and 2，直接回到第1、2段。cast doubt on问的是“怀疑什么”，先把这两段完整读完，分清年轻人、总统、社交媒体和新闻筛选各自处在什么位置。\n\n> 原文参考：\n>\n> A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump’s use of Twitter. The **[xxx]** is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.\n>\n> 开始精读：\n>\n> A new survey / by Harvard University / finds / more than two-thirds of young Americans / disapprove of President Trump’s use of Twitter. / The **[xxx]** is / that Millennials prefer news from the White House / to be filtered through other sources, / not a president’s social media platform.\n>\n> 顺着英文顺序读：\n>\n> 一项新调查 / 由哈佛大学进行 / 发现 / 超过三分之二的美国年轻人 / 不赞同特朗普总统使用Twitter。 / 这个 **[xxx]** 是 / 千禧一代更喜欢来自白宫的新闻 / 经过其他来源筛选， / 而不是经由总统的社交媒体平台。\n\n> 原文参考：\n>\n> Most Americans rely on social media to check daily **[xxx]**. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically **[xxx]** state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media **[xxx]**.\n>\n> 开始精读：\n>\n> Most Americans rely on social media / to check daily **[xxx]**. / Yet as distrust has risen toward all media, / people may be starting / to beef up their media literacy skills. / Such a trend is badly needed. / During the 2016 presidential campaign, / nearly a quarter of web content / shared by Twitter users / in the politically **[xxx]** state of Michigan / was fake news, / according to the University of Oxford. / And a survey conducted for BuzzFeed News / found 44 percent of Facebook users / rarely or never trust news / from the media **[xxx]**.\n>\n> 顺着英文顺序读：\n>\n> 大多数美国人依赖社交媒体 / 来查看每日的 **[xxx]**。 / 然而，随着对所有媒体的不信任已经增加， / 人们或许正在开始 / 来beef up他们的媒体素养技能。 / 这样的趋势非常需要。 / 在2016年总统竞选期间， / 将近四分之一的网络内容 / 由Twitter用户分享 / 在政治上 **[xxx]** 的密歇根州 / 是假新闻， / 根据牛津大学的说法。 / 而一项为BuzzFeed News进行的调查 / 发现百分之四十四的Facebook用户 / 很少或从不相信新闻 / 来自这个媒体 **[xxx]** 的。","contextRaw":"","html":"<h2>26题</h2>\n<blockquote>\n<p>According to Paragraphs 1 and 2, many young Americans cast doubt on ______.<br />\n根据第1、2段，许多美国年轻人对什么抱有怀疑？</p>\n</blockquote>\n<p>题干已经写出Paragraphs 1 and 2，直接回到第1、2段。cast doubt on问的是“怀疑什么”，先把这两段完整读完，分清年轻人、总统、社交媒体和新闻筛选各自处在什么位置。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump’s use of Twitter. The <span class=\"mask\">[xxx]</span> is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.</p>\n<p>开始精读：</p>\n<p>A new survey / by Harvard University / finds / more than two-thirds of young Americans / disapprove of President Trump’s use of Twitter. / The <span class=\"mask\">[xxx]</span> is / that Millennials prefer news from the White House / to be filtered through other sources, / not a president’s social media platform.</p>\n<p>顺着英文顺序读：</p>\n<p>一项新调查 / 由哈佛大学进行 / 发现 / 超过三分之二的美国年轻人 / 不赞同特朗普总统使用Twitter。 / 这个 <span class=\"mask\">[xxx]</span> 是 / 千禧一代更喜欢来自白宫的新闻 / 经过其他来源筛选， / 而不是经由总统的社交媒体平台。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Most Americans rely on social media to check daily <span class=\"mask\">[xxx]</span>. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically <span class=\"mask\">[xxx]</span> state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media <span class=\"mask\">[xxx]</span>.</p>\n<p>开始精读：</p>\n<p>Most Americans rely on social media / to check daily <span class=\"mask\">[xxx]</span>. / Yet as distrust has risen toward all media, / people may be starting / to beef up their media literacy skills. / Such a trend is badly needed. / During the 2016 presidential campaign, / nearly a quarter of web content / shared by Twitter users / in the politically <span class=\"mask\">[xxx]</span> state of Michigan / was fake news, / according to the University of Oxford. / And a survey conducted for BuzzFeed News / found 44 percent of Facebook users / rarely or never trust news / from the media <span class=\"mask\">[xxx]</span>.</p>\n<p>顺着英文顺序读：</p>\n<p>大多数美国人依赖社交媒体 / 来查看每日的 <span class=\"mask\">[xxx]</span>。 / 然而，随着对所有媒体的不信任已经增加， / 人们或许正在开始 / 来beef up他们的媒体素养技能。 / 这样的趋势非常需要。 / 在2016年总统竞选期间， / 将近四分之一的网络内容 / 由Twitter用户分享 / 在政治上 <span class=\"mask\">[xxx]</span> 的密歇根州 / 是假新闻， / 根据牛津大学的说法。 / 而一项为BuzzFeed News进行的调查 / 发现百分之四十四的Facebook用户 / 很少或从不相信新闻 / 来自这个媒体 <span class=\"mask\">[xxx]</span> 的。</p>\n</blockquote>\n","articleRects":[[221.667,321.667,1333.333,206.667],[221.667,533.333,1335.0,368.333]],"questionRects":[[248.333,208.333,1335.0,113.333]],"scrollTarget":"auto","meta":{"kind":"question","qid":"26"}},{"section":"26题","raw":"### A. the justification of the news-filtering practice\n\n> 新闻筛选做法的正当性\n\n把A接回题干，它说的是：许多美国年轻人怀疑，对新闻进行筛选这种做法是否正当。\n\nA的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。\n\n> The **[xxx]** is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.\n\n先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。年轻人选择的是“经过筛选”，不是“未经筛选”。A用justification把怀疑落在筛选本身的正当性上，相当于把他们偏好的办法说成他们质疑的办法。句首那个名词没有读清，也不会改变prefer后面这组取舍。这里不能因为题干有cast doubt、原文有not，就随便把否定搬到filtered上；not对照的是后面的平台。\n\nA在这里把偏好改成了怀疑，两者的态度相反。\n\n**他们更愿意新闻经过其他来源筛选，能说明他们在怀疑筛选本身的正当性吗？**\n\n不能。原句把筛选后的新闻放在偏好的一边，A却把筛选做法放到被怀疑的一边。\n\n两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. the justification of the news-filtering practice</h3>\n<blockquote>\n<p>新闻筛选做法的正当性</p>\n</blockquote>\n<p>把A接回题干，它说的是：许多美国年轻人怀疑，对新闻进行筛选这种做法是否正当。</p>\n<p>A的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。</p>\n<blockquote>\n<p>The <span class=\"mask\">[xxx]</span> is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.</p>\n</blockquote>\n<p>先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。年轻人选择的是“经过筛选”，不是“未经筛选”。A用justification把怀疑落在筛选本身的正当性上，相当于把他们偏好的办法说成他们质疑的办法。句首那个名词没有读清，也不会改变prefer后面这组取舍。这里不能因为题干有cast doubt、原文有not，就随便把否定搬到filtered上；not对照的是后面的平台。</p>\n<p>A在这里把偏好改成了怀疑，两者的态度相反。</p>\n<p><strong>他们更愿意新闻经过其他来源筛选，能说明他们在怀疑筛选本身的正当性吗？</strong></p>\n<p>不能。原句把筛选后的新闻放在偏好的一边，A却把筛选做法放到被怀疑的一边。</p>\n<p>两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[221.667,321.667,1333.333,206.667],[221.667,533.333,1335.0,368.333]],"questionRects":[[248.333,208.333,1335.0,113.333],[316.667,340.0,795.0,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","action_direction","negation"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"prefer news","visibleOptionAnchor":"justification"}}}},{"section":"26题","raw":"### B. people’s preference for social media platforms\n\n> 人们对社交媒体平台的偏好\n\n把B接回题干，它说的是：许多美国年轻人怀疑，人们是否偏爱社交媒体平台。\n\nB的people’s preference谈人们喜不喜欢用平台，第2段rely on social media也谈平台使用，因此先看这一句承认了什么，再看Yet后面转到哪件事。\n\n> Most Americans rely on social media to check daily **[xxx]**. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\n\nrely on social media先把很多人依赖社交媒体这件事说出来；Yet后面并没有否认这些人在使用平台，而是转到distrust，也就是使用时对所接收内容的不信任。B的people’s preference问“大家的使用偏好是否如此”，把“使用一个渠道”和“相信渠道里的新闻”混成同一问题。人完全可能继续使用平台，同时不轻信上面的消息。段落正是把这两件事并列后转折，不能把后面的不信任倒过来解释成作者在否认前面的普遍使用。\n\nB换了被质疑的对象：原文质疑内容是否可信，B质疑人们是否偏爱平台。\n\n**一边依赖平台获取消息，一边不信任其中的新闻，就等于怀疑人们是否偏爱使用平台吗？**\n\n不等于。平台使用习惯与新闻可信度不是同一个判断。\n\n原文把依赖平台作为现状，再说信任发生变化；B则把现状本身改成怀疑的对象，问题落错了地方。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. people’s preference for social media platforms</h3>\n<blockquote>\n<p>人们对社交媒体平台的偏好</p>\n</blockquote>\n<p>把B接回题干，它说的是：许多美国年轻人怀疑，人们是否偏爱社交媒体平台。</p>\n<p>B的people’s preference谈人们喜不喜欢用平台，第2段rely on social media也谈平台使用，因此先看这一句承认了什么，再看Yet后面转到哪件事。</p>\n<blockquote>\n<p>Most Americans rely on social media to check daily <span class=\"mask\">[xxx]</span>. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.</p>\n</blockquote>\n<p>rely on social media先把很多人依赖社交媒体这件事说出来；Yet后面并没有否认这些人在使用平台，而是转到distrust，也就是使用时对所接收内容的不信任。B的people’s preference问“大家的使用偏好是否如此”，把“使用一个渠道”和“相信渠道里的新闻”混成同一问题。人完全可能继续使用平台，同时不轻信上面的消息。段落正是把这两件事并列后转折，不能把后面的不信任倒过来解释成作者在否认前面的普遍使用。</p>\n<p>B换了被质疑的对象：原文质疑内容是否可信，B质疑人们是否偏爱平台。</p>\n<p><strong>一边依赖平台获取消息，一边不信任其中的新闻，就等于怀疑人们是否偏爱使用平台吗？</strong></p>\n<p>不等于。平台使用习惯与新闻可信度不是同一个判断。</p>\n<p>原文把依赖平台作为现状，再说信任发生变化；B则把现状本身改成怀疑的对象，问题落错了地方。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[221.667,321.667,1333.333,206.667],[221.667,533.333,1335.0,368.333]],"questionRects":[[248.333,208.333,1335.0,113.333],[318.333,405.0,810.0,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的people’s preference谈人们喜不喜欢用平台，第2段rely on social media也谈平台使用，因此先看这一句承认了什么，再看Yet后面转到哪件事。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"ma 没有能力”。</p>\n<p><strong>用户不相信收到的新闻，就能直接说他们在质疑某一方处理信息的能力吗？</strong></p>\n<p>不能。相信什么内容，与评价谁有什么能力，是两种不同的判断。</p>\n<p>这里的差别不是C前面的名词该怎么翻，而是后半句已经把调查的新闻可信度问题改成了信息处理能力问题。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[221.667,321.667,1333.333,206.667],[221.667,533.333,1335.0,368.333]],"questionRects":[[248.333,208.333,1335.0,113.333],[316.667,471.667,853.333,46.667]],"scrollTarget":"auto","meta":{"kind":"option","qid":"26","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的ability to handle information是在评价某一方处理信息的能力，第2段rarely or never trust news是在评价收到的新闻是否可信，二者都涉及信息但对象不同，因此回看调查具体让谁不信任什么。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"rarely or never trust news","visibleOptionAnchor":"ability to handle information"}}}},{"section":"26题","raw":"### D. social media as a reliable source of news\n\n> 作为可靠新闻来源的社交媒体\n\n把D接回题干，它说的是：许多美国年轻人怀疑，社交媒体能否充当可靠的新闻来源。\n\nD的reliable source of news问新闻来源是否可靠，第2段distrust has risen正是在说信任降低，因此把这句与后面的假新闻、Facebook用户信任调查放在一起看。\n\n> Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\n\n> During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically **[xxx]** state of Michigan was fake news, according to the University of Oxford.\n\n> And a survey conducted for BuzzFeed News found 44 percent of Fa Rects":[[221.667,533.333,1335.0,368.333]],"questionRects":[[248.333,666.667,1140.0,50.0]],"scrollTarget":"auto","meta":{"kind":"question","qid":"27"}},{"section":"27题","raw":"### A. boast\n\n> 吹嘘\n\n把A接回题干，它说的是：这里的beef up是说，人们开始吹嘘自己的媒体素养技能。\n\nA的boast说的是把自己说得很好，原句beef up their media literacy skills谈人们对技能做什么，因此回看技能前面的动作与Such a trend is badly needed怎样衔接。\n\n> Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed.\n\nbeef up their media literacy skills的前因是对媒体的不信任上升，后面又说这种趋势badly needed。接下去的假新闻和低信任比例，说明遇到的难题是消息难辨真假；因此这里需要的是让判断新闻的能力发生实际变化。boast却只让人夸耀自己有能力，既不改变能力，也不解决真假难辨。不能把“对自己的技能有信心”和“把技能练得更好”当作一回事，原句紧接着强调需求，是在说后一种实际应对。\n\nA把需要发生的能力变化换成了对能力的夸耀。\n\n**面对真假难辨的消息，仅仅吹嘘自己有判断力，能成为这里急需的技能变化吗？**\n\n不能。吹嘘改变的是对外说法，不是判断新闻的能力。\n\n把boast放回句子，前面的信任问题与后面的“非常需要”就接不上了：问题需要处理，不需要自我夸耀。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. boast</h3>\n<blockquote>\n<p>吹嘘</p>\n</blockquote>\n<p>把A接回题干，它说的是：这里的beef up是说，人们开始吹嘘自己的媒体素养技能。</p>\n<p>A的boast说的是把自己说得很好，原句beef up their media literacy skills谈人们对技能做什么，因此回看技能前面的动作与Such a trend is badly needed怎样衔接。</p>\n<blockquote>\n<p>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed.</p>\n</blockquote>\n<p>beef up their media literacy skills的前因是对媒体的不信任上升，后面又说这种趋势badly needed。接下去的假新闻和低信任比例，说明遇到的难题是消息难辨真假；因此这里需要的是让判断新闻的能力发生实际变化。boast却只让人夸耀自己有能力，既不改变能力，也不解决真假难辨。不能把“对自己的技能有信心”和“把技能练得更好”当作一回事，原句紧接着强调需求，是在说后一种实际应对。</p>\n<p>A把需要发生的能力变化换成了对能力的夸耀。</p>\n<p><strong>面对真假难辨的消息，仅仅吹嘘自己有判断力，能成为这里急需的技能变化吗？</strong></p>\n<p>不能。吹嘘改变的是对外说法，不是判断新闻的能力。</p>\n<p>把boast放回句子，前面的信任问题与后面的“非常需要”就接不上了：问题需要处理，不需要自我夸耀。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[221.667,533.333,1335.0,368.333]],"questionRects":[[248.333,666.667,1140.0,50.0],[308.333,735.0,146.667,40.0]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的boast说的是把自己说得很好，原句beef up their media literacy skills谈人们对技能做什么，因此回看技能前面的动作与Such a trend is badly needed怎样衔接。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"beef up their media literacy skills","visibleOptionAnchor":"boast"}}}},{"section":"27题","raw":"### B. define\n\n> 界定\n\n把B接回题干，它说的是：这里的beef up是说，人们开始界定什么叫媒体素养技能。\n\nB的define是给出定义，media literacy skills是原句被处理的对象；都与技能有关，因此回看作者是在讨论概念的含义，还是说人们怎样应对不可信的消息。\n\n> Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed.\n\nmedia literacy skills在这里直接作为人们拥有并使用的技能出现，前面没有提出“媒体素养是什么意思”这一疑问。define会把人们正在做的事改成给概念划界、解释定义。但本段后续列的是假新闻比例和不相信平台新闻的用户比例，不是在列这个概念的几种定义。更重要的是，不信任增加之后，人们需要改善自己接收和判断消息的方式，而不只是把技能名称说清楚。B把实际能力的变化换成概念解释，动作并不相同。\n\n**把媒体素养的定义说清楚，是否就等于提高面对不可信新闻时的判断能力？**\n\n不等于。界定概念与改善技能不是同一个动作。\n\n原句把一个现实问题接到人们技能上的变化，B却把话题带到定义上，后面的具体新闻问题也没有转向概念辨析。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. define</h3>\n<blockquote>\n<p>界定</p>\n</blockquote>\n<p>把B接回题干，它说的是：这里的beef up是说，人们开始界定什么叫媒体素养技能。</p>\n<p>B的define是给出定义，media literacy skills是原句被处理的对象；都与技能有关，因此回看作者是在讨论概念的含义，还是说人们怎样应对不可信的消息。</p>\n<blockquote>\n<p>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed.</p>\n</blockquote>\n<p>media literacy skills在这里直接作为人们拥有并使用的技能出现，前面没有提出“媒体素养是什么意思”这一疑问。define会把人们正在做的事改成给概念划界、解释定义。但本段后续列的是假新闻比例和不相信平台新闻的用户比例，不是在列这个概念的几种定义。更重要的是，不信任增加之后，人们需要改善自己接收和判断消息的方式，而不只是把技能名称说清楚。B把实际能力的变化换成概念解释，动作并不相同。</p>\n<p><strong>把媒体素养的定义说清楚，是否就等于提高面对不可信新闻时的判断能力？</strong></p>\n<p>不等于。界定概念与改善技能不是同一个动作。</p>\n<p>原句把一个现实问题接到人们技能上的变化，B却把话题带到定义上，后面的具体新闻问题也没有转向概念辨析。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[221.667,533.333,1335.0,368.333]],"questionRects":[[248.333,666.667,1140.0,50.0],[308.333,800.0,160.0,40.0]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的define是给出定义，media literacy skills是原句被处理的对象；都与技能有关，因此回看作者是在讨论概念的含义，还是说人们怎样应对不可信的消息。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"media literacy skills","visibleOptionAnchor":"define"}}}},{"section":"27题","raw":"### C. sharpen\n\n> 磨炼；提高\n\n把C接回题干，它说的是：这里的beef up是说，人们开始提高自己的媒体素养技能。\n\nC的sharpen用在skills上表示使技能更敏锐，后句badly needed说明这种变化正是现实所需要的，因此回看“信任降低—技能变化—需要这种变化”的前后次序。\n\n> Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed.\n\n先有distrust has risen，再有人们开始对skills做某件事，作者随后肯定它badly needed。sharpen放进来，意思是消息不容易相信，人们就提高辨别消息的技能，而这种改进又确实必要，前后的关系能接上。这里不是先认定beef与哪个词长得像，而是把四个动作分别代回去，比较哪一个能回应实际困难。sharpen保留了“技能变得更好”的方向，也没有添出向他人传播技能或炫耀技能的对象。\n\n**新闻越来越不容易相信，所以人们提高判断技能，这样能把前后的意思接起来吗？**\n\n能。提高技能正好回应信任下降带来的辨别需要。\n\n“非常需要”肯定的是这种能力改进。C的sharpen因此可以作为beef up在这里的近义表达，而不是把它理解为字面上的磨一件东西。\n\n**第一轮判断：C保留。**","contextRaw":"","html":"<h3>C. sharpen</h3>\n<blockquote>\n<p>磨炼；提高</p>\n</blockquote>\n<p>把C接回题干，它说的是：这里的beef up是说，人们开始提高自己的媒体素养技能。</p>\n<p>C的sharpen用在skills上表示使技能更敏锐，后句badly needed说明这种变化正是现实所需要的，因此回看“信任降低—技能变化—需要这种变化”的前后次序。</p>\n<blockquote>\n<p>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed.</p>\n</blockquote>\n<p>先有distrust has risen，再有人们开始对skills做某件事，作者随后肯定它badly needed。sharpen放进来，意思是消息不容易相信，人们就提高辨别消息的技能，而这种改进又确实必要，前后的关系能接上。这里不是先认定beef与哪个词长得像，而是把四个动作分别代回去，比较哪一个能回应实际困难。sharpen保留了“技能变得更好”的方向，也没有添出向他人传播技能或炫耀技能的对象。</p>\n<p><strong>新闻越来越不容易相信，所以人们提高判断技能，这样能把前后的意思接起来吗？</strong></p>\n<p>能。提高技能正好回应信任下降带来的辨别需要。</p>\n<p>“非常需要”肯定的是这种能力改进。C的sharpen因此可以作为beef up在这里的近义表达，而不是把它理解为字面上的磨一件东西。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[221.667,533.333,1335.0,368.333]],"questionRects":[[248.333,666.667,1140.0,50.0],[308.333,866.667,183.333,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的sharpen用在skills上表示使技能更敏锐，后句badly needed说明这种变化正是现实所需要的，因此回看“信任降低—技能变化—需要这种变化”的前后次序。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"badly needed","visibleOptionAnchor":"sharpen"}}}},{"section":"27题","raw":"### D. share\n\n> 分享\n\n把D接回题干，它说的是：这里的beef up是说，人们开始分享自己的媒体素养技能。\n\nD的share容易让人想到同段shared by Twitter users，两处都可能出现“分享”，因此回看Twitter用户分享的究竟是什么，再看beef up后面的宾语。\n\n> Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.\n\n> During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically **[xxx]** state of Michigan was fake news, according to the University of Oxford.\n\nshared by Twitter users修饰的是web content，分享的是网络内容；beef up后面则是their media literacy skills，人们要处理的是自己的技能。D的share把“分享新闻内容”的动作挪给了“媒体素养技能”，但把技能传给别人并不等于自己的技能有所提高。这一段先提出需要，再举假新闻说明需要为什么迫切，不是在介绍人们已经怎样给别人讲授技能。两个句子都涉及网络，并不代表动词和宾语可以互相搬动。\n\n**原文说用户分享网络内容，就能把他们对自身技能做的动作也读成分享吗？**\n\n不能。前一句的宾语是技能，后一句被分享的是内容。\n\nD改变了动词作用的对象，也把个人面对新闻时的能力改进换成了向外分享。不能仅凭同段出现shared就选它。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. share</h3>\n<blockquote>\n<p>分享</p>\n</blockquote>\n<p>把D接回题干，它说的是：这里的beef up是说，人们开始分享自己的媒体素养技能。</p>\n<p>D的share容易让人想到同段shared by Twitter users，两处都可能出现“分享”，因此回看Twitter用户分享的究竟是什么，再看beef up后面的宾语。</p>\n<blockquote>\n<p>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.</p>\n</blockquote>\n<blockquote>\n<p>During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically <span class=\"mask\">[xxx]</span> state of Michigan was fake news, according to the University of Oxford.</p>\n</blockquote>\n<p>shared by Twitter users修饰的是web content，分享的是网络内容；beef up后面则是their media literacy skills，人们要处理的是自己的技能。D的share把“分享新闻内容”的动作挪给了“媒体素养技能”，但把技能传给别人并不等于自己的技能有所提高。这一段先提出需要，再举假新闻说明需要为什么迫切，不是在介绍人们已经怎样给别人讲授技能。两个句子都涉及网络，并不代表动词和宾语可以互相搬动。</p>\n<p><strong>原文说用户分享网络内容，就能把他们对自身技能做的动作也读成分享吗？</strong></p>\n<p>不能。前一句的宾语是技能，后一句被分享的是内容。</p>\n<p>D改变了动词作用的对象，也把个人面对新闻时的能力改进换成了向外分享。不能仅凭同段出现shared就选它。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[221.667,533.333,1335.0,368.333]],"questionRects":[[248.333,666.667,1140.0,50.0],[308.333,931.667,145.0,40.0]],"scrollTarget":"auto","meta":{"kind":"option","qid":"27","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的share容易让人想到同段shared by Twitter users，两处都可能出现“分享”，因此回看Twitter用户分享的究竟是什么，再看beef up后面的宾语。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"shared by Twitter users","visibleOptionAnchor":"share"}}}},{"section":"27题","raw":"### 27题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n把四个词放回原句，只有sharpen能把“信任下降”与“技能改进很有必要”接起来。\n\n> **27题选C。**","contextRaw":"","html":"<h3>27题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>把四个词放回原句，只有sharpen能把“信任下降”与“技能改进很有必要”接起来。</p>\n<blockquote>\n<p><strong>27题选C。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[248.333,666.667,1140.0,50.0]],"scrollTarget":"auto","meta":{"kind":"result","qid":"27"}},{"section":"28题","raw":"## 28题\n\n> According to the Knight Foundation survey, young people ______.  \n> 根据Knight Foundation的调查，年轻人怎么样？\n\n题干直接给出Knight Foundation。第3段出现这项调查，先完整读这一段，注意它调查了哪些年轻人，以及这些年轻人具体怎样核实新闻。\n\n> 原文参考：\n>\n> Young people who are digital **[xxx]** are indeed becoming more skillful at separating fact from fiction in **[xxx]**. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories. They cross-check sources and prefer news from different **[xxx]**—especially those that are open about any **[xxx]**. “Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.\n>\n> 开始精读：\n>\n> Young people who are digital **[xxx]** / are indeed becoming more skillful / at separating fact from fiction in **[xxx]**. / A Knight Foundation focus-group survey / of young people between ages 14 and 24 / found they use “distributed trust” / to verify stories. / They cross-check sources / and prefer news from different **[xxx]**— / especially those that are open about any **[xxx]**. / “Many young people assume / a great deal of personal responsibility / for educating themselves / and actively seeking out opposing viewpoints,” / the survey concluded.\n>\n> 顺着英文顺序读：\n>\n> 属于数字 **[xxx]** 的年轻人 / 确实正变得更熟练 / 在 **[xxx]** 中区分事实与虚构这件事上。 / Knight Foundation的一项焦点小组调查 / 对象是14到24岁的年轻人 / 发现他们使用“分布式信任” / 来核实新闻。 / 他们交叉核对来源 / 并更喜欢来自不同 **[xxx]** 的新闻—— / 尤其是那些对任何 **[xxx]** 都坦白说明的。 / “许多年轻人承担 / 大量的个人责任 / 去自我学习 / 并主动寻找相反的观点”， / 调查这样总结。","contextRaw":"","html":"<h2>28题</h2>\n<blockquote>\n<p>According to the Knight Foundation survey, young people ______.<br />\n根据Knight Foundation的调查，年轻人怎么样？</p>\n</blockquote>\n<p>题干直接给出Knight Foundation。第3段出现这项调查，先完整读这一段，注意它调查了哪些年轻人，以及这些年轻人具体怎样核实新闻。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Young people who are digital <span class=\"mask\">[xxx]</span> are indeed becoming more skillful at separating fact from fiction in <span class=\"mask\">[xxx]</span>. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories. They cross-check sources and prefer news from different <span class=\"mask\">[xxx]</span>—especially those that are open about any <span class=\"mask\">[xxx]</span>. “Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.</p>\n<p>开始精读：</p>\n<p> 排除。**","contextRaw":"","html":"<h3>A. tend to voice their opinions in <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>倾向于在 <span class=\"mask\">[xxx]</span> 中发表自己的意见</p>\n</blockquote>\n<p>把A接回题干，它说的是：Knight Foundation调查发现，年轻人倾向于在 <span class=\"mask\">[xxx]</span> 中表达自己的意见。</p>\n<p>A的voice their opinions和第3段seeking out opposing viewpoints都提到观点，但一个可能是往外说、一个是往外找，因此回看年轻人实际在做什么。</p>\n<blockquote>\n<p>“Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.</p>\n</blockquote>\n<p>seeking out opposing viewpoints的动作是主动寻找，找到的是与自己不一样的看法，前面还接着educating themselves，说明年轻人在通过获取信息学习。A的voice their opinions则让他们把自己的想法说出去：动作从接收、寻找变成发声，观点也从相反观点变成自己的观点。A最后地点不认识，并不能把voice改成seek，也不能把their own一边的表达改成对别人意见的查找。这里不能因为两边都有“观点”就忽略信息流向。</p>\n<p><strong>主动去寻找相反观点，能直接等同于主动发表自己的意见吗？</strong></p>\n<p>不等于。前者在向外找信息，后者在向外输出自己的看法。</p>\n<p>这一调查具体展示的是核实消息与自我学习，A把同一批人的动作和所面对的观点都换了。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[221.667,905.0,1333.333,368.333]],"questionRects":[[248.333,1063.333,1165.0,48.333],[308.333,1128.333,740.0,50.0]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的voice their opinions和第3段seeking out opposing viewpoints都提到观点，但一个可能是往外说、一个是往外找，因此回看年轻人实际在做什么。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"seeking out opposing viewpoints","visibleOptionAnchor":"voice their opinions"}}}},{"section":"28题","raw":"### B. verify news by referring to diverse sources\n\n> 通过参考多种来源来核实新闻\n\n把B接回题干，它说的是：Knight Foundation调查发现，年轻人会参考不同来源，核实新闻是否可靠。\n\nB的diverse sources说不止一个来源，原文cross-check sources说把来源交叉核对；两者都涉及用不同来源核实同一消息，因此回看to verify stories与cross-check之间的连接。\n\n> A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories. They cross-check sources and prefer news from different **[xxx]**—especially those that are open about any **[xxx]**.\n\nto verify stories先说目的：核实消息。紧接着They cross-check sources再说怎样核实：把不同来源对照起来。B的diverse sources没有额外增加一种新行为，而是把交叉核对所涉及的多个来源说出来，再用verify news保留核实新闻的目的。different后面有一处不认识，但sources和cross-check本身已经连在一起，不必把那一处补出来，才能读懂有多个来源互相对照。B同时接住目的和做法，不是只碰巧有一个同义词。\n\n**先说核实消息，再说交叉核对来源，是否可以读成参考多种来源来核实新闻？**\n\n可以。目的和具体做法在原文中紧挨着出现。\n\nB把两个相邻句的意思接在一起，年轻人还是核实者，新闻还是被核实的内容，多种来源还是核实的方法，因此先保留。\n\n**第一轮判断：B保留。**","contextRaw":"","html":"<h3>B. verify news by referring to diverse sources</h3>\n<blockquote>\n<p>通过参考多种来源来核实新闻</p>\n</blockquote>\n<p>把B接回题干，它说的是：Knight Foundation调查发现，年轻人会参考不同来源，核实新闻是否可靠。</p>\n<p>B的diverse sources说不止一个来源，原文cross-check sources说把来源交叉核对；两者都涉及用不同来源核实同一消息，因此回看to verify stories与cross-check之间的连接。</p>\n<blockquote>\n<p>A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories. They cross-check sources and prefer news from different <span class=\"mask\">[xxx]</span>—especially those that are open about any <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>to verify stories先说目的：核实消息。紧接着They cross-check sources再说怎样核实：把不同来源对照起来。B的diverse sources没有额外增加一种新行为，而是把交叉核对所涉及的多个来源说出来，再用verify news保留核实新闻的目的。different后面有一处不认识，但sources和cross-check本身已经连在一起，不必把那一处补出来，才能读懂有多个来源互相对照。B同时接住目的和做法，不是只碰巧有一个同义词。</p>\n<p><strong>先说核实消息，再说交叉核对来源，是否可以读成参考多种来源来核实新闻？</strong></p>\n<p>可以。目的和具体做法在原文中紧挨着出现。</p>\n<p>B把两个相邻句的意思接在一起，年轻人还是核实者，新闻还是被核实的内容，多种来源还是核实的方法，因此先保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[221.667,905.0,1333.333,368.333]],"questionRects":[[248.333,1063.333,1165.0,48.333],[308.333,1195.0,755.0,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的diverse sources说不止一个来源，原文cross-check sources说把来源交叉核对；两者都涉及用不同来源核实同一消息，因此回看to verify stories与cross-check之间的连接。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"cross-check sources","visibleOptionAnchor":"diverse sources"}}}},{"section":"28题","raw":"### C. have a strong sense of social **[xxx]**\n\n> 有很强的社会 **[xxx]** 意识\n\n把C接回题干，它说的是：Knight Foundation调查发现，年轻人具有很强的社会 **[xxx]** 意识。\n\nC的social指向人与社会有关的某种意识，原文personal responsibility谈个人主动承担什么；二者可能有联系，因此回看这个责任具体接着哪些行为，而不要先把social后面的词补出来。\n\n> “Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.\n\npersonal responsibility后面接for educating themselves和actively seeking out opposing viewpoints，能先读到年轻人愿意主动学习，也愿意找相反意见。C的social之后究竟是哪一种意识，现在还读不清，不能直接把它说成“个人责任”的原样替换；但也不能只看到personal与social不同，就认定任何个人主动行为都不可能体现与社会有关的意识。C比刚才B的具体核实行为宽，宽到哪一步还取决于后面的词。此处先把它和B都留下，不能因为B更具体就提前把C判错。\n\n**仅凭personal与social不一样，就能断定这里的某种社会意识与主动学习、寻找不同观点完全相反吗？**\n\n还不能。C后面的具体意思没有读清，个人主动承担的行为与它是否相合还需要再看。\n\n这一轮能确认原文写了自我学习和寻找相反观点，却还不能把C完整读成某个确定的品质。因此不替它补词，也不提前排除，暂时保留。\n\n**第一轮判断：C保留。**","contextRaw":"","html":"<h3>C. have a strong sense of social <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>有很强的社会 <span class=\"mask\">[xxx]</span> 意识</p>\n</blockquote>\n<p>把C接回题干，它说的是：Knight Foundation调查发现，年轻人具有很强的社会 <span class=\"mask\">[xxx]</span> 意识。</p>\n<p>C的social指向人与社会有关的某种意识，原文personal responsibility谈个人主动承担什么；二者可能有联系，因此回看这个责任具体接着哪些行为，而不要先把social后面的词补出来。</p>\n<blockquote>\n<p>“Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.</p>\n</blockquote>\n<p>personal responsibility后面接for educating themselves和actively seeking out opposing viewpoints，能先读到年轻人愿意主动学习，也愿意找相反意见。C的social之后究竟是哪一种意识，现在还读不清，不能直接把它说成“个人责任”的原样替换；但也不能只看到personal与social不同，就认定任何个人主动行为都不可能体现与社会有关的意识。C比刚才B的具体核实行为宽，宽到哪一步还取决于后面的词。此处先把它和B都留下，不能因为B更具体就提前把C判错。</p>\n<p><strong>仅凭personal与social不一样，就能断定这里的某种社会意识与主动学习、寻找不同观点完全相反吗？</strong></p>\n<p>还不能。C后面的具体意思没有读清，个人主动承担的行为与它是否相合还需要再看。</p>\n<p>这一轮能确认原文写了自我学习和寻找相反观点，却还不能把C完整读成某个确定的品质。因此不替它补词，也不提前排除，暂时保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[221.667,905.0,1333.333,368.333]],"questionRects":[[248.333,1063.333,1165.0,48.333],[308.333,1260.0,755.0,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的social指向人与社会有关的某种意识，原文personal responsibility谈个人主动承担什么；二者可能有联系，因此回看这个责任具体接着哪些行为，而不要先把social后面的词补出来。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedS  trust”，把方法变成交换看法的话题。下一句交叉核对sources，是在解释怎么使用这个办法，并没有把年轻人安排成讨论这一术语定义或价值的小组。focus-group survey也只是调查形式，不能看到这个词就把调查结论改成“他们爱讨论这个概念”。要分开他们怎样被调查与调查发现他们怎样核实新闻。</p>\n<p><strong>把一种办法用于核实消息，就说明年轻人喜欢围绕这种办法本身交换意见吗？</strong></p>\n<p>不能。使用方法与讨论方法是两件事。</p>\n<p>D把to verify所指向的新闻核实活动改成了on所指向的概念讨论，原文中的方法和目的都被改换了位置。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[221.667,905.0,1333.333,368.333]],"questionRects":[[248.333,1063.333,1165.0,48.333],[308.333,1325.0,793.333,50.0]],"scrollTarget":"auto","meta":{"kind":"option","qid":"28","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的exchange views把“distributed trust”当讨论的话题，原句use “distributed trust” to verify stories把它放在核实消息的方法位置；词相同但用途可能不同，因此回看use后面的to短语。"],"evidenceParagraphPids":[2],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"use “distributed trust” to verify stories","visibleOptionAnchor":"exchange views"}}}},{"section":"28题","raw":"### 28题第一次结果\n\n- A排除。\n- B保留。\n- C保留。\n- D排除。\n\nB能接上交叉核对来源、核实新闻；C的具体社会意识还没有读清，不能仅凭personal和social就拉开。A与D分别换了动作和话题。\n\n> **28题先保留B、C，暂时二选一。**","contextRaw":"","html":"<h3>28题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>B能接上交叉核对来源、核实新闻；C的具体社会意识还没有读清，不能仅凭personal和social就拉开。A与D分别换了动作和话题。</p>\n<blockquote>\n<p><strong>28题先保留B、C，暂时二选一。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[248.333,1063.333,1165.0,48.333]],"scrollTarget":"auto","meta":{"kind":"result","qid":"28"}},{"section":"29题","raw":"## 29题\n\n> The Barna survey found that a main cause for the fake news problem is ______.  \n> Barna的调查发现，假新闻问题的一个主要原因是什么？\n\n题干直接给出Barna，回到第5段的Barna research group。main cause问主要原因，先完整读这一段，尤其把“首要原因”和“相比之下”的比较对象读全。\n\n> 原文参考：\n>\n> Social media allows users to experience news events more **[xxx]** and immediately while also permitting them to re-share news as a **[xxx]** of their values and interests. This forces users to be more **[xxx]** of their role in passing along information. A survey by Barna research group found the top reason given by Americans for the fake news **[xxx]** is “reader error,” more so than made-up stories or **[xxx]** mistakes in reporting. About a third say the problem of fake news lies in “misinterpretation or **[xxx]** of actual news” via social media. In other words, the choice to share news on social media may be the heart of the issue. “This indicates there is a real personal responsibility in **[xxx]** this problem,” says Roxanne Stone, editor in chief at Barna Group.\n>\n> 开始精读：\n>\n> Social media allows users / to experience news events more **[xxx]** and immediately / while also permitting them / to re-share news as a **[xxx]** / of their values and interests. / This forces users / to be more **[xxx]** of their role / in passing along information. / A survey by Barna research group / found the top reason given by Americans / for the fake news **[xxx]** / is “reader error,” / more so than made-up stories / or **[xxx]** mistakes in reporting. / About a third say / the problem of fake news lies in / “misinterpretation or **[xxx]** of actual news” / via social media. / In other words, / the choice to share news on social media / may be the heart of the issue. / “This indicates / there is a real personal responsibility / in **[xxx]** this problem,” / says Roxanne Stone, / editor in chief at Barna Group.\n>\n> 顺着英文顺序读：\n>\n> 社交媒体让用户 / 更 **[xxx]** 而且即时地体验新闻事件 / 同时也允许他们 / 再次分享新闻，作为一种 **[xxx]** / 对他们的价值观和兴趣的。 / 这迫使用户 / 对自己的角色更加 **[xxx]** / 在传递信息时。 / Barna研究组的一项调查 / 发现美国人给出的首要原因 / 关于假新闻 **[xxx]** 的 / 是“读者错误”， / 比编造的故事更突出 / 或报道中的 **[xxx]** 错误。 / 大约三分之一的人说 / 假新闻的问题在于 / “对真实新闻的误读或 **[xxx]**” / 通过社交媒体。 / 换句话说， / 在社交媒体上分享新闻的选择 / 可能是问题的核心。 / “这表明 / 确实存在一份个人责任 / 在 **[xxx]** 这个问题方面”， / Roxanne Stone说， / 她是Barna Group的主编。","contextRaw":"","html":"<h2>29题</h2>\n<blockquote>\n<p>The Barna survey found that a main cause for the fake news problem is ______.<br />\nBarna的调查发现，假新闻问题的一个主要原因是什么？</p>\n</blockquote>\n<p>题干直接给出Barna，回到第5段的Barna research group。main cause问主要原因，先完整读这一段，尤其把“首要原因”和“相比之下”的比较对象读全。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Social media allows users to experience news events more <span class=\"mask\">[xxx]</span> and immediately while also permitting them to re-share news as a <span class=\"mask\">[xxx]</span> of their values and interests. This forces users to be more <span class=\"mask\">[xxx]</span> of their role in passing along information. A survey by Barna research group found the top reason given by Americans for the fake news <span class=\"mask\">[xxx]</span> is “reader error,” more so than made-up stories or <span class=\"mask\">[xxx]</span> mistakes in reporting. About a third say the problem of fake news lies in “misinterpretation or <span class=\"mask\">[xxx]</span> of actual news” via social media. In other words, the choice to share news on social media may be the heart of the issue. “This indicates there is a real personal responsibility in <span class=\"mask\">[xxx]</span> this problem,” says Roxanne Stone, editor in chief at Barna Group.</p>\n<p>开始精读：</p>\n<p>Social media allows users / to experience news events more <span class=\"mask\">[xxx]</span> and immediately / while also permitting them / to re-share news as a <span class=\"mask\">[xxx]</span> / of their values and interests. / This forces users / to be more <span class=\"mask\">[xxx]</span> of their role / in passing along information. / A
