这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。题干只说a main cause，不要求A包揽所有原因，因此后一句还有or以及另一个不认识的词，也不妨碍“误读”作为一个主要原因被保留。\n\n**原文先把读者错误列为首要原因，再明说误读，是不是足以支持“读者的误读”这一项？**\n\n可以这样判断。主体与具体行为在前后两句中都能找到。\n\nA没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。\n\n**第一轮判断：A保留。**","contextRaw":"","html":"<h3>A. readers’ misinterpretation</h3>\n<blockquote>\n<p>读者的误读</p>\n</blockquote>\n<p>把A接回题干，它说的是：Barna调查发现，假新闻问题的一个主要原因是读者对新闻的误读。</p>\n<p>A的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。</p>\n<blockquote>\n<p>A survey by Barna research group found the top reason given by Americans for the fake news <span class=\"mask\">[xxx]</span> is “reader error,” more so than made-up stories or <span class=\"mask\">[xxx]</span> mistakes in reporting.</p>\n</blockquote>\n<blockquote>\n<p>About a third say the problem of fake news lies in “misinterpretation or <span class=\"mask\">[xxx]</span> of actual news” via social media.</p>\n</blockquote>\n<p>reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。题干只说a main cause，不要求A包揽所有原因，因此后一句还有or以及另一个不认识的词，也不妨碍“误读”作为一个主要原因被保留。</p>\n<p><strong>原文先把读者错误列为首要原因，再明说误读，是不是足以支持“读者的误读”这一项？</strong></p>\n<p>可以这样判断。主体与具体行为在前后两句中都能找到。</p>\n<p>A没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[221.667,1490.0,1335.0,580.0]],"questionRects":[[248.333,1456.667,1335.0,113.333],[315.0,1590.0,470.0,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"reader error","visibleOptionAnchor":"readers’ misinterpretation"}}}},{"section":"29题","raw":"### B. journalists’ **[xxx]** reporting\n\n> 记者的 **[xxx]** 报道\n\n把B接回题干，它说的是：Barna调查发现，记者的 **[xxx]** 报道是假新闻问题的一个主要原因。\n\nB的journalists’把原因放在记者一边，原文more so than正把读者错误与报道问题比较，因此回看比较前后哪一边被列为top reason。\n\n> A survey by Barna research group found the top reason given by Americans for the fake news **[xxx]** is “reader error,” more so than made-up stories or **[xxx]** mistakes in reporting.\n\nmore so than不是把前后两类原因排在同样的位置，而是把reader error放得比报道中的问题更突出。B即使有一个修饰报道的词没有读懂，journalists’仍明确把责任主体选为记者；原文top reason先落在读者，再用than把报道一侧放作比较。不能把“报道问题在比较句里出现过”当成“它就是题目要找的主要一项”。B的选择会把调查最强调的责任一方从读者移到记者，比较方向也随之改了。\n\n**调查把读者错误放得更突出，能够反过来用记者的某种报道替代这个主要原因吗？**\n\n不能。than前面的读者错误才是这里被强调的一方。\n\n这不是说报道绝对不会出问题，而是本题问这项调查突出发现了什么；B把比较中的另一方提到了主要位置。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. journalists’ <span class=\"mask\">[xxx]</span> reporting</h3>\n<blockquote>\n<p>记者的 <span class=\"mask\">[xxx]</span> 报道</p>\n</blockquote>\n<p>把B接回题干，它说的是：Barna调查发现，记者的 <span class=\"mask\">[xxx]</span> 报道是假新闻问题的一个主要原因。</p>\n<p>B的journalists’把原因放在记者一边，原文more so than正把读者错误与报道问题比较，因此回看比较前后哪一边被列为top reason。</p>\n<blockquote>\n<p>A survey by Barna research group found the top reason given by Americans for the fake news <span class=\"mask\">[xxx]</span> is “reader error,” more so than made-up stories or <span class=\"mask\">[xxx]</span> mistakes in reporting.</p>\n</blockquote>\n<p>more so than不是把前后两类原因排在同样的位置，而是把reader error放得比报道中的问题更突出。B即使有一个修饰报道的词没有读懂，journalists’仍明确把责任主体选为记者；原文top reason先落在读者，再用than把报道一侧放作比较。不能把“报道问题在比较句里出现过”当成“它就是题目要找的主要一项”。B的选择会把调查最强调的责任一方从读者移到记者，比较方向也随之改了。</p>\n<p><strong>调查把读者错误放得更突出，能够反过来用记者的某种报道替代这个主要原因吗？</strong></p>\n<p>不能。than前面的读者错误才是这里被强调的一方。</p>\n<p>这不是说报道绝对不会出问题，而是本题问这项调查突出发现了什么；B把比较中的另一方提到了主要位置。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[221.667,1490.0,1335.0,580.0]],"questionRects":[[248.333,1456.667,1335.0,113.333],[315.0,1655.0,508.333,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的journalists’把原因放在记者一边，原文more so than正把读者错误与报道问题比较，因此回看比较前后哪一边被列为top reason。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","degree","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"more so than","visibleOptionAnchor":"journalists’"}}}},{"section":"29题","raw":"### C. readers’ outdated values\n\n> 读者过时的价值观\n\n把C接回题干，它说的是：Barna调查发现，读者已经过时的价值观是假新闻问题的一个主要原因。\n\nC的outdated values容易让人想到本段前面的values and interests，两者都说价值观，因此先看前句怎样使用这个词，再看调查怎样说明错误。\n\n> Social media allows users to experience news events more **[xxx]** and immediately while also permitting them to re-share news as a **[xxx]** of their values and interests.\n\n> About a third say the problem of fake news lies in “misinterpretation or **[xxx]** of actual news” via social media.\n\nvalues and interests出现在介绍用户重新分享新闻的行为时，原句并没有给这些价值观排一个新旧次序。到了调查解释原因的位置，词变成misinterpretation，说的是对真实新闻理解出了问题。C的outdated values却把原因改成价值观已经过时，多出了outdated这一时间和评价判断，也把“如何理解消息”改成“持有什么年代的观念”。即使一个人的分享与兴趣有关，也不能因此说他的兴趣或价值观落后，更不能将它自动设为误读的原因。\n\n**分享会涉及人的价值观，是否就说明假新闻主要是由过时的价值观造成的？**\n\n不是。前句只把价值观与分享联系起来，并没有认定它过时，更没有用过时解释误读。\n\nC不仅增加了原句没有作出的新旧判断，还把两个相邻的话题强接成因果，改变了调查所写的具体错误。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. readers’ outdated values</h3>\n<blockquote>\n<p>读者过时的价值观</p>\n</blockquote>\n<p>把C接回题干，它说的是：Barna调查发现，读者已经过时的价值观是假新闻问题的一个主要原因。</p>\n<p>C的outdated values容易让人想到本段前面的values and interests，两者都说价值观，因此先看前句怎样使用这个词，再看调查怎样说明错误。</p>\n<blockquote>\n<p>Social media allows users to experience news events more <span class=\"mask\">[xxx]</span> and immediately while also permitting them to re-share news as a <span class=\"mask\">[xxx]</span> of their values and interests.</p>\n</blockquote>\n<blockquote>\n<p>About a third say the problem of fake news lies in “misinterpretation or <span class=\"mask\">[xxx]</span> of actual news” via social media.</p>\n</blockquote>\n<p>values and interests出现在介绍用户重新分享新闻的行为时，原句并没有给这些价值观排一个新旧次序。到了调查解释原因的位置，词变成misinterpretation，说的是对真实新闻理解出了问题。C的outdated values却把原因改成价值观已经过时，多出了outdated这一时间和评价判断，也把“如何理解消息”改成“持有什么年代的观念”。即使一个人的分享与兴趣有关，也不能因此说他的兴趣或价值观落后，更不能将它自动设为误读的原因。</p>\n<p><strong>分享会涉及人的价值观，是否就说明假新闻主要是由过时的价值观造成的？</strong></p>\n<p>不是。前句只把价值观与分享联系起来，并没有认定它过时，更没有用过时解释误读。</p>\n<p>C不仅增加了原句没有作出的新旧判断，还把两个相邻的话题强接成因果，改变了调查所写的具体错误。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[221.667,1490.0,1335.0,580.0]],"questionRects":[[248.333,1456.667,1335.0,113.333],[313.333,1720.0,451.667,41.667]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的outdated values容易让人想到本段前面的values and interests，两者都说价值观，因此先看前句怎样使用这个词，再看调查怎样说明错误。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["time","causality","object"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"values and interests","visibleOptionAnchor":"outdated values"}}}},{"section":"29题","raw":"### D. journalists’ made-up stories\n\n> 记者编造的故事\n\n把D接回题干，它说的是：Barna调查发现，记者编造的故事是假新闻问题的一个主要原因。\n\nD的journalists’ made-up stories与原文made-up stories词面相近，但原文把它接在more so than made-up stories这一比较后半边，因此回看被比较的前一项是什么。\n\n> A survey by Barna research group found the top reason given by Americans for the fake news **[xxx]** is “reader error,” more so than made-up stories or **[xxx]** mistakes in reporting.\n\nmore so than made-up stories的前项是reader error：调查认为读者错误比编造的故事更突出。D的journalists’ made-up stories保留了后项的词，却丢了它在比较中的位置。这样选相当于看到“编造故事”就停下，不再读“比它更主要的是什么”。另外，原句只写made-up stories，D还把这些故事限定为记者编造；题目要找的读者责任因此被替换成新闻生产者责任。原文当然没有宣称编造毫无影响，但这不能抹掉top reason的明确排序。\n\n**能否因为原文提到made-up stories，就忽略more so than，把它选成调查突出的主要原因？**\n\n不能。比较句恰恰把读者错误放在它之上。\n\nD抓到了原词，却读反了这组词承担的比较作用；题干要的不是所有出现过的负面现象，而是调查强调的原因。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. journalists’ made-up stories</h3>\n<blockquote>\n<p>记者编造的故事</p>\n</blockquote>\n<p>把D接回题干，它说的是：Barna调查发现，记者编造的故事是假新闻问题的一个主要原因。</p>\n<p>D的journalists’ made-up stories与原文made-up stories词面相近，但原文把它接在more so than made-up stories这一比较后半边，因此回看被比较的前一项是什么。</p>\n<blockquote>\n<p>A survey by Barna research group found the top reason given by Americans for the fake news <span class=\"mask\">[xxx]</span> is “reader error,” more so than made-up stories or <span class=\"mask\">[xxx]</span> mistakes in reporting.</p>\n</blockquote>\n<p>more so than made-up stories的前项是reader error：调查认为读者错误比编造的故事更突出。D的journalists’ made-up stories保留了后项的词，却丢了它在比较中的位置。这样选相当于看到“编造故事”就停下，不再读“比它更主要的是什么”。另外，原句只写made-up stories，D还把这些故事限定为记者编造；题目要找的读者责任因此被替换成新闻生产者责任。原文当然没有宣称编造毫无影响，但这不能抹掉top reason的明确排序。</p>\n<p><strong>能否因为原文提到made-up stories，就忽略more so than，把它选成调查突出的主要原因？</strong></p>\n<p>不能。比较句恰恰把读者错误放在它之上。</p>\n<p>D抓到了原词，却读反了这组词承担的比较作用；题干要的不是所有出现过的负面现象，而是调查强调的原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[221.667,1490.0,1335.0,580.0]],"questionRects":[[248.333,1456.667,1335.0,113.333],[313.333,1786.667,508.333,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"29","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的journalists’ made-up stories与原文made-up stories词面相近，但原文把它接在more so than made-up stories这一比较后半边，因此回看被比较的前一项是什么。"],"evidenceParagraphPids":[4],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","degree","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"more so than made-up stories","visibleOptionAnchor":"journalists’ made-up stories"}}}},{"section":"29题","raw":"### 29题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\nA能将reader error与misinterpretation接起来；B、D把比较中较次要的报道一方提到了前面，C另外增加了“价值观过时”的解释。\n\n> **29题选A。**","contextRaw":"","html":"<h3>29题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>A能将reader error与misinterpretation接起来；B、D把比较中较次要的报道一方提到了前面，C另外增加了“价值观过时”的解释。</p>\n<blockquote>\n<p><strong>29题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[248.333,1456.667,1335.0,113.333]],"scrollTarget":"auto","meta":{"kind":"result","qid":"29"}},{"section":"30题","raw":"## 30题\n\n**Which of the following would be the best title for the text?**\n\n下面哪个最适合作为文章的标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **A Counteraction Against the Over-tweeting Trend**\n\n对过度发推趋势的反制\n\nB. **A Rise in Critical Skills for Sharing News Online**\n\n在线分享新闻所需批判性技能的提升\n\nC. **The Accumulation of Mutual Trust on Social Media**\n\n社交媒体上相互信任的积累\n\nD. **The Platforms for Projection of Personal Interests**\n\n展示个人兴趣的平台","contextRaw":"","html":"<h2>30题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下面哪个最适合作为文章的标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>A Counteraction Against the Over-tweeting Trend</strong></p>\n<p>对过度发推趋势的反制</p>\n<p>B. <strong>A Rise in Critical Skills for Sharing News Online</strong></p>\n<p>在线分享新闻所需批判性技能的提升</p>\n<p>C. <strong>The Accumulation of Mutual Trust on Social Media</strong></p>\n<p>社交媒体上相互信任的积累</p>\n<p>D. <strong>The Platforms for Projection of Personal Interests</strong></p>\n<p>展示个人兴趣的平台</p>\n","articleRects":[],"questionRects":[[248.333,1918.333,1040.0,48.333],[308.333,1983.333,873.333,50.0],[308.333,2050.0,870.0,48.333],[308.333,2115.0,908.333,41.667],[308.333,2181.667,865.0,48.333]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"30"}},{"section":"30题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。 | 先摆出一个现象 |\n| 2 | 写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。 | 再说为什么需要发生变化 |\n| 3 | 用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。 | 接着把已有变化写具体 |\n| 4 | 补充2014年的调查，谈年轻人、社交媒体与政治方面另一种效果的联系，不把尚未读清的两个名词补全。 | 接着补上另一种结果 |\n| 5 | 解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。 | 再把问题落到每个人身上 |\n| 6 | 回到年轻人批评过度发推的总统，把这一表现接到thinking skills与选择何时分享，收回到用户的判断。 | 最后收回来再作判断 |","contextRaw":"","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。</td>\n<td>先摆出一个现象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。</td>\n<td>再说为什么需要发生变化</td>\n</tr>\n<tr>\n<td>3</td>\n<td>用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。</td>\n<td>接着把已有变化写具体</td>\n</tr>\n<tr>\n<td>4</td>\n<td>补充2014年的调查，谈年轻人、社交媒体与政治方面另一种效果的联系，不把尚未读清的两个名词补全。</td>\n<td>接着补上另一种结果</td>\n</tr>\n<tr>\n<td>5</td>\n<td>解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。</td>\n<td>再把问题落到每个人身上</td>\n</tr>\n<tr>\n<td>6</td>\n<td>回到年轻人批评过度发推的总统，把这一表现接到thinking skills与选择何时分享，收回到用户的判断。</td>\n<td>最后收回来再作判断</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[221.667,321.667,1333.333,206.667],[221.667,533.333,1335.0,368.333],[221.667,905.0,1333.333,368.333],[221.667,1276.667,1333.333,208.333],[221.667,1490.0,1335.0,580.0],[221.667,2075.0,1333.333,146.667]],"questionRects":[[248.333,1918.333,1040.0,48.333]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"30","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"30题","raw":"### A. A Counteraction Against the Over-tweeting Trend\n\n> 对过度发推趋势的反制\n\n如果A是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先写人们对过度发推的反应，把反对这种行为立为话题。 | 先摆出一个现象 |\n| 2 | 接着说明过度发推造成的具体麻烦，解释为什么要反制它。 | 再说为什么需要发生变化 |\n| 3 | 用调查展示年轻人怎样抵制过度发推，例如降低关注或拒绝这一行为。 | 接着把已有变化写具体 |\n| 4 | 补充反制过度发推所带来的另一种结果。 | 接着补上另一种结果 |\n| 5 | 讨论每个人怎样对过度发推采取行动与承担责任。 | 再把问题落到每个人身上 |\n| 6 | 回到开头，明确支持反制过度发推这一趋势。 | 最后收回来再作判断 |\n\n第一段和最后一段确实提到总统发推，所以A不是凭空出现的标题。但看中间的展开，第2段用Twitter和Facebook的调查谈的是新闻可信度；第3段写交叉核对来源、寻找不同观点；第5段还把责任放在读者的理解和分享选择上。这些事情不限于发推多不多，更不是减少发推次数的具体措施。若A是标题，中间几段需要持续说明怎样反对过度发推；实际作者持续说明怎样判断、核实与分享消息。开头的总统行为是观察这种判断变化的一个入口，不能反过来让这个入口包办全部内容。\n\n**只把标题定为反制过度发推，能覆盖中间核实来源、辨别真假与审慎分享的展开吗？**\n\n不能。它抓住首尾的一个现象，却把中间持续讨论的新闻判断技能缩掉了。\n\n标题要能带着读完整篇，而不只是找出首尾重复的人物行为。A把用来引入与回扣的例子放大成全文目的。\n\n**判断：A排除。**","contextRaw":"","html":"<h3>A. A Counteraction Against the Over-tweeting Trend</h3>\n<blockquote>\n<p>对过度发推趋势的反制</p>\n</blockquote>\n<p>如果A是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先写人们对过度发推的反应，把反对这种行为立为话题。</td>\n<td>先摆出一个现象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>接着说明过度发推造成的具体麻烦，解释为什么要反制它。</td>\n<td>再说为什么需要发生变化</td>\n</tr>\n<tr>\n<td>3</td>\n<td>用调查展示年轻人怎样抵制过度发推，例如降低关注或拒绝这一行为。</td>\n<td>接着把已有变化写具体</td>\n</tr>\n<tr>\n<td>4</td>\n<td>补充反制过度发推所带来的另一种结果。</td>\n<td>接着补上另一种结果</td>\n</tr>\n<tr>\n<td>5</td>\n<td>讨论每个人怎样对过度发推采取行动与承担责任。</td>\n<td>再把问题落到每个人身上</td>\n</tr>\n<tr>\n<td>6</td>\n<td>回到开头，明确支持反制过度发推这一趋势。</td>\n<td>最后收回来再作判断</td>\n</tr>\n</tbody>\n</table>\n<p>第一段和最后一段确实提到总统发推，所以A不是凭空出现的标题。但看中间的展开，第2段用Twitter和Facebook的调查谈的是新闻可信度；第3段写交叉核对来源、寻找不同观点；第5段还把责任放在读者的理解和分享选择上。这些事情不限于发推多不多，更不是减少发推次数的具体措施。若A是标题，中间几段需要持续说明怎样反对过度发推；实际作者持续说明怎样判断、核实与分享消息。开头的总统行为是观察这种判断变化的一个入口，不能反过来让这个入口包办全部内容。</p>\n<p><strong>只把标题定为反制过度发推，能覆盖中间核实来源、辨别真假与审慎分享的展开吗？</strong></p>\n<p>不能。它抓住首尾的一个现象，却把中间持续讨论的新闻判断技能缩掉了。</p>\n<p>标题要能带着读完整篇，而不只是找出首尾重复的人物行为。A把用来引入与回扣的例子放大成全文目的。</p>\n<p><strong>判断：A排除。</strong></p>\n","articleRects":[[221.667,321.667,1333.333,206.667],[221.667,533.333,1335.0,368.333],[221.667,905.0,1333.333,368.333],[221.667,1276.667,1333.333,208.333],[221.667,1490.0,1335.0,580.0],[221.667,2075.0,1333.333,146.667]],"questionRects":[[248.333,1918.333,1040.0,48.333],[308.333,1983.333,873.333,50.0]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"A"}},{"section":"30题","raw":"### B. A Rise in Critical Skills for Sharing News Online\n\n> 在线分享新闻所需批判性技能的提升\n\n如果B是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先从年轻人的一个新闻接收选择，引出判断新闻的能力问题。 | 先摆出一个现象 |\n| 2 | 说明新闻环境为什么需要更强的判断技能。 | 再说为什么需要发生变化 |\n| 3 | 把技能提升落实到核实消息、核对来源和寻找不同看法。 | 接着把已有变化写具体 |\n| 4 | 补充这种主动接触、查证消息可能带来的另一种效果。 | 接着补上另一种结果 |\n| 5 | 将判断技能继续落实到个人理解新闻和选择分享的责任。 | 再把问题落到每个人身上 |\n| 6 | 用开头的现象再次说明思考技能与分享选择上的变化。 | 最后收回来再作判断 |\n\nB的A Rise说一种提升，第3段indeed becoming more skillful直接表现了这种变化；Critical Skills不是逢新闻必反对，而是能够区分事实与虚构、核对来源并接触相反观点。for Sharing News Online又把能力放在网上接收、处理和转发新闻的环境中，能接到第5段的reader error与the choice to share news，也能接到末段when to share。第2段给出为什么需要这种能力，第3段给出已有做法，第5段说明每个人为什么要在分享时承担责任。首尾的总统例子放在这个标题下，正好成为判断能力变化的表现，不必把全文改成对某一个人的专项批评。\n\n**以在线分享新闻时的判断技能提升作标题，能把需要、具体做法、个人责任和首尾现象连在一起吗？**\n\n能。各段都能在这个标题下保留自己原本的作用。\n\nB没有把谨慎判断读成对平台全盘不信任，也没有把主动查证读成互相盲信。它既涵盖技能变得更好的方向，也涵盖这些技能被用于分享新闻的场景。\n\n**判断：B保留。**","contextRaw":"","html":"<h3>B. A Rise in Critical Skills for Sharing News Online</h3>\n<blockquote>\n<p>在线分享新闻所需批判性技能的提升</p>\n</blockquote>\n<p>如果B是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先从年轻人的一个新闻接收选择，引出判断新闻的能力问题。</td>\n<td>先摆出一个现象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>说明新闻环境为什么需要更强的判断技能。</td>\n<td>再说为什么需要发生变化</td>\n</tr>\n<tr>\n<td>3</td>\n<td>把技能提升落实到核实消息、核对来源和寻找不同看法。</td>\n<td>接着把已有变化写具体</td>\n</tr>\n<tr>\n<td>4</td>\n<td>补充这种主动接触、查证消息可能带来的另一种效果。</td>\n<td>接着补上另一种结果</td>\n</tr>\n<tr>\n<td>5</td>\n<td>将判断技能继续落实到个人理解新闻和选择分享的责任。</td>\n<td>再把问题落到每个人身上</td>\n</tr>\n<tr>\n<td>6</td>\n<td>用开头的现象再次说明思考技能与分享选择上的变化。</td>\n<td>最后收回来再作判断</td>\n</tr>\n</tbody>\n</table>\n<p>B的A Rise说一种提升，第3段indeed becoming more skillful直接表现了这种变化；Critical Skills不是逢新闻必反对，而是能够区分事实与虚构、核对来源并接触相反观点。for Sharing News Online又把能力放在网上接收、处理和转发新闻的环境中，能接到第5段的reader error与the choice to share news，也能接到末段when to share。第2段给出为什么需要这种能力，第3段给出已有做法，第5段说明每个人为什么要在分享时承担责任。首尾的总统例子放在这个标题下，正好成为判断能力变化的表现，不必把全文改成对某一个人的专项批评。</p>\n<p><strong>以在线分享新闻时的判断技能提升作标题，能把需要、具体做法、个人责任和首尾现象连在一起吗？</strong></p>\n<p>能。各段都能在这个标题下保留自己原本的作用。</p>\n<p>B没有把谨慎判断读成对平台全盘不信任，也没有把主动查证读成互相盲信。它既涵盖技能变得更好的方向，也涵盖这些技能被用于分享新闻的场景。</p>\n<p><strong>判断：B保留。</strong></p>\n","articleRects":[[221.667,321.667,1333.333,206.667],[221.667,533.333,1335.0,368.333],[221.667,905.0,1333.333,368.333],[221.667,1276.667,1333.333,208.333],[221.667,1490.0,1335.0,580.0],[221.667,2075.0,1333.333,146.667]],"questionRects":[[248.333,1918.333,1040.0,48.333],[308.333,2050.0,870.0,48.333]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"B"}},{"section":"30题","raw":"### C. The Accumulation of Mutual Trust on Social Media\n\n> 社交媒体上相互信任的积累\n\n如果C是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先从一项调查展示社交媒体上人与人的信任正在积累。 | 先摆出一个现象 |\n| 2 | 解释为何人们需要并开始建立更多相互信任。 | 再说为什么需要发生变化 |\n| 3 | 用年轻人的行为展示他们怎样逐步更相信彼此。 | 接着把已有变化写具体 |\n| 4 | 补充相互信任积累带来的另一种结果。 | 接着补上另一种结果 |\n| 5 | 说明每个用户怎样促进彼此信任的增长。 | 再把问题落到每个人身上 |\n| 6 | 回到开头，确认社交媒体上的互信不断增强。 | 最后收回来再作判断 |\n\nC里的Trust会让人想到第3段“distributed trust”，但不能只在标题和原文之间配一个同词。第2段恰好说distrust has risen、很多用户rarely or never trust news，描写的并不是相互信任越来越多。第3段的做法也不是“因为相信对方，所以接受消息”，而是主动交叉核对不同来源，甚至寻找opposing viewpoints。第5段进一步提醒转发者可能误读，必须对自己的分享负责。C把核实消息时分散依赖来源的方法，改成社交媒体上互信积累的总体趋势；这样第2段的信任降低与第5段的误读风险就很难承接。\n\n**交叉核对不同来源、避免轻信消息，能够直接概括成社交媒体上的相互信任不断积累吗？**\n\n不能。核实新闻的方法不等于互信增长的趋势，前文还明确写了不信任增加。\n\nC既读错整体变化方向，又把“distributed trust”的具体用法扩成全文主线，无法让几项调查共同服务于这个标题。\n\n**判断：C排除。**","contextRaw":"","html":"<h3>C. The Accumulation of Mutual Trust on Social Media</h3>\n<blockquote>\n<p>社交媒体上相互信任的积累</p>\n</blockquote>\n<p>如果C是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先从一项调查展示社交媒体上人与人的信任正在积累。</td>\n<td>先摆出一个现象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>解释为何人们需要并开始建立更多相互信任。</td>\n<td>再说为什么需要发生变化</td>\n</tr>\n<tr>\n<td>3</td>\n<td>用年轻人的行为展示他们怎样逐步更相信彼此。</td>\n<td>接着把已有变化写具体</td>\n</tr>\n<tr>\n<td>4</td>\n<td>补充相互信任积累带来的另一种结果。</td>\n<td>接着补上另一种结果</td>\n</tr>\n<tr>\n<td>5</td>\n<td>说明每个用户怎样促进彼此信任的增长。</td>\n<td>再把问题落到每个人身上</td>\n</tr>\n<tr>\n<td>6</td>\n<td>回到开头，确认社交媒体上的互信不断增强。</td>\n<td>最后收回来再作判断</td>\n</tr>\n</tbody>\n</table>\n<p>C里的Trust会让人想到第3段“distributed trust”，但不能只在标题和原文之间配一个同词。第2段恰好说distrust has risen、很多用户rarely or never trust news，描写的并不是相互信任越来越多。第3段的做法也不是“因为相信对方，所以接受消息”，而是主动交叉核对不同来源，甚至寻找opposing viewpoints。第5段进一步提醒转发者可能误读，必须对自己的分享负责。C把核实消息时分散依赖来源的方法，改成社交媒体上互信积累的总体趋势；这样第2段的信任降低与第5段的误读风险就很难承接。</p>\n<p><strong>交叉核对不同来源、避免轻信消息，能够直接概括成社交媒体上的相互信任不断积累吗？</strong></p>\n<p>不能。核实新闻的方法不等于互信增长的趋势，前文还明确写了不信任增加。</p>\n<p>C既读错整体变化方向，又把“distributed trust”的具体用法扩成全文主线，无法让几项调查共同服务于这个标题。</p>\n<p><strong>判断：C排除。</strong></p>\n","articleRects":[[221.667,321.667,1333.333,206.667],[221.667,533.333,1335.0,368.333],[221.667,905.0,1333.333,368.333],[221.667,1276.667,1333.333,208.333],[221.667,1490.0,1335.0,580.0],[221.667,2075.0,1333.333,146.667]],"questionRects":[[248.333,1918.333,1040.0,48.333],[308.333,2115.0,908.333,41.667]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"C"}},{"section":"30题","raw":"### D. The Platforms for Projection of Personal Interests\n\n> 展示个人兴趣的平台\n\n如果D是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先介绍一种可以展示个人兴趣的平台。 | 先摆出一个现象 |\n| 2 | 解释人们为什么需要这样的平台及平台的发展背景。 | 再说为什么需要发生变化 |\n| 3 | 写年轻人在平台上怎样展示各自兴趣。 | 接着把已有变化写具体 |\n| 4 | 补充兴趣展示带来的另一种结果。 | 接着补上另一种结果 |\n| 5 | 说明用户怎样通过分享来呈现自己的兴趣和价值观。 | 再把问题落到每个人身上 |\n| 6 | 最后确认平台作为兴趣展示工具的意义。 | 最后收回来再作判断 |\n\nD最接近第5段开头values and interests，但那只是说明人们为什么会重新分享消息的一层背景。紧接着作者不是分类介绍兴趣平台，也不是评价平台哪一种展示功能最好，而是谈用户传递信息时的角色，再用Barna调查解释reader error。往前看，第2段的假新闻、第3段的核实来源，都在问消息是否可靠，不在问个人爱好怎样呈现。D把一段中的分享动机拿来覆盖全文，还把题目写成介绍平台的文章；这样年轻人越来越擅长辨别真假的变化就从标题中消失了。\n\n**第5段提到兴趣与价值观，就足以让整篇变成介绍个人兴趣展示平台的文章吗？**\n\n不够。该处只是分享行为的一个背景，后面的重点仍是判断新闻和对转发负责。\n\nD保留了社交媒体，却丢掉“怎样判断新闻”这一贯穿内容，用局部动机替代全文讨论的能力变化。\n\n**判断：D排除。**","contextRaw":"","html":"<h3>D. The Platforms for Projection of Personal Interests</h3>\n<blockquote>\n<p>展示个人兴趣的平台</p>\n</blockquote>\n<p>如果D是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先介绍一种可以展示个人兴趣的平台。</td>\n<td>先摆出一个现象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>解释人们为什么需要这样的平台及平台的发展背景。</td>\n<td>再说为什么需要发生变化</td>\n</tr>\n<tr>\n<td>3</td>\n<td>写年轻人在平台上怎样展示各自兴趣。</td>\n<td>接着把已有变化写具体</td>\n</tr>\n<tr>\n<td>4</td>\n<td>补充兴趣展示带来的另一种结果。</td>\n<td>接着补上另一种结果</td>\n</tr>\n<tr>\n<td>5</td>\n<td>说明用户怎样通过分享来呈现自己的兴趣和价值观。</td>\n<td>再把问题落到每个人身上</td>\n</tr>\n<tr>\n<td>6</td>\n<td>最后确认平台作为兴趣展示工具的意义。</td>\n<td>最后收回来再作判断</td>\n</tr>\n</tbody>\n</table>\n<p>D最接近第5段开头values and interests，但那只是说明人们为什么会重新分享消息的一层背景。紧接着作者不是分类介绍兴趣平台，也不是评价平台哪一种展示功能最好，而是谈用户传递信息时的角色，再用Barna调查解释reader error。往前看，第2段的假新闻、第3段的核实来源，都在问消息是否可靠，不在问个人爱好怎样呈现。D把一段中的分享动机拿来覆盖全文，还把题目写成介绍平台的文章；这样年轻人越来越擅长辨别真假的变化就从标题中消失了。</p>\n<p><strong>第5段提到兴趣与价值观，就足以让整篇变成介绍个人兴趣展示平台的文章吗？</strong></p>\n<p>不够。该处只是分享行为的一个背景，后面的重点仍是判断新闻和对转发负责。</p>\n<p>D保留了社交媒体，却丢掉“怎样判断新闻”这一贯穿内容，用局部动机替代全文讨论的能力变化。</p>\n<p><strong>判断：D排除。</strong></p>\n","articleRects":[[221.667,321.667,1333.333,206.667],[221.667,533.333,1335.0,368.333],[221.667,905.0,1333.333,368.333],[221.667,1276.667,1333.333,208.333],[221.667,1490.0,1335.0,580.0],[221.667,2075.0,1333.333,146.667]],"questionRects":[[248.333,1918.333,1040.0,48.333],[308.333,2181.667,865.0,48.333]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"30","option":"D"}},{"section":"30题","raw":"### 30题主旨结果\n\n四项与全文的展开逐段比较后，B能够保留文章最后落实的判断。\n\n> **30题选B。**\n\n这句话就是本文后续做题的主旨底牌：\n\n**A Rise in Critical Skills for Sharing News Online / 在线分享新闻所需批判性技能的提升**","contextRaw":"","html":"<h3>30题主旨结果</h3>\n<p>四项与全文的展开逐段比较后，B能够保留文章最后落实的判断。</p>\n<blockquote>\n<p><strong>30题选B。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>A Rise in Critical Skills for Sharing News Online / 在线分享新闻所需批判性技能的提升</strong></p>\n","articleRects":[],"questionRects":[[248.333,1918.333,1040.0,48.333],[308.333,2050.0,870.0,48.333]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"30"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","contextRaw":"","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查28题：B还是C？\n\n第一遍留下：\n\n- B. verify news by referring to diverse sources\n- C. have a strong sense of social **[xxx]**\n\n主旨底牌是：\n\n> **A Rise in Critical Skills for Sharing News Online / 在线分享新闻所需批判性技能的提升**\n\n也就是：这篇文章把不同调查放在一起，主要在写年轻人判断、核实和分享新闻时所用的技能，而不是给他们所有与社会有关的品质作一张总评。\n\n我们先把题干和两个选项接起来。\n\nB说Knight Foundation调查中的年轻人参考多种来源来核实新闻；C说这些年轻人具有很强的社会 **[xxx]** 意识。B是一项具体的新闻核实做法，C是一种尚未完整读清的概括性品质。\n\n第一遍没有拉开，是因为原文一边写cross-check sources，另一边又写personal responsibility和主动学习。B的行为很明确；C后面的名词没读清，不能仅凭personal与social不同就断言二者完全冲突，也不能擅自把那一处补成一个熟词。\n\n现在拿主旨来检查。\n\n先看B。底牌强调的是Critical Skills以及Sharing News。交叉核对多个来源，正是让人不把单一渠道当成全部事实的核实技能；原句to verify stories又明确给出目的。因此B既回答了这项调查发现的具体做法，也给全文的技能提升提供了一个可以落到动作上的例子。它的“多来源”不是凭标题猜的，而是由已经读过的cross-check sources支持，再由主旨说明为什么作者要写这项做法。\n\n再看C。原句确实说年轻人主动承担自我学习的责任，但for后面具体接的是educating themselves和seeking out opposing viewpoints。放回主旨，这些行为是在帮助说明他们怎样审慎判断消息，不能只因为一个行为具有主动性，就把整项调查概括为某种强烈的社会品质。C还需要说明它那种社会意识究竟怎样等同于核实新闻的技能；现在仅靠social和“很强”没有把这层联系接出来。\n\n两项再比较，B是局部明确写出的核实动作，也是全文技能主线中需要的一个环节；C仍停在一种尚未说明具体内容的宽泛评价。这里选择B，不是把C的 **[xxx]** 认出来了，而是B同时得到调查原句与全文讨论方向的支持，C不能替代这个已明确的发现。\n\n> **28题选B。**","contextRaw":"","html":"<h2>回查28题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. verify news by referring to diverse sources</li>\n<li>C. have a strong sense of social <span class=\"mask\">[xxx]</span></li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>A Rise in Critical Skills for Sharing News Online / 在线分享新闻所需批判性技能的提升</strong></p>\n</blockquote>\n<p>也就是：这篇文章把不同调查放在一起，主要在写年轻人判断、核实和分享新闻时所用的技能，而不是给他们所有与社会有关的品质作一张总评。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>B说Knight Foundation调查中的年轻人参考多种来源来核实新闻；C说这些年轻人具有很强的社会 <span class=\"mask\">[xxx]</span> 意识。B是一项具体的新闻核实做法，C是一种尚未完整读清的概括性品质。</p>\n<p>第一遍没有拉开，是因为原文一边写cross-check sources，另一边又写personal responsibility和主动学习。B的行为很明确；C后面的名词没读清，不能仅凭personal与social不同就断言二者完全冲突，也不能擅自把那一处补成一个熟词。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。底牌强调的是Critical Skills以及Sharing News。交叉核对多个来源，正是让人不把单一渠道当成全部事实的核实技能；原句to verify stories又明确给出目的。因此B既回答了这项调查发现的具体做法，也给全文的技能提升提供了一个可以落到动作上的例子。它的“多来源”不是凭标题猜的，而是由已经读过的cross-check sources支持，再由主旨说明为什么作者要写这项做法。</p>\n<p>再看C。原句确实说年轻人主动承担自我学习的责任，但for后面具体接的是educating themselves和seeking out opposing viewpoints。放回主旨，这些行为是在帮助说明他们怎样审慎判断消息，不能只因为一个行为具有主动性，就把整项调查概括为某种强烈的社会品质。C还需要说明它那种社会意识究竟怎样等同于核实新闻的技能；现在仅靠social和“很强”没有把这层联系接出来。</p>\n<p>两项再比较，B是局部明确写出的核实动作，也是全文技能主线中需要的一个环节；C仍停在一种尚未说明具体内容的宽泛评价。这里选择B，不是把C的 <span class=\"mask\">[xxx]</span> 认出来了，而是B同时得到调查原句与全文讨论方向的支持，C不能替代这个已明确的发现。</p>\n<blockquote>\n<p><strong>28题选B。</strong></p>\n</blockquote>\n","articleRects":[[221.667,905.0,1333.333,368.333]],"questionRects":[[248.333,1063.333,1165.0,48.333],[308.3 判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>26题题干</h2>\n<p><strong>According to Paragraphs 1 and 2, many young Americans cast doubt on ______.</strong></p>\n<blockquote>\n<p>根据第1、2段，许多美国年轻人对什么抱有怀疑？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<h2>27题题干</h2>\n<p><strong>The phrase “beef up” (Para. 2) is closest in meaning to ______.</strong></p>\n<blockquote>\n<p>第2段的短语“beef up”与下面哪个意思最接近？</p>\n</blockquote>\n<p>题型：<strong>词义猜测题</strong>。</p>\n<h2>28题题干</h2>\n<p><strong>According to the Knight Foundation survey, young people ______.</strong></p>\n<blockquote>\n<p>根据Knight Foundation的调查，年轻人怎么样？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<h2>29题题干</h2>\n<p><strong>The Barna survey found that a main cause for the fake news problem is ______.</strong></p>\n<blockquote>\n<p>Barna的调查发现，假新闻问题的一个主要原因是什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<h2>30题题干</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<blockquote>\n<p>下面哪个最适合作为文章的标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>Yet, So, In other words</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>disapprove, skillful, needed</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>verify, cross-check, share</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>fake news, reader error</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>young people, social media, news</td>\n</tr>\n</tbody>\n</table>\n<p>A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump’s use of Twitter. The <span class=\"mask\">[xxx]</span> is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.</p>\n<p>Most Americans rely on social media to check daily <span class=\"mask\">[xxx]</span>. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically <span class=\"mask\">[xxx]</span> state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media <span class=\"mask\">[xxx]</span>.</p>\n<p>Young people who are digital <span class=\"mask\">[xxx]</span> are indeed becoming more skillful at separating fact from fiction in <span class=\"mask\">[xxx]</span>. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories. They cross-check sources and prefer news from different <span class=\"mask\">[xxx]</span>—especially those that are open about any <span class=\"mask\">[xxx]</span>. “Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.</p>\n<p>Such active research can have another effect. A 2014 survey conducted in Australia, Britain, and the United States by the University of Wisconsin-Madison found that young people’s <span class=\"mask\">[xxx]</span> on social media led to greater political <span class=\"mask\">[xxx]</span>.</p>\n<p>Social media allows users to experience news events more <span class=\"mask\">[xxx]</span> and immediately while also permitting them to re-share news as a <span class=\"mask\">[xxx]</span> of their values and interests. This forces users to be more <span class=\"mask\">[xxx]</span> of their role in passing along information. A survey by Barna research group found the top reason given by Americans for the fake news <span class=\"mask\">[xxx]</span> is “reader error,” more so than made-up stories or <span class=\"mask\">[xxx]</span> mistakes in reporting. About a third say the problem of fake news lies in “misinterpretation or <span class=\"mask\">[xxx]</span> of actual news” via social media. In other words, the choice to share news on social media may be the heart of the issue. “This indicates there is a real personal responsibility in <span class=\"mask\">[xxx]</span> this problem,” says Roxanne Stone, editor in chief at Barna Group.</p>\n<p>So when young people are critical of an over-tweeting president, they reveal a mental <span class=\"mask\">[xxx]</span> in thinking skills—and in their choices on when to share on social media.</p>\n<p>A new survey / by Harvard University / finds / more than two-thirds of young Americans / disapprove of President Trump’s use of Twitter. / The <span class=\"mask\">[xxx]</span> is / that Millennials prefer news from the White House / to be filtered through other sources, / not a president’s social media platform.</p>\n<p>Most Americans rely on social media / to check daily <span class=\"mask\">[xxx]</span>. / Yet as distrust has risen toward all media, / people may be starting / to beef up their media literacy skills. / Such a trend is badly needed. / During the 2016 presidential campaign, / nearly a quarter of web content / shared by Twitter users / in the politically <span class=\"mask\">[xxx]</span> state of Michigan / was fake news, / according to the University of Oxford. / And a survey conducted ty / in <span class=\"mask\">[xxx]</span> this problem,” / says Roxanne Stone, / editor in chief at Barna Group.</p>\n<p>So when young people / are critical of an over-tweeting president, / they reveal a mental <span class=\"mask\">[xxx]</span> / in thinking skills— / and in their choices / on when to share on social media.</p>\n<p>一项新调查 / by 哈佛大学 / finds / 超过三分之二 of 美国年轻人 / 不赞同 of President Trump’s 使用 of Twitter. / The <span class=\"mask\">[xxx]</span> is / that Millennials prefer 新闻 from 白宫 / to be filtered through other sources, / not a president’s 社交媒体平台.</p>\n<p>大多数美国人 rely on 社交媒体 / to check daily <span class=\"mask\">[xxx]</span>. / Yet as distrust has risen toward 所有媒体, / people may be starting / to beef up their media literacy skills. / 这样的趋势 is 非常需要. / 在2016年总统竞选期间, / nearly a quarter of web content / shared by Twitter users / in the politically <span class=\"mask\">[xxx]</span> state of Michigan / was 假新闻, / according to the University of Oxford. / And a survey conducted for BuzzFeed News / found 百分之四十四 of Facebook users / 很少或从不相信 news / from the media <span class=\"mask\">[xxx]</span>.</p>\n<p>年轻人 who are digital <span class=\"mask\">[xxx]</span> / are indeed becoming more skillful / at 区分事实与虚构 in <span class=\"mask\">[xxx]</span>. / A Knight Foundation focus-group survey / of young people 在14到24岁之间 / found they use “distributed trust” / 去核实新闻. / They 交叉核对来源 / and 偏好新闻 from different <span class=\"mask\">[xxx]</span>— / especially those that are open about any <span class=\"mask\">[xxx]</span>. / “Many young people assume / a great deal of 个人责任 / for 自我学习 / and actively seeking out 相反的观点,” / the survey concluded.</p>\n<p>Such 主动查证 can have 另一个影响. / A 2014 survey conducted in Australia, Britain, and the United States / by the University of Wisconsin-Madison / found that 年轻人的 <span class=\"mask\">[xxx]</span> on 社交媒体 / led to 更多的政治 <span class=\"mask\">[xxx]</span>.</p>\n<p>社交媒体 allows users / to experience 新闻事件 more <span class=\"mask\">[xxx]</span> and immediately / while also permitting them / to re-share news as a <span class=\"mask\">[xxx]</span> / of their 价值观和兴趣. / This forces users / to be more <span class=\"mask\">[xxx]</span> of their role / in 传递信息. / 一项调查 by Barna research group / found the 首要原因 given by Americans / for the fake news <span class=\"mask\">[xxx]</span> / is “读者错误,” / more so than 编造的故事 / or <span class=\"mask\">[xxx]</span> 报道中的错误. / 大约三分之一 say / the problem of fake news lies in / “误读 or <span class=\"mask\">[xxx]</span> of actual news” / via social media. / In other words, / 分享新闻的选择 on social media / may be 问题的核心. / “This indicates / there is a real 个人责任 / in <span class=\"mask\">[xxx]</span> this problem,” / says Roxanne Stone, / editor in chief at Barna Group.</p>\n<p>So when 年轻人 / are 批评 an over-tweeting president, / they reveal a mental <span class=\"mask\">[xxx]</span> / in 思考技能— / and in 他们的选择 / on 何时分享 on 社交媒体.</p>\n<p>1、一项新调查；哈佛大学；美国年轻人；不赞同；白宫；社交媒体平台。</p>\n<p>2、大多数美国人；社交媒体；所有媒体；非常需要；2016；假新闻；很少或从不相信。</p>\n<p>3、年轻人；区分事实与虚构；14、24；核实新闻；交叉核对来源；个人责任；相反的观点。</p>\n<p>4、主动查证；另一个影响；2014；Australia、Britain；年轻人的；社交媒体；更多的政治 <span class=\"mask\">[xxx]</span>。</p>\n<p>5、社交媒体；新闻事件；读者错误；大约三分之一；误读；分享新闻的选择；个人责任。</p>\n<p>6、年轻人；批评；思考技能；他们的选择；何时分享；社交媒体。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，等题目问到时，能够回到大致的位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头有哈佛大学、美国年轻人、白宫和社交媒体；中间有假新闻、核实新闻、交叉核对来源、另一个影响；后面又看见读者错误、分享新闻的选择、个人责任和思考技能。</p>\n<p>到这里还不能自然地说清楚：年轻人的选择说明什么，几个调查各在回答什么，个人责任和分享新闻究竟怎样联系。现在先记住出现了这些对象，以及它们大致在哪一段，不急着把碎片连成完整解释。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n<h1>3. 开始做26至29题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<h2>26题</h2>\n<blockquote>\n<p>According to Paragraphs 1 and 2, many young Americans cast doubt on ______.<br />\n根据第1、2段，许多美国年轻人对什么抱有怀疑？</p>\n</blockquote>\n<p>题干已经写出Paragraphs 1 and 2，直接回到第1、2段。cast doubt on问的是“怀疑什么”，先把这两段完整读完，分清年轻人、总统、社交媒体和新闻筛选各自处在什么位置。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump’s use of Twitter. The <span class=\"mask\">[xxx]</span> is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.</p>\n<p>开始精读：</p>\n<p>A new survey / by Harvard University / finds / more than two-thirds of young Americans / disapprove of President Trump’s use of Twitter. / The <span class=\"mask\">[xxx]</span> is / that Millennials prefer news from the White House / to be filtered through other sources, / not a president’s social media platform.</p>\n<p>顺着英文顺序读：</p>\n<p>一项新调查 / 由哈佛大学进行 / 发现 / 超过三分之二的美国年轻人 / 不赞同特朗普总统使用Twitter。 / 这个 <span class=\"mask\">[xxx]</span> 是 / 千禧一代更喜欢来自白宫的新闻 / 经过其他来源筛选， / 而不是经由总统的社交媒体平台。</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Most Americans rely on social media to check daily <span class=\"mask\">[xxx]</span>. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed. During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically <span class=\"mask\">[xxx]</span> state of Michigan was fake news, according to the University of Oxford. And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media <span class=\"mask\">[xxx]</span>.</p>\n<p>开始精读：</p>\n<p>Most Americans rely on social media / to check daily <span class=\"mask\">[xxx]</span>. / Yet as distrust has risen toward all media, / people may be starting / to beef up their media literacy skills. / Such a trend is badly needed. / During the 2016 presidential campaign, / nearly a quarter of web content / shared by Twitter users / in the politically <span class=\"mask\">[xxx]</span> state of Michigan / was fake news, / according to the University of Oxford. / And a survey conducted for BuzzFeed News / found 44 percent of Facebook users / rarely or never trust news / from the media <span class=\"mask\">[xxx]</span>.</p>\n<p>顺着英文顺序读：</p>\n<p>大多数美国人依赖社交媒体 / 来查看每日的 <span class=\"mask\">[xxx]</span>。 / 然而，随着对所有媒体的不信任已经增加， / 人们或许正在开始 / 来beef up他们的媒体素养技能。 / 这样的趋势非常需要。 / 在2016年总统竞选期间， / 将近四分之一的网络内容 / 由Twitter用户分享 / 在政治上 <span class=\"mask\">[xxx]</span> 的密歇根州 / 是假新闻， / 根据牛津大学的说法。 / 而一项为BuzzFeed News进行的调查 / 发现百分之四十四的Facebook用户 / 很少或从不相信新闻 / 来自这个媒体 <span class=\"mask\">[xxx]</span> 的。</p>\n</blockquote>\n<h3>A. the justification of the news-filtering practice</h3>\n<blockquote>\n<p>新闻筛选做法的正当性</p>\n</blockquote>\n<p>把A接回题干，它说的是：许多美国年轻人怀疑，对新闻进行筛选这种做法是否正当。</p>\n<p>A的news-filtering与第1段to be filtered谈的是同一种筛选，justification问这种做法是否正当；原文却用prefer news交代年轻人的选择，因此回看prefer后面到底接哪一种新闻。</p>\n<blockquote>\n<p>The <span class=\"mask\">[xxx]</span> is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.</p>\n</blockquote>\n<p>先把prefer news的后半句接完整：更愿意接收经过其他来源筛选的白宫新闻，而不是直接从总统的社交媒体平台接收。年轻人选择的是“经过筛选”，不是“未经筛选”。A用justification把怀疑落在筛选本身的正当性上，相当于把他们偏好的办法说成他们质疑的办法。句首那个名词没有读清，也不会改变prefer后面这组取舍。这里不能因为题干有cast doubt、原文有not，就随便把否定搬到filtered上；not对照的是后面的平台。</p>\n<p>A在这里把偏好改成了怀疑，两者的态度相反。</p>\n<p><strong>他们更愿意新闻经过其他来源筛选，能说明他们在怀疑筛选本身的正当性吗？</strong></p>\n<p>不能。原句把筛选后的新闻放在偏好的一边，A却把筛选做法放到被怀疑的一边。</p>\n<p>两边谈到了同一个做法，但态度方向反了。判断时要把prefer的对象和not后的对象分开，不能只抓到“筛选”两个字就连到A。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. people’s preference for social media platforms</h3>\n<blockquote>\n<p>人们对社交媒体平台的偏好</p>\n</blockquote>\n<p>把B接回题干，它说的是：许多美国年轻人怀疑，人们是否偏爱社交媒体平台。</p>\n<p>B的people’s preference谈人们喜不喜欢用平台，第2段rely on social media也谈平台使用，因此先看这一句承认了什么，再看Yet后面转到哪件事。</p>\n<blockquote>\n<p>Most Americans rely on social media to check daily <span class=\"mask\">[xxx]</span>. Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.</p>\n</blockquote>\n<p>rely on social media先把很多人依赖社交媒体这件事说出来；Yet后面并没有否认这些人在使用平台，而是转到distrust，也就是使用时对所接收内容的不信任。B的people’s preference问“大家的使用偏好是否如此”，把“使用一个渠道”和“相信渠道里的新闻”混成同一问题。人完全可能继续使用平台，同时不轻信上面的消息。段落正是把这两件事并列后转折，不能把后面的不信任倒过来解释成作者在否认前面的普遍使用。</p>\n<p>B换了被质疑的对象：原文质疑内容是否可信，B质疑人们是否偏爱平台。</p>\n<p><strong>一边依赖平台获取消息，一边不信任其中的新闻，就等于怀疑人们是否偏爱使用平台吗？</strong></p>\n<p>不等于。平台使用习惯与新闻可信度不是同一个判断。</p>\n<p>原文把依赖平台作为现状，再说信任发生变化；B则把现状本身改成怀疑的对象，问题落错了地方。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. the <span class=\"mask\">[xxx]</span>’s ability to handle information</h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 处理信息的能力</p>\n</blockquote>\n<p>把C接回题干，它说的是：许多美国年轻人怀疑，<span class=\"mask\">[xxx]</span> 处理信息的能力。</p>\n<p>C的ability to handle information是在评价某一方处理信息的能力，第2段rarely or never trust news是在评价收到的新闻是否可信，二者都涉及信息但对象不同，因此回看调查具体让谁不信任什么。</p>\n<blockquote>\n<p>And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>rarely or never trust news的主体是Facebook用户，宾语是从媒体来的news。原文说他们很少或从不相信这些新闻，不是在测量另一方能不能办理、整理或处置信息。C的ability to handle information却把疑问换成处理能力；前面所属者即使暂时不认识，后面的ability和handle仍把评价落在能力上。第1段“希望新闻经过其他来源筛选”也是选择接收渠道，并不能变成某一方没有处理信息的本领。不要把“新闻不可信”直接改写成“处理者没有能力”。</p>\n<p><strong>用户不相信收到的新闻，就能直接说他们在质疑某一方处理信息的能力吗？</strong></p>\n<p>不能。相信什么内容，与评价谁有什么能力，是两种不同的判断。</p>\n<p>这里的差别不是C前面的名词该怎么翻，而是后半句已经把调查的新闻可信度问题改成了信息处理能力问题。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. social media as a reliable source of news</h3>\n<blockquote>\n<p>作为可靠新闻来源的社交媒体</p>\n</blockquote>\n<p>把D接回题干，它说的是：许多美国年轻人怀疑，社交媒体能否充当可靠的新闻来源。</p>\n<p>D的reliable source of news问新闻来源是否可靠，第2段distrust has risen正是在说信任降低，因此把这句与后面的假新闻、Facebook用户信任调查放在一起看。</p>\n<blockquote>\n<p>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.</p>\n</blockquote>\n<blockquote>\n<p>During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically <span class=\"mask\">[xxx]</span> state of Michigan was fake news, according to the University of Oxford.</p>\n</blockquote>\n<blockquote>\n<p>And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>distrust has risen说明不是“已经放心相信”，而是不信任在增加。后面具体到Twitter分享内容中的fake news，以及Facebook用户rarely or never trust news，都仍围绕新闻能不能相信。D的reliable source of news把三个例子共同涉及的对象保留下来：社交媒体作为新闻来源的可靠性。它没有把来源换成政府能力，也没有否认人们使用平台；它只是接在cast doubt on后面说可靠性受到怀疑。第1段年轻人更喜欢经其他来源筛选，也能与这种谨慎接收消息的选择接上。</p>\n<p><strong>对平台新闻越来越不信任，又更愿意经过其他来源筛选，是否是在怀疑这种新闻来源的可靠性？</strong></p>\n<p>可以这样判断。被怀疑的是新闻来源能不能让人放心相信。</p>\n<p>从第1段的接收选择，到第2段的不信任和假新闻例子，主体的行为与怀疑的对象能够连贯地读下来。D可以保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>26题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>A把偏好的筛选做法反说成怀疑对象；B混淆使用偏好与信任；C改成信息处理能力。D接住的是新闻来源的可靠性。</p>\n<blockquote>\n<p><strong>26题选D。</strong></p>\n</blockquote>\n<h2>27题</h2>\n<blockquote>\n<p>The phrase “beef up” (Para. 2) is closest in meaning to ______.<br />\n第2段的短语“beef up”与下面哪个意思最接近？</p>\n</blockquote>\n<p>题干用Para. 2和beef up指明第2段。这一段刚在26题完整精读过，这里不重新翻一遍，只把beef up所在句与紧接着的Such a trend一起读。先看它作用于什么，再比较四个动词。</p>\n<h3>A. boast</h3>\n<blockquote>\n<p>吹嘘</p>\n</blockquote>\n<p>把A接回题干，它说的是：这里的beef up是说，人们开始吹嘘自己的媒体素养技能。</p>\n<p>A的boast说的是把自己说得很好，原句beef up their media literacy skills谈人们对技能做什么，因此回看技能前面的动作与Such a trend is badly needed怎样衔接。</p>\n<blockquote>\n<p>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed.</p>\n</blockquote>\n<p>beef up their media literacy skills的前因是对媒体的不信任上升，后面又说这种趋势badly needed。接下去的假新闻和低信任比例，说明遇到的难题是消息难辨真假；因此这里需要的是让判断新闻的能力发生实际变化。boast却只让人夸耀自己有能力，既不改变能力，也不解决真假难辨。不能把“对自己的技能有信心”和“把技能练得更好”当作一回事，原句紧接着强调需求，是在说后一种实际应对。</p>\n<p>A把需要发生的能力变化换成了对能力的夸耀。</p>\n<p><strong>面对真假难辨的消息，仅仅吹嘘自己有判断力，能成为这里急需的技能变化吗？</strong></p>\n<p>不能。吹嘘改变的是对外说法，不是判断新闻的能力。</p>\n<p>把boast放回句子，前面的信任问题与后面的“非常需要”就接不上了：问题需要处理，不需要自我夸耀。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. define</h3>\n<blockquote>\n<p>界定</p>\n</blockquote>\n<p>把B接回题干，它说的是：这里的beef up是说，人们开始界定什么叫媒体素养技能。</p>\n<p>B的define是给出定义，media literacy skills是原句被处理的对象；都与技能有关，因此回看作者是在讨论概念的含义，还是说人们怎样应对不可信的消息。</p>\n<blockquote>\n<p>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed.</p>\n</blockquote>\n<p>media literacy skills在这里直接作为人们拥有并使用的技能出现，前面没有提出“媒体素养是什么意思”这一疑问。define会把人们正在做的事改成给概念划界、解释定义。但本段后续列的是假新闻比例和不相信平台新闻的用户比例，不是在列这个概念的几种定义。更重要的是，不信任增加之后，人们需要改善自己接收和判断消息的方式，而不只是把技能名称说清楚。B把实际能力的变化换成概念解释，动作并不相同。</p>\n<p><strong>把媒体素养的定义说清楚，是否就等于提高面对不可信新闻时的判断能力？</strong></p>\n<p>不等于。界定概念与改善技能不是同一个动作。</p>\n<p>原句把一个现实问题接到人们技能上的变化，B却把话题带到定义上，后面的具体新闻问题也没有转向概念辨析。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. sharpen</h3>\n<blockquote>\n<p>磨炼；提高</p>\n</blockquote>\n<p>把C接回题干，它说的是：这里的beef up是说，人们开始提高自己的媒体素养技能。</p>\n<p>C的sharpen用在skills上表示使技能更敏锐，后句badly needed说明这种变化正是现实所需要的，因此回看“信任降低—技能变化—需要这种变化”的前后次序。</p>\n<blockquote>\n<p>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills. Such a trend is badly needed.</p>\n</blockquote>\n<p>先有distrust has risen，再有人们开始对skills做某件事，作者随后肯定它badly needed。sharpen放进来，意思是消息不容易相信，人们就提高辨别消息的技能，而这种改进又确实必要，前后的关系能接上。这里不是先认定beef与哪个词长得像，而是把四个动作分别代回去，比较哪一个能回应实际困难。sharpen保留了“技能变得更好”的方向，也没有添出向他人传播技能或炫耀技能的对象。</p>\n<p><strong>新闻越来越不容易相信，所以人们提高判断技能，这样能把前后的意思接起来吗？</strong></p>\n<p>能。提高技能正好回应信任下降带来的辨别需要。</p>\n<p>“非常需要”肯定的是这种能力改进。C的sharpen因此可以作为beef up在这里的近义表达，而不是把它理解为字面上的磨一件东西。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. share</h3>\n<blockquote>\n<p>分享</p>\n</blockquote>\n<p>把D接回题干，它说的是：这里的beef up是说，人们开始分享自己的媒体素养技能。</p>\n<p>D的share容易让人想到同段shared by Twitter users，两处都可能出现“分享”，因此回看Twitter用户分享的究竟是什么，再看beef up后面的宾语。</p>\n<blockquote>\n<p>Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.</p>\n</blockquote>\n<blockquote>\n<p>During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically <span class=\"mask\">[xxx]</span> state of Michigan was fake news, according to the University of Oxford.</p>\n</blockquote>\n<p>shared by Twitter users修饰的是web content，分享的是网络内容；beef up后面则是their media literacy skills，人们要处理的是自己的技能。D的share把“分享新闻内容”的动作挪给了“媒体素养技能”，但把技能传给别人并不等于自己的技能有所提高。这一段先提出需要，再举假新闻说明需要为什么迫切，不是在介绍人们已经怎样给别人讲授技能。两个句子都涉及网络，并不代表动词和宾语可以互相搬动。</p>\n<p><strong>原文说用户分享网络内容，就能把他们对自身技能做的动作也读成分享吗？</strong></p>\n<p>不能。前一句的宾语是技能，后一句被分享的是内容。</p>\n<p>D改变了动词作用的对象，也把个人面对新闻时的能力改进换成了向外分享。不能仅凭同段出现shared就选它。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>27题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>把四个词放回原句，只有sharpen能把“信任下降”与“技能改进很有必要”接起来。</p>\n<blockquote>\n<p><strong>27题选C。</strong></p>\n</blockquote>\n<h2>28题</h2>\n<blockquote>\n<p>According to the Knight Foundation survey, young people ______.<br />\n根据Knight Foundation的调查，年轻人怎么样？</p>\n</blockquote>\n<p>题干直接给出Knight Foundation。第3段出现这项调查，先完整读这一段，注意它调查了哪些年轻人，以及这些年轻人具体怎样核实新闻。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Young people who are digital <span class=\"mask\">[xxx]</span> are indeed becoming more skillful at separating fact from fiction in <span class=\"mask\">[xxx]</span>. A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories. They cross-check sources and prefer news from different <span class=\"mask\">[xxx]</span>—especially those that are open about any <span class=\"mask\">[xxx]</span>. “Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.</p>\n<p>开始精读：</p>\n<p>Young people who are digital <span class=\"mask\">[xxx]</span> / are indeed becoming more skillful / at separating fact from fiction in <span class=\"mask\">[xxx]</span>. / A Knight Foundation focus-group survey / of young people between ages 14 and 24 / found they use “distributed trust” / to verify stories. / They cross-check sources / and prefer news from different <span class=\"mask\">[xxx]</span>— / especially those that are open about any <span class=\"mask\">[xxx]</span>. / “Many young people assume / a great deal of personal responsibility / for educating themselves / and actively seeking out opposing viewpoints,” / the survey concluded.</p>\n<p>顺着英文顺序读：</p>\n<p>属于数字 <span class=\"mask\">[xxx]</span> 的年轻人 / 确实正变得更熟练 / 在 <span class=\"mask\">[xxx]</span> 中区分事实与虚构这件事上。 / Knight Foundation的一项焦点小组调查 / 对象是14到24岁的年轻人 / 发现他们使用“分布式信任” / 来核实新闻。 / 他们交叉核对来源 / 并更喜欢来自不同 <span class=\"mask\">[xxx]</span> 的新闻—— / 尤其是那些对任何 <span class=\"mask\">[xxx]</span> 都坦白说明的。 / “许多年轻人承担 / 大量的个人责任 / 去自我学习 / 并主动寻找相反的观点”， / 调查这样总结。</p>\n</blockquote>\n<h3>A. tend to voice their opinions in <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>倾向于在 <span class=\"mask\">[xxx]</span> 中发表自己的意见</p>\n</blockquote>\n<p>把A接回题干，它说的是：Knight Foundation调查发现，年轻人倾向于在 <span class=\"mask\">[xxx]</span> 中表达自己的意见。</p>\n<p>A的voice their opinions和第3段seeking out opposing viewpoints都提到观点，但一个可能是往外说、一个是往外找，因此回看年轻人实际在做什么。</p>\n<blockquote>\n<p>“Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.</p>\n</blockquote>\n<p>seeking out opposing viewpoints的动作是主动寻找，找到的是与自己不一样的看法，前面还接着educating themselves，说明年轻人在通过获取信息学习。A的voice their opinions则让他们把自己的想法说出去：动作从接收、寻找变成发声，观点也从相反观点变成自己的观点。A最后地点不认识，并不能把voice改成seek，也不能把their own一边的表达改成对别人意见的查找。这里不能因为两边都有“观点”就忽略信息流向。</p>\n<p><strong>主动去寻找相反观点，能直接等同于主动发表自己的意见吗？</strong></p>\n<p>不等于。前者在向外找信息，后者在向外输出自己的看法。</p>\n<p>这一调查具体展示的是核实消息与自我学习，A把同一批人的动作和所面对的观点都换了。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. verify news by referring to diverse sources</h3>\n<blockquote>\n<p>通过参考多种来源来核实新闻</p>\n</blockquote>\n<p>把B接回题干，它说的是：Knight Foundation调查发现，年轻人会参考不同来源，核实新闻是否可靠。</p>\n<p>B的diverse sources说不止一个来源，原文cross-check sources说把来源交叉核对；两者都涉及用不同来源核实同一消息，因此回看to verify stories与cross-check之间的连接。</p>\n<blockquote>\n<p>A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories. They cross-check sources and prefer news from different <span class=\"mask\">[xxx]</span>—especially those that are open about any <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>to verify stories先说目的：核实消息。紧接着They cross-check sources再说怎样核实：把不同来源对照起来。B的diverse sources没有额外增加一种新行为，而是把交叉核对所涉及的多个来源说出来，再用verify news保留核实新闻的目的。different后面有一处不认识，但sources和cross-check本身已经连在一起，不必把那一处补出来，才能读懂有多个来源互相对照。B同时接住目的和做法，不是只碰巧有一个同义词。</p>\n<p><strong>先说核实消息，再说交叉核对来源，是否可以读成参考多种来源来核实新闻？</strong></p>\n<p>可以。目的和具体做法在原文中紧挨着出现。</p>\n<p>B把两个相邻句的意思接在一起，年轻人还是核实者，新闻还是被核实的内容，多种来源还是核实的方法，因此先保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. have a strong sense of social <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>有很强的社会 <span class=\"mask\">[xxx]</span> 意识</p>\n</blockquote>\n<p>把C接回题干，它说的是：Knight Foundation调查发现，年轻人具有很强的社会 <span class=\"mask\">[xxx]</span> 意识。</p>\n<p>C的social指向人与社会有关的某种意识，原文personal responsibility谈个人主动承担什么；二者可能有联系，因此回看这个责任具体接着哪些行为，而不要先把social后面的词补出来。</p>\n<blockquote>\n<p>“Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.</p>\n</blockquote>\n<p>personal responsibility后面接for educating themselves和actively seeking out opposing viewpoints，能先读到年轻人愿意主动学习，也愿意找相反意见。C的social之后究竟是哪一种意识，现在还读不清，不能直接把它说成“个人责任”的原样替换；但也不能只看到personal与social不同，就认定任何个人主动行为都不可能体现与社会有关的意识。C比刚才B的具体核实行为宽，宽到哪一步还取决于后面的词。此处先把它和B都留下，不能因为B更具体就提前把C判错。</p>\n<p><strong>仅凭personal与social不一样，就能断定这里的某种社会意识与主动学习、寻找不同观点完全相反吗？</strong></p>\n<p>还不能。C后面的具体意思没有读清，个人主动承担的行为与它是否相合还需要再看。</p>\n<p>这一轮能确认原文写了自我学习和寻找相反观点，却还不能把C完整读成某个确定的品质。因此不替它补词，也不提前排除，暂时保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. like to exchange views on “distributed trust”</h3>\n<blockquote>\n<p>喜欢就“分布式信任”交换意见</p>\n</blockquote>\n<p>把D接回题干，它说的是：Knight Foundation调查发现，年轻人喜欢讨论“分布式信任”，并围绕这个概念交换看法。</p>\n<p>D的exchange views把“distributed trust”当讨论的话题，原句use “distributed trust” to verify stories把它放在核实消息的方法位置；词相同但用途可能不同，因此回看use后面的to短语。</p>\n<blockquote>\n<p>A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories. They cross-check sources and prefer news from different <span class=\"mask\">[xxx]</span>—especially those that are open about any <span class=\"mask\">[xxx]</span>.</p>\n</blockquote>\n<p>use “distributed trust” to verify stories说“使用某种办法去核实新闻”，不是“对这个办法本身展开讨论”。D的exchange views后面接on “distributed trust”，把方法变成交换看法的话题。下一句交叉核对sources，是在解释怎么使用这个办法，并没有把年轻人安排成讨论这一术语定义或价值的小组。focus-group survey也只是调查形式，不能看到这个词就把调查结论改成“他们爱讨论这个概念”。要分开他们怎样被调查与调查发现他们怎样核实新闻。</p>\n<p><strong>把一种办法用于核实消息，就说明年轻人喜欢围绕这种办法本身交换意见吗？</strong></p>\n<p>不能。使用方法与讨论方法是两件事。</p>\n<p>D把to verify所指向的新闻核实活动改成了on所指向的概念讨论，原文中的方法和目的都被改换了位置。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>28题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>B能接上交叉核对来源、核实新闻；C的具体社会意识还没有读清，不能仅凭personal和social就拉开。A与D分别换了动作和话题。</p>\n<blockquote>\n<p><strong>28题先保留B、C，暂时二选一。</strong></p>\n</blockquote>\n<h2>29题</h2>\n<blockquote>\n<p>The Barna survey found that a main cause for the fake news problem is ______.<br />\nBarna的调查发现，假新闻问题的一个主要原因是什么？</p>\n</blockquote>\n<p>题干直接给出Barna，回到第5段的Barna research group。main cause问主要原因，先完整读这一段，尤其把“首要原因”和“相比之下”的比较对象读全。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Social media allows users to experience news events more <span class=\"mask\">[xxx]</span> and immediately while also permitting them to re-share news as a <span class=\"mask\">[xxx]</span> of their values and interests. This forces users to be more <span class=\"mask\">[xxx]</span> of their role in passing along information. A survey by Barna research group found the top reason given by Americans for the fake news <span class=\"mask\">[xxx]</span> is “reader error,” more so than made-up stories or <span class=\"mask\">[xxx]</span> mistakes in reporting. About a third say the problem of fake news lies in “misinterpretation or <span class=\"mask\">[xxx]</span> of actual news” via social media. In other words, the choice to share news on social media may be the heart of the issue. “This indicates there is a real personal responsibility in <span class=\"mask\">[xxx]</span> this problem,” says Roxanne Stone, editor in chief at Barna Group.</p>\n<p>开始精读：</p>\n<p>Social media allows users / to experience news events more <span class=\"mask\">[xxx]</span> and immediately / while also permitting them / to re-share news as a <span class=\"mask\">[xxx]</span> / of their values and interests. / This forces users / to be more <span class=\"mask\">[xxx]</span> of their role / in passing along information. / A survey by Barna research group / found the top reason given by Americans / for the fake news <span class=\"mask\">[xxx]</span> / is “reader error,” / more so than made-up stories / or <span class=\"mask\">[xxx]</span> mistakes in reporting. / About a third say / the problem of fake news lies in / “misinterpretation or <span class=\"mask\">[xxx]</span> of actual news” / via social media. / In other words, / the choice to share news on social media / may be the heart of the issue. / “This indicates / there is a real personal responsibility / in <span class=\"mask\">[xxx]</span> this problem,” / says Roxanne Stone, / editor in chief at Barna Group.</p>\n<p>顺着英文顺序读：</p>\n<p>社交媒体让用户 / 更 <span class=\"mask\">[xxx]</span> 而且即时地体验新闻事件 / 同时也允许他们 / 再次分享新闻，作为一种 <span class=\"mask\">[xxx]</span> / 对他们的价值观和兴趣的。 / 这迫使用户 / 对自己的角色更加 <span class=\"mask\">[xxx]</span> / 在传递信息时。 / Barna研究组的一项调查 / 发现美国人给出的首要原因 / 关于假新闻 <span class=\"mask\">[xxx]</span> 的 / 是“读者错误”， / 比编造的故事更突出 / 或报道中的 <span class=\"mask\">[xxx]</span> 错误。 / 大约三分之一的人说 / 假新闻的问题在于 / “对真实新闻的误读或 <span class=\"mask\">[xxx]</span>” / 通过社交媒体。 / 换句话说， / 在社交媒体上分享新闻的选择 / 可能是问题的核心。 / “这表明 / 确实存在一份个人责任 / 在 <span class=\"mask\">[xxx]</span> 这个问题方面”， / Roxanne Stone说， / 她是Barna Group的主编。</p>\n</blockquote>\n<h3>A. readers’ misinterpretation</h3>\n<blockquote>\n<p>读者的误读</p>\n</blockquote>\n<p>把A接回题干，它说的是：Barna调查发现，假新闻问题的一个主要原因是读者对新闻的误读。</p>\n<p>A的readers’ misinterpretation既说读者又说误读，第5段先写reader error，后面又出现misinterpretation；两处分别给出人和具体问题，因此把这两句一起看。</p>\n<blockquote>\n<p>A survey by Barna research group found the top reason given by Americans for the fake news <span class=\"mask\">[xxx]</span> is “reader error,” more so than made-up stories or <span class=\"mask\">[xxx]</span> mistakes in reporting.</p>\n</blockquote>\n<blockquote>\n<p>About a third say the problem of fake news lies in “misinterpretation or <span class=\"mask\">[xxx]</span> of actual news” via social media.</p>\n</blockquote>\n<p>reader error是调查里被放在top reason位置的读者错误，后一句再把这种错误展开到misinterpretation，也就是对实际新闻的误读。A的readers’ misinterpretation把前一句的主体和后一句的一种具体表现接起来，并没有把制造新闻的人与接收新闻的人混在一起。题干只说a main cause，不要求A包揽所有原因，因此后一句还有or以及另一个不认识的词，也不妨碍“误读”作为一个主要原因被保留。</p>\n<p><strong>原文先把读者错误列为首要原因，再明说误读，是不是足以支持“读者的误读”这一项？</strong></p>\n<p>可以这样判断。主体与具体行为在前后两句中都能找到。</p>\n<p>A没有把“一种主要原因”扩大成唯一原因，也没有忽略比较里谁更重要。它保留了读者这一方及其理解新闻时发生的问题。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. journalists’ <span class=\"mask\">[xxx]</span> reporting</h3>\n<blockquote>\n<p>记者的 <span class=\"mask\">[xxx]</span> 报道</p>\n</blockquote>\n<p>把B接回题干，它说的是：Barna调查发现，记者的 <span class=\"mask\">[xxx]</span> 报道是假新闻问题的一个主要原因。</p>\n<p>B的journalists’把原因放在记者一边，原文more so than正把读者错误与报道问题比较，因此回看比较前后哪一边被列为top reason。</p>\n<blockquote>\n<p>A survey by Barna research group found the top reason given by Americans for the fake news <span class=\"mask\">[xxx]</span> is “reader error,” more so than made-up stories or <span class=\"mask\">[xxx]</span> mistakes in reporting.</p>\n</blockquote>\n<p>more so than不是把前后两类原因排在同样的位置，而是把reader error放得比报道中的问题更突出。B即使有一个修饰报道的词没有读懂，journalists’仍明确把责任主体选为记者；原文top reason先落在读者，再用than把报道一侧放作比较。不能把“报道问题在比较句里出现过”当成“它就是题目要找的主要一项”。B的选择会把调查最强调的责任一方从读者移到记者，比较方向也随之改了。</p>\n<p><strong>调查把读者错误放得更突出，能够反过来用记者的某种报道替代这个主要原因吗？</strong></p>\n<p>不能。than前面的读者错误才是这里被强调的一方。</p>\n<p>这不是说报道绝对不会出问题，而是本题问这项调查突出发现了什么；B把比较中的另一方提到了主要位置。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. readers’ outdated values</h3>\n<blockquote>\n<p>读者过时的价值观</p>\n</blockquote>\n<p>把C接回题干，它说的是：Barna调查发现，读者已经过时的价值观是假新闻问题的一个主要原因。</p>\n<p>C的outdated values容易让人想到本段前面的values and interests，两者都说价值观，因此先看前句怎样使用这个词，再看调查怎样说明错误。</p>\n<blockquote>\n<p>Social media allows users to experience news events more <span class=\"mask\">[xxx]</span> and immediately while also permitting them to re-share news as a <span class=\"mask\">[xxx]</span> of their values and interests.</p>\n</blockquote>\n<blockquote>\n<p>About a third say the problem of fake news lies in “misinterpretation or <span class=\"mask\">[xxx]</span> of actual news” via social media.</p>\n</blockquote>\n<p>values and interests出现在介绍用户重新分享新闻的行为时，原句并没有给这些价值观排一个新旧次序。到了调查解释原因的位置，词变成misinterpretation，说的是对真实新闻理解出了问题。C的outdated values却把原因改成价值观已经过时，多出了outdated这一时间和评价判断，也把“如何理解消息”改成“持有什么年代的观念”。即使一个人的分享与兴趣有关，也不能因此说他的兴趣或价值观落后，更不能将它自动设为误读的原因。</p>\n<p><strong>分享会涉及人的价值观，是否就说明假新闻主要是由过时的价值观造成的？</strong></p>\n<p>不是。前句只把价值观与分享联系起来，并没有认定它过时，更没有用过时解释误读。</p>\n<p>C不仅增加了原句没有作出的新旧判断，还把两个相邻的话题强接成因果，改变了调查所写的具体错误。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. journalists’ made-up stories</h3>\n<blockquote>\n<p>记者编造的故事</p>\n</blockquote>\n<p>把D接回题干，它说的是：Barna调查发现，记者编造的故事是假新闻问题的一个主要原因。</p>\n<p>D的journalists’ made-up stories与原文made-up stories词面相近，但原文把它接在more so than made-up stories这一比较后半边，因此回看被比较的前一项是什么。</p>\n<blockquote>\n<p>A survey by Barna research group found the top reason given by Americans for the fake news <span class=\"mask\">[xxx]</span> is “reader error,” more so than made-up stories or <span class=\"mask\">[xxx]</span> mistakes in reporting.</p>\n</blockquote>\n<p>more so than made-up stories的前项是reader error：调查认为读者错误比编造的故事更突出。D的journalists’ made-up stories保留了后项的词，却丢了它在比较中的位置。这样选相当于看到“编造故事”就停下，不再读“比它更主要的是什么”。另外，原句只写made-up stories，D还把这些故事限定为记者编造；题目要找的读者责任因此被替换成新闻生产者责任。原文当然没有宣称编造毫无影响，但这不能抹掉top reason的明确排序。</p>\n<p><strong>能否因为原文提到made-up stories，就忽略more so than，把它选成调查突出的主要原因？</strong></p>\n<p>不能。比较句恰恰把读者错误放在它之上。</p>\n<p>D抓到了原词，却读反了这组词承担的比较作用；题干要的不是所有出现过的负面现象，而是调查强调的原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>29题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>A能将reader error与misinterpretation接起来；B、D把比较中较次要的报道一方提到了前面，C另外增加了“价值观过时”的解释。</p>\n<blockquote>\n<p><strong>29题选A。</strong></p>\n</blockquote>\n<h2>30题</h2>\n<p><strong>Which of the following would be the best title for the text?</strong></p>\n<p>下面哪个最适合作为文章的标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>A Counteraction Against the Over-tweeting Trend</strong></p>\n<p>对过度发推趋势的反制</p>\n<p>B. <strong>A Rise in Critical Skills for Sharing News Online</strong></p>\n<p>在线分享新闻所需批判性技能的提升</p>\n<p>C. <strong>The Accumulation of Mutual Trust on Social Media</strong></p>\n<p>社交媒体上相互信任的积累</p>\n<p>D. <strong>The Platforms for Projection of Personal Interests</strong></p>\n<p>展示个人兴趣的平台</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>从哈佛调查写年轻人不赞同总统使用Twitter，并更喜欢经过其他来源筛选的新闻，以一个具体选择开头。</td>\n<td>先摆出一个现象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>写使用社交媒体的同时不信任增加，随后列出假新闻和低信任比例，说明辨别消息的技能需要提高。</td>\n<td>再说为什么需要发生变化</td>\n</tr>\n<tr>\n<td>3</td>\n<td>用Knight Foundation调查写年轻人更熟练地区分事实与虚构，具体做法是核实新闻、交叉核对来源、主动寻找相反意见。</td>\n<td>接着把已有变化写具体</td>\n</tr>\n<tr>\n<td>4</td>\n<td>补充2014年的调查，谈年轻人、社交媒体与政治方面另一种效果的联系，不把尚未读清的两个名词补全。</td>\n<td>接着补上另一种结果</td>\n</tr>\n<tr>\n<td>5</td>\n<td>解释用户既接收又转发消息，再用Barna调查把假新闻问题接到读者误读与分享选择，指出个人承担的责任。</td>\n<td>再把问题落到每个人身上</td>\n</tr>\n<tr>\n<td>6</td>\n<td>回到年轻人批评过度发推的总统，把这一表现接到thinking skills与选择何时分享，收回到用户的判断。</td>\n<td>最后收回来再作判断</td>\n</tr>\n</tbody>\n</table>\n<h3>A. A Counteraction Against the Over-tweeting Trend</h3>\n<blockquote>\n<p>对过度发推趋势的反制</p>\n</blockquote>\n<p>如果A是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先写人们对过度发推的反应，把反对这种行为立为话题。</td>\n<td>先摆出一个现象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>接着说明过度发推造成的具体麻烦，解释为什么要反制它。</td>\n<td>再说为什么需要发生变化</td>\n</tr>\n<tr>\n<td>3</td>\n<td>用调查展示年轻人怎样抵制过度发推，例如降低关注或拒绝这一行为。</td>\n<td>接着把已有变化写具体</td>\n</tr>\n<tr>\n<td>4</td>\n<td>补充反制过度发推所带来的另一种结果。</td>\n<td>接着补上另一种结果</td>\n</tr>\n<tr>\n<td>5</td>\n<td>讨论每个人怎样对过度发推采取行动与承担责任。</td>\n<td>再把问题落到每个人身上</td>\n</tr>\n<tr>\n<td>6</td>\n<td>回到开头，明确支持反制过度发推这一趋势。</td>\n<td>最后收回来再作判断</td>\n</tr>\n</tbody>\n</table>\n<p>第一段和最后一段确实提到总统发推，所以A不是凭空出现的标题。但看中间的展开，第2段用Twitter和Facebook的调查谈的是新闻可信度；第3段写交叉核对来源、寻找不同观点；第5段还把责任放在读者的理解和分享选择上。这些事情不限于发推多不多，更不是减少发推次数的具体措施。若A是标题，中间几段需要持续说明怎样反对过度发推；实际作者持续说明怎样判断、核实与分享消息。开头的总统行为是观察这种判断变化的一个入口，不能反过来让这个入口包办全部内容。</p>\n<p><strong>只把标题定为反制过度发推，能覆盖中间核实来源、辨别真假与审慎分享的展开吗？</strong></p>\n<p>不能。它抓住首尾的一个现象，却把中间持续讨论的新闻判断技能缩掉了。</p>\n<p>标题要能带着读完整篇，而不只是找出首尾重复的人物行为。A把用来引入与回扣的例子放大成全文目的。</p>\n<p><strong>判断：A排除。</strong></p>\n<h3>B. A Rise in Critical Skills for Sharing News Online</h3>\n<blockquote>\n<p>在线分享新闻所需批判性技能的提升</p>\n</blockquote>\n<p>如果B是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先从年轻人的一个新闻接收选择，引出判断新闻的能力问题。</td>\n<td>先摆出一个现象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>说明新闻环境为什么需要更强的判断技能。</td>\n<td>再说为什么需要发生变化</td>\n</tr>\n<tr>\n<td>3</td>\n<td>把技能提升落实到核实消息、核对来源和寻找不同看法。</td>\n<td>接着把已有变化写具体</td>\n</tr>\n<tr>\n<td>4</td>\n<td>补充这种主动接触、查证消息可能带来的另一种效果。</td>\n<td>接着补上另一种结果</td>\n</tr>\n<tr>\n<td>5</td>\n<td>将判断技能继续落实到个人理解新闻和选择分享的责任。</td>\n<td>再把问题落到每个人身上</td>\n</tr>\n<tr>\n<td>6</td>\n<td>用开头的现象再次说明思考技能与分享选择上的变化。</td>\n<td>最后收回来再作判断</td>\n</tr>\n</tbody>\n</table>\n<p>B的A Rise说一种提升，第3段indeed becoming more skillful直接表现了这种变化；Critical Skills不是逢新闻必反对，而是能够区分事实与虚构、核对来源并接触相反观点。for Sharing News Online又把能力放在网上接收、处理和转发新闻的环境中，能接到第5段的reader error与the choice to share news，也能接到末段when to share。第2段给出为什么需要这种能力，第3段给出已有做法，第5段说明每个人为什么要在分享时承担责任。首尾的总统例子放在这个标题下，正好成为判断能力变化的表现，不必把全文改成对某一个人的专项批评。</p>\n<p><strong>以在线分享新闻时的判断技能提升作标题，能把需要、具体做法、个人责任和首尾现象连在一起吗？</strong></p>\n<p>能。各段都能在这个标题下保留自己原本的作用。</p>\n<p>B没有把谨慎判断读成对平台全盘不信任，也没有把主动查证读成互相盲信。它既涵盖技能变得更好的方向，也涵盖这些技能被用于分享新闻的场景。</p>\n<p><strong>判断：B保留。</strong></p>\n<h3>C. The Accumulation of Mutual Trust on Social Media</h3>\n<blockquote>\n<p>社交媒体上相互信任的积累</p>\n</blockquote>\n<p>如果C是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先从一项调查展示社交媒体上人与人的信任正在积累。</td>\n<td>先摆出一个现象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>解释为何人们需要并开始建立更多相互信任。</td>\n<td>再说为什么需要发生变化</td>\n</tr>\n<tr>\n<td>3</td>\n<td>用年轻人的行为展示他们怎样逐步更相信彼此。</td>\n<td>接着把已有变化写具体</td>\n</tr>\n<tr>\n<td>4</td>\n<td>补充相互信任积累带来的另一种结果。</td>\n<td>接着补上另一种结果</td>\n</tr>\n<tr>\n<td>5</td>\n<td>说明每个用户怎样促进彼此信任的增长。</td>\n<td>再把问题落到每个人身上</td>\n</tr>\n<tr>\n<td>6</td>\n<td>回到开头，确认社交媒体上的互信不断增强。</td>\n<td>最后收回来再作判断</td>\n</tr>\n</tbody>\n</table>\n<p>C里的Trust会让人想到第3段“distributed trust”，但不能只在标题和原文之间配一个同词。第2段恰好说distrust has risen、很多用户rarely or never trust news，描写的并不是相互信任越来越多。第3段的做法也不是“因为相信对方，所以接受消息”，而是主动交叉核对不同来源，甚至寻找opposing viewpoints。第5段进一步提醒转发者可能误读，必须对自己的分享负责。C把核实消息时分散依赖来源的方法，改成社交媒体上互信积累的总体趋势；这样第2段的信任降低与第5段的误读风险就很难承接。</p>\n<p><strong>交叉核对不同来源、避免轻信消息，能够直接概括成社交媒体上的相互信任不断积累吗？</strong></p>\n<p>不能。核实新闻的方法不等于互信增长的趋势，前文还明确写了不信任增加。</p>\n<p>C既读错整体变化方向，又把“distributed trust”的具体用法扩成全文主线，无法让几项调查共同服务于这个标题。</p>\n<p><strong>判断：C排除。</strong></p>\n<h3>D. The Platforms for Projection of Personal Interests</h3>\n<blockquote>\n<p>展示个人兴趣的平台</p>\n</blockquote>\n<p>如果D是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先介绍一种可以展示个人兴趣的平台。</td>\n<td>先摆出一个现象</td>\n</tr>\n<tr>\n<td>2</td>\n<td>解释人们为什么需要这样的平台及平台的发展背景。</td>\n<td>再说为什么需要发生变化</td>\n</tr>\n<tr>\n<td>3</td>\n<td>写年轻人在平台上怎样展示各自兴趣。</td>\n<td>接着把已有变化写具体</td>\n</tr>\n<tr>\n<td>4</td>\n<td>补充兴趣展示带来的另一种结果。</td>\n<td>接着补上另一种结果</td>\n</tr>\n<tr>\n<td>5</td>\n<td>说明用户怎样通过分享来呈现自己的兴趣和价值观。</td>\n<td>再把问题落到每个人身上</td>\n</tr>\n<tr>\n<td>6</td>\n<td>最后确认平台作为兴趣展示工具的意义。</td>\n<td>最后收回来再作判断</td>\n</tr>\n</tbody>\n</table>\n<p>D最接近第5段开头values and interests，但那只是说明人们为什么会重新分享消息的一层背景。紧接着作者不是分类介绍兴趣平台，也不是评价平台哪一种展示功能最好，而是谈用户传递信息时的角色，再用Barna调查解释reader error。往前看，第2段的假新闻、第3段的核实来源，都在问消息是否可靠，不在问个人爱好怎样呈现。D把一段中的分享动机拿来覆盖全文，还把题目写成介绍平台的文章；这样年轻人越来越擅长辨别真假的变化就从标题中消失了。</p>\n<p><strong>第5段提到兴趣与价值观，就足以让整篇变成介绍个人兴趣展示平台的文章吗？</strong></p>\n<p>不够。该处只是分享行为的一个背景，后面的重点仍是判断新闻和对转发负责。</p>\n<p>D保留了社交媒体，却丢掉“怎样判断新闻”这一贯穿内容，用局部动机替代全文讨论的能力变化。</p>\n<p><strong>判断：D排除。</strong></p>\n<h3>30题主旨结果</h3>\n<p>四项与全文的展开逐段比较后，B能够保留文章最后落实的判断。</p>\n<blockquote>\n<p><strong>30题选B。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>A Rise in Critical Skills for Sharing News Online / 在线分享新闻所需批判性技能的提升</strong></p>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保30题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查28题：B还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>B. verify news by referring to diverse sources</li>\n<li>C. have a strong sense of social <span class=\"mask\">[xxx]</span></li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>A Rise in Critical Skills for Sharing News Online / 在线分享新闻所需批判性技能的提升</strong></p>\n</blockquote>\n<p>也就是：这篇文章把不同调查放在一起，主要在写年轻人判断、核实和分享新闻时所用的技能，而不是给他们所有与社会有关的品质作一张总评。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>B说Knight Foundation调查中的年轻人参考多种来源来核实新闻；C说这些年轻人具有很强的社会 <span class=\"mask\">[xxx]</span> 意识。B是一项具体的新闻核实做法，C是一种尚未完整读清的概括性品质。</p>\n<p>第一遍没有拉开，是因为原文一边写cross-check sources，另一边又写personal responsibility和主动学习。B的行为很明确；C后面的名词没读清，不能仅凭personal与social不同就断言二者完全冲突，也不能擅自把那一处补成一个熟词。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看B。底牌强调的是Critical Skills以及Sharing News。交叉核对多个来源，正是让人不把单一渠道当成全部事实的核实技能；原句to verify stories又明确给出目的。因此B既回答了这项调查发现的具体做法，也给全文的技能提升提供了一个可以落到动作上的例子。它的“多来源”不是凭标题猜的，而是由已经读过的cross-check sources支持，再由主旨说明为什么作者要写这项做法。</p>\n<p>再看C。原句确实说年轻人主动承担自我学习的责任，但for后面具体接的是educating themselves和seeking out opposing viewpoints。放回主旨，这些行为是在帮助说明他们怎样审慎判断消息，不能只因为一个行为具有主动性，就把整项调查概括为某种强烈的社会品质。C还需要说明它那种社会意识究竟怎样等同于核实新闻的技能；现在仅靠social和“很强”没有把这层联系接出来。</p>\n<p>两项再比较，B是局部明确写出的核实动作，也是全文技能主线中需要的一个环节；C仍停在一种尚未说明具体内容的宽泛评价。这里选择B，不是把C的 <span class=\"mask\">[xxx]</span> 认出来了，而是B同时得到调查原句与全文讨论方向的支持，C不能替代这个已明确的发现。</p>\n<blockquote>\n<p><strong>28题选B。</strong></p>\n</blockquote>\n<h2>最终答案：</h2>\n<ul>\n<li><strong>26题：D</strong> — social media as a reliable source of news（作为可靠新闻来源的社交媒体）</li>\n<li><strong>27题：C</strong> — sharpen（磨炼；提高）</li>\n<li><strong>28题：B</strong> — verify news by referring to diverse sources（通过参考多种来源来核实新闻）</li>\n<li><strong>29题：A</strong> — readers’ misinterpretation（读者的误读）</li>\n<li><strong>30题：B</strong> — A Rise in Critical Skills for Sharing News Online（在线分享新闻所需批判性技能的提升）</li>\n</ul>\n<p>本篇答案：<strong>DCBAB</strong>。</p>\n","analysisStartIndex":34,"maskInventory":{"token":"[xxx]","count":135},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"maskAdjustmentState":"not_needed","mainIdeaQid":"30","ordinaryFirstRoundCandidates":{"26":["D"],"27":["C"],"28":["B","C"],"29":["A"]}},"questionOptionFlowVersion":"question_scope_whole_paragraph_then_option_compare_v3",
