s will benefit patients and save lives. What matters is that they will belong to a private monopoly which developed them using public resources.</p>\n</blockquote>\n<p>belong to a private monopoly中的they接前面的algorithms，作者担心用公共资源开发出的成果最后归一家私人垄断企业。A的monopoly of big data不是说技术没有医疗作用，而是把数据及其处理成果带来的控制权归属概括出来。What matters把重点明确放在“归私人垄断者所有”，与前面“仅仅说能救人还不够”形成递进。因此A能回答为什么一项可能有益的合作仍值得担心：公共资源产生的价值和力量可能被科技巨头掌握。</p>\n<p>两者抓住的对象都是私人企业掌握的数据价值与权力。</p>\n<p><strong>作者在What matters后面紧接私人垄断企业的归属问题，是否把真正担忧落在了垄断控制上？</strong></p>\n<p>可以这样判断。担心的不只是眼前有没有医疗收益，还包括这些成果最终归谁拥有。</p>\n<p>A保留了企业、数据及价值归属之间的关系，没有把“有益”与“存在垄断风险”当成互相排斥的两件事。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[221.667,1731.667,1333.333,498.333]],"questionRects":[[248.333,1430.0,1333.333,115.0],[315.0,1566.667,713.333,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的monopoly of big data说大数据由少数科技企业独占，原文belong to a private monopoly说开发出的东西将属于私人垄断企业；两者都涉及归谁控制，因此回看What matters后面的完整句。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"belong to a private monopoly","visibleOptionAnchor":"monopoly of big data"}}}},{"section":"34题","raw":"### B. the **[xxx]** rivalry among big pharmas\n\n> 大型制药企业之间 **[xxx]** 的竞争\n\n把B接回题干，它说的是：这项合作真正令人担忧的是，大型制药企业彼此展开 **[xxx]** 的竞争。\n\nB的rivalry among big pharmas让人想到末段big pharma，但原句big data may be expected to behave as big pharma has done是在作类比，因此回看被说明的一方到底是谁。\n\n> If software promises to save lives on the scale that drugs now can, big data may be expected to behave as big pharma has done.\n\nbig data may be expected to behave as big pharma has done把大数据企业的未来行为，与大型制药企业已经有过的做法相类比。句子的主要对象仍是big data，big pharma是拿来帮助理解的一方。B的rivalry among big pharmas却将主题改成制药公司之间的竞争，among还添了企业互相竞争的关系。前面的形容词不清楚，也改变不了对象已经从数据企业移到制药企业、类比已经变成内部竞争这两件事。药物能救人只是引出类似力量的一座桥，不是说这项医疗数据协议会令制药公司相互争斗。\n\n**作者拿制药企业作类比，是否就把真正担忧改成制药企业之间的竞争了？**\n\n不是。类比用来说明大数据一方，而不是把制药业竞争改成这项合作的核心问题。\n\nB把帮助说明问题的另一行业拿来当问题本身，又增加企业之间的竞争，主体与关系都移动了。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. the <span class=\"mask\">[xxx]</span> rivalry among big pharmas</h3>\n<blockquote>\n<p>大型制药企业之间 <span class=\"mask\">[xxx]</span> 的竞争</p>\n</blockquote>\n<p>把B接回题干，它说的是：这项合作真正令人担忧的是，大型制药企业彼此展开 <span class=\"mask\">[xxx]</span> 的竞争。</p>\n<p>B的rivalry among big pharmas让人想到末段big pharma，但原句big data may be expected to behave as big pharma has done是在作类比，因此回看被说明的一方到底是谁。</p>\n<blockquote>\n<p>If software promises to save lives on the scale that drugs now can, big data may be expected to behave as big pharma has done.</p>\n</blockquote>\n<p>big data may be expected to behave as big pharma has done把大数据企业的未来行为，与大型制药企业已经有过的做法相类比。句子的主要对象仍是big data，big pharma是拿来帮助理解的一方。B的rivalry among big pharmas却将主题改成制药公司之间的竞争，among还添了企业互相竞争的关系。前面的形容词不清楚，也改变不了对象已经从数据企业移到制药企业、类比已经变成内部竞争这两件事。药物能救人只是引出类似力量的一座桥，不是说这项医疗数据协议会令制药公司相互争斗。</p>\n<p><strong>作者拿制药企业作类比，是否就把真正担忧改成制药企业之间的竞争了？</strong></p>\n<p>不是。类比用来说明大数据一方，而不是把制药业竞争改成这项合作的核心问题。</p>\n<p>B把帮助说明问题的另一行业拿来当问题本身，又增加企业之间的竞争，主体与关系都移动了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[221.667,1731.667,1333.333,498.333]],"questionRects":[[248.333,1430.0,1333.333,115.0],[315.0,1635.0,685.0,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的rivalry among big pharmas让人想到末段big pharma，但原句big data may be expected to behave as big pharma has done是在作类比，因此回看被说明的一方到底是谁。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"big data may be expected to behave as big pharma has done","visibleOptionAnchor":"rivalry among big pharmas"}}}},{"section":"34题","raw":"### C. the uncontrolled use of new software\n\n> 新软件不受控制的使用\n\n把C接回题干，它说的是：这项合作真正令人担忧的是，新软件被不加控制地使用。\n\nC的uncontrolled use谈软件使用是否受到约束，原文belong to a private monopoly谈软件成果归谁拥有；它们都涉及软件，因此回看作者在What matters后究竟强调哪一层。\n\n> It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives. What matters is that they will belong to a private monopoly which developed them using public resources.\n\nbelong to a private monopoly指出的是所有权集中：用公共资源开发，却归私人垄断企业。C的uncontrolled use改成软件使用没有受到控制，好像作者担心大家任意部署、无人限制使用。两者不一样，甚至“某家企业牢牢控制资源与成果”并不等于“成果被所有人随意使用”。作者也没有否认算法benefit patients and save lives，而是认为有益还不足以回答归属问题。把担忧改成失控使用，会让What matters后面的private monopoly和public resources这一组对照失去着落。\n\n**公共资源开发的成果归私人垄断企业，等于作者在说软件的使用不受任何控制吗？**\n\n不等于。一个问权力与成果归谁，一个问使用有没有约束。\n\nC抓住了软件，却换掉了作者明确指出的所有权问题，不能把各种可能的软件风险都归进这里的real worry。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. the uncontrolled use of new software</h3>\n<blockquote>\n<p>新软件不受控制的使用</p>\n</blockquote>\n<p>把C接回题干，它说的是：这项合作真正令人担忧的是，新软件被不加控制地使用。</p>\n<p>C的uncontrolled use谈软件使用是否受到约束，原文belong to a private monopoly谈软件成果归谁拥有；它们都涉及软件，因此回看作者在What matters后究竟强调哪一层。</p>\n<blockquote>\n<p>It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives. What matters is that they will belong to a private monopoly which developed them using public resources.</p>\n</blockquote>\n<p>belong to a private monopoly指出的是所有权集中：用公共资源开发，却归私人垄断企业。C的uncontrolled use改成软件使用没有受到控制，好像作者担心大家任意部署、无人限制使用。两者不一样，甚至“某家企业牢牢控制资源与成果”并不等于“成果被所有人随意使用”。作者也没有否认算法benefit patients and save lives，而是认为有益还不足以回答归属问题。把担忧改成失控使用，会让What matters后面的private monopoly和public resources这一组对照失去着落。</p>\n<p><strong>公共资源开发的成果归私人垄断企业，等于作者在说软件的使用不受任何控制吗？</strong></p>\n<p>不等于。一个问权力与成果归谁，一个问使用有没有约束。</p>\n<p>C抓住了软件，却换掉了作者明确指出的所有权问题，不能把各种可能的软件风险都归进这里的real worry。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[221.667,1731.667,1333.333,498.333]],"questionRects":[[248.333,1430.0,1333.333,115.0],[315.0,1701.667,661.667,41.667]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的uncontrolled use谈软件使用是否受到约束，原文belong to a private monopoly谈软件成果归谁拥有；它们都涉及软件，因此回看作者在What matters后究竟强调哪一层。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"belong to a private monopoly","visibleOptionAnchor":"uncontrolled use"}}}},{"section":"34题","raw":"### D. the ineffective enforcement of privacy law\n\n> 隐私法执行无效\n\n把D接回题干，它说的是：这项合作真正令人担忧的是，现有隐私法没有得到有效执行。\n\nD的ineffective enforcement说法律执行不起作用，原文does not address the real worry说这种做法没触及真正担忧；都谈当前处理的不足，因此回看后一句把不足具体落到哪里。\n\n> The use of privacy law to **[xxx]** the tech giants in this instance feels slightly **[xxx]**. This practice does not address the real worry.\n\n> What matters is that they will belong to a private monopoly which developed them using public resources.\n\ndoes not address the real worry不是直接说“法律条文已经对准问题，只是执行太差”，而是紧接着另提What matters，把真正要讨论的东西放在公共资源开发的成果属于私人垄断者。D的ineffective enforcement却让人把原因继续理解成原有隐私法律执行得不够好。执行强弱与处理角度是否触及更深的问题不同：即便患者许可等隐私事项按要求处理，成果和权力由谁掌握的问题仍需要回答。D把作者往深一层追问的方向，又拉回眼前的执行成效。\n\n**作者认为隐私法这一处理没有触及更深的归属问题，就等于他只是在批评执法不力吗？**\n\n不等于。后文明确提出的是另外一层的垄断与归属，而不是给原有执法力度打分。\n\nD把“没有解决真正担忧”缩成“执行效果不好”，遗漏了What matters后作者亲自指出的问题对象。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. the ineffective enforcement of privacy law</h3>\n<blockquote>\n<p>隐私法执行无效</p>\n</blockquote>\n<p>把D接回题干，它说的是：这项合作真正令人担忧的是，现有隐私法没有得到有效执行。</p>\n<p>D的ineffective enforcement说法律执行不起作用，原文does not address the real worry说这种做法没触及真正担忧；都谈当前处理的不足，因此回看后一句把不足具体落到哪里。</p>\n<blockquote>\n<p>The use of privacy law to <span class=\"mask\">[xxx]</span> the tech giants in this instance feels slightly <span class=\"mask\">[xxx]</span>. This practice does not address the real worry.</p>\n</blockquote>\n<blockquote>\n<p>What matters is that they will belong to a private monopoly which developed them using public resources.</p>\n</blockquote>\n<p>does not address the real worry不是直接说“法律条文已经对准问题，只是执行太差”，而是紧接着另提What matters，把真正要讨论的东西放在公共资源开发的成果属于私人垄断者。D的ineffective enforcement却让人把原因继续理解成原有隐私法律执行得不够好。执行强弱与处理角度是否触及更深的问题不同：即便患者许可等隐私事项按要求处理，成果和权力由谁掌握的问题仍需要回答。D把作者往深一层追问的方向，又拉回眼前的执行成效。</p>\n<p><strong>作者认为隐私法这一处理没有触及更深的归属问题，就等于他只是在批评执法不力吗？</strong></p>\n<p>不等于。后文明确提出的是另外一层的垄断与归属，而不是给原有执法力度打分。</p>\n<p>D把“没有解决真正担忧”缩成“执行效果不好”，遗漏了What matters后作者亲自指出的问题对象。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[221.667,1731.667,1333.333,498.333]],"questionRects":[[248.333,1430.0,1333.333,115.0],[316.667,1770.0,750.0,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"34","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的ineffective enforcement说法律执行不起作用，原文does not address the real worry说这种做法没触及真正担忧；都谈当前处理的不足，因此回看后一句把不足具体落到哪里。"],"evidenceParagraphPids":[3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"does not address the real worry","visibleOptionAnchor":"ineffective enforcement"}}}},{"section":"34题","raw":"### 34题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\nWhat matters后面明确落到private monopoly与public resources的归属对照。A接住这一点；B移到制药企业竞争，C换成软件失控使用，D停在隐私法执行。\n\n> **34题选A。**","contextRaw":"","html":"<h3>34题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>What matters后面明确落到private monopoly与public resources的归属对照。A接住这一点；B移到制药企业竞争，C换成软件失控使用，D停在隐私法执行。</p>\n<blockquote>\n<p><strong>34题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[248.333,1430.0,1333.333,115.0]],"scrollTarget":"auto","meta":{"kind":"result","qid":"34"}},{"section":"35题","raw":"## 35题\n\n**The author’s attitude toward the application of AI to healthcare is ______.**\n\n作者对把人工智能应用于医疗持什么态度？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **ambiguous**\n\n含糊不清的\n\nB. **appreciative**\n\n赞赏的\n\nC. **cautious**\n\n谨慎的\n\nD. **contemptuous**\n\n轻蔑的","contextRaw":"","html":"<h2>35题</h2>\n<p><strong>The author’s attitude toward the application of AI to healthcare is ______.</strong></p>\n<p>作者对把人工智能应用于医疗持什么态度？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>ambiguous</strong></p>\n<p>含糊不清的</p>\n<p>B. <strong>appreciative</strong></p>\n<p>赞赏的</p>\n<p>C. <strong>cautious</strong></p>\n<p>谨慎的</p>\n<p>D. <strong>contemptuous</strong></p>\n<p>轻蔑的</p>\n","articleRects":[],"questionRects":[[248.333,1906.667,1281.667,48.333],[308.333,1975.0,235.0,48.333],[310.0,2041.667,251.667,48.333],[308.333,2110.0,191.667,40.0],[308.333,2178.333,281.667,48.333]],"scrollTarget":"auto","meta":{"kind":"main_overview","qid":"35"}},{"section":"35题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。 | 先承认一面再摆出另一面 |\n| 2 | 写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。 | 再说事情不止眼前这一层 |\n| 3 | 进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。 | 接着追问更深一层的问题 |\n| 4 | 指出仅用隐私法处理没有触及真正担忧：公共资源开发的成果归私人垄断企业；最后强调长期应对，同时肯定报告是可喜的开始。 | 最后说清担心并留下出路 |","contextRaw":"","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。</td>\n<td>先承认一面再摆出另一面</td>\n</tr>\n<tr>\n<td>2</td>\n<td>写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。</td>\n<td>再说事情不止眼前这一层</td>\n</tr>\n<tr>\n<td>3</td>\n<td>进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。</td>\n<td>接着追问更深一层的问题</td>\n</tr>\n<tr>\n<td>4</td>\n<td>指出仅用隐私法处理没有触及真正担忧：公共资源开发的成果归私人垄断企业；最后强调长期应对，同时肯定报告是可喜的开始。</td>\n<td>最后说清担心并留下出路</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[[221.667,326.667,1333.333,555.0],[221.667,888.333,1333.333,546.667],[221.667,1450.0,1333.333,273.333],[221.667,1731.667,1333.333,498.333]],"questionRects":[[248.333,1906.667,1281.667,48.333]],"scrollTarget":"auto","meta":{"kind":"main_method","qid":"35","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"35题","raw":"### A. ambiguous\n\n> 含糊不清的\n\n如果A是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 同时写好处与坏处，但两边写完仍不说明怎样看待。 | 先承认一面再摆出另一面 |\n| 2 | 继续提出各种不同角度，不判断何者更重要。 | 再说事情不止眼前这一层 |\n| 3 | 抛出谁受益的问题，但不表明问题意味着什么。 | 接着追问更深一层的问题 |\n| 4 | 最后仍无法看清作者赞成什么、担忧什么。 | 最后说清担心并留下出路 |\n\nA的ambiguous不是“文章出现了两面”，而是读完仍不知道作者的态度。实际第1段把善意和医疗潜力说得明确，也把权力集中写成需要关注的风险；第2段又明说隐私不是最重要角度；末段用What matters指向私人垄断问题，并以a long struggle will be needed和welcome start表明需要继续应对、同时肯定这一步。这些并非互相打架而让人无法判断，而是在不同层面分别作出清楚评价。不能看到作者既有肯定又有担忧，就把有层次的态度误判成含糊。\n\n**作者明确承认潜力，又明确指出垄断风险和应对方向，还能说其态度含糊不清吗？**\n\n不能。不同层面的判断都很清楚，不是没有立场。\n\nA要求全文写完仍无法落点，但实际作者不断用not the most important、What matters和末段收束区分轻重，立场是可以读出来的。\n\n**判断：A排除。**","contextRaw":"","html":"<h3>A. ambiguous</h3>\n<blockquote>\n<p>含糊不清的</p>\n</blockquote>\n<p>如果A是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>同时写好处与坏处，但两边写完仍不说明怎样看待。</td>\n<td>先承认一面再摆出另一面</td>\n</tr>\n<tr>\n<td>2</td>\n<td>继续提出各种不同角度，不判断何者更重要。</td>\n<td>再说事情不止眼前这一层</td>\n</tr>\n<tr>\n<td>3</td>\n<td>抛出谁受益的问题，但不表明问题意味着什么。</td>\n<td>接着追问更深一层的问题</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后仍无法看清作者赞成什么、担忧什么。</td>\n<td>最后说清担心并留下出路</td>\n</tr>\n</tbody>\n</table>\n<p>A的ambiguous不是“文章出现了两面”，而是读完仍不知道作者的态度。实际第1段把善意和医疗潜力说得明确，也把权力集中写成需要关注的风险；第2段又明说隐私不是最重要角度；末段用What matters指向私人垄断问题，并以a long struggle will be needed和welcome start表明需要继续应对、同时肯定这一步。这些并非互相打架而让人无法判断，而是在不同层面分别作出清楚评价。不能看到作者既有肯定又有担忧，就把有层次的态度误判成含糊。</p>\n<p><strong>作者明确承认潜力，又明确指出垄断风险和应对方向，还能说其态度含糊不清吗？</strong></p>\n<p>不能。不同层面的判断都很清楚，不是没有立场。</p>\n<p>A要求全文写完仍无法落点，但实际作者不断用not the most important、What matters和末段收束区分轻重，立场是可以读出来的。</p>\n<p><strong>判断：A排除。</strong></p>\n","articleRects":[[221.667,326.667,1333.333,555.0],[221.667,888.333,1333.333,546.667],[221.667,1450.0,1333.333,273.333],[221.667,1731.667,1333.333,498.333]],"questionRects":[[248.333,1906.667,1281.667,48.333],[308.333,1975.0,235.0,48.333]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"A"}},{"section":"35题","raw":"### B. appreciative\n\n> 赞赏的\n\n如果B是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先肯定医疗潜力，再把可能的问题作为较小的附带提醒。 | 先承认一面再摆出另一面 |\n| 2 | 写问题得到处理，主要赞赏这类医疗应用的进展。 | 再说事情不止眼前这一层 |\n| 3 | 追问数据受益对象，并以受益广泛来加强赞赏。 | 接着追问更深一层的问题 |\n| 4 | 最后把潜力和问题处理合在一起，整体落在对应用的欣赏。 | 最后说清担心并留下出路 |\n\nB的appreciative能接上首段very great，却很难容纳随后那么多篇幅。作者并没有写“许可补齐以后，这类应用就值得充分赞扬”，而是继续说privacy甚至不是最重要的角度，再追问谁从数据分析中获益。末段还特意说It is not enough to say…benefit patients and save lives，意思是只凭能让患者受益并不能结束讨论。最后的welcome start肯定的是Denham报告这一开始，不是将所有人工智能医疗应用整体称为令人欣赏。B把一面的好处与对报告的一点评价，拿来代替了对应用整体的态度。\n\n**开头承认医疗潜力很大，是否足以抹掉后面对归属与垄断风险的持续追问，整体选赞赏？**\n\n不足以。作者明确说只讲好处还不够，后面讨论的正是为什么不能停在赞赏上。\n\nB能接住局部肯定，却接不住全文重点所在的保留与警惕，评价范围也把对报告的肯定混成对应用的整体赞赏。\n\n**判断：B排除。**","contextRaw":"","html":"<h3>B. appreciative</h3>\n<blockquote>\n<p>赞赏的</p>\n</blockquote>\n<p>如果B是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先肯定医疗潜力，再把可能的问题作为较小的附带提醒。</td>\n<td>先承认一面再摆出另一面</td>\n</tr>\n<tr>\n<td>2</td>\n<td>写问题得到处理，主要赞赏这类医疗应用的进展。</td>\n<td>再说事情不止眼前这一层</td>\n</tr>\n<tr>\n<td>3</td>\n<td>追问数据受益对象，并以受益广泛来加强赞赏。</td>\n<td>接着追问更深一层的问题</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后把潜力和问题处理合在一起，整体落在对应用的欣赏。</td>\n<td>最后说清担心并留下出路</td>\n</tr>\n</tbody>\n</table>\n<p>B的appreciative能接上首段very great，却很难容纳随后那么多篇幅。作者并没有写“许可补齐以后，这类应用就值得充分赞扬”，而是继续说privacy甚至不是最重要的角度，再追问谁从数据分析中获益。末段还特意说It is not enough to say…benefit patients and save lives，意思是只凭能让患者受益并不能结束讨论。最后的welcome start肯定的是Denham报告这一开始，不是将所有人工智能医疗应用整体称为令人欣赏。B把一面的好处与对报告的一点评价，拿来代替了对应用整体的态度。</p>\n<p><strong>开头承认医疗潜力很大，是否足以抹掉后面对归属与垄断风险的持续追问，整体选赞赏？</strong></p>\n<p>不足以。作者明确说只讲好处还不够，后面讨论的正是为什么不能停在赞赏上。</p>\n<p>B能接住局部肯定，却接不住全文重点所在的保留与警惕，评价范围也把对报告的肯定混成对应用的整体赞赏。</p>\n<p><strong>判断：B排除。</strong></p>\n","articleRects":[[221.667,326.667,1333.333,555.0],[221.667,888.333,1333.333,546.667],[221.667,1450.0,1333.333,273.333],[221.667,1731.667,1333.333,498.333]],"questionRects":[[248.333,1906.667,1281.667,48.333],[310.0,2041.667,251.667,48.333]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"B"}},{"section":"35题","raw":"### C. cautious\n\n> 谨慎的\n\n如果C是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先承认善意与益处，再提醒可能的另一面。 | 先承认一面再摆出另一面 |\n| 2 | 说明眼前的处理有必要，却不足以消除其他问题。 | 再说事情不止眼前这一层 |\n| 3 | 继续追问更深的价值和受益归属，防止只看单一好处。 | 接着追问更深一层的问题 |\n| 4 | 把长期风险与应对需要写明，既不草率放行，也不否认有益进展。 | 最后说清担心并留下出路 |\n\nC的cautious可以同时容纳首段的两面：潜力很大，但可能让权力更集中。第2段不是否认隐私处理，而是认为还要看数据怎样产生价值；第3段再把问题推到谁应受益；末段则具体落在公共资源与私人垄断的归属冲突。末尾说报告是welcome start，说明作者仍认可改善的可能，并不主张把技术全部丢掉。这样的写法不是一味夸赞，也不是轻蔑技术，而是在承认益处的同时要求认真看待条件、权力和长期后果。\n\n**承认人工智能医疗有很大潜力，同时持续追问风险、归属和长期应对，是谨慎态度吗？**\n\n是的。肯定潜力并未取消风险，警惕风险也未变成否认全部价值。\n\nC能让四段都保留实际作用：先承认、再深入、再追问、最后提出需要继续应对并肯定起点。它不需要删去任何一面的判断。\n\n**判断：C保留。**","contextRaw":"","html":"<h3>C. cautious</h3>\n<blockquote>\n<p>谨慎的</p>\n</blockquote>\n<p>如果C是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先承认善意与益处，再提醒可能的另一面。</td>\n<td>先承认一面再摆出另一面</td>\n</tr>\n<tr>\n<td>2</td>\n<td>说明眼前的处理有必要，却不足以消除其他问题。</td>\n<td>再说事情不止眼前这一层</td>\n</tr>\n<tr>\n<td>3</td>\n<td>继续追问更深的价值和受益归属，防止只看单一好处。</td>\n<td>接着追问更深一层的问题</td>\n</tr>\n<tr>\n<td>4</td>\n<td>把长期风险与应对需要写明，既不草率放行，也不否认有益进展。</td>\n<td>最后说清担心并留下出路</td>\n</tr>\n</tbody>\n</table>\n<p>C的cautious可以同时容纳首段的两面：潜力很大，但可能让权力更集中。第2段不是否认隐私处理，而是认为还要看数据怎样产生价值；第3段再把问题推到谁应受益；末段则具体落在公共资源与私人垄断的归属冲突。末尾说报告是welcome start，说明作者仍认可改善的可能，并不主张把技术全部丢掉。这样的写法不是一味夸赞，也不是轻蔑技术，而是在承认益处的同时要求认真看待条件、权力和长期后果。</p>\n<p><strong>承认人工智能医疗有很大潜力，同时持续追问风险、归属和长期应对，是谨慎态度吗？</strong></p>\n<p>是的。肯定潜力并未取消风险，警惕风险也未变成否认全部价值。</p>\n<p>C能让四段都保留实际作用：先承认、再深入、再追问、最后提出需要继续应对并肯定起点。它不需要删去任何一面的判断。</p>\n<p><strong>判断：C保留。</strong></p>\n","articleRects":[[221.667,326.667,1333.333,555.0],[221.667,888.333,1333.333,546.667],[221.667,1450.0,1333.333,273.333],[221.667,1731.667,1333.333,498.333]],"questionRects":[[248.333,1906.667,1281.667,48.333],[308.333,2110.0,191.667,40.0]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"C"}},{"section":"35题","raw":"### D. contemptuous\n\n> 轻蔑的\n\n如果D是正确的全文判断，各段需要沿着下面的内容往下写。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 即使提到好处，也主要表现为轻视或嘲弄这种应用。 | 先承认一面再摆出另一面 |\n| 2 | 把相关处理都视为不值得认真看待。 | 再说事情不止眼前这一层 |\n| 3 | 以不屑的口吻否定数据分析价值或受益问题。 | 接着追问更深一层的问题 |\n| 4 | 最后落在对人工智能医疗应用的鄙视与否定。 | 最后说清担心并留下出路 |\n\nD的contemptuous是轻蔑、不屑，不只是发现风险。首段却认真承认both sides mean well和医疗潜力very great；第2、3段还细分控制、处理、数据比较与受益归属，说明作者把这些问题当作值得认真讨论的事情。末段既承认benefit patients and save lives，又肯定报告是一个好的开始。若是轻蔑，文章应让读者觉得这种应用不值得当回事；实际作者正因为看见其力量与潜力，才认为现在的小选择和未来的应对非常重要。\n\n**认真承认潜力、细究归属并肯定改善的起点，能整体读成对这种应用不屑一顾吗？**\n\n不能。这里的担心来自认真看待其影响，而非轻蔑地否认其价值。\n\nD把风险批评扩大成轻蔑，态度程度过强，也与首段的明确肯定及末段留下的出路冲突。\n\n**判断：D排除。**","contextRaw":"","html":"<h3>D. contemptuous</h3>\n<blockquote>\n<p>轻蔑的</p>\n</blockquote>\n<p>如果D是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>即使提到好处，也主要表现为轻视或嘲弄这种应用。</td>\n<td>先承认一面再摆出另一面</td>\n</tr>\n<tr>\n<td>2</td>\n<td>把相关处理都视为不值得认真看待。</td>\n<td>再说事情不止眼前这一层</td>\n</tr>\n<tr>\n<td>3</td>\n<td>以不屑的口吻否定数据分析价值或受益问题。</td>\n<td>接着追问更深一层的问题</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后落在对人工智能医疗应用的鄙视与否定。</td>\n<td>最后说清担心并留下出路</td>\n</tr>\n</tbody>\n</table>\n<p>D的contemptuous是轻蔑、不屑，不只是发现风险。首段却认真承认both sides mean well和医疗潜力very great；第2、3段还细分控制、处理、数据比较与受益归属，说明作者把这些问题当作值得认真讨论的事情。末段既承认benefit patients and save lives，又肯定报告是一个好的开始。若是轻蔑，文章应让读者觉得这种应用不值得当回事；实际作者正因为看见其力量与潜力，才认为现在的小选择和未来的应对非常重要。</p>\n<p><strong>认真承认潜力、细究归属并肯定改善的起点，能整体读成对这种应用不屑一顾吗？</strong></p>\n<p>不能。这里的担心来自认真看待其影响，而非轻蔑地否认其价值。</p>\n<p>D把风险批评扩大成轻蔑，态度程度过强，也与首段的明确肯定及末段留下的出路冲突。</p>\n<p><strong>判断：D排除。</strong></p>\n","articleRects":[[221.667,326.667,1333.333,555.0],[221.667,888.333,1333.333,546.667],[221.667,1450.0,1333.333,273.333],[221.667,1731.667,1333.333,498.333]],"questionRects":[[248.333,1906.667,1281.667,48.333],[308.333,2178.333,281.667,48.333]],"scrollTarget":"auto","meta":{"kind":"main_option","qid":"35","option":"D"}},{"section":"35题","raw":"### 35题主旨结果\n\n四项与全文的展开逐段比较后，C能够保留文章最后落实的判断。\n\n> **35题选C。**\n\n这句话就是本文后续做题的主旨底牌：\n\n**cautious / 谨慎的**","contextRaw":"","html":"<h3>35题主旨结果</h3>\n<p>四项与全文的展开逐段比较后，C能够保留文章最后落实的判断。</p>\n<blockquote>\n<p><strong>35题选C。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>cautious / 谨慎的</strong></p>\n","articleRects":[],"questionRects":[[248.333,1906.667,1281.667,48.333],[308.333,2110.0,191.667,40.0]],"scrollTarget":"auto","meta":{"kind":"main_result","qid":"35"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","contextRaw":"","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查31题：A还是C？\n\n第一遍留下：\n\n- A. It fell short of the **[xxx]**’s expectations.\n- C. It failed to pay due attention to patients’ rights.\n\n主旨底牌是：\n\n> **cautious / 谨慎的**\n\n也就是：作者承认人工智能用于医疗有很大潜力，同时并不因此放过患者权益、数据价值和权力归属带来的问题。谨慎不是不肯表态，而是不能只凭好处就忽略这些条件。\n\n我们先把题干和两个选项接起来。\n\nA说NHS与DeepMind的协议未达到 **[xxx]** 的期待；C说协议未给患者权利应有的重视。前者围绕某一方是否如愿，后者明确围绕患者权利有没有被妥善对待。\n\n第一遍留下A，是因为原文末句也有expectations，far too little又与未达到相近，但A的所属者没读清。C则能直接和the patients’ rights接上。那时不能擅自给A补一个主体，再据这个自填的主体说它错了。\n\n现在拿主旨来检查。\n\n先看C。谨慎的态度在首段怎样落地？作者先肯定双方意图和医疗潜力，随后转到权力集中，再说协议对患者权利与隐私期待考虑得太少。C正好回答，在承认潜力之后仍然需要审慎对待的一个具体问题是什么。它既有局部took far too little account of the patients’ rights的直接支持，也能解释为什么这项不足会出现在作者提醒风险的段落里。\n\n再看A。某一方的期待没有实现，只能先说明它没有如愿；要让这个说法承担首段的风险提醒，还必须把“谁的期待”以及“期待的内容”接回患者权利。单凭fell short和expectations两个相近词，不能完成这一步。全文的谨慎不是对所有未满足期待的泛泛同情，更不是把合作是否达到各方愿望当作评价技术应用的全部尺度；它对患者权益与成果归属有具体关注。\n\n这样再比较，C把原文明确指出的权利问题保留下来，也能接住主旨为何要在肯定潜力后保留警惕；A仍缺少所属者与这层具体关注之间的连接。我们选已有两层支持的C，不把A的 **[xxx]** 改写成任何一个人或机构，也不靠猜出那个词来收尾。\n\n> **31题选C。**","contextRaw":"","html":"<h2>回查31题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. It fell short of the <span class=\"mask\">[xxx]</span>’s expectations.</li>\n<li>C. It failed to pay due attention to patients’ rights.</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>cautious / 谨慎的</strong></p>\n</blockquote>\n<p>也就是：作者承认人工智能用于医疗有很大潜力，同时并不因此放过患者权益、数据价值和权力归属带来的问题。谨慎不是不肯表态，而是不能只凭好处就忽略这些条件。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A说NHS与DeepMind的协议未达到 <span class=\"mask\">[xxx]</span> 的期待；C说协议未给患者权利应有的重视。前者围绕某一方是否如愿，后者明确围绕患者权利有没有被妥善对待。</p>\n<p>第一遍留下A，是因为原文末句也有expectations，far too little又与未达到相近，但A的所属者没读清。C则能直接和the patients’ rights接上。那时不能擅自给A补一个主体，再据这个自填的主体说它错了。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看C。谨慎的态度在首段怎样落地？作者先肯定双方意图和医疗潜力，随后转到权力集中，再说协议对患者权利与隐私期待考虑得太少。C正好回答，在承认潜力之后仍然需要审慎对待的一个具体问题是什么。它既有局部took far too little account of the patients’ rights的直接支持，也能解释为什么这项不足会出现在作者提醒风险的段落里。</p>\n<p>再看A。某一方的期待没有实现，只能先说明它没有如愿；要让这个说法承担首段的风险提醒，还必须把“谁的期待”以及“期待的内容”接回患者权利。单凭fell short和expectations两个相近词，不能完成这一步。全文的谨慎不是对所有未满足期待的泛泛同情，更不是把合作是否达到各方愿望当作评价技术应用的全部尺度；它对患者权益与成果归属有具体关注。</p>\n<p>这样再比较，C把原文明确指出的权利问题保留下来，也能接住主旨为何要在肯定潜力后保留警惕；A仍缺少所属者与这层具体关注之间的连接。我们选已有两层支持的C，不把A的 <span class=\"mask\">[xxx]</span> 改写成任何一个人或机构，也不靠猜出那个词来收尾。</p>\n<blockquote>\n<p><strong>31题选C。</strong></p>\n</blockquote>\n","articleRects":[[221.667,326.667,1333.333,555.0]],"questionRects":[[248.333,208.333,1125.0,48.333],[308.333,276.667,696.667,48.333],[308.333,411.667,831.667,48.333]],"scrollTarget":"auto","meta":{"kind":"review","qid":"31"}},{"section":"最终答案","raw":"## 最终答案：\n\n- **31题：C** — It failed to pay due attention to patients’ rights.（它未能充分关注患者的权利）\n- **32题：D** — necessary adjustments（必要的调整）\n- **33题：B** — the value of data comes from the processing of it（数据的价值来自对数据的处理）\n- **34题：A** — the monopoly of big data by tech giants（科技巨头对大数据的垄断）\n- **35题：C** — cautious（谨慎的）\n\n本篇答案：**CDBAC**。","contextRaw":"","html":"<h2>最终答案：</h2>\n<ul>\n<li><strong>31题：C</strong> — It failed to pay due attention to patients’ rights.（它未能充分关注患者的权利）</li>\n<li><strong>32题：D</strong> — necessary adjustments（必要的调整）</li>\n<li><strong>33题：B</strong> — the value of data comes from the processing of it（数据的价值来自对数据的处理）</li>\n<li><strong>34题：A</strong> — the monopoly of big data by tech giants（科技巨头对大数据的垄断）</li>\n<li><strong>35题：C</strong> — cautious（谨慎的）</li>\n</ul>\n<p>本篇答案：<strong>CDBAC</strong>。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"final"}}],"articleImage":"data:image/webp;base64,UklGRlZvBABXRUJQVlA4TElvBAAvCwd0AiU5bttIkiRv/lm7d9x7/CNiAvAfJh+X5JXHVMm2qDeAmXXWdwqOEhVXHBeAAuoiCfUSfIvqzLryzvGGOrPeYdav6DOOqvCocsxOdWYdJcAOrCvv1AWgxQ/Nu4sfCRT8Qdu27Gm2fXsSgru7u7u7EwGqEVwSgrvLbaEuaFKsXqyGu7s71CXFL2iaNnrpPnOdx3HO3H9ds+1n4IzovwRIkty26XOZmUWCD+akPwIPAAXi7z \n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>31题题干</h2>\n<p><strong>What is true of the agreement between the NHS and DeepMind?</strong></p>\n<blockquote>\n<p>关于NHS与DeepMind之间的协议，哪个说法是正确的？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<h2>32题题干</h2>\n<p><strong>The NHS trust responded to Denham’s verdict with ______.</strong></p>\n<blockquote>\n<p>NHS下属的这家机构如何回应Denham的裁定？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<h2>33题题干</h2>\n<p><strong>The author argues in Paragraph 2 that ______.</strong></p>\n<blockquote>\n<p>作者在第2段主张什么？</p>\n</blockquote>\n<p>题型：<strong>段落主旨题</strong>。</p>\n<h2>34题题干</h2>\n<p><strong>According to the last paragraph, the real worry arising from this deal is ______.</strong></p>\n<blockquote>\n<p>根据最后一段，这项合作带来的真正担忧是什么？</p>\n</blockquote>\n<p>题型：<strong>段落主旨题</strong>。</p>\n<h2>35题题干</h2>\n<p><strong>The author’s attitude toward the application of AI to healthcare is ______.</strong></p>\n<blockquote>\n<p>作者对把人工智能应用于医疗持什么态度？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>but, not, since, If</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\n<td>先抓个大概好坏</td>\n<td>mean well, very great, not enough</td>\n</tr>\n<tr>\n<td>动作词</td>\n<td>先看谁做了什么</td>\n<td>handed over, processed, benefit</td>\n</tr>\n<tr>\n<td>结果词</td>\n<td>看最后出了什么事</td>\n<td>value, power, consequences</td>\n</tr>\n<tr>\n<td>重复主题词</td>\n<td>大概知道老在说什么</td>\n<td>NHS, DeepMind, data, privacy</td>\n</tr>\n</tbody>\n</table>\n<p>Any <span class=\"mask\">[xxx]</span> assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by <span class=\"mask\">[xxx]</span> that both sides mean well. DeepMind is one of the leading artificial intelligence (AI) companies in the world. The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants. It is against that background that the information <span class=\"mask\">[xxx]</span>, Elizabeth Denham, has issued her <span class=\"mask\">[xxx]</span> verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a <span class=\"mask\">[xxx]</span> agreement which took far too little account of the patients’ rights and their expectations of privacy.</p>\n<p>DeepMind has almost apologised. The NHS trust has <span class=\"mask\">[xxx]</span> its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully <span class=\"mask\">[xxx]</span> to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned. There are lessons about informed patient <span class=\"mask\">[xxx]</span> to learn. But privacy is not the only angle in this case and not even the most important. Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it “controlled” the data and DeepMind merely “processed” it. But this distinction misses the point that it is processing and <span class=\"mask\">[xxx]</span>, not the mere <span class=\"mask\">[xxx]</span> of bits, that gives the data value.</p>\n<p>The great question is who should benefit from the analysis of all the data that our lives now generate. Privacy law builds on the concept of damage to an individual from <span class=\"mask\">[xxx]</span> knowledge about them. That misses the way the <span class=\"mask\">[xxx]</span> economy works. The data of an individual there gains its value only when it is compared with the data of <span class=\"mask\">[xxx]</span> millions more.</p>\n<p>The use of privacy law to <span class=\"mask\">[xxx]</span> the tech giants in this instance feels slightly <span class=\"mask\">[xxx]</span>. This practice does not address the real worry. It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives. What matters is that they will belong to a private monopoly which developed them using public resources. If software promises to save lives on the scale that drugs now can, big data may be expected to behave as big pharma has done. We are still at the beginning of this revolution and small choices now may turn out to have <span class=\"mask\">[xxx]</span> consequences later. A long struggle will be needed to avoid a future of digital <span class=\"mask\">[xxx]</span>. Ms Denham’s report is a welcome start.</p>\n<p>Any <span class=\"mask\">[xxx]</span> assessment of the dangers / of the deal between Britain’s National Health Service (NHS) and DeepMind / must start by <span class=\"mask\">[xxx]</span> / that both sides mean well. / DeepMind is one of the leading artificial intelligence (AI) companies / in the world. / The potential of this work applied to healthcare / is very great, / but it could also lead to / further concentration of power in the tech giants. / It is against that background / that the information <span class=\"mask\">[xxx]</span>, Elizabeth Denham, / has issued her <span class=\"mask\">[xxx]</span> verdict / against the Royal loped them using public resources. / If software promises to save lives / on the scale that drugs now can, / big data may be expected / to behave as big pharma has done. / We are still at the beginning of this revolution / and small choices now / may turn out to have <span class=\"mask\">[xxx]</span> consequences later. / A long struggle will be needed / to avoid a future of digital <span class=\"mask\">[xxx]</span>. / Ms Denham’s report is a welcome start.</p>\n<p>Any <span class=\"mask\">[xxx]</span> 对风险的评估 / of 这项合作 between Britain’s 国民医疗服务体系 (NHS) and DeepMind / must start by <span class=\"mask\">[xxx]</span> / that 双方出于好意. / DeepMind is one of the leading artificial intelligence (AI) companies / in the world. / 潜力 of this work 应用于医疗 / is 非常大, / but it 也可能导致 / 权力进一步集中 in 科技巨头. / It is against 这一背景 / that the information <span class=\"mask\">[xxx]</span>, Elizabeth Denham, / 已经作出 her <span class=\"mask\">[xxx]</span> verdict / against the Royal Free hospital trust under the NHS, / which 交出 to DeepMind / 记录 of 1.6 million 患者在2015年 / on the basis of a <span class=\"mask\">[xxx]</span> agreement / which 考虑得实在太少 / of 患者的权利 / and 他们对隐私的期待.</p>\n<p>DeepMind 几乎已经道歉. / The NHS trust has <span class=\"mask\">[xxx]</span> its ways. / 后续安排—and there may be many— / between the NHS and DeepMind / will be carefully <span class=\"mask\">[xxx]</span> / to ensure that 所有必要许可 / have been 向患者征求 / and 所有不必要的数据 已被清理. / There are lessons about informed patient <span class=\"mask\">[xxx]</span> to learn. / But 隐私不是唯一角度 in this case / and 甚至不是最重要的. / Ms Denham chose to concentrate the blame on the NHS trust, / since under existing law / it “controlled” the data / and DeepMind merely “处理” it. / But this distinction misses the point / that it is processing and <span class=\"mask\">[xxx]</span>, / not the mere <span class=\"mask\">[xxx]</span> of bits, / that 赋予数据价值.</p>\n<p>重要的问题 is / 谁应当受益 / from the analysis of 所有这些数据 / that 我们的生活 now generate. / Privacy law builds on the concept / of damage to 一个人 / from <span class=\"mask\">[xxx]</span> knowledge about them. / That misses the way / the <span class=\"mask\">[xxx]</span> economy works. / The data of an individual there / 获得其价值 only / when it 被比较 / with the data of <span class=\"mask\">[xxx]</span> millions more.</p>\n<p>隐私法的使用 / to <span class=\"mask\">[xxx]</span> 科技巨头 in this instance / feels slightly <span class=\"mask\">[xxx]</span>. / This practice 没有处理 真正的担忧. / 这还不够 to say / that 算法 DeepMind develops / 将使患者受益 and 挽救生命. / 重要的 is / that they 将属于 to 一个私人垄断企业 / which developed them using 公共资源. / If software promises to save lives / on the scale that drugs now can, / 大数据 may be expected / to behave as big pharma has done. / We are still at 开端 of this revolution / and 现在的小选择 / may turn out to have <span class=\"mask\">[xxx]</span> 以后的后果. / 长期的努力 将是必要的 / 为避免一种未来 of digital <span class=\"mask\">[xxx]</span>. / Ms Denham’s report is a 可喜的开始.</p>\n<p>1、对风险的评估；这项合作；NHS、DeepMind；双方出于好意；医疗；权力进一步集中；2015；患者的权利；隐私的期待。</p>\n<p>2、几乎已经道歉；后续安排；所有必要许可；患者；隐私不是唯一角度；赋予数据价值。</p>\n<p>3、重要的问题；谁应当受益；所有这些数据；我们的生活；一个人；获得其价值；被比较。</p>\n<p>4、隐私法的使用；真正的担忧；将使患者受益；挽救生命；一个私人垄断企业；公共资源；现在的小选择；以后的后果；可喜的开始。</p>\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，方便之后带着题目回去。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现NHS、DeepMind、双方出于好意、患者的权利；中间有后续安排、必要许可、赋予数据价值、谁应当受益；后面还有私人垄断企业、公共资源、现在的小选择和可喜的开始。</p>\n<p>到这里还不能自然地说清楚：两家机构怎样合作，患者权利出了什么问题，数据价值和谁受益是什么关系，最后为何又提到私人垄断。先记住这些对象及大致位置，题目问到哪一层，再把相关段落读细。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n<h1>3. 开始做31至34题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<h2>31题</h2>\n<blockquote>\n<p>What is true of the agreement between the NHS and DeepMind?<br />\n关于NHS与DeepMind之间的协议，哪个说法是正确的？</p>\n</blockquote>\n<p>题干问NHS与DeepMind之间的agreement。第1段把双方、合作和协议放在一起，先把这一整段读完，再看各项是说谁受到什么影响。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Any <span class=\"mask\">[xxx]</span> assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by <span class=\"mask\">[xxx]</span> that both sides mean well. DeepMind is one of the leading artificial intelligence (AI) companies in the world. The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants. It is against that background that the information <span class=\"mask\">[xxx]</span>, Elizabeth Denham, has issued her <span class=\"mask\">[xxx]</span> verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a <span class=\"mask\">[xxx]</span> agreement which took far too little account of the patients’ rights and their expectations of privacy.</p>\n<p>开始精读：</p>\n<p>Any <span class=\"mask\">[xxx]</span> assessment of the dangers / of the deal between Britain’s National Health Service (NHS) and DeepMind / must start by <span class=\"mask\">[xxx]</span> / that both sides mean well. / DeepMind is one of the leading artificial intelligence (AI) companies / in the world. / The potential of this work applied to healthcare / is very great, / but it could also lead to / further concentration of power in the tech giants. / It is against that background / that the information <span class=\"mask\">[xxx]</span>, Elizabeth Denham, / has issued her <span class=\"mask\">[xxx]</span> verdict / against the Royal Free hospital trust under the NHS, / which handed over to DeepMind / the records of 1.6 million patients in 2015 / on the basis of a <span class=\"mask\">[xxx]</span> agreement / which took far too little account / of the patients’ rights / and their expectations of privacy.</p>\n<p>顺着英文顺序读：</p>\n<p>任何 <span class=\"mask\">[xxx]</span> 的风险评估 / 针对英国国民医疗服务体系（NHS）与DeepMind之间的合作 / 都必须从 <span class=\"mask\">[xxx]</span> 开始 / 即双方出于好意。 / DeepMind是领先的人工智能（AI）公司之一 / 在世界范围内。 / 这项工作应用于医疗的潜力 / 非常大， / 但它也可能导致 / 权力进一步集中到科技巨头手中。 / 正是在这一背景下 / 信息 <span class=\"mask\">[xxx]</span> Elizabeth Denham / 作出了她的 <span class=\"mask\">[xxx]</span> 裁定 / 针对NHS下属的Royal Free医院机构， / 这家机构交给了DeepMind / 一百六十万名患者的记录，在2015年 / 依据的是一份 <span class=\"mask\">[xxx]</span> 协议 / 这份协议考虑得实在太少 / 对于患者的权利 / 以及他们对隐私的期待。</p>\n</blockquote>\n<h3>A. It fell short of the <span class=\"mask\">[xxx]</span>’s expectations.</h3>\n<blockquote>\n<p>它没有达到 <span class=\"mask\">[xxx]</span> 的期待</p>\n</blockquote>\n<p>把A接回题干，它说的是：NHS与DeepMind之间的协议，没有满足 <span class=\"mask\">[xxx]</span> 所抱有的期待。</p>\n<p>A的fell short of说没有达到期待，原文末尾expectations of privacy也谈期待，而且前面有far too little，因此回看期待属于谁，以及协议在哪一点做得不够。</p>\n<blockquote>\n<p>It is against that background that the information <span class=\"mask\">[xxx]</span>, Elizabeth Denham, has issued her <span class=\"mask\">[xxx]</span> verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a <span class=\"mask\">[xxx]</span> agreement which took far too little account of the patients’ rights and their expectations of privacy.</p>\n</blockquote>\n<p>expectations of privacy前面的their接着patients，原文讲的是患者对隐私的期待，协议对这些期待考虑得太少。A的fell short of也有“未达到”的意思，和far too little在程度上接近。问题在于A把期待的主人放在 <span class=\"mask\">[xxx]</span>’s里，我们现在还没读出是谁；不能先把它当成患者，也不能反过来断定一定不是患者。与C相比，A少了一处能直接认出来的所属关系，所以先保留这个疑问，而不是把英文末尾碰巧相似当成已经完全对上。</p>\n<p><strong>没有读清A说的是谁的期待时，能仅凭原文也出现expectations就直接确定或排除A吗？</strong></p>\n<p>还不能。期待没有被充分照顾能接上，但期待属于谁还没有接完整。</p>\n<p>这一轮不替 <span class=\"mask\">[xxx]</span> 补出具体人或机构。原文明确的患者期待与A的所属者之间还隔着一步，先保留，稍后再比较。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. It caused conflicts among tech giants.</h3>\n<blockquote>\n<p>它引发了科技巨头之间的冲突</p>\n</blockquote>\n<p>把B接回题干，它说的是：这项协议使科技巨头彼此发生冲突。</p>\n<p>B的conflicts among tech giants与原文concentration of power in the tech giants都有tech giants，但前者说巨头之间发生什么，后者说权力向哪里集中，因此回看power这句话的主干。</p>\n<blockquote>\n<p>The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.</p>\n</blockquote>\n<p>concentration of power in the tech giants说权力进一步聚集在巨头手中，巨头是权力流向的一方。B的conflicts among tech giants却让各家巨头彼此争斗，among把关系放在多家企业之间。集中与冲突不是同一个现象：即使权力集中到少数公司，也不能直接推出它们因此发生冲突。另外原句是could also lead to，谈可能的后果，B用caused断定已经造成冲突，又把可能性写成既成事实。两处差别都不取决于段末那个协议修饰词。</p>\n<p><strong>权力可能进一步集中到科技巨头手中，能直接改成巨头之间已经发生冲突吗？</strong></p>\n<p>不能。权力集中与企业间冲突不同，可能后果与已经发生也不同。</p>\n<p>B留下了tech giants，却改变了巨头在句子中的关系和事件的确定程度，不能只按同一名词判断。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. It failed to pay due attention to patients’ rights.</h3>\n<blockquote>\n<p>它未能充分关注患者的权利</p>\n</blockquote>\n<p>把C接回题干，它说的是：这项协议没有给予患者权利应有的重视。</p>\n<p>C的pay due attention说给应有的重视，原文took far too little account说考虑得太少；两者对同一对象都可描述重视不足，因此回看account of后面有没有patients’ rights。</p>\n<blockquote>\n<p>the records of 1.6 million patients in 2015 on the basis of a <span class=\"mask\">[xxx]</span> agreement which took far too little account of the patients’ rights and their expectations of privacy.</p>\n</blockquote>\n<p>which指向前面的agreement，took far too little account明确说这份协议考虑得不够，of后面第一项就是the patients’ rights。C用failed to接pay due attention，意思仍是没有达到应有的重视程度，而不是说患者根本没有权利。这里主体是协议，评价是关注不足，对象是患者权利，三点都能接上。原句还并列隐私期待，C只选其中患者权利这一项，并不等于否认另一项；题干问一个正确说法，不要求把所有并列内容全部写进同一选项。</p>\n<p><strong>协议对患者权利考虑得太少，是否就是没有给予这些权利应有的重视？</strong></p>\n<p>可以这样判断。两种表达保留的是同一主体、同一对象和同一种不足。</p>\n<p>C没有把不足夸成完全无视所有权利，也没有把患者换成合作机构。即使协议前面的修饰词没读清，这个评价仍写得很明确。先保留C。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. It put both sides into a dangerous situation.</h3>\n<blockquote>\n<p>它使双方陷入危险处境</p>\n</blockquote>\n<p>把D接回题干，它说的是：这项协议让NHS和DeepMind两个合作方都陷入了危险。</p>\n<p>D的put both sides into a dangerous situation把双方都说成陷入危险，原文both sides mean well也出现双方，但说的是意图；因此先看双方的身份，再看后文具体担心谁的权利与什么权力变化。</p>\n<blockquote>\n<p>Any <span class=\"mask\">[xxx]</span> assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by <span class=\"mask\">[xxx]</span> that both sides mean well.</p>\n</blockquote>\n<blockquote>\n<p>The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.</p>\n</blockquote>\n<p>both sides mean well只说明合作双方出发点是好的，不能拿“双方”这个词替后面的危险指定承受者。原文接着担忧的是权力集中到科技巨头手里，段末又具体落到患者权利与隐私期待；它没有把NHS与DeepMind同时安排在被这种危险损害的位置。D的put both sides into a dangerous situation把“这项合作存在风险”改成“两个合作机构都陷入危险”。尤其DeepMind所在的一方在权力集中描述中可能获得更多权力，不能径直把这种担忧改写为它也被协议置于危险中。</p>\n<p><strong>评估一项合作的风险，就必然是在说两个合作方都成了危险的承受者吗？</strong></p>\n<p>不是。合作有风险与双方都陷入危险，不是同一个范围的判断。</p>\n<p>D把风险影响的对象从具体的权利和权力关系移到了双方机构本身，还用both把两家都包进去，超过了这里所描述的后果。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>31题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>C明确接住患者权利受到的重视不足；A与“期待没有被充分顾及”相近，但期待的所属者还没有读清。B和D分别改换了风险的关系与承受对象。</p>\n<blockquote>\n<p><strong>31题先保留A、C，暂时二选一。</strong></p>\n</blockquote>\n<h2>32题</h2>\n<blockquote>\n<p>The NHS trust responded to Denham’s verdict with ______.<br />\nNHS下属的这家机构如何回应Denham的裁定？</p>\n</blockquote>\n<p>题干问NHS trust对Denham’s verdict的回应。第1段已经出现裁定，往下到第2段就出现The NHS trust的反应。先完整读第2段，尤其区分DeepMind与NHS分别做了什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>DeepMind has almost apologised. The NHS trust has <span class=\"mask\">[xxx]</span> its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully <span class=\"mask\">[xxx]</span> to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned. There are lessons about informed patient <span class=\"mask\">[xxx]</span> to learn. But privacy is not the only angle in this case and not even the most important. Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it “controlled” the data and DeepMind merely “processed” it. But this distinction misses the point that it is processing and <span class=\"mask\">[xxx]</span>, not the mere <span class=\"mask\">[xxx]</span> of bits, that gives the data value.</p>\n<p>开始精读：</p>\n<p>DeepMind has almost apologised. / The NHS trust has <span class=\"mask\">[xxx]</span> its ways. / Further arrangements—and there may be many— / between the NHS and DeepMind / will be carefully <span class=\"mask\">[xxx]</span> / to ensure that all necessary permissions / have been asked of patients / and all unnecessary data has been cleaned. / There are lessons about informed patient <span class=\"mask\">[xxx]</span> to learn. / But privacy is not the only angle in this case / and not even the most important. / Ms Denham chose to concentrate the blame on the NHS trust, / since under existing law / it “controlled” the data / and DeepMind merely “processed” it. / But this distinction misses the point / that it is processing and <span class=\"mask\">[xxx]</span>, / not the mere <span class=\"mask\">[xxx]</span> of bits, / that gives the data value.</p>\n<p>顺着英文顺序读：</p>\n<p>DeepMind几乎已经道歉。 / NHS下属机构已经 <span class=\"mask\">[xxx]</span> 了自己的做法。 / 后续安排——而且可能还有很多—— / 在NHS与DeepMind之间的 / 将被仔细 <span class=\"mask\">[xxx]</span> / 以确保所有必要的许可 / 都已向患者征求 / 且所有不必要的数据已被清理。 / 关于患者知情 <span class=\"mask\">[xxx]</span>，有教训需要吸取。 / 但隐私不是这个案例中的唯一角度 / 甚至不是最重要的。 / Denham女士选择把责备集中在NHS下属机构， / 因为按照现行法律 / 它“控制”数据 / 而DeepMind只是“处理”数据。 / 但这种区分没有抓住这一点 / 即是处理和 <span class=\"mask\">[xxx]</span>， / 而不是对比特的单纯 <span class=\"mask\">[xxx]</span>， / 赋予数据价值。</p>\n</blockquote>\n<h3>A. empty promises</h3>\n<blockquote>\n<p>空洞的承诺</p>\n</blockquote>\n<p>把A接回题干，它说的是：NHS机构用空洞承诺回应裁定，并没有落实相应的处理。</p>\n<p>A的empty promises说只有承诺没有实质内容，第2段all unnecessary data has been cleaned却提到数据处理，因此回看前面的许可要求与这项清理如何成为后续安排的检查内容。</p>\n<blockquote>\n<p>The NHS trust has <span class=\"mask\">[xxx]</span> its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully <span class=\"mask\">[xxx]</span> to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.</p>\n</blockquote>\n<p>all unnecessary data has been cleaned与permissions have been asked并列，是后续安排要确保的两项具体处理。机构自身的动作有一处没读清，但作者没有停留在“将来会更好”的笼统许诺，而是继续把征求患者许可、清理不必要数据写出来。A的empty promises反而给这种回应加上“空洞、没有实际内容”的评价，把具体要求抹成没有落实意义的许诺。未来安排还需进一步检查，不等于现有回应已经被作者判定为虚假或敷衍；不能把will一见就读成只说不做。</p>\n<p><strong>后续还要检查许可与数据清理，能反过来说这些回应就是空洞承诺吗？</strong></p>\n<p>不能。继续检查具体处理，与断定只是空话不同。</p>\n<p>A把原文列出的实际整改事项换成了“没有实质内容”的评价，而这段所展示的回应方向是对这些事项作出处理。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. tough resistance</h3>\n<blockquote>\n<p>强硬抵制</p>\n</blockquote>\n<p>把B接回题干，它说的是：NHS机构强硬抵制Denham的裁定。</p>\n<p>B的tough resistance意味着对要求强硬反抗，原文ensure that all necessary permissions谈确保必要许可；二者都是对裁定后要求的反应，因此回看机构是拒绝要求，还是把要求纳入后续安排。</p>\n<blockquote>\n<p>The NHS trust has <span class=\"mask\">[xxx]</span> its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully <span class=\"mask\">[xxx]</span> to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.</p>\n</blockquote>\n<p>ensure that all necessary permissions把患者许可设为后续合作需要确保的事项，清理不必要数据也同样列进安排。tough resistance则要求机构对这些要求采取拒不接受、强硬对抗的方向。原文说的不是“无论裁定如何，继续不问许可地使用数据”，而是在继续合作时对许可和清理提出明确约束。前一句动词没有读清，后一句的to ensure仍把回应所要实现的事情写了出来，不能将配合这些要求的安排说成对要求的强硬抵制。</p>\n<p>B把按要求处理换成了拒绝要求，动作方向相反。</p>\n<p><strong>把征求患者许可和清理数据列为后续合作要确保的事项，是在强硬拒绝这些要求吗？</strong></p>\n<p>不是。它是在按这些要求安排后续合作。</p>\n<p>B与这一方向相反。不要因为第1段有负面裁定，就自动替被裁定的一方补出对抗性的回应。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. <span class=\"mask\">[xxx]</span> apologies</h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 的道歉</p>\n</blockquote>\n<p>把C接回题干，它说的是：NHS机构以 <span class=\"mask\">[xxx]</span> 的道歉回应裁定。</p>\n<p>C的apologies对应第2段开头apologised的道歉动作，但完整原句是DeepMind has almost apologised，因此回看该句主语，再与题干的NHS trust比较。</p>\n<blockquote>\n<p>DeepMind has almost apologised. The NHS trust has <span class=\"mask\">[xxx]</span> its ways.</p>\n</blockquote>\n<p>DeepMind has almost apologised的主语是DeepMind；句号之后才另起The NHS trust，讲另外一方的做法。C的apologies虽然抓住了道歉这个动作，却接在题干NHS trust responded后面，将DeepMind一侧的反应移给NHS。修饰道歉的词认不认识，都不能改变这个主体错位。此外almost本身还限制了apologised，不能把“几乎已经道歉”随意说成一次确定而充分的道歉。两家合作不等于两家的回应可以互换。</p>\n<p><strong>道歉动作前面写的是DeepMind，能把它直接接给题干问的NHS机构吗？</strong></p>\n<p>不能。两个句子分别说两个主语，不能因为它们是合作方就交换各自的动作。</p>\n<p>C的问题先出在谁作出回应，而不是道歉的形容词是否认识。把题干主语带着读到原句，便能发现这项接错了人。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. necessary adjustments</h3>\n<blockquote>\n<p>必要的调整</p>\n</blockquote>\n<p>把D接回题干，它说的是：NHS机构作出必要调整，以回应Denham的裁定。</p>\n<p>D的necessary adjustments说做法上的必要调整，原文permissions have been asked以及后面的数据清理都是合作安排中实际要处理的事项，因此回看它们怎样接着NHS trust的反应。</p>\n<blockquote>\n<p>The NHS trust has <span class=\"mask\">[xxx]</span> its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully <span class=\"mask\">[xxx]</span> to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.</p>\n</blockquote>\n<p>permissions have been asked所说的患者许可，加上不必要数据has been cleaned，是这段明确列出的变化内容。D的necessary adjustments不要求我们把第一句的动词逐字翻出来，而是把这些做法归到必要调整：合作并非继续照旧，许可与数据处理都被放进后续要求。D也没有声称所有更深的问题已经彻底解决；它回答的只是机构怎样回应眼前裁定。后半段作者另说privacy不是唯一角度，不会取消前面这层回应本身。</p>\n<p>两者所说的对象都是合作做法的调整，而不是单纯的口头致歉。</p>\n<p><strong>回应中涉及征求许可、清理数据等具体做法，是否可以称为必要调整？</strong></p>\n<p>可以。这些都是针对合作方式和数据处理作出的实际安排。</p>\n<p>D既没有把道歉动作移错主语，也没有把后续处理说成拒绝裁定，更没有夸大为解决全部问题，因此能够保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>32题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>道歉一句的主语是DeepMind，不是题干问的NHS。NHS后面接的是许可、清理数据等做法，D能够承接这种回应。</p>\n<blockquote>\n<p><strong>32题选D。</strong></p>\n</blockquote>\n<h2>33题</h2>\n<blockquote>\n<p>The author argues in Paragraph 2 that ______.<br />\n作者在第2段主张什么？</p>\n</blockquote>\n<p>题干已经限定Paragraph 2。第2段在32题完整读过，这次问的是作者在这一段的主张，不只是机构回应。回看But之后作者怎样从隐私问题往下说，尤其是最后一组“是……而不是……”的区分。</p>\n<h3>A. privacy protection must be secured at all costs</h3>\n<blockquote>\n<p>隐私保护必须不惜一切代价得到保障</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者主张，无论付出什么代价，都必须保障隐私。</p>\n<p>A的at all costs给隐私保护放上不惜一切的程度，原文not even the most important却在限定隐私的地位；它们都在评价隐私有多重要，因此回看But之后的完整判断。</p>\n<blockquote>\n<p>But privacy is not the only angle in this case and not even the most important.</p>\n</blockquote>\n<p>not even the most important说隐私甚至不是这一案例最重要的角度，前半句还说它不是唯一角度。A的at all costs则把隐私保障写成可以压倒其他考虑、不惜任何代价的要求。原文当然没有否定患者隐私值得保护，前面征求许可也说明这件事需要做；但“需要做”并不自动成为“其他任何代价都可以不顾”。这一题问作者的主张，不能把他已经往后退的一层关注反而推到绝对优先的位置。</p>\n<p>这里的程度从需要保障扩大成不计任何代价。</p>\n<p><strong>作者说隐私甚至不是最重要的角度，能读成他要求为了隐私不惜一切代价吗？</strong></p>\n<p>不能。需要关注隐私与让它压倒一切，不是同一个程度。</p>\n<p>A把原文的限定改成绝对化要求，还忽略But将讨论引向另外层面的作用，因此排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. the value of data comes from the processing of it</h3>\n<blockquote>\n<p>数据的价值来自对数据的处理</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者主张，数据之所以获得价值，在于对它进行处理。</p>\n<p>B的comes from the processing说价值从处理而来，原文it is processing在强调谁赋予数据价值，两者都在谈价值来源，因此把末句的that gives the data value接回强调部分读。</p>\n<blockquote>\n<p>But this distinction misses the point that it is processing and <span class=\"mask\">[xxx]</span>, not the mere <span class=\"mask\">[xxx]</span> of bits, that gives the data value.</p>\n</blockquote>\n<p>it is processing后面虽然还有一个并列词没读清，但强调结构的结尾that gives the data value已经明确把“处理”放在赋予价值的一边。B的comes from the processing将这种“某种活动给予价值”改写成“价值来自某种活动”，因果方向没有反转。B没有写only，也没有说除此之外再无其他活动，因此不能因原句还有and就要求B把两个并列项目都列全。真正的对比是价值不在于一个表面身份或简单地拿着数据，而在于对数据做什么。</p>\n<p><strong>原文明确把processing列在赋予数据价值的一边，B是否保留了这个价值来源？</strong></p>\n<p>可以这样判断。B没有增加“唯一”二字，只把原句已经肯定的处理活动接成价值来源。</p>\n<p>这一句正是作者用But纠正前面区分的地方。B回答的是他的纠正性判断，不是把监管者的归责方式当作作者自己的全部结论。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. making profits from patients’ data is illegal</h3>\n<blockquote>\n<p>从患者数据中获利是违法的</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者主张，只要从患者数据里获取利润，就属于违法。</p>\n<p>C的making profits谈获利是否合法，第2段under existing law确实出现法律，因此回看法律在这里区分的是什么行为，以及作者随后如何回应。</p>\n<blockquote>\n<p>Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it “controlled” the data and DeepMind merely “processed” it. But this distinction misses the point that it is processing and <span class=\"mask\">[xxx]</span>, not the mere <span class=\"mask\">[xxx]</span> of bits, that gives the data value.</p>\n</blockquote>\n<p>under existing law后面区分的是NHS控制数据、DeepMind处理数据，解释Denham为什么把责备集中在NHS。作者接着说这一区分没抓住赋予数据价值的活动，并没有在这里把making profits设成一律违法的行为。C把监管归责的控制与处理之分，改写成利润合法性的判断；又把作者讨论“价值怎么产生”，读成他禁止一切获利。value不是illegal的同义表达，描述数据有价值也不等于宣布取得这种价值就是犯罪。</p>\n<p><strong>文中讨论现有法律怎样区分控制与处理，就能推出凡从患者数据获利都违法吗？</strong></p>\n<p>不能。法律在这一句解释的是归责，而C另外加上了获利一律违法的判断。</p>\n<p>C既换了被讨论的行为，也把一项特定案件中的区分扩大为普遍禁令，不能从existing law几个字跳到这个结论。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. <span class=\"mask\">[xxx]</span> patients’ data is worse than selling it</h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 患者数据比出售数据更糟</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为，<span class=\"mask\">[xxx]</span> 患者数据这种行为比出售数据更糟糕。</p>\n<p>D的worse than selling it要求比较两种行为的坏处，第2段gives the data value却比较什么使数据有价值；两边都是数据行为的区分，因此回看作者比较所用的标准。</p>\n<blockquote>\n<p>But this distinction misses the point that it is processing and <span class=\"mask\">[xxx]</span>, not the mere <span class=\"mask\">[xxx]</span> of bits, that gives the data value.</p>\n</blockquote>\n<p>gives the data value问的是价值由什么活动产生，原句用it is和not把赋予价值的一边与另一边区分开。D的worse than selling it则问哪一种行为更糟，而且把selling设为明确比较项。就算D开头的动作暂时不知道，后面的“比出售更糟”也已经加进了坏处高低的排序。原文在这里不是说“处理比出售更坏”，也不是给两种隐私侵害排严重程度；它在解释把责任只放在控制者身上为什么遗漏了处理的意义。</p>\n<p><strong>区分什么活动赋予数据价值，等于给某个行为与出售数据排一个谁更糟的次序吗？</strong></p>\n<p>不等于。价值来源的区分，与坏处程度的比较，不是同一个问题。</p>\n<p>D的前半个动作不认识，并不妨碍看出后半句添加了selling和worse的比较框架，而这一框架不是作者此处使用的标准。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>33题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>A把隐私放到了不惜一切的位置，C添加获利违法的普遍判断，D改成坏处程度比较。B保留作者明确强调的“处理赋予数据价值”。</p>\n<blockquote>\n<p><strong>33题选B。</strong></p>\n</blockquote>\n<h2>34题</h2>\n<blockquote>\n<p>According to the last paragraph, the real worry arising from this deal is ______.<br />\n根据最后一段，这项合作带来的真正担忧是什么？</p>\n</blockquote>\n<p>题干明确写the last paragraph，直接回到第4段。real worry问真正的担忧，不是任意一个负面词。先读完整段，注意This practice does not address与What matters怎样把讨论继续往前推。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The use of privacy law to <span class=\"mask\">[xxx]</span> the tech giants in this instance feels slightly <span class=\"mask\">[xxx]</span>. This practice does not address the real worry. It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives. What matters is that they will belong to a private monopoly which developed them using public resources. If software promises to save lives on the scale that drugs now can, big data may be expected to behave as big pharma has done. We are still at the beginning of this revolution and small choices now may turn out to have <span class=\"mask\">[xxx]</span> consequences later. A long struggle will be needed to avoid a future of digital <span class=\"mask\">[xxx]</span>. Ms Denham’s report is a welcome start.</p>\n<p>开始精读：</p>\n<p>The use of privacy law / to <span class=\"mask\">[xxx]</span> the tech giants in this instance / feels slightly <span class=\"mask\">[xxx]</span>. / This practice does not address the real worry. / It is not enough to say / that the algorithms DeepMind develops / will benefit patients and save lives. / What matters is / that they will belong to a private monopoly / which developed them using public resources. / If software promises to save lives / on the scale that drugs now can, / big data may be expected / to behave as big pharma has done. / We are still at the beginning of this revolution / and small choices now / may turn out to have <span class=\"mask\">[xxx]</span> consequences later. / A long struggle will be needed / to avoid a future of digital <span class=\"mask\">[xxx]</span>. / Ms Denham’s report is a welcome start.</p>\n<p>顺着英文顺序读：</p>\n<p>隐私法的使用 / 在这个案例中用来 <span class=\"mask\">[xxx]</span> 科技巨头 / 感觉有些 <span class=\"mask\">[xxx]</span>。 / 这种做法没有处理真正的担忧。 / 仅仅说这些还不够 / 即DeepMind开发的算法 / 将使患者受益并挽救生命。 / 重要的是 / 它们将属于一个私人垄断企业 / 这个企业利用公共资源开发了它们。 / 如果软件承诺挽救生命 / 达到药物现在能够达到的规模， / 大数据可能被期待 / 像大型制药企业已经做过的那样行事。 / 我们仍处于这场变革的开端 / 而现在的小选择 / 以后可能产生 <span class=\"mask\">[xxx]</span> 的后果。 / 将需要长期的努力 / 来避免一个数字 <span class=\"mask\">[xxx]</span> 的未来。 / 丹纳姆女士的报告是一个可喜的开始。</p>\n</blockquote>\n<h3>A. the monopoly of big data by tech giants</h3>\n<blockquote>\n<p>科技巨头对大数据的垄断</p>\n</blockquote>\n<p>把A接回题干，它说的是：这项合作真正令人担忧的是，大数据被科技巨头垄断。</p>\n<p>A的monopoly of big data说大数据由少数科技企业独占，原文belong to a private monopoly说开发出的东西将属于私人垄断企业；两者都涉及归谁控制，因此回看What matters后面的完整句。</p>\n<blockquote>\n<p>It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives. What matters is that they will belong to a private monopoly which developed them using public resources.</p>\n</blockquote>\n<p>belong to a private monopoly中的they接前面的algorithms，作者担心用公共资源开发出的成果最后归一家私人垄断企业。A的monopoly of big data不是说技术没有医疗作用，而是把数据及其处理成果带来的控制权归属概括出来。What matters把重点明确放在“归私人垄断者所有”，与前面“仅仅说能救人还不够”形成递进。因此A能回答为什么一项可能有益的合作仍值得担心：公共资源产生的价值和力量可能被科技巨头掌握。</p>\n<p>两者抓住的对象都是私人企业掌握的数据价值与权力。</p>\n<p><strong>作者在What matters后面紧接私人垄断企业的归属问题，是否把真正担忧落在了垄断控制上？</strong></p>\n<p>可以这样判断。担心的不只是眼前有没有医疗收益，还包括这些成果最终归谁拥有。</p>\n<p>A保留了企业、数据及价值归属之间的关系，没有把“有益”与“存在垄断风险”当成互相排斥的两件事。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. the <span class=\"mask\">[xxx]</span> rivalry among big pharmas</h3>\n<blockquote>\n<p>大型制药企业之间 <span class=\"mask\">[xxx]</span> 的竞争</p>\n</blockquote>\n<p>把B接回题干，它说的是：这项合作真正令人担忧的是，大型制药企业彼此展开 <span class=\"mask\">[xxx]</span> 的竞争。</p>\n<p>B的rivalry among big pharmas让人想到末段big pharma，但原句big data may be expected to behave as big pharma has done是在作类比，因此回看被说明的一方到底是谁。</p>\n<blockquote>\n<p>If software promises to save lives on the scale that drugs now can, big data may be expected to behave as big pharma has done.</p>\n</blockquote>\n<p>big data may be expected to behave as big pharma has done把大数据企业的未来行为，与大型制药企业已经有过的做法相类比。句子的主要对象仍是big data，big pharma是拿来帮助理解的一方。B的rivalry among big pharmas却将主题改成制药公司之间的竞争，among还添了企业互相竞争的关系。前面的形容词不清楚，也改变不了对象已经从数据企业移到制药企业、类比已经变成内部竞争这两件事。药物能救人只是引出类似力量的一座桥，不是说这项医疗数据协议会令制药公司相互争斗。</p>\n<p><strong>作者拿制药企业作类比，是否就把真正担忧改成制药企业之间的竞争了？</strong></p>\n<p>不是。类比用来说明大数据一方，而不是把制药业竞争改成这项合作的核心问题。</p>\n<p>B把帮助说明问题的另一行业拿来当问题本身，又增加企业之间的竞争，主体与关系都移动了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. the uncontrolled use of new software</h3>\n<blockquote>\n<p>新软件不受控制的使用</p>\n</blockquote>\n<p>把C接回题干，它说的是：这项合作真正令人担忧的是，新软件被不加控制地使用。</p>\n<p>C的uncontrolled use谈软件使用是否受到约束，原文belong to a private monopoly谈软件成果归谁拥有；它们都涉及软件，因此回看作者在What matters后究竟强调哪一层。</p>\n<blockquote>\n<p>It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives. What matters is that they will belong to a private monopoly which developed them using public resources.</p>\n</blockquote>\n<p>belong to a private monopoly指出的是所有权集中：用公共资源开发，却归私人垄断企业。C的uncontrolled use改成软件使用没有受到控制，好像作者担心大家任意部署、无人限制使用。两者不一样，甚至“某家企业牢牢控制资源与成果”并不等于“成果被所有人随意使用”。作者也没有否认算法benefit patients and save lives，而是认为有益还不足以回答归属问题。把担忧改成失控使用，会让What matters后面的private monopoly和public resources这一组对照失去着落。</p>\n<p><strong>公共资源开发的成果归私人垄断企业，等于作者在说软件的使用不受任何控制吗？</strong></p>\n<p>不等于。一个问权力与成果归谁，一个问使用有没有约束。</p>\n<p>C抓住了软件，却换掉了作者明确指出的所有权问题，不能把各种可能的软件风险都归进这里的real worry。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. the ineffective enforcement of privacy law</h3>\n<blockquote>\n<p>隐私法执行无效</p>\n</blockquote>\n<p>把D接回题干，它说的是：这项合作真正令人担忧的是，现有隐私法没有得到有效执行。</p>\n<p>D的ineffective enforcement说法律执行不起作用，原文does not address the real worry说这种做法没触及真正担忧；都谈当前处理的不足，因此回看后一句把不足具体落到哪里。</p>\n<blockquote>\n<p>The use of privacy law to <span class=\"mask\">[xxx]</span> the tech giants in this instance feels slightly <span class=\"mask\">[xxx]</span>. This practice does not address the real worry.</p>\n</blockquote>\n<blockquote>\n<p>What matters is that they will belong to a private monopoly which developed them using public resources.</p>\n</blockquote>\n<p>does not address the real worry不是直接说“法律条文已经对准问题，只是执行太差”，而是紧接着另提What matters，把真正要讨论的东西放在公共资源开发的成果属于私人垄断者。D的ineffective enforcement却让人把原因继续理解成原有隐私法律执行得不够好。执行强弱与处理角度是否触及更深的问题不同：即便患者许可等隐私事项按要求处理，成果和权力由谁掌握的问题仍需要回答。D把作者往深一层追问的方向，又拉回眼前的执行成效。</p>\n<p><strong>作者认为隐私法这一处理没有触及更深的归属问题，就等于他只是在批评执法不力吗？</strong></p>\n<p>不等于。后文明确提出的是另外一层的垄断与归属，而不是给原有执法力度打分。</p>\n<p>D把“没有解决真正担忧”缩成“执行效果不好”，遗漏了What matters后作者亲自指出的问题对象。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>34题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>What matters后面明确落到private monopoly与public resources的归属对照。A接住这一点；B移到制药企业竞争，C换成软件失控使用，D停在隐私法执行。</p>\n<blockquote>\n<p><strong>34题选A。</strong></p>\n</blockquote>\n<h2>35题</h2>\n<p><strong>The author’s attitude toward the application of AI to healthcare is ______.</strong></p>\n<p>作者对把人工智能应用于医疗持什么态度？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>ambiguous</strong></p>\n<p>含糊不清的</p>\n<p>B. <strong>appreciative</strong></p>\n<p>赞赏的</p>\n<p>C. <strong>cautious</strong></p>\n<p>谨慎的</p>\n<p>D. <strong>contemptuous</strong></p>\n<p>轻蔑的</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>作者这一段在做什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先承认双方出于好意、人工智能用于医疗有很大潜力，再写权力集中风险，并引出协议对患者权利与隐私期待照顾不足的裁定。</td>\n<td>先承认一面再摆出另一面</td>\n</tr>\n<tr>\n<td>2</td>\n<td>写双方回应和后续许可、数据清理安排，随后指出隐私不是唯一乃至最重要的角度；作者强调处理数据本身赋予数据价值。</td>\n<td>再说事情不止眼前这一层</td>\n</tr>\n<tr>\n<td>3</td>\n<td>进一步追问所有这些数据的分析应该让谁受益，说明个人数据在与更多人的数据比较时才获得价值。</td>\n<td>接着追问更深一层的问题</td>\n</tr>\n<tr>\n<td>4</td>\n<td>指出仅用隐私法处理没有触及真正担忧：公共资源开发的成果归私人垄断企业；最后强调长期应对，同时肯定报告是可喜的开始。</td>\n<td>最后说清担心并留下出路</td>\n</tr>\n</tbody>\n</table>\n<h3>A. ambiguous</h3>\n<blockquote>\n<p>含糊不清的</p>\n</blockquote>\n<p>如果A是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 A 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>同时写好处与坏处，但两边写完仍不说明怎样看待。</td>\n<td>先承认一面再摆出另一面</td>\n</tr>\n<tr>\n<td>2</td>\n<td>继续提出各种不同角度，不判断何者更重要。</td>\n<td>再说事情不止眼前这一层</td>\n</tr>\n<tr>\n<td>3</td>\n<td>抛出谁受益的问题，但不表明问题意味着什么。</td>\n<td>接着追问更深一层的问题</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后仍无法看清作者赞成什么、担忧什么。</td>\n<td>最后说清担心并留下出路</td>\n</tr>\n</tbody>\n</table>\n<p>A的ambiguous不是“文章出现了两面”，而是读完仍不知道作者的态度。实际第1段把善意和医疗潜力说得明确，也把权力集中写成需要关注的风险；第2段又明说隐私不是最重要角度；末段用What matters指向私人垄断问题，并以a long struggle will be needed和welcome start表明需要继续应对、同时肯定这一步。这些并非互相打架而让人无法判断，而是在不同层面分别作出清楚评价。不能看到作者既有肯定又有担忧，就把有层次的态度误判成含糊。</p>\n<p><strong>作者明确承认潜力，又明确指出垄断风险和应对方向，还能说其态度含糊不清吗？</strong></p>\n<p>不能。不同层面的判断都很清楚，不是没有立场。</p>\n<p>A要求全文写完仍无法落点，但实际作者不断用not the most important、What matters和末段收束区分轻重，立场是可以读出来的。</p>\n<p><strong>判断：A排除。</strong></p>\n<h3>B. appreciative</h3>\n<blockquote>\n<p>赞赏的</p>\n</blockquote>\n<p>如果B是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 B 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先肯定医疗潜力，再把可能的问题作为较小的附带提醒。</td>\n<td>先承认一面再摆出另一面</td>\n</tr>\n<tr>\n<td>2</td>\n<td>写问题得到处理，主要赞赏这类医疗应用的进展。</td>\n<td>再说事情不止眼前这一层</td>\n</tr>\n<tr>\n<td>3</td>\n<td>追问数据受益对象，并以受益广泛来加强赞赏。</td>\n<td>接着追问更深一层的问题</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后把潜力和问题处理合在一起，整体落在对应用的欣赏。</td>\n<td>最后说清担心并留下出路</td>\n</tr>\n</tbody>\n</table>\n<p>B的appreciative能接上首段very great，却很难容纳随后那么多篇幅。作者并没有写“许可补齐以后，这类应用就值得充分赞扬”，而是继续说privacy甚至不是最重要的角度，再追问谁从数据分析中获益。末段还特意说It is not enough to say…benefit patients and save lives，意思是只凭能让患者受益并不能结束讨论。最后的welcome start肯定的是Denham报告这一开始，不是将所有人工智能医疗应用整体称为令人欣赏。B把一面的好处与对报告的一点评价，拿来代替了对应用整体的态度。</p>\n<p><strong>开头承认医疗潜力很大，是否足以抹掉后面对归属与垄断风险的持续追问，整体选赞赏？</strong></p>\n<p>不足以。作者明确说只讲好处还不够，后面讨论的正是为什么不能停在赞赏上。</p>\n<p>B能接住局部肯定，却接不住全文重点所在的保留与警惕，评价范围也把对报告的肯定混成对应用的整体赞赏。</p>\n<p><strong>判断：B排除。</strong></p>\n<h3>C. cautious</h3>\n<blockquote>\n<p>谨慎的</p>\n</blockquote>\n<p>如果C是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 C 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>先承认善意与益处，再提醒可能的另一面。</td>\n<td>先承认一面再摆出另一面</td>\n</tr>\n<tr>\n<td>2</td>\n<td>说明眼前的处理有必要，却不足以消除其他问题。</td>\n<td>再说事情不止眼前这一层</td>\n</tr>\n<tr>\n<td>3</td>\n<td>继续追问更深的价值和受益归属，防止只看单一好处。</td>\n<td>接着追问更深一层的问题</td>\n</tr>\n<tr>\n<td>4</td>\n<td>把长期风险与应对需要写明，既不草率放行，也不否认有益进展。</td>\n<td>最后说清担心并留下出路</td>\n</tr>\n</tbody>\n</table>\n<p>C的cautious可以同时容纳首段的两面：潜力很大，但可能让权力更集中。第2段不是否认隐私处理，而是认为还要看数据怎样产生价值；第3段再把问题推到谁应受益；末段则具体落在公共资源与私人垄断的归属冲突。末尾说报告是welcome start，说明作者仍认可改善的可能，并不主张把技术全部丢掉。这样的写法不是一味夸赞，也不是轻蔑技术，而是在承认益处的同时要求认真看待条件、权力和长期后果。</p>\n<p><strong>承认人工智能医疗有很大潜力，同时持续追问风险、归属和长期应对，是谨慎态度吗？</strong></p>\n<p>是的。肯定潜力并未取消风险，警惕风险也未变成否认全部价值。</p>\n<p>C能让四段都保留实际作用：先承认、再深入、再追问、最后提出需要继续应对并肯定起点。它不需要删去任何一面的判断。</p>\n<p><strong>判断：C保留。</strong></p>\n<h3>D. contemptuous</h3>\n<blockquote>\n<p>轻蔑的</p>\n</blockquote>\n<p>如果D是正确的全文判断，各段需要沿着下面的内容往下写。</p>\n<table>\n<thead>\n<tr>\n<th>段落</th>\n<th>如果 D 对，这段应该写什么</th>\n<th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>即使提到好处，也主要表现为轻视或嘲弄这种应用。</td>\n<td>先承认一面再摆出另一面</td>\n</tr>\n<tr>\n<td>2</td>\n<td>把相关处理都视为不值得认真看待。</td>\n<td>再说事情不止眼前这一层</td>\n</tr>\n<tr>\n<td>3</td>\n<td>以不屑的口吻否定数据分析价值或受益问题。</td>\n<td>接着追问更深一层的问题</td>\n</tr>\n<tr>\n<td>4</td>\n<td>最后落在对人工智能医疗应用的鄙视与否定。</td>\n<td>最后说清担心并留下出路</td>\n</tr>\n</tbody>\n</table>\n<p>D的contemptuous是轻蔑、不屑，不只是发现风险。首段却认真承认both sides mean well和医疗潜力very great；第2、3段还细分控制、处理、数据比较与受益归属，说明作者把这些问题当作值得认真讨论的事情。末段既承认benefit patients and save lives，又肯定报告是一个好的开始。若是轻蔑，文章应让读者觉得这种应用不值得当回事；实际作者正因为看见其力量与潜力，才认为现在的小选择和未来的应对非常重要。</p>\n<p><strong>认真承认潜力、细究归属并肯定改善的起点，能整体读成对这种应用不屑一顾吗？</strong></p>\n<p>不能。这里的担心来自认真看待其影响，而非轻蔑地否认其价值。</p>\n<p>D把风险批评扩大成轻蔑，态度程度过强，也与首段的明确肯定及末段留下的出路冲突。</p>\n<p><strong>判断：D排除。</strong></p>\n<h3>35题主旨结果</h3>\n<p>四项与全文的展开逐段比较后，C能够保留文章最后落实的判断。</p>\n<blockquote>\n<p><strong>35题选C。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>cautious / 谨慎的</strong></p>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保35题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查31题：A还是C？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. It fell short of the <span class=\"mask\">[xxx]</span>’s expectations.</li>\n<li>C. It failed to pay due attention to patients’ rights.</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>cautious / 谨慎的</strong></p>\n</blockquote>\n<p>也就是：作者承认人工智能用于医疗有很大潜力，同时并不因此放过患者权益、数据价值和权力归属带来的问题。谨慎不是不肯表态，而是不能只凭好处就忽略这些条件。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>A说NHS与DeepMind的协议未达到 <span class=\"mask\">[xxx]</span> 的期待；C说协议未给患者权利应有的重视。前者围绕某一方是否如愿，后者明确围绕患者权利有没有被妥善对待。</p>\n<p>第一遍留下A，是因为原文末句也有expectations，far too little又与未达到相近，但A的所属者没读清。C则能直接和the patients’ rights接上。那时不能擅自给A补一个主体，再据这个自填的主体说它错了。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看C。谨慎的态度在首段怎样落地？作者先肯定双方意图和医疗潜力，随后转到权力集中，再说协议对患者权利与隐私期待考虑得太少。C正好回答，在承认潜力之后仍然需要审慎对待的一个具体问题是什么。它既有局部took far too little account of the patients’ rights的直接支持，也能解释为什么这项不足会出现在作者提醒风险的段落里。</p>\n<p>再看A。某一方的期待没有实现，只能先说明它没有如愿；要让这个说法承担首段的风险提醒，还必须把“谁的期待”以及“期待的内容”接回患者权利。单凭fell short和expectations两个相近词，不能完成这一步。全文的谨慎不是对所有未满足期待的泛泛同情，更不是把合作是否达到各方愿望当作评价技术应用的全部尺度；它对患者权益与成果归属有具体关注。</p>\n<p>这样再比较，C把原文明确指出的权利问题保留下来，也能接住主旨为何要在肯定潜力后保留警惕；A仍缺少所属者与这层具体关注之间的连接。我们选已有两层支持的C，不把A的 <span class=\"mask\">[xxx]</span> 改写成任何一个人或机构，也不靠猜出那个词来收尾。</p>\n<blockquote>\n<p><strong>31题选C。</strong></p>\n</blockquote>\n<h2>最终答案：</h2>\n<ul>\n<li><strong>31题：C</strong> — It failed to pay due attention to patients’ rights.（它未能充分关注患者的权利）</li>\n<li><strong>32题：D</strong> — necessary adjustments（必要的调整）</li>\n<li><strong>33题：B</strong> — the value of data comes from the processing of it（数据的价值来自对数据的处理）</li>\n<li><strong>34题：A</strong> — the monopoly of big data by tech giants（科技巨头对大数据的垄断）</li>\n<li><strong>35题：C</strong> — cautious（谨慎的）</li>\n</ul>\n<p>本篇答案：<strong>CDBAC</strong>。</p>\n","analysisStartIndex":26,"maskInventory":{"token":"[xxx]","count":131},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":true,"maskSelectionBasis":"vocabulary_baseline_first","officialAnswerUsedForMaskSelection":false,"maskAdjustmentState":"not_needed","mainIdeaQid":"35","ordinaryFirstRoundCandidates":{"31":["A","C"],"32":["D"],"33":["B"],"34":["A"]}},"questionOptionFlowVersion":"question_scope_whole_paragraph_then_option_compare_v3","questionFlowPlan":[{"schema":"question-flow-plan-v3","qid":"31","questionType":"ordinary","paragraphPids":[0],"locator":{"basis":"stem_entity","anchors":["agreement","NHS","DeepMind"],"paragraphPids":[0]},"initialReadingMode":"new","initialParagraphPids":[0],"initialContextParagraphPids":[],"questionEntryStepIndexes":[26],"initialPrecisionStepIndexes":[26],"optionStepIndexes":{"A":27,"B":28,"C":29,"D":30},"extraPrecisionReads":[]},{"schema":"question-flow-plan-v3","qid":"32","questionType":"ordinary","paragraphPids":[1],"locator":{"basis":"stem_entity","anchors":["NHS trust"],"paragraphPids":[1]},"initialReadingMode":"new","initialParagraphPids":[1],"initialContextParagraphPids":[],"questionEntryStepIndexes":[32],"initialPrecisionStepIndexes":[32],"optionStepIndexes":{"A":33,"B":34,"C":35,"D":36},"extraPrecisionReads":[]},{"schema":"question-flow-plan-v3","qid":"33","questionType":"ordinary","paragraphPids":[1],"locator":{"basis":"stem_scope","anchors":["Paragraph 2"],"paragraphPids":[1]},"initialReadingMode":"reuse_previous","initialParagraphPids":[1],"initialContextParagraphPids":[],"questionEntryStepIndexes":[38],"initialPrecisionStepIndexes":[],"optionStepIndexes":{"A":39,"B":40,"C":41,"D":42},"extraPrecisionReads":[]},{"schema":"question-flow-plan-v3","qid":"34","questionType":"ordinary","paragraphPids":[3],"locator":{"basis":"stem_scope","anchors":["the last paragraph"],"paragraphPids":[3]},"initialReadingMode":"new","ini function waitImage(img,expected){return new Promise((resolve,reject)=>{const check=()=>{if(!img.naturalWidth||!img.naturalHeight){reject(new Error('embedded page image failed to decode'));return}const ew=Number(expected?.w??expected?.width??img.naturalWidth),eh=Number(expected?.h??expected?.height??img.naturalHeight);if(img.naturalWidth!==ew||img.naturalHeight!==eh){console.warn('embedded page size mismatch; using decoded dimensions',{expected:{w:ew,h:eh},actual:{w:img.naturalWidth,h:img.naturalHeight}})}resolve()};if(img.decode){img.decode().then(check).catch(()=>{if(img.complete)check();else img.addEventListener('load',check,{once:true})})}else if(img.complete)check();else img.addEventListener('load',check,{once:true})})}
function highlight(wrapId,rects){const wrap=document.getElementById(wrapId);wrap.querySelectorAll('.hl').forEach(n=>n.remove());if(!rects||!rects.length)return;const baseW=Number(wrap.dataset.w),baseH=Number(wrap.dataset.h);if(!baseW||!baseH)return;const pw=wrap.querySelector('.pageWrap')||wrap;rects.forEach(a=>{const d=document.createElement('div');d.className='hl';d.style.left=(a[0]/baseW*100)+'%';d.style.top=(a[1]/baseH*100)+'%';d.style.width=(a[2]/baseW*100)+'%';d.style.height=(a[3]/baseH*100)+'%';pw.appendChild(d)})}
