<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","contextRaw":"","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li>\n<p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li>\n<p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li>\n<p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","contextRaw":"","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 31题题干\n\n**What is true of the agreement between the NHS and DeepMind?**\n\n> 关于NHS与DeepMind之间的协议，哪个说法是正确的？\n\n题型：**具体细节题**。","contextRaw":"","html":"<h2>31题题干</h2>\n<p><strong>What is true of the agreement between the NHS and DeepMind?</strong></p>\n<blockquote>\n<p>关于NHS与DeepMind之间的协议，哪个说法是正确的？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,208.333,1125.0,48.333]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"31"}},{"section":"先读题干","raw":"## 32题题干\n\n**The NHS trust responded to Denham’s verdict with ______.**\n\n> NHS下属的这家机构如何回应Denham的裁定？\n\n题型：**具体细节题**。","contextRaw":"","html":"<h2>32题题干</h2>\n<p><strong>The NHS trust responded to Denham’s verdict with ______.</strong></p>\n<blockquote>\n<p>NHS下属的这家机构如何回应Denham的裁定？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,615.0,1046.667,50.0]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"32"}},{"section":"先读题干","raw":"## 33题题干\n\n**The author argues in Paragraph 2 that ______.**\n\n> 作者在第2段主张什么？\n\n题型：**段落主旨题**。","contextRaw":"","html":"<h2>33题题干</h2>\n<p><strong>The author argues in Paragraph 2 that ______.</strong></p>\n<blockquote>\n<p>作者在第2段主张什么？</p>\n</blockquote>\n<p>题型：<strong>段落主旨题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,1023.333,825.0,48.333]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"33"}},{"section":"先读题干","raw":"## 34题题干\n\n**According to the last paragraph, the real worry arising from this deal is ______.**\n\n> 根据最后一段，这项合作带来的真正担忧是什么？\n\n题型：**段落主旨题**。","contextRaw":"","html":"<h2>34题题干</h2>\n<p><strong>According to the last paragraph, the real worry arising from this deal is ______.</strong></p>\n<blockquote>\n<p>根据最后一段，这项合作带来的真正担忧是什么？</p>\n</blockquote>\n<p>题型：<strong>段落主旨题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,1430.0,1333.333,115.0]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"34"}},{"section":"先读题干","raw":"## 35题题干\n\n**The author’s attitude toward the application of AI to healthcare is ______.**\n\n> 作者对把人工智能应用于医疗持什么态度？\n\n题型：**全文作者观点／全文主旨题**。","contextRaw":"","html":"<h2>35题题干</h2>\n<p><strong>The author’s attitude toward the application of AI to healthcare is ______.</strong></p>\n<blockquote>\n<p>作者对把人工智能应用于医疗持什么态度？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n","articleRects":[],"questionRects":[[248.333,1906.667,1281.667,48.333]],"scrollTarget":"auto","meta":{"kind":"stem","qid":"35"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but, not, since, If |\n| 态度词 / 评价词 | 先抓个大概好坏 | mean well, very great, not enough |\n| 动作词 | 先看谁做了什么 | handed over, processed, benefit |\n| 结果词 | 看最后出了什么事 | value, power, consequences |\n| 重复主题词 | 大概知道老在说什么 | NHS, DeepMind, data, privacy |","contextRaw":"","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>关注原因</th>\n<th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>逻辑词</td>\n<td>看到这里可能要拐一下</td>\n<td>but, not, since, If</td>\n</tr>\n<tr>\n<td>态度词 / 评价词</td>\ nRects":[],"scrollTarget":"auto","meta":{"kind":"coarse","coarse":true,"pid":3,"form":3}},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，方便之后带着题目回去。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现NHS、DeepMind、双方出于好意、患者的权利；中间有后续安排、必要许可、赋予数据价值、谁应当受益；后面还有私人垄断企业、公共资源、现在的小选择和可喜的开始。\n\n到这里还不能自然地说清楚：两家机构怎样合作，患者权利出了什么问题，数据价值和谁受益是什么关系，最后为何又提到私人垄断。先记住这些对象及大致位置，题目问到哪一层，再把相关段落读细。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。","contextRaw":"","html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，方便之后带着题目回去。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现NHS、DeepMind、双方出于好意、患者的权利；中间有后续安排、必要许可、赋予数据价值、谁应当受益；后面还有私人垄断企业、公共资源、现在的小选择和可喜的开始。</p>\n<p>到这里还不能自然地说清楚：两家机构怎样合作，患者权利出了什么问题，数据价值和谁受益是什么关系，最后为何又提到私人垄断。先记住这些对象及大致位置，题目问到哪一层，再把相关段落读细。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以留下，没看到不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例；但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。</p>\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做31至34题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","contextRaw":"","html":"<h1>3. 开始做31至34题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"scrollTarget":"auto","meta":{"kind":"method_intro"}},{"section":"31题","raw":"## 31题\n\n> What is true of the agreement between the NHS and DeepMind?  \n> 关于NHS与DeepMind之间的协议，哪个说法是正确的？\n\n题干问NHS与DeepMind之间的agreement。第1段把双方、合作和协议放在一起，先把这一整段读完，再看各项是说谁受到什么影响。\n\n> 原文参考：\n>\n> Any **[xxx]** assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by **[xxx]** that both sides mean well. DeepMind is one of the leading artificial intelligence (AI) companies in the world. The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants. It is against that background that the information **[xxx]**, Elizabeth Denham, has issued her **[xxx]** verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a **[xxx]** agreement which took far too little account of the patients’ rights and their expectations of privacy.\n>\n> 开始精读：\n>\n> Any **[xxx]** assessment of the dangers / of the deal between Britain’s National Health Service (NHS) and DeepMind / must start by **[xxx]** / that both sides mean well. / DeepMind is one of the leading artificial intelligence (AI) companies / in the world. / The potential of this work applied to healthcare / is very great, / but it could also lead to / further concentration of power in the tech giants. / It is against that background / that the information **[xxx]**, Elizabeth Denham, / has issued her **[xxx]** verdict / against the Royal Free hospital trust under the NHS, / which handed over to DeepMind / the records of 1.6 million patients in 2015 / on the basis of a **[xxx]** agreement / which took far too little account / of the patients’ rights / and their expectations of privacy.\n>\n> 顺着英文顺序读：\n>\n> 任何 **[xxx]** 的风险评估 / 针对英国国民医疗服务体系（NHS）与DeepMind之间的合作 / 都必须从 **[xxx]** 开始 / 即双方出于好意。 / DeepMind是领先的人工智能（AI）公司之一 / 在世界范围内。 / 这项工作应用于医疗的潜力 / 非常大， / 但它也可能导致 / 权力进一步集中到科技巨头手中。 / 正是在这一背景下 / 信息 **[xxx]** Elizabeth Denham / 作出了她的 **[xxx]** 裁定 / 针对NHS下属的Royal Free医院机构， / 这家机构交给了DeepMind / 一百六十万名患者的记录，在2015年 / 依据的是一份 **[xxx]** 协议 / 这份协议考虑得实在太少 / 对于患者的权利 / 以及他们对隐私的期待。","contextRaw":"","html":"<h2>31题</h2>\n<blockquote>\n<p>What is true of the agreement between the NHS and DeepMind?<br />\n关于NHS与DeepMind之间的协议，哪个说法是正确的？</p>\n</blockquote>\n<p>题干问NHS与DeepMind之间的agreement。第1段把双方、合作和协议放在一起，先把这一整段读完，再看各项是说谁受到什么影响。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Any <span class=\"mask\">[xxx]</span> assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by <span class=\"mask\">[xxx]</span> that both sides mean well. DeepMind is one of the leading artificial intelligence (AI) companies in the world. The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants. It is against that background that the information <span class=\"mask\">[xxx]</span>, Elizabeth Denham, has issued her <span class=\"mask\">[xxx]</span> verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a <span class=\"mask\">[xxx]</span> agreement which took far too little account of the patients’ rights and their expectations of privacy.</p>\n<p>开始精读：</p>\n<p>Any <span class=\"mask\">[xxx]</span> assessment of the dangers / of the deal between Britain’s National Health Service (NHS) and DeepMind / must start by <span class=\"mask\">[xxx]</span> / that both sides mean well. / DeepMind is one of the leading artificial intelligence (AI) companies / in the world. / The potential of this work applied to healthcare / is very great, / but it could also lead to / further concentration of power in the tech giants. / It is aga 碰巧相似当成已经完全对上。\n\n**没有读清A说的是谁的期待时，能仅凭原文也出现expectations就直接确定或排除A吗？**\n\n还不能。期待没有被充分照顾能接上，但期待属于谁还没有接完整。\n\n这一轮不替 **[xxx]** 补出具体人或机构。原文明确的患者期待与A的所属者之间还隔着一步，先保留，稍后再比较。\n\n**第一轮判断：A保留。**","contextRaw":"","html":"<h3>A. It fell short of the <span class=\"mask\">[xxx]</span>’s expectations.</h3>\n<blockquote>\n<p>它没有达到 <span class=\"mask\">[xxx]</span> 的期待</p>\n</blockquote>\n<p>把A接回题干，它说的是：NHS与DeepMind之间的协议，没有满足 <span class=\"mask\">[xxx]</span> 所抱有的期待。</p>\n<p>A的fell short of说没有达到期待，原文末尾expectations of privacy也谈期待，而且前面有far too little，因此回看期待属于谁，以及协议在哪一点做得不够。</p>\n<blockquote>\n<p>It is against that background that the information <span class=\"mask\">[xxx]</span>, Elizabeth Denham, has issued her <span class=\"mask\">[xxx]</span> verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a <span class=\"mask\">[xxx]</span> agreement which took far too little account of the patients’ rights and their expectations of privacy.</p>\n</blockquote>\n<p>expectations of privacy前面的their接着patients，原文讲的是患者对隐私的期待，协议对这些期待考虑得太少。A的fell short of也有“未达到”的意思，和far too little在程度上接近。问题在于A把期待的主人放在 <span class=\"mask\">[xxx]</span>’s里，我们现在还没读出是谁；不能先把它当成患者，也不能反过来断定一定不是患者。与C相比，A少了一处能直接认出来的所属关系，所以先保留这个疑问，而不是把英文末尾碰巧相似当成已经完全对上。</p>\n<p><strong>没有读清A说的是谁的期待时，能仅凭原文也出现expectations就直接确定或排除A吗？</strong></p>\n<p>还不能。期待没有被充分照顾能接上，但期待属于谁还没有接完整。</p>\n<p>这一轮不替 <span class=\"mask\">[xxx]</span> 补出具体人或机构。原文明确的患者期待与A的所属者之间还隔着一步，先保留，稍后再比较。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[221.667,326.667,1333.333,555.0]],"questionRects":[[248.333,208.333,1125.0,48.333],[308.333,276.667,696.667,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first ch giants却让各家巨头彼此争斗，among把关系放在多家企业之间。集中与冲突不是同一个现象：即使权力集中到少数公司，也不能直接推出它们因此发生冲突。另外原句是could also lead to，谈可能的后果，B用caused断定已经造成冲突，又把可能性写成既成事实。两处差别都不取决于段末那个协议修饰词。</p>\n<p><strong>权力可能进一步集中到科技巨头手中，能直接改成巨头之间已经发生冲突吗？</strong></p>\n<p>不能。权力集中与企业间冲突不同，可能后果与已经发生也不同。</p>\n<p>B留下了tech giants，却改变了巨头在句子中的关系和事件的确定程度，不能只按同一名词判断。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[221.667,326.667,1333.333,555.0]],"questionRects":[[248.333,208.333,1125.0,48.333],[308.333,343.333,671.667,50.0]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的conflicts among tech giants与原文concentration of power in the tech giants都有tech giants，但前者说巨头之间发生什么，后者说权力向哪里集中，因此回看power这句话的主干。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","time","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"concentration of power in the tech giants","visibleOptionAnchor":"conflicts among tech giants"}}}},{"section":"31题","raw":"### C. It failed to pay due attention to patients’ rights.\n\n> 它未能充分关注患者的权利\n\n把C接回题干，它说的是：这项协议没有给予患者权利应有的重视。\n\nC的pay due attention说给应有的重视，原文took far too little account说考虑得太少；两者对同一对象都可描述重视不足，因此回看account of后面有没有patients’ rights。\n\n> the records of 1.6 million patients in 2015 on the basis of a **[xxx]** agreement which took far too little account of the patients’ rights and their expectations of privacy.\n\nwhich指向前面的agreement，took far too little account明确说这份协议考虑得不够，of后面第一项就是the patients’ rights。C用failed to接pay due attention，意思仍是没有达到应有的重视程度，而不是说患者根本没有权利。这里主体是协议，评价是关注不足，对象是患者权利，三点都能接上。原句还并列隐私期待，C只选其中患者权利这一项，并不等于否认另一项；题干问一个正确说法，不要求把所有并列内容全部写进同一选项。\n\n**协议对患者权利考虑得太少，是否就是没有给予这些权利应有的重视？**\n\n可以这样判断。两种表达保留的是同一主体、同一对象和同一种不足。\n\nC没有把不足夸成完全无视所有权利，也没有把患者换成合作机构。即使协议前面的修饰词没读清，这个评价仍写得很明确。先保留C。\n\n**第一轮判断：C保留。**","contextRaw":"","html":"<h3>C. It failed to pay due attention to patients’ rights.</h3>\n<blockquote>\n<p>它未能充分关注患者的权利</p>\n</blockquote>\n<p>把C接回题干，它说的是：这项协议没有给予患者权利应有的重视。</p>\n<p>C的pay due attention说给应有的重视，原文took far too little account说考虑得太少；两者对同一对象都可描述重视不足，因此回看account of后面有没有patients’ rights。</p>\n<blockquote>\n<p>the records of 1.6 million patients in 2015 on the basis of a <span class=\"mask\">[xxx]</span> agreement which took far too little account of the patients’ rights and their expectations of privacy.</p>\n</blockquote>\n<p>which指向前面的agreement，took far too little account明确说这份协议考虑得不够，of后面第一项就是the patients’ rights。C用failed to接pay due attention，意思仍是没有达到应有的重视程度，而不是说患者根本没有权利。这里主体是协议，评价是关注不足，对象是患者权利，三点都能接上。原句还并列隐私期待，C只选其中患者权利这一项，并不等于否认另一项；题干问一个正确说法，不要求把所有并列内容全部写进同一选项。</p>\n<p><strong>协议对患者权利考虑得太少，是否就是没有给予这些权利应有的重视？</strong></p>\n<p>可以这样判断。两种表达保留的是同一主体、同一对象和同一种不足。</p>\n<p>C没有把不足夸成完全无视所有权利，也没有把患者换成合作机构。即使协议前面的修饰词没读清，这个评价仍写得很明确。先保留C。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[221.667,326.667,1333.333,555.0]],"questionRects":[[248.333,208.333,1125.0,48.333],[308.333,411.667,831.667,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的pay due attention说给应有的重视，原文took far too little account说考虑得太少；两者对同一对象都可描述重视不足，因此回看account of后面有没有patients’ rights。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"took far too little account","visibleOptionAnchor":"pay due attention"}}}},{"section":"31题","raw":"### D. It put both sides into a dangerous situation.\n\n> 它使双方陷入危险处境\n\n把D接回题干，它说的是：这项协议让NHS和DeepMind两个合作方都陷入了危险。\n\nD的put both sides into a dangerous situation把双方都说成陷入危险，原文both sides mean well也出现双方，但说的是意图；因此先看双方的身份，再看后文具体担心谁的权利与什么权力变化。\n\n> Any **[xxx]** assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by **[xxx]** that both sides mean well.\n\n> The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.\n\nboth sides mean well只说明合作双方出发点是好的，不能拿“双方”这个词替后面的危险指定承受者。原文接着担忧的是权力集中到科技巨头手里，段末又具体落到患者权利与隐私期待；它没有把NHS与DeepMind同时安排在被这种危险损害的位置。D的put both sides into a dangerous situation把“这项合作存在风险”改成“两个合作机构都陷入危险”。尤其DeepMind所在的一方在权力集中描述中可能获得更多权力，不能径直把这种担忧改写为它也被协议置于危险中。\n\n**评估一项合作的风险，就必然是在说两个合作方都成了危险的承受者吗？**\n\n不是。合作有风险与双方都陷入危险，不是同一个范围的判断。\n\nD把风险影响的对象从具体的权利和权力关系移到了双方机构本身，还用both把两家都包进去，超过了这里所描述的后果。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. It put both sides into a dangerous situation.</h3>\n<blockquote>\n<p>它使双方陷入危险处境</p>\n</blockquote>\n<p>把D接回题干，它说的是：这项协议让NHS和DeepMind两个合作方都陷入了危险。</p>\n<p>D的put both sides into a dangerous situation把双方都说成陷入危险，原文both sides mean well也出现双方，但说的是意图；因此先看双方的身份，再看后文具体担心谁的权利与什么权力变化。</p>\n<blockquote>\n<p>Any <span class=\"mask\">[xxx]</span> assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by <span class=\"mask\">[xxx]</span> that both sides mean well.</p>\n</blockquote>\n<blockquote>\n<p>The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.</p>\n</blockquote>\n<p>both sides mean well只说明合作双方出发点是好的，不能拿“双方”这个词替后面的危险指定承受者。原文接着担忧的是权力集中到科技巨头手里，段末又具体落到患者权利与隐私期待；它没有把NHS与DeepMind同时安排在被这种危险损害的位置。D的put both sides into a dangerous situation把“这项合作存在风险”改成“两个合作机构都陷入危险”。尤其DeepMind所在的一方在权力集中描述中可能获得更多权力，不能径直把这种担忧改写为它也被协议置于危险中。</p>\n<p><strong>评估一项合作的风险，就必然是在说两个合作方都成了危险的承受者吗？</strong></p>\n<p>不是。合作有风险与双方都陷入危险，不是同一个范围的判断。</p>\n<p>D把风险影响的对象从具体的权利和权力关系移到了双方机构本身，还用both把两家都包进去，超过了这里所描述的后果。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[221.667,326.667,1333.333,555.0]],"questionRects":[[248.333,208.333,1125.0,48.333],[308.333,480.0,765.0,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"31","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的put both sides into a dangerous situation把双方都说成陷入危险，原文both sides mean well也出现双方，但说的是意图；因此先看双方的身份，再看后文具体担心谁的权利与什么权力变化。"],"evidenceParagraphPids":[0],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","scope","part_whole"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"both sides mean well","visibleOptionAnchor":"put both sides into a dangerous situation"}}}},{"section":"31题","raw":"### 31题第一次结果\n\n- A保留。\n- B排除。\n- C保留。\n- D排除。\n\nC明确接住患者权利受到的重视不足；A与“期待没有被充分顾及”相近，但期待的所属者还没有读清。B和D分别改换了风险的关系与承受对象。\n\n> **31题先保留A、C，暂时二选一。**","contextRaw":"","html":"<h3>31题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>C明确接住患者权利受到的重视不足；A与“期待没有被充分顾及”相近，但期待的所属者还没有读清。B和D分别改换了风险的关系与承受对象。</p>\n<blockquote>\n<p><strong>31题先保留A、C，暂时二选一。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[248.333,208.333,1125.0,48.333]],"scrollTarget":"auto","meta":{"kind":"result","qid":"31"}},{"section":"32题","raw":"## 32题\n\n> The NHS trust responded to Denham’s verdict with ______.  \n> NHS下属的这家机构如何回应Denham的裁定？\n\n题干问NHS trust对Denham’s verdict的回应。第1段已经出现裁定，往下到第2段就出现The NHS trust的反应。先完整读第2段，尤其区分DeepMind与NHS分别做了什么。\n\n> 原文参考：\n>\n> DeepMind has almost apologised. The NHS trust has **[xxx]** its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully **[xxx]** to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned. There are lessons about informed patient **[xxx]** to learn. But privacy is not the only angle in this case and not even the most important. Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it “controlled” the data and DeepMind merely “processed” it. But this distinction misses the point that it is processing and **[xxx]**, not the mere **[xxx]** of bits, that gives the data value.\n>\n> 开始精读：\n>\n> DeepMind has almost apologised. / The NHS trust has **[xxx]** its ways. / Further arrangements—and there may be many— / between the NHS and DeepMind / will be carefully **[xxx]** / to ensure that all necessary permissions / have been asked of patients / and all unnecessary data has been cleaned. / There are lessons about informed patient **[xxx]** to learn. / But privacy is not the only angle in this case / and not even the most important. / Ms Denham chose to concentrate the blame on the NHS trust, / since under existing law / it “controlled” the data / and DeepMind merely “processed” it. / But this distinction misses the point / that it is processing and **[xxx]**, / not the mere **[xxx]** of bits, / that gives the data value.\n>\n> 顺着英文顺序读：\n>\n> DeepMind几乎已经道歉。 / NHS下属机构已经 **[xxx]** 了自己的做法。 / 后续安排——而且可能还有很多—— / 在NHS与DeepMind之间的 / 将被仔细 **[xxx]** / 以确保所有必要的许可 / 都已向患者征求 / 且所有不必要的数据已被清理。 / 关于患者知情 **[xxx]**，有教训需要吸取。 / 但隐私不是这个案例中的唯一角度 / 甚至不是最重要的。 / Denham女士选择把责备集中在NHS下属机构， / 因为按照现行法律 / 它“控制”数据 / 而DeepMind只是“处理”数据。 / 但这种区分没有抓住这一点 / 即是处理和 **[xxx]**， / 而不是对比特的单纯 **[xxx]**， / 赋予数据价值。","contextRaw":"","html":"<h2>32题</h2>\n<blockquote>\n<p>The NHS trust responded to Denham’s verdict with ______.<br />\nNHS下属的这家机构如何回应Denham的裁定？</p>\n</blockquote>\n<p>题干问NHS trust对Denham’s verdict的回应。第1段已经出现裁定，往下到第2段就出现The NHS trust的反应。先完整读第2段，尤其区分DeepMind与NHS分别做了什么。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>DeepMind has almost apologised. The NHS trust has <span class=\"mask\">[xxx]</span> its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully <span class=\"mask\">[xxx]</span> to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned. There are lessons about informed patient <span class=\"mask\">[xxx]</span> to learn. But privacy is not the only angle in this case and not even the most important. Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it “controlled” the data and DeepMind merely “processed” it. But this distinction misses the point that it is processing and <span class=\"mask\">[xxx]</span>, not the mere <span class=\"mask\">[xxx]</span> of bits, that gives the data value.</p>\n<p>开始精读：</p>\n<p>DeepMind has almost apologised. / The NHS trust has <span class=\"mask\">[xxx]</span> its ways. / Further arrangements—and there may be many— / between the NHS and DeepMind / will be carefully <span class=\"mask\">[xxx]</span> / to ensure that all necessary permissions / have been asked of patients / and all unnecessary data has been cleaned. / There are lessons about informed patient <span class=\"mask\">[xxx]</span> to learn. / But privacy is not the only angle in this case / and not even the most important. / Ms Denham chose to concentrate the blame on the NHS trust, / since under existing law / it “controlled” the data / and DeepMind merely “processed” it. / But this distinction misses the point / that it is processing and <span class=\"mask\">[xxx]</span>, / not the mere <span class=\"mask\">[xxx]</span> of bits, / that gives the data value.</p>\n<p>顺着英文顺序读：</p>\n<p>DeepMind几乎已经道歉。 / NHS下属机构已经 <span class=\"mask\">[xxx]</span> 了自己的做法。 / 后续安排——而且可能还有很多—— / 在NHS与DeepMind之间的 / 将被仔细 <span class=\"mask\">[xxx]</span> / 以确保所有必要的许可 / 都已向患者征求 / 且所有不必要的数据已被清理。 / 关于患者知情 <span class=\"mask\">[xxx]</span>，有教训需要吸取。 / 但隐私不是这个案例中的唯一角度 / 甚至不是最重要的。 / Denham女士选择把责备集中在NHS下属机构， / 因为按照现行法律 / 它“控制”数据 / 而DeepMind只是“处理”数据。 / 但这种区分没有抓住这一点 / 即是处理和 <span class=\"mask\">[xxx]</span>， / 而不是对比特的单纯 <span class=\"mask\">[xxx]</span>， / 赋予数据价值。</p>\n</blockquote>\n","articleRects":[[221.667,888.333,1333.333,546.667]],"questionRects":[[248.333,615.0,1046.667,50.0]],"scrollTarget":"auto","meta":{"kind":"question","qid":"32"}},{"section":"32题","raw":"### A. empty promises\n\n> 空洞的承诺\n\n把A接回题干，它说的是：NHS机构用空洞承诺回应裁定，并没有落实相应的处理。\n\nA的empty promises说只有承诺没有实质内容，第2段all unnecessary data has been cleaned却提到数据处理，因此回看前面的许可要求与这项清理如何成为后续安排的检查内容。\n\n> The NHS trust has **[xxx]** its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully **[xxx]** to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.\n\nall unnecessary data has been cleaned与permissions have been asked并列，是后续安排要确保的两项具体处理。机构自身的动作有一处没读清，但作者没有停留在“将来会更好”的笼统许诺，而是继续把征求患者许可、清理不必要数据写出来。A的empty promises反而给这种回应加上“空洞、没有实际内容”的评价，把具体要求抹成没有落实意义的许诺。未来安排还需进一步检查，不等于现有回应已经被作者判定为虚假或敷衍；不能把will一见就读成只说不做。\n\n**后续还要检查许可与数据清理，能反过来说这些回应就是空洞承诺吗？**\n\n不能。继续检查具体处理，与断定只是空话不同。\n\nA把原文列出的实际整改事项换成了“没有实质内容”的评价，而这段所展示的回应方向是对这些事项作出处理。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. empty promises</h3>\n<blockquote>\n<p>空洞的承诺</p>\n</blockquote>\n<p>把A接回题干，它说的是：NHS机构用空洞承诺回应裁定，并没有落实相应的处理。</p>\n<p>A的empty promises说只有承诺没有实质内容，第2段all unnecessary data has been cleaned却提到数据处理，因此回看前面的许可要求与这项清理如何成为后续安排的检查内容。</p>\n<blockquote>\n<p>The NHS trust has <span class=\"mask\">[xxx]</span> its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully <span class=\"mask\">[xxx]</span> to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.</p>\n</blockquote>\n<p>all unnecessary data has been cleaned与permissions have been asked并列，是后续安排要确保的两项具体处理。机构自身的动作有一处没读清，但作者没有停留在“将来会更好”的笼统许诺，而是继续把征求患者许可、清理不必要数据写出来。A的empty promises反而给这种回应加上“空洞、没有实际内容”的评价，把具体要求抹成没有落实意义的许诺。未来安排还需进一步检查，不等于现有回应已经被作者判定为虚假或敷衍；不能把will一见就读成只说不做。</p>\n<p><strong>后续还要检查许可与数据清理，能反过来说这些回应就是空洞承诺吗？</strong></p>\n<p>不能。继续检查具体处理，与断定只是空话不同。</p>\n<p>A把原文列出的实际整改事项换成了“没有实质内容”的评价，而这段所展示的回应方向是对这些事项作出处理。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[221.667,888.333,1333.333,546.667]],"questionRects":[[248.333,615.0,1046.667,50.0],[308.333,685.0,315.0,46.667]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的empty promises说只有承诺没有实质内容，第2段all unnecessary data has been cleaned却提到数据处理，因此回看前面的许可要求与这项清理如何成为后续安排的检查内容。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"all unnecessary data has been cleaned","visibleOptionAnchor":"empty promises"}}}},{"section":"32题","raw":"### B. tough resistance\n\n> 强硬抵制\n\n把B接回题干，它说的是：NHS机构强硬抵制Denham的裁定。\n\nB的tough resistance意味着对要求强硬反抗，原文ensure that all necessary permissions谈确保必要许可；二者都是对裁定后要求的反应，因此回看机构是拒绝要求，还是把要求纳入后续安排。\n\n> The NHS trust has **[xxx]** its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully **[xxx]** to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.\n\nensure that all necessary permissions把患者许可设为后续合作需要确保的事项，清理不必要数据也同样列进安排。tough resistance则要求机构对这些要求采取拒不接受、强硬对抗的方向。原文说的不是“无论裁定如何，继续不问许可地使用数据”，而是在继续合作时对许可和清理提出明确约束。前一句动词没有读清，后一句的to ensure仍把回应所要实现的事情写了出来，不能将配合这些要求的安排说成对要求的强硬抵制。\n\nB把按要求处理换成了拒绝要求，动作方向相反。\n\n**把征求患者许可和清理数据列为后续合作要确保的事项，是在强硬拒绝这些要求吗？**\n\n不是。它是在按这些要求安排后续合作。\n\nB与这一方向相反。不要因为第1段有负面裁定，就自动替被裁定的一方补出对抗性的回应。\n\n**第一轮判断：B排除。**","contextRaw":"","html":"<h3>B. tough resistance</h3>\n<blockquote>\n<p>强硬抵制</p>\n</blockquote>\n<p>把B接回题干，它说的是：NHS机构强硬抵制Denham的裁定。</p>\n<p>B的tough resistance意味着对要求强硬反抗，原文ensure that all necessary permissions谈确保必要许可；二者都是对裁定后要求的反应，因此回看机构是拒绝要求，还是把要求纳入后续安排。</p>\n<blockquote>\n<p>The NHS trust has <span class=\"mask\">[xxx]</span> its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully <span class=\"mask\">[xxx]</span> to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.</p>\n</blockquote>\n<p>ensure that all necessary permissions把患者许可设为后续合作需要确保的事项，清理不必要数据也同样列进安排。tough resistance则要求机构对这些要求采取拒不接受、强硬对抗的方向。原文说的不是“无论裁定如何，继续不问许可地使用数据”，而是在继续合作时对许可和清理提出明确约束。前一句动词没有读清，后一句的to ensure仍把回应所要实现的事情写了出来，不能将配合这些要求的安排说成对要求的强硬抵制。</p>\n<p>B把按要求处理换成了拒绝要求，动作方向相反。</p>\n<p><strong>把征求患者许可和清理数据列为后续合作要确保的事项，是在强硬拒绝这些要求吗？</strong></p>\n<p>不是。它是在按这些要求安排后续合作。</p>\n<p>B与这一方向相反。不要因为第1段有负面裁定，就自动替被裁定的一方补出对抗性的回应。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[221.667,888.333,1333.333,546.667]],"questionRects":[[248.333,615.0,1046.667,50.0],[308.333,751.667,318.333,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的tough resistance意味着对要求强硬反抗，原文ensure that all necessary permissions谈确保必要许可；二者都是对裁定后要求的反应，因此回看机构是拒绝要求，还是把要求纳入后续安排。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","negation"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"ensure that all necessary permissions","visibleOptionAnchor":"tough resistance"}}}},{"section":"32题","raw":"### C. **[xxx]** apologies\n\n> **[xxx]** 的道歉\n\n把C接回题干，它说的是：NHS机构以 **[xxx]** 的道歉回应裁定。\n\nC的apologies对应第2段开头apologised的道歉动作，但完整原句是DeepMind has almost apologised，因此回看该句主语，再与题干的NHS trust比较。\n\n> DeepMind has almost apologised. The NHS trust has **[xxx]** its ways.\n\nDeepMind has almost apologised的主语是DeepMind；句号之后才另起The NHS trust，讲另外一方的做法。C的apologies虽然抓住了道歉这个动作，却接在题干NHS trust responded后面，将DeepMind一侧的反应移给NHS。修饰道歉的词认不认识，都不能改变这个主体错位。此外almost本身还限制了apologised，不能把“几乎已经道歉”随意说成一次确定而充分的道歉。两家合作不等于两家的回应可以互换。\n\n**道歉动作前面写的是DeepMind，能把它直接接给题干问的NHS机构吗？**\n\n不能。两个句子分别说两个主语，不能因为它们是合作方就交换各自的动作。\n\nC的问题先出在谁作出回应，而不是道歉的形容词是否认识。把题干主语带着读到原句，便能发现这项接错了人。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. <span class=\"mask\">[xxx]</span> apologies</h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 的道歉</p>\n</blockquote>\n<p>把C接回题干，它说的是：NHS机构以 <span class=\"mask\">[xxx]</span> 的道歉回应裁定。</p>\n<p>C的apologies对应第2段开头apologised的道歉动作，但完整原句是DeepMind has almost apologised，因此回看该句主语，再与题干的NHS trust比较。</p>\n<blockquote>\n<p>DeepMind has almost apologised. The NHS trust has <span class=\"mask\">[xxx]</span> its ways.</p>\n</blockquote>\n<p>DeepMind has almost apologised的主语是DeepMind；句号之后才另起The NHS trust，讲另外一方的做法。C的apologies虽然抓住了道歉这个动作，却接在题干NHS trust responded后面，将DeepMind一侧的反应移给NHS。修饰道歉的词认不认识，都不能改变这个主体错位。此外almost本身还限制了apologised，不能把“几乎已经道歉”随意说成一次确定而充分的道歉。两家合作不等于两家的回应可以互换。</p>\n<p><strong>道歉动作前面写的是DeepMind，能把它直接接给题干问的NHS机构吗？</strong></p>\n<p>不能。两个句子分别说两个主语，不能因为它们是合作方就交换各自的动作。</p>\n<p>C的问题先出在谁作出回应，而不是道歉的形容词是否认识。把题干主语带着读到原句，便能发现这项接错了人。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[221.667,888.333,1333.333,546.667]],"questionRects":[[248.333,615.0,1046.667,50.0],[308.333,820.0,336.667,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的apologies对应第2段开头apologised的道歉动作，但完整原句是DeepMind has almost apologised，因此回看该句主语，再与题干的NHS trust比较。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["subject","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"DeepMind has almost apologised","visibleOptionAnchor":"apologies"}}}},{"section":"32题","raw":"### D. necessary adjustments\n\n> 必要的调整\n\n把D接回题干，它说的是：NHS机构作出必要调整，以回应Denham的裁定。\n\nD的necessary adjustments说做法上的必要调整，原文permissions have been asked以及后面的数据清理都是合作安排中实际要处理的事项，因此回看它们怎样接着NHS trust的反应。\n\n> The NHS trust has **[xxx]** its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully **[xxx]** to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.\n\npermissions have been asked所说的患者许可，加上不必要数据has been cleaned，是这段明确列出的变化内容。D的necessary adjustments不要求我们把第一句的动词逐字翻出来，而是把这些做法归到必要调整：合作并非继续照旧，许可与数据处理都被放进后续要求。D也没有声称所有更深的问题已经彻底解决；它回答的只是机构怎样回应眼前裁定。后半段作者另说privacy不是唯一角度，不会取消前面这层回应本身。\n\n两者所说的对象都是合作做法的调整，而不是单纯的口头致歉。\n\n**回应中涉及征求许可、清理数据等具体做法，是否可以称为必要调整？**\n\n可以。这些都是针对合作方式和数据处理作出的实际安排。\n\nD既没有把道歉动作移错主语，也没有把后续处理说成拒绝裁定，更没有夸大为解决全部问题，因此能够保留。\n\n**第一轮判断：D保留。**","contextRaw":"","html":"<h3>D. necessary adjustments</h3>\n<blockquote>\n<p>必要的调整</p>\n</blockquote>\n<p>把D接回题干，它说的是：NHS机构作出必要调整，以回应Denham的裁定。</p>\n<p>D的necessary adjustments说做法上的必要调整，原文permissions have been asked以及后面的数据清理都是合作安排中实际要处理的事项，因此回看它们怎样接着NHS trust的反应。</p>\n<blockquote>\n<p>The NHS trust has <span class=\"mask\">[xxx]</span> its ways. Further arrangements—and there may be many—between the NHS and DeepMind will be carefully <span class=\"mask\">[xxx]</span> to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.</p>\n</blockquote>\n<p>permissions have been asked所说的患者许可，加上不必要数据has been cleaned，是这段明确列出的变化内容。D的necessary adjustments不要求我们把第一句的动词逐字翻出来，而是把这些做法归到必要调整：合作并非继续照旧，许可与数据处理都被放进后续要求。D也没有声称所有更深的问题已经彻底解决；它回答的只是机构怎样回应眼前裁定。后半段作者另说privacy不是唯一角度，不会取消前面这层回应本身。</p>\n<p>两者所说的对象都是合作做法的调整，而不是单纯的口头致歉。</p>\n<p><strong>回应中涉及征求许可、清理数据等具体做法，是否可以称为必要调整？</strong></p>\n<p>可以。这些都是针对合作方式和数据处理作出的实际安排。</p>\n<p>D既没有把道歉动作移错主语，也没有把后续处理说成拒绝裁定，更没有夸大为解决全部问题，因此能够保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[221.667,888.333,1333.333,546.667]],"questionRects":[[248.333,615.0,1046.667,50.0],[308.333,888.333,415.0,46.667]],"scrollTarget":"auto","meta":{"kind":"option","qid":"32","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的necessary adjustments说做法上的必要调整，原文permissions have been asked以及后面的数据清理都是合作安排中实际要处理的事项，因此回看它们怎样接着NHS trust的反应。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"permissions have been asked","visibleOptionAnchor":"necessary adjustments"}}}},{"section":"32题","raw":"### 32题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n道歉一句的主语是DeepMind，不是题干问的NHS。NHS后面接的是许可、清理数据等做法，D能够承接这种回应。\n\n> **32题选D。**","contextRaw":"","html":"<h3>32题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>道歉一句的主语是DeepMind，不是题干问的NHS。NHS后面接的是许可、清理数据等做法，D能够承接这种回应。</p>\n<blockquote>\n<p><strong>32题选D。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[248.333,615.0,1046.667,50.0]],"scrollTarget":"auto","meta":{"kind":"result","qid":"32"}},{"section":"33题","raw":"## 33题\n\n> The author argues in Paragraph 2 that ______.  \n> 作者在第2段主张什么？\n\n题干已经限定Paragraph 2。第2段在32题完整读过，这次问的是作者在这一段的主张，不只是机构回应。回看But之后作者怎样从隐私问题往下说，尤其是最后一组“是……而不是……”的区分。","contextRaw":"","html":"<h2>33题</h2>\n<blockquote>\n<p>The author argues in Paragraph 2 that ______.<br />\n作者在第2段主张什么？</p>\n</blockquote>\n<p>题干已经限定Paragraph 2。第2段在32题完整读过，这次问的是作者在这一段的主张，不只是机构回应。回看But之后作者怎样从隐私问题往下说，尤其是最后一组“是……而不是……”的区分。</p>\n","articleRects":[[221.667,888.333,1333.333,546.667]],"questionRects":[[248.333,1023.333,825.0,48.333]],"scrollTarget":"auto","meta":{"kind":"question","qid":"33"}},{"section":"33题","raw":"### A. privacy protection must be secured at all costs\n\n> 隐私保护必须不惜一切代价得到保障\n\n把A接回题干，它说的是：作者主张，无论付出什么代价，都必须保障隐私。\n\nA的at all costs给隐私保护放上不惜一切的程度，原文not even the most important却在限定隐私的地位；它们都在评价隐私有多重要，因此回看But之后的完整判断。\n\n> But privacy is not the only angle in this case and not even the most important.\n\nnot even the most important说隐私甚至不是这一案例最重要的角度，前半句还说它不是唯一角度。A的at all costs则把隐私保障写成可以压倒其他考虑、不惜任何代价的要求。原文当然没有否定患者隐私值得保护，前面征求许可也说明这件事需要做；但“需要做”并不自动成为“其他任何代价都可以不顾”。这一题问作者的主张，不能把他已经往后退的一层关注反而推到绝对优先的位置。\n\n这里的程度从需要保障扩大成不计任何代价。\n\n**作者说隐私甚至不是最重要的角度，能读成他要求为了隐私不惜一切代价吗？**\n\n不能。需要关注隐私与让它压倒一切，不是同一个程度。\n\nA把原文的限定改成绝对化要求，还忽略But将讨论引向另外层面的作用，因此排除。\n\n**第一轮判断：A排除。**","contextRaw":"","html":"<h3>A. privacy protection must be secured at all costs</h3>\n<blockquote>\n<p>隐私保护必须不惜一切代价得到保障</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者主张，无论付出什么代价，都必须保障隐私。</p>\n<p>A的at all costs给隐私保护放上不惜一切的程度，原文not even the most important却在限定隐私的地位；它们都在评价隐私有多重要，因此回看But之后的完整判断。</p>\n<blockquote>\n<p>But privacy is not the only angle in this case and not even the most important.</p>\n</blockquote>\n<p>not even the most important说隐私甚至不是这一案例最重要的角度，前半句还说它不是唯一角度。A的at all costs则把隐私保障写成可以压倒其他考虑、不惜任何代价的要求。原文当然没有否定患者隐私值得保护，前面征求许可也说明这件事需要做；但“需要做”并不自动成为“其他任何代价都可以不顾”。这一题问作者的主张，不能把他已经往后退的一层关注反而推到绝对优先的位置。</p>\n<p>这里的程度从需要保障扩大成不计任何代价。</p>\n<p><strong>作者说隐私甚至不是最重要的角度，能读成他要求为了隐私不惜一切代价吗？</strong></p>\n<p>不能。需要关注隐私与让它压倒一切，不是同一个程度。</p>\n<p>A把原文的限定改成绝对化要求，还忽略But将讨论引向另外层面的作用，因此排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[221.667,888.333,1333.333,546.667]],"questionRects":[[248.333,1023.333,825.0,48.333],[308.333,1091.667,816.667,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A的at all costs给隐私保护放上不惜一切的程度，原文not even the most important却在限定隐私的地位；它们都在评价隐私有多重要，因此回看But之后的完整判断。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["degree","negation","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"not even the most important","visibleOptionAnchor":"at all costs"}}}},{"section":"33题","raw":"### B. the value of data comes from the processing of it\n\n> 数据的价值来自对数据的处理\n\n把B接回题干，它说的是：作者主张，数据之所以获得价值，在于对它进行处理。\n\nB的comes from the processing说价值从处理而来，原文it is processing在强调谁赋予数据价值，两者都在谈价值来源，因此把末句的that gives the data value接回强调部分读。\n\n> But this distinction misses the point that it is processing and **[xxx]**, not the mere **[xxx]** of bits, that gives the data value.\n\nit is processing后面虽然还有一个并列词没读清，但强调结构的结尾that gives the data value已经明确把“处理”放在赋予价值的一边。B的comes from the processing将这种“某种活动给予价值”改写成“价值来自某种活动”，因果方向没有反转。B没有写only，也没有说除此之外再无其他活动，因此不能因原句还有and就要求B把两个并列项目都列全。真正的对比是价值不在于一个表面身份或简单地拿着数据，而在于对数据做什么。\n\n**原文明确把processing列在赋予数据价值的一边，B是否保留了这个价值来源？**\n\n可以这样判断。B没有增加“唯一”二字，只把原句已经肯定的处理活动接成价值来源。\n\n这一句正是作者用But纠正前面区分的地方。B回答的是他的纠正性判断，不是把监管者的归责方式当作作者自己的全部结论。\n\n**第一轮判断：B保留。**","contextRaw":"","html":"<h3>B. the value of data comes from the processing of it</h3>\n<blockquote>\n<p>数据的价值来自对数据的处理</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者主张，数据之所以获得价值，在于对它进行处理。</p>\n<p>B的comes from the processing说价值从处理而来，原文it is processing在强调谁赋予数据价值，两者都在谈价值来源，因此把末句的that gives the data value接回强调部分读。</p>\n<blockquote>\n<p>But this distinction misses the point that it is processing and <span class=\"mask\">[xxx]</span>, not the mere <span class=\"mask\">[xxx]</span> of bits, that gives the data value.</p>\n</blockquote>\n<p>it is processing后面虽然还有一个并列词没读清，但强调结构的结尾that gives the data value已经明确把“处理”放在赋予价值的一边。B的comes from the processing将这种“某种活动给予价值”改写成“价值来自某种活动”，因果方向没有反转。B没有写only，也没有说除此之外再无其他活动，因此不能因原句还有and就要求B把两个并列项目都列全。真正的对比是价值不在于一个表面身份或简单地拿着数据，而在于对数据做什么。</p>\n<p><strong>原文明确把processing列在赋予数据价值的一边，B是否保留了这个价值来源？</strong></p>\n<p>可以这样判断。B没有增加“唯一”二字，只把原句已经肯定的处理活动接成价值来源。</p>\n<p>这一句正是作者用But纠正前面区分的地方。B回答的是他的纠正性判断，不是把监管者的归责方式当作作者自己的全部结论。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[221.667,888.333,1333.333,546.667]],"questionRects":[[248.333,1023.333,825.0,48.333],[308.333,1158.333,865.0,50.0]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B的comes from the processing说价值从处理而来，原文it is processing在强调谁赋予数据价值，两者都在谈价值来源，因此把末句的that gives the data value接回强调部分读。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"it is processing","visibleOptionAnchor":"comes from the processing"}}}},{"section":"33题","raw":"### C. making profits from patients’ data is illegal\n\n> 从患者数据中获利是违法的\n\n把C接回题干，它说的是：作者主张，只要从患者数据里获取利润，就属于违法。\n\nC的making profits谈获利是否合法，第2段under existing law确实出现法律，因此回看法律在这里区分的是什么行为，以及作者随后如何回应。\n\n> Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it “controlled” the data and DeepMind merely “processed” it. But this distinction misses the point that it is processing and **[xxx]**, not the mere **[xxx]** of bits, that gives the data value.\n\nunder existing law后面区分的是NHS控制数据、DeepMind处理数据，解释Denham为什么把责备集中在NHS。作者接着说这一区分没抓住赋予数据价值的活动，并没有在这里把making profits设成一律违法的行为。C把监管归责的控制与处理之分，改写成利润合法性的判断；又把作者讨论“价值怎么产生”，读成他禁止一切获利。value不是illegal的同义表达，描述数据有价值也不等于宣布取得这种价值就是犯罪。\n\n**文中讨论现有法律怎样区分控制与处理，就能推出凡从患者数据获利都违法吗？**\n\n不能。法律在这一句解释的是归责，而C另外加上了获利一律违法的判断。\n\nC既换了被讨论的行为，也把一项特定案件中的区分扩大为普遍禁令，不能从existing law几个字跳到这个结论。\n\n**第一轮判断：C排除。**","contextRaw":"","html":"<h3>C. making profits from patients’ data is illegal</h3>\n<blockquote>\n<p>从患者数据中获利是违法的</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者主张，只要从患者数据里获取利润，就属于违法。</p>\n<p>C的making profits谈获利是否合法，第2段under existing law确实出现法律，因此回看法律在这里区分的是什么行为，以及作者随后如何回应。</p>\n<blockquote>\n<p>Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it “controlled” the data and DeepMind merely “processed” it. But this distinction misses the point that it is processing and <span class=\"mask\">[xxx]</span>, not the mere <span class=\"mask\">[xxx]</span> of bits, that gives the data value.</p>\n</blockquote>\n<p>under existing law后面区分的是NHS控制数据、DeepMind处理数据，解释Denham为什么把责备集中在NHS。作者接着说这一区分没抓住赋予数据价值的活动，并没有在这里把making profits设成一律违法的行为。C把监管归责的控制与处理之分，改写成利润合法性的判断；又把作者讨论“价值怎么产生”，读成他禁止一切获利。value不是illegal的同义表达，描述数据有价值也不等于宣布取得这种价值就是犯罪。</p>\n<p><strong>文中讨论现有法律怎样区分控制与处理，就能推出凡从患者数据获利都违法吗？</strong></p>\n<p>不能。法律在这一句解释的是归责，而C另外加上了获利一律违法的判断。</p>\n<p>C既换了被讨论的行为，也把一项特定案件中的区分扩大为普遍禁令，不能从existing law几个字跳到这个结论。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[221.667,888.333,1333.333,546.667]],"questionRects":[[248.333,1023.333,825.0,48.333],[308.333,1226.667,763.333,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C的making profits谈获利是否合法，第2段under existing law确实出现法律，因此回看法律在这里区分的是什么行为，以及作者随后如何回应。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","scope","relationship_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"under existing law","visibleOptionAnchor":"making profits"}}}},{"section":"33题","raw":"### D. **[xxx]** patients’ data is worse than selling it\n\n> **[xxx]** 患者数据比出售数据更糟\n\n把D接回题干，它说的是：作者认为，**[xxx]** 患者数据这种行为比出售数据更糟糕。\n\nD的worse than selling it要求比较两种行为的坏处，第2段gives the data value却比较什么使数据有价值；两边都是数据行为的区分，因此回看作者比较所用的标准。\n\n> But this distinction misses the point that it is processing and **[xxx]**, not the mere **[xxx]** of bits, that gives the data value.\n\ngives the data value问的是价值由什么活动产生，原句用it is和not把赋予价值的一边与另一边区分开。D的worse than selling it则问哪一种行为更糟，而且把selling设为明确比较项。就算D开头的动作暂时不知道，后面的“比出售更糟”也已经加进了坏处高低的排序。原文在这里不是说“处理比出售更坏”，也不是给两种隐私侵害排严重程度；它在解释把责任只放在控制者身上为什么遗漏了处理的意义。\n\n**区分什么活动赋予数据价值，等于给某个行为与出售数据排一个谁更糟的次序吗？**\n\n不等于。价值来源的区分，与坏处程度的比较，不是同一个问题。\n\nD的前半个动作不认识，并不妨碍看出后半句添加了selling和worse的比较框架，而这一框架不是作者此处使用的标准。\n\n**第一轮判断：D排除。**","contextRaw":"","html":"<h3>D. <span class=\"mask\">[xxx]</span> patients’ data is worse than selling it</h3>\n<blockquote>\n<p><span class=\"mask\">[xxx]</span> 患者数据比出售数据更糟</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为，<span class=\"mask\">[xxx]</span> 患者数据这种行为比出售数据更糟糕。</p>\n<p>D的worse than selling it要求比较两种行为的坏处，第2段gives the data value却比较什么使数据有价值；两边都是数据行为的区分，因此回看作者比较所用的标准。</p>\n<blockquote>\n<p>But this distinction misses the point that it is processing and <span class=\"mask\">[xxx]</span>, not the mere <span class=\"mask\">[xxx]</span> of bits, that gives the data value.</p>\n</blockquote>\n<p>gives the data value问的是价值由什么活动产生，原句用it is和not把赋予价值的一边与另一边区分开。D的worse than selling it则问哪一种行为更糟，而且把selling设为明确比较项。就算D开头的动作暂时不知道，后面的“比出售更糟”也已经加进了坏处高低的排序。原文在这里不是说“处理比出售更坏”，也不是给两种隐私侵害排严重程度；它在解释把责任只放在控制者身上为什么遗漏了处理的意义。</p>\n<p><strong>区分什么活动赋予数据价值，等于给某个行为与出售数据排一个谁更糟的次序吗？</strong></p>\n<p>不等于。价值来源的区分，与坏处程度的比较，不是同一个问题。</p>\n<p>D的前半个动作不认识，并不妨碍看出后半句添加了selling和worse的比较框架，而这一框架不是作者此处使用的标准。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[221.667,888.333,1333.333,546.667]],"questionRects":[[248.333,1023.333,825.0,48.333],[308.333,1295.0,790.0,48.333]],"scrollTarget":"auto","meta":{"kind":"option","qid":"33","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D的worse than selling it要求比较两种行为的坏处，第2段gives the data value却比较什么使数据有价值；两边都是数据行为的区分，因此回看作者比较所用的标准。"],"evidenceParagraphPids":[1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","relationship_direction","degree"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"gives the data value","visibleOptionAnchor":"worse than selling it"}}}},{"section":"33题","raw":"### 33题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\nA把隐私放到了不惜一切的位置，C添加获利违法的普遍判断，D改成坏处程度比较。B保留作者明确强调的“处理赋予数据价值”。\n\n> **33题选B。**","contextRaw":"","html":"<h3>33题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>A把隐私放到了不惜一切的位置，C添加获利违法的普遍判断，D改成坏处程度比较。B保留作者明确强调的“处理赋予数据价值”。</p>\n<blockquote>\n<p><strong>33题选B。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[[248.333,1023.333,825.0,48.333]],"scrollTarget":"auto","meta":{"kind":"result","qid":"33"}},{"section":"34题","raw":"## 34题\n\n> According to the last paragraph, the real worry arising from this deal is ______.  \n> 根据最后一段，这项合作带来的真正担忧是什么？\n\n题干明确写the last paragraph，直接回到第4段。real worry问真正的担忧，不是任意一个负面词。先读完整段，注意This practice does not address与What matters怎样把讨论继续往前推。\n\n> 原文参考：\n>\n> The use of privacy law to **[xxx]** the tech giants in this instance feels slightly **[xxx]**. This practice does not address the real worry. It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives. What matters is that they will belong to a private monopoly which developed them using public resources. If software promises to save lives on the scale that drugs now can, big data may be expected to behave as big pharma has done. We are still at the beginning of this revolution and small choices now may turn out to have **[xxx]** consequences later. A long struggle will be needed to avoid a future of digital **[xxx]**. Ms Denham’s report is a welcome start.\n>\n> 开始精读：\n>\n> The use of privacy law / to **[xxx]** the tech giants in this instance / feels slightly **[xxx]**. / This practice does not address the real worry. / It is not enough to say / that the algorithms DeepMind develops / will benefit patients and save lives. / What matters is / that they will belong to a private monopoly / which developed them using public resources. / If software promises to save lives / on the scale that drugs now can, / big data may be expected / to behave as big pharma has done. / We are still at the beginning of this revolution / and small choices now / may turn out to have **[xxx]** consequences later. / A long struggle will be needed / to avoid a future of digital **[xxx]**. / Ms Denham’s report is a welcome start.\n>\n> 顺着英文顺序读：\n>\n> 隐私法的使用 / 在这个案例中用来 **[xxx]** 科技巨头 / 感觉有些 **[xxx]**。 / 这种做法没有处理真正的担忧。 / 仅仅说这些还不够 / 即DeepMind开发的算法 / 将使患者受益并挽救生命。 / 重要的是 / 它们将属于一个私人垄断企业 / 这个企业利用公共资源开发了它们。 / 如果软件承诺挽救生命 / 达到药物现在能够达到的规模， / 大数据可能被期待 / 像大型制药企业已经做过的那样行事。 /
