<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 31题题干\n\n**The author mentions two books in Paragraph 1 to present ______.**\n\n> 作者在第1段提到两本书，是为了呈现什么？\n\n题型：**例子作用题**。","articleRects":[],"questionRects":[[226,190,915,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"31"},"html":"<h2>31题题干</h2>\n<p><strong>The author mentions two books in Paragraph 1 to present ______.</strong></p>\n<blockquote><p>作者在第1段提到两本书，是为了呈现什么？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n"},{"section":"先读题干","raw":"## 32题题干\n\n**Why did Waterstones shops retire PRH books to their relevant sections?**\n\n> 水石书店为什么把企鹅兰登书屋的书撤回各自所属的分区？\n\n题型：**原因题**。","articleRects":[],"questionRects":[[226,570,1135,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"32"},"html":"<h2>32题题干</h2>\n<p><strong>Why did Waterstones shops retire PRH books to their relevant sections?</strong></p>\n<blockquote><p>水石书店为什么把企鹅兰登书屋的书撤回各自所属的分区？</p>\n</blockquote>\n<p>题型：<strong>原因题</strong>。</p>\n"},{"section":"先读题干","raw":"## 33题题干\n\n**What message does the spokesperson for Waterstones seem to convey?**\n\n> 水石书店的发言人似乎想传达什么信息？\n\n题型：**人物表态推断题**。","articleRects":[],"questionRects":[[226,951,1129,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"33"},"html":"<h2>33题题干</h2>\n<p><strong>What message does the spokesperson for Waterstones seem to convey?</strong></p>\n<blockquote><p>水石书店的发言人似乎想传达什么信息？</p>\n</blockquote>\n<p>题型：<strong>人物表态推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 34题题干\n\n**What can be one consequence of the current dispute?**\n\n> 当前这场纠纷可能产生什么后果？\n\n题型：**后果推断题**。","articleRects":[],"questionRects":[[226,1331,855,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"34"},"html":"<h2>34题题干</h2>\n<p><strong>What can be one consequence of the current dispute?</strong></p>\n<blockquote><p>当前这场纠纷可能产生什么后果？</p>\n</blockquote>\n<p>题型：<strong>后果推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 35题题干\n\n**Which of the following statements best represents Lownie’s view?**\n\n> 下列哪一说法最能代表劳尼的观点？\n\n题型：**人物观点题**。","articleRects":[],"questionRects":[[226,1712,1048,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"35"},"html":"<h2>35题题干</h2>\n<p><strong>Which of the following statements best represents Lownie’s view?</strong></p>\n<blockquote><p>下列哪一说法最能代表劳尼的观点？</p>\n</blockquote>\n<p>题型：<strong>人物观点题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but, despite, After all |\n| 态度词／评价词 | 先抓个大概好坏 | good, busy, interesting |\n| 动作词 | 先看谁做了什么 | remove, trade, promoting |\n| 结果词 | 看最后出了什么事 | reduction, limitations, conformity |\n| 重复主题词 | 大概知道老在说什么 | publishers, books, authors |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>but, despite, After all</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>good, busy, interesting</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>remove, trade, promoting</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>reduction, limitations, conformity</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>publishers, books, authors</td></tr></tbody></table>\n"},{"section":"读文章","raw":"If you’re heading for your nearest branch of Waterstones, the biggest book **[xxx]** in the UK, in search of the Duchess of Sussex’s new children’s book The Bench, you might have to be prepared to hunt around a bit; the same may be true of The President’s Daughter, the new **[xxx]** by Bill Clinton and James Patterson. Both of these books are published next week by Penguin Random House (PRH) , a company currently involved in a stand-off with Waterstones.","articleRects":[[274,282,1122,38],[202,330,1194,36],[204,372,1191,46],[202,423,1193,38],[202,470,1194,37],[202,515,1180,39],[426,538,11,15]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>If you’re heading for your nearest branch of Waterstones, the biggest book <strong>[xxx]</strong> in the UK, in search of the Duchess of Sussex’s new children’s book The Bench, you might have to be prepared to hunt around a bit; the same may be true of The President’s Daughter, the new <strong>[xxx]</strong> by Bill Clinton and James Patterson. Both of these books are published next week by Penguin Random House (PRH) , a company currently involved in a stand-off with Waterstones.</p>\n</div></div>"},{"section":"读文章","raw":"If you’re heading for your nearest branch of Waterstones, / the biggest book **[xxx]** in the UK, / in search of the Duchess of Sussex’s new children’s book The Bench, / you might have to be prepared to hunt around a bit; / the same may be true of The President’s Daughter, / the new **[xxx]** by Bill Clinton and James Patterson. / Both of these books are published next week by Penguin Random House (PRH) , / a company currently involved in a stand-off with Waterston 择和不同的声音、出自小出版商；结尾还有我们将看到是否、那种多样性成为牺牲品、我们将看到是否、那种多样性成为牺牲品。</p>\n<p>到这里还不能自然地说清楚：两家企业的争议怎样影响图书和作者，发言人的说法与销售情况有什么联系，结尾为何转向出版业的规模。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形 .\n> \n> 开始精读：\n> \n> If you’re heading for your nearest branch of Waterstones, / the biggest book **[xxx]** in the UK, / in search of the Duchess of Sussex’s new children’s book The Bench, / you might have to be prepared to hunt around a bit; / the same may be true of The President’s Daughter, / the new **[xxx]** by Bill Clinton and James Patterson. / Both of these books are published next week by Penguin Random House (PRH) , / a company currently involved in a stand-off with Waterstones.\n> \n> 如果你正前往离你最近的水石书店分店， / 这家英国最大的图书**[xxx]**， / 寻找苏塞克斯公爵夫人的新儿童读物《长椅》， / 你可能得准备好四下找一找； / 《总统的女儿》可能也是如此， / 这是比尔·克林顿和詹姆斯·帕特森的新**[xxx]**。 / 这两本书都将在下周由企鹅兰登书屋出版， / 这家公司目前正与水石书店僵持不下。\n\n空格要说明作者为什么把这两本书放在开头，要把寻找两本书的情景与段末关于企鹅兰登书屋和水石书店的叙述连起来，不能只概括两本书的内容。\n\n接下来按A—D逐项看。","articleRects":[[274,282,1122,38],[202,330,1194,36],[204,372,1191,46],[202,423,1193,38],[202,470,1194,37],[202,515,1180,39],[426,538,11,15]],"questionRects":[[226,190,915,38],[284,253,337,38],[283,317,379,38],[283,380,375,38],[283,444,379,38],[311,464,10,10]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"31","initialReadingPids":[0]},"html":"<h2>31题</h2>\n<blockquote><p>The author mentions two books in Paragraph 1 to present ______.<br />\n作者在第1段提到两本书，是为了呈现什么？</p>\n</blockquote>\n<p>题干直接给出two books和Paragraph 1，先把第1段从头读到尾：作者让想去水石书店寻找这两本新书的读者有所准备，随后点出两本书的出版商与水石书店的关系。</p>\n<blockquote><p>原文参考：</p>\n<p>If you’re heading for your nearest branch of Waterstones, the biggest book <strong>[xxx]</strong> in the UK, in search of the Duchess of Sussex’s new children’s book The Bench, you might have to be prepared to hunt around a bit; the same may be true of The President’s Daughter, the new <strong>[xxx]</strong> by Bill Clinton and James Patterson. Both of these books are published next week by Penguin Random House (PRH) , a company currently involved in a stand-off with Waterstones.</p>\n<p>开始精读：</p>\n<p>If you’re heading for your nearest branch of Waterstones, / the biggest book <strong>[xxx]</strong> in the UK, / in search of the Duchess of Sussex’s new children’s book The Bench, / you might have to be prepared to hunt around a bit; / the same may be true of The President’s Daughter, / the new <strong>[xxx]</strong> by Bill Clinton and James Patterson. / Both of these books are published next week by Penguin Random House (PRH) , / a company currently involved in a stand-off with Waterstones.</p>\n<p>如果你正前往离你最近的水石书店分店， / 这家英国最大的图书<strong>[xxx]</strong>， / 寻找苏塞克斯公爵夫人的新儿童读物《长椅》， / 你可能得准备好四下找一找； / 《总统的女儿》可能也是如此， / 这是比尔·克林顿和詹姆斯·帕特森的新<strong>[xxx]</strong>。 / 这两本书都将在下周由企鹅兰登书屋出版， / 这家公司目前正与水石书店僵持不下。</p>\n</blockquote>\n<p>空格要说明作者为什么把这两本书放在开头，要把寻找两本书的情景与段末关于企鹅兰登书屋和水石书店的叙述连起来，不能只概括两本书的内容。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"31题","raw":"### A. an ongoing conflict\n\n> 一场正在持续的冲突\n\n把A接回题干，它说的是：作者在第1段提到两本书，是为了呈现一场正在持续的冲突。\n\nA说正在发生的冲突，回第1段看两本书最后被归到哪一家公司。\n\n> you might have to be prepared to hunt around a bit\n\n> a company currently involved in a stand-off with Waterstones.\n\n读者去书店找这两本新书，都可能得多找一会儿。接着作者说明它们同由PRH出版，而PRH目前正与水石书店处于stand-off中。\n\n所以两本书相同的处境，并不是到书名就结束，而是带出了出版商与书店的僵持。\n\n**两本书为什么被放在一起提，后文给出的共同原因是什么？**\n\n是同一出版商正在与书店发生冲突。A接住了这层联系，可以保留。\n\n**第一轮判断：A保留。**","articleRects":[[274,282,1122,38],[202,330,1194,36],[204,372,1191,46],[202,423,1193,38],[202,470,1194,37],[202,515,1180,39],[426,538,11,15]],"questionRects":[[284,253,337,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"31","paragraphPids":[0]},"html":"<h3>A. an ongoing conflict</h3>\n<blockquote><p>一场正在持续的冲突</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者在第1段提到两本书，是为了呈现一场正在持续的冲突。</p>\n<p>A说正在发生的冲突，回第1段看两本书最后被归到哪一家公司。</p>\n<blockquote><p>you might have to be prepared to hunt around a bit</p>\n</blockquote>\n<blockquote><p>a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n<p>读者去书店找这两本新书，都可能得多找一会儿。接着作者说明它们同由PRH出版，而PRH目前正与水石书店处于stand-off中。</p>\n<p>所以两本书相同的处境，并不是到书名就结束，而是带出了出版商与书店的僵持。</p>\n<p><strong>两本书为什么被放在一起提，后文给出的共同原因是什么？</strong></p>\n<p>是同一出版商正在与书店发生冲突。A接住了这层联系，可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"31题","raw":"### B. an intellectual concept\n\n> 一个思想概念\n\n把B接回题干，它说的是：作者在第1段提到两本书，是为了呈现一个思想概念。\n\nB说思想概念，回第1段看作者有没有介绍两本书讲的内容。\n\n> you might have to be prepared to hunt around a bit\n\n> a company currently involved in a stand-off with Waterstones.\n\n作者只给出书名、作者、出版时间以及找书可能不容易。两本书的思想或观点并没有被展开。\n\n末句反而转到共同出版商与书店的争端，接下来要说的不是书内的概念。\n\n**这一段用两本书解释了什么思想概念吗？**\n\n没有。B把书籍作为引子误当成了对书中思想的介绍。\n\n**第一轮判断：B排除。**","articleRects":[[274,282,1122,38],[202,330,1194,36],[204,372,1191,46],[202,423,1193,38],[202,470,1194,37],[202,515,1180,39],[426,538,11,15]],"questionRects":[[283,317,379,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"31","paragraphPids":[0]},"html":"<h3>B. an intellectual concept</h3>\n<blockquote><p>一个思想概念</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者在第1段提到两本书，是为了呈现一个思想概念。</p>\n<p>B说思想概念，回第1段看作者有没有介绍两本书讲的内容。</p>\n<blockquote><p>you might have to be prepared to hunt around a bit</p>\n</blockquote>\n<blockquote><p>a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n<p>作者只给出书名、作者、出版时间以及找书可能不容易。两本书的思想或观点并没有被展开。</p>\n<p>末句反而转到共同出版商与书店的争端，接下来要说的不是书内的概念。</p>\n<p><strong>这一段用两本书解释了什么思想概念吗？</strong></p>\n<p>没有。B把书籍作为引子误当成了对书中思想的介绍。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"31题","raw":"### C. a prevailing sentiment\n\n> 一种普遍流行的情绪\n\n把C接回题干，它说的是：作者在第1段提到两本书，是为了呈现一种普遍流行的情绪。\n\nC说普遍情绪，回第1段看谁表达了什么感受。\n\n> you might have to be prepared to hunt around a bit\n\n> a company currently involved in a stand-off with Waterstones.\n\n这里设想读者去找书，提醒可能得四处找一找。没有统计读者的感受，也没有说某一种心情普遍流行。\n\n找书不便可能使人有情绪，但作者实际接着解释的是出版商与书店的僵持。\n\n**一种可能的找书经历，是否已经说明社会上普遍有某种情绪？**\n\n没有。C把可能的个人反应扩大成了普遍情绪。\n\n**第一轮判断：C排除。**","articleRects":[[274,282,1122,38],[202,330,1194,36],[204,372,1191,46],[202,423,1193,38],[202,470,1194,37],[202,515,1180,39],[426,538,11,15]],"questionRects":[[283,380,375,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"31","paragraphPids":[0]},"html":"<h3>C. a prevailing sentiment</h3>\n<blockquote><p>一种普遍流行的情绪</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者在第1段提到两本书，是为了呈现一种普遍流行的情绪。</p>\n<p>C说普遍情绪，回第1段看谁表达了什么感受。</p>\n<blockquote><p>you might have to be prepared to hunt around a bit</p>\n</blockquote>\n<blockquote><p>a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n<p>这里设想读者去找书，提醒可能得四处找一找。没有统计读者的感受，也没有说某一种心情普遍流行。</p>\n<p>找书不便可能使人有情绪，但作者实际接着解释的是出版商与书店的僵持。</p>\n<p><strong>一种可能的找书经历，是否已经说明社会上普遍有某种情绪？</strong></p>\n<p>没有。C把可能的个人反应扩大成了普遍情绪。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"31题","raw":"### D. a literary phenomenon\n\n> 一种文学现象\n\n把D接回题干，它说的是：作者在第1段提到两本书，是为了呈现一种文学现象。\n\nD说文学现象，回第1段看两本书之间比较的是什么。\n\n> you might have to be prepared to hunt around a bit\n\n> a company currently involved in a stand-off with Waterstones.\n\n两本书题材、写法、文学流派都没有被拿来比较。作者只强调它们出自同一家出版商，可能同样不易在书店找到。\n\n这种陈列和供货处境与商业争端相连，不是因为两本书体现某种共同文学创作趋势。\n\n**作者借两本书讲的是创作现象，还是出版社与书店的关系？**\n\n是后者。D把出现文学作品当成了讨论文学现象。\n\n**第一轮判断：D排除。**","articleRects":[[274,282,1122,38],[202,330,1194,36],[204,372,1191,46],[202,423,1193,38],[202,470,1194,37],[202,515,1180,39],[426,538,11,15]],"questionRects":[[283,444,379,38],[311,464,10,10]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"31","paragraphPids":[0]},"html":"<h3>D. a literary phenomenon</h3>\n<blockquote><p>一种文学现象</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者在第1段提到两本书，是为了呈现一种文学现象。</p>\n<p>D说文学现象，回第1段看两本书之间比较的是什么。</p>\n<blockquote><p>you might have to be prepared to hunt around a bit</p>\n</blockquote>\n<blockquote><p>a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n<p>两本书题材、写法、文学流派都没有被拿来比较。作者只强调它们出自同一家出版商，可能同样不易在书店找到。</p>\n<p>这种陈列和供货处境与商业争端相连，不是因为两本书体现某种共同文学创作趋势。</p>\n<p><strong>作者借两本书讲的是创作现象，还是出版社与书店的关系？</strong></p>\n<p>是后者。D把出现文学作品当成了讨论文学现象。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"31题","raw":"### 31题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一次留下A：两本新书的找书情景引出出版商与水石书店正在持续的冲突。","articleRects":[],"questionRects":[[226,190,915,38],[284,253,337,38],[283,317,379,38],[283,380,375,38],[283,444,379,38],[311,464,10,10]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"31"},"html":"<h3>31题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一次留下A：两本新书的找书情景引出出版商与水石书店正在持续的冲突。</p>\n"},{"section":"32题","raw":"## 32题\n\n> Why did Waterstones shops retire PRH books to their relevant sections?  \n> 水石书店为什么把企鹅兰登书屋的书撤回各自所属的分区？\n\n题干中的retire PRH books to their relevant sections在第2段末句直接出现，回到第2段完整阅读：先看问题从何时开始，再看分店经理接到的移书指示。\n\n> 原文参考：\n> \n> The problem began late last year, when PRH confirmed that it had introduced a credit limit with Waterstones “at a very significant level”. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from **[xxx]** areas such as tables, display spaces and windows, and were “ quietly retiring them to their relevant sections” .\n> \n> 开始精读：\n> \n> The problem began late last year, / when PRH confirmed that it had introduced a credit limit with Waterstones / “at a very significant level”. / The trade magazine The Bookseller reported that Waterstones branch managers were being told / to remove PRH books from **[xxx]** areas such as tables, display spaces and windows, / and were “ quietly retiring them to their relevant sections” .\n> \n> 问题始于去年年底， / 当时企鹅兰登书屋确认，它已经对水石书店设立了信用额度限制， / “限制程度非常显著”。 / 行业杂志《书商》报道说，水石书店分店经理接到了指示， / 要把企鹅兰登书屋的书从桌面、展示区和橱窗等**[xxx]**区域移走， / 并且正“悄悄地把这些书撤回各自所属的分区”。\n\n题干要解释把这些书撤回所属分区的原因，要核对前面企鹅兰登书屋对水石书店采取的措施如何与后面的移书行动相连。\n\n接下来按A—D逐项看。","articleRects":[[274,563,1122,38],[202,609,1193,39],[202,657,1194,37],[202,703,1193,38],[203,749,1193,39],[203,791,153,48]],"questionRects":[[226,570,1135,38],[283,634,530,38],[283,697,586,38],[283,761,595,38],[283,824,608,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"32","initialReadingPids":[1]},"html":"<h2>32题</h2>\n<blockquote><p>Why did Waterstones shops retire PRH books to their relevant sections?<br />\n水石书店为什么把企鹅兰登书屋的书撤回各自所属的分区？</p>\n</blockquote>\n<p>题干中的retire PRH books to their relevant sections在第2段末句直接出现，回到第2段完整阅读：先看问题从何时开始，再看分店经理接到的移书指示。</p>\n<blockquote><p>原文参考：</p>\n<p>The problem began late last year, when PRH confirmed that it had introduced a credit limit with Waterstones “at a very significant level”. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from <strong>[xxx]</strong> areas such as tables, display spaces and windows, and were “ quietly retiring them to their relevant sections” .</p>\n<p>开始精读：</p>\n<p>The problem began late last year, / when PRH confirmed that it had introduced a credit limit with Waterstones / “at a very significant level”. / The trade magazine The Bookseller reported that Waterstones branch managers were being told / to remove PRH books from <strong>[xxx]</strong> areas such as tables, display spaces and windows, / and were “ quietly retiring them to their relevant sections” .</p>\n<p>问题始于去年年底， / 当时企鹅兰登书屋确认，它已经对水石书店设立了信用额度限制， / “限制程度非常显著”。 / 行业杂志《书商》报道说，水石书店分店经理接到了指示， / 要把企鹅兰登书屋的书从桌面、展示区和橱窗等<strong>[xxx]</strong>区域移走， / 并且正“悄悄地把这些书撤回各自所属的分区”。</p>\n</blockquote>\n<p>题干要解释把这些书撤回所属分区的原因，要核对前面企鹅兰登书屋对水石书店采取的措施如何与后面的移书行动相连。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"32题","raw":"### A. To make them easily noticeable.\n\n> 为了让这些书容易被注意到。\n\n把A接回题干，它说的是：水石书店把企鹅兰登书屋的书撤回所属分区，是为了让这些书容易被注意到。\n\nA说更容易被看到，回第2段看remove from后面的原位置。\n\n> it had introduced a credit limit with Waterstones “at a very significant level”\n\n> remove PRH books from **[xxx]** areas such as tables, display spaces and windows\n\n书被从桌面、展示区和橱窗等位置拿走，quietly retiring them则说明它们被悄悄放回各自分区。原先这些位置是路过就容易注意到的。\n\n回到分区要读者主动寻找，与第一段“多找一会儿”也一致。\n\n**撤离展示台和橱窗，会使这些书更容易被顺眼看到吗？**\n\n不会。A把撤出展示的效果说反了。\n\n**第一轮判断：A排除。**","articleRects":[[274,563,1122,38],[202,609,1193,39],[202,657,1194,37],[202,703,1193,38],[203,749,1193,39],[203,791,153,48]],"questionRects":[[283,634,530,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"32","paragraphPids":[1]},"html":"<h3>A. To make them easily noticeable.</h3>\n<blockquote><p>为了让这些书容易被注意到。</p>\n</blockquote>\n<p>把A接回题干，它说的是：水石书店把企鹅兰登书屋的书撤回所属分区，是为了让这些书容易被注意到。</p>\n<p>A说更容易被看到，回第2段看remove from后面的原位置。</p>\n<blockquote><p>it had introduced a credit limit with Waterstones “at a very significant level”</p>\n</blockquote>\n<blockquote><p>remove PRH books from <strong>[xxx]</strong> areas such as tables, display spaces and windows</p>\n</blockquote>\n<p>书被从桌面、展示区和橱窗等位置拿走，quietly retiring them则说明它们被悄悄放回各自分区。原先这些位置是路过就容易注意到的。</p>\n<p>回到分区要读者主动寻找，与第一段“多找一会儿”也一致。</p>\n<p><strong>撤离展示台和橱窗，会使这些书更容易被顺眼看到吗？</strong></p>\n<p>不会。A把撤出展示的效果说反了。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"32题","raw":"### B. To comply with PRH’s requirement.\n\n> 为了遵从企鹅兰登书屋的要求。\n\n把B接回题干，它说的是：水石书店把企鹅兰登书屋的书撤回所属分区，是为了遵从企鹅兰登书屋的要求。\n\nB说遵从PRH要求，回第2段看PRH宣布的究竟是什么。\n\n> PRH confirmed that it had introduced a credit limit with Waterstones\n\n> Waterstones branch managers were being told to remove PRH books\n\nPRH确认的是给水石书店设置信用额度限制，并没有要求书店把图书从橱窗拿走。经理被告知撤书，是随后报道的书店行动。\n\n两个动作先后发生，并不等于前一方下达了后一项命令。\n\n**PRH提出的要求就是调整书架位置吗？**\n\n不是。B把信用限制改成了陈列要求，又把书店反应说成遵命。\n\n**第一轮判断：B排除。**","articleRects":[[274,563,1122,38],[202,609,1193,39],[202,657,1194,37],[202,703,1193,38],[203,749,1193,39],[203,791,153,48]],"questionRects":[[283,697,586,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"32","paragraphPids":[1]},"html":"<h3>B. To comply with PRH’s requirement.</h3>\n<blockquote><p>为了遵从企鹅兰登书屋的要求。</p>\n</blockquote>\n<p>把B接回题干，它说的是：水石书店把企鹅兰登书屋的书撤回所属分区，是为了遵从企鹅兰登书屋的要求。</p>\n<p>B说遵从PRH要求，回第2段看PRH宣布的究竟是什么。</p>\n<blockquote><p>PRH confirmed that it had introduced a credit limit with Waterstones</p>\n</blockquote>\n<blockquote><p>Waterstones branch managers were being told to remove PRH books</p>\n</blockquote>\n<p>PRH确认的是给水石书店设置信用额度限制，并没有要求书店把图书从橱窗拿走。经理被告知撤书，是随后报道的书店行动。</p>\n<p>两个动作先后发生，并不等于前一方下达了后一项命令。</p>\n<p><strong>PRH提出的要求就是调整书架位置吗？</strong></p>\n<p>不是。B把信用限制改成了陈列要求，又把书店反应说成遵命。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"32题","raw":"### C. To respond to PRH’s business move.\n\n> 为了回应企鹅兰登书屋的商业举措。\n\n把C接回题干，它说的是：水石书店把企鹅兰登书屋的书撤回所属分区，是为了回应企鹅兰登书屋的商业举措。\n\nC说回应PRH商业举措，回第2段按先后读信用限制和撤书。\n\n> The problem began late last year, when PRH confirmed that it had introduced a credit limit with Waterstones\n\n> quietly retiring them to their relevant sections\n\n问题始于PRH给水石设置很大程度的信用限制，随后报道书店经理被要求把PRH图书撤出展示区。撤书只针对这个有争端的出版商。\n\n前面发生交易限制，后面书店减少显眼陈列，这两件事在同一争端中相接。\n\n**这次撤书是否是在回应出版社先前改变交易条件？**\n\n是。C能把原因与书店的动作接起来，可以保留。\n\n**第一轮判断：C保留。**","articleRects":[[274,563,1122,38],[202,609,1193,39],[202,657,1194,37],[202,703,1193,38],[203,749,1193,39],[203,791,153,48]],"questionRects":[[283,761,595,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"32","paragraphPids":[1]},"html":"<h3>C. To respond to PRH’s business move.</h3>\n<blockquote><p>为了回应企鹅兰登书屋的商业举措。</p>\n</blockquote>\n<p>把C接回题干，它说的是：水石书店把企鹅兰登书屋的书撤回所属分区，是为了回应企鹅兰登书屋的商业举措。</p>\n<p>C说回应PRH商业举措，回第2段按先后读信用限制和撤书。</p>\n<blockquote><p>The problem began late last year, when PRH confirmed that it had introduced a credit limit with Waterstones</p>\n</blockquote>\n<blockquote><p>quietly retiring them to their relevant sections</p>\n</blockquote>\n<p>问题始于PRH给水石设置很大程度的信用限制，随后报道书店经理被要求把PRH图书撤出展示区。撤书只针对这个有争端的出版商。</p>\n<p>前面发生交易限制，后面书店减少显眼陈列，这两件事在同一争端中相接。</p>\n<p><strong>这次撤书是否是在回应出版社先前改变交易条件？</strong></p>\n<p>是。C能把原因与书店的动作接起来，可以保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"32题","raw":"### D. To arrange them in a systematic way.\n\n> 为了有条理地摆放这些书。\n\n把D接回题干，它说的是：水石书店把企鹅兰登书屋的书撤回所属分区，是为了有条理地摆放这些书。\n\nD说有条理地摆放，回第2段看问题从哪里开始。\n\n> The problem began late last year, when PRH confirmed that it had introduced a credit limit with Waterstones\n\n> quietly retiring them to their relevant sections\n\n书确实回到各自分区，但原文没有说原先摆放混乱或分类错误。它先交代信用限制，然后才报道撤离展示位置。\n\n如果只是整理分类，就解释不了为什么只提PRH、为什么又强调悄悄撤出橱窗和展示区。\n\n**回到所属分区是动作结果，就一定是这次动作的目的吗？**\n\n不是。D只取了摆放位置，漏掉引发撤书的交易争端。\n\n**第一轮判断：D排除。**","articleRects":[[274,563,1122,38],[202,609,1193,39],[202,657,1194,37],[202,703,1193,38],[203,749,1193,39],[203,791,153,48]],"questionRects":[[283,824,608,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"32","paragraphPids":[1]},"html":"<h3>D. To arrange them in a systematic way.</h3>\n<blockquote><p>为了有条理地摆放这些书。</p>\n</blockquote>\n<p>把D接回题干，它说的是：水石书店把企鹅兰登书屋的书撤回所属分区，是为了有条理地摆放这些书。</p>\n<p>D说有条理地摆放，回第2段看问题从哪里开始。</p>\n<blockquote><p>The problem began late last year, when PRH confirmed that it had introduced a credit limit with Waterstones</p>\n</blockquote>\n<blockquote><p>quietly retiring them to their relevant sections</p>\n</blockquote>\n<p>书确实回到各自分区，但原文没有说原先摆放混乱或分类错误。它先交代信用限制，然后才报道撤离展示位置。</p>\n<p>如果只是整理分类，就解释不了为什么只提PRH、为什么又强调悄悄撤出橱窗和展示区。</p>\n<p><strong>回到所属分区是动作结果，就一定是这次动作的目的吗？</strong></p>\n<p>不是。D只取了摆放位置，漏掉引发撤书的交易争端。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"32题","raw":"### 32题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一次留下C：本段从信用限制写起，随后写书店撤回该社图书，行动是对出版商商业举措的回应。","articleRects":[],"questionRects":[[226,570,1135,38],[283,634,530,38],[283,697,586,38],[283,761,595,38],[283,824,608,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"32"},"html":"<h3>32题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一次留下C：本段从信用限制写起，随后写书店撤回该社图书，行动是对出版商商业举措的回应。</p>\n"},{"section":"33题","raw":"## 33题\n\n> What message does the spokesperson for Waterstones seem to convey?  \n> 水石书店的发言人似乎想传达什么信息？\n\n题干点名spokesperson for Waterstones，第3段正是这位发言人的整段发言。先完整读他的说明，包括信用条件、顾客购书、重新开门的希望，以及末尾的繁忙状况和销量。\n\n> 原文参考：\n> \n> PRH **[xxx]** to comment on the issue, but a spokesperson for Waterstones told me: “Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our **[xxx]** to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that **[xxx]** will return and that we will be allowed to buy **[xxx]**. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018. ”\n> \n> 开始精读：\n> \n> PRH **[xxx]** to comment on the issue, / but a spokesperson for Waterstones told me: / “Waterstones are currently operating with reduced credit terms from PRH, / the only publisher in the UK to place any limitations on our ability to trade. / We are not boycotting PRH titles / but we are doing our **[xxx]** to ensure that availability for customers remains good / despite the lower overall levels of stock. / We are hopeful with our shops now open again / that **[xxx]** will return and that we will be allowed to buy **[xxx]**. / Certainly, our shops are exceptionally busy. / The sales for our May Books of the Month surpassed any month since 2018. ”\n> \n> 企鹅兰登书屋**[xxx]**就此事发表评论， / 但水石书店的一位发言人告诉我： / “水石书店目前在企鹅兰登书屋收紧的信用条件下经营， / 它是英国唯一对我们交易能力设限的出版商。 / 我们并没有抵制企鹅兰登书屋的书， / 而是在做我们的**[xxx]**，以确保顾客仍能方便地买到书， / 尽管总体库存水平降低了。 / 我们的书店如今重新开门了，我们抱有希望， / 希望**[xxx]**会回来，也希望我们将获准购买**[xxx]**。 / 的确，我们的书店异常繁忙。 / 我们五月‘每月好书’的销量超过了2018年以来的任何一个月。”\n\n题目问这段发言似乎要传达什么，要把发言人对当前限制、经营安排和营业情况的表述连起来，判断他借这些说明表达的意思。\n\n接下来按A—D逐项看。","articleRects":[[274,843,1121,38],[202,889,1193,39],[202,937,1194,38],[202,984,1194,38],[202,1030,1196,38],[203,1077,1192,38],[203,1124,1192,38],[202,1171,1193,37],[202,1216,303,32]],"questionRects":[[226,951,1129,38],[295,1014,491,38],[295,1078,542,30],[295,1141,491,31],[295,1205,530,30]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"33","initialReadingPids":[2]},"html":"<h2>33题</h2>\n<blockquote><p>What message does the spokesperson for Waterstones seem to convey?<br />\n水石书店的发言人似乎想传达什么信息？</p>\n</blockquote>\n<p>题干点名spokespe  Their customers remain loyal.\n\n> 他们的顾客仍然忠实。\n\n把A接回题干，它说的是：水石书店的发言人似乎想传达，他们的顾客仍然忠实。\n\nA说顾客仍支持书店，回第3段看发言人最后两句。\n\n> availability for customers remains good despite the lower overall levels of stock\n\n> our shops are exceptionally busy\n\n> surpassed any month since 2018\n\n他说店里exceptionally busy，5月推荐书的销量超过2018年以来任何一个月。即使库存总量下降，顾客仍在进店并购买。\n\nloyal在这里可以对应交易受限时仍有顾客支持的意思。发言人拿实际繁忙和销量来证明书店的吸引力仍在。\n\n**受限之后仍很忙、销量仍强，能否支持顾客继续支持书店？**\n\n能支持这一判断。A先保留；这些话说明持续支持，并没有逐个追踪所有老顾客。\n\n**第一轮判断：A保留。**","articleRects":[[274,843,1121,38],[202,889,1193,39],[202,937,1194,38],[202,984,1194,38],[202,1030,1196,38],[203,1077,1192,38],[203,1124,1192,38],[202,1171,1193,37],[202,1216,303,32]],"questionRects":[[295,1014,491,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"33","paragraphPids":[2]},"html":"<h3>A. Their customers remain loyal.</h3>\n<blockquote><p>他们的顾客仍然忠实。</p>\n</blockquote>\n<p>把A接回题干，它说的是：水石书店的发言人似乎想传达，他们的顾客仍然忠实。</p>\n<p>A说顾客仍支持书店，回第3段看发言人最后两句。</p>\n<blockquote><p>availability for customers remains good despite the lower overall levels of stock</p>\n</blockquote>\n<blockquote><p>our shops are exceptionally busy</p>\n</blockquote>\n<blockquote><p>surpassed any month since 2018</p>\n</blockquote>\n<p>他说店里exceptionally busy，5月推荐书的销量超过2018年以来任何一个月。即使库存总量下降，顾客仍在进店并购买。</p>\n<p>loyal在这里可以对应交易受限时仍有顾客支持的意思。发言人拿实际繁忙和销量来证明书店的吸引力仍在。</p>\n<p><strong>受限之后仍很忙、销量仍强，能否支持顾客继续支持书店？</strong></p>\n<p>能支持这一判断。A先保留；这些话说明持续支持，并没有逐个追踪所有老顾客。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"33题","raw":"### B. The credit limit will be removed.\n\n> 信用额度限制将被取消。\n\n把B接回题干，它说的是：水石书店的发言人似乎想传达，信用额度限制将被取消。\n\nB说信用限制将取消，回第3段看关于未来交易用了什么语气。\n\n> Waterstones are currently operating with reduced credit terms from PRH\n\n> We are hopeful with our shops now open again that **[xxx]** will return and that we will be allowed to buy **[xxx]**.\n\n发言人先确认目前正受更低信用条件限制，再用We are hopeful表达希望恢复正常购买。恢复是书店的愿望。\n\nPRH没有在这段承诺撤销限制。门店繁忙或许能成为书店争取改善条件的理由，仍不能替出版社作决定。\n\n**书店希望恢复交易条件，就等于出版社已经会取消限制吗？**\n\n不能确定。B把hopeful变成了确定将发生的结果。\n\n**第一轮判断：B排除。**","articleRects":[[274,843,1121,38],[202,889,1193,39],[202,937,1194,38],[202,984,1194,38],[202,1030,1196,38],[203,1077,1192,38],[203,1124,1192,38],[202,1171,1193,37],[202,1216,303,32]],"questionRects":[[295,1078,542,30]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"33","paragraphPids":[2]},"html":"<h3>B. The credit limit will be removed.</h3>\n<blockquote><p>信用额度限制将被取消。</p>\n</blockquote>\n<p>把B接回题干，它说的是：水石书店的发言人似乎想传达，信用额度限制将被取消。</p>\n<p>B说信用限制将取消，回第3段看关于未来交易用了什么语气。</p>\n<blockquote><p>Waterstones are currently operating with reduced credit terms from PRH</p>\n</blockquote>\n<blockquote><p>We are hopeful with our shops now open again that <strong>[xxx]</strong> will return and that we will be allowed to buy <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>发言人先确认目前正受更低信用条件限制，再用We are hopeful表达希望恢复正常购买。恢复是书店的愿望。</p>\n<p>PRH没有在这段承诺撤销限制。门店繁忙或许能成为书店争取改善条件的理由，仍不能替出版社作决定。</p>\n<p><strong>书店希望恢复交易条件，就等于出版社已经会取消限制吗？</strong></p>\n<p>不能确定。B把hopeful变成了确定将发生的结果。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"33题","raw":"### C. Their stock is underestimated.\n\n> 他们的库存被低估了。\n\n把C接回题干，它说的是：水石书店的发言人似乎想传达，他们的库存被低估了。\n\nC说库存被低估，回第3段看lower overall levels of stock。\n\n> to ensure that availability for customers remains good despite the lower overall levels of stock\n\n发言人承认库存总量更低，同时说在这种情况下仍努力保持顾客买得到书。两句并不矛盾：库存少了，但书店想维持供应。\n\nunderestimated却意味着别人估得太少、真实库存比估计多，原文没有介绍这种估计错误。\n\n**库存真的减少，与库存被别人低估，是同一件事吗？**\n\n不是。C把数量下降改成了外界判断失误。\n\n**第一轮判断：C排除。**","articleRects":[[274,843,1121,38],[202,889,1193,39],[202,937,1194,38],[202,984,1194,38],[202,1030,1196,38],[203,1077,1192,38],[203,1124,1192,38],[202,1171,1193,37],[202,1216,303,32]],"questionRects":[[295,1141,491,31]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"33","paragraphPids":[2]},"html":"<h3>C. Their stock is underestimated.</h3>\n<blockquote><p>他们的库存被低估了。</p>\n</blockquote>\n<p>把C接回题干，它说的是：水石书店的发言人似乎想传达，他们的库存被低估了。</p>\n<p>C说库存被低估，回第3段看lower overall levels of stock。</p>\n<blockquote><p>to ensure that availability for customers remains good despite the lower overall levels of stock</p>\n</blockquote>\n<p>发言人承认库存总量更低，同时说在这种情况下仍努力保持顾客买得到书。两句并不矛盾：库存少了，但书店想维持供应。</p>\n<p>underestimated却意味着别人估得太少、真实库存比估计多，原文没有介绍这种估计错误。</p>\n<p><strong>库存真的减少，与库存被别人低估，是同一件事吗？</strong></p>\n<p>不是。C把数量下降改成了外界判断失误。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"33题","raw":"### D. The book market is rather slack.\n\n> 图书市场相当低迷。\n\n把D接回题干，它说的是：水石书店的发言人似乎想传达，图书市场相当低迷。\n\nD说市场低迷，回第3段找busy与surpassed。\n\n> our shops are exceptionally busy\n\n> surpassed any month since 2018\n\n发言人举的是异常繁忙的门店和创下近年来高位的推荐书销量。这些例子用来显示书店交易活跃。\n\n全市场的情况不能只凭一家书店定论，但这番话也完全没有向读者传达市场低迷。\n\n**他选出的营业事实是在展示冷清，还是活跃？**\n\n是在展示活跃。D既和这些事实不合，又扩大到了整个图书市场。\n\n**第一轮判断：D排除。**","articleRects":[[274,843,1121,38],[202,889,1193,39],[202,937,1194,38],[202,984,1194,38],[202,1030,1196,38],[203,1077,1192,38],[203,1124,1192,38],[202,1171,1193,37],[202,1216,303,32]],"questionRects":[[295,1205,530,30]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"33","paragraphPids":[2]},"html":"<h3>D. The book market is rather slack.</h3>\n<blockquote><p>图书市场相当低迷。</p>\n</blockquote>\n<p>把D接回题干，它说的是：水石书店的发言人似乎想传达，图书市场相当低迷。</p>\n<p>D说市场低迷，回第3段找busy与surpassed。</p>\n<blockquote><p>our shops are exceptionally busy</p>\n</blockquote>\n<blockquote><p>surpassed any month since 2018</p>\n</blockquote>\n<p>发言人举的是异常繁忙的门店和创下近年来高位的推荐书销量。这些例子用来显示书店交易活跃。</p>\n<p>全市场的情况不能只凭一家书店定论，但这番话也完全没有向读者传达市场低迷。</p>\n<p><strong>他选出的营业事实是在展示冷清，还是活跃？</strong></p>\n<p>是在展示活跃。D既和这些事实不合，又扩大到了整个图书市场。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"33题","raw":"### 33题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一次留下A：发言人强调门店繁忙、销量强劲，可以理解为顾客仍在支持书店。","articleRects":[],"questionRects":[[226,951,1129,38],[295,1014,491,38],[295,1078,542,30],[295,1141,491,31],[295,1205,530,30]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"33"},"html":"<h3>33题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一次留下A：发言人强调门店繁忙、销量强劲，可以理解为顾客仍在支持书店。</p>\n"},{"section":"34题","raw":"## 34题\n\n> What can be one consequence of the current dispute?  \n> 当前这场纠纷可能产生什么后果？\n\n题干的current dispute提示要找这场纠纷影响谁。粗读第4段留下了“PRH authors have been the losers”这一片段，而且段末直接出现the dispute，因此完整阅读第4段，比较知名作者和中间层次作者的处境。\n\n> 原文参考：\n> \n> In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it’s those mid-list authors, who normally rely on Waterstones staff’s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.\n> \n> 开始精读：\n> \n> In the meantime, PRH authors have been the losers. / Big-name PRH authors may suffer a bit, / but it’s those mid-list authors, / who normally rely on Waterstones staff’s passion for promoting books by lesser-known writers, / who will be praying for an end to the dispute.\n> \n> 与此同时，企鹅兰登书屋的作者成了受损者。 / 企鹅兰登书屋的知名作者可能受到一点影响， / 但是那些处于中间层次的作者， / 他们通常依靠水石书店员工推广不太知名作家书籍的热情， / 会祈求这场纠纷结束。\n\n题目要判断纠纷可能造成的结果，需要从作者受到影响以及他们平时依赖什么推广条件来推断，不能把文章中所有问题的后果混在一起。\n\n接下来按A—D逐项看。","articleRects":[[274,1264,1122,38],[203,1311,1193,38],[202,1358,1194,37],[203,1404,615,38]],"questionRects":[[226,1331,855,38],[283,1395,953,38],[283,1458,911,38],[283,1522,982,38],[283,1585,919,31]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"34","initialReadingPids":[3]},"html":"<h2>34题</h2>\n<blockquote><p>What can be one consequence of the current dispute?<br />\n当前这场纠纷可能产生什么后果？</p>\n</blockquote>\n<p>题干的current dispute提示要找这场纠纷影响谁。粗读第4段留下了“PRH authors have been the losers”这一片段，而且段末直接出现the dispute，因此完整阅读第4段，比较知名作者和中间层次作者的处境。</p>\n<blockquote><p>原文参考：</p>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it’s those mid-list authors, who normally rely on Waterstones staff’s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n<p>开始精读：</p>\n<p>In the meantime, PRH authors have been the losers. / Big-name PRH authors may suffer a bit, / but it’s those mid-list authors, / who normally rely on Waterstones staff’s passion for promoting books by lesser-known writers, / who will be praying for an end to the dispute.</p>\n<p>与此同时，企鹅兰登书屋的作者成了受损者。 / 企鹅兰登书屋的知名作者可能受到一点影响， / 但是那些处于中间层次的作者， / 他们通常依靠水石书店员工推广不太知名作家书籍的热情， / 会祈求这场纠纷结束。</p>\n</blockquote>\n<p>题目要判断纠纷可能造成的结果，需要从作者受到影响以及他们平时依赖什么推广条件来推断，不能把文章中所有问题的后果混在一起。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"34题","raw":"### A. Sales of books by mid-list PRH writers fall off considerably.\n\n> 企鹅兰登书屋中间层次作者的图书销量大幅下降。\n\n把A接回题干，它说的是：当前纠纷的一个可能后果是，企鹅兰登书屋中间层次作者的图书销量大幅下降。\n\nA说中间层作者销量受损，回第4段看谁最依靠书店推广。\n\n> PRH authors have been the losers\n\n> Big-name PRH authors may suffer a bit\n\n> who normally rely on Waterstones staff’s passion for promoting books by lesser-known writers\n\n大牌作者可能受一点影响，而中间层、知名度较低的作者通常依赖店员热情推荐。现在这些书离开显眼位置，主动推荐的重要性就更突出了。\n\n作者说他们会盼着争端结束，正说明失去这种推广对他们尤其不利。读者更难发现书，销量就可能受到明显影响。\n\n**最依赖店员推广的一批作者，会不会因这场陈列争端更容易失去销量？**\n\n会。A符合这里区分大牌与中间层作者的意思，可以保留。\n\n**第一轮判断：A保留。**","articleRects":[[274,1264,1122,38],[203,1311,1193,38],[202,1358,1194,37],[203,1404,615,38]],"questionRects":[[283,1395,953,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"34","paragraphPids":[3]},"html":"<h3>A. Sales of books by mid-list PRH writers fall off considerably.</h3>\n<blockquote><p>企鹅兰登书屋中间层次作者的图书销量大幅下降。</p>\n</blockquote>\n<p>把A接回题干，它说的是：当前纠纷的一个可能后果是，企鹅兰登书屋中间层次作者的图书销量大幅下降。</p>\n<p>A说中间层作者销量受损，回第4段看谁最依靠书店推广。</p>\n<blockquote><p>PRH authors have been the losers</p>\n</blockquote>\n<blockquote><p>Big-name PRH authors may suffer a bit</p>\n</blockquote>\n<blockquote><p>who normally rely on Waterstones staff’s passion for promoting books by lesser-known writers</p>\n</blockquote>\n<p>大牌作者可能受一点影响，而中间层、知名度较低的作者通常依赖店员热情推荐。现在这些书离开显眼位置，主动推荐的重要性就更突出了。</p>\n<p>作者说他们会盼着争端结束，正说明失去这种推广对他们尤其不利。读者更难发现书，销量就可能受到明显影响。</p>\n<p><strong>最依赖店员推广的一批作者，会不会因这场陈列争端更容易失去销量？</strong></p>\n<p>会。A符合这里区分大牌与中间层作者的意思，可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"34题","raw":"### B. Lesser-known PRH writers become the target of criticism.\n\n> 不太知名的企鹅兰登书屋作者成为批评对象。\n\n把B接回题干，它说的是：当前纠纷的一个可能后果是，不太知名的企鹅兰登书屋作者成为批评对象。\n\nB说不知名作者遭批评，回第4段看losers具体怎样解释。\n\n> PRH authors have been the losers\n\n> Waterstones staff’s passion for promoting books by lesser-known writers\n\n他们是受损者，因为平时依赖店员推广，而争端使推广和陈列受影响。原文没有说他们的作品不好，也没有引述任何对作者的批评。\n\n商业上少了展示机会，并不表示作者成了公众指责的对象。\n\n**这些作者受损，是因为有人批评他们吗？**\n\n文中没有这种说法。B把销售推广受损换成了受到批评。\n\n**第一轮判断：B排除。**","articleRects":[[274,1264,1122,38],[203,1311,1193,38],[202,1358,1194,37],[203,1404,615,38]],"questionRects":[[283,1458,911,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"34","paragraphPids":[3]},"html":"<h3>B. Lesser-known PRH writers become the target of criticism.</h3>\n<blockquote><p>不太知名的企鹅兰登书屋作者成为批评对象。</p>\n</blockquote>\n<p>把B接回题干，它说的是：当前纠纷的一个可能后果是，不太知名的企鹅兰登书屋作者成为批评对象。</p>\n<p>B说不知名作者遭批评，回第4段看losers具体怎样解释。</p>\n<blockquote><p>PRH authors have been the losers</p>\n</blockquote>\n<blockquote><p>Waterstones staff’s passion for promoting books by lesser-known writers</p>\n</blockquote>\n<p>他们是受损者，因为平时依赖店员推广，而争端使推广和陈列受影响。原文没有说他们的作品不好，也没有引述任何对作者的批评。</p>\n<p>商业上少了展示机会，并不表示作者成了公众指责的对象。</p>\n<p><strong>这些作者受损，是因为有人批评他们吗？</strong></p>\n<p>文中没有这种说法。B把销售推广受损换成了受到批评。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"34题","raw":"### C. Waterstones staff hesitate to promote big-name authors’ books.\n\n> 水石书店员工犹豫是否推广知名作者的书。\n\n把C接回题干，它说的是：当前纠纷的一个可能后果是，水石书店员工犹豫是否推广知名作者的书。\n\nC说店员犹豫要不要推大牌，回第4段看staff’s passion后面接哪类作家。\n\n> Big-name PRH authors may suffer a bit\n\n> Waterstones staff’s passion for promoting books by lesser-known writers\n\n> Waterstones branch managers were being told to remove PRH books\n\n店员热情推广的是lesser-known writers，这是作者解释中间层作家为什么更受影响的原因。大牌作者出现在前一句，只说他们也可能略受损。\n\n第2段的陈列调整是经理接到的安排，并没有描写店员内心拿不定主意。\n\n**关于店员的这句是在说他们犹豫是否推广大牌吗？**\n\n不是。C同时换了作家群体和店员的心理状态。\n\n**第一轮判断：C排除。**","articleRects":[[274,563,1122,38],[202,609,1193,39],[202,657,1194,37],[202,703,1193,38],[203,749,1193,39],[203,791,153,48],[274,1264,1122,38],[203,1311,1193,38],[202,1358,1194,37],[203,1404,615,38]],"questionRects":[[283,1522,982,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"34","paragraphPids":[1,3]},"html":"<h3>C. Waterstones staff hesitate to promote big-name authors’ books.</h3>\n<blockquote><p>水石书店员工犹豫是否推广知名作者的书。</p>\n</blockquote>\n<p>把C接回题干，它说的是：当前纠纷的一个可能后果是，水石书店员工犹豫是否推广知名作者的书。</p>\n<p>C说店员犹豫要不要推大牌，回第4段看staff’s passion后面接哪类作家。</p>\n<blockquote><p>Big-name PRH authors may suffer a bit</p>\n</blockquote>\n<blockquote><p>Waterstones staff’s passion for promoting books by lesser-known writers</p>\n</blockquote>\n<blockquote><p>Waterstones branch managers were being told to remove PRH books</p>\n</blockquote>\n<p>店员热情推广的是lesser-known writers，这是作者解释中间层作家为什么更受影响的原因。大牌作者出现在前一句，只说他们也可能略受损。</p>\n<p>第2段的陈列调整是经理接到的安排，并没有描写店员内心拿不定主意。</p>\n<p><strong>关于店员的这句是在说他们犹豫是否推广大牌吗？</strong></p>\n<p>不是。C同时换了作家群体和店员的心理状态。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"34题","raw":"### D. Waterstones branches suffer a severe reduction in revenue.\n\n> 水石书店各分店的收入大幅减少。\n\n把D接回题干，它说的是：当前纠纷的一个可能后果是，水石书店各分店的收入大幅减少。\n\nD说分店收入大跌，回第3、4段分清哪一方受损。\n\n> PRH authors have been the losers\n\n> our shops are exceptionally busy\n\n> surpassed any month since 2018\n\n书店发言人说门店很忙，推荐书销量强；作者接着用In the meantime转到PRH作者才是受损者。\n\n特定出版社的作家卖书受影响，不能直接推出整家分店的总收入大幅下降，书店还卖其他出版商的书。\n\n**一部分作者处境不利，就说明各分店总收入严重减少吗？**\n\n不能。D把作者受到的影响转给了书店整体收入，也与前段经营表态不合。\n\n**第一轮判断：D排除。**","articleRects":[[274,843,1121,38],[202,889,1193,39],[202,937,1194,38],[202,984,1194,38],[202,1030,1196,38],[203,1077,1192,38],[203,1124,1192,38],[202,1171,1193,37],[202,1216,303,32],[274,1264,1122,38],[203,1311,1193,38],[202,1358,1194,37],[203,1404,615,38]],"questionRects":[[283,1585,919,31]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"34","paragraphPids":[2,3]},"html":"<h3>D. Waterstones branches suffer a severe reduction in revenue.</h3>\n<blockquote><p>水石书店各分店的收入大幅减少。</p>\n</blockquote>\n<p>把D接回题干，它说的是：当前纠纷的一个可能后果是，水石书店各分店的收入大幅减少。</p>\n<p>D说分店收入大跌，回第3、4段分清哪一方受损。</p>\n<blockquote><p>PRH authors have been the losers</p>\n</blockquote>\n<blockquote><p>our shops are exceptionally busy</p>\n</blockquote>\n<blockquote><p>surpassed any month since 2018</p>\n</blockquote>\n<p>书店发言人说门店很忙，推荐书销量强；作者接着用In the meantime转到PRH作者才是受损者。</p>\n<p>特定出版社的作家卖书受影响，不能直接推出整家分店的总收入大幅下降，书店还卖其他出版商的书。</p>\n<p><strong>一部分作者处境不利，就说明各分店总收入严重减少吗？</strong></p>\n<p>不能。D把作者受到的影响转给了书店整体收入，也与前段经营表态不合。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"34题","raw":"### 34题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一次留下A：中间层次作者依靠书店推广，纠纷使他们可能面临较大的销量损失。","articleRects":[],"questionRects":[[226,1331,855,38],[283,1395,953,38],[283,1458,911,38],[283,1522,982,38],[283,1585,919,31]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"34"},"html":"<h3>34题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一次留下A：中间层次作者依靠书店推广，纠纷使他们可能面临较大的销量损失。</p>\n"},{"section":"35题","raw":"## 35题\n\n> Which of the following statements best represents Lownie’s view?  \n> 下列哪一说法最能代表劳尼的观点？\n\n题干点名Lownie，第6段用Andrew Lownie引出直接引语，因此先将第6段完整读完，注意他说的权力集中、出版业需要什么，以及小出版商的例子。\n\n> 原文参考：\n> \n> “This is all part of a wider change towards concentration of power,” says **[xxx]** agent Andrew Lownie. “The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering **[xxx]** contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers. ”\n> \n> 开始精读：\n> \n> “This is all part of a wider change towards concentration of power,” / says **[xxx]** agent Andrew Lownie. / “The publishing industry talks about diversity in terms of authors and staff / but it also needs a plurality of ways of delivering **[xxx]** contact, choice and different voices. / After all, many of the most interesting books in recent years have come from small publishers. ”\n> \n> “这一切都是更广泛的权力集中趋势的一部分，” / **[xxx]**经纪人安德鲁·劳尼说。 / “出版业谈论作者和员工的多样性， / 但它也需要多种途径来提供**[xxx]**接触、选择和不同的声音。 / 毕竟，近年来许多最有趣的书都出自小出版商。”\n\n题目要求代表劳尼的观点，要把他提出的需求与其后小出版商的例子连起来，判断例子是在支持什么主张。\n\n接下来按A—D逐项看。","articleRects":[[276,1683,1119,40],[203,1730,1192,39],[202,1778,1194,38],[202,1825,1194,38],[202,1870,1022,39]],"questionRects":[[226,1712,1048,38],[283,1776,647,37],[283,1839,655,38],[283,1902,734,38],[283,1966,725,38],[581,2079,482,55]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"35","initialReadingPids":[5]},"html":"<h2>35题</h2>\n<blockquote><p>Which of the following statements best represents Lownie’s view?<br />\n下列哪一说法最能代表劳尼的观点？</p>\n</blockquote>\n<p>题干点名Lownie，第6段用Andrew Lownie引出直接引语，因此先将第6段完整读完，注意他说的权力集中、出版业需要什么，以及小出版商的例子。</p>\n<blockquote><p>原文参考：</p>\n<p>“This is all part of a wider change towards concentration of power,” says <strong>[xxx]</strong> agent Andrew Lownie. “The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering <strong>[xxx]</strong> contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers. ”</p>\n<p>开始精读：</p>\n<p>“This is all part of a wider change towards concentration of power,” / says <strong>[xxx]</strong> agent Andrew Lownie. / “The publishing industry talks about diversity in terms of authors and staff / but it also needs a plurality of ways of delivering <strong>[xxx]</strong> contact, choice and different voices. / After all, many of the most interesting books in recent years have come from small publishers. ”</p>\n<p>“这一切都是更广泛的权力集中趋势的一部分，” / <strong>[xxx]</strong>经纪人安德鲁·劳尼说。 / “出版业谈论作者和员工的多样性， / 但它也需要多种途径来提供<strong>[xxx]</strong>接触、选择和不同的声音。 / 毕竟，近年来许多最有趣的书都出自小出版商。”</p>\n</blockquote>\n<p>题目要求代表劳尼的观点，要把他提出的需求与其后小出版商的例子连起来，判断例子是在支持什么主张。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"35题","raw":"### A. Small publishers ought to stick together.\n\n> 小出版商应该团结在一起。\n\n把A接回题干，它说的是：最能代表劳尼观点的是，小出版商应该团结在一起。\n\nA说小出版商团结，回第6段看Lownie如何使用small publishers。\n\n> it also needs a plurality of ways\n\n> many of the most interesting books in recent years have come from small publishers\n\n他举小出版商，是说近年不少有趣的书来自这些地方，用来说明多种出版渠道和不同声音有价值。\n\n他没有提出小出版商联合的组织办法。保持多种声音，与要求大家联结成一体也不是同一句建议。\n\n**称赞小出版商的贡献，就等于建议它们联合起来吗？**\n\n不等于。A把支持多样性改成了一项文中没有提出的行动方案。\n\n**第一轮判断：A排除。**","articleRects":[[276,1683,1119,40],[203,1730,1192,39],[202,1778,1194,38],[202,1825,1194,38],[202,1870,1022,39]],"questionRects":[[283,1776,647,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"35","paragraphPids":[5]},"html":"<h3>A. Small publishers ought to stick together.</h3>\n<blockquote><p>小出版商应该团结在一起。</p>\n</blockquote>\n<p>把A接回题干，它说的是：最能代表劳尼观点的是，小出版商应该团结在一起。</p>\n<p>A说小出版商团结，回第6段看Lownie如何使用small publishers。</p>\n<blockquote><p>it also needs a plurality of ways</p>\n</blockquote>\n<blockquote><p>many of the most interesting books in recent years have come from small publishers</p>\n</blockquote>\n<p>他举小出版商，是说近年不少有趣的书来自这些地方，用来说明多种出版渠道和不同声音有价值。</p>\n<p>他没有提出小出版商联合的组织办法。保持多种声音，与要求大家联结成一体也不是同一句建议。</p>\n<p><strong>称赞小出版商的贡献，就等于建议它们联合起来吗？</strong></p>\n<p>不等于。A把支持多样性改成了一项文中没有提出的行动方案。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"35题","raw":"### B. Big publishers will lose their dominance.\n\n> 大出版商将失去其主导地位。\n\n把B接回题干，它说的是：最能代表劳尼观点的是，大出版商将失去其主导地位。\n\nB说大出版商失去主导，回第6段找concentration of power。\n\n> a wider change towards concentration of power\n\n> it also needs a plurality of ways\n\nLownie说更广泛的变化正走向权力集中，后面才强调出版业需要多种渠道、选择和不同声音。他担忧的是集中会挤压多样性。\n\n这与大出版商将失去主导地位方向不同；文中没有出现大出版商势力下降的预测。\n\n**权力越来越集中，能直接改成大出版商即将失去主导吗？**\n\n不能。B把他指出的趋势说反了。\n\n**第一轮判断：B排除。**","articleRects":[[276,1683,1119,40],[203,1730,1192,39],[202,1778,1194,38],[202,1825,1194,38],[202,1870,1022,39]],"questionRects":[[283,1839,655,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"35","paragraphPids":[5]},"html":"<h3>B. Big publishers will lose their dominance.</h3>\n<blockquote><p>大出版商将失去其主导地位。</p>\n</blockquote>\n<p>把B接回题干，它说的是：最能代表劳尼观点的是，大出版商将失去其主导地位。</p>\n<p>B说大出版商失去主导，回第6段找concentration of power。</p>\n<blockquote><p>a wider change towards concentration of power</p>\n</blockquote>\n<blockquote><p>it also needs a plurality of ways</p>\n</blockquote>\n<p>Lownie说更广泛的变化正走向权力集中，后面才强调出版业需要多种渠道、选择和不同声音。他担忧的是集中会挤压多样性。</p>\n<p>这与大出版商将失去主导地位方向不同；文中没有出现大出版商势力下降的预测。</p>\n<p><strong>权力越来越集中，能直接改成大出版商即将失去主导吗？</strong></p>\n<p>不能。B把他指出的趋势说反了。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"35题","raw":"### C. The publishing industry is having a hard time.\n\n> 出版业正经历一段困难时期。\n\n把C接回题干，它说的是：最能代表劳尼观点的是，出版业正经历一段困难时期。\n\nC说出版业处境困难，回第6段看Lownie指出了哪些问题。\n\n> a wider change towards concentration of power\n\n> it also needs a plurality of ways\n\n> choice and different voices\n\n他提到权力集中，又说只讲作者和员工多样性还不够，还需要不同出版途径与声音。这说明他认为出版业当前有需要解决的问题。\n\n但having a hard time只说处境不好，没有写清他最关心的集中趋势与多样性。它可以宽泛容纳问题，还要和D比较是否够准确。\n\n**Lownie确实指出行业有问题，C是否可以先留下再看哪项更贴近？**\n\n可以先留。接着要看他的担忧具体落在经营困难，还是合并使权力集中。\n\n**第一轮判断：C保留。**","articleRects":[[276,1683,1119,40],[203,1730,1192,39],[202,1778,1194,38],[202,1825,1194,38],[202,1870,1022,39]],"questionRects":[[283,1902,734,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"35","paragraphPids":[5]},"html":"<h3>C. The publishing industry is having a hard time.</h3>\n<blockquote><p>出版业正经历一段困难时期。</p>\n</blockquote>\n<p>把C接回题干，它说的是：最能代表劳尼观点的是，出版业正经历一段困难时期。</p>\n<p>C说出版业处境困难，回第6段看Lownie指出了哪些问题。</p>\n<blockquote><p>a wider change towards concentration of power</p>\n</blockquote>\n<blockquote><p>it also needs a plurality of ways</p>\n</blockquote>\n<blockquote><p>choice and different voices</p>\n</blockquote>\n<p>他提到权力集中，又说只讲作者和员工多样性还不够，还需要不同出版途径与声音。这说明他认为出版业当前有需要解决的问题。</p>\n<p>但having a hard time只说处境不好，没有写清他最关心的集中趋势与多样性。它可以宽泛容纳问题，还要和D比较是否够准确。</p>\n<p><strong>Lownie确实指出行业有问题，C是否可以先留下再看哪项更贴近？</strong></p>\n<p>可以先留。接着要看他的担忧具体落在经营困难，还是合并使权力集中。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"35题","raw":"### D. The merger of publishers is a worrying trend.\n\n> 出版商合并是一种令人担忧的趋势。\n\n把D接回题干，它说的是：最能代表劳尼观点的是，出版商合并是一种令人担忧的趋势。\n\nD说出版商合并令人担忧，回第5段的merger，再接第6段This is all part。\n\n> 原文参考：\n> \n> It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon & Schuster—the reduction in the number of unaligned UK publishers is likely to lead to fewer **[xxx]** wars, lower **[xxx]**, and more conformity in terms of what is published.\n> \n> 开始精读：\n> \n> It comes at a time when authors are already worried about the consequences of the proposed merger / between PRH and another big publisher, Simon & Schuster—the reduction in the number of unaligned UK publishers / is likely to lead to fewer **[xxx]** wars, lower **[xxx]**, / and more conformity in terms of what is published.\n> \n> 这一切发生之时，作者们已经在担忧拟议中的合并所带来的后果， / 合并双方是企鹅兰登书屋和另一家大出版商西蒙与舒斯特——英国未结盟出版商数量的减少， / 可能导致更少的**[xxx]**争夺、更低的**[xxx]**， / 以及出版内容更加趋同。\n\n> authors are already worried about the consequences of the proposed merger\n\n> more conformity in terms of what is published\n\n> a wider change towards concentration of power\n\n> it also needs a plurality of ways\n\n第5段说合并减少独立出版商，出版内容可能更趋同。Lownie随后把这些归到权力集中，又要求多种渠道和不同声音。\n\n他举小出版商的有趣作品，也让我们看到为什么不应只剩少数大的出口。D点出了前段的合并，并接上他对多样性的担忧。\n\n**合并导致集中，而他要求保留不同声音，是否支持他对合并趋势有忧虑？**\n\n支持。D先保留，与只说行业困难的C再作比较。\n\n**第一轮判断：D保留。**","articleRects":[[274,1451,1121,38],[202,1498,1199,38],[203,1544,1193,38],[204,1591,1194,38],[202,1638,271,38],[276,1683,1119,40],[203,1730,1192,39],[202,1778,1194,38],[202,1825,1194,38],[202,1870,1022,39]],"questionRects":[[283,1966,725,38],[581,2079,482,55]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"35","initialReadingPids":[4],"paragraphPids":[4,5]},"html":"<h3>D. The merger of publishers is a worrying trend.</h3>\n<blockquote><p>出版商合并是一种令人担忧的趋势。</p>\n</blockquote>\n<p>把D接回题干，它说的是：最能代表劳尼观点的是，出版商合并是一种令人担忧的趋势。</p>\n<p>D说出版商合并令人担忧，回第5段的merger，再接第6段This is all part。</p>\n<blockquote><p>原文参考：</p>\n<p>It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster—the reduction in the number of unaligned UK publishers is likely to lead to fewer <strong>[xxx]</strong> wars, lower <strong>[xxx]</strong>, and more conformity in terms of what is published.</p>\n<p>开始精读：</p>\n<p>It comes at a time when authors are already worried about the consequences of the proposed merger / between PRH and another big publisher, Simon &amp; Schuster—the reduction in the number of unaligned UK publishers / is likely to lead to fewer <strong>[xxx]</strong> wars, lower <strong>[xxx]</strong>, / and more conformity in terms of what is published.</p>\n<p>这一切发生之时，作者们已经在担忧拟议中的合并所带来的后果， / 合并双方是企鹅兰登书屋和另一家大出版商西蒙与舒斯特——英国未结盟出版商数量的减少， / 可能导致更少的<strong>[xxx]</strong>争夺、更低的<strong>[xxx]</strong>， / 以及出版内容更加趋同。</p>\n</blockquote>\n<blockquote><p>authors are already worried about the consequences of the proposed merger</p>\n</blockquote>\n<blockquote><p>more conformity in terms of what is published</p>\n</blockquote>\n<blockquote><p>a wider change towards concentration of power</p>\n</blockquote>\n<blockquote><p>it also needs a plurality of ways</p>\n</blockquote>\n<p>第5段说合并减少独立出版商，出版内容可能更趋同。Lownie随后把这些归到权力集中，又要求多种渠道和不同声音。</p>\n<p>他举小出版商的有趣作品，也让我们看到为什么不应只剩少数大的出口。D点出了前段的合并，并接上他对多样性的担忧。</p>\n<p><strong>合并导致集中，而他要求保留不同声音，是否支持他对合并趋势有忧虑？</strong></p>\n<p>支持。D先保留，与只说行业困难的C再作比较。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"35题","raw":"### 35题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D保留。\n\n暂时保留：C、D。\n\n第一次留下C、D。C能宽泛表达劳尼所指出的行业困难；D把合并、权力集中和对多种出版途径的担忧联系起来。","articleRects":[],"questionRects":[[226,1712,1048,38],[283,1776,647,37],[283,1839,655,38],[283,1902,734,38],[283,1966,725,38],[581,2079,482,55]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"35"},"html":"<h3>35题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D保留。</li></ul>\n<p>暂时保留：C、D。</p>\n<p>第一次留下C、D。C能宽泛表达劳尼所指出的行业困难；D把合并、权力集中和对多种出版途径的担忧联系起来。</p>\n"},{"section":"进阶方法","raw":"### 把还没细读的段落接上\n\n> 原文参考：\n> \n> We shall see whether that plurality is a casualty of the current need among publishers to be big enough to take on all-comers.\n> \n> 开始精读：\n> \n> We shall see whether that plurality is a casualty / of the current need among publishers / to be big enough to take on all-comers.\n> \n> 我们将看到，这种多样性是否会成为牺牲品， / 牺牲于出版商当前的一种需要， / 即规模足够大，以应对所有对手。","articleRects":[[273,1918,1123,38],[202,1965,750,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_reading","readingPids":[7],"role":"whole_text_precision","paragraphPids":[6]},"html":"<h3>把还没细读的段落接上</h3>\n<blockquote><p>原文参考：</p>\n<p>We shall see whether that plurality is a casualty of the current need among publishers to be big enough to take on all-comers.</p>\n<p>开始精读：</p>\n<p>We shall see whether that plurality is a casualty / of the current need among publishers / to be big enough to take on all-comers.</p>\n<p>我们将看到，这种多样性是否会成为牺牲品， / 牺牲于出版商当前的一种需要， / 即规模足够大，以应对所有对手。</p>\n</blockquote>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | hunt around a bit；a stand-off with Waterstones | 用“hunt around a bit”写寻找两本新书可能遇到的情况，再以“a stand-off with Waterstones”交代共同出版商与书店的僵持；具体的买书情景引出下文要解释的争端。 | 从买书遇到的困难引出出版商与书店的争端。 |\n| 第2段 | introduced a credit limit；retiring them to their relevant sections | 用“introduced a credit limit”说明问题从出版商的信用额度限制开始，再写“retiring them to their relevant sections”：书店把该社图书从展示位置撤回所属分区，接续首段解释僵持中的行动。 | 解释争端缘起及书店对陈列、库存所作的调整。 |\n| 第3段 | reduced credit terms；our shops are exceptionally busy | 水石发言人承认“reduced credit terms”和较低库存，同时否认抵制，强调顾客仍能买到书，并用“our shops are exceptionally busy”及五月销量说明经营活跃；这一方的解释补充了前段对撤书行动的报道。 | 补充书店一方的解释，交代顾客购书与经营情况。 |\n| 第4段 | PRH authors have been the losers；rely on Waterstones staff’s passion | 转向“PRH authors have been the losers”，尤其是通常“rely on Waterstones staff’s passion”的中间层次作者；前面出版商与书店之间的争端，落到依赖书店推广的作者身上。 | 把双方争端的影响落实到依赖推广的作者身上。 |\n| 第5段 | the proposed merger；more conformity in terms of what is published | 把争端放在作者已经担忧“the proposed merger”的背景下，明确写出“more conformity in terms of what is published”这一可能后果；话题由眼前争端扩展到出版商合并与出版内容趋同。 | 由眼前争端扩展到合并引发的内容趋同问题。 |\n| 第6段 | concentration of power；a plurality of ways；from small publishers | 劳尼用“concentration of power”概括更广泛的变化，主张行业需要“a plurality of ways”，并以有趣图书“from small publishers”说明多种途径的价值；这把前段对合并后果的担忧进一步连到选择和不同声音。 | 将合并问题接到权力集中，并说明多种出版途径的价值。 |\n| 第7段 | that plurality is a casualty | 以“that plurality is a casualty”提出疑问：出版商为了有足够规模应对所有对手，是否会牺牲这种多样性；结尾承接劳尼的需求，把规模竞争与多种出版途径之间的冲突留作关注点。 | 以多样性可能被牺牲的疑问收束规模竞争带来的冲突。 |\n\n全文从出版商与书店的信用及陈列争端写起，指出依赖书店推广的作者可能受到损害，再扩展到出版商合并、权力集中和内容趋同。文章所关注的是规模与权力集中如何影响作者、出版途径和不同声音，并以多样性会不会成为牺牲品作结。","articleRects":[[274,282,1122,38],[202,330,1194,36],[204,372,1191,46],[202,423,1193,38],[202,470,1194,37],[202,515,1180,39],[426,538,11,15],[274,563,1122,38],[202,609,1193,39],[202,657,1194,37],[202,703,1193,38],[203,749,1193,39],[203,791,153,48],[274,843,1121,38],[202,889,1193,39],[202,937,1194,38],[202,984,1194,38],[202,1030,1196,38],[203,1077,1192,38],[203,1124,1192,38],[202,1171,1193,37],[202,1216,303,32],[274,1264,1122,38],[203,1311,1193,38],[202,1358,1194,37],[203,1404,615,38],[274,1451,1121,38],[202,1498,1199,38],[203,1544,1193,38],[204,1591,1194,38],[202,1638,271,38],[276,1683,1119,40],[203,1730,1192,39],[202,1778,1194,38],[202,1825,1194,38],[202,1870,1022,39],[273,1918,1123,38],[202,1965,750,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>hunt around a bit；a stand-off with Waterstones</td><td>用“hunt around a bit”写寻找两本新书可能遇到的情况，再以“a stand-off with Waterstones”交代共同出版商与书店的僵持；具体的买书情景引出下文要解释的争端。</td><td>从买书遇到的困难引出出版商与书店的争端。</td></tr><tr><td>第2段</td><td>introduced a credit limit；retiring them to their relevant sections</td><td>用“introduced a credit limit”说明问题从出版商的信用额度限制开始，再写“retiring them to their relevant sections”：书店把该社图书从展示位置撤回所属分区，接续首段解释僵持中的行动。</td><td>解释争端缘起及书店对陈列、库存所作的调整。</td></tr><tr><td>第3段</td><td>reduced credit terms；our shops are exceptionally busy</td><td>水石发言人承认“reduced credit terms”和较低库存，同时否认抵制，强调顾客仍能买到书，并用“our shops are exceptionally busy”及五月销量说明经营活跃；这一方的解释补充了前段对撤书行动的报道。</td><td>补充书店一方的解释，交代顾客购书与经营情况。</td></tr><tr><td>第4段</td><td>PRH authors have been the losers；rely on Waterstones staff’s passion</td><td>转向“PRH authors have been the losers”，尤其是通常“rely on Waterstones staff’s passion”的中间层次作者；前面出版商与书店之间的争端，落到依赖书店推广的作者身上。</td><td>把双方争端的影响落实到依赖推广的作者身上。</td></tr><tr><td>第5段</td><td>the proposed merger；more conformity in terms of what is published</td><td>把争端放在作者已经担忧“the proposed merger”的背景下，明确写出“more conformity in terms of what is published”这一可能后果；话题由眼前争端扩展到出版商合并与出版内容趋同。</td><td>由眼前争端扩展到合并引发的内容趋同问题。</td></tr><tr><td>第6段</td><td>concentration of power；a plurality of ways；from small publishers</td><td>劳尼用“concentration of power”概括更广泛的变化，主张行业需要“a plurality of ways”，并以有趣图书“from small publishers”说明多种途径的价值；这把前段对合并后果的担忧进一步连到选择和不同声音。</td><td>将合并问题接到权力集中，并说明多种出版途径的价值。</td></tr><tr><td>第7段</td><td>that plurality is a casualty</td><td>以“that plurality is a casualty”提出疑问：出版商为了有足够规模应对所有对手，是否会牺牲这种多样性；结尾承接劳尼的需求，把规模竞争与多种出版途径之间的冲突留作关注点。</td><td>以多样性可能被牺牲的疑问收束规模竞争带来的冲突。</td></tr></tbody></table>\n<p>全文从出版商与书店的信用及陈列争端写起，指出依赖书店推广的作者可能受到损害，再扩展到出版商合并、权力集中和内容趋同。文章所关注的是规模与权力集中如何影响作者、出版途径和不同声音，并以多样性会不会成为牺牲品作结。</p>\n"},{"section":"进阶回查","raw":"## 回查35题：C还是D？\n\nWhich of the following statements best represents Lownie’s view?\n\nC. The publishing industry is having a hard time.\n\nD. The merger of publishers is a worrying trend.\n\nC能让我们想到“行业有问题”，第一轮因此没有马上删掉。但Lownie究竟在担心哪件事？先把他的话与前一段接起来：\n\n> the reduction in the number of unaligned UK publishers is likely to lead to fewer [xxx] wars, lower [xxx], and more conformity in terms of what is published.\n> “This is all part of a wider change towards concentration of power,” says [xxx] agent Andrew Lownie.\n\n前段讲出版商合并、独立出版商减少，已知的结果之一是出版内容更趋同。Lownie紧接着用This把它接过来，指出权力在集中。他要求多种渠道、选择与不同声音，又说不少有趣的书来自小出版商，恰好是在说明集中之后可能失去什么。\n\n结尾还追问，出版商争着做大时，多样性会不会成为牺牲品。全文最后落下来的仍是规模扩大与不同声音能否保住的问题。\n\n**只说“出版业日子难过”，有没有说清Lownie反复提出的这项担忧？**\n\n没有。C可以泛指遇到问题，却没有说明合并带来的集中及其对多样性的影响。D把他评价的变化写明了，能接上“需要不同声音”和小出版商的例子。\n\n**35题选D。**","articleRects":[[276,1683,1119,40],[203,1730,1192,39],[202,1778,1194,38],[202,1825,1194,38],[202,1870,1022,39],[274,843,1121,38],[202,889,1193,39],[202,937,1194,38],[202,984,1194,38],[202,1030,1196,38],[203,1077,1192,38],[203,1124,1192,38],[202,1171,1193,37],[202,1216,303,32],[274,1264,1122,38],[203,1311,1193,38],[202,1358,1194,37],[203,1404,615,38],[273,1918,1123,38],[202,1965,750,38]],"questionRects":[[226,1712,1048,38],[283,1776,647,37],[283,1839,655,38],[283,1902,734,38],[283,1966,725,38],[581,2079,482,55]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["C","D"],"newEvidencePids":[3,4,7],"finalChoice":"D","qid":"35","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查35题：C还是D？</h2>\n<p>Which of the following statements best represents Lownie’s view?</p>\n<p>C. The publishing industry is having a hard time.</p>\n<p>D. The merger of publishers is a worrying trend.</p>\n<p>C能让我们想到“行业有问题”，第一轮因此没有马上删掉。但Lownie究竟在担心哪件事？先把他的话与前一段接起来：</p>\n<blockquote><p>the reduction in the number of unaligned UK publishers is likely to lead to fewer [xxx] wars, lower [xxx], and more conformity in terms of what is published.\n“This is all part of a wider change towards concentration of power,” says [xxx] agent Andrew Lownie.</p>\n</blockquote>\n<p>前段讲出版商合并、独立出版商减少，已知的结果之一是出版内容更趋同。Lownie紧接着用This把它接过来，指出权力在集中。他要求多种渠道、选择与不同声音，又说不少有趣的书来自小出版商，恰好是在说明集中之后可能失去什么。</p>\n<p>结尾还追问，出版商争着做大时，多样性会不会成为牺牲品。全文最后落下来的仍是规模扩大与不同声音能否保住的问题。</p>\n<p><strong>只说“出版业日子难过”，有没有说清Lownie反复提出的这项担忧？</strong></p>\n<p>没有。C可以泛指遇到问题，却没有说明合并带来的集中及其对多样性的影响。D把他评价的变化写明了，能接上“需要不同声音”和小出版商的例子。</p>\n<p><strong>35题选D。</strong></p>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**31. A**\n\n**32. C**\n\n**33. A**\n\n**34. A**\n\n**35. D**\n\n### 第33题答案说明\n\n本题参考资料存在A／B分歧：所附试卷的答案速查表列B；新东方参考答案列A，另有参考资料列B。\n\n本稿依据门店繁忙、销量旺盛所表达的顾客支持取A；这并不等于证明每位老顾客都从未流失。B与恢复交易的愿望有关，但hopeful尚不足以确定信用限制将解除。这里保留本稿判断，并同时注明资料中的分歧。\n\n参考来源：新东方，https://kaoyan.xdf.cn/202312/13553021.html\n\n另一参考来源：考研招生网，https://m.kyzs.com/article/14307.html","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>31. A</strong></p>\n<p><strong>32. C</strong></p>\n<p><strong>33. A</strong></p>\n<p><strong>34. A</strong></p>\n<p><strong>35. D</strong></p>\n<h3>第33题答案说明</h3>\n<p>本题参考资料存在A／B分歧：所附试卷的答案速查表列B；新东方参考答案列A，另有参考资料列B。</p>\n<p>本稿依据门店繁忙、销量旺盛所表达的顾客支持取A；这并不等于证明每位老顾客都从未流失。B与恢复交易的愿望有关，但hopeful尚不足以确定信用限制将解除。这里保留本稿判断，并同时注明资料中的分歧。</p>\n<p>参考来源：新东方，https://kaoyan.xdf.cn/202312/13553021.html</p>\n<p>另一参考来源：考研招生网，https://m.kyzs.com/article/14307.html</p>\n"}],"articleImage":"data:image/webp;base64,UklGRog9BABXRUJQVlA4THs9BAAvV0Y1AlWT4rZtIyv7j520do9/REyAeLPaPfmrfBdSZQJkB2xS4k4IKEggiYX+sN4EUOWRACz0ln8SSNKv4RxaG7eq9cLs//2r/+W0005ndzptZ3dPZ9o5tp3pTOfcmeme6Wmms3dPe8/sPbtzaGf2dNo9nc50uqed2dPD7mF3epxp59TTtNOZzrnTaaeH3cPsdnrcM5122k5nOse2u3vaTs/HaXdn2un53GR9Xs/X+/3+rAXfL/y+//liUBiCwpAlQGEICoMChSEfAQpDECsYFCgMimBQIFYwKFAYFMGgWGIFgyIYFIZgUCxBMCiCeKAwBIMin2QFhSGIhcIQDAoFCkOWWCgMQWFQoDBkiRUMChQGBQpDlljBoEB8gkERDIqPIBgUS6xgUASDwhAMiqxkBYUhGBSGYFBkJSsoDMGgMASFIUuAwhDEB4UhKAx5ClAYgljBoEBhUKAwZIkVDAoUBkUwKJZYwaBAYVAEg2IJgkERkhUUhmBQGIJBkZWsoDAEg8IQFIYssVAYEtF/D7Rt520k2dpEdXY5OiMaBEGAvwoDJikKKFDo7z+KiLBr/f8ySQoOGZm7zqyPT3t1tXt3TVd1l7bbVPtMV/t0V3u95W/ZW1Vvedu4rMfcCndCv9U9jJyJ+pC53oFHDimHiNwh82gPd7EhF8At7EZotBEb4R45RHsBm+G38M/QO7CQzCbDuRGH3B0iMncn2
