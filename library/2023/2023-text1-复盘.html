y last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究表明，一些州环境教学缺少监督。</p>\n</blockquote>\n<p>worst performers是教育表现的排序，未说明监督机制缺失。D把结果直接解释成某个未被研究交代的原因。</p>\n<p>研究评价气候变化进入科学课的情况，列最差州是强调不足及影响范围。</p>\n<p>D需要缺乏监督的事实及其与教学的关系，且environmental teaching比气候教学范围更广，不能以低分替代两项说明。</p>\n</section>"},{"title":"D. environmental teaching in some states lacks supervision","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.\n>\n> 由科学家和教师组成的非营利全国科学教育中心，去年研究各州公立学校科学课如何处理气候变化，勉强给半数州B+及以上。表现最差的十州包括一些人口最多的州，得州获最低F；由于教材广销其他地区，其影响不成比例地大。\n\n研究评价气候变化进入科学课的情况，列最差州是强调不足及影响范围。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The study shows that environmental teaching in some states lacks supervision.\n>\n> 研究表明，一些州环境教学缺少监督。\n\nD需要缺乏监督的事实及其与教学的关系，且environmental teaching比气候教学范围更广，不能以低分替代两项说明。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,892,1344,368],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-D-0\"><blockquote>\n<p>研究表明，一些州环境教学缺少监督。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>worst performers是教育表现的排序，未说明监督机制缺失。D把结果直接解释成某个未被研究交代的原因。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究表明，一些州环境教学缺少监督。</p>\n</blockquote>\n<p>worst performers是教育表现的排序，未说明监督机制缺失。D把结果直接解释成某个未被研究交代的原因。</p>\n<p>研究评价气候变化进入科学课的情况，列最差州是强调不足及影响范围。</p>\n<p>D需要缺乏监督的事实及其与教学的关系，且environmental teaching比气候教学范围更广，不能以低分替代两项说明。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n<p>由科学家和教师组成的非营利全国科学教育中心，去年研究各州公立学校科学课如何处理气候变化，勉强给半数州B+及以上。表现最差的十州包括一些人口最多的州，得州获最低F；由于教材广销其他地区，其影响不成比例地大。</p>\n</blockquote>\n<p>研究评价气候变化进入科学课的情况，列最差州是强调不足及影响范围。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study shows that environmental teaching in some states lacks supervision.</p>\n<p>研究表明，一些州环境教学缺少监督。</p>\n</blockquote>\n<p>D需要缺乏监督的事实及其与教学的关系，且environmental teaching比气候教学范围更广，不能以低分替代两项说明。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"23题结论","raw":"### 23题结论\n\n> **23. A**\n\n- A：勉强半数州达到B+以上，人口大州中仍有最低分者，说明公立学校气候教育存在明显不足，A作总体归纳。\n- B：研究评分针对教育表现，不是政策制定者的动力调查；前段还把政策制定者列为加强气候教学呼吁的群体。\n- C：得州教材广销其他地区，解释其影响不成比例地大；低分和传播范围都没有说明它不愿重写教材。\n- D：worst performers是教育表现的排序，未说明监督机制缺失。D把结果直接解释成某个未被研究交代的原因。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,892,1344,368],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"23","questionConclusion":true},"html":"<blockquote>\n<p><strong>23. A</strong></p>\n</blockquote>\n<ul>\n<li>A：勉强半数州达到B+以上，人口大州中仍有最低分者，说明公立学校气候教育存在明显不足，A作总体归纳。</li>\n<li>B：研究评分针对教育表现，不是政策制定者的动力调查；前段还把政策制定者列为加强气候教学呼吁的群体。</li>\n<li>C：得州教材广销其他地区，解释其影响不成比例地大；低分和传播范围都没有说明它不愿重写教材。</li>\n<li>D：worst performers是教育表现的排序，未说明监督机制缺失。D把结果直接解释成某个未被研究交代的原因。</li>\n</ul>\n"},{"title":"24题 · 题干、题型与核心出处","raw":"## 24题\n\n> According to Branch, state-level science standards in the US ______.\n>\n> 据布兰奇说，美国州级科学标准______。\n\n### 题型\n\n人物观点题：把地方分权与高标准未必落实连起来，区别影响限制与紧迫行动要求。\n\n题干点名Branch和state-level science standards，两者在第6段同时出现。完整阅读这一段，核对州级标准与地方决策、实际教学之间的关系。\n\n### 核心出处\n\n> in a country that decentralises decisions to local school boards.\n>\n> Even if a state is considered a high performer in its science standards, “that does not mean it will be taught” , he says.\n>\n> setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1260,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"24","questionIntro":true},"html":"<blockquote>\n<p>According to Branch, state-level science standards in the US ______.</p>\n<p>据布兰奇说，美国州级科学标准______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点题：把地方分权与高标准未必落实连起来，区别影响限制与紧迫行动要求。</p>\n<p>题干点名Branch和state-level science standards，两者在第6段同时出现。完整阅读这一段，核对州级标准与地方决策、实际教学之间的关系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>in a country that decentralises decisions to local school boards.</p>\n<p>Even if a state is considered a high performer in its science standards, “that does not mean it will be taught” , he says.</p>\n<p>setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards</p>\n</blockquote>\n"},{"title":"A. call for regular revision","raw":"### A. call for regular revision\n\n> Branch认为州级科学标准需要定期修订。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n标准是否定期更新与写好后是否真正进入课堂不同。Branch强调地方决策使高分标准也未必被教，未讨论修订周期。\n\n**出处：**\n\n> Glenn Branch, the centre's deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, \"that does not mean it will be taught\", he says.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1260,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>Branch认为州级科学标准需要定期修订。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>标准是否定期更新与写好后是否真正进入课堂不同。Branch强调地方决策使高分标准也未必被教，未讨论修订周期。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n</section>"},{"title":"A. call for regular revision","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Branch认为州级科学标准需要定期修订。\n\n`regular revision`把问题放在标准多久更新一次；第6段却用`does not mean it will be taught`说明优秀标准与实际教学之间的距离，因此回看布兰奇解释这种距离的两句话。\n\n原文把问题放在决策下放给地方学校董事会，并明确说标准优秀`does not mean it will be taught`。它区分标准制定与课堂落实。\n\n`A`的`regular revision`则把解决对象换成标准的更新周期，仿佛问题在于标准需要按时修订。\n\n即使标准已经获评优秀，原文所说的教学落差仍然可能存在；这不是一句关于标准新旧或修订频率的判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1260,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>Branch认为州级科学标准需要定期修订。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>标准是否定期更新与写好后是否真正进入课堂不同。Branch强调地方决策使高分标准也未必被教，未讨论修订周期。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Branch认为州级科学标准需要定期修订。</p>\n</blockquote>\n<p><code>regular revision</code>把问题放在标准多久更新一次；第6段却用<code>does not mean it will be taught</code>说明优秀标准与实际教学之间的距离，因此回看布兰奇解释这种距离的两句话。</p>\n<p>原文把问题放在决策下放给地方学校董事会，并明确说标准优秀<code>does not mean it will be taught</code>。它区分标准制定与课堂落实。</p>\n<p><code>A</code>的<code>regular revision</code>则把解决对象换成标准的更新周期，仿佛问题在于标准需要按时修订。</p>\n<p>即使标准已经获评优秀，原文所说的教学落差仍然可能存在；这不是一句关于标准新旧或修订频率的判断。</p>\n</section>"},{"title":"A. call for regular revision","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Glenn Branch, the centre's deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, \"that does not mean it will be taught\", he says.\n>\n> 中心副主任Glenn Branch提醒，在决策分散到地方学校董事会的国家，制定州级科学标准只是一个有限指标。即使某州科学标准被评为高水平，也不意味着这些内容真会被教。\n\nonly one limited benchmark先限制州标准的指标意义，Even if再给高标准不保证教学的例子。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> State-level science standards call for regular revision.\n>\n> Branch认为州级科学标准需要定期修订。\n\nA需要标准过时或应按周期更新的依据。即使标准优秀而且最新，地方落实的限制仍可能存在。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1260,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>Branch认为州级科学标准需要定期修订。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>标准是否定期更新与写好后是否真正进入课堂不同。Branch强调地方决策使高分标准也未必被教，未讨论修订周期。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Branch认为州级科学标准需要定期修订。</p>\n</blockquote>\n<p><code>regular revision</code>把问题放在标准多久更新一次；第6段却用<code>does not mean it will be taught</code>说明优秀标准与实际教学之间的距离，因此回看布兰奇解释这种距离的两句话。</p>\n<p>原文把问题放在决策下放给地方学校董事会，并明确说标准优秀<code>does not mean it will be taught</code>。它区分标准制定与课堂落实。</p>\n<p><code>A</code>的<code>regular revision</code>则把解决对象换成标准的更新周期，仿佛问题在于标准需要按时修订。</p>\n<p>即使标准已经获评优秀，原文所说的教学落差仍然可能存在；这不是一句关于标准新旧或修订频率的判断。</p>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n<p>中心副主任Glenn Branch提醒，在决策分散到地方学校董事会的国家，制定州级科学标准只是一个有限指标。即使某州科学标准被评为高水平，也不意味着这些内容真会被教。</p>\n</blockquote>\n<p>only one limited benchmark先限制州标准的指标意义，Even if再给高标准不保证教学的例子。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>State-level science standards call for regular revision.</p>\n<p>Branch认为州级科学标准需要定期修订。</p>\n</blockquote>\n<p>A需要标准过时或应按周期更新的依据。即使标准优秀而且最新，地方落实的限制仍可能存在。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. require urgent application","raw":"### B. require urgent application\n\n> Branch认为州级科学标准需要紧急落实。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\ndoes not mean it will be taught陈述落实不被保证，require urgent application则提出紧迫行动要求，增加了原文未给的语气和程度。\n\n**出处：**\n\n> Glenn Branch, the centre's deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, \"that does not mean it will be taught\", he says.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1260,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-B-0\"><blockquote>\n<p>Branch认为州级科学标准需要紧急落实。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>does not mean it will be taught陈述落实不被保证，require urgent application则提出紧迫行动要求，增加了原文未给的语气和程度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n</section>"},{"title":"B. require urgent application","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> Branch认为州级科学标准需要紧急落实。\n\ndoes not mean it will be taught陈述落实不被保证，require urgent application则提出紧迫行动要求，增加了原文未给的语气和程度。\n\nBranch先解释地方学校董事会掌握决策，再用高标准也未必教说明州级指标作用有限。\n\nB需要必须立即落实的主张。重要性或落实差距不自动等于urgent，C才概括他实际指出的影响限制。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1260,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-B-0\"><blockquote>\n<p>Branch认为州级科学标准需要紧急落实。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>does not mean it will be taught陈述落实不被保证，require urgent ap 落实，程度与only one limited相合。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. cater to local needs","raw":"### D. cater to local needs\n\n> Branch认为州级科学标准迎合地方需求。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n地方学校董事会是决策主体，原文未说州级标准的内容已满足地方需求。D把权力所在地改成标准制定目的。\n\n**出处：**\n\n> Glenn Branch, the centre's deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, \"that does not mean it will be taught\", he says.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1260,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>Branch认为州级科学标准迎合地方需求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>地方学校董事会是决策主体，原文未说州级标准的内容已满足地方需求。D把权力所在地改成标准制定目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n</section>"},{"title":"D. cater to local needs","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Branch认为州级科学标准迎合地方需求。\n\n`cater to local needs`把标准的内容与地方需要相接；第6段的`local school boards`谈到地方层级，因此回看地方在句子中承担的是提出需求、获得满足，还是掌握决策权的角色。\n\n原文说决策权下放给`local school boards`，地方学校董事会是决策的主体；随后说明州级标准获评优秀也不一定会被教授。`D`的`cater to local needs`则说州级标准本身是为满足地方需求而设置的。地方能决定教学，并不能说明上级标准内容已照顾地方需要；原文恰是在区分州级标准和地方课堂之间的作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1260,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-24-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>Branch认为州级科学标准迎合地方需求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>地方学校董事会是决策主体，原文未说州级标准的内容已满足地方需求。D把权力所在地改成标准制定目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Branch认为州级科学标准迎合地方需求。</p>\n</blockquote>\n<p><code>cater to local needs</code>把标准的内容与地方需要相接；第6段的<code>local school boards</code>谈到地方层级，因此回看地方在句子中承担的是提出需求、获得满足，还是掌握决策权的角色。</p>\n<p>原文说决策权下放给<code>local school boards</code>，地方学校董事会是决策的主体；随后说明州级标准获评优秀也不一定会被教授。<code>D</code>的<code>cater to local needs</code>则说州级标准本身是为满足地方需求而设置的。地方能决定教学，并不能说明上级标准内容已照顾地方需要；原文恰是在区分州级标准和地方课堂之间的作用。</p>\n</section>"},{"title":"D. cater to local needs","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Glenn Branch, the centre's deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, \"that does not mean it will be taught\", he says.\n>\n> 中心副主任Glenn Branch提醒，在决策分散到地方学校董事会的国家，制定州级科学标准只是一个有限指标。即使某州科学标准被评为高水平，也不意味着这些内容真会被教。\n\nBranch区分州级标准与地方课堂，借分权解释为什么标准优秀不能保证教学。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> State-level science standards cater to local needs.\n>\n> Branch认为州级科学标准迎合地方需求。\n\nD需要地方需求与标准内容适配的依据。地方可以决定怎么教，不等于州标准本身就是为迎合地方而定。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1260,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>Branch认为州级科学标准迎合地方需求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>地方学校董事会是决策主体，原文未说州级标准的内容已满足地方需求。D把权力所在地改成标准制定目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Branch认为州级科学标准迎合地方需求。</p>\n</blockquote>\n<p><code>cater to local needs</code>把标准的内容与地方需要相接；第6段的<code>local school boards</code>谈到地方层级，因此回看地方在句子中承担的是提出需求、获得满足，还是掌握决策权的角色。</p>\n<p>原文说决策权下放给<code>local school boards</code>，地方学校董事会是决策的主体；随后说明州级标准获评优秀也不一定会被教授。<code>D</code>的<code>cater to local needs</code>则说州级标准本身是为满足地方需求而设置的。地方能决定教学，并不能说明上级标准内容已照顾地方需要；原文恰是在区分州级标准和地方课堂之间的作用。</p>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n<p>中心副主任Glenn Branch提醒，在决策分散到地方学校董事会的国家，制定州级科学标准只是一个有限指标。即使某州科学标准被评为高水平，也不意味着这些内容真会被教。</p>\n</blockquote>\n<p>Branch区分州级标准与地方课堂，借分权解释为什么标准优秀不能保证教学。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>State-level science standards cater to local needs.</p>\n<p>Branch认为州级科学标准迎合地方需求。</p>\n</blockquote>\n<p>D需要地方需求与标准内容适配的依据。地方可以决定怎么教，不等于州标准本身就是为迎合地方而定。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"24题结论","raw":"### 24题结论\n\n> **24. C**\n\n- A：标准是否定期更新与写好后是否真正进入课堂不同。Branch强调地方决策使高分标准也未必被教，未讨论修订周期。\n- B：does not mean it will be taught陈述落实不被保证，require urgent application则提出紧迫行动要求，增加了原文未给的语气和程度。\n- C：limited benchmark是有限的衡量指标；决策权分散到地方，州标准再好也不能单独保证教学，C概括影响有限。\n- D：地方学校董事会是决策主体，原文未说州级标准的内容已满足地方需求。D把权力所在地改成标准制定目的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1260,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"24","questionConclusion":true},"html":"<blockquote>\n<p><strong>24. C</strong></p>\n</blockquote>\n<ul>\n<li>A：标准是否定期更新与写好后是否真正进入课堂不同。Branch强调地方决策使高分标准也未必被教，未讨论修订周期。</li>\n<li>B：does not mean it will be taught陈述落实不被保证，require urgent application则提出紧迫行动要求，增加了原文未给的语气和程度。</li>\n<li>C：limited benchmark是有限的衡量指标；决策权分散到地方，州标准再好也不能单独保证教学，C概括影响有限。</li>\n<li>D：地方学校董事会是决策主体，原文未说州级标准的内容已满足地方需求。D把权力所在地改成标准制定目的。</li>\n</ul>\n"},{"title":"25题 · 题干、题型与核心出处","raw":"## 25题\n\n> It is implied in the last paragraph that climate change teaching in some schools ______.\n>\n> 末段暗示，一些学校的气候变化教学______。\n\n### 题型\n\n隐含意义推断题：追踪外部资助、非官方材料、教师接收的路径，保留可能性的程度。\n\n题干明确给出the last paragraph，完整阅读第8段，先看官方指南和教科书，再读发给教师的非官方材料及其资助者。\n\n### 核心出处\n\n> Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1627,1344,450],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"25","questionIntro":true},"html":"<blockquote>\n<p>It is implied in the last paragraph that climate change teaching in some schools ______.</p>\n<p>末段暗示，一些学校的气候变化教学______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>隐含意义推断题：追踪外部资助、非官方材料、教师接收的路径，保留可能性的程度。</p>\n<p>题干明确给出the last paragraph，完整阅读第8段，先看官方指南和教科书，再读发给教师的非官方材料及其资助者。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n"},{"title":"A. agrees to major public demands","raw":"### A. agrees to major public demands\n\n> 一些学校气候变化教学符合公众主要诉求。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n公众要求加强事实教学、官方材料反映科学共识，都不等于课堂已满足公众主要诉求；末段反而指出偏向材料仍在流入。\n\n**出处：**\n\n> Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\n> Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1627,1344,450],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>一些学校气候变化教学符合公众主要诉求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>公众要求加强事实教学、官方材料反映科学共识，都不等于课堂已满足公众主要诉求；末段反而指出偏向材料仍在流入。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\nBranch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n</section>"},{"title":"A. agrees to major public demands","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 一些学校气候变化教学符合公众主要诉求。\n\n`agrees to major public demands`把课堂教学与公众要求相接；末段的`reflect scientific consensus`说官方材料反映科学共识。第4段虽然出现`step up demands`，也需要与末段对照，分清呼吁是否已经得到满足。\n\n末段的`reflect scientific consensus`把官方指南和教科书与科学共识相连，却接着强调偏见更多的非官方材料仍被发给教师。第4段的公众行动是加大要求学校重视气候事实的呼吁。\n\n`A`的`agrees to major public demands`把“有人在要求”与“官方材料反映科学共识”合成“课堂教学已经符合公众主要诉求”。\n\n呼吁的存在不等于诉求已实现，材料符合科学共识也不等于课堂整体符合公众要求，尤其末段还提出另一类材料的影响。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1627,1344,450],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>一些学校气候变化教学符合公众主要诉求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>公众要求加强事实教学、官方材料反映科学共识，都不等于课堂已满足公众主要诉求；末段反而指出偏向材料仍在流入。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\nBranch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些学校气候变化教学符合公众主要诉求。</p>\n</blockquote>\n<p><code>agrees to major public demands</code>把课堂教学与公众要求相接；末段的<code>reflect scientific consensus</code>说官方材料反映科学共识。第4段虽然出现<code>step up demands</code>，也需要与末段对照，分清呼吁是否已经得到满足。</p>\n<p>末段的<code>reflect scientific consensus</code>把官方指南和教科书与科学共识相连，却接着强调偏见更多的非官方材料仍被发给教师。第4段的公众行动是加大要求学校重视气候事实的呼吁。</p>\n<p><code>A</code>的<code>agrees to major public demands</code>把“有人在要求”与“官方材料反映科学共识”合成“课堂教学已经符合公众主要诉求”。</p>\n<p>呼吁的存在不等于诉求已实现，材料符合科学共识也不等于课堂整体符合公众要求，尤其末段还提出另一类材料的影响。</p>\n</section>"},{"title":"A. agrees to major public demands","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\n> Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.\n>\n> 这类争论反映美国各地及全球激烈讨论，研究者、政策制定者、教师和学生都在加强要求，希望学校更加重视气候变化事实的教学。\n>\n> Branch指出，即使越来越多官方指南和教材反映气候变化的科学共识，向教师分发的非官方教育材料仍在传递更偏向的看法，其中包括自由意志主义智库和能源行业协会资助的材料。\n\neven if先让步承认官方材料改善，再把重点放到教师接收非官方材料这一限制。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Climate change teaching meets the public's main demands.\n>\n> 一些学校气候变化教学符合公众主要诉求。\n\nA需要诉求已在实际教学中实现的证据。有人提出需求与正式文件有所改进，都不能替代课堂整体结果。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1627,1344,450],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>一些学校气候变化教学符合公众主要诉求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>公众要求加强事实教学、官方材料反映科学共识，都不等于课堂已满足公众主要诉求；末段反而指出偏向材料仍在流入。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\nBranch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些学校气候变化教学符合公众主要诉求。</p>\n</blockquote>\n<p><code>agrees to major public demands</code>把课堂教学与公众要求相接；末段的<code>reflect scientific consensus</code>说官方材料反映科学共识。第4段虽然出现<code>step up demands</code>，也需要与末段对照，分清呼吁是否已经得到满足。</p>\n<p>末段的<code>reflect scientific consensus</code>把官方指南和教科书与科学共识相连，却接着强调偏见更多的非官方材料仍被发给教师。第4段的公众行动是加大要求学校重视气候事实的呼吁。</p>\n<p><code>A</code>的<code>agrees to major public demands</code>把“有人在要求”与“官方材料反映科学共识”合成“课堂教学已经符合公众主要诉求”。</p>\n<p>呼吁的存在不等于诉求已实现，材料符合科学共识也不等于课堂整体符合公众要求，尤其末段还提出另一类材料的影响。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\nBranch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n<p>这类争论反映美国各地及全球激烈讨论，研究者、政策制定者、教师和学生都在加强要求，希望学校更加重视气候变化事实的教学。</p>\n<p>Branch指出，即使越来越多官方指南和教材反映气候变化的科学共识，向教师分发的非官方教育材料仍在传递更偏向的看法，其中包括自由意志主义智库和能源行业协会资助的材料。</p>\n</blockquote>\n<p>even if先让步承认官方材料改善，再把重点放到教师接收非官方材料这一限制。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Climate change teaching meets the public&#39;s main demands.</p>\n<p>一些学校气候变化教学符合公众主要诉求。</p>\n</blockquote>\n<p>A需要诉求已在实际教学中实现的证据。有人提出需求与正式文件有所改进，都不能替代课堂整体结果。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. reflects teachers’ personal biases","raw":"### B. reflects teachers’ personal biases\n\n> 一些学校气候变化教学体现教师个人偏见。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\nslanted perspectives是材料传达的偏向观点，教师是接收者，B却把偏向来源归成教师个人。\n\n**出处：**\n\n> Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational ma ockquote>\n<p>一些学校气候变化教学体现教师个人偏见。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>slanted perspectives是材料传达的偏向观点，教师是接收者，B却把偏向来源归成教师个人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些学校气候变化教学体现教师个人偏见。</p>\n</blockquote>\n<p>slanted perspectives是材料传达的偏向观点，教师是接收者，B却把偏向来源归成教师个人。</p>\n<p>官方与非官方材料对照之后，作者列智库和行业协会资助者，说明观点如何从外部进入教学资源。</p>\n<p>B需要教师原有个人偏见被教学表达的证据。收到材料不等于创造其偏见，也不能直接证明教师已经采用它。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n<p>Branch指出，即使越来越多官方指南和教材反映气候变化的科学共识，向教师分发的非官方教育材料仍在传递更偏向的看法，其中包括自由意志主义智库和能源行业协会资助的材料。</p>\n</blockquote>\n<p>官方与非官方材料对照之后，作者列智库和行业协会资助者，说明观点如何从外部进入教学资源。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Climate teaching reflects teachers’ personal biases.</p>\n<p>一些学校气候变化教学体现教师个人偏见。</p>\n</blockquote>\n<p>B需要教师原有个人偏见被教学表达的证据。收到材料不等于创造其偏见，也不能直接证明教师已经采用它。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. may misrepresent the energy sector","raw":"### C. may misrepresent the energy sector\n\n> 一些学校气候变化教学可能歪曲能源行业。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\n能源行业 , unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些学校气候变化教学可能受外部力量左右。</p>\n</blockquote>\n<p><code>swayed by external forces</code>需要一条从校外进入教学的影响途径；第8段的<code>materials sponsored by energy industry associations</code>说明行业协会资助材料，而前句说明材料被发给教师，因此把两句连起来看。</p>\n<p>原文先说明带有更多偏见的非官方材料流向教师，再以<code>materials sponsored by energy industry associations</code>指出其中一种资助来源。这样，学校以外的行业组织就可以通过教学材料接近课堂。</p>\n<p><code>D</code>的<code>swayed by external forces</code>把这条“行业资助—材料发给教师”的途径概括为教学可能受外部力量左右。</p>\n<p><code>can</code>只说存在可能，不要求证明所有教师都采用了这些材料，因此能与末段的推断力度相接。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n<p>Branch指出，即使越来越多官方指南和教材反映气候变化的科学共识，向教师分发的非官方教育材料仍在传递更偏向的看法，其中包括自由意志主义智库和能源行业协会资助的材料。</p>\n</blockquote>\n<p>即使正式指南趋于科学共识，非官方材料仍流向教师，作者据此提醒正规标准之外还有影响。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Climate teaching can be swayed by external forces.</p>\n<p>一些学校气候变化教学可能受外部力量左右。</p>\n</blockquote>\n<p>can被外部左右不等于所有教师都采用这些材料，也不等于所有课堂已被控制；它只概括已呈现渠道带来的可能影响。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"25题结论","raw":"### 25题结论\n\n> **25. D**\n\n- A：公众要求加强事实教学、官方材料反映科学共识，都不等于课堂已满足公众主要诉求；末段反而指出偏向材料仍在流入。\n- B：slanted perspectives是材料传达的偏向观点，教师是接收者，B却把偏向来源归成教师个人。\n- C：能源行业协会是材料资助者，教学材料传递的是对气候变化的偏向观点，C却把能源行业写成被歪曲的对象。\n- D：外部智库或行业资助材料，再向教师分发，构成校外力量影响课堂的途径，D保留可能性推断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1627,1344,450],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"25","questionConclusion":true},"html":"<blockquote>\n<p><strong>25. D</strong></p>\n</blockquote>\n<ul>\n<li>A：公众要求加强事实教学、官方材料反映科学共识，都不等于课堂已满足公众主要诉求；末段反而指出偏向材料仍在流入。</li>\n<li>B：slanted perspectives是材料传达的偏向观点，教师是接收者，B却把偏向来源归成教师个人。</li>\n<li>C：能源行业协会是材料资助者，教学材料传递的是对气候变化的偏向观点，C却把能源行业写成被歪曲的对象。</li>\n<li>D：外部智库或行业资助材料，再向教师分发，构成校外力量影响课堂的途径，D保留可能性推断。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：德州气候教育争议的背景**（段落1引入） 天气比喻：德州天气已凉 // 但教育委员会会议\"温度\"将高 → 核心议题：如何在德州学校教授气候变化\n\n↓（具体争议方）\n\n**逻辑层次2：能源利益代表的立场**（段落2-3对立观点） 哈迪立场：【同情能源部门 → 抵制科学标准改变】→ 论据：（反对气候变化恐慌的科学家一样多 + 德州是能源州 + \"记住饭碗在哪\"）// 科学界反驳：哈迪随意驳回学者科学家的职业工作\n\n↓（更大背景）\n\n**逻辑层次3：全国性教育改革需求**（段落4宏观趋势） 全球趋势：美国和世界各地激烈讨论 → 各方要求：（研究人员 + 政策制定者 + 教师 + 学生）→ 加大关注教授气候变化事实\n\n↓（教育现状评估）\n\n**逻辑层次4：气候教育的不足现状**（段落5-6现状分析） 研究发现：【只有一半州获B+以上 → 德州最差（F级）+ 影响力大（教科书广泛销售）】→ 局限性：州级标准只是有限基准（决策权在地方）→ 即使标准好也不保证被教授\n\n↓（具体问题）\n\n**逻辑层次5：教育实施的结构性问题**（段落7-8深层问题） 课程设置问题：【气候变化整合不均：（高中地球科学√ // 低年级课程× + 主流学科如生物化学× + 社会研究×）】→ 外部干扰：即使官方材料反映科学共识 // 非官方偏颇材料仍在分发（自由主义智库 + 能源行业协会赞助）\n\n↑（全文主旨）\n\n全文核心观点：德克萨斯州的气候变化教育争议反映了美国教育体系中的深层矛盾：尽管科学界有共识且改革呼声高涨，但能源利益集团的影响、地方分权的教育体制以及外部势力的干预，使得气候变化教育面临重重阻碍。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：德州气候教育争议的背景</strong>（段落1引入） 天气比喻：德州天气已凉 // 但教育委员会会议&quot;温度&quot;将高 → 核心议题：如何在德州学校教授气候变化</p>\n<p>↓（具体争议方）</p>\n<p><strong>逻辑层次2：能源利益代表的立场</strong>（段落2-3对立观点） 哈迪立场：【同情能源部门 → 抵制科学标准改变】→ 论据：（反对气候变化恐慌的科学家一样多 + 德州是能源州 + &quot;记住饭碗在哪&quot;）// 科学界反驳：哈迪随意驳回学者科学家的职业工作</p>\n<p>↓（更大背景）</p>\n<p><strong>逻辑层次3：全国性教育改革需求</strong>（段落4宏观趋势） 全球趋势：美国和世界各地激烈讨论 → 各方要求：（研究人员 + 政策制定者 + 教师 + 学生）→ 加大关注教授气候变化事实</p>\n<p>↓（教育现状评估）</p>\n<p><strong>逻辑层次4：气候教育的不足现状</strong>（段落5-6现状分析） 研究发现：【只有一半州获B+以上 → 德州最差（F级）+ 影响力大（教科书广泛销售）】→ 局限性：州级标准只是有限基准（决策权在地方）→ 即使标准好也不保证被教授</p>\n<p>↓（具体问题）</p>\n<p><strong>逻辑层次5：教育实施的结构性问题</strong>（段落7-8深层问题） 课程设置问题：【气候变化整合不均：（高中地球科学√ // 低年级课程× + 主流学科如生物化学× + 社会研究×）】→ 外部干扰：即使官方材料反映科学共识 // 非官方偏颇材料仍在分发（自由主义智库 + 能源行业协会赞助）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：德克萨斯州的气候变化教育争议反映了美国教育体系中的深层矛盾：尽管科学界有共识且改革呼声高涨，但能源利益集团的影响、地方分权的教育体制以及外部势力的干预，使得气候变化教育面临重重阻碍。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. A heated local dispute over what schools should teach\n\n> 学校该教什么引发的激烈地方争论\n\n天气降温与会议升温形成比喻对照，随后呈现Hardy反对改标准和Quinn对她轻视科研的批评。\n\n> The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.\n\n实际天气转凉与会议高温形成比喻对照，后半句把高温明确落在教学争论的气氛上。\n\n> \"Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.\"\n\nHardy援引得州能源利益支持自己的抵制立场，之后引用科研界反驳，双方分歧由此展开。\n\n> \"They casually dismiss the career work of scholars and scientists as just another misguided opinion,\" says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.\n\nQuinn批评科研工作被轻率当作错误意见，标题要抓住学校应教什么的争议，不能改成天气科学本身的说明。\n\n这一部分的推进关系是：\n\n> 天气引出会议热度 → 能源立场反对修改标准 → 科研界批评轻视证据\n\nheated dispute概括多方争论，what schools teach明确争论对象。\n\n再看最强干扰项G：A final decision to remove science from schools。\n\n会议争论未给出最终政策，更不是取消所有科学教育。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. A heated local dispute over what schools should teach</p>\n<blockquote>\n<p>学校该教什么引发的激烈地方争论</p>\n</blockquote>\n<p>天气降温与会议升温形成比喻对照，随后呈现Hardy反对改标准和Quinn对她轻视科研的批评。</p>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n</blockquote>\n<p>实际天气转凉与会议高温形成比喻对照，后半句把高温明确落在教学争论的气氛上。</p>\n<blockquote>\n<p>&quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;</p>\n</blockquote>\n<p>Hardy援引得州能源利益支持自己的抵制立场，之后引用科研界反驳，双方分歧由此展开。</p>\n<blockquote>\n<p>&quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n</blockquote>\n<p>Quinn批评科研工作被轻率当作错误意见，标题要抓住学校应教什么的争议，不能改成天气科学本身的说明。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>天气引出会议热度 → 能源立场反对修改标准 → 科研界批评轻视证据</p>\n</blockquote>\n<p>heated dispute概括多方争论，what schools teach明确争论对象。</p>\n<p>再看最强干扰项G：A final decision to remove science from schools。</p>\n<p>会议争论未给出最终政策，更不是取消所有科学教育。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】E. Broad demands alongside evidence of weak provision\n\n> 广泛需求与教育供给薄弱证据并存\n\n从地方争议转到更广泛教学需求，再以州学校研究评分显示气候教育普遍不足。\n\n> Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\n\nSuch debate将得州会议扩展到全国和全球，加强气候事实教学的呼声并不限于一地。\n\n> A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher.\n\n研究给勉强半数州B+以上，以教育表现说明现有供给与加强教学需求之间仍有差距。\n\n> Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.\n\n得州低分却因教材广销而影响大，扩大了教育不足的后果范围。\n\n这一部分的推进关系是：\n\n> 加强气候教学需求扩大 → 全国评分显示不足 → 低分人口大州教材影响外溢\n\nbroad demands对应step up demands，weak provision对应barely half及低分州。\n\n再看最强干扰项F：A guarantee that every textbook is free of bias。\n\n评分不能证明教材没有偏见，末段还提出偏向材料问题。\n\n**42题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】E. Broad demands alongside evidence of weak provision</p>\n<blockquote>\n<p>广泛需求与教育供给薄弱证据并存</p>\n</blockquote>\n<p>从地方争议转到更广泛教学需求，再以州学校研究评分显示气候教育普遍不足。</p>\n<blockquote>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.</p>\n</blockquote>\n<p>Such debate将得州会议扩展到全国和全球，加强气候事实教学的呼声并不限于一地。</p>\n<blockquote>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher.</p>\n</blockquote>\n<p>研究给勉强半数州B+以上，以教育表现说明现有供给与加强教学需求之间仍有差距。</p>\n<blockquote>\n<p>Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n</blockquote>\n<p>得州低分却因教材广销而影响大，扩大了教育不足的后果范围。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>加强气候教学需求扩大 → 全国评分显示不足 → 低分人口大州教材影响外溢</p>\n</blockquote>\n<p>broad demands对应step up demands，weak provision对应barely half及低分州。</p>\n<p>再看最强干扰项F：A guarantee that every textbook is free of bias。</p>\n<p>评分不能证明教材没有偏见，末段还提出偏向材料问题。</p>\n<p><strong>42题选E。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】D. Why good state standards may not reach the classroom\n\n> 为何优秀州标准未必进入课堂\n\nBranch说明地方拥有决策权，州标准好也不代表真的教授。\n\n> Glenn Branch, the centre's deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards.\n\nlimited benchmark限定州级标准只能作一项有限指标，因为实际决定权在地方学校董事会。\n\n> Even if a state is considered a high performer in its science standards, \"that does not mean it will be taught\", he says.\n\nEven if承认标准本身优秀，也不保证内容进入课堂，标题应概括文件标准与实际教学的距离。\n\n这一部分的推进关系是：\n\n> 地方决策分散 → 州标准仅是有限指标 → 优秀标准未必落实\n\nmay not reach对应does not mean it will be taught，保留标准与实施之间的缺口。\n\n再看最强干扰项G：A final decision to remove science from schools。\n\n作用有限不等于确定移除科学教学。\n\n**43题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】D. Why good state standards may not reach the classroom</p>\n<blockquote>\n<p>为何优秀州标准未必进入课堂</p>\n</blockquote>\n<p>Branch说明地方拥有决策权，州标准好也不代表真的教授。</p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards.</p>\n</blockquote>\n<p>limited benchmark限定州级标准只能作一项有限指标，因为实际决定权在地方学校董事会。</p>\n<blockquote>\n<p>Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n<p>Even if承认标准本身优秀，也不保证内容进入课堂，标题应概括文件标准与实际教学的距离。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>地方决策分散 → 州标准仅是有限指标 → 优秀标准未必落实</p>\n</blockquote>\n<p>may not reach对应does not mean it will be taught，保留标准与实施之间的缺口。</p>\n<p>再看最强干扰项G：A final decision to remove science from schools。</p>\n<p>作用有限不等于确定移除科学教学。</p>\n<p><strong>43题选D。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】A. The uneven place of climate change across ages and subjects\n\n> 气候变化在不同年龄和学科中的不均衡位置\n\n气候变化在部分高中学科融入较好，但低龄课程及常见学科覆盖不足。\n\n> Another issue is that while climate change is well integrated into some subjects and at some ages — such as earth and space sciences in high schools — it is not as well represented in curricula for younger children and in subjects that are more widely taught, such as biology and chemistry.\n\nwhile将部分高中学科融入良好与低龄及常见学科覆盖不足对照，问题是内容分布不均。\n\n> It is also less prominent in many social studies courses.\n\nalso把社会研究课程补入覆盖不足的范围，继续扩大年龄与学科差异，而不是新增教师个人态度问题。\n\n这一部分的推进关系是：\n\n> 部分年龄学科融入较好 → 低龄与普遍科目不足 → 社会研究也不突出\n\nuneven place对应while的对照，ages and subjects保留两个维度。\n\n再看最强干扰项D：Why good state standards may not reach the classroom。\n\nD解释制度执行，本段转向课程分布的具体缺口。\n\n**44题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】A. The uneven place of climate change across ages and subjects</p>\n<blockquote>\n<p>气候变化在不同年龄和学科中的不均衡位置</p>\n</blockquote>\n<p>气候变化在部分高中学科融入较好，但低龄课程及常见学科覆盖不足。</p>\n<blockquote>\n<p>Another issue is that while climate change is well integrated into some subjects and at some ages — such as earth and space sciences in high schools — it is not as well represented in curricula for younger children and in subjects that are more widely taught, such as biology and chemistry.</p>\n</blockquote>\n<p>while将部分高中学科融入良好与低龄及常见学科覆盖不足对照，问题是内容分布不均。</p>\n<blockquote>\n<p>It is also less prominent in many social studies courses.</p>\n</blockquote>\n<p>also把社会研究课程补入覆盖不足的范围，继续扩大年龄与学科差异，而不是新增教师个人态度问题。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>部分年龄学科融入较好 → 低龄与普遍科目不足 → 社会研究也不突出</p>\n</blockquote>\n<p>uneven place对应while的对照，ages and subjects保留两个维度。</p>\n<p>再看最强干扰项D：Why good state standards may not reach the classroom。</p>\n<p>D解释制度执行，本段转向课程分布的具体缺口。</p>\n<p><strong>44题选A。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Official agreement does not exclude outside influence\n\n> 官方共识不能排除外部影响\n\n即使官方材料反映科学共识，带偏向的非官方材料仍发给教师，部分由智库和行业资助。\n\n> Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers.\n\neven if让步肯定官方材料趋向共识，重点转到仍向教师分发的偏向非官方材料。\n\n> They include materials sponsored by libertarian think-tanks and energy industry associations.\n\nThey回指这些材料，智库和行业协会是资助来源，由此说明正式标准之外的外部影响渠道。\n\n这一部分的推进关系是：\n\n> 官方材料反映共识 → 非官方偏向材料仍流入 → 外部资助者可影响教学资源\n\ndoes not exclude对应even if，outside influence沿资助者—材料—教师进入教学。\n\n再看最强干扰项F：A guarantee that every textbook is free of bias。\n\n原文明写slanted perspectives，不存在全部无偏见的保证。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Official agreement does not exclude outside influence</p>\n<blockquote>\n<p>官方共识不能排除外部影响</p>\n</blockquote>\n<p>即使官方材料反映科学共识，带偏向的非官方材料仍发给教师，部分由智库和行业资助。</p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers.</p>\n</blockquote>\n<p>even if让步肯定官方材料趋向共识，重点转到仍向教师分发的偏向非官方材料。</p>\n<blockquote>\n<p>They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n<p>They回指这些材料，智库和行业协会是资助来源，由此说明正式标准之外的外部影响渠道。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>官方材料反映共识 → 非官方偏向材料仍流入 → 外部资助者可影响教学资源</p>\n</blockquote>\n<p>does not exclude对应even if，outside influence沿资助者—材料—教师进入教学。</p>\n<p>再看最强干扰项F：A guarantee that every textbook is free of bias。</p>\n<p>原文明写slanted perspectives，不存在全部无偏见的保证。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 用天气与会议的对照引出教学争论 |\n| B | 区分反对者立场与科研界批评 |\n| C | 从地方冲突扩展到全国不足及教材影响 |\n| D | 引出官方与非官方材料差别 |\n| E | 指出制度标准不必然转化成课堂教学 |\n| F | 补充年龄学科之间的覆盖差异 |\n| G | 明确偏向材料的外部资助和传递路径 |\n| H | 总结标准实施课程和材料多层影响 |\n\n全文推进：\n\n> 用天气与会议的对照引出教学争论 → 区分反对者立场与科研界批评 → 从地方冲突扩展到全国不足及教材影响 → 指出制度标准不必然转化成课堂教学 → 补充年龄学科之间的覆盖差异 → 引出官方与非官方材料差别 → 明确偏向材料的外部资助和传递路径 → 总结标准实施课程和材料多层影响\n\n完整顺序：\n\n**A → B → C → E → F → D → G → H**\n\n41—45：B、C、F、D、G。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>用天气与会议的对照引出教学争论</td>\n</tr>\n<tr>\n<td>B</td>\n<td>区分反对者立场与科研界批评</td>\n</tr>\n<tr>\n<td>C</td>\n<td>从地方冲突扩展到全国不足及教材影响</td>\n</tr>\n<tr>\n<td>D</td>\n<td>引出官方与非官方材料差别</td>\n</tr>\n<tr>\n<td>E</td>\n<td>指出制度标准不必然转化成课堂教学</td>\n</tr>\n<tr>\n<td>F</td>\n<td>补充年龄学科之间的覆盖差异</td>\n</tr>\n<tr>\n<td>G</td>\n<td>明确偏向材料的外部资助和传递路径</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结标准实施课程和材料多层影响</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>用天气与会议的对照引出教学争论 → 区分反对者立场与科研界批评 → 从地方冲突扩展到全国不足及教材影响 → 指出制度标准不必然转化成课堂教学 → 补充年龄学科之间的覆盖差异 → 引出官方与非官方材料差别 → 明确偏向材料的外部资助和传递路径 → 总结标准实施课程和材料多层影响</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → B → C → E → F → D → G → H</strong></p>\n<p>41—45：B、C、F、D、G。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → B → C。\n\n先看前段A的结尾：\n\n> The disagreement is about the place of scientific knowledge in school, not simply about the temperature outside.\n\n再看B段开头：\n\n> One participant in that conflict links her position to the energy sector and resists proposed changes.\n\n前段the disagreement已确立教学争议，One participant in that conflict直接接其中一方，介绍与能源行业相连的反对者。\n\n本段内部继续写道：\n\n> Scientists and education advocates dispute her approach. Their criticism is that established scientific work is being dismissed as merely another misguided opinion, rather than evaluated as a body of evidence.\n\n随后科学家和教育倡导者反驳，Their criticism明确批评科研证据被降成错误意见，完成争议两方的展开。\n\n后段C开头是：\n\n> The demand for stronger climate teaching reaches beyond this single meeting.\n\nbeyond this single meeting将地方冲突扩展到更广范围，下一段才进入全国教育表现。\n\n这三段的推进关系：\n\n> 用天气与会议的对照引出教学争论 → 区分反对者立场与科研界批评 → 从地方冲突扩展到全国不足及教材影响\n\n再检验候选F：\n\n> Actual coverage also differs by age and subject.\n\n年龄与学科覆盖差异在后面实际教学讨论中才展开，这里仍需交代争议内容，否则single meeting所概括的冲突欠缺双方具体立场。\n\n**41题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>41题是全文第2段，局部关系为A → B → C。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>The disagreement is about the place of scientific knowledge in school, not simply about the temperature outside.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>One participant in that conflict links her position to the energy sector and resists proposed changes.</p>\n</blockquote>\n<p>前段the disagreement已确立教学争议，One participant in that conflict直接接其中一方，介绍与能源行业相连的反对者。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Scientists and education advocates dispute her approach. Their criticism is that established scientific work is being dismissed as merely another misguided opinion, rather than evaluated as a body of evidence.</p>\n</blockquote>\n<p>随后科学家和教育倡导者反驳，Their criticism明确批评科研证据被降成错误意见，完成争议两方的展开。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>The demand for stronger climate teaching reaches beyond this single meeting.</p>\n</blockquote>\n<p>beyond this single meeting将地方冲突扩展到更广范围，下一段才进入全国教育表现。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用天气与会议的对照引出教学争论 → 区分反对者立场与科研界批评 → 从地方冲突扩展到全国不足及教材影响</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Actual coverage also differs by age and subject.</p>\n</blockquote>\n<p>年龄与学科覆盖差异在后面实际教学讨论中才展开，这里仍需交代争议内容，否则single meeting所概括的冲突欠缺双方具体立场。</p>\n<p><strong>41题选B。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为B → C → E。\n\n先看前段B的结尾：\n\n> Their criticism is that established scientific work is being dismissed as merely another misguided opinion, rather than evaluated as a body of evidence.\n\n再看C段开头：\n\n> The demand for stronger climate teaching reaches beyond this single meeting.\n\n前段科研界批评构成更强教学要求，reaches beyond this single meeting承接并扩展讨论范围。\n\n本段内部继续写道：\n\n> A national study found that many state school systems received modest or poor grades. Some poorly rated states also have an influence beyond their borders because textbooks produced for them are widely sold elsewhere.\n\n全国研究评分低体现不足，部分州教材跨境销售又说明这种不足可影响其他地区。\n\n后段E开头是：\n\n> Textbook influence and state standards nevertheless provide only part of the picture.\n\nTextbook influence and state standards复现当前教材影响及各州表现，nevertheless转入这些仍非课堂全貌。\n\n这三段的推进关系：\n\n> 区分反对者立场与科研界批评 → 从地方冲突扩展到全国不足及教材影响 → 指出制度标准不必然转化成课堂教学\n\n再检验候选F：\n\n> Actual coverage also differs by age and subject.\n\nActual coverage也涉及不足，但此处先交代国家范围评分和教材影响，后句才能用nevertheless对已有衡量作限制。\n\n**42题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>42题是全文第3段，局部关系为B → C → E。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Their criticism is that established scientific work is being dismissed as merely another misguided opinion, rather than evaluated as a body of evidence.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>The demand for stronger climate teaching reaches beyond this single meeting.</p>\n</blockquote>\n<p>前段科研界批评构成更强教学要求，reaches beyond this single meeting承接并扩展讨论范围。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A national study found that many state school systems received modest or poor grades. Some poorly rated states also have an influence beyond their borders because textbooks produced for them are widely sold elsewhere.</p>\n</blockquote>\n<p>全国研究评分低体现不足，部分州教材跨境销售又说明这种不足可影响其他地区。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Textbook influence and state standards nevertheless provide only part of the picture.</p>\n</blockquote>\n<p>Textbook influence and state standards复现当前教材影响及各州表现，nevertheless转入这些仍非课堂全貌。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>区分反对者立场与科研界批评 → 从地方冲突扩展到全国不足及教材影响 → 指出制度标准不必然转化成课堂教学</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Actual coverage also differs by age and subject.</p>\n</blockquote>\n<p>Actual coverage也涉及不足，但此处先交代国家范围评分和教材影响，后句才能用nevertheless对已有衡量作限制。</p>\n<p><strong>42题选C。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → F → D。\n\n先看前段E的结尾：\n\n> A state can perform well on written standards without ensuring that the corresponding material is actually taught in classrooms.\n\n再看F段开头：\n\n> Actual coverage also differs by age and subject.\n\n前段说高书面标准不能保证真正教学，Actual coverage接课堂实际情况，再按年龄与学科细分。\n\n本段内部继续写道：\n\n> Climate change may be well integrated into particular high-school science courses while receiving less attention in younger pupils’ lessons or in widely taught subjects. The distribution of content therefore matters as well as the formal quality of a standard.\n\nwhile对照某些高中科学课程融入良好与低龄、普遍科目不足，therefore总结分布与正式标准质量都重要。\n\n后段D开头是：\n\n> The sources of teaching material introduce another difference.\n\nanother difference承接当前年龄学科差异，后段将维度转向材料来源。\n\n这三段的推进关系：\n\n> 指出制度标准不必然转化成课堂教学 → 补充年龄学科之间的覆盖差异 → 引出官方与非官方材料差别\n\n再检验候选G：\n\n> Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations.\n\n带偏向的非官方资源是下一层材料来源差异的实例，不能提前替代课程分布，否则another difference缺少当前这一层比较。\n\n**43题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>43题是全文第5段，局部关系为E → F → D。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>A state can perform well on written standards without ensuring that the corresponding material is actually taught in classrooms.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Actual coverage also differs by age and subject.</p>\n</blockquote>\n<p>前段说高书面标准不能保证真正教学，Actual coverage接课堂实际情况，再按年龄与学科细分。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Climate change may be well integrated into particular high-school science courses while receiving less attention in younger pupils’ lessons or in widely taught subjects. The distribution of content therefore matters as well as the formal quality of a standard.</p>\n</blockquote>\n<p>while对照某些高中科学课程融入良好与低龄、普遍科目不足，therefore总结分布与正式标准质量都重要。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>The sources of teaching material introduce another difference.</p>\n</blockquote>\n<p>another difference承接当前年龄学科差异，后段将维度转向材料来源。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>指出制度标准不必然转化成课堂教学 → 补充年龄学科之间的覆盖差异 → 引出官方与非官方材料差别</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations.</p>\n</blockquote>\n<p>带偏向的非官方资源是下一层材料来源差异的实例，不能提前替代课程分布，否则another difference缺少当前这一层比较。</p>\n<p><strong>43题选F。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为F → D → G。\n\n先看前段F的结尾：\n\n> The distribution of content therefore matters as well as the formal quality of a standard.\n\n再看D段开头：\n\n> The sources of teaching material introduce another difference.\n\n前段已强调内容分布，The sources...another difference承接多层差异，转到教学材料从哪里来。\n\n本段内部继续写道：\n\n> Official guidance may reflect scientific consensus, but teachers can also receive unofficial resources. These additional materials do not necessarily present the same account of the evidence.\n\n官方共识与教师也会收到非官方资源由but对照，These additional materials回指后者并说明其证据叙述未必相同。\n\n后段G开头是：\n\n> Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations.\n\nSome unofficial resources复现非官方资源，下一段具体说明偏向观点及资助方。\n\n这三段的推进关系：\n\n> 补充年龄学科之间的覆盖差异 → 引出官方与非官方材料差别 → 明确偏向材料的外部资助和传递路径\n\n再检验候选B：\n\n> One participant in that conflict links her position to the energy sector and resists proposed changes.\n\n回到某位能源立场的争议参与者会中断这里的来源分类；该人物不等于这批材料，也无法为additional materials提供相应解释。\n\n**44题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>44题是全文第6段，局部关系为F → D → G。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>The distribution of content therefore matters as well as the formal quality of a standard.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>The sources of teaching material introduce another difference.</p>\n</blockquote>\n<p>前段已强调内容分布，The sources...another difference承接多层差异，转到教学材料从哪里来。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Official guidance may reflect scientific consensus, but teachers can also receive unofficial resources. These additional materials do not necessarily present the same account of the evidence.</p>\n</blockquote>\n<p>官方共识与教师也会收到非官方资源由but对照，These additional materials回指后者并说明其证据叙述未必相同。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations.</p>\n</blockquote>\n<p>Some unofficial resources复现非官方资源，下一段具体说明偏向观点及资助方。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>补充年龄学科之间的覆盖差异 → 引出官方与非官方材料差别 → 明确偏向材料的外部资助和传递路径</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>One participant in that conflict links her position to the energy sector and resists proposed changes.</p>\n</blockquote>\n<p>回到某位能源立场的争议参与者会中断这里的来源分类；该人物不等于这批材料，也无法为additional materials提供相应解释。</p>\n<p><strong>44题选D。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为D → G → H。\n\n先看前段D的结尾：\n\n> These additional materials do not necessarily present the same account of the evidence.\n\n再看G段开头：\n\n> Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations.\n\n前段已说额外材料可能提供不同叙述，Some unofficial resources承接并具体说明偏向和智库行业资助。\n\n本段内部继续写道：\n\n> The route of influence runs from outside sponsors through materials distributed to teachers. Receiving such a resource does not mean that the teacher originated its bias.\n\n外部资助者经材料向教师传递影响，Receiving...does not mean又区分接收材料与教师自身产生偏见。\n\n后段H开头是：\n\n> Understanding climate education thus requires attention to more than a written state rule.\n\nthus以这条外部渠道收束：理解气候教育不能仅看书面州规则，还要看材料如何进入课堂。\n\n这三段的推进关系：\n\n> 引出官方与非官方材料差别 → 明确偏向材料的外部资助和传递路径 → 总结标准实施课程和材料多层影响\n\n再检验候选B：\n\n> One participant in that conflict links her position to the energy sector and resists proposed changes.\n\n前文个人反对者的能源立场只能说明争论一方，不能替代资助—材料—教师这条具体路径，也不能接此处超越书面标准的总结。\n\n**45题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>45题是全文第7段，局部关系为D → G → H。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>These additional materials do not necessarily present the same account of the evidence.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations.</p>\n</blockquote>\n<p>前段已说额外材料可能提供不同叙述，Some unofficial resources承接并具体说明偏向和智库行业资助。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The route of influence runs from outside sponsors through materials distributed to teachers. Receiving such a resource does not mean that the teacher originated its bias.</p>\n</blockquote>\n<p>外部资助者经材料向教师传递影响，Receiving...does not mean又区分接收材料与教师自身产生偏见。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Understanding climate education thus requires attention to more than a written state rule.</p>\n</blockquote>\n<p>thus以这条外部渠道收束：理解气候教育不能仅看书面州规则，还要看材料如何进入课堂。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>引出官方与非官方材料差别 → 明确偏向材料的外部资助和传递路径 → 总结标准实施课程和材料多层影响</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>One participant in that conflict links her position to the energy sector and resists proposed changes.</p>\n</blockquote>\n<p>前文个人反对者的能源立场只能说明争论一方，不能替代资助—材料—教师这条具体路径，也不能接此处超越书面标准的总结。</p>\n<p><strong>45题选G。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **scientific literacy** | **科学素养** | **社会现象｜文化教育｜素质教育** | **个人主题** |\n| educational quality | 教育质量 | 社会现象｜文化教育 | 宏观主题 |\n| evidence-based learning | 基于证据的学习 | 人生哲理｜理性思维 | 个人主题 |\n| **critical evaluation** | **审慎评价** | **人生哲理｜批判性思维** | **个人主题** |\n| informed public discussion | 基于充分信息的公共讨论 | 社会现象｜社会生活 | 宏观主题 |\n| curriculum development | 课程发展 | 社会现象｜文化教育 | 宏观主题 |\n| reliable information | 可靠信息 | 社会现象｜科技经济｜甄别信息 | 宏观主题 |\n| independent judgment | 独立判断 | 人生哲理｜独立思考 | 个人主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>scientific literacy</strong></td>\n<td><strong>科学素养</strong></td>\n<td><strong>社会现象｜文化教育｜素质教育</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>educational quality</td>\n<td>教育质量</td>\n<td>社会现象｜文化教育</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>evidence-based learning</td>\n<td>基于证据的学习</td>\n<td>人生哲理｜理性思维</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td><strong>critical evaluation</strong></td>\n<td><strong>审慎评价</strong></td>\n<td><strong>人生哲理｜批判性思维</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>informed public discussion</td>\n<td>基于充分信息的公共讨论</td>\n<td>社会现象｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>curriculum development</td>\n<td>课程发展</td>\n<td>社会现象｜文化教育</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>reliable information</td>\n<td>可靠信息</td>\n<td>社会现象｜科技经济｜甄别信息</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>independent judgment</td>\n<td>独立判断</td>\n<td>人生哲理｜独立思考</td>\n<td>个人主题</td>\n</tr>\n</tbody></table></div>\n"},{"title":"2. 大作文第一段描述题目信息时可积累的表达","raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画** | **The participants are engaged in a heated debate over what should be taught.** | **参与者正就应该教授什么展开激烈辩论。** |\n| 图画 | The scene contrasts a formal rule with what actually happens in the classroom. | 场景对比正式规则与课堂实际情况。 |\n| 图画 | Different materials present the same subject from different perspectives. | 不同材料从不同角度呈现同一主题。 |\n| **图表** | **Barely half of the groups reached the higher performance level.** | **仅约一半群体达到较高表现水平。** |\n| 图表 | Coverage varies considerably across ages and subjects. | 覆盖程度在不同年龄和学科间存在显著差异。 |\n| 图表 | A strong score on one measure does not guarantee equally strong results elsewhere. | 某一指标得分高不保证其他方面同样出色。 |\n| 文本评论 | The statement warns against dismissing evidence as merely another opinion. | 这句话提醒人们不要把证据轻率当成另一种意见。 |\n| 文本评论 | The passage emphasises the need to examine where information comes from. | 这段文字强调考察信息来源的必要性。 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The participants are engaged in a heated debate over what should be taught.</strong></td>\n<td><strong>参与者正就应该教授什么展开激烈辩论。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene contrasts a formal rule with what actually happens in the classroom.</td>\n<td>场景对比正式规则与课堂实际情况。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>Different materials present the same subject from different perspectives.</td>\n<td>不同材料从不同角度呈现同一主题。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>Barely half of the groups reached the higher performance level.</strong></td>\n<td><strong>仅约一半群体达到较高表现水平。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>Coverage varies considerably across ages and subjects.</td>\n<td>覆盖程度在不同年龄和学科间存在显著差异。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>A strong score on one measure does not guarantee equally strong results elsewhere.</td>\n<td>某一指标得分高不保证其他方面同样出色。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement warns against dismissing evidence as merely another opinion.</td>\n<td>这句话提醒人们不要把证据轻率当成另一种意见。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage emphasises the need to examine where information comes from.</td>\n<td>这段文字强调考察信息来源的必要性。</td>\n</tr>\n</tbody></table></div>\n"}];
