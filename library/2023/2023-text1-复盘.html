const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. The uneven place of climate change across ages and subjects</strong></p><p><strong>B. Official agreement does not exclude outside influence</strong></p><p><strong>C. A heated local dispute over what schools should teach</strong></p><p><strong>D. Why good state standards may not reach the classroom</strong></p><p><strong>E. Broad demands alongside evidence of weak provision</strong></p><p><strong>F. A guarantee that every textbook is free of bias</strong></p><p><strong>G. A final decision to remove science from schools</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools. Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot; Most scientists and experts sharply dispute Hardy&#x27;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools. A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>Glenn Branch, the centre&#x27;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>Another issue is that while climate change is well integrated into some subjects and at some ages — such as earth and space sciences in high schools — it is not as well represented in curricula for younger children and in subjects that are more widely taught, such as biology and chemistry. It is also less prominent in many social studies courses.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>A dispute about climate education can become heated even when the weather has cooled. In Texas, officials debating science standards reveal a conflict over what pupils should be taught. The disagreement is about the place of scientific knowledge in school, not simply about the temperature outside.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>One participant in that conflict links her position to the energy sector and resists proposed changes. Scientists and education advocates dispute her approach. Their criticism is that established scientific work is being dismissed as merely another misguided opinion, rather than evaluated as a body of evidence.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>The demand for stronger climate teaching reaches beyond this single meeting. A national study found that many state school systems received modest or poor grades. Some poorly rated states also have an influence beyond their borders because textbooks produced for them are widely sold elsewhere.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>The sources of teaching material introduce another difference. Official guidance may reflect scientific consensus, but teachers can also receive unofficial resources. These additional materials do not necessarily present the same account of the evidence.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>Textbook influence and state standards nevertheless provide only part of the picture. Decisions are often decentralised to local school boards. A state can perform well on written standards without ensuring that the corresponding material is actually taught in classrooms.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>Actual coverage also differs by age and subject. Climate change may be well integrated into particular high-school science courses while receiving less attention in younger pupils’ lessons or in widely taught subjects. The distribution of content therefore matters as well as the formal quality of a standard.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations. The route of influence runs from outside sponsors through materials distributed to teachers. Receiving such a resource does not mean that the teacher originated its bias.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>Understanding climate education thus requires attention to more than a written state rule. Classroom decisions, curriculum coverage and the origins of teaching resources all affect what pupils encounter. Improvements on one measure should not be mistaken for a guarantee that these other problems have disappeared.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>extreme heat</td>\n<td>极端高温</td>\n<td>State Board of Education</td>\n<td>州教育委员会</td>\n<td>officials</td>\n<td>n.官员</td>\n</tr>\n<tr>\n<td>debate</td>\n<td>v.辩论</td>\n<td>climate change</td>\n<td>气候变化</td>\n<td>taught</td>\n<td>v.被教授</td>\n</tr>\n<tr>\n<td>cooled</td>\n<td>v.降温</td>\n<td>meeting</td>\n<td>n.会议</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>sympathized with</td>\n<td>认同</td>\n<td>energy sector</td>\n<td>能源行业</td>\n<td>resisting</td>\n<td>v.抵制</td>\n</tr>\n<tr>\n<td>proposed change</td>\n<td>拟议变化</td>\n<td>standards</td>\n<td>n.标准</td>\n<td>pre-teen</td>\n<td>adj.青春期前的</td>\n</tr>\n<tr>\n<td>panic</td>\n<td>n.恐慌</td>\n<td>recognise</td>\n<td>v.认识到</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</ </td>\n<td>v.被认为</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第7段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>integrated</td>\n<td>adj.融入的</td>\n<td>represented</td>\n<td>adj.体现的</td>\n<td>curricula</td>\n<td>n.课程</td>\n</tr>\n<tr>\n<td>biology</td>\n<td>n.生物学</td>\n<td>chemistry</td>\n<td>n.化学</td>\n<td>prominent</td>\n<td>adj.突出的</td>\n</tr>\n<tr>\n<td>social studies</td>\n<td>社会研究课程</td>\n<td>subjects</td>\n<td>n.学科</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第8段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>official guidelines</td>\n<td>官方指南</td>\n<td>consensus</td>\n<td>n.共识</td>\n<td>unofficial</td>\n<td>adj.非官方的</td>\n</tr>\n<tr>\n<td>convey</td>\n<td>v.传达</td>\n<td>slanted</td>\n<td>adj.有偏向的</td>\n<td>perspectives</td>\n<td>n.观点</td>\n</tr>\n<tr>\n<td>distributed</td>\n<td>v.分发</td>\n<td>think-tanks</td>\n<td>n.智库</td>\n<td>associations</td>\n<td>n.协会</td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n<h3>意群划分 · 第1段</h3>\n<p>The weather in Texas / may have cooled / since the recent extreme heat, / but the temperature will be high / at the State Board of Education meeting / in Austin this month / as officials debate / how climate change is taught / in Texas schools.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>德克萨斯州的天气 / 可能已经变凉 / 自最近的极端高温以来，/ 但温度将会很高 / 在州教育委员会会议上 / 在奥斯汀本月 / 当官员们辩论时 / 气候变化如何被教授 / 在德克萨斯州的学校。</p>\n<h3>标准译文 · 第1段</h3>\n<p>德克萨斯州的天气虽然在最近的极端高温后已经变凉，但本月在奥斯汀举行的州教育委员会会议上，当官员们辩论如何在德克萨斯州学校教授气候变化时，&quot;温度&quot;将会很高。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;</p>\n<h3>意群划分 · 第2段</h3>\n<p>Pat Hardy, / who sympathized with views / of the energy sector, / is resisting the proposed change / to science standards / for pre-teen pupils.</p>\n<p>&quot;There are as many scientists / working against all the panic / of global climate change / as there are those / who are pushing it,&quot; / she claims.</p>\n<p>&quot;Texas is an energy State / and we need to recognise that. / You need to remember / where your bread is buttered.&quot;</p>\n<h3>意群翻译 · 第2段</h3>\n<p>帕特·哈迪，/ 同情观点的人 / 能源部门的，/ 正在抵制提议的改变 / 对科学标准 / 针对青少年学生的。</p>\n<p>&quot;有同样多的科学家 / 反对所有的恐慌 / 关于全球气候变化的 / 就像有那些人 / 在推动它，&quot; / 她声称。</p>\n<p>&quot;德克萨斯是一个能源州 / 我们需要认识到这一点。/ 你需要记住 / 你的面包是从哪里涂黄油的。&quot;</p>\n<h3>标准译文 · 第2段</h3>\n<p>同情能源部门观点的帕特·哈迪正在抵制针对青少年学生科学标准的拟议改变。她声称：&quot;反对全球气候变化恐慌的科学家和推动它的科学家一样多。德克萨斯是一个能源州，我们需要认识到这一点。你需要记住你的饭碗在哪里。&quot;</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>Most scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n<h3>意群划分 · 第3段</h3>\n<p>Most scientists and experts / sharply dispute / Hardy&#39;s views.</p>\n<p>&quot;They casually dismiss / the career work / of scholars and scientists / as just another misguided opinion,&quot; / says Dan Quinn, / senior communications strategist / at the Texas Freedom Network, / a non-profit group / that monitors public education.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>大多数科学家和专家 / 强烈反驳 / 哈迪的观点。</p>\n<p>&quot;他们随意地驳回 / 职业工作 / 学者和科学家的 / 作为只是另一个被误导的观点，&quot; / 丹·奎因说，/ 高级传播策略师 / 在德克萨斯自由网络，/ 一个非营利组织 / 监督公共教育的。</p>\n<h3>标准译文 · 第3段</h3>\n<p>大多数科学家和专家强烈反驳哈迪的观点。德克萨斯自由网络（一个监督公共教育的非营利组织）的高级传播策略师丹·奎因说：&quot;他们随意地将学者和科学家的职业工作驳回为只是另一个被误导的观点。&quot;</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.</p>\n<h3>意群划分 · 第4段</h3>\n<p>Such debate reflects / fierce discussions / across the US / and around the world, / as researchers, policymakers, / teachers and students / step up demands / for a greater focus / on teaching about the facts / of climate change / in schools.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>这样的辩论反映了 / 激烈的讨论 / 遍及美国 / 和世界各地，/ 当研究人员、政策制定者、/ 教师和学生 / 加大要求 / 更大的关注 / 对教授关于事实 / 气候变化的 / 在学校。</p>\n<h3>标准译文 · 第4段</h3>\n<p>这样的辩论反映了遍及美国和世界各地的激烈讨论，研究人员、政策制定者、教师和学生都在加大要求，希望学校更加关注教授气候变化的事实。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n<h3>意群划分 · 第5段</h3>\n<p>A study last year / by the National Center for Science Education, / a non-profit group / of scientists and teachers, / looking at how state public schools / across the country / address climate change / in science classes, / gave barely half of US states / a grade B+ or higher.</p>\n<p>Among the 10 worst performers / were some of the most populous states, / including Texas, / which was given the lowest grade (F) / and has a disproportionate influence / because its textbooks / are widely sold elsewhere.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>一项研究去年 / 由国家科学教育中心进行，/ 一个非营利组织 / 由科学家和教师组成，/ 调查州立公立学校如何 / 在全国范围内 / 处理气候变化 / 在科学课堂上，/ 给予勉强一半的美国州 / B+或更高的成绩。</p>\n<p>在10个表现最差的州中 / 有一些人口最多的州，/ 包括德克萨斯州，/ 它被给予最低等级（F）/ 并且有不成比例的影响力 / 因为它的教科书 / 在其他地方广泛销售。</p>\n<h3>标准译文 · 第5段</h3>\n<p>去年，由科学家和教师组成的非营利组织国家科学教育中心进行的一项研究，调查了全国州立公立学校如何在科学课堂上处理气候变化问题，结果只有勉强一半的美国州获得B+或更高的成绩。在10个表现最差的州中，有一些人口最多的州，包括德克萨斯州，它获得了最低等级（F），并且由于其教科书在其他地方广泛销售而具有不成比例的影响力。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n<h3>意群划分 · 第6段</h3>\n<p>Glenn Branch, / the centre&#39;s deputy director, / cautions that / setting state-level science standards / is only one limited benchmark / in a country / that decentralises decisions / to local school boards.</p>\n<p>Even if a state / is considered a high performer / in its science standards, / &quot;that does not mean / it will be taught&quot;, / he says.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>格伦·布兰奇，/ 该中心的副主任，/ 警告说 / 设定州级科学标准 / 只是一个有限的基准 / 在一个国家 / 将决策权下放 / 给地方学校董事会。</p>\n<p>即使一个州 / 被认为是表现优异者 / 在其科学标准方面，/ &quot;这并不意味着 / 它会被教授&quot;，/ 他说。</p>\n<h3>标准译文 · 第6段</h3>\n<p>该中心的副主任格伦·布兰奇警告说，在一个将决策权下放给地方学校董事会的国家，设定州级科学标准只是一个有限的基准。他说，即使一个州在科学标准方面被认为表现优异，&quot;这并不意味着它会被教授&quot;。</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>Another issue is that while climate change is well integrated into some subjects and at some ages — such as earth and space sciences in high schools — it is not as well represented in curricula for younger children and in subjects that are more widely taught, such as biology and chemistry. It is also less prominent in many social studies courses.</p>\n<h3>意群划分 · 第7段</h3>\n<p>Another issue is that / while climate change is well integrated / into some subjects and at some ages — / such as earth and space sciences / in high schools — / it is not as well represented / in curricula for younger children / and in subjects / that are more widely taught, / such as biology and chemistry.</p>\n<p>It is also less prominent / in many social studies courses.</p>\n<h3>意群翻译 · 第7段</h3>\n<p>另一个问题是 / 虽然气候变化被很好地整合 / 到一些学科和某些年龄段 — / 比如地球和空间科学 / 在高中 — / 它没有被很好地体现 / 在年幼儿童的课程中 / 以及在学科中 / 被更广泛教授的，/ 比如生物和化学。</p>\n<p>它也不太突出 / 在许多社会研究课程中。</p>\n<h3>标准译文 · 第7段</h3>\n<p>另一个问题是，虽然气候变化在某些学科和某些年龄段被很好地整合——比如高中的地球和空间科学——但在年幼儿童的课程中以及在被更广泛教授的学科（如生物和化学）中，它没有被很好地体现。它在许多社会研究课程中也不太突出。</p>\n<h2>第8段</h2>\n<h3>完整原文 · 第8段</h3>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n<h3>意群划分 · 第8段</h3>\n<p>Branch points out that, / even if a growing number / of official guidelines and textbooks / reflect scientific consensus / on climate change, / unofficial educational materials / that convey more slanted perspectives / are being distributed to teachers.</p>\n<p>They include materials / sponsored by libertarian think-tanks / and energy industry associations.</p>\n<h3>意群翻译 · 第8段</h3>\n<p>布兰奇指出，/ 即使越来越多的 / 官方指导方针和教科书 / 反映科学共识 / 关于气候变化，/ 非官方的教育材料 / 传达更偏颇观点的 / 正在被分发给教师。</p>\n<p>它们包括材料 / 由自由主义智库赞助的 / 和能源行业协会。</p>\n<h3>标准译文 · 第8段</h3>\n<p>布兰奇指出，即使越来越多的官方指导方针和教科书反映了关于气候变化的科学共识，传达更偏颇观点的非官方教育材料仍在被分发给教师。这些材料包括由自由主义智库和能源行业协会赞助的内容。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>The weather in Texas → may have cooled：(since the recent extreme heat) // but the temperature will be high：(at the State Board of Education meeting：(in Austin this month))：(as officials debate：(how climate change is taught：(in Texas schools))).</p>\n<p><strong>第2段</strong></p>\n<p>Pat Hardy：(who sympathized with views：(of the energy sector)) → is resisting the proposed change：(to science standards：(for pre-teen pupils)).</p>\n<p>&quot;There are as many scientists：(working against all the panic：(of global climate change)) → as there are those：(who are pushing it),&quot; → she claims.</p>\n<p>&quot;Texas is an energy State + we need to recognise that. → You need to remember：(where your bread is buttered).&quot;</p>\n<p><strong>第3段</strong></p>\n<p>Most scientists and experts → sharply dispute → Hardy&#39;s views.</p>\n<p>&quot;They casually dismiss → the career work：(of scholars and scientists) → as just another misguided opinion,&quot; → says Dan Quinn：(senior communications strategist：(at the Texas Freedom Network))：(a non-profit group：(that monitors public education)).</p>\n<p><strong>第4段</strong></p>\n<p>Such debate reflects → fierce discussions：(across the US + around the world)：(as researchers, policymakers, teachers and students → step up demands：(for a greater focus：(on teaching about the facts：(of climate change)：(in schools)))).</p>\n<p><strong>第5段</strong></p>\n<p>A study last year：(by the National Center for Science Education)：(a non-profit group：(of scientists and teachers))：(looking at how state public schools：(across the country) → address climate change：(in science classes)) → gave barely half of US states → a grade B+ or higher.</p>\n<p>Among the 10 worst performers → were some of the most populous states：(including Texas)：(which was given the lowest grade (F) + has a disproportionate influence：(because its textbooks → are widely sold elsewhere)).</p>\n<p><strong>第6段</strong></p>\n<p>Glenn Branch：(the centre&#39;s deputy director) → cautions：(that setting state-level science standards → is only one limited benchmark：(in a country：(that decentralises decisions：(to local school boards)))).</p>\n<p>Even if a state → is considered a high performer：(in its science standards) → &quot;that does not mean：(it will be taught)&quot; → he says.</p>\n<p><strong>第7段</strong></p>\n<p>Another issue is：(that while climate change is well integrated：(into some subjects and at some ages)：(such as earth and space sciences：(in high schools)) // it is not as well represented：(in curricula for younger children + in subjects：(that are more widely taught)：(such as biology and chemistry))).</p>\n<p>It is also less prominent：(in many social studies courses).</p>\n<p><strong>第8段</strong></p>\n<p>Branch points out：(that even if a growing number：(of official guidelines and textbooks) → reflect scientific consensus：(on climate change) // unofficial educational materials：(that convey more slanted perspectives) → are being distributed to teachers).</p>\n<p>They include materials：(sponsored by libertarian think-tanks + energy industry associations).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>德克萨斯州的天气 → 可能已经变凉：(自最近的极端高温以来) // 但温度将会很高：(在州教育委员会会议上：(在奥斯汀本月))：(当官员们辩论时：(气候变化如何被教授：(在德克萨斯州的学校)))。</p>\n<p><strong>第2段</strong></p>\n<p>帕特·哈迪：(同情观点的人：(能源部门的)) → 正在抵制提议的改变：(对科学标准：(针对青少年学生的))。</p>\n<p>&quot;有同样多的科学家：(反对所有的恐慌：(关于全球气候变化的)) → 就像有那些人：(在推动它)，&quot; → 她声称。</p>\n<p>&quot;德克萨斯是一个能源州 + 我们需要认识到这一点。→ 你需要记住：(你的面包是从哪里涂黄油的)。&quot;</p>\n<p><strong>第3段</strong></p>\n<p>大多数科学家和专家 → 强烈反驳 → 哈迪的观点。</p>\n<p>&quot;他们随意地驳回 → 职业工作：(学者和科学家的) → 作为只是另一个被误导的观点，&quot; → 丹·奎因说：(高级传播策略师：(在德克萨斯自由网络))：(一个非营利组织：(监督公共教育的))。</p>\n<p><strong>第4段</strong></p>\n<p>这样的辩论反映了 → 激烈的讨论：(遍及美国 + 世界各地)：(当研究人员、政策制定者、教师和学生 → 加大要求：(更大的关注：(对教授关于事实：(气候变化的)：(在学校))))。</p>\n<p><strong>第5段</strong></p>\n<p>一项研究去年：(由国家科学教育中心进行)：(一个非营利组织：(由科学家和教师组成))：(调查州立公立学校如何：(在全国范围内) → 处理气候变化：(在科学课堂上)) → 给予勉强一半的美国州 → B+或更高的成绩。</p>\n<p>在10个表现最差的州中 → 有一些人口最多的州：(包括德克萨斯州)：(它被给予最低等级（F）+ 有不成比例的影响力：(因为它的教科书 → 在其他地方广泛销售))。</p>\n<p><strong>第6段</strong></p>\n<p>格伦·布兰奇：(该中心的副主任) → 警告说：(设定州级科学标准 → 只是一个有限的基准：(在一个国家：(将决策权下放：(给地方学校董事会))))。</p>\n<p>即使一个州 → 被认为是表现优异者：(在其科学标准方面) → &quot;这并不意味着：(它会被教授)&quot; → 他说。</p>\n<p><strong>第7段</strong></p>\n<p>另一个问题是：(虽然气候变化被很好地整合：(到一些学科和某些年龄段)：(比如地球和空间科学：(在高中)) // 它没有被很好地体现：(在年幼儿童的课程中 + 在学科中：(被更广泛教授的)：(比如生物和化学)))。</p>\n<p>它也不太突出：(在许多社会研究课程中)。</p>\n<p><strong>第8段</strong></p>\n<p>布兰奇指出：(即使越来越多的：(官方指导方针和教科书) → 反映科学共识：(关于气候变化) // 非官方的教育材料：(传达更偏颇观点的) → 正在被分发给教师)。</p>\n<p>它们包括材料：(由自由主义智库赞助的 + 能源行业协会)。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>The weather in Texas / may have cooled / since the recent extreme heat, / but the temperature will be high / at the State Board of Education meeting / in Austin this month / as officials debate / how climate change is taught / in Texas schools.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>德克萨斯州的天气 / 可能已经变凉 / 自最近的极端高温以来，/ 但温度将会很高 / 在州教育委员会会议上 / 在奥斯汀本月 / 当官员们辩论时 / 气候变化如何被教授 / 在德克萨斯州的学校。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把but前后两个temperature所在场景分开，as说明会议为什么紧张。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>德克萨斯州的天气  可能已经变凉  自最近的极端高温以来， 但温度将会很高  在州教育委员会会议上  在奥斯汀本月  当官员们辩论时  气候变化如何被教授  在德克萨斯州的学校。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>天气降温，但教育委员会会议的气氛将升温。</p>\n</blockquote>\n<p>先说真实天气，再转为会议气氛的比喻，最后指出争论教学内容。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>德克萨斯州的天气虽然在最近的极端高温后已经变凉，但本月在奥斯汀举行的州教育委员会会议上，当官员们辩论如何在德克萨斯州学校教授气候变化时，&quot;温度&quot;将会很高。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>不能把第二个高温读成新的气象预报或已决定的政策转向。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>德克萨斯州的天气虽然在最近的极端高温后已经变凉，但本月在奥斯汀举行的州教育委员会会议上，当官员们辩论如何在德克萨斯州学校教授气候变化时，&quot;温度&quot;将会很高。</p>\n</blockquote>\n<h2>2. 第5段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Among the 10 worst performers / were some of the most populous states, / including Texas, / which was given the lowest grade (F) / and has a disproportionate influence / because its textbooks / are widely sold elsewhere.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>在10个表现最差的州中 / 有一些人口最多的州，/ 包括德克萨斯州，/ 它被给予最低等级（F）/ 并且有不成比例的影响力 / 因为它的教科书 / 在其他地方广泛销售。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>including引出得州，which补充最低分及because解释影响力来源。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>在10个表现最差的州中  有一些人口最多的州， 包括德克萨斯州， 它被给予最低等级（F） 并且有不成比例的影响力  因为它的教科书  在其他地方广泛销售。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>低分州中有得州，其教材外销使影响超出本州。</p>\n</blockquote>\n<p>先说低分州的范围，再用得州说明评分与教材传播。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>在10个表现最差的州中，有一些人口最多的州，包括德克萨斯州，它获得了最低等级（F），并且由于其教科书在其他地方广泛销售而具有不成比例的影响力。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>because连接教材销量与影响力，不涉及是否愿意改写教材。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>在10个表现最差的州中，有一些人口最多的州，包括德克萨斯州，它获得了最低等级（F），并且由于其教科书在其他地方广泛销售而具有不成比例的影响力。</p>\n</blockquote>\n<h2>3. 第8段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Branch points out that, / even if a growing number / of official guidelines and textbooks / reflect scientific consensus / on climate change, / unofficial educational materials / that convey more slanted perspectives / are being distributed to teachers.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>布兰奇指出，/ 即使越来越多的 / 官方指导方针和教科书 / 反映科学共识 / 关于气候变化，/ 非官方的教育材料 / 传达更偏颇观点的 / 正在被分发给教师。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>even if让步说明官方进步不能排除另一条材料渠道，that修饰非官方材料传达的观点。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>布兰奇指出， 即使越来越多的  官方指导方针和教科书  反映科学共识  关于气候变化， 非官方的教育材料  传达更偏颇观点的  正在被分发给教师。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>官方材料趋于科学共识，但带偏向的非官方材料仍在传播。</p>\n</blockquote>\n<p>先承认官方指南与教材的变化，再落到仍被发给教师的非官方材料。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>布兰奇指出，即使越来越多的官方指导方针和教科书反映了关于气候变化的科学共识，传达更偏颇观点的非官方教育材料仍在被分发给教师。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>teachers是接收者而非偏见源头，不能改写为教师个人偏见。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>布兰奇指出，即使越来越多的官方指导方针和教科书反映了关于气候变化的科学共识，传达更偏颇观点的非官方教育材料仍在被分发给教师。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>21题</h2>\n<blockquote>\n<p>In Paragraph 1, the weather in Texas is mentioned to ______.</p>\n<p>第一段提到得克萨斯州的天气，是为了______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干直接给出Paragraph 1和the weather in Texas，回到第1段，从天气转凉读到教育委员会讨论学校里的气候变化教学。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n<p>The weather in Texas may have cooled since the recent extreme heat,</p>\n<p>but the temperature will be high at the State Board of Education meeting in Austin this month</p>\n</blockquote>\n<h3>A. forecast a policy shift in Texas schools</h3>\n<blockquote>\n<p>作者提及得州天气是为了预告得州学校政策转变。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>官员会激烈争论如何教授气候变化，不等于政策一定转向。A把预期争论气氛改成政策改变的预告。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提及得州天气是为了预告得州学校政策转变。</p>\n</blockquote>\n<p><code>forecast a policy shift</code>要找政策变化的预告；第1段的<code>officials debate</code>说明官员们将争论如何教学，因此回看<code>but</code>以后对会议的介绍。</p>\n<p>原文把天气转凉与会议上的高温相对，接着用<code>officials debate</code>说明会议将围绕气候变化教学发生争论。<code>A</code>的<code>forecast a policy shift</code>则把这次争论写成政策转变的预告。会议将讨论怎样教，不等于会议已经指向哪一种政策变化；原句预示的是争论的热度，没有确定争论会怎样改变学校政策。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n<p>近期极端酷热之后，得州天气也许已经转凉，但本月奥斯汀州教育委员会会议的温度会很高，因为官员将辩论得州学校怎样教授气候变化。</p>\n</blockquote>\n<p>天气转凉后以but转到会议仍会高温，as officials debate解释这里高温指什么。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The weather is mentioned to forecast a policy shift in Texas schools.</p>\n<p>作者提及得州天气是为了预告得州学校政策转变。</p>\n</blockquote>\n<p>A需要会议将作出某种政策调整的方向或结果。现有句子只确定讨论议题和热度，尚未给出争论会由哪一方取胜。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. stress the consequences of climate change</h3>\n<blockquote>\n<p>作者提及得州天气是为了强调气候变化后果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>酷热被用作会议高温的引子，作者没有在此证明气候变化导致这次天气，B改成了强调气候后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提及得州天气是为了强调气候变化后果。</p>\n</blockquote>\n<p><code>consequences of climate change</code>要把天气当作气候变化造成的结果；第1段出现<code>recent extreme heat</code>，但紧接着转向<code>at the State Board of Education meeting</code>，因此要看这段如何把天气接到会议。</p>\n<p>原文先提<code>recent extreme heat</code>之后天气可能转凉，再把高温放到<code>at the State Board of Education meeting</code>，写的是会议气氛的热度。<code>B</code>的<code>consequences of climate change</code>把这段当成气候变化造成天气后果的说明。可是原句从天气转入教育会议，并没有建立气候变化导致此次酷热的因果关系；它也没有沿着酷热继续解释气候后果。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n<p>近期极端酷热之后，得州天气也许已经转凉，但本月奥斯汀州教育委员会会议的温度会很高，因为官员将辩论得州学校怎样教授气候变化。</p>\n</blockquote>\n<p>首句从实际天气转入教育委员会气氛，结尾落在学校怎样教气候变化。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The weather is mentioned to stress the consequences of climate change.</p>\n<p>作者提及得州天气是为了强调气候变化后果。</p>\n</blockquote>\n<p>B需要天气作为气候变化影响的因果证据。文章这里转向教育争论，既未展开极端天气后果，也未建立此次酷热的成因。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. indicate the atmosphere at the board meeting</h3>\n<blockquote>\n<p>作者提及得州天气是为了表明委员会会议气氛。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>天气可转凉，会议却会高温；高温接着官员争论，是对紧张热烈气氛的比喻，C准确还原其作用。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提及得州天气是为了表明委员会会议气氛。</p>\n</blockquote>\n<p><code>atmosphere at the board meeting</code>对应原文<code>the temperature will be high</code>；高温被放在教育委员会的会议中，因此回看这个比喻以及其后官员将讨论的事项。</p>\n<p>原文说天气虽然可能转凉，会议上却会<code>the temperature will be high</code>，并马上说明官员们要争论怎样教授气候变化。这里的高温落在争论现场，表现预期紧张热烈的气氛。<code>C</code>所说的<code>atmosphere at the board meeting</code>正是把这个天气比喻还原成会议气氛，没有增加争论的结果。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n<p>近期极端酷热之后，得州天气也许已经转凉，但本月奥斯汀州教育委员会会议的温度会很高，因为官员将辩论得州学校怎样教授气候变化。</p>\n</blockquote>\n<p>but把两种温度相对，后半句点出会议讨论内容，说明天气只是引出争论的表达方式。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The weather is mentioned to indicate the atmosphere at the board meeting.</p>\n<p>作者提及得州天气是为了表明委员会会议气氛。</p>\n</blockquote>\n<p>C不增加政策会改变或能源将短缺等结果，只概括原句通过冷热反差传达的会议氛围。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. draw the public’s attention to energy shortages</h3>\n<blockquote>\n<p>作者提及得州天气是为了让公众关注能源短缺。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>会议讨论气候变化如何教学，未讨论能源供应不足。D把教育议题换成能源短缺警示。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提及得州天气是为了让公众关注能源短缺。</p>\n</blockquote>\n<p><code>energy shortages</code>要求找到能源供应不足的问题；第1段却把会议议题明确写成<code>how climate change is taught</code>，因此回看这一段末尾对争论内容的限定。</p>\n<p>原文说明官员们争论<code>how climate change is taught</code>，也就是得州学校如何教授气候变化。<code>D</code>的<code>energy shortages</code>把注意对象换成能源供应不足。天气描写通过会议高温接到教学争论，没有把高温接到能源不足，更没有描写向公众发出能源警示的行动。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n<p>近期极端酷热之后，得州天气也许已经转凉，但本月奥斯汀州教育委员会会议的温度会很高，因为官员将辩论得州学校怎样教授气候变化。</p>\n</blockquote>\n<p>天气引入教育委员会，how climate change is taught明确限定即将争论的事项。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The weather is mentioned to draw the public’s attention to energy shortages.</p>\n<p>作者提及得州天气是为了让公众关注能源短缺。</p>\n</blockquote>\n<p>D需要能源不足及向公众提醒的内容。后文能源行业利益也不等于能源供应短缺，不能把出现行业一词倒填为开头目的。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>21题结论</h3>\n<blockquote>\n<p><strong>21. C</strong></p>\n</blockquote>\n<ul>\n<li>A：官员会激烈争论如何教授气候变化，不等于政策一定转向。A把预期争论气氛改成政策改变的预告。</li>\n<li>B：酷热被用作会议高温的引子，作者没有在此证明气候变化导致这次天气，B改成了强调气候后果。</li>\n<li>C：天气可转凉，会议却会高温；高温接着官员争论，是对紧张热烈气氛的比喻，C准确还原其作用。</li>\n<li>D：会议讨论气候变化如何教学，未讨论能源供应不足。D把教育议题换成能源短缺警示。</li>\n</ul>\n<h2>22题</h2>\n<blockquote>\n<p>What does Quinn think of Hardy?</p>\n<p>奎因如何看待哈迪？</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物评价题：按Quinn引语确定批评对象，并与Hardy本人的说法分开。</p>\n<p>题干给出Quinn和Hardy。第3段直接引用Dan Quinn对像哈迪这样的委员会成员的评价，从该段开头读到末尾。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Most scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n</blockquote>\n<h3>A. She exaggerates the existing panic.</h3>\n<blockquote>\n<p>Quinn认为Hardy夸大既有恐慌。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>panic出自Hardy自己的说法，Quinn批评她轻率否定科研工作，未说她夸大既有恐慌。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;\nMost scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Quinn认为Hardy夸大既有恐慌。</p>\n</blockquote>\n<p>panic出自Hardy自己的说法，Quinn批评她轻率否定科研工作，未说她夸大既有恐慌。</p>\n<p>Hardy先将科学界描成两派数量相等，Quinn随后指出这种看法把科学家长期工作当成又一种错误意见。</p>\n<p>A需要Quinn对她描述恐慌程度的批评。原引语的宾语是career work，不能把另一位说话人的panic挪成这句批评的核心。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;\nMost scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n<p>赞同能源行业观点的Pat Hardy正抵制面向未满十三岁学生的科学标准修改。她声称，反对全球气候变化恐慌的科学家与推动这种恐慌者一样多。她说得州是能源州，必须承认这一点，要记得自己的利益来源。</p>\n<p>大多数科学家和专家强烈反驳Hardy的看法。监测公立教育的非营利组织Texas Freedom Network高级传播策略师Dan Quinn说，这些人随意把学者和科学家整个职业生涯的工作斥为又一种错误意见。</p>\n</blockquote>\n<p>Hardy先将科学界描成两派数量相等，Quinn随后指出这种看法把科学家长期工作当成又一种错误意见。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Quinn thinks that she exaggerates the existing panic.</p>\n<p>Quinn认为Hardy夸大既有恐慌。</p>\n</blockquote>\n<p>A需要Quinn对她描述恐慌程度的批评。原引语的宾语是career work，不能把另一位说话人的panic挪成这句批评的核心。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. She denies the value of scientific work.</h3>\n<blockquote>\n<p>Quinn认为Hardy否定科研工作价值。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>dismiss...as just another misguided opinion把学者科研积累轻率当作错误意见，B概括Quinn认为她否定科研价值。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;\nMost scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Quinn认为Hardy否定科研工作价值。</p>\n</blockquote>\n<p>dismiss...as just another misguided opinion把学者科研积累轻率当作错误意见，B概括Quinn认为她否定科研价值。</p>\n<p>多数科学家反驳Hardy后，Quinn具体说明她怎样对待学者和科学家的职业工作。</p>\n<p>misguided是错误的、误入歧途的，just another进一步削弱科研分量。B保留对科研价值的贬低，并未改成单纯意见不同。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;\nMost scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n<p>赞同能源行业观点的Pat Hardy正抵制面向未满十三岁学生的科学标准修改。她声称，反对全球气候变化恐慌的科学家与推动这种恐慌者一样多。她说得州是能源州，必须承认这一点，要记得自己的利益来源。</p>\n<p>大多数科学家和专家强烈反驳Hardy的看法。监测公立教育的非营利组织Texas Freedom Network高级传播策略师Dan Quinn说，这些人随意把学者和科学家整个职业生涯的工作斥为又一种错误意见。</p>\n</blockquote>\n<p>多数科学家反驳Hardy后，Quinn具体说明她怎样对待学者和科学家的职业工作。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Quinn thinks that she denies the value of scientific work.</p>\n<p>Quinn认为Hardy否定科研工作价值。</p>\n</blockquote>\n<p>misguided是错误的、误入歧途的，just another进一步削弱科研分量。B保留对科研价值的贬低，并未改成单纯意见不同。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. She shows no concern for pre-teens.</h3>\n<blockquote>\n<p>Quinn认为Hardy毫不关心未满十三岁的学生。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>抵制儿童科学标准修改说明政策立场，不等于她完全不关心孩子。Quinn的引语也只批评她轻视科研。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;\nMost scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Quinn认为Hardy毫不关心未满十三岁的学生。</p>\n</blockquote>\n<p><code>no concern for pre-teens</code>中的年龄对象接到第2段<code>science standards for pre-teen pupils</code>；再回看第3段奎因的引语，核对他是否因此评价她不关心孩子。</p>\n<p>第2段说哈迪抵制面向<code>pre-teen pupils</code>的科学标准变动，年龄说明标准针对哪些学生。第3段奎因批评的则是她否定学者和科学家的工作。</p>\n<p><code>C</code>把<code>science standards for pre-teen pupils</code>中的学生对象接成<code>no concern for pre-teens</code>，即她对这些孩子完全不关心。</p>\n<p>抵制某项标准变动与是否关心学生不是同一个关系，奎因的引语也没有把对科研工作的态度扩展成对孩子的全部态度。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;\nMost scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n<p>赞同能源行业观点的Pat Hardy正抵制面向未满十三岁学生的科学标准修改。她声称，反对全球气候变化恐慌的科学家与推动这种恐慌者一样多。她说得州是能源州，必须承认这一点，要记得自己的利益来源。</p>\n<p>大多数科学家和专家强烈反驳Hardy的看法。监测公立教育的非营利组织Texas Freedom Network高级传播策略师Dan Quinn说，这些人随意把学者和科学家整个职业生涯的工作斥为又一种错误意见。</p>\n</blockquote>\n<p>pre-teen pupils限定拟改标准针对的学生群体，第三段的科研评价则是Quinn实际指出的问题。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Quinn thinks that she shows no concern for pre-teens.</p>\n<p>Quinn认为Hardy毫不关心未满十三岁的学生。</p>\n</blockquote>\n<p>C需要对儿童关怀的全面否定，no concern的程度尤其强。反对一种教育内容不能直接证明对所有儿童需求都不关心。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. She expresses self-contradictory views.</h3>\n<blockquote>\n<p>Quinn认为Hardy表达自相矛盾的观点。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>科学家与Hardy意见相左是不同主体之间的冲突，self-contradictory要求她自身两个判断矛盾，原文未列出。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;\nMost scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Quinn认为Hardy表达自相矛盾的观点。</p>\n</blockquote>\n<p><code>self-contradictory views</code>需要哈迪自己的两个判断相互冲突；第3段先说科学家<code>sharply dispute Hardy’s views</code>，随后引出奎因，所以回看争议发生在谁与谁之间，以及奎因具体批评什么。</p>\n<p>原文的<code>sharply dispute Hardy’s views</code>写的是大多数科学家、专家与哈迪意见相左；奎因接着批评她否定科研工作。<code>D</code>的<code>self-contradictory views</code>则说冲突发生在哈迪自己的观点内部。外部科学家的反驳并不构成哈迪自我否定，奎因那句话也没有列出她前后相冲突的两个判断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;\nMost scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n<p>赞同能源行业观点的Pat Hardy正抵制面向未满十三岁学生的科学标准修改。她声称，反对全球气候变化恐慌的科学家与推动这种恐慌者一样多。她说得州是能源州，必须承认这一点，要记得自己的利益来源。</p>\n<p>大多数科学家和专家强烈反驳Hardy的看法。监测公立教育的非营利组织Texas Freedom Network高级传播策略师Dan Quinn说，这些人随意把学者和科学家整个职业生涯的工作斥为又一种错误意见。</p>\n</blockquote>\n<p>第三段先说专家sharp dispute，再用Quinn的话说明反驳理由在她轻率否定科研。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Quinn thinks that she expresses self-contradictory views.</p>\n<p>Quinn认为Hardy表达自相矛盾的观点。</p>\n</blockquote>\n<p>D需要她自己前后互相否定的观点。受到别人质疑不等于自相矛盾，不能把反驳关系改成内部矛盾。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>22题结论</h3>\n<blockquote>\n<p><strong>22. B</strong></p>\n</blockquote>\n<ul>\n<li>A：panic出自Hardy自己的说法，Quinn批评她轻率否定科研工作，未说她夸大既有恐慌。</li>\n<li>B：dismiss...as just another misguided opinion把学者科研积累轻率当作错误意见，B概括Quinn认为她否定科研价值。</li>\n<li>C：抵制儿童科学标准修改说明政策立场，不等于她完全不关心孩子。Quinn的引语也只批评她轻视科研。</li>\n<li>D：科学家与Hardy意见相左是不同主体之间的冲突，self-contradictory要求她自身两个判断矛盾，原文未列出。</li>\n</ul>\n<h2>23题</h2>\n<blockquote>\n<p>The study mentioned in Paragraph 5 shows that ______.</p>\n<p>第5段提到的研究表明______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干明确指向Paragraph 5中的研究，完整阅读第5段，从研究考察什么读到各州得分以及得州教科书的影响。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>looking at how state public schools across the country address climate change in science classes</p>\n<p>gave barely half of US states a grade B+ or higher.</p>\n<p>including Texas, which was given the lowest grade (F)</p>\n</blockquote>\n<h3>A. climate education is insufficient at state public schools</h3>\n<blockquote>\n<p>研究表明，州公立学校气候教育不够充分。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>勉强半数州达到B+以上，人口大州中仍有最低分者，说明公立学校气候教育存在明显不足，A作总体归纳。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究表明，州公立学校气候教育不够充分。</p>\n</blockquote>\n<p>勉强半数州达到B+以上，人口大州中仍有最低分者，说明公立学校气候教育存在明显不足，A作总体归纳。</p>\n<p>研究对象是各州科学课堂怎样处理气候变化，等级分布再展示质量不均且不少未达较高水平。</p>\n<p>A不表示每个州或每所学校都不充分；它概括整体不足，与存在部分高分州并不冲突。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n<p>由科学家和教师组成的非营利全国科学教育中心，去年研究各州公立学校科学课如何处理气候变化，勉强给半数州B+及以上。表现最差的十州包括一些人口最多的州，得州获最低F；由于教材广销其他地区，其影响不成比例地大。</p>\n</blockquote>\n<p>研究对象是各州科学课堂怎样处理气候变化，等级分布再展示质量不均且不少未达较高水平。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study shows that climate education is insufficient at state public schools.</p>\n<p>研究表明，州公立学校气候教育不够充分。</p>\n</blockquote>\n<p>A不表示每个州或每所学校都不充分；它概括整体不足，与存在部分高分州并不冲突。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. policymakers have little drive for science education</h3>\n<blockquote>\n<p>研究表明，政策制定者缺少推动科学教育的动力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>研究评分针对教育表现，不是政策制定者的动力调查；前段还把政策制定者列为加强气候教学呼吁的群体。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\nA study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究表明，政策制定者缺少推动科学教育的动力。</p>\n</blockquote>\n<p><code>little drive for science education</code>是在判断人的意愿，而第5段的<code>gave barely half of US states a grade B</code>+ <code>or higher</code>是在评价各州课堂教育。<code>policymakers</code>还出现在第4段，那里与<code>step up demands</code>相连，读完第4段再把这两处对照。</p>\n<p>研究的<code>gave barely half of US states a grade B</code>+ <code>or higher</code>说的是各州教育获评如何，不是对政策制定者心理意愿的测量。第4段还把政策制定者列入加大呼吁力度、要求重视学校气候教学的人群。</p>\n<p><code>B</code>的<code>little drive for science education</code>把教育评分不够高解释为政策制定者缺乏动力，并把气候教学扩大到科学教育整体。</p>\n<p>学校得到什么等级，不能直接确定政策制定者为何行动；文中对他们实际行动的描述也指向正在加大要求。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\nA study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n<p>这类争论反映美国各地及全球激烈讨论，研究者、政策制定者、教师和学生都在加强要求，希望学校更加重视气候变化事实的教学。</p>\n<p>由科学家和教师组成的非营利全国科学教育中心，去年研究各州公立学校科学课如何处理气候变化，勉强给半数州B+及以上。表现最差的十州包括一些人口最多的州，得州获最低F；由于教材广销其他地区，其影响不成比例地大。</p>\n</blockquote>\n<p>第四段先写更强需求，第五段再列实际教育评分，建立需求与表现之间的落差。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study shows that policymakers have little drive for science education.</p>\n<p>研究表明，政策制定者缺少推动科学教育的动力。</p>\n</blockquote>\n<p>B需要由意愿不足造成低分的证据。结果不佳可以有不同原因，不能由等级直接推心理动机，更不能扩成全部科学教育。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Texas is reluctant to rewrite its science textbooks</h3>\n<blockquote>\n<p>研究表明，得州不愿重写科学教材。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>得州教材广销其他地区，解释其影响不成比例地大；低分和传播范围都没有说明它不愿重写教材。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究表明，得州不愿重写科学教材。</p>\n</blockquote>\n<p>得州教材广销其他地区，解释其影响不成比例地大；低分和传播范围都没有说明它不愿重写教材。</p>\n<p>研究先给得州F，再用because将教材外销与州外影响相接，说明低质量的影响可能扩散。</p>\n<p>C需要拒绝修改或不愿重写的态度。得到差评不等于拒改，广泛销售也不是对修改意愿的测量。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n<p>由科学家和教师组成的非营利全国科学教育中心，去年研究各州公立学校科学课如何处理气候变化，勉强给半数州B+及以上。表现最差的十州包括一些人口最多的州，得州获最低F；由于教材广销其他地区，其影响不成比例地大。</p>\n</blockquote>\n<p>研究先给得州F，再用because将教材外销与州外影响相接，说明低质量的影响可能扩散。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study shows that Texas is reluctant to rewrite its science textbooks.</p>\n<p>研究表明，得州不愿重写科学教材。</p>\n</blockquote>\n<p>C需要拒绝修改或不愿重写的态度。得到差评不等于拒改，广泛销售也不是对修改意愿的测量。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. environmental teaching in some states lacks supervision</h3>\n<blockquote>\n<p>研究表明，一些州环境教学缺少监督。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>worst performers是教育表现的排序，未说明监督机制缺失。D把结果直接解释成某个未被研究交代的原因。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>研究表明，一些州环境教学缺少监督。</p>\n</blockquote>\n<p>worst performers是教育表现的排序，未说明监督机制缺失。D把结果直接解释成某个未被研究交代的原因。</p>\n<p>研究评价气候变化进入科学课的情况，列最差州是强调不足及影响范围。</p>\n<p>D需要缺乏监督的事实及其与教学的关系，且environmental teaching比气候教学范围更广，不能以低分替代两项说明。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n<p>由科学家和教师组成的非营利全国科学教育中心，去年研究各州公立学校科学课如何处理气候变化，勉强给半数州B+及以上。表现最差的十州包括一些人口最多的州，得州获最低F；由于教材广销其他地区，其影响不成比例地大。</p>\n</blockquote>\n<p>研究评价气候变化进入科学课的情况，列最差州是强调不足及影响范围。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study shows that environmental teaching in some states lacks supervision.</p>\n<p>研究表明，一些州环境教学缺少监督。</p>\n</blockquote>\n<p>D需要缺乏监督的事实及其与教学的关系，且environmental teaching比气候教学范围更广，不能以低分替代两项说明。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>23题结论</h3>\n<blockquote>\n<p><strong>23. A</strong></p>\n</blockquote>\n<ul>\n<li>A：勉强半数州达到B+以上，人口大州中仍有最低分者，说明公立学校气候教育存在明显不足，A作总体归纳。</li>\n<li>B：研究评分针对教育表现，不是政策制定者的动力调查；前段还把政策制定者列为加强气候教学呼吁的群体。</li>\n<li>C：得州教材广销其他地区，解释其影响不成比例地大；低分和传播范围都没有说明它不愿重写教材。</li>\n<li>D：worst performers是教育表现的排序，未说明监督机制缺失。D把结果直接解释成某个未被研究交代的原因。</li>\n</ul>\n<h2>24题</h2>\n<blockquote>\n<p>According to Branch, state-level science standards in the US ______.</p>\n<p>据布兰奇说，美国州级科学标准______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点题：把地方分权与高标准未必落实连起来，区别影响限制与紧迫行动要求。</p>\n<p>题干点名Branch和state-level science standards，两者在第6段同时出现。完整阅读这一段，核对州级标准与地方决策、实际教学之间的关系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>in a country that decentralises decisions to local school boards.</p>\n<p>Even if a state is considered a high performer in its science standards, “that does not mean it will be taught” , he says.</p>\n<p>setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards</p>\n</blockquote>\n<h3>A. call for regular revision</h3>\n<blockquote>\n<p>Branch认为州级科学标准需要定期修订。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>标准是否定期更新与写好后是否真正进入课堂不同。Branch强调地方决策使高分标准也未必被教，未讨论修订周期。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Branch认为州级科学标准需要定期修订。</p>\n</blockquote>\n<p><code>regular revision</code>把问题放在标准多久更新一次；第6段却用<code>does not mean it will be taught</code>说明优秀标准与实际教学之间的距离，因此回看布兰奇解释这种距离的两句话。</p>\n<p>原文把问题放在决策下放给地方学校董事会，并明确说标准优秀<code>does not mean it will be taught</code>。它区分标准制定与课堂落实。</p>\n<p><code>A</code>的<code>regular revision</code>则把解决对象换成标准的更新周期，仿佛问题在于标准需要按时修订。</p>\n<p>即使标准已经获评优秀，原文所说的教学落差仍然可能存在；这不是一句关于标准新旧或修订频率的判断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n<p>中心副主任Glenn Branch提醒，在决策分散到地方学校董事会的国家，制定州级科学标准只是一个有限指标。即使某州科学标准被评为高水平，也不意味着这些内容真会被教。</p>\n</blockquote>\n<p>only one limited benchmark先限制州标准的指标意义，Even if再给高标准不保证教学的例子。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>State-level science standards call for regular revision.</p>\n<p>Branch认为州级科学标准需要定期修订。</p>\n</blockquote>\n<p>A需要标准过时或应按周期更新的依据。即使标准优秀而且最新，地方落实的限制仍可能存在。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. require urgent application</h3>\n<blockquote>\n<p>Branch认为州级科学标准需要紧急落实。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>does not mean it will be taught陈述落实不被保证，require urgent application则提出紧迫行动要求，增加了原文未给的语气和程度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Branch认为州级科学标准需要紧急落实。</p>\n</blockquote>\n<p>does not mean it will be taught陈述落实不被保证，require urgent application则提出紧迫行动要求，增加了原文未给的语气和程度。</p>\n<p>Branch先解释地方学校董事会掌握决策，再用高标准也未必教说明州级指标作用有限。</p>\n<p>B需要必须立即落实的主张。重要性或落实差距不自动等于urgent，C才概括他实际指出的影响限制。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n<p>中心副主任Glenn Branch提醒，在决策分散到地方学校董事会的国家，制定州级科学标准只是一个有限指标。即使某州科学标准被评为高水平，也不意味着这些内容真会被教。</p>\n</blockquote>\n<p>Branch先解释地方学校董事会掌握决策，再用高标准也未必教说明州级指标作用有限。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>State-level science standards require urgent application.</p>\n<p>Branch认为州级科学标准需要紧急落实。</p>\n</blockquote>\n<p>B需要必须立即落实的主张。重要性或落实差距不自动等于urgent，C才概括他实际指出的影响限制。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. have limited influence</h3>\n<blockquote>\n<p>Branch认为州级科学标准影响有限。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>limited benchmark是有限的衡量指标；决策权分散到地方，州标准再好也不能单独保证教学，C概括影响有限。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Branch认为州级科学标准影响有限。</p>\n</blockquote>\n<p>limited benchmark是有限的衡量指标；决策权分散到地方，州标准再好也不能单独保证教学，C概括影响有限。</p>\n<p>先以地方决策解释限制，再用Even if承认高标准也存在课堂落差，形成条件与结果的对照。</p>\n<p>C没有说州标准毫无影响，只说不能由其高分推得实际课堂同样落实，程度与only one limited相合。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n<p>中心副主任Glenn Branch提醒，在决策分散到地方学校董事会的国家，制定州级科学标准只是一个有限指标。即使某州科学标准被评为高水平，也不意味着这些内容真会被教。</p>\n</blockquote>\n<p>先以地方决策解释限制，再用Even if承认高标准也存在课堂落差，形成条件与结果的对照。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>State-level science standards have limited influence.</p>\n<p>Branch认为州级科学标准影响有限。</p>\n</blockquote>\n<p>C没有说州标准毫无影响，只说不能由其高分推得实际课堂同样落实，程度与only one limited相合。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. cater to local needs</h3>\n<blockquote>\n<p>Branch认为州级科学标准迎合地方需求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>地方学校董事会是决策主体，原文未说州级标准的内容已满足地方需求。D把权力所在地改成标准制定目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Branch认为州级科学标准迎合地方需求。</p>\n</blockquote>\n<p><code>cater to local needs</code>把标准的内容与地方需要相接；第6段的<code>local school boards</code>谈到地方层级，因此回看地方在句子中承担的是提出需求、获得满足，还是掌握决策权的角色。</p>\n<p>原文说决策权下放给<code>local school boards</code>，地方学校董事会是决策的主体；随后说明州级标准获评优秀也不一定会被教授。<code>D</code>的<code>cater to local needs</code>则说州级标准本身是为满足地方需求而设置的。地方能决定教学，并不能说明上级标准内容已照顾地方需要；原文恰是在区分州级标准和地方课堂之间的作用。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n<p>中心副主任Glenn Branch提醒，在决策分散到地方学校董事会的国家，制定州级科学标准只是一个有限指标。即使某州科学标准被评为高水平，也不意味着这些内容真会被教。</p>\n</blockquote>\n<p>Branch区分州级标准与地方课堂，借分权解释为什么标准优秀不能保证教学。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>State-level science standards cater to local needs.</p>\n<p>Branch认为州级科学标准迎合地方需求。</p>\n</blockquote>\n<p>D需要地方需求与标准内容适配的依据。地方可以决定怎么教，不等于州标准本身就是为迎合地方而定。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>24题结论</h3>\n<blockquote>\n<p><strong>24. C</strong></p>\n</blockquote>\n<ul>\n<li>A：标准是否定期更新与写好后是否真正进入课堂不同。Branch强调地方决策使高分标准也未必被教，未讨论修订周期。</li>\n<li>B：does not mean it will be taught陈述落实不被保证，require urgent application则提出紧迫行动要求，增加了原文未给的语气和程度。</li>\n<li>C：limited benchmark是有限的衡量指标；决策权分散到地方，州标准再好也不能单独保证教学，C概括影响有限。</li>\n<li>D：地方学校董事会是决策主体，原文未说州级标准的内容已满足地方需求。D把权力所在地改成标准制定目的。</li>\n</ul>\n<h2>25题</h2>\n<blockquote>\n<p>It is implied in the last paragraph that climate change teaching in some schools ______.</p>\n<p>末段暗示，一些学校的气候变化教学______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>隐含意义推断题：追踪外部资助、非官方材料、教师接收的路径，保留可能性的程度。</p>\n<p>题干明确给出the last paragraph，完整阅读第8段，先看官方指南和教科书，再读发给教师的非官方材料及其资助者。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n<h3>A. agrees to major public demands</h3>\n<blockquote>\n<p>一些学校气候变化教学符合公众主要诉求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>公众要求加强事实教学、官方材料反映科学共识，都不等于课堂已满足公众主要诉求；末段反而指出偏向材料仍在流入。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\nBranch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些学校气候变化教学符合公众主要诉求。</p>\n</blockquote>\n<p><code>agrees to major public demands</code>把课堂教学与公众要求相接；末段的<code>reflect scientific consensus</code>说官方材料反映科学共识。第4段虽然出现<code>step up demands</code>，也需要与末段对照，分清呼吁是否已经得到满足。</p>\n<
