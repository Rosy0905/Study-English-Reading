p>末段的<code>reflect scientific consensus</code>把官方指南和教科书与科学共识相连，却接着强调偏见更多的非官方材料仍被发给教师。第4段的公众行动是加大要求学校重视气候事实的呼吁。</p>\n<p><code>A</code>的<code>agrees to major public demands</code>把“有人在要求”与“官方材料反映科学共识”合成“课堂教学已经符合公众主要诉求”。</p>\n<p>呼吁的存在不等于诉求已实现，材料符合科学共识也不等于课堂整体符合公众要求，尤其末段还提出另一类材料的影响。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\nBranch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n<p>这类争论反映美国各地及全球激烈讨论，研究者、政策制定者、教师和学生都在加强要求，希望学校更加重视气候变化事实的教学。</p>\n<p>Branch指出，即使越来越多官方指南和教材反映气候变化的科学共识，向教师分发的非官方教育材料仍在传递更偏向的看法，其中包括自由意志主义智库和能源行业协会资助的材料。</p>\n</blockquote>\n<p>even if先让步承认官方材料改善，再把重点放到教师接收非官方材料这一限制。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Climate change teaching meets the public&#39;s main demands.</p>\n<p>一些学校气候变化教学符合公众主要诉求。</p>\n</blockquote>\n<p>A需要诉求已在实际教学中实现的证据。有人提出需求与正式文件有所改进，都不能替代课堂整体结果。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. reflects teachers’ personal biases</h3>\n<blockquote>\n<p>一些学校气候变化教学体现教师个人偏见。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>slanted perspectives是材料传达的偏向观点，教师是接收者，B却把偏向来源归成教师个人。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些学校气候变化教学体现教师个人偏见。</p>\n</blockquote>\n<p>slanted perspectives是材料传达的偏向观点，教师是接收者，B却把偏向来源归成教师个人。</p>\n<p>官方与非官方材料对照之后，作者列智库和行业协会资助者，说明观点如何从外部进入教学资源。</p>\n<p>B需要教师原有个人偏见被教学表达的证据。收到材料不等于创造其偏见，也不能直接证明教师已经采用它。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n<p>Branch指出，即使越来越多官方指南和教材反映气候变化的科学共识，向教师分发的非官方教育材料仍在传递更偏向的看法，其中包括自由意志主义智库和能源行业协会资助的材料。</p>\n</blockquote>\n<p>官方与非官方材料对照之后，作者列智库和行业协会资助者，说明观点如何从外部进入教学资源。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Climate teaching reflects teachers’ personal biases.</p>\n<p>一些学校气候变化教学体现教师个人偏见。</p>\n</blockquote>\n<p>B需要教师原有个人偏见被教学表达的证据。收到材料不等于创造其偏见，也不能直接证明教师已经采用它。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. may misrepresent the energy sector</h3>\n<blockquote>\n<p>一些学校气候变化教学可能歪曲能源行业。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>能源行业协会是材料资助者，教学材料传递的是对气候变化的偏向观点，C却把能源行业写成被歪曲的对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些学校气候变化教学可能歪曲能源行业。</p>\n</blockquote>\n<p><code>may misrepresent the energy sector</code>把能源行业当成被歪曲描写的对象；第8段的<code>sponsored by energy industry associations</code>则把行业协会放在材料资助者的位置，因此回看末句与前一句中的偏见材料怎样相接。</p>\n<p>原文说教师正在收到观点更有偏见的非官方材料，其中包括<code>sponsored by energy industry associations</code>的材料。能源行业协会在这里提供资助，偏见观点的主题则承接气候变化。</p>\n<p><code>C</code>的<code>may misrepresent the energy sector</code>把资助一方改成课堂被歪曲描写的对象。</p>\n<p>带偏见的材料来自某个资助者，不能说明材料会歪曲这个资助者所在的行业。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n<p>Branch指出，即使越来越多官方指南和教材反映气候变化的科学共识，向教师分发的非官方教育材料仍在传递更偏向的看法，其中包括自由意志主义智库和能源行业协会资助的材料。</p>\n</blockquote>\n<p>末句用They include列出非官方材料的来源，接上前句教师正收到这些资源。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Climate teaching may misrepresent the energy sector.</p>\n<p>一些学校气候变化教学可能歪曲能源行业。</p>\n</blockquote>\n<p>C需要材料对能源行业作错误描述。来自一个行业的资助，与材料误表这个行业本身，是两条不同关系。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. can be swayed by external forces</h3>\n<blockquote>\n<p>一些学校气候变化教学可能受外部力量左右。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>外部智库或行业资助材料，再向教师分发，构成校外力量影响课堂的途径，D保留可能性推断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>一些学校气候变化教学可能受外部力量左右。</p>\n</blockquote>\n<p><code>swayed by external forces</code>需要一条从校外进入教学的影响途径；第8段的<code>materials sponsored by energy industry associations</code>说明行业协会资助材料，而前句说明材料被发给教师，因此把两句连起来看。</p>\n<p>原文先说明带有更多偏见的非官方材料流向教师，再以<code>materials sponsored by energy industry associations</code>指出其中一种资助来源。这样，学校以外的行业组织就可以通过教学材料接近课堂。</p>\n<p><code>D</code>的<code>swayed by external forces</code>把这条“行业资助—材料发给教师”的途径概括为教学可能受外部力量左右。</p>\n<p><code>can</code>只说存在可能，不要求证明所有教师都采用了这些材料，因此能与末段的推断力度相接。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n<p>Branch指出，即使越来越多官方指南和教材反映气候变化的科学共识，向教师分发的非官方教育材料仍在传递更偏向的看法，其中包括自由意志主义智库和能源行业协会资助的材料。</p>\n</blockquote>\n<p>即使正式指南趋于科学共识，非官方材料仍流向教师，作者据此提醒正规标准之外还有影响。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Climate teaching can be swayed by external forces.</p>\n<p>一些学校气候变化教学可能受外部力量左右。</p>\n</blockquote>\n<p>can被外部左右不等于所有教师都采用这些材料，也不等于所有课堂已被控制；它只概括已呈现渠道带来的可能影响。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>25题结论</h3>\n<blockquote>\n<p><strong>25. D</strong></p>\n</blockquote>\n<ul>\n<li>A：公众要求加强事实教学、官方材料反映科学共识，都不等于课堂已满足公众主要诉求；末段反而指出偏向材料仍在流入。</li>\n<li>B：slanted perspectives是材料传达的偏向观点，教师是接收者，B却把偏向来源归成教师个人。</li>\n<li>C：能源行业协会是材料资助者，教学材料传递的是对气候变化的偏向观点，C却把能源行业写成被歪曲的对象。</li>\n<li>D：外部智库或行业资助材料，再向教师分发，构成校外力量影响课堂的途径，D保留可能性推断。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：德州气候教育争议的背景</strong>（段落1引入） 天气比喻：德州天气已凉 // 但教育委员会会议&quot;温度&quot;将高 → 核心议题：如何在德州学校教授气候变化</p>\n<p>↓（具体争议方）</p>\n<p><strong>逻辑层次2：能源利益代表的立场</strong>（段落2-3对立观点） 哈迪立场：【同情能源部门 → 抵制科学标准改变】→ 论据：（反对气候变化恐慌的科学家一样多 + 德州是能源州 + &quot;记住饭碗在哪&quot;）// 科学界反驳：哈迪随意驳回学者科学家的职业工作</p>\n<p>↓（更大背景）</p>\n<p><strong>逻辑层次3：全国性教育改革需求</strong>（段落4宏观趋势） 全球趋势：美国和世界各地激烈讨论 → 各方要求：（研究人员 + 政策制定者 + 教师 + 学生）→ 加大关注教授气候变化事实</p>\n<p>↓（教育现状评估）</p>\n<p><strong>逻辑层次4：气候教育的不足现状</strong>（段落5-6现状分析） 研究发现：【只有一半州获B+以上 → 德州最差（F级）+ 影响力大（教科书广泛销售）】→ 局限性：州级标准只是有限基准（决策权在地方）→ 即使标准好也不保证被教授</p>\n<p>↓（具体问题）</p>\n<p><strong>逻辑层次5：教育实施的结构性问题</strong>（段落7-8深层问题） 课程设置问题：【气候变化整合不均：（高中地球科学√ // 低年级课程× + 主流学科如生物化学× + 社会研究×）】→ 外部干扰：即使官方材料反映科学共识 // 非官方偏颇材料仍在分发（自由主义智库 + 能源行业协会赞助）</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：德克萨斯州的气候变化教育争议反映了美国教育体系中的深层矛盾：尽管科学界有共识且改革呼声高涨，但能源利益集团的影响、地方分权的教育体制以及外部势力的干预，使得气候变化教育面临重重阻碍。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. The uneven place of climate change across ages and subjects</p>\n<p>B. Official agreement does not exclude outside influence</p>\n<p>C. A heated local dispute over what schools should teach</p>\n<p>D. Why good state standards may not reach the classroom</p>\n<p>E. Broad demands alongside evidence of weak provision</p>\n<p>F. A guarantee that every textbook is free of bias</p>\n<p>G. A final decision to remove science from schools</p>\n<p><strong>41.</strong></p>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools. Pat Hardy, who sympathized with views of the energy sector, is resisting the proposed change to science standards for pre-teen pupils. &quot;There are as many scientists working against all the panic of global climate change as there are those who are pushing it,&quot; she claims. &quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot; Most scientists and experts sharply dispute Hardy&#39;s views. &quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n<p><strong>42.</strong></p>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools. A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n<p><strong>43.</strong></p>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n<p><strong>44.</strong></p>\n<p>Another issue is that while climate change is well integrated into some subjects and at some ages — such as earth and space sciences in high schools — it is not as well represented in curricula for younger children and in subjects that are more widely taught, such as biology and chemistry. It is also less prominent in many social studies courses.</p>\n<p><strong>45.</strong></p>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers. They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】C. A heated local dispute over what schools should teach</p>\n<blockquote>\n<p>学校该教什么引发的激烈地方争论</p>\n</blockquote>\n<p>天气降温与会议升温形成比喻对照，随后呈现Hardy反对改标准和Quinn对她轻视科研的批评。</p>\n<blockquote>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n</blockquote>\n<p>实际天气转凉与会议高温形成比喻对照，后半句把高温明确落在教学争论的气氛上。</p>\n<blockquote>\n<p>&quot;Texas is an energy State and we need to recognise that. You need to remember where your bread is buttered.&quot;</p>\n</blockquote>\n<p>Hardy援引得州能源利益支持自己的抵制立场，之后引用科研界反驳，双方分歧由此展开。</p>\n<blockquote>\n<p>&quot;They casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.</p>\n</blockquote>\n<p>Quinn批评科研工作被轻率当作错误意见，标题要抓住学校应教什么的争议，不能改成天气科学本身的说明。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>天气引出会议热度 → 能源立场反对修改标准 → 科研界批评轻视证据</p>\n</blockquote>\n<p>heated dispute概括多方争论，what schools teach明确争论对象。</p>\n<p>再看最强干扰项G：A final decision to remove science from schools。</p>\n<p>会议争论未给出最终政策，更不是取消所有科学教育。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】E. Broad demands alongside evidence of weak provision</p>\n<blockquote>\n<p>广泛需求与教育供给薄弱证据并存</p>\n</blockquote>\n<p>从地方争议转到更广泛教学需求，再以州学校研究评分显示气候教育普遍不足。</p>\n<blockquote>\n<p>Such debate reflects fierce discussions across the US and around the world, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.</p>\n</blockquote>\n<p>Such debate将得州会议扩展到全国和全球，加强气候事实教学的呼声并不限于一地。</p>\n<blockquote>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher.</p>\n</blockquote>\n<p>研究给勉强半数州B+以上，以教育表现说明现有供给与加强教学需求之间仍有差距。</p>\n<blockquote>\n<p>Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.</p>\n</blockquote>\n<p>得州低分却因教材广销而影响大，扩大了教育不足的后果范围。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>加强气候教学需求扩大 → 全国评分显示不足 → 低分人口大州教材影响外溢</p>\n</blockquote>\n<p>broad demands对应step up demands，weak provision对应barely half及低分州。</p>\n<p>再看最强干扰项F：A guarantee that every textbook is free of bias。</p>\n<p>评分不能证明教材没有偏见，末段还提出偏向材料问题。</p>\n<p><strong>42题选E。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】D. Why good state standards may not reach the classroom</p>\n<blockquote>\n<p>为何优秀州标准未必进入课堂</p>\n</blockquote>\n<p>Branch说明地方拥有决策权，州标准好也不代表真的教授。</p>\n<blockquote>\n<p>Glenn Branch, the centre&#39;s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards.</p>\n</blockquote>\n<p>limited benchmark限定州级标准只能作一项有限指标，因为实际决定权在地方学校董事会。</p>\n<blockquote>\n<p>Even if a state is considered a high performer in its science standards, &quot;that does not mean it will be taught&quot;, he says.</p>\n</blockquote>\n<p>Even if承认标准本身优秀，也不保证内容进入课堂，标题应概括文件标准与实际教学的距离。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>地方决策分散 → 州标准仅是有限指标 → 优秀标准未必落实</p>\n</blockquote>\n<p>may not reach对应does not mean it will be taught，保留标准与实施之间的缺口。</p>\n<p>再看最强干扰项G：A final decision to remove science from schools。</p>\n<p>作用有限不等于确定移除科学教学。</p>\n<p><strong>43题选D。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】A. The uneven place of climate change across ages and subjects</p>\n<blockquote>\n<p>气候变化在不同年龄和学科中的不均衡位置</p>\n</blockquote>\n<p>气候变化在部分高中学科融入较好，但低龄课程及常见学科覆盖不足。</p>\n<blockquote>\n<p>Another issue is that while climate change is well integrated into some subjects and at some ages — such as earth and space sciences in high schools — it is not as well represented in curricula for younger children and in subjects that are more widely taught, such as biology and chemistry.</p>\n</blockquote>\n<p>while将部分高中学科融入良好与低龄及常见学科覆盖不足对照，问题是内容分布不均。</p>\n<blockquote>\n<p>It is also less prominent in many social studies courses.</p>\n</blockquote>\n<p>also把社会研究课程补入覆盖不足的范围，继续扩大年龄与学科差异，而不是新增教师个人态度问题。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>部分年龄学科融入较好 → 低龄与普遍科目不足 → 社会研究也不突出</p>\n</blockquote>\n<p>uneven place对应while的对照，ages and subjects保留两个维度。</p>\n<p>再看最强干扰项D：Why good state standards may not reach the classroom。</p>\n<p>D解释制度执行，本段转向课程分布的具体缺口。</p>\n<p><strong>44题选A。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】B. Official agreement does not exclude outside influence</p>\n<blockquote>\n<p>官方共识不能排除外部影响</p>\n</blockquote>\n<p>即使官方材料反映科学共识，带偏向的非官方材料仍发给教师，部分由智库和行业资助。</p>\n<blockquote>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers.</p>\n</blockquote>\n<p>even if让步肯定官方材料趋向共识，重点转到仍向教师分发的偏向非官方材料。</p>\n<blockquote>\n<p>They include materials sponsored by libertarian think-tanks and energy industry associations.</p>\n</blockquote>\n<p>They回指这些材料，智库和行业协会是资助来源，由此说明正式标准之外的外部影响渠道。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>官方材料反映共识 → 非官方偏向材料仍流入 → 外部资助者可影响教学资源</p>\n</blockquote>\n<p>does not exclude对应even if，outside influence沿资助者—材料—教师进入教学。</p>\n<p>再看最强干扰项F：A guarantee that every textbook is free of bias。</p>\n<p>原文明写slanted perspectives，不存在全部无偏见的保证。</p>\n<p><strong>45题选B。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>A dispute about climate education can become heated even when the weather has cooled. In Texas, officials debating science standards reveal a conflict over what pupils should be taught. The disagreement is about the place of scientific knowledge in school, not simply about the temperature outside.</p>\n<p><strong>B.</strong></p>\n<p>One participant in that conflict links her position to the energy sector and resists proposed changes. Scientists and education advocates dispute her approach. Their criticism is that established scientific work is being dismissed as merely another misguided opinion, rather than evaluated as a body of evidence.</p>\n<p><strong>C.</strong></p>\n<p>The demand for stronger climate teaching reaches beyond this single meeting. A national study found that many state school systems received modest or poor grades. Some poorly rated states also have an influence beyond their borders because textbooks produced for them are widely sold elsewhere.</p>\n<p><strong>D.</strong></p>\n<p>The sources of teaching material introduce another difference. Official guidance may reflect scientific consensus, but teachers can also receive unofficial resources. These additional materials do not necessarily present the same account of the evidence.</p>\n<p><strong>E.</strong></p>\n<p>Textbook influence and state standards nevertheless provide only part of the picture. Decisions are often decentralised to local school boards. A state can perform well on written standards without ensuring that the corresponding material is actually taught in classrooms.</p>\n<p><strong>F.</strong></p>\n<p>Actual coverage also differs by age and subject. Climate change may be well integrated into particular high-school science courses while receiving less attention in younger pupils’ lessons or in widely taught subjects. The distribution of content therefore matters as well as the formal quality of a standard.</p>\n<p><strong>G.</strong></p>\n<p>Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations. The route of influence runs from outside sponsors through materials distributed to teachers. Receiving such a resource does not mean that the teacher originated its bias.</p>\n<p><strong>H.</strong></p>\n<p>Understanding climate education thus requires attention to more than a written state rule. Classroom decisions, curriculum coverage and the origins of teaching resources all affect what pupils encounter. Improvements on one measure should not be mistaken for a guarantee that these other problems have disappeared.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>用天气与会议的对照引出教学争论</td>\n</tr>\n<tr>\n<td>B</td>\n<td>区分反对者立场与科研界批评</td>\n</tr>\n<tr>\n<td>C</td>\n<td>从地方冲突扩展到全国不足及教材影响</td>\n</tr>\n<tr>\n<td>D</td>\n<td>引出官方与非官方材料差别</td>\n</tr>\n<tr>\n<td>E</td>\n<td>指出制度标准不必然转化成课堂教学</td>\n</tr>\n<tr>\n<td>F</td>\n<td>补充年龄学科之间的覆盖差异</td>\n</tr>\n<tr>\n<td>G</td>\n<td>明确偏向材料的外部资助和传递路径</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结标准实施课程和材料多层影响</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>用天气与会议的对照引出教学争论 → 区分反对者立场与科研界批评 → 从地方冲突扩展到全国不足及教材影响 → 指出制度标准不必然转化成课堂教学 → 补充年龄学科之间的覆盖差异 → 引出官方与非官方材料差别 → 明确偏向材料的外部资助和传递路径 → 总结标准实施课程和材料多层影响</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → B → C → E → F → D → G → H</strong></p>\n<p>41—45：B、C、F、D、G。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → B → C。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>The disagreement is about the place of scientific knowledge in school, not simply about the temperature outside.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>One participant in that conflict links her position to the energy sector and resists proposed changes.</p>\n</blockquote>\n<p>前段the disagreement已确立教学争议，One participant in that conflict直接接其中一方，介绍与能源行业相连的反对者。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Scientists and education advocates dispute her approach. Their criticism is that established scientific work is being dismissed as merely another misguided opinion, rather than evaluated as a body of evidence.</p>\n</blockquote>\n<p>随后科学家和教育倡导者反驳，Their criticism明确批评科研证据被降成错误意见，完成争议两方的展开。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>The demand for stronger climate teaching reaches beyond this single meeting.</p>\n</blockquote>\n<p>beyond this single meeting将地方冲突扩展到更广范围，下一段才进入全国教育表现。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用天气与会议的对照引出教学争论 → 区分反对者立场与科研界批评 → 从地方冲突扩展到全国不足及教材影响</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Actual coverage also differs by age and subject.</p>\n</blockquote>\n<p>年龄与学科覆盖差异在后面实际教学讨论中才展开，这里仍需交代争议内容，否则single meeting所概括的冲突欠缺双方具体立场。</p>\n<p><strong>41题选B。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为B → C → E。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Their criticism is that established scientific work is being dismissed as merely another misguided opinion, rather than evaluated as a body of evidence.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>The demand for stronger climate teaching reaches beyond this single meeting.</p>\n</blockquote>\n<p>前段科研界批评构成更强教学要求，reaches beyond this single meeting承接并扩展讨论范围。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A national study found that many state school systems received modest or poor grades. Some poorly rated states also have an influence beyond their borders because textbooks produced for them are widely sold elsewhere.</p>\n</blockquote>\n<p>全国研究评分低体现不足，部分州教材跨境销售又说明这种不足可影响其他地区。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>Textbook influence and state standards nevertheless provide only part of the picture.</p>\n</blockquote>\n<p>Textbook influence and state standards复现当前教材影响及各州表现，nevertheless转入这些仍非课堂全貌。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>区分反对者立场与科研界批评 → 从地方冲突扩展到全国不足及教材影响 → 指出制度标准不必然转化成课堂教学</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Actual coverage also differs by age and subject.</p>\n</blockquote>\n<p>Actual coverage也涉及不足，但此处先交代国家范围评分和教材影响，后句才能用nevertheless对已有衡量作限制。</p>\n<p><strong>42题选C。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → F → D。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>A state can perform well on written standards without ensuring that the corresponding material is actually taught in classrooms.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Actual coverage also differs by age and subject.</p>\n</blockquote>\n<p>前段说高书面标准不能保证真正教学，Actual coverage接课堂实际情况，再按年龄与学科细分。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Climate change may be well integrated into particular high-school science courses while receiving less attention in younger pupils’ lessons or in widely taught subjects. The distribution of content therefore matters as well as the formal quality of a standard.</p>\n</blockquote>\n<p>while对照某些高中科学课程融入良好与低龄、普遍科目不足，therefore总结分布与正式标准质量都重要。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>The sources of teaching material introduce another difference.</p>\n</blockquote>\n<p>another difference承接当前年龄学科差异，后段将维度转向材料来源。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>指出制度标准不必然转化成课堂教学 → 补充年龄学科之间的覆盖差异 → 引出官方与非官方材料差别</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations.</p>\n</blockquote>\n<p>带偏向的非官方资源是下一层材料来源差异的实例，不能提前替代课程分布，否则another difference缺少当前这一层比较。</p>\n<p><strong>43题选F。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为F → D → G。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>The distribution of content therefore matters as well as the formal quality of a standard.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>The sources of teaching material introduce another difference.</p>\n</blockquote>\n<p>前段已强调内容分布，The sources...another difference承接多层差异，转到教学材料从哪里来。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Official guidance may reflect scientific consensus, but teachers can also receive unofficial resources. These additional materials do not necessarily present the same account of the evidence.</p>\n</blockquote>\n<p>官方共识与教师也会收到非官方资源由but对照，These additional materials回指后者并说明其证据叙述未必相同。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations.</p>\n</blockquote>\n<p>Some unofficial resources复现非官方资源，下一段具体说明偏向观点及资助方。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>补充年龄学科之间的覆盖差异 → 引出官方与非官方材料差别 → 明确偏向材料的外部资助和传递路径</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>One participant in that conflict links her position to the energy sector and resists proposed changes.</p>\n</blockquote>\n<p>回到某位能源立场的争议参与者会中断这里的来源分类；该人物不等于这批材料，也无法为additional materials提供相应解释。</p>\n<p><strong>44题选D。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为D → G → H。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>These additional materials do not necessarily present the same account of the evidence.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Some unofficial resources convey slanted perspectives and are supported by think-tanks or energy-industry associations.</p>\n</blockquote>\n<p>前段已说额外材料可能提供不同叙述，Some unofficial resources承接并具体说明偏向和智库行业资助。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The route of influence runs from outside sponsors through materials distributed to teachers. Receiving such a resource does not mean that the teacher originated its bias.</p>\n</blockquote>\n<p>外部资助者经材料向教师传递影响，Receiving...does not mean又区分接收材料与教师自身产生偏见。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Understanding climate education thus requires attention to more than a written state rule.</p>\n</blockquote>\n<p>thus以这条外部渠道收束：理解气候教育不能仅看书面州规则，还要看材料如何进入课堂。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>引出官方与非官
