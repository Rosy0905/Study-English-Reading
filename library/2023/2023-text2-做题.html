<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 26题题干\n\n**Which of the following is true of New England?**\n\n> 关于新英格兰，下列哪项说法是正确的？\n\n题型：**事实判断题**。","articleRects":[],"questionRects":[[226,190,785,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"26"},"html":"<h2>26题题干</h2>\n<p><strong>Which of the following is true of New England?</strong></p>\n<blockquote><p>关于新英格兰，下列哪项说法是正确的？</p>\n</blockquote>\n<p>题型：<strong>事实判断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 27题题干\n\n**The bill mentioned in Paragraph 2 was intended to ______.**\n\n> 第2段提到的法案意在做什么？\n\n题型：**目的判断题**。","articleRects":[],"questionRects":[[226,570,937,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"27"},"html":"<h2>27题题干</h2>\n<p><strong>The bill mentioned in Paragraph 2 was intended to ______.</strong></p>\n<blockquote><p>第2段提到的法案意在做什么？</p>\n</blockquote>\n<p>题型：<strong>目的判断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 28题题干\n\n**Compared with Castle, Taylor is more likely to support ______.**\n\n> 与卡斯尔相比，泰勒更可能支持什么？\n\n题型：**人物观点比较题**。","articleRects":[],"questionRects":[[226,951,896,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"28"},"html":"<h2>28题题干</h2>\n<p><strong>Compared with Castle, Taylor is more likely to support ______.</strong></p>\n<blockquote><p>与卡斯尔相比，泰勒更可能支持什么？</p>\n</blockquote>\n<p>题型：<strong>人物观点比较题</strong>。</p>\n"},{"section":"先读题干","raw":"## 29题题干\n\n**What does Horn emphasize in Paragraph 5?**\n\n> 霍恩在第5段强调了什么？\n\n题型：**段落观点题**。","articleRects":[],"questionRects":[[226,1331,713,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"29"},"html":"<h2>29题题干</h2>\n<p><strong>What does Horn emphasize in Paragraph 5?</strong></p>\n<blockquote><p>霍恩在第5段强调了什么？</p>\n</blockquote>\n<p>题型：<strong>段落观点题</strong>。</p>\n"},{"section":"先读题干","raw":"## 30题题干\n\n**Horn holds that imposing registration requirements is ______.**\n\n> 霍恩认为，施加登记要求是怎样的？\n\n题型：**人物态度题**。","articleRects":[],"questionRects":[[226,1712,850,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"30"},"html":"<h2>30题题干</h2>\n<p><strong>Horn holds that imposing registration requirements is ______.</strong></p>\n<blockquote><p>霍恩认为，施加登记要求是怎样的？</p>\n</blockquote>\n<p>题型：<strong>人物态度题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | However, but, Without |\n| 态度词／评价词 | 先抓个大概好坏 | low, crisis, good |\n| 动作词 | 先看谁做了什么 | regulate, restricting, build |\n| 结果词 | 看最后出了什么事 | pressure, benefit, change |\n| 重复主题词 | 大概知道老在说什么 | rentals, housing, developers |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>However, but, Without</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>low, crisis, good</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>regulate, restricting, build</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>pressure, benefit, change</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>rentals, housing, developers</td></tr></tbody></table>\n"},{"section":"读文章","raw": 课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，遇到这种情况，可再结合全文检查。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，遇到这种情况，可再结合全文检查。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"26题","raw":"## 26题\n\n> Which of the following is true of New England?  \n> 关于新英格兰，下列哪项说法是正确的？\n\n题干直接问New England。第1段开头是Communities throughout New England，随后写当地短期出租监管以及眼下的住房状况，因此先把第1段从头到尾读完。\n\n> 原文参考：\n> \n> Communities throughout New England have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there’s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to **[xxx]** for a **[xxx]** on the short-term rental market.\n> \n> 开始精读：\n> \n> Communities throughout New England have been attempting to regulate short-term rentals  / since sites like Airbnb took off in the 2010s.  / Now,  / with record-high home prices and historically low inventory,  / there’s an increased urgency in such regulation,  / particularly among those who worry  / that developers will come in and buy up swaths of housing  / to **[xxx]** for a **[xxx]** on the short-term rental market.\n> \n> 新英格兰各地的社区一直试图监管短期出租， / 自从爱彼迎这类网站在2010年代迅速发展以来。 / 如今， / 随着房价创下历史新高、房源量降到历史低位， / 这类监管变得更加紧迫， / 尤其是在那些担心的人当中， / 他们担心开发商会进来，买下大片住房， / 以便在短租市场上为一个**[xxx]**而**[xxx]**。\n\nWhich of the following is true要核对一项关于新英格兰的事实。第1段把监管短期出租的行动与房价、房源和居民的担忧放在一起，要看各项分别怎样描述这些内容。\n\n接下来按A—D逐项看。","articleRects":[[274,287,1122,37],[203,334,1192,37],[202,382,1194,38],[202,430,1193,38],[202,478,1193,38],[202,526,207,31]],"questionRects":[[226,190,785,38],[283,253,668,38],[283,317,646,37],[283,380,682,38],[283,444,646,37],[311,464,10,10]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"26","initialReadingPids":[0]},"html":"<h2>26题</h2>\n<blockquote><p>Which of the following is true of New England?<br />\n关于新英格兰，下列哪项说法是正确的？</p>\n</blockquote>\n<p>题干直接问New England。第1段开头是Communities throughout New England，随后写当地短期出租监管以及眼下的住房状况，因此先把第1段从头到尾读完。</p>\n<blockquote><p>原文参考：</p>\n<p>Communities throughout New England have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there’s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to <strong>[xxx]</strong> for a <strong>[xxx]</strong> on the short-term rental market.</p>\n<p>开始精读：</p>\n<p>Communities throughout New England have been attempting to regulate short-term rentals  / since sites like Airbnb took off in the 2010s.  / Now,  / with record-high home prices and historically low inventory,  / there’s an increased urgency in such regulation,  / particularly among those who worry  / that developers will come in and buy up swaths of housing  / to <strong>[xxx]</strong> for a <strong>[xxx]</strong> on the short-term rental market.</p>\n<p>新英格兰各地的社区一直试图监管短期出租， / 自从爱彼迎这类网站在2010年代迅速发展以来。 / 如今， / 随着房价创下历史新高、房源量降到历史低位， / 这类监管变得更加紧迫， / 尤其是在那些担心的人当中， / 他们担心开发商会进来，买下大片住房， / 以便在短租市场上为一个<strong>[xxx]</strong>而<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>Which of the following is true要核对一项关于新英格兰的事实。第1段把监管短期出租的行动与房价、房源和居民的担忧放在一起，要看各项分别怎样描述这些内容。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"26题","raw":"### A. Its housing supply is at a very low level.\n\n> 它的住房供应处在很低的水平。\n\n把A接回题干，它说的是：关于新英格兰，正确的情况是其住房供应处在很低的水平。\n\nA说住房供应很低，回第1段找home prices旁边的inventory。\n\n> with record-high home prices and historically low inventory\n\n房价创纪录地高，而inventory处在历史低位。这里两件事并列：房子贵，能够提供的房屋又少。\n\n后面担心开发商大量买入房屋用于短租，也是在现有房源已经很少的情况下提出的担忧。\n\n**historically low inventory能不能对应住房供应处在很低水平？**\n\n能。A没有把价格与数量混在一起，直接接住了房源不足的情况。\n\n**第一轮判断：A保留。**","articleRects":[[274,287,1122,37],[203,334,1192,37],[202,382,1194,38],[202,430,1193,38],[202,478,1193,38],[202,526,207,31]],"questionRects":[[283,253,668,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"26","paragraphPids":[0]},"html":"<h3>A. Its housing supply is at a very low level.</h3>\n<blockquote><p>它的住房供应处在很低的水平。</p>\n</blockquote>\n<p>把A接回题干，它说的是：关于新英格兰，正确的情况是其住房供应处在很低的水平。</p>\n<p>A说住房供应很低，回第1段找home prices旁边的inventory。</p>\n<blockquote><p>with record-high home prices and historically low inventory</p>\n</blockquote>\n<p>房价创纪录地高，而inventory处在历史低位。这里两件事并列：房子贵，能够提供的房屋又少。</p>\n<p>后面担心开发商大量买入房屋用于短租，也是在现有房源已经很少的情况下提出的担忧。</p>\n<p><strong>historically low inventory能不能对应住房供应处在很低水平？</strong></p>\n<p>能。A没有把价格与数量混在一起，直接接住了房源不足的情况。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"26题","raw":"### B. Its communities are in need of funding.\n\n> 它的社区需要资金支持。\n\n把B接回题干，它说的是：关于新英格兰，正确的情况是当地社区需要资金支持。\n\nB说社区缺资金，回第1段看communities正在做什么。\n\n> Communities throughout New England have been attempting to regulate short-term rentals\n\n> with record-high home prices and historically low inventory, there’s an increased urgency in such regulation\n\n社区一直试图管理短租，现在因为房价高、房源少，管理变得更急迫。作者解释的是为什么需要监管。\n\n文中没有说社区预算不够，也没有提出给社区筹款。住房昂贵，不能直接等同于社区机构缺少资金。\n\n**这里急需的是资金支持，还是对短租的管理？**\n\n是管理。B把住房市场的问题换成了社区财政问题。\n\n**第一轮判断：B排除。**","articleRects":[[274,287,1122,37],[203,334,1192,37],[202,382,1194,38],[202,430,1193,38],[202,478,1193,38],[202,526,207,31]],"questionRects":[[283,317,646,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>B. Its communities are in need of funding.</h3>\n<blockquote><p>它的社区需要资金支持。</p>\n</blockquote>\n<p>把B接回题干，它说的是：关于新英格兰，正确的情况是当地社区需要资金支持。</p>\n<p>B说社区缺资金，回第1段看communities正在做什么。</p>\n<blockquote><p>Communities throughout New England have been attempting to regulate short-term rentals</p>\n</blockquote>\n<blockquote><p>with record-high home prices and historically low inventory, there’s an increased urgency in such regulation</p>\n</blockquote>\n<p>社区一直试图管理短租，现在因为房价高、房源少，管理变得更急迫。作者解释的是为什么需要监管。</p>\n<p>文中没有说社区预算不够，也没有提出给社区筹款。住房昂贵，不能直接等同于社区机构缺少资金。</p>\n<p><strong>这里急需的是资金支持，还是对短租的管理？</strong></p>\n<p>是管理。B把住房市场的问题换成了社区财政问题。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"26题","raw":"### C. Its rental vacancy rate is going up slowly.\n\n> 它的租房空置率正在缓慢上升。\n\n把C接回题干，它说的是：关于新英格兰，正确的情况是租房空置率正在缓慢上升。\n\nC说空置率上升，回第2段看rental vacancy rate后面的动词。\n\n> 原文参考：\n> \n> In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already **[xxx]** market. The state Legislature recently voted against a bill that would’ve made it illegal for towns to create **[xxx]** restricting short-term rentals.\n> \n> 开始精读：\n> \n> In New Hampshire,  / where the rental vacancy rate has dropped below 1 percent,  / housing advocates fear unchecked short-term rentals  / will put further pressure on an already **[xxx]** market.  / The state Legislature recently voted against a bill  / that would’ve made it illegal for towns  / to create **[xxx]** restricting short-term rentals.\n> \n> 在新罕布什尔州， / 租房空置率已降到1%以下， / 住房倡导者担心，不受约束的短期出租 / 会对一个已经**[xxx]**的市场施加更大的压力。 / 州议会最近投票反对了一项法案， / 该法案本会使各城镇的下述行为成为非法： / 制定限制短期出租的**[xxx]**。\n\n> In New Hampshire, where the rental vacancy rate has dropped below 1 percent\n\n原句是has dropped below 1 percent，已经下降到1%以下。能空出来出租的房屋很少，才引出人们担心短租会进一步加重压力。\n\nC不仅把下降换成上升，还添了slowly，原文也没有交代这种上升速度。\n\n**dropped below 1 percent与going up是同一个方向吗？**\n\n方向相反。C不能成立。\n\n**第一轮判断：C排除。**","articleRects":[[274,574,1121,38],[204,622,1193,38],[202,670,1194,38],[202,718,1194,38],[202,766,430,38]],"questionRects":[[283,380,682,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"26","initialReadingPids":[1],"paragraphPids":[1]},"html":"<h3>C. Its rental vacancy rate is going up slowly.</h3>\n<blockquote><p>它的租房空置率正在缓慢上升。</p>\n</blockquote>\n<p>把C接回题干，它说的是：关于新英格兰，正确的情况是租房空置率正在缓慢上升。</p>\n<p>C说空置率上升，回第2段看rental vacancy rate后面的动词。</p>\n<blockquote><p>原文参考：</p>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already <strong>[xxx]</strong> market. The state Legislature recently voted against a bill that would’ve made it illegal for towns to create <strong>[xxx]</strong> restricting short-term rentals.</p>\n<p>开始精读：</p>\n<p>In New Hampshire,  / where the rental vacancy rate has dropped below 1 percent,  / housing advocates fear unchecked short-term rentals  / will put further pressure on an already <strong>[xxx]</strong> market.  / The state Legislature recently voted against a bill  / that would’ve made it illegal for towns  / to create <strong>[xxx]</strong> restricting short-term rentals.</p>\n<p>在新罕布什尔州， / 租房空置率已降到1%以下， / 住房倡导者担心，不受约束的短期出租 / 会对一个已经<strong>[xxx]</strong>的市场施加更大的压力。 / 州议会最近投票反对了一项法案， / 该法案本会使各城镇的下述行为成为非法： / 制定限制短期出租的<strong>[xxx]</strong>。</p>\n</blockquote>\n<blockquote><p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent</p>\n</blockquote>\n<p>原句是has dropped below 1 percent，已经下降到1%以下。能空出来出租的房屋很少，才引出人们担心短租会进一步加重压力。</p>\n<p>C不仅把下降换成上升，还添了slowly，原文也没有交代这种上升速度。</p>\n<p><strong>dropped below 1 percent与going up是同一个方向吗？</strong></p>\n<p>方向相反。C不能成立。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"26题","raw":"### D. Its home prices are under strict control.\n\n> 它的房价受到严格控制。\n\n把D接回题干，它说的是：关于新英格兰，正确的情况是当地房价受到严格控制。\n\nD说房价严格受控，回第1段看价格与管理分别出现在哪里。\n\n> have been attempting to regulate short-term rentals\n\n> with record-high home prices and historically low inventory, there’s an increased urgency in such regulation\n\n房价是record-high，创了纪录；社区尝试管理的对象是short-term rentals。文中说管理更加紧迫，并没有说已经把房价严格控制住。\n\n管理短租可能与住房价格有关，但这两个对象仍然不能直接互换。\n\n**社区尝试管理短租，就证明房价已受到严格控制吗？**\n\n不能。D既换了管理对象，也把正在争取管理写成了已经严控。\n\n**第一轮判断：D排除。**","articleRects":[[274,287,1122,37],[203,334,1192,37],[202,382,1194,38],[202,430,1193,38],[202,478,1193,38],[202,526,207,31]],"questionRects":[[283,444,646,37],[311,464,10,10]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>D. Its home prices are under strict control.</h3>\n<blockquote><p>它的房价受到严格控制。</p>\n</blockquote>\n<p>把D接回题干，它说的是：关于新英格兰，正确的情况是当地房价受到严格控制。</p>\n<p>D说房价严格受控，回第1段看价格与管理分别出现在哪里。</p>\n<blockquote><p>have been attempting to regulate short-term rentals</p>\n</blockquote>\n<blockquote><p>with record-high home prices and historically low inventory, there’s an increased urgency in such regulation</p>\n</blockquote>\n<p>房价是record-high，创了纪录；社区尝试管理的对象是short-term rentals。文中说管理更加紧迫，并没有说已经把房价严格控制住。</p>\n<p>管理短租可能与住房价格有关，但这两个对象仍然不能直接互换。</p>\n<p><strong>社区尝试管理短租，就证明房价已受到严格控制吗？</strong></p>\n<p>不能。D既换了管理对象，也把正在争取管理写成了已经严控。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"26题","raw":"### 26题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。A的住房供应很低对应房源量处在历史低位；资金需要、空置率上升和房价已受严格控制都改变了原文所说的关系。","articleRects":[],"questionRects":[[226,190,785,38],[283,253,668,38],[283,317,646,37],[283,380,682,38],[283,444,646,37],[311,464,10,10]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"26"},"html":"<h3>26题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。A的住房供应很低对应房源量处在历史低位；资金需要、空置率上升和房价已受严格控制都改变了原文所说的关系。</p>\n"},{"section":"27题","raw":"## 27题\n\n> The bill mentioned in Paragraph 2 was intended to ______.  \n> 第2段提到的法案意在做什么？\n\n题干直接指定Paragraph 2，并问其中的bill。第2段已经完整读过，现在把第2句中法案的内容与议会的投票结果分别读清。\n\nwas intended to问法案原本要达到的结果。第2段先说住房倡导者担心短租带来的压力，再说议会反对了一项会使城镇某种限制行为成为非法的法案；要核对法案本身要产生的效果，而不是把投票反对当成法案的目的。\n\n接下来按A—D逐项看。","articleRects":[[274,574,1121,38],[204,622,1193,38],[202,670,1194,38],[202,718,1194,38],[202,766,430,38]],"questionRects":[[226,570,937,38],[283,634,559,37],[283,697,581,38],[283,761,556,37],[283,820,609,44],[311,844,10,10]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"27","initialReadingPids":[]},"html":"<h2>27题</h2>\n<blockquote><p>The bill mentioned in Paragraph 2 was intended to ______.<br />\n第2段提到的法案意在做什么？</p>\n</blockquote>\n<p>题干直接指定Paragraph 2，并问其中的bill。第2段已经完整读过，现在把第2句中法案的内容与议会的投票结果分别读清。</p>\n<p>was intended to问法案原本要达到的结果。第2段先说住房倡导者担心短租带来的压力，再说议会反对了一项会使城镇某种限制行为成为非法的法案；要核对法案本身要产生的效果，而不是把投票反对当成法案的目的。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"27题","raw":"### A. curb short-term rental speculation\n\n> 遏制短期出租投机。\n\n把A接回题干，它说的是：第2段提到的法案意在遏制短期出租投机。\n\nA说遏制短租投机，回第2段把made it illegal与restricting的关系读清。\n\n> a bill that would’ve made it illegal for towns to create **[xxx]** restricting short-term rentals\n\n法案要把什么定为非法？是城镇制定限制短租的规定。也就是不让城镇限制短租，而不是不让人经营短租。\n\n前面住房倡导者确实担忧短租压力，但这是他们的担忧，不能代替后面法案的内容。\n\n**法案禁止的是短租投机，还是城镇去限制短租？**\n\n是后者。A把对限制的禁止看成了对短租的限制。\n\n**第一轮判断：A排除。**","articleRects":[[274,574,1121,38],[204,622,1193,38],[202,670,1194,38],[202,718,1194,38],[202,766,430,38]],"questionRects":[[283,634,559,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>A. curb short-term rental speculation</h3>\n<blockquote><p>遏制短期出租投机。</p>\n</blockquote>\n<p>把A接回题干，它说的是：第2段提到的法案意在遏制短期出租投机。</p>\n<p>A说遏制短租投机，回第2段把made it illegal与restricting的关系读清。</p>\n<blockquote><p>a bill that would’ve made it illegal for towns to create <strong>[xxx]</strong> restricting short-term rentals</p>\n</blockquote>\n<p>法案要把什么定为非法？是城镇制定限制短租的规定。也就是不让城镇限制短租，而不是不让人经营短租。</p>\n<p>前面住房倡导者确实担忧短租压力，但这是他们的担忧，不能代替后面法案的内容。</p>\n<p><strong>法案禁止的是短租投机，还是城镇去限制短租？</strong></p>\n<p>是后者。A把对限制的禁止看成了对短租的限制。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"27题","raw":"### B. ensure the supply of cheap housing\n\n> 保障廉价住房的供应。\n\n把B接回题干，它说的是：第2段提到的法案意在保障廉价住房的供应。\n\nB说保障廉价住房，回第2段区分住房倡导者的担忧与法案规定。\n\n> housing advocates fear unchecked short-term rentals will put further pressure on an already **[xxx]** market\n\n> would’ve made it illegal for towns to create **[xxx]** restricting short-term rentals\n\n倡导者担心不受约束的短租会给紧张市场增加压力。法案却要让城镇不能制定限制短租的规定，因此州议会投票反对它。\n\n保障住房供应可以是反对者希望实现的事情，但法案写出的措施是在解除短租限制。\n\n**担心住房紧缺的人所希望的目标，就是这项法案的目的吗？**\n\n不是。B把反对法案一方的住房关切安到了法案上。\n\n**第一轮判断：B排除。**","articleRects":[[274,574,1121,38],[204,622,1193,38],[202,670,1194,38],[202,718,1194,38],[202,766,430,38]],"questionRects":[[283,697,581,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>B. ensure the supply of cheap housing</h3>\n<blockquote><p>保障廉价住房的供应。</p>\n</blockquote>\n<p>把B接回题干，它说的是：第2段提到的法案意在保障廉价住房的供应。</p>\n<p>B说保障廉价住房，回第2段区分住房倡导者的担忧与法案规定。</p>\n<blockquote><p>housing advocates fear unchecked short-term rentals will put further pressure on an already <strong>[xxx]</strong> market</p>\n</blockquote>\n<blockquote><p>would’ve made it illegal for towns to create <strong>[xxx]</strong> restricting short-term rentals</p>\n</blockquote>\n<p>倡导者担心不受约束的短租会给紧张市场增加压力。法案却要让城镇不能制定限制短租的规定，因此州议会投票反对它。</p>\n<p>保障住房供应可以是反对者希望实现的事情，但法案写出的措施是在解除短租限制。</p>\n<p><strong>担心住房紧缺的人所希望的目标，就是这项法案的目的吗？</strong></p>\n<p>不是。B把反对法案一方的住房关切安到了法案上。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"27题","raw":"### C. punish illegal dealings in housing\n\n> 惩罚住房领域的非法交易。\n\n把C接回题干，它说的是：第2段提到的法案意在惩罚住房领域的非法交易。\n\nC说惩罚非法住房交易，回第2段找illegal后面被认定违法的行为。\n\n> would’ve made it illegal for towns to create **[xxx]** restricting short-term rentals\n\n被法案认定为非法的是towns去create限制短租的规定。句子的行为者是城镇，行为是制定限制。\n\nC把illegal接到住房交易上，仿佛法案要打击买卖中的违法行为，但原句没有这样说。\n\n**这里illegal修饰的是违法交易吗？**\n\n不是。它针对地方制定限制短租规定这件事，C接错了内容。\n\n**第一轮判断：C排除。**","articleRects":[[274,574,1121,38],[204,622,1193,38],[202,670,1194,38],[202,718,1194,38],[202,766,430,38]],"questionRects":[[283,761,556,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>C. punish illegal dealings in housing</h3>\n<blockquote><p>惩罚住房领域的非法交易。</p>\n</blockquote>\n<p>把C接回题干，它说的是：第2段提到的法案意在惩罚住房领域的非法交易。</p>\n<p>C说惩罚非法住房交易，回第2段找illegal后面被认定违法的行为。</p>\n<blockquote><p>would’ve made it illegal for towns to create <strong>[xxx]</strong> restricting short-term rentals</p>\n</blockquote>\n<p>被法案认定为非法的是towns去create限制短租的规定。句子的行为者是城镇，行为是制定限制。</p>\n<p>C把illegal接到住房交易上，仿佛法案要打击买卖中的违法行为，但原句没有这样说。</p>\n<p><strong>这里illegal修饰的是违法交易吗？</strong></p>\n<p>不是。它针对地方制定限制短租规定这件事，C接错了内容。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"27题","raw":"### D. allow a free short-term rental market\n\n> 允许一个自由的短期出租市场。\n\n把D接回题干，它说的是：第2段提到的法案意在允许一个自由的短期出租市场。\n\nD说允许自由短租市场，回第2段看法案怎样对待城镇限制。\n\n> a bill that would’ve made it illegal for towns to create **[xxx]** restricting short-term rentals\n\n法案若通过，城镇制定限制短租的规定就会违法。地方不能这样设限制，短租市场便能少受这方面的约束。\n\n州议会后来否决法案，是法案的结果；题干问的是法案本来想做什么，仍要从would’ve made后面的内容判断。\n\n**不允许地方限制短租，是在收紧短租市场，还是放松它？**\n\n是放松。D能对应法案拟取消地方限制的目的，可以保留。\n\n**第一轮判断：D保留。**","articleRects":[[274,574,1121,38],[204,622,1193,38],[202,670,1194,38],[202,718,1194,38],[202,766,430,38]],"questionRects":[[283,820,609,44],[311,844,10,10]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"27","paragraphPids":[1]},"html":"<h3>D. allow a free short-term rental market</h3>\n<blockquote><p>允许一个自由的短期出租市场。</p>\n</blockquote>\n<p>把D接回题干，它说的是：第2段提到的法案意在允许一个自由的短期出租市场。</p>\n<p>D说允许自由短租市场，回第2段看法案怎样对待城镇限制。</p>\n<blockquote><p>a bill that would’ve made it illegal for towns to create <strong>[xxx]</strong> restricting short-term rentals</p>\n</blockquote>\n<p>法案若通过，城镇制定限制短租的规定就会违法。地方不能这样设限制，短租市场便能少受这方面的约束。</p>\n<p>州议会后来否决法案，是法案的结果；题干问的是法案本来想做什么，仍要从would’ve made后面的内容判断。</p>\n<p><strong>不允许地方限制短租，是在收紧短租市场，还是放松它？</strong></p>\n<p>是放松。D能对应法案拟取消地方限制的目的，可以保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"27题","raw":"### 27题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。法案要禁止城镇制定短租限制，因此其目的在于放开这类限制；不是遏制短租投机、保障廉价住房供应或惩罚住房交易。","articleRects":[],"questionRects":[[226,570,937,38],[283,634,559,37],[283,697,581,38],[283,761,556,37],[283,820,609,44],[311,844,10,10]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"27"},"html":"<h3>27题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。法案要禁止城镇制定短租限制，因此其目的在于放开这类限制；不是遏制短租投机、保障廉价住房供应或惩罚住房交易。</p>\n"},{"section":"28题","raw":"## 28题\n\n> Compared with Castle, Taylor is more likely to support ______.  \n> 与卡斯尔相比，泰勒更可能支持什么？\n\n题干直接给出Castle和Taylor。第3段引述Taylor，第4段引述Castle，先完整精读这两个自然段，把两人各自强调的住房问题读清。\n\n> 原文参考：\n> \n> “We are at a crisis level on the supply of rental housing,” said Nick Taylor, **[xxx]** director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, “employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,” Taylor said.\n> \n> 开始精读：\n> \n> “We are at a crisis level on the supply of rental housing,”  / said Nick Taylor,  / **[xxx]** director of the Workforce Housing Coalition of the Greater Seacoast.  / Without enough affordable housing in southern New Hampshire towns,  / “employers are having a hard time attracting employees,  / and workers are having a hard time finding a place to live,”  / Taylor said.\n> \n> “在出租住房供给方面，我们已到了危机程度，” / 尼克·泰勒说， / 他是大海岸地区劳动力住房联盟的**[xxx]**主管。 / 新罕布什尔州南部的城镇没有足够的可负担住房， / “雇主很难吸引员工， / 工人也很难找到住处，” / 泰勒说。\n\n> 原文参考：\n> \n> However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local association of **[xxx]**. “A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,” Castle said, “and so it’s a **[xxx]** effect. ”\n> \n> 开始精读：\n> \n> However, short-term rentals also provide housing for tourists,  / pointed out Ryan Castle,  / CEO of a local association of **[xxx]**.  / “A lot of workers are servicing the tourist industry,  / and the tourism industry is serviced by those people coming in short term,”  / Castle said,  / “and so it’s a **[xxx]** effect. ”\n> \n> 然而，短期出租也为游客提供住房， / 瑞安·卡斯尔指出， / 他是当地一家**[xxx]**协会的首席执行官。 / “许多工人在为旅游业服务， / 而旅游业受到这些短期前来的人们的支持，” / 卡斯尔说， / “因此这是一种**[xxx]**效应。”\n\nCompared with Castle要求比较两人的关注点。Taylor说出租住房供给到了危机程度，并说明缺少可负担住房怎样影响雇主和工人；Castle用However转向短租为游客提供住房及其与旅游业的关系。空格要填由这组差别能推知Taylor更倾向支持的做法。\n\n接下来按A—D逐项看。","articleRects":[[276,813,1120,39],[202,862,1195,38],[203,910,1192,38],[202,957,1193,39],[202,1000,910,48],[274,1054,1122,38],[202,1101,1193,39],[203,1150,1192,38],[202,1197,1130,39]],"questionRects":[[226,951,896,37],[283,1014,563,30],[283,1077,538,38],[283,1141,624,37],[283,1204,660,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2,3],"qid":"28","initialReadingPids":[2,3]},"html":"<h2>28题</h2>\n<blockquote><p>Compared with Castle, Taylor is more likely to support ______.<br />\n与卡斯尔相比，泰勒更可能支持什么？</p>\n</blockquote>\n<p>题干直接给出Castle和Taylor。第3段引述Taylor，第4段引述Castle，先完整精读这两个自然段，把两人各自强调的住房问题读清。</p>\n<blockquote><p>原文参考：</p>\n<p>“We are at a crisis level on the supply of rental housing,” said Nick Taylor, <strong>[xxx]</strong> director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, “employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,” Taylor said.</p>\n<p>开始精读：</p>\n<p>“We are at a crisis level on the supply of rental housing,”  / said Nick Taylor,  / <strong>[xxx]</strong> director of the Workforce Housing Coalition of the Greater Seacoast.  / Without enough affordable housing in southern New Hampshire towns,  / “employers are having a hard time attracting employees,  / and workers are having a hard time finding a place to live,”  / Taylor said.</p>\n<p>“在出租住房供给方面，我们已到了危机程度，” / 尼克·泰勒说， / 他是大海岸地区劳动力住房联盟的<strong>[xxx]</strong>主管。 / 新罕布什尔州南部的城镇没有足够的可负担住房， / “雇主很难吸引员工， / 工人也很难找到住处，” / 泰勒说。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local association of <strong>[xxx]</strong>. “A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,” Castle said, “and so it’s a <strong>[xxx]</strong> effect. ”</p>\n<p>开始精读：</p>\n<p>However, short-term rentals also provide housing for tourists,  / pointed out Ryan Castle,  / CEO of a local association of <strong>[xxx]</strong>.  / “A lot of workers are servicing the tourist industry,  / and the tourism industry is serviced by those people coming in short term,”  / Castle said,  / “and so it’s a <strong>[xxx]</strong> effect. ”</p>\n<p>然而，短期出租也为游客提供住房， / 瑞安·卡斯尔指出， / 他是当地一家<strong>[xxx]</strong>协会的首席执行官。 / “许多工人在为旅游业服务， / 而旅游业受到这些短期前来的人们的支持，” / 卡斯尔说， / “因此这是一种<strong>[xxx]</strong>效应。”</p>\n</blockquote>\n<p>Compared with Castle要求比较两人的关注点。Taylor说出租住房供给到了危机程度，并说明缺少可负担住房怎样影响雇主和工人；Castle用However转向短租为游客提供住房及其与旅游业的关系。空格要填由这组差别能推知Taylor更倾向支持的做法。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"28题","raw":"### A. further investment in local tourism\n\n> 进一步投资当地旅游业。\n\n把A接回题干，它说的是：与卡斯尔相比，泰勒更可能支持进一步投资当地旅游业。\n\nA说增加旅游投资，分别看Taylor与Castle关心谁。\n\n> We are at a crisis level on the supply of rental housing\n\n> workers are having a hard time finding a place to live\n\n> short-term rentals also provide housing for tourists\n\n> A lot of workers are servicing the tourist industry\n\nTaylor强调租赁住房供应危机，工人找不到能负担的住处，雇主因此招人困难。Castle接着说短租为游客提供住房，旅游业又养活一些工人。\n\n强调旅游这一好处的是Castle。Taylor在这两段没有提出应向旅游业追加投资。\n\n**A的旅游方向更接近哪一位的话？**\n\n更接近Castle的关切，不能作为Taylor相比之下更可能支持的办法。\n\n**第一轮判断：A排除。**","articleRects":[[276,813,1120,39],[202,862,1195,38],[203,910,1192,38],[202,957,1193,39],[202,1000,910,48],[274,1054,1122,38],[202,1101,1193,39],[203,1150,1192,38],[202,1197,1130,39]],"questionRects":[[283,1014,563,30]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"28","paragraph le housing in southern New Hampshire towns</p>\n</blockquote>\n<blockquote><p>employers are having a hard time attracting employees, and workers are having a hard time finding a place to live</p>\n</blockquote>\n<blockquote><p>short-term rentals also provide housing for tourists</p>\n</blockquote>\n<p>没有足够可负担的住房，工人找住处困难，雇主招人也困难。Taylor把住房供应直接说成危机。</p>\n<p>Castle则提醒短租能服务游客和旅游业。两人的着重点不同，Taylor最直接要补的就是常住工人负担得起的住房。</p>\n<p><strong>增加可负担住房，是否能正面回应Taylor指出的两个困难？</strong></p>\n<p>能。工人有住处，企业也更容易吸引员工，B与他的关注一致。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"28题","raw":"### C. strict management of real estate agents\n\n> 严格管理房地产经纪人。\n\n把C接回题干，它说的是：与卡斯尔相比，泰勒更可能支持严格管理房地产经纪人。\n\nC说严管房产经纪人，回第3、4段看有没有把经纪人行为作为原因。\n\n> a crisis level on the supply of rental housing\n\n> workers are having a hard time finding a place to live\n\n> short-term rentals also provide housing for tourists\n\nTaylor指出住房供应不够、工人难找住处；Castle说明短租与旅游业的联系。两人都没有在这里描述经纪人怎样违规或造成问题。\n\nCastle的职位即使与房地产有关，也只是人物身份，不能让Taylor自动提出对这个职业群体的管理要求。\n\n**这两段有没有把房产经纪人的行为定为需要处理的问题？**\n\n没有。C提出了文中没有展开的管理对象。\n\n**第一轮判断：C排除。**","articleRects":[[276,813,1120,39],[202,862,1195,38],[203,910,1192,38],[202,957,1193,39],[202,1000,910,48],[274,1054,1122,38],[202,1101,1193,39],[203,1150,1192,38],[202,1197,1130,39]],"questionRects":[[283,1141,624,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"28","paragraphPids":[2,3]},"html":"<h3>C. strict management of real estate agents</h3>\n<blockquote><p>严格管理房地产经纪人。</p>\n</blockquote>\n<p>把C接回题干，它说的是：与卡斯尔相比，泰勒更可能支持严格管理房地产经纪人。</p>\n<p>C说严管房产经纪人，回第3、4段看有没有把经纪人行为作为原因。</p>\n<blockquote><p>a crisis level on the supply of rental housing</p>\n</blockquote>\n<blockquote><p>workers are having a hard time finding a place to live</p>\n</blockquote>\n<blockquote><p>short-term rentals also provide housing for tourists</p>\n</blockquote>\n<p>Taylor指出住房供应不够、工人难找住处；Castle说明短租与旅游业的联系。两人都没有在这里描述经纪人怎样违规或造成问题。</p>\n<p>Castle的职位即使与房地产有关，也只是人物身份，不能让Taylor自动提出对这个职业群体的管理要求。</p>\n<p 41,624,37],[283,1204,660,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"28"},"html":"<h3>28题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一遍留下B。Taylor将可负担住房不足与雇主、工人的困难相连，可以推知他支持增加这类住房；其余说法分别改成旅游投资、经纪人管理或短期工人的政策。</p>\n"},{"section":"29题","raw":"## 29题\n\n> What does Horn emphasize in Paragraph 5?  \n> 霍恩在第5段强调了什么？\n\n题干明确指定Horn和Paragraph 5。第5段整段都是对Horn观点的介绍与引述，先从短租本身并非关键读到她对开发商的提问。\n\n> 原文参考：\n> \n> Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. “I think individuals being able to rent out their second home is a good thing. If it’s their vacation home anyway , and it’s just empty, why can’t you make money off it?” Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental **[xxx]**—de facto hotels—to bypass taxes and regulations. “I think the question is, shouldn’t a developer who’s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?” Horn said.\n> \n> 开始精读：\n> \n> Short-term rentals themselves are not the crux of the issue,  / said Keren Horn,  / an expert on affordable housing policy.  / “I think individuals being able to rent out their second home is a good thing.  / If it’s their vacation home anyway ,  / and it’s just empty,  / why can’t you make money off it?”  / Horn said.  / Issues arise, however,  / when developers attempt to create large-scale short-term rental **[xxx]**—de facto hotels—to bypass taxes and regulations.  / “I think the question is,  / shouldn’t a developer who’s really building a hotel,  / but disguising it as not a hotel,  / be treated and taxed and regulated like a hotel?”  / Horn said.\n> \n> 短期出租本身并不是问题的关键， / 凯伦·霍恩说， / 她是一位可负担住房政策专家。 / “我认为个人能够出租自己的第二套住房是一件好事。 / 如果那本来就是他们的度假屋， / 而且只是空着， / 为什么不能靠它赚钱呢？” / 霍恩说。 / 然而，问题会出现， / 当开发商试图创建大规模的短租**[xxx]**，也就是事实上的旅馆，以绕过税收和监管时。 / “我认为问题在于， / 一个实际上在建旅馆的开发商， / 却把它伪装成不是旅馆， / 难道不应该像旅馆那样被对待、被征税和被监管吗？” / 霍恩说。\n\nemphasize问Horn在这一段着重提出什么。她先肯定个人出租第二套闲置住房，随后用however指出开发商开展大规模短租时产生的问题，最后提出应怎样对待这类开发商；各项需要与这一推进相对应。\n\n接下来按A—D逐项看。","articleRects":[[274,1246,1122,36],[202,1293,1194,39],[202,1338,1192,46],[202,1389,1193,39],[203,1438,1192,38],[202,1485,1193,39],[202,1534,1194,38],[202,1580,1167,40]],"questionRects":[[226,1331,713,38],[283,1395,805,37],[283,1458,813,37],[283,1521,831,38],[283,1585,814,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"29","initialReadingPids":[4]},"html":"<h2>29题</h2>\n<blockquote><p>What does Horn emphasize in Paragraph 5?<br />\n霍恩在第5段强调了什么？</p>\n</blockquote>\n<p>题干明确指定Horn和Paragraph 5。第5段整段都是对Horn观点的介绍与引述，先从短租本身并非关键读到她对开发商的提问。</p>\n<blockquote><p>原文参考：</p>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. “I think individuals being able to rent out their second home is a good thing. If it’s their vacation home anyway , and it’s just empty, why can’t you make money off it?” Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental <strong>[xxx]</strong>—de facto hotels—to bypass taxes and regulations. “I think the question is, shouldn’t a developer who’s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?” Horn said.</p>\n<p>开始精读：</p>\n<p>Short-term rentals themselves are not the crux of the issue,  / said Keren Horn,  / an expert on affordable housing policy.  / “I think individuals being able to rent out their second home is a good thing.  / If it’s their vacation home anyway ,  / and it’s just empty,  / why can’t you make money off it?”  / Horn said.  / Issues arise, however,  / when developers attempt to create large-scale short-term rental <strong>[xxx]</strong>—de facto hotels—to bypass taxes and regulations.  / “I think the question is,  / shouldn’t a developer who’s really building a hotel,  / but disguising it as not a hotel,  / be treated and taxed and regulated like a hotel?”  / Horn said.</p>\n<p>短期出租本身并不是问题的关键， / 凯伦·霍恩说， / 她是一位可负担住房政策专家。 / “我认为个人能够出租自己的第二套住房是一件好事。 / 如果那本来就是他们的度假屋， / 而且只是空着， / 为什么不能靠它赚钱呢？” / 霍恩说。 / 然而，问题会出现， / 当开发商试图创建大规模的短租<strong>[xxx]</strong>，也就是事实上的旅馆，以绕过税收和监管时。 / “我认为问题在于， / 一个实际上在建旅馆的开发商， / 却把它伪装成不是旅馆， / 难道不应该像旅馆那样被对待、被征税和被监管吗？” / 霍恩说。</p>\n</blockquote>\n<p>emphasize问Horn在这一段着重提出什么。她先肯定个人出租第二套闲置住房，随后用however指出开发商开展大规模短租时产生的问题，最后提出应怎样对待这类开发商；各项需要与这一推进相对应。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"29题","raw":"### A. The urgency to upgrade short-term rental facilities.\n\n> 升级短期出租设施的紧迫性。\n\n把A接回题干，它说的是：霍恩在第5段强调升级短期出租设施的紧迫性。\n\nA说升级设施紧迫，回第5段看Horn指出的问题是什么。\n\n> Issues arise, however, when developers attempt to create large-scale short-term rental **[xxx]**—de facto hotels—to bypass taxes and regulations.\n\n> be treated and taxed and regulated like a hotel\n\n她允许个人把空着的第二套房出租，转折后担心开发商建成事实上的酒店，却绕过酒店税收和管理。\n\n这里没有评价房间设备落后，也没有说必须赶快改善设施。要补的是该承担的税收和监管，不能换成装修升级。\n\n**Horn要求开发商改进硬件，还是按酒店接受管理？**\n\n是后者。A换成了设施问题。\n\n**第一轮判断：A排除。**","articleRects":[[274,1246,1122,36],[202,1293,1194,39],[202,1338,1192,46],[202,1389,1193,39],[203,1438,1192,38],[202,1485,1193,39],[202,1534,1194,38],[202,1580,1167,40]],"questionRects":[[283,1395,805,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>A. The urgency to upgrade short-term rental facilities.</h3>\n<blockquote><p>升级短期出租设施的紧迫性。</p>\n</blockquote>\n<p>把A接回题干，它说的是：霍恩在第5段强调升级短期出租设施的紧迫性。</p>\n<p>A说升级设施紧迫，回第5段看Horn指出的问题是什么。</p>\n<blockquote><p>Issues arise, however, when developers attempt to create large-scale short-term rental <strong>[xxx]</strong>—de facto hotels—to bypass taxes and regulations.</p>\n</blockquote>\n<blockquote><p>be treated and taxed and regulated like a hotel</p>\n</blockquote>\n<p>她允许个人把空着的第二套房出租，转折后担心开发商建成事实上的酒店，却绕过酒店税收和管理。</p>\n<p>这里没有评价房间设备落后，也没有说必须赶快改善设施。要补的是该承担的税收和监管，不能换成装修升级。</p>\n<p><strong>Horn要求开发商改进硬件，还是按酒店接受管理？</strong></p>\n<p>是后者。A换成了设施问题。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"29题","raw":"### B. The efficient operation of the local housing market.\n\n> 当地住房市场的高效运作。\n\n把B接回题干，它说的是：霍恩在第5段强调当地住房市场的高效运作。\n\nB说市场高效运作，回第5段把前面的认可与however后的问题一起看。\n\n> de facto hotels—to bypass taxes and regulations\n\n> a developer who’s really building a hotel, but disguising it as not a hotel\n\n> be treated and taxed and regulated like a hotel\n\n个人空着的度假屋可以出租赚钱，这确实能让闲置房屋被使用。但Horn随后明确区分这种个人出租与开发商大规模经营。\n\n她提出的问题是后者已相当于酒店，却用别的名义避税和规避监管。只说市场高效运作，没有接住这段最后要解决的具体问题。\n\n**Horn最后追问的，是如何提高市场效率吗？**\n\n不是。她追问的是事实上的酒店为什么不按酒店纳税、受监管，B没有概括这一重点。\n\n**第一轮判断：B排除。**","articleRects":[[274,1246,1122,36],[202,1293,1194,39],[202,1338,1192,46],[202,1389,1193,39],[203,1438,1192,38],[202,1485,1193,39],[202,1534,1194,38],[202,1580,1167,40]],"questionRects":[[283,1458,813,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>B. The efficient operation of the local housing market.</h3>\n<blockquote><p>当地住房市场的高效运作。</p>\n</blockquote>\n<p>把B接回题干，它说的是：霍恩在第5段强调当地住房市场的高效运作。</p>\n<p>B说市场高效运作，回第5段把前面的认可与however后的问题一起看。</p>\n<blockquote><p>de facto hotels—to bypass taxes and regulations</p>\n</blockquote>\n<blockquote><p>a developer who’s really building a hotel, but disguising it as not a hotel</p>\n</blockquote>\n<blockquote><p>be treated and taxed and regulated like a hotel</p>\n</blockquote>\n<p>个人空着的度假屋可以出租赚钱，这确实能让闲置房屋被使用。但Horn随后明确区分这种个人出租与开发商大规模经营。</p>\n<p>她提出的问题是后者已相当于酒店，却用别的名义避税和规避监管。只说市场高效运作，没有接住这段最后要解决的具体问题。</p>\n<p><strong>Horn最后追问的，是如何提高市场效率吗？</strong></p>\n<p>不是。她追问的是事实上的酒店为什么不按酒店纳税、受监管，B没有概括这一重点。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"29题","raw":"### C. The necessity to stop developers from evading taxes.\n\n> 阻止开发商逃避纳税的必要性。\n\n把C接回题干，它说的是：霍恩在第5段强调有必要阻止开发商逃避纳税。\n\nC说阻止开发商逃税，回第5段看bypass taxes及最后的反问。\n\n> developers attempt to create large-scale short-term rental **[xxx]**—de facto hotels—to bypass taxes and regulations\n\n> shouldn’t a developer who’s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?\n\n开发商把大规模短租做成事实上的酒店，却把它伪装成不是酒店，绕开税收和规定。Horn反问，这种开发商难道不该像酒店一样被征税和管理吗？\n\n反问要求的正是让相同经营承担相应义务，而不是借名字不同逃开。\n\n**按酒店征税，是否就是不让开发商借短租名义避税？**\n\n是。C对应了Horn明确指出的问题和要求，可以保留。\n\n**第一轮判断：C保留。**","articleRects":[[274,1246,1122,36],[202,1293,1194,39],[202,1338,1192,46],[202,1389,1193,39],[203,1438,1192,38],[202,1485,1193,39],[202,1534,1194,38],[202,1580,1167,40]],"questionRects":[[283,1521,831,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"29","paragraphPids":[4]},"html":"<h3>C. The necessity to stop developers from evading taxes.</h3>\n<blockquote><p>阻止开发商逃避纳税的必要性。</p>\n</blockquote>\n<p>把C接回题干，它说的是：霍恩在第5段强调有必要阻止开发商逃避纳税。</p>\n<p>C说阻止开发商逃税，回第5段看bypass taxes及最后的反问。</p>\n<blockquote><p>developers attempt to create large-scale short-term rental <strong>[xxx]</strong>—de facto hotels—to bypass taxes and regulations</p>\n</blockquote>\n<blockquote><p>shouldn’t a developer who’s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?</p>\n</blockquote>\n<p>开发商把大规模短租做成事实上的酒店，却把它伪装成不是酒店，绕开税收和规定。Horn反问，这种开发商难道不该像酒店一样被征税和管理吗？</p>\n<p>反问要求的正是让相同经营承担相应义务，而不是借名字不同逃开。</p>\n<p><strong>按酒店征税，是否就是不让开发商借短租名义避税？</strong></p>\n<p>是。C对应了Horn明确指出的问题和要求，可以保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"29题","raw":"### D. The proper procedures for renting out spare houses.\n\n> 出租闲置房屋的适当程序。\n\n把D接回题干，它说的是：霍恩在第5段强调出租闲置房屋的适当程序。\n\nD说闲置房出租程序，回第5段看个人第二套房的例子起什么作用。\n\n> individuals being able to rent out their second home is a good thing\n\n> and it’s just empty, why can’t you make money off it?\n\n> Issues arise, however, when developers attempt to create large-scale short-term rental **[xxx]**—de facto hotels—to bypass taxes and regulations.\n\nHorn说如果度假屋本来就空着，个人出租赚钱没有问题。这是在先划出她认为可以接受的情况。\n\n她没有接着列个人出租要办理哪些手续，而是转到开发商建事实酒店却逃税的问题。\n\n**她是在讲个人出租的办理步骤吗？**\n\n不是。D停在前面的个人出租例子上，又添出了原文没有介绍的程序。\n\n**第一轮判断：D排除。**","articleRects":[[274,1246,1122,36],[202,1293,1194,39],[202,1338,1192,46],[202,1389,1193,39],[203,1438,1192,38],[202,1485,1193,39],[202,1534,1194,38],[202,1580,1167,40]],"questionRects":[[283,1585,814,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>D. The proper procedures for renting out spare houses.</h3>\n<blockquote><p>出租闲置房屋的适当程序。</p>\n</blockquote>\n<p>把D接回题干，它说的是：霍恩在第5段强调出租闲置房屋的适当程序。</p>\n<p>D说闲置房出租程序，回第5段看个人第二套房的例子起什么作用。</p>\n<blockquote><p>individuals being able to rent out their second home is a good thing</p>\n</blockquote>\n<blockquote><p>and it’s just empty, why can’t you make money off it?</p>\n</blockquote>\n<blockquote><p>Issues arise, however, when developers attempt to create large-scale short-term rental <strong>[xxx]</strong>—de facto hotels—to bypass taxes and regulations.</p>\n</blockquote>\n<p>Horn说如果度假屋本来就空着，个人出租赚钱没有问题。这是在先划出她认为可以接受的情况。</p>\n<p>她没有接着列个人出租要办理哪些手续，而是转到开发商建事实酒店却逃税的问题。</p>\n<p><strong>她是在讲个人出租的办理步骤吗？</strong></p>\n<p>不是。D停在前面的个人出租例子上，又添出了原文没有介绍的程序。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"29题","raw":"### 29题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一遍留下C。Horn把开发商规避税收监管列为问题，并要求按旅馆征税和监管，能够支持阻止其避税的必要性；设施升级、市场效率和个人出租程序都改换了她提出的具体内容。","articleRects":[],"questionRects":[[226,1331,713,38],[283,1395,805,37],[283,1458,813,37],[283,1521,831,38],[283,1585,814,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"29"},"html":"<h3>29题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍留下C。Horn把开发商规避税收监管列为问题，并要求按旅馆征税和监管，能够支持阻止其避税的必要性；设施升级、市场效率和个人出租程序都改换了她提出的具体内容。</p>\n"},{"section":"30题","raw":"## 30题\n\n> Horn holds that imposing registration requirements is ______.  \n> 霍恩认为，施加登记要求是怎样的？\n\n题干的Horn和registration requirements直接对应第7段开头的Horn said similar registration requirements。similar表示与前面类似，需要连读第6段所列的登记做法，因此把第6、7段完整读完。\n\n> 原文参考：\n> \n> At the end of 2018, Governor Charlie Baker of Massachusetts signed a bill to **[xxx]** in those potential investor-buyers. The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state **[xxx]**. Boston took things even further, requiring renters to register with the city’s Inspectional Services Department.\n> \n> 开始精读：\n> \n> At the end of 2018,  / Governor Charlie Baker of Massachusetts signed a bill to **[xxx]** in those potential investor-buyers.  / The bill requires every rental host to register with the state,  / mandates they carry insurance,  / and opens the potential for local taxes  / on top of a new state **[xxx]**.  / Boston took things even further,  / requiring renters to register with the city’s Inspectional Services Department.\n> \n> 在2018年底， / 马萨诸塞州州长查理·贝克签署了一项法案，以便对那些潜在的投资买家作出**[xxx]**。 / 这项法案要求每位出租者向州政府登记， / 规定他们必须购买保险， / 并允许可能征收地方税， / 在新的州**[xxx]**之外再加上这些税。 / 波士顿更进了一步， / 要求出租者向该市的检查服务部门登记。\n\n> 原文参考：\n> \n> Horn said similar registration requirements could benefit **[xxx]** cities and towns, but “if we want to make a change in the housing market, the main one is we have to build a lot more. ”\n> \n> 开始精读：\n> \n> Horn said similar registration requirements  / could benefit **[xxx]** cities and towns,  / but “if we want to make a change in the housing market,  / the main one is  / we have to build a lot more. ”\n> \n> 霍恩说，类似的登记要求 / 可能使**[xxx]**的城市和城镇受益， / 但“如果我们想改变住房市场， / 最主要的一点是， / 我们必须多建许多住房。”\n\nimposing registration requirements问Horn怎样评价登记要求。第6段列举州和波士顿的做法，第7段先说类似要求could benefit一些城镇，再用but转向改变住房市场最主要要做的事；要把这一让步和转折一并读入她的态度。\n\n接下来按A—D逐项看。","articleRects":[[274,1626,1121,46],[202,1678,1194,38],[202,1726,1193,38],[202,1774,1188,38],[202,1822,1146,38],[274,1870,1121,38],[203,1917,1193,39],[202,1964,556,32]],"questionRects":[[226,1712,850,37],[283,1775,360,30],[283,1838,376,38],[283,1902,400,37],[283,1965,379,38],[581,2079,482,55]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5,6],"qid":"30","initialReadingPids":[5,6]},"html":"<h2>30题</h2>\n<blockquote><p>Horn holds that imposing registration requirements is ______.<br />\n霍恩认为，施加登记要求是怎样的？</p>\n</blockquote>\n<p>题干的Horn和registration requirements直接对应第7段开头的Horn said similar registration requirements。similar表示与前面类似，需要连读第6段所列的登记做法，因此把第6、7段完整读完。</p>\n<blockquote><p>原文参考：</p>\n<p>At the end of 2018, Governor Charlie Baker of Massachusetts signed a bill to <strong>[xxx]</strong> in those potential investor-buyers. The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state <strong>[xxx]</strong>. Boston took things even further, requiring renters to register with the city’s Inspectional Services Department.</p>\n<p>开始精读：</p>\n<p>At the end of 2018,  / Governor Charlie Baker of Massachusetts signed a bill to <strong>[xxx]</strong> in those potential investor-buyers.  / The bill requires every rental host to register with the state,  / mandates they carry insurance,  / and opens the potential for local taxes  / on top of a new state <strong>[xxx]</strong>.  / Boston took things even further,  / requiring renters to register with the city’s Inspectional Services Department.</p>\n<p>在2018年底， / 马萨诸塞州州长查理·贝克签署了一项法案，以便对那些潜在的投资买家作出<strong>[xxx]</strong>。 / 这项法案要求每位出租者向州政府登记， / 规定他们必须购买保险， / 并允许可能征收地方税， / 在新的州<strong>[xxx]</strong>之外再加上这些税。 / 波士顿更进了一步， / 要求出租者向该市的检查服务部门登记。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Horn said similar registration requirements could benefit <strong>[xxx]</strong> cities and towns, but “if we want to make a change in the housing market, the main one is we have to build a lot more. ”</p>\n<p>开始精读：</p>\n<p>Horn said similar registration requirements  / could benefit <strong>[xxx]</strong> cities and towns,  / but “if we want to make a change in the housing market,  / the main one is  / we have to build a lot more. ”</p>\n<p>霍恩说，类似的登记要求 / 可能使<strong>[xxx]</strong>的城市和城镇受益， / 但“如果我们想改变住房市场， / 最主要的一点是， / 我们必须多建许多住房。”</p>\n</blockquote>\n<p>imposing registration requirements问Horn怎样评价登记要求。第6段列举州和波士顿的做法，第7段先说类似要求could benefit一些城镇，再用but转向改变住房市场最主要要做的事；要把这一让步和转折一并读入她的态度。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"30题","raw":"### A. an irrational decision\n\n> 一项不理性的决定。\n\n把A接回题干，它说的是：霍恩认为施加登记要求是一项不理性的决定。\n\nA说不理性，回末段先看could benefit。\n\n> similar registration requirements could benefit **[xxx]** cities and towns\n\n> the main one is we have to build a lot more\n\nHorn先承认类似登记要求可以使城市和城镇受益，随后才说真正改变住房市场，主要还得多建住房。\n\n后一项更重要，不会使前一项自动变成不理性的决定。她承认登记有用，只说它不够。\n\n**一个能带来好处、但还需别的措施配合的要求，就是不理性的吗？**\n\n不是。A把效果有限改成了决定本身不合理。\n\n**第一轮判断：A排除。**","articleRects":[[274,1870,1121,38],[203,1917,1193,39],[202,1964,556,32]],"questionRects":[[283,1775,360,30]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"30","paragraphPids":[6]},"html":"<h3>A. an irrational decision</h3>\n<blockquote><p>一项不理性的决定。</p>\n</blockquote>\n<p>把A接回题干，它说的是：霍恩认为施加登记要求是一项不理性的决定。</p>\n<p>A说不理性，回末段先看could benefit。</p>\n<blockquote><p>similar registration requirements could benefit <strong>[xxx]</strong> cities and towns</p>\n</blockquote>\n<blockquote><p>the main one is we have to build a lot more</p>\n</blockquote>\n<p>Horn先承认类似登记要求可以使城市和城镇受益，随后才说真正改变住房市场，主要还得多建住房。</p>\n<p>后一项更重要，不会使前一项自动变成不理性的决定。她承认登记有用，只说它不够。</p>\n<p><strong>一个能带来好处、但还需别的措施配合的要求，就是不理性的吗？</strong></p>\n<p>不是。A把效果有限改成了决定本身不合理。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"30题","raw":"### B. an unfeasible proposal\n\n> 一项不可行的提议。\n\n把B接回题干，它说的是：霍恩认为施加登记要求是一项不可行的提议。\n\nB说不可行，回末段与前段登记措施一起看。\n\n> The bill requires every rental host to register with the state\n\n> requiring renters to register with the city’s Inspectional Services Department\n\n> similar registration requirements could benefit **[xxx]** cities and towns\n\n前一段已经介绍州和波士顿提出的登记要求，Horn也说类似要求可以带来好处。末段没有指出登记无法操作或无法执行。\n\n她提出多建住房，是说登记解决不了全部供给问题，不是说登记做不成。\n\n**缺少增加房源这一步，与登记无法实行是一回事吗？**\n\n不是。B把解决得不够改成了无法执行。\n\n**第一轮判断：B排除。**","articleRects":[[274,1626,1121,46],[202,1678,1194,38],[202,1726,1193,38],[202,1774,1188,38],[202,1822,1146,38],[274,1870,1121,38],[203,1917,1193,39],[202,1964,556,32]],"questionRects":[[283,1838,376,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"30","paragraphPids":[5,6]},"html":"<h3>B. an unfeasible proposal</h3>\n<blockquote><p>一项不可行的提议。</p>\n</blockquote>\n<p>把B接回题干，它说的是：霍恩认为施加登记要求是一项不可行的提议。</p>\n<p>B说不可行，回末段与前段登记措施一起看。</p>\n<blockquote><p>The bill requires every rental host to register with the state</p>\n</blockquote>\n<blockquote><p>requiring renters to register with the city’s Inspectional Services Department</p>\n</blockquote>\n<blockquote><p>similar registration requirements could benefit <strong>[xxx]</strong> cities and towns</p>\n</blockquote>\n<p>前一段已经介绍州和波士顿提出的登记要求，Horn也说类似要求可以带来好处。末段没有指出登记无法操作或无法执行。</p>\n<p>她提出多建住房，是说登记解决不了全部供给问题，不是说登记做不成。</p>\n<p><strong>缺少增加房源这一步，与登记无法实行是一回事吗？</strong></p>\n<p>不是。B把解决得不够改成了无法执行。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"30题","raw":"### C. an unnecessary measure\n\n> 一项没有必要的措施。\n\n把C接回题干，它说的是：霍恩认为施加登记要求是一项没有必要的措施。\n\nC说没有必要，回末段看benefit之后为什么又说but。\n\n> similar registration requirements could benefit **[xxx]** cities and towns\n\n> if we want to make a change in the housing market, the main one is we have to build a lot more\n\n登记有益，这是Horn先认可的部分。but补充的是要改变市场，还得增加大量住房，说明只登记不够。\n\n一项措施不能独自解决问题，不等于它的好处不存在，也不等于完全不需要这项措施。\n\n**她在说不必登记，还是登记之外还要多建房？**\n\n是登记之外还要多建房。C把需要补充措施改成了登记没必要。\n\n**第一轮判断：C排除。**","articleRects":[[274,1870,1121,38],[203,1917,1193,39],[202,1964,556,32]],"questionRects":[[283,1902,400,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"30","paragraphPids":[6]},"html":"<h3>C. an unnecessary measure</h3>\n<blockquote><p>一项没有必要的措施。</p>\n</blockquote>\n<p>把C接回题干，它说的是：霍恩认为施加登记要求是一项没有必要的措施。</p>\n<p>C说没有必要，回末段看benefit之后为什么又说but。</p>\n<blockquote><p>similar registration requirements could benefit <strong>[xxx]</strong> cities and towns</p>\n</blockquote>\n<blockquote><p>if we want to make a change in the housing market, the main one is we have to build a lot more</p>\n</blockquote>\n<p>登记有益，这是Horn先认可的部分。but补充的是要改变市场，还得增加大量住房，说明只登记不够。</p>\n<p>一项措施不能独自解决问题，不等于它的好处不存在，也不等于完全不需要这项措施。</p>\n<p><strong>她在说不必登记，还是登记之外还要多建房？</strong></p>\n<p>是登记之外还要多建房。C把需要补充措施改成了登记没必要。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"30题","raw":"### D. an inadequate solution\n\n> 一种不充分的解决办法。\n\n把D接回题干，它说的是：霍恩认为施加登记要求是一种不充分的解决办法。\n\nD说办法不充分，回末段把could benefit与have to build a lot more合起来。\n\n> similar registration requirements could benefit **[xxx]** cities and towns\n\n> but “if we want to make a change in the housing market, the main one is we have to build a lot more.\n\n登记可以带来好处，但住房市场还缺房，Horn把多建住房作为主要改变。登记能规范出租者，却不会仅凭登记就新增大量房源。\n\n所以前半句的肯定和后半句的补充并不冲突：这项办法有用，但单靠它还不足。\n\n**有益却仍必须大量增建住房，是否对应inadequate solution？**\n\n对应。D保留了“有用但不够”的完整态度，可以保留。\n\n**第一轮判断：D保留。**","articleRects":[[274,1870,1121,38],[203,1917,1193,39],[202,1964,556,32]],"questionRects":[[283,1965,379,38],[581,2079,482,55]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"30","paragraphPids":[6]},"html":"<h3>D. an inadequate solution</h3>\n<blockquote><p>一种不充分的解决办法。</p>\n</blockquote>\n<p>把D接回题干，它说的是：霍恩认为施加登记要求是一种不充分的解决办法。</p>\n<p>D说办法不充分，回末段把could benefit与have to build a lot more合起来。</p>\n<blockquote><p>similar registration requirements could benefit <strong>[xxx]</strong> cities and towns</p>\n</blockquote>\n<blockquote><p>but “if we want to make a change in the housing market, the main one is we have to build a lot more.</p>\n</blockquote>\n<p>登记可以带来好处，但住房市场还缺房，Horn把多建住房作为主要改变。登记能规范出租者，却不会仅凭登记就新增大量房源。</p>\n<p>所以前半句的肯定和后半句的补充并不冲突：这项办法有用，但单靠它还不足。</p>\n<p><strong>有益却仍必须大量增建住房，是否对应inadequate solution？</strong></p>\n<p>对应。D保留了“有用但不够”的完整态度，可以保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"30题","raw":"### 30题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。Horn承认登记可能有益，但认为改变住房市场最主要必须多建房，因此登记仍是不充分的办法；她没有将它评价为不理性、不可行或没有必要。","articleRects":[],"questionRects":[[226,1712,850,37],[283,1775,360,30],[283,1838,376,38],[283,1902,400,37],[283,1965,379,38],[581,2079,482,55]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"30"},"html":"<h3>30题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。Horn承认登记可能有益，但认为改变住房市场最主要必须多建房，因此登记仍是不充分的办法；她没有将它评价为不理性、不可行或没有必要。</p>\n"},{"section":"全文梳理","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | attempting to regulate short-term rentals；historically low inventory | 以“attempting to regulate short-term rentals”交代新英格兰各社区长期尝试监管短租，再用“record-high home prices”和“historically low inventory”说明当下为何更紧迫。开发商大面积购房的担忧随之出现，为下文的住房供应问题和监管争议提供背景。 | 交代长期监管问题与当前住房紧张的背景。 |\n| 第2段 | has dropped below 1 percent；voted against a bill | 用“has dropped below 1 percent”具体说明新罕布什尔州的租房空置率已很低，住房倡导者因而担心不受约束的短租继续增加市场压力。“voted against a bill”则把问题推进到一项被否决的法案：它原本要禁止城镇制定限制短租的**[xxx]**，使第1段的监管问题落到地方行动能否受到限制上。 | 用空置率说明供应压力，并将监管问题落实到地方权限的争议。 |\n| 第3段 | a crisis level；Without enough affordable housing | 的“a crisis level”把出租住房供给的困难说得更明确；“Without enough affordable housing”引出雇主招不到人、工人难找住处的后果。这一段说明第2段所说的市场压力为什么会成为与工作和生活直接相关的问题。 | 说明供应不足怎样影响雇主招聘与工人居住。 |\n| 第4段 | provide housing for tourists；workers are servicing the tourist industry | 用“provide housing for tourists”补充短租的另一种用途，并指出“workers are servicing the tourist industry”。相对第3段强调工人的居住困难，这段提醒人们短期游客与旅游业、就业也有联系，使讨论需要同时顾及短租带来的住宿用途。 | 补充游客住宿与旅游就业的联系，让讨论兼顾短租的用途。 |\n| 第5段 | not the crux of the issue；taxed and regulated like a hotel | 以“not the crux of the issue”说明短租本身不是关键，先肯定个人把闲置的第二套房出租，再把问题落在开发商将大规模短租做成事实旅馆以“bypass taxes and regulations”。结尾“taxed and regulated like a hotel”提出具体要求：实际经营旅馆者应受到相应征税和监管。这承接前面两种需求，把讨论集中到何种经营行为应受到怎样的对待。 | 区分个人闲房出租与规模化旅馆经营，将监管要求落到具体行为。 |\n| 第6段 | register with the state | 的“register with the state”以及保险要求、地方税的可能安排，展示马萨诸塞州已有的具体做法；波士顿又要求向市部门登记。这一段承接第5段对开发商征税和监管的要求，给出实际管理措施，并为末段评价登记要求提供对象。 | 介绍已有的登记、保险与税收安排，承接前段的监管要求。 |\n| 第7段 | could benefit；we have to build a lot more | 先用“could benefit”肯定类似登记要求可能使**[xxx]**的城市和城镇受益，再用“we have to build a lot more”强调要改变住房市场，主要必须增加建房。它保留前一段措施的作用，同时把解决住房问题的主要任务落回前文反复提出的供应不足。 | 承认登记措施的作用，同时把解决住房市场问题的主要任务落到增加供给。 |\n\n全文观点：住房供应紧张使短租监管更为紧迫。讨论既承认个人出租和游客住宿的用途，也要求对实为旅馆的开发经营落实相应征税与监管；登记措施可能有益，但要改变住房市场，主要仍须增加住房供应。","articleRects":[[274,287,1122,37],[203,334,1192,37],[202,382,1194,38],[202,430,1193,38],[202,478,1193,38],[202,526,207,31],[274,574,1121,38],[204,622,1193,38],[202,670,1194,38],[202,718,1194,38],[202,766,430,38],[276,813,1120,39],[202,862,1195,38],[203,910,1192,38],[202,957,1193,39],[202,1000,910,48],[274,1054,1122,38],[202,1101,1193,39],[203,1150,1192,38],[202,1197,1130,39],[274,1246,1122,36],[202,1293,1194,39],[202,1338,1192,46],[202,1389,1193,39],[203,1438,1192,38],[202,1485,1193,39],[202,1534,1194,38],[202,1580,1167,40],[274,1626,1121,46],[202,1678,1194,38],[202,1726,1193,38],[202,1774,1188,38],[202,1822,1146,38],[274,1870,1121,38],[203,1917,1193,39],[202,1964,556,32]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_argument","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>attempting to regulate short-term rentals；historically low inventory</td><td>以“attempting to regulate short-term rentals”交代新英格兰各社区长期尝试监管短租，再用“record-high home prices”和“historically low inventory”说明当下为何更紧迫。开发商大面积购房的担忧随之出现，为下文的住房供应问题和监管争议提供背景。</td><td>交代长期监管问题与当前住房紧张的背景。</td></tr><tr><td>第2段</td><td>has dropped below 1 percent；voted against a bill</td><td>用“has dropped below 1 percent”具体说明新罕布什尔州的租房空置率已很低，住房倡导者因而担心不受约束的短租继续增加市场压力。“voted against a bill”则把问题推进到一项被否决的法案：它原本要禁止城镇制定限制短租的<strong>[xxx]</strong>，使第1段的监管问题落到地方行动能否受到限制上。</td><td>用空置率说明供应压力，并将监管问题落实到地方权限的争议。</td></tr><tr><td>第3段</td><td>a crisis level；Without enough affordable housing</td><td>的“a crisis level”把出租住房供给的困难说得更明确；“Without enough affordable housing”引出雇主招不到人、工人难找住处的后果。这一段说明第2段所说的市场压力为什么会成为与工作和生活直接相关的问题。</td><td>说明供应不足怎样影响雇主招聘与工人居住。</td></tr><tr><td>第4段</td><td>provide housing for tourists；workers are servicing the tourist industry</td><td>用“provide housing for tourists”补充短租的另一种用途，并指出“workers are servicing the tourist industry”。相对第3段强调工人的居住困难，这段提醒人们短期游客与旅游业、就业也有联系，使讨论需要同时顾及短租带来的住宿用途。</td><td>补充游客住宿与旅游就业的联系，让讨论兼顾短租的用途。</td></tr><tr><td>第5段</td><td>not the crux of the issue；taxed and regulated like a hotel</td><td>以“not the crux of the issue”说明短租本身不是关键，先肯定个人把闲置的第二套房出租，再把问题落在开发商将大规模短租做成事实旅馆以“bypass taxes and regulations”。结尾“taxed and regulated like a hotel”提出具体要求：实际经营旅馆者应受到相应征税和监管。这承接前面两种需求，把讨论集中到何种经营行为应受到怎样的对待。</td><td>区分个人闲房出租与规模化旅馆经营，将监管要求落到具体行为。</td></tr><tr><td>第6段</td><td>register with the state</td><td>的“register with the state”以及保险要求、地方税的可能安排，展示马萨诸塞州已有的具体做法；波士顿又要求向市部门登记。这一段承接第5段对开发商征税和监管的要求，给出实际管理措施，并为末段评价登记要求提供对象。</td><td>介绍已有的登记、保险与税收安排，承接前段的监管要求。</td></tr><tr><td>第7段</td><td>could benefit；we have to build a lot more</td><td>先用“could benefit”肯定类似登记要求可能使<strong>[xxx]</strong>的城市和城镇受益，再用“we have to build a lot more”强调要改变住房市场，主要必须增加建房。它保留前一段措施的作用，同时把解决住房问题的主要任务落回前文反复提出的供应不足。</td><td>承认登记措施的作用，同时把解决住房市场问题的主要任务落到增加供给。</td></tr></tbody></table>\n<p>全文观点：住房供应紧张使短租监管更为紧迫。讨论既承认个人出租和游客住宿的用途，也要求对实为旅馆的开发经营落实相应征税与监管；登记措施可能有益，但要改变住房市场，主要仍须增加住房供应。</p>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**26. A**\n\n**27. D**\n\n**28. B**\n\n**29. C**\n\n**30. D**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>26. A</strong></p>\n<p><strong>27. D</strong></p>\n<p><strong>28. B</strong></p>\n<p><strong>29. C</strong></p>\n<p><strong>30. D</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRhArBABXRUJQVlA4TAQrBAAvV0Y1AlUTI7dtI8n5/69jtPYs94iYAH51km6SFLLSwjvQDEji0N3KZiwRfGQ30vhIn0IWH2niH/ZOfMS/gkKcHZo5I6u1dUfjqdrQjfZ/9aXg7u7u7u7u7u7u7jDu7u7u7u7u7u7uDuf3
