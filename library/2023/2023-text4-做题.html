<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 36题题干\n\n**According to Paragraph 1, the careers of scientists can be determined by  ______.**\n\n> 根据第1段，科学家的职业生涯可能由什么决定？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,190,1196,38],[288,251,167,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"36"},"html":"<h2>36题题干</h2>\n<p><strong>According to Paragraph 1, the careers of scientists can be determined by  ______.</strong></p>\n<blockquote><p>根据第1段，科学家的职业生涯可能由什么决定？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 37题题干\n\n**The support service consultancies tend to  ______.**\n\n> 支持服务咨询机构往往会做什么？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,618,672,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"37"},"html":"<h2>37题题干</h2>\n<p><strong>The support service consultancies tend to  ______.</strong></p>\n<blockquote><p>支持服务咨询机构往往会做什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 38题题干\n\n**The function of the “milk cow” journals is to  ______.**\n\n> “奶牛”期刊的作用是什么？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,984,749,40]],"scrollTarget":"question","meta":{"kind":"stem","qid":"38"},"html":"<h2>38题题干</h2>\n<p><strong>The function of the “milk cow” journals is to  ______.</strong></p>\n<blockquote><p>“奶牛”期刊的作用是什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 39题题干\n\n**What can be learned about Scopus from the last two paragraphs?**\n\n> 从最后两段可以了解到斯科普斯的什么情况？\n\n题型：**细节推断题**。","articleRects":[],"questionRects":[[226,1353,1029,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"39"},"html":"<h2>39题题干</h2>\n<p><strong>What can be learned about Scopus from the last two paragraphs?</strong></p>\n<blockquote><p>从最后两段可以了解到斯科普斯的什么情况？</p>\n</blockquote>\n<p>题型：<strong>细节推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 40题题干\n\n**What should an author do to deal with citation manipulators?**\n\n> 作者应该怎样应对引用操纵者？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[225,1720,975,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"40"},"html":"<h2>40题题干</h2>\n<p><strong>What should an author do to deal with citation manipulators?</strong></p>\n<blockquote><p>作者应该怎样应对引用操纵者？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but, including, In fact |\n| 态度词／评价词 | 先抓个大概好坏 | suspicious, inappropriate, rampant |\n| 动作词 | 先看谁做了什么 | publish, cite, detect |\n| 结果词 | 看最后出了什么事 | citations, quality, reputation |\n| 重复主题词 | 大概知道老在说什么 | journals, citations, papers |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>but, including, In fact</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>suspicious, inappropriate, rampant</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>publish, cite, detect</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>citations, quality, reputation</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>journals, citations, papers</td></tr></tbody></table>\n"},{"section":"读文章","raw":"Scientific papers are the **[xxx]** of progress in research. Each year researchers publish millions of papers in more than 30, 000 journals. The scientific community measures the quality of those papers in a number of ways, including the **[xxx]** quality of the journal (as reflected by the title’s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.","articleRects":[[274,281,1123,37],[202,326,1193,38],[203,372,1187,38],[202,417,1194,38],[202,463,1196,38],[203,508,1193,38],[202,554,1194,38],[202,600,240,37]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>Scientific papers are the <strong>[xxx]</strong> of progress in research. Each year researchers publish millions of papers in more than 30, 000 journals. The scientific community measures the quality of those papers in a number of ways, including the <strong>[xxx]</strong> quality of the journal (as reflected by the title’s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n</div></div>"},{"section":"读文章","raw":"Scientific papers are the **[xxx]** of progress in research. / Each year researchers publish millions of papers in more than 30, 000 journals. / The scientific community measures the quality of those papers in a number of ways, / including the **[xxx]** quality of the 立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，遇到这种情况，可再结合全文检查。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技 ear researchers publish millions of papers in more than 30, 000 journals. / The scientific community measures the quality of those papers in a number of ways, / including the **[xxx]** quality of the journal (as reflected by the title’s impact factor) / and the number of citations a specific paper accumulates. / The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, / but even more so on the citations attracted by these papers.\n> \n> 科学论文是研究进步的**[xxx]**。 / 每年，研究者在超过30, 000种期刊上发表数百万篇论文。 / 科学界用多种方式衡量这些论文的质量， / 包括期刊的**[xxx]**质量（由该期刊的影响因子反映出来） / 以及某篇论文积累的被引用次数。 / 科学家的职业生涯及其所在机构的声誉，取决于他们产出论文的数量和声望， / 但更取决于这些论文获得的引用。\n\n本题问the careers of scientists can be determined by什么。第1段先介绍论文及质量衡量方式，末句用depend on说明科学家的职业生涯取决于哪些因素；空格要补的是这一依赖关系中的因素。\n\n接下来按A—D逐项看。","articleRects":[[274,281,1123,37],[202,326,1193,38],[203,372,1187,38],[202,417,1194,38],[202,463,1196,38],[203,508,1193,38],[202,554,1194,38],[202,600,240,37]],"questionRects":[[226,190,1196,38],[288,251,167,38],[289,312,633,38],[288,373,617,38],[289,435,662,38],[288,496,635,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"36","initialReadingPids":[0]},"html":"<h2>36题</h2>\n<blockquote><p>According to Paragraph 1, the careers of scientists can be determined by  ______.<br />\n根据第1段，科学家的职业生涯可能由什么决定？</p>\n</blockquote>\n<p>题干明确给出Paragraph 1，并点出the careers of scientists。直接进入第1段，从科学论文的作用读到段末科学家的职业生涯与论文之间的关系。</p>\n<blockquote><p>原文参考：</p>\n<p>Scientific papers are the <strong>[xxx]</strong> of progress in research. Each year researchers publish millions of papers in more than 30, 000 journals. The scientific community measures the quality of those papers in a number of ways, including the <strong>[xxx]</strong> quality of the journal (as reflected by the title’s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and 排除。</strong></p>\n"},{"section":"40题","raw":"### C. Seek professional advice.\n\n> 寻求专业建议。\n\n把C接回题干，它说的是：作者应该寻求专业建议来应对引用操纵者。\n\nC说求专业建议，回末句看editor、reviewer和support service处在什么位置。\n\n> when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.\n\n这些人或机构在句中可能正是提出不当引用要求的一方。作者收到要求后应拒绝，再报告给期刊。\n\n不能因为他们具备专业身份，就把这一句读成应当向专业人士求助或咨询。原文并没有安排另找人出主意。\n\n**句中这些专业人员是作者要去咨询的人，还是可能提出不当要求的人？**\n\n是后者。C没有对应拒绝并举报的具体建议。\n\n**第一轮判断：C排除。**","articleRects":[[275,1783,1120,38],[202,1829,1195,37],[203,1874,1193,37],[202,1920,1194,37],[202,1965,698,38]],"questionRects":[[283,1904,419,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"40","paragraphPids":[4]},"html":"<h3>C. Seek professional advice.</h3>\n<blockquote><p>寻求专业建议。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者应该寻求专业建议来应对引用操纵者。</p>\n<p>C说求专业建议，回末句看editor、reviewer和support service处在什么位置。</p>\n<blockquote><p>when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<p>这些人或机构在句中可能正是提出不当引用要求的一方。作者收到要求后应拒绝，再报告给期刊。</p>\n<p>不能因为他们具备专业身份，就把这一句读成应当向专业人士求助或咨询。原文并没有安排另找人出主意。</p>\n<p><strong>句中这些专业人员是作者要去咨询的人，还是可能提出不当要求的人？</strong></p>\n<p>是后者。C没有对应拒绝并举报的具体建议。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"40题","raw":"### D. Reveal their misconduct.\n\n> 揭露他们的不当行为。\n\n把D接回题干，它说的是：作者应该揭露引用操纵者的不当行为来应对他们。\n\nD说揭露不当行为，回末句找report the request to the journal。\n\n> asks you to add inappropriate references, do not oblige and do report the request to the journal.\n\n提出要求的人让作者加不合适的参考文献，作者应当不照做，并将这件事告诉期刊。报告会让期刊知道操纵者做了什么。\n\nD的reveal their misconduct概括的正是这一步，不必局限于向社会公开，向负责的期刊揭示也符合这里的意思。\n\n**把不当引用要求报告给期刊，是不是在揭露这项不当行为？**\n\n是。D直接接住了原文建议，可以保留。\n\n**第一轮判断：D保留。**","articleRects":[[275,1783,1120,38],[202,1829,1195,37],[203,1874,1193,37],[202,1920,1194,37],[202,1965,698,38]],"questionRects":[[283,1965,414,31],[573,2092,499,35]],"s | 第4段 | The problem is rampant in Scopus | 用一个人利用至少15种期刊给三所大学的五位科学家文章提供引用的例子，把前段做法落到实际操作；接着指出“The problem is rampant in Scopus”，并说明数据库收录大量新“国际”期刊。这一段把期刊之间的操纵联系到数据库中的严重问题，为下一段讨论数据库可以怎样识别问题作衔接。 | 用实际操作举例，将问题接到数据库收录与识别。 |\n| 第5段 | all the data necessary to detect this malpractice；do not oblige | 指出斯科普斯掌握“all the data necessary to detect this malpractice”，并把文章在第一年获得大量引用列为警示信号；随后转向作者，要求遇到增加不恰当参考文献的要求时“do not oblige”，并向期刊报告。文章从操纵方式和发生情况转向识别条件及作者的具体应对。 | 由描述问题转向数据库识别与作者拒绝、报告不当要求的应对办法。 |\n\n全文观点：文章从科研评价对论文所获引用的重视出发，揭示引用联盟、咨询机构建议增引以及期刊集中供给引用等现象，说明某些论文的引用次数如何被人为抬高；最后指出数据库已有识别这种不当行为所需的数据，并主张作者拒绝不当引用要求、向期刊报告。","articleRects":[[274,281,1123,37],[202,326,1193,38],[203,372,1187,38],[202,417,1194,38],[202,463,1196,38],[203,508,1193,38],[202,554,1194,38],[202,600,240,37],[274,645,1122,38],[202,691,1193,37],[202,736,1194,38],[202,781,1193,38],[202,827,1195,38],[202,873,1193,37],[202,918,1195,38],[202,964,1194,37],[202,1009,855,31],[274,1055,1123,38],[202,1100,1193,38],[199,1146,1196,37],[203,1191,1192,38],[202,1237,1194,37],[203,1282,1192,38],[203,1328,1193,38],[202,1373,1193,38],[204,1419,778,38],[274,1464,1122,38],[202,1510,1194,38],[204,1555,1192,38],[202,1597,1194,46],[202,1645,1194,39],[203,1692,1193,38],[202,1737,202,38],[275,1783,1120,38],[202,1829,1195,37],[203,1874,1193,37],[202,1920,1194,37],[202,1965,698,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_argument","role":"whole_text_argument","paragraphPids":[0,1,2,3,4]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>the citations attracted by these papers</td><td>从科学论文的产出与质量衡量讲起，指出职业生涯和机构声誉更取决于“the citations attracted by these papers”。这一段交代引用次数为什么会牵动科学家及其机构，为下文讨论人为增加引用提供背景。</td><td>交代引文评价的重要性，为人为抬高次数的问题铺垫。</td></tr><tr><td>第2段</td><td>conspire to inflate citation numbers；advise contributors to add a number of citations</td><td>用“conspire to inflate citation numbers”说明引用联盟串通抬高次数，再介 一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n\n<hr />\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n\n<hr />\n<h2>36题题干</h2>\n<p><strong>According to Paragraph 1, the careers of scientists can be determined by  ______.</strong></p>\n<blockquote><p>根据第1段，科学家的职业生涯可能由什么决定？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n\n<hr />\n<h2>37题题干</h2>\n<p><strong>The support service consultancies tend to  ______.</strong></p>\n<blockquote><p>支持服务咨询机构往往会做什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n\n<hr />\n<h2>38题题干</h2>\n<p><strong>The function of the “milk cow” journals is to  ______.</strong></p>\n<blockquote><p>“奶牛”期刊的作用是什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n\n<hr />\n<h2>39题题干</h2>\n<p><strong>What can be learned about Scopus from the last two paragraphs?</strong></p>\n<blockquote><p>从最后两段可以了解到斯科普斯的什么情况？</p>\n</blockquote>\n<p>题型：<strong>细节推断题</strong>。</p>\n\n<hr />\n<h2>40题题干</h2>\n<p><strong>What should an author do to deal with citation manipulators?</strong></p>\n<blockquote><p>作者应该怎样应对引用操纵者？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>but, including, In fact</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>suspicious, inappropriate, rampant</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>publish, cite, detect</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>citations, quality, reputation</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>journals, citations, papers</td></tr></tbody></table>\n\n<hr />\n<p>Scientific papers are the <strong>[xxx]</strong> of progress in research. Each year researchers publish millions of papers in more than 30, 000 journals. The scientific community measures the quality of those papers in a number of ways, including the <strong>[xxx]</strong> quality of the journal (as reflected by the title’s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n\n<hr />\n<p>Scientific papers are the <strong>[xxx]</strong> of progress in research. / Each year researchers publish millions of papers in more than 30, 000 journals. / The scientific community measures the quality of those papers in a number of ways, / including the <strong>[xxx]</strong> quality of the journal (as reflected by the title’s impact factor) and the number of citations a specific paper accumulates. / The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, / but even more so on the citations attracted by these papers.</p>\n\n<hr />\n<p>科学论文 are the <strong>[xxx]</strong> of 研究中的进步. / 每年 研究者发表数百万篇论文 in more than 30, 000 journals. / The scientific community measures the quality of those papers 用多种方式, / including the <strong>[xxx]</strong> quality of the journal (as reflected by the title’s impact factor) and 引用次数 某篇论文积累的. / 科学家的职业生涯 and 他们所在机构的声誉 depend 取决于数量和声望 of the papers they produce, / but even more so on the citations attracted by these papers.</p>\n\n<hr />\n<p>1、科学论文、研究中的进步、每年、研究者发表数百万篇论文、用多种方式、引用次数、某篇论文积累的、科学家的职业生涯、他们所在机构的声誉、取决于数量和声望。</p>\n\n<hr />\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this <strong>[xxx]</strong> behavior has emerged: so-called support service consultancies that provide language and other <strong>[xxx]</strong> support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n\n<hr />\n<p>Citation cartels, where journals, authors, / and institutions conspire to inflate citation numbers, / have existed for a long time. In 2016, / researchers developed an algorithm to recognize suspicious citation patterns, / including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, / another expression of this <strong>[xxx]</strong> behavior has emerged: / so-called support service consultancies that provide language and other <strong>[xxx]</strong> support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n\n<hr />\n<p>引用联盟, where journals, authors, / and institutions conspire to 抬高引用次数, / have existed for a long time. In 2016, / researchers developed an algorithm to 识别可疑的引用模式, / including groups of authors that disproportionately cite one another and groups of journals that 频繁相互引用 to increase the impact factors of their publications. Recently, / another expression of this <strong>[xxx]</strong> behavior has emerged: / so-called 支持服务咨询机构 that provide language and other <strong>[xxx]</strong> support to individual authors and to journals sometimes 建议投稿者 to 增加一些引用 to their articles.</p>\n\n<hr />\n<p>2、引用联盟、抬高引用次数、识别可疑的引用模式、频繁相互引用、支持服务咨询机构、建议投稿者、增加一些引用。</p>\n\n<hr />\n<p>The <strong>[xxx]</strong> of electronic publishing and authors’ need to find <strong>[xxx]</strong> for their papers resulted in thousands of new journals. The birth of <strong>[xxx]</strong> journals wasn’t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The <strong>[xxx]</strong> part is that the journal that the editor is <strong>[xxx]</strong> working for is not profiting at all—it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n\n<hr />\n<p>The <strong>[xxx]</strong> of electronic publishing and authors’ need to find <strong>[xxx]</strong> for their papers resulted in thousands of new journals. / The birth of <strong>[xxx]</strong> journals wasn’t far behind. / These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. / In some instances, / there is absolutely no relationship between the content of the article and the citations. / The <strong>[xxx]</strong> part is that the journal that the editor is <strong>[xxx]</strong> working for is not profiting at all — / it is just providing citations to other journals. / Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n\n<hr />\n<p>The <strong>[xxx]</strong> of electronic publishing and authors’ need to find <strong>[xxx]</strong> for their papers resulted in 数千种新期刊. / The birth of <strong>[xxx]</strong> journals wasn’t far behind. / These journals can 充当奶牛 where 每一篇文章 in an issue may cite a specific paper or a series of papers. / In some instances, / there is 完全没有关联 between the content of the article and the citations. / The <strong>[xxx]</strong> part is that the journal that the editor is <strong>[xxx]</strong> working for is not profiting at all — / it is just 向其他期刊提供引用. / Such practices can lead an article to accrue 超过150次引用 in the same year that it was published.</p>\n\n<hr />\n<p>3、数千种新期刊、充当奶牛、每一篇文章、完全没有关联、向其他期刊提供引用、超过150次引用。</p>\n\n<hr />\n<p>How <strong>[xxx]</strong> is this type of citation manipulation? In one example, an individual—acting as author, editor, and <strong>[xxx]</strong>—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, a citation database, which includes a high number of the new “international” journals. In fact, a listing in Scopus seems to be a <strong>[xxx]</strong> to be targeted in this type of citation manipulation.</p>\n\n<hr />\n<p>How <strong>[xxx]</strong> is this type of citation manipulation? / In one example, an individual — / acting as author, editor, and <strong>[xxx]</strong>— / was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. / The problem is rampant in Scopus, / a citation database, / which includes a high number of the new “international” journals. In fact, / a listing in Scopus seems to be a <strong>[xxx]</strong> to be targeted in this type of citation manipulation.</p>\n\n<hr />\n<p>How <strong>[xxx]</strong> is this type of citation manipulation? / In one example, an individual — / acting as author, editor, and <strong>[xxx]</strong>— / was able to 利用至少15种期刊 作为引用提供者 to articles published by five scientists at three universities. / The problem is rampant in Scopus, / 一个引文数据库, / which includes a high number of 新的国际期刊. In fact, / 被斯科普斯收录 seems to be a <strong>[xxx]</strong> to be targeted in this type of citation manipulation.</p>\n\n<hr />\n<p>4、利用至少15种期刊、作为引用提供者、一个引文数据库、新的国际期刊、被斯科普斯收录。</p>\n\n<hr />\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n\n<hr />\n<p>Scopus itself has all the data necessary to detect this malpractice. / Red flags include a large number of citations to an article within the first year. / And for authors who wish to steer clear of citation cartel activities: / when an editor, a reviewer, / or a support service asks you to add inappropriate references, / do not oblige and do report the request to the journal.</p>\n\n<hr />\n<p>斯科普斯本身 拥有全部必要数据 查出这种不当行为. / Red flags include 大量引用 to an article 在第一年内. / And for authors who wish to steer clear of citation cartel activities: / when an editor, a reviewer, / or a support service asks you to add inappropriate references, / 不要照办 and 务必报告这一要求 to the journal.</p>\n\n<hr />\n<p>5、斯科普斯本身、拥有全部必要数据、查出这种不当行为、大量引用、在第一年内、不要照办、务必报告这一要求。</p>\n\n<hr />\n<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到科学论文、研究中的进步、他们所在机构的声誉、取决于数量和声望；中间又出现引用联盟、抬高引用次数、建议投稿者、增加一些引用；数千种新期刊、充当奶牛、向其他期刊提供引用、超过150次引用；利用至少15种期刊、作为引用提供者、新的国际期刊、被斯科普斯收录；结尾还有斯科普斯本身、拥有全部必要数据、不要照办、务必报告这一要求。</p>\n<p>到这里还不能自然地说清楚：论文质量、期刊与引用数怎样联系，几种做法如何影响引用，末尾的建议具体针对什么。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n\n<hr />\n<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，遇到这种情况，可再结合全文检查。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n\n<hr />\n<h2>36题</h2>\n<blockquote><p>According to Paragraph 1, the careers of scientists can be determined by  ______.<br />\n根据第1段，科学家的职业生涯可能由什么决定？</p>\n</blockquote>\n<p>题干明确给出Paragraph 1，并点出the careers of scientists。直接进入第1段，从科学论文的作用读到段末科学家的职业生涯与论文之间的关系。</p>\n<blockquote><p>原文参考：</p>\n<p>Scientific papers are the <strong>[xxx]</strong> of progress in research. Each year researchers publish millions of papers in more than 30, 000 journals. The scientific community measures the quality of those papers in a number of ways, including the <strong>[xxx]</strong> quality of the journal (as reflected by the title’s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n<p>开始精读：</p>\n<p>Scientific papers are the <strong>[xxx]</strong> of progress in research. / Each year researchers publish millions of papers in more than 30, 000 journals. / The scientific community measures the quality of those papers in a number of ways, / including the <strong>[xxx]</strong> quality of the journal (as reflected by the title’s impact factor) / and the number of citations a specific paper accumulates. / The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, / but even more so on the citations attracted by these papers.</p>\n<p>科学论文是研究进步的<strong>[xxx]</strong>。 / 每年，研究者在超过30, 000种期刊上发表数百万篇论文。 / 科学界用多种方式衡量这些论文的质量， / 包括期刊的<strong>[xxx]</strong>质量（由该期刊的影响因子反映出来） / 以及某篇论文积累的被引用次数。 / 科学家的职业生涯及其所在机构的声誉，取决于他们产出论文的数量和声望， / 但更取决于这些论文获得的引用。</p>\n</blockquote>\n<p>本题问the careers of scientists can be determined by什么。第1段先介绍论文及质量衡量方式，末句用depend on说明科学家的职业生涯取决于哪些因素；空格要补的是这一依赖关系中的因素。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. how many citations their works contain</h3>\n<blockquote><p>他们的作品包含多少处引用</p>\n</blockquote>\n<p>把A接回题干，它说的是：根据第1段，科学家的职业生涯可能由他们的作品包含多少处引用决定。</p>\n<p>A说自己的作品里引用了多少，回第1段看citations attracted by these papers。</p>\n<blockquote><p>but even more so on the citations attracted by these papers.</p>\n</blockquote>\n<p>论文吸引到的引用，是别人后来在文章中引用这篇论文。A中的contain却在问这篇论文里面放了多少参考文献。</p>\n<p>一个是别人引用我，一个是我引用别人。前文的accumulates与后面的attracted都在统计论文得到的引用。</p>\n<p><strong>论文得到的引用，与论文自身包含的引用数量相同吗？</strong></p>\n<p>不相同。A把被引用换成了引用别人。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. how many times their papers are cited</h3>\n<blockquote><p>他们的论文被引用多少次</p>\n</blockquote>\n<p>把B接回题干，它说的是：根据第1段，科学家的职业生涯可能由他们的论文被引用多少次决定。</p>\n<p>B说论文被引次数，回第1段找careers depend on后面的内容。</p>\n<blockquote><p>The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce,</p>\n</blockquote>\n<blockquote><p>but even more so on the citations attracted by these papers.</p>\n</blockquote>\n<p>原文先说论文数量与声望影响职业生涯，再用but even more so强调这些论文吸引到的引用。B的papers are cited就是论文被别人引用。</p>\n<p>它既接住了方向，也接住了后半句比论文数量更受强调的部分。</p>\n<p><strong>论文吸引到引用，是否就是论文被引用的次数增加？</strong></p>\n<p>是。B与citations attracted by these papers相符，可以保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. the prestige of the people they work with</h3>\n<blockquote><p>与他们共事的人的声望</p>\n</blockquote>\n<p>把C接回题干，它说的是：根据第1段，科学家的职业生涯可能由与他们共事的人的声望决定。</p>\n<p>C有prestige，回第1段看这个词修饰的是谁。</p>\n<blockquote><p>The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce,</p>\n</blockquote>\n<p>原文说number and prestige of the papers they produce，数量和声望都属于他们发表的论文。后面再说论文被引情况更重要。</p>\n<p>C把声望放在共事者身上。句中既没有同事，也没有说同事的名气能决定自己的职业。</p>\n<p><strong>prestige在原文属于论文，还是属于合作的人？</strong></p>\n<p>属于论文。C虽然沿用了声望这个词，却换了它的所属对象。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. the status they have in scientific circles</h3>\n<blockquote><p>他们在科学界的地位</p>\n</blockquote>\n<p>把D接回题干，它说的是：根据第1段，科学家的职业生涯可能由他们在科学界的地位决定。</p>\n<p>D说科学界地位，回第1段看作者明确给出了哪些评价依据。</p>\n<blockquote><p>The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce,</p>\n</blockquote>\n<blockquote><p>but even more so on the citations attracted by these papers.</p>\n</blockquote>\n<p>文中列出期刊质量、论文数量与声望、论文被引次数。职业生涯和机构声誉是这些表现影响的结果。</p>\n<p>D没有对应这些具体依据，而把科学家已经拥有的地位放进去。原文没有说先有地位再决定职业发展。</p>\n<p><strong>本段列出的直接依据是科学家的既有地位吗？</strong></p>\n<p>不是。它强调发表成果尤其是被引表现，D没有接上。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>36题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一遍留下B。</p>\n\n<hr />\n<h2>37题</h2>\n<blockquote><p>The support service consultancies tend to  ______.<br />\n支持服务咨询机构往往会做什么？</p>\n</blockquote>\n<p>题干直接点出support service consultancies。第2段末句出现这一机构名称，因此把第2段从引用联盟的介绍读到咨询机构的做法。</p>\n<blockquote><p>原文参考：</p>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this <strong>[xxx]</strong> behavior has emerged: so-called support service consultancies that provide language and other <strong>[xxx]</strong> support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n<p>开始精读：</p>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. / In 2016, researchers developed an algorithm to recognize suspicious citation patterns, / including groups of authors that disproportionately cite one another / and groups of journals that cite each other frequently to increase the impact factors of their publications. / Recently, another expression of this <strong>[xxx]</strong> behavior has emerged: / so-called support service consultancies that provide language and other <strong>[xxx]</strong> support to individual authors and to journals / sometimes advise contributors to add a number of citations to their articles.</p>\n<p>引用联盟，即期刊、作者和机构串通抬高引用次数，已经存在很久了。 / 在2016年，研究者开发了一种算法，来识别可疑的引用模式， / 包括相互引用比例失衡的作者群体 / 以及为提高自身刊物的影响因子而频繁相互引用的期刊群体。 / 最近，这种<strong>[xxx]</strong>行为的另一种表现出现了： / 所谓的支持服务咨询机构，它们为个人作者和期刊提供语言及其他<strong>[xxx]</strong>支持， / 有时会建议投稿者在文章中增加一些引用。</p>\n</blockquote>\n<p>题干问这些咨询机构tend to做什么。第2段先说明引用联盟及相互引用的做法，再介绍咨询机构为作者和期刊提供支持并给投稿者建议；空格要接出这种机构采取的做法。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. recommend journals to their clients</h3>\n<blockquote><p>向客户推荐期刊</p>\n</blockquote>\n<p>把A接回题干，它说的是：支持服务咨询机构往往向客户推荐期刊。</p>\n<p>A说推荐期刊，回第2段找consultancies后的advise。</p>\n<blockquote><p>provide language and other <strong>[xxx]</strong> support to individual authors and to journals</p>\n</blockquote>\n<blockquote><p>sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n<p>咨询机构提供语言等支持，随后有时建议投稿者给文章加一批引用。advise的内容是add citations。</p>\n<p>期刊在这一段也出现了，但不是咨询机构推荐作者投稿的去处。不能只看到咨询和期刊，就补成选刊服务。</p>\n<p><strong>咨询机构这句话给出的建议是向哪家期刊投稿吗？</strong></p>\n<p>不是。它要求在文章中加入引用，A换了建议内容。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. list citation patterns for their clients</h3>\n<blockquote><p>为客户列出引用模式</p>\n</blockquote>\n<p>把B接回题干，它说的是：支持服务咨询机构往往为客户列出引用模式。</p>\n<p>B说给客户列引用模式，回第2段看patterns是谁在识别。</p>\n<blockquote><p>In 2016, researchers developed an algorithm to recognize suspicious citation patterns,</p>\n</blockquote>\n<blockquote><p>sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n<p>识别可疑引用模式的是2016年研究者开发的算法。接下来用Recently, another expression转到咨询机构的另一种行为。</p>\n<p>咨询机构让作者增加引用，没有说它们把引用规律整理成清单交给客户。</p>\n<p><strong>算法研究者识别模式的行为，能移到咨询机构身上吗？</strong></p>\n<p>不能。B混用了同段里两类人的动作。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. ask authors to include extra citations</h3>\n<blockquote><p>要求作者加入额外引用</p>\n</blockquote>\n<p>把C接回题干，它说的是：支持服务咨询机构往往要求作者加入额外引用。</p>\n<p>C说让作者增加引用，回第2段找advise contributors to add。</p>\n<blockquote><p>sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n<p>原文的contributors是向刊物投稿的人，add a number of citations就是给文章再加若干引用。C把这一动作改写为ask authors to include extra citations。</p>\n<p>前面关于语言支持的介绍说明机构身份，真正回答这题的是后面它们如何影响文章引用。</p>\n<p><strong>advise contributors to add citations与让作者增加引用是否一致？</strong></p>\n<p>一致。C保留了提出建议的人、接受建议的人和具体动作，可以保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n\n<hr />\n<h3>D. advise contributors to cite each other</h3>\n<blockquote><p>建议投稿者相互引用</p>\n</blockquote>\n<p>把D接回题干，它说的是：支持服务咨询机构往往建议投稿者相互引用。</p>\n<p>D说建议投稿者互引，回第2段分别找cite one another与consultancies。</p>\n<blockquote><p>groups of authors that disproportionately cite one another</p>\n</blockquote>\n<blockquote><p>sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n<p>作者互相引用出现在前面算法识别的可疑模式里。咨询机构这一句只说建议作者添加引用，没有说明被引者也会反过来引用他们。</p>\n<p>增加引用可能单向指向某些论文，相互引用则要求两边都引用对方，多了一个方向。</p>\n<p><strong>咨询机构让作者加引文，是否已经说明双方互引？</strong></p>\n<p>没有。D把前面作者群的互引模式放到了咨询机构的具体建议里。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>37题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍留下C。</p>\n\n<hr />\n<h2>38题</h2>\n<blockquote><p>The function of the “milk cow” journals is to  ______.<br />\n“奶牛”期刊的作用是什么？</p>\n</blockquote>\n<p>题干给出“milk cow” journals，第3段第三句用milk cows描述一类期刊。把第3段从新期刊产生的背景读到最后一句引用次数增加的结果。</p>\n<blockquote><p>原文参考：</p>\n<p>The <strong>[xxx]</strong> of electronic publishing and authors’ need to find <strong>[xxx]</strong> for their papers resulted in thousands of new journals. The birth of <strong>[xxx]</strong> journals wasn’t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The <strong>[xxx]</strong> part is that the journal that the editor is <strong>[xxx]</strong> working for is not profiting at all—it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>开始精读：</p>\n<p>The <strong>[xxx]</strong> of electronic publishing and authors’ need to find <strong>[xxx]</strong> for their papers resulted in thousands of new journals. / The birth of <strong>[xxx]</strong> journals wasn’t far behind. / These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. / In some instances, there is absolutely no relationship between the content of the article and the citations. / The <strong>[xxx]</strong> part is that the journal that the editor is <strong>[xxx]</strong> working for is not profiting at all—it is just providing citations to other journals. / Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>电子出版的<strong>[xxx]</strong>，以及作者为论文寻找<strong>[xxx]</strong>的需要，催生了数千种新期刊。 / <strong>[xxx]</strong>期刊也随后诞生了。 / 这些期刊可以充当奶牛，其中某一期的每一篇文章都可能引用某篇特定论文或一系列论文。 / 在某些情况下，文章内容与所引用的文献毫无关联。 / <strong>[xxx]</strong>的地方在于，这位编辑正在<strong>[xxx]</strong>为之工作的期刊完全没有获益——它只是在向其他期刊提供引用。 / 这样的做法可以让一篇文章在发表的同一年积累超过150次引用。</p>\n</blockquote>\n<p>题干要补这些期刊的function，即它们发挥什么作用。第3段说明这类期刊中的文章怎样引用论文，又说明期刊自身与其他期刊各得到什么；要把这些做法接成它们的实际作用。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. boost citation counts for certain authors</h3>\n<blockquote><p>提高某些作者的被引用次数</p>\n</blockquote>\n<p>把A接回题干，它说的是：“奶牛”期刊的作用是提高某些作者的被引用次数。</p>\n<p>A说提高特定作者被引次数，回第3段看every single article与a specific paper。</p>\n<blockquote><p>every single article in an issue may cite a specific paper or a series of papers.</p>\n</blockquote>\n<blockquote><p>Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n<p>同一期里每篇文章都去引用某篇或一组指定论文，甚至与本篇内容毫无关系。这样做直接增加的是被指定论文收到的引用。</p>\n<p>段末说一篇论文发表当年便可能积累超过150次引用，说明这种安排能把特定作者的被引数推高。</p>\n<p><strong>许多文章都指向同一批论文，直接被抬高的是什么？</strong></p>\n<p>是这些论文及其作者的被引次数。A与例子和结果都相符。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n\n<hr />\n<h3>B. help scholars publish articles at low cost</h3>\n<blockquote><p>帮助学者以低成本发表文章</p>\n</blockquote>\n<p>把B接回题干，它说的是：“奶牛”期刊的作用是帮助学者以低成本发表文章。</p>\n<p>B说低成本发表，回第3段看new journals之后讨论的具体作用。</p>\n<blockquote><p>is not profiting at all—it is just providing citations to other journals.</p>\n</blockquote>\n<p>作者确实先交代新期刊大量出现，但“奶牛”期刊的行为是向特定论文提供引用。这里没有比较投稿费用或出版成本。</p>\n<p>文中还说期刊自身不获益，只给其他期刊提供引用。这个不获益也不能直接理解成作者少付发表费。</p>\n<p><strong>没有给期刊自身带来收益，就能说明作者发表成本低吗？</strong></p>\n<p>不能。B把引用操纵换成了费用优惠，段落没有这样的说明。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. instruct first-time contributors in citation</h3>\n<blockquote><p>指导首次投稿者如何引用文献</p>\n</blockquote>\n<p>把C接回题干，它说的是：“奶牛”期刊的作用是指导首次投稿者如何引用文献。</p>\n<p>C说教新手引用，回第3段看有些引用与文章内容的关系。</p>\n<blockquote><p>every single article in an issue may cite a specific paper or a series of papers.</p>\n</blockquote>\n<blockquote><p>it is just providing citations to other journals.</p>\n</blockquote>\n<p>文中明确说有些引用与文章内容完全无关，整期文章却集中引用特定论文。这里是在制造被引记录。</p>\n<p>正常指导引用应帮助作者选取与论述相关的文献，原文既没介绍这种指导，也没有限定对象为首次投稿者。</p>\n<p><strong>强行加入无关引用，是在教首次投稿者规范引用吗？</strong></p>\n<p>不是。C把操纵行为说成了教学帮助，又加了新手这一对象。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. increase the readership of new journals</h3>\n<blockquote><p>增加新期刊的读者人数</p>\n</blockquote>\n<p>把D接回题干，它说的是：“奶牛”期刊的作用是增加新期刊的读者人数。</p>\n<p>D说增加读者，回第3段看最后增长的数字统计什么。</p>\n<blockquote><p>every single article in an issue may cite a specific paper or a series of papers.</p>\n</blockquote>\n<blockquote><p>accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n<p>超过150这个数字是某篇论文得到的引用次数，不是期刊读者人数。前面也说期刊为其他期刊提供引用，自身并未从中获益。</p>\n<p>被引用多并不自动意味着有更多人真实阅读，更不能据此统计新期刊读者增加。</p>\n<p><strong>段落记录的是读者增长，还是特定论文被引记录增长？</strong></p>\n<p>是后者。D把引用数量换成了读者数量。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>38题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。</p>\n\n<hr />\n<h2>39题</h2>\n<blockquote><p>What can be learned about Scopus from the last two paragraphs?<br />\n从最后两段可以了解到斯科普斯的什么情况？</p>\n</blockquote>\n<p>题干明确限定the last two paragraphs，并给出Scopus这一数据库名称，所以完整读第4段和第5段：前一段写引用操纵的实例及数据库中的问题，后一段写数据库掌握的数据和作者可以采取的行动。</p>\n<blockquote><p>原文参考：</p>\n<p>How <strong>[xxx]</strong> is this type of citation manipulation? In one example, an individual—acting as author, editor, and <strong>[xxx]</strong>—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, a citation database, which includes a high number of the new “international” journals. In fact, a listing in Scopus seems to be a <strong>[xxx]</strong> to be targeted in this type of citation manipulation.</p>\n<p>开始精读：</p>\n<p>How <strong>[xxx]</strong> is this type of citation manipulation? / In one example, an individual—acting as author, editor, and <strong>[xxx]</strong>—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. / The problem is rampant in Scopus, a citation database, which includes a high number of the new “international” journals. / In fact, a listing in Scopus seems to be a <strong>[xxx]</strong> to be targeted in this type of citation manipulation.</p>\n<p>这类引用操纵有多<strong>[xxx]</strong>？ / 在一个例子中，某个人——兼任作者、编辑和<strong>[xxx]</strong>——能够利用至少15种期刊，为三所大学的五位科学家发表的文章提供引用。 / 这个问题在引文数据库斯科普斯中十分猖獗，该数据库收录了大量新的“国际”期刊。 / 事实上，被斯科普斯收录，似乎是成为这类引用操纵目标的一个<strong>[xxx]</strong>。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n<p>开始精读：</p>\n<p>Scopus itself has all the data necessary to detect this malpractice. / Red flags include a large number of citations to an article within the first year. / And for authors who wish to steer clear of citation cartel activities: / when an editor, a reviewer, or a support service asks you to add inappropriate references, / do not oblige and do report the request to the journal.</p>\n<p>斯科普斯本身拥有查出这种不当行为所必需的全部数据。 / 警示信号包括一篇文章在第一年内就被大量引用。 / 而对于希望避开引用联盟活动的作者来说： / 当编辑、审稿人或支持服务机构要求你增加不恰当的参考文献时， / 不要照办，而且务必向期刊报告这一要求。</p>\n</blockquote>\n<p>本题问最后两段关于Scopus说明了什么。需要把第4段中数据库与引用操纵的关系，以及第5段中它拥有何种数据、这些数据有何用途接起来看，再判断哪种表述能够成立。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. It fosters competition among citation providers.</h3>\n<blockquote><p>它促进引用提供者之间的竞争。</p>\n</blockquote>\n<p>把A接回题干，它说的是：从最后两段可以了解到，斯科普斯促进引用提供者之间的竞争。</p>\n<p>A说引用提供者竞争，回第4段看15家期刊怎样出现。</p>\n<blockquote><p>was able to use at least 15 journals as citation providers to articles published by five scientists at three universities.</p>\n</blockquote>\n<blockquote><p>The problem is rampant in Scopus, a citation database,</p>\n</blockquote>\n<p>一个人能够动用至少15家期刊，给一些科学家的文章提供引用。这里多家期刊共同充当引用来源，并没有描述它们之间争夺什么。</p>\n<p>Scopus收录这类期刊，使问题在数据库中普遍存在，也不等于数据库促使这些期刊展开竞争。</p>\n<p><strong>多个引用提供者同时存在，就说明它们在互相竞争吗？</strong></p>\n<p>不是。A添出了原文未写的竞争关系。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. It has the capability to identify suspicious citations.</h3>\n<blockquote><p>它具备识别可疑引用的能力。</p>\n</blockquote>\n<p>把B接回题干，它说的是：从最后两段可以了解到，斯科普斯具备识别可疑引用的能力。</p>\n<p>B说有能力识别，回末段看all the data necessary to detect。</p>\n<blockquote><p>Scopus itself has all the data necessary to detect this malpractice.</p>\n</blockquote>\n<blockquote><p>Red flags include a large number of citations to an article within the first year.</p>\n</blockquote>\n<p>Scopus自己拥有识别这种不当做法所需的全部数据。后面还给出警示信号：发表第一年就有大量引用。</p>\n<p>有数据可查，也有可疑表现可据此核对，B说的识别能力可以从这里推出。它不等于说数据库已经查清或清除了每个问题。</p>\n<p><strong>拥有识别所需数据，是否能支持具备发现可疑引用的能力？</strong></p>\n<p>能。B与末段明确说明一致，可以保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n\n<hr />\n<h3>C. It hinders the growth of “international” journals.</h3>\n<blockquote><p>它阻碍了“国际”期刊的发展。</p>\n</blockquote>\n<p>把C接回题干，它说的是：从最后两段可以了解到，斯科普斯阻碍了“国际”期刊的发展。</p>\n<p>C说阻碍国际期刊发展，回第4段看includes a high number。</p>\n<blockquote><p>which includes a high number of the new “international” journals.</p>\n</blockquote>\n<blockquote><p>a listing in Scopus seems to be a <strong>[xxx]</strong> to be targeted in this type of citation manipulation.</p>\n</blockquote>\n<p>数据库收录了大量新的“国际”期刊，随后说被收录与成为操纵目标有关。文章关注的是其中的引用问题。</p>\n<p>收录多不等于阻碍发展，成为操纵目标也不等于期刊因此停止成长。文中没有比较它们的发展速度。</p>\n<p><strong>这些期刊大量进入数据库，是否已经说明数据库在阻碍它们发展？</strong></p>\n<p>没有。C把收录及操纵问题换成了发展受阻。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. It is established to prevent citation manipulation.</h3>\n<blockquote><p>它是为防止引用操纵而建立的。</p>\n</blockquote>\n<p>把D接回题干，它说的是：从最后两段可以了解到，斯科普斯是为防止引用操纵而建立的。</p>\n<p>D说为防操纵而建立，回末段看Scopus已有能力与建立目的有没有同时出现。</p>\n<blockquote><p>Scopus itself has all the data necessary to detect this malpractice.</p>\n</blockquote>\n<p>作者说它现在拥有识别不当引用的必要数据。前段则称它为citation database，只介绍数据库身份和其中的问题。</p>\n<p>现有数据能用来查问题，并不能倒推出当初建库就是为了防止这些问题。</p>\n<p><strong>一个数据库能识别操纵，就说明它成立的目的也是防操纵吗？</strong></p>\n<p>不能。D把现在可做的事改成了最初成立的原因。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n\n<hr />\n<h3>39题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一遍留下B。</p>\n\n<hr />\n<h2>40题</h2>\n<blockquote><p>What should an author do to deal with citation manipulators?<br />\n作者应该怎样应对引用操纵者？</p>\n</blockquote>\n<p>题干问an author应怎样deal with citation manipulators。第5段直接写for authors who wish to steer clear of citation cartel activities，并用when引出作者遇到不当引用要求时的应对，因而回到已完整读过的第5段。</p>\n<p>本题问作者在面对引用操纵时应该采取什么行动。末句先给出编辑、审稿人或支持服务机构要求增加不恰当文献的情形，再写作者该如何回应；空格要选出这一条件下作者自己的行动。</p>\n<p>接下来按A—D逐项看。</p>\n\n<hr />\n<h3>A. Take legal action.</h3>\n<blockquote><p>采取法律行动。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者应该采取法律行动来应对引用操纵者。</p>\n<p>A说法律行动，回末句看report的接收方。</p>\n<blockquote><p>when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<p>作者建议不要听从添加不当引用的要求，并把要求报告给期刊。接收报告的是journal。</p>\n<p>文中没有写向法院起诉、向执法机关报案或请律师处理。报告不当行为可能有后续，但这里提出的具体动作不能先改成诉讼。</p>\n<p><strong>向期刊报告，就等于已经采取法律行动吗？</strong></p>\n<p>不是。A换了处理途径。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n\n<hr />\n<h3>B. Demand an apology.</h3>\n<blockquote><p>要求对方道歉。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者应该要求对方道歉来应对引用操纵者。</p>\n<p>B说要求道歉，回末句看do not与do后面的两个动作。</p>\n<blockquote><p>do not oblige and do report the request to the journal.</p>\n</blockquote>\n<p>一个是不要照办，另一个是报告这项要求。两步都在拒绝参与并让期刊知道有人提出不当要求。</p>\n<p>没有出现要求编辑、评审人或服务机构向作者认错的内容。</p>\n<p><strong>作者被要求争取的是一份道歉吗？</strong></p>\n<p>不是。文中要求拒绝并报告，B换了应对动作。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n\n<hr />\n<h3>C. Seek professional advice.</h3>\n<blockquote><p>寻求专业建议。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者应该寻求专业建议来应对引用操纵者。</p>\n<p>C说求专业建议，回末句看editor、reviewer和support service处在什么位置。</p>\n<blockquote><p>when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<p>这些人或机构在句中可能正是提出不当引用要求的一方。作者收到要求后应拒绝，再报告给期刊。</p>\n<p>不能因为他们具备专业身份，就把这一句读成应当向专业人士求助或咨询。原文并没有安排另找人出主意。</p>\n<p><strong>句中这些专业人员是作者要去咨询的人，还是可能提出不当要求的人？</strong></p>\n<p>是后者。C没有对应拒绝并举报的具体建议。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n\n<hr />\n<h3>D. Reveal their misconduct.</h3>\n<blockquote><p>揭露他们的不当行为。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者应该揭露引用操纵者的不当行为来应对他们。</p>\n<p>D说揭露不当行为，回末句找report the request to the journal。</p>\n<blockquote><p>asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<p>提出要求的人让作者加不合适的参考文献，作者应当不照做，并将这件事告诉期刊。报告会让期刊知道操纵者做了什么。</p>\n<p>D的reveal their misconduct概括的正是这一步，不必局限于向社会公开，向负责的期刊揭示也符合这里的意思。</p>\n<p><strong>把不当引用要求报告给期刊，是不是在揭露这项不当行为？</strong></p>\n<p>是。D直接接住了原文建议，可以保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n\n<hr />\n<h3>40题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。</p>\n\n<hr />\n<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>the citations attracted by these papers</td><td>从科学论文的产出与质量衡量讲起，指出职业生涯和机构声誉更取决于“the citations attracted by these papers”。这一段交代引用次数为什么会牵动科学家及其机构，为下文讨论人为增加引用提供背景。</td><td>交代引文评价的重要性，为人为抬高次数的问题铺垫。</td></tr><tr><td>第2段</td><td>conspire to inflate citation numbers；advise contributors to add a number of citations</td><td>用“conspire to inflate citation numbers”说明引用联盟串通抬高次数，再介绍算法识别作者和期刊的相互引用模式；段末转到支持服务咨询机构“advise contributors to add a number of citations”的做法。文章由引用的重要性进入对操纵方式的描述，也为下一段展示引用如何被集中供给作铺垫。</td><td>描述操纵引用的方式，并引出下一段集中供给引用的做法。</td></tr><tr><td>第3段</td><td>act as milk cows；providing citations to other journals</td><td>先写新期刊产生，再说明某些期刊可以“act as milk cows”，一期文章集中引用特定论文，有些引用与文章内容完全无关。随后以“providing citations to other journals”明确引用流向，并说明一篇文章可在发表当年积累超过150次引用。这一段将上一段的增加引用具体展开成期刊如何给其他论文积累引用记录。</td><td>解释某些期刊怎样向其他论文输送引用，具体展开操纵机制。</td></tr><tr><td>第4段</td><td>The problem is rampant in Scopus</td><td>用一个人利用至少15种期刊给三所大学的五位科学家文章提供引用的例子，把前段做法落到实际操作；接着指出“The problem is rampant in Scopus”，并说明数据库收录大量新“国际”期刊。这一段把期刊之间的操纵联系到数据库中的严重问题，为下一段讨论数据库可以怎样识别问题作衔接。</td><td>用实际操作举例，将问题接到数据库收录与识别。</td></tr><tr><td>第5段</td><td>all the data necessary to detect this malpractice；do not oblige</td><td>指出斯科普斯掌握“all the data necessary to detect this malpractice”，并把文章在第一年获得大量引用列为警示信号；随后转向作者，要求遇到增加不恰当参考文献的要求时“do not oblige”，并向期刊报告。文章从操纵方式和发生情况转向识别条件及作者的具体应对。</td><td>由描述问题转向数据库识别与作者拒绝、报告不当要求的应对办法。</td></tr></tbody></table>\n<p>全文观点：文章从科研评价对论文所获引用的重视出发，揭示引用联盟、咨询机构建议增引以及期刊集中供给引用等现象，说明某些论文的引用次数如何被人为抬高；最后指出数据库已有识别这种不当行为所需的数据，并主张作者拒绝不当引用要求、向期刊报告。</p>\n\n<hr />\n<h2>最终答案</h2>\n<p><strong>36. B</strong></p>\n<p><strong>37. C</strong></p>\n<p><strong>38. A</strong></p>\n<p><strong>39. B</strong></p>\n<p><strong>40. D</strong></p>\n","analysisStartIndex":29,"maskInventory":{"token":"[xxx]","count":12},"questionFlowPlan":[{"qid":"36","initialParagraphPids":[1],"paragraphPids":[1],"entry":30,"
