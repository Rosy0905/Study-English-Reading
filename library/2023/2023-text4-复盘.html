，有时会建议投稿者给文章增添一些引用。</p>\n</blockquote>\n<p>咨询机构先以语言和编辑服务身份出现，随后sometimes advise说明它们还可能提出增加引用的建议。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Support service consultancies tend to ask authors to include extra citations.</p>\n<p>支持服务咨询机构往往会请作者加入额外引用。</p>\n</blockquote>\n<p>ask在这里不必读成强迫，也不能推成每家咨询机构都会这样做；C概括文中指出的这类服务行为。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. advise contributors to cite each other","raw":"### D. advise contributors to cite each other\n\n> 支持服务咨询机构往往会建议投稿者相互引用。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n第二句确有作者相互引用，但那是算法辨认的联盟模式；咨询机构这一句只说建议加引用，并未说让作者彼此互引。\n\n**出处：**\n\n> Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,586,1344,366],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-37-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>支持服务咨询机构往往会建议投稿者相互引用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第二句确有作者相互引用，但那是算法辨认的联盟模式；咨询机构这一句只说建议加引用，并未说让作者彼此互引。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n</section>"},{"title":"D. advise contributors to cite each other","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 支持服务咨询机构往往会建议投稿者相互引用。\n\n`D`的`cite each other`与第2段第二句的`cite one another`都是相互引用，所以先核对第二句是谁在这样做；再看末句的`add a number of citations`，确认咨询机构给投稿者的建议是否带有相互这一关系。\n\n原文的`cite one another`描写一类作者群体已经存在的可疑引用模式。随后写咨询机构建议投稿者`add a number of citations`，只说明建议增加引用，没有把这些投稿者组成一个彼此回引的群体。\n\n`D`的`cite each other`把前一句作者群体的相互引用接到后一句咨询机构的建议上。\n\n增加若干引用可以只指向某些文章，并不自行形成你引我、我引你的相互关系，因此这两句不能这样合并。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,586,1344,366],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-37-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>支持服务咨询机构往往会建议投稿者相互引用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第二句确有作者相互引用，但那是算法辨认的联盟模式；咨询机构这一句只说建议加引用，并未说让作者彼此互引。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>支持服务咨询机构往往会建议投稿者相互引用。</p>\n</blockquote>\n<p><code>D</code>的<code>cite each other</code>与第2段第二句的<code>cite one another</code>都是相互引用，所以先核对第二句是谁在这样做；再看末句的<code>add a number of citations</code>，确认咨询机构给投稿者的建议是否带有相互这一关系。</p>\n<p>原文的<code>cite one another</code>描写一类作者群体已经存在的可疑引用模式。随后写咨询机构建议投稿者<code>add a number of citations</code>，只说明建议增加引用，没有把这些投稿者组成一个彼此回引的群体。</p>\n<p><code>D</code>的<code>cite each other</code>把前一句作者群体的相互引用接到后一句咨询机构的建议上。</p>\n<p>增加若干引用可以只指向某些文章，并不自行形成你引我、我引你的相互关系，因此这两句不能这样合并。</p>\n</section>"},{"title":"D. advise contributors to cite each other","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.\n>\n> 期刊、作者和机构合谋抬高引用数的引用联盟由来已久。2016年，研究者开发算法识别可疑引用模式，包括作者群体过度互引、期刊群体频繁互引以提高影响因子。最近又出现一种表现：为作者和期刊提供语言及编辑支持的服务咨询机构，有时会建议投稿者给文章增添一些引用。\n\nRecently, another expression转入另一表现，不能把前一种模式的全部关系自动带给后一种。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Support service consultancies tend to advise contributors to cite each other.\n>\n> 支持服务咨询机构往往会建议投稿者相互引用。\n\nD需要咨询机构安排双方互引的依据。extra citations只说明引用增加，each other另加了双向互惠关系。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,586,1344,366],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"37","option":"D","cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-37-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-37-option-D-0\"><blockquote>\n<p>支持服务咨询机构往往会建议投稿者相互引用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第二句确有作者相互引用，但那是算法辨认的联盟模式；咨询机构这一句只说建议加引用，并未说让作者彼此互引。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>支持服务咨询机构往往会建议投稿者相互引用。</p>\n</blockquote>\n<p><code>D</code>的<code>cite each other</code>与第2段第二句的<code>cite one another</code>都是相互引用，所以先核对第二句是谁在这样做；再看末句的<code>add a number of citations</code>，确认咨询机构给投稿者的建议是否带有相互这一关系。</p>\n<p>原文的<code>cite one another</code>描写一类作者群体已经存在的可疑引用模式。随后写咨询机构建议投稿者<code>add a number of citations</code>，只说明建议增加引用，没有把这些投稿者组成一个彼此回引的群体。</p>\n<p><code>D</code>的<code>cite each other</code>把前一句作者群体的相互引用接到后一句咨询机构的建议上。</p>\n<p>增加若干引用可以只指向某些文章，并不自行形成你引我、我引你的相互关系，因此这两句不能这样合并。</p>\n</section><section class=\"revealPart\" id=\"focus-question-37-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n<p>期刊、作者和机构合谋抬高引用数的引用联盟由来已久。2016年，研究者开发算法识别可疑引用模式，包括作者群体过度互引、期刊群体频繁互引以提高影响因子。最近又出现一种表现：为作者和期刊提供语言及编辑支持的服务咨询机构，有时会建议投稿者给文章增添一些引用。</p>\n</blockquote>\n<p>Recently, another expression转入另一表现，不能把前一种模式的全部关系自动带给后一种。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Support service consultancies tend to advise contributors to cite each other.</p>\n<p>支持服务咨询机构往往会建议投稿者相互引用。</p>\n</blockquote>\n<p>D需要咨询机构安排双方互引的依据。extra citations只说明引用增加，each other另加了双向互惠关系。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"37题结论","raw":"### 37题结论\n\n> **37. C**\n\n- A：咨询机构为作者和期刊提供语言、编辑支持，涉及期刊不等于向客户推荐期刊；原文具体写的是建议加引用。\n- B：识别可疑引用模式的是2016年研究者开发的算法，B换成咨询机构为客户列出这些模式。\n- C：advise contributors to add a number of citations与ask authors to include extra citations都说让投稿者增添引用，C保留行为与对象。\n- D：第二句确有作者相互引用，但那是算法辨认的联盟模式；咨询机构这一句只说建议加引用，并未说让作者彼此互引。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"37题","focus":[150,586,1344,366],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"37","questionConclusion":true},"html":"<blockquote>\n<p><strong>37. C</strong></p>\n</blockquote>\n<ul>\n<li>A：咨询机构为作者和期刊提供语言、编辑支持，涉及期刊不等于向客户推荐期刊；原文具体写的是建议加引用。</li>\n<li>B：识别可疑引用模式的是2016年研究者开发的算法，B换成咨询机构为客户列出这些模式。</li>\n<li>C：advise contributors to add a number of citations与ask authors to include extra citations都说让投稿者增添引用，C保留行为与对象。</li>\n<li>D：第二句确有作者相互引用，但那是算法辨认的联盟模式；咨询机构这一句只说建议加引用，并未说让作者彼此互引。</li>\n</ul>\n"},{"title":"38题 · 题干、题型与核心出处","raw":"## 38题\n\n> The function of the “milk cow” journals is to  ______.\n>\n> “奶牛”期刊的作用是什么？\n\n### 题型\n\n功能概括题：追踪引用从哪种期刊流向哪些论文，再确定谁从指标中受益。\n\n题干给出“milk cow” journals，第3段第三句用milk cows描述一类期刊。把第3段从新期刊产生的背景读到最后一句引用次数增加的结果。\n\n### 核心出处\n\n> every single article in an issue may cite a specific paper or a series of papers.\n>\n> Such practices can lead an article to accrue more than 150 citations in the same year that it was published.\n>\n> is not profiting at all—it is just providing citations to other journals.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"38","questionIntro":true},"html":"<blockquote>\n<p>The function of the “milk cow” journals is to  ______.</p>\n<p>“奶牛”期刊的作用是什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>功能概括题：追踪引用从哪种期刊流向哪些论文，再确定谁从指标中受益。</p>\n<p>题干给出“milk cow” journals，第3段第三句用milk cows描述一类期刊。把第3段从新期刊产生的背景读到最后一句引用次数增加的结果。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>every single article in an issue may cite a specific paper or a series of papers.</p>\n<p>Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>is not profiting at all—it is just providing citations to other journals.</p>\n</blockquote>\n"},{"title":"A. boost citation counts for certain authors","raw":"### A. boost citation counts for certain authors\n\n> 这些期刊的作用是提高特定作者的被引用次数。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n每篇文章都引用指定论文，甚至内容无关，结果目标论文一年可累积150多次引用；A概括特定作者因此增加被引数。\n\n**出处：**\n\n> The advent of electronic publishing and authors' need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn't far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>这些期刊的作用是提高特定作者的被引用次数。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>每篇文章都引用指定论文，甚至内容无关，结果目标论文一年可累积150多次引用；A概括特定作者因此增加被引数。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n</section>"},{"title":"A. boost citation counts for certain authors","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 这些期刊的作用是提高特定作者的被引用次数。\n\n`A`的`boost citation counts`要找引用次数增长的结果，第3段末句写`accrue more than 150 citations`；`certain authors`还需要与第三句的`a specific paper or a series of papers`合看，确认引用集中指向谁的作品。\n\n原文先写一期中的每篇文章都可能引用特定论文或一系列论文，继而说明这种做法能使一篇文章在发表当年`accrue more than 150 citations`。引用集中到特定论文，其作者也随之获得更多被引用记录。`A`的`boost citation counts`概括这个增长结果，`certain authors`则概括这些特定论文背后的作者；这不是说所有作者都获益，而是指引用流向的那些作者。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"A","cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-A-0\"><blockquote>\n<p>这些期刊的作用是提高特定作者的被引用次数。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>每篇文章都引用指定论文，甚至内容无关，结果目标论文一年可累积150多次引用；A概括特定作者因此增加被引数。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些期刊的作用是提高特定作者的被引用次数。</p>\n</blockquote>\n<p><code>A</code>的<code>boost citation counts</code>要找引用次数增长的结果，第3段末句写<code>accrue more than 150 citations</code>；<code>certain authors</code>还需要与第三句的<code>a specific paper or a series of papers</code>合看，确认引用集中指向谁的作品。</p>\n<p>原文先写一期中的每篇文章都可能引用特定论文或一系列论文，继而说明这种做法能使一篇文章在发表当年<code>accrue more than 150 citations</code>。引用集中到特定论文，其作者也随之获得更多被引用记录。<code>A</code>的<code>boost citation counts</code>概括这个增长结果，<code>certain authors</code>则概括这些特定论文背后的作者；这不是说所有作者都获益，而是指引用流向的那些作者。</p>\n</section>"},{"title":"A. boost citation counts for certain authors","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The advent of electronic publishing and authors' need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn't far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.\n>\n> 电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。\n\n电子出版带来大量新期刊，部分期刊被用作供引渠道，再以极短时间高被引说明这种安排的效果。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The function of these journals is to boost citation counts for certain authors.\n>\n> 这些期刊的作用是提高特定作者的被引用次数。\n\nA中的authors通过其论文获得引用，正与供引渠道的受益方对应；来源期刊自身不获利也不妨碍这一作用。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"m <p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。</p>\n</blockquote>\n<p>电子出版带来大量新期刊，部分期刊被用作供引渠道，再以极短时间高被引说明这种安排的效果。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The function of these journals is to boost citation counts for certain authors.</p>\n<p>这些期刊的作用是提高特定作者的被引用次数。</p>\n</blockquote>\n<p>A中的authors通过其论文获得引用，正与供引渠道的受益方对应；来源期刊自身不获利也不妨碍这一作用。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>"},{"title":"B. help scholars publish articles at low cost","raw":"### B. help scholars publish articles at low cost\n\n> 这些期刊的作用是帮助学者低成本发表文章。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\n来源期刊本身不获益，说的是供引安排中利益归谁；不等于学者付出的发表费用低。\n\n**出处：**\n\n> The advent of electronic publishing and authors' need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn't far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations t w cost","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The advent of electronic publishing and authors' need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn't far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.\n>\n> 电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。\n\n文章区分携带引用的期刊与在别处获引的论文，强调人为转移引用收益。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The function of these journals is to help scholars publish articles at low cost.\n>\n> 这些期刊的作用是帮助学者低成本发表文章。\n\nB需要发表收费或成本信息。期刊未从被引指标获益，不能据此推出向作者收费少。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"B","cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-B-0\"><blockquote>\n<p>这些期刊的作用是帮助学者低成本发表文章。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>来源期刊本身不获益，说的是供引安排中利益归谁；不等于学者付出的发表费用低。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些期刊的作用是帮助学者低成本发表文章。</p>\n</blockquote>\n<p><code>B</code>的<code>publish articles at low cost</code>涉及发表费用，第3段第五句的<code>is not profiting at all</code>也涉及获益，需要核对没有获益的是谁；同一句紧接着的<code>providing citations to other journals</code>说明这些期刊实际在做什么。</p>\n<p>原文的<code>is not profiting at all</code>以这家期刊为主语，破折号后立即说明它只是向其他期刊提供引用，所以这里是在区分提供引用的期刊与得到引用的期刊。<code>B</code>的<code>publish articles at low cost</code>以学者为受益者，主张这些期刊帮助他们降低发表成本。期刊本身未获益并不说明作者支付费用少；原文给出的作用是向外提供引用，<code>B</code>却将它改为替作者降低发表成本。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。</p>\n</blockquote>\n<p>文章区分携带引用的期刊与在别处获引的论文，强调人为转移引用收益。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The function of these journals is to help scholars publish articles at low cost.</p>\n<p>这些期刊的作用是帮助学者低成本发表文章。</p>\n</blockquote>\n<p>B需要发表收费或成本信息。期刊未从被引指标获益，不能据此推出向作者收费少。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. instruct first-time contributors in citation","raw":"### C. instruct first-time contributors in citation\n\n> 这些期刊的作用是指导首次投稿者引用文献。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\n这些期刊让文章集中引用指定论文，原段没有教新投稿者如何引用，也没有限定首次投稿。\n\n**出处：**\n\n> The advent of electronic publishing and authors' need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn't far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-38-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-C-0\"><blockquote>\n<p>这些期刊的作用是指导首次投稿者引用文献。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>这些期刊让文章集中引用指定论文，原段没有教新投稿者如何引用，也没有限定首次投稿。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n</section>"},{"title":"C. instruct first-time contributors in citation","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 这些期刊的作用是指导首次投稿者引用文献。\n\n`C`的`instruct first-time contributors`把期刊写成教学者；回看第3段第三句的`every single article`和第五句的`providing citations to other journals`，这两处分别说明期刊里的文章怎样引用，以及这种引用供给谁，要检查它们是否是在指导初次投稿者。\n\n原文先说明一期中的文章可能集中引用特定论文，再写`providing citations to other journals`，将期刊的作用明确落在向其他期刊提供引用上。`C`的`instruct first-time contributors`却把这一作用写成指导首次投稿者学会引用。前者已经在生产能被其他论文计入的引用，后者是向新人传授引用方法，动作和受益对象都发生了变化；文章被用来引用特定论文，也不能推出这些文章出自首次投稿的人。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-C-0\"><blockquote>\n<p>这些期刊的作用是指导首次投稿者引用文献。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>这些期刊让文章集中引用指定论文，原段没有教新投稿者如何引用，也没有限定首次投稿。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The bir lished.\n>\n> 电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。\n\nmilk cows比喻供引来源，后面用内容无关与高被引量说明它们服务于指标操纵。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The function of these journals is to instruct first-time contributors in citation.\n>\n> 这些期刊的作用是指导首次投稿者引用文献。\n\nC需要培训活动及初次投稿人群。把文章塞入指定引用与教授规范引用，目的和受众都不同。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"C","cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-C-0\"><blockquote>\n<p>这些期刊的作用是指导首次投稿者引用文献。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>这些期刊让文章集中引用指定论文，原段没有教新投稿者如何引用，也没有限定首次投稿。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些期刊的作用是指导首次投稿者引用文献。</p>\n</blockquote>\n<p><code>C</code>的<code>instruct first-time contributors published.</p>\n</blockquote>\n</section>"},{"title":"D. increase the readership of new journals","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 这些期刊的作用是增加新期刊的读者人数。\n\n`D`的`increase the readership`要求找到读者人数增长的结果；第3段开头有`new journals`，末句的`accrue more than 150 citations`则给出某种数量增长，所以回看它所增长的是读者还是引用。\n\n原文用每篇文章集中引用特定论文，解释一篇论文怎样`accrue more than 150 citations`，增加的是该论文被其他文章引用的次数。`D`的`increase the readership`改成新期刊获得更多读者，把论文的引用次数变成期刊的读者人数。引用条目可以被反复加入文章，原文并没有把这种加入过程与更多人阅读新期刊连接起来，因此所述结果不能这样替换。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-38-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>这些期刊的作用是增加新期刊的读者人数。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文统计的是论文得到的引用次数，D改成新期刊的读者人数；被引增长不能直接换算成阅读人数增长。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些期刊的作用是增加新期刊的读者人数。</p>\n</blockquote>\n<p><code>D</code>的<code>increase the readership</code>要求找到读者人数增长的结果；第3段开头有<code>new journals</code>，末句的<code>accrue more than 150 citations</code>则给出某种数量增长，所以回看它所增长的是读者还是引用。</p>\n<p>原文用每篇文章集中引用特定论文，解释一篇论文怎样<code>accrue more than 150 citations</code>，增加的是该论文被其他文章引用的次数。<code>D</code>的<code>increase the readership</code>改成新期刊获得更多读者，把论文的引用次数变成期刊的读者人数。引用条目可以被反复加入文章，原文并没有把这种加入过程与更多人阅读新期刊连接起来，因此所述结果不能这样替换。</p>\n</section>"},{"title":"D. increase the readership of new journals","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The advent of electronic publishing and authors' need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn't far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.\n>\n> 电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。\n\n作者明确来源期刊并非受益者，而是向其他地方的论文供给引用，落点在目标论文指标。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The function of these journals is to increase the readership of new journals.\n>\n> 这些期刊的作用是增加新期刊的读者人数。\n\nD需要读者扩大的证据。引用即使出现在很多文章里，也可能内容无关，不能据此证明新期刊吸引更多读者。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"38","option":"D","cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-38-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-38-option-D-0\"><blockquote>\n<p>这些期刊的作用是增加新期刊的读者人数。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文统计的是论文得到的引用次数，D改成新期刊的读者人数；被引增长不能直接换算成阅读人数增长。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些期刊的作用是增加新期刊的读者人数。</p>\n</blockquote>\n<p><code>D</code>的<code>increase the readership</code>要求找到读者人数增长的结果；第3段开头有<code>new journals</code>，末句的<code>accrue more than 150 citations</code>则给出某种数量增长，所以回看它所增长的是读者还是引用。</p>\n<p>原文用每篇文章集中引用特定论文，解释一篇论文怎样<code>accrue more than 150 citations</code>，增加的是该论文被其他文章引用的次数。<code>D</code>的<code>increase the readership</code>改成新期刊获得更多读者，把论文的引用次数变成期刊的读者人数。引用条目可以被反复加入文章，原文并没有把这种加入过程与更多人阅读新期刊连接起来，因此所述结果不能这样替换。</p>\n</section><section class=\"revealPart\" id=\"focus-question-38-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。</p>\n</blockquote>\n<p>作者明确来源期刊并非受益者，而是向其他地方的论文供给引用，落点在目标论文指标。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The function of these journals is to increase the readership of new journals.</p>\n<p>这些期刊的作用是增加新期刊的读者人数。</p>\n</blockquote>\n<p>D需要读者扩大的证据。引用即使出现在很多文章里，也可能内容无关，不能据此证明新期刊吸引更多读者。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"38题结论","raw":"### 38题结论\n\n> **38. A**\n\n- A：每篇文章都引用指定论文，甚至内容无关，结果目标论文一年可累积150多次引用；A概括特定作者因此增加被引数。\n- B：来源期刊本身不获益，说的是供引安排中利益归谁；不等于学者付出的发表费用低。\n- C：这些期刊让文章集中引用指定论文，原段没有教新投稿者如何引用，也没有限定首次投稿。\n- D：原文统计的是论文得到的引用次数，D改成新期刊的读者人数；被引增长不能直接换算成阅读人数增长。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"38题","focus":[150,952,1344,369],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"38","questionConclusion":true},"html":"<blockquote>\n<p><strong>38. A</strong></p>\n</blockquote>\n<ul>\n<li>A：每篇文章都引用指定论文，甚至内容无关，结果目标论文一年可累积150多次引用；A概括特定作者因此增加被引数。</li>\n<li>B：来源期刊本身不获益，说的是供引安排中利益归谁；不等于学者付出的发表费用低。</li>\n<li>C：这些期刊让文章集中引用指定论文，原段没有教新投稿者如何引用，也没有限定首次投稿。</li>\n<li>D：原文统计的是论文得到的引用次数，D改成新期刊的读者人数；被引增长不能直接换算成阅读人数增长。</li>\n</ul>\n"},{"title":"39题 · 题干、题型与核心出处","raw":"## 39题\n\n> What can be learned about Scopus from the last two paragraphs?\n>\n> 从最后两段可以了解到斯科普斯的什么情况？\n\n### 题型\n\n推断题：用必要数据判断识别能力，区分现有能力、实际结果和创办目的。\n\n题干明确限定the last two paragraphs，并给出Scopus这一数据库名称，所以完整读第4段和第5段：前一段写引用操纵的实例及数据库中的问题，后一段写数据库掌握的数据和作者可以采取的行动。\n\n### 核心出处\n\n> was able to use at least 15 journals as citation providers to articles published by five scientists at three universities.\n>\n> The problem is rampant in Scopus, which includes a high number of the new \"international\" journals.\n>\n> Scopus itself has all the data necessary to detect this malpractice.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"39","questionIntro":true},"html":"<blockquote>\n<p>What can be learned about Scopus from the last two paragraphs?</p>\n<p>从最后两段可以了解到斯科普斯的什么情况？</p>\n</blockquote>\n<h3>题型</h3>\n<p>推断题：用必要数据判断识别能力，区分现有能力、实际结果和创办目的。</p>\n<p>题干明确限定the last two paragraphs，并给出Scopus这一数据库名称，所以完整读第4段和第5段：前一段写引用操纵的实例及数据库中的问题，后一段写数据库掌握的数据和作者可以采取的行动。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>was able to use at least 15 journals as citation providers to articles published by five scientists at three universities.</p>\n<p>The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals.</p>\n<p>Scopus itself has all the data necessary to detect this malpractice.</p>\n</blockquote>\n"},{"title":"A. It fosters competition among citation providers.","raw":"### A. It fosters competition among citation providers.\n\n> Scopus促进引用提供者之间的竞争。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n15种期刊被同一个人用来给特定学者供引，表示多方参与操纵，并未写这些期刊相互竞争或Scopus促进竞争。\n\n**出处：**\n\n> How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, which includes a high number of the new \"international\" journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.\n> Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-39-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>Scopus促进引用提供者之间的竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>15种期刊被同一个人用来给特定学者供引，表示多方参与操纵，并未写这些期刊相互竞争或Scopus促进竞争。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.\nScopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n</section>"},{"title":"A. It fosters competition among citation providers.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Scopus促进引用提供者之间的竞争。\n\n`A`的`fosters competition among citation providers`要查数据库与引用提供者的关系；第4段第二句有`use at least 15 journals as citation providers`，第三句又写`The problem is rampant in Scopus`，因此合看个人如何使用期刊，以及数据库在此事中处于什么位置。\n\n原文的`use at least 15 journals as citation providers`说一个人利用至少15种期刊给特定科学家的文章提供引用；接着指出这一操纵问题在数据库中猖獗。期刊在这里共同被某个人使用，数据库则是问题发生严重的地方。\n\n`A`的`fosters competition among citation providers`把数据库写成推动者，又把这些期刊的关系改成彼此竞争。\n\n问题存在于数据库，不能推出数据库促成了提供者之间的竞争；原例也没有把15种期刊写成相互争夺的主体。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"39题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"39","option":"A","cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-39-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-39-option-A-0\"><blockquote>\n<p>Scopus促进引用提供者之间的竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>15种期刊被同一个人用来给特定学者供引，表示多方参与操纵，并未写这些期刊相互竞争或Scopus促进竞争。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.\nScopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-39-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回  oblige and do report the request to the journal.</p>\n<p>do not oblige and do report the request to the journal.</p>\n<p>asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n"},{"title":"A. Take legal action.","raw":"### A. Take legal action.\n\n> 作者遇到不当加引要求时应该采取法律行动。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n末句要求拒绝不当加引并向期刊报告，没有提出诉讼或其他法律程序。\n\n**出处：**\n\n> Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>作者遇到不当加引要求时应该采取法律行动。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>末句要求拒绝不当加引并向期刊报告，没有提出诉讼或其他法律程序。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n</section>"},{"title":"A. Take legal action.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者遇到不当加引要求时应该采取法律行动。\n\n`A`的`Take legal action`是一种正式处理方式；第5段末句的`report the request to the journal`也说明作者该如何处理要求，因此回看该句指定的行动及报告对象。\n\n原文在作者收到增加不恰当参考文献的要求时，给出两个动作：不要照办，并`report the request to the journal`，即向期刊报告这一要求。`A`的`Take legal action`改成采取法律行动。向期刊说明所收到的不当要求，是在期刊这一接收方处报告情况；原文没有把它写成法律程序，也没有将处理对象交给司法途径。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>作者遇到不当加引要求时应该采取法律行动。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>末句要求拒绝不当加引并向期刊报告，没有提出诉讼或其他法律程序。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者遇到不当加引要求时应该采取法律行动。</p>\n</blockquote>\n<p><code>A</code>的<code>Take legal action</code>是一种正式处理方式；第5段末句的<code>report the request to the journal</code>也说明作者该如何处理要求，因此回看该句指定的行动及报告对象。</p>\n<p>原文在作者收到增加不恰当参考文献的要求时，给出两个动作：不要照办，并<code>report the request to the journal</code>，即向期刊报告这一要求。<code>A</code>的<code>Take legal action</code>改成采取法律行动。向期刊说明所收到的不当要求，是在期刊这一接收方处报告情况；原文没有把它写成法律程序，也没有将处理对象交给司法途径。</p>\n</section>"},{"title":"A. Take legal action.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.\n>\n> Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。\n\n结尾从数据库的识别条件转到作者本人遇到请求时能采取的行动，do not与do report形成明确指令。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> An author should take legal action.\n>\n> 作者遇到不当加引要求时应该采取法律行动。\n\nA需要法律行动的依据。向期刊报告可以揭露不当请求，但不必等于诉诸法律。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"A","cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-A-0\"><blockquote>\n<p>作者遇到不当加引要求时应该采取法律行动。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>末句要求拒绝不当加引并向期刊报告，没有提出诉讼或其他法律程序。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者遇到不当加引要求时应该采取法律行动。</p>\n</blockquote>\n<p><code>A</code>的<code>Take legal action</code>是一种正式处理方式；第5段末句的<code>report the request to the journal</code>也说明作者该如何处理要求，因此回看该句指定的行动及报告对象。</p>\n<p>原文在作者收到增加不恰当参考文献的要求时，给出两个动作：不要照办，并<code>report the request to the journal</code>，即向期刊报告这一要求。<code>A</code>的<code>Take legal action</code>改成采取法律行动。向期刊说明所收到的不当要求，是在期刊这一接收方处报告情况；原文没有把它写成法律程序，也没有将处理对象交给司法途径。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n<p>Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。</p>\n</blockquote>\n<p>结尾从数据库的识别条件转到作者本人遇到请求时能采取的行动，do not与do report形成明确指令。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>An author should take legal action.</p>\n<p>作者遇到不当加引要求时应该采取法律行动。</p>\n</blockquote>\n<p>A需要法律行动的依据。向期刊报告可以揭露不当请求，但不必等于诉诸法律。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. Demand an apology.","raw":"### B. Demand an apology.\n\n> 作者遇到不当加引要求时应该要求对方道歉。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\n报告请求是让期刊知悉问题，要求道歉则让提出请求者作出另一种回应，原文没有后一要求。\n\n**出处：**\n\n> Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-B-0\"><blockquote>\n<p>作者遇到不当加引要求时应该要求对方道歉。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>报告请求是让期刊知悉问题，要求道歉则让提出请求者作出另一种回应，原文没有后一要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n</section>"},{"title":"B. Demand an apology.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者遇到不当加引要求时应该要求对方道歉。\n\n`B`的`Demand an apology`是作者向操纵者提出要求；第5段末句的`do not oblige and do report`规定作者收到不当要求后的回应，所以回看这两个动作及`report`后所接的对象。\n\n原文的`do not oblige and do report`让作者先不服从不当要求，再把该要求报告给期刊：作者向期刊提供情况。`B`的`Demand an apology`则让作者向对方索取道歉：作者要求对方作出回应。原句没有把拒绝配合写成要求道歉，也没有把报告要求改成要求对方道歉；两个动作的对象和内容都不同。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-40-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-B-0\"><blockquote>\n<p>作者遇到不当加引要求时应该要求对方道歉。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>报告请求是让期刊知悉问题，要求道歉则让提出请求者作出另一种回应，原文没有后一要求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者遇到不当加引要求时应该要求对方道歉。</p>\n</blockquote>\n<p><code>B</code>的<code>Demand an apology</code>是作者向操纵者提出要求；第5段末句的<code>do not oblige and do report</code>规定作者收到不当要求后的回应，所以回看这两个动作及<code>report</code>后所接的对象。</p>\n<p>原文的<code>do not oblige and do report</code>让作者先不服从不当要求，再把该要求报告给期刊：作者向期刊提供情况。<code>B</code>的<code>Demand an apology</code>则让作者向对方索取道歉：作者要求对方作出回应。原句没有把拒绝配合写成要求道歉，也没有把报告要求改成要求对方道歉；两个动作的对象和内容都不同。</p>\n</section>"},{"title":"B. Demand an apology.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.\n>\n> Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。\n\n作者被要求不要照办，并把不当请求报告给期刊；重点是阻止配合和通报。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> An author should demand an apology.\n>\n> 作者遇到不当加引要求时应该要求对方道歉。\n\nB需要向对方索取道歉的表述。指出不当行为与索赔、道歉等后续结果不能混为一谈。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"B","cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-B-0\"><blockquote>\n<p>作者遇到不当加引要求时应该要求对方道歉。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>报告请求是让期刊知悉问题，要求道歉则让提出请求者作出另一种回应，原文没有后一要求。</p>\n<p><strong> a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.\n>\n> Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。\n\n结尾列编辑、审稿人和服务机构三种请求来源，再对作者给统一建议。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> An author should seek professional advice.\n>\n> 作者遇到不当加引要求时应该寻求专业建议。\n\nC需要作者另行咨询专家的安排，不能因段中出现专业服务名称就推成应寻求专业意见。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"C","cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-C-0\"><blockquote>\n<p>作者遇到不当加引要求时应该寻求专业建议。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>support service是可能提出不当请求的一方，不是结尾建议作者求助的专业顾问；行动是拒绝并报告。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者遇到不当加引要求时应该寻求专业建议。</p>\n</blockquote>\n<p><code>C</code>的<code>Seek professional advice</code>把作者的下一步写成向专业人士问计；第5段末句的<code>report the request to the journal</code>也规定了作者向外联系时应做什么，所以检查原句联系期刊的目的与内容。</p>\n<p>原文已经直接告诉作者不要配合，并<code>report the request to the journal</code>，即把收到的要求报告期刊。这里作者传递的是发生了什么事，而不是提出一个问题请对方提供处理建议。</p>\n<p><code>C</code>的<code>Seek professional advice</code>却把作者行动改成向专业人士求助问计。</p>\n<p>期刊参与接收报告，并不能自动把这一步变成专业咨询；原文还把编辑、审稿人和支持服务机构列为可能提出不当要求的人，并未指定其中谁应成为被求教者。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n<p>Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。</p>\n</blockquote>\n<p>结尾列编辑、审稿人和服务机构三种请求来源，再对作者给统一建议。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>An author should seek professional advice.</p>\n<p>作者遇到不当加引要求时应该寻求专业建议。</p>\n</blockquote>\n<p>C需要作者另行咨询专家的安排，不能因段中出现专业服务名称就推成应寻求专业意见。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. Reveal their misconduct.","raw":"### D. Reveal their misconduct.\n\n> 作者遇到不当加引要求时应该揭露对方的不当行为。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\ndo report the request to the journal要求把不当加引要求告知期刊，D的Reveal their misconduct概括揭露这一行为。\n\n**出处：**\n\n> Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-40-option-D-0","html":"<section class=\"revealPart
