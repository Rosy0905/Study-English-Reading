the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学家的职业发展可由以下因素决定：他们的论文被引用多少次。</p>\n</blockquote>\n<p><code>B</code>的<code>their papers are cited</code>是论文被别人引用，第1段末句的<code>citations attracted by these papers</code>也是论文获得引用，并且说明这对职业生涯的影响；因此回看第1段末句。</p>\n<p>原文先把科学家的职业生涯与其论文数量、声望相连，再用<code>but even more so</code>指出，它更取决于<code>citations attracted by these papers</code>，也就是论文获得的引用。<code>B</code>的<code>their papers are cited</code>将论文写成被引用的对象，<code>how many times</code>计算这样的引用发生多少次，正好表达了论文获得引用的情况。原文把这件事写在<code>depend on</code>之后，能够接上题干所问的职业生涯决定因素。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n<p>科学论文记录研究进展。每年有数百万篇论文发表于三万多种期刊。科学共同体用多种方式衡量论文质量，包括期刊被认为具有的质量（体现为影响因子），以及具体论文累积的被引用次数。科学家的职业发展和机构声誉依赖其论文的数量与声望，而更依赖这些论文吸引来的引用。</p>\n</blockquote>\n<p>质量评价从期刊声望转到具体论文被引，随后even more so突出后者对职业与机构声誉的影响。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Scientists’ careers can be determined by how many times their papers are cited.</p>\n<p>科学家的职业发展可由以下因素决定：他们的论文被引用多少次。</p>\n</blockquote>\n<p>B保留了论文是被引对象这一关系，也对应even more so的强调；不必把它推成被引次数是职业发展的唯一因素。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. the prestige of the people they work with</h3>\n<blockquote>\n<p>科学家的职业发展可由以下因素决定：与他们共事的人的声望。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>prestige修饰的是科学家产出的papers，不是与其共事的人。C把论文声望转成同事声望。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学家的职业发展可由以下因素决定：与他们共事的人的声望。</p>\n</blockquote>\n<p><code>C</code>的<code>people they work with</code>把声望归给共事者；第1段末句出现<code>prestige of the papers they produce</code>，确实把声望接到职业生涯上，因而需要回看这里声望属于谁。</p>\n<p>原文写<code>prestige of the papers they produce</code>，声望属于科学家产出的论文，论文数量和声望影响其职业生涯。<code>C</code>写<code>people they work with</code>，把拥有声望的对象换成共事的人。共同出现声望这个概念，并不能把论文的声望改成同事的声望；原句已经用<code>of the papers</code>明确限定了声望所归属的对象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n<p>科学论文记录研究进展。每年有数百万篇论文发表于三万多种期刊。科学共同体用多种方式衡量论文质量，包括期刊被认为具有的质量（体现为影响因子），以及具体论文累积的被引用次数。科学家的职业发展和机构声誉依赖其论文的数量与声望，而更依赖这些论文吸引来的引用。</p>\n</blockquote>\n<p>作者由论文的数量、发表声望和被引情况说明科研评价，未转向研究团队的人际资源。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Scientists’ careers can be determined by the prestige of the people they work with.</p>\n<p>科学家的职业发展可由以下因素决定：与他们共事的人的声望。</p>\n</blockquote>\n<p>C需要同事地位能影响其职业的依据。原句虽有prestige，却不能把修饰对象从papers移到people。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. the status they have in scientific circles</h3>\n<blockquote>\n<p>科学家的职业发展可由以下因素决定：他们在科学界的地位。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>首段用论文指标解释职业和机构声誉怎样受到影响，D却把科学家已有的圈内地位作为职业发展的决定因素。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学家的职业发展可由以下因素决定：他们在科学界的地位。</p>\n</blockquote>\n<p><code>D</code>的<code>status they have in scientific circles</code>说的是科学家已有的地位；回到第1段末句，原文用<code>depend on the number and prestige</code>说明职业生涯所依赖的因素，需要检查这里是否把科学家自身的地位放在原因的位置。</p>\n<p>原文用<code>depend on the number and prestige</code>把职业生涯接到科学家产出的论文上，后面又增加论文所获引用这一因素。声望在这里修饰论文，而机构声誉与科学家职业生涯并列，都是受论文表现影响的事项。</p>\n<p><code>D</code>的<code>status they have in scientific circles</code>却以科学家在科学界的地位作为职业生涯的决定因素，把关于论文表现如何影响人的职业发展的陈述，改成了个人地位如何影响其职业发展。</p>\n<p>原句没有建立这条由个人地位通向职业生涯的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n<p>科学论文记录研究进展。每年有数百万篇论文发表于三万多种期刊。科学共同体用多种方式衡量论文质量，包括期刊被认为具有的质量（体现为影响因子），以及具体论文累积的被引用次数。科学家的职业发展和机构声誉依赖其论文的数量与声望，而更依赖这些论文吸引来的引用。</p>\n</blockquote>\n<p>depend on之后列的是论文产出及被引，之前是职业与机构声誉，因果两端有明确分工。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Scientists’ careers can be determined by the status they have in scientific circles.</p>\n<p>科学家的职业发展可由以下因素决定：他们在科学界的地位。</p>\n</blockquote>\n<p>D需要先有圈内地位、再由地位影响职业的关系。原段没有建立这条关系，不能因都涉及学术声誉就选它。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>36题结论</h3>\n<blockquote>\n<p><strong>36. B</strong></p>\n</blockquote>\n<ul>\n<li>A：citations attracted by these papers是论文吸引来的引用，即别人引用它们；A的contain说论文里面引用了多少别人的文献，把方向倒过来了。</li>\n<li>B：论文累积的citations与attracted by these papers都指被引用次数，B的are cited以被动式表达同一方向。</li>\n<li>C：prestige修饰的是科学家产出的papers，不是与其共事的人。C把论文声望转成同事声望。</li>\n<li>D：首段用论文指标解释职业和机构声誉怎样受到影响，D却把科学家已有的圈内地位作为职业发展的决定因素。</li>\n</ul>\n<h2>37题</h2>\n<blockquote>\n<p>The support service consultancies tend to  ______.</p>\n<p>支持服务咨询机构往往会做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节理解题：分别核对算法研究者与咨询机构的动作，不能混接相邻句的信息。</p>\n<p>题干直接点出support service consultancies。第2段末句出现这一机构名称，因此把第2段从引用联盟的介绍读到咨询机构的做法。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>provide language and other editorial support to individual authors and to journals</p>\n<p>sometimes advise contributors to add a number of citations to their articles.</p>\n<p>In 2016, researchers developed an algorithm to recognize suspicious citation patterns,</p>\n</blockquote>\n<h3>A. recommend journals to their clients</h3>\n<blockquote>\n<p>支持服务咨询机构往往会向客户推荐期刊。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>咨询机构为作者和期刊提供语言、编辑支持，涉及期刊不等于向客户推荐期刊；原文具体写的是建议加引用。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>支持服务咨询机构往往会向客户推荐期刊。</p>\n</blockquote>\n<p><code>A</code>的<code>recommend journals</code>把期刊当作推荐对象；第2段末句既有<code>to individual authors and to journals</code>，又有<code>advise contributors</code>，分别写服务对象和建议内容，需要回看这两处怎样连接。</p>\n<p>原文的<code>to individual authors and to journals</code>接在<code>provide support</code>后面，说明个人作者和期刊都接受这些机构的支持；随后明确写出的建议，是让投稿者在文章中增加一些引用。<code>A</code>的<code>recommend journals</code>则把期刊从接受支持的一方，改成机构推荐给客户的对象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n<p>期刊、作者和机构合谋抬高引用数的引用联盟由来已久。2016年，研究者开发算法识别可疑引用模式，包括作者群体过度互引、期刊群体频繁互引以提高影响因子。最近又出现一种表现：为作者和期刊提供语言及编辑支持的服务咨询机构，有时会建议投稿者给文章增添一些引用。</p>\n</blockquote>\n<p>第二段先述相互引用的联盟，再用Recently转向咨询服务介入的另一种形式。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Support service consultancies tend to recommend journals to their clients.</p>\n<p>支持服务咨询机构往往会向客户推荐期刊。</p>\n</blockquote>\n<p>A需要推荐投稿去处的服务内容。给期刊提供支持与给客户推荐期刊的动作、接受者均不同。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. list citation patterns for their clients</h3>\n<blockquote>\n<p>支持服务咨询机构往往会为客户列出引用模式。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>识别可疑引用模式的是2016年研究者开发的算法，B换成咨询机构为客户列出这些模式。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>支持服务咨询机构往往会为客户列出引用模式。</p>\n</blockquote>\n<p><code>B</code>的<code>list citation patterns</code>指向第2段第二句的<code>recognize suspicious citation patterns</code>，因为两处都谈识别或列出引用的模式；再与末句的<code>advise contributors</code>合看，辨清研究者和咨询机构分别做了什么。</p>\n<p>原文的<code>recognize suspicious citation patterns</code>属于研究者开发算法的用途，目的是识别可疑引用模式；咨询机构在末句的动作则是建议投稿者增加引用。<code>B</code>的<code>list citation patterns</code>把引用模式接成咨询机构替客户列出的内容，既将算法识别的任务转给咨询机构，又加上了向客户列示这一服务关系。研究者检查哪些引用值得怀疑，与咨询机构要求作者增加引用，是段中两项不同活动。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n<p>期刊、作者和机构合谋抬高引用数的引用联盟由来已久。2016年，研究者开发算法识别可疑引用模式，包括作者群体过度互引、期刊群体频繁互引以提高影响因子。最近又出现一种表现：为作者和期刊提供语言及编辑支持的服务咨询机构，有时会建议投稿者给文章增添一些引用。</p>\n</blockquote>\n<p>算法用来辨认互引现象，后来提到的咨询机构则可能参与增加引用，两个主体的作用不同。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Support service consultancies tend to list citation patterns for their clients.</p>\n<p>支持服务咨询机构往往会为客户列出引用模式。</p>\n</blockquote>\n<p>B需要咨询机构提供引用模式清单的证据，不能把前一句研究者的识别工作移给后一句服务机构。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. ask authors to include extra citations</h3>\n<blockquote>\n<p>支持服务咨询机构往往会请作者加入额外引用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>advise contributors to add a number of citations与ask authors to include extra citations都说让投稿者增添引用，C保留行为与对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>支持服务咨询机构往往会请作者加入额外引用。</p>\n</blockquote>\n<p><code>C</code>的<code>include extra citations</code>对应第2段末句的<code>add a number of citations</code>，都是让文章增加引用；该句以咨询机构为主语、投稿者为建议对象，因此回看这句完整的建议内容。</p>\n<p>原文写这些机构有时建议投稿者<code>add a number of citations</code>，即往已有文章中加一些引用。<code>C</code>写<code>ask authors to include extra citations</code>，将投稿者称为作者，将增加引用表达为加入额外引用，人物与动作对象没有改变。<code>ask</code>在这里是提出要求，并没有说强迫作者照做；它可以概括机构向投稿者提出增加引用的建议。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n<p>期刊、作者和机构合谋抬高引用数的引用联盟由来已久。2016年，研究者开发算法识别可疑引用模式，包括作者群体过度互引、期刊群体频繁互引以提高影响因子。最近又出现一种表现：为作者和期刊提供语言及编辑支持的服务咨询机构，有时会建议投稿者给文章增添一些引用。</p>\n</blockquote>\n<p>咨询机构先以语言和编辑服务身份出现，随后sometimes advise说明它们还可能提出增加引用的建议。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Support service consultancies tend to ask authors to include extra citations.</p>\n<p>支持服务咨询机构往往会请作者加入额外引用。</p>\n</blockquote>\n<p>ask在这里不必读成强迫，也不能推成每家咨询机构都会这样做；C概括文中指出的这类服务行为。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. advise contributors to cite each other</h3>\n<blockquote>\n<p>支持服务咨询机构往往会建议投稿者相互引用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>第二句确有作者相互引用，但那是算法辨认的联盟模式；咨询机构这一句只说建议加引用，并未说让作者彼此互引。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>支持服务咨询机构往往会建议投稿者相互引用。</p>\n</blockquote>\n<p><code>D</code>的<code>cite each other</code>与第2段第二句的<code>cite one another</code>都是相互引用，所以先核对第二句是谁在这样做；再看末句的<code>add a number of citations</code>，确认咨询机构给投稿者的建议是否带有相互这一关系。</p>\n<p>原文的<code>cite one another</code>描写一类作者群体已经存在的可疑引用模式。随后写咨询机构建议投稿者<code>add a number of citations</code>，只说明建议增加引用，没有把这些投稿者组成一个彼此回引的群体。</p>\n<p><code>D</code>的<code>cite each other</code>把前一句作者群体的相互引用接到后一句咨询机构的建议上。</p>\n<p>增加若干引用可以只指向某些文章，并不自行形成你引我、我引你的相互关系，因此这两句不能这样合并。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n<p>期刊、作者和机构合谋抬高引用数的引用联盟由来已久。2016年，研究者开发算法识别可疑引用模式，包括作者群体过度互引、期刊群体频繁互引以提高影响因子。最近又出现一种表现：为作者和期刊提供语言及编辑支持的服务咨询机构，有时会建议投稿者给文章增添一些引用。</p>\n</blockquote>\n<p>Recently, another expression转入另一表现，不能把前一种模式的全部关系自动带给后一种。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Support service consultancies tend to advise contributors to cite each other.</p>\n<p>支持服务咨询机构往往会建议投稿者相互引用。</p>\n</blockquote>\n<p>D需要咨询机构安排双方互引的依据。extra citations只说明引用增加，each other另加了双向互惠关系。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>37题结论</h3>\n<blockquote>\n<p><strong>37. C</strong></p>\n</blockquote>\n<ul>\n<li>A：咨询机构为作者和期刊提供语言、编辑支持，涉及期刊不等于向客户推荐期刊；原文具体写的是建议加引用。</li>\n<li>B：识别可疑引用模式的是2016年研究者开发的算法，B换成咨询机构为客户列出这些模式。</li>\n<li>C：advise contributors to add a number of citations与ask authors to include extra citations都说让投稿者增添引用，C保留行为与对象。</li>\n<li>D：第二句确有作者相互引用，但那是算法辨认的联盟模式；咨询机构这一句只说建议加引用，并未说让作者彼此互引。</li>\n</ul>\n<h2>38题</h2>\n<blockquote>\n<p>The function of the “milk cow” journals is to  ______.</p>\n<p>“奶牛”期刊的作用是什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>功能概括题：追踪引用从哪种期刊流向哪些论文，再确定谁从指标中受益。</p>\n<p>题干给出“milk cow” journals，第3段第三句用milk cows描述一类期刊。把第3段从新期刊产生的背景读到最后一句引用次数增加的结果。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>every single article in an issue may cite a specific paper or a series of papers.</p>\n<p>Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>is not profiting at all—it is just providing citations to other journals.</p>\n</blockquote>\n<h3>A. boost citation counts for certain authors</h3>\n<blockquote>\n<p>这些期刊的作用是提高特定作者的被引用次数。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>每篇文章都引用指定论文，甚至内容无关，结果目标论文一年可累积150多次引用；A概括特定作者因此增加被引数。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些期刊的作用是提高特定作者的被引用次数。</p>\n</blockquote>\n<p><code>A</code>的<code>boost citation counts</code>要找引用次数增长的结果，第3段末句写<code>accrue more than 150 citations</code>；<code>certain authors</code>还需要与第三句的<code>a specific paper or a series of papers</code>合看，确认引用集中指向谁的作品。</p>\n<p>原文先写一期中的每篇文章都可能引用特定论文或一系列论文，继而说明这种做法能使一篇文章在发表当年<code>accrue more than 150 citations</code>。引用集中到特定论文，其作者也随之获得更多被引用记录。<code>A</code>的<code>boost citation counts</code>概括这个增长结果，<code>certain authors</code>则概括这些特定论文背后的作者；这不是说所有作者都获益，而是指引用流向的那些作者。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。</p>\n</blockquote>\n<p>电子出版带来大量新期刊，部分期刊被用作供引渠道，再以极短时间高被引说明这种安排的效果。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The function of these journals is to boost citation counts for certain authors.</p>\n<p>这些期刊的作用是提高特定作者的被引用次数。</p>\n</blockquote>\n<p>A中的authors通过其论文获得引用，正与供引渠道的受益方对应；来源期刊自身不获利也不妨碍这一作用。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. help scholars publish articles at low cost</h3>\n<blockquote>\n<p>这些期刊的作用是帮助学者低成本发表文章。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>来源期刊本身不获益，说的是供引安排中利益归谁；不等于学者付出的发表费用低。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些期刊的作用是帮助学者低成本发表文章。</p>\n</blockquote>\n<p><code>B</code>的<code>publish articles at low cost</code>涉及发表费用，第3段第五句的<code>is not profiting at all</code>也涉及获益，需要核对没有获益的是谁；同一句紧接着的<code>providing citations to other journals</code>说明这些期刊实际在做什么。</p>\n<p>原文的<code>is not profiting at all</code>以这家期刊为主语，破折号后立即说明它只是向其他期刊提供引用，所以这里是在区分提供引用的期刊与得到引用的期刊。<code>B</code>的<code>publish articles at low cost</code>以学者为受益者，主张这些期刊帮助他们降低发表成本。期刊本身未获益并不说明作者支付费用少；原文给出的作用是向外提供引用，<code>B</code>却将它改为替作者降低发表成本。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。</p>\n</blockquote>\n<p>文章区分携带引用的期刊与在别处获引的论文，强调人为转移引用收益。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The function of these journals is to help scholars publish articles at low cost.</p>\n<p>这些期刊的作用是帮助学者低成本发表文章。</p>\n</blockquote>\n<p>B需要发表收费或成本信息。期刊未从被引指标获益，不能据此推出向作者收费少。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. instruct first-time contributors in citation</h3>\n<blockquote>\n<p>这些期刊的作用是指导首次投稿者引用文献。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>这些期刊让文章集中引用指定论文，原段没有教新投稿者如何引用，也没有限定首次投稿。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些期刊的作用是指导首次投稿者引用文献。</p>\n</blockquote>\n<p><code>C</code>的<code>instruct first-time contributors</code>把期刊写成教学者；回看第3段第三句的<code>every single article</code>和第五句的<code>providing citations to other journals</code>，这两处分别说明期刊里的文章怎样引用，以及这种引用供给谁，要检查它们是否是在指导初次投稿者。</p>\n<p>原文先说明一期中的文章可能集中引用特定论文，再写<code>providing citations to other journals</code>，将期刊的作用明确落在向其他期刊提供引用上。<code>C</code>的<code>instruct first-time contributors</code>却把这一作用写成指导首次投稿者学会引用。前者已经在生产能被其他论文计入的引用，后者是向新人传授引用方法，动作和受益对象都发生了变化；文章被用来引用特定论文，也不能推出这些文章出自首次投稿的人。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。</p>\n</blockquote>\n<p>milk cows比喻供引来源，后面用内容无关与高被引量说明它们服务于指标操纵。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The function of these journals is to instruct first-time contributors in citation.</p>\n<p>这些期刊的作用是指导首次投稿者引用文献。</p>\n</blockquote>\n<p>C需要培训活动及初次投稿人群。把文章塞入指定引用与教授规范引用，目的和受众都不同。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. increase the readership of new journals</h3>\n<blockquote>\n<p>这些期刊的作用是增加新期刊的读者人数。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文统计的是论文得到的引用次数，D改成新期刊的读者人数；被引增长不能直接换算成阅读人数增长。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>这些期刊的作用是增加新期刊的读者人数。</p>\n</blockquote>\n<p><code>D</code>的<code>increase the readership</code>要求找到读者人数增长的结果；第3段开头有<code>new journals</code>，末句的<code>accrue more than 150 citations</code>则给出某种数量增长，所以回看它所增长的是读者还是引用。</p>\n<p>原文用每篇文章集中引用特定论文，解释一篇论文怎样<code>accrue more than 150 citations</code>，增加的是该论文被其他文章引用的次数。<code>D</code>的<code>increase the readership</code>改成新期刊获得更多读者，把论文的引用次数变成期刊的读者人数。引用条目可以被反复加入文章，原文并没有把这种加入过程与更多人阅读新期刊连接起来，因此所述结果不能这样替换。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p>电子出版的出现和作者寻找发表渠道的需要，催生数千种新期刊，掠夺性期刊的诞生也紧随其后。这些期刊可以充当供引的奶牛：一期中的每篇文章都可能引用某篇或某组指定论文，有时文章内容与引用完全无关。奇怪的是，编辑本应为之工作的来源期刊自身并不获益，只向其他期刊提供引用。这样的做法可让一篇文章在发表当年积累150多次引用。</p>\n</blockquote>\n<p>作者明确来源期刊并非受益者，而是向其他地方的论文供给引用，落点在目标论文指标。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The function of these journals is to increase the readership of new journals.</p>\n<p>这些期刊的作用是增加新期刊的读者人数。</p>\n</blockquote>\n<p>D需要读者扩大的证据。引用即使出现在很多文章里，也可能内容无关，不能据此证明新期刊吸引更多读者。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>38题结论</h3>\n<blockquote>\n<p><strong>38. A</strong></p>\n</blockquote>\n<ul>\n<li>A：每篇文章都引用指定论文，甚至内容无关，结果目标论文一年可累积150多次引用；A概括特定作者因此增加被引数。</li>\n<li>B：来源期刊本身不获益，说的是供引安排中利益归谁；不等于学者付出的发表费用低。</li>\n<li>C：这些期刊让文章集中引用指定论文，原段没有教新投稿者如何引用，也没有限定首次投稿。</li>\n<li>D：原文统计的是论文得到的引用次数，D改成新期刊的读者人数；被引增长不能直接换算成阅读人数增长。</li>\n</ul>\n<h2>39题</h2>\n<blockquote>\n<p>What can be learned about Scopus from the last two paragraphs?</p>\n<p>从最后两段可以了解到斯科普斯的什么情况？</p>\n</blockquote>\n<h3>题型</h3>\n<p>推断题：用必要数据判断识别能力，区分现有能力、实际结果和创办目的。</p>\n<p>题干明确限定the last two paragraphs，并给出Scopus这一数据库名称，所以完整读第4段和第5段：前一段写引用操纵的实例及数据库中的问题，后一段写数据库掌握的数据和作者可以采取的行动。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>was able to use at least 15 journals as citation providers to articles published by five scientists at three universities.</p>\n<p>The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals.</p>\n<p>Scopus itself has all the data necessary to detect this malpractice.</p>\n</blockquote>\n<h3>A. It fosters competition among citation providers.</h3>\n<blockquote>\n<p>Scopus促进引用提供者之间的竞争。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>15种期刊被同一个人用来给特定学者供引，表示多方参与操纵，并未写这些期刊相互竞争或Scopus促进竞争。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.\nScopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Scopus促进引用提供者之间的竞争。</p>\n</blockquote>\n<p><code>A</code>的<code>fosters competition among citation providers</code>要查数据库与引用提供者的关系；第4段第二句有<code>use at least 15 journals as citation providers</code>，第三句又写<code>The problem is rampant in Scopus</code>，因此合看个人如何使用期刊，以及数据库在此事中处于什么位置。</p>\n<p>原文的<code>use at least 15 journals as citation providers</code>说一个人利用至少15种期刊给特定科学家的文章提供引用；接着指出这一操纵问题在数据库中猖獗。期刊在这里共同被某个人使用，数据库则是问题发生严重的地方。</p>\n<p><code>A</code>的<code>fosters competition among citation providers</code>把数据库写成推动者，又把这些期刊的关系改成彼此竞争。</p>\n<p>问题存在于数据库，不能推出数据库促成了提供者之间的竞争；原例也没有把15种期刊写成相互争夺的主体。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.\nScopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n<p>这种引用操纵有多隐蔽？一次报告涉及同一人以作者、编辑和顾问等多种身份，至少使用15种期刊为三所大学五位科学家的论文供给引用。问题在Scopus中十分猖獗，它收录大量新国际期刊。事实上，被Scopus收录似乎成为这类引用操纵选择目标的一个条件。</p>\n<p>Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。</p>\n</blockquote>\n<p>第四段展示网络规模与数据库中的猖獗状况，第五段转向可检测的条件。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It fosters competition among citation providers.</p>\n<p>Scopus促进引用提供者之间的竞争。</p>\n</blockquote>\n<p>A需要数据库鼓励供引者争夺对象的关系。参与者多和竞争强不是同一件事。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. It has the capability to identify suspicious citations.</h3>\n<blockquote>\n<p>Scopus具备识别可疑引用的能力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>Scopus拥有检测这种不当行为所需的全部数据，B据此概括具备识别可疑引用的能力。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.\nScopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Scopus具备识别可疑引用的能力。</p>\n</blockquote>\n<p><code>B</code>的<code>capability to identify suspicious citations</code>对应第5段首句的<code>all the data necessary to detect this malpractice</code>，因为该句直接说明数据库具备查出不当行为所需的资料；再看下一句列出的引用警示信号，确认查出的具体问题。</p>\n<p>原文说数据库拥有<code>all the data necessary to detect this malpractice</code>，也就是查出这种不当引用行为所需的数据已经齐备；随后以文章在第一年被大量引用作为警示信号，说明可以从引用记录识别可疑情况。<code>B</code>的<code>capability to identify suspicious citations</code>概括的是具备这种识别能力，并没有声称数据库已经查出了所有违规案例。这与原文关于所需数据和识别信号的说明一致。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.\nScopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do  cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者遇到不当加引要求时应该要求对方道歉。</p>\n</blockquote>\n<p><code>B</code>的<code>Demand an apology</code>是作者向操纵者提出要求；第5段末句的<code>do not oblige and do report</code>规定作者收到不当要求后的回应，所以回看这两个动作及<code>report</code>后所接的对象。</p>\n<p>原文的<code>do not oblige and do report</code>让作者先不服从不当要求，再把该要求报告给期刊：作者向期刊提供情况。<code>B</code>的<code>Demand an apology</code>则让作者向对方索取道歉：作者要求对方作出回应。原句没有把拒绝配合写成要求道歉，也没有把报告要求改成要求对方道歉；两个动作的对象和内容都不同。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n<p>Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。</p>\n</blockquote>\n<p>作者被要求不要照办，并把不当请求报告给期刊；重点是阻止配合和通报。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>An author should demand an apology.</p>\n<p>作者遇到不当加引要求时应该要求对方道歉。</p>\n</blockquote>\n<p>B需要向对方索取道歉的表述。指出不当行为与索赔、道歉等后续结果不能混为一谈。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Seek professional advice.</h3>\n<blockquote>\n<p>作者遇到不当加引要求时应该寻求专业建议。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>support service是可能提出不当请求的一方，不是结尾建议作者求助的专业顾问；行动是拒绝并报告。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者遇到不当加引要求时应该寻求专业建议。</p>\n</blockquote>\n<p><code>C</code>的<code>Seek professional advice</code>把作者的下一步写成向专业人士问计；第5段末句的<code>report the request to the journal</code>也规定了作者向外联系时应做什么，所以检查原句联系期刊的目的与内容。</p>\n<p>原文已经直接告诉作者不要配合，并<code>report the request to the journal</code>，即把收到的要求报告期刊。这里作者传递的是发生了什么事，而不是提出一个问题请对方提供处理建议。</p>\n<p><code>C</code>的<code>Seek professional advice</code>却把作者行动改成向专业人士求助问计。</p>\n<p>期刊参与接收报告，并不能自动把这一步变成专业咨询；原文还把编辑、审稿人和支持服务机构列为可能提出不当要求的人，并未指定其中谁应成为被求教者。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n<p>Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。</p>\n</blockquote>\n<p>结尾列编辑、审稿人和服务机构三种请求来源，再对作者给统一建议。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>An author should seek professional advice.</p>\n<p>作者遇到不当加引要求时应该寻求专业建议。</p>\n</blockquote>\n<p>C需要作者另行咨询专家的安排，不能因段中出现专业服务名称就推成应寻求专业意见。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Reveal their misconduct.</h3>\n<blockquote>\n<p>作者遇到不当加引要求时应该揭露对方的不当行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>do report the request to the journal要求把不当加引要求告知期刊，D的Reveal their misconduct概括揭露这一行为。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者遇到不当加引要求时应该揭露对方的不当行为。</p>\n</blockquote>\n<p><code>D</code>的<code>Reveal their misconduct</code>对应第5段末句的<code>report the request to the journal</code>，因为该句让作者把增加不恰当参考文献的要求告知期刊；回看这一要求的内容和报告动作，可以判断揭露的是什么行为。</p>\n<p>原文先将问题明确为要求作者增加<code>inappropriate references</code>，再让作者<code>report the request to the journal</code>，把这种要求告诉期刊。<code>D</code>的<code>Reveal their misconduct</code>把不当要求概括为操纵者的不当行为，把向期刊报告概括为揭露；两者都使第三方知道对方提出了不恰当的引用要求。<code>Reveal</code>没有限定必须向社会公开，因此可以包括原文这项向期刊报告的行动。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n<p>Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。</p>\n</blockquote>\n<p>作者不用配合要求，反而应报告，这使问题从私下请求变成期刊可以获知的不当做法。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>An author should reveal their misconduct.</p>\n<p>作者遇到不当加引要求时应该揭露对方的不当行为。</p>\n</blockquote>\n<p>reveal不必扩大为向全社会公开曝光；在本文情境中向期刊报告已经实现揭露，D最贴近末句动作。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>40题结论</h3>\n<blockquote>\n<p><strong>40. D</strong></p>\n</blockquote>\n<ul>\n<li>A：末句要求拒绝不当加引并向期刊报告，没有提出诉讼或其他法律程序。</li>\n<li>B：报告请求是让期刊知悉问题，要求道歉则让提出请求者作出另一种回应，原文没有后一要求。</li>\n<li>C：support service是可能提出不当请求的一方，不是结尾建议作者求助的专业顾问；行动是拒绝并报告。</li>\n<li>D：do report the request to the journal要求把不当加引要求告知期刊，D的Reveal their misconduct概括揭露这一行为。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：学术引用的重要性</strong>（段落1背景介绍） 科学论文作为研究进展的记录者 → 衡量标准：【期刊质量（影响因子）+ 论文引用次数】→ 重要性：科学家职业生涯和机构声誉取决于论文数量和声望 // 但更重要的是引用次数</p>\n<p>↓（问题引出）</p>\n<p><strong>逻辑层次2：引用操纵的形式演变</strong>（段落2操纵手段） 传统形式：引用联盟（期刊、作者、机构串谋虚增）→ 2016年：算法识别可疑模式（作者群体相互引用 + 期刊群体相互引用）→ 新形式：支持服务咨询机构建议添加引用</p>\n<p>↓（新型载体）</p>\n<p><strong>逻辑层次3：掠夺性期刊的&quot;奶牛&quot;功能</strong>（段落3操纵机制） 背景：电子出版 + 作者需求 → 数千新期刊诞生 → 掠夺性期刊出现 → &quot;奶牛&quot;机制：【每篇文章都引用特定论文 + 内容与引用无关 + 期刊不获利只提供引用】→ 结果：文章一年内获得150+引用</p>\n<p>↓（危害程度）</p>\n<p><strong>逻辑层次4：操纵的规模和目标</strong>（段落4影响范围） 操纵规模：一人利用15种期刊为5位科学家提供引用 → 重灾区：Scopus（收录大量新&quot;国际&quot;期刊）→ 成为目标的标准：在Scopus中被收录</p>\n<p>↓（应对措施）</p>\n<p><strong>逻辑层次5：检测与防范建议</strong>（段落5解决方案） 检测能力：Scopus拥有所有必要数据 → 危险信号：第一年内大量引用 → 对作者的建议：【拒绝不当引用请求 + 向期刊举报】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：学术引用作为衡量科研质量的重要指标，正遭受各种形式的操纵，从传统的引用卡特尔到新型的掠夺性期刊&quot;奶牛&quot;机制，这种操纵在Scopus等数据库中尤为猖獗，需要通过技术检测和作者自律来共同防范。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. A network whose reach is visible in a major database</p>\n<p>B. Detecting abuse and refusing improper requests</p>\n<p>C. Why citation totals matter to researchers</p>\n<p>D. Journals used to supply citations to selected papers</p>\n<p>E. The evolution of organised citation inflation</p>\n<p>F. Lower publication fees as the aim of new journals</p>\n<p>G. The replacement of citations by readers’ opinions</p>\n<p><strong>41.</strong></p>\n<p>Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n<p><strong>42.</strong></p>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n<p><strong>43.</strong></p>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<p><strong>44.</strong></p>\n<p>How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.</p>\n<p><strong>45.</strong></p>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】C. Why citation totals matter to researchers</p>\n<blockquote>\n<p>引用总量为何对研究者重要</p>\n</blockquote>\n<p>科学共同体使用期刊质量与引用等指标，而研究者职业及机构声誉尤其依赖论文获得的引用。</p>\n<blockquote>\n<p>Scientific papers are the recordkeepers of progress in research.</p>\n</blockquote>\n<p>论文记录进展，先交代科研评价对象，尚未涉及操纵。</p>\n<blockquote>\n<p>The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates.</p>\n</blockquote>\n<p>期刊影响因子与具体论文被引数是两类质量指标，后者不是论文参考文献数量。</p>\n<blockquote>\n<p>The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n</blockquote>\n<p>职业与机构声誉尤其依赖被引，说明为什么有人会有抬高指标的动机。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>论文衡量研究成果 → 被引是评价指标 → 职业声誉尤其受其影响</p>\n</blockquote>\n<p>why ... matter概括这些数量与评价、职业、声誉之间的关系；被引用与引用别人不能倒置。</p>\n<p>再看最强干扰项G：The replacement of citations by readers’ opinions。</p>\n<p>本段未要求替换指标，而是在交代引用指标现有的重要性。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】E. The evolution of organised citation inflation</p>\n<blockquote>\n<p>有组织抬高引用数量的不同形式</p>\n</blockquote>\n<p>先介绍长期存在的引用联盟和识别算法，再补充咨询机构要求增加引用这一新表现。</p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time.</p>\n</blockquote>\n<p>引用联盟由期刊、作者和机构共同抬高数字，先给出长期存在的现象。</p>\n<blockquote>\n<p>In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications.</p>\n</blockquote>\n<p>算法通过作者或期刊过度互引辨认异常，互引关系为可疑模式提供内容。</p>\n<blockquote>\n<p>Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n<p>Recently与another expression增添咨询服务形式，标题应统摄多种操纵方式。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>长期引用联盟 → 过度互引可被识别 → 咨询服务又可推动加引</p>\n</blockquote>\n<p>evolution覆盖不同参与者和操作形式，organised inflation保留人为抬高引用这一共同点。</p>\n<p>再看最强干扰项B：Detecting abuse and refusing improper requests。</p>\n<p>算法确实用于识别，但段末重点还在补充新的不当做法；作者应对建议在最后一段。</p>\n<p><strong>42题选E。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】D. Journals used to supply citations to selected papers</p>\n<blockquote>\n<p>被用来给特定论文供应引用的期刊</p>\n</blockquote>\n<p>新期刊可以让每篇文章集中引用特定论文，甚至内容不相关，结果是目标论文短期内得到大量引用。</p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals.</p>\n</blockquote>\n<p>电子出版与发表需求增加期刊出口，提供新的供引渠道。</p>\n<blockquote>\n<p>In some instances, there is absolutely no relationship between the content of the article and the citations.</p>\n</blockquote>\n<p>内容与引用无关暴露人为安排，不能把这种供引当作正常学术关联。</p>\n<blockquote>\n<p>Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n<p>一年150多次被引呈现目标论文得到的指标收益，标题重点是期刊怎样供引。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>新期刊增多 → 指定引用可与内容无关 → 目标论文短期大量获引</p>\n</blockquote>\n<p>supply citations对应providing citations，selected papers对应specific paper，准确说明受益方向。</p>\n<p>再看最强干扰项F：Lower publication fees as the aim of new journals。</p>\n<p>没有讨论作者发表价格；期刊本身不获益也不等于降低发表费用。</p>\n<p><strong>43题选D。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】A. A network whose reach is visible in a major database</p>\n<blockquote>\n<p>在大型数据库中显露规模的操纵网络</p>\n</blockquote>\n<p>一人借至少15种期刊为特定学者供给引用，问题在Scopus中猖獗，收录似乎还成为被盯上的条件。</p>\n<blockquote>\n<p>How insidious is this type of citation manipulation?</p>\n</blockquote>\n<p>设问从做法转向隐蔽程度和规模，随后多期刊多学者的案例具体回答。</p>\n<blockquote>\n<p>The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals.</p>\n</blockquote>\n<p>Scopus收录大量新国际期刊，操纵在其覆盖范围内严重。</p>\n<blockquote>\n<p>In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.</p>\n</blockquote>\n<p>listing成为被盯上条件，说明收录与操纵目标之间的关系，并非数据库阻止期刊发展。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>设问操纵规模 → 多期刊多机构网络 → Scopus收录成为目标条件</p>\n</blockquote>\n<p>network覆盖跨期刊和学者的操纵关系，database指出问题显现的场所。</p>\n<p>再看最强干扰项G：The replacement of citations by readers’ opinions。</p>\n<p>本段仍在追踪引用操纵，没有转换为读者意见评价。</p>\n<p><strong>44题选A。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】B. Detecting abuse and refusing improper requests</p>\n<blockquote>\n<p>查出滥用并拒绝不当要求</p>\n</blockquote>\n<p>Scopus有检测所需数据，短期异常高引用是信号；作者遇到不当加引要求应拒绝并报告。</p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice.</p>\n</blockquote>\n<p>all the data necessary给出检测的现实基础，不是已经查清所有案件。</p>\n<blockquote>\n<p>Red flags include a large number of citations to an article within the first year.</p>\n</blockquote>\n<p>首年异常多引用是可调查信号，不能仅凭这一点直接判定每篇论文有罪。</p>\n<blockquote>\n<p>And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<p>不要照办并报告，把数据库识别条件接到作者可执行的行动。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>数据库有必要数据 → 异常引用可作警示 → 作者拒绝并报告</p>\n</blockquote>\n<p>detecting与refusing分别覆盖数据库能力和作者行动，不能只保留其中一半。</p>\n<p>再看最强干扰项E：The evolution of organised citation inflation。</p>\n<p>这里从揭示不当做法转到如何识别和应对，不再增加操纵形式。</p>\n<p><strong>45题选B。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Scientific papers record research progress, but they also influence careers and institutional reputations. Citation totals are particularly important in this system of evaluation. Their value gives some participants a reason to seek larger numbers without earning them through relevant scholarly use.</p>\n<p><strong>B.</strong></p>\n<p>In this supply relationship, the journal carrying the citations may gain nothing for itself. The benefit goes to papers elsewhere, which can accumulate very large totals within a single year. Counting those references without examining their relationship to the articles can therefore give a misleading impression of influence.</p>\n<p><strong>C.</strong></p>\n<p>The arrangements have also taken a form involving support services. Consultancies that offer language and editorial assistance sometimes advise contributors to add references. Such advice becomes problematic when the added citations serve an organised scheme rather than the argument of the paper.</p>\n<p><strong>D.</strong></p>\n<p>The scale of that misleading influence can extend across several institutions. In one reported case, a person acting in multiple roles used at least fifteen journals to support papers by five scientists. The problem is widespread in Scopus, where a listing appears to make a journal a potential target.</p>\n<p><strong>E.</strong></p>\n<p>The multiplication of electronic journals creates further outlets for this scheme. Some publications can be used mainly as suppliers of citations to selected papers. An entire issue may repeatedly cite the same work even when the individual articles have no relevant connection with it.</p>\n<p><strong>F.</strong></p>\n<p>One way of seeking those numbers is organised exchange. Groups of authors or journals may cite one another disproportionately, creating patterns that an algorithm can identify as suspicious. These citation cartels have existed for a long time, even though their arrangements are not always visible to readers.</p>\n<p><strong>G.</strong></p>\n<p>The database nevertheless possesses information that could help identify the problem. An unusually large number of citations soon after publication is one warning sign. Access to the necessary data creates an opportunity for detection, though it does not establish that every suspicious case has already been stopped.</p>\n<p><strong>H.</strong></p>\n<p>Authors also have a part to play when suspicious requests reach them directly. If an editor, reviewer or support service asks for inappropriate references, they should refuse and report the request to the journal. This response prevents a routine editorial exchange from becoming silent cooperation with manipulation.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从科研评价引出人为抬高引用的动机</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明供引期刊与受益论文之间的关系</td>\n</tr>\n<tr>\n<td>C</td>\n<td>补充借咨询服务增加引用的形式</td>\n</tr>\n<tr>\n<td>D</td>\n<td>展示跨期刊机构规模及数据库中的问题</td>\n</tr>\n<tr>\n<td>E</td>\n<td>转向新期刊作为集中供引渠道</td>\n</tr>\n<tr>\n<td>F</td>\n<td>解释引用联盟及其可疑模式</td>\n</tr>\n<tr>\n<td>G</td>\n<td>说明数据库识别异常的基础与限度</td>\n</tr>\n<tr>\n<td>H</td>\n<td>提出作者拒绝并报告不当要求的行动</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从科研评价引出人为抬高引用的动机 → 解释引用联盟及其可疑模式 → 补充借咨询服务增加引用的形式 → 转向新期刊作为集中供引渠道 → 说明供引期刊与受益论文之间的关系 → 展示跨期刊机构规模及数据库中的问题 → 说明数据库识别异常的基础与限度 → 提出作者拒绝并报告不当要求的行动</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → C → E → B → D → G → H</strong></p>\n<p>41—45：F、C、B、D、G。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → F → C。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Their value gives some participants a reason to seek larger numbers without earning them through relevant scholarly use.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>One way of seeking those numbers is organised exchange.</p>\n</blockquote>\n<p>larger numbers与those numbers接上评价指标带来的造假动机，One way开始说明一种手段。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Groups of authors or journals may cite one another disproportionately, creating patterns that an algorithm can identify as suspicious. These citation cartels have existed for a long time, even though their arrangements are not always visible to readers.</p>\n</blockquote>\n<p>organised exchange由作者或期刊互引具体展开，These citation cartels再给现象名称。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>The arrangements have also taken a form involving support services.</p>\n</blockquote>\n<p>The arrangements回指互引安排，also将接入咨询服务这一新形式。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从科研评价引出人为抬高引用的动机 → 解释引用联盟及其可疑模式 → 补充借咨询服务增加引用的形式</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>In this supply relationship, the journal carrying the citations may gain nothing for itself.</p>\n</blockquote>\n<p>supply relationship预设供引期刊和受益论文的关系，此时只刚引入联盟，尚没有该先行内容。</p>\n<p><strong>41题选F。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为F → C → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>These citation cartels have existed for a long time, even though their arrangements are not always visible to readers.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>The arrangements have also taken a form involving support services.</p>\n</blockquote>\n<p>The arrangements接前段已命名的citation cartels，also标明增补形式。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Consultancies that offer language and editorial assistance sometimes advise contributors to add references. Such advice becomes problematic when the added citations serve an organised scheme rather than the argument of the paper.</p>\n</blockquote>\n<p>support services由语言编辑咨询及增加引用建议展开，scheme指不为论文论证而服务的安排。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The multiplication of electronic journals creates further outlets for this scheme.</p>\n</blockquote>\n<p>this scheme承接这种操纵，电子期刊增多再解释可用出口怎样扩展。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释引用联盟及其可疑模式 → 补充借咨询服务增加引用的形式 → 转向新期刊作为集中供引渠道</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>In this supply relationship, the journal carrying the citations may gain nothing for itself.</p>\n</blockquote>\n<p>来源期刊不获益要求先建立供引渠道，本段应先接咨询服务这个明确的新话题。</p>\n<p><strong>42题选C。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → B → D。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>An entire issue may repeatedly cite the same work even when the individual articles have no relevant connection with it.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>In this supply relationship, the journal carrying the citations may gain nothing for itself.</p>\n</blockquote>\n<p>前文整期反复引同一论文，已构成this supply relationship的明确指代。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The benefit goes to papers elsewhere, which can accumulate very large totals within a single year. Counting those references without examining their relationship to the articles can therefore give a misleading impression of influence.</p>\n</blockquote>\n<p>journal may gain nothing与benefit goes to papers elsewhere对照，分清提供者和受益者。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>The scale of that misleading influence can extend across several institutions.</p>\n</blockquote>\n<p>that misleading influence接本段末尾misleading impression，scale再引出跨机构规模。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转向新期刊作为集中供引渠道 → 说明供引期刊与受益论文之间的关系 → 展示跨期刊机构规模及数据库中的问题</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The database nevertheless possesses information that could help identify the problem.</p>\n</blockquote>\n<p>database尚未在此建立，直接说The database nevertheless会失去主语先行项与转折依据。</p>\n<p><strong>43题选B。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为B → D → G。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Counting those references without examining their relationship to the articles can therefore give a misleading impression of influence.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>The scale of that misleading influence can extend across several institutions.</p>\n</blockquote>\n<p>that misleading influence复现前段misleading impression of influence，多个机构是下一层规模扩展。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>In one reported case, a person acting in multiple roles used at least fifteen journals to support papers by five scientists. The problem is widespread in Scopus, where a listing appears to make a journal a potential target.</p>\n</blockquote>\n<p>一人用15种期刊服务五位科学家，具体支撑跨机构影响，并引出Scopus。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>The database nevertheless possesses information that could help identify the problem.</p>\n</blockquote>\n<p>The database有了Scopus这个先行项，nevertheless准备从问题严重转向仍有检测条件。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明供引期刊与受益论文之间的关系 → 展示跨期刊机构规模及数据库中的问题 → 说明数据库识别异常的基础与限度</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One way of seeking those numbers is organised exchange.</p>\n</blockquote>\n<p>organised exchange属于前面解释联盟方式的起点，放此处会倒退且无法承接跨机构规模。</p>\n<p><strong>44题选D。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为D → G → H。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>The problem is widespread in Scopus, where a listing appears to make a journal a potential target.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The database nevert
