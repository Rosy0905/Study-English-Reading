 number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者遇到不当加引要求时应该揭露对方的不当行为。</p>\n</blockquote>\n<p><code>D</code>的<code>Reveal their misconduct</code>对应第5段末句的<code>report the request to the journal</code>，因为该句让作者把增加不恰当参考文献的要求告知期刊；回看这一要求的内容和报告动作，可以判断揭露的是什么行为。</p>\n<p>原文先将问题明确为要求作者增加<code>inappropriate references</code>，再让作者<code>report the request to the journal</code>，把这种要求告诉期刊。<code>D</code>的<code>Reveal their misconduct</code>把不当要求概括为操纵者的不当行为，把向期刊报告概括为揭露；两者都使第三方知道对方提出了不恰当的引用要求。<code>Reveal</code>没有限定必须向社会公开，因此可以包括原文这项向期刊报告的行动。</p>\n</section>"},{"title":"D. Reveal their misconduct.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.\n>\n> Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。\n\n作者不用配合要求，反而应报告，这使问题从私下请求变成期刊可以获知的不当做法。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> An author should reveal their misconduct.\n>\n> 作者遇到不当加引要求时应该揭露对方的不当行为。\n\nreveal不必扩大为向全社会公开曝光；在本文情境中向期刊报告已经实现揭露，D最贴近末句动作。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"40","option":"D","cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-40-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-40-option-D-0\"><blockquote>\n<p>作者遇到不当加引要求时应该揭露对方的不当行为。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>do report the request to the journal要求把不当加引要求告知期刊，D的Reveal their misconduct概括揭露这一行为。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者遇到不当加引要求时应该揭露对方的不当行为。</p>\n</blockquote>\n<p><code>D</code>的<code>Reveal their misconduct</code>对应第5段末句的<code>report the request to the journal</code>，因为该句让作者把增加不恰当参考文献的要求告知期刊；回看这一要求的内容和报告动作，可以判断揭露的是什么行为。</p>\n<p>原文先将问题明确为要求作者增加<code>inappropriate references</code>，再让作者<code>report the request to the journal</code>，把这种要求告诉期刊。<code>D</code>的<code>Reveal their misconduct</code>把不当要求概括为操纵者的不当行为，把向期刊报告概括为揭露；两者都使第三方知道对方提出了不恰当的引用要求。<code>Reveal</code>没有限定必须向社会公开，因此可以包括原文这项向期刊报告的行动。</p>\n</section><section class=\"revealPart\" id=\"focus-question-40-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n<p>Scopus本身拥有检测这种不当行为所需的全部数据。警示信号包括文章发表第一年就得到大量引用。想避开引用联盟活动的作者，在编辑、审稿人或支持服务方要求添加不恰当参考文献时，不要照办，并应把这一要求报告给期刊。</p>\n</blockquote>\n<p>作者不用配合要求，反而应报告，这使问题从私下请求变成期刊可以获知的不当做法。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>An author should reveal their misconduct.</p>\n<p>作者遇到不当加引要求时应该揭露对方的不当行为。</p>\n</blockquote>\n<p>reveal不必扩大为向全社会公开曝光；在本文情境中向期刊报告已经实现揭露，D最贴近末句动作。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"40题结论","raw":"### 40题结论\n\n> **40. D**\n\n- A：末句要求拒绝不当加引并向期刊报告，没有提出诉讼或其他法律程序。\n- B：报告请求是让期刊知悉问题，要求道歉则让提出请求者作出另一种回应，原文没有后一要求。\n- C：support service是可能提出不当请求的一方，不是结尾建议作者求助的专业顾问；行动是拒绝并报告。\n- D：do report the request to the journal要求把不当加引要求告知期刊，D的Reveal their misconduct概括揭露这一行为。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"40题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"40","questionConclusion":true},"html":"<blockquote>\n<p><strong>40. D</strong></p>\n</blockquote>\n<ul>\n<li>A：末句要求拒绝不当加引并向期刊报告，没有提出诉讼或其他法律程序。</li>\n<li>B：报告请求是让期刊知悉问题，要求道歉则让提出请求者作出另一种回应，原文没有后一要求。</li>\n<li>C：support service是可能提出不当请求的一方，不是结尾建议作者求助的专业顾问；行动是拒绝并报告。</li>\n<li>D：do report the request to the journal要求把不当加引要求告知期刊，D的Reveal their misconduct概括揭露这一行为。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：学术引用的重要性**（段落1背景介绍） 科学论文作为研究进展的记录者 → 衡量标准：【期刊质量（影响因子）+ 论文引用次数】→ 重要性：科学家职业生涯和机构声誉取决于论文数量和声望 // 但更重要的是引用次数\n\n↓（问题引出）\n\n**逻辑层次2：引用操纵的形式演变**（段落2操纵手段） 传统形式：引用联盟（期刊、作者、机构串谋虚增）→ 2016年：算法识别可疑模式（作者群体相互引用 + 期刊群体相互引用）→ 新形式：支持服务咨询机构建议添加引用\n\n↓（新型载体）\n\n**逻辑层次3：掠夺性期刊的\"奶牛\"功能**（段落3操纵机制） 背景：电子出版 + 作者需求 → 数千新期刊诞生 → 掠夺性期刊出现 → \"奶牛\"机制：【每篇文章都引用特定论文 + 内容与引用无关 + 期刊不获利只提供引用】→ 结果：文章一年内获得150+引用\n\n↓（危害程度）\n\n**逻辑层次4：操纵的规模和目标**（段落4影响范围） 操纵规模：一人利用15种期刊为5位科学家提供引用 → 重灾区：Scopus（收录大量新\"国际\"期刊）→ 成为目标的标准：在Scopus中被收录\n\n↓（应对措施）\n\n**逻辑层次5：检测与防范建议**（段落5解决方案） 检测能力：Scopus拥有所有必要数据 → 危险信号：第一年内大量引用 → 对作者的建议：【拒绝不当引用请求 + 向期刊举报】\n\n↑（全文主旨）\n\n全文核心观点：学术引用作为衡量科研质量的重要指标，正遭受各种形式的操纵，从传统的引用卡特尔到新型的掠夺性期刊\"奶牛\"机制，这种操纵在Scopus等数据库中尤为猖獗，需要通过技术检测和作者自律来共同防范。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：学术引用的重要性</strong>（段落1背景介绍） 科学论文作为研究进展的记录者 → 衡量标准：【期刊质量（影响因子）+ 论文引用次数】→ 重要性：科学家职业生涯和机构声誉取决于论文数量和声望 // 但更重要的是引用次数</p>\n<p>↓（问题引出）</p>\n<p><strong>逻辑层次2：引用操纵的形式演变</strong>（段落2操纵手段） 传统形式：引用联盟（期刊、作者、机构串谋虚增）→ 2016年：算法识别可疑模式（作者群体相互引用 + 期刊群体相互引用）→ 新形式：支持服务咨询机构建议添加引用</p>\n<p>↓（新型载体）</p>\n<p><strong>逻辑层次3：掠夺性期刊的&quot;奶牛&quot;功能</strong>（段落3操纵机制） 背景：电子出版 + 作者需求 → 数千新期刊诞生 → 掠夺性期刊出现 → &quot;奶牛&quot;机制：【每篇文章都引用特定论文 + 内容与引用无关 + 期刊不获利只提供引用】→ 结果：文章一年内获得150+引用</p>\n<p>↓（危害程度）</p>\n<p><strong>逻辑层次4：操纵的规模和目标</strong>（段落4影响范围） 操纵规模：一人利用15种期刊为5位科学家提供引用 → 重灾区：Scopus（收录大量新&quot;国际&quot;期刊）→ 成为目标的标准：在Scopus中被收录</p>\n<p>↓（应对措施）</p>\n<p><strong>逻辑层次5：检测与防范建议</strong>（段落5解决方案） 检测能力：Scopus拥有所有必要数据 → 危险信号：第一年内大量引用 → 对作者的建议：【拒绝不当引用请求 + 向期刊举报】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：学术引用作为衡量科研质量的重要指标，正遭受各种形式的操纵，从传统的引用卡特尔到新型的掠夺性期刊&quot;奶牛&quot;机制，这种操纵在Scopus等数据库中尤为猖獗，需要通过技术检测和作者自律来共同防范。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. Why citation totals matter to researchers\n\n> 引用总量为何对研究者重要\n\n科学共同体使用期刊质量与引用等指标，而研究者职业及机构声誉尤其依赖论文获得的引用。\n\n> Scientific papers are the recordkeepers of progress in research.\n\n论文记录进展，先交代科研评价对象，尚未涉及操纵。\n\n> The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title's impact factor) and the number of citations a specific paper accumulates.\n\n期刊影响因子与具体论文被引数是两类质量指标，后者不是论文参考文献数量。\n\n> The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.\n\n职业与机构声誉尤其依赖被引，说明为什么有人会有抬高指标的动机。\n\n这一部分的推进关系是：\n\n> 论文衡量研究成果 → 被引是评价指标 → 职业声誉尤其受其影响\n\nwhy ... matter概括这些数量与评价、职业、声誉之间的关系；被引用与引用别人不能倒置。\n\n再看最强干扰项G：The replacement of citations by readers’ opinions。\n\n本段未要求替换指标，而是在交代引用指标现有的重要性。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. Why citation totals matter to researchers</p>\n<blockquote>\n<p>引用总量为何对研究者重要</p>\n</blockquote>\n<p>科学共同体使用期刊质量与引用等指标，而研究者职业及机构声誉尤其依赖论文获得的引用。</p>\n<blockquote>\n<p>Scientific papers are the recordkeepers of progress in research.</p>\n</blockquote>\n<p>论文记录进展，先交代科研评价对象，尚未涉及操纵。</p>\n<blockquote>\n<p>The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates.</p>\n</blockquote>\n<p>期刊影响因子与具体论文被引数是两类质量指标，后者不是论文参考文献数量。</p>\n<blockquote>\n<p>The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n</blockquote>\n<p>职业与机构声誉尤其依赖被引，说明为什么有人会有抬高指标的动机。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>论文衡量研究成果 → 被引是评价指标 → 职业声誉尤其受其影响</p>\n</blockquote>\n<p>why ... matter概括这些数量与评价、职业、声誉之间的关系；被引用与引用别人不能倒置。</p>\n<p>再看最强干扰项G：The replacement of citations by readers’ opinions。</p>\n<p>本段未要求替换指标，而是在交代引用指标现有的重要性。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】E. The evolution of organised citation inflation\n\n> 有组织抬高引用数量的不同形式\n\n先介绍长期存在的引用联盟和识别算法，再补充咨询机构要求增加引用这一新表现。\n\n> Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time.\n\n引用联盟由期刊、作者和机构共同抬高数字，先给出长期存在的现象。\n\n> In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications.\n\n算法通过作者或期刊过度互引辨认异常，互引关系为可疑模式提供内容。\n\n> Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.\n\nRecently与another expression增添咨询服务形式，标题应统摄多种操纵方式。\n\n这一部分的推进关系是：\n\n> 长期引用联盟 → 过度互引可被识别 → 咨询服务又可推动加引\n\nevolution覆盖不同参与者和操作形式，organised inflation保留人为抬高引用这一共同点。\n\n再看最强干扰项B：Detecting abuse and refusing improper requests。\n\n算法确实用于识别，但段末重点还在补充新的不当做法；作者应对建议在最后一段。\n\n**42题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】E. The evolution of organised citation inflation</p>\n<blockquote>\n<p>有组织抬高引用数量的不同形式</p>\n</blockquote>\n<p>先介绍长期存在的引用联盟和识别算法，再补充咨询机构要求增加引用这一新表现。</p>\n<blockquote>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time.</p>\n</blockquote>\n<p>引用联盟由期刊、作者和机构共同抬高数字，先给出长期存在的现象。</p>\n<blockquote>\n<p>In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications.</p>\n</blockquote>\n<p>算法通过作者或期刊过度互引辨认异常，互引关系为可疑模式提供内容。</p>\n<blockquote>\n<p>Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n</blockquote>\n<p>Recently与another expression增添咨询服务形式，标题应统摄多种操纵方式。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>长期引用联盟 → 过度互引可被识别 → 咨询服务又可推动加引</p>\n</blockquote>\n<p>evolution覆盖不同参与者和操作形式，organised inflation保留人为抬高引用这一共同点。</p>\n<p>再看最强干扰项B：Detecting abuse and refusing improper requests。</p>\n<p>算法确实用于识别，但段末重点还在补充新的不当做法；作者应对建议在最后一段。</p>\n<p><strong>42题选E。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】D. Journals used to supply citations to selected papers\n\n> 被用来给特定论文供应引用的期刊\n\n新期刊可以让每篇文章集中引用特定论文，甚至内容不相关，结果是目标论文短期内得到大量引用。\n\n> The advent of electronic publishing and authors' need to find outlets for their papers resulted in thousands of new journals.\n\n电子出版与发表需求增加期刊出口，提供新的供引渠道。\n\n> In some instances, there is absolutely no relationship between the content of the article and the citations.\n\n内容与引用无关暴露人为安排，不能把这种供引当作正常学术关联。\n\n> Such practices can lead an article to accrue more than 150 citations in the same year that it was published.\n\n一年150多次被引呈现目标论文得到的指标收益，标题重点是期刊怎样供引。\n\n这一部分的推进关系是：\n\n> 新期刊增多 → 指定引用可与内容无关 → 目标论文短期大量获引\n\nsupply citations对应providing citations，selected papers对应specific paper，准确说明受益方向。\n\n再看最强干扰项F：Lower publication fees as the aim of new journals。\n\n没有讨论作者发表价格；期刊本身不获益也不等于降低发表费用。\n\n**43题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】D. Journals used to supply citations to selected papers</p>\n<blockquote>\n<p>被用来给特定论文供应引用的期刊</p>\n</blockquote>\n<p>新期刊可以让每篇文章集中引用特定论文，甚至内容不相关，结果是目标论文短期内得到大量引用。</p>\n<blockquote>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals.</p>\n</blockquote>\n<p>电子出版与发表需求增加期刊出口，提供新的供引渠道。</p>\n<blockquote>\n<p>In some instances, there is absolutely no relationship between the content of the article and the citations.</p>\n</blockquote>\n<p>内容与引用无关暴露人为安排，不能把这种供引当作正常学术关联。</p>\n<blockquote>\n<p>Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n</blockquote>\n<p>一年150多次被引呈现目标论文得到的指标收益，标题重点是期刊怎样供引。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>新期刊增多 → 指定引用可与内容无关 → 目标论文短期大量获引</p>\n</blockquote>\n<p>supply citations对应providing citations，selected papers对应specific paper，准确说明受益方向。</p>\n<p>再看最强干扰项F：Lower publication fees as the aim of new journals。</p>\n<p>没有讨论作者发表价格；期刊本身不获益也不等于降低发表费用。</p>\n<p><strong>43题选D。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】A. A network whose reach is visible in a major database\n\n> 在大型数据库中显露规模的操纵网络\n\n一人借至少15种期刊为特定学者供给引用，问题在Scopus中猖獗，收录似乎还成为被盯上的条件。\n\n> How insidious is this type of citation manipulation?\n\n设问从做法转向隐蔽程度和规模，随后多期刊多学者的案例具体回答。\n\n> The problem is rampant in Scopus, which includes a high number of the new \"international\" journals.\n\nScopus收录大量新国际期刊，操纵在其覆盖范围内严重。\n\n> In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.\n\nlisting成为被盯上条件，说明收录与操纵目标之间的关系，并非数据库阻止期刊发展。\n\n这一部分的推进关系是：\n\n> 设问操纵规模 → 多期刊多机构网络 → Scopus收录成为目标条件\n\nnetwork覆盖跨期刊和学者的操纵关系，database指出问题显现的场所。\n\n再看最强干扰项G：The replacement of citations by readers’ opinions。\n\n本段仍在追踪引用操纵，没有转换为读者意见评价。\n\n**44题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】A. A network whose reach is visible in a major database</p>\n<blockquote>\n<p>在大型数据库中显露规模的操纵网络</p>\n</blockquote>\n<p>一人借至少15种期刊为特定学者供给引用，问题在Scopus中猖獗，收录似乎还成为被盯上的条件。</p>\n<blockquote>\n<p>How insidious is this type of citation manipulation?</p>\n</blockquote>\n<p>设问从做法转向隐蔽程度和规模，随后多期刊多学者的案例具体回答。</p>\n<blockquote>\n<p>The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals.</p>\n</blockquote>\n<p>Scopus收录大量新国际期刊，操纵在其覆盖范围内严重。</p>\n<blockquote>\n<p>In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.</p>\n</blockquote>\n<p>listing成为被盯上条件，说明收录与操纵目标之间的关系，并非数据库阻止期刊发展。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>设问操纵规模 → 多期刊多机构网络 → Scopus收录成为目标条件</p>\n</blockquote>\n<p>network覆盖跨期刊和学者的操纵关系，database指出问题显现的场所。</p>\n<p>再看最强干扰项G：The replacement of citations by readers’ opinions。</p>\n<p>本段仍在追踪引用操纵，没有转换为读者意见评价。</p>\n<p><strong>44题选A。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Detecting abuse and refusing improper requests\n\n> 查出滥用并拒绝不当要求\n\nScopus有检测所需数据，短期异常高引用是信号；作者遇到不当加引要求应拒绝并报告。\n\n> Scopus itself has all the data necessary to detect this malpractice.\n\nall the data necessary给出检测的现实基础，不是已经查清所有案件。\n\n> Red flags include a large number of citations to an article within the first year.\n\n首年异常多引用是可调查信号，不能仅凭这一点直接判定每篇论文有罪。\n\n> And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.\n\n不要照办并报告，把数据库识别条件接到作者可执行的行动。\n\n这一部分的推进关系是：\n\n> 数据库有必要数据 → 异常引用可作警示 → 作者拒绝并报告\n\ndetecting与refusing分别覆盖数据库能力和作者行动，不能只保留其中一半。\n\n再看最强干扰项E：The evolution of organised citation inflation。\n\n这里从揭示不当做法转到如何识别和应对，不再增加操纵形式。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Detecting abuse and refusing improper requests</p>\n<blockquote>\n<p>查出滥用并拒绝不当要求</p>\n</blockquote>\n<p>Scopus有检测所需数据，短期异常高引用是信号；作者遇到不当加引要求应拒绝并报告。</p>\n<blockquote>\n<p>Scopus itself has all the data necessary to detect this malpractice.</p>\n</blockquote>\n<p>all the data necessary给出检测的现实基础，不是已经查清所有案件。</p>\n<blockquote>\n<p>Red flags include a large number of citations to an article within the first year.</p>\n</blockquote>\n<p>首年异常多引用是可调查信号，不能仅凭这一点直接判定每篇论文有罪。</p>\n<blockquote>\n<p>And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<p>不要照办并报告，把数据库识别条件接到作者可执行的行动。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>数据库有必要数据 → 异常引用可作警示 → 作者拒绝并报告</p>\n</blockquote>\n<p>detecting与refusing分别覆盖数据库能力和作者行动，不能只保留其中一半。</p>\n<p>再看最强干扰项E：The evolution of organised citation inflation。</p>\n<p>这里从揭示不当做法转到如何识别和应对，不再增加操纵形式。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 从科研评价引出人为抬高引用的动机 |\n| B | 说明供引期刊与受益论文之间的关系 |\n| C | 补充借咨询服务增加引用的形式 |\n| D | 展示跨期刊机构规模及数据库中的问题 |\n| E | 转向新期刊作为集中供引渠道 |\n| F | 解释引用联盟及其可疑模式 |\n| G | 说明数据库识别异常的基础与限度 |\n| H | 提出作者拒绝并报告不当要求的行动 |\n\n全文推进：\n\n> 从科研评价引出人为抬高引用的动机 → 解释引用联盟及其可疑模式 → 补充借咨询服务增加引用的形式 → 转向新期刊作为集中供引渠道 → 说明供引期刊与受益论文之间的关系 → 展示跨期刊机构规模及数据库中的问题 → 说明数据库识别异常的基础与限度 → 提出作者拒绝并报告不当要求的行动\n\n完整顺序：\n\n**A → F → C → E → B → D → G → H**\n\n41—45：F、C、B、D、G。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>从科研评价引出人为抬高引用的动机</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明供引期刊与受益论文之间的关系</td>\n</tr>\n<tr>\n<td>C</td>\n<td>补充借咨询服务增加引用的形式</td>\n</tr>\n<tr>\n<td>D</td>\n<td>展示跨期刊机构规模及数据库中的问题</td>\n</tr>\n<tr>\n<td>E</td>\n<td>转向新期刊作为集中供引渠道</td>\n</tr>\n<tr>\n<td>F</td>\n<td>解释引用联盟及其可疑模式</td>\n</tr>\n<tr>\n<td>G</td>\n<td>说明数据库识别异常的基础与限度</td>\n</tr>\n<tr>\n<td>H</td>\n<td>提出作者拒绝并报告不当要求的行动</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>从科研评价引出人为抬高引用的动机 → 解释引用联盟及其可疑模式 → 补充借咨询服务增加引用的形式 → 转向新期刊作为集中供引渠道 → 说明供引期刊与受益论文之间的关系 → 展示跨期刊机构规模及数据库中的问题 → 说明数据库识别异常的基础与限度 → 提出作者拒绝并报告不当要求的行动</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → C → E → B → D → G → H</strong></p>\n<p>41—45：F、C、B、D、G。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → F → C。\n\n先看前段A的结尾：\n\n> Their value gives some participants a reason to seek larger numbers without earning them through relevant scholarly use.\n\n再看F段开头：\n\n> One way of seeking those numbers is organised exchange.\n\nlarger numbers与those numbers接上评价指标带来的造假动机，One way开始说明一种手段。\n\n本段内部继续写道：\n\n> Groups of authors or journals may cite one another disproportionately, creating patterns that an algorithm can identify as suspicious. These citation cartels have existed for a long time, even though their arrangements are not always visible to readers.\n\norganised exchange由作者或期刊互引具体展开，These citation cartels再给现象名称。\n\n后段C开头是：\n\n> The arrangements have also taken a form involving support services.\n\nThe arrangements回指互引安排，also将接入咨询服务这一新形式。\n\n这三段的推进关系：\n\n> 从科研评价引出人为抬高引用的动机 → 解释引用联盟及其可疑模式 → 补充借咨询服务增加引用的形式\n\n再检验候选B：\n\n> In this supply relationship, the journal carrying the citations may gain nothing for itself.\n\nsupply relationship预设供引期刊和受益论文的关系，此时只刚引入联盟，尚没有该先行内容。\n\n**41题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>41题是全文第2段，局部关系为A → F → C。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Their value gives some participants a reason to seek larger numbers without earning them through relevant scholarly use.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>One way of seeking those numbers is organised exchange.</p>\n</blockquote>\n<p>larger numbers与those numbers接上评价指标带来的造假动机，One way开始说明一种手段。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Groups of authors or journals may cite one another disproportionately, creating patterns that an algorithm can identify as suspicious. These citation cartels have existed for a long time, even though their arrangements are not always visible to readers.</p>\n</blockquote>\n<p>organised exchange由作者或期刊互引具体展开，These citation cartels再给现象名称。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>The arrangements have also taken a form involving support services.</p>\n</blockquote>\n<p>The arrangements回指互引安排，also将接入咨询服务这一新形式。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>从科研评价引出人为抬高引用的动机 → 解释引用联盟及其可疑模式 → 补充借咨询服务增加引用的形式</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>In this supply relationship, the journal carrying the citations may gain nothing for itself.</p>\n</blockquote>\n<p>supply relationship预设供引期刊和受益论文的关系，此时只刚引入联盟，尚没有该先行内容。</p>\n<p><strong>41题选F。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为F → C → E。\n\n先看前段F的结尾：\n\n> These citation cartels have existed for a long time, even though their arrangements are not always visible to readers.\n\n再看C段开头：\n\n> The arrangements have also taken a form involving support services.\n\nThe arrangements接前段已命名的citation cartels，also标明增补形式。\n\n本段内部继续写道：\n\n> Consultancies that offer language and editorial assistance sometimes advise contributors to add references. Such advice becomes problematic when the added citations serve an organised scheme rather than the argument of the paper.\n\nsupport services由语言编辑咨询及增加引用建议展开，scheme指不为论文论证而服务的安排。\n\n后段E开头是：\n\n> The multiplication of electronic journals creates further outlets for this scheme.\n\nthis scheme承接这种操纵，电子期刊增多再解释可用出口怎样扩展。\n\n这三段的推进关系：\n\n> 解释引用联盟及其可疑模式 → 补充借咨询服务增加引用的形式 → 转向新期刊作为集中供引渠道\n\n再检验候选B：\n\n> In this supply relationship, the journal carrying the citations may gain nothing for itself.\n\n来源期刊不获益要求先建立供引渠道，本段应先接咨询服务这个明确的新话题。\n\n**42题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>42题是全文第3段，局部关系为F → C → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>These citation cartels have existed for a long time, even though their arrangements are not always visible to readers.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>The arrangements have also taken a form involving support services.</p>\n</blockquote>\n<p>The arrangements接前段已命名的citation cartels，also标明增补形式。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Consultancies that offer language and editorial assistance sometimes advise contributors to add references. Such advice becomes problematic when the added citations serve an organised scheme rather than the argument of the paper.</p>\n</blockquote>\n<p>support services由语言编辑咨询及增加引用建议展开，scheme指不为论文论证而服务的安排。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The multiplication of electronic journals creates further outlets for this scheme.</p>\n</blockquote>\n<p>this scheme承接这种操纵，电子期刊增多再解释可用出口怎样扩展。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>解释引用联盟及其可疑模式 → 补充借咨询服务增加引用的形式 → 转向新期刊作为集中供引渠道</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>In this supply relationship, the journal carrying the citations may gain nothing for itself.</p>\n</blockquote>\n<p>来源期刊不获益要求先建立供引渠道，本段应先接咨询服务这个明确的新话题。</p>\n<p><strong>42题选C。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → B → D。\n\n先看前段E的结尾：\n\n> An entire issue may repeatedly cite the same work even when the individual articles have no relevant connection with it.\n\n再看B段开头：\n\n> In this supply relationship, the journal carrying the citations may gain nothing for itself.\n\n前文整期反复引同一论文，已构成this supply relationship的明确指代。\n\n本段内部继续写道：\n\n> The benefit goes to papers elsewhere, which can accumulate very large totals within a single year. Counting those references without examining their relationship to the articles can therefore give a misleading impression of influence.\n\njournal may gain nothing与benefit goes to papers elsewhere对照，分清提供者和受益者。\n\n后段D开头是：\n\n> The scale of that misleading influence can extend across several institutions.\n\nthat misleading influence接本段末尾misleading impression，scale再引出跨机构规模。\n\n这三段的推进关系：\n\n> 转向新期刊作为集中供引渠道 → 说明供引期刊与受益论文之间的关系 → 展示跨期刊机构规模及数据库中的问题\n\n再检验候选G：\n\n> The database nevertheless possesses information that could help identify the problem.\n\ndatabase尚未在此建立，直接说The database nevertheless会失去主语先行项与转折依据。\n\n**43题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>43题是全文第5段，局部关系为E → B → D。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>An entire issue may repeatedly cite the same work even when the individual articles have no relevant connection with it.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>In this supply relationship, the journal carrying the citations may gain nothing for itself.</p>\n</blockquote>\n<p>前文整期反复引同一论文，已构成this supply relationship的明确指代。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The benefit goes to papers elsewhere, which can accumulate very large totals within a single year. Counting those references without examining their relationship to the articles can therefore give a misleading impression of influence.</p>\n</blockquote>\n<p>journal may gain nothing与benefit goes to papers elsewhere对照，分清提供者和受益者。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>The scale of that misleading influence can extend across several institutions.</p>\n</blockquote>\n<p>that misleading influence接本段末尾misleading impression，scale再引出跨机构规模。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转向新期刊作为集中供引渠道 → 说明供引期刊与受益论文之间的关系 → 展示跨期刊机构规模及数据库中的问题</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The database nevertheless possesses information that could help identify the problem.</p>\n</blockquote>\n<p>database尚未在此建立，直接说The database nevertheless会失去主语先行项与转折依据。</p>\n<p><strong>43题选B。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为B → D → G。\n\n先看前段B的结尾：\n\n> Counting those references without examining their relationship to the articles can therefore give a misleading impression of influence.\n\n再看D段开头：\n\n> The scale of that misleading influence can extend across several institutions.\n\nthat misleading influence复现前段misleading impression of influence，多个机构是下一层规模扩展。\n\n本段内部继续写道：\n\n> In one reported case, a person acting in multiple roles used at least fifteen journals to support papers by five scientists. The problem is widespread in Scopus, where a listing appears to make a journal a potential target.\n\n一人用15种期刊服务五位科学家，具体支撑跨机构影响，并引出Scopus。\n\n后段G开头是：\n\n> The database nevertheless possesses information that could help identify the problem.\n\nThe database有了Scopus这个先行项，nevertheless准备从问题严重转向仍有检测条件。\n\n这三段的推进关系：\n\n> 说明供引期刊与受益论文之间的关系 → 展示跨期刊机构规模及数据库中的问题 → 说明数据库识别异常的基础与限度\n\n再检验候选F：\n\n> One way of seeking those numbers is organised exchange.\n\norganised exchange属于前面解释联盟方式的起点，放此处会倒退且无法承接跨机构规模。\n\n**44题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>44题是全文第6段，局部关系为B → D → G。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Counting those references without examining their relationship to the articles can therefore give a misleading impression of influence.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>The scale of that misleading influence can extend across several institutions.</p>\n</blockquote>\n<p>that misleading influence复现前段misleading impression of influence，多个机构是下一层规模扩展。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>In one reported case, a person acting in multiple roles used at least fifteen journals to support papers by five scientists. The problem is widespread in Scopus, where a listing appears to make a journal a potential target.</p>\n</blockquote>\n<p>一人用15种期刊服务五位科学家，具体支撑跨机构影响，并引出Scopus。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>The database nevertheless possesses information that could help identify the problem.</p>\n</blockquote>\n<p>The database有了Scopus这个先行项，nevertheless准备从问题严重转向仍有检测条件。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明供引期刊与受益论文之间的关系 → 展示跨期刊机构规模及数据库中的问题 → 说明数据库识别异常的基础与限度</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One way of seeking those numbers is organised exchange.</p>\n</blockquote>\n<p>organised exchange属于前面解释联盟方式的起点，放此处会倒退且无法承接跨机构规模。</p>\n<p><strong>44题选D。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为D → G → H。\n\n先看前段D的结尾：\n\n> The problem is widespread in Scopus, where a listing appears to make a journal a potential target.\n\n再看G段开头：\n\n> The database nevertheless possesses information that could help identify the problem.\n\nScopus中问题广泛之后，nevertheless转到同一数据库拥有有用信息。\n\n本段内部继续写道：\n\n> An unusually large number of citations soon after publication is one warning sign. Access to the necessary data creates an opportunity for detection, though it does not establish that every suspicious case has already been stopped.\n\n首年异常高引用给出检测信号，再限定有数据不等于每案已经制止。\n\n后段H开头是：\n\n> Authors also have a part to play when suspicious requests reach them directly.\n\nAuthors also与数据库形成另一行动主体，转向作者直接收到请求的场景。\n\n这三段的推进关系：\n\n> 展示跨期刊机构规模及数据库中的问题 → 说明数据库识别异常的基础与限度 → 提出作者拒绝并报告不当要求的行动\n\n再检验候选F：\n\n> One way of seeking those numbers is organised exchange.\n\nOne way的组织互引已在前文讲明，此处的database与nevertheless要求继续解释检测条件。\n\n**45题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>45题是全文第7段，局部关系为D → G → H。</p>\n<p>先看前段D的结尾：</p>\n<blockquote>\n<p>The problem is widespread in Scopus, where a listing appears to make a journal a potential target.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The database nevertheless possesses information that could help identify the problem.</p>\n</blockquote>\n<p>Scopus中问题广泛之后，nevertheless转到同一数据库拥有有用信息。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>An unusually large number of citations soon after publication is one warning sign. Access to the necessary data creates an opportunity for detection, though it does not establish that every suspicious case has already been stopped.</p>\n</blockquote>\n<p>首年异常高引用给出检测信号，再限定有数据不等于每案已经制止。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Authors also have a part to play when suspicious requests reach them directly.</p>\n</blockquote>\n<p>Authors also与数据库形成另一行动主体，转向作者直接收到请求的场景。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>展示跨期刊机构规模及数据库中的问题 → 说明数据库识别异常的基础与限度 → 提出作者拒绝并报告不当要求的行动</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>One way of seeking those numbers is organised exchange.</p>\n</blockquote>\n<p>One way的组织互引已在前文讲明，此处的database与nevertheless要求继续解释检测条件。</p>\n<p><strong>45题选G。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **academic integrity** | **学术诚信** | **核心价值观｜诚信** | **宏观主题** |\n| responsible research | 负责任的研究 | 人生哲理｜责任与奉献 | 个人主题 |\n| reliable evaluation | 可靠评价 | 社会现象｜文化教育 | 宏观主题 |\n| **critical scrutiny** | **审慎核查** | **人生哲理｜批判性思维** | **个人主题** |\n| transparent practices | 透明做法 | 核心价值观｜诚信 | 宏观主题 |\n| independent judgment | 独立判断 | 人生哲理｜独立思考 | 个人主题 |\n| professional responsibility | 职业责任 | 核心价值观｜敬业 | 个人主题 |\n| meaningful contribution | 有意义的贡献 | 人生哲理｜责任与奉献 | 个人主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>academic integrity</strong></td>\n<td><strong>学术诚信</strong></td>\n<td><strong>核心价值观｜诚信</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>responsible research</td>\n<td>负责任的研究</td>\n<td>人生哲理｜责任与奉献</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>reliable evaluation</td>\n<td>可靠评价</td>\n<td>社会现象｜文化教育</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>critical scrutiny</strong></td>\n<td><strong>审慎核查</strong></td>\n<td><strong>人生哲理｜批判性思维</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>transparent practices</td>\n<td>透明做法</td>\n<td>核心价值观｜诚信</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>independent judgment</td>\n<td>独立判断</td>\n<td>人生哲理｜独立思考</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>professional responsibi d>\n<td><strong>The total accumulated rapidly within the first year.</strong></td>\n<td><strong>总量在第一年内迅速积累。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>An unusually large increase deserves closer examination.</td>\n<td>异常大幅的增长值得进一步核查。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The number alone does not show whether the underlying relationship is meaningful.</td>\n<td>仅看数量无法判断其背后的关系是否有意义。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement warns against confusing a higher count with a greater contribution.</td>\n<td>这句话提醒人们不要把更高数量等同于更大贡献。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage stresses that participants should report inappropriate practices.</td>\n<td>这段文字强调参与者应报告不当做法。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. A network whose reach is visible in a major database</strong></p><p><strong>B. Detecting abuse and refusing improper requests</strong></p><p><strong>C. Why citation totals matter to researchers</strong></p><p><strong>D. Journals used to supply citations to selected papers</strong></p><p><strong>E. The evolution of organised citation inflation</strong></p><p><strong>F. Lower publication fees as the aim of new journals</strong></p><p><strong>G. The replacement of citations by readers’ opinions</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#x27;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>The advent of electronic publishing and authors&#x27; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#x27;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Scientific papers record research progress, but they also influence careers and institutional reputations. Citation totals are particularly important in this system of evaluation. Their value gives some participants a reason to seek larger numbers without earning them through relevant scholarly use.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>In this supply relationship, the journal carrying the citations may gain nothing for itself. The benefit goes to papers elsewhere, which can accumulate very large totals within a single year. Counting those references without examining their relationship to the articles can therefore give a misleading impression of influence.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>The arrangements have also taken a form involving support services. Consultancies that offer language and editorial assistance sometimes advise contributors to add references. Such advice becomes problematic when the added citations serve an organised scheme rather than the argument of the paper.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>The scale of that misleading influence can extend across several institutions. In one reported case, a person acting in multiple roles used at least fifteen journals to support papers by five scientists. The problem is widespread in Scopus, where a listing appears to make a journal a potential target.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>The multiplication of electronic journals creates further outlets for this scheme. Some publications can be used mainly as suppliers of citations to selected papers. An entire issue may repeatedly cite the same work even when the individual articles have no relevant connection with it.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>One way of seeking those numbers is organised exchange. Groups of authors or journals may cite one another disproportionately, creating patterns that an algorithm can identify as suspicious. These citation cartels have existed for a long time, even though their arrangements are not always visible to readers.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>The database nevertheless possesses information that could help identify the problem. An unusually large number of citations soon after publication is one warning sign. Access to the necessary data creates an opportunity for detection, though it does not establish that every suspicious case has already been stopped.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>Authors also have a part to play when suspicious requests reach them directly. If an editor, reviewer or support service asks for inappropriate references, they should refuse and report the request to the journal. This response prevents a routine editorial exchange from becoming silent cooperation with manipulation.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>recordkeepers</td>\n<td>n.记录者</td>\n<td>scientific community</td>\n<td>科学共同体</td>\n<td>perceived</td>\n<td>adj.被认为的</td>\n</tr>\n<tr>\n<td>impact factor</td>\n<td>影响因子</td>\n<td>citations</td>\n<td>n.引用</td>\n<td>accumulates</td>\n<td>v.积累</td>\n</tr>\n<tr>\n<td>prestige</td>\n<td>n.声望</td>\n<td>reputation</td>\n<td>n.声誉</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>cartels</td>\n<td>n.利益联盟</td>\n<td>conspire</td>\n<td>v.合谋</td>\n<td>inflate</td>\n<td>v.人为抬高</td>\n</tr>\n<tr>\n<td>algorithm</td>\n<td>n.算法</td>\n<td>suspicious</td>\n<td>adj.可疑的</td>\n<td>disproportionately</td>\n<td>adv.不成比例地</td>\n</tr>\n<tr>\n<td>predatory</td>\n<td>adj.掠夺性的</td>\n<td>consultancies</td>\n<td>n.咨询机构</td>\n<td>contributors</td>\n<td>n.投稿者</td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>advent</td>\n<td>n.出现</td>\n<td>outlets</td>\n<td>n.发表渠道</td>\n<td>milk cows</td>\n<td>摇钱树；利益供应源</td>\n</tr>\n<tr>\n<td>issue</td>\n<td>n.期刊的一期</td>\n<td>absolutely</td>\n<td>adv.完全地</td>\n<td>peculiar</td>\n<td>adj.奇怪的</td>\n</tr>\n<tr>\n<td>supposedly</td>\n<td>adv.据称</td>\n<td>profiting</td>\n<td>v.获益</td>\n<td>accrue</td>\n<td>v.积累</td>\n</tr>\n</tbody></table></div>\n<h2>第4段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>insidious</td>\n<td>adj.隐蔽而有害的</td>\n<td>manipulation</td>\n<td>n.操纵</td>\n<td>consultant</td>\n<td>n.顾问</td>\n</tr>\n<tr>\n<td>providers</td>\n<td>n.提供者</td>\n<td>rampant</td>\n<td>adj.猖獗的</td>\n<td>includes</td>\n<td>v.收录</td>\n</tr>\n<tr>\n<td>listing</td>\n<td>n.列入名录</td>\n<td>criterion</td>\n<td>n.标准</td>\n<td>targeted</td>\n<td>v.被盯上</td>\n</tr>\n</tbody></table></div>\n<h2>第5段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>detect</td>\n<td>v.识别；查出</td>\n<td>malpractice</td>\n<td>n.不当行为</td>\n<td>red flags</td>\n<td>危险信号</td>\n</tr>\n<tr>\n<td>steer clear of</td>\n<td>避开</td>\n<td>reviewer</td>\n<td>n.审稿人</td>\n<td>inappropriate</td>\n<td>adj.不当的</td>\n</tr>\n<tr>\n<td>references</td>\n<td>n.参考文献</td>\n<td>oblige</td>\n<td>v.照办</td>\n<td>report</td>\n<td>v.报告</td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n<h3>意群划分 · 第1段</h3>\n<p>Scientific papers are the recordkeepers / of progress in research.</p>\n<p>Each year / researchers publish millions of papers / in more than 30,000 journals.</p>\n<p>The scientific community measures / the quality of those papers / in a number of ways, / including the perceived quality of the journal / (as reflected by the title&#39;s impact factor) / and the number of citations / a specific paper accumulates.</p>\n<p>The careers of scientists / and the reputation of their institutions / depend on / the number and prestige / of the papers they produce, / but even more so / on the citations attracted / by these papers.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>科学论文是记录者 / 研究进展的。</p>\n<p>每年 / 研究人员发表数百万篇论文 / 在超过30,000种期刊中。</p>\n<p>科学界衡量 / 这些论文的质量 / 通过多种方式，/ 包括期刊的感知质量 / （通过期刊的影响因子反映）/ 以及引用次数 / 一篇特定论文积累的。</p>\n<p>科学家的职业生涯 / 和他们机构的声誉 / 取决于 / 数量和声望 / 他们发表的论文的，/ 但更重要的是 / 引用次数 / 这些论文吸引的。</p>\n<h3>标准译文 · 第1段</h3>\n<p>科学论文是研究进展的记录者。每年，研究人员在超过30,000种期刊中发表数百万篇论文。科学界通过多种方式衡量这些论文的质量，包括期刊的感知质量（通过期刊的影响因子反映）以及特定论文积累的引用次数。科学家的职业生涯和他们机构的声誉取决于他们发表论文的数量和声望，但更重要的是这些论文吸引的引用次数。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time. In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications. Recently, another expression of this predatory behavior: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.</p>\n<h3>意群划分 · 第2段</h3>\n<p>Citation cartels, / where journals, authors, and institutions / conspire to inflate citation numbers, / have existed for a long time.</p>\n<p>In 2016, / researchers developed an algorithm / to recognize suspicious citation patterns, / including groups of authors / that disproportionately cite one another / and groups of journals / that cite each other frequently / to increase the impact factors / of their publications.</p>\n<p>Recently, / another expression of this predatory behavior: / so-called support service consultancies / that provide language and other editorial support / to individual authors and to journals / sometimes advise contributors / to add a number of citations / to their articles.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>引用联盟，/ 其中期刊、作者和机构 / 串谋虚增引用数量，/ 已经存在很长时间了。</p>\n<p>在2016年，/ 研究人员开发了一种算法 / 来识别可疑的引用模式，/ 包括作者群体 / 不成比例地相互引用的 / 以及期刊群体 / 频繁相互引用的 / 来增加影响因子 / 他们出版物的。</p>\n<p>最近，/ 这种掠夺性行为的另一种表现：/ 所谓的支持服务咨询机构 / 提供语言和其他编辑支持的 / 给个人作者和期刊 / 有时会建议投稿人 / 添加一些引用 / 到他们的文章中。</p>\n<h3>标准译文 · 第2段</h3>\n<p>引用联盟e——期刊、作者和机构串谋虚增引用数量——已经存在很长时间了。2016年，研究人员开发了一种算法来识别可疑的引用模式，包括不成比例地相互引用的作者群体，以及为了增加出版物影响因子而频繁相互引用的期刊群体。最近，这种掠夺性行为出现了另一种表现形式：所谓的支持服务咨询机构，它们为个人作者和期刊提供语言和其他编辑支持，有时会建议投稿人在文章中添加一些引用。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>The advent of electronic publishing and authors&#39; need to find outlets for their papers resulted in thousands of new journals. The birth of predatory journals wasn&#39;t far behind. These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers. In some instances, there is absolutely no relationship between the content of the article and the citations. The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals. Such practices can lead an article to accrue more than 150 citations in the same year that it was published.</p>\n<h3>意群划分 · 第3段</h3>\n<p>The advent of electronic publishing / and authors&#39; need / to find outlets for their papers / resulted in thousands of new journals.</p>\n<p>The birth of predatory journals / wasn&#39;t far behind.</p>\n<p>These journals can act as milk cows / where every single article / in an issue / may cite a specific paper / or a series of papers.</p>\n<p>In some instances, / there is absolutely no relationship / between the content of the article / and the citations.</p>\n<p>The peculiar part is / that the journal / that the editor is supposedly working for / is not profiting at all — / it is just providing citations / to other journals.</p>\n<p>Such practices can lead / an article to accrue / more than 150 citations / in the same year / that it was published.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>电子出版的出现 / 和作者的需求 / 为他们的论文寻找发表渠道 / 导致了数千种新期刊的出现。</p>\n<p>掠夺性期刊的诞生 / 紧随其后。</p>\n<p>这些期刊可以充当奶牛 / 其中每一篇文章 / 在一期中 / 可能引用特定的论文 / 或一系列论文。</p>\n<p>在某些情况下，/ 绝对没有关系 / 在文章内容 / 和引用之间。</p>\n<p>奇怪的部分是 / 这个期刊 / 编辑理应为之工作的 / 根本没有获利 — / 它只是在提供引用 / 给其他期刊。</p>\n<p>这种做法可以导致 / 一篇文章积累 / 超过150次引用 / 在同一年内 / 它发表的。</p>\n<h3>标准译文 · 第3段</h3>\n<p>电子出版的出现和作者寻找论文发表渠道的需求导致了数千种新期刊的出现。掠夺性期刊的诞生紧随其后。这些期刊可以充当&quot;奶牛&quot;，其中一期的每一篇文章都可能引用特定的论文或一系列论文。在某些情况下，文章内容和引用之间绝对没有任何关系。奇怪的是，编辑理应为之工作的期刊根本没有获利——它只是在为其他期刊提供引用。这种做法可以导致一篇文章在发表的同一年内积累超过150次引用。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>How insidious is this type of citation manipulation? In one example, an individual—acting as author, editor, and consultant—was able to use at least 15 journals as citation providers to articles published by five scientists at three universities. The problem is rampant in Scopus, which includes a high number of the new &quot;international&quot; journals. In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.</p>\n<h3>意群划分 · 第4段</h3>\n<p>How insidious is / this type of citation manipulation?</p>\n<p>In one example, / an individual— / acting as author, editor, and consultant— / was able to use / at least 15 journals / as citation providers / to articles published / by five scientists / at three universities.</p>\n<p>The problem is rampant / in Scopus, / which includes a high number / of the new &quot;international&quot; journals.</p>\n<p>In fact, / a listing in Scopus / seems to be a criterion / to be targeted / in this type of citation manipulation.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>多么阴险 / 这种类型的引用操纵？</p>\n<p>在一个例子中，/ 一个人— / 同时充当作者、编辑和顾问— / 能够使用 / 至少15种期刊 / 作为引用提供者 / 给发表的文章 / 由五位科学家 / 在三所大学。</p>\n<p>这个问题很猖獗 / 在Scopus中，/ 它包含大量 / 新的&quot;国际&quot;期刊。</p>\n<p>事实上，/ 在Scopus中的收录 / 似乎是一个标准 / 被瞄准 / 在这种类型的引用操纵中。</p>\n<h3>标准译文 · 第4段</h3>\n<p>这种类型的引用操纵有多阴险？在一个例子中，一个同时充当作者、编辑和顾问的人，能够使用至少15种期刊作为引用提供者，为三所大学的五位科学家发表的文章提供引用。这个问题在Scopus中很猖獗，Scopus收录了大量新的&quot;国际&quot;期刊。事实上，在Scopus中被收录似乎成为了这种引用操纵的目标标准。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>Scopus itself has all the data necessary to detect this malpractice. Red flags include a large number of citations to an article within the first year. And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n<h3>意群划分 · 第5段</h3>\n<p>Scopus itself has / all the data necessary / to detect this malpractice.</p>\n<p>Red flags include / a large number of citations / to an article / within the first year.</p>\n<p>And for authors / who wish to steer clear / of citation cartel activities: / when an editor, a reviewer, or a support service / asks you to add / inappropriate references, / do not oblige / and do report the request / to the journal.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>Scopus本身拥有 / 所有必要的数据 / 来检测这种不当行为。</p>\n<p>危险信号包括 / 大量的引用 / 对一篇文章 / 在第一年内。</p>\n<p>对于作者们 / 希望避开 / 引用联盟活动的：/ 当编辑、审稿人或支持服务 / 要求你添加 / 不适当的参考文献，/ 不要服从 / 并且要报告这个请求 / 给期刊。</p>\n<h3>标准译文 · 第5段</h3>\n<p>Scopus本身拥有检测这种不当行为所需的所有数据。危险信号包括一篇文章在发表第一年内就获得大量引用。对于希望避开引用联盟活动的作者：当编辑、审稿人或支持服务要求你添加不适当的参考文献时，不要服从，并且要向期刊报告这个请求。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>Scientific papers are the recordkeepers：(of progress in research).</p>\n<p>Each year → researchers publish millions of papers：(in more than 30,000 journals).</p>\n<p>The scientific community measures → the quality of those papers：(in a number of ways)：(including the perceived quality of the journal：(as reflected by the title&#39;s impact factor) + the number of citations：(a specific paper accumulates)).</p>\n<p>The careers of scientists + the reputation of their institutions → depend on：(the number and prestige：(of the papers they produce)) // but even more so：(on the citations attracted：(by these papers)).</p>\n<p><strong>第2段</strong></p>\n<p>Citation cartels：(where journals, authors, and institutions → conspire to inflate citation numbers) → have existed for a long time.</p>\n<p>In 2016 → researchers developed an algorithm：(to recognize suspicious citation patterns)：(including groups of authors：(that disproportionately cite one another) + groups of journals：(that cite each other frequently)：(to increase the impact factors：(of their publications))).</p>\n<p>Recently → another expression of this predatory behavior：so-called support service consultancies：(that provide language and other editorial support：(to individual authors and to journals)) → sometimes advise contributors：(to add a number of citations：(to their articles)).</p>\n<p><strong>第3段</strong></p>\n<p>The advent of electronic publishing + authors&#39; need：(to find outlets for their papers) → resulted in thousands of new journals.</p>\n<p>The birth of predatory journals → wasn&#39;t far behind.</p>\n<p>These journals can act as milk cows：(where every single article：(in an issue) → may cite a specific paper + a series of papers).</p>\n<p>In some instances → there is absolutely no relationship：(between the content of the article + the citations).</p>\n<p>The peculiar part is：(that the journal：(that the editor is supposedly working for) → is not profiting at all) — it is just providing citations：(to other journals).</p>\n<p>Such practices can lead → an article to accrue：(more than 150 citations)：(in the same year：(that it was published)).</p>\n<p><strong>第4段</strong></p>\n<p>How insidious is → this type of citation manipulation?</p>\n<p>In one example → an individual：(acting as author, editor, and consultant) → was able to use：(at least 15 journals)：(as citation providers)：(to articles published：(by five scientists：(at three universities))).</p>\n<p>The problem is rampant：(in Scopus)：(which includes a high number：(of the new &quot;international&quot; journals)).</p>\n<p>In fact → a listing in Scopus → seems to be a criterion：(to be targeted：(in this type of citation manipulation)).</p>\n<p><strong>第5段</strong></p>\n<p>Scopus itself has → all the data necessary：(to detect this malpractice).</p>\n<p>Red flags include → a large number of citations：(to an article)：(within the first year).</p>\n<p>And for authors：(who wish to steer clear：(of citation cartel activities))：when an editor, a reviewer, or a support service → asks you to add：(inappropriate references) → do not oblige + do report the request：(to the journal).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>科学论文是记录者：(研究进展的)。</p>\n<p>每年 → 研究人员发表数百万篇论文：(在超过30,000种期刊中)。</p>\n<p>科学界衡量 → 这些论文的质量：(通过多种方式)：(包括期刊的感知质量：(通过期刊的影响因子反映) + 引用次数：(一篇特定论文积累的))。</p>\n<p>科学家的职业生涯 + 他们机构的声誉 → 取决于：(数量和声望：(他们发表的论文的)) // 但更重要的是：(引用次数：(这些论文吸引的))。</p>\n<p><strong>第2段</strong></p>\n<p>引用联盟：(其中期刊、作者和机构 → 串谋虚增引用数量) → 已经存在很长时间了。</p>\n<p>在2016年 → 研究人员开发了一种算法：(来识别可疑的引用模式)：(包括作者群体：(不成比例地相互引用的) + 期刊群体：(频繁相互引用的)：(来增加影响因子：(他们出版物的)))。</p>\n<p>最近 → 这种掠夺性行为的另一种表现：所谓的支持服务咨询机构：(提供语言和其他编辑支持的：(给个人作者和期刊)) → 有时会建议投稿人：(添加一些引用：(到他们的文章中))。</p>\n<p><strong>第3段</strong></p>\n<p>电子出版的出现 + 作者的需求：(为他们的论文寻找发表渠道) → 导致了数千种新期刊的出现。</p>\n<p>掠夺性期刊的诞生 → 紧随其后。</p>\n<p>这些期刊可以充当奶牛：(其中每一篇文章：(在一期中) → 可能引用特定的论文 + 一系列论文)。</p>\n<p>在某些情况下 → 绝对没有关系：(在文章内容 + 引用之间)。</p>\n<p>奇怪的部分是：(这个期刊：(编辑理应为之工作的) → 根本没有获利) — 它只是在提供引用：(给其他期刊)。</p>\n<p>这种做法可以导致 → 一篇文章积累：(超过150次引用)：(在同一年内：(它发表的))。</p>\n<p><strong>第4段</strong></p>\n<p>多么阴险 → 这种类型的引用操纵？</p>\n<p>在一个例子中 → 一个人：(同时充当作者、编辑和顾问) → 能够使用：(至少15种期刊)：(作为引用提供者)：(给发表的文章：(由五位科学家：(在三所大学)))。</p>\n<p>这个问题很猖獗：(在Scopus中)：(它包含大量：(新的&quot;国际&quot;期刊))。</p>\n<p>事实上 → 在Scopus中的收录 → 似乎是一个标准：(被瞄准：(在这种类型的引用操纵中))。</p>\n<p><strong>第5段</strong></p>\n<p>Scopus本身拥有 → 所有必要的数据：(来检测这种不当行为)。</p>\n<p>危险信号包括 → 大量的引用：(对一篇文章)：(在第一年内)。</p>\n<p>对于作者们：(希望避开：(引用联盟活动的))：当编辑、审稿人或支持服务 → 要求你添加：(不适当的参考文献) → 不要服从 + 要报告这个请求：(给期刊)。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第4句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>The careers of scientists / and the reputation of their institutions / depend on / the number and prestige / of the papers they produce, / but even more so / on the citations attracted / by these papers.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>科学家的职业生涯 / 和他们机构的声誉 / 取决于 / 数量和声望 / 他们发表的论文的，/ 但更重要的是 / 引用次数 / 这些论文吸引的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把number and prestige与citations分成两层依赖因素；but even more so省略重复的depend on。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>科学家的职业生涯  和他们机构的声誉  取决于  数量和声望  他们发表的论文的， 但更重要的是  引用次数  这些论文吸引的。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>科学家的职业和机构声誉依赖其论文，尤其依赖论文获得的引用。</p>\n</blockquote>\n<p>先说被影响的职业和声誉，再列论文数量声望，最后强调被引用次数。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>科学家的职业发展及其所在机构的声誉，取决于他们发表论文的数量和声望，但更取决于这些论文获得的引用。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>attracted by these papers是论文吸引来的引用，不是论文自身列出的参考文献。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>科学家的职业发展及其所在机构的声誉，取决于他们发表论文的数量和声望，但更取决于这些论文获得的引用。</p>\n</blockquote>\n<h2>2. 第2段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>In 2016, / researchers developed an algorithm / to recognize suspicious citation patterns, / including groups of authors / that disproportionately cite one another / and groups of journals / that cite each other frequently / to increase the impact factors / of their publications.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>在2016年，/ 研究人员开发了一种算法 / 来识别可疑的引用模式，/ 包括作者群体 / 不成比例地相互引用的 / 以及期刊群体 / 频繁相互引用的 / 来增加影响因子 / 他们出版物的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>including后并列两类groups，两个that分别修饰作者群体和期刊群体；to increase说明后者的目的。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>在2016年， 研究人员开发了一种算法  来识别可疑的引用模式， 包括作者群体  不成比例地相互引用的  以及期刊群体  频繁相互引用的  来增加影响因子  他们出版物的。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>算法识别作者或期刊之间不成比例的相互引用。</p>\n</blockquote>\n<p>先交代算法目的，再分说作者和期刊两种可疑模式。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>2016年，研究者开发了一种算法来识别可疑的引用模式，包括作者群体中不成比例的相互引用，以及期刊群体为提高自身影响因子而频繁相互引用的情况。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>frequently与disproportionately强调异常模式，不能泛化为所有正常引用都可疑。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>2016年，研究者开发了一种算法来识别可疑的引用模式，包括作者群体中不成比例的相互引用，以及期刊群体为提高自身影响因子而频繁相互引用的情况。</p>\n</blockquote>\n<h2>3. 第5段第3句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>And for authors / who wish to steer clear / of citation cartel activities: / when an editor, a reviewer, or a support service / asks you to add / inappropriate references, / do not oblige / and do report the request / to the journal.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>对于作者们 / 希望避开 / 引用联盟活动的：/ 当编辑、审稿人或支持服务 / 要求你添加 / 不适当的参考文献，/ 不要服从 / 并且要报告这个请求 / 给期刊。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>who限定想避开联盟活动的作者，when引出三类主体提出要求的情境，主句由两个祈使结构组成。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>对于作者们  希望避开  引用联盟活动的： 当编辑、审稿人或支持服务  要求你添加  不适当的参考文献， 不要服从  并且要报告这个请求  给期刊。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>作者遇到不当引用要求应拒绝并报告。</p>\n</blockquote>\n<p>先交代读者对象，再给出触发情境，最后落实拒绝和报告两项动作。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>对于希望远离引用联盟活动的作者来说，当编辑、审稿人或支持服务机构要求你添加不恰当的参考文献时，不要照办，而应当向期刊报告这一要求。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>do not oblige是不要照办，do report中的do用于强调应当报告。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>对于希望远离引用联盟活动的作者来说，当编辑、审稿人或支持服务机构要求你添加不恰当的参考文献时，不要照办，而应当向期刊报告这一要求。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从36题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>36题</h2>\n<blockquote>\n<p>According to Paragraph 1, the careers of scientists can be determined by  ______.</p>\n<p>根据第1段，科学家的职业生涯可能由什么决定？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节理解题：分清论文引用别人和论文被别人引用，确认prestige修饰的对象。</p>\n<p>题干明确给出Paragraph 1，并点出the careers of scientists。直接进入第1段，从科学论文的作用读到段末科学家的职业生涯与论文之间的关系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>but even more so on the citations attracted by these papers.</p>\n<p>The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce,</p>\n</blockquote>\n<h3>A. how many citations their works contain</h3>\n<blockquote>\n<p>科学家的职业发展可由以下因素决定：他们的作品包含多少处引用。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>citations attracted by these papers是论文吸引来的引用，即别人引用它们；A的contain说论文里面引用了多少别人的文献，把方向倒过来了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>科学家的职业发展可由以下因素决定：他们的作品包含多少处引用。</p>\n</blockquote>\n<p><code>A</code>的<code>their works contain</code>说的是论文内部列出的引用；第1段末句的<code>citations attracted by these papers</code>也谈论文与引用，并且直接接在职业生涯的<code>depend on</code>之后，要回看这句，辨清引用与论文的方向。</p>\n<p>原文的<code>citations attracted by these papers</code>说这些论文吸引来的引用，即别的文章引用这些论文；这些被引用情况影响科学家的职业生涯。<code>A</code>的<code>their works contain</code>则把引用放在科学家自己的论文里面，计算的是自己的论文引用了多少文献。论文被别人引用，与论文内部引用别人，方向不同；题干要找前一种关系中的职业影响因素，不能改成后一种。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Scientific papers are the recordkeepers of progress in research. Each year researchers publish millions of papers in more than 30,000 journals. The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#39;s impact factor) and the number of citations a specific paper accumulates. The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.</p>\n<p>科学论文记录研究进展。每年有数百万篇论文发表于三万多种期刊。科学共同体用多种方式衡量论文质量，包括期刊被认为具有的质量（体现为影响因子），以及具体论文累积的被引用次数。科学家的职业发展和机构声誉依赖其论文的数量与声望，而更依赖这些论文吸引来的引用。</p>\n</blockquote>\n<p>首段先介绍评价指标，再把职业与机构声誉同论文产出、尤其被引情况联系起来。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Scientists’ careers can be determined by how many citations their works contain.</p>\n<p>科学家的职业发展可由以下因素决定：他们的作品包含多少处引用。</p>\n</blockquote>\n<p>A成立时，应当是作者多列参考文献就能推动职业发展；实际写的是自己的论文得到多少引用，不能用参考文献表长度替代。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. how many times their papers are cited</h3>\n<blockquote>\n<p>科学家的职业发展可由以下因素决定：他们的论文被引用多少次。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>论文累积的citations与attracted by these papers都指被引用次数，B的are cited以被动式表达同一方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Scientific papers are
