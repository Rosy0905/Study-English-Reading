html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-B-0\"><blockquote>\n<p>当前纠纷的可能后果是不太知名PRH作者成为批评对象。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>不太知名作者受损来自推广渠道受影响，原段没说他们被责难。B将商业损失改成成为批评对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>当前纠纷的可能后果是不太知名PRH作者成为批评对象。</p>\n</blockquote>\n<p><code>Lesser-known PRH writers</code>对应第4段<code>lesser-known writers</code>；<code>target of criticism</code>则要核对他们在纠纷中受到的究竟是哪种对待，因此回看作者受损与<code>promoting books by lesser-known writers</code>这两层说明。</p>\n<p>原文把这些作者写成纠纷中的受损者，并说明他们通常依靠员工<code>promoting books by lesser-known writers</code>的热情。选项<code>target of criticism</code>却把这种受损具体解释为作者被人指责。推广帮助与批评攻击是不同动作；原文将作者的处境连接到书籍推广，并没有把纠纷接成对作者的责难。</p>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n<p>与此同时，PRH作者已成为受损者。知名作者或许只受一些影响，但那些通常依赖Waterstones员工热情推广不太知名作品的中间层次作者，更会盼望纠纷结束。</p>\n</blockquote>\n<p>作者先区分名气带来的抗冲击差别，再解释中间层次作者为何依赖员工推荐。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The dispute may mean that lesser-known PRH writers become the target of criticism.</p>\n<p>当前纠纷的可能后果是不太知名PRH作者成为批评对象。</p>\n</blockquote>\n<p>B需要他人指责这些作者的行为。双方纠纷影响其书被看见，不等于纠纷矛头指向作者本人。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. Waterstones staff hesitate to promote big-name authors’ books.","raw":"### C. Waterstones staff hesitate to promote big-name authors’ books.\n\n> 当前纠纷的可能后果是店员犹豫是否推广知名作者。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\nstaff's passion接的是不太知名作者的推广，C换成推广知名作者时犹豫，又加入员工心理态度。\n\n**出处：**\n\n> In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it's those mid-list authors, who normally rely on Waterstones staff's passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"34","option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-34-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-C-0\"><blockquote>\n<p>当前纠纷的可能后果是店员犹豫是否推广知名作者。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>staff&#39;s passion接的是不太知名作者的推广，C换成推广知名作者时犹豫，又加入员工心理态度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n</section>"},{"title":"C. Waterstones staff hesitate to promote big-name authors’ books.","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 当前纠纷的可能后果是店员犹豫是否推广知名作者。\n\n`hesitate to promote`涉及员工推广时的态度，`big-name authors`又对应第4段`Big-name PRH authors`；回看本段对知名作者的影响和`staff’s passion`各自接的是谁，并联系第2段员工收到移书指示的叙述。\n\n原文说知名作者可能受到一点影响；说明`staff’s passion`时，具体谈的是不太知名作者依靠员工推广。第2段所写的书店动作则是分店经理接到移书指示。\n\n选项`hesitate to promote`把这些内容改成员工对推广知名作者产生犹豫。\n\n受到影响不等于员工产生犹豫，执行移书指示也没有表达这种心理；选项还把关于不太知名作者的推广关系接到了知名作者身上。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-34-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-C-0\"><blockquote>\n<p>当前纠纷的可能后果是店员犹豫是否推广知名作者。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>staff&#39;s passion接的是不太知名作者的推广，C换成推广知名作者时犹豫，又加入员工心理态度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>当前纠纷的可能后果是店员犹豫是否推广知名作者。</p>\n</blockquote>\n<p><code>hesitate to promote</code>涉及员工推广时的态度，<code>big-name authors</code>又对应第4段<code>Big-name PRH authors</code>；回看本段对知名作者的影响和<code>staff’s passion</code>各自接的是谁，并联系第2段员工收到移书指示的叙述。</p>\n<p>原文说知名作者可能受到一点影响；说明<code>staff’s passion</code>时，具体谈的是不太知名作者依靠员工推广。第2段所写的书店动作则是分店经理接到移书指示。</p>\n<p>选项<code>hesitate to promote</code>把这些内容改成员工对推广知名作者产生犹豫。</p>\n<p>受到影响不等于员工产生犹豫，执行移书指示也没有表达这种心理；选项还把关于不太知名作者的推广关系接到了知名作者身上。</p>\n</section>"},{"title":"C. Waterstones staff hesitate to promote big-name authors’ books.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it's those mid-list authors, who normally rely on Waterstones staff's passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.\n>\n> 与此同时，PRH作者已成为受损者。知名作者或许只受一些影响，但那些通常依赖Waterstones员工热情推广不太知名作品的中间层次作者，更会盼望纠纷结束。\n\n知名作者可能轻微受损，与中间层次作者依赖推荐形成对照；第二段则说经理收到撤书指示。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The dispute may mean that waterstones staff hesitate to promote big-name authors’ books.\n>\n> 当前纠纷的可能后果是店员犹豫是否推广知名作者。\n\nC需要员工对名家作品拿不定主意的证据。执行陈列调整不等于心理犹豫，不能把推广对象及态度同时改写。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"C","cumulative":true,"cumulativeGroup":"question-34-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-34-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-C-0\"><blockquote>\n<p>当前纠纷的可能后果是店员犹豫是否推广知名作者。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>staff&#39;s passion接的是不太知名作者的推广，C换成推广知名作者时犹豫，又加入员工心理态度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>当前纠纷的可能后果是店员犹豫是否推广知名作者。</p>\n</blockquote>\n<p><code>hesitate to promote</code>涉及员工推广时的态度，<code>big-name authors</code>又对应第4段<code>Big-name PRH authors</code>；回看本段对知名作者的影响和<code>staff’s passion</code>各自接的是谁，并联系第2段员工收到移书指示的叙述。</p>\n<p>原文说知名作者可能受到一点影响；说明<code>staff’s passion</code>时，具体谈的是不太知名作者依靠员工推广。第2段所写的书店动作则是分店经理接到移书指示。</p>\n<p>选项<code>hesitate to promote</code>把这些内容改成员工对推广知名作者产生犹豫。</p>\n<p>受到影响不等于员工产生犹豫，执行移书指示也没有表达这种心理；选项还把关于不太知名作者的推广关系接到了知名作者身上。</p>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n<p>与此同时，PRH作者已成为受损者。知名作者或许只受一些影响，但那些通常依赖Waterstones员工热情推广不太知名作品的中间层次作者，更会盼望纠纷结束。</p>\n</blockquote>\n<p>知名作者可能轻微受损，与中间层次作者依赖推荐形成对照；第二段则说经理收到撤书指示。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The dispute may mean that waterstones staff hesitate to promote big-name authors’ books.</p>\n<p>当前纠纷的可能后果是店员犹豫是否推广知名作者。</p>\n</blockquote>\n<p>C需要员工对名家作品拿不定主意的证据。执行陈列调整不等于心理犹豫，不能把推广对象及态度同时改写。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. Waterstones branches suffer a severe reduction in revenue.","raw":"### D. Waterstones branches suffer a severe reduction in revenue.\n\n> 当前纠纷的可能后果是Waterstones分店收入严重减少。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第三类——无中生有。**\n\n该段明确PRH作者受损，并未给书店收入大降数据。D把损失主体换成分店，还添加严重收入下降这一具体后果。\n\n**出处：**\n\n> PRH declined to comment on the issue, but a spokesperson for Waterstones told me: \"Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.\"\n> In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it's those mid-list authors, who normally rely on Waterstones staff's passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"34","option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-34-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-D-0\"><blockquote>\n<p>当前纠纷的可能后果是Waterstones分店收入严重减少。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>该段明确PRH作者受损，并未给书店收入大降数据。D把损失主体换成分店，还添加严重收入下降这一具体后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>PRH declined to comment on the issue, but a spokesperson for Waterstones told me: &quot;Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.&quot;\nIn the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n</section>"},{"title":"D. Waterstones branches suffer a severe reduction in revenue.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 当前纠纷的可能后果是Waterstones分店收入严重减少。\n\n`branches suffer a severe reduction in revenue`把损失落到书店收入；第4段说`PRH authors have been the losers`，而第3段末尾描述门店繁忙和销量，所以要把受损者的交代与书店自己的经营表态分开核对。\n\n原文用`PRH authors have been the losers`明确引出作者的损失，再解释不太知名作者依赖推广的处境；说到水石书店，则列出门店繁忙和“每月好书”销量强劲。选项`branches suffer a severe reduction in revenue`把损失转成各分店收入大幅下降。销量表现不等于完整的收入报表，但原文也没有将作者的推广损失连接为书店大幅收入损失；选项替换了受损主体，又增加了具体的收入结果及程度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-34-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-D-0\"><blockquote>\n<p>当前纠纷的可能后果是Waterstones分店收入严重减少。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>该段明确PRH作者受损，并未给书店收入大降数据。D把损失主体换成分店，还添加严重收入下降这一具体后果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>PRH declined to comment on the issue, but a spokesperson for Waterstones told me: &quot;Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.&quot;\nIn the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>当前纠纷的可能后果是Waterstones分店收入严重减少。</p>\n</blockquote>\n<p><code>branches suffer a severe reduction in revenue</code>把损失落到书店收入；第4段说<code>PRH authors have been the losers</code>，而第3段末尾描述门店繁忙和销量，所以要把受损者的交代与书店自己的经营表态分开核对。</p>\n<p>原文用<code>PRH authors have been the losers</code>明确引出作者的损失，再解释不太知名作者依赖推广的处境；说到水石书店，则列出门店繁忙和“每月好书”销量强劲。选项<code>branches suffer a severe reduction in revenue</code>把损失转成各分店收入大幅下降。销量表现不等于完整的收入报表，但原文也没有将作者的推广损失连接为书店大幅收入损失；选项替换了受损主体，又增加了具体的收入结果及程度。</p>\n</section>"},{"title":"D. Waterstones branches suffer a severe reduction in revenue.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> PRH declined to comment on the issue, but a spokesperson for Waterstones told me: \"Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.\"\n> In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it's those mid-list authors, who normally rely on Waterstones staff's passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.\n>\n> PRH拒绝评论。Waterstones发言人说，目前在PRH缩减的信用条件下经营，PRH是英国唯一限制其交易能力的出版商。他们没有抵制PRH图书，虽然总体库存较低，仍尽力确保顾客能买到书。门店重开后，他们希望一切恢复正常、能获准适当采购。门店确实异常繁忙，五月每月好书推荐的销量超过2018年以来任何一个月。\n>\n> 与此同时，PRH作者已成为受损者。知名作者或许只受一些影响，但那些通常依赖Waterstones员工热情推广不太知名作品的中间层次作者，更会盼望纠纷结束。\n\nWaterstones此前强调繁忙和推荐书销量；In the meantime再转向在同一冲突中付出不同代价的作者。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The dispute may mean that waterstones branches suffer a severe reduction in revenue.\n>\n> 当前纠纷的可能后果是Waterstones分店收入严重减少。\n\n销量不等于全部收入，但不能因此凭空补书店收入大降。需要分店收入依据，而作者缺推广的处境不能替代它。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"leve 一具体后果。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"34","questionConclusion":true},"html":"<blockquote>\n<p><strong>34. A</strong></p>\n</blockquote>\n<ul>\n<li>A：中间层次作者更依赖书店员工推广，冲突削弱展示推广时，比知名作者更可能遭受明显销售打击。</li>\n<li>B：不太知名作者受损来自推广渠道受影响，原段没说他们被责难。B将商业损失改成成为批评对象。</li>\n<li>C：staff&#39;s passion接的是不太知名作者的推广，C换成推广知名作者时犹豫，又加入员工心理态度。</li>\n<li>D：该段明确PRH作者受损，并未给书店收入大降数据。D把损失主体换成分店，还添加严重收入下降这一具体后果。</li>\n</ul>\n"},{"title":"35题 · 题干、题型与核心出处","raw":"## 35题\n\n> Which of the following statements best represents Lownie’s view?\n>\n> 下列哪一说法最能代表劳尼的观点？\n\n### 题型\n\n人物观点概括题：把This is all接回合并，再对照集中趋势与多元途径的要求。\n\n题干点名Lownie，第6段用Andrew Lownie引出直接引语，因此先将第6段完整读完，注意他说的权力集中、出版业需要什么，以及小出版商的例子。\n\n### 核心出处\n\n> it also needs a plurality of ways\n>\n> many of the most interesting books in recent years have come from small publishers\n>\n> a wider change towards concentration of power","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"35","questionIntro":true},"html":"<blockquote>\n<p>Which of the following statements best represents Lownie’s view?</p>\n<p>下列哪一说法最能代表劳尼的观点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点概括题：把This is all接回合并，再对照集中趋势与多元途径的要求。</p>\n<p>题干点名Lownie，第6段用Andrew Lownie引出直接引语，因此先将第6段完整读完，注意他说的权力集中、出版业需要什么，以及小出版商的例子。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>it also needs a plurality of ways</p>\n<p>many of the most interesting books in recent years have come from small publishers</p>\n<p>a wider change towards concentration of power</p>\n</blockquote>\n"},{"title":"A. Small publishers ought to stick together.","raw":"### A. Small publishers ought to stick together.\n\n> Lownie认为，小出版商应该联合起来。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n小出版商贡献有趣作品，是支持多种出版渠道价值的例子，Lownie并未要求它们结盟。\n\n**出处：**\n\n> It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon & Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.\n> \"This is all part of a wider change towards concentration of power,\" says literary agent Andrew Lownie. \"The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-35-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-A-0\"><blockquote>\n<p>Lownie认为，小出版商应该联合起来。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>小出版商贡献有趣作品，是支持多种出版渠道价值的例子，Lownie并未要求它们结盟。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.\n&quot;This is all part of a wider change towards concentration of power,&quot; says literary agent Andrew Lownie. &quot;The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers.&quot;</p>\n</blockquote>\n</section>"},{"title":"A. Small publishers ought to stick together.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Lownie认为，小出版商应该联合起来。\n\n`Small publishers`对应第6段末尾`from small publishers`，`ought to stick together`提出他们应当联合行动；回看劳尼为何提到小出版商，以及前一句`a plurality of ways`提出的需求。\n\n劳尼先说出版业还需要`a plurality of ways`，接着用许多有趣的书来自小出版商说明多种出版途径的价值。选项`Small publishers ought to stick together`则把这个例子改成对小出版商联合行动的建议。他指出的是小出版商能贡献怎样的书、行业应当有怎样的多种途径，没有由此建立小出版商彼此结盟或共同应对的任务。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-35-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-A-0\"><blockquote>\n<p>Lownie认为，小出版商应该联合起来。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>小出版商贡献有趣作品，是支持多种出版渠道价值的例子，Lownie并未要求它们结盟。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.\n&quot;This is all part of a wider change towards concentration of power,&quot; says literary agent Andrew Lownie. &quot;The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Lownie认为，小出版商应该联合起来。</p>\n</blockquote>\n<p><code>Small publishers</code>对应第6段末尾<code>from small publishers</code>，<code>ought to stick together</code>提出他们应当联合行动；回看劳尼为何提到小出版商，以及前一句<code>a plurality of ways</code>提出的需求。</p>\n<p>劳尼先说出版业还需要<code>a plurality of ways</code>，接着用许多有趣的书来自小出版商说明多种出版途径的价值。选项<code>Small publishers ought to stick together</code>则把这个例子改成对小出版商联合行动的建议。他指出的是小出版商能贡献怎样的书、行业应当有怎样的多种途径，没有由此建立小出版商彼此结盟或共同应对的任务。</p>\n</section>"},{"title":"A. Small publishers ought to stick together.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon & Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.\n> \"This is all part of a wider change towards concentration of power,\" says literary agent Andrew Lownie. \"The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers.\"\n>\n> 这发生在作者已担心PRH与另一大出版社Simon & Schuster拟议合并后果之际。英国独立出版商数量减少，很可能意味着竞价减少、给作者的预付款降低、出版内容更加趋同。\n>\n> 文学经纪人Andrew Lownie说，这都是权力走向集中的更广变化的一部分。出版业谈作者与员工的多样性，但也需要提供思想交流、选择和不同声音的多种途径。毕竟近年很多最有趣的书来自小出版商。\n\n行业需要不同传递途径与声音的主张之后，用After all引出小出版商成果作为理由。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Lownie believes that small publishers ought to stick together.\n>\n> Lownie认为，小出版商应该联合起来。\n\nA需要小出版商应联合行动的建议。保持多个独立选择与要求他们团结是不同主张，不能把例子改成行动号召。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-opt t years have come from small publishers.&quot;</p>\n</blockquote>\n</section>"},{"title":"D. The merger of publishers is a worrying trend.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Lownie认为，出版商合并是令人担忧的趋势。\n\n`The merger of publishers`对应第5段`the proposed merger`，而劳尼第6段以`This is all`接到`a wider change towards concentration of power`。这里需要把第5段完整读完，弄清他所承接的合并与出版内容变化，再看他为什么提出多种途径和不同声音。\n\n第5段先写作者担忧合并的后果，并明确说出版内容可能更加趋同；第6段劳尼将这一切归入`a wider change towards concentration of power`，又指出行业需要多种途径、选择和不同声音。选项`The merger of publishers is a worrying trend`把合并与这种担忧连接起来：趋同和权力集中正会使他强调的多种途径受到压力。\n\n小出版商能带来许多有趣的书，则补充说明为什么不宜忽略这些途径。\n\n这里的担忧来自他说出的需求与所描述趋势之间的关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-35-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-D-0\"><blockquote>\n<p>Lownie认为，出版商合并是令人担忧的趋势。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>合并可能减少竞价、降低预付款并使内容趋同，Lownie称其为权力集中的一部分，再强调多元渠道，D概括这种担忧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.\n&quot;This is all part of a wider change towards concentration of power,&quot; says literary agent Andrew Lownie. &quot;The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Lownie认为，出版商合并是令人担忧的趋势。</p>\n</blockquote>\n<p><code>The merger of publishers</code>对应第5段<code>the proposed merger</code>，而劳尼第6段以<code>This is all</code>接到<code>a wider change towards concentration of power</code>。这里需要把第5段完整读完，弄清他所承接的合并与出版内容变化，再看他为什么提出多种途径和不同声音。</p>\n<p>第5段先写作者担忧合并的后果，并明确说出版内容可能更加趋同；第6段劳尼将这一切归入<code>a wider change towards concentration of power</code>，又指出行业需要多种途径、选择和不同声音。选项<code>The merger of publishers is a worrying trend</code>把合并与这种担忧连接起来：趋同和权力集中正会使他强调的多种途径受到压力。</p>\n<p>小出版商能带来许多有趣的书，则补充说明为什么不宜忽略这些途径。</p>\n<p>这里的担忧来自他说出的需求与所描述趋势之间的关系。</p>\n</section>"},{"title":"D. The merger of publishers is a worrying trend.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon & Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.\n> \"This is all part of a wider change towards concentration of power,\" says literary agent Andrew Lownie. \"The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers.\"\n>\n> 这发生在作者已担心PRH与另一大出版社Simon & Schuster拟议合并后果之际。英国独立出版商数量减少，很可能意味着竞价减少、给作者的预付款降低、出版内容更加趋同。\n>\n> 文学经纪人Andrew Lownie说，这都是权力走向集中的更广变化的一部分。出版业谈作者与员工的多样性，但也需要提供思想交流、选择和不同声音的多种途径。毕竟近年很多最有趣的书来自小出版商。\n\n第五段提出合并后果，第六段This is all承接，把个别商业争端与合并置于更广的行业集中背景。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Lownie believes that the merger of publishers is a worrying trend.\n>\n> Lownie认为，出版商合并是令人担忧的趋势。\n\nworrying由集中趋势与应保留多元之间的张力推出，不要求他逐字说worried。小出版商的有趣作品说明可能失去何种选择价值。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-35-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-D-0\"><blockquote>\n<p>Lownie认为，出版商合并是令人担忧的趋势。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C、D，此时D尚未排除。随后把全文连起来回看，最终选D。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>合并可能减少竞价、降低预付款并使内容趋同，Lownie称其为权力集中的一部分，再强调多元渠道，D概括这种担忧。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.\n&quot;This is all part of a wider change towards concentration of power,&quot; says literary agent Andrew Lownie. &quot;The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Lownie认为，出版商合并是令人担忧的趋势。</p>\n</blockquote>\n<p><code>The merger of publishers</code>对应第5段<code>the proposed merger</code>，而劳尼第6段以<code>This is all</code>接到<code>a wider change towards concentration of power</code>。这里需要把第5段完整读完，弄清他所承接的合并与出版内容变化，再看他为什么提出多种途径和不同声音。</p>\n<p>第5段先写作者担忧合并的后果，并明确说出版内容可能更加趋同；第6段劳尼将这一切归入<code>a wider change towards concentration of power</code>，又指出行业需要多种途径、选择和不同声音。选项<code>The merger of publishers is a worrying trend</code>把合并与这种担忧连接起来：趋同和权力集中正会使他强调的多种途径受到压力。</p>\n<p>小出版商能带来许多有趣的书，则补充说明为什么不宜忽略这些途径。</p>\n<p>这里的担忧来自他说出的需求与所描述趋势之间的关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.\n&quot;This is all part of a wider change towards concentration of power,&quot; says literary agent Andrew Lownie. &quot;The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers.&quot;</p>\n<p>这发生在作者已担心PRH与另一大出版社Simon &amp; Schuster拟议合并后果之际。英国独立出版商数量减少，很可能意味着竞价减少、给作者的预付款降低、出版内容更加趋同。</p>\n<p>文学经纪人Andrew Lownie说，这都是权力走向集中的更广变化的一部分。出版业谈作者与员工的多样性，但也需要提供思想交流、选择和不同声音的多种途径。毕竟近年很多最有趣的书来自小出版商。</p>\n</blockquote>\n<p>第五段提出合并后果，第六段This is all承接，把个别商业争端与合并置于更广的行业集中背景。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Lownie believes that the merger of publishers is a worrying trend.</p>\n<p>Lownie认为，出版商合并是令人担忧的趋势。</p>\n</blockquote>\n<p>worrying由集中趋势与应保留多元之间的张力推出，不要求他逐字说worried。小出版商的有趣作品说明可能失去何种选择价值。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"35题结论","raw":"### 35题结论\n\n> **35. D**\n\n- A：小出版商贡献有趣作品，是支持多种出版渠道价值的例子，Lownie并未要求它们结盟。\n- B：Lownie说权力正在集中，B却预测大出版商失去主导地位，改变趋势方向。\n- C：行业有难题是宽泛背景，Lownie具体担忧权力集中挤压多元出版途径；只说日子难过，未抓住他最强调的关系。\n- D：合并可能减少竞价、降低预付款并使内容趋同，Lownie称其为权力集中的一部分，再强调多元渠道，D概括这种担忧。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"35","questionConclusion":true},"html":"<blockquote>\n<p><strong>35. D</strong></p>\n</blockquote>\n<ul>\n<li>A：小出版商贡献有趣作品，是支持多种出版渠道价值的例子，Lownie并未要求它们结盟。</li>\n<li>B：Lownie说权力正在集中，B却预测大出版商失去主导地位，改变趋势方向。</li>\n<li>C：行业有难题是宽泛背景，Lownie具体担忧权力集中挤压多元出版途径；只说日子难过，未抓住他最强调的关系。</li>\n<li>D：合并可能减少竞价、降低预付款并使内容趋同，Lownie称其为权力集中的一部分，再强调多元渠道，D概括这种担忧。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：冲突的呈现**（段落1引入事件） 具体例子：寻找两本PRH新书可能困难（苏塞克斯公爵夫人的《长凳》+ 克林顿的《总统的女儿》）→ 原因：PRH与Waterstones陷入对峙\n\n↓（冲突起源）\n\n**逻辑层次2：纠纷的开始与表现**（段落2背景说明） 起因：PRH对Waterstones设置\"非常显著水平\"的信用额度限制（去年年底）→ 后果：Waterstones被迫将PRH书籍从显眼位置（桌子、展示空间、橱窗）移至普通区域\n\n↓（双方立场）\n\n**逻辑层次3：双方的回应**（段落3官方声明） PRH：拒绝评论 // Waterstones回应：【承认处于减少信用条款下（PRH是唯一限制交易的英国出版商）+ 否认抵制（努力保证供应）+ 表达希望（恢复正常）+ 强调业绩（商店繁忙，5月销售创新高）】\n\n↓（实际影响）\n\n**逻辑层次4：对作者的影响**（段落4受害者分析） 影响差异：知名作者受影响较小 // 中等名单作者损失更大（依赖Waterstones员工推广）→ 他们祈祷争端结束\n\n↓（更大背景）\n\n**逻辑层次5：行业整合的忧虑**（段落5-6深层问题） 时机敏感：作者已担心PRH与西蒙舒斯特合并 → 后果：【独立出版商减少 → 竞价战减少 + 预付款降低 + 出版内容趋同】→ Lownie观点：【这是权力集中的体现 + 需要多元化传递方式 + 小出版商贡献了许多有趣作品】\n\n↓（未来展望）\n\n**逻辑层次6：对多元性的担忧**（段落7总结反思） 核心问题：多元性是否会成为出版商追求规模以应对竞争的牺牲品？\n\n↑（全文主旨）\n\n全文核心观点：PRH与Waterstones的商业纠纷不仅影响了图书销售和作者利益，更反映了出版业日益集中化的趋势，这种趋势可能威胁到出版业的多元性和创新性。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：冲突的呈现</strong>（段落1引入事件） 具体例子：寻找两本PRH新书可能困难（苏塞克斯公爵夫人的《长凳》+ 克林顿的《总统的女儿》）→ 原因：PRH与Waterstones陷入对峙</p>\n<p>↓（冲突起源）</p>\n<p><strong>逻辑层次2：纠纷的开始与表现</strong>（段落2背景说明） 起因：PRH对Waterstones设置&quot;非常显著水平&quot;的信用额度限制（去年年底）→ 后果：Waterstones被迫将PRH书籍从显眼位置（桌子、展示空间、橱窗）移至普通区域</p>\n<p>↓（双方立场）</p>\n<p><strong>逻辑层次3：双方的回应</strong>（段落3官方声明） PRH：拒绝评论 // Waterstones回应：【承认处于减少信用条款下（PRH是唯一限制交易的英国出版商）+ 否认抵制（努力保证供应）+ 表达希望（恢复正常）+ 强调业绩（商店繁忙，5月销售创新高）】</p>\n<p>↓（实际影响）</p>\n<p><strong>逻辑层次4：对作者的影响</strong>（段落4受害者分析） 影响差异：知名作者受影响较小 // 中等名单作者损失更大（依赖Waterstones员工推广）→ 他们祈祷争端结束</p>\n<p>↓（更大背景）</p>\n<p><strong>逻辑层次5：行业整合的忧虑</strong>（段落5-6深层问题） 时机敏感：作者已担心PRH与西蒙舒斯特合并 → 后果：【独立出版商减少 → 竞价战减少 + 预付款降低 + 出版内容趋同】→ Lownie观点：【这是权力集中的体现 + 需要多元化传递方式 + 小出版商贡献了许多有趣作品】</p>\n<p>↓（未来展望）</p>\n<p><strong>逻辑层次6：对多元性的担忧</strong>（段落7总结反思） 核心问题：多元性是否会成为出版商追求规模以应对竞争的牺牲品？</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：PRH与Waterstones的商业纠纷不仅影响了图书销售和作者利益，更反映了出版业日益集中化的趋势，这种趋势可能威胁到出版业的多元性和创新性。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. A conflict visible in where books are displayed\n\n> 通过图书展示位置显露的冲突\n\n以两本新书难找引入出版商与书店僵持，随后说明信用限制与移出显眼展示区的行动。\n\n> If you're heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex's new children's book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President's Daughter, the new thriller by Bill Clinton and James Patterson.\n\n两本新书要多找一找的情境，随后被连到共同出版商与Waterstones的僵持，展示位置变化是读者可见的冲突表现。\n\n> The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones \"at a very significant level\".\n\nThe problem began给出信用额度限制这一触发点，并非书籍文学评价引起争议。\n\n> The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were \"quietly retiring them to their relevant sections\".\n\n经理被要求撤出突出展示区、回到普通分区，将商业条件变化具体落实为陈列调整。\n\n这一部分的推进关系是：\n\n> 找书可能不方便 → 出版商信用限制引发冲突 → 图书撤离显眼展示位\n\nvisible in where displayed将读者体验接到具体商业冲突，不能只概括成图书整理。\n\n再看最强干扰项E：A guaranteed end to all credit restrictions。\n\n信用限制仍在，书店希望恢复正常不等于已经保证解除。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. A conflict visible in where books are displayed</p>\n<blockquote>\n<p>通过图书展示位置显露的冲突</p>\n</blockquote>\n<p>以两本新书难找引入出版商与书店僵持，随后说明信用限制与移出显眼展示区的行动。</p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson.</p>\n</blockquote>\n<p>两本新书要多找一找的情境，随后被连到共同出版商与Waterstones的僵持，展示位置变化是读者可见的冲突表现。</p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;.</p>\n</blockquote>\n<p>The problem began给出信用额度限制这一触发点，并非书籍文学评价引起争议。</p>\n<blockquote>\n<p>The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n</blockquote>\n<p>经理被要求撤出突出展示区、回到普通分区，将商业条件变化具体落实为陈列调整。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>找书可能不方便 → 出版商信用限制引发冲突 → 图书撤离显眼展示位</p>\n</blockquote>\n<p>visible in where displayed将读者体验接到具体商业冲突，不能只概括成图书整理。</p>\n<p>再看最强干扰项E：A guaranteed end to all credit restrictions。</p>\n<p>信用限制仍在，书店希望恢复正常不等于已经保证解除。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】B. A retailer’s attempt to reassure customers and suppliers\n\n> 零售商安抚顾客与供货方的表态\n\n发言人说明受限且库存减少，却否认抵制、强调顾客供书和强劲营业表现，并表达未来希望。\n\n> PRH declined to comment on the issue, but a spokesperson for Waterstones told me: \"Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade.\n\nPRH不评论，发言人承认受缩减信用条件限制，同时否认抵制，先说明现状与自身立场。\n\n> We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately.\n\nhopeful把恢复正常采购放在希望层面，不能读成对方已承诺撤销信用限制。\n\n> The sales for our May Books of the Month surpassed any month since 2018.\"\n\n繁忙门店与强劲推荐书销量支撑持续顾客支持的表态，标题要涵盖回应与安抚而非只说受限。\n\n这一部分的推进关系是：\n\n> 承认信用与库存限制 → 强调供书及恢复希望 → 用繁忙销量展示顾客支持\n\nattempt to reassure对应doing utmost、hopeful和busy，既说明困难又传递支持仍在。\n\n再看最强干扰项E：A guaranteed end to all credit restrictions。\n\nhopeful是希望，不是发布解除限制的承诺。\n\n**42题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】B. A retailer’s attempt to reassure customers and suppliers</p>\n<blockquote>\n<p>零售商安抚顾客与供货方的表态</p>\n</blockquote>\n<p>发言人说明受限且库存减少，却否认抵制、强调顾客供书和强劲营业表现，并表达未来希望。</p>\n<blockquote>\n<p>PRH declined to comment on the issue, but a spokesperson for Waterstones told me: &quot;Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade.</p>\n</blockquote>\n<p>PRH不评论，发言人承认受缩减信用条件限制，同时否认抵制，先说明现状与自身立场。</p>\n<blockquote>\n<p>We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately.</p>\n</blockquote>\n<p>hopeful把恢复正常采购放在希望层面，不能读成对方已承诺撤销信用限制。</p>\n<blockquote>\n<p>The sales for our May Books of the Month surpassed any month since 2018.&quot;</p>\n</blockquote>\n<p>繁忙门店与强劲推荐书销量支撑持续顾客支持的表态，标题要涵盖回应与安抚而非只说受限。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>承认信用与库存限制 → 强调供书及恢复希望 → 用繁忙销量展示顾客支持</p>\n</blockquote>\n<p>attempt to reassure对应doing utmost、hopeful和busy，既说明困难又传递支持仍在。</p>\n<p>再看最强干扰项E：A guaranteed end to all credit restrictions。</p>\n<p>hopeful是希望，不是发布解除限制的承诺。</p>\n<p><strong>42题选B。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】A. The authors most exposed to a dispute over book promotion\n\n> 最易受图书推广争端影响的作者\n\n知名作者可能只受一点影响，中等知名度作者依赖书店员工推荐，因而更盼纠纷结束。\n\n> In the meantime, PRH authors have been the losers.\n\nIn the meantime把视角从双方表态转向作者这个受损群体。\n\n> Big-name PRH authors may suffer a bit, but it's those mid-list authors, who normally rely on Waterstones staff's passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.\n\nbig-name只受一点与mid-list依赖推广形成对照，解释为何后者更急盼结束纠纷。\n\n这一部分的推进关系是：\n\n> 作者因纠纷受损 → 名家与中间层次依赖程度不同 → 更依赖推荐者更脆弱\n\nmost exposed对应特别依赖推广的群体，不是断言所有作者销量已公布。\n\n再看最强干扰项G：A plan for every small publisher to join one company。\n\n本段讨论作者受影响，不是小出版商组织合并。\n\n**43题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】A. The authors most exposed to a dispute over book promotion</p>\n<blockquote>\n<p>最易受图书推广争端影响的作者</p>\n</blockquote>\n<p>知名作者可能只受一点影响，中等知名度作者依赖书店员工推荐，因而更盼纠纷结束。</p>\n<blockquote>\n<p>In the meantime, PRH authors have been the losers.</p>\n</blockquote>\n<p>In the meantime把视角从双方表态转向作者这个受损群体。</p>\n<blockquote>\n<p>Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n<p>big-name只受一点与mid-list依赖推广形成对照，解释为何后者更急盼结束纠纷。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>作者因纠纷受损 → 名家与中间层次依赖程度不同 → 更依赖推荐者更脆弱</p>\n</blockquote>\n<p>most exposed对应特别依赖推广的群体，不是断言所有作者销量已公布。</p>\n<p>再看最强干扰项G：A plan for every small publisher to join one company。</p>\n<p>本段讨论作者受影响，不是小出版商组织合并。</p>\n<p><strong>43题选A。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. A merger that may reduce competition and variety\n\n> 可能减少竞争与多样性的合并\n\n在当前争端之外，作者已担忧另一项大出版商合并减少竞价、预付款和内容差异。\n\n> It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon & Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.\n\n拟议合并减少独立竞价者，可能压低预付款并使出版内容更趋同；这一段扩大了作者除眼前陈列争端外所担心的结构性后果。\n\n这一部分的推进关系是：\n\n> 大出版商拟合并 → 独立竞价者减少 → 预付款与内容选择受影响\n\nmay reduce保留likely预测，competition and variety对应竞价与内容趋同。\n\n再看最强干扰项E：A guaranteed end to all credit restrictions。\n\n这是对合并后果的担心，与解除书店信用限制不同。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. A merger that may reduce competition and variety</p>\n<blockquote>\n<p>可能减少竞争与多样性的合并</p>\n</blockquote>\n<p>在当前争端之外，作者已担忧另一项大出版商合并减少竞价、预付款和内容差异。</p>\n<blockquote>\n<p>It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.</p>\n</blockquote>\n<p>拟议合并减少独立竞价者，可能压低预付款并使出版内容更趋同；这一段扩大了作者除眼前陈列争端外所担心的结构性后果。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>大出版商拟合并 → 独立竞价者减少 → 预付款与内容选择受影响</p>\n</blockquote>\n<p>may reduce保留likely预测，competition and variety对应竞价与内容趋同。</p>\n<p>再看最强干扰项E：A guaranteed end to all credit restrictions。</p>\n<p>这是对合并后果的担心，与解除书店信用限制不同。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】D. The value of multiple routes for different voices\n\n> 不同声音拥有多种传播途径的价值\n\nLownie把合并视为权力集中，强调作者人员多样之外还需多元传播途径；结尾担心规模竞争牺牲多元。\n\n> \"This is all part of a wider change towards concentration of power,\" says literary agent Andrew Lownie.\n\nThis is all将前文合并与争端置于权力集中的更广变化，而非单独讨论一次销售波动。\n\n> \"The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices.\n\nbut it also needs指出作者员工多样不能替代传播途径多元，需要选择和不同声音。\n\n> After all, many of the most interesting books in recent years have come from small publishers.\" We shall see whether that plurality is a casualty of the current need among publishers to be big enough to take on all-comers.\n\n小出版商的有趣作品为多元渠道提供实际价值，结尾再追问规模竞争是否会牺牲它。\n\n这一部分的推进关系是：\n\n> 权力集中趋势 → 人员多样之外还需多元渠道 → 小出版商价值与规模竞争风险\n\nmultiple routes对应plurality of ways，不同声音与小出版商贡献构成其价值依据。\n\n再看最强干扰项G：A plan for every small publisher to join one company。\n\n强调小出版商多元贡献不等于要求它们合为一家。\n\n**45题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】D. The value of multiple routes for different voices</p>\n<blockquote>\n<p>不同声音拥有多种传播途径的价值</p>\n</blockquote>\n<p>Lownie把合并视为权力集中，强调作者人员多样之外还需多元传播途径；结尾担心规模竞争牺牲多元。</p>\n<blockquote>\n<p>&quot;This is all part of a wider change towards concentration of power,&quot; says literary agent Andrew Lownie.</p>\n</blockquote>\n<p>This is all将前文合并与争端置于权力集中的更广变化，而非单独讨论一次销售波动。</p>\n<blockquote>\n<p>&quot;The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices.</p>\n</blockquote>\n<p>but it also needs指出作者员工多样不能替代传播途径多元，需要选择和不同声音。</p>\n<blockquote>\n<p>After all, many of the most interesting books in recent years have come from small publishers.&quot; We shall see whether that plurality is a casualty of the current need among publishers to be big enough to take on all-comers.</p>\n</blockquote>\n<p>小出版商的有趣作品为多元渠道提供实际价值，结尾再追问规模竞争是否会牺牲它。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>权力集中趋势 → 人员多样之外还需多元渠道 → 小出版商价值与规模竞争风险</p>\n</blockquote>\n<p>multiple routes对应plurality of ways，不同声音与小出版商贡献构成其价值依据。</p>\n<p>再看最强干扰项G：A plan for every small publisher to join one company。</p>\n<p>强调小出版商多元贡献不等于要求它们合为一家。</p>\n<p><strong>45题选D。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 用找书困难引出商业僵持 |\n| B | 说明人员多样不替代传播渠道多元 |\n| C | 把作者处境接到出版合并与竞价问题 |\n| D | 介绍书店回应及顾客持续支持 |\n| E | 转向依赖书店推广的作者损失 |\n| F | 说明信用限制与撤离展示位置的联系 |\n| G | 用小出版商贡献支持多元渠道价值 |\n| H | 总结规模竞争可能牺牲多元声音 |\n\n全文推进：\n\n> 用找书困难引出商业僵持 → 说明信用限制与撤离展示位置的联系 → 介绍书店回应及顾客持续支持 → 转向依赖书店推广的作者损失 → 把作者处境接到出版合并与竞价问题 → 说明人员多样不替代传播渠道多元 → 用小出版商贡献支持多元渠道价值 → 总结规模竞争可能牺牲多元声音\n\n完整顺序：\n\n**A → F → D → E → C → B → G → H**\n\n41—45：F、D、C、B、G。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>用找书困难引出商业僵持</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明人员多样不替代传播渠道多元</td>\n</tr>\n<tr>\n<td>C</td>\n<td>把作者处境接到出版合并与竞价问题</td>\n</tr>\n<tr>\n<td>D</td>\n<td>介绍书店回应及顾客持续支持</td>\n</tr>\n<tr>\n<td>E</td>\n<td>转向依赖书店推广的作者损失</td>\n</tr>\n<tr>\n<td>F</td>\n<td>说明信用限制与撤离展示位置的联系</td>\n</tr>\n<tr>\n<td>G</td>\n<td>用小出版商贡献支持多元渠道价值</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结规模竞争可能牺牲多元声音</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>用找书困难引出商业僵持 → 说明信用限制与撤离展示位置的联系 → 介绍书店回应及顾客持续支持 → 转向依赖书店推广的作者损失 → 把作者处境接到出版合并与竞价问题 → 说明人员多样不替代传播渠道多元 → 用小出版商贡献支持多元渠道价值 → 总结规模竞争可能牺牲多元声音</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → C → B → G → H</strong></p>\n<p>41—45：F、D、C、B、G。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → F → D。\n\n先看前段A的结尾：\n\n> Their visibility in a major bookshop has become connected to a commercial stand-off between the retailer and publisher.\n\n再看F段开头：\n\n> The stand-off began after the publisher imposed a significant credit limit.\n\n前段图书可见度已连到商业stand-off，The stand-off回指，并开始解释信用额度限制这一触发事件。\n\n本段内部继续写道：\n\n> Reports then described instructions to move its books away from prominent tables and windows into their usual sections. The change in display was therefore a response to trading conditions rather than a new method of classification.\n\nReports then按事件推进写撤离展示位，therefore明确其回应贸易条件，排除误读为重新分类。\n\n后段D开头是：\n\n> The retailer acknowledged reduced credit but denied boycotting the publisher’s books.\n\nThe retailer acknowledged reduced credit承接当前限制，下一段给零售商对撤书与抵制问题的正式表态。\n\n这三段的推进关系：\n\n> 用找书困难引出商业僵持 → 说明信用限制与撤离展示位置的联系 → 介绍书店回应及顾客持续支持\n\n再检验候选C：\n\n> This vulnerability comes alongside concern about a proposed merger between large publishers.\n\nThis vulnerability指后文作者依赖推广所产生的脆弱，此处还没讲作者，不能提前跳到合并担忧。\n\n**41题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Their visibility in a major bookshop has become connected to a commercial stand-off between the retailer and publisher.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>The stand-off began after the publisher imposed a significant credit limit.</p>\n</blockquote>\n<p>前段图书可见度已连到商业stand-off，The stand-off回指，并开始解释信用额度限制这一触发事件。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Reports then described instructions to move its books away from prominent tables and windows into their usual sections. The change in display was therefore a response to trading conditions rather than a new method of classification.</p>\n</blockquote>\n<p>Reports then按事件推进写撤离展示位，therefore明确其回应贸易条件，排除误读为重新分类。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>The retailer acknowledged reduced credit but denied boycotting the publisher’s books.</p>\n</blockquote>\n<p>The retailer acknowledged reduced credit承接当前限制，下一段给零售商对撤书与抵制问题的正式表态。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>用找书困难引出商业僵持 → 说明信用限制与撤离展示位置的联系 → 介绍书店回应及顾客持续支持</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>This vulnerability comes alongside concern about a proposed merger between large publishers.</p>\n</blockquote>\n<p>This vulnerability指后文作者依赖推广所产生的脆弱，此处还没讲作者，不能提前跳到合并担忧。</p>\n<p><strong>41题选F。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为F → D → E。\n\n先看前段F的结尾：\n\n> The change in display was therefore a response to trading conditions rather than a new method of classification.\n\n再看D段开头：\n\n> The retailer acknowledged reduced credit but denied boycotting the publisher’s books.\n\n前段撤书作为贸易回应，The retailer接Waterstones，承认信用受限却否认抵制，直接回应行动性质。\n\n本段内部继续写道：\n\n> It emphasised efforts to maintain availability and expressed hope that normal trading would return. Busy shops and strong recent sales were cited to suggest that customers continued to support the business.\n\n先写供书努力和恢复希望，再引用繁忙及销量，说明受限中顾客仍支持这一传达意图。\n\n后段E开头是：\n\n> For the publisher’s authors, however, reduced promotion could carry a different cost.\n\nFor the publisher's authors, however把视角从书店经营转到作者可能付出的不同代价。\n\n这三段的推进关系：\n\n> 说明信用限制与撤离展示位置的联系 → 介绍书店回应及顾客持续支持 → 转向依赖书店推广的作者损失\n\n再检验候选C：\n\n> This vulnerability comes alongside concern about a proposed merger between large publishers.\n\n合并担忧以作者vulnerability为承接点，应等依赖推广及损失说明后出现，此处先给书店表态才有however的立场切换。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>The change in display was therefore a response to trading conditions rather than a new method of classification.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>The retailer acknowledged reduced credit but denied boycotting the publisher’s books.</p>\n</blockquote>\n<p>前段撤书作为贸易回应，The retailer接Waterstones，承认信用受限却否认抵制，直接回应行动性质。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>It emphasised efforts to maintain availability and expressed hope that normal trading would return. Busy shops and strong recent sales were cited to suggest that customers continued to support the business.</p>\n</blockquote>\n<p>先写供书努力和恢复希望，再引用繁忙及销量，说明受限中顾客仍支持这一传达意图。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>For the publisher’s authors, however, reduced promotion could carry a different cost.</p>\n</blockquote>\n<p>For the publisher&#39;s authors, however把视角从书店经营转到作者可能付出的不同代价。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明信用限制与撤离展示位置的联系 → 介绍书店回应及顾客持续支持 → 转向依赖书店推广的作者损失</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>This vulnerability comes alongside concern about a proposed merger between large publishers.</p>\n</blockquote>\n<p>合并担忧以作者vulnerability为承接点，应等依赖推广及损失说明后出现，此处先给书店表态才有however的立场切换。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → C → B。\n\n先看前段E的结尾：\n\n> Their reliance on staff enthusiasm makes them especially vulnerable to the continuing dispute.\n\n再看C段开头：\n\n> This vulnerability comes alongside concern about a proposed merger between large publishers.\n\n前段their reliance on staff enthusiasm建立作者脆弱性，This vulnerability直接承接并增加拟议合并的担忧。\n\n本段内部继续写道：\n\n> Fewer independent bidders could mean less competition for books, lower advances and greater similarity in what reaches print. Authors therefore face questions about market structure as well as one retailer’s display choices.\n\n更少独立竞价者带来竞争减弱、预付款下降和内容趋同，therefore将作者关切从陈列选择提升为市场结构。\n\n后段B开头是：\n\n> Market structure also affects the routes through which readers encounter different voices.\n\nMarket structure重复刚建立的结构问题，also进一步扩展到读者接触声音的渠道。\n\n这三段的推进关系：\n\n> 转向依赖书店推广的作者损失 → 把作者处境接到出版合并与竞价问题 → 说明人员多样不替代传播渠道多元\n\n再检验候选G：\n\n> Small publishers provide one reason to value those independent channels.\n\n小出版商证明多元渠道价值，需要先说明市场结构为何影响这些渠道；此处先交代合并后果，不能省略中间层。\n\n**43题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>43题是全文第5段，局部关系为E → C → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Their reliance on staff enthusiasm makes them especially vulnerable to the continuing dispute.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>This vulnerability comes alongside concern about a proposed merger between large publishers.</p>\n</blockquote>\n<p>前段their reliance on staff enthusiasm建立作者脆弱性，This vulnerability直接承接并增加拟议合并的担忧。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Fewer independent bidders could mean less competition for books, lower advances and greater similarity in what reaches print. Authors therefore face questions about market structure as well as one retailer’s display choices.</p>\n</blockquote>\n<p>更少独立竞价者带来竞争减弱、预付款下降和内容趋同，therefore将作者关切从陈列选择提升为市场结构。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Market structure also affects the routes through which readers encounter different voices.</p>\n</blockquote>\n<p>Market structure重复刚建立的结构问题，also进一步扩展到读者接触声音的渠道。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>转向依赖书店推广的作者损失 → 把作者处境接到出版合并与竞价问题 → 说明人员多样不替代传播渠道多元</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Small publishers provide one reason to value those independent channels.</p>\n</blockquote>\n<p>小出版商证明多元渠道价值，需要先说明市场结构为何影响这些渠道；此处先交代合并后果，不能省略中间层。</p>\n<p><strong>43题选C。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为C → B → G。\n\n先看前段C的结尾：\n\n> Authors therefore face questions about market structure as well as one retailer’s display choices.\n\n再看B段开头：\n\n> Market structure also affects the routes through which readers encounter different voices.\n\n前段authors face questions about market structure，当前Market structure also承接并把影响对象扩到读者获取途径。\n\n本段内部继续写道：\n\n> Diversity among authors and staff is valuable, but it does not by itself guarantee a plurality of ways to deliver ideas. Several independent publishing channels can preserve choices that a concentrated system may narrow.\n\nbut区分作者员工多样与传播渠道多元，独立渠道能保留集中体系可能缩窄的选择。\n\n后段G开头是：\n\n> Small publishers provide one reason to value those independent channels.\n\nthose independent channels精确回指刚介绍的独立出版途径，下一段小出版商以作品贡献支持其价值。\n\n这三段的推进关系：\n\n> 把作者处境接到出版合并与竞价问题 → 说明人员多样不替代传播渠道多元 → 用小出版商贡献支持多元渠道价值\n\n再检验候选F：\n\n> The stand-off began after the publisher imposed a significant credit limit.\n\n信用限制是早先争端的原因，此处已推进到行业结构和多元选择，退回限制不能接后句的独立渠道价值。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为C → B → G。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>Authors therefore face questions about market structure as well as one retailer’s display choices.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Market structure also affects the routes through which readers encounter different voices.</p>\n</blockquote>\n<p>前段authors face questions about market structure，当前Market structure also承接并把影响对象扩到读者获取途径。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Diversity among authors and staff is valuable, but it does not by itself guarantee a plurality of ways to deliver ideas. Several independent publishing channels can preserve choices that a concentrated system may narrow.</p>\n</blockquote>\n<p>but区分作者员工多样与传播渠道多元，独立渠道能保留集中体系可能缩窄的选择。</p>\n<p>后段G开头是：</p>\n<blockquote>\n<p>Small publishers provide one reason to value those independent channels.</p>\n</blockquote>\n<p>those independent channels精确回指刚介绍的独立出版途径，下一段小出版商以作品贡献支持其价值。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>把作者处境接到出版合并与竞价问题 → 说明人员多样不替代传播渠道多元 → 用小出版商贡献支持多元渠道价值</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>The stand-off began after the publisher imposed a significant credit limit.</p>\n</blockquote>\n<p>信用限制是早先争端的原因，此处已推进到行业结构和多元选择，退回限制不能接后句的独立渠道价值。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → G → H。\n\n先看前段B的结尾：\n\n> Several independent publishing channels can preserve choices that a concentrated system may narrow.\n\n再看G段开头：\n\n> Small publishers provide one reason to value those independent channels.\n\n前段独立渠道保留选择，those independent channels承接，小出版商作为其具体实例。\n\n本段内部继续写道：\n\n> They have produced many interesting books that demonstrate the contribution of different editorial choices. Their example supports concern about concentration rather than a demand that all small firms combine into a single organisation.\n\nThey产出有趣作品，体现不同编辑选择的贡献；其例子支持对集中的担忧，而非要求全部小社合成一家。\n\n后段H开头是：\n\n> The remaining question is whether the drive for greater size will sacrifice that plurality.\n\nthat plurality回指这些独立途径带来的多元，结尾再将它与追求规模形成张力。\n\n这三段的推进关系：\n\n> 说明人员多样不替代传播渠道多元 → 用小出版商贡献支持多元渠道价值 → 总结规模竞争可能牺牲多元声音\n\n再检验候选F：\n\n> The stand-off began after the publisher imposed a significant credit limit.\n\n回到信用额度限制只解释单个零售争端，不能为结尾是否牺牲多元提供所需的小出版商价值证据。\n\n**45题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>45题是全文第7段，局部关系为B → G → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Several independent publishing channels can preserve choices that a concentrated system may narrow.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Small publishers provide one reason to value those independent channels.</p>\n</blockquote>\n<p>前段独立渠道保留选择，those independent channels承接，小出版商作为其具体实例。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>They have produced many interesting books that demonstrate the contribution of different editorial choices. Their example supports concern about concentration rather than a demand that all small firms combine into a single organisation.</p>\n</blockquote>\n<p>They产出有趣作品，体现不同编辑选择的贡献；其例子支持对集中的担忧，而非要求全部小社合成一家。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>The remaining question is whether the drive for greater size will sacrifice that plurality.</p>\n</blockquote>\n<p>that plurality回指这些独立途径带来的多元，结尾再将它与追求规模形成张力。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明人员多样不替代传播渠道多元 → 用小出版商贡献支持多元渠道价值 → 总结规模竞争可能牺牲多元声音</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>The stand-off began after the publisher imposed a significant credit limit.</p>\n</blockquote>\n<p>回到信用额度限制只解释单个零售争端，不能为结尾是否牺牲多元提供所需的小出版商价值证据。</p>\n<p><strong>45题选G。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **diverse voices** | **多元声音** | **社会现象｜文化教育｜文化多样性** | **宏观主题** |\n| independent choice | 独立选择 | 人生哲理｜独立思考 | 个人主题 |\n| fair competition | 公平竞争 | 社会现象｜科技经济 | 宏观主题 |\n| **creative opportunities** | **创作机会** | **人生哲理｜创新** | **个人主题** |\n| cultural diversity | 文化多样性 | 社会现象｜文化教育 | 宏观主题 |\n| access to different ideas | 接触不同思想的机会 | 社会现象｜文化教育 | 宏观主题 |\n| a balanced market structure | 平衡的市场结构 | 社会现象｜科技经济 | 宏观主题 |\n| responsible cooperation | 负责任的合作 | 人生哲理｜合作 | 个人主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>diverse voices</strong></td>\n<td><strong>多元声音</strong></td>\n<td><strong>社会现象｜文化教育｜文化多样性</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>independent choice</td>\n<td>独立选择</td>\n<td>人生哲理｜独立思考</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>fair competition</td>\n<td>公平竞争</td>\n<td>社会现象｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>creative opportunities</strong></td>\n<td><strong>创作机会</strong></td>\n<td><strong>人生哲理｜创新</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>cultural diversity</td>\n<td>文化多样性</td>\n<td>社会现象｜文化教育</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>access to different ideas</td>\n<td>接触不同思想的机会</td>\n<td>社会现象｜文化教育</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>a balanced market structure</td>\n<td>平衡的市场结构</td>\n<td>社会现象｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>responsible cooperation</td>\n<td>负责任的合作</td>\n<td>人生哲理｜合作</td>\n<td>个人主题</td>\n</tr>\n</tbody></table></div>\n"},{"title":"2. 大作文第一段描述题目信息时可积累的表达","raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画** | **The books have been moved from prominent displays to less visible sections.** | **图书已从显眼展示处移到不那么显眼的区域。** |\n| 图画 | The scene shows how a commercial disagreement can affect people outside it. | 场景展示商业争端如何影响当事方之外的人。 |\n| 图画 | The picture contrasts a large organisation with several smaller independent channels. | 图画将一家大型机构与多个较小独立渠道形成对照。 |\n| **图表** | **Recent sales surpassed the figures recorded in earlier months.** | **近期销量超过此前月份的数据。** |\n| 图表 | The number of independent participants has declined as concentration has increased. | 随着集中程度提高，独立参与者数量减少。 |\n| 图表 | The effect is greater for those who depend most on active promotion. | 对最依赖主动推广者的影响更大。 |\n| 文本评论 | The statement stresses that diversity requires more than a variety of names. | 这句话强调多样性需要的不只是名字的多种多样。 |\n| 文本评论 | The passage asks whether the pursuit of size may come at the expense of different voices. | 这段文字追问追求规模是否会以不同声音为代价。 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>适用题型</th>\n<th>考试时可复用的形式</th>\n<th>中文翻译</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>图画</strong></td>\n<td><strong>The books have been moved from prominent displays to less visible sections.</strong></td>\n<td><strong>图书已从显眼展示处移到不那么显眼的区域。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene shows how a commercial disagreement can affect people outside it.</td>\n<td>场景展示商业争端如何影响当事方之外的人。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The picture contrasts a large organisation with several smaller independent channels.</td>\n<td>图画将一家大型机构与多个较小独立渠道形成对照。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>Recent sales surpassed the figures recorded in earlier months.</strong></td>\n<td><strong>近期销量超过此前月份的数据。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The number of independent participants has declined as concentration has increased.</td>\n<td>随着集中程度提高，独立参与者数量减少。</td>\n</tr>\n<tr>
