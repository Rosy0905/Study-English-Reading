<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| retailer | n.零售商 | in search of | 寻找 | Duchess | n.公爵夫人 |\n| thriller | n.惊悚小说 | published | v.出版 | currently | adv.当前 |\n| involved in | 卷入 | stand-off | n.僵持 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,123,900,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>retailer</td>\n<td>n.零售商</td>\n<td>in search of</td>\n<td>寻找</td>\n<td>Duchess</td>\n<td>n.公爵夫人</td>\n</tr>\n<tr>\n<td>thriller</td>\n<td>n.惊悚小说</td>\n<td>published</td>\n<td>v.出版</td>\n<td>currently</td>\n<td>adv.当前</td>\n</tr>\n<tr>\n<td>involved in</td>\n<td>卷入</td>\n<td>stand-off</td>\n<td>n.僵持</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| confirmed | v.确认 | credit limit | 信用额度限制 | significant | adj.显著的 |\n| trade magazine | 行业杂志 | branch managers | 分店经理 | prominent | adj.显眼的 |\n| display spaces | 展示区 | retiring | v.撤下移往 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,713,900,351],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>confirmed</td>\n<td>v.确认</td>\n<td>credit limit</td>\n<td>信用额度限制</td>\n<td>significant</td>\n<td>adj.显著的</td>\n</tr>\n<tr>\n<td>trade magazine</td>\n<td>行业杂志</td>\n<td> e":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"31题 · 题干、题型与核心出处","raw":"## 31题\n\n> The author mentions two books in Paragraph 1 to present ______.\n>\n> 作者在第1段提到两本书，是为了呈现什么？\n\n### 题型\n\n例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。\n\n题干直接给出two books和Paragraph 1，先把第1段从头读到尾：作者让想去水石书店寻找这两本新书的读者有所准备，随后点出两本书的出版商与水石书店的关系。\n\n### 核心出处\n\n> you might have to be prepared to hunt around a bit\n>\n> a company currently involved in a stand-off with Waterstones.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"31","questionIntro":true},"html":"<blockquote>\n<p>The author mentions two books in Paragraph 1 to present ______.</p>\n<p>作者在第1段提到两本书，是为了呈现什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干直接给出two books和Paragraph 1，先把第1段从头读到尾：作者让想去水石书店寻找这两本新书的读者有所准备，随后点出两本书的出版商与水石书店的关系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>you might have to be prepared to hunt around a bit</p>\n<p>a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n"},{"title":"A. an ongoing conflict","raw":"### A. an ongoing conflict\n\n> 作者提两本书是为呈现正在持续的冲突。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n两本新书可能不易在显眼处找到，而共同出版商正与Waterstones僵持，A概括正在持续的冲突。\n\n**出处：**\n\n> If you're heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex's new children's book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President's Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"31","option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-31-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-A-0\"><blockquote>\n<p>作者提两本书是为呈现正在持续的冲突。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>两本新书可能不易在显眼处找到，而共同出版商正与Waterstones僵持，A概括正在持续的冲突。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n</section>"},{"title":"A. an ongoing conflict","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者提两本书是为呈现正在持续的冲突。\n\n`an ongoing conflict`对应段末的`currently involved in a stand-off`，前面的找书情景与出版商正在同水石书店僵持相接，因此回看第1段两句的连接。\n\n原文先说寻找这两本新书可能需要四下找一找，随后说明出版它们的公司`currently involved in a stand-off with Waterstones`。选项的`an ongoing conflict`说的也是正在持续的冲突。作者用两本具体的新书引出同一家出版商与书店之间的僵持，`ongoing`与`currently`也在时间上吻合。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"31","option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-31-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-A-0\"><blockquote>\n<p>作者提两本书是为呈现正在持续的冲突。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>两本新书可能不易在显眼处找到，而共同出版商正与Waterstones僵持，A概括正在持续的冲突。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提两本书是为呈现正在持续的冲突。</p>\n</blockquote>\n<p><code>an ongoing conflict</code>对应段末的<code>currently involved in a stand-off</code>，前面的找书情景与出版商正在同水石书店僵持相接，因此回看第1段两句的连接。</p>\n<p>原文先说寻找这两本新书可能需要四下找一找，随后说明出版它们的公司<code>currently involved in a stand-off with Waterstones</code>。选项的<code>an ongoing conflict</code>说的也是正在持续的冲突。作者用两本具体的新书引出同一家出版商与书店之间的僵持，<code>ongoing</code>与<code>currently</code>也在时间上吻合。</p>\n</section>"},{"title":"A. an ongoing conflict","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> If you're heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex's new children's book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President's Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.\n>\n> 如果去英国最大图书零售商Waterstones门店找萨塞克斯公爵夫人的新童书《长椅》，可能需要四处找一找；寻找Bill Clinton与James Patterson合著的新惊悚小说《总统的女儿》也可能如此。两书下周均由PRH出版，该公司目前正与Waterstones僵持。\n\n首段先从读者实际找书情境切入，再用共同出版商及stand-off解释两例为什么并列。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The two books introduce an ongoing conflict.\n>\n> 作者提两本书是为呈现正在持续的冲突。\n\nongoing对应currently，作者没有讨论两书文学内容，而是用商品展示状况引出双方商业关系。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"31","option":"A","cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-31-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-A-0\"><blockquote>\n<p>作者提两本书是为呈现正在持续的冲突。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>两本新书可能不易在显眼处找到，而共同出版商正与Waterstones僵持，A概括正在持续的冲突。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提两本书是为呈现正在持续的冲突。</p>\n</blockquote>\n<p><code>an ongoing conflict</code>对应段末的<code>currently involved in a stand-off</code>，前面的找书情景与出版商正在同水石书店僵持相接，因此回看第1段两句的连接。</p>\n<p>原文先说寻找这两本新书可能需要四下找一找，随后说明出版它们的公司<code>currently involved in a stand-off with Waterstones</code>。选项的<code>an ongoing conflict</code>说的也是正在持续的冲突。作者用两本具体的新书引出同一家出版商与书店之间的僵持，<code>ongoing</code>与<code>currently</code>也在时间上吻合。</p>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n<p>如果去英国最大图书零售商Waterstones门店找萨塞克斯公爵夫人的新童书《长椅》，可能需要四处找一找；寻找Bill Clinton与James Patterson合著的新惊悚小说《总统的女儿》也可能如此。两书下周均由PRH出版，该公司目前正与Waterstones僵持。</p>\n</blockquote>\n<p>首段先从读者实际找书情境切入，再用共同出版 ese Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.\n>\n> 如果去英国最大图书零售商Waterstones门店找萨塞克斯公爵夫人的新童书《长椅》，可能需要四处找一找；寻找Bill Clinton与James Patterson合著的新惊悚小说《总统的女儿》也可能如此。两书下周均由PRH出版，该公司目前正与Waterstones僵持。\n\n作者从两本新书的共同处境落到两家公司僵持，而不是调查读者群体心态。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The two books introduce a prevailing sentiment.\n>\n> 作者提两本书是为呈现普遍流行情绪。\n\nC需要情绪内容及广泛流行程度的证据。可能找书困难不能直接变成大众共同的不满或其他情绪。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"31","option":"C","cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-31-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-C-0\"><blockquote>\n<p>作者提两本书是为呈现普遍流行情绪。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>提醒买书者准备多找找，是实际购物建议；prevailing sentiment要求一种普遍情绪，原段未描述这种感受。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提两本书是为呈现普遍流行情绪。</p>\n</blockquote>\n<p><code>a prevailing sentiment</code>要找的是人们普遍具有的感受；第1段对读者说<code>be prepared to hunt around a bit</code>，随后说明出版商与书店的关系，因此回看这两句有没有把找书写成普遍情绪。</p>\n<p>原文的<code>be prepared to hunt around a bit</code>是提醒 w children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n<p>如果去英国最大图书零售商Waterstones门店找萨塞克斯公爵夫人的新童书《长椅》，可能需要四处找一找；寻找Bill Clinton与James Patterson合著的新惊悚小说《总统的女儿》也可能如此。两书下周均由PRH出版，该公司目前正与Waterstones僵持。</p>\n</blockquote>\n<p>一本儿童书与一本惊悚小说先因找书问题并列，随后才给出PRH与Waterstones的商业僵持。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The two books introduce a literary phenomenon.</p>\n<p>作者提两本书是为呈现文学现象。</p>\n</blockquote>\n<p>D需要文学内容或文学领域趋势把两例连起来。材料是图书不等于讨论目的就是文学现象，A能解释实际连接。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"31题结论","raw":"### 31题结论\n\n> **31. A**\n\n- A：两本新书可能不易在显眼处找到，而共同出版商正与Waterstones僵持，A概括正在持续的冲突。\n- B：书名与作者用于说明可能遇到的找书情境，没有引出某种思想概念。B将商业关系问题改成思想阐释。\n- C：提醒买书者准备多找找，是实际购物建议；prevailing sentiment要求一种普遍情绪，原段未描述这种感受。\n- D：两书共同点是出版商和受展示冲突影响的处境，未被用来归纳写作、题材或文学发展现象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"31","questionConclusion":true},"html":"<blockquote>\n<p><strong>31. A</strong></p>\n</blockquote>\n<ul>\n<li>A：两本新书可能不易在显眼处找到，而共同出版商正与Waterstones僵持，A概括正在持续的冲突。</li>\n<li>B：书名与作者用于说明可能遇到的找书情境，没有引出某种思想概念。B将商业关系问题改成思想阐释。</li>\n<li>C：提醒买书者准备多找找，是实际购物建议；prevailing sentiment要求一种普遍情绪，原段未描述这种感受。</li>\n<li>D：两书共同点是出版商和受展示冲突影响的处境，未被用来归纳写作、题材或文学发展现象。</li>\n</ul>\n"},{"title":"32题 · 题干、题型与核心出处","raw":"## 32题\n\n> Why did Waterstones shops retire PRH books to their relevant sections?\n>\n> 水石书店为什么把企鹅兰登书屋的书撤回各自所属的分区？\n\n### 题型\n\n原因推断题：将信用限制作为问题起点，分清移书的去向、目的及指令来源。\n\n题干中的retire PRH books to their relevant sections在第2段末句直接出现，回到第2段完整阅读：先看问题从何时开始，再看分店经理接到的移书指示。\n\n### 核心出处\n\n> it had introduced a credit limit with Waterstones “at a very significant level”\n>\n> remove PRH books from prominent areas such as tables, display spaces and windows\n>\n> PRH confirmed that it had introduced a credit limit with Waterstones","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"32","questionIntro":true},"html":"<blockquote>\n<p>Why did Waterstones shops retire PRH books to their relevant sections?</p>\n<p>水石书店为什么把企鹅兰登书屋的书撤回各自所属的分区？</p>\n</blockquote>\n<h3>题型</h3>\n<p>原因推断题：将信用限制作为问题起点，分清移书的去向、目的及指令来源。</p>\n<p>题干中的retire PRH books to their relevant sections在第2段末句直接出现，回到第2段完整阅读：先看问题从何时开始，再看分店经理接到的移书指示。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>it had introduced a credit limit with Waterstones “at a very significant level”</p>\n<p>remove PRH books from prominent areas such as tables, display spaces and windows</p>\n<p>PRH confirmed that it had introduced a credit limit with Waterstones</p>\n</blockquote>\n"},{"title":"A. To make them easily noticeable.","raw":"### A. To make them easily noticeable.\n\n> Waterstones移书是为让书更易被注意。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n书被移出prominent areas，即显眼桌台、展示区和橱窗，A却说为更易被注意，改变了展示方向。\n\n**出处：**\n\n> The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones \"at a very significant level\". The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were \"quietly retiring them to their relevant sections\".","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-32-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-A-0\"><blockquote>\n<p>Waterstones移书是为让书更易被注意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>书被移出prominent areas，即显眼桌台、展示区和橱窗，A却说为更易被注意，改变了展示方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n</blockquote>\n</section>"},{"title":"A. To make them easily noticeable.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Waterstones移书是为让书更易被注意。\n\n`easily noticeable`涉及书如何被展示，第2段却写`remove PRH books`以及`display spaces and windows`；回看整段中信用限制的起因和从展示位置移书的做法。\n\n原文先说企鹅兰登书屋给水石书店设立了显著的信用额度限制，随后描述书店`remove PRH books`，把书从桌面、展示区和橱窗移走，撤回所属分区。选项将此事解释为让书`easily noticeable`，是把它写成提升图书显眼程度的安排。原文在信用限制引发的问题中叙述撤离展示位置，既没有把这种移动连接为增加展示，也没有给出让书更易受注意这一目的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-32-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-A-0\"><blockquote>\n<p>Waterstones移书是为让书更易被注意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>书被移出prominent areas，即显眼桌台、展示区和橱窗，A却说为更易被注意，改变了展示方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Waterstones移书是为让书更易被注意。</p>\n</blockquote>\n<p><code>easily noticeable</code>涉及书如何被展示，第2段却写<code>remove PRH books</code>以及<code>display spaces and windows</code>；回看整段中信用限制的起因和从展示位置移书的做法。</p>\n<p>原文先说企鹅兰登书屋给水石书店设立了显著的信用额度限制，随后描述书店<code>remove PRH books</code>，把书从桌面、展示区和橱窗移走，撤回所属分区。选项将此事解释为让书<code>easily noticeable</code>，是把它写成提升图书显眼程度的安排。原文在信用限制引发的问题中叙述撤离展示位置，既没有把这种移动连接为增加展示，也没有给出让书更易受注意这一目的。</p>\n</section>"},{"title":"A. To make them easily noticeable.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones \"at a very significant level\". The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were \"quietly retiring them to their relevant sections\".\n>\n> 问题始于去年年底，PRH确认已对Waterstones设置相当显著的信用额度限制。行业杂志《书商》报道，分店经理被告知将PRH图书撤离桌台、展示区和橱窗等突出位置，悄悄放回各自分区。\n\n第二段以信用限制作为问题起点，再交代相关图书撤出突出位置，回归普通分区。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The shops moved the books to make them easily noticeable.\n>\n> Waterstones移书是为让书更易被注意。\n\nA需要提升可见度的安排。分区虽便于按类寻找，却不能抹去从显眼展示区撤走这一明确动作。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-32-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-A-0\"><blockquote>\n<p>Waterstones移书是为让书更易被注意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>书被移出prominent areas，即显眼桌台、展示区和橱窗，A却说为更易被注意，改变了展示方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Waterstones移书是为让书更易被注意。</p>\n</blockquote>\n<p><code>easily noticeable</code>涉及书如何被展示，第2段却写<code>remove PRH books</code>以及<code>display spaces and windows</code>；回看整段中信用限制的起因和从展示位置移书的做法。</p>\n<p>原文先说企鹅兰登书屋给水石书店设立了显著的信用额度限制，随后描述书店<code>remove PRH books</code>，把书从桌面、展示区和橱窗移走，撤回所属分区。选项将此事解释为让书<code>easily noticeable</code>，是把它写成提升图书显眼程度的安排。原文在信用限制引发的问题中叙述撤离展示位置，既没有把这种移动连接为增加展示，也没有给出让书更易受注意这一目的。</p>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n<p>问题始于去年年底，PRH确认已对Waterstones设置相当显著的信用额度限制。行业杂志《书商》报道，分店经理被告知将PRH图书撤离桌台、展示区和橱窗等突出位置，悄悄放回各自分区。</p>\n</blockquote>\n<p>第二段以信用限制作为问题起点，再交代相关图书撤出突出位置，回归普通分区。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The shops moved the books to make them easily noticeable.</p>\n<p>Waterstones移书是为让书更易被注意。</p>\n</blockquote>\n<p>A需要提升可见度的安排。分区虽便于按类寻找，却不能抹去从显眼展示区撤走这一明确动作。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. To comply with PRH’s requirement.","raw":"### B. To comply with PRH’s requirement.\n\n> Waterstones移书是为服从PRH的要求。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第三类——无中生有。**\n\nPRH提出的是信用额度限制，移书指示是书店经理收到的另一动作，原文未说PRH要求改变展示。\n\n**出处：**\n\n> The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones \"at a very significant level\". The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were \"quietly retiring them to their relevant sections\".","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"32","option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-32-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-B-0\"><blockquote>\n<p>Waterstones移书是为服从PRH的要求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>PRH提出的是信用额度限制，移书指示是书店经理收到的另一动作，原文未说PRH要求改变展示。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n</blockquote>\n</section>"},{"title":"B. To comply with PRH’s requirement.","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> Waterstones移书是为服从PRH的要求。\n\n`comply with PRH’s requirement`把移书要求归给出版商；第2段分别写`PRH introduced a credit limit`和`branch managers were being told`，需要把这两个动作的主体与内容分开核对。\n\n原文说企鹅兰登书屋采取的措施是`introduced a credit limit`，即对水石书店设立信用额度限制；接着说水石书店的分店经理接到移书指示，没有把下达这条指示的人写成企鹅兰登书屋。选项`comply with PRH’s requirement`却将出版商的信用条件变成了对图书摆放位置的要求，并把书店的行动说成遵从该要求。这两个指令内容不同，原文没有建立出版商要求书店撤走展示图书的关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-32-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-B-0\"><blockquote>\n<p>Waterstones移书是为服从PRH的要求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>PRH提出的是信用额度限制，移书指示是书店经理收到的另一动作，原文未说PRH要求改变展示。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Waterstones移书是为服从PRH的要求。</p>\n</blockquote>\n<p><code>comply with PRH’s requirement</code>把移书要求归给出版商；第2段分别写<code>PRH introduced a credit limit</code>和<code>branch managers were being told</code>，需要把这两个动作的主体与内容分开核对。</p>\n<p>原文说企鹅兰登书屋采取的措施是<code>introduced a credit limit</code>，即对水石书店设立信用额度限制；接着说水石书店的分店经理接到移书指示，没有把下达这条指示的人写成企鹅兰登书屋。选项<code>comply with PRH’s requirement</code>却将出版商的信用条件变成了对图书摆放位置的要求，并把书店的行动说成遵从该要求。这两个指令内容不同，原文没有建立出版商要求书店撤走展示图书的关系。</p>\n</section>"},{"title":"B. To comply with PRH’s requirement.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones \"at a very significant level\". The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were \"quietly retiring them to their relevant sections\".\n>\n> 问题始于去年年底，PRH确认已对Waterstones设置相当显著的信用额度限制。行业杂志《书商》报道，分店经理被告知将PRH图书撤离桌台、展示区和橱窗等突出位置，悄悄放回各自分区。\n\n出版商的交易举措在前，书店后续展示调整在后，构成冲突中的回应关系。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The shops moved the books to comply with PRH’s requirement.\n>\n> Waterstones移书是为服从PRH的要求。\n\nB需要出版商指令撤书的证据。对贸易条件作回应，与服从对方要求如何摆书并不是同一行为。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-32-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-B-0\"><blockquote>\n<p>Waterstones移书是为服从PRH的要求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>PRH提出的是信用额度限制，移书指示是书店经理收到的另一动作，原文未说PRH要求改变展示。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n</blockquote>\n</section><section c <p>Waterstones移书是为有条理地摆放图书。</p>\n</blockquote>\n<p>D需要为了改善条理而调整的说明。分类摆放本身可以有序，但动作去向不能替代本段已经交代的问题来源。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"32题结论","raw":"### 32题结论\n\n> **32. C**\n\n- A：书被移出prominent areas，即显眼桌台、展示区和橱窗，A却说为更易被注意，改变了展示方向。\n- B：PRH提出的是信用额度限制，移书指示是书店经理收到的另一动作，原文未说PRH要求改变展示。\n- C：信用限制被写为问题起点，随后发生撤出显眼位置的安排，C以商业举措和书店回应概括其因果。\n- D：relevant sections说明移往哪里，未说明为什么移。原段的原因是交易条件冲突，D将归类后的状态变成整理目的。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"32","questionConclusion":true},"html":"<blockquote>\n<p><strong>32. C</strong></p>\n</blockquote>\n<ul>\n<li>A：书被移出prominent areas，即显眼桌台、展示区和橱窗，A却说为更易被注意，改变了展示方向。</li>\n<li>B：PRH提出的是信用额度限制，移书指示是书店经理收到的另一动作，原文未说PRH要求改变展示。</li>\n<li>C：信用限制被写为问题起点，随后发生撤出显眼位置的安排，C以商业举措和书店回应概括其因果。</li>\n<li>D：relevant sections说明移往哪里，未说明为什么移。原段的原因是交易条件冲突，D将归类后的状态变成整理目的。</li>\n</ul>\n"},{"title":"33题 · 题干、题型与核心出处","raw":"## 33题\n\n> What message does the spokesperson for Waterstones seem to convey?\n>\n> 水石书店的发言人似乎想传达什么信息？\n\n### 题型\n\n言外之意题：综合承认限制、未来希望和强劲营业表态，不把愿望改成保证。\n\n题干点名spokesperson for Waterstones，第3段正是这位发言人的整段发言。先完整读他的说明，包括信用条件、顾客购书、重新开门的希望，以及末尾的繁忙状况和销量。\n\n### 核心出处\n\n> availability for customers remains good despite the lower overall levels of stock\n>\n> our shops are exceptionally busy\n>\n> surpassed any month since 2018","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"33","questionIntro":true},"html":"<blockquote>\n<p>What message does the spokesperson for Waterstones seem to convey?</p>\n<p>水石书店的发言人似乎想传达什么信息？</p>\n</blockquote>\n<h3>题型</h3>\n<p>言外之意题：综合承认限制、未来希望和强劲营业表态，不把愿望改成保证。</p>\n<p>题干点名spokesperson for Waterstones，第3段正是这位发言人的整段发言。先完整读他的说明，包括信用条件、顾客购书、重新开门的希望，以及末尾的繁忙状况和销量。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>availability for customers remains good despite the lower overall levels of stock</p>\n<p>our shops are exceptionally busy</p>\n<p>surpassed any month since 2018</p>\n</blockquote>\n"},{"title":"A. Their customers remain loyal.","raw":"### A. Their customers remain loyal.\n\n> 发言人想传达的是，他们的顾客仍然忠实。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n门店异常繁忙、五月推荐书销量强劲，发言人以此传达顾客仍积极支持书店，A在这一宽泛意义上对应其表态。\n\n**出处：**\n\n> PRH declined to comment on the issue, but a spokesperson for Waterstones told me: \"Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-33-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>发言人想传达的是，他们的顾客仍然忠实。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>门店异常繁忙、五月推荐书销量强劲，发言人以此传达顾客仍积极支持书店，A在这一宽泛意义上对应其表态。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>PRH declined to comment on the issue, but a spokesperson for Waterstones told me: &quot;Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.&quot;</p>\n</blockquote>\n</section>"},{"title":"A. Their customers remain loyal.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 发言人想传达的是，他们的顾客仍然忠实。\n\n门店异常繁忙、五月推荐书销量强劲，发言人以此传达顾客仍积极支持书店，A在这一宽泛意义上对应其表态。\n\n发言先承认信用与库存限制，再强调尽力供书和恢复正常的希望，最后用繁忙与销量支撑经营仍受顾客支持。\n\nloyal在这里不能推成所有顾客都从未流失或只在这一家买书。相比解除信用限制的保证、库存被低估或市场低迷，A更贴近他想传递的持续支持信息。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-33-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>发言人想传达的是，他们的顾客仍然忠实。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>门店异常繁忙、五月推荐书销量强劲，发言人以此传达顾客仍积极支持书店，A在这一宽泛意义上对应其表态。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>PRH declined to comment on the issue, but a spokesperson for Waterstones told me: &quot;Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>发言人想传达的是，他们的顾客仍然忠实。</p>\n</blockquote>\n<p>门店异常繁忙、五月推荐书销量强劲，发言人以此传达顾客仍积极支持书店，A在这一宽泛意义上对应其表态。</p>\n<p>发言先承认信用与库存限制，再强调尽力供书和恢复正常的希望，最后用繁忙与销量支撑经营仍受顾客支持。</p>\n<p>loyal在这里不能推成所有顾客都从未流失或只在这一家买书。相比解除信用限制的保证、库存被低估或市场低迷，A更贴近他想传递的持续支持信息。</p>\n</section>"},{"title":"A. Their customers remain loyal.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> PRH declined to comment on the issue, but a spokesperson for Waterstones told me: \"Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.\"\n>\n> PRH拒绝评论。Waterstones发言人说，目前在PRH缩减的信用条件下经营，PRH是英国唯一限制其交易能力的出版商。他们没有抵制PRH图书，虽然总体库存较低，仍尽力确保顾客能买到书。门店重开后，他们希望一切恢复正常、能获准适当采购。门店确实异常繁忙，五月每月好书推荐的销量超过2018年以来任何一个月。\n\n发言先承认信用与库存限制，再强调尽力供书和恢复正常的希望，最后用繁忙与销量支撑经营仍受顾客支持。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The spokesperson suggests that their customers remain loyal.\n>\n> 发言人想传达的是，他们的顾客仍然忠实。\n\nloyal在这里不能推成所有顾客都从未流失或只在这一家买书。相比解除信用限制的保证、库存被低估或市场低迷，A更贴近他想传递的持续支持信息。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-33-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>发言人想传达的是，他们的顾客仍然忠实。</p>\n</blockquote>\n<p>< he UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>发言人想传达的是，图书市场低迷。</p>\n</blockquote>\n<p><code>the book market is rather slack</code>是在概括市场活跃程度；发言人则用<code>exceptionally busy</code>和<code>surpassed any month since 2018</code>描述自家营业情况，回看第3段末两句所传达的销售表现。</p>\n<p>原文以<code>exceptionally busy</code>形容水石书店的繁忙，又说五月“每月好书”销量超过2018年以来任何一个月，用来强调营业和销售活跃。选项<code>the book market is rather slack</code>却把发言概括成整个图书市场低迷，不仅把自家门店的范围扩成整个市场，还把他用来强调活跃的表现改接成低迷信息。库存降低是他面对的条件，不能取代末尾明确列出的营业表现。</p>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>PRH declined to comment on the issue, but a spokesperson for Waterstones told me: &quot;Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.&quot;</p>\n<p>PRH拒绝评论。Waterstones发言人说，目前在PRH缩减的信用条件下经营，PRH是英国唯一限制其交易能力的出版商。他们没有抵制PRH图书，虽然总体库存较低，仍尽力确保顾客能买到书。门店重开后，他们希望一切恢复正常、能获准适当采购。门店确实异常繁忙，五月每月好书推荐的销量超过2018年以来任何一个月。</p>\n</blockquote>\n<p>承认交易受限之后，发言人以强劲到店和销售情况收尾，传达经营韧性。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The spokesperson suggests that the book market is rather slack.</p>\n<p>发言人想传达的是，图书市场低迷。</p>\n</blockquote>\n<p>D需要全市场疲弱的证据。单一出版商库存减少不是市场需求低迷，发言末尾的数据也不能被反向解读。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"33题结论","raw":"### 33题结论\n\n> **33. A**\n\n- A：门店异常繁忙、五月推荐书销量强劲，发言人以此传达顾客仍积极支持书店，A在这一宽泛意义上对应其表态。\n- B：We are hopeful表达希望恢复正常购买，不等于PRH已决定取消额度限制。B将愿望改成确定未来结果。\n- C：despite lower overall levels of stock承认库存偏低，再说仍努力保障购书；underestimated却要求别人估少了实际库存。\n- D：exceptionally busy和销量超过2018年以来各月强调自家经营活跃，D却概括整个市场低迷，方向与范围都改了。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"33","questionConclusion":true},"html":"<blockquote>\n<p><strong>33. A</strong></p>\n</blockquote>\n<ul>\n<li>A：门店异常繁忙、五月推荐书销量强劲，发言人以此传达顾客仍积极支持书店，A在这一宽泛意义上对应其表态。</li>\n<li>B：We are hopeful表达希望恢复正常购买，不等于PRH已决定取消额度限制。B将愿望改成确定未来结果。</li>\n<li>C：despite lower overall levels of stock承认库存偏低，再说仍努力保障购书；underestimated却要求别人估少了实际库存。</li>\n<li>D：exceptionally busy和销量超过2018年以来各月强调自家经营活跃，D却概括整个市场低迷，方向与范围都改了。</li>\n</ul>\n"},{"title":"34题 · 题干、题型与核心出处","raw":"## 34题\n\n> What can be one consequence of the current dispute?\n>\n> 当前这场纠纷可能产生什么后果？\n\n### 题型\n\n后果推断题：由不同作者对推广的依赖推可能影响，保留can be而不虚构实际降幅。\n\n题干的current dispute提示要找这场纠纷影响谁。粗读第4段留下了“PRH authors have been the losers”这一片段，而且段末直接出现the dispute，因此完整阅读第4段，比较知名作者和中间层次作者的处境。\n\n### 核心出处\n\n> PRH authors have been the losers\n>\n> Big-name PRH authors may suffer a bit\n>\n> who normally rely on Waterstones staff’s passion for promoting books by lesser-known writers","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"34","questionIntro":true},"html":"<blockquote>\n<p>What can be one consequence of the current dispute?</p>\n<p>当前这场纠纷可能产生什么后果？</p>\n</blockquote>\n<h3>题型</h3>\n<p>后果推断题：由不同作者对推广的依赖推可能影响，保留can be而不虚构实际降幅。</p>\n<p>题干的current dispute提示要找这场纠纷影响谁。粗读第4段留下了“PRH authors have been the losers”这一片段，而且段末直接出现the dispute，因此完整阅读第4段，比较知名作者和中间层次作者的处境。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>PRH authors have been the losers</p>\n<p>Big-name PRH authors may suffer a bit</p>\n<p>who normally rely on Waterstones staff’s passion for promoting books by lesser-known writers</p>\n</blockquote>\n"},{"title":"A. Sales of books by mid-list PRH writers fall off considerably.","raw":"### A. Sales of books by mid-list PRH writers fall off considerably.\n\n> 当前纠纷的可能后果是中间层次PRH作者的书销量明显下降。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n中间层次作者更依赖书店员工推广，冲突削弱展示推广时，比知名作者更可能遭受明显销售打击。\n\n**出处：**\n\n> In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it's those mid-list authors, who normally rely on Waterstones staff's passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-34-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>当前纠纷的可能后果是中间层次PRH作者的书销量明显下降。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>中间层次作者更依赖书店员工推广，冲突削弱展示推广时，比知名作者更可能遭受明显销售打击。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n</section>"},{"title":"A. Sales of books by mid-list PRH writers fall off considerably.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 当前纠纷的可能后果是中间层次PRH作者的书销量明显下降。\n\n`mid-list PRH writers`直接对应第4段`those mid-list authors`；`fall off considerably`要从`PRH authors have been the losers`所说的损失以及他们对书店推广的依赖来判断，因此回看第4段两句的对比。\n\n原文先说`PRH authors have been the losers`，再用知名作者可能只受一点影响，对比那些依靠水石员工热情推广的中间层次作者。选项的`mid-list PRH writers`就是后一群人；他们需要书店推广来帮助书籍被读者购买，纠纷影响这种帮助，就可能使销量`fall off considerably`。原文没有报告实际下降幅度，但题干问可能后果，作者特别突出这群人盼望纠纷结束，支持他们可能受到较重销售打击的推断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-34-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>当前纠纷的可能后果是中间层次PRH作者的书销量明显下降。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>中间层次作者更依赖书店员工推广，冲突削弱展示推广时，比知名作者更可能遭受明显销售打击。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>当前纠纷的可能后果是中间层次PRH作者的书销量明显下降。</p>\n</blockquote>\n<p><code>mid-list PRH writers</code>直接对应第4段<code>those mid-list authors</code>；<code>fall off considerably</code>要从<code>PRH authors have been the losers</code>所说的损失以及他们对书店推广的依赖来判断，因此回看第4段两句的对比。</p>\n<p>原文先说<code>PRH authors have been the losers</code>，再用知名作者可能只受一点影响，对比那些依靠水石员工热情推广的中间层次作者。选项的<code>mid-list PRH writers</code>就是后一群人；他们需要书店推广来帮助书籍被读者购买，纠纷影响这种帮助，就可能使销量<code>fall off considerably</code>。原文没有报告实际下降幅度，但题干问可能后果，作者特别突出这群人盼望纠纷结束，支持他们可能受到较重销售打击的推断。</p>\n</section>"},{"title":"A. Sales of books by mid-list PRH writers fall off considerably.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it's those mid-list authors, who normally rely on Waterstones staff's passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.\n>\n> 与此同时，PRH作者已成为受损者。知名作者或许只受一些影响，但那些通常依赖Waterstones员工热情推广不太知名作品的中间层次作者，更会盼望纠纷结束。\n\n先说PRH作者是输家，再用big-name may suffer a bit与mid-list盼纠纷结束对照，后者的依赖解释受损差异。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The dispute may mean that sales of books by mid-list PRH writers fall off considerably.\n>\n> 当前纠纷的可能后果是中间层次PRH作者的书销量明显下降。\n\n题干问can be，允许推测较重销量后果；原文没有实际降幅记录，因此不能把A写成已经统计出大幅下跌或每人必然同样下降。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-34-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>当前纠纷的可能后果是中间层次PRH作者的书销量明显下降。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>中间层次作者更依赖书店员工推广，冲突削弱展示推广时，比知名作者更可能遭受明显销售打击。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-A-1\"><h3>定位比对法</h3>
