const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. The authors most exposed to a dispute over book promotion</strong></p><p><strong>B. A retailer’s attempt to reassure customers and suppliers</strong></p><p><strong>C. A conflict visible in where books are displayed</strong></p><p><strong>D. The value of multiple routes for different voices</strong></p><p><strong>E. A guaranteed end to all credit restrictions</strong></p><p><strong>F. A merger that may reduce competition and variety</strong></p><p><strong>G. A plan for every small publisher to join one company</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>If you&#x27;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#x27;s new children&#x27;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#x27;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones. The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>PRH declined to comment on the issue, but a spokesperson for Waterstones told me: &quot;Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.&quot;</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#x27;s those mid-list authors, who normally rely on Waterstones staff&#x27;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>&quot;This is all part of a wider change towards concentration of power,&quot; says literary agent Andrew Lownie. &quot;The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers.&quot; We shall see whether that plurality is a casualty of the current need among publishers to be big enough to take on all-comers.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>A reader searching for a newly published book may encounter the effects of a dispute far removed from its literary content. Two prominent titles from the same publishing group illustrate this situation. Their visibility in a major bookshop has become connected to a commercial stand-off between the retailer and publisher.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>Market structure also affects the routes through which readers encounter different voices. Diversity among authors and staff is valuable, but it does not by itself guarantee a plurality of ways to deliver ideas. Several independent publishing channels can preserve choices that a concentrated system may narrow.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>This vulnerability comes alongside concern about a proposed merger between large publishers. Fewer independent bidders could mean less competition for books, lower advances and greater similarity in what reaches print. Authors therefore face questions about market structure as well as one retailer’s display choices.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>The retailer acknowledged reduced credit but denied boycotting the publisher’s books. It emphasised efforts to maintain availability and expressed hope that normal trading would return. Busy shops and strong recent sales were cited to suggest that customers continued to support the business.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>For the publisher’s authors, however, reduced promotion could carry a different cost. Established names might lose relatively little, while less prominent writers often depend on booksellers’ recommendations. Their reliance on staff enthusiasm makes them especially vulnerable to the continuing dispute.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>The stand-off began after the publisher imposed a significant credit limit. Reports then described instructions to move its books away from prominent tables and windows into their usual sections. The change in display was therefore a response to trading conditions rather than a new method of classification.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Small publishers provide one reason to value those independent channels. They have produced many interesting books that demonstrate the contribution of different editorial choices. Their example supports concern about concentration rather than a demand that all small firms combine into a single organisation.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>The remaining question is whether the drive for greater size will sacrifice that plurality. A company may want enough scale to challenge every competitor, but the resulting concentration can affect authors and readers differently. Commercial strength should not automatically be equated with a wider range of voices.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>retailer</td>\n<td>n.零售商</td>\n<td>in search of</td>\n<td>寻找</td>\n<td>Duchess</td>\n<td>n.公爵夫人</td>\n</tr>\n<tr>\n<td>thriller</td>\n<td>n.惊悚小说</td>\n<td>published</td>\n<td>v.出版</td>\n<td>currently</td>\n<td>adv.当前</td>\n</tr>\n<tr>\n<td>involved in</td>\n<td>卷入</td>\n<td>stand-off</td>\n<td>n.僵持</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>confirmed</td>\n<td>v.确认</td>\n<td>credit limit</td>\n<td>信用额度限制</td>\n<td>significant</td>\n<td>adj.显著的</td>\n</tr>\n<tr>\n<td>trade magazine</td>\n<td>行业杂志</td>\n<td>branch managers</td>\n<td>分店经理</td>\n<td>prominent</td>\n<td>adj.显眼的</td>\n</tr>\n<tr>\n<td>display spaces</td>\n<td>展示区</td>\n<td>retiring</td>\n<td>v.撤下移往</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思 all publishers</td>\n<td>小出版商</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第7段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>whether</td>\n<td>conj.是否</td>\n<td>plurality</td>\n<td>n.多元性</td>\n<td>casualty</td>\n<td>n.牺牲品</td>\n</tr>\n<tr>\n<td>current</td>\n<td>adj.当前的</td>\n<td>need</td>\n<td>n.需要</td>\n<td>big enough</td>\n<td>足够大</td>\n</tr>\n<tr>\n<td>take on</td>\n<td>对抗</td>\n<td>all-comers</td>\n<td>n.所有挑战者</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n<h3>意群划分 · 第1段</h3>\n<p>If you&#39;re heading for / your nearest branch of Waterstones, / the biggest book retailer in the UK, / in search of / the Duchess of Sussex&#39;s new children&#39;s book / The Bench, / you might have to be prepared / to hunt around a bit; / the same maybe true of / The President&#39;s Daughter, / the new thriller / by Bill Clinton and James Patterson.</p>\n<p>Both of these Books / are published next week / by Penguin Random House (PRH), / a company currently involved / in a stand-off / with Waterstones.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>如果你正前往 / 你最近的Waterstones分店，/ 英国最大的图书零售商，/ 寻找 / 苏塞克斯公爵夫人的新童书 / 《长凳》，/ 你可能要准备好 / 四处寻找一番；/ 同样的情况可能适用于 / 《总统的女儿》，/ 这本新惊悚小说 / 由比尔·克林顿和詹姆斯·帕特森著。</p>\n<p>这两本书 / 都将在下周出版 / 由企鹅兰登书屋（PRH），/ 一家目前卷入 / 对峙中 / 与Waterstones。</p>\n<h3>标准译文 · 第1段</h3>\n<p>如果你正前往最近的Waterstones分店（英国最大的图书零售商）寻找苏塞克斯公爵夫人的新童书《长凳》，你可能要准备好四处寻找一番；同样的情况可能也适用于比尔·克林顿和詹姆斯·帕特森合著的新惊悚小说《总统的女儿》。这两本书都将在下周由企鹅兰登书屋（PRH）出版，而这家公司目前正与Waterstones陷入对峙。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n<h3>意群划分 · 第2段</h3>\n<p>The problem began / late last year, / when Penguin Random House confirmed / that it had introduced / a credit limit / with Waterstones / &quot;at a very significant level&quot;.</p>\n<p>The trade magazine / The Bookseller / reported that / Waterstones branch managers / were being told / to remove PRH books / from prominent areas / such as tables, display spaces and windows, / and were &quot;quietly retiring them / to their relevant sections&quot;.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>问题开始 / 去年年底，/ 当企鹅兰登书屋确认 / 它已经引入 / 信用额度限制 / 对Waterstones / &quot;在一个非常显著的水平&quot;。</p>\n<p>行业杂志 / 《书商》/ 报道说 / Waterstones分店经理们 / 被告知 / 移除PRH的书籍 / 从显眼区域 / 比如桌子、展示空间和橱窗，/ 并且&quot;悄悄地将它们退回 / 到相关的区域&quot;。</p>\n<h3>标准译文 · 第2段</h3>\n<p>问题始于去年年底，当时企鹅兰登书屋确认对Waterstones引入了&quot;非常显著水平&quot;的信用额度限制。行业杂志《书商》报道说，Waterstones分店经理们被告知要将PRH的书籍从桌子、展示空间和橱窗等显眼区域移除，并&quot;悄悄地将它们退回到相关的区域&quot;。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>PRH declined to comment on the issue, but a spokesperson for Waterstones told me: &quot;Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade. We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock. We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately. Certainly, our shops are exceptionally busy. The sales for our May Books of the Month surpassed any month since 2018.&quot;</p>\n<h3>意群划分 · 第3段</h3>\n<p>PRH declined to comment / on the issue, / but a spokesperson for Waterstones / told me: / &quot;Waterstones are currently operating / with reduced credit terms / from PRH, / the only publisher in the UK / to place any limitations / on our ability to trade.</p>\n<p>We are not boycotting / PRH titles / but we are doing our utmost / to ensure that / availability for customers / remains good / despite the lower overall levels of stock.</p>\n<p>We are hopeful / with our shops now open again / that normality will return / and that we will be allowed / to buy appropriately.</p>\n<p>Certainly, / our shops are exceptionally busy. / The sales for our May Books of the Month / surpassed any month / since 2018.&quot;</p>\n<h3>意群翻译 · 第3段</h3>\n<p>PRH拒绝评论 / 这个问题，/ 但Waterstones的发言人 / 告诉我：/ &quot;Waterstones目前正在运营 / 以减少的信用条款 / 来自PRH，/ 英国唯一的出版商 / 施加任何限制 / 对我们的交易能力。</p>\n<p>我们没有抵制 / PRH的书籍 / 但我们正在尽最大努力 / 确保 / 对顾客的供应 / 保持良好 / 尽管整体库存水平较低。</p>\n<p>我们有希望 / 随着我们的商店现在重新开放 / 正常状态将会恢复 / 并且我们将被允许 / 适当地采购。</p>\n<p>当然，/ 我们的商店异常繁忙。/ 我们五月当月图书的销售 / 超过了任何一个月 / 自2018年以来。&quot;</p>\n<h3>标准译文 · 第3段</h3>\n<p>PRH拒绝就此事发表评论，但Waterstones的发言人告诉我：&quot;Waterstones目前正在以PRH提供的减少信用条款运营，PRH是英国唯一对我们的交易能力施加限制的出版商。我们没有抵制PRH的书籍，但我们正在尽最大努力确保尽管整体库存水平较低，但对顾客的供应仍保持良好。随着我们的商店现在重新开放，我们希望正常状态将会恢复，我们将被允许适当地采购。当然，我们的商店异常繁忙。我们五月当月图书的销售超过了2018年以来的任何一个月。&quot;</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>In the meantime, PRH authors have been the losers. Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n<h3>意群划分 · 第4段</h3>\n<p>In the meantime, / PRH authors / have been the losers.</p>\n<p>Big-name PRH authors / may suffer a bit, / but it&#39;s those mid-list authors, / who normally rely on / Waterstones staff&#39;s passion / for promoting books / by lesser-known writers, / who will be praying / for an end to the dispute.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>与此同时，/ PRH的作者们 / 成为了输家。</p>\n<p>知名的PRH作者 / 可能会受一点影响，/ 但正是那些中等名单作者，/ 他们通常依赖 / Waterstones员工的热情 / 来推广书籍 / 由较不知名的作家，/ 他们将会祈祷 / 争端的结束。</p>\n<h3>标准译文 · 第4段</h3>\n<p>与此同时，PRH的作者们成为了输家。知名的PRH作者可能会受一点影响，但正是那些中等名单作者，他们通常依赖Waterstones员工对推广较不知名作家作品的热情，将会祈祷争端早日结束。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.</p>\n<h3>意群划分 · 第5段</h3>\n<p>It comes at a time / when authors are already worried / about the consequences / of the proposed merger / between PRH and another big publisher, / Simon &amp; Schuster - / the reduction in the number / of unaligned UK publishers / is likely to lead to / fewer bidding wars, / lower advances, / and more conformity / in terms of what is published.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>这发生在一个时候 / 当作者们已经担心 / 关于后果 / 拟议合并的 / 在PRH和另一家大出版商之间，/ 西蒙与舒斯特 - / 数量的减少 / 独立的英国出版商 / 可能导致 / 更少的竞价战，/ 更低的预付款，/ 和更多的一致性 / 在出版内容方面。</p>\n<h3>标准译文 · 第5段</h3>\n<p>这发生在作者们已经在担心PRH与另一家大出版商西蒙与舒斯特拟议合并后果的时候——独立英国出版商数量的减少可能导致更少的竞价战、更低的预付款，以及在出版内容方面更多的一致性。</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>&quot;This is all part of a wider change towards concentration of power,&quot; says literary agent Andrew Lownie. &quot;The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices. After all, many of the most interesting books in recent years have come from small publishers.&quot;</p>\n<h3>意群划分 · 第6段</h3>\n<p>&quot;This is all part of / a wider change / towards concentration of power,&quot; / says literary agent Andrew Lownie.</p>\n<p>&quot;The publishing industry / talks about diversity / in terms of authors and staff / but it also needs / a plurality of ways / of delivering intellectual contact, / choice and different voices.</p>\n<p>After all, / many of the most interesting books / in recent years / have come from / small publishers.&quot;</p>\n<h3>意群翻译 · 第6段</h3>\n<p>&quot;这都是一部分 / 更广泛的变化 / 朝向权力集中，&quot; / 文学经纪人安德鲁·洛尼说。</p>\n<p>&quot;出版业 / 谈论多样性 / 在作者和员工方面 / 但它也需要 / 多元化的方式 / 传递智力接触，/ 选择和不同的声音。</p>\n<p>毕竟，/ 许多最有趣的书籍 / 在近年来 / 来自于 / 小出版商。&quot;</p>\n<h3>标准译文 · 第6段</h3>\n<p>文学经纪人安德鲁·洛尼说：&quot;这都是朝向权力集中的更广泛变化的一部分。出版业谈论作者和员工方面的多样性，但它也需要多元化的方式来传递智力接触、选择和不同的声音。毕竟，近年来许多最有趣的书籍都来自小出版商。&quot;</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>We shall see whether that plurality is a casualty of the current need among publishers to be big enough to take on all-comers.</p>\n<h3>意群划分 · 第7段</h3>\n<p>We shall see / whether that plurality / is a casualty / of the current need / among publishers / to be big enough / to take on all-comers.</p>\n<h3>意群翻译 · 第7段</h3>\n<p>我们将看到 / 那种多元性是否 / 是牺牲品 / 当前需求的 / 在出版商中 / 变得足够大 / 来应对所有竞争者。</p>\n<h3>标准译文 · 第7段</h3>\n<p>我们将看到，这种多元性是否会成为出版商为了变得足够大以应对所有竞争者的当前需求的牺牲品。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>If you&#39;re heading for → your nearest branch of Waterstones：(the biggest book retailer in the UK) → in search of：(the Duchess of Sussex&#39;s new children&#39;s book：(The Bench)) → you might have to be prepared → to hunt around a bit; → the same maybe true of：(The President&#39;s Daughter：(the new thriller：(by Bill Clinton and James Patterson))).</p>\n<p>Both of these Books → are published next week：(by Penguin Random House (PRH))：(a company currently involved：(in a stand-off：(with Waterstones))).</p>\n<p><strong>第2段</strong></p>\n<p>The problem began：(late last year)：(when Penguin Random House confirmed：(that it had introduced → a credit limit：(with Waterstones)：(&quot;at a very significant level&quot;))).</p>\n<p>The trade magazine：(The Bookseller) → reported：(that Waterstones branch managers → were being told → to remove PRH books：(from prominent areas：(such as tables, display spaces and windows)) + were &quot;quietly retiring them：(to their relevant sections)&quot;).</p>\n<p><strong>第3段</strong></p>\n<p>PRH declined to comment：(on the issue) // but a spokesperson for Waterstones → told me：&quot;Waterstones are currently operating：(with reduced credit terms：(from PRH))：(the only publisher in the UK：(to place any limitations：(on our ability to trade))).</p>\n<p>We are not boycotting：(PRH titles) // but we are doing our utmost → to ensure：(that availability for customers → remains good)：(despite the lower overall levels of stock).</p>\n<p>We are hopeful：(with our shops now open again)：(that normality will return + that we will be allowed → to buy appropriately).</p>\n<p>Certainly → our shops are exceptionally busy. → The sales for our May Books of the Month → surpassed any month：(since 2018).&quot;</p>\n<p><strong>第4段</strong></p>\n<p>In the meantime → PRH authors → have been the losers.</p>\n<p>Big-name PRH authors → may suffer a bit // but it&#39;s those mid-list authors：(who normally rely on：(Waterstones staff&#39;s passion：(for promoting books：(by lesser-known writers)))) → who will be praying：(for an end to the dispute).</p>\n<p><strong>第5段</strong></p>\n<p>It comes at a time：(when authors are already worried：(about the consequences：(of the proposed merger：(between PRH and another big publisher：(Simon &amp; Schuster))))) - the reduction：(in the number：(of unaligned UK publishers)) → is likely to lead to：(fewer bidding wars + lower advances + more conformity：(in terms of what is published)).</p>\n<p><strong>第6段</strong></p>\n<p>&quot;This is all part of：(a wider change：(towards concentration of power))&quot; → says literary agent Andrew Lownie.</p>\n<p>&quot;The publishing industry → talks about diversity：(in terms of authors and staff) // but it also needs：(a plurality of ways：(of delivering intellectual contact + choice + different voices)).</p>\n<p>After all → many of the most interesting books：(in recent years) → have come from：(small publishers).&quot;</p>\n<p><strong>第7段</strong></p>\n<p>We shall see：(whether that plurality → is a casualty：(of the current need：(among publishers)：(to be big enough：(to take on all-comers)))).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>如果你正前往 → 你最近的Waterstones分店：(英国最大的图书零售商) → 寻找：(苏塞克斯公爵夫人的新童书：(《长凳》)) → 你可能要准备好 → 四处寻找一番；→ 同样的情况可能适用于：(《总统的女儿》：(这本新惊悚小说：(由比尔·克林顿和詹姆斯·帕特森著)))。</p>\n<p>这两本书 → 都将在下周出版：(由企鹅兰登书屋（PRH））：(一家目前卷入：(对峙中：(与Waterstones)))。</p>\n<p><strong>第2段</strong></p>\n<p>问题开始：(去年年底)：(当企鹅兰登书屋确认：(它已经引入 → 信用额度限制：(对Waterstones)：(&quot;在一个非常显著的水平&quot;)))。</p>\n<p>行业杂志：(《书商》) → 报道说：(Waterstones分店经理们 → 被告知 → 移除PRH的书籍：(从显眼区域：(比如桌子、展示空间和橱窗)) + &quot;悄悄地将它们退回：(到相关的区域)&quot;)。</p>\n<p><strong>第3段</strong></p>\n<p>PRH拒绝评论：(这个问题) // 但Waterstones的发言人 → 告诉我：&quot;Waterstones目前正在运营：(以减少的信用条款：(来自PRH))：(英国唯一的出版商：(施加任何限制：(对我们的交易能力)))。</p>\n<p>我们没有抵制：(PRH的书籍) // 但我们正在尽最大努力 → 确保：(对顾客的供应 → 保持良好)：(尽管整体库存水平较低)。</p>\n<p>我们有希望：(随着我们的商店现在重新开放)：(正常状态将会恢复 + 我们将被允许 → 适当地采购)。</p>\n<p>当然 → 我们的商店异常繁忙。→ 我们五月当月图书的销售 → 超过了任何一个月：(自2018年以来)。&quot;</p>\n<p><strong>第4段</strong></p>\n<p>与此同时 → PRH的作者们 → 成为了输家。</p>\n<p>知名的PRH作者 → 可能会受一点影响 // 但正是那些中等名单作者：(他们通常依赖：(Waterstones员工的热情：(来推广书籍：(由较不知名的作家)))) → 他们将会祈祷：(争端的结束)。</p>\n<p><strong>第5段</strong></p>\n<p>这发生在一个时候：(当作者们已经担心：(关于后果：(拟议合并的：(在PRH和另一家大出版商之间：(西蒙与舒斯特))))) - 减少：(在数量：(独立的英国出版商)) → 可能导致：(更少的竞价战 + 更低的预付款 + 更多的一致性：(在出版内容方面))。</p>\n<p><strong>第6段</strong></p>\n<p>&quot;这都是一部分：(更广泛的变化：(朝向权力集中))&quot; → 文学经纪人安德鲁·洛尼说。</p>\n<p>&quot;出版业 → 谈论多样性：(在作者和员工方面) // 但它也需要：(多元化的方式：(传递智力接触 + 选择 + 不同的声音))。</p>\n<p>毕竟 → 许多最有趣的书籍：(在近年来) → 来自于：(小出版商)。&quot;</p>\n<p><strong>第7段</strong></p>\n<p>我们将看到：(那种多元性是否 → 是牺牲品：(当前需求的：(在出版商中)：(变得足够大：(来应对所有竞争者))))。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>If you&#39;re heading for / your nearest branch of Waterstones, / the biggest book retailer in the UK, / in search of / the Duchess of Sussex&#39;s new children&#39;s book / The Bench, / you might have to be prepared / to hunt around a bit; / the same maybe true of / The President&#39;s Daughter, / the new thriller / by Bill Clinton and James Patterson.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>如果你正前往 / 你最近的Waterstones分店，/ 英国最大的图书零售商，/ 寻找 / 苏塞克斯公爵夫人的新童书 / 《长凳》，/ 你可能要准备好 / 四处寻找一番；/ 同样的情况可能适用于 / 《总统的女儿》，/ 这本新惊悚小说 / 由比尔·克林顿和詹姆斯·帕特森著。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>If引出读者前往书店找书的情境，插入的书店身份和书名作者不改变主干；分号后说明另一书同样可能。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>如果你正前往  你最近的Waterstones分店， 英国最大的图书零售商， 寻找  苏塞克斯公爵夫人的新童书  《长凳》， 你可能要准备好  四处寻找一番； 同样的情况可能适用于  《总统的女儿》， 这本新惊悚小说  由比尔·克林顿和詹姆斯·帕特森著。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>寻找这两本新书的读者可能需要费力找一找。</p>\n</blockquote>\n<p>先说去何处找什么，再说可能不易找到，最后并列另一部作品。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>如果你正前往最近的Waterstones分店（英国最大的图书零售商）寻找苏塞克斯公爵夫人的新童书《长凳》，你可能要准备好四处寻找一番；同样的情况可能也适用于比尔·克林顿和詹姆斯·帕特森合著的新惊悚小说《总统的女儿》。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>might与may保留提醒的可能性，不是说书店已经完全无书可卖。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>如果你正前往最近的Waterstones分店（英国最大的图书零售商）寻找苏塞克斯公爵夫人的新童书《长凳》，你可能要准备好四处寻找一番；同样的情况可能也适用于比尔·克林顿和詹姆斯·帕特森合著的新惊悚小说《总统的女儿》。</p>\n</blockquote>\n<h2>2. 第4段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Big-name PRH authors may suffer a bit, but it&#39;s those mid-list authors, who normally rely on Waterstones staff&#39;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Big-name PRH authors / may suffer a bit, / but it&#39;s those mid-list authors, / who normally rely on / Waterstones staff&#39;s passion / for promoting books / by lesser-known writers, / who will be praying / for an end to the dispute.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>知名的PRH作者 / 可能会受一点影响，/ 但正是那些中等名单作者，/ 他们通常依赖 / Waterstones员工的热情 / 来推广书籍 / 由较不知名的作家，/ 他们将会祈祷 / 争端的结束。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>but转出重点群体，who解释其依赖关系，强调结构it is ... who把落点放在这些作者。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>知名的PRH作者  可能会受一点影响， 但正是那些中等名单作者， 他们通常依赖  Waterstones员工的热情  来推广书籍  由较不知名的作家， 他们将会祈祷  争端的结束。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>中等知名度作者更依赖书店员工推荐，因而更盼纠纷结束。</p>\n</blockquote>\n<p>先比较知名作者，再说明中等知名度作者为什么处境更难。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>知名的PRH作者可能会受一点影响，但正是那些中等名单作者，他们通常依赖Waterstones员工对推广较不知名作家作品的热情，将会祈祷争端早日结束。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>mid-list不是“名不见经传”，也不能把可能销量损失写成已公布的精确统计。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>知名的PRH作者可能会受一点影响，但正是那些中等名单作者，他们通常依赖Waterstones员工对推广较不知名作家作品的热情，将会祈祷争端早日结束。</p>\n</blockquote>\n<h2>3. 第5段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster - the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>It comes at a time / when authors are already worried / about the consequences / of the proposed merger / between PRH and another big publisher, / Simon &amp; Schuster - / the reduction in the number / of unaligned UK publishers / is likely to lead to / fewer bidding wars, / lower advances, / and more conformity / in terms of what is published.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>这发生在一个时候 / 当作者们已经担心 / 关于后果 / 拟议合并的 / 在PRH和另一家大出版商之间，/ 西蒙与舒斯特 - / 数量的减少 / 独立的英国出版商 / 可能导致 / 更少的竞价战，/ 更低的预付款，/ 和更多的一致性 / 在出版内容方面。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>破折号后给出作者担忧的具体机制，三个并列结果都接到reduction之后。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>这发生在一个时候  当作者们已经担心  关于后果  拟议合并的  在PRH和另一家大出版商之间， 西蒙与舒斯特 -  数量的减少  独立的英国出版商  可能导致  更少的竞价战， 更低的预付款， 和更多的一致性  在出版内容方面。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>合并可能减少独立出版商，从而削弱竞价并使出版内容趋同。</p>\n</blockquote>\n<p>先交代合并背景，再按竞争者减少、竞价与预付款变化、内容趋同展开。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>这发生在作者们已经在担心PRH与另一家大出版商西蒙与舒斯特拟议合并后果的时候——独立英国出版商数量的减少可能导致更少的竞价战、更低的预付款，以及在出版内容方面更多的一致性。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>likely是预测；advances指版税预付款，不是科学进步。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>这发生在作者们已经在担心PRH与另一家大出版商西蒙与舒斯特拟议合并后果的时候——独立英国出版商数量的减少可能导致更少的竞价战、更低的预付款，以及在出版内容方面更多的一致性。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>31题</h2>\n<blockquote>\n<p>The author mentions two books in Paragraph 1 to present ______.</p>\n<p>作者在第1段提到两本书，是为了呈现什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>例证作用题：把例子接回它所支持的判断，区分例子内容与引用目的。</p>\n<p>题干直接给出two books和Paragraph 1，先把第1段从头读到尾：作者让想去水石书店寻找这两本新书的读者有所准备，随后点出两本书的出版商与水石书店的关系。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>you might have to be prepared to hunt around a bit</p>\n<p>a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n<h3>A. an ongoing conflict</h3>\n<blockquote>\n<p>作者提两本书是为呈现正在持续的冲突。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>两本新书可能不易在显眼处找到，而共同出版商正与Waterstones僵持，A概括正在持续的冲突。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提两本书是为呈现正在持续的冲突。</p>\n</blockquote>\n<p><code>an ongoing conflict</code>对应段末的<code>currently involved in a stand-off</code>，前面的找书情景与出版商正在同水石书店僵持相接，因此回看第1段两句的连接。</p>\n<p>原文先说寻找这两本新书可能需要四下找一找，随后说明出版它们的公司<code>currently involved in a stand-off with Waterstones</code>。选项的<code>an ongoing conflict</code>说的也是正在持续的冲突。作者用两本具体的新书引出同一家出版商与书店之间的僵持，<code>ongoing</code>与<code>currently</code>也在时间上吻合。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n<p>如果去英国最大图书零售商Waterstones门店找萨塞克斯公爵夫人的新童书《长椅》，可能需要四处找一找；寻找Bill Clinton与James Patterson合著的新惊悚小说《总统的女儿》也可能如此。两书下周均由PRH出版，该公司目前正与Waterstones僵持。</p>\n</blockquote>\n<p>首段先从读者实际找书情境切入，再用共同出版商及stand-off解释两例为什么并列。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The two books introduce an ongoing conflict.</p>\n<p>作者提两本书是为呈现正在持续的冲突。</p>\n</blockquote>\n<p>ongoing对应currently，作者没有讨论两书文学内容，而是用商品展示状况引出双方商业关系。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. an intellectual concept</h3>\n<blockquote>\n<p>作者提两本书是为呈现思想概念。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>书名与作者用于说明可能遇到的找书情境，没有引出某种思想概念。B将商业关系问题改成思想阐释。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提两本书是为呈现思想概念。</p>\n</blockquote>\n<p><code>an intellectual concept</code>要求两本书说明某个思想内容；回看第1段，作者围绕读者寻找书籍写到<code>hunt around a bit</code>，又交代出版商的<code>stand-off</code>，需检查这里是否是在阐述概念。</p>\n<p>原文的<code>hunt around a bit</code>描述读者找书可能遇到的实际情景，段末把这件事接到出版商与水石书店的僵持。<code>an intellectual concept</code>则把两本书的作用改成说明思想概念；这一改写需要介绍某种思想及其与两本书的联系，而本段建立的是买书情景与两家公司关系的联系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n<p>如果去英国最大图书零售商Waterstones门店找萨塞克斯公爵夫人的新童书《长椅》，可能需要四处找一找；寻找Bill Clinton与James Patterson合著的新惊悚小说《总统的女儿》也可能如此。两书下周均由PRH出版，该公司目前正与Waterstones僵持。</p>\n</blockquote>\n<p>读者去书店可能要四处寻找，下一句直接交代两书所属出版商与书店发生僵持。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The two books introduce an intellectual concept.</p>\n<p>作者提两本书是为呈现思想概念。</p>\n</blockquote>\n<p>B需要概念及两本书怎样体现它的分析。本文这里没有介绍故事思想，只把两书当作同一商业问题涉及的实例。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. a prevailing sentiment</h3>\n<blockquote>\n<p>作者提两本书是为呈现普遍流行情绪。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>提醒买书者准备多找找，是实际购物建议；prevailing sentiment要求一种普遍情绪，原段未描述这种感受。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提两本书是为呈现普遍流行情绪。</p>\n</blockquote>\n<p><code>a prevailing sentiment</code>要找的是人们普遍具有的感受；第1段对读者说<code>be prepared to hunt around a bit</code>，随后说明出版商与书店的关系，因此回看这两句有没有把找书写成普遍情绪。</p>\n<p>原文的<code>be prepared to hunt around a bit</code>是提醒打算买这两本书的人，可能需要四下寻找，后面交代的是两家公司正在僵持。<code>a prevailing sentiment</code>却说作者要表现一种广泛存在的感受，将具体的找书状况改成群体情绪，还加上了普遍流行的范围。原文没有从找书情景建立这种情绪及其普遍程度。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n<p>如果去英国最大图书零售商Waterstones门店找萨塞克斯公爵夫人的新童书《长椅》，可能需要四处找一找；寻找Bill Clinton与James Patterson合著的新惊悚小说《总统的女儿》也可能如此。两书下周均由PRH出版，该公司目前正与Waterstones僵持。</p>\n</blockquote>\n<p>作者从两本新书的共同处境落到两家公司僵持，而不是调查读者群体心态。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The two books introduce a prevailing sentiment.</p>\n<p>作者提两本书是为呈现普遍流行情绪。</p>\n</blockquote>\n<p>C需要情绪内容及广泛流行程度的证据。可能找书困难不能直接变成大众共同的不满或其他情绪。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. a literary phenomenon</h3>\n<blockquote>\n<p>作者提两本书是为呈现文学现象。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>两书共同点是出版商和受展示冲突影响的处境，未被用来归纳写作、题材或文学发展现象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者提两本书是为呈现文学现象。</p>\n</blockquote>\n<p><code>a literary phenomenon</code>与两本书有关，但要看作者把它们共同接到了什么事情上；段末的<code>a stand-off with Waterstones</code>明确写出出版商与书店的僵持，所以回看第一句的找书情景和第二句的共同出版商。</p>\n<p>原文把两本书并列，是因为读者寻找它们时可能面临相似情况，而它们的出版商正卷入<code>a stand-off with Waterstones</code>。选项<code>a literary phenomenon</code>则要求例子呈现某种文学上的共同现象。本段没有以两本书的文学特点建立联系，而是以共同出版商与书店的僵持解释为什么提到它们；书籍是这件事涉及的商品，不等于作者在归纳文学现象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>If you&#39;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#39;s new children&#39;s book The Bench, you might have to be prepared to hunt around a bit; the same maybe true of The President&#39;s Daughter, the new thriller by Bill Clinton and James Patterson. Both of these Books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.</p>\n<p>如果去英国最大图书零售商Waterstones门店找萨塞克斯公爵夫人的新童书《长椅》，可能需要四处找一找；寻找Bill Clinton与James Patterson合著的新惊悚小说《总统的女儿》也可能如此。两书下周均由PRH出版，该公司目前正与Waterstones僵持。</p>\n</blockquote>\n<p>一本儿童书与一本惊悚小说先因找书问题并列，随后才给出PRH与Waterstones的商业僵持。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The two books introduce a literary phenomenon.</p>\n<p>作者提两本书是为呈现文学现象。</p>\n</blockquote>\n<p>D需要文学内容或文学领域趋势把两例连起来。材料是图书不等于讨论目的就是文学现象，A能解释实际连接。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>31题结论</h3>\n<blockquote>\n<p><strong>31. A</strong></p>\n</blockquote>\n<ul>\n<li>A：两本新书可能不易在显眼处找到，而共同出版商正与Waterstones僵持，A概括正在持续的冲突。</li>\n<li>B：书名与作者用于说明可能遇到的找书情境，没有引出某种思想概念。B将商业关系问题改成思想阐释。</li>\n<li>C：提醒买书者准备多找找，是实际购物建议；prevailing sentiment要求一种普遍情绪，原段未描述这种感受。</li>\n<li>D：两书共同点是出版商和受展示冲突影响的处境，未被用来归纳写作、题材或文学发展现象。</li>\n</ul>\n<h2>32题</h2>\n<blockquote>\n<p>Why did Waterstones shops retire PRH books to their relevant sections?</p>\n<p>水石书店为什么把企鹅兰登书屋的书撤回各自所属的分区？</p>\n</blockquote>\n<h3>题型</h3>\n<p>原因推断题：将信用限制作为问题起点，分清移书的去向、目的及指令来源。</p>\n<p>题干中的retire PRH books to their relevant sections在第2段末句直接出现，回到第2段完整阅读：先看问题从何时开始，再看分店经理接到的移书指示。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>it had introduced a credit limit with Waterstones “at a very significant level”</p>\n<p>remove PRH books from prominent areas such as tables, display spaces and windows</p>\n<p>PRH confirmed that it had introduced a credit limit with Waterstones</p>\n</blockquote>\n<h3>A. To make them easily noticeable.</h3>\n<blockquote>\n<p>Waterstones移书是为让书更易被注意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>书被移出prominent areas，即显眼桌台、展示区和橱窗，A却说为更易被注意，改变了展示方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Waterstones移书是为让书更易被注意。</p>\n</blockquote>\n<p><code>easily noticeable</code>涉及书如何被展示，第2段却写<code>remove PRH books</code>以及<code>display spaces and windows</code>；回看整段中信用限制的起因和从展示位置移书的做法。</p>\n<p>原文先说企鹅兰登书屋给水石书店设立了显著的信用额度限制，随后描述书店<code>remove PRH books</code>，把书从桌面、展示区和橱窗移走，撤回所属分区。选项将此事解释为让书<code>easily noticeable</code>，是把它写成提升图书显眼程度的安排。原文在信用限制引发的问题中叙述撤离展示位置，既没有把这种移动连接为增加展示，也没有给出让书更易受注意这一目的。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n<p>问题始于去年年底，PRH确认已对Waterstones设置相当显著的信用额度限制。行业杂志《书商》报道，分店经理被告知将PRH图书撤离桌台、展示区和橱窗等突出位置，悄悄放回各自分区。</p>\n</blockquote>\n<p>第二段以信用限制作为问题起点，再交代相关图书撤出突出位置，回归普通分区。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The shops moved the books to make them easily noticeable.</p>\n<p>Waterstones移书是为让书更易被注意。</p>\n</blockquote>\n<p>A需要提升可见度的安排。分区虽便于按类寻找，却不能抹去从显眼展示区撤走这一明确动作。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. To comply with PRH’s requirement.</h3>\n<blockquote>\n<p>Waterstones移书是为服从PRH的要求。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>PRH提出的是信用额度限制，移书指示是书店经理收到的另一动作，原文未说PRH要求改变展示。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The problem began late last year, when Penguin Random House confirmed that it had introduced a credit limit with Waterstones &quot;at a very significant level&quot;. The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Waterstones移书是为服从PRH的要求。</p>\n</blockquote>\n<p><code>comply with PRH’s requirement</code>把移书要求归给出版商；第2段分别写<code>PRH introduced a credit limit</code>和<code>branch managers were being told</code>，需要把这两个动作的主体与内容分开核对。</p>\n<p>原文说企鹅兰登书屋采取的措施是<code>introduced a credit limit</code>，即对水石书店设立信用额度限制；接着说水石书店的分店经理接到移书指示，没有把下达这条指示的人写成企鹅兰登书屋。选项<code>comply with PRH’s requirement</code>
