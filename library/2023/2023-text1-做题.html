<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 21题题干\n\n**In Paragraph 1, the weather in Texas is mentioned to ______.**\n\n> 第一段提到得克萨斯州的天气，是为了______。\n\n题型：**写作用意题**。","articleRects":[],"questionRects":[[226,190,982,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"21"},"html":"<h2>21题题干</h2>\n<p><strong>In Paragraph 1, the weather in Texas is mentioned to ______.</strong></p>\n<blockquote><p>第一段提到得克萨斯州的天气，是为了______。</p>\n</blockquote>\n<p>题型：<strong>写作用意题</strong>。</p>\n"},{"section":"先读题干","raw":"## 22题题干\n\n**What does Quinn think of Hardy?**\n\n> 奎因如何看待哈迪？\n\n题型：**人物观点题**。","articleRects":[],"questionRects":[[226,557,567,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"22"},"html":"<h2>22题题干</h2>\n<p><strong>What does Quinn think of Hardy?</strong></p>\n<blockquote><p>奎因如何看待哈迪？</p>\n</blockquote>\n<p>题型：<strong>人物观点题</strong>。</p>\n"},{"section":"先读题干","raw":"## 23题题干\n\n**The study mentioned in Paragraph 5 shows that ______.**\n\n> 第5段提到的研究表明______。\n\n题型：**研究结论题**。","articleRects":[],"questionRects":[[226,924,769,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"23"},"html":"<h2>23题题干</h2>\n<p><strong>The study mentioned in Paragraph 5 shows that ______.</strong></p>\n<blockquote><p>第5段提到的研究表明______。</p>\n</blockquote>\n<p>题型：<strong>研究结论题</strong>。</p>\n"},{"section":"先读题干","raw":"## 24题题干\n\n**According to Branch, state-level science standards in the US ______.**\n\n> 据布兰奇说，美国州级科学标准______。\n\n题型：**人物观点题**。","articleRects":[],"questionRects":[[226,1292,970,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"24"},"html":"<h2>24题题干</h2>\n<p><strong>According to Branch, state-level science standards in the US ______.</strong></p>\n<blockquote><p>据布兰奇说，美国州级科学标准______。</p>\n</blockquote>\n<p>题型：<strong>人物观点题</strong>。</p>\n"},{"section":"先读题干","raw":"## 25题题干\n\n**It is implied in the last paragraph that climate change teaching in some schools ______.**\n\n> 末段暗示，一些学校的气候变化教学______。\n\n题型：**段落推断题**。","articleRects":[],"questionRects":[[226,1659,1195,38],[286,1720,110,31]],"scrollTarget":"question","meta":{"kind":"stem","qid":"25"},"html":"<h2>25题题干</h2>\n<p><strong>It is implied in the last paragraph that climate change teaching in some schools ______.</strong></p>\n<blockquote><p>末段暗示，一些学校的气候变化教学______。</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but, Even if, while |\n| 态度词／评价词 | 先抓个大概好坏 | extreme, limited, biased |\n| 动作词 | 先看谁做了什么 | debate, taught, distributed |\n| 结果词 | 看最后出了什么事 | influence, demands, consensus |\n| 重复主题词 | 大概知道老在说什么 | climate change, schools, standards |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>but, Even if, while</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>extreme, limited, biased</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>debate, taught, distributed</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>influence, demands, consensus</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>climate change, schools, standards</td></tr></tbody></table>\n"},{"section":"读文章","raw":"The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.","articleRects":[[273,288,1123,38],[202,338,1194,37],[202,387,1154,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n</div></div>"},{"section":"读文章","raw":"The weather in Texas may have cooled since the recent extreme heat, / but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.","articleRects":[[273,288,1123,38],[202,338,1194,37],[202,387,1154,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>The weather in Texas may have cooled since the recent extreme heat, / but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n</div></div>"},{"section":"读文章","raw":"得克萨斯州的天气 可能已经转凉 since the recent extreme heat, / but the temperature will be high 在州教育委员会 meeting in Austin this month as officials debate how climate change is taught 在得州学校里.","articleRects":[[273,288,1123,3 奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，遇到这种情况，可再结合全文检查。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，遇到这种情况，可再结合全文检查。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"21题","raw":"## 21题\n\n> In Paragraph 1, the weather in Texas is mentioned to ______.  \n> 第一段提到得克萨斯州的天气，是为了______。\n\n题干直接给出Paragraph 1和the weather in Texas，回到第1段，从天气转凉读到教育委员会讨论学校里的气候变化教学。\n\n> 原文参考：\n> \n> The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.\n> \n> 开始精读：\n> \n> The weather in Texas may have cooled since the recent extreme heat, / but the temperature will be high at the State Board of Education meeting in Austin this month / as officials debate how climate change is taught in Texas schools.\n> \n> 得克萨斯州的天气在最近的酷热过后可能已经转凉， / 但这个月奥斯汀举行的州教育委员会会议上，温度会很高， / 因为官员们将争论得州学校如何教授气候变化。\n\n题目问提到天气的作用，需要看天气描写怎样转到本月奥斯汀的教育委员会会议，以及会议将讨论什么。\n\n接下来按A—D逐项看。","articleRects":[[273,288,1123,38],[202,338,1194,37],[202,387,1154,38]],"questionRects":[[226,190,982,38],[283,251,629,38],[283,312,668,38],[283,373,714,38],[283,435,742,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"21","initialReadingPids":[0]},"html":"<h2>21题</h2>\n<blockquote><p>In Paragraph 1, the weather in Texas is mentioned to ______.<br />\n第一段提到得克萨斯州的天气，是为了______。</p>\n</blockquote>\n<p>题干直接给出Paragraph 1和the weather in Texas，回到第1段，从天气转凉读到教育委员会讨论学校里的气候变化教学。</p>\n<blockquote><p>原文参考：</p>\n<p>The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n<p>开始精读：</p>\n<p>The weather in Texas may have cooled since the recent extreme heat, / but the temperature will be high at the State Board of Education meeting in Austin this month / as officials debate how climate change is taught in Texas schools.</p>\n<p>得克萨斯州的天气在最近的酷热过后可能已经转凉， / 但这个月奥斯汀举行的州教育委员会会议上，温度会很高， / 因为官员们将争论得州学校如何教授气候变化。</p>\n</blockquote>\n<p>题目问提到天气的作用，需要看天气描写怎样转到本月奥斯汀的教育委员会会议，以及会议将讨论什么。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"21题","raw":"### A. forecast a policy shift in Texas schools\n\n> 预示得州学校政策将发生转变\n\n把A接回题干，它说的是：第一段提到得州天气，是为了预示得州学校政策将发生转变。\n\nA说政策将转变，回第1段看but后面预告的是什么。\n\n> but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.\n\nbut后面说教育委员会开会时温度会很高，as又说明官员将争论怎样教气候变化。这里先预告了争论，没有给出投票或决定。\n\n争论可能带来改变，也可能维持原样，只凭会议将很热烈，还无法判断政策会怎样。\n\n**会发生激烈讨论，就一定已经预示政策转变吗？**\n\n不能确定。A越过正在争论这一步，先替会议写出了改变政策的结果。\n\n**第一轮判断：A排除。**","articleRects":[[273,288,1123,38],[202,338,1194,37],[202,387,1154,38]],"questionRects":[[283,251,629,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"21","paragraphPids":[0]},"html":"<h3>A. forecast a policy shift in Texas schools</h3>\n<blockquote><p>预示得州学校政策将发生转变</p>\n</blockquote>\n<p>把A接回题干，它说的是：第一段提到得州天气，是为了预示得州学校政策将发生转变。</p>\n<p>A说政策将转变，回第1段看but后面预告的是什么。</p>\n<blockquote><p>but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.</p>\n</blockquote>\n<p>but后面说教育委员会开会时温度会很高，as又说明官员将争论怎样教气候变化。这里先预告了争论，没有给出投票或决定。</p>\n<p>争论可能带来改变，也可能维持原样，只凭会议将很热烈，还无法判断政策会怎样。</p>\n<p><strong>会发生激烈讨论，就一定已经预示政策转变吗？</strong></p>\n<p>不能确定。A越过正在争论这一步，先替会议写出了改变政策的结果。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"21题","raw":"### B. stress the consequences of climate change\n\n> 强调气候变化的后果\n\n把B接回题干，它说的是：第一段提到得州天气，是为了强调气候变化的后果。\n\nB说气候变化后果，回第1段看天气降温后话题转向哪里。\n\n> The weather in Texas may have cooled since the recent extreme heat,\n\n> but the temperature will be high at the State Board of Education meeting in Austin this month\n\n开头提到现实中的极端高温，随后用but转到会议里的高温。句末具体说的是官员讨论学校怎样教授气候变化。\n\n如果要强调气候变化后果，后面应继续解释高温带来什么损失；现在却把“热”用到了会议气氛上。\n\n**天气之后，作者接着讲气候损失，还是接着讲争论？**\n\n讲争论。B抓住了开头天气，却没有接上它被引向的会议。\n\n**第一轮判断：B排除。**","articleRects":[[273,288,1123,38],[202,338,1194,37],[202,387,1154,38]],"questionRects":[[283,312,668,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"21","paragraphPids":[0]},"html":"<h3>B. stress the consequences of climate change</h3>\n<blockquote><p>强调气候变化的后果</p>\n</blockquote>\n<p>把B接回题干，它说的是：第一段提到得州天气，是为了强调气候变化的后果。</p>\n<p>B说气候变化后果，回第1段看天气降温后话题转向哪里。</p>\n<blockquote><p>The weather in Texas may have cooled since the recent extreme heat,</p>\n</blockquote>\n<blockquote><p>but the temperature will be high at the State Board of Education meeting in Austin this month</p>\n</blockquote>\n<p>开头提到现实中的极端高温，随后用but转到会议里的高温。句末具体说的是官员讨论学校怎样教授气候变化。</p>\n<p>如果要强调气候变化后果，后面应继续解释高温带来什么损失；现在却把“热”用到了会议气氛上。</p>\n<p><strong>天气之后，作者接着讲气候损失，还是接着讲争论？</strong></p>\n<p>讲争论。B抓住了开头天气，却没有接上它被引向的会议。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"21题","raw":"### C. indicate the atmosphere at the board meeting\n\n> 表明委员会会议上的气氛\n\n把C接回题干，它说的是：第一段提到得州天气，是为了表明委员会会议上的气氛。\n\nC说会议气氛，回第1段把may have cooled与will be high连着读。\n\n> but the temperature will be high at the State Board of Education meeting in ry views.\n\n> 她表达了自相矛盾的观点。\n\n把D接回题干，它说的是：奎因认为哈迪表达了自相矛盾的观点。\n\nD说自相矛盾，回第3段看dispute表达哪两方不同意。\n\n> Most scientists and experts sharply dispute Hardy’s views.\n\n> dismiss the career work of scholars and scientists as just another **[xxx]** opinion,\n\n大多数科学家和专家反对哈迪，是他人的看法与她冲突。奎因又指出她轻视研究成果。\n\n自相矛盾需要她自己的两种说法互相抵触，这里并没有列出这样的两句话。\n\n**别人不同意她，是否就说明她自己的观点前后矛盾？**\n\n不是。D把不同人之间的分歧改成了同一个人的自相矛盾。\n\n**第一轮判断：D排除。**","articleRects":[[273,683,1122,38],[203,731,1193,39],[202,780,1195,39],[202,831,1185,38]],"questionRects":[[283,802,625,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"22","paragraphPids":[2]},"html":"<h3>D. She expresses self-contradictory views.</h3>\n<blockquote><p>她表达了自相矛盾的观点。</p>\n</blockquote>\n<p>把D接回题干，它说的是：奎因认为哈迪表达了自相矛盾的观点。</p>\n<p>D说自相矛盾，回第3段看dispute表达哪两方不同意。</p>\n<blockquote><p>Most scientists and experts sharply dispute Hardy’s views.</p>\n</blockquote>\n<blockquote><p>dismiss the career work of scholars and scientists as just another <strong>[xxx]</strong> opinion,</p>\n</blockquote>\n<p>大多数科学家和专家反对哈迪，是他人的看法与她冲突。奎因又指出她轻视研究成果。</p>\n<p>自相矛盾需要她自己的两种说法互相抵触，这里并没有列出这样的两句话。</p>\n<p><strong>别人不同意她，是否就说明她自己的观点前后矛盾？</strong></p>\n<p>不是。D把不同人之间的分歧改成了同一个人的自相矛盾。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"22题","raw":"### 22题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n第一次读完四项，留下B。奎因批评哈迪这类委员否定学者和科学家毕生的工作，把它当作不过另一种意见。","articleRects":[],"questionRects":[[226,557,567,38],[283,618,567,38],[283,680,634,30],[283,741,584,37],[283,802,625,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"22"},"html":"<h3>22题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一次读完四项，留下B。奎因批评哈迪这类委员否定学者和科学家毕生的工作，把它当作不过另一种意见。</p>\n"},{"section":"23题","raw":"## 23题\n\n> The study mentioned in Paragraph 5 shows that ______.  \n> 第5段提到的研究表明______。\n\n题干明确指向Paragraph 5中的研究，完整阅读第5段，从研究考察什么读到各州得分以及得州教科书的影响。\n\n> 原文参考：\n> \n> A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country **[xxx]** climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most **[xxx]** states, including Texas, which was given the lowest grade (F) and has a **[xxx]** influence because its textbooks are widely sold elsewhere.\n> \n> 开始精读：\n> \n> A study last year by the National Center for Science Education, / a non-profit group of scientists and teachers, / looking at how state public schools across the country **[xxx]** climate change in science classes, / gave barely half of US states a grade B+ or higher. / Among the 10 worst performers were some of the most **[xxx]** states, / including Texas, / which was given the lowest grade (F) / and has a **[xxx]** influence because its textbooks are widely sold elsewhere.\n> \n> 去年，美国国家科学教育中心开展了一项研究， / 该中心是由科学家和教师组成的非营利团体， / 研究考察全国各州公立学校在科学课上如何**[xxx]**气候变化， / 勉强只有美国一半的州得到B+或更高的等级。 / 表现最差的10个州中有一些最**[xxx]**的州， / 包括得克萨斯州， / 它被评为最低等级（F）， / 而且具有**[xxx]**影响，因为它的教科书在其他地方广泛销售。\n\n空格要概括这项研究揭示的情况，需要核对获评B+或更高的州有多少、低分州怎样被描述，以及得州这一例子承担什么作用。\n\n接下来按A—D逐项看。","articleRects":[[274,1028,1122,38],[202,1078,1193,37],[202,1127,1192,38],[203,1176,1192,38],[202,1224,1187,39],[203,1275,1193,37],[202,1324,156,31]],"questionRects":[[226,924,769,38],[283,986,861,38],[283,1047,812,38],[283,1108,781,31],[283,1169,875,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"23","initialReadingPids":[4]},"html":"<h2>23题</h2>\n<blockquote><p>The study mentioned in Paragraph 5 shows that ______.<br />\n第5段提到的研究表明______。</p>\n</blockquote>\n<p>题干明确指向Paragraph 5中的研究，完整阅读第5段，从研究考察什么读到各州得分以及得州教科书的影响。</p>\n<blockquote><p>原文参考：</p>\n<p>A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country <strong>[xxx]</strong> climate change in science classes, gave barely half of US states a grade B+ or higher. Among the 10 worst performers were some of the most <strong>[xxx]</strong> states, including Texas, which was given the lowest grade (F) and has a <strong>[xxx]</strong> influence because its textbooks are widely sold elsewhere.</p>\n<p>开始精读：</p>\n<p>A study last year by the National Center for Science Education, / a non-profit group of scientists and teachers, / looking at how state public schools across the country <strong>[xxx]</strong> climate change in science classes, / gave barely half of US states a grade B+ or higher. / Among the 10 worst performers were some of the most <strong>[xxx]</strong> states, / including Texas, / which was given the lowest grade (F) / and has a <strong>[xxx]</strong> influence because its textbooks are widely sold elsewhere.</p>\n<p>去年，美国国家科学教育中心开展了一项研究， / 该中心是由科学家和教师组成的非营利团体， / 研究考察全国各州公立学校在科学课上如何<strong>[xxx]</strong>气候变化， / 勉强只有美国一半的州得到B+或更高的等级。 / 表现最差的10个州中有一些最<strong>[xxx]</strong>的州， / 包括得克萨斯州， / 它被评为最低等级（F）， / 而且具有<strong>[xxx]</strong>影响，因为它的教科书在其他地方广泛销售。</p>\n</blockquote>\n<p>空格要概括这项研究揭示的情况，需要核对获评B+或更高的州有多少、低分州怎样被描述，以及得州这一例子承担什么作用。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"23题","raw":"### A. climate education is insufficient at state public schools\n\n> 州公立学校的气候教育不够充分\n\n把A接回题干，它说的是：第5段的研究表明，州公立学校的气候教育不够充分。\n\nA说气候教育不足，回第5段看全国研究的评分。\n\n> looking at how state public schools across the country **[xxx]** climate change in science classes,\n\n> gave barely half of US states a grade B+ or higher.\n\n> including Texas, which was given the lowest grade (F)\n\n只有勉强一半的州达到B+或更高，最差的一组中还有得州这样的州，得州甚至拿到F。不是只有一个孤立学校得分低。\n\n这些评分针对州公立学校的气候变化教学，整体结果确实留下不少需要补足的地方。\n\n**勉强一半的州达到B+，还有多个低分州，是否说明这项教育仍不够充分？**\n\n是。A概括的是研究实际评估出来的教学情况，可以保留。\n\n**第一轮判断：A保留。**","articleRects":[[274,1028,1122,38],[202,1078,1193,37],[202,1127,1192,38],[203,1176,1192,38],[202,1224,1187,39],[203,1275,1193,37],[202,1324,156,31]],"questionRects":[[283,986,861,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"23","paragraphPids":[4]},"html":"<h3>A. climate education is insufficient at state public schools</h3>\n<blockquote><p>州公立学校的气候教育不够充分</p>\n</blockquote>\n<p>把A接回题干，它说的是：第5段的研究表明，州公立学校的气候教育不够充分。</p>\n<p>A说气候教育不足，回第5段看全国研究的评分。</p>\n<blockquote><p>looking at how state public schools across the country <strong>[xxx]</strong> climate change in science classes,</p>\n</blockquote>\n<blockquote><p>gave barely half of US states a grade B+ or higher.</p>\n</blockquote>\n<blockquote><p>including Texas, which was given the lowest grade (F)</p>\n</blockquote>\n<p>只有勉强一半的州达到B+或更高，最差的一组中还有得州这样的州，得州甚至拿到F。不是只有一个孤立学校得分低。</p>\n<p>这些评分针对州公立学校的气候变化教学，整体结果确实留下不少需要补足的地方。</p>\n<p><strong>勉强一半的州达到B+，还有多个低分州，是否说明这项教育仍不够充分？</strong></p>\n<p>是。A概括的是研究实际评估出来的教学情况，可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"23题","raw":"### B. policymakers have little drive for science education\n\n> 政策制定者缺乏推动科学教育的动力\n\n把B接回题干，它说的是：第5段的研究表明，政策制定者缺乏推动科学教育的动力。\n\nB说政策制定者没动力，回第5段看研究评估对象，再看前一段的demands。\n\n> 原文参考：\n> \n> Such debates reflect **[xxx]** discussions across the US, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\n> \n> 开始精读：\n> \n> Such debates reflect **[xxx]** discussions across the US, / as researchers, policymakers, teachers and students step up demands / for a greater focus on teaching about the facts of climate change in schools.\n> \n> 这样的争论反映了全美范围内的**[xxx]**讨论， / 因为研究人员、政策制定者、教师和学生正加大呼吁力度， / 要求更重视在学校教授有关气候变化的事实。\n\n> gave barely half of US states a grade B+ or higher.\n\n> policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.\n\n研究评估的是学校怎样教授气候变化，不是调查政策制定者愿不愿推动科学教育。成绩不好，不能直接确定是动力不足造成的。\n\n前一段还把policymakers列在要求加强气候事实教学的人当中，与“缺乏推动动力”并不相合。\n\n**学校得分不高，就足以把原因定成政策制定者没动力吗？**\n\n不足以。B把教学结果换成了人员动机，也没有接住前段的积极诉求。\n\n**第一轮判断：B排除。**","articleRects":[[274,880,1116,37],[202,930,1194,37],[202,979,800,38],[274,1028,1122,38],[202,1078,1193,37],[202,1127,1192,38],[203,1176,1192,38],[202,1224,1187,39],[203,1275,1193,37],[202,1324,156,31]],"questionRects":[[283,1047,812,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"23","initialReadingPids":[3],"paragraphPids":[3,4]},"html":"<h3>B. policymakers have little drive for science education</h3>\n<blockquote><p>政策制定者缺乏推动科学教育的动力</p>\n</blockquote>\n<p>把B接回题干，它说的是：第5段的研究表明，政策制定者缺乏推动科学教育的动力。</p>\n<p>B说政策制定者没动力，回第5段看研究评估对象，再看前一段的demands。</p>\n<blockquote><p>原文参考：</p>\n<p>Such debates reflect <strong>[xxx]</strong> discussions across the US, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.</p>\n<p>开始精读：</p>\n<p>Such debates reflect <strong>[xxx]</strong> discussions across the US, / as researchers, policymakers, teachers and students step up demands / for a greater focus on teaching about the facts of climate change in schools.</p>\n<p>这样的争论反映了全美范围内的<strong>[xxx]</strong>讨论， / 因为研究人员、政策制定者、教师和学生正加大呼吁力度， / 要求更重视在学校教授有关气候变化的事实。</p>\n</blockquote>\n<blockquote><p>gave barely half of US states a grade B+ or higher.</p>\n</blockquote>\n<blockquote><p>policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.</p>\n</blockquote>\n<p>研究评估的是学校怎样教授气候变化，不是调查政策制定者愿不愿推动科学教育。成绩不好，不能直接确定是动力不足造成的。</p>\n<p>前一段还把policymakers列在要求加强气候事实教学的人当中，与“缺乏推动动力”并不相合。</p>\n<p><strong>学校得分不高，就足以把原因定成政策制定者没动力吗？</strong></p>\n<p>不足以。B把教学结果换成了人员动机，也没有接住前段的积极诉求。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"23题","raw":"### C. Texas is reluctant to rewrite its science textbooks\n\n> 得州不愿重写它的科学教科书\n\n把C接回题干，它说的是：第5段的研究表明，得州不愿重写它的科学教科书。\n\nC说得州不愿重写课本，回第5段找textbooks的完整说明。\n\n> including Texas, which was given the lowest grade (F) and has a **[xxx]** influence because its textbooks are widely sold elsewhere.\n\n原文说得州教科书在别处广泛销售，所以它的影响会传到其他地方。这是在解释一个低分州为什么还值得特别注意。\n\n句子没有写得州收到重写要求，也没有写它拒绝修改。得分差和发行广，都不能证明不愿重写。\n\n**textbooks这一句是在介绍修改意愿，还是说明影响为什么会扩大？**\n\n是说明影响扩大。C加出了拒绝修改的态度。\n\n**第一轮判断：C排除。**","articleRects":[[274,1028,1122,38],[202,1078,1193,37],[202,1127,1192,38],[203,1176,1192,38],[202,1224,1187,39],[203,1275,1193,37],[202,1324,156,31]],"questionRects":[[283,1108,781,31]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"23","paragraphPids":[4]},"html":"<h3>C. Texas is reluctant to rewrite its science textbooks</h3>\n<blockquote><p>得州不愿重写它的科学教科书</p>\n</blockquote>\n<p>把C接回题干，它说的是：第5段的研究表明，得州不愿重写它的科学教科书。</p>\n<p>C说得州不愿重写课本，回第5段找textbooks的完整说明。</p>\n<blockquote><p>including Texas, which was given the lowest grade (F) and has a <strong>[xxx]</strong> influence because its textbooks are widely sold elsewhere.</p>\n</blockquote>\n<p>原文说得州教科书在别处广泛销售，所以它的影响会传到其他地方。这是在解释一个低分州为什么还值得特别注意。</p>\n<p>句子没有写得州收到重写要求，也没有写它拒绝修改。得分差和发行广，都不能证明不愿重写。</p>\n<p><strong>textbooks这一句是在介绍修改意愿，还是说明影响为什么会扩大？</strong></p>\n<p>是说明影响扩大。C加出了拒绝修改的态度。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"23题","raw":"### D. environmental teaching in some states lacks supervision\n\n> 一些州的环境教学缺少监督\n\n把D接回题干，它说的是：第5段的研究表明，一些州的环境教学缺少监督。\n\nD说缺少监督，回第5段看研究有没有调查谁来监管。\n\n> gave barely half of US states a grade B+ or higher.\n\n> Among the 10 worst performers were some of the most **[xxx]** states,\n\n文章给出评分、低分州以及得州课本传播的影响。这里看得到教学表现，却没有交代监督频率、监管人员或监管是否缺位。\n\n低分可能由不同原因造成，不能看到低分就直接把原因补成缺乏监督。\n\n**这项研究报告了监督缺失，还是只报告了教学评分？**\n\n这段报告的是评分。D把一个未经交代的原因当成研究结论。\n\n**第一轮判断：D排除。**","articleRects":[[274,1028,1122,38],[202,1078,1193,37],[202,1127,1192,38],[203,1176,1192,38],[202,1224,1187,39],[203,1275,1193,37],[202,1324,156,31]],"questionRects":[[283,1169,875,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"23","paragraphPids":[4]},"html":"<h3>D. environmental teaching in some states lacks supervision</h3>\n<blockquote><p>一些州的环境教学缺少监督</p>\n</blockquote>\n<p>把D接回题干，它说的是：第5段的研究表明，一些州的环境教学缺少监督。</p>\n<p>D说缺少监督，回第5段看研究有没有调查谁来监管。</p>\n<blockquote><p>gave barely half of US states a grade B+ or higher.</p>\n</blockquote>\n<blockquote><p>Among the 10 worst performers were some of the most <strong>[xxx]</strong> states,</p>\n</blockquote>\n<p>文章给出评分、低分州以及得州课本传播的影响。这里看得到教学表现，却没有交代监督频率、监管人员或监管是否缺位。</p>\n<p>低分可能由不同原因造成，不能看到低分就直接把原因补成缺乏监督。</p>\n<p><strong>这项研究报告了监督缺失，还是只报告了教学评分？</strong></p>\n<p>这段报告的是评分。D把一个未经交代的原因当成研究结论。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"23题","raw":"### 23题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一次读完四项，留下A。研究显示勉强一半的州达到B+或以上，气候教育的不足可以由这些评分概括。","articleRects":[],"questionRects":[[226,924,769,38],[283,986,861,38],[283,1047,812,38],[283,1108,781,31],[283,1169,875,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"23"},"html":"<h3>23题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一次读完四项，留下A。研究显示勉强一半的州达到B+或以上，气候教育的不足可以由这些评分概括。</p>\n"},{"section":"24题","raw":"## 24题\n\n> According to Branch, state-level science standards in the US ______.  \n> 据布兰奇说，美国州级科学标准______。\n\n题干点名Branch和state-level science standards，两者在第6段同时出现。完整阅读这一段，核对州级标准与地方决策、实际教学之间的关系。\n\n> 原文参考：\n> \n> Glenn Branch, the centre’s **[xxx]** director, **[xxx]** that setting state-level science standards is only one limited **[xxx]** in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, “that does not mean it will be taught” , he says.\n> \n> 开始精读：\n> \n> Glenn Branch, the centre’s **[xxx]** director, / **[xxx]** that setting state-level science standards is only one limited **[xxx]** / in a country that decentralises decisions to local school boards. / Even if a state is considered a high performer in its science standards, / “that does not mean it will be taught” , he says.\n> \n> 该中心的**[xxx]**主任格伦·布兰奇， / **[xxx]**，制定州级科学标准只是一个有限的**[xxx]**， / 在这个把决策权下放给地方学校董事会的国家中。 / 即便某个州的科学标准被认为表现优秀， / “那也不意味着它就会被教授”，他说。\n\n空格接在“州级科学标准”后，需要说明布兰奇怎样看待制定标准的作用，以及标准被评为优秀能否保证实际教学。\n\n接下来按A—D逐项看。","articleRects":[[274,1373,1121,38],[203,1423,1192,38],[202,1472,1195,38],[202,1520,1101,39],[1157,1543,12,15]],"questionRects":[[226,1292,970,38],[283,1353,399,38],[283,1414,425,38],[283,1475,379,31],[283,1537,337,30]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"24","initialReadingPids":[5]},"html":"<h2>24题</h2>\n<blockquote><p>According to Branch, state-level science standards in the US ______.<br />\n据布兰奇说，美国州级科学标准______。</p>\n</blockquote>\n<p>题干点名Branch和state-level science standards，两者在第6段同时出现。完整阅读这一段，核对州级标准与地方决策、实际教学之间的关系。</p>\n<blockquote><p>原文参考：</p>\n<p>Glenn Branch, the centre’s <strong>[xxx]</strong> director, <strong>[xxx]</strong> that setting state-level science standards is only one limited <strong>[xxx]</strong> in a country that decentralises decisions to local school boards. Even if a state is considered a high performer in its science standards, “that does not mean it will be taught” , he says.</p>\n<p>开始精读：</p>\n<p>Glenn Branch, the centre’s <strong>[xxx]</strong> director, / <strong>[xxx]</strong> that setting state-level science standards is only one limited <strong>[xxx]</strong> / in a country that decentralises decisions to local school boards. / Even if a state is considered a high performer in its science standards, / “that does not mean it will be taught” , he says.</p>\n<p>该中心的<strong>[xxx]</strong>主任格伦·布兰奇， / <strong>[xxx]</strong>，制定州级科学标准只是一个有限的<strong>[xxx]</strong>， / 在这个把决策权下放给地方学校董事会的国家中。 / 即便某个州的科学标准被认为表现优秀， / “那也不意味着它就会被教授”，他说。</p>\n</blockquote>\n<p>空格接在“州级科学标准”后，需要说明布兰奇怎样看待制定标准的作用，以及标准被评为优秀能否保证实际教学。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"24题","raw":"### A. call for regular revision\n\n> 需要定期修订\n\n把A接回题干，它说的是：据布兰奇说，美国州级科学标准需要定期修订。\n\nA说定期修订，回第6段看Branch指出标准的哪一种限制。\n\n> in a country that decentralises decisions to local school boards.\n\n> Even if a state is considered a high performer in its science standards, “that does not mean it will be taught” , he says.\n\n他的解释是决定分散在地方学校委员会，州标准即使评价很高，也不意味着一定会教。问题在标准能否落到课堂。\n\n这里没有说标准年代太旧，也没有提出多久修订一次。修订与是否落实是两件不同的事。\n\n**Branch指出的是标准更新太慢吗？**\n\n不是。他指出州标准对地方教学的作用有限，A另加了定期修订的要求。\n\n**第一轮判断：A排除。**","articleRects":[[274,1373,1121,38],[203,1423,1192,38],[202,1472,1195,38],[202,1520,1101,39],[1157,1543,12,15]],"questionRects":[[283,1353,399,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"24","paragraphPids":[5]},"html":"<h3>A. call for regular revision</h3>\n<blockquote><p>需要定期修订</p>\n</blockquote>\n<p>把A接回题干，它说的是：据布兰奇说，美国州级科学标准需要定期修订。</p>\n<p>A说定期修订，回第6段看Branch指出标准的哪一种限制。</p>\n<blockquote><p>in a country that decentralises decisions to local school boards.</p>\n</blockquote>\n<blockquote><p>Even if a state is considered a high performer in its science standards, “that does not mean it will be taught” , he says.</p>\n</blockquote>\n<p>他的解释是决定分散在地方学校委员会，州标准即使评价很高，也不意味着一定会教。问题在标准能否落到课堂。</p>\n<p>这里没有说标准年代太旧，也没有提出多久修订一次。修订与是否落实是两件不同的事。</p>\n<p><strong>Branch指出的是标准更新太慢吗？</strong></p>\n<p>不是。他指出州标准对地方教学的作用有限，A另加了定期修订的要求。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"24题","raw":"### B. require urgent application\n\n> 需要紧急落实\n\n把B接回题干，它说的是：据布兰奇说，美国州级科学标准需要紧急落实。\n\nB说需要紧急落实，回第6段看does not mean it will be taught。\n\n> setting state-level science standards is only one limited **[xxx]** in a country that decentralises decisions to local school boards.\n\n> Even if a state is considered a high performer in its science standards, “that does not mean it will be taught” , he says.\n\n这句话提醒我们：标准好，不能保证课堂一定教。它是对标准与实际教学之间关系的说明。\n\nBranch没有在这里提出时间要求，也没有用立刻、赶快等意思催促执行。我们可以由问题想到该落实，但不能把自己的建议当成他说出的紧急要求。\n\n**没有落实保证，是否就等于Branch要求紧急落实？**\n\n不是同一句意思。B把对现实限制的说明改成了一项带紧迫性的建议。\n\n**第一轮判断：B排除。**","articleRects":[[274,1373,1121,38],[203,1423,1192,38],[202,1472,1195,38],[202,1520,1101,39],[1157,1543,12,15]],"questionRects":[[283,1414,425,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"24","paragraphPids":[5]},"html":"<h3>B. require urgent application</h3>\n<blockquote><p>需要紧急落实</p>\n</blockquote>\n<p>把B接回题干，它说的是：据布兰奇说，美国州级科学标准需要紧急落实。</p>\n<p>B说需要紧急落实，回第6段看does not mean it will be taught。</p>\n<blockquote><p>setting state-level science standards is only one limited <strong>[xxx]</strong> in a country that decentralises decisions to local school boards.</p>\n</blockquote>\n<blockquote><p>Even if a state is considered a high performer in its science standards, “that does not mean it will be taught” , he says.</p>\n</blockquote>\n<p>这句话提醒我们：标准好，不能保证课堂一定教。它是对标准与实际教学之间关系的说明。</p>\n<p>Branch没有在这里提出时间要求，也没有用立刻、赶快等意思催促执行。我们可以由问题想到该落实，但不能把自己的建议当成他说出的紧急要求。</p>\n<p><strong>没有落实保证，是否就等于Branch要求紧急落实？</strong></p>\n<p>不是同一句意思。B把对现实限制的说明改成了一项带紧迫性的建议。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"24题","raw":"### C. have limited influence\n\n> 影响有限\n\n把C接回题干，它说的是：据布兰奇说，美国州级科学标准影响有限。\n\nC说影响有限，回第6段找limited和地方学校委员会。\n\n> setting state-level science standards is only one limited **[xxx]** in a country that decentralises decisions to local school boards.\n\n> “that does not mean it will be taught”\n\n州级标准只是一项有限的办法，因为具体决定分散到地方。就算某州标准表现很好，Branch仍说不代表它会被教出来。\n\n这样一来，标准不能单独决定学生实际学到什么，作用自然受到限制。\n\n**好的州标准能不能保证相应内容进入课堂？**\n\n不能。C的limited influence与两处说明都相合，可以保留。\n\n**第一轮判断：C保留。**","articleRects":[[274,1373,1121,38],[203,1423,1192,38],[202,1472,1195,38],[202,1520,1101,39],[1157,1543,12,15]],"questionRects":[[283,1475,379,31]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"24","paragraphPids":[5]},"html":"<h3>C. have limited influence</h3>\n<blockquote><p>影响有限</p>\n</blockquote>\n<p>把C接回题干，它说的是：据布兰奇说，美国州级科学标准影响有限。</p>\n<p>C说影响有限，回第6段找limited和地方学校委员会。</p>\n<blockquote><p>setting state-level science standards is only one limited <strong>[xxx]</strong> in a country that decentralises decisions to local school boards.</p>\n</blockquote>\n<blockquote><p>“that does not mean it will be taught”</p>\n</blockquote>\n<p>州级标准只是一项有限的办法，因为具体决定分散到地方。就算某州标准表现很好，Branch仍说不代表它会被教出来。</p>\n<p>这样一来，标准不能单独决定学生实际学到什么，作用自然受到限制。</p>\n<p><strong>好的州标准能不能保证相应内容进入课堂？</strong></p>\n<p>不能。C的limited influence与两处说明都相合，可以保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"24题","raw":"### D. cater to local needs\n\n> 迎合地方需求\n\n把D接回题干，它说的是：据布兰奇说，美国州级科学标准迎合地方需求。\n\nD说迎合地方需求，回第6段看local school boards承担什么。\n\n> in a country that decentralises decisions to local school boards.\n\n> “that does not mean it will be taught”\n\n地方学校委员会在这里是作出教学决定的人。正因为权力分散，州级标准未必能够决定具体教什么。\n\n有地方决策权不等于州标准已按地方需要制定，原文没有介绍标准制定时调查或回应了哪些需求。\n\n**地方有决定权，是否就证明州标准满足地方需求？**\n\n不能。D把权力所在改成了标准内容所满足的对象。\n\n**第一轮判断：D排除。**","articleRects":[[274,1373,1121,38],[203,1423,1192,38],[202,1472,1195,38],[202,1520,1101,39],[1157,1543,12,15]],"questionRects":[[283,1537,337,30]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"24","paragraphPids":[5]},"html":"<h3>D. cater to local needs</h3>\n<blockquote><p>迎合地方需求</p>\n</blockquote>\n<p>把D接回题干，它说的是：据布兰奇说，美国州级科学标准迎合地方需求。</p>\n<p>D说迎合地方需求，回第6段看local school boards承担什么。</p>\n<blockquote><p>in a country that decentralises decisions to local school boards.</p>\n</blockquote>\n<blockquote><p>“that does not mean it will be taught”</p>\n</blockquote>\n<p>地方学校委员会在这里是作出教学决定的人。正因为权力分散，州级标准未必能够决定具体教什么。</p>\n<p>有地方决策权不等于州标准已按地方需要制定，原文没有介绍标准制定时调查或回应了哪些需求。</p>\n<p><strong>地方有决定权，是否就证明州标准满足地方需求？</strong></p>\n<p>不能。D把权力所在改成了标准内容所满足的对象。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"24题","raw":"### 24题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一次读完四项，留下C。地方学校董事会掌握决策权，州级科学标准优秀也不能保证实际教授，说明其影响有限。","articleRects":[],"questionRects":[[226,1292,970,38],[283,1353,399,38],[283,1414,425,38],[283,1475,379,31],[283,1537,337,30]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"24"},"html":"<h3>24题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一次读完四项，留下C。地方学校董事会掌握决策权，州级科学标准优秀也不能保证实际教授，说明其影响有限。</p>\n"},{"section":"25题","raw":"## 25题\n\n> It is implied in the last paragraph that climate change teaching in some schools ______.  \n> 末段暗示，一些学校的气候变化教学______。\n\n题干明确给出the last paragraph，完整阅读第8段，先看官方指南和教科书，再读发给教师的非官方材料及其资助者。\n\n> 原文参考：\n> \n> Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more biased perspectives are being distributed to teachers. They include materials sponsored by energy industry associations.\n> \n> 开始精读：\n> \n> Branch points out that, / even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, / unofficial educational materials that convey more biased perspectives are being distributed to teachers. / They include materials sponsored by energy industry associations.\n> \n> 布兰奇指出， / 即使越来越多的官方指导文件和教科书反映了气候变化方面的科学共识， / 传达更多带有偏见观点的非官方教学材料仍在被发给教师。 / 这些材料包括由能源行业协会资助的材料。\n\n题目要从这两类教学材料同时存在的情况，推断一些学校的气候变化教学可能受到什么影响。需要区分材料传达的观点、材料接受者和资助者之间的关系。\n\n接下来按A—D逐项看。","articleRects":[[274,1817,1122,38],[202,1867,1193,38],[202,1916,1183,38],[202,1965,980,38]],"questionRects":[[226,1659,1195,38],[286,1720,110,31],[285,1782,520,37],[285,1843,532,38],[285,1904,571,38],[285,1965,542,38],[581,2092,482,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[7],"qid":"25","initialReadingPids":[7]},"html":"<h2>25题</h2>\n<blockquote><p>It is implied in the last paragraph that climate change teaching in some schools ______.<br />\n末段暗示，一些学校的气候变化教学______。</p>\n</blockquote>\n<p>题干明确给出the last paragraph，完整阅读第8段，先看官方指南和教科书，再读发给教师的非官方材料及其资助者。</p>\n<blockquote><p>原文参考：</p>\n<p>Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more biased perspectives are being distributed to teachers. They include materials sponsored by energy industry associations.</p>\n<p>开始精读：</p>\n<p>Branch points out that, / even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, / unofficial educational materials that convey more biased perspectives are being distributed to teachers. / They include materials sponsored by energy industry associations.</p>\n<p>布兰奇指出， / 即使越来越多的官方指导文件和教科书反映了气候变化方面的科学共识， / 传达更多带有偏见观点的非官方教学材料仍在被发给教师。 / 这些材料包括由能源行业协会资助的材料。</p>\n</blockquote>\n<p>题目要从这两类教学材料同时存在的情况，推断一些学校的气候变化教学可能受到什么影响。需要区分材料传达的观点、材料接受者和资助者之间的关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"25题","raw":"### A. agrees to major public demands\n\n> 符合公众的主要诉求\n\n把A接回题干，它说的是：末段暗示，一些学校的气候变化教学符合公众的主要诉求。\n\nA说符合公众主要诉求，回末段看有偏材料，再与前面的事实教学诉求比较。\n\n> even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change,\n\n> unofficial educational materials that convey more biased perspectives are being distributed to teachers.\n\n> step up demands for a greater focus on teaching about the facts of climate change in schools.\n\n前面有人要求加强气候变化事实教学。末段虽然先承认官方指导和教材越来越反映科学共识，却又提出有偏向的非官方材料正在发给老师。\n\n题干问末段暗示的问题，要把even if后面这个转折看完，不能停在官方教材改善。\n\n**偏离科学共识的材料进入教学，能直接概括成符合公众诉求吗？**\n\n不能。A没有接住末段提醒的有偏材料问题。\n\n**第一轮判断：A排除。**","articleRects":[[274,880,1116,37],[202,930,1194,37],[202,979,800,38],[274,1817,1122,38],[202,1867,1193,38],[202,1916,1183,38],[202,1965,980,38]],"questionRects":[[285,1782,520,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"25","paragraphPids":[3,7]},"html":"<h3>A. agrees to major public demands</h3>\n<blockquote><p>符合公众的主要诉求</p>\n</blockquote>\n<p>把A接回题干，它说的是：末段暗示，一些学校的气候变化教学符合公众的主要诉求。</p>\n<p>A说符合公众主要诉求，回末段看有偏材料，再与前面的事实教学诉求比较。</p>\n<blockquote><p>even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change,</p>\n</blockquote>\n<blockquote><p>unofficial educational materials that convey more biased perspectives are being distributed to teachers.</p>\n</blockquote>\n<blockquote><p>step up demands for a greater focus on teaching about the facts of climate change in schools.</p>\n</blockquote>\n<p>前面有人要求加强气候变化事实教学。末段虽然先承认官方指导和教材越来越反映科学共识，却又提出有偏向的非官方材料正在发给老师。</p>\n<p>题干问末段暗示的问题，要把even if后面这个转折看完，不能停在官方教材改善。</p>\n<p><strong>偏离科学共识的材料进入教学，能直接概括成符合公众诉求吗？</strong></p>\n<p>不能。A没有接住末段提醒的有偏材料问题。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"25题","raw":"### B. reflects teachers’ personal biases\n\n> 反映教师个人的偏见\n\n把B接回题干，它说的是：末段暗示，一些学校的气候变化教学反映教师个人的偏见。\n\nB说教师个人偏见，回末段看材料怎样到老师手里。\n\n> unofficial educational materials that convey more biased perspectives are being distributed to teachers.\n\n> materials sponsored by energy industry associations.\n\n非官方材料带着更偏颇的观点，被分发给教师，其中包括能源行业协会赞助的材料。老师是材料的接收者。\n\n有偏见的是材料所传递的观点，来源之一是外部协会。文中没有说这些看法原本就是老师个人持有的。\n\n**材料发给老师，是否就能把材料里的偏见说成老师个人的偏见？**\n\n不能。B把外部材料的来源换成了教师本人。\n\n**第一轮判断：B排除。**","articleRects":[[274,1817,1122,38],[202,1867,1193,38],[202,1916,1183,38],[202,1965,980,38]],"questionRects":[[285,1843,532,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"25","paragraphPids":[7]},"html":"<h3>B. reflects teachers’ personal biases</h3>\n<blockquote><p>反映教师个人的偏见</p>\n</blockquote>\n<p>把B接回题干，它说的是：末段暗示，一些学校的气候变化教学反映教师个人的偏见。</p>\n<p>B说教师个人偏见，回末段看材料怎样到老师手里。</p>\n<blockquote><p>unofficial educational materials that convey more biased perspectives are being distributed to teachers.</p>\n</blockquote>\n<blockquote><p>materials sponsored by energy industry associations.</p>\n</blockquote>\n<p>非官方材料带着更偏颇的观点，被分发给教师，其中包括能源行业协会赞助的材料。老师是材料的接收者。</p>\n<p>有偏见的是材料所传递的观点，来源之一是外部协会。文中没有说这些看法原本就是老师个人持有的。</p>\n<p><strong>材料发给老师，是否就能把材料里的偏见说成老师个人的偏见？</strong></p>\n<p>不能。B把外部材料的来源换成了教师本人。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"25题","raw":"### C. may misrepresent the energy sector\n\n> 可能歪曲能源行业\n\n把C接回题干，它说的是：末段暗示，一些学校的气候变化教学可能歪曲能源行业。\n\nC说歪曲能源行业，回末段看energy industry associations是赞助者还是被描写对象。\n\n> unofficial educational materials that convey more biased perspectives are being distributed to teachers.\n\n> They include materials sponsored by energy industry ]**。","articleRects":[[274,1571,1121,38],[203,1620,1193,38],[202,1669,1194,38],[203,1719,1193,37],[202,1768,461,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_reading","readingPids":[7],"role":"whole_text_precision","paragraphPids":[6]},"html":"<h3>把还没细读的段落接上</h3>\n<blockquote><p>原文参考：</p>\n<p>Another issue is that, while climate change is well integrated into some subjects and at some ages—such as earth and space sciences in high schools—it is not as well represented in <strong>[xxx]</strong> for younger children and in subjects that are more widely taught, such as biology and chemistry. It is also less <strong>[xxx]</strong> in many social studies courses.</p>\n<p>开始精读：</p>\n<p>Another issue is that, / while climate change is well integrated into some subjects and at some ages—such as earth and space sciences in high schools—it is not as well represented / in <strong>[xxx]</strong> for younger children / and in subjects that are more widely taught, such as biology and chemistry. / It is also less <strong>[xxx]</strong> in many social studies courses.</p>\n<p>另一个问题是， / 虽然气候变化很好地融入了某些学科和某些年龄段的教学，例如高中的地球和空间科学，但它在以下方面体现得并不那么好： / 面向年幼儿童的<strong>[xxx]</strong>， / 以及教学范围更广的学科，例如生物学和化学。 / 在许多社会研究课程中，它也更少<strong>[xxx]</strong>。</p>\n</blockquote>\n"},{"section":"全文梳理","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | the temperature will be high；officials debate | 用“the temperature will be high”把天气转凉转成教育委员会会议的热度，随后以“officials debate”点明官员将争论气候变化怎样在得州学校中教授，为下文的具体分歧开场。 | 以得州会议引入气候变化应如何进入学校教学的争论。 |\n| 第2段 | is resisting proposed changes；Texas is an energy state | 写哈迪“is resisting proposed changes”，抵制面向未满十三岁学生的科学标准变动。她声称反对气候变化恐慌与推动恐慌的科学家数量相当，又强调“Texas is an energy state”，呈现这场教学争论中的一方说法。 | 呈现反对调整教学标准的一方观点。 |\n| 第3段 | sharply dispute Hardy’s views；dismiss the career work | 的“sharply dispute Hardy’s views”紧接着给出科学家和专家的反驳。奎因批评像哈迪这样的委员“dismiss the career work”，把学者和科学家毕生的工作当作不过另一种**[xxx]**意见，由此说明争论也涉及科研工作的价值如何被对待。 | 给出科学家与专家的反驳，显示争论涉及科研工作如何被评价。 |\n| 第4段 | discussions across the US；step up demands | 把得州争论放入“discussions across the US”，并用“step up demands”写出研究人员、政策制定者、教师和学生正在加大要求学校重视气候变化事实教学的呼声。文章从一个州的对立转向全国的教育需求。 | 从得州扩大到全国重视气候变化事实教学的诉求。 |\n| 第5段 | barely half of US states；textbooks are widely sold elsewhere | 以研究评分检验这种教育的情况：“barely half of US states”得到B+或以上，得州则获最低等级F。它的“textbooks are widely sold elsewhere”解释了为何得州教材还会影响其他地方。这一段让前面的教学需求有了全国评分和得州个案的依据。 | 用评分说明现有不足，并解释得州教材具有更广影响。 |\n| 第6段 | local school boards；does not mean it will be taught | 指出决策权下放到“local school boards”，并强调标准优秀“does not mean it will be taught”。文章由标准评分转入课堂落实：州级科学标准表现好，也不保证地方会实际教授相应内容。 | 由州级标准转向地方落实，指出标准好不等于实际会教。 |\n| 第7段 | Another issue；earth and space sciences | 以“Another issue”继续指出分布不均。气候变化在高中“earth and space sciences”等教学中融入较好，却在面向更年幼儿童的**[xxx]**以及生物、化学这类更广泛教授的学科中体现较弱。这一段将教学不足展开到年龄与学科差异。 | 继续展开教学覆盖的不均，补充年龄与学科上的差异。 |\n| 第8段 | reflect scientific consensus；more biased perspectives | 先承认更多官方材料“reflect scientific consensus”，再转到“more biased perspectives”：带有更多偏见的非官方材料仍被发给教师，其中有行业协会资助的材料。它把前面的落实与覆盖问题推进到教学材料的内容和外部资助，显示官方标准或教材改善之后仍存在其他影响教学的渠道。 | 承认官方材料的进步，同时指出带偏见的外部材料仍可能进入教学。 |\n\n全文围绕美国学校怎样教授气候变化展开：从得州争论写到全国加强事实教学的诉求与现有不足，再说明优秀标准并不保证课堂落实，年龄和学科覆盖仍有差异，带偏见的外部材料也可能进入教学。学校气候变化教学的改善，牵涉标准、课堂实际内容及教学材料等多个环节。","articleRects":[[273,288,1123,38],[202,338,1194,37],[202,387,1154,38],[274,436,1121,38],[202,485,1193,38],[202,535,1193,38],[202,583,1193,39],[202,632,1174,39],[273,683,1122,38],[203,731,1193,39],[202,780,1195,39],[202,831,1185,38],[274,880,1116,37],[202,930,1194,37],[202,979,800,38],[274,1028,1122,38],[202,1078,1193,37],[202,1127,1192,38],[203,1176,1192,38],[202,1224,1187,39],[203,1275,1193,37],[202,1324,156,31],[274,1373,1121,38],[203,1423,1192,38],[202,1472,1195,38],[202,1520,1101,39],[1157,1543,12,15],[274,1571,1121,38],[203,1620,1193,38],[202,1669,1194,38],[203,1719,1193,37],[202,1768,461,38],[274,1817,1122,38],[202,1867,1193,38],[202,1916,1183,38],[202,1965,980,38]],"questionRects":[],"scrollTarget" <td>reflect scientific consensus；more biased perspectives</td><td>先承认更多官方材料“reflect scientific consensus”，再转到“more biased perspectives”：带有更多偏见的非官方材料仍被发给教师，其中有行业协会资助的材料。它把前面的落实与覆盖问题推进到教学材料的内容和外部资助，显示官方标准或教材改善之后仍存在其他影响教学的渠道。</td><td>承认官方材料的进步，同时指出带偏见的外部材料仍可能进入教学。</td></tr></tbody></table>\n<p>全文围绕美国学校怎样教授气候变化展开：从得州争论写到全国加强事实教学的诉求与现有不足，再说明优秀标准并不保证课堂落实，年龄和学科覆盖仍有差异，带偏见的外部材料也可能进入教学。学校气候变化教学的改善，牵涉标准、课堂实际内容及教学材料等多个环节。</p>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**21. C**\n\n**22. B**\n\n**23. A**\n\n**24. C**\n\n**25. D**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>21. C</strong></p>\n<p><strong>22. B</strong></p>\n<p><strong>23. A</strong></p>\n<p><strong>24. C</strong></p>\n<p><strong>25. D</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRnpRBQBXRUJQVlA4TG1RBQAvV0Y1As34liTJkiTJtoAp8w2l/v+DzSKt+t6PEf2fgP3/+Nz90xn/dP+cbMGSVjLD/Pih2u/8vp5Xnbqj+73f7a764H35McifnnyLKEch1Evr+WH7QdwP7UrVHvv17VnaY2GtGLt1+tCfqrTe0RPtbzT7Q/Zk3LTZ11Ioz8KJwhCflErveloVlSsfNnvF9suGtpmZHe2jlXQqFJSlq46/vmxdqd81vaO6fqukD0UhjTgXLnXBfYHtXOmtKFGkvlS6o+pKr6r0dL4cPJ4tJxah7G8Iy5LI+1uET9t0las7aFaSfvyWGDySEqkZ7kOlq0spdT2qS1Q+yEpd6RW973r/ggoFY/LD337V9b6eb6KnfNt2221nNozNZmPfixRVl4pUovdPr6f3x8/Xmy+vN/azvd6ebLevmddgjJJDluHDVafaqm79/KhIH3Bv57ldrGFrs9yH6PUvmufVRNXS6gNRncc/60PvD293/4g9JGOdqO5SiHzoel4/cndE3XUqfWFB5P2gIM99NEpK6lHKy48f6lbX+sPfv3+nd79UfaBYKmqCkNLrh+1EpAhjhUHZV6t+9fzVet+vqk3vH0oobUtDWhaS+VRJUZ1eVXqq+vCO2Yxttz+0u9vXTstFqRpRVHLHl5/14/7x7Gy2m3lpW1vVqq0Pm0sqbaRD5L2+UKGjS68qUuTTdGONhgxjnjN8gOhBSPMMhfbxVCfXU0fp4xdOwQNx6ur4m/4D251bq276p5jr7rY17v45/pvfsI0kyUnnHy22+keLQ4PDtpEkRa1jmLuH/MN7m8E6w2jbtjGztkPr/wTAhzoVjB1I4IEkjB1I9rA+w24HEojPScLYwiYVTquAzm8LLx0cLSOJUzzQue3gUSV7sOLsID5h7EDBALDhmMUaGmCHiFkaH2+6KFf+G0ujZoEIY0xCYjGSOAFIdIEAwEsHT7eCsQOrNYjZVqtKyA7+g2qS0EiSJElZ7Tb8QXd2z9wDICIm4Dr/7eu6vqsSCsqDewllfaqaKbLOHjIjCXGu+00i327pYeZNUiq6nb2aipKS/ZP5lEVl5uylMlK5z8xc11WFsSacM3NOSfYP5+VlqaLgoZqJ5Z63Q/Y8z6lppiShDekz+WkqTXzo6ZwIZqapF7SrkHdI
