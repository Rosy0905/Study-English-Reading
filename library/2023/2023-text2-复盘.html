<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| short-term rentals | 短期出租 | took off | 迅速发展 | record-high | adj.创纪录的高 |\n| inventory | n.房源库存 | urgency | n.紧迫性 | developers | n.开发商 |\n| swaths | n.大片 | flip | v.转手倒卖 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,147,900,350],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>short-term rentals</td>\n<td>短期出租</td>\n<td>took off</td>\n<td>迅速发展</td>\n<td>record-high</td>\n<td>adj.创纪录的高</td>\n</tr>\n<tr>\n<td>inventory</td>\n<td>n.房源库存</td>\n<td>urgency</td>\n<td>n.紧迫性</td>\n<td>developers</td>\n<td>n.开发商</td>\n</tr>\n<tr>\n<td>swaths</td>\n<td>n.大片</td>\n<td>flip</td>\n<td>v.转手倒卖</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| vacancy rate | 空置率 | advocates | n.倡导者 | unchecked | adj.不受限制的 |\n| strained | adj.紧张的 | Legislature | n.立法机关 | voted against | 投票反对 |\n| legislation | n.立法 | restricting | v.限制 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,670,900,286],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>vacancy rate</td>\n<td>空置率</td>\n<td>advocates</td>\n<td>n.倡导者</td>\n<td>unchecked</td>\n<td>adj.不受限制的</td>\n</tr>\n<tr>\n<td>strained</td>\n<td>adj.紧张的</td>\n ilding a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3>\n<blockquote>\n<p>&quot;I think the question is, / shouldn&#39;t a developer / who&#39;s really building a hotel, / but disguising it / as not a hotel, / be treated and taxed / and regulated like a hotel?&quot; / Horn said.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>&quot;我认为问题是，/ 一个开发商不应该吗 / 他真正在建造酒店，/ 但伪装它 / 不是酒店，/ 被对待和征税 / 并像酒店一样监管？&quot; / 霍恩说。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群</h3>\n<p>who修饰developer，but disguising补充名实不符；三个并列被动动作都指实际旅馆经营。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>&quot;我认为问题是， 一个开发商不应该吗  他真正在建造酒店， 但伪装它  不是酒店， 被对待和征税  并像酒店一样监管？&quot;  霍恩说。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>实际建旅馆的开发商应按旅馆被对待、征税和监管。</p>\n</blockquote>\n<p>先辨明开发商在做什么，再说明应承担何种相应义务。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>霍恩说：“我认为问题是，一个真正在建造酒店但伪装成不是酒店的开发商，难道不应该像酒店一样被对待、征税和监管吗？”</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3>\n<p>反问强调同类经营同类监管，不是在提出个人闲房出租的手续。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>霍恩说：“我认为问题是，一个真正在建造酒店但伪装成不是酒店的开发商，难道不应该像酒店一样被对待、征税和监管吗？”</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n"},{"title":"26题 · 题干、题型与核心出处","raw":"## 26题\n\n> Which of the following is true of New England?\n>\n> 关于新英格兰，下列哪项说法是正确的？\n\n### 题型\n\n细节题：区分房价、库存、空置率和监管对象，核对方向及地区范围。\n\n题干直接问New England。第1段开头是Communities throughout the region，随后写当地短期出租监管以及眼下的住房状况，因此先把第1段从头到尾读完。\n\n### 核心出处\n\n> Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there's an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"26","questionIntro":true},"html":"<blockquote>\n<p>Which of the following is true of New England?</p>\n<p>关于新英格兰，下列哪项说法是正确的？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：区分房价、库存、空置率和监管对象，核对方向及地区范围。</p>\n<p>题干直接问New England。第1段开头是Communities throughout the region，随后写当地短期出租监管以及眼下的住房状况，因此先把第1段从头到尾读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n</blockquote>\n"},{"title":"A. Its housing supply is at a very low level.","raw":"### A. Its housing supply is at a very low level.\n\n> 新英格兰地区住房供应很低。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\nhistorically low inventory指可用房源处于历史低位，A概括住房供应很低，未与并列的高房价混淆。\n\n**出处：**\n\n> Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there's an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>新英格兰地区住房供应很低。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>historically low inventory指可用房源处于历史低位，A概括住房供应很低，未与并列的高房价混淆。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n</blockquote>\n</section>"},{"title":"A. Its housing supply is at a very low level.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 新英格兰地区住房供应很低。\n\n`A`中的`housing supply is at a very low level`是在描述住房供应量，回看第1段第2句的`historically low inventory`，那里明确说现有房源量处在历史低位。\n\n原文把`record-high home prices`与`historically low inventory`并列，前者是房价，后者是现有房源数量。`A`的`housing supply is at a very low level`说住房供应量很低，对应的是后一个关系；历史低位能够支持“很低的水平”，没有把价格高低与数量多少混为一谈。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>新英格兰地区住房供应很低。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>historically low inventory指可用房源处于历史低位，A概括住房供应很低，未与并列的高房价混淆。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental marke 严格控制。\n\nD需要房价管制及控制效果的证据。试图管短租不等于严格控制房价，不能把背景与行动对象对调。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-D-0\"><blockquote>\n<p>新英格兰地区房价受严格控制。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>监管对象是短期出租，房价创纪录高是监管更紧迫的背景；D将房价改成被严格控制的对象和已实现状态。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>新英格兰地区房价受严格控制。</p>\n</blockquote>\n<p><code>D</code>把<code>home prices</code>与<code>under strict control</code>连在一起，回看第1段的<code>regulate short-term rentals</code>和<code>record-high home prices</code>：前者说监管什么，后者说房价怎样，需要将这两处分清。</p>\n<p>原文<code>regulate short-term rentals</code>的对象是短期出租；<code>record-high home prices</code>则是使这种监管更紧迫的背景。<code>D</code>的<code>under strict control</code>把严格控制直接接到了房价上，又把一直试图开展监管写成已经处在严格控制之下。这里的高房价并不是“控制房价”的宾语，原句也没有给出已实现严格控制的状态。</p>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n<p>自Airbnb等网站在2010年代兴起，该地区各社区一直尝试监管短租。如今房价创纪录高、房源库存历史低，监管更加紧迫，尤其有人担心开发商大量买入住房，再在短租市场中转手获利。</p>\n</blockquote>\n<p>communities have been attempting说明持续尝试，Now再说明为何需要更强监管，没有说价格已获稳定控制。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Its home prices are under strict control.</p>\n<p>新英格兰地区房价受严格控制。</p>\n</blockquote>\n<p>D需要房价管制及控制效果的证据。试图管短租不等于严格控制房价，不能把背景与行动对象对调。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"26题结论","raw":"### 26题结论\n\n> **26. A**\n\n- A：historically low inventory指可用房源处于历史低位，A概括住房供应很低，未与并列的高房价混淆。\n- B：社区尝试监管，紧迫性来自房价与房源问题，原文没有把社区经费短缺作为困难。\n- C：文中给出的新罕布什尔空置率是has dropped below 1 percent，即已经降至1%以下，C却说缓慢上升。\n- D：监管对象是短期出租，房价创纪录高是监管更紧迫的背景；D将房价改成被严格控制的对象和已实现状态。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"26","questionConclusion":true},"html":"<blockquote>\n<p><strong>26. A</strong></p>\n</blockquote>\n<ul>\n<li>A：historically low inventory指可用房源处于历史低位，A概括住房供应很低，未与并列的高房价混淆。</li>\n<li>B：社区尝试监管，紧迫性来自房价与房源问题，原文没有把社区经费短缺作为困难。</li>\n<li>C：文中给出的新罕布什尔空置率是has dropped below 1 percent，即已经降至1%以下，C却说缓慢上升。</li>\n<li>D：监管对象是短期出租，房价创纪录高是监管更紧迫的背景；D将房价改成被严格控制的对象和已实现状态。</li>\n</ul>\n"},{"title":"27题 · 题干、题型与核心出处","raw":"## 27题\n\n> The bill mentioned in Paragraph 2 was intended to ______.\n>\n> 第2段提到的法案意在做什么？\n\n### 题型\n\n法案目的题：把made it illegal的主体和行为完整接出，并与voted against的投票结果分开。\n\n题干直接指定Paragraph 2，并问其中的bill。第2段已经完整读过，现在把第2句中法案的内容与议会的投票结果分别读清。\n\n### 核心出处\n\n> a bill that would've made it illegal for towns to create legislation restricting short-term rentals\n>\n> housing advocates fear unchecked short-term rentals will put further pressure on an already strained market\n>\n> would've made it illegal for towns to create legislation restricting short-term rentals","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"27","questionIntro":true},"html":"<blockquote>\n<p>The bill mentioned in Paragraph 2 was intended to ______.</p>\n<p>第2段提到的法案意在做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>法案目的题：把made it illegal的主体和行为完整接出，并与voted against的投票结果分开。</p>\n<p>题干直接指定Paragraph 2，并问其中的bill。第2段已经完整读过，现在把第2句中法案的内容与议会的投票结果分别读清。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals</p>\n<p>housing advocates fear unchecked short-term rentals will put further pressure on an already strained market</p>\n<p>would&#39;ve made it illegal for towns to create legislation restricting short-term rentals</p>\n</blockquote>\n"},{"title":"A. curb short-term rental speculation","raw":"### A. curb short-term rental speculation\n\n> 第2段法案原本意在遏制短租投机。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n法案要禁止城镇制定短租限制，限制对象是地方立法，A却说遏制短租投机，方向相反。\n\n**出处：**\n\n> In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would've made it illegal for towns to create legislation restricting short-term rentals.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>第2段法案原本意在遏制短租投机。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>法案要禁止城镇制定短租限制，限制对象是地方立法，A却说遏制短租投机，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n</blockquote>\n</section>"},{"title":"A. curb short-term rental speculation","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第2段法案原本意在遏制短租投机。\n\n法案要禁止城镇制定短租限制，限制对象是地方立法，A却说遏制短租投机，方向相反。\n\nmade it illegal后接for towns to create legislation，再由restricting修饰这种地方立法，完整宾语不能只读最后的短租限制。\n\nA需要法案本身抑制短租投机。实际它会削弱地方限制短租的能力；议会voted against只是法案被否决，不改它原先的内容。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>第2段法案原本意在遏制短租投机。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>法案要禁止城镇制定短租限制，限制对象是地方立法，A却说遏制短租投机，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\ he rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n<p>新罕布什尔租房空置率已跌破1%，住房倡导者担忧不受约束的短租将进一步压迫本已紧张的市场。州议会最近否决一项法案；该法案若通过，会使城镇制定限制短租的法规成为非法。</p>\n</blockquote>\n<p>法案内容位于that从句，投票反对位于主句，读清二者便能分开政策意图与最终命运。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bill was intended to allow a free short-term rental market.</p>\n<p>第2段法案原本意在允许较自由的短租市场。</p>\n</blockquote>\n<p>free在这里针对地方短租限制，不必扩大为免除所有税收或法律；虽法案被否决，其原本意图仍是放松限制。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"27题结论","raw":"### 27题结论\n\n> **27. D**\n\n- A：法案要禁止城镇制定短租限制，限制对象是地方立法，A却说遏制短租投机，方向相反。\n- B：住房倡导者担心供给受压，法案却拟禁止城镇限制短租。B将前者的住房诉求错误接为后者的立法目的。\n- C：illegal限定的是城镇制定限制短租的法规，未把住房交易判为违法，更未提出惩罚交易者。\n- D：禁止城镇对短租立法设限，等于放开这类地方约束，D概括较自由的短租市场这一方向。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,538,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"27","questionConclusion":true},"html":"<blockquote>\n<p><strong>27. D</strong></p>\n</blockquote>\n<ul>\n<li>A：法案要禁止城镇制定短租限制，限制对象是地方立法，A却说遏制短租投机，方向相反。</li>\n<li>B：住房倡导者担心供给受压，法案却拟禁止城镇限制短租。B将前者的住房诉求错误接为后者的立法目的。</li>\n<li>C：illegal限定的是城镇制定限制短租的法规，未把住房交易判为违法，更未提出惩罚交易者。</li>\n<li>D：禁止城镇对短租立法设限，等于放开这类地方约束，D概括较自由的短租市场这一方向。</li>\n</ul>\n"},{"title":"28题 · 题干、题型与核心出处","raw":"## 28题\n\n> Compared with Castle, Taylor is more likely to support ______.\n>\n> 与卡斯尔相比，泰勒更可能支持什么？\n\n### 题型\n\n人物观点比较题：分别抓Taylor的工人住房需求与Castle的游客及旅游就业联系。\n\n题干直接给出Castle和Taylor。第3段引述Taylor，第4段引述Castle，先完整精读这两个自然段，把两人各自强调的住房问题读清。\n\n### 核心出处\n\n> We are at a crisis level on the supply of rental housing\n>\n> workers are having a hard time finding a place to live\n>\n> short-term rentals also provide housing for tourists","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"28","questionIntro":true},"html":"<blockquote>\n<p>Compared with Castle, Taylor is more likely to support ______.</p>\n<p>与卡斯尔相比，泰勒更可能支持什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点比较题：分别抓Taylor的工人住房需求与Castle的游客及旅游就业联系。</p>\n<p>题干直接给出Castle和Taylor。第3段引述Taylor，第4段引述Castle，先完整精读这两个自然段，把两人各自强调的住房问题读清。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>We are at a crisis level on the supply of rental housing</p>\n<p>workers are having a hard time finding a place to live</p>\n<p>short-term rentals also provide housing for tourists</p>\n</blockquote>\n"},{"title":"A. further investment in local tourism","raw":"### A. further investment in local tourism\n\n> 相比Castle，Taylor更可能支持进一步投资本地旅游业。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n旅游与短租支持行业就业是Castle强调的一面，Taylor强调工人住房不足；A还额外指定进一步旅游投资。\n\n**出处：**\n\n> \"We are at a crisis level on the supply of rental housing, so anytime you're taking the tool out of the toolkit for communities to address this, you're potentially taking supply off the market that's already incredibly stressed,\" said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, \"employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,\" Taylor said.\n> However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. \"A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,\" Castle said, \"and so it's a cyclical effect.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-28-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>相比Castle，Taylor更可能支持进一步投资本地旅游业。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>旅游与短租支持行业就业是Castle强调的一面，Taylor强调工人住房不足；A还额外指定进一步旅游投资。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n</section>"},{"title":"A. further investment in local tourism","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 相比Castle，Taylor更可能支持进一步投资本地旅游业。\n\n`A`的`further investment in local tourism`指向旅游业，回看第4段`Castle`的`workers are servicing the tourist industry`，再对照第3段`Taylor`说的`supply of rental housing`；两人的话必须合起来才能判断“更可能”。\n\n`Taylor`从`supply of rental housing`处在危机程度谈到工人找不到住处，强调的是劳动者的居住困难。`Castle`说短租给游客住，并且`workers are servicing the tourist industry`，强调游客、短租与旅游就业的联系。`A`的`further investment in local tourism`却把加大旅游投资归成`Taylor`更倾向的主张；它把`Castle`展开的旅游业一侧接给了`Taylor`，而且把已有的行业联系加成进一步投资的行动。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-28-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>相比Castle，Taylor更可能支持进一步投资本地旅游业。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>旅游与短租支持行业就业是Castle强调的一面，Taylor强调工人住房不足；A还额外指定进一步旅游投资。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>相比Castle，Taylor更可能支持进一步投资本地旅游业。</p>\n</blockquote>\n<p><code>A</code>的<code>further investment in local tourism</code>指向旅游业，回看第4段<code>Castle</code>的<code>workers are servicing the tourist industry</code>，再对照第3段<code>Taylor</code>说的<code>supply of rental housing</code>；两人的话必须合起来才能判断“更可能”。</p>\n<p><code>Taylor</code>从<code>supply of rental housing</code>处在危机程度谈到工人找不到住处，强调的是劳动者的居住困难。<code>Castle</code>说短租给游客住，并且<code>workers are servicing the tourist industry</code>，强调游客、短租与旅游就业的联系。<code>A</code>的<code>further investment in local tourism</code>却把加大旅游投资归成<code>Taylor</code>更倾向的主张；它把<code>Castle</code>展开的旅游业一侧接给了<code>Taylor</code>，而且把已有的行业联系加成进一步投资的行动。</p>\n</section>"},{"title":"A. further investment in local tourism","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> \"We are at a crisis level on the supply of rental housing, so anytime you're taking the tool out of the toolkit for communities to address this, you're potentially taking supply off the market that's already incredibly stressed,\" said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, \"employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,\" Taylor said.\n> However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. \"A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,\" Castle said, \"and so it's a cyclical effect.\"\n>\n> 住房组织负责人Nick Taylor说，租赁住房供给已处危机，拿走社区应对问题的工具，可能让本已极度紧张的市场进一步失去供给。他指出，新罕布什尔南部城镇可负担住房不足，使雇主难招人，工人难找到住处。\n>\n> 当地房地产经纪人协会负责人Ryan Castle指出，短租也给游客提供住房。他说，很多工人服务旅游业，而短期到访者又支持旅游业，所以这有一种循环作用。\n\nTaylor从住房供给危机讲到雇主招工难与工人无处住，However随后让Castle补充游客住宿的价值。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Taylor would support further investment in local tourism.\n>\n> 相比Castle，Taylor更可能支持进一步投资本地旅游业。\n\nA需要Taylor比Castle更主张新增旅游投资的证据。两人关注点及原文未提出投资计划，都不支持这种比较。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>相比Castle，Taylor更可能支持进一步投资本地旅游业。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>旅游与短租支持行业就业是Castle强调的一面，Taylor强调工人住房不足；A还额外指定进一步旅游投资。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>相比Castle，Taylor更可能支持进一步投资本地旅游业。</p>\n</blockquote>\n<p><code>A</code>的<code>further investment in local tourism</code>指向旅游业，回看第4段<code>Castle</code>的<code>workers are servicing the tourist industry</code>，再对照第3段<code>Taylor</code>说的<code>supply of rental housing</code>；两人的话必须合起来才能判断“更可能”。</p>\n<p><code>Taylor</code>从<code>supply of rental housing</code>处在危机程度谈到工人找不到住处，强调的是劳动者的居住困难。<code>Castle</code>说短租给游客住，并且<code>workers are servicing the tourist industry</code>，强调游客、短租与旅游就业的联系。<code>A</code>的<code>further investment in local tourism</code>却把加大旅游投资归成<code>Taylor</code>更倾向的主张；它把<code>Castle</code>展开的旅游业一侧接给了<code>Taylor</code>，而且把已有的行业联系加成进一步投资的行动。</p>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n<p>住房组织负责人Nick Taylor说，租赁住房供给已处危机，拿走社区应对问题的工具，可能让本已极度紧张的市场进一步失去供给。他指出，新罕布什尔南部城镇可负担住房不足，使雇主难招人，工人难找到住处。</p>\n<p>当地房地产经纪人协会负责人Ryan Castle指出，短租也给游客提供住房。他说，很多工人服务旅游业，而短期到访者又支持旅游业，所以这有一种循环作用。</p>\n</blockquote>\n<p>Taylor从住房供给危机讲到雇主招工难与工人无处住，However随后让Castle补充游客住宿的价值。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Taylor would support further investment in local tourism.</p>\n<p>相比Castle，Taylor更可能支持进一步投资本地旅游业。</p>\n</blockquote>\n<p>A需要Taylor比Castle更主张新增旅游投资的证据。两人关注点及原文未提出投资计划，都不支持这种比较。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. an increase in affordable housing","raw":"### B. an increase in affordable housing\n\n> 相比Castle，Taylor更可能支持增加可负担住房。\n\n**做题模式中的状态：** 第一轮保留B，此时B尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\nTaylor将雇主招工难、工人居住难归于可负担住房不足，因此增加这类住房是最贴近其担忧的方向。\n\n**出处：**\n\n> \"We are at a crisis level on the supply of rental housing, so anytime you're taking the tool out ls also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n</section>"},{"title":"B. an increase in affordable housing","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 相比Castle，Taylor更可能支持增加可负担住房。\n\n`B`的`an increase in affordable housing`要增加人们负担得起的住处，回看第3段`Without enough affordable housing`及随后的雇主、工人困难，再与第4段`Castle`强调的`provide housing for tourists`对照。\n\n`Taylor`用`Without enough affordable housing`说明可负担住房不足，随后列出雇主招人难、工人找住处难两种后果。`Castle`则补充短租`provide housing for tourists`，强调游客住宿这一用途。`B`的`an increase in affordable housing`针对的正是`Taylor`指出的不足，从缺少这类住房造成困难，可以推知他更倾向增加它的供应；这是从他的担忧推出的主张，不是原文逐字记录的一项提案。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"B","cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-28-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-B-0\"><blockquote>\n<p>相比Castle，Taylor更可能支持增加可负担住房。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>Taylor将雇主招工难、工人居住难归于可负担住房不足，因此增加这类住房是最贴近其担忧的方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting ng> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>两人比较的是居民住房与游客住宿的需求，未将供给问题归因于经纪人行为或提出严格管理经纪人的办法。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n</section>"},{"title":"C. strict management of real estate agents","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 相比Castle，Taylor更可能支持严格管理房地产经纪人。\n\n`C`的`strict management of real estate agents`把措施指向经纪人的行为；回到第3段`Taylor`的`a crisis level on the supply of rental housing`及第4段`Castle`的`housing for tourists`，核对两人的分歧是否落在管理经纪人上。\n\n`Taylor`说`a crisis level on the supply of rental housing`，接着把工人居住困难与可负担住房不够相连；`Castle`则指出短租提供`housing for tourists`。`C`的`strict management of real estate agents`把这组“工人住处与游客住宿”的关注差别，换成“是否严格管理房地产经纪人”的分歧。两人的发言并没有把经纪人的行为接成供给危机的原因，也没有把管理经纪人接成各自主张的解决办法。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"C","cumulative":true,"cumulativeGroup":"question-28-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-28-option-C-1","html":"<section class=\"revealPart :"D. a favorable policy for short-term workers","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 相比Castle，Taylor更可能支持制定有利于短期工人的政策。\n\n`D`的`short-term workers`把“短期”用来限定工人，回看第3段`Taylor`的`workers are having a hard time finding a place to live`，以及第4段`Castle`的`those people coming in short term`，确认短期描述的是哪一群人。\n\n`Taylor`说`workers are having a hard time finding a place to live`，谈工人缺少住处，并未把他们限定为短期雇用的工人。`Castle`先说短租给游客住，再提`those people coming in short term`，短期停留承接的是游客一侧。`D`的`short-term workers`把这种停留时间接到了工人的用工类型上，再把它写成`Taylor`更支持的政策对象；这不是两人的话所划出的对象。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-28-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-D-0\"><blockquote>\n<p>相比Castle，Taylor更可能支持制定有利于短期工人的政策。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Taylor说workers没有限定短期雇用；Castle的coming in short term接游客短住，D把停留时间移成工人的就业类型。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>相比Castle，Taylor更可能支持制定有利于短期工人的政策。</p>\n</blockquote>\n<p><code>D</code>的<code>short-term workers</code>把“短期”用来限定工人，回看第3段<code>Taylor</code>的<code>workers are having a hard time finding a place to live</code>，以及第4段<code>Castle</code>的<code>those people coming in short term</code>，确认短期描述的是哪一群人。</p>\n<p><code>Taylor</code>说<code>workers are having a hard time finding a place to live</code>，谈工人缺少住处，并未把他们限定为短期雇用的工人。<code>Castle</code>先说短租给游客住，再提<code>those people coming in short term</code>，短期停留承接的是游客一侧。<code>D</code>的<code>short-term workers</code>把这种停留时间接到了工人的用工类型上，再把它写成<code>Taylor</code>更支持的政策对象；这不是两人的话所划出的对象。</p>\n</section>"},{"title":"D. a favorable policy for short-term workers","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> \"We are at a crisis level on the supply of rental housing, so anytime you're taking the tool out of the toolkit for communities to address this, you're potentially taking supply off the market that's already incredibly stressed,\" said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, \"employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,\" Taylor said.\n> However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. \"A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,\" Castle said, \"and so it's a cyclical effect.\"\n>\n> 住房组织负责人Nick Taylor说，租赁住房供给已处危机，拿走社区应对问题的工具，可能让本已极度紧张的市场进一步失去供给。他指出，新罕布什尔南部城镇可负担住房不足，使雇主难招人，工人难找到住处。\n>\n> 当地房地产经纪人协会负责人Ryan Castle指出，短租也给游客提供住房。他说，很多工人服务旅游业，而短期到访者又支持旅游业，所以这有一种循环作用。\n\nTaylor担忧劳动者无住房，Castle补游客来到当地消费与旅游岗位相互关联。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Taylor would support a favorable policy for short-term workers.\n>\n> 相比Castle，Taylor更可能支持制定有利于短期工人的政策。\n\nD需要专门面向临时工的政策。短租、短住与短期劳动合同是不同概念，不能因都出现short-term便合并对象。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-D-0\"><blockquote>\n<p>相比Castle，Taylor更可能支持制定有利于短期工人的政策。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Taylor说workers没有限定短期雇用；Castle的coming in short term接游客短住，D把停留时间移成工人的就业类型。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>相比Castle，Taylor更可能支持制定有利于短期工人的政策。</p>\n</blockquote>\n<p><code>D</code>的<code>short-term workers</code>把“短期”用来限定工人，回看第3段<code>Taylor</code>的<code>workers are having a hard time finding a place to live</code>，以及第4段<code>Castle</code>的<code>those people coming in short term</code>，确认短期描述的是哪一群人。</p>\n<p><code>Taylor</code>说<code>workers are having a hard time finding a place to live</code>，谈工人缺少住处，并未把他们限定为短期雇用的工人。<code>Castle</code>先说短租给游客住，再提<code>those people coming in short term</code>，短期停留承接的是游客一侧。<code>D</code>的<code>short-term workers</code>把这种停留时间接到了工人的用工类型上，再把它写成<code>Taylor</code>更支持的政策对象；这不是两人的话所划出的对象。</p>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n<p>住房组织负责人Nick Taylor说，租赁住房供给已处危机，拿走社区应对问题的工具，可能让本已极度紧张的市场进一步失去供给。他指出，新罕布什尔南部城镇可负担住房不足，使雇主难招人，工人难找到住处。</p>\n<p>当地房地产经纪人协会负责人Ryan Castle指出，短租也给游客提供住房。他说，很多工人服务旅游业，而短期到访者又支持旅游业，所以这有一种循环作用。</p>\n</blockquote>\n<p>Taylor担忧劳动者无住房，Castle补游客来到当地消费与旅游岗位相互关联。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Taylor would support a favorable policy for short-term workers.</p>\n<p>相比Castle，Taylor更可能支持制定有利于短期工人的政策。</p>\n</blockquote>\n<p>D需要专门面向临时工的政策。短租、短住与短期劳动合同是不同概念，不能因都出现short-term便合并对象。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"28题结论","raw":"### 28题结论\n\n> **28. B**\n\n- A：旅游与短租支持行业就业是Castle强调的一面，Taylor强调工人住房不足；A还额外指定进一步旅游投资。\n- B：Taylor将雇主招工难、工人居住难归于可负担住房不足，因此增加这类住房是最贴近其担忧的方向。\n- C：两人比较的是居民住房与游客住宿的需求，未将供给问题归因于经纪人行为或提出严格管理经纪人的办法。\n- D：Taylor说workers没有限定短期雇用；Castle的coming in short term接游客短住，D把停留时间移成工人的就业类型。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,919,1344,380],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"28","questionConclusion":true},"html":"<blockquote>\n<p><strong>28. B</strong></p>\n</blockquote>\n<ul>\n<li>A：旅游与短租支持行业就业是Castle强调的一面，Taylor强调工人住房不足；A还额外指定进一步旅游投资。</li>\n<li>B：Taylor将雇主招工难、工人居住难归于可负担住房不足，因此增加这类住房是最贴近其担忧的方向。</li>\n<li>C：两人比较的是居民住房与游客住宿的需求，未将供给问题归因于经纪人行为或提出严格管理经纪人的办法。</li>\n<li>D：Taylor说workers没有限定短期雇用；Castle的coming in short term接游客短住，D把停留时间移成工人的就业类型。</li>\n</ul>\n"},{"title":"29题 · 题干、题型与核心出处","raw":"## 29题\n\n> What does Horn emphasize in Paragraph 5?\n>\n> 霍恩在第5段强调了什么？\n\n### 题型\n\n强调重点题：以however区分个人闲房出租与开发商事实旅馆，找最后反问的要求。\n\n题干明确指定Horn和Paragraph 5。第5段整段都是对Horn观点的介绍与引述，先从短租本身并非关键读到她对开发商的提问。\n\n### 核心出处\n\n> Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations\n>\n> be treated and taxed and regulated like a hotel\n>\n> de facto hotels—to bypass taxes and regulations","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"29","questionIntro":true},"html":"<blockquote>\n<p>What does Horn emphasize in Paragraph 5?</p>\n<p>霍恩在第5段强调了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>强调重点题：以however区分个人闲房出租与开发商事实旅馆，找最后反问的要求。</p>\n<p>题干明确指定Horn和Paragraph 5。第5段整段都是对Horn观点的介绍与引述，先从短租本身并非关键读到她对开发商的提问。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations</p>\n<p>be treated and taxed and regulated like a hotel</p>\n<p>de facto hotels—to bypass taxes and regulations</p>\n</blockquote>\n"},{"title":"A. The urgency to upgrade short-term rental facilities.","raw":"### A. The urgency to upgrade short-term rental facilities.\n\n> Horn在第5段强调紧急升级短租设施。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nHorn要求将事实旅馆按旅馆征税监管，问题在规避义务，不在设施陈旧。A改成紧急升级设施。\n\n**出处：**\n\n> Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. \"I think individuals being able to rent out their second home is a good thing. If it's their vacation home anyway, and it's just empty, why can't you make money off it?\" Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. \"I think the question is, shouldn't a developer who's really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?\" Horn said.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-29-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>Horn在第5段强调紧急升级短租设施。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Horn要求将事实旅馆按旅馆征税监管，问题在规避义务，不在设施陈旧。A改成紧急升级设施。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n</blockquote>\n</section>"},{"title":"A. The urgency to upgrade short-term rental facilities.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Horn在第5段强调紧急升级短租设施。\n\n`A`的`upgrade short-term rental facilities`是在要求改善设施，回看第5段`Horn`说问题出现在哪里，以及结尾的`treated and taxed and regulated like a hotel`，检查她要求改变的是设施还是经营者受到的管理。\n\n原文指出开发商把大规模短租做成事实上的旅馆以绕过税收和监管，因此`Horn`追问是否应`treated and taxed and regulated like a hotel`，要求按旅馆对待、征税和监管。`A`的`upgrade short-term rental facilities`把这个要求换成升级短租设施，还加入升级的紧迫性。问题在于经营者绕开旅馆所受的税收和监管，不在于设施陈旧或需要升级。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>Horn在第5段强调紧急升级短租设施。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Horn要求将事实旅馆按旅馆征税监管，问题在规避义务，不在设施陈旧。A改成紧急升级设施。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Horn在第5段强调紧急升级短租设施。</p>\n</blockquote>\n<p><code>A</code>的<code>upgrade short-term rental facilities</code>是在要求改善设施，回看第5段<code>Horn</code>说问题出现在哪里，以及结尾的<code>treated and taxed and regulated like a hotel</code>，检查她要求改变的是设施还是经营者受到的管理。</p>\n<p>原文指出开发商把大规模短租做成事实上的旅馆以绕过税收和监管，因此<code>Horn</code>追问是否应<code>treated and taxed and regulated like a hotel</code>，要求按旅馆对待、征税和监管。<code>A</code>的<code>upgrade short-term rental facilities</code>把这个要求换成升级短租设施，还加入升级的紧迫性。问题在于经营者绕开旅馆所受的税收和监管，不在于设施陈旧或需要升级。</p>\n</section>"},{"title":"A. The urgency to upgrade short-term rental facilities.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. \"I think individuals being able to rent out their second home is a good thing. If it's their vacation home anyway, and it's just empty, why can't you make money off it?\" Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. \"I think the question is, shouldn't a developer who's really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?\" Horn said.\n>\n> 可负担住房政策专家Keren Horn说，短租本身不是问题关键。个人能出租第二套住房是好事，度假屋既然空着，为什么不能靠它挣钱？但当开发商试图建大规模短租设施，即事实上的旅馆，来绕过税收监管，问题就出现了。她反问：实质上建旅馆却伪装成不是旅馆的开发商，难道不该像旅馆一样被对待、征税和监管吗？\n\n先认可个人出租空房，再以however转向开发商大规模经营伪装非旅馆的做法，最后反 #39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n</blockquote>\n</section>"},{"title":"D. The proper procedures for renting out spare houses.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> Horn在第5段强调出租闲房的适当程序。\n\n`D`的`proper procedures for renting out spare houses`让人回到第5段`rent out their second home`和`it’s just empty`，那里确实谈个人出租闲置房屋；再连着后面的`Issues arise`, `however`读，分清这一例子在段中起什么作用。\n\n原文用`rent out their second home`说明个人出租第二套住房是好事，并以闲着也可挣钱解释这种认可；这不是在列出租房步骤。随后`Issues arise`, `however`把重点转向开发商以事实旅馆绕过税收和监管。`D`的`proper procedures for renting out spare houses`却把前面的许可与肯定写成对出租程序的指导，并让它承担整段强调的内容。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-D-0\"><blockquote>\n<p>Horn在第5段强调出租闲房的适当程序。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>个人出租空置第二套住房是被认可的行为，原段没有讲操作程序；真正强调的在however后的开发商规避。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a
