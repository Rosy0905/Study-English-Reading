equirements</td>\n<td>n.要求</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第7段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>similar</td>\n<td>adj.类似的</td>\n<td>registration</td>\n<td>n.登记</td>\n<td>benefit</td>\n<td>v.有益于</td>\n</tr>\n<tr>\n<td>struggling</td>\n<td>adj.艰难应对的</td>\n<td>make a change</td>\n<td>作出改变</td>\n<td>housing market</td>\n<td>住房市场</td>\n</tr>\n<tr>\n<td>main</td>\n<td>adj.主要的</td>\n<td>build</td>\n<td>v.建造</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n<h3>意群划分 · 第1段</h3>\n<p>Communities throughout the region / have been attempting to regulate / short-term rentals / since sites like Airbnb / took off in the 2010s.</p>\n<p>Now, / with record-high home prices / and historically low inventory, / there&#39;s an increased urgency / in such regulation, / particularly among those / who worry that / developers will come in / and buy up swaths of housing / to flip for a fortune / on the short-term rental market.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>整个地区的社区 / 一直在试图监管 / 短期租赁 / 自从像Airbnb这样的网站 / 在2010年代兴起。</p>\n<p>现在，/ 随着创纪录的高房价 / 和历史性的低库存，/ 有一种增加的紧迫性 / 在这种监管中，/ 特别是在那些人中 / 他们担心 / 开发商会进入 / 并买下大片住房 / 为了巨额利润而转手 / 在短期租赁市场上。</p>\n<h3>标准译文 · 第1段</h3>\n<p>自从像Airbnb这样的网站在2010年代兴起以来，整个地区的社区一直在试图监管短期租赁。现在，随着创纪录的高房价和历史性的低库存，这种监管变得更加紧迫，特别是那些担心开发商会进入并买下大片住房，然后在短期租赁市场上转手牟取暴利的人。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n<h3>意群划分 · 第2段</h3>\n<p>In New Hampshire, / where the rental vacancy rate / has dropped below 1 percent, / housing advocates fear / unchecked short-term rentals / will put further pressure / on an already strained market.</p>\n<p>The state Legislature / recently voted against / a bill / that would&#39;ve made it illegal / for towns / to create legislation / restricting short-term rentals.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>在新罕布什尔州，/ 那里的租赁空置率 / 已经降到1%以下，/ 住房倡导者担心 / 不受控制的短期租赁 / 会施加更多压力 / 在一个已经紧张的市场上。</p>\n<p>州立法机构 / 最近投票反对了 / 一项法案 / 该法案本会使其非法 / 对于城镇 / 制定立法 / 限制短期租赁。</p>\n<h3>标准译文 · 第2段</h3>\n<p>在新罕布什尔州，租赁空置率已经降到1%以下，住房倡导者担心不受控制的短期租赁会给已经紧张的市场施加更多压力。州立法机构最近投票反对了一项法案，该法案本会禁止城镇制定限制短期租赁的立法。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.</p>\n<h3>意群划分 · 第3段</h3>\n<p>&quot;We are at a crisis level / on the supply of rental housing, / so anytime / you&#39;re taking the tool / out of the toolkit / for communities to address this, / you&#39;re potentially taking supply / off the market / that&#39;s already incredibly stressed,&quot; / said Nick Taylor, / executive director / of the Workforce Housing Coalition / of the Greater Seacoast.</p>\n<p>Without enough affordable housing / in southern New Hampshire towns, / &quot;employers are having a hard time / attracting employees, / and workers are having a hard time / finding a place to live,&quot; / Taylor said.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>&quot;我们处于危机水平 / 在租赁住房供应方面，/ 所以任何时候 / 你在拿走工具 / 从工具箱中 / 让社区解决这个问题的，/ 你可能在减少供应 / 从市场上 / 这个市场已经极度紧张，&quot; / 尼克·泰勒说，/ 执行董事 / 劳动力住房联盟的 / 大海岸地区的。</p>\n<p>没有足够的可负担住房 / 在新罕布什尔州南部城镇，/ &quot;雇主很难 / 吸引员工，/ 而工人很难 / 找到居住的地方，&quot; / 泰勒说。</p>\n<h3>标准译文 · 第3段</h3>\n<p>大海岸地区劳动力住房联盟的执行董事尼克·泰勒说：&quot;我们在租赁住房供应方面处于危机水平，所以任何时候你从社区解决这个问题的工具箱中拿走工具，你都可能从已经极度紧张的市场上减少供应。&quot;泰勒说，由于新罕布什尔州南部城镇缺乏足够的可负担住房，&quot;雇主很难吸引员工，工人也很难找到居住的地方。&quot;</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n<h3>意群划分 · 第4段</h3>\n<p>However, / short-term rentals also provide / housing for tourists, / pointed out Ryan Castle, / CEO / of a local Association of Realtors.</p>\n<p>&quot;A lot of workers / are servicing the tourist industry, / and the tourism industry / is serviced by / those people coming in short term,&quot; / Castle said, / &quot;and so it&#39;s a cyclical effect.&quot;</p>\n<h3>意群翻译 · 第4段</h3>\n<p>然而，/ 短期租赁也提供 / 住房给游客，/ 瑞安·卡斯尔指出，/ 首席执行官 / 当地房地产经纪人协会的。</p>\n<p>&quot;很多工人 / 在服务旅游业，/ 而旅游业 / 被服务 / 那些短期来访的人，&quot; / 卡斯尔说，/ &quot;所以这是一个循环效应。&quot;</p>\n<h3>标准译文 · 第4段</h3>\n<p>然而，当地房地产经纪人协会首席执行官瑞安·卡斯尔指出，短期租赁也为游客提供住房。卡斯尔说：&quot;很多工人在服务旅游业，而旅游业又被那些短期来访的人所支撑，所以这是一个循环效应。&quot;</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n<h3>意群划分 · 第5段</h3>\n<p>Short-term rentals themselves / are not the crux of the issue, / said Keren Horn, / an expert / on affordable housing policy.</p>\n<p>&quot;I think / individuals being able to / rent out their second home / is a good thing. / If it&#39;s their vacation home anyway, / and it&#39;s just empty, / why can&#39;t you make money off it?&quot; / Horn said.</p>\n<p>Issues arise, however, / when developers attempt / to create large-scale / short-term rental facilities — / de facto hotels — / to bypass taxes and regulations.</p>\n<p>&quot;I think the question is, / shouldn&#39;t a developer / who&#39;s really building a hotel, / but disguising it / as not a hotel, / be treated and taxed / and regulated like a hotel?&quot; / Horn said.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>短期租赁本身 / 不是问题的关键，/ 凯伦·霍恩说，/ 一位专家 / 在可负担住房政策方面。</p>\n<p>&quot;我认为 / 个人能够 / 出租他们的第二套房 / 是一件好事。/ 如果它本来就是他们的度假屋，/ 而且只是空着，/ 为什么不能从中赚钱呢？&quot; / 霍恩说。</p>\n<p>然而，问题出现了，/ 当开发商试图 / 创建大规模的 / 短期租赁设施 — / 事实上的酒店 — / 来规避税收和监管。</p>\n<p>&quot;我认为问题是，/ 一个开发商不应该吗 / 他真正在建造酒店，/ 但伪装它 / 不是酒店，/ 被对待和征税 / 并像酒店一样监管？&quot; / 霍恩说。</p>\n<h3>标准译文 · 第5段</h3>\n<p>可负担住房政策专家凯伦·霍恩说，短期租赁本身不是问题的关键。霍恩说：&quot;我认为个人能够出租他们的第二套房是一件好事。如果它本来就是他们的度假屋，而且只是空着，为什么不能从中赚钱呢？&quot;然而，当开发商试图创建大规模的短期租赁设施——事实上的酒店——来规避税收和监管时，问题就出现了。霍恩说：&quot;我认为问题是，一个真正在建造酒店但伪装成不是酒店的开发商，难道不应该像酒店一样被对待、征税和监管吗？&quot;</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.</p>\n<h3>意群划分 · 第6段</h3>\n<p>At the end of 2018, / Governor Charlie Baker / signed a bill / to rein in / those potential investor-buyers.</p>\n<p>&quot;The bill requires / every rental host / to register with the state, / mandates they carry insurance, / and opens the potential / for local taxes / on top of a new state levy,&quot; / Boston took things even further, / requiring renters / to register / with the city&#39;s Inspectional Services Department.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>在2018年底，/ 州长查理·贝克 / 签署了一项法案 / 来控制 / 那些潜在的投资者买家。</p>\n<p>&quot;该法案要求 / 每个租赁房东 / 向州注册，/ 强制要求他们购买保险，/ 并开放了可能性 / 征收地方税 / 在新的州税之上，&quot; / 波士顿更进一步，/ 要求出租者 / 注册 / 在该市的检查服务部门。</p>\n<h3>标准译文 · 第6段</h3>\n<p>2018年底，州长查理·贝克签署了一项法案来控制那些潜在的投资者买家。&quot;该法案要求每个租赁房东向州注册，强制要求他们购买保险，并为在新的州税之上征收地方税开放了可能性。&quot;波士顿更进一步，要求出租者在该市的检查服务部门注册。</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>Horn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n<h3>意群划分 · 第7段</h3>\n<p>Horn said / similar registration requirements / could benefit / other struggling cities and towns.</p>\n<p>But &quot;If we want to / make a change / in the housing market, / the main one is / we have to build / a lot more.&quot;</p>\n<h3>意群翻译 · 第7段</h3>\n<p>霍恩说 / 类似的注册要求 / 可能有益于 / 其他苦苦挣扎的城市和城镇。</p>\n<p>但&quot;如果我们想要 / 做出改变 / 在住房市场，/ 主要的是 / 我们必须建造 / 更多。&quot;</p>\n<h3>标准译文 · 第7段</h3>\n<p>霍恩说，类似的注册要求可能有益于其他苦苦挣扎的城市和城镇。但&quot;如果我们想要在住房市场做出改变，主要的是我们必须建造更多住房。&quot;</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>Communities throughout the region → have been attempting to regulate → short-term rentals：(since sites like Airbnb → took off in the 2010s).</p>\n<p>Now：(with record-high home prices + historically low inventory) → there&#39;s an increased urgency：(in such regulation)，particularly among those：(who worry that：(developers will come in + buy up swaths of housing → to flip for a fortune：(on the short-term rental market))).</p>\n<p><strong>第2段</strong></p>\n<p>In New Hampshire：(where the rental vacancy rate → has dropped below 1 percent) → housing advocates fear：(unchecked short-term rentals → will put further pressure：(on an already strained market)).</p>\n<p>The state Legislature → recently voted against → a bill：(that would&#39;ve made it illegal：(for towns → to create legislation：(restricting short-term rentals))).</p>\n<p><strong>第3段</strong></p>\n<p>&quot;We are at a crisis level：(on the supply of rental housing)，so anytime：(you&#39;re taking the tool：(out of the toolkit：(for communities to address this))) → you&#39;re potentially taking supply：(off the market：(that&#39;s already incredibly stressed)),&quot; → said Nick Taylor：(executive director：(of the Workforce Housing Coalition：(of the Greater Seacoast))).</p>\n<p>Without enough affordable housing：(in southern New Hampshire towns) → &quot;employers are having a hard time：(attracting employees) + workers are having a hard time：(finding a place to live),&quot; → Taylor said.</p>\n<p><strong>第4段</strong></p>\n<p>However // short-term rentals also provide → housing for tourists → pointed out Ryan Castle：(CEO：(of a local Association of Realtors)).</p>\n<p>&quot;A lot of workers → are servicing the tourist industry + the tourism industry → is serviced by：(those people coming in short term),&quot; → Castle said → &quot;and so it&#39;s a cyclical effect.&quot;</p>\n<p><strong>第5段</strong></p>\n<p>Short-term rentals themselves → are not the crux of the issue → said Keren Horn：(an expert：(on affordable housing policy)).</p>\n<p>&quot;I think：(individuals being able to → rent out their second home → is a good thing). → If it&#39;s their vacation home anyway + it&#39;s just empty → why can&#39;t you make money off it?&quot; → Horn said.</p>\n<p>Issues arise, however // when developers attempt → to create large-scale：(short-term rental facilities) — de facto hotels — to bypass taxes and regulations.</p>\n<p>&quot;I think the question is → shouldn&#39;t a developer：(who&#39;s really building a hotel // but disguising it：(as not a hotel)) → be treated and taxed + regulated like a hotel?&quot; → Horn said.</p>\n<p><strong>第6段</strong></p>\n<p>At the end of 2018 → Governor Charlie Baker → signed a bill → to rein in：(those potential investor-buyers).</p>\n<p>&quot;The bill requires：(every rental host → to register with the state) + mandates they carry insurance + opens the potential：(for local taxes：(on top of a new state levy)),&quot; → Boston took things even further → requiring renters → to register：(with the city&#39;s Inspectional Services Department).</p>\n<p><strong>第7段</strong></p>\n<p>Horn said → similar registration requirements → could benefit：(other struggling cities and towns).</p>\n<p>But &quot;If we want to → make a change：(in the housing market) → the main one is → we have to build → a lot more.&quot;</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>整个地区的社区 → 一直在试图监管 → 短期租赁：(自从像Airbnb这样的网站 → 在2010年代兴起)。</p>\n<p>现在：(随着创纪录的高房价 + 历史性的低库存) → 有一种增加的紧迫性：(在这种监管中)，特别是在那些人中：(他们担心：(开发商会进入 + 买下大片住房 → 为了巨额利润而转手：(在短期租赁市场上)))。</p>\n<p><strong>第2段</strong></p>\n<p>在新罕布什尔州：(那里的租赁空置率 → 已经降到1%以下) → 住房倡导者担心：(不受控制的短期租赁 → 会施加更多压力：(在一个已经紧张的市场上))。</p>\n<p>州立法机构 → 最近投票反对了 → 一项法案：(该法案本会使其非法：(对于城镇 → 制定立法：(限制短期租赁)))。</p>\n<p><strong>第3段</strong></p>\n<p>&quot;我们处于危机水平：(在租赁住房供应方面)，所以任何时候：(你在拿走工具：(从工具箱中：(让社区解决这个问题的))) → 你可能在减少供应：(从市场上：(这个市场已经极度紧张))，&quot; → 尼克·泰勒说：(执行董事：(劳动力住房联盟的：(大海岸地区的)))。</p>\n<p>没有足够的可负担住房：(在新罕布什尔州南部城镇) → &quot;雇主很难：(吸引员工) + 工人很难：(找到居住的地方)，&quot; → 泰勒说。</p>\n<p><strong>第4段</strong></p>\n<p>然而 // 短期租赁也提供 → 住房给游客 → 瑞安·卡斯尔指出：(首席执行官：(当地房地产经纪人协会的))。</p>\n<p>&quot;很多工人 → 在服务旅游业 + 旅游业 → 被服务：(那些短期来访的人)，&quot; → 卡斯尔说 → &quot;所以这是一个循环效应。&quot;</p>\n<p><strong>第5段</strong></p>\n<p>短期租赁本身 → 不是问题的关键 → 凯伦·霍恩说：(一位专家：(在可负担住房政策方面))。</p>\n<p>&quot;我认为：(个人能够 → 出租他们的第二套房 → 是一件好事)。→ 如果它本来就是他们的度假屋 + 只是空着 → 为什么不能从中赚钱呢？&quot; → 霍恩说。</p>\n<p>然而，问题出现了 // 当开发商试图 → 创建大规模的：(短期租赁设施) — 事实上的酒店 — 来规避税收和监管。</p>\n<p>&quot;我认为问题是 → 一个开发商不应该吗：(他真正在建造酒店 // 但伪装它：(不是酒店)) → 被对待和征税 + 像酒店一样监管？&quot; → 霍恩说。</p>\n<p><strong>第6段</strong></p>\n<p>在2018年底 → 州长查理·贝克 → 签署了一项法案 → 来控制：(那些潜在的投资者买家)。</p>\n<p>&quot;该法案要求：(每个租赁房东 → 向州注册) + 强制要求他们购买保险 + 开放了可能性：(征收地方税：(在新的州税之上))，&quot; → 波士顿更进一步 → 要求出租者 → 注册：(在该市的检查服务部门)。</p>\n<p><strong>第7段</strong></p>\n<p>霍恩说 → 类似的注册要求 → 可能有益于：(其他苦苦挣扎的城市和城镇)。</p>\n<p>但&quot;如果我们想要 → 做出改变：(在住房市场) → 主要的是 → 我们必须建造 → 更多。&quot;</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Now, / with record-high home prices / and historically low inventory, / there&#39;s an increased urgency / in such regulation, / particularly among those / who worry that / developers will come in / and buy up swaths of housing / to flip for a fortune / on the short-term rental market.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>现在，/ 随着创纪录的高房价 / 和历史性的低库存，/ 有一种增加的紧迫性 / 在这种监管中，/ 特别是在那些人中 / 他们担心 / 开发商会进入 / 并买下大片住房 / 为了巨额利润而转手 / 在短期租赁市场上。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>with交代市场背景，among those who限定担忧最强的一群人，that引出开发商买房转租牟利。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>现在， 随着创纪录的高房价  和历史性的低库存， 有一种增加的紧迫性  在这种监管中， 特别是在那些人中  他们担心  开发商会进入  并买下大片住房  为了巨额利润而转手  在短期租赁市场上。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>高房价与低库存使短租监管更紧迫。</p>\n</blockquote>\n<p>先说明背景和紧迫性，再说谁担心何种投资行为。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>现在，随着创纪录的高房价和历史性的低库存，这种监管变得更加紧迫，特别是那些担心开发商会进入并买下大片住房，然后在短期租赁市场上转手牟取暴利的人。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>regulation的对象是短租，不是说高房价已受到严格控制。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>现在，随着创纪录的高房价和历史性的低库存，这种监管变得更加紧迫，特别是那些担心开发商会进入并买下大片住房，然后在短期租赁市场上转手牟取暴利的人。</p>\n</blockquote>\n<h2>2. 第2段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>The state Legislature / recently voted against / a bill / that would&#39;ve made it illegal / for towns / to create legislation / restricting short-term rentals.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>州立法机构 / 最近投票反对了 / 一项法案 / 该法案本会使其非法 / 对于城镇 / 制定立法 / 限制短期租赁。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先把voted against与bill连好，再处理would have made it illegal和restricting的两层限制。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>州立法机构  最近投票反对了  一项法案  该法案本会使其非法  对于城镇  制定立法  限制短期租赁。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>立法机关否决了会禁止城镇限制短租的法案。</p>\n</blockquote>\n<p>先说法案未通过，再解释如果通过会禁止什么。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>州立法机构最近投票反对了一项法案，该法案本会禁止城镇制定限制短期租赁的立法。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>不能把禁止地方限制短租误读成禁止短租本身。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>州立法机构最近投票反对了一项法案，该法案本会禁止城镇制定限制短期租赁的立法。</p>\n</blockquote>\n<h2>3. 第5段第4句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>&quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>&quot;I think the question is, / shouldn&#39;t a developer / who&#39;s really building a hotel, / but disguising it / as not a hotel, / be treated and taxed / and regulated like a hotel?&quot; / Horn said.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>&quot;我认为问题是，/ 一个开发商不应该吗 / 他真正在建造酒店，/ 但伪装它 / 不是酒店，/ 被对待和征税 / 并像酒店一样监管？&quot; / 霍恩说。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>who修饰developer，but disguising补充名实不符；三个并列被动动作都指实际旅馆经营。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>&quot;我认为问题是， 一个开发商不应该吗  他真正在建造酒店， 但伪装它  不是酒店， 被对待和征税  并像酒店一样监管？&quot;  霍恩说。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>实际建旅馆的开发商应按旅馆被对待、征税和监管。</p>\n</blockquote>\n<p>先辨明开发商在做什么，再说明应承担何种相应义务。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>霍恩说：“我认为问题是，一个真正在建造酒店但伪装成不是酒店的开发商，难道不应该像酒店一样被对待、征税和监管吗？”</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>反问强调同类经营同类监管，不是在提出个人闲房出租的手续。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>霍恩说：“我认为问题是，一个真正在建造酒店但伪装成不是酒店的开发商，难道不应该像酒店一样被对待、征税和监管吗？”</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>26题</h2>\n<blockquote>\n<p>Which of the following is true of New England?</p>\n<p>关于新英格兰，下列哪项说法是正确的？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：区分房价、库存、空置率和监管对象，核对方向及地区范围。</p>\n<p>题干直接问New England。第1段开头是Communities throughout the region，随后写当地短期出租监管以及眼下的住房状况，因此先把第1段从头到尾读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n</blockquote>\n<h3>A. Its housing supply is at a very low level.</h3>\n<blockquote>\n<p>新英格兰地区住房供应很低。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>historically low inventory指可用房源处于历史低位，A概括住房供应很低，未与并列的高房价混淆。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>新英格兰地区住房供应很低。</p>\n</blockquote>\n<p><code>A</code>中的<code>housing supply is at a very low level</code>是在描述住房供应量，回看第1段第2句的<code>historically low inventory</code>，那里明确说现有房源量处在历史低位。</p>\n<p>原文把<code>record-high home prices</code>与<code>historically low inventory</code>并列，前者是房价，后者是现有房源数量。<code>A</code>的<code>housing supply is at a very low level</code>说住房供应量很低，对应的是后一个关系；历史低位能够支持“很低的水平”，没有把价格高低与数量多少混为一谈。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n<p>自Airbnb等网站在2010年代兴起，该地区各社区一直尝试监管短租。如今房价创纪录高、房源库存历史低，监管更加紧迫，尤其有人担心开发商大量买入住房，再在短租市场中转手获利。</p>\n</blockquote>\n<p>短租监管的旧背景之后，Now引出新紧迫性：房价创新高、库存历史低，开发商进一步收购又加重担忧。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Its housing supply is at a very low level.</p>\n<p>新英格兰地区住房供应很低。</p>\n</blockquote>\n<p>A将历史低位概括成很低水平，保留数量对象和方向，不额外声称每个社区所有种类住房都同样不足。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. Its communities are in need of funding.</h3>\n<blockquote>\n<p>新英格兰地区社区需要资金支持。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>社区尝试监管，紧迫性来自房价与房源问题，原文没有把社区经费短缺作为困难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>新英格兰地区社区需要资金支持。</p>\n</blockquote>\n<p><code>B</code>的<code>in need of funding</code>把需要落在资金上；回到第1段，<code>communities</code>正在<code>attempting to regulate</code>，紧接着的<code>an increased urgency in such regulation</code>解释它们眼下要加强的工作，因此核对这两句对社区处境的说明。</p>\n<p>原文说社区一直试图监管短期出租，并用高房价和低房源量说明<code>an increased urgency in such regulation</code>，即监管更加紧迫。<code>B</code>的<code>in need of funding</code>却把社区的处境写成缺少开展工作的资金。住房价格和房源数量是这里推动监管的情况，原文没有把它们接成社区经费不足；把需要监管改成需要资金，改变了需要的具体内容。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n<p>自Airbnb等网站在2010年代兴起，该地区各社区一直尝试监管短租。如今房价创纪录高、房源库存历史低，监管更加紧迫，尤其有人担心开发商大量买入住房，再在短租市场中转手获利。</p>\n</blockquote>\n<p>首段把住房市场变化接到加强短租监管的需要，随后担忧开发商大规模购房转作短租。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Its communities are in need of funding.</p>\n<p>新英格兰地区社区需要资金支持。</p>\n</blockquote>\n<p>B需要社区工作资金不足的说明。房价高可以使居民买房困难，却不能直接推出地方社区需要经费资助。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Its rental vacancy rate is going up slowly.</h3>\n<blockquote>\n<p>新英格兰地区租房空置率缓慢上升。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>文中给出的新罕布什尔空置率是has dropped below 1 percent，即已经降至1%以下，C却说缓慢上升。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>新英格兰地区租房空置率缓慢上升。</p>\n</blockquote>\n<p>文中给出的新罕布什尔空置率是has dropped below 1 percent，即已经降至1%以下，C却说缓慢上升。</p>\n<p>首段低房源背景后，第二段以州内低空置率继续说明市场紧张，并引出对无限制短租的担忧。</p>\n<p>C不仅改了变化方向，也把一个州的数字泛作整个地区的上升趋势。文中没有任何慢速上升的数据支持它。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n<p>新罕布什尔租房空置率已跌破1%，住房倡导者担忧不受约束的短租将进一步压迫本已紧张的市场。州议会最近否决一项法案；该法案若通过，会使城镇制定限制短租的法规成为非法。</p>\n</blockquote>\n<p>首段低房源背景后，第二段以州内低空置率继续说明市场紧张，并引出对无限制短租的担忧。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Its rental vacancy rate is going up slowly.</p>\n<p>新英格兰地区租房空置率缓慢上升。</p>\n</blockquote>\n<p>C不仅改了变化方向，也把一个州的数字泛作整个地区的上升趋势。文中没有任何慢速上升的数据支持它。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Its home prices are under strict control.</h3>\n<blockquote>\n<p>新英格兰地区房价受严格控制。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>监管对象是短期出租，房价创纪录高是监管更紧迫的背景；D将房价改成被严格控制的对象和已实现状态。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>新英格兰地区房价受严格控制。</p>\n</blockquote>\n<p><code>D</code>把<code>home prices</code>与<code>under strict control</code>连在一起，回看第1段的<code>regulate short-term rentals</code>和<code>record-high home prices</code>：前者说监管什么，后者说房价怎样，需要将这两处分清。</p>\n<p>原文<code>regulate short-term rentals</code>的对象是短期出租；<code>record-high home prices</code>则是使这种监管更紧迫的背景。<code>D</code>的<code>under strict control</code>把严格控制直接接到了房价上，又把一直试图开展监管写成已经处在严格控制之下。这里的高房价并不是“控制房价”的宾语，原句也没有给出已实现严格控制的状态。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.</p>\n<p>自Airbnb等网站在2010年代兴起，该地区各社区一直尝试监管短租。如今房价创纪录高、房源库存历史低，监管更加紧迫，尤其有人担心开发商大量买入住房，再在短租市场中转手获利。</p>\n</blockquote>\n<p>communities have been attempting说明持续尝试，Now再说明为何需要更强监管，没有说价格已获稳定控制。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Its home prices are under strict control.</p>\n<p>新英格兰地区房价受严格控制。</p>\n</blockquote>\n<p>D需要房价管制及控制效果的证据。试图管短租不等于严格控制房价，不能把背景与行动对象对调。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>26题结论</h3>\n<blockquote>\n<p><strong>26. A</strong></p>\n</blockquote>\n<ul>\n<li>A：historically low inventory指可用房源处于历史低位，A概括住房供应很低，未与并列的高房价混淆。</li>\n<li>B：社区尝试监管，紧迫性来自房价与房源问题，原文没有把社区经费短缺作为困难。</li>\n<li>C：文中给出的新罕布什尔空置率是has dropped below 1 percent，即已经降至1%以下，C却说缓慢上升。</li>\n<li>D：监管对象是短期出租，房价创纪录高是监管更紧迫的背景；D将房价改成被严格控制的对象和已实现状态。</li>\n</ul>\n<h2>27题</h2>\n<blockquote>\n<p>The bill mentioned in Paragraph 2 was intended to ______.</p>\n<p>第2段提到的法案意在做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>法案目的题：把made it illegal的主体和行为完整接出，并与voted against的投票结果分开。</p>\n<p>题干直接指定Paragraph 2，并问其中的bill。第2段已经完整读过，现在把第2句中法案的内容与议会的投票结果分别读清。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals</p>\n<p>housing advocates fear unchecked short-term rentals will put further pressure on an already strained market</p>\n<p>would&#39;ve made it illegal for towns to create legislation restricting short-term rentals</p>\n</blockquote>\n<h3>A. curb short-term rental speculation</h3>\n<blockquote>\n<p>第2段法案原本意在遏制短租投机。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>法案要禁止城镇制定短租限制，限制对象是地方立法，A却说遏制短租投机，方向相反。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第2段法案原本意在遏制短租投机。</p>\n</blockquote>\n<p>法案要禁止城镇制定短租限制，限制对象是地方立法，A却说遏制短租投机，方向相反。</p>\n<p>made it illegal后接for towns to create legislation，再由restricting修饰这种地方立法，完整宾语不能只读最后的短租限制。</p>\n<p>A需要法案本身抑制短租投机。实际它会削弱地方限制短租的能力；议会voted against只是法案被否决，不改它原先的内容。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n<p>新罕布什尔租房空置率已跌破1%，住房倡导者担忧不受约束的短租将进一步压迫本已紧张的市场。州议会最近否决一项法案；该法案若通过，会使城镇制定限制短租的法规成为非法。</p>\n</blockquote>\n<p>made it illegal后接for towns to create legislation，再由restricting修饰这种地方立法，完整宾语不能只读最后的短租限制。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bill was intended to curb short-term rental speculation.</p>\n<p>第2段法案原本意在遏制短租投机。</p>\n</blockquote>\n<p>A需要法案本身抑制短租投机。实际它会削弱地方限制短租的能力；议会voted against只是法案被否决，不改它原先的内容。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. ensure the supply of cheap housing</h3>\n<blockquote>\n<p>第2段法案原本意在保障低价住房供应。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>住房倡导者担心供给受压，法案却拟禁止城镇限制短租。B将前者的住房诉求错误接为后者的立法目的。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>第2段法案原本意在保障低价住房供应。</p>\n</blockquote>\n<p><code>B</code>的<code>ensure the supply of cheap housing</code>把法案写成住房供应保障措施；回看第2段第1句的<code>housing advocates fear</code>和第2句的<code>illegal for towns to create</code>，分清住房倡导者的担心与法案实际要做的事。</p>\n<p>原文先写住房倡导者担心不受约束的短租会给市场增加压力，再写法案要使城镇制定短租限制成为非法，即<code>illegal for towns to create</code>。<code>B</code>的<code>ensure the supply of cheap housing</code>把对市场压力的担忧接成这项法案保障廉价住房供应的目的。原句给法案安排的是阻止城镇限制短租，并没有把住房供应的保障安排给它；住房倡导者的担心不能直接变成这项法案的目的。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n<p>新罕布什尔租房空置率已跌破1%，住房倡导者担忧不受约束的短租将进一步压迫本已紧张的市场。州议会最近否决一项法案；该法案若通过，会使城镇制定限制短租的法规成为非法。</p>\n</blockquote>\n<p>第二段先交代低空置率及无限制短租的风险，再介绍阻止地方立法的法案遭否决。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bill was intended to ensure the supply of cheap housing.</p>\n<p>第2段法案原本意在保障低价住房供应。</p>\n</blockquote>\n<p>B需要保障低价住房供应的具体安排。不能把住房压力的背景与任何随后出现的法案都连成支持供给的关系。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. punish illegal dealings in housing</h3>\n<blockquote>\n<p>第2段法案原本意在惩罚非法住房交易。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>illegal限定的是城镇制定限制短租的法规，未把住房交易判为违法，更未提出惩罚交易者。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>第2段法案原本意在惩罚非法住房交易。</p>\n</blockquote>\n<p>illegal限定的是城镇制定限制短租的法规，未把住房交易判为违法，更未提出惩罚交易者。</p>\n<p>would&#39;ve made it illegal说明若通过将新增一种禁止，for towns清楚给出受限制主体。</p>\n<p>C需要非法交易与处罚两层内容。实际法案在限制地方规则，不是在执行打击非法交易的处罚。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n<p>新罕布什尔租房空置率已跌破1%，住房倡导者担忧不受约束的短租将进一步压迫本已紧张的市场。州议会最近否决一项法案；该法案若通过，会使城镇制定限制短租的法规成为非法。</p>\n</blockquote>\n<p>would&#39;ve made it illegal说明若通过将新增一种禁止，for towns清楚给出受限制主体。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bill was intended to punish illegal dealings in housing.</p>\n<p>第2段法案原本意在惩罚非法住房交易。</p>\n</blockquote>\n<p>C需要非法交易与处罚两层内容。实际法案在限制地方规则，不是在执行打击非法交易的处罚。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. allow a free short-term rental market</h3>\n<blockquote>\n<p>第2段法案原本意在允许较自由的短租市场。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>禁止城镇对短租立法设限，等于放开这类地方约束，D概括较自由的短租市场这一方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第2段法案原本意在允许较自由的短租市场。</p>\n</blockquote>\n<p>禁止城镇对短租立法设限，等于放开这类地方约束，D概括较自由的短租市场这一方向。</p>\n<p>法案内容位于that从句，投票反对位于主句，读清二者便能分开政策意图与最终命运。</p>\n<p>free在这里针对地方短租限制，不必扩大为免除所有税收或法律；虽法案被否决，其原本意图仍是放松限制。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n<p>新罕布什尔租房空置率已跌破1%，住房倡导者担忧不受约束的短租将进一步压迫本已紧张的市场。州议会最近否决一项法案；该法案若通过，会使城镇制定限制短租的法规成为非法。</p>\n</blockquote>\n<p>法案内容位于that从句，投票反对位于主句，读清二者便能分开政策意图与最终命运。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The bill was intended to allow a free short-term rental market.</p>\n<p>第2段法案原本意在允许较自由的短租市场。</p>\n</blockquote>\n<p>free在这里针对地方短租限制，不必扩大为免除所有税收或法律；虽法案被否决，其原本意图仍是放松限制。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>27题结论</h3>\n<blockquote>\n<p><strong>27. D</strong></p>\n</blockquote>\n<ul>\n<li>A：法案要禁止城镇制定短租限制，限制对象是地方立法，A却说遏制短租投机，方向相反。</li>\n<li>B：住房倡导者担心供给受压，法案却拟禁止城镇限制短租。B将前者的住房诉求错误接为后者的立法目的。</li>\n<li>C：illegal限定的是城镇制定限制短租的法规，未把住房交易判为违法，更未提出惩罚交易者。</li>\n<li>D：禁止城镇对短租立法设限，等于放开这类地方约束，D概括较自由的短租市场这一方向。</li>\n</ul>\n<h2>28题</h2>\n<blockquote>\n<p>Compared with Castle, Taylor is more likely to support ______.</p>\n<p>与卡斯尔相比，泰勒更可能支持什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>人物观点比较题：分别抓Taylor的工人住房需求与Castle的游客及旅游就业联系。</p>\n<p>题干直接给出Castle和Taylor。第3段引述Taylor，第4段引述Castle，先完整精读这两个自然段，把两人各自强调的住房问题读清。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>We are at a crisis level on the supply of rental housing</p>\n<p>workers are having a hard time finding a place to live</p>\n<p>short-term rentals also provide housing for tourists</p>\n</blockquote>\n<h3>A. further investment in local tourism</h3>\n<blockquote>\n<p>相比Castle，Taylor更可能支持进一步投资本地旅游业。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>旅游与短租支持行业就业是Castle强调的一面，Taylor强调工人住房不足；A还额外指定进一步旅游投资。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>相比Castle，Taylor更可能支持进一步投资本地旅游业。</p>\n</blockquote>\n<p><code>A</code>的<code>further investment in local tourism</code>指向旅游业，回看第4段<code>Castle</code>的<code>workers are servicing the tourist industry</code>，再对照第3段<code>Taylor</code>说的<code>supply of rental housing</code>；两人的话必须合起来才能判断“更可能”。</p>\n<p><code>Taylor</code>从<code>supply of rental housing</code>处在危机程度谈到工人找不到住处，强调的是劳动者的居住困难。<code>Castle</code>说短租给游客住，并且<code>workers are servicing the tourist industry</code>，强调游客、短租与旅游就业的联系。<code>A</code>的<code>further investment in local tourism</code>却把加大旅游投资归成<code>Taylor</code>更倾向的主张；它把<code>Castle</code>展开的旅游业一侧接给了<code>Taylor</code>，而且把已有的行业联系加成进一步投资的行动。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n<p>住房组织负责人Nick Taylor说，租赁住房供给已处危机，拿走社区应对问题的工具，可能让本已极度紧张的市场进一步失去供给。他指出，新罕布什尔南部城镇可负担住房不足，使雇主难招人，工人难找到住处。</p>\n<p>当地房地产经纪人协会负责人Ryan Castle指出，短租也给游客提供住房。他说，很多工人服务旅游业，而短期到访者又支持旅游业，所以这有一种循环作用。</p>\n</blockquote>\n<p>Taylor从住房供给危机讲到雇主招工难与工人无处住，However随后让Castle补充游客住宿的价值。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Taylor would support further investment in local tourism.</p>\n<p>相比Castle，Taylor更可能支持进一步投资本地旅游业。</p>\n</blockquote>\n<p>A需要Taylor比Castle更主张新增旅游投资的证据。两人关注点及原文未提出投资计划，都不支持这种比较。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. an increase in affordable housing</h3>\n<blockquote>\n<p>相比Castle，Taylor更可能支持增加可负担住房。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>Taylor将雇主招工难、工人居住难归于可负担住房不足，因此增加这类住房是最贴近其担忧的方向。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>相比Castle，Taylor更可能支持增加可负担住房。</p>\n</blockquote>\n<p><code>B</code>的<code>an increase in affordable housing</code>要增加人们负担得起的住处，回看第3段<code>Without enough affordable housing</code>及随后的雇主、工人困难，再与第4段<code>Castle</code>强调的<code>provide housing for tourists</code>对照。</p>\n<p><code>Taylor</code>用<code>Without enough affordable housing</code>说明可负担住房不足，随后列出雇主招人难、工人找住处难两种后果。<code>Castle</code>则补充短租<code>provide housing for tourists</code>，强调游客住宿这一用途。<code>B</code>的<code>an increase in affordable housing</code>针对的正是<code>Taylor</code>指出的不足，从缺少这类住房造成困难，可以推知他更倾向增加它的供应；这是从他的担忧推出的主张，不是原文逐字记录的一项提案。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n<p>住房组织负责人Nick Taylor说，租赁住房供给已处危机，拿走社区应对问题的工具，可能让本已极度紧张的市场进一步失去供给。他指出，新罕布什尔南部城镇可负担住房不足，使雇主难招人，工人难找到住处。</p>\n<p>当地房地产经纪人协会负责人Ryan Castle指出，短租也给游客提供住房。他说，很多工人服务旅游业，而短期到访者又支持旅游业，所以这有一种循环作用。</p>\n</blockquote>\n<p>与Taylor强调居民工人住房相对，Castle用游客住宿和旅游产业循环说明短租也有作用。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Taylor would support an increase in affordable housing.</p>\n<p>相比Castle，Taylor更可能支持增加可负担住房。</p>\n</blockquote>\n<p>B由不足与后果推合理应对，不是说Taylor逐字提出了增建法案，也不声称Castle反对所有可负担住房。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. strict management of real estate agents</h3>\n<blockquote>\n<p>相比Castle，Taylor更可能支持严格管理房地产经纪人。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>两人比较的是居民住房与游客住宿的需求，未将供给问题归因于经纪人行为或提出严格管理经纪人的办法。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>相比Castle，Taylor更可能支持严格管理房地产经纪人。</p>\n</blockquote>\n<p><code>C</code>的<code>strict management of real estate agents</code>把措施指向经纪人的行为；回到第3段<code>Taylor</code>的<code>a crisis level on the supply of rental housing</code>及第4段<code>Castle</code>的<code>housing for tourists</code>，核对两人的分歧是否落在管理经纪人上。</p>\n<p><code>Taylor</code>说<code>a crisis level on the supply of rental housing</code>，接着把工人居住困难与可负担住房不够相连；<code>Castle</code>则指出短租提供<code>housing for tourists</code>。<code>C</code>的<code>strict management of real estate agents</code>把这组“工人住处与游客住宿”的关注差别，换成“是否严格管理房地产经纪人”的分歧。两人的发言并没有把经纪人的行为接成供给危机的原因，也没有把管理经纪人接成各自主张的解决办法。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n<p>住房组织负责人Nick Taylor说，租赁住房供给已处危机，拿走社区应对问题的工具，可能让本已极度紧张的市场进一步失去供给。他指出，新罕布什尔南部城镇可负担住房不足，使雇主难招人，工人难找到住处。</p>\n<p>当地房地产经纪人协会负责人Ryan Castle指出，短租也给游客提供住房。他说，很多工人服务旅游业，而短期到访者又支持旅游业，所以这有一种循环作用。</p>\n</blockquote>\n<p>Castle的协会身份说明发言者是谁，发言内容则仍谈短租与旅游就业，Taylor也围绕住房供应。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Taylor would support strict management of real estate agents.</p>\n<p>相比Castle，Taylor更可能支持严格管理房地产经纪人。</p>\n</blockquote>\n<p>C需要管理经纪人的措施及Taylor更支持的态度。人物属于经纪协会，不能使所有讨论都变成是否监管经纪人的分歧。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. a favorable policy for short-term workers</h3>\n<blockquote>\n<p>相比Castle，Taylor更可能支持制定有利于短期工人的政策。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Taylor说workers没有限定短期雇用；Castle的coming in short term接游客短住，D把停留时间移成工人的就业类型。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>相比Castle，Taylor更可能支持制定有利于短期工人的政策。</p>\n</blockquote>\n<p><code>D</code>的<code>short-term workers</code>把“短期”用来限定工人，回看第3段<code>Taylor</code>的<code>workers are having a hard time finding a place to live</code>，以及第4段<code>Castle</code>的<code>those people coming in short term</code>，确认短期描述的是哪一群人。</p>\n<p><code>Taylor</code>说<code>workers are having a hard time finding a place to live</code>，谈工人缺少住处，并未把他们限定为短期雇用的工人。<code>Castle</code>先说短租给游客住，再提<code>those people coming in short term</code>，短期停留承接的是游客一侧。<code>D</code>的<code>short-term workers</code>把这种停留时间接到了工人的用工类型上，再把它写成<code>Taylor</code>更支持的政策对象；这不是两人的话所划出的对象。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said.\nHowever, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n<p>住房组织负责人Nick Taylor说，租赁住房供给已处危机，拿走社区应对问题的工具，可能让本已极度紧张的市场进一步失去供给。他指出，新罕布什尔南部城镇可负担住房不足，使雇主难招人，工人难找到住处。</p>\n<p>当地房地产经纪人协会负责人Ryan Castle指出，短租也给游客提供住房。他说，很多工人服务旅游业，而短期到访者又支持旅游业，所以这有一种循环作用。</p>\n</blockquote>\n<p>Taylor担忧劳动者无住房，Castle补游客来到当地消费与旅游岗位相互关联。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Taylor would support a favorable policy for short-term workers.</p>\n<p>相比Castle，Taylor更可能支持制定有利于短期工人的政策。</p>\n</blockquote>\n<p>D需要专门面向临时工的政策。短租、短住与短期劳动合同是不同概念，不能因都出现short-term便合并对象。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>28题结论</h3>\n<blockquote>\n<p><strong>28. B</strong></p>\n</blockquote>\n<ul>\n<li>A：旅游与短租支持行业就业是Castle强调的一面，Taylor强调工人住房不足；A还额外指定进一步旅游投资。</li>\n<li>B：Taylor将雇主招工难、工人居住难归于可负担住房不足，因此增加这类住房是最贴近其担忧的方向。</li>\n<li>C：两人比较的是居民住房与游客住宿的需求，未将供给问题归因于经纪人行为或提出严格管理经纪人的办法。</li>\n<li>D：Taylor说workers没有限定短期雇用；Castle的coming in short term接游客短住，D把停留时间移成工人的就业类型。</li>\n</ul>\n<h2>29题</h2>\n<blockquote>\n<p>What does Horn emphasize in Paragraph 5?</p>\n<p>霍恩在第5段强调了什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>强调重点题：以however区分个人闲房出租与开发商事实旅馆，找最后反问的要求。</p>\n<p>题干明确指定Horn和Paragraph 5。第5段整段都是对Horn观点的介绍与引述，先从短租本身并非关键读到她对开发商的提问。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations</p>\n<p>be treated and taxed and regulated like a hotel</p>\n<p>de facto hotels—to bypass taxes and regulations</p>\n</blockquote>\n<h3>A. The urgency to upgrade short-term rental facilities.</h3>\n<blockquote>\n<p>Horn在第5段强调紧急升级短租设施。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>Horn要求将事实旅馆按旅馆征税监管，问题在规避义务，不在设施陈旧。A改成紧急升级设施。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>Horn在第5段强调紧急升级短租设施。</p>\n</blockquote>\n<p><code>A</code>的<code>upgrade short-term rental facilities</code>是在要求改善设施，回看第5段<code>Horn</code>说问题出现在哪里，以及结尾的<code>treated and taxed and regulated like a hotel</code>，检查她要求改变的是设施还是经营者受到的管理。</p>\n<p>原文指出开发商把大规模短租做成事实上的旅馆以绕过税收和监管，因此<code>Horn</code>追问是否应<code>treated and taxed and regulated like a hotel</code>，要求按旅馆对待、征税和监管。<code>A</code>的<code>upgrade short-term rental facilities</code>把这个要求换成升级短租设施，还加入升级的紧迫性。问题在于经营者绕开旅馆所受的税收和监管，不在于设施陈旧或需要升级。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n<p>可负担住房政策专家Keren Horn说，短租本身不是问题关键。个人能出租第二套住房是好事，度假屋既然空着，为什么不能靠它挣钱？但当开发商试图建大规模短租设施，即事实上的旅馆，来绕过税收监管，问题就出现了。她反问：实质上建旅馆却伪装成不是旅馆的开发商，难道不该像旅馆一样被对待、征税和监管吗？</p>\n</blockquote>\n<p>先认可个人出租空房，再以however转向开发商大规模经营伪装非旅馆的做法，最后反问应否同等监管。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Horn emphasises the urgency to upgrade short-term rental facilities.</p>\n<p>Horn在第5段强调紧急升级短租设施。</p>\n</blockquote>\n<p>A需要设施品质落后和必须尽快改造的内容。经营规模大并不等于设施差，更不能据此添加urgency。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. The efficient operation of the local housing market.</h3>\n<blockquote>\n<p>Horn在第5段强调当地住房市场高效运作。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>当地市场效率是宽泛评价，Horn具体强调开发商不能用身份伪装绕税绕监管，B遗漏这一关键关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short- essity to stop developers from evading taxes.</h3>\n<blockquote>\n<p>Horn在第5段强调阻止开发商逃避纳税的必要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>开发商以大规模短租掩饰旅馆来bypass taxes，Horn要求taxed like a hotel，C保留阻止避税这一明确诉求。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Horn在第5段强调阻止开发商逃避纳税的必要性。</p>\n</blockquote>\n<p><code>C</code>的<code>stop developers from evading taxes</code>对应第5段开发商<code>to bypass taxes and regulations</code>的目的，再看结尾<code>taxed and regulated like a hotel</code>，前者说明问题，后者说明她要求怎样处理。</p>\n<p>原文先把开发商<code>to bypass taxes and regulations</code>的做法列为问题，再用反问要求实际上建旅馆的人被<code>taxed and regulated like a hotel</code>，即不能因伪装成别的经营形式就逃开旅馆的纳税与监管。<code>C</code>的<code>stop developers from evading taxes</code>提取其中应阻止开发商避税这一要求。“必要性”对应她的<code>shouldn’t</code>反问所表达的应当，而选项没有声称她只关心税收。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when 人回到第5段<code>rent out their second home</code>和<code>it’s just empty</code>，那里确实谈个人出租闲置房屋；再连着后面的<code>Issues arise</code>, <code>however</code>读，分清这一例子在段中起什么作用。</p>\n<p>原文用<code>rent out their second home</code>说明个人出租第二套住房是好事，并以闲着也可挣钱解释这种认可；这不是在列出租房步骤。随后<code>Issues arise</code>, <code>however</code>把重点转向开发商以事实旅馆绕过税收和监管。<code>D</code>的<code>proper procedures for renting out spare houses</code>却把前面的许可与肯定写成对出租程序的指导，并让它承担整段强调的内容。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n<p>可负担住房政策专家Keren Horn说，短租本身不是问题关键。个人能出租第二套住房是好事，度假屋既然空着，为什么不能靠它挣钱？但当开发商试图建大规模短租设施，即事实上的旅馆，来绕过税收监管，问题就出现了。她反问：实质上建旅馆却伪装成不是旅馆的开发商，难道不该像旅馆一样被对待、征税和监管吗？</p>\n</blockquote>\n<p>Horn先区分个人利用闲房与大规模事实旅馆，再提出针对后者的税收监管要求。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Horn emphasises the proper procedures for renting out spare houses.</p>\n<p>Horn在第5段强调出租闲房的适当程序。</p>\n</blockquote>\n<p>D需要出租闲房的步骤或规范指引。允许闲房挣钱不是流程说明，也不能以铺垫部分替代后半段的重点。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>29题结论</h3>\n<blockquote>\n<p><strong>29. C</strong></p>\n</blockquote>\n<ul>\n<li>A：Horn要求将事实旅馆按旅馆征税监管，问题在规避义务，不在设施陈旧。A改成紧急升级设施。</li>\n<li>B：当地市场效率是宽泛评价，Horn具体强调开发商不能用身份伪装绕税绕监管，B遗漏这一关键关系。</li>\n<li>C：开发商以大规模短租掩饰旅馆来bypass taxes，Horn要求taxed like a hotel，C保留阻止避税这一明确诉求。</li>\n<li>D：个人出租空置第二套住房是被认可的行为，原段没有讲操作程序；真正强调的在however后的开发商规避。</li>\n</ul>\n<h2>30题</h2>\n<blockquote>
