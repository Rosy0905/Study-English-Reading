r local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.\nHorn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n<p>2018年底，州长Charlie Baker签署法案约束潜在投资买家。法案要求每位出租者向州登记、购买保险，并在新增州税之外为地方征税打开可能。波士顿进一步要求向市检查服务部门登记。</p>\n<p>Horn认为，类似登记要求可帮助其他陷入困难的城市和城镇。但若要改变住房市场，最主要的行动是大幅增加建房。</p>\n</blockquote>\n<p>第六段给已有登记要求，第七段肯定可向其他城镇借鉴，再补改变市场需大幅增加供给。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Registration is an irrational decision.</p>\n<p>Horn认为登记要求是不理性的决定。</p>\n</blockquote>\n<p>A需要否定登记合理性的评价。措施不足以单独解决问题，并不等于决定本身不理性或应撤销。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. an unfeasible proposal</h3>\n<blockquote>\n<p>Horn认为登记要求是不可行的提议。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>已有州及城市要求登记，Horn谈类似措施可能有益，未指出登记无法实施，B把效果有限换成不可行。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.\nHorn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>Horn认为登记要求是不可行的提议。</p>\n</blockquote>\n<p><code>B</code>的<code>an unfeasible proposal</code>质疑能否实行，回看第6段<code>The bill requires every rental host to register</code>和第7段<code>similar registration requirements could benefit</code>，前者说明已有的做法，后者是<code>Horn</code>对类似做法的评价。</p>\n<p>第6段<code>The bill requires every rental host to register</code>明确把登记写成法案中的要求，波士顿也提出向市部门登记；第7段<code>Horn</code>认为类似要求<code>could benefit</code>一些城镇。<code>B</code>的<code>an unfeasible proposal</code>却说她将登记视为不可行。原文以已有的要求为基础谈类似措施的好处，<code>Horn</code>之后强调多建房，并不是指出登记无法实行的障碍。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.\nHorn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n<p>2018年底，州长Charlie Baker签署法案约束潜在投资买家。法案要求每位出租者向州登记、购买保险，并在新增州税之外为地方征税打开可能。波士顿进一步要求向市检查服务部门登记。</p>\n<p>Horn认为，类似登记要求可帮助其他陷入困难的城市和城镇。但若要改变住房市场，最主要的行动是大幅增加建房。</p>\n</blockquote>\n<p>作者先列登记、保险和税费安排，再由Horn转向其他受压地区可借鉴的做法。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Registration is an unfeasible proposal.</p>\n<p>Horn认为登记要求是不可行的提议。</p>\n</blockquote>\n<p>B需要操作障碍使登记不能实施的证据。多建房更重要属于应对供给的主次判断，不是登记可行性被否定。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. an unnecessary measure</h3>\n<blockquote>\n<p>Horn认为登记要求是没有必要的措施。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>有更主要的增建住房行动，不等于登记没有必要；Horn先承认它能带来益处，没有作取消其必要性的判断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.\nHorn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>Horn认为登记要求是没有必要的措施。</p>\n</blockquote>\n<p><code>C</code>的<code>an unnecessary measure</code>否定登记的必要性，回看第7段<code>could benefit</code>和<code>the main one</code>，检查<code>Horn</code>把“最主要”落在建房上时，究竟怎样看待登记。</p>\n<p>原文先承认登记<code>could benefit</code>一些城镇，再用<code>the main one</code>强调改变住房市场最主要要靠多建房。<code>C</code>的<code>an unnecessary measure</code>把“另有更主要的行动”改成“登记本身没有必要”。可能有益并不自动等于必不可少，但<code>Horn</code>这里比较的是登记与建房各自对解决问题的作用，没有从建房更主要推出登记不必要。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.\nHorn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n<p>2018年底，州长Charlie Baker签署法案约束潜在投资买家。法案要求每位出租者向州登记、购买保险，并在新增州税之外为地方征税打开可能。波士顿进一步要求向市检查服务部门登记。</p>\n<p>Horn认为，类似登记要求可帮助其他陷入困难的城市和城镇。但若要改变住房市场，最主要的行动是大幅增加建房。</p>\n</blockquote>\n<p>could benefit保留登记作用，the main one将核心供给改善任务放到建房上。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Registration is an unnecessary measure.</p>\n<p>Horn认为登记要求是没有必要的措施。</p>\n</blockquote>\n<p>有用未必逻辑上必不可少，但本题也没有证据支持unnecessary；原文比较的是是否足以解决住房短缺，D更准确。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. an inadequate solution</h3>\n<blockquote>\n<p>Horn认为登记要求是不充分的解决办法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>登记可能有益，但要改变住房市场主要仍须多建房，说明登记本身不足以解决核心供给问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.\nHorn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Horn认为登记要求是不充分的解决办法。</p>\n</blockquote>\n<p><code>D</code>的<code>an inadequate solution</code>是在说靠登记还不够，回看第7段<code>but</code>后面的<code>we have to build a lot more</code>，并连着前面的<code>could benefit</code>读，核对登记的用处与改变市场还需要什么。</p>\n<p>原文承认登记可能有益，却随即说若要改变住房市场，<code>we have to build a lot more</code>，而且这才是主要行动。<code>D</code>的<code>an inadequate solution</code>不否认登记会有好处，只说登记不足以承担解决问题的任务。<code>could benefit</code>与<code>but</code>后的建房要求合在一起，说明有用的登记还需要由增加住房供给来补足。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.\nHorn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n<p>2018年底，州长Charlie Baker签署法案约束潜在投资买家。法案要求每位出租者向州登记、购买保险，并在新增州税之外为地方征税打开可能。波士顿进一步要求向市检查服务部门登记。</p>\n<p>Horn认为，类似登记要求可帮助其他陷入困难的城市和城镇。但若要改变住房市场，最主要的行动是大幅增加建房。</p>\n</blockquote>\n<p>相似登记要求可帮助其他城市是肯定，But后的建房要求限定这种帮助能走多远。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Registration is an inadequate solution.</p>\n<p>Horn认为登记要求是不充分的解决办法。</p>\n</blockquote>\n<p>inadequate不是毫无用处，而是不充分，能同时容纳could benefit和have to build a lot more两层意思。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>30题结论</h3>\n<blockquote>\n<p><strong>30. D</strong></p>\n</blockquote>\n<ul>\n<li>A：could benefit肯定登记可能有益，But随后说更主要还需建房，未把登记评价成不理性。</li>\n<li>B：已有州及城市要求登记，Horn谈类似措施可能有益，未指出登记无法实施，B把效果有限换成不可行。</li>\n<li>C：有更主要的增建住房行动，不等于登记没有必要；Horn先承认它能带来益处，没有作取消其必要性的判断。</li>\n<li>D：登记可能有益，但要改变住房市场主要仍须多建房，说明登记本身不足以解决核心供给问题。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：短期租赁监管的背景与紧迫性</strong>（段落1-2问题提出） 历史背景：2010年代Airbnb等兴起→社区试图监管 → 当前危机：【高房价 + 低库存→监管更紧迫（担心开发商买房转手牟利）】→ 新罕布什尔州案例：（空置率&lt;1% + 州立法机构反对限制法案）</p>\n<p>↓（利益相关者观点）</p>\n<p><strong>逻辑层次2：住房倡导者的担忧</strong>（段落3 Taylor观点） 危机认定：租赁住房供应处于危机水平 → 限制监管工具 = 减少市场供应 → 连锁效应：【雇主难以吸引员工 + 工人难以找到住所】</p>\n<p>//（对立观点）</p>\n<p><strong>逻辑层次3：房地产行业的辩护</strong>（段落4 Castle观点） 短期租赁的积极作用：为游客提供住房 → 循环效应：【工人服务旅游业 ← → 旅游业依赖短期访客】</p>\n<p>↓（问题本质分析）</p>\n<p><strong>逻辑层次4：问题的真正症结</strong>（段落5 Horn分析） 个人短期租赁 ≠ 问题关键（度假屋空置不如出租）// 真正问题：开发商建造大规模短期租赁设施（事实上的酒店）→ 目的：规避税收和监管 → 核心问题：应该像酒店一样对待吗？</p>\n<p>↓（政策回应）</p>\n<p><strong>逻辑层次5：监管措施与根本解决方案</strong>（段落6-7政策与建议） 2018年贝克州长法案：【注册要求 + 强制保险 + 地方税可能】→ 波士顿更严格（市级注册）→ Horn评价：注册有益但不够 → 根本解决方案：必须建造更多住房</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：短期租赁监管争议反映了住房供应危机的深层矛盾——虽然监管措施（如注册要求）可能有所帮助，但真正的解决方案在于增加住房供应，而非简单地限制短期租赁。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. Regulating disguised hotels rather than ordinary spare-home letting</p>\n<p>B. Why registration alone cannot supply enough homes</p>\n<p>C. Housing scarcity makes short-term rental rules urgent</p>\n<p>D. Workers’ housing needs alongside tourists’ accommodation needs</p>\n<p>E. The abolition of every local power over rentals</p>\n<p>F. Concrete requirements imposed on rental hosts</p>\n<p>G. A demand to close the entire tourism industry</p>\n<p><strong>41.</strong></p>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#39;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market. In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n<p><strong>42.</strong></p>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said. However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n<p><strong>43.</strong></p>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n<p><strong>44.</strong></p>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.</p>\n<p><strong>45.</strong></p>\n<p>Horn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】C. Housing scarcity makes short-term rental rules urgent</p>\n<blockquote>\n<p>住房稀缺使短租监管更紧迫</p>\n</blockquote>\n<p>高房价低库存增加监管紧迫性，新罕布什尔空置率低又加剧担忧，立法机关否决禁止地方限制的法案。</p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s.</p>\n</blockquote>\n<p>平台兴起之后社区已尝试监管，Now由高房价、低库存说明需求更紧迫。</p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market.</p>\n</blockquote>\n<p>新罕布什尔空置率低于1%，具体解释市场为何紧张及无限制短租可能造成的压力。</p>\n<blockquote>\n<p>The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n</blockquote>\n<p>法案禁止城镇限制短租，而voted against说明议会否决它，保留地方工具；标题应围绕住房稀缺推动监管。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>平台扩张与房源紧张 → 空置率很低、担忧压力 → 保留地方限制短租工具</p>\n</blockquote>\n<p>scarcity对应low inventory和vacancy below 1%，urgent对应对供给压力的担忧。</p>\n<p>再看最强干扰项E：The abolition of every local power over rentals。</p>\n<p>禁止地方监管的法案被否决，不能写成地方权力已被废除。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】D. Workers’ housing needs alongside tourists’ accommodation needs</p>\n<blockquote>\n<p>劳动者住房需求与游客住宿需求并存</p>\n</blockquote>\n<p>Taylor强调可负担住房不足影响招工和居住，Castle则强调短租服务游客且旅游业也支持工人。</p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast.</p>\n</blockquote>\n<p>Taylor将拿走地方工具与供给进一步减少相连，工人住房不足又会影响雇主招聘。</p>\n<blockquote>\n<p>However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors.</p>\n</blockquote>\n<p>However切换到Castle补充的另一面：短租也承担游客住宿需求。</p>\n<blockquote>\n<p>&quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n<p>旅游者支持行业、工人服务行业，cyclical effect解释旅游与就业联系，标题应容纳两种需求而非判任何短租都无益。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>居民工人住房不足 → 游客也需要短住 → 旅游消费与就业相互支持</p>\n</blockquote>\n<p>alongside保留两种关注点的对照，不把短期游客误作短期雇工。</p>\n<p>再看最强干扰项G：A demand to close the entire tourism industry。</p>\n<p>双方都谈旅游和劳动者的需要，没人要求关闭整个行业。</p>\n<p><strong>42题选D。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】A. Regulating disguised hotels rather than ordinary spare-home letting</p>\n<blockquote>\n<p>监管伪装成短租的旅馆而非普通闲房出租</p>\n</blockquote>\n<p>Horn认可个人出租空置度假屋，但反对开发商以短租名义做实际旅馆、绕税绕监管。</p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy.</p>\n</blockquote>\n<p>not the crux先否定短租本身就是全部问题，为区分不同经营方式作准备。</p>\n<blockquote>\n<p>&quot;If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said.</p>\n</blockquote>\n<p>空度假屋供个人出租是闲置资产利用，Horn在这里表示认可，没有讲具体出租流程。</p>\n<blockquote>\n<p>&quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n</blockquote>\n<p>最后反问针对事实旅馆的开发商，要求按经营实质承担税收监管，标题要保留普通出租与规避义务经营的区别。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>认可个人闲房出租 → 大规模事实旅馆规避义务 → 应按旅馆征税监管</p>\n</blockquote>\n<p>disguised hotels对应de facto hotels与disguising，rather than区分个人正常使用。</p>\n<p>再看最强干扰项F：Concrete requirements imposed on rental hosts。</p>\n<p>此段说明监管应针对的实质，下一段才列具体登记保险要求。</p>\n<p><strong>43题选A。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】F. Concrete requirements imposed on rental hosts</p>\n<blockquote>\n<p>对出租者施加的具体要求</p>\n</blockquote>\n<p>州法规定登记、保险、税收，并介绍Boston进一步的登记安排。</p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers.</p>\n</blockquote>\n<p>法案为约束潜在投资买家引入，说明监管措施针对投资扩张风险。</p>\n<blockquote>\n<p>&quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.</p>\n</blockquote>\n<p>登记、保险和地方税可能性是具体要求，Boston进一步市级登记则补充地方行动。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>约束投资买家 → 州级登记保险税费 → 城市进一步登记</p>\n</blockquote>\n<p>concrete requirements涵盖三个可执行条件，不只是抽象主张。</p>\n<p>再看最强干扰项E：The abolition of every local power over rentals。</p>\n<p>地方要求进一步增加，与废除地方监管相反。</p>\n<p><strong>44题选F。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】B. Why registration alone cannot supply enough homes</p>\n<blockquote>\n<p>为何仅登记不能提供足够住房</p>\n</blockquote>\n<p>Horn承认登记可能有益，但把真正改变市场的主要办法放在大幅增加建房。</p>\n<blockquote>\n<p>Horn said similar registration requirements could benefit other struggling cities and towns.</p>\n</blockquote>\n<p>could benefit先肯定类似登记要求可帮助其他受压地区，不能将它解成无用。</p>\n<blockquote>\n<p>But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n</blockquote>\n<p>But将作用限制转向核心供给：真正改变市场仍需多建房，标题要表达有益但不足。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>登记可能有益 → 核心住房供给仍不足 → 主要还需多建房</p>\n</blockquote>\n<p>alone不能解决供给量问题，登记有用与仍需增建可以并存。</p>\n<p>再看最强干扰项G：A demand to close the entire tourism industry。</p>\n<p>增加住房不是关闭旅游业。</p>\n<p><strong>45题选B。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>Short-term letting has become harder to regulate as housing grows more expensive and scarce. Communities worry that investors may buy large numbers of homes for the tourist market. This concern connects the expansion of online rental platforms with pressure on the supply available to residents.</p>\n<p><strong>B.</strong></p>\n<p>Avoiding those obligations is the reason to demand appropriate taxation and regulation. Registration, insurance and local levies can make the actual scale and character of a business more visible. Existing state and city requirements provide examples of how authorities have responded to investor-led expansion.</p>\n<p><strong>C.</strong></p>\n<p>A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business. The first can make productive use of a property that would otherwise stand empty. The second may operate as a hotel while avoiding the obligations normally attached to hotels.</p>\n<p><strong>D.</strong></p>\n<p>For housing advocates, removing such tools risks making an already strained market worse. Without affordable homes, employers struggle to attract staff and workers struggle to find somewhere to live. Their concern is therefore about both residential security and the local labour supply.</p>\n<p><strong>E.</strong></p>\n<p>The tourist economy adds another side to the argument. Visitors need accommodation, and local jobs depend on services provided to those visitors. Short-term rentals can support this activity, so their contribution cannot be assessed only by treating every visitor’s stay as a loss to the community.</p>\n<p><strong>F.</strong></p>\n<p>These requirements can help other places under pressure, but they do not create a large stock of new homes. A registration system changes how rentals are monitored. It is therefore a limited response when the main problem remains insufficient housing supply.</p>\n<p><strong>G.</strong></p>\n<p>The pressure is especially visible where rental vacancy rates are extremely low. In New Hampshire, a proposed bill would have prevented towns from restricting short-term rentals. Legislators rejected it, preserving a tool that local communities could use to respond to the shortage.</p>\n<p><strong>H.</strong></p>\n<p>Changing that supply requires substantially more building. This conclusion does not imply that registration is irrational or unnecessary; it places the measures in order of importance. Effective oversight and additional homes address different parts of the housing problem.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>由短租扩张引出本地住房供给压力</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明征税监管与登记保险措施</td>\n</tr>\n<tr>\n<td>C</td>\n<td>区分个人闲房出租与开发商旅馆式经营</td>\n</tr>\n<tr>\n<td>D</td>\n<td>说明可负担住房不足影响劳动者及雇主</td>\n</tr>\n<tr>\n<td>E</td>\n<td>补充短租对游客和旅游就业的作用</td>\n</tr>\n<tr>\n<td>F</td>\n<td>承认登记有用并指出其供给局限</td>\n</tr>\n<tr>\n<td>G</td>\n<td>以低空置率和法案表明地方监管工具作用</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结需建更多住房并区分措施主次</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>由短租扩张引出本地住房供给压力 → 以低空置率和法案表明地方监管工具作用 → 说明可负担住房不足影响劳动者及雇主 → 补充短租对游客和旅游就业的作用 → 区分个人闲房出租与开发商旅馆式经营 → 说明征税监管与登记保险措施 → 承认登记有用并指出其供给局限 → 总结需建更多住房并区分措施主次</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → G → D → E → C → B → F → H</strong></p>\n<p>41—45：G、D、C、B、F。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → G → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>This concern connects the expansion of online rental platforms with pressure on the supply available to residents.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The pressure is especially visible where rental vacancy rates are extremely low.</p>\n</blockquote>\n<p>前段已把平台扩张连到居民可用房源压力，The pressure承接，低空置率为这一压力提供具体表现。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>In New Hampshire, a proposed bill would have prevented towns from restricting short-term rentals. Legislators rejected it, preserving a tool that local communities could use to respond to the shortage.</p>\n</blockquote>\n<p>新罕布什尔法案要阻止城镇限制短租，Legislators rejected it再接投票结果，preserving a tool解释否决的作用。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>For housing advocates, removing such tools risks making an already strained market worse.</p>\n</blockquote>\n<p>such tools回指地方短租限制工具，下一段从住房倡导者角度说明拿走它的风险。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由短租扩张引出本地住房供给压力 → 以低空置率和法案表明地方监管工具作用 → 说明可负担住房不足影响劳动者及雇主</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business.</p>\n</blockquote>\n<p>普通闲房与大规模经营的区别属于后文判断监管范围，这里应先交代工具及法案，否则such tools缺少具体内容。</p>\n<p><strong>41题选G。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为G → D → E。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Legislators rejected it, preserving a tool that local communities could use to respond to the shortage.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>For housing advocates, removing such tools risks making an already strained market worse.</p>\n</blockquote>\n<p>前段否决法案保留地方工具，removing such tools承接并说明反向做法为何危险。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Without affordable homes, employers struggle to attract staff and workers struggle to find somewhere to live. Their concern is therefore about both residential security and the local labour supply.</p>\n</blockquote>\n<p>可负担房缺乏同时造成招工和居住困难，therefore总结为居民安全与本地劳动供给两重问题。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The tourist economy adds another side to the argument.</p>\n</blockquote>\n<p>another side转到旅游经济，在居民工人这一面的讨论完成后补充游客和旅游岗位。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>以低空置率和法案表明地方监管工具作用 → 说明可负担住房不足影响劳动者及雇主 → 补充短租对游客和旅游就业的作用</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business.</p>\n</blockquote>\n<p>直接跳到两类出租的区别会略过地方住房短缺为何影响工作生活，后句another side也无法形成居民与游客需求的对应。</p>\n<p><strong>42题选D。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → C → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Short-term rentals can support this activity, so their contribution cannot be assessed only by treating every visitor’s stay as a loss to the community.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business.</p>\n</blockquote>\n<p>前段肯定短租支持旅游、不能把每次游客入住都视为损失，A useful distinction接着细分应怎样评价不同出租。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The first can make productive use of a property that would otherwise stand empty. The second may operate as a hotel while avoiding the obligations normally attached to hotels.</p>\n</blockquote>\n<p>The first指个人闲置第二住房，可利用空置资产；The second指开发商大规模经营，可能规避旅馆义务。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Avoiding those obligations is the reason to demand appropriate taxation and regulation.</p>\n</blockquote>\n<p>those obligations准确回指旅馆通常承担的义务，下一段才提出相应税收监管。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>补充短租对游客和旅游就业的作用 → 区分个人闲房出租与开发商旅馆式经营 → 说明征税监管与登记保险措施</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>These requirements can help other places under pressure, but they do not create a large stock of new homes.</p>\n</blockquote>\n<p>These requirements必须等监管要求列出后才有先行词，此处先区别经营形式及责任，不能提前转登记是否足够。</p>\n<p><strong>43题选C。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为C → B → F。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>The second may operate as a hotel while avoiding the obligations normally attached to hotels.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Avoiding those obligations is the reason to demand appropriate taxation and regulation.</p>\n</blockquote>\n<p>前段指出第二类经营避免旅馆义务，Avoiding those obligations直接承接，并引出合适税收监管的理由。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Registration, insurance and local levies can make the actual scale and character of a business more visible. Existing state and city requirements provide examples of how authorities have responded to investor-led expansion.</p>\n</blockquote>\n<p>登记、保险、税费是具体回应，已有州和市要求说明政府怎样应对投资主导扩张。</p>\n<p>后段F开头是：</p>\n<blockquote>\n<p>These requirements can help other places under pressure, but they do not create a large stock of new homes.</p>\n</blockquote>\n<p>These requirements复现当前各项要求，下一段承认有益后再限制其对新房源的作用。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>区分个人闲房出租与开发商旅馆式经营 → 说明征税监管与登记保险措施 → 承认登记有用并指出其供给局限</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The pressure is especially visible where rental vacancy rates are extremely low.</p>\n</blockquote>\n<p>低空置率属于问题背景，这里已进入应对措施；回到压力不能替代要求列举，也让These requirements无所指。</p>\n<p><strong>44题选B。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为B → F → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Existing state and city requirements provide examples of how authorities have responded to investor-led expansion.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>These requirements can help other places under pressure, but they do not create a large stock of new homes.</p>\n</blockquote>\n<p>前段列已有州与城市要求，These requirements承接并用but区分帮助受压地区与创造新住房库存。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A registration system changes how rentals are monitored. It is therefore a limited response when the main problem remains insufficient housing supply.</p>\n</blockquote>\n<p>登记改变监测方式，therefore说明当核心问题仍是房源不足时，它只构成有限应对。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Changing that supply requires substantially more building.</p>\n</blockquote>\n<p>Changing that supply回指insufficient housing supply，结尾用更多建设回应库存不足。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明征税监管与登记保险措施 → 承认登记有用并指出其供给局限 → 总结需建更多住房并区分措施主次</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The pressure is especially visible where rental vacancy rates are extremely low.</p>\n</blockquote>\n<p>再次谈低空置率只能重述压力，不能解释登记的边界；此处要先分清监管与供给，才能自然收束到增建。</p>\n<p><strong>45题选F。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\
