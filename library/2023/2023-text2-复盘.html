作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n<p>可负担住房政策专家Keren Horn说，短租本身不是问题关键。个人能出租第二套住房是好事，度假屋既然空着，为什么不能靠它挣钱？但当开发商试图建大规模短租设施，即事实上的旅馆，来绕过税收监管，问题就出现了。她反问：实质上建旅馆却伪装成不是旅馆的开发商，难道不该像旅馆一样被对待、征税和监管吗？</p>\n</blockquote>\n<p>Horn先区分个人利用闲房与大规模事实旅馆，再提出针对后者的税收监管要求。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Horn emphasises the proper procedures for renting out spare houses.</p>\n<p>Horn在第5段强调出租闲房的适当程序。</p>\n</blockquote>\n<p>D需要出租闲房的步骤或规范指引。允许闲房挣钱不是流程说明，也不能以铺垫部分替代后半段的重点。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"29题结论","raw":"### 29题结论\n\n> **29. C**\n\n- A：Horn要求将事实旅馆按旅馆征税监管，问题在规避义务，不在设施陈旧。A改成紧急升级设施。\n- B：当地市场效率是宽泛评价，Horn具体强调开发商不能用身份伪装绕税绕监管，B遗漏这一关键关系。\n- C：开发商以大规模短租掩饰旅馆来bypass taxes，Horn要求taxed like a hotel，C保留阻止避税这一明确诉求。\n- D：个人出租空置第二套住房是被认可的行为，原段没有讲操作程序；真正强调的在however后的开发商规避。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1299,1344,381],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"29","questionConclusion":true},"html":"<blockquote>\n<p><strong>29. C</strong></p>\n</blockquote>\n<ul>\n<li>A：Horn要求将事实旅馆按旅馆征税监管，问题在规避义务，不在设施陈旧。A改成紧急升级设施。</li>\n<li>B：当地市场效率是宽泛评价，Horn具体强调开发商不能用身份伪装绕税绕监管，B遗漏这一关键关系。</li>\n<li>C：开发商以大规模短租掩饰旅馆来bypass taxes，Horn要求taxed like a hotel，C保留阻止避税这一明确诉求。</li>\n<li>D：个人出租空置第二套住房是被认可的行为，原段没有讲操作程序；真正强调的在however后的开发商规避。</li>\n</ul>\n"},{"title":"30题 · 题干、题型与核心出处","raw":"## 30题\n\n> Horn holds that imposing registration requirements is ______.\n>\n> 霍恩认为，施加登记要求是怎样的？\n\n### 题型\n\n措施评价题：合看could benefit与But后的建房主张，分清有用和足够。\n\n题干的Horn和registration requirements直接对应第7段开头的Horn said similar registration requirements。similar表示与前面类似，需要连读第6段所列的登记做法，因此把第6、7段完整读完。\n\n### 核心出处\n\n> similar registration requirements could benefit other struggling cities and towns\n>\n> the main one is we have to build a lot more\n>\n> The bill requires every rental host to register with the state","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"30","questionIntro":true},"html":"<blockquote>\n<p>Horn holds that imposing registration requirements is ______.</p>\n<p>霍恩认为，施加登记要求是怎样的？</p>\n</blockquote>\n<h3>题型</h3>\n<p>措施评价题：合看could benefit与But后的建房主张，分清有用和足够。</p>\n<p>题干的Horn和registration requirements直接对应第7段开头的Horn said similar registration requirements。similar表示与前面类似，需要连读第6段所列的登记做法，因此把第6、7段完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>similar registration requirements could benefit other struggling cities and towns</p>\n<p>the main one is we have to build a lot more</p>\n<p>The bill requires every rental host to register with the state</p>\n</blockquote>\n"},{"title":"A. an irrational decision","raw":"### A. an irrational decision\n\n> Horn认为登记要求是不理性的决定。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\ncould benefit肯定登记可能有益，But随后说更主要还需建房，未把登记评价成不理性。\n\n**出处：**\n\n> At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. \"The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,\" Boston took things even further, requiring renters to register with the city's Inspectional Services Department.\n> Horn said similar registration requirements could benefit other struggling cities and towns. But \"If we want to make a change in the housing market, the main one is we have to build a lot more.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-30-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>Horn认为登记要求是不理性的决定。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>could benefit肯定登记可能有益，But随后说更主要还需建房，未把登记评价成不理性。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.\nHorn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n</blockquote>\n</section>"},{"title":"A. an irrational decision","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> Horn认为登记要求是不理性的决定。\n\ncould benefit肯定登记可能有益，But随后说更主要还需建房，未把登记评价成不理性。\n\n第六段给已有登记要求，第七段肯定可向其他城镇借鉴，再补改变市场需大幅增加供给。\n\nA需要否定登记合理性的评价。措施不足以单独解决问题，并不等于决定本身不理性或应撤销。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"kind":"me rue,"kind":"method"},"focusId":"focus-question-30-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-D-0\"><blockquote>\n<p>Horn认为登记要求是不充分的解决办法。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>登记可能有益，但要改变住房市场主要仍须多建房，说明登记本身不足以解决核心供给问题。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.\nHorn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>Horn认为登记要求是不充分的解决办法。</p>\n</blockquote>\n<p><code>D</code>的<code>an inadequate solution</code>是在说靠登记还不够，回看第7段<code>but</code>后面的<code>we have to build a lot more</code>，并连着前面的<code>could benefit</code>读，核对登记的用处与改变市场还需要什么。</p>\n<p>原文承认登记可能有益，却随即说若要改变住房市场，<code>we have to build a lot more</code>，而且这才是主要行动。<code>D</code>的<code>an inadequate solution</code>不否认登记会有好处，只说登记不足以承担解决问题的任务。<code>could benefit</code>与<code>but</code>后的建房要求合在一起，说明有用的登记还需要由增加住房供给来补足。</p>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.\nHorn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n<p>2018年底，州长Charlie Baker签署法案约束潜在投资买家。法案要求每位出租者向州登记、购买保险，并在新增州税之外为地方征税打开可能。波士顿进一步要求向市检查服务部门登记。</p>\n<p>Horn认为，类似登记要求可帮助其他陷入困难的城市和城镇。但若要改变住房市场，最主要的行动是大幅增加建房。</p>\n</blockquote>\n<p>相似登记要求可帮助其他城市是肯定，But后的建房要求限定这种帮助能走多远。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Registration is an inadequate solution.</p>\n<p>Horn认为登记要求是不充分的解决办法。</p>\n</blockquote>\n<p>inadequate不是毫无用处，而是不充分，能同时容纳could benefit和have to build a lot more两层意思。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"30题结论","raw":"### 30题结论\n\n> **30. D**\n\n- A：could benefit肯定登记可能有益，But随后说更主要还需建房，未把登记评价成不理性。\n- B：已有州及城市要求登记，Horn谈类似措施可能有益，未指出登记无法实施，B把效果有限换成不可行。\n- C：有更主要的增建住房行动，不等于登记没有必要；Horn先承认它能带来益处，没有作取消其必要性的判断。\n- D：登记可能有益，但要改变住房市场主要仍须多建房，说明登记本身不足以解决核心供给问题。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1680,1344,397],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"30","questionConclusion":true},"html":"<blockquote>\n<p><strong>30. D</strong></p>\n</blockquote>\n<ul>\n<li>A：could benefit肯定登记可能有益，But随后说更主要还需建房，未把登记评价成不理性。</li>\n<li>B：已有州及城市要求登记，Horn谈类似措施可能有益，未指出登记无法实施，B把效果有限换成不可行。</li>\n<li>C：有更主要的增建住房行动，不等于登记没有必要；Horn先承认它能带来益处，没有作取消其必要性的判断。</li>\n<li>D：登记可能有益，但要改变住房市场主要仍须多建房，说明登记本身不足以解决核心供给问题。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：短期租赁监管的背景与紧迫性**（段落1-2问题提出） 历史背景：2010年代Airbnb等兴起→社区试图监管 → 当前危机：【高房价 + 低库存→监管更紧迫（担心开发商买房转手牟利）】→ 新罕布什尔州案例：（空置率<1% + 州立法机构反对限制法案）\n\n↓（利益相关者观点）\n\n**逻辑层次2：住房倡导者的担忧**（段落3 Taylor观点） 危机认定：租赁住房供应处于危机水平 → 限制监管工具 = 减少市场供应 → 连锁效应：【雇主难以吸引员工 + 工人难以找到住所】\n\n//（对立观点）\n\n**逻辑层次3：房地产行业的辩护**（段落4 Castle观点） 短期租赁的积极作用：为游客提供住房 → 循环效应：【工人服务旅游业 ← → 旅游业依赖短期访客】\n\n↓（问题本质分析）\n\n**逻辑层次4：问题的真正症结**（段落5 Horn分析） 个人短期租赁 ≠ 问题关键（度假屋空置不如出租）// 真正问题：开发商建造大规模短期租赁设施（事实上的酒店）→ 目的：规避税收和监管 → 核心问题：应该像酒店一样对待吗？\n\n↓（政策回应）\n\n**逻辑层次5：监管措施与根本解决方案**（段落6-7政策与建议） 2018年贝克州长法案：【注册要求 + 强制保险 + 地方税可能】→ 波士顿更严格（市级注册）→ Horn评价：注册有益但不够 → 根本解决方案：必须建造更多住房\n\n↑（全文主旨）\n\n全文核心观点：短期租赁监管争议反映了住房供应危机的深层矛盾——虽然监管措施（如注册要求）可能有所帮助，但真正的解决方案在于增加住房供应，而非简单地限制短期租赁。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：短期租赁监管的背景与紧迫性</strong>（段落1-2问题提出） 历史背景：2010年代Airbnb等兴起→社区试图监管 → 当前危机：【高房价 + 低库存→监管更紧迫（担心开发商买房转手牟利）】→ 新罕布什尔州案例：（空置率&lt;1% + 州立法机构反对限制法案）</p>\n<p>↓（利益相关者观点）</p>\n<p><strong>逻辑层次2：住房倡导者的担忧</strong>（段落3 Taylor观点） 危机认定：租赁住房供应处于危机水平 → 限制监管工具 = 减少市场供应 → 连锁效应：【雇主难以吸引员工 + 工人难以找到住所】</p>\n<p>//（对立观点）</p>\n<p><strong>逻辑层次3：房地产行业的辩护</strong>（段落4 Castle观点） 短期租赁的积极作用：为游客提供住房 → 循环效应：【工人服务旅游业 ← → 旅游业依赖短期访客】</p>\n<p>↓（问题本质分析）</p>\n<p><strong>逻辑层次4：问题的真正症结</strong>（段落5 Horn分析） 个人短期租赁 ≠ 问题关键（度假屋空置不如出租）// 真正问题：开发商建造大规模短期租赁设施（事实上的酒店）→ 目的：规避税收和监管 → 核心问题：应该像酒店一样对待吗？</p>\n<p>↓（政策回应）</p>\n<p><strong>逻辑层次5：监管措施与根本解决方案</strong>（段落6-7政策与建议） 2018年贝克州长法案：【注册要求 + 强制保险 + 地方税可能】→ 波士顿更严格（市级注册）→ Horn评价：注册有益但不够 → 根本解决方案：必须建造更多住房</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：短期租赁监管争议反映了住房供应危机的深层矛盾——虽然监管措施（如注册要求）可能有所帮助，但真正的解决方案在于增加住房供应，而非简单地限制短期租赁。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. Housing scarcity makes short-term rental rules urgent\n\n> 住房稀缺使短租监管更紧迫\n\n高房价低库存增加监管紧迫性，新罕布什尔空置率低又加剧担忧，立法机关否决禁止地方限制的法案。\n\n> Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s.\n\n平台兴起之后社区已尝试监管，Now由高房价、低库存说明需求更紧迫。\n\n> In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market.\n\n新罕布什尔空置率低于1%，具体解释市场为何紧张及无限制短租可能造成的压力。\n\n> The state Legislature recently voted against a bill that would've made it illegal for towns to create legislation restricting short-term rentals.\n\n法案禁止城镇限制短租，而voted against说明议会否决它，保留地方工具；标题应围绕住房稀缺推动监管。\n\n这一部分的推进关系是：\n\n> 平台扩张与房源紧张 → 空置率很低、担忧压力 → 保留地方限制短租工具\n\nscarcity对应low inventory和vacancy below 1%，urgent对应对供给压力的担忧。\n\n再看最强干扰项E：The abolition of every local power over rentals。\n\n禁止地方监管的法案被否决，不能写成地方权力已被废除。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. Housing scarcity makes short-term rental rules urgent</p>\n<blockquote>\n<p>住房稀缺使短租监管更紧迫</p>\n</blockquote>\n<p>高房价低库存增加监管紧迫性，新罕布什尔空置率低又加剧担忧，立法机关否决禁止地方限制的法案。</p>\n<blockquote>\n<p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s.</p>\n</blockquote>\n<p>平台兴起之后社区已尝试监管，Now由高房价、低库存说明需求更紧迫。</p>\n<blockquote>\n<p>In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market.</p>\n</blockquote>\n<p>新罕布什尔空置率低于1%，具体解释市场为何紧张及无限制短租可能造成的压力。</p>\n<blockquote>\n<p>The state Legislature recently voted against a bill that would&#39;ve made it illegal for towns to create legislation restricting short-term rentals.</p>\n</blockquote>\n<p>法案禁止城镇限制短租，而voted against说明议会否决它，保留地方工具；标题应围绕住房稀缺推动监管。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>平台扩张与房源紧张 → 空置率很低、担忧压力 → 保留地方限制短租工具</p>\n</blockquote>\n<p>scarcity对应low inventory和vacancy below 1%，urgent对应对供给压力的担忧。</p>\n<p>再看最强干扰项E：The abolition of every local power over rentals。</p>\n<p>禁止地方监管的法案被否决，不能写成地方权力已被废除。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】D. Workers’ housing needs alongside tourists’ accommodation needs\n\n> 劳动者住房需求与游客住宿需求并存\n\nTaylor强调可负担住房不足影响招工和居住，Castle则强调短租服务游客且旅游业也支持工人。\n\n> \"We are at a crisis level on the supply of rental housing, so anytime you're taking the tool out of the toolkit for communities to address this, you're potentially taking supply off the market that's already incredibly stressed,\" said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast.\n\nTaylor将拿走地方工具与供给进一步减少相连，工人住房不足又会影响雇主招聘。\n\n> However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors.\n\nHowever切换到Castle补充的另一面：短租也承担游客住宿需求。\n\n> \"A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,\" Castle said, \"and so it's a cyclical effect.\"\n\n旅游者支持行业、工人服务行业，cyclical effect解释旅游与就业联系，标题应容纳两种需求而非判任何短租都无益。\n\n这一部分的推进关系是：\n\n> 居民工人住房不足 → 游客也需要短住 → 旅游消费与就业相互支持\n\nalongside保留两种关注点的对照，不把短期游客误作短期雇工。\n\n再看最强干扰项G：A demand to close the entire tourism industry。\n\n双方都谈旅游和劳动者的需要，没人要求关闭整个行业。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】D. Workers’ housing needs alongside tourists’ accommodation needs</p>\n<blockquote>\n<p>劳动者住房需求与游客住宿需求并存</p>\n</blockquote>\n<p>Taylor强调可负担住房不足影响招工和居住，Castle则强调短租服务游客且旅游业也支持工人。</p>\n<blockquote>\n<p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#39;re taking the tool out of the toolkit for communities to address this, you&#39;re potentially taking supply off the market that&#39;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast.</p>\n</blockquote>\n<p>Taylor将拿走地方工具与供给进一步减少相连，工人住房不足又会影响雇主招聘。</p>\n<blockquote>\n<p>However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors.</p>\n</blockquote>\n<p>However切换到Castle补充的另一面：短租也承担游客住宿需求。</p>\n<blockquote>\n<p>&quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#39;s a cyclical effect.&quot;</p>\n</blockquote>\n<p>旅游者支持行业、工人服务行业，cyclical effect解释旅游与就业联系，标题应容纳两种需求而非判任何短租都无益。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>居民工人住房不足 → 游客也需要短住 → 旅游消费与就业相互支持</p>\n</blockquote>\n<p>alongside保留两种关注点的对照，不把短期游客误作短期雇工。</p>\n<p>再看最强干扰项G：A demand to close the entire tourism industry。</p>\n<p>双方都谈旅游和劳动者的需要，没人要求关闭整个行业。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】A. Regulating disguised hotels rather than ordinary spare-home letting\n\n> 监管伪装成短租的旅馆而非普通闲房出租\n\nHorn认可个人出租空置度假屋，但反对开发商以短租名义做实际旅馆、绕税绕监管。\n\n> Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy.\n\nnot the crux先否定短租本身就是全部问题，为区分不同经营方式作准备。\n\n> \"If it's their vacation home anyway, and it's just empty, why can't you make money off it?\" Horn said.\n\n空度假屋供个人出租是闲置资产利用，Horn在这里表示认可，没有讲具体出租流程。\n\n> \"I think the question is, shouldn't a developer who's really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?\" Horn said.\n\n最后反问针对事实旅馆的开发商，要求按经营实质承担税收监管，标题要保留普通出租与规避义务经营的区别。\n\n这一部分的推进关系是：\n\n> 认可个人闲房出租 → 大规模事实旅馆规避义务 → 应按旅馆征税监管\n\ndisguised hotels对应de facto hotels与disguising，rather than区分个人正常使用。\n\n再看最强干扰项F：Concrete requirements imposed on rental hosts。\n\n此段说明监管应针对的实质，下一段才列具体登记保险要求。\n\n**43题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】A. Regulating disguised hotels rather than ordinary spare-home letting</p>\n<blockquote>\n<p>监管伪装成短租的旅馆而非普通闲房出租</p>\n</blockquote>\n<p>Horn认可个人出租空置度假屋，但反对开发商以短租名义做实际旅馆、绕税绕监管。</p>\n<blockquote>\n<p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy.</p>\n</blockquote>\n<p>not the crux先否定短租本身就是全部问题，为区分不同经营方式作准备。</p>\n<blockquote>\n<p>&quot;If it&#39;s their vacation home anyway, and it&#39;s just empty, why can&#39;t you make money off it?&quot; Horn said.</p>\n</blockquote>\n<p>空度假屋供个人出租是闲置资产利用，Horn在这里表示认可，没有讲具体出租流程。</p>\n<blockquote>\n<p>&quot;I think the question is, shouldn&#39;t a developer who&#39;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p>\n</blockquote>\n<p>最后反问针对事实旅馆的开发商，要求按经营实质承担税收监管，标题要保留普通出租与规避义务经营的区别。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>认可个人闲房出租 → 大规模事实旅馆规避义务 → 应按旅馆征税监管</p>\n</blockquote>\n<p>disguised hotels对应de facto hotels与disguising，rather than区分个人正常使用。</p>\n<p>再看最强干扰项F：Concrete requirements imposed on rental hosts。</p>\n<p>此段说明监管应针对的实质，下一段才列具体登记保险要求。</p>\n<p><strong>43题选A。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. Concrete requirements imposed on rental hosts\n\n> 对出租者施加的具体要求\n\n州法规定登记、保险、税收，并介绍Boston进一步的登记安排。\n\n> At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers.\n\n法案为约束潜在投资买家引入，说明监管措施针对投资扩张风险。\n\n> \"The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,\" Boston took things even further, requiring renters to register with the city's Inspectional Services Department.\n\n登记、保险和地方税可能性是具体要求，Boston进一步市级登记则补充地方行动。\n\n这一部分的推进关系是：\n\n> 约束投资买家 → 州级登记保险税费 → 城市进一步登记\n\nconcrete requirements涵盖三个可执行条件，不只是抽象主张。\n\n再看最强干扰项E：The abolition of every local power over rentals。\n\n地方要求进一步增加，与废除地方监管相反。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. Concrete requirements imposed on rental hosts</p>\n<blockquote>\n<p>对出租者施加的具体要求</p>\n</blockquote>\n<p>州法规定登记、保险、税收，并介绍Boston进一步的登记安排。</p>\n<blockquote>\n<p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers.</p>\n</blockquote>\n<p>法案为约束潜在投资买家引入，说明监管措施针对投资扩张风险。</p>\n<blockquote>\n<p>&quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#39;s Inspectional Services Department.</p>\n</blockquote>\n<p>登记、保险和地方税可能性是具体要求，Boston进一步市级登记则补充地方行动。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>约束投资买家 → 州级登记保险税费 → 城市进一步登记</p>\n</blockquote>\n<p>concrete requirements涵盖三个可执行条件，不只是抽象主张。</p>\n<p>再看最强干扰项E：The abolition of every local power over rentals。</p>\n<p>地方要求进一步增加，与废除地方监管相反。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Why registration alone cannot supply enough homes\n\n> 为何仅登记不能提供足够住房\n\nHorn承认登记可能有益，但把真正改变市场的主要办法放在大幅增加建房。\n\n> Horn said similar registration requirements could benefit other struggling cities and towns.\n\ncould benefit先肯定类似登记要求可帮助其他受压地区，不能将它解成无用。\n\n> But \"If we want to make a change in the housing market, the main one is we have to build a lot more.\"\n\nBut将作用限制转向核心供给：真正改变市场仍需多建房，标题要表达有益但不足。\n\n这一部分的推进关系是：\n\n> 登记可能有益 → 核心住房供给仍不足 → 主要还需多建房\n\nalone不能解决供给量问题，登记有用与仍需增建可以并存。\n\n再看最强干扰项G：A demand to close the entire tourism industry。\n\n增加住房不是关闭旅游业。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Why registration alone cannot supply enough homes</p>\n<blockquote>\n<p>为何仅登记不能提供足够住房</p>\n</blockquote>\n<p>Horn承认登记可能有益，但把真正改变市场的主要办法放在大幅增加建房。</p>\n<blockquote>\n<p>Horn said similar registration requirements could benefit other struggling cities and towns.</p>\n</blockquote>\n<p>could benefit先肯定类似登记要求可帮助其他受压地区，不能将它解成无用。</p>\n<blockquote>\n<p>But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p>\n</blockquote>\n<p>But将作用限制转向核心供给：真正改变市场仍需多建房，标题要表达有益但不足。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>登记可能有益 → 核心住房供给仍不足 → 主要还需多建房</p>\n</blockquote>\n<p>alone不能解决供给量问题，登记有用与仍需增建可以并存。</p>\n<p>再看最强干扰项G：A demand to close the entire tourism industry。</p>\n<p>增加住房不是关闭旅游业。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 由短租扩张引出本地住房供给压力 |\n| B | 说明征税监管与登记保险措施 |\n| C | 区分个人闲房出租与开发商旅馆式经营 |\n| D | 说明可负担住房不足影响劳动者及雇主 |\n| E | 补充短租对游客和旅游就业的作用 |\n| F | 承认登记有用并指出其供给局限 |\n| G | 以低空置率和法案表明地方监管工具作用 |\n| H | 总结需建更多住房并区分措施主次 |\n\n全文推进：\n\n> 由短租扩张引出本地住房供给压力 → 以低空置率和法案表明地方监管工具作用 → 说明可负担住房不足影响劳动者及雇主 → 补充短租对游客和旅游就业的作用 → 区分个人闲房出租与开发商旅馆式经营 → 说明征税监管与登记保险措施 → 承认登记有用并指出其供给局限 → 总结需建更多住房并区分措施主次\n\n完整顺序：\n\n**A → G → D → E → C → B → F → H**\n\n41—45：G、D、C、B、F。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>由短租扩张引出本地住房供给压力</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明征税监管与登记保险措施</td>\n</tr>\n<tr>\n<td>C</td>\n<td>区分个人闲房出租与开发商旅馆式经营</td>\n</tr>\n<tr>\n<td>D</td>\n<td>说明可负担住房不足影响劳动者及雇主</td>\n</tr>\n<tr>\n<td>E</td>\n<td>补充短租对游客和旅游就业的作用</td>\n</tr>\n<tr>\n<td>F</td>\n<td>承认登记有用并指出其供给局限</td>\n</tr>\n<tr>\n<td>G</td>\n<td>以低空置率和法案表明地方监管工具作用</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结需建更多住房并区分措施主次</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>由短租扩张引出本地住房供给压力 → 以低空置率和法案表明地方监管工具作用 → 说明可负担住房不足影响劳动者及雇主 → 补充短租对游客和旅游就业的作用 → 区分个人闲房出租与开发商旅馆式经营 → 说明征税监管与登记保险措施 → 承认登记有用并指出其供给局限 → 总结需建更多住房并区分措施主次</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → G → D → E → C → B → F → H</strong></p>\n<p>41—45：G、D、C、B、F。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → G → D。\n\n先看前段A的结尾：\n\n> This concern connects the expansion of online rental platforms with pressure on the supply available to residents.\n\n再看G段开头：\n\n> The pressure is especially visible where rental vacancy rates are extremely low.\n\n前段已把平台扩张连到居民可用房源压力，The pressure承接，低空置率为这一压力提供具体表现。\n\n本段内部继续写道：\n\n> In New Hampshire, a proposed bill would have prevented towns from restricting short-term rentals. Legislators rejected it, preserving a tool that local communities could use to respond to the shortage.\n\n新罕布什尔法案要阻止城镇限制短租，Legislators rejected it再接投票结果，preserving a tool解释否决的作用。\n\n后段D开头是：\n\n> For housing advocates, removing such tools risks making an already strained market worse.\n\nsuch tools回指地方短租限制工具，下一段从住房倡导者角度说明拿走它的风险。\n\n这三段的推进关系：\n\n> 由短租扩张引出本地住房供给压力 → 以低空置率和法案表明地方监管工具作用 → 说明可负担住房不足影响劳动者及雇主\n\n再检验候选C：\n\n> A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business.\n\n普通闲房与大规模经营的区别属于后文判断监管范围，这里应先交代工具及法案，否则such tools缺少具体内容。\n\n**41题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>41题是全文第2段，局部关系为A → G → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>This concern connects the expansion of online rental platforms with pressure on the supply available to residents.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>The pressure is especially visible where rental vacancy rates are extremely low.</p>\n</blockquote>\n<p>前段已把平台扩张连到居民可用房源压力，The pressure承接，低空置率为这一压力提供具体表现。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>In New Hampshire, a proposed bill would have prevented towns from restricting short-term rentals. Legislators rejected it, preserving a tool that local communities could use to respond to the shortage.</p>\n</blockquote>\n<p>新罕布什尔法案要阻止城镇限制短租，Legislators rejected it再接投票结果，preserving a tool解释否决的作用。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>For housing advocates, removing such tools risks making an already strained market worse.</p>\n</blockquote>\n<p>such tools回指地方短租限制工具，下一段从住房倡导者角度说明拿走它的风险。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>由短租扩张引出本地住房供给压力 → 以低空置率和法案表明地方监管工具作用 → 说明可负担住房不足影响劳动者及雇主</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business.</p>\n</blockquote>\n<p>普通闲房与大规模经营的区别属于后文判断监管范围，这里应先交代工具及法案，否则such tools缺少具体内容。</p>\n<p><strong>41题选G。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为G → D → E。\n\n先看前段G的结尾：\n\n> Legislators rejected it, preserving a tool that local communities could use to respond to the shortage.\n\n再看D段开头：\n\n> For housing advocates, removing such tools risks making an already strained market worse.\n\n前段否决法案保留地方工具，removing such tools承接并说明反向做法为何危险。\n\n本段内部继续写道：\n\n> Without affordable homes, employers struggle to attract staff and workers struggle to find somewhere to live. Their concern is therefore about both residential security and the local labour supply.\n\n可负担房缺乏同时造成招工和居住困难，therefore总结为居民安全与本地劳动供给两重问题。\n\n后段E开头是：\n\n> The tourist economy adds another side to the argument.\n\nanother side转到旅游经济，在居民工人这一面的讨论完成后补充游客和旅游岗位。\n\n这三段的推进关系：\n\n> 以低空置率和法案表明地方监管工具作用 → 说明可负担住房不足影响劳动者及雇主 → 补充短租对游客和旅游就业的作用\n\n再检验候选C：\n\n> A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business.\n\n直接跳到两类出租的区别会略过地方住房短缺为何影响工作生活，后句another side也无法形成居民与游客需求的对应。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>42题是全文第3段，局部关系为G → D → E。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Legislators rejected it, preserving a tool that local communities could use to respond to the shortage.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>For housing advocates, removing such tools risks making an already strained market worse.</p>\n</blockquote>\n<p>前段否决法案保留地方工具，removing such tools承接并说明反向做法为何危险。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Without affordable homes, employers struggle to attract staff and workers struggle to find somewhere to live. Their concern is therefore about both residential security and the local labour supply.</p>\n</blockquote>\n<p>可负担房缺乏同时造成招工和居住困难，therefore总结为居民安全与本地劳动供给两重问题。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The tourist economy adds another side to the argument.</p>\n</blockquote>\n<p>another side转到旅游经济，在居民工人这一面的讨论完成后补充游客和旅游岗位。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>以低空置率和法案表明地方监管工具作用 → 说明可负担住房不足影响劳动者及雇主 → 补充短租对游客和旅游就业的作用</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business.</p>\n</blockquote>\n<p>直接跳到两类出租的区别会略过地方住房短缺为何影响工作生活，后句another side也无法形成居民与游客需求的对应。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → C → B。\n\n先看前段E的结尾：\n\n> Short-term rentals can support this activity, so their contribution cannot be assessed only by treating every visitor’s stay as a loss to the community.\n\n再看C段开头：\n\n> A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business.\n\n前段肯定短租支持旅游、不能把每次游客入住都视为损失，A useful distinction接着细分应怎样评价不同出租。\n\n本段内部继续写道：\n\n> The first can make productive use of a property that would otherwise stand empty. The second may operate as a hotel while avoiding the obligations normally attached to hotels.\n\nThe first指个人闲置第二住房，可利用空置资产；The second指开发商大规模经营，可能规避旅馆义务。\n\n后段B开头是：\n\n> Avoiding those obligations is the reason to demand appropriate taxation and regulation.\n\nthose obligations准确回指旅馆通常承担的义务，下一段才提出相应税收监管。\n\n这三段的推进关系：\n\n> 补充短租对游客和旅游就业的作用 → 区分个人闲房出租与开发商旅馆式经营 → 说明征税监管与登记保险措施\n\n再检验候选F：\n\n> These requirements can help other places under pressure, but they do not create a large stock of new homes.\n\nThese requirements必须等监管要求列出后才有先行词，此处先区别经营形式及责任，不能提前转登记是否足够。\n\n**43题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>43题是全文第5段，局部关系为E → C → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Short-term rentals can support this activity, so their contribution cannot be assessed only by treating every visitor’s stay as a loss to the community.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business.</p>\n</blockquote>\n<p>前段肯定短租支持旅游、不能把每次游客入住都视为损失，A useful distinction接着细分应怎样评价不同出租。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The first can make productive use of a property that would otherwise stand empty. The second may operate as a hotel while avoiding the obligations normally attached to hotels.</p>\n</blockquote>\n<p>The first指个人闲置第二住房，可利用空置资产；The second指开发商大规模经营，可能规避旅馆义务。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>Avoiding those obligations is the reason to demand appropriate taxation and regulation.</p>\n</blockquote>\n<p>those obligations准确回指旅馆通常承担的义务，下一段才提出相应税收监管。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>补充短租对游客和旅游就业的作用 → 区分个人闲房出租与开发商旅馆式经营 → 说明征税监管与登记保险措施</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>These requirements can help other places under pressure, but they do not create a large stock of new homes.</p>\n</blockquote>\n<p>These requirements必须等监管要求列出后才有先行词，此处先区别经营形式及责任，不能提前转登记是否足够。</p>\n<p><strong>43题选C。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为C → B → F。\n\n先看前段C的结尾：\n\n> The second may operate as a hotel while avoiding the obligations normally attached to hotels.\n\n再看B段开头：\n\n> Avoiding those obligations is the reason to demand appropriate taxation and regulation.\n\n前段指出第二类经营避免旅馆义务，Avoiding those obligations直接承接，并引出合适税收监管的理由。\n\n本段内部继续写道：\n\n> Registration, insurance and local levies can make the actual scale and character of a business more visible. Existing state and city requirements provide examples of how authorities have responded to investor-led expansion.\n\n登记、保险、税费是具体回应，已有州和市要求说明政府怎样应对投资主导扩张。\n\n后段F开头是：\n\n> These requirements can help other places under pressure, but they do not create a large stock of new homes.\n\nThese requirements复现当前各项要求，下一段承认有益后再限制其对新房源的作用。\n\n这三段的推进关系：\n\n> 区分个人闲房出租与开发商旅馆式经营 → 说明征税监管与登记保险措施 → 承认登记有用并指出其供给局限\n\n再检验候选G：\n\n> The pressure is especially visible where rental vacancy rates are extremely low.\n\n低空置率属于问题背景，这里已进入应对措施；回到压力不能替代要求列举，也让These requirements无所指。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为C → B → F。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>The second may operate as a hotel while avoiding the obligations normally attached to hotels.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>Avoiding those obligations is the reason to demand appropriate taxation and regulation.</p>\n</blockquote>\n<p>前段指出第二类经营避免旅馆义务，Avoiding those obligations直接承接，并引出合适税收监管的理由。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Registration, insurance and local levies can make the actual scale and character of a business more visible. Existing state and city requirements provide examples of how authorities have responded to investor-led expansion.</p>\n</blockquote>\n<p>登记、保险、税费是具体回应，已有州和市要求说明政府怎样应对投资主导扩张。</p>\n<p>后段F开头是：</p>\n<blockquote>\n<p>These requirements can help other places under pressure, but they do not create a large stock of new homes.</p>\n</blockquote>\n<p>These requirements复现当前各项要求，下一段承认有益后再限制其对新房源的作用。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>区分个人闲房出租与开发商旅馆式经营 → 说明征税监管与登记保险措施 → 承认登记有用并指出其供给局限</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The pressure is especially visible where rental vacancy rates are extremely low.</p>\n</blockquote>\n<p>低空置率属于问题背景，这里已进入应对措施；回到压力不能替代要求列举，也让These requirements无所指。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → F → H。\n\n先看前段B的结尾：\n\n> Existing state and city requirements provide examples of how authorities have responded to investor-led expansion.\n\n再看F段开头：\n\n> These requirements can help other places under pressure, but they do not create a large stock of new homes.\n\n前段列已有州与城市要求，These requirements承接并用but区分帮助受压地区与创造新住房库存。\n\n本段内部继续写道：\n\n> A registration system changes how rentals are monitored. It is therefore a limited response when the main problem remains insufficient housing supply.\n\n登记改变监测方式，therefore说明当核心问题仍是房源不足时，它只构成有限应对。\n\n后段H开头是：\n\n> Changing that supply requires substantially more building.\n\nChanging that supply回指insufficient housing supply，结尾用更多建设回应库存不足。\n\n这三段的推进关系：\n\n> 说明征税监管与登记保险措施 → 承认登记有用并指出其供给局限 → 总结需建更多住房并区分措施主次\n\n再检验候选G：\n\n> The pressure is especially visible where rental vacancy rates are extremely low.\n\n再次谈低空置率只能重述压力，不能解释登记的边界；此处要先分清监管与供给，才能自然收束到增建。\n\n**45题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>45题是全文第7段，局部关系为B → F → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Existing state and city requirements provide examples of how authorities have responded to investor-led expansion.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>These requirements can help other places under pressure, but they do not create a large stock of new homes.</p>\n</blockquote>\n<p>前段列已有州与城市要求，These requirements承接并用but区分帮助受压地区与创造新住房库存。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>A registration system changes how rentals are monitored. It is therefore a limited response when the main problem remains insufficient housing supply.</p>\n</blockquote>\n<p>登记改变监测方式，therefore说明当核心问题仍是房源不足时，它只构成有限应对。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Changing that supply requires substantially more building.</p>\n</blockquote>\n<p>Changing that supply回指insufficient housing supply，结尾用更多建设回应库存不足。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明征税监管与登记保险措施 → 承认登记有用并指出其供给局限 → 总结需建更多住房并区分措施主次</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>The pressure is especially visible where rental vacancy rates are extremely low.</p>\n</blockquote>\n<p>再次谈低空置率只能重述压力，不能解释登记的边界；此处要先分清监管与供给，才能自然收束到增建。</p>\n<p><strong>45题选F。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **affordable housing** | **可负担住房** | **社会现象｜社会生活｜民生改善** | **宏观主题** |\n| community well-being | 社区福祉 | 社会现象｜社会生活 | 宏观主题 |\n| balanced regulation | 平衡适度的监管 | 社会现象｜科技经济 | 宏观主题 |\n| **responsible investment** | **负责任的投资** | **人生哲理｜责任与奉献** | **个人主题** |\n| local employment | 本地就业 | 社会现象｜社会生活｜就业 | 宏观主题 |\n| fair taxation | 公平征税 | 社会现象｜科技经济 | 宏观主题 |\n| adequate housing supply | 充足住房供应 | 社会现象｜社会生活｜民生改善 | 宏观主题 |\n| sound priorities | 合理的轻重安排 | 人生哲理｜理性选择 | 个人主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>affordable housing</strong></td>\n<td><strong>可负担住房</strong></td>\n<td><strong>社会现象｜社会生活｜民生改善</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>community well-being</td>\n<td>社区福祉</td>\n<td>社会现象｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>balanced regulation</td>\n<td>平衡适度的监管</td>\n<td>社会现象｜科技经济</td>\n<td> g>居民正在供给紧张的市场中寻找可负担住房。</strong></td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The scene contrasts an unused private home with a large commercial operation.</td>\n<td>场景对比闲置私人住房与大型商业经营。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The picture shows how housing conditions can affect both workers and employers.</td>\n<td>图画展示住房条件如何同时影响劳动者和雇主。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>Prices have reached a record high while available supply remains low.</strong></td>\n<td><strong>价格达到纪录高位，而可用供给仍然偏低。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The vacancy rate has fallen below one percent.</td>\n<td>空置率已经降至百分之一以下。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The increase in demand puts further pressure on an already strained market.</td>\n<td>需求增加使本已紧张的市场进一步承压。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement distinguishes a useful measure from a sufficient solution.</td>\n<td>这句话区分有用的措施与充分的解决办法。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage stresses that regulation must be accompanied by attention to supply.</td>\n<td>这段文字强调监管还必须兼顾供给问题。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. Regulating disguised hotels rather than ordinary spare-home letting</strong></p><p><strong>B. Why registration alone cannot supply enough homes</strong></p><p><strong>C. Housing scarcity makes short-term rental rules urgent</strong></p><p><strong>D. Workers’ housing needs alongside tourists’ accommodation needs</strong></p><p><strong>E. The abolition of every local power over rentals</strong></p><p><strong>F. Concrete requirements imposed on rental hosts</strong></p><p><strong>G. A demand to close the entire tourism industry</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>Communities throughout the region have been attempting to regulate short-term rentals since sites like Airbnb took off in the 2010s. Now, with record-high home prices and historically low inventory, there&#x27;s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market. In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market. The state Legislature recently voted against a bill that would&#x27;ve made it illegal for towns to create legislation restricting short-term rentals.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>&quot;We are at a crisis level on the supply of rental housing, so anytime you&#x27;re taking the tool out of the toolkit for communities to address this, you&#x27;re potentially taking supply off the market that&#x27;s already incredibly stressed,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast. Without enough affordable housing in southern New Hampshire towns, &quot;employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,&quot; Taylor said. However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local Association of Realtors. &quot;A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#x27;s a cyclical effect.&quot;</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy. &quot;I think individuals being able to rent out their second home is a good thing. If it&#x27;s their vacation home anyway, and it&#x27;s just empty, why can&#x27;t you make money off it?&quot; Horn said. Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations. &quot;I think the question is, shouldn&#x27;t a developer who&#x27;s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?&quot; Horn said.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>At the end of 2018, Governor Charlie Baker signed a bill to rein in those potential investor-buyers. &quot;The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy,&quot; Boston took things even further, requiring renters to register with the city&#x27;s Inspectional Services Department.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Horn said similar registration requirements could benefit other struggling cities and towns. But &quot;If we want to make a change in the housing market, the main one is we have to build a lot more.&quot;</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>Short-term letting has become harder to regulate as housing grows more expensive and scarce. Communities worry that investors may buy large numbers of homes for the tourist market. This concern connects the expansion of online rental platforms with pressure on the supply available to residents.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>Avoiding those obligations is the reason to demand appropriate taxation and regulation. Registration, insurance and local levies can make the actual scale and character of a business more visible. Existing state and city requirements provide examples of how authorities have responded to investor-led expansion.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>A useful distinction is between occasional letting of an unused second home and a developer’s large-scale accommodation business. The first can make productive use of a property that would otherwise stand empty. The second may operate as a hotel while avoiding the obligations normally attached to hotels.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>For housing advocates, removing such tools risks making an already strained market worse. Without affordable homes, employers struggle to attract staff and workers struggle to find somewhere to live. Their concern is therefore about both residential security and the local labour supply.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>The tourist economy adds another side to the argument. Visitors need accommodation, and local jobs depend on services provided to those visitors. Short-term rentals can support this activity, so their contribution cannot be assessed only by treating every visitor’s stay as a loss to the community.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>These requirements can help other places under pressure, but they do not create a large stock of new homes. A registration system changes how rentals are monitored. It is therefore a limited response when the main problem remains insufficient housing supply.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>The pressure is especially visible where rental vacancy rates are extremely low. In New Hampshire, a proposed bill would have prevented towns from restricting short-term rentals. Legislators rejected it, preserving a tool that local communities could use to respond to the shortage.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>Changing that supply requires substantially more building. This conclusion does not imply that registration is irrational or unnecessary; it places the measures in order of importance. Effective oversight and additional homes address different parts of the housing problem.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>short-term rentals</td>\n<td>短期出租</td>\n<td>took off</td>\n<td>迅速发展</td>\n<td>record-high</td>\n<td>adj.创纪录的高</td>\n</tr>\n<tr>\n<td>inventory</td>\n<td>n.房源库存</td>\n<td>urgency</td>\n<td>n.紧迫性</td>\n<td>developers</td>\n<td>n.开发商</td>\n</tr>\n<tr>\n<td>swaths</td>\n<td>n.大片</td>\n<td>flip</td>\n<td>v.转手倒卖</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>vacancy rate</td>\n<td>空置率</td>\n<td>advocates</td>\n<td>n.倡导者</td>\n<td>unchecked</td>\n<td>adj.不受限制的</td>\n</tr>\n<tr>\n<td>strained</td>\n<td>adj.紧张的</td>\n<td>Legislature</td>\n<td>n.立法机关</td>\n<td>voted against</td>\n<td>投票反对</td>\n</tr>\n<tr>\n<td>legislation</td>\n<td>n.立法</td>\n<td>restricting</td>\n<td>v.限制</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意
