\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文最后仍强调损害持续，因此对近期改善应保持谨慎。但严重经济损失本身不能证明业务会被压垮，何时可能下降以及是否有人低估，仍取决于Hawley的原话。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>has been underestimated by some analysts\u003cbr>被一些分析人士低估了\u003c/p>\n\u003c/blockquote>\n\u003cp>这些信息都没有报告哪位分析师低估盗版规模或危害。将缺少共识改成有人低估，改变了分歧的性质；Hawley提醒下降时间不明，并不是在纠正先前过低的数值判断。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：列出北美非法服务数量下降及2020年法律提供的部分帮助。预测合法服务未来仍面临巨额损失，并指出对盗版何时开始下降尚无共识。\u003c/p>\n\u003cp>本项最终仍要根据“there is no consensus”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>34题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>34. C. is unlikely to diminish in the near future\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：下降时间不明不等于永远不能遏制，前文也有成效。\u003c/p>\n\u003cp>B：损失很大不等于霍利判断合法业务将被压垮。\u003c/p>\n\u003cp>C：平台期尚属可能、下降时间未明，支持近期不宜期待减少。\u003c/p>\n\u003cp>D：缺少时间共识没有提供分析师低估的证据。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：流媒体时代的悖论\u003c/strong>（段落1核心对比） 合法流媒体困境：（老好莱坞难以盈利 + Disney+等每年损失数十亿美元）// 非法盗版获利：（盗版者从合法平台撕取内容 → 在非法服务上托管 → 每年赚取20亿美元）\u003c/p>\n\u003cp>↓（盈利模式分析）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：盗版的暴利本质\u003c/strong>（段落2利润分析） 核心优势：无视频制作成本 → 利润率接近90% → MPA努力打击：（近年来出现的成千上万个非法平台）\u003c/p>\n\u003cp>↓（历史演变）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：盗版形式的转变与经济损失\u003c/strong>（段落3影响评估） 历史转折：【最初：Netflix等合法业务帮助遏制基于文件上传的盗版 // 现在：非法流媒体服务+文件共享造成巨大损失】→ 经济影响：（美国：每年300亿美元收入损失 + 25万个工作岗位）+ （全球：每年710亿美元）\u003c/p>\n\u003cp>↓（应对措施）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：反盗版行动的组织化\u003c/strong>（段落4-5执法努力） 盗版性质认定：&quot;不是夫妻店而是有组织犯罪&quot; → MPA历史：（2012年未能在好莱坞和硅谷间建立共识）→ 2017年成立ACE：（100名侦探全球协助逮捕）→ 成效：【北美非法服务从1400+（2018年）→ 126个】+ 2020年联邦法律支持\u003c/p>\n\u003cp>↓（未来展望）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：损失预测与前景不明\u003c/strong>（段落6未来评估） 损失预测：未来两年累计损失将达1130亿美元 → 前景分析：【乐观：新对策可能使盗版在2027年趋稳 // 悲观：何时下降无共识】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：流媒体盗版已成为一个严重的经济问题，虽然执法努力取得了一定成效，但盗版造成的巨大经济损失仍在持续，且短期内难以看到明显下降的趋势。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Turn shared concern into workable cooperation\u003c/p>\n\u003cp>B. Trace who pays and who profits\u003c/p>\n\u003cp>C. Keep an early success in its time frame\u003c/p>\n\u003cp>D. Expect convenience to eliminate piracy\u003c/p>\n\u003cp>E. Distinguish stabilisation from decline\u003c/p>\n\u003cp>F. Check what a count of closures measures\u003c/p>\n\u003cp>G. Measure success by arrests alone\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>Two services may offer the same film without making the same contribution to its production. One pays for making or licensing it; the other obtains a copy and sells access to that copy. The second can therefore earn money without bearing an important part of the first service&#39;s costs. Advertising income does not erase this difference, and a high margin is not evidence that new creative value has been produced. To understand the economic problem, follow the money alongside the content: who financed the work, who now receives payment, and whose business bears the resulting loss?\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>Convenient legal access can change a viewer&#39;s decision. When a legitimate service offers a usable alternative to exchanging unauthorised files, some people no longer need the older route. That is a meaningful contribution to reducing piracy. It is not a promise that illegal distribution has lost the ability to adapt. New services can copy programmes and offer them in different packages as the market changes. An account of piracy should therefore preserve both parts of the history: legal streaming helped at one stage, while the later growth of illegal streaming created a renewed problem.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>Agreement that piracy is harmful is only the beginning of a joint response. A studio may hold evidence about an unauthorised copy, a technology company may understand the service carrying it, and local authorities may have the power to investigate. None automatically possesses all three kinds of knowledge or authority. Cooperation becomes useful when these roles are connected through a procedure that participants can actually follow. A slogan shared by everyone is not enough. The practical question is who supplies usable evidence, who evaluates it, and who is able to act on it in a particular case.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>Closing an illegal site is a real event, but it is not a complete description of the market. A familiar name may disappear while the same operation reappears under another address. Conversely, one closure may interrupt access for a substantial group of viewers. The number of closed addresses alone cannot distinguish these situations. Investigators therefore need to ask what remained unavailable, for how long, and whether the operators or audiences simply moved elsewhere. A useful report pairs its count of interventions with evidence about the activity those interventions actually disrupted, rather than treating every closed page as an equal unit of lasting success.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>A forecast that piracy may stop growing is not a forecast that it will soon disappear. Even a stable level can impose continuing losses on legal businesses. Nor does disagreement about the date of a decline prove that decline is impossible. Each statement has a different strength, and each answers a different question. Careful reporting preserves those distinctions: whether activity is increasing, whether it might level off, and when it might begin to fall. It also names the measure being discussed, because fewer sites, fewer viewers and smaller financial losses need not move together at the same moment.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】B. Trace who pays and who profits\u003c/p>\n\u003cblockquote>\n\u003cp>追踪谁承担成本、谁取得收益\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分沿作品制作、被复制、收入流向追踪经济关系，说明非法经营盈利不能当作其创造内容价值的证明。\u003c/p>\n\u003cp>先看同一内容背后的成本关系。\u003c/p>\n\u003cblockquote>\n\u003cp>without making the same contribution to its production\u003c/p>\n\u003c/blockquote>\n\u003cp>两个平台提供同一部影片，不能说明都为制作投入了相同资源。开头把可见的相同内容与不可见的成本分担分开，是后面讨论收益流向的前提。\u003c/p>\n\u003cp>接着看非法经营的优势来自哪里。\u003c/p>\n\u003cblockquote>\n\u003cp>without bearing an important part of the first service&#39;s costs\u003c/p>\n\u003c/blockquote>\n\u003cp>复制者可以收费却不承担制作或授权成本，解释了为何利润可能高。作者没有把这种低成本说成创新效率更高，而是指出收益与成本承担者分离。\u003c/p>\n\u003cp>结尾要求怎样读经济数据？\u003c/p>\n\u003cblockquote>\n\u003cp>follow the money alongside the content\u003c/p>\n\u003c/blockquote>\n\u003cp>三个问题分别问谁资助、谁收钱、谁受损，将内容来源和资金流向共同纳入判断。只报广告收入或利润率都会漏掉成本由谁承担。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>同片源不等于同投入 → 复制经营省去制作或授权成本 → 高利润不能证明新增价值 → 同时追踪成本、付款与损失。\u003c/p>\n\u003c/blockquote>\n\u003cp>who pays对应资助制作或获得授权的一方，who profits对应靠复制内容收费的一方，Trace要求沿同一作品追踪这两条资金关系。标题准确覆盖了开头对照与结尾三个问题，而不把高利润孤立成经营成功。\u003c/p>\n\u003cp>再看最强干扰项F：Check what a count of closures measures。\u003c/p>\n\u003cp>“检查关闭数量”也要求谨慎看指标，但本段没有关闭网站、执法结果或平台数量。这里需要拆开的数字是利润与成本，追踪对象是作品收入的分配；不能因为同样谈测量就把具体问题替换掉。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】C. Keep an early success in its time frame\u003c/p>\n\u003cblockquote>\n\u003cp>把早期成效放回相应时间范围\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分保留合法服务早期遏制盗版的作用，同时用后来盗版经营变化限制这一历史成绩可以支持的结论。\u003c/p>\n\u003cp>早期作用的机制是什么？\u003c/p>\n\u003cblockquote>\n\u003cp>a usable alternative to exchanging unauthorised files\u003c/p>\n\u003c/blockquote>\n\u003cp>合法服务提供可用替代，部分观众便不再走未经授权文件交换这条路。some限定作用范围，不能把帮助部分选择改成消灭所有盗版。\u003c/p>\n\u003cp>转折限制了什么推断？\u003c/p>\n\u003cblockquote>\n\u003cp>It is not a promise that illegal distribution has lost the ability to adapt.\u003c/p>\n\u003c/blockquote>\n\u003cp>It回指前面的遏制作用，作者否定由此保证盗版以后无法变化。真实的历史成绩和永久解决问题之间，缺少的是对后来行为的证明。\u003c/p>\n\u003cp>最后怎样容纳看似相反的事实？\u003c/p>\n\u003cblockquote>\n\u003cp>legal streaming helped at one stage\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾把一个阶段帮助遏制与后来非法流媒体增长并列。前后条件改变，所以后来的问题不抹杀过去的作用，过去的作用也不否定现在的损害。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>合法便利提供替代 → 部分人少用旧文件渠道 → 盗版仍可适应市场 → 同时保留早期成效和后期反弹。\u003c/p>\n\u003c/blockquote>\n\u003cp>early success指合法服务提供替代后产生的遏制作用，time frame要求把它限定在某一阶段。标题的Keep说明这份成绩不应被后来问题抹掉，同时也不能被扩大为对未来彻底消除的保证。\u003c/p>\n\u003cp>再看最强干扰项D：Expect convenience to eliminate piracy。\u003c/p>\n\u003cp>“期待便利服务消灭盗版”利用首句convenient及减少旧渠道的事实，却跨过not a promise的明确限制。段落后半专门写非法服务适应市场并重生问题，作用是拆除永久解决的推断，而非宣布便利足够。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】A. Turn shared concern into workable cooperation\u003c/p>\n\u003cblockquote>\n\u003cp>把共同关切变成可实施的合作\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分从共同反对盗版出发，说明合作还需要明确角色、行动程序与可使用证据，而不止共同口号。\u003c/p>\n\u003cp>开头为什么只说beginning？\u003c/p>\n\u003cblockquote>\n\u003cp>Agreement that piracy is harmful is only the beginning\u003c/p>\n\u003c/blockquote>\n\u003cp>共同认为盗版有害只确立目标，尚未解决行动怎样发生。后面不同参与方分别掌握证据、技术认识和调查权限，解释了目标一致为何不足以直接行动。\u003c/p>\n\u003cp>合作的实质是什么？\u003c/p>\n\u003cblockquote>\n\u003cp>these roles are connected through a procedure\u003c/p>\n\u003c/blockquote>\n\u003cp>these roles回指三类不同能力，通过能被遵循的程序连接，合作才有实际作用。这里关注分工和流程，不是把三个主体合成一个无所不能的机构。\u003c/p>\n\u003cp>末尾怎样检验口号落地？\u003c/p>\n\u003cblockquote>\n\u003cp>who supplies usable evidence, who evaluates it, and who is able to act on it\u003c/p>\n\u003c/blockquote>\n\u003cp>三个who落实提供证据、评价证据和采取行动的责任。只有逐项回答，共同关切才能在具体案件中产生结果；抽象号召不能替代这些衔接。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>共同反对盗版只是起点 → 各方掌握不同能力 → 用可遵循程序连接角色 → 明确供证、核证和行动责任。\u003c/p>\n\u003c/blockquote>\n\u003cp>shared concern对应共同承认有害，workable cooperation对应实际可遵循的分工程序，Turn强调从态度一致走向可操作行动的转变。标题覆盖整段的问题与方案，而不仅是赞美多方参与。\u003c/p>\n\u003cp>再看最强干扰项G：Measure success by arrests alone。\u003c/p>\n\u003cp>“仅以逮捕衡量成效”能碰到authorities和investigate，但段落既未给逮捕统计，也没有比较成果指标。其关注点在行动之前：谁有材料和权限、怎样衔接。把合作程序改成结果数量，会跳过全文实际解决的问题。\u003c/p>\n\u003cp>\u003cstrong>43题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】F. Check what a count of closures measures\u003c/p>\n\u003cblockquote>\n\u003cp>检查关闭数量究竟衡量什么\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分承认网站关闭是真实成绩，再区分被关闭地址数与盗版网络规模，说明为什么要继续追踪重现和转移。\u003c/p>\n\u003cp>首先承认什么，再限制什么？\u003c/p>\n\u003cblockquote>\n\u003cp>a real event, but it is not a complete description of the market\u003c/p>\n\u003c/blockquote>\n\u003cp>关闭并非虚假成绩，但一次事件不能自动概括市场整体变化。这样既不否认行动发生，也避免由局部结果跳到盗版整体减少。\u003c/p>\n\u003cp>数量为什么无法自行说明成效？\u003c/p>\n\u003cblockquote>\n\u003cp>cannot distinguish these situations\u003c/p>\n\u003c/blockquote>\n\u003cp>these situations包含换址重现与真正中断大群用户访问两种情况。同样一个关闭数可能对应不同实际影响，所以只加总地址会丢失持续性与规模差异。\u003c/p>\n\u003cp>末句要求给统计配上什么？\u003c/p>\n\u003cblockquote>\n\u003cp>evidence about the activity those interventions actually disrupted\u003c/p>\n\u003c/blockquote>\n\u003cp>统计要配被实际打断活动的证据，包括持续多久及是否转移。被数的是干预事件，要评价的却是持续的活动变化，两者需要证据连接。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>承认关闭事件 → 区分换址与真实中断 → 单一数量无法辨别 → 结合持续时间和活动转移评价实际成效。\u003c/p>\n\u003c/blockquote>\n\u003cp>count of closures准确指关闭地址的数量，what…measures要求弄清这种数字对应干预事件还是持久市场变化。Check不是否定统计，而是补上从次数到效果之间缺少的证据。\u003c/p>\n\u003cp>再看最强干扰项G：Measure success by arrests alone。\u003c/p>\n\u003cp>“仅以逮捕衡量成功”同样谈执法数字，因而容易因主题接近被选。但本段根本没有以逮捕为指标，且反复反对alone式单一计数。它主张数量加活动证据，干扰项既换指标，又反写评价办法。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】E. Distinguish stabilisation from decline\u003c/p>\n\u003cblockquote>\n\u003cp>区分趋稳与下降\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分依次区分增长、趋稳、下降与消失，指出预测语气与测量对象都不能在摘要中被悄悄改变。\u003c/p>\n\u003cp>第一句区分哪些变化？\u003c/p>\n\u003cblockquote>\n\u003cp>may stop growing\u003c/p>\n\u003c/blockquote>\n\u003cp>may保留预测的不确定，stop growing只说不再增加。它没有推出开始减少，更没有推出很快消失；首句把速度变化、方向变化和归零分别放开。\u003c/p>\n\u003cp>意见不一能证明永不下降吗？\u003c/p>\n\u003cblockquote>\n\u003cp>disagreement about the date of a decline\u003c/p>\n\u003c/blockquote>\n\u003cp>争议对象是下降日期，不是下降的逻辑可能性。作者同时防止两个极端：把趋稳说成很快消失，以及把时间没定说成永远不行。\u003c/p>\n\u003cp>末尾为什么还要说明指标？\u003c/p>\n\u003cblockquote>\n\u003cp>fewer sites, fewer viewers and smaller financial losses\u003c/p>\n\u003c/blockquote>\n\u003cp>站点、观众、财务损失是三个变量，它们未必同步变化。即便使用同一个decline，也需要问什么在下降，不能将一种指标替换成另外两种。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>不再增长不等于消失 → 稳定水平仍会有损失 → 时间分歧不等于下降不可能 → 保留判断强度并点明指标。\u003c/p>\n\u003c/blockquote>\n\u003cp>stabilisation对应level off和stop growing，decline对应begin to fall。Distinguish要求保留时间、概率与变量的边界，能够统领整段逐层拆开的预测含义，而不把谨慎判断说成悲观或乐观口号。\u003c/p>\n\u003cp>再看最强干扰项F：Check what a count of closures measures。\u003c/p>\n\u003cp>“检查关闭数量”与末句fewer sites有关，但只覆盖三个指标中的一个。本段主要比较趋稳、下降、消失和日期分歧的意义，关闭数只是最后补充的变量提醒，不能让局部指标取代贯穿全段的预测区别。\u003c/p>\n\u003cp>\u003cstrong>45题选E。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>Legal streaming was once welcomed as a convenient answer to a familiar form of digital piracy. People who had exchanged unauthorised files could obtain programmes through a legitimate service instead. That early experience still matters when judging the industry, but its meaning depends on keeping the past achievement separate from a claim about all later piracy.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>The past achievement was a reduction in the attraction of the older file-sharing route, not the permanent removal of illegal distribution. Viewers had another option, and that could change their behaviour. Meanwhile, illegal operators could change theirs too. The later development of pirate streaming services is one reason the original success did not settle the matter.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Progress cannot be measured simply by adding up vanished web addresses. Operators may rebuild elsewhere, while some closures may have a more lasting effect on access. The useful distinction is between an intervention and a sustained reduction in illegal activity. Even where the latter has occurred locally, it does not by itself determine the future of piracy as a whole.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Connecting those abilities requires several participants. Rights holders can identify the copied work, technical specialists can help trace the service, and local authorities can carry out appropriate investigations. A joint operation can turn those contributions into the closure of an illegal platform. Such closures supply visible evidence of progress, but they also raise a question about what progress should mean.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>The largest missing cost is the production of the content itself. An illegal distributor can sell access without paying to create the film in the first place. This is more than a small, informal exchange between viewers: it can be an organised business. A response must therefore connect knowledge of the content with the ability to investigate its operators.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>Those later services create a renewed economic problem. They obtain films or programmes from legitimate platforms and make money by offering access to the copied material. Legal businesses may consequently face competition from services selling content they did not finance. Understanding why these rivals can profit so readily requires a closer look at their costs.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>That wider future calls for forecasts with clear limits. An expectation that piracy may level off differs from a prediction that it will decline, and neither is a promise of elimination. Losses may continue even if growth stops. When analysts disagree about the timing of a fall, their uncertainty should remain visible in any summary of the outlook.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>These limits make a balanced conclusion possible. The early help provided by legal services and the results of joint enforcement can be recognised without pretending that economic harm has ended. Equally, continuing losses do not erase every achievement. The task is to assess actual harm and actual improvements on their own evidence, using neither as a substitute for the other.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出合法服务的早期反盗版作用，并限定其历史意义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>解释早期替代作用并引出后来非法流媒体的发展\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>区分关闭事件和持久活动减少，并限制局部成绩的外推\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>说明多方协作怎样促成关闭，再提出成效的衡量问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>解释不承担制作成本的组织化经营，提出连接证据与调查能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>说明后来盗版服务的经济损害，并转问其低成本优势\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>区分总体预测的趋稳、下降和消除，并保留时间不确定性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>总结同时承认实际进展与持续经济损害的评价原则\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出合法服务的早期反盗版作用，并限定其历史意义 → 解释早期替代作用并引出后来非法流媒体的发展 → 说明后来盗版服务的经济损害，并转问其低成本优势 → 解释不承担制作成本的组织化经营，提出连接证据与调查能力 → 说明多方协作怎样促成关闭，再提出成效的衡量问题 → 区分关闭事件和持久活动减少，并限制局部成绩的外推 → 区分总体预测的趋稳、下降和消除，并保留时间不确定性 → 总结同时承认实际进展与持续经济损害的评价原则\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → B → F → E → D → C → G → H\u003c/strong>\u003c/p>\n\u003cp>41—45：B、F、D、C、G。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → B → F的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>That early experience still matters when judging the industry, but its meaning depends on keeping the past achievement separate from a claim about all later piracy.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The past achievement was a reduction in the attraction of the older file-sharing route, not the permanent removal of illegal distribution.\u003c/p>\n\u003c/blockquote>\n\u003cp>A末尾要求把past achievement与后来盗版的判断分开，本段The past achievement直接给出该成绩的具体含义：旧文件共享渠道吸引力下降。它先回答历史成绩是什么，再说明不是永久清除非法传播。\u003c/p>\n\u003cp>段中先说观众有合法替代、行为可以改变，Meanwhile再将同样的变化能力转给非法经营者。由用户改变到盗版者适应，解释了为何早期遏制并不能一劳永逸地解决后来的形式。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>The later development of pirate streaming services is one reason the original success did not settle the matter.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those later services create a renewed economic problem.\u003c/p>\n\u003c/blockquote>\n\u003cp>末句提到后来发展的pirate streaming services，后段Those later services准确接住这类新服务，再说明复制内容赚钱及其经济威胁。先引入后来形式，再讨论其后果，指代和时间顺序都连续。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>提出合法服务的早期反盗版作用，并限定其历史意义 → 解释早期替代作用并引出后来非法流媒体的发展 → 说明后来盗版服务的经济损害，并转问其低成本优势\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those later services create a renewed economic problem.\u003c/p>\n\u003c/blockquote>\n\u003cp>描述经济问题的候选也能接到盗版主题，但其开头Those later services需要先出现后来非法流媒体这一明确对象。A只区分早期成绩与后期判断，还没引入这种具体服务；直接放它会跳过早期成绩的定义和盗版形式的变化。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成B → F → E的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The later development of pirate streaming services is one reason the original success did not settle the matter.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those later services create a renewed economic problem.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段末句刚引入后来发展的非法流媒体，本段Those later services无须重新命名即可回指。renewed接上“早期作用没有彻底解决”的限制，说明新的问题并不否定早期确有作用。\u003c/p>\n\u003cp>本段以取得合法片源、复制后收费、与出资者竞争三步展开经济关系。重点不是描述用户观看习惯，而是说明这些服务赚谁的内容的钱，并据此在结尾追问为何能轻易获利。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Understanding why these rivals can profit so readily requires a closer look at their costs.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The largest missing cost is the production of the content itself.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段最后问成本结构，固定E开头The largest missing cost直接回答制作内容的成本被省去。一个提出盈利原因问题，一个给出关键成本差异，使后续组织化经营与联合应对都有依据。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>解释早期替代作用并引出后来非法流媒体的发展 → 说明后来盗版服务的经济损害，并转问其低成本优势 → 解释不承担制作成本的组织化经营，提出连接证据与调查能力\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Progress cannot be measured simply by adding up vanished web addresses.\u003c/p>\n\u003c/blockquote>\n\u003cp>区分关闭数与实际活动的候选也谈盗版没有结束，但Progress预设前面已经有行动与成绩。此处尚在解释后来服务带来什么问题，放入执法评价既缺少成绩来源，也无法引出E的missing cost这个明确答案。\u003c/p>\n\u003cp>\u003cstrong>42题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → D → C的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A response must therefore connect knowledge of the content with the ability to investigate its operators.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Connecting those abilities requires several participants.\u003c/p>\n\u003c/blockquote>\n\u003cp>固定E最后要求将内容知识与调查能力连接，本段Connecting those abilities逐字接住这项任务。接着分配权利人、技术人员和地方当局各自的能力，使“连接”不再只是一般合作口号。\u003c/p>\n\u003cp>本段由角色分工推进到joint operation，再到平台关闭的可见成果。最后的but保留问题：事件确实发生，是否代表持久进步仍需另行评价，不能在获得成绩后立刻宣布问题结束。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Such closures supply visible evidence of progress, but they also raise a question about what progress should mean.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Progress cannot be measured simply by adding up vanished web addresses.\u003c/p>\n\u003c/blockquote>\n\u003cp>段尾问what progress should mean，后段Progress cannot be measured simply回答不能只累加消失地址。前段产生评价问题，后段给出衡量限制，具体围绕平台关闭这一同一项结果展开。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>解释不承担制作成本的组织化经营，提出连接证据与调查能力 → 说明多方协作怎样促成关闭，再提出成效的衡量问题 → 区分关闭事件和持久活动减少，并限制局部成绩的外推\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Progress cannot be measured simply by adding up vanished web addresses.\u003c/p>\n\u003c/blockquote>\n\u003cp>直接谈Progress的候选看似能回应打击盗版，但固定E只提出连接能力，还没有共同行动或关闭成绩。若把指标判断提前，visible progress没有来源，E要求怎样组织行动的问题也被跳过。\u003c/p>\n\u003cp>\u003cstrong>43题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成D → C → G的关系。\u003c/p>\n\u003cp>先看前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Such closures supply visible evidence of progress, but they also raise a question about what progress should mean.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Progress cannot be measured simply by adding up vanished web addresses.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段已经说明联合行动能促成关闭，又追问这种进步意味着什么，本段先否定简单相加消失地址，针对的是该项特定结果。vanished addresses因而是前段平台关闭的另一种表达，不是另起网络技术话题。\u003c/p>\n\u003cp>换址重建与长期中断构成两种结果，用以区分一次干预和持续减少。即便某地确有持久减少，结尾仍限制其对全球未来的推断，避免把局部实绩扩大成总体走向。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Even where the latter has occurred locally, it does not by itself determine the future of piracy as a whole.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That wider future calls for forecasts with clear limits.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段落在future of piracy as a whole，后段That wider future准确回指总体未来，开始谈预测的边界。由已有局部观察转向未定总体预期，主题尺度的变化在两段接缝处明确给出。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明多方协作怎样促成关闭，再提出成效的衡量问题 → 区分关闭事件和持久活动减少，并限制局部成绩的外推 → 区分总体预测的趋稳、下降和消除，并保留时间不确定性\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That wider future calls for forecasts with clear limits.\u003c/p>\n\u003c/blockquote>\n\u003cp>预测段也在提醒谨慎，但That wider future必须先有局部与总体的对照，才知道wider比什么更广。若它直接接联合行动段，关闭数量如何解释尚未解决，也会令随后Progress段倒退回已跳过的评价问题。\u003c/p>\n\u003cp>\u003cstrong>44题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成C → G → H的关系。\u003c/p>\n\u003cp>先看前段C的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Even where the latter has occurred locally, it does not by itself determine the future of piracy as a whole.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That wider future calls for forecasts with clear limits.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段说局部活动减少不能决定盗版整体未来，本段That wider future回指这个更大的范围。开头的clear limits回应的是外推风险，随后具体区分预测声称的程度，而非再次列执法案例。\u003c/p>\n\u003cp>趋稳、下降与消除依次增强，段中又指出即使停止增长仍有损失。最后保留分析师对下降时间的分歧，说明摘要必须同时保留概率、程度和时间的不确定，不能把措辞压成确定好转。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>When analysts disagree about the timing of a fall, their uncertainty should remain visible in any summary of the outlook.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>These limits make a balanced conclusion possible.\u003c/p>\n\u003c/blockquote>\n\u003cp>固定H的These limits回指这里列出的预测边界，据此总结可以承认早期帮助和执法成绩，同时不假定经济损害结束。结论既继承近期谨慎，也回收前面实际成效，形成完整收束。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>区分关闭事件和持久活动减少，并限制局部成绩的外推 → 区分总体预测的趋稳、下降和消除，并保留时间不确定性 → 总结同时承认实际进展与持续经济损害的评价原则\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Connecting those abilities requires several participants.\u003c/p>\n\u003c/blockquote>\n\u003cp>多方协作的候选也会通向平衡判断，但它的Connecting those abilities依赖固定E的能力连接，且末尾提出的是关闭成绩如何衡量。放在H前会让These limits缺少刚阐明的预测边界，并将文章无故退回行动机制。\u003c/p>\n\u003cp>\u003cstrong>45题选G。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>a sense of responsibility\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>责任意识\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：责任感、奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>critical judgment\u003c/td>\n\u003ctd>批判性判断\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>teamwork\u003c/td>\n\u003ctd>团队合作\u003c/td>\n\u003ctd>人生哲理类：团结合作\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>business profitability\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>企业盈利能力\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>经济消费类：企业经营\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>economic losses\u003c/td>\n\u003ctd>经济损失\u003c/td>\n\u003ctd>经济消费类：企业经营\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>business cooperation\u003c/td>\n\u003ctd>企业合作\u003c/td>\n\u003ctd>经济消费类：企业经营\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>access to online content\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>获取网络内容\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会生活类：获取信息的方式\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>digital entertainment\u003c/td>\n\u003ctd>数字娱乐\u003c/td>\n\u003ctd>社会生活类：生活质量\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>technological development\u003c/td>\n\u003ctd>技术发展\u003c/td>\n\u003ctd>经济消费类：科技发展\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture contrasts the situation of A with that of B.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画对照了A和B的处境。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>In the picture, A benefits from an activity while B bears its cost.\u003c/td>\n\u003ctd>图中，A从一项活动获益，而B承担其成本。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The people shown in the picture are working together to deal with A.\u003c/td>\n\u003ctd>图中的人们正在合作应对A。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart records a decline in A from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表记录了A从X降至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>While A increased over the period, B struggled to recover.\u003c/td>\n\u003ctd>这段时期A上升，而B难以恢复。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>By the end of the period, the cumulative figure had reached X.\u003c/td>\n\u003ctd>到该时期末，累计数值已达到X。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage compares the gains of A with the losses suffered by B.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>材料对比了A所得与B所遭受的损失。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The writer describes measures taken to address A and then assesses their results.\u003c/td>\n\u003ctd>作者描述了应对A的措施，随后评估其结果。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage acknowledges some progress but leaves the timing of further improvement uncertain.\u003c/td>\n\u003ctd>材料承认已有进展，但进一步改善的时间仍不确定。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":7},{"label":"句内逻辑","index":31},{"label":"长难句手译","index":34},{"label":"第三鸟 · 题目复盘","index":53},{"label":"35题","index":54},{"label":"31题","index":64},{"label":"32题","index":82},{"label":"33题","index":100},{"label":"34题","index":118},{"label":"第四鸟 · 新题型","index":136},{"label":"小标题题","index":136},{"label":"排序题","index":142},{"label":"第五鸟 · 写作积累","index":148}];
const allIndices = [0,1,2,3,4,5,6,10,14,18,22,26,30,31,32,33,34,40,46,52,53,54,56,58,60,62,63,64,68,72,76,80,81,82,86,90,94,98,99,100,104,108,112,116,117,118,122,126,130,134,135,136,137,138,139,140,141,142,143,144,145,146,147,148,149];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{

 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
 const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
 const top=rightScroll.scrollTop+er.top-sr.top;
 const target=height<=view-2*margin?top+height/2-view/2:top-margin;
 rightScroll.scrollTop=clampScroll(target,rightScroll.scrollHeight-view);
}
function positionRight(st,token,restore){
 guardedSchedule(token,()=>{
  if(isLongSentenceCumulative(st)){
   positionLongSentence(st);
   if(!restore)return;
  }
  if(restore){
