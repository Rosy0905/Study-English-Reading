u003ctr>\n\u003ctd>optimism\u003c/td>\n\u003ctd>n.乐观情绪\u003c/td>\n\u003ctd>emerging countermeasures\u003c/td>\n\u003ctd>n.新出现的应对措施\u003c/td>\n\u003ctd>best practices\u003c/td>\n\u003ctd>n.最佳实践\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plateau\u003c/td>\n\u003ctd>v.进入平稳期\u003c/td>\n\u003ctd>consensus\u003c/td>\n\u003ctd>n.共识\u003c/td>\n\u003ctd>stakeholders\u003c/td>\n\u003ctd>n.利益相关方\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decline\u003c/td>\n\u003ctd>v.下降\u003c/td>\n\u003ctd>analyst\u003c/td>\n\u003ctd>n.分析师\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Ever since taking on Netflix Inc at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Ever since taking on Netflix Inc / at its own game, / old Hollywood has struggled / to turn a profit / in streaming, / with the likes of Disney+, Peacock and Paramount+ / losing billions of dollars each year, / sparking concerns / that the services will never be / as profitable as cable once was.\u003c/p>\n\u003cp>But the age of streaming / has been a boon / for some unintended winners: / pirates that use software / to rip a film or television show / in seconds / from legitimate online video platforms / and host the titles / on their own, illegitimate services, / which rake in / about $2 billion annually / from ads and subscriptions.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>自从开始玩Netflix公司 / 的游戏以来，/ 老好莱坞一直在努力 / 实现盈利 / 在流媒体方面，/ 像Disney+、Peacock和Paramount+ / 每年损失数十亿美元，/ 引发担忧 / 这些服务将永远不会 / 像有线电视曾经那样盈利。\u003c/p>\n\u003cp>但流媒体时代 / 已经成为福音 / 对一些意外的赢家：/ 盗版者使用软件 / 撕取电影或电视节目 / 在几秒钟内 / 从合法的在线视频平台 / 并托管这些片名 / 在他们自己的非法服务上，/ 这些服务赚取 / 每年约20亿美元 / 从广告和订阅中。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>自从老好莱坞开始在流媒体领域与Netflix竞争以来，一直难以实现盈利。Disney+、Peacock和Paramount+等平台每年损失数十亿美元，引发了对这些服务永远无法像有线电视那样盈利的担忧。但流媒体时代却让一些意外的赢家获益：盗版者使用软件在几秒钟内从合法在线视频平台撕取电影或电视节目，并在自己的非法服务上托管这些内容，每年从广告和订阅中赚取约20亿美元。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>With no video production costs, illegal streaming sites have achieved profit margins approaching 90%, according to the Motion Picture Association (MPA), a trade group representing Hollywood studios that&#39;s working to crack down on the thousands of illegal platforms that have cropped up in recent years.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>With no video production costs, / illegal streaming sites / have achieved profit margins / approaching 90%, / according to the Motion Picture Association (MPA), / a trade group representing Hollywood studios / that&#39;s working to crack down on / the thousands of illegal platforms / that have cropped up / in recent years.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>由于没有视频制作成本，/ 非法流媒体网站 / 已经实现了利润率 / 接近90%，/ 根据电影协会（MPA），/ 一个代表好莱坞制片厂的贸易组织 / 正在努力打击 / 成千上万的非法平台 / 这些平台已经出现 / 在最近几年。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>由于没有视频制作成本，非法流媒体网站的利润率接近90%，这是代表好莱坞制片厂的贸易组织——电影协会（MPA）提供的数据。该组织正在努力打击近年来出现的成千上万个非法平台。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads. But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs estimates the US Chamber of Commerce&#39;s Global Innovation Policy Center. The global impact is about $71 billion annually.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Initially / the rise of legitimate online businesses / such as Netflix / actually helped curb / digital piracy, / which had largely been based on / file uploads.\u003c/p>\n\u003cp>But now / piracy involving illegal streaming services / as well as file-sharing / costs the US economy / about $30 billion / in lost revenue a year / and some 250,000 jobs / estimates the US Chamber of Commerce&#39;s / Global Innovation Policy Center.\u003c/p>\n\u003cp>The global impact / is about $71 billion annually.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>最初 / 合法在线业务的兴起 / 比如Netflix / 实际上帮助遏制了 / 数字盗版，/ 这种盗版主要基于 / 文件上传。\u003c/p>\n\u003cp>但现在 / 涉及非法流媒体服务的盗版 / 以及文件共享 / 使美国经济损失 / 约300亿美元 / 每年的收入损失 / 以及约25万个工作岗位 / 美国商会估计 / 全球创新政策中心。\u003c/p>\n\u003cp>全球影响 / 每年约710亿美元。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>最初，Netflix等合法在线业务的兴起实际上帮助遏制了主要基于文件上传的数字盗版。但现在，涉及非法流媒体服务和文件共享的盗版每年给美国经济造成约300亿美元的收入损失和约25万个工作岗位的流失，这是美国商会全球创新政策中心的估计。全球影响每年约710亿美元。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>&quot;The people who are stealing our movies and our television shows and operating piracy sites are not mom and pop operations,&quot; says Charlie Rivkin, chief executive officer of the MPA. &quot;This is organized crime.&quot; Rivkin joined the MPA in 2017 after the organization failed five years earlier to build consensus between Hollywood and Silicon Valley to win passage of legislation in Congress aimed at stopping online piracy. In 2017 the association formed the Alliance for Creativity and Entertainment (ACE), an enforcement task force of about 100 detectives circling the globe to help local authorities arrest streaming pirates.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>&quot;The people who are stealing / our movies and our television shows / and operating piracy sites / are not mom and pop operations,&quot; / says Charlie Rivkin, / chief executive officer of the MPA.\u003c/p>\n\u003cp>&quot;This is organized crime.&quot;\u003c/p>\n\u003cp>Rivkin joined the MPA / in 2017 / after the organization failed / five years earlier / to build consensus / between Hollywood and Silicon Valley / to win passage of legislation / in Congress / aimed at stopping online piracy.\u003c/p>\n\u003cp>In 2017 / the association formed / the Alliance for Creativity and Entertainment (ACE), / an enforcement task force / of about 100 detectives / circling the globe / to help local authorities / arrest streaming pirates.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>&quot;那些偷窃 / 我们的电影和电视节目 / 并运营盗版网站的人 / 不是夫妻店，&quot; / 查理·里夫金说，/ MPA的首席执行官。\u003c/p>\n\u003cp>&quot;这是有组织犯罪。&quot;\u003c/p>\n\u003cp>里夫金加入了MPA / 在2017年 / 在该组织失败后 / 五年前 / 建立共识 / 在好莱坞和硅谷之间 / 赢得立法通过 / 在国会 / 旨在阻止在线盗版。\u003c/p>\n\u003cp>在2017年 / 该协会成立了 / 创意与娱乐联盟（ACE），/ 一个执法特遣队 / 约100名侦探 / 环游全球 / 帮助地方当局 / 逮捕流媒体盗版者。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>&quot;偷窃我们的电影和电视节目并运营盗版网站的人不是夫妻店经营，&quot;MPA首席执行官查理·里夫金说。&quot;这是有组织犯罪。&quot;里夫金于2017年加入MPA，此前该组织在五年前未能在好莱坞和硅谷之间建立共识，以推动国会通过旨在阻止在线盗版的立法。2017年，该协会成立了创意与娱乐联盟（ACE），这是一个由约100名侦探组成的执法特遣队，在全球范围内帮助地方当局逮捕流媒体盗版者。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>ACE says it&#39;s helped shrink the number of illegal streaming services in North America to 126, from more than 1,400 in 2018, aided in part by the MPA&#39;s support for a 2020 federal law that made large-scale streaming of copyrighted material a serious crime.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>ACE says / it&#39;s helped shrink / the number of illegal streaming services / in North America / to 126, / from more than 1,400 / in 2018, / aided in part / by the MPA&#39;s support / for a 2020 federal law / that made large-scale streaming / of copyrighted material / a serious crime.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>ACE说 / 它帮助减少了 / 非法流媒体服务的数量 / 在北美 / 到126个，/ 从超过1400个 / 在2018年，/ 部分得益于 / MPA的支持 / 对2020年联邦法律 / 该法律使大规模流媒体传输 / 受版权保护的材料 / 成为严重犯罪。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>ACE表示，在北美地区，它帮助将非法流媒体服务的数量从2018年的1400多个减少到126个，这部分得益于MPA支持的2020年联邦法律，该法律将大规模传输受版权保护材料定为严重犯罪。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>Consulting firm Parks Associates predicts that legitimate US streaming services&#39; cumulative loss from piracy since 2022 will reach $113 billion in the next two years. &quot;While there is some optimism that emerging countermeasures and best practices may see piracy begin to plateau by 2027, there is no consensus among stakeholders as to when it may begin to decline,&quot; says analyst Steve Hawley.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>Consulting firm Parks Associates / predicts / that legitimate US streaming services&#39; / cumulative loss from piracy / since 2022 / will reach $113 billion / in the next two years.\u003c/p>\n\u003cp>&quot;While there is some optimism / that emerging countermeasures / and best practices / may see piracy begin to plateau / by 2027, / there is no consensus / among stakeholders / as to when it may begin to decline,&quot; / says analyst Steve Hawley.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>咨询公司Parks Associates / 预测 / 合法的美国流媒体服务的 / 因盗版造成的累计损失 / 自2022年以来 / 将达到1130亿美元 / 在未来两年内。\u003c/p>\n\u003cp>&quot;虽然有一些乐观情绪 / 认为新兴的对策 / 和最佳实践 / 可能会看到盗版开始趋于平稳 / 到2027年，/ 但没有共识 / 在利益相关者中 / 关于何时可能开始下降，&quot; / 分析师史蒂夫·霍利说。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>咨询公司Parks Associates预测，自2022年以来，合法的美国流媒体服务因盗版造成的累计损失将在未来两年内达到1130亿美元。分析师史蒂夫·霍利说：&quot;虽然有一些乐观情绪认为新兴的对策和最佳实践可能会使盗版在2027年开始趋于平稳，但利益相关者对于盗版何时可能开始下降并没有达成共识。&quot;\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>Ever since taking on Netflix Inc：(at its own game) → old Hollywood has struggled → to turn a profit：(in streaming) → with the likes of Disney+, Peacock and Paramount+：(losing billions of dollars each year) → sparking concerns：(that the services will never be → as profitable as cable once was).\u003c/p>\n\u003cp>But the age of streaming → has been a boon → for some unintended winners：pirates：(that use software → to rip a film or television show：(in seconds)：(from legitimate online video platforms) + host the titles：(on their own, illegitimate services))：(which rake in → about $2 billion annually：(from ads and subscriptions)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>With no video production costs → illegal streaming sites → have achieved profit margins：(approaching 90%) → according to the Motion Picture Association (MPA)：(a trade group representing Hollywood studios：(that&#39;s working to crack down on → the thousands of illegal platforms：(that have cropped up：(in recent years)))).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Initially → the rise of legitimate online businesses：(such as Netflix) → actually helped curb → digital piracy：(which had largely been based on → file uploads).\u003c/p>\n\u003cp>But now → piracy：(involving illegal streaming services + file-sharing) → costs the US economy → about $30 billion：(in lost revenue a year) + some 250,000 jobs → estimates the US Chamber of Commerce&#39;s Global Innovation Policy Center.\u003c/p>\n\u003cp>The global impact → is about $71 billion annually.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>&quot;The people：(who are stealing → our movies and our television shows + operating piracy sites) → are not mom and pop operations,&quot; → says Charlie Rivkin：(chief executive officer of the MPA).\u003c/p>\n\u003cp>&quot;This is organized crime.&quot;\u003c/p>\n\u003cp>Rivkin joined the MPA：(in 2017) → after the organization failed：(five years earlier) → to build consensus：(between Hollywood and Silicon Valley) → to win passage of legislation：(in Congress)：(aimed at stopping online piracy).\u003c/p>\n\u003cp>In 2017 → the association formed → the Alliance for Creativity and Entertainment (ACE)：(an enforcement task force：(of about 100 detectives)：(circling the globe)：(to help local authorities → arrest streaming pirates)).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>ACE says → it&#39;s helped shrink → the number of illegal streaming services：(in North America) → to 126：(from more than 1,400：(in 2018)) → aided in part：(by the MPA&#39;s support：(for a 2020 federal law：(that made large-scale streaming：(of copyrighted material) → a serious crime))).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Consulting firm Parks Associates → predicts：(that legitimate US streaming services&#39; cumulative loss from piracy：(since 2022) → will reach $113 billion：(in the next two years)).\u003c/p>\n\u003cp>&quot;While there is some optimism：(that emerging countermeasures + best practices → may see piracy begin to plateau：(by 2027)) // there is no consensus：(among stakeholders)：(as to when it may begin to decline),&quot; → says analyst Steve Hawley.\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>自从开始玩Netflix公司：(的游戏) → 老好莱坞一直在努力 → 实现盈利：(在流媒体方面) → 像Disney+、Peacock和Paramount+：(每年损失数十亿美元) → 引发担忧：(这些服务将永远不会 → 像有线电视曾经那样盈利)。\u003c/p>\n\u003cp>但流媒体时代 → 已经成为福音 → 对一些意外的赢家：盗版者：(使用软件 → 撕取电影或电视节目：(在几秒钟内)：(从合法的在线视频平台) + 托管这些片名：(在他们自己的非法服务上))：(这些服务赚取 → 每年约20亿美元：(从广告和订阅中))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>由于没有视频制作成本 → 非法流媒体网站 → 已经实现了利润率：(接近90%) → 根据电影协会（MPA）：(一个代表好莱坞制片厂的贸易组织：(正在努力打击 → 成千上万的非法平台：(这些平台已经出现：(在最近几年))))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>最初 → 合法在线业务的兴起：(比如Netflix) → 实际上帮助遏制了 → 数字盗版：(这种盗版主要基于 → 文件上传)。\u003c/p>\n\u003cp>但现在 → 盗版：(涉及非法流媒体服务 + 文件共享) → 使美国经济损失 → 约300亿美元：(每年的收入损失) + 约25万个工作岗位 → 美国商会的全球创新政策中心估计。\u003c/p>\n\u003cp>全球影响 → 每年约710亿美元。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>&quot;那些人：(偷窃 → 我们的电影和电视节目 + 运营盗版网站) → 不是夫妻店，&quot; → 查理·里夫金说：(MPA的首席执行官)。\u003c/p>\n\u003cp>&quot;这是有组织犯罪。&quot;\u003c/p>\n\u003cp>里夫金加入了MPA：(在2017年) → 在该组织失败后：(五年前) → 建立共识：(在好莱坞和硅谷之间) → 赢得立法通过：(在国会)：(旨在阻止在线盗版)。\u003c/p>\n\u003cp>在2017年 → 该协会成立了 → 创意与娱乐联盟（ACE）：(一个执法特遣队：(约100名侦探)：(环游全球)：(帮助地方当局 → 逮捕流媒体盗版者))。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>ACE说 → 它帮助减少了 → 非法流媒体服务的数量：(在北美) → 到126个：(从超过1400个：(在2018年)) → 部分得益于：(MPA的支持：(对2020年联邦法律：(该法律使大规模流媒体传输：(受版权保护的材料) → 成为严重犯罪)))。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>咨询公司Parks Associates → 预测：(合法的美国流媒体服务因盗版造成的累计损失：(自2022年以来) → 将达到1130亿美元：(在未来两年内))。\u003c/p>\n\u003cp>&quot;虽然有一些乐观情绪：(认为新兴的对策 + 最佳实践 → 可能会看到盗版开始趋于平稳：(到2027年)) // 但没有共识：(在利益相关者中)：(关于何时可能开始下降)，&quot; → 分析师史蒂夫·霍利说。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第1段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns that the services will never be as profitable as cable once was.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc / at its own game, / old Hollywood has struggled / to turn a profit / in streaming, / with the likes of Disney+, Peacock and Paramount+ / losing billions of dollars each year, / sparking concerns / that the services will never be / as profitable as cable once was.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>自从开始玩Netflix公司 / 的游戏以来，/ 老好莱坞一直在努力 / 实现盈利 / 在流媒体方面，/ 像Disney+、Peacock和Paramount+ / 每年损失数十亿美元，/ 引发担忧 / 这些服务将永远不会 / 像有线电视曾经那样盈利。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先连起竞争背景和经营状况：\u003c/p>\n\u003cblockquote>\n\u003cp>自从老好莱坞在流媒体领域与Netflix竞争以来，一直难以盈利\u003c/p>\n\u003c/blockquote>\n\u003cp>再接上具体亏损及引出的担忧：\u003c/p>\n\u003cblockquote>\n\u003cp>多家平台每年亏损数十亿美元，人们因此担忧这些服务永远达不到有线电视昔日的盈利水平\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>自从老好莱坞在流媒体领域与Netflix竞争以来，一直难以盈利；多家平台每年亏损数十亿美元，人们因此担忧这些服务永远达不到有线电视昔日的盈利水平。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>老好莱坞难以盈利，平台亏损引发担忧。\u003c/p>\n\u003c/blockquote>\n\u003cp>Ever since给出持续至今的起点，taking on表示竞争。with后接平台及其亏损状况；sparking引出前述亏损造成的反应，concerns后面的that说明担忧内容，不能当作已经证实的结论。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>自从老好莱坞在Netflix擅长的流媒体领域与之竞争以来，就一直难以盈利；Disney+、Peacock和Paramount+等平台每年亏损数十亿美元，引发了这些服务永远达不到有线电视昔日盈利水平的担忧。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>at its own game指在Netflix擅长的业务领域竞争，不是参加游戏。turn a profit要整体译成实现盈利。\u003c/p>\n\u003cp>never be as profitable是担心未来始终达不到以前的盈利水平；保留“担忧”，不能直接断言它们未来绝不可能盈利。两句中文可承载一个英文长句。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>自从老好莱坞开始在流媒体领域与Netflix竞争以来，一直难以实现盈利。Disney+、Peacock和Paramount+等平台每年损失数十亿美元，引发了对这些服务永远无法像有线电视那样盈利的担忧。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第2段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>With no video production costs, illegal streaming sites have achieved profit margins approaching 90%, according to the Motion Picture Association (MPA), a trade group representing Hollywood studios that&#39;s working to crack down on the thousands of illegal platforms that have cropped up in recent years.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>With no video production costs, / illegal streaming sites / have achieved profit margins / approaching 90%, / according to the Motion Picture Association (MPA), / a trade group representing Hollywood studios / that&#39;s working to crack down on / the thousands of illegal platforms / that have cropped up / in recent years.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>由于没有视频制作成本，/ 非法流媒体网站 / 已经实现了利润率 / 接近90%，/ 根据电影协会（MPA），/ 一个代表好莱坞制片厂的贸易组织 / 正在努力打击 / 成千上万的非法平台 / 这些平台已经出现 / 在最近几年。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把成本与利润结果合并：\u003c/p>\n\u003cblockquote>\n\u003cp>由于没有视频制作成本，非法流媒体网站的利润率接近百分之九十\u003c/p>\n\u003c/blockquote>\n\u003cp>再补上数据来源及该组织的行动：\u003c/p>\n\u003cblockquote>\n\u003cp>数据来自代表好莱坞制片厂的MPA，该组织正在打击近年大量出现的非法平台\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>由于没有视频制作成本，非法流媒体网站的利润率接近百分之九十；数据来自代表好莱坞制片厂的MPA，该组织正在打击近年大量出现的非法平台。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>非法流媒体网站没有制作成本，利润率接近百分之九十。\u003c/p>\n\u003c/blockquote>\n\u003cp>With说明成本条件，according to说明数字来源。a trade group是MPA的同位语，第一处that修饰组织，末尾that修饰非法平台，两个从句不能接到同一对象上。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>据代表好莱坞制片厂的电影协会称，由于没有视频制作成本，非法流媒体网站的利润率接近百分之九十；该协会正在努力打击近年大量出现的非法平台。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>profit margins是利润率而非收入占全行业的比例，approaching保留“接近”。cropped up是不断出现，不是农作物长出。\u003c/p>\n\u003cp>把组织身份与职责放在数据之后，可避免中文主语拖长。非法平台是受到打击的对象，不是执行打击的组织。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>由于没有视频制作成本，非法流媒体网站的利润率接近90%，这是代表好莱坞制片厂的贸易组织——电影协会（MPA）提供的数据。该组织正在努力打击近年来出现的成千上万个非法平台。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第3句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Rivkin joined the MPA in 2017 after the organization failed five years earlier to build consensus between Hollywood and Silicon Valley to win passage of legislation in Congress aimed at stopping online piracy.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Rivkin joined the MPA / in 2017 / after the organization failed / five years earlier / to build consensus / between Hollywood and Silicon Valley / to win passage of legislation / in Congress / aimed at stopping online piracy.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>里夫金加入了MPA / 在2017年 / 在该组织失败后 / 五年前 / 建立共识 / 在好莱坞和硅谷之间 / 赢得立法通过 / 在国会 / 旨在阻止在线盗版。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先将人物加入组织的时间译出：\u003c/p>\n\u003cblockquote>\n\u003cp>里夫金于二〇一七年加入MPA\u003c/p>\n\u003c/blockquote>\n\u003cp>再把此前失败的行动和目的连成一组：\u003c/p>\n\u003cblockquote>\n\u003cp>五年前该组织未能促成好莱坞与硅谷的共识，原本希望借此推动国会通过制止网络盗版的立法\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>里夫金于二〇一七年加入MPA；五年前该组织未能促成好莱坞与硅谷的共识，原本希望借此推动国会通过制止网络盗版的立法。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>里夫金加入MPA，此前该组织促成共识的努力失败。\u003c/p>\n\u003c/blockquote>\n\u003cp>after给出先后，five years earlier以2017年为参照。failed后接to build consensus；to win passage说明建立共识所服务的目的，aimed at只修饰legislation。不能把目的中的立法写成已通过。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>里夫金于2017年加入MPA；五年前，该组织未能促成好莱坞和硅谷的共识，以推动国会通过旨在制止网络盗版的立法。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>build consensus不是建造机构，而是让两方形成共同意见。win passage of legislation译为推动立法通过，更符合中文动宾搭配。\u003c/p>\n\u003cp>joined与failed不是同一年发生的并列事件。把较长的先前背景放在“此前”后面，既保留时间关系，也避免误读成里夫金本人发动了那次失败行动。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>里夫金于2017年加入MPA，此前该组织在五年前未能在好莱坞和硅谷之间建立共识，以推动国会通过旨在阻止在线盗版的立法。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>35题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003cp>文章着重强调了下列哪一点？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>The need to coordinate anti-piracy action.\u003c/strong>\u003c/p>\n\u003cp>协调反盗版行动的必要性。\u003c/p>\n\u003cp>B. \u003cstrong>The criminal nature of copyright violation.\u003c/strong>\u003c/p>\n\u003cp>侵犯版权的犯罪性质。\u003c/p>\n\u003cp>C. \u003cstrong>The prospect of eliminating online piracy.\u003c/strong>\u003c/p>\n\u003cp>消除在线盗版的前景。\u003c/p>\n\u003cp>D. \u003cstrong>The economic harm from illegal streaming.\u003c/strong>\u003c/p>\n\u003cp>非法流媒体造成的经济损害。\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。\u003c/td>\n\u003ctd>先说两边如今的处境不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明非法网站没有视频制作成本，利润相关数字接近90%，MPA正在打击它们。\u003c/td>\n\u003ctd>回头解释一边为何这么占便宜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。\u003c/td>\n\u003ctd>但话说回来另一边付出了大代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明盗版是有组织犯罪，介绍MPA共识努力未成和后来成立ACE协助抓捕。\u003c/td>\n\u003ctd>接着写为了处理这事做了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>列出北美非法服务数量下降及2020年法律提供的部分帮助。\u003c/td>\n\u003ctd>再说这些努力已经有一些效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>预测合法服务未来仍面临巨额损失，并指出对盗版何时开始下降尚无共识。\u003c/td>\n\u003ctd>最后说代价还在好转也没定数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003ch3>A. The need to coordinate anti-piracy action.\u003c/h3>\n\u003cp>协调反盗版行动的必要性。\u003c/p>\n\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>协调反盗版行动的必要性。\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>对照各自为战的合法平台与相互配合的盗版经营，提出反盗版各方必须协调的问题。\u003c/td>\n\u003ctd>先说两边如今的处境不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释盗版一方如何利用执法部门与企业之间的信息缺口，取得分散行动难以遏制的优势。\u003c/td>\n\u003ctd>回头解释一边为何这么占便宜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明合法企业因协作不足持续承担收入与岗位损失，凸显协调的必要性。\u003c/td>\n\u003ctd>但话说回来另一边付出了大代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍行业、技术公司及地方机关需要怎样共享线索、分工行动，并交代已有合作尝试。\u003c/td>\n\u003ctd>接着写为了处理这事做了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>用共同执法后的平台减少说明协调能够改善效果，支持继续投入协作。\u003c/td>\n\u003ctd>再说这些努力已经有一些效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>承认损失仍在且改善时间未明，指出剩余协作障碍，重新提出持续协调的必要性。\u003c/td>\n\u003ctd>最后说代价还在好转也没定数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>MPA曾想促成共识，ACE又与地方当局协作，所以A确实能解释第4、5段的一部分内容。但第1段先比较合法平台亏损与盗版收入，第2段解释盗版经营没有制作成本，第3段连续量化收入与岗位损失；它们并未把问题诊断为“各方缺少协调”。最后作者也没有给出协调分工或号召建立新联盟，而是再次落在一千一百三十亿美元损失和下降时间未定。协调是应对损害的一种行动，不能替代反复被强调的经济后果。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003ch3>B. The criminal nature of copyright violation.\u003c/h3>\n\u003cp>侵犯版权的犯罪性质。\u003c/p>\n\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>侵犯版权的犯罪性质。\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先区分正常经营合法作品与盗用版权内容的行为，指出两类活动的法律性质不同。\u003c/td>\n\u003ctd>先说两边如今的处境不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释非法经营凭无权使用的内容占便宜，说明高利润为何源于侵犯受保护权利。\u003c/td>\n\u003ctd>回头解释一边为何这么占便宜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>再从权利人及社会遭受的损害说明版权侵犯具有应受刑事追究的严重性。\u003c/td>\n\u003ctd>但话说回来另一边付出了大代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍调查和立法怎样认定有组织侵权，并采用针对犯罪的处理方式。\u003c/td>\n\u003ctd>接着写为了处理这事做了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>列出执法与法律适用的效果，说明相关侵权已作为犯罪受到实际追究。\u003c/td>\n\u003ctd>再说这些努力已经有一些效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>承认这种犯罪仍造成代价且减少时间难定，重申不能将其仅视为普通商业竞争。\u003c/td>\n\u003ctd>最后说代价还在好转也没定数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第4段直接说This is organized crime，第5段又有serious crime，B有两处鲜明的原词支持。但文章并没有花主要篇幅解释版权侵权的构成条件、违法与犯罪的界线。开头的盈亏对照、第2段制作成本与利润数字、第3段的经济和就业损失、最后的未来损失预测，都是说明这种经营带来多大经济伤害。犯罪性质解释为何要抓捕，不能把整篇关于损失的数据都改成法律性质的论证。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003ch3>C. The prospect of eliminating online piracy.\u003c/h3>\n\u003cp>消除在线盗版的前景。\u003c/p>\n\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>消除在线盗版的前景。\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>对照合法平台受压与盗版蓬勃的处境，提出在线盗版是否有望被彻底消除。\u003c/td>\n\u003ctd>先说两边如今的处境不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释盗版成本低、获利高的生存动力，指出完全清除面临的首个障碍。\u003c/td>\n\u003ctd>回头解释一边为何这么占便宜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>列举另一方承担的损害，说明为什么需要检验消除盗版的可能，而不满足于暂时控制。\u003c/td>\n\u003ctd>但话说回来另一边付出了大代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍以根除盗版为方向的行动，考察调查和法律措施怎样覆盖存活条件。\u003c/td>\n\u003ctd>接着写为了处理这事做了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>用已有平台减少判断行动距离完全清除还有多远，区分局部成绩与最终目标。\u003c/td>\n\u003ctd>再说这些努力已经有一些效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>在损害仍在、好转未定的前提下，对消除前景作谨慎判断，说明还缺什么条件。\u003c/td>\n\u003ctd>最后说代价还在好转也没定数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>结尾确实讨论盗版什么时候可能下降，第5段也有非法平台数量减少，所以C看起来能接到后两段。但eliminating是消除，而begin to decline只是开始下降，两者程度不同。第3段和第6段的大额损失并不是逐步证明清零前景，文章也没有给出彻底消除盗版的路线或时间。结尾连开始下降的时点都没有共识，是提醒损害仍会延续，不能改成对彻底清除前景的集中论证。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003ch3>D. The economic harm from illegal streaming.\u003c/h3>\n\u003cp>非法流媒体造成的经济损害。\u003c/p>\n\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>非法流媒体造成的经济损害。\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>对照合法流媒体盈利困难与盗版者靠复制作品获利，呈现经济利益如何分布。\u003c/td>\n\u003ctd>先说两边如今的处境不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回头解释盗版者不负担制作成本，所以能获得异常高的利润率。\u003c/td>\n\u003ctd>回头解释一边为何这么占便宜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>量化合法经营及更大经济体付出的收入、就业和全球损失，展示被转移利益的另一面。\u003c/td>\n\u003ctd>但话说回来另一边付出了大代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍行业组织为遏制盗版及其经济损害而推进共识、成立执法联盟的行动。\u003c/td>\n\u003ctd>接着写为了处理这事做了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>承认打击已减少部分非法服务，说明应对经济损害并非完全没有效果。\u003c/td>\n\u003ctd>再说这些努力已经有一些效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>再回到持续累积的损失及下降时间不明，提醒经济损害仍是问题核心。\u003c/td>\n\u003ctd>最后说代价还在好转也没定数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D把六段都接住了。首段合法平台每年亏损与盗版者约二十亿美元收入形成对照，第2段写无视频制作成本，第3段给出美国收入和岗位损失以及全球影响；中间的MPA、ACE和法律是为处理这类盗版而采取的行动。即使北美非法服务数量已经下降，末段仍预测合法服务承受巨额损失，并对何时下降保持谨慎。因此文章既承认行动有效，也没有把数字上的改善写成经济威胁已经解除。D强调损害，能够同时容纳获利方式、损失规模、打击努力与后续风险。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 保留。\u003c/strong>\u003c/p>\n\u003ch3>35题结论\u003c/h3>\n\u003cp>\u003cstrong>35. D. The economic harm from illegal streaming.\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>The economic harm from illegal streaming. / 非法流媒体造成的经济损害。\u003c/strong>\u003c/p>\n\u003ch2>31题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Paragraph 1, legitimate streaming services ______.\u003cbr>根据第1段，合法流媒体服务怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>局部推断题。题干要求判断“根据第1段，合法流媒体服务怎么样？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003c/blockquote>\n\u003cp>合法平台盈利困难，与之形成对照的盗版者快速复制其作品并靠广告和订阅牟利。文章把真实的盗版经营置于合法平台的困难旁，支持威胁判断，但没有证明所有亏损皆由盗版造成。\u003c/p>\n\u003ch3>A. have drawn lessons from Hollywood\u003c/h3>\n\u003cblockquote>\n\u003cp>从好莱坞吸取了教训\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 drawn lessons from Hollywood 把好莱坞当成学习对象；原文taking on Netflix Inc.却写好莱坞向Netflix发起竞争，所以回看段首谁在与谁较量。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文taking on Netflix Inc.的主体是old Hollywood，好莱坞在Netflix原本经营的领域与它竞争，随后出现的Disney+等就是这种经营尝试。A的drawn lessons from Hollywood把关系写成合法平台从好莱坞学经验。原文的竞争对象是Netflix，好莱坞是进入流媒体竞争的一方，并不是被这些平台统一拿来学习的第三方经验来源；竞争遇到亏损也不是已经吸取经验这一动作。\u003c/p>\n\u003cp>竞争的双方与学习方向都变了，原句写的是经营困难，没有把这种竞争写成吸取好莱坞经验。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第1段，合法流媒体服务从好莱坞吸取了教训。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 drawn lessons from Hollywood 把好莱坞当成学习对象；原文taking on Netflix Inc.却写好莱坞向Netflix发起竞争，所以回看段首谁在与谁较量。\u003c/p>\n\u003cp>原文taking on Netflix Inc.的主体是old Hollywood，好莱坞在Netflix原本经营的领域与它竞争，随后出现的Disney+等就是这种经营尝试。A的drawn lessons from Hollywood把关系写成合法平台从好莱坞学经验。原文的竞争对象是Netflix，好莱坞是进入流媒体竞争的一方，并不是被这些平台统一拿来学习的第三方经验来源；竞争遇到亏损也不是已经吸取经验这一动作。\u003c/p>\n\u003cp>竞争的双方与学习方向都变了，原句写的是经营困难，没有把这种竞争写成吸取好莱坞经验。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003cp>合法平台盈利困难，与之形成对照的盗版者快速复制其作品并靠广告和订阅牟利。文章把真实的盗版经营置于合法平台的困难旁，支持威胁判断，但没有证明所有亏损皆由盗版造成。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Legitimate streamers improved their businesses by learning lessons from Hollywood’s experience.\u003c/p>\n\u003cp>合法流媒体通过吸取好莱坞的经验改进了经营。\u003c/p>\n\u003c/blockquote>\n\u003cp>首句主体是old Hollywood，动作是进入Netflix的业务领域竞争。A要写合法平台以好莱坞为经验来源，后文还应说明学了什么；原文只报告好莱坞平台经营艰难，既未交代学习，也未给出改进。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文强调非法流媒体造成经济损害，首段的合法业务处境应放在这一损害关系中理解。但不能仅凭主旨断言所有亏损源于盗版，更不能确定其营收比较和广告商偏好。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>have drawn lessons from Hollywood\u003cbr>从好莱坞吸取了教训\u003c/p>\n\u003c/blockquote>\n\u003cp>竞争的双方与学习方向都变了，原句写的是经营困难，没有把这种竞争写成吸取好莱坞经验。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。\u003c/p>\n\u003cp>本项最终仍要根据“host the titles on their own, illegitimate services”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. have surpassed cable in revenue\u003c/h3>\n\u003cblockquote>\n\u003cp>在收入上已经超过有线电视\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“have [xxx] cable in revenue”，保留了相应遮挡。当时的定位线索是：B的 in revenue 要比较收入，第1段与cable的比较却写as profitable as cable once was，所以回看华尔街担忧的那一句，先区分营收与盈利。读完全文后，做题模式再经交叉验证排除B，最终选择D。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>完整选项说营收已超过有线电视，have surpassed是已发生的比较。原文担忧的是将来能否像昔日有线电视一样盈利，be as profitable比较盈利能力，既不是营收，也不是当前超过的事实。\u003c/p>\n\u003cp>收入很高仍可能因成本更高而亏损，反过来盈利担忧也不能说明收入到底谁高。B把盈利指标换成收入指标，又把未来担忧换成已经实现的超越，因此没有被段首的财务描述支持。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第1段，合法流媒体服务在收入上已经超过有线电视。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 in revenue 要比较收入，第1段与cable的比较却写as profitable as cable once was，所以回看华尔街担忧的那一句，先区分营收与盈利。\u003c/p>\n\u003cp>完整选项说营收已超过有线电视，have surpassed是已发生的比较。原文担忧的是将来能否像昔日有线电视一样盈利，be as profitable比较盈利能力，既不是营收，也不是当前超过的事实。\u003c/p>\n\u003cp>收入很高仍可能因成本更高而亏损，反过来盈利担忧也不能说明收入到底谁高。B把盈利指标换成收入指标，又把未来担忧换成已经实现的超越，因此没有被段首的财务描述支持。\u003c/p>\n\u003cp>合法平台盈利困难，与之形成对照的盗版者快速复制其作品并靠广告和订阅牟利。文章把真实的盗版经营置于合法平台的困难旁，支持威胁判断，但没有证明所有亏损皆由盗版造成。\u003c/p>\n\u003cp>have surpassed声称已经超过，in revenue限定收入总额；原文却是对未来盈利能力的担忧。盈利要考虑成本，收入不等于利润，未来难达旧水平也不能转写成当前营收已超过的事实。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第1段，合法流媒体服务不受广告商欢迎。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 advertisers 与第1段from ads都涉及广告，所以回看段末这些广告收入连在哪一种服务上，确认是合法平台还是盗版者自己的服务。\u003c/p>\n\u003cp>原文from ads接在盗版者自己的服务之后，说这些服务每年约二十亿美元的钱与广告等项目相关。C的advertisers却成了对合法平台作出负面评价的人，are unpopular又断言广告商不喜欢合法服务。原文介绍盗版服务的钱，并没有把广告商的选择作为合法平台亏损的原因；C把另一类服务的收入关系换成了合法服务受到冷落的评价。\u003c/p>\n\u003cp>广告对应的是盗版服务的收入，C转换了被评价的平台，又添加广告商不喜欢的态度。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003cp>合法平台盈利困难，与之形成对照的盗版者快速复制其作品并靠广告和订阅牟利。文章把真实的盗版经营置于合法平台的困难旁，支持威胁判断，但没有证明所有亏损皆由盗版造成。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Advertisers have withdrawn their support from legitimate streaming services because they dislike them.\u003c/p>\n\u003cp>广告商因为不喜欢合法流媒体而撤去支持。\u003c/p>\n\u003c/blockquote>\n\u003cp>ads出现在盗版平台收入来源中，不能推出广告商对合法平台的负面态度。若C成立，需要合法平台广告投放减少及原因说明；原文没有调查广告商偏好，也没有把亏损归因于这种偏好。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文强调非法流媒体造成经济损害，首段的合法业务处境应放在这一损害关系中理解。但不能仅凭主旨断言所有亏损源于盗版，更不能确定其营收比较和广告商偏好。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>are unpopular with advertisers\u003cbr>不受广告商欢迎\u003c/p>\n\u003c/blockquote>\n\u003cp>广告对应的是盗版服务的收入，C转换了被评价的平台，又添加广告商不喜欢的态度。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。\u003c/p>\n\u003cp>本项最终仍要根据“host the titles on their own, illegitimate services”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. are confronted with a real threat\u003c/h3>\n\u003cblockquote>\n\u003cp>面临一种现实威胁\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 a real threat 要找合法平台面临的问题；第1段pirates把合法平台作品放到自己服务上的做法正涉及它们的竞争处境，因此回看合法平台亏损和盗版者经营作品的两处。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>原文先给出合法经营者每年亏损，再把pirates列为另一边的赢家；这些盗版者从合法平台涉及电影或节目，并把作品放在自己的服务上。D的a real threat正能接上这种处境：合法平台艰难经营，其作品却出现在盗版者经营的另一套服务中。这里没有必要把亏损全部归给盗版，也不能补出多少用户因此流失；仅这种围绕同一批作品的盗版经营，已经使威胁不只是一个空泛猜测。\u003c/p>\n\u003cp>作品与竞争服务之间的联系已经出现，D概括这种处境，没有把全部亏损原因或用户流失数量另行补进去。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第1段，合法流媒体服务面临一种现实威胁。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 a real threat 要找合法平台面临的问题；第1段pirates把合法平台作品放到自己服务上的做法正涉及它们的竞争处境，因此回看合法平台亏损和盗版者经营作品的两处。\u003c/p>\n\u003cp>原文先给出合法经营者每年亏损，再把pirates列为另一边的赢家；这些盗版者从合法平台涉及电影或节目，并把作品放在自己的服务上。D的a real threat正能接上这种处境：合法平台艰难经营，其作品却出现在盗版者经营的另一套服务中。这里没有必要把亏损全部归给盗版，也不能补出多少用户因此流失；仅这种围绕同一批作品的盗版经营，已经使威胁不只是一个空泛猜测。\u003c/p>\n\u003cp>作品与竞争服务之间的联系已经出现，D概括这种处境，没有把全部亏损原因或用户流失数量另行补进去。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003cp>合法平台盈利困难，与之形成对照的盗版者快速复制其作品并靠广告和订阅牟利。文章把真实的盗版经营置于合法平台的困难旁，支持威胁判断，但没有证明所有亏损皆由盗版造成。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Pirates copy the programmes of legitimate platforms and profit from rival services, creating a concrete threat to them.\u003c/p>\n\u003cp>盗版者复制合法平台的节目并经营竞争服务获利，给合法平台构成具体威胁。\u003c/p>\n\u003c/blockquote>\n\u003cp>作品来自合法平台，却被放入非法服务赚钱，威胁有明确行为和利益关系。D只概括面临威胁，不声称盗版解释全部亏损，也不预言合法业务必然倒闭，推断幅度与证据相称。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文强调非法流媒体造成经济损害，首段的合法业务处境应放在这一损害关系中理解。但不能仅凭主旨断言所有亏损源于盗版，更不能确定其营收比较和广告商偏好。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>are confronted with a real threat\u003cbr>面临一种现实威胁\u003c/p>\n\u003c/blockquote>\n\u003cp>作品与竞争服务之间的联系已经出现，D概括这种处境，没有把全部亏损原因或用户流失数量另行补进去。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。\u003c/p>\n\u003cp>本项最终仍要根据“host the titles on their own, illegitimate services”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>31题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>31. D. are confronted with a real threat\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：好莱坞进入竞争，不能转成平台向好莱坞学习。\u003c/p>\n\u003cp>B：未来盈利担忧不支持当前营收已经超过的判断。\u003c/p>\n\u003cp>C：盗版广告收入没有证明合法平台不受广告商欢迎。\u003c/p>\n\u003cp>D：复制合法作品另行经营，构成有具体行为依据的现实威胁。\u003c/p>\n\u003ch2>32题\u003c/h2>\n\u003cblockquote>\n\u003cp>It can be learned that streamers like Netflix ______.\u003cbr>可以了解到，像Netflix这样的流媒体公司怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>局部事实推断题。题干要求判断“可以了解到，像Netflix这样的流媒体公司怎么样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads. But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center. The global impact is about $71 billion annually.\u003c/p>\n\u003c/blockquote>\n\u003cp>Initially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。\u003c/p>\n\u003ch3>A. played a part in the fight against illegal file-sharing\u003c/h3>\n\u003cblockquote>\n\u003cp>曾在打击非法文件共享中发挥作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 played a part 与第3段helped curb都表示起到帮助作用，所以回看Initially那句，再用后句的file-sharing确认这里谈的文件活动属于盗版。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>Initially标明早期，helped curb说明合法业务兴起曾帮助遏制盗版；which接着说明当时盗版主要基于文件上传。played a part保留帮助作用，没有声称Netflix单独完成反盗版或消灭全部共享。\u003c/p>\n\u003cp>后面的But now报告今日非法流媒体及文件共享造成的损失，是历史之后的变化。不能因为如今盗版又严重，就否认早期合法服务曾起作用；A的过去时与原文时间限定一致。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\u003c/p>\n\u003cp>But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>像Netflix这样的流媒体公司曾在打击非法文件共享中发挥作用。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 played a part 与第3段helped curb都表示起到帮助作用，所以回看Initially那句，再用后句的file-sharing确认这里谈的文件活动属于盗版。\u003c/p>\n\u003cp>Initially标明早期，helped curb说明合法业务兴起曾帮助遏制盗版；which接着说明当时盗版主要基于文件上传。played a part保留帮助作用，没有声称Netflix单独完成反盗版或消灭全部共享。\u003c/p>\n\u003cp>后面的But now报告今日非法流媒体及文件共享造成的损失，是历史之后的变化。不能因为如今盗版又严重，就否认早期合法服务曾起作用；A的过去时与原文时间限定一致。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\u003c/p>\n\u003cp>But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center.\u003c/p>\n\u003cp>Initially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The early growth of Netflix and similar legal services helped reduce piracy based on uploaded files.\u003c/p>\n\u003cp>Netflix等合法服务早期的发展帮助减少了基于文件上传的盗版。\u003c/p>\n\u003c/blockquote>\n\u003cp>helped curb对应played a part in the fight，都是有限的帮助而非全面消除。文件上传构成当时盗版的主要方式，概括为打击非法文件共享没有变换对象，时间也保留在过去。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>经济损害是全文中心，却不排斥合法业务过去曾有反盗版作用。主旨不能代替时间线，Netflix究竟做过什么、是否因此获益，必须由第3段的具体因果关系判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>played a part in the fight against illegal file-sharing\u003cbr>曾在打击非法文件共享中发挥作用\u003c/p>\n\u003c/blockquote>\n\u003cp>后面的But now报告今日非法流媒体及文件共享造成的损失，是历史之后的变化。不能因为如今盗版又严重，就否认早期合法服务曾起作用；A的过去时与原文时间限定一致。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。\u003c/p>\n\u003cp>本项最终仍要根据“helped curb digital piracy”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. reaped benefits from the war with digital pirates\u003c/h3>\n\u003cblockquote>\n\u003cp>从打击数字盗版的行动中获得了利益\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“[xxx] benefits from the war with digital pirates”，保留了相应遮挡。当时的定位线索是：B的 benefits 说合法公司的收益，第3段的lost revenue则写盗版涉及的经济损失，因此回看合法业务起初遏制盗版与如今收入损失两处，看看能否确定B的收益动作。读完全文后，做题模式再经交叉验证排除B，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>reaped benefits完整读出后，B是在报告Netflix等公司从反盗版行动中获益。原句却以合法业务的兴起为原因，以盗版受遏制为结果，报告的是公司业务对盗版的作用。\u003c/p>\n\u003cp>减少盗版可能给合法经营带来好处，但文章没有就这些公司的收益提供收入、用户或成本证据。作用方向不能自动反向推导为获益结论；后文美国经济的损失统计也不能充当Netflix反盗版所得。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\u003c/p>\n\u003cp>But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>像Netflix这样的流媒体公司从打击数字盗版的行动中获得了利益。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 benefits 说合法公司的收益，第3段的lost revenue则写盗版涉及的经济损失，因此回看合法业务起初遏制盗版与如今收入损失两处，看看能否确定B的收益动作。\u003c/p>\n\u003cp>reaped benefits完整读出后，B是在报告Netflix等公司从反盗版行动中获益。原句却以合法业务的兴起为原因，以盗版受遏制为结果，报告的是公司业务对盗版的作用。\u003c/p>\n\u003cp>减少盗版可能给合法经营带来好处，但文章没有就这些公司的收益提供收入、用户或成本证据。作用方向不能自动反向推导为获益结论；后文美国经济的损失统计也不能充当Netflix反盗版所得。\u003c/p>\n\u003cp>Initially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。\u003c/p>\n\u003cp>原文写合法业务兴起帮助抑制盗版，Netflix是发挥作用的一方；B转而说其从反盗版行动中获益。二者可能有关，但还需公司获益的证据，不能把帮助了什么直接推成因此赚到了什么。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\u003c/p>\n\u003cp>But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center.\u003c/p>\n\u003cp>Initially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Netflix and similar companies gained measurable commercial benefits from the campaign against digital pirates.\u003c/p>\n\u003cp>Netflix等公司从打击数字盗版的行动中获得了商业收益。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文写合法业务兴起帮助抑制盗版，Netflix是发挥作用的一方；B转而说其从反盗版行动中获益。二者可能有关，但还需公司获益的证据，不能把帮助了什么直接推成因此赚到了什么。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>经济损害是全文中心，却不排斥合法业务过去曾有反盗版作用。主旨不能代替时间线，Netflix究竟做过什么、是否因此获益，必须由第3段的具体因果关系判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>reaped benefits from the war with digital pirates\u003cbr>从打击数字盗版的行动中获得了利益\u003c/p>\n\u003c/blockquote>\n\u003cp>减少盗版可能给合法经营带来好处，但文章没有就这些公司的收益提供收入、用户或成本证据。作用方向不能自动反向推导为获益结论；后文美国经济的损失统计也不能充当Netflix反盗版所得。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。\u003c/p>\n\u003cp>本项最终仍要根据“helped curb digital piracy”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. promised to become big job creators in the US\u003c/h3>\n\u003cblockquote>\n\u003cp>承诺在美国创造大量就业岗位\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 big job creators 与第3段250,000 jobs都谈就业，所以回看这组岗位数字接在costs之后还是某家公司的承诺之后。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文250,000 jobs是盗版给美国经济造成的岗位损失，作估计的是商会相关中心。C的big job creators把损失改成创造岗位，并让Netflix等公司成为作出承诺的人。数字的方向由损失转成新增，发言者也由估计损失的机构换成许诺就业的公司，二者不是同一件事。\u003c/p>\n\u003cp>原文在计算损失，C却安排公司承诺新增就业，主体、动作和方向都换了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center.\u003c/p>\n\u003cp>The global impact is about $71 billion annually.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>像Netflix这样的流媒体公司承诺在美国创造大量就业岗位。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 big job creators 与第3段250,000 jobs都谈就业，所以回看这组岗位数字接在costs之后还是某家公司的承诺之后。\u003c/p>\n\u003cp>原文250,000 jobs是盗版给美国经济造成的岗位损失，作估计的是商会相关中心。C的big job creators把损失改成创造岗位，并让Netflix等公司成为作出承诺的人。数字的方向由损失转成新增，发言者也由估计损失的机构换成许诺就业的公司，二者不是同一件事。\u003c/p>\n\u003cp>原文在计算损失，C却安排公司承诺新增就业，主体、动作和方向都换了。\u003c/p>\n\u003cp>Initially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。\u003c/p>\n\u003cp>原文的二十五万个岗位是盗版造成的损失，作估计的是商会机构。C将损失换成新增，又将机构的损失估计换成企业的未来承诺；只有jobs一词对上，数量方向和行动主体都错位。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center.\u003c/p>\n\u003cp>The global impact is about $71 billion annually.\u003c/p>\n\u003cp>Initially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Netflix and its peers promised to create large numbers of new jobs in the United States.\u003c/p>\n\u003cp>Netflix及同类企业承诺在美国创造大量新岗位。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的二十五万个岗位是盗版造成的损失，作估计的是商会机构。C将损失换成新增，又将机构的损失估计换成企业的未来承诺；只有jobs一词对上，数量方向和行动主体都错位。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>经济损害是全文中心，却不排斥合法业务过去曾有反盗版作用。主旨不能代替时间线，Netflix究竟做过什么、是否因此获益，必须由第3段的具体因果关系判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>promised to become big job creators in the US\u003cbr>承诺在美国创造大量就业岗位\u003c/p>\n\u003c/blockquote>\n\u003cp>原文在计算损失，C却安排公司承诺新增就业，主体、动作和方向都换了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。\u003c/p>\n\u003cp>本项最终仍要根据“helped curb digital piracy”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. used to collaborate with file-uploading platforms\u003c/h3>\n\u003cblockquote>\n\u003cp>曾与文件上传平台合作\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 collaborate 与第3段curb digital piracy构成需要核对的两种动作，因此回看合法公司兴起以后对文件型盗版究竟做了什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文curb digital piracy把Netflix等合法业务与遏制盗版相连，文件活动属于被遏制的盗版形式。D的collaborate却把这类平台放成合法公司的合作对象。题干所问的合法流媒体，在原句中起的是压低盗版的作用，并非与文件平台共同开展业务；把作用对象改成合作伙伴，关系方向就变了。\u003c/p>\n\u003cp>D把对盗版的遏制关系换成双方合作，不能作为该句所说明的作用。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>像Netflix这样的流媒体公司曾与文件上传平台合作。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 collaborate 与第3段curb digital piracy构成需要核对的两种动作，因此回看合法公司兴起以后对文件型盗版究竟做了什么。\u003c/p>\n\u003cp>原文curb digital piracy把Netflix等合法业务与遏制盗版相连，文件活动属于被遏制的盗版形式。D的collaborate却把这类平台放成合法公司的合作对象。题干所问的合法流媒体，在原句中起的是压低盗版的作用，并非与文件平台共同开展业务；把作用对象改成合作伙伴，关系方向就变了。\u003c/p>\n\u003cp>D把对盗版的遏制关系换成双方合作，不能作为该句所说明的作用。\u003c/p>\n\u003cp>Initially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。\u003c/p>\n\u003cp>原文遏制的是以文件上传为基础的盗版，合作要求双方共同经营或协作。used to只对上历史时间，collaborate却把对盗版的抑制作用变成合作，无法承接原句的helped curb。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\u003c/p>\n\u003cp>Initially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Legal streamers once worked in partnership with platforms that uploaded pirated files.\u003c/p>\n\u003cp>合法流媒体曾与上传盗版文件的平台建立合作。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文遏制的是以文件上传为基础的盗版，合作要求双方共同经营或协作。used to只对上历史时间，collaborate却把对盗版的抑制作用变成合作，无法承接原句的helped curb。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>经济损害是全文中心，却不排斥合法业务过去曾有反盗版作用。主旨不能代替时间线，Netflix究竟做过什么、是否因此获益，必须由第3段的具体因果关系判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>used to collaborate with file-uploading platforms\u003cbr>曾与文件上传平台合作\u003c/p>\n\u003c/blockquote>\n\u003cp>D把对盗版的遏制关系换成双方合作，不能作为该句所说明的作用。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。\u003c/p>\n\u003cp>本项最终仍要根据“helped curb digital piracy”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>32题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>32. A. played a part in the fight against illegal file-sharing\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：早期合法服务曾帮助遏制以文件上传为主的盗版。\u003c/p>\n\u003cp>B：对反盗版有作用，不自动等于公司从行动中已获益。\u003c/p>\n\u003cp>C：岗位损失被反写成公司承诺创造岗位。\u003c/p>\n\u003cp>D：抑制盗版的关系被改成与盗版文件平台合作。\u003c/p>\n\u003ch2>33题\u003c/h2>\n\u003cblockquote>\n\u003cp>It can be inferred from Paragraph 4 that the MPA ______.\u003cbr>从第4段可以推知，MPA怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>局部推断题。题干要求判断“从第4段可以推知，MPA怎么样？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>“The people who are stealing our movies and our television shows and operating piracy sites are not mom and pop operations,” says Charlie Rivkin, chief executive officer of the MPA. “This is organized crime.” Rivkin joined the MPA in 2017 after the organization failed five years earlier to build consensus between Hollywood and Silicon Valley to win passage of legislation in Congress aimed at stopping online piracy. In 2017 the association formed the Alliance for Creativity and Entertainment (ACE), an enforcement task force of about 100 detectives circling the globe to help local authorities arrest streaming pirates.\u003c/p>\n\u003c/blockquote>\n\u003cp>MPA代表好莱坞，曾试图促成好莱坞和硅谷共识以推动反盗版立法，但未成功；后来组建ACE协助地方抓捕。要区分早先共识未成的对象与后来的执法伙伴。\u003c/p>\n\u003ch3>A. was denied cooperation by Silicon Valley\u003c/h3>\n\u003cblockquote>\n\u003cp>未能得到硅谷的合作\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 denied cooperation 与第4段failed five years earlier to build consensus相近，都涉及合作没有达成，所以回看好莱坞与Silicon Valley之间未建立共识、未能共同推动国会行动的那一句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>原文failed five years earlier to build consensus说MPA未能在好莱坞与硅谷之间促成共同立场，目的是推动国会通过针对在线盗版的措施。A的denied cooperation接上的正是协会未取得硅谷这一合作方的配合。这里是根据共识没有达成作推断，不是在说文章记录了硅谷某个人当面拒绝的原话。MPA代表好莱坞推动此事，另一方硅谷没有与它形成所需共识，合作未能取得正是这次失败的一部分。\u003c/p>\n\u003cp>原文已经说两方共识未建立，A表达合作未得到；这比补写一次具体拒绝的场景更贴合原句。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>“This is organized crime.” Rivkin joined the MPA in 2017 after the organization failed five years earlier to build consensus between Hollywood and Silicon Valley to win passage of legislation in Congress aimed at stopping online piracy.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>从第4段可以推知，MPA未能得到硅谷的合作。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 denied cooperation 与第4段failed five years earlier to build consensus相近，都涉及合作没有达成，所以回看好莱坞与Silicon Valley之间未建立共识、未能共同推动国会行动的那一句。\u003c/p>\n\u003cp>原文failed five years earlier to build consensus说MPA未能在好莱坞与硅谷之间促成共同立场，目的是推动国会通过针对在线盗版的措施。A的denied cooperation接上的正是协会未取得硅谷这一合作方的配合。这里是根据共识没有达成作推断，不是在说文章记录了硅谷某个人当面拒绝的原话。MPA代表好莱坞推动此事，另一方硅谷没有与它形成所需共识，合作未能取得正是这次失败的一部分。\u003c/p>\n\u003cp>原文已经说两方共识未建立，A表达合作未得到；这比补写一次具体拒绝的场景更贴合原句。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>“This is organized crime.” Rivkin joined the MPA in 2017 after the organization failed five years earlier to build consensus between Hollywood and Silicon Valley to win passage of legislation in Congress aimed at stopping online piracy.\u003c/p>\n\u003cp>MPA代表好莱坞，曾试图促成好莱坞和硅谷共识以推动反盗版立法，但未成功；后来组建ACE协助地方抓捕。要区分早先共识未成的对象与后来的执法伙伴。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明盗版是有组织犯罪，介绍MPA共识努力未成和后来成立ACE协助抓捕。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The MPA could not secure Silicon Valley’s cooperation for a shared legislative effort against online piracy.\u003c/p>\n\u003cp>MPA未能取得硅谷配合，共同推动反网络盗版立法。\u003c/p>\n\u003c/blockquote>\n\u003cp>failed to build consensus已说明所需共同立场未能形成，denied cooperation概括未取得配合。推断到合作未成即可，不必添写硅谷某人公开拒绝的场景，更不能把失败时间移到ACE成立之后。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的 esponse.\u003c/p>\n\u003cp>另一个机构敦促MPA成立执法工作组，协会据此采取行动。\u003c/p>\n\u003c/blockquote>\n\u003cp>enforcement task force可以对上ACE，但was urged还需要一个催促者及要求。原文只说协会formed，没有给出外部催促或被迫响应；已成立的结果不自动证明成立的外在推动过程。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>MPA行动是应对经济损害的一环。主旨只能说明行动背景，无法决定哪一方没有合作、是否受到敦促或举行抗议；这些关系必须按第4段的主体、时间与动作核定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>was urged to form an enforcement task force\u003cbr>受到敦促而成立一个执法工作组\u003c/p>\n\u003c/blockquote>\n\u003cp>成立了某组织并不自动说明是在催促之下成立。原文按时间介绍2017年的行动，再说明人员和任务，没有给出外部命令或劝说；C的名词相同，新增的被动关系却没有依据。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明盗版是有组织犯罪，介绍MPA共识努力未成和后来成立ACE协助抓捕。\u003c/p>\n\u003cp>本项最终仍要根据“failed five years earlier to build consensus”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. failed to win support from local authorities\u003c/h3>\n\u003cblockquote>\n\u003cp>未能赢得地方当局的支持\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 failed to win support 把地方合作写成失败，第4段的help local authorities却把他们放在共同抓捕的行动里，所以回看ACE的任务以及当地机关在其中的位置。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文help local authorities arrest streaming pirates说ACE的工作人员去帮助地方当局抓捕，地方当局是实施抓捕的一方。D的failed to win support却把地方当局写成没有提供支持的一方。前面failed five years earlier to build consensus涉及的是好莱坞与硅谷，双方对象不同，不能把那次未成功的关系挪到后面地方执法机关身上；后者在句中承担的是与工作组衔接的抓捕行动。\u003c/p>\n\u003cp>D把前面的合作未成移到了另一组参与者；地方当局在后一句是抓捕行动的一方，不是那次共识失败的另一方。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In 2017 the association formed the Alliance for Creativity and Entertainment (ACE), an enforcement task force of about 100 detectives circling the globe to help local authorities arrest streaming pirates.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>从第4段可以推知，MPA未能赢得地方当局的支持。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 failed to win support 把地方合作写成失败，第4段的help local authorities却把他们放在共同抓捕的行动里，所以回看ACE的任务以及当地机关在其中的位置。\u003c/p>\n\u003cp>原文help local authorities arrest streaming pirates说ACE的工作人员去帮助地方当局抓捕，地方当局是实施抓捕的一方。D的failed to win support却把地方当局写成没有提供支持的一方。前面failed five years earlier to build consensus涉及的是好莱坞与硅谷，双方对象不同，不能把那次未成功的关系挪到后面地方执法机关身上；后者在句中承担的是与工作组衔接的抓捕行动。\u003c/p>\n\u003cp>D把前面的合作未成移到了另一组参与者；地方当局在后一句是抓捕行动的一方，不是那次共识失败的另一方。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In 2017 the association formed the Alliance for Creativity and Entertainment (ACE), an enforcement task force of about 100 detectives circling the globe to help local authorities arrest streaming pirates.\u003c/p>\n\u003cp>MPA代表好莱坞，曾试图促成好莱坞和硅谷共识以推动反盗版立法，但未成功；后来组建ACE协助地方抓捕。要区分早先共识未成的对象与后来的执法伙伴。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明盗版是有组织犯罪，介绍MPA共识努力未成和后来成立ACE协助抓捕。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The MPA failed to obtain local authorities’ assistance in arresting streaming pirates.\u003c/p>\n\u003cp>MPA未能获得地方当局协助抓捕流媒体盗版者。\u003c/p>\n\u003c/blockquote>\n\u003cp>失败出现在好莱坞与硅谷共识关系中，local authorities出现在ACE帮助其抓捕的任务中。D把failed移给另一组参与者，混合前后两件事，既丢失早先合作对象，也改变地方机关的角色。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入33题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>MPA行动是应对经济损害的一环。主旨只能说明行动背景，无法决定哪一方没有合作、是否受到敦促或举行抗议；这些关系必须按第4段的主体、时间与动作核定。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>failed to win support from local authorities\u003cbr>未能赢得地方当局的支持\u003c/p>\n\u003c/blockquote>\n\u003cp>D把前面的合作未成移到了另一组参与者；地方当局在后一句是抓捕行动的一方，不是那次共识失败的另一方。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明盗版是有组织犯罪，介绍MPA共识努力未成和后来成立ACE协助抓捕。\u003c/p>\n\u003cp>本项最终仍要根据“failed five years earlier to build consensus”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>33题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>33. A. was denied cooperation by Silicon Valley\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：促成两方共识失败，支持未取得硅谷合作的有限推断。\u003c/p>\n\u003cp>B：专业工作组全球协助抓捕，不是全国公众抗议。\u003c/p>\n\u003cp>C：成立工作组不证明协会受到外部敦促。\u003c/p>\n\u003cp>D：共识未成涉及硅谷，不能挪给地方执法机关。\u003c/p>\n\u003ch2>34题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Hawley, digital piracy ______.\u003cbr>根据Hawley的说法，数字盗版怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点题。题干要求判断“根据Hawley的说法，数字盗版怎么样？”，先按第5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>ACE says it’s helped shrink the number of illegal streaming services in North America to 126, from more than 1,400 in 2018, aided in part by the MPA’s support for a 2020 federal law that made large-scale streaming of copyrighted material a serious crime.\u003c/p>\n\u003cp>Consulting firm Parks Associates predicts that legitimate US streaming services’ cumulative loss from piracy since 2022 will reach $113 billion in the next two years. “While there is some optimism that emerging countermeasures and best practices may see piracy begin to plateau by 2027, there is no consensus among stakeholders as to when it may begin to decline,” says analyst Steve Hawley.\u003c/p>\n\u003c/blockquote>\n\u003cp>Hawley承认新措施或使盗版到2027年进入平台期，但何时开始下降仍无共识。平台期是增速停下来，不是数量已经减少；近期好转缺少把握，不等于永久无法遏制。\u003c/p>\n\u003ch3>A. cannot be checked in spite of new legislation\u003c/h3>\n\u003cblockquote>\n\u003cp>即使有新立法也无法得到遏制\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 cannot be checked 断言无法遏制，末段的when it may begin to decline却在讨论何时可能下降，因此回看Hawley引语后半句；A又提new legislation，前面ACE和数量变化那一段还见过law这个词，因此回读那一整段，确认它与法律的联系。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>第5段确实提到2020年法律及非法服务数量的下降，现在把这项具体效果与Hawley对下降时间的说法接回A。\u003c/p>\n\u003cp>Hawley的when it may begin to decline保留了下降的可能，分歧在何时开始，并非断言永远不可能。A的cannot be checked则取消了任何遏制可能。补读的第5段还写北美非法服务数量由一千四百多个降到126，2020年法律为这种结果提供了部分帮助；这也与“不管有法律也无法遏制”的绝对说法不同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>ACE says it’s helped shrink the number of illegal streaming services in North America to 126, from more than 1,400 in 2018, aided in part by the MPA’s support for a 2020 federal law that made large-scale streaming of copyrighted material a serious crime.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据Hawley，数字盗版即使有新立法也无法得到遏制。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 cannot be checked 断言无法遏制，末段的when it may begin to decline却在讨论何时可能下降，因此回看Hawley引语后半句；A又提new legislation，前面ACE和数量变化那一段还见过law这个词，因此回读那一整段，确认它与法律的联系。\u003c/p>\n\u003cp>第5段确实提到2020年法律及非法服务数量的下降，现在把这项具体效果与Hawley对下降时间的说法接回A。\u003c/p>\n\u003cp>Hawley的when it may begin to decline保留了下降的可能，分歧在何时开始，并非断言永远不可能。A的cannot be checked则取消了任何遏制可能。补读的第5段还写北美非法服务数量由一千四百多个降到126，2020年法律为这种结果提供了部分帮助；这也与“不管有法律也无法遏制”的绝对说法不同。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>ACE says it’s helped shrink the number of illegal streaming services in North America to 126, from more than 1,400 in 2018, aided in part by the MPA’s support for a 2020 federal law that made large-scale streaming of copyrighted material a serious crime.\u003c/p>\n\u003cp>Hawley承认新措施或使盗版到2027年进入平台期，但何时开始下降仍无共识。平台期是增速停下来，不是数量已经减少；近期好转缺少把握，不等于永久无法遏制。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：列出北美非法服务数量下降及2020年法律提供的部分帮助。预测合法服务未来仍面临巨额损失，并指出对盗版何时开始下降尚无共识。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>New legislation cannot restrain digital piracy in any way, so a future decline is impossible.\u003c/p>\n\u003cp>新立法无论如何都不能遏制数字盗版，未来下降不可能发生。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文保留措施可能带来平台期的乐观判断，前段还有非法服务数下降。A将下降时间不明升级成绝对不可能，还抹掉已有部分成效，判断强度与文本相反。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文最后仍强调损害持续，因此对近期改善应保持谨慎。但严重经济损失本身不能证明业务会被压垮，何时可能下降以及是否有人低估，仍取决于Hawley的原话。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>cannot be checked in spite of new legislation\u003cbr>即使有新立法也无法得到遏制\u003c/p>\n\u003c/blockquote>\n\u003cp>Hawley的when it may begin to decline保留了下降的可能，分歧在何时开始，并非断言永远不可能。A的cannot be checked则取消了任何遏制可能。补读的第5段还写北美非法服务数量由一千四百多个降到126，2020年法律为这种结果提供了部分帮助；这也与“不管有法律也无法遏制”的绝对说法不同。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：列出北美非法服务数量下降及2020年法律提供的部分帮助。预测合法服务未来仍面临巨额损失，并指出对盗版何时开始下降尚无共识。\u003c/p>\n\u003cp>本项最终仍要根据“there is no consensus”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. will possibly overwhelm legitimate streamers\u003c/h3>\n\u003cblockquote>\n\u003cp>可能会压垮合法流媒体服务商\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 overwhelm legitimate streamers 要从损害推到压垮公司，第6段具体给出的是loss from piracy，因此回看未来两年的损失预测以及Hawley对下降时间的判断。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文loss from piracy给出的是合法服务因盗版失去多少钱，Hawley随后讨论盗版开始下降的时间是否能确定。B的overwhelm legitimate streamers把损失升级为公司被压垮、无力应对。一千一百三十亿美元是一项损失预测，并没有给出公司总收入或承受能力，不能仅由这个大数完成从经济损害到整体压垮的程度变化；Hawley的后半句也没有作出这种经营存亡判断。\u003c/p>\n\u003cp>损失金额与能否继续经营是不同程度的判断，Hawley说的是何时下降尚无共识，B把它换成公司的生存结果。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Consulting firm Parks Associates predicts that legitimate US streaming services’ cumulative loss from piracy since 2022 will reach $113 billion in the next two years.\u003c /p>\n\u003cp>Hawley承认新措施或使盗版到2027年进入平台期，但何时开始下降仍无共识。平台期是增速停下来，不是数量已经减少；近期好转缺少把握，不等于永久无法遏制。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：列出北美非法服务数量下降及2020年法律提供的部分帮助。预测合法服务未来仍面临巨额损失，并指出对盗版何时开始下降尚无共识。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Hawley does not expect a reliable near-term decline, since even the timing of a fall remains unsettled.\u003c/p>\n\u003cp>霍利不认为近期下降有可靠把握，因为连下降时间仍未确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>by 2027的乐观预期也只是plateau，随后no consensus进一步限制下降判断。unlikely in the near future保留概率和近期限定，不把平台期等同下降，也不声称今后永不改善。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入34题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文最后仍强调损害持续，因此对近期改善应保持谨慎。但严重经济损失本身不能证明业务会被压垮，何时可能下降以及是否有人低估，仍取决于Hawley的原话。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>is unlikely to diminish in the near future\u003cbr>近期不太可能减少\u003c/p>\n\u003c/blockquote>\n\u003cp>C的unlikely in the near future是有限的近期判断，与这种谨慎语气吻合。它没有把2027年当成确定下降年份，也没有否定未来改善的可能；判断强度比“永远不能遏制”更贴合原话。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：列出北美非法服务数量下降及2020年法律提供的部分帮助。预测合法服务未来仍面临巨额损失，并指出对盗版何时开始下降尚无共识。\u003c/p>\n\u003cp>本项最终仍要根据“there is no consensus”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. has been underestimated by some analysts\u003c/h3>\n\u003cblockquote>\n\u003cp>被一些分析人士低估了\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“has been [xxx] by some analysts”，保留了相应遮挡。当时的定位线索是：D的 some analysts 指研究这件事的人，第6段说there is no consensus，也涉及不同人的判断，因此回看Hawley谈乐观预期和缺少共识的引语。读完全文后，做题模式再经交叉验证排除D，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>underestimated表示原先评得太低，需要被评对象、原先估计和较真实情况的差距。段末no consensus只说明各方对下降时间意见不一，some optimism也只描述某些乐观预期。\u003c/p>\n\u003cp>这些信息都没有报告哪
