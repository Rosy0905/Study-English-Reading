const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| Hollywood | n.好莱坞 | struggled to turn a profit | phr.一直难以盈利 | streaming | n.流媒体 |\n| losing | v.损失 | sparking concerns | phr.引发担忧 | profitable | adj.盈利的 |\n| cable | n.有线电视 | boon | n.益处 | pirates | n.盗版者 |\n| rip | v.快速复制；撷取 | legitimate | adj.合法的 | platforms | n.平台 |\n| host | v.托管，提供 | illegitimate services | n.非法服务 | rake in | phr.v.大量赚取 |\n| annually | adv.每年 | ads | n.广告 | subscriptions | n.订阅 |","context":{"mode":"image","asset":"articleAnnotated","label":"2025英语一Text 3重点词与语境","focus":[85,142,925,772],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Hollywood\u003c/td>\n\u003ct 读与翻译","title":"句子逻辑梳理（选修，按照自身语法基础而定)","level":2,"raw":"## 句子逻辑梳理（选修，按照自身语法基础而定)\n\n### 第1段\n\nEver since taking on Netflix Inc：(at its own game) → old Hollywood has struggled → to turn a profit：(in streaming) → with the likes of Disney+, Peacock and Paramount+：(losing billions of dollars each year) → sparking concerns：(that the services will never be → as profitable as cable once was).\n\nBut the age of streaming → has been a boon → for some unintended winners：pirates：(that use software → to rip a film or television show：(in seconds)：(from legitimate online video platforms) + host the titles：(on their own, illegitimate services))：(which rake in → about $2 billion annually：(from ads and subscriptions)).\n\n### 第2段\n\nWith no video production costs → illegal streaming sites → have achieved profit margins：(approaching 90%) → according to the Motion Picture Association (MPA)：(a trade group representing Hollywood studios：(that's working to crack down on → the thousands of illegal platforms：(that have cropped up：(in recent years)))).\n\n### 第3段\n\nInitially → the rise of legitimate online businesses：(such as Netflix) → actually helped curb → digital piracy：(which had largely been based on → file uploads).\n\nBut now → piracy：(involving illegal streaming services + file-sharing) → costs the US economy → about $30 billion：(in lost revenue a year) + some 250,000 jobs → estimates the US Chamber of Commerce's Global Innovation Policy Center.\n\nThe global impact → is about $71 billion annually.\n\n### 第4段\n\n\"The people：(who are stealing → our movies and our television shows + operating piracy sites) → are not mom and pop operations,\" → says Charlie Rivkin：(chief executive officer of the MPA).\n\n\"This is organized crime.\"\n\nRivkin joined the MPA：(in 2017) → after the organization failed：(five years earlier) → to build consensus：(between Hollywood and Silicon Valley) → to win passage of legislation：(in Congress)：(aimed at stopping online piracy).\n\nIn 2017 → the association formed → the Alliance for Creativity and Entertainment (ACE)：(an enforcement task force：(of about 100 detectives)：(circling the globe)：(to help local authorities → arrest streaming pirates)).\n\n### 第5段\n\nACE says → it's helped shrink → the number of illegal streaming services：(in North America) → to 126：(from more than 1,400：(in 2018)) → aided in part：(by the MPA's support：(for a 2020 federal law：(that made large-scale streaming：(of copyrighted material) → a serious crime))).\n\n### 第6段\n\nConsulting firm Parks Associates → predicts：(that legitimate US streaming services' cumulative loss from piracy：(since 2022) → will reach $113 billion：(in the next two years)).\n\n\"While there is some optimism：(that emerging countermeasures + best practices → may see piracy begin to plateau：(by 2027)) // there is no consensus：(among stakeholders)：(as to when it may begin to decline),\" → says analyst Steve Hawley.","context":{"mode":"image","asset":"articleAnnotated","label":"2025英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>Ever since taking on Netflix Inc：(at its own game) → old Hollywood has struggled → to turn a profit：(in streaming) → with the likes of Disney+, Peacock and Paramount+：(losing billions of dollars each year) → sparking concerns：(that the services will never be → as profitable as cable once was).\u003c/p>\n\u003cp>But the age of streaming → has been a boon → for some unintended winners：pirates：(that use software → to rip a film or television show：(in seconds)：(from legitimate online video platforms) + host the titles：(on their own, illegitimate services))：(which rake in → about $2 billion annually：(from ads and subscriptions)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>With no video production costs → illegal streaming sites → have achieved profit margins：(approaching 90%) → according to the Motion Picture Association (MPA)：(a trade group representing Hollywood studios：(that&#39;s working to crack down on → the thousands of illegal platforms：(that have cropped up：(in recent years)))).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Initially → the rise of legitimate online businesses：(such as Netflix) → actually helped curb → digital piracy：(which had largely been based on → file uploads).\u003c/p>\n\u003cp>But now → piracy：(involving illegal streaming services + file-sharing) → costs the US economy → about $30 billion：(in lost revenue a year) + some 250,000 jobs → estimates the US Chamber of Commerce&#39;s Global Innovation Policy Center.\u003c/p>\n\u003cp>The global impact → is about $71 billion annually.\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>&quot;The people：(who are stealing → our movies and our television shows + operating piracy sites) → are not mom and pop operations,&quot; → says Charlie Rivkin：(chief executive officer of the MPA).\u003c/p>\n\u003cp>&quot;This is organized crime.&quot;\u003c/p>\n\u003cp>Rivkin joined the MPA：(in 2017) → after the organization failed：(five years earlier) → to build consensus：(between Hollywood and Silicon Valley) → to win passage of legislation：(in Congress)：(aimed at stopping online piracy).\u003c/p>\n\u003cp>In 2017 → the association formed → the Alliance for Creativity and Entertainment (ACE)：(an enforcement task force：(of about 100 detectives)：(circling the globe)：(to help local authorities → arrest streaming pirates)).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>ACE says → it&#39;s helped shrink → the number of illegal streaming services：(in North America) → to 126：(from more than 1,400：(in 2018)) → aided in part：(by the MPA&#39;s support：(for a 2020 federal law：(that made large-scale streaming：(of copyrighted material) → a serious crime))).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>Consulting firm Parks Associates → predicts：(that legitimate US streaming services&#39; cumulative loss from piracy：(since 2022) → will reach $113 billion：(in the next two years)).\u003c/p>\n\u003cp>&quot;While there is some optimism：(that emerging countermeasures + best practices → may see piracy begin to plateau：(by 2027)) // there is no consensus：(among stakeholders)：(as to when it may begin to decline),&quot; → says analyst Steve Hawley.\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n自从开始玩Netflix公司：(的游戏) → 老好莱坞一直在努力 → 实现盈利：(在流媒体方面) → 像Disney+、Peacock和Paramount+：(每年损失数十亿美元) → 引发担忧：(这些服务将永远不会 → 像有线电视曾经那样盈利)。\n\n但流媒体时代 → 已经成为福音 → 对一些意外的赢家：盗版者：(使用软件 → 撕取电影或电视节目：(在几秒钟内)：(从合法的在线视频平台) + 托管这些片名：(在他们自己的非法服务上))：(这些服务赚取 → 每年约20亿美元：(从广告和订阅中))。\n\n### 第2段\n\n由于没有视频制作成本 → 非法流媒体网站 → 已经实现了利润率：(接近90%) → 根据电影协会（MPA）：(一个代表好莱坞制片厂的贸易组织：(正在努力打击 → 成千上万的非法平台：(这些平台已经出现：(在最近几年))))。\n\n### 第3段\n\n最初 → 合法在线业务的兴起：(比如Netflix) → 实际上帮助遏制了 → 数字盗版：(这种盗版主要基于 → 文件上传)。\n\n但现在 → 盗版：(涉及非法流媒体服务 + 文件共享) → 使美国经济损失 → 约300亿美元：(每年的收入损失) + 约25万个工作岗位 → 美国商会的全球创新政策中心估计。\n\n全球影响 → 每年约710亿美元。\n\n### 第4段\n\n\"那些人：(偷窃 → 我们的电影和电视节目 + 运营盗版网站) → 不是夫妻店，\" → 查理·里夫金说：(MPA的首席执行官)。\n\n\"这是有组织犯罪。\"\n\n里夫金加入了MPA：(在2017年) → 在该组织失败后：(五年前) → 建立共识：(在好莱坞和硅谷之间) → 赢得立法通过：(在国会)：(旨在阻止在线盗版)。\n\n在2017年 → 该协会成立了 → 创意与娱乐联盟（ACE）：(一个执法特遣队：(约100名侦探)：(环游全球)：(帮助地方当局 → 逮捕流媒体盗版者))。\n\n### 第5段\n\nACE说 → 它帮助减少了 → 非法流媒体服务的数量：(在北美) → 到126个：(从超过1400个：(在2018年)) → 部分得益于：(MPA的支持：(对2020年联邦法律：(该法律使大规模流媒体传输：(受版权保护的材料) → 成为严重犯罪)))。\n\n### 第6段\n\n咨询公司Parks Associates → 预测：(合法的美国流媒体服务因盗版造成的累计损失：(自2022年以来) → 将达到1130亿美元：(在未来两年内))。\n\n\"虽然有一些乐观情绪：(认为新兴的对策 + 最佳实践 → 可能会看到盗版开始趋于平稳：(到2027年)) // 但没有共识：(在利益相关者中)：(关于何时可能开始下降)，\" → 分析师史蒂夫·霍利说。","context":{"mode":"image","asset":"articleAnnotated","label":"2025英语一Text 3重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>自从开始玩Netflix公司：(的游戏) → 老好莱坞一直在努力 → 实现盈利：(在流媒体方面) → 像Disney+、Peacock和Paramount+：(每年损失数十亿美元) → 引发担忧：(这些服务将永远不会 → 像有线电视曾经那样盈利)。\u003c/p>\n\u003cp>但流媒体时代 → 已经成为福音 → 对一些意外的赢家：盗版者：(使用软件 → 撕取电影或电视节目：(在几秒钟内)：(从合法的在线视频平台) + 托管这些片名：(在他们自己的非法服务 实际文章是不是这样写；\n- **全文主旨：**检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从35题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"35题 · 题干、题型与核心出处","level":2,"raw":"## 35题\n\n**Which of the following is emphasized in the text?**\n\n文章着重强调了下列哪一点？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **The need to coordinate anti-piracy action.**\n\n协调反盗版行动的必要性。\n\nB. **The criminal nature of copyright violation.**\n\n侵犯版权的犯罪性质。\n\nC. **The prospect of eliminating online piracy.**\n\n消除在线盗版的前景。\n\nD. **The economic harm from illegal streaming.**\n\n非法流媒体造成的经济损害。\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。 | 先说两边如今的处境不同 |\n| 第2段 | 说明非法网站没有视频制作成本，利润相关数字接近90%，MPA正在打击它们。 | 回头解释一边为何这么占便宜 |\n| 第3段 | 先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。 | 但话说回来另一边付出了大代价 |\n| 第4段 | 说明盗版是有组织犯罪，介绍MPA共识努力未成和后来成立ACE协助抓捕。 | 接着写为了处理这事做了什么 |\n| 第5段 | 列出北美非法服务数量下降及2020年法律提供的部分帮助。 | 再说这些努力已经有一些效果 |\n| 第6段 | 预测合法服务未来仍面临巨额损失，并指出对盗版何时开始下降尚无共识。 | 最后说代价还在好转也没定数 |","context":{"mode":"image","asset":"questions","focus":[250,2325,1800,445],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"question":"35","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003cp>文章着重强调了下列哪一点？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>The need to coordinate anti-piracy action.\u003c/strong>\u003c/p>\n\u003cp>协调反盗版行动的必要性。\u003c/p>\n\u003cp>B. \u003cstrong>The criminal nature of copyright violation.\u003c/strong>\u003c/p>\n\u003cp>侵犯版权的犯罪性质。\u003c/p>\n\u003cp>C. \u003cstrong>The prospect of eliminating online piracy.\u003c/strong>\u003c/p>\n\u003cp>消除在线盗版的前景。\u003c/p>\n\u003cp>D. \u003cstrong>The economic harm from illegal streaming.\u003c/strong>\u003c/p>\n\u003cp>非法流媒体造成的经济损害。\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。\u003c/td>\n\u003ctd>先说两边如今的处境不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>说明非法网站没有视频制作成本，利润相关数字接近90%，MPA正在打击它们。\u003c/td>\n\u003ctd>回头解释一边为何这么占便宜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。\u003c/td>\n\u003ctd>但话说回来另一边付出了大代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明盗版是有组织犯罪，介绍MPA共识努力未成和后来成立ACE协助抓捕。\u003c/td>\n\u003ctd>接着写为了处理这事做了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>列出北美非法服务数量下降及2020年法律提供的部分帮助。\u003c/td>\n\u003ctd>再说这些努力已经有一些效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>预测合法服务未来仍面临巨额损失，并指出对盗版何时开始下降尚无共识。\u003c/td>\n\u003ctd>最后说代价还在好转也没定数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. The need to coordinate anti-piracy action.","level":3,"raw":"**Which of the following is emphasized in the text?**\n\n### A. The need to coordinate anti-piracy action.\n\n协调反盗版行动的必要性。","context":{"mode":"image","asset":"questions","focus":[250,2325,1800,445],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"A"},"focusId":"focus-q35-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-A-0\">\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003cp>协调反盗版行动的必要性。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. The need to coordinate anti-piracy action.","level":3,"raw":"#### 如果 A 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n协调反盗版行动的必要性。\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 对照各自为战的合法平台与相互配合的盗版经营，提出反盗版各方必须协调的问题。 | 先说两边如今的处境不同 |\n| 第2段 | 解释盗版一方如何利用执法部门与企业之间的信息缺口，取得分散行动难以遏制的优势。 | 回头解释一边为何这么占便宜 |\n| 第3段 | 说明合法企业因协作不足持续承担收入与岗位损失，凸显协调的必要性。 | 但话说回来另一边付出了大代价 |\n| 第4段 | 介绍行业、技术公司及地方机关需要怎样共享线索、分工行动，并交代已有合作尝试。 | 接着写为了处理这事做了什么 |\n| 第5段 | 用共同执法后的平台减少说明协调能够改善效果，支持继续投入协作。 | 再说这些努力已经有一些效果 |\n| 第6段 | 承认损失仍在且改善时间未明，指出剩余协作障碍，重新提出持续协调的必要性。 | 最后说代价还在好转也没定数 |\n\nMPA曾想促成共识，ACE又与地方当局协作，所以A确实能解释第4、5段的一部分内容。但第1段先比较合法平台亏损与盗版收入，第2段解释盗版经营没有制作成本，第3段连续量化收入与岗位损失；它们并未把问题诊断为“各方缺少协调”。最后作者也没有给出协调分工或号召建立新联盟，而是再次落在一千一百三十亿美元损失和下降时间未定。协调是应对损害的一种行动，不能替代反复被强调的经济后果。\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2325,1800,445],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"A"},"focusId":"focus-q35-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-A-0\">\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003cp>协调反盗版行动的必要性。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-A-1\">\u003ch4>如果 A 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>协调反盗版行动的必要性。\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>对照各自为战的合法平台与相互配合的盗版经营，提出反盗版各方必须协调的问题。\u003c/td>\n\u003ctd>先说两边如今的处境不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释盗版一方如何利用执法部门与企业之间的信息缺口，取得分散行动难以遏制的优势。\u003c/td>\n\u003ctd>回头解释一边为何这么占便宜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>说明合法企业因协作不足持续承担收入与岗位损失，凸显协调的必要性。\u003c/td>\n\u003ctd>但话说回来另一边付出了大代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍行业、技术公司及地方机关需要怎样共享线索、分工行动，并交代已有合作尝试。\u003c/td>\n\u003ctd>接着写为了处理这事做了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>用共同执法后的平台减少说明协调能够改善效果，支持继续投入协作。\u003c/td>\n\u003ctd>再说这些努力已经有一些效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>承认损失仍在且改善时间未明，指出剩余协作障碍，重新提出持续协调的必要性。\u003c/td>\n\u003ctd>最后说代价还在好转也没定数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>MPA曾想促成共识，ACE又与地方当局协作，所以A确实能解释第4、5段的一部分内容。但第1段先比较合法平台亏损与盗版收入，第2段解释盗版经营没有制作成本，第3段连续量化收入与岗位损失；它们并未把问题诊断为“各方缺少协调”。最后作者也没有给出协调分工或号召建立新联盟，而是再次落在一千一百三十亿美元损失和下降时间未定。协调是应对损害的一种行动，不能替代反复被强调的经济后果。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. The criminal nature of copyright violation.","level":3,"raw":"**Which of the following is emphasized in the text?**\n\n### B. The criminal nature of copyright violation.\n\n侵犯版权的犯罪性质。","context":{"mode":"image","asset":"questions","focus":[250,2325,1800,445],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"B"},"focusId":"focus-q35-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-B-0\">\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003cp>侵犯版权的犯罪性质。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. The criminal nature of copyright violation.","level":3,"raw":"#### 如果 B 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n侵犯版权的犯罪性质。\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 先区分正常经营合法作品与盗用版权内容的行为，指出两类活动的法律性质不同。 | 先说两边如今的处境不同 |\n| 第2段 | 解释非法经营凭无权使用的内容占便宜，说明高利润为何源于侵犯受保护权利。 | 回头解释一边为何这么占便宜 |\n| 第3段 | 再从权利人及社会遭受的损害说明版权侵犯具有应受刑事追究的严重性。 | 但话说回来另一边付出了大代价 |\n| 第4段 | 介绍调查和立法怎样认定有组织侵权，并采用针对犯罪的处理方式。 | 接着写为了处理这事做了什么 |\n| 第5段 | 列出执法与法律适用的效果，说明相关侵权已作为犯罪受到实际追究。 | 再说这些努力已经有一些效果 |\n| 第6段 | 承认这种犯罪仍造成代价且减少时间难定，重申不能将其仅视为普通商业竞争。 | 最后说代价还在好转也没定数 |\n\n第4段直接说This is organized crime，第5段又有serious crime，B有两处鲜明的原词支持。但文章并没有花主要篇幅解释版权侵权的构成条件、违法与犯罪的界线。开头的盈亏对照、第2段制作成本与利润数字、第3段的经济和就业损失、最后的未来损失预测，都是说明这种经营带来多大经济伤害。犯罪性质解释为何要抓捕，不能把整篇关于损失的数据都改成法律性质的论证。\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2325,1800,445],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"B"},"focusId":"focus-q35-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-B-0\">\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003cp>侵犯版权的犯罪性质。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-B-1\">\u003ch4>如果 B 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>侵犯版权的犯罪性质。\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先区分正常经营合法作品与盗用版权内容的行为，指出两类活动的法律性质不同。\u003c/td>\n\u003ctd>先说两边如今的处境不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释非法经营凭无权使用的内容占便宜，说明高利润为何源于侵犯受保护权利。\u003c/td>\n\u003ctd>回头解释一边为何这么占便宜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>再从权利人及社会遭受的损害说明版权侵犯具有应受刑事追究的严重性。\u003c/td>\n\u003ctd>但话说回来另一边付出了大代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍调查和立法怎样认定有组织侵权，并采用针对犯罪的处理方式。\u003c/td>\n\u003ctd>接着写为了处理这事做了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>列出执法与法律适用的效果，说明相关侵权已作为犯罪受到实际追究。\u003c/td>\n\u003ctd>再说这些努力已经有一些效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>承认这种犯罪仍造成代价且减少时间难定，重申不能将其仅视为普通商业竞争。\u003c/td>\n\u003ctd>最后说代价还在好转也没定数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第4段直接说This is organized crime，第5段又有serious crime，B有两处鲜明的原词支持。但文章并没有花主要篇幅解释版权侵权的构成条件、违法与犯罪的界线。开头的盈亏对照、第2段制作成本与利润数字、第3段的经济和就业损失、最后的未来损失预测，都是说明这种经营带来多大经济伤害。犯罪性质解释为何要抓捕，不能把整篇关于损失的数据都改成法律性质的论证。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. The prospect of eliminating online piracy.","level":3,"raw":"**Which of the following is emphasized in the text?**\n\n### C. The prospect of eliminating online piracy.\n\n消除在线盗版的前景。","context":{"mode":"image","asset":"questions","focus":[250,2325,1800,445],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"C"},"focusId":"focus-q35-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-C-0\">\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003cp>消除在线盗版的前景。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. The prospect of eliminating online piracy.","level":3,"raw":"#### 如果 C 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n消除在线盗版的前景。\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 对照合法平台受压与盗版蓬勃的处境，提出在线盗版是否有望被彻底消除。 | 先说两边如今的处境不同 |\n| 第2段 | 解释盗版成本低、获利高的生存动力，指出完全清除面临的首个障碍。 | 回头解释一边为何这么占便宜 |\n| 第3段 | 列举另一方承担的损害，说明为什么需要检验消除盗版的可能，而不满足于暂时控制。 | 但话说回来另一边付出了大代价 |\n| 第4段 | 介绍以根除盗版为方向的行动，考察调查和法律措施怎样覆盖存活条件。 | 接着写为了处理这事做了什么 |\n| 第5段 | 用已有平台减少判断行动距离完全清除还有多远，区分局部成绩与最终目标。 | 再说这些努力已经有一些效果 |\n| 第6段 | 在损害仍在、好转未定的前提下，对消除前景作谨慎判断，说明还缺什么条件。 | 最后说代价还在好转也没定数 |\n\n结尾确实讨论盗版什么时候可能下降，第5段也有非法平台数量减少，所以C看起来能接到后两段。但eliminating是消除，而begin to decline只是开始下降，两者程度不同。第3段和第6段的大额损失并不是逐步证明清零前景，文章也没有给出彻底消除盗版的路线或时间。结尾连开始下降的时点都没有共识，是提醒损害仍会延续，不能改成对彻底清除前景的集中论证。\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2325,1800,445],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"C"},"focusId":"focus-q35-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-C-0\">\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003cp>消除在线盗版的前景。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-C-1\">\u003ch4>如果 C 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>消除在线盗版的前景。\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>对照合法平台受压与盗版蓬勃的处境，提出在线盗版是否有望被彻底消除。\u003c/td>\n\u003ctd>先说两边如今的处境不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>解释盗版成本低、获利高的生存动力，指出完全清除面临的首个障碍。\u003c/td>\n\u003ctd>回头解释一边为何这么占便宜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>列举另一方承担的损害，说明为什么需要检验消除盗版的可能，而不满足于暂时控制。\u003c/td>\n\u003ctd>但话说回来另一边付出了大代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍以根除盗版为方向的行动，考察调查和法律措施怎样覆盖存活条件。\u003c/td>\n\u003ctd>接着写为了处理这事做了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>用已有平台减少判断行动距离完全清除还有多远，区分局部成绩与最终目标。\u003c/td>\n\u003ctd>再说这些努力已经有一些效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>在损害仍在、好转未定的前提下，对消除前景作谨慎判断，说明还缺什么条件。\u003c/td>\n\u003ctd>最后说代价还在好转也没定数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>结尾确实讨论盗版什么时候可能下降，第5段也有非法平台数量减少，所以C看起来能接到后两段。但eliminating是消除，而begin to decline只是开始下降，两者程度不同。第3段和第6段的大额损失并不是逐步证明清零前景，文章也没有给出彻底消除盗版的路线或时间。结尾连开始下降的时点都没有共识，是提醒损害仍会延续，不能改成对彻底清除前景的集中论证。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. The economic harm from illegal streaming.","level":3,"raw":"**Which of the following is emphasized in the text?**\n\n### D. The economic harm from illegal streaming.\n\n非法流媒体造成的经济损害。","context":{"mode":"image","asset":"questions","focus":[250,2325,1800,445],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"35","option":"D"},"focusId":"focus-q35-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q35-D-0\">\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003cp>非法流媒体造成的经济损害。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. The economic harm from illegal streaming.","level":3,"raw":"#### 如果 D 是主旨，文章6段应该怎么写？\n\n如果全文主旨真的是：\n\n非法流媒体造成的经济损害。\n\n那文章6段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 第1段 | 对照合法流媒体盈利困难与盗版者靠复制作品获利，呈现经济利益如何分布。 | 先说两边如今的处境不同 |\n| 第2段 | 回头解释盗版者不负担制作成本，所以能获得异常高的利润率。 | 回头解释一边为何这么占便宜 |\n| 第3段 | 量化合法经营及更大经济体付出的收入、就业和全球损失，展示被转移利益的另一面。 | 但话说回来另一边付出了大代价 |\n| 第4段 | 介绍行业组织为遏制盗版及其经济损害而推进共识、成立执法联盟的行动。 | 接着写为了处理这事做了什么 |\n| 第5段 | 承认打击已减少部分非法服务，说明应对经济损害并非完全没有效果。 | 再说这些努力已经有一些效果 |\n| 第6段 | 再回到持续累积的损失及下降时间不明，提醒经济损害仍是问题核心。 | 最后说代价还在好转也没定数 |\n\nD把六段都接住了。首段合法平台每年亏损与盗版者约二十亿美元收入形成对照，第2段写无视频制作成本，第3段给出美国收入和岗位损失以及全球影响；中间的MPA、ACE和法律是为处理这类盗版而采取的行动。即使北美非法服务数量已经下降，末段仍预测合法服务承受巨额损失，并对何时下降保持谨慎。因此文章既承认行动有效，也没有把数字上的改善写成经济威胁已经解除。D强调损害，能够同时容纳获利方式、损失规模、打击努力与后续风险。\n\n判断：\n\n**D 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2325,1800,445],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"35","option":"D"},"focusId":"focus-q35-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q35-D-0\">\u003cp>\u003cstrong>Which of the following is emphasized in the text?\u003c/strong>\u003c/p>\n\u003cp>非法流媒体造成的经济损害。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q35-D-1\">\u003ch4>如果 D 是主旨，文章6段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>非法流媒体造成的经济损害。\u003c/p>\n\u003cp>那文章6段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>对照合法流媒体盈利困难与盗版者靠复制作品获利，呈现经济利益如何分布。\u003c/td>\n\u003ctd>先说两边如今的处境不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>回头解释盗版者不负担制作成本，所以能获得异常高的利润率。\u003c/td>\n\u003ctd>回头解释一边为何这么占便宜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>量化合法经营及更大经济体付出的收入、就业和全球损失，展示被转移利益的另一面。\u003c/td>\n\u003ctd>但话说回来另一边付出了大代价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>介绍行业组织为遏制盗版及其经济损害而推进共识、成立执法联盟的行动。\u003c/td>\n\u003ctd>接着写为了处理这事做了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>承认打击已减少部分非法服务，说明应对经济损害并非完全没有效果。\u003c/td>\n\u003ctd>再说这些努力已经有一些效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第6段\u003c/td>\n\u003ctd>再回到持续累积的损失及下降时间不明，提醒经济损害仍是问题核心。\u003c/td>\n\u003ctd>最后说代价还在好转也没定数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D把六段都接住了。首段合法平台每年亏损与盗版者约二十亿美元收入形成对照，第2段写无视频制作成本，第3段给出美国收入和岗位损失以及全球影响；中间的MPA、ACE和法律是为处理这类盗版而采取的行动。即使北美非法服务数量已经下降，末段仍预测合法服务承受巨额损失，并对何时下降保持谨慎。因此文章既承认行动有效，也没有把数字上的改善写成经济威胁已经解除。D强调损害，能够同时容纳获利方式、损失规模、打击努力与后续风险。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"35题结论","level":2,"raw":"### 35题结论\n\n**35. D. The economic harm from illegal streaming.**\n\n这句话就是本文后续做题的主旨底牌：\n\n**The economic harm from illegal streaming. / 非法流媒体造成的经济损害。**","context":{"mode":"image","asset":"questions","focus":[250,2325,1800,445],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"question":"35","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>35. D. The economic harm from illegal streaming.\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>The economic harm from illegal streaming. / 非法流媒体造成的经济损害。\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"31题 · 题干、题型与核心出处","level":2,"raw":"## 31题\n\n> According to Paragraph 1, legitimate streaming services ______.  \n> 根据第1段，合法流媒体服务怎么样？\n\n### 题型\n\n局部推断题。题干要求判断“根据第1段，合法流媒体服务怎么样？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\n\n合法平台盈利困难，与之形成对照的盗版者快速复制其作品并靠广告和订阅牟利。文章把真实的盗版经营置于合法平台的困难旁，支持威胁判断，但没有证明所有亏损皆由盗版造成。","context":{"mode":"image","asset":"questions","focus":[250,244,1800,446],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"question":"31","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>According to Paragraph 1, legitimate streaming services ______.\u003cbr>根据第1段，合法流媒体服务怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>局部推断题。题干要求判断“根据第1段，合法流媒体服务怎么样？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003c/blockquote>\n\u003cp>合法平台盈利困难，与之形成对照的盗版者快速复制其作品并靠广告和订阅牟利。文章把真实的盗版经营置于合法平台的困难旁，支持威胁判断，但没有证明所有亏损皆由盗版造成。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. have drawn lessons from Hollywood","level":3,"raw":"### A. have drawn lessons from Hollywood\n\n> 从好莱坞吸取了教训\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A的 drawn lessons from Hollywood 把好莱坞当成学习对象；原文taking on Netflix Inc.却写好莱坞向Netflix发起竞争，所以回看段首谁在与谁较量。\n\n**错误类型：第一类——歪曲原意。**\n\n原文taking on Netflix Inc.的主体是old Hollywood，好莱坞在Netflix原本经营的领域与它竞争，随后出现的Disney+等就是这种经营尝试。A的drawn lessons from Hollywood把关系写成合法平台从好莱坞学经验。原文的竞争对象是Netflix，好莱坞是进入流媒体竞争的一方，并不是被这些平台统一拿来学习的第三方经验来源；竞争遇到亏损也不是已经吸取经验这一动作。\n\n竞争的双方与学习方向都变了，原句写的是经营困难，没有把这种竞争写成吸取好莱坞经验。\n\n**命题人借用的原文材料：**\n\n> Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.","context":{"mode":"image","asset":"questions","focus":[250,342,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option":"A"},"focusId":"focus-q31-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>从好莱坞吸取了教训\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 drawn lessons from Hollywood 把好莱坞当成学习对象；原文taking on Netflix Inc.却写好莱坞向Netflix发起竞争，所以回看段首谁在与谁较量。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文taking on Netflix Inc.的主体是old Hollywood，好莱坞在Netflix原本经营的领域与它竞争，随后出现的Disney+等就是这种经营尝试。A的drawn lessons from Hollywood把关系写成合法平台从好莱坞学经验。原文的竞争对象是Netflix，好莱坞是进入流媒体竞争的一方，并不是被这些平台统一拿来学习的第三方经验来源；竞争遇到亏损也不是已经吸取经验这一动作。\u003c/p>\n\u003cp>竞争的双方与学习方向都变了，原句写的是经营困难，没有把这种竞争写成吸取好莱坞经验。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. have drawn lessons from Hollywood","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据第1段，合法流媒体服务从好莱坞吸取了教训。\n\nA的 drawn lessons from Hollywood 把好莱坞当成学习对象；原文taking on Netflix Inc.却写好莱坞向Netflix发起竞争，所以回看段首谁在与谁较量。\n\n原文taking on Netflix Inc.的主体是old Hollywood，好莱坞在Netflix原本经营的领域与它竞争，随后出现的Disney+等就是这种经营尝试。A的drawn lessons from Hollywood把关系写成合法平台从好莱坞学经验。原文的竞争对象是Netflix，好莱坞是进入流媒体竞争的一方，并不是被这些平台统一拿来学习的第三方经验来源；竞争遇到亏损也不是已经吸取经验这一动作。\n\n竞争的双方与学习方向都变了，原句写的是经营困难，没有把这种竞争写成吸取好莱坞经验。","context":{"mode":"image","asset":"questions","focus":[250,342,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"31","option":"A"},"focusId":"focus-q31-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>从好莱坞吸取了教训\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 drawn lessons from Hollywood 把好莱坞当成学习对象；原文taking on Netflix Inc.却写好莱坞向Netflix发起竞争，所以回看段首谁在与谁较量。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文taking on Netflix Inc.的主体是old Hollywood，好莱坞在Netflix原本经营的领域与它竞争，随后出现的Disney+等就是这种经营尝试。A的drawn lessons from Hollywood把关系写成合法平台从好莱坞学经验。原文的竞争对象是Netflix，好莱坞是进入流媒体竞争的一方，并不是被这些平台统一拿来学习的第三方经验来源；竞争遇到亏损也不是已经吸取经验这一动作。\u003c/p>\n\u003cp>竞争的双方与学习方向都变了，原句写的是经营困难，没有把这种竞争写成吸取好莱坞经验。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第1段，合法流媒体服务从好莱坞吸取了教训。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 drawn lessons from Hollywood 把好莱坞当成学习对象；原文taking on Netflix Inc.却写好莱坞向Netflix发起竞争，所以回看段首谁在与谁较量。\u003c/p>\n\u003cp>原文taking on Netflix Inc.的主体是old Hollywood，好莱坞在Netflix原本经营的领域与它竞争，随后出现的Disney+等就是这种经营尝试。A的drawn lessons from Hollywood把关系写成合法平台从好莱坞学经验。原文的竞争对象是Netflix，好莱坞是进入流媒体竞争的一方，并不是被这些平台统一拿来学习的第三方经验来源；竞争遇到亏损也不是已经吸取经验这一动作。\u003c/p>\n\u003cp>竞争的双方与学习方向都变了，原句写的是经营困难，没有把这种竞争写成吸取好莱坞经验。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. have drawn lessons from Hollywood","level":4,"raw":"#### 写作视角法\n\n原文第1段是这样写的：\n\n> Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\n>\n> 合法平台盈利困难，与之形成对照的盗版者快速复制其作品并靠广告和订阅牟利。文章把真实的盗版经营置于合法平台的困难旁，支持威胁判断，但没有证明所有亏损皆由盗版造成。\n\n把这一处放回全文，它承担的写作任务是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Legitimate streamers improved their businesses by learning lessons from Hollywood’s experience.\n>\n> 合法流媒体通过吸取好莱坞的经验改进了经营。\n\n首句主体是old Hollywood，动作是进入Netflix的业务领域竞争。A要写合法平台以好莱坞为经验来源，后文还应说明学了什么；原文只报告好莱坞平台经营艰难，既未交代学习，也未给出改进。","context":{"mode":"image","asset":"questions","focus":[250,342,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"31","option":"A"},"focusId":"focus-q31-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-A-0\">\u003cblockquote>\n\u003cp>从好莱坞吸取了教训\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 drawn lessons from Hollywood 把好莱坞当成学习对象；原文taking on Netflix Inc.却写好莱坞向Netflix发起竞争，所以回看段首谁在与谁较量。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文taking on Netflix Inc.的主体是old Hollywood，好莱坞在Netflix原本经营的领域与它竞争，随后出现的Disney+等就是这种经营尝试。A的drawn lessons from Hollywood把关系写成合法平台从好莱坞学经验。原文的竞争对象是Netflix，好莱坞是进入流媒体竞争的一方，并不是被这些平台统一拿来学习的第三方经验来源；竞争遇到亏损也不是已经吸取经验这一动作。\u003c/p>\n\u003cp>竞争的双方与学习方向都变了，原句写的是经营困难，没有把这种竞争写成吸取好莱坞经验。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第1段，合法流媒体服务从好莱坞吸取了教训。\u003c/p>\n\u003c/b Part\" id=\"focus-q31-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>35题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>The economic harm from illegal streaming.\u003cbr>非法流媒体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入31题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文强调非法流媒体造成经济损害，首段的合法业务处境应放在这一损害关系中理解。但不能仅凭主旨断言所有亏损源于盗版，更不能确定其营收比较和广告商偏好。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>have drawn lessons from Hollywood\u003cbr>从好莱坞吸取了教训\u003c/p>\n\u003c/blockquote>\n\u003cp>竞争的双方与学习方向都变了，原句写的是经营困难，没有把这种竞争写成吸取好莱坞经验。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。\u003c/p>\n\u003cp>本项最终仍要根据“host the titles on their own, illegitimate services”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. have surpassed cable in revenue","level":3,"raw":"### B. have surpassed cable in revenue\n\n> 在收入上已经超过有线电视\n\n**做题模式中的状态：** 第一轮B保留。当时选项呈现为“have [xxx] cable in revenue”，保留了相应遮挡。当时的定位线索是：B的 in revenue 要比较收入，第1段与cable的比较却写as profitable as cable once was，所以回看华尔街担忧的那一句，先区分营收与盈利。读完全文后，做题模式再经交叉验证排除B，最终选择D。\n\n**错误类型：第一类——歪曲原意。**\n\n完整选项说营收已超过有线电视，have surpassed是已发生的比较。原文担忧的是将来能否像昔日有线电视一样盈利，be as profitable比较盈利能力，既不是营收，也不是当前超过的事实。\n\n收入很高仍可能因成本更高而亏损，反过来盈利担忧也不能说明收入到底谁高。B把盈利指标换成收入指标，又把未来担忧换成已经实现的超越，因此没有被段首的财务描述支持。\n\n**命题人借用的原文材料：**\n\n> Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was.","context":{"mode":"image","asset":"questions","focus":[250,428,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option":"B"},"focusId":"focus-q31-B-0","html":"\u003csection cla 的合法业务处境应放在这一损害关系中理解。但不能仅凭主旨断言所有亏损源于盗版，更不能确定其营收比较和广告商偏好。\n\n但B实际说的是：\n\n> have surpassed cable in revenue  \n> 在收入上已经超过有线电视\n\n收入很高仍可能因成本更高而亏损，反过来盈利担忧也不能说明收入到底谁高。B把盈利指标换成收入指标，又把未来担忧换成已经实现的超越，因此没有被段首的财务描述支持。\n\n从全文推进看，这一处的作用是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。\n\n本项最终仍要根据“host the titles on their own, illegitimate services”这处局部原文判断。\n\n**复盘判断：B错误。**","context":{"mode":"image","asset":"questions","focus":[250,428,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"31","option":"B"},"focusId":"focus-q31-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-B-0\">\u003cblockquote>\n\u003cp>在收入上已经超过有线电视\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“have [xxx] cable in revenue”，保留了相应遮挡。当时的定位线索是：B的 in revenue 要比较收入，第1段与cable的比较却写as profitable as cable once was，所以回看华尔街担忧的那一句，先区分营收与盈利。读完全文后，做题模式再经交叉验证排除B，最终选择D。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>完整选项说营收已超过有线电视，have surpassed是已发生的比较。原文担忧的是将来能否像昔日有线电视一样盈利，be as profitable比较盈利能力，既不是营收，也不是当前超过的事实。\u003c/p>\n\u003cp>收入很高仍可能因成本更高而亏损，反过来盈利担忧也不能说明收入到底谁高。B把盈利指标换成收入指标，又把未来担忧换成已经实现的超越，因此没有被段首的财务描述支持。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q31-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第1段，合法流媒体服务在收入上已经超过有线电视。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 in revenue 要比较收入，第1段与cable的比较却写as profitable as c 经超过有线电视\u003c/p>\n\u003c/blockquote>\n\u003cp>收入很高仍可能因成本更高而亏损，反过来盈利担忧也不能说明收入到底谁高。B把盈利指标换成收入指标，又把未来担忧换成已经实现的超越，因此没有被段首的财务描述支持。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。\u003c/p>\n\u003cp>本项最终仍要根据“host the titles on their own, illegitimate services”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. are unpopular with advertisers","level":3,"raw":"### C. are unpopular with advertisers\n\n> 不受广告商欢迎\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C的 advertisers 与第1段from ads都涉及广告，所以回看段末这些广告收入连在哪一种服务上，确认是合法平台还是盗版者自己的服务。\n\n**错误类型：第三类——无中生有。**\n\n原文from ads接在盗版者自己的服务之后，说这些服务每年约二十亿美元的钱与广告等项目相关。C的advertisers却成了对合法平台作出负面评价的人，are unpopular又断言广告商不喜欢合法服务。原文介绍盗版服务的钱，并没有把广告商的选择作为合法平台亏损的原因；C把另一类服务的收入关系换成了合法服务受到冷落的评价。\n\n广告对应的是盗版服务的收入，C转换了被评价的平台，又添加广告商不喜欢的态度。\n\n**命题人借用的原文材料：**\n\n> Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns on Wall Street that the services will never be as profitable as cable once was. But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.","context":{"mode":"image","asset":"questions","focus":[250,514,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-31-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"31","option":"C"},"focusId":"focus-q31-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q31-C-0\">\u003cblockquote>\n\u003cp>不受广告商欢迎\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C的 advertisers 与第1段fro 说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>are confronted with a real threat\u003cbr>面临一种现实威胁\u003c/p>\n\u003c/blockquote>\n\u003cp>作品与竞争服务之间的联系已经出现，D概括这种处境，没有把全部亏损原因或用户流失数量另行补进去。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：对照合法流媒体难以获利和盗版者经营他人作品的收入，引出两类平台不同的经济处境。\u003c/p>\n\u003cp>本项最终仍要根据“host the titles on their own, illegitimate services”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"31题结论","level":2,"raw":"### 31题结论\n\n> **31. D. are confronted with a real threat**\n\nA：好莱坞进入竞争，不能转成平台向好莱坞学习。\n\nB：未来盈利担忧不支持当前营收已经超过的判断。\n\nC：盗版广告收入没有证明合法平台不受广告商欢迎。\n\nD：复制合法作品另行经营，构成有具体行为依据的现实威胁。","context":{"mode":"image","asset":"questions","focus":[250,244,1800,446],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"question":"31","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>31. D. are confronted with a real threat\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：好莱坞进入竞争，不能转成平台向好莱坞学习。\u003c/p>\n\u003cp>B：未来盈利担忧不支持当前营收已经超过的判断。\u003c/p>\n\u003cp>C：盗版广告收入没有证明合法平台不受广告商欢迎。\u003c/p>\n\u003cp>D：复制合法作品另行经营，构成有具体行为依据的现实威胁。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"32题 · 题干、题型与核心出处","level":2,"raw":"## 32题\n\n> It can be learned that streamers like Netflix ______.  \n> 可以了解到，像Netflix这样的流媒体公司怎么样？\n\n### 题型\n\n局部事实推断题。题干要求判断“可以了解到，像Netflix这样的流媒体公司怎么样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads. But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center. The global impact is about $71 billion annually.\n\nInitially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。","context":{"mode":"image","asset":"questions","focus":[250,764,1800,447],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"question":"32","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>It can be learned that streamers like Netflix ______.\u003cbr>可以了解到，像Netflix这样的流媒体公司怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>局部事实推断题。题干要求判断“可以了解到，像Netflix这样的流媒体公司怎么样？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads. But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center. The global impact is about $71 billion annually.\u003c/p>\n\u003c/blockquote>\n\u003cp>Initially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. played a part in the fight against illegal file-sharing","level":3,"raw":"### A. played a part in the fight against illegal file-sharing\n\n> 曾在打击非法文件共享中发挥作用\n\n**做题模式中的状态：** 第一轮A保留。当时的定位线索是：A的 played a part 与第3段helped curb都表示起到帮助作用，所以回看Initially那句，再用后句的file-sharing确认这里谈的文件活动属于盗版。\n\n**选项类型：正确局部推断。**\n\nInitially标明早期，helped curb说明合法业务兴起曾帮助遏制盗版；which接着说明当时盗版主要基于文件上传。played a part保留帮助作用，没有声称Netflix单独完成反盗版或消灭全部共享。\n\n后面的But now报告今日非法流媒体及文件共享造成的损失，是历史之后的变化。不能因为如今盗版又严重，就否认早期合法服务曾起作用；A的过去时与原文时间限定一致。\n\n**出处：**\n\n> Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\n>\n> But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center.","context":{"mode":"image","asset":"questions","focus":[250,862,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"A"},"focusId":"focus-q32-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-A-0\">\u003cblockquote>\n\u003cp>曾在打击非法文件共享中发挥作用\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时的定位线索是：A的 played a part 与第3段helped curb都表示起到帮助作用，所以回看Initially那句，再用后句的file-sharing确认这里谈的文件活动属于盗版。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>Initially标明早期，helped curb说明合法业务兴起曾帮助遏制盗版；which接着说明当时盗版主要基于文件上传。played a part保留帮助作用，没有声称Netflix单独完成反盗版或消灭全部共享。\u003c/p>\n\u003cp>后面的But now报告今日非法流媒体及文件共享造成的损失，是历史之后的变化。不能因为如今盗版又严重，就否认早期合法服务曾起作用；A的过去时与原文时间限定一致。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\u003c/p>\n\u003cp>But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. played a part in the fight against illegal file-sharing","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 像Netflix这样的流媒体公司曾在打击非法文件共享中发挥作用。\n\nA的 played a part 与第3段helped curb都表示起到帮助作用，所以回看Initially那句，再用后句的file-sharing确认这里谈的文件活动属于盗版。\n\nInitially标明早期，helped curb说明合法业务兴起曾帮助遏制盗版；which接着说明当时盗版主要基于文件上传。played a part保留帮助作用，没有声称Netflix单独完成反盗版或消灭全部共享。\n\n后面的But now报告今日非法流媒体及文件共享造成的损失，是历史之后的变化。不能因为如今盗版又严重，就否认早期合法服务曾起作用；A的过去时与原文时间限定一致。","context":{"mode":"image","asset":"questions","focus":[250,862,1800 体造成的经济损害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入32题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>经济损害是全文中心，却不排斥合法业务过去曾有反盗版作用。主旨不能代替时间线，Netflix究竟做过什么、是否因此获益，必须由第3段的具体因果关系判断。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>played a part in the fight against illegal file-sharing\u003cbr>曾在打击非法文件共享中发挥作用\u003c/p>\n\u003c/blockquote>\n\u003cp>后面的But now报告今日非法流媒体及文件共享造成的损失，是历史之后的变化。不能因为如今盗版又严重，就否认早期合法服务曾起作用；A的过去时与原文时间限定一致。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。\u003c/p>\n\u003cp>本项最终仍要根据“helped curb digital piracy”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. reaped benefits from the war with digital pirates","level":3,"raw":"### B. reaped benefits from the war with digital pirates\n\n> 从打击数字盗版的行动中获得了利益\n\n**做题模式中的状态：** 第一轮B保留。当时选项呈现为“[xxx] benefits from the war with digital pirates”，保留了相应遮挡。当时的定位线索是：B的 benefits 说合法公司的收益，第3段的lost revenue则写盗版涉及的经济损失，因此回看合法业务起初遏制盗版与如今收入损失两处，看看能否确定B的收益动作。读完全文后，做题模式再经交叉验证排除B，最终选择A。\n\n**错误类型：第三类——无中生有。**\n\nreaped benefits完整读出后，B是在报告Netflix等公司从反盗版行动中获益。原句却以合法业务的兴起为原因，以盗版受遏制为结果，报告的是公司业务对盗版的作用。\n\n减少盗版可能给合法经营带来好处，但文章没有就这些公司的收益提供收入、用户或成本证据。作用方向不能自动反向推导为获益结论；后文美国经济的损失统计也不能充当Netflix反盗版所得。\n\n**命题人借用的原文材料：**\n\n> Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\n>\n> But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center.","context":{"mode":"image","asset":"questions","focus":[250,949,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"B"},"focusId":"focus-q32-B-0","ht \n\u003cblockquote>\n\u003cp>promised to become big job creators in the US\u003cbr>承诺在美国创造大量就业岗位\u003c/p>\n\u003c/blockquote>\n\u003cp>原文在计算损失，C却安排公司承诺新增就业，主体、动作和方向都换了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：先写合法业务曾遏制盗版，再列当前盗版造成的美国收入、就业和全球经济损失。\u003c/p>\n\u003cp>本项最终仍要根据“helped curb digital piracy”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. used to collaborate with file-uploading platforms","level":3,"raw":"### D. used to collaborate with file-uploading platforms\n\n> 曾与文件上传平台合作\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D的 collaborate 与第3段curb digital piracy构成需要核对的两种动作，因此回看合法公司兴起以后对文件型盗版究竟做了什么。\n\n**错误类型：第一类——歪曲原意。**\n\n原文curb digital piracy把Netflix等合法业务与遏制盗版相连，文件活动属于被遏制的盗版形式。D的collaborate却把这类平台放成合法公司的合作对象。题干所问的合法流媒体，在原句中起的是压低盗版的作用，并非与文件平台共同开展业务；把作用对象改成合作伙伴，关系方向就变了。\n\nD把对盗版的遏制关系换成双方合作，不能作为该句所说明的作用。\n\n**命题人借用的原文材料：**\n\n> Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.","context":{"mode":"image","asset":"questions","focus":[250,1121,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"32","option":"D"},"focusId":"focus-q32-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-D-0\">\u003cblockquote>\n\u003cp>曾与文件上传平台合作\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 collaborate 与第3段curb digital piracy构成需要核对的两种动作，因此回看合法公司兴起以后对文件型盗版究竟做了什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文curb digital piracy把Netflix等合法业务与遏制盗版相连，文件活动属于被遏制的盗版形式。D的collaborate却把这类平台放成合法公司的合作对象。题干所问的合法流媒体，在原句中起的是压低盗版的作用，并非与文件平台共同开展业务；把作用对象改成合作伙伴，关系方向就变了。\u003c/p>\n\u003cp>D把对盗版的遏制关系换成双方合作，不能作为该句所说明的作用。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. used to collaborate with file-uploading platforms","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 像Netflix这样的流媒体公司曾与文件上传平台合作。\n\nD的 collaborate 与第3段curb digital piracy构成需要核对的两种动作，因此回看合法公司兴起以后对文件型盗版究竟做了什么。\n\n原文curb digital piracy把Netflix等合法业务与遏制盗版相连，文件活动属于被遏制的盗版形式。D的collaborate却把这类平台放成合法公司的合作对象。题干所问的合法流媒体，在原句中起的是压低盗版的作用，并非与文件平台共同开展业务；把作用对象改成合作伙伴，关系方向就变了。\n\nD把对盗版的遏制关系换成双方合作，不能作为该句所说明的作用。\n\nInitially限定早期，helped curb限定曾起到遏制作用，which说明当时盗版主要依靠上传文件。But now再交代今日损失，历史贡献与当前盗版加重可以同时成立。\n\n原文遏制的是以文件上传为基础的盗版，合作要求双方共同经营或协作。used to只对上历史时间，collaborate却把对盗版的抑制作用变成合作，无法承接原句的helped curb。","context":{"mode":"image","asset":"questions","focus":[250,1121,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 3题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"32","option":"D"},"focusId":"focus-q32-D-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q32-D-0\">\u003cblockquote>\n\u003cp>曾与文件上传平台合作\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 collaborate 与第3段curb digital piracy构成需要核对的两种动作，因此回看合法公司兴起以后对文件型盗版究竟做了什么。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文curb digital piracy把Netflix等合法业务与遏制盗版相连，文件活动属于被遏制的盗版形式。D的collaborate却把这类平台放成合法公司的合作对象。题干所问的合法流媒体，在原句中起的是压低盗版的作用，并非与文件平台共同开展业务；把作用对象改成合作伙伴，关系方向就变了。\u003c/p>\n\u003cp>D把对盗版的遏制关系换成双方合作，不能作为该句所说明的作用。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection
