<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 21题题干\n\n**The “rehearsal room” approach requires pupils to ______.**\n\n> ‘排练室’教学法要求学生做什么？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[202,190,769,39]],"scrollTarget":"question","meta":{"kind":"stem","qid":"21"},"html":"<h2>21题题干</h2>\n<p><strong>The “rehearsal room” approach requires pupils to ______.</strong></p>\n<blockquote><p>‘排练室’教学法要求学生做什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 22题题干\n\n**The study divided the pupils into two groups to find whether ______.**\n\n> 研究把学生分为两组，是为了查明什么？\n\n题型：**目的推断题**。","articleRects":[],"questionRects":[[202,568,933,39],[1138,604,113,7]],"scrollTarget":"question","meta":{"kind":"stem","qid":"22"},"html":"<h2>22题题干</h2>\n<p><strong>The study divided the pupils into two groups to find whether ______.</strong></p>\n<blockquote><p>研究把学生分为两组，是为了查明什么？</p>\n</blockquote>\n<p>题型：<strong>目的推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 23题题干\n\n**Control pupils’ reliance on “desert island clichés” shows their ______.**\n\n> 对照组学生依赖‘荒岛陈词滥调’，显示出他们的什么特点？\n\n题型：**例子作用题**。","articleRects":[],"questionRects":[[202,945,951,40]],"scrollTarget":"question","meta":{"kind":"stem","qid":"23"},"html":"<h2>23题题干</h2>\n<p><strong>Control pupils’ reliance on “desert island clichés” shows their ______.</strong></p>\n<blockquote><p>对照组学生依赖‘荒岛陈词滥调’，显示出他们的什么特点？</p>\n</blockquote>\n<p>题型：<strong>例子作用题</strong>。</p>\n"},{"section":"先读题干","raw":"## 24题题干\n\n**What can promote children’s emotional literacy according to O’Hanlon?**\n\n> 按照奥汉隆的说法，什么能够提升儿童的情感素养？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[202,1324,1103,39]],"scrollTarget":"question","meta":{"kind":"stem","qid":"24"},"html":"<h2>24题题干</h2>\n<p><strong>What can promote children’s emotional literacy according to O’Hanlon?</strong></p>\n<blockquote><p>按照奥汉隆的说法，什么能够提升儿童的情感素养？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 25题题干\n\n**It can be inferred from the last paragraph that ______.**\n\n> 从最后一段可以推断出什么？\n\n题型：**推断题**。","articleRects":[],"questionRects":[[202,1702,712,39]],"scrollTarget":"question","meta":{"kind":"stem","qid":"25"},"html":"<h2>25题题干</h2>\n<p><strong>It can be inferred from the last paragraph that ______.</strong></p>\n<blockquote><p>从最后一段可以推断出什么？</p>\n</blockquote>\n<p>题型：<strong>推断题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, only if, as well as |\n| 态度词／评价词 | 先抓个大概好坏 | comfortable, hopeful, importance |\n| 动作词 | 先看谁做了什么 | act, write, imagine |\n| 结果词 | 看最后出了什么事 | broadened, difference, expansion |\n| 重复主题词 | 大概知道老在说什么 | children, Shakespeare, writing |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, only if, as well as</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>comfortable, hopeful, importance</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>act, write, imagine</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>broadened, difference, expansion</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>children, Shakespeare, writing</td></tr></tbody></table>\n"},{"section":"读文章","raw":"The grammar school boy from Stratford-upon-Avon has landed a **[xxx]** punch after **[xxx]** research showed that Shakespeare does benefit children’s literacy and emotional development. But only if you act him out.","articleRects":[[282,255,1140,38],[227,302,1196,39],[227,349,1090,39]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>The grammar school boy from Stratford-upon-Avon has landed a <strong>[xxx]</strong> punch after <strong>[xxx]</strong> research showed that Shakespeare does benefit children’s literacy and emotional development. But only if you act him out.</p>\n</div></div>"},{"section":"读文章","raw":"The grammar school boy from Stratford-upon-Avon has landed a **[xxx]** punch after **[xxx]** research showed that Shakespeare does benefit children’s literacy and emotional development. / But only if you act him out.","articleRects":[[282,255,1140,38],[227,302,1196,39],[227,349,1090,39]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>The grammar school boy from Stratford-upon-Avon has landed a <strong>[xxx]</strong> punch after <strong>[xxx]</strong> research showed that Shakespeare does benefit children’s literacy and emotional development. / But only if you act him out.</p>\n</div></div>"},{"section":"读文章","raw":"那个文法学校男孩 来自埃文河畔斯特拉特福 has landed a **[xxx]** punch after **[xxx]** research showed that Shakespeare 确实有益于儿童读写能力 以及情感发展. / But only if you act him out.","articleRects":[[282,2
