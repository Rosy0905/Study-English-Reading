? / O’Hanlon said 需要更多研究 but suggested that Shakespeare’s use of 20,000 words, / compared with the everyday 2,000 words, / gave a “语言的大幅拓展 into children’s lives”, / which was combined with children “运用他们的整个身体 让文字活起来”.</p>\n</div></div>"},{"section":"读文章","raw":"7、能否重现这些结果、需要更多研究、语言的大幅拓展、运用他们的整个身体、让文字活起来。","articleRects":[[283,1771,1139,39],[227,1819,1195,39],[227,1866,1198,39],[227,1913,1196,40],[227,1961,532,39]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":6,"form":3,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[6]},"contextRaw":"1、那个文法学校男孩、来自埃文河畔斯特拉特福、确实有益于儿童读写能力、以及情感发展。\n\n2、一项研究发现、一种排练室教学法、拓展了儿童词汇量、产生很大影响。\n\n3、数百名5年级、45所公立小学、目标组与对照组、一项30分钟戏剧活动。\n\n4、更丰富的词汇、而且写得更长、表达那个人物的情感。\n\n5、对照组学生依赖、更广阔的画面、有关天空的。\n\n6、奥汉隆说、更满怀希望、对情感的理解、非常明显、描写不同的情感状态、设身处地。","html":"<div class=\"coarseStack\"><div class=\"coarseDone\"><p>1、那个文法学校男孩、来自埃文河畔斯特拉特福、确实有益于儿童读写能力、以及情感发展。</p>\n</div><div class=\"coarseDone\"><p>2、一项研究发现、一种排练室教学法、拓展了儿童词汇量、产生很大影响。</p>\n</div><div class=\"coarseDone\"><p>3、数百名5年级、45所公立小学、目标组与对照组、一项30分钟戏剧活动。</p>\n</div><div class=\"coarseDone\"><p>4、更丰富的词汇、而且写得更长、表达那个人物的情感。</p>\n</div><div class=\"coarseDone\"><p>5、对照组学生依赖、更广阔的画面、有关天空的。</p>\n</div><div class=\"coarseDone\"><p>6、奥汉隆说、更满怀希望、对情感的理解、非常明显、描写不同的情感状态、设身处地。</p>\n</div><div class=\"currentFocus\"><p>7、能否重现这些结果、需要更多研究、语言的大幅拓展、运用他们的整个身体、让文字活起来。</p>\n</div></div>"},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到那个文法学校男孩、来自埃文河畔斯特拉特福、确实有益于儿童读写能力、以及情感发展；中间又出现一项研究发现、一种排练室教学法、拓展了儿童词汇量、产生很大影响；数百名5年级、45所公立小学、目标组与对照组、一项30分钟戏剧活动；更丰富的词汇、而且写得更长、而且写得更长、表达那个人物的情感；对照组学生依赖、更广阔的画面、更广阔的画面、有关天空的；奥汉隆说、更满怀希望、描写不同的情感状态、设身处地；结尾还有能否重现这些结果、需要更多研究、运用他们的整个身体、让文字活起来。\n\n到这里还不能自然地说清楚：两组学生分别做了什么，写作与情感理解有什么关系，结尾为什么又问到其他剧作家。先留下松散印象和大致位置，具体关系等题目问到时再查。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到那个文法学校男孩、来自埃文河畔斯特拉特福、确实有益于儿童读写能力、以及情感发展；中间又出现一项研究发现、一种排练室教学法、拓展了儿童词汇量、产生很大影响；数百名5年级、45所公立小学、目标组与对照组、一项30分钟戏剧活动；更丰富的词汇、而且写得更长、而且写得更长、表达那个人物的情感；对照组学生依赖、更广阔的画面、更广阔的画面、有关天空的；奥汉隆说、更满怀希望、描写不同的情感状态、设身处地；结尾还有能否重现这些结果、需要更多研究、运用他们的整个身体、让文字活起来。</p>\n<p>到这里还不能自然地说清楚：两组学生分别做了什么，写作与情感理解有什么关系，结尾为什么又问到其他剧作家。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"21题","raw":"## 21题\n\n> The “rehearsal room” approach requires pupils to ______.  \n> ‘排练室’教学法要求学生做什么？\n\n题干直接给出‘rehearsal room’ approach。第2段开头有同样的教学法名称，后面又解释演员的工作方式对儿童的影响，先把第2段完整读完。\n\n> 原文参考：\n> \n> A study found that a “rehearsal room” approach to teaching Shakespeare broadened children’s vocabulary and the **[xxx]** of their writing as well as their emotional literacy. “The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,” Jacqui O’Hanlon of the Royal Shakespeare Company (RSC), which **[xxx]** the study, said.\n> \n> 开始精读：\n> \n> A study found / that a “rehearsal room” approach to teaching Shakespeare / broadened children’s vocabulary / and the **[xxx]** of their writing / as well as their emotional literacy. / “The research shows / that the way actors work makes a big difference / to the way children use language / and also how they think about themselves,” / Jacqui O’Hanlon of the Royal Shakespeare Company (RSC), / which **[xxx]** the study, / said.\n> \n> 一项研究发现 / 一种教授莎士比亚作品的‘排练室’教学法 / 拓展了儿童的词汇量 / 以及他们写作的**[xxx]** / 还有他们的情感素养。 / ‘研究表明 / 演员的工作方式产生了很大的影响 / 影响了儿童使用语言的方式 / 也影响了他们如何看待自己，’ / 皇家莎士比亚剧团的雅基·奥汉隆 / 该剧团**[xxx]**了这项研究， / 这样说道。\n\n题干问requires pupils to，空格应补学生使用这种教学法时要做的事。第2段把这项教学法与the way actors work联系起来，要核对的是学生参与的具体做法，不能只把词汇或情感方面的效果填进去。\n\n接下来按A—D逐项看。","articleRects":[[283,396,1139,40],[227,444,1195,39],[228,491,1195,39],[228,539,1195,39],[227,586,1195,39],[227,634,436,39]],"questionRects":[[202,190,769,39],[257,253,548,39],[257,316,521,39],[257,379,466,39],[257,442,488,39]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"21","initialReadingPids":[1]},"html":"<h2>21题</h2>\n<blockquote><p>The “rehearsal room” approach requires pupils to ______.<br />\n‘排练室’教学法要求学生做什么？</p>\n</blockquote>\n<p>题干直接给出‘rehearsal room’ approach。第2段开头有同样的教学法名称，后面又解释演员的工作方式对儿童的影响，先把第2段完整读完。</p>\n<blockquote><p>原文参考：</p>\n<p>A study found that a “rehearsal room” approach to teaching Shakespeare broadened children’s vocabulary and the <strong>[xxx]</strong> of their writing as well as their emotional literacy. “The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,” Jacqui O’Hanlon of the Royal Shakespeare Company (RSC), which <strong>[xxx]</strong> the study, said.</p>\n<p>开始精读：</p>\n<p>A study found / that a “rehearsal room” approach to teaching Shakespeare / broadened children’s vocabulary / and the <strong>[xxx]</strong> of their writing / as well as their emotional literacy. / “The research shows / that the way actors work makes a big difference / to the way children use language / and also how they think about themselves,” / Jacqui O’Hanlon of the Royal Shakespeare Company (RSC), / which <strong>[xxx]</strong> the study, / said.</p>\n<p>一项研究发现 / 一种教授莎士比亚作品的‘排练室’教学法 / 拓展了儿童的词汇量 / 以及他们写作的<strong>[xxx]</strong> / 还有他们的情感素养。 / ‘研究表明 / 演员的工作方式产生了很大的影响 / 影响了儿童使用语言的方式 / 也影响了他们如何看待自己，’ / 皇家莎士比亚剧团的雅基·奥汉隆 / 该剧团<strong>[xxx]</strong>了这项研究， / 这样说道。</p>\n</blockquote>\n<p>题干问requires pupils to，空格应补学生使用这种教学法时要做的事。第2段把这项教学法与the way actors work联系起来，要核对的是学生参与的具体做法，不能只把词汇或情感方面的效果填进去。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"21题","raw":"### A. rewrite the **[xxx]** from Shakespeare\n\n> 改写莎士比亚作品中的**[xxx]**\n\n把A接回题干，它说的是：‘排练室’教学法要求学生改写莎士比亚作品中的**[xxx]**。\n\nA说改写莎士比亚的[xxx]，回第3段看学生要写什么、活动怎样安排。\n\n> 原文参考：\n> \n> The **[xxx]** control trial involved hundreds of year 5 pupils—aged nine and ten—at 45 state primary schools that had not been “previously exposed to RSC **[xxx]**”. They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the **[xxx]** in The Tempest. The target group was given a 30-minute drama-based activity to **[xxx]** the passage.\n> \n> 开始精读：\n> \n> The **[xxx]** control trial involved hundreds of year 5 pupils—aged nine and ten—at 45 state primary schools / that had not been “previously exposed to RSC **[xxx]**”. / They were split into target and control groups / and asked to write, for example, / a message in a bottle as Ferdinand / after the **[xxx]** in The Tempest. / The target group was given a 30-minute drama-based activity / to **[xxx]** the passage.\n> \n> 这项**[xxx]**对照试验涉及45所公立小学的数百名5年级学生，年龄为九岁和十岁 / 这些学校此前未曾‘接触过皇家莎士比亚剧团的**[xxx]**’。 / 他们被分为目标组和对照组 / 并被要求写作，例如 / 以费迪南德的身份写一封漂流瓶中的信 / 在《暴风雨》中的**[xxx]**之后。 / 目标组获得了一项时长30分钟的戏剧活动 / 来**[xxx]**这个选段。\n\n> the way actors work makes a big difference to the way children use language\n\n> asked to write, for example, a message in a bottle as Ferdinand after the **[xxx]** in The Tempest.\n\n> The target group was given a 30-minute drama-based activity to **[xxx]** the passage.\n\n学生被要求以Ferdinand的身份写瓶中信，目标组还先参加30分钟戏剧活动。活动怎样处理passage的那个词不认识，A中改写的对象也不认识。\n\n看到写作任务，rewrite确实可能让我们联想到把作品内容重新写出来，但眼下还没读清这是不是排练法最主要的要求。\n\n**目前已经看清活动只要求改写，或绝不涉及改写了吗？**\n\n都还没有。先把A留下，继续看后文怎样解释学生的参与方式。\n\n**第一轮判断：A保留。**","articleRects":[[283,396,1139,40],[227,444,1195,39],[228,491,1195,39],[228,539,1195,39],[227,586,1195,39],[227,634,436,39],[282,682,1140,38],[228,728,1194,39],[227,776,1195,39],[227,824,1195,38],[229,870,1193,40],[228,919,349,38]],"questionRects":[[257,253,548,39]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"21","initialReadingPids":[2],"paragraphPids":[1,2]},"html":"<h3>A. rewrite the <strong>[xxx]</strong> from Shakespeare</h3>\n<blockquote><p>改写莎士比亚作品中的<strong>[xxx]</strong></p>\n</blockquote>\n<p>把A接回题干，它说的是：‘排练室’教学法要求学生改写莎士比亚作品中的<strong>[xxx]</strong>。</p>\n<p>A说改写莎士比亚的[xxx]，回第3段看学生要写什么、活动怎样安排。</p>\n<blockquote><p>原文参考：</p>\n<p>The <strong>[xxx]</strong> control trial involved hundreds of year 5 pupils—aged nine and ten—at 45 state primary schools that had not been “previously exposed to RSC <strong>[xxx]</strong>”. They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the <strong>[xxx]</strong> in The Tempest. The target group was given a 30-minute drama-based activity to <strong>[xxx]</strong> the passage.</p>\n<p>开始精读：</p>\n<p>The <strong>[xxx]</strong> control trial involved hundreds of year 5 pupils—aged nine and ten—at 45 state primary schools / that had not been “previously exposed to RSC <strong>[xxx]</strong>”. / They were split into target and control groups / and asked to write, for example, / a message in a bottle as Ferdinand / after the <strong>[xxx]</strong> in The Tempest. / The target group was given a 30-minute drama-based activity / to <strong>[xxx]</strong> the passage.</p>\n<p>这项<strong>[xxx]</strong>对照试验涉及45所公立小学的数百名5年级学生，年龄为九岁和十岁 / 这些学校此前未曾‘接触过皇家莎士比亚剧团的<strong>[xxx]</strong>’。 / 他们被分为目标组和对照组 / 并被要求写作，例如 / 以费迪南德的身份写一封漂流瓶中的信 / 在《暴风雨》中的<strong>[xxx]</strong>之后。 / 目标组获得了一项时长30分钟的戏剧活动 / 来<strong>[xxx]</strong>这个选段。</p>\n</blockquote>\n<blockquote><p>the way actors work makes a big difference to the way children use language</p>\n</blockquote>\n<blockquote><p>asked to write, for example, a message in a bottle as Ferdinand after the <strong>[xxx]</strong> in The Tempest.</p>\n</blockquote>\n<blockquote><p>The target group was given a 30-minute drama-based activity to <strong>[xxx]</strong> the passage.</p>\n</blockquote>\n<p>学生被要求以Ferdinand的身份写瓶中信，目标组还先参加30分钟戏剧活动。活动怎样处理passage的那个词不认识，A中改写的对象也不认识。</p>\n<p>看到写作任务，rewrite确实可能让我们联想到把作品内容重新写出来，但眼下还没读清这是不是排练法最主要的要求。</p>\n<p><strong>目前已经看清活动只要求改写，或绝不涉及改写了吗？</strong></p>\n<p>都还没有。先把A留下，继续看后文怎样解释学生的参与方式。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"21题","raw":"### B. watch RSC actors’ performances\n\n> 观看皇家莎士比亚剧团演员的表演\n\n把B接回题干，它说的是：‘排练室’教学法要求学生观看皇家莎士比亚剧团演员的表演。\n\nB说观看演员演出，回第1段看act him out，再看第2段the way actors work。\n\n> 原文参考：\n> \n> The grammar school boy from Stratford-upon-Avon has landed a **[xxx]** punch after **[xxx]** research showed that Shakespeare does benefit children’s literacy and emotional development. But only if you act him out.\n> \n> 开始精读：\n> \n> The grammar school boy from Stratford-upon-Avon / has landed a **[xxx]** punch / after **[xxx]** research showed / that Shakespeare does benefit children’s literacy and emotional development. / But only if you act him out.\n> \n> 那个来自埃文河畔斯特拉特福的文法学校男孩 / 打出了一记**[xxx]**的拳 / 此前**[xxx]**研究表明 / 莎士比亚确实有益于儿童的读写能力和情感发展。 / 但前提是把他的作品演出来。\n\n> the way actors work makes a big difference to the way children use language and also how they think about themselves\n\n> But only if you act him out.\n\n第1段的条件是把莎士比亚演出来，第2段借演员工作的方式说明孩子如何使用语言。孩子要自己参与这种做法。\n\nB把孩子放到了观众的位置，只观看RSC演员演出，少了自己做这一步。\n\n**孩子是在看别人演，还是要自己把作品演出来？**\n\n原文要求自己演。B换成了被动观看。\n\n**第一轮判断：B排除。**","articleRects":[[282,255,1140,38],[227,302,1196,39],[227,349,1090,39],[283,396,1139,40],[227,444,1195,39],[228,491,1195,39],[228,539,1195,39],[227,586,1195,39],[227,634,436,39]],"questionRects":[[257,316,521,39]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"21","initialReadingPids":[0],"paragraphPids":[0,1]},"html":"<h3>B. watch RSC actors’ performances</h3>\n<blockquote><p>观看皇家莎士比亚剧团演员的表演</p>\n</blockquote>\n<p>把B接回题干，它说的是：‘排练室’教学法要求学生观看皇家莎士比亚剧团演员的表演。</p>\n<p>B说观看演员演出，回第1段看act him out，再看第2段the way actors work。</p>\n<blockquote><p>原文参考：</p>\n<p>The grammar school boy from Stratford-upon-Avon has landed a <strong>[xxx]</strong> punch after <strong>[xxx]</strong> research showed that Shakespeare does benefit children’s literacy and emotional development. But only if you act him out.</p>\n<p>开始精读：</p>\n<p>The grammar school boy from Stratford-upon-Avon / has landed a <strong>[xxx]</strong> punch / after <strong>[xxx]</strong> research showed / that Shakespeare does benefit children’s literacy and emotional development. / But only if you act him out.</p>\n<p>那个来自埃文河畔斯特拉特福的文法学校男孩 / 打出了一记<strong>[xxx]</strong>的拳 / 此前<strong>[xxx]</strong>研究表明 / 莎士比亚确实有益于儿童的读写能力和情感发展。 / 但前提是把他的作品演出来。</p>\n</blockquote>\n<blockquote><p>the way actors work makes a big difference to the way children use language and also how they think about themselves</p>\n</blockquote>\n<blockquote><p>But only if you act him out.</p>\n</blockquote>\n<p>第1段的条件是把莎士比亚演出来，第2段借演员工作的方式说明孩子如何使用语言。孩子要自己参与这种做法。</p>\n<p>B把孩子放到了观众的位置，只观看RSC演员演出，少了自己做这一步。</p>\n<p><strong>孩子是在看别人演，还是要自己把作品演出来？</strong></p>\n<p>原文要求自己演。B换成了被动观看。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"21题","raw":"### C. play the roles in Shakespeare\n\n> 扮演莎士比亚作品中的角色\n\n把C接回题干，它说的是：‘排练室’教学法要求学生扮演莎士比亚作品中的角色。\n\nC说扮演角色，回第1段的act him out和第3段的as Ferdinand。\n\n> But only if you act him out.\n\n> asked to write, for example, a message in a bottle as Ferdinand after the **[xxx]** in The Tempest.\n\nact him out直接把方法指向表演，as Ferdinand又要求学生以文学人物的身份完成任务。目标组增加的是戏剧活动。\n\n把这些连起来，学生不是始终以自己的身份读文字，而是进入作品人物来行动和表达。\n\n**自己演出来、以Ferdinand的身份参与，是否能支持扮演角色？**\n\n能。C与已知的动作和身份都能对应，先保留。\n\n**第一轮判断：C保留。**","articleRects":[[282,255,1140,38],[227,302,1196,39],[227,349,1090,39],[282,682,1140,38],[228,728,1194,39],[227,776,1195,39],[227,824,1195,38],[229,870,1193,40],[228,919,349,38]],"questionRects":[[257,379,466,39]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"21","paragraphPids":[0,2]},"html":"<h3>C. play the roles in Shakespeare</h3>\n<blockquote><p>扮演莎士比亚作品中的角色</p>\n</blockquote>\n<p>把C接回题干，它说的是：‘排练室’教学法要求学生扮演莎士比亚作品中的角色。</p>\n<p>C说扮演角色，回第1段的act him out和第3段的as Ferdinand。</p>\n<blockquote><p>But only if you act him out.</p>\n</blockquote>\n<blockquote><p>asked to write, for example, a message in a bottle as Ferdinand after the <strong>[xxx]</strong> in The Tempest.</p>\n</blockquote>\n<p>act him out直接把方法指向表演，as Ferdinand又要求学生以文学人物的身份完成任务。目标组增加的是戏剧活动。</p>\n<p>把这些连起来，学生不是始终以自己的身份读文字，而是进入作品人物来行动和表达。</p>\n<p><strong>自己演出来、以Ferdinand的身份参与，是否能支持扮演角色？</strong></p>\n<p>能。C与已知的动作和身份都能对应，先保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"21题","raw":"### D. study drama under RSC artists\n\n> 在皇家莎士比亚剧团艺术家的指导下学习戏剧\n\n把D接回题干，它说的是：‘排练室’教学法要求学生在皇家莎士比亚剧团艺术家的指导下学习戏剧。\n\nD说由RSC艺术家指导，回第2段看剧团和发言人怎样出现。\n\n> the way actors work makes a big difference to the way children use language\n\n> Jacqui O’Hanlon of the Royal Shakespeare Company (RSC), which **[xxx]** the study, said.\n\nO’Hanlon来自RSC，介绍研究发现，句中还说明RSC与研究的关系。the way actors work讲的是采用演员式的方法。\n\n采用一种方法，并不自动要求孩子必须拜到该剧团艺术家门下。文中没有在这里规定课堂由哪些人亲自授课。\n\n**研究涉及RSC，就能把教学要求改成由RSC艺术家直接指导吗？**\n\n不能。D把机构参与研究换成了指定授课人员。\n\n**第一轮判断：D排除。**","articleRects":[[283,396,1139,40],[227,444,1195,39],[228,491,1195,39],[228,539,1195,39],[227,586,1195,39],[227,634,436,39]],"questionRects":[[257,442,488,39]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"21","paragraphPids":[1]},"html":"<h3>D. study drama under RSC artists</h3>\n<blockquote><p>在皇家莎士比亚剧团艺术家的指导下学习戏剧</p>\n</blockquote>\n<p>把D接回题干，它说的是：‘排练室’教学法要求学生在皇家莎士比亚剧团艺术家的指导下学习戏剧。</p>\n<p>D说由RSC艺术家指导，回第2段看剧团和发言人怎样出现。</p>\n<blockquote><p>the way actors work makes a big difference to the way children use language</p>\n</blockquote>\n<blockquote><p>Jacqui O’Hanlon of the Royal Shakespeare Company (RSC), which <strong>[xxx]</strong> the study, said.</p>\n</blockquote>\n<p>O’Hanlon来自RSC，介绍研究发现，句中还说明RSC与研究的关系。the way actors work讲的是采用演员式的方法。</p>\n<p>采用一种方法，并不自动要求孩子必须拜到该剧团艺术家门下。文中没有在这里规定课堂由哪些人亲自授课。</p>\n<p><strong>研究涉及RSC，就能把教学要求改成由RSC艺术家直接指导吗？</strong></p>\n<p>不能。D把机构参与研究换成了指定授课人员。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"21题","raw":"### 21题第一次结果\n\n- A保留。\n- B排除。\n- C保留。\n- D排除。\n\n暂时保留：A、C。\n\n第一遍留下A、C。A中改写的对象与戏剧活动对选段的具体要求还没有读清；C得到演出作品和以人物身份写作的支持。","articleRects":[],"questionRects":[[202,190,769,39],[257,253,548,39],[257,316,521,39],[257,379,466,39],[257,442,488,39]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"21"},"html":"<h3>21题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂时保留：A、C。</p>\n<p>第一遍留下A、C。A中改写的对象与戏剧活动对选段的具体要求还没有读清；C得到演出作品和以人物身份写作的支持。</p>\n"},{"section":"22题","raw":"## 22题\n\n> The study divided the pupils into two groups to find whether ______.  \n> 研究把学生分为两组，是为了查明什么？\n\n题干的divided the pupils into two groups直接对应第3段的split into target and control groups。第3段给出分组后学生分别经历的活动，第4段紧接着报告结果；要理解分组所检验的事情，需要把这两段完整读完。\n\n> 原文参考：\n> \n> The **[xxx]** results showed that the target group of pupils **[xxx]** on a wider vocabulary, used words “classed as more **[xxx]** or rarer”, and wrote at greater length. They also “appear to be more comfortable writing in role...while [control] group imagine how they themselves would react to being shipwrecked, [target] group put themselves in the shoes of a literary character and express that character’s emotion”.\n> \n> 开始精读：\n> \n> The **[xxx]** results showed / that the target group of pupils **[xxx]** on a wider vocabulary, / used words “classed as more **[xxx]** or rarer”, / and wrote at greater length. / They also “appear to be more comfortable writing in role...while [control] group imagine / how they themselves would react to being shipwrecked, / [target] group put themselves in the shoes of a literary character / and express that character’s emotion”.\n> \n> **[xxx]**的结果表明 / 目标组学生在更丰富的词汇上**[xxx]** / 使用了‘被归类为更**[xxx]**或更罕见的’词 / 而且写得更长。 / 他们还‘似乎更自如地以角色身份写作……（对照）组想象 / 他们自己遭遇船难会如何反应 / 而（目标）组设身处地地站在文学人物的立场 / 并表达那个人物的情感’。\n\n题干问分组的研究目的，要把第3段两组的安排与第4段实际比较的结果连起来，核对空格是否说清研究要检验的关系。\n\n接下来按A—D逐项看。","articleRects":[[282,966,1141,38],[228,1013,1194,39],[228,1060,1194,39],[230,1108,1192,39],[230,1152,1193,46],[227,1202,313,32]],"questionRects":[[202,568,933,39],[1138,604,113,7],[257,631,818,39],[257,694,807,39],[257,757,815,39],[257,820,785,39]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"22","initialReadingPids":[3]},"html":"<h2>22题</h2>\n<blockquote><p>The study divided the pupils into two groups to find whether ______.<br />\n研究把学生分为两组，是为了查明什么？</p>\n</blockquote>\n<p>题干的divided the pupils into two groups直接对应第3段的split into target and control groups。第3段给出分组后学生分别经历的活动，第4段紧接着报告结果；要理解分组所检验的事情，需要把这两段完整读完。</p>\n<blockquote><p>原文参考：</p>\n<p>The <strong>[xxx]</strong> results showed that the target group of pupils <strong>[xxx]</strong> on a wider vocabulary, used words “classed as more <strong>[xxx]</strong> or rarer”, and wrote at greater length. They also “appear to be more comfortable writing in role...while [control] group imagine how they themselves would react to being shipwrecked, [target] group put themselves in the shoes of a literary character and express that character’s emotion”.</p>\n<p>开始精读：</p>\n<p>The <strong>[xxx]</strong> results showed / that the target group of pupils <strong>[xxx]</strong> on a wider vocabulary, / used words “classed as more <strong>[xxx]</strong> or rarer”, / and wrote at greater length. / They also “appear to be more comfortable writing in role...while [control] group imagine / how they themselves would react to being shipwrecked, / [target] group put themselves in the shoes of a literary character / and express that character’s emotion”.</p>\n<p><strong>[xxx]</strong>的结果表明 / 目标组学生在更丰富的词汇上<strong>[xxx]</strong> / 使用了‘被归类为更<strong>[xxx]</strong>或更罕见的’词 / 而且写得更长。 / 他们还‘似乎更自如地以角色身份写作……（对照）组想象 / 他们自己遭遇船难会如何反应 / 而（目标）组设身处地地站在文学人物的立场 / 并表达那个人物的情感’。</p>\n</blockquote>\n<p>题干问分组的研究目的，要把第3段两组的安排与第4段实际比较的结果连起来，核对空格是否说清研究要检验的关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"22题","raw":"### A. the change in instruction enhances learning outcomes\n\n> 教学方式的变化是否改善学习效果\n\n把A接回题干，它说的是：研究把学生分为两组，是为了查明教学方式的变化是否改善学习效果。\n\nA说教学变化能否改善学习，回第3段比较两组接受的安排，再接第4段结果。\n\n> They were split into target and control groups\n\n> The target group was given a 30-minute drama-based activity to **[xxx]** the passage.\n\n> used words “classed as more **[xxx]** or rarer”, and wrote at greater length.\n\n> [target] group put themselves in the shoes of a literary character and express that character’s emotion\n\n两组都有写作任务，目标组另外得到30分钟戏剧活动。接着研究比较词汇范围、写作长度和能否进入人物立场。\n\n先改变教学活动，再观察写作等表现有何不同，这正是在看教学方法的变化是否有助于学习。\n\n**分组中改变的是活动方式，随后比较的是学习表现吗？**\n\n是。A同时接住研究安排与结果，可以保留。\n\n**第一轮判断：A保留。**","articleRects":[[282,682,1140,38],[228,728,1194,39],[227,776,1195,39],[227,824,1195,38],[229,870,1193,40],[228,919,349,38],[282,966,1141,38],[228,1013,1194,39],[228,1060,1194,39],[230,1108,1192,39],[230,1152,1193,46],[227,1202,313,32]],"questionRects":[[257,631,818,39]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"22","paragraphPids":[2,3]},"html":"<h3>A. the change in instruction enhances learning outcomes</h3>\n<blockquote><p>教学方式的变化是否改善学习效果</p>\n</blockquote>\n<p>把A接回题干，它说的是：研究把学生分为两组，是为了查明教学方式的变化是否改善学习效果。</p>\n<p>A说教学变化能否改善学习，回第3段比较两组接受的安排，再接第4段结果。</p>\n<blockquote><p>They were split into target and control groups</p>\n</blockquote>\n<blockquote><p>The target group was given a 30-minute drama-based activity to <strong>[xxx]</strong> the passage.</p>\n</blockquote>\n<blockquote><p>used words “classed as more <strong>[xxx]</strong> or rarer”, and wrote at greater length.</p>\n</blockquote>\n<blockquote><p>[target] group put themselves in the shoes of a literary character and express that character’s emotion</p>\n</blockquote>\n<p>两组都有写作任务，目标组另外得到30分钟戏剧活动。接着研究比较词汇范围、写作长度和能否进入人物立场。</p>\n<p>先改变教学活动，再观察写作等表现有何不同，这正是在看教学方法的变化是否有助于学习。</p>\n<p><strong>分组中改变的是活动方式，随后比较的是学习表现吗？</strong></p>\n<p>是。A同时接住研究安排与结果，可以保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"22题","raw":"### B. expanding vocabulary helps develop reading **[xxx]**\n\n> 扩大词汇量是否有助于发展阅读**[xxx]**\n\n把B接回题干，它说的是：研究把学生分为两组，是为了查明扩大词汇量是否有助于发展阅读**[xxx]**。\n\nB说扩大词汇促进阅读[xxx]，回第3、4段看哪项是先安排的、哪项是后来测出的。\n\n> asked to write, for example, a message in a bottle as Ferdinand\n\n> The target group was given a 30-minute drama-based activity to **[xxx]** the passage.\n\n> the target group of pupils **[xxx]** on a wider vocabulary, used words “classed as more **[xxx]** or rarer”, and wrote at greater length.\n\n研究先给目标组增加戏剧活动，之后发现这一组词汇更广。词汇扩大是观察到的结果，不是分组前专门给一组实施的训练。\n\nB即使有词不认识，已知主干仍把词汇扩大当作原因，再去测阅读。文中这项实验没有这样安排。\n\n**实验是先扩大一组的词汇量，再比较阅读吗？**\n\n不是。它先改变戏剧教学活动，再看语言与写作结果，B颠换了安排。\n\n**第一轮判断：B排除。**","articleRects":[[282,682,1140,38],[228,728,1194,39],[227,776,1195,39],[227,824,1195,38],[229,870,1193,40],[228,919,349,38],[282,966,1141,38],[228,1013,1194,39],[228,1060,1194,39],[230,1108,1192,39],[230,1152,1193,46],[227,1202,313,32]],"questionRects":[[257,694,807,39]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"22","paragraphPids":[2,3]},"html":"<h3>B. expanding vocabulary helps develop reading <strong>[xxx]</strong></h3>\n<blockquote><p>扩大词汇量是否有助于发展阅读<strong>[xxx]</strong></p>\n</blockquote>\n<p>把B接回题干，它说的是：研究把学生分为两组，是为了查明扩大词汇量是否有助于发展阅读<strong>[xxx]</strong>。</p>\n<p>B说扩大词汇促进阅读[xxx]，回第3、4段看哪项是先安排的、哪项是后来测出的。</p>\n<blockquote><p>asked to write, for example, a message in a bottle as Ferdinand</p>\n</blockquote>\n<blockquote><p>The target group was given a 30-minute drama-based activity to <strong>[xxx]</strong> the passage.</p>\n</blockquote>\n<blockquote><p>the target group of pupils <strong>[xxx]</strong> on a wider vocabulary, used words “classed as more <strong>[xxx]</strong> or rarer”, and wrote at greater length.</p>\n</blockquote>\n<p>研究先给目标组增加戏剧活动，之后发现这一组词汇更广。词汇扩大是观察到的结果，不是分组前专门给一组实施的训练。</p>\n<p>B即使有词不认识，已知主干仍把词汇扩大当作原因，再去测阅读。文中这项实验没有这样安排。</p>\n<p><strong>实验是先扩大一组的词汇量，再比较阅读吗？</strong></p>\n<p>不是。它先改变戏剧教学活动，再看语言与写作结果，B颠换了安排。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"22题","raw":"### C. emotion affects understanding of sophisticated works\n\n> 情绪是否影响对复杂作品的理解\n\n把C接回题干，它说的是：研究把学生分为两组，是为了查明情绪是否影响对复杂作品的理解。\n\nC说情绪影响理解作品，回第3段看两组是否被安排不同情绪。\n\n> The target group was given a 30-minute drama-based activity to **[xxx]** the passage.\n\n> [target] group put themselves in the shoes of a literary character and express that character’s emotion\n\n实验区分的是有没有戏剧活动，不是先让一组高兴、另一组悲伤。后面才观察学生是否能表达人物情感。\n\n情感理解在这里是教学后的表现，C却把情绪放到前面当影响作品理解的原因。\n\n**研究先改变学生情绪，再测他们理解复杂作品了吗？**\n\n没有。C把观察到的情感表现换成了实验的起点。\n\n**第一轮判断：C排除。**","articleRects":[[282,682,1140,38],[228,728,1194,39],[227,776,1195,39],[227,824,1195,38],[229,870,1193,40],[228,919,349,38],[282,966,1141,38],[228,1013,1194,39],[228,1060,1194,39],[230,1108,1192,39],[230,1152,1193,46],[227,1202,313,32]],"questionRects":[[257,757,815,39]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"22","paragraphPids":[2,3]},"html":"<h3>C. emotion affects understanding of sophisticated works</h3>\n<blockquote><p>情绪是否影响对复杂作品的理解</p>\n</blockquote>\n<p>把C接回题干，它说的是：研究把学生分为两组，是为了查明情绪是否影响对复杂作品的理解。</p>\n<p>C说情绪影响理解作品，回第3段看两组是否被安排不同情绪。</p>\n<blockquote><p>The target group was given a 30-minute drama-based activity to <strong>[xxx]</strong> the passage.</p>\n</blockquote>\n<blockquote><p>[target] group put themselves in the shoes of a literary character and express that character’s emotion</p>\n</blockquote>\n<p>实验区分的是有没有戏剧活动，不是先让一组高兴、另一组悲伤。后面才观察学生是否能表达人物情感。</p>\n<p>情感理解在这里是教学后的表现，C却把情绪放到前面当影响作品理解的原因。</p>\n<p><strong>研究先改变学生情绪，再测他们理解复杂作品了吗？</strong></p>\n<p>没有。C把观察到的情感表现换成了实验的起点。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"22题","raw":"### D. the classroom activity stimulates interest in the arts\n\n> 课堂活动是否激发对艺术的兴趣\n\n把D接回题干，它说的是：研究把学生分为两组，是为了查明课堂活动是否激发对艺术的兴趣。\n\nD说激发艺术兴趣，回第4段看实际比较的结果。\n\n> The target group was given a 30-minute drama-based activity to **[xxx]** the passage.\n\n> used words “classed as more **[xxx]** or rarer”, and wrote at greater length.\n\n> [target] group put themselves in the shoes of a literary character and express that character’s emotion\n\n研究写出词汇更广、用词较少见、篇幅更长，以及更能从人物立场表达情感。这些都来自学生的写作表现。\n\n段中没有测他们更想不想上艺术课、是否更喜欢戏剧。艺术活动被用作教学方式，不等于实验目的是测艺术兴趣。\n\n**使用戏剧活动，就说明最后比较的是学生是否更爱艺术吗？**\n\n不是。D把教学手段换成了所测兴趣，和报告的结果不同。\n\n**第一轮判断：D排除。**","articleRects":[[282,682,1140,38],[228,728,1194,39],[227,776,1195,39],[227,824,1195,38],[229,870,1193,40],[228,919,349,38],[282,966,1141,38],[228,1013,1194,39],[228,1060,1194,39],[230,1108,1192,39],[230,1152,1193,46],[227,1202,313,32]],"questionRects":[[257,820,785,39]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"22","paragraphPids":[2,3]},"html":"<h3>D. the classroom activity stimulates interest in the arts</h3>\n<blockquote><p>课堂活动是否激发对艺术的兴趣</p>\n</blockquote>\n<p>把D接回题干，它说的是：研究把学生分为两组，是为了查明课堂活动是否激发对艺术的兴趣。</p>\n<p>D说激发艺术兴趣，回第4段看实际比较的结果。</p>\n<blockquote><p>The target group was given a 30-minute drama-based activity to <strong>[xxx]</strong> the passage.</p>\n</blockquote>\n<blockquote><p>used words “classed as more <strong>[xxx]</strong> or rarer”, and wrote at greater length.</p>\n</blockquote>\n<blockquote><p>[target] group put themselves in the shoes of a literary character and express that character’s emotion</p>\n</blockquote>\n<p>研究写出词汇更广、用词较少见、篇幅更长，以及更能从人物立场表达情感。这些都来自学生的写作表现。</p>\n<p>段中没有测他们更想不想上艺术课、是否更喜欢戏剧。艺术活动被用作教学方式，不等于实验目的是测艺术兴趣。</p>\n<p><strong>使用戏剧活动，就说明最后比较的是学生是否更爱艺术吗？</strong></p>\n<p>不是。D把教学手段换成了所测兴趣，和报告的结果不同。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"22题","raw":"### 22题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。研究给目标组增加戏剧活动，再比较学生的写作表现，对应教学变化与学习效果之间的关系。","articleRects":[],"questionRects":[[202,568,933,39],[1138,604,113,7],[257,631,818,39],[257,694,807,39],[257,757,815,39],[257,820,785,39]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"22"},"html":"<h3>22题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。研究给目标组增加戏剧活动，再比较学生的写作表现，对应教学变化与学习效果之间的关系。</p>\n"},{"section":"23题","raw":"## 23题\n\n> Control pupils’ reliance on “desert island clichés” shows their ______.  \n> 对照组学生依赖‘荒岛陈词滥调’，显示出他们的什么特点？\n\n题干的Control pupils与desert island clichés都直接出现在第5段。这一段用while把对照组和目标组的描写并列比较，先完整读完第5段。\n\n> 原文参考：\n> \n> The Time to Act study also found that while control pupils relied on “desert island clichés” such as **[xxx]** trees, target pupils were “more expansive [giving] a broader picture of the sky, the sea and the **[xxx]** conditions”.\n> \n> 开始精读：\n> \n> The Time to Act study also found / that while control pupils relied on “desert island clichés” / such as **[xxx]** trees, / target pupils were “more expansive / [giving] a broader picture of the sky, / the sea and the **[xxx]** conditions”.\n> \n> ‘行动起来’研究还发现 / 对照组学生依赖‘荒岛陈词滥调’ / 例如**[xxx]**树 / 而目标组学生‘描写得更开阔 / （呈现出）更广阔的天空画面 / 还有海洋与**[xxx]**状况的画面’。\n\n题干问shows their，要由对照组依赖套话这一写作表现判断它说明了什么。第5段同时描述目标组画面更开阔，可以借这组具体对照理解套话所反映的特点。\n\n接下来按A—D逐项看。","articleRects":[[282,1250,1141,39],[228,1297,1195,39],[228,1344,972,40]],"questionRects":[[202,945,951,40],[257,1009,392,39],[257,1072,405,31],[257,1135,365,39],[257,1198,403,39]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"23","initialReadingPids":[4]},"html":"<h2>23题</h2>\n<blockquote><p>Control pupils’ reliance on “desert island clichés” shows their ______.<br />\n对照组学生依赖‘荒岛陈词滥调’，显示出他们的什么特点？</p>\n</blockquote>\n<p>题干的Control pupils与desert island clichés都直接出现在第5段。这一段用while把对照组和目标组的描写并列比较，先完整读完第5段。</p>\n<blockquote><p>原文参考：</p>\n<p>The Time to Act study also found that while control pupils relied on “desert island clichés” such as <strong>[xxx]</strong> trees, target pupils were “more expansive [giving] a broader picture of the sky, the sea and the <strong>[xxx]</strong> conditions”.</p>\n<p>开始精读：</p>\n<p>The Time to Act study also found / that while control pupils relied on “desert island clichés” / such as <strong>[xxx]</strong> trees, / target pupils were “more expansive / [giving] a broader picture of the sky, / the sea and the <strong>[xxx]</strong> conditions”.</p>\n<p>‘行动起来’研究还发现 / 对照组学生依赖‘荒岛陈词滥调’ / 例如<strong>[xxx]</strong>树 / 而目标组学生‘描写得更开阔 / （呈现出）更广阔的天空画面 / 还有海洋与<strong>[xxx]</strong>状况的画面’。</p>\n</blockquote>\n<p>题干问shows their，要由对照组依赖套话这一写作表现判断它说明了什么。第5段同时描述目标组画面更开阔，可以借这组具体对照理解套话所反映的特点。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"23题","raw":"### A. weakness in description\n\n> 描写方面的不足\n\n把A接回题干，它说的是：对照组学生依赖‘荒岛陈词滥调’，显示出他们在描写方面的不足。\n\nA说描写不足，回第5段把两组关于荒岛的描写放在一起。\n\n> control pupils relied on “desert island clichés” such as **[xxx]** trees\n\n> target pupils were “more expansive [giving] a broader picture of the sky, the sea and the **[xxx]** conditions”\n\n对照组靠的是常见的荒岛套话，例如某种树；目标组则展开天空、海洋及环境条件，给出更宽的画面。\n\n区别不是有没有写一个词，而是场景是否能展开。只停在惯常的几样东西上，描写就比另一组单薄。\n\n**套用荒岛常见意象、没有展开更广画面，是否反映描写能力不足？**\n\n是。A能概括两组在这处被直接比较的差别。\n\n**第一轮判断：A保留。**","articleRects":[[282,1250,1141,39],[228,1297,1195,39],[228,1344,972,40]],"questionRects":[[257,1009,392,39]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"23","paragraphPids":[4]},"html":"<h3>A. weakness in description</h3>\n<blockquote><p>描写方面的不足</p>\n</blockquote>\n<p>把A接回题干，它说的是：对照组学生依赖‘荒岛陈词滥调’，显示出他们在描写方面的不足。</p>\n<p>A说描写不足，回第5段把两组关于荒岛的描写放在一起。</p>\n<blockquote><p>control pupils relied on “desert island clichés” such as <strong>[xxx]</strong> trees</p>\n</blockquote>\n<blockquote><p>target pupils were “more expansive [giving] a broader picture of the sky, the sea and the <strong>[xxx]</strong> conditions”</p>\n</blockquote>\n<p>对照组靠的是常见的荒岛套话，例如某种树；目标组则展开天空、海洋及环境条件，给出更宽的画面。</p>\n<p>区别不是有没有写一个词，而是场景是否能展开。只停在惯常的几样东西上，描写就比另一组单薄。</p>\n<p><strong>套用荒岛常见意象、没有展开更广画面，是否反映描写能力不足？</strong></p>\n<p>是。A能概括两组在这处被直接比较的差别。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"23题","raw":"### B. omission of small details\n\n> 遗漏细小细节\n\n把B接回题干，它说的是：对照组学生依赖‘荒岛陈词滥调’，显示出他们遗漏了细小细节。\n\nB说漏了小细节，回第5段看目标组写得更好表现在哪里。\n\n> control pupils relied on “desert island clichés” such as **[xxx]** trees\n\n> a broader picture of the sky, the sea and the **[xxx]** conditions\n\n原文强调more expansive和broader picture，列的是天空、海洋以及环境条件。比较的是画面是否充分展开。\n\n对照组也写了树，这本来就可以是场景细节。问题不只是某几个小点被遗漏，而是描写依赖成套、狭窄的想象。\n\n**作者说他们没有展开画面，就等于只是在指出漏了小细节吗？**\n\n不等于。B把较广的描写不足缩成了细小遗漏。\n\n**第一轮判断：B排除。**","articleRects":[[282,1250,1141,39],[228,1297,1195,39],[228,1344,972,40]],"questionRects":[[257,1072,405,31]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"23","paragraphPids":[4]},"html":"<h3>B. omission of small details</h3>\n<blockquote><p>遗漏细小细节</p>\n</blockquote>\n<p>把B接回题干，它说的是：对照组学生依赖‘荒岛陈词滥调’，显示出他们遗漏了细小细节。</p>\n<p>B说漏了小细节，回第5段看目标组写得更好表现在哪里。</p>\n<blockquote><p>control pupils relied on “desert island clichés” such as <strong>[xxx]</strong> trees</p>\n</blockquote>\n<blockquote><p>a broader picture of the sky, the sea and the <strong>[xxx]</strong> conditions</p>\n</blockquote>\n<p>原文强调more expansive和broader picture，列的是天空、海洋以及环境条件。比较的是画面是否充分展开。</p>\n<p>对照组也写了树，这本来就可以是场景细节。问题不只是某几个小点被遗漏，而是描写依赖成套、狭窄的想象。</p>\n<p><strong>作者说他们没有展开画面，就等于只是在指出漏了小细节吗？</strong></p>\n<p>不等于。B把较广的描写不足缩成了细小遗漏。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"23题","raw":"### C. casual style of writing\n\n> 随意的写作风格\n\n把C接回题干，它说的是：对照组学生依赖‘荒岛陈词滥调’，显示出他们随意的写作风格。\n\nC说随意写作风格，回第5段看clichés指什么样的内容。\n\n> control pupils relied on “desert island clichés” such as **[xxx]** trees\n\n> target pupils were “more expansive [giving] a broader picture\n\n陈词滥调是反复使用、缺少新意的套话。对照组用惯常荒岛意象，目标组则展开更多环境内容。\n\n随意风格可以指语气轻松、表达不拘形式，但这些不是本段比较的东西。用套话也不等于写作语气随意。\n\n**描写落入套话，与写作风格随意是同一个特点吗？**\n\n不是。C没有对应内容是否展开这一比较。\n\n**第一轮判断：C排除。**","articleRects":[[282,1250,1141,39],[228,1297,1195,39],[228,1344,972,40]],"questionRects":[[257,1135,365,39]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"23","paragraphPids":[4]},"html":"<h3>C. casual style of writing</h3>\n<blockquote><p>随意的写作风格</p>\n</blockquote>\n<p>把C接回题干，它说的是：对照组学生依赖‘荒岛陈词滥调’，显示出他们随意的写作风格。</p>\n<p>C说随意写作风格，回第5段看clichés指什么样的内容。</p>\n<blockquote><p>control pupils relied on “desert island clichés” such as <strong>[xxx]</strong> trees</p>\n</blockquote>\n<blockquote><p>target pupils were “more expansive [giving] a broader picture</p>\n</blockquote>\n<p>陈词滥调是反复使用、缺少新意的套话。对照组用惯常荒岛意象，目标组则展开更多环境内容。</p>\n<p>随意风格可以指语气轻松、表达不拘形式，但这些不是本段比较的东西。用套话也不等于写作语气随意。</p>\n<p><strong>描写落入套话，与写作风格随意是同一个特点吗？</strong></p>\n<p>不是。C没有对应内容是否展开这一比较。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"23题","raw":"### D. **[xxx]** for big words\n\n> 对大词的**[xxx]**\n\n把D接回题干，它说的是：对照组学生依赖‘荒岛陈词滥调’，显示出他们对大词的**[xxx]**。\n\nD说对大词的[xxx]，回第5段先看这个例子实际列了哪些差别。\n\n> control pupils relied on “desert island clichés” such as **[xxx]** trees\n\n> a broader picture of the sky, the sea and the **[xxx]** conditions\n\n> used words “classed as more **[xxx]** or rarer”\n\n这段拿树、天空、海洋与环境来比较场景描写的范围，没有问学生喜欢还是回避大词。D中的态度词虽然不认识，for big words仍把话题放到了对词汇的某种取向上。\n\n前一段提到目标组用词更少见，那是另一项观察；不能把它直接当成对照组采用荒岛套话的解释。\n\n**荒岛画面比较直接给出了对照组对大词的态度吗？**\n\n没有。这个例子能说明描写范围窄，不能定出他们对大词的某种态度。\n\n**第一轮判断：D排除。**","articleRects":[[282,966,1141,38],[228,1013,1194,39],[228,1060,1194,39],[230,1108,1192,39],[230,1152,1193,46],[227,1202,313,32],[282,1250,1141,39],[228,1297,1195,39],[228,1344,972,40]],"questionRects":[[257,1198,403,39]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"23","paragraphPids":[3,4]},"html":"<h3>D. <strong>[xxx]</strong> for big words</h3>\n<blockquote><p>对大词的<strong>[xxx]</strong></p>\n</blockquote>\n<p>把D接回题干，它说的是：对照组学生依赖‘荒岛陈词滥调’，显示出他们对大词的<strong>[xxx]</strong>。</p>\n<p>D说对大词的[xxx]，回第5段先看这个例子实际列了哪些差别。</p>\n<blockquote><p>control pupils relied on “desert island clichés” such as <strong>[xxx]</strong> trees</p>\n</blockquote>\n<blockquote><p>a broader picture of the sky, the sea and the <strong>[xxx]</strong> conditions</p>\n</blockquote>\n<blockquote><p>used words “classed as more <strong>[xxx]</strong> or rarer”</p>\n</blockquote>\n<p>这段拿树、天空、海洋与环境来比较场景描写的范围，没有问学生喜欢还是回避大词。D中的态度词虽然不认识，for big words仍把话题放到了对词汇的某种取向上。</p>\n<p>前一段提到目标组用词更少见，那是另一项观察；不能把它直接当成对照组采用荒岛套话的解释。</p>\n<p><strong>荒岛画面比较直接给出了对照组对大词的态度吗？</strong></p>\n<p>没有。这个例子能说明描写范围窄，不能定出他们对大词的某种态度。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"23题","raw":"### 23题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。依赖荒岛套话与更开阔的场景描写相对，显示的是描写方面的不足。","articleRects":[],"questionRects":[[202,945,951,40],[257,1009,392,39],[257,1072,405,31],[257,1135,365,39],[257,1198,403,39]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"23"},"html":"<h3>23题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。依赖荒岛套话与更开阔的场景描写相对，显示的是描写方面的不足。</p>\n"},{"section":"24题","raw":"## 24题\n\n> What can promote children’s emotional literacy according to O’Hanlon?  \n> 按照奥汉隆的说法，什么能够提升儿童的情感素养？\n\n题干的O’Hanlon和emotional literacy同时出现在第6段开头，随后她解释情感理解与排练室过程的联系。先完整读完第6段，连同她描述儿童表现和解释戏剧活动的部分。\n\n> 原文参考：\n> \n> O’Hanlon said she had been most surprised by the “emotional literacy that was evident in the [target] children’s writing” and that they were “more **[xxx]** in their writing, more hopeful”. She added: “The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.” The study showed the importance of **[xxx]** the arts in education, she said.\n> \n> 开始精读：\n> \n> O’Hanlon said / she had been most surprised by the “emotional literacy / that was evident in the [target] children’s writing” / and that they were “more **[xxx]** in their writing, / more hopeful”. / She added: / “The emotional understanding was very evident / and it is probably related to the [rehearsal room process] / where you are used to trying to imagine your way through. / They were comfortable in describing different emotional states / and part of what you do in drama / is put yourself in different shoes.” / The study showed the importance / of **[xxx]** the arts in education, / she said.\n> \n> 奥汉隆说 / 最让她惊讶的是‘情感素养 / 它明显体现在（目标组）儿童的写作中’ / 以及他们‘在写作中更**[xxx]** / 更满怀希望’。 / 她补充道： / ‘对情感的理解非常明显 / 这可能与（排练室过程）有关 / 在其中你习惯于尝试通过想象来逐步体会。 / 他们能够自如地描述不同的情感状态 / 而你在戏剧活动中所做的一部分 / 就是设身处地。’ / 这项研究显示了重要性 / 即在教育中**[xxx]**艺术的重要性 / 她说。\n\n题干问什么能promote儿童的emotional literacy，需要核对奥汉隆把情感理解联系到了什么做法。不能只重复儿童表现更满怀希望这一结果，还要找使这种表现产生的活动。\n\n接下来按A—D逐项看。","articleRects":[[283,1392,1140,39],[228,1439,1194,40],[227,1487,1195,39],[227,1535,1195,38],[228,1582,1194,39],[227,1630,1195,38],[227,1676,1195,40],[227,1725,285,35]],"questionRects":[[202,1324,1103,39],[257,1387,544,39],[257,1450,555,39],[257,1513,521,39],[257,1576,575,39]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"24","initialReadingPids":[5]},"html":"<h2>24题</h2>\n<blockquote><p>What can promote children’s emotional literacy according to O’Hanlon?<br />\n按照奥汉隆的说法，什么能够提升儿童的情感素养？</p>\n</blockquote>\n<p>题干的O’Hanlon和emotional literacy同时出现在第6段开头，随后她解释情感理解与排练室过程的联系。先完整读完第6段，连同她描述儿童表现和解释戏剧活动的部分。</p>\n<blockquote><p>原文参考：</p>\n<p>O’Hanlon said she had been most surprised by the “emotional literacy that was evident in the [target] children’s writing” and that they were “more <strong>[xxx]</strong> in their writing, more hopeful”. She added: “The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.” The study showed the importance of <strong>[xxx]</strong> the arts in education, she said.</p>\n<p>开始精读：</p>\n<p>O’Hanlon said / she had been most surprised by the “emotional literacy / that was evident in the [target] children’s writing” / and that they were “more <strong>[xxx]</strong> in their writing, / more hopeful”. / She added: / “The emotional understanding was very evident / and it is probably related to the [rehearsal room process] / where you are used to trying to imagine your way through. / They were comfortable in describing different emotional states / and part of what you do in drama / is put yourself in different shoes.” / The study showed the importance / of <strong>[xxx]</strong> the arts in education, / she said.</p>\n<p>奥汉隆说 / 最让她惊讶的是‘情感素养 / 它明显体现在（目标组）儿童的写作中’ / 以及他们‘在写作中更<strong>[xxx]</strong> / 更满怀希望’。 / 她补充道： / ‘对情感的理解非常明显 / 这可能与（排练室过程）有关 / 在其中你习惯于尝试通过想象来逐步体会。 / 他们能够自如地描述不同的情感状态 / 而你在戏剧活动中所做的一部分 / 就是设身处地。’ / 这项研究显示了重要性 / 即在教育中<strong>[xxx]</strong>艺术的重要性 / 她说。</p>\n</blockquote>\n<p>题干问什么能promote儿童的emotional literacy，需要核对奥汉隆把情感理解联系到了什么做法。不能只重复儿童表现更满怀希望这一结果，还要找使这种表现产生的活动。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"24题","raw":"### A. Writing in an imaginative manner.\n\n> 以富有想象力的方式写作。\n\n把A接回题干，它说的是：按照奥汉隆的说法，以富有想象力的方式写作能够提升儿童的情感素养。\n\nA说富于想象地写作，回第6段看writing与imagine your way through。\n\n> emotional literacy that was evident in the [target] children’s writing\n\n> it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through\n\n> They were comfortable in describing different emotional states\n\nO’Hanlon在孩子的写作中看到了情感理解，又认为这可能与排练时习惯运用想象有关。A把想象和写作连在一起，确实有词句可以对应。\n\n不过她后面具体解释为put yourself in different shoes，想象究竟要站在谁的位置上，还不能略过。\n\n**这一段同时提到想象和写作，A能否暂时留下？**\n\n可以先留。但要再看促进情感理解的是一般地想象，还是特定的角色体会。\n\n**第一轮判断：A保留。**","articleRects":[[283,1392,1140,39],[228,1439,1194,40],[227,1487,1195,39],[227,1535,1195,38],[228,1582,1194,39],[227,1630,1195,38],[227,1676,1195,40],[227,1725,285,35]],"questionRects":[[257,1387,544,39]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"24","paragraphPids":[5]},"html":"<h3>A. Writing in an imaginative manner.</h3>\n<blockquote><p>以富有想象力的方式写作。</p>\n</blockquote>\n<p>把A接回题干，它说的是：按照奥汉隆的说法，以富有想象力的方式写作能够提升儿童的情感素养。</p>\n<p>A说富于想象地写作，回第6段看writing与imagine your way through。</p>\n<blockquote><p>emotional literacy that was evident in the [target] children’s writing</p>\n</blockquote>\n<blockquote><p>it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through</p>\n</blockquote>\n<blockquote><p>They were comfortable in describing different emotional states</p>\n</blockquote>\n<p>O’Hanlon在孩子的写作中看到了情感理解，又认为这可能与排练时习惯运用想象有关。A把想象和写作连在一起，确实有词句可以对应。</p>\n<p>不过她后面具体解释为put yourself in different shoes，想象究竟要站在谁的位置上，还不能略过。</p>\n<p><strong>这一段同时提到想象和写作，A能否暂时留下？</strong></p>\n<p>可以先留。但要再看促进情感理解的是一般地想象，还是特定的角色体会。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"24题","raw":"### B. Identifying with literary characters.\n\n> 设身处地地体会文学人物。\n\n把B接回题干，它说的是：按照奥汉隆的说法，设身处地地体会文学人物能够提升儿童的情感素养。\n\nB说设身处地体会文学人物，回第6段看put yourself in different shoes，再连第4段的人物情感。\n\n> The emotional understanding was very evident and it is probably related to the [rehearsal room process]\n\n> part of what you do in drama is put yourself in different shoes\n\n> [target] group put themselves in the shoes of a literary character and express that character’s emotion\n\n第4段说目标组进入文学人物的立场，表达那个人物的情感。第6段又用同样的换位说法解释排练过程。\n\n设身处地去想不同人物会有怎样的感受，孩子便在练习理解和描述不同情绪。B把这项具体做法说出来了。\n\n**体会人物的处境和感受，是否就是O’Hanlon解释的换位过程？**\n\n是。B有两段相互对应的说明，先保留。\n\n**第一轮判断：B保留。**","articleRects":[[282,966,1141,38],[228,1013,1194,39],[228,1060,1194,39],[230,1108,1192,39],[230,1152,1193,46],[227,1202,313,32],[283,1392,1140,39],[228,1439,1194,40],[227,1487,1195,39],[227,1535,1195,38],[228,1582,1194,39],[227,1630,1195,38],[227,1676,1195,40],[227,1725,285,35]],"questionRects":[[257,1450,555,39]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"24","paragraphPids":[3,5]},"html":"<h3>B. Identifying with literary characters.</h3>\n<blockquote><p>设身处地地体会文学人物。</p>\n</blockquote>\n<p>把B接回题干，它说的是：按照奥汉隆的说法，设身处地地体会文学人物能够提升儿童的情感素养。</p>\n<p>B说设身处地体会文学人物，回第6段看put yourself in different shoes，再连第4段的人物情感。</p>\n<blockquote><p>The emotional understanding was very evident and it is probably related to the [rehearsal room process]</p>\n</blockquote>\n<blockquote><p>part of what you do in drama is put yourself in different shoes</p>\n</blockquote>\n<blockquote><p>[target] group put themselves in the shoes of a literary character and express that character’s emotion</p>\n</blockquote>\n<p>第4段说目标组进入文学人物的立场，表达那个人物的情感。第6段又用同样的换位说法解释排练过程。</p>\n<p>设身处地去想不同人物会有怎样的感受，孩子便在练习理解和描述不同情绪。B把这项具体做法说出来了。</p>\n<p><strong>体会人物的处境和感受，是否就是O’Hanlon解释的换位过程？</strong></p>\n<p>是。B有两段相互对应的说明，先保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"24题","raw":"### C. Drawing **[xxx]** from nature.\n\n> 从自然中汲取**[xxx]**。\n\n把C接回题干，它说的是：按照奥汉隆的说法，从自然中汲取**[xxx]**能够提升儿童的情感素养。\n\nC说从自然汲取[xxx]，回第5、6段分清自然景物与情感解释。\n\n> a broader picture of the sky, the sea and the **[xxx]** conditions\n\n> it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through\n\n> part of what you do in drama is put yourself in different shoes\n\n天空和海洋出现在上一段，是目标组场景描写更充分的表现。O’Hanlon解释情感素养时，强调的是在排练中想象并设身处地。\n\n即使C里有词不认识，from nature仍把促进作用归到自然。原文没有说学生通过接近自然或从自然获得东西来提升情感理解。\n\n**文中天空、海洋的描写，被O’Hanlon拿来解释情感进步了吗？**\n\n没有。C把描写结果中的景物换成了促进情感发展的来源。\n\n**第一轮判断：C排除。**","articleRects":[[282,1250,1141,39],[228,1297,1195,39],[228,1344,972,40],[283,1392,1140,39],[228,1439,1194,40],[227,1487,1195,39],[227,1535,1195,38],[228,1582,1194,39],[227,1630,1195,38],[227,1676,1195,40],[227,1725,285,35]],"questionRects":[[257,1513,521,39]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"24","paragraphPids":[4,5]},"html":"<h3>C. Drawing <strong>[xxx]</strong> from nature.</h3>\n<blockquote><p>从自然中汲取<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把C接回题干，它说的是：按照奥汉隆的说法，从自然中汲取<strong>[xxx]</strong>能够提升儿童的情感素养。</p>\n<p>C说从自然汲取[xxx]，回第5、6段分清自然景物与情感解释。</p>\n<blockquote><p>a broader picture of the sky, the sea and the <strong>[xxx]</strong> conditions</p>\n</blockquote>\n<blockquote><p>it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through</p>\n</blockquote>\n<blockquote><p>part of what you do in drama is put yourself in different shoes</p>\n</blockquote>\n<p>天空和海洋出现在上一段，是目标组场景描写更充分的表现。O’Hanlon解释情感素养时，强调的是在排练中想象并设身处地。</p>\n<p>即使C里有词不认识，from nature仍把促进作用归到自然。原文没有说学生通过接近自然或从自然获得东西来提升情感理解。</p>\n<p><strong>文中天空、海洋的描写，被O’Hanlon拿来解释情感进步了吗？</strong></p>\n<p>没有。C把描写结果中的景物换成了促进情感发展的来源。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"24题","raw":"### D. Concentrating on real-life situations.\n\n> 专注于现实生活中的情境。\n\n把D接回题干，它说的是：按照奥汉隆的说法，专注于现实生活中的情境能够提升儿童的情感素养。\n\nD说专注现实情境，回第4、6段看两组想象的区别。\n\n> the [rehearsal room process] where you are used to trying to imagine your way through\n\n> part of what you do in drama is put yourself in different shoes\n\n> [target] group put themselves in the shoes of a literary character and express that character’s emotion\n\n对照组想自己遇到船难会怎样，目标组则进入文学人物的立场，表达那个人物的感情。O’Hanlon强调的也是换到不同人的处境。\n\n她没有要求以现实中实际发生的情境为中心。这里练习的恰好可以是戏剧中的虚构人物。\n\n**情感进步靠的是关注现实情境，还是体会另一个人物的感受？**\n\n原文说的是后者。D把角色换位改成了现实情境要求。\n\n**第一轮判断：D排除。**","articleRects":[[282,966,1141,38],[228,1013,1194,39],[228,1060,1194,39],[230,1108,1192,39],[230,1152,1193,46],[227,1202,313,32],[283,1392,1140,39],[228,1439,1194,40],[227,1487,1195,39],[227,1535,1195,38],[228,1582,1194,39],[227,1630,1195,38],[227,1676,1195,40],[227,1725,285,35]],"questionRects":[[257,1576,575,39]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"24","paragraphPids":[3,5]},"html":"<h3>D. Concentrating on real-life situations.</h3>\n<blockquote><p>专注于现实生活中的情境。</p>\n</blockquote>\n<p>把D接回题干，它说的是：按照奥汉隆的说法，专注于现实生活中的情境能够提升儿童的情感素养。</p>\n<p>D说专注现实情境，回第4、6段看两组想象的区别。</p>\n<blockquote><p>the [rehearsal room process] where you are used to trying to imagine your way through</p>\n</blockquote>\n<blockquote><p>part of what you do in drama is put yourself in different shoes</p>\n</blockquote>\n<blockquote><p>[target] group put themselves in the shoes of a literary character and express that character’s emotion</p>\n</blockquote>\n<p>对照组想自己遇到船难会怎样，目标组则进入文学人物的立场，表达那个人物的感情。O’Hanlon强调的也是换到不同人的处境。</p>\n<p>她没有要求以现实中实际发生的情境为中心。这里练习的恰好可以是戏剧中的虚构人物。</p>\n<p><strong>情感进步靠的是关注现实情境，还是体会另一个人物的感受？</strong></p>\n<p>原文说的是后者。D把角色换位改成了现实情境要求。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"24题","raw":"### 24题第一次结果\n\n- A保留。\n- B保留。\n- C排除。\n- D排除。\n\n暂时保留：A、B。\n\n第一遍留下A、B。A较宽泛地将想象与写作结合起来；B对应奥汉隆所说的设身处地及文学人物的情感表达。","articleRects":[],"questionRects":[[202,1324,1103,39],[257,1387,544,39],[257,1450,555,39],[257,1513,521,39],[257,1576,575,39]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"24"},"html":"<h3>24题第一次结果</h3>\n<ul><li>A保留。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>暂时保留：A、B。</p>\n<p>第一遍留下A、B。A较宽泛地将想象与写作结合起来；B对应奥汉隆所说的设身处地及文学人物的情感表达。</p>\n"},{"section":"25题","raw":"## 25题\n\n> It can be inferred from the last paragraph that ______.  \n> 从最后一段可以推断出什么？\n\n题干直接限定last paragraph，定位到第7段。先把这一段关于其他剧作家、莎士比亚的词汇量以及儿童身体参与的内容完整读完。\n\n> 原文参考：\n> \n> But could the results be replicated with any old dramatist? O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words, gave a “massive expansion of language into children’s lives”, which was combined with children “using their whole bodies to bring words to life”.\n> \n> 开始精读：\n> \n> But could the results be replicated with any old dramatist? / O’Hanlon said more research would be needed / but suggested that Shakespeare’s use of 20,000 words, / compared with the everyday 2,000 words, / gave a “massive expansion of language into children’s lives”, / which was combined with children / “using their whole bodies to bring words to life”.\n> \n> 但是，用随便哪位剧作家的作品都能重现这些结果吗？ / 奥汉隆说还需要更多研究 / 但她提出，莎士比亚使用20,000个词 / 相比之下日常使用的词有2,000个 / 这让‘儿童生活中的语言得到大幅拓展’ / 这又与儿童 / ‘运用整个身体让文字活起来’结合在一起。\n\n题干要求由最后一段推出结论。要保留段首问题与回答的关系，分清哪些仍需要研究、哪些是奥汉隆已经提出的解释，再判断选项能否从这些话推出。\n\n接下来按A—D逐项看。","articleRects":[[283,1771,1139,39],[227,1819,1195,39],[227,1866,1198,39],[227,1913,1196,40],[227,1961,532,39]],"questionRects":[[202,1702,712,39],[257,1765,892,39],[257,1828,886,39],[257,1891,888,39],[257,1954,845,39],[567,2090,453,33]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[6],"qid":"25","initialReadingPids":[6]},"html":"<h2>25题</h2>\n<blockquote><p>It can be inferred from the last paragraph that ______.<br />\n从最后一段可以推断出什么？</p>\n</blockquote>\n<p>题干直接限定last paragraph，定位到第7段。先把这一段关于其他剧作家、莎士比亚的词汇量以及儿童身体参与的内容完整读完。</p>\n<blockquote><p>原文参考：</p>\n<p>But could the results be replicated with any old dramatist? O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words, gave a “massive expansion of language into children’s lives”, which was combined with children “using their whole bodies to bring words to life”.</p>\n<p>开始精读：</p>\n<p>But could the results be replicated with any old dramatist? / O’Hanlon said more research would be needed / but suggested that Shakespeare’s use of 20,000 words, / compared with the everyday 2,000 words, / gave a “massive expansion of language into children’s lives”, / which was combined with children / “using their whole bodies to bring words to life”.</p>\n<p>但是，用随便哪位剧作家的作品都能重现这些结果吗？ / 奥汉隆说还需要更多研究 / 但她提出，莎士比亚使用20,000个词 / 相比之下日常使用的词有2,000个 / 这让‘儿童生活中的语言得到大幅拓展’ / 这又与儿童 / ‘运用整个身体让文字活起来’结合在一起。</p>\n</blockquote>\n<p>题干要求由最后一段推出结论。要保留段首问题与回答的关系，分清哪些仍需要研究、哪些是奥汉隆已经提出的解释，再判断选项能否从这些话推出。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"25题","raw":"### A. the new teaching method may work best with Shakespeare\n\n> 这种新的教学法可能与莎士比亚作品配合得最好\n\n把A接回题干，它说的是：从最后一段可以推断，这种新的教学法可能与莎士比亚作品配合得最好。\n\nA说可能与莎士比亚配合最好，回末段看换其他剧作家的问题怎样回答。\n\n> But could the results be replicated with any old dramatist?\n\n> O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words\n\n> gave a “massive expansion of language into children’s lives”\n\nO’Hanlon没有马上说换谁都一样，而说还要研究，随后强调莎士比亚用词约两万、日常用词约两千，能给孩子带来很大的语言扩展。\n\n这份丰富语言又与孩子全身参与相结合，说明她特别看重莎士比亚作品能提供的东西。A带may，是对这种配合优势的推测。\n\n**在尚需研究的情况下，强调莎士比亚的丰富语言，能否支持这种方法可能尤其适合他？**\n\n能支持这一可能，尚不是已证明的作者排名。A先保留。\n\n**第一轮判断：A保留。**","articleRects":[[283,1771,1139,39],[227,1819,1195,39],[227,1866,1198,39],[227,1913,1196,40],[227,1961,532,39]],"questionRects":[[257,1765,892,39]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"25","paragraphPids":[6]},"html":"<h3>A. the new teaching method may work best with Shakespeare</h3>\n<blockquote><p>这种新的教学法可能与莎士比亚作品配合得最好</p>\n</blockquote>\n<p>把A接回题干，它说的是：从最后一段可以推断，这种新的教学法可能与莎士比亚作品配合得最好。</p>\n<p>A说可能与莎士比亚配合最好，回末段看换其他剧作家的问题怎样回答。</p>\n<blockquote><p>But could the results be replicated with any old dramatist?</p>\n</blockquote>\n<blockquote><p>O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words</p>\n</blockquote>\n<blockquote><p>gave a “massive expansion of language into children’s lives”</p>\n</blockquote>\n<p>O’Hanlon没有马上说换谁都一样，而说还要研究，随后强调莎士比亚用词约两万、日常用词约两千，能给孩子带来很大的语言扩展。</p>\n<p>这份丰富语言又与孩子全身参与相结合，说明她特别看重莎士比亚作品能提供的东西。A带may，是对这种配合优势的推测。</p>\n<p><strong>在尚需研究的情况下，强调莎士比亚的丰富语言，能否支持这种方法可能尤其适合他？</strong></p>\n<p>能支持这一可能，尚不是已证明的作者排名。A先保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"25题","raw":"### B. the language of Shakespeare may be formidable for pupils\n\n> 莎士比亚的语言可能让学生望而生畏\n\n把B接回题干，它说的是：从最后一段可以推断，莎士比亚的语言可能让学生望而生畏。\n\nB说语言令人望而生畏，回末段看两万词之后的评价。\n\n> Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words, gave a “massive expansion of language into children’s lives”\n\n> using their whole bodies to bring words to life\n\n莎士比亚用词远多于日常词汇，但O’Hanlon把它说成给孩子生活带来massive expansion。孩子还运用身体让文字活起来。\n\n她在这里介绍的是语言资源丰富带来的收获，没有描述孩子害怕、理解不了或退缩。\n\n**词汇多就一定在这段表示学生感到畏难吗？**\n\n不是。文中把丰富词汇写成益处，B补出了没有报告的畏难反应。\n\n**第一轮判断：B排除。**","articleRects":[[283,1771,1139,39],[227,1819,1195,39],[227,1866,1198,39],[227,1913,1196,40],[227,1961,532,39]],"questionRects":[[257,1828,886,39]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"25","paragraphPids":[6]},"html":"<h3>B. the language of Shakespeare may be formidable for pupils</h3>\n<blockquote><p>莎士比亚的语言可能让学生望而生畏</p>\n</blockquote>\n<p>把B接回题干，它说的是：从最后一段可以推断，莎士比亚的语言可能让学生望而生畏。</p>\n<p>B说语言令人望而生畏，回末段看两万词之后的评价。</p>\n<blockquote><p>Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words, gave a “massive expansion of language into children’s lives”</p>\n</blockquote>\n<blockquote><p>using their whole bodies to bring words to life</p>\n</blockquote>\n<p>莎士比亚用词远多于日常词汇，但O’Hanlon把它说成给孩子生活带来massive expansion。孩子还运用身体让文字活起来。</p>\n<p>她在这里介绍的是语言资源丰富带来的收获，没有描述孩子害怕、理解不了或退缩。</p>\n<p><strong>词汇多就一定在这段表示学生感到畏难吗？</strong></p>\n<p>不是。文中把丰富词汇写成益处，B补出了没有报告的畏难反应。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"25题","raw":"### C. other old dramatists may be included in primary education\n\n> 其他古代剧作家可能被纳入小学教育\n\n把C接回题干，它说的是：从最后一段可以推断，其他古代剧作家可能被纳入小学教育。\n\nC说其他古代剧作家会进入小学教育，回末段看any old dramatist用来问什么。\n\n> could the results be replicated with any old dramatist?\n\n> O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words\n\n作者问的是换个剧作家，研究结果还能否重现。O’Hanlon回答还需要更多研究，这是在谈效果能否重复。\n\n并没有哪所小学宣布把这些作者纳入课程。提出可以比较的研究对象，与已经或可能作出的课程安排之间还缺一步。\n\n**询问换作者后效果怎样，就足以推出小学将引入那些作者吗？**\n\n不能。C把研究问题改成了课程安排。\n\n**第一轮判断：C排除。**","articleRects":[[283,1771,1139,39],[227,1819,1195,39],[227,1866,1198,39],[227,1913,1196,40],[227,1961,532,39]],"questionRects":[[257,1891,888,39]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"25","paragraphPids":[6]},"html":"<h3>C. other old dramatists may be included in primary education</h3>\n<blockquote><p>其他古代剧作家可能被纳入小学教育</p>\n</blockquote>\n<p>把C接回题干，它说的是：从最后一段可以推断，其他古代剧作家可能被纳入小学教育。</p>\n<p>C说其他古代剧作家会进入小学教育，回末段看any old dramatist用来问什么。</p>\n<blockquote><p>could the results be replicated with any old dramatist?</p>\n</blockquote>\n<blockquote><p>O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words</p>\n</blockquote>\n<p>作者问的是换个剧作家，研究结果还能否重现。O’Hanlon回答还需要更多研究，这是在谈效果能否重复。</p>\n<p>并没有哪所小学宣布把这些作者纳入课程。提出可以比较的研究对象，与已经或可能作出的课程安排之间还缺一步。</p>\n<p><strong>询问换作者后效果怎样，就足以推出小学将引入那些作者吗？</strong></p>\n<p>不能。C把研究问题改成了课程安排。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"25题","raw":"### D. pupils may be **[xxx]** to work on other old dramatists\n\n> 学生可能**[xxx]**去学习其他古代剧作家的作品\n\n把D接回题干，它说的是：从最后一段可以推断，学生可能**[xxx]**去学习其他古代剧作家的作品。\n\nD说学生可能[xxx]去学其他剧作家，回末段看是否提到了学生面对其他作品时的状态。\n\n> could the results be replicated with any old dramatist?\n\n> O’Hanlon said more research would be needed\n\n> gave a “massive expansion of language into children’s lives”\n\n本段确实问到其他剧作家，但回答集中在还需研究，以及莎士比亚语言丰富与身体参与的结合。D中描述学生的关键状态暂时不认识。\n\n现在不能凭这个生词断言它一定与原文相反，也不能因为出现other dramatists就确定它有依据。\n\n**是否已经读到足够信息，可以确认学生学习其他作品时的这项状态？**\n\n还没有。先把D留下，之后连回整项研究的对象和结果再判断。\n\n**第一轮判断：D保留。**","articleRects":[[283,1771,1139,39],[227,1819,1195,39],[227,1866,1198,39],[227,1913,1196,40],[227,1961,532,39]],"questionRects":[[257,1954,845,39],[567,2090,453,33]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"25","paragraphPids":[6]},"html":"<h3>D. pupils may be <strong>[xxx]</strong> to work on other old dramatists</h3>\n<blockquote><p>学生可能<strong>[xxx]</strong>去学习其他古代剧作家的作品</p>\n</blockquote>\n<p>把D接回题干，它说的是：从最后一段可以推断，学生可能<strong>[xxx]</strong>去学习其他古代剧作家的作品。</p>\n<p>D说学生可能[xxx]去学其他剧作家，回末段看是否提到了学生面对其他作品时的状态。</p>\n<blockquote><p>could the results be replicated with any old dramatist?</p>\n</blockquote>\n<blockquote><p>O’Hanlon said more research would be needed</p>\n</blockquote>\n<blockquote><p>gave a “massive expansion of language into children’s lives”</p>\n</blockquote>\n<p>本段确实问到其他剧作家，但回答集中在还需研究，以及莎士比亚语言丰富与身体参与的结合。D中描述学生的关键状态暂时不认识。</p>\n<p>现在不能凭这个生词断言它一定与原文相反，也不能因为出现other dramatists就确定它有依据。</p>\n<p><strong>是否已经读到足够信息，可以确认学生学习其他作品时的这项状态？</strong></p>\n<p>还没有。先把D留下，之后连回整项研究的对象和结果再判断。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"25题","raw":"### 25题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D保留。\n\n暂时保留：A、D。\n\n第一遍留下A、D。A保留可能性地推测莎士比亚与教学法的配合；D中评价学生接触其他作者作品的核心部分尚未读清。","articleRects":[],"questionRects":[[202,1702,712,39],[257,1765,892,39],[257,1828,886,39],[257,1891,888,39],[257,1954,845,39],[567,2090,453,33]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"25"},"html":"<h3>25题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>暂时保留：A、D。</p>\n<p>第一遍留下A、D。A保留可能性地推测莎士比亚与教学法的配合；D中评价学生接触其他作者作品的核心部分尚未读清。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | does benefit children’s literacy and emotional development；only if you act him out | 以‘does benefit children’s literacy and emotional development’提出研究结论，再用‘only if you act him out’限定条件：儿童通过把莎士比亚作品演出来，获得语言与情感方面的益处。 | 提出研究结论及表演这一条件，确定全文关注的效果与方法。 |\n| 第2段 | a “rehearsal room” approach；the way actors work | 承接这项条件，以‘a “rehearsal room” approach’介绍具体教学法，并用‘the way actors work’解释活动方式与语言使用、看待自己的方式之间的联系。 | 展开教学法，说明演员式活动与语言、自我认识之间的联系。 |\n| 第3段 | target and control groups；a 30-minute drama-based activity | 用‘target and control groups’展开研究安排：两组都完成写作，目标组另有‘a 30-minute drama-based activity’，为后面比较学生表现提供背景；活动对选段的具体动作仍写成**[xxx]**。 | 交代比较研究的安排，为后文解释学生表现的差异提供依据。 |\n| 第4段 | wrote at greater length；put themselves in the shoes of a literary character | 报告写作结果，‘wrote at greater length’说明篇幅变化，‘put themselves in the shoes of a literary character’进一步说明目标组能进入人物立场；这与对照组想象自己遇到船难的反应形成区别，把写作表现连到情感体会。 | 报告写作和角色体会的结果，将语言表现与情感理解连起来。 |\n| 第5段 | desert island clichés；a broader picture | 以‘desert island clichés’和‘a broader picture’继续比较两组写景，对照组依赖套话，目标组把场景铺展得更开阔，补充了上一段关于写作表现的发现。 | 继续比较写景表现，补充目标组描写更开阔的发现。 |\n| 第6段 | trying to imagine your way through；put yourself in different shoes | 把结果与活动过程联系起来，奥汉隆用‘trying to imagine your way through’和‘put yourself in different shoes’解释儿童的情感理解：她把排练中的想象和设身处地与他们能描述不同情感状态相联系。 | 把观察到的情感理解接回排练过程，解释设身处地的作用。 |\n| 第7段 | any old dramatist；massive expansion of language；using their whole bodies | 提出能否换用‘any old dramatist’的问题，对此仍需更多研究；随后用‘massive expansion of language’以及‘using their whole bodies’说明莎士比亚丰富的词汇与身体参与相结合的作用，补充了方法和作品如何共同帮助儿童。 | 区分尚待研究的替代作者问题与已有解释，补充作品语言和身体参与的配合作用。 |\n\n全文围绕排练室教学中的研究展开：把莎士比亚作品通过表演、想象和角色体验带入学习，有助于儿童使用语言、展开描写并理解情感；词汇的丰富与学生主动参与共同构成文章解释效果的重点，换用其他剧作家能否获得相同效果仍待研究。","articleRects":[[282,255,1140,38],[227,302,1196,39],[227,349,1090,39],[283,396,1139,40],[227,444,1195,39],[228,491,1195,39],[228,539,1195,39],[227,586,1195,39],[227,634,436,39],[282,682,1140,38],[228,728,1194,39],[227,776,1195,39],[227,824,1195,38],[229,870,1193,40],[228,919,349,38],[282,966,1141,38],[228,1013,1194,39],[228,1060,1194,39],[230,1108,1192,39],[230,1152,1193,46],[227,1202,313,32],[282,1250,1141,39],[228,1297,1195,39],[228,1344,972,40],[283,1392,1140,39],[228,1439,1194,40],[227,1487,1195,39],[227,1535,1195,38],[228,1582,1194,39],[227,1630,1195,38],[227,1676,1195,40],[227,1725,285,35],[283,1771,1139,39],[227,1819,1195,39],[227,1866,1198,39],[227,1913,1196,40],[227,1961,532,39]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>does benefit children’s literacy and emotional development；only if you act him out</td><td>以‘does benefit children’s literacy and emotional development’提出研究结论，再用‘only if you act him out’限定条件：儿童通过把莎士比亚作品演出来，获得语言与情感方面的益处。</td><td>提出研究结论及表演这一条件，确定全文关注的效果与方法。</td></tr><tr><td>第2段</td><td>a “rehearsal room” approach；the way actors work</td><td>承接这项条件，以‘a “rehearsal room” approach’介绍具体教学法，并用‘the way actors work’解释活动方式与语言使用、看待自己的方式之间的联系。</td><td>展开教学法，说明演员式活动与语言、自我认识之间的联系。</td></tr><tr><td>第3段</td><td>target and control groups；a 30-minute drama-based activity</td><td>用‘target and control groups’展开研究安排：两组都完成写作，目标组另有‘a 30-minute drama-based activity’，为后面比较学生表现提供背景；活动对选段的具体动作仍写成<strong>[xxx]</strong>。</td><td>交代比较研究的安排，为后文解释学生表现的差异提供依据。</td></tr><tr><td>第4段</td><td>wrote at greater length；put themselves in the shoes of a literary character</td><td>报告写作结果，‘wrote at greater length’说明篇幅变化，‘put themselves in the shoes of a literary character’进一步说明目标组能进入人物立场；这与对照组想象自己遇到船难的反应形成区别，把写作表现连到情感体会。</td><td>报告写作和角色体会的结果，将语言表现与情感理解连起来。</td></tr><tr><td>第5段</td><td>desert island clichés；a broader picture</td><td>以‘desert island clichés’和‘a broader picture’继续比较两组写景，对照组依赖套话，目标组把场景铺展得更开阔，补充了上一段关于写作表现的发现。</td><td>继续比较写景表现，补充目标组描写更开阔的发现。</td></tr><tr><td>第6段</td><td>trying to imagine your way through；put yourself in different shoes</td><td>把结果与活动过程联系起来，奥汉隆用‘trying to imagine your way through’和‘put yourself in different shoes’解释儿童的情感理解：她把排练中的想象和设身处地与他们能描述不同情感状态相联系。</td><td>把观察到的情感理解接回排练过程，解释设身处地的作用。</td></tr><tr><td>第7段</td><td>any old dramatist；massive expansion of language；using their whole bodies</td><td>提出能否换用‘any old dramatist’的问题，对此仍需更多研究；随后用‘massive expansion of language’以及‘using their whole bodies’说明莎士比亚丰富的词汇与身体参与相结合的作用，补充了方法和作品如何共同帮助儿童。</td><td>区分尚待研究的替代作者问题与已有解释，补充作品语言和身体参与的配合作用。</td></tr></tbody></table>\n<p>全文围绕排练室教学中的研究展开：把莎士比亚作品通过表演、想象和角色体验带入学习，有助于儿童使用语言、展开描写并理解情感；词汇的丰富与学生主动参与共同构成文章解释效果的重点，换用其他剧作家能否获得相同效果仍待研究。</p>\n"},{"section":"进阶回查","raw":"## 回查21题：A还是C？\n\nThe “rehearsal room” approach requires pupils to ______.\n\nA. rewrite the **[xxx]** from Shakespeare\n\nC. play the roles in Shakespeare\n\n第一轮看到瓶中信和写作任务，又不认识A的改写对象，先把A留下。现在后文把学生怎样参与说得更具体了：\n\n> [target] group put themselves in the shoes of a literary character and express that character’s emotion.\n> part of what you do in drama is put yourself in different shoes.\n> using their whole bodies to bring words to life\n\n学生进入文学人物的立场、表达人物的情感，还要用身体让词句活起来。再接开头的act him out和任务中的as Ferdinand，这几处都在说孩子自己扮演人物。\n\n**即使课堂里可能涉及改写，单用rewrite能解释这些角色身份和身体参与吗？**\n\n不能。改写只说明文字被重新处理，没有说明孩子以谁的身份行动、感受和表达。C的扮演角色能把前面的教学要求与后面的过程说明接在一起。\n\n**21题选C。**","articleRects":[[283,396,1139,40],[227,444,1195,39],[228,491,1195,39],[228,539,1195,39],[227,586,1195,39],[227,634,436,39],[282,966,1141,38],[228,1013,1194,39],[228,1060,1194,39],[230,1108,1192,39],[230,1152,1193,46],[227,1202,313,32],[283,1392,1140,39],[228,1439,1194,40],[227,1487,1195,39],[227,1535,1195,38],[228,1582,1194,39],[227,1630,1195,38],[227,1676,1195,40],[227,1725,285,35],[283,1771,1139,39],[227,1819,1195,39],[227,1866,1198,39],[227,1913,1196,40],[227,1961,532,39]],"questionRects":[[202,190,769,39],[257,253,548,39],[257,316,521,39],[257,379,466,39],[257,442,488,39]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","C"],"newEvidencePids":[4,6,7],"finalChoice":"C","qid":"21","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查21题：A还是C？</h2>\n<p>The “rehearsal room” approach requires pupils to ______.</p>\n<p>A. rewrite the <strong>[xxx]</strong> from Shakespeare</p>\n<p>C. play the roles in Shakespeare</p>\n<p>第一轮看到瓶中信和写作任务，又不认识A的改写对象，先把A留下。现在后文把学生怎样参与说得更具体了：</p>\n<blockquote><p>[target] group put themselves in the shoes of a literary character and express that character’s emotion.\npart of what you do in drama is put yourself in different shoes.\nusing their whole bodies to bring words to life</p>\n</blockquote>\n<p>学生进入文学人物的立场、表达人物的情感，还要用身体让词句活起来。再接开头的act him out和任务中的as Ferdinand，这几处都在说孩子自己扮演人物。</p>\n<p><strong>即使课堂里可能涉及改写，单用rewrite能解释这些角色身份和身体参与吗？</strong></p>\n<p>不能。改写只说明文字被重新处理，没有说明孩子以谁的身份行动、感受和表达。C的扮演角色能把前面的教学要求与后面的过程说明接在一起。</p>\n<p><strong>21题选C。</strong></p>\n"},{"section":"进阶回查","raw":"## 回查24题：A还是B？\n\nWhat can promote children’s emotional literacy according to O’Hanlon?\n\nA. Writing in an imaginative manner.\n\nB. Identifying with literary characters.\n\nA能对应“想象”和“写作”，但先看研究怎样安排：两组都要完成写作，目标组另外参加戏剧活动。再看两组到底哪里不同：\n\n> while [control] group imagine how they themselves would react to being shipwrecked, [target] group put themselves in the shoes of a literary character and express that character’s emotion\n\n对照组也在想象，也在写。它们想的是自己遇难会怎样，目标组体会的则是文学人物怎样感受。O’Hanlon后来所说的put yourself in different shoes，正好再次点出换位。\n\n**两组都有想象性写作，哪一项说出了目标组多做的那一步？**\n\nB。它明确说体会文学人物，将感受的出发点从自己移到人物。A只写富于想象，连对照组想象自己的经历也能包括，没有指出这里促进情感理解的具体过程。\n\n**24题选B。**","articleRects":[[283,1392,1140,39],[228,1439,1194,40],[227,1487,1195,39],[227,1535,1195,38],[228,1582,1194,39],[227,1630,1195,38],[227,1676,1195,40],[227,1725,285,35],[283,396,1139,40],[227,444,1195,39],[228,491,1195,39],[228,539,1195,39],[227,586,1195,39],[227,634,436,39],[282,682,1140,38],[228,728,1194,39],[227,776,1195,39],[227,824,1195,38],[229,870,1193,40],[228,919,349,38]],"questionRects":[[202,1324,1103,39],[257,1387,544,39],[257,1450,555,39],[257,1513,521,39],[257,1576,575,39]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","B"],"newEvidencePids":[2,3],"finalChoice":"B","qid":"24","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查24题：A还是B？</h2>\n<p>What can promote children’s emotional literacy according to O’Hanlon?</p>\n<p>A. Writing in an imaginative manner.</p>\n<p>B. Identifying with literary characters.</p>\n<p>A能对应“想象”和“写作”，但先看研究怎样安排：两组都要完成写作，目标组另外参加戏剧活动。再看两组到底哪里不同：</p>\n<blockquote><p>while [control] group imagine how they themselves would react to being shipwrecked, [target] group put themselves in the shoes of a literary character and express that character’s emotion</p>\n</blockquote>\n<p>对照组也在想象，也在写。它们想的是自己遇难会怎样，目标组体会的则是文学人物怎样感受。O’Hanlon后来所说的put yourself in different shoes，正好再次点出换位。</p>\n<p><strong>两组都有想象性写作，哪一项说出了目标组多做的那一步？</strong></p>\n<p>B。它明确说体会文学人物，将感受的出发点从自己移到人物。A只写富于想象，连对照组想象自己的经历也能包括，没有指出这里促进情感理解的具体过程。</p>\n<p><strong>24题选B。</strong></p>\n"},{"section":"进阶回查","raw":"## 回查25题：A还是D？\n\nIt can be inferred from the last paragraph that ______.\n\nA. the new teaching method may work best with Shakespeare\n\nD. pupils may be **[xxx]** to work on other old dramatists\n\nD的关键状态仍不认识，所以不能靠猜词来排除。先回到研究实际做过什么：学生以莎士比亚人物的身份写作，目标组参加戏剧活动，之后报告词汇、写作与情感理解的改善。文中没有接着安排学生去学习另一位剧作家。\n\n末段问的是，这些结果换成别的剧作家还能否重复。O’Hanlon说仍需研究，却紧接着指出莎士比亚语言的特点：\n\n> Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words, gave a “massive expansion of language into children’s lives”\n\n丰富语言与孩子运用全身演出来相结合，是她在这里具体提出的理由。A沿着这个理由谨慎推测：这种方法与莎士比亚可能配合得尤其好，may没有把尚需研究说成已有定论。\n\n**这段提供的理由是在解释方法与作品怎样配合，还是在介绍学生学习其他作家时的状态？**\n\n是解释前者。D即使不一定与本文相反，也缺少关于其他作家学习过程的说明，不能仅凭出现了other dramatists就推出学生的某种状态。\n\n**25题选A。**","articleRects":[[283,1771,1139,39],[227,1819,1195,39],[227,1866,1198,39],[227,1913,1196,40],[227,1961,532,39],[282,255,1140,38],[227,302,1196,39],[227,349,1090,39],[283,396,1139,40],[227,444,1195,39],[228,491,1195,39],[228,539,1195,39],[227,586,1195,39],[227,634,436,39],[282,682,1140,38],[228,728,1194,39],[227,776,1195,39],[227,824,1195,38],[229,870,1193,40],[228,919,349,38]],"questionRects":[[202,1702,712,39],[257,1765,892,39],[257,1828,886,39],[257,1891,888,39],[257,1954,845,39],[567,2090,453,33]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","D"],"newEvidencePids":[1,2,3],"finalChoice":"A","qid":"25","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h2>回查25题：A还是D？</h2>\n<p>It can be inferred from the last paragraph that ______.</p>\n<p>A. the new teaching method may work best with Shakespeare</p>\n<p>D. pupils may be <strong>[xxx]</strong> to work on other old dramatists</p>\n<p>D的关键状态仍不认识，所以不能靠猜词来排除。先回到研究实际做过什么：学生以莎士比亚人物的身份写作，目标组参加戏剧活动，之后报告词汇、写作与情感理解的改善。文中没有接着安排学生去学习另一位剧作家。</p>\n<p>末段问的是，这些结果换成别的剧作家还能否重复。O’Hanlon说仍需研究，却紧接着指出莎士比亚语言的特点：</p>\n<blockquote><p>Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words, gave a “massive expansion of language into children’s lives”</p>\n</blockquote>\n<p>丰富语言与孩子运用全身演出来相结合，是她在这里具体提出的理由。A沿着这个理由谨慎推测：这种方法与莎士比亚可能配合得尤其好，may没有把尚需研究说成已有定论。</p>\n<p><strong>这段提供的理由是在解释方法与作品怎样配合，还是在介绍学生学习其他作家时的状态？</strong></p>\n<p>是解释前者。D即使不一定与本文相反，也缺少关于其他作家学习过程的说明，不能仅凭出现了other dramatists就推出学生的某种状态。</p>\n<p><strong>25题选A。</strong></p>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**21. C**\n\n**22. A**\n\n**23. A**\n\n**24. B**\n\n**25. A**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>21. C</strong></p>\n<p><strong>22. A</strong></p>\n<p><strong>23. A</strong></p>\n<p><strong>24. B</strong></p>\n<p><strong>25. A</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRpqcBABXRUJQVlA4TI2cBAAvWIY1AlUTIrdt0ub/v96ADsE9IiZAfre0YKlz0KTbTDtxPYXMbxn4oSuZinP3u81MupIZdwwIuYakPae1LmR8r9Y78vr+//+r+uX8HdecM7Nn793pdPa3s8+0m87endMzPZ3ds5lOZ7fndKZzZk9nmpkzp53OzJnOmban086P03amM99p53R6ze9Of8xMrzO/p3PaznS3PTOzr860Mz2d3Zm5rj29+mOmp7O7r7l2O3u6e9rpXKfd3W2vJp/36/l6vz+ftWBvuPY1Wy2xHAkIEgQOiSCBBIHAIz4egUMgEAiSj8CQkCBIliAEEhwCsRwCSbJIliFBkCAQS6wEi0AtBApDAmEhVkKCwyA+HkGCQCDwSyBwCNwiQSBwCMRKEEiSJZZAkCAQiJWwEiSCBLFIEDgECYiVIEgQCMQnQSAQJOAQ/AFL4BEkCAQCiQKxEhIEciX8CSRIBBJBssQSCBIEkoSVIBAkJGslPBMEbpGAQ+AQS+AQCAQOwX+AWChIcEvwHyCQJAgMCrEMjgQJCRJB8hBLEARyJQSHIEGQsAQJAkmySJZAoBFGktmkfyR/FAIIgOTvPP33QNtW3ta2rTXWXntnnpmcIYT4E9geIwghhpAku47qvPxzTv5e36EVtG3kpjh03v1Q0LYNw59o2/2DoP+BV9v/87ImHUbb9ut3712u2t5lrqpaZdtVa5exbNbiv9ZaVbWrttpmZvcpmGFHHe71/69ata/WruvaXVEzddwHYFspMyNjaNu2MyN/w1Zs2yfQkSOb+wTaiG0jNzL7zRo7bz
