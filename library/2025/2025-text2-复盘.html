 / 而且为我们的智能提供动力。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第六段第一句","focus":[30,3480,1020,285],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":769,"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":false},"focusId":"focus-long-5-2"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"5. 第六段第一句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 5. 第六段第一句","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h3>原文</h3><blockquote>\n<p>Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>Every day, / scientists, technologists and engineers / are discovering new ways / to exploit renewable energy sources / and develop techniques / not just to use power more intelligently / but to power our intelligence.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>每天 / 科学家、技术人员和工程师 / 正在发现新的方法 / 来开发利用可再生能源 / 并开发技术 / 不仅更智能地使用能源 / 而且为我们的智能提供动力。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-3\"><h3>第三步：按照中文语感合并意群</h3><p>先合并句子开头：</p>\n<blockquote>\n<p>每天 / 科学家、技术人员和工程师 / 正在发现新的方法</p>\n</blockquote>\n<p>这三块按照原来的顺序就符合中文习惯，可以合并成：</p>\n<blockquote>\n<p>每天，科学家、技术人员和工程师都在发现新的方法</p>\n</blockquote>\n<p>接着把：</p>\n<blockquote>\n<p>正在发现新的方法 / 来开发利用可再生能源</p>\n</blockquote>\n<p>合并成：</p>\n<blockquote>\n<p>正在发现开发利用可再生能源的新方法</p>\n</blockquote>\n<p>这里把“来开发利用可再生能源”放在“新方法”前面，变成修饰“方法”的内容。</p>\n<p>最后三块是：</p>\n<blockquote>\n<p>并开发技术 / 不仅更智能地使用能源 / 而且为我们的智能提供动力</p>\n</blockquote>\n<p>“不仅……而且……”是在说明这些技术有什么作用，所以应该把这两部分放到“技术”前面，合并成：</p>\n<blockquote>\n<p>并开发不仅能更智能地使用能源、而且能为我们的智能提供动力的技术</p>\n</blockquote>\n<p>现在得到两块主要内容：</p>\n<blockquote>\n<p>每天，科学家、技术人员和工程师都在发现开发利用可再生能源的新方法\n并开发不仅能更智能地使用能源、而且能为我们的智能提供动力的技术</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第六段第一句","focus":[30,3480,1020,285],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":773,"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":false},"focusId":"focus-long-5-3"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"5. 第六段第一句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 5. 第六段第一句","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h3>原文</h3><blockquote>\n<p>Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>Every day, / scientists, technologists and engineers / are discovering new ways / to exploit renewable energy sources / and develop techniques / not just to use power more intelligently / but to power our intelligence.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>每天 / 科学家、技术人员和工程师 / 正在发现新的方法 / 来开发利用可再生能源 / 并开发技术 / 不仅更智能地使用能源 / 而且为我们的智能提供动力。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-3\"><h3>第三步：按照中文语感合并意群</h3><p>先合并句子开头：</p>\n<blockquote>\n<p>每天 / 科学家、技术人员和工程师 / 正在发现新的方法</p>\n</blockquote>\n<p>这三块按照原来的顺序就符合中文习惯，可以合并成：</p>\n<blockquote>\n<p>每天，科学家、技术人员和工程师都在发现新的方法</p>\n</blockquote>\n<p>接着把：</p>\n<blockquote>\n<p>正在发现新的方法 / 来开发利用可再生能源</p>\n</blockquote>\n<p>合并成：</p>\n<blockquote>\n<p>正在发现开发利用可再生能源的新方法</p>\n</blockquote>\n<p>这里把“来开发利用可再生能源”放在“新方法”前面，变成修饰“方法”的内容。</p>\n<p>最后三块是：</p>\n<blockquote>\n<p>并开发技术 / 不仅更智能地使用能源 / 而且为我们的智能提供动力</p>\n</blockquote>\n<p>“不仅……而且……”是在说明这些技术有什么作用，所以应该把这两部分放到“技术”前面，合并成：</p>\n<blockquote>\n<p>并开发不仅能更智能地使用能源、而且能为我们的智能提供动力的技术</p>\n</blockquote>\n<p>现在得到两块主要内容：</p>\n<blockquote>\n<p>每天，科学家、技术人员和工程师都在发现开发利用可再生能源的新方法\n并开发不仅能更智能地使用能源、而且能为我们的智能提供动力的技术</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3><p>接着找句子骨干：</p>\n<blockquote>\n<p>科学家、技术人员和工程师正在发现新方法，并开发技术。</p>\n</blockquote>\n<p>时间“每天”放在骨干最前面。“开发利用可再生能源”放在“新方法”前面。“不仅……而且……”放在“技术”前面。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>每天，科学家、技术人员和工程师都在发现开发利用可再生能源的新方法，并开发不仅能更智能地使用能源、而且能为我们的智能提供动力的技术。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第六段第一句","focus":[30,3480,1020,285],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":806,"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":false},"focusId":"focus-long-5-4"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"5. 第六段第一句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 5. 第六段第一句","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h3>原文</h3><blockquote>\n<p>Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>Every day, / scientists, technologists and engineers / are discovering new ways / to exploit renewable energy sources / and develop techniques / not just to use power more intelligently / but to power our intelligence.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>每天 / 科学家、技术人员和工程师 / 正在发现新的方法 / 来开发利用可再生能源 / 并开发技术 / 不仅更智能地使用能源 / 而且为我们的智能提供动力。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-3\"><h3>第三步：按照中文语感合并意群</h3><p>先合并句子开头：</p>\n<blockquote>\n<p>每天 / 科学家、技术人员和工程师 / 正在发现新的方法</p>\n</blockquote>\n<p>这三块按照原来的顺序就符合中文习惯，可以合并成：</p>\n<blockquote>\n<p>每天，科学家、技术人员和工程师都在发现新的方法</p>\n</blockquote>\n<p>接着把：</p>\n<blockquote>\n<p>正在发现新的方法 / 来开发利用可再生能源</p>\n</blockquote>\n<p>合并成：</p>\n<blockquote>\n<p>正在发现开发利用可再生能源的新方法</p>\n</blockquote>\n<p>这里把“来开发利用可再生能源”放在“新方法”前面，变成修饰“方法”的内容。</p>\n<p>最后三块是：</p>\n<blockquote>\n<p>并开发技术 / 不仅更智能地使用能源 / 而且为我们的智能提供动力</p>\n</blockquote>\n<p>“不仅……而且……”是在说明这些技术有什么作用，所以应该把这两部分放到“技术”前面，合并成：</p>\n<blockquote>\n<p>并开发不仅能更智能地使用能源、而且能为我们的智能提供动力的技术</p>\n</blockquote>\n<p>现在得到两块主要内容：</p>\n<blockquote>\n<p>每天，科学家、技术人员和工程师都在发现开发利用可再生能源的新方法\n并开发不仅能更智能地使用能源、而且能为我们的智能提供动力的技术</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3><p>接着找句子骨干：</p>\n<blockquote>\n<p>科学家、技术人员和工程师正在发现新方法，并开发技术。</p>\n</blockquote>\n<p>时间“每天”放在骨干最前面。“开发利用可再生能源”放在“新方法”前面。“不仅……而且……”放在“技术”前面。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>每天，科学家、技术人员和工程师都在发现开发利用可再生能源的新方法，并开发不仅能更智能地使用能源、而且能为我们的智能提供动力的技术。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-5-5\"><h3>第五步：艺术加工</h3><p>“发现新方法”在中文里可以润色为“探索新途径”。</p>\n<p>“开发利用可再生能源”连续出现两个动词，略显拥挤。结合上下文，可以压缩为：</p>\n<blockquote>\n<p>利用可再生能源。</p>\n</blockquote>\n<p>“开发技术”在科技语境中可以润色为“研发技术”。</p>\n<p>“不仅……而且……”用“既……又……”连接，句子会更加紧凑。</p>\n<p>“为我们的智能提供动力”稍显生硬，可以整理成“为人类智能活动提供动力”。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>每天，科学家、技术人员和工程师都在探索利用可再生能源的新途径，并研发既能更智能地使用能源、又能为人类智能活动提供动力的技术。</p>\n</blockquote>\n<hr />\n</section>","context":{"mode":"image","asset":"annotated","label":"第六段第一句","focus":[30,3480,1020,285],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":818,"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":true},"focusId":"focus-long-5-5"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":1,"breadcrumb":"一石五鸟复盘","html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。</li>\n</ol>\n<p>其中三个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n<li><strong>全文主旨：</strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h2 class=\"sourceSectionTitle\">第一类：歪曲原意</h2><h3>定义</h3><p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h3>典型误选脑回路</h3><p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h2><h3>定义</h3><p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h3>典型误选脑回路</h3><p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n这个选项是论点还是论据？\n它的出处在题干限定范围内吗？\n它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr />\n<h2 class=\"sourceSectionTitle\">第三类：无中生有</h2><h3>定义</h3><p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>在本篇文章里，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h3>典型误选脑回路</h3><p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n咱们从这个地方开始怎样脑补；\n最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>我们先从30题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。</p>\n","context":{"mode":"image","asset":"annotated","label":"阅读选项复盘","focus":[25,4620,1030,1050],"sourceW":1080,"sourceH":6116},"meta":{"kind":"section-cover","mergedIntro":true}},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"30题 · 题干、题型与核心出处","level":2,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","html":"<p>下面哪一个说法作者会同意？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Emission-free modelling demands extra funding.</strong></p>\n<p>无排放建模需要额外资金。</p>\n<p>B. <strong>The need for supercomputers is difficult to meet.</strong></p>\n<p>对超级计算机的需求很难满足。</p>\n<p>C. <strong>Energy-intensive research work is inevitable.</strong></p>\n<p>能源密集型研究工作是不可避免的。</p>\n<p>D. <strong>The goals of researchers ought to be realistic.</strong></p>\n<p>研究者的目标应该现实。</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3><p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>这一段在说什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>有人想减少耗能研究，作者 shocked</td>\n  <td>有人想做xxx，作者认为不得行</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>科研确实耗能</td>\n  <td>先假装承认那些人的想法有一定道理</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>这是必须付的代价，研究排放值得</td>\n  <td>但是话又说回来，做xxx是对的</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>科学难解释，但科学有用</td>\n  <td>从理论角度分析为什么做xxx是对的，为什么利大于弊</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>Green 发明说明科学工程能减碳</td>\n  <td>举第一个例子说明好处是什么</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>LUMI 说明大型计算也能可持续</td>\n  <td>举第二个例子说明弊端是可以解决或改良的</td>\n</tr>\n<tr>\n  <td>第7段</td>\n  <td>未来要做更多可持续计算</td>\n  <td>未来做xxx应该如何改进</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n","context":{"mode":"image","asset":"annotated","label":"30题","focus":[70,5450,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"question","question":"30","option":null,"sourceLine":983,"questionIntro":true}},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. Emission-free modelling demands extra funding.","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 30题","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-A-0\"><p>无排放建模需要额外资金。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"30题","focus":[70,5450,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"30","option":"A","sourceLine":1030,"cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false},"focusId":"focus-q30-A-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. Emission-free modelling demands extra funding.","level":4,"breadcrumb":"30题 / A. Emission-free modelling demands extra funding.","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-A-0\"><p>无排放建模需要额外资金。</p>\n</section><section class=\"revealPart\" id=\"focus-q30-A-1\"><h3>如果 A 是主旨，文章七段应该怎么写？</h3><p>如果全文主旨真的是：</p>\n<p>无排放建模需要额外资金。</p>\n<p>那文章七段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>有人提出无排放建模，或者有人反对给建模投钱，作者 shocked</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>作者先假装承认无排放建模确实很贵，确实需要资源</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>但是作者说，这笔钱必须花，funding 是必要代价</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>从理论上讲，为什么给无排放建模投钱是值得的，为什么利大于弊</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>举一个 funded modelling 或 funding 带来好结果的例子</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>再举一个例子，说明资金问题可以通过某种方式解决</td>\n</tr>\n<tr>\n  <td>第7段</td>\n  <td>未来应该投入更多 funding，支持 emission-free modelling</td>\n</tr>\n</tbody>\n</table></div>\n<p>也就是说，如果 A 是主旨，全文应该围绕：</p>\n<p>modelling + emission-free + funding</p>\n<p>这三个东西一直写。</p>\n<p>判断：</p>\n<p><strong>A 不保留。</strong></p>\n<hr />\n</section>","context":{"mode":"image","asset":"annotated","label":"30题","focus":[70,5450,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":"30","option":"A","sourceLine":1034,"cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":true},"focusId":"focus-q30-A-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. The need for supercomputers is difficult to meet.","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 30题","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-B-0\"><p>对超级计算机的需求很难满足。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"30题","focus":[70,5450,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"30","option":"B","sourceLine":1066,"cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":false},"focusId":"focus-q30-B-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. The need for supercomputers is difficult to meet.","level":4,"breadcrumb":"30题 / B. The need for supercomputers is difficult to meet.","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-B-0\"><p>对超级计算机的需求很难满足。</p>\n</section><section class=\"revealPart\" id=\"focus-q30-B-1\"><h3>如果 B 是主旨，文章七段应该怎么写？</h3><p>如果全文主旨真的是：</p>\n<p>对超级计算机的需求很难满足。</p>\n<p>那文章七段应该大概这样写：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>有人提出世界需要更多超级计算机，或者有人担心超级计算机不够用，作者 shocked</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>作者先假装承认超级计算机需求确实很大，建造和运行都很难</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>但是作者说，即使难，这种需求也必须被满足</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>从理论上解释为什么超级计算机需求重要，为什么难满足</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>举一个例子说明超级计算机需求带来了什么问题或好处</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>LUMI 作为超级计算机例子，说明需求多难满足</td>\n</tr>\n<tr>\n  <td>第7段</td>\n  <td>未来要解决超级计算机需求不足的问题</td>\n</tr>\n</tbody>\n</table></div>\n<p>如果 B 是主旨，文章要反复围绕：</p>\n<p>超级计算机，需求，困难这些，我们稍微推一下就知道显然不对。</p>\n<p>判断：</p>\n<p><strong>B 不保留。</strong></p>\n<hr />\n</section>","context":{"mode":"image","asset":"annotated","label":"30题","focus":[70,5450,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":"30","option":"B","sourceLine":1070,"cumulative":true,"cumulativeGroup":"question-30-option-B","cumulativeFinal":true},"focusId":"focus-q30-B-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"C. Energy-intensive research work is inevitable.","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 30题","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-C-0\"><p>能源密集型研究工作是不可避免的。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"30题","focus":[70,5450,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"30","option":"C","sourceLine":1100,"cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":false},"focusId":"focus-q30-C-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"C. Energy-intensive research work is inevitable.","level":4,"breadcrumb":"30题 / C. Energy-intensive research work is inevitable.","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-C-0\"><p>能源密集型研究工作是不可避免的。</p>\n</section><section class=\"revealPart\" id=\"focus-q30-C-1\"><h3>如果 C 是主旨，文章七段应该怎么写？</h3><p>如果全文主旨真的是：</p>\n<p>能源密集型研究工作是不可避免的。</p>\n<p>那文章七段应该大概这样展开：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>有人想减少耗能研究，作者 shocked</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>作者先假装承认科研确实耗能，那些人说的确实有道理</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>但是话又说回来，这是必须付的代价，科研排放值得</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>从理论上解释耗能研究为什么利大于弊</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>举例说明科学工程的好处</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>再举例说明弊端可以改良</td>\n</tr>\n<tr>\n  <td>第7段</td>\n  <td>未来应该接着做但是要改良耗能部分问题</td>\n</tr>\n</tbody>\n</table></div>\n<p>现在对照原文，发现原文就是这么写的。</p>\n<p>判断：</p>\n<p><strong>C 保留。</strong></p>\n<hr />\n</section>","context":{"mode":"image","asset":"annotated","label":"30题","focus":[70,5450,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":"30","option":"C","sourceLine":1104,"cumulative":true,"cumulativeGroup":"question-30-option-C","cumulativeFinal":true},"focusId":"focus-q30-C-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"D. The goals of researchers ought to be realistic.","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 30题","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-D-0\"><p>研究者的目标应该现实。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"30题","focus":[70,5450,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"30","option":"D","sourceLine":1132,"cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":false},"focusId":"focus-q30-D-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"D. The goals of researchers ought to be realistic.","level":4,"breadcrumb":"30题 / D. The goals of researchers ought to be realistic.","html":"<section class=\"revealPart optionLead\" id=\"focus-q30-D-0\"><p>研究者的目标应该现实。</p>\n</section><section class=\"revealPart\" id=\"focus-q30-D-1\"><h3>如果 D 是主旨，文章七段应该怎么写？</h3><p>如果全文主旨真的是：</p>\n<p>研究者的目标应该现实。</p>\n<p>那文章七段应该大概这样写：</p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>第1段</td>\n  <td>有些研究者目标不现实，作者 shocked</td>\n</tr>\n<tr>\n  <td>第2段</td>\n  <td>作者先假装承认这些目标背后有一定现实困难</td>\n</tr>\n<tr>\n  <td>第3段</td>\n  <td>但是作者说，研究者应该制定更现实的目标</td>\n</tr>\n<tr>\n  <td>第4段</td>\n  <td>从理论上解释为什么 realistic goals 很重要，为什么利大于弊</td>\n</tr>\n<tr>\n  <td>第5段</td>\n  <td>举例说明某个研究者因为目标现实，所以取得好结果</td>\n</tr>\n<tr>\n  <td>第6段</td>\n  <td>再举例说明某个项目目标现实，所以可以成功</td>\n</tr>\n<tr>\n  <td>第7段</td>\n  <td>未来研究者应该如何制定 realistic goals</td>\n</tr>\n</tbody>\n</table></div>\n<p>如果 D 是主旨，全文要反复围绕：</p>\n<p>目标是否现实、研究者目标怎么调整。</p>\n<p>判断：</p>\n<p><strong>D 不保留。</strong></p>\n<hr />\n</section>","context":{"mode":"image","asset":"annotated","label":"30题","focus":[70,5450,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":"30","option":"D","sourceLine":1136,"cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true},"focusId":"focus-q30-D-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"30题结论","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 30题","html":"<p><strong>30. C. Energy-intensive research work is inevitable.</strong></p>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Energy-intensive research work is inevitable. / 能源密集型研究工作是不可避免的。</strong></p>\n","context":{"mode":"image","asset":"annotated","label":"30题","focus":[70,5450,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"conclusion","question":"30","option":null,"sourceLine":1164,"questionConclusion":true}},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"26题 · 题干、题型与核心出处","level":2,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","html":"<blockquote>\n<p>The author expressed great surprise at some scientists’ ______.\n作者对一些科学家的什么感到非常惊讶？</p>\n</blockquote>\n<h3>题型</h3><p>这是一道局部细节题，问的是作者感到震惊的具体对象。</p>\n<h3>核心出处</h3><blockquote>\n<p>I was shocked to learn recently that some scientists want to scale back their research in an effort to decrease carbon emissions.</p>\n</blockquote>\n<p>题干中的<code>expressed great surprise</code>对应<code>was shocked</code>。因此，空格需要概括的是：</p>\n<blockquote>\n<p>some scientists want to scale back their research\n一些科学家想要缩减他们的研究。</p>\n</blockquote>\n","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"question","question":"26","option":null,"sourceLine":1174,"questionIntro":true}},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. unwillingness to cut carbon emissions","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 26题","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-A-0\"><blockquote>\n<p>不愿意减少碳排放</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>unwillingness</code>认识，原文中的<code>in an effort to decrease carbon emissions</code>也能看懂，所以当时就可以直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>cut carbon emissions</code>确实来自原文，但命题人把科学家的态度改反了。原文是“正在努力减排”，A却变成“不愿意减排”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>in an effort to decrease carbon emissions</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"26","option":"A","sourceLine":1192,"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false},"focusId":"focus-q26-A-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. unwillingness to cut carbon emissions","level":4,"breadcrumb":"26题 / A. unwillingness to cut carbon emissions","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-A-0\"><blockquote>\n<p>不愿意减少碳排放</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>unwillingness</code>认识，原文中的<code>in an effort to decrease carbon emissions</code>也能看懂，所以当时就可以直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>cut carbon emissions</code>确实来自原文，但命题人把科学家的态度改反了。原文是“正在努力减排”，A却变成“不愿意减排”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>in an effort to decrease carbon emissions</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-A-1\"><h3>定位比对法</h3><p>我们先看A里的<code>cut carbon emissions</code>，意思是“减少碳排放”。原文第一句后半部分也出现了意思相同的<code>decrease carbon emissions</code>，所以A要和这部分原文比较：</p>\n<blockquote>\n<p>some scientists want to scale back their research in an effort to decrease carbon emissions</p>\n</blockquote>\n<p>把A接到题干后面，整句话的意思是：</p>\n<blockquote>\n<p>作者对一些科学家“不愿意减少碳排放”感到非常震惊。</p>\n</blockquote>\n<p>A中最关键的是<code>unwillingness</code>，意思是“不愿意”。但原文中的<code>in an effort to</code>表示“为了……、努力……”，后面接的正是<code>decrease carbon emissions</code>。也就是说，这些科学家正在想办法减少碳排放，并不是不愿意减排。</p>\n<p><code>scale back</code>的意思不会影响这个判断。无论这些科学家具体想怎样处理研究，他们这样做的目的已经写得很清楚：减少碳排放。</p>\n<p>所以，A把“努力减少碳排放”改成了“不愿意减少碳排放”，方向完全相反。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"A","sourceLine":1206,"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false},"focusId":"focus-q26-A-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. unwillingness to cut carbon emissions","level":4,"breadcrumb":"26题 / A. unwillingness to cut carbon emissions","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-A-0\"><blockquote>\n<p>不愿意减少碳排放</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>unwillingness</code>认识，原文中的<code>in an effort to decrease carbon emissions</code>也能看懂，所以当时就可以直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>cut carbon emissions</code>确实来自原文，但命题人把科学家的态度改反了。原文是“正在努力减排”，A却变成“不愿意减排”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>in an effort to decrease carbon emissions</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-A-1\"><h3>定位比对法</h3><p>我们先看A里的<code>cut carbon emissions</code>，意思是“减少碳排放”。原文第一句后半部分也出现了意思相同的<code>decrease carbon emissions</code>，所以A要和这部分原文比较：</p>\n<blockquote>\n<p>some scientists want to scale back their research in an effort to decrease carbon emissions</p>\n</blockquote>\n<p>把A接到题干后面，整句话的意思是：</p>\n<blockquote>\n<p>作者对一些科学家“不愿意减少碳排放”感到非常震惊。</p>\n</blockquote>\n<p>A中最关键的是<code>unwillingness</code>，意思是“不愿意”。但原文中的<code>in an effort to</code>表示“为了……、努力……”，后面接的正是<code>decrease carbon emissions</code>。也就是说，这些科学家正在想办法减少碳排放，并不是不愿意减排。</p>\n<p><code>scale back</code>的意思不会影响这个判断。无论这些科学家具体想怎样处理研究，他们这样做的目的已经写得很清楚：减少碳排放。</p>\n<p>所以，A把“努力减少碳排放”改成了“不愿意减少碳排放”，方向完全相反。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-A-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>The crisis is here, they said, and we need to cut back on our energy-intensive modelling. At the very least, we need to make our energy use far more sustainable.\n他们说，危机已经来了，我们需要削减高耗能的建模工作。至少，我们需要让能源使用变得更加可持续。</p>\n</blockquote>\n<p>实际后文中的科学家主动提出削减耗能建模、改善能源使用，仍然是在想办法减排。</p>\n<p>如果A成立，后文应该改成：</p>\n<blockquote>\n<p>The crisis is here, they said, but we are unwilling to cut carbon emissions or make our energy use more sustainable.\n他们说，危机已经来了，但我们不愿意减少碳排放，也不愿意让能源使用变得更加可持续。</p>\n</blockquote>\n<p>实际后文和这种写法正好相反，所以A不成立。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"A","sourceLine":1222,"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false},"focusId":"focus-q26-A-2"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. unwillingness to cut carbon emissions","level":4,"breadcrumb":"26题 / A. unwillingness to cut carbon emissions","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-A-0\"><blockquote>\n<p>不愿意减少碳排放</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>unwillingness</code>认识，原文中的<code>in an effort to decrease carbon emissions</code>也能看懂，所以当时就可以直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p><code>cut carbon emissions</code>确实来自原文，但命题人把科学家的态度改反了。原文是“正在努力减排”，A却变成“不愿意减排”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>in an effort to decrease carbon emissions</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-A-1\"><h3>定位比对法</h3><p>我们先看A里的<code>cut carbon emissions</code>，意思是“减少碳排放”。原文第一句后半部分也出现了意思相同的<code>decrease carbon emissions</code>，所以A要和这部分原文比较：</p>\n<blockquote>\n<p>some scientists want to scale back their research in an effort to decrease carbon emissions</p>\n</blockquote>\n<p>把A接到题干后面，整句话的意思是：</p>\n<blockquote>\n<p>作者对一些科学家“不愿意减少碳排放”感到非常震惊。</p>\n</blockquote>\n<p>A中最关键的是<code>unwillingness</code>，意思是“不愿意”。但原文中的<code>in an effort to</code>表示“为了……、努力……”，后面接的正是<code>decrease carbon emissions</code>。也就是说，这些科学家正在想办法减少碳排放，并不是不愿意减排。</p>\n<p><code>scale back</code>的意思不会影响这个判断。无论这些科学家具体想怎样处理研究，他们这样做的目的已经写得很清楚：减少碳排放。</p>\n<p>所以，A把“努力减少碳排放”改成了“不愿意减少碳排放”，方向完全相反。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-A-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>The crisis is here, they said, and we need to cut back on our energy-intensive modelling. At the very least, we need to make our energy use far more sustainable.\n他们说，危机已经来了，我们需要削减高耗能的建模工作。至少，我们需要让能源使用变得更加可持续。</p>\n</blockquote>\n<p>实际后文中的科学家主动提出削减耗能建模、改善能源使用，仍然是在想办法减排。</p>\n<p>如果A成立，后文应该改成：</p>\n<blockquote>\n<p>The crisis is here, they said, but we are unwilling to cut carbon emissions or make our energy use more sustainable.\n他们说，危机已经来了，但我们不愿意减少碳排放，也不愿意让能源使用变得更加可持续。</p>\n</blockquote>\n<p>实际后文和这种写法正好相反，所以A不成立。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-A-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>Energy-intensive research work is inevitable.\n能源密集型研究工作是不可避免的。</p>\n</blockquote>\n<p>把这个主旨直接代入26题题干：</p>\n<blockquote>\n<p>既然作者认为高耗能研究是不可避免的，那么作者应该对一些科学家“想要减少高耗能研究”感到震惊。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>unwillingness to cut carbon emissions\n不愿意减少碳排放</p>\n</blockquote>\n<p>“想要减少高耗能研究”和“不愿意减少碳排放”不是一回事，所以A与主旨代入题干后得到的答案不一致。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"A","sourceLine":1238,"cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":true},"focusId":"focus-q26-A-3"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. intention to reduce their research","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 26题","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-B-0\"><blockquote>\n<p>打算减少他们的研究</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>scale back</code>不认识，只能确定<code>intention to</code>对应<code>want to</code>，<code>their research</code>也完全相同，所以把B强保留，但不能立即确定。</p>\n<p><strong>选项类型：正确同义改写。</strong></p>\n<p>复盘时已经知道<code>scale back</code>就是“缩减”，因此原来缺失的最后一块对应也补上了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>some scientists want to scale back their research</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"26","option":"B","sourceLine":1258,"cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false},"focusId":"focus-q26-B-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. intention to reduce their research","level":4,"breadcrumb":"26题 / B. intention to reduce their research","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-B-0\"><blockquote>\n<p>打算减少他们的研究</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>scale back</code>不认识，只能确定<code>intention to</code>对应<code>want to</code>，<code>their research</code>也完全相同，所以把B强保留，但不能立即确定。</p>\n<p><strong>选项类型：正确同义改写。</strong></p>\n<p>复盘时已经知道<code>scale back</code>就是“缩减”，因此原来缺失的最后一块对应也补上了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>some scientists want to scale back their research</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-B-1\"><h3>定位比对法</h3><p>我们先看B里最眼熟的部分：<code>their research</code>，就是“他们的研究”。原文第一句也直接出现了<code>their research</code>，而且题干问的正是这些科学家想对研究做什么，所以B要和下面这部分比较：</p>\n<blockquote>\n<p>some scientists want to scale back their research</p>\n</blockquote>\n<p>把选项拆开以后，对应关系非常完整：</p>\n<ul>\n<li><code>intention to</code>对应<code>want to</code>；</li>\n<li><code>reduce</code>对应<code>scale back</code>；</li>\n<li><code>their research</code>与原文完全相同。</li>\n</ul>\n<p><code>scale back</code>就是“缩减”，因此原文和B说的是同一件事：一些科学家打算减少他们的研究。</p>\n<p>复盘时，我们已经知道<code>scale back</code>就是<code>reduce</code>，所以做题模式中唯一没有确认的对应现在也补全了。</p>\n<p>很多名师阅读课都会强调首句的重要性，考研英语阅读挑选的文章首句确实可以直接确定作者态度或文章主要对象甚至文章主旨，但是命题人既然知道这一点，就一定会挖坑来给首句的阅读制造障碍，例如这里的<code>scale back</code>，他完全可以再换成更少见的同义词组，防止你一眼读懂首句，所以另一种论调只要我把整本单词书的词组全背下来就没问题了，完全是错误的，因为从现实的角度看就是背不完的，并且命题人把每年阅读的生词率额度用在这里，平时你肯定是没背到的，所以首句存在阅读障碍是一件大概率事件。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"B","sourceLine":1272,"cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":false},"focusId":"focus-q26-B-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. intention to reduce their research","level":4,"breadcrumb":"26题 / B. intention to reduce their research","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-B-0\"><blockquote>\n<p>打算减少他们的研究</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>scale back</code>不认识，只能确定<code>intention to</code>对应<code>want to</code>，<code>their research</code>也完全相同，所以把B强保留，但不能立即确定。</p>\n<p><strong>选项类型：正确同义改写。</strong></p>\n<p>复盘时已经知道<code>scale back</code>就是“缩减”，因此原来缺失的最后一块对应也补上了。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>some scientists want to scale back their research</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-B-1\"><h3>定位比对法</h3><p>我们先看B里最眼熟的部分：<code>their research</code>，就是“他们的研究”。原文第一句也直接出现了<code>their research</code>，而且题干问的正是这些科学家想对研究做什么，所以B要和下面这部分比较：</p>\n<blockquote>\n<p>some scientists want to scale back their research</p>\n</blockquote>\n<p>把选项拆开以后，对应关系非常完整：</p>\n<ul>\n<li><code>intention to</code>对应<code>want to</code>；</li>\n<li><code>reduce</code>对应<code>scale back</code>；</li>\n<li><code>their research</code>与原文完全相同。</li>\n</ul>\n<p><code>scale back</code>就是“缩减”，因此原文和B说的是同一件事：一些科学家打算减少他们的研究。</p>\n<p>复盘时，我们已经知道<code>scale back</code>就是<code>reduce</code>，所以做题模式中唯一没有确认的对应现在也补全了。</p>\n<p>很多名师阅读课都会强调首句的重要性，考研英语阅读挑选的文章首句确实可以直接确定作者态度或文章主要对象甚至文章主旨，但是命题人既然知道这一点，就一定会挖坑来给首句的阅读制造障碍，例如这里的<code>scale back</code>，他完全可以再换成更少见的同义词组，防止你一眼读懂首句，所以另一种论调只要我把整本单词书的词组全背下来就没问题了，完全是错误的，因为从现实的角度看就是背不完的，并且命题人把每年阅读的生词率额度用在这里，平时你肯定是没背到的，所以首句存在阅读障碍是一件大概率事件。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-B-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>However, this is a price we must pay for understanding the world. The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.\n然而，这是我们为了理解世界必须付出的代价。技术研究产生的碳排放是值得付出的：从长远来看，这项研究将保护地球的未来。</p>\n</blockquote>\n<p>实际后文没有顺着这些科学家的主张去削减研究，而是在解释研究为什么不能简单缩减。</p>\n<p>如果B成立，后文应该这样写：</p>\n<blockquote>\n<p>However, we should not scale back necessary research simply because it consumes energy. This is a price we must pay for understanding the world.\n然而，我们不应该仅仅因为必要的研究会消耗能源，就缩减这些研究。这是我们为了理解世界必须付出的代价。</p>\n</blockquote>\n<p>显然实际后文表达的正是这个意思。因此，B与文章的写作走向完全一致。</p>\n</section>","context":{"mode":"image","
