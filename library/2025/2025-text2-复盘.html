<script>
const DATA={"steps":[{"section":0,"sectionName":"方法总览","color":"#334155","title":"省流：一石五鸟法怎么做","level":3,"breadcrumb":"0.阅前须知 / 史上最强阅读复盘法：一石五鸟法","html":"<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n","context":{"mode":"custom","label":"一石五鸟复盘路线","kind":"roadmap","html":"<div class=\"roadmap\">\n  <div><b>① 词汇</b><span>在语境里背重点词</span></div>\n  <i>→</i><div><b>② 翻译</b><span>意群口译＋长难句手译</span></div>\n  <i>→</i><div><b>③ 阅读</b><span>逐项拆解命题陷阱</span></div>\n  <i>→</i><div><b>④ 新题型</b><span>复用文章逻辑框架</span></div>\n  <i>→</i><div><b>⑤ 写作</b><span>顺手积累主题表达</span></div>\n</div>"},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":5}},{"section":0,"sectionName":"方法总览","color":"#334155","title":"一石五鸟第一鸟-积累文中重点单词带来的词汇量提升","level":4,"breadcrumb":"史上最强阅读复盘法：一石五鸟法 / 一石五鸟法的原理","html":"<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"image-20260730093937621.png\" alt=\"image-20260730093937621\"><figcaption>image-20260730093937621</figcaption></figure></p>\n<p>这样效率就是最高的。</p>\n","context":{"mode":"image","asset":"image-20260730093937621.png","label":"当前资料图","focus":null,"sourceW":1254,"sourceH":492,"fit":true},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":27}},{"section":0,"sectionName":"方法总览","color":"#334155","title":"一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升","level":4,"breadcrumb":"史上最强阅读复盘法：一石五鸟法 / 一石五鸟法的原理","html":"<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"1756291117205-85ae64db-a91a-4f77-9945-55f3e8c904f7.png\" alt=\"img\"><figcaption>img</figcaption></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n","context":{"mode":"image","asset":"1756291117205-85ae64db-a91a-4f77-9945-55f3e8c904f7.png","label":"当前资料图","focus":null,"sourceW":1287,"sourceH":747,"fit":true},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":43}},{"section":0,"sectionName":"方法总览","color":"#334155","title":"一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","level":4,"breadcrumb":"史上最强阅读复盘法：一石五鸟法 / 一石五鸟法的原理","html":"<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n","context":{"mode":"image","asset":"reviewQuestions","label":"选项复盘示例","focus":[20,45,1040,230],"sourceW":1080,"sourceH":1415},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":81}},{"section":0,"sectionName":"方法总览","color":"#334155","title":"一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":4,"breadcrumb":"史上最强阅读复盘法：一石五鸟法 / 一石五鸟法的原理","html":"<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"1756403476778-8359c476-faec-4f9e-9ecd-9db26e74ed1e.png\" alt=\"img\"><figcaption>img</figcaption></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"1756403494143-652b617d-ab7d-4c87-8a8d-c532e1097e92.png\" alt=\"img\"><figcaption>img</figcaption></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"1756403642039-8c259170-016c-4867-ac8f-bbe14a453edc.png\" alt=\"img\"><figcaption>img</figcaption></figure></p>\n\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"1756403825866-358ecd72-b6b6-439b-b037-47911fd148cd.png\" alt=\"img\"><figcaption>img</figcaption></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"1756404048929-d185c61e-cdd9-4ef6-b6be-759fb5366fe2.png\" alt=\"img\"><figcaption>img</figcaption></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"1756404000671-c8b656d6-0dc1-4bc3-afcc-7f7f9f0e1293.png\" alt=\"img\"><figcaption>img</figcaption></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n","context":{"mode":"image","asset":"1756403476778-8359c476-faec-4f9e-9ecd-9db26e74ed1e.png","label":"当前资料图","focus":null,"sourceW":858,"sourceH":678,"fit":true},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":95}},{"section":0,"sectionName":"方法总览","color":"#334155","title":"一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升","level":4,"breadcrumb":"史上最强阅读复盘法：一石五鸟法 / 一石五鸟法的原理","html":"<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n","context":{"mode":"image","asset":"annotated","label":"作文语料来自文章","focus":[30,2560,1020,1900],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":159}},{"section":0,"sectionName":"方法总览","color":"#334155","title":"为什么考研英语备考实际只需要两到三个月的有效备考工作量","level":2,"breadcrumb":"0.阅前须知","html":"<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n","context":{"mode":"custom","label":"一石五鸟复盘路线","kind":"roadmap","html":"<div class=\"roadmap\">\n  <div><b>① 词汇</b><span>在语境里背重点词</span></div>\n  <i>→</i><div><b>② 翻译</b><span>意群口译＋长难句手译</span></div>\n  <i>→</i><div><b>③ 阅读</b><span>逐项拆解命题陷阱</span></div>\n  <i>→</i><div><b>④ 新题型</b><span>复用文章逻辑框架</span></div>\n  <i>→</i><div><b>⑤ 写作</b><span>顺手积累主题表达</span></div>\n</div>"},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":167}},{"section":1,"sectionName":"第一鸟 · 词汇","color":"#b7791f","title":"第1段","level":1,"breadcrumb":"","html": e—demand significant amounts of energy both in their construction and operation. And it is equally true that science’s unrelenting appetite for information has caused a mushrooming of energy-intensive data centres around the world. According to the International Energy Agency, these buildings now consume about 1 per cent of the world’s electricity.</p></section>","context":{"mode":"image","asset":"annotated","label":"第2段原文","focus":[25,550,1030,630],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":2,"layer":"完整原文","cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"sourceLine":274},"focusId":"focus-paragraph-2-0"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第2段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-2-0\"><h3>完整原文 · 第2段</h3><p>It is unarguable that our laboratories, scientific instruments, rockets and satellites—the tools we scientists need to measure the planet’s pulse—demand significant amounts of energy both in their construction and operation. And it is equally true that science’s unrelenting appetite for information has caused a mushrooming of energy-intensive data centres around the world. According to the International Energy Agency, these buildings now consume about 1 per cent of the world’s electricity.</p></section><section class=\"revealPart\" id=\"focus-paragraph-2-1\"><h3>意群划分 · 第2段</h3><p>It is unarguable / that our laboratories, / scientific instruments, / rockets and satellites / the tools we scientists need / to measure the planet&#x27;s pulse / demand significant amounts of energy / both in their construction and operation.<br>And it is equally true / that science&#x27;s unrelenting appetite / for information / has caused a mushrooming / of energy-intensive data centres / around the world.<br>According to the International Energy Agency, / these buildings now consume / about 1 percent / of the world&#x27;s electricity.</p 策者 / 关于最佳方式 / 来降低碳排放 / 如果我们不能追踪 / 二氧化碳的数量 / 在大气中，/ 它来自哪里 / 以及谁在产生它？<br>碳排放 / 来自技术研究的 / 是值得的：/ 最终这项研究 / 将保护 / 我们星球的未来。</p></section>","context":{"mode":"image","asset":"annotated","label":"第3段原文","focus":[25,1200,1030,700],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":3,"layer":"意群翻译","cumulative":true,"cumulativeGroup":"paragraph-3","cumulativeFinal":false,"sourceLine":319},"focusId":"focus-paragraph-3-2"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第3段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-3-0\"><h3>完整原文 · 第3段</h3><p>However, this is a price we must pay for understanding the world. How can we inform decision makers about the best ways to bring down carbon emissions if we can’t track the amount of carbon dioxide in the atmosphere, where it’s coming from and who’s producing it? The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-1\"><h3>意群划分 · 第3段</h3><p>However, / this is a price / we must pay / for understanding the world.<br>How can we inform / decision makers / about the best ways / to bring down carbon emissions / if we can&#x27;t track / the amount of carbon dioxide / in the atmosphere, / where it&#x27;s coming from / and who&#x27;s producing it?<br>The carbon emissions / from technological research / are well spent: / ultimately this research / will safeguard / the future of our planet.</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-2\"><h3>意群翻译 · 第3段</h3><p>然而，/ 这是一个代价 / 我们必须付出 / 为了理解世界。<br>我们如何能告知 / 决策者 / 关于最佳方式 / 来降低碳排放 / 如果我们不能追踪 / 二氧化碳的数量 / 在大气中，/ 它来自哪里 / 以及谁在产生它？<br>碳排放 / 来自技术研究的 / 是值得的：/ 最终这项研究 / 将保护 / 我们星球的未来。</p></section><section class=\"revealPart\" id=\"focus-paragraph-3-3\"><h3>标准译文 · 第3段</h3><p>然而，这是我们为了理解世界必须付出的代价。如果我们不能追踪大气中二氧化碳的含量、来源和产生者，我们又如何能告知决策者降低碳排放的最佳方式呢？技术研究产生的碳排放是值得的 e are to solve / humanity&#x27;s greatest challenges.<br>It is all too easy / to feel paralysed / in the face of / daunting problems / such as climate change / and to do nothing.<br>But then I think of / a friend&#x27;s daughter / who turned her fears / into action: / she became / a wind energy engineer / and now thrives on / delivering renewable energy, / limiting emissions.</p></section>","context":{"mode":"image","asset":"annotated","label":"第4段原文","focus":[25,1930,1030,750],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":4,"layer":"意群划分","cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":false,"sourceLine":290},"focusId":"focus-paragraph-4-1"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第4段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-4-0\"><h3>完整原文 · 第4段</h3><p>It can be hard for scientists to make the case because our work is complex, often takes place behind closed doors and does not always lend itself to easy interpretation or explanation. But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.</p></section><section class=\"revealPart\" id=\"focus-paragraph-4-1\"><h3>意群划分 · 第4段</h3><p>It can be hard / for scientists / to make the case / because our work is complex, / often takes place / behind closed doors / and does not always lend itself / to easy interpretation or explanation.<br>But demonstrating / the efficacy of science / will be crucial / if we are to solve / humanity&#x27;s greatest challenges.<br>It is all too easy / to feel paralysed / in the face of / daunting problems / such as climate change / and to do nothing.<br>But then I think of / a friend&#x27;s daughter / who turned her fears / into action: / she became / a wind energy engineer / and now thrives on / delivering renewable energy, / limiting emissions.</p></section><section class=\"revealPart\" id=\"focus-paragraph-4-2\"> 科学的功效 / 将是至关重要的 / 如果我们要解决 / 人类最大的挑战。<br>太容易了 / 感到瘫痪 / 面对 / 令人生畏的问题 / 比如气候变化 / 并且什么都不做。<br>但随后我想到 / 一个朋友的女儿 / 她把恐惧转化 / 为行动：/ 她成为了 / 一名风能工程师 / 现在致力于 / 提供可再生能源，/ 限制排放。</p></section><section class=\"revealPart\" id=\"focus-paragraph-4-3\"><h3>标准译文 · 第4段</h3><p>科学家很难为自己的工作辩护，因为我们的工作复杂，经常在幕后进行，并不总是容易解释或说明。但如果我们要解决人类最大的挑战，展示科学的功效将是至关重要的。面对气候变化等令人生畏的问题，人们太容易感到无能为力而无所作为。但我想到了朋友的女儿，她把恐惧转化为行动：成为了一名风能工程师，现在致力于提供可再生能源，限制排放。</p></section>","context":{"mode":"image","asset":"annotated","label":"第4段原文","focus":[25,1930,1030,750],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":4,"layer":"标准译文","cumulative":true,"cumulativeGroup":"paragraph-4","cumulativeFinal":true,"sourceLine":348},"focusId":"focus-paragraph-4-3"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第5段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3><p>Recognising the hope that science and engineering can bring was the impetus behind the creation of the Millennium Technology Prize, which is now entering its 20th year as a celebration of human ingenuity. One of the past winners, Professor Martin Green from the University of New South Wales, Australia, is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world’s solar panels. Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p></section>","context":{"mode":"image","asset":"annotated","label":"第5段原文","focus":[25,2690,1030,830],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":5,"layer":"完整原文","cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false,"sourceLine":274},"focusId":"focus-paragraph-5-0"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第5段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3><p>Recognising the hope that science and d Rear Cell technology which is now found in most of the world’s solar panels. Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3><p>Recognising the hope / that science and engineering can bring / was the impetus / behind the creation / of the Millennium Technology Prize, / which is now entering / its 20th year / as a celebration / of human ingenuity.<br>One of the past winners, / Professor Martin Green / from the University of New South Wales, Australia, / is the inventor / of the Passivated Emitter and Rear Cell technology / which is now found / in most of the world&#x27;s solar panels.<br>Thanks to his invention, / we have a real chance / to decrease / the world&#x27;s carbon emissions.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3><p>认识到希望 / 科学和工程能带来的 / 是推动力 / 在创建背后 / 千年技术奖的，/ 现在正进入 / 它的第20年 / 作为庆祝 / 人类创造力的。<br>过去的获奖者之一，/ 马丁·格林教授 / 来自澳大利亚新南威尔士大学，/ 是发明者 / 钝化发射极和背面电池技术的 / 现在被发现 / 在世界上大多数太阳能电池板中。<br>多亏了他的发明，/ 我们有真正的机会 / 来减少 / 世界的碳排放。</p></section>","context":{"mode":"image","asset":"annotated","label":"第5段原文","focus":[25,2690,1030,830],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":5,"layer":"意群翻译","cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":false,"sourceLine":319},"focusId":"focus-paragraph-5-2"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第5段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-5-0\"><h3>完整原文 · 第5段</h3><p>Recognising the hope that science and engineering can bring was the impetus behind the creation of the Millennium Technology Prize, which is now entering its 20th year as a celebration of human ingenuity. One of the past winners, Professor Martin Green from the University of New South Wales, Australia, is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world’s solar panels. Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-1\"><h3>意群划分 · 第5段</h3><p>Recognising the hope / that science and engineering can bring / was the impetus / behind the creation / of the Millennium Technology Prize, / which is now entering / its 20th year / as a celebration / of human ingenuity.<br>One of the past winners, / Professor Martin Green / from the University of New South Wales, Australia, / is the inventor / of the Passivated Emitter and Rear Cell technology / which is now found / in most of the world&#x27;s solar panels.<br>Thanks to his invention, / we have a real chance / to decrease / the world&#x27;s carbon emissions.</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-2\"><h3>意群翻译 · 第5段</h3><p>认识到希望 / 科学和工程能带来的 / 是推动力 / 在创建背后 / 千年技术奖的，/ 现在正进入 / 它的第20年 / 作为庆祝 / 人类创造力的。<br>过去的获奖者之一，/ 马丁·格林教授 / 来自澳大利亚新南威尔士大学，/ 是发明者 / 钝化发射极和背面电池技术的 / 现在被发现 / 在世界上大多数太阳能电池板中。<br>多亏了他的发明，/ 我们有真正的机会 / 来减少 / 世界的碳排放。</p></section><section class=\"revealPart\" id=\"focus-paragraph-5-3\"><h3>标准译文 · 第5段</h3><p>认识到科学和工程能带来的希望，推动了千年技术奖的创立，该奖项现在已进入第20个年头，是对人类创造力的庆祝。过去的获奖者之一，来自澳大利亚新南威尔士大学的马丁·格林教授，发明了钝化发射极和背面电池技术，这项技术现在应用于世界上大多数太阳能电池板。多亏了他的发明，我们有了真正减少全球碳排放的机会。</p></section>","context":{"mode":"image","asset":"annotated","label":"第5段原文","focus":[25,2690,1030,830],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":5,"layer":"标准译文","cumulative":true,"cumulativeGroup":"paragraph-5","cumulativeFinal":true,"sourceLine":348},"focusId":"focus-paragraph-5-3"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第6段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3><p>Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence. A great example of this is Europe’s largest supercomputer, LUMI in Finland, which is astonishingly carbon-negative. Established in an old paper mill, it is powered by a nearby river and its remote heat warms the people who live in the surrounding town of Kajaani.</p></section>","context":{"mode":"image","asset":"annotated","label":"第6段原文","focus":[25,3550,1030,620],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":6,"layer":"完整原文","cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"sourceLine":274},"focusId":"focus-paragraph-6-0"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第6段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3><p>Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence. A great example of this is Europe’s largest supercomputer, LUMI in Finland, which is astonishingly carbon-negative. Established in an old paper mill, it is powered by a nearby river and its remote heat warms the people who live in the surrounding town of Kajaani.</p></section><section class=\"revealPart\" id=\"focus-paragraph-6-1\"><h3>意群划分 · 第6段</h3><p>Every day, / scientists, technologists and engineers / are discovering new ways / to exploit renewable energy sources / and develop techniques / not just to use power more intelligently / but to power our intelligence.<br>A great example of this / is Europe&#x27;s largest supercomputer, / LUMI in Finland, / which is astonishingly carbon-negative.<br>Established in an old paper mill, / it is powered by a nearby river / and its remote heat / warms the people / who live in the surrounding town / of Kajaani.</p></section>","context":{"mode":"image","asset":"annotated","label":"第6段原文","focus":[25,3550,1030,620],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":6,"layer":"意群划分","cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"sourceLine":290},"focusId":"focus-paragraph-6-1"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第6段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3><p>Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence. A great example of this is Europe’s largest supercomputer, LUMI in Finland, which is astonishingly carbon-negative. Established in an old paper mill, it is powered by a nearby river and its remote heat warms the people who live in the surrounding town of Kajaani.</p></section><section class=\"revealPart\" id=\"focus-paragraph-6-1\"><h3>意群划分 · 第6段</h3><p>Every day, / scientists, technologists and engineers / are discovering new ways / to exploit renewable energy sources / and develop techniques / not just to use power more intelligently / but to power our intelligence.<br>A great example of this / is Europe&#x27;s largest supercomputer, / LUMI in Finland, / which is astonishingly carbon-negative.<br>Established in an old paper mill, / it is powered by a nearby river / and its remote heat / warms the people / who live in the surrounding town / of Kajaani.</p></section><section class=\"revealPart\" id=\"focus-paragraph-6-2\"><h3>意群翻译 · 第6段</h3><p>每天，/ 科学家、技术专家和工程师 / 正在发现新方法 / 来开发可再生能源 / 并开发技术 / 不仅更智能地使用能源 / 而且为我们的智能提供动力。<br>一个很好的例子 / 是欧洲最大的超级计算机，/ 位于芬兰的LUMI，/ 它令人惊讶地是碳负排放的。<br>建立在一个旧造纸厂，/ 它由附近的河流供电 / 它的废热 / 温暖着人们 / 住在周围城镇的 / 卡亚尼。</p></section>","context":{"mode":"image","asset":"annotated","label":"第6段原文","focus":[25,3550,1030,620],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":6,"layer":"意群翻译","cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false,"sourceLine":319},"focusId":"focus-paragraph-6-2"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第6段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3><p>Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence. A great example of this is Europe’s largest supercomputer, LUMI in Finland, which is astonishingly carbon-negative. Established in an old paper mill, it is powered by a nearby river and its remote heat warms the people who live in the surrounding town of Kajaani.</p></section><section class=\"revealPart\" id=\"focus-paragraph-6-1\"><h3>意群划分 · 第6段</h3><p>Every day, / scientists, technologists and engineers / are discovering new ways / to exploit renewable energy sources / and develop techniques / not just to use power more intelligently / but to power our intelligence.<br>A great example of this / is Europe&#x27;s largest supercomputer, / LUMI in Finland, / which is astonishingly carbon-negative.<br>Established in an old paper mill, / it is powered by a nearby river / and its remote heat / warms the people / who live in the surrounding town / of Kajaani.</p></section><section class=\"revealPart\" id=\"focus-paragraph-6-2\"><h3>意群翻译 · 第6段</h3><p>每天，/ 科学家、技术专家和工程师 / 正在发现新方法 / 来开发可再生能源 / 并开发技术 / 不仅更智能地使用能源 / 而且为我们的智能提供动力。<br>一个很好的例子 / 是欧洲最大的超级计算机，/ 位于芬兰的LUMI，/ 它令人惊讶地是碳负排放的。<br>建立在一个旧造纸厂，/ 它由附近的河流供电 / 它的废热 / 温暖着人们 / 住在周围城镇的 / 卡亚尼。</p></section><section class=\"revealPart\" id=\"focus-paragraph-6-3\"><h3>标准译文 · 第6段</h3><p>每天，科学家、技术专家和工程师都在发现新方法来开发可再生能源，开发技术不仅更智能地使用能源，而且为我们的智能提供动力。一个很好的例子是欧洲最大的超级计算机——位于芬兰的LUMI，它令人惊讶地实现了碳负排放。它建在一个旧造纸厂里，由附近的河流供电，其废热还能为卡亚尼镇的居民供暖。</p></section>","context":{"mode":"image","asset":"annotated","label":"第6段原文","focus":[25,3550,1030,620],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":6,"layer":"标准译文","cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":true,"sourceLine":348},"focusId":"focus-paragraph-6-3"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第7段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-7-0\"><h3>完整原文 · 第7段</h3><p>If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs.</p></section>","context":{"mode":"image","asset":"annotated","label":"第7段原文","focus":[25,4170,1030,300],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":7,"layer":"完整原文","cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":false,"sourceLine":274},"focusId":"focus-paragraph-7-0"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第7段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-7-0\"><h3>完整原文 · 第7段</h3><p>If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs.</p></section><section class=\"revealPart\" id=\"focus-paragraph-7-1\"><h3>意群划分 · 第7段</h3><p>If the world is to meet / its net-zero ambitions, / we must think hard / about how we can deliver / sustainable computing / and deliver more LUMIs.</p></section>","context":{"mode":"image","asset":"annotated","label":"第7段原文","focus":[25,4170,1030,300],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":7,"layer":"意群划分","cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":false,"sourceLine":290},"focusId":"focus-paragraph-7-1"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第7段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-7-0\"><h3>完整原文 · 第7段</h3><p>If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs.</p></section><section class=\"revealPart\" id=\"focus-paragraph-7-1\"><h3>意群划分 · 第7段</h3><p>If the world is to meet / its net-zero ambitions, / we must think hard / about how we can deliver / sustainable computing / and deliver more LUMIs.</p></section><section class=\"revealPart\" id=\"focus-paragraph-7-2\"><h3>意群翻译 · 第7段</h3><p>如果世界要实现 / 它的净零目标，/ 我们必须认真思考 / 关于我们如何能提供 / 可持续计算 / 并提供更多的LUMI。</p></section>","context":{"mode":"image","asset":"annotated","label":"第7段原文","focus":[25,4170,1030,300],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":7,"layer":"意群翻译","cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":false,"sourceLine":319},"focusId":"focus-paragraph-7-2"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"第7段","level":3,"breadcrumb":"逐句逐段分析","html":"<section class=\"revealPart\" id=\"focus-paragraph-7-0\"><h3>完整原文 · 第7段</h3><p>If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs.</p></section><section class=\"revealPart\" id=\"focus-paragraph-7-1\"><h3>意群划分 · 第7段</h3><p>If the world is to meet / its net-zero ambitions, / we must think hard / about how we can deliver / sustainable computing / and deliver more LUMIs.</p></section><section class=\"revealPart\" id=\"focus-paragraph-7-2\"><h3>意群翻译 · 第7段</h3><p>如果世界要实现 / 它的净零目标，/ 我们必须认真思考 / 关于我们如何能提供 / 可持续计算 / 并提供更多的LUMI。</p></section><section class=\"revealPart\" id=\"focus-paragraph-7-3\"><h3>标准译文 · 第7段</h3><p>如果世界要实现净零排放目标，我们必须认真思考如何提供可持续计算，并建造更多像LUMI这样的设施。</p></section>","context":{"mode":"image","asset":"annotated","label":"第7段原文","focus":[25,4170,1030,300],"sourceW":1080,"sourceH":6116},"meta":{"kind":"translation-layer","paragraph":7,"layer":"标准译文","cumulative":true,"cumulativeGroup":"paragraph-7","cumulativeFinal":true,"sourceLine":348},"focusId":"focus-paragraph-7-3"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"文章的句内逻辑（大家自行根据需求阅读）","level":2,"breadcrumb":"2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升","html":"<p>我们采用了一种借鉴数学里符号解析的方式，将划分的意群之间的逻辑关系用逻辑符号连接起来，展现了我们处理长难句意群的思维过程，可以只凭自学就秒杀那些长难句讲解的网课，一个长难句的逻辑只要看我们的符号分析即可一下子看懂，这部分由于时间原因大家自行阅读即可。最后大家注意一下这部分并不要求大家自己写出来跟我们一模一样的，就是单纯给大家的纯用于阅读的材料而已。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：句子继续往下走，表示主要叙述顺序；</li>\n<li><code>+</code>：几个内容并列；</li>\n<li><code>：</code>：后面解释、修饰或补充前面的内容；</li>\n<li><code>//</code>：转折或成对结构。</li>\n<li>小括号或大括号：跟数学里一样，包住的表示一个整体。</li>\n</ul>\n<p>注意这里的符号逻辑是帮助大家理解的，不是让你真的备考或者考试的时候像做数学一样非要写出来，脑子里大致有这个意思就行。</p>\n","context":{"mode":"image","asset":"annotated","label":"全文精读","focus":[30,20,1020,4480],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":364}},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"句子逻辑梳理（选修，按照自身语法基础而定）","level":3,"breadcrumb":"文章的句内逻辑","html":"<div class=\"wholeArticleLogic logicEnglish\"><section class=\"logicParagraph\"><p>I was shocked to learn recently：(that some scientists want to scale back → their research：(in an effort to decrease → carbon emissions)).<br>The crisis is here → they said + we need to cut back：(on our energy-intensive modelling).<br>At the very least → we need to make → our energy use → far more sustainable.</p></section><section class=\"logicParagraph\"><p>It is unarguable：(that our laboratories + scientific instruments + rockets and satellites：(the tools we scientists need：(to measure the planet&#x27;s pulse)) → demand significant amounts of energy：(both in their construction and operation)).<br>And it is equally true：(that science&#x27;s unrelenting appetite：(for information) → has caused a mushrooming：(of energy-intensive data centres：(around the world))).<br>According to the International Energy Agency → these buildings now consume → about 1 percent：(of the world&#x27;s electricity).</p></section><section class=\"logicParagraph\"><p>However // this is a price：(we must pay：(for understanding the world)).<br>How can we inform → decision makers：(about the best ways：(to bring down carbon emissions)) → if we can&#x27;t track：(the amount of carbon dioxide：(in the atmosphere) + where it&#x27;s coming from + who&#x27;s producing it)?<br>The carbon emissions：(from technological research) → are well spent：ultimately this research → will safeguard → the future of our planet.</p></section><section class=\"logicParagraph\"><p>It can be hard：(for scientists)：(to make the case) → because our work is complex + often takes place：(behind closed doors) + does not always lend itself：(to easy interpretation or explanation).<br>But demonstrating：(the efficacy of science) → will be crucial：(if we are to solve → humanity&#x27;s greatest challenges).<br>It is all too easy → to feel paralysed：(in the face of：(daunting problems：(such as climate change))) + to do nothing.<br>But then I think of → a friend&#x27;s daughter：(who turned her fears → into action)：she became → a wind energy engineer + now thrives on：(delivering renewable energy + limiting emissions).</p></section><section class=\"logicParagraph\"><p>Recognising the hope：(that science and engineering can bring) → was the impetus：(behind the creation：(of the Millennium Technology Prize))：(which is now entering → its 20th year：(as a celebration：(of human ingenuity))).<br>One of the past winners：(Professor Martin Green：(from the University of New South Wales, Australia)) → is the inventor：(of the Passivated Emitter and Rear Cell technology)：(which is now found → in most of the world&#x27;s solar panels).<br>Thanks to his invention → we have a real chance → to decrease → the world&#x27;s carbon emissions.</p></section><section class=\"logicParagraph\"><p>Every day → scientists, technologists and engineers → are discovering new ways：(to exploit renewable energy sources) + develop techniques：(not just to use power more intelligently // but to power our intelligence).<br>A great example of this → is Europe&#x27;s largest supercomputer：(LUMI in Finland)：(which is astonishingly carbon-negative).<br>Established in an old paper mill → it is powered by a nearby river + its remote heat → warms the people：(who live in the surrounding town：(of Kajaani)).</p></section><section class=\"logicParagraph\"><p>If the world is to meet → its net-zero ambitions → we must think hard：(about how we can deliver → sustainable computing + deliver more LUMIs).</p></section></div>","context":{"mode":"image","asset":"annotated","label":"全文精读","focus":[30,20,1020,4480],"sourceW":1080,"sourceH":6116},"meta":{"kind":"whole-article-logic","question":null,"option":null,"sourceLine":378}},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"中文版句子逻辑（选修）","level":3,"breadcrumb":"文章的句内逻辑","html":"<div class=\"wholeArticleLogic logicChinese\"><section class=\"logicParagraph\"><p>我最近震惊地得知：(一些科学家想要缩减 → 他们的研究：(为了努力减少 → 碳排放))。<br>危机就在眼前 → 他们说 + 我们需要削减：(我们的能源密集型建模)。<br>至少 → 我们需要让 → 我们的能源使用 → 变得更加可持续。</p></section><section class=\"logicParagraph\"><p>无可争辩的是：(我们的实验室 + 科学仪器 + 火箭和卫星：(我们科学家需要的工具：(来测量地球的脉搏)) → 需要大量的能源：(在它们的建造和运行中))。<br>同样真实的是：(科学永不满足的胃口：(对信息的) → 已经导致了激增：(能源密集型数据中心的：(在世界各地)))。<br>根据国际能源署 → 这些建筑现在消耗 → 大约1%：(世界电力的)。</p></section><section class=\"logicParagraph\"><p>然而 // 这是一个代价：(我们必须付出：(为了理解世界))。<br>我们如何能告知 → 决策者：(关于最佳方式：(来降低碳排放)) → 如果我们不能追踪：(二氧化碳的数量：(在大气中) + 它来自哪里 + 谁在产生它)？<br>碳排放：(来自技术研究的) → 是值得的：最终这项研究 → 将保护 → 我们星球的未来。</p></section><section class=\"logicParagraph\"><p>可能很困难：(对科学家来说)：(来证明其合理性) → 因为我们的工作很复杂 + 经常进行：(在闭门之后) + 并不总是适合：(简单的解释或说明)。<br>但展示：(科学的功效) → 将是至关重要的：(如果我们要解决 → 人类最大的挑战)。<br>太容易了 → 感到瘫痪：(面对：(令人生畏的问题：(比如气候变化))) + 什么都不做。<br>但随后我想到 → 一个朋友的女儿：(她把恐惧转化 → 为行动)：她成为了 → 一名风能工程师 + 现在致力于：(提供可再生能源 + 限制排放)。</p></section><section class=\"logicParagraph\"><p>认识到希望：(科学和工程能带来的) → 是推动力：(在创建背后：(千年技术奖的))：(现在正进入 → 它的第20年：(作为庆祝：(人类创造力的)))。<br>过去的获奖者之一：(马丁·格林教授：(来自澳大利亚新南威尔士大学)) → 是发明者：(钝化发射极和背面电池技术的)：(现在被发现 → 在世界上大多数太阳能电池板中)。<br>多亏了他的发明 → 我们有真正的机会 → 来减少 → 世界的碳排放。</p></section><section class=\"logicParagraph\"><p>每天 → 科学家、技术专家和工程师 → 正在发现新方法：(来开发可再生能源) + 开发技术：(不仅更智能地使用能源 // 而且为我们的智能提供动力)。<br>一个很好的例子 → 是欧洲最大的超级计算机：(位于芬兰的LUMI)：(它令人惊讶地是碳负排放的)。<br>建立在一个旧造纸厂 → 它由附近的河流供电 + 它的废热 → 温暖着人们：(住在周围城镇的：(卡亚尼))。</p></section><section class=\"logicParagraph\"><p>如果世界要实现 → 它的净零目标 → 我们必须认真思考：(关于我们如何能提供 → 可持续计算 + 提供更多的LUMI)。</p></section></div>","context":{"mode":"image","asset":"annotated","label":"全文精读","focus":[30,20,1020,4480],"sourceW":1080,"sourceH":6116},"meta":{"kind":"whole-article-logic","question":null,"option":null,"sourceLine":407}},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"长难句翻译练习（英一必修，英二选修）","level":2,"breadcrumb":"2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升","html":"<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并起来；</li>\n<li>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；</li>\n<li>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。</li>\n</ol>\n","context":{"mode":"image","asset":"annotated","label":"全文精读","focus":[30,20,1020,4480],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":433}},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"1. 第二段第一句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 1. 第二段第一句","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文</h3><blockquote>\n<p>It is unarguable that our laboratories, scientific instruments, rockets and satellites—the tools we scientists need to measure the planet's pulse—demand significant amounts of energy both in their construction and operation.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第二段第一句","focus":[30,500,1020,275],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":445,"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-0"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"1. 第二段第一句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 1. 第二段第一句","html ote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第二段第一句","focus":[30,500,1020,275],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":453,"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-2"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"1. 第二段第一句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 1. 第二段第一句","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文</h3><blockquote>\n<p>It is unarguable that our laboratories, scientific instruments, rockets and satellites—the tools we scientists need to measure the planet's pulse—demand significant amounts of energy both in their construction and operation.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>It is unarguable / that our laboratories, / scientific instruments, / rockets and satellites / the tools we scientists need / to measure the planet's pulse / demand significant amounts of energy / both in their construction and operation.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>无可争辩的是 / 我们的实验室、/ 科学仪器、/ 火箭和卫星 / 我们科学家需要的工具 / 来测量地球的脉搏 / 需要大量的能源 / 在它们的建造和运行中。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-3\"><h3>第三步：按照中文语感合并意群</h3><p>第一组：</p>\n<blockquote>\n<p>我们的实验室、/ 科学仪器、/ 火箭和卫星</p>\n</blockquote>\n<p>这几个意群列举的是同一类东西，可以直接合并成：</p>\n<blockquote>\n<p>我们的实验室、科学仪器、火箭和卫星</p>\n</blockquote>\n<p>第二组：</p>\n<blockquote>\n<p>我们科学家需要的工具 / 来测量地球的脉搏</p>\n</blockquote>\n<p>“来测量地球的脉搏”说明科学家为什么需要这些工具。中文一般把这种说明放到“工具”前面，所以合并成：</p>\n<blockquote>\n<p>我们科学家用来测量地球脉搏所需要的工具</p>\n</blockquote>\n<p>第三组：</p>\n<blockquote>\n<p>需要大量的能源 / 在它们的建造和运行中</p>\n</blockquote>\n<p>中文习惯先说在什么过程中，再说需要多少能源，所以合并成：</p>\n<blockquote>\n<p>在它们的建造和运行中需要大量能源</p>\n</blockquote>\n<p>合并以后，我们得到几块内容：</p>\n<blockquote>\n<p>无可争辩的是\n我们的实验室、科学仪器、火箭和卫星\n我们科学家用来测量地球脉搏所需要的工具\n在它们的建造和运行中需要大量能源</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第二段第一句","focus":[30,500,1020,275],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":457,"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-3"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"1. 第二段第一句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 1. 第二段第一句","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文</h3><blockquote>\n<p>It is unarguable that our laboratories, scientific instruments, rockets and satellites—the tools we scientists need to measure the planet's pulse—demand significant amounts of energy both in their construction and operation.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>It is unarguable / that our laboratories, / scientific instruments, / rockets and satellites / the tools we scientists need / to measure the planet's pulse / demand significant amounts of energy / both in their construction and operation.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>无可争辩的是 / 我们的实验室、/ 科学仪器、/ 火箭和卫星 / 我们科学家需要的工具 / 来测量地球的脉搏 / 需要大量的能源 / 在它们的建造和运行中。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-3\"><h3>第三步：按照中文语感合并意群</h3><p>第一组：</p>\n<blockquote>\n<p>我们的实验室、/ 科学仪器、/ 火箭和卫星</p>\n</blockquote>\n<p>这几个意群列举的是同一类东西，可以直接合并成：</p>\n<blockquote>\n<p>我们的实验室、科学仪器、火箭和卫星</p>\n</blockquote>\n<p>第二组：</p>\n<blockquote>\n<p>我们科学家需要的工具 / 来测量地球的脉搏</p>\n</blockquote>\n<p>“来测量地球的脉搏”说明科学家为什么需要这些工具。中文一般把这种说明放到“工具”前面，所以合并成：</p>\n<blockquote>\n<p>我们科学家用来测量地球脉搏所需要的工具</p>\n</blockquote>\n<p>第三组：</p>\n<blockquote>\n<p>需要大量的能源 / 在它们的建造和运行中</p>\n</blockquote>\n<p>中文习惯先说在什么过程中，再说需要多少能源，所以合并成：</p>\n<blockquote>\n<p>在它们的建造和运行中需要大量能源</p>\n</blockquote>\n<p>合并以后，我们得到几块内容：</p>\n<blockquote>\n<p>无可争辩的是\n我们的实验室、科学仪器、火箭和卫星\n我们科学家用来测量地球脉搏所需要的工具\n在它们的建造和运行中需要大量能源</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3><p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>实验室、科学仪器、火箭和卫星需要大量能源。</p>\n</blockquote>\n<p>“无可争辩的是”放在整个骨干前面。“我们科学家用来测量地球脉搏所需要的工具”是在解释前面的实验室、仪器、火箭和卫星，所以放在这些东西后面，用破折号隔开。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>无可争辩的是，我们的实验室、科学仪器、火箭和卫星——这些是我们科学家用来测量地球脉搏所需要的工具——在建造和运行过程中都需要大量能源。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第二段第一句","focus":[30,500,1020,275],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":490,"cumulative":true,"cumulativeGroup":"long-1","cumulativeFinal":false},"focusId":"focus-long-1-4"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"1. 第二段第一句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 1. 第二段第一句","html":"<section class=\"revealPart\" id=\"focus-long-1-0\"><h3>原文</h3><blockquote>\n<p>It is unarguable that our laboratories, scientific instruments, rockets and satellites—the tools we scientists need to measure the planet's pulse—demand significant amounts of energy both in their construction and operation.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>It is unarguable / that our laboratories, / scientific instruments, / rockets and satellites / the tools we scientists need / to measure the planet's pulse / demand significant amounts of energy / both in their construction and operation.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>无可争辩的是 / 我们的实验室、/ 科学仪器、/ 火箭和卫星 / 我们科学家需要的工具 / 来测量地球的脉搏 / 需要大量的能源 / 在它们的建造和运行中。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-1-3\"><h3>第三步：按照中文语感合并意群</h3><p>第一组：</p>\n<blockquote>\n<p>我们的实验室、/ 科学仪器、/ 火箭和卫星</p>\n</blockquote>\n<p>这几个意群列举的是同一类东西，可以直接合并成：</p>\n<blockquote>\n<p>我们的实 ><section class=\"revealPart\" id=\"focus-long-3-2\"><h3>第二步：逐个意群直译</h3><blockquote>\n<p>认识到希望 / 科学和工程能带来的 / 是推动力 / 在创建背后 / 千年技术奖的，/ 现在正进入 / 它的第20年 / 作为庆祝 / 人类创造力的。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-3\"><h3>第三步：按照中文语感合并意群</h3><p>先合并前两个意群：</p>\n<blockquote>\n<p>认识到希望 / 科学和工程能带来的</p>\n</blockquote>\n<p>中文把修饰“希望”的内容放在前面，所以合并成：</p>\n<blockquote>\n<p>认识到科学和工程能够带来的希望</p>\n</blockquote>\n<p>接着合并：</p>\n<blockquote>\n<p>是推动力 / 在创建背后 / 千年技术奖的</p>\n</blockquote>\n<p>中文需要把“千年技术奖的创建”放到“背后”前面，所以合并成：</p>\n<blockquote>\n<p>是千年技术奖创建背后的推动力</p>\n</blockquote>\n<p>再合并后半部分：</p>\n<blockquote>\n<p>现在正进入 / 它的第20年</p>\n</blockquote>\n<p>合并成：</p>\n<blockquote>\n<p>现在正进入它的第20个年头</p>\n</blockquote>\n<p>最后两块：</p>\n<blockquote>\n<p>作为庆祝 / 人类创造力的</p>\n</blockquote>\n<p>中文要把修饰内容放在“庆祝”前面，所以合并成：</p>\n<blockquote>\n<p>作为对人类创造力的庆祝</p>\n</blockquote>\n<p>现在得到四块内容：</p>\n<blockquote>\n<p>认识到科学和工程能够带来的希望\n是千年技术奖创建背后的推动力\n现在正进入它的第20个年头\n作为对人类创造力的庆祝</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第五段第一句","focus":[30,2630,1020,350],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":614,"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":false},"focusId":"focus-long-3-3"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"3. 第五段第一句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 3. 第五段第一句","html":"<section class=\"revealPart\" id=\"focus-long-3-0\"><h3>原文</h3><blockquote>\n<p>Recognising the hope that science and engineering can bring was the impetus behind the creation of the Millennium Technology Prize, which is now entering its 20th year as a celebration of human ingenuity.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-3-1\"><h3>第一步：划分意群</h3><blockquote>\n<p>Recognising the hope / that science and engineering can bring / was the impetus / behind the creation / of the Millennium Technology Prize, / which is now entering / ote>\n</section><section class=\"revealPart\" id=\"focus-long-3-5\"><h3>第五步：艺术加工</h3><p>第四步中“认识到……是推动力”有些生硬，可以把动作的发出者补出来，再用“这一认识”承接：</p>\n<blockquote>\n<p>人们认识到科学和工程能够带来希望，这一认识推动了千年技术奖的创设。</p>\n</blockquote>\n<p>“作为对人类创造力的庆祝”也不够自然，可以处理成：</p>\n<blockquote>\n<p>这一奖项旨在赞颂人类的创造力。</p>\n</blockquote>\n<p>“进入第20个年头”进一步润色成“正步入第20个年头”。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>人们认识到科学和工程能够带来希望，这一认识推动了千年技术奖的创设；这一奖项旨在赞颂人类的创造力，如今正步入第20个年头。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第五段第一句","focus":[30,2630,1020,350],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":671,"cumulative":true,"cumulativeGroup":"long-3","cumulativeFinal":true},"focusId":"focus-long-3-5"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"4. 第五段第二句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 4. 第五段第二句","html":"<section class=\"revealPart\" id=\"focus-long-4-0\"><h3>原文</h3><blockquote>\n<p>One of the past winners, Professor Martin Green from the University of New South Wales, Australia, is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world's solar panels.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第五段第二句","focus":[30,2920,1020,440],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":689,"cumulative":true,"cumulativeGroup":"long-4","cumulativeFinal":false},"focusId":"focus-long-4-0"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"4. 第五段第二句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 4. 第五段第二句","html":"<section class=\"revealPart\" id=\"focus-long-4-0\"><h3>原文</h3><blockquote>\n<p>One of the past winners, Professor Martin Green from the University of New South Wales, Australia, is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world's solar panels.</p>\n</blockquote>\n</section><section n<p>现在得到三块内容：</p>\n<blockquote>\n<p>过去的获奖者之一、来自澳大利亚新南威尔士大学的马丁·格林教授\n是钝化发射极和背面电池技术的发明者\n现在可以在世界上大多数太阳能电池板中找到</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-4\"><h3>第四步：寻找句子骨干并按照中文语序调整</h3><p>接着找句子骨干：</p>\n<blockquote>\n<p>马丁·格林教授是这项技术的发明者。</p>\n</blockquote>\n<p>第三块的主语并不是Green教授，而是前面的“这项技术”。因此，要把它接在技术后面：</p>\n<blockquote>\n<p>过去的获奖者之一、来自澳大利亚新南威尔士大学的马丁·格林教授，是钝化发射极和背面电池技术的发明者；这项技术现在可以在世界上大多数太阳能电池板中找到。</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-long-4-5\"><h3>第五步：艺术加工</h3><p>第四步中的“是……的发明者”可以改成更直接的主动表达：</p>\n<blockquote>\n<p>发明了钝化发射极和背面电池技术。</p>\n</blockquote>\n<p><code>be found in</code>在这里说的是一项技术被太阳能电池板采用，不是真的“在里面找到”。因此调整为：</p>\n<blockquote>\n<p>世界上大多数太阳能电池板都采用了这项技术。</p>\n</blockquote>\n<p>“过去的获奖者”也可以润色为更自然的“往届获奖者”。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>往届获奖者之一、来自澳大利亚新南威尔士大学的马丁·格林教授，发明了钝化发射极和背面电池技术；如今，世界上大多数太阳能电池板都采用了这项技术。</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第五段第二句","focus":[30,2920,1020,440],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":743,"cumulative":true,"cumulativeGroup":"long-4","cumulativeFinal":true},"focusId":"focus-long-4-5"},{"section":2,"sectionName":"第二鸟 · 精读与翻译","color":"#2563eb","title":"5. 第六段第一句","level":4,"breadcrumb":"长难句翻译练习（英一必修，英二选修） / 5. 第六段第一句","html":"<section class=\"revealPart\" id=\"focus-long-5-0\"><h3>原文</h3><blockquote>\n<p>Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"第六段第一句","focus":[30,3480,1020,285],"sourceW":1080,"sourceH":6116},"meta":{"kind":"standard","question":null,"option":null,"sourceLine":761,"cumulative":true,"cumulativeGroup":"long-5","cumulativeFinal":false},"focusId":"focus-long-5-0"},{"section":2,"sectionName":"第二鸟 ·
