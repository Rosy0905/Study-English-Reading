or understanding the world. The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.\n然而，这是我们为了理解世界必须付出的代价。技术研究产生的碳排放是值得付出的：从长远来看，这项研究将保护地球的未来。</p>\n</blockquote>\n<p>实际后文没有顺着这些科学家的主张去削减研究，而是在解释研究为什么不能简单缩减。</p>\n<p>如果B成立，后文应该这样写：</p>\n<blockquote>\n<p>However, we should not scale back necessary research simply because it consumes energy. This is a price we must pay for understanding the world.\n然而，我们不应该仅仅因为必要的研究会消耗能源，就缩减这些研究。这是我们为了理解世界必须付出的代价。</p>\n</blockquote>\n<p>显然实际后文表达的正是这个意思。因此，B与文章的写作走向完全一致。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-B-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>Energy-intensive research work is inevitable.\n能源密集型研究工作是不可避免的。</p>\n</blockquote>\n<p>把这个主旨直接代入26题题干：</p>\n<blockquote>\n<p>既然作者认为高耗能研究是不可避免的，那么作者应该对一些科学家“想要减少高耗能研究”感到震惊。</p>\n</blockquote>\n<p>B实际说的是：</p>\n<blockquote>\n<p>intention to reduce their research\n打算减少他们的研究</p>\n</blockquote>\n<p>结合第一段的语境，<code>their research</code>指的就是前后谈到的高耗能研究。因此，B与主旨代入题干后得到的答案一致。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"B","sourceLine":1306,"cumulative":true,"cumulativeGroup":"question-26-option-B","cumulativeFinal":true},"focusId":"focus-q26-B-3"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"C. suspicions about sustainable energy","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 26题","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-C-0\"><blockquote>\n<p>对可持续能源的怀疑</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时只认识<code>sustainable energy</code>，不知道<code>suspicions</code>是“怀疑”，所以只能看出它与第一段最后一句有关，暂时保留。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原文确实谈到了可持续能源，但没有说科学家“怀疑”可持续能源。命题人给了一个真实关键词，再让我们自己补出一个不存在的态度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>At the very least, we need to make our energy use far more sustainable.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"26","option":"C","sourceLine":1326,"cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":false},"focusId":"focus-q26-C-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"C. suspicions about sustainable energy","level":4,"breadcrumb":"26题 / C. suspicions about sustainable energy","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-C-0\"><blockquote>\n<p>对可持续能源的怀疑</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时只认识<code>sustainable energy</code>，不知道<code>suspicions</code>是“怀疑”，所以只能看出它与第一段最后一句有关，暂时保留。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原文确实谈到了可持续能源，但没有说科学家“怀疑”可持续能源。命题人给了一个真实关键词，再让我们自己补出一个不存在的态度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>At the very least, we need to make our energy use far more sustainable.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-C-1\"><h3>定位比对法</h3><p>我们先看C中的<code>sustainable energy</code>，意思是“可持续能源”。原文第一段最后一句也出现了<code>energy use</code>和<code>sustainable</code>，所以C对应的是：</p>\n<blockquote>\n<p>At the very least, we need to make our energy use far more sustainable.</p>\n</blockquote>\n<p>C中的<code>sustainable energy</code>确实有原文出处，但C的完整意思是“对可持续能源的怀疑”，关键在<code>suspicions</code>。</p>\n<p>原文中的科学家并没有怀疑可持续能源。他们自己提出：</p>\n<blockquote>\n<p>we need to make our energy use far more sustainable\n我们需要让能源使用变得更加可持续。</p>\n</blockquote>\n<p>这说明他们支持更加可持续地使用能源。</p>\n<p>题干问的是作者得知什么以后感到震惊，而<code>that</code>从句已经直接交代了这件事：</p>\n<blockquote>\n<p>that some scientists want to scale back their research</p>\n</blockquote>\n<p>所以，C抓住了第一段中的真实关键词，却额外加上了原文没有的“怀疑”。作者震惊的是科学家想缩减研究，不是科学家怀疑可持续能源。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"C","sourceLine":1340,"cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":false},"focusId":"focus-q26-C-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"C. suspicions about sustainable energy","level":4,"breadcrumb":"26题 / C. suspicions about sustainable energy","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-C-0\"><blockquote>\n<p>对可持续能源的怀疑</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时只认识<code>sustainable energy</code>，不知道<code>suspicions</code>是“怀疑”，所以只能看出它与第一段最后一句有关，暂时保留。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原文确实谈到了可持续能源，但没有说科学家“怀疑”可持续能源。命题人给了一个真实关键词，再让我们自己补出一个不存在的态度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>At the very least, we need to make our energy use far more sustainable.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-C-1\"><h3>定位比对法</h3><p>我们先看C中的<code>sustainable energy</code>，意思是“可持续能源”。原文第一段最后一句也出现了<code>energy use</code>和<code>sustainable</code>，所以C对应的是：</p>\n<blockquote>\n<p>At the very least, we need to make our energy use far more sustainable.</p>\n</blockquote>\n<p>C中的<code>sustainable energy</code>确实有原文出处，但C的完整意思是“对可持续能源的怀疑”，关键在<code>suspicions</code>。</p>\n<p>原文中的科学家并没有怀疑可持续能源。他们自己提出：</p>\n<blockquote>\n<p>we need to make our energy use far more sustainable\n我们需要让能源使用变得更加可持续。</p>\n</blockquote>\n<p>这说明他们支持更加可持续地使用能源。</p>\n<p>题干问的是作者得知什么以后感到震惊，而<code>that</code>从句已经直接交代了这件事：</p>\n<blockquote>\n<p>that some scientists want to scale back their research</p>\n</blockquote>\n<p>所以，C抓住了第一段中的真实关键词，却额外加上了原文没有的“怀疑”。作者震惊的是科学家想缩减研究，不是科学家怀疑可持续能源。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-C-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence.\n每天，科学家、技术人员和工程师都在寻找利用可再生能源的新方法，并开发既能更加合理地使用能源、又能为智能计算提供动力的技术。</p>\n</blockquote>\n<p>实际后文把可再生能源写成科学家正在积极利用的解决办法。</p>\n<p>如果C成立，后文应该改成：</p>\n<blockquote>\n<p>Every day, scientists continue to question whether renewable energy sources can reliably power our technology, and LUMI has not removed these suspicions.\n每天，科学家仍在怀疑可再生能源能否可靠地为技术供电，而LUMI也没有消除这些怀疑。</p>\n</blockquote>\n<p>实际后文没有讨论这种怀疑，反而用LUMI证明可再生能源可以为大型计算设施供电。因此，C不成立。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"C","sourceLine":1361,"cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":false},"focusId":"focus-q26-C-2"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"C. suspicions about sustainable energy","level":4,"breadcrumb":"26题 / C. suspicions about sustainable energy","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-C-0\"><blockquote>\n<p>对可持续能源的怀疑</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时只认识<code>sustainable energy</code>，不知道<code>suspicions</code>是“怀疑”，所以只能看出它与第一段最后一句有关，暂时保留。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原文确实谈到了可持续能源，但没有说科学家“怀疑”可持续能源。命题人给了一个真实关键词，再让我们自己补出一个不存在的态度。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>At the very least, we need to make our energy use far more sustainable.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-C-1\"><h3>定位比对法</h3><p>我们先看C中的<code>sustainable energy</code>，意思是“可持续能源”。原文第一段最后一句也出现了<code>energy use</code>和<code>sustainable</code>，所以C对应的是：</p>\n<blockquote>\n<p>At the very least, we need to make our energy use far more sustainable.</p>\n</blockquote>\n<p>C中的<code>sustainable energy</code>确实有原文出处，但C的完整意思是“对可持续能源的怀疑”，关键在<code>suspicions</code>。</p>\n<p>原文中的科学家并没有怀疑可持续能源。他们自己提出：</p>\n<blockquote>\n<p>we need to make our energy use far more sustainable\n我们需要让能源使用变得更加可持续。</p>\n</blockquote>\n<p>这说明他们支持更加可持续地使用能源。</p>\n<p>题干问的是作者得知什么以后感到震惊，而<code>that</code>从句已经直接交代了这件事：</p>\n<blockquote>\n<p>that some scientists want to scale back their research</p>\n</blockquote>\n<p>所以，C抓住了第一段中的真实关键词，却额外加上了原文没有的“怀疑”。作者震惊的是科学家想缩减研究，不是科学家怀疑可持续能源。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-C-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence.\n每天，科学家、技术人员和工程师都在寻找利用可再生能源的新方法，并开发既能更加合理地使用能源、又能为智能计算提供动力的技术。</p>\n</blockquote>\n<p>实际后文把可再生能源写成科学家正在积极利用的解决办法。</p>\n<p>如果C成立，后文应该改成：</p>\n<blockquote>\n<p>Every day, scientists continue to question whether renewable energy sources can reliably power our technology, and LUMI has not removed these suspicions.\n每天，科学家仍在怀疑可再生能源能否可靠地为技术供电，而LUMI也没有消除这些怀疑。</p>\n</blockquote>\n<p>实际后文没有讨论这种怀疑，反而用LUMI证明可再生能源可以为大型计算设施供电。因此，C不成立。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-C-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>Energy-intensive research work is inevitable.\n能源密集型研究工作是不可避免的。</p>\n</blockquote>\n<p>把这个主旨直接代入26题题干：</p>\n<blockquote>\n<p>既然作者认为高耗能研究是不可避免的，那么作者应该对一些科学家“想要减少高耗能研究”感到震惊。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>suspicions about sustainable energy\n对可持续能源的怀疑</p>\n</blockquote>\n<p>“想要减少高耗能研究”和“怀疑可持续能源”不是一回事，所以C与主旨代入题干后得到的答案不一致。</p>\n<p><strong>复盘判断：C排除。</strong></p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"C","sourceLine":1377,"cumulative":true,"cumulativeGroup":"question-26-option-C","cumulativeFinal":true},"focusId":"focus-q26-C-3"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"D. waste of electricity in their projects","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 26题","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-D-0\"><blockquote>\n<p>在他们的项目中浪费电力</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时通过第二段已经能看出科研设施“耗电很多”，也认识<code>waste</code>是“浪费”，所以可以用“耗电不等于浪费”直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人把<code>demand</code>和<code>consume</code>改成了<code>waste</code>，把“使用很多电”偷偷换成“白白浪费电”。它还拿第二段的信息干扰第一段题干。</p>\n<p>这里决定错误类型的是<code>consume</code>变成<code>waste</code>，也就是动词和评价被改，所以属于第一类。第二段的信息出现在第一段题目的选项里，只是命题人增加迷惑性的手段。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>demand significant amounts of energy\nthese buildings now consume about 1 per cent of the world’s electricity</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"26","option":"D","sourceLine":1397,"cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":false},"focusId":"focus-q26-D-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"D. waste of electricity in their projects","level":4,"breadcrumb":"26题 / D. waste of electricity in their projects","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-D-0\"><blockquote>\n<p>在他们的项目中浪费电力</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时通过第二段已经能看出科研设施“耗电很多”，也认识<code>waste</code>是“浪费”，所以可以用“耗电不等于浪费”直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人把<code>demand</code>和<code>consume</code>改成了<code>waste</code>，把“使用很多电”偷偷换成“白白浪费电”。它还拿第二段的信息干扰第一段题干。</p>\n<p>这里决定错误类型的是<code>consume</code>变成<code>waste</code>，也就是动词和评价被改，所以属于第一类。第二段的信息出现在第一段题目的选项里，只是命题人增加迷惑性的手段。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>demand significant amounts of energy\nthese buildings now consume about 1 per cent of the world’s electricity</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-D-1\"><h3>定位比对法</h3><p>D中出现了<code>electricity</code>。第一段没有写“项目浪费电”，但第二段确实谈到了科研工具和数据中心耗电，所以D对应的是：</p>\n<blockquote>\n<p>demand significant amounts of energy\n需要大量能源</p>\n</blockquote>\n<p>以及：</p>\n<blockquote>\n<p>these buildings now consume about 1 per cent of the world’s electricity\n这些建筑现在消耗了全世界大约1%的电力</p>\n</blockquote>\n<p>这些原文只能说明科研工具和数据中心“耗电很多”。</p>\n<p>D中最关键的词是<code>waste</code>，意思是“浪费”。耗电很多不等于浪费电。要把用电说成浪费，原文至少还要说明这些用电没有必要、没有产生作用，或者本来可以避免。</p>\n<p>第二段不但没有这些信息，反而把相关设施称为：</p>\n<blockquote>\n<p>the tools we scientists need\n我们科学家需要的工具</p>\n</blockquote>\n<p>既然原文明确说这些工具是需要的，就不能只因为它们耗电多，直接把它们定性为浪费电。</p>\n<p>D只是抓住了第二段的<code>electricity</code>，再把“消耗”歪曲成了“浪费”。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"D","sourceLine":1414,"cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":false},"focusId":"focus-q26-D-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"D. waste of electricity in their projects","level":4,"breadcrumb":"26题 / D. waste of electricity in their projects","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-D-0\"><blockquote>\n<p>在他们的项目中浪费电力</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时通过第二段已经能看出科研设施“耗电很多”，也认识<code>waste</code>是“浪费”，所以可以用“耗电不等于浪费”直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人把<code>demand</code>和<code>consume</code>改成了<code>waste</code>，把“使用很多电”偷偷换成“白白浪费电”。它还拿第二段的信息干扰第一段题干。</p>\n<p>这里决定错误类型的是<code>consume</code>变成<code>waste</code>，也就是动词和评价被改，所以属于第一类。第二段的信息出现在第一段题目的选项里，只是命题人增加迷惑性的手段。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>demand significant amounts of energy\nthese buildings now consume about 1 per cent of the world’s electricity</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-D-1\"><h3>定位比对法</h3><p>D中出现了<code>electricity</code>。第一段没有写“项目浪费电”，但第二段确实谈到了科研工具和数据中心耗电，所以D对应的是：</p>\n<blockquote>\n<p>demand significant amounts of energy\n需要大量能源</p>\n</blockquote>\n<p>以及：</p>\n<blockquote>\n<p>these buildings now consume about 1 per cent of the world’s electricity\n这些建筑现在消耗了全世界大约1%的电力</p>\n</blockquote>\n<p>这些原文只能说明科研工具和数据中心“耗电很多”。</p>\n<p>D中最关键的词是<code>waste</code>，意思是“浪费”。耗电很多不等于浪费电。要把用电说成浪费，原文至少还要说明这些用电没有必要、没有产生作用，或者本来可以避免。</p>\n<p>第二段不但没有这些信息，反而把相关设施称为：</p>\n<blockquote>\n<p>the tools we scientists need\n我们科学家需要的工具</p>\n</blockquote>\n<p>既然原文明确说这些工具是需要的，就不能只因为它们耗电多，直接把它们定性为浪费电。</p>\n<p>D只是抓住了第二段的<code>electricity</code>，再把“消耗”歪曲成了“浪费”。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-D-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>However, this is a price we must pay for understanding the world. The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.\n然而，这是我们为了理解世界必须付出的代价。技术研究产生的碳排放是值得付出的：从长远来看，这项研究将保护地球的未来。</p>\n</blockquote>\n<p>实际后文把科研能耗称为必须付出的、花得值得的代价。</p>\n<p>如果D成立，后文应该改成：</p>\n<blockquote>\n<p>However, this is a waste we must stop. The electricity consumed by technological research is poorly spent, so these projects should be scaled back.\n然而，这是我们必须制止的浪费。技术研究消耗的电力毫无价值，所以这些项目应该被缩减。</p>\n</blockquote>\n<p>实际后文的评价与这种写法完全相反。因此，D不成立。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"D","sourceLine":1439,"cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":false},"focusId":"focus-q26-D-2"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"D. waste of electricity in their projects","level":4,"breadcrumb":"26题 / D. waste of electricity in their projects","html":"<section class=\"revealPart optionLead\" id=\"focus-q26-D-0\"><blockquote>\n<p>在他们的项目中浪费电力</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时通过第二段已经能看出科研设施“耗电很多”，也认识<code>waste</code>是“浪费”，所以可以用“耗电不等于浪费”直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人把<code>demand</code>和<code>consume</code>改成了<code>waste</code>，把“使用很多电”偷偷换成“白白浪费电”。它还拿第二段的信息干扰第一段题干。</p>\n<p>这里决定错误类型的是<code>consume</code>变成<code>waste</code>，也就是动词和评价被改，所以属于第一类。第二段的信息出现在第一段题目的选项里，只是命题人增加迷惑性的手段。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>demand significant amounts of energy\nthese buildings now consume about 1 per cent of the world’s electricity</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q26-D-1\"><h3>定位比对法</h3><p>D中出现了<code>electricity</code>。第一段没有写“项目浪费电”，但第二段确实谈到了科研工具和数据中心耗电，所以D对应的是：</p>\n<blockquote>\n<p>demand significant amounts of energy\n需要大量能源</p>\n</blockquote>\n<p>以及：</p>\n<blockquote>\n<p>these buildings now consume about 1 per cent of the world’s electricity\n这些建筑现在消耗了全世界大约1%的电力</p>\n</blockquote>\n<p>这些原文只能说明科研工具和数据中心“耗电很多”。</p>\n<p>D中最关键的词是<code>waste</code>，意思是“浪费”。耗电很多不等于浪费电。要把用电说成浪费，原文至少还要说明这些用电没有必要、没有产生作用，或者本来可以避免。</p>\n<p>第二段不但没有这些信息，反而把相关设施称为：</p>\n<blockquote>\n<p>the tools we scientists need\n我们科学家需要的工具</p>\n</blockquote>\n<p>既然原文明确说这些工具是需要的，就不能只因为它们耗电多，直接把它们定性为浪费电。</p>\n<p>D只是抓住了第二段的<code>electricity</code>，再把“消耗”歪曲成了“浪费”。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-D-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>However, this is a price we must pay for understanding the world. The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.\n然而，这是我们为了理解世界必须付出的代价。技术研究产生的碳排放是值得付出的：从长远来看，这项研究将保护地球的未来。</p>\n</blockquote>\n<p>实际后文把科研能耗称为必须付出的、花得值得的代价。</p>\n<p>如果D成立，后文应该改成：</p>\n<blockquote>\n<p>However, this is a waste we must stop. The electricity consumed by technological research is poorly spent, so these projects should be scaled back.\n然而，这是我们必须制止的浪费。技术研究消耗的电力毫无价值，所以这些项目应该被缩减。</p>\n</blockquote>\n<p>实际后文的评价与这种写法完全相反。因此，D不成立。</p>\n</section><section class=\"revealPart\" id=\"focus-q26-D-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>Energy-intensive research work is inevitable.\n能源密集型研究工作是不可避免的。</p>\n</blockquote>\n<p>把这个主旨直接代入26题题干：</p>\n<blockquote>\n<p>既然作者认为高耗能研究是不可避免的，那么作者应该对一些科学家“想要减少高耗能研究”感到震惊。</p>\n</blockquote>\n<p>但D实际说的是：</p>\n<blockquote>\n<p>waste of electricity in their projects\n在他们的项目中浪费电力</p>\n</blockquote>\n<p>“想要减少高耗能研究”和“在研究项目中浪费电力”不是一回事，所以D与主旨代入题干后得到的答案不一致。</p>\n<p><strong>复盘判断：D排除。</strong></p>\n</section>","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"26","option":"D","sourceLine":1455,"cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":true},"focusId":"focus-q26-D-3"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"26题结论","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 26题","html":"<blockquote>\n<p><strong>26. B. intention to reduce their research</strong></p>\n</blockquote>\n<p>这道题的四个选项分别展示了四种情况：</p>\n<ul>\n<li>A属于第一类：有原文出处，但把“努力减排”改成“不愿减排”；</li>\n<li>B没有照抄原文，却完整保留了原句逻辑；</li>\n<li>C属于第三类：拿走真实关键词，补出原文没有的“怀疑”；</li>\n<li>D属于第一类：拿其他段落的耗电信息，把“耗电”改成“浪费电”。</li>\n</ul>\n","context":{"mode":"image","asset":"annotated","label":"26题","focus":[70,4660,940,190],"sourceW":1080,"sourceH":6116},"meta":{"kind":"conclusion","question":"26","option":null,"sourceLine":1475,"questionConclusion":true}},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"27题 · 题干、题型与核心出处","level":2,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","html":"<blockquote>\n<p>The author believes that carbon emissions from research ______.\n作者认为科研产生的碳排放怎么样？</p>\n</blockquote>\n<h3>题型</h3><p>这是一道局部作者观点题。</p>\n<p>题干中的<code>The author believes</code>要求我们找作者本人的评价，不能拿其他科学家的担忧代替作者观点。</p>\n<h3>核心出处</h3><blockquote>\n<p>The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.</p>\n</blockquote>\n<p>题干中的<code>carbon emissions from research</code>对应<code>The carbon emissions from technological research</code>。题目真正挖掉的是作者后面的评价：</p>\n<blockquote>\n<p>are well spent</p>\n</blockquote>\n<p>以及对这个评价的解释：</p>\n<blockquote>\n<p>ultimately this research will safeguard the future of our planet</p>\n</blockquote>\n","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"question","question":"27","option":null,"sourceLine":1486,"questionIntro":true}},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. have caused grave consequences","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 27题","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-A-0\"><blockquote>\n<p>已经造成了严重后果</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>grave consequences</code>能够看懂，原文的<code>well spent</code>和<code>safeguard the future</code>也能够看出正面方向，所以当时可以直接排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>命题人拿走了原文中的<code>carbon emissions</code>、<code>The crisis is here</code>和<code>a price</code>这些带有负面色彩的表达。我们很容易顺着常识继续脑补：既然科研会排碳，而碳排放又与气候危机有关，那么科研产生的碳排放一定已经造成了严重后果。</p>\n<p>但文章没有表达“科研产生的碳排放已经造成严重后果”这个完整命题。作者紧接着给出的评价反而是<code>are well spent</code>，并解释这项研究将<code>safeguard the future of our planet</code>。原文只提供了能让我们产生联想的材料，A中的“已经造成严重后果”是命题人引导我们自己补出来的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The crisis is here.</p>\n<p>However, this is a price we must pay for understanding the world.</p>\n<p>The carbon emissions from technological research are well spent.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"27","option":"A","sourceLine":1509,"cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false},"focusId":"focus-q27-A-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. have caused grave consequences","level":4,"breadcrumb":"27题 / A. have caused grave consequences","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-A-0\"><blockquote>\n<p>已经造成了严重后果</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>grave consequences</code>能够看懂，原文的<code>well spent</code>和<code>safeguard the future</code>也能够看出正面方向，所以当时可以直接排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>命题人拿走了原文中的<code>carbon emissions</code>、<code>The crisis is here</code>和<code>a price</code>这些带有负面色彩的表达。我们很容易顺着常识继续脑补：既然科研会排碳，而碳排放又与气候危机有关，那么科研产生的碳排放一定已经造成了严重后果。</p>\n<p>但文章没有表达“科研产生的碳排放已经造成严重后果”这个完整命题。作者紧接着给出的评价反而是<code>are well spent</code>，并解释这项研究将<code>safeguard the future of our planet</code>。原文只提供了能让我们产生联想的材料，A中的“已经造成严重后果”是命题人引导我们自己补出来的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The crisis is here.</p>\n<p>However, this is a price we must pay for understanding the world.</p>\n<p>The carbon emissions from technological research are well spent.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-A-1\"><h3>定位比对法</h3><p>把A接到题干后，意思是：</p>\n<blockquote>\n<p>作者认为，研究产生的碳排放已经造成了严重后果。</p>\n</blockquote>\n<p>题干中的<code>carbon emissions from research</code>直接对应：</p>\n<blockquote>\n<p>The carbon emissions from technological research</p>\n</blockquote>\n<p>所以我们要看作者紧跟着给出的评价：</p>\n<blockquote>\n<p>are well spent\n是值得付出的</p>\n</blockquote>\n<p>后面又补充：</p>\n<blockquote>\n<p>this research will safeguard the future of our planet\n这项研究将保护地球的未来</p>\n</blockquote>\n<p><code>well spent</code>和<code>safeguard the future</code>都是正面评价。A中的<code>grave consequences</code>却是“严重后果”，属于负面评价。</p>\n<p>原文确实提到了危机、代价和科研产生的碳排放，但没有说“科研排放已经造成了严重后果”。我们只有把这些负面词拼在一起，再加入“碳排放通常会造成严重后果”这一常识，才能得到A。</p>\n<p>也就是说，A中的<code>grave consequences</code>不是原文给出的结论，而是命题人诱导我们自己补出来的。原文中的<code>well spent</code>和<code>safeguard the future</code>又进一步说明，作者真正强调的是科研排放换来的长期价值。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"A","sourceLine":1529,"cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false},"focusId":"focus-q27-A-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. have caused grave consequences","level":4,"breadcrumb":"27题 / A. have caused grave consequences","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-A-0\"><blockquote>\n<p>已经造成了严重后果</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>grave consequences</code>能够看懂，原文的<code>well spent</code>和<code>safeguard the future</code>也能够看出正面方向，所以当时可以直接排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>命题人拿走了原文中的<code>carbon emissions</code>、<code>The crisis is here</code>和<code>a price</code>这些带有负面色彩的表达。我们很容易顺着常识继续脑补：既然科研会排碳，而碳排放又与气候危机有关，那么科研产生的碳排放一定已经造成了严重后果。</p>\n<p>但文章没有表达“科研产生的碳排放已经造成严重后果”这个完整命题。作者紧接着给出的评价反而是<code>are well spent</code>，并解释这项研究将<code>safeguard the future of our planet</code>。原文只提供了能让我们产生联想的材料，A中的“已经造成严重后果”是命题人引导我们自己补出来的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The crisis is here.</p>\n<p>However, this is a price we must pay for understanding the world.</p>\n<p>The carbon emissions from technological research are well spent.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-A-1\"><h3>定位比对法</h3><p>把A接到题干后，意思是：</p>\n<blockquote>\n<p>作者认为，研究产生的碳排放已经造成了严重后果。</p>\n</blockquote>\n<p>题干中的<code>carbon emissions from research</code>直接对应：</p>\n<blockquote>\n<p>The carbon emissions from technological research</p>\n</blockquote>\n<p>所以我们要看作者紧跟着给出的评价：</p>\n<blockquote>\n<p>are well spent\n是值得付出的</p>\n</blockquote>\n<p>后面又补充：</p>\n<blockquote>\n<p>this research will safeguard the future of our planet\n这项研究将保护地球的未来</p>\n</blockquote>\n<p><code>well spent</code>和<code>safeguard the future</code>都是正面评价。A中的<code>grave consequences</code>却是“严重后果”，属于负面评价。</p>\n<p>原文确实提到了危机、代价和科研产生的碳排放，但没有说“科研排放已经造成了严重后果”。我们只有把这些负面词拼在一起，再加入“碳排放通常会造成严重后果”这一常识，才能得到A。</p>\n<p>也就是说，A中的<code>grave consequences</code>不是原文给出的结论，而是命题人诱导我们自己补出来的。原文中的<code>well spent</code>和<code>safeguard the future</code>又进一步说明，作者真正强调的是科研排放换来的长期价值。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-A-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.\n但是，如果我们要解决人类面临的最重大挑战，展示科学的有效性将至关重要。</p>\n</blockquote>\n<p>后文还写道：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.\n多亏他的发明，我们真正有机会减少全世界的碳排放。</p>\n</blockquote>\n<p>实际后文继续说明科学能够解决问题、帮助减排。</p>\n<p>如果A成立，后文应该改成：</p>\n<blockquote>\n<p>But demonstrating the damaging consequences of scientific research will be crucial if we are to protect humanity from further harm. Because of these emissions, we face a real risk of damaging the future of our planet.\n但是，如果我们要保护人类免受进一步伤害，揭示科学研究造成的严重后果将至关重要。由于这些排放，地球的未来正面临真正的危险。</p>\n</blockquote>\n<p>实际后文没有沿着“科研排放造成严重后果”展开，而是在证明科研的积极作用。因此，A不成立。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"A","sourceLine":1555,"cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false},"focusId":"focus-q27-A-2"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. have caused grave consequences","level":4,"breadcrumb":"27题 / A. have caused grave consequences","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-A-0\"><blockquote>\n<p>已经造成了严重后果</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong><code>grave consequences</code>能够看懂，原文的<code>well spent</code>和<code>safeguard the future</code>也能够看出正面方向，所以当时可以直接排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>命题人拿走了原文中的<code>carbon emissions</code>、<code>The crisis is here</code>和<code>a price</code>这些带有负面色彩的表达。我们很容易顺着常识继续脑补：既然科研会排碳，而碳排放又与气候危机有关，那么科研产生的碳排放一定已经造成了严重后果。</p>\n<p>但文章没有表达“科研产生的碳排放已经造成严重后果”这个完整命题。作者紧接着给出的评价反而是<code>are well spent</code>，并解释这项研究将<code>safeguard the future of our planet</code>。原文只提供了能让我们产生联想的材料，A中的“已经造成严重后果”是命题人引导我们自己补出来的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>The crisis is here.</p>\n<p>However, this is a price we must pay for understanding the world.</p>\n<p>The carbon emissions from technological research are well spent.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-A-1\"><h3>定位比对法</h3><p>把A接到题干后，意思是：</p>\n<blockquote>\n<p>作者认为，研究产生的碳排放已经造成了严重后果。</p>\n</blockquote>\n<p>题干中的<code>carbon emissions from research</code>直接对应：</p>\n<blockquote>\n<p>The carbon emissions from technological research</p>\n</blockquote>\n<p>所以我们要看作者紧跟着给出的评价：</p>\n<blockquote>\n<p>are well spent\n是值得付出的</p>\n</blockquote>\n<p>后面又补充：</p>\n<blockquote>\n<p>this research will safeguard the future of our planet\n这项研究将保护地球的未来</p>\n</blockquote>\n<p><code>well spent</code>和<code>safeguard the future</code>都是正面评价。A中的<code>grave consequences</code>却是“严重后果”，属于负面评价。</p>\n<p>原文确实提到了危机、代价和科研产生的碳排放，但没有说“科研排放已经造成了严重后果”。我们只有把这些负面词拼在一起，再加入“碳排放通常会造成严重后果”这一常识，才能得到A。</p>\n<p>也就是说，A中的<code>grave consequences</code>不是原文给出的结论，而是命题人诱导我们自己补出来的。原文中的<code>well spent</code>和<code>safeguard the future</code>又进一步说明，作者真正强调的是科研排放换来的长期价值。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-A-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.\n但是，如果我们要解决人类面临的最重大挑战，展示科学的有效性将至关重要。</p>\n</blockquote>\n<p>后文还写道：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.\n多亏他的发明，我们真正有机会减少全世界的碳排放。</p>\n</blockquote>\n<p>实际后文继续说明科学能够解决问题、帮助减排。</p>\n<p>如果A成立，后文应该改成：</p>\n<blockquote>\n<p>But demonstrating the damaging consequences of scientific research will be crucial if we are to protect humanity from further harm. Because of these emissions, we face a real risk of damaging the future of our planet.\n但是，如果我们要保护人类免受进一步伤害，揭示科学研究造成的严重后果将至关重要。由于这些排放，地球的未来正面临真正的危险。</p>\n</blockquote>\n<p>实际后文没有沿着“科研排放造成严重后果”展开，而是在证明科研的积极作用。因此，A不成立。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-A-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>Energy-intensive research work is inevitable.\n高耗能的科研工作是不可避免的。</p>\n</blockquote>\n<p>把这个主旨直接代入27题题干：</p>\n<blockquote>\n<p>既然作者认为高耗能科研工作是不可避免的，那么作者应该认为科研产生的碳排放“是无法完全避免、从长远来看有理由付出的代价”。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>have caused grave consequences\n已经造成了严重后果</p>\n</blockquote>\n<p>“从长远来看有理由付出的代价”和“已经造成严重后果”不是一回事，所以A与主旨代入题干后得到的答案不一致。</p>\n<p><strong>复盘判断：A排除。</strong></p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"A","sourceLine":1576,"cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":true},"focusId":"focus-q27-A-3"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. have caused groundless worries","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 27题","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-B-0\"><blockquote>\n<p>引起了毫无根据的担忧</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时只看懂<code>worries</code>，不知道<code>groundless</code>是“毫无根据的”，因此只能看出第一段确实有人因科研排放作出反应，暂时保留。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者反对的是“因为担忧排放就缩减研究”这个做法，命题人却把它改成了“作者认为这种担忧毫无根据”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>some scientists want to scale back their research in an effort to decrease carbon emissions</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"27","option":"B","sourceLine":1596,"cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":false},"focusId":"focus-q27-B-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. have caused groundless worries","level":4,"breadcrumb":"27题 / B. have caused groundless worries","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-B-0\"><blockquote>\n<p>引起了毫无根据的担忧</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时只看懂<code>worries</code>，不知道<code>groundless</code>是“毫无根据的”，因此只能看出第一段确实有人因科研排放作出反应，暂时保留。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者反对的是“因为担忧排放就缩减研究”这个做法，命题人却把它改成了“作者认为这种担忧毫无根据”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>some scientists want to scale back their research in an effort to decrease carbon emissions</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-B-1\"><h3>定位比对法</h3><p>B中的<code>worries</code>可以联系到第一段：一些科学家因为碳排放问题，想缩减自己的研究。这说明科研排放确实引起了他们的担忧。</p>\n<p>但B不只是说“产生了担忧”，它还用<code>groundless</code>把这些担忧说成“毫无根据”。</p>\n<p>第二段明确写道：</p>\n<blockquote>\n<p>our laboratories, scientific instruments, rockets and satellites... demand significant amounts of energy\n实验室、科学仪器、火箭和卫星需要大量能源</p>\n</blockquote>\n<p>还写道：</p>\n<blockquote>\n<p>these buildings now consume about 1 per cent of the world’s electricity\n这些建筑现在消耗了全世界大约1%的电力</p>\n</blockquote>\n<p>既然科研设施确实耗能，担忧就有事实依据，不能叫<code>groundless</code>。</p>\n<p>作者的意思不是“这些担忧毫无根据”，而是“能耗问题确实存在，但研究仍然值得继续”。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"B","sourceLine":1610,"cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":false},"focusId":"focus-q27-B-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. have caused groundless worries","level":4,"breadcrumb":"27题 / B. have caused groundless worries","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-B-0\"><blockquote>\n<p>引起了毫无根据的担忧</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时只看懂<code>worries</code>，不知道<code>groundless</code>是“毫无根据的”，因此只能看出第一段确实有人因科研排放作出反应，暂时保留。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者反对的是“因为担忧排放就缩减研究”这个做法，命题人却把它改成了“作者认为这种担忧毫无根据”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>some scientists want to scale back their research in an effort to decrease carbon emissions</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-B-1\"><h3>定位比对法</h3><p>B中的<code>worries</code>可以联系到第一段：一些科学家因为碳排放问题，想缩减自己的研究。这说明科研排放确实引起了他们的担忧。</p>\n<p>但B不只是说“产生了担忧”，它还用<code>groundless</code>把这些担忧说成“毫无根据”。</p>\n<p>第二段明确写道：</p>\n<blockquote>\n<p>our laboratories, scientific instruments, rockets and satellites... demand significant amounts of energy\n实验室、科学仪器、火箭和卫星需要大量能源</p>\n</blockquote>\n<p>还写道：</p>\n<blockquote>\n<p>these buildings now consume about 1 per cent of the world’s electricity\n这些建筑现在消耗了全世界大约1%的电力</p>\n</blockquote>\n<p>既然科研设施确实耗能，担忧就有事实依据，不能叫<code>groundless</code>。</p>\n<p>作者的意思不是“这些担忧毫无根据”，而是“能耗问题确实存在，但研究仍然值得继续”。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-B-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs.\n如果世界想实现净零目标，我们必须认真思考怎样发展可持续计算，并建设更多LUMI。</p>\n</blockquote>\n<p>实际后文仍然在认真处理科研和计算的能耗问题，还提出要发展可持续计算。这说明相关担忧有现实依据，只是解决办法不应该是简单停止研究。</p>\n<p>如果B成立，后文应该改成：</p>\n<blockquote>\n<p>Since worries about the energy use of research are groundless, we do not need to rethink sustainable computing or develop more systems like LUMI.\n既然对科研能耗的担忧毫无根据，我们就没有必要重新思考可持续计算，也没有必要建设更多LUMI这样的系统。</p>\n</blockquote>\n<p>只有后文这样把能耗问题说成不需要处理，才会顺着“担忧毫无根据”继续写。实际后文恰恰要求认真解决这个问题，所以B不成立。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"B","sourceLine":1630,"cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":false},"focusId":"focus-q27-B-2"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. have caused groundless worries","level":4,"breadcrumb":"27题 / B. have caused groundless worries","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-B-0\"><blockquote>\n<p>引起了毫无根据的担忧</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时只看懂<code>worries</code>，不知道<code>groundless</code>是“毫无根据的”，因此只能看出第一段确实有人因科研排放作出反应，暂时保留。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者反对的是“因为担忧排放就缩减研究”这个做法，命题人却把它改成了“作者认为这种担忧毫无根据”。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>some scientists want to scale back their research in an effort to decrease carbon emissions</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-B-1\"><h3>定位比对法</h3><p>B中的<code>worries</code>可以联系到第一段：一些科学家因为碳排放问题，想缩减自己的研究。这说明科研排放确实引起了他们的担忧。</p>\n<p>但B不只是说“产生了担忧”，它还用<code>groundless</code>把这些担忧说成“毫无根据”。</p>\n<p>第二段明确写道：</p>\n<blockquote>\n<p>our laboratories, scientific instruments, rockets and satellites... demand significant amounts of energy\n实验室、科学仪器、火箭和卫星需要大量能源</p>\n</blockquote>\n<p>还写道：</p>\n<blockquote>\n<p>these buildings now consume about 1 per cent of the world’s electricity\n这些建筑现在消耗了全世界大约1%的电力</p>\n</blockquote>\n<p>既然科研设施确实耗能，担忧就有事实依据，不能叫<code>groundless</code>。</p>\n<p>作者的意思不是“这些担忧毫无根据”，而是“能耗问题确实存在，但研究仍然值得继续”。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-B-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs.\n如果世界想实现净零目标，我们必须认真思考怎样发展可持续计算，并建设更多LUMI。</p>\n</blockquote>\n<p>实际后文仍然在认真处理科研和计算的能耗问题，还提出要发展可持续计算。这说明相关担忧有现实依据，只是解决办法不应该是简单停止研究。</p>\n<p>如果B成立，后文应该改成：</p>\n<blockquote>\n<p>Since worries about the energy use of research are groundless, we do not need to rethink sustainable computing or develop more systems like LUMI.\n既然对科研能耗的担忧毫无根据，我们就没有必要重新思考可持续计算，也没有必要建设更多LUMI这样的系统。</p>\n</blockquote>\n<p>只有后文这样把能耗问题说成不需要处理，才会顺着“担忧毫无根据”继续写。实际后文恰恰要求认真解决这个问题，所以B不成立。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-B-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>Energy-intensive research work is inevitable.\n高耗能的科研工作是不可避免的。</p>\n</blockquote>\n<p>把这个主旨直接代入27题题干：</p>\n<blockquote>\n<p>既然作者认为高耗能科研工作是不可避免的，那么作者应该认为科研产生的碳排放“是无法完全避免、从长远来看有理由付出的代价”。</p>\n</blockquote>\n<p>但B实际说的是：</p>\n<blockquote>\n<p>have caused groundless worries\n引起了毫无根据的担忧</p>\n</blockquote>\n<p>“从长远来看有理由付出的代价”和“引起了毫无根据的担忧”不是一回事。并且主旨中的<code>energy-intensive</code>已经承认科研确实耗能，所以相关担忧也不能说成毫无根据。B与主旨代入题干后得到的答案不一致。</p>\n<p><strong>复盘判断：B排除。</strong></p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"B","sourceLine":1646,"cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":true},"focusId":"focus-q27-B-3"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"C. are hard to handle at present","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 27题","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-C-0\"><blockquote>\n<p>目前很难处理</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时通过<code>hard</code>、<code>make the case</code>和<code>explanation</code>已经可以看出，原文难的是把科学的价值讲清楚，不是处理科研排放，所以能够直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人把<code>hard</code>留下来了，却换掉了“什么事情很难”。原文是解释科研很难，C变成处理科研排放很难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It can be hard for scientists to make the case...</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"27","option":"C","sourceLine":1666,"cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":false},"focusId":"focus-q27-C-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"C. are hard to handle at present","level":4,"breadcrumb":"27题 / C. are hard to handle at present","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-C-0\"><blockquote>\n<p>目前很难处理</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时通过<code>hard</code>、<code>make the case</code>和<code>explanation</code>已经可以看出，原文难的是把科学的价值讲清楚，不是处理科研排放，所以能够直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人把<code>hard</code>留下来了，却换掉了“什么事情很难”。原文是解释科研很难，C变成处理科研排放很难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It can be hard for scientists to make the case...</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-C-1\"><h3>定位比对法</h3><p>C中最显眼的是<code>hard</code>，所以容易让人想到第四段：</p>\n<blockquote>\n<p>It can be hard for scientists to make the case...</p>\n</blockquote>\n<p>把完整句子读完，原文说的是：</p>\n<blockquote>\n<p>科学工作很复杂，所以科学家很难把科研为什么有价值这件事向别人讲清楚。</p>\n</blockquote>\n<p>这里的<code>hard</code>修饰的是<code>make the case</code>，难的是“说明道理”。</p>\n<p>C接到题干后却变成：</p>\n<blockquote>\n<p>研究产生的碳排放目前很难处理。</p>\n</blockquote>\n<p>困难的对象从“解释科研的价值”换成了“处理科研排放”。C还加入了原文没有的<code>at present</code>。</p>\n<p>所以，C只是保留了一个<code>hard</code>，但把“什么事情很难”换掉了。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"C","sourceLine":1680,"cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":false},"focusId":"focus-q27-C-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"C. are hard to handle at present","level":4,"breadcrumb":"27题 / C. are hard to handle at present","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-C-0\"><blockquote>\n<p>目前很难处理</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时通过<code>hard</code>、<code>make the case</code>和<code>explanation</code>已经可以看出，原文难的是把科学的价值讲清楚，不是处理科研排放，所以能够直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人把<code>hard</code>留下来了，却换掉了“什么事情很难”。原文是解释科研很难，C变成处理科研排放很难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It can be hard for scientists to make the case...</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-C-1\"><h3>定位比对法</h3><p>C中最显眼的是<code>hard</code>，所以容易让人想到第四段：</p>\n<blockquote>\n<p>It can be hard for scientists to make the case...</p>\n</blockquote>\n<p>把完整句子读完，原文说的是：</p>\n<blockquote>\n<p>科学工作很复杂，所以科学家很难把科研为什么有价值这件事向别人讲清楚。</p>\n</blockquote>\n<p>这里的<code>hard</code>修饰的是<code>make the case</code>，难的是“说明道理”。</p>\n<p>C接到题干后却变成：</p>\n<blockquote>\n<p>研究产生的碳排放目前很难处理。</p>\n</blockquote>\n<p>困难的对象从“解释科研的价值”换成了“处理科研排放”。C还加入了原文没有的<code>at present</code>。</p>\n<p>所以，C只是保留了一个<code>hard</code>，但把“什么事情很难”换掉了。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-C-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.\n多亏他的发明，我们真正有机会减少全世界的碳排放。</p>\n</blockquote>\n<p>后文还用LUMI说明大型计算设施可以通过可再生能源供电，并实现负碳。</p>\n<p>如果C成立，后文应该改成：</p>\n<blockquote>\n<p>Despite these efforts, we still have little chance of handling carbon emissions from research at present, and even LUMI cannot offer a practical solution.\n尽管作出了这些努力，目前我们仍然几乎没有办法处理科研产生的碳排放，就连LUMI也无法提供可行的解决方案。</p>\n</blockquote>\n<p>实际后文给出了Green和LUMI两个积极例子，并没有说目前无法处理。因此，C不成立。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"C","sourceLine":1700,"cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":false},"focusId":"focus-q27-C-2"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"C. are hard to handle at present","level":4,"breadcrumb":"27题 / C. are hard to handle at present","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-C-0\"><blockquote>\n<p>目前很难处理</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时通过<code>hard</code>、<code>make the case</code>和<code>explanation</code>已经可以看出，原文难的是把科学的价值讲清楚，不是处理科研排放，所以能够直接排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>命题人把<code>hard</code>留下来了，却换掉了“什么事情很难”。原文是解释科研很难，C变成处理科研排放很难。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>It can be hard for scientists to make the case...</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-C-1\"><h3>定位比对法</h3><p>C中最显眼的是<code>hard</code>，所以容易让人想到第四段：</p>\n<blockquote>\n<p>It can be hard for scientists to make the case...</p>\n</blockquote>\n<p>把完整句子读完，原文说的是：</p>\n<blockquote>\n<p>科学工作很复杂，所以科学家很难把科研为什么有价值这件事向别人讲清楚。</p>\n</blockquote>\n<p>这里的<code>hard</code>修饰的是<code>make the case</code>，难的是“说明道理”。</p>\n<p>C接到题干后却变成：</p>\n<blockquote>\n<p>研究产生的碳排放目前很难处理。</p>\n</blockquote>\n<p>困难的对象从“解释科研的价值”换成了“处理科研排放”。C还加入了原文没有的<code>at present</code>。</p>\n<p>所以，C只是保留了一个<code>hard</code>，但把“什么事情很难”换掉了。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-C-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.\n多亏他的发明，我们真正有机会减少全世界的碳排放。</p>\n</blockquote>\n<p>后文还用LUMI说明大型计算设施可以通过可再生能源供电，并实现负碳。</p>\n<p>如果C成立，后文应该改成：</p>\n<blockquote>\n<p>Despite these efforts, we still have little chance of handling carbon emissions from research at present, and even LUMI cannot offer a practical solution.\n尽管作出了这些努力，目前我们仍然几乎没有办法处理科研产生的碳排放，就连LUMI也无法提供可行的解决方案。</p>\n</blockquote>\n<p>实际后文给出了Green和LUMI两个积极例子，并没有说目前无法处理。因此，C不成立。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-C-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>Energy-intensive research work is inevitable.\n高耗能的科研工作是不可避免的。</p>\n</blockquote>\n<p>把这个主旨直接代入27题题干：</p>\n<blockquote>\n<p>既然作者认为高耗能科研工作是不可避免的，那么作者应该认为科研产生的碳排放“是无法完全避免、从长远来看有理由付出的代价”。</p>\n</blockquote>\n<p>但C实际说的是：</p>\n<blockquote>\n<p>are hard to handle at present\n目前很难处理</p>\n</blockquote>\n<p>“从长远来看有理由付出的代价”和“目前很难处理”不是一回事，所以C与主旨代入题干后得到的答案不一致。</p>\n<p><strong>复盘判断：C排除。</strong></p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"C","sourceLine":1716,"cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":true},"focusId":"focus-q27-C-3"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"D. are justifiable in the long run","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 27题","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-D-0\"><blockquote>\n<p>从长远来看是合理的</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>justifiable</code>不认识，只能看出<code>in the long run</code>与<code>ultimately</code>、<code>future</code>高度对应，所以把D强保留。复盘时知道<code>justifiable</code>就是“合理的、有正当理由的”，最后一块对应也补全了。</p>\n<p><strong>选项类型：正确同义改写。</strong></p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"27","option":"D","sourceLine":1736,"cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false},"focusId":"focus-q27-D-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"D. are justifiable in the long run","level":4,"breadcrumb":"27题 / D. are justifiable in the long run","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-D-0\"><blockquote>\n<p>从长远来看是合理的</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>justifiable</code>不认识，只能看出<code>in the long run</code>与<code>ultimately</code>、<code>future</code>高度对应，所以把D强保留。复盘时知道<code>justifiable</code>就是“合理的、有正当理由的”，最后一块对应也补全了。</p>\n<p><strong>选项类型：正确同义改写。</strong></p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-D-1\"><h3>定位比对法</h3><p>把D接到题干后，意思是：</p>\n<blockquote>\n<p>作者认为，研究产生的碳排放从长远来看是合理的。</p>\n</blockquote>\n<p>它与原文的对应非常完整：</p>\n<blockquote>\n<p>The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.</p>\n</blockquote>\n<p>其中：</p>\n<ul>\n<li><code>justifiable</code>对应<code>well spent</code>，都表示这项代价有理由、值得付出；</li>\n<li><code>in the long run</code>对应<code>ultimately</code>和<code>the future of our planet</code>；</li>\n<li>两边的主语都是研究产生的碳排放。</li>\n</ul>\n<p>因此，D没有照抄原文，但完整保留了原文的评价、对象和时间范围。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"D","sourceLine":1748,"cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false},"focusId":"focus-q27-D-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"D. are justifiable in the long run","level":4,"breadcrumb":"27题 / D. are justifiable in the long run","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-D-0\"><blockquote>\n<p>从长远来看是合理的</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>justifiable</code>不认识，只能看出<code>in the long run</code>与<code>ultimately</code>、<code>future</code>高度对应，所以把D强保留。复盘时知道<code>justifiable</code>就是“合理的、有正当理由的”，最后一块对应也补全了。</p>\n<p><strong>选项类型：正确同义改写。</strong></p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-D-1\"><h3>定位比对法</h3><p>把D接到题干后，意思是：</p>\n<blockquote>\n<p>作者认为，研究产生的碳排放从长远来看是合理的。</p>\n</blockquote>\n<p>它与原文的对应非常完整：</p>\n<blockquote>\n<p>The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.</p>\n</blockquote>\n<p>其中：</p>\n<ul>\n<li><code>justifiable</code>对应<code>well spent</code>，都表示这项代价有理由、值得付出；</li>\n<li><code>in the long run</code>对应<code>ultimately</code>和<code>the future of our planet</code>；</li>\n<li>两边的主语都是研究产生的碳排放。</li>\n</ul>\n<p>因此，D没有照抄原文，但完整保留了原文的评价、对象和时间范围。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-D-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.\n多亏他的发明，我们真正有机会减少全世界的碳排放。</p>\n</blockquote>\n<p>后文还写道：</p>\n<blockquote>\n<p>LUMI in Finland... is astonishingly carbon-negative.\n芬兰的LUMI令人惊讶地实现了负碳。</p>\n</blockquote>\n<p>实际后文不断给出科研和技术带来的长期好处，说明科研当前产生的代价能够换来减排办法。</p>\n<p>如果D成立，后文应该写成：</p>\n<blockquote>\n<p>Ultimately, these scientific advances will help reduce carbon emissions and safeguard the future of our planet.\n从长远来看，这些科学进步将帮助减少碳排放，并保护地球的未来。</p>\n</blockquote>\n<p>这种改写与实际后文的Green和LUMI两个例子完全同向，所以D成立。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"D","sourceLine":1766,"cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false},"focusId":"focus-q27-D-2"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"D. are justifiable in the long run","level":4,"breadcrumb":"27题 / D. are justifiable in the long run","html":"<section class=\"revealPart optionLead\" id=\"focus-q27-D-0\"><blockquote>\n<p>从长远来看是合理的</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时<code>justifiable</code>不认识，只能看出<code>in the long run</code>与<code>ultimately</code>、<code>future</code>高度对应，所以把D强保留。复盘时知道<code>justifiable</code>就是“合理的、有正当理由的”，最后一块对应也补全了。</p>\n<p><strong>选项类型：正确同义改写。</strong></p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q27-D-1\"><h3>定位比对法</h3><p>把D接到题干后，意思是：</p>\n<blockquote>\n<p>作者认为，研究产生的碳排放从长远来看是合理的。</p>\n</blockquote>\n<p>它与原文的对应非常完整：</p>\n<blockquote>\n<p>The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.</p>\n</blockquote>\n<p>其中：</p>\n<ul>\n<li><code>justifiable</code>对应<code>well spent</code>，都表示这项代价有理由、值得付出；</li>\n<li><code>in the long run</code>对应<code>ultimately</code>和<code>the future of our planet</code>；</li>\n<li>两边的主语都是研究产生的碳排放。</li>\n</ul>\n<p>因此，D没有照抄原文，但完整保留了原文的评价、对象和时间范围。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-D-2\"><h3>写作视角法</h3><p>后文实际写的是：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.\n多亏他的发明，我们真正有机会减少全世界的碳排放。</p>\n</blockquote>\n<p>后文还写道：</p>\n<blockquote>\n<p>LUMI in Finland... is astonishingly carbon-negative.\n芬兰的LUMI令人惊讶地实现了负碳。</p>\n</blockquote>\n<p>实际后文不断给出科研和技术带来的长期好处，说明科研当前产生的代价能够换来减排办法。</p>\n<p>如果D成立，后文应该写成：</p>\n<blockquote>\n<p>Ultimately, these scientific advances will help reduce carbon emissions and safeguard the future of our planet.\n从长远来看，这些科学进步将帮助减少碳排放，并保护地球的未来。</p>\n</blockquote>\n<p>这种改写与实际后文的Green和LUMI两个例子完全同向，所以D成立。</p>\n</section><section class=\"revealPart\" id=\"focus-q27-D-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>Energy-intensive research work is inevitable.\n高耗能的科研工作是不可避免的。</p>\n</blockquote>\n<p>把这个主旨直接代入27题题干：</p>\n<blockquote>\n<p>既然作者认为高耗能科研工作是不可避免的，那么作者应该认为科研产生的碳排放“是无法完全避免、从长远来看有理由付出的代价”。</p>\n</blockquote>\n<p>D实际说的是：</p>\n<blockquote>\n<p>are justifiable in the long run\n从长远来看是合理的</p>\n</blockquote>\n<p>“从长远来看有理由付出的代价”和“从长远来看是合理的”表达的是同一个意思，所以D与主旨代入题干后得到的答案一致。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"27","option":"D","sourceLine":1787,"cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":true},"focusId":"focus-q27-D-3"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"27题结论","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 27题","html":"<blockquote>\n<p><strong>27. D. are justifiable in the long run</strong></p>\n</blockquote>\n<p>这道题最关键的区别是：</p>\n<blockquote>\n<p>作者承认科研耗能和担忧都有事实基础，但不赞成因此缩减研究；作者最终认为科研排放是值得付出的长期代价。</p>\n</blockquote>\n<p>三个错误项中，A属于第三类：从科研耗能和碳排放脑补出“已经造成严重后果”；B、C属于第一类，分别歪曲了作者对担忧的态度和<code>hard</code>所修饰的对象。</p>\n","context":{"mode":"image","asset":"annotated","label":"27题","focus":[70,4850,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"conclusion","question":"27","option":null,"sourceLine":1807,"questionConclusion":true}},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"28题 · 题干、题型与核心出处","level":2,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","html":"<blockquote>\n<p>The example of Green in Paragraph 5 is used to illustrate ______.\n第五段举Green的例子，是为了说明什么？</p>\n</blockquote>\n<h3>题型</h3><p>这是一道例子作用题。</p>\n<p>题目不是问Green做了什么，而是问作者为什么要写Green。例子作用题要看：</p>\n<ul>\n<li>例子前面提出了什么观点；</li>\n<li>例子本身写了什么；</li>\n<li>例子最后落到了什么结果。</li>\n</ul>\n<h3>核心出处</h3><p>第四段先提出观点：</p>\n<blockquote>\n<p>But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.</p>\n</blockquote>\n<p>第五段接着说：</p>\n<blockquote>\n<p>Recognising the hope that science and engineering can bring was the impetus behind the creation of the Millennium Technology Prize...</p>\n</blockquote>\n<p>随后作者举Green的例子，并在最后写明结果：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p>\n</blockquote>\n<p>完整论证链是：</p>\n<blockquote>\n<p>科学能够产生实际作用、给人类带来希望\n→ Green的科研发明得到广泛应用\n→ 这项发明给世界带来了减少碳排放的机会。</p>\n</blockquote>\n","context":{"mode":"image","asset":"annotated","label":"28题","focus":[70,5060,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"question","question":"28","option":null,"sourceLine":1817,"questionIntro":true}},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. the achievements of great scientists","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 28题","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-A-0\"><blockquote>\n<p>伟大科学家的成就</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看出Green确实取得了成就，但题目问的是例子作用，A没有包含发明带来的减排结果，所以被初步排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>Green确实有成就，A本身不是假话。但题目问的是“为什么举Green”，属于例子作用；A只回答了“Green做过什么”，属于例子内部的真实细节。它错的不是内容虚假，而是拿细节回答作用，答错了题干要求的层面。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Professor Martin Green... is the inventor of the Passivated Emitter and Rear Cell technology...</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"28题","focus":[70,5060,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"28","option":"A","sourceLine":1852,"cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false},"focusId":"focus-q28-A-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. the achievements of great scientists","level":4,"breadcrumb":"28题 / A. the achievements of great scientists","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-A-0\"><blockquote>\n<p>伟大科学家的成就</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看出Green确实取得了成就，但题目问的是例子作用，A没有包含发明带来的减排结果，所以被初步排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>Green确实有成就，A本身不是假话。但题目问的是“为什么举Green”，属于例子作用；A只回答了“Green做过什么”，属于例子内部的真实细节。它错的不是内容虚假，而是拿细节回答作用，答错了题干要求的层面。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Professor Martin Green... is the inventor of the Passivated Emitter and Rear Cell technology...</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q28-A-1\"><h3>定位比对法</h3><p>把A接到题干后面，整句话是在说：</p>\n<blockquote>\n<p>作者举Green的例子，是为了说明伟大科学家的成就。</p>\n</blockquote>\n<p>A说的是“科学家的成就”。原文确实写到：</p>\n<blockquote>\n<p>Professor Martin Green... is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world’s solar panels.</p>\n</blockquote>\n<p>Green发明了一项技术，而且这项技术已经被广泛使用。这当然可以算他的成就，所以A不是完全没有原文依据。</p>\n<p>但是，作者没有写到这里就停下来，后面还专门补了一句：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p>\n</blockquote>\n<p>这句话把重点落到了Green的发明给世界带来的实际作用：它让人类有机会减少碳排放。</p>\n<p>再联系前一段：</p>\n<blockquote>\n<p>But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.</p>\n</blockquote>\n<p>前面刚说，解决人类重大问题时，展示科学的实际作用很关键；后面就举Green的发明帮助减排。因此，Green的个人成就是例子里的事实，但不是作者举这个例子最终要说明的东西。</p>\n<p>A只概括了“Green取得了成就”，没有概括“科学研究给人类带来了什么好处”。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"28题","focus":[70,5060,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"28","option":"A","sourceLine":1866,"cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false},"focusId":"focus-q28-A-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. the achievements of great scientists","level":4,"breadcrumb":"28题 / A. the achievements of great scientists","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-A-0\"><blockquote>\n<p>伟大科学家的成就</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看出Green确实取得了成就，但题目问的是例子作用，A没有包含发明带来的减排结果，所以被初步排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>Green确实有成就，A本身不是假话。但题目问的是“为什么举Green”，属于例子作用；A只回答了“Green做过什么”，属于例子内部的真实细节。它错的不是内容虚假，而是拿细节回答作用，答错了题干要求的层面。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Professor Martin Green... is the inventor of the Passivated Emitter and Rear Cell technology...</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q28-A-1\"><h3>定位比对法</h3><p>把A接到题干后面，整句话是在说：</p>\n<blockquote>\n<p>作者举Green的例子，是为了说明伟大科学家的成就。</p>\n</blockquote>\n<p>A说的是“科学家的成就”。原文确实写到：</p>\n<blockquote>\n<p>Professor Martin Green... is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world’s solar panels.</p>\n</blockquote>\n<p>Green发明了一项技术，而且这项技术已经被广泛使用。这当然可以算他的成就，所以A不是完全没有原文依据。</p>\n<p>但是，作者没有写到这里就停下来，后面还专门补了一句：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p>\n</blockquote>\n<p>这句话把重点落到了Green的发明给世界带来的实际作用：它让人类有机会减少碳排放。</p>\n<p>再联系前一段：</p>\n<blockquote>\n<p>But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.</p>\n</blockquote>\n<p>前面刚说，解决人类重大问题时，展示科学的实际作用很关键；后面就举Green的发明帮助减排。因此，Green的个人成就是例子里的事实，但不是作者举这个例子最终要说明的东西。</p>\n<p>A只概括了“Green取得了成就”，没有概括“科学研究给人类带来了什么好处”。</p>\n</section><section class=\"revealPart\" id=\"focus-q28-A-2\"><h3>写作视角法</h3><p>后文实际是这样写的：</p>\n<blockquote>\n<p>One of the past winners, Professor Martin Green... is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world’s solar panels. Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.\n过去的一位获奖者Martin Green教授发明了钝化发射极和背面电池技术，这项技术现在应用于世界上大多数太阳能板。多亏他的发明，我们真正有机会减少全世界的碳排放。</p>\n</blockquote>\n<p>实际后文先介绍发明，最后把重点落到这项发明产生的减排作用上。</p>\n<p>如果A成立，后文应该把重点放在Green本人取得了多么伟大的成就上。根据实际后文改写，大致应该是：</p>\n<blockquote>\n<p>One of the past winners, Professor Martin Green, is a great scientist whose remarkable invention has earned him worldwide recognition and established his outstanding position in science.\n过去的一位获奖者Martin Green教授是一位伟大的科学家，他的重要发明为他赢得了世界范围的认可，并确立了他在科学界的杰出地位。</p>\n</blockquote>\n<p>这样写，后文才会真正围绕“伟大科学家的成就”展开。实际文章却没有强调Green的名望和个人地位，而是强调他的发明给世界带来的减排机会。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"28题","focus":[70,5060,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"28","option":"A","sourceLine":1892,"cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false},"focusId":"focus-q28-A-2"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"A. the achievements of great scientists","level":4,"breadcrumb":"28题 / A. the achievements of great scientists","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-A-0\"><blockquote>\n<p>伟大科学家的成就</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时已经能看出Green确实取得了成就，但题目问的是例子作用，A没有包含发明带来的减排结果，所以被初步排除。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>Green确实有成就，A本身不是假话。但题目问的是“为什么举Green”，属于例子作用；A只回答了“Green做过什么”，属于例子内部的真实细节。它错的不是内容虚假，而是拿细节回答作用，答错了题干要求的层面。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Professor Martin Green... is the inventor of the Passivated Emitter and Rear Cell technology...</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q28-A-1\"><h3>定位比对法</h3><p>把A接到题干后面，整句话是在说：</p>\n<blockquote>\n<p>作者举Green的例子，是为了说明伟大科学家的成就。</p>\n</blockquote>\n<p>A说的是“科学家的成就”。原文确实写到：</p>\n<blockquote>\n<p>Professor Martin Green... is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world’s solar panels.</p>\n</blockquote>\n<p>Green发明了一项技术，而且这项技术已经被广泛使用。这当然可以算他的成就，所以A不是完全没有原文依据。</p>\n<p>但是，作者没有写到这里就停下来，后面还专门补了一句：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p>\n</blockquote>\n<p>这句话把重点落到了Green的发明给世界带来的实际作用：它让人类有机会减少碳排放。</p>\n<p>再联系前一段：</p>\n<blockquote>\n<p>But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.</p>\n</blockquote>\n<p>前面刚说，解决人类重大问题时，展示科学的实际作用很关键；后面就举Green的发明帮助减排。因此，Green的个人成就是例子里的事实，但不是作者举这个例子最终要说明的东西。</p>\n<p>A只概括了“Green取得了成就”，没有概括“科学研究给人类带来了什么好处”。</p>\n</section><section class=\"revealPart\" id=\"focus-q28-A-2\"><h3>写作视角法</h3><p>后文实际是这样写的：</p>\n<blockquote>\n<p>One of the past winners, Professor Martin Green... is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world’s solar panels. Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.\n过去的一位获奖者Martin Green教授发明了钝化发射极和背面电池技术，这项技术现在应用于世界上大多数太阳能板。多亏他的发明，我们真正有机会减少全世界的碳排放。</p>\n</blockquote>\n<p>实际后文先介绍发明，最后把重点落到这项发明产生的减排作用上。</p>\n<p>如果A成立，后文应该把重点放在Green本人取得了多么伟大的成就上。根据实际后文改写，大致应该是：</p>\n<blockquote>\n<p>One of the past winners, Professor Martin Green, is a great scientist whose remarkable invention has earned him worldwide recognition and established his outstanding position in science.\n过去的一位获奖者Martin Green教授是一位伟大的科学家，他的重要发明为他赢得了世界范围的认可，并确立了他在科学界的杰出地位。</p>\n</blockquote>\n<p>这样写，后文才会真正围绕“伟大科学家的成就”展开。实际文章却没有强调Green的名望和个人地位，而是强调他的发明给世界带来的减排机会。</p>\n</section><section class=\"revealPart\" id=\"focus-q28-A-3\"><h3>主旨交叉验证法</h3><p>30题的正确答案是：</p>\n<blockquote>\n<p>Energy-intensive research work is inevitable.\n高耗能的科研工作是不可避免的。</p>\n</blockquote>\n<p>把这个主旨直接代入28题题干：</p>\n<blockquote>\n<p>既然作者认为高耗能科研工作是不可避免的，那么作者举Green的例子，应该是为了说明“科学研究能够带来实际回报，所以不能因为耗能就简单停止”。</p>\n</blockquote>\n<p>但A实际说的是：</p>\n<blockquote>\n<p>the achievements of great scientists\n伟大科学家的成就</p>\n</blockquote>\n<p>“科学研究带来的实际回报”和“伟大科学家的个人成就”不是一回事，所以A与主旨代入题干后得到的答案不一致。</p>\n<p><strong>复盘判断：A排除。</strong></p>\n</section>","context":{"mode":"image","asset":"annotated","label":"28题","focus":[70,5060,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"28","option":"A","sourceLine":1908,"cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":true},"focusId":"focus-q28-A-3"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. the urgency of addressing climate change","level":3,"breadcrumb":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升 / 28题","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-B-0\"><blockquote>\n<p>应对气候变化的紧迫性</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时能够看到Green的发明帮助减少碳排放，却没有看到第五段强调“紧迫”，因此直接排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原文有“减少碳排放”，命题人让我们从气候问题继续联想到“情况非常紧迫”，但这一步是我们自己补出来的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p>\n</blockquote>\n</section>","context":{"mode":"image","asset":"annotated","label":"28题","focus":[70,5060,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"option","question":"28","option":"B","sourceLine":1928,"cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false},"focusId":"focus-q28-B-0"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. the urgency of addressing climate change","level":4,"breadcrumb":"28题 / B. the urgency of addressing climate change","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-B-0\"><blockquote>\n<p>应对气候变化的紧迫性</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时能够看到Green的发明帮助减少碳排放，却没有看到第五段强调“紧迫”，因此直接排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原文有“减少碳排放”，命题人让我们从气候问题继续联想到“情况非常紧迫”，但这一步是我们自己补出来的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q28-B-1\"><h3>定位比对法</h3><p>把B接到题干后面，整句话是在说：</p>\n<blockquote>\n<p>作者举Green的例子，是为了说明应对气候变化非常紧迫。</p>\n</blockquote>\n<p>B包含两层意思：</p>\n<ul>\n<li><code>addressing climate change</code>：应对气候变化；</li>\n<li><code>urgency</code>：这件事非常紧急。</li>\n</ul>\n<p>Green所在的第五段写的是：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p>\n</blockquote>\n<p>这句话说明Green的发明能够帮助人类减少碳排放。因此，B中“应对气候变化”这一部分与原文有联系。</p>\n<p>但是，第五段没有写时间已经不多、问题正在迅速恶化，或者人类必须立即行动。它强调的是<code>a real chance</code>，也就是科学发明带来的机会和希望，而不是气候问题有多紧迫。</p>\n<p>文章第一段确实出现了：</p>\n<blockquote>\n<p>The crisis is here.</p>\n</blockquote>\n<p>但那是一些科学家主张缩减研究时说的话。题干问的是第五段中Green这个例子的作用，不能因为文章其他位置出现过危机感，就把它放到Green的例子上。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"28题","focus":[70,5060,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"28","option":"B","sourceLine":1942,"cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false},"focusId":"focus-q28-B-1"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#ea580c","title":"B. the urgency of addressing climate change","level":4,"breadcrumb":"28题 / B. the urgency of addressing climate change","html":"<section class=\"revealPart optionLead\" id=\"focus-q28-B-0\"><blockquote>\n<p>应对气候变化的紧迫性</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong>当时能够看到Green的发明帮助减少碳排放，却没有看到第五段强调“紧迫”，因此直接排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>原文有“减少碳排放”，命题人让我们从气候问题继续联想到“情况非常紧迫”，但这一步是我们自己补出来的。</p>\n<p><strong>命题人借用的原文材料：</strong></p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-q28-B-1\"><h3>定位比对法</h3><p>把B接到题干后面，整句话是在说：</p>\n<blockquote>\n<p>作者举Green的例子，是为了说明应对气候变化非常紧迫。</p>\n</blockquote>\n<p>B包含两层意思：</p>\n<ul>\n<li><code>addressing climate change</code>：应对气候变化；</li>\n<li><code>urgency</code>：这件事非常紧急。</li>\n</ul>\n<p>Green所在的第五段写的是：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.</p>\n</blockquote>\n<p>这句话说明Green的发明能够帮助人类减少碳排放。因此，B中“应对气候变化”这一部分与原文有联系。</p>\n<p>但是，第五段没有写时间已经不多、问题正在迅速恶化，或者人类必须立即行动。它强调的是<code>a real chance</code>，也就是科学发明带来的机会和希望，而不是气候问题有多紧迫。</p>\n<p>文章第一段确实出现了：</p>\n<blockquote>\n<p>The crisis is here.</p>\n</blockquote>\n<p>但那是一些科学家主张缩减研究时说的话。题干问的是第五段中Green这个例子的作用，不能因为文章其他位置出现过危机感，就把它放到Green的例子上。</p>\n</section><section class=\"revealPart\" id=\"focus-q28-B-2\"><h3>写作视角法</h3><p>后文实际是这样写的：</p>\n<blockquote>\n<p>Thanks to his invention, we have a real chance to decrease the world’s carbon emissions.\n多亏他的发明，我们真正有机会减少全世界的碳排放。</p>\n</blockquote>\n<p>实际后文的重点是Green的发明给人类带来了减排的机会。</p>\n<p>如果B成立，后文应该突出气候问题越来越紧急，以及人类必须立即行动。根据实际后文改写，大致应该是：</p>\n<blockquote>\n<p>As the climate crisis becomes increasingly urgent, we must make immediate use of inventions like his before we lose the chance to decrease the world’s carbon emissions.\n随着气候危机变得越来越紧迫，我们必须立即利用他这样的发明，否则就可能失去减少全球碳排放的机会。</p>\n</blockquote>\n<p>这样才是在说明<code>urgency</code>。实际文章没有“越来越紧迫”“立即”或“否则就来不及”等内容。</p>\n</section>","context":{"mode":"image","asset":"annotated","label":"28题","focus":[70,5060,940,180],"sourceW":1080,"sourceH":6116},"meta":{"kind":"method","question":"28","option":"B","sourceLine":1967,"cumulative":true,"cumulativeGroup":"question-28-option-B","cumulativeFinal":false},"focusId":"focus-q28-B-2"},{"section":3,"sectionName":"第三鸟 · 题目复盘","color":"#e
