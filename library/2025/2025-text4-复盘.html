时三个部分合在一起，恰好解释了例子为什么放在这里。\n\n**出处：**\n\n> Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself.\n>\n> As technology advances and a format becomes obsolete, the object is useless.","context":{"mode":"image","asset":"questions","focus":[250,2041,1800,85],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"39","option":"C"},"focusId":"focus-q39-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-C-0\">\u003cblockquote>\n\u003cp>格式过时可能导致信息丧失\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的 losing information in obsolete formats 要区分信息和承载它的东西，段首 only be the carrier 正是说可能只保留载体，因此回看段首区分与格式过时的下一句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>原文的 only be the carrier 将保住磁盘之类的物件与保住信息分开；随后格式过时让物件没有用，才出现盯着ZIP磁盘却不知怎样取文件的例子。C的 losing information in obsolete formats 保留了相同的可能性和具体条件。这里的失去信息不必等于磁盘碎裂或信息被主动删除，也包括载体仍在却无法把信息读出来。\u003c/p>\n\u003cp>C把载体存留、信息未必存留和格式过时三个部分合在一起，恰好解释了例子为什么放在这里。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself.\u003c/p>\n\u003cp>As technology advances and a format becomes obsolete, the object is useless.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. the possibility of losing information in obsolete formats","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 引用ZIP磁盘这个例子，是为了说明格式过时可能导致信息丧失。\n\nC的 losing information in obsolete formats 要区分信息和承载它的东西，段首 only be the carrier 正是说可能只保留载体，因此回看段首区分与格式过时的下一句。\n\n原文的 only be the carrier 将保住磁盘之类的物件与保住信息分开；随后格式过时让物件没有用，才出现盯着ZIP磁盘却不知怎样取文件的例子。C的 losing information in obsolete formats 保留了相同的可能性和具体条件。这里的失去信息不必等于磁盘碎裂或信息被主动删除，也包括载体仍在却无法把信息读出来。\n\nC把载体存留、信息未必存留和格式过时 us":[250,1775,1800,441],"sourceW":2256,"sourceH":3142,"label":"2025英语一Text 4题目"},"meta":{"question":"39","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>39. C. the possibility of losing information in obsolete formats\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原因是格式过时，未写采用特殊提取手段。\u003c/p>\n\u003cp>B：缺少迁移会有风险，不能推出迁移无法实施。\u003c/p>\n\u003cp>C：载体存在而旧格式无法读取，正是信息可能丧失的例证。\u003c/p>\n\u003cp>D：数字载体被换成模拟设备，读取被换成存入。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：有形文物的持久性**（段落1问题引入） 古董店的文物：（照片 + 信件 + 1964-65世界博览会宣传册） → 看似短暂却持续存在：（几十年甚至几个世纪） → 原因：【它们是有形的（tangible）】\n\n↓（对比引出核心问题）\n\n**逻辑层次2：数字信息的脆弱性与保存悖论**（段落2问题深化） 提出问题：（数字信息的生命周期？） → 历史对比：【千年来的知识传承：（依赖幸存的文物 + 尽管创造者忽视 + 物品本身即媒介）】→ 传统保存模式：（图书馆和档案馆承担责任） → 数字化带来的矛盾：（全球访问便利 // 但产生大海捞针问题）\n\n↓（深入分析现实困境）\n\n**逻辑层次3：数字时代的保存危机**（段落3危机揭示） 图书管理员的困境：【无私奉献反被误解：（用户认为\"手机里什么都有\" → 图书馆不再重要）】→ 关键问题：（谁使普遍访问成为可能？ + 如何维持？ + 谁策划保存？） → 可怕现实：【原生数字信息：（如果不是图书管理员和档案管理员 → 无人保存）】→ 核心观点：（数字信息需要更多照料）\n\n→（具体问题说明）\n\n**逻辑层次4：技术过时带来的噩梦**（段落4技术挑战） 保存的假象：（保存载体 ≠ 保存信息） → 技术过时问题：【格式过时 → 对象无用（如ZIP磁盘）】→ 历史学家的噩梦：（没有持续迁移 → 历史记录在数字化时代戛然而止）\n\n↑（解决方案与希望）\n\n**逻辑层次5：图书管理员的使命与希望**（段落5结论展望） 现状承认：（全面解决方案尚不存在 + 共享历史学家的恐惧） // 但存在希望：【众多图书管理员致力于：（发现 + 组织 + 保存数字信息）】→ 独特优势：（理解用户如何寻找和使用信息） → 核心作用：（识别、保存、提供可访问性） → 最终愿景：（数字领域虽充满挑战 // 但并非不可能）\n\n↑（总体评价）\n\n**全文核心观点：** 数字时代带来了信息保存的根本性挑战：与能够自然存续的有形文物不同，数字信息需要持续的、有意识的保存努力。虽然数字化带来了前所未有的访问便利，但也造成了保存危机——格式过时、载体失效、缺乏系统性保存。图书管理员和档案管理员在这个危机中扮演着关键角色，他们是连接过去与未来的桥梁，确保数字时代的历史记录不会断层。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：有形文物的持久性\u003c/strong>（段落1问题引入） 古董店的文物：（照片 + 信件 + 1964-65世界博览会宣传册） → 看似短暂却持续存在：（几十年甚至几个世纪） → 原因：【它们是有形的（tangible）】\u003c/p>\n\u003cp>↓（对比引出核心问题）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：数字信息的脆弱性与保存悖论\u003c/strong>（段落2问题深化） 提出问题：（数字信息的生命周期？） → 历史对比：【千年来的知识传承：（依赖幸存的文物 + 尽管创造者忽视 + 物品本身即媒介）】→ 传统保存模式：（图书馆和档案馆承担责任） → 数字化带来的矛盾：（全球访问便利 // 但产生大海捞针问题）\u003c/p>\n\u003cp>↓（深入分析现实困境）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：数字时代的保存危机\u003c/strong>（段落3危机揭示） 图书管理员的困境：【无私奉献反被误解：（用户认为&quot;手机里什么都有&quot; → 图书馆不再重要）】→ 关键问题：（谁使普遍访问成为可能？ + 如何维持？ + 谁策划保存？） → 可怕现实：【原生数字信息：（如果不是图书管理员和档案管理员 → 无人保存）】→ 核心观点：（数字信息需要更多照料）\u003c/p>\n\u003cp>→（具体问题说明）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：技术过时带来的噩梦\u003c/strong>（段落4技术挑战） 保存的假象：（保存载体 ≠ 保存信息） → 技术过时问题：【格式过时 → 对象无用（如ZIP磁盘）】→ 历史学家的噩梦：（没有持续迁移 → 历史记录在数字化时代戛然而止）\u003c/p>\n\u003cp>↑（解决方案与希望）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：图书管理员的使命与希望\u003c/strong>（段落5结论展望） 现状承认：（全面解决方案尚不存在 + 共享历史学家的恐惧） // 但存在希望：【众多图书管理员致力于：（发现 + 组织 + 保存数字信息）】→ 独特优势：（理解用户如何寻找和使用信息） → 核心作用：（识别、保存、提供可访问性） → 最终愿景：（数字领域虽充满挑战 // 但并非不可能）\u003c/p>\n\u003cp>↑（总体评价）\u003c/p>\n\u003cp>\u003cstrong>全文核心观点：\u003c/strong> 数字时代带来了信息保存的根本性挑战：与能够自然存续的有形文物不同，数字信息需要持续的、有意识的保存努力。虽然数字化带来了前所未有的访问便利，但也造成了保存危机——格式过时、载体失效、缺乏系统性保存。图书管理员和档案管理员在这个危机中扮演着关键角色，他们是连接过去与未来的桥梁，确保数字时代的历史记录不会断层。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n【答案】B. Do not confuse survival with a preservation plan\n\n> 不要把偶然存留当成保存方案\n\n这一部分借旧信件的幸存解释过去记录怎样偶然留下，再强调观察到幸存者并不能证明有形材料安全或保存工作可以省略。\n\n旧信件证明的首先是什么？\n\n> someone kept a drawer of papers\n\n记录可能因有人保留抽屉中的纸张而留下，说明一次具体存留的条件。这里没有证明所有同类信件都被保护，也没有把这种偶然经历提升成制度方法。\n\n为什么不能只看留存的收藏？\n\n> The missing ones are absent from the very collection being examined.\n\n消失的信件不会进入我们正在观察的集合。因此眼前有许多旧信件，仍不能单独支持所有有形材料都安全的结论，作者补上了样本看不见的另一面。\n\n最后把例子用于什么工作？\n\n> a possibility, not a reliable method\n\n偶然幸存只说明可以留下，方案则要说明条件能否维持或替代。末句将这些条件转向物理形式不同的材料，为数字保存引出更明确的任务。\n\n这一部分的推进关系是：\n\n> 一封旧信偶然存留 → 未存留者无法进入观察 → 可能留下不等于可靠方法 → 保存政策须识别并维持可读条件。\n\nsurvival指眼前这封信留下来的事实，preservation plan指可重复依靠的保存安排。Do not confuse强调事实证据支持的范围：承认幸存的价值，同时拒绝以单个结果替代对长期条件的安排。\n\n再看最强干扰项C：Replace preservation with more digitisation。\n\n“用更多数字化代替保存”看似能回答不同物理形式该怎样处理，但本文没有提出扫描更多信件，更没有说生成数字副本即可省掉照料。它要求检查可读条件，恰是保存方案需要继续解决的问题。\n\n**41题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】B. Do not confuse survival with a preservation plan\u003c/p>\n\u003cblockquote>\n\u003cp>不要把偶然存留当成保存方案\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分借旧信件的幸存解释过去记录怎样偶然留下，再强调观察到幸存者并不能证明有形材料安全或保存工作可以省略。\u003c/p>\n\u003cp>旧信件证明的首先是什么？\u003c/p>\n\u003cblockquote>\n\u003cp>someone kept a drawer of papers\u003c/p>\n\u003c/blockquote>\n\u003cp>记录可能因有人保留抽屉中的纸张而留下，说明一次具体存留的条件。这里没有证明所有同类信件都被保护，也没有把这种偶然经历提升成制度方法。\u003c/p>\n\u003cp>为什么不能只看留存的收藏？\u003c/p>\n\u003cblockquote>\n\u003cp>The missing ones are absent from the very collection being examined.\u003c/p>\n\u003c/blockquote>\n\u003cp>消失的信件不会进入我们正在观察的集合。因此眼前有许多旧信件，仍不能单独支持所有有形材料都安全的结论，作者补上了样本看不见的另一面。\u003c/p>\n\u003cp>最后把例子用于什么工作？\u003c/p>\n\u003cblockquote>\n\u003cp>a possibility, not a reliable method\u003c/p>\n\u003c/blockquote>\n\u003cp>偶然幸存只说明可以留下，方案则要说明条件能否维持或替代。末句将这些条件转向物理形式不同的材料，为数字保存引出更明确的任务。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>一封旧信偶然存留 → 未存留者无法进入观察 → 可能留下不等于可靠方法 → 保存政策须识别并维持可读条件。\u003c/p>\n\u003c/blockquote>\n\u003cp>survival指眼前这封信留下来的事实，preservation plan指可重复依靠的保存安排。Do not confuse强调事实证据支持的范围：承认幸存的价值，同时拒绝以单个结果替代对长期条件的安排。\u003c/p>\n\u003cp>再看最强干扰项C：Replace preservation with more digitisation。\u003c/p>\n\u003cp>“用更多数字化代替保存”看似能回答不同物理形式该怎样处理，但本文没有提出扫描更多信件，更没有说生成数字副本即可省掉照料。它要求检查可读条件，恰是保存方案需要继续解决的问题。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n【答案】G. Keep the information usable, not just the carrier intact\n\n> 不仅保住载体，还要让信息可用\n\n这一部分区分介质完好和信息能够读出，指出数字保存需要同时维持文件与解释文件的技术条件。\n\n先看物件存在与读取的反差。\n\n> long after the files it holds become difficult to read\n\n磁盘可以在文件已难读取后继续留在架上，说明两种存续不是同一回事。标签整齐也不能替代读取检验，这是段落立论的具体情境。\n\n困难可能在哪里？\n\n> interpret its format\n\n读取需要设备或软件解释格式，当这种环境不再可得，外壳没有破损也可能取不出内容。作者明确把问题从物理存在推进到技术可解释性。\n\n最后用什么标准判断成功？\n\n> when the record can be used\n\n未来读者真正需要使用记录，所以转移到可用环境后还要检查。指得出旧物只是保住载体，能使用才满足本段对信息保存的要求。\n\n这一部分的推进关系是：\n\n> 磁盘仍在而文件难读 → 读取环境可能消失 → 保存载体只是部分任务 → 转移并检查信息，使未来读者仍可使用。\n\ncarrier intact概括磁盘外壳与对象仍然存在，information usable则要求格式能被解释、转移后还能使用。标题的not just保留载体保存的作用，同时说明它不足以独立完成全部任务。\n\n再看最强干扰项A：Preserve the context as well as the content。\n\n“同时保存语境”同样关心记录是否有用，但本段没有作者身份、出处或文件之间的关系。其障碍是软件和设备不再支持格式，解决的是能否读出；下一层如何解释记录的历史语境不能代替这一技术问题。\n\n**42题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】G. Keep the information usable, not just the carrier intact\u003c/p>\n\u003cblockquote>\n\u003cp>不仅保住载体，还要让信息可用\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分区分介质完好和信息能够读出，指出数字保存需要同时维持文件与解释文件的技术条件。\u003c/p>\n\u003cp>先看物件存在与读取的反差。\u003c/p>\n\u003cblockquote>\n\u003cp>long after the files it holds become difficult to read\u003c/p>\n\u003c/blockquote>\n\u003cp>磁盘可以在文件已难读取后继续留在架上，说明两种存续不是同一回事。标签整齐也不能替代读取检验，这是段落立论的具体情境。\u003c/p>\n\u003cp>困难可能在哪里？\u003c/p>\n\u003cblockquote>\n\u003cp>interpret its format\u003c/p>\n\u003c/blockquote>\n\u003cp>读取需要设备或软件解释格式，当这种环境不再可得，外壳没有破损也可能取不出内容。作者明确把问题从物理存在推进到技术可解释性。\u003c/p>\n\u003cp>最后用什么标准判断成功？\u003c/p>\n\u003cblockquote>\n\u003cp>when the record can be used\u003c/p>\n\u003c/blockquote>\n\u003cp>未来读者真正需要使用记录，所以转移到可用环境后还要检查。指得出旧物只是保住载体，能使用才满足本段对信息保存的要求。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>磁盘仍在而文件难读 → 读取环境可能消失 → 保存载体只是部分任务 → 转移并检查信息，使未来读者仍可使用。\u003c/p>\n\u003c/blockquote>\n\u003cp>carrier intact概括磁盘外壳与对象仍然存在，information usable则要求格式能被解释、转移后还能使用。标题的not just保留载体保存的作用，同时说明它不足以独立完成全部任务。\u003c/p>\n\u003cp>再看最强干扰项A：Preserve the context as well as the content。\u003c/p>\n\u003cp>“同时保存语境”同样关心记录是否有用，但本段没有作者身份、出处或文件之间的关系。其障碍是软件和设备不再支持格式，解决的是能否读出；下一层如何解释记录的历史语境不能代替这一技术问题。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n【答案】E. Make the work behind easy access visible\n\n> 让便利获取背后的劳动被看见\n\n这一部分追溯手机点击之前的收集、整理和维护，说明用户看不见劳动正是便利可能造成低估的原因。\n\n手机例子引出哪种归因？\n\n> attribute the result entirely to the device\n\n用户可能把瞬间检索完全归功于手机，entirely使这种认识遗漏了其他必要条件。作者要纠正的是结果归因，而不是否认手机能够提供便捷入口。\n\nYet之后补出哪些被省略的工作？\n\n> selected, described and placed in a system\n\n资料需要筛选、描述并进入系统，还需要持续维护。这串动作解释结果怎样成为可能，不能仅以“信息已经在网上”替代具体劳动。\n\n结尾为什么要解释检索背后的步骤？\n\n> depends on sustained work\n\n讲出后台劳动，是说明便利的持续依赖关系。作者同时说并不减损便利，表示希望用户理解服务条件，而不是退回难以访问的旧方式。\n\n这一部分的推进关系是：\n\n> 手机检索造成全部归功设备的诱惑 → 补出资料处理和维护 → 越便利越可能看不见机构 → 解释持续劳动以纠正低估。\n\neasy access是开头数秒取得文件的体验，work behind it是筛选、描述、入库和维护。Make…visible对应结尾解释检索步骤，直接针对看不见劳动而误以为机构无用这一因果。\n\n再看最强干扰项F：Treat easy access as proof that libraries are redundant。\n\n“以便利证明图书馆多余”几乎复述用户的表面想法，因此具有迷惑性。但本文把这种想法归因于劳动invisibility，并以Yet和depends纠正它；标题不能把被作者解释和反驳的误解当成作者结论。\n\n**43题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】E. Make the work behind easy access visible\u003c/p>\n\u003cblockquote>\n\u003cp>让便利获取背后的劳动被看见\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分追溯手机点击之前的收集、整理和维护，说明用户看不见劳动正是便利可能造成低估的原因。\u003c/p>\n\u003cp>手机例子引出哪种归因？\u003c/p>\n\u003cblockquote>\n\u003cp>attribute the result entirely to the device\u003c/p>\n\u003c/blockquote>\n\u003cp>用户可能把瞬间检索完全归功于手机，entirely使这种认识遗漏了其他必要条件。作者要纠正的是结果归因，而不是否认手机能够提供便捷入口。\u003c/p>\n\u003cp>Yet之后补出哪些被省略的工作？\u003c/p>\n\u003cblockquote>\n\u003cp>selected, described and placed in a system\u003c/p>\n\u003c/blockquote>\n\u003cp>资料需要筛选、描述并进入系统，还需要持续维护。这串动作解释结果怎样成为可能，不能仅以“信息已经在网上”替代具体劳动。\u003c/p>\n\u003cp>结尾为什么要解释检索背后的步骤？\u003c/p>\n\u003cblockquote>\n\u003cp>depends on sustained work\u003c/p>\n\u003c/blockquote>\n\u003cp>讲出后台劳动，是说明便利的持续依赖关系。作者同时说并不减损便利，表示希望用户理解服务条件，而不是退回难以访问的旧方式。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>手机检索造成全部归功设备的诱惑 → 补出资料处理和维护 → 越便利越可能看不见机构 → 解释持续劳动以纠正低估。\u003c/p>\n\u003c/blockquote>\n\u003cp>easy access是开头数秒取得文件的体验，work behind it是筛选、描述、入库和维护。Make…visible对应结尾解释检索步骤，直接针对看不见劳动而误以为机构无用这一因果。\u003c/p>\n\u003cp>再看最强干扰项F：Treat easy access as proof that libraries are redundant。\u003c/p>\n\u003cp>“以便利证明图书馆多余”几乎复述用户的表面想法，因此具有迷惑性。但本文把这种想法归因于劳动invisibility，并以Yet和depends纠正它；标题不能把被作者解释和反驳的误解当成作者结论。\u003c/p>\n\u003cp>\u003cstrong>43题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n【答案】A. Preserve the context as well as the content\n\n> 同时保存内容及其语境\n\n这一部分把可打开文件推进到可理解证据，说明作者、日期、关联与处理记录为什么也需要保存。\n\n开头把什么与什么区分？\n\n> Opening a file is not always enough\n\n文件打开只解决技术读取，作为证据理解还需要额外信息。这一句承接数字可读性的讨论，再明确提出本段的新层次，不能理解成反对打开或迁移文件。\n\n两个例子缺少的分别是什么？\n\n> without a date or a record of its source\n\n照片缺日期、来源就难放回历史；谈话消息脱离交换关系也会失去意义。二者都不是文件内容全消失，而是内容外围的定位与关联不完整。\n\n因此档案还应保存什么？\n\n> descriptions and relationships as well as files\n\n描述包括来源和处理经过，关系包括消息在交流中的位置。as well as要求与文件一起保存，末句再确认技术可读和历史可理解彼此支持但不等同。\n\n这一部分的推进关系是：\n\n> 能打开不等于能作证据理解 → 日期来源与关联缺失会减损意义 → 保存描述和关系 → 同时维持可读性与历史可理解性。\n\ncontent对应照片、消息和文件内的内容，context包括日期、来源、关联及处理记录。as well as强调不是用语境替代内容，而是补足内容作为历史证据所需的解释条件。\n\n再看最强干扰项G：Keep the information usable, not just the carrier intact。\n\n“让信息可用而不只保住载体”是相邻且较强的选择，因为两段都谈usefulness。但本段开头已假定文件能打开，关键不足转为日期、来源和消息关联；若只概括读取环境，会漏掉三个具体语境线索。\n\n**44题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】A. Preserve the context as well as the content\u003c/p>\n\u003cblockquote>\n\u003cp>同时保存内容及其语境\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把可打开文件推进到可理解证据，说明作者、日期、关联与处理记录为什么也需要保存。\u003c/p>\n\u003cp>开头把什么与什么区分？\u003c/p>\n\u003cblockquote>\n\u003cp>Opening a file is not always enough\u003c/p>\n\u003c/blockquote>\n\u003cp>文件打开只解决技术读取，作为证据理解还需要额外信息。这一句承接数字可读性的讨论，再明确提出本段的新层次，不能理解成反对打开或迁移文件。\u003c/p>\n\u003cp>两个例子缺少的分别是什么？\u003c/p>\n\u003cblockquote>\n\u003cp>without a date or a record of its source\u003c/p>\n\u003c/blockquote>\n\u003cp>照片缺日期、来源就难放回历史；谈话消息脱离交换关系也会失去意义。二者都不是文件内容全消失，而是内容外围的定位与关联不完整。\u003c/p>\n\u003cp>因此档案还应保存什么？\u003c/p>\n\u003cblockquote>\n\u003cp>descriptions and relationships as well as files\u003c/p>\n\u003c/blockquote>\n\u003cp>描述包括来源和处理经过，关系包括消息在交流中的位置。as well as要求与文件一起保存，末句再确认技术可读和历史可理解彼此支持但不等同。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>能打开不等于能作证据理解 → 日期来源与关联缺失会减损意义 → 保存描述和关系 → 同时维持可读性与历史可理解性。\u003c/p>\n\u003c/blockquote>\n\u003cp>content对应照片、消息和文件内的内容，context包括日期、来源、关联及处理记录。as well as强调不是用语境替代内容，而是补足内容作为历史证据所需的解释条件。\u003c/p>\n\u003cp>再看最强干扰项G：Keep the information usable, not just the carrier intact。\u003c/p>\n\u003cp>“让信息可用而不只保住载体”是相邻且较强的选择，因为两段都谈usefulness。但本段开头已假定文件能打开，关键不足转为日期、来源和消息关联；若只概括读取环境，会漏掉三个具体语境线索。\u003c/p>\n\u003cp>\u003cstrong>44题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n【答案】D. Plan for readers whose questions are not yet known\n\n> 为问题尚未知晓的未来读者作准备\n\n这一部分承认保存选择不可避免，再要求考虑未来读者可能提出的新问题，记录选择理由并保留复核空间。\n\n先承认什么限制？\n\n> Choices are unavoidable\n\n无法对每个对象和版本同等精细照料，因此选择不能被完全取消。作者不是提出无限保存承诺，而是在资源限制之内讨论怎样作决定。\n\n当下用户为什么不能代表未来？\n\n> a question that has not yet been asked\n\n今天看来次要的记录可能回答尚未提出的问题，说明未来价值存在未知。这里不是保证每份小材料都会重要，而是限制当下偏好的预测能力。\n\n面对未知应怎么做？\n\n> document selection decisions and keep them open to reconsideration\n\n把选择依据记录下来并允许复核，既保留必要秩序，也避免将今天的判断永久封死。结尾的humility因此落实为可检查、可调整的保存安排。\n\n这一部分的推进关系是：\n\n> 保存资源有限必须选择 → 当前兴趣不足以预知未来问题 → 记录并允许复核选择 → 在可用秩序和未来开放性之间作准备。\n\nreaders whose questions are not yet known指未来使用者及未知研究问题，Plan则对应记录选择依据、保留复核和维持可用秩序。标题涵盖为什么要谦逊以及这种谦逊怎样变成具体安排。\n\n再看最强干扰项C：Replace preservation with more digitisation。\n\n“用更多数字化代替保存”好像能回应资源有限，却既未解决选择标准，也未回答未来问题未知。复制得更多不等于知道保什么、为何保，段落提出的是记录与复核决定，而不是用扫描数量取代长期安排。\n\n**45题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>【答案】D. Plan for readers whose questions are not yet known\u003c/p>\n\u003cblockquote>\n\u003cp>为问题尚未知晓的未来读者作准备\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分承认保存选择不可避免，再要求考虑未来读者可能提出的新问题，记录选择理由并保留复核空间。\u003c/p>\n\u003cp>先承认什么限制？\u003c/p>\n\u003cblockquote>\n\u003cp>Choices are unavoidable\u003c/p>\n\u003c/blockquote>\n\u003cp>无法对每个对象和版本同等精细照料，因此选择不能被完全取消。作者不是提出无限保存承诺，而是在资源限制之内讨论怎样作决定。\u003c/p>\n\u003cp>当下用户为什么不能代表未来？\u003c/p>\n\u003cblockquote>\n\u003cp>a question that has not yet been asked\u003c/p>\n\u003c/blockquote>\n\u003cp>今天看来次要的记录可能回答尚未提出的问题，说明未来价值存在未知。这里不是保证每份小材料都会重要，而是限制当下偏好的预测能力。\u003c/p>\n\u003cp>面对未知应怎么做？\u003c/p>\n\u003cblockquote>\n\u003cp>document selection decisions and keep them open to reconsideration\u003c/p>\n\u003c/blockquote>\n\u003cp>把选择依据记录下来并允许复核，既保留必要秩序，也避免将今天的判断永久封死。结尾的humility因此落实为可检查、可调整的保存安排。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>保存资源有限必须选择 → 当前兴趣不足以预知未来问题 → 记录并允许复核选择 → 在可用秩序和未来开放性之间作准备。\u003c/p>\n\u003c/blockquote>\n\u003cp>readers whose questions are not yet known指未来使用者及未知研究问题，Plan则对应记录选择依据、保留复核和维持可用秩序。标题涵盖为什么要谦逊以及这种谦逊怎样变成具体安排。\u003c/p>\n\u003cp>再看最强干扰项C：Replace preservation with more digitisation。\u003c/p>\n\u003cp>“用更多数字化代替保存”好像能回应资源有限，却既未解决选择标准，也未回答未来问题未知。复制得更多不等于知道保什么、为何保，段落提出的是记录与复核决定，而不是用扫描数量取代长期安排。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 由旧照片存留转向数字记录，并提出需要更换问题 |\n| B | 由资源有限引出选择，并承认未来用户兴趣无法完全预知 |\n| C | 把对未知读者的责任落实为记录、保留语境和复核选择 |\n| D | 解释读取环境依赖，并提出持续迁移和检验的需要 |\n| E | 将迁移界定为持续工作，并把检验推进到记录意义 |\n| F | 区分载体留存与内容可读，并追问两者何以分离 |\n| G | 说明日期、来源和关联的作用，再引出资源约束 |\n| H | 总结便利获取背后的持续工作及其保留未来研究可能性的作用 |\n\n全文推进：\n\n> 由旧照片存留转向数字记录，并提出需要更换问题 → 区分载体留存与内容可读，并追问两者何以分离 → 解释读取环境依赖，并提出持续迁移和检验的需要 → 将迁移界定为持续工作，并把检验推进到记录意义 → 说明日期、来源和关联的作用，再引出资源约束 → 由资源有限引出选择，并承认未来用户兴趣无法完全预知 → 把对未知读者的责任落实为记录、保留语境和复核选择 → 总结便利获取背后的持续工作及其保留未来研究可能性的作用\n\n完整顺序：\n\n**A → F → D → E → G → B → C → H**\n\n41—45：F、D、G、B、C。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>由旧照片存留转向数字记录，并提出需要更换问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>由资源有限引出选择，并承认未来用户兴趣无法完全预知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>把对未知读者的责任落实为记录、保留语境和复核选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>解释读取环境依赖，并提出持续迁移和检验的需要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>将迁移界定为持续工作，并把检验推进到记录意义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>区分载体留存与内容可读，并追问两者何以分离\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>说明日期、来源和关联的作用，再引出资源约束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>总结便利获取背后的持续工作及其保留未来研究可能性的作用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由旧照片存留转向数字记录，并提出需要更换问题 → 区分载体留存与内容可读，并追问两者何以分离 → 解释读取环境依赖，并提出持续迁移和检验的需要 → 将迁移界定为持续工作，并把检验推进到记录意义 → 说明日期、来源和关联的作用，再引出资源约束 → 由资源有限引出选择，并承认未来用户兴趣无法完全预知 → 把对未知读者的责任落实为记录、保留语境和复核选择 → 总结便利获取背后的持续工作及其保留未来研究可能性的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → F → D → E → G → B → C → H\u003c/strong>\u003c/p>\n\u003cp>41—45：F、D、G、B、C。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → F → D的关系。\n\n先看前段A的结尾：\n\n> The digital record deserves a different question.\n\n再看候选F的开头：\n\n> The question is not only whether the disk will remain, but whether its contents will remain readable.\n\nA从旧照片转向老磁盘，最后明确说数字记录需要不同的问题。本段The question立刻补全：不仅问磁盘会不会留下，还问内容能否读取。这是在更换评价对象，不能先跳到档案选择或读者兴趣。\n\n整齐贴标签的物件与没有可用记录形成反差，具体说明物理留存和信息可读的间隙。结尾再问完好载体为什么不能传递信息，把现象转化为后面需要解释的机制。\n\nF段最终落在：\n\n> To understand that gap, we must ask how a perfectly present carrier can nevertheless cease to deliver its information.\n\n后段D的开头是：\n\n> A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself.\n\n本段以carrier can…cease to deliver收尾，后段A carrier can fail in this way接住同一种失效，再解释设备、软件、格式的共同依赖。现象提问—技术原因的回答，是这一空与下一空的双向关系。\n\n这三段的局部推进是：\n\n> 由旧照片存留转向数字记录，并提出需要更换问题 → 区分载体留存与内容可读，并追问两者何以分离 → 解释读取环境依赖，并提出持续迁移和检验的需要\n\n再检验容易混淆的候选D。它的开头是：\n\n> A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself.\n\n解释技术环境的候选也能回应A的磁盘，但其in this way需要先有“载体在而信息不可读”这一具体失效现象。A只说数字记录要另问问题，尚未陈述这种间隙；直接插入会跳过问题的展开。\n\n**41题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → F → D的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The digital record deserves a different question.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The question is not only whether the disk will remain, but whether its contents will remain readable.\u003c/p>\n\u003c/blockquote>\n\u003cp>A从旧照片转向老磁盘，最后明确说数字记录需要不同的问题。本段The question立刻补全：不仅问磁盘会不会留下，还问内容能否读取。这是在更换评价对象，不能先跳到档案选择或读者兴趣。\u003c/p>\n\u003cp>整齐贴标签的物件与没有可用记录形成反差，具体说明物理留存和信息可读的间隙。结尾再问完好载体为什么不能传递信息，把现象转化为后面需要解释的机制。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>To understand that gap, we must ask how a perfectly present carrier can nevertheless cease to deliver its information.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段以carrier can…cease to deliver收尾，后段A carrier can fail in this way接住同一种失效，再解释设备、软件、格式的共同依赖。现象提问—技术原因的回答，是这一空与下一空的双向关系。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>由旧照片存留转向数字记录，并提出需要更换问题 → 区分载体留存与内容可读，并追问两者何以分离 → 解释读取环境依赖，并提出持续迁移和检验的需要\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself.\u003c/p>\n\u003c/blockquote>\n\u003cp>解释技术环境的候选也能回应A的磁盘，但其in this way需要先有“载体在而信息不可读”这一具体失效现象。A只说数字记录要另问问题，尚未陈述这种间隙；直接插入会跳过问题的展开。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成F → D → E的关系。\n\n先看前段F的结尾：\n\n> To understand that gap, we must ask how a perfectly present carrier can nevertheless cease to deliver its information.\n\n再看候选D的开头：\n\n> A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself.\n\n前段问完好的载体何以不传递信息，本段because给出原因，in this way回指物件存在却不可读。设备、软件和格式三项条件，具体解释为什么数字文件不同于只看物件是否还在的判断。\n\n本段从读取依赖环境推到环境消失，再推出持续转入受支持形式的需要。末尾还要求检查信息是否经受住转移，说明迁移不是简单搬动物件，而是维护可读性的过程。\n\nD段最终落在：\n\n> Records therefore need continuing movement into supported forms, accompanied by checks that the information has survived the move.\n\n后段E的开头是：\n\n> This continuing migration is active preservation rather than a one-time act of storage.\n\n固定E以This continuing migration回指这里的continuing movement into supported forms，再界定为持续保存工作。E后半继续发展checks为verification，词义和任务均连续，不能用只谈历史价值的段落接入。\n\n这三段的局部推进是：\n\n> 区分载体留存与内容可读，并追问两者何以分离 → 解释读取环境依赖，并提出持续迁移和检验的需要 → 将迁移界定为持续工作，并把检验推进到记录意义\n\n再检验容易混淆的候选G。它的开头是：\n\n> Those details include the record's date, its source and its relationship to other records.\n\n日期与来源的候选同样说明信息可能失用，但Those details需要前面已提出可见内容之外的细节，A之后的两段尚无此项。放在这里既不能解释设备和格式失效，也无法为E的continuing migration提供最近先行事件。\n\n**42题选D。**","context":{"mode":"newtype","kind":"sorting","current":"D"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成F → D → E的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To understand that gap, we must ask how a perfectly present carrier can nevertheless cease to deliver its information.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段问完好的载体何以不传递信息，本段because给出原因，in this way回指物件存在却不可读。设备、软件和格式三项条件，具体解释为什么数字文件不同于只看物件是否还在的判断。\u003c/p>\n\u003cp>本段从读取依赖环境推到环境消失，再推出持续转入受支持形式的需要。末尾还要求检查信息是否经受住转移，说明迁移不是简单搬动物件，而是维护可读性的过程。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Records therefore need continuing movement into supported forms, accompanied by checks that the information has survived the move.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>This continuing migration is active preservation rather than a one-time act of storage.\u003c/p>\n\u003c/blockquote>\n\u003cp>固定E以This continuing migration回指这里的continuing movement into supported forms，再界定为持续保存工作。E后半继续发展checks为verification，词义和任务均连续，不能用只谈历史价值的段落接入。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>区分载体留存与内容可读，并追问两者何以分离 → 解释读取环境依赖，并提出持续迁移和检验的需要 → 将迁移界定为持续工作，并把检验推进到记录意义\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those details include the record&#39;s date, its source and its relationship to other records.\u003c/p>\n\u003c/blockquote>\n\u003cp>日期与来源的候选同样说明信息可能失用，但Those details需要前面已提出可见内容之外的细节，A之后的两段尚无此项。放在这里既不能解释设备和格式失效，也无法为E的continuing migration提供最近先行事件。\u003c/p>\n\u003cp>\u003cstrong>42题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → B的关系。\n\n先看前段E的结尾：\n\n> A record's meaning may depend on details that its visible contents alone cannot supply.\n\n再看候选G的开头：\n\n> Those details include the record's date, its source and its relationship to other records.\n\n固定E末句指出记录意义依赖可见内容本身不给出的details，本段Those details立即列日期、来源和与其他记录的关系。它回答的是意义缺少什么，而非重复文件怎样打开的技术层次。\n\n谈话消息被抽离交流的例子说明“读得见字”仍可能“不懂它的意思”，描述与关系因此成为保存对象。Yet随后把这一工作放到资源限制之下，准备从应做什么转入如何选择投入。\n\nG段最终落在：\n\n> Yet doing this for every surviving file would demand resources no institution can assume it will always possess.\n\n后段B的开头是：\n\n> Limited resources make selection unavoidable.\n\n本段以不能假定机构永远拥有足够资源收尾，后段Limited resources直接承接并推出selection unavoidable。资源有限与必须选择是相邻因果，不能在其间插入另一个技术解决办法。\n\n这三段的局部推进是：\n\n> 将迁移界定为持续工作，并把检验推进到记录意义 → 说明日期、来源和关联的作用，再引出资源约束 → 由资源有限引出选择，并承认未来用户兴趣无法完全预知\n\n再检验容易混淆的候选B。它的开头是：\n\n> Limited resources make selection unavoidable.\n\n讨论选择的候选与资源有关，但固定E尚未提出资源缺口，末句问的是哪些细节决定意义。若先放Limited resources，会漏答details，并让描述和关联为何值得保存缺少展开，选择便失去具体对象。\n\n**43题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → B的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A record&#39;s meaning may depend on details that its visible contents alone cannot supply.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those details include the record&#39;s date, its source and its relationship to other records.\u003c/p>\n\u003c/blockquote>\n\u003cp>固定E末句指出记录意义依赖可见内容本身不给出的details，本段Those details立即列日期、来源和与其他记录的关系。它回答的是意义缺少什么，而非重复文件怎样打开的技术层次。\u003c/p>\n\u003cp>谈话消息被抽离交流的例子说明“读得见字”仍可能“不懂它的意思”，描述与关系因此成为保存对象。Yet随后把这一工作放到资源限制之下，准备从应做什么转入如何选择投入。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet doing this for every surviving file would demand resources no institution can assume it will always possess.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Limited resources make selection unavoidable.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段以不能假定机构永远拥有足够资源收尾，后段Limited resources直接承接并推出selection unavoidable。资源有限与必须选择是相邻因果，不能在其间插入另一个技术解决办法。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>将迁移界定为持续工作，并把检验推进到记录意义 → 说明日期、来源和关联的作用，再引出资源约束 → 由资源有限引出选择，并承认未来用户兴趣无法完全预知\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Limited resources make selection unavoidable.\u003c/p>\n\u003c/blockquote>\n\u003cp>讨论选择的候选与资源有关，但固定E尚未提出资源缺口，末句问的是哪些细节决定意义。若先放Limited resources，会漏答details，并让描述和关联为何值得保存缺少展开，选择便失去具体对象。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → B → C的关系。\n\n先看前段G的结尾：\n\n> Yet doing this for every surviving file would demand resources no institution can assume it will always possess.\n\n再看候选B的开头：\n\n> Limited resources make selection unavoidable.\n\n前段刚说无法对每个文件的细节长期投入无限资源，本段Limited resources make selection unavoidable概括其直接后果。选择的对象仍是记录和附随描述，保留了前段已解释的内容与语境两项任务。\n\n本段先承认当前热门主题可作参考，再用but限制其预测未来用途的能力。看似次要文件可能回答新问题，说明不能将今日需求永久固定为唯一筛选标准，未知由此成为后面的责任问题。\n\nB段最终落在：\n\n> Some apparently minor documents may become valuable when new questions arise, leaving the interests of future users partly unknown.\n\n后段C的开头是：\n\n> Those unknown users are still part of an archive's responsibility.\n\n结尾的future users partly unknown被后段Those unknown users接住。前段提出我们不知道全部未来兴趣，后段回答即便不知道也应怎样为他们负责，逻辑从知识限制转到可实施安排。\n\n这三段的局部推进是：\n\n> 说明日期、来源和关联的作用，再引出资源约束 → 由资源有限引出选择，并承认未来用户兴趣无法完全预知 → 把对未知读者的责任落实为记录、保留语境和复核选择\n\n再检验容易混淆的候选C。它的开头是：\n\n> Those unknown users are still part of an archive's responsibility.\n\n直接谈未知用户责任的候选似乎也能接资源限制，但unknown users尚未出现，就没有为何未知、未知什么的说明。把它提前会先给记录决定和复核的方案，后面再补未来问题难预测的原因，倒置了本处问题与回应。\n\n**44题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → B → C的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet doing this for every surviving file would demand resources no institution can assume it will always possess.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Limited resources make selection unavoidable.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段刚说无法对每个文件的细节长期投入无限资源，本段Limited resources make selection unavoidable概括其直接后果。选择的对象仍是记录和附随描述，保留了前段已解释的内容与语境两项任务。\u003c/p>\n\u003cp>本段先承认当前热门主题可作参考，再用but限制其预测未来用途的能力。看似次要文件可能回答新问题，说明不能将今日需求永久固定为唯一筛选标准，未知由此成为后面的责任问题。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Some apparently minor documents may become valuable when new questions arise, leaving the interests of future users partly unknown.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those unknown users are still part of an archive&#39;s responsibility.\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾的future users partly unknown被后段Those unknown users接住。前段提出我们不知道全部未来兴趣，后段回答即便不知道也应怎样为他们负责，逻辑从知识限制转到可实施安排。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明日期、来源和关联的作用，再引出资源约束 → 由资源有限引出选择，并承认未来用户兴趣无法完全预知 → 把对未知读者的责任落实为记录、保留语境和复核选择\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those unknown users are still part of an archive&#39;s responsibility.\u003c/p>\n\u003c/blockquote>\n\u003cp>直接谈未知用户责任的候选似乎也能接资源限制，但unknown users尚未出现，就没有为何未知、未知什么的说明。把它提前会先给记录决定和复核的方案，后面再补未来问题难预测的原因，倒置了本处问题与回应。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成B → C → H的关系。\n\n先看前段B的结尾：\n\n> Some apparently minor documents may become valuable when new questions arise, leaving the interests of future users partly unknown.\n\n再看候选C的开头：\n\n> Those unknown users are still part of an archive's responsibility.\n\n前段承认未来用户兴趣部分未知，本段Those unknown users原样回指，并以still说明未知不取消机构责任。于是作者没有从不可预测跳到放弃保存，而是寻找在不完全知识下仍可承担的工作。\n\n记录为何选择、保留解释语境、条件变化时复核，三项措施分别使决定可追溯、使用可扩展、选择可调整。随后明确不保证完美收藏，避免将有限措施夸大成已经解决全部保存问题。\n\nC段最终落在：\n\n> They turn concern for future readers into a continuing institutional commitment rather than a claim that one technical fix will suffice.\n\n后段H的开头是：\n\n> That commitment helps explain why easy access does not make libraries and archives unnecessary.\n\n本段末尾将这些实践归为continuing institutional commitment，固定H用That commitment承接，解释便利检索为何不使档案机构多余。持续责任经由具体劳动变成用户看到的便利，结论因此有前文机制支撑。\n\n这三段的局部推进是：\n\n> 由资源有限引出选择，并承认未来用户兴趣无法完全预知 → 把对未知读者的责任落实为记录、保留语境和复核选择 → 总结便利获取背后的持续工作及其保留未来研究可能性的作用\n\n再检验容易混淆的候选F。它的开头是：\n\n> The question is not only whether the disk will remain, but whether its contents will remain readable.\n\n区分磁盘与内容的候选也涉及未来研究者，但它仍在提出最初的可读性疑问，未形成机构持续责任的安排。放在H前会让That commitment缺少对应行为，并在结论之前突然重启已经解释过的载体问题。\n\n**45题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成B → C → H的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Some apparently minor documents may become valuable when new questions arise, leaving the interests of future users partly unknown.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those unknown users are still part of an archive&#39;s responsibility.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段承认未来用户兴趣部分未知，本段Those unknown users原样回指，并以still说明未知不取消机构责任。于是作者没有从不可预测跳到放弃保存，而是寻找在不完全知识下仍可承担的工作。\u003c/p>\n\u003cp>记录为何选择、保留解释语境、条件变化时复核，三项措施分别使决定可追溯、使用可扩展、选择可调整。随后明确不保证完美收藏，避免将有限措施夸大成已经解决全部保存问题。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>They turn concern for future readers into a continuing institutional commitment rather than a claim that one technical fix will suffice.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That commitment helps explain why easy access does not make libraries and archives unnecessary.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段末尾将这些实践归为continuing institutional commitment，固定H用That commitment承接，解释便利检索为何不使档案机构多余。持续责任经由具体劳动变成用户看到的便利，结论因此有前文机制支撑。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>由资源有限引出选择，并承认未来用户兴趣无法完全预知 → 把对未知读者的责任落实为记录、保留语境和复核选择 → 总结便利获取背后的持续工作及其保留未来研究可能性的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The question is not only whether the disk will remain, but whether its contents will remain readable.\u003c/p>\n\u003c/blockquote>\n\u003cp>区分磁盘与内容的候选也涉及未来研究者，但它仍在提出最初的可读性疑问，未形成机构持续责任的安排。放在H前会让That commitment缺少对应行为，并在结论之前突然重启已经解释过的载体问题。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **a sense of dedication** | **奉献精神** | **人生哲理类：责任感、奉献精神** | **个人主题** |\n| long-term thinking | 长远思维 | 人生哲理类：延迟满足、具有远见 | 个人主题 |\n| intellectual curiosity | 求知欲 | 人生哲理类：好奇、求知 | 个人主题 |\n| **access to information** | **获取信息** | **社会生活类：获取信息的方式** | **宏观主题** |\n| digital preservation | 数字保存 | 经济消费类：科技发展 | 宏观主题 |\n| public cultural services | 公共文化服务 | 教育文化类：学习生活 | 宏观主题 |\n| **reading resources** | **阅读资源** | **教育文化类：阅读** | **宏观主题** |\n| cultural exchange | 文化交流 | 教育文化类：文化交流 | 宏观主题 |\n| educational opportunities | 教育机会 | 教育文化类：学习生活 | 宏观主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2025英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>a sense of dedication\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：责任感、奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstron orms of A gradually replaced traditional ones. | 这段时期，数字形式的A逐渐取代传统形式。 |\n| 图表题 | The proportion of people using A rose from X percent to Y percent. | 使用A的人群比例从X%升至Y%。 |\n| **文本评论题** | **The passage raises the question of how A can be preserved for the future.** | **材料提出了如何为未来保存A的问题。** |\n| 文本评论题 | The writer distinguishes keeping an object from retaining the information it carries. | 作者区分了保住物件与保住其中信息。 |\n| 文本评论题 | The passage describes a continuing challenge and the efforts being made to address it. | 材料描述了一项持续存在的挑战及应对它的努力。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2025英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>In the picture, A holds up B as evidence of C.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图中，A举起B，将其视为C的证据。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The picture places an old object beside its digital counterpart.\u003c/td>\n\u003ctd>图中把旧物与其数字版本并列呈现。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene shows A looking helplessly at B.\u003c/td>\n\u003ctd>画面呈现A无助地看着B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart compares access to A in X and Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表比较了X和Y中获取A的情况。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Over the period, digital forms of A gradually replaced traditional ones.\u003c/td>\n\u003ctd>这段时期，数字形式的A逐渐取代传统形式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The proportion of people using A rose from X percent to Y percent.\u003c/td>\n\u003ctd>使用A的人群比例从X%升至Y%。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage raises the question of how A can be preserved for the future.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>材料提出了如何为未来保存A的问题。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The writer distinguishes keeping an object from retaining the information it carries.\u003c/td>\n\u003ctd>作者区分了保住物件与保住其中信息。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage describes a continuing challenge and the efforts being made to address it.\u003c/td>\n\u003ctd>材料描述了一项持续存在的挑战及应对它的努力。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Preserve the context as well as the content\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Do not confuse survival with a preservation plan\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Replace preservation with more digitisation\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. Plan for readers whose questions are not yet known\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Make the work behind easy access visible\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Treat easy access as proof that libraries are redundant\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Keep the information usable, not just the carrier intact\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>An old letter may reach a researcher because someone kept a drawer of papers through several house moves. Its survival is valuable, but it does not show that all comparable letters were safe. The missing ones are absent from the very collection being examined. Nor does the survival of this sheet prove that later records will endure without attention. The example demonstrates a possibility, not a reliable method. A preservation policy must ask what conditions made the letter readable and how those conditions can be maintained or replaced for materials that do not share its physical form.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>A disk can remain neatly labelled on a shelf long after the files it holds become difficult to read. The difficulty may lie neither in a broken case nor in a missing object. The equipment or software needed to interpret its format may no longer be available. Keeping the physical carrier is therefore only one part of the task. Staff must also consider how the information can be transferred into a usable environment and checked after that transfer. Preservation succeeds for a future reader when the record can be used, not merely when someone can point to the object that once contained it.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>A reader taps a phone and retrieves a document within seconds. It is tempting to attribute the result entirely to the device. Yet the document had to be selected, described and placed in a system that someone continues to maintain. The easier the service becomes, the less visible these activities may be. That invisibility can lead users to imagine that the institution behind the screen has become unnecessary. Explaining the steps behind a successful search does not diminish the convenience. It shows why the convenience depends on sustained work rather than on information simply being everywhere by itself.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>Opening a file is not always enough to understand it as evidence. A photograph without a date or a record of its source may be easy to view but hard to place in history. A preserved conversation may also lose meaning if its messages are separated from the exchange that linked them. For this reason, an archive needs descriptions and relationships as well as files. Notes about where a record came from and what was done to it help later readers judge what they are seeing. Technical readability and historical intelligibility support each other, but they are not the same achievement.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>No archive can retain every object, every version and every possible description with equal care. Choices are unavoidable, but the interests of present users are not a complete guide to future value. A record that seems minor today may answer a question that has not yet been asked. This uncertainty is a reason to document selection decisions and keep them open to reconsideration, rather than a reason to abandon selection altogether. Planning for future readers requires both practical limits and intellectual humility: enough order to make an archive usable, and enough awareness that later questions may differ from our own.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>An old photograph can survive several generations and still reveal faces and places to a later viewer. Its continued presence makes it tempting to imagine that historical records simply wait until someone wants them. But that lesson cannot be transferred unchanged to a file on an ageing disk. The digital record deserves a different question.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Limited resources make selection unavoidable. Archivists must decide which records and which accompanying descriptions deserve particular attention. Today&#x27;s popular subjects offer one guide, but they cannot predict every future use. Some apparently minor documents may become valuable when new questions arise, leaving the interests of future users partly unknown.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>Those unknown users are still part of an archive&#x27;s responsibility. Staff can record why selections were made, preserve enough context to support other interpretations and revisit decisions when circumstances change. Such practices do not promise a perfect collection. They turn concern for future readers into a continuing institutional commitment rather than a claim that one technical fix will suffice.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself. Equipment, software and a recognised format must work together. When that environment disappears, keeping the object does not keep access. Records therefore need continuing movement into supported forms, accompanied by checks that the information has survived the move.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>This continuing migration is active preservation rather than a one-time act of storage. It requires people to identify a problem, arrange a transfer and verify the result. Verification, however, cannot stop at whether a file opens. A record&#x27;s meaning may depend on details that its visible contents alone cannot supply.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>The question is not only whether the disk will remain, but whether its contents will remain readable. A labelled object on a shelf may look safely preserved while offering no usable record to a researcher. To understand that gap, we must ask how a perfectly present carrier can nevertheless cease to deliver its information.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>Those details include the record&#x27;s date, its source and its relationship to other records. A message removed from its conversation may be readable without being understandable. Preserving descriptions and connections helps prevent that loss of meaning. Yet doing this for every surviving file would demand resources no institution can assume it will always possess.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>That commitment helps explain why easy access does not make libraries and archives unnecessary. A convenient search is the visible outcome of choices, technical maintenance and descriptive work that users may never notice. None removes every preservation difficulty. Together, however, they help keep future research possible when the original objects and technologies no longer explain themselves.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2025英语一Text 4重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>antiques store\u003c/td>\n\u003ctd>n.古董店\u003c/td>\n\u003ctd>encounter artifacts\u003c/td>\n\u003ctd>phr.遇见历史遗物\ c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>revolves around\u003c/td>\n\u003ctd>phr.v.围绕\u003c/td>\n\u003ctd>collections\u003c/td>\n\u003ctd>n.馆藏\u003c/td>\n\u003ctd>terrors\u003c/td>\n\u003ctd>n.恐惧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lying\u003c/td>\n\u003ctd>v.撒谎\u003c/td>\n\u003ctd>comprehensive preservation solution\u003c/td>\n\u003ctd>n.全面的保存方案\u003c/td>\n\u003ctd>comfort\u003c/td>\n\u003ctd>n.安慰\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>multitude\u003c/td>\n\u003ctd>n.大量\u003c/td>\n\u003ctd>devoted to\u003c/td>\n\u003ctd>phr.致力于\u003c/td>\n\u003ctd>preserving\u003c/td>\n\u003ctd>v.保存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>current\u003c/td>\n\u003ctd>adj.当前的\u003c/td>\n\u003ctd>uniquely\u003c/td>\n\u003ctd>adv.独特地\u003c/td>\n\u003ctd>seek\u003c/td>\n\u003ctd>v.寻找\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>integral role\u003c/td>\n\u003ctd>n.不可或缺的作用\u003c/td>\n\u003ctd>accessibility\u003c/td>\n\u003ctd>n.可获取性\u003c/td>\n\u003ctd>realm\u003c/td>\n\u003ctd>n.领域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ply their trade\u003c/td>\n\u003ctd>phr.从事其工作\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>Visit any antiques store and you&#39;ll encounter artifacts from the past: photographs, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-1965 World&#39;s Fair, the ephemera of history. Yet these objects aren&#39;t truly ephemeral, because they&#39;re still here, decades, even centuries later. Why? Because they&#39;re tangible.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>Visit any antiques store / and you&#39;ll encounter artifacts / from the past: / photographs, letters, / a brochure detailing the Sinclair dinosaur exhibit / from the 1964-1965 World&#39;s Fair, / the ephemera of history.\u003c/p>\n\u003cp>Yet / these objects aren&#39;t truly ephemeral, / because they&#39;re still here, / decades, even centuries later.\u003c/p>\n\u003cp>Why?\u003c/p>\n\u003cp>Because they&#39;re tangible.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>参观任何古董店 / 你会遇到文物 / 来自过去的： / 照片、信件， / 一份详细介绍辛克莱恐龙展览的小册子 / 来自1964-1965年世界博览会的， / 历史的短暂物品。\u003c/p>\n\u003cp>然而 / 这些物品并非真正短暂的， / 因为它们仍在这里， / 几十年，甚至几个世纪之后。\u003c/p>\n\u003cp>为什么？\u003c/p>\n\u003cp>因为它们是有形的。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>走进任何一家古董店，你都会遇到来自过去的文物：照片、信件、1964-1965年世界博览会上辛克莱恐龙展览的宣传册——这些历史的瞬间记录。然而，这些物品并非真正短暂，因为它们在几十年甚至几个世纪后仍然存在。为什么？因为它们是有形的。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation? For millennia, we&#39;ve known what we&#39;ve known due to artifacts that have survived, often despite their original creators&#39; neglect. The thing itself is the medium that delivers the information. At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biographers, historians, and novelists rely on. Libraries and archives have traditionally shouldered the responsibility of organization, preservation, and access to information.Thus, librarians digitize the tangible so that researchers the world over can quickly search and access their holdings. The result is an embarrassment of historical riches, which brings its own needle-and-haystack problems.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Have you pondered / the life cycle of intangible formats, / digital information, / given that those who produce these artifacts / seldom make provision / for their long-term preservation?\u003c/p>\n\u003cp>For millennia, / we&#39;ve known what we&#39;ve known / due to artifacts that have survived, / often despite their original creators&#39; neglect.\u003c/p>\n\u003cp>The thing itself / is the medium / that delivers the information.\u003c/p>\n\u003cp>At the time of creation, / no attempts were made / at intentional preservation, / yet analog materials / have a chance of surviving / and serving as the historical record / that biographers, historians, and novelists / rely on.\u003c/p>\n\u003cp>Libraries and archives / have traditionally shouldered the responsibility / of organization, preservation, and access to information.\u003c/p>\n\u003cp>Thus, / librarians digitize the tangible / so that researchers the world over / can quickly search and access / their holdings.\u003c/p>\n\u003cp>The result / is an embarrassment of historical riches, / which brings its own / needle-and-haystack problems.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>你是否思考过 / 无形格式的生命周期， / 数字信息， / 鉴于那些制作这些文物的人 / 很少做准备 / 为了它们的长期保存？\u003c/p>\n\u003cp>千年以来， / 我们所知道的 / 归功于幸存下来的文物， / 往往尽管原创者的忽视。\u003c/p>\n\u003cp>物品本身 / 就是媒介 / 传递信息的。\u003c/p>\n\u003cp>在创造时， / 没有尝试 / 进行有意的保存， / 然而模拟材料 / 有机会存活 / 并作为历史记录 / 传记作家、历史学家和小说家 / 依赖的。\u003c/p>\n\u003cp>图书馆和档案馆 / 传统上承担了责任 / 组织、保存和获取信息的。\u003c/p>\n\u003cp>因此， / 图书管理员数字化有形物品 / 以便世界各地的研究人员 / 可以快速搜索和访问 / 他们的馆藏。\u003c/p>\n\u003cp>结果 / 是历史财富的过度丰富， / 这带来了它自己的 / 大海捞针的问题。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>你是否思考过数字信息这种无形格式的生命周期？特别是考虑到创造这些数字文物的人很少为其长期保存做准备。千年以来，我们的知识传承依赖于那些幸存下来的文物，尽管它们的创造者往往并未刻意保存它们。物品本身就是传递信息的媒介。创造时虽无意保存，但模拟材料仍有机会存活下来，成为传记作家、历史学家和小说家所依赖的历史记录。图书馆和档案馆传统上承担着组织、保存和提供信息获取的责任。因此，图书管理员将有形物品数字化，使世界各地的研究人员能够快速搜索和访问馆藏。这带来了历史财富的极大丰富，但也产生了大海捞针的新问题。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Librarians&#39; selfless devotion can act against us when users point to universality of access byholding up a cellphone and saying,“it&#39;s all in here” as evidence that libraries are less vital forresearchers today. Yet how was that universality of access made possible and, perhaps more importantly,how is it maintained? Who curates what is preserved? When it comes to born-digital information, the terrifying answer can be: if not librarians and archivists, then no one. Digital information requires a great deal more care than analog.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Librarians&#39; selfless devotion / can act against us / when users point to universality of access / by holding up a cellphone and saying, / &quot;it&#39;s all in here&quot; / as evidence that libraries are less vital / for researchers today.\u003c/p>\n\u003cp>Yet / how was that universality of access / made possible / and, perhaps more importantly, / how is it maintained?\u003c/p>\n\u003cp>Who curates / what is preserved?\u003c/p>\n\u003cp>When it comes to born-digital information, / the terrifying answer can be: / if not librarians and archivists, / then no one.\u003c/p>\n\u003cp>Digital information / requires a great deal more care / than analog.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>图书管理员的无私奉献 / 可能对我们不利 / 当用户指向普遍访问 / 通过举起手机并说， / &quot;一切都在这里&quot; / 作为证据表明图书馆不那么重要 / 对今天的研究人员。\u003c/p>\n\u003cp>然而 / 这种普遍访问是如何 / 成为可能的 / 而且，也许更重要的是， / 它是如何维持的？\u003c/p>\n\u003cp>谁策划 / 什么被保存？\u003c/p>\n\u003cp>当涉及到原生数字信息时， / 可怕的答案可能是： / 如果不是图书管理员和档案管理员， / 那就没有人。\u003c/p>\n\u003cp>数字信息 / 需要更多的照料 / 比模拟信息。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>图书管理员的无私奉献可能会对我们不利，当用户举起手机说&quot;一切都在这里&quot;，以此作为图书馆对今天的研究人员不那么重要的证据时。然而，这种普遍的访问是如何实现的？更重要的是，它是如何维持的？谁来策划保存什么？当涉及原生数字信息时，可怕的答案可能是：如果不是图书管理员和档案管理员，就没有人来做这件事。数字信息比模拟信息需要更多的照料。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Even when a digital object is preserved, it may only be the carrier that&#39;s saved, not the information itself. As technology advances and a format becomes obsolete, the object is useless. Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this? Without constant migration of digital assets, a nightmare about the foreseeable future is what keeps historians up at night: a historical record that abruptly stops when digital replaces analog.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Even when a digital object is preserved, / it may only be the carrier / that&#39;s saved, / not the information itself.\u003c/p>\n\u003cp>As technology advances / and a format becomes obsolete, / the object is useless.\u003c/p>\n\u003cp>Have you ever stared helplessly / at a ZIP disk, / thinking: / how do I get the files off this?\u003c/p>\n\u003cp>Without constant migration of digital assets, / a nightmare about the foreseeable future / is what keeps historians up at night: / a historical record / that abruptly stops / when digital replaces analog.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>即使当数字对象被保存时， / 可能只是载体 / 被保存了， / 而不是信息本身。\u003c/p>\n\u003cp>随着技术进步 / 和格式变得过时， / 对象变得无用。\u003c/p>\n\u003cp>你是否曾经无助地盯着 / 一个ZIP磁盘， / 想着： / 我如何从中取出文件？\u003c/p>\n\u003cp>没有数字资产的持续迁移， / 关于可预见未来的噩梦 / 是让历史学家夜不能寐的： / 一个历史记录 / 突然停止 / 当数字取代模拟时。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>即使数字对象被保存下来，可能只是保存了载体，而非信息本身。随着技术进步和格式过时，这些对象变得毫无用处。你是否曾经无助地盯着ZIP磁盘，想着：我该如何取出里面的文件？如果没有数字资产的持续迁移，历史学家们夜不能寐的噩梦是：当数字取代模拟时，历史记录将戛然而止。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>As a librarian whose day job revolves around special collections anddigital assets,I share the night terrors of historians, and I&#39; d be lying if l said a comprehensive preservation solution currently exists. Yet researchers can take some comfort in the fact that there are a multitude of librarians devoted to discovering,organizing, and preserving digital information for researchers current and future, Librarians are uniquely positioned to understand how end users seek and use information. Thus we play an integral role in identifying, preserving, and providing acessibility to digital artifacts so that, while future researchers may find the digital realm a challenging place to ply their trade, they won&#39; t find it an impossible one.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>As a librarian / whose day job revolves around / special collections and digital assets, / I share the night terrors of historians, / and I&#39;d be lying / if I said / a comprehensive preservation solution / currently exists.\u003c/p>\n\u003cp>Yet / researchers can take some comfort / in the fact / that there are a multitude of librarians / devoted to discovering, organizing, and preserving / digital information / for researchers current and future.\u003c/p>\n\u003cp>Librarians are uniquely positioned / to understand / how end users seek and use information.\u003c/p>\n\u003cp>Thus / we play an integral role / in identifying, preserving, and providing accessibility / to digital artifacts / so that, / while future researchers may find / the digital realm a challenging place / to ply their trade, / they won&#39;t find it / an impossible one.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>作为一名图书管理员 / 其日常工作围绕着 / 特殊收藏和数字资产， / 我分享历史学家的夜晚恐惧， / 我会说谎 / 如果我说 / 一个全面的保存解决方案 / 目前存在。\u003c/p>\n\u003cp>然而 / 研究人员可以得到一些安慰 / 从这个事实 / 有许多图书管理员 / 致力于发现、组织和保存 / 数字信息 / 为当前和未来的研究人员。\u003c/p>\n\u003cp>图书管理员处于独特位置 / 去理解 / 最终用户如何寻找和使用信息。\u003c/p>\n\u003cp>因此 / 我们扮演着不可或缺的角色 / 在识别、保存和提供可访问性方面 / 对数字文物 / 以便， / 虽然未来的研究人员可能发现 / 数字领域是一个充满挑战的地方 / 进行他们的工作， / 他们不会发现它 / 是不可能的。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>作为一名日常工作围绕特殊收藏和数字资产的图书管理员，我与历史学家们分享着同样的恐惧。如果我说目前存在全面的保存解决方案，那我就是在撒谎。然而，研究人员可以从这个事实中得到一些安慰：有众多图书管理员致力于为当前和未来的研究人员发现、组织和保存数字信息。图书管理员处于独特的位置，能够理解最终用户如何寻找和使用信息。因此，我们在识别、保存和提供数字文物的可访问性方面发挥着不可或缺的作用，这样，虽然未来的研究人员可能会发现数字领域是一个充满挑战的工作场所，但不会是一个不可能的地方。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>Visit any antiques store → and you&#39;ll encounter artifacts：(from the past)：(photographs, letters + a brochure detailing the Sinclair dinosaur exhibit：(from the 1964-1965 World&#39;s Fair) + the ephemera of history).\u003c/p>\n\u003cp>Yet // these objects → aren&#39;t truly ephemeral，because they&#39;re still here：(decades, even centuries later).\u003c/p>\n\u003cp>Why?\u003c/p>\n\u003cp>Because they&#39;re tangible.\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Have you pondered：(the life cycle of intangible formats：(digital information))，given that those who produce these artifacts → seldom make provision：(for their long-term preservation)?\u003c/p>\n\u003cp>For millennia → we&#39;ve known what we&#39;ve known：(due to artifacts that have survived)：(often despite their original creators&#39; neglect).\u003c/p>\n\u003cp>The thing itself → is the medium：(that delivers the information).\u003c/p>\n\u003cp>At the time of creation → no attempts were made：(at intentional preservation)，yet // analog materials → have a chance of surviving + and serving as the historical record：(that biographers, historians, and novelists → rely on).\u003c/p>\n\u003cp>Libraries and archives → have traditionally shouldered the responsibility：(of organization, preservation, and access to information).\u003c/p>\n\u003cp>Thus → librarians → digitize the tangible：(so that researchers the world over → can quickly search and access：(their holdings)).\u003c/p>\n\u003cp>The result → is an embarrassment of historical riches：(which brings its own：(needle-and-haystack problems)).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Librarians&#39; selfless devotion → can act against us：(when users point to universality of access：(by holding up a cellphone and saying：&quot;it&#39;s all in here&quot;)：(as evidence that libraries are less vital：(for researchers today))).\u003c/p>\n\u003cp>Yet // how was that universality of access → made possible + and, perhaps more importantly，how is it maintained?\u003c/p>\n\u003cp>Who → curates：(what is preserved)?\u003c/p>\n\u003cp>When it comes to born-digital information → the terrifying answer can be：(if not librarians and archivists → then no one).\u003c/p>\n\u003cp>Digital information → requires a great deal more care：(than analog).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Even when a digital object is preserved → it may only be the carrier：(that&#39;s saved) // not the information itself.\u003c/p>\n\u003cp>As technology advances + and a format becomes obsolete → the object is useless.\u003c/p>\n\u003cp>Have you ever stared helplessly：(at a ZIP disk)，thinking：(how do I get the files off this)?\u003c/p>\n\u003cp>Without constant migration of digital assets → a nightmare about the foreseeable future → is what keeps historians up at night：(a historical record：(that abruptly stops：(when digital replaces analog))).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>As a librarian：(whose day job revolves around：(special collections and digital assets)) → I share the night terrors of historians + and I&#39;d be lying：(if I said：(a comprehensive preservation solution → currently exists)).\u003c/p>\n\u003cp>Yet // researchers can take some comfort：(in the fact：(that there are a multitude of librarians：(devoted to discovering, organizing, and preserving：(digital information)：(for researchers current and future)))).\u003c/p>\n\u003cp>Librarians → are uniquely positioned：(to understand：(how end users seek and use information)).\u003c/p>\n\u003cp>Thus → we play an integral role：(in identifying, preserving, and providing accessibility：(to digital artifacts))：(so that，while future researchers may find：(the digital realm a challenging place：(to ply their trade)) → they won&#39;t find it：(an impossible one)).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>参观任何古董店 → 你会遇到文物：(来自过去的)：(照片、信件 + 一份详细介绍辛克莱恐龙展览的小册子：(来自1964-1965年世界博览会的) + 历史的短暂物品)。\u003c/p>\n\u003cp>然而 // 这些物品 → 并非真正短暂的，因为它们仍在这里：(几十年，甚至几个世纪之后)。\u003c/p>\n\u003cp>为什么？\u003c/p>\n\u003cp>因为它们是有形的。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>你是否思考过：(无形格式的生命周期：(数字信息))，鉴于那些制作这些文物的人 → 很少做准备：(为了它们的长期保存)？\u003c/p>\n\u003cp>千年以来 → 我们所知道的：(归功于幸存下来的文物)：(往往尽管原创者的忽视)。\u003c/p>\n\u003cp>物品本身 → 就是媒介：(传递信息的)。\u003c/p>\n\u003cp>在创造时 → 没有尝试：(进行有意的保存)，然而 // 模拟材料 → 有机会存活 + 并作为历史记录：(传记作家、历史学家和小说家 → 依赖的)。\u003c/p>\n\u003cp>图书馆和档案馆 → 传统上承担了责任：(组织、保存和获取信息的)。\u003c/p>\n\u003cp>因此 → 图书管理员 → 数字化有形物品：(以便世界各地的研究人员 → 可以快速搜索和访问：(他们的馆藏))。\u003c/p>\n\u003cp>结果 → 是历史财富的过度丰富：(这带来了它自己的：(大海捞针的问题))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>图书管理员的无私奉献 → 可能对我们不利：(当用户指向普遍访问：(通过举起手机并说：&quot;一切都在这里&quot;)：(作为证据表明图书馆不那么重要：(对今天的研究人员)))。\u003c/p>\n\u003cp>然而 // 这种普遍访问是如何 → 成为可能的 + 而且，也许更重要的是，它是如何维持的？\u003c/p>\n\u003cp>谁 → 策划：(什么被保存)？\u003c/p>\n\u003cp>当涉及到原生数字信息时 → 可怕的答案可能是：(如果不是图书管理员和档案管理员 → 那就没有人)。\u003c/p>\n\u003cp>数字信息 → 需要更多的照料：(比模拟信息)。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>即使当数字对象被保存时 → 可能只是载体：(被保存了) // 而不是信息本身。\u003c/p>\n\u003cp>随着技术进步 + 和格式变得过时 → 对象变得无用。\u003c/p>\n\u003cp>你是否曾经无助地盯着：(一个ZIP磁盘)，想着：(我如何从中取出文件)？\u003c/p>\n\u003cp>没有数字资产的持续迁移 → 关于可预见未来的噩梦 → 是让历史学家夜不能寐的：(一个历史记录：(突然停止：(当数字取代模拟时)))。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>作为一名图书管理员：(其日常工作围绕着：(特殊收藏和数字资产)) → 我分享历史学家的夜晚恐惧 + 我会说谎：(如果我说：(一个全面的保存解决方案 → 目前存在))。\u003c/p>\n\u003cp>然而 // 研究人员可以得到一些安慰：(从这个事实：(有许多图书管理员：(致力于发现、组织和保存：(数字信息)：(为当前和未来的研究人员))))。\u003c/p>\n\u003cp>图书管理员 → 处于独特位置：(去理解：(最终用户如何寻找和使用信息))。\u003c/p>\n\u003cp>因此 → 我们扮演着不可或缺的角色：(在识别、保存和提供可访问性方面：(对数字文物))：(以便，虽然未来的研究人员可能发现：(数字领域是一个充满挑战的地方：(进行他们的工作)) → 他们不会发现它：(是不可能的))。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第2段第4句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biographers, historians, and novelists rely on.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>At the time of creation, / no attempts were made / at intentional preservation, / yet analog materials / have a chance of surviving / and serving as the historical record / that biographers, historians, and novelists / rely on.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>在创造时， / 没有尝试 / 进行有意的保存， / 然而模拟材料 / 有机会存活 / 并作为历史记录 / 传记作家、历史学家和小说家 / 依赖的。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把当时没有保存安排译完整：\u003c/p>\n\u003cblockquote>\n\u003cp>这些材料创造出来时，人们没有有意安排保存\u003c/p>\n\u003c/blockquote>\n\u003cp>再接上仍有可能存留及其用途：\u003c/p>\n\u003cblockquote>\n\u003cp>可是模拟形式的材料仍可能留存，成为传记作家、历史学家和小说家依赖的历史记录\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>这些材料创造出来时，人们没有有意安排保存；可是模拟形式的材料仍可能留存，成为传记作家、历史学家和小说家依赖的历史记录。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>没有刻意保存，模拟材料仍可能留存并成为历史记录。\u003c/p>\n\u003c/blockquote>\n\u003cp>no attempts were made是被动结构；yet转向出乎预期的存留。of之后surviving和serving并列，that从句修饰historical record，不是说这些作者负责制造原材料。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>虽然创造这些材料时并没有有意安排保存，但模拟形式的材料仍有机会存留，成为传记作家、历史学家和小说家所依赖的历史记录。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>have a chance只说有可能，不能译成模拟材料必定永久保存。intentional突出是否事先安排，并不表示从未有人照料。\u003c/p>\n\u003cp>serving as是充当记录，rely on是研究写作时依赖。用“虽……但仍……”能同时保住缺少安排和仍有机会这两层关系。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>创造时虽无意保存，但模拟材料仍有机会存活下来，成为传记作家、历史学家和小说家所依赖的历史记录。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第3段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Librarians&#39; selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, &quot;it&#39;s all in here&quot; as evidence that libraries are less vital for researchers today.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Librarians&#39; selfless devotion / can act against us / when users point to universality of access / by holding up a cellphone and saying, / &quot;it&#39;s all in here&quot; / as evidence that libraries are less vital / for researchers today.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>图书管理员的无私奉献 / 可能对我们不利 / 当用户指向普遍访问 / 通过举起手机并说， / &quot;一切都在这里&quot; / 作为证据表明图书馆不那么重要 / 对今天的研究人员。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先将馆员奉献与反效果连起来：\u003c/p>\n\u003cblockquote>\n\u003cp>图书馆员的无私奉献反而可能对自己不利\u003c/p>\n\u003c/blockquote>\n\u003cp>再把用户动作和得出的判断合起来：\u003c/p>\n\u003cblockquote>\n\u003cp>用户举起手机说信息都在这里，并把这当作图书馆对今天的研究者不再那么重要的证据\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>图书馆员的无私奉献反而可能对自己不利；用户举起手机说信息都在这里，并把这当作图书馆对今天的研究者不再那么重要的证据。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>无私奉献可能反过来让图书馆被低估。\u003c/p>\n\u003c/blockquote>\n\u003cp>when引出反效果出现的情境，by说明用户怎样指示获取的普遍性；as evidence接在该举动上，that从句说明证据被用来支持什么判断。不是作者本人承认图书馆不重要。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>用户举起手机说所有信息都在其中，并以此证明图书馆对当今研究者不再那么重要；在这种情况下，馆员的无私奉献反而可能对自己不利。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>less vital是重要性被看低，不等于图书馆完全无用。can只表示可能产生反效果，不应写成每个用户都必然如此。\u003c/p>\n\u003cp>把“用户认为”这层归属译清，能防止将作者要反驳的看法译成作者结论。selfless devotion的成果是便利，而便利遮住了提供服务的人。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>图书管理员的无私奉献可能会对我们不利，当用户举起手机说&quot;一切都在这里&quot;，以此作为图书馆对今天的研究人员不那么重要的证据时。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第5段第4句\u003
