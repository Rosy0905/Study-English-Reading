c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>Thus we play an integral role in identifying, preserving, and providing accessibility to digital artifacts so that, while future researchers may find the digital realm a challenging place to ply their trade, they won&#39;t find it an impossible one.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>Thus / we play an integral role / in identifying, preserving, and providing accessibility / to digital artifacts / so that, / while future researchers may find / the digital realm a challenging place / to ply their trade, / they won&#39;t find it / an impossible one.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>因此 / 我们扮演着不可或缺的角色 / 在识别、保存和提供可访问性方面 / 对数字文物 / 以便， / 虽然未来的研究人员可能发现 / 数字领域是一个充满挑战的地方 / 进行他们的工作， / 他们不会发现它 / 是不可能的。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并馆员的作用与具体任务：\u003c/p>\n\u003cblockquote>\n\u003cp>因此，馆员在识别、保存数字资料并提供获取途径方面不可或缺\u003c/p>\n\u003c/blockquote>\n\u003cp>再把目的与让步结果连起来：\u003c/p>\n\u003cblockquote>\n\u003cp>这样未来研究者即使觉得数字领域难以开展工作，也不会觉得根本无法开展\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>因此，馆员在识别、保存数字资料并提供获取途径方面不可或缺；这样未来研究者即使觉得数字领域难以开展工作，也不会觉得根本无法开展。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>馆员发挥关键作用，使未来研究有挑战而不至于不可能。\u003c/p>\n\u003c/blockquote>\n\u003cp>so that引出工作希望达到的结果，其中while表让步，不是同时发生。find后接“对象＋补语”，最后的one代指place，不代指研究者或馆员。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>因此，馆员在识别、保存数字资料并提供获取途径上发挥不可或缺的作用，使未来研究者虽然仍会发现数字领域难以开展工作，却不至于发现那是个完全无法工作的地方。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>ply their trade在这里是研究者从事专业工作，不是进行买卖。integral强调不可缺少的组成作用，不能译成工作已经完整解决所有问题。\u003c/p>\n\u003cp>challenging与impossible是程度对照：仍有难处，但保留可行性。中文用“虽然……但不会……”保留作者有条件的安慰，而不写成保证未来查阅毫无困难。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>因此，我们在识别、保存和提供数字文物的可访问性方面发挥着不可或缺的作用，这样，虽然未来的研究人员可能会发现数字领域是一个充满挑战的工作场所，但不会是一个不可能的地方。\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>40题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following statements best summarizes the text?\u003c/strong>\u003c/p>\n\u003cp>下列哪一项最能概括本文？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Hard work should be done to preserve artifacts.\u003c/strong>\u003c/p>\n\u003cp>应当付出艰苦努力保存物品。\u003c/p>\n\u003cp>B. \u003cstrong>Contributions of librarians should be recognized.\u003c/strong>\u003c/p>\n\u003cp>图书馆员的贡献应当得到承认。\u003c/p>\n\u003cp>C. \u003cstrong>Accessing databases is essential to researchers.\u003c/strong>\u003c/p>\n\u003cp>访问数据库对于研究者至关重要。\u003c/p>\n\u003cp>D. \u003cstrong>Keeping digital historical records is a challenge.\u003c/strong>\u003c/p>\n\u003cp>保存数字历史记录是一项挑战。\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>用古董店里的旧物说明有形材料多年以后仍可能存留。\u003c/td>\n\u003ctd>先说旧东西为什么还能留下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>转向数字信息长期保存，并交代材料传递与馆员工作。\u003c/td>\n\u003ctd>再把另一种情况引进来比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出便利获取背后需有人维护，数字信息更费照料。\u003c/td>\n\u003ctd>接着说看似方便仍需要照料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>用旧磁盘取文件说明载体留下但格式过时可使记录中断。\u003c/td>\n\u003ctd>再说东西留下也未必有用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>承认没有全面方案，同时说明馆员正努力使未来工作可能。\u003c/td>\n\u003ctd>最后说难处仍在但有人应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following statements best summarizes the text?\u003c/strong>\u003c/p>\n\u003ch3>A. Hard work should be done to preserve artifacts.\u003c/h3>\n\u003cp>应当付出艰苦努力保存物品。\u003c/p>\n\u003ch4>如果 A 是主旨，文章5段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>应当付出艰苦努力保存物品。\u003c/p>\n\u003cp>那文章5段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从旧材料得以保存的条件说明历史遗物不会总能自动留下，引起对保存劳动的注意。\u003c/td>\n\u003ctd>先说旧东西为什么还能留下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>把数字材料与有形材料并置，说明不同对象虽条件不同，都需要认真安排保存工作。\u003c/td>\n\u003ctd>再把另一种情况引进来比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>揭示便利获取背后持续的维护，解释为何现有方便不能成为减少努力的理由。\u003c/td>\n\u003ctd>接着说看似方便仍需要照料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明载体留下而内容失用会使早先努力落空，因此劳动还须覆盖长期可用性。\u003c/td>\n\u003ctd>再说东西留下也未必有用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>承认保存困难未消失，归结为个人和机构仍应投入艰苦工作的一般要求。\u003c/td>\n\u003ctd>最后说难处仍在但有人应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A的Hard work should be done与文章末段图书馆员的努力并不冲突，数字资料需要更多照料也能支持付出努力这一要求。问题是A把中心写成对保存artifacts的一般号召，而实际各段不断限定数字信息的特殊难点：实物可能自行存留，数字获取须维持，载体存在也未必能读出信息，目前没有全面方案。结尾说明已有馆员应对这些难点，是对具体问题的回应。A能够容纳一部分内容，却弱化了数字记录为何不同、难在哪里这些贯穿全文的比较。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following statements best summarizes the text?\u003c/strong>\u003c/p>\n\u003ch3>B. Contributions of librarians should be recognized.\u003c/h3>\n\u003cp>图书馆员的贡献应当得到承认。\u003c/p>\n\u003ch4>如果 B 是主旨，文章5段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>图书馆员的贡献应当得到承认。\u003c/p>\n\u003cp>那文章5段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先说明旧物存留如何得益于收集与照料，引出保存者通常不被看见的贡献。\u003c/td>\n\u003ctd>先说旧东西为什么还能留下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>转到数字材料，比较馆员在新旧形式下的组织、保存和提供访问工作，展示贡献范围。\u003c/td>\n\u003ctd>再把另一种情况引进来比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>指出用户因获取方便而低估机构，解释这些便利反而应成为认可馆员工作的理由。\u003c/td>\n\u003ctd>接着说看似方便仍需要照料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>用载体留下却不能读取的风险说明馆员维护技术环境的额外贡献。\u003c/td>\n\u003ctd>再说东西留下也未必有用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>承认难处仍在，同时突出馆员的专业应对，最终要求社会承认其贡献。\u003c/td>\n\u003ctd>最后说难处仍在但有人应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B的Contributions of librarians确实能解释第3段为什么反驳图书馆不重要，也与末段馆员的独特位置相接。全文没有否认贡献应被看见。但第1段实物存留、第2段数字生命周期、第4段旧格式使信息失去可用性，持续组织的是历史记录怎样保存的问题；这些难处不是仅仅为了证明馆员值得赞扬而罗列。作者最后也先承认全面方案不存在，再给有限的安慰。B把解决问题的人及其价值放到中心，没有完整带出问题的对象和性质。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following statements best summarizes the text?\u003c/strong>\u003c/p>\n\u003ch3>C. Accessing databases is essential to researchers.\u003c/h3>\n\u003cp>访问数据库对于研究者至关重要。\u003c/p>\n\u003ch4>如果 C 是主旨，文章5段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>访问数据库对于研究者至关重要。\u003c/p>\n\u003cp>那文章5段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>从过去研究依赖留存旧物出发，说明可靠资料来源对研究者工作的重要性。\u003c/td>\n\u003ctd>先说旧东西为什么还能留下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>引入数字数据库与实物馆藏的比较，说明数据库访问怎样扩展研究所需信息的获取。\u003c/td>\n\u003ctd>再把另一种情况引进来比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>解释数据库看似随处可用却须持续维护，强调维持访问是支持研究的条件。\u003c/td>\n\u003ctd>接着说看似方便仍需要照料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>说明旧资料即使留下，若不可读取也无法进入有效检索，数据库访问因而可能受阻。\u003c/td>\n\u003ctd>再说东西留下也未必有用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>提出维护和整理措施，使研究者继续获得必要的数据库访问，从而开展研究。\u003c/td>\n\u003ctd>最后说难处仍在但有人应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C的Accessing databases可以碰到search and access以及末段accessibility，研究者的确需要取得资料。但文章不仅讨论已建数据库如何访问，而是问数字信息能否长期存留、载体和信息是否同时被保住。ZIP磁盘例子无需先属于数据库，就能说明格式过时的难题；未来记录可能中断也发生在研究者访问之前。C把长期保存的整条问题缩成其中的访问环节，还将对象限定为数据库。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following statements best summarizes the text?\u003c/strong>\u003c/p>\n\u003ch3>D. Keeping digital historical records is a challenge.\u003c/h3>\n\u003cp>保存数字历史记录是一项挑战。\u003c/p>\n\u003ch4>如果 D 是主旨，文章5段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>保存数字历史记录是一项挑战。\u003c/p>\n\u003cp>那文章5段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1段\u003c/td>\n\u003ctd>先展示有形旧物历经多年仍存留，为数字历史记录的命运建立对照。\u003c/td>\n\u003ctd>先说旧东西为什么还能留下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2段\u003c/td>\n\u003ctd>转向数字信息的生命周期，比较材料本身传递信息与数字形式长期保存的要求。\u003c/td>\n\u003ctd>再把另一种情况引进来比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3段\u003c/td>\n\u003ctd>揭示普遍访问背后的持续照料，指出数字信息便利并不代表它会自然留存。\u003c/td>\n\u003ctd>接着说看似方便仍需要照料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第4段\u003c/td>\n\u003ctd>进一步区分保住载体与保住可读信息，用格式过时说明历史记录仍可能中断。\u003c/td>\n\u003ctd>再说东西留下也未必有用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5段\u003c/td>\n\u003ctd>承认没有全面方案，同时介绍馆员的持续应对，呈现保存挑战及仍可努力的空间。\u003c/td>\n\u003ctd>最后说难处仍在但有人应对\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D的Keeping digital historical records明确了全文对象是数字历史记录，is a challenge概括它为什么难保存。第1段用有形材料作对照，第2段提出数字生命周期，第3段揭示维护要求，第4段展示格式过时带来的信息失用，第5段明确全面解决方案尚不存在。末段的馆员工作并不会推翻“有挑战”：恰因为难题仍在，作者才在承认没有全面方案之后给出有限安慰，努力的目标是让未来研究虽有挑战仍能进行。D既允许结尾写应对办法，也保留问题尚未消失这一分寸。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 保留。\u003c/strong>\u003c/p>\n\u003ch3>40题结论\u003c/h3>\n\u003cp>\u003cstrong>40. D. Keeping digital historical records is a challenge.\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Keeping digital historical records is a challenge. / 保存数字历史记录是一项挑战。\u003c/strong>\u003c/p>\n\u003ch2>36题\u003c/h2>\n\u003cblockquote>\n\u003cp>The author mentions the artifacts from the past to ______.\u003cbr>作者提到过去的物品，是为了什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>开篇例证作用题。题干要求判断“作者提到过去的物品，是为了什么？”，先按第1、2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Visit any antiques store and you’ll encounter artifacts from the past: photographs, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-1965 World’s Fair, the ephemera of history. Yet these objects aren’t truly ephemeral, because they’re still here, decades, even centuries later. Why? Because they’re tangible.\u003c/p>\n\u003cp>Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation? For millennia, we’ve known what we’ve known due to artifacts that have survived, often despite their original creators’ neglect. The thing itself is the medium that delivers the information. At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biographers, historians, and novelists rely on. Libraries and archives have traditionally shouldered the responsibility of organization, preservation, and access to information. One of S.R. Ranganathan’s foundational Laws of Library Science is “Save the time of the reader.” Thus, librarians digitize the tangible so that researchers the world over can quickly search and access their holdings. The result is an embarrassment of historical riches, which brings its own needle-and-haystack problems.\u003c/p>\n\u003c/blockquote>\n\u003cp>首段强调这些看似短暂的物品多年后仍在，原因是有形；次段转问数字信息的生命周期和长期保存安排。列举照片、信件并非评价价格，而是让保存问题具体可见。\u003c/p>\n\u003ch3>A. introduce the coming of antiques\u003c/h3>\n\u003cblockquote>\n\u003cp>介绍古董的出现\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“introduce the coming of [xxx]”，保留了相应遮挡。当时的定位线索是：A的 the coming of 要引出一种到来，而第2段 digital information 是接在老物品之后提出的新对象，两处都涉及由过去转向数字形式，所以回看第2段开头的提问。读完全文后，做题模式再经交叉验证排除A，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>antiques指古董，A完整意思是介绍古董的出现。首段却直接请读者走进古董店看已存在的旧物，没有交代古董这一类别如何产生、何时兴起，也没有叙述某批古董到来的过程。\u003c/p>\n\u003cp>首段追问的是这些物件为何多年后仍在，第二段立刻转问数字信息怎样长期保存。A的coming会把全文导向古董起源，而不是连接两段共同的存留问题，所以不能解释开篇举例。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者提到过去的物品，是为了介绍古董的出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 the coming of 要引出一种到来，而第2段 digital information 是接在老物品之后提出的新对象，两处都涉及由过去转向数字形式，所以回看第2段开头的提问。\u003c/p>\n\u003cp>antiques指古董，A完整意思是介绍古董的出现。首段却直接请读者走进古董店看已存在的旧物，没有交代古董这一类别如何产生、何时兴起，也没有叙述某批古董到来的过程。\u003c/p>\n\u003cp>首段追问的是这些物件为何多年后仍在，第二段立刻转问数字信息怎样长期保存。A的coming会把全文导向古董起源，而不是连接两段共同的存留问题，所以不能解释开篇举例。\u003c/p>\n\u003cp>首段强调这些看似短暂的物品多年后仍在，原因是有形；次段转问数字信息的生命周期和长期保存安排。列举照片、信件并非评价价格，而是让保存问题具体可见。\u003c/p>\n\u003cp>原文从已在店里的旧物出发，没有追述古董何时形成、何时进入市场。紧接着提出数字信息的保存，A却停留在antiques的产生，coming要求的起源线索在两段间没有出现。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation?\u003c/p>\n\u003cp>首段强调这些看似短暂的物品多年后仍在，原因是有形；次段转问数字信息的生命周期和长期保存安排。列举照片、信件并非评价价格，而是让保存问题具体可见。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用古董店里的旧物说明有形材料多年以后仍可能存留。转向数字信息长期保存，并交代材料传递与馆员工作。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The opening explains how ordinary objects become antiques and introduces the arrival of antiques as a category.\u003c/p>\n\u003cp>开头解释普通物件怎样成为古董，并介绍古董这一类别的出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文从已在店里的旧物出发，没有追述古董何时形成、何时进入市场。紧接着提出数字信息的保存，A却停留在antiques的产生，coming要求的起源线索在两段间没有出现。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讲数字历史记录的保存挑战，开头旧物应为这一问题提供对照或引入。具体是引出保存、介绍古董形成还是评价藏品，须看首段为何强调多年后仍然存在。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>introduce the coming of antiques\u003cbr>介绍古董的出现\u003c/p>\n\u003c/blockquote>\n\u003cp>首段追问的是这些物件为何多年后仍在，第二段立刻转问数字信息怎样长期保存。A的coming会把全文导向古董起源，而不是连接两段共同的存留问题，所以不能解释开篇举例。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用古董店里的旧物说明有形材料多年以后仍可能存留。转向数字信息长期保存，并交代材料传递与馆员工作。\u003c/p>\n\u003cp>本项最终仍要根据“long-term preservation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. contrast them with everyday items\u003c/h3>\n\u003cblockquote>\n\u003cp>将这些旧物与日常物品对比\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B的 everyday items 说另一组日常物品，第2段的 intangible formats 却把比较转向无形形式；两处都要与开头的老物品相对，所以回看第2段开头所引出的对象。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 intangible formats 后面用digital information补充说明，强调的是形式无形、存留需要安排。B的 everyday items 则以是否日常使用来划分物品。照片和信件本身也可能属于日常物品；文章没有把老物品放在日常用品的对面，而是从有形材料转到无形数字信息，两个比较轴不同。\u003c/p>\n\u003cp>原文改变的是信息形式，B改变的是用品类别，everyday不能代替intangible所指出的另一端。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者提到过去的物品，是为了将这些旧物与日常物品对比。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 everyday items 说另一组日常物品，第2段的 intangible formats 却把比较转向无形形式；两处都要与开头的老物品相对，所以回看第2段开头所引出的对象。\u003c/p>\n\u003cp>原文的 intangible formats 后面用digital information补充说明，强调的是形式无形、存留需要安排。B的 everyday items 则以是否日常使用来划分物品。照片和信件本身也可能属于日常物品；文章没有把老物品放在日常用品的对面，而是从有形材料转到无形数字信息，两个比较轴不同。\u003c/p>\n\u003cp>原文改变的是信息形式，B改变的是用品类别，everyday不能代替intangible所指出的另一端。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation?\u003c/p>\n\u003cp>首段强调这些看似短暂的物品多年后仍在，原因是有形；次段转问数字信息的生命周期和长期保存安排。列举照片、信件并非评价价格，而是让保存问题具体可见。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用古董店里的旧物说明有形材料多年以后仍可能存留。转向数字信息长期保存，并交代材料传递与馆员工作。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The author contrasts historical artifacts with a separate class of everyday objects.\u003c/p>\n\u003cp>作者把历史遗物与另一类日常用品相比较。\u003c/p>\n\u003c/blockquote>\n\u003cp>照片、信件本来也可以来自日常生活，文章比较的是有形材料与数字信息，轴线是信息形式和存留条件。B改成历史物与日用品的类别对照，不能解释下一段为何强调intangible formats。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讲数字历史记录的保存挑战，开头旧物应为这一问题提供对照或引入。具体是引出保存、介绍古董形成还是评价藏品，须看首段为何强调多年后仍然存在。\u003c/p>\n\u003c/blockquote>\n\u003cp>但B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>contrast them with everyday items\u003cbr>将这些旧物与日常物品对比\u003c/p>\n\u003c/blockquote>\n\u003cp>原文改变的是信息形式，B改变的是用品类别，everyday不能代替intangible所指出的另一端。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用古董店里的旧物说明有形材料多年以后仍可能存留。转向数字信息长期保存，并交代材料传递与馆员工作。\u003c/p>\n\u003cp>本项最终仍要根据“long-term preservation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. bring up the issue of preservation\u003c/h3>\n\u003cblockquote>\n\u003cp>引出保存的问题\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时的定位线索是：C的 the issue of preservation 与第2段 long-term preservation 都直接谈保存，老物品仍在引出数字信息能存多久，因此回看第1段的仍然存在与第2段长期保存的提问。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确概括例子作用。\u003c/strong>\u003c/p>\n\u003cp>开头的老物品已经经过数十年甚至数百年，作者先解释它们为什么还在。随后long-term preservation把这个存留问题移到数字信息上。C的 the issue of preservation 说的是两段之间持续追问的事情，而非单独描述古董种类；它把“实物留存的例子”与“数字信息长期保存的提问”接上了。\u003c/p>\n\u003cp>C既解释首段为什么强调存留时间，也解释下一段为什么立即问生命周期与保存安排。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yet these objects aren’t truly ephemeral, because they’re still here, decades, even centuries later.\u003c/p>\n\u003cp>Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者提到过去的物品，是为了引出保存的问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 the issue of preservation 与第2段 long-term preservation 都直接谈保存，老物品仍在引出数字信息能存多久，因此回看第1段的仍然存在与第2段长期保存的提问。\u003c/p>\n\u003cp>开头的老物品已经经过数十年甚至数百年，作者先解释它们为什么还在。随后long-term preservation把这个存留问题移到数字信息上。C的 the issue of preservation 说的是两段之间持续追问的事情，而非单独描述古董种类；它把“实物留存的例子”与“数字信息长期保存的提问”接上了。\u003c/p>\n\u003cp>C既解释首段为什么强调存留时间，也解释下一段为什么立即问生命周期与保存安排。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet these objects aren’t truly ephemeral, because they’re still here, decades, even centuries later.\u003c/p>\n\u003cp>Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation?\u003c/p>\n\u003cp>首段强调这些看似短暂的物品多年后仍在，原因是有形；次段转问数字信息的生命周期和长期保存安排。列举照片、信件并非评价价格，而是让保存问题具体可见。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用古董店里的旧物说明有形材料多年以后仍可能存留。转向数字信息长期保存，并交代材料传递与馆员工作。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The survival of old tangible objects introduces the question of how information can be preserved over time.\u003c/p>\n\u003cp>旧有形物件存留下来，引出了信息怎样跨时间保存的问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>still here、decades和centuries把注意力放在长期留存，随后preservation把这一问题明确提出。C同时解释举例内容、末尾问答和次段转向，比只覆盖某一个物品特征更完整。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讲数字历史记录的保存挑战，开头旧物应为这一问题提供对照或引入。具体是引出保存、介绍古董形成还是评价藏品，须看首段为何强调多年后仍然存在。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>bring up the issue of preservation\u003cbr>引出保存的问题\u003c/p>\n\u003c/blockquote>\n\u003cp>C既解释首段为什么强调存留时间，也解释下一段为什么立即问生命周期与保存安排。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用古董店里的旧物说明有形材料多年以后仍可能存留。转向数字信息长期保存，并交代材料传递与馆员工作。\u003c/p>\n\u003cp>本项最终仍要根据“long-term preservation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. comment on their historical value\u003c/h3>\n\u003cblockquote>\n\u003cp>评论这些物品的历史价值\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 historical value 关注老物品有什么价值，第1段 Why? Because they’re tangible 回答的却是它们为什么还在，两处都解释作者提这些物品的着眼点，所以回看首段最后的问答。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 Why? Because they’re tangible 是对“多年以后还在”的原因作回答，tangible说材料有形。D的 historical value 则把这段问答改成评价历史意义或价值高低。下一段虽然讲历史学家依赖记录，也继续围绕信息怎样传到后来的人手上；首段此处的直接推进是存留原因，不是在给这几件藏品作价值评论。\u003c/p>\n\u003cp>原文的问答解释物件存在至今的原因，D改成价值评判，改变了例子引向的具体问题。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Yet these objects aren’t truly ephemeral, because they’re still here, decades, even centuries later.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>作者提到过去的物品，是为了评论这些物品的历史价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 historical value 关注老物品有什么价值，第1段 Why? Because they’re tangible 回答的却是它们为什么还在，两处都解释作者提这些物品的着眼点，所以回看首段最后的问答。\u003c/p>\n\u003cp>原文的 Why? Because they’re tangible 是对“多年以后还在”的原因作回答，tangible说材料有形。D的 historical value 则把这段问答改成评价历史意义或价值高低。下一段虽然讲历史学家依赖记录，也继续围绕信息怎样传到后来的人手上；首段此处的直接推进是存留原因，不是在给这几件藏品作价值评论。\u003c/p>\n\u003cp>原文的问答解释物件存在至今的原因，D改成价值评判，改变了例子引向的具体问题。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1、2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet these objects aren’t truly ephemeral, because they’re still here, decades, even centuries later.\u003c/p>\n\u003cp>首段强调这些看似短暂的物品多年后仍在，原因是有形；次段转问数字信息的生命周期和长期保存安排。列举照片、信件并非评价价格，而是让保存问题具体可见。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用古董店里的旧物说明有形材料多年以后仍可能存留。转向数字信息长期保存，并交代材料传递与馆员工作。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The author evaluates how valuable the old photographs, letters and brochure are to historians.\u003c/p>\n\u003cp>作者评估旧照片、信件和宣传册对历史研究有多大价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>文中承认历史记录有用，但首段Why询问的是为何仍然存在，Because回答材料有形。D把存留原因改成价值评价；没有研究贡献的逐项说明，也没有价值高低的评判。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文讲数字历史记录的保存挑战，开头旧物应为这一问题提供对照或引入。具体是引出保存、介绍古董形成还是评价藏品，须看首段为何强调多年后仍然存在。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>comment on their historical value\u003cbr>评论这些物品的历史价值\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的问答解释物件存在至今的原因，D改成价值评判，改变了例子引向的具体问题。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用古董店里的旧物说明有形材料多年以后仍可能存留。转向数字信息长期保存，并交代材料传递与馆员工作。\u003c/p>\n\u003cp>本项最终仍要根据“long-term preservation”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>36题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>36. C. bring up the issue of preservation\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：古董已经存在，原文没有讲其起源或到来。\u003c/p>\n\u003cp>B：比较轴是有形与数字，不是历史物与日用品。\u003c/p>\n\u003cp>C：旧物存留引向数字信息如何长期保存。\u003c/p>\n\u003cp>D：存留原因被换成物品历史价值的评判。\u003c/p>\n\u003ch2>37题\u003c/h2>\n\u003cblockquote>\n\u003cp>Compared with digital objects, tangible artifacts ______.\u003cbr>与数字物件相比，有形物品怎样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>比较关系推断题。题干要求判断“与数字物件相比，有形物品怎样？”，先按第2、3、4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation? For millennia, we’ve known what we’ve known due to artifacts that have survived, often despite their original creators’ neglect. The thing itself is the medium that delivers the information. At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biographers, historians, and novelists rely on. Libraries and archives have traditionally shouldered the responsibility of organization, preservation, and access to information. One of S.R. Ranganathan’s foundational Laws of Library Science is “Save the time of the reader.” Thus, librarians digitize the tangible so that researchers the world over can quickly search and access their holdings. The result is an embarrassment of historical riches, which brings its own needle-and-haystack problems.\u003c/p>\n\u003cp>Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today. Yet how was that universality of access made possible and, perhaps more importantly, how is it maintained? Who curates what is preserved? When it comes to born-digital information, the terrifying answer can be: if not librarians and archivists, then no one. Digital information requires a great deal more care than analog.\u003c/p>\n\u003cp>Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself. As technology advances and a format becomes obsolete, the object is useless. Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this? Without constant migration of digital assets, a nightmare about the foreseeable future is what keeps historians up at night: a historical record that abruptly stops when digital replaces analog.\u003c/p>\n\u003c/blockquote>\n\u003cp>有形物件本身就是传递信息的媒介，即使没有刻意保存也可能成为历史记录。数字资料则需要更多照料，保存载体也可能读不出信息。比较的是信息与载体的关系及维护要求。\u003c/p>\n\u003ch3>A. are less subject to their creators’ neglect\u003c/h3>\n\u003cblockquote>\n\u003cp>较少受到创造者的忽视\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 less subject 比较被忽视的程度，第2段 despite their original creators’ neglect 明说物品曾被创造者忽视；两处谈同一种忽视，因此回看存留下来的原因以及没有有意保存的说明。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 despite their original creators’ neglect 是说尽管被忽视，物品仍可能留下；随后no attempts也说明创作时没有有意保存。A的 less subject 把“虽遭忽视仍可能存留”改成“因为较少遭到忽视而有优势”。同段开头又说数字资料创造者很少安排长期保存，两类都有忽视，原文解释有形物优势时并没有把忽视程度减小，而是把存留与忽视分开。\u003c/p>\n\u003cp>despite承认忽视确实存在，A却把保留下来的现象转成受到较少忽视，两者所描述的原因不同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>For millennia, we’ve known what we’ve known due to artifacts that have survived, often despite their original creators’ neglect.\u003c/p>\n\u003cp>At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biographers, historians, and novelists rely on.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>与数字物件相比，有形物品较少受到创造者的忽视。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 less subject 比较被忽视的程度，第2段 despite their original creators’ neglect 明说物品曾被创造者忽视；两处谈同一种忽视，因此回看存留下来的原因以及没有有意保存的说明。\u003c/p>\n\u003cp>原文的 despite their original creators’ neglect 是说尽管被忽视，物品仍可能留下；随后no attempts也说明创作时没有有意保存。A的 less subject 把“虽遭忽视仍可能存留”改成“因为较少遭到忽视而有优势”。同段开头又说数字资料创造者很少安排长期保存，两类都有忽视，原文解释有形物优势时并没有把忽视程度减小，而是把存留与忽视分开。\u003c/p>\n\u003cp>despite承认忽视确实存在，A却把保留下来的现象转成受到较少忽视，两者所描述的原因不同。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>For millennia, we’ve known what we’ve known due to artifacts that have survived, often despite their original creators’ neglect.\u003c/p>\n\u003cp>At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biographers, historians, and novelists rely on.\u003c/p>\n\u003cp>有形物件本身就是传递信息的媒介，即使没有刻意保存也可能成为历史记录。数字资料则需要更多照料，保存载体也可能读不出信息。比较的是信息与载体的关系及维护要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向数字信息长期保存，并交代材料传递与馆员工作。指出便利获取背后需有人维护，数字信息更费照料。用旧磁盘取文件说明载体留下但格式过时可使记录中断。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Tangible objects survive because their creators neglect them less than they neglect digital materials.\u003c/p>\n\u003cp>有形物件得以留存，是因为创造者对它们的忽视少于对数字材料的忽视。\u003c/p>\n\u003c/blockquote>\n\u003cp>despite neglect说在忽视存在的情况下仍有机会存留，A却把优势归为较少遭忽视。数字创造者很少安排保存与模拟材料未被有意保存都承认忽视，文中没有建立受重视程度的高低比较。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文比较数字记录与有形记录的存留条件。主旨能提示比较方向，却不能单独推出哪类物件更少受忽视或更不易受损；应以媒介关系及照料要求的原句为准。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>are less subject to their creators’ neglect\u003cbr>较少受到创造者的忽视\u003c/p>\n\u003c/blockquote>\n\u003cp>despite承认忽视确实存在，A却把保留下来的现象转成受到较少忽视，两者所描述的原因不同。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向数字信息长期保存，并交代材料传递与馆员工作。指出便利获取背后需有人维护，数字信息更费照料。用旧磁盘取文件说明载体留下但格式过时可使记录中断。\u003c/p>\n\u003cp>本项最终仍要根据“The thing itself is the medium”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. convey information in a more direct way\u003c/h3>\n\u003cblockquote>\n\u003cp>以更直接的方式传递信息\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的 a more direct way 问信息怎样传递，第2段 The thing itself is the medium 明确说物件本身就是媒介，因此回看这个句子，再联系数字信息需要维护的对比。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确局部推断。\u003c/strong>\u003c/p>\n\u003cp>原文的 The thing itself is the medium 把实物与传递信息的媒介直接合在一起；保存下来的材料本身就能作为历史记录。B的 a more direct way 概括的正是这种方式，两边说的是同一个传递关系。与之相比，数字信息即使存在也需要更多照料和持续维护，不能把屏幕上能访问的信息看成天然永远在那里。B比较的是信息传递方式，没有声称实物从不损坏或不受忽视。\u003c/p>\n\u003cp>原句把载有历史的物件与信息媒介接在一起，第3段又指出数字资料需要额外维护，B与这组对比相接。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The thing itself is the medium that delivers the information.\u003c/p>\n\u003cp>Digital information requires a great deal more care than analog.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>与数字物件相比，有形物品以更直接的方式传递信息。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 a more direct way 问信息怎样传递，第2段 The thing itself is the medium 明确说物件本身就是媒介，因此回看这个句子，再联系数字信息需要维护的对比。\u003c/p>\n\u003cp>原文的 The thing itself is the medium 把实物与传递信息的媒介直接合在一起；保存下来的材料本身就能作为历史记录。B的 a more direct way 概括的正是这种方式，两边说的是同一个传递关系。与之相比，数字信息即使存在也需要更多照料和持续维护，不能把屏幕上能访问的信息看成天然永远在那里。B比较的是信息传递方式，没有声称实物从不损坏或不受忽视。\u003c/p>\n\u003cp>原句把载有历史的物件与信息媒介接在一起，第3段又指出数字资料需要额外维护，B与这组对比相接。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The thing itself is the medium that delivers the information.\u003c/p>\n\u003cp>Digital information requires a great deal more care than analog.\u003c/p>\n\u003cp>有形物件本身就是传递信息的媒介，即使没有刻意保存也可能成为历史记录。数字资料则需要更多照料，保存载体也可能读不出信息。比较的是信息与载体的关系及维护要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向数字信息长期保存，并交代材料传递与馆员工作。指出便利获取背后需有人维护，数字信息更费照料。用旧磁盘取文件说明载体留下但格式过时可使记录中断。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>A surviving tangible object itself carries the information, whereas saved digital carriers may still require technical interpretation.\u003c/p>\n\u003cp>留存的有形物本身传递信息，而保住数字载体还可能需要技术才能读出。\u003c/p>\n\u003c/blockquote>\n\u003cp>The thing itself is the medium直接说明实物与信息媒介相合，第4段区分载体保存与信息可用。more direct way概括这个对照，既不保证实物永不损坏，也不把数字资料说成永远无法访问。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文比较数字记录与有形记录的存留条件。主旨能提示比较方向，却不能单独推出哪类物件更少受忽视或更不易受损；应以媒介关系及照料要求的原句为准。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>convey information in a more direct way\u003cbr>以更直接的方式传递信息\u003c/p>\n\u003c/blockquote>\n\u003cp>原句把载有历史的物件与信息媒介接在一起，第3段又指出数字资料需要额外维护，B与这组对比相接。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向数字信息长期保存，并交代材料传递与馆员工作。指出便利获取背后需有人维护，数字信息更费照料。用旧磁盘取文件说明载体留下但格式过时可使记录中断。\u003c/p>\n\u003cp>本项最终仍要根据“The thing itself is the medium”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. require more intentional preservation\u003c/h3>\n\u003cblockquote>\n\u003cp>需要更多有意安排的保存\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时选项呈现为“require more [xxx] preservation”，保留了相应遮挡。当时的定位线索是：C的 require more 把更多保存要求放在有形物品一边，第3段 more care than analog 则明确比较数字与模拟形式需要的照料，因此回看最后一句的主语。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>intentional preservation是有意安排保存。第2段说模拟材料在no attempts的情况下仍有存留机会；第3段更明确说Digital information requires a great deal more care than analog，更多照料属于数字信息。\u003c/p>\n\u003cp>C接回题干后却把tangible artifacts放在require more的一侧，比较方向倒置。完整补出intentional后，反而更清楚地对应第2段否定过的刻意安排，不能从“仍能留下”推成“需要更多保存”。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Digital information requires a great deal more care than analog.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>与数字物件相比，有形物品需要更多有意安排的保存。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 require more 把更多保存要求放在有形物品一边，第3段 more care than analog 则明确比较数字与模拟形式需要的照料，因此回看最后一句的主语。\u003c/p>\n\u003cp>intentional preservation是有意安排保存。第2段说模拟材料在no attempts的情况下仍有存留机会；第3段更明确说Digital information requires a great deal more care than analog，更多照料属于数字信息。\u003c/p>\n\u003cp>C接回题干后却把tangible artifacts放在require more的一侧，比较方向倒置。完整补出intentional后，反而更清楚地对应第2段否定过的刻意安排，不能从“仍能留下”推成“需要更多保存”。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Digital information requires a great deal more care than analog.\u003c/p>\n\u003cp>有形物件本身就是传递信息的媒介，即使没有刻意保存也可能成为历史记录。数字资料则需要更多照料，保存载体也可能读不出信息。比较的是信息与载体的关系及维护要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向数字信息长期保存，并交代材料传递与馆员工作。指出便利获取背后需有人维护，数字信息更费照料。用旧磁盘取文件说明载体留下但格式过时可使记录中断。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Tangible artifacts need more deliberate preservation arrangements than digital objects do.\u003c/p>\n\u003cp>有形材料比数字对象需要更多有意安排的保存。\u003c/p>\n\u003c/blockquote>\n\u003cp>第2段说模拟材料未安排保存仍可能存留，第3段需要更多照料的主语是Digital information。C将more一侧转给有形材料，intentional的完整词义也不能扭转这个比较方向。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文比较数字记录与有形记录的存留条件。主旨能提示比较方向，却不能单独推出哪类物件更少受忽视或更不易受损；应以媒介关系及照料要求的原句为准。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>require more intentional preservation\u003cbr>需要更多有意安排的保存\u003c/p>\n\u003c/blockquote>\n\u003cp>C接回题干后却把tangible artifacts放在require more的一侧，比较方向倒置。完整补出intentional后，反而更清楚地对应第2段否定过的刻意安排，不能从“仍能留下”推成“需要更多保存”。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向数字信息长期保存，并交代材料传递与馆员工作。指出便利获取背后需有人维护，数字信息更费照料。用旧磁盘取文件说明载体留下但格式过时可使记录中断。\u003c/p>\n\u003cp>本项最终仍要根据“The thing itself is the medium”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. are less likely to suffer serious damage\u003c/h3>\n\u003cblockquote>\n\u003cp>较不容易受到严重损坏\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时的定位线索是：D的 serious damage 关注物品受损，第2段 have a chance of surviving 说模拟材料仍有机会留存；留存与受损可能相关，所以回到尽管未刻意保存仍可能留下的这句。读完全文后，做题模式再经交叉验证排除D，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文的have a chance of surviving说明可能留存，并不统计实物和数字物件遭到严重损坏的概率。D的serious damage要求有关损坏风险的比较，不能仅凭材料仍有机会存在就推出更不易损坏。\u003c/p>\n\u003cp>数字磁盘即使外壳完好，格式失去支持也可能读不出信息，因此数字保存困难不一定来自损坏。B概括媒介与信息的直接关系有明确原句，D则为优势补了一项未证实的物理原因。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biographers, historians, and novelists rely on.\u003c/p>\n\u003cp>Digital information requires a great deal more care than analog.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>与数字物件相比，有形物品较不容易受到严重损坏。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 serious damage 关注物品受损，第2段 have a chance of surviving 说模拟材料仍有机会留存；留存与受损可能相关，所以回到尽管未刻意保存仍可能留下的这句。\u003c/p>\n\u003cp>原文的have a chance of surviving说明可能留存，并不统计实物和数字物件遭到严重损坏的概率。D的serious damage要求有关损坏风险的比较，不能仅凭材料仍有机会存在就推出更不易损坏。\u003c/p>\n\u003cp>数字磁盘即使外壳完好，格式失去支持也可能读不出信息，因此数字保存困难不一定来自损坏。B概括媒介与信息的直接关系有明确原句，D则为优势补了一项未证实的物理原因。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2、3、4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biographers, historians, and novelists rely on.\u003c/p>\n\u003cp>Digital information requires a great deal more care than analog.\u003c/p>\n\u003cp>有形物件本身就是传递信息的媒介，即使没有刻意保存也可能成为历史记录。数字资料则需要更多照料，保存载体也可能读不出信息。比较的是信息与载体的关系及维护要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转向数字信息长期保存，并交代材料传递与馆员工作。指出便利获取背后需有人维护，数字信息更费照料。用旧磁盘取文件说明载体留下但格式过时可使记录中断。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Tangible artifacts are physically more resistant to serious damage than digital objects.\u003c/p>\n\u003cp>有形材料在物理上比数字对象更能抵抗严重损坏。\u003c/p>\n\u003c/blockquote>\n\u003cp>存留机会和维护要求没有提供两类材料受到严重损坏的概率。旧数字磁盘甚至可能完整却不能读取，问题在格式支持而非外壳受损；D把信息传递差异具体化成未获证明的抗损能力。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>全文比较数字记录与有形记录的存留条件。主旨能提示比较方向，却不能单独推出哪类物件更少受忽视或更不易受损；应以媒介关系及照料要求的原句为准。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>are less likely to suffer serious damage\u003cbr>较不容易受到严重损坏\u003c/p>\n\u003c/blockquote>\n\u003cp>数字磁盘即使外壳完好，格式失去支持也可能读不出信息，因此数字保存困难不一定来自损坏。B概括媒介与信息的直接关系有明确原句，D则为优势补了一项未证实的物理原因。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转向数字信息长期保存，并交代材料传递与馆员工作。指出便利获取背后需有人维护，数字信息更费照料。用旧磁盘取文件说明载体留下但格式过时可使记录中断。\u003c/p>\n\u003cp>本项最终仍要根据“The thing itself is the medium”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>37题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>37. B. convey information in a more direct way\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：尽管被忽视仍能存留，不等于受忽视更少。\u003c/p>\n\u003cp>B：物件本身就是媒介，支持信息传递较直接。\u003c/p>\n\u003cp>C：需要更多照料的是数字信息，选项颠倒比较。\u003c/p>\n\u003cp>D：文中未比较严重损坏概率，读不出信息也未必源于物理破坏。\u003c/p>\n\u003ch2>38题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to Paragraph 3, librarians’ work may result in ______.\u003cbr>根据第3段，图书馆员的工作可能导致什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>局部因果题。题干要求判断“根据第3段，图书馆员的工作可能导致什么？”，先按第3段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today. Yet how was that universality of access made possible and, perhaps more importantly, how is it maintained? Who curates what is preserved? When it comes to born-digital information, the terrifying answer can be: if not librarians and archivists, then no one. Digital information requires a great deal more care than analog.\u003c/p>\n\u003c/blockquote>\n\u003cp>馆员使信息更易获取，用户举手机便以为图书馆不重要，便利反而遮住背后的组织与维护。作者的连续反问把被忽略的劳动重新指出，并非赞同图书馆真的变得无用。\u003c/p>\n\u003ch3>A. oversupply of materials\u003c/h3>\n\u003cblockquote>\n\u003cp>材料供给过剩\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 oversupply of materials 说材料数量过多，第3段 libraries are less vital 写用户由容易获取得出的结论，两处都可能被当作图书馆工作的结果，所以回看本段开头实际把什么写在as evidence后面。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。\u003c/strong>\u003c/p>\n\u003cp>第3段用 libraries are less vital 陈述用户对机构重要性的判断，后面的追问也是谁维持访问。A的 oversupply of materials 则把结果改成材料数量问题。第2段末尾确有historical riches和大海捞针的困难，但本题明确限定第3段，本段讨论的是人们如何看待图书馆，不是资料丰富到难以搜索这一数量后果。\u003c/p>\n\u003cp>A将前段信息丰厚可能带来的检索问题移到本段，替换了这里具体讨论的结果对象。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today. Yet how was that universality of access made possible and, perhaps more importantly, how is it maintained? Who curates what is preserved? When it comes to born-digital information, the terrifying answer can be: if not librarians and archivists, then no one. Digital information requires a great deal more care than analog.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第3段，图书馆员的工作可能导致材料供给过剩。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 oversupply of materials 说材料数量过多，第3段 libraries are less vital 写用户由容易获取得出的结论，两处都可能被当作图书馆工作的结果，所以回看本段开头实际把什么写在as evidence后面。\u003c/p>\n\u003cp>第3段用 libraries are less vital 陈述用户对机构重要性的判断，后面的追问也是谁维持访问。A的 oversupply of materials 则把结果改成材料数量问题。第2段末尾确有historical riches和大海捞针的困难，但本题明确限定第3段，本段讨论的是人们如何看待图书馆，不是资料丰富到难以搜索这一数量后果。\u003c/p>\n\u003cp>A将前段信息丰厚可能带来的检索问题移到本段，替换了这里具体讨论的结果对象。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today. Yet how was that universality of access made possible and, perhaps more importantly, how is it maintained? Who curates what is preserved? When it comes to born-digital information, the terrifying answer can be: if not librarians and archivists, then no one. Digital information requires a great deal more care than analog.\u003c/p>\n\u003cp>馆员使信息更易获取，用户举手机便以为图书馆不重要，便利反而遮住背后的组织与维护。作者的连续反问把被忽略的劳动重新指出，并非赞同图书馆真的变得无用。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出便利获取背后需有人维护，数字信息更费照料。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>In this paragraph, librarians supply so much material that users face an excess of documents.\u003c/p>\n\u003cp>在这一段中，馆员提供过量材料，使用户面对资料过剩。\u003c/p>\n\u003c/blockquote>\n\u003cp>资料丰富带来的检索困难在第2段末尾出现，第3段则讨论用户对机构的重要性评价。A虽能联系前文词语，却用另一个段落的结果回答指定段落的因果问题，错在范围和重心。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>数字记录保存需要持续工作，因此表面的访问便利不代表背后工作消失。第3段要查的是用户怎样评价图书馆，不能仅凭主旨扩大为研究质量下降或技术依赖过度。\u003c/p>\n\u003c/blockquote>\n\u003cp>但A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>oversupply of materials\u003cbr>材料供给过剩\u003c/p>\n\u003c/blockquote>\n\u003cp>A将前段信息丰厚可能带来的检索问题移到本段，替换了这里具体讨论的结果对象。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出便利获取背后需有人维护，数字信息更费照料。\u003c/p>\n\u003cp>本项最终仍要根据“libraries are less vital”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. undervaluation of libraries\u003c/h3>\n\u003cblockquote>\n\u003cp>图书馆被低估\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B的 undervaluation of libraries 是低估图书馆，而第3段 libraries are less vital 是用户认为图书馆不那么重要，两者都是对图书馆价值的判断，因此回看手机例子和紧接着的反问。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文的 libraries are less vital 是用户见到手机上可以获取资料后作的判断，作者却用Yet追问获取如何成为可能、如何维持，指出这个判断忽略了背后的劳动。B的 undervaluation of libraries 因此不只是复述“重要性减少”，而是说人们把图书馆作用看低了；这与selfless devotion反过来不利于馆员的说法对上了。\u003c/p>\n\u003cp>用户的结论与作者随后提醒的维护工作相对，B把这一判断中的低估说清楚了。\u003c/p>\n\u003cp>\u003cstrong>出处：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today.\u003c/p>\n\u003cp>Yet how was that universality of access made possible and, perhaps more importantly, how is it maintained?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第3段，图书馆员的工作可能导致图书馆被低估。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 undervaluation of libraries 是低估图书馆，而第3段 libraries are less vital 是用户认为图书馆不那么重要，两者都是对图书馆价值的判断，因此回看手机例子和紧接着的反问。\u003c/p>\n\u003cp>原文的 libraries are less vital 是用户见到手机上可以获取资料后作的判断，作者却用Yet追问获取如何成为可能、如何维持，指出这个判断忽略了背后的劳动。B的 undervaluation of libraries 因此不只是复述“重要性减少”，而是说人们把图书馆作用看低了；这与selfless devotion反过来不利于馆员的说法对上了。\u003c/p>\n\u003cp>用户的结论与作者随后提醒的维护工作相对，B把这一判断中的低估说清楚了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today.\u003c/p>\n\u003cp>Yet how was that universality of access made possible and, perhaps more importantly, how is it maintained?\u003c/p>\n\u003cp>馆员使信息更易获取，用户举手机便以为图书馆不重要，便利反而遮住背后的组织与维护。作者的连续反问把被忽略的劳动重新指出，并非赞同图书馆真的变得无用。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出便利获取背后需有人维护，数字信息更费照料。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Easy access created by librarians leads some users to underestimate the importance of the libraries behind it.\u003c/p>\n\u003cp>馆员创造的便利获取使一些用户低估了背后图书馆的重要性。\u003c/p>\n\u003c/blockquote>\n\u003cp>as evidence引出用户认为less vital的推理，Yet之后的维护追问揭示这种判断漏掉的劳动。undervaluation保留“评价偏低”的意思，也准确解释selfless devotion为什么可能反过来不利于馆员。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>数字记录保存需要持续工作，因此表面的访问便利不代表背后工作消失。第3段要查的是用户怎样评价图书馆，不能仅凭主旨扩大为研究质量下降或技术依赖过度。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>undervaluation of libraries\u003cbr>图书馆被低估\u003c/p>\n\u003c/blockquote>\n\u003cp>用户的结论与作者随后提醒的维护工作相对，B把这一判断中的低估说清楚了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出便利获取背后需有人维护，数字信息更费照料。\u003c/p>\n\u003cp>本项最终仍要根据“libraries are less vital”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. researchers’ underperformance\u003c/h3>\n\u003cblockquote>\n\u003cp>研究者表现不佳\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“researchers’ [xxx]”，保留了相应遮挡。当时的定位线索是：C的 researchers’ 将结果放到研究者身上，第3段 for researchers today 也把用户评价图书馆放在今天研究者的情境里，两者所涉及的人群能相接，所以回到用户因手机访问而作出判断的句子。读完全文后，做题模式再经交叉验证排除C，最终选择B。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>underperformance是表现不佳，而非对图书馆形成错误看法。段中for researchers today限定图书馆服务谁，作者没有评价研究者的论文质量、产出、效率或其他业绩指标。\u003c/p>\n\u003cp>用户以手机可访问为证据，错误低估图书馆背后的劳动，这是一种价值判断。C把判断上的偏差转换成实际工作表现的下降；同样谈研究者，不代表两种后果能够互换。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第3段，图书馆员的工作可能导致研究者表现不佳。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 researchers’ 将结果放到研究者身上，第3段 for researchers today 也把用户评价图书馆放在今天研究者的情境里，两者所涉及的人群能相接，所以回到用户因手机访问而作出判断的句子。\u003c/p>\n\u003cp>underperformance是表现不佳，而非对图书馆形成错误看法。段中for researchers today限定图书馆服务谁，作者没有评价研究者的论文质量、产出、效率或其他业绩指标。\u003c/p>\n\u003cp>用户以手机可访问为证据，错误低估图书馆背后的劳动，这是一种价值判断。C把判断上的偏差转换成实际工作表现的下降；同样谈研究者，不代表两种后果能够互换。\u003c/p>\n\u003cp>馆员使信息更易获取，用户举手机便以为图书馆不重要，便利反而遮住背后的组织与维护。作者的连续反问把被忽略的劳动重新指出，并非赞同图书馆真的变得无用。\u003c/p>\n\u003cp>for researchers限定谁使用服务，并没有衡量论文质量、效率或研究结果。作者纠正的是用户对图书馆的认识，underperformance要求实际业绩下降的证据，不能由错误评价自动推出。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today.\u003c/p>\n\u003cp>馆员使信息更易获取，用户举手机便以为图书馆不重要，便利反而遮住背后的组织与维护。作者的连续反问把被忽略的劳动重新指出，并非赞同图书馆真的变得无用。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出便利获取背后需有人维护，数字信息更费照料。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Librarians’ work causes researchers to perform their research less effectively.\u003c/p>\n\u003cp>馆员的工作使研究者开展研究的表现变差。\u003c/p>\n\u003c/blockquote>\n\u003cp>for researchers限定谁使用服务，并没有衡量论文质量、效率或研究结果。作者纠正的是用户对图书馆的认识，underperformance要求实际业绩下降的证据，不能由错误评价自动推出。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>数字记录保存需要持续工作，因此表面的访问便利不代表背后工作消失。第3段要查的是用户怎样评价图书馆，不能仅凭主旨扩大为研究质量下降或技术依赖过度。\u003c/p>\n\u003c/blockquote>\n\u003cp>但C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>researchers’ underperformance\u003cbr>研究者表现不佳\u003c/p>\n\u003c/blockquote>\n\u003cp>用户以手机可访问为证据，错误低估图书馆背后的劳动，这是一种价值判断。C把判断上的偏差转换成实际工作表现的下降；同样谈研究者，不代表两种后果能够互换。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出便利获取背后需有人维护，数字信息更费照料。\u003c/p>\n\u003cp>本项最终仍要根据“libraries are less vital”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. users’ overreliance on technology\u003c/h3>\n\u003cblockquote>\n\u003cp>用户过度依赖技术\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 overreliance on technology 说使用技术的依赖程度，而原文 as evidence that libraries are less vital 说明举手机是在为一种评价提供理由；两处都涉及手机使用者，所以回看手机例子在句子里承担什么作用。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 as evidence that libraries are less vital 将手机放在“证明图书馆不重要”的论证中，问题是把访问便利当成机构不再重要的理由。D的 overreliance on technology 却将结果改成用户使用技术过度依赖，评价的是使用行为及程度。举手机并表达观点并不等于反复依靠设备到过量；本段追问谁维护信息，也是在纠正对劳动与机构的认识。\u003c/p>\n\u003cp>原文呈现的是一种错误评价及其理由，D换成使用频率或依赖程度，改变了反作用的具体内容。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>根据第3段，图书馆员的工作可能导致用户过度依赖技术。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 overreliance on technology 说使用技术的依赖程度，而原文 as evidence that libraries are less vital 说明举手机是在为一种评价提供理由；两处都涉及手机使用者，所以回看手机例子在句子里承担什么作用。\u003c/p>\n\u003cp>原文的 as evidence that libraries are less vital 将手机放在“证明图书馆不重要”的论证中，问题是把访问便利当成机构不再重要的理由。D的 overreliance on technology 却将结果改成用户使用技术过度依赖，评价的是使用行为及程度。举手机并表达观点并不等于反复依靠设备到过量；本段追问谁维护信息，也是在纠正对劳动与机构的认识。\u003c/p>\n\u003cp>原文呈现的是一种错误评价及其理由，D换成使用频率或依赖程度，改变了反作用的具体内容。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today.\u003c/p>\n\u003cp>馆员使信息更易获取，用户举手机便以为图书馆不重要，便利反而遮住背后的组织与维护。作者的连续反问把被忽略的劳动重新指出，并非赞同图书馆真的变得无用。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：指出便利获取背后需有人维护，数字信息更费照料。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Convenient library services cause users to depend excessively on technology in their daily work.\u003c/p>\n\u003cp>便捷的图书馆服务使用户在日常工作中过度依赖技术。\u003c/p>\n\u003c/blockquote>\n\u003cp>手机在原文中是用户证明图书馆不重要的道具，不是过量使用技术的行为记录。D把认识上的低估改为依赖程度过高；作者问谁维持访问，也不是劝用户减少设备使用。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>数字记录保存需要持续工作，因此表面的访问便利不代表背后工作消失。第3段要查的是用户怎样评价图书馆，不能仅凭主旨扩大为研究质量下降或技术依赖过度。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>users’ overreliance on technology\u003cbr>用户过度依赖技术\u003c/p>\n\u003c/blockquote>\n\u003cp>原文呈现的是一种错误评价及其理由，D换成使用频率或依赖程度，改变了反作用的具体内容。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：指出便利获取背后需有人维护，数字信息更费照料。\u003c/p>\n\u003cp>本项最终仍要根据“libraries are less vital”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>38题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>38. B. undervaluation of libraries\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：取自前段的资料丰厚问题，不能替代本段指定后果。\u003c/p>\n\u003cp>B：便利访问遮住维护劳动，导致用户低估图书馆。\u003c/p>\n\u003cp>C：错误评价不等于研究工作实际表现变差。\u003c/p>\n\u003cp>D：手机例子说明价值判断，不说明技术使用过度。\u003c/p>\n\u003ch2>39题\u003c/h2>\n\u003cblockquote>\n\u003cp>The “ZIP disk” is cited as an example to show ______.\u003cbr>引用ZIP磁盘这个例子，是为了说明什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>例证作用题。题干要求判断“引用ZIP磁盘这个例子，是为了说明什么？”，先按第4段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself. As technology advances and a format becomes obsolete, the object is useless. Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this? Without constant migration of digital assets, a nightmare about the foreseeable future is what keeps historians up at night: a historical record that abruptly stops when digital replaces analog.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者先区分载体与信息，再指出格式过时使对象无用。磁盘仍在却无法取出文件，将这一区分具体化；末句因此强调持续迁移，避免历史记录在数字转型处中断。\u003c/p>\n\u003ch3>A. the difficulty of retrieving files through unusual means\u003c/h3>\n\u003cblockquote>\n\u003cp>通过不寻常的方式提取文件很困难\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A的 unusual means 把困难归到取得文件的手段，第4段 a format becomes obsolete 把问题归到格式过时，两处都解释取文件为何困难，所以回看例子之前的因由和例子中的提问。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 a format becomes obsolete 先指出旧格式随着技术进步失去可用性，接着才问怎样把文件取出来。A的 unusual means 却预设已经采取一种不寻常的手段，而困难在这种手段中发生。例子只有“怎么取”的问题，没有把某种非常规操作设为失败原因；A用手段是否常见替换了格式是否还能使用，困难的原因不同。\u003c/p>\n\u003cp>原文解释的是保存格式失去支持，A换成操作方式特殊，原因和条件并不相同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>As technology advances and a format becomes obsolete, the object is useless.\u003c/p>\n\u003cp>Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用ZIP磁盘这个例子，是为了说明通过不寻常的方式提取文件很困难。\u003c/p>\n\u003c/blockquote>\n\u003cp>A的 \n\u003cblockquote>\n\u003cp>持续迁移数字资产不可行\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“the [xxx] of constantly migrating digital assets”，保留了相应遮挡。当时的定位线索是：B的 constantly migrating digital assets 与例子之后的 Without constant migration 是同一件持续迁移的事，所以回到例子和它后面的条件句，看迁移与记录存留如何相接。读完全文后，做题模式再经交叉验证排除B，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>infeasibility表示不可行。末句Without constant migration将不迁移与历史记录可能中断联系起来，说明持续迁移是避免风险所需的工作，而不是证明这种工作无法开展。\u003c/p>\n\u003cp>ZIP磁盘的难题具体显示旧格式可能失去可用性，因而需要维护和转换。B将“需要做且有困难”强化成“做不了”，添加了无法实施的绝对判断；作者说没有全面方案，也不等于否认每一种迁移实践。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this?\u003c/p>\n\u003cp>Without constant migration of digital assets, a nightmare about the foreseeable future is what keeps historians up at night: a historical record that abruptly stops when digital replaces analog.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用ZIP磁盘这个例子，是为了说明持续迁移数字资产不可行。\u003c/p>\n\u003c/blockquote>\n\u003cp>B的 constantly migrating digital assets 与例子之后的 Without constant migration 是同一件持续迁移的事，所以回到例子和它后面的条件句，看迁移与记录存留如何相接。\u003c/p>\n\u003cp>infeasibility表示不可行。末句Without constant migration将不迁移与历史记录可能中断联系起来，说明持续迁移是避免风险所需的工作，而不是证明这种工作无法开展。\u003c/p>\n\u003cp>ZIP磁盘的难题具体显示旧格式可能失去可用性，因而需要维护和转换。B将“需要做且有困难”强化成“做不了”，添加了无法实施的绝对判断；作者说没有全面方案，也不等于否认每一种迁移实践。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this?\u003c/p>\n\u003cp>Without constant migration of digital assets, a nightmare about the foreseeable future is what keeps historians up at night: a historical record that abruptly stops when digital replaces analog.\u003c/p>\n\u003cp>作者先区分载体与信息，再指出格式过时使对象无用。磁盘仍在却无法取出文件，将这一区分具体化；
