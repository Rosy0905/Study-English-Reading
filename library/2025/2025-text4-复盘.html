003cblockquote>\n\u003cp>Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself.\u003c/p>\n\u003cp>As technology advances and a format becomes obsolete, the object is useless.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用ZIP磁盘这个例子，是为了说明格式过时可能导致信息丧失。\u003c/p>\n\u003c/blockquote>\n\u003cp>C的 losing information in obsolete formats 要区分信息和承载它的东西，段首 only be the carrier 正是说可能只保留载体，因此回看段首区分与格式过时的下一句。\u003c/p>\n\u003cp>原文的 only be the carrier 将保住磁盘之类的物件与保住信息分开；随后格式过时让物件没有用，才出现盯着ZIP磁盘却不知怎样取文件的例子。C的 losing information in obsolete formats 保留了相同的可能性和具体条件。这里的失去信息不必等于磁盘碎裂或信息被主动删除，也包括载体仍在却无法把信息读出来。\u003c/p>\n\u003cp>C把载体存留、信息未必存留和格式过时三个部分合在一起，恰好解释了例子为什么放在这里。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself.\u003c/p>\n\u003cp>As technology advances and a format becomes obsolete, the object is useless.\u003c/p>\n\u003cp>作者先区分载体与信息，再指出格式过时使对象无用。磁盘仍在却无法取出文件，将这一区分具体化；末句因此强调持续迁移，避免历史记录在数字转型处中断。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用旧磁盘取文件说明载体留下但格式过时可使记录中断。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>A digital carrier may survive while obsolete formats prevent access to the information it holds.\u003c/p>\n\u003cp>数字载体可能留存，但过时格式会阻止人们获取其中信息。\u003c/p>\n\u003c/blockquote>\n\u003cp>carrier与information的对照提供概括，obsolete给出条件，取不出文件是具体表现。C说possibility保留风险而非必然，losing information也可指信息无法再使用，不限于磁盘被物理破坏。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>数字保存的挑战不限于保住载体，还在于未来能否读取信息。ZIP例子应具体展示这种风险；至于迁移是否可行或操作手段是否特殊，主旨不能替原文作出额外断言。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the possibility of losing information in obsolete formats\u003cbr>格式过时可能导致信息丧失\u003c/p>\n\u003c/blockquote>\n\u003cp>C把载体存留、信息未必存留和格式过时三个部分合在一起，恰好解释了例子为什么放在这里。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用旧磁盘取文件说明载体留下但格式过时可使记录中断。\u003c/p>\n\u003cp>本项最终仍要根据“not the information itself”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. the inconvenience of storing information on analog devices\u003c/h3>\n\u003cblockquote>\n\u003cp>在模拟设备上存储信息不方便\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D的 analog devices 指模拟设备，第4段 a digital object 明确把讨论对象设为数字物件，ZIP磁盘随后就是具体例子，因此回到段首看例子所属于哪种形式。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文的 a digital object 规定这里讨论数字信息的载体，ZIP例子中的问题又是怎样取出既存文件。D的 analog devices 却把设备类别改成模拟形式，并把读取旧文件的困难改成存入信息的不便。原段最后明确以digital replaces analog区分两类，更不能将当前的数字例子塞回analog一边。\u003c/p>\n\u003cp>D同时换了设备类别和具体动作，数字与模拟、取出与存入都没有保留。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself.\u003c/p>\n\u003cp>Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this?\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>引用ZIP磁盘这个例子，是为了说明在模拟设备上存储信息不方便。\u003c/p>\n\u003c/blockquote>\n\u003cp>D的 analog devices 指模拟设备，第4段 a digital object 明确把讨论对象设为数字物件，ZIP磁盘随后就是具体例子，因此回到段首看例子所属于哪种形式。\u003c/p>\n\u003cp>原文的 a digital object 规定这里讨论数字信息的载体，ZIP例子中的问题又是怎样取出既存文件。D的 analog devices 却把设备类别改成模拟形式，并把读取旧文件的困难改成存入信息的不便。原段最后明确以digital replaces analog区分两类，更不能将当前的数字例子塞回analog一边。\u003c/p>\n\u003cp>D同时换了设备类别和具体动作，数字与模拟、取出与存入都没有保留。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself.\u003c/p>\n\u003cp>Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this?\u003c/p>\n\u003cp>作者先区分载体与信息，再指出格式过时使对象无用。磁盘仍在却无法取出文件，将这一区分具体化；末句因此强调持续迁移，避免历史记录在数字转型处中断。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：用旧磁盘取文件说明载体留下但格式过时可使记录中断。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The ZIP example demonstrates how inconvenient it is to put information onto analog devices.\u003c/p>\n\u003cp>ZIP磁盘的例子说明将信息存入模拟设备很不方便。\u003c/p>\n\u003c/blockquote>\n\u003cp>段首明确是digital object，例中问的是取出已有files。D同时把数字改为模拟、读取改为存入，不能用devices和information两个共有词掩盖对象与动作的双重错换。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Keeping digital historical records is a challenge.\u003cbr>保存数字历史记录是一项挑战。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>数字保存的挑战不限于保住载体，还在于未来能否读取信息。ZIP例子应具体展示这种风险；至于迁移是否可行或操作手段是否特殊，主旨不能替原文作出额外断言。\u003c/p>\n\u003c/blockquote>\n\u003cp>但D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the inconvenience of storing information on analog devices\u003cbr>在模拟设备上存储信息不方便\u003c/p>\n\u003c/blockquote>\n\u003cp>D同时换了设备类别和具体动作，数字与模拟、取出与存入都没有保留。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：用旧磁盘取文件说明载体留下但格式过时可使记录中断。\u003c/p>\n\u003cp>本项最终仍要根据“not the information itself”这处局部原文判断。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>39题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>39. C. the possibility of losing information in obsolete formats\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原因是格式过时，未写采用特殊提取手段。\u003c/p>\n\u003cp>B：缺少迁移会有风险，不能推出迁移无法实施。\u003c/p>\n\u003cp>C：载体存在而旧格式无法读取，正是信息可能丧失的例证。\u003c/p>\n\u003cp>D：数字载体被换成模拟设备，读取被换成存入。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：有形文物的持久性\u003c/strong>（段落1问题引入） 古董店的文物：（照片 + 信件 + 1964-65世界博览会宣传册） → 看似短暂却持续存在：（几十年甚至几个世纪） → 原因：【它们是有形的（tangible）】\u003c/p>\n\u003cp>↓（对比引出核心问题）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：数字信息的脆弱性与保存悖论\u003c/strong>（段落2问题深化） 提出问题：（数字信息的生命周期？） → 历史对比：【千年来的知识传承：（依赖幸存的文物 + 尽管创造者忽视 + 物品本身即媒介）】→ 传统保存模式：（图书馆和档案馆承担责任） → 数字化带来的矛盾：（全球访问便利 // 但产生大海捞针问题）\u003c/p>\n\u003cp>↓（深入分析现实困境）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：数字时代的保存危机\u003c/strong>（段落3危机揭示） 图书管理员的困境：【无私奉献反被误解：（用户认为&quot;手机里什么都有&quot; → 图书馆不再重要）】→ 关键问题：（谁使普遍访问成为可能？ + 如何维持？ + 谁策划保存？） → 可怕现实：【原生数字信息：（如果不是图书管理员和档案管理员 → 无人保存）】→ 核心观点：（数字信息需要更多照料）\u003c/p>\n\u003cp>→（具体问题说明）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：技术过时带来的噩梦\u003c/strong>（段落4技术挑战） 保存的假象：（保存载体 ≠ 保存信息） → 技术过时问题：【格式过时 → 对象无用（如ZIP磁盘）】→ 历史学家的噩梦：（没有持续迁移 → 历史记录在数字化时代戛然而止）\u003c/p>\n\u003cp>↑（解决方案与希望）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：图书管理员的使命与希望\u003c/strong>（段落5结论展望） 现状承认：（全面解决方案尚不存在 + 共享历史学家的恐惧） // 但存在希望：【众多图书管理员致力于：（发现 + 组织 + 保存数字信息）】→ 独特优势：（理解用户如何寻找和使用信息） → 核心作用：（识别、保存、提供可访问性） → 最终愿景：（数字领域虽充满挑战 // 但并非不可能）\u003c/p>\n\u003cp>↑（总体评价）\u003c/p>\n\u003cp>\u003cstrong>全文核心观点：\u003c/strong> 数字时代带来了信息保存的根本性挑战：与能够自然存续的有形文物不同，数字信息需要持续的、有意识的保存努力。虽然数字化带来了前所未有的访问便利，但也造成了保存危机——格式过时、载体失效、缺乏系统性保存。图书管理员和档案管理员在这个危机中扮演着关键角色，他们是连接过去与未来的桥梁，确保数字时代的历史记录不会断层。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Preserve the context as well as the content\u003c/p>\n\u003cp>B. Do not confuse survival with a preservation plan\u003c/p>\n\u003cp>C. Replace preservation with more digitisation\u003c/p>\n\u003cp>D. Plan for readers whose questions are not yet known\u003c/p>\n\u003cp>E. Make the work behind easy access visible\u003c/p>\n\u003cp>F. Treat easy access as proof that libraries are redundant\u003c/p>\n\u003cp>G. Keep the information usable, not just the carrier intact\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>An old letter may reach a researcher because someone kept a drawer of papers through several house moves. Its survival is valuable, but it does not show that all comparable letters were safe. The missing ones are absent from the very collection being examined. Nor does the survival of this sheet prove that later records will endure without attention. The example demonstrates a possibility, not a reliable method. A preservation policy must ask what conditions made the letter readable and how those conditions can be maintained or replaced for materials that do not share its physical form.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>A disk can remain neatly labelled on a shelf long after the files it holds become difficult to read. The difficulty may lie neither in a broken case nor in a missing object. The equipment or software needed to interpret its format may no longer be available. Keeping the physical carrier is therefore only one part of the task. Staff must also consider how the information can be transferred into a usable environment and checked after that transfer. Preservation succeeds for a future reader when the record can be used, not merely when someone can point to the object that once contained it.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>A reader taps a phone and retrieves a document within seconds. It is tempting to attribute the result entirely to the device. Yet the document had to be selected, described and placed in a system that someone continues to maintain. The easier the service becomes, the less visible these activities may be. That invisibility can lead users to imagine that the institution behind the screen has become unnecessary. Explaining the steps behind a successful search does not diminish the convenience. It shows why the convenience depends on sustained work rather than on information simply being everywhere by itself.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>Opening a file is not always enough to understand it as evidence. A photograph without a date or a record of its source may be easy to view but hard to place in history. A preserved conversation may also lose meaning if its messages are separated from the exchange that linked them. For this reason, an archive needs descriptions and relationships as well as files. Notes about where a record came from and what was done to it help later readers judge what they are seeing. Technical readability and historical intelligibility support each other, but they are not the same achievement.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>No archive can retain every object, every version and every possible description with equal care. Choices are unavoidable, but the interests of present users are not a complete guide to future value. A record that seems minor today may answer a question that has not yet been asked. This uncertainty is a reason to document selection decisions and keep them open to reconsideration, rather than a reason to abandon selection altogether. Planning for future readers requires both practical limits and intellectual humility: enough order to make an archive usable, and enough awareness that later questions may differ from our own.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>【答案】B. Do not confuse survival with a preservation plan\u003c/p>\n\u003cblockquote>\n\u003cp>不要把偶然存留当成保存方案\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分借旧信件的幸存解释过去记录怎样偶然留下，再强调观察到幸存者并不能证明有形材料安全或保存工作可以省略。\u003c/p>\n\u003cp>旧信件证明的首先是什么？\u003c/p>\n\u003cblockquote>\n\u003cp>someone kept a drawer of papers\u003c/p>\n\u003c/blockquote>\n\u003cp>记录可能因有人保留抽屉中的纸张而留下，说明一次具体存留的条件。这里没有证明所有同类信件都被保护，也没有把这种偶然经历提升成制度方法。\u003c/p>\n\u003cp>为什么不能只看留存的收藏？\u003c/p>\n\u003cblockquote>\n\u003cp>The missing ones are absent from the very collection being examined.\u003c/p>\n\u003c/blockquote>\n\u003cp>消失的信件不会进入我们正在观察的集合。因此眼前有许多旧信件，仍不能单独支持所有有形材料都安全的结论，作者补上了样本看不见的另一面。\u003c/p>\n\u003cp>最后把例子用于什么工作？\u003c/p>\n\u003cblockquote>\n\u003cp>a possibility, not a reliable method\u003c/p>\n\u003c/blockquote>\n\u003cp>偶然幸存只说明可以留下，方案则要说明条件能否维持或替代。末句将这些条件转向物理形式不同的材料，为数字保存引出更明确的任务。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>一封旧信偶然存留 → 未存留者无法进入观察 → 可能留下不等于可靠方法 → 保存政策须识别并维持可读条件。\u003c/p>\n\u003c/blockquote>\n\u003cp>survival指眼前这封信留下来的事实，preservation plan指可重复依靠的保存安排。Do not confuse强调事实证据支持的范围：承认幸存的价值，同时拒绝以单个结果替代对长期条件的安排。\u003c/p>\n\u003cp>再看最强干扰项C：Replace preservation with more digitisation。\u003c/p>\n\u003cp>“用更多数字化代替保存”看似能回答不同物理形式该怎样处理，但本文没有提出扫描更多信件，更没有说生成数字副本即可省掉照料。它要求检查可读条件，恰是保存方案需要继续解决的问题。\u003c/p>\n\u003cp>\u003cstrong>41题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>【答案】G. Keep the information usable, not just the carrier intact\u003c/p>\n\u003cblockquote>\n\u003cp>不仅保住载体，还要让信息可用\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分区分介质完好和信息能够读出，指出数字保存需要同时维持文件与解释文件的技术条件。\u003c/p>\n\u003cp>先看物件存在与读取的反差。\u003c/p>\n\u003cblockquote>\n\u003cp>long after the files it holds become difficult to read\u003c/p>\n\u003c/blockquote>\n\u003cp>磁盘可以在文件已难读取后继续留在架上，说明两种存续不是同一回事。标签整齐也不能替代读取检验，这是段落立论的具体情境。\u003c/p>\n\u003cp>困难可能在哪里？\u003c/p>\n\u003cblockquote>\n\u003cp>interpret its format\u003c/p>\n\u003c/blockquote>\n\u003cp>读取需要设备或软件解释格式，当这种环境不再可得，外壳没有破损也可能取不出内容。作者明确把问题从物理存在推进到技术可解释性。\u003c/p>\n\u003cp>最后用什么标准判断成功？\u003c/p>\n\u003cblockquote>\n\u003cp>when the record can be used\u003c/p>\n\u003c/blockquote>\n\u003cp>未来读者真正需要使用记录，所以转移到可用环境后还要检查。指得出旧物只是保住载体，能使用才满足本段对信息保存的要求。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>磁盘仍在而文件难读 → 读取环境可能消失 → 保存载体只是部分任务 → 转移并检查信息，使未来读者仍可使用。\u003c/p>\n\u003c/blockquote>\n\u003cp>carrier intact概括磁盘外壳与对象仍然存在，information usable则要求格式能被解释、转移后还能使用。标题的not just保留载体保存的作用，同时说明它不足以独立完成全部任务。\u003c/p>\n\u003cp>再看最强干扰项A：Preserve the context as well as the content。\u003c/p>\n\u003cp>“同时保存语境”同样关心记录是否有用，但本段没有作者身份、出处或文件之间的关系。其障碍是软件和设备不再支持格式，解决的是能否读出；下一层如何解释记录的历史语境不能代替这一技术问题。\u003c/p>\n\u003cp>\u003cstrong>42题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>【答案】E. Make the work behind easy access visible\u003c/p>\n\u003cblockquote>\n\u003cp>让便利获取背后的劳动被看见\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分追溯手机点击之前的收集、整理和维护，说明用户看不见劳动正是便利可能造成低估的原因。\u003c/p>\n\u003cp>手机例子引出哪种归因？\u003c/p>\n\u003cblockquote>\n\u003cp>attribute the result entirely to the device\u003c/p>\n\u003c/blockquote>\n\u003cp>用户可能把瞬间检索完全归功于手机，entirely使这种认识遗漏了其他必要条件。作者要纠正的是结果归因，而不是否认手机能够提供便捷入口。\u003c/p>\n\u003cp>Yet之后补出哪些被省略的工作？\u003c/p>\n\u003cblockquote>\n\u003cp>selected, described and placed in a system\u003c/p>\n\u003c/blockquote>\n\u003cp>资料需要筛选、描述并进入系统，还需要持续维护。这串动作解释结果怎样成为可能，不能仅以“信息已经在网上”替代具体劳动。\u003c/p>\n\u003cp>结尾为什么要解释检索背后的步骤？\u003c/p>\n\u003cblockquote>\n\u003cp>depends on sustained work\u003c/p>\n\u003c/blockquote>\n\u003cp>讲出后台劳动，是说明便利的持续依赖关系。作者同时说并不减损便利，表示希望用户理解服务条件，而不是退回难以访问的旧方式。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>手机检索造成全部归功设备的诱惑 → 补出资料处理和维护 → 越便利越可能看不见机构 → 解释持续劳动以纠正低估。\u003c/p>\n\u003c/blockquote>\n\u003cp>easy access是开头数秒取得文件的体验，work behind it是筛选、描述、入库和维护。Make…visible对应结尾解释检索步骤，直接针对看不见劳动而误以为机构无用这一因果。\u003c/p>\n\u003cp>再看最强干扰项F：Treat easy access as proof that libraries are redundant。\u003c/p>\n\u003cp>“以便利证明图书馆多余”几乎复述用户的表面想法，因此具有迷惑性。但本文把这种想法归因于劳动invisibility，并以Yet和depends纠正它；标题不能把被作者解释和反驳的误解当成作者结论。\u003c/p>\n\u003cp>\u003cstrong>43题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>【答案】A. Preserve the context as well as the content\u003c/p>\n\u003cblockquote>\n\u003cp>同时保存内容及其语境\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分把可打开文件推进到可理解证据，说明作者、日期、关联与处理记录为什么也需要保存。\u003c/p>\n\u003cp>开头把什么与什么区分？\u003c/p>\n\u003cblockquote>\n\u003cp>Opening a file is not always enough\u003c/p>\n\u003c/blockquote>\n\u003cp>文件打开只解决技术读取，作为证据理解还需要额外信息。这一句承接数字可读性的讨论，再明确提出本段的新层次，不能理解成反对打开或迁移文件。\u003c/p>\n\u003cp>两个例子缺少的分别是什么？\u003c/p>\n\u003cblockquote>\n\u003cp>without a date or a record of its source\u003c/p>\n\u003c/blockquote>\n\u003cp>照片缺日期、来源就难放回历史；谈话消息脱离交换关系也会失去意义。二者都不是文件内容全消失，而是内容外围的定位与关联不完整。\u003c/p>\n\u003cp>因此档案还应保存什么？\u003c/p>\n\u003cblockquote>\n\u003cp>descriptions and relationships as well as files\u003c/p>\n\u003c/blockquote>\n\u003cp>描述包括来源和处理经过，关系包括消息在交流中的位置。as well as要求与文件一起保存，末句再确认技术可读和历史可理解彼此支持但不等同。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>能打开不等于能作证据理解 → 日期来源与关联缺失会减损意义 → 保存描述和关系 → 同时维持可读性与历史可理解性。\u003c/p>\n\u003c/blockquote>\n\u003cp>content对应照片、消息和文件内的内容，context包括日期、来源、关联及处理记录。as well as强调不是用语境替代内容，而是补足内容作为历史证据所需的解释条件。\u003c/p>\n\u003cp>再看最强干扰项G：Keep the information usable, not just the carrier intact。\u003c/p>\n\u003cp>“让信息可用而不只保住载体”是相邻且较强的选择，因为两段都谈usefulness。但本段开头已假定文件能打开，关键不足转为日期、来源和消息关联；若只概括读取环境，会漏掉三个具体语境线索。\u003c/p>\n\u003cp>\u003cstrong>44题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>【答案】D. Plan for readers whose questions are not yet known\u003c/p>\n\u003cblockquote>\n\u003cp>为问题尚未知晓的未来读者作准备\u003c/p>\n\u003c/blockquote>\n\u003cp>这一部分承认保存选择不可避免，再要求考虑未来读者可能提出的新问题，记录选择理由并保留复核空间。\u003c/p>\n\u003cp>先承认什么限制？\u003c/p>\n\u003cblockquote>\n\u003cp>Choices are unavoidable\u003c/p>\n\u003c/blockquote>\n\u003cp>无法对每个对象和版本同等精细照料，因此选择不能被完全取消。作者不是提出无限保存承诺，而是在资源限制之内讨论怎样作决定。\u003c/p>\n\u003cp>当下用户为什么不能代表未来？\u003c/p>\n\u003cblockquote>\n\u003cp>a question that has not yet been asked\u003c/p>\n\u003c/blockquote>\n\u003cp>今天看来次要的记录可能回答尚未提出的问题，说明未来价值存在未知。这里不是保证每份小材料都会重要，而是限制当下偏好的预测能力。\u003c/p>\n\u003cp>面对未知应怎么做？\u003c/p>\n\u003cblockquote>\n\u003cp>document selection decisions and keep them open to reconsideration\u003c/p>\n\u003c/blockquote>\n\u003cp>把选择依据记录下来并允许复核，既保留必要秩序，也避免将今天的判断永久封死。结尾的humility因此落实为可检查、可调整的保存安排。\u003c/p>\n\u003cp>这一部分的推进关系是：\u003c/p>\n\u003cblockquote>\n\u003cp>保存资源有限必须选择 → 当前兴趣不足以预知未来问题 → 记录并允许复核选择 → 在可用秩序和未来开放性之间作准备。\u003c/p>\n\u003c/blockquote>\n\u003cp>readers whose questions are not yet known指未来使用者及未知研究问题，Plan则对应记录选择依据、保留复核和维持可用秩序。标题涵盖为什么要谦逊以及这种谦逊怎样变成具体安排。\u003c/p>\n\u003cp>再看最强干扰项C：Replace preservation with more digitisation。\u003c/p>\n\u003cp>“用更多数字化代替保存”好像能回应资源有限，却既未解决选择标准，也未回答未来问题未知。复制得更多不等于知道保什么、为何保，段落提出的是记录与复核决定，而不是用扫描数量取代长期安排。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>An old photograph can survive several generations and still reveal faces and places to a later viewer. Its continued presence makes it tempting to imagine that historical records simply wait until someone wants them. But that lesson cannot be transferred unchanged to a file on an ageing disk. The digital record deserves a different question.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Limited resources make selection unavoidable. Archivists must decide which records and which accompanying descriptions deserve particular attention. Today&#39;s popular subjects offer one guide, but they cannot predict every future use. Some apparently minor documents may become valuable when new questions arise, leaving the interests of future users partly unknown.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Those unknown users are still part of an archive&#39;s responsibility. Staff can record why selections were made, preserve enough context to support other interpretations and revisit decisions when circumstances change. Such practices do not promise a perfect collection. They turn concern for future readers into a continuing institutional commitment rather than a claim that one technical fix will suffice.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself. Equipment, software and a recognised format must work together. When that environment disappears, keeping the object does not keep access. Records therefore need continuing movement into supported forms, accompanied by checks that the information has survived the move.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>This continuing migration is active preservation rather than a one-time act of storage. It requires people to identify a problem, arrange a transfer and verify the result. Verification, however, cannot stop at whether a file opens. A record&#39;s meaning may depend on details that its visible contents alone cannot supply.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>The question is not only whether the disk will remain, but whether its contents will remain readable. A labelled object on a shelf may look safely preserved while offering no usable record to a researcher. To understand that gap, we must ask how a perfectly present carrier can nevertheless cease to deliver its information.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>Those details include the record&#39;s date, its source and its relationship to other records. A message removed from its conversation may be readable without being understandable. Preserving descriptions and connections helps prevent that loss of meaning. Yet doing this for every surviving file would demand resources no institution can assume it will always possess.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>That commitment helps explain why easy access does not make libraries and archives unnecessary. A convenient search is the visible outcome of choices, technical maintenance and descriptive work that users may never notice. None removes every preservation difficulty. Together, however, they help keep future research possible when the original objects and technologies no longer explain themselves.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cp>A、E、H三个位置已经给出，剩余五空须同时满足前后衔接。先看各段在做什么：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>由旧照片存留转向数字记录，并提出需要更换问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>由资源有限引出选择，并承认未来用户兴趣无法完全预知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>把对未知读者的责任落实为记录、保留语境和复核选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>解释读取环境依赖，并提出持续迁移和检验的需要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>将迁移界定为持续工作，并把检验推进到记录意义\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>区分载体留存与内容可读，并追问两者何以分离\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>说明日期、来源和关联的作用，再引出资源约束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>总结便利获取背后的持续工作及其保留未来研究可能性的作用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由旧照片存留转向数字记录，并提出需要更换问题 → 区分载体留存与内容可读，并追问两者何以分离 → 解释读取环境依赖，并提出持续迁移和检验的需要 → 将迁移界定为持续工作，并把检验推进到记录意义 → 说明日期、来源和关联的作用，再引出资源约束 → 由资源有限引出选择，并承认未来用户兴趣无法完全预知 → 把对未知读者的责任落实为记录、保留语境和复核选择 → 总结便利获取背后的持续工作及其保留未来研究可能性的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → F → D → E → G → B → C → H\u003c/strong>\u003c/p>\n\u003cp>41—45：F、D、G、B、C。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41题在A与已知E之间，是全文第2段的位置。它与紧邻两段形成A → F → D的关系。\u003c/p>\n\u003cp>先看前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The digital record deserves a different question.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The question is not only whether the disk will remain, but whether its contents will remain readable.\u003c/p>\n\u003c/blockquote>\n\u003cp>A从旧照片转向老磁盘，最后明确说数字记录需要不同的问题。本段The question立刻补全：不仅问磁盘会不会留下，还问内容能否读取。这是在更换评价对象，不能先跳到档案选择或读者兴趣。\u003c/p>\n\u003cp>整齐贴标签的物件与没有可用记录形成反差，具体说明物理留存和信息可读的间隙。结尾再问完好载体为什么不能传递信息，把现象转化为后面需要解释的机制。\u003c/p>\n\u003cp>F段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>To understand that gap, we must ask how a perfectly present carrier can nevertheless cease to deliver its information.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段以carrier can…cease to deliver收尾，后段A carrier can fail in this way接住同一种失效，再解释设备、软件、格式的共同依赖。现象提问—技术原因的回答，是这一空与下一空的双向关系。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>由旧照片存留转向数字记录，并提出需要更换问题 → 区分载体留存与内容可读，并追问两者何以分离 → 解释读取环境依赖，并提出持续迁移和检验的需要\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选D。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself.\u003c/p>\n\u003c/blockquote>\n\u003cp>解释技术环境的候选也能回应A的磁盘，但其in this way需要先有“载体在而信息不可读”这一具体失效现象。A只说数字记录要另问问题，尚未陈述这种间隙；直接插入会跳过问题的展开。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42题在A与已知E之间，是全文第3段的位置。它与紧邻两段形成F → D → E的关系。\u003c/p>\n\u003cp>先看前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>To understand that gap, we must ask how a perfectly present carrier can nevertheless cease to deliver its information.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A carrier can fail in this way because reading digital information depends on an environment beyond the carrier itself.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段问完好的载体何以不传递信息，本段because给出原因，in this way回指物件存在却不可读。设备、软件和格式三项条件，具体解释为什么数字文件不同于只看物件是否还在的判断。\u003c/p>\n\u003cp>本段从读取依赖环境推到环境消失，再推出持续转入受支持形式的需要。末尾还要求检查信息是否经受住转移，说明迁移不是简单搬动物件，而是维护可读性的过程。\u003c/p>\n\u003cp>D段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Records therefore need continuing movement into supported forms, accompanied by checks that the information has survived the move.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>This continuing migration is active preservation rather than a one-time act of storage.\u003c/p>\n\u003c/blockquote>\n\u003cp>固定E以This continuing migration回指这里的continuing movement into supported forms，再界定为持续保存工作。E后半继续发展checks为verification，词义和任务均连续，不能用只谈历史价值的段落接入。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>区分载体留存与内容可读，并追问两者何以分离 → 解释读取环境依赖，并提出持续迁移和检验的需要 → 将迁移界定为持续工作，并把检验推进到记录意义\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选G。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those details include the record&#39;s date, its source and its relationship to other records.\u003c/p>\n\u003c/blockquote>\n\u003cp>日期与来源的候选同样说明信息可能失用，但Those details需要前面已提出可见内容之外的细节，A之后的两段尚无此项。放在这里既不能解释设备和格式失效，也无法为E的continuing migration提供最近先行事件。\u003c/p>\n\u003cp>\u003cstrong>42题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43题在已知E与H之间，是全文第5段的位置。它与紧邻两段形成E → G → B的关系。\u003c/p>\n\u003cp>先看前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>A record&#39;s meaning may depend on details that its visible contents alone cannot supply.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those details include the record&#39;s date, its source and its relationship to other records.\u003c/p>\n\u003c/blockquote>\n\u003cp>固定E末句指出记录意义依赖可见内容本身不给出的details，本段Those details立即列日期、来源和与其他记录的关系。它回答的是意义缺少什么，而非重复文件怎样打开的技术层次。\u003c/p>\n\u003cp>谈话消息被抽离交流的例子说明“读得见字”仍可能“不懂它的意思”，描述与关系因此成为保存对象。Yet随后把这一工作放到资源限制之下，准备从应做什么转入如何选择投入。\u003c/p>\n\u003cp>G段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet doing this for every surviving file would demand resources no institution can assume it will always possess.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Limited resources make selection unavoidable.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段以不能假定机构永远拥有足够资源收尾，后段Limited resources直接承接并推出selection unavoidable。资源有限与必须选择是相邻因果，不能在其间插入另一个技术解决办法。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>将迁移界定为持续工作，并把检验推进到记录意义 → 说明日期、来源和关联的作用，再引出资源约束 → 由资源有限引出选择，并承认未来用户兴趣无法完全预知\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选B。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Limited resources make selection unavoidable.\u003c/p>\n\u003c/blockquote>\n\u003cp>讨论选择的候选与资源有关，但固定E尚未提出资源缺口，末句问的是哪些细节决定意义。若先放Limited resources，会漏答details，并让描述和关联为何值得保存缺少展开，选择便失去具体对象。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44题在已知E与H之间，是全文第6段的位置。它与紧邻两段形成G → B → C的关系。\u003c/p>\n\u003cp>先看前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Yet doing this for every surviving file would demand resources no institution can assume it will always possess.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Limited resources make selection unavoidable.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段刚说无法对每个文件的细节长期投入无限资源，本段Limited resources make selection unavoidable概括其直接后果。选择的对象仍是记录和附随描述，保留了前段已解释的内容与语境两项任务。\u003c/p>\n\u003cp>本段先承认当前热门主题可作参考，再用but限制其预测未来用途的能力。看似次要文件可能回答新问题，说明不能将今日需求永久固定为唯一筛选标准，未知由此成为后面的责任问题。\u003c/p>\n\u003cp>B段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>Some apparently minor documents may become valuable when new questions arise, leaving the interests of future users partly unknown.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those unknown users are still part of an archive&#39;s responsibility.\u003c/p>\n\u003c/blockquote>\n\u003cp>结尾的future users partly unknown被后段Those unknown users接住。前段提出我们不知道全部未来兴趣，后段回答即便不知道也应怎样为他们负责，逻辑从知识限制转到可实施安排。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>说明日期、来源和关联的作用，再引出资源约束 → 由资源有限引出选择，并承认未来用户兴趣无法完全预知 → 把对未知读者的责任落实为记录、保留语境和复核选择\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选C。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>Those unknown users are still part of an archive&#39;s responsibility.\u003c/p>\n\u003c/blockquote>\n\u003cp>直接谈未知用户责任的候选似乎也能接资源限制，但unknown users尚未出现，就没有为何未知、未知什么的说明。把它提前会先给记录决定和复核的方案，后面再补未来问题难预测的原因，倒置了本处问题与回应。\u003c/p>\n\u003cp>\u003cstrong>44题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45题在已知E与H之间，是全文第7段的位置。它与紧邻两段形成B → C → H的关系。\u003c/p>\n\u003cp>先看前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Some apparently minor documents may become valuable when new questions arise, leaving the interests of future users partly unknown.\u003c/p>\n\u003c/blockquote>\n\u003cp>再看候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those unknown users are still part of an archive&#39;s responsibility.\u003c/p>\n\u003c/blockquote>\n\u003cp>前段承认未来用户兴趣部分未知，本段Those unknown users原样回指，并以still说明未知不取消机构责任。于是作者没有从不可预测跳到放弃保存，而是寻找在不完全知识下仍可承担的工作。\u003c/p>\n\u003cp>记录为何选择、保留解释语境、条件变化时复核，三项措施分别使决定可追溯、使用可扩展、选择可调整。随后明确不保证完美收藏，避免将有限措施夸大成已经解决全部保存问题。\u003c/p>\n\u003cp>C段最终落在：\u003c/p>\n\u003cblockquote>\n\u003cp>They turn concern for future readers into a continuing institutional commitment rather than a claim that one technical fix will suffice.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>That commitment helps explain why easy access does not make libraries and archives unnecessary.\u003c/p>\n\u003c/blockquote>\n\u003cp>本段末尾将这些实践归为continuing institutional commitment，固定H用That commitment承接，解释便利检索为何不使档案机构多余。持续责任经由具体劳动变成用户看到的便利，结论因此有前文机制支撑。\u003c/p>\n\u003cp>这三段的局部推进是：\u003c/p>\n\u003cblockquote>\n\u003cp>由资源有限引出选择，并承认未来用户兴趣无法完全预知 → 把对未知读者的责任落实为记录、保留语境和复核选择 → 总结便利获取背后的持续工作及其保留未来研究可能性的作用\u003c/p>\n\u003c/blockquote>\n\u003cp>再检验容易混淆的候选F。它的开头是：\u003c/p>\n\u003cblockquote>\n\u003cp>The question is not only whether the disk will remain, but whether its contents will remain readable.\u003c/p>\n\u003c/blockquote>\n\u003cp>区分磁盘与内容的候选也涉及未来研究者，但它仍在提出最初的可读性疑问，未形成机构持续责任的安排。放在H前会让That commitment缺少对应行为，并在结论之前突然重启已经解释过的载体问题。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>a sense of dedication\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：责任感、奉献精神\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>long-term thinking\u003c/td>\n\u003ctd>长远思维\u003c/td>\n\u003ctd>人生哲理类：延迟满足、具有远见\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>intellectual curiosity\u003c/td>\n\u003ctd>求知欲\u003c/td>\n\u003ctd>人生哲理类：好奇、求知\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>access to information\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>获取信息\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会生活类：获取信息的方式\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>digital preservation\u003c/td>\n\u003ctd>数字保存\u003c/td>\n\u003ctd>经济消费类：科技发展\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>public cultural services\u003c/td>\n\u003ctd>公共文化服务\u003c/td>\n\u003ctd>教育文化类：学习生活\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>reading resources\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>阅读资源\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>教育文化类：阅读\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cultural exchange\u003c/td>\n\u003ctd>文化交流\u003c/td>\n\u003ctd>教育文化类：文化交流\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>educational opportunities\u003c/td>\n\u003ctd>教育机会\u003c/td>\n\u003ctd>教育文化类：学习生活\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>In the picture, A holds up B as evidence of C.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图中，A举起B，将其视为C的证据。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The picture places an old object beside its digital counterpart.\u003c/td>\n\u003ctd>图中把旧物与其数字版本并列呈现。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene shows A looking helplessly at B.\u003c/td>\n\u003ctd>画面呈现A无助地看着B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The chart compares access to A in X and Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图表比较了X和Y中获取A的情况。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Over the period, digital forms of A gradually replaced traditional ones.\u003c/td>\n\u003ctd>这段时期，数字形式的A逐渐取代传统形式。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The proportion of people using A rose from X percent to Y percent.\u003c/td>\n\u003ctd>使用A的人群比例从X%升至Y%。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage raises the question of how A can be preserved for the future.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>材料提出了如何为未来保存A的问题。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The writer distinguishes keeping an object from retaining the information it carries.\u003c/td>\n\u003ctd>作者区分了保住物件与保住其中信息。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The passage describes a continuing challenge and the efforts being made to address it.\u003c/td>\n\u003ctd>材料描述了一项持续存在的挑战及应对它的努力。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":6},{"label":"句内逻辑","index":26},{"label":"长难句手译","index":29},{"label":"第三鸟 · 题目复盘","index":48},{"label":"40题","index":49},{"label":"36题","index":59},{"label":"37题","index":77},{"label":"38题","index":95},{"label":"39题","index":113},{"label":"第四鸟 · 新题型","index":131},{"label":"小标题题","index":131},{"label":"排序题","index":137},{"label":"第五鸟 · 写作积累","index":143}];
const allIndices = [0,1,2,3,4,5,9,13,17,21,25,26,27,28,29,35,41,47,48,49,51,53,55,57,58,59,63,67,71,75,76,77,81,85,89,93,94,95,99,103,107,111,112,113,117,121,125,129,130,131,132,133,134,135,136,137,138,139,140,141,142,143,144];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
 const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
 const top=rightScroll.scrollTop+er.top-sr.top;
 const target=height<=view-2*margin?top+height/2-view/2:top-margin;
 rightScroll.scrollTop=clampScroll(target,rightScroll.scrollHeight-view);
}
function positionRight(st,token,restore){
 guardedSchedule(token,()=>{
  if(isLongSentenceCumulative(st)){
   positionLongSentence(st);
   if(!restore)return;
  }
  if(restore){
   rightScroll.scrollTop=saved.right;
   window.scrollTo(0,saved.win);
   return;
  }
  if(!st.meta.cumulative||st.meta.partIndex===0){rightScroll.scrollTop=0;return;}
  const el=document.getElementById(st.focusId);
  if(!el)return;
  if(isParagraphCumulative(st)){
   // Match the sample: no artificial tail; real content height limits the scroll.
   const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const top=rightScroll.scrollTop+er.top-sr.top;
   rightScroll.scrollTop=clampScroll(top-34,rightScroll.scrollHeight-rightScroll.clientHeight);
   return;
  }
  // A short final layer still needs enough trailing room to bring its heading into view.
  const tail=rightContent.querySelector('.longScrollTail');
  if(tail)tail.style.minHeight=Math.max(420,rightScroll.clientHeight*.9-el.offsetHeight)+'px';
  const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
  const top=rightScroll.scrollTop+er.top-sr.top;
  rightScroll.scrollTop=latestTarget(top,rightScroll.clientHeight,rightScroll.scrollHeight-rightScroll.clientHeight);
 });
}
function render(options={}){
 const token=++renderToken; // stale image and scroll callbacks may never reset a newer step
 document.body.classList.toggle('allMode',all);
 toggleAll.classList.toggle('active',all);
 toggleAll.textContent=all?'返回交互':'显示全部';
 if(all){
  layout.className='layout single';leftPanel.hidden=true;
  rightContent.innerHTML='<div class="fullContent">'+FULL+'</div>';
  hydrateAssets(rightContent);rightScroll.scrollTop=0;
  progress.textContent='全文';
  prev.disabled=next.disabled=reset.disabled=jump.disabled=true;
  return;
 }
 const st=DATA[idx],previous=lastRenderedIdx<0?null:DATA[lastRenderedIdx];
 const sameGroup=previous&&st.meta.cumulative&&previous.meta.cumulative&&st.meta.cumulativeGroup===previous.meta.cumulativeGroup;
 reset.disabled=jump.disabled=false;prev.disabled=idx===0;next.disabled=idx===DATA.length-1;
 progress.textContent=(idx+1)+' / '+DATA.length;
 if(st.context){
  layout.className='layout split';leftPanel.hidden=false;
  renderContext(st.context,token,options.restore===true);
 }else{
  layout.className='layout single';leftPanel.hidden=true;

};
