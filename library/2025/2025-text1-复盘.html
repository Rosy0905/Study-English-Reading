ot;</p>\n<p><strong>第5段</strong></p>\n<p>《行动时刻》研究 → 还发现：(当对照组学生 → 依赖荒岛陈词滥调：(比如棕榈树) // 目标组学生 → &quot;更加宽广：(给出更广阔的画面：(关于天空 + 海洋 + 大气状况))&quot;)。</p>\n<p><strong>第6段</strong></p>\n<p>奥汉隆说 → 她最惊讶的是：(&quot;情感素养：(明显体现：(在[目标组]儿童的写作中)) + 他们：(&quot;在写作中更有韧性 + 更有希望&quot;))。</p>\n<p>她补充道：→ &quot;情感理解 → 非常明显 + 可能与：([排练室过程]有关：(在那里你习惯于 → 尝试通过想象找到出路))。</p>\n<p>他们很舒适：(在描述不同的情感状态) + 你所做的一部分：(在戏剧中) → 是把自己：(放在不同的处境中)。&quot;</p>\n<p>研究显示了 → 嵌入的重要性：(艺术在教育中) → 她说。</p>\n<p><strong>第7段</strong></p>\n<p>但这些结果能否 → 被复制：(用任何其他老剧作家)？</p>\n<p>奥汉隆说 → 需要更多研究 // 但她提出：(莎士比亚使用：(20,000个词汇)：(相比日常的2,000个词汇) → 给予了&quot;大规模扩展：(语言的)：(进入儿童的生活)&quot;)：(这与：(儿童：(&quot;使用他们的整个身体：(来让词语活起来)&quot;))相结合)。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第3段第1句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot;</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>The randomised control trial / involved hundreds of year 5 pupils - / aged nine and ten - / at 45 state primary schools / that had not been / &quot;previously exposed to RSC pedagogy.&quot;</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>随机对照试验 / 涉及数百名五年级学生 - / 九岁和十岁的 - / 在45所公立小学 / 之前没有 / &quot;接触过RSC教学法&quot;的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>破折号说明五年级学生年龄，that引出此前未接触RSC教学法的限定；数字分别对应学生与学校。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>随机对照试验  涉及数百名五年级学生 -  九岁和十岁的 -  在45所公立小学  之前没有  &quot;接触过RSC教学法&quot;的。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>随机对照试验涉及45所小学、数百名九至十岁且未接触过该教学法的学生。</p>\n</blockquote>\n<p>先说试验及参与学生，再交代年龄、学校数量和既往接触情况。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>这项随机对照试验涉及45所公立小学的数百名五年级学生，他们年龄为九至十岁，此前没有接触过皇家莎士比亚剧团的教学法。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>had not been previously exposed否定的是此前接触教学法，不是否定学生上过学或读过所有戏剧。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>这项随机对照试验涉及45所公立小学的数百名五年级学生，他们年龄为九至十岁，此前没有接触过皇家莎士比亚剧团的教学法。</p>\n</blockquote>\n<h2>2. 第4段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>They also &quot;appear to be more comfortable writing in role. while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>They also / &quot;appear to be more comfortable / writing in role./ while [control] pupils imagine / how they themselves would react / to being shipwrecked, / [target] children put themselves / in the shoes of a literary character / and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他们还 / &quot;似乎更舒适 / 以角色写作 / 当[对照组]学生想象 / 他们自己会如何反应 / 对于遭遇海难，/ [目标组]儿童把自己 / 放在文学角色的位置上 / 并表达那个角色的情感。&quot;</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>先保留角色写作更自如的总评，再用while区分两组的立场。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>他们还  &quot;似乎更舒适  以角色写作  当[对照组]学生想象  他们自己会如何反应  对于遭遇海难， [目标组]儿童把自己  放在文学角色的位置上  并表达那个角色的情感。&quot;</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>目标组能从文学人物立场表达感情，对照组更多想象自身反应。</p>\n</blockquote>\n<p>先说目标组总体表现，再把对照组的自己与目标组的文学人物作对应。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>他们似乎也更能自如地以角色身份写作：对照组学生想象的是自己遭遇海难时会如何反应，而目标组儿童则站到文学人物的立场，表达那个人物的情感。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>put themselves in the shoes不是现实穿鞋动作，而是设身处地。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>他们似乎也更能自如地以角色身份写作：对照组学生想象的是自己遭遇海难时会如何反应，而目标组儿童则站到文学人物的立场，表达那个人物的情感。</p>\n</blockquote>\n<h2>3. 第7段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>O&#39;Hanlon said / more research would be needed / but suggested / that Shakespeare&#39;s use / of 20,000 words, / compared with the everyday 2,000 words, / gave a &quot;massive expansion / of language / into children&#39;s lives,&quot; / which was combined / with children / &quot;using their whole bodies / to bring words to life.&quot;</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>奥汉隆说 / 需要更多研究 / 但她提出 / 莎士比亚使用 / 20,000个词汇，/ 相比日常的2,000个词汇，/ 给予了&quot;大规模扩展 / 语言的 / 进入儿童的生活，&quot; / 这与 / 儿童 / &quot;使用他们的整个身体 / 来让词语活起来&quot;相结合。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>but连接保留判断与可能解释，compared with插入词汇量对照，which补充语言扩展与身体参与的结合。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>奥汉隆说  需要更多研究  但她提出  莎士比亚使用  20,000个词汇， 相比日常的2,000个词汇， 给予了&quot;大规模扩展  语言的  进入儿童的生活，&quot;  这与  儿童  &quot;使用他们的整个身体  来让词语活起来&quot;相结合。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>研究还需继续，但莎士比亚丰富词汇与身体演绎结合，拓展了儿童语言经验。</p>\n</blockquote>\n<p>先交代尚需研究，再解释词汇资源的优势，最后接上身体演绎。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>奥汉隆表示还需要更多研究，但她认为，与日常使用的两千个词相比，莎士比亚使用的两万个词极大地拓展了儿童生活中的语言，而这种拓展又与儿童调动整个身体、让词语鲜活起来的活动相结合。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>20,000与2,000比较的是莎士比亚和日常词汇，不是所有剧作家的排名。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>奥汉隆表示还需要更多研究，但她认为，与日常使用的两千个词相比，莎士比亚使用的两万个词极大地拓展了儿童生活中的语言，而这种拓展又与儿童调动整个身体、让词语鲜活起来的活动相结合。</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从21题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>21题</h2>\n<blockquote>\n<p>The “rehearsal room” approach requires pupils to ______.</p>\n<p>‘排练室’教学法要求学生做什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>活动要求理解题：分清学生亲自扮演、观看表演、改写台词与专业演员授课。</p>\n<p>题干直接给出‘rehearsal room’ approach。第2段开头有同样的教学法名称，后面又解释演员的工作方式对儿童的影响，先把第2段完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>But only if you act him out.</p>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.</p>\n</blockquote>\n<h3>A. rewrite the lines from Shakespeare</h3>\n<blockquote>\n<p>排练室教学法要求学生改写莎士比亚作品的台词。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时A尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>任务是以Ferdinand身份写漂流瓶信，戏剧活动配合选段开展；没有要求改写现成台词，A另添了写作对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nThe randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>排练室教学法要求学生改写莎士比亚作品的台词。</p>\n</blockquote>\n<p>任务是以Ferdinand身份写漂流瓶信，戏剧活动配合选段开展；没有要求改写现成台词，A另添了写作对象。</p>\n<p>act him out先给获益条件，随后用演员工作方式和角色写作任务解释怎样参与。</p>\n<p>A成立须将已有lines交给学生改写。实际让学生进入角色完成新任务，accompany表示活动配合文本，不能换成rewrite。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nThe randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.</p>\n<p>这位来自埃文河畔斯特拉特福的文法学校男孩，在学术上有了有力的一击：突破性研究显示莎士比亚确实有益儿童读写能力和情感发展，但前提是把他的作品演出来。</p>\n<p>随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。</p>\n</blockquote>\n<p>act him out先给获益条件，随后用演员工作方式和角色写作任务解释怎样参与。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The approach requires pupils to rewrite the lines from Shakespeare.</p>\n<p>排练室教学法要求学生改写莎士比亚作品的台词。</p>\n</blockquote>\n<p>A成立须将已有lines交给学生改写。实际让学生进入角色完成新任务，accompany表示活动配合文本，不能换成rewrite。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. watch RSC actors’ performances</h3>\n<blockquote>\n<p>排练室教学法要求学生观看RSC演员的表演。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>学生要自己参与表演式活动，B把学生改成观看专业演员表演的观众。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nA study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>排练室教学法要求学生观看RSC演员的表演。</p>\n</blockquote>\n<p><code>watch RSC actors’ performances</code>把学生安排在观众的位置；第2段的<code>the way actors work</code>说的是演员的工作方式，第1段的<code>act him out</code>则明确涉及谁把作品演出来，补读完整的第1段，再对照这两句。</p>\n<p>原文将儿童获益的条件写成<code>act him out</code>，也就是把莎士比亚作品演出来；第2段接着用演员的工作方式解释这种教学法。这里要让学生参与演员式的活动。</p>\n<p><code>B</code>的<code>watch RSC actors’ performances</code>却要求学生观看剧团演员表演，把学生参与演绎作品改成了演员表演、学生观看。</p>\n<p>第2段提到剧团，是介绍受访者所属机构以及该机构与研究的关系，不能由剧团名称补出一项观看剧团演出的教学要求。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nA study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n<p>这位来自埃文河畔斯特拉特福的文法学校男孩，在学术上有了有力的一击：突破性研究显示莎士比亚确实有益儿童读写能力和情感发展，但前提是把他的作品演出来。</p>\n<p>研究发现，教授莎士比亚的排练室方法扩大了儿童词汇、提高写作复杂度及情感素养。委托研究的皇家莎士比亚剧团O&#39;Hanlon说，演员的工作方式显著影响儿童怎样使用语言以及怎样看待自己。</p>\n</blockquote>\n<p>研究用the way actors work解释教学过程，而第三段让目标组亲自参加戏剧活动。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The approach requires pupils to watch RSC actors’ performances.</p>\n<p>排练室教学法要求学生观看RSC演员的表演。</p>\n</blockquote>\n<p>B需要RSC演员演、学生看的安排。出现剧团名称是交代研究委托方，不足以推出观演要求。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. play the roles in Shakespeare</h3>\n<blockquote>\n<p>排练室教学法要求学生扮演莎士比亚作品中的角色。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、C，此时C尚未排除。随后把全文连起来回看，最终选C。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>act him out、as Ferdinand和drama-based activity分别给出演绎、角色身份及活动形式，C把它们概括为扮演莎剧角色。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nThe randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>排练室教学法要求学生扮演莎士比亚作品中的角色。</p>\n</blockquote>\n<p><code>play the roles</code>指向学生以剧中人物身份参与活动，第1段的<code>act him out</code>写明要把作品演出来，第3段的<code>as Ferdinand</code>又给出具体人物身份，回看这两处来核对表演与角色是否接在一起。</p>\n<p>原文要求<code>act him out</code>，并举出以《暴风雨》里的费迪南德身份写信的任务。前一句说明学生要演绎作品，后一句说明学生要进入作品中人物的身份。<code>C</code>的<code>play the roles</code>把这两层具体意思合起来，所说的角色来自莎士比亚作品，做这件事的人仍是学生。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nThe randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.</p>\n<p>这位来自埃文河畔斯特拉特福的文法学校男孩，在学术上有了有力的一击：突破性研究显示莎士比亚确实有益儿童读写能力和情感发展，但前提是把他的作品演出来。</p>\n<p>随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。</p>\n</blockquote>\n<p>首段提出表演条件，第三段进一步示范以《暴风雨》人物身份完成写作。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The approach requires pupils to play the roles in Shakespeare.</p>\n<p>排练室教学法要求学生扮演莎士比亚作品中的角色。</p>\n</blockquote>\n<p>C保留学生作为参与者和作品人物作为角色的关系，不将活动误写成改台词或观看他人表演。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. study drama under RSC artists</h3>\n<blockquote>\n<p>排练室教学法要求学生在RSC艺术家指导下学戏剧。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>RSC委托研究是机构与研究的关系，D要求RSC艺术家亲自指导学生，增加了师资身份条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nA study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>排练室教学法要求学生在RSC艺术家指导下学戏剧。</p>\n</blockquote>\n<p><code>under RSC artists</code>说的是谁指导学生，要核对第2段如何介绍<code>Royal Shakespeare Company</code>，以及<code>the way actors work</code>如何与儿童学习发生联系，因此回看第2段后一句。</p>\n<p><code>the way actors work</code>介绍演员的工作方式，而<code>under RSC artists</code>要求剧团艺术家亲自指导学生，额外规定了教师身份。原文<code>which commissioned the study</code>只说皇家莎士比亚剧团委托了这项研究；委托研究不等于直接担任学生的戏剧教师。<code>D</code>把机构与研究的关系改接成艺术家与学生的教学关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nA study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n<p>这位来自埃文河畔斯特拉特福的文法学校男孩，在学术上有了有力的一击：突破性研究显示莎士比亚确实有益儿童读写能力和情感发展，但前提是把他的作品演出来。</p>\n<p>研究发现，教授莎士比亚的排练室方法扩大了儿童词汇、提高写作复杂度及情感素养。委托研究的皇家莎士比亚剧团O&#39;Hanlon说，演员的工作方式显著影响儿童怎样使用语言以及怎样看待自己。</p>\n</blockquote>\n<p>第二段引用机构人士谈演员式方法的作用，第三段介绍分组活动，却没有指派专业演员做老师。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The approach requires pupils to study drama under RSC artists.</p>\n<p>排练室教学法要求学生在RSC艺术家指导下学戏剧。</p>\n</blockquote>\n<p>D需要艺术家直接授课的事实。借鉴演员工作方式与由某剧团演员教学，不能互相替代。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>21题结论</h3>\n<blockquote>\n<p><strong>21. C</strong></p>\n</blockquote>\n<ul>\n<li>A：任务是以Ferdinand身份写漂流瓶信，戏剧活动配合选段开展；没有要求改写现成台词，A另添了写作对象。</li>\n<li>B：学生要自己参与表演式活动，B把学生改成观看专业演员表演的观众。</li>\n<li>C：act him out、as Ferdinand和drama-based activity分别给出演绎、角色身份及活动形式，C把它们概括为扮演莎剧角色。</li>\n<li>D：RSC委托研究是机构与研究的关系，D要求RSC艺术家亲自指导学生，增加了师资身份条件。</li>\n</ul>\n<h2>22题</h2>\n<blockquote>\n<p>The study divided the pupils into two groups to find whether ______.</p>\n<p>研究把学生分为两组，是为了查明什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>研究目的推断题：将有无戏剧活动这一条件与写作、情感表现这些结果对应。</p>\n<p>题干的divided the pupils into two groups直接对应第3段的split into target and control groups。第3段给出分组后学生分别经历的活动，第4段紧接着报告结果；要理解分组所检验的事情，需要把这两段完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>They were split into target and control groups</p>\n<p>The target group was given a 30-minute drama-based activity to accompany the passage</p>\n<p>used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length</p>\n</blockquote>\n<h3>A. the change in instruction enhances learning outcomes</h3>\n<blockquote>\n<p>分组研究检验的是教学变化是否改善学习效果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>分组研究检验的是教学变化是否改善学习效果。</p>\n</blockquote>\n<p>两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。</p>\n<p>第三段列活动安排，第四段接peer-reviewed results，把干预条件与观察结果连起来。</p>\n<p>A的instruction对应戏剧教学，outcomes对应写作和情感表现，保留研究所检验的方向。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n<p>随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n</blockquote>\n<p>第三段列活动安排，第四段接peer-reviewed results，把干预条件与观察结果连起来。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study tests whether the change in instruction enhances learning outcomes.</p>\n<p>分组研究检验的是教学变化是否改善学习效果。</p>\n</blockquote>\n<p>A的instruction对应戏剧教学，outcomes对应写作和情感表现，保留研究所检验的方向。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. expanding vocabulary helps develop reading fluency</h3>\n<blockquote>\n<p>分组研究检验的是扩大词汇量是否提高阅读流利度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>词汇更丰富是观察结果之一，阅读流利度却不是这里的测量任务；B把词汇结果变成原因，又换了结果对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>分组研究检验的是扩大词汇量是否提高阅读流利度。</p>\n</blockquote>\n<p>词汇更丰富是观察结果之一，阅读流利度却不是这里的测量任务；B把词汇结果变成原因，又换了结果对象。</p>\n<p>研究改变的是有无戏剧活动，观察的是两组写作及人物情感表达。</p>\n<p>B需要先改变词汇量、再检查阅读流畅程度的设计。实际write与reading fluency不同，不能因都属语言学习就混用。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n<p>随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n</blockquote>\n<p>研究改变的是有无戏剧活动，观察的是两组写作及人物情感表达。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study tests whether expanding vocabulary helps develop reading fluency.</p>\n<p>分组研究检验的是扩大词汇量是否提高阅读流利度。</p>\n</blockquote>\n<p>B需要先改变词汇量、再检查阅读流畅程度的设计。实际write与reading fluency不同，不能因都属语言学习就混用。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. emotion affects understanding of sophisticated works</h3>\n<blockquote>\n<p>分组研究检验的是情绪是否影响对复杂作品的理解。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>人物情感是学生要体会和表达的内容，C将情绪改成影响复杂作品理解的原因。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>分组研究检验的是情绪是否影响对复杂作品的理解。</p>\n</blockquote>\n<p><code>emotion affects understanding</code>要核对情绪与理解的关系，其中<code>emotion</code>在第4段对应<code>express that character’s emotion</code>；但<code>C</code>还把情绪放在影响理解的起点，因此同时回看第3段目标组的<code>drama-based activity</code>，检查研究改变的究竟是什么、情感又在结果中起什么作用。</p>\n<p>原文先给目标组安排<code>drama-based activity</code>，后面报告他们能站在文学人物的立场并<code>express that character’s emotion</code>。情感在这里是学生尝试体会和表达的内容，研究观察的是活动之后学生能怎样表达角色。</p>\n<p><code>C</code>的<code>emotion affects understanding</code>却把情绪当成导致理解变化的原因，并把结果写成对复杂作品的理解。</p>\n<p>这不是把同一结果换个说法，而是将角色的情感表达改成了情绪对阅读理解的影响。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n<p>随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n</blockquote>\n<p>戏剧活动在前，能否进入人物并表达其情感在后，情感理解属于观察到的表现。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study tests whether emotion affects understanding of sophisticated works.</p>\n<p>分组研究检验的是情绪是否影响对复杂作品的理解。</p>\n</blockquote>\n<p>C需要按情绪差异比较理解效果；现有分组按教学活动设立，没有建立情绪导致阅读理解变化的检验关系。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. the classroom activity stimulates interest in the arts</h3>\n<blockquote>\n<p>分组研究检验的是课堂活动是否激发艺术兴趣。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>戏剧活动确是课堂安排，但结果比较词汇、篇幅与人物情感，未调查学生是否更喜欢艺术。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>分组研究检验的是课堂活动是否激发艺术兴趣。</p>\n</blockquote>\n<p><code>classroom activity</code>可接到第3段的<code>drama-based activity</code>，<code>interest in the arts</code>说的是学生对艺术的兴趣，而第4段的<code>express that character’s emotion</code>说的是表达角色的情感；回看这句，检查研究比较的是学生喜欢什么，还是他们写作时表现出了什么。</p>\n<p>原文的确给目标组安排了<code>drama-based activity</code>，但分组后的结果是在比较用词、篇幅以及表达文学人物情感的表现。<code>D</code>保留了课堂活动这个起点，却把结果改成<code>interest in the arts</code>，即学生对艺术是否产生更大兴趣。能够写得更长、表达角色的情感，和学生是否更喜欢艺术，是不同的观察内容；尤其<code>express that character’s emotion</code>的对象是作品中人物的情感，并不是学生自己对艺术的喜爱。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n<p>随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n</blockquote>\n<p>研究从30分钟活动转到写作表现，用不同指标说明学习变化。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study tests whether the classroom activity stimulates interest in the arts.</p>\n<p>分组研究检验的是课堂活动是否激发艺术兴趣。</p>\n</blockquote>\n<p>D只保留起点，换掉了结果。能表达角色情绪不等于自己对艺术的兴趣增加。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>22题结论</h3>\n<blockquote>\n<p><strong>22. A</strong></p>\n</blockquote>\n<ul>\n<li>A：两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。</li>\n<li>B：词汇更丰富是观察结果之一，阅读流利度却不是这里的测量任务；B把词汇结果变成原因，又换了结果对象。</li>\n<li>C：人物情感是学生要体会和表达的内容，C将情绪改成影响复杂作品理解的原因。</li>\n<li>D：戏剧活动确是课堂安排，但结果比较词汇、篇幅与人物情感，未调查学生是否更喜欢艺术。</li>\n</ul>\n<h2>23题</h2>\n<blockquote>\n<p>Control pupils’ reliance on “desert island clichés” shows their ______.</p>\n<p>对照组学生依赖‘荒岛陈词滥调’，显示出他们的什么特点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节推断题：用套话与丰富画面的对照判断描写表现，不混用另一组的词汇结果。</p>\n<p>题干的Control pupils与desert island clichés都直接出现在第5段。这一段用while把对照组和目标组的描写并列比较，先完整读完第5段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>control pupils relied on desert island clichés such as palm trees</p>\n<p>target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions</p>\n<p>a broader picture of the sky, the sea and the atmospheric conditions</p>\n</blockquote>\n<h3>A. weakness in description</h3>\n<blockquote>\n<p>对照组依赖荒岛套话，显示出描写方面的不足。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>对照组套用棕榈树等荒岛老写法，目标组展开天空、海洋和天气，A概括前者描写不够丰富的不足。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>对照组依赖荒岛套话，显示出描写方面的不足。</p>\n</blockquote>\n<p>对照组套用棕榈树等荒岛老写法，目标组展开天空、海洋和天气，A概括前者描写不够丰富的不足。</p>\n<p>while把套话与more expansive并置，a broader picture具体说明差别发生在场景铺展上。</p>\n<p>weakness在这里针对两组比较中的描写表现，不是断言对照组所有写作能力都差；与本段对照范围相合。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n<p>Time to Act研究还发现，对照组依赖棕榈树等荒岛套话，目标组描写更充分，给出天空、海洋和大气状况的更广阔画面。</p>\n</blockquote>\n<p>while把套话与more expansive并置，a broader picture具体说明差别发生在场景铺展上。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The use of clichés shows the pupils’ weakness in description.</p>\n<p>对照组依赖荒岛套话，显示出描写方面的不足。</p>\n</blockquote>\n<p>weakness在这里针对两组比较中的描写表现，不是断言对照组所有写作能力都差；与本段对照范围相合。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. omission of small details</h3>\n<blockquote>\n<p>对照组依赖荒岛套话，显示他们遗漏细小细节。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文比较固定套话与更广场景，未说遗漏了某些必须写的小细节。B把展开不足具体化成漏写细节。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>对照组依赖荒岛套话，显示他们遗漏细小细节。</p>\n</blockquote>\n<p><code>small details</code>涉及描写内容，第5段的<code>a broader picture</code>也谈画面内容，所以回看<code>clichés</code>与目标组描写天空、海洋的对照，核对原文指出的是怎样一种不足。</p>\n<p>原文用树这一类套话与天空、海洋等更广阔的画面作对照，指出对照组依赖固定写法，写景内容没有像目标组那样铺展开。<code>B</code>的<code>omission of small details</code>却进一步认定他们漏写了细小细节，把描写倚重套话、画面展开有限，改成了具体内容被遗漏。<code>a broader picture</code>比较的是所呈现场景的广度；原文列出的天空和海洋也不是一份供核对遗漏细节的清单，因此不能由这组对照直接得出<code>small details</code>被省略。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n<p>Time to Act研究还发现，对照组依赖棕榈树等荒岛套话，目标组描写更充分，给出天空、海洋和大气状况的更广阔画面。</p>\n</blockquote>\n<p>天空、海洋、大气状况说明目标组描写更广，作为对照展示画面丰富程度。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The use of clichés shows the pupils’ omission of small details.</p>\n<p>对照组依赖荒岛套话，显示他们遗漏细小细节。</p>\n</blockquote>\n<p>B需要应写却未写的细节清单或遗漏判断。广度较窄不能直接证明small details被省略。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. casual style of writing</h3>\n<blockquote>\n<p>对照组依赖荒岛套话，显示其写作风格随意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>clichés是陈旧套话，不是casual所指轻松随意语体；场景展开程度也不是正式与随意的风格比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>对照组依赖荒岛套话，显示其写作风格随意。</p>\n</blockquote>\n<p><code>casual style of writing</code>是在评价行文风格，第5段的<code>relied on</code> “<code>desert island clichés</code>”则评价他们如何描写荒岛，回看这句以及<code>more expansive</code>的对照，核对这项风格判断。</p>\n<p>原文说对照组<code>relied on</code> “<code>desert island clichés</code>”，即写荒岛时倚重现成套话，随后与更开阔的场景描写作比较。<code>C</code>的<code>casual style of writing</code>却将其概括为随意、不拘形式的行文风格。依赖套话说明表达沿用了固定写法，不能据此判定整篇文字是否采用轻松随意的语体；目标组<code>more expansive</code>比较的也是描写是否展开，并非两组行文正式或随意的程度。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n<p>Time to Act研究还发现，对照组依赖棕榈树等荒岛套话，目标组描写更充分，给出天空、海洋和大气状况的更广阔画面。</p>\n</blockquote>\n<p>原段从对照组固定表达转到目标组较开阔画面，比较的是描写内容。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The use of clichés shows the pupils’ casual style of writing.</p>\n<p>对照组依赖荒岛套话，显示其写作风格随意。</p>\n</blockquote>\n<p>C需要行文语体依据。沿用老套表达的人也可能写得很正式，不能由套话推出随意风格。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. preference for big words</h3>\n<blockquote>\n<p>对照组依赖荒岛套话，显示他们偏爱大词。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>复杂或罕见词是第四段目标组的表现，本题却问对照组荒岛套话，不能推出对照组偏爱大词。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>对照组依赖荒岛套话，显示他们偏爱大词。</p>\n</blockquote>\n<p>复杂或罕见词是第四段目标组的表现，本题却问对照组荒岛套话，不能推出对照组偏爱大词。</p>\n<p>第五段另以棕榈树与更广天空海洋作对照，讨论描写扩展，并非词语艰深程度。</p>\n<p>D需要对照组倾向选大词的证据；既不能借用另一组的结果，也不能把套话本身当成大词偏好。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n<p>Time to Act研究还发现，对照组依赖棕榈树等荒岛套话，目标组描写更充分，给出天空、海洋和大气状况的更广阔画面。</p>\n</blockquote>\n<p>第五段另以棕榈树与更广天空海洋作对照，讨论描写扩展，并非词语艰深程度。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The use of clichés shows the pupils’ preference for big words.</p>\n<p>对照组依赖荒岛套话，显示他们偏爱大词。</p>\n</blockquote>\n<p>D需要对照组倾向选大词的证据；既不能借用另一组的结果，也不能把套话本身当成大词偏好。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>23题结论</h3>\n<blockquote>\n<p><strong>23. A</strong></p>\n</blockquote>\n<ul>\n<li>A：对照组套用棕榈树等荒岛老写法，目标组展开天空、海洋和天气，A概括前者描写不够丰富的不足。</li>\n<li>B：原文比较固定套话与更广场景，未说遗漏了某些必须写的小细节。B把展开不足具体化成漏写细节。</li>\n<li>C：clichés是陈旧套话，不是casual所指轻松随意语体；场景展开程度也不是正式与随意的风格比较。</li>\n<li>D：复杂或罕见词是第四段目标组的表现，本题却问对照组荒岛套话，不能推出对照组偏爱大词。</li>\n</ul>\n<h2>24题</h2>\n<blockquote>\n<p>What can promote children’s emotional literacy according to O’Hanlon?</p>\n<p>按照奥汉隆的说法，什么能够提升儿童的情感素养？</p>\n</blockquote>\n<h3>题型</h3>\n<p>原因理解题：由换到文学人物立场解释情感素养，区分一般想象与具体换位。</p>\n<p>题干的O’Hanlon和emotional literacy同时出现在第6段开头，随后她解释情感理解与排练室过程的联系。先完整读完第6段，连同她描述儿童表现和解释戏剧活动的部分。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>emotional literacy that was evident in the [target] children’s writing</p>\n<p>it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through</p>\n<p>They were comfortable in describing different emotional states</p>\n</blockquote>\n<h3>A. Writing in an imaginative manner.</h3>\n<blockquote>\n<p>能够促进儿童情感素养的做法是以富有想象力的方式写作。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>想象与写作在文中确实有关，但O&#39;Hanlon更具体地解释为站到他人立场体会情感，一般想象性写作没有B贴切。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>能够促进儿童情感素养的做法是以富有想象力的方式写作。</p>\n</blockquote>\n<p>想象与写作在文中确实有关，但O&#39;Hanlon更具体地解释为站到他人立场体会情感，一般想象性写作没有B贴切。</p>\n<p>她先描述目标组写作中的情感素养，再用排练过程和put yourself in different shoes说明可能机制。</p>\n<p>A不是与材料完全无关，而是范围太宽：只想象自己遭遇沉船的对照组也会想象，关键区别在是否进入文学人物。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n<p>O&#39;Hanlon说，最令她惊讶的是目标组写作中明显的情感素养，他们的文字更有韧性、更有希望。她说，情感理解很明显，可能与排练过程有关，人们在其中习惯通过想象进入处境。他们能自如描述不同情感状态，戏剧的一部分就是设身处地。她认为研究说明了将艺术融入教育的重要性。</p>\n</blockquote>\n<p>她先描述目标组写作中的情感素养，再用排练过程和put yourself in different shoes说明可能机制。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Writing in an imaginative manner can promote children’s emotional literacy.</p>\n<p>能够促进儿童情感素养的做法是以富有想象力的方式写作。</p>\n</blockquote>\n<p>A不是与材料完全无关，而是范围太宽：只想象自己遭遇沉船的对照组也会想象，关键区别在是否进入文学人物。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. Identifying with literary characters.</h3>\n<blockquote>\n<p>能够促进儿童情感素养的做法是设身处地体会文学人物。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>put yourself in different shoes与第四段in the shoes of a literary character都说站在人物立场，B直接对应情感理解的解释。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>能够促进儿童情感素养的做法是设身处地体会文学人物。</p>\n</blockquote>\n<p><code>Identifying with</code>对应第6段的<code>put yourself in different shoes</code>；<code>literary characters</code>又明确出现在第4段的<code>in the shoes of a literary character</code>，回看奥汉隆的解释，并结合前面已经读过的角色写作结果，核对学生体会的是谁的情感。</p>\n<p>原文中，奥汉隆将儿童的情感理解联系到排练过程，接着解释戏剧活动的一部分就是<code>put yourself in different shoes</code>。第4段把这一做法写得更具体：学生站在文学人物的立场并表达那个人物的情感。<code>B</code>的<code>Identifying with literary characters</code>说的是进入人物的立场、体会人物的感受，与这两处叙述接得上；它也保留了原文的方向，是设身处地的活动帮助儿童理解和表达情感。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n<p>O&#39;Hanlon说，最令她惊讶的是目标组写作中明显的情感素养，他们的文字更有韧性、更有希望。她说，情感理解很明显，可能与排练过程有关，人们在其中习惯通过想象进入处境。他们能自如描述不同情感状态，戏剧的一部分就是设身处地。她认为研究说明了将艺术融入教育的重要性。</p>\n</blockquote>\n<p>研究结果先显示目标组更能表达角色情绪，O&#39;Hanlon再将其联系到排练中的换位体验。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Identifying with literary characters can promote children’s emotional literacy.</p>\n<p>能够促进儿童情感素养的做法是设身处地体会文学人物。</p>\n</blockquote>\n<p>Identifying with强调体会人物，保留活动如何帮助情感表达的关系；不必推成忘掉自己或每种想象都一样有效。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. Drawing inspiration from nature.</h3>\n<blockquote>\n<p>能够促进儿童情感素养的做法是从自然中汲取灵感。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>天空和海洋是写作更丰富的表现，不是O&#39;Hanlon解释情感发展时提出的灵感来源，C将结果素材变成原因。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>O&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>能够促进儿童情感素养的做法是从自然中汲取灵感。</p>\n</blockquote>\n<p><code>from nature</code>可以联系到第5段的<code>the sky</code>, <code>the sea</code>，但那一段说的是儿童描写的内容；第6段的<code>put yourself in different shoes</code>则是她用来解释情感理解的做法，回看这两处，检查自然景物在这里究竟起什么作用。</p>\n<p><code>C</code>的<code>Drawing inspiration from nature</code>说从自然中汲取灵感。原文中的天空、海洋及大气状况是目标组更充分的场景描写，属于研究观察到的表现；解释情感理解的原因时，奥汉隆说的是排练中想象别人的处境、<code>put yourself in different shoes</code>。把被描写的自然景物改成促进情感素养的灵感来源，倒换了材料在论证中的作用。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>O&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n<p>O&#39;Hanlon说，最令她惊讶的是目标组写作中明显的情感素养，他们的文字更有韧性、更有希望。她说，情感理解很明显，可能与排练过程有关，人们在其中习惯通过想象进入处境。他们能自如描述不同情感状态，戏剧的一部分就是设身处地。她认为研究说明了将艺术融入教育的重要性。</p>\n</blockquote>\n<p>第五段列场景内容，第六段转到排练中想象别人处境的机制。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Drawing inspiration from nature can promote children’s emotional literacy.</p>\n<p>能够促进儿童情感素养的做法是从自然中汲取灵感。</p>\n</blockquote>\n<p>C需要从观察自然获得灵感并促进情感理解的过程。原文并未安排自然观察活动，角色换位才是明确解释。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. Concentrating on real-life situations.</h3>\n<blockquote>\n<p>能够促进儿童情感素养的做法是专注现实生活情境。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>文学人物情境与现实经验可以相关，但原文强调换到角色立场；D把做法改为专注现实生活情境。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>能够促进儿童情感素养的做法是专注现实生活情境。</p>\n</blockquote>\n<p><code>real-life situations</code>涉及学生应把注意力放在哪里，第6段用<code>put yourself in different shoes</code>解释活动，第4段又明确给出<code>a literary character</code>，回看这两句，核对她要求学生进入的具体情境和立场。</p>\n<p>原文中的学生通过排练和想象进入别人的处境，第4段还明确把这一对象写成<code>a literary character</code>，任务是表达人物的情感。<code>D</code>的<code>Concentrating on real-life situations</code>则把促进方式说成专注于现实生活情境，强调现实情境本身。文学人物的情感当然可以与现实经验相关，但原文解释的活动不是集中注意现实生活，而是换到人物的立场去理解和表达；<code>D</code>替换了这里具体采用的情境与做法。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n<p>O&#39;Hanlon说，最令她惊讶的是目标组写作中明显的情感素养，他们的文字更有韧性、更有希望。她说，情感理解很明显，可能与排练过程有关，人们在其中习惯通过想象进入处境。他们能自如描述不同情感状态，戏剧的一部分就是设身处地。她认为研究说明了将艺术融入教育的重要性。</p>\n</blockquote>\n<p>第四段特意区分自己会如何反应与文学人物情绪，第六段沿用换位解释。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Concentrating on real-life situations can promote children’s emotional literacy.</p>\n<p>能够促进儿童情感素养的做法是专注现实生活情境。</p>\n</blockquote>\n<p>D需要现实情境本身作为促进方式的依据。理解角色可能借助生活经验，却不等于研究以专注现实生活为核心方法。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>24题结论</h3>\n<blockquote>\n<p><strong>24. B</strong></p>\n</blockquote>\n<ul>\n<li>A：想象与写作在文中确实有关，但O&#39;Hanlon更具体地解释为站到他人立场体会情感，一般想象性写作没有B贴切。</li>\n<li>B：put yourself in different shoes与第四段in the shoes of a literary character都说站在人物立场，B直接对应情感理解的解释。</li>\n<li>C：天空和海洋是写作更丰富的表现，不是O&#39;Hanlon解释情感发展时提出的灵感来源，C将结果素材变成原因。</li>\n<li>D：文学人物情境与现实经验可以相关，但原文强调换到角色立场；D把做法改为专注现实生活情境。</li>\n</ul>\n<h2>25题</h2>\n<blockquote>\n<p>It can be inferred from the last paragraph that ______.</p>\n<p>从最后一段可以推断出什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>有限推断题：保留may与尚待研究，区分可能优势、课程安排及学生意愿。</p>\n<p>题干直接限定last paragraph，定位到第7段。先把这一段关于其他剧作家、莎士比亚的词汇量以及儿童身体参与的内容完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>But could the results be replicated with any old dramatist?</p>\n<p>O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words</p>\n<p>gave a “massive expansion of language into children’s lives”</p>\n</blockquote>\n<h3>A. the new teaching method may work best with Shakespeare</h3>\n<blockquote>\n<p>最后一段可推知：新教学法可能与莎士比亚配合得最好。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>换其他剧作家能否复制结果仍待研究，随后特别强调莎士比亚丰富语言与身体演绎的结合，支持A保留可能性的推断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知：新教学法可能与莎士比亚配合得最好。</p>\n</blockquote>\n<p><code>may work best with Shakespeare</code>涉及方法能否同样用于其他剧作家，正好对应段首的<code>any old dramatist</code>；随后<code>Shakespeare’s use of 20,000 words</code>给出她特别谈到莎士比亚的理由，因此连着回看提问、保留态度和词汇量解释。</p>\n<p>原文先问换成别的剧作家能否重现结果，回答是还需要更多研究；但她接着指出<code>Shakespeare’s use of 20,000 words</code>相较日常2,000个词给儿童带来大量语言扩展。词汇数字不是莎士比亚与其他剧作家的排名，不能据此断言他已被证明最好。</p>\n<p>不过，在是否可任意替换作者的问题下，作者特别提出莎士比亚丰富语言的作用，支持他与这种方法可能有很好的配合。</p>\n<p><code>A</code>说<code>may work best</code>，保留了‘可能’，没有把待研究的比较说成已经证实的结论。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n<p>但换成随便哪个剧作家都能复制结果吗？O&#39;Hanlon说还需要更多研究，但莎士比亚使用两万个词，相比日常的两千个词，给儿童生活带来巨大语言扩展，又结合了儿童用全身把词语演活的参与方式。</p>\n</blockquote>\n<p>But先问效果能否泛化，more research保留结论，but suggested再给这位作家可能有优势的理由。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The new teaching method may work best with Shakespeare.</p>\n<p>最后一段可推知：新教学法可能与莎士比亚配合得最好。</p>\n</blockquote>\n<p>may work best不能改成已证明最好；20,000对2,000比较的是莎剧与日常词汇，并非作家排名，但在替换作者的问题下仍支持这种可能。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. the language of Shakespeare may be formidable for pupils</h3>\n<blockquote>\n<p>最后一段可推知：莎士比亚语言可能让学生望而生畏。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>丰富词汇被写成语言扩展的收益，B却推成学生望而生畏；原段没有报告这种困难反应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知：莎士比亚语言可能让学生望而生畏。</p>\n</blockquote>\n<p><code>formidable for pupils</code>是在判断儿童面对这些语言的困难程度，第7段谈<code>Shakespeare’s use of 20,000 words</code>，并说明这对<code>children’s lives</code>带来什么，因此回看词汇数字后面的<code>massive expansion of language</code>及儿童让文字活起来的描写。</p>\n<p>原文将20,000与2,000的差距解释为<code>massive expansion of language</code>，也就是丰富语言进入儿童的生活，并与儿童用身体让文字活起来相结合。<code>B</code>的<code>formidable for pupils</code>则把同一批语言说成可能使学生望而生畏。词汇量大是两边涉及的同一事实，但原文用它解释语言学习得到拓展，<code>B</code>却从数量跨到儿童感到难以应付的反应；原句没有提供这一反应，描述的儿童活动反而是在把词语表现出来。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n<p>但换成随便哪个剧作家都能复制结果吗？O&#39;Hanlon说还需要更多研究，但莎士比亚使用两万个词，相比日常的两千个词，给儿童生活带来巨大语言扩展，又结合了儿童用全身把词语演活的参与方式。</p>\n</blockquote>\n<p>数字差距后接massive expansion，再以身体让词语鲜活起来说明参与方式。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The language of Shakespeare may be formidable for pupils.</p>\n<p>最后一段可推知：莎士比亚语言可能让学生望而生畏。</p>\n</blockquote>\n<p>B需要儿童难以应对或感到畏惧的证据。词汇量大本身不能越过教学参与的积极描述，直接变成心理压力。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. other old dramatists may be included in primary education</h3>\n<blockquote>\n<p>最后一段可推知：其他古代剧作家可能被纳入小学教育。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>是否能复制效果是研究可推广性，纳入小学课程是教材采用决定，原段没有从前者推出后者。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知：其他古代剧作家可能被纳入小学教育。</p>\n</blockquote>\n<p><code>other old dramatists</code>联系到段首的<code>any old dramatist</code>，但<code>included in primary education</code>还加入课程采用的变化；回看<code>results be replicated</code>的问题与<code>more research would be needed</code>的回答，判断它们谈的是研究效果还是课程安排。</p>\n<p>原文询问的是换用其他剧作家的作品后，<code>results be replicated</code>是否成立，奥汉隆回答需要更多研究，再解释莎士比亚语言丰富的作用。<code>C</code>的<code>included in primary education</code>却在推测其他剧作家进入小学教育的安排。</p>\n<p>换作者后能否取得同样研究结果，是教学效果的可推广性问题；是否把其他作者纳入课程，则是采用哪些教材的决定。</p>\n<p>原文提出一个尚待研究的问题，并没有由此建立其他作者可能纳入课程的安排。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n<p>但换成随便哪个剧作家都能复制结果吗？O&#39;Hanlon说还需要更多研究，但莎士比亚使用两万个词，相比日常的两千个词，给儿童生活带来巨大语言扩展，又结合了儿童用全身把词语演活的参与方式。</p>\n</blockquote>\n<p>any old dramatist在提问中强调换任何其他剧作家都行吗，回答仍需研究，随后回到莎士比亚的语言资源。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Other old dramatists may be included in primary education.</p>\n<p>最后一段可推知：其他古代剧作家可能被纳入小学教育。</p>\n</blockquote>\n<p>C需要其他作家被纳入教学的安排或预期。提出待研究问题不等于提出课程扩充计划。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. pupils may be reluctant to work on other old dramatists</h3>\n<blockquote>\n<p>最后一段可推知：学生可能不愿学习其他古代剧作家。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知：学生可能不愿学习其他古代剧作家。</p>\n</blockquote>\n<p>末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。</p>\n<p>提问与回答都围绕结果可复制性，后面谈丰富语言与表演结合。</p>\n<p>D需要学生抗拒的表述。more research所保留的是研究结论，不是儿童对学习对象的态度。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n<p>但换成随便哪个剧作家都能复制结果吗？O&#39;Hanlon说还需要更多研究，但莎士比亚使用两万个词，相比日常的两千个词，给儿童生活带来巨大语言扩展，又结合了儿童用全身把词语演活的参与方式。</p>\n</blockquote>\n<p>提问与回答都围绕结果可复制性，后面谈丰富语言与表演结合。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Pupils may be reluctant to work on other old dramatists.</p>\n<p>最后一段可推知：学生可能不愿学习其他古代剧作家。</p>\n</blockquote>\n<p>D需要学生抗拒的表述。more research所保留的是研究结论，不是儿童对学习对象的态度。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>25题结论</h3>\n<blockquote>\n<p><strong>25. A</strong></p>\n</blockquote>\n<ul>\n<li>A：换其他剧作家能否复制结果仍待研究，随后特别强调莎士比亚丰富语言与身体演绎的结合，支持A保留可能性的推断。</li>\n<li>B：丰富词汇被写成语言扩展的收益，B却推成学生望而生畏；原段没有报告这种困难反应。</li>\n<li>C：是否能复制效果是研究可推广性，纳入小学课程是教材采用决定，原段没有从前者推出后者。</li>\n<li>D：末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：研究发现的核心结论</strong>（段落1-2主要发现） 研究背景：莎士比亚有益于儿童读写和情感发展 → 关键条件：必须通过表演 → &quot;排练室&quot;教学法的效果：【拓宽词汇 + 提高写作复杂性 + 增强情感素养】→ 原理：演员工作方式影响儿童语言使用和自我认知</p>\n<p>↓（研究方法）</p>\n<p><strong>逻辑层次2：实验设计与过程</strong>（段落3实验方法） 实验设计：【随机对照试验：45所小学数百名9-10岁学生（未接触过RSC教学法）】→ 分组：目标组vs对照组 → 任务：写《暴风雨》中费迪南德的瓶中信 → 干预：目标组获得30分钟戏剧活动</p>\n<p>↓（实验结果）</p>\n<p><strong>逻辑层次3：具体效果对比</strong>（段落4-5结果分析） 语言能力差异：【目标组：（词汇更广泛 + 用词更复杂罕见 + 篇幅更长）// 对照组：词汇有限】→ 写作方式差异：【目标组：以角色身份写作，表达角色情感 // 对照组：想象自己的反应】→ 描述能力差异：【目标组：宽广描述（天空、海洋、大气）// 对照组：依赖陈词滥调（棕榈树）】</p>\n<p>↓（深层影响）</p>\n<p><strong>逻辑层次4：情感素养的提升</strong>（段落6机制解释） 最大惊喜：目标组儿童的情感素养 → 表现：（写作更有韧性 + 更有希望）→ 原因分析：【排练室过程：习惯通过想象找出路 → 自如描述不同情感状态 → 戏剧本质：设身处地】→ 教育启示：艺术嵌入教育的重要性</p>\n<p>↓（特殊性讨论）</p>\n<p><strong>逻辑层次5：莎士比亚的独特优势</strong>（段落7延伸思考） 问题：其他剧作家能否复制效果？→ 需要更多研究 // 但莎士比亚的特殊性：【语言优势：20,000词汇vs日常2,000词汇 → 大规模语言扩展】+ 【教学方式：用整个身体让词语活起来】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点<strong>：</strong>&quot;排练室&quot;戏剧教学法能显著提升儿童的语言能力和情感素养，莎士比亚作品因其丰富的词汇量可能具有独特优势，但关键在于让儿童通过表演来体验和理解文本。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. A comparison organised around a drama activity</p>\n<p>B. The limits of transferring the findings to other writers</p>\n<p>C. Acting as a condition for wider learning benefits</p>\n<p>D. A promise that the findings need no further testing</p>\n<p>E. Writing that becomes richer and more attentive to character</p>\n<p>F. Emotional understanding through taking another person’s position</p>\n<p>G. Watching professionals instead of participating</p>\n<p><strong>41.</strong></p>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out. A study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n<p><strong>42.</strong></p>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.</p>\n<p><strong>43.</strong></p>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot; The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n<p><strong>44.</strong></p>\n<p>O&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n<p><strong>45.</strong></p>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】C. Acting as a condition for wider learning benefits</p>\n<blockquote>\n<p>通过表演获得更广泛学习收益</p>\n</blockquote>\n<p>研究提出莎士比亚有益儿童读写与情感发展，但前提是表演，排练式教学影响语言和自我认识。</p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development.</p>\n</blockquote>\n<p>研究确认读写与情感收益，而首段But only限定必须通过表演获得，不能遗漏方法条件。</p>\n<blockquote>\n<p>A study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy.</p>\n</blockquote>\n<p>排练式方法将收益落实为词汇、写作复杂度与情感素养三个方面。</p>\n<blockquote>\n<p>&quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n</blockquote>\n<p>演员工作方式改变语言使用和自我理解，解释教学参与为何是标题重点。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>表演是获益条件 → 排练方法改善语言与情感 → 参与方式发挥作用</p>\n</blockquote>\n<p>acting as a condition对应But only if，wider benefits涵盖词汇、写作复杂性与情感素养。</p>\n<p>再看最强干扰项G：Watching professionals instead of participating。</p>\n<p>文章要求学生参与演员式活动，并非只看剧团演员演出。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】A. A comparison organised around a drama activity</p>\n<blockquote>\n<p>围绕戏剧活动安排的对照比较</p>\n</blockquote>\n<p>随机试验将未接触过相关教学法的学生分组，并在共同写作任务外给目标组安排戏剧活动。</p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest.</p>\n</blockquote>\n<p>未接触相关教学法的学生被随机分组，角色写作是共同任务，建立比较基础。</p>\n<blockquote>\n<p>The target group was given a 30-minute drama-based activity to accompany the passage.</p>\n</blockquote>\n<p>目标组额外接受30分钟戏剧活动，使比较能够围绕这一教学变化展开。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>相近起点随机分组 → 共同角色写作任务 → 目标组增加戏剧活动</p>\n</blockquote>\n<p>comparison对应目标与对照分组，organised around drama指出两组教学安排的关键差别。</p>\n<p>再看最强干扰项D：A promise that the findings need no further testing。</p>\n<p>本段介绍研究设计，既非结果也没有宣布无需后续验证。</p>\n<p><strong>42题选A。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】E. Writing that becomes richer and more attentive to character</p>\n<blockquote>\n<p>更丰富且更贴近人物的写作</p>\n</blockquote>\n<p>目标组词汇更丰富、写作更长、能进入人物角色；场景也比对照组的套话更充分。</p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length.</p>\n</blockquote>\n<p>词汇范围、罕见词与篇幅具体呈现目标组写作差别，不是先验能力断言。</p>\n<blockquote>\n<p>They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot; The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n</blockquote>\n<p>自己反应与人物情绪、荒岛套话与更广场景两重对照，把改进扩展到角色立场和描写。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>词汇篇幅改善 → 更能进入人物 → 场景描写更丰富</p>\n</blockquote>\n<p>richer涵盖语言与场景展开，attentive to character涵盖人物立场和情感。</p>\n<p>再看最强干扰项G：Watching professionals instead of participating。</p>\n<p>这些是儿童亲自写作的表现，不能转成观看专业表演的收益。</p>\n<p><strong>43题选E。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】F. Emotional understanding through taking another person’s position</p>\n<blockquote>\n<p>通过站在他人立场来理解情感</p>\n</blockquote>\n<p>奥汉隆最惊讶于情感素养，并把它联系到排练中想象他人处境和表达不同情感。</p>\n<blockquote>\n<p>O&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through.</p>\n</blockquote>\n<p>最惊讶的情感素养被联系到排练中持续想象处境，probably保留机制解释的推测程度。</p>\n<blockquote>\n<p>They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n</blockquote>\n<p>能描述不同状态与put yourself in different shoes相接，再推出艺术融入教育的重要性。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>观察情感表达改善 → 解释换位体验 → 支持艺术融入教育</p>\n</blockquote>\n<p>taking another person’s position对应put yourself in different shoes，比一般想象写作更准确。</p>\n<p>再看最强干扰项E：Writing that becomes richer and more attentive to character。</p>\n<p>E是前段观察到的写作结果，此段进一步解释情感理解的促进机制。</p>\n<p><strong>44题选F。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】B. The limits of transferring the findings to other writers</p>\n<blockquote>\n<p>将研究结果推广到其他作家的限度</p>\n</blockquote>\n<p>是否可用任何剧作家复制结果仍需研究，莎士比亚丰富词汇与身体演绎的组合可能有特殊优势。</p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist?</p>\n</blockquote>\n<p>But把问题转到换作家后的可复制性，而非继续罗列已经观察的效果。</p>\n<blockquote>\n<p>O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n<p>more research限制推广结论，丰富词汇与身体参与又给出莎士比亚可能具有的优势。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>换其他作家是否同效 → 仍需研究 → 丰富语言与演绎可能有优势</p>\n</blockquote>\n<p>limits保留推广尚待验证的边界，other writers对应开头的替换问题。</p>\n<p>再看最强干扰项D：A promise that the findings need no further testing。</p>\n<p>原文明说more research would be needed，不能写成无需进一步研究。</p>\n<p><strong>45题选B。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>A study suggests that Shakespeare can benefit children’s language and emotional development under a particular condition: they act the work out. The claim concerns a rehearsal-room approach to learning. It does not simply assume that encountering the name of a famous writer produces the same result.</p>\n<p><strong>B.</strong></p>\n<p>To examine that approach, researchers divided pupils with no previous exposure to the relevant teaching method into target and control groups. Both completed writing tasks connected with a play. The target group also received a drama-based activity alongside the passage they were using.</p>\n<p><strong>C.</strong></p>\n<p>That explanation supports the case for including arts in education. The activity brings language, imagination and bodily participation together. Its value lies in what pupils do with the words and characters, rather than in a requirement that professional actors personally teach every lesson.</p>\n<p><strong>D.</strong></p>\n<p>Whether the same benefits would follow from any other dramatist remains an open question. More research would be needed to establish that transfer. Shakespeare’s unusually broad language nevertheless offers a possible advantage when children use their bodies to give the words expression.</p>\n<p><strong>E.</strong></p>\n<p>The contrast extended to descriptions of the setting. Control pupils relied on familiar desert-island images, while the target group described a broader scene involving sky, sea and atmospheric conditions. The result suggested a more expansive way of developing a picture rather than merely repeating a conventional phrase.</p>\n<p><strong>F.</strong></p>\n<p>The comparison revealed differences in the resulting writing. Target pupils used a wider vocabulary, selected rarer words and wrote at greater length. They also expressed the feelings of a literary character, whereas control pupils were more likely to describe how they themselves would react.</p>\n<p><strong>G.</strong></p>\n<p>Emotional expression was especially striking to the researcher discussing these results. She connected it with a rehearsal process in which participants imagine their way through another person’s situation. Taking a different position helps explain why children could describe a range of emotional states comfortably.</p>\n<p><strong>H.</strong></p>\n<p>The conclusion should therefore preserve both the promising result and its limits. The method may work particularly well with Shakespeare, but superiority over every alternative has not been proved. Nor does uncertainty about other writers reveal anything about whether pupils are willing to study them.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出表演是学习收益的重要条件</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明两组试验及目标组附加戏剧活动</td>\n</tr>\n<tr>\n<td>C</td>\n<td>概括艺术教学通过参与发挥作用</td>\n</tr>\n<tr>\n<td>D</td>\n<td>提出可推广性问题与莎士比亚语言优势</td>\n</tr>\n<tr>\n<td>E</td>\n<td>补充场景描写更充分的表现</td>\n</tr>\n<tr>\n<td>F</td>\n<td>呈现词汇篇幅及人物立场差别</td>\n</tr>\n<tr>\n<td>G</td>\n<td>解释角色转换与情感理解的联系</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结可能优势并限定比较及意愿推断</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出表演是学习收益的重要条件 → 说明两组试验及目标组附加戏剧活动 → 呈现词汇篇幅及人物立场差别 → 补充场景描写更充分的表现 → 解释角色转换与情感理解的联系 → 概括艺术教学通过参与发挥作用 → 提出可推广性问题与莎士比亚语言优势 → 总结可能优势并限定比较及意愿推断</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → B → F → E → G → C → D → H</strong></p>\n<p>41—45：B、F、G、C、D。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → B → F。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>It does not simply assume that encounteri
