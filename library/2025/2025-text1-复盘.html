 in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.</p>\n<p>这位来自埃文河畔斯特拉特福的文法学校男孩，在学术上有了有力的一击：突破性研究显示莎士比亚确实有益儿童读写能力和情感发展，但前提是把他的作品演出来。</p>\n<p>随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。</p>\n</blockquote>\n<p>首段提出表演条件，第三段进一步示范以《暴风雨》人物身份完成写作。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The approach requires pupils to play the roles in Shakespeare.</p>\n<p>排练室教学法要求学生扮演莎士比亚作品中的角色。</p>\n</blockquote>\n<p>C保留学生作为参与者和作品人物作为角色的关系，不将活动误写成改台词或观看他人表演。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. study drama under RSC artists","raw":"### D. study drama under RSC artists\n\n> 排练室教学法要求学生在RSC艺术家指导下学戏剧。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第三类——无中生有。**\n\nRSC委托研究是机构与研究的关系，D要求RSC艺术家亲自指导学生，增加了师资身份条件。\n\n**出处：**\n\n> The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children's literacy and emotional development. But only if you act him out.\n> A study found that a \"rehearsal room\" approach to teaching Shakespeare broadened children's vocabulary and the complexity of their writing as well as their emotional literacy. \"The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,\" Jacqui O'Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1345,378],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-21-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-D-0\"><blockquote>\n<p>排练室教学法要求学生在RSC艺术家指导下学戏剧。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>RSC委托研究是机构与研究的关系，D要求RSC艺术家亲自指导学生，增加了师资身份条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nA study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n</blockquote>\n</section>"},{"title":"D. study drama under RSC artists","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 排练室教学法要求学生在RSC艺术家指导下学戏剧。\n\n`under RSC artists`说的是谁指导学生，要核对第2段如何介绍`Royal Shakespeare Company`，以及`the way actors work`如何与儿童学习发生联系，因此回看第2段后一句。\n\n`the way actors work`介绍演员的工作方式，而`under RSC artists`要求剧团艺术家亲自指导学生，额外规定了教师身份。原文`which commissioned the study`只说皇家莎士比亚剧团委托了这项研究；委托研究不等于直接担任学生的戏剧教师。`D`把机构与研究的关系改接成艺术家与学生的教学关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-21-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-D-0\"><blockquote>\n<p>排练室教学法要求学生在RSC艺术家指导下学戏剧。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>RSC委托研究是机构与研究的关系，D要求RSC艺术家亲自指导学生，增加了师资身份条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nA study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>排练室教学法要求学生在RSC艺术家指导下学戏剧。</p>\n</blockquote>\n<p><code>under RSC artists</code>说的是谁指导学生，要核对第2段如何介绍<code>Royal Shakespeare Company</code>，以及<code>the way actors work</code>如何与儿童学习发生联系，因此回看第2段后一句。</p>\n<p><code>the way actors work</code>介绍演员的工作方式，而<code>under RSC artists</code>要求剧团艺术家亲自指导学生，额外规定了教师身份。原文<code>which commissioned the study</code>只说皇家莎士比亚剧团委托了这项研究；委托研究不等于直接担任学生的戏剧教师。<code>D</code>把机构与研究的关系改接成艺术家与学生的教学关系。</p>\n</section>"},{"title":"D. study drama under RSC artists","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children's literacy and emotional development. But only if you act him out.\n> A study found that a \"rehearsal room\" approach to teaching Shakespeare broadened children's vocabulary and the complexity of their writing as well as their emotional literacy. \"The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,\" Jacqui O'Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.\n>\n> 这位来自埃文河畔斯特拉特福的文法学校男孩，在学术上有了有力的一击：突破性研究显示莎士比亚确实有益儿童读写能力和情感发展，但前提是把他的作品演出来。\n>\n> 研究发现，教授莎士比亚的排练室方法扩大了儿童词汇、提高写作复杂度及情感素养。委托研究的皇家莎士比亚剧团O'Hanlon说，演员的工作方式显著影响儿童怎样使用语言以及怎样看待自己。\n\n第二段引用机构人士谈演员式方法的作用，第三段介绍分组活动，却没有指派专业演员做老师。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The approach requires pupils to study drama under RSC artists.\n>\n> 排练室教学法要求学生在RSC艺术家指导下学戏剧。\n\nD需要艺术家直接授课的事实。借鉴演员工作方式与由某剧团演员教学，不能互相替代。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"21","option":"D","cumulative":true,"cumulativeGroup":"question-21-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-21-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-21-option-D-0\"><blockquote>\n<p>排练室教学法要求学生在RSC艺术家指导下学戏剧。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>RSC委托研究是机构与研究的关系，D要求RSC艺术家亲自指导学生，增加了师资身份条件。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nA study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>排练室教学法要求学生在RSC艺术家指导下学戏剧。</p>\n</blockquote>\n<p><code>under RSC artists</code>说的是谁指导学生，要核对第2段如何介绍<code>Royal Shakespeare Company</code>，以及<code>the way actors work</code>如何与儿童学习发生联系，因此回看第2段后一句。</p>\n<p><code>the way actors work</code>介绍演员的工作方式，而<code>under RSC artists</code>要求剧团艺术家亲自指导学生，额外规定了教师身份。原文<code>which commissioned the study</code>只说皇家莎士比亚剧团委托了这项研究；委托研究不等于直接担任学生的戏剧教师。<code>D</code>把机构与研究的关系改接成艺术家与学生的教学关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-21-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.\nA study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n<p>这位来自埃文河畔斯特拉特福的文法学校男孩，在学术上有了有力的一击：突破性研究显示莎士比亚确实有益儿童读写能力和情感发展，但前提是把他的作品演出来。</p>\n<p>研究发现，教授莎士比亚的排练室方法扩大了儿童词汇、提高写作复杂度及情感素养。委托研究的皇家莎士比亚剧团O&#39;Hanlon说，演员的工作方式显著影响儿童怎样使用语言以及怎样看待自己。</p>\n</blockquote>\n<p>第二段引用机构人士谈演员式方法的作用，第三段介绍分组活动，却没有指派专业演员做老师。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The approach requires pupils to study drama under RSC artists.</p>\n<p>排练室教学法要求学生在RSC艺术家指导下学戏剧。</p>\n</blockquote>\n<p>D需要艺术家直接授课的事实。借鉴演员工作方式与由某剧团演员教学，不能互相替代。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"21题结论","raw":"### 21题结论\n\n> **21. C**\n\n- A：任务是以Ferdinand身份写漂流瓶信，戏剧活动配合选段开展；没有要求改写现成台词，A另添了写作对象。\n- B：学生要自己参与表演式活动，B把学生改成观看专业演员表演的观众。\n- C：act him out、as Ferdinand和drama-based activity分别给出演绎、角色身份及活动形式，C把它们概括为扮演莎剧角色。\n- D：RSC委托研究是机构与研究的关系，D要求RSC艺术家亲自指导学生，增加了师资身份条件。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"21题","focus":[150,158,1345,378],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"kind":"conclusion","question":"21","questionConclusion":true},"html":"<blockquote>\n<p><strong>21. C</strong></p>\n</blockquote>\n<ul>\n<li>A：任务是以Ferdinand身份写漂流瓶信，戏剧活动配合选段开展；没有要求改写现成台词，A另添了写作对象。</li>\n<li>B：学生要自己参与表演式活动，B把学生改成观看专业演员表演的观众。</li>\n<li>C：act him out、as Ferdinand和drama-based activity分别给出演绎、角色身份及活动形式，C把它们概括为扮演莎剧角色。</li>\n<li>D：RSC委托研究是机构与研究的关系，D要求RSC艺术家亲自指导学生，增加了师资身份条件。</li>\n</ul>\n"},{"title":"22题 · 题干、题型与核心出处","raw":"## 22题\n\n> The study divided the pupils into two groups to find whether ______.\n>\n> 研究把学生分为两组，是为了查明什么？\n\n### 题型\n\n研究目的推断题：将有无戏剧活动这一条件与写作、情感表现这些结果对应。\n\n题干的divided the pupils into two groups直接对应第3段的split into target and control groups。第3段给出分组后学生分别经历的活动，第4段紧接着报告结果；要理解分组所检验的事情，需要把这两段完整读完。\n\n### 核心出处\n\n> They were split into target and control groups\n>\n> The target group was given a 30-minute drama-based activity to accompany the passage\n>\n> used words \"classed as more sophisticated or rarer\" and wrote at greater length","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":2,"meta":{"kind":"question","question":"22","questionIntro":true},"html":"<blockquote>\n<p>The study divided the pupils into two groups to find whether ______.</p>\n<p>研究把学生分为两组，是为了查明什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>研究目的推断题：将有无戏剧活动这一条件与写作、情感表现这些结果对应。</p>\n<p>题干的divided the pupils into two groups直接对应第3段的split into target and control groups。第3段给出分组后学生分别经历的活动，第4段紧接着报告结果；要理解分组所检验的事情，需要把这两段完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>They were split into target and control groups</p>\n<p>The target group was given a 30-minute drama-based activity to accompany the passage</p>\n<p>used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length</p>\n</blockquote>\n"},{"title":"A. the change in instruction enhances learning outcomes","raw":"### A. the change in instruction enhances learning outcomes\n\n> 分组研究检验的是教学变化是否改善学习效果。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。\n\n**出处：**\n\n> The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been \"previously exposed to RSC pedagogy.\" They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\n> The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words \"classed as more sophisticated or rarer\" and wrote at greater length. They also \"appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character's emotion.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>分组研究检验的是教学变化是否改善学习效果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n</section>"},{"title":"A. the change in instruction enhances learning outcomes","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 分组研究检验的是教学变化是否改善学习效果。\n\n两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。\n\n第三段列活动安排，第四段接peer-reviewed results，把干预条件与观察结果连起来。\n\nA的instruction对应戏剧教学，outcomes对应写作和情感表现，保留研究所检验的方向。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>分组研究检验的是教学变化是否改善学习效果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>分组研究检验的是教学变化是否改善学习效果。</p>\n</blockquote>\n<p>两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。</p>\n<p>第三段列活动安排，第四段接peer-reviewed results，把干预条件与观察结果连起来。</p>\n<p>A的instruction对应戏剧教学，outcomes对应写作和情感表现，保留研究所检验的方向。</p>\n</section>"},{"title":"A. the change in instruction enhances learning outcomes","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been \"previously exposed to RSC pedagogy.\" They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\n> The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words \"classed as more sophisticated or rarer\" and wrote at greater length. They also \"appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character's emotion.\"\n>\n> 随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。\n>\n> 经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。\n\n第三段列活动安排，第四段接peer-reviewed results，把干预条件与观察结果连起来。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The study tests whether the change in instruction enhances learning outcomes.\n>\n> 分组研究检验的是教学变化是否改善学习效果。\n\nA的instruction对应戏剧教学，outcomes对应写作和情感表现，保留研究所检验的方向。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"22","option":"A","cumulative":true,"cumulativeGroup":"question-22-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-22-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-A-0\"><blockquote>\n<p>分组研究检验的是教学变化是否改善学习效果。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>分组研究检验的是教学变化是否改善学习效果。</p>\n</blockquote>\n<p>两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。</p>\n<p>第三段列活动安排，第四段接peer-reviewed results，把干预条件与观察结果连起来。</p>\n<p>A的instruction对应戏剧教学，outcomes对应写作和情感表现，保留研究所检验的方向。</p>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n<p>随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n</blockquote>\n<p>第三段列活动安排，第四段接peer-reviewed results，把干预条件与观察结果连起来。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study tests whether the change in instruction enhances learning outcomes.</p>\n<p>分组研究检验的是教学变化是否改善学习效果。</p>\n</blockquote>\n<p>A的instruction对应戏剧教学，outcomes对应写作和情感表现，保留研究所检验的方向。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>"},{"title":"B. expanding vocabulary helps develop reading fluency","raw":"### B. expanding vocabulary helps develop reading fluency\n\n> 分组研究检验的是扩大词汇量是否提高阅读流利度。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n词汇更丰富是观察结果之一，阅读流利度却不是这里的测量任务；B把词汇结果变成原因，又换了结果对象。\n\n**出处：**\n\n> The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not b  to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n</section>"},{"title":"B. expanding vocabulary helps develop reading fluency","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 分组研究检验的是扩大词汇量是否提高阅读流利度。\n\n词汇更丰富是观察结果之一，阅读流利度却不是这里的测量任务；B把词汇结果变成原因，又换了结果对象。\n\n研究改变的是有无戏剧活动，观察的是两组写作及人物情感表达。\n\nB需要先改变词汇量、再检查阅读流畅程度的设计。实际write与reading fluency不同，不能因都属语言学习就混用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"22","option":"B","cumulative":true,"cumulativeGroup":"question-22-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-B-0\"><blockquote>\n<p>分组研究检验的是扩大词汇量是否提高阅读流利度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>词汇更丰富是观察结果之一，阅读流利度却不是这里的测量任务；B把词汇结果变成原因，又换了结果对象。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselv ion>"},{"title":"C. emotion affects understanding of sophisticated works","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 分组研究检验的是情绪是否影响对复杂作品的理解。\n\n`emotion affects understanding`要核对情绪与理解的关系，其中`emotion`在第4段对应`express that character’s emotion`；但`C`还把情绪放在影响理解的起点，因此同时回看第3段目标组的`drama-based activity`，检查研究改变的究竟是什么、情感又在结果中起什么作用。\n\n原文先给目标组安排`drama-based activity`，后面报告他们能站在文学人物的立场并`express that character’s emotion`。情感在这里是学生尝试体会和表达的内容，研究观察的是活动之后学生能怎样表达角色。\n\n`C`的`emotion affects understanding`却把情绪当成导致理解变化的原因，并把结果写成对复杂作品的理解。\n\n这不是把同一结果换个说法，而是将角色的情感表达改成了情绪对阅读理解的影响。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-C-0\"><blockquote>\n<p>分组研究检验的是情绪是否影响对复杂作品的理解。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>人物情感是学生要体会和表达的内容，C将情绪改成影响复杂作品理解的原因。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>分组研究检验的是情绪是否影响对复杂作品的理解。</p>\n</blockquote>\n<p><code>emotion affects understanding</code>要核对情绪与理解的关系，其中<code>emotion</code>在第4段对应<code>express that character’s emotion</code>；但<code>C</code>还把情绪放在影响理解的起点，因此同时回看第3段目标组的<code>drama-based activity</code>，检查研究改变的究竟是什么、情感又在结果中起什么作用。</p>\n<p>原文先给目标组安排<code>drama-based activity</code>，后面报告他们能站在文学人物的立场并<code>express that character’s emotion</code>。情感在这里是学生尝试体会和表达的内容，研究观察的是活动之后学生能怎样表达角色。</p>\n<p><code>C</code>的<code>emotion affects understanding</code>却把情绪当成导致理解变化的原因，并把结果写成对复杂作品的理解。</p>\n<p>这不是把同一结果换个说法，而是将角色的情感表达改成了情绪对阅读理解的影响。</p>\n</section>"},{"title":"C. emotion affects understanding of sophisticated works","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been \"previously exposed to RSC pedagogy.\" They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\n> The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words \"classed as more sophisticated or rarer\" and wrote at greater length. They also \"appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character's emotion.\"\n>\n> 随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。\n>\n> 经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。\n\n戏剧活动在前，能否进入人物并表达其情感在后，情感理解属于观察到的表现。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The study tests whether emotion affects understanding of sophisticated works.\n>\n> 分组研究检验的是情绪是否影响对复杂作品的理解。\n\nC需要按情绪差异比较理解效果；现有分组按教学活动设立，没有建立情绪导致阅读理解变化的检验关系。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"22","option":"C","cumulative":true,"cumulativeGroup":"question-22-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-22-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-C-0\"><blockquote>\n<p>分组研究检验的是情绪是否影响对复杂作品的理解。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>人物情感是学生要体会和表达的内容，C将情绪改成影响复杂作品理解的原因。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>分组研究检验的是情绪是否影响对复杂作品的理解。</p>\n</blockquote>\n<p><code>emotion affects understanding</code>要核对情绪与理解的关系，其中<code>emotion</code>在第4段对应<code>express that character’s emotion</code>；但<code>C</code>还把情绪放在影响理解的起点，因此同时回看第3段目标组的<code>drama-based activity</code>，检查研究改变的究竟是什么、情感又在结果中起什么作用。</p>\n<p>原文先给目标组安排<code>drama-based activity</code>，后面报告他们能站在文学人物的立场并<code>express that character’s emotion</code>。情感在这里是学生尝试体会和表达的内容，研究观察的是活动之后学生能怎样表达角色。</p>\n<p><code>C</code>的<code>emotion affects understanding</code>却把情绪当成导致理解变化的原因，并把结果写成对复杂作品的理解。</p>\n<p>这不是把同一结果换个说法，而是将角色的情感表达改成了情绪对阅读理解的影响。</p>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n<p>随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n</blockquote>\n<p>戏剧活动在前，能否进入人物并表达其情感在后，情感理解属于观察到的表现。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study tests whether emotion affects understanding of sophisticated works.</p>\n<p>分组研究检验的是情绪是否影响对复杂作品的理解。</p>\n</blockquote>\n<p>C需要按情绪差异比较理解效果；现有分组按教学活动设立，没有建立情绪导致阅读理解变化的检验关系。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. the classroom activity stimulates interest in the arts","raw":"### D. the classroom activity stimulates interest in the arts\n\n> 分组研究检验的是课堂活动是否激发艺术兴趣。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第三类——无中生有。**\n\n戏剧活动确是课堂安排，但结果比较词汇、篇幅与人物情感，未调查学生是否更喜欢艺术。\n\n**出处：**\n\n> The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been \"previously exposed to RSC pedagogy.\" They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\n> The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words \"classed as more sophisticated or rarer\" and wrote at greater length. They also \"appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character's emotion.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-22-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-D-0\"><blockquote>\n<p>分组研究检验的是课堂活动是否激发艺术兴趣。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>戏剧活动确是课堂安排，但结果比较词汇、篇幅与人物情感，未调查学生是否更喜欢艺术。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n</section>"},{"title":"D. the classroom activity stimulates interest in the arts","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 分组研究检验的是课堂活动是否激发艺术兴趣。\n\n`classroom activity`可接到第3段的`drama-based activity`，`interest in the arts`说的是学生对艺术的兴趣，而第4段的`express that character’s emotion`说的是表达角色的情感；回看这句，检查研究比较的是学生喜欢什么，还是他们写作时表现出了什么。\n\n原文的确给目标组安排了`drama-based activity`，但分组后的结果是在比较用词、篇幅以及表达文学人物情感的表现。`D`保留了课堂活动这个起点，却把结果改成`interest in the arts`，即学生对艺术是否产生更大兴趣。能够写得更长、表达角色的情感，和学生是否更喜欢艺术，是不同的观察内容；尤其`express that character’s emotion`的对象是作品中人物的情感，并不是学生自己对艺术的喜爱。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-22-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-D-0\"><blockquote>\n<p>分组研究检验的是课堂活动是否激发艺术兴趣。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>戏剧活动确是课堂安排，但结果比较词汇、篇幅与人物情感，未调查学生是否更喜欢艺术。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>分组研究检验的是课堂活动是否激发艺术兴趣。</p>\n</blockquote>\n<p><code>classroom activity</code>可接到第3段的<code>drama-based activity</code>，<code>interest in the arts</code>说的是学生对艺术的兴趣，而第4段的<code>express that character’s emotion</code>说的是表达角色的情感；回看这句，检查研究比较的是学生喜欢什么，还是他们写作时表现出了什么。</p>\n<p>原文的确给目标组安排了<code>drama-based activity</code>，但分组后的结果是在比较用词、篇幅以及表达文学人物情感的表现。<code>D</code>保留了课堂活动这个起点，却把结果改成<code>interest in the arts</code>，即学生对艺术是否产生更大兴趣。能够写得更长、表达角色的情感，和学生是否更喜欢艺术，是不同的观察内容；尤其<code>express that character’s emotion</code>的对象是作品中人物的情感，并不是学生自己对艺术的喜爱。</p>\n</section>"},{"title":"D. the classroom activity stimulates interest in the arts","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been \"previously exposed to RSC pedagogy.\" They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\n> The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words \"classed as more sophisticated or rarer\" and wrote at greater length. They also \"appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character's emotion.\"\n>\n> 随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。\n>\n> 经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。\n\n研究从30分钟活动转到写作表现，用不同指标说明学习变化。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The study tests whether the classroom activity stimulates interest in the arts.\n>\n> 分组研究检验的是课堂活动是否激发艺术兴趣。\n\nD只保留起点，换掉了结果。能表达角色情绪不等于自己对艺术的兴趣增加。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"22","option":"D","cumulative":true,"cumulativeGroup":"question-22-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-22-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-22-option-D-0\"><blockquote>\n<p>分组研究检验的是课堂活动是否激发艺术兴趣。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>戏剧活动确是课堂安排，但结果比较词汇、篇幅与人物情感，未调查学生是否更喜欢艺术。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>分组研究检验的是课堂活动是否激发艺术兴趣。</p>\n</blockquote>\n<p><code>classroom activity</code>可接到第3段的<code>drama-based activity</code>，<code>interest in the arts</code>说的是学生对艺术的兴趣，而第4段的<code>express that character’s emotion</code>说的是表达角色的情感；回看这句，检查研究比较的是学生喜欢什么，还是他们写作时表现出了什么。</p>\n<p>原文的确给目标组安排了<code>drama-based activity</code>，但分组后的结果是在比较用词、篇幅以及表达文学人物情感的表现。<code>D</code>保留了课堂活动这个起点，却把结果改成<code>interest in the arts</code>，即学生对艺术是否产生更大兴趣。能够写得更长、表达角色的情感，和学生是否更喜欢艺术，是不同的观察内容；尤其<code>express that character’s emotion</code>的对象是作品中人物的情感，并不是学生自己对艺术的喜爱。</p>\n</section><section class=\"revealPart\" id=\"focus-question-22-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.\nThe peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n<p>随机对照试验涉及45所公立小学数百名九至十岁的五年级学生，他们此前没有接触过RSC教学法。学生分为目标组和对照组，完成例如以《暴风雨》沉船后的Ferdinand身份写漂流瓶信的任务。目标组另参加30分钟与选段配合的戏剧活动。</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n</blockquote>\n<p>研究从30分钟活动转到写作表现，用不同指标说明学习变化。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The study tests whether the classroom activity stimulates interest in the arts.</p>\n<p>分组研究检验的是课堂活动是否激发艺术兴趣。</p>\n</blockquote>\n<p>D只保留起点，换掉了结果。能表达角色情绪不等于自己对艺术的兴趣增加。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"22题结论","raw":"### 22题结论\n\n> **22. A**\n\n- A：两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。\n- B：词汇更丰富是观察结果之一，阅读流利度却不是这里的测量任务；B把词汇结果变成原因，又换了结果对象。\n- C：人物情感是学生要体会和表达的内容，C将情绪改成影响复杂作品理解的原因。\n- D：戏剧活动确是课堂安排，但结果比较词汇、篇幅与人物情感，未调查学生是否更喜欢艺术。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"22题","focus":[150,536,1345,378],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"kind":"conclusion","question":"22","questionConclusion":true},"html":"<blockquote>\n<p><strong>22. A</strong></p>\n</blockquote>\n<ul>\n<li>A：两组完成写作，目标组另有30分钟戏剧活动，随后比较词汇、篇幅和角色情感表达；A概括教学改变是否改善学习。</li>\n<li>B：词汇更丰富是观察结果之一，阅读流利度却不是这里的测量任务；B把词汇结果变成原因，又换了结果对象。</li>\n<li>C：人物情感是学生要体会和表达的内容，C将情绪改成影响复杂作品理解的原因。</li>\n<li>D：戏剧活动确是课堂安排，但结果比较词汇、篇幅与人物情感，未调查学生是否更喜欢艺术。</li>\n</ul>\n"},{"title":"23题 · 题干、题型与核心出处","raw":"## 23题\n\n> Control pupils’ reliance on “desert island clichés” shows their ______.\n>\n> 对照组学生依赖‘荒岛陈词滥调’，显示出他们的什么特点？\n\n### 题型\n\n细节推断题：用套话与丰富画面的对照判断描写表现，不混用另一组的词汇结果。\n\n题干的Control pupils与desert island clichés都直接出现在第5段。这一段用while把对照组和目标组的描写并列比较，先完整读完第5段。\n\n### 核心出处\n\n> control pupils relied on desert island clichés such as palm trees\n>\n> target pupils were \"more expansive giving a broader picture of the sky, the sea and the atmospheric conditions\n>\n> a broader picture of the sky, the sea and the atmospheric conditions","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,914,1345,378],"sourceW":1625,"sourceH":2263},"level":2,"meta":{"kind":"question","question":"23","questionIntro":true},"html":"<blockquote>\n<p>Control pupils’ reliance on “desert island clichés” shows their ______.</p>\n<p>对照组学生依赖‘荒岛陈词滥调’，显示出他们的什么特点？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节推断题：用套话与丰富画面的对照判断描写表现，不混用另一组的词汇结果。</p>\n<p>题干的Control pupils与desert island clichés都直接出现在第5段。这一段用while把对照组和目标组的描写并列比较，先完整读完第5段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>control pupils relied on desert island clichés such as palm trees</p>\n<p>target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions</p>\n<p>a broader picture of the sky, the sea and the atmospheric conditions</p>\n</blockquote>\n"},{"title":"A. weakness in description","raw":"### A. weakness in description\n\n> 对照组依赖荒岛套话，显示出描写方面的不足。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n对照组套用棕榈树等荒岛老写法，目标组展开天空、海洋和天气，A概括前者描写不够丰富的不足。\n\n**出处：**\n\n> The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were \"more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,914,1345,378],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"23","option":"A","cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-A-0\"><blockquote>\n<p>对照组依赖荒岛套话，显示出描写方面的不足。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>对照组套用棕榈树等荒岛老写法，目标组展开天空、海洋和天气，A概括前者描写不够丰富的不足。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on nd the atmospheric conditions.\"\n>\n> Time to Act研究还发现，对照组依赖棕榈树等荒岛套话，目标组描写更充分，给出天空、海洋和大气状况的更广阔画面。\n\n天空、海洋、大气状况说明目标组描写更广，作为对照展示画面丰富程度。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> The use of clichés shows the pupils’ omission of small details.\n>\n> 对照组依赖荒岛套话，显示他们遗漏细小细节。\n\nB需要应写却未写的细节清单或遗漏判断。广度较窄不能直接证明small details被省略。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,914,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"23","option":"B","cumulative":true,"cumulativeGroup":"question-23-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-B-0\"><blockquote>\n<p>对照组依赖荒岛套话，显示他们遗漏细小细节。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文比较固定套话与更广场景，未说遗漏了某些必须写的小细节。B把展开不足具体化成漏写细节。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>对照组依赖荒岛套话，显示他们遗漏细小细节。</p>\n</blockquote>\n<p><code>small details</code>涉及描写内容，第5段的<code>a broader picture</code>也谈画面内容，所以回看<code>clichés</code>与目标组描写天空、海洋的对照，核对原文指出的是怎样一种不足。</p>\n<p>原文用树这一类套话与天空、海洋等更广阔的画面作对照，指出对照组依赖固定写法，写景内容没有像目标组那样铺展开。<code>B</code>的<code>omission of small details</code>却进一步认定他们漏写了细小细节，把描写倚重套话、画面展开有限，改成了具体内容被遗漏。<code>a broader picture</code>比较的是所呈现场景的广度；原文列出的天空和海洋也不是一份供核对遗漏细节的清单，因此不能由这组对照直接得出<code>small details</code>被省略。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n<p>Time to Act研究还发现，对照组依赖棕榈树等荒岛套话，目标组描写更充分，给出天空、海洋和大气状况的更广阔画面。</p>\n</blockquote>\n<p>天空、海洋、大气状况说明目标组描写更广，作为对照展示画面丰富程度。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The use of clichés shows the pupils’ omission of small details.</p>\n<p>对照组依赖荒岛套话，显示他们遗漏细小细节。</p>\n</blockquote>\n<p>B需要应写却未写的细节清单或遗漏判断。广度较窄不能直接证明small details被省略。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. casual style of writing","raw":"### C. casual style of writing\n\n> 对照组依赖荒岛套话，显示其写作风格随意。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第三类——无中生有。**\n\nclichés是陈旧套话，不是casual所指轻松随意语体；场景展开程度也不是正式与随意的风格比较。\n\n**出处：**\n\n> The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were \"more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,914,1345,378],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-C-0\"><blockquote>\n<p>对照组依赖荒岛套话，显示其写作风格随意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>clichés是陈旧套话，不是casual所指轻松随意语体；场景展开程度也不是正式与随意的风格比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n</blockquote>\n</section>"},{"title":"C. casual style of writing","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 对照组依赖荒岛套话，显示其写作风格随意。\n\n`casual style of writing`是在评价行文风格，第5段的`relied on` “`desert island clichés`”则评价他们如何描写荒岛，回看这句以及`more expansive`的对照，核对这项风格判断。\n\n原文说对照组`relied on` “`desert island clichés`”，即写荒岛时倚重现成套话，随后与更开阔的场景描写作比较。`C`的`casual style of writing`却将其概括为随意、不拘形式的行文风格。依赖套话说明表达沿用了固定写法，不能据此判定整篇文字是否采用轻松随意的语体；目标组`more expansive`比较的也是描写是否展开，并非两组行文正式或随意的程度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,914,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-23-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-C-0\"><blockquote>\n<p>对照组依赖荒岛套话，显示其写作风格随意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>clichés是陈旧套话，不是casual所指轻松随意语体；场景展开程度也不是正式与随意的风格比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>对照组依赖荒岛套话，显示其写作风格随意。</p>\n</blockquote>\n<p><code>casual style of writing</code>是在评价行文风格，第5段的<code>relied on</code> “<code>desert island clichés</code>”则评价他们如何描写荒岛，回看这句以及<code>more expansive</code>的对照，核对这项风格判断。</p>\n<p>原文说对照组<code>relied on</code> “<code>desert island clichés</code>”，即写荒岛时倚重现成套话，随后与更开阔的场景描写作比较。<code>C</code>的<code>casual style of writing</code>却将其概括为随意、不拘形式的行文风格。依赖套话说明表达沿用了固定写法，不能据此判定整篇文字是否采用轻松随意的语体；目标组<code>more expansive</code>比较的也是描写是否展开，并非两组行文正式或随意的程度。</p>\n</section>"},{"title":"C. casual style of writing","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were \"more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.\"\n>\n> Time to Act研究还发现，对照组依赖棕榈树等荒岛套话，目标组描写更充分，给出天空、海洋和大气状况的更广阔画面。\n\n原段从对照组固定表达转到目标组较开阔画面，比较的是描写内容。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The use of clichés shows the pupils’ casual style of writing.\n>\n> 对照组依赖荒岛套话，显示其写作风格随意。\n\nC需要行文语体依据。沿用老套表达的人也可能写得很正式，不能由套话推出随意风格。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,914,1345,378],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"23","option":"C","cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-23-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-C-0\"><blockquote>\n<p>对照组依赖荒岛套话，显示其写作风格随意。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>clichés是陈旧套话，不是casual所指轻松随意语体；场景展开程度也不是正式与随意的风格比较。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>对照组依赖荒岛套话，显示其写作风格随意。</p>\n</blockquote>\n<p><code>casual style of writing</code>是在评价行文风格，第5段的<code>relied on</code> “<code>desert island clichés</code>”则评价他们如何描写荒岛，回看这句以及<code>more expansive</code>的对照，核对这项风格判断。</p>\n<p>原文说对照组<code>relied on</code> “<code>desert island clichés</code>”，即写荒岛时倚重现成套话，随后与更开阔的场景描写作比较。<code>C</code>的<code>casual style of writing</code>却将其概括为随意、不拘形式的行文风格。依赖套话说明表达沿用了固定写法，不能据此判定整篇文字是否采用轻松随意的语体；目标组<code>more expansive</code>比较的也是描写是否展开，并非两组行文正式或随意的程度。</p>\n</section><section class=\"revealPart\" id=\"focus-question-23-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n<p>Time to Act研究还发现，对照组依赖棕榈树等荒岛套话，目标组描写更充分，给出天空、海洋和大气状况的更广阔画面。</p>\n</blockquote>\n<p>原段从对照组固定表达转到目标组较开阔画面，比较的是描写内容。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The use of clichés shows the pupils’ casual style of writing.</p>\n<p>对照组依赖荒岛套话，显示其写作风格随意。</p>\n</blockquote>\n<p>C需要行文语体依据。沿用老套表达的人也可能写得很正式，不能由套话推出随意风格。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. preference for big words","raw":"### D. preference for big words\n\n> 对照组依赖荒岛套话，显示他们偏爱大词。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n复杂或罕见词是第四段目标组的表现，本题却问对照组荒岛套话，不能推出对照组偏爱大词。\n\n**出处：**\n\n> The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were \"more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"23题","focus":[150,914,1345,378],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"23","option":"D","cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-23-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-23-option-D-0\"><blockquote>\n<p>对照组依赖荒岛套话，显示他们偏爱大词。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>复杂或罕见词是第四段目标组的表现，本题却问对照组荒岛套话，不能推出对照组偏爱大词。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils we 解与排练室过程的联系。先完整读完第6段，连同她描述儿童表现和解释戏剧活动的部分。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>emotional literacy that was evident in the [target] children’s writing</p>\n<p>it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through</p>\n<p>They were comfortable in describing different emotional states</p>\n</blockquote>\n"},{"title":"A. Writing in an imaginative manner.","raw":"### A. Writing in an imaginative manner.\n\n> 能够促进儿童情感素养的做法是以富有想象力的方式写作。\n\n**做题模式中的状态：** 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。\n\n**错误类型：第一类——歪曲原意。**\n\n想象与写作在文中确实有关，但O'Hanlon更具体地解释为站到他人立场体会情感，一般想象性写作没有B贴切。\n\n**出处：**\n\n> The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words \"classed as more sophisticated or rarer\" and wrote at greater length. They also \"appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character's emotion.\"\n> O'Hanlon said she had been most surprised by the \"emotional literacy that was evident in the [target] children's writing and that they were \"more resilient in their writing, more hopeful.\" She added: \"The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.\" The study showed the importance of embedding arts in education, she said.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1292,1345,379],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><blockquote>\n<p>能够促进儿童情感素养的做法是以富有想象力的方式写作。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>想象与写作在文中确实有关，但O&#39;Hanlon更具体地解释为站到他人立场体会情感，一般想象性写作没有B贴切。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n</blockquote>\n</section>"},{"title":"A. Writing in an imaginative manner.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 能够促进儿童情感素养的做法是以富有想象力的方式写作。\n\n想象与写作在文中确实有关，但O'Hanlon更具体地解释为站到他人立场体会情感，一般想象性写作没有B贴切。\n\n她先描述目标组写作中的情感素养，再用排练过程和put yourself in different shoes说明可能机制。\n\nA不是与材料完全无关，而是范围太宽：只想象自己遭遇沉船的对照组也会想象，关键区别在是否进入文学人物。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1292,1345,379],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeG ginative manner.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words \"classed as more sophisticated or rarer\" and wrote at greater length. They also \"appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character's emotion.\"\n> O'Hanlon said she had been most surprised by the \"emotional literacy that was evident in the [target] children's writing and that they were \"more resilient in their writing, more hopeful.\" She added: \"The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.\" The study showed the importance of embedding arts in education, she said.\n>\n> 经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。\n>\n> O'Hanlon说，最令她惊讶的是目标组写作中明显的情感素养，他们的文字更有韧性、更有希望。她说，情感理解很明显，可能与排练过程有关，人们在其中习惯通过想象进入处境。他们能自如描述不同情感状态，戏剧的一部分就是设身处地。她认为研究说明了将艺术融入教育的重要性。\n\n她先描述目标组写作中的情感素养，再用排练过程和put yourself in different shoes说明可能机制。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Writing in an imaginative manner can promote children’s emotional literacy.\n>\n> 能够促进儿童情感素养的做法是以富有想象力的方式写作。\n\nA不是与材料完全无关，而是范围太宽：只想象自己遭遇沉船的对照组也会想象，关键区别在是否进入文学人物。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1292,1345,379],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"24","option":"A","cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-A-0\"><block ed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n<p>O&#39;Hanlon说，最令她惊讶的是目标组写作中明显的情感素养，他们的文字更有韧性、更有希望。她说，情感理解很明显，可能与排练过程有关，人们在其中习惯通过想象进入处境。他们能自如描述不同情感状态，戏剧的一部分就是设身处地。她认为研究说明了将艺术融入教育的重要性。</p>\n</blockquote>\n<p>她先描述目标组写作中的情感素养，再用排练过程和put yourself in different shoes说明可能机制。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Writing in an imaginative manner can promote children’s emotional literacy.</p>\n<p>能够促进儿童情感素养的做法是以富有想象力的方式写作。</p>\n</blockquote>\n<p>A不是与材料完全无关，而是范围太宽：只想象自己遭遇沉船的对照组也会想象，关键区别在是否进入文学人物。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. Identifying with literary characters.","raw":"### B. Identifying with literary characters.\n\n> 能够促进儿童情感素养的做法是设身处地体会文学人物。\n\n**做题模式中的状态：** 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\nput yourself in different shoes与第四段in the shoes of a literary character都说站在人物立场，B直接对应情感理解的解释。\n\n**出处：**\n\n> The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words \"classed as more sophisticated or rarer\" and wrote at greater length. They also \"appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character's emotion.\"\n> O'Hanlon said she had been most surprised by the \"emotional literacy that was evident in the [target] children's writing and that they were \"more resilient in their writing, more hopeful.\" She added: \"The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.\" The study showed the importance of embedding arts in education, she said.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1292,1345,379],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"24","option":"B","cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-24-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-B-0\"><blockquote>\n<p>能够促进儿童情感素养的做法是设身处地体会文学人物。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>put yourself in different shoes与第四段in the shoes of a literary character都说站在人物立场，B直接对应情感理解的解释。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shi 排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>文学人物情境与现实经验可以相关，但原文强调换到角色立场；D把做法改为专注现实生活情境。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n</blockquote>\n</section>"},{"title":"D. Concentrating on real-life situations.","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 能够促进儿童情感素养的做法是专注现实生活情境。\n\n`real-life situations`涉及学生应把注意力放在哪里，第6段用`put yourself in different shoes`解释活动，第4段又明确给出`a literary character`，回看这两句，核对她要求学生进入的具体情境和立场。\n\n原文中的学生通过排练和想象进入别人的处境，第4段还明确把这一对象写成`a literary character`，任务是表达人物的情感。`D`的`Concentrating on real-life situations`则把促进方式说成专注于现实生活情境，强调现实情境本身。文学人物的情感当然可以与现实经验相关，但原文解释的活动不是集中注意现实生活，而是换到人物的立场去理解和表达；`D`替换了这里具体采用的情境与做法。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1292,1345,379],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"kind":"method"},"foc
