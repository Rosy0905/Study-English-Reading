活，而是换到人物的立场去理解和表达；<code>D</code>替换了这里具体采用的情境与做法。</p>\n</section>"},{"title":"D. Concentrating on real-life situations.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words \"classed as more sophisticated or rarer\" and wrote at greater length. They also \"appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character's emotion.\"\n> O'Hanlon said she had been most surprised by the \"emotional literacy that was evident in the [target] children's writing and that they were \"more resilient in their writing, more hopeful.\" She added: \"The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.\" The study showed the importance of embedding arts in education, she said.\n>\n> 经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。\n>\n> O'Hanlon说，最令她惊讶的是目标组写作中明显的情感素养，他们的文字更有韧性、更有希望。她说，情感理解很明显，可能与排练过程有关，人们在其中习惯通过想象进入处境。他们能自如描述不同情感状态，戏剧的一部分就是设身处地。她认为研究说明了将艺术融入教育的重要性。\n\n第四段特意区分自己会如何反应与文学人物情绪，第六段沿用换位解释。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Concentrating on real-life situations can promote children’s emotional literacy.\n>\n> 能够促进儿童情感素养的做法是专注现实生活情境。\n\nD需要现实情境本身作为促进方式的依据。理解角色可能借助生活经验，却不等于研究以专注现实生活为核心方法。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1292,1345,379],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"24","option":"D","cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-24-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-24-option-D-0\"><blockquote>\n<p>能够促进儿童情感素养的做法是专注现实生活情境。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>文学人物情境与现实经验可以相关，但原文强调换到角色立场；D把做法改为专注现实生活情境。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>能够促进儿童情感素养的做法是专注现实生活情境。</p>\n</blockquote>\n<p><code>real-life situations</code>涉及学生应把注意力放在哪里，第6段用<code>put yourself in different shoes</code>解释活动，第4段又明确给出<code>a literary character</code>，回看这两句，核对她要求学生进入的具体情境和立场。</p>\n<p>原文中的学生通过排练和想象进入别人的处境，第4段还明确把这一对象写成<code>a literary character</code>，任务是表达人物的情感。<code>D</code>的<code>Concentrating on real-life situations</code>则把促进方式说成专注于现实生活情境，强调现实情境本身。文学人物的情感当然可以与现实经验相关，但原文解释的活动不是集中注意现实生活，而是换到人物的立场去理解和表达；<code>D</code>替换了这里具体采用的情境与做法。</p>\n</section><section class=\"revealPart\" id=\"focus-question-24-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;\nO&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n<p>经同行评审的结果显示，目标组用词更广，使用被归为更复杂或更罕见的词，并写得更长。他们似乎也更自在地以角色身份写作：对照组想象自己遭遇沉船会如何反应，目标组则站在文学人物立场，表达那个人物的情绪。</p>\n<p>O&#39;Hanlon说，最令她惊讶的是目标组写作中明显的情感素养，他们的文字更有韧性、更有希望。她说，情感理解很明显，可能与排练过程有关，人们在其中习惯通过想象进入处境。他们能自如描述不同情感状态，戏剧的一部分就是设身处地。她认为研究说明了将艺术融入教育的重要性。</p>\n</blockquote>\n<p>第四段特意区分自己会如何反应与文学人物情绪，第六段沿用换位解释。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Concentrating on real-life situations can promote children’s emotional literacy.</p>\n<p>能够促进儿童情感素养的做法是专注现实生活情境。</p>\n</blockquote>\n<p>D需要现实情境本身作为促进方式的依据。理解角色可能借助生活经验，却不等于研究以专注现实生活为核心方法。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"24题结论","raw":"### 24题结论\n\n> **24. B**\n\n- A：想象与写作在文中确实有关，但O'Hanlon更具体地解释为站到他人立场体会情感，一般想象性写作没有B贴切。\n- B：put yourself in different shoes与第四段in the shoes of a literary character都说站在人物立场，B直接对应情感理解的解释。\n- C：天空和海洋是写作更丰富的表现，不是O'Hanlon解释情感发展时提出的灵感来源，C将结果素材变成原因。\n- D：文学人物情境与现实经验可以相关，但原文强调换到角色立场；D把做法改为专注现实生活情境。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"24题","focus":[150,1292,1345,379],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"kind":"conclusion","question":"24","questionConclusion":true},"html":"<blockquote>\n<p><strong>24. B</strong></p>\n</blockquote>\n<ul>\n<li>A：想象与写作在文中确实有关，但O&#39;Hanlon更具体地解释为站到他人立场体会情感，一般想象性写作没有B贴切。</li>\n<li>B：put yourself in different shoes与第四段in the shoes of a literary character都说站在人物立场，B直接对应情感理解的解释。</li>\n<li>C：天空和海洋是写作更丰富的表现，不是O&#39;Hanlon解释情感发展时提出的灵感来源，C将结果素材变成原因。</li>\n<li>D：文学人物情境与现实经验可以相关，但原文强调换到角色立场；D把做法改为专注现实生活情境。</li>\n</ul>\n"},{"title":"25题 · 题干、题型与核心出处","raw":"## 25题\n\n> It can be inferred from the last paragraph that ______.\n>\n> 从最后一段可以推断出什么？\n\n### 题型\n\n有限推断题：保留may与尚待研究，区分可能优势、课程安排及学生意愿。\n\n题干直接限定last paragraph，定位到第7段。先把这一段关于其他剧作家、莎士比亚的词汇量以及儿童身体参与的内容完整读完。\n\n### 核心出处\n\n> But could the results be replicated with any old dramatist?\n>\n> O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words\n>\n> gave a “massive expansion of language into children’s lives”","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1671,1345,407],"sourceW":1625,"sourceH":2263},"level":2,"meta":{"kind":"question","question":"25","questionIntro":true},"html":"<blockquote>\n<p>It can be inferred from the last paragraph that ______.</p>\n<p>从最后一段可以推断出什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>有限推断题：保留may与尚待研究，区分可能优势、课程安排及学生意愿。</p>\n<p>题干直接限定last paragraph，定位到第7段。先把这一段关于其他剧作家、莎士比亚的词汇量以及儿童身体参与的内容完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>But could the results be replicated with any old dramatist?</p>\n<p>O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words</p>\n<p>gave a “massive expansion of language into children’s lives”</p>\n</blockquote>\n"},{"title":"A. the new teaching method may work best with Shakespeare","raw":"### A. the new teaching method may work best with Shakespeare\n\n> 最后一段可推知：新教学法可能与莎士比亚配合得最好。\n\n**做题模式中的状态：** 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\n换其他剧作家能否复制结果仍待研究，随后特别强调莎士比亚丰富语言与身体演绎的结合，支持A保留可能性的推断。\n\n**出处：**\n\n> But could the results be replicated with any old dramatist? O'Hanlon said more research would be needed but suggested that Shakespeare's use of 20,000 words, compared with the everyday 2,000 words, gave a \"massive expansion of language into children's lives,\" which was combined with children \"using their whole bodies to bring words to life.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1671,1345,407],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>最后一段可推知：新教学法可能与莎士比亚配合得最好。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>换其他剧作家能否复制结果仍待研究，随后特别强调莎士比亚丰富语言与身体演绎的结合，支持A保留可能性的推断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n</section>"},{"title":"A. the new teaching method may work best with Shakespeare","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 最后一段可推知：新教学法可能与莎士比亚配合得最好。\n\n`may work best with Shakespeare`涉及方法能否同样用于其他剧作家，正好对应段首的`any old dramatist`；随后`Shakespeare’s use of 20,000 words`给出她特别谈到莎士比亚的理由，因此连着回看提问、保留态度和词汇量解释。\n\n原文先问换成别的剧作家能否重现结果，回答是还需要更多研究；但她接着指出`Shakespeare’s use of 20,000 words`相较日常2,000个词给儿童带来大量语言扩展。词汇数字不是莎士比亚与其他剧作家的排名，不能据此断言他已被证明最好。\n\n不过，在是否可任意替换作者的问题下，作者特别提出莎士比亚丰富语言的作用，支持他与这种方法可能有很好的配合。\n\n`A`说`may work best`，保留了‘可能’，没有把待研究的比较说成已经证实的结论。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1671,1345,407],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>最后一段可推知：新教学法可能与莎士比亚配合得最好。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>换其他剧作家能否复制结果仍待研究，随后特别强调莎士比亚丰富语言与身体演绎的结合，支持A保留可能性的推断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知：新教学法可能与莎士比亚配合得最好。</p>\n</blockquote>\n<p><code>may work best with Shakespeare</code>涉及方法能否同样用于其他剧作家，正好对应段首的<code>any old dramatist</code>；随后<code>Shakespeare’s use of 20,000 words</code>给出她特别谈到莎士比亚的理由，因此连着回看提问、保留态度和词汇量解释。</p>\n<p>原文先问换成别的剧作家能否重现结果，回答是还需要更多研究；但她接着指出<code>Shakespeare’s use of 20,000 words</code>相较日常2,000个词给儿童带来大量语言扩展。词汇数字不是莎士比亚与其他剧作家的排名，不能据此断言他已被证明最好。</p>\n<p>不过，在是否可任意替换作者的问题下，作者特别提出莎士比亚丰富语言的作用，支持他与这种方法可能有很好的配合。</p>\n<p><code>A</code>说<code>may work best</code>，保留了‘可能’，没有把待研究的比较说成已经证实的结论。</p>\n</section>"},{"title":"A. the new teaching method may work best with Shakespeare","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But could the results be replicated with any old dramatist? O'Hanlon said more research would be needed but suggested that Shakespeare's use of 20,000 words, compared with the everyday 2,000 words, gave a \"massive expansion of language into children's lives,\" which was combined with children \"using their whole bodies to bring words to life.\"\n>\n> 但换成随便哪个剧作家都能复制结果吗？O'Hanlon说还需要更多研究，但莎士比亚使用两万个词，相比日常的两千个词，给儿童生活带来巨大语言扩展，又结合了儿童用全身把词语演活的参与方式。\n\nBut先问效果能否泛化，more research保留结论，but suggested再给这位作家可能有优势的理由。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The new teaching method may work best with Shakespeare.\n>\n> 最后一段可推知：新教学法可能与莎士比亚配合得最好。\n\nmay work best不能改成已证明最好；20,000对2,000比较的是莎剧与日常词汇，并非作家排名，但在替换作者的问题下仍支持这种可能。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1671,1345,407],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"25","option":"A","cumulative":true,"cumulativeGroup":"question-25-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-A-0\"><blockquote>\n<p>最后一段可推知：新教学法可能与莎士比亚配合得最好。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时A尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>换其他剧作家能否复制结果仍待研究，随后特别强调莎士比亚丰富语言与身体演绎的结合，支持A保留可能性的推断。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知：新教学法可能与莎士比亚配合得最好。</p>\n</blockquote>\n<p><code>may work best with Shakespeare</code>涉及方法能否同样用于其他剧作家，正好对应段首的<code>any old dramatist</code>；随后<code>Shakespeare’s use of 20,000 words</code>给出她特别谈到莎士比亚的理由，因此连着回看提问、保留态度和词汇量解释。</p>\n<p>原文先问换成别的剧作家能否重现结果，回答是还需要更多研究；但她接着指出<code>Shakespeare’s use of 20,000 words</code>相较日常2,000个词给儿童带来大量语言扩展。词汇数字不是莎士比亚与其他剧作家的排名，不能据此断言他已被证明最好。</p>\n<p>不过，在是否可任意替换作者的问题下，作者特别提出莎士比亚丰富语言的作用，支持他与这种方法可能有很好的配合。</p>\n<p><code>A</code>说<code>may work best</code>，保留了‘可能’，没有把待研究的比较说成已经证实的结论。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n<p>但换成随便哪个剧作家都能复制结果吗？O&#39;Hanlon说还需要更多研究，但莎士比亚使用两万个词，相比日常的两千个词，给儿童生活带来巨大语言扩展，又结合了儿童用全身把词语演活的参与方式。</p>\n</blockquote>\n<p>But先问效果能否泛化，more research保留结论，but suggested再给这位作家可能有优势的理由。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The new teaching method may work best with Shakespeare.</p>\n<p>最后一段可推知：新教学法可能与莎士比亚配合得最好。</p>\n</blockquote>\n<p>may work best不能改成已证明最好；20,000对2,000比较的是莎剧与日常词汇，并非作家排名，但在替换作者的问题下仍支持这种可能。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>"},{"title":"B. the language of Shakespeare may be formidable for pupils","raw":"### B. the language of Shakespeare may be formidable for pupils\n\n> 最后一段可推知：莎士比亚语言可能让学生望而生畏。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n丰富词汇被写成语言扩展的收益，B却推成学生望而生畏；原段没有报告这种困难反应。\n\n**出处：**\n\n> But could the results be replicated with any old dramatist? O'Hanlon said more research would be needed but suggested that Shakespeare's use of 20,000 words, compared with the everyday 2,000 words, gave a \"massive expansion of language into children's lives,\" which was combined with children \"using their whole bodies to bring words to life.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1671,1345,407],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"25","option":"B","cumulative":true,"cumulativeGroup":"question-25-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-B-0\"><blockquote>\n<p>最后一段可推知：莎士比亚语言可能让学生望而生畏。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>丰富词汇被写成语言扩展的收益，B却推成学生望而生畏；原段没有报告这种困难反应。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n</section>"},{"title":"B. the language of Shakespeare may be formidable for pupils","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 最后一段可推知：莎士比亚语言可能让学生望而生畏。\n\n`formidable for pupils`是在判断儿童面对这些语言的困难程度，第7段谈`Shakespeare’s use of 20,000 words`，并说明这对`children’s lives`带来什么，因此回看词汇数字后面的`massive expansion of language`及儿童让文字活起来的描写。\n\n原文将20,000与2,000的差距解释为`massive expansion of language`，也就是丰富语言进入儿童的生活，并与儿童用身体让文字活起来相结合。`B`的`formidable for pupils`则把同一批语言说成可能使学生望而生畏。词汇量大是两边涉及的同一事实，但原文用它解释语言学习得到拓展，`B`却从数量跨到儿童感到难以应付的反应；原句没有提供这一反应，描述的儿童活动反而是在把词语表现出来。","section":"第三鸟 · 题目复盘","context":{"mode" ds, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n<p>但换成随便哪个剧作家都能复制结果吗？O&#39;Hanlon说还需要更多研究，但莎士比亚使用两万个词，相比日常的两千个词，给儿童生活带来巨大语言扩展，又结合了儿童用全身把词语演活的参与方式。</p>\n</blockquote>\n<p>any old dramatist在提问中强调换任何其他剧作家都行吗，回答仍需研究，随后回到莎士比亚的语言资源。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Other old dramatists may be included in primary education.</p>\n<p>最后一段可推知：其他古代剧作家可能被纳入小学教育。</p>\n</blockquote>\n<p>C需要其他作家被纳入教学的安排或预期。提出待研究问题不等于提出课程扩充计划。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. pupils may be reluctant to work on other old dramatists","raw":"### D. pupils may be reluctant to work on other old dramatists\n\n> 最后一段可推知：学生可能不愿学习其他古代剧作家。\n\n**做题模式中的状态：** 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。\n\n**错误类型：第三类——无中生有。**\n\n末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。\n\n**出处：**\n\n> But could the results be replicated with any old dramatist? O'Hanlon said more research would be needed but suggested that Shakespeare's use of 20,000 words, compared with the everyday 2,000 words, gave a \"massive expansion of language into children's lives,\" which was combined with children \"using their whole bodies to bring words to life.\"","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1671,1345,407],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-25-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>最后一段可推知：学生可能不愿学习其他古代剧作家。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n</section>"},{"title":"D. pupils may be reluctant to work on other old dramatists","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 最后一段可推知：学生可能不愿学习其他古代剧作家。\n\n末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。\n\n提问与回答都围绕结果可复制性，后面谈丰富语言与表演结合。\n\nD需要学生抗拒的表述。more research所保留的是研究结论，不是儿童对学习对象的态度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1671,1345,407],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-25-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>最后一段可推知：学生可能不愿学习其他古代剧作家。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知：学生可能不愿学习其他古代剧作家。</p>\n</blockquote>\n<p>末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。</p>\n<p>提问与回答都围绕结果可复制性，后面谈丰富语言与表演结合。</p>\n<p>D需要学生抗拒的表述。more research所保留的是研究结论，不是儿童对学习对象的态度。</p>\n</section>"},{"title":"D. pupils may be reluctant to work on other old dramatists","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> But could the results be replicated with any old dramatist? O'Hanlon said more research would be needed but suggested that Shakespeare's use of 20,000 words, compared with the everyday 2,000 words, gave a \"massive expansion of language into children's lives,\" which was combined with children \"using their whole bodies to bring words to life.\"\n>\n> 但换成随便哪个剧作家都能复制结果吗？O'Hanlon说还需要更多研究，但莎士比亚使用两万个词，相比日常的两千个词，给儿童生活带来巨大语言扩展，又结合了儿童用全身把词语演活的参与方式。\n\n提问与回答都围绕结果可复制性，后面谈丰富语言与表演结合。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Pupils may be reluctant to work on other old dramatists.\n>\n> 最后一段可推知：学生可能不愿学习其他古代剧作家。\n\nD需要学生抗拒的表述。more research所保留的是研究结论，不是儿童对学习对象的态度。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1671,1345,407],"sourceW":1625,"sourceH":2263},"level":4,"meta":{"question":"25","option":"D","cumulative":true,"cumulativeGroup":"question-25-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-25-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-25-option-D-0\"><blockquote>\n<p>最后一段可推知：学生可能不愿学习其他古代剧作家。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、D，此时D尚未排除。随后把全文连起来回看，最终选A。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>最后一段可推知：学生可能不愿学习其他古代剧作家。</p>\n</blockquote>\n<p>末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。</p>\n<p>提问与回答都围绕结果可复制性，后面谈丰富语言与表演结合。</p>\n<p>D需要学生抗拒的表述。more research所保留的是研究结论，不是儿童对学习对象的态度。</p>\n</section><section class=\"revealPart\" id=\"focus-question-25-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n<p>但换成随便哪个剧作家都能复制结果吗？O&#39;Hanlon说还需要更多研究，但莎士比亚使用两万个词，相比日常的两千个词，给儿童生活带来巨大语言扩展，又结合了儿童用全身把词语演活的参与方式。</p>\n</blockquote>\n<p>提问与回答都围绕结果可复制性，后面谈丰富语言与表演结合。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Pupils may be reluctant to work on other old dramatists.</p>\n<p>最后一段可推知：学生可能不愿学习其他古代剧作家。</p>\n</blockquote>\n<p>D需要学生抗拒的表述。more research所保留的是研究结论，不是儿童对学习对象的态度。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"25题结论","raw":"### 25题结论\n\n> **25. A**\n\n- A：换其他剧作家能否复制结果仍待研究，随后特别强调莎士比亚丰富语言与身体演绎的结合，支持A保留可能性的推断。\n- B：丰富词汇被写成语言扩展的收益，B却推成学生望而生畏；原段没有报告这种困难反应。\n- C：是否能复制效果是研究可推广性，纳入小学课程是教材采用决定，原段没有从前者推出后者。\n- D：末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"25题","focus":[150,1671,1345,407],"sourceW":1625,"sourceH":2263},"level":3,"meta":{"kind":"conclusion","question":"25","questionConclusion":true},"html":"<blockquote>\n<p><strong>25. A</strong></p>\n</blockquote>\n<ul>\n<li>A：换其他剧作家能否复制结果仍待研究，随后特别强调莎士比亚丰富语言与身体演绎的结合，支持A保留可能性的推断。</li>\n<li>B：丰富词汇被写成语言扩展的收益，B却推成学生望而生畏；原段没有报告这种困难反应。</li>\n<li>C：是否能复制效果是研究可推广性，纳入小学课程是教材采用决定，原段没有从前者推出后者。</li>\n<li>D：末段没有调查学生愿不愿学其他作家，reluctant另加学生意愿；研究者不确定效果不能变成学生不情愿。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：研究发现的核心结论**（段落1-2主要发现） 研究背景：莎士比亚有益于儿童读写和情感发展 → 关键条件：必须通过表演 → \"排练室\"教学法的效果：【拓宽词汇 + 提高写作复杂性 + 增强情感素养】→ 原理：演员工作方式影响儿童语言使用和自我认知\n\n↓（研究方法）\n\n**逻辑层次2：实验设计与过程**（段落3实验方法） 实验设计：【随机对照试验：45所小学数百名9-10岁学生（未接触过RSC教学法）】→ 分组：目标组vs对照组 → 任务：写《暴风雨》中费迪南德的瓶中信 → 干预：目标组获得30分钟戏剧活动\n\n↓（实验结果）\n\n**逻辑层次3：具体效果对比**（段落4-5结果分析） 语言能力差异：【目标组：（词汇更广泛 + 用词更复杂罕见 + 篇幅更长）// 对照组：词汇有限】→ 写作方式差异：【目标组：以角色身份写作，表达角色情感 // 对照组：想象自己的反应】→ 描述能力差异：【目标组：宽广描述（天空、海洋、大气）// 对照组：依赖陈词滥调（棕榈树）】\n\n↓（深层影响）\n\n**逻辑层次4：情感素养的提升**（段落6机制解释） 最大惊喜：目标组儿童的情感素养 → 表现：（写作更有韧性 + 更有希望）→ 原因分析：【排练室过程：习惯通过想象找出路 → 自如描述不同情感状态 → 戏剧本质：设身处地】→ 教育启示：艺术嵌入教育的重要性\n\n↓（特殊性讨论）\n\n**逻辑层次5：莎士比亚的独特优势**（段落7延伸思考） 问题：其他剧作家能否复制效果？→ 需要更多研究 // 但莎士比亚的特殊性：【语言优势：20,000词汇vs日常2,000词汇 → 大规模语言扩展】+ 【教学方式：用整个身体让词语活起来】\n\n↑（全文主旨）\n\n全文核心观点**：**\"排练室\"戏剧教学法能显著提升儿童的语言能力和情感素养，莎士比亚作品因其丰富的词汇量可能具有独特优势，但关键在于让儿童通过表演来体验和理解文本。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：研究发现的核心结论</strong>（段落1-2主要发现） 研究背景：莎士比亚有益于儿童读写和情感发展 → 关键条件：必须通过表演 → &quot;排练室&quot;教学法的效果：【拓宽词汇 + 提高写作复杂性 + 增强情感素养】→ 原理：演员工作方式影响儿童语言使用和自我认知</p>\n<p>↓（研究方法）</p>\n<p><strong>逻辑层次2：实验设计与过程</strong>（段落3实验方法） 实验设计：【随机对照试验：45所小学数百名9-10岁学生（未接触过RSC教学法）】→ 分组：目标组vs对照组 → 任务：写《暴风雨》中费迪南德的瓶中信 → 干预：目标组获得30分钟戏剧活动</p>\n<p>↓（实验结果）</p>\n<p><strong>逻辑层次3：具体效果对比</strong>（段落4-5结果分析） 语言能力差异：【目标组：（词汇更广泛 + 用词更复杂罕见 + 篇幅更长）// 对照组：词汇有限】→ 写作方式差异：【目标组：以角色身份写作，表达角色情感 // 对照组：想象自己的反应】→ 描述能力差异：【目标组：宽广描述（天空、海洋、大气）// 对照组：依赖陈词滥调（棕榈树）】</p>\n<p>↓（深层影响）</p>\n<p><strong>逻辑层次4：情感素养的提升</strong>（段落6机制解释） 最大惊喜：目标组儿童的情感素养 → 表现：（写作更有韧性 + 更有希望）→ 原因分析：【排练室过程：习惯通过想象找出路 → 自如描述不同情感状态 → 戏剧本质：设身处地】→ 教育启示：艺术嵌入教育的重要性</p>\n<p>↓（特殊性讨论）</p>\n<p><strong>逻辑层次5：莎士比亚的独特优势</strong>（段落7延伸思考） 问题：其他剧作家能否复制效果？→ 需要更多研究 // 但莎士比亚的特殊性：【语言优势：20,000词汇vs日常2,000词汇 → 大规模语言扩展】+ 【教学方式：用整个身体让词语活起来】</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点<strong>：</strong>&quot;排练室&quot;戏剧教学法能显著提升儿童的语言能力和情感素养，莎士比亚作品因其丰富的词汇量可能具有独特优势，但关键在于让儿童通过表演来体验和理解文本。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. Acting as a condition for wider learning benefits\n\n> 通过表演获得更广泛学习收益\n\n研究提出莎士比亚有益儿童读写与情感发展，但前提是表演，排练式教学影响语言和自我认识。\n\n> The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children's literacy and emotional development.\n\n研究确认读写与情感收益，而首段But only限定必须通过表演获得，不能遗漏方法条件。\n\n> A study found that a \"rehearsal room\" approach to teaching Shakespeare broadened children's vocabulary and the complexity of their writing as well as their emotional literacy.\n\n排练式方法将收益落实为词汇、写作复杂度与情感素养三个方面。\n\n> \"The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,\" Jacqui O'Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.\n\n演员工作方式改变语言使用和自我理解，解释教学参与为何是标题重点。\n\n这一部分的推进关系是：\n\n> 表演是获益条件 → 排练方法改善语言与情感 → 参与方式发挥作用\n\nacting as a condition对应But only if，wider benefits涵盖词汇、写作复杂性与情感素养。\n\n再看最强干扰项G：Watching professionals instead of participating。\n\n文章要求学生参与演员式活动，并非只看剧团演员演出。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. Acting as a condition for wider learning benefits</p>\n<blockquote>\n<p>通过表演获得更广泛学习收益</p>\n</blockquote>\n<p>研究提出莎士比亚有益儿童读写与情感发展，但前提是表演，排练式教学影响语言和自我认识。</p>\n<blockquote>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development.</p>\n</blockquote>\n<p>研究确认读写与情感收益，而首段But only限定必须通过表演获得，不能遗漏方法条件。</p>\n<blockquote>\n<p>A study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy.</p>\n</blockquote>\n<p>排练式方法将收益落实为词汇、写作复杂度与情感素养三个方面。</p>\n<blockquote>\n<p>&quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n</blockquote>\n<p>演员工作方式改变语言使用和自我理解，解释教学参与为何是标题重点。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>表演是获益条件 → 排练方法改善语言与情感 → 参与方式发挥作用</p>\n</blockquote>\n<p>acting as a condition对应But only if，wider benefits涵盖词汇、写作复杂性与情感素养。</p>\n<p>再看最强干扰项G：Watching professionals instead of participating。</p>\n<p>文章要求学生参与演员式活动，并非只看剧团演员演出。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】A. A comparison organised around a drama activity\n\n> 围绕戏剧活动安排的对照比较\n\n随机试验将未接触过相关教学法的学生分组，并在共同写作任务外给目标组安排戏剧活动。\n\n> The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been \"previously exposed to RSC pedagogy.\" They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest.\n\n未接触相关教学法的学生被随机分组，角色写作是共同任务，建立比较基础。\n\n> The target group was given a 30-minute drama-based activity to accompany the passage.\n\n目标组额外接受30分钟戏剧活动，使比较能够围绕这一教学变化展开。\n\n这一部分的推进关系是：\n\n> 相近起点随机分组 → 共同角色写作任务 → 目标组增加戏剧活动\n\ncomparison对应目标与对照分组，organised around drama指出两组教学安排的关键差别。\n\n再看最强干扰项D：A promise that the findings need no further testing。\n\n本段介绍研究设计，既非结果也没有宣布无需后续验证。\n\n**42题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】A. A comparison organised around a drama activity</p>\n<blockquote>\n<p>围绕戏剧活动安排的对照比较</p>\n</blockquote>\n<p>随机试验将未接触过相关教学法的学生分组，并在共同写作任务外给目标组安排戏剧活动。</p>\n<blockquote>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest.</p>\n</blockquote>\n<p>未接触相关教学法的学生被随机分组，角色写作是共同任务，建立比较基础。</p>\n<blockquote>\n<p>The target group was given a 30-minute drama-based activity to accompany the passage.</p>\n</blockquote>\n<p>目标组额外接受30分钟戏剧活动，使比较能够围绕这一教学变化展开。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>相近起点随机分组 → 共同角色写作任务 → 目标组增加戏剧活动</p>\n</blockquote>\n<p>comparison对应目标与对照分组，organised around drama指出两组教学安排的关键差别。</p>\n<p>再看最强干扰项D：A promise that the findings need no further testing。</p>\n<p>本段介绍研究设计，既非结果也没有宣布无需后续验证。</p>\n<p><strong>42题选A。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】E. Writing that becomes richer and more attentive to character\n\n> 更丰富且更贴近人物的写作\n\n目标组词汇更丰富、写作更长、能进入人物角色；场景也比对照组的套话更充分。\n\n> The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words \"classed as more sophisticated or rarer\" and wrote at greater length.\n\n词汇范围、罕见词与篇幅具体呈现目标组写作差别，不是先验能力断言。\n\n> They also \"appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character's emotion.\" The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were \"more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.\"\n\n自己反应与人物情绪、荒岛套话与更广场景两重对照，把改进扩展到角色立场和描写。\n\n这一部分的推进关系是：\n\n> 词汇篇幅改善 → 更能进入人物 → 场景描写更丰富\n\nricher涵盖语言与场景展开，attentive to character涵盖人物立场和情感。\n\n再看最强干扰项G：Watching professionals instead of participating。\n\n这些是儿童亲自写作的表现，不能转成观看专业表演的收益。\n\n**43题选E。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】E. Writing that becomes richer and more attentive to character</p>\n<blockquote>\n<p>更丰富且更贴近人物的写作</p>\n</blockquote>\n<p>目标组词汇更丰富、写作更长、能进入人物角色；场景也比对照组的套话更充分。</p>\n<blockquote>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length.</p>\n</blockquote>\n<p>词汇范围、罕见词与篇幅具体呈现目标组写作差别，不是先验能力断言。</p>\n<blockquote>\n<p>They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot; The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n</blockquote>\n<p>自己反应与人物情绪、荒岛套话与更广场景两重对照，把改进扩展到角色立场和描写。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>词汇篇幅改善 → 更能进入人物 → 场景描写更丰富</p>\n</blockquote>\n<p>richer涵盖语言与场景展开，attentive to character涵盖人物立场和情感。</p>\n<p>再看最强干扰项G：Watching professionals instead of participating。</p>\n<p>这些是儿童亲自写作的表现，不能转成观看专业表演的收益。</p>\n<p><strong>43题选E。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. Emotional understanding through taking another person’s position\n\n> 通过站在他人立场来理解情感\n\n奥汉隆最惊讶于情感素养，并把它联系到排练中想象他人处境和表达不同情感。\n\n> O'Hanlon said she had been most surprised by the \"emotional literacy that was evident in the [target] children's writing and that they were \"more resilient in their writing, more hopeful.\" She added: \"The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through.\n\n最惊讶的情感素养被联系到排练中持续想象处境，probably保留机制解释的推测程度。\n\n> They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.\" The study showed the importance of embedding arts in education, she said.\n\n能描述不同状态与put yourself in different shoes相接，再推出艺术融入教育的重要性。\n\n这一部分的推进关系是：\n\n> 观察情感表达改善 → 解释换位体验 → 支持艺术融入教育\n\ntaking another person’s position对应put yourself in different shoes，比一般想象写作更准确。\n\n再看最强干扰项E：Writing that becomes richer and more attentive to character。\n\nE是前段观察到的写作结果，此段进一步解释情感理解的促进机制。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. Emotional understanding through taking another person’s position</p>\n<blockquote>\n<p>通过站在他人立场来理解情感</p>\n</blockquote>\n<p>奥汉隆最惊讶于情感素养，并把它联系到排练中想象他人处境和表达不同情感。</p>\n<blockquote>\n<p>O&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through.</p>\n</blockquote>\n<p>最惊讶的情感素养被联系到排练中持续想象处境，probably保留机制解释的推测程度。</p>\n<blockquote>\n<p>They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n</blockquote>\n<p>能描述不同状态与put yourself in different shoes相接，再推出艺术融入教育的重要性。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>观察情感表达改善 → 解释换位体验 → 支持艺术融入教育</p>\n</blockquote>\n<p>taking another person’s position对应put yourself in different shoes，比一般想象写作更准确。</p>\n<p>再看最强干扰项E：Writing that becomes richer and more attentive to character。</p>\n<p>E是前段观察到的写作结果，此段进一步解释情感理解的促进机制。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. The limits of transferring the findings to other writers\n\n> 将研究结果推广到其他作家的限度\n\n是否可用任何剧作家复制结果仍需研究，莎士比亚丰富词汇与身体演绎的组合可能有特殊优势。\n\n> But could the results be replicated with any old dramatist?\n\nBut把问题转到换作家后的可复制性，而非继续罗列已经观察的效果。\n\n> O'Hanlon said more research would be needed but suggested that Shakespeare's use of 20,000 words, compared with the everyday 2,000 words, gave a \"massive expansion of language into children's lives,\" which was combined with children \"using their whole bodies to bring words to life.\"\n\nmore research限制推广结论，丰富词汇与身体参与又给出莎士比亚可能具有的优势。\n\n这一部分的推进关系是：\n\n> 换其他作家是否同效 → 仍需研究 → 丰富语言与演绎可能有优势\n\nlimits保留推广尚待验证的边界，other writers对应开头的替换问题。\n\n再看最强干扰项D：A promise that the findings need no further testing。\n\n原文明说more research would be needed，不能写成无需进一步研究。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. The limits of transferring the findings to other writers</p>\n<blockquote>\n<p>将研究结果推广到其他作家的限度</p>\n</blockquote>\n<p>是否可用任何剧作家复制结果仍需研究，莎士比亚丰富词汇与身体演绎的组合可能有特殊优势。</p>\n<blockquote>\n<p>But could the results be replicated with any old dramatist?</p>\n</blockquote>\n<p>But把问题转到换作家后的可复制性，而非继续罗列已经观察的效果。</p>\n<blockquote>\n<p>O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n</blockquote>\n<p>more research限制推广结论，丰富词汇与身体参与又给出莎士比亚可能具有的优势。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>换其他作家是否同效 → 仍需研究 → 丰富语言与演绎可能有优势</p>\n</blockquote>\n<p>limits保留推广尚待验证的边界，other writers对应开头的替换问题。</p>\n<p>再看最强干扰项D：A promise that the findings need no further testing。</p>\n<p>原文明说more research would be needed，不能写成无需进一步研究。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出表演是学习收益的重要条件 |\n| B | 说明两组试验及目标组附加戏剧活动 |\n| C | 概括艺术教学通过参与发挥作用 |\n| D | 提出可推广性问题与莎士比亚语言优势 |\n| E | 补充场景描写更充分的表现 |\n| F | 呈现词汇篇幅及人物立场差别 |\n| G | 解释角色转换与情感理解的联系 |\n| H | 总结可能优势并限定比较及意愿推断 |\n\n全文推进：\n\n> 提出表演是学习收益的重要条件 → 说明两组试验及目标组附加戏剧活动 → 呈现词汇篇幅及人物立场差别 → 补充场景描写更充分的表现 → 解释角色转换与情感理解的联系 → 概括艺术教学通过参与发挥作用 → 提出可推广性问题与莎士比亚语言优势 → 总结可能优势并限定比较及意愿推断\n\n完整顺序：\n\n**A → B → F → E → G → C → D → H**\n\n41—45：B、F、G、C、D。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出表演是学习收益的重要条件</td>\n</tr>\n<tr>\n<td>B</td>\n<td>说明两组试验及目标组附加戏剧活动</td>\n</tr>\n<tr>\n<td>C</td>\n<td>概括艺术教学通过参与发挥作用</td>\n</tr>\n<tr>\n<td>D</td>\n<td>提出可推广性问题与莎士比亚语言优势</td>\n</tr>\n<tr>\n<td>E</td>\n<td>补充场景描写更充分的表现</td>\n</tr>\n<tr>\n<td>F</td>\n<td>呈现词汇篇幅及人物立场差别</td>\n</tr>\n<tr>\n<td>G</td>\n<td>解释角色转换与情感理解的联系</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结可能优势并限定比较及意愿推断</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出表演是学习收益的重要条件 → 说明两组试验及目标组附加戏剧活动 → 呈现词汇篇幅及人物立场差别 → 补充场景描写更充分的表现 → 解释角色转换与情感理解的联系 → 概括艺术教学通过参与发挥作用 → 提出可推广性问题与莎士比亚语言优势 → 总结可能优势并限定比较及意愿推断</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → B → F → E → G → C → D → H</s y themselves would react.</p>\n</blockquote>\n<p>词汇篇幅和人物情绪分别给结果，whereas把两组立场并列对照。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The contrast extended to descriptions of the setting.</p>\n</blockquote>\n<p>The contrast延续已有两组对比，extended说明还将扩展到场景描写。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明两组试验及目标组附加戏剧活动 → 呈现词汇篇幅及人物立场差别 → 补充场景描写更充分的表现</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Emotional expression was especially striking to the researcher discussing these results.</p>\n</blockquote>\n<p>直接讲情感为何惊讶会跳过当前应报告的比较结果，也不能自然接下文场景对比的延伸。</p>\n<p><strong>42题选F。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → G → C。\n\n先看前段E的结尾：\n\n> The result suggested a more expansive way of developing a picture rather than merely repeating a conventional phrase.\n\n再看G段开头：\n\n> Emotional expression was especially striking to the researcher discussing these results.\n\nthese results收接前面的用词、角色与描写表现，especially将焦点转到最突出的一项。\n\n本段内部继续写道：\n\n> She connected it with a rehearsal process in which participants imagine their way through another person’s situation. Taking a different position helps explain why children could describe a range of emotional states comfortably.\n\nShe回指研究者，it回指情感表达，换位过程解释不同状态为何能自如描述。\n\n后段C开头是：\n\n> That explanation supports the case for including arts in education.\n\nThat explanation指刚给出的机制，由结果解释推进到艺术教育意义。\n\n这三段的推进关系：\n\n> 补充场景描写更充分的表现 → 解释角色转换与情感理解的联系 → 概括艺术教学通过参与发挥作用\n\n再检验候选D：\n\n> Whether the same benefits would follow from any other dramatist remains an open question.\n\n其他剧作家能否同效是后续推广问题，不能先于当前对情感结果的原因解释。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → C。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The result suggested a more expansive way of developing a picture rather than merely repeating a conventional phrase.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Emotional expression was especially striking to the researcher discussing these results.</p>\n</blockquote>\n<p>these results收接前面的用词、角色与描写表现，especially将焦点转到最突出的一项。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>She connected it with a rehearsal process in which participants imagine their way through another person’s situation. Taking a different position helps explain why children could describe a range of emotional states comfortably.</p>\n</blockquote>\n<p>She回指研究者，it回指情感表达，换位过程解释不同状态为何能自如描述。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>That explanation supports the case for including arts in education.</p>\n</blockquote>\n<p>That explanation指刚给出的机制，由结果解释推进到艺术教育意义。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>补充场景描写更充分的表现 → 解释角色转换与情感理解的联系 → 概括艺术教学通过参与发挥作用</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>Whether the same benefits would follow from any other dramatist remains an open question.</p>\n</blockquote>\n<p>其他剧作家能否同效是后续推广问题，不能先于当前对情感结果的原因解释。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → C → D。\n\n先看前段G的结尾：\n\n> Taking a different position helps explain why children could describe a range of emotional states comfortably.\n\n再看C段开头：\n\n> That explanation supports the case for including arts in education.\n\nThat explanation复指换位帮助情感表达的机制，转向纳入艺术教育的理由。\n\n本段内部继续写道：\n\n> The activity brings language, imagination and bodily participation together. Its value lies in what pupils do with the words and characters, rather than in a requirement that professional actors personally teach every lesson.\n\n语言、想象与身体共同参与解释活动价值，不把专业演员亲自授课当条件。\n\n后段D开头是：\n\n> Whether the same benefits would follow from any other dramatist remains an open question.\n\nsame benefits总结已谈益处，再开换用其他作家的新问题。\n\n这三段的推进关系：\n\n> 解释角色转换与情感理解的联系 → 概括艺术教学通过参与发挥作用 → 提出可推广性问题与莎士比亚语言优势\n\n再检验候选B：\n\n> To examine that approach, researchers divided pupils with no previous exposure to the relevant teaching method into target and control groups.\n\nTo examine会倒回试验分组，重复前文已完成的设计，无法承接机制如何支持教育价值。\n\n**44题选C。**","secti ve the words expression.\n\nMore research回应待解问题，nevertheless在保留结论后说明莎剧可能有的语言优势。\n\n后段H开头是：\n\n> The conclusion should therefore preserve both the promising result and its limits.\n\ntherefore把积极结果与限度一起收束，避免将可能性写成已经比较证明。\n\n这三段的推进关系：\n\n> 概括艺术教学通过参与发挥作用 → 提出可推广性问题与莎士比亚语言优势 → 总结可能优势并限定比较及意愿推断\n\n再检验候选B：\n\n> To examine that approach, researchers divided pupils with no previous exposure to the relevant teaching method into target and control groups.\n\n分组设计已在开头解释，不能在结尾替代尚未回答的换作家问题。\n\n**45题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>45题是全文第7段，局部关系为C → D → H。</p>\n<p>先看前段C的结尾：</p>\n<blockquote>\n<p>Its value lies in what pupils do with the words and characters, rather than in a requirement that professional actors personally teach every lesson.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Whether the same benefits would follow from any other dramatist remains an open question.</p>\n</blockquote>\n<p>same benefits接前面活动带来的语言情感收益，any other dramatist引出可推广性。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>More research would be needed to establish that transfer. Shakespeare’s unusually broad language nevertheless offers a possible advantage when children use their bodies to give the words expression.</p>\n</blockquote>\n<p>More research回应待解问题，nevertheless在保留结论后说明莎剧可能有的语言优势。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>The conclusion should therefore preserve both the promising result and its limits.</p>\n</blockquote>\n<p>therefore把积极结果与限度一起收束，避免将可能性写成已经比较证明。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>概括艺术教学通过参与发挥作用 → 提出可推广性问题与莎士比亚语言优势 → 总结可能优势并限定比较及意愿推断</p>\n</blockquote>\n<p>再检验候选B：</p>\n<blockquote>\n<p>To examine that approach, researchers divided pupils with no previous exposure to the relevant teaching method into target and control groups.</p>\n</blockquote>\n<p>分组设计已在开头解释，不能在结尾替代尚未回答的换作家问题。</p>\n<p><strong>45题选D。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":" n<td>研究结果提示有所改善，但仍需进一步研究。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement emphasises the value of understanding a situation from another perspective.</td>\n<td>这句话强调从另一视角理解情境的价值。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage links active participation with richer language and emotional expression.</td>\n<td>这段文字把主动参与与更丰富的语言和情感表达联系起来。</td>\n</tr>\n</tbody></table></div>\n"}];

const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. A comparison organised around a drama activity</strong></p><p><strong>B. The limits of transferring the findings to other writers</strong></p><p><strong>C. Acting as a condition for wider learning benefits</strong></p><p><strong>D. A promise that the findings need no further testing</strong></p><p><strong>E. Writing that becomes richer and more attentive to character</strong></p><p><strong>F. Emotional understanding through taking another person’s position</strong></p><p><strong>G. Watching professionals instead of participating</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#x27;s literacy and emotional development. But only if you act him out. A study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#x27;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#x27;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#x27;s emotion.&quot; The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>O&#x27;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#x27;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>But could the results be replicated with any old dramatist? O&#x27;Hanlon said more research would be needed but suggested that Shakespeare&#x27;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#x27;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>A study suggests that Shakespeare can benefit children’s language and emotional development under a particular condition: they act the work out. The claim concerns a rehearsal-room approach to learning. It does not simply assume that encountering the name of a famous writer produces the same result.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>To examine that approach, researchers divided pupils with no previous exposure to the relevant teaching method into target and control groups. Both completed writing tasks connected with a play. The target group also received a drama-based activity alongside the passage they were using.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>That explanation supports the case for including arts in education. The activity brings language, imagination and bodily participation together. Its value lies in what pupils do with the words and characters, rather than in a requirement that professional actors personally teach every lesson.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>Whether the same benefits would follow from any other dramatist remains an open question. More research would be needed to establish that transfer. Shakespeare’s unusually broad language nevertheless offers a possible advantage when children use their bodies to give the words expression.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>The contrast extended to descriptions of the setting. Control pupils relied on familiar desert-island images, while the target group described a broader scene involving sky, sea and atmospheric conditions. The result suggested a more expansive way of developing a picture rather than merely repeating a conventional phrase.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>The comparison revealed differences in the resulting writing. Target pupils used a wider vocabulary, selected rarer words and wrote at greater length. They also expressed the feelings of a literary character, whereas control pupils were more likely to describe how they themselves would react.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>Emotional expression was especially striking to the researcher discussing these results. She connected it with a rehearsal process in which participants imagine their way through another person’s situation. Taking a different position helps explain why children could describe a range of emotional states comfortably.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>The conclusion should therefore preserve both the promising result and its limits. The method may work particularly well with Shakespeare, but superiority over every alternative has not been proved. Nor does uncertainty about other writers reveal anything about whether pupils are willing to study them.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>grammar school</td>\n<td>文法学校</td>\n<td>scholarly</td>\n<td>adj.学术的</td>\n<td>groundbreaking</td>\n<td>adj.开创性的</td>\n</tr>\n<tr>\n<td>benefit</td>\n<td>v.有益于</td>\n<td>literacy</td>\n<td>n.读写能力</td>\n<td>emotional development</td>\n<td>情感发展</td>\n</tr>\n<tr>\n<td>act out</td>\n<td>表演出来</td>\n<td>land a punch</td>\n<td>打出有力一击（此处为比喻）</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>rehearsal</td>\n<td>n.排练</td>\n<td>approach</td>\n<td>n.方法</td>\n<td>broadened</td>\n<td>v.拓宽</td>\n</tr>\n<tr>\n<td>complexity</td>\n<td>n.复杂性</td>\n<td>emotional literacy</td>\n<td>情感理解与表达能力</td>\n<td>commissioned</td>\n<td>v.委托开展</td>\n</tr>\n<tr>\n<td>make a difference</td>\n<td>产生影响</td>\n<td>vocabulary</td>\n<td>n.词汇量</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第3段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<t td>\n<td>emotional states</td>\n<td>情感状态</td>\n</tr>\n<tr>\n<td>embedding</td>\n<td>v.融入</td>\n<td>education</td>\n<td>n.教育</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第7段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>replicated</td>\n<td>v.复制；重现</td>\n<td>dramatist</td>\n<td>n.剧作家</td>\n<td>compared with</td>\n<td>与……相比</td>\n</tr>\n<tr>\n<td>everyday</td>\n<td>adj.日常的</td>\n<td>massive</td>\n<td>adj.巨大的</td>\n<td>expansion</td>\n<td>n.扩展</td>\n</tr>\n<tr>\n<td>combined with</td>\n<td>与……结合</td>\n<td>bring ... to life</td>\n<td>使……鲜活起来</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children&#39;s literacy and emotional development. But only if you act him out.</p>\n<h3>意群划分 · 第1段</h3>\n<p>The grammar school boy / from Stratford-upon-Avon / has landed a scholarly punch / after groundbreaking research showed / that Shakespeare does benefit / children&#39;s literacy and emotional development.</p>\n<p>But only if / you act him out.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>这个文法学校男孩 / 来自埃文河畔斯特拉特福的 / 打出了学术性的一拳 / 在突破性研究显示之后 / 莎士比亚确实有益于 / 儿童的读写能力和情感发展。</p>\n<p>但只有当 / 你把他表演出来。</p>\n<h3>标准译文 · 第1段</h3>\n<p>来自埃文河畔斯特拉特福的文法学校男孩（指莎士比亚）取得了学术性的胜利，因为突破性研究表明莎士比亚确实有益于儿童的读写能力和情感发展。但前提是要把他的作品表演出来。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>A study found that a &quot;rehearsal room&quot; approach to teaching Shakespeare broadened children&#39;s vocabulary and the complexity of their writing as well as their emotional literacy. &quot;The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#39;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study said.</p>\n<h3>意群划分 · 第2段</h3>\n<p>A study found / that a &quot;rehearsal room&quot; approach / to teaching Shakespeare / broadened children&#39;s vocabulary / and the complexity of their writing / as well as their emotional literacy.</p>\n<p>&quot;The research shows / that the way actors work / makes a big difference / to the way children use language / and also how they think / about themselves,&quot; / Jacqui O&#39;Hanlon / of the Royal Shakespeare Company (RSC), / which commissioned the study / said.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>一项研究发现 / &quot;排练室&quot;方法 / 教授莎士比亚的 / 拓宽了儿童的词汇 / 以及他们写作的复杂性 / 还有他们的情感素养。</p>\n<p>&quot;研究表明 / 演员工作的方式 / 产生很大影响 / 对儿童使用语言的方式 / 以及他们如何思考 / 关于自己，&quot; / 杰奎·奥汉隆 / 皇家莎士比亚剧团的，/ 委托这项研究的 / 说道。</p>\n<h3>标准译文 · 第2段</h3>\n<p>一项研究发现，用&quot;排练室&quot;方法教授莎士比亚拓宽了儿童的词汇量，提高了他们写作的复杂性以及情感素养。委托这项研究的皇家莎士比亚剧团（RSC）的杰奎·奥汉隆说：&quot;研究表明，演员的工作方式对儿童使用语言的方式以及他们如何看待自己产生了很大影响。&quot;</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>The randomised control trial involved hundreds of year 5 pupils - aged nine and ten - at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy.&quot; They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in The Tempest. The target group was given a 30-minute drama-based activity to accompany the passage.</p>\n<h3>意群划分 · 第3段</h3>\n<p>The randomised control trial / involved hundreds of year 5 pupils - / aged nine and ten - / at 45 state primary schools / that had not been / &quot;previously exposed to RSC pedagogy.&quot;</p>\n<p>They were split / into target and control groups / and asked to write, / for example, / a message in a bottle / as Ferdinand / after the shipwreck / in The Tempest.</p>\n<p>The target group / was given a 30-minute / drama-based activity / to accompany the passage.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>随机对照试验 / 涉及数百名五年级学生 - / 九岁和十岁的 - / 在45所公立小学 / 之前没有 / &quot;接触过RSC教学法&quot;的。</p>\n<p>他们被分成 / 目标组和对照组 / 并被要求写，/ 例如，/ 瓶中信 / 作为费迪南德 / 在海难之后 / 在《暴风雨》中。</p>\n<p>目标组 / 被给予30分钟的 / 基于戏剧的活动 / 来配合这段文字。</p>\n<h3>标准译文 · 第3段</h3>\n<p>这项随机对照试验涉及45所公立小学的数百名五年级学生（九岁和十岁），他们之前没有接触过RSC教学法。学生们被分成目标组和对照组，并被要求写作，例如，以《暴风雨》中费迪南德的身份写一封海难后的瓶中信。目标组获得了30分钟的戏剧活动来配合这段文字。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot; and wrote at greater length. They also &quot;appear to be more comfortable writing in role.while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#39;s emotion.&quot;</p>\n<h3>意群划分 · 第4段</h3>\n<p>The peer-reviewed results showed / that the target group of pupils / drew on a wider vocabulary, / used words / &quot;classed as more sophisticated or rarer&quot; / and wrote at greater length.</p>\n<p>They also / &quot;appear to be more comfortable / writing in role./ while [control] pupils imagine / how they themselves would react / to being shipwrecked, / [target] children put themselves / in the shoes of a literary character / and express that character&#39;s emotion.&quot;</p>\n<h3>意群翻译 · 第4段</h3>\n<p>同行评审的结果显示 / 目标组的学生 / 运用了更广泛的词汇，/ 使用了词语 / &quot;被归类为更复杂或更罕见的&quot; / 并且写得更长。</p>\n<p>他们还 / &quot;似乎更舒适 / 以角色写作 / 当[对照组]学生想象 / 他们自己会如何反应 / 对于遭遇海难，/ [目标组]儿童把自己 / 放在文学角色的位置上 / 并表达那个角色的情感。&quot;</p>\n<h3>标准译文 · 第4段</h3>\n<p>同行评审的结果显示，目标组学生运用了更广泛的词汇，使用了&quot;被归类为更复杂或更罕见的&quot;词语，并且写作篇幅更长。他们还&quot;似乎更适应角色写作……当对照组学生想象自己遭遇海难会如何反应时，目标组儿童把自己放在文学角色的位置上，并表达那个角色的情感。&quot;</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>The Time to Act study also found that while control pupils relied on desert island clichés such as palm trees, target pupils were &quot;more expansive giving a broader picture of the sky, the sea and the atmospheric conditions.&quot;</p>\n<h3>意群划分 · 第5段</h3>\n<p>The Time to Act study / also found / that while control pupils / relied on desert island clichés / such as palm trees, / target pupils were / &quot;more expansive / giving a broader picture / of the sky, the sea / and the atmospheric conditions.&quot;</p>\n<h3>意群翻译 · 第5段</h3>\n<p>《行动时刻》研究 / 还发现 / 当对照组学生 / 依赖荒岛陈词滥调 / 比如棕榈树，/ 目标组学生 / &quot;更加宽广 / 给出更广阔的画面 / 关于天空、海洋 / 和大气状况。&quot;</p>\n<h3>标准译文 · 第5段</h3>\n<p>《行动时刻》研究还发现，对照组学生依赖荒岛陈词滥调，比如棕榈树，而目标组学生&quot;更加宽广，给出了关于天空、海洋和大气状况的更广阔画面。&quot;</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>O&#39;Hanlon said she had been most surprised by the &quot;emotional literacy that was evident in the [target] children&#39;s writing and that they were &quot;more resilient in their writing, more hopeful.&quot; She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through. They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot; The study showed the importance of embedding arts in education, she said.</p>\n<h3>意群划分 · 第6段</h3>\n<p>O&#39;Hanlon said / she had been most surprised / by the &quot;emotional literacy / that was evident / in the [target] children&#39;s writing / and that they were / &quot;more resilient in their writing, / more hopeful.&quot;</p>\n<p>She added: / &quot;The emotional understanding / was very evident / and it is probably related / to the [rehearsal room process] / where you are used to / trying to imagine your way through.</p>\n<p>They were comfortable / in describing different emotional states / and part of what you do / in drama / is put yourself / in different shoes.&quot;</p>\n<p>The study showed / the importance of embedding / arts in education, / she said.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>奥汉隆说 / 她最惊讶的是 / &quot;情感素养 / 明显体现 / 在[目标组]儿童的写作中 / 并且他们 / &quot;在写作中更有韧性，/ 更有希望。&quot;</p>\n<p>她补充道：/ &quot;情感理解 / 非常明显 / 并且可能与 / [排练室过程]有关 / 在那里你习惯于 / 尝试通过想象找到出路。</p>\n<p>他们很舒适 / 在描述不同的情感状态 / 并且你所做的一部分 / 在戏剧中 / 是把自己 / 放在不同的处境中。&quot;</p>\n<p>研究显示了 / 嵌入的重要性 / 艺术在教育中，/ 她说。</p>\n<h3>标准译文 · 第6段</h3>\n<p>奥汉隆说，她最惊讶的是&quot;目标组儿童写作中明显体现的情感素养&quot;，以及他们&quot;在写作中更有韧性、更有希望。&quot;她补充道：&quot;情感理解非常明显，这可能与排练室过程有关，在那里你习惯于通过想象找到出路。他们很自如地描述不同的情感状态，而戏剧中你要做的一部分就是设身处地。&quot;她说，研究显示了在教育中嵌入艺术的重要性。</p>\n<h2>第7段</h2>\n<h3>完整原文 · 第7段</h3>\n<p>But could the results be replicated with any old dramatist? O&#39;Hanlon said more research would be needed but suggested that Shakespeare&#39;s use of 20,000 words, compared with the everyday 2,000 words, gave a &quot;massive expansion of language into children&#39;s lives,&quot; which was combined with children &quot;using their whole bodies to bring words to life.&quot;</p>\n<h3>意群划分 · 第7段</h3>\n<p>But could the results / be replicated / with any old dramatist?</p>\n<p>O&#39;Hanlon said / more research would be needed / but suggested / that Shakespeare&#39;s use / of 20,000 words, / compared with the everyday 2,000 words, / gave a &quot;massive expansion / of language / into children&#39;s lives,&quot; / which was combined / with children / &quot;using their whole bodies / to bring words to life.&quot;</p>\n<h3>意群翻译 · 第7段</h3>\n<p>但这些结果能否 / 被复制 / 用任何其他老剧作家？</p>\n<p>奥汉隆说 / 需要更多研究 / 但她提出 / 莎士比亚使用 / 20,000个词汇，/ 相比日常的2,000个词汇，/ 给予了&quot;大规模扩展 / 语言的 / 进入儿童的生活，&quot; / 这与 / 儿童 / &quot;使用他们的整个身体 / 来让词语活起来&quot;相结合。</p>\n<h3>标准译文 · 第7段</h3>\n<p>但这些结果能否用任何其他老剧作家的作品复制？奥汉隆说需要更多研究，但她提出，莎士比亚使用20,000个词汇，相比日常的2,000个词汇，给儿童的生活带来了&quot;语言的大规模扩展&quot;，这与儿童&quot;使用他们的整个身体来让词语活起来&quot;相结合。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>The grammar school boy：(from Stratford-upon-Avon) → has landed a scholarly punch：(after groundbreaking research showed：(that Shakespeare does benefit → children&#39;s literacy and emotional development)).</p>\n<p>But only if → you act him out.</p>\n<p><strong>第2段</strong></p>\n<p>A study found：(that a &quot;rehearsal room&quot; approach：(to teaching Shakespeare) → broadened children&#39;s vocabulary + the complexity of their writing + their emotional literacy).</p>\n<p>&quot;The research shows：(that the way actors work → makes a big difference：(to the way children use language + how they think：(about themselves)))&quot; → Jacqui O&#39;Hanlon：(of the Royal Shakespeare Company (RSC)：(which commissioned the study)) → said.</p>\n<p><strong>第3段</strong></p>\n<p>The randomised control trial → involved hundreds of year 5 pupils：(aged nine and ten)：(at 45 state primary schools：(that had not been → &quot;previously exposed to RSC pedagogy&quot;)).</p>\n<p>They were split：(into target and control groups) + asked to write：(for example)：(a message in a bottle：(as Ferdinand)：(after the shipwreck：(in The Tempest))).</p>\n<p>The target group → was given a 30-minute：(drama-based activity)：(to accompany the passage).</p>\n<p><strong>第4段</strong></p>\n<p>The peer-reviewed results showed：(that the target group of pupils → drew on a wider vocabulary + used words：(&quot;classed as more sophisticated or rarer&quot;) + wrote at greater length).</p>\n<p>They also → &quot;appear to be more comfortable：(writing in role)...while [control] pupils imagine：(how they themselves would react：(to being shipwrecked)) // [target] children put themselves：(in the shoes of a literary character) + express that character&#39;s emotion.&quot;</p>\n<p><strong>第5段</strong></p>\n<p>The Time to Act study → also found：(that while control pupils → relied on desert island clichés：(such as palm trees) // target pupils were → &quot;more expansive：(giving a broader picture：(of the sky + the sea + the atmospheric conditions))&quot;).</p>\n<p><strong>第6段</strong></p>\n<p>O&#39;Hanlon said → she had been most surprised：(by the &quot;emotional literacy：(that was evident：(in the [target] children&#39;s writing)) + that they were：(&quot;more resilient in their writing + more hopeful&quot;)).</p>\n<p>She added: → &quot;The emotional understanding → was very evident + it is probably related：(to the [rehearsal room process]：(where you are used to → trying to imagine your way through)).</p>\n<p>They were comfortable：(in describing different emotional states) + part of what you do：(in drama) → is put yourself：(in different shoes).&quot;</p>\n<p>The study showed → the importance of embedding：(arts in education) → she said.</p>\n<p><strong>第7段</strong></p>\n<p>But could the results → be replicated：(with any old dramatist)?</p>\n<p>O&#39;Hanlon said → more research would be needed // but suggested：(that Shakespeare&#39;s use：(of 20,000 words)：(compared with the everyday 2,000 words) → gave a &quot;massive expansion：(of language)：(into children&#39;s lives)&quot;)：(which was combined：(with children：(&quot;using their whole bodies：(to bring words to life)&quot;))).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>这个文法学校男孩：(来自埃文河畔斯特拉特福的) → 打出了学术性的一拳：(在突破性研究显示之后：(莎士比亚确实有益于 → 儿童的读写能力和情感发展))。</p>\n<p>但只有当 → 你把他表演出来。</p>\n<p><strong>第2段</strong></p>\n<p>一项研究发现：(&quot;排练室&quot;方法：(教授莎士比亚的) → 拓宽了儿童的词汇 + 他们写作的复杂性 + 他们的情感素养)。</p>\n<p>&quot;研究表明：(演员工作的方式 → 产生很大影响：(对儿童使用语言的方式 + 他们如何思考：(关于自己)))&quot; → 杰奎·奥汉隆：(皇家莎士比亚剧团的：(委托这项研究的)) → 说道。</p>\n<p><strong>第3段</strong></p>\n<p>随机对照试验 → 涉及数百名五年级学生：(九岁和十岁的)：(在45所公立小学：(之前没有 → &quot;接触过RSC教学法&quot;的))。</p>\n<p>他们被分成：(目标组和对照组) + 被要求写：(例如)：(瓶中信：(作为费迪南德)：(在海难之后：(在《暴风雨》中)))。</p>\n<p>目标组 → 被给予30分钟的：(基于戏剧的活动)：(来配合这段文字)。</p>\n<p><strong>第4段</strong></p>\n<p>同行评审的结果显示：(目标组的学生 → 运用了更广泛的词汇 + 使用了词语：(&quot;被归类为更复杂或更罕见的&quot;) + 写得更长)。</p>\n<p>他们还 → &quot;似乎更舒适：(以角色写作)...当[对照组]学生想象：(他们自己会如何反应：(对于遭遇海难)) // [目标组]儿童把自己：(放在文学角色的位置上) + 表达那个角色的情感。&qu
