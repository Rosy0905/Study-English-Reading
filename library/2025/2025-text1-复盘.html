ng the name of a famous writer produces the same result.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>To examine that approach, researchers divided pupils with no previous exposure to the relevant teaching method into target and control groups.</p>\n</blockquote>\n<p>that approach接前文表演式方法，To examine说明接下来是检验它的研究设计。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Both completed writing tasks connected with a play. The target group also received a drama-based activity alongside the passage they were using.</p>\n</blockquote>\n<p>无先前接触、两组共同写作与目标组额外活动，逐步建立比较条件。</p>\n<p>后段F开头是：</p>\n<blockquote>\n<p>The comparison revealed differences in the resulting writing.</p>\n</blockquote>\n<p>The comparison接分组设计，resulting writing预告下一段的写作结果。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出表演是学习收益的重要条件 → 说明两组试验及目标组附加戏剧活动 → 呈现词汇篇幅及人物立场差别</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Emotional expression was especially striking to the researcher discussing these results.</p>\n</blockquote>\n<p>these results需要先出现结果，研究设计尚未展开就评价情感表现会缺少指代基础。</p>\n<p><strong>41题选B。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为B → F → E。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>The target group also received a drama-based activity alongside the passage they were using.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>The comparison revealed differences in the resulting writing.</p>\n</blockquote>\n<p>The comparison接两组活动安排，resulting writing明确比较对象。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Target pupils used a wider vocabulary, selected rarer words and wrote at greater length. They also expressed the feelings of a literary character, whereas control pupils were more likely to describe how they themselves would react.</p>\n</blockquote>\n<p>词汇篇幅和人物情绪分别给结果，whereas把两组立场并列对照。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>The contrast extended to descriptions of the setting.</p>\n</blockquote>\n<p>The contrast延续已有两组对比，extended说明还将扩展到场景描写。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>说明两组试验及目标组附加戏剧活动 → 呈现词汇篇幅及人物立场差别 → 补充场景描写更充分的表现</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Emotional expression was especially striking to the researcher discussing these results.</p>\n</blockquote>\n<p>直接讲情感为何惊讶会跳过当前应报告的比较结果，也不能自然接下文场景对比的延伸。</p>\n<p><strong>42题选F。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → C。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The result suggested a more expansive way of developing a picture rather than merely repeating a conventional phrase.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Emotional expression was especially striking to the researcher discussing these results.</p>\n</blockquote>\n<p>these results收接前面的用词、角色与描写表现，especially将焦点转到最突出的一项。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>She connected it with a rehearsal process in which participants imagine their way through another person’s situation. Taking a different position helps explain why children could describe a range of emotional states comfortably.</p>\n</blockquote>\n<p>She回指研究者，it回指情感表达，换位过程解释不同状态为何能自如描述。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>That explanation supports the case for including arts in education.</p>\n</blockquote>\n<p>That explanation指刚给出的机制，由结果解释推进到艺术教育意义。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>补充场景描写更充分的表现 → 解释角色转换与情感理解的联系 → 概括艺术教学通过参与发挥作用</p>\n</blockquote>\n<p>再检验候选D：</p>\n<blockquote>\n<p>Whether the same benefits would follow from any other dramatist remains an open question.</p>\n</blockquote>\n<p>其他剧作家能否同效是后续推广问题，不能先于当前对情感结果的原因解释。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → C → D。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Taking a different position helps explain why children could describe a range of emotional states comfortably.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>That explanation supports the case for including arts in education.</p>\n</blockquote>\n<p>That explanation复指换位帮助情感表达的机制，转向纳入艺术教育的理由。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The activity brings language, imagination and bodily participation toget
