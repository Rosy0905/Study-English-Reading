判断。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n<p>诺贝尔经济学奖得主Friedman写道，企业唯一的社会责任是利用资源、开展增加利润的活动。但即便接受此前提、将CSR政策视为浪费股东资金，事情也未必如此泾渭分明。新研究表明，CSR可能为公司创造货币价值，至少在它们因腐败被起诉时如此。</p>\n</blockquote>\n<p>作者沿着利润目标本身追问：若CSR也能带来财务好处，是否还能简单将它当成浪费股东资金？</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author views Friedman’s statement with skepticism.</p>\n<p>作者对Friedman的说法持怀疑态度。</p>\n</blockquote>\n<p>B不要求否定利润的重要性，而是保留对简单结论的怀疑。may和at least限定反例范围，不会把这种质疑变成对全部研究都拿不准。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. approval</h3>\n<blockquote>\n<p>作者对Friedman的说法持赞同态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>you accept处于even if的假设让步中，作者真正接上的回应是事情未必如此分明。C把让步前提当成了作者赞同。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对Friedman的说法持赞同态度。</p>\n</blockquote>\n<p><code>approval</code>要查作者本人的评价，不能停在<code>you accept</code>，所以把第一段的让步前提与作者真正接上的<code>may not be absolutely clear-cut</code>一起读。</p>\n<p>原文中的接受只是<code>even if</code>引出的读者前提，作者自己的回应是<code>may not be absolutely clear-cut</code>：事情未必能像前面的看法那样分得那么清楚。<code>approval</code>却把作者的评价概括为赞同先前的说法。差别不只是作者没有说‘我赞同’，而是他明确对前面判断提出限制；把这一回应写成赞同，就把作者提出疑问的方向改成了认可。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n<p>诺贝尔经济学奖得主Friedman写道，企业唯一的社会责任是利用资源、开展增加利润的活动。但即便接受此前提、将CSR政策视为浪费股东资金，事情也未必如此泾渭分明。新研究表明，CSR可能为公司创造货币价值，至少在它们因腐败被起诉时如此。</p>\n</blockquote>\n<p>引语之后由But转向限制，再用CSR可能带来货币价值补出理由，论证方向是修正简单划分。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author views Friedman’s statement with approval.</p>\n<p>作者对Friedman的说法持赞同态度。</p>\n</blockquote>\n<p>C需要作者认可将CSR视为浪费这一判断。即便暂接受利润目标，仍可质疑浪费结论；不能只截accept而忽略even if与But。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. tolerance</h3>\n<blockquote>\n<p>作者对Friedman的说法持宽容态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者评估的是原说法是否周全，并以新研究提出疑问；tolerance则是容让一种自己未必认同的意见，原文未表达这种接受态度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对Friedman的说法持宽容态度。</p>\n</blockquote>\n<p><code>tolerance</code>写的是作者包容这一看法的态度；第一段中作者的回应是<code>things may not be absolutely clear-cut</code>，所以回到这个回应，检查作者是在包容观点，还是评价它是否说得成立。</p>\n<p>原文以<code>things may not be absolutely clear-cut</code>回应前面的看法，指出把企业社会责任视为浪费的判断不能如此简单下定论。<code>tolerance</code>则说作者对这种看法采取包容姿态。原句在评价判断是否足够周全，本项却把对判断本身的质疑换成对持有这种看法的接纳；让步前提中的接受也不能建立这种包容关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n<p>诺贝尔经济学奖得主Friedman写道，企业唯一的社会责任是利用资源、开展增加利润的活动。但即便接受此前提、将CSR政策视为浪费股东资金，事情也未必如此泾渭分明。新研究表明，CSR可能为公司创造货币价值，至少在它们因腐败被起诉时如此。</p>\n</blockquote>\n<p>让步只是进入对方前提，随后说明CSR也可能创造利润，焦点始终在命题是否说得成立。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author views Friedman’s statement with tolerance.</p>\n<p>作者对Friedman的说法持宽容态度。</p>\n</blockquote>\n<p>D需要即使不认同仍愿容纳的态度。原文给的是反向理由而非接纳姿态，不能将论证中的让步自动换成宽容。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>31题结论</h3>\n<blockquote>\n<p><strong>31. B</strong></p>\n</blockquote>\n<ul>\n<li>A：may not be absolutely clear-cut不是作者完全拿不准，而是借让步质疑“社会责任支出必然浪费”的简单理解，后面马上给经济价值的研究线索。</li>\n<li>B：But even if先让步再限制原来的利润与责任划分，新研究又说CSR可能创造货币价值，支持skepticism的质疑态度。</li>\n<li>C：you accept处于even if的假设让步中，作者真正接上的回应是事情未必如此分明。C把让步前提当成了作者赞同。</li>\n<li>D：作者评估的是原说法是否周全，并以新研究提出疑问；tolerance则是容让一种自己未必认同的意见，原文未表达这种接受态度。</li>\n</ul>\n<h2>32题</h2>\n<blockquote>\n<p>According to Paragraph 2, CSR helps a company by ______.</p>\n<p>根据第二段，企业社会责任通过什么方式帮助一家公司？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：逐一核对CSR如何使公司获益，特别区分消费者认识变化与产品本身质量变化。</p>\n<p>题干明确给出Paragraph 2，直接读第二段。从年度支出读到三种作用的末尾，完整看清每种作用涉及谁、发生什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>This could add value to their businesses in three ways.</p>\n<p>First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.</p>\n<p>Second, customers may be willing to buy a company’s products as an indirect way to donate to the good causes it helps.</p>\n</blockquote>\n<h3>A. guarding it against malpractices</h3>\n<blockquote>\n<p>CSR通过以下方式帮助公司：防止其遭受不当行为之害。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>三条作用都涉及消费者或他人怎样看待、购买、照顾企业，未说明能阻止企业遭遇或实施不当行为。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>CSR通过以下方式帮助公司：防止其遭受不当行为之害。</p>\n</blockquote>\n<p><code>guarding it against malpractices</code>要找不当行为怎样被防范；第二段归纳的帮助是<code>add value</code>，并具体落在消费者的质量判断、购买意愿和<code>greater consideration</code>上，因此核对这三种作用是否建立了防范行为的关系。</p>\n<p>原文把增加价值解释为消费者相信产品质量、愿意通过购买支持公益，以及公司获得<code>greater consideration</code>。<code>guarding it against malpractices</code>却把这种帮助写成防范不当行为，使公司免受其害。</p>\n<p>消费者形成好印象、愿意购买或给予照顾，是他人如何评价和对待公司；它们并没有建立阻止不当行为或抵御其损害的作用。</p>\n<p>本项把评价和购买上的好处接成了防范不当行为的保护。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n<p>咨询机构EPG估计，美英最大企业每年合计在CSR上支出逾150亿美元。这可能通过三条途径增加企业价值：消费者将支出看作产品高质量的信号；顾客愿意购买产品，间接捐助公司支持的公益事业；更广泛的光环效应使善行换来消费者及他人的更多善意对待。</p>\n</blockquote>\n<p>产品质量信号、间接公益捐赠和好感形成的光环效应，依次解释外界反应怎样增加商业价值。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>CSR helps a company by guarding it against malpractices.</p>\n<p>CSR通过以下方式帮助公司：防止其遭受不当行为之害。</p>\n</blockquote>\n<p>A需要CSR起到防范malpractices的保护机制。别人给好评价或买产品，不等于不当行为被阻止，不能把获益一般化为免受不当行为之害。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. protecting it from being defamed</h3>\n<blockquote>\n<p>CSR通过以下方式帮助公司：防止其被诽谤。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>good deeds带来greater consideration，说明更正面的对待；防止诽谤则要求阻止他人以不实言辞损害名誉，原段没有这一动作。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>CSR通过以下方式帮助公司：防止其被诽谤。</p>\n</blockquote>\n<p><code>being defamed</code>涉及他人以言辞损害公司的名誉，第二段谈消费者把支出当作质量<code>signal</code>及公司得到<code>greater consideration</code>，因此回看第一种和第三种作用，区分正面评价与防止诽谤。</p>\n<p><code>being defamed</code>则要求这笔支出起到防止他人诽谤公司的作用。得到好评价与阻止诽谤不是同一个行为：前者是消费者如何看待公司，后者涉及他人是否用言辞损害其名誉。本项把正面反应改写成抵御诽谤的保护。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n<p>咨询机构EPG估计，美英最大企业每年合计在CSR上支出逾150亿美元。这可能通过三条途径增加企业价值：消费者将支出看作产品高质量的信号；顾客愿意购买产品，间接捐助公司支持的公益事业；更广泛的光环效应使善行换来消费者及他人的更多善意对待。</p>\n</blockquote>\n<p>作者讲信誉与消费反应，并未引入诽谤者、失实指控或对言论的防护措施。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>CSR helps a company by protecting it from being defamed.</p>\n<p>CSR通过以下方式帮助公司：防止其被诽谤。</p>\n</blockquote>\n<p>B需要保护公司免于被defamed的作用。获得好感可能与声誉相关，但声誉变好不等于别人不能诽谤，不能替换具体机制。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. winning trust from consumers</h3>\n<blockquote>\n<p>CSR通过以下方式帮助公司：赢得消费者信任。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>消费者把CSR支出当作产品高质量的信号，因而更相信产品。C把这种认识上的好处概括为消费者信任。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>CSR通过以下方式帮助公司：赢得消费者信任。</p>\n</blockquote>\n<p><code>winning trust from consumers</code>要看消费者为何相信公司；第二段的<code>of high quality</code>说明他们怎样理解公司的产品，因此回看<code>First</code>引出的质量信号这一句。</p>\n<p>原文说消费者可能从公司的社会责任支出读出产品<code>of high quality</code>的信号，形成对产品质量的正面判断。<code>winning trust from consumers</code>将这种结果概括为赢得消费者信任，具体信任的就是公司产品的质量。原文并非说支出使产品质量实际提高，而是说它影响消费者怎么看产品；本项说赢得信任，保留了这种认识上的作用。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n<p>咨询机构EPG估计，美英最大企业每年合计在CSR上支出逾150亿美元。这可能通过三条途径增加企业价值：消费者将支出看作产品高质量的信号；顾客愿意购买产品，间接捐助公司支持的公益事业；更广泛的光环效应使善行换来消费者及他人的更多善意对待。</p>\n</blockquote>\n<p>First先说明信号怎样进入消费者判断，Second再写购买支持公益，third补一般光环；第一条就给出信任的具体根据。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>CSR helps a company by winning trust from consumers.</p>\n<p>CSR通过以下方式帮助公司：赢得消费者信任。</p>\n</blockquote>\n<p>C不要求产品客观质量因捐助而提高。winning trust说外界更愿相信，正与take ... as a signal处在同一判断层面。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n<h3>D. raising the quality of its products</h3>\n<blockquote>\n<p>CSR通过以下方式帮助公司：提高其产品质量。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>take ... as a signal说消费者据此认为产品质量高，D却说CSR提高了产品本身的质量，把认识变化改成实际改进。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>CSR通过以下方式帮助公司：提高其产品质量。</p>\n</blockquote>\n<p><code>raising the quality</code>与第二段的<code>products are of high quality</code>都谈产品质量，但原文前面还有<code>take CSR spending as a</code> “<code>signal</code>”，因此回看这一完整句。</p>\n<p>原文的<code>take CSR spending as a</code> “<code>signal</code>”说消费者把社会责任支出理解成产品质量高的信号，变化发生在消费者的判断上。<code>raising the quality</code>却说支出提高了产品本身的质量。‘认为产品质量高’并不等于‘使产品质量提高’，本项把消费者认识产品的作用改成了改进产品的实际作用。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n<p>咨询机构EPG估计，美英最大企业每年合计在CSR上支出逾150亿美元。这可能通过三条途径增加企业价值：消费者将支出看作产品高质量的信号；顾客愿意购买产品，间接捐助公司支持的公益事业；更广泛的光环效应使善行换来消费者及他人的更多善意对待。</p>\n</blockquote>\n<p>作者从支出走到消费者解释这一支出的方式，没有描述生产工艺、材料或检验水平发生变化。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>CSR helps a company by raising the quality of its products.</p>\n<p>CSR通过以下方式帮助公司：提高其产品质量。</p>\n</blockquote>\n<p>D需要CSR通过某种过程使产品更好。实际是给出质量信号，而信号可以影响信任，不能单凭这种信任证明质量已经提高。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>32题结论</h3>\n<blockquote>\n<p><strong>32. C</strong></p>\n</blockquote>\n<ul>\n<li>A：三条作用都涉及消费者或他人怎样看待、购买、照顾企业，未说明能阻止企业遭遇或实施不当行为。</li>\n<li>B：good deeds带来greater consideration，说明更正面的对待；防止诽谤则要求阻止他人以不实言辞损害名誉，原段没有这一动作。</li>\n<li>C：消费者把CSR支出当作产品高质量的信号，因而更相信产品。C把这种认识上的好处概括为消费者信任。</li>\n<li>D：take ... as a signal说消费者据此认为产品质量高，D却说CSR提高了产品本身的质量，把认识变化改成实际改进。</li>\n</ul>\n<h2>33题</h2>\n<blockquote>\n<p>The expression “more lenient” (Line 2, Para. 4) is closest in meaning to ______.</p>\n<p>第四段第二行的more lenient在意思上最接近什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>词义题：把more lenient放回penalties，利用后文罚款轻重的线索判断比较维度，并分清排除政治影响的否定句。</p>\n<p>题干给出more lenient和Para. 4，直接定位第四段。把发现和随后排除政治影响的解释一并读完，看这个词修饰什么、后文如何说明它。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>those with the most comprehensive CSR programmes tended to get more lenient penalties</p>\n<p>Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines</p>\n</blockquote>\n<h3>A. less controversial</h3>\n<blockquote>\n<p>more lenient在此意为处罚争议更少。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>more lenient修饰penalties，后文以lower fines说明处罚负担，less controversial却比较争议多少。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚争议更少。</p>\n</blockquote>\n<p><code>less controversial</code>谈是否引起争议，而第四段随后用<code>lower fines</code>说明<code>leniency</code>所涉及的处罚变化，因此把含<code>more lenient</code>的句子和后面的解释一起核对。</p>\n<p>原文讨论被起诉公司受到怎样的处罚，后一句排除政治影响的解释时，具体看它们是否获得<code>lower fines</code>，衡量的是罚款轻重。<code>less controversial</code>却把处罚的特点说成争议较少，改为考察别人是否对处罚意见不一。罚款金额变低与处罚是否引发争议不是同一个比较方面，不能用后者解释这里的<code>more lenient</code>。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n<p>研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。</p>\n</blockquote>\n<p>研究先报告CSR更全面者受罚较轻，再通过政治捐款与罚款是否更低检验另一种解释。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The penalties are less controversial.</p>\n<p>more lenient在此意为处罚争议更少。</p>\n</blockquote>\n<p>A需要处罚引发争论减少的证据。罚款较低只说明负担变化，不意味着公众、企业或检方的意见分歧减少。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. more lasting</h3>\n<blockquote>\n<p>more lenient在此意为处罚持续更久。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>lower fines提供金额轻重的线索，lasting则是持续多久。文中没有把处罚时长作为比较标准。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚持续更久。</p>\n</blockquote>\n<p><code>more lasting</code>谈持续时间；第四段却在解释<code>leniency</code>时提到<code>receive lower fines</code>，所以回看含<code>more lenient</code>的发现及随后这句解释。</p>\n<p>原文以被起诉公司的处罚为对象，随后的<code>receive lower fines</code>将解释落在罚款高低上，这是处罚负担的变化。<code>more lasting</code>却把它改成处罚或其效果维持更长时间。罚款较低不表达时间更长，原句也没有把这两个方面连接起来；将<code>lasting</code>放入，会把原来的轻重比较改成时长比较。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n<p>研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。</p>\n</blockquote>\n<p>作者用罚款高低落实leniency，随后也用40% lower fines量化这一负担，没有转向持续时间。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The penalties are more lasting.</p>\n<p>more lenient在此意为处罚持续更久。</p>\n</blockquote>\n<p>B换入后会说CSR更全面者得到更持久的处罚，与段落反复讨论的罚款减轻不是同一维度。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. more effective</h3>\n<blockquote>\n<p>more lenient在此意为处罚更有效。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>罚款金额降低可说明处罚更宽，不足以说明惩戒更有效。effective把轻重换成实现目的的成效。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚更有效。</p>\n</blockquote>\n<p><code>more effective</code>要比较处罚能否实现其目的，第四段解释<code>leniency</code>时用的是<code>lower fines</code>，所以重看这一处金额比较以及前面的研究发现。</p>\n<p>原文把<code>leniency</code>与<code>lower fines</code>接起来，讨论公司得到的处罚在负担上是否更轻，并排除政治影响作为原因。<code>more effective</code>却说处罚更能达到目的，转成对处罚成效的评价。金额较低可以说明处罚轻重，却不能自行说明惩戒效果更好；本项把处罚的力度改写成处罚的效果。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n<p>研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。</p>\n</blockquote>\n<p>研究衡量的是公司承担多少处罚成本，未测试处罚能否更好防止再次行贿或产生威慑。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The penalties are more effective.</p>\n<p>more lenient在此意为处罚更有效。</p>\n</blockquote>\n<p>C需要处罚效果提升的比较。原文只给较轻结果，既不能据此推得更有效，也不能反向武断说必然无效；它没有回答这里的宽严含义。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. less severe</h3>\n<blockquote>\n<p>more lenient在此意为处罚不那么严厉。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>more lenient表示更宽大的处罚，less severe就是不那么严厉。lower fines将这种宽大具体落实为更低罚款。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚不那么严厉。</p>\n</blockquote>\n<p><code>less severe</code>比较处罚轻重，第四段后面的<code>lower fines</code>正用罚款金额解释宽严，因此连着读研究发现与这句解释。</p>\n<p>原文讨论公司受到<code>more lenient penalties</code>，随后在解释这种<code>leniency</code>的来源时考察是否有<code>lower fines</code>，罚款降低就是处罚负担减轻。<code>less severe</code>同样说处罚不那么严厉、负担较轻，既保持了<code>penalties</code>这一对象，也保持了原段的轻重比较，放回句中能够接上。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n<p>研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。</p>\n</blockquote>\n<p>研究发现CSR较全面者处罚较轻，再排除政治影响作为这一宽大结果的替代解释。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The penalties are less severe.</p>\n<p>more lenient在此意为处罚不那么严厉。</p>\n</blockquote>\n<p>D代入more lenient penalties仍在比较处罚严厉程度。尤其要分清：政治捐款多的公司没有获得低罚款，是为排除政治原因，不是说CSR不对应轻罚。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n<h3>33题结论</h3>\n<blockquote>\n<p><strong>33. D</strong></p>\n</blockquote>\n<ul>\n<li>A：more lenient修饰penalties，后文以lower fines说明处罚负担，less controversial却比较争议多少。</li>\n<li>B：lower fines提供金额轻重的线索，lasting则是持续多久。文中没有把处罚时长作为比较标准。</li>\n<li>C：罚款金额降低可说明处罚更宽，不足以说明惩戒更有效。effective把轻重换成实现目的的成效。</li>\n<li>D：more lenient表示更宽大的处罚，less severe就是不那么严厉。lower fines将这种宽大具体落实为更低罚款。</li>\n</ul>\n<h2>34题</h2>\n<blockquote>\n<p>When prosecutors evaluate a case, a company’s CSR record ______.</p>\n<p>当检察官评估案件时，一家公司的企业社会责任记录会怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：题干问CSR记录在检察官评估中产生什么作用，区分影响决定、证据可信度与调查程序。</p>\n<p>题干给出prosecutors evaluate a case，第五段开头正写检察官应如何evaluate a case，随后提到公司的record in CSR。先把第五段的结论与后面研究人员给出的数字全部读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment</p>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR.</p>\n<p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<h3>A. comes across as reliable evidence</h3>\n<blockquote>\n<p>检察官评估案件时，CSR记录显得像可靠证据。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>CSR记录影响检察官决定，不能等同于该记录被判定为可靠的案件证据。影响判断与认定可信度是不同关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>检察官评估案件时，CSR记录显得像可靠证据。</p>\n</blockquote>\n<p><code>reliable evidence</code>要查原文是否在评价证据的可信程度；第五段说检察官<code>be influenced by</code>这份记录，而粗读末段见过<code>evidence of good character</code>。先把第六段从研究局限读到末句，再把这句与第五段的影响关系一起核对。</p>\n<p>第五段说检察官本应按案情本身评估，却会<code>be influenced by</code>公司的社会责任记录；第六段把结果说得更具体，良好品行的证据能争取代价较低的处罚。原文讨论的是品行材料怎样影响处罚，<code>reliable evidence</code>则评价这份材料在检察官看来是否可信。</p>\n<p>材料产生影响，不等于研究已经确认它被判断为可靠；原文的<code>evidence of good character</code>限定了材料所表明的是品行，也没有把影响处罚这件事解释成证据可信度的认定。</p>\n<p>本项换掉了原文考察的关系。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n<p>研究总的结论是，检察官本应只按案件本身的情况评估，但似乎确实受到公司CSR记录的影响。一位研究者说，他们估计，消除童工等重大的劳动权利问题，或将企业捐赠增加约20%，会使罚款通常比贿赂外国官员的一般处罚低40%左右。</p>\n</blockquote>\n<p>第五段先说本应按案情本身评估，却仍受公司CSR记录影响；末段再以良好品行证据降低处罚代价概括结果。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A company’s CSR record comes across as reliable evidence.</p>\n<p>检察官评估案件时，CSR记录显得像可靠证据。</p>\n</blockquote>\n<p>A需要检察官把材料视为可靠证据这一评价。evidence of good character只说明材料与品行的关系，未认定它能可靠证明本案事实。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. has an impact on their decision</h3>\n<blockquote>\n<p>检察官评估案件时，CSR记录影响他们的决定。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留B，此时B尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>do seem to be influenced by明确说检察官受到CSR记录影响，B把这一被动关系转成记录影响他们的决定。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>检察官评估案件时，CSR记录影响他们的决定。</p>\n</blockquote>\n<p><code>has an impact on</code>与第五段的<code>do seem to be influenced by</code>都写受到影响，主体又都是检察官，因此回看第五段的结论句。</p>\n<p>原文先说检察官应该只按案情评估，再用<code>do seem to be influenced by</code>说明他们实际上似乎确实受到公司社会责任记录的影响。<code>has an impact on</code>把同一关系写成记录影响检察官的决定，影响者是公司记录，受到影响者是评估案件的检察官，两者能对上。原文的<code>should</code>只限定应当怎样做，不能抹掉后面写出的实际影响。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n<p>研究总的结论是，检察官本应只按案件本身的情况评估，但似乎确实受到公司CSR记录的影响。一位研究者说，他们估计，消除童工等重大的劳动权利问题，或将企业捐赠增加约20%，会使罚款通常比贿赂外国官员的一般处罚低40%左右。</p>\n</blockquote>\n<p>whereas把应然与实然对照：应只按案情本身评判，研究却观察到CSR记录与处罚之间的作用。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A company’s CSR record has an impact on their decision.</p>\n<p>检察官评估案件时，CSR记录影响他们的决定。</p>\n</blockquote>\n<p>B的has an impact没有把记录说成唯一依据，也没有把研究的实际影响改成检察官应当如此；影响者与受影响者均保持原样。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n<h3>C. increases the chance of being penalized</h3>\n<blockquote>\n<p>检察官评估案件时，CSR记录增加公司受罚的可能性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>研究对象已是被起诉的公司，比较的是罚款轻重。C却问受处罚的概率是否增加，换掉了所研究的结果。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>检察官评估案件时，CSR记录增加公司受罚的可能性。</p>\n</blockquote>\n<p><code>increases the chance</code>问处罚发生的可能性；已读第六段却说<code>a less costly punishment</code>，讨论处罚代价，再联系第四段<code>among prosecuted firms</code>限定的研究对象，核对原文比较的是哪一步。</p>\n<p>第四段先把对象限定在已经被起诉的公司中，再比较处罚；第六段明确写良好品行的证据能争取<code>a less costly punishment</code>，即降低处罚代价。<code>increases the chance</code>却说社会责任记录使公司更容易被罚，把处罚有多重改成会不会受到处罚的可能性。原文的有利影响落在已遇法律麻烦后的处罚结果，本项则接成更容易遭受处罚这一结果，比较的事情已经变了。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n<p>研究总的结论是，检察官本应只按案件本身的情况评估，但似乎确实受到公司CSR记录的影响。一位研究者说，他们估计，消除童工等重大的劳动权利问题，或将企业捐赠增加约20%，会使罚款通常比贿赂外国官员的一般处罚低40%左右。</p>\n</blockquote>\n<p>among prosecuted firms先限定样本，随后lenient penalties、lower fines、less costly punishment一贯描述处罚负担。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A company’s CSR record increases the chance of being penalized.</p>\n<p>检察官评估案件时，CSR记录增加公司受罚的可能性。</p>\n</blockquote>\n<p>C需要有无CSR记录改变公司会不会被罚的比较。已进入法律程序后的轻罚结果，不能证明受罚概率增大；它甚至把有利的负担变化换成更易受罚。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. constitutes part of the investigation</h3>\n<blockquote>\n<p>检察官评估案件时，CSR记录构成调查的一部分。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>调查中不消费产品，用来隔离光环效应；记录影响评估，并不等于记录被正式列为调查内容。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>检察官评估案件时，CSR记录构成调查的一部分。</p>\n</blockquote>\n<p><code>part of the investigation</code>让人回到第三段的<code>as part of their investigations</code>；先将第三段从以往研究的困难读到末尾，再看这句话把哪种活动与调查相连。同时核对第五段<code>be influenced by</code>说明的记录作用。</p>\n<p>第三段的<code>as part of their investigations</code>接在消费公司产品之后，句子否定检察官在调查中消费产品，再据此解释他们可能受到哪种效应影响。第五段则说社会责任记录会影响案件评估。</p>\n<p><code>part of the investigation</code>把社会责任记录写成调查组成部分，所说的是调查包含什么内容。</p>\n<p>受到记录影响与把记录列入调查，是两个不同关系；前者说明它改变判断，后者还要求把它接入调查内容，原文这两句并未作出这一连接。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n<p>研究总的结论是，检察官本应只按案件本身的情况评估，但似乎确实受到公司CSR记录的影响。一位研究者说，他们估计，消除童工等重大的劳动权利问题，或将企业捐赠增加约20%，会使罚款通常比贿赂外国官员的一般处罚低40%左右。</p>\n</blockquote>\n<p>第三段先排除检察官作为消费者受影响的两条路径，第五段再报告判断受CSR记录影响，未列调查项目清单。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A company’s CSR record constitutes part of the investigation.</p>\n<p>检察官评估案件时，CSR记录构成调查的一部分。</p>\n</blockquote>\n<p>D需要调查本身包含查验CSR记录这一程序。文中part of their investigations接的是被否定的消费产品行为，不能把这处结构直接搬给CSR记录。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>34题结论</h3>\n<blockquote>\n<p><strong>34. B</strong></p>\n</blockquote>\n<ul>\n<li>A：CSR记录影响检察官决定，不能等同于该记录被判定为可靠的案件证据。影响判断与认定可信度是不同关系。</li>\n<li>B：do seem to be influenced by明确说检察官受到CSR记录影响，B把这一被动关系转成记录影响他们的决定。</li>\n<li>C：研究对象已是被起诉的公司，比较的是罚款轻重。C却问受处罚的概率是否增加，换掉了所研究的结果。</li>\n<li>D：调查中不消费产品，用来隔离光环效应；记录影响评估，并不等于记录被正式列为调查内容。</li>\n</ul>\n<h2>35题</h2>\n<blockquote>\n<p>Which of the following is true of CSR, according to the last paragraph?</p>\n<p>根据最后一段，关于企业社会责任，下列哪项说法正确？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：将研究尚未解决的问题与But at least后已表明的结果分开，不能把一种作用扩大为所有情形。</p>\n<p>题干明示the last paragraph，定位第六段。第34题已经把这一段完整读过；这里从研究没有回答的两个问题读到But at least之后已证明的结果，保持这两个层次分开。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR.</p>\n<p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<h3>A. The necessary amount of companies’ spending on it is unknown.</h3>\n<blockquote>\n<p>根据末段，公司为CSR应投入的金额尚不明确。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>does not answer how much businesses ought to spend明确留下适当投入金额的问题。A的necessary amount对应应投入多少，而非实际已花多少。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据末段，公司为CSR应投入的金额尚不明确。</p>\n</blockquote>\n<p><code>necessary amount</code>对应<code>how much businesses ought to spend</code>，末段首句直接谈这笔支出，所以核对这个完整句。</p>\n<p>原文说研究没有回答<code>how much businesses ought to spend</code>，也就是企业应该为社会责任花多少钱。<code>necessary amount</code>把这笔应该投入的金额概括为所需支出，<code>is unknown</code>对应这项研究尚未给出答案。两边问的都是适当投入多少，而不是公司实际上已经花了多少钱；题目又限定根据末段，因此这一概括能接上。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n<p>研究者承认，研究没有回答企业应该在CSR上花多少钱，也没有揭示企业制定公益政策时在多大程度上寄望光环效应而非其他可能收益。但至少已经表明：企业遇到法律麻烦时，良好品行的证据可能为它争取代价较低的处罚。</p>\n</blockquote>\n<p>研究者先界定未解决的支出数额，再说企业究竟寄望哪种收益也未厘清，最后保留已经证明的轻罚作用。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The necessary amount of companies’ spending on it is unknown.</p>\n<p>根据末段，公司为CSR应投入的金额尚不明确。</p>\n</blockquote>\n<p>A是在末段研究范围内概括数额尚未明确，不必扩大成所有人、所有研究永远不知道，也不能与前文年度总支出混淆。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n<h3>B. Companies’ financial capacity for it has been overestimated.</h3>\n<blockquote>\n<p>根据末段，公司承担CSR的财力被高估。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>应该花多少是适当投入问题，有没有财力是支付能力问题。B还增加能力被高估这一判断，末段两层都未建立。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据末段，公司承担CSR的财力被高估。</p>\n</blockquote>\n<p>应该花多少是适当投入问题，有没有财力是支付能力问题。B还增加能力被高估这一判断，末段两层都未建立。</p>\n<p>作者承认研究没有回答最佳支出，并未报告企业的资产、预算或支付能力评估。</p>\n<p>B需要先有对财力的估计，再证明估计过高。原文仅说未得出应投入数额，未知不能改成已经作了错误的高估。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n<p>研究者承认，研究没有回答企业应该在CSR上花多少钱，也没有揭示企业制定公益政策时在多大程度上寄望光环效应而非其他可能收益。但至少已经表明：企业遇到法律麻烦时，良好品行的证据可能为它争取代价较低的处罚。</p>\n</blockquote>\n<p>作者承认研究没有回答最佳支出，并未报告企业的资产、预算或支付能力评估。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Companies’ financial capacity for it has been overestimated.</p>\n<p>根据末段，公司承担CSR的财力被高估。</p>\n</blockquote>\n<p>B需要先有对财力的估计，再证明估计过高。原文仅说未得出应投入数额，未知不能改成已经作了错误的高估。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n<h3>C. Its negative effects on businesses are often overlooked.</h3>\n<blockquote>\n<p>根据末段，CSR对公司的负面作用常被忽略。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>末段已证明的结果是处罚代价降低，属于企业所得好处。它没有列CSR给企业的负面影响，更未说这些影响常被忽略。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据末段，CSR对公司的负面作用常被忽略。</p>\n</blockquote>\n<p>末段已证明的结果是处罚代价降低，属于企业所得好处。它没有列CSR给企业的负面影响，更未说这些影响常被忽略。</p>\n<p>两项研究局限分别关乎支出额和企业期待，But at least随后保留一个有利的经济结果。</p>\n<p>C需要负面作用存在以及经常被忽视的双重证据。未解决某些研究问题，不能自动转成不利后果被研究者或企业忽略。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n<p>研究者承认，研究没有回答企业应该在CSR上花多少钱，也没有揭示企业制定公益政策时在多大程度上寄望光环效应而非其他可能收益。但至少已经表明：企业遇到法律麻烦时，良好品行的证据可能为它争取代价较低的处罚。</p>\n</blockquote>\n<p>两项研究局限分别关乎支出额和企业期待，But at least随后保留一个有利的经济结果。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Its negative effects on businesses are often overlooked.</p>\n<p>根据末段，CSR对公司的负面作用常被忽略。</p>\n</blockquote>\n<p>C需要负面作用存在以及经常被忽视的双重证据。未解决某些研究问题，不能自动转成不利后果被研究者或企业忽略。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n<h3>D. It has brought much benefit to the banking industry.</h3>\n<blockquote>\n<p>根据末段，CSR已给银行业带来大量好处。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>banking on the halo effect是寄望光环效应，banking on在这里并非银行业。末句的受益对象仍是一般遭遇法律麻烦的公司。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据末段，CSR已给银行业带来大量好处。</p>\n</blockquote>\n<p>先看<code>companies are banking on the halo effect</code>。<code>bank on</code>在这里是指望、依赖，主语是companies，所寄望的对象是halo effect。不能见到banking就把句子理解成银行业。</p>\n<p>这句话还以<code>Nor does it reveal how much</code>开头，承认研究尚未弄清企业多大程度寄望这种作用。它并没有说某行业已经获得大量收益。</p>\n<p>末句能够确认的是：一般公司遇到法律麻烦时，良好品行材料<code>can win them a less costly punishment</code>。D将companies缩成银行业，又把特定情境下可以获得的结果写成已经发生的大量好处，两处都不能对应。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n<p>研究者承认，研究没有回答企业应该在CSR上花多少钱，也没有揭示企业制定公益政策时在多大程度上寄望光环效应而非其他可能收益。但至少已经表明：企业遇到法律麻烦时，良好品行的证据可能为它争取代价较低的处罚。</p>\n</blockquote>\n<p>作者先说尚不清楚企业多大程度寄望光环效应，再给出法律困境下可能减轻处罚的结论。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It has brought much benefit to the banking industry.</p>\n<p>根据末段，CSR已给银行业带来大量好处。</p>\n</blockquote>\n<p>D把一个动词短语读成特定行业，又把can win的条件性收益说成已给银行业大量好处。原文既未缩小为银行，也没有这一已实现总量。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n<h3>35题结论</h3>\n<blockquote>\n<p><strong>35. A</strong></p>\n</blockquote>\n<ul>\n<li>A：does not answer how much businesses ought to spend明确留下适当投入金额的问题。A的necessary amount对应应投入多少，而非实际已花多少。</li>\n<li>B：应该花多少是适当投入问题，有没有财力是支付能力问题。B还增加能力被高估这一判断，末段两层都未建立。</li>\n<li>C：末段已证明的结果是处罚代价降低，属于企业所得好处。它没有列CSR给企业的负面影响，更未说这些影响常被忽略。</li>\n<li>D：banking on the halo effect是寄望光环效应，banking on在这里并非银行业。末句的受益对象仍是一般遭遇法律麻烦的公司。</li>\n</ul>\n<h1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h1>\n<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：传统观点与新发现的对比</strong>（段落1核心论点） 弗里德曼观点：企业唯一社会责任是增加利润（CSR是浪费股东资金）// 新研究发现：CSR可能创造货币价值（至少在因腐败被起诉时）</p>\n<p>↓（具体机制分析）</p>\n<p><strong>逻辑层次2：CSR创造价值的三种方式</strong>（段落2价值创造机制） 美英大公司每年花费150亿美元在CSR → 三种价值创造方式：【1.质量信号（消费者认为CSR支出=高质量产品）+ 2.间接捐赠（购买产品=支持善举）+ 3.光环效应（善行赢得更多好感）】</p>\n<p>↓（研究方法创新）</p>\n<p><strong>逻辑层次3：研究设计的巧妙之处</strong>（段落3研究方法） 问题：之前研究难以区分三种效应（消费者同时受三种影响）→ 解决方案：研究FCPA贿赂起诉案（检察官不消费产品，只受光环效应影响）</p>\n<p>↓（研究发现）</p>\n<p><strong>逻辑层次4：CSR与处罚宽松度的关系</strong>（段落4-5实证发现） 发现1：拥有全面CSR项目的公司获得更宽松处罚 → 排除政治影响：（政治捐款多≠罚款少）→ 发现2：【检察官应只看案件实质 // 但确实受CSR记录影响】→ 具体数据：（消除童工或增加20%捐赠 = 罚款减少40%）</p>\n<p>↓（研究局限与意义）</p>\n<p><strong>逻辑层次5：研究的局限性与贡献</strong>（段落6总结评价） 局限：【未回答企业应在CSR上花费多少 + 未揭示公司对光环效应的依赖程度】// 贡献：证明了良好品格的证据可获得较轻惩罚</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：尽管传统观点认为CSR是浪费股东资金，但新研究通过巧妙的研究设计证明，CSR至少在企业面临法律麻烦时能够通过光环效应创造实际的货币价值。</p>\n<h3>小标题题</h3>\n<p><strong>Directions:</strong></p>\n<p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A. What the study establishes and leaves unanswered</p>\n<p>B. Separating reputation from consumer responses</p>\n<p>C. A challenge to a simple divide between profit and responsibility</p>\n<p>D. Three ways responsible conduct may add business value</p>\n<p>E. Political donations as the proven cause of lower fines</p>\n<p>F. Evidence that a responsible record can soften penalties</p>\n<p>G. A universal formula for how much every firm should spend</p>\n<p><strong>41.</strong></p>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n<p><strong>42.</strong></p>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n<p><strong>43.</strong></p>\n<p>Previous studies on CSR have had trouble differentiating these effects because consumers can be affected by all three. A recent study attempts to separate them by looking at bribery prosecutions under America&#39;s Foreign Corrupt Practices Act (FCPA). It argues that since prosecutors do not consume a company&#39;s products as part of their investigations, they could be influenced only by the halo effect.</p>\n<p><strong>44.</strong></p>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines. In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n<p><strong>45.</strong></p>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n<h3>小标题题 · 41题</h3>\n<p>【答案】C. A challenge to a simple divide between profit and responsibility</p>\n<blockquote>\n<p>对利润与责任简单二分的质疑</p>\n</blockquote>\n<p>先引Friedman把企业责任限于利润，再以But even if提出保留，并引入腐败起诉中的经济价值。</p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut.</p>\n</blockquote>\n<p>先引利润责任论，But even if随即让步并限制将CSR看成浪费的理解，作者在利润目标内部检验简单划分。</p>\n<blockquote>\n<p>New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n</blockquote>\n<p>新研究提出CSR也能创造货币价值，at least限定在腐败起诉场景，给前面的质疑提供具体方向而不是无限承诺。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>利润责任前提 → 不能简单认定CSR浪费 → 腐败起诉中的经济收益线索</p>\n</blockquote>\n<p>challenge对应让步后的反驳，simple divide对应责任被视为浪费股东钱的绝对化判断。</p>\n<p>再看最强干扰项G：A universal formula for how much every firm should spend。</p>\n<p>开头提出新研究作用，并未给出任何通用投入金额。</p>\n<p><strong>41题选C。</strong></p>\n<h3>小标题题 · 42题</h3>\n<p>【答案】D. Three ways responsible conduct may add business value</p>\n<blockquote>\n<p>负责任行为可能增加商业价值的三种方式</p>\n</blockquote>\n<p>段落用First、Second、third列出产品质量信号、间接捐助和光环效应。</p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm.</p>\n</blockquote>\n<p>年度总支出先说明CSR投入规模，This could add value转入这些支出可能怎样使公司获益。</p>\n<blockquote>\n<p>First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality.</p>\n</blockquote>\n<p>First说明产品质量信号，Second的购买又能满足间接支持公益的意愿，两条路径都经过消费者的产品相关判断。</p>\n<blockquote>\n<p>And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n<p>third将作用扩成一般好感，消费者和其他人都可能因此更愿照顾企业。标题须同时覆盖三种途径，不能只取其中一条。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>CSR支出 → 质量信号与购买支持公益 → 更广泛的光环好感</p>\n</blockquote>\n<p>three ways与列举结构一致，may保留这些作用的可能性。</p>\n<p>再看最强干扰项E：Political donations as the proven cause of lower fines。</p>\n<p>这里解释三种获益途径，没有把政治捐款列为原因。</p>\n<p><strong>42题选D。</strong></p>\n<h3>小标题题 · 43题</h3>\n<p>【答案】B. Separating reputation from consumer responses</p>\n<blockquote>\n<p>将声誉作用与消费者反应分开</p>\n</blockquote>\n<p>以往消费者会同时受三种机制影响；新研究转向不消费公司产品的检察官，以单独观察光环效应。</p>\n<blockquote>\n<p>Previous studies on CSR have had trouble differentiating these effects because consumers can be affected by all three.</p>\n</blockquote>\n<p>消费者可能同时受三种机制影响，所以既有研究难以区分各自作用，段首提出的是识别困难。</p>\n<blockquote>\n<p>A recent study attempts to separate them by looking at bribery prosecutions under America&#39;s Foreign Corrupt Practices Act (FCPA).</p>\n</blockquote>\n<p>新研究改看贿赂起诉，选择了检察官作为判断者，改变场景是为了分离机制。</p>\n<blockquote>\n<p>It argues that since prosecutors do not consume a company&#39;s products as part of their investigations, they could be influenced only by the halo effect.</p>\n</blockquote>\n<p>since说明其依据：调查并不以消费产品为组成部分，研究因而把可能作用聚焦在光环效应。标题应覆盖为何换研究对象。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>消费者受多机制重叠影响 → 转向起诉与检察官 → 排除产品消费路径以观察光环</p>\n</blockquote>\n<p>separating对应differentiate与separate；consumer responses正是需要排除的混杂。</p>\n<p>再看最强干扰项D：Three ways responsible conduct may add business value。</p>\n<p>D只是列出机制，本段重点是研究如何区分这些机制。</p>\n<p><strong>43题选B。</strong></p>\n<h3>小标题题 · 44题</h3>\n<p>【答案】F. Evidence that a responsible record can soften penalties</p>\n<blockquote>\n<p>责任记录可能减轻处罚的证据</p>\n</blockquote>\n<p>先报告社会责任较全面者处罚较轻，再排除政治影响解释，最后以数量估计说明实际影响。</p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties.</p>\n</blockquote>\n<p>CSR最全面者处罚较轻，是研究先给出的发现；随后政治捐款没有带来低罚款，用来排除另一解释。</p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR.</p>\n</blockquote>\n<p>whereas把只应按案情判断与实际受CSR影响相对，明确研究所观察的影响关系。</p>\n<blockquote>\n<p>&quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n<p>改善劳动权利或增加捐赠与罚款降低的估计，把影响落实到经济幅度，不能改成政治捐款降低罚款。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>发现CSR与轻罚相连 → 排除政治影响解释 → CSR记录影响判断并给出数量估计</p>\n</blockquote>\n<p>responsible record对应CSR programmes与record，soften penalties对应lenient和lower fines。</p>\n<p>再看最强干扰项E：Political donations as the proven cause of lower fines。</p>\n<p>政治捐款解释被明确排除，不能当成研究证明的原因。</p>\n<p><strong>44题选F。</strong></p>\n<h3>小标题题 · 45题</h3>\n<p>【答案】A. What the study establishes and leaves unanswered</p>\n<blockquote>\n<p>研究证明了什么又留下哪些问题</p>\n</blockquote>\n<p>研究仍不能回答应投入多少、企业有多指望光环效应，但已证明违法受罚时好品格证据可能减少代价。</p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR.</p>\n</blockquote>\n<p>首句承认适当投入多少尚无答案，局限在支出决策，而非否认前面的处罚发现。</p>\n<blockquote>\n<p>Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies.</p>\n</blockquote>\n<p>Nor继续补企业动机未知：banking on是寄望，研究还未区分企业期待光环与其他好处的程度。</p>\n<blockquote>\n<p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<p>But at least转回能够保留的结果：法律麻烦中好品行材料可减轻代价，标题应同时容纳已知与未知。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>最佳支出未知 → 企业期待哪种收益未知 → 有限场景下轻罚作用仍成立</p>\n</blockquote>\n<p>establishes与leaves unanswered分别对应But at least和does not answer/Nor。</p>\n<p>再看最强干扰项G：A universal formula for how much every firm should spend。</p>\n<p>此段明确投入金额尚未解决，通用公式与原文相反。</p>\n<p><strong>45题选A。</strong></p>\n<h3>排序题</h3>\n<p><strong>Directions:</strong></p>\n<p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p>\n<p>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p>\n<p><strong>A.</strong></p>\n<p>The claim that a company has no social responsibility beyond increasing profit draws a sharp boundary between business returns and good conduct. Recent research questions that boundary. Even if responsible policies cost shareholders money, they may also create monetary value in circumstances that are not immediately obvious.</p>\n<p><strong>B.</strong></p>\n<p>These estimates show an economic effect, but they do not establish the ideal level of responsible spending. The study cannot tell every business how much it ought to invest. Nor does the association show that all types of social responsibility produce exactly the same return in every setting.</p>\n<p><strong>C.</strong></p>\n<p>Another unanswered question concerns what companies themselves expect when choosing such policies. They may hope for reputational advantages, consumer support or other benefits. The study does not separate those motives, so an observed advantage should not be confused with proof of the intention behind every programme.</p>\n<p><strong>D.</strong></p>\n<p>Their overlap makes it difficult to identify the effect of reputation alone. To separate it from the other responses, researchers turned to bribery prosecutions. Prosecutors assessing a company do not buy its products as part of the investigation, making their decisions a useful setting in which to examine the halo effect.</p>\n<p><strong>E.</strong></p>\n<p>In that setting, firms with more comprehensive social-responsibility programmes tended to receive more lenient penalties. The researchers then tested whether political influence could explain the association instead. Companies that gave more to political campaigns did not receive lower fines, weakening that alternative explanation.</p>\n<p><strong>F.</strong></p>\n<p>Several routes to that value have been proposed. Consumers may read responsible spending as a sign of product quality, buy products to support a cause, or respond favourably to a general reputation for good deeds. These routes are different, although the same customer may be influenced by all of them.</p>\n<p><strong>G.</strong></p>\n<p>With the political explanation weakened, the findings pointed back to the company’s record of good conduct. Such a record appeared to affect judgments that should have depended only on the merits of the case. The researchers offered estimates linking better labour practices or greater giving with substantially lower fines.</p>\n<p><strong>H.</strong></p>\n<p>Despite these limits, the narrower conclusion remains. When a company faces legal trouble, evidence of good character can reduce the cost of punishment. That finding challenges a simple opposition between social responsibility and economic value without turning responsible conduct into a guaranteed investment formula.</p>\n<h3>排序题 · 全局解析</h3>\n<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>以利润与责任之分引入质疑</td>\n</tr>\n<tr>\n<td>B</td>\n<td>限定研究不能确定最佳投入量</td>\n</tr>\n<tr>\n<td>C</td>\n<td>补充企业期待和动机尚未被识别</td>\n</tr>\n<tr>\n<td>D</td>\n<td>说明机制重叠并选择检察官作研究对象</td>\n</tr>\n<tr>\n<td>E</td>\n<td>报告处罚较轻并排除政治捐款解释</td>\n</tr>\n<tr>\n<td>F</td>\n<td>列举三种潜在获益机制</td>\n</tr>\n<tr>\n<td>G</td>\n<td>把解释落回责任记录及其量化效果</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结有边界的经济价值结论</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>以利润与责任之分引入质疑 → 列举三种潜在获益机制 → 说明机制重叠并选择检察官作研究对象 → 报告处罚较轻并排除政治捐款解释 → 把解释落回责任记录及其量化效果 → 限定研究不能确定最佳投入量 → 补充企业期待和动机尚未被识别 → 总结有边界的经济价值结论</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n<h3>排序题 · 41题</h3>\n<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Even if responsible policies cost shareholders money, they may also create monetary value in circumstances that are not immediately obvious.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Several routes to that value have been proposed.</p>\n</blockquote>\n<p>A末句提出CSR也可能创造monetary value，F的that value回指这一潜在价值，开始回答实现它有哪些途径。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Consumers may read responsible spending as a sign of product quality, buy products to support a cause, or respond favourably to a general reputation for good deeds. These routes are different, although the same customer may be influenced by all of them.</p>\n</blockquote>\n<p>消费者可将支出当质量信号、通过购买支持公益，也可因好名声作正面反应；末句强调同一顾客可能同时受三者影响。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Their overlap makes it difficult to identify the effect of reputation alone.</p>\n</blockquote>\n<p>D的Their overlap接F末句的多机制同时影响，继而解释为什么难单独识别声誉作用。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>以利润与责任之分引入质疑 → 列举三种潜在获益机制 → 说明机制重叠并选择检察官作研究对象</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>With the political explanation weakened, the findings pointed back to the company’s record of good conduct.</p>\n</blockquote>\n<p>G的political explanation weakened要求先出现政治影响及其被削弱的证据，A尚只提出潜在收益，不能提前放入研究结论。</p>\n<p><strong>41题选F。</strong></p>\n<h3>排序题 · 42题</h3>\n<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>These routes are different, although the same customer may be influenced by all of them.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Their overlap makes it difficult to identify the effect of reputation alone.</p>\n</blockquote>\n<p>F说同一消费者受所有机制影响，D用Their overlap概括这一重叠，再提出隔离reputation alone的识别任务。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>To separate it from the other responses, researchers turned to bribery prosecutions. Prosecutors assessing a company do not buy its products as part of the investigation, making their decisions a useful setting in which to examine the halo effect.</p>\n</blockquote>\n<p>研究转向检察官，因为其案件调查不包含购买产品，排除消费反应后才有条件单独观察光环。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>In that setting, firms with more comprehensive social-responsibility programmes tended to receive more lenient penalties.</p>\n</blockquote>\n<p>E的In that setting指D设定的贿赂起诉环境，随后报告在该场景下CSR全面公司处罚更轻。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>列举三种潜在获益机制 → 说明机制重叠并选择检察官作研究对象 → 报告处罚较轻并排除政治捐款解释</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>With the political explanation weakened, the findings pointed back to the company’s record of good conduct.</p>\n</blockquote>\n<p>G已经说政治解释被削弱，是观察结果之后的推论；F还没介绍研究场景，直接接G会让findings和political explanation都无前提。</p>\n<p><strong>42题选D。</strong></p>\n<h3>排序题 · 43题</h3>\n<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Companies that gave more to political campaigns did not receive lower fines, weakening that alternative explanation.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>With the political explanation weakened, the findings pointed back to the company’s record of good conduct.</p>\n</blockquote>\n<p>E末句说政治竞选捐款多未换来低罚款，G的With the political explanation weakened逐句承接这项排除。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Such a record appeared to affect judgments that should have depended only on the merits of the case. The researchers offered estimates linking better labour practices or greater giving with substantially lower fines.</p>\n</blockquote>\n<p>G把解释落回good conduct record，并用改善劳动实践、增加捐赠与低罚款的估计具体说明影响。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>These estimates show an economic effect, but they do not establish the ideal level of responsible spending.</p>\n</blockquote>\n<p>B的These estimates回指G末句的数量估计，再由经济效果转入不能确定最佳支出的局限。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>报告处罚较轻并排除政治捐款解释 → 把解释落回责任记录及其量化效果 → 限定研究不能确定最佳投入量</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Another unanswered question concerns what companies themselves expect when choosing such policies.</p>\n</blockquote>\n<p>C的Another unanswered question须前面已有一个未回答问题；E此时在排除政治解释，尚未转到研究局限，先接C会无端跳层。</p>\n<p><strong>43题选G。</strong></p>\n<h3>排序题 · 44题</h3>\n<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>The researchers offered estimates linking better labour practices or greater giving with substantially lower fines.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>These estimates show an economic effect, but they do not establish the ideal level of responsible spending.</p>\n</blockquote>\n<p>G刚给出更好劳动实践或捐赠与低罚款的estimates，B用These estimates承接，承认效果但限定其不能给出理想投入量。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The study cannot tell every business how much it ought to invest. Nor does the association show that all types of social responsibility produce exactly the same return in every setting.</p>\n</blockquote>\n<p>不能指导每家企业应该投入多少，也不能证明每种CSR在每种场景都有相同回报，B具体划定可推广的范围。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>Another unanswered question concerns what companies themselves expect when choosing such policies.</p>\n</blockquote>\n<p>C的Another unanswered question将第二个未知问题接在B的支出额未知之后，转到企业自身期待。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>把解释落回责任记录及其量化效果 → 限定研究不能确定最佳投入量 → 补充企业期待和动机尚未被识别</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Several routes to that value have been proposed.</p>\n</blockquote>\n<p>F再次列潜在收益机制，是研究起点，不是对当前数量估计的限制。放此处会使C的Another找不到紧接的第一个未知问题。</p>\n<p><strong>44题选B。</strong></p>\n<h3>排序题 · 45题</h3>\n<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Nor does the association show that all types of social responsibility produce exactly the same return in every setting.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Another unanswered question concerns what companies themselves expect when choosing such policies.</p>\n</blockquote>\n<p>B限定收益不能普遍推开，C的Another unanswered question再补动机层面的局限，与前一未知问题并列。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>They may hope for reputational advantages, consumer support or other benefits. The study does not separate those motives, so an observed advantage should not be confused with proof of the intention behind every programme.</p>\n</blockquote>\n<p>企业可能期待声誉、消费者支持或别的收益，但研究未分离这些动机，因此观察到收益不能当成每项计划意图的证明。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Despite these limits, the narrower conclusion remains.</p>\n</blockquote>\n<p>H的Despite these limits概括前两段支出与动机局限，再回到narrower conclusion，形成承认边界后的结论。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>限定研究不能确定最佳投入量 → 补充企业期待和动机尚未被识别 → 总结有边界的经济价值结论</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Several routes to that value have been proposed.</p>\n</blockquote>\n<p>F重新解释三种获益途径，没有说明研究不知道什么；它会让H的these limits缺少本应刚列出的动机限制。</p>\n<p><strong>45题选C。</strong></p>\n<h1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h1>\n<h2>1. 大作文第一段描述题目信息时可积累的主题词</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>corporate social responsibility</strong></td>\n<td><strong>企业社会责任</strong></td>\n<td><strong>社会现象类｜科技经济</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>responsible business conduct</td>\n<td>负责任的经营行为</td>\n<td>社会现象类｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>consumer trust</td>\n<td>消费者信任</td>\n<td>社会现象类｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>personal integrity</strong></td>\n<td><strong>个人诚信</strong></td>\n<td><strong>人生哲理类｜诚信</strong></td>\n<td><strong>个人主题</strong></td>\n</tr>\n<tr>\n<td>fair judgment</td>\n<td>公正判断</td>\n<td>人生哲理类｜独立与理性思考</td>\n<td>个人主题</td>\n</tr>\n<tr>\n<td>the protection of labour rights</td>\n<td>劳动权利保护</td>\n<td>社会现象类｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>charitable giving</td>\n<td>慈善捐赠</
