一回应写成赞同，就把作者提出疑问的方向改成了认可。</p>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n<p>诺贝尔经济学奖得主Friedman写道，企业唯一的社会责任是利用资源、开展增加利润的活动。但即便接受此前提、将CSR政策视为浪费股东资金，事情也未必如此泾渭分明。新研究表明，CSR可能为公司创造货币价值，至少在它们因腐败被起诉时如此。</p>\n</blockquote>\n<p>引语之后由But转向限制，再用CSR可能带来货币价值补出理由，论证方向是修正简单划分。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author views Friedman’s statement with approval.</p>\n<p>作者对Friedman的说法持赞同态度。</p>\n</blockquote>\n<p>C需要作者认可将CSR视为浪费这一判断。即便暂接受利润目标，仍可质疑浪费结论；不能只截accept而忽略even if与But。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. tolerance","raw":"### D. tolerance\n\n> 作者对Friedman的说法持宽容态度。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n作者评估的是原说法是否周全，并以新研究提出疑问；tolerance则是容让一种自己未必认同的意见，原文未表达这种接受态度。\n\n**出处：**\n\n> \"There is one and only one social responsibility of business,\" wrote Milton Friedman, a Nobel prize-winning economist, \"That is, to use its resources and engage in activities designed to increase its profits.\" But even if you accept Friedman's premise and regard corporate social responsibility (CSR) policies as a waste of shareholders' money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"31","option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-31-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-D-0\"><blockquote>\n<p>作者对Friedman的说法持宽容态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者评估的是原说法是否周全，并以新研究提出疑问；tolerance则是容让一种自己未必认同的意见，原文未表达这种接受态度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n</blockquote>\n</section>"},{"title":"D. tolerance","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 作者对Friedman的说法持宽容态度。\n\n`tolerance`写的是作者包容这一看法的态度；第一段中作者的回应是`things may not be absolutely clear-cut`，所以回到这个回应，检查作者是在包容观点，还是评价它是否说得成立。\n\n原文以`things may not be absolutely clear-cut`回应前面的看法，指出把企业社会责任视为浪费的判断不能如此简单下定论。`tolerance`则说作者对这种看法采取包容姿态。原句在评价判断是否足够周全，本项却把对判断本身的质疑换成对持有这种看法的接纳；让步前提中的接受也不能建立这种包容关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"31","option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-31-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-D-0\"><blockquote>\n<p>作者对Friedman的说法持宽容态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者评估的是原说法是否周全，并以新研究提出疑问；tolerance则是容让一种自己未必认同的意见，原文未表达这种接受态度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对Friedman的说法持宽容态度。</p>\n</blockquote>\n<p><code>tolerance</code>写的是作者包容这一看法的态度；第一段中作者的回应是<code>things may not be absolutely clear-cut</code>，所以回到这个回应，检查作者是在包容观点，还是评价它是否说得成立。</p>\n<p>原文以<code>things may not be absolutely clear-cut</code>回应前面的看法，指出把企业社会责任视为浪费的判断不能如此简单下定论。<code>tolerance</code>则说作者对这种看法采取包容姿态。原句在评价判断是否足够周全，本项却把对判断本身的质疑换成对持有这种看法的接纳；让步前提中的接受也不能建立这种包容关系。</p>\n</section>"},{"title":"D. tolerance","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> \"There is one and only one social responsibility of business,\" wrote Milton Friedman, a Nobel prize-winning economist, \"That is, to use its resources and engage in activities designed to increase its profits.\" But even if you accept Friedman's premise and regard corporate social responsibility (CSR) policies as a waste of shareholders' money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.\n>\n> 诺贝尔经济学奖得主Friedman写道，企业唯一的社会责任是利用资源、开展增加利润的活动。但即便接受此前提、将CSR政策视为浪费股东资金，事情也未必如此泾渭分明。新研究表明，CSR可能为公司创造货币价值，至少在它们因腐败被起诉时如此。\n\n让步只是进入对方前提，随后说明CSR也可能创造利润，焦点始终在命题是否说得成立。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The author views Friedman’s statement with tolerance.\n>\n> 作者对Friedman的说法持宽容态度。\n\nD需要即使不认同仍愿容纳的态度。原文给的是反向理由而非接纳姿态，不能将论证中的让步自动换成宽容。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"31","option":"D","cumulative":true,"cumulativeGroup":"question-31-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-31-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-31-option-D-0\"><blockquote>\n<p>作者对Friedman的说法持宽容态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>作者评估的是原说法是否周全，并以新研究提出疑问；tolerance则是容让一种自己未必认同的意见，原文未表达这种接受态度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对Friedman的说法持宽容态度。</p>\n</blockquote>\n<p><code>tolerance</code>写的是作者包容这一看法的态度；第一段中作者的回应是<code>things may not be absolutely clear-cut</code>，所以回到这个回应，检查作者是在包容观点，还是评价它是否说得成立。</p>\n<p>原文以<code>things may not be absolutely clear-cut</code>回应前面的看法，指出把企业社会责任视为浪费的判断不能如此简单下定论。<code>tolerance</code>则说作者对这种看法采取包容姿态。原句在评价判断是否足够周全，本项却把对判断本身的质疑换成对持有这种看法的接纳；让步前提中的接受也不能建立这种包容关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-31-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n<p>诺贝尔经济学奖得主Friedman写道，企业唯一的社会责任是利用资源、开展增加利润的活动。但即便接受此前提、将CSR政策视为浪费股东资金，事情也未必如此泾渭分明。新研究表明，CSR可能为公司创造货币价值，至少在它们因腐败被起诉时如此。</p>\n</blockquote>\n<p>让步只是进入对方前提，随后说明CSR也可能创造利润，焦点始终在命题是否说得成立。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author views Friedman’s statement with tolerance.</p>\n<p>作者对Friedman的说法持宽容态度。</p>\n</blockquote>\n<p>D需要即使不认同仍愿容纳的态度。原文给的是反向理由而非接纳姿态，不能将论证中的让步自动换成宽容。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"31题结论","raw":"### 31题结论\n\n> **31. B**\n\n- A：may not be absolutely clear-cut不是作者完全拿不准，而是借让步质疑“社会责任支出必然浪费”的简单理解，后面马上给经济价值的研究线索。\n- B：But even if先让步再限制原来的利润与责任划分，新研究又说CSR可能创造货币价值，支持skepticism的质疑态度。\n- C：you accept处于even if的假设让步中，作者真正接上的回应是事情未必如此分明。C把让步前提当成了作者赞同。\n- D：作者评估的是原说法是否周全，并以新研究提出疑问；tolerance则是容让一种自己未必认同的意见，原文未表达这种接受态度。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"31题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"31","questionConclusion":true},"html":"<blockquote>\n<p><strong>31. B</strong></p>\n</blockquote>\n<ul>\n<li>A：may not be absolutely clear-cut不是作者完全拿不准，而是借让步质疑“社会责任支出必然浪费”的简单理解，后面马上给经济价值的研究线索。</li>\n<li>B：But even if先让步再限制原来的利润与责任划分，新研究又说CSR可能创造货币价值，支持skepticism的质疑态度。</li>\n<li>C：you accept处于even if的假设让步中，作者真正接上的回应是事情未必如此分明。C把让步前提当成了作者赞同。</li>\n<li>D：作者评估的是原说法是否周全，并以新研究提出疑问；tolerance则是容让一种自己未必认同的意见，原文未表达这种接受态度。</li>\n</ul>\n"},{"title":"32题 · 题干、题型与核心出处","raw":"## 32题\n\n> According to Paragraph 2, CSR helps a company by ______.\n>\n> 根据第二段，企业社会责任通过什么方式帮助一家公司？\n\n### 题型\n\n细节题：逐一核对CSR如何使公司获益，特别区分消费者认识变化与产品本身质量变化。\n\n题干明确给出Paragraph 2，直接读第二段。从年度支出读到三种作用的末尾，完整看清每种作用涉及谁、发生什么。\n\n### 核心出处\n\n> This could add value to their businesses in three ways.\n>\n> First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.\n>\n> Second, customers may be willing to buy a company’s products as an indirect way to donate to the good causes it helps.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,525,1344,366],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"32","questionIntro":true},"html":"<blockquote>\n<p>According to Paragraph 2, CSR helps a company by ______.</p>\n<p>根据第二段，企业社会责任通过什么方式帮助一家公司？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：逐一核对CSR如何使公司获益，特别区分消费者认识变化与产品本身质量变化。</p>\n<p>题干明确给出Paragraph 2，直接读第二段。从年度支出读到三种作用的末尾，完整看清每种作用涉及谁、发生什么。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>This could add value to their businesses in three ways.</p>\n<p>First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.</p>\n<p>Second, customers may be willing to buy a company’s products as an indirect way to donate to the good causes it helps.</p>\n</blockquote>\n"},{"title":"A. guarding it against malpractices","raw":"### A. guarding it against malpractices\n\n> CSR通过以下方式帮助公司：防止其遭受不当行为之害。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\n三条作用都涉及消费者或他人怎样看待、购买、照顾企业，未说明能阻止企业遭遇或实施不当行为。\n\n**出处：**\n\n> The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a \"signal\" that a company's products are of high quality. Second, customers may be willing to buy a company's products as an indirect way to donate to the good causes it helps. And third, through a more diffuse \"halo effect,\" whereby its good deeds earn it greater consideration from consumers and others.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,525,1344,366],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-32-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-A-0\"><blockquote>\n<p>CSR通过以下方式帮助公司：防止其遭受不当行为之害。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>三条作用都涉及消费者或他人怎样看待、购买、照顾企业，未说明能阻止企业遭遇或实施不当行为。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n</section>"},{"title":"A. guarding it against malpractices","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> CSR通过以下方式帮助公司：防止其遭受不当行为之害。\n\n`guarding it against malpractices`要找不当行为怎样被防范；第二段归纳的帮助是`add value`，并具体落在消费者的质量判断、购买意愿和`greater consideration`上，因此核对这三种作用是否建立了防范行为的关系。\n\n原文把增加价值解释为消费者相信产品质量、愿意通过购买支持公益，以及公司获得`greater consideration`。`guarding it against malpractices`却把这种帮助写成防范不当行为，使公司免受其害。\n\n消费者形成好印象、愿意购买或给予照顾，是他人如何评价和对待公司；它们并没有建立阻止不当行为或抵御其损害的作用。\n\n本项把评价和购买上的好处接成了防范不当行为的保护。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,525,1344,366],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"A","cumulative":true,"cumulativeGroup":"question-32-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-32-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-A-0\"><blockquote>\n<p>CSR通过以下方式帮助公司：防止其遭受不当行为之害。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>三条作用都涉及消费者或他人怎样看待、购买、照顾企业，未说明能阻止企业遭遇或实施不当行为。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>CSR通过以下方式帮助公司：防止其遭受不当行为之害。</p>\n</blockquote>\n<p><code>guarding it against malpractices</code>要找不当行为怎样被防范；第二段归纳的帮助是<code>add value</code>，并具体落在消费者的质量判断、购买意愿和<code>greater consideration</code>上，因此核对这三种作用是否建立了防范行为的关系。</p>\n<p>原文把增加价值解释为消费者相信产品质量、愿意通过购买支持公益，以及公司获得<code>greater consideration</code>。<code>guarding it against malpractices</code>却把这种帮助写成防范不当行为，使公司免受其害。</p>\n<p>消费者形成好印象、愿意购买或给予照顾，是他人如何评价和对待公司；它们并没有建立阻止不当行为或抵御其损害的作用。</p>\n<p>本项把评价和购买上的好处接成了防范不当行为的保护。</p>\n</section>"},{"title":"A. guarding it against malpractices","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add 接回题干，整句话就变成：\n\n> CSR通过以下方式帮助公司：防止其被诽谤。\n\n`being defamed`涉及他人以言辞损害公司的名誉，第二段谈消费者把支出当作质量`signal`及公司得到`greater consideration`，因此回看第一种和第三种作用，区分正面评价与防止诽谤。\n\n`being defamed`则要求这笔支出起到防止他人诽谤公司的作用。得到好评价与阻止诽谤不是同一个行为：前者是消费者如何看待公司，后者涉及他人是否用言辞损害其名誉。本项把正面反应改写成抵御诽谤的保护。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,525,1344,366],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"B","cumulative":true,"cumulativeGroup":"question-32-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-32-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-B-0\"><blockquote>\n<p>CSR通过以下方式帮助公司：防止其被诽谤。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>good deeds带来greater consideration，说明更正面的对待；防止诽谤则要求阻止他人以不实言辞损害名誉，原段没有这一动作。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>CSR通过以下方式帮助公司：防止其被诽谤。</p>\n</blockquote>\n<p><code>being defamed</code>涉及他人以言辞损害公司的名誉，第二段谈消费者把支出当作质量<code>signal</code>及公司得到<code>greater consideration</code>，因此回看第一种和第三种作用，区分正面评价与防止诽谤。</p>\n<p><code>being defamed</code>则要求这笔支出起到防止他人诽谤公司的作用。得到好评价与阻止诽谤不是同一个行为：前者是消费者如何看待公司，后者涉及他人是否用言辞损害其名誉。本项把正面反应改写成抵御诽谤的保护。</p>\n</section>"},{ nning trust from consumers</code>将这种结果概括为赢得消费者信任，具体信任的就是公司产品的质量。原文并非说支出使产品质量实际提高，而是说它影响消费者怎么看产品；本项说赢得信任，保留了这种认识上的作用。</p>\n</section>"},{"title":"C. winning trust from consumers","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a \"signal\" that a company's products are of high quality. Second, customers may be willing to buy a company's products as an indirect way to donate to the good causes it helps. And third, through a more diffuse \"halo effect,\" whereby its good deeds earn it greater consideration from consumers and others.\n>\n> 咨询机构EPG估计，美英最大企业每年合计在CSR上支出逾150亿美元。这可能通过三条途径增加企业价值：消费者将支出看作产品高质量的信号；顾客愿意购买产品，间接捐助公司支持的公益事业；更广泛的光环效应使善行换来消费者及他人的更多善意对待。\n\nFirst先说明信号怎样进入消费者判断，Second再写购买支持公益，third补一般光环；第一条就给出信任的具体根据。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> CSR helps a company by winning trust from consumers.\n>\n> CSR通过以下方式帮助公司：赢得消费者信任。\n\nC不要求产品客观质量因捐助而提高。winning trust说外界更愿相信，正与take ... as a signal处在同一判断层面。\n\n**复盘判断：C正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,525,1344,366],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"C","cumulative":true,"cumulativeGroup":"question-32-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-32-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-C-0\"><blockquote>\n<p>CSR通过以下方式帮助公司：赢得消费者信任。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留C，此时C尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>消费者把CSR支出当作产品高质量的信号，因而更相信产品。C把这种认识上的好处概括为消费者信任。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>CSR通过以下方式帮助公司：赢得消费者信任。</p>\n</blockquote>\n<p><code>winning trust from consumers</code>要看消费者为何相信公司；第二段的<code>of high quality</code>说明他们怎样理解公司的产品，因此回看<code>First</code>引出的质量信号这一句。</p>\n<p>原文说消费者可能从公司的社会责任支出读出产品<code>of high quality</code>的信号，形成对产品质量的正面判断。<code>winning trust from consumers</code>将这种结果概括为赢得消费者信任，具体信任的就是公司产品的质量。原文并非说支出使产品质量实际提高，而是说它影响消费者怎么看产品；本项说赢得信任，保留了这种认识上的作用。</p>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n<p>咨询机构EPG估计，美英最大企业每年合计在CSR上支出逾150亿美元。这可能通过三条途径增加企业价值：消费者将支出看作产品高质量的信号；顾客愿意购买产品，间接捐助公司支持的公益事业；更广泛的光环效应使善行换来消费者及他人的更多善意对待。</p>\n</blockquote>\n<p>First先说明信号怎样进入消费者判断，Second再写购买支持公益，third补一般光环；第一条就给出信任的具体根据。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>CSR helps a company by winning trust from consumers.</p>\n<p>CSR通过以下方式帮助公司：赢得消费者信任。</p>\n</blockquote>\n<p>C不要求产品客观质量因捐助而提高。winning trust说外界更愿相信，正与take ... as a signal处在同一判断层面。</p>\n<p><strong>复盘判断：C正确。</strong></p>\n</section>"},{"title":"D. raising the quality of its products","raw":"### D. raising the quality of its products\n\n> CSR通过以下方式帮助公司：提高其产品质量。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\ntake ... as a signal说消费者据此认为产品质量高，D却说CSR提高了产品本身的质量，把认识变化改成实际改进。\n\n**出处：**\n\n> The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a \"signal\" that a company's products are of high quality. Second, customers may be willing to buy a company's products as an indirect way to donate to the good causes it helps. And third, through a more diffuse \"halo effect,\" whereby its good deeds earn it greater consideration from consumers and others.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,525,1344,366],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"32","option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-32-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-D-0\"><blockquote>\n<p>CSR通过以下方式帮助公司：提高其产品质量。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>take ... as a signal说消费者据此认为产品质量高，D却说CSR提高了产品本身的质量，把认识变化改成实际改进。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n</section>"},{"title":"D. raising the quality of its products","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> CSR通过以下方式帮助公司：提高其产品质量。\n\n`raising the quality`与第二段的`products are of high quality`都谈产品质量，但原文前面还有`take CSR spending as a` “`signal`”，因此回看这一完整句。\n\n原文的`take CSR spending as a` “`signal`”说消费者把社会责任支出理解成产品质量高的信号，变化发生在消费者的判断上。`raising the quality`却说支出提高了产品本身的质量。‘认为产品质量高’并不等于‘使产品质量提高’，本项把消费者认识产品的作用改成了改进产品的实际作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,525,1344,366],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-32-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-D-0\"><blockquote>\n<p>CSR通过以下方式帮助公司：提高其产品质量。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>take ... as a signal说消费者据此认为产品质量高，D却说CSR提高了产品本身的质量，把认识变化改成实际改进。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>CSR通过以下方式帮助公司：提高其产品质量。</p>\n</blockquote>\n<p><code>raising the quality</code>与第二段的<code>products are of high quality</code>都谈产品质量，但原文前面还有<code>take CSR spending as a</code> “<code>signal</code>”，因此回看这一完整句。</p>\n<p>原文的<code>take CSR spending as a</code> “<code>signal</code>”说消费者把社会责任支出理解成产品质量高的信号，变化发生在消费者的判断上。<code>raising the quality</code>却说支出提高了产品本身的质量。‘认为产品质量高’并不等于‘使产品质量提高’，本项把消费者认识产品的作用改成了改进产品的实际作用。</p>\n</section>"},{"title":"D. raising the quality of its products","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a \"signal\" that a company's products are of high quality. Second, customers may be willing to buy a company's products as an indirect way to donate to the good causes it helps. And third, through a more diffuse \"halo effect,\" whereby its good deeds earn it greater consideration from consumers and others.\n>\n> 咨询机构EPG估计，美英最大企业每年合计在CSR上支出逾150亿美元。这可能通过三条途径增加企业价值：消费者将支出看作产品高质量的信号；顾客愿意购买产品，间接捐助公司支持的公益事业；更广泛的光环效应使善行换来消费者及他人的更多善意对待。\n\n作者从支出走到消费者解释这一支出的方式，没有描述生产工艺、材料或检验水平发生变化。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> CSR helps a company by raising the quality of its products.\n>\n> CSR通过以下方式帮助公司：提高其产品质量。\n\nD需要CSR通过某种过程使产品更好。实际是给出质量信号，而信号可以影响信任，不能单凭这种信任证明质量已经提高。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,525,1344,366],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"32","option":"D","cumulative":true,"cumulativeGroup":"question-32-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-32-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-32-option-D-0\"><blockquote>\n<p>CSR通过以下方式帮助公司：提高其产品质量。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>take ... as a signal说消费者据此认为产品质量高，D却说CSR提高了产品本身的质量，把认识变化改成实际改进。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>CSR通过以下方式帮助公司：提高其产品质量。</p>\n</blockquote>\n<p><code>raising the quality</code>与第二段的<code>products are of high quality</code>都谈产品质量，但原文前面还有<code>take CSR spending as a</code> “<code>signal</code>”，因此回看这一完整句。</p>\n<p>原文的<code>take CSR spending as a</code> “<code>signal</code>”说消费者把社会责任支出理解成产品质量高的信号，变化发生在消费者的判断上。<code>raising the quality</code>却说支出提高了产品本身的质量。‘认为产品质量高’并不等于‘使产品质量提高’，本项把消费者认识产品的作用改成了改进产品的实际作用。</p>\n</section><section class=\"revealPart\" id=\"focus-question-32-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n<p>咨询机构EPG估计，美英最大企业每年合计在CSR上支出逾150亿美元。这可能通过三条途径增加企业价值：消费者将支出看作产品高质量的信号；顾客愿意购买产品，间接捐助公司支持的公益事业；更广泛的光环效应使善行换来消费者及他人的更多善意对待。</p>\n</blockquote>\n<p>作者从支出走到消费者解释这一支出的方式，没有描述生产工艺、材料或检验水平发生变化。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>CSR helps a company by raising the quality of its products.</p>\n<p>CSR通过以下方式帮助公司：提高其产品质量。</p>\n</blockquote>\n<p>D需要CSR通过某种过程使产品更好。实际是给出质量信号，而信号可以影响信任，不能单凭这种信任证明质量已经提高。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"32题结论","raw":"### 32题结论\n\n> **32. C**\n\n- A：三条作用都涉及消费者或他人怎样看待、购买、照顾企业，未说明能阻止企业遭遇或实施不当行为。\n- B：good deeds带来greater consideration，说明更正面的对待；防止诽谤则要求阻止他人以不实言辞损害名誉，原段没有这一动作。\n- C：消费者把CSR支出当作产品高质量的信号，因而更相信产品。C把这种认识上的好处概括为消费者信任。\n- D：take ... as a signal说消费者据此认为产品质量高，D却说CSR提高了产品本身的质量，把认识变化改成实际改进。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"32题","focus":[150,525,1344,366],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"32","questionConclusion":true},"html":"<blockquote>\n<p><strong>32. C</strong></p>\n</blockquote>\n<ul>\n<li>A：三条作用都涉及消费者或他人怎样看待、购买、照顾企业，未说明能阻止企业遭遇或实施不当行为。</li>\n<li>B：good deeds带来greater consideration，说明更正面的对待；防止诽谤则要求阻止他人以不实言辞损害名誉，原段没有这一动作。</li>\n<li>C：消费者把CSR支出当作产品高质量的信号，因而更相信产品。C把这种认识上的好处概括为消费者信任。</li>\n<li>D：take ... as a signal说消费者据此认为产品质量高，D却说CSR提高了产品本身的质量，把认识变化改成实际改进。</li>\n</ul>\n"},{"title":"33题 · 题干、题型与核心出处","raw":"## 33题\n\n> The expression “more lenient” (Line 2, Para. 4) is closest in meaning to ______.\n>\n> 第四段第二行的more lenient在意思上最接近什么？\n\n### 题型\n\n词义题：把more lenient放回penalties，利用后文罚款轻重的线索判断比较维度，并分清排除政治影响的否定句。\n\n题干给出more lenient和Para. 4，直接定位第四段。把发现和随后排除政治影响的解释一并读完，看这个词修饰什么、后文如何说明它。\n\n### 核心出处\n\n> those with the most comprehensive CSR programmes tended to get more lenient penalties\n>\n> Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"33","questionIntro":true},"html":"<blockquote>\n<p>The expression “more lenient” (Line 2, Para. 4) is closest in meaning to ______.</p>\n<p>第四段第二行的more lenient在意思上最接近什么？</p>\n</blockquote>\n<h3>题型</h3>\n<p>词义题：把more lenient放回penalties，利用后文罚款轻重的线索判断比较维度，并分清排除政治影响的否定句。</p>\n<p>题干给出more lenient和Para. 4，直接定位第四段。把发现和随后排除政治影响的解释一并读完，看这个词修饰什么、后文如何说明它。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>those with the most comprehensive CSR programmes tended to get more lenient penalties</p>\n<p>Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines</p>\n</blockquote>\n"},{"title":"A. less controversial","raw":"### A. less controversial\n\n> more lenient在此意为处罚争议更少。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\nmore lenient修饰penalties，后文以lower fines说明处罚负担，less controversial却比较争议多少。\n\n**出处：**\n\n> The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-33-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>more lenient在此意为处罚争议更少。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>more lenient修饰penalties，后文以lower fines说明处罚负担，less controversial却比较争议多少。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section>"},{"title":"A. less controversial","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> more lenient在此意为处罚争议更少。\n\n`less controversial`谈是否引起争议，而第四段随后用`lower fines`说明`leniency`所涉及的处罚变化，因此把含`more lenient`的句子和后面的解释一起核对。\n\n原文讨论被起诉公司受到怎样的处罚，后一句排除政治影响的解释时，具体看它们是否获得`lower fines`，衡量的是罚款轻重。`less controversial`却把处罚的特点说成争议较少，改为考察别人是否对处罚意见不一。罚款金额变低与处罚是否引发争议不是同一个比较方面，不能用后者解释这里的`more lenient`。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-33-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>more lenient在此意为处罚争议更少。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>more lenient修饰penalties，后文以lower fines说明处罚负担，less controversial却比较争议多少。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚争议更少。</p>\n</blockquote>\n<p><code>less controversial</code>谈是否引起争议，而第四段随后用<code>lower fines</code>说明<code>leniency</code>所涉及的处罚变化，因此把含<code>more lenient</code>的句子和后面的解释一起核对。</p>\n<p>原文讨论被起诉公司受到怎样的处罚，后一句排除政治影响的解释时，具体看它们是否获得<code>lower fines</code>，衡量的是罚款轻重。<code>less controversial</code>却把处罚的特点说成争议较少，改为考察别人是否对处罚意见不一。罚款金额变低与处罚是否引发争议不是同一个比较方面，不能用后者解释这里的<code>more lenient</code>。</p>\n</section>"},{"title":"A. less controversial","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.\n>\n> 研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。\n\n研究先报告CSR更全面者受罚较轻，再通过政治捐款与罚款是否更低检验另一种解释。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The penalties are less controversial.\n>\n> more lenient在此意为处罚争议更少。\n\nA需要处罚引发争论减少的证据。罚款较低只说明负担变化，不意味着公众、企业或检方的意见分歧减少。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"A","cumulative":true,"cumulativeGroup":"question-33-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-33-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-A-0\"><blockquote>\n<p>more lenient在此意为处罚争议更少。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>more lenient修饰penalties，后文以lower fines说明处罚负担，less controversial却比较争议多少。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚争议更少。</p>\n</blockquote>\n<p><code>less controversial</code>谈是否引起争议，而第四段随后用<code>lower fines</code>说明<code>leniency</code>所涉及的处罚变化，因此把含<code>more lenient</code>的句子和后面的解释一起核对。</p>\n<p>原文讨论被起诉公司受到怎样的处罚，后一句排除政治影响的解释时，具体看它们是否获得<code>lower fines</code>，衡量的是罚款轻重。<code>less controversial</code>却把处罚的特点说成争议较少，改为考察别人是否对处罚意见不一。罚款金额变低与处罚是否引发争议不是同一个比较方面，不能用后者解释这里的<code>more lenient</code>。</p>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n<p>研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。</p>\n</blockquote>\n<p>研究先报告CSR更全面者受罚较轻，再通过政治捐款与罚款是否更低检验另一种解释。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The penalties are less controversial.</p>\n<p>more lenient在此意为处罚争议更少。</p>\n</blockquote>\n<p>A需要处罚引发争论减少的证据。罚款较低只说明负担变化，不意味着公众、企业或检方的意见分歧减少。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. more lasting","raw":"### B. more lasting\n\n> more lenient在此意为处罚持续更久。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\nlower fines提供金额轻重的线索，lasting则是持续多久。文中没有把处罚时长作为比较标准。\n\n**出处：**\n\n> The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"33","option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-33-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-B-0\"><blockquote>\n<p>more lenient在此意为处罚持续更久。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>lower fines提供金额轻重的线索，lasting则是持续多久。文中没有把处罚时长作为比较标准。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section>"},{"title":"B. more lasting","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> more lenient在此意为处罚持续更久。\n\n`more lasting`谈持续时间；第四段却在解释`leniency`时提到`receive lower fines`，所以回看含`more lenient`的发现及随后这句解释。\n\n原文以被起诉公司的处罚为对象，随后的`receive lower fines`将解释落在罚款高低上，这是处罚负担的变化。`more lasting`却把它改成处罚或其效果维持更长时间。罚款较低不表达时间更长，原句也没有把这两个方面连接起来；将`lasting`放入，会把原来的轻重比较改成时长比较。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"B","cumulative":true,"cumu n> more lenient在此意为处罚持续更久。\n\nB换入后会说CSR更全面者得到更持久的处罚，与段落反复讨论的罚款减轻不是同一维度。\n\n**复盘判断：B错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"B","cumulative":true,"cumulativeGroup":"question-33-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-33-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-B-0\"><blockquote>\n<p>more lenient在此意为处罚持续更久。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>lower fines提供金额轻重的线索，lasting则是持续多久。文中没有把处罚时长作为比较标准。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚持续更久。</p>\n</blockquote>\n<p><code>more lasting</code>谈持续时间；第四段却在解释<code>leniency</code>时提到<code>receive lower fines</code>，所以回看含<code>more lenient</code>的发现及随后这句解释。</p>\n<p>原文以被起诉公司的处罚为对象，随后的<code>receive lower fines</code>将解释落在罚款高低上，这是处罚负担的变化。<code>more lasting</code>却把它改成处罚或其效果维持更长时间。罚款较低不表达时间更长，原句也没有把这两个方面连接起来；将<code>lasting</code>放入，会把原来的轻重比较改成时长比较。</p>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n<p>研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。</p>\n</blockquote>\n<p>作者用罚款高低落实leniency，随后也用40% lower fines量化这一负担，没有转向持续时间。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The penalties are more lasting.</p>\n<p>more lenient在此意为处罚持续更久。</p>\n</blockquote>\n<p>B换入后会说CSR更全面者得到更持久的处罚，与段落反复讨论的罚款减轻不是同一维度。</p>\n<p><strong>复盘判断：B错误。</strong></p>\n</section>"},{"title":"C. more effective","raw":"### C. more effective\n\n> more lenient在此意为处罚更有效。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第一类——歪曲原意。**\n\n罚款金额降低可说明处罚更宽，不足以说明惩戒更有效。effective把轻重换成实现目的的成效。\n\n**出处：**\n\n> The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"33","option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-33-option-C-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-C-0\"><blockquote>\n<p>more lenient在此意为处罚更有效。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>罚款金额降低可说明处罚更宽，不足以说明惩戒更有效。effective把轻重换成实现目的的成效。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section>"},{"title":"C. more effective","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> more lenient在此意为处罚更有效。\n\n`more effective`要比较处罚能否实现其目的，第四段解释`leniency`时用的是`lower fines`，所以重看这一处金额比较以及前面的研究发现。\n\n原文把`leniency`与`lower fines`接起来，讨论公司得到的处罚在负担上是否更轻，并排除政治影响作为原因。`more effective`却说处罚更能达到目的，转成对处罚成效的评价。金额较低可以说明处罚轻重，却不能自行说明惩戒效果更好；本项把处罚的力度改写成处罚的效果。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-33-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-C-0\"><blockquote>\n<p>more lenient在此意为处罚更有效。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>罚款金额降低可说明处罚更宽，不足以说明惩戒更有效。effective把轻重换成实现目的的成效。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚更有效。</p>\n</blockquote>\n<p><code>more effective</code>要比较处罚能否实现其目的，第四段解释<code>leniency</code>时用的是<code>lower fines</code>，所以重看这一处金额比较以及前面的研究发现。</p>\n<p>原文把<code>leniency</code>与<code>lower fines</code>接起来，讨论公司得到的处罚在负担上是否更轻，并排除政治影响作为原因。<code>more effective</code>却说处罚更能达到目的，转成对处罚成效的评价。金额较低可以说明处罚轻重，却不能自行说明惩戒效果更好；本项把处罚的力度改写成处罚的效果。</p>\n</section>"},{"title":"C. more effective","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.\n>\n> 研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。\n\n研究衡量的是公司承担多少处罚成本，未测试处罚能否更好防止再次行贿或产生威慑。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> The penalties are more effective.\n>\n> more lenient在此意为处罚更有效。\n\nC需要处罚效果提升的比较。原文只给较轻结果，既不能据此推得更有效，也不能反向武断说必然无效；它没有回答这里的宽严含义。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"C","cumulative":true,"cumulativeGroup":"question-33-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-33-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-C-0\"><blockquote>\n<p>more lenient在此意为处罚更有效。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>罚款金额降低可说明处罚更宽，不足以说明惩戒更有效。effective把轻重换成实现目的的成效。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚更有效。</p>\n</blockquote>\n<p><code>more effective</code>要比较处罚能否实现其目的，第四段解释<code>leniency</code>时用的是<code>lower fines</code>，所以重看这一处金额比较以及前面的研究发现。</p>\n<p>原文把<code>leniency</code>与<code>lower fines</code>接起来，讨论公司得到的处罚在负担上是否更轻，并排除政治影响作为原因。<code>more effective</code>却说处罚更能达到目的，转成对处罚成效的评价。金额较低可以说明处罚轻重，却不能自行说明惩戒效果更好；本项把处罚的力度改写成处罚的效果。</p>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n<p>研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。</p>\n</blockquote>\n<p>研究衡量的是公司承担多少处罚成本，未测试处罚能否更好防止再次行贿或产生威慑。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The penalties are more effective.</p>\n<p>more lenient在此意为处罚更有效。</p>\n</blockquote>\n<p>C需要处罚效果提升的比较。原文只给较轻结果，既不能据此推得更有效，也不能反向武断说必然无效；它没有回答这里的宽严含义。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. less severe","raw":"### D. less severe\n\n> more lenient在此意为处罚不那么严厉。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\nmore lenient表示更宽大的处罚，less severe就是不那么严厉。lower fines将这种宽大具体落实为更低罚款。\n\n**出处：**\n\n> The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-33-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-D-0\"><blockquote>\n<p>more lenient在此意为处罚不那么严厉。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>more lenient表示更宽大的处罚，less severe就是不那么严厉。lower fines将这种宽大具体落实为更低罚款。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section>"},{"title":"D. less severe","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> more lenient在此意为处罚不那么严厉。\n\n`less severe`比较处罚轻重，第四段后面的`lower fines`正用罚款金额解释宽严，因此连着读研究发现与这句解释。\n\n原文讨论公司受到`more lenient penalties`，随后在解释这种`leniency`的来源时考察是否有`lower fines`，罚款降低就是处罚负担减轻。`less severe`同样说处罚不那么严厉、负担较轻，既保持了`penalties`这一对象，也保持了原段的轻重比较，放回句中能够接上。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-33-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-D-0\"><blockquote>\n<p>more lenient在此意为处罚不那么严厉。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>more lenient表示更宽大的处罚，less severe就是不那么严厉。lower fines将这种宽大具体落实为更低罚款。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚不那么严厉。</p>\n</blockquote>\n<p><code>less severe</code>比较处罚轻重，第四段后面的<code>lower fines</code>正用罚款金额解释宽严，因此连着读研究发现与这句解释。</p>\n<p>原文讨论公司受到<code>more lenient penalties</code>，随后在解释这种<code>leniency</code>的来源时考察是否有<code>lower fines</code>，罚款降低就是处罚负担减轻。<code>less severe</code>同样说处罚不那么严厉、负担较轻，既保持了<code>penalties</code>这一对象，也保持了原段的轻重比较，放回句中能够接上。</p>\n</section>"},{"title":"D. less severe","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.\n>\n> 研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。\n\n研究发现CSR较全面者处罚较轻，再排除政治影响作为这一宽大结果的替代解释。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The penalties are less severe.\n>\n> more lenient在此意为处罚不那么严厉。\n\nD代入more lenient penalties仍在比较处罚严厉程度。尤其要分清：政治捐款多的公司没有获得低罚款，是为排除政治原因，不是说CSR不对应轻罚。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"33","option":"D","cumulative":true,"cumulativeGroup":"question-33-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-33-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-33-option-D-0\"><blockquote>\n<p>more lenient在此意为处罚不那么严厉。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>more lenient表示更宽大的处罚，less severe就是不那么严厉。lower fines将这种宽大具体落实为更低罚款。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>more lenient在此意为处罚不那么严厉。</p>\n</blockquote>\n<p><code>less severe</code>比较处罚轻重，第四段后面的<code>lower fines</code>正用罚款金额解释宽严，因此连着读研究发现与这句解释。</p>\n<p>原文讨论公司受到<code>more lenient penalties</code>，随后在解释这种<code>leniency</code>的来源时考察是否有<code>lower fines</code>，罚款降低就是处罚负担减轻。<code>less severe</code>同样说处罚不那么严厉、负担较轻，既保持了<code>penalties</code>这一对象，也保持了原段的轻重比较，放回句中能够接上。</p>\n</section><section class=\"revealPart\" id=\"focus-question-33-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n<p>研究发现，在被起诉公司中，CSR项目最全面的往往受到更宽大的处罚。分析排除了企业政治影响而非CSR立场造成宽大的可能：对政治竞选捐款更多的公司，并没有得到更低罚款。</p>\n</blockquote>\n<p>研究发现CSR较全面者处罚较轻，再排除政治影响作为这一宽大结果的替代解释。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The penalties are less severe.</p>\n<p>more lenient在此意为处罚不那么严厉。</p>\n</blockquote>\n<p>D代入more lenient penalties仍在比较处罚严厉程度。尤其要分清：政治捐款多的公司没有获得低罚款，是为排除政治原因，不是说CSR不对应轻罚。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"33题结论","raw":"### 33题结论\n\n> **33. D**\n\n- A：more lenient修饰penalties，后文以lower fines说明处罚负担，less controversial却比较争议多少。\n- B：lower fines提供金额轻重的线索，lasting则是持续多久。文中没有把处罚时长作为比较标准。\n- C：罚款金额降低可说明处罚更宽，不足以说明惩戒更有效。effective把轻重换成实现目的的成效。\n- D：more lenient表示更宽大的处罚，less severe就是不那么严厉。lower fines将这种宽大具体落实为更低罚款。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"33题","focus":[150,891,1344,430],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"33","questionConclusion":true},"html":"<blockquote>\n<p><strong>33. D</strong></p>\n</blockquote>\n<ul>\n<li>A：more lenient修饰penalties，后文以lower fines说明处罚负担，less controversial却比较争议多少。</li>\n<li>B：lower fines提供金额轻重的线索，lasting则是持续多久。文中没有把处罚时长作为比较标准。</li>\n<li>C：罚款金额降低可说明处罚更宽，不足以说明惩戒更有效。effective把轻重换成实现目的的成效。</li>\n<li>D：more lenient表示更宽大的处罚，less severe就是不那么严厉。lower fines将这种宽大具体落实为更低罚款。</li>\n</ul>\n"},{"title":"34题 · 题干、题型与核心出处","raw":"## 34题\n\n> When prosecutors evaluate a case, a company’s CSR record ______.\n>\n> 当检察官评估案件时，一家公司的企业社会责任记录会怎样？\n\n### 题型\n\n细节题：题干问CSR记录在检察官评估中产生什么作用，区分影响决定、证据可信度与调查程序。\n\n题干给出prosecutors evaluate a case，第五段开头正写检察官应如何evaluate a case，随后提到公司的record in CSR。先把第五段的结论与后面研究人员给出的数字全部读完。\n\n### 核心出处\n\n> Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment\n>\n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR.\n>\n> But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"34","questionIntro":true},"html":"<blockquote>\n<p>When prosecutors evaluate a case, a company’s CSR record ______.</p>\n<p>当检察官评估案件时，一家公司的企业社会责任记录会怎样？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：题干问CSR记录在检察官评估中产生什么作用，区分影响决定、证据可信度与调查程序。</p>\n<p>题干给出prosecutors evaluate a case，第五段开头正写检察官应如何evaluate a case，随后提到公司的record in CSR。先把第五段的结论与后面研究人员给出的数字全部读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment</p>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR.</p>\n<p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n"},{"title":"A. comes across as reliable evidence","raw":"### A. comes across as reliable evidence\n\n> 检察官评估案件时，CSR记录显得像可靠证据。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第三类——无中生有。**\n\nCSR记录影响检察官决定，不能等同于该记录被判定为可靠的案件证据。影响判断与认定可信度是不同关系。\n\n**出处：**\n\n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company's record in CSR. \"We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,\" says one researcher.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-34-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>检察官评估案件时，CSR记录显得像可靠证据。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>CSR记录影响检察官决定，不能等同于该记录被判定为可靠的案件证据。影响判断与认定可信度是不同关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n</section>"},{"title":"A. comes across as reliable evidence","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 检察官评估案件时，CSR记录显得像可靠证据。\n\n`reliable evidence`要查原文是否在评价证据的可信程度；第五段说检察官`be influenced by`这份记录，而粗读末段见过`evidence of good character`。先把第六段从研究局限读到末句，再把这句与第五段的影响关系一起核对。\n\n第五段说检察官本应按案情本身评估，却会`be influenced by`公司的社会责任记录；第六段把结果说得更具体，良好品行的证据能争取代价较低的处罚。原文讨论的是品行材料怎样影响处罚，`reliable evidence`则评价这份材料在检察官看来是否可信。\n\n材料产生影响，不等于研究已经确认它被判断为可靠；原文的`evidence of good character`限定了材料所表明的是品行，也没有把影响处罚这件事解释成证据可信度的认定。\n\n本项换掉了原文考察的关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-34-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>检察官评估案件时，CSR记录显得像可靠证据。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>CSR记录影响检察官决定，不能等同于该记录被判定为可靠的案件证据。影响判断与认定可信度是不同关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>检察官评估案件时，CSR记录显得像可靠证据。</p>\n</blockquote>\n<p><code>reliable evidence</code>要查原文是否在评价证据的可信程度；第五段说检察官<code>be influenced by</code>这份记录，而粗读末段见过<code>evidence of good character</code>。先把第六段从研究局限读到末句，再把这句与第五段的影响关系一起核对。</p>\n<p>第五段说检察官本应按案情本身评估，却会<code>be influenced by</code>公司的社会责任记录；第六段把结果说得更具体，良好品行的证据能争取代价较低的处罚。原文讨论的是品行材料怎样影响处罚，<code>reliable evidence</code>则评价这份材料在检察官看来是否可信。</p>\n<p>材料产生影响，不等于研究已经确认它被判断为可靠；原文的<code>evidence of good character</code>限定了材料所表明的是品行，也没有把影响处罚这件事解释成证据可信度的认定。</p>\n<p>本项换掉了原文考察的关系。</p>\n</section>"},{"title":"A. comes across as reliable evidence","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company's record in CSR. \"We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,\" says one researcher.\n>\n> 研究总的结论是，检察官本应只按案件本身的情况评估，但似乎确实受到公司CSR记录的影响。一位研究者说，他们估计，消除童工等重大的劳动权利问题，或将企业捐赠增加约20%，会使罚款通常比贿赂外国官员的一般处罚低40%左右。\n\n第五段先说本应按案情本身评估，却仍受公司CSR记录影响；末段再以良好品行证据降低处罚代价概括结果。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> A company’s CSR record comes across as reliable evidence.\n>\n> 检察官评估案件时，CSR记录显得像可靠证据。\n\nA需要检察官把材料视为可靠证据这一评价。evidence of good character只说明材料与品行的关系，未认定它能可靠证明本案事实。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"A","cumulative":true,"cumulativeGroup":"question-34-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-34-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-A-0\"><blockquote>\n<p>检察官评估案件时，CSR记录显得像可靠证据。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>CSR记录影响检察官决定，不能等同于该记录被判定为可靠的案件证据。影响判断与认定可信度是不同关系。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>检察官评估案件时，CSR记录显得像可靠证据。</p>\n</blockquote>\n<p><code>reliable evidence</code>要查原文是否在评价证据的可信程度；第五段说检察官<code>be influenced by</code>这份记录，而粗读末段见过<code>evidence of good character</code>。先把第六段从研究局限读到末句，再把这句与第五段的影响关系一起核对。</p>\n<p>第五段说检察官本应按案情本身评估，却会<code>be influenced by</code>公司的社会责任记录；第六段把结果说得更具体，良好品行的证据能争取代价较低的处罚。原文讨论的是品行材料怎样影响处罚，<code>reliable evidence</code>则评价这份材料在检察官看来是否可信。</p>\n<p>材料产生影响，不等于研究已经确认它被判断为可靠；原文的<code>evidence of good character</code>限定了材料所表明的是品行，也没有把影响处罚这件事解释成证据可信度的认定。</p>\n<p>本项换掉了原文考察的关系。</p>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n<p>研究总的结论是，检察官本应只按案件本身的情况评估，但似乎确实受到公司CSR记录的影响。一位研究者说，他们估计，消除童工等重大的劳动权利问题，或将企业捐赠增加约20%，会使罚款通常比贿赂外国官员的一般处罚低40%左右。</p>\n</blockquote>\n<p>第五段先说本应按案情本身评估，却仍受公司CSR记录影响；末段再以良好品行证据降低处罚代价概括结果。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A company’s CSR record comes across as reliable evidence.</p>\n<p>检察官评估案件时，CSR记录显得像可靠证据。</p>\n</blockquote>\n<p>A需要检察官把材料视为可靠证据这一评价。evidence of good character只说明材料与品行的关系，未认定它能可靠证明本案事实。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. has an impact on their decision","raw":"### B. has an impact on their decision\n\n> 检察官评估案件时，CSR记录影响他们的决定。\n\n**做题模式中的状态：** 第一轮保留B，此时B尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\ndo seem to be influenced by明确说检察官受到CSR记录影响，B把这一被动关系转成记录影响他们的决定。\n\n**出处：**\n\n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company's record in CSR. \"We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,\" says one researcher.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"me 处罚负担。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A company’s CSR record increases the chance of being penalized.</p>\n<p>检察官评估案件时，CSR记录增加公司受罚的可能性。</p>\n</blockquote>\n<p>C需要有无CSR记录改变公司会不会被罚的比较。已进入法律程序后的轻罚结果，不能证明受罚概率增大；它甚至把有利的负担变化换成更易受罚。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. constitutes part of the investigation","raw":"### D. constitutes part of the investigation\n\n> 检察官评估案件时，CSR记录构成调查的一部分。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n调查中不消费产品，用来隔离光环效应；记录影响评估，并不等于记录被正式列为调查内容。\n\n**出处：**\n\n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company's record in CSR. \"We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,\" says one researcher.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"34","option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-34-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-D-0\"><blockquote>\n<p>检察官评估案件时，CSR记录构成调查的一部分。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>调查中不消费产品，用来隔离光环效应；记录影响评估，并不等于记录被正式列为调查内容。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n</section>"},{"title":"D. constitutes part of the investigation","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 检察官评估案件时，CSR记录构成调查的一部分。\n\n`part of the investigation`让人回到第三段的`as part of their investigations`；先将第三段从以往研究的困难读到末尾，再看这句话把哪种活动与调查相连。同时核对第五段`be influenced by`说明的记录作用。\n\n第三段的`as part of their investigations`接在消费公司产品之后，句子否定检察官在调查中消费产品，再据此解释他们可能受到哪种效应影响。第五段则说社会责任记录会影响案件评估。\n\n`part of the investigation`把社会责任记录写成调查组成部分，所说的是调查包含什么内容。\n\n受到记录影响与把记录列入调查，是两个不同关系；前者说明它改变判断，后者还要求把它接入调查内容，原文这两句并未作出这一连接。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-34-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-D-0\"><blockquote>\n<p>检察官评估案件时，CSR记录构成调查的一部分。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>调查中不消费产品，用来隔离光环效应；记录影响评估，并不等于记录被正式列为调查内容。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>检察官评估案件时，CSR记录构成调查的一部分。</p>\n</blockquote>\n<p><code>part of the investigation</code>让人回到第三段的<code>as part of their investigations</code>；先将第三段从以往研究的困难读到末尾，再看这句话把哪种活动与调查相连。同时核对第五段<code>be influenced by</code>说明的记录作用。</p>\n<p>第三段的<code>as part of their investigations</code>接在消费公司产品之后，句子否定检察官在调查中消费产品，再据此解释他们可能受到哪种效应影响。第五段则说社会责任记录会影响案件评估。</p>\n<p><code>part of the investigation</code>把社会责任记录写成调查组成部分，所说的是调查包含什么内容。</p>\n<p>受到记录影响与把记录列入调查，是两个不同关系；前者说明它改变判断，后者还要求把它接入调查内容，原文这两句并未作出这一连接。</p>\n</section>"},{"title":"D. constitutes part of the investigation","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company's record in CSR. \"We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,\" says one researcher.\n>\n> 研究总的结论是，检察官本应只按案件本身的情况评估，但似乎确实受到公司CSR记录的影响。一位研究者说，他们估计，消除童工等重大的劳动权利问题，或将企业捐赠增加约20%，会使罚款通常比贿赂外国官员的一般处罚低40%左右。\n\n第三段先排除检察官作为消费者受影响的两条路径，第五段再报告判断受CSR记录影响，未列调查项目清单。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> A company’s CSR record constitutes part of the investigation.\n>\n> 检察官评估案件时，CSR记录构成调查的一部分。\n\nD需要调查本身包含查验CSR记录这一程序。文中part of their investigations接的是被否定的消费产品行为，不能把这处结构直接搬给CSR记录。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"34","option":"D","cumulative":true,"cumulativeGroup":"question-34-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-34-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-34-option-D-0\"><blockquote>\n<p>检察官评估案件时，CSR记录构成调查的一部分。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>调查中不消费产品，用来隔离光环效应；记录影响评估，并不等于记录被正式列为调查内容。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>检察官评估案件时，CSR记录构成调查的一部分。</p>\n</blockquote>\n<p><code>part of the investigation</code>让人回到第三段的<code>as part of their investigations</code>；先将第三段从以往研究的困难读到末尾，再看这句话把哪种活动与调查相连。同时核对第五段<code>be influenced by</code>说明的记录作用。</p>\n<p>第三段的<code>as part of their investigations</code>接在消费公司产品之后，句子否定检察官在调查中消费产品，再据此解释他们可能受到哪种效应影响。第五段则说社会责任记录会影响案件评估。</p>\n<p><code>part of the investigation</code>把社会责任记录写成调查组成部分，所说的是调查包含什么内容。</p>\n<p>受到记录影响与把记录列入调查，是两个不同关系；前者说明它改变判断，后者还要求把它接入调查内容，原文这两句并未作出这一连接。</p>\n</section><section class=\"revealPart\" id=\"focus-question-34-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n<p>研究总的结论是，检察官本应只按案件本身的情况评估，但似乎确实受到公司CSR记录的影响。一位研究者说，他们估计，消除童工等重大的劳动权利问题，或将企业捐赠增加约20%，会使罚款通常比贿赂外国官员的一般处罚低40%左右。</p>\n</blockquote>\n<p>第三段先排除检察官作为消费者受影响的两条路径，第五段再报告判断受CSR记录影响，未列调查项目清单。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>A company’s CSR record constitutes part of the investigation.</p>\n<p>检察官评估案件时，CSR记录构成调查的一部分。</p>\n</blockquote>\n<p>D需要调查本身包含查验CSR记录这一程序。文中part of their investigations接的是被否定的消费产品行为，不能把这处结构直接搬给CSR记录。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"34题结论","raw":"### 34题结论\n\n> **34. B**\n\n- A：CSR记录影响检察官决定，不能等同于该记录被判定为可靠的案件证据。影响判断与认定可信度是不同关系。\n- B：do seem to be influenced by明确说检察官受到CSR记录影响，B把这一被动关系转成记录影响他们的决定。\n- C：研究对象已是被起诉的公司，比较的是罚款轻重。C却问受处罚的概率是否增加，换掉了所研究的结果。\n- D：调查中不消费产品，用来隔离光环效应；记录影响评估，并不等于记录被正式列为调查内容。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"34题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"34","questionConclusion":true},"html":"<blockquote>\n<p><strong>34. B</strong></p>\n</blockquote>\n<ul>\n<li>A：CSR记录影响检察官决定，不能等同于该记录被判定为可靠的案件证据。影响判断与认定可信度是不同关系。</li>\n<li>B：do seem to be influenced by明确说检察官受到CSR记录影响，B把这一被动关系转成记录影响他们的决定。</li>\n<li>C：研究对象已是被起诉的公司，比较的是罚款轻重。C却问受处罚的概率是否增加，换掉了所研究的结果。</li>\n<li>D：调查中不消费产品，用来隔离光环效应；记录影响评估，并不等于记录被正式列为调查内容。</li>\n</ul>\n"},{"title":"35题 · 题干、题型与核心出处","raw":"## 35题\n\n> Which of the following is true of CSR, according to the last paragraph?\n>\n> 根据最后一段，关于企业社会责任，下列哪项说法正确？\n\n### 题型\n\n细节题：将研究尚未解决的问题与But at least后已表明的结果分开，不能把一种作用扩大为所有情形。\n\n题干明示the last paragraph，定位第六段。第34题已经把这一段完整读过；这里从研究没有回答的两个问题读到But at least之后已证明的结果，保持这两个层次分开。\n\n### 核心出处\n\n> Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR.\n>\n> But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"35","questionIntro":true},"html":"<blockquote>\n<p>Which of the following is true of CSR, according to the last paragraph?</p>\n<p>根据最后一段，关于企业社会责任，下列哪项说法正确？</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：将研究尚未解决的问题与But at least后已表明的结果分开，不能把一种作用扩大为所有情形。</p>\n<p>题干明示the last paragraph，定位第六段。第34题已经把这一段完整读过；这里从研究没有回答的两
