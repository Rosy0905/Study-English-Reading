ch companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n</section>"},{"title":"A. The necessary amount of companies’ spending on it is unknown.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 根据末段，公司为CSR应投入的金额尚不明确。\n\n`necessary amount`对应`how much businesses ought to spend`，末段首句直接谈这笔支出，所以核对这个完整句。\n\n原文说研究没有回答`how much businesses ought to spend`，也就是企业应该为社会责任花多少钱。`necessary amount`把这笔应该投入的金额概括为所需支出，`is unknown`对应这项研究尚未给出答案。两边问的都是适当投入多少，而不是公司实际上已经花了多少钱；题目又限定根据末段，因此这一概括能接上。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"A","cumulative":true,"cumulativeGroup":"question-35-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-35-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-A-0\"><blockquote>\n<p>根据末段，公司为CSR应投入的金额尚不明确。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>does not answer how much businesses ought to spend明确留下适当投入金额的问题。A的necessary amount对应应投入多少，而非实际已花多少。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<block efits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.\n>\n> 研究者承认，研究没有回答企业应该在CSR上花多少钱，也没有揭示企业制定公益政策时在多大程度上寄望光环效应而非其他可能收益。但至少已经表明：企业遇到法律麻烦时，良好品行的证据可能为它争取代价较低的处罚。\n\n作者先说尚不清楚企业多大程度寄望光环效应，再给出法律困境下可能减轻处罚的结论。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> It has brought much benefit to the banking industry.\n>\n> 根据末段，CSR已给银行业带来大量好处。\n\nD把一个动词短语读成特定行业，又把can win的条件性收益说成已给银行业大量好处。原文既未缩小为银行，也没有这一已实现总量。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"35","option":"D","cumulative":true,"cumulativeGroup":"question-35-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-35-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-35-option-D-0\"><blockquote>\n<p>根据末段，CSR已给银行业带来大量好处。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>banking on the halo effect是寄望光环效应，banking on在这里并非银行业。末句的受益对象仍是一般遭遇法律麻烦的公司。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>根据末段，CSR已给银行业带来大量好处。</p>\n</blockquote>\n<p>先看<code>companies are banking on the halo effect</code>。<code>bank on</code>在这里是指望、依赖，主语是companies，所寄望的对象是halo effect。不能见到banking就把句子理解成银行业。</p>\n<p>这句话还以<code>Nor does it reveal how much</code>开头，承认研究尚未弄清企业多大程度寄望这种作用。它并没有说某行业已经获得大量收益。</p>\n<p>末句能够确认的是：一般公司遇到法律麻烦时，良好品行材料<code>can win them a less costly punishment</code>。D将companies缩成银行业，又把特定情境下可以获得的结果写成已经发生的大量好处，两处都不能对应。</p>\n</section><section class=\"revealPart\" id=\"focus-question-35-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n<p>研究者承认，研究没有回答企业应该在CSR上花多少钱，也没有揭示企业制定公益政策时在多大程度上寄望光环效应而非其他可能收益。但至少已经表明：企业遇到法律麻烦时，良好品行的证据可能为它争取代价较低的处罚。</p>\n</blockquote>\n<p>作者先说尚不清楚企业多大程度寄望光环效应，再给出法律困境下可能减轻处罚的结论。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>It has brought much benefit to the banking industry.</p>\n<p>根据末段，CSR已给银行业带来大量好处。</p>\n</blockquote>\n<p>D把一个动词短语读成特定行业，又把can win的条件性收益说成已给银行业大量好处。原文既未缩小为银行，也没有这一已实现总量。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"35题结论","raw":"### 35题结论\n\n> **35. A**\n\n- A：does not answer how much businesses ought to spend明确留下适当投入金额的问题。A的necessary amount对应应投入多少，而非实际已花多少。\n- B：应该花多少是适当投入问题，有没有财力是支付能力问题。B还增加能力被高估这一判断，末段两层都未建立。\n- C：末段已证明的结果是处罚代价降低，属于企业所得好处。它没有列CSR给企业的负面影响，更未说这些影响常被忽略。\n- D：banking on the halo effect是寄望光环效应，banking on在这里并非银行业。末句的受益对象仍是一般遭遇法律麻烦的公司。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"35题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"35","questionConclusion":true},"html":"<blockquote>\n<p><strong>35. A</strong></p>\n</blockquote>\n<ul>\n<li>A：does not answer how much businesses ought to spend明确留下适当投入金额的问题。A的necessary amount对应应投入多少，而非实际已花多少。</li>\n<li>B：应该花多少是适当投入问题，有没有财力是支付能力问题。B还增加能力被高估这一判断，末段两层都未建立。</li>\n<li>C：末段已证明的结果是处罚代价降低，属于企业所得好处。它没有列CSR给企业的负面影响，更未说这些影响常被忽略。</li>\n<li>D：banking on the halo effect是寄望光环效应，banking on在这里并非银行业。末句的受益对象仍是一般遭遇法律麻烦的公司。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：传统观点与新发现的对比**（段落1核心论点） 弗里德曼观点：企业唯一社会责任是增加利润（CSR是浪费股东资金）// 新研究发现：CSR可能创造货币价值（至少在因腐败被起诉时）\n\n↓（具体机制分析）\n\n**逻辑层次2：CSR创造价值的三种方式**（段落2价值创造机制） 美英大公司每年花费150亿美元在CSR → 三种价值创造方式：【1.质量信号（消费者认为CSR支出=高质量产品）+ 2.间接捐赠（购买产品=支持善举）+ 3.光环效应（善行赢得更多好感）】\n\n↓（研究方法创新）\n\n**逻辑层次3：研究设计的巧妙之处**（段落3研究方法） 问题：之前研究难以区分三种效应（消费者同时受三种影响）→ 解决方案：研究FCPA贿赂起诉案（检察官不消费产品，只受光环效应影响）\n\n↓（研究发现）\n\n**逻辑层次4：CSR与处罚宽松度的关系**（段落4-5实证发现） 发现1：拥有全面CSR项目的公司获得更宽松处罚 → 排除政治影响：（政治捐款多≠罚款少）→ 发现2：【检察官应只看案件实质 // 但确实受CSR记录影响】→ 具体数据：（消除童工或增加20%捐赠 = 罚款减少40%）\n\n↓（研究局限与意义）\n\n**逻辑层次5：研究的局限性与贡献**（段落6总结评价） 局限：【未回答企业应在CSR上花费多少 + 未揭示公司对光环效应的依赖程度】// 贡献：证明了良好品格的证据可获得较轻惩罚\n\n↑（全文主旨）\n\n全文核心观点：尽管传统观点认为CSR是浪费股东资金，但新研究通过巧妙的研究设计证明，CSR至少在企业面临法律麻烦时能够通过光环效应创造实际的货币价值。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：传统观点与新发现的对比</strong>（段落1核心论点） 弗里德曼观点：企业唯一社会责任是增加利润（CSR是浪费股东资金）// 新研究发现：CSR可能创造货币价值（至少在因腐败被起诉时）</p>\n<p>↓（具体机制分析）</p>\n<p><strong>逻辑层次2：CSR创造价值的三种方式</strong>（段落2价值创造机制） 美英大公司每年花费150亿美元在CSR → 三种价值创造方式：【1.质量信号（消费者认为CSR支出=高质量产品）+ 2.间接捐赠（购买产品=支持善举）+ 3.光环效应（善行赢得更多好感）】</p>\n<p>↓（研究方法创新）</p>\n<p><strong>逻辑层次3：研究设计的巧妙之处</strong>（段落3研究方法） 问题：之前研究难以区分三种效应（消费者同时受三种影响）→ 解决方案：研究FCPA贿赂起诉案（检察官不消费产品，只受光环效应影响）</p>\n<p>↓（研究发现）</p>\n<p><strong>逻辑层次4：CSR与处罚宽松度的关系</strong>（段落4-5实证发现） 发现1：拥有全面CSR项目的公司获得更宽松处罚 → 排除政治影响：（政治捐款多≠罚款少）→ 发现2：【检察官应只看案件实质 // 但确实受CSR记录影响】→ 具体数据：（消除童工或增加20%捐赠 = 罚款减少40%）</p>\n<p>↓（研究局限与意义）</p>\n<p><strong>逻辑层次5：研究的局限性与贡献</strong>（段落6总结评价） 局限：【未回答企业应在CSR上花费多少 + 未揭示公司对光环效应的依赖程度】// 贡献：证明了良好品格的证据可获得较轻惩罚</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：尽管传统观点认为CSR是浪费股东资金，但新研究通过巧妙的研究设计证明，CSR至少在企业面临法律麻烦时能够通过光环效应创造实际的货币价值。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】C. A challenge to a simple divide between profit and responsibility\n\n> 对利润与责任简单二分的质疑\n\n先引Friedman把企业责任限于利润，再以But even if提出保留，并引入腐败起诉中的经济价值。\n\n> \"There is one and only one social responsibility of business,\" wrote Milton Friedman, a Nobel prize-winning economist, \"That is, to use its resources and engage in activities designed to increase its profits.\" But even if you accept Friedman's premise and regard corporate social responsibility (CSR) policies as a waste of shareholders' money, things may not be absolutely clear-cut.\n\n先引利润责任论，But even if随即让步并限制将CSR看成浪费的理解，作者在利润目标内部检验简单划分。\n\n> New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.\n\n新研究提出CSR也能创造货币价值，at least限定在腐败起诉场景，给前面的质疑提供具体方向而不是无限承诺。\n\n这一部分的推进关系是：\n\n> 利润责任前提 → 不能简单认定CSR浪费 → 腐败起诉中的经济收益线索\n\nchallenge对应让步后的反驳，simple divide对应责任被视为浪费股东钱的绝对化判断。\n\n再看最强干扰项G：A universal formula for how much every firm should spend。\n\n开头提出新研究作用，并未给出任何通用投入金额。\n\n**41题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】C. A challenge to a simple divide between profit and responsibility</p>\n<blockquote>\n<p>对利润与责任简单二分的质疑</p>\n</blockquote>\n<p>先引Friedman把企业责任限于利润，再以But even if提出保留，并引入腐败起诉中的经济价值。</p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut.</p>\n</blockquote>\n<p>先引利润责任论，But even if随即让步并限制将CSR看成浪费的理解，作者在利润目标内部检验简单划分。</p>\n<blockquote>\n<p>New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n</blockquote>\n<p>新研究提出CSR也能创造货币价值，at least限定在腐败起诉场景，给前面的质疑提供具体方向而不是无限承诺。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>利润责任前提 → 不能简单认定CSR浪费 → 腐败起诉中的经济收益线索</p>\n</blockquote>\n<p>challenge对应让步后的反驳，simple divide对应责任被视为浪费股东钱的绝对化判断。</p>\n<p>再看最强干扰项G：A universal formula for how much every firm should spend。</p>\n<p>开头提出新研究作用，并未给出任何通用投入金额。</p>\n<p><strong>41题选C。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】D. Three ways responsible conduct may add business value\n\n> 负责任行为可能增加商业价值的三种方式\n\n段落用First、Second、third列出产品质量信号、间接捐助和光环效应。\n\n> The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm.\n\n年度总支出先说明CSR投入规模，This could add value转入这些支出可能怎样使公司获益。\n\n> First, consumers may take CSR spending as a \"signal\" that a company's products are of high quality.\n\nFirst说明产品质量信号，Second的购买又能满足间接支持公益的意愿，两条路径都经过消费者的产品相关判断。\n\n> And third, through a more diffuse \"halo effect,\" whereby its good deeds earn it greater consideration from consumers and others.\n\nthird将作用扩成一般好感，消费者和其他人都可能因此更愿照顾企业。标题须同时覆盖三种途径，不能只取其中一条。\n\n这一部分的推进关系是：\n\n> CSR支出 → 质量信号与购买支持公益 → 更广泛的光环好感\n\nthree ways与列举结构一致，may保留这些作用的可能性。\n\n再看最强干扰项E：Political donations as the proven cause of lower fines。\n\n这里解释三种获益途径，没有把政治捐款列为原因。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】D. Three ways responsible conduct may add business value</p>\n<blockquote>\n<p>负责任行为可能增加商业价值的三种方式</p>\n</blockquote>\n<p>段落用First、Second、third列出产品质量信号、间接捐助和光环效应。</p>\n<blockquote>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm.</p>\n</blockquote>\n<p>年度总支出先说明CSR投入规模，This could add value转入这些支出可能怎样使公司获益。</p>\n<blockquote>\n<p>First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality.</p>\n</blockquote>\n<p>First说明产品质量信号，Second的购买又能满足间接支持公益的意愿，两条路径都经过消费者的产品相关判断。</p>\n<blockquote>\n<p>And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n</blockquote>\n<p>third将作用扩成一般好感，消费者和其他人都可能因此更愿照顾企业。标题须同时覆盖三种途径，不能只取其中一条。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>CSR支出 → 质量信号与购买支持公益 → 更广泛的光环好感</p>\n</blockquote>\n<p>three ways与列举结构一致，may保留这些作用的可能性。</p>\n<p>再看最强干扰项E：Political donations as the proven cause of lower fines。</p>\n<p>这里解释三种获益途径，没有把政治捐款列为原因。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】B. Separating reputation from consumer responses\n\n> 将声誉作用与消费者反应分开\n\n以往消费者会同时受三种机制影响；新研究转向不消费公司产品的检察官，以单独观察光环效应。\n\n> Previous studies on CSR have had trouble differentiating these effects because consumers can be affected by all three.\n\n消费者可能同时受三种机制影响，所以既有研究难以区分各自作用，段首提出的是识别困难。\n\n> A recent study attempts to separate them by looking at bribery prosecutions under America's Foreign Corrupt Practices Act (FCPA).\n\n新研究改看贿赂起诉，选择了检察官作为判断者，改变场景是为了分离机制。\n\n> It argues that since prosecutors do not consume a company's products as part of their investigations, they could be influenced only by the halo effect.\n\nsince说明其依据：调查并不以消费产品为组成部分，研究因而把可能作用聚焦在光环效应。标题应覆盖为何换研究对象。\n\n这一部分的推进关系是：\n\n> 消费者受多机制重叠影响 → 转向起诉与检察官 → 排除产品消费路径以观察光环\n\nseparating对应differentiate与separate；consumer responses正是需要排除的混杂。\n\n再看最强干扰项D：Three ways responsible conduct may add business value。\n\nD只是列出机制，本段重点是研究如何区分这些机制。\n\n**43题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】B. Separating reputation from consumer responses</p>\n<blockquote>\n<p>将声誉作用与消费者反应分开</p>\n</blockquote>\n<p>以往消费者会同时受三种机制影响；新研究转向不消费公司产品的检察官，以单独观察光环效应。</p>\n<blockquote>\n<p>Previous studies on CSR have had trouble differentiating these effects because consumers can be affected by all three.</p>\n</blockquote>\n<p>消费者可能同时受三种机制影响，所以既有研究难以区分各自作用，段首提出的是识别困难。</p>\n<blockquote>\n<p>A recent study attempts to separate them by looking at bribery prosecutions under America&#39;s Foreign Corrupt Practices Act (FCPA).</p>\n</blockquote>\n<p>新研究改看贿赂起诉，选择了检察官作为判断者，改变场景是为了分离机制。</p>\n<blockquote>\n<p>It argues that since prosecutors do not consume a company&#39;s products as part of their investigations, they could be influenced only by the halo effect.</p>\n</blockquote>\n<p>since说明其依据：调查并不以消费产品为组成部分，研究因而把可能作用聚焦在光环效应。标题应覆盖为何换研究对象。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>消费者受多机制重叠影响 → 转向起诉与检察官 → 排除产品消费路径以观察光环</p>\n</blockquote>\n<p>separating对应differentiate与separate；consumer responses正是需要排除的混杂。</p>\n<p>再看最强干扰项D：Three ways responsible conduct may add business value。</p>\n<p>D只是列出机制，本段重点是研究如何区分这些机制。</p>\n<p><strong>43题选B。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. Evidence that a responsible record can soften penalties\n\n> 责任记录可能减轻处罚的证据\n\n先报告社会责任较全面者处罚较轻，再排除政治影响解释，最后以数量估计说明实际影响。\n\n> The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties.\n\nCSR最全面者处罚较轻，是研究先给出的发现；随后政治捐款没有带来低罚款，用来排除另一解释。\n\n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company's record in CSR.\n\nwhereas把只应按案情判断与实际受CSR影响相对，明确研究所观察的影响关系。\n\n> \"We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,\" says one researcher.\n\n改善劳动权利或增加捐赠与罚款降低的估计，把影响落实到经济幅度，不能改成政治捐款降低罚款。\n\n这一部分的推进关系是：\n\n> 发现CSR与轻罚相连 → 排除政治影响解释 → CSR记录影响判断并给出数量估计\n\nresponsible record对应CSR programmes与record，soften penalties对应lenient和lower fines。\n\n再看最强干扰项E：Political donations as the proven cause of lower fines。\n\n政治捐款解释被明确排除，不能当成研究证明的原因。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. Evidence that a responsible record can soften penalties</p>\n<blockquote>\n<p>责任记录可能减轻处罚的证据</p>\n</blockquote>\n<p>先报告社会责任较全面者处罚较轻，再排除政治影响解释，最后以数量估计说明实际影响。</p>\n<blockquote>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties.</p>\n</blockquote>\n<p>CSR最全面者处罚较轻，是研究先给出的发现；随后政治捐款没有带来低罚款，用来排除另一解释。</p>\n<blockquote>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR.</p>\n</blockquote>\n<p>whereas把只应按案情判断与实际受CSR影响相对，明确研究所观察的影响关系。</p>\n<blockquote>\n<p>&quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n<p>改善劳动权利或增加捐赠与罚款降低的估计，把影响落实到经济幅度，不能改成政治捐款降低罚款。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>发现CSR与轻罚相连 → 排除政治影响解释 → CSR记录影响判断并给出数量估计</p>\n</blockquote>\n<p>responsible record对应CSR programmes与record，soften penalties对应lenient和lower fines。</p>\n<p>再看最强干扰项E：Political donations as the proven cause of lower fines。</p>\n<p>政治捐款解释被明确排除，不能当成研究证明的原因。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】A. What the study establishes and leaves unanswered\n\n> 研究证明了什么又留下哪些问题\n\n研究仍不能回答应投入多少、企业有多指望光环效应，但已证明违法受罚时好品格证据可能减少代价。\n\n> Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR.\n\n首句承认适当投入多少尚无答案，局限在支出决策，而非否认前面的处罚发现。\n\n> Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies.\n\nNor继续补企业动机未知：banking on是寄望，研究还未区分企业期待光环与其他好处的程度。\n\n> But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.\n\nBut at least转回能够保留的结果：法律麻烦中好品行材料可减轻代价，标题应同时容纳已知与未知。\n\n这一部分的推进关系是：\n\n> 最佳支出未知 → 企业期待哪种收益未知 → 有限场景下轻罚作用仍成立\n\nestablishes与leaves unanswered分别对应But at least和does not answer/Nor。\n\n再看最强干扰项G：A universal formula for how much every firm should spend。\n\n此段明确投入金额尚未解决，通用公式与原文相反。\n\n**45题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】A. What the study establishes and leaves unanswered</p>\n<blockquote>\n<p>研究证明了什么又留下哪些问题</p>\n</blockquote>\n<p>研究仍不能回答应投入多少、企业有多指望光环效应，但已证明违法受罚时好品格证据可能减少代价。</p>\n<blockquote>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR.</p>\n</blockquote>\n<p>首句承认适当投入多少尚无答案，局限在支出决策，而非否认前面的处罚发现。</p>\n<blockquote>\n<p>Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies.</p>\n</blockquote>\n<p>Nor继续补企业动机未知：banking on是寄望，研究还未区分企业期待光环与其他好处的程度。</p>\n<blockquote>\n<p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<p>But at least转回能够保留的结果：法律麻烦中好品行材料可减轻代价，标题应同时容纳已知与未知。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>最佳支出未知 → 企业期待哪种收益未知 → 有限场景下轻罚作用仍成立</p>\n</blockquote>\n<p>establishes与leaves unanswered分别对应But at least和does not answer/Nor。</p>\n<p>再看最强干扰项G：A universal formula for how much every firm should spend。</p>\n<p>此段明确投入金额尚未解决，通用公式与原文相反。</p>\n<p><strong>45题选A。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 以利润与责任之分引入质疑 |\n| B | 限定研究不能确定最佳投入量 |\n| C | 补充企业期待和动机尚未被识别 |\n| D | 说明机制重叠并选择检察官作研究对象 |\n| E | 报告处罚较轻并排除政治捐款解释 |\n| F | 列举三种潜在获益机制 |\n| G | 把解释落回责任记录及其量化效果 |\n| H | 总结有边界的经济价值结论 |\n\n全文推进：\n\n> 以利润与责任之分引入质疑 → 列举三种潜在获益机制 → 说明机制重叠并选择检察官作研究对象 → 报告处罚较轻并排除政治捐款解释 → 把解释落回责任记录及其量化效果 → 限定研究不能确定最佳投入量 → 补充企业期待和动机尚未被识别 → 总结有边界的经济价值结论\n\n完整顺序：\n\n**A → F → D → E → G → B → C → H**\n\n41—45：F、D、G、B、C。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>以利润与责任之分引入质疑</td>\n</tr>\n<tr>\n<td>B</td>\n<td>限定研究不能确定最佳投入量</td>\n</tr>\n<tr>\n<td>C</td>\n<td>补充企业期待和动机尚未被识别</td>\n</tr>\n<tr>\n<td>D</td>\n<td>说明机制重叠并选择检察官作研究对象</td>\n</tr>\n<tr>\n<td>E</td>\n<td>报告处罚较轻并排除政治捐款解释</td>\n</tr>\n<tr>\n<td>F</td>\n<td>列举三种潜在获益机制</td>\n</tr>\n<tr>\n<td>G</td>\n<td>把解释落回责任记录及其量化效果</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结有边界的经济价值结论</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>以利润与责任之分引入质疑 → 列举三种潜在获益机制 → 说明机制重叠并选择检察官作研究对象 → 报告处罚较轻并排除政治捐款解释 → 把解释落回责任记录及其量化效果 → 限定研究不能确定最佳投入量 → 补充企业期待和动机尚未被识别 → 总结有边界的经济价值结论</p>\n</blockquote>\n<p>完整顺序：</p>\n<p><strong>A → F → D → E → G → B → C → H</strong></p>\n<p>41—45：F、D、G、B、C。</p>\n"},{"title":"排序题 · 41题","raw":"### 排序题 · 41题\n\n41题是全文第2段，局部关系为A → F → D。\n\n先看前段A的结尾：\n\n> Even if responsible policies cost shareholders money, they may also create monetary value in circumstances that are not immediately obvious.\n\n再看F段开头：\n\n> Several routes to that value have been proposed.\n\nA末句提出CSR也可能创造monetary value，F的that value回指这一潜在价值，开始回答实现它有哪些途径。\n\n本段内部继续写道：\n\n> Consumers may read responsible spending as a sign of product quality, buy products to support a cause, or respond favourably to a general reputation for good deeds. These routes are different, although the same customer may be influenced by all of them.\n\n消费者可将支出当质量信号、通过购买支持公益，也可因好名声作正面反应；末句强调同一顾客可能同时受三者影响。\n\n后段D开头是：\n\n> Their overlap makes it difficult to identify the effect of reputation alone.\n\nD的Their overlap接F末句的多机制同时影响，继而解释为什么难单独识别声誉作用。\n\n这三段的推进关系：\n\n> 以利润与责任之分引入质疑 → 列举三种潜在获益机制 → 说明机制重叠并选择检察官作研究对象\n\n再检验候选G：\n\n> With the political explanation weakened, the findings pointed back to the company’s record of good conduct.\n\nG的political explanation weakened要求先出现政治影响及其被削弱的证据，A尚只提出潜在收益，不能提前放入研究结论。\n\n**41题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"F"},"level":2,"meta":{"kind":"newtype","question":"F"},"html":"<p>41题是全文第2段，局部关系为A → F → D。</p>\n<p>先看前段A的结尾：</p>\n<blockquote>\n<p>Even if responsible policies cost shareholders money, they may also create monetary value in circumstances that are not immediately obvious.</p>\n</blockquote>\n<p>再看F段开头：</p>\n<blockquote>\n<p>Several routes to that value have been proposed.</p>\n</blockquote>\n<p>A末句提出CSR也可能创造monetary value，F的that value回指这一潜在价值，开始回答实现它有哪些途径。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Consumers may read responsible spending as a sign of product quality, buy products to support a cause, or respond favourably to a general reputation for good deeds. These routes are different, although the same customer may be influenced by all of them.</p>\n</blockquote>\n<p>消费者可将支出当质量信号、通过购买支持公益，也可因好名声作正面反应；末句强调同一顾客可能同时受三者影响。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>Their overlap makes it difficult to identify the effect of reputation alone.</p>\n</blockquote>\n<p>D的Their overlap接F末句的多机制同时影响，继而解释为什么难单独识别声誉作用。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>以利润与责任之分引入质疑 → 列举三种潜在获益机制 → 说明机制重叠并选择检察官作研究对象</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>With the political explanation weakened, the findings pointed back to the company’s record of good conduct.</p>\n</blockquote>\n<p>G的political explanation weakened要求先出现政治影响及其被削弱的证据，A尚只提出潜在收益，不能提前放入研究结论。</p>\n<p><strong>41题选F。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为F → D → E。\n\n先看前段F的结尾：\n\n> These routes are different, although the same customer may be influenced by all of them.\n\n再看D段开头：\n\n> Their overlap makes it difficult to identify the effect of reputation alone.\n\nF说同一消费者受所有机制影响，D用Their overlap概括这一重叠，再提出隔离reputation alone的识别任务。\n\n本段内部继续写道：\n\n> To separate it from the other responses, researchers turned to bribery prosecutions. Prosecutors assessing a company do not buy its products as part of the investigation, making their decisions a useful setting in which to examine the halo effect.\n\n研究转向检察官，因为其案件调查不包含购买产品，排除消费反应后才有条件单独观察光环。\n\n后段E开头是：\n\n> In that setting, firms with more comprehensive social-responsibility programmes tended to receive more lenient penalties.\n\nE的In that setting指D设定的贿赂起诉环境，随后报告在该场景下CSR全面公司处罚更轻。\n\n这三段的推进关系：\n\n> 列举三种潜在获益机制 → 说明机制重叠并选择检察官作研究对象 → 报告处罚较轻并排除政治捐款解释\n\n再检验候选G：\n\n> With the political explanation weakened, the findings pointed back to the company’s record of good conduct.\n\nG已经说政治解释被削弱，是观察结果之后的推论；F还没介绍研究场景，直接接G会让findings和political explanation都无前提。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>These routes are different, although the same customer may be influenced by all of them.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>Their overlap makes it difficult to identify the effect of reputation alone.</p>\n</blockquote>\n<p>F说同一消费者受所有机制影响，D用Their overlap概括这一重叠，再提出隔离reputation alone的识别任务。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>To separate it from the other responses, researchers turned to bribery prosecutions. Prosecutors assessing a company do not buy its products as part of the investigation, making their decisions a useful setting in which to examine the halo effect.</p>\n</blockquote>\n<p>研究转向检察官，因为其案件调查不包含购买产品，排除消费反应后才有条件单独观察光环。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>In that setting, firms with more comprehensive social-responsibility programmes tended to receive more lenient penalties.</p>\n</blockquote>\n<p>E的In that setting指D设定的贿赂起诉环境，随后报告在该场景下CSR全面公司处罚更轻。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>列举三种潜在获益机制 → 说明机制重叠并选择检察官作研究对象 → 报告处罚较轻并排除政治捐款解释</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>With the political explanation weakened, the findings pointed back to the company’s record of good conduct.</p>\n</blockquote>\n<p>G已经说政治解释被削弱，是观察结果之后的推论；F还没介绍研究场景，直接接G会让findings和political explanation都无前提。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → G → B。\n\n先看前段E的结尾：\n\n> Companies that gave more to political campaigns did not receive lower fines, weakening that alternative explanation.\n\n再看G段开头：\n\n> With the political explanation weakened, the findings pointed back to the company’s record of good conduct.\n\nE末句说政治竞选捐款多未换来低罚款，G的With the political explanation weakened逐句承接这项排除。\n\n本段内部继续写道：\n\n> Such a record appeared to affect judgments that should have depended only on the merits of the case. The researchers offered estimates linking better labour practices or greater giving with substantially lower fines.\n\nG把解释落回good conduct record，并用改善劳动实践、增加捐赠与低罚款的估计具体说明影响。\n\n后段B开头是：\n\n> These estimates show an economic effect, but they do not establish the ideal level of responsible spending.\n\nB的These estimates回指G末句的数量估计，再由经济效果转入不能确定最佳支出的局限。\n\n这三段的推进关系：\n\n> 报告处罚较轻并排除政治捐款解释 → 把解释落回责任记录及其量化效果 → 限定研究不能确定最佳投入量\n\n再检验候选C：\n\n> Another unanswered question concerns what companies themselves expect when choosing such policies.\n\nC的Another unanswered question须前面已有一个未回答问题；E此时在排除政治解释，尚未转到研究局限，先接C会无端跳层。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>Companies that gave more to political campaigns did not receive lower fines, weakening that alternative explanation.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>With the political explanation weakened, the findings pointed back to the company’s record of good conduct.</p>\n</blockquote>\n<p>E末句说政治竞选捐款多未换来低罚款，G的With the political explanation weakened逐句承接这项排除。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Such a record appeared to affect judgments that should have depended only on the merits of the case. The researchers offered estimates linking better labour practices or greater giving with substantially lower fines.</p>\n</blockquote>\n<p>G把解释落回good conduct record，并用改善劳动实践、增加捐赠与低罚款的估计具体说明影响。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>These estimates show an economic effect, but they do not establish the ideal level of responsible spending.</p>\n</blockquote>\n<p>B的These estimates回指G末句的数量估计，再由经济效果转入不能确定最佳支出的局限。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>报告处罚较轻并排除政治捐款解释 → 把解释落回责任记录及其量化效果 → 限定研究不能确定最佳投入量</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>Another unanswered question concerns what companies themselves expect when choosing such policies.</p>\n</blockquote>\n<p>C的Another unanswered question须前面已有一个未回答问题；E此时在排除政治解释，尚未转到研究局限，先接C会无端跳层。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → B → C。\n\n先看前段G的结尾：\n\n> The researchers offered estimates linking better labour practices or greater giving with substantially lower fines.\n\n再看B段开头：\n\n> These estimates show an economic effect, but they do not establish the ideal level of responsible spending.\n\nG刚给出更好劳动实践或捐赠与低罚款的estimates，B用These estimates承接，承认效果但限定其不能给出理想投入量。\n\n本段内部继续写道：\n\n> The study cannot tell every business how much it ought to invest. Nor does the association show that all types of social responsibility produce exactly the same return in every setting.\n\n不能指导每家企业应该投入多少，也不能证明每种CSR在每种场景都有相同回报，B具体划定可推广的范围。\n\n后段C开头是：\n\n> Another unanswered question concerns what companies themselves expect when choosing such policies.\n\nC的Another unanswered question将第二个未知问题接在B的支出额未知之后，转到企业自身期待。\n\n这三段的推进关系：\n\n> 把解释落回责任记录及其量化效果 → 限定研究不能确定最佳投入量 → 补充企业期待和动机尚未被识别\n\n再检验候选F：\n\n> Several routes to that value have been proposed.\n\nF再次列潜在收益机制，是研究起点，不是对当前数量估计的限制。放此处会使C的Another找不到紧接的第一个未知问题。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>The researchers offered estimates linking better labour practices or greater giving with substantially lower fines.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>These estimates show an economic effect, but they do not establish the ideal level of responsible spending.</p>\n</blockquote>\n<p>G刚给出更好劳动实践或捐赠与低罚款的estimates，B用These estimates承接，承认效果但限定其不能给出理想投入量。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>The study cannot tell every business how much it ought to invest. Nor does the association show that all types of social responsibility produce exactly the same return in every setting.</p>\n</blockquote>\n<p>不能指导每家企业应该投入多少，也不能证明每种CSR在每种场景都有相同回报，B具体划定可推广的范围。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>Another unanswered question concerns what companies themselves expect when choosing such policies.</p>\n</blockquote>\n<p>C的Another unanswered question将第二个未知问题接在B的支出额未知之后，转到企业自身期待。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>把解释落回责任记录及其量化效果 → 限定研究不能确定最佳投入量 → 补充企业期待和动机尚未被识别</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Several routes to that value have been proposed.</p>\n</blockquote>\n<p>F再次列潜在收益机制，是研究起点，不是对当前数量估计的限制。放此处会使C的Another找不到紧接的第一个未知问题。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → C → H。\n\n先看前段B的结尾：\n\n> Nor does the association show that all types of social responsibility produce exactly the same return in every setting.\n\n再看C段开头：\n\n> Another unanswered question concerns what companies themselves expect when choosing such policies.\n\nB限定收益不能普遍推开，C的Another unanswered question再补动机层面的局限，与前一未知问题并列。\n\n本段内部继续写道：\n\n> They may hope for reputational advantages, consumer support or other benefits. The study does not separate those motives, so an observed advantage should not be confused with proof of the intention behind every programme.\n\n企业可能期待声誉、消费者支持或别的收益，但研究未分离这些动机，因此观察到收益不能当成每项计划意图的证明。\n\n后段H开头是：\n\n> Despite these limits, the narrower conclusion remains.\n\nH的Despite these limits概括前两段支出与动机局限，再回到narrower conclusion，形成承认边界后的结论。\n\n这三段的推进关系：\n\n> 限定研究不能确定最佳投入量 → 补充企业期待和动机尚未被识别 → 总结有边界的经济价值结论\n\n再检验候选F：\n\n> Several routes to that value have been proposed.\n\nF重新解释三种获益途径，没有说明研究不知道什么；它会让H的these limits缺少本应刚列出的动机限制。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Nor does the association show that all types of social responsibility produce exactly the same return in every setting.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>Another unanswered question concerns what companies themselves expect when choosing such policies.</p>\n</blockquote>\n<p>B限定收益不能普遍推开，C的Another unanswered question再补动机层面的局限，与前一未知问题并列。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>They may hope for reputational advantages, consumer support or other benefits. The study does not separate those motives, so an observed advantage should not be confused with proof of the intention behind every programme.</p>\n</blockquote>\n<p>企业可能期待声誉、消费者支持或别的收益，但研究未分离这些动机，因此观察到收益不能当成每项计划意图的证明。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Despite these limits, the narrower conclusion remains.</p>\n</blockquote>\n<p>H的Despite these limits概括前两段支出与动机局限，再回到narrower conclusion，形成承认边界后的结论。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>限定研究不能确定最佳投入量 → 补充企业期待和动机尚未被识别 → 总结有边界的经济价值结论</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Several routes to that value have been proposed.</p>\n</blockquote>\n<p>F重新解释三种获益途径，没有说明研究不知道什么；它会让H的these limits缺少本应刚列出的动机限制。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **corporate social responsibility** | **企业社会责任** | **社会现象类｜科技经济** | **宏观主题** |\n| responsible business conduct | 负责任的经营行为 | 社会现象类｜科技经济 | 宏观主题 |\n| consumer trust | 消费者信任 | 社会现象类｜科技经济 | 宏观主题 |\n| **personal integrity** | **个人诚信** | **人生哲理类｜诚信** | **个人主题** |\n| fair judgment | 公正判断 | 人生哲理类｜独立与理性思考 | 个人主题 |\n| the protection of labour rights | 劳动权利保护 | 社会现象类｜社会生活 | 宏观主题 |\n| charitable giving | 慈善捐赠 | 人生哲理类｜爱心与奉献 | 个人主题 |\n| evidence-based evaluation | 基于证据的评价 | 人生哲理类｜批判性思维 | 个人主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>corporate social responsibility</strong></td>\n<td><strong>企业社会责任</strong></td>\n<td><strong>社会现象类｜科技经济</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>responsible business conduct</td>\n<td>负责任的经营行为</td>\n<td>社会现象类｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>consumer trust</td>\n<td>消费者信任</td>\n<td>社会现象类｜科技经济</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>personal integrity</strong></td>\n<td><strong>个人诚信</strong></td>\n<td><strong>人生哲理类｜诚信</strong const NEWTYPE={"smallTitle":"<p><strong>Directions:</strong></p><p>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)</p><p><strong>A. What the study establishes and leaves unanswered</strong></p><p><strong>B. Separating reputation from consumer responses</strong></p><p><strong>C. A challenge to a simple divide between profit and responsibility</strong></p><p><strong>D. Three ways responsible conduct may add business value</strong></p><p><strong>E. Political donations as the proven cause of lower fines</strong></p><p><strong>F. Evidence that a responsible record can soften penalties</strong></p><p><strong>G. A universal formula for how much every firm should spend</strong></p><section class=\"newtype-qblock\" data-q=\"41\"><h3>41.</h3><p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#x27;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#x27; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p></section><section class=\"newtype-qblock\" data-q=\"42\"><h3>42.</h3><p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#x27;s products are of high quality. Second, customers may be willing to buy a company&#x27;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p></section><section class=\"newtype-qblock\" data-q=\"43\"><h3>43.</h3><p>Previous studies on CSR have had trouble differentiating these effects because consumers can be affected by all three. A recent study attempts to separate them by looking at bribery prosecutions under America&#x27;s Foreign Corrupt Practices Act (FCPA). It argues that since prosecutors do not consume a company&#x27;s products as part of their investigations, they could be influenced only by the halo effect.</p></section><section class=\"newtype-qblock\" data-q=\"44\"><h3>44.</h3><p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#x27; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines. In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#x27;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p></section><section class=\"newtype-qblock\" data-q=\"45\"><h3>45.</h3><p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p></section>","sorting":"<p><strong>Directions:</strong></p><p>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)</p><p class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H</p><section class=\"newtype-qblock\" data-letter=\"A\"><h3>A.</h3><p>The claim that a company has no social responsibility beyond increasing profit draws a sharp boundary between business returns and good conduct. Recent research questions that boundary. Even if responsible policies cost shareholders money, they may also create monetary value in circumstances that are not immediately obvious.</p></section><section class=\"newtype-qblock\" data-letter=\"B\"><h3>B.</h3><p>These estimates show an economic effect, but they do not establish the ideal level of responsible spending. The study cannot tell every business how much it ought to invest. Nor does the association show that all types of social responsibility produce exactly the same return in every setting.</p></section><section class=\"newtype-qblock\" data-letter=\"C\"><h3>C.</h3><p>Another unanswered question concerns what companies themselves expect when choosing such policies. They may hope for reputational advantages, consumer support or other benefits. The study does not separate those motives, so an observed advantage should not be confused with proof of the intention behind every programme.</p></section><section class=\"newtype-qblock\" data-letter=\"D\"><h3>D.</h3><p>Their overlap makes it difficult to identify the effect of reputation alone. To separate it from the other responses, researchers turned to bribery prosecutions. Prosecutors assessing a company do not buy its products as part of the investigation, making their decisions a useful setting in which to examine the halo effect.</p></section><section class=\"newtype-qblock\" data-letter=\"E\"><h3>E.</h3><p>In that setting, firms with more comprehensive social-responsibility programmes tended to receive more lenient penalties. The researchers then tested whether political influence could explain the association instead. Companies that gave more to political campaigns did not receive lower fines, weakening that alternative explanation.</p></section><section class=\"newtype-qblock\" data-letter=\"F\"><h3>F.</h3><p>Several routes to that value have been proposed. Consumers may read responsible spending as a sign of product quality, buy products to support a cause, or respond favourably to a general reputation for good deeds. These routes are different, although the same customer may be influenced by all of them.</p></section><section class=\"newtype-qblock\" data-letter=\"G\"><h3>G.</h3><p>With the political explanation weakened, the findings pointed back to the company’s record of good conduct. Such a record appeared to affect judgments that should have depended only on the merits of the case. The researchers offered estimates linking better labour practices or greater giving with substantially lower fines.</p></section><section class=\"newtype-qblock\" data-letter=\"H\"><h3>H.</h3><p>Despite these limits, the narrower conclusion remains. When a company faces legal trouble, evidence of good character can reduce the cost of punishment. That finding challenges a simple opposition between social responsibility and economic value without turning responsible conduct into a guaranteed investment formula.</p></section>"};
const FULL="<h1>0.阅前须知</h1>\n<h2>史上最强阅读复盘法：一石五鸟法</h2>\n<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"></figure></p>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"></figure></p>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"></figure></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"></figure></p>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"></figure></p>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"></figure></p>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"></figure></p>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr>\n<hr>\n<h1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h1>\n<h2>第1段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>social responsibility</td>\n<td>社会责任</td>\n<td>resources</td>\n<td>n.资源</td>\n<td>engage in</td>\n<td>从事</td>\n</tr>\n<tr>\n<td>profits</td>\n<td>n.利润</td>\n<td>premise</td>\n<td>n.前提</td>\n<td>shareholders</td>\n<td>n.股东</td>\n</tr>\n<tr>\n<td>clear-cut</td>\n<td>adj.明确的</td>\n<td>monetary value</td>\n<td>经济价值</td>\n<td>prosecuted</td>\n<td>v.被起诉</td>\n</tr>\n<tr>\n<td>corruption</td>\n<td>n.腐败</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h2>第2段</h2>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>estimate</td>\n<td>n.估计</td>\n<td>consulting firm</td>\n<td>咨询公司</td>\n<td>add value</td>\n<td>增加价值</td>\n</tr>\n<tr>\n<td>signal</td>\n<td>n.信号</td>\n<td>indirect</td>\n<td>adj.间接的</td>\n<td>donate</td>\n<td>v.捐赠</td>\n</tr>\n<tr>\n<td>good causes</td>\n<td>公益事业</td>\n<td>diffuse</td>\n<td>adj.广泛的</td>\n<td>halo effect</td>\n<td>光环效应</td>\n</tr>\n<tr>\n<td>consideration</td>\n<td>n.关照</td>\n<td></td>\n tr>\n<tr>\n<td>benefits</td>\n<td>n.好处</td>\n<td>demonstrate</td>\n<td>v.证明</td>\n<td>get into trouble</td>\n<td>陷入麻烦</td>\n</tr>\n<tr>\n<td>evidence</td>\n<td>n.证据</td>\n<td>costly</td>\n<td>adj.代价高的</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n<h1>2. 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h1>\n<p><figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"articleAnnotated\" alt=\"本文重点词语境标注\"></figure></p>\n<h2>第1段</h2>\n<h3>完整原文 · 第1段</h3>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n<h3>意群划分 · 第1段</h3>\n<p>&quot;There is one and only one / social responsibility of business,&quot; / wrote Milton Friedman, / a Nobel prize-winning economist, / &quot;That is, / to use its resources / and engage in activities / designed to increase its profits.&quot;</p>\n<p>But even if / you accept Friedman&#39;s premise / and regard corporate social responsibility (CSR) policies / as a waste of shareholders&#39; money, / things may not be / absolutely clear-cut.</p>\n<p>New research suggests / that CSR may create / monetary value for companies – / at least when / they are prosecuted / for corruption.</p>\n<h3>意群翻译 · 第1段</h3>\n<p>&quot;有且只有一个 / 企业的社会责任，&quot; / 米尔顿·弗里德曼写道，/ 一位诺贝尔奖得主经济学家，/ &quot;那就是，/ 使用其资源 / 并从事活动 / 旨在增加其利润。&quot;</p>\n<p>但即使 / 你接受弗里德曼的前提 / 并认为企业社会责任（CSR）政策 / 是股东资金的浪费，/ 事情可能不是 / 绝对明确的。</p>\n<p>新研究表明 / CSR可能创造 / 货币价值给公司 – / 至少当 / 它们被起诉 / 因为腐败时。</p>\n<h3>标准译文 · 第1段</h3>\n<p>诺贝尔经济学奖得主米尔顿·弗里德曼曾写道：&quot;企业有且只有一个社会责任，那就是利用其资源从事旨在增加利润的活动。&quot;但即使你接受弗里德曼的前提，认为企业社会责任（CSR）政策是浪费股东的钱，事情也可能并非绝对明确。新研究表明，CSR可能为公司创造货币价值——至少在它们因腐败被起诉时是如此。</p>\n<h2>第2段</h2>\n<h3>完整原文 · 第2段</h3>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a &quot;signal&quot; that a company&#39;s products are of high quality. Second, customers may be willing to buy a company&#39;s products as an indirect way to donate to the good causes it helps. And third, through a more diffuse &quot;halo effect,&quot; whereby its good deeds earn it greater consideration from consumers and others.</p>\n<h3>意群划分 · 第2段</h3>\n<p>The largest firms / in America and Britain / together spend / more than $15 billion a year / on CSR, / according to an estimate / by EPG, / a consulting firm.</p>\n<p>This could add value / to their businesses / in three ways.</p>\n<p>First, / consumers may take / CSR spending / as a &quot;signal&quot; / that a company&#39;s products / are of high quality.</p>\n<p>Second, / customers may be willing / to buy a company&#39;s products / as an indirect way / to donate to the good causes / it helps.</p>\n<p>And third, / through a more diffuse / &quot;halo effect,&quot; / whereby its good deeds / earn it greater consideration / from consumers and others.</p>\n<h3>意群翻译 · 第2段</h3>\n<p>最大的公司 / 在美国和英国 / 一起花费 / 超过150亿美元每年 / 在CSR上，/ 根据一项估计 / 由EPG，/ 一家咨询公司。</p>\n<p>这可能增加价值 / 给他们的业务 / 以三种方式。</p>\n<p>第一，/ 消费者可能认为 / CSR支出 / 作为一个&quot;信号&quot; / 公司的产品 / 具有高质量。</p>\n<p>第二，/ 顾客可能愿意 / 购买公司的产品 / 作为一种间接方式 / 捐助于良好事业 / 它所帮助的。</p>\n<p>第三，/ 通过一种更加分散的 / &quot;光环效应&quot;，/ 借此其善行 / 为它赢得更多考虑 / 来自消费者和其他人。</p>\n<h3>标准译文 · 第2段</h3>\n<p>根据咨询公司EPG的估计，美国和英国最大的公司每年在CSR上的总支出超过150亿美元。这可能通过三种方式为他们的业务增加价值。第一，消费者可能将CSR支出视为公司产品高质量的&quot;信号&quot;。第二，顾客可能愿意购买公司的产品，作为间接支持其所帮助的善举的方式。第三，通过更加分散的&quot;光环效应&quot;，公司的善行为其赢得消费者和其他人更多的好感。</p>\n<h2>第3段</h2>\n<h3>完整原文 · 第3段</h3>\n<p>Previous studies on CSR have had trouble differentiating these effects because consumers can be affected by all three. A recent study attempts to separate them by looking at bribery prosecutions under America&#39;s Foreign Corrupt Practices Act (FCPA). It argues that since prosecutors do not consume a company&#39;s products as part of their investigations, they could be influenced only by the halo effect.</p>\n<h3>意群划分 · 第3段</h3>\n<p>Previous studies on CSR / have had trouble / differentiating these effects / because consumers / can be affected / by all three.</p>\n<p>A recent study / attempts to separate them / by looking at / bribery prosecutions / under America&#39;s Foreign Corrupt Practices Act (FCPA).</p>\n<p>It argues that / since prosecutors / do not consume / a company&#39;s products / as part of their investigations, / they could be influenced / only by the halo effect.</p>\n<h3>意群翻译 · 第3段</h3>\n<p>之前关于CSR的研究 / 遇到了困难 / 区分这些效应 / 因为消费者 / 可能被影响 / 被所有三种。</p>\n<p>一项最近的研究 / 试图分离它们 / 通过观察 / 贿赂起诉 / 在美国《反海外腐败法》（FCPA）下。</p>\n<p>它论证说 / 由于检察官 / 不消费 / 公司的产品 / 作为他们调查的一部分，/ 他们可能被影响 / 只被光环效应。</p>\n<h3>标准译文 · 第3段</h3>\n<p>之前关于CSR的研究难以区分这些效应，因为消费者可能同时受到所有三种效应的影响。一项最近的研究试图通过观察美国《反海外腐败法》（FCPA）下的贿赂起诉案件来分离这些效应。该研究认为，由于检察官在调查过程中不会消费公司的产品，他们只可能受到光环效应的影响。</p>\n<h2>第4段</h2>\n<h3>完整原文 · 第4段</h3>\n<p>The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n<h3>意群划分 · 第4段</h3>\n<p>The study found that, / among prosecuted firms, / those with the most comprehensive / CSR programmes / tended to get / more lenient penalties.</p>\n<p>Their analysis / ruled out the possibility / that it was firms&#39; political influence, / rather than their CSR stand, / that accounted for the leniency: / Companies that contributed more / to political campaigns / did not receive / lower fines.</p>\n<h3>意群翻译 · 第4段</h3>\n<p>该研究发现，/ 在被起诉的公司中，/ 那些拥有最全面的 / CSR项目的 / 倾向于获得 / 更宽松的处罚。</p>\n<p>他们的分析 / 排除了可能性 / 是公司的政治影响力，/ 而不是他们的CSR立场，/ 造成了宽松处理：/ 为政治竞选贡献更多的公司 / 没有收到 / 更低的罚款。</p>\n<h3>标准译文 · 第4段</h3>\n<p>研究发现，在被起诉的公司中，那些拥有最全面CSR项目的公司往往获得更宽松的处罚。他们的分析排除了是公司的政治影响力而非CSR立场导致宽松处理的可能性：为政治竞选贡献更多的公司并没有获得更低的罚款。</p>\n<h2>第5段</h2>\n<h3>完整原文 · 第5段</h3>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#39;s record in CSR. &quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n<h3>意群划分 · 第5段</h3>\n<p>In all, / the study concludes / that whereas prosecutors / should only evaluate / a case / based on its merits, / they do seem to be influenced / by a company&#39;s record / in CSR.</p>\n<p>&quot;We estimate that / either eliminating / a substantial labour-rights concern, / such as child labour, / or increasing corporate giving / by about 20% / results in fines / that generally are 40% lower / than the typical punishment / for bribing foreign officials,&quot; / says one researcher.</p>\n<h3>意群翻译 · 第5段</h3>\n<p>总的来说，/ 该研究得出结论 / 尽管检察官 / 应该只评估 / 案件 / 基于其实质，/ 他们确实似乎被影响 / 被公司的记录 / 在CSR方面。</p>\n<p>&quot;我们估计 / 要么消除 / 一个重大的劳工权利问题，/ 比如童工，/ 或者增加企业捐赠 / 大约20% / 导致罚款 / 通常低40% / 比典型的惩罚 / 对贿赂外国官员，&quot; / 一位研究者说。</p>\n<h3>标准译文 · 第5段</h3>\n<p>总的来说，研究得出结论：尽管检察官应该只根据案件的实质来评估，但他们确实似乎受到公司CSR记录的影响。一位研究者说：&quot;我们估计，消除重大的劳工权利问题（如童工）或将企业捐赠增加约20%，会使罚款比贿赂外国官员的典型惩罚低40%左右。&quot;</p>\n<h2>第6段</h2>\n<h3>完整原文 · 第6段</h3>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n<h3>意群划分 · 第6段</h3>\n<p>Researchers admit / that their study / does not answer / the question / of how much / businesses ought to spend / on CSR.</p>\n<p>Nor does it reveal / how much companies / are banking on / the halo effect, / rather than the other possible benefits, / when they decide / their do-gooding policies.</p>\n<p>But at least / they have demonstrated / that when companies / get into trouble / with the law, / evidence of good character / can win them / a less costly punishment.</p>\n<h3>意群翻译 · 第6段</h3>\n<p>研究者承认 / 他们的研究 / 没有回答 / 这个问题 / 多少 / 企业应该花费 / 在CSR上。</p>\n<p>它也没有揭示 / 公司多大程度上 / 依赖于 / 光环效应，/ 而不是其他可能的好处，/ 当他们决定 / 他们的行善政策时。</p>\n<p>但至少 / 他们已经证明了 / 当公司 / 陷入麻烦 / 与法律，/ 良好品格的证据 / 可以为他们赢得 / 一个代价较小的惩罚。</p>\n<h3>标准译文 · 第6段</h3>\n<p>研究者承认，他们的研究没有回答企业应该在CSR上花费多少的问题。它也没有揭示公司在决定其行善政策时，多大程度上是依赖光环效应，而非其他可能的好处。但至少他们已经证明，当公司触犯法律时，良好品格的证据可以为他们赢得较轻的惩罚。</p>\n<h2>文章的句内逻辑（大家自行根据需求阅读)</h2>\n<p>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。</p>\n<p>符号的作用：</p>\n<ul>\n<li><code>→</code>：主要叙述继续向下推进；</li>\n<li><code>+</code>：并列；</li>\n<li><code>：</code>：解释、修饰或补充；</li>\n<li><code>//</code>：转折或对比；</li>\n<li>括号：把同一层的信息捆成一个整体。</li>\n</ul>\n\n<h2>句子逻辑梳理（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>&quot;There is one and only one：(social responsibility of business)&quot; → wrote Milton Friedman：(a Nobel prize-winning economist) → &quot;That is → to use its resources + engage in activities：(designed to increase its profits).&quot;</p>\n<p>But even if：(you accept Friedman&#39;s premise + regard corporate social responsibility (CSR) policies：(as a waste of shareholders&#39; money)) → things may not be → absolutely clear-cut.</p>\n<p>New research suggests：(that CSR may create → monetary value for companies) – at least when：(they are prosecuted：(for corruption)).</p>\n<p><strong>第2段</strong></p>\n<p>The largest firms：(in America and Britain) → together spend：(more than $15 billion a year)：(on CSR) → according to an estimate：(by EPG：(a consulting firm)).</p>\n<p>This could add value：(to their businesses)：(in three ways).</p>\n<p>First → consumers may take：(CSR spending)：(as a &quot;signal&quot;：(that a company&#39;s products → are of high quality)).</p>\n<p>Second → customers may be willing：(to buy a company&#39;s products)：(as an indirect way：(to donate to the good causes：(it helps))).</p>\n<p>And third → through a more diffuse：&quot;halo effect&quot;：(whereby its good deeds → earn it greater consideration：(from consumers and others)).</p>\n<p><strong>第3段</strong></p>\n<p>Previous studies on CSR → have had trouble：(differentiating these effects)：(because consumers → can be affected：(by all three)).</p>\n<p>A recent study → attempts to separate them：(by looking at：(bribery prosecutions：(under America&#39;s Foreign Corrupt Practices Act (FCPA)))).</p>\n<p>It argues：(that since prosecutors → do not consume：(a company&#39;s products)：(as part of their investigations) → they could be influenced：(only by the halo effect)).</p>\n<p><strong>第4段</strong></p>\n<p>The study found：(that among prosecuted firms → those with the most comprehensive：(CSR programmes) → tended to get：(more lenient penalties)).</p>\n<p>Their analysis → ruled out the possibility：(that it was firms&#39; political influence // rather than their CSR stand → that accounted for the leniency)：(Companies that contributed more：(to political campaigns) → did not receive：(lower fines)).</p>\n<p><strong>第5段</strong></p>\n<p>In all → the study concludes：(that whereas prosecutors → should only evaluate：(a case)：(based on its merits) // they do seem to be influenced：(by a company&#39;s record：(in CSR))).</p>\n<p>&quot;We estimate：(that either eliminating：(a substantial labour-rights concern：(such as child labour)) // or increasing corporate giving：(by about 20%) → results in fines：(that generally are 40% lower：(than the typical punishment：(for bribing foreign officials))))&quot; → says one researcher.</p>\n<p><strong>第6段</strong></p>\n<p>Researchers admit：(that their study → does not answer：(the question：(of how much → businesses ought to spend：(on CSR)))).</p>\n<p>Nor does it reveal：(how much companies → are banking on：(the halo effect) // rather than the other possible benefits)：(when they decide：(their do-gooding policies)).</p>\n<p>But at least → they have demonstrated：(that when companies → get into trouble：(with the law) → evidence of good character → can win them：(a less costly punishment)).</p>\n<h2>中文版句子逻辑（选修）</h2>\n<p><strong>第1段</strong></p>\n<p>&quot;有且只有一个：(企业的社会责任)&quot; → 米尔顿·弗里德曼写道：(一位诺贝尔奖得主经济学家) → &quot;那就是 → 使用其资源 + 从事活动：(旨在增加其利润)。&quot;</p>\n<p>但即使：(你接受弗里德曼的前提 + 认为企业社会责任（CSR）政策：(是股东资金的浪费)) → 事情可能不是 → 绝对明确的。</p>\n<p>新研究表明：(CSR可能创造 → 货币价值给公司) – 至少当：(它们被起诉：(因为腐败))时。</p>\n<p><strong>第2段</strong></p>\n<p>最大的公司：(在美国和英国) → 一起花费：(超过150亿美元每年)：(在CSR上) → 根据一项估计：(由EPG：(一家咨询公司))。</p>\n<p>这可能增加价值：(给他们的业务)：(以三种方式)。</p>\n<p>第一 → 消费者可能认为：(CSR支出)：(作为一个&quot;信号&quot;：(公司的产品 → 具有高质量))。</p>\n<p>第二 → 顾客可能愿意：(购买公司的产品)：(作为一种间接方式：(捐助于良好事业：(它所帮助的)))。</p>\n<p>第三 → 通过一种更加分散的：&quot;光环效应&quot;：(借此其善行 → 为它赢得更多考虑：(来自消费者和其他人))。</p>\n<p><strong>第3段</strong></p>\n<p>之前关于CSR的研究 → 遇到了困难：(区分这些效应)：(因为消费者 → 可能被影响：(被所有三种))。</p>\n<p>一项最近的研究 → 试图分离它们：(通过观察：(贿赂起诉：(在美国《反海外腐败法》（FCPA）下)))。</p>\n<p>它论证：(由于检察官 → 不消费：(公司的产品)：(作为他们调查的一部分) → 他们可能被影响：(只被光环效应))。</p>\n<p><strong>第4段</strong></p>\n<p>该研究发现：(在被起诉的公司中 → 那些拥有最全面的：(CSR项目的) → 倾向于获得：(更宽松的处罚))。</p>\n<p>他们的分析 → 排除了可能性：(是公司的政治影响力 // 而不是他们的CSR立场 → 造成了宽松处理)：(为政治竞选贡献更多的公司 → 没有收到：(更低的罚款))。</p>\n<p><strong>第5段</strong></p>\n<p>总的来说 → 该研究得出结论：(尽管检察官 → 应该只评估：(案件)：(基于其实质) // 他们确实似乎被影响：(被公司的记录：(在CSR方面)))。</p>\n<p>&quot;我们估计：(要么消除：(一个重大的劳工权利问题：(比如童工)) // 或者增加企业捐赠：(大约20%) → 导致罚款：(通常低40%：(比典型的惩罚：(对贿赂外国官员))))&quot; → 一位研究者说。</p>\n<p><strong>第6段</strong></p>\n<p>研究者承认：(他们的研究 → 没有回答：(这个问题：(多少 → 企业应该花费：(在CSR上))))。</p>\n<p>它也没有揭示：(公司多大程度上 → 依赖于：(光环效应) // 而不是其他可能的好处)：(当他们决定：(他们的行善政策))时。</p>\n<p>但至少 → 他们已经证明了：(当公司 → 陷入麻烦：(与法律) → 良好品格的证据 → 可以为他们赢得：(一个代价较小的惩罚))。</p>\n<h2>长难句翻译练习（英一必修，英二选修)</h2>\n<p>对于长难句的翻译，流程一共五步：</p>\n<ol>\n<li>划分意群；</li>\n<li>逐个意群直译；</li>\n<li>按照中文语感，把应该放在一起的意群合并；</li>\n<li>找到中文句子的骨干，再按照中文语序调整位置；</li>\n<li>对完整句子进行艺术加工，整理成参考译文。</li>\n</ol>\n<h2>1. 第1段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>But even if / you accept Friedman&#39;s premise / and regard corporate social responsibility (CSR) policies / as a waste of shareholders&#39; money, / things may not be / absolutely clear-cut.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>但即使 / 你接受弗里德曼的前提 / 并认为企业社会责任（CSR）政策 / 是股东资金的浪费，/ 事情可能不是 / 绝对明确的。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把even if统领的accept与regard作为并列让步条件，主句在逗号后。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>但即使  你接受弗里德曼的前提  并认为企业社会责任（CSR）政策  是股东资金的浪费， 事情可能不是  绝对明确的。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>即使接受Friedman的前提，事情也未必界限分明。</p>\n</blockquote>\n<p>先说即使赞成两项前提，再落到事情并非绝对明确。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>但即使你接受弗里德曼的前提，认为企业社会责任（CSR）政策是浪费股东的钱，事情也可能并非绝对明确。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>may not与absolutely共同限制结论，不是断言社会责任一概浪费。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>但即使你接受弗里德曼的前提，认为企业社会责任（CSR）政策是浪费股东的钱，事情也可能并非绝对明确。</p>\n</blockquote>\n<h2>2. 第4段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>Their analysis ruled out the possibility that it was firms&#39; political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>Their analysis / ruled out the possibility / that it was firms&#39; political influence, / rather than their CSR stand, / that accounted for the leniency: / Companies that contributed more / to political campaigns / did not receive / lower fines.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>他们的分析 / 排除了可能性 / 是公司的政治影响力，/ 而不是他们的CSR立场，/ 造成了宽松处理：/ 为政治竞选贡献更多的公司 / 没有收到 / 更低的罚款。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>it was ... that是强调结构；rather than形成政治影响与责任立场的对照。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>他们的分析  排除了可能性  是公司的政治影响力， 而不是他们的CSR立场， 造成了宽松处理： 为政治竞选贡献更多的公司  没有收到  更低的罚款。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>分析排除了政治影响造成宽大处罚的可能。</p>\n</blockquote>\n<p>先说排除了哪种解释，再用冒号后的政治捐款与罚款结果说明理由。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>他们的分析排除了是公司的政治影响力而非CSR立场导致宽松处理的可能性：为政治竞选贡献更多的公司并没有获得更低的罚款。</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>did not receive lower fines是否定政治捐款的解释，不能译成捐款减少罚款。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>他们的分析排除了是公司的政治影响力而非CSR立场导致宽松处理的可能性：为政治竞选贡献更多的公司并没有获得更低的罚款。</p>\n</blockquote>\n<h2>3. 第5段第2句</h2>\n<h3>原文</h3>\n<blockquote>\n<p>&quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,&quot; says one researcher.</p>\n</blockquote>\n<h3>第一步：划分意群</h3>\n<blockquote>\n<p>&quot;We estimate that / either eliminating / a substantial labour-rights concern, / such as child labour, / or increasing corporate giving / by about 20% / results in fines / that generally are 40% lower / than the typical punishment / for bribing foreign officials,&quot; / says one researcher.</p>\n</blockquote>\n<h3>第二步：逐个意群直译</h3>\n<blockquote>\n<p>&quot;我们估计 / 要么消除 / 一个重大的劳工权利问题，/ 比如童工，/ 或者增加企业捐赠 / 大约20% / 导致罚款 / 通常低40% / 比典型的惩罚 / 对贿赂外国官员，&quot; / 一位研究者说。</p>\n</blockquote>\n<h3>第三步：按照中文语感合并意群</h3>\n<p>把either ... or ...连接的两种改善作为results in的主语；such as是对劳动权利问题举例。</p>\n<p>合并后先把意思连起来：</p>\n<blockquote>\n<p>&quot;我们估计  要么消除  一个重大的劳工权利问题， 比如童工， 或者增加企业捐赠  大约20%  导致罚款  通常低40%  比典型的惩罚  对贿赂外国官员，&quot;  一位研究者说。</p>\n</blockquote>\n<h3>第四步：寻找句子骨干并按照中文语序调整</h3>\n<p>接着找中文句子的骨干：</p>\n<blockquote>\n<p>研究估计改善劳动权利或增加捐赠可能对应更低罚款。</p>\n</blockquote>\n<p>先列可比较的改善，再说对应罚款通常比典型处罚低多少。</p>\n<p>按照中文语序调整后是：</p>\n<blockquote>\n<p>一位研究者说：&quot;我们估计，消除重大的劳工权利问题（如童工）或将企业捐赠增加约20%，会使罚款比贿赂外国官员的典型惩罚低40%左右。&quot;</p>\n</blockquote>\n<h3>第五步：艺术加工</h3>\n<p>20%对应捐赠增幅，40%对应罚款降幅，不能交换两个数值。</p>\n<p>参考译文：</p>\n<blockquote>\n<p>一位研究者说：&quot;我们估计，消除重大的劳工权利问题（如童工）或将企业捐赠增加约20%，会使罚款比贿赂外国官员的典型惩罚低40%左右。&quot;</p>\n</blockquote>\n<h1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h1>\n<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquote>\n<p>常见情况包括：</p>\n<ul>\n<li>题目问段落主旨，选项是段落中的一个细节；</li>\n<li>题目问全文主旨，选项只是某一段的内容；</li>\n<li>题目问例子作用，选项只是例子内部发生了什么；</li>\n<li>题目问作者观点，选项只是作者用来论证观点的事实；</li>\n<li>题目限定某一段，选项出处却在其他段；</li>\n<li>题目问论点，选项给的是论据；</li>\n<li>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项内容可以是真的，但它回答错了问题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。</p>\n<p>但阅读选择题不是判断选项本身真假，而是判断：</p>\n<blockquote>\n<p>这个选项能不能准确回答题干？</p>\n</blockquote>\n<p>所以这一类最常见的错误脑回路是：</p>\n<blockquote>\n<p>文章里确实写了 → 这个选项是真的 → 那就一定能选。</p>\n</blockquote>\n<p>真正应该继续追问：</p>\n<blockquote>\n<p>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？</p>\n</blockquote>\n<hr>\n<h4>第三类：无中生有</h4>\n<h5>定义</h5>\n<p>结合题干和选项的完整意思，文章实际没有表达这个命题。</p>\n<p>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。</p>\n<p>以科研与能源文章为例，常见的脑补包括：</p>\n<ul>\n<li>原文有 energy，脑补出 energy shortage；</li>\n<li>原文有 sustainable，脑补出 suspicions about sustainable energy；</li>\n<li>原文有研究耗能，脑补出已经造成严重后果；</li>\n<li>原文有净零目标，脑补出某项目由净零倡议推动；</li>\n<li>原文说用了河流供电，脑补成解决了能源短缺；</li>\n<li>原文说某项技术有用，脑补成问题非常紧迫；</li>\n<li>原文提到一个目标，脑补出某种因果、目的或态度。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们不是在比对原文，而是在替作者把文章继续写下去：</p>\n<blockquote>\n<p>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。</p>\n</blockquote>\n<p>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。</p>\n<p>无中生有的分析不能只写：</p>\n<blockquote>\n<p>原文没提，所以错。</p>\n</blockquote>\n<p>而要写清楚：</p>\n<blockquote>\n<p>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。</p>\n</blockquote>\n<p>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：</p>\n<p>本篇没有用于先行确定全文主旨的选择题，我们从31题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。</p>\n<h2>31题</h2>\n<blockquote>\n<p>The author views Milton Friedman’s statement about CSR with ______.</p>\n<p>作者以怎样的态度看待米尔顿·弗里德曼关于企业社会责任的说法？</p>\n</blockquote>\n<h3>题型</h3>\n<p>态度题：对象是Friedman的说法，评价者是作者；将引语、even if让步前提与But后的回应分开。</p>\n<p>题干给出Milton Friedman，直接到第一段找这位经济学家的引语。把引语以及后面从But even if到本段结尾的作者回应完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut</p>\n<p>New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption</p>\n</blockquote>\n<h3>A. uncertainty</h3>\n<blockquote>\n<p>作者对Friedman的说法持不确定态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>may not be absolutely clear-cut不是作者完全拿不准，而是借让步质疑“社会责任支出必然浪费”的简单理解，后面马上给经济价值的研究线索。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对Friedman的说法持不确定态度。</p>\n</blockquote>\n<p>may not be absolutely clear-cut不是作者完全拿不准，而是借让步质疑“社会责任支出必然浪费”的简单理解，后面马上给经济价值的研究线索。</p>\n<p>先引利润责任论，再说即便接受这一前提，事情也未必如此分明；新研究的作用在于说明CSR与货币收益可能相容。</p>\n<p>uncertainty会把作者对原判断的挑战读成自己没有判断。原文已有明确的反向根据，但也未宣称所有CSR都必然盈利，B的有所怀疑更贴切。</p>\n<h4>写作视角法</h4>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n<p>诺贝尔经济学奖得主Friedman写道，企业唯一的社会责任是利用资源、开展增加利润的活动。但即便接受此前提、将CSR政策视为浪费股东资金，事情也未必如此泾渭分明。新研究表明，CSR可能为公司创造货币价值，至少在它们因腐败被起诉时如此。</p>\n</blockquote>\n<p>先引利润责任论，再说即便接受这一前提，事情也未必如此分明；新研究的作用在于说明CSR与货币收益可能相容。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author views Friedman’s statement with uncertainty.</p>\n<p>作者对Friedman的说法持不确定态度。</p>\n</blockquote>\n<p>uncertainty会把作者对原判断的挑战读成自己没有判断。原文已有明确的反向根据，但也未宣称所有CSR都必然盈利，B的有所怀疑更贴切。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n<h3>B. skepticism</h3>\n<blockquote>\n<p>作者对Friedman的说法持怀疑态度。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>But even if先让步再限制原来的利润与责任划分，新研究又说CSR可能创造货币价值，支持skepticism的质疑态度。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>&quot;There is one and only one social responsibility of business,&quot; wrote Milton Friedman, a Nobel prize-winning economist, &quot;That is, to use its resources and engage in activities designed to increase its profits.&quot; But even if you accept Friedman&#39;s premise and regard corporate social responsibility (CSR) policies as a waste of shareholders&#39; money, things may not be absolutely clear-cut. New research suggests that CSR may create monetary value for companies – at least when they are prosecuted for corruption.</p>\n</blockquote>\n<h4>定位比对法</h4>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者对Friedman的说法持怀疑态度。</p>\n</blockquote>\n<p>先区分Friedman的引语与作者的回应。引语将企业社会责任归于增进利润；随后<code>But even if you accept ...</code>暂接受这一前提，并引入将CSR支出视为浪费的理解。</p>\n<p>真正的主句是<code>things may not be absolutely clear-cut</code>，作者指出不能如此简单区分；紧接着研究说CSR也许能创造货币价值。也就是说，即使用利润来衡量，也不能事先把CSR一律当作浪费。</p>\n<p>这不是要求读者彻底抛弃利润目标，而是在原来的评价框架里提出反向证据。<code>skepticism</code>能表达这种有所保留的质疑；研究范围有限，不等于作者自己没有
