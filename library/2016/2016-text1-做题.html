面对的巨大风险</td>\n  <td>最后说还可以再往前一步</td>\n</tr>\n</tbody>\n</table>\n<p>D把监管与改革写成行业遭受的巨大威胁，但文章并不担忧时尚行业会被摧毁。真正被批评的是行业长期强化物质外表和理想化体型。\n法国罚款、丹麦准入限制和点名方式都是纠偏工具，不是作者列举的行业生存危机。第五、六段还写行业主动制定标准、承担责任，说明它在参与改变，而不是被动抵御威胁。\n结尾要求把美提升到特定行业的物质标准之外，也不是替行业解除威胁。D改变了作者站位，无法覆盖全文。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[226,241,938,34],[167,283,989,35],[167,325,998,35],[167,368,998,34],[167,409,879,36],[227,452,938,35],[168,491,989,43],[167,537,998,34],[168,579,997,35],[167,622,994,34],[167,664,984,34],[237,705,928,35],[167,748,998,35],[167,791,998,34],[167,833,814,34],[226,875,939,34],[167,918,998,34],[167,960,1000,34],[167,1001,839,35],[226,1044,938,35],[167,1087,998,34],[167,1129,998,34],[167,1171,688,35],[226,1214,939,34],[167,1256,998,34],[167,1297,998,35],[167,1340,997,35],[167,1381,998,36],[167,1425,999,34],[170,1466,994,36],[167,1509,518,35],[227,1552,938,34],[167,1594,1000,34],[167,1636,751,35]],"questionRects":[[187,1425,746,34],[232,1478,662,34],[232,1531,608,34],[232,1584,567,34],[232,1636,557,35]],"meta":{"kind":"main_option","qid":"25","option":"D"}},{"section":"25题","raw":"### 25题主旨结果\n\nA能够同时解释法国禁令、对严厉处罚的保留、丹麦自愿规范以及结尾超越行业物质标准的主张；其余三项都把全文缩成单一受害者、抽象争斗或行业危机。\n\n> **25题选A。**\n\n这句话就是本文后续做题的主旨底牌：\n\n**A Challenge to the Fashion Industry’s Body Ideals / 对时尚行业身体审美观的挑战**","html":"<h3>25题主旨结果</h3>\n<p>A能够同时解释法国禁令、对严厉处罚的保留、丹麦自愿规范以及结尾超越行业物质标准的主张；其余三项都把全文缩成单一受害者、抽象争斗或行业危机。</p>\n<blockquote>\n<p><strong>25题选A。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>A Challenge to the Fashion Industry’s Body Ideals / 对时尚行业身体审美观的挑战</strong></p>\n","articleRects":[[226,241,938,34],[167,283,989,35],[167,325,998,35],[167,368,998,34],[167,409,879,36],[227,452,938,35],[168,491,989,43],[167,537,998,34],[168,579,997,35],[167,622,994,34],[167,664,984,34],[237,705,928,35],[167,748,998,35],[167,791,998,34],[167,833,814,34],[226,875,939,34],[167,918,998,34],[167,960,1000,34],[167,1001,839,35],[226,1044,938,35],[167,1087,998,34],[167,1129,998,34],[167,1171,688,35],[226,1214,939,34],[167,1256,998,34],[167,1297,998,35],[167,1340,997,35],[167,1381,998,36],[167,1425,999,34],[170,1466,994,36],[167,1509,518,35],[227,1552,938,34],[167,1594,1000,34],[167,1636,751,35]],"questionRects":[[187,1425,746,34],[232,1478,662,34],[232,1531,608,34],[232,1584,567,34],[232,1636,557,35]],"meta":{"kind":"main_result","qid":"25"}},{"section":"进阶方法","raw":"# 4.进阶方法：交叉验证冲全对\n\n如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。","html":"<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"review_intro"}},{"section":"进阶回查","raw":"## 回查24题：C还是D？\n\n第一遍留下：\n\n- C. showing little concern for **[xxx]** factors\n- D. setting a high **[xxx]** threshold for models\n\n主旨底牌是：\n\n> **A Challenge to the Fashion Industry’s Body Ideals / 对时尚行业身体审美观的挑战**\n\n也就是：全文的重点不是单独处罚某一种年龄门槛，而是挑战时尚行业用外在身体标准定义美，并要求行业真正承担对模特、年轻人和社会审美的影响；现在只拿这条新依据，检查第一次没有拉开的两项。\n\n第一遍读第六段时，C和D都能接到丹麦宪章与CFW准入。C抓住“take responsibility”与“showing little concern”的对立：设计师若漠视宪章要求关心的因素，可能被拒绝。D抓住“rules ... regarding the age”与“threshold for models”的联系：年龄规则可能表现为某种门槛。由于两项都有遮挡，而且段中没有直接解释具体门槛，第一次同时留下是合理的。\n\n我们先把题干和两个选项接起来。\n\n把题干接回来，C说设计师因为很少关心某类因素而被CFW拒绝；D说设计师因为给模特设置很高的某类门槛而被拒绝。C需要的是“宪章要求行业关心并承担影响—漠视就不合规”这条责任链，D需要的是“宪章规定某个具体高门槛—设计师设置它就违规”这条门槛链。第六段明确写出前一条责任要求，却没有写出后一条门槛的高度和违规方向。\n\n现在拿主旨来检查。\n\n先看C。全文主旨是挑战时尚行业的身体审美观，前文一直批评以外表、超瘦体形和物质标准衡量个人价值。丹麦宪章进一步要求行业意识到自己对body ideals和young people的影响并承担责任。若设计师对健康等相关因素缺少关心，他正是在延续被全文挑战的审美方式；CFW拒绝准入就成为这场挑战的具体执行。因此C既能接回局部责任要求，也直接服务全文中心。\n\n再看D。若D要由主旨支持，高年龄门槛本身必须是全文批判身体审美的一个明确表现，例如只允许某个年龄以上或以下的模特参与，并且作者要把这种门槛写成有害的身体标准。但全文没有讨论年龄门槛高低，更没有说“高”本身就是问题。age只是丹麦规则关注的多个特征之一，D把一个可能的规则细节扩大成具体拒绝原因，无法与全文反复出现的健康、身体理想和责任形成稳定连接。\n\n回到第一次局部证据，D因为age与threshold仍有表面连接而被保留；主旨加入以后，两项的覆盖力拉开了。C说明设计师为什么违背整篇文章要推动的责任方向，D只保留一个未被写明的技术性门槛。C同时通过局部责任链和全文身体审美中心，D只能依靠一种可能解释。\n\n> **24题选C。**","html":"<h2>回查24题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>C. showing little concern for <span class=\"mask\">[xxx]</span> factors</li>\n<li>D. setting a high <span class=\"mask\">[xxx]</span> threshold for models</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>A Challenge to the Fashion Industry’s Body Ideals / 对时尚行业身体审美观的挑战</strong></p>\n</blockquote>\n<p>也就是：全文的重点不是单独处罚某一种年龄门槛，而是挑战时尚行业用外在身体标准定义美，并要求行业真正承担对模特、年轻人和社会审美的影响；现在只拿这条新依据，检查第一次没有拉开的两项。</p>\n<p>第一遍读第六段时，C和D都能接到丹麦宪章与CFW准入。C抓住“take responsibility”与“showing little concern”的对立：设计师若漠视宪章要求关心的因素，可能被拒绝。D抓住“rules ... regarding the age”与“threshold for models”的联系：年龄规则可能表现为某种门槛。由于两项都有遮挡，而且段中没有直接解释具体门槛，第一次同时留下是合理的。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>把题干接回来，C说设计师因为很少关心某类因素而被CFW拒绝；D说设计师因为给模特设置很高的某类门槛而被拒绝。C需要的是“宪章要求行业关心并承担影响—漠视就不合规”这条责任链，D需要的是“宪章规定某个具体高门槛—设计师设置它就违规”这条门槛链。第六段明确写出前一条责任要求，却没有写出后一条门槛的高度和违规方向。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看C。全文主旨是挑战时尚行业的身体审美观，前文一直批评以外表、超瘦体形和物质标准衡量个人价值。丹麦宪章进一步要求行业意识到自己对body ideals和young people的影响并承担责任。若设计师对健康等相关因素缺少关心，他正是在延续被全文挑战的审美方式；CFW拒绝准入就成为这场挑战的具体执行。因此C既能接回局部责任要求，也直接服务全文中心。</p>\n<p>再看D。若D要由主旨支持，高年龄门槛本身必须是全文批判身体审美的一个明确表现，例如只允许某个年龄以上或以下的模特参与，并且作者要把这种门槛写成有害的身体标准。但全文没有讨论年龄门槛高低，更没有说“高”本身就是问题。age只是丹麦规则关注的多个特征之一，D把一个可能的规则细节扩大成具体拒绝原因，无法与全文反复出现的健康、身体理想和责任形成稳定连接。</p>\n<p>回到第一次局部证据，D因为age与threshold仍有表面连接而被保留；主旨加入以后，两项的覆盖力拉开了。C说明设计师为什么违背整篇文章要推动的责任方向，D只 O8BAABA7wEAAAC9BwAAAPQeAAAA0HsAAADQewAAAEDvAQAAAL0HAAAA9B4AAAD0HgAAANB7AAAAQO8BAAAAvQcAAAC9BwAAAPQeAAAA0HsAAABA7wEAAEDvAQAAAL0HAAAA9B4AAADQewAAANB7AAAAQO8BAAAAvQcAAAD0HgAAAPQeAAAA0HsAAABA7wEAAAC9BwAAAL0HAAAALgKtUuosZc9zkwAAAABJRU5ErkJggg==","articleSize":{"w":1354,"h":1885},"questionSize":{"w":1354,"h":1885},"fullHtml":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>21题题干</h2>\n<p><strong>According to the first paragraph, what would happen in France?</strong></p>\n<blockquote>\n<p>根据第一段，法国将会发生什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>22题题干</h2>\n<p><strong>The phrase “impinging on” (Line 2, Para. 2) is closest in meaning to ______.</strong></p>\n<blockquote>\n<p>第二段第二行的“impinging on”最接近下面哪一项含义？</p>\n</blockquote>\n<p>题型：<strong>词义句意题</strong>。</p>\n<hr />\n<h2>23题题干</h2>\n<p><strong>Which of the following is true of the fashion industry?</strong></p>\n<blockquote>\n<p>关于时尚行业，下面哪一项是正确的？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>24题题干</h2>\n<p><strong>A designer is most likely to be rejected by CFW for ______.</strong></p>\n<blockquote>\n<p>一名设计师最可能因为什么被哥本哈根时装周拒绝？</p>\n</blockquote>\n<p>题型：<strong>推断细节题</strong>。</p>\n<hr />\n<h2>25题题干</h2>\n<p><strong>Which of the following may be the best title of the text?</strong></p>\n<blockquote>\n<p>下面哪一项可能是本文最佳标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>however, In contrast, rather than</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>uplifting, severe, best</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>ban, take responsibility, deny access</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>fine, prison, deny access</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>fashion, beauty, models, standards</td>\n</tr>\n</tbody>\n</table>\n<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>France, which prides itself as the global <span class=\"mask\">[xxx]</span> of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women. Its lawmakers gave <span class=\"mask\">[xxx]</span> approval last week to a law that would make it a crime to employ ultra-thin models on runways. The parliament also agreed to ban websites that “<span class=\"mask\">[xxx]</span> excessive thinness” by promoting extreme dieting.</p>\n</div></div><div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>France, which prides itself as the global <span class=\"mask\">[xxx elevate notions of beauty / beyond the 物质标准 of a particular industry.</p>\n</div></div><div class=\"coarseStack\"><div class=\"coarsePara coarseDone\"><p>1、法国、全球、时尚、时尚行业、失去绝对权利、定义外在美、女性、议员、上周批准、一项法律、定为犯罪、超瘦模特、走秀台。</p>\n</div><div class=\"coarsePara coarseDone\"><p>2、这些措施、美、不应被定义、健康、一个开始、超瘦模特、保护模特、把自己饿死、时尚行业、承担责任。</p>\n</div><div class=\"coarsePara coarseDone\"><p>3、这些禁令、女性、自己的美、它们暗示、人们应看重、品格和智慧。</p>\n</div><div class=\"coarsePara coarseDone\"><p>4、法国措施、过度依赖、惩罚、改变文化、瘦骨嶙峋、按照法律。</p>\n</div><div class=\"coarsePara coarseDone\"><p>5、时尚行业、知道、一个、问题、理想化体型、在丹麦、试图制定。</p>\n</div><div class=\"coarsePara coarseDone\"><p>6、与法国做法不同、丹麦时尚行业、上月达成一致、规则、年龄、健康、模特、丹麦时尚道德宪章、承担责任、身体审美、年轻人、主要工具。</p>\n</div><div class=\"coarsePara currentFocus\"><p>7、依靠、道德、而不是法律、身体审美、最佳做法、更好、物质标准。</p>\n</div></div><p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到法国措施、时尚行业、丹麦标准或CFW时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现法国、时尚行业、定义外在美、法律、超瘦模特和走秀台；中间出现健康、个人价值、严厉惩罚、行业问题、丹麦和试图制定；后面又出现丹麦宪章、年龄、健康、承担责任、身体审美、主要工具、道德和物质标准。</p>\n<p>到这里还不能自然地说清楚：法国法律到底改变了什么，健康与外在美怎样连接，个人价值为什么会被牵进来，严厉惩罚和丹麦做法有什么差别，CFW怎样执行规则，以及最后的道德与物质标准分别指什么。粗读时只要能判断“文章大概在谈时尚行业的身体审美及不同应对办法”，并知道法国、丹麦、CFW等信息大约在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住法国限制、健康、个人价值、严厉处罚、丹麦标准、CFW和道德做法；这些碎片之间到底是什么关系，等题目问到再精读。</p>\n<h1>3. 开始做21至24题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<h2>21题</h2>\n<blockquote>\n<p>According to the first paragraph, what would happen in France?<br />\n根据第一段，法国将会发生什么？</p>\n</blockquote>\n<p>题干直接写出first paragraph，因此位置已经确定。先把第一段完整读完，看法国新法究竟改变了谁的权利、限制了哪些做法。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>France, which prides itself as the global <span class=\"mask\">[xxx]</span> of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women. Its lawmakers gave <span class=\"mask\">[xxx]</span> approval last week to a law that would make it a crime to employ ultra-thin models on runways. The parliament also agreed to ban websites that “<span class=\"mask\">[xxx]</span> excessive thinness” by promoting extreme dieting.</p>\n<p>开始精读：</p>\n<p>France, which prides itself as the global <span class=\"mask\">[xxx]</span> of fashion, / has decided its fashion industry has lost an absolute right / to define physical beauty for women. / Its lawmakers gave <span class=\"mask\">[xxx]</span> approval last week / to a law that would make it a crime / to employ ultra-thin models on runways. / The parliament also agreed to ban websites / that “<span class=\"mask\">[xxx]</span> excessive thinness” by promoting extreme dieting.</p>\n<p>顺着英文顺序读：</p>\n<p>法国以自己是全球时尚 <span class=\"mask\">[xxx]</span> 而自豪 / 已经认定本国时尚行业失去了绝对权利 / 去定义女性的外在美 / 议员上周给予了 <span class=\"mask\">[xxx]</span> 批准 / 针对一项把某种做法定为犯罪的法律 / 即在走秀台上雇用超瘦模特 / 议会还同意禁止一些网站 / 这些网站通过推广极端节食来“<span class=\"mask\">[xxx]</span> 过度消瘦”</p>\n</blockquote>\n<p>读完可以看出，空格要补的是法国这些新规定会带来的直接变化；下面把A—D分别接回题干。</p>\n<h3>A. Physical beauty would be <span class=\"mask\">[xxx]</span>.</h3>\n<blockquote>\n<p>外在美会被 <span class=\"mask\">[xxx]</span>。</p>\n</blockquote>\n<p>把A接回题干，它说的是：法国实施新规定以后，女性外在美的定义方式会发生变化。</p>\n<p>A里的“Physical beauty would be”和原文“lost an absolute right to define physical beauty”都在谈新法之后女性外在美由谁来界定，因为选项写结果，原文写时尚行业失去原先的定义权，所以回看第一段第一句。</p>\n<blockquote>\n<p>France, which prides itself as the global <span class=\"mask\">[xxx]</span> of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women.</p>\n</blockquote>\n<p>原文“lost an absolute right to define physical beauty”先写清一件事：时尚行业过去能够主导女性外在美的标准，现在法国认为这种绝对定义权不该继续存在。A的“Physical beauty would be”则把这项权力变化写成外在美会被重新处理的结果。两边的主体表达不同，但动作落点都在“外在美怎样被定义”。</p>\n<p>第一段后面又补了两项具体做法：使用超瘦模特会被定为犯罪，鼓吹极端节食的网站也会被禁止。这些措施不是简单增加某个行业流程，而是在削弱原有审美标准的支配力。因此，A中被遮住的词虽然暂时读不出，前后的“Physical beauty would be”已经能与原文的定义权变化接上。</p>\n<p>A没有把法国措施扩大成整个行业消失，也没有另换对象；它只把“失去定义女性外在美的绝对权利”转换成“外在美会被怎样”。决定性动作正好被遮住，所以目前不能把这条对应关系否掉。</p>\n<p><strong>时尚行业失去定义外在美的绝对权利，能不能支持“Physical beauty would be”后面接一个改变定义方式的结果？</strong></p>\n<p>能。原文已经把变化落在define physical beauty上，A也把结果落在Physical beauty上；中间被遮住的动作仍可能正是对这种重新界定的概括。</p>\n<p>法国新法的三项内容都在改变原有的审美支配方式，A没有加入与这些措施相反的主体、时间或方向，因此先保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. New runways would be constructed.</h3>\n<blockquote>\n<p>新的走秀台将被修建。</p>\n</blockquote>\n<p>把B接回题干，它说的是：法国会修建新的走秀台。</p>\n<p>B里的“New runways would be constructed”和原文“employ ultra-thin models on runways”都出现了runways，因为选项写修建走秀台，原文写限制谁能在走秀台上工作，所以回看第一段第二句。</p>\n<blockquote>\n<p>Its lawmakers gave <span class=\"mask\">[xxx]</span> approval last week to a law that would make it a crime to employ ultra-thin models on runways.</p>\n</blockquote>\n<p>原文“employ ultra-thin models on runways”说的是走秀台上的用人规则：继续雇用超瘦模特会触犯法律。B的“New runways would be constructed”说的却是基础设施建设，要出现新走秀台。一个改变的是模特雇用条件，一个改变的是走秀台数量。</p>\n<p>两边确实共享runways这个地点词，所以第一眼容易连到一起；但地点相同不等于动作相同。原文没有让政府、议会或时尚公司去建造任何东西，法律的动作是禁止某类雇用。</p>\n<p>B若成立，第一段需要出现build、construct、open之类的建设动作，并且说明新走秀台是法律实施后的结果。现在读到的则是make it a crime和employ，动作方向已经完全换掉。</p>\n<p><strong>“限制超瘦模特在走秀台上工作”和“修建新的走秀台”是在说同一种变化吗？</strong></p>\n<p>不是。原文改变的是走秀台上的雇用规则，B改变的是走秀台本身的建设数量。</p>\n<p>即使遮挡处补成“正式批准”或其他评价，也只会修饰这项法律，不能把雇用限制变成建造工程，所以B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. Websites about dieting would thrive.</h3>\n<blockquote>\n<p>节食网站会蓬勃发展。</p>\n</blockquote>\n<p>把C接回题干，它说的是：与节食有关的网站会兴盛起来。</p>\n<p>C里的“Websites about dieting would thrive”和原文“agreed to ban websites”都指向节食网站，因为选项预测这些网站兴盛，原文写议会同意禁止其中一类，所以回看第一段最后一句。</p>\n<blockquote>\n<p>The parliament also agreed to ban websites that “<span class=\"mask\">[xxx]</span> excessive thinness” by promoting extreme dieting.</p>\n</blockquote>\n<p>原文“agreed to ban websites”给出的方向是关闭、禁止；C的“Websites about dieting would thrive”给出的方向是兴盛、繁荣。两边谈的是同一类网络内容，但结果正好相反。</p>\n<p>原文还限定了被禁的是通过极端节食鼓吹过度瘦削的网站。C把它放宽成所有about dieting的网站，同时又把ban改成thrive。范围扩大和动作反转同时出现。</p>\n<p>遮挡词位于引号中，决定网站怎样作用于excessive thinness；无论它具体是什么，都不改变主句已经写出的agreed to ban websites。</p>\n<p><strong>议会已经同意禁止这类网站，它们还能被概括为“would thrive”吗？</strong></p>\n<p>不能。ban与thrive分别表示压制和兴盛，结果方向相反。</p>\n<p>C既没有保留原文的禁止动作，也没有保留原文对网站类型的限定，第一段的明确信息足以排除它。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. The fashion industry would decline.</h3>\n<blockquote>\n<p>时尚行业会衰退。</p>\n</blockquote>\n<p>把D接回题干，它说的是：法国时尚行业会衰退。</p>\n<p>D里的“fashion industry would decline”和原文“has lost an absolute right”都写法国措施会让时尚行业失去某种原有状态，因为选项说整个行业衰退，原文只说它失去一项定义权，所以回看第一段第一句。</p>\n<blockquote>\n<p>France, which prides itself as the global <span class=\"mask\">[xxx]</span> of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women.</p>\n</blockquote>\n<p>原文“has lost an absolute right”限定得很具体：失去的是定义女性外在美的绝对权利。D的“fashion industry would decline”却把变化扩大为整个时尚行业走向衰退。一个是某项权力被收回，一个是行业规模、收入或影响力整体下降。</p>\n<p>第一段列出的法律措施也只针对超瘦模特和鼓吹极端节食的网站，没有写企业倒闭、市场萎缩、就业减少或产业地位下降。D需要一条从监管措施到行业衰退的因果链，而段中没有建立这条链。</p>\n<p>D与原文都出现fashion industry，只能说明对象相同，不能把“失去一项定义权”改写成“行业衰退”。范围从单一权利扩到整个产业，结论已经越过第一段。</p>\n<p><strong>失去一项定义审美的权利，是否就等于整个fashion industry would decline？</strong></p>\n<p>不等于。权力范围被限制，只能说明行业不能再独占审美定义权，不能直接说明行业整体衰退。</p>\n<p>D需要产业规模或经营状况下降的材料，第一段没有这种结果；遮挡处也不承担这条因果，因此D排除。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>21题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只留下A。另外三项都已经与当前读到的主体、动作、范围或方向出现明确冲突。</p>\n<h2>22题</h2>\n<blockquote>\n<p>The phrase “impinging on” (Line 2, Para. 2) is closest in meaning to ______.<br />\n第二段第二行的“impinging on”最接近下面哪一项含义？</p>\n</blockquote>\n<p>题干标明Para. 2，并且点出impinging on这一处，所以直接回到第二段。先把整段顺下来，确认这个短语连接的是looks与health之间的什么关系。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Such measures have a couple of <span class=\"mask\">[xxx]</span> motives. They suggest beauty should not be defined by looks that end up <span class=\"mask\">[xxx]</span> on health. That’s a start. And the ban on ultra-thin models seems to go beyond protecting models from starving themselves to death—as some have done. It tells the fashion industry that it must take responsibility for the signal it sends women, especially teenage girls, about the social tape-measure they must use to determine their individual worth.</p>\n<p>开始精读：</p>\n<p>Such measures have a couple of <span class=\"mask\">[xxx]</span> motives. / They suggest beauty should not be defined by looks / that end up <span class=\"mask\">[xxx]</span> on health. / That’s a start. / And the ban on ultra-thin models seems to go beyond protecting models / from starving themselves to death—as some have done. / It tells the fashion industry / that it must take responsibility for the signal it sends women, especially teenage girls, / about the social tape-measure / they must use to determine their individual worth.</p>\n<p>顺着英文顺序读：</p>\n<p>这些措施有几个 <span class=\"mask\">[xxx]</span> 的动机 / 它们表明美不应由外表来定义 / 当这种外表最终 <span class=\"mask\">[xxx]</span> 健康时 / 这算一个开始 / 而禁止超瘦模特似乎还不只是在保护模特 / 避免她们把自己饿死——有些人确实如此 / 这在告诉时尚行业 / 它必须为自己向女性尤其是少女发出的信号负责 / 关于那把社会的衡量尺 / 她们被要求用它判断自己的个人价值</p>\n</blockquote>\n<p>整段关系已经落在“某类外表最终对健康产生什么作用”上，接下来逐项比较四种释义。</p>\n<h3>A. indicating the state of</h3>\n<blockquote>\n<p>表明……的状态</p>\n</blockquote>\n<p>把A接回题干，它说的是：impinging on表示“表明……的状态”。</p>\n<p>A里的“indicating the state”和原文“looks that end up”都要解释外表与健康之间的联系，因为选项把它理解成展示健康状态，原文句型则写外表最终对健康产生某种作用，所以回看第二段第二句。</p>\n<blockquote>\n<p>They suggest beauty should not be defined by looks that end up <span class=\"mask\">[xxx]</span> on health.</p>\n</blockquote>\n<p>原文“looks that end up”后面接的是一个落到health上的动作，句子整体在解释为什么不能只用外表定义美。A的“indicating the state”则是把外表当成健康状况的指示器，关系变成“外表显示健康”。</p>\n<p>两种关系的方向不同：原文从looks出发，对health造成某种后果；A则要求looks把health的状态呈现出来。前者是作用关系，后者是表征关系。</p>\n<p>如果这里只是“表明健康状态”，作者没有必要用end up这种结果结构，也难以解释前文为何把措施称为积极动机。句法位置已经说明遮挡词是落到健康上的动作，而不是state的展示。</p>\n<p><strong>“外表最终对健康产生某种作用”能改写成“外表表明健康状态”吗？</strong></p>\n<p>不能。原文是looks作用于health，A是looks显示health，两边关系方向不同。</p>\n<p>遮挡词即使不知道，end up和on health仍把它放在结果作用的位置，无法把这一结构改成indicating the state，所以A排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. heightening the value of</h3>\n<blockquote>\n<p>提高……的价值</p>\n</blockquote>\n<p>把B接回题干，它说的是：impinging on表示“提高……的价值”。</p>\n<p>B里的“heightening the value”和原文“beauty should not be defined by looks”都涉及作者如何评价外表与健康，因为选项说提高健康的价值，原文却在说明某些外表会对健康带来不利后果，所以回看第二段第二句。</p>\n<blockquote>\n<p>They suggest beauty should not be defined by looks that end up <span class=\"mask\">[xxx]</span> on health.</p>\n</blockquote>\n<p>原文“beauty should not be defined by looks”先否定只看外表的审美标准，后面的原因是这些looks最终会对health产生某种作用。B的“heightening the value”却表示让健康更有价值，是正向提升。</p>\n<p>原句的语境在讨论超瘦审美与挨饿风险，前后都指向健康受到损害，而不是健康价值被抬高。B把负面后果改成正面增值，也把动作对象从健康本身换成健康的价值。</p>\n<p>遮挡词虽然没读出，但它位于end up与on health之间，必须与“外表不应定义美”的理由一致。heightening the value无法解释这种否定性理由。</p>\n<p><strong>作者是在说超瘦外表提高健康价值，还是在说它会给健康带来问题？</strong></p>\n<p>后者。整句用这层健康后果反对只按外表定义美，B的正向“heightening”与句子理由相反。</p>\n<p>B还多加了the value这一抽象对象，原文只写health本身受到作用，因此B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. losing faith in</h3>\n<blockquote>\n<p>对……失去信心</p>\n</blockquote>\n<p>把C接回题干，它说的是：impinging on表示“对……失去信心”。</p>\n<p>C里的“losing faith in”和原文“on health”都把health放在关系末端，因为选项要求某人对健康失去信心，原文却让looks对健康产生作用，所以回看第二段第二句。</p>\n<blockquote>\n<p>They suggest beauty should not be defined by looks that end up <span class=\"mask\">[xxx]</span> on health.</p>\n</blockquote>\n<p>原文“on health”的前面主语来源是looks，意思是某类外表追求最终落到健康上。C的“losing faith in”通常需要一个人或群体作主体，表示对health不再相信。</p>\n<p>原句没有写谁的信念发生变化，也没有faith、trust或belief一类内容；它讨论的是身体审美造成的健康后果。C把客观作用关系改成心理态度关系。</p>\n<p>即使遮挡词含义暂时未知，主语looks与宾语health已经固定。looks不能像人一样“对健康失去信心”，主体条件本身就对不上。</p>\n<p><strong>原文中的looks能不能充当“losing faith in health”的心理主体？</strong></p>\n<p>不能。looks在原句中是造成后果的外表标准，不是拥有信念的人。</p>\n<p>C需要出现某个人对健康产生怀疑，原文没有这层主体和态度；遮挡词无法改变主语，因此C排除。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. doing <span class=\"mask\">[xxx]</span> to</h3>\n<blockquote>\n<p>对……造成 <span class=\"mask\">[xxx]</span></p>\n</blockquote>\n<p>把D接回题干，它说的是：impinging on表示“对……造成某种影响或伤害”。</p>\n<p>D里的“doing”和原文“end up”都把一个动作放在health之前，因为选项用do something to health改写，原文用looks end up doing something on health表达结果，所以回看第二段第二句。</p>\n<blockquote>\n<p>They suggest beauty should not be defined by looks that end up <span class=\"mask\">[xxx]</span> on health.</p>\n</blockquote>\n<p>原文“end up”后面的遮挡动作落在health上；D的“doing”后面同样留出一个遮挡动作，再用to接health。两边的结构都表示某种东西对健康产生作用。</p>\n<p>结合前后文，作者刚说这些措施有积极动机，接着解释不能让伤害健康的外表标准定义美。D没有把主体换成心理态度，也没有把方向改成提升价值，它保留了“对健康做了什么”这条核心关系。</p>\n<p>D中的具体名词被遮住，原文中的核心动作也被遮住，因此目前只能确认结构和语境一致，不能把遮挡部分擅自补全；但也看不到能把D排掉的主体、对象或方向冲突。</p>\n<p><strong>“looks end up对health产生某种作用”和“doing某事to health”能不能是同一层意思？</strong></p>\n<p>能。两种写法都把未知动作落在health上，并且都服务于“不能按伤害健康的外表定义美”这一理由。</p>\n<p>具体动作尚未读清，但D保留了原句的作用方向，没有加入相反关系，所以先保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>22题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮只留下D。另外三项都已经与当前读到的主体、动作、范围或方向出现明确冲突。</p>\n<h2>23题</h2>\n<blockquote>\n<p>Which of the following is true of the fashion industry?<br />\n关于时尚行业，下面哪一项是正确的？</p>\n</blockquote>\n<p>题干只给fashion industry，没有段号。粗读时好像记得第五段留下了“时尚行业”和“试图制定”这些碎片，因此先回到第五段完整读一遍。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>The fashion industry knows it has an <span class=\"mask\">[xxx]</span> problem in focusing on material <span class=\"mask\">[xxx]</span> and idealized body types. In Denmark, the United States, and a few other countries, it is trying to set <span class=\"mask\">[xxx]</span> standards for models and fashion images that rely more on peer pressure for enforcement.</p>\n<p>开始精读：</p>\n<p>The fashion industry knows / it has an <span class=\"mask\">[xxx]</span> problem / in focusing on material <span class=\"mask\">[xxx]</span> and idealized body types. / In Denmark, the United States, and a few other countries, / it is trying to set <span class=\"mask\">[xxx]</span> standards / for models and fashion images / that rely more on peer pressure for enforcement.</p>\n<p>顺着英文顺序读：</p>\n<p>时尚行业知道 / 它存在一个 <span class=\"mask\">[xxx]</span> 问题 / 即专注于物质 <span class=\"mask\">[xxx]</span> 和理想化体型 / 在丹麦、美国和另外少数国家 / 它正试图制定 <span class=\"mask\">[xxx]</span> 标准 / 针对模特和时尚图片 / 这些标准更多依靠同行压力来执行</p>\n</blockquote>\n<p>这一段同时写行业存在的问题和多个国家正在采用的做法，空格要从这些具体信息中选出真实的一项。</p>\n<h3>A. The French measures have already failed.</h3>\n<blockquote>\n<p>法国的措施已经失败。</p>\n</blockquote>\n<p>把A接回题干，它说的是：法国的措施已经失败。</p>\n<p>A里的“have already failed”和原文“it is trying to set”都在判断时尚行业应对身体审美问题的进展，因为选项宣布法国措施已经失败，原文则写多个国家仍在尝试制定标准，所以回看第五段第二句，并连同第一句一起看。</p>\n<blockquote>\n<p>In Denmark, the United States, and a few other countries, it is trying to set <span class=\"mask\">[xxx]</span> standards for models and fashion images that rely more on peer pressure for enforcement.</p>\n</blockquote>\n<p>原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。A的“have already failed”却给法国措施下了已经失败的完成性结论。时间状态一个是仍在尝试，一个是已经结束并失败。</p>\n<p>第五段承认行业存在问题，并介绍另一种依靠同行压力的标准，但没有回头报告法国法律执行后的结果。文章前一段只是批评法国惩罚过重，这不等于措施已经失败。</p>\n<p>A若成立，需要出现执行数据、撤销法律、目标没有实现或明确的failure判断。这里没有这些结果，只有对手段轻重的比较以及其他国家的进行中做法。</p>\n<p><strong>作者说法国办法用力过重，能不能直接写成“have already failed”？</strong></p>\n<p>不能。对方法的批评不等于已经发生的失败结果，时间和结论都被A提前了。</p>\n<p>第五段的“it is trying to set”还说明行业应对仍在推进，不能拿它证明法国措施已经失败，所以A排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. New standards are being set in Denmark.</h3>\n<blockquote>\n<p>丹麦正在制定新标准。</p>\n</blockquote>\n<p>把B接回题干，它说的是：丹麦正在制定新的行业标准。</p>\n<p>B里的“New standards are being set in Denmark”和原文“In Denmark”以及“trying to set”直接对应，因为选项把地点和正在制定标准这两个信息合在一起，所以回看第五段第二句。</p>\n<blockquote>\n<p>In Denmark, the United States, and a few other countries, it is trying to set <span class=\"mask\">[xxx]</span> standards for models and fashion images that rely more on peer pressure for enforcement.</p>\n</blockquote>\n<p>原文“In Denmark”给出地点，“trying to set”给出正在推进的动作，后面明确对象是standards for models and fashion images。B的“New standards are being set in Denmark”保留了地点、动作和对象。</p>\n<p>原文还提到美国和其他国家，B只摘出丹麦，并没有说只有丹麦这样做；把并列范围中的一个成员拿出来回答“关于时尚行业哪项正确”，并不改变原句。</p>\n<p>标准的具体性质被遮住，但B只说new standards，没有断言它们的具体内容。正在制定这一基本关系已经由trying to set明确写出。</p>\n<p><strong>“In Denmark”加“trying to set standards”能不能合成B的说法？</strong></p>\n<p>能。地点、动作和标准对象都能逐一接上。</p>\n<p>B没有把进行中改成已完成，也没有把同行压力写成消失；遮挡处只影响标准的具体性质，因此B保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. Models are no longer under peer pressure.</h3>\n<blockquote>\n<p>模特已经不再承受同行压力。</p>\n</blockquote>\n<p>把C接回题干，它说的是：模特已经不再承受同行压力。</p>\n<p>C里的“no longer under peer pressure”和原文“rely more on peer pressure”都直接谈peer pressure，因为选项说这种压力已经消失，原文说新标准更依赖它来执行，所以回看第五段末尾。</p>\n<blockquote>\n<p>In Denmark, the United States, and a few other countries, it is trying to set <span class=\"mask\">[xxx]</span> standards for models and fashion images that rely more on peer pressure for enforcement.</p>\n</blockquote>\n<p>原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。C的“no longer under peer pressure”则说模特已经不再处于这种压力之下。</p>\n<p>两边不只是程度不同，而是否定关系相反：原文增加依赖，C宣布压力不存在。即使peer pressure具体作用于设计师、机构或模特群体，C的no longer仍与“依赖它执行”无法同时成立。</p>\n<p>遮挡处修饰standards的性质，不会改变后面的rely more on peer pressure。决定方向的more与no longer都没有被遮住。</p>\n<p><strong>新标准更依赖同行压力执行，是否等于模特“no longer under peer pressure”？</strong></p>\n<p>不等于。原文是继续并加强使用这种压力，C是取消这种压力，方向相反。</p>\n<p>核心否定关系已经写明，遮挡词不能把more改成no longer，因此C排除。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. Its inherent problems are getting worse.</h3>\n<blockquote>\n<p>该行业固有的问题正在恶化。</p>\n</blockquote>\n<p>把D接回题干，它说的是：时尚行业固有的问题正在恶化。</p>\n<p>D里的“problems are getting worse”和原文“The fashion industry knows it has”都承认行业存在问题，因为选项进一步写问题正在恶化，原文只确认问题存在，所以回看第五段第一句。</p>\n<blockquote>\n<p>The fashion industry knows it has an <span class=\"mask\">[xxx]</span> problem in focusing on material <span class=\"mask\">[xxx]</span> and idealized body types.</p>\n</blockquote>\n<p>原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。D的“problems are getting worse”却增加了变化趋势，要求这个问题比以前更严重。</p>\n<p>存在问题与问题恶化不是同一判断。第五段没有过去与现在的对比，也没有增长、加剧或越来越严重的表达；后一句反而写行业正在尝试建立标准。</p>\n<p>D还把单数problem扩为复数problems，并用getting worse加入动态结果。即使遮挡词是inherent，也只能说明问题的性质，不能自动产生“正在恶化”的时间线。</p>\n<p><strong>“行业知道自己有问题”能不能直接推出这些problems are getting worse？</strong></p>\n<p>不能。原文只确认问题存在，D又补了恶化过程和程度变化。</p>\n<p>段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>23题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只留下B。另外三项都已经与当前读到的主体、动作、范围或方向出现明确冲突。</p>\n<h2>24题</h2>\n<blockquote>\n<p>A designer is most likely to be rejected by CFW for ______.<br />\n一名设计师最可能因为什么被哥本哈根时装周拒绝？</p>\n</blockquote>\n<p>题干点名CFW，这是很明确的对象坐标。先回到出现CFW的第六段，完整看清丹麦宪章管哪些因素、又怎样拒绝设计师进入。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>In contrast to France’s actions, Denmark’s fashion industry agreed last month on rules and <span class=\"mask\">[xxx]</span> regarding the age, health, and other characteristics of models. The newly <span class=\"mask\">[xxx]</span> Danish Fashion Ethical Charter clearly states: “We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.” The charter’s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute. But in general it relies on a name-and-shame method of <span class=\"mask\">[xxx]</span>.</p>\n<p>开始精读：</p>\n<p>In contrast to France’s actions, Denmark’s fashion industry agreed last month / on rules and <span class=\"mask\">[xxx]</span> regarding the age, health, and other characteristics of models. / The newly <span class=\"mask\">[xxx]</span> Danish Fashion Ethical Charter clearly states: / “We are aware of and take responsibility / for the impact the fashion industry has on body ideals, especially on young people.” / The charter’s main tool of enforcement / is to deny access for designers and modeling agencies / to Copenhagen Fashion Week (CFW), / which is run by the Danish Fashion Institute. / But in general it relies on a name-and-shame method of <span class=\"mask\">[xxx]</span>.</p>\n<p>顺着英文顺序读：</p>\n<p>与法国做法不同，丹麦时尚行业上个月达成一致 / 就模特年龄、健康和其他特征制定规则及 <span class=\"mask\">[xxx]</span> / 新近 <span class=\"mask\">[xxx]</span> 的《丹麦时尚道德宪章》明确写道 / “我们意识到并承担责任 / 针对时尚行业对身体审美尤其是年轻人的影响” / 该宪章主要的执行工具 / 是拒绝设计师和模特经纪机构进入 / 哥本哈根时装周 / 该活动由丹麦时尚学院运营 / 但总体上它依靠点名羞辱式的 <span class=\"mask\">[xxx]</span> 方法</p>\n</blockquote>\n<p>这一段把规则内容、责任要求和CFW的执行方式连在一起；下面检查每个选项是否真能成为设计师被拒绝的理由。</p>\n<h3>A. pursuing perfect physical conditions</h3>\n<blockquote>\n<p>追求完美的身体条件</p>\n</blockquote>\n<p>把A接回题干，它说的是：设计师会因为追求完美身体条件而被哥本哈根时装周拒绝。</p>\n<p>A里的“pursuing perfect physical conditions”和原文“age, health, and other characteristics”都涉及模特身体条件，因为选项写设计师追求完美身体，原文写丹麦规则审视年龄、健康等特征，所以回看第六段第一句和关于CFW执行工具的句子。</p>\n<blockquote>\n<p>In contrast to France’s actions, Denmark’s fashion industry agreed last month on rules and <span class=\"mask\">[xxx]</span> regarding the age, health, and other characteristics of models. ... The charter’s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.</p>\n</blockquote>\n<p>原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。A的“pursuing perfect physical conditions”却把违规动作写成追求完美身体条件。</p>\n<p>宪章反对的是时尚行业对身体审美造成有害影响，并要求承担责任；它没有把正常的健康状态或良好身体条件本身列为违规。A把“规则检查身体相关因素”改成“追求完美身体就会受罚”，对象与评价都发生偏移。</p>\n<p>若A成立，需要原文明确写设计师要求模特达到完美体形，且这种追求触发CFW拒绝。当前段落只写年龄、健康及其他特征的规则，没有perfect这一极端标准。</p>\n<p><strong>规则关注模特的年龄和健康，是否就等于拒绝所有“pursuing perfect physical conditions”的设计师？</strong></p>\n<p>不等于。关注健康因素是规则内容，追求完美身体是A另加的行为与评价。</p>\n<p>原文没有把“完美身体”写成拒绝条件，也没有出现设计师追求这一目标的动作，所以A排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. caring too much about models’ character</h3>\n<blockquote>\n<p>过分在意模特的品格</p>\n</blockquote>\n<p>把B接回题干，它说的是：设计师会因为过分在意模特的品格而被拒绝。</p>\n<p>B里的“models’ character”和原文“other characteristics of models”词形接近，因为选项把character理解成人格品格，原文却把characteristics与年龄、健康并列为模特特征，所以回看第六段第一句。</p>\n<blockquote>\n<p>In contrast to France’s actions, Denmark’s fashion industry agreed last month on rules and <span class=\"mask\">[xxx]</span> regarding the age, health, and other characteristics of models.</p>\n</blockquote>\n<p>原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。B的“models’ character”则指模特的性格或品格，是另一个更窄的概念。</p>\n<p>B还加入caring too much，要求设计师因为过分关注品格而受罚。原文没有写关注程度，更没有把人格评价列成拒绝CFW的原因；它讨论的是行业规则对模特条件和身体审美影响的约束。</p>\n<p>两个词看起来相似，但修饰关系不同：原文是characteristics of models，B是models’ character；一个可包含年龄、健康等客观特征，一个是人的品格。</p>\n<p><strong>“other characteristics of models”能不能直接缩成“models’ character”，再加上caring too much？</strong></p>\n<p>不能。characteristics与character不是这里的同一对象，B又增加了原文没有的过度关注动作。</p>\n<p>年龄和健康的并列关系已经排除了“人格品格”这一理解，遮挡处也不能改变这个并列结构，所以B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. showing little concern for <span class=\"mask\">[xxx]</span> factors</h3>\n<blockquote>\n<p>很少关心 <span class=\"mask\">[xxx]</span> 因素</p>\n</blockquote>\n<p>把C接回题干，它说的是：设计师很少关心某类与模特健康有关的因素，因此可能被CFW拒绝。</p>\n<p>C里的“showing little concern”和原文“take responsibility”都在判断时尚从业者是否认真对待其影响，因为选项写漠视，宪章要求承担责任，所以回看宪章声明以及CFW拒绝进入的执行句。</p>\n<blockquote>\n<p>The newly <span class=\"mask\">[xxx]</span> Danish Fashion Ethical Charter clearly states: “We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.” The charter’s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.</p>\n</blockquote>\n<p>原文“take responsibility”要求时尚行业意识到并承担自己对身体审美、尤其是年轻人的影响；C的“showing little concern”写的是设计师对相关因素缺少关心。两者正好构成遵守与不遵守的对照。</p>\n<p>执行工具是“deny access for designers and modeling agencies to CFW”，所以当设计师表现出对宪章关切事项的漠视时，被拒绝进入正能接上这套执行方式。C没有把处罚对象换掉，仍然是designer。</p>\n<p>C中被遮住的是具体因素名称，但题干与段首已经出现age和health，宪章又把责任落到body ideals和young people。即使暂时不知道遮挡词，little concern与take responsibility之间的方向清楚，也没有局部冲突。</p>\n<p><strong>宪章要求从业者take responsibility，设计师若showing little concern，能不能成为被拒绝进入CFW的理由？</strong></p>\n<p>能。漠视宪章要求承担的影响，正是执行规则时可以针对的不合规表现。</p>\n<p>具体因素被遮住，但C保留了责任方向、处罚对象和CFW执行方式，因此先保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. setting a high <span class=\"mask\">[xxx]</span> threshold for models</h3>\n<blockquote>\n<p>为模特设置很高的 <span class=\"mask\">[xxx]</span> 门槛</p>\n</blockquote>\n<p>把D接回题干，它说的是：设计师会因为给模特设置很高的某类门槛而被CFW拒绝。</p>\n<p>D里的“threshold for models”和原文“regarding the age”都在谈规则怎样给模特设定条件，因为选项写一项高门槛，原文写年龄等特征受规则约束，所以回看第六段第一句和CFW拒绝进入的执行句。</p>\n<blockquote>\n<p>In contrast to France’s actions, Denmark’s fashion industry agreed last month on rules and <span class=\"mask\">[xxx]</span> regarding the age, health, and other characteristics of models. ... The charter’s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.</p>\n</blockquote>\n<p>原文“regarding the age”表明宪章确实会管到模特年龄等条件，D的“threshold for models”也把问题写成设计师给模特设置某种准入条件。两边都可能落在模特门槛上。</p>\n<p>但原文只说有rules及被遮住的配套内容，没有说明年龄界线具体多高，也没有直接写“设置高门槛”这一违规动作。D中的high和threshold比原句更具体。</p>\n<p>目前这份材料既没有证实高门槛，也没有明确说门槛可以任意设置。因为被遮住的词位于threshold之前，可能正决定门槛类型；而CFW又确实以拒绝进入执行规则，所以还不能仅凭局部内容把D否掉。</p>\n<p><strong>原文写年龄规则并以CFW准入执行，能不能暂时容纳“threshold for models”这一说法？</strong></p>\n<p>还不能排除。原文确实把年龄等模特条件纳入规则，也确实允许拒绝设计师进入CFW；D只是把这层规则概括成某种门槛。</p>\n<p>high是否准确、遮挡处究竟是哪类门槛，当前段落没有完全交代，所以D也先保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>24题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮留下C和D。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n<h2>25题</h2>\n<p><strong>Which of the following may be the best title of the text?</strong></p>\n<p>下面哪一项可能是本文最佳标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>A Challenge to the Fashion Industry’s Body Ideals</strong></p>\n<p>对时尚行业身体审美观的挑战</p>\n<p>B. <strong>A Dilemma for the Starving Models in France</strong></p>\n<p>法国挨饿模特的困境</p>\n<p>C. <strong>Just Another Round of Struggle for Beauty</strong></p>\n<p>又一轮围绕美的斗争</p>\n<p>D. <strong>The Great Threats to the Fashion Industry</strong></p>\n<p>时尚行业面临的巨大威胁</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>写法国通过法律限制超瘦模特和鼓吹极端节食的网站，收回时尚行业独占女性审美定义的权力</td>\n  <td>先摆出一个出问题后的应对</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>肯定这些措施保护健康，并要求行业为传递给女性尤其少女的身体标准负责</td>\n  <td>再承认这种应对有积极作用</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>说明禁令还可能让个人不再把他人当成美的裁判，转而重视品格和智慧</td>\n  <td>接着把影响落到个人选择上</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>批评法国依靠严厉处罚改变文化，罚款和监禁力度过重</td>\n  <td>但是又说当前办法用力过猛</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力</td>\n  <td>然后转向另一种较温和的做法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行</td>\n  <td>然后说明这种做法怎样落地</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>主张道德劝导可能优于法律，更进一步还应把美的观念提升到行业物质标准之外</td>\n  <td>最后说还可以再往前一步</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个标题。把第三列单独留下，可以看到全文每一步都在为后面的处理办法服务。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n<h3>A. A Challenge to the Fashion Industry’s Body Ideals</h3>\n<blockquote>\n<p>对时尚行业身体审美观的挑战</p>\n</blockquote>\n<p>如果A是主旨，全文每一段都应当沿着A所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先写法国法律对超瘦审美进行限制，挑战行业原有的身体标准</td>\n  <td>先摆出一个出问题后的应对</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再写这种挑战怎样保护健康并要求行业承担影响责任</td>\n  <td>再承认这种应对有积极作用</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着写它怎样改变个人判断自身价值的方式</td>\n  <td>接着把影响落到个人选择上</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>承认法国的严厉法律手段可能过重，但挑战方向仍有必要</td>\n  <td>但是又说当前办法用力过猛</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>转向自愿标准和同行压力，展示另一种挑战旧审美的方法</td>\n  <td>然后转向另一种较温和的做法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>用丹麦宪章说明挑战可以通过行业规则和准入机制落地</td>\n  <td>然后说明这种做法怎样落地</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后把挑战推进到更广义的美，超越单一行业的物质身体标准</td>\n  <td>最后说还可以再往前一步</td>\n</tr>\n</tbody>\n</table>\n<p>A能覆盖全文。开头不是孤立处罚模特，而是在收回时尚行业独占女性外在美定义的权力；第二、三段把影响扩到健康、女性价值和个人审美裁判；后面又比较法国严厉法律与丹麦自愿规范，最后把目标推向超越行业物质标准的美。\n标题中的Challenge既能容纳法律禁令，也能容纳同行压力、道德劝导和观念提升。文章并不只赞成法国现有手段，第四段明确批评惩罚过重，但这种批评没有否定挑战旧身体审美的方向，反而寻找更合适的挑战方式。\n从篇幅看，七段始终围绕身体审美由谁定义、怎样纠偏以及用什么方式纠偏展开。A既覆盖问题，也覆盖作者对方法的修正和结尾的进一步主张。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>B. A Dilemma for the Starving Models in France</h3>\n<blockquote>\n<p>法国挨饿模特的困境</p>\n</blockquote>\n<p>如果B是主旨，全文每一段都应当沿着B所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先集中写法国挨饿模特遭遇的身体危险</td>\n  <td>先摆出一个出问题后的应对</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再写法律怎样直接救助这些挨饿模特</td>\n  <td>再承认这种应对有积极作用</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着追踪模特停止节食后的个人恢复</td>\n  <td>接着把影响落到个人选择上</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>但是又写处罚给模特带来的新困境</td>\n  <td>但是又说当前办法用力过猛</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>转向其他国家模特面临的相同饥饿问题</td>\n  <td>然后转向另一种较温和的做法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>具体写丹麦模特如何获得食物、治疗和工作保障</td>\n  <td>然后说明这种做法怎样落地</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后给法国挨饿模特提出进一步救助方案</td>\n  <td>最后说还可以再往前一步</td>\n</tr>\n</tbody>\n</table>\n<p>B只能覆盖第二段中“模特把自己饿死”的一个后果，无法解释文章为何讨论女性个人价值、丹麦行业宪章、CFW准入以及道德劝导。\n全文没有追踪一群法国挨饿模特的经历，也没有写治疗、救助或生存两难。模特挨饿是旧审美的严重例子，不是文章的全部中心。\n若标题真是法国挨饿模特的困境，后半篇应继续回到法国模特本身；实际却转向多个国家如何改变行业身体标准，范围明显更大。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>C. Just Another Round of Struggle for Beauty</h3>\n<blockquote>\n<p>又一轮围绕美的斗争</p>\n</blockquote>\n<p>如果C是主旨，全文每一段都应当沿着C所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先把法国措施写成又一轮围绕什么才算美的争夺</td>\n  <td>先摆出一个出问题后的应对</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再列出支持限制超瘦审美的一方理由</td>\n  <td>再承认这种应对有积极作用</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着写个人审美选择怎样进入争论</td>\n  <td>接着把影响落到个人选择上</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>但是又列出反对严厉处罚的一方理由</td>\n  <td>但是又说当前办法用力过猛</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>转向其他国家继续展开同一场美的争论</td>\n  <td>然后转向另一种较温和的做法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>具体写丹麦各方如何在争论中交锋</td>\n  <td>然后说明这种做法怎样落地</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后判断这一轮争论由哪一方获胜或将怎样继续</td>\n  <td>最后说还可以再往前一步</td>\n</tr>\n</tbody>\n</table>\n<p>C抓住了围绕美存在分歧，但“Just Another Round of Struggle”要求全文把重点放在双方反复争斗。文章没有安排两派人物交锋，也没有写这一轮斗争的胜负。\n作者的态度并非中性记录争论。他赞成改变超瘦身体审美，只是认为法国的严厉处罚不是最佳手段，因而转向丹麦的道德劝导和更广义的美。\nC的“another round”还暗示过去已有多轮同类争斗，原文没有提供这种历史线。它能沾到beauty，却不能解释全文明确的改革方向。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>D. The Great Threats to the Fashion Industry</h3>\n<blockquote>\n<p>时尚行业面临的巨大威胁</p>\n</blockquote>\n<p>如果D是主旨，全文每一段都应当沿着D所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先写法律如何威胁法国时尚行业的生存</td>\n  <td>先摆出一个出问题后的应对</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>再承认行业曾给社会带来某些积极价值</td>\n  <td>再承认这种应对有积极作用</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>接着写行业衰退怎样影响个人生活</td>\n  <td>接着把影响落到个人选择上</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>但是又写严厉法律造成更大经营危险</td>\n  <td>但是又说当前办法用力过猛</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>转向其他国家时尚行业遭遇的多重威胁</td>\n  <td>然后转向另一种较温和的做法</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>具体写丹麦行业如何抵御外部打击</td>\n  <td>然后说明这种做法怎样落地</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后列出行业仍将面对的巨大风险</td>\n  <td>最后说还可以再往前一步</td>\n</tr>\n</tbody>\n</table>\n<p>D把监管与改革写成行业遭受的巨大威胁，但文章并不担忧时尚行业会被摧毁。真正被批评的是行业长期强化物质外表和理想化体型。\n法国罚款、丹麦准入限制和点名方式都是纠偏工具，不是作者列举的行业生存危机。第五、六段还写行业主动制定标准、承担责任，说明它在参与改变，而不是被动抵御威胁。\n结尾要求把美提升到特定行业的物质标准之外，也不是替行业解除威胁。D改变了作者站位，无法覆盖全文。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>25题主旨结果</h3>\n<p>A能够同时解释法国禁令、对严厉处罚的保留、丹麦自愿规范以及结尾超越行业物质标准的主张；其余三项都把全文缩成单一受害者、抽象争斗或行业危机。</p>\n<blockquote>\n<p><strong>25题选A。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>A Challenge to the Fashion Industry’s Body Ideals / 对时尚行业身体审美观的挑战</strong></p>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保25题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查24题：C还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>C. showing little concern for <span class=\"mask\">[xxx]</span> factors</li>\n<li>D. setting a high <span class=\"mask\">[xxx]</span> threshold for models</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>A Challenge to the Fashion Industry’s Body Ideals / 对时尚行业身体审美观的挑战</strong></p>\n</blockquote>\n<p>也就是：全文的重点不是单独处罚某一种年龄门槛，而是挑战时尚行业用外在身体标准定义美，并要求行业真正承担对模特、年轻人和社会审美的影响；现在只拿这条新依据，检查第一次没有拉开的两项。</p>\n<p>第一遍读第六段时，C和D都能接到丹麦宪章与CFW准入。C抓住“take responsibility”与“showing little concern”的对立：设计师若漠视宪章要求关心的因素，可能被拒绝。D抓住“rules ... regarding the age”与“threshold for models”的联系：年龄规则可能表现为某种门槛。由于两项都有遮挡，而且段中没有直接解释具体门槛，第一次同时留下是合理的。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>把题干接回来，C说设计师因为很少关心某类因素而被CFW拒绝；D说设计师因为给模特设置很高的某类门槛而被拒绝。C需要的是“宪章要求行业关心并承担影响—漠视就不合规”这条责任链，D需要的是“宪章规定某个具体高门槛—设计师设置它就违规”这条门槛链。第六段明确写出前一条责任要求，却没有写出后一条门槛的高度和违规方向。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看C。全文主旨是挑战时尚行业的身体审美观，前文一直批评以外表、超瘦体形和物质标准衡量个人价值。丹麦宪章进一步要求行业意识到自己对body ideals和young people的影响并承担责任。若设计师对健康等相关因素缺少关心，他正是在延续被全文挑战的审美方式；CFW拒绝准入就成为这场挑战的具体执行。因此C既能接回局部责任要求，也直接服务全文中心。</p>\n<p>再看D。若D要由主旨支持，高年龄门槛本身必须是全文批判身体审美的一个明确表现，例如只允许某个年龄以上或以下的模特参与，并且作者要把这种门槛写成有害的身体标准。但全文没有讨论年龄门槛高低，更没有说“高”本身就是问题。age只是丹麦规则关注的多个特征之一，D把一个可能的规则细节扩大成具体拒绝原因，无法与全文反复出现的健康、身体理想和责任形成稳定连接。</p>\n<p>回到第一次局部证据，D因为age与threshold仍有表面连接而被保留；主旨加入以后，两项的覆盖力拉开了。C说明设计师为什么违背整篇文章要推动的责任方向，D只保留一个未被写明的技术性门槛。C同时通过局部责任链和全文身体审美中心，D只能依靠一种可能解释。</p>\n<blockquote>\n<p><strong>24题选C。</strong></p>\n</blockquote>\n<h1>5. 最终答案</h1>\n<ul>\n<li><strong>21题：A</strong> — Physical beauty would be <span class=\"mask\">[xxx]</span>.（外在美会被 <span class=\"mask\">[xxx]</span>。）</li>\n<li><strong>22题：D</strong> — doing <span class=\"mask\">[xxx]</span> to（对……造成 <span class=\"mask\">[xxx]</span>）</li>\n<li><strong>23题：B</strong> — New standards are being set in Denmark.（丹麦正在制定新标准。）</li>\n<li><strong>24题：C</strong> — showing little concern for <span class=\"mask\">[xxx]</span> factors（很少关心 <span class=\"mask\">[xxx]</span> 因素）</li>\n<li><strong>25题：A</strong> — A Challenge to the Fashion Industry’s Body Ideals（对时尚行业身体审美观的挑战）</li>\n</ul>\n<p>本篇答案：<strong>ADBCA</strong>。</p>\n","analysisStartIndex":38,"ma
