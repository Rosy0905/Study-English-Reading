s better meets challenges”和原文“better to be more aggressive”直接使用相同的比较方向，因为选项概括积极行动更能应对挑战，原文在变化情境中明确说更积极比不积极好，所以回看最后一句。\u003c/p>\n\u003cp>原文“better to be more aggressive”给出作者清楚的行动判断：遇到市场和世界变化造成的不合理做法，应当更积极。C的“aggressiveness better meets challenges”把这一判断概括为积极果断更适合应对挑战。\u003c/p>\n\u003cp>选项中的challenges对应前一句的questions以及旧做法don’t make sense；better meets对应原文better to be。主体、情境和比较方向都没有改变。\u003c/p>\n\u003cp>C没有把more aggressive夸大成无条件冒险，而是保留“在变化世界中应对问题”这一条件，因此可以直接接回题干。\u003c/p>\n\u003cp>C只是把原句的情境和行动偏好换成更概括的表达，方向完全一致。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In those situations, it&#39;s better to be more aggressive than less aggressive.&quot;\u003c/p>\n\u003cp>佩雷蒂承认传统业务调整困难，又说市场变化会使现有做法失去合理性，因此应更主动而非更保守。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>When existing practices cease to make sense, a more aggressive response is preferable.\u003c/p>\n\u003cp>既有做法不再合理时，更积极的应对方式更可取。\u003c/p>\n\u003c/blockquote>\n\u003cp>先判断原有做法不再适应，再建议积极应对，既对应情境条件，也保留more than的相对力度。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨本身是一项主动调整产品的建议；题干应把变化与应对行动相连，具体力度由more aggressive than less aggressive决定。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>aggressiveness better meets challenges\u003cbr>积极进取更能应对挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>最后一段没有相反限制，也没有把积极行动缩回谨慎等待，因此C保留。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. legacy businesses are becoming outdated\u003c/h3>\n\u003cblockquote>\n\u003cp>传统业务正在过时\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“legacy businesses are becoming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个传统业务正在过时，原文只说某些正在做的事情会变得不合理，所以回看最后一段中间。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。D的“legacy businesses are becoming outdated”却把判断扩大到整个传统业务正在过时。\u003c/p>\n\u003cp>范围和趋势都被D扩大，最后一段没有支持这种整体结论，所以D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>佩雷蒂认为，在变化的世界中，传统业务正在过时。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“legacy businesses are becoming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个传统业务正在过时，原文只说某些正在做的事情会变得不合理，所以回看最后一段中间。\u003c/p>\n\u003cp>原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。D的“legacy businesses are becoming outdated”却把判断扩大到整个传统业务正在过时。\u003c/p>\n\u003cp>佩雷蒂并没有主张传统业务一律消失。前文恰恰提出把纸质版做成高价保留产品，让传统业务以另一种方式继续存在。D的整体淘汰判断与这种重定位思路不一致。\u003c/p>\n\u003cp>原文说的是某些行为在特定变化下失去合理性，D加入becoming的持续趋势，又把部分做法上升为整个业务类别。\u003c/p>\n\u003cp>原文针对部分做法，D针对整个业务；原文允许重新定位后继续，D则宣布整体过时。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes.\u003c/p>\n\u003cp>佩雷蒂承认传统业务调整困难，又说市场变化会使现有做法失去合理性，因此应更主动而非更保守。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>All legacy businesses are becoming obsolete and should be abandoned.\u003c/p>\n\u003cp>所有旧有业务都在过时，应被放弃。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文说某些做法会不合时宜，不说所有传统业务都过时。前文还提供让传统纸报继续创造价值的调整方案。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨本身是一项主动调整产品的建议；题干应把变化与应对行动相连，具体力度由more aggressive than less aggressive决定。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>legacy businesses are becoming outdated\u003cbr>传统业务正在过时\u003c/p>\n\u003c/blockquote>\n\u003cp>范围和趋势都被D扩大，最后一段没有支持这种整体结论，所以D排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>39题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>39. C. aggressiveness better meets challenges\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。\u003c/p>\n\u003cp>B：原文“more aggressive than less aggressive”直接比较两种行动方式，并选择更积极的一边。\u003c/p>\n\u003cp>C：原文“better to be more aggressive”给出作者清楚的行动判断：遇到市场和世界变化造成的不合理做法，应当更积极。\u003c/p>\n\u003cp>D：原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：印刷版终将消失的必然性\u003c/strong>（段落1引入话题） 《纽约时报》终将停止印刷版 → 具体时间仍在争论（2010年出版商：未来某时）\u003c/p>\n\u003cp>↓（现实压力）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：抛弃印刷版的充分理由\u003c/strong>（段落2分析现状） 动机充分：【基础设施成本高昂（印刷机、送货卡车）+ 在线竞争对手无此负担 → 显得过度】+ 读者流失 + 印刷广告收入下降（虽仍超过在线广告）\u003c/p>\n\u003cp>//（转折观点）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：Peretti的战略建议\u003c/strong>（段落3-4核心观点） 不应匆忙取消印刷版 → 需要正确方式：【加速转型有意义 // 但突然中断会失去最忠诚客户】\u003c/p>\n\u003cp>↓（具体策略）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：将印刷版转化为&quot;传承产品&quot;\u003c/strong>（段落5-6详细方案） Netflix案例：停止DVD服务专注流媒体（当时被视为失误 → 实则有远见）→ Peretti的方案：【不设定结束日期 + 提高价格 → 变成传承产品】→ 实施细节：（忠诚客户愿意为信仰买单 + 每年涨价产生额外收入 + 为着迷者制作）→ 现状：《纽约时报》可能已在实施（印刷版年费500美元，是数字版两倍多）\u003c/p>\n\u003cp>↓（深层思考）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：面对变化的积极态度\u003c/strong>（段落7总结升华） BuzzFeed无传统业务是奢侈 → 但终将面临类似问题：（当市场和世界变化时，某些做法不再有意义）→ 核心观点：【面对变化，积极进取胜过保守】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：面对印刷版必然消亡的趋势，《纽约时报》不应匆忙取消，而应将其转化为高价&quot;传承产品&quot;，服务最忠诚的客户，在变革中采取积极而非保守的策略。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. A Lesson from a Change Once Called a Mistake\u003c/p>\n\u003cp>B. A Deadline Is Not a Transition Strategy\u003c/p>\n\u003cp>C. Decisive Action Without a Universal Formula\u003c/p>\n\u003cp>D. Treating Nostalgia as a Complete Business Plan\u003c/p>\n\u003cp>E. Keeping Mass Print Cheap Forever\u003c/p>\n\u003cp>F. Why the Old Cost Structure Is Hard to Defend\u003c/p>\n\u003cp>G. Rethinking What Loyal Readers Pay For\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>Producing a printed newspaper involves a physical system that a digital competitor does not have to reproduce. Presses, vehicles and distribution networks cost money even as readers move elsewhere. Advertising income may still be substantial, but its size does not remove a downward trend. The difficulty is therefore structural: an expensive way of reaching a shrinking audience has to justify itself against alternatives with a different set of constraints.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>Recognising that print may eventually disappear does not answer the question of what to do tomorrow. An abrupt closure can drive away customers who remain willing to pay for the product. Their loyalty has value during a transition. Management consequently needs more than a date written on a calendar. It must decide how to reduce dependence on print while preserving the relationships and income that still make the older business useful.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>A printed edition can be offered as a product for people who particularly value it, rather than as the cheapest route to the widest audience. Higher prices may allow loyal readers to feel they are supporting journalism they trust. The purpose is not merely to charge more for the same habit. It is to reposition the product around a smaller group’s willingness to sustain quality, and to obtain revenue on that basis.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>A business change can initially appear foolish because observers judge it by the habits it disrupts. Later, the same decision may seem sensible because it prepared the company for a different market. An example of this pattern cannot prove that every newspaper should copy another company. It can nevertheless challenge the assumption that upsetting existing customers automatically makes a change wrong. Managers must compare the immediate reaction with the future the decision is meant to address.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>The difficulty of changing an inherited business does not disappear once a promising idea is found. Prices, audience preferences and the pace of digital growth still differ from company to company. Yet uncertainty is not a reason for permanent hesitation. When the market no longer supports familiar practices, managers should be willing to act decisively. The lesson concerns the willingness to adapt, rather than a single date or pricing rule that every publisher must adopt.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>\u003cstrong>答案：F. Why the Old Cost Structure Is Hard to Defend / 旧成本结构为何难以维持\u003c/strong>\u003c/p>\n\u003cp>说明物理基础设施、读者迁移和收入下降构成结构压力。\u003c/p>\n\u003cblockquote>\n\u003cp>Producing a printed newspaper involves a physical system that a digital competitor does not have to reproduce.\u003c/p>\n\u003cp>The difficulty is therefore structural: an expensive way of reaching a shrinking audience has to justify itself against alternatives with a different set of constraints.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明物理基础设施、读者迁移和收入下降构成结构压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>Old Cost Structure对应印刷、车辆与配送网络，Hard to Defend对应读者转移、收入下降后这套高成本体系难以证明其价值。\u003c/p>\n\u003cp>最强干扰项D（Treating Nostalgia as a Complete Business Plan）容易因相同话题进入考虑。但怀旧在这里没有解决成本与受众变化，不能替代结构分析。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>\u003cstrong>答案：B. A Deadline Is Not a Transition Strategy / 期限不是转型策略\u003c/strong>\u003c/p>\n\u003cp>区分最终退出判断与具体转型策略，强调忠实客户风险。\u003c/p>\n\u003cblockquote>\n\u003cp>Recognising that print may eventually disappear does not answer the question of what to do tomorrow.\u003c/p>\n\u003cp>It must decide how to reduce dependence on print while preserving the relationships and income that still make the older business useful.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>区分最终退出判断与具体转型策略 → 强调忠实客户风险。\u003c/p>\n\u003c/blockquote>\n\u003cp>Deadline对应在日历上指定停印日期，Transition Strategy对应既降低纸报依赖又保存客户与收入；标题区分什么时候结束与怎样过渡。\u003c/p>\n\u003cp>最强干扰项E（Keeping Mass Print Cheap Forever）容易因相同话题进入考虑。但保留客户不等于承诺永远低价维持大众纸报；中心是转型方式。\u003c/p>\n\u003cp>\u003cstrong>42题选B。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>\u003cstrong>答案：G. Rethinking What Loyal Readers Pay For / 重新考虑忠实读者为何付费\u003c/strong>\u003c/p>\n\u003cp>提出用定价和忠实读者对质量的支持重设纸报价值。\u003c/p>\n\u003cblockquote>\n\u003cp>A printed edition can be offered as a product for people who particularly value it, rather than as the cheapest route to the widest audience.\u003c/p>\n\u003cp>It is to reposition the product around a smaller group’s willingness to sustain quality, and to obtain revenue on that basis.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出用定价和忠实读者对质量的支持重设纸报价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>Loyal Readers对应特别重视纸质产品的顾客，Pay For对应他们为偏好体验及可信新闻质量付费；Rethinking抓住产品从大众低价转向特定价值的重置。\u003c/p>\n\u003cp>最强干扰项E（Keeping Mass Print Cheap Forever）容易因相同话题进入考虑。但本段明确提高价格、服务特定群体，方向与永久廉价大众化相反。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>\u003cstrong>答案：A. A Lesson from a Change Once Called a Mistake / 从一度被视为失误的转向中学习\u003c/strong>\u003c/p>\n\u003cp>用最初误判与后来评价的反差说明变化可有长远价值。\u003c/p>\n\u003cblockquote>\n\u003cp>A business change can initially appear foolish because observers judge it by the habits it disrupts.\u003c/p>\n\u003cp>Managers must compare the immediate reaction with the future the decision is meant to address.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>用最初误判与后来评价的反差说明变化可有长远价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>Once Called a Mistake对应最初被看作愚蠢的决定，Lesson from a Change对应日后发现它为新市场作了准备；标题保留评价随时间变化的对照。\u003c/p>\n\u003cp>最强干扰项D（Treating Nostalgia as a Complete Business Plan）容易因相同话题进入考虑。但段落要求比较未来市场，不是凭旧习惯或怀旧决定策略。\u003c/p>\n\u003cp>\u003cstrong>44题选A。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>\u003cstrong>答案：C. Decisive Action Without a Universal Formula / 果断行动并不等于通用公式\u003c/strong>\u003c/p>\n\u003cp>承认旧业务转型困难，以因地制宜而果断应对收束。\u003c/p>\n\u003cblockquote>\n\u003cp>The difficulty of changing an inherited business does not disappear once a promising idea is found.\u003c/p>\n\u003cp>The lesson concerns the willingness to adapt, rather than a single date or pricing rule that every publisher must adopt.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>承认旧业务转型困难 → 以因地制宜而果断应对收束。\u003c/p>\n\u003c/blockquote>\n\u003cp>Decisive Action对应市场不再支持旧做法时果断改变，Without a Universal Formula对应不能机械规定所有公司同一天停印或采用同一价格。\u003c/p>\n\u003cp>最强干扰项B（A Deadline Is Not a Transition Strategy）容易因相同话题进入考虑。但期限确实不足，但本段总结的是面对市场变化的行动态度。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>A newspaper may accept that its future is increasingly digital and still keep printing today. This is not necessarily a contradiction. The useful question is how to move from a declining model toward a more sustainable one without destroying value that remains in the existing business.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>A disputed move is not automatically a wise one, of course. An example supplies a reason to examine the future, not a licence to ignore customers. Managers must connect a change to actual market conditions and the value their own product offers. Copying the surface of another company’s decision is insufficient.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>Choosing that moment and method requires attention to loyal subscribers. Some still strongly prefer the printed product and are prepared to pay for it. An abrupt end would break that relationship at once. A gradual change may retain its value while allowing the publisher to reduce its dependence on mass print.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Support for quality can matter to readers as well as publishers. A subscriber may see the extra payment as helping journalism that deserves to continue. The arrangement thus combines a preferred reading experience with a sense of contribution. Its success depends on making both forms of value credible.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>A gradual change need not mean leaving the product unchanged. The publisher might raise its price and treat it as a special offering for its most committed readers. Under this approach, a smaller audience becomes a source of support for quality rather than proof that the product has no possible future.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>Those two forms of value will not persuade everyone. Some customers will leave, and early criticism may be sharp. The possibility of such a reaction makes examples from other industries useful: they can show that a disputed move sometimes prepares a business for a future its critics have not yet accepted.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>The existing business carries costs that digital rivals can avoid. Printing presses and delivery systems must be maintained while audiences and advertisers shift their attention. These pressures explain the wish to leave print behind. They do not, by themselves, identify the best moment or method for doing so.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>Actual market conditions should therefore guide the pace and form of action. A print business need not be defended unchanged, nor ended merely to display determination. Its remaining value can be reworked while digital operations develop. The essential requirement is a readiness to act when familiar arrangements no longer make sense.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出转型如何保存现有价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>限定例证用途，拒绝机械照搬\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>引入忠实订户与渐进策略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>解释忠实读者为何接受更高价格\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>以价格和产品定位具体化渐进变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>承认顾客流失并引出跨行业例证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>解释离开纸报的成本压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>回到因市场而调整的整体策略\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出转型如何保存现有价值 → 解释离开纸报的成本压力 → 引入忠实订户与渐进策略 → 以价格和产品定位具体化渐进变化 → 解释忠实读者为何接受更高价格 → 承认顾客流失并引出跨行业例证 → 限定例证用途，拒绝机械照搬 → 回到因市场而调整的整体策略\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → G → C → E → D → F → B → H\u003c/strong>\u003c/p>\n\u003cp>41—45：G、C、D、F、B。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41位于全文第2个位置，完整衔接是A → G → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The useful question is how to move from a declining model toward a more sustainable one without destroying value that remains in the existing business.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The existing business carries costs that digital rivals can avoid.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Choosing that moment and method requires attention to loyal subscribers.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>the existing business\u003c/code>，G继续处理这一对象，完成“解释离开纸报的成本压力”。到本段末尾，讨论又落到\u003ccode>best moment or method\u003c/code>，这正好为下一段“引入忠实订户与渐进策略”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出转型如何保存现有价值 → 解释离开纸报的成本压力 → 引入忠实订户与渐进策略\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“引入忠实订户与渐进策略”。它也属于同一论题，但若直接放在这里，就会跳过“解释离开纸报的成本压力”这一必要环节；其段首“Choosing that moment and method requires attention to loyal subscribers.”需要的前提与A当前收束的对象不一致，后续也接不出C所需的\u003ccode>best moment or method\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42位于全文第3个位置，完整衔接是G → C → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>They do not, by themselves, identify the best moment or method for doing so.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Choosing that moment and method requires attention to loyal subscribers.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A gradual change need not mean leaving the product unchanged.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>best moment or method\u003c/code>，C继续处理这一对象，完成“引入忠实订户与渐进策略”。到本段末尾，讨论又落到\u003ccode>gradual change\u003c/code>，这正好为下一段“以价格和产品定位具体化渐进变化”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释离开纸报的成本压力 → 引入忠实订户与渐进策略 → 以价格和产品定位具体化渐进变化\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选G的功能是“解释离开纸报的成本压力”。它也属于同一论题，但若直接放在这里，就会跳过“引入忠实订户与渐进策略”这一必要环节；其段首“The existing business carries costs that digital rivals can avoid.”需要的前提与G当前收束的对象不一致，后续也接不出E所需的\u003ccode>gradual change\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43位于全文第5个位置，完整衔接是E → D → F。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Under this approach, a smaller audience becomes a source of support for quality rather than proof that the product has no possible future.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Support for quality can matter to readers as well as publishers.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those two forms of value will not persuade everyone.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>support for quality\u003c/code>，D继续处理这一对象，完成“解释忠实读者为何接受更高价格”。到本段末尾，讨论又落到\u003ccode>both forms of value\u003c/code>，这正好为下一段“承认顾客流失并引出跨行业例证”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以价格和产品定位具体化渐进变化 → 解释忠实读者为何接受更高价格 → 承认顾客流失并引出跨行业例证\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“承认顾客流失并引出跨行业例证”。它也属于同一论题，但若直接放在这里，就会跳过“解释忠实读者为何接受更高价格”这一必要环节；其段首“Those two forms of value will not persuade everyone.”需要的前提与E当前收束的对象不一致，后续也接不出F所需的\u003ccode>both forms of value\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选D。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44位于全文第6个位置，完整衔接是D → F → B。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段D的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Its success depends on making both forms of value credible.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Those two forms of value will not persuade everyone.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A disputed move is not automatically a wise one, of course.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>both forms of value\u003c/code>，F继续处理这一对象，完成“承认顾客流失并引出跨行业例证”。到本段末尾，讨论又落到\u003ccode>a disputed move\u003c/code>，这正好为下一段“限定例证用途，拒绝机械照搬”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释忠实读者为何接受更高价格 → 承认顾客流失并引出跨行业例证 → 限定例证用途，拒绝机械照搬\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“解释忠实读者为何接受更高价格”。它也属于同一论题，但若直接放在这里，就会跳过“承认顾客流失并引出跨行业例证”这一必要环节；其段首“Support for quality can matter to readers as well as publishers.”需要的前提与D当前收束的对象不一致，后续也接不出B所需的\u003ccode>a disputed move\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45位于全文第7个位置，完整衔接是F → B → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The possibility of such a reaction makes examples from other industries useful: they can show that a disputed move sometimes prepares a business for a future its critics have not yet accepted.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A disputed move is not automatically a wise one, of course.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Actual market conditions should therefore guide the pace and form of action.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a disputed move\u003c/code>，B继续处理这一对象，完成“限定例证用途，拒绝机械照搬”。到本段末尾，讨论又落到\u003ccode>actual market conditions\u003c/code>，这正好为下一段“回到因市场而调整的整体策略”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>承认顾客流失并引出跨行业例证 → 限定例证用途，拒绝机械照搬 → 回到因市场而调整的整体策略\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“承认顾客流失并引出跨行业例证”。它也属于同一论题，但若直接放在这里，就会跳过“限定例证用途，拒绝机械照搬”这一必要环节；其段首“Those two forms of value will not persuade everyone.”需要的前提与F当前收束的对象不一致，后续也接不出H所需的\u003ccode>actual market conditions\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>adaptability\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>适应能力\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：创新、开拓、与时俱进\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sustainable business development\u003c/td>\n\u003ctd>可持续的企业发展\u003c/td>\n\u003ctd>社会现象类：企业经营\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>product quality\u003c/td>\n\u003ctd>产品质量\u003c/td>\n\u003ctd>社会现象类：消费因素\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>long-term thinking\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>长远思考\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：批判、独立、全局思维\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>customer trust\u003c/td>\n\u003ctd>顾客信任\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decisive action\u003c/td>\n\u003ctd>果断行动\u003c/td>\n\u003ctd>人生哲理类：创新、开拓、与时俱进\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>digital innovation\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>数字创新\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类：科技发展\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>responsible decision-making\u003c/td>\n\u003ctd>负责任的决策\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>valuable reading experiences\u003c/td>\n\u003ctd>有价值的阅读体验\u003c/td>\n\u003ctd>社会现象类：阅读\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture places an established practice beside a rapidly changing market.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画将既有做法与快速变化的市场并列呈现。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is trying to preserve a valued product while adapting to new demands.\u003c/td>\n\u003ctd>A正一边保存有价值的产品，一边适应新需求。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene contrasts passive hesitation with a willingness to change.\u003c/td>\n\u003ctd>画面对比了消极犹豫与主动改变的意愿。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Revenue from A declined while income from B continued to rise.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>A带来的收入下降，而B带来的收入继续增加。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The cost of A was more than twice that of B.\u003c/td>\n\u003ctd>A的费用是B的两倍以上。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures show customers gradually moving from A to B.\u003c/td>\n\u003ctd>这些数字显示顾客逐渐从A转向B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage considers how an established business should respond to a changing market.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文探讨成熟企业应如何应对市场变化。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author warns against confusing an eventual change with an immediate shutdown.\u003c/td>\n\u003ctd>作者提醒不要把最终转变等同于立即停业。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The example illustrates a decision that first appeared mistaken but later proved far-sighted.\u003c/td>\n\u003ctd>该例说明一个最初看似错误、后来却显出远见的决定。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":8},{"label":"句内逻辑","index":36},{"label":"长难句手译","index":39},{"label":"第三鸟 · 题目复盘","index":58},{"label":"40题","index":59},{"label":"36题","index":69},{"label":"37题","index":87},{"label":"38题","index":105},{"label":"39题","index":123},{"label":"第四鸟 · 新题型","index":141},{"label":"小标题题","index":141},{"label":"排序题","index":147},{"label":"第五鸟 · 写作积累","index":153}];
const allIndices = [0,1,2,3,4,5,6,7,11,15,19,23,27,31,35,36,37,38,39,45,51,57,58,59,61,63,65,67,68,69,73,77,81,85,86,87,91,95,99,103,104,105,109,113,117,121,122,123,127,131,135,139,140,141,142,143,144,145,146,147,148,149,150,151,152,153,154];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
