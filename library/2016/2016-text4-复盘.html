。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Traditional luxury businesses can remain untouched by changes in the market.\n>\n> 传统奢侈品业务可不受市场变化的影响。\n\n不受影响应把奢侈业务排除在市场变化之外。实际说每家企业都会面对做法不再合理的问题，luxury形容没有历史包袱这一条件。","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"39","option":"A"},"focusId":"focus-q39-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-A-0\">\u003cblockquote>\n\u003cp>传统奢侈品可以不受影响\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。A的“stay unaffected”却说传统奢侈品可以完全不受影响。\u003c/p>\n\u003cp>最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>佩雷蒂认为，在变化的世界中，传统奢侈品可以不受影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。\u003c/p>\n\u003cp>原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。A的“stay unaffected”却说传统奢侈品可以完全不受影响。\u003c/p>\n\u003cp>佩雷蒂之所以提出涨价、重定位和更积极行动，正是因为维持原状不再合理。A若成立，最后一段无需讨论如何面对变化。\u003c/p>\n\u003cp>最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。\u0 ming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个传统业务正在过时，原文只说某些正在做的事情会变得不合理，所以回看最后一段中间。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。D的“legacy businesses are becoming outdated”却把判断扩大到整个传统业务正在过时。\u003c/p>\n\u003cp>范围和趋势都被D扩大，最后一段没有支持这种整体结论，所以D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>佩雷蒂认为，在变化的世界中，传统业务正在过时。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“legacy businesses are becoming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个传统业务正在过时，原文只说某些正在做的事情会变得不合理，所以回看最后一段中间。\u003c/p>\n\u003cp>原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。D的“legacy businesses are becoming outdated”却把判断扩大到整个传统业务正在过时。\u003c/p>\n\u003cp>佩雷蒂并没有主张传统业务一律消失。前文恰恰提出把纸质版做成高价保留产品，让传统业务以另一种方式继续存在。D的整体淘汰判断与这种重定位思路不一致。\u003c/p>\n\u003cp>原文说的是某些行为在特定变化下失去合理性，D加入becoming的持续趋势，又把部分做法上升为整个业务类别。\u003c/p>\n\u003cp>原文针对部分做法，D针对整个业务；原文允许重新定位后继续，D则宣布整体过时。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. legacy businesses are becoming outdated","level":4,"raw":"#### 写作视角法\n\n原文第7段是这样写的：\n\n> \"But we're going to have questions like that where we have things we're doing that don't make sense when the market changes and the world changes.\n>\n> 佩雷蒂承认传统业务调整困难，又说市场变化会使现有做法失去合理性，因此应更主动而非更保守。\n\n把这一处放回全文，它承担的写作任务是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果D真是作者的意思，文章至少得写成：\n\n> All legacy businesses are becoming obsolete and should be abandoned.\n>\n> 所有旧有业务都在过时，应被放弃。\n\n原文说某些做法会不合时宜，不说所有传统业务都过时。前文还提供让传统纸报继续创造价值的调整方案。","context":{"mode":"image","asset":"questions","focus":[250,2191,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"39","option":"D"},"focusId":"focus-q39-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-D-0\">\u003cblockquote>\n\u003cp>传统业务正在过时\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“legacy businesses are becoming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个传统业务正在过时，原文只说某些正在做的事情会变得不合理，所以回看最后一段中间。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。D的“legacy businesses are becoming outdated”却把判断扩大到整个传统业务正在过时。\u003c/p>\n\u003cp>范围和趋势都被D扩大，最后一段没有支持这种整体结论，所以D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>佩雷蒂认为，在变化的世界中，传统业务正在过时。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“legacy businesses are becoming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个传统业务正在过时，原文只说某些正在做的事情会变得不合理，所以回看最后一段中间。\u003c/p>\n\u003cp>原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。D的“legacy businesses are becoming outdated”却把判断扩大到整个传统业务正在过时。\u003c/p>\n\u003cp>佩雷蒂并没有主张传统业务一律消失。前文恰恰提出把纸质版做成高价保留产品，让传统业务以另一种方式继续存在。D的整体淘汰判断与这种重定位思路不一致。\u003c/p>\n\u003cp>原文说的是某些行为在特定变化下失去合理性，D加入becoming的持续趋势，又把部分做法上升为整个业务类别。\u003c/p>\n\u003cp>原文针对部分做法，D针对整个业务；原文允许重新定位后继续，D则宣布整体过时。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes.\u003c/p>\n\u003cp>佩雷蒂承认传统业务调整困难，又说市场变化会使现有做法失去合理性，因此应更主动而非更保守。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>All legacy businesses are becoming obsolete and should be abandoned.\u003c/p>\n\u003cp>所有旧有业务都在过时，应被放弃。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文说某些做法会不合时宜，不说所有传统业务都过时。前文还提供让传统纸报继续创造价值的调整方案。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. legacy businesses are becoming outdated","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Make Your Print Newspaper a Luxury Good  \n> 把纸质报纸做成奢侈品\n\n把这个主旨直接代入39题题干：\n\n> 主旨本身是一项主动调整产品的建议；题干应把变化与应对行动相连，具体力度由more aggressive than less aggressive决定。\n\nD实际说的是：\n\n> legacy businesses are becoming outdated  \n> 传统业务正在过时\n\n范围和趋势都被D扩大，最后一段没有支持这种整体结论，所以D排除。\n\n从全文推进看，这一处的作用是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,2191,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"39","option":"D"},"focusId":"focus-q39-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-D-0\">\u003cblockquote>\n\u003cp>传统业务正在过时\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“legacy businesses are becoming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个 d be abandoned.\u003c/p>\n\u003cp>所有旧有业务都在过时，应被放弃。\u003c/p>\n\u003c/blockquote>\n\u003cp>原文说某些做法会不合时宜，不说所有传统业务都过时。前文还提供让传统纸报继续创造价值的调整方案。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q39-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨本身是一项主动调整产品的建议；题干应把变化与应对行动相连，具体力度由more aggressive than less aggressive决定。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>legacy businesses are becoming outdated\u003cbr>传统业务正在过时\u003c/p>\n\u003c/blockquote>\n\u003cp>范围和趋势都被D扩大，最后一段没有支持这种整体结论，所以D排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"39题结论","level":2,"raw":"### 39题结论\n\n> **39. C. aggressiveness better meets challenges**\n\nA：原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。\n\nB：原文“more aggressive than less aggressive”直接比较两种行动方式，并选择更积极的一边。\n\nC：原文“better to be more aggressive”给出作者清楚的行动判断：遇到市场和世界变化造成的不合理做法，应当更积极。\n\nD：原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"question":"39","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>39. C. aggressiveness better meets challenges\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。\u003c/p>\n\u003cp>B：原文“more aggressive than less aggressive”直接比较两种行动方式，并选择更积极的一边。\u003c/p>\n\u003cp>C：原文“better to be more aggressive”给出作者清楚的行动判断：遇到市场和世界变化造成的不合理做法，应当更积极。\u003c/p>\n\u003cp>D：原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：印刷版终将消失的必然性**（段落1引入话题） 《纽约时报》终将停止印刷版 → 具体时间仍在争论（2010年出版商：未来某时）\n\n↓（现实压力）\n\n**逻辑层次2：抛弃印刷版的充分理由**（段落2分析现状） 动机充分：【基础设施成本高昂（印刷机、送货卡车）+ 在线竞争对手无此负担 → 显得过度】+ 读者流失 + 印刷广告收入下降（虽仍超过在线广告）\n\n//（转折观点）\n\n**逻辑层次3：Peretti的战略建议**（段落3-4核心观点） 不应匆忙取消印刷版 → 需要正确方式：【加速转型有意义 // 但突然中断会失去最忠诚客户】\n\n↓（具体策略）\n\n**逻辑层次4：将印刷版转化为\"传承产品\"**（段落5-6详细方案） Netflix案例：停止DVD服务专注流媒体（当时被视为失误 → 实则有远见）→ Peretti的方案：【不设定结束日期 + 提高价格 → 变成传承产品】→ 实施细节：（忠诚客户愿意为信仰买单 + 每年涨价产生额外收入 + 为着迷者制作）→ 现状：《纽约时报》可能已在实施（印刷版年费500美元，是数字版两倍多）\n\n↓（深层思考）\n\n**逻辑层次5：面对变化的积极态度**（段落7总结升华） BuzzFeed无传统业务是奢侈 → 但终将面临类似问题：（当市场和世界变化时，某些做法不再有意义）→ 核心观点：【面对变化，积极进取胜过保守】\n\n↑（全文主旨）\n\n全文核心观点：面对印刷版必然消亡的趋势，《纽约时报》不应匆忙取消，而应将其转化为高价\"传承产品\"，服务最忠诚的客户，在变革中采取积极而非保守的策略。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：印刷版终将消失的必然性\u003c/strong>（段落1引入话题） 《纽约时报》终将停止印刷版 → 具体时间仍在争论（2010年出版商：未来某时）\u003c/p>\n\u003cp>↓（现实压力）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：抛弃印刷版的充分理由\u003c/strong>（段落2分析现状） 动机充分：【基础设施成本高昂（印刷机、送货卡车）+ 在线竞争对手无此负担 → 显得过度】+ 读者流失 + 印刷广告收入下降（虽仍超过在线广告）\u003c/p>\n\u003cp>//（转折观点）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：Peretti的战略建议\u003c/strong>（段落3-4核心观点） 不应匆忙取消印刷版 → 需要正确方式：【加速转型有意义 // 但突然中断会失去最忠诚客户】\u003c/p>\n\u003cp>↓（具体策略）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：将印刷版转化为&quot;传承产品&quot;\u003c/strong>（段落5-6详细方案） Netflix案例：停止DVD服务专注流媒体（当时被视为失误 → 实则有远见）→ Peretti的方案：【不设定结束日期 + 提高价格 → 变成传承产品】→ 实施细节：（忠诚客户愿意为信仰买单 + 每年涨价产生额外收入 + 为着迷者制作）→ 现状：《纽约时报》可能已在实施（印刷版年费500美元，是数字版两倍多）\u003c/p>\n\u003cp>↓（深层思考）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：面对变化的积极态度\u003c/strong>（段落7总结升华） BuzzFeed无传统业务是奢侈 → 但终将面临类似问题：（当市场和世界变化时，某些做法不再有意义）→ 核心观点：【面对变化，积极进取胜过保守】\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：面对印刷版必然消亡的趋势，《纽约时报》不应匆忙取消，而应将其转化为高价&quot;传承产品&quot;，服务最忠诚的客户，在变革中采取积极而非保守的策略。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n**答案：F. Why the Old Cost Structure Is Hard to Defend / 旧成本结构为何难以维持**\n\n说明物理基础设施、读者迁移和收入下降构成结构压力。\n\n> Producing a printed newspaper involves a physical system that a digital competitor does not have to reproduce.\n>\n> The difficulty is therefore structural: an expensive way of reaching a shrinking audience has to justify itself against alternatives with a different set of constraints.\n\n段内推进：\n\n> 说明物理基础设施、读者迁移和收入下降构成结构压力。\n\nOld Cost Structure对应印刷、车辆与配送网络，Hard to Defend对应读者转移、收入下降后这套高成本体系难以证明其价值。\n\n最强干扰项D（Treating Nostalgia as a Complete Business Plan）容易因相同话题进入考虑。但怀旧在这里没有解决成本与受众变化，不能替代结构分析。\n\n**41题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：F. Why the Old Cost Structure Is Hard to Defend / 旧成本结构为何难以维持\u003c/strong>\u003c/p>\n\u003cp>说明物理基础设施、读者迁移和收入下降构成结构压力。\u003c/p>\n\u003cblockquote>\n\u003cp>Producing a printed newspaper involves a physical system that a digital competitor does not have to reproduce.\u003c/p>\n\u003cp>The difficulty is therefore structural: an expensive way of reaching a shrinking audience has to justify itself against alternatives with a different set of constraints.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>说明物理基础设施、读者迁移和收入下降构成结构压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>Old Cost Structure对应印刷、车辆与配送网络，Hard to Defend对应读者转移、收入下降后这套高成本体系难以证明其价值。\u003c/p>\n\u003cp>最强干扰项D（Treating Nostalgia as a Complete Business Plan）容易因相同话题进入考虑。但怀旧在这里没有解决成本与受众变化，不能替代结构分析。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n**答案：B. A Deadline Is Not a Transition Strategy / 期限不是转型策略**\n\n区分最终退出判断与具体转型策略，强调忠实客户风险。\n\n> Recognising that print may eventually disappear does not answer the question of what to do tomorrow.\n>\n> It must decide how to reduce dependence on print while preserving the relationships and income that still make the older business useful.\n\n段内推进：\n\n> 区分最终退出判断与具体转型策略 → 强调忠实客户风险。\n\nDeadline对应在日历上指定停印日期，Transition Strategy对应既降低纸报依赖又保存客户与收入；标题区分什么时候结束与怎样过渡。\n\n最强干扰项E（Keeping Mass Print Cheap Forever）容易因相同话题进入考虑。但保留客户不等于承诺永远低价维持大众纸报；中心是转型方式。\n\n**42题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：B. A Deadline Is Not a Transition Strategy / 期限不是转型策略\u003c/strong>\u003c/p>\n\u003cp>区分最终退出判断与具体转型策略，强调忠实客户风险。\u003c/p>\n\u003cblockquote>\n\u003cp>Recognising that print may eventually disappear does not answer the question of what to do tomorrow.\u003c/p>\n\u003cp>It must decide how to reduce dependence on print while preserving the relationships and income that still make the older business useful.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>区分最终退出判断与具体转型策略 → 强调忠实客户风险。\u003c/p>\n\u003c/blockquote>\n\u003cp>Deadline对应在日历上指定停印日期，Transition Strategy对应既降低纸报依赖又保存客户与收入；标题区分什么时候结束与怎样过渡。\u003c/p>\n\u003cp>最强干扰项E（Keeping Mass Print Cheap Forever）容易因相同话题进入考虑。但保留客户不等于承诺永远低价维持大众纸报；中心是转型方式。\u003c/p>\n\u003cp>\u003cstrong>42题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n**答案：G. Rethinking What Loyal Readers Pay For / 重新考虑忠实读者为何付费**\n\n提出用定价和忠实读者对质量的支持重设纸报价值。\n\n> A printed edition can be offered as a product for people who particularly value it, rather than as the cheapest route to the widest audience.\n>\n> It is to reposition the product around a smaller group’s willingness to sustain quality, and to obtain revenue on that basis.\n\n段内推进：\n\n> 提出用定价和忠实读者对质量的支持重设纸报价值。\n\nLoyal Readers对应特别重视纸质产品的顾客，Pay For对应他们为偏好体验及可信新闻质量付费；Rethinking抓住产品从大众低价转向特定价值的重置。\n\n最强干扰项E（Keeping Mass Print Cheap Forever）容易因相同话题进入考虑。但本段明确提高价格、服务特定群体，方向与永久廉价大众化相反。\n\n**43题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：G. Rethinking What Loyal Readers Pay For / 重新考虑忠实读者为何付费\u003c/strong>\u003c/p>\n\u003cp>提出用定价和忠实读者对质量的支持重设纸报价值。\u003c/p>\n\u003cblockquote>\n\u003cp>A printed edition can be offered as a product for people who particularly value it, rather than as the cheapest route to the widest audience.\u003c/p>\n\u003cp>It is to reposition the product around a smaller group’s willingness to sustain quality, and to obtain revenue on that basis.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出用定价和忠实读者对质量的支持重设纸报价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>Loyal Readers对应特别重视纸质产品的顾客，Pay For对应他们为偏好体验及可信新闻质量付费；Rethinking抓住产品从大众低价转向特定价值的重置。\u003c/p>\n\u003cp>最强干扰项E（Keeping Mass Print Cheap Forever）容易因相同话题进入考虑。但本段明确提高价格、服务特定群体，方向与永久廉价大众化相反。\u003c/p>\n\u003cp>\u003cstrong>43题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n**答案：A. A Lesson from a Change Once Called a Mistake / 从一度被视为失误的转向中学习**\n\n用最初误判与后来评价的反差说明变化可有长远价值。\n\n> A business change can initially appear foolish because observers judge it by the habits it disrupts.\n>\n> Managers must compare the immediate reaction with the future the decision is meant to address.\n\n段内推进：\n\n> 用最初误判与后来评价的反差说明变化可有长远价值。\n\nOnce Called a Mistake对应最初被看作愚蠢的决定，Lesson from a Change对应日后发现它为新市场作了准备；标题保留评价随时间变化的对照。\n\n最强干扰项D（Treating Nostalgia as a Complete Business Plan）容易因相同话题进入考虑。但段落要求比较未来市场，不是凭旧习惯或怀旧决定策略。\n\n**44题选A。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：A. A Lesson from a Change Once Called a Mistake / 从一度被视为失误的转向中学习\u003c/strong>\u003c/p>\n\u003cp>用最初误判与后来评价的反差说明变化可有长远价值。\u003c/p>\n\u003cblockquote>\n\u003cp>A business change can initially appear foolish because observers judge it by the habits it disrupts.\u003c/p>\n\u003cp>Managers must compare the immediate reaction with the future the decision is meant to address.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>用最初误判与后来评价的反差说明变化可有长远价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>Once Called a Mistake对应最初被看作愚蠢的决定，Lesson from a Change对应日后发现它为新市场作了准备；标题保留评价随时间变化的对照。\u003c/p>\n\u003cp>最强干扰项D（Treating Nostalgia as a Complete Business Plan）容易因相同话题进入考虑。但段落要求比较未来市场，不是凭旧习惯或怀旧决定策略。\u003c/p>\n\u003cp>\u003cstrong>44题选A。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n**答案：C. Decisive Action Without a Universal Formula / 果断行动并不等于通用公式**\n\n承认旧业务转型困难，以因地制宜而果断应对收束。\n\n> The difficulty of changing an inherited business does not disappear once a promising idea is found.\n>\n> The lesson concerns the willingness to adapt, rather than a single date or pricing rule that every publisher must adopt.\n\n段内推进：\n\n> 承认旧业务转型困难 → 以因地制宜而果断应对收束。\n\nDecisive Action对应市场不再支持旧做法时果断改变，Without a Universal Formula对应不能机械规定所有公司同一天停印或采用同一价格。\n\n最强干扰项B（A Deadline Is Not a Transition Strategy）容易因相同话题进入考虑。但期限确实不足，但本段总结的是面对市场变化的行动态度。\n\n**45题选C。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：C. Decisive Action Without a Universal Formula / 果断行动并不等于通用公式\u003c/strong>\u003c/p>\n\u003cp>承认旧业务转型困难，以因地制宜而果断应对收束。\u003c/p>\n\u003cblockquote>\n\u003cp>The difficulty of changing an inherited business does not disappear once a promising idea is found.\u003c/p>\n\u003cp>The lesson concerns the willingness to adapt, rather than a single date or pricing rule that every publisher must adopt.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>承认旧业务转型困难 → 以因地制宜而果断应对收束。\u003c/p>\n\u003c/blockquote>\n\u003cp>Decisive Action对应市场不再支持旧做法时果断改变，Without a Universal Formula对应不能机械规定所有公司同一天停印或采用同一价格。\u003c/p>\n\u003cp>最强干扰项B（A Deadline Is Not a Transition Strategy）容易因相同话题进入考虑。但期限确实不足，但本段总结的是面对市场变化的行动态度。\u003c/p>\n\u003cp>\u003cstrong>45题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出转型如何保存现有价值 |\n| B | 限定例证用途，拒绝机械照搬 |\n| C | 引入忠实订户与渐进策略 |\n| D | 解释忠实读者为何接受更高价格 |\n| E | 以价格和产品定位具体化渐进变化 |\n| F | 承认顾客流失并引出跨行业例证 |\n| G | 解释离开纸报的成本压力 |\n| H | 回到因市场而调整的整体策略 |\n\n全文推进：\n\n> 提出转型如何保存现有价值 → 解释离开纸报的成本压力 → 引入忠实订户与渐进策略 → 以价格和产品定位具体化渐进变化 → 解释忠实读者为何接受更高价格 → 承认顾客流失并引出跨行业例证 → 限定例证用途，拒绝机械照搬 → 回到因市场而调整的整体策略\n\n完整顺序：\n\n**A → G → C → E → D → F → B → H**\n\n41—45：G、C、D、F、B。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>提出转型如何保存现有价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>限定例证用途，拒绝机械照搬\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>引入忠实订户与渐进策略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>解释忠实读者为何接受更高价格\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>以价格和产品定位具体化渐进变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>承认顾客流失并引出跨行业例证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>解释离开纸报的成本压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>回到因市场而调整的整体策略\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出转型如何保存现有价值 → 解释离开纸报的成本压力 → 引入忠实订户与渐进策略 → 以价格和产品定位具体化渐进变化 → 解释忠实读者为何接受更高价格 → 承认顾客流失并引出跨行业例证 → 限定例证用途，拒绝机械照搬 → 回到因市场而调整的整体策略\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → G → C → E → D → F → B → H\u003c/strong>\u003c/p>\n\u003cp>41—45：G、C、D、F、B。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41位于全文第2个位置，完整衔接是A → G → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段A的结尾：\n\n> The useful question is how to move from a declining model toward a more sustainable one without destroying value that remains in the existing business.\n\n候选G的开头：\n\n> The existing business carries costs that digital rivals can avoid.\n\n后段C的开头：\n\n> Choosing that moment and method requires attention to loyal subscribers.\n\n前文已经落到`the existing business`，G继续处理这一对象，完成“解释离开纸报的成本压力”。到本段末尾，讨论又落到`best moment or method`，这正好为下一段“引入忠实订户与渐进策略”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 提出转型如何保存现有价值 → 解释离开纸报的成本压力 → 引入忠实订户与渐进策略\n\n最强候选C的功能是“引入忠实订户与渐进策略”。它也属于同一论题，但若直接放在这里，就会跳过“解释离开纸报的成本压力”这一必要环节；其段首“Choosing that moment and method requires attention to loyal subscribers.”需要的前提与A当前收束的对象不一致，后续也接不出C所需的`best moment or method`。\n\n**41题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41位于全文第2个位置，完整衔接是A → G → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The useful question is how to move from a declining model toward a more sustainable one without destroying value that remains in the existing business.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The existing business carries costs that digital rivals can avoid.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Choosing that moment and method requires attention to loyal subscribers.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>the existing business\u003c/code>，G继续处理这一对象，完成“解释离开纸报的成本压力”。到本段末尾，讨论又落到\u003ccode>best moment or method\u003c/code>，这正好为下一段“引入忠实订户与渐进策略”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>提出转型如何保存现有价值 → 解释离开纸报的成本压力 → 引入忠实订户与渐进策略\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“引入忠实订户与渐进策略”。它也属于同一论题，但若直接放在这里，就会跳过“解释离开纸报的成本压力”这一必要环节；其段首“Choosing that moment and method requires attention to loyal subscribers.”需要的前提与A当前收束的对象不一致，后续也接不出C所需的\u003ccode>best moment or method\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42位于全文第3个位置，完整衔接是G → C → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段G的结尾：\n\n> They do not, by themselves, identify the best moment or method for doing so.\n\n候选C的开头：\n\n> Choosing that moment and method requires attention to loyal subscribers.\n\n后段E的开头：\n\n> A gradual change need not mean leaving the product unchanged.\n\n前文已经落到`best moment or method`，C继续处理这一对象，完成“引入忠实订户与渐进策略”。到本段末尾，讨论又落到`gradual change`，这正好为下一段“以价格和产品定位具体化渐进变化”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 解释离开纸报的成本压力 → 引入忠实订户与渐进策略 → 以价格和产品定位具体化渐进变化\n\n最强候选G的功能是“解释离开纸报的成本压力”。它也属于同一论题，但若直接放在这里，就会跳过“引入忠实订户与渐进策略”这一必要环节；其段首“The existing business carries costs that digital rivals can avoid.”需要的前提与G当前收束的对象不一致，后续也接不出E所需的`gradual change`。\n\n**42题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42位于全文第3个位置，完整衔接是G → C → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>They do not, by themselves, identify the best moment or method for doing so.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Choosing that moment and method requires attention to loyal subscribers.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cb \n\u003cblockquote>\n\u003cp>Those two forms of value will not persuade everyone.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A disputed move is not automatically a wise one, of course.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>both forms of value\u003c/code>，F继续处理这一对象，完成“承认顾客流失并引出跨行业例证”。到本段末尾，讨论又落到\u003ccode>a disputed move\u003c/code>，这正好为下一段“限定例证用途，拒绝机械照搬”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释忠实读者为何接受更高价格 → 承认顾客流失并引出跨行业例证 → 限定例证用途，拒绝机械照搬\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选D的功能是“解释忠实读者为何接受更高价格”。它也属于同一论题，但若直接放在这里，就会跳过“承认顾客流失并引出跨行业例证”这一必要环节；其段首“Support for quality can matter to readers as well as publishers.”需要的前提与D当前收束的对象不一致，后续也接不出B所需的\u003ccode>a disputed move\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 45题","level":2,"raw":"### 排序题 · 45题\n\n45位于全文第7个位置，完整衔接是F → B → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段F的结尾：\n\n> The possibility of such a reaction makes examples from other industries useful: they can show that a disputed move sometimes prepares a business for a future its critics have not yet accepted.\n\n候选B的开头：\n\n> A disputed move is not automatically a wise one, of course.\n\n后段H的开头：\n\n> Actual market conditions should therefore guide the pace and form of action.\n\n前文已经落到`a disputed move`，B继续处理这一对象，完成“限定例证用途，拒绝机械照搬”。到本段末尾，讨论又落到`actual market conditions`，这正好为下一段“回到因市场而调整的整体策略”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 承认顾客流失并引出跨行业例证 → 限定例证用途，拒绝机械照搬 → 回到因市场而调整的整体策略\n\n最强候选F的功能是“承认顾客流失并引出跨行业例证”。它也属于同一论题，但若直接放在这里，就会跳过“限定例证用途，拒绝机械照搬”这一必要环节；其段首“Those two forms of value will not persuade everyone.”需要的前提与F当前收束的对象不一致，后续也接不出H所需的`actual market conditions`。\n\n**45题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>45位于全文第7个位置，完整衔接是F → B → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The possibility of such a reaction makes examples from other industries useful: they can show that a disputed move sometimes prepares a business for a future its critics have not yet accepted.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A disputed move is not automatically a wise one, of course.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Actual market conditions should therefore guide the pace and form of action.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a disputed move\u003c/code>，B继续处理这一对象，完成“限定例证用途，拒绝机械照搬”。到本段末尾，讨论又落到\u003ccode>actual market conditions\u003c/code>，这正好为下一段“回到因市场而调整的整体策略”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>承认顾客流失并引出跨行业例证 → 限定例证用途，拒绝机械照搬 → 回到因市场而调整的整体策略\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“承认顾客流失并引出跨行业例证”。它也属于同一论题，但若直接放在这里，就会跳过“限定例证用途，拒绝机械照搬”这一必要环节；其段首“Those two forms of value will not persuade everyone.”需要的前提与F当前收束的对象不一致，后续也接不出H所需的\u003ccode>actual market conditions\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n"},{"section":"第五鸟 · 写作积累","title":"1. 大作文第一段描述题目信息时可积累的主题词","level":2,"raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **adaptability** | **适应能力** | **人生哲理类：创新、开拓、与时俱进** | **个人主题** |\n| sustainable business development | 可持续的企业发展 | 社会现象类：企业经营 | 宏观主题 |\n| product quality | 产品质量 | 社会现象类：消费因素 | 宏观主题 |\n| **long-term thinking** | **长远思考** | **人生哲理类：批判、独立、全局思维** | **个人主题** |\n| customer trust | 顾客信任 | 人生哲理类：理解、信任、宽容 | 宏观主题 |\n| decisive action | 果断行动 | 人生哲理类：创新、开拓、与时俱进 | 个人主题 |\n| **digital innovation** | **数字创新** | **社会现象类：科技发展** | **宏观主题** |\n| responsible decision-making | 负责任的决策 | 人生哲理类：责任感、奉献精神 | 个人主题 |\n| valuable reading experiences | 有价值的阅读体验 | 社会现象类：阅读 | 宏观主题 |","context":{"mode":"image","asset":"articleAnnotated","label":"2016英语一Text 4重点词与语境","focus":[0,0,1080,61 \n"},{"section":"第五鸟 · 写作积累","title":"2. 大作文第一段描述题目信息时可积累的表达","level":2,"raw":"## 2. 大作文第一段描述题目信息时可积累的表达\n\n| 适用题型 | 考试时可复用的形式 | 中文翻译 |\n| --- | --- | --- |\n| **图画题** | **The picture places an established practice beside a rapidly changing market.** | **图画将既有做法与快速变化的市场并列呈现。** |\n| 图画题 | A is trying to preserve a valued product while adapting to new demands. | A正一边保存有价值的产品，一边适应新需求。 |\n| 图画题 | The scene contrasts passive hesitation with a willingness to change. | 画面对比了消极犹豫与主动改变的意愿。 |\n| **图表题** | **Revenue from A declined while income from B continued to rise.** | **A带来的收入下降，而B带来的收入继续增加。** |\n| 图表题 | The cost of A was more than twice that of B. | A的费用是B的两倍以上。 |\n| 图表题 | The figures show customers gradually moving from A to B. | 这些数字显示顾客逐渐从A转向B。 |\n| **文本评论题** | **The passage considers how an established business should respond to a changing market.** | **短文探讨成熟企业应如何应对市场变化。** |\n| 文本评论题 | The author warns against confusing an eventual change with an immediate shutdown. | 作者提醒不要把最终转变等同于立即停业。 |\n| 文本评论题 | The example illustrates a decision that first appeared mistaken but later proved far-sighted. | 该例说明一个最初看似错误、后来却显出远见的决定。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2016英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture places an established practice beside a rapidly changing market.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画将既有做法与快速变化的市场并列呈现。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is trying to preserve a valued product while adapting to new demands.\u003c/td>\n\u003ctd>A正一边保存有价值的产品，一边适应新需求。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The scene contrasts passive hesitation with a willingness to change.\u003c/td>\n\u003ctd>画面对比了消极犹豫与主动改变的意愿。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Revenue from A declined while income from B continued to rise.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>A带来的收入下降，而B带来的收入继续增加。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The cost of A was more than twice that of B.\u003c/td>\n\u003ctd>A的费用是B的两倍以上。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures show customers gradually moving from A to B.\u003c/td>\n\u003ctd>这些数字显示顾客逐渐从A转向B。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage considers how an established business should respond to a changing market.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文探讨成熟企业应如何应对市场变化。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author warns against confusing an eventual change with an immediate shutdown.\u003c/td>\n\u003ctd>作者提醒不要把最终转变等同于立即停业。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The example illustrates a decision that first appeared mistaken but later proved far-sighted.\u003c/td>\n\u003ctd>该例说明一个最初看似错误、后来却显出远见的决定。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"}];

const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. A Lesson from a Change Once Called a Mistake\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. A Deadline Is Not a Transition Strategy\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Decisive Action Without a Universal Formula\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. Treating Nostalgia as a Complete Business Plan\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Keeping Mass Print Cheap Forever\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Why the Old Cost Structure Is Hard to Defend\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Rethinking What Loyal Readers Pay For\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>Producing a printed newspaper involves a physical system that a digital competitor does not have to reproduce. Presses, vehicles and distribution networks cost money even as readers move elsewhere. Advertising income may still be substantial, but its size does not remove a downward trend. The difficulty is therefore structural: an expensive way of reaching a shrinking audience has to justify itself against alternatives with a different set of constraints.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>Recognising that print may eventually disappear does not answer the question of what to do tomorrow. An abrupt closure can drive away customers who remain willing to pay for the product. Their loyalty has value during a transition. Management consequently needs more than a date written on a calendar. It must decide how to reduce dependence on print while preserving the relationships and income that still make the older business useful.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>A printed edition can be offered as a product for people who particularly value it, rather than as the cheapest route to the widest audience. Higher prices may allow loyal readers to feel they are supporting journalism they trust. The purpose is not merely to charge more for the same habit. It is to reposition the product around a smaller group’s willingness to sustain quality, and to obtain revenue on that basis.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>A business change can initially appear foolish because observers judge it by the habits it disrupts. Later, the same decision may seem sensible because it prepared the company for a different market. An example of this pattern cannot prove that every newspaper should copy another company. It can nevertheless challenge the assumption that upsetting existing customers automatically makes a change wrong. Managers must compare the immediate reaction with the future the decision is meant to address.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>The difficulty of changing an inherited business does not disappear once a promising idea is found. Prices, audience preferences and the pace of digital growth still differ from company to company. Yet uncertainty is not a reason for permanent hesitation. When the market no longer supports familiar practices, managers should be willing to act decisively. The lesson concerns the willingness to adapt, rather than a single date or pricing rule that every publisher must adopt.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>A newspaper may accept that its future is increasingly digital and still keep printing today. This is not necessarily a contradiction. The useful question is how to move from a declining model toward a more sustainable one without destroying value that remains in the existing business.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>A disputed move is not automatically a wise one, of course. An example supplies a reason to examine the future, not a licence to ignore customers. Managers must connect a change to actual market conditions and the value their own product offers. Copying the surface of another company’s decision is insufficient.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>Choosing that moment and method requires attention to loyal subscribers. Some still strongly prefer the printed product and are prepared to pay for it. An abrupt end would break that relationship at once. A gradual change may retain its value while allowing the publisher to reduce its dependence on mass print.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Support for quality can matter to readers as well as publishers. A subscriber may see the extra payment as helping journalism that deserves to continue. The arrangement thus combines a preferred reading experience with a sense of contribution. Its success depends on making both forms of value credible.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>A gradual change need not mean leaving the product unchanged. The publisher might raise its price and treat it as a special offering for its most committed readers. Under this approach, a smaller audience becomes a source of support for quality rather than proof that the product has no possible future.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>Those two forms of value will not persuade everyone. Some customers will leave, and early criticism may be sharp. The possibility of such a reaction makes examples from other industries useful: they can show that a disputed move sometimes prepares a business for a future its critics have not yet accepted.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>The existing business carries costs that digital rivals can avoid. Printing presses and delivery systems must be maintained while audiences and advertisers shift their attention. These pressures explain the wish to leave print behind. They do not, by themselves, identify the best moment or method for doing so.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>Actual market conditions should therefore guide the pace and form of action. A print business need not be defended unchanged, nor ended merely to display determination. Its remaining value can be reworked while digital operations develop. The essential requirement is a readiness to act when familiar arrangements no longer make sense.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2016英语一Text 4重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>eventually\u003c/td>\n\u003ctd>ad.最终\u003c/td>\n\u003ctd>cease\u003c/td>\n\u003ctd>v.停止\u003c/td>\n\u003ctd>news in 2010.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>终将会有一天来临 / 当《纽约时报》 / 停止发布故事 / 在新闻纸上。\u003c/p>\n\u003cp>确切地说那一天何时到来 / 是一个争论的问题。\u003c/p>\n\u003cp>&quot;未来某个时候，&quot; / 该报的出版商说 / 早在2010年。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>《纽约时报》终将有一天会停止在新闻纸上发布报道。至于这一天具体何时到来，仍是一个争论的话题。早在2010年，该报的出版商就说过：&quot;未来某个时候。&quot;\u003c/p>\n\u003ch2>\u003c/h2>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Nostalgia for ink on paper and the rustle of pages aside, there&#39;s plenty of incentive to ditch print. The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints. Readers are migrating away from print anyway. And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Nostalgia for ink on paper / and the rustle of pages aside, / there&#39;s plenty of incentive / to ditch print.\u003c/p>\n\u003cp>The infrastructure required / to make a physical newspaper– / printing presses, delivery trucks – / isn&#39;t just expensive; / it&#39;s excessive / at a time / when online-only competitors / don&#39;t have the same set / of financial constraints.\u003c/p>\n\u003cp>Readers are migrating away / from print anyway.\u003c/p>\n\u003cp>And though print ad sales / still dwarf / their online and mobile counterparts, / revenue from print / is still declining.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>对纸上油墨的怀旧 / 和翻页的沙沙声除外，/ 有大量的动机 / 来抛弃印刷版。\u003c/p>\n\u003cp>所需的基础设施 / 来制作实体报纸– / 印刷机、送货卡车 – / 不仅仅是昂贵的；/ 它是过度的 / 在这个时候 / 当纯在线竞争对手 / 没有同样的一套 / 财务限制。\u003c/p>\n\u003cp>读者正在迁移离开 / 印刷版无论如何。\u003c/p>\n\u003cp>虽然印刷广告销售 / 仍然使相形见绌 / 他们的在线和移动对应物，/ 来自印刷的收入 / 仍在下降。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>撇开对纸上油墨和翻页沙沙声的怀旧不谈，有充分的理由抛弃印刷版。制作实体报纸所需的基础设施——印刷机、送货卡车——不仅昂贵，在纯在线竞争对手没有同样财务负担的时代，这些设施显得过于庞大。读者本来就在远离印刷版。虽然印刷广告销售仍然远超在线和移动广告，但印刷收入仍在下降。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>Overhead may be high / and circulation lower, / but rushing to eliminate / its print edition / would be a mistake, / says BuzzFeed CEO / Jonah Peretti.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>运营成本可能很高 / 发行量较低，/ 但匆忙消除 / 其印刷版 / 将是一个错误，/ BuzzFeed首席执行官说 / 乔纳·佩雷蒂。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>尽管运营成本高、发行量低，但BuzzFeed首席执行官乔纳·佩雷蒂认为，匆忙取消印刷版将是一个错误。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>Peretti says the Times shouldn&#39;t waste time getting out of the print business, but only if they go about doing it the right way. &quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>Peretti says / the Times shouldn&#39;t waste time / getting out of the print business, / but only if / they go about doing it / the right way.\u003c/p>\n\u003cp>&quot;Figuring out a way / to accelerate that transition / would make sense for them,&quot; / he said, / &quot;but if you discontinue it, / you&#39;re going to have / your most loyal customers / really upset with you.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>佩雷蒂说 / 《纽约时报》不应该浪费时间 / 退出印刷业务，/ 但只有在 / 他们着手做这件事 / 以正确的方式。\u003c/p>\n\u003cp>&quot;找出一种方法 / 来加速这种转变 / 对他们来说是有意义的，&quot; / 他说，/ &quot;但如果你中断它，/ 你将会让 / 你最忠诚的客户 / 真的对你不满。&quot;\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>佩雷蒂说，《纽约时报》不应该在退出印刷业务上浪费时间，但前提是要以正确的方式进行。&quot;找到加速这种转变的方法对他们来说是有意义的，&quot;他说，&quot;但如果你突然中断印刷版，你最忠诚的客户会对你非常不满。&quot;\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>Sometimes that&#39;s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. &quot;It was seen as a blunder,&quot; he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? &quot;I wouldn&#39;t pick a year to end print,&quot; he said. &quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>Sometimes / that&#39;s worth making a change anyway.\u003c/p>\n\u003cp>Peretti gives the example / of Netflix / discontinuing its DVD-mailing service / to focus on streaming.\u003c/p>\n\u003cp>&quot;It was seen as a blunder,&quot; / he said.\u003c/p>\n\u003cp>The move turned out / to be foresighted.\u003c/p>\n\u003cp>And if Peretti / were in charge at the Times?\u003c/p>\n\u003cp>&quot;I wouldn&#39;t pick a year / to end print,&quot; / he said.\u003c/p>\n\u003cp>&quot;I would raise prices / and make it into / more of a legacy product.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>有时候 / 那还是值得做出改变的。\u003c/p>\n\u003cp>佩雷蒂举了例子 / Netflix的 / 中断其DVD邮寄服务 / 来专注于流媒体。\u003c/p>\n\u003cp>&quot;这被视为一个失误，&quot; / 他说。\u003c/p>\n\u003cp>这个举动结果证明 / 是有远见的。\u003c/p>\n\u003cp>如果佩雷蒂 / 负责《纽约时报》呢？\u003c/p>\n\u003cp>&quot;我不会选择一年 / 来结束印刷，&quot; / 他说。\u003c/p>\n\u003cp>&quot;我会提高价格 / 并将其变成 / 更多的传承产品。&quot;\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>有时候还是值得做出改变的。佩雷蒂举了Netflix的例子，它停止了DVD邮寄服务以专注于流媒体。&quot;当时这被视为一个失误，&quot;他说。但这个举动最终证明是有远见的。如果佩雷蒂负责《纽约时报》会怎么做？&quot;我不会选定某一年来结束印刷版，&quot;他说。&quot;我会提高价格，把它变成更多的传承产品。&quot;\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in. &quot;So if you&#39;re overpaying for print, you could feel like you were helping,&quot; Peretti said. &quot;Then increase it at a higher rate each year and essentially try to generate additional revenue.&quot; In other words, if you&#39;re going to make a print product, make it for the people who are already obsessed with it. Which may be what the Times is doing already. Getting the print edition seven days a week costs nearly $500 a year – more than twice as much as a digital-only subscription.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>The most loyal customers / would still get / the product they favor, / the idea goes, / and they&#39;d feel like / they were helping sustain / the quality of something / they believe in.\u003c/p>\n\u003cp>&quot;So if you&#39;re overpaying for print, / you could feel like / you were helping,&quot; / Peretti said.\u003c/p>\n\u003cp>&quot;Then increase it / at a higher rate / each year / and essentially try / to generate additional revenue.&quot;\u003c/p>\n\u003cp>In other words, / if you&#39;re going to make / a print product, / make it for the people / who are already obsessed with it.\u003c/p>\n\u003cp>Which may be / what the Times is doing already.\u003c/p>\n\u003cp>Getting the print edition / seven days a week / costs nearly $500 a year – / more than twice as much as / a digital-only subscription.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>最忠诚的客户 / 仍然会得到 / 他们喜爱的产品，/ 这个想法是，/ 他们会感觉像是 / 他们在帮助维持 / 某物的质量 / 他们相信的。\u003c/p>\n\u003cp>&quot;所以如果你为印刷版支付过高费用，/ 你可能会感觉像是 / 你在帮忙，&quot; / 佩雷蒂说。\u003c/p>\n\u003cp>&quot;然后增加它 / 以更高的速率 / 每年 / 基本上尝试 / 产生额外收入。&quot;\u003c/p>\n\u003cp>换句话说，/ 如果你要制作 / 印刷产品，/ 为那些人制作 / 已经对它着迷的人。\u003c/p>\n\u003cp>这可能是 / 《纽约时报》已经在做的。\u003c/p>\n\u003cp>获得印刷版 / 每周七天 / 花费近500美元一年 – / 超过两倍多 / 纯数字订阅。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>这个想法是，最忠诚的客户仍然会得到他们喜爱的产品，并且会感觉自己在帮助维持他们所信仰的东西的质量。&quot;所以如果你为印刷版支付过高费用，你可能会感觉自己在帮忙，&quot;佩雷蒂说。&quot;然后每年以更高的速率提价，基本上就是试图产生额外收入。&quot;换句话说，如果你要制作印刷产品，就为那些已经对它着迷的人制作。这可能正是《纽约时报》已经在做的。获得每周七天的印刷版每年花费近500美元——是纯数字订阅的两倍多。\u003c/p>\n\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>&quot;It&#39;s a really hard thing to do and it&#39;s a tremendous luxury that BuzzFeed doesn&#39;t have a legacy business,&quot; Peretti remarked. &quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes. In those situations, it&#39;s better to be more aggressive than less aggressive.&quot;\u003c/p>\n\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>&quot;It&#39;s a really hard thing to do / and it&#39;s a tremendous luxury / that BuzzFeed doesn&#39;t have / a legacy business,&quot; / Peretti remarked.\u003c/p>\n\u003cp>&quot;But we&#39;re going to have / questions like that / where we have things / we&#39;re doing / that don&#39;t make sense / when the market changes / and the world changes.\u003c/p>\n\u003cp>In those situations, / it&#39;s better / to be more aggressive / than less aggressive.&quot;\u003c/p>\n\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>&quot;这是一件非常困难的事情 / 这是一种巨大的奢侈 / BuzzFeed没有 / 传统业务，&quot; / 佩雷蒂评论道。\u003c/p>\n\u003cp>&quot;但我们将会有 / 这样的问题 / 当我们有一些事情 / 我们正在做的 / 不再有意义 / 当市场改变时 / 世界改变时。\u003c/p>\n\u003cp>在那些情况下，/ 更好的是 / 更加积极进取 / 而不是不够积极进取。&quot;\u003c/p>\n\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>&quot;这是一件非常困难的事情，BuzzFeed没有传统业务是一种巨大的奢侈，&quot;佩雷蒂评论道。&quot;但当市场和世界发生变化时，我们也会面临类似的问题，即我们正在做的某些事情不再有意义。在那些情况下，更加积极进取比保守要好。&quot;\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>There will eventually come a day：(when The New York Times → ceases to publish stories：(on newsprint)).\u003c/p>\n\u003cp>Exactly when that day will be → is a matter of debate.\u003c/p>\n\u003cp>&quot;Sometime in the future,&quot; → the paper&#39;s publisher said：(back in 2010).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Nostalgia for ink on paper + the rustle of pages aside → there&#39;s plenty of incentive：(to ditch print).\u003c/p>\n\u003cp>The infrastructure required：(to make a physical newspaper)：(printing presses + delivery trucks) → isn&#39;t just expensive; // it&#39;s excessive：(at a time：(when online-only competitors → don&#39;t have the same set：(of financial constraints))).\u003c/p>\n\u003cp>Readers are migrating away：(from print anyway).\u003c/p>\n\u003cp>And though print ad sales → still dwarf：(their online and mobile counterparts) // revenue from print → is still declining.\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Overhead may be high + circulation lower // but rushing to eliminate：(its print edition) → would be a mistake → says BuzzFeed CEO：(Jonah Peretti).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Peretti says → the Times shouldn&#39;t waste time：(getting out of the print business) // but only if：(they go about doing it：(the right way)).\u003c/p>\n\u003cp>&quot;Figuring out a way：(to accelerate that transition) → would make sense for them,&quot; → he said // &quot;but if you discontinue it → you&#39;re going to have：(your most loyal customers：(really upset with you)).&quot;\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>Sometimes → that&#39;s worth making a change anyway.\u003c/p>\n\u003cp>Peretti gives the example：(of Netflix：(discontinuing its DVD-mailing service：(to focus on streaming))).\u003c/p>\n\u003cp>&quot;It was seen as a blunder,&quot; → he said.\u003c/p>\n\u003cp>The move turned out → to be foresighted.\u003c/p>\n\u003cp>And if Peretti → were in charge at the Times?\u003c/p>\n\u003cp>&quot;I wouldn&#39;t pick a year：(to end print),&quot; → he said.\u003c/p>\n\u003cp>&quot;I would raise prices + make it into：(more of a legacy product).&quot;\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>The most loyal customers → would still get：(the product they favor) → the idea goes + they&#39;d feel like：(they were helping sustain：(the quality of something：(they believe in))).\u003c/p>\n\u003cp>&quot;So if you&#39;re overpaying for print → you could feel like：(you were helping),&quot; → Peretti said.\u003c/p>\n\u003cp>&quot;Then increase it：(at a higher rate)：(each year) + essentially try：(to generate additional revenue).&quot;\u003c/p>\n\u003cp>In other words → if you&#39;re going to make：(a print product) → make it for the people：(who are already obsessed with it).\u003c/p>\n\u003cp>Which may be：(what the Times is doing already).\u003c/p>\n\u003cp>Getting the print edition：(seven days a week) → costs nearly $500 a year – more than twice as much as：(a digital-only subscription).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>&quot;It&#39;s a really hard thing to do + it&#39;s a tremendous luxury：(that BuzzFeed doesn&#39;t have：(a legacy business)),&quot; → Peretti remarked.\u003c/p>\n\u003cp>&quot;But we&#39;re going to have：(questions like that)：(where we have things：(we&#39;re doing)：(that don&#39;t make sense：(when the market changes + the world changes))).\u003c/p>\n\u003cp>In those situations → it&#39;s better：(to be more aggressive：(than less aggressive)).&quot;\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>终将会有一天来临：(当《纽约时报》→ 停止发布故事：(在新闻纸上))。\u003c/p>\n\u003cp>确切地说那一天何时到来 → 是一个争论的问题。\u003c/p>\n\u003cp>&quot;未来某个时候，&quot; → 该报的出版商说：(早在2010年)。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>对纸上油墨的怀旧 + 翻页的沙沙声除外 → 有大量的动机：(来抛弃印刷版)。\u003c/p>\n\u003cp>所需的基础设施：(来制作实体报纸)：(印刷机 + 送货卡车) → 不仅仅是昂贵的；// 它是过度的：(在这个时候：(当纯在线竞争对手 → 没有同样的一套：(财务限制)))。\u003c/p>\n\u003cp>读者正在迁移离开：(印刷版无论如何)。\u003c/p>\n\u003cp>虽然印刷广告销售 → 仍然使相形见绌：(他们的在线和移动对应物) // 来自印刷的收入 → 仍在下降。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>运营成本可能很高 + 发行量较低 // 但匆忙消除：(其印刷版) → 将是一个错误 → BuzzFeed首席执行官说：(乔纳·佩雷蒂)。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>佩雷蒂说 → 《纽约时报》不应该浪费时间：(退出印刷业务) // 但只有在：(他们着手做这件事：(以正确的方式))。\u003c/p>\n\u003cp>&quot;找出一种方法：(来加速这种转变) → 对他们来说是有意义的，&quot; → 他说 // &quot;但如果你中断它 → 你将会让：(你最忠诚的客户：(真的对你不满))。&quot;\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>有时候 → 那还是值得做出改变的。\u003c/p>\n\u003cp>佩雷蒂举了例子：(Netflix的：(中断其DVD邮寄服务：(来专注于流媒体)))。\u003c/p>\n\u003cp>&quot;这被视为一个失误，&quot; → 他说。\u003c/p>\n\u003cp>这个举动结果证明 → 是有远见的。\u003c/p>\n\u003cp>如果佩雷蒂 → 负责《纽约时报》呢？\u003c/p>\n\u003cp>&quot;我不会选择一年：(来结束印刷)，&quot; → 他说。\u003c/p>\n\u003cp>&quot;我会提高价格 + 将其变成：(更多的传承产品)。&quot;\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>最忠诚的客户 → 仍然会得到：(他们喜爱的产品) → 这个想法是 + 他们会感觉像是：(他们在帮助维持：(某物的质量：(他们相信的)))。\u003c/p>\n\u003cp>&quot;所以如果你为印刷版支付过高费用 → 你可能会感觉像是：(你在帮忙)，&quot; → 佩雷蒂说。\u003c/p>\n\u003cp>&quot;然后增加它：(以更高的速率)：(每年) + 基本上尝试：(产生额外收入)。&quot;\u003c/p>\n\u003cp>换句话说 → 如果你要制作：(印刷产品) → 为那些人制作：(已经对它着迷的人)。\u003c/p>\n\u003cp>这可能是：(《纽约时报》已经在做的)。\u003c/p>\n\u003cp>获得印刷版：(每周七天) → 花费近500美元一年 – 超过两倍多：(纯数字订阅)。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>&quot;这是一件非常困难的事情 + 这是一种巨大的奢侈：(BuzzFeed没有：(传统业务))，&quot; → 佩雷蒂评论道。\u003c/p>\n\u003cp>&quot;但我们将会有：(这样的问题)：(当我们有一些事情：(我们正在做的)：(不再有意义：(当市场改变时 + 世界改变时)))。\u003c/p>\n\u003cp>在那些情况下 → 更好的是：(更加积极进取：(而不是不够积极进取))。&quot;\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第2段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>The infrastructure required / to make a physical newspaper– / printing presses, delivery trucks – / isn&#39;t just expensive; / it&#39;s excessive / at a time / when online-only competitors / don&#39;t have the same set / of financial constraints.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>所需的基础设施 / 来制作实体报纸– / 印刷机、送货卡车 – / 不仅仅是昂贵的；/ 它是过度的 / 在这个时候 / 当纯在线竞争对手 / 没有同样的一套 / 财务限制。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把required修饰的设备合并成一个主体，破折号里是举例。：\u003c/p>\n\u003cblockquote>\n\u003cp>制作实体报纸所需的基础设施，例如印刷机和送货卡车\u003c/p>\n\u003c/blockquote>\n\u003cp>再合并双重评价与时代条件。：\u003c/p>\n\u003cblockquote>\n\u003cp>不只是昂贵；在纯网络竞争者没有同类财务约束时，还显得过度庞大\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>制作实体报纸所需的基础设施，例如印刷机和送货卡车；不只是昂贵；在纯网络竞争者没有同类财务约束时，还显得过度庞大。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>制作纸报的基础设施不仅昂贵，而且显得过于庞大。\u003c/p>\n\u003c/blockquote>\n\u003cp>把所需用途放在基础设施前，设备例子留作插入补充；把纯网络竞争者的处境放在“在……时代”里，解释后一评价。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>生产实体报纸需要印刷机、送货卡车等基础设施；在纯网络竞争者没有同样财务约束的情况下，这些设施不仅花费高，而且显得过于庞大。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>not just把评价从贵推进到负担过度，不可只留下贵这一层。\u003c/p>\n\u003cp>同类财务约束属于实体印刷体系，不是说网络媒体完全没有成本。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>制作实体报纸所需的基础设施——印刷机、送货卡车——不仅昂贵，在纯在线竞争对手没有同样财务负担的时代，这些设施显得过于庞大。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第4段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way / to accelerate that transition / would make sense for them,&quot; / he said, / &quot;but if you discontinue it, / you&#39;re going to have / your most loyal customers / really upset with you.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;找出一种方法 / 来加速这种转变 / 对他们来说是有意义的，&quot; / 他说，/ &quot;但如果你中断它，/ 你将会让 / 你最忠诚的客户 / 真的对你不满。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把finding a way看作整件事，合并成对转型办法的评价。：\u003c/p>\n\u003cblockquote>\n\u003cp>找到加快转型的办法，对他们有意义\u003c/p>\n\u003c/blockquote>\n\u003cp>再把条件与顾客反应相连。：\u003c/p>\n\u003cblockquote>\n\u003cp>但如果突然停掉印刷版，最忠实的顾客会非常不满\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>找到加快转型的办法，对他们有意义；但如果突然停掉印刷版，最忠实的顾客会非常不满。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>加快转型有意义，但停止印刷版会惹恼忠实客户。\u003c/p>\n\u003c/blockquote>\n\u003cp>先说可做什么，再用“但如果”设置不宜越过的界限；he said只是引语提示，不能打断条件与结果。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>他说，想出加快这一转变的办法对他们有意义；但如果停止印刷版，他们最忠实的客户就会非常不满。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>accelerate是加快转变，不等于discontinue所说的立即关停。\u003c/p>\n\u003cp>most loyal强调被得罪的是核心客户，保留程度才能看出商业风险。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>找到加速这种转变的方法对他们来说是有意义的，&quot;他说，&quot;但如果你突然中断印刷版，你最忠诚的客户会对你非常不满。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第1句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>The most loyal customers / would still get / the product they favor, / the idea goes, / and they&#39;d feel like / they were helping sustain / the quality of something / they believe in.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>最忠诚的客户 / 仍然会得到 / 他们喜爱的产品，/ 这个想法是，/ 他们会感觉像是 / 他们在帮助维持 / 某物的质量 / 他们相信的。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先将顾客仍然获得喜爱产品这一结果合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>最忠实的顾客仍能得到自己喜爱的产品\u003c/p>\n\u003c/blockquote>\n\u003cp>再合并第二项感受及其支持对象。：\u003c/p>\n\u003cblockquote>\n\u003cp>他们还会觉得自己在帮助维持所信赖产品的质量\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>最忠实的顾客仍能得到自己喜爱的产品；他们还会觉得自己在帮助维持所信赖产品的质量。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>忠实顾客仍得到产品，并感到自己在支持其质量。\u003c/p>\n\u003c/blockquote>\n\u003cp>the idea goes作为“这个想法是”放在开头；两项结果并列，believe in修饰他们支持的东西，不另起一个顾客信仰话题。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>按照这个想法，最忠实的客户仍能拿到他们喜欢的产品，同时会觉得自己正帮助维持所信赖之物的质量。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>would与这个想法相连，是方案预期，不是已经观测到的结果。\u003c/p>\n\u003cp>sustain the quality强调维持新闻品质，不是只维持一份纸张的外形。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>这个想法是，最忠诚的客户仍然会得到他们喜爱的产品，并且会感觉自己在帮助维持他们所信仰的东西的质量。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>40题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一项最适合作为本文标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Shift to Online Newspapers All at Once\u003c/strong>\u003c/p>\n\u003cp>立刻全面转向网络报纸\u003c/p>\n\u003cp>B. \u003cstrong>Cherish the Newspaper Still in Your Hand\u003c/strong>\u003c/p>\n\u003cp>珍惜你手中的纸质报纸\u003c/p>\n\u003cp>C. \u003cstrong>Keep Your Newspapers Forever in Fashion\u003c/strong>\u003c/p>\n\u003cp>让纸质报纸永远流行\u003c/p>\n\u003cp>D. \u003cstrong>Make Your Print Newspaper a Luxury Good\u003c/strong>\u003c/p>\n\u003cp>把纸质报纸做成奢侈品\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>提出《纽约时报》终有一天会停止纸质出版，但具体时间仍有争议\u003c/td>\n\u003ctd>先摆出一个迟早会到来的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降\u003c/td>\n\u003ctd>回头解释维持原样为什么越来越难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误\u003c/td>\n\u003ctd>但话说回来立刻停下也不对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客\u003c/td>\n\u003ctd>接着提出一种渐进调整办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品\u003c/td>\n\u003ctd>再举一个例子说明转向也能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/td>\n\u003ctd>然后说明怎样保住核心价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法\u003c/td>\n\u003ctd>最后说环境变化时要更果断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>A. Shift to Online Newspapers All at Once\u003c/h3>\n\u003cp>立刻全面转向网络报纸\u003c/p>\n\u003ch4>如果 A 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>立刻全面转向网络报纸\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd
