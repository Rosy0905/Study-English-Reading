const DATA = [{"section":"方法总览","title":"史上最强阅读复盘法：一石五鸟法","level":2,"raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](asset://method_vocab_example)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](asset://method_intent_example)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](asset://method_newtype_overview)\n\n![新题型考纲表格](asset://method_newtype_table)\n\n![七选五题型说明](asset://method_cloze_intro)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](asset://method_smalltitle)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](asset://method_sorting)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](asset://method_matching)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","context":null,"meta":{},"focusId":null,"html":"\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_vocab_example\" class=\"embedded-asset\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_intent_example\" class=\"embedded-asset\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_overview\" class=\"embedded-asset\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_newtype_table\" class=\"embedded-asset\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_cloze_intro\" class=\"embedded-asset\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_smalltitle\" class=\"embedded-asset\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_sorting\" class=\"embedded-asset\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"\" data-asset=\"method_matching\" class=\"embedded-asset\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n"},{"section":"第一鸟 · 词汇","title":"第1段","level":2,"raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| eventually | ad.最终 | cease | v.停止 | newsprint | n.新闻用纸 |\n| exactly | ad.确切地 | a matter of debate | 有待讨论的问题 | future | n.未来 |","context":{"mode":"image","asset":"articleAnnotated","label":"2016英语一Text 4重点词与语境","focus":[85,126,925,351],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>eventually\u003c/td>\n\u003ctd>ad.最终\u003c/td>\n\u003ctd>cease\u003c/td>\n\u003ctd>v.停止\u003c/td>\n\u003ctd>newsprint\u003c/td>\n\u003ctd>n.新闻用纸\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>exactly\u003c/td>\n\u003ctd>ad.确切地\u003c/td>\n\u003ctd>a matter of debate\u003c/td>\n\u003ctd>有待讨论的问题\u003c/td>\n\u003c ":"第1段精读与翻译","focus":[85,126,925,351],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":1,"kind":"standard"},"focusId":"focus-paragraph-1-1","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>There will eventually come a day when The New York Times ceases to publish stories on newsprint. Exactly when that day will be is a matter of debate. &quot;Sometime in the future,&quot; the paper&#39;s publisher said back in 2010.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>There will eventually come a day / when The New York Times / ceases to publish stories / on newsprint.\u003c/p>\n\u003cp>Exactly when that day will be / is a matter of debate.\u003c/p>\n\u003cp>&quot;Sometime in the future,&quot; / the paper&#39;s publisher said / back in 2010.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 意群翻译 · 第1段\n\n终将会有一天来临 / 当《纽约时报》 / 停止发布故事 / 在新闻纸上。\n\n确切地说那一天何时到来 / 是一个争论的问题。\n\n\"未来某个时候，\" / 该报的出版商说 / 早在2010年。","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,126,925,351],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":false,"partIndex":2,"kind":"standard"},"focusId":"focus-paragraph-1-2","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>There will eventually come a day when The New York Times ceases to publish stories on newsprint. Exactly when that day will be is a matter of debate. &quot;Sometime in the future,&quot; the paper&#39;s publisher said back in 2010.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>There will eventually come a day / when The New York Times / ceases to publish stories / on newsprint.\u003c/p>\n\u003cp>Exactly when that day will be / is a matter of debate.\u003c/p>\n\u003cp>&quot;Sometime in the future,&quot; / the paper&#39;s publisher said / back in 2010.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-2\">\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>终将会有一天来临 / 当《纽约时报》 / 停止发布故事 / 在新闻纸上。\u003c/p>\n\u003cp>确切地说那一天何时到来 / 是一个争论的问题。\u003c/p>\n\u003cp>&quot;未来某个时候，&quot; / 该报的出版商说 / 早在2010年。\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第1段","level":3,"raw":"### 标准译文 · 第1段\n\n《纽约时报》终将有一天会停止在新闻纸上发布报道。至于这一天具体何时到来，仍是一个争论的话题。早在2010年，该报的出版商就说过：\"未来某个时候。\"\n\n##","context":{"mode":"image","asset":"articleAnnotated","label":"第1段精读与翻译","focus":[85,126,925,351],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-1","cumulativeFinal":true,"partIndex":3,"kind":"standard"},"focusId":"focus-paragraph-1-3","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-1-0\">\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>There will eventually come a day when The New York Times ceases to publish stories on newsprint. Exactly when that day will be is a matter of debate. &quot;Sometime in the future,&quot; the paper&#39;s publisher said back in 2010.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-1\">\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>There will eventually come a day / when The New York Times / ceases to publish stories / on newsprint.\u003c/p>\n\u003cp>Exactly when that day will be / is a matter of debate.\u003c/p>\n\u003cp>&quot;Sometime in the future,&quot; / the paper&#39;s publisher said / back in 2010.\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-2\">\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>终将会有一天来临 / 当《纽约时报》 / 停止发布故事 / 在新闻纸上。\u003c/p>\n\u003cp>确切地说那一天何时到来 / 是一个争论的问题。\u003c/p>\n\u003cp>&quot;未来某个时候，&quot; / 该报的出版商说 / 早在2010年。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-paragraph-1-3\">\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>《纽约时报》终将有一天会停止在新闻纸上发布报道。至于这一天具体何时到来，仍是一个争论的话题。早在2010年，该报的出版商就说过：&quot;未来某个时候。&quot;\u003c/p>\n\u003ch2>\u003c/h2>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 完整原文 · 第2段\n\nNostalgia for ink on paper and the rustle of pages aside, there's plenty of incentive to ditch print. The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn't just expensive; it's excessive at a time when online-only competitors don't have the same set of financial constraints. Readers are migrating away from print anyway. And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.","context":{"mode":"image","asset":"articleAnnotated","label":"第2段精读与翻译","focus":[85,486,925,614],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"meta":{"cumulative":true,"cumulativeGroup":"paragraph-2","cumulativeFinal":false,"partIndex":0,"kind":"standard"},"focusId":"focus-paragraph-2-0","html":"\u003csection class=\"revealPart\" id=\"focus-paragraph-2-0\">\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Nostalgia for ink on paper and the rustle of pages aside, there&#39;s plenty of incentive to ditch print. The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints. Readers are migrating away from print anyway. And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\u003c/p>\n\u003c/section>"},{"section":"第二鸟 · 精读与翻译","title":"第2段","level":3,"raw":"### 意群划分 · 第2段\n\nNostalgia for ink on paper / and the rustle of pages aside, / there's plenty of incentive / to ysical newspaper)：(printing presses + delivery trucks) → isn't just expensive; // it's excessive：(at a time：(when online-only competitors → don't have the same set：(of financial constraints))).\n\nReaders are migrating away：(from print anyway).\n\nAnd though print ad sales → still dwarf：(their online and mobile counterparts) // revenue from print → is still declining.\n\n### 第3段\n\nOverhead may be high + circulation lower // but rushing to eliminate：(its print edition) → would be a mistake → says BuzzFeed CEO：(Jonah Peretti).\n\n### 第4段\n\nPeretti says → the Times shouldn't waste time：(getting out of the print business) // but only if：(they go about doing it：(the right way)).\n\n\"Figuring out a way：(to accelerate that transition) → would make sense for them,\" → he said // \"but if you discontinue it → you're going to have：(your most loyal customers：(really upset with you)).\"\n\n### 第5段\n\nSometimes → that's worth making a change anyway.\n\nPeretti gives the example：(of Netflix：(discontinuing its DVD-mailing service：(to focus on streaming))).\n\n\"It was seen as a blunder,\" → he said.\n\nThe move turned out → to be foresighted.\n\nAnd if Peretti → were in charge at the Times?\n\n\"I wouldn't pick a year：(to end print),\" → he said.\n\n\"I would raise prices + make it into：(more of a legacy product).\"\n\n### 第6段\n\nThe most loyal customers → would still get：(the product they favor) → the idea goes + they'd feel like：(they were helping sustain：(the quality of something：(they believe in))).\n\n\"So if you're overpaying for print → you could feel like：(you were helping),\" → Peretti said.\n\n\"Then increase it：(at a higher rate)：(each year) + essentially try：(to generate additional revenue).\"\n\nIn other words → if you're going to make：(a print product) → make it for the people：(who are already obsessed with it).\n\nWhich may be：(what the Times is doing already).\n\nGetting the print edition：(seven days a week) → costs nearly $500 a year – more than twice as much as：(a digital-only subscription).\n\n### 第7段\n\n\"It's a really hard thing to do + it's a tremendous luxury：(that BuzzFeed doesn't have：(a legacy business)),\" → Peretti remarked.\n\n\"But we're going to have：(questions like that)：(where we have things：(we're doing)：(that don't make sense：(when the market changes + the world changes))).\n\nIn those situations → it's better：(to be more aggressive：(than less aggressive)).\"","context":{"mode":"image","asset":"articleAnnotated","label":"2016英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>There will eventually come a day：(when The New York Times → ceases to publish stories：(on newsprint)).\u003c/p>\n\u003cp>Exactly when that day will be → is a matter of debate.\u003c/p>\n\u003cp>&quot;Sometime in the future,&quot; → the paper&#39;s publisher said：(back in 2010).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Nostalgia for ink on paper + the rustle of pages aside → there&#39;s plenty of incentive：(to ditch print).\u003c/p>\n\u003cp>The infrastructure required：(to make a physical newspaper)：(printing presses + delivery trucks) → isn&#39;t just expensive; // it&#39;s excessive：(at a time：(when online-only competitors → don&#39;t have the same set：(of financial constraints))).\u003c/p>\n\u003cp>Readers are migrating away：(from print anyway).\u003c/p>\n\u003cp>And though print ad sales → still dwarf：(their online and mobile counterparts) // revenue from print → is still declining.\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>Overhead may be high + circulation lower // but rushing to eliminate：(its print edition) → would be a mistake → says BuzzFeed CEO：(Jonah Peretti).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>Peretti says → the Times shouldn&#39;t waste time：(getting out of the print business) // but only if：(they go about doing it：(the right way)).\u003c/p>\n\u003cp>&quot;Figuring out a way：(to accelerate that transition) → tuations → it&#39;s better：(to be more aggressive：(than less aggressive)).&quot;\u003c/p>\n"},{"section":"第二鸟 · 精读与翻译","title":"中文版句子逻辑（选修)","level":2,"raw":"## 中文版句子逻辑（选修)\n\n### 第1段\n\n终将会有一天来临：(当《纽约时报》→ 停止发布故事：(在新闻纸上))。\n\n确切地说那一天何时到来 → 是一个争论的问题。\n\n\"未来某个时候，\" → 该报的出版商说：(早在2010年)。\n\n### 第2段\n\n对纸上油墨的怀旧 + 翻页的沙沙声除外 → 有大量的动机：(来抛弃印刷版)。\n\n所需的基础设施：(来制作实体报纸)：(印刷机 + 送货卡车) → 不仅仅是昂贵的；// 它是过度的：(在这个时候：(当纯在线竞争对手 → 没有同样的一套：(财务限制)))。\n\n读者正在迁移离开：(印刷版无论如何)。\n\n虽然印刷广告销售 → 仍然使相形见绌：(他们的在线和移动对应物) // 来自印刷的收入 → 仍在下降。\n\n### 第3段\n\n运营成本可能很高 + 发行量较低 // 但匆忙消除：(其印刷版) → 将是一个错误 → BuzzFeed首席执行官说：(乔纳·佩雷蒂)。\n\n### 第4段\n\n佩雷蒂说 → 《纽约时报》不应该浪费时间：(退出印刷业务) // 但只有在：(他们着手做这件事：(以正确的方式))。\n\n\"找出一种方法：(来加速这种转变) → 对他们来说是有意义的，\" → 他说 // \"但如果你中断它 → 你将会让：(你最忠诚的客户：(真的对你不满))。\"\n\n### 第5段\n\n有时候 → 那还是值得做出改变的。\n\n佩雷蒂举了例子：(Netflix的：(中断其DVD邮寄服务：(来专注于流媒体)))。\n\n\"这被视为一个失误，\" → 他说。\n\n这个举动结果证明 → 是有远见的。\n\n如果佩雷蒂 → 负责《纽约时报》呢？\n\n\"我不会选择一年：(来结束印刷)，\" → 他说。\n\n\"我会提高价格 + 将其变成：(更多的传承产品)。\"\n\n### 第6段\n\n最忠诚的客户 → 仍然会得到：(他们喜爱的产品) → 这个想法是 + 他们会感觉像是：(他们在帮助维持：(某物的质量：(他们相信的)))。\n\n\"所以如果你为印刷版支付过高费用 → 你可能会感觉像是：(你在帮忙)，\" → 佩雷蒂说。\n\n\"然后增加它：(以更高的速率)：(每年) + 基本上尝试：(产生额外收入)。\"\n\n换句话说 → 如果你要制作：(印刷产品) → 为那些人制作：(已经对它着迷的人)。\n\n这可能是：(《纽约时报》已经在做的)。\n\n获得印刷版：(每周七天) → 花费近500美元一年 – 超过两倍多：(纯数字订阅)。\n\n### 第7段\n\n\"这是一件非常困难的事情 + 这是一种巨大的奢侈：(BuzzFeed没有：(传统业务))，\" → 佩雷蒂评论道。\n\n\"但我们将会有：(这样的问题)：(当我们有一些事情：(我们正在做的)：(不再有意义：(当市场改变时 + 世界改变时)))。\n\n在那些情况下 → 更好的是：(更加积极进取：(而不是不够积极进取))。\"","context":{"mode":"image","asset":"articleAnnotated","label":"2016英语一Text 4重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003ch3>第1段\u003c/h3>\n\u003cp>终将会有一天来临：(当《纽约时报》→ 停止发布故事：(在新闻纸上))。\u003c/p>\n\u003cp>确切地说那一天何时到来 → 是一个争论的问题。\u003c/p>\n\u003cp>&quot;未来某个时候，&quot; → 该报的出版商说：(早在2010年)。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>对纸上油墨的怀旧 + 翻页的沙沙声除外 → 有大量的动机：(来抛弃印刷版)。\u003c/p>\n\u003cp>所需的基础设施：(来制作实体报纸)：(印刷机 + 送货卡车) → 不仅仅是昂贵的；// 它是过度的：(在这个时候：(当纯在线竞争对手 → 没有同样的一套：(财务限制)))。\u003c/p>\n\u003cp>读者正在迁移离开 \n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n在本篇文章里，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。","context":{"mode":"image","asset":"questions","focus":null,"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"kind":"section-cover","mergedIntro":true},"focusId":null,"html":"\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从40题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"40题 · 题干、题型与核心出处","level":2,"raw":"## 40题\n\n**Which of the following would be the best title of the text?**\n\n下面哪一项最适合作为本文标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Shift to Online Newspapers All at Once**\n\n立刻全面转向网络报纸\n\nB. **Cherish the Newspaper Still in Your Hand**\n\n珍惜你手中的纸质报纸\n\nC. **Keep Your Newspapers Forever in Fashion**\n\n让纸质报纸永远流行\n\nD. **Make Your Print Newspaper a Luxury Good**\n\n把纸质报纸做成奢侈品\n\n### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 这一段在说什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 提出《纽约时报》终有一天会停止纸质出版，但具体时间仍有争议 | 先摆出一个迟早会到来的变化 |\n| 2 | 说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降 | 回头解释维持原样为什么越来越难 |\n| 3 | 转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误 | 但话说回来立刻停下也不对 |\n| 4 | 佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客 | 接着提出一种渐进调整办法 |\n| 5 | 以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品 | 再举一个例子说明转向也能成功 |\n| 6 | 说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品 | 然后说明怎样保住核心价值 |\n| 7 | 总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法 | 最后说环境变化时要更果断 |","context":{"mode":"image","asset":"questions","focus":[250,2358,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"question":"40","kind":"question"},"focusId":null,"html":"\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一项最适合作为本文标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>Shift to Online Newspapers All at Once\u003c/strong>\u003c/p>\n\u003cp>立刻全面转向网络报纸\u003c/p>\n\u003cp>B. \u003cstrong>Cherish the Newspaper Still in Your Hand\u003c/strong>\u003c/p>\n\u003cp>珍惜你手中的纸质报纸\u003c/p>\n\u003cp>C. \u003cstrong>Keep Your Newspapers Forever in Fashion\u003c/strong>\u003c/p>\n\u003cp>让纸质报纸永远流行\u003c/p>\n\u003cp>D. \u003cstrong>Make Your Print Newspaper a Luxury Good\u003c/strong>\u003c/p>\n\u003cp>把纸质报纸做成奢侈品\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>提出《纽约时报》终有一天会停止纸质出版，但具体时间仍有争议\u003c/td>\n\u003ctd>先摆出一个迟早会到来的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降\u003c/td>\n\u003ctd>回头解释维持原样为什么越来越难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误\u003c/td>\n\u003ctd>但话说回来立刻停下也不对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客\u003c/td>\n\u003ctd>接着提出一种渐进调整办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品\u003c/td>\n\u003ctd>再举一个例子说明转向也能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/td>\n\u003ctd>然后说明怎样保住核心价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法\u003c/td>\n\u003ctd>最后说环境变化时要更果断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"section":"第三鸟 · 题目复盘","title":"A. Shift to Online Newspapers All at Once","level":3,"raw":"**Which of the following would be the best title of the text?**\n\n### A. Shift to Online Newspapers All at Once\n\n立刻全面转向网络报纸","context":{"mode":"image","asset":"questions","focus":[250,2358,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"A"},"focusId":"focus-q40-A-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>立刻全面转向网络报纸\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. Shift to Online Newspapers All at Once","level":3,"raw":"#### 如果 A 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n立刻全面转向网络报纸\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 提出纸报全面转向网络已迫在眉睫，论证最终应一次性完成转换。 | 先摆出一个迟早会到来的变化 |\n| 2 | 解释成本和读者变化为何使保留纸报越来越难，从而强化全面上线的必要性。 | 回头解释维持原样为什么越来越难 |\n| 3 | 承认准备不足时立刻关停有风险，把这个限制作为一次性转网前必须解决的问题。 | 但话说回来立刻停下也不对 |\n| 4 | 提出过渡准备步骤，为在同一节点全面转成网络产品扫清障碍。 | 接着提出一种渐进调整办法 |\n| 5 | 用一次性退出旧业务而成功的案例，支持全面转网的可行性。 | 再举一个例子说明转向也能成功 |\n| 6 | 说明全面上线后怎样以数字产品保住新闻质量和核心读者价值。 | 然后说明怎样保住核心价值 |\n| 7 | 要求条件具备后果断完成全线转网，而不再延长纸报存在。 | 最后说环境变化时要更果断 |\n\nA只抓住“终有一天停止纸质出版”，却把文章反复强调的渐进转型改成“一次完成”。第三段明确说匆忙取消是错误，第四段也警告直接停掉会惹恼忠诚顾客。\n网飞例子并不是证明所有旧业务都应立即切断，而是说明转型可能值得做；佩雷蒂随后马上提出不设某个停印年份，而是提高价格、改变产品定位。\nA无法解释第五、六段为何花大量篇幅设计高价纸质产品。若要all at once，这些过渡安排都没有必要。\n\n判断：\n\n**A 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2358,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-A","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"A"},"focusId":"focus-q40-A-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-A-0\">\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>立刻全面转向网络报纸\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-A-1\">\u003ch4>如果 A 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>立刻全面转向网络报纸\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>提出纸报全面转向网络已迫在眉睫，论证最终应一次性完成转换。\u003c/td>\n\u003ctd>先摆出一个迟早会到来的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释成本和读者变化为何使保留纸报越来越难，从而强化全面上线的必要性。\u003c/td>\n\u003ctd>回头解释维持原样为什么越来越难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>承认准备不足时立刻关停有风险，把这个限制作为一次性转网前必须解决的问题。\u003c/td>\n\u003ctd>但话说回来立刻停下也不对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>提出过渡准备步骤，为在同一节点全面转成网络产品扫清障碍。\u003c/td>\n\u003ctd>接着提出一种渐进调整办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>用一次性退出旧业务而成功的案例，支持全面转网的可行性。\u003c/td>\n\u003ctd>再举一个例子说明转向也能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明全面上线后怎样以数字产品保住新闻质量和核心读者价值。\u003c/td>\n\u003ctd>然后说明怎样保住核心价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求条件具备后果断完成全线转网，而不再延长纸报存在。\u003c/td>\n\u003ctd>最后说环境变化时要更果断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A只抓住“终有一天停止纸质出版”，却把文章反复强调的渐进转型改成“一次完成”。第三段明确说匆忙取消是错误，第四段也警告直接停掉会惹恼忠诚顾客。\n网飞例子并不是证明所有旧业务都应立即切断，而是说明转型可能值得做；佩雷蒂随后马上提出不设某个停印年份，而是提高价格、改变产品定位。\nA无法解释第五、六段为何花大量篇幅设计高价纸质产品。若要all at once，这些过渡安排都没有必要。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Cherish the Newspaper Still in Your Hand","level":3,"raw":"**Which of the following would be the best title of the text?**\n\n### B. Cherish the Newspaper Still in Your Hand\n\n珍惜你手中的纸质报纸","context":{"mode":"image","asset":"questions","focus":[250,2358,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"B"},"focusId":"focus-q40-B-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>珍惜你手中的纸质报纸\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. Cherish the Newspaper Still in Your Hand","level":3,"raw":"#### 如果 B 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n珍惜你手中的纸质报纸\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 以纸报迟早离场的变化唤起读者珍惜仍在手中的纸质产品。 | 先摆出一个迟早会到来的变化 |\n| 2 | 解释维持纸报日益困难，让珍惜当下拥有的理由更迫切。 | 回头解释维持原样为什么越来越难 |\n| 3 | 指出不能因终将退出就立刻停止使用和欣赏纸报。 | 但话说回来立刻停下也不对 |\n| 4 | 介绍读者在转型中继续支持、订阅和珍惜纸报的渐进办法。 | 接着提出一种渐进调整办法 |\n| 5 | 用产品转型仍保住珍贵体验的例子说明这种珍惜可以延续。 | 再举一个例子说明转向也能成功 |\n| 6 | 解释怎样保存纸张阅读的核心体验，使珍惜不只停在怀旧情绪。 | 然后说明怎样保住核心价值 |\n| 7 | 呼吁读者在环境变化时更果断支持自己仍珍视的纸报。 | 最后说环境变化时要更果断 |\n\nB把文章写成对纸质报纸的怀旧赞歌，但第二段开头只是说先把纸墨怀旧放在一边，随后集中讨论成本与收入。作者并未号召读者无条件保存纸质版。\n佩雷蒂确实想保住最忠诚顾客，但方法是涨价和小众化，不是要求所有人珍惜手中报纸。文章的重点是经营转型，不是抒情怀旧。\n最后一段还说市场变化时应更积极处理不合理做法，与“无论如何都珍惜纸质版”的静止态度相反。\n\n判断：\n\n**B 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2358,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-B","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"B"},"focusId":"focus-q40-B-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-B-0\">\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>珍惜你手中的纸质报纸\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-B-1\">\u003ch4>如果 B 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>珍惜你手中的纸质报纸\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以纸报迟早离场的变化唤起读者珍惜仍在手中的纸质产品。\u003c/td>\n\u003ctd>先摆出一个迟早会到来的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释维持纸报日益困难，让珍惜当下拥有的理由更迫切。\u003c/td>\n\u003ctd>回头解释维持原样为什么越来越难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>指出不能因终将退出就立刻停止使用和欣赏纸报。\u003c/td>\n\u003ctd>但话说回来立刻停下也不对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>介绍读者在转型中继续支持、订阅和珍惜纸报的渐进办法。\u003c/td>\n\u003ctd>接着提出一种渐进调整办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>用产品转型仍保住珍贵体验的例子说明这种珍惜可以延续。\u003c/td>\n\u003ctd>再举一个例子说明转向也能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>解释怎样保存纸张阅读的核心体验，使珍惜不只停在怀旧情绪。\u003c/td>\n\u003ctd>然后说明怎样保住核心价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>呼吁读者在环境变化时更果断支持自己仍珍视的纸报。\u003c/td>\n\u003ctd>最后说环境变化时要更果断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B把文章写成对纸质报纸的怀旧赞歌，但第二段开头只是说先把纸墨怀旧放在一边，随后集中讨论成本与收入。作者并未号召读者无条件保存纸质版。\n佩雷蒂确实想保住最忠诚顾客，但方法是涨价和小众化，不是要求所有人珍惜手中报纸。文章的重点是经营转型，不是抒情怀旧。\n最后一段还说市场变化时应更积极处理不合理做法，与“无论如何都珍惜纸质版”的静止态度相反。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Keep Your Newspapers Forever in Fashion","level":3,"raw":"**Which of the following would be the best title of the text?**\n\n### C. Keep Your Newspapers Forever in Fashion\n\n让纸质报纸永远流行","context":{"mode":"image","asset":"questions","focus":[250,2358,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"C"},"focusId":"focus-q40-C-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>让纸质报纸永远流行\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Keep Your Newspapers Forever in Fashion","level":3,"raw":"#### 如果 C 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n让纸质报纸永远流行\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 承认阅读载体终将变化，提出纸报需要调整以维持长久流行。 | 先摆出一个迟早会到来的变化 |\n| 2 | 说明旧样式、成本或传播方式使纸报维持流行越来越难。 | 回头解释维持原样为什么越来越难 |\n| 3 | 指出立即停刊会中断纸报的时尚影响，不利于长期流行目标。 | 但话说回来立刻停下也不对 |\n| 4 | 提出逐步更新形式和体验的办法，让纸报持续吸引公众。 | 接着提出一种渐进调整办法 |\n| 5 | 用传统产品成功重新流行的案例证明纸报也能保持时尚。 | 再举一个例子说明转向也能成功 |\n| 6 | 解释怎样保留新闻和阅读体验的独特价值，使吸引力长期不衰。 | 然后说明怎样保住核心价值 |\n| 7 | 要求面对市场变化更果断创新，以维持纸报持续的大众流行。 | 最后说环境变化时要更果断 |\n\nC要求报纸永远流行，全文却承认读者迁移、纸质收入下降以及纸质版迟早停印。作者没有提出重新扩大大众销量的计划。\n第五、六段的方案是提高价格，把纸质版留给已经深爱它的核心顾客。这会把产品做得更小众，而不是维持普遍流行。\n标题中的Forever也与第一段的eventually ceases正面冲突，C无法容纳文章的时间判断。\n\n判断：\n\n**C 不保留。**","context":{"mode":"image","asset":"questions","focus":[250,2358,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-C","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"C"},"focusId":"focus-q40-C-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-C-0\">\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>让纸质报纸永远流行\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-C-1\">\u003ch4>如果 C 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>让纸质报纸永远流行\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>承认阅读载体终将变化，提出纸报需要调整以维持长久流行。\u003c/td>\n\u003ctd>先摆出一个迟早会到来的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明旧样式、成本或传播方式使纸报维持流行越来越难。\u003c/td>\n\u003ctd>回头解释维持原样为什么越来越难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>指出立即停刊会中断纸报的时尚影响，不利于长期流行目标。\u003c/td>\n\u003ctd>但话说回来立刻停下也不对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>提出逐步更新形式和体验的办法，让纸报持续吸引公众。\u003c/td>\n\u003ctd>接着提出一种渐进调整办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>用传统产品成功重新流行的案例证明纸报也能保持时尚。\u003c/td>\n\u003ctd>再举一个例子说明转向也能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>解释怎样保留新闻和阅读体验的独特价值，使吸引力长期不衰。\u003c/td>\n\u003ctd>然后说明怎样保住核心价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求面对市场变化更果断创新，以维持纸报持续的大众流行。\u003c/td>\n\u003ctd>最后说环境变化时要更果断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C要求报纸永远流行，全文却承认读者迁移、纸质收入下降以及纸质版迟早停印。作者没有提出重新扩大大众销量的计划。\n第五、六段的方案是提高价格，把纸质版留给已经深爱它的核心顾客。这会把产品做得更小众，而不是维持普遍流行。\n标题中的Forever也与第一段的eventually ceases正面冲突，C无法容纳文章的时间判断。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Make Your Print Newspaper a Luxury Good","level":3,"raw":"**Which of the following would be the best title of the text?**\n\n### D. Make Your Print Newspaper a Luxury Good\n\n把纸质报纸做成奢侈品","context":{"mode":"image","asset":"questions","focus":[250,2358,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":false,"partIndex":0,"kind":"main-option","question":"40","option":"D"},"focusId":"focus-q40-D-0","html":"\u003csection class=\"revealPart\" id=\"focus-q40-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>把纸质报纸做成奢侈品\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Make Your Print Newspaper a Luxury Good","level":3,"raw":"#### 如果 D 是主旨，文章7段应该怎么写？\n\n如果全文主旨真的是：\n\n把纸质报纸做成奢侈品\n\n那文章7段应该大概这样展开：\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 承认纸报终有退出日，为如何在转型期间重设纸报价值提出问题。 | 先摆出一个迟早会到来的变化 |\n| 2 | 解释昂贵基础设施与读者迁移为什么使旧的大众纸报模式难以维持。 | 回头解释维持原样为什么越来越难 |\n| 3 | 指出仓促终止会伤害忠实客户，转型不能等同于立刻撤销产品。 | 但话说回来立刻停下也不对 |\n| 4 | 提出有策略地加快转型，以新定位和价格逐步调整纸报业务。 | 接着提出一种渐进调整办法 |\n| 5 | 用Netflix转向的案例说明果断变化可行，再落到纸报提价的设想。 | 再举一个例子说明转向也能成功 |\n| 6 | 说明让忠实者为质量多付费，既保留偏好又使纸报成为有收入的奢侈产品。 | 然后说明怎样保住核心价值 |\n| 7 | 承认旧业务难转，再要求市场变化时积极实施这种产品重置。 | 最后说环境变化时要更果断 |\n\nD能覆盖全文。文章先承认纸质版迟早结束，再说明当前大众模式越来越难维持；随后拒绝仓促停印，提出涨价、照顾忠诚顾客并把纸质版重新定位为高价保留产品。\n“luxury good”准确抓住第五、六段的核心经营设计：最忠诚顾客继续获得喜欢的产品，愿意为维持其品质多付钱，报社通过逐年涨价获得额外收入。\n结尾对变化环境中更积极行动的主张，也支持把传统业务从大众产品改造成小众高价产品，而不是僵硬维持原样或一次性取消。\n\n判断：\n\n**D 保留。**","context":{"mode":"image","asset":"questions","focus":[250,2358,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-40-option-D","cumulativeFinal":true,"partIndex":1,"kind":"main-option","question":"40","option":"D"},"focusId":"focus-q40-D-1","html":"\u003csection class=\"revealPart\" id=\"focus-q40-D-0\">\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>把纸质报纸做成奢侈品\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q40-D-1\">\u003ch4>如果 D 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>把纸质报纸做成奢侈品\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>承认纸报终有退出日，为如何在转型期间重设纸报价值提出问题。\u003c/td>\n\u003ctd>先摆出一个迟早会到来的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释昂贵基础设施与读者迁移为什么使旧的大众纸报模式难以维持。\u003c/td>\n\u003ctd>回头解释维持原样为什么越来越难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>指出仓促终止会伤害忠实客户，转型不能等同于立刻撤销产品。\u003c/td>\n\u003ctd>但话说回来立刻停下也不对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>提出有策略地加快转型，以新定位和价格逐步调整纸报业务。\u003c/td>\n\u003ctd>接着提出一种渐进调整办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>用Netflix转向的案例说明果断变化可行，再落到纸报提价的设想。\u003c/td>\n\u003ctd>再举一个例子说明转向也能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明让忠实者为质量多付费，既保留偏好又使纸报成为有收入的奢侈产品。\u003c/td>\n\u003ctd>然后说明怎样保住核心价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>承认旧业务难转，再要求市场变化时积极实施这种产品重置。\u003c/td>\n\u003ctd>最后说环境变化时要更果断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D能覆盖全文。文章先承认纸质版迟早结束，再说明当前大众模式越来越难维持；随后拒绝仓促停印，提出涨价、照顾忠诚顾客并把纸质版重新定位为高价保留产品。\n“luxury good”准确抓住第五、六段的核心经营设计：最忠诚顾客继续获得喜欢的产品，愿意为维持其品质多付钱，报社通过逐年涨价获得额外收入。\n结尾对变化环境中更积极行动的主张，也支持把传统业务从大众产品改造成小众高价产品，而不是僵硬维持原样或一次性取消。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 保留。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"40题结论","level":2,"raw":"### 40题结论\n\n**40. D. Make Your Print Newspaper a Luxury Good**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Make Your Print Newspaper a Luxury Good / 把纸质报纸做成奢侈品**","context":{"mode":"image","asset":"questions","focus":[250,2358,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"question":"40","questionConclusion":true},"focusId":null,"html":"\u003cp>\u003cstrong>40. D. Make Your Print Newspaper a Luxury Good\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Make Your Print Newspaper a Luxury Good / 把纸质报纸做成奢侈品\u003c/strong>\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"36题 · 题干、题型与核心出处","level":2,"raw":"## 36题\n\n> The New York Times is considering ending its print edition partly due to ______.  \n> 《纽约时报》考虑结束纸质版，部分原因是什么？\n\n### 题型\n\n原因细节题。题干要求判断“《纽约时报》考虑结束纸质版，部分原因是什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Nostalgia for ink on paper and the rustle of pages aside, there's plenty of incentive to ditch print. The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn't just expensive; it's excessive at a time when online-only competitors don't have the same set of financial constraints. Readers are migrating away from print anyway. And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\n\n第二段列印刷机与运输车带来的昂贵基础设施，比较没有这类负担的线上竞争者，再说读者迁移和纸质广告收入下降。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"question":"36","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>The New York Times is considering ending its print edition partly due to ______.\u003cbr>《纽约时报》考虑结束纸质版，部分原因是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“《纽约时报》考虑结束纸质版，部分原因是什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Nostalgia for ink on paper and the rustle of pages aside, there&#39;s plenty of incentive to ditch print. The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints. Readers are migrating away from print anyway. And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\u003c/p>\n\u003c/blockquote>\n\u003cp>第二段列印刷机与运输车带来的昂贵基础设施，比较没有这类负担的线上竞争者，再说读者迁移和纸质广告收入下降。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. the increasing online ad sales","level":3,"raw":"### A. the increasing online ad sales\n\n> 线上广告销售的增长\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。\n\n**错误类型：第三类——无中生有。**\n\n原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。\n\n两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。\n\n**命题人借用的原文材料：**\n\n> And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"36","option":"A"},"focusId":"focus-q36-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-A-0\">\u003cblockquote>\n\u003cp>线上广告销售的增长\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。\u003c/p>\n\u003cp>两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. the increasing online ad sales","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 《纽约时报》考虑停办纸质版，部分原因是线上广告销售的增长。\n\nA里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。\n\n原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。\n\nA若成立，段中需要直接比较网络广告收入前后变化，或说明网络广告增长挤压纸质版；现在真正写出的收入趋势只有print revenue declining。\n\n两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"36","option":"A"},"focusId":"focus-q36-A-1 广告快速增长，已使印刷版变得不再必要。\n\n线上广告增长必须有增长事实并与停刊形成原因关系。实际只比较纸质广告仍更大以及纸质收入下降，不能补出线上高速增长。","context":{"mode":"image","asset":"questions","focus":[250,341,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"36","option":"A"},"focusId":"focus-q36-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-A-0\">\u003cblockquote>\n\u003cp>线上广告销售的增长\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。\u003c/p>\n\u003cp>两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>《纽约时报》考虑停办纸质版，部分原因是线上广告销售的增长。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。\u003c/p>\n\u003cp>原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。\u003c/p>\n\u003cp>A若成立，段中需要直接比较网络广告收入前后变化，或说明网络广告增长挤压纸质版；现在真正写出的收入趋势只有print revenue declining。\u003c/p>\n\u003cp>两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p> 发生，但原文只明确给出前者，A把收入项目和变化方向都换了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>《纽约时报》考虑停办纸质版，部分原因是线上广告销售的增长。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。\u003c/p>\n\u003cp>原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。\u003c/p>\n\u003cp>A若成立，段中需要直接比较网络广告收入前后变化，或说明网络广告增长挤压纸质版；现在真正写出的收入趋势只有print revenue declining。\u003c/p>\n\u003cp>两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\u003c/p>\n\u003cp>第二段列印刷机与运输车带来的昂贵基础设施，比较没有这类负担的线上竞争者，再说读者迁移和纸质广告收入下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Rapid growth in online advertising has made the print edition unnecessary.\u003c/p>\n\u003cp>网络广告快速增长，已使印刷版变得不再必要。\u003c/p>\n\u003c/blockquote>\n\u003cp>线上广告增长必须有增长事实并与停刊形成原因关系。实际只比较纸质广告仍更大以及纸质收入下降，不能补出线上高速增长。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨讨论怎样重 c/strong>\u003c/p>\n\u003cp>原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。B的“pressure from its investors”则需要投资者作为施压主体。\u003c/p>\n\u003cp>原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. the pressure from its investors","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 《纽约时报》考虑停办纸质版，部分原因是来自投资者的压力。\n\nB里的“pressure from its investors”和原文“online-only competitors don’t have the same set of financial constraints”都在谈财务压力来源，因为选项说投资者施压，原文说实体报纸相对纯网络竞争者承担更多成本限制，所以回看第二段关于基础设施的句子。\n\n原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。B的“pressure from its investors”则需要投资者作为施压主体。\n\n第二段出现的是printing presses、delivery trucks、expensive和competitors，说明纸质生产本身昂贵；没有股东、董事会、回报要求或投资者意见。B把成本结构问题改成人际或治理压力。\n\n即使企业因成本高而让投资者担忧，也需要额外一句把投资者与结束纸质版连接起来。当前段落没有这条主体关系。\n\n原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。","context":{"mode":"image","asset":"questions","focus":[250,430,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"36","option":"B"},"focusId":"focus-q36-B-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-B-0\">\u003cblockquote>\n\u003cp>来自投资者的压力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“pressure from its investors”和原文“online-only competitors don’t have the same set of financial constraints”都在谈财务压力来源，因为选项说投资者施压，原文说实体报纸相对纯网络竞争者承担更多成本限制，所以回看第二段关于基础设施的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u 资者正在向《纽约时报》施压，要求停止纸质出版。\n\n投资者施压应交代谁要求停刊。实际段落比较运营负担和收入，没有投资者发言或施压行为。","context":{"mode":"image","asset":"questions","focus":[250,430,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"36","option":"B"},"focusId":"focus-q36-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-B-0\">\u003cblockquote>\n\u003cp>来自投资者的压力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“pressure from its investors”和原文“online-only competitors don’t have the same set of financial constraints”都在谈财务压力来源，因为选项说投资者施压，原文说实体报纸相对纯网络竞争者承担更多成本限制，所以回看第二段关于基础设施的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。B的“pressure from its investors”则需要投资者作为施压主体。\u003c/p>\n\u003cp>原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>《纽约时报》考虑停办纸质版，部分原因是来自投资者的压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“pressure from its investors”和原文“online-only competitors don’t have the same set of financial constraints”都在谈财务压力来源，因为选项说投资者施压，原文说实体报纸相对纯网络竞争者承担更多成本限制，所以回看第二段关于基础设施的句子。\u003c/p>\n\u003cp>原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。B的“pressure from its investors”则需要投资者作为施压主体。\u003c/p>\n\u003cp>第二段出现的是printing presses、delivery trucks、expensive和competitors，说明纸质生产本身昂贵；没有股东、董事会、回报要求或投资者意见。B把成本结构问题改成人际或治理压力。\u003c/p>\n\u003cp>即使企业因成本高而让投资者担忧，也需要额外一句把投资者与结束纸质版连接起来。当前段落没有这条主体关系。\u003c/p>\n\u003cp>原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints.\u003c/p>\n\u003cp>第二段列印刷机与运输车带来的昂贵基础设施，比较没有这类负担的线上竞争者，再说读者迁移和纸质广告收入下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Investors are pressing the Times to stop publishing on paper.\u003c/p>\n\u003cp>投资者正在向《纽约时报》施压，要求停止纸质出版。\u003c/p>\n\u003c/blockquote>\n\u003cp>投资者施压应交代谁要求停刊。实际段落比较运营负担和收入，没有投资者发言或施压行为。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. the pressure from its investors","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Make Your Print Newspaper a Luxury Good  \n> 把纸质报纸做成奢侈品\n\n把这个主旨直接代入36题题干：\n\n> 主旨讨论怎样重置纸报产品，承认旧模式存在经济压力；停刊诱因仍需由第二段的成本、收入和读者变化确认。\n\nB实际说的是：\n\n> the pressure from its investors  \n> 来自投资者的压力\n\n原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。\n\n从全文推进看，这一处的作用是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：B错误。**","context":{"mode":"image","asset":"questions","focus":[250,430,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"36","option":"B"},"focusId":"focus-q36-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-B-0\">\u003cblockquote>\n\u003cp>来自投资者的压力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u0 t 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"36","option":"C"},"focusId":"focus-q36-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-C-0\">\u003cblockquote>\n\u003cp>读者的抱怨\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“complaints from its readers”和原文“Readers are migrating away from print”都涉及读者对纸质版的反应，因为选项说读者投诉，原文写读者用离开纸质版的行为作出选择，所以回看第二段倒数第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“Readers are migrating away from print”写的是读者数量或阅读习惯在迁移，是一种市场行为。C的“complaints from its readers”写的是读者主动表达不满，是另一种行动。\u003c/p>\n\u003cp>原文已经把读者反应写成migrating away，C改成complaints，没有后续句子支持这次改写，所以C排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Readers are migrating away from print anyway.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. the complaints from its readers","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 《纽约时报》考虑停办纸质版，部分原因是读者的抱怨。\n\nC里的“complaints from its readers”和原文“Readers are migrating away from print”都涉及读者对纸质版的反应，因为选项说读者投诉，原文写读者用离开纸质版的行为作出选择，所以回看第二段倒数第二句。\n\n原文“Readers are migrating away from print”写的是读者数量或阅读习惯在迁移，是一种市场行为。C的“complaints from its readers”写的是读者主动表达不满，是另一种行动。\n\n离开纸质版可能源于价格、便利性或媒介习惯，不能自动证明读者向报社投诉。段中没有complain、protest、demand或读者要求停印的内容。\n\n更重要的是，读者迁移会削弱纸质版需求；读者抱怨却可能是抱怨停印本身。C没有说明抱怨内容，无法与原文的迁移方向合并。\n\n原文已经把读者反应写成migrating away，C改成complaints，没有后续句子支持这次改写，所以C排除。","context":{"mode":"image","asset":"questions","focus":[250,517,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"36","option":"C"},"focusId":"focus-q36-C-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-C-0\">\u003cblockquote>\n\u003cp>读者的抱怨\u003c/p>\n ckquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Readers have complained that the print edition should be closed.\u003c/p>\n\u003cp>读者抱怨并要求关闭印刷版。\u003c/p>\n\u003c/blockquote>\n\u003cp>读者迁移不是投诉要求停刊；实际后文反而担心停刊令最忠实读者不满，投诉不能从迁移中补出来。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. the complaints from its readers","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Make Your Print Newspaper a Luxury Good  \n> 把纸质报纸做成奢侈品\n\n把这个主旨直接代入36题题干：\n\n> 主旨讨论怎样重置纸报产品，承认旧模式存在经济压力；停刊诱因仍需由第二段的成本、收入和读者变化确认。\n\nC实际说的是：\n\n> the complaints from its readers  \n> 读者的抱怨\n\n原文已经把读者反应写成migrating away，C改成complaints，没有后续句子支持这次改写，所以C排除。\n\n从全文推进看，这一处的作用是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：C错误。**","context":{"mode":"image","asset":"questions","focus":[250,517,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"36","option":"C"},"focusId":"focus-q36-C-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-C-0\">\u003cblockquote>\n\u003cp>读者的抱怨\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“complaints from its readers”和原文“Readers are migrating away from print”都涉及读者对纸质版的反应，因为选项说读者投诉，原文写读者用离开纸质版的行为作出选择，所以回看第二段倒数第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“Readers are migrating away from print”写的是读者数量或阅读习惯在迁移，是一种市场行为。C的“complaints from its readers”写的是读者主动表达不满，是另一种行动。\u003c/p>\n\u003cp>原文已经把读者反应写成migrating away，C改成complaints，没有后续句子支持这次改写，所以C排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Readers are migrating away from print anyway.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection cla 施，又面对读者迁移和纸质收入下降\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. the high cost of operation","level":3,"raw":"### D. the high cost of operation\n\n> 高昂的运营成本\n\n**做题模式中的状态：** 第一轮D保留。当时选项呈现为“the high cost of [xxx]”，保留了相应遮挡。当时的定位线索是：D里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。\n\n**选项类型：正确同义改写。**\n\n原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。\n\n题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\n\n**正确选项的原文依据：**\n\n> The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn't just expensive; it's excessive at a time when online-only competitors don't have the same set of financial constraints.","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"36","option":"D"},"focusId":"focus-q36-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-D-0\">\u003cblockquote>\n\u003cp>高昂的运营成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“the high cost of [xxx]”，保留了相应遮挡。当时的定位线索是：D里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。\u003c/p>\n\u003cp>题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. the high cost of operation","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 《纽约时报》考虑停办纸质版，部分原因是高昂的运营成本。\n\nD里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。\n\n原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。\n\n两边都围绕实体印刷和配送的运营负担，没有把原因换成广告、投资者或读者抱怨。\n\n题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"36","option":"D"},"focusId":"focus-q36-D-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-D-0\">\u003cblockquote>\n\u003cp>高昂的运营成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“the high cost of [xxx]”，保留了相应遮挡。当时的定位线索是：D里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。\u003c/p>\n\u003cp>题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q36-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>《纽约时报》考虑停办纸质版，部分原因是高昂的运营成本。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。\u003c/p>\n\u003cp>原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。\u003c/p>\n\u003cp>两边都围绕实体印刷和配送的运营负担，没有把原因换成广告、投资者或读者抱怨。\u003c/p>\n\u003cp>题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. the high cost of operation","level":4,"raw":"#### 写作视角法\n\n原文第2段是这样写的：\n\n> The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn't just expensive; it's excessive at a time when online-only competitors don't have the same set of financial constraints.\n>\n> 第二段列印刷机与运输车带来的昂贵基础设施，比较没有这类负担的线上竞争者，再说读者迁移和纸质广告收入下降。\n\n把这一处放回全文，它承担的写作任务是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The cost of operating printing presses and delivery trucks gives the Times an incentive to leave print.\n>\n> 运行印刷机和送货卡车的成本，使《纽约时报》有动机离开纸质出版。\n\n印刷机、运输车都是运营所需基础设施，expensive与financial constraints构成成本压力，选项概括了这些具体项目。","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"36","option":"D"},"focusId":"focus-q36-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-D-0\">\u003cblockquote>\n\u003cp>高昂的运营成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“the high cost of [xxx]”，保留了相应遮挡。当时的定位线索是：D里的“high cost of”和原文“isn’t just expen
