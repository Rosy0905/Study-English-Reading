>提出纸报全面转向网络已迫在眉睫，论证最终应一次性完成转换。\u003c/td>\n\u003ctd>先摆出一个迟早会到来的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释成本和读者变化为何使保留纸报越来越难，从而强化全面上线的必要性。\u003c/td>\n\u003ctd>回头解释维持原样为什么越来越难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>承认准备不足时立刻关停有风险，把这个限制作为一次性转网前必须解决的问题。\u003c/td>\n\u003ctd>但话说回来立刻停下也不对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>提出过渡准备步骤，为在同一节点全面转成网络产品扫清障碍。\u003c/td>\n\u003ctd>接着提出一种渐进调整办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>用一次性退出旧业务而成功的案例，支持全面转网的可行性。\u003c/td>\n\u003ctd>再举一个例子说明转向也能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明全面上线后怎样以数字产品保住新闻质量和核心读者价值。\u003c/td>\n\u003ctd>然后说明怎样保住核心价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求条件具备后果断完成全线转网，而不再延长纸报存在。\u003c/td>\n\u003ctd>最后说环境变化时要更果断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A只抓住“终有一天停止纸质出版”，却把文章反复强调的渐进转型改成“一次完成”。第三段明确说匆忙取消是错误，第四段也警告直接停掉会惹恼忠诚顾客。\n网飞例子并不是证明所有旧业务都应立即切断，而是说明转型可能值得做；佩雷蒂随后马上提出不设某个停印年份，而是提高价格、改变产品定位。\nA无法解释第五、六段为何花大量篇幅设计高价纸质产品。若要all at once，这些过渡安排都没有必要。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>B. Cherish the Newspaper Still in Your Hand\u003c/h3>\n\u003cp>珍惜你手中的纸质报纸\u003c/p>\n\u003ch4>如果 B 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>珍惜你手中的纸质报纸\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以纸报迟早离场的变化唤起读者珍惜仍在手中的纸质产品。\u003c/td>\n\u003ctd>先摆出一个迟早会到来的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释维持纸报日益困难，让珍惜当下拥有的理由更迫切。\u003c/td>\n\u003ctd>回头解释维持原样为什么越来越难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>指出不能因终将退出就立刻停止使用和欣赏纸报。\u003c/td>\n\u003ctd>但话说回来立刻停下也不对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>介绍读者在转型中继续支持、订阅和珍惜纸报的渐进办法。\u003c/td>\n\u003ctd>接着提出一种渐进调整办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>用产品转型仍保住珍贵体验的例子说明这种珍惜可以延续。\u003c/td>\n\u003ctd>再举一个例子说明转向也能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>解释怎样保存纸张阅读的核心体验，使珍惜不只停在怀旧情绪。\u003c/td>\n\u003ctd>然后说明怎样保住核心价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>呼吁读者在环境变化时更果断支持自己仍珍视的纸报。\u003c/td>\n\u003ctd>最后说环境变化时要更果断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B把文章写成对纸质报纸的怀旧赞歌，但第二段开头只是说先把纸墨怀旧放在一边，随后集中讨论成本与收入。作者并未号召读者无条件保存纸质版。\n佩雷蒂确实想保住最忠诚顾客，但方法是涨价和小众化，不是要求所有人珍惜手中报纸。文章的重点是经营转型，不是抒情怀旧。\n最后一段还说市场变化时应更积极处理不合理做法，与“无论如何都珍惜纸质版”的静止态度相反。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>C. Keep Your Newspapers Forever in Fashion\u003c/h3>\n\u003cp>让纸质报纸永远流行\u003c/p>\n\u003ch4>如果 C 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>让纸质报纸永远流行\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>承认阅读载体终将变化，提出纸报需要调整以维持长久流行。\u003c/td>\n\u003ctd>先摆出一个迟早会到来的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>说明旧样式、成本或传播方式使纸报维持流行越来越难。\u003c/td>\n\u003ctd>回头解释维持原样为什么越来越难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>指出立即停刊会中断纸报的时尚影响，不利于长期流行目标。\u003c/td>\n\u003ctd>但话说回来立刻停下也不对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>提出逐步更新形式和体验的办法，让纸报持续吸引公众。\u003c/td>\n\u003ctd>接着提出一种渐进调整办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>用传统产品成功重新流行的案例证明纸报也能保持时尚。\u003c/td>\n\u003ctd>再举一个例子说明转向也能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>解释怎样保留新闻和阅读体验的独特价值，使吸引力长期不衰。\u003c/td>\n\u003ctd>然后说明怎样保住核心价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>要求面对市场变化更果断创新，以维持纸报持续的大众流行。\u003c/td>\n\u003ctd>最后说环境变化时要更果断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C要求报纸永远流行，全文却承认读者迁移、纸质收入下降以及纸质版迟早停印。作者没有提出重新扩大大众销量的计划。\n第五、六段的方案是提高价格，把纸质版留给已经深爱它的核心顾客。这会把产品做得更小众，而不是维持普遍流行。\n标题中的Forever也与第一段的eventually ceases正面冲突，C无法容纳文章的时间判断。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following would be the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>D. Make Your Print Newspaper a Luxury Good\u003c/h3>\n\u003cp>把纸质报纸做成奢侈品\u003c/p>\n\u003ch4>如果 D 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>把纸质报纸做成奢侈品\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>承认纸报终有退出日，为如何在转型期间重设纸报价值提出问题。\u003c/td>\n\u003ctd>先摆出一个迟早会到来的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>解释昂贵基础设施与读者迁移为什么使旧的大众纸报模式难以维持。\u003c/td>\n\u003ctd>回头解释维持原样为什么越来越难\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>指出仓促终止会伤害忠实客户，转型不能等同于立刻撤销产品。\u003c/td>\n\u003ctd>但话说回来立刻停下也不对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>提出有策略地加快转型，以新定位和价格逐步调整纸报业务。\u003c/td>\n\u003ctd>接着提出一种渐进调整办法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>用Netflix转向的案例说明果断变化可行，再落到纸报提价的设想。\u003c/td>\n\u003ctd>再举一个例子说明转向也能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>说明让忠实者为质量多付费，既保留偏好又使纸报成为有收入的奢侈产品。\u003c/td>\n\u003ctd>然后说明怎样保住核心价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>承认旧业务难转，再要求市场变化时积极实施这种产品重置。\u003c/td>\n\u003ctd>最后说环境变化时要更果断\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D能覆盖全文。文章先承认纸质版迟早结束，再说明当前大众模式越来越难维持；随后拒绝仓促停印，提出涨价、照顾忠诚顾客并把纸质版重新定位为高价保留产品。\n“luxury good”准确抓住第五、六段的核心经营设计：最忠诚顾客继续获得喜欢的产品，愿意为维持其品质多付钱，报社通过逐年涨价获得额外收入。\n结尾对变化环境中更积极行动的主张，也支持把传统业务从大众产品改造成小众高价产品，而不是僵硬维持原样或一次性取消。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 保留。\u003c/strong>\u003c/p>\n\u003ch3>40题结论\u003c/h3>\n\u003cp>\u003cstrong>40. D. Make Your Print Newspaper a Luxury Good\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>Make Your Print Newspaper a Luxury Good / 把纸质报纸做成奢侈品\u003c/strong>\u003c/p>\n\u003ch2>36题\u003c/h2>\n\u003cblockquote>\n\u003cp>The New York Times is considering ending its print edition partly due to ______.\u003cbr>《纽约时报》考虑结束纸质版，部分原因是什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“《纽约时报》考虑结束纸质版，部分原因是什么？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Nostalgia for ink on paper and the rustle of pages aside, there&#39;s plenty of incentive to ditch print. The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints. Readers are migrating away from print anyway. And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\u003c/p>\n\u003c/blockquote>\n\u003cp>第二段列印刷机与运输车带来的昂贵基础设施，比较没有这类负担的线上竞争者，再说读者迁移和纸质广告收入下降。\u003c/p>\n\u003ch3>A. the increasing online ad sales\u003c/h3>\n\u003cblockquote>\n\u003cp>线上广告销售的增长\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。\u003c/p>\n\u003cp>两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>《纽约时报》考虑停办纸质版，部分原因是线上广告销售的增长。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。\u003c/p>\n\u003cp>原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。\u003c/p>\n\u003cp>A若成立，段中需要直接比较网络广告收入前后变化，或说明网络广告增长挤压纸质版；现在真正写出的收入趋势只有print revenue declining。\u003c/p>\n\u003cp>两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.\u003c/p>\n\u003cp>第二段列印刷机与运输车带来的昂贵基础设施，比较没有这类负担的线上竞争者，再说读者迁移和纸质广告收入下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Rapid growth in online advertising has made the print edition unnecessary.\u003c/p>\n\u003cp>网络广告快速增长，已使印刷版变得不再必要。\u003c/p>\n\u003c/blockquote>\n\u003cp>线上广告增长必须有增长事实并与停刊形成原因关系。实际只比较纸质广告仍更大以及纸质收入下降，不能补出线上高速增长。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨讨论怎样重置纸报产品，承认旧模式存在经济压力；停刊诱因仍需由第二段的成本、收入和读者变化确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the increasing online ad sales\u003cbr>线上广告销售的增长\u003c/p>\n\u003c/blockquote>\n\u003cp>两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. the pressure from its investors\u003c/h3>\n\u003cblockquote>\n\u003cp>来自投资者的压力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“pressure from its investors”和原文“online-only competitors don’t have the same set of financial constraints”都在谈财务压力来源，因为选项说投资者施压，原文说实体报纸相对纯网络竞争者承担更多成本限制，所以回看第二段关于基础设施的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。B的“pressure from its investors”则需要投资者作为施压主体。\u003c/p>\n\u003cp>原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>《纽约时报》考虑停办纸质版，部分原因是来自投资者的压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“pressure from its investors”和原文“online-only competitors don’t have the same set of financial constraints”都在谈财务压力来源，因为选项说投资者施压，原文说实体报纸相对纯网络竞争者承担更多成本限制，所以回看第二段关于基础设施的句子。\u003c/p>\n\u003cp>原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。B的“pressure from its investors”则需要投资者作为施压主体。\u003c/p>\n\u003cp>第二段出现的是printing presses、delivery trucks、expensive和competitors，说明纸质生产本身昂贵；没有股东、董事会、回报要求或投资者意见。B把成本结构问题改成人际或治理压力。\u003c/p>\n\u003cp>即使企业因成本高而让投资者担忧，也需要额外一句把投资者与结束纸质版连接起来。当前段落没有这条主体关系。\u003c/p>\n\u003cp>原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints.\u003c/p>\n\u003cp>第二段列印刷机与运输车带来的昂贵基础设施，比较没有这类负担的线上竞争者，再说读者迁移和纸质广告收入下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Investors are pressing the Times to stop publishing on paper.\u003c/p>\n\u003cp>投资者正在向《纽约时报》施压，要求停止纸质出版。\u003c/p>\n\u003c/blockquote>\n\u003cp>投资者施压应交代谁要求停刊。实际段落比较运营负担和收入，没有投资者发言或施压行为。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨讨论怎样重置纸报产品，承认旧模式存在经济压力；停刊诱因仍需由第二段的成本、收入和读者变化确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the pressure from its investors\u003cbr>来自投资者的压力\u003c/p>\n\u003c/blockquote>\n\u003cp>原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. the complaints from its readers\u003c/h3>\n\u003cblockquote>\n\u003cp>读者的抱怨\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“complaints from its readers”和原文“Readers are migrating away from print”都涉及读者对纸质版的反应，因为选项说读者投诉，原文写读者用离开纸质版的行为作出选择，所以回看第二段倒数第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“Readers are migrating away from print”写的是读者数量或阅读习惯在迁移，是一种市场行为。C的“complaints from its readers”写的是读者主动表达不满，是另一种行动。\u003c/p>\n\u003cp>原文已经把读者反应写成migrating away，C改成complaints，没有后续句子支持这次改写，所以C排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Readers are migrating away from print anyway.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>《纽约时报》考虑停办纸质版，部分原因是读者的抱怨。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“complaints from its readers”和原文“Readers are migrating away from print”都涉及读者对纸质版的反应，因为选项说读者投诉，原文写读者用离开纸质版的行为作出选择，所以回看第二段倒数第二句。\u003c/p>\n\u003cp>原文“Readers are migrating away from print”写的是读者数量或阅读习惯在迁移，是一种市场行为。C的“complaints from its readers”写的是读者主动表达不满，是另一种行动。\u003c/p>\n\u003cp>离开纸质版可能源于价格、便利性或媒介习惯，不能自动证明读者向报社投诉。段中没有complain、protest、demand或读者要求停印的内容。\u003c/p>\n\u003cp>更重要的是，读者迁移会削弱纸质版需求；读者抱怨却可能是抱怨停印本身。C没有说明抱怨内容，无法与原文的迁移方向合并。\u003c/p>\n\u003cp>原文已经把读者反应写成migrating away，C改成complaints，没有后续句子支持这次改写，所以C排除。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Readers are migrating away from print anyway.\u003c/p>\n\u003cp>第二段列印刷机与运输车带来的昂贵基础设施，比较没有这类负担的线上竞争者，再说读者迁移和纸质广告收入下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Readers have complained that the print edition should be closed.\u003c/p>\n\u003cp>读者抱怨并要求关闭印刷版。\u003c/p>\n\u003c/blockquote>\n\u003cp>读者迁移不是投诉要求停刊；实际后文反而担心停刊令最忠实读者不满，投诉不能从迁移中补出来。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨讨论怎样重置纸报产品，承认旧模式存在经济压力；停刊诱因仍需由第二段的成本、收入和读者变化确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the complaints from its readers\u003cbr>读者的抱怨\u003c/p>\n\u003c/blockquote>\n\u003cp>原文已经把读者反应写成migrating away，C改成complaints，没有后续句子支持这次改写，所以C排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. the high cost of operation\u003c/h3>\n\u003cblockquote>\n\u003cp>高昂的运营成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“the high cost of [xxx]”，保留了相应遮挡。当时的定位线索是：D里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。\u003c/p>\n\u003cp>题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>《纽约时报》考虑停办纸质版，部分原因是高昂的运营成本。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。\u003c/p>\n\u003cp>原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。\u003c/p>\n\u003cp>两边都围绕实体印刷和配送的运营负担，没有把原因换成广告、投资者或读者抱怨。\u003c/p>\n\u003cp>题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the same set of financial constraints.\u003c/p>\n\u003cp>第二段列印刷机与运输车带来的昂贵基础设施，比较没有这类负担的线上竞争者，再说读者迁移和纸质广告收入下降。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The cost of operating printing presses and delivery trucks gives the Times an incentive to leave print.\u003c/p>\n\u003cp>运行印刷机和送货卡车的成本，使《纽约时报》有动机离开纸质出版。\u003c/p>\n\u003c/blockquote>\n\u003cp>印刷机、运输车都是运营所需基础设施，expensive与financial constraints构成成本压力，选项概括了这些具体项目。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入36题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨讨论怎样重置纸报产品，承认旧模式存在经济压力；停刊诱因仍需由第二段的成本、收入和读者变化确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the high cost of operation\u003cbr>高昂的运营成本\u003c/p>\n\u003c/blockquote>\n\u003cp>题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>36题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>36. D. the high cost of operation\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。\u003c/p>\n\u003cp>B：原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。\u003c/p>\n\u003cp>C：原文“Readers are migrating away from print”写的是读者数量或阅读习惯在迁移，是一种市场行为。\u003c/p>\n\u003cp>D：原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。\u003c/p>\n\u003ch2>37题\u003c/h2>\n\u003cblockquote>\n\u003cp>Peretti suggests that, in face of the present situation, the Times should ______.\u003cbr>佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物建议题。题干要求判断“佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？”，先按第3、4、5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\u003c/p>\n\u003cp>Peretti says the Times shouldn&#39;t waste time getting out of the print business, but only if they go about doing it the right way. &quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003cp>Sometimes that&#39;s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. &quot;It was seen as a blunder,&quot; he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? &quot;I wouldn&#39;t pick a year to end print,&quot; he said. &quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in. &quot;So if you&#39;re overpaying for print, you could feel like you were helping,&quot; Peretti said. &quot;Then increase it at a higher rate each year and essentially try to generate additional revenue.&quot; In other words, if you&#39;re going to make a print product, make it for the people who are already obsessed with it. Which may be what the Times is doing already. Getting the print edition seven days a week costs nearly $500 a year – more than twice as much as a digital-only subscription.\u003c/p>\n\u003c/blockquote>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003ch3>A. make strategic adjustments\u003c/h3>\n\u003cblockquote>\n\u003cp>进行战略调整\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“make [xxx] adjustments”，保留了相应遮挡。当时的定位线索是：A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>面对当前局面，佩雷蒂建议《纽约时报》进行战略调整。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\u003c/p>\n\u003cp>A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>第三段还说匆忙取消纸质版是mistake，第四段说要以the right way处理。两段合起来不是维持原样，也不是一次性终止，而是改变路径、速度和经营方式。\u003c/p>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003cp>战略调整体现在保留什么产品、向谁出售以及怎样定价。第五、六段依次把这些决定说具体，能接上right way的要求。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should change its print strategy by raising prices and targeting loyal customers.\u003c/p>\n\u003cp>《纽约时报》应提高价格、面向忠实顾客，从而改变纸报策略。\u003c/p>\n\u003c/blockquote>\n\u003cp>战略调整体现在保留什么产品、向谁出售以及怎样定价。第五、六段依次把这些决定说具体，能接上right way的要求。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>make strategic adjustments\u003cbr>进行战略调整\u003c/p>\n\u003c/blockquote>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. end the print edition for good\u003c/h3>\n\u003cblockquote>\n\u003cp>永久终止纸质版\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。B的“end the print edition for good”却把永久终止当成建议本身，两者动作方向相反。\u003c/p>\n\u003cp>后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>面对当前局面，佩雷蒂建议《纽约时报》永久终止纸质版。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。\u003c/p>\n\u003cp>原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。B的“end the print edition for good”却把永久终止当成建议本身，两者动作方向相反。\u003c/p>\n\u003cp>第四段进一步说，只有以正确方式推进转型才合理；直接停掉会让最忠诚顾客不满。B没有保留“处理方式”和“转型过程”，只留下最终关停。\u003c/p>\n\u003cp>无论具体词是什么，would be a mistake已经否定了B的直接建议。\u003c/p>\n\u003cp>后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should permanently abolish print as quickly as possible.\u003c/p>\n\u003cp>《纽约时报》应尽快永久取消印刷版。\u003c/p>\n\u003c/blockquote>\n\u003cp>彻底停刊会让raise prices和忠实顾客继续拿到纸报失去对象。实际反对选定一个停刊年份，并提供保留产品的转型办法。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>end the print edition for good\u003cbr>永久终止纸质版\u003c/p>\n\u003c/blockquote>\n\u003cp>后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. seek new sources of readership\u003c/h3>\n\u003cblockquote>\n\u003cp>寻找新的读者来源\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\u003c/p>\n\u003cp>这两段没有任何拓展读者的措施，C把经营转型问题换成获客问题，因此C排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>面对当前局面，佩雷蒂建议《纽约时报》寻找新的读者来源。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。\u003c/p>\n\u003cp>原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\u003c/p>\n\u003cp>佩雷蒂在这两段讨论的是怎样退出或改造纸质业务，不是怎样扩大受众。他没有提获客渠道、年轻读者、网络流量或新的市场来源。\u003c/p>\n\u003cp>保护现有忠诚顾客与寻找新读者并非逻辑上绝对不能同时发生，但题干问的是佩雷蒂在当前局面下提出的建议；当前建议的实际落点是调整转型方式，而不是seek new sources。\u003c/p>\n\u003cp>一个保护已有核心读者，一个开拓新的读者来源，动作对象不同。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should find a new readership for its print edition.\u003c/p>\n\u003cp>《纽约时报》应为印刷版寻找新的读者群。\u003c/p>\n\u003c/blockquote>\n\u003cp>拓展新读者应介绍尚未购买者或新市场。实际反复限定most loyal、already obsessed，面向现有重度客户。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>seek new sources of readership\u003cbr>寻找新的读者来源\u003c/p>\n\u003c/blockquote>\n\u003cp>这两段没有任何拓展读者的措施，C把经营转型问题换成获客问题，因此C排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. aim for efficient management\u003c/h3>\n\u003cblockquote>\n\u003cp>追求高效管理\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“aim for [xxx] management”，保留了相应遮挡。当时的定位线索是：D里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。读完全文后，做题模式再经交叉验证排除D，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。后面直接说明的办法是加快转型、避免粗暴停印，并调整价格和产品定位。\u003c/p>\n\u003cp>一种策略也许能让公司经营得更好，但这不等于作者提出了“提高管理效率”这个具体建议。A的strategic adjustments既保留变化要求，又能覆盖后文实际展开的价格和目标客户安排。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Peretti says the Times shouldn&#39;t waste time getting out of the print business, but only if they go about doing it the right way.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>面对当前局面，佩雷蒂建议《纽约时报》追求高效管理。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。\u003c/p>\n\u003cp>佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。后面直接说明的办法是加快转型、避免粗暴停印，并调整价格和产品定位。\u003c/p>\n\u003cp>D中的management efficiency指管理效率，应由人员配置、程序速度或投入产出等效率改进来支撑。原文讨论的是印刷产品面向谁、怎样收费、怎样保留忠实顾客，属于经营策略的调整。\u003c/p>\n\u003cp>一种策略也许能让公司经营得更好，但这不等于作者提出了“提高管理效率”这个具体建议。A的strategic adjustments既保留变化要求，又能覆盖后文实际展开的价格和目标客户安排。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第3、4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Peretti says the Times shouldn&#39;t waste time getting out of the print business, but only if they go about doing it the right way.\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should improve the efficiency of its existing management.\u003c/p>\n\u003cp>《纽约时报》应提高现有管理的效率。\u003c/p>\n\u003c/blockquote>\n\u003cp>高效管理应接人员、流程或单位成本改良。实际重点是产品重新定位与定价，不能用管理效率替代改变商业策略。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>aim for efficient management\u003cbr>追求高效管理\u003c/p>\n\u003c/blockquote>\n\u003cp>一种策略也许能让公司经营得更好，但这不等于作者提出了“提高管理效率”这个具体建议。A的strategic adjustments既保留变化要求，又能覆盖后文实际展开的价格和目标客户安排。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>37题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>37. A. make strategic adjustments\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>B：原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。\u003c/p>\n\u003cp>C：原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\u003c/p>\n\u003cp>D：佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。\u003c/p>\n\u003ch2>38题\u003c/h2>\n\u003cblockquote>\n\u003cp>It can be inferred from Paragraphs 5 and 6 that a “legacy product” ______.\u003cbr>根据第五、六段可以推断，“传统保留产品”会怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>跨段推断题。题干要求判断“根据第五、六段可以推断，“传统保留产品”会怎么样？”，先按第5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Sometimes that&#39;s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. &quot;It was seen as a blunder,&quot; he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? &quot;I wouldn&#39;t pick a year to end print,&quot; he said. &quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in. &quot;So if you&#39;re overpaying for print, you could feel like you were helping,&quot; Peretti said. &quot;Then increase it at a higher rate each year and essentially try to generate additional revenue.&quot; In other words, if you&#39;re going to make a print product, make it for the people who are already obsessed with it. Which may be what the Times is doing already. Getting the print edition seven days a week costs nearly $500 a year – more than twice as much as a digital-only subscription.\u003c/p>\n\u003c/blockquote>\n\u003cp>提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\u003c/p>\n\u003ch3>A. helps restore the glory of former times\u003c/h3>\n\u003cblockquote>\n\u003cp>帮助恢复昔日荣光\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。\u003c/p>\n\u003cp>原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第5、6段的legacy product是指一种帮助恢复昔日荣光的产品。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。\u003c/p>\n\u003cp>原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。\u003c/p>\n\u003cp>第五、六段没有回顾纸媒黄金时代，也没有说销量、影响力或社会地位会恢复。后文只谈忠诚顾客愿意多付钱以及由此增加收入。\u003c/p>\n\u003cp>传统保留产品可能带有怀旧色彩，但“保留旧产品”与“恢复旧日辉煌”不是同一结果。A把小众维持扩大成整体复兴。\u003c/p>\n\u003cp>原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003cp>提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The legacy product would bring back the newspaper’s former glory.\u003c/p>\n\u003cp>传统产品将恢复报纸昔日的辉煌。\u003c/p>\n\u003c/blockquote>\n\u003cp>恢复荣光应评价它重获过去的地位。实际说顾客继续拥有喜爱产品与额外收入，没有从留存旧产品推出历史声望复兴。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>把纸报做成奢侈品意味着服务愿意持续付费的人群；具体人群由most loyal和already obsessed限定，不是扩大大众覆盖面。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>helps restore the glory of former times\u003cbr>帮助恢复昔日荣光\u003c/p>\n\u003c/blockquote>\n\u003cp>原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. is meant for the most loyal customers\u003c/h3>\n\u003cblockquote>\n\u003cp>面向最忠实的顾客\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“is meant for the most [xxx] customers”，保留了相应遮挡。当时的定位线索是：B里的“is meant for the most”和原文“The most loyal customers”都在界定这种产品面向谁，因为选项说它服务最某类顾客，原文直接把后续方案落到最忠诚顾客，所以回看第六段开头和“In other words”后的句子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。B的“is meant for the most”同样把legacy product定义成面向最某类顾客。\u003c/p>\n\u003cp>第五段的涨价方案会缩小大众购买意愿，第六段则说明核心顾客仍能获得喜欢的产品，并觉得自己在维持其品质。这不是追求更广泛流行，而是把产品留给忠诚度最高的人。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in.\u003c/p>\n\u003cp>&quot;So if you&#39;re overpaying for print, you could feel like you were helping,&quot; Peretti said.\u003c/p>\n\u003cp>&quot;Then increase it at a higher rate each year and essentially try to generate additional revenue.&quot; In other words, if you&#39;re going to make a print product, make it for the people who are already obsessed with it.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第5、6段的legacy product是指一种面向最忠实的顾客的产品。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“is meant for the most”和原文“The most loyal customers”都在界定这种产品面向谁，因为选项说它服务最某类顾客，原文直接把后续方案落到最忠诚顾客，所以回看第六段开头和“In other words”后的句子。\u003c/p>\n\u003cp>原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。B的“is meant for the most”同样把legacy product定义成面向最某类顾客。\u003c/p>\n\u003cp>第五段的涨价方案会缩小大众购买意愿，第六段则说明核心顾客仍能获得喜欢的产品，并觉得自己在维持其品质。这不是追求更广泛流行，而是把产品留给忠诚度最高的人。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in.\u003c/p>\n\u003cp>&quot;So if you&#39;re overpaying for print, you could feel like you were helping,&quot; Peretti said.\u003c/p>\n\u003cp>&quot;Then increase it at a higher rate each year and essentially try to generate additional revenue.&quot; In other words, if you&#39;re going to make a print product, make it for the people who are already obsessed with it.\u003c/p>\n\u003cp>提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The print edition would be retained for customers who are already deeply attached to it.\u003c/p>\n\u003cp>印刷版将为已经十分依恋它的顾客保留。\u003c/p>\n\u003c/blockquote>\n\u003cp>would still get与already obsessed把时间和人群都限定在现有忠实客户。提价没有改变他们愿意保留纸报的偏好。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>把纸报做成奢侈品意味着服务愿意持续付费的人群；具体人群由most loyal和already obsessed限定，不是扩大大众覆盖面。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>is meant for the most loyal customers\u003cbr>面向最忠实的顾客\u003c/p>\n\u003c/blockquote>\n\u003cp>第五段的涨价方案会缩小大众购买意愿，第六段则说明核心顾客仍能获得喜欢的产品，并觉得自己在维持其品质。这不是追求更广泛流行，而是把产品留给忠诚度最高的人。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. will have the cost of printing reduced\u003c/h3>\n\u003cblockquote>\n\u003cp>将降低印刷成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。C的“cost of printing reduced”写的是生产端印刷成本下降。\u003c/p>\n\u003cp>第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Sometimes that&#39;s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. &quot;It was seen as a blunder,&quot; he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? &quot;I wouldn&#39;t pick a year to end print,&quot; he said. &quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第5、6段的legacy product是指一种将降低印刷成本的产品。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。\u003c/p>\n\u003cp>原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。C的“cost of printing reduced”写的是生产端印刷成本下降。\u003c/p>\n\u003cp>一个变量是顾客支付价格，一个变量是报社生产成本；即使涨价能改善利润，也不等于printing cost本身降低。原文没有减少印刷机、配送或纸张开支的措施。\u003c/p>\n\u003cp>C还把increase改成reduced，表面方向相反，但更根本的差别是对象换了：原文提高收费，C降低成本。\u003c/p>\n\u003cp>第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Sometimes that&#39;s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. &quot;It was seen as a blunder,&quot; he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? &quot;I wouldn&#39;t pick a year to end print,&quot; he said. &quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003cp>提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Turning print into a legacy product would reduce the cost of printing it.\u003c/p>\n\u003cp>把纸报变为传统产品将降低印刷成本。\u003c/p>\n\u003c/blockquote>\n\u003cp>提售价改变收入，不自动改变制造成本。原文给出的是每年更高价格带来additional revenue，缺少降低印刷支出的步骤。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>把纸报做成奢侈品意味着服务愿意持续付费的人群；具体人群由most loyal和already obsessed限定，不是扩大大众覆盖面。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>will have the cost of printing reduced\u003cbr>将降低印刷成本\u003c/p>\n\u003c/blockquote>\n\u003cp>第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. expands the popularity of the paper\u003c/h3>\n\u003cblockquote>\n\u003cp>扩大报纸的受欢迎程度\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。\u003c/p>\n\u003cp>涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第5、6段的legacy product是指一种扩大报纸的受欢迎程度的产品。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。\u003c/p>\n\u003cp>原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。\u003c/p>\n\u003cp>后文还说产品要为已经与它有深厚关系的人制作，价格接近纯数字订阅的两倍。这种高价、小众定位更像维持忠诚群体，而不是扩大普及率。\u003c/p>\n\u003cp>D把“保留最忠诚顾客”改成“扩大所有人的欢迎度”，范围方向相反；没有任何新增读者或扩大销量的内容。\u003c/p>\n\u003cp>涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in.\u003c/p>\n\u003cp>提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The luxury print edition would become popular with a larger general readership.\u003c/p>\n\u003cp>高端印刷版将受到更广大普通读者的欢迎。\u003c/p>\n\u003c/blockquote>\n\u003cp>扩大受欢迎范围要吸引更多一般读者。实际策略缩向已有的忠实者，让他们为稀缺偏好付较高价。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>把纸报做成奢侈品意味着服务愿意持续付费的人群；具体人群由most loyal和already obsessed限定，不是扩大大众覆盖面。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>expands the popularity of the paper\u003cbr>扩大报纸的受欢迎程度\u003c/p>\n\u003c/blockquote>\n\u003cp>涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>38题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>38. B. is meant for the most loyal customers\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。\u003c/p>\n\u003cp>B：原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。\u003c/p>\n\u003cp>C：原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。\u003c/p>\n\u003cp>D：原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。\u003c/p>\n\u003ch2>39题\u003c/h2>\n\u003cblockquote>\n\u003cp>Peretti believes that, in a changing world, ______.\u003cbr>佩雷蒂认为，在不断变化的世界里，什么说法成立？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点题。题干要求判断“佩雷蒂认为，在不断变化的世界里，什么说法成立？”，先按第7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;It&#39;s a really hard thing to do and it&#39;s a tremendous luxury that BuzzFeed doesn&#39;t have a legacy business,&quot; Peretti remarked. &quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes. In those situations, it&#39;s better to be more aggressive than less aggressive.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>佩雷蒂承认传统业务调整困难，又说市场变化会使现有做法失去合理性，因此应更主动而非更保守。\u003c/p>\n\u003ch3>A. traditional luxuries can stay unaffected\u003c/h3>\n\u003cblockquote>\n\u003cp>传统奢侈品可以不受影响\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。A的“stay unaffected”却说传统奢侈品可以完全不受影响。\u003c/p>\n\u003cp>最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>佩雷蒂认为，在变化的世界中，传统奢侈品可以不受影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。\u003c/p>\n\u003cp>原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。A的“stay unaffected”却说传统奢侈品可以完全不受影响。\u003c/p>\n\u003cp>佩雷蒂之所以提出涨价、重定位和更积极行动，正是因为维持原状不再合理。A若成立，最后一段无需讨论如何面对变化。\u003c/p>\n\u003cp>最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes.\u003c/p>\n\u003cp>佩雷蒂承认传统业务调整困难，又说市场变化会使现有做法失去合理性，因此应更主动而非更保守。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Traditional luxury businesses can remain untouched by changes in the market.\u003c/p>\n\u003cp>传统奢侈品业务可不受市场变化的影响。\u003c/p>\n\u003c/blockquote>\n\u003cp>不受影响应把奢侈业务排除在市场变化之外。实际说每家企业都会面对做法不再合理的问题，luxury形容没有历史包袱这一条件。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入39题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨本身是一项主动调整产品的建议；题干应把变化与应对行动相连，具体力度由more aggressive than less aggressive决定。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>traditional luxuries can stay unaffected\u003cbr>传统奢侈品可以不受影响\u003c/p>\n\u003c/blockquote>\n\u003cp>最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. cautiousness facilitates problem-solving\u003c/h3>\n\u003cblockquote>\n\u003cp>谨慎有助于解决问题\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“cautiousness”和原文“more aggressive than less aggressive”都在比较面对变化时应采取的行动强度，因为选项推崇谨慎，原文明确偏向更积极果断，所以回看最后一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“more aggressive than less aggressive”直接比较两种行动方式，并选择更积极的一边。B的“cautiousness”则把更谨慎、更保守的行动写成解决问题的有利条件，两者方向相反。\u003c/p>\n\u003cp>这里不是说任何时候都要鲁莽，而是在市场和世界变化、旧做法不再合理的situations中，拖延和过度谨慎更可能让问题继续。B把作者给出的行动偏好反过来。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In those situations, it&#39;s better to be more aggressive than less aggressive.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>佩雷蒂认为，在变化的世界中，谨慎有助于解决问题。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“cautiousness”和原文“more aggressive than less aggressive”都在比较面对变化时应采取的行动强度，因为选项推崇谨慎，原文明确偏向更积极果断，所以回看最后一句。\u003c/p>\n\u003cp>原文“more aggressive than less aggressive”直接比较两种行动方式，并选择更积极的一边。B的“cautiousness”则把更谨慎、更保守的行动写成解决问题的有利条件，两者方向相反。\u003c/p>\n\u003cp>这里不是说任何时候都要鲁莽，而是在市场和世界变化、旧做法不再合理的situations中，拖延和过度谨慎更可能让问题继续。B把作者给出的行动偏好反过来。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第7段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In those situations, it&#39;s better to be more aggressive than less aggressive.&quot;\u003c/p>\n\u003cp>佩雷蒂承认传统业务调整困难，又说市场变化会使现有做法失去合理性，因此应更主动而非更保守。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>
