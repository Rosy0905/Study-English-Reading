 of operating printing presses and delivery trucks gives the Times an incentive to leave print.\u003c/p>\n\u003cp>运行印刷机和送货卡车的成本，使《纽约时报》有动机离开纸质出版。\u003c/p>\n\u003c/blockquote>\n\u003cp>印刷机、运输车都是运营所需基础设施，expensive与financial constraints构成成本压力，选项概括了这些具体项目。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. the high cost of operation","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Make Your Print Newspaper a Luxury Good  \n> 把纸质报纸做成奢侈品\n\n把这个主旨直接代入36题题干：\n\n> 主旨讨论怎样重置纸报产品，承认旧模式存在经济压力；停刊诱因仍需由第二段的成本、收入和读者变化确认。\n\nD实际说的是：\n\n> the high cost of operation  \n> 高昂的运营成本\n\n题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\n\n从全文推进看，这一处的作用是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降\n\n这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\n\n**复盘判断：D正确。**","context":{"mode":"image","asset":"questions","focus":[250,606,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-36-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"36","option":"D"},"focusId":"focus-q36-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q36-D-0\">\u003cblockquote>\n\u003cp>高昂的运营成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“the high cost of [xxx]”，保留了相应遮挡。当时的定位线索是：D里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。\u003c/p>\n\u003cp>题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The infrastructure required to make a physical newspaper– printing presses, delivery trucks – isn&#39;t just expensive; it&#39;s excessive at a time when online-only competitors don&#39;t have the e>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>the high cost of operation\u003cbr>高昂的运营成本\u003c/p>\n\u003c/blockquote>\n\u003cp>题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"36题结论","level":2,"raw":"### 36题结论\n\n> **36. D. the high cost of operation**\n\nA：原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。\n\nB：原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。\n\nC：原文“Readers are migrating away from print”写的是读者数量或阅读习惯在迁移，是一种市场行为。\n\nD：原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。","context":{"mode":"image","asset":"questions","focus":[250,243,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"question":"36","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>36. D. the high cost of operation\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。\u003c/p>\n\u003cp>B：原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。\u003c/p>\n\u003cp>C：原文“Readers are migrating away from print”写的是读者数量或阅读习惯在迁移，是一种市场行为。\u003c/p>\n\u003cp>D：原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"37题 · 题干、题型与核心出处","level":2,"raw":"## 37题\n\n> Peretti suggests that, in face of the present situation, the Times should ______.  \n> 佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？\n\n### 题型\n\n人物建议题。题干要求判断“佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？”，先按第3、4、5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\n>\n> Peretti says the Times shouldn't waste time getting out of the print business, but only if they go about doing it the right way. \"Figuring out a way to accelerate that transition would make sense for them,\" he said, \"but if you discontinue it, you're going to have your most loyal customers really upset with you.\"\n>\n> Sometimes that's worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. \"It was seen as a blunder,\" he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? \"I wouldn't pick a year to end print,\" he said. \"I would raise prices and make it into more of a legacy product.\"\n>\n> The most loyal customers would still get the product they favor, the idea goes, and they'd feel like they were helping sustain the quality of something they believe in. \"So if you're overpaying for print, you could feel like you were helping,\" Peretti said. \"Then increase it at a higher rate each year and essentially try to generate additional revenue.\" In other words, if you're going to make a print product, make it for the people who are already obsessed with it. Which may be what the Times is doing already. Getting the print edition seven days a week costs nearly $500 a year – more than twice as much as a digital-only subscription.\n\n他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。","context":{"mode":"image","asset":"questions","focus":[250,772,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"question":"37","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Peretti suggests that, in face of the present situation, the Times should ______.\u003cbr>佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物建议题。题干要求判断“佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？”，先按第3、4、5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\u003c/p>\n\u003cp>Peretti says the Times shouldn&#39;t waste time getting out of the print business, but only if they go about doing it the right way. &quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003cp>Sometimes that&#39;s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. &quot;It was seen as a blunder,&quot; he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? &quot;I wouldn&#39;t pick a year to end print,&quot; he said. &quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in. &quot;So if you&#39;re overpaying for print, you could feel like you were helping,&quot; Peretti said. &quot;Then increase it at a higher rate each year and essentially try to generate additional revenue.&quot; In other words, if you&#39;re going to make a print product, make it for the people who are already obsessed with it. Which may be what the Times is doing already. Getting the print edition seven days a week costs nearly $500 a year – more than twice as much as a digital-only subscription.\u003c/p>\n\u003c/blockquote>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. make strategic adjustments","level":3,"raw":"### A. make strategic adjustments\n\n> 进行战略调整\n\n**做题模式中的状态：** 第一轮A保留。当时选项呈现为“make [xxx] adjustments”，保留了相应遮挡。当时的定位线索是：A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\n\n**选项类型：正确同义改写。**\n\nA的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\n\n原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\n\n**正确选项的原文依据：**\n\n> \"Figuring out a way to accelerate that transition would make sense for them,\" he said, \"but if you discontinue it, you're going to have your most loyal customers really upset with you.\"","context":{"mode":"image","asset":"questions","focus":[250,870,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"37","option":"A"},"focusId":"focus-q37-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-A-0\">\u003cblockquote>\n\u003cp>进行战略调整\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“make [xxx] adjustments”，保留了相应遮挡。当时的定位线索是：A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. make strategic adjustments","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 面对当前局面，佩雷蒂建议《纽约时报》进行战略调整。\n\nA里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\n\nA的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\n\n第三段还说匆忙取消纸质版是mistake，第四段说要以the right way处理。两段合起来不是维持原样，也不是一次性终止，而是改变路径、速度和经营方式。\n\n原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\n\n他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\n\n战略调整体现在保留什么产品、向谁出售以及怎样定价。第五、六段依次把这些决定说具体，能接上right way的要求。","context":{"mode":"image","asset":"questions","focus":[250,870,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"37","option":"A"},"focusId":"focus-q37-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-A-0\">\u003cblockquote>\n\u003cp>进行战略调整\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“make [xxx] adjustments”，保留了相应遮挡。当时的定位线索是：A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>面对当前局面，佩雷蒂建议《纽约时报》进行战略调整。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\u003c/p>\n\u003cp>A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>第三段还说匆忙取消纸质版是mistake，第四段说要以the right way处理。两段合起来不是维持原样，也不是一次性终止，而是改变路径、速度和经营方式。\u003c/p>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003cp>战略调整体现在保留什么产品、向谁出售以及怎样定价。第五、六段依次把这些决定说具体，能接上right way的要求。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. make strategic adjustments","level":4,"raw":"#### 写作视角法\n\n原文第3、4、5、6段是这样写的：\n\n> \"Figuring out a way to accelerate that transition would make sense for them,\" he said, \"but if you discontinue it, you're going to have your most loyal customers really upset with you.\"\n>\n> 他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\n\n把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The Times should change its print strategy by raising prices and targeting loyal customers.\n>\n> 《纽约时报》应提高价格、面向忠实顾客，从而改变纸报策略。\n\n战略调整体现在保留什么产品、向谁出售以及怎样定价。第五、六段依次把这些决定说具体，能接上right way的要求。","context":{"mode":"image","asset":"questions","focus":[250,870,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"37","option":"A"},"focusId":"focus-q37-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-A-0\">\u003cblockquote>\n\u003cp>进行战略调整\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“make [xxx] adjustments”，保留了相应遮挡。当时的定位线索是：A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>面对当前局面，佩雷蒂建议《纽约时报》进行战略调整。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\u003c/p>\n\u003cp>A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>第三段还说匆忙取消纸质版是mistake，第四段说要以the right way处理。两段合起来不是维持原样，也不是一次性终止，而是改变路径、速度和经营方式。\u003c/p>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003cp>战略调整体现在保留什么产品、向谁出售以及怎样定价。第五、六段依次把这些决定说具体，能接上right way的要求。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3、4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should change its print strategy by raising prices and targeting loyal customers.\u003c/p>\n\u003cp>《纽约时报》应提高价格、面向忠实顾客，从而改变纸报策略。\u003c/p>\n\u003c/blockquote>\n\u003cp>战略调整体现在保留什么产品、向谁出售以及怎样定价。第五、六段依次把这些决定说具体，能接上right way的要求。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. make strategic adjustments","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Make Your Print Newspaper a Luxury Good  \n> 把纸质报纸做成奢侈品\n\n把这个主旨直接代入37题题干：\n\n> 主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\n\nA实际说的是：\n\n> make strategic adjustments  \n> 进行战略调整\n\n原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\n\n从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\n\n这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\n\n**复盘判断：A正确。**","context":{"mode":"image","asset":"questions","focus":[250,870,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"37","option":"A"},"focusId":"focus-q37-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-A-0\">\u003cblockquote>\n\u003cp>进行战略调整\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“make [xxx] adjustments”，保留了相应遮挡。当时的定位线索是：A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>面对当前局面，佩雷蒂建议《纽约时报》进行战略调整。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\u003c/p>\n\u003cp>A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>第三段还说匆忙取消纸质版是mistake，第四段说要以the right way处理。两段合起来不是维持原样，也不是一次性终止，而是改变路径、速度和经营方式。\u003c/p>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003cp>战略调整体现在保留什么产品、向谁出售以及怎样定价。第五、六段依次把这些决定说具体，能接上right way的要求。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3、4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should change its print strategy by raising prices and targeting loyal customers.\u003c/p>\n\u003cp>《纽约时报》应提高价格、面向忠实顾客，从而改变纸报策略。\u003c/p>\n\u003c/blockquote>\n\u003cp>战略调整体现在保留什么产品、向谁出售以及怎样定价。第五、六段依次把这些决定说具体，能接上right way的要求。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>make strategic adjustments\u003cbr>进行战略调整\u003c/p>\n\u003c/blockquote>\n\u003cp>原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. end the print edition for good","level":3,"raw":"### B. end the print edition for good\n\n> 永久终止纸质版\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。\n\n**错误类型：第一类——歪曲原意。**\n\n原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。B的“end the print edition for good”却把永久终止当成建议本身，两者动作方向相反。\n\n后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。\n\n**命题人借用的原文材料：**\n\n> Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.","context":{"mode":"image","asset":"questions","focus":[250,958,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"37","option":"B"},"focusId":"focus-q37-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-B-0\">\u003cblockquote>\n\u003cp>永久终止纸质版\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。B的“end the print edition for good”却把永久终止当成建议本身，两者动作方向相反。\u003c/p>\n\u003cp>后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. end the print edition for good","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 面对当前局面，佩雷蒂建议《纽约时报》永久终止纸质版。\n\nB里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。\n\n原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。B的“end the print edition for good”却把永久终止当成建议本身 u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. end the print edition for good","level":4,"raw":"#### 写作视角法\n\n原文第3、4、5、6段是这样写的：\n\n> Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\n>\n> 他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\n\n把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果B真是作者的意思，文章至少得写成：\n\n> The Times should permanently abolish print as quickly as possible.\n>\n> 《纽约时报》应尽快永久取消印刷版。\n\n彻底停刊会让raise prices和忠实顾客继续拿到纸报失去对象。实际反对选定一个停刊年份，并提供保留产品的转型办法。","context":{"mode":"image","asset":"questions","focus":[250,958,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"37","option":"B"},"focusId":"focus-q37-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-B-0\">\u003cblockquote>\n\u003cp>永久终止纸质版\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。B的“end the print edition for good”却把永久终止当成建议本身，两者动作方向相反。\u003c/p>\n\u003cp>后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>面对当前局面，佩雷蒂建议《纽约时报》永久终止纸质版。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。\u003c/p>\n\u003cp>原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。B的“end the print edition for good”却把永久终止当成建议本身，两者动作方向相反。\u003c/p>\n\u003cp>第四段进一步说，只有以正确方式推进转型才合理；直接停掉会让最忠诚顾客不满。B没有保留“处理方式”和“转型过程”，只留下最终关停。\u003c/p>\n\u003cp>无论具体词是什么，would be a mistake已经否定了B的直接建议。\u003c/p>\n\u003cp>后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3、4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should permanently abolish print as quickly as possible.\u003c/p>\n\u003cp>《纽约时报》应尽快永久取消印刷版。\u003c/p>\n\u003c/blockquote>\n\u003cp>彻底停刊会让raise prices和忠实顾客继续拿到纸报失去对象。实际反对选定一个停刊年份，并提供保留产品的转型办法。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. end the print edition for good","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Make Your Print Newspaper a Luxury Good  \n> 把纸质报纸做成奢侈品\n\n把这个主旨直接代入37题题干：\n\n> 主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\n\nB实际说的是：\n\n> end the print edition for good  \n> 永久终止纸质版\n\n后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。\n\n从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\ 003c/h3>\n\u003cp>原文第3、4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should permanently abolish print as quickly as possible.\u003c/p>\n\u003cp>《纽约时报》应尽快永久取消印刷版。\u003c/p>\n\u003c/blockquote>\n\u003cp>彻底停刊会让raise prices和忠实顾客继续拿到纸报失去对象。实际反对选定一个停刊年份，并提供保留产品的转型办法。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>end the print edition for good\u003cbr>永久终止纸质版\u003c/p>\n\u003c/blockquote>\n\u003cp>后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. seek new sources of readership","level":3,"raw":"### C. seek new sources of readership\n\n> 寻找新的读者来源\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。\n\n**错误类型：第三类——无中生有。**\n\n原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\n\n这两段没有任何拓展读者的措施，C把经营转型问题换成获客问题，因此C排除。\n\n**命题人借用的原文材料：**\n\n> \"Figuring out a way to accelerate that transition would make sense for them,\" he said, \"but if you discontinue it, you're going to have your most loyal customers really upset with you.\"","context":{"mode":"image","asset":"questions","focus":[250,1046,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"37","option":"C"},"focusId":"focus-q37-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-C-0\">\u003cblockquote>\n\u003cp>寻找新的读者来源\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\u003c/p>\n\u003cp>这两段没有任何拓展读者的措施，C把经营转型问题换成获客问题，因此C排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. seek new sources of readership","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 面对当前局面，佩雷蒂建议《纽约时报》寻找新的读者来源。\n\nC里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。\n\n原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\n\n佩雷蒂在这两段讨论的是怎样退出或改造纸质业务，不是怎样扩大受众。他没有提获客渠道、年轻读者、网络流量或新的市场来源。\n\n保护现有忠诚顾客与寻找新读者并非逻辑上绝对不能同时发生，但题干问的是佩雷蒂在当前局面下提出的建议；当前建议的实际落点是调整转型方式，而不是seek new sources。\n\n一个保护已有核心读者，一个开拓新的读者来源，动作对象不同。","context":{"mode":"image","asset":"questions","focus":[250,1046,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"37","option":"C"},"focusId":"focus-q37-C-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-C-0\">\u003cblockquote>\n\u003cp>寻找新的读者来源\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\u003c/p>\n\u003cp>这两段没有任何拓展读者的措施，C把经营转型问题换成获客问题，因此C排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>面对当前局面，佩雷蒂建议《纽约时报》寻找新的读者来源。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。\u003c/p>\n\u003cp>原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\u003c/p>\n\u003cp>佩雷蒂在这两段讨论的是怎样退出或改造纸质业务，不是怎样扩大受众。他没有提获客渠道、年轻读者、网络流量或新的市场来源。\u003c/p>\n\u003cp>保护现有忠诚顾客与寻找新读者并非逻辑上绝对不能同时发生，但题干问的是佩雷蒂在当前局面下提出的建议；当前建议的实际落点是调整转型方式，而不是seek new sources。\u003c/p>\n\u003cp>一个保护已有核心读者，一个开拓新的读者来源，动作对象不同。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. seek new sources of readership","level":4,"raw":"#### 写作视角法\n\n原文第3、4、5、6段是这样写的：\n\n> \"Figuring out a way to accelerate ership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。\u003c/p>\n\u003cp>原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\u003c/p>\n\u003cp>佩雷蒂在这两段讨论的是怎样退出或改造纸质业务，不是怎样扩大受众。他没有提获客渠道、年轻读者、网络流量或新的市场来源。\u003c/p>\n\u003cp>保护现有忠诚顾客与寻找新读者并非逻辑上绝对不能同时发生，但题干问的是佩雷蒂在当前局面下提出的建议；当前建议的实际落点是调整转型方式，而不是seek new sources。\u003c/p>\n\u003cp>一个保护已有核心读者，一个开拓新的读者来源，动作对象不同。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-C-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3、4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should find a new readership for its print edition.\u003c/p>\n\u003cp>《纽约时报》应为印刷版寻找新的读者群。\u003c/p>\n\u003c/blockquote>\n\u003cp>拓展新读者应介绍尚未购买者或新市场。实际反复限定most loyal、already obsessed，面向现有重度客户。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. seek new sources of readership","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是：\n\n> Make Your Print Newspaper a Luxury Good  \n> 把纸质报纸做成奢侈品\n\n把这个主旨直接代入37题题干：\n\n> 主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\n\nC实际说的是：\n\n> seek new sources of readership  \n> 寻找新的读者来源\n\n这两段没有任何拓展读者的措施，C把经营转型问题换成获客问题，因此C排除。\n\n从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：C错误。**","context": on would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#39;re going to have your most loyal customers really upset with you.&quot;\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should find a new readership for its print edition.\u003c/p>\n\u003cp>《纽约时报》应为印刷版寻找新的读者群。\u003c/p>\n\u003c/blockquote>\n\u003cp>拓展新读者应介绍尚未购买者或新市场。实际反复限定most loyal、already obsessed，面向现有重度客户。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>seek new sources of readership\u003cbr>寻找新的读者来源\u003c/p>\n\u003c/blockquote>\n\u003cp>这两段没有任何拓展读者的措施，C把经营转型问题换成获客问题，因此C排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. aim for efficient management","level":3,"raw":"### D. aim for efficient management\n\n> 追求高效管理\n\n**做题模式中的状态：** 第一轮D保留。当时选项呈现为“aim for [xxx] management”，保留了相应遮挡。当时的定位线索是：D里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。读完全文后，做题模式再经交叉验证排除D，最终选择A。\n\n**错误类型：第三类——无中生有。**\n\n佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。后面直接说明的办法是加快转型、避免粗暴停印，并调整价格和产品定位。\n\n一种策略也许能让公司经营得更好，但这不等于作者提出了“提高管理效率”这个具体建议。A的strategic adjustments既保留变化要求，又能覆盖后文实际展开的价格和目标客户安排。\n\n**命题人借用的原文材料：**\n\n> Peretti says the Times shouldn't waste time getting out of the print business, but only if they go about doing it the right way.","context":{"mode":"image","asset":"questions","focus":[250,1134,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"37","option":"D"},"focusId":"focus-q37-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-D-0\">\u003cblockquote>\n\u003cp>追求高效管理\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“aim for [xxx] management”，保留了相应遮挡。当时的定位线索是：D里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。读完全文后，做题模式再经交叉验证排除D，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。后面直接说明的办法是加快转型、避免粗暴停印，并调整价格和产品定位。\u003c/p>\n\u003cp>一种策略也许能让公司经营得更好，但这不等于作者提出了“提高管理效率”这个具体建议。A的strategic adjustments既保留变化要求，又能覆盖后文实际展开的价格和目标客户安排。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Peretti says the Times shouldn&#39;t waste time getting out of the print business, but only if they go about doing it the right way.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. aim for efficient management","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 面对当前局面，佩雷蒂建议《纽约时报》追求高效管理。\n\nD里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。\n\n佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。后面直接说明的办法是加快转型、避免粗暴停印，并调整价格和产品定位。\n\nD中的management efficiency指管理效率，应由人员配置、程序速度或投入产出等效率改进来支撑。原 户安排。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. aim for efficient management","level":4,"raw":"#### 写作视角法\n\n原文第3、4、5、6段是这样写的：\n\n> Peretti says the Times shouldn't waste time getting out of the print business, but only if they go about doing it the right way.\n>\n> 他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\n\n把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果D真是作者的意思，文章至少得写成：\n\n> The Times should improve the efficiency of its existing management.\n>\n> 《纽约时报》应提高现有管理的效率。\n\n高效管理应接人员、流程或单位成本改良。实际重点是产品重新定位与定价，不能用管理效率替代改变商业策略。","context":{"mode":"image","asset":"questions","focus":[250,1134,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"37","option":"D"},"focusId":"focus-q37-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-D-0\">\u003cblockquote>\n\u003cp>追求高效管理\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“aim for [xxx] management”，保留了相应遮挡。当时的定位线索是：D里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。读完全文后，做题模式再经交叉验证排除D，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。后面直接说明的办法是加快转型、避免粗暴停印，并调整价格和产品定位。\u003c/p>\n\u003cp>一种策略也许能让公司经营得更好，但这不等于作者提出了“提高管理效率”这个具体建议。A的strategic adjustments既保留变化要求，又能覆盖后文实际展开的价格和目标客户安排。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Peretti says the Times shouldn&#39;t waste time getting out of the print business, but only if they go about doing it the right way.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37- 年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：D错误。**","context":{"mode":"image","asset":"questions","focus":[250,1134,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-37-option-D","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"37","option":"D"},"focusId":"focus-q37-D-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q37-D-0\">\u003cblockquote>\n\u003cp>追求高效管理\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“aim for [xxx] management”，保留了相应遮挡。当时的定位线索是：D里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。读完全文后，做题模式再经交叉验证排除D，最终选择A。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。后面直接说明的办法是加快转型、避免粗暴停印，并调整价格和产品定位。\u003c/p>\n\u003cp>一种策略也许能让公司经营得更好，但这不等于作者提出了“提高管理效率”这个具体建议。A的strategic adjustments既保留变化要求，又能覆盖后文实际展开的价格和目标客户安排。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Peretti says the Times shouldn&#39;t waste time getting out of the print business, but only if they go about doing it the right way.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>面对当前局面，佩雷蒂建议《纽约时报》追求高效管理。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。\u003c/p>\n\u003cp>佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。后面直接说明的办法是加快转型、避免粗暴停印，并调整价格和产品定位。\u003c/p>\n\u003cp>D中的management efficiency指管理效率，应由人员配置、程序速度或投入产出等效率改进来支撑。原文讨论的是印刷产品面向谁、怎样收费、怎样保留忠实顾客，属于经营策略的调整。\u003c/p>\n\u003cp>一种策略也许能让公司经营得更好，但这不等于作者提出了“提高管理效率”这个具体建议。A的strategic adjustments既保留变化要求，又能覆盖后文实际展开的价格和目标客户安排。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第3、4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Peretti says the Times shouldn&#39;t waste time getting out of the print business, but only if they go about doing it the right way.\u003c/p>\n\u003cp>他反对匆忙取消纸报，同时主张加速转型、提高纸报价格，让纸质版面向忠实客户并贡献收入。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误。佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客。以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The Times should improve the efficiency of its existing management.\u003c/p>\n\u003cp>《纽约时报》应提高现有管理的效率。\u003c/p>\n\u003c/blockquote>\n\u003cp>高效管理应接人员、流程或单位成本改良。实际重点是产品重新定位与定价，不能用管理效率替代改变商业策略。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q37-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入37题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨要求将纸报做成奢侈品，所以这里应回答产品定位与价格怎样调整；它不要求立即彻底停刊，也不只谈内部管理快慢。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>aim for efficient management\u003cbr>追求高效管理\u003c/p>\n\u003c/blockquote>\n\u003cp>一种策略也许能让公司经营得更好，但这不等于作者提出了“提高管理效率”这个具体建议。A的strategic adjustments既保留变化要求，又能覆盖后文实际展开的价格和目标客户安排。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"37题结论","level":2,"raw":"### 37题结论\n\n> **37. A. make strategic adjustments**\n\nA：A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\n\nB：原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。\n\nC：原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\n\nD：佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。","context":{"mode":"image","asset":"questions","focus":[250,772,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"question":"37","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>37. A. make strategic adjustments\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\u003c/p>\n\u003cp>B：原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。\u003c/p>\n\u003cp>C：原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。\u003c/p>\n\u003cp>D：佩雷蒂确实要求用正确方式处理转型，但这里的right way不能任意扩展成所有听起来积极的管理改进。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"38题 · 题干、题型与核心出处","level":2,"raw":"## 38题\n\n> It can be inferred from Paragraphs 5 and 6 that a “legacy product” ______.  \n> 根据第五、六段可以推断，“传统保留产品”会怎么样？\n\n### 题型\n\n跨段推断题。题干要求判断“根据第五、六段可以推断，“传统保留产品”会怎么样？”，先按第5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> Sometimes that's worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. \"It was seen as a blunder,\" he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? \"I wouldn't pick a year to end print,\" he said. \"I would raise prices and make it into more of a legacy product.\"\n>\n> The most loyal customers would still get the product they favor, the idea goes, and they'd feel like they were helping sustain the quality of something they believe in. \"So if you're overpaying for print, you could feel like you were helping,\" Peretti said. \"Then increase it at a higher rate each year and essentially try to generate additional revenue.\" In other words, if you're going to make a print product, make it for the people who are already obsessed with it. Which may be what the Times is doing already. Getting the print edition seven days a week costs nearly $500 a year – more than twice as much as a digital-only subscription.\n\n提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。","context":{"mode":"image","asset":"questions","focus":[250,1301,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"question":"38","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>It can be inferred from Paragraphs 5 and 6 that a “legacy product” ______.\u003cbr>根据第五、六段可以推断，“传统保留产品”会怎么样？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>跨段推断题。题干要求判断“根据第五、六段可以推断，“传统保留产品”会怎么样？”，先按第5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Sometimes that&#39;s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. &quot;It was seen as a blunder,&quot; he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? &quot;I wouldn&#39;t pick a year to end print,&quot; he said. &quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in. &quot;So if you&#39;re overpaying for print, you could feel like you were helping,&quot; Peretti said. &quot;Then increase it at a higher rate each year and essentially try to generate additional revenue.&quot; In other words, if you&#39;re going to make a print product, make it for the people who are already obsessed with it. Which may be what the Times is doing already. Getting the print edition seven days a week costs nearly $500 a year – more than twice as much as a digital-only subscription.\u003c/p>\n\u003c/blockquote>\n\u003cp>提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. helps restore the glory of former times","level":3,"raw":"### A. helps restore the glory of former times\n\n> 帮助恢复昔日荣光\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。\n\n**错误类型：第三类——无中生有。**\n\n原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。\n\n原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。\n\n**命题人借用的原文材料：**\n\n> \"I would raise prices and make it into more of a legacy product.\"","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"38","option":"A"},"focusId":"focus-q38-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-A-0\">\u003cblockquote>\n\u003cp>帮助恢复昔日荣光\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。\u003c/p>\n\u003cp>原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. helps restore the glory of former times","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第5、6段的legacy product是指一种帮助恢复昔日荣光的产品。\n\nA里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。\n\n原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。\n\n第五、六段没有回顾纸媒黄金时代，也没有说销量、影响力或社会地位会恢复。后文只谈忠诚顾客愿意多付钱以及由此增加收入。\n\n传统保留产品可能带有怀旧色彩，但“保留旧产品”与“恢复旧日辉煌”不是同一结果。A把小众维持扩大成整体复兴。\n\n原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"38","option":"A"},"focusId":"focus-q38-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-A-0\">\u003cblockquote>\n\u003cp>帮助恢复昔日荣光\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。\u003c/p>\n\u003cp>原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第5、6段的legacy product是指一种帮助恢复昔日荣光的产品。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。\u003c/p>\n\u003cp>原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。\u003c/p>\n\u003cp>第五、六段没有回顾纸媒黄金时代，也没有说销量、影响力或社会地位会恢复。后文只谈忠诚顾客愿意多付钱以及由此增加收入。\u003c/p>\n\u003cp>传统保留产品可能带有怀旧色彩，但“保留旧产品”与“恢复旧日辉煌”不是同一结果。A把小众维持扩大成整体复兴。\u003c/p>\n\u003cp>原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. helps restore the glory of former times","level":4,"raw":"#### 写作视角法\n\n原文第5、6段是这样写的：\n\n> \"I would raise prices and make it into more of a legacy product.\"\n>\n> 提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\n\n把这一处放回全文，它承担的写作任务是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> The legacy product would bring back the newspaper’s former glory.\n>\n> 传统产品将恢复报纸昔日的辉煌。\n\n恢复荣光应评价它重获过去的地位。实际说顾客继续拥有喜爱产品与额外收入，没有从留存旧产品推出历史声望复兴。","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"38","option":"A"},"focusId":"focus-q38-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-A-0\">\u003cblockquote>\n\u003cp>帮助恢复昔日荣光\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。\u003c/p>\n\u003cp>原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第5、6段的legacy product是指一种帮助 支持其质量。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The legacy product would bring back the newspaper’s former glory.\u003c/p>\n\u003cp>传统产品将恢复报纸昔日的辉煌。\u003c/p>\n\u003c/blockquote>\n\u003cp>恢复荣光应评价它重获过去的地位。实际说顾客继续拥有喜爱产品与额外收入，没有从留存旧产品推出历史声望复兴。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>把纸报做成奢侈品意味着服务愿意持续付费的人群；具体人群由most loyal和already obsessed限定，不是扩大大众覆盖面。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>helps restore the glory of former times\u003cbr>帮助恢复昔日荣光\u003c/p>\n\u003c/blockquote>\n\u003cp>原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. is meant for the most loyal customers","level":3,"raw":"### B. is meant for the most loyal customers\n\n> 面向最忠实的顾客\n\n**做题模式中的状态：** 第一轮B保留。当时选项呈现为“is meant for the most [xxx] customers”，保留了相应遮挡。当时的定位线索是：B里的“is meant for the most”和原文“The most loyal customers”都在界定这种产品面向谁，因为选项说它服务最某类顾客，原文直接把后续方案落到最忠诚顾客，所以回看第六段开头和“In other words”后的句子。\n\n**选项类型：正确同义改写。**\n\n原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。B的“is meant for the most”同样把legacy product定义成面向最某类顾客。\n\n第五段的涨价方案会缩小大众购买意愿，第六段则说明核心顾客仍能获得喜欢的产品，并觉得自己在维持其品质。这不是追求更广泛流行，而是把产品留给忠诚度最高的人。\n\n**正确选项的原文依据：**\n\n> The most loyal customers wo 担本段原有功能，没有改变文章立场或另添事实。\n\n**复盘判断：B正确。**","context":{"mode":"image","asset":"questions","focus":[250,1487,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"38","option":"B"},"focusId":"focus-q38-B-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-B-0\">\u003cblockquote>\n\u003cp>面向最忠实的顾客\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时选项呈现为“is meant for the most [xxx] customers”，保留了相应遮挡。当时的定位线索是：B里的“is meant for the most”和原文“The most loyal customers”都在界定这种产品面向谁，因为选项说它服务最某类顾客，原文直接把后续方案落到最忠诚顾客，所以回看第六段开头和“In other words”后的句子。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。B的“is meant for the most”同样把legacy product定义成面向最某类顾客。\u003c/p>\n\u003cp>第五段的涨价方案会缩小大众购买意愿，第六段则说明核心顾客仍能获得喜欢的产品，并觉得自己在维持其品质。这不是追求更广泛流行，而是把产品留给忠诚度最高的人。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in.\u003c/p>\n\u003cp>&quot;So if you&#39;re overpaying for print, you could feel like you were helping,&quot; Peretti said.\u003c/p>\n\u003cp>&quot;Then increase it at a higher rate each year and essentially try to generate additional revenue.&quot; In other words, if you&#39;re going to make a print product, make it for the people who are already obsessed with it.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第5、6段的legacy product是指一种面向最忠实的顾客的产品。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“is meant for the most”和原文“The most loyal customers”都在界定这种产品面向谁，因为选项说它服务最某类顾客，原文直接把后续方案落到最忠诚顾客，所以回看第六段开头和“In other words”后的句子。\u003c/p>\n\u003cp>原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。B的“is meant for the most”同样把legacy product定义成面向最某类顾客。\u003c/p>\n\u003cp>第五段的涨价方案会缩小大众购买意愿，第六段则说明核心顾客仍能获得喜欢的产品，并觉得自己在维持其品质。这不是追求更广泛流行，而是把产品留给忠诚度最高的人。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in.\u003c/p>\n\u003cp>&quot;So if you&#39;re overpaying for print, you could feel like you were helping,&quot; Peretti said.\u003c/p>\n\u003cp>&quot;Then increase it at a higher rate each year and essentially try to generate additional revenue.&quot; In other words, if you&#39;re going to make a print product, make it for the people who are already obsessed with it.\u003c/p>\n\u003cp>提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The print edition would be retained for customers who are already deeply attached to it.\u003c/p>\n\u003cp>印刷版将为已经十分依恋它的顾客保留。\u003c/p>\n\u003c/blockquote>\n\u003cp>would still get与already obsessed把时间和人群都限定在现有忠实客户。提价没有改变他们愿意保留纸报的偏好。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>40题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>Make Your Print Newspaper a Luxury Good\u003cbr>把纸质报纸做成奢侈品\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>把纸报做成奢侈品意味着服务愿意持续付费的人群；具体人群由most loyal和already obsessed限定，不是扩大大众覆盖面。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>is meant for the most loyal customers\u003cbr>面向最忠实的顾客\u003c/p>\n\u003c/blockquote>\n\u003cp>第五段的涨价方案会缩小大众购买意愿，第六段则说明核心顾客仍能获得喜欢的产品，并觉得自己在维持其品质。这不是追求更广泛流行，而是把产品留给忠诚度最高的人。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. will have the cost of printing reduced","level":3,"raw":"### C. will have the cost of printing reduced\n\n> 将降低印刷成本\n\n**做题模式中的状态：** 第一轮C排除。当时的定位线索是：C里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。\n\n**错误类型：第一类——歪曲原意。**\n\n原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。C的“cost of printing reduced”写的是生产端印刷成本下降。\n\n第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。\n\n**命题人借用的原文材料：**\n\n> Sometimes that's worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. \"It was seen as a blunder,\" he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? \"I wouldn't pick a year to end print,\" he said. \"I would raise prices and make it into more of a legacy product.\"","context":{"mode":"image","asset":"questions","focus":[250,1574,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"38","option":"C"},"focusId":"focus-q38-C-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-C-0\">\u003cblockquote>\n\u003cp>将降低印刷成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。C的“cost of printing reduced”写的是生产端印刷成本下降。\u003c/p>\n\u003cp>第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Sometimes that&#39;s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. &quot;It was seen as a blunder,&quot; he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? &quot;I wouldn&#39;t pick a year to end print,&quot; he said. &quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. will have the cost of printing reduced","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 第5、6段的legacy product是指一种将降低印刷成本的产品。\n\nC里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。\n\n原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。C的“cost of printing reduced”写的是生产端印刷成本下降。\n\n一个变量是顾客支付价格，一个变量是报社生产成本；即使涨价能改善利润，也不等于printing cost本身降低。原文没有减少印刷机、配送或纸张开支的措施。\n\nC还把increase改成reduced，表面方向相反，但更根本的差别是对象换了：原文提高收费，C降低成本。\n\n第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。","context":{"mode":"image","asset":"questions","focus":[250,1574,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"38","option":"C"},"focusId":"focus-q38-C-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-C-0\">\u003cblockquote>\n\u003cp>将降低印刷成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“cost of printing reduced”和原文“increase it at a eretti were in charge at the Times? \"I wouldn't pick a year to end print,\" he said. \"I would raise prices and make it into more of a legacy product.\"\n>\n> 提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\n\n把这一处放回全文，它承担的写作任务是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Turning print into a legacy product would reduce the cost of printing it.\n>\n> 把纸报变为传统产品将降低印刷成本。\n\n提售价改变收入，不自动改变制造成本。原文给出的是每年更高价格带来additional revenue，缺少降低印刷支出的步骤。","context":{"mode":"image","asset":"questions","focus":[250,1574,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"38","option":"C"},"focusId":"focus-q38-C-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-C-0\">\u003cblockquote>\n\u003cp>将降低印刷成本\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。C的“cost of printing reduced”写的是生产端印刷成本下降。\u003c/p>\n\u003cp>第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Sometimes that&#39;s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. &quot;It was seen as a blunder,&quot; he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? &quot;I wouldn&#39;t pick a year to end print,&quot; he said. &quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第5、6段的legacy product是指一种将降低印刷成本的产品。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。\u003c/p>\n\u003cp>原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。C的“cost of printing reduced”写的是生产端印刷成本下降。\u003c/p>\n\u003cp>一个变量是顾客支付价格，一个变量是报社生产成本；即使涨价能改善利润，也不等于printing cost本身降低。原文没有减少印刷机、配送或纸张开支的措施。\u003c/p>\n\u003cp>C还把increase改成reduced，表面方向相反，但更根本的差别是对象换了：原文提高收费，C降低成本。\u003c/p>\n\u003cp>第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-C-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Sometimes that&#39;s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. &quot;It was seen as a blunder,&quot; he said. The move turned out to be foresighted. And if Peretti were in charge at the Times? &quot;I wouldn&#39;t pick a year to end print,&quot; he said. &quot;I would raise prices and make it into more of a legacy product.&quot;\u003c/p>\n\u003cp>提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Turning print into a legacy product would reduce the cost of printing it.\u003c/p>\n\u003cp>把纸报变为传统产品将降低印刷成本。\u003c/p>\n\u003c/blockquote>\n\u003cp>提售价改变收入，不自动改变制造成本。原文给出的是每年更高价格带来additional revenue，缺少降低印刷支出的步骤。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. will have the cost of printing reduced","level":4,"raw":"#### 主旨交叉验证法\n\n40题的正确答案是 ockquote>\n\u003cp>把这个主旨直接代入38题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>把纸报做成奢侈品意味着服务愿意持续付费的人群；具体人群由most loyal和already obsessed限定，不是扩大大众覆盖面。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>will have the cost of printing reduced\u003cbr>将降低印刷成本\u003c/p>\n\u003c/blockquote>\n\u003cp>第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. expands the popularity of the paper","level":3,"raw":"### D. expands the popularity of the paper\n\n> 扩大报纸的受欢迎程度\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。\n\n**错误类型：第一类——歪曲原意。**\n\n原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。\n\n涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。\n\n**命题人借用的原文材料：**\n\n> The most loyal customers would still get the product they favor, the idea goes, and they'd feel like they were helping sustain the quality of something they believe in.","context":{"mode":"image","asset":"questions","focus":[250,1663,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"38","option":"D"},"focusId":"focus-q38-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-D-0\">\u003cblockquote>\n\u003cp>扩大报纸的受欢迎程度\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。\u003c/p>\n\u003cp>涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. expands the popularity of the paper","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 第5、6段的legacy product是指一种扩大报纸的受欢迎程度的产品。\n\nD里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。\n\n原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。\n\n后文还说产品要为已经与它有深厚关系的人制作，价格接近纯数字订阅的两倍。这种高价、小众定位更像维持忠诚群体，而不是扩大普及率。\n\nD把“保留最忠诚顾客”改成“扩大所有人的欢迎度”，范围方向相反；没有任何新增读者或扩大销量的内容。\n\n涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。","context":{"mode":"image","asset":"questions","focus":[250,1663,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-38-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"38","option":"D"},"focusId":"focus-q38-D-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q38-D-0\">\u003cblockquote>\n\u003cp>扩大报纸的受欢迎程度\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。\u003c/p>\n\u003cp>涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u00 03cp>扩大报纸的受欢迎程度\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。\u003c/p>\n\u003cp>涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第5、6段的legacy product是指一种扩大报纸的受欢迎程度的产品。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。\u003c/p>\n\u003cp>原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。\u003c/p>\n\u003cp>后文还说产品要为已经与它有深厚关系的人制作，价格接近纯数字订阅的两倍。这种高价、小众定位更像维持忠诚群体，而不是扩大普及率。\u003c/p>\n\u003cp>D把“保留最忠诚顾客”改成“扩大所有人的欢迎度”，范围方向相反；没有任何新增读者或扩大销量的内容。\u003c/p>\n\u003cp>涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q38-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The most loyal customers would still get the product they favor, the idea goes, and they&#39;d feel like they were helping sustain the quality of something they believe in.\u003c/p>\n\u003cp>提价后的纸报保留给最忠实顾客，他们愿意为喜爱的产品多付费，并觉得自己在支持其质量。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品。说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品。选项若成立， d限定，不是扩大大众覆盖面。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>expands the popularity of the paper\u003cbr>扩大报纸的受欢迎程度\u003c/p>\n\u003c/blockquote>\n\u003cp>涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"38题结论","level":2,"raw":"### 38题结论\n\n> **38. B. is meant for the most loyal customers**\n\nA：原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。\n\nB：原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。\n\nC：原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。\n\nD：原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。","context":{"mode":"image","asset":"questions","focus":[250,1301,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"question":"38","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>38. B. is meant for the most loyal customers\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。\u003c/p>\n\u003cp>B：原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。\u003c/p>\n\u003cp>C：原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。\u003c/p>\n\u003cp>D：原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"39题 · 题干、题型与核心出处","level":2,"raw":"## 39题\n\n> Peretti believes that, in a changing world, ______.  \n> 佩雷蒂认为，在不断变化的世界里，什么说法成立？\n\n### 题型\n\n人物观点题。题干要求判断“佩雷蒂认为，在不断变化的世界里，什么说法成立？”，先按第7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> \"It's a really hard thing to do and it's a tremendous luxury that BuzzFeed doesn't have a legacy business,\" Peretti remarked. \"But we're going to have questions like that where we have things we're doing that don't make sense when the market changes and the world changes. In those situations, it's better to be more aggressive than less aggressive.\"\n\n佩雷蒂承认传统业务调整困难，又说市场变化会使现有做法失去合理性，因此应更主动而非更保守。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"question":"39","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Peretti believes that, in a changing world, ______.\u003cbr>佩雷蒂认为，在不断变化的世界里，什么说法成立？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>人物观点题。题干要求判断“佩雷蒂认为，在不断变化的世界里，什么说法成立？”，先按第7段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>&quot;It&#39;s a really hard thing to do and it&#39;s a tremendous luxury that BuzzFeed doesn&#39;t have a legacy business,&quot; Peretti remarked. &quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes. In those situations, it&#39;s better to be more aggressive than less aggressive.&quot;\u003c/p>\n\u003c/blockquote>\n\u003cp>佩雷蒂承认传统业务调整困难，又说市场变化会使现有做法失去合理性，因此应更主动而非更保守。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. traditional luxuries can stay unaffected","level":3,"raw":"### A. traditional luxuries can stay unaffected\n\n> 传统奢侈品可以不受影响\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。\n\n**错误类型：第一类——歪曲原意。**\n\n原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。A的“stay unaffected”却说传统奢侈品可以完全不受影响。\n\n最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。\n\n**命题人借用的原文材料：**\n\n> \"But we're going to have questions like that where we have things we're doing that don't make sense when the market changes and the world changes.","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"39","option":"A"},"focusId":"focus-q39-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q39-A-0\">\u003cblockquote>\n\u003cp>传统奢侈品可以不受影响\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。A的“stay unaffected”却说传统奢侈品可以完全不受影响。\u003c/p>\n\u003cp>最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>&quot;But we&#39;re going to have questions like that where we have things we&#39;re doing that don&#39;t make sense when the market changes and the world changes.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. traditional luxuries can stay unaffected","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 佩雷蒂认为，在变化的世界中，传统奢侈品可以不受影响。\n\nA里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。\n\n原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。A的“stay unaffected”却说传统奢侈品可以完全不受影响。\n\n佩雷蒂之所以提出涨价、重定位和更积极行动，正是因为维持原状不再合理。A若成立，最后一段无需讨论如何面对变化。\n\n最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。","context":{"mode":"image","asset":"questions","focus":[250,1926,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 4题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-39-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","q
