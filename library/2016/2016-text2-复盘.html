<script>
const DATA=[{"title":"史上最强阅读复盘法：一石五鸟法","level":2,"section":"方法总览","raw":"## 史上最强阅读复盘法：一石五鸟法\n\n### 省流：一石五鸟法怎么做\n\n为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\n\n下面我们来介绍一种全网首发的**一石五鸟**阅读训练法，**同时**备考**单词，阅读，新题型，翻译，作文**。\n\n**第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词**；\n\n**第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了**；\n\n**第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案**；\n\n**第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的**；\n\n**第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。**\n\n**我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。**\n\n\n### 一石五鸟法的原理\n\n#### 一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\n\n省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\n\n关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\n\n实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了**免除查单词的无效时间**，我们在的语篇中给大家**标注了语篇中的单词和词组语义**，这块主要也是一个资料的问题，我们给大家都做好了。\n\n例如：\n\n![重点词语境标注示例](素材/复盘方法_词汇语境示例.png)\n\n这样效率就是最高的。\n\n\n#### 一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\n\n传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\n\n1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把**同一个东西**拆开讲两遍。\n\n2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们**阅读练习的过程就包含翻译**，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\n\n3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？**前后矛盾**，逻辑混乱。\n\n**因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：**\n\n![意群法示例](素材/复盘方法_意群法示例.png)\n\n\n这种方式，你们**所需的语法仅需要主谓宾的划分**，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。**很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解**，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\n\n**那么，我们在使用的时候如何进行训练呢？**\n\n具体操作如下：\n\n**做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：**\n\n**1、将每个句子拆成若干个相对独立且完整的意群**\n\n**2、针对每个意群，希望你可以，按字面意思直译每个独立的意群**\n\n**3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序**\n\n**注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。**\n\n**然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。**\n\n\n#### 一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\n\n其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\n\n我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\n\n1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\n\n2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\n\n**以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。**\n\n\n#### 一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n首先，这大概率是你们的新题型备考思路：\n\n在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，**却找不到更多的训练资料**。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\n\n那么，新题型的备考真相是什么？\n\n我们先看看考纲考新题型是想考你们什么：\n\n![新题型考纲总览](素材/复盘方法_新题型考纲总览.png)\n\n![新题型考纲表格](素材/复盘方法_新题型考纲表格.png)\n\n![七选五题型说明](素材/复盘方法_七选五题型说明.png)\n\n\n**七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节**\n\n![小标题题考点](素材/复盘方法_小标题题考点.png)\n\n\n**排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达**\n\n![排序题考点](素材/复盘方法_排序题考点.png)\n\n\n**匹配题考察点：文章中出现的不同人物观点的独特性**\n\n![匹配题考点](素材/复盘方法_匹配题考点.png)\n\n\n总结一下：**文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架**\n\n新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\n\n1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是**平时没有相关的文章逻辑梳理训练**，就这么简单。\n\n2.文章逻辑这个方面的训练**单纯靠那十几篇新题型真题是完全不够的**，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\n\n那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\n\n因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\n\n这里顺便说下**完型**，我个人看法是**直接随缘**，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\n\n那么，段落和全文逻辑框架要注意哪些呢“\n\n**1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；**\n\n**2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；**\n\n**3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；**\n\n**4.全文的主旨与其支撑细节（需要自己概括）。**\n\n**第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用**\n\n**最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。**\n\n**那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。**\n\n只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\n\n\n#### 一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\n\n省流，我们也给大家准备好了，可以直接用我们的。\n\n从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\n\n\n## 为什么考研英语备考实际只需要两到三个月的有效备考工作量\n\n传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\n\n事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\n\n从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\n\n不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\n\n英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\n\n因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\n\n\n---\n\n---\n","html":"<h3>省流：一石五鸟法怎么做</h3>\n<p>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。</p>\n<p>下面我们来介绍一种全网首发的<strong>一石五鸟</strong>阅读训练法，<strong>同时</strong>备考<strong>单词，阅读，新题型，翻译，作文</strong>。</p>\n<p><strong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词</strong>；</p>\n<p><strong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了</strong>；</p>\n<p><strong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案</strong>；</p>\n<p><strong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的</strong>；</p>\n<p><strong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。</strong></p>\n<p><strong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。</strong></p>\n<h3>一石五鸟法的原理</h3>\n<h4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升</h4>\n<p>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。</p>\n<p>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。</p>\n<p>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了<strong>免除查单词的无效时间</strong>，我们在的语篇中给大家<strong>标注了语篇中的单词和词组语义</strong>，这块主要也是一个资料的问题，我们给大家都做好了。</p>\n<p>例如：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\"><figcaption>重点词语境标注示例</figcaption></figure>\n<p>这样效率就是最高的。</p>\n<h4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升</h4>\n<p>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：</p>\n<p>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把<strong>同一个东西</strong>拆开讲两遍。</p>\n<p>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们<strong>阅读练习的过程就包含翻译</strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。</p>\n<p>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？<strong>前后矛盾</strong>，逻辑混乱。</p>\n<p><strong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_intent_example\" alt=\"意群法示例\"><figcaption>意群法示例</figcaption></figure>\n<p>这种方式，你们<strong>所需的语法仅需要主谓宾的划分</strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。<strong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解</strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。</p>\n<p><strong>那么，我们在使用的时候如何进行训练呢？</strong></p>\n<p>具体操作如下：</p>\n<p><strong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：</strong></p>\n<p><strong>1、将每个句子拆成若干个相对独立且完整的意群</strong></p>\n<p><strong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群</strong></p>\n<p><strong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序</strong></p>\n<p><strong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。</strong></p>\n<p><strong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。</strong></p>\n<h4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升</h4>\n<p>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。</p>\n<p>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：</p>\n<p>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。</p>\n<p>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。</p>\n<p><strong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。</strong></p>\n<h4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升</h4>\n<p>首先，这大概率是你们的新题型备考思路：</p>\n<p>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，<strong>却找不到更多的训练资料</strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。</p>\n<p>那么，新题型的备考真相是什么？</p>\n<p>我们先看看考纲考新题型是想考你们什么：</p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\"><figcaption>新题型考纲总览</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\"><figcaption>新题型考纲表格</figcaption></figure>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\"><figcaption>七选五题型说明</figcaption></figure>\n<p><strong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_smalltitle\" alt=\"小标题题考点\"><figcaption>小标题题考点</figcaption></figure>\n<p><strong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_sorting\" alt=\"排序题考点\"><figcaption>排序题考点</figcaption></figure>\n<p><strong>匹配题考察点：文章中出现的不同人物观点的独特性</strong></p>\n<figure class=\"media-card\"><img class=\"embedded-asset\" data-asset=\"method_matching\" alt=\"匹配题考点\"><figcaption>匹配题考点</figcaption></figure>\n<p>总结一下：<strong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架</strong></p>\n<p>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：</p>\n<p>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是<strong>平时没有相关的文章逻辑梳理训练</strong>，就这么简单。</p>\n<p>2.文章逻辑这个方面的训练<strong>单纯靠那十几篇新题型真题是完全不够的</strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。</p>\n<p>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。</p>\n<p>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。</p>\n<p>这里顺便说下<strong>完型</strong>，我个人看法是<strong>直接随缘</strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。</p>\n<p>那么，段落和全文逻辑框架要注意哪些呢“</p>\n<p><strong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；</strong></p>\n<p><strong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；</strong></p>\n<p><strong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；</strong></p>\n<p><strong>4.全文的主旨与其支撑细节（需要自己概括）。</strong></p>\n<p><strong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用</strong></p>\n<p><strong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。</strong></p>\n<p><strong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。</strong></p>\n<p>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。</p>\n<h4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升</h4>\n<p>省流，我们也给大家准备好了，可以直接用我们的。</p>\n<p>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。</p>\n<h2>为什么考研英语备考实际只需要两到三个月的有效备考工作量</h2>\n<p>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。</p>\n<p>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。</p>\n<p>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。</p>\n<p>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。</p>\n<p>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。</p>\n<p>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。</p>\n<hr />\n<hr />\n","context":null,"meta":{}},{"title":"第1段","raw":"## 第1段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| polls | n.民意调查 | rate | v.评价 | alongside | prep.与……并列 |\n| royal family | 王室 | countryside | n.乡村 | proudest | adj.最自豪的 |\n| political support | 政治支持 | curious | adj.奇特的 |  |  |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第1段重点词语境","focus":[95,137,900,351],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":true},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>polls</td>\n<td>n.民意调查</td>\n<td>rate</td>\n<td>v.评价</td>\n<td>alongside</td>\n<td>prep.与……并列</td>\n</tr>\n<tr>\n<td>royal family</td>\n<td>王室</td>\n<td>countryside</td>\n<td>n.乡村</td>\n<td>proudest</td>\n<td>adj.最自豪的</td>\n</tr>\n<tr>\n<td>political support</td>\n<td>政治支持</td>\n<td>curious</td>\n<td>adj.奇特的</td>\n<td></td>\n<td></td>\n</tr>\n</tbody></table></div>\n"},{"title":"第2段","raw":"## 第2段\n\n| 表达 | 词性＋意思 | 表达 | 词性＋意思 | 表达 | 词性＋意思 |\n| --- | --- | --- | --- | --- | --- |\n| launch | v.发起 | rescue | v.挽救 | city dwellers | 城市居民 |\n| leisure | n.休闲 | refreshing | adj.清新的 | green belts | 绿化带 |\n| concrete | n.混凝土 | consume | v.吞噬 | guardianship | n.保护 |","section":"第一鸟 · 词汇","context":{"mode":"image","asset":"articleAnnotated","label":"第2段重点词语境","focus":[95,661,900,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain","includeTitle":false},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n<th>表达</th>\n<th>词性＋意思</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>launch</td>\n<td>v.发起</td>\n<td>rescue</td>\n<td>v.挽救</td>\n<td>city dwellers</td>\n<td>城市居民</td>\n</tr>\n<tr>\n<td>leisure</td>\n<td>n.休闲</td>\n<td>refreshing</t ting it / should unite / the left and right / of the political spectrum.</p>\n</section>"},{"title":"第6段","raw":"### 意群翻译 · 第6段\n\n发展应该被规划，/ 而不是放任自流。\n\n仅次于荷兰，/ 英国是 / 欧洲最拥挤的国家。\n\n半个世纪 / 的城乡规划 / 使它能够 / 保持 / 令人羡慕的乡村连贯性，/ 同时仍然允许 / 低密度城市生活。\n\n毫无疑问 / 另一种选择是 – / 被破坏的景观 / 葡萄牙南部、/ 西班牙或爱尔兰的。\n\n避免这种情况 / 而不是促进它 / 应该团结 / 左派和右派 / 政治光谱的。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"第6段精读与翻译","focus":[95,3753,900,416],"sourceW":1080,"sourceH":6116,"focusUnit":"paragraph","focusAlign":"contain"},"level":4,"meta":{"cumulative":true,"cumulativeGroup":"paragraph-6","cumulativeFinal":false},"focusId":"focus-paragraph-6-2","html":"<section class=\"revealPart\" id=\"focus-paragraph-6-0\"><h3>完整原文 · 第6段</h3>\n<p>Development should be planned, not let rip. After the Netherlands, Britain is Europe&#39;s most crowded country. Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living. There is no doubt of the alternative – the corrupted landscapes of southern Portugal, Spain or Ireland. Avoiding this rather than promoting it should unite the left and right of the political spectrum.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-1\"><h3>意群划分 · 第6段</h3>\n<p>Development should be planned, / not let rip.</p>\n<p>After the Netherlands, / Britain is / Europe&#39;s most crowded country.</p>\n<p>Half a century / of town and country planning / has enabled it / to retain / an enviable rural coherence, / while still permitting / low-density urban living.</p>\n<p>There is no doubt / of the alternative – / the corrupted landscapes / of southern Portugal, / Spain or Ireland.</p>\n<p>Avoiding this / rather than promoting it / should unite / the left and right / of the political spectrum.</p>\n</section><section class=\"revealPart\" id=\"focus-paragraph-6-2\"><h3>意群翻译 · 第6段</h3>\n<p>发展应该被规划，/ 而不是放任自流。</p>\n<p>仅次于荷兰，/ 英国是 / 欧洲最拥挤的国家。</p>\n<p>半个世纪 / 的城乡规划 / ny more + every year → concrete consumes → more of it.\n\nIt needs → constant guardianship.\n\n**第3段**\n\nAt the next election → none of the big parties → seem likely to endorse → this sentiment.\n\nThe Conservatives' planning reform → explicitly gives → rural development：(priority over conservation) → even authorising → \"off-plan\" building：(where local people might object).\n\nThe concept of sustainable development → has been defined → as profitable.\n\nLabour likewise → wants to discontinue → local planning：(where councils oppose development).\n\nThe Liberal Democrats → are silent.\n\nOnly Ukip：(sensing its chance) → has sided with → those pleading for：(a more considered approach：(to using green land)).\n\nIts Campaign to Protect Rural England → struck terror → into many local Conservative parties.\n\n**第4段**\n\nThe sensible place：(to build new houses + factories + offices) → is where people are：(in cities and towns：(where infrastructure is in place)).\n\nThe London agents：(Stirling Ackroyd) → recently identified → enough sites：(for half a million houses)：(in the London area alone)：(with no intrusion：(on green belt)).\n\nWhat is true of London → is even truer → of the provinces.\n\n**第5段**\n\nThe idea：(that \"housing crisis\" equals \"concreted meadows\") → is pure lobby talk.\n\nThe issue is not：(the need for more houses) // but, as always：(where to put them).\n\nUnder lobby pressure → George Osborne favours → rural new-build：(against urban renovation and renewal).\n\nHe favours → out-of-town shopping sites：(against high streets).\n\nThis is not a free market // but a biased one.\n\nRural towns and villages → have grown + will always grow.\n\nThey do so best：(where building sticks to their edges + respects their character).\n\nWe do not ruin → urban conservation areas.\n\nWhy ruin → rural ones?\n\n**第6段**\n\nDevelopment should be planned // not let rip.\n\nAfter the Netherlands → Britain is → Europe's most crowded country.\n\nHalf a century：(of town and country planning) → has enabled it → to retain → an enviable rural coherence：(while still permitting → low-density urban living).\n\nThere is no doubt → of the alternative：(the corrupted landscapes：(of southern Portugal + Spain + Ireland)).\n\nAvoiding this：(rather than promoting it) → should unite → the left and right：(of the political spectrum).","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>For the first time in history → more people live in towns → than in the country.</p>\n<p>In Britain → this has had → a curious result.</p>\n<p>While polls show：(Britons rate &quot;the countryside&quot;：(alongside the royal family + Shakespeare + the National Health Service (NHS))：(as what makes them proudest：(of their country))) // this has limited political support.</p>\n<p><strong>第2段</strong></p>\n<p>A century ago → Octavia Hill launched → the National Trust：(not to rescue stylish houses // but to save：(&quot;the beauty of natural places：(for everyone forever)&quot;)).</p>\n<p>It was specifically → to provide city dwellers：(with spaces for leisure：(where they could experience：(&quot;a refreshing air&quot;))).</p>\n<p>Hill&#39;s pressure → later led to → the creation of national parks + green belts.</p>\n<p>They don&#39;t make countryside → any more + every year → concrete consumes → more of it.</p>\n<p>It needs → constant guardianship.</p>\n<p><strong>第3段</strong></p>\n<p>At the next election → none of the big parties → seem likely to endorse → this sentiment.</p>\n<p>The Conservatives&#39; planning reform → explicitly gives → rural development：(priority over conservation) → even authorising → &quot;off-plan&quot; building：(where local people might object).</p>\n<p>The concept of sustainable development → has been defined → as profitable.</p>\n<p>Labour likewise → wants to discontinue → local planning：(where councils oppose development).</p>\n<p>The Liberal Democrats → are silent.</p>\n<p>Only Ukip：(sensing its chance) → has sided with → those pleading for：(a more considered approach：(to using green land)).</p>\n<p>Its Campaign to Protect Rural England → struck terror → into many local Conservative parties.</p>\n<p><strong>第4段</strong></p>\n<p>The sensible place：(to build new houses + factories + offices) → is where people are：(in cities and towns：(where infrastructure is in place)).</p>\n<p>The London agents：(Stirling Ackroyd) → recently identified → enough sites：(for half a million houses)：(in the London area alone)：(with no intrusion：(on green belt)).</p>\n<p>What is true of London → is even truer → of the provinces.</p>\n<p><strong>第5段</strong></p>\n<p>The idea：(that &quot;housing crisis&quot; equals &quot;concreted meadows&quot;) → is pure lobby talk.</p>\n<p>The issue is not：(the need for more houses) // but, as always：(where to put them).</p>\n<p>Under lobby pressure → George Osborne favours → rural new-build：(against urban renovation and renewal).</p>\n<p>He favours → out-of-town shopping sites：(against high streets).</p>\n<p>This is not a free market // but a biased one.</p>\n<p>Rural towns and villages → have grown + will always grow.</p>\n<p>They do so best：(where building sticks to their edges + respects their character).</p>\n<p>We do not ruin → urban conservation areas.</p>\n<p>Why ruin → rural ones?</p>\n<p><strong>第6段</strong></p>\n<p>Development should be planned // not let rip.</p>\n<p>After the Netherlands → Britain is → Europe&#39;s most crowded country.</p>\n<p>Half a century：(of town and country planning) → has enabled it → to retain → an enviable rural coherence：(while still permitting → low-density urban living).</p>\n<p>There is no doubt → of the alternative：(the corrupted landscapes：(of southern Portugal + Spain + Ireland)).</p>\n<p>Avoiding this：(rather than promoting it) → should unite → the left and right：(of the political spectrum).</p>\n"},{"title":"中文版句子逻辑（选修）","raw":"## 中文版句子逻辑（选修）\n\n**第1段**\n\n历史上第一次 → 更多人居住在城镇 → 比在乡村。\n\n在英国 → 这产生了 → 一个奇怪的结果。\n\n尽管民意调查显示：(英国人将\"乡村\"：(与皇室家族 + 莎士比亚 + 国民健康服务（NHS）并列)：(作为让他们最自豪的：(关于他们国家的))) // 这获得有限的政治支持。\n\n**第2段**\n\n一个世纪前 → 奥克塔维亚·希尔创立了 → 国民信托：(不是为了拯救时尚的房屋 // 而是为了保护：(\"自然之地的美景：(为所有人永远保存)\"))。\n\n它特别是 → 为城市居民提供：(休闲空间：(在那里他们可以体验：(\"清新的空气\")))。\n\n希尔的压力 → 后来导致了 → 国家公园的创建 + 绿化带。\n\n他们不再制造乡村了 → 任何更多 + 每年 → 混凝土吞噬 → 更多的乡村。\n\n它需要 → 持续的守护。\n\n**第3段**\n\n在下次选举中 → 没有大党 → 似乎可能支持 → 这种情感。\n\n保守党的规划改革 → 明确给予 → 乡村开发：(优先于保护) → 甚至授权 → \"计划外\"建设：(在当地人可能反对的地方)。\n\n可持续发展的概念 → 已被定义为 → 有利可图的。\n\n工党同样 → 想要终止 → 地方规划：(在议会反对开发的地方)。\n\n自由民主党 → 保持沉默。\n\n只有英国独立党：(感觉到它的机会) → 已经站在一边 → 那些恳求：(更审慎的方法：(使用绿地))的人。\n\n它的保护英格兰乡村运动 → 引起恐慌 → 在许多地方保守党中。\n\n**第4段**\n\n合理的地方：(建造新房屋 + 工厂 + 办公室) → 是人们所在的地方：(在城市和城镇：(基础设施到位的地方))。\n\n伦敦代理商：(斯特林·阿克罗伊德) → 最近确定了 → 足够的地点：(为五十万套房屋)：(仅在伦敦地区)：(没有侵犯：(绿化带))。\n\n对伦敦适用的 → 更加适用 → 对外省。\n\n**第5段**\n\n这个想法：(\"住房危机\"等于\"混凝土化的草地\") → 是纯粹的游说言论。\n\n问题不是：(需要更多房屋) // 而是，一如既往：(把它们放在哪里)。\n\n在游说压力下 → 乔治·奥斯本偏爱 → 乡村新建筑：(而非城市翻新和更新)。\n\n他偏爱 → 城外购物点：(而非商业街)。\n\n这不是自由市场 // 而是有偏见的市场。\n\n乡村城镇和村庄 → 已经增长 + 将永远增长。\n\n它们最好的增长方式：(是建筑贴着边缘 + 尊重它们的特色)。\n\n我们不破坏 → 城市保护区。\n\n为什么破坏 → 乡村的呢？\n\n**第6段**\n\n发展应该被规划 // 而不是放任自流。\n\n仅次于荷兰 → 英国是 → 欧洲最拥挤的国家。\n\n半个世纪：(的城乡规划) → 使它能够 → 保持 → 令人羡慕的乡村连贯性：(同时仍然允许 → 低密度城市生活)。\n\n毫无疑问 → 另一种选择是：(被破坏的景观：(葡萄牙南部 + 西班牙 + 爱尔兰的))。\n\n避免这种情况：(而不是促进它) → 应该团结 → 左派和右派：(政治光谱的)。","section":"第二鸟 · 精读与翻译","context":{"mode":"image","asset":"articleAnnotated","label":"全文重点词与语境","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<p><strong>第1段</strong></p>\n<p>历史上第一次 → 更多人居住在城镇 → 比在乡村。</p>\n<p>在英国 → 这产生了 → 一个奇怪的结果。</p>\n<p>尽管民意调查显示：(英国人将&quot;乡村&quot;：(与皇室家族 + 莎士比亚 + 国民健康服务（NHS）并列)：(作为让他们最自豪的：(关于他们国家的))) // 这获得有限的政治支持。</p>\n<p><strong>第2段</strong></p>\n<p>一个世纪前 → 奥克塔维亚·希尔创立了 → 国民信托：(不是为了拯救时尚的房屋 // 而是为了保护：(&quot;自然之地的美景：(为所有人永远保存)&quot;))。</p>\n<p>它特别是 → 为城市居民提供：(休闲空间：(在那里他们可以体验：(&quot;清新的空气&quot;)))。</p>\n<p>希尔的压力 → 后来导致了 → 国家公园的创建 + 绿化带。</p>\n<p>他们不再制造乡村了 → 任何更多 + 每年 → 混凝土吞噬 → 更多的乡村。</p>\n ：</p>\n<blockquote>\n<p>半个世纪的城乡规划使其能够保持令人羡慕的乡村连贯性，同时仍允许低密度的城市生活。</p>\n</blockquote>\n</section>"},{"title":"3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升","raw":"之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。\n\n而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\n\n1. 题目真正在问什么，这是什么题型，这个题型一般如何去应对；\n2. 每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\n3. 我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。\n\n其中两个判据的含义如下，我们在之前的做题模式里都见过：\n\n- **定位比对：**检查选项有没有准确改写局部原文；\n- **写作视角：**假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\n\n命题人的命题手法主要有三类，如下：\n\n#### 第一类：歪曲原意\n\n##### 定义\n\n选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\n\n但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\n\n- 肯定改成否定；\n- 原因改成结果；\n- 目的改成原因；\n- 主体或对象偷换；\n- 时间范围改变；\n- 程度扩大或缩小；\n- 动词词义改变；\n- 语法结构改变；\n- 作者承认 A 但支持 B，被改成作者否认 A。\n\n这一类的关键是：\n\n> **选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。**\n\n##### 典型误选脑回路\n\n咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\n\n所以这一类不能只问：\n\n> 这个词文章里有没有？\n\n而要问：\n\n> 原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\n\n------\n\n#### 第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\n\n##### 定义\n\n这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\n\n它错的不是“原文没这么说”，而是：\n\n> **它没有回答题干真正问的层面、范围或者功能。**\n\n常见情况包括：\n\n- 题目问段落主旨，选项是段落中的一个细节；\n- 题目问全文主旨，选项只是某一段的内容；\n- 题目问例子作用，选项只是例子内部发生了什么；\n- 题目问作者观点，选项只是作者用来论证观点的事实；\n- 题目限定某一段，选项出处却在其他段；\n- 题目问论点，选项给的是论据；\n- 题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\n\n这一类的关键是：\n\n> **选项内容可以是真的，但它回答错了问题。**\n\n##### 典型误选脑回路\n\n咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\n\n但阅读选择题不是判断选项本身真假，而是判断：\n\n> 这个选项能不能准确回答题干？\n\n所以这一类最常见的错误脑回路是：\n\n> 文章里确实写了 → 这个选项是真的 → 那就一定能选。\n\n真正应该继续追问：\n\n> 题干问的是主旨、作用、态度还是细节？\n>  这个选项是论点还是论据？\n>  它的出处在题干限定范围内吗？\n>  它是在回答例子作用，还是只复述例子内容？\n\n------\n\n#### 第三类：无中生有\n\n##### 定义\n\n结合题干和选项的完整意思，文章实际没有表达这个命题。\n\n选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\n\n以科研与能源文章为例，常见的脑补包括：\n\n- 原文有 energy，脑补出 energy shortage；\n- 原文有 sustainable，脑补出 suspicions about sustainable energy；\n- 原文有研究耗能，脑补出已经造成严重后果；\n- 原文有净零目标，脑补出某项目由净零倡议推动；\n- 原文说用了河流供电，脑补成解决了能源短缺；\n- 原文说某项技术有用，脑补成问题非常紧迫；\n- 原文提到一个目标，脑补出某种因果、目的或态度。\n\n这一类的关键是：\n\n> **文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。**\n\n##### 典型误选脑回路\n\n咱们不是在比对原文，而是在替作者把文章继续写下去：\n\n> 原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\n\n但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\n\n无中生有的分析不能只写：\n\n> 原文没提，所以错。\n\n而要写清楚：\n\n> 命题人拿了文章中的哪个词或哪句话；\n>  咱们从这个地方开始怎样脑补；\n>  最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\n\n\n\n那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\n\n本篇没有用于先行确定全文主旨的选择题，我们从26题开始，按真实题号依次复盘。每个选项先回看做题时的状态，再做定位比对与写作视角分析，最后给出复盘判断。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"题目页","focus":null,"sourceW":1624,"sourceH":2262},"level":1,"meta":{"kind":"section-cover","mergedIntro":true},"html":"<p>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过定位比对和写作视角继续判断。</p>\n<p>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：</p>\n<ol>\n<li>题目真正在问什么，这是什么题型，这个题型一般如何去应对；</li>\n<li>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；</li>\n<li>我们本篇使用的两个方法：定位比对和写作视角，分别怎样支持或否定这个选项。</li>\n</ol>\n<p>其中两个判据的含义如下，我们在之前的做题模式里都见过：</p>\n<ul>\n<li><strong>定位比对：</strong>检查选项有没有准确改写局部原文；</li>\n<li><strong>写作视角：</strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；</li>\n</ul>\n<p>命题人的命题手法主要有三类，如下：</p>\n<h4>第一类：歪曲原意</h4>\n<h5>定义</h5>\n<p>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。</p>\n<p>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：</p>\n<ul>\n<li>肯定改成否定；</li>\n<li>原因改成结果；</li>\n<li>目的改成原因；</li>\n<li>主体或对象偷换；</li>\n<li>时间范围改变；</li>\n<li>程度扩大或缩小；</li>\n<li>动词词义改变；</li>\n<li>语法结构改变；</li>\n<li>作者承认 A 但支持 B，被改成作者否认 A。</li>\n</ul>\n<p>这一类的关键是：</p>\n<blockquote>\n<p><strong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。</strong></p>\n</blockquote>\n<h5>典型误选脑回路</h5>\n<p>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。</p>\n<p>所以这一类不能只问：</p>\n<blockquote>\n<p>这个词文章里有没有？</p>\n</blockquote>\n<p>而要问：</p>\n<blockquote>\n<p>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？</p>\n</blockquote>\n<hr>\n<h4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答</h4>\n<h5>定义</h5>\n<p>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。</p>\n<p>它错的不是“原文没这么说”，而是：</p>\n<blockquote>\n<p><strong>它没有回答题干真正问的层面、范围或者功能。</strong></p>\n</blockquot tons介绍了民众怎样评价乡村，因此先读完整的第1段。\n\n### 核心出处\n\n> While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"26","questionIntro":true},"html":"<blockquote>\n<p>Britain’s public sentiment about the countryside ______.</p>\n<p>英国公众对于乡村的情感______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节题：题干问公众情感在现实中怎样体现，需分清自豪对象的并列与政治支持不足的反差。</p>\n<p>Britain’s public sentiment about the countryside是在问英国民众对乡村的情感。第1段的polls show Britons介绍了民众怎样评价乡村，因此先读完整的第1段。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n</blockquote>\n"},{"title":"A. has brought much benefit to the NHS","raw":"### A. has brought much benefit to the NHS\n\n> 英国公众对乡村的情感已为NHS带来许多利益。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n乡村与NHS都是英国人引以为豪的对象，alongside表示并列。A却把对乡村的情感写成NHS获益的原因。\n\n**出处：**\n\n> For the first time in history more people live in towns than in the country. In Britain this has had a curious result. While polls show Britons rate \"the countryside\" alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-26-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>英国公众对乡村的情感已为NHS带来许多利益。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>乡村与NHS都是英国人引以为豪的对象，alongside表示并列。A却把对乡村的情感写成NHS获益的原因。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For the first time in history more people live in towns than in the country. In Britain this has had a curious result. While polls show Britons rate &quot;the countryside&quot; alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n</blockquote>\n</section>"},{"title":"A. has brought much benefit to the NHS","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 英国公众对乡村的情感已为NHS带来许多利益。\n\n`has brought much benefit to the NHS`把医疗服务体系当作受益者。第1段在`alongside`之后提到`National Health Service`，它与乡村都出现在民众的评价之中，须回看末句分清两者的关系。\n\n原文用`alongside`并列乡村与国民医疗服务体系，作出评价的是`Britons`，两者都令英国人自豪。本项的`has brought much benefit to the NHS`却让乡村情感成为带来利益的原因，让医疗服务体系成为受益者。民众对两个对象有相同评价，并不能改写成一个对象的相关情感给另一个对象带来好处；本项把并列评价接成了因果作用。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-26-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>英国公众对乡村的情感已为NHS带来许多利益。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>乡村与NHS都是英国人引以为豪的对象，alongside表示并列。A却把对乡村的情感写成NHS获益的原因。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For the first time in history more people live in towns than in the country. In Britain this has had a curious result. While polls show Britons rate &quot;the countryside&quot; alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国公众对乡村的情感已为NHS带来许多利益。</p>\n</blockquote>\n<p><code>has brought much benefit to the NHS</code>把医疗服务体系当作受益者。第1段在<code>alongside</code>之后提到<code>National Health Service</code>，它与乡村都出现在民众的评价之中，须回看末句分清两者的关系。</p>\n<p>原文用<code>alongside</code>并列乡村与国民医疗服务体系，作出评价的是<code>Britons</code>，两者都令英国人自豪。本项的<code>has brought much benefit to the NHS</code>却让乡村情感成为带来利益的原因，让医疗服务体系成为受益者。民众对两个对象有相同评价，并不能改写成一个对象的相关情感给另一个对象带来好处；本项把并列评价接成了因果作用。</p>\n</section>"},{"title":"A. has brought much benefit to the NHS","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> For the first time in history more people live in towns than in the country. In Britain this has had a curious result. While polls show Britons rate \"the countryside\" alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.\n>\n> 历史上第一次，城镇居民多于乡村居民。在英国，这产生一个奇特结果：民调显示，英国人把乡村与王室、莎士比亚、NHS同列为最令其为国家自豪的事物，但这份情感获得的政治支持有限。\n\n作者先列公众珍视的事物，再用政治支持有限形成反差，未介绍这些对象之间的利益流动。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Public sentiment about the countryside has brought much benefit to the NHS.\n>\n> 英国公众对乡村的情感已为NHS带来许多利益。\n\nA需要乡村情感怎样帮助医疗体系的作用链。相同的人对两个对象都自豪，不能改写成其中一个对象给另一个带来好处。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"A","cumulative":true,"cumulativeGroup":"question-26-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-A-0\"><blockquote>\n<p>英国公众对乡村的情感已为NHS带来许多利益。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n< ntryside&quot; alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国公众对乡村的情感得到王室的充分支持。</p>\n</blockquote>\n<p><code>fully backed by the royal family</code>将王室写成乡村情感的支持者。第1段的<code>alongside the royal family</code>却把王室放进民众引以为豪的事物之列，回看这句，区分王室被评价和王室作出支持这两种关系。</p>\n<p>原文中<code>Britons</code>对王室和乡村作出评价，<code>alongside</code>表明二者同为民众自豪的对象。本项的<code>fully backed by the royal family</code>则让王室成为行动者，充分支持民众的乡村情感。公众对王室的自豪感，不能倒过来成为王室对乡村情感的支持；句末的有限政治支持也没有把王室单独指定为充分支持的一方。</p>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-C-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>For the first time in history more people live in towns than in the country. In Britain this has had a curious result. While polls show Britons rate &quot;the countryside&quot; alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n<p>历史上第一次，城镇居民多于乡村居民。在英国，这产生一个奇特结果：民调显示，英国人把乡村与王室、莎士比亚、NHS同列为最令其为国家自豪的事物，但这份情感获得的政治支持有限。</p>\n</blockquote>\n<p>alongside把王室与乡村并列，作出自豪评价的是Britons，随后谈到的政治支持又只有limited。</p>\n<p>如果C真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public sentiment about the countryside is fully backed by the royal family.</p>\n<p>英国公众对乡村的情感得到王室的充分支持。</p>\n</blockquote>\n<p>C需要王室明确支持公众乡村情感的行为。公众对王室自豪并不能倒推出王室支持乡村，limited也不能证明某一方fully backed。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. is not well reflected in politics","raw":"### D. is not well reflected in politics\n\n> 英国公众对乡村的情感未在政治中得到充分体现。\n\n**做题模式中的状态：** 第一轮保留D，此时D尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n公众高度珍视乡村，政治支持却有限。D的not well reflected概括这种民意与政治取向之间的落差。\n\n**出处：**\n\n> For the first time in history more people live in towns than in the country. I 留民众情感强烈，也保留政治体现不足，没有将limited夸大成完全无人支持；与后文政党取向也能相接。\n\n**复盘判断：D正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"26","option":"D","cumulative":true,"cumulativeGroup":"question-26-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-26-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-26-option-D-0\"><blockquote>\n<p>英国公众对乡村的情感未在政治中得到充分体现。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留D，此时D尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>公众高度珍视乡村，政治支持却有限。D的not well reflected概括这种民意与政治取向之间的落差。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>For the first time in history more people live in towns than in the country. In Britain this has had a curious result. While polls show Britons rate &quot;the countryside&quot; alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>英国公众对乡村的情感未在政治中得到充分体现。</p>\n</blockquote>\n<p><code>not well reflected in politics</code>问这份情感在政治中体现得怎样，第1段的<code>limited political support</code>正好描述它得到的政治支持，因此回看民调内容与句末支持程度的转折。</p>\n<p>原文说民众将乡村列为最令他们为国家自豪的事物之一，却又以<code>limited political support</code>说明其政治支持有限，<code>While</code>连接了民众重视与政治支持不足的反差。本项<code>not well reflected in politics</code>把这种反差表述为公众情感没有在政治中得到充分体现，既没有把民众的重视减少，也没有将有限支持夸大成毫无支持。</p>\n</section><section class=\"revealPart\" id=\"focus-question-26-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>For the first time in history more people live in towns than in the country. In Britain this has had a curious result. While polls show Britons rate &quot;the countryside&quot; alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n<p>历史上第一次，城镇居民多于乡村居民。在英国，这产生一个奇特结果：民调显示，英国人把乡村与王室、莎士比亚、NHS同列为最令其为国家自豪的事物，但这份情感获得的政治支持有限。</p>\n</blockquote>\n<p>While引出民调的重视，主句以limited political support转到实际政治支持，反差就在同一句中建立。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Public sentiment about the countryside is not well reflected in politics.</p>\n<p>英国公众对乡村的情感未在政治中得到充分体现。</p>\n</blockquote>\n<p>D既保留民众情感强烈，也保留政治体现不足，没有将limited夸大成完全无人支持；与后文政党取向也能相接。</p>\n<p><strong>复盘判断：D正确。</strong></p>\n</section>"},{"title":"26题结论","raw":"### 26题结论\n\n> **26. D**\n\n- A：乡村与NHS都是英国人引以为豪的对象，alongside表示并列。A却把对乡村的情感写成NHS获益的原因。\n- B：Shakespeare出现在自豪对象的并列项中，不是乡村情感开始的历史时间。B从人名另造了情感的起点。\n- C：王室在原句中是被公众评价的对象，C却让它成为支持乡村情感的行动者，还增加了fully的程度。\n- D：公众高度珍视乡村，政治支持却有限。D的not well reflected概括这种民意与政治取向之间的落差。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"26题","focus":[150,158,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"26","questionConclusion":true},"html":"<blockquote>\n<p><strong>26. D</strong></p>\n</blockquote>\n<ul>\n<li>A：乡村与NHS都是英国人引以为豪的对象，alongside表示并列。A却把对乡村的情感写成NHS获益的原因。</li>\n<li>B：Shakespeare出现在自豪对象的并列项中，不是乡村情感开始的历史时间。B从人名另造了情感的起点。</li>\n<li>C：王室在原句中是被公众评价的对象，C却让它成为支持乡村情感的行动者，还增加了fully的程度。</li>\n<li>D：公众高度珍视乡村，政治支持却有限。D的not well reflected概括这种民意与政治取向之间的落差。</li>\n</ul>\n"},{"title":"27题 · 题干、题型与核心出处","raw":"## 27题\n\n> According to Paragraph 2, the achievements of the National Trust are now being ______.\n>\n> 根据第2段，国民信托的成果现在正被______。\n\n### 题型\n\n细节推断题：题干有now，要把保护运动的初衷、历史成就与当前受侵占的状态分开。\n\n题干直接指定Paragraph 2及the National Trust。先将第2段的创立目的、后来取得的成果和现在的变化完整读完。\n\n### 核心出处\n\n> Hill’s pressure later led to the creation of national parks and green belts.\n>\n> They don’t make countryside any more, and every year concrete consumes more of it.\n>\n> but to save “the beauty of natural places for everyone forever.”","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"27","questionIntro":true},"html":"<blockquote>\n<p>According to Paragraph 2, the achievements of the National Trust are now being ______.</p>\n<p>根据第2段，国民信托的成果现在正被______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>细节推断题：题干有now，要把保护运动的初衷、历史成就与当前受侵占的状态分开。</p>\n<p>题干直接指定Paragraph 2及the National Trust。先将第2段的创立目的、后来取得的成果和现在的变化完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Hill’s pressure later led to the creation of national parks and green belts.</p>\n<p>They don’t make countryside any more, and every year concrete consumes more of it.</p>\n<p>but to save “the beauty of natural places for everyone forever.”</p>\n</blockquote>\n"},{"title":"A. gradually destroyed","raw":"### A. gradually destroyed\n\n> National Trust的成果如今正逐渐遭到破坏。\n\n**做题模式中的状态：** 第一轮保留A，此时A尚未排除。\n\n**选项类型：对原文关系的准确改写。**\n\n国家公园与绿带是保护成果，every year concrete consumes more说自然空间逐年被建设占用。A概括为成果逐渐受损。\n\n**出处：**\n\n> A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save \"the beauty of natural places for everyone forever.\" It was specifically to provide city dwellers with spaces for leisure where they could experience \"a refreshing air.\" Hill's pressure later led to the creation of national parks and green belts. They don't make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>National Trust的成果如今正逐渐遭到破坏。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>国家公园与绿带是保护成果，every year concrete consumes more说自然空间逐年被建设占用。A概括为成果逐渐受损。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save &quot;the beauty of natural places for everyone forever.&quot; It was specifically to provide city dwellers with spaces for leisure where they could experience &quot;a refreshing air.&quot; Hill&#39;s pressure later led to the creation of national parks and green belts. They don&#39;t make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.</p>\n</blockquote>\n</section>"},{"title":"A. gradually destroyed","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> National Trust的成果如今正逐渐遭到破坏。\n\n`gradually destroyed`说已有成果逐步受损，第2段先说`the creation of national parks and green belts`，再说`every year concrete consumes more of it`。前一处交代成果，后一处交代眼下的变化，两处需合看。\n\n原文说希尔促成了国家公园与绿化带，又说乡村不会重新产生，而`every year concrete consumes more of it`表明每年还有更多乡村被建设占用。保存自然空间的成果因此面临持续损失。本项`gradually destroyed`把这种每年不断发生的消耗概括为逐渐受破坏，与原句的过程和方向一致。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"A","cumulative":true,"cumulativeGroup":"question-27-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-A-0\"><blockquote>\n<p>National Trust的成果如今正逐渐遭到破坏。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A，此时A尚未排除。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>国家公园与绿带是保护成果，every year concrete consumes more说自然空间逐年被建设占用。A概括为成果逐渐受损。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save &quot;the beauty of natural places for everyone forever.&quot; It was specifically to provide city dwellers with spaces for leisure where they could experience &quot;a refreshing air.&quot; Hill&#39;s pressure later led to the creation of national parks and green belts. They don&#39;t make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>National Trust的成果如今正逐渐遭到破坏。</p>\n</blockquote>\n<p><code>gradually destroyed</code>说已有成果逐步受损，第2段先说<code>the creation of national parks and green belts</code>，再说<code>every year concrete consumes more of it</code>。前一处交代成果，后一处交代眼下的变化，两处需合看。</p>\n<p>原文说希尔促成了国家公园与绿化带，又说乡村不会重新产生，而<code>every year concrete consumes more of it</code>表明每年还有更多乡村被建设占用。保存自然空间的成果因此面临持续损失。本项<code>gradually destroyed</code>把这种每年不断发生的消耗概括为逐渐受破坏，与原句的过程和方向一致。</p>\n</section>"},{"title":"A. gradually destroyed","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save \"the beauty of natural places for everyone forever.\" It was specifically to provide city dwellers with spaces for leisure where they could experience \"a refreshing air.\" Hill's pressure later led to the creation of national parks and green belts. They don't make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.\n>\n> 一个世纪前，Octavia Hill创立National Trust，目的并非抢救时髦住宅，而是让每个人永久享有自然场所之美，尤其让城市居民有休闲空间、呼吸清新空气。她的推动后来促成国家公园与绿带。乡村无法再造，混凝土每年却吞噬更多乡村，所以需要持续守护。\n\n作者先回顾永久保存自然之美的目标和公园成果，随后转向乡村无法再造而仍被不断吞噬的现实。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The National Trust’s achievements are being gradually destroyed.\n>\n> National Trust的成果如今正逐渐遭到破坏。\n\ngradually对应every year持续发生，destroyed对应保存空间遭消耗。它没有要求成果已经全部消失，只概括这一正在发生的损害过程。\n\n**复盘判断：A正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":4,"met  &quot;a refreshing air.&quot; Hill&#39;s pressure later led to the creation of national parks and green belts. They don&#39;t make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.</p>\n<p>一个世纪前，Octavia Hill创立National Trust，目的并非抢救时髦住宅，而是让每个人永久享有自然场所之美，尤其让城市居民有休闲空间、呼吸清新空气。她的推动后来促成国家公园与绿带。乡村无法再造，混凝土每年却吞噬更多乡村，所以需要持续守护。</p>\n</blockquote>\n<p>作者先回顾永久保存自然之美的目标和公园成果，随后转向乡村无法再造而仍被不断吞噬的现实。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The National Trust’s achievements are being gradually destroyed.</p>\n<p>National Trust的成果如今正逐渐遭到破坏。</p>\n</blockquote>\n<p>gradually对应every year持续发生，destroyed对应保存空间遭消耗。它没有要求成果已经全部消失，只概括这一正在发生的损害过程。</p>\n<p><strong>复盘判断：A正确。</strong></p>\n</section>"},{"title":"B. effectively reinforced","raw":"### B. effectively reinforced\n\n> National Trust的成果如今正得到有效巩固。\n\n**做题模式中的状态：** 第一轮排除B。\n\n**错误类型：第一类——歪曲原意。**\n\n原文是更多乡村每年被混凝土吞噬，B却说保护成果得到有效加强，把损耗改成了巩固。\n\n**出处：**\n\n> A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save \"the beauty of natural places for everyone forever.\" It was specifically to provide city dwellers with spaces for leisure where they could experience \"a refreshing air.\" Hill's pressure later led to the creation of national parks and green belts. They don't make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"B","cumulative":true,"cumulativeGroup":"question-27-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-B-0\"><blockquote>\n<p>National Trust的成果如今正得到有效巩固。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除B。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>原文是更多乡村每年被混凝土吞噬，B却说 o the creation of national parks and green belts. They don&#39;t make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.</p>\n</blockquote>\n</section>"},{"title":"C. properly protected","raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> National Trust的成果如今正得到妥善保护。\n\n`properly protected`说现在的保护已有成效，第2段的`to save`写创立目的，`every year concrete consumes more of it`写当前情况。回看这两处，才能分清保存的愿望与现在有没有守住成果。\n\n原文以`to save`说明早先要把自然之美长久留给每个人，谈到现状时却用`every year concrete consumes more of it`写乡村持续遭到占用。本项`properly protected`把早先的保护目的写成现在已经妥善保护的状态。题干要求说明成果现在怎样，不能把长久保存的目标当作已经取得的当前保护成效。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"C","cumulative":true,"cumulativeGroup":"question-27-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-C-0\"><blockquote>\n<p>National Trust的成果如今正得到妥善保护。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>save ... forever是初衷，concrete consumes是现状。C把希望永远保存误当成现在已妥善保护。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save &quot;the beauty of natural places for everyone forever.&quot; It was specifically to provide city dwellers with spaces for leisure where they could experience &quot;a refreshing air.&quot; Hill&#39;s pressure later led to the creation of national parks and green belts. They don&#39;t make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>National Trust的成果如今正得到妥善保护。</p>\n</blockquote>\n<p><code>properly protected</ n</blockquote>\n<p>C需要目标在当前得到落实的证据。持续侵占与constant guardianship的需要说明不能仅用早期目的判定今天保护得当。</p>\n<p><strong>复盘判断：C错误。</strong></p>\n</section>"},{"title":"D. largely overshadowed","raw":"### D. largely overshadowed\n\n> National Trust的成果如今正在很大程度上黯然失色。\n\n**做题模式中的状态：** 第一轮排除D。\n\n**错误类型：第一类——歪曲原意。**\n\n乡村被建设实际占用，谈的是保护空间损失；overshadowed更侧重相形之下被盖过、不再显著，未准确说出这种侵占。\n\n**出处：**\n\n> A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save \"the beauty of natural places for everyone forever.\" It was specifically to provide city dwellers with spaces for leisure where they could experience \"a refreshing air.\" Hill's pressure later led to the creation of national parks and green belts. They don't make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-27-option-D-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-D-0\"><blockquote>\n<p>National Trust的成果如今正在很大程度上黯然失色。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>乡村被建设实际占用，谈的是保护空间损失；overshadowed更侧重相形之下被盖过、不再显著，未准确说出这种侵占。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save &quot;the beauty of natural places for everyone forever.&quot; It was specifically to provide city dwellers with spaces for leisure where they could experience &quot;a refreshing air.&quot; Hill&#39;s pressure later led to the creation of national parks and green belts. They don&#39;t make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.</p>\n</blockquote>\n</section>"},{"title":"D. largely overshadowed","raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> National Trust的成果如今正在很大程度上黯然失色。\n\n`largely overshadowed`涉及成果是否被盖过、显得不突出，第2段的`concrete consumes more of it`同样在讲成果面对的变化。因此回看这句，确定变化发生在乡村实体上，还是成果的显著性上。\n\n原文说`concrete consumes more of it`，被消耗的`it`是乡村，描述的是保存下来的自然空间被实际占用。本项`largely overshadowed`则把成果的处境写成被其他事物盖过而黯然失色，描述的是相形之下不显眼或不再突出。原句的混凝土消耗并不是成果之间的显著性比较，本项把受影响的内容从自然空间的保存变成了成果是否突出。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-27-option-D-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-D-0\"><blockquote>\n<p>National Trust的成果如今正在很大程度上黯然失色。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>乡村被建设实际占用，谈的是保护空间损失；overshadowed更侧重相形之下被盖过、不再显著，未准确说出这种侵占。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save &quot;the beauty of natural places for everyone forever.&quot; It was specifically to provide city dwellers with spaces for leisure where they could experience &quot;a refreshing air.&quot; Hill&#39;s pressure later led to the creation of national parks and green belts. They don&#39;t make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>National Trust的成果如今正在很大程度上黯然失色。</p>\n</blockquote>\n<p><code>largely overshadowed</code>涉及成果是否被盖过、显得不突出，第2段的<code>concrete consumes more of it</code>同样在讲成果面对的变化。因此回看这句，确定变化发生在乡村实体上，还是成果的显著性上。</p>\n<p>原文说<code>concrete consumes more of it</code>，被消耗的<code>it</code>是乡村，描述的是保存下来的自然空间被实际占用。本项<code>largely overshadowed</code>则把成果的处境写成被其他事物盖过而黯然失色，描述的是相形之下不显眼或不再突出。原句的混凝土消耗并不是成果之间的显著性比较，本项把受影响的内容从自然空间的保存变成了成果是否突出。</p>\n</section>"},{"title":"D. largely overshadowed","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save \"the beauty of natural places for everyone forever.\" It was specifically to provide city dwellers with spaces for leisure where they could experience \"a refreshing air.\" Hill's pressure later led to the creation of national parks and green belts. They don't make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.\n>\n> 一个世纪前，Octavia Hill创立National Trust，目的并非抢救时髦住宅，而是让每个人永久享有自然场所之美，尤其让城市居民有休闲空间、呼吸清新空气。她的推动后来促成国家公园与绿带。乡村无法再造，混凝土每年却吞噬更多乡村，所以需要持续守护。\n\nconcrete作消耗者，countryside作被消耗对象，作者没有另列更大的成就来遮蔽National Trust的地位。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The National Trust’s achievements are being largely overshadowed.\n>\n> National Trust的成果如今正在很大程度上黯然失色。\n\nD需要成果因别的事物更突出而黯然失色。实际损害发生在自然空间本身，A的逐渐破坏直接对应，而非成果声望的比较。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"27","option":"D","cumulative":true,"cumulativeGroup":"question-27-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-27-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-27-option-D-0\"><blockquote>\n<p>National Trust的成果如今正在很大程度上黯然失色。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>乡村被建设实际占用，谈的是保护空间损失；overshadowed更侧重相形之下被盖过、不再显著，未准确说出这种侵占。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save &quot;the beauty of natural places for everyone forever.&quot; It was specifically to provide city dwellers with spaces for leisure where they could experience &quot;a refreshing air.&quot; Hill&#39;s pressure later led to the creation of national parks and green belts. They don&#39;t make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>National Trust的成果如今正在很大程度上黯然失色。</p>\n</blockquote>\n<p><code>largely overshadowed</code>涉及成果是否被盖过、显得不突出，第2段的<code>concrete consumes more of it</code>同样在讲成果面对的变化。因此回看这句，确定变化发生在乡村实体上，还是成果的显著性上。</p>\n<p>原文说<code>concrete consumes more of it</code>，被消耗的<code>it</code>是乡村，描述的是保存下来的自然空间被实际占用。本项<code>largely overshadowed</code>则把成果的处境写成被其他事物盖过而黯然失色，描述的是相形之下不显眼或不再突出。原句的混凝土消耗并不是成果之间的显著性比较，本项把受影响的内容从自然空间的保存变成了成果是否突出。</p>\n</section><section class=\"revealPart\" id=\"focus-question-27-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save &quot;the beauty of natural places for everyone forever.&quot; It was specifically to provide city dwellers with spaces for leisure where they could experience &quot;a refreshing air.&quot; Hill&#39;s pressure later led to the creation of national parks and green belts. They don&#39;t make countryside any more, and every year concrete consumes more of it. It needs constant guardianship.</p>\n<p>一个世纪前，Octavia Hill创立National Trust，目的并非抢救时髦住宅，而是让每个人永久享有自然场所之美，尤其让城市居民有休闲空间、呼吸清新空气。她的推动后来促成国家公园与绿带。乡村无法再造，混凝土每年却吞噬更多乡村，所以需要持续守护。</p>\n</blockquote>\n<p>concrete作消耗者，countryside作被消耗对象，作者没有另列更大的成就来遮蔽National Trust的地位。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The National Trust’s achievements are being largely overshadowed.</p>\n<p>National Trust的成果如今正在很大程度上黯然失色。</p>\n</blockquote>\n<p>D需要成果因别的事物更突出而黯然失色。实际损害发生在自然空间本身，A的逐渐破坏直接对应，而非成果声望的比较。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"27题结论","raw":"### 27题结论\n\n> **27. A**\n\n- A：国家公园与绿带是保护成果，every year concrete consumes more说自然空间逐年被建设占用。A概括为成果逐渐受损。\n- B：原文是更多乡村每年被混凝土吞噬，B却说保护成果得到有效加强，把损耗改成了巩固。\n- C：save ... forever是初衷，concrete consumes是现状。C把希望永远保存误当成现在已妥善保护。\n- D：乡村被建设实际占用，谈的是保护空间损失；overshadowed更侧重相形之下被盖过、不再显著，未准确说出这种侵占。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"27题","focus":[150,525,1344,429],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"27","questionConclusion":true},"html":"<blockquote>\n<p><strong>27. A</strong></p>\n</blockquote>\n<ul>\n<li>A：国家公园与绿带是保护成果，every year concrete consumes more说自然空间逐年被建设占用。A概括为成果逐渐受损。</li>\n<li>B：原文是更多乡村每年被混凝土吞噬，B却说保护成果得到有效加强，把损耗改成了巩固。</li>\n<li>C：save ... forever是初衷，concrete consumes是现状。C把希望永远保存误当成现在已妥善保护。</li>\n<li>D：乡村被建设实际占用，谈的是保护空间损失；overshadowed更侧重相形之下被盖过、不再显著，未准确说出这种侵占。</li>\n</ul>\n"},{"title":"28题 · 题干、题型与核心出处","raw":"## 28题\n\n> Which of the following can be inferred from Paragraph 3?\n>\n> 下列哪项可以从第3段推断出来？\n\n### 题型\n\n段落推断题：逐一对应四党及其行动，再由机会和竞争压力判断哪项后果有根据。\n\n题干明确指定Paragraph 3，先从段首到段尾读完各个政党对乡村开发及保护的表态。\n\n### 核心出处\n\n> Labour likewise wants to discontinue local planning where councils oppose development.\n>\n> The Conservatives' planning reform explicitly gives rural development priority over conservation, even authorising \"off-plan\" building where local people might object\n>\n> Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"28","questionIntro":true},"html":"<blockquote>\n<p>Which of the following can be inferred from Paragraph 3?</p>\n<p>下列哪项可以从第3段推断出来？</p>\n</blockquote>\n<h3>题型</h3>\n<p>段落推断题：逐一对应四党及其行动，再由机会和竞争压力判断哪项后果有根据。</p>\n<p>题干明确指定Paragraph 3，先从段首到段尾读完各个政党对乡村开发及保护的表态。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Labour likewise wants to discontinue local planning where councils oppose development.</p>\n<p>The Conservatives&#39; planning reform explicitly gives rural development priority over conservation, even authorising &quot;off-plan&quot; building where local people might object</p>\n<p>Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land.</p>\n</blockquote>\n"},{"title":"A. Labour is under attack for opposing development.","raw":"### A. Labour is under attack for opposing development.\n\n> 第3段可推得：工党因反对开发而受攻击。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第一类——歪曲原意。**\n\n反对开发的是where从句里的councils，工党则想停止这些地方的规划。A既换了反对者，又加入工党因此受到攻击。\n\n**出处：**\n\n> At the next election none of the big parties seem likely to endorse this sentiment. The Conservatives' planning reform explicitly gives rural development priority over conservation, even authorising \"off-plan\" building where local people might object. The concept of sustainable development has been defined as profitable. Labour likewise wants to discontinue local planning where councils oppose development. The Liberal Democrats are silent. Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land. Its Campaign to Protect Rural England struck terror into many local Conservative parties.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-28-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>第3段可推得：工党因反对开发而受攻击。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>反对开发的是where从句里的councils，工党则想停止这些地方的规划。A既换了反对者，又加入工党因此受到攻击。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At the next election none of the big parties seem likely to endorse this sentiment. The Conservatives&#39; planning reform explicitly gives rural development priority over conservation, even authorising &quot;off-plan&quot; building where local people might object. The concept of sustainable development has been defined as profitable. Labour likewise wants to discontinue local planning where councils oppose development. The Liberal Democrats are silent. Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land. Its Campaign to Protect Rural England struck terror into many local Conservative parties.</p>\n</blockquote>\n</section>"},{"title":"A. Labour is under attack for opposing development.","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 第3段可推得：工党因反对开发而受攻击。\n\n`Labour`与`opposing development`指向第3段的`Labour`一句，其中`councils oppose development`也谈到反对开发。回看整句，核对反对开发的是议会还是工党，以及工党做的是什么。\n\n原文在`where`从句中写`councils oppose development`，反对开发的是议会；主句则写工党希望停止这些地方的规划。本项让`Labour`成为`opposing development`的主体，并说它因此受到攻击。这样把从句中议会的立场安到了工党身上，又将工党的停止规划行为换成了受到攻击的遭遇。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"A","cumulative":true,"cumulativeGroup":"question-28-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-28-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-A-0\"><blockquote>\n<p>第3段可推得：工党因反对开发而受攻击。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>反对开发的是where从句里的councils，工党则想停止这些地方的规划。A既换了反对者，又加入工党因此受到攻击。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At the next election none of the big parties seem likely to endorse this sentiment. The Conservatives&#39; planning reform explicitly gives rural development priority over conservation, even authorising &quot;off-plan&quot; building where local people might object. The concept of sustainable development has been defined as profitable. Labour likewise wants to discontinue local planning where councils oppose development. The Liberal Democrats are silent. Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land. Its Campaign to Protect Rural England struck terror into many local Conservative parties.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>第3段可推得：工党因反对开发而受攻击。</p>\n</blockquote>\n<p><code>Labour</code>与<code>opposing development</code>指向第3段的<code>Labour</code>一句，其中<code>councils oppose development</code>也谈到反对开发。回看整句，核对反对开发的是议会还是工党，以及工党做的是什么。</p>\n<p>原文在<code>where</code>从句中写<code>councils oppose development</code>，反对开发的是议会；主句则写工党希望停止这些地方的规划。本项让<code>Labour</code>成为<code>opposing development</code>的主体，并说它因此受到攻击。这样把从句中议会的立场安到了工党身上，又将工党的停止规划行为换成了受到攻击的遭遇。</p>\n</section>"},{"title":"A. Labour is under attack for opposing development.","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> At the next election none of the big parties seem likely to endorse this sentiment. The Conservatives' planning reform explicitly gives rural development priority over conservation, even authorising \"off-plan\" building where local people might object. The concept of sustainable development has been defined as profitable. Labour likewise wants to discontinue local planning where councils oppose development. The Liberal Democrats are silent. Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land. Its Campaign to Protect Rural England struck terror into many local Conservative parties.\n>\n> 下一次选举中，主要政党似乎都不会支持这一保护愿望。保守党规划改革明确将乡村开发置于保护之上，甚至允许当地人可能反对的计划外建设，可持续发展被界定为盈利。工党也想在议会反对开发的地方停止本地规划。自由民主党保持沉默。只有Ukip察觉机会，支持更审慎使用绿地的呼吁；它的乡村保护运动令许多地方保守党组织恐惧。\n\nLabour主句交代其政策动作，where从句限定动作针对怎样的地方，两层主语各不相同。\n\n如果A真是作者的
