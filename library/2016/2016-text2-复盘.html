 explicitly gives rural development priority over conservation, even authorising \"off-plan\" building where local people might object. The concept of sustainable development has been defined as profitable. Labour likewise wants to discontinue local planning where councils oppose development. The Liberal Democrats are silent. Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land. Its Campaign to Protect Rural England struck terror into many local Conservative parties.\n>\n> 下一次选举中，主要政党似乎都不会支持这一保护愿望。保守党规划改革明确将乡村开发置于保护之上，甚至允许当地人可能反对的计划外建设，可持续发展被界定为盈利。工党也想在议会反对开发的地方停止本地规划。自由民主党保持沉默。只有Ukip察觉机会，支持更审慎使用绿地的呼吁；它的乡村保护运动令许多地方保守党组织恐惧。\n\n作者逐党写乡村保护立场，are silent是是否表态的分类，没有比较该党过去与现在的地位。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The Liberal Democrats are losing political influence.\n>\n> 第3段可推得：自由民主党正失去政治影响力。\n\nD需要影响力变小的趋势证据。没有表态可能有多种原因，不能将一个议题上的沉默直接量化成整体政治力量的流失。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"28","option":"D","cumulative":true,"cumulativeGroup":"question-28-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-28-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-28-option-D-0\"><blockquote>\n<p>第3段可推得：自由民主党正失去政治影响力。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第三类——无中生有。</strong></p>\n<p>自由民主党只被描述为在该议题上沉默，D却说其政治影响力正在下降，添加了范围与时间上的变化。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>At the next election none of the big parties seem likely to endorse this sentiment. The Conservatives&#39; planning reform explicitly gives rural development priority over conservation, even authorising &quot;off-plan&quot; building where local people might object. The concept of sustainable development has been defined as profitable. Labour likewise wants to discontinue local planning where councils oppose development. The Liberal Democrats are silent. Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land. Its Campaign to Protect Rural England struck terror into many local Conservative parties.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>第3段可推得：自由民主党正失去政治影响力。</p>\n</blockquote>\n<p><code>losing political influence</code>问自由民主党的影响力是否在减少，第3段对该党的表述是<code>are silent</code>。回看这一句，核对沉默描述的内容与影响力下降是否是同一回事。</p>\n<p>原文的<code>are silent</code>说该党在乡村开发和保护这个议题上没有发声，是对表态的描述。本项<code>losing political influence</code>把它改成政治影响力正在下降，不仅从一个议题的表态转为总体政治地位，还加上了随时间减少的趋势。一次沉默并没有表示影响力比从前更小，不能把表态状态写成政治力量的变化。</p>\n</section><section class=\"revealPart\" id=\"focus-question-28-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>At the next election none of the big parties seem likely to endorse this sentiment. The Conservatives&#39; planning reform explicitly gives rural development priority over conservation, even authorising &quot;off-plan&quot; building where local people might object. The concept of sustainable development has been defined as profitable. Labour likewise wants to discontinue local planning where councils oppose development. The Liberal Democrats are silent. Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land. Its Campaign to Protect Rural England struck terror into many local Conservative parties.</p>\n<p>下一次选举中，主要政党似乎都不会支持这一保护愿望。保守党规划改革明确将乡村开发置于保护之上，甚至允许当地人可能反对的计划外建设，可持续发展被界定为盈利。工党也想在议会反对开发的地方停止本地规划。自由民主党保持沉默。只有Ukip察觉机会，支持更审慎使用绿地的呼吁；它的乡村保护运动令许多地方保守党组织恐惧。</p>\n</blockquote>\n<p>作者逐党写乡村保护立场，are silent是是否表态的分类，没有比较该党过去与现在的地位。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The Liberal Democrats are losing political influence.</p>\n<p>第3段可推得：自由民主党正失去政治影响力。</p>\n</blockquote>\n<p>D需要影响力变小的趋势证据。没有表态可能有多种原因，不能将一个议题上的沉默直接量化成整体政治力量的流失。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"28题结论","raw":"### 28题结论\n\n> **28. C**\n\n- A：反对开发的是where从句里的councils，工党则想停止这些地方的规划。A既换了反对者，又加入工党因此受到攻击。\n- B：保守党甚至批准计划外建设，B却推测它可能放弃。原句没有政策回撤的迹象。\n- C：Ukip察觉机会并支持审慎使用绿地，保护运动又让地方保守党组织恐惧，说明其立场可能带来政治收益。\n- D：自由民主党只被描述为在该议题上沉默，D却说其政治影响力正在下降，添加了范围与时间上的变化。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"28题","focus":[150,954,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"28","questionConclusion":true},"html":"<blockquote>\n<p><strong>28. C</strong></p>\n</blockquote>\n<ul>\n<li>A：反对开发的是where从句里的councils，工党则想停止这些地方的规划。A既换了反对者，又加入工党因此受到攻击。</li>\n<li>B：保守党甚至批准计划外建设，B却推测它可能放弃。原句没有政策回撤的迹象。</li>\n<li>C：Ukip察觉机会并支持审慎使用绿地，保护运动又让地方保守党组织恐惧，说明其立场可能带来政治收益。</li>\n<li>D：自由民主党只被描述为在该议题上沉默，D却说其政治影响力正在下降，添加了范围与时间上的变化。</li>\n</ul>\n"},{"title":"29题 · 题干、题型与核心出处","raw":"## 29题\n\n> The author holds that George Osborne’s preference ______.\n>\n> 作者认为，乔治·奥斯本的偏好______。\n\n### 题型\n\n观点推断题：将Osborne的选址偏好与作者随后提出的乡村保护标准合看，不能凭单个biased替代整段评价。\n\nGeorge Osborne直接出现在第5段的George Osborne favours一句，后面还有He favours及作者的评价。先将这个自然段完整读完。\n\n### 核心出处\n\n> Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal\n>\n> He favours out-of-town shopping sites against high streets.\n>\n> This is not a free market but a biased one.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"29","questionIntro":true},"html":"<blockquote>\n<p>The author holds that George Osborne’s preference ______.</p>\n<p>作者认为，乔治·奥斯本的偏好______。</p>\n</blockquote>\n<h3>题型</h3>\n<p>观点推断题：将Osborne的选址偏好与作者随后提出的乡村保护标准合看，不能凭单个biased替代整段评价。</p>\n<p>George Osborne直接出现在第5段的George Osborne favours一句，后面还有He favours及作者的评价。先将这个自然段完整读完。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal</p>\n<p>He favours out-of-town shopping sites against high streets.</p>\n<p>This is not a free market but a biased one.</p>\n</blockquote>\n"},{"title":"A. reveals a strong prejudice against urban areas","raw":"### A. reveals a strong prejudice against urban areas\n\n> 作者认为Osborne的偏好显露对城市地区的强烈偏见。\n\n**做题模式中的状态：** 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。\n\n**错误类型：第一类——歪曲原意。**\n\nbiased确实批评政策偏向，所以A有表面联系；但对乡村新建的偏爱，还不足以证明对城市本身怀有强烈成见，段落的具体批评落在乡村保护上。\n\n**出处：**\n\n> The idea that \"housing crisis\" equals \"concreted meadows\" is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-29-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>作者认为Osborne的偏好显露对城市地区的强烈偏见。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>biased确实批评政策偏向，所以A有表面联系；但对乡村新建的偏爱，还不足以证明对城市本身怀有强烈成见，段落的具体批评落在乡村保护上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?</p>\n</blockquote>\n</section>"},{"title":"A. reveals a strong prejudice against urban areas","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 作者认为Osborne的偏好显露对城市地区的强烈偏见。\n\nbiased确实批评政策偏向，所以A有表面联系；但对乡村新建的偏爱，还不足以证明对城市本身怀有强烈成见，段落的具体批评落在乡村保护上。\n\n作者先写在游说压力下偏好乡村新建和城外购物，再提出乡村建设须尊重特色，最后用保护区反问检验这项偏好。\n\nprejudice应理解为偏见或成见，不是厌恶。A仍需对城市的强烈成见这一依据；原文给的是政策选择及其乡村后果，B与后文respects their character更直接对应。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>作者认为Osborne的偏好显露对城市地区的强烈偏见。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>biased确实批评政策偏向，所以A有表面联系；但对乡村新建的偏爱，还不足以证明对城市本身怀有强烈成见，段落的具体批评落在乡村保护上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为Osborne的偏好显露对城市地区的强烈偏见。</p>\n</blockquote>\n<p>biased确实批评政策偏向，所以A有表面联系；但对乡村新建的偏爱，还不足以证明对城市本身怀有强烈成见，段落的具体批评落在乡村保护上。</p>\n<p>作者先写在游说压力下偏好乡村新建和城外购物，再提出乡村建设须尊重特色，最后用保护区反问检验这项偏好。</p>\n<p>prejudice应理解为偏见或成见，不是厌恶。A仍需对城市的强烈成见这一依据；原文给的是政策选择及其乡村后果，B与后文respects their character更直接对应。</p>\n</section>"},{"title":"A. reveals a strong prejudice against urban areas","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The idea that \"housing crisis\" equals \"concreted meadows\" is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?\n>\n> 认为住房危机就意味着草地被混凝土覆盖，纯属游说者的话。问题并非要不要更多房屋，而是建在哪里。在游说压力下，Osborne偏爱乡村新建而非城市翻新，也偏爱城外购物点而非城市商业街。这不是自由市场，而是偏向的市场。乡村城镇和村庄始终会增长，但最好沿既有边缘建设并尊重其特色。我们不破坏城市保护区，为什么要破坏乡村保护区？\n\n作者先写在游说压力下偏好乡村新建和城外购物，再提出乡村建设须尊重特色，最后用保护区反问检验这项偏好。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> Osborne’s preference reveals a strong prejudice against urban areas.\n>\n> 作者认为Osborne的偏好显露对城市地区的强烈偏见。\n\nprejudice应理解为偏见或成见，不是厌恶。A仍需对城市的强烈成见这一依据；原文给的是政策选择及其乡村后果，B与后文respects their character更直接对应。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"A","cumulative":true,"cumulativeGroup":"question-29-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-A-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-A-0\"><blockquote>\n<p>作者认为Osborne的偏好显露对城市地区的强烈偏见。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时A尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么仍要排除。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>biased确实批评政策偏向，所以A有表面联系；但对乡村新建的偏爱，还不足以证明对城市本身怀有强烈成见，段落的具体批评落在乡村保护上。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为Osborne的偏好显露对城市地区的强烈偏见。</p>\n</blockquote>\n<p>biased确实批评政策偏向，所以A有表面联系；但对乡村新建的偏爱，还不足以证明对城市本身怀有强烈成见，段落的具体批评落在乡村保护上。</p>\n<p>作者先写在游说压力下偏好乡村新建和城外购物，再提出乡村建设须尊重特色，最后用保护区反问检验这项偏好。</p>\n<p>prejudice应理解为偏见或成见，不是厌恶。A仍需对城市的强烈成见这一依据；原文给的是政策选择及其乡村后果，B与后文respects their character更直接对应。</p>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-A-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?</p>\n<p>认为住房危机就意味着草地被混凝土覆盖，纯属游说者的话。问题并非要不要更多房屋，而是建在哪里。在游说压力下，Osborne偏爱乡村新建而非城市翻新，也偏爱城外购物点而非城市商业街。这不是自由市场，而是偏向的市场。乡村城镇和村庄始终会增长，但最好沿既有边缘建设并尊重其特色。我们不破坏城市保护区，为什么要破坏乡村保护区？</p>\n</blockquote>\n<p>作者先写在游说压力下偏好乡村新建和城外购物，再提出乡村建设须尊重特色，最后用保护区反问检验这项偏好。</p>\n<p>如果A真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Osborne’s preference reveals a strong prejudice against urban areas.</p>\n<p>作者认为Osborne的偏好显露对城市地区的强烈偏见。</p>\n</blockquote>\n<p>prejudice应理解为偏见或成见，不是厌恶。A仍需对城市的强烈成见这一依据；原文给的是政策选择及其乡村后果，B与后文respects their character更直接对应。</p>\n<p><strong>复盘判断：A错误。</strong></p>\n</section>"},{"title":"B. shows his disregard for the character of rural areas","raw":"### B. shows his disregard for the character of rural areas\n\n> 作者认为Osborne的偏好显示其忽视乡村地区的特色。\n\n**做题模式中的状态：** 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。\n\n**选项类型：对原文关系的准确改写。**\n\n偏好乡村新建之后，作者强调乡村增长应沿既有边缘并尊重特色，又反问为何破坏乡村保护区。B接住这一具体保护标准。\n\n**出处：**\n\n> The idea that \"housing crisis\" equals \"concreted meadows\" is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-29-option-B-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-B-0\"><blockquote>\n<p>作者认为Osborne的偏好显示其忽视乡村地区的特色。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>偏好乡村新建之后，作者强调乡村增长应沿既有边缘并尊重特色，又反问为何破坏乡村保护区。B接住这一具体保护标准。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?</p>\n</blockquote>\n</section>"},{"title":"B. shows his disregard for the character of rural areas","raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 作者认为Osborne的偏好显示其忽视乡村地区的特色。\n\n第4段已经给出另一种选址方案：在基础设施齐备的城镇建设，伦敦就有足够容纳大量房屋、又不侵入绿带的地块。第5段于是强调问题在`where to put them`，并非不承认住房需求。\n\n在这一前提下，Osborne却在游说压力下偏爱乡村新建而非城市更新。作者紧接着说乡村本会继续增长，但最好贴近已有边缘并`respects their character`，再用`Why ruin rural ones?`要求乡村保护区得到同样尊重。\n\nB的disregard for ... character落在这条保护标准上：政策偏好没有充分顾及乡村特色。依据是前后选址方案与保护要求的对照，不能简化成“所有乡村建房都破坏特色”。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-B-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-B-0\"><blockquote>\n<p>作者认为Osborne的偏好显示其忽视乡村地区的特色。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></ 压力下，Osborne偏爱乡村新建而非城市翻新，也偏爱城外购物点而非城市商业街。这不是自由市场，而是偏向的市场。乡村城镇和村庄始终会增长，但最好沿既有边缘建设并尊重其特色。我们不破坏城市保护区，为什么要破坏乡村保护区？\n\n论述由建在哪里转向怎样在乡村增长：并非反对一切建设，而是要求保护既有空间形态和地方特征。\n\n如果B真是作者的意思，这里至少应该写成：\n\n> Osborne’s preference shows his disregard for the character of rural areas.\n>\n> 作者认为Osborne的偏好显示其忽视乡村地区的特色。\n\nB不是说只要有乡村新建就必然破坏。作者反对的是不顾可用城市空间而偏向乡村的选择，并用特色与保护区标准指出这种偏好遗漏的约束。\n\n**复盘判断：B正确。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"B","cumulative":true,"cumulativeGroup":"question-29-option-B","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-B-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-B-0\"><blockquote>\n<p>作者认为Osborne的偏好显示其忽视乡村地区的特色。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮保留A、B，此时B尚未排除。随后把全文连起来回看，最终选B。下面分别说明第一轮凭什么保留，以及最后为什么成立。</p>\n<p><strong>选项类型：对原文关系的准确改写。</strong></p>\n<p>偏好乡村新建之后，作者强调乡村增长应沿既有边缘并尊重特色，又反问为何破坏乡村保护区。B接住这一具体保护标准。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-B-1\"><h3>定位比对法</h3>\n<p>先把B接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为Osborne的偏好显示其忽视乡村地区的特色。</p>\n</blockquote>\n<p>第4段已经给出另一种选址方案：在基础设施齐备的城镇建设，伦敦就有足够容纳大量房屋、又不侵入绿带的地块。第5段于是强调问题在<code>where to put them</code>，并非不承认住房需求。</p>\n<p>在这一前提下，Osborne却在游说压力下偏爱乡村新建而非城市更新。作者紧接着说乡村本会继续增长，但最好贴近已有边缘并<code>respects their character</code>，再用<code>Why ruin rural ones?</code>要求乡村保护区得到同样尊重。</p>\n<p>B的disregard for ... character落在这条保护标准上：政策偏好没有充分顾及乡村特色。依据是前后选址方案与保护要求的对照，不能简化成“所有乡村建房都破坏特色”。</p>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-B-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?</p>\n<p>认为住房危机就意味着草地被混凝土覆盖，纯属游说者的话。问题并非要不要更多房屋，而是建在哪里。在游说压力下，Osborne偏爱乡村新建而非城市翻新，也偏爱城外购物点而非城市商业街。这不是自由市场，而是偏向的市场。乡村城镇和村庄始终会增长，但最好沿既有边缘建设并尊重其特色。我们不破坏城市保护区，为什么要破坏乡村保护区？</p>\n</blockquote>\n<p>论述由建在哪里转向怎样在乡村增长：并非反对一切建设，而是要求保护既有空间形态和地方特征。</p>\n<p>如果B真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Osborne’s preference shows his disregard for the character of rural areas.</p>\n<p>作者认为Osborne的偏好显示其忽视乡村地区的特色。</p>\n</blockquote>\n<p>B不是说只要有乡村新建就必然破坏。作者反对的是不顾可用城市空间而偏向乡村的选择，并用特色与保护区标准指出这种偏好遗漏的约束。</p>\n<p><strong>复盘判断：B正确。</strong></p>\n</section>"},{"title":"C. stresses the necessity of easing the housing crisis","raw":"### C. stresses the necessity of easing the housing crisis\n\n> 作者认为Osborne的偏好强调缓解住房危机的必要性。\n\n**做题模式中的状态：** 第一轮排除C。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n作者已说争点不是需不需要更多房屋，而是建在哪里。C把对选址偏向的批评改成强调缓解住房危机的必要性。\n\n**出处：**\n\n> The idea that \"housing crisis\" equals \"concreted meadows\" is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne em`，即住房应建在哪里，并把奥斯本偏爱乡村新建的选择放在游说压力之下，评价这样的市场有偏向。本项`the necessity of easing the housing crisis`则把作者对选址取舍的评价改成对缓解危机之必要性的强调。作者并非在这里判断要不要缓解危机，而是在既有住房需求下批评建设向哪一边倾斜；把选址和市场偏向换成缓解危机的必要性，改变了题干要求的评价内容。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"C","cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-29-option-C-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-C-0\"><blockquote>\n<p>作者认为Osborne的偏好强调缓解住房危机的必要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>作者已说争点不是需不需要更多房屋，而是建在哪里。C把对选址偏向的批评改成强调缓解住房危机的必要性。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-C-1\"><h3>定位比对法</h3>\n<p>先把C接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为Osborne的偏好强调缓解住房危机的必要性。</p>\n</blockquote>\n<p><code>the necessity of easing the housing crisis</code>涉及为什么需要缓解住房问题，第5段用<code>not the need for more houses but</code>…<code>where to put them</code>划定争点，随后评价奥斯本的选址偏好。因此回看争点、偏好和市场评价这三处。</p>\n<p>原文把正在讨论的问题明确落在<code>where to put them</code>，即住房应建在哪里，并把奥斯本偏爱乡村新建的选择放在游说压力之下，评价这样的市场有偏向。本项<code>the necessity of easing the housing crisis</code>则把作者对选址取舍的评价改成对缓解危机之必要性的强调。作者并非在这里判断要不要缓解危机，而是在既有住房需求下批评建设向哪一边倾斜；把选址和市场偏向换成缓解危机的必要性，改变了题干要求的评价内容。</p>\n</section>"},{"title":"C. stresses the necessity of easing the housing crisis","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The idea that \"housing crisis\" equals \"concreted meadows\" is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?\n>\n> 认为住房危机就意味着草地被混凝土覆盖，纯属游说者的话。问题并非要不要更多房屋，而是建在哪里。在游说压力下，Osborne偏爱乡村新建而非城市翻新，也偏爱城外购物点而非城市商业街。这不是自由市场，而是偏向的市场。乡村城镇和村庄始终会增长，但最好沿既有边缘建设并尊重其特色。我们不破坏城市保护区，为什么要破坏乡村保护区？\n\nnot ... but把讨论从住房数量转到位置，随后两项favours均比较城乡选址，biased也针对这种倾斜。\n\n如果C真是作者的意思，这里至少应该写成：\n\n> Osborne’s preference stresses the necessity of easing the housing crisis.\n>\n> 作者认为Osborne的偏好强调缓解住房危机的必要性。\n\nC需要这项偏好被用来证明应当缓解危机。实际住房需求不是争论焦点，借需求为乡村开发辩护恰是作者批评的游说说法。\n\n**复盘判断：C错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"C","cumulative":true,"cumulativeGroup":"question-29-option-C","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-C-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-C-0\"><blockquote>\n<p>作者认为Osborne的偏好强调缓解住房危机的必要性。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除C。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>作者已说争点不是需不需要更多房屋，而是建在哪里。C把对选址偏向的批评改成强调缓解住房危机的必要性。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; ges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-29-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>作者认为Osborne的偏好凸显其坚决抵制游说压力。</p>\n</blockquote>\n<p>Under lobby pressure将偏好置于游说压力之下，D却说它显示坚决抵制压力，反转了政策与游说的关系。</p>\n<p>段首先称住房危机等同混凝土覆盖草地为lobby talk，随后指出Osborne在这种压力下的具体取舍。</p>\n<p>D需要他拒绝游说所要求的乡村新建偏向。实际写他偏爱该方向，不能把受压力影响的选择写成与压力抗衡。</p>\n</section>"},{"title":"D. highlights his firm stand against lobby pressure","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> The idea that \"housing crisis\" equals \"concreted meadows\" is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?\n>\n> 认为住房危机就意味着草地被混凝土覆盖，纯属游说者的话。问题并非要不要更多房屋，而是建在哪里。在游说压力下，Osborne偏爱乡村新建而非城市翻新，也偏爱城外购物点而非城市商业街。这不是自由市场，而是偏向的市场。乡村城镇和村庄始终会增长，但最好沿既有边缘建设并尊重其特色。我们不破坏城市保护区，为什么要破坏乡村保护区？\n\n段首先称住房危机等同混凝土覆盖草地为lobby talk，随后指出Osborne在这种压力下的具体取舍。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> Osborne’s preference highlights his firm stand against lobby pressure.\n>\n> 作者认为Osborne的偏好凸显其坚决抵制游说压力。\n\nD需要他拒绝游说所要求的乡村新建偏向。实际写他偏爱该方向，不能把受压力影响的选择写成与压力抗衡。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"29","option":"D","cumulative":true,"cumulativeGroup":"question-29-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-29-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-29-option-D-0\"><b ne偏爱乡村新建而非城市翻新，也偏爱城外购物点而非城市商业街。这不是自由市场，而是偏向的市场。乡村城镇和村庄始终会增长，但最好沿既有边缘建设并尊重其特色。我们不破坏城市保护区，为什么要破坏乡村保护区？</p>\n</blockquote>\n<p>段首先称住房危机等同混凝土覆盖草地为lobby talk，随后指出Osborne在这种压力下的具体取舍。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>Osborne’s preference highlights his firm stand against lobby pressure.</p>\n<p>作者认为Osborne的偏好凸显其坚决抵制游说压力。</p>\n</blockquote>\n<p>D需要他拒绝游说所要求的乡村新建偏向。实际写他偏爱该方向，不能把受压力影响的选择写成与压力抗衡。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"29题结论","raw":"### 29题结论\n\n> **29. B**\n\n- A：biased确实批评政策偏向，所以A有表面联系；但对乡村新建的偏爱，还不足以证明对城市本身怀有强烈成见，段落的具体批评落在乡村保护上。\n- B：偏好乡村新建之后，作者强调乡村增长应沿既有边缘并尊重特色，又反问为何破坏乡村保护区。B接住这一具体保护标准。\n- C：作者已说争点不是需不需要更多房屋，而是建在哪里。C把对选址偏向的批评改成强调缓解住房危机的必要性。\n- D：Under lobby pressure将偏好置于游说压力之下，D却说它显示坚决抵制压力，反转了政策与游说的关系。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"29题","focus":[150,1321,1344,367],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"29","questionConclusion":true},"html":"<blockquote>\n<p><strong>29. B</strong></p>\n</blockquote>\n<ul>\n<li>A：biased确实批评政策偏向，所以A有表面联系；但对乡村新建的偏爱，还不足以证明对城市本身怀有强烈成见，段落的具体批评落在乡村保护上。</li>\n<li>B：偏好乡村新建之后，作者强调乡村增长应沿既有边缘并尊重特色，又反问为何破坏乡村保护区。B接住这一具体保护标准。</li>\n<li>C：作者已说争点不是需不需要更多房屋，而是建在哪里。C把对选址偏向的批评改成强调缓解住房危机的必要性。</li>\n<li>D：Under lobby pressure将偏好置于游说压力之下，D却说它显示坚决抵制压力，反转了政策与游说的关系。</li>\n</ul>\n"},{"title":"30题 · 题干、题型与核心出处","raw":"## 30题\n\n> In the last paragraph, the author shows his appreciation of ______.\n>\n> 在最后一段，作者表达了对______的赞赏。\n\n### 题型\n\n态度对象题：找明确赞成的做法与成效归因，分清空间压力背景、规划结果和政治呼吁。\n\n题干明确说In the last paragraph，直接将第6段从开发应如何进行读到末尾的政治呼吁。\n\n### 核心出处\n\n> Development should be planned, not let rip.\n>\n> After the Netherlands, Britain is Europe’s most crowded country.\n>\n> Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":2,"meta":{"kind":"question","question":"30","questionIntro":true},"html":"<blockquote>\n<p>In the last paragraph, the author shows his appreciation of ______.</p>\n<p>在最后一段，作者表达了对______的赞赏。</p>\n</blockquote>\n<h3>题型</h3>\n<p>态度对象题：找明确赞成的做法与成效归因，分清空间压力背景、规划结果和政治呼吁。</p>\n<p>题干明确说In the last paragraph，直接将第6段从开发应如何进行读到末尾的政治呼吁。</p>\n<h3>核心出处</h3>\n<blockquote>\n<p>Development should be planned, not let rip.</p>\n<p>After the Netherlands, Britain is Europe’s most crowded country.</p>\n<p>Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living</p>\n</blockquote>\n"},{"title":"A. the size of population in Britain","raw":"### A. the size of population in Britain\n\n> 末段作者赞赏的是英国人口规模。\n\n**做题模式中的状态：** 第一轮排除A。\n\n**错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。**\n\n拥挤是规划所面对的空间压力，不是作者赞赏的对象；人口密度也不能直接换成人口总量。\n\n**出处：**\n\n> Development should be planned, not let rip. After the Netherlands, Britain is Europe's most crowded country. Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living. There is no doubt of the alternative – the corrupted landscapes of southern Portugal, Spain or Ireland. Avoiding this rather than promoting it should unite the left and right of the political spectrum.","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"kind":"option"},"focusId":"focus-question-30-option-A-0","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>末段作者赞赏的是英国人口规模。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>拥挤是规划所面对的空间压力，不是作者赞赏的对象；人口密度也不能直接换成人口总量。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Development should be planned, not let rip. After the Netherlands, Britain is Europe&#39;s most crowded country. Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living. There is no doubt of the alternative – the corrupted landscapes of southern Portugal, Spain or Ireland. Avoiding this rather than promoting it should unite the left and right of the political spectrum.</p>\n</blockquote>\n</section>"},{"title":"A. the size of population in Britain","raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 末段作者赞赏的是英国人口规模。\n\n`the size of population in Britain`让人想到最后一段的`Britain is Europe’s most crowded country`。回看这句及前面的`Development should be planned`，检查拥挤是在被赞赏，还是用来说明规划所面对的处境。\n\n原文先要求开发应经过规划，再说英国在欧洲的拥挤程度仅次于荷兰，`most crowded`讲的是人口与空间相结合的拥挤状况。本项`the size of population in Britain`却把赞赏对象写成人口规模。它一方面将拥挤程度换成人口总量，另一方面将规划所面对的空间压力改成作者称赞的对象；原句要求规划，并不是欣赏人口多这一事实。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":false,"kind":"method"},"focusId":"focus-question-30-option-A-1","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-A-0\"><blockquote>\n<p>末段作者赞赏的是英国人口规模。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除A。</p>\n<p><strong>错误类型：第二类——题目问宏观内容，选项拿论据、细节或其他范围的信息来回答。</strong></p>\n<p>拥挤是规划所面对的空间压力，不是作者赞赏的对象；人口密度也不能直接换成人口总量。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Development should be planned, not let rip. After the Netherlands, Britain is Europe&#39;s most crowded country. Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living. There is no doubt of the alternative – the corrupted landscapes of southern Portugal, Spain or Ireland. Avoiding this rather than promoting it should unite the left and right of the political spectrum.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-A-1\"><h3>定位比对法</h3>\n<p>先把A接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段作者赞赏的是英国人口规模。</p>\n</blockquote>\n<p><code>the size of population in Britain</code>让人想到最后一段的<code>Britain is Europe’s most crowded country</code>。回看这句及前面的<code>Development should be planned</code>，检查拥挤是在被赞赏，还是用来说明规划所面对的处境。</p>\n<p>原文先要求开发应经过规划，再说英国在欧洲的拥挤程度仅次于荷兰，<code>most crowded</code>讲的是人口与空间相结合的拥挤状况。本项<code>the size of population in Britain</code>却把赞赏对象写成人口规模。它一方面将拥挤程度换成人口总量，另一方面将规划所面对的空间压力改成作者称赞的对象；原句要求规划，并不是欣赏人口多这一事实。</p>\n</section>"},{"title":"A. the size of population in Britain","raw":"#### 写作视角法\n\n原文相关位置是这样写的：\n\n> Development should be planned, not let rip. After the Netherlands, Britain is Europe's most crowded country. Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living. There is no doubt of the alternative – the corrupted landscapes of southern Portugal, Spain or Ireland. Avoiding this rather than promoting it should unite the left and right of the political spectrum.\n>\n> 开发应有规划，不能放任。英国是欧洲仅次于荷兰的拥挤国家。半世纪城乡规划使它保留了令人羡慕的乡村协调性，同时仍容许低密度城市生活。另一种选择很清楚：葡萄牙南部、西班牙或爱尔兰遭破坏的景观。避免而非促成这种情况，应使政治左右两派团结起来。\n\n作者先要求规划，再交代英国拥挤，接着强调规划仍使乡村协调与低密度城市生活并存，突出成效来之不易。\n\n如果A真是作者的意思，这里至少应该写成：\n\n> The author appreciates the size of population in Britain.\n>\n> 末段作者赞赏的是英国人口规模。\n\nA需要对人口规模作正面评价。实际拥挤提供困难背景，受到称赞的是在此条件下仍实现平衡的规划。\n\n**复盘判断：A错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"A","cumulative":true,"cumulativeGroup":"question-30-option-A","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-30-option-A-2","html":"<section class=\"revealPart op f the alternative – the corrupted landscapes of southern Portugal, Spain or Ireland. Avoiding this rather than promoting it should unite the left and right of the political spectrum.\n>\n> 开发应有规划，不能放任。英国是欧洲仅次于荷兰的拥挤国家。半世纪城乡规划使它保留了令人羡慕的乡村协调性，同时仍容许低密度城市生活。另一种选择很清楚：葡萄牙南部、西班牙或爱尔兰遭破坏的景观。避免而非促成这种情况，应使政治左右两派团结起来。\n\n末句由他国景观破坏转出共同政治目标，回应的是如何支持规划保护，没有改为评价英国现有政治生活多好。\n\n如果D真是作者的意思，这里至少应该写成：\n\n> The author appreciates the political life in today’s Britain.\n>\n> 末段作者赞赏的是当今英国政治生活。\n\nD需要现实政治状态得到肯定的内容。should表达期待，而开头还说保护缺少政治支持，不能用未来呼吁替换当前评价。\n\n**复盘判断：D错误。**","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":4,"meta":{"question":"30","option":"D","cumulative":true,"cumulativeGroup":"question-30-option-D","cumulativeFinal":true,"kind":"method"},"focusId":"focus-question-30-option-D-2","html":"<section class=\"revealPart optionLead\" id=\"focus-question-30-option-D-0\"><blockquote>\n<p>末段作者赞赏的是当今英国政治生活。</p>\n</blockquote>\n<p><strong>做题模式中的状态：</strong> 第一轮排除D。</p>\n<p><strong>错误类型：第一类——歪曲原意。</strong></p>\n<p>should unite是呼吁左右派共同避免破坏，D却把它写成对当今政治生活的赞赏，将应当做的事当成已实现的状态。</p>\n<p><strong>出处：</strong></p>\n<blockquote>\n<p>Development should be planned, not let rip. After the Netherlands, Britain is Europe&#39;s most crowded country. Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living. There is no doubt of the alternative – the corrupted landscapes of southern Portugal, Spain or Ireland. Avoiding this rather than promoting it should unite the left and right of the political spectrum.</p>\n</blockquote>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-1\"><h3>定位比对法</h3>\n<p>先把D接回题干，整句话就变成：</p>\n<blockquote>\n<p>末段作者赞赏的是当今英国政治生活。</p>\n</blockquote>\n<p>should unite是呼吁左右派共同避免破坏，D却把它写成对当今政治生活的赞赏，将应当做的事当成已实现的状态。</p>\n<p>末句由他国景观破坏转出共同政治目标，回应的是如何支持规划保护，没有改为评价英国现有政治生活多好。</p>\n<p>D需要现实政治状态得到肯定的内容。should表达期待，而开头还说保护缺少政治支持，不能用未来呼吁替换当前评价。</p>\n</section><section class=\"revealPart\" id=\"focus-question-30-option-D-2\"><h3>写作视角法</h3>\n<p>原文相关位置是这样写的：</p>\n<blockquote>\n<p>Development should be planned, not let rip. After the Netherlands, Britain is Europe&#39;s most crowded country. Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living. There is no doubt of the alternative – the corrupted landscapes of southern Portugal, Spain or Ireland. Avoiding this rather than promoting it should unite the left and right of the political spectrum.</p>\n<p>开发应有规划，不能放任。英国是欧洲仅次于荷兰的拥挤国家。半世纪城乡规划使它保留了令人羡慕的乡村协调性，同时仍容许低密度城市生活。另一种选择很清楚：葡萄牙南部、西班牙或爱尔兰遭破坏的景观。避免而非促成这种情况，应使政治左右两派团结起来。</p>\n</blockquote>\n<p>末句由他国景观破坏转出共同政治目标，回应的是如何支持规划保护，没有改为评价英国现有政治生活多好。</p>\n<p>如果D真是作者的意思，这里至少应该写成：</p>\n<blockquote>\n<p>The author appreciates the political life in today’s Britain.</p>\n<p>末段作者赞赏的是当今英国政治生活。</p>\n</blockquote>\n<p>D需要现实政治状态得到肯定的内容。should表达期待，而开头还说保护缺少政治支持，不能用未来呼吁替换当前评价。</p>\n<p><strong>复盘判断：D错误。</strong></p>\n</section>"},{"title":"30题结论","raw":"### 30题结论\n\n> **30. C**\n\n- A：拥挤是规划所面对的空间压力，不是作者赞赏的对象；人口密度也不能直接换成人口总量。\n- B：enviable修饰rural coherence，urban living则由low-density限定。B把对乡村协调性的赞语挪给了城市生活方式。\n- C：段首明确主张开发要规划，随后把保存乡村协调和低密度城市生活归功于半世纪城乡规划。C接住做法与成效。\n- D：should unite是呼吁左右派共同避免破坏，D却把它写成对当今政治生活的赞赏，将应当做的事当成已实现的状态。","section":"第三鸟 · 题目复盘","context":{"mode":"image","asset":"questions","label":"30题","focus":[150,1688,1344,389],"sourceW":1624,"sourceH":2262},"level":3,"meta":{"kind":"conclusion","question":"30","questionConclusion":true},"html":"<blockquote>\n<p><strong>30. C</strong></p>\n</blockquote>\n<ul>\n<li>A：拥挤是规划所面对的空间压力，不是作者赞赏的对象；人口密度也不能直接换成人口总量。</li>\n<li>B：enviable修饰rural coherence，urban living则由low-density限定。B把对乡村协调性的赞语挪给了城市生活方式。</li>\n<li>C：段首明确主张开发要规划，随后把保存乡村协调和低密度城市生活归功于半世纪城乡规划。C接住做法与成效。</li>\n<li>D：should unite是呼吁左右派共同避免破坏，D却把它写成对当今政治生活的赞赏，将应当做的事当成已实现的状态。</li>\n</ul>\n"},{"title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","raw":"在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：英国乡村保护的悖论**（段落1核心问题） 背景：历史上首次城镇人口超过乡村 → 英国的奇怪现象：【民意高度重视乡村（与皇室、莎士比亚、NHS并列）// 但政治支持有限】\n\n↓（历史回顾）\n\n**逻辑层次2：乡村保护的历史与现实**（段落2历史背景） 百年前的努力：奥克塔维亚·希尔创立国民信托（保护自然美景，为城市居民提供休闲空间）→ 成就：促成国家公园和绿化带 → 现实威胁：【乡村不可再生 + 每年被混凝土吞噬 → 需要持续守护】\n\n↓（政治现状）\n\n**逻辑层次3：各政党对乡村保护的态度**（段落3政治分析） 主要政党的立场：【保守党：乡村开发优先于保护 + 授权\"计划外\"建设 / 工党：想终止反对开发的地方规划 / 自由民主党：沉默】// 只有英国独立党：支持审慎使用绿地（其运动让地方保守党恐慌）\n\n→（理性解决方案）\n\n**逻辑层次4：合理的开发选择**（段落4-5解决方案） 正确的建设地点：城市和城镇（基础设施完备）→ 证据：伦敦可容纳50万套房屋而不侵犯绿化带 → 批判错误观念：【\"住房危机=混凝土化草地\"是游说言论 → 真问题是选址】→ 奥斯本的偏见：（偏爱乡村新建而非城市更新）→ 正确方式：乡村发展应贴边缘并尊重特色\n\n↓（更大视角）\n\n**逻辑层次5：规划的重要性与警示**（段落6总结呼吁） 原则：发展需规划而非放任 → 英国成就：（欧洲第二拥挤但保持乡村连贯性 + 低密度城市生活）→ 反面教材：（葡萄牙南部、西班牙、爱尔兰的破坏景观）→ 呼吁：避免破坏应团结左右两派\n\n↑（全文主旨）\n\n全文核心观点：尽管英国民众高度重视乡村，但政治支持不足。在住房压力下，应该在城市而非乡村建设，通过合理规划保护乡村特色，避免重蹈其他欧洲国家的覆辙。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。</p>\n<p>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：</p>\n<p><strong>逻辑层次1：英国乡村保护的悖论</strong>（段落1核心问题） 背景：历史上首次城镇人口超过乡村 → 英国的奇怪现象：【民意高度重视乡村（与皇室、莎士比亚、NHS并列）// 但政治支持有限】</p>\n<p>↓（历史回顾）</p>\n<p><strong>逻辑层次2：乡村保护的历史与现实</strong>（段落2历史背景） 百年前的努力：奥克塔维亚·希尔创立国民信托（保护自然美景，为城市居民提供休闲空间）→ 成就：促成国家公园和绿化带 → 现实威胁：【乡村不可再生 + 每年被混凝土吞噬 → 需要持续守护】</p>\n<p>↓（政治现状）</p>\n<p><strong>逻辑层次3：各政党对乡村保护的态度</strong>（段落3政治分析） 主要政党的立场：【保守党：乡村开发优先于保护 + 授权&quot;计划外&quot;建设 / 工党：想终止反对开发的地方规划 / 自由民主党：沉默】// 只有英国独立党：支持审慎使用绿地（其运动让地方保守党恐慌）</p>\n<p>→（理性解决方案）</p>\n<p><strong>逻辑层次4：合理的开发选择</strong>（段落4-5解决方案） 正确的建设地点：城市和城镇（基础设施完备）→ 证据：伦敦可容纳50万套房屋而不侵犯绿化带 → 批判错误观念：【&quot;住房危机=混凝土化草地&quot;是游说言论 → 真问题是选址】→ 奥斯本的偏见：（偏爱乡村新建而非城市更新）→ 正确方式：乡村发展应贴边缘并尊重特色</p>\n<p>↓（更大视角）</p>\n<p><strong>逻辑层次5：规划的重要性与警示</strong>（段落6总结呼吁） 原则：发展需规划而非放任 → 英国成就：（欧洲第二拥挤但保持乡村连贯性 + 低密度城市生活）→ 反面教材：（葡萄牙南部、西班牙、爱尔兰的破坏景观）→ 呼吁：避免破坏应团结左右两派</p>\n<p>↑（全文主旨）</p>\n<p>全文核心观点：尽管英国民众高度重视乡村，但政治支持不足。在住房压力下，应该在城市而非乡村建设，通过合理规划保护乡村特色，避免重蹈其他欧洲国家的覆辙。</p>\n"},{"title":"小标题题 · 41题","raw":"### 小标题题 · 41题\n\n【答案】A. Public affection contrasted with weak protection\n\n> 公众喜爱与薄弱保护形成反差\n\n先写民众热爱乡村却缺少政治支持，再回顾保护运动与乡村被持续占用的现实。\n\n> For the first time in history more people live in towns than in the country.\n\n城镇人口更多先交代背景，随后的民调显示公众仍珍视乡村，但limited political support马上形成政治落差。\n\n> A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save \"the beauty of natural places for everyone forever.\" It was specifically to provide city dwellers with spaces for leisure where they could experience \"a refreshing air.\" Hill's pressure later led to the creation of national parks and green belts.\n\nHill的保护目标与公园、绿带成果说明过去为保存自然所作的努力，不能只因已有成果就认定今天保护充足。\n\n> It needs constant guardianship.\n\nneeds constant guardianship承接混凝土持续吞噬乡村的现实，揭示公众喜爱仍未转成足够保护。\n\n这一部分的推进关系是：\n\n> 公众珍视乡村却缺少政治支持 → 历史保护成果 → 持续侵占要求继续守护\n\naffection对应proudest，weak protection对应limited support及concrete consumes more。\n\n再看最强干扰项G：Universal agreement among the major parties。\n\n民意并不等于政党达成保护共识，后文恰恰显示支持不足。\n\n**41题选A。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"level":2,"meta":{"kind":"newtype","question":"41"},"html":"<p>【答案】A. Public affection contrasted with weak protection</p>\n<blockquote>\n<p>公众喜爱与薄弱保护形成反差</p>\n</blockquote>\n<p>先写民众热爱乡村却缺少政治支持，再回顾保护运动与乡村被持续占用的现实。</p>\n<blockquote>\n<p>For the first time in history more people live in towns than in the country.</p>\n</blockquote>\n<p>城镇人口更多先交代背景，随后的民调显示公众仍珍视乡村，但limited political support马上形成政治落差。</p>\n<blockquote>\n<p>A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save &quot;the beauty of natural places for everyone forever.&quot; It was specifically to provide city dwellers with spaces for leisure where they could experience &quot;a refreshing air.&quot; Hill&#39;s pressure later led to the creation of national parks and green belts.</p>\n</blockquote>\n<p>Hill的保护目标与公园、绿带成果说明过去为保存自然所作的努力，不能只因已有成果就认定今天保护充足。</p>\n<blockquote>\n<p>It needs constant guardianship.</p>\n</blockquote>\n<p>needs constant guardianship承接混凝土持续吞噬乡村的现实，揭示公众喜爱仍未转成足够保护。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>公众珍视乡村却缺少政治支持 → 历史保护成果 → 持续侵占要求继续守护</p>\n</blockquote>\n<p>affection对应proudest，weak protection对应limited support及concrete consumes more。</p>\n<p>再看最强干扰项G：Universal agreement among the major parties。</p>\n<p>民意并不等于政党达成保护共识，后文恰恰显示支持不足。</p>\n<p><strong>41题选A。</strong></p>\n"},{"title":"小标题题 · 42题","raw":"### 小标题题 · 42题\n\n【答案】C. Political priorities that favour development\n\n> 偏向开发的政治优先事项\n\n逐一写保守党、工党、自民党的取向，再以Ukip转向保护来说明政治机会。\n\n> At the next election none of the big parties seem likely to endorse this sentiment.\n\nnone of the big parties先给主要政党的共同倾向，随后需要逐党说明为何保护得不到支持。\n\n> Labour likewise wants to discontinue local planning where councils oppose development.\n\nLabour likewise与前面的保守党相接，两者都削弱地方对开发的约束；自由民主党则沉默。\n\n> Its Campaign to Protect Rural England struck terror into many local Conservative parties.\n\nOnly Ukip作为例外，察觉政治机会并让对手紧张。标题概括主导开发倾向，也要能容纳由此产生的保护方机会。\n\n这一部分的推进关系是：\n\n> 主要政党偏向开发或沉默 → Ukip支持审慎使用绿地 → 保护立场形成竞争机会\n\npriorities对应development priority和profitable，标题覆盖政党取舍。\n\n再看最强干扰项G：Universal agreement among the major parties。\n\n各党行为不同，不能把这一比较变成全面共识。\n\n**42题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"level":2,"meta":{"kind":"newtype","question":"42"},"html":"<p>【答案】C. Political priorities that favour development</p>\n<blockquote>\n<p>偏向开发的政治优先事项</p>\n</blockquote>\n<p>逐一写保守党、工党、自民党的取向，再以Ukip转向保护来说明政治机会。</p>\n<blockquote>\n<p>At the next election none of the big parties seem likely to endorse this sentiment.</p>\n</blockquote>\n<p>none of the big parties先给主要政党的共同倾向，随后需要逐党说明为何保护得不到支持。</p>\n<blockquote>\n<p>Labour likewise wants to discontinue local planning where councils oppose development.</p>\n</blockquote>\n<p>Labour likewise与前面的保守党相接，两者都削弱地方对开发的约束；自由民主党则沉默。</p>\n<blockquote>\n<p>Its Campaign to Protect Rural England struck terror into many local Conservative parties.</p>\n</blockquote>\n<p>Only Ukip作为例外，察觉政治机会并让对手紧张。标题概括主导开发倾向，也要能容纳由此产生的保护方机会。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>主要政党偏向开发或沉默 → Ukip支持审慎使用绿地 → 保护立场形成竞争机会</p>\n</blockquote>\n<p>priorities对应development priority和profitable，标题覆盖政党取舍。</p>\n<p>再看最强干扰项G：Universal agreement among the major parties。</p>\n<p>各党行为不同，不能把这一比较变成全面共识。</p>\n<p><strong>42题选C。</strong></p>\n"},{"title":"小标题题 · 43题","raw":"### 小标题题 · 43题\n\n【答案】D. Why existing urban sites should come first\n\n> 为何应优先利用现有城市地块\n\n直接提出城市和城镇适合建房，随后用伦敦已有大量可用地块作证。\n\n> The sensible place to build new houses, factories and offices is where people are, in cities and towns where infrastructure is in place.\n\nsensible place直接提出选址判断：人口与基础设施已有的城市、城镇适合承接建设。\n\n> The London agents Stirling Ackroyd recently identified enough sites for half a million houses in the London area alone, with no intrusion on green belt.\n\n伦敦可容纳五十万房屋而不侵入绿带，为这项选址主张提供具体容量依据。\n\n> What is true of London is even truer of the provinces.\n\neven truer把伦敦证据延伸到其他地区，段落始终在解释已有城市空间为何可优先利用。\n\n这一部分的推进关系是：\n\n> 城市人口与设施已有 → 伦敦地块容量作证 → 其他地区更有条件采用\n\nexisting urban sites对应infrastructure in place与identified sites，come first体现选址优先。\n\n再看最强干扰项E：A call to stop every kind of new construction。\n\n主张在合适地点建设，不是所有建设都停止。\n\n**43题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"level":2,"meta":{"kind":"newtype","question":"43"},"html":"<p>【答案】D. Why existing urban sites should come first</p>\n<blockquote>\n<p>为何应优先利用现有城市地块</p>\n</blockquote>\n<p>直接提出城市和城镇适合建房，随后用伦敦已有大量可用地块作证。</p>\n<blockquote>\n<p>The sensible place to build new houses, factories and offices is where people are, in cities and towns where infrastructure is in place.</p>\n</blockquote>\n<p>sensible place直接提出选址判断：人口与基础设施已有的城市、城镇适合承接建设。</p>\n<blockquote>\n<p>The London agents Stirling Ackroyd recently identified enough sites for half a million houses in the London area alone, with no intrusion on green belt.</p>\n</blockquote>\n<p>伦敦可容纳五十万房屋而不侵入绿带，为这项选址主张提供具体容量依据。</p>\n<blockquote>\n<p>What is true of London is even truer of the provinces.</p>\n</blockquote>\n<p>even truer把伦敦证据延伸到其他地区，段落始终在解释已有城市空间为何可优先利用。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>城市人口与设施已有 → 伦敦地块容量作证 → 其他地区更有条件采用</p>\n</blockquote>\n<p>existing urban sites对应infrastructure in place与identified sites，come first体现选址优先。</p>\n<p>再看最强干扰项E：A call to stop every kind of new construction。</p>\n<p>主张在合适地点建设，不是所有建设都停止。</p>\n<p><strong>43题选D。</strong></p>\n"},{"title":"小标题题 · 44题","raw":"### 小标题题 · 44题\n\n【答案】F. A biased choice that threatens rural character\n\n> 威胁乡村特色的偏向性选择\n\n作者把问题从是否需要住房改成建在哪里，批评乡村新建优先，并提出尊重乡村特色的边界。\n\n> The idea that \"housing crisis\" equals \"concreted meadows\" is pure lobby talk.\n\n住房危机等同草地混凝土化被称为lobby talk，先拆开住房需求与占用乡村之间未经证明的必然关系。\n\n> This is not a free market but a biased one.\n\nbiased评价游说压力下偏乡村、偏城外的选址取舍，接下来要说明这种偏向遗漏什么。\n\n> Why ruin rural ones?\n\nWhy ruin rural ones将城乡保护标准对照，连同respects their character要求开发尊重乡村特征。\n\n这一部分的推进关系是：\n\n> 住房需求不等于必须占乡村 → 政策偏向乡村新建 → 乡村特色同样应获保护\n\nbiased choice对应biased market，rural character对应respects their character。\n\n再看最强干扰项E：A call to stop every kind of new construction。\n\n原文承认乡镇一直会发展，反对的是破坏性选址和失衡政策。\n\n**44题选F。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"level":2,"meta":{"kind":"newtype","question":"44"},"html":"<p>【答案】F. A biased choice that threatens rural character</p>\n<blockquote>\n<p>威胁乡村特色的偏向性选择</p>\n</blockquote>\n<p>作者把问题从是否需要住房改成建在哪里，批评乡村新建优先，并提出尊重乡村特色的边界。</p>\n<blockquote>\n<p>The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; is pure lobby talk.</p>\n</blockquote>\n<p>住房危机等同草地混凝土化被称为lobby talk，先拆开住房需求与占用乡村之间未经证明的必然关系。</p>\n<blockquote>\n<p>This is not a free market but a biased one.</p>\n</blockquote>\n<p>biased评价游说压力下偏乡村、偏城外的选址取舍，接下来要说明这种偏向遗漏什么。</p>\n<blockquote>\n<p>Why ruin rural ones?</p>\n</blockquote>\n<p>Why ruin rural ones将城乡保护标准对照，连同respects their character要求开发尊重乡村特征。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>住房需求不等于必须占乡村 → 政策偏向乡村新建 → 乡村特色同样应获保护</p>\n</blockquote>\n<p>biased choice对应biased market，rural character对应respects their character。</p>\n<p>再看最强干扰项E：A call to stop every kind of new construction。</p>\n<p>原文承认乡镇一直会发展，反对的是破坏性选址和失衡政策。</p>\n<p><strong>44题选F。</strong></p>\n"},{"title":"小标题题 · 45题","raw":"### 小标题题 · 45题\n\n【答案】B. Planning as a way to balance growth and preservation\n\n> 以规划平衡发展与保护\n\n以英国拥挤的背景说明规划成效，再用他国被破坏的景观提供反面参照。\n\n> Development should be planned, not let rip.\n\nplanned与not let rip明确提出有规划地开发，区别于放任扩张，并非全面停止建设。\n\n> Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living.\n\nhas enabled把乡村协调与低密度城市生活的并存归功于规划，体现保护和居住需要可以统筹。\n\n> Avoiding this rather than promoting it should unite the left and right of the political spectrum.\n\nAvoiding this中的this指前述被破坏景观，政治呼吁旨在共同避免失衡，回到规划必要性。\n\n这一部分的推进关系是：\n\n> 应规划而非放任 → 英国统筹城乡的成效 → 他国破坏反例与共同保护要求\n\nbalance概括保留乡村协调性同时允许城市生活，planning是因果主语。\n\n再看最强干扰项D：Why existing urban sites should come first。\n\nD只概括城市地块的建议，本段总结的是统筹城乡的规划制度。\n\n**45题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"level":2,"meta":{"kind":"newtype","question":"45"},"html":"<p>【答案】B. Planning as a way to balance growth and preservation</p>\n<blockquote>\n<p>以规划平衡发展与保护</p>\n</blockquote>\n<p>以英国拥挤的背景说明规划成效，再用他国被破坏的景观提供反面参照。</p>\n<blockquote>\n<p>Development should be planned, not let rip.</p>\n</blockquote>\n<p>planned与not let rip明确提出有规划地开发，区别于放任扩张，并非全面停止建设。</p>\n<blockquote>\n<p>Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living.</p>\n</blockquote>\n<p>has enabled把乡村协调与低密度城市生活的并存归功于规划，体现保护和居住需要可以统筹。</p>\n<blockquote>\n<p>Avoiding this rather than promoting it should unite the left and right of the political spectrum.</p>\n</blockquote>\n<p>Avoiding this中的this指前述被破坏景观，政治呼吁旨在共同避免失衡，回到规划必要性。</p>\n<p>这一部分的推进关系是：</p>\n<blockquote>\n<p>应规划而非放任 → 英国统筹城乡的成效 → 他国破坏反例与共同保护要求</p>\n</blockquote>\n<p>balance概括保留乡村协调性同时允许城市生活，planning是因果主语。</p>\n<p>再看最强干扰项D：Why existing urban sites should come first。</p>\n<p>D只概括城市地块的建议，本段总结的是统筹城乡的规划制度。</p>\n<p><strong>45题选B。</strong></p>\n"},{"title":"排序题 · 全局解析","raw":"### 排序题 · 全局解析\n\nA、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 提出公众喜爱与政治保护的落差 |\n| B | 提出乡村发展应尊重既有特色 |\n| C | 用规划成效及反例说明统筹必要 |\n| D | 说明政党取向加重压力并产生机会 |\n| E | 提出优先城市选址并以伦敦作证 |\n| F | 回顾保护目的并指出持续开发压力 |\n| G | 批评将住房需求偷换成占用乡村 |\n| H | 总结规划发展及跨党派保护要求 |\n\n全文推进：\n\n> 提出公众喜爱与政治保护的落差 → 回顾保护目的并指出持续开发压力 → 说明政党取向加重压力并产生机会 → 提出优先城市选址并以伦敦作证 → 批评将住房需求偷换成占用乡村 → 提出乡村发展应尊重既有特色 → 用规划成效及反例说明统筹必要 → 总结规划发展及跨党派保护要求\n\n完整顺序：\n\n**A → F → D → E → G → B → C → H**\n\n41—45：F、D、G、B、C。","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":""},"level":2,"meta":{"kind":"newtype","question":null},"html":"<p>A、E、H三个位置已经给出，其余五段需要同时接住前文并引出后文。</p>\n<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>段落</th>\n<th>这一段在做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>提出公众喜爱与政治保护的落差</td>\n</tr>\n<tr>\n<td>B</td>\n<td>提出乡村发展应尊重既有特色</td>\n</tr>\n<tr>\n<td>C</td>\n<td>用规划成效及反例说明统筹必要</td>\n</tr>\n<tr>\n<td>D</td>\n<td>说明政党取向加重压力并产生机会</td>\n</tr>\n<tr>\n<td>E</td>\n<td>提出优先城市选址并以伦敦作证</td>\n</tr>\n<tr>\n<td>F</td>\n<td>回顾保护目的并指出持续开发压力</td>\n</tr>\n<tr>\n<td>G</td>\n<td>批评将住房需求偷换成占用乡村</td>\n</tr>\n<tr>\n<td>H</td>\n<td>总结规划发展及跨党派保护要求</td>\n</tr>\n</tbody></table></div>\n<p>全文推进：</p>\n<blockquote>\n<p>提出公众喜爱与政治保护的落差 → 回顾保护目的并指出持续  achievements now face continuing pressure as construction consumes land that cannot simply be recreated.</p>\n</blockquote>\n<p>F先说明运动服务城市居民享用自然，再用now face continuing pressure转向建设持续侵占不可再造的土地。</p>\n<p>后段D开头是：</p>\n<blockquote>\n<p>This pressure is reinforced by political choices that put development ahead of conservation.</p>\n</blockquote>\n<p>D的This pressure承接F末句，进一步解释政党优先开发的选择怎样加重侵占压力。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出公众喜爱与政治保护的落差 → 回顾保护目的并指出持续开发压力 → 说明政党取向加重压力并产生机会</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Equating that need with building on meadows serves the interests of particular lobby groups.</p>\n</blockquote>\n<p>G的that need指住房需求，但A刚提出的是乡村存续问题，未引入住房数量。先放G会让need失去所指，也跳过D所需的具体侵占压力。</p>\n<p><strong>41题选F。</strong></p>\n"},{"title":"排序题 · 42题","raw":"### 排序题 · 42题\n\n42题是全文第3段，局部关系为F → D → E。\n\n先看前段F的结尾：\n\n> Their achievements now face continuing pressure as construction consumes land that cannot simply be recreated.\n\n再看D段开头：\n\n> This pressure is reinforced by political choices that put development ahead of conservation.\n\nF末句写持续建设压力，D的This pressure复现，reinforced再说明政治选择使压力增加。\n\n本段内部继续写道：\n\n> Some parties support building beyond existing plans, while others weaken local resistance or remain silent. Support for a more careful approach can consequently create an opportunity for a party willing to defend rural land.\n\n有的党放行计划外建设，有的削弱地方抵制或沉默；保护方因而获得机会，末句留下more careful approach。\n\n后段E开头是：\n\n> A careful approach begins by asking where new buildings should go.\n\nE的A careful approach承接这项审慎做法，并先问新建筑应放哪里，开始具体解决选址问题。\n\n这三段的推进关系：\n\n> 回顾保护目的并指出持续开发压力 → 说明政党取向加重压力并产生机会 → 提出优先城市选址并以伦敦作证\n\n再检验候选G：\n\n> Equating that need with building on meadows serves the interests of particular lobby groups.\n\nG的Equating that need需要前面先有住房需求和城市可用地块的讨论。F此时仍在写保护成果受压，不能直接跳到游说者偷换住房需求。\n\n**42题选D。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"D"},"level":2,"meta":{"kind":"newtype","question":"D"},"html":"<p>42题是全文第3段，局部关系为F → D → E。</p>\n<p>先看前段F的结尾：</p>\n<blockquote>\n<p>Their achievements now face continuing pressure as construction consumes land that cannot simply be recreated.</p>\n</blockquote>\n<p>再看D段开头：</p>\n<blockquote>\n<p>This pressure is reinforced by political choices that put development ahead of conservation.</p>\n</blockquote>\n<p>F末句写持续建设压力，D的This pressure复现，reinforced再说明政治选择使压力增加。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Some parties support building beyond existing plans, while others weaken local resistance or remain silent. Support for a more careful approach can consequently create an opportunity for a party willing to defend rural land.</p>\n</blockquote>\n<p>有的党放行计划外建设，有的削弱地方抵制或沉默；保护方因而获得机会，末句留下more careful approach。</p>\n<p>后段E开头是：</p>\n<blockquote>\n<p>A careful approach begins by asking where new buildings should go.</p>\n</blockquote>\n<p>E的A careful approach承接这项审慎做法，并先问新建筑应放哪里，开始具体解决选址问题。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>回顾保护目的并指出持续开发压力 → 说明政党取向加重压力并产生机会 → 提出优先城市选址并以伦敦作证</p>\n</blockquote>\n<p>再检验候选G：</p>\n<blockquote>\n<p>Equating that need with building on meadows serves the interests of particular lobby groups.</p>\n</blockquote>\n<p>G的Equating that need需要前面先有住房需求和城市可用地块的讨论。F此时仍在写保护成果受压，不能直接跳到游说者偷换住房需求。</p>\n<p><strong>42题选D。</strong></p>\n"},{"title":"排序题 · 43题","raw":"### 排序题 · 43题\n\n43题是全文第5段，局部关系为E → G → B。\n\n先看前段E的结尾：\n\n> The need for homes therefore does not establish that open countryside must be covered with concrete.\n\n再看G段开头：\n\n> Equating that need with building on meadows serves the interests of particular lobby groups.\n\nE末句说需要房屋不等于乡村必须被覆盖，G的Equating that need紧接这种被否定的等同，指出它服务于游说团体。\n\n本段内部继续写道：\n\n> It shifts attention away from urban renovation and towards rural construction. Such a preference is not a neutral market outcome when policy deliberately favours one location over another.\n\nG说明它把注意力从城市更新移向乡村建设，并判断政策有意偏向某一选址就不是中性的市场结果。\n\n后段B开头是：\n\n> The favoured rural location also has a character that development ought to respect.\n\nB的The favoured rural location回指G中受偏爱的乡村位置，再讨论建设应该尊重它的特色。\n\n这三段的推进关系：\n\n> 提出优先城市选址并以伦敦作证 → 批评将住房需求偷换成占用乡村 → 提出乡村发展应尊重既有特色\n\n再检验候选C：\n\n> A consistent standard requires planning rather than unrestricted expansion.\n\nC的A consistent standard需要先有城乡保护标准不一致的比较，E尚在证明城市有空间。先接C就跳过政策偏向和乡村特色这两层。\n\n**43题选G。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"G"},"level":2,"meta":{"kind":"newtype","question":"G"},"html":"<p>43题是全文第5段，局部关系为E → G → B。</p>\n<p>先看前段E的结尾：</p>\n<blockquote>\n<p>The need for homes therefore does not establish that open countryside must be covered with concrete.</p>\n</blockquote>\n<p>再看G段开头：</p>\n<blockquote>\n<p>Equating that need with building on meadows serves the interests of particular lobby groups.</p>\n</blockquote>\n<p>E末句说需要房屋不等于乡村必须被覆盖，G的Equating that need紧接这种被否定的等同，指出它服务于游说团体。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>It shifts attention away from urban renovation and towards rural construction. Such a preference is not a neutral market outcome when policy deliberately favours one location over another.</p>\n</blockquote>\n<p>G说明它把注意力从城市更新移向乡村建设，并判断政策有意偏向某一选址就不是中性的市场结果。</p>\n<p>后段B开头是：</p>\n<blockquote>\n<p>The favoured rural location also has a character that development ought to respect.</p>\n</blockquote>\n<p>B的The favoured rural location回指G中受偏爱的乡村位置，再讨论建设应该尊重它的特色。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出优先城市选址并以伦敦作证 → 批评将住房需求偷换成占用乡村 → 提出乡村发展应尊重既有特色</p>\n</blockquote>\n<p>再检验候选C：</p>\n<blockquote>\n<p>A consistent standard requires planning rather than unrestricted expansion.</p>\n</blockquote>\n<p>C的A consistent standard需要先有城乡保护标准不一致的比较，E尚在证明城市有空间。先接C就跳过政策偏向和乡村特色这两层。</p>\n<p><strong>43题选G。</strong></p>\n"},{"title":"排序题 · 44题","raw":"### 排序题 · 44题\n\n44题是全文第6段，局部关系为G → B → C。\n\n先看前段G的结尾：\n\n> Such a preference is not a neutral market outcome when policy deliberately favours one location over another.\n\n再看B段开头：\n\n> The favoured rural location also has a character that development ought to respect.\n\nG结尾说政策偏好某一位置，B的The favoured rural location接住乡村选址，补出不能忽视的character。\n\n本段内部继续写道：\n\n> Towns and villages will continue to grow, but growth works best when it stays close to their existing edges. Protecting urban conservation areas while allowing rural ones to be damaged applies two inconsistent standards.\n\nB允许村镇继续增长，但要求贴边建设，随后将城市保护区与乡村保护区的不同待遇判为two inconsistent standards。\n\n后段C开头是：\n\n> A consistent standard requires planning rather than unrestricted expansion.\n\nC开头A consistent standard与B的inconsistent形成正面回应：怎样统一标准，需要规划而非无限扩张。\n\n这三段的推进关系：\n\n> 批评将住房需求偷换成占用乡村 → 提出乡村发展应尊重既有特色 → 用规划成效及反例说明统筹必要\n\n再检验候选F：\n\n> Protecting them was the aim of earlier campaigns for national parks and green belts.\n\nF回顾早期保护运动，Protecting them没有接住此处选址的具体特色问题，也不能为C提供刚指出的城乡双重标准。\n\n**44题选B。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"B"},"level":2,"meta":{"kind":"newtype","question":"B"},"html":"<p>44题是全文第6段，局部关系为G → B → C。</p>\n<p>先看前段G的结尾：</p>\n<blockquote>\n<p>Such a preference is not a neutral market outcome when policy deliberately favours one location over another.</p>\n</blockquote>\n<p>再看B段开头：</p>\n<blockquote>\n<p>The favoured rural location also has a character that development ought to respect.</p>\n</blockquote>\n<p>G结尾说政策偏好某一位置，B的The favoured rural location接住乡村选址，补出不能忽视的character。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Towns and villages will continue to grow, but growth works best when it stays close to their existing edges. Protecting urban conservation areas while allowing rural ones to be damaged applies two inconsistent standards.</p>\n</blockquote>\n<p>B允许村镇继续增长，但要求贴边建设，随后将城市保护区与乡村保护区的不同待遇判为two inconsistent standards。</p>\n<p>后段C开头是：</p>\n<blockquote>\n<p>A consistent standard requires planning rather than unrestricted expansion.</p>\n</blockquote>\n<p>C开头A consistent standard与B的inconsistent形成正面回应：怎样统一标准，需要规划而非无限扩张。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>批评将住房需求偷换成占用乡村 → 提出乡村发展应尊重既有特色 → 用规划成效及反例说明统筹必要</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Protecting them was the aim of earlier campaigns for national parks and green belts.</p>\n</blockquote>\n<p>F回顾早期保护运动，Protecting them没有接住此处选址的具体特色问题，也不能为C提供刚指出的城乡双重标准。</p>\n<p><strong>44题选B。</strong></p>\n"},{"title":"排序题 · 45题","raw":"### 排序题 · 45题\n\n45题是全文第7段，局部关系为B → C → H。\n\n先看前段B的结尾：\n\n> Protecting urban conservation areas while allowing rural ones to be damaged applies two inconsistent standards.\n\n再看C段开头：\n\n> A consistent standard requires planning rather than unrestricted expansion.\n\nB结尾指出城乡使用两套不一致标准，C的A consistent standard提出对应要求，并将办法落在规划。\n\n本段内部继续写道：\n\n> Britain’s past planning has preserved coherent countryside while allowing people to live at relatively low urban densities. Damaged landscapes elsewhere show what can follow when the balance between growth and preservation is lost.\n\n英国旧有规划的双重成效是正例，别处遭破坏的景观是失去增长与保护平衡的反例。\n\n后段H开头是：\n\n> Avoiding that loss should be a shared political objective.\n\nH的Avoiding that loss指C末句的balance ... lost，接着才能要求将避免失衡作为共同政治目标。\n\n这三段的推进关系：\n\n> 提出乡村发展应尊重既有特色 → 用规划成效及反例说明统筹必要 → 总结规划发展及跨党派保护要求\n\n再检验候选F：\n\n> Protecting them was the aim of earlier campaigns for national parks and green belts.\n\nF返回保护运动历史，只给成果与建设压力，不能完成当前对统一规划标准的说明，也没有明确给H的that loss提供平衡丧失的结论。\n\n**45题选C。**","section":"第四鸟 · 新题型","context":{"mode":"newtype","kind":"sorting","current":"C"},"level":2,"meta":{"kind":"newtype","question":"C"},"html":"<p>45题是全文第7段，局部关系为B → C → H。</p>\n<p>先看前段B的结尾：</p>\n<blockquote>\n<p>Protecting urban conservation areas while allowing rural ones to be damaged applies two inconsistent standards.</p>\n</blockquote>\n<p>再看C段开头：</p>\n<blockquote>\n<p>A consistent standard requires planning rather than unrestricted expansion.</p>\n</blockquote>\n<p>B结尾指出城乡使用两套不一致标准，C的A consistent standard提出对应要求，并将办法落在规划。</p>\n<p>本段内部继续写道：</p>\n<blockquote>\n<p>Britain’s past planning has preserved coherent countryside while allowing people to live at relatively low urban densities. Damaged landscapes elsewhere show what can follow when the balance between growth and preservation is lost.</p>\n</blockquote>\n<p>英国旧有规划的双重成效是正例，别处遭破坏的景观是失去增长与保护平衡的反例。</p>\n<p>后段H开头是：</p>\n<blockquote>\n<p>Avoiding that loss should be a shared political objective.</p>\n</blockquote>\n<p>H的Avoiding that loss指C末句的balance ... lost，接着才能要求将避免失衡作为共同政治目标。</p>\n<p>这三段的推进关系：</p>\n<blockquote>\n<p>提出乡村发展应尊重既有特色 → 用规划成效及反例说明统筹必要 → 总结规划发展及跨党派保护要求</p>\n</blockquote>\n<p>再检验候选F：</p>\n<blockquote>\n<p>Protecting them was the aim of earlier campaigns for national parks and green belts.</p>\n</blockquote>\n<p>F返回保护运动历史，只给成果与建设压力，不能完成当前对统一规划标准的说明，也没有明确给H的that loss提供平衡丧失的结论。</p>\n<p><strong>45题选C。</strong></p>\n"},{"title":"1. 大作文第一段描述题目信息时可积累的主题词","raw":"## 1. 大作文第一段描述题目信息时可积累的主题词\n\n| 可积累的主题表达 | 中文翻译 | 所属类别 | 使用层级 |\n| --- | --- | --- | --- |\n| **rural conservation** | **乡村保护** | **社会现象类｜社会生活与环保** | **宏观主题** |\n| sustainable development | 可持续发展 | 社会现象类｜社会生活与环保 | 宏观主题 |\n| urban renewal | 城市更新 | 社会现象类｜社会生活 | 宏观主题 |\n| **public participation** | **公众参与** | **社会现象类｜社会生活** | **宏观主题** |\n| careful planning | 审慎规划 | 社会现象类｜社会生活 | 宏观主题 |\n| respect for local character | 尊重地方特色 | 社会现象类｜文化教育 | 宏观主题 |\n| balanced development | 协调发展 | 社会现象类｜社会生活 | 宏观主题 |\n| a shared sense of responsibility | 共同的责任感 | 人生哲理类｜责任与合作 | 个人主题 |","section":"第五鸟 · 写作积累","context":{"mode":"image","asset":"articleAnnotated","label":"从阅读中积累写作表达","focus":null,"sourceW":1080,"sourceH":6116},"level":2,"meta":{},"html":"<div class=\"tableWrap\"><table>\n<thead>\n<tr>\n<th>可积累的主题表达</th>\n<th>中文翻译</th>\n<th>所属类别</th>\n<th>使用层级</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>rural conservation</strong></td>\n<td><strong>乡村保护</strong></td>\n<td><strong>社会现象类｜社会生活与环保</strong></td>\n<td><strong>宏观主题</strong></td>\n</tr>\n<tr>\n<td>sustainable development</td>\n<td>可持续发展</td>\n<td>社会现象类｜社会生活与环保</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td>urban renewal</td>\n<td>城市更新</td>\n<td>社会现象类｜社会生活</td>\n<td>宏观主题</td>\n</tr>\n<tr>\n<td><strong>public participation</strong></td>\n<td><strong he buildings stand close to the existing edge of the town.</td>\n<td>建筑物紧邻城镇现有边缘。</td>\n</tr>\n<tr>\n<td>图画</td>\n<td>The picture highlights the need to respect a place’s distinctive character.</td>\n<td>图画凸显尊重地方独特特色的需要。</td>\n</tr>\n<tr>\n<td><strong>图表</strong></td>\n<td><strong>More people now live in towns than in the countryside.</strong></td>\n<td><strong>如今城镇居民比乡村居民更多。</strong></td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The amount of land occupied by construction increases each year.</td>\n<td>每年被建设占用的土地数量都在增加。</td>\n</tr>\n<tr>\n<td>图表</td>\n<td>The figures suggest that capacity exists within established urban areas.</td>\n<td>数据表明既有城区内部存在开发空间。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The statement calls for development to be planned rather than left unrestricted.</td>\n<td>这句话呼吁对发展进行规划，而非任其扩张。</td>\n</tr>\n<tr>\n<td>文本评论</td>\n<td>The passage links effective protection to the practical choices made by policymakers.</td>\n<td>这段文字将有效保护与政策制定者的实际选择联系起来。</td>\n</tr>\n</tbody></table></div>\n"}];
