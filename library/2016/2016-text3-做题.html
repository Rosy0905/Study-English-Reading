<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 31题题干\n\n**The author views Milton Friedman’s statement about CSR with ______.**\n\n> 作者以怎样的态度看待米尔顿·弗里德曼关于企业社会责任的说法？\n\n题型：**态度题**。","articleRects":[],"questionRects":[[226,190,983,31],[1218,222,111,7]],"scrollTarget":"question","meta":{"kind":"stem","qid":"31"},"html":"<h2>31题题干</h2>\n<p><strong>The author views Milton Friedman’s statement about CSR with ______.</strong></p>\n<blockquote><p>作者以怎样的态度看待米尔顿·弗里德曼关于企业社会责任的说法？</p>\n</blockquote>\n<p>题型：<strong>态度题</strong>。</p>\n"},{"section":"先读题干","raw":"## 32题题干\n\n**According to Paragraph 2, CSR helps a company by ______.**\n\n> 根据第二段，企业社会责任通过什么方式帮助一家公司？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,557,831,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"32"},"html":"<h2>32题题干</h2>\n<p><strong>According to Paragraph 2, CSR helps a company by ______.</strong></p>\n<blockquote><p>根据第二段，企业社会责任通过什么方式帮助一家公司？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 33题题干\n\n**The expression “more lenient” (Line 2, Para. 4) is closest in meaning to ______.**\n\n> 第四段第二行的more lenient在意思上最接近什么？\n\n题型：**词义题**。","articleRects":[],"questionRects":[[226,923,1195,40],[281,990,32,26]],"scrollTarget":"question","meta":{"kind":"stem","qid":"33"},"html":"<h2>33题题干</h2>\n<p><strong>The expression “more lenient” (Line 2, Para. 4) is closest in meaning to ______.</strong></p>\n<blockquote><p>第四段第二行的more lenient在意思上最接近什么？</p>\n</blockquote>\n<p>题型：<strong>词义题</strong>。</p>\n"},{"section":"先读题干","raw":"## 34题题干\n\n**When prosecutors evaluate a case, a company’s CSR record ______.**\n\n> 当检察官评估案件时，一家公司的企业社会责任记录会怎样？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,1353,943,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"34"},"html":"<h2>34题题干</h2>\n<p><strong>When prosecutors evaluate a case, a company’s CSR record ______.</strong></p>\n<blockquote><p>当检察官评估案件时，一家公司的企业社会责任记录会怎样？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 35题题干\n\n**Which of the following is true of CSR, according to the last paragraph?**\n\n> 根据最后一段，关于企业社会责任，下列哪项说法正确？\n\n题型：**细节判断题**。","articleRects":[],"questionRects":[[226,1721,1120,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"35"},"html":"<h2>35题题干</h2>\n<p><strong>Which of the following is true of CSR, according to the last paragraph?</strong></p>\n<blockquote><p>根据最后一段，关于企业社会责任，下列哪项说法正确？</p>\n</blockquote>\n<p>题型：<strong>细节判断题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, even if, First |\n| 态度词／评价词 | 先抓个大概好坏 | high quality, good, lower |\n| 动作词 | 先看谁做了什么 | increase, donate, receive |\n| 结果词 | 看最后出了什么事 | profits, value, penalties |\n| 重复主题词 | 大概知道老在说什么 | CSR, companies, consumers |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, even if, First</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>high quality, good, lower</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>increase, donate, receive</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>profits, value, penalties</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>CSR, companies, consumers</td></tr></tbody></table>\n"},{"section":"读文章","raw":"“There is one and only one social responsibility of business,” wrote Milton Friedman, a Nobel prize-winning economist, “That is, to use its resources and engage in activities designed to increase its profits.” But even if you accept Friedman’s **[xxx]** and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut. New research suggests that CSR may create **[xxx]** value for companies—at least when they are prosecuted for **[xxx]**.","articleRects":[[276,279,1120,39],[202,326,1194,38],[202,370,1194,40],[202,416,1194,39],[202,463,1194,38],[202,509,1195,38],[202,554,595,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>“There is one and only one social responsibility of business,” wrote Milton Friedman, a Nobel prize-winning economist, “That is, to use its resources and engage in activities designed to increase its profits.” But even if you accept Friedman’s <strong>[xxx]</strong> and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut. New research suggests that CSR may create <strong>[xxx]</strong> value for companies—at least when they are prosecuted for <strong>[xxx]</strong>.</p>\n</div></div>"},{"section":"读文章","raw":"“There is one and only one social responsibility of business,” wrote Milton Friedman, / a Nobel prize-winning economist, “That is, / to use its resources and engage in activities designed to increase its profits.” But even if you acc ":[],"coarseCoverage":{},"paragraphPids":[5]},"contextRaw":"1、有且只有一种、企业的社会责任、运用其资源、旨在增加其利润、视作浪费股东的钱、新研究表明企业社会责任。\n\n2、花费超过150亿美元、通过三种方式、产品质量很高、为公益事业捐款、为它赢得更多照顾。\n\n3、消费者可能受影响、来自全部三种、试图区分它们、仅来自光环效应。\n\n4、在被起诉公司中、更宽大的处罚、政治影响力、并未获更低罚款。\n\n5、评判案件、依据案情本身、受公司记录影响、增加企业捐赠、低40%。","html":"<div class=\"coarseStack\"><div class=\"coarseDone\"><p>1、有且只有一种、企业的社会责任、运用其资源、旨在增加其利润、视作浪费股东的钱、新研究表明企业社会责任。</p>\n</div><div class=\"coarseDone\"><p>2、花费超过150亿美元、通过三种方式、产品质量很高、为公益事业捐款、为它赢得更多照顾。</p>\n</div><div class=\"coarseDone\"><p>3、消费者可能受影响、来自全部三种、试图区分它们、仅来自光环效应。</p>\n</div><div class=\"coarseDone\"><p>4、在被起诉公司中、更宽大的处罚、政治影响力、并未获更低罚款。</p>\n</div><div class=\"coarseDone\"><p>5、评判案件、依据案情本身、受公司记录影响、增加企业捐赠、低40%。</p>\n</div><div class=\"currentFocus\"><p>6、没有回答这个问题、企业应花费多少、它也没有揭示、但至少、良好品行的证据、代价较低的处罚。</p>\n</div></div>"},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到有且只有一种、企业的社会责任、视作浪费股东的钱、新研究表明企业社会责任；中间又出现花费超过150亿美元、通过三种方式、为公益事业捐款、为它赢得更多照顾；消费者可能受影响、来自全部三种、试图区分它们、仅来自光环效应；在被起诉公司中、更宽大的处罚、政治影响力、并未获更低罚款；评判案件、依据案情本身、增加企业捐赠、低40%；结尾还有没有回答这个问题、企业应花费多少、良好品行的证据、代价较低的处罚。\n\n到这里还不能自然地说清楚：企业的社会责任支出可能怎样带来收益，研究如何区分几种作用，又能证明到什么程度。先留下松散印象和大致位置，具体关系等题目问到时再查。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到有且只有一种、企业的社会责任、视作浪费股东的钱、新研究表明企业社会责任；中间又出现花费超过150亿美元、通过三种方式、为公益事业捐款、为它赢得更多照顾；消费者可能受影响、来自全部三种、试图区分它们、仅来自光环效应；在被起诉公司中、更宽大的处罚、政治影响力、并未获更低罚款；评判案件、依据案情本身、增加企业捐赠、低40%；结尾还有没有回答这个问题、企业应花费多少、良好品行的证据、代价较低的处罚。</p>\n<p>到这里还不能自然地说清楚：企业的社会责任支出可能怎样带来收益，研究如何区分几种作用，又能证明到什么程度。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"31题","raw":"## 31题\n\n> The author views Milton Friedman’s statement about CSR with ______.  \n> 作者以怎样的态度看待米尔顿·弗里德曼关于企业社会责任的说法？\n\n题干给出Milton Friedman，直接到第一段找这位经济学家的引语。把引语以及后面从But even if到本段结尾的作者回应完整读完。\n\n> 原文参考：\n> \n> “There is one and only one social responsibility of business,” wrote Milton Friedman, a Nobel prize-winning economist, “That is, to use its resources and engage in activities designed to increase its profits.” But even if you accept Friedman’s **[xxx]** and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut. New research suggests that CSR may create **[xxx]** value for companies—at least when they are prosecuted for **[xxx]**.\n> \n> 开始精读：\n> \n> “There is one and only one / social responsibility of business,” / wrote Milton Friedman, / a Nobel prize-winning economist, / “That is, / to use its resources / and engage in activities / designed to increase its profits.” / But even if you accept / Friedman’s **[xxx]** / and regard corporate social responsibility (CSR) / policies as a waste / of shareholders’ money, / things may not be absolutely clear-cut. / New research suggests / that CSR may create **[xxx]** value / for companies—at least / when they are prosecuted for **[xxx]**.\n> \n> “有且只有一种 / 企业的社会责任，” / 米尔顿·弗里德曼写道， / 一位获诺贝尔奖的经济学家， / “那就是， / 运用其资源 / 并从事活动 / 旨在增加其利润。” / 但即使你接受 / 弗里德曼的**[xxx]** / 并把企业社会责任 / 政策视作一种浪费 / 浪费股东的钱， / 情况未必完全界限分明。 / 新研究表明 / 企业社会责任可创造**[xxx]**价值 / 对公司而言——至少 / 当它们因**[xxx]**被起诉时。\n\nviews…statement问作者如何评价弗里德曼的说法。引语将增加利润称为企业唯一的社会责任；空格需要补作者回应这一说法时的态度。\n\n接下来按A—D逐项看。","articleRects":[[276,279,1120,39],[202,326,1194,38],[202,370,1194,40],[202,416,1194,39],[202,463,1194,38],[202,509,1195,38],[202,554,595,38]],"questionRects":[[226,190,983,31],[1218,222,111,7],[280,251,210,38],[280,313,201,37],[280,374,173,37],[280,435,181,31]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"31","initialReadingPids":[0]},"html":"<h2>31题</h2>\n<blockquote><p>The author views Milton Friedman’s statement about CSR with ______.<br />\n作者以怎样的态度看待米尔顿·弗里德曼关于企业社会责任的说法？</p>\n</blockquote>\n<p>题干给出Milton Friedman，直接到第一段找这位经济学家的引语。把引语以及后面从But even if到本段结尾的作者回应完整读完。</p>\n<blockquote><p>原文参考：</p>\n<p>“There is one and only one social responsibility of business,” wrote Milton Friedman, a Nobel prize-winning economist, “That is, to use its resources and engage in activities designed to increase its profits.” But even if you accept Friedman’s <strong>[xxx]</strong> and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut. New research suggests that CSR may create <strong>[xxx]</strong> value for companies—at least when they are prosecuted for <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>“There is one and only one / social responsibility of business,” / wrote Milton Friedman, / a Nobel prize-winning economist, / “That is, / to use its resources / and engage in activities / designed to increase its profits.” / But even if you accept / Friedman’s <strong>[xxx]</strong> / and regard corporate social responsibility (CSR) / policies as a waste / of shareholders’ money, / things may not be absolutely clear-cut. / New research suggests / that CSR may create <strong>[xxx]</strong> value / for companies—at least / when they are prosecuted for <strong>[xxx]</strong>.</p>\n<p>“有且只有一种 / 企业的社会责任，” / 米尔顿·弗里德曼写道， / 一位获诺贝尔奖的经济学家， / “那就是， / 运用其资源 / 并从事活动 / 旨在增加其利润。” / 但即使你接受 / 弗里德曼的<strong>[xxx]</strong> / 并把企业社会责任 / 政策视作一种浪费 / 浪费股东的钱， / 情况未必完全界限分明。 / 新研究表明 / 企业社会责任可创造<strong>[xxx]</strong>价值 / 对公司而言——至少 / 当它们因<strong>[xxx]</strong>被起诉时。</p>\n</blockquote>\n<p>views…statement问作者如何评价弗里德曼的说法。引语将增加利润称为企业唯一的社会责任；空格需要补作者回应这一说法时的态度。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"31题","raw":"### A. uncertainty\n\n> 不确定\n\n把A接回题干，它说的是：作者对弗里德曼的说法感到不确定。\n\nA说不确定。首段的`may not be absolutely clear-cut`确实带有保留，我们看这份保留接在什么话后面。\n\n> But even if you accept Friedman’s **[xxx]** and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut.\n\n> New research suggests that CSR may create **[xxx]** value for companies—at least when they are prosecuted for **[xxx]**.\n\n弗里德曼先把增加利润说成企业唯一的社会责任。作者随后说，即使接受这番说法，把CSR当成浪费股东的钱，事情也未必那么分明。\n\n仅读到这里，可以理解成作者觉得事情还不能定得那么死。下一句说CSR可能为企业创造某种价值，但价值前面的词仍未读懂。\n\nA暂时能接到这种未完全定下来的语气。不过，还要继续看作者是一直拿不准，还是要用后面的研究质疑前面这番说法。\n\n**只读到事情未必分明、某种价值还没读清时，能否先保留“不确定”的理解？**\n\n可以先保留。A和B的区别要看后面的研究把作者的判断带向哪里。\n\n**第一轮判断：A保留。**","articleRects":[[276,279,1120,39],[202,326,1194,38],[202,370,1194,40],[202,416,1194,39],[202,463,1194,38],[202,509,1195,38],[202,554,595,38]],"questionRects":[[280,251,210,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"31","paragraphPids":[0]},"html":"<h3>A. uncertainty</h3>\n<blockquote><p>不确定</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者对弗里德曼的说法感到不确定。</p>\n<p>A说不确定。首段的<code>may not be absolutely clear-cut</code>确实带有保留，我们看这份保留接在什么话后面。</p>\n<blockquote><p>But even if you accept Friedman’s <strong>[xxx]</strong> and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut.</p>\n</blockquote>\n<blockquote><p>New research suggests that CSR may create <strong>[xxx]</strong> value for companies—at least when they are prosecuted for <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>弗里德曼先把增加利润说成企业唯一的社会责任。作者随后说，即使接受这番说法，把CSR当成浪费股东的钱，事情也未必那么分明。</p>\n<p>仅读到这里，可以理解成作者觉得事情还不能定得那么死。下一句说CSR可能为企业创造某种价值，但价值前面的词仍未读懂。</p>\n<p>A暂时能接到这种未完全定下来的语气。不过，还要继续看作者是一直拿不准，还是要用后面的研究质疑前面这番说法。</p>\n<p><strong>只读到事情未必分明、某种价值还没读清时，能否先保留“不确定”的理解？</strong></p>\n<p>可以先保留。A和B的区别要看后面的研究把作者的判断带向哪里。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"31题","raw":"### B. skepticism\n\n> 怀疑\n\n把B接回题干，它说的是：作者对弗里德曼的说法持怀疑态度。\n\nB说怀疑。第一段的`But even if`接在弗里德曼的引语后，我们看作者是不是直接照单接受。\n\n> But even if you accept Friedman’s **[xxx]** and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut.\n\n`even if you accept`先假设读者接受那番说法，并不是作者说自己已经接受。紧跟着却说事情未必如此分明。\n\n这就给前面把CSR支出视作浪费的看法留了疑问：如果它还能给公司带来价值，就不能那么快把它当成白花钱。\n\n因此，B的怀疑可以接上作者这处回应。这里也没有必要把怀疑说成彻底否定所有追求利润的行为；作者质疑的是那种过于简单的判断。\n\n**作者先说“即使接受”，再说事情未必这样清楚，是否是在给前面的说法提出疑问？**\n\n是。B能接上这份质疑，先留下。\n\n**第一轮判断：B保留。**","articleRects":[[276,279,1120,39],[202,326,1194,38],[202,370,1194,40],[202,416,1194,39],[202,463,1194,38],[202,509,1195,38],[202,554,595,38]],"questionRects":[[280,313,201,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"31","paragraphPids":[0]},"html":"<h3>B. skepticism</h3>\n<blockquote><p>怀疑</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者对弗里德曼的说法持怀疑态度。</p>\n<p>B说怀疑。第一段的<code>But even if</code>接在弗里德曼的引语后，我们看作者是不是直接照单接受。</p>\n<blockquote><p>But even if you accept Friedman’s <strong>[xxx]</strong> and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut.</p>\n</blockquote>\n<p><code>even if you accept</code>先假设读者接受那番说法，并不是作者说自己已经接受。紧跟着却说事情未必如此分明。</p>\n<p>这就给前面把CSR支出视作浪费的看法留了疑问：如果它还能给公司带来价值，就不能那么快把它当成白花钱。</p>\n<p>因此，B的怀疑可以接上作者这处回应。这里也没有必要把怀疑说成彻底否定所有追求利润的行为；作者质疑的是那种过于简单的判断。</p>\n<p><strong>作者先说“即使接受”，再说事情未必这样清楚，是否是在给前面的说法提出疑问？</strong></p>\n<p>是。B能接上这份质疑，先留下。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"31题","raw":"### C. approval\n\n> 赞同\n\n把C接回题干，它说的是：作者赞同弗里德曼的说法。\n\nC说赞同，原句也有`accept`。我们看它前面紧接的`even if`，再看后半句。\n\n> But even if you accept Friedman’s **[xxx]** and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut.\n\n`even if you accept`是即使你接受，整个接受被放在一个假设里。主语是`you`，并没有写成作者自己赞同。\n\n后半句还说事情不一定那么简单，下一句接着提供CSR可能创造价值的研究。这是在继续检查前面的判断。\n\nC若只看见`accept`就选，会把让步假设变成作者已经表达的认可，也把`But`之后的保留丢掉。\n\n**“即使你接受这种说法”，能直接读成“作者赞同这种说法”吗？**\n\n不能。原句是假设读者接受，作者随后仍提出了保留。\n\n**第一轮判断：C排除。**","articleRects":[[276,279,1120,39],[202,326,1194,38],[202,370,1194,40],[202,416,1194,39],[202,463,1194,38],[202,509,1195,38],[202,554,595,38]],"questionRects":[[280,374,173,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"31","paragraphPids":[0]},"html":"<h3>C. approval</h3>\n<blockquote><p>赞同</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者赞同弗里德曼的说法。</p>\n<p>C说赞同，原句也有<code>accept</code>。我们看它前面紧接的<code>even if</code>，再看后半句。</p>\n<blockquote><p>But even if you accept Friedman’s <strong>[xxx]</strong> and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut.</p>\n</blockquote>\n<p><code>even if you accept</code>是即使你接受，整个接受被放在一个假设里。主语是<code>you</code>，并没有写成作者自己赞同。</p>\n<p>后半句还说事情不一定那么简单，下一句接着提供CSR可能创造价值的研究。这是在继续检查前面的判断。</p>\n<p>C若只看见<code>accept</code>就选，会把让步假设变成作者已经表达的认可，也把<code>But</code>之后的保留丢掉。</p>\n<p><strong>“即使你接受这种说法”，能直接读成“作者赞同这种说法”吗？</strong></p>\n<p>不能。原句是假设读者接受，作者随后仍提出了保留。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"31题","raw":"### D. tolerance\n\n> 容忍\n\n把D接回题干，它说的是：作者容忍弗里德曼的这种说法。\n\nD说容忍。我们回到`things may not be absolutely clear-cut`，看作者在谈允许这种说法存在，还是在判断它说得对不对。\n\n> But even if you accept Friedman’s **[xxx]** and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut.\n\n容忍通常是自己不喜欢或不赞成，但仍允许对方这样说。首段没有谈要不要准许弗里德曼发表意见。\n\n作者接过他关于利润的判断，追问CSR支出是否真是浪费，并引入可能增加价值的研究。这是在检查说法本身能否成立。\n\n所以，语气没有激烈反对，也不等于容忍。要看回应的实际内容，D说的允许或容让并未出现。\n\n**作者拿CSR可能创造价值来回应，是在容许别人这样说，还是在检查这个判断是否可靠？**\n\n是在检查判断。D的容忍没有接上这里所做的回应。\n\n**第一轮判断：D排除。**","articleRects":[[276,279,1120,39],[202,326,1194,38],[202,370,1194,40],[202,416,1194,39],[202,463,1194,38],[202,509,1195,38],[202,554,595,38]],"questionRects":[[280,435,181,31]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"31","paragraphPids":[0]},"html":"<h3>D. tolerance</h3>\n<blockquote><p>容忍</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者容忍弗里德曼的这种说法。</p>\n<p>D说容忍。我们回到<code>things may not be absolutely clear-cut</code>，看作者在谈允许这种说法存在，还是在判断它说得对不对。</p>\n<blockquote><p>But even if you accept Friedman’s <strong>[xxx]</strong> and regard corporate social responsibility (CSR) policies as a waste of shareholders’ money, things may not be absolutely clear-cut.</p>\n</blockquote>\n<p>容忍通常是自己不喜欢或不赞成，但仍允许对方这样说。首段没有谈要不要准许弗里德曼发表意见。</p>\n<p>作者接过他关于利润的判断，追问CSR支出是否真是浪费，并引入可能增加价值的研究。这是在检查说法本身能否成立。</p>\n<p>所以，语气没有激烈反对，也不等于容忍。要看回应的实际内容，D说的允许或容让并未出现。</p>\n<p><strong>作者拿CSR可能创造价值来回应，是在容许别人这样说，还是在检查这个判断是否可靠？</strong></p>\n<p>是在检查判断。D的容忍没有接上这里所做的回应。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"31题","raw":"### 31题第一次结果\n\n- A保留。\n- B保留。\n- C排除。\n- D排除。\n\n暂时保留：A、B。\n\n第一遍留下A、B。作者已对事情如此分明的判断提出保留，暂时还不能彻底分清其中是自身判断未定，还是对先前说法的质疑。","articleRects":[],"questionRects":[[226,190,983,31],[1218,222,111,7],[280,251,210,38],[280,313,201,37],[280,374,173,37],[280,435,181,31]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"31"},"html":"<h3>31题第一次结果</h3>\n<ul><li>A保留。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>暂时保留：A、B。</p>\n<p>第一遍留下A、B。作者已对事情如此分明的判断提出保留，暂时还不能彻底分清其中是自身判断未定，还是对先前说法的质疑。</p>\n"},{"section":"32题","raw":"## 32题\n\n> According to Paragraph 2, CSR helps a company by ______.  \n> 根据第二段，企业社会责任通过什么方式帮助一家公司？\n\n题干明确给出Paragraph 2，直接读第二段。从年度支出读到三种作用的末尾，完整看清每种作用涉及谁、发生什么。\n\n> 原文参考：\n> \n> The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a **[xxx]** firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a “signal” that a company’s products are of high quality. Second, customers may be willing to buy a company’s products as an indirect way to donate to the good causes it helps. And third, through a more **[xxx]** “halo effect,” whereby its good **[xxx]** earn it greater consideration from consumers and others.\n> \n> 开始精读：\n> \n> The largest firms / in America and Britain / together spend / more than $15 billion a year / on CSR, / according to an estimate by EPG, / a **[xxx]** firm. / This could add value / to their businesses / in three ways. / First, consumers may take CSR spending / as a “signal” / that a company’s products / are of high quality. / Second, customers may be willing / to buy a company’s products / as an indirect way / to donate to the good causes / it helps. / And third, / through a more **[xxx]** “halo effect,” / whereby its good **[xxx]** / earn it greater consideration / from consumers and others.\n> \n> 最大的公司 / 在美国和英国 / 合计花费 / 每年超过一百五十亿美元 / 用于企业社会责任， / 据埃皮吉公司估计， / 它是一家**[xxx]**公司。 / 这可能增加价值 / 为它们的业务 / 通过三种方式。 / 首先，消费者可能把这笔支出 / 看作一个“信号” / 表明某公司的产品 / 质量很高。 / 其次，顾客可能愿意 / 购买一家公司的产品 / 作为一种间接方式 / 为公益事业捐款 / 即该公司帮助的事业。 / 第三， / 经更**[xxx]**的光环效应， / 其良好的**[xxx]**由此 / 为它赢得更多照顾 / 来自消费者及其他人。\n\nhelps a company by问帮助公司的方式。第二段以add value to their businesses引出三种作用，选项需要表达其中建立的具体关系。\n\n接下来按A—D逐项看。","articleRects":[[274,598,1119,39],[203,645,1193,38],[202,691,1195,37],[203,735,1188,39],[202,782,1194,38],[202,826,1194,39],[202,871,1194,40],[202,919,98,30]],"questionRects":[[226,557,831,38],[280,619,512,38],[280,680,531,38],[280,741,483,38],[280,802,535,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"32","initialReadingPids":[1]},"html":"<h2>32题</h2>\n<blockquote><p>According to Paragraph 2, CSR helps a company by ______.<br />\n根据第二段，企业社会责任通过什么方式帮助一家公司？</p>\n</blockquote>\n<p>题干明确给出Paragraph 2，直接读第二段。从年度支出读到三种作用的末尾，完整看清每种作用涉及谁、发生什么。</p>\n<blockquote><p>原文参考：</p>\n<p>The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a <strong>[xxx]</strong> firm. This could add value to their businesses in three ways. First, consumers may take CSR spending as a “signal” that a company’s products are of high quality. Second, customers may be willing to buy a company’s products as an indirect way to donate to the good causes it helps. And third, through a more <strong>[xxx]</strong> “halo effect,” whereby its good <strong>[xxx]</strong> earn it greater consideration from consumers and others.</p>\n<p>开始精读：</p>\n<p>The largest firms / in America and Britain / together spend / more than $15 billion a year / on CSR, / according to an estimate by EPG, / a <strong>[xxx]</strong> firm. / This could add value / to their businesses / in three ways. / First, consumers may take CSR spending / as a “signal” / that a company’s products / are of high quality. / Second, customers may be willing / to buy a company’s products / as an indirect way / to donate to the good causes / it helps. / And third, / through a more <strong>[xxx]</strong> “halo effect,” / whereby its good <strong>[xxx]</strong> / earn it greater consideration / from consumers and others.</p>\n<p>最大的公司 / 在美国和英国 / 合计花费 / 每年超过一百五十亿美元 / 用于企业社会责任， / 据埃皮吉公司估计， / 它是一家<strong>[xxx]</strong>公司。 / 这可能增加价值 / 为它们的业务 / 通过三种方式。 / 首先，消费者可能把这笔支出 / 看作一个“信号” / 表明某公司的产品 / 质量很高。 / 其次，顾客可能愿意 / 购买一家公司的产品 / 作为一种间接方式 / 为公益事业捐款 / 即该公司帮助的事业。 / 第三， / 经更<strong>[xxx]</strong>的光环效应， / 其良好的<strong>[xxx]</strong>由此 / 为它赢得更多照顾 / 来自消费者及其他人。</p>\n</blockquote>\n<p>helps a company by问帮助公司的方式。第二段以add value to their businesses引出三种作用，选项需要表达其中建立的具体关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"32题","raw":"### A. guarding it against malpractices\n\n> 保护它免受不当行为之害\n\n把A接回题干，它说的是：企业社会责任通过防范不当行为来保护公司。\n\nA说CSR防范不当行为。第二段列了三种好处，我们顺着`First`、`Second`、`third`看每一种怎样产生。\n\n> This could add value to their businesses in three ways.\n\n> First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.\n\n> Second, customers may be willing to buy a company’s products as an indirect way to donate to the good causes it helps.\n\n> And third, through a more **[xxx]** “halo effect,” whereby its good **[xxx]** earn it greater consideration from consumers and others.\n\n第一种是消费者把支出看成产品质量好的信号；第二种是顾客通过购买支持公益；第三种是好表现使公司得到更多照顾。\n\n三处都在写别人怎样看待公司、为什么买产品或给予照顾。没有一处说CSR让员工不再做不当行为，或阻止外界的不当行为伤害公司。\n\nA加了一道防范作用。公司得到好处，并不等于它因此被保护得不会遇到或发生不当行为。\n\n**原文三种好处说明了别人更愿意相信、购买或照顾公司，是否还说明CSR能防范不当行为？**\n\n没有。A把这些好处换成了未写出的防范作用。\n\n**第一轮判断：A排除。**","articleRects":[[274,598,1119,39],[203,645,1193,38],[202,691,1195,37],[203,735,1188,39],[202,782,1194,38],[202,826,1194,39],[202,871,1194,40],[202,919,98,30]],"questionRects":[[280,619,512,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"32","paragraphPids":[1]},"html":"<h3>A. guarding it against malpractices</h3>\n<blockquote><p>保护它免受不当行为之害</p>\n</blockquote>\n<p>把A接回题干，它说的是：企业社会责任通过防范不当行为来保护公司。</p>\n<p>A说CSR防范不当行为。第二段列了三种好处，我们顺着<code>First</code>、<code>Second</code>、<code>third</code>看每一种怎样产生。</p>\n<blockquote><p>This could add value to their businesses in three ways.</p>\n</blockquote>\n<blockquote><p>First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.</p>\n</blockquote>\n<blockquote><p>Second, customers may be willing to buy a company’s products as an indirect way to donate to the good causes it helps.</p>\n</blockquote>\n<blockquote><p>And third, through a more <strong>[xxx]</strong> “halo effect,” whereby its good <strong>[xxx]</strong> earn it greater consideration from consumers and others.</p>\n</blockquote>\n<p>第一种是消费者把支出看成产品质量好的信号；第二种是顾客通过购买支持公益；第三种是好表现使公司得到更多照顾。</p>\n<p>三处都在写别人怎样看待公司、为什么买产品或给予照顾。没有一处说CSR让员工不再做不当行为，或阻止外界的不当行为伤害公司。</p>\n<p>A加了一道防范作用。公司得到好处，并不等于它因此被保护得不会遇到或发生不当行为。</p>\n<p><strong>原文三种好处说明了别人更愿意相信、购买或照顾公司，是否还说明CSR能防范不当行为？</strong></p>\n<p>没有。A把这些好处换成了未写出的防范作用。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"32题","raw":"### B. protecting it from being defamed\n\n> 保护它免受诽谤\n\n把B接回题干，它说的是：企业社会责任通过保护公司免受诽谤来帮助公司。\n\nB说保护公司免受诽谤。原文谈消费者认为产品质量高，又谈得到更多照顾，我们看其中有没有恶意造谣这一件事。\n\n> First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.\n\n> And third, through a more **[xxx]** “halo effect,” whereby its good **[xxx]** earn it greater consideration from consumers and others.\n\n消费者见到CSR支出，就可能把产品往质量好的方向想；好的表现还可能让别人更照顾公司。这都能改善别人对公司的看法。\n\n但诽谤是有人散布损害名誉的虚假说法。原段没有出现这类人和说法，也没有解释CSR如何阻止他们。\n\n对公司印象较好，和公司因此免受诽谤，不是同一层事情。B把原文写的好印象扩成了一种防护能力。\n\n**消费者觉得公司较可信，就能说明它不会受到他人的诽谤吗？**\n\n不能。原文没有讨论诽谤及其防范，B多加了这一作用。\n\n**第一轮判断：B排除。**","articleRects":[[274,598,1119,39],[203,645,1193,38],[202,691,1195,37],[203,735,1188,39],[202,782,1194,38],[202,826,1194,39],[202,871,1194,40],[202,919,98,30]],"questionRects":[[280,680,531,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"32","paragraphPids":[1]},"html":"<h3>B. protecting it from being defamed</h3>\n<blockquote><p>保护它免受诽谤</p>\n</blockquote>\n<p>把B接回题干，它说的是：企业社会责任通过保护公司免受诽谤来帮助公司。</p>\n<p>B说保护公司免受诽谤。原文谈消费者认为产品质量高，又谈得到更多照顾，我们看其中有没有恶意造谣这一件事。</p>\n<blockquote><p>First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.</p>\n</blockquote>\n<blockquote><p>And third, through a more <strong>[xxx]</strong> “halo effect,” whereby its good <strong>[xxx]</strong> earn it greater consideration from consumers and others.</p>\n</blockquote>\n<p>消费者见到CSR支出，就可能把产品往质量好的方向想；好的表现还可能让别人更照顾公司。这都能改善别人对公司的看法。</p>\n<p>但诽谤是有人散布损害名誉的虚假说法。原段没有出现这类人和说法，也没有解释CSR如何阻止他们。</p>\n<p>对公司印象较好，和公司因此免受诽谤，不是同一层事情。B把原文写的好印象扩成了一种防护能力。</p>\n<p><strong>消费者觉得公司较可信，就能说明它不会受到他人的诽谤吗？</strong></p>\n<p>不能。原文没有讨论诽谤及其防范，B多加了这一作用。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"32题","raw":"### C. winning trust from consumers\n\n> 赢得消费者的信任\n\n把C接回题干，它说的是：企业社会责任通过赢得消费者的信任来帮助公司。\n\nC说赢得消费者信任。第一种好处直接写消费者把CSR支出当成质量信号，我们把这个信号在消费者心中意味着什么读出来。\n\n> First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.\n\n消费者看到公司投入社会责任，就可能认为这家公司的产品质量高。原文没有要求他们先检验产品，而是说这笔支出本身被当作一个信号。\n\n这样，CSR使消费者更愿意相信公司的产品。C的`winning trust`正是把消费者这种相信说出来。\n\n这不等于产品真的因支出而改变，而是消费者对它的判断变得积极，C保留的是人的信任。\n\n**消费者把社会责任支出看作产品质量好的信号，是否说明这种支出能帮助公司获得信任？**\n\n是。信任来自消费者对质量的判断，C留下。\n\n**第一轮判断：C保留。**","articleRects":[[274,598,1119,39],[203,645,1193,38],[202,691,1195,37],[203,735,1188,39],[202,782,1194,38],[202,826,1194,39],[202,871,1194,40],[202,919,98,30]],"questionRects":[[280,741,483,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"32","paragraphPids":[1]},"html":"<h3>C. winning trust from consumers</h3>\n<blockquote><p>赢得消费者的信任</p>\n</blockquote>\n<p>把C接回题干，它说的是：企业社会责任通过赢得消费者的信任来帮助公司。</p>\n<p>C说赢得消费者信任。第一种好处直接写消费者把CSR支出当成质量信号，我们把这个信号在消费者心中意味着什么读出来。</p>\n<blockquote><p>First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.</p>\n</blockquote>\n<p>消费者看到公司投入社会责任，就可能认为这家公司的产品质量高。原文没有要求他们先检验产品，而是说这笔支出本身被当作一个信号。</p>\n<p>这样，CSR使消费者更愿意相信公司的产品。C的<code>winning trust</code>正是把消费者这种相信说出来。</p>\n<p>这不等于产品真的因支出而改变，而是消费者对它的判断变得积极，C保留的是人的信任。</p>\n<p><strong>消费者把社会责任支出看作产品质量好的信号，是否说明这种支出能帮助公司获得信任？</strong></p>\n<p>是。信任来自消费者对质量的判断，C留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"32题","raw":"### D. raising the quality of its products\n\n> 提高其产品质量\n\n把D接回题干，它说的是：企业社会责任通过提高公司产品质量来帮助它。\n\nD说产品质量被提高。第一种好处也有`high quality`，但它在`consumers may take ... as a signal`后面，我们先看是谁发生了变化。\n\n> First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.\n\n原文是消费者把支出理解为质量好的信号。发生的是消费者的看法，不是工厂改进了工艺、产品质量因此上升。\n\n而且`are of high quality`说消费者认为质量高，D的`raising`则要求质量比以前更高。原句没有提供前后质量比较。\n\n把支出看成好质量的迹象，不能接成这笔支出真的提高了质量。D把消费者相信的内容当作实际改善。\n\n**消费者认为产品质量高，是否就证明CSR把产品质量提高了？**\n\n不证明。原句只写质量判断的信号，没有写质量的实际提高。\n\n**第一轮判断：D排除。**","articleRects":[[274,598,1119,39],[203,645,1193,38],[202,691,1195,37],[203,735,1188,39],[202,782,1194,38],[202,826,1194,39],[202,871,1194,40],[202,919,98,30]],"questionRects":[[280,802,535,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"32","paragraphPids":[1]},"html":"<h3>D. raising the quality of its products</h3>\n<blockquote><p>提高其产品质量</p>\n</blockquote>\n<p>把D接回题干，它说的是：企业社会责任通过提高公司产品质量来帮助它。</p>\n<p>D说产品质量被提高。第一种好处也有<code>high quality</code>，但它在<code>consumers may take ... as a signal</code>后面，我们先看是谁发生了变化。</p>\n<blockquote><p>First, consumers may take CSR spending as a “signal” that a company’s products are of high quality.</p>\n</blockquote>\n<p>原文是消费者把支出理解为质量好的信号。发生的是消费者的看法，不是工厂改进了工艺、产品质量因此上升。</p>\n<p>而且<code>are of high quality</code>说消费者认为质量高，D的<code>raising</code>则要求质量比以前更高。原句没有提供前后质量比较。</p>\n<p>把支出看成好质量的迹象，不能接成这笔支出真的提高了质量。D把消费者相信的内容当作实际改善。</p>\n<p><strong>消费者认为产品质量高，是否就证明CSR把产品质量提高了？</strong></p>\n<p>不证明。原句只写质量判断的信号，没有写质量的实际提高。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"32题","raw":"### 32题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一遍留下C。第二段写消费者把社会责任支出视为高质量信号，能支持赢得消费者信任。","articleRects":[],"questionRects":[[226,557,831,38],[280,619,512,38],[280,680,531,38],[280,741,483,38],[280,802,535,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"32"},"html":"<h3>32题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍留下C。第二段写消费者把社会责任支出视为高质量信号，能支持赢得消费者信任。</p>\n"},{"section":"33题","raw":"## 33题\n\n> The expression “more lenient” (Line 2, Para. 4) is closest in meaning to ______.  \n> 第四段第二行的more lenient在意思上最接近什么？\n\n题干给出more lenient和Para. 4，直接定位第四段。把发现和随后排除政治影响的解释一并读完，看这个词修饰什么、后文如何说明它。\n\n> 原文参考：\n> \n> The study found that, among prosecuted firms, those with the most **[xxx]** CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms’ political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political **[xxx]** did not receive lower fines.\n> \n> 开始精读：\n> \n> The study found that, / among prosecuted firms, / those with the most **[xxx]** / CSR programmes / tended to get more lenient penalties. / Their analysis ruled out the possibility / that it was firms’ political influence, / rather than their CSR stand, / that accounted for the leniency: / Companies that contributed more / to political **[xxx]** / did not receive lower fines.\n> \n> 这项研究发现， / 在被起诉的公司中， / 那些具有最**[xxx]**的 / 企业社会责任计划的公司 / 往往受到更宽大的处罚。 / 其分析排除了这一可能 / 即是公司的政治影响力， / 而非其社会责任立场， / 导致了这种宽大处理： / 那些贡献更多的公司 / 向政治**[xxx]** / 并未获得更低的罚款。\n\nmore lenient修饰penalties，题目要找对这种处罚特点的近义表达。要把它放回被起诉公司受处罚的句子，再连上后面leniency和fines的解释。\n\n接下来按A—D逐项看。","articleRects":[[274,1237,1122,38],[202,1283,1195,37],[203,1328,1193,38],[202,1374,1194,37],[202,1419,820,38]],"questionRects":[[226,923,1195,40],[281,990,32,26],[281,1047,298,31],[281,1109,228,37],[281,1170,258,30],[281,1231,206,30]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"33","initialReadingPids":[3]},"html":"<h2>33题</h2>\n<blockquote><p>The expression “more lenient” (Line 2, Para. 4) is closest in meaning to ______.<br />\n第四段第二行的more lenient在意思上最接近什么？</p>\n</blockquote>\n<p>题干给出more lenient和Para. 4，直接定位第四段。把发现和随后排除政治影响的解释一并读完，看这个词修饰什么、后文如何说明它。</p>\n<blockquote><p>原文参考：</p>\n<p>The study found that, among prosecuted firms, those with the most <strong>[xxx]</strong> CSR programmes tended to get more lenient penalties. Their analysis ruled out the possibility that it was firms’ political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political <strong>[xxx]</strong> did not receive lower fines.</p>\n<p>开始精读：</p>\n<p>The study found that, / among prosecuted firms, / those with the most <strong>[xxx]</strong> / CSR programmes / tended to get more lenient penalties. / Their analysis ruled out the possibility / that it was firms’ political influence, / rather than their CSR stand, / that accounted for the leniency: / Companies that contributed more / to political <strong>[xxx]</strong> / did not receive lower fines.</p>\n<p>这项研究发现， / 在被起诉的公司中， / 那些具有最<strong>[xxx]</strong>的 / 企业社会责任计划的公司 / 往往受到更宽大的处罚。 / 其分析排除了这一可能 / 即是公司的政治影响力， / 而非其社会责任立场， / 导致了这种宽大处理： / 那些贡献更多的公司 / 向政治<strong>[xxx]</strong> / 并未获得更低的罚款。</p>\n</blockquote>\n<p>more lenient修饰penalties，题目要找对这种处罚特点的近义表达。要把它放回被起诉公司受处罚的句子，再连上后面leniency和fines的解释。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"33题","raw":"### A. less controversial\n\n> 争议更少的\n\n把A接回题干，它说的是：more lenient penalties就是争议更少的处罚。\n\nA说处罚争议更少。我们把它放回`penalties`前面，再读后面的`leniency`如何被解释。\n\n> those with the most **[xxx]** CSR programmes tended to get more lenient penalties.\n\n> Their analysis ruled out the possibility that it was firms’ political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political **[xxx]** did not receive lower fines.\n\n研究要排除政治影响导致这种处罚的可能。它给的检验是，政治捐助更多的公司并没有得到`lower fines`，更低的罚款。\n\n所以，它在比较处罚负担轻不轻，而不是判决有多少人同意、是否引起争论。\n\nA的`controversial`要看意见分歧，原段没有提供这种信息。罚款金额低，也不能自然等于争议少。\n\n**后文用更低罚款来检查的，是处罚轻重，还是围绕处罚的争议多少？**\n\n是处罚轻重。A的争议多少没有接上解释。\n\n**第一轮判断：A排除。**","articleRects":[[274,1237,1122,38],[202,1283,1195,37],[203,1328,1193,38],[202,1374,1194,37],[202,1419,820,38]],"questionRects":[[281,1047,298,31]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"33","paragraphPids":[3]},"html":"<h3>A. less controversial</h3>\n<blockquote><p>争议更少的</p>\n</blockquote>\n<p>把A接回题干，它说的是：more lenient penalties就是争议更少的处罚。</p>\n<p>A说处罚争议更少。我们把它放回<code>penalties</code>前面，再读后面的<code>leniency</code>如何被解释。</p>\n<blockquote><p>those with the most <strong>[xxx]</strong> CSR programmes tended to get more lenient penalties.</p>\n</blockquote>\n<blockquote><p>Their analysis ruled out the possibility that it was firms’ political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political <strong>[xxx]</strong> did not receive lower fines.</p>\n</blockquote>\n<p>研究要排除政治影响导致这种处罚的可能。它给的检验是，政治捐助更多的公司并没有得到<code>lower fines</code>，更低的罚款。</p>\n<p>所以，它在比较处罚负担轻不轻，而不是判决有多少人同意、是否引起争论。</p>\n<p>A的<code>controversial</code>要看意见分歧，原段没有提供这种信息。罚款金额低，也不能自然等于争议少。</p>\n<p><strong>后文用更低罚款来检查的，是处罚轻重，还是围绕处罚的争议多少？</strong></p>\n<p>是处罚轻重。A的争议多少没有接上解释。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"33题","raw":"### B. more lasting\n\n> 持续更久的\n\n把B接回题干，它说的是：more lenient表示处罚持续得更久。\n\nB说处罚持续更久。题干词修饰`penalties`，我们再看后文有没有处罚期限。\n\n> those with the most **[xxx]** CSR programmes tended to get more lenient penalties.\n\n> Their analysis ruled out the possibility that it was firms’ political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political **[xxx]** did not receive lower fines.\n\n后面的解释谈政治贡献多的公司是否拿到较低罚款，比较的是金额。\n\n如果B的持续更久正确，后面应该能看到期限、持续时间等说明。但这里没有比较处罚执行多少天或多少年。\n\n因此，不能仅凭处罚也可能持续一段时间，就把`more lenient`读成时间更长。段内已有的解释把我们带向金额轻重。\n\n**段内解释说的是罚款高低，还是处罚持续时间长短？**\n\n是罚款高低。B的时间更长对不上。\n\n**第一轮判断：B排除。**","articleRects":[[274,1237,1122,38],[202,1283,1195,37],[203,1328,1193,38],[202,1374,1194,37],[202,1419,820,38]],"questionRects":[[281,1109,228,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"33","paragraphPids":[3]},"html":"<h3>B. more lasting</h3>\n<blockquote><p>持续更久的</p>\n</blockquote>\n<p>把B接回题干，它说的是：more lenient表示处罚持续得更久。</p>\n<p>B说处罚持续更久。题干词修饰<code>penalties</code>，我们再看后文有没有处罚期限。</p>\n<blockquote><p>those with the most <strong>[xxx]</strong> CSR programmes tended to get more lenient penalties.</p>\n</blockquote>\n<blockquote><p>Their analysis ruled out the possibility that it was firms’ political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political <strong>[xxx]</strong> did not receive lower fines.</p>\n</blockquote>\n<p>后面的解释谈政治贡献多的公司是否拿到较低罚款，比较的是金额。</p>\n<p>如果B的持续更久正确，后面应该能看到期限、持续时间等说明。但这里没有比较处罚执行多少天或多少年。</p>\n<p>因此，不能仅凭处罚也可能持续一段时间，就把<code>more lenient</code>读成时间更长。段内已有的解释把我们带向金额轻重。</p>\n<p><strong>段内解释说的是罚款高低，还是处罚持续时间长短？</strong></p>\n<p>是罚款高低。B的时间更长对不上。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"33题","raw":"### C. more effective\n\n> 更有效的\n\n把C接回题干，它说的是：more lenient指处罚更有效。\n\nC说处罚更有效。我们看`accounted for the leniency`后面用什么结果说明这种处罚。\n\n> those with the most **[xxx]** CSR programmes tended to get more lenient penalties.\n\n> Their analysis ruled out the possibility that it was firms’ political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political **[xxx]** did not receive lower fines.\n\n研究比较了政治捐助与较低罚款，目的是判断宽待是不是来自政治影响。这里仍然围绕处罚代价。\n\n要说处罚更有效，还得知道它是否更能制止违法、促成改正或实现其他处罚目的。原段没有评价这些后续效果。\n\n罚得轻或重，与效果好不好需要分开。C把本段实际比较的金额换成了处罚成效。\n\n**知道公司罚款较低，就已经知道处罚更有效了吗？**\n\n不知道。原文没有报告处罚的改正或预防效果，C接不上。\n\n**第一轮判断：C排除。**","articleRects":[[274,1237,1122,38],[202,1283,1195,37],[203,1328,1193,38],[202,1374,1194,37],[202,1419,820,38]],"questionRects":[[281,1170,258,30]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"33","paragraphPids":[3]},"html":"<h3>C. more effective</h3>\n<blockquote><p>更有效的</p>\n</blockquote>\n<p>把C接回题干，它说的是：more lenient指处罚更有效。</p>\n<p>C说处罚更有效。我们看<code>accounted for the leniency</code>后面用什么结果说明这种处罚。</p>\n<blockquote><p>those with the most <strong>[xxx]</strong> CSR programmes tended to get more lenient penalties.</p>\n</blockquote>\n<blockquote><p>Their analysis ruled out the possibility that it was firms’ political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political <strong>[xxx]</strong> did not receive lower fines.</p>\n</blockquote>\n<p>研究比较了政治捐助与较低罚款，目的是判断宽待是不是来自政治影响。这里仍然围绕处罚代价。</p>\n<p>要说处罚更有效，还得知道它是否更能制止违法、促成改正或实现其他处罚目的。原段没有评价这些后续效果。</p>\n<p>罚得轻或重，与效果好不好需要分开。C把本段实际比较的金额换成了处罚成效。</p>\n<p><strong>知道公司罚款较低，就已经知道处罚更有效了吗？</strong></p>\n<p>不知道。原文没有报告处罚的改正或预防效果，C接不上。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"33题","raw":"### D. less severe\n\n> 较轻的；不那么严厉的\n\n把D接回题干，它说的是：more lenient penalties是较轻、不那么严厉的处罚。\n\nD说不那么严厉。后文的`lower fines`可以帮助我们理解前面的`more lenient penalties`，注意它是在排除哪一种解释。\n\n> those with the most **[xxx]** CSR programmes tended to get more lenient penalties.\n\n> Their analysis ruled out the possibility that it was firms’ political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political **[xxx]** did not receive lower fines.\n\n研究先发现某些CSR项目较突出的公司受到这种处罚，再检查是不是政治影响造成的。政治贡献更多的公司却没有拿到更低罚款，所以这项替代解释被排除了。\n\n虽然最后一句带着`did not`，否定的是政治捐助能够带来低罚款；它仍用罚款较低来具体说明前面的宽待。\n\n处罚要付出的金额更低，就是负担较轻、不那么严厉。D放回句子后能与后面的金额解释相接。\n\n**后文用低罚款来说明的宽待，是否对应处罚不那么严厉？**\n\n是。D说的轻重正是段内比较的事情。\n\n**第一轮判断：D保留。**","articleRects":[[274,1237,1122,38],[202,1283,1195,37],[203,1328,1193,38],[202,1374,1194,37],[202,1419,820,38]],"questionRects":[[281,1231,206,30]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"33","paragraphPids":[3]},"html":"<h3>D. less severe</h3>\n<blockquote><p>较轻的；不那么严厉的</p>\n</blockquote>\n<p>把D接回题干，它说的是：more lenient penalties是较轻、不那么严厉的处罚。</p>\n<p>D说不那么严厉。后文的<code>lower fines</code>可以帮助我们理解前面的<code>more lenient penalties</code>，注意它是在排除哪一种解释。</p>\n<blockquote><p>those with the most <strong>[xxx]</strong> CSR programmes tended to get more lenient penalties.</p>\n</blockquote>\n<blockquote><p>Their analysis ruled out the possibility that it was firms’ political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political <strong>[xxx]</strong> did not receive lower fines.</p>\n</blockquote>\n<p>研究先发现某些CSR项目较突出的公司受到这种处罚，再检查是不是政治影响造成的。政治贡献更多的公司却没有拿到更低罚款，所以这项替代解释被排除了。</p>\n<p>虽然最后一句带着<code>did not</code>，否定的是政治捐助能够带来低罚款；它仍用罚款较低来具体说明前面的宽待。</p>\n<p>处罚要付出的金额更低，就是负担较轻、不那么严厉。D放回句子后能与后面的金额解释相接。</p>\n<p><strong>后文用低罚款来说明的宽待，是否对应处罚不那么严厉？</strong></p>\n<p>是。D说的轻重正是段内比较的事情。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"33题","raw":"### 33题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍留下D。段内以lower fines说明处罚轻重，more lenient对应较轻、不那么严厉。","articleRects":[],"questionRects":[[226,923,1195,40],[281,990,32,26],[281,1047,298,31],[281,1109,228,37],[281,1170,258,30],[281,1231,206,30]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"33"},"html":"<h3>33题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍留下D。段内以lower fines说明处罚轻重，more lenient对应较轻、不那么严厉。</p>\n"},{"section":"34题","raw":"## 34题\n\n> When prosecutors evaluate a case, a company’s CSR record ______.  \n> 当检察官评估案件时，一家公司的企业社会责任记录会怎样？\n\n题干给出prosecutors evaluate a case，第五段开头正写检察官应如何evaluate a case，随后提到公司的record in CSR。先把第五段的结论与后面研究人员给出的数字全部读完。\n\n> 原文参考：\n> \n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR. “We estimate that either eliminating a **[xxx]** labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for **[xxx]** foreign officials,” says one researcher.\n> \n> 开始精读：\n> \n> In all, / the study concludes that / whereas prosecutors should only evaluate / a case based on its merits, / they do seem to be influenced / by a company’s record in CSR. / “We estimate that / either eliminating a **[xxx]** labour-rights concern, / such as child labour, / or increasing corporate giving / by about 20% / results in fines / that generally are 40% lower / than the typical punishment / for **[xxx]** foreign officials,” / says one researcher.\n> \n> 总之， / 研究得出结论 / 尽管检察官应当只评判 / 案件本身的是非， / 他们确实似乎受到影响 / 来自公司的社会责任记录。 / “我们估计 / 消除某**[xxx]**劳工权益问题， / 例如童工， / 或者增加企业捐赠 / 大约20% / 都会导致罚款 / 通常降低40% / 相比通常的处罚 / 针对**[xxx]**外国官员，” / 一名研究人员说。\n\n题目把检察官评估案件作为情境，问公司的社会责任记录在其中起什么作用。要分清原文说检察官应该依据什么，以及实际上受到什么影响。\n\n接下来按A—D逐项看。","articleRects":[[274,1465,1122,37],[202,1510,1194,38],[202,1554,1189,39],[203,1601,1193,38],[202,1647,1194,37],[202,1691,460,39]],"questionRects":[[226,1353,943,38],[281,1414,539,31],[280,1476,507,38],[280,1537,626,38],[280,1598,562,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"34","initialReadingPids":[4]},"html":"<h2>34题</h2>\n<blockquote><p>When prosecutors evaluate a case, a company’s CSR record ______.<br />\n当检察官评估案件时，一家公司的企业社会责任记录会怎样？</p>\n</blockquote>\n<p>题干给出prosecutors evaluate a case，第五段开头正写检察官应如何evaluate a case，随后提到公司的record in CSR。先把第五段的结论与后面研究人员给出的数字全部读完。</p>\n<blockquote><p>原文参考：</p>\n<p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR. “We estimate that either eliminating a <strong>[xxx]</strong> labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for <strong>[xxx]</strong> foreign officials,” says one researcher.</p>\n<p>开始精读：</p>\n<p>In all, / the study concludes that / whereas prosecutors should only evaluate / a case based on its merits, / they do seem to be influenced / by a company’s record in CSR. / “We estimate that / either eliminating a <strong>[xxx]</strong> labour-rights concern, / such as child labour, / or increasing corporate giving / by about 20% / results in fines / that generally are 40% lower / than the typical punishment / for <strong>[xxx]</strong> foreign officials,” / says one researcher.</p>\n<p>总之， / 研究得出结论 / 尽管检察官应当只评判 / 案件本身的是非， / 他们确实似乎受到影响 / 来自公司的社会责任记录。 / “我们估计 / 消除某<strong>[xxx]</strong>劳工权益问题， / 例如童工， / 或者增加企业捐赠 / 大约20% / 都会导致罚款 / 通常降低40% / 相比通常的处罚 / 针对<strong>[xxx]</strong>外国官员，” / 一名研究人员说。</p>\n</blockquote>\n<p>题目把检察官评估案件作为情境，问公司的社会责任记录在其中起什么作用。要分清原文说检察官应该依据什么，以及实际上受到什么影响。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"34题","raw":"### A. comes across as reliable evidence\n\n> 显得像是可靠的证据\n\n把A接回题干，它说的是：检察官评估案件时，公司的社会责任记录显得像可靠的证据。\n\nA说CSR记录是可靠证据。后面也有`evidence of good character`，我们回到第5段，分清它证明品行还是证明本案事实。\n\n> 原文参考：\n> \n> Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are **[xxx]** on the halo effect, rather than the other possible benefits, when they decide their **[xxx]** policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.\n> \n> 开始精读：\n> \n> Researchers admit that / their study does not answer / the question of / how much businesses ought to spend / on CSR. / Nor does it reveal / how much companies are **[xxx]** / on the halo effect, / rather than the other possible benefits, / when they decide their **[xxx]** policies. / But at least / they have demonstrated that / when companies get into trouble / with the law, / evidence of good character / can win them / a less costly punishment.\n> \n> 研究人员承认 / 他们的研究没有回答 / 这一问题 / 企业应该花费多少 / 用于企业社会责任。 / 它也没有揭示 / 公司有多大程度**[xxx]** / 在光环效应上， / 而非其他可能的好处， / 当它们决定其**[xxx]**政策时。 / 但至少 / 他们已经证明 / 当公司陷入麻烦 / 涉及法律时， / 良好品行的证据 / 能为它们争取 / 代价较低的处罚。\n\n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR.\n\n> But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.\n\n检察官应当只按案件本身的是非评估，研究却发现他们受到CSR记录影响。`whereas`把应有依据和实际影响分开了。\n\n末段的良好品行证据，说明公司平时有怎样的表现，并且这种印象能帮助它减轻处罚。它没有因此成为证明当前案件是非的可靠材料。\n\nA把“能影响决定”说成“可靠证据”，多出了一份对其证明作用的肯定。公司平时做过好事，不等于本案事实就由这些好事证明。\n\n**良好品行能使处罚减轻，就等于CSR记录是评判本案事实的可靠证据吗？**\n\n不等于。原文恰好把案件本身与CSR造成的额外影响分开。\n\n**第一轮判断：A排除。**","articleRects":[[274,1465,1122,37],[202,1510,1194,38],[202,1554,1189,39],[203,1601,1193,38],[202,1647,1194,37],[202,1691,460,39],[274,1738,1122,38],[202,1783,1194,38],[202,1829,1194,38],[202,1874,1193,38],[202,1920,1194,37],[203,1965,366,38]],"questionRects":[[281,1414,539,31]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"34","initialReadingPids":[5],"paragraphPids":[4,5]},"html":"<h3>A. comes across as reliable evidence</h3>\n<blockquote><p>显得像是可靠的证据</p>\n</blockquote>\n<p>把A接回题干，它说的是：检察官评估案件时，公司的社会责任记录显得像可靠的证据。</p>\n<p>A说CSR记录是可靠证据。后面也有<code>evidence of good character</code>，我们回到第5段，分清它证明品行还是证明本案事实。</p>\n<blockquote><p>原文参考：</p>\n<p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR. Nor does it reveal how much companies are <strong>[xxx]</strong> on the halo effect, rather than the other possible benefits, when they decide their <strong>[xxx]</strong> policies. But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n<p>开始精读：</p>\n<p>Researchers admit that / their study does not answer / the question of / how much businesses ought to spend / on CSR. / Nor does it reveal / how much companies are <strong>[xxx]</strong> / on the halo effect, / rather than the other possible benefits, / when they decide their <strong>[xxx]</strong> policies. / But at least / they have demonstrated that / when companies get into trouble / with the law, / evidence of good character / can win them / a less costly punishment.</p>\n<p>研究人员承认 / 他们的研究没有回答 / 这一问题 / 企业应该花费多少 / 用于企业社会责任。 / 它也没有揭示 / 公司有多大程度<strong>[xxx]</strong> / 在光环效应上， / 而非其他可能的好处， / 当它们决定其<strong>[xxx]</strong>政策时。 / 但至少 / 他们已经证明 / 当公司陷入麻烦 / 涉及法律时， / 良好品行的证据 / 能为它们争取 / 代价较低的处罚。</p>\n</blockquote>\n<blockquote><p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR.</p>\n</blockquote>\n<blockquote><p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<p>检察官应当只按案件本身的是非评估，研究却发现他们受到CSR记录影响。<code>whereas</code>把应有依据和实际影响分开了。</p>\n<p>末段的良好品行证据，说明公司平时有怎样的表现，并且这种印象能帮助它减轻处罚。它没有因此成为证明当前案件是非的可靠材料。</p>\n<p>A把“能影响决定”说成“可靠证据”，多出了一份对其证明作用的肯定。公司平时做过好事，不等于本案事实就由这些好事证明。</p>\n<p><strong>良好品行能使处罚减轻，就等于CSR记录是评判本案事实的可靠证据吗？</strong></p>\n<p>不等于。原文恰好把案件本身与CSR造成的额外影响分开。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"34题","raw":"### B. has an impact on their decision\n\n> 会影响他们的决定\n\n把B接回题干，它说的是：检察官评估案件时，公司的社会责任记录会影响他们的决定。\n\nB说CSR记录影响决定。第5段的`they do seem to be influenced by`直接写了影响，我们把`they`和`by`后面各自接出来。\n\n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR.\n\n`they`是前面的检察官；`by`后面是公司的CSR记录。也就是检察官在评估案件时，确实似乎受到这份记录影响。\n\n前半句说他们应只看案件本身，这是应当怎样；后半句写研究发现的实际情况。题干问记录会怎样，要把后半句接上。\n\nB只说影响决定，没有把这种影响说成必然决定所有结果，也没有宣称这种做法理所当然。\n\n**CSR记录使检察官的案件评估受到影响，是否就是B说的影响他们的决定？**\n\n是。B直接保留了原句的影响关系。\n\n**第一轮判断：B保留。**","articleRects":[[274,1465,1122,37],[202,1510,1194,38],[202,1554,1189,39],[203,1601,1193,38],[202,1647,1194,37],[202,1691,460,39]],"questionRects":[[280,1476,507,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"34","paragraphPids":[4]},"html":"<h3>B. has an impact on their decision</h3>\n<blockquote><p>会影响他们的决定</p>\n</blockquote>\n<p>把B接回题干，它说的是：检察官评估案件时，公司的社会责任记录会影响他们的决定。</p>\n<p>B说CSR记录影响决定。第5段的<code>they do seem to be influenced by</code>直接写了影响，我们把<code>they</code>和<code>by</code>后面各自接出来。</p>\n<blockquote><p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR.</p>\n</blockquote>\n<p><code>they</code>是前面的检察官；<code>by</code>后面是公司的CSR记录。也就是检察官在评估案件时，确实似乎受到这份记录影响。</p>\n<p>前半句说他们应只看案件本身，这是应当怎样；后半句写研究发现的实际情况。题干问记录会怎样，要把后半句接上。</p>\n<p>B只说影响决定，没有把这种影响说成必然决定所有结果，也没有宣称这种做法理所当然。</p>\n<p><strong>CSR记录使检察官的案件评估受到影响，是否就是B说的影响他们的决定？</strong></p>\n<p>是。B直接保留了原句的影响关系。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"34题","raw":"### C. increases the chance of being penalized\n\n> 增加受到处罚的可能性\n\n把C接回题干，它说的是：公司社会责任记录使它更可能受到处罚。\n\nC说更可能受到处罚。第4段从`among prosecuted firms`开始，末段又说`less costly punishment`，我们看研究比较了什么。\n\n> The study found that, among prosecuted firms, those with the most **[xxx]** CSR programmes tended to get more lenient penalties.\n\n> But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.\n\n第4段已经把对象限定在被起诉的公司，比较的是这些公司受到怎样的处罚。末段也说良好品行能争取代价较低的处罚。\n\n这里轻重发生变化，不是研究CSR使公司更容易进入处罚程序。C的`chance of being penalized`需要比较被罚与不被罚的可能性。\n\n而且，原文发现的好处是处罚负担更低，不能改成CSR增加遭处罚的风险。\n\n**原文说的是已经涉案后处罚代价更低，还是CSR让公司更可能被处罚？**\n\n是前者。C把处罚轻重换成了处罚发生的可能性。\n\n**第一轮判断：C排除。**","articleRects":[[274,1237,1122,38],[202,1283,1195,37],[203,1328,1193,38],[202,1374,1194,37],[202,1419,820,38],[274,1738,1122,38],[202,1783,1194,38],[202,1829,1194,38],[202,1874,1193,38],[202,1920,1194,37],[203,1965,366,38]],"questionRects":[[280,1537,626,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"34","paragraphPids":[3,5]},"html":"<h3>C. increases the chance of being penalized</h3>\n<blockquote><p>增加受到处罚的可能性</p>\n</blockquote>\n<p>把C接回题干，它说的是：公司社会责任记录使它更可能受到处罚。</p>\n<p>C说更可能受到处罚。第4段从<code>among prosecuted firms</code>开始，末段又说<code>less costly punishment</code>，我们看研究比较了什么。</p>\n<blockquote><p>The study found that, among prosecuted firms, those with the most <strong>[xxx]</strong> CSR programmes tended to get more lenient penalties.</p>\n</blockquote>\n<blockquote><p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<p>第4段已经把对象限定在被起诉的公司，比较的是这些公司受到怎样的处罚。末段也说良好品行能争取代价较低的处罚。</p>\n<p>这里轻重发生变化，不是研究CSR使公司更容易进入处罚程序。C的<code>chance of being penalized</code>需要比较被罚与不被罚的可能性。</p>\n<p>而且，原文发现的好处是处罚负担更低，不能改成CSR增加遭处罚的风险。</p>\n<p><strong>原文说的是已经涉案后处罚代价更低，还是CSR让公司更可能被处罚？</strong></p>\n<p>是前者。C把处罚轻重换成了处罚发生的可能性。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"34题","raw":"### D. constitutes part of the investigation\n\n> 构成调查的一部分\n\n把D接回题干，它说的是：公司社会责任记录构成检察官调查的一部分。\n\nD说CSR记录构成调查的一部分。第3段有`as part of their investigations`，我们把它前面的完整动作读出来。\n\n> 原文参考：\n> \n> Previous studies on CSR have had trouble **[xxx]** these effects because consumers can be affected by all three. A recent study attempts to separate them by looking at bribery **[xxx]** under America’s Foreign Corrupt Practices Act (FCPA). It argues that since prosecutors do not consume a company’s products as part of their investigations, they could be influenced only by the halo effect.\n> \n> 开始精读：\n> \n> Previous studies on CSR / have had trouble **[xxx]** these effects / because consumers can be affected / by all three. / A recent study attempts / to separate them / by looking at bribery **[xxx]** / under America’s Foreign Corrupt Practices Act / (FCPA). / It argues that / since prosecutors do not consume / a company’s products / as part of their investigations, / they could be influenced / only by the halo effect.\n> \n> 以往关于企业社会责任的研究 / 在**[xxx]**这些效果时有困难 / 因为消费者可能受影响 / 来自全部三种效果。 / 最近一项研究试图 / 把它们区分开 / 通过考察贿赂**[xxx]** / 依据美国《反海外腐败法》 / （该法的缩写）。 / 研究认为 / 由于检察官不会消费 / 一家公司的产品 / 作为调查的一部分， / 他们可能受到影响 / 仅来自光环效应。\n\n> It argues that since prosecutors do not consume a company’s products as part of their investigations, they could be influenced only by the halo effect.\n\n> In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR.\n\n那句说，检察官不会把消费公司产品作为调查的一部分，所以研究可以排除前两种消费者效应，只看光环效应。\n\n它没有说检察官把调查CSR记录列入正式调查。第5段也只是说他们评估时受到记录影响。\n\n受到一种印象影响，并不要求这份记录本身成为调查项目。D把句中“调查的一部分”拿走，却把它接在原来没有接的CSR记录后面。\n\n**原文说不把购买产品作为调查内容，能接成把CSR记录作为调查内容吗？**\n\n不能。两者不是同一项活动，受到记录影响也不等于正式调查它。\n\n**第一轮判断：D排除。**","articleRects":[[291,964,1105,37],[202,1009,1194,38],[203,1055,1193,38],[202,1099,1194,39],[202,1146,1194,38],[202,1191,270,38],[274,1465,1122,37],[202,1510,1194,38],[202,1554,1189,39],[203,1601,1193,38],[202,1647,1194,37],[202,1691,460,39]],"questionRects":[[280,1598,562,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"34","initialReadingPids":[2],"paragraphPids":[2,4]},"html":"<h3>D. constitutes part of the investigation</h3>\n<blockquote><p>构成调查的一部分</p>\n</blockquote>\n<p>把D接回题干，它说的是：公司社会责任记录构成检察官调查的一部分。</p>\n<p>D说CSR记录构成调查的一部分。第3段有<code>as part of their investigations</code>，我们把它前面的完整动作读出来。</p>\n<blockquote><p>原文参考：</p>\n<p>Previous studies on CSR have had trouble <strong>[xxx]</strong> these effects because consumers can be affected by all three. A recent study attempts to separate them by looking at bribery <strong>[xxx]</strong> under America’s Foreign Corrupt Practices Act (FCPA). It argues that since prosecutors do not consume a company’s products as part of their investigations, they could be influenced only by the halo effect.</p>\n<p>开始精读：</p>\n<p>Previous studies on CSR / have had trouble <strong>[xxx]</strong> these effects / because consumers can be affected / by all three. / A recent study attempts / to separate them / by looking at bribery <strong>[xxx]</strong> / under America’s Foreign Corrupt Practices Act / (FCPA). / It argues that / since prosecutors do not consume / a company’s products / as part of their investigations, / they could be influenced / only by the halo effect.</p>\n<p>以往关于企业社会责任的研究 / 在<strong>[xxx]</strong>这些效果时有困难 / 因为消费者可能受影响 / 来自全部三种效果。 / 最近一项研究试图 / 把它们区分开 / 通过考察贿赂<strong>[xxx]</strong> / 依据美国《反海外腐败法》 / （该法的缩写）。 / 研究认为 / 由于检察官不会消费 / 一家公司的产品 / 作为调查的一部分， / 他们可能受到影响 / 仅来自光环效应。</p>\n</blockquote>\n<blockquote><p>It argues that since prosecutors do not consume a company’s products as part of their investigations, they could be influenced only by the halo effect.</p>\n</blockquote>\n<blockquote><p>In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company’s record in CSR.</p>\n</blockquote>\n<p>那句说，检察官不会把消费公司产品作为调查的一部分，所以研究可以排除前两种消费者效应，只看光环效应。</p>\n<p>它没有说检察官把调查CSR记录列入正式调查。第5段也只是说他们评估时受到记录影响。</p>\n<p>受到一种印象影响，并不要求这份记录本身成为调查项目。D把句中“调查的一部分”拿走，却把它接在原来没有接的CSR记录后面。</p>\n<p><strong>原文说不把购买产品作为调查内容，能接成把CSR记录作为调查内容吗？</strong></p>\n<p>不能。两者不是同一项活动，受到记录影响也不等于正式调查它。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"34题","raw":"### 34题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n第一遍留下B。原文明确写检察官评估案件时受到公司社会责任记录的影响。","articleRects":[],"questionRects":[[226,1353,943,38],[281,1414,539,31],[280,1476,507,38],[280,1537,626,38],[280,1598,562,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"34"},"html":"<h3>34题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一遍留下B。原文明确写检察官评估案件时受到公司社会责任记录的影响。</p>\n"},{"section":"35题","raw":"## 35题\n\n> Which of the following is true of CSR, according to the last paragraph?  \n> 根据最后一段，关于企业社会责任，下列哪项说法正确？\n\n题干明示the last paragraph，定位第六段。第34题已经把这一段完整读过；这里从研究没有回答的两个问题读到But at least之后已证明的结果，保持这两个层次分开。\n\ntrue of CSR要求选项准确表达末段。末段分别说明研究没有回答什么、至少已经证明什么，要检查选项把自己的断言放在哪一部分。\n\n接下来按A—D逐项看。","articleRects":[[274,1738,1122,38],[202,1783,1194,38],[202,1829,1194,38],[202,1874,1193,38],[202,1920,1194,37],[203,1965,366,38]],"questionRects":[[226,1721,1120,37],[280,1782,997,38],[280,1843,929,38],[280,1904,851,38],[280,1966,813,37],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"35","initialReadingPids":[]},"html":"<h2>35题</h2>\n<blockquote><p>Which of the following is true of CSR, according to the last paragraph?<br />\n根据最后一段，关于企业社会责任，下列哪项说法正确？</p>\n</blockquote>\n<p>题干明示the last paragraph，定位第六段。第34题已经把这一段完整读过；这里从研究没有回答的两个问题读到But at least之后已证明的结果，保持这两个层次分开。</p>\n<p>true of CSR要求选项准确表达末段。末段分别说明研究没有回答什么、至少已经证明什么，要检查选项把自己的断言放在哪一部分。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"35题","raw":"### A. The necessary amount of companies’ spending on it is unknown.\n\n> 公司在这方面需要支出的金额尚不清楚。\n\n把A接回题干，它说的是：最后一段表明，公司需要花多少资金在企业社会责任上仍不清楚。\n\nA说企业需要花多少钱仍不清楚。末段第一句就有`does not answer ... how much ... ought to spend`，我们看未知的是哪件事。\n\n> Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR.\n\n`how much`问金额，`ought to spend`问应该投入多少。研究者明确承认自己的研究没有给出答案。\n\nA的`necessary amount`也是需要投入的数额，`unknown`对应没有确定答案。这里不是说公司不知道自己过去花了多少，而是还没确定应该花多少。\n\n后面证明了较轻处罚这一好处，也没有顺便算出最合适的投入数额，因此两者可以同时成立。\n\n**研究没有回答应该投入多少，能否概括成所需投入金额仍未确定？**\n\n能。A准确接住了研究者明确承认的这一未知。\n\n**第一轮判断：A保留。**","articleRects":[[274,1738,1122,38],[202,1783,1194,38],[202,1829,1194,38],[202,1874,1193,38],[202,1920,1194,37],[203,1965,366,38]],"questionRects":[[280,1782,997,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"35","paragraphPids":[5]},"html":"<h3>A. The necessary amount of companies’ spending on it is unknown.</h3>\n<blockquote><p>公司在这方面需要支出的金额尚不清楚。</p>\n</blockquote>\n<p>把A接回题干，它说的是：最后一段表明，公司需要花多少资金在企业社会责任上仍不清楚。</p>\n<p>A说企业需要花多少钱仍不清楚。末段第一句就有<code>does not answer ... how much ... ought to spend</code>，我们看未知的是哪件事。</p>\n<blockquote><p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR.</p>\n</blockquote>\n<p><code>how much</code>问金额，<code>ought to spend</code>问应该投入多少。研究者明确承认自己的研究没有给出答案。</p>\n<p>A的<code>necessary amount</code>也是需要投入的数额，<code>unknown</code>对应没有确定答案。这里不是说公司不知道自己过去花了多少，而是还没确定应该花多少。</p>\n<p>后面证明了较轻处罚这一好处，也没有顺便算出最合适的投入数额，因此两者可以同时成立。</p>\n<p><strong>研究没有回答应该投入多少，能否概括成所需投入金额仍未确定？</strong></p>\n<p>能。A准确接住了研究者明确承认的这一未知。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"35题","raw":"### B. Companies’ financial capacity for it has been **[xxx]**.\n\n> 公司在这方面的财力已经**[xxx]**。\n\n把B接回题干，它说的是：最后一段对公司承担企业社会责任支出的财力作出了‘已经**[xxx]**’的说明。\n\nB的`financial capacity`说公司有多少承担能力，末段原句问的是`how much ... ought to spend`。我们先分清有能力花多少与应该花多少。\n\n> Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR.\n\n> But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.\n\n原文承认没有回答适当的CSR投入金额，随后说明至少发现了一种好处：良好品行可带来代价较低的处罚。\n\n这两处都没有统计公司的资金、预算或支付能力。B后面的**[xxx]**虽不认识，主语却已经换成财力。\n\n公司应该拿出多少钱与它实际上能拿出多少钱，需要不同信息。不能因为原文谈投入，就把对投入金额的未知变成对财力作出的判断。\n\n**没有确定公司应该花多少，等于研究对公司能承担多少已经作出了B所说的判断吗？**\n\n不等于。原文没有评估财力，B的主语就没接上。\n\n**第一轮判断：B排除。**","articleRects":[[274,1738,1122,38],[202,1783,1194,38],[202,1829,1194,38],[202,1874,1193,38],[202,1920,1194,37],[203,1965,366,38]],"questionRects":[[280,1843,929,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"35","paragraphPids":[5]},"html":"<h3>B. Companies’ financial capacity for it has been <strong>[xxx]</strong>.</h3>\n<blockquote><p>公司在这方面的财力已经<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把B接回题干，它说的是：最后一段对公司承担企业社会责任支出的财力作出了‘已经<strong>[xxx]</strong>’的说明。</p>\n<p>B的<code>financial capacity</code>说公司有多少承担能力，末段原句问的是<code>how much ... ought to spend</code>。我们先分清有能力花多少与应该花多少。</p>\n<blockquote><p>Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR.</p>\n</blockquote>\n<blockquote><p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<p>原文承认没有回答适当的CSR投入金额，随后说明至少发现了一种好处：良好品行可带来代价较低的处罚。</p>\n<p>这两处都没有统计公司的资金、预算或支付能力。B后面的<strong>[xxx]</strong>虽不认识，主语却已经换成财力。</p>\n<p>公司应该拿出多少钱与它实际上能拿出多少钱，需要不同信息。不能因为原文谈投入，就把对投入金额的未知变成对财力作出的判断。</p>\n<p><strong>没有确定公司应该花多少，等于研究对公司能承担多少已经作出了B所说的判断吗？</strong></p>\n<p>不等于。原文没有评估财力，B的主语就没接上。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"35题","raw":"### C. Its negative effects on businesses are often **[xxx]**.\n\n> 它对企业的负面影响经常**[xxx]**。\n\n把C接回题干，它说的是：企业社会责任对企业的负面影响经常处于**[xxx]**这种情况。\n\nC说CSR的负面影响经常怎样，最后的词被挡住了。我们回到`But at least`后的结论，看已证明的是怎样的影响。\n\n> But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.\n\n公司遇到法律问题时，良好品行能使处罚代价更低。这是文中明确写出的一项好处。\n\nC要谈的却是`negative effects`，还用`often`说明它们经常处于某种状况。末段没有列举负面影响，也没有说明它们出现或被处理的频率。\n\n所以，不必猜出**[xxx]**，已经能看出C把原句证明的减轻处罚换成了未被讨论的负面影响。\n\n**末段已经证明的是降低处罚代价的好处，还是C所说经常怎样的负面影响？**\n\n是降低代价的好处。C的负面影响及其频率没有出处。\n\n**第一轮判断：C排除。**","articleRects":[[274,1738,1122,38],[202,1783,1194,38],[202,1829,1194,38],[202,1874,1193,38],[202,1920,1194,37],[203,1965,366,38]],"questionRects":[[280,1904,851,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"35","paragraphPids":[5]},"html":"<h3>C. Its negative effects on businesses are often <strong>[xxx]</strong>.</h3>\n<blockquote><p>它对企业的负面影响经常<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>把C接回题干，它说的是：企业社会责任对企业的负面影响经常处于<strong>[xxx]</strong>这种情况。</p>\n<p>C说CSR的负面影响经常怎样，最后的词被挡住了。我们回到<code>But at least</code>后的结论，看已证明的是怎样的影响。</p>\n<blockquote><p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<p>公司遇到法律问题时，良好品行能使处罚代价更低。这是文中明确写出的一项好处。</p>\n<p>C要谈的却是<code>negative effects</code>，还用<code>often</code>说明它们经常处于某种状况。末段没有列举负面影响，也没有说明它们出现或被处理的频率。</p>\n<p>所以，不必猜出<strong>[xxx]</strong>，已经能看出C把原句证明的减轻处罚换成了未被讨论的负面影响。</p>\n<p><strong>末段已经证明的是降低处罚代价的好处，还是C所说经常怎样的负面影响？</strong></p>\n<p>是降低代价的好处。C的负面影响及其频率没有出处。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"35题","raw":"### D. It has brought much benefit to the banking industry.\n\n> 它已经给银行业带来了很多好处。\n\n把D接回题干，它说的是：企业社会责任已经给银行业带来很多好处。\n\nD说CSR使银行业获益很多。末句用的是`companies`，我们看有没有把这些公司进一步限定为银行。\n\n> But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.\n\n原文说公司遇上法律麻烦时，良好品行证据可以帮助它们减轻处罚。受益者是这类涉案公司。\n\n句子没有单独谈银行，也没有汇总银行业已经获得多少收益。D把一般公司换成一个具体行业，还加了`much benefit`的数量判断。\n\n即使银行也属于公司，仍不能从一个可能适用于公司的结论，直接断言整个银行业已经获得很多好处。\n\n**CSR可能减轻涉案公司的处罚，是否足以证明银行业已经获益很多？**\n\n不足以。原文没有给出银行业这一对象及其获益情况。\n\n**第一轮判断：D排除。**","articleRects":[[274,1738,1122,38],[202,1783,1194,38],[202,1829,1194,38],[202,1874,1193,38],[202,1920,1194,37],[203,1965,366,38]],"questionRects":[[280,1966,813,37],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"35","paragraphPids":[5]},"html":"<h3>D. It has brought much benefit to the banking industry.</h3>\n<blockquote><p>它已经给银行业带来了很多好处。</p>\n</blockquote>\n<p>把D接回题干，它说的是：企业社会责任已经给银行业带来很多好处。</p>\n<p>D说CSR使银行业获益很多。末句用的是<code>companies</code>，我们看有没有把这些公司进一步限定为银行。</p>\n<blockquote><p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<p>原文说公司遇上法律麻烦时，良好品行证据可以帮助它们减轻处罚。受益者是这类涉案公司。</p>\n<p>句子没有单独谈银行，也没有汇总银行业已经获得多少收益。D把一般公司换成一个具体行业，还加了<code>much benefit</code>的数量判断。</p>\n<p>即使银行也属于公司，仍不能从一个可能适用于公司的结论，直接断言整个银行业已经获得很多好处。</p>\n<p><strong>CSR可能减轻涉案公司的处罚，是否足以证明银行业已经获益很多？</strong></p>\n<p>不足以。原文没有给出银行业这一对象及其获益情况。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"35题","raw":"### 35题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。末段明确承认研究没有回答公司应该投入多少，所需投入仍未得出答案。","articleRects":[],"questionRects":[[226,1721,1120,37],[280,1782,997,38],[280,1843,929,38],[280,1904,851,38],[280,1966,813,37],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"35"},"html":"<h3>35题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。末段明确承认研究没有回答公司应该投入多少，所需投入仍未得出答案。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | one and only one；may not be absolutely clear-cut | 从弗里德曼的“one and only one”引出企业社会责任问题，作者以“may not be absolutely clear-cut”回应把相关支出视作浪费的判断，再引入公司被起诉情境下的研究，为后文讨论企业社会责任与公司价值的关系提出问题。 | 引入企业社会责任争论，并对简单否定其价值的看法提出保留。 |\n| 第2段 | add value to their businesses；greater consideration | “add value to their businesses”把上一段的问题展开为三种可能作用：消费者把支出看成产品质量信号，通过购买间接支持公益，以及公司得到“greater consideration”。这为下一段区分三种效应作铺垫。 | 列出企业可能获益的几种途径。 |\n| 第3段 | attempts to separate them；do not consume | 消费者可能同时受到三种作用影响，研究于是“attempts to separate them”。检察官在调查中“do not consume”公司的产品，研究据此认为他们可能受到的只有光环效应；这一段把第二段的多种作用缩到研究要考察的那一种。 | 说明怎样把混在一起的作用区分开，确定研究对象。 |\n| 第4段 | more lenient penalties | 研究在被起诉公司中发现，拥有最**[xxx]**社会责任计划的公司往往得到“more lenient penalties”，并排除了政治影响造成宽大处理的解释。这把第三段的研究思路接到处罚结果上。 | 把研究设计接到处罚结果，并检验另一种解释。 |\n| 第5段 | based on its merits；be influenced by | “based on its merits”与“be influenced by”形成对照：检察官本应依案情判断，实际却受到社会责任记录影响。研究人员还估计增加捐赠约20%会带来通常低40%的罚款，用具体变化说明上一段的处罚差异。 | 把应有判断标准与实际影响作对照，再量化处罚差异。 |\n| 第6段 | does not answer；have demonstrated；a less costly punishment | 先以“does not answer”承认应投入多少等问题仍未回答，再以“have demonstrated”确认良好品行的证据能够争取“a less costly punishment”。末段区分研究的未解问题与已证明的结果，回到第一段提出的公司价值问题。 | 区分尚未解决的问题与已经支持的结论，回应开头的价值争论。 |\n\n全文观点：企业社会责任可以给公司带来好处，这项研究重点表明，公司记录会影响检察官的处罚判断，良好品行的证据能让遭遇法律麻烦的公司争取较低处罚代价。这使把社会责任支出简单视作浪费的判断受到质疑，但研究仍没有回答公司应投入多少等问题。","articleRects":[[276,279,1120,39],[202,326,1194,38],[202,370,1194,40],[202,416,1194,39],[202,463,1194,38],[202,509,1195,38],[202,554,595,38],[274,598,1119,39],[203,645,1193,38],[202,691,1195,37],[203,735,1188,39],[202,782,1194,38],[202,826,1194,39],[202,871,1194,40],[202,919,98,30],[291,964,1105,37],[202,1009,1194,38],[203,1055,1193,38],[202,1099,1194,39],[202,1146,1194,38],[202,1191,270,38],[274,1237,1122,38],[202,1283,1195,37],[203,1328,1193,38],[202,1374,1194,37],[202,1419,820,38],[274,1465,1122,37],[202,1510,1194,38],[202,1554,1189,39],[203,1601,1193,38],[202,1647,1194,37],[202,1691,460,39],[274,1738,1122,38],[202,1783,1194,38],[202,1829,1194,38],[202,1874,1193,38],[202,1920,1194,37],[203,1965,366,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>one and only one；may not be absolutely clear-cut</td><td>从弗里德曼的“one and only one”引出企业社会责任问题，作者以“may not be absolutely clear-cut”回应把相关支出视作浪费的判断，再引入公司被起诉情境下的研究，为后文讨论企业社会责任与公司价值的关系提出问题。</td><td>引入企业社会责任争论，并对简单否定其价值的看法提出保留。</td></tr><tr><td>第2段</td><td>add value to their businesses；greater consideration</td><td>“add value to their businesses”把上一段的问题展开为三种可能作用：消费者把支出看成产品质量信号，通过购买间接支持公益，以及公司得到“greater consideration”。这为下一段区分三种效应作铺垫。</td><td>列出企业可能获益的几种途径。</td></tr><tr><td>第3段</td><td>attempts to separate them；do not consume</td><td>消费者可能同时受到三种作用影响，研究于是“attempts to separate them”。检察官在调查中“do not consume”公司的产品，研究据此认为他们可能受到的只有光环效应；这一段把第二段的多种作用缩到研究要考察的那一种。</td><td>说明怎样把混在一起的作用区分开，确定研究对象。</td></tr><tr><td>第4段</td><td>more lenient penalties</td><td>研究在被起诉公司中发现，拥有最<strong>[xxx]</strong>社会责任计划的公司往往得到“more lenient penalties”，并排除了政治影响造成宽大处理的解释。这把第三段的研究思路接到处罚结果上。</td><td>把研究设计接到处罚结果，并检验另一种解释。</td></tr><tr><td>第5段</td><td>based on its merits；be influenced by</td><td>“based on its merits”与“be influenced by”形成对照：检察官本应依案情判断，实际却受到社会责任记录影响。研究人员还估计增加捐赠约20%会带来通常低40%的罚款，用具体变化说明上一段的处罚差异。</td><td>把应有判断标准与实际影响作对照，再量化处罚差异。</td></tr><tr><td>第6段</td><td>does not answer；have demonstrated；a less costly punishment</td><td>先以“does not answer”承认应投入多少等问题仍未回答，再以“have demonstrated”确认良好品行的证据能够争取“a less costly punishment”。末段区分研究的未解问题与已证明的结果，回到第一段提出的公司价值问题。</td><td>区分尚未解决的问题与已经支持的结论，回应开头的价值争论。</td></tr></tbody></table>\n<p>全文观点：企业社会责任可以给公司带来好处，这项研究重点表明，公司记录会影响检察官的处罚判断，良好品行的证据能让遭遇法律麻烦的公司争取较低处罚代价。这使把社会责任支出简单视作浪费的判断受到质疑，但研究仍没有回答公司应投入多少等问题。</p>\n"},{"section":"进阶回查","raw":"## 回查31题：A还是B？\n\nA. uncertainty\n\nB. skepticism\n\nA说作者自己拿不准，B说作者对弗里德曼的说法提出怀疑。第一遍`may not be absolutely clear-cut`还可能让人觉得他没作判断，现在把后面的研究结果接回来。\n\n第2段先说CSR可以从三方面为公司增加价值：消费者认为产品质量高、愿意借购买来支持公益，以及光环效应。第3段再专门研究检察官，使前两种消费影响不参与进来。\n\n研究得到了什么？第4、5段写：\n\n> tended to get more lenient penalties\n>\n> they do seem to be influenced by a company’s record in CSR\n\nCSR记录会影响案件评估，一些公司因此受到较轻处罚。末段也明确写：\n\n> But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.\n\n这里用的是`have demonstrated`，已经证明了一项具体好处。还有问题未解决，例如应投入多少钱，但未确定投入数额不等于未确定这项好处存在。\n\n于是首段的`But even if`可以读得更明白：即使先接受企业应增加利润，也不能立刻把CSR当作浪费股东的钱，因为它可能反过来减少企业的处罚代价。作者正用这些结果让前面的简单判断站不稳。\n\n**后文一直在说作者不知道CSR有没有用，还是给出了具体用处，来质疑把CSR支出一概看成浪费的说法？**\n\n是后者。作者没有把问题一直悬着，而是引研究说明不能简单下结论。B的怀疑比A的自身不确定更准确。\n\n> **31题选B。**","articleRects":[[276,279,1120,39],[202,326,1194,38],[202,370,1194,40],[202,416,1194,39],[202,463,1194,38],[202,509,1195,38],[202,554,595,38],[274,598,1119,39],[203,645,1193,38],[202,691,1195,37],[203,735,1188,39],[202,782,1194,38],[202,826,1194,39],[202,871,1194,40],[202,919,98,30],[291,964,1105,37],[202,1009,1194,38],[203,1055,1193,38],[202,1099,1194,39],[202,1146,1194,38],[202,1191,270,38],[274,1237,1122,38],[202,1283,1195,37],[203,1328,1193,38],[202,1374,1194,37],[202,1419,820,38],[274,1465,1122,37],[202,1510,1194,38],[202,1554,1189,39],[203,1601,1193,38],[202,1647,1194,37],[202,1691,460,39],[274,1738,1122,38],[202,1783,1194,38],[202,1829,1194,38],[202,1874,1193,38],[202,1920,1194,37],[203,1965,366,38]],"questionRects":[[226,190,983,31],[1218,222,111,7],[280,251,210,38],[280,313,201,37],[280,374,173,37],[280,435,181,31]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","B"],"newEvidencePids":[2,3,4,5,6],"finalChoice":"B","qid":"31","paragraphPids":[0,1,2,3,4,5]},"html":"<h2>回查31题：A还是B？</h2>\n<p>A. uncertainty</p>\n<p>B. skepticism</p>\n<p>A说作者自己拿不准，B说作者对弗里德曼的说法提出怀疑。第一遍<code>may not be absolutely clear-cut</code>还可能让人觉得他没作判断，现在把后面的研究结果接回来。</p>\n<p>第2段先说CSR可以从三方面为公司增加价值：消费者认为产品质量高、愿意借购买来支持公益，以及光环效应。第3段再专门研究检察官，使前两种消费影响不参与进来。</p>\n<p>研究得到了什么？第4、5段写：</p>\n<blockquote><p>tended to get more lenient penalties</p>\n<p>they do seem to be influenced by a company’s record in CSR</p>\n</blockquote>\n<p>CSR记录会影响案件评估，一些公司因此受到较轻处罚。末段也明确写：</p>\n<blockquote><p>But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.</p>\n</blockquote>\n<p>这里用的是<code>have demonstrated</code>，已经证明了一项具体好处。还有问题未解决，例如应投入多少钱，但未确定投入数额不等于未确定这项好处存在。</p>\n<p>于是首段的<code>But even if</code>可以读得更明白：即使先接受企业应增加利润，也不能立刻把CSR当作浪费股东的钱，因为它可能反过来减少企业的处罚代价。作者正用这些结果让前面的简单判断站不稳。</p>\n<p><strong>后文一直在说作者不知道CSR有没有用，还是给出了具体用处，来质疑把CSR支出一概看成浪费的说法？</strong></p>\n<p>是后者。作者没有把问题一直悬着，而是引研究说明不能简单下结论。B的怀疑比A的自身不确定更准确。</p>\n<blockquote><p><strong>31题选B。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**31. B**\n\n**32. C**\n\n**33. D**\n\n**34. B**\n\n**35. A**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>31. B</strong></p>\n<p><strong>32. C</strong></p>\n<p><strong>33. D</strong></p>\n<p><strong>34. B</strong></p>\n<p><strong>35. A</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRvhtBABXRUJQVlA4TOxtBAAvV0Y1AlWTgzaSHMlTzx/1hvsEICImwPznCs90r49i1urlJGVsy4tUpJw70/7kokrBrN2TywfbB94ym9zYzkwistMG6azo5lL7zcwCVa5YzqfZuykpx964VPOu7YLFw954JZXKbpbpjY5lQSUu9Ni5N96pyOLB083MFJn3S5Q3tPGWb23lhfn/eVN+2dpT73nePU/r7HV6j+vsHtO9eu2hx9PTOafn3vM8z+PqPe/ePa557P+a/uu/es/zPI89pddJj2ee9jzP87h6z2Pd3+/397t/d8F//e6naDAoDEFhSAlQGFIKgwKFIbcoFIYgKo9BgXoMimBQlKhgUKAwjyKPQVGigkERDApDMChKkMegCOKNwhAMitwJQWFIiUJhCAaFAoUhiEJhCAqDAoUhJSoYFKUwKFAYUoJgHgXiDmdAEQyKWxAMCkQFgyIYFIZgUKQSgsIQDA
