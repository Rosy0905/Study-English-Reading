ockquote>\n<p>这两段已经把传统保留产品的定价、顾客和收入方式写清，下面检查四项推断。</p>\n","articleRects":[[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45]],"questionRects":[[187,790,869,36],[232,844,516,34],[232,897,503,34],[232,950,503,34],[232,1003,477,34]],"meta":{"kind":"question","qid":"38"}},{"section":"38题","raw":"### A. helps restore the glory of former times\n\n> 帮助恢复往日荣光\n\n把A接回题干，它说的是：传统保留产品能帮助恢复往日的辉煌。\n\nA里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。\n\n> “I would raise prices and make it into more of a **[xxx]** product.”\n\n原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。\n\n第五、六段没有回顾纸媒黄金时代，也没有说销量、影响力或社会地位会恢复。后文只谈忠诚顾客愿意多付钱以及由此增加收入。\n\n传统保留产品可能带有怀旧色彩，但“保留旧产品”与“恢复旧日辉煌”不是同一结果。A把小众维持扩大成整体复兴。\n\n**涨价并把纸质版重新定位，是否就等于restore the glory of former times？**\n\n不等于。原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。\n\nA需要复兴销量或地位的内容，两个段落都没有，因此A排除。\n\n**第一轮判断：A排除。**","html":"<h3>A. helps restore the glory of former times</h3>\n<blockquote>\n<p>帮助恢复往日荣光</p>\n</blockquote>\n<p>把A接回题干，它说的是：传统保留产品能帮助恢复往日的辉煌。</p>\n<p>A里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。</p>\n<blockquote>\n<p>“I would raise prices and make it into more of a <span class=\"mask\">[xxx]</span> product.”</p>\n</blockquote>\n<p>原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。</p>\n<p>第五、六段没有回顾纸媒黄金时代，也没有说销量、影响力或社会地位会恢复。后文只谈忠诚顾客愿意多付钱以及由此增加收入。</p>\n<p>传统保留产品可能带有怀旧色彩，但“保留旧产品”与“恢复旧日辉煌”不是同一结果。A把小众维持扩大成整体复兴。</p>\n<p><strong>涨价并把纸质版重新定位，是否就等于restore the glory of former times？</strong></p>\n<p>不等于。原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。</p>\n<p>A需要复兴销量或地位的内容，两个段落都没有，因此A排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45]],"questionRects":[[187,790,869,36],[232,844,516,34],[232,897,503,34],[232,950,503,34],[232,1003,477,34]],"meta":{"kind":"option","qid":"38","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","causality"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"raise prices and make it into","visibleOptionAnchor":"restore the glory of former times"}}}},{"section":"38题","raw":"### B. is meant for the most **[xxx]** customers\n\n> 面向最 **[xxx]** 的顾客\n\n把B接回题干，它说的是：传统保留产品是为最忠诚的一批顾客准备的。\n\nB里的“is meant for the most”和原文“The most loyal customers”都在界定这种产品面向谁，因为选项说它服务最某类顾客，原文直接把后续方案落到最忠诚顾客，所以回看第六段开头和“In other words”后的句子。\n\n> The most loyal customers would still get the product they favor, the idea goes, and they’d feel like they were helping sustain the quality of something they believe in. ... In other words, if you’re going to make a print product, make it for the people who are already **[xxx]** with it.\n\n原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。B的“is meant for the most”同样把legacy product定义成面向最某类顾客。\n\n第五段的涨价方案会缩小大众购买意愿，第六段则说明核心顾客仍能获得喜欢的产品，并觉得自己在维持其品质。这不是追求更广泛流行，而是把产品留给忠诚度最高的人。\n\nB中具体形容词被遮住，但the most与customers保留了最高程度和顾客对象；原文恰好出现The most loyal customers，结构与含义都能接上。\n\n**原文把产品留给The most loyal customers，能不能说明它“is meant for the most某类customers”？**\n\n能。目标人群、最高程度以及产品用途都与原文一致。\n\n遮挡词很可能决定顾客的具体特征，但没有改变“传统保留产品面向核心忠诚顾客”这一关系，所以B保留。\n\n**第一轮判断：B保留。**","html":"<h3>B. is meant for the most <span class=\"mask\">[xxx]</span> customers</h3>\n<blockquote>\n<p>面向最 <span class=\"mask\">[xxx]</span> 的顾客</p>\n</blockquote>\n<p>把B接回题干，它说的是：传统保留产品是为最忠诚的一批顾客准备的。</p>\n<p>B里的“is meant for the most”和原文“The most loyal customers”都在界定这种产品面向谁，因为选项说它服务最某类顾客，原文直接把后续方案落到最忠诚顾客，所以回看第六段开头和“In other words”后的句子。</p>\n<blockquote>\n<p>The most loyal customers would still get the product they favor, the idea goes, and they’d feel like they were helping sustain the quality of something they believe in. ... In other words, if you’re going to make a print product, make it for the people who are already <span class=\"mask\">[xxx]</span> with it.</p>\n</blockquote>\n<p>原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。B的“is meant for the most”同样把legacy product定义成面向最某类顾客。</p>\n<p>第五段的涨价方案会缩小大众购买意愿，第六段则说明核心顾客仍能获得喜欢的产品，并觉得自己在维持其品质。这不是追求更广泛流行，而是把产品留给忠诚度最高的人。</p>\n<p>B中具体形容词被遮住，但the most与customers保留了最高程度和顾客对象；原文恰好出现The most loyal customers，结构与含义都能接上。</p>\n<p><strong>原文把产品留给The most loyal customers，能不能说明它“is meant for the most某类customers”？</strong></p>\n<p>能。目标人群、最高程度以及产品用途都与原文一致。</p>\n<p>遮挡词很可能决定顾客的具体特征，但没有改变“传统保留产品面向核心忠诚顾客”这一关系，所以B保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n","articleRects":[[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45]],"questionRects":[[187,790,869,36],[232,844,516,34],[232,897,503,34],[232,950,503,34],[232,1003,477,34]],"meta":{"kind":"option","qid":"38","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“is meant for the most”和原文“The most loyal customers”都在界定这种产品面向谁，因为选项说它服务最某类顾客，原文直接把后续方案落到最忠诚顾客，所以回看第六段开头和“In other words”后的句子。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"The most loyal customers","visibleOptionAnchor":"is meant for the most"}}}},{"section":"38题","raw":"### C. will have the cost of printing reduced\n\n> 会降低印刷成本\n\n把C接回题干，它说的是：传统保留产品会让印刷成本降低。\n\nC里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。\n\n> “Then increase it at a higher rate each year and essentially try to generate additional revenue.”\n\n原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。C的“cost of printing reduced”写的是生产端印刷成本下降。\n\n一个变量是顾客支付价格，一个变量是报社生产成本；即使涨价能改善利润，也不等于printing cost本身降低。原文没有减少印刷机、配送或纸张开支的措施。\n\nC还把increase改成reduced，表面方向相反，但更根本的差别是对象换了：原文提高收费，C降低成本。\n\n**逐年提高纸质版价格以增加收入，是否等于让cost of printing reduced？**\n\n不等于。价格上涨和印刷成本下降是两个不同财务项目。\n\n第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。\n\n**第一轮判断：C排除。**","html":"<h3>C. will have the cost of printing reduced</h3>\n<blockquote>\n<p>会降低印刷成本</p>\n</blockquote>\n<p>把C接回题干，它说的是：传统保留产品会让印刷成本降低。</p>\n<p>C里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。</p>\n<blockquote>\n<p>“Then increase it at a higher rate each year and essentially try to generate additional revenue.”</p>\n</blockquote>\n<p>原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。C的“cost of printing reduced”写的是生产端印刷成本下降。</p>\n<p>一个变量是顾客支付价格，一个变量是报社生产成本；即使涨价能改善利润，也不等于printing cost本身降低。原文没有减少印刷机、配送或纸张开支的措施。</p>\n<p>C还把increase改成reduced，表面方向相反，但更根本的差别是对象换了：原文提高收费，C降低成本。</p>\n<p><strong>逐年提高纸质版价格以增加收入，是否等于让cost of printing reduced？</strong></p>\n<p>不等于。价格上涨和印刷成本下降是两个不同财务项目。</p>\n<p>第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45]],"questionRects":[[187,790,869,36],[232,844,516,34],[232,897,503,34],[232,950,503,34],[232,1003,477,34]],"meta":{"kind":"option","qid":"38","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"increase it at a higher rate each year","visibleOptionAnchor":"cost of printing reduced"}}}},{"section":"38题","raw":"### D. expands the popularity of the paper\n\n> 扩大报纸的受欢迎程度\n\n把D接回题干，它说的是：传统保留产品会扩大报纸的受欢迎程度。\n\nD里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。\n\n> The most loyal customers would still get the product they favor, the idea goes, and they’d feel like they were helping sustain the quality of something they believe in.\n\n原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。\n\n后文还说产品要为已经与它有深厚关系的人制作，价格接近纯数字订阅的两倍。这种高价、小众定位更像维持忠诚群体，而不是扩大普及率。\n\nD把“保留最忠诚顾客”改成“扩大所有人的欢迎度”，范围方向相反；没有任何新增读者或扩大销量的内容。\n\n**面向The most loyal customers的高价产品，能不能被说成expands the popularity？**\n\n不能。原文收窄目标人群，D却扩大受欢迎范围。\n\n涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。\n\n**第一轮判断：D排除。**","html":"<h3>D. expands the popularity of the paper</h3>\n<blockquote>\n<p>扩大报纸的受欢迎程度</p>\n</blockquote>\n<p>把D接回题干，它说的是：传统保留产品会扩大报纸的受欢迎程度。</p>\n<p>D里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。</p>\n<blockquote>\n<p>The most loyal customers would still get the product they favor, the idea goes, and they’d feel like they were helping sustain the quality of something they believe in.</p>\n</blockquote>\n<p>原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。</p>\n<p>后文还说产品要为已经与它有深厚关系的人制作，价格接近纯数字订阅的两倍。这种高价、小众定位更像维持忠诚群体，而不是扩大普及率。</p>\n<p>D把“保留最忠诚顾客”改成“扩大所有人的欢迎度”，范围方向相反；没有任何新增读者或扩大销量的内容。</p>\n<p><strong>面向The most loyal customers的高价产品，能不能被说成expands the popularity？</strong></p>\n<p>不能。原文收窄目标人群，D却扩大受欢迎范围。</p>\n<p>涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45]],"questionRects":[[187,790,869,36],[232,844,516,34],[232,897,503,34],[232,950,503,34],[232,1003,477,34]],"meta":{"kind":"option","qid":"38","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。"],"evidenceParagraphPids":[4,5],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["scope","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"The most loyal customers","visibleOptionAnchor":"expands the popularity"}}}},{"section":"38题","raw":"### 38题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n这一轮只留下B。另外三项都已经与当前读到的主体、动作、范围或方向出现明确冲突。","html":"<h3>38题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只留下B。另外三项都已经与当前读到的主体、动作、范围或方向出现明确冲突。</p>\n","articleRects":[[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45]],"questionRects":[[187,790,869,36],[232,844,516,34],[232,897,503,34],[232,950,503,34],[232,1003,477,34]],"meta":{"kind":"result","qid":"38"}},{"section":"39题","raw":"## 39题\n\n> Peretti believes that, in a changing world, ______.  \n> 佩雷蒂认为，在不断变化的世界里，什么说法成立？\n\n题干再次点名Peretti，并把条件限定为a changing world。最后一段正是他对市场和世界变化的总结，因此完整读最后一段。\n\n> 原文参考：\n>\n> “It’s a really hard thing to do and it’s a **[xxx]** luxury that BuzzFeed doesn’t have a legacy business,” Peretti remarked. “But we’re going to have questions like that where we have things we’re doing that don’t make sense when the market changes and the world changes. In those situations, it’s better to be more aggressive than less aggressive.”\n>\n> 开始精读：\n>\n> “It’s a really hard thing to do / and it’s a **[xxx]** luxury / that BuzzFeed doesn’t have a legacy business,” Peretti remarked. / “But we’re going to have questions like that / where we have things we’re doing / that don’t make sense when the market changes and the world changes. / In those situations, / it’s better to be more aggressive than less aggressive.”\n>\n> 顺着英文顺序读：\n>\n> “这确实是一件很难做的事” / 而BuzzFeed没有传统业务是一种 **[xxx]** 的幸运 / 佩雷蒂这样评论 / “但我们会遇到这类问题” / 我们正在做的一些事情 / 当市场和世界变化时已经不再合理 / 在这些情况下 / 更积极果断比不那么积极果断更好\n\n空格要补的是佩雷蒂面对变化时的行动判断，不是对某一种纸质方案的孤立细节。","html":"<h2>39题</h2>\n<blockquote>\n<p>Peretti believes that, in a changing world, ______.<br />\n佩雷蒂认为，在不断变化的世界里，什么说法成立？</p>\n</blockquote>\n<p>题干再次点名Peretti，并把条件限定为a changing world。最后一段正是他对市场和世界变化的总结，因此完整读最后一段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>“It’s a really hard thing to do and it’s a <span class=\"mask\">[xxx]</span> luxury that BuzzFeed doesn’t have a legacy business,” Peretti remarked. “But we’re going to have questions like that where we have things we’re doing that don’t make sense when the market changes and the world changes. In those situations, it’s better to be more aggressive than less aggressive.”</p>\n<p>开始精读：</p>\n<p>“It’s a really hard thing to do / and it’s a <span class=\"mask\">[xxx]</span> luxury / that BuzzFeed doesn’t have a legacy business,” Peretti remarked. / “But we’re going to have questions like that / where we have things we’re doing / that don’t make sense when the market changes and the world changes. / In those situations, / it’s better to be more aggressive than less aggressive.”</p>\n<p>顺着英文顺序读：</p>\n<p>“这确实是一件很难做的事” / 而BuzzFeed没有传统业务是一种 <span class=\"mask\">[xxx]</span> 的幸运 / 佩雷蒂这样评论 / “但我们会遇到这类问题” / 我们正在做的一些事情 / 当市场和世界变化时已经不再合理 / 在这些情况下 / 更积极果断比不那么积极果断更好</p>\n</blockquote>\n<p>空格要补的是佩雷蒂面对变化时的行动判断，不是对某一种纸质方案的孤立细节。</p>\n","articleRects":[[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[187,1108,480,35],[232,1161,515,34],[232,1214,522,34],[232,1267,509,34],[232,1320,541,34]],"meta":{"kind":"question","qid":"39"}},{"section":"39题","raw":"### A. traditional luxuries can stay unaffected\n\n> 传统奢侈品可以不受影响\n\n把A接回题干，它说的是：在变化的世界里，传统奢侈品可以保持不受影响。\n\nA里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。\n\n> “But we’re going to have questions like that where we have things we’re doing that don’t make sense when the market changes and the world changes.”\n\n原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。A的“stay unaffected”却说传统奢侈品可以完全不受影响。\n\n佩雷蒂之所以提出涨价、重定位和更积极行动，正是因为维持原状不再合理。A若成立，最后一段无需讨论如何面对变化。\n\n被遮住的luxury修饰BuzzFeed没有传统业务这一状态，不改变后一句已经写明的“环境变化—旧做法失效”关系。\n\n**旧做法会在market changes and the world changes后不再合理，还能说它们stay unaffected吗？**\n\n不能。原文强调变化会迫使企业重新判断旧业务，A则否定这种影响。\n\n最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。\n\n**第一轮判断：A排除。**","html":"<h3>A. traditional luxuries can stay unaffected</h3>\n<blockquote>\n<p>传统奢侈品可以不受影响</p>\n</blockquote>\n<p>把A接回题干，它说的是：在变化的世界里，传统奢侈品可以保持不受影响。</p>\n<p>A里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。</p>\n<blockquote>\n<p>“But we’re going to have questions like that where we have things we’re doing that don’t make sense when the market changes and the world changes.”</p>\n</blockquote>\n<p>原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。A的“stay unaffected”却说传统奢侈品可以完全不受影响。</p>\n<p>佩雷蒂之所以提出涨价、重定位和更积极行动，正是因为维持原状不再合理。A若成立，最后一段无需讨论如何面对变化。</p>\n<p>被遮住的luxury修饰BuzzFeed没有传统业务这一状态，不改变后一句已经写明的“环境变化—旧做法失效”关系。</p>\n<p><strong>旧做法会在market changes and the world changes后不再合理，还能说它们stay unaffected吗？</strong></p>\n<p>不能。原文强调变化会迫使企业重新判断旧业务，A则否定这种影响。</p>\n<p>最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[187,1108,480,35],[232,1161,515,34],[232,1214,522,34],[232,1267,509,34],[232,1320,541,34]],"meta":{"kind":"option","qid":"39","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。"],"evidenceParagraphPids":[6],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["negation","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"market changes and the world changes","visibleOptionAnchor":"stay unaffected"}}}},{"section":"39题","raw":"### B. cautiousness facilitates problem-solving\n\n> 谨慎有助于解决问题\n\n把B接回题干，它说的是：谨慎能帮助解决变化中的问题。\n\nB里的“cautiousness”和原文“more aggressive than less aggressive”都在比较面对变化时应采取的行动强度，因为选项推崇谨慎，原文明确偏向更积极果断，所以回看最后一句。\n\n> In those situations, it’s better to be more aggressive than less aggressive.\n\n原文“more aggressive than less aggressive”直接比较两种行动方式，并选择更积极的一边。B的“cautiousness”则把更谨慎、更保守的行动写成解决问题的有利条件，两者方向相反。\n\n这里不是说任何时候都要鲁莽，而是在市场和世界变化、旧做法不再合理的situations中，拖延和过度谨慎更可能让问题继续。B把作者给出的行动偏好反过来。\n\n原句没有遮挡决定比较方向的better、more和less，因此这条分叉已经读清。\n\n**作者说more aggressive更好，能不能改成cautiousness facilitates problem-solving？**\n\n不能。B选择谨慎，原文选择更积极果断，比较方向相反。\n\n两者针对的是同一变化情境，不能靠其他遮挡词调和，所以B排除。\n\n**第一轮判断：B排除。**","html":"<h3>B. cautiousness facilitates problem-solving</h3>\n<blockquote>\n<p>谨慎有助于解决问题</p>\n</blockquote>\n<p>把B接回题干，它说的是：谨慎能帮助解决变化中的问题。</p>\n<p>B里的“cautiousness”和原文“more aggressive than less aggressive”都在比较面对变化时应采取的行动强度，因为选项推崇谨慎，原文明确偏向更积极果断，所以回看最后一句。</p>\n<blockquote>\n<p>In those situations, it’s better to be more aggressive than less aggressive.</p>\n</blockquote>\n<p>原文“more aggressive than less aggressive”直接比较两种行动方式，并选择更积极的一边。B的“cautiousness”则把更谨慎、更保守的行动写成解决问题的有利条件，两者方向相反。</p>\n<p>这里不是说任何时候都要鲁莽，而是在市场和世界变化、旧做法不再合理的situations中，拖延和过度谨慎更可能让问题继续。B把作者给出的行动偏好反过来。</p>\n<p>原句没有遮挡决定比较方向的better、more和less，因此这条分叉已经读清。</p>\n<p><strong>作者说more aggressive更好，能不能改成cautiousness facilitates problem-solving？</strong></p>\n<p>不能。B选择谨慎，原文选择更积极果断，比较方向相反。</p>\n<p>两者针对的是同一变化情境，不能靠其他遮挡词调和，所以B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[187,1108,480,35],[232,1161,515,34],[232,1214,522,34],[232,1267,509,34],[232,1320,541,34]],"meta":{"kind":"option","qid":"39","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“cautiousness”和原文“more aggressive than less aggressive”都在比较面对变化时应采取的行动强度，因为选项推崇谨慎，原文明确偏向更积极果断，所以回看最后一句。"],"evidenceParagraphPids":[6],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["relationship_direction","action_direction"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"more aggressive than less aggressive","visibleOptionAnchor":"cautiousness"}}}},{"section":"39题","raw":"### C. aggressiveness better meets challenges\n\n> 更积极果断才能更好应对挑战\n\n把C接回题干，它说的是：更积极果断的行动更能应对变化带来的挑战。\n\nC里的“aggressiveness better meets challenges”和原文“better to be more aggressive”直接使用相同的比较方向，因为选项概括积极行动更能应对挑战，原文在变化情境中明确说更积极比不积极好，所以回看最后一句。\n\n> In those situations, it’s better to be more aggressive than less aggressive.\n\n原文“better to be more aggressive”给出作者清楚的行动判断：遇到市场和世界变化造成的不合理做法，应当更积极。C的“aggressiveness better meets challenges”把这一判断概括为积极果断更适合应对挑战。\n\n选项中的challenges对应前一句的questions以及旧做法don’t make sense；better meets对应原文better to be。主体、情境和比较方向都没有改变。\n\nC没有把more aggressive夸大成无条件冒险，而是保留“在变化世界中应对问题”这一条件，因此可以直接接回题干。\n\n**“better to be more aggressive”能不能说明aggressiveness better meets challenges？**\n\n能。C只是把原句的情境和行动偏好换成更概括的表达，方向完全一致。\n\n最后一段没有相反限制，也没有把积极行动缩回谨慎等待，因此C保留。\n\n**第一轮判断：C保留。**","html":"<h3>C. aggressiveness better meets challenges</h3>\n<blockquote>\n<p>更积极果断才能更好应对挑战</p>\n</blockquote>\n<p>把C接回题干，它说的是：更积极果断的行动更能应对变化带来的挑战。</p>\n<p>C里的“aggressiveness better meets challenges”和原文“better to be more aggressive”直接使用相同的比较方向，因为选项概括积极行动更能应对挑战，原文在变化情境中明确说更积极比不积极好，所以回看最后一句。</p>\n<blockquote>\n<p>In those situations, it’s better to be more aggressive than less aggressive.</p>\n</blockquote>\n<p>原文“better to be more aggressive”给出作者清楚的行动判断：遇到市场和世界变化造成的不合理做法，应当更积极。C的“aggressiveness better meets challenges”把这一判断概括为积极果断更适合应对挑战。</p>\n<p>选项中的challenges对应前一句的questions以及旧做法don’t make sense；better meets对应原文better to be。主体、情境和比较方向都没有改变。</p>\n<p>C没有把more aggressive夸大成无条件冒险，而是保留“在变化世界中应对问题”这一条件，因此可以直接接回题干。</p>\n<p><strong>“better to be more aggressive”能不能说明aggressiveness better meets challenges？</strong></p>\n<p>能。C只是把原句的情境和行动偏好换成更概括的表达，方向完全一致。</p>\n<p>最后一段没有相反限制，也没有把积极行动缩回谨慎等待，因此C保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n","articleRects":[[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[187,1108,480,35],[232,1161,515,34],[232,1214,522,34],[232,1267,509,34],[232,1320,541,34]],"meta":{"kind":"option","qid":"39","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“aggressiveness better meets challenges”和原文“better to be more aggressive”直接使用相同的比较方向，因为选项概括积极行动更能应对挑战，原文在变化情境中明确说更积极比不积极好，所以回看最后一句。"],"evidenceParagraphPids":[6],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"local_relation_not_yet_resolved","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"better to be more aggressive","visibleOptionAnchor":"aggressiveness better meets challenges"}}}},{"section":"39题","raw":"### D. legacy businesses are becoming outdated\n\n> 传统业务正在变得过时\n\n把D接回题干，它说的是：传统业务正在变得过时。\n\nD里的“legacy businesses are becoming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个传统业务正在过时，原文只说某些正在做的事情会变得不合理，所以回看最后一段中间。\n\n> “But we’re going to have questions like that where we have things we’re doing that don’t make sense when the market changes and the world changes.”\n\n原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。D的“legacy businesses are becoming outdated”却把判断扩大到整个传统业务正在过时。\n\n佩雷蒂并没有主张传统业务一律消失。前文恰恰提出把纸质版做成高价保留产品，让传统业务以另一种方式继续存在。D的整体淘汰判断与这种重定位思路不一致。\n\n原文说的是某些行为在特定变化下失去合理性，D加入becoming的持续趋势，又把部分做法上升为整个业务类别。\n\n**“有些做法不再合理”是否就等于所有legacy businesses are becoming outdated？**\n\n不等于。原文针对部分做法，D针对整个业务；原文允许重新定位后继续，D则宣布整体过时。\n\n范围和趋势都被D扩大，最后一段没有支持这种整体结论，所以D排除。\n\n**第一轮判断：D排除。**","html":"<h3>D. legacy businesses are becoming outdated</h3>\n<blockquote>\n<p>传统业务正在变得过时</p>\n</blockquote>\n<p>把D接回题干，它说的是：传统业务正在变得过时。</p>\n<p>D里的“legacy businesses are becoming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个传统业务正在过时，原文只说某些正在做的事情会变得不合理，所以回看最后一段中间。</p>\n<blockquote>\n<p>“But we’re going to have questions like that where we have things we’re doing that don’t make sense when the market changes and the world changes.”</p>\n</blockquote>\n<p>原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。D的“legacy businesses are becoming outdated”却把判断扩大到整个传统业务正在过时。</p>\n<p>佩雷蒂并没有主张传统业务一律消失。前文恰恰提出把纸质版做成高价保留产品，让传统业务以另一种方式继续存在。D的整体淘汰判断与这种重定位思路不一致。</p>\n<p>原文说的是某些行为在特定变化下失去合理性，D加入becoming的持续趋势，又把部分做法上升为整个业务类别。</p>\n<p><strong>“有些做法不再合理”是否就等于所有legacy businesses are becoming outdated？</strong></p>\n<p>不等于。原文针对部分做法，D针对整个业务；原文允许重新定位后继续，D则宣布整体过时。</p>\n<p>范围和趋势都被D扩大，最后一段没有支持这种整体结论，所以D排除。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n","articleRects":[[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[187,1108,480,35],[232,1161,515,34],[232,1214,522,34],[232,1267,509,34],[232,1320,541,34]],"meta":{"kind":"option","qid":"39","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“legacy businesses are becoming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个传统业务正在过时，原文只说某些正在做的事情会变得不合理，所以回看最后一段中间。"],"evidenceParagraphPids":[6],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["part_whole","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"things we’re doing that don’t make sense","visibleOptionAnchor":"legacy businesses are becoming outdated"}}}},{"section":"39题","raw":"### 39题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n这一轮只留下C。另外三项都已经与当前读到的主体、动作、范围或方向出现明确冲突。","html":"<h3>39题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只留下C。另外三项都已经与当前读到的主体、动作、范围或方向出现明确冲突。</p>\n","articleRects":[[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[187,1108,480,35],[232,1161,515,34],[232,1214,522,34],[232,1267,509,34],[232,1320,541,34]],"meta":{"kind":"result","qid":"39"}},{"section":"40题","raw":"## 40题\n\n**Which of the following would be the best title of the text?**\n\n下面哪一项最适合作为本文标题？\n\n这是全文作者观点 / 全文主旨题。\n\n这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\n\n选项：\n\nA. **Shift to Online Newspapers All at Once**\n\n立刻全面转向网络报纸\n\nB. **Cherish the Newspaper Still in Your Hand**\n\n珍惜你手中的纸质报纸\n\nC. **Keep Your Newspapers Forever in Fashion**\n\n让纸质报纸永远流行\n\nD. **Make Your Print Newspaper a Luxury Good**\n\n把纸质报纸做成奢侈品","html":"<h2>40题</h2>\n<p><strong>Which of the following would be the best title of the text?</strong></p>\n<p>下面哪一项最适合作为本文标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Shift to Online Newspapers All at Once</strong></p>\n<p>立刻全面转向网络报纸</p>\n<p>B. <strong>Cherish the Newspaper Still in Your Hand</strong></p>\n<p>珍惜你手中的纸质报纸</p>\n<p>C. <strong>Keep Your Newspapers Forever in Fashion</strong></p>\n<p>让纸质报纸永远流行</p>\n<p>D. <strong>Make Your Print Newspaper a Luxury Good</strong></p>\n<p>把纸质报纸做成奢侈品</p>\n","articleRects":[],"questionRects":[[186,1425,770,35],[232,1478,531,35],[232,1531,561,35],[232,1584,567,34],[232,1637,588,34]],"meta":{"kind":"main_overview","qid":"40"}},{"section":"40题","raw":"### 用写作视角确定主旨的方法分析每个选项\n\n所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\n\n| 段落 | 作者这一段在做什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 提出《纽约时报》终有一天会停止纸质出版，但具体时间仍有争议 | 先摆出一个迟早会到来的变化 |\n| 2 | 说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降 | 回头解释维持原样为什么越来越难 |\n| 3 | 转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误 | 但话说回来立刻停下也不对 |\n| 4 | 佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客 | 接着提出一种渐进调整办法 |\n| 5 | 以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品 | 再举一个例子说明转向也能成功 |\n| 6 | 说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品 | 然后说明怎样保住核心价值 |\n| 7 | 总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法 | 最后说环境变化时要更果断 |\n\n先不急着看四个标题。把第三列单独留下，可以看到全文每一步都在为后面的处理办法服务。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。","html":"<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>提出《纽约时报》终有一天会停止纸质出版，但具体时间仍有争议</td>\n  <td>先摆出一个迟早会到来的变化</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降</td>\n  <td>回头解释维持原样为什么越来越难</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误</td>\n  <td>但话说回来立刻停下也不对</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客</td>\n  <td>接着提出一种渐进调整办法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品</td>\n  <td>再举一个例子说明转向也能成功</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品</td>\n  <td>然后说明怎样保住核心价值</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法</td>\n  <td>最后说环境变化时要更果断</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个标题。把第三列单独留下，可以看到全文每一步都在为后面的处理办法服务。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36],[226,375,941,35],[167,419,998,34],[167,462,998,34],[168,506,989,34],[167,549,998,34],[167,593,968,34],[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36],[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45],[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[186,1425,770,35],[232,1478,531,35],[232,1531,561,35],[232,1584,567,34],[232,1637,588,34]],"meta":{"kind":"main_method","qid":"40","logicAudit":{"schema":"abstract-blunt-v3","secondColumnFirst":true,"specificTermsRemoved":true,"crossTopicTest":true}}},{"section":"40题","raw":"### A. Shift to Online Newspapers All at Once\n\n> 立刻全面转向网络报纸\n\n如果A是主旨，全文每一段都应当沿着A所规定的中心推进。\n\n| 段落 | 如果 A 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先宣布必须立刻全面停止纸质出版并转向网络 | 先摆出一个迟早会到来的变化 |\n| 2 | 回头列出所有支持立即停印的成本与收入理由 | 回头解释维持原样为什么越来越难 |\n| 3 | 但话说回来只短暂承认停印可能有一点风险 | 但话说回来立刻停下也不对 |\n| 4 | 接着给出一次性关闭纸质版的具体日期和操作步骤 | 接着提出一种渐进调整办法 |\n| 5 | 举例证明突然取消旧服务总能立刻成功 | 再举一个例子说明转向也能成功 |\n| 6 | 然后说明怎样把全部顾客一次转移到网络端 | 然后说明怎样保住核心价值 |\n| 7 | 最后要求面对变化立即切断所有传统业务 | 最后说环境变化时要更果断 |\n\nA只抓住“终有一天停止纸质出版”，却把文章反复强调的渐进转型改成“一次完成”。第三段明确说匆忙取消是错误，第四段也警告直接停掉会惹恼忠诚顾客。\n网飞例子并不是证明所有旧业务都应立即切断，而是说明转型可能值得做；佩雷蒂随后马上提出不设某个停印年份，而是提高价格、改变产品定位。\nA无法解释第五、六段为何花大量篇幅设计高价纸质产品。若要all at once，这些过渡安排都没有必要。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>A. Shift to Online Newspapers All at Once</h3>\n<blockquote>\n<p>立刻全面转向网络报纸</p>\n</blockquote>\n<p>如果A是主旨，全文每一段都应当沿着A所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先宣布必须立刻全面停止纸质出版并转向网络</td>\n  <td>先摆出一个迟早会到来的变化</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>回头列出所有支持立即停印的成本与收入理由</td>\n  <td>回头解释维持原样为什么越来越难</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>但话说回来只短暂承认停印可能有一点风险</td>\n  <td>但话说回来立刻停下也不对</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>接着给出一次性关闭纸质版的具体日期和操作步骤</td>\n  <td>接着提出一种渐进调整办法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举例证明突然取消旧服务总能立刻成功</td>\n  <td>再举一个例子说明转向也能成功</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>然后说明怎样把全部顾客一次转移到网络端</td>\n  <td>然后说明怎样保住核心价值</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求面对变化立即切断所有传统业务</td>\n  <td>最后说环境变化时要更果断</td>\n</tr>\n</tbody>\n</table>\n<p>A只抓住“终有一天停止纸质出版”，却把文章反复强调的渐进转型改成“一次完成”。第三段明确说匆忙取消是错误，第四段也警告直接停掉会惹恼忠诚顾客。\n网飞例子并不是证明所有旧业务都应立即切断，而是说明转型可能值得做；佩雷蒂随后马上提出不设某个停印年份，而是提高价格、改变产品定位。\nA无法解释第五、六段为何花大量篇幅设计高价纸质产品。若要all at once，这些过渡安排都没有必要。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36],[226,375,941,35],[167,419,998,34],[167,462,998,34],[168,506,989,34],[167,549,998,34],[167,593,968,34],[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36],[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45],[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[186,1425,770,35],[232,1478,531,35],[232,1531,561,35],[232,1584,567,34],[232,1637,588,34]],"meta":{"kind":"main_option","qid":"40","option":"A"}},{"section":"40题","raw":"### B. Cherish the Newspaper Still in Your Hand\n\n> 珍惜你手中的纸质报纸\n\n如果B是主旨，全文每一段都应当沿着B所规定的中心推进。\n\n| 段落 | 如果 B 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先抒发对终将消失的纸质报纸的惋惜 | 先摆出一个迟早会到来的变化 |\n| 2 | 回头写纸墨、翻页和实体阅读为何值得保存 | 回头解释维持原样为什么越来越难 |\n| 3 | 但话说回来承认数字媒介有一些便利 | 但话说回来立刻停下也不对 |\n| 4 | 接着号召读者继续购买并珍惜手中报纸 | 接着提出一种渐进调整办法 |\n| 5 | 举例写人们怎样因怀旧而保留旧媒介 | 再举一个例子说明转向也能成功 |\n| 6 | 然后说明纸质报纸带来的情感和文化价值 | 然后说明怎样保住核心价值 |\n| 7 | 最后呼吁无论环境怎样变化都不要放弃纸张 | 最后说环境变化时要更果断 |\n\nB把文章写成对纸质报纸的怀旧赞歌，但第二段开头只是说先把纸墨怀旧放在一边，随后集中讨论成本与收入。作者并未号召读者无条件保存纸质版。\n佩雷蒂确实想保住最忠诚顾客，但方法是涨价和小众化，不是要求所有人珍惜手中报纸。文章的重点是经营转型，不是抒情怀旧。\n最后一段还说市场变化时应更积极处理不合理做法，与“无论如何都珍惜纸质版”的静止态度相反。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>B. Cherish the Newspaper Still in Your Hand</h3>\n<blockquote>\n<p>珍惜你手中的纸质报纸</p>\n</blockquote>\n<p>如果B是主旨，全文每一段都应当沿着B所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先抒发对终将消失的纸质报纸的惋惜</td>\n  <td>先摆出一个迟早会到来的变化</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>回头写纸墨、翻页和实体阅读为何值得保存</td>\n  <td>回头解释维持原样为什么越来越难</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>但话说回来承认数字媒介有一些便利</td>\n  <td>但话说回来立刻停下也不对</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>接着号召读者继续购买并珍惜手中报纸</td>\n  <td>接着提出一种渐进调整办法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举例写人们怎样因怀旧而保留旧媒介</td>\n  <td>再举一个例子说明转向也能成功</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>然后说明纸质报纸带来的情感和文化价值</td>\n  <td>然后说明怎样保住核心价值</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后呼吁无论环境怎样变化都不要放弃纸张</td>\n  <td>最后说环境变化时要更果断</td>\n</tr>\n</tbody>\n</table>\n<p>B把文章写成对纸质报纸的怀旧赞歌，但第二段开头只是说先把纸墨怀旧放在一边，随后集中讨论成本与收入。作者并未号召读者无条件保存纸质版。\n佩雷蒂确实想保住最忠诚顾客，但方法是涨价和小众化，不是要求所有人珍惜手中报纸。文章的重点是经营转型，不是抒情怀旧。\n最后一段还说市场变化时应更积极处理不合理做法，与“无论如何都珍惜纸质版”的静止态度相反。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36],[226,375,941,35],[167,419,998,34],[167,462,998,34],[168,506,989,34],[167,549,998,34],[167,593,968,34],[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36],[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45],[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[186,1425,770,35],[232,1478,531,35],[232,1531,561,35],[232,1584,567,34],[232,1637,588,34]],"meta":{"kind":"main_option","qid":"40","option":"B"}},{"section":"40题","raw":"### C. Keep Your Newspapers Forever in Fashion\n\n> 让纸质报纸永远流行\n\n如果C是主旨，全文每一段都应当沿着C所规定的中心推进。\n\n| 段落 | 如果 C 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先提出让纸质报纸永久保持流行的目标 | 先摆出一个迟早会到来的变化 |\n| 2 | 回头解释当前流行度下降的原因 | 回头解释维持原样为什么越来越难 |\n| 3 | 但话说回来承认立刻停印不能解决流行问题 | 但话说回来立刻停下也不对 |\n| 4 | 接着提出吸引新读者和扩大销量的办法 | 接着提出一种渐进调整办法 |\n| 5 | 举例说明旧产品怎样重新赢得大众市场 | 再举一个例子说明转向也能成功 |\n| 6 | 然后说明怎样降低价格并提高普及率 | 然后说明怎样保住核心价值 |\n| 7 | 最后要求不断追逐变化以维持长期流行 | 最后说环境变化时要更果断 |\n\nC要求报纸永远流行，全文却承认读者迁移、纸质收入下降以及纸质版迟早停印。作者没有提出重新扩大大众销量的计划。\n第五、六段的方案是提高价格，把纸质版留给已经深爱它的核心顾客。这会把产品做得更小众，而不是维持普遍流行。\n标题中的Forever也与第一段的eventually ceases正面冲突，C无法容纳文章的时间判断。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>C. Keep Your Newspapers Forever in Fashion</h3>\n<blockquote>\n<p>让纸质报纸永远流行</p>\n</blockquote>\n<p>如果C是主旨，全文每一段都应当沿着C所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先提出让纸质报纸永久保持流行的目标</td>\n  <td>先摆出一个迟早会到来的变化</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>回头解释当前流行度下降的原因</td>\n  <td>回头解释维持原样为什么越来越难</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>但话说回来承认立刻停印不能解决流行问题</td>\n  <td>但话说回来立刻停下也不对</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>接着提出吸引新读者和扩大销量的办法</td>\n  <td>接着提出一种渐进调整办法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举例说明旧产品怎样重新赢得大众市场</td>\n  <td>再举一个例子说明转向也能成功</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>然后说明怎样降低价格并提高普及率</td>\n  <td>然后说明怎样保住核心价值</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求不断追逐变化以维持长期流行</td>\n  <td>最后说环境变化时要更果断</td>\n</tr>\n</tbody>\n</table>\n<p>C要求报纸永远流行，全文却承认读者迁移、纸质收入下降以及纸质版迟早停印。作者没有提出重新扩大大众销量的计划。\n第五、六段的方案是提高价格，把纸质版留给已经深爱它的核心顾客。这会把产品做得更小众，而不是维持普遍流行。\n标题中的Forever也与第一段的eventually ceases正面冲突，C无法容纳文章的时间判断。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36],[226,375,941,35],[167,419,998,34],[167,462,998,34],[168,506,989,34],[167,549,998,34],[167,593,968,34],[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36],[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45],[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[186,1425,770,35],[232,1478,531,35],[232,1531,561,35],[232,1584,567,34],[232,1637,588,34]],"meta":{"kind":"main_option","qid":"40","option":"C"}},{"section":"40题","raw":"### D. Make Your Print Newspaper a Luxury Good\n\n> 把纸质报纸做成奢侈品\n\n如果D是主旨，全文每一段都应当沿着D所规定的中心推进。\n\n| 段落 | 如果 D 对，这段应该写什么 | 逻辑 |\n| --- | --- | --- |\n| 1 | 先提出纸质版迟早会退出大众日常消费 | 先摆出一个迟早会到来的变化 |\n| 2 | 回头解释昂贵成本、读者迁移和收入下降为何使旧模式难以维持 | 回头解释维持原样为什么越来越难 |\n| 3 | 但话说回来指出不能粗暴地立即停印 | 但话说回来立刻停下也不对 |\n| 4 | 接着提出渐进转型并保护忠诚顾客 | 接着提出一种渐进调整办法 |\n| 5 | 举例说明旧服务可以通过转型找到新的位置 | 再举一个例子说明转向也能成功 |\n| 6 | 然后把纸质版涨价并做成面向核心拥护者的高价保留产品 | 然后说明怎样保住核心价值 |\n| 7 | 最后要求环境变化时更果断地调整传统业务 | 最后说环境变化时要更果断 |\n\nD能覆盖全文。文章先承认纸质版迟早结束，再说明当前大众模式越来越难维持；随后拒绝仓促停印，提出涨价、照顾忠诚顾客并把纸质版重新定位为高价保留产品。\n“luxury good”准确抓住第五、六段的核心经营设计：最忠诚顾客继续获得喜欢的产品，愿意为维持其品质多付钱，报社通过逐年涨价获得额外收入。\n结尾对变化环境中更积极行动的主张，也支持把传统业务从大众产品改造成小众高价产品，而不是僵硬维持原样或一次性取消。\n\n把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。","html":"<h3>D. Make Your Print Newspaper a Luxury Good</h3>\n<blockquote>\n<p>把纸质报纸做成奢侈品</p>\n</blockquote>\n<p>如果D是主旨，全文每一段都应当沿着D所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先提出纸质版迟早会退出大众日常消费</td>\n  <td>先摆出一个迟早会到来的变化</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>回头解释昂贵成本、读者迁移和收入下降为何使旧模式难以维持</td>\n  <td>回头解释维持原样为什么越来越难</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>但话说回来指出不能粗暴地立即停印</td>\n  <td>但话说回来立刻停下也不对</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>接着提出渐进转型并保护忠诚顾客</td>\n  <td>接着提出一种渐进调整办法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举例说明旧服务可以通过转型找到新的位置</td>\n  <td>再举一个例子说明转向也能成功</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>然后把纸质版涨价并做成面向核心拥护者的高价保留产品</td>\n  <td>然后说明怎样保住核心价值</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求环境变化时更果断地调整传统业务</td>\n  <td>最后说环境变化时要更果断</td>\n</tr>\n</tbody>\n</table>\n<p>D能覆盖全文。文章先承认纸质版迟早结束，再说明当前大众模式越来越难维持；随后拒绝仓促停印，提出涨价、照顾忠诚顾客并把纸质版重新定位为高价保留产品。\n“luxury good”准确抓住第五、六段的核心经营设计：最忠诚顾客继续获得喜欢的产品，愿意为维持其品质多付钱，报社通过逐年涨价获得额外收入。\n结尾对变化环境中更积极行动的主张，也支持把传统业务从大众产品改造成小众高价产品，而不是僵硬维持原样或一次性取消。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36],[226,375,941,35],[167,419,998,34],[167,462,998,34],[168,506,989,34],[167,549,998,34],[167,593,968,34],[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36],[227,897,938,35],[167,940,997,35],[168,983,999,36],[167,1027,990,35],[169,1070,817,35],[226,1115,939,34],[167,1158,998,35],[167,1200,995,36],[167,1244,998,36],[167,1284,998,43],[167,1332,997,34],[167,1376,997,34],[167,1414,944,45],[229,1462,936,35],[167,1505,997,36],[167,1550,998,34],[167,1593,998,35],[167,1636,478,35]],"questionRects":[[186,1425,770,35],[232,1478,531,35],[232,1531,561,35],[232,1584,567,34],[232,1637,588,34]],"meta":{"kind":"main_option","qid":"40","option":"D"}},{"section":"40题","raw":"### 40题主旨结果\n\nD能够解释文章为何既不主张立即停印，又要通过涨价、小众化和忠诚顾客把纸质版重新定位；A过于激进，B停留在怀旧，C与迟早停印和小众高价方向相反。\n\n> **40题选D。**\n\n这句话就是本文后续做题的主旨底牌：\n\n**Make Your Print Newspaper a Luxury Good / 把纸质报纸做成奢侈品**","html":"<h3>40题主旨结果</h3>\n<p>D能够解释文章为何既不主张立即停印，又要通过涨价、小众化和忠诚顾客把纸质版重新定位；A过于激进，B停留在怀旧，C与迟早停印和小众高价方向相反。</p>\n<blockquote>\n<p><strong>40题选D。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Make Your Print Newspaper a Luxury Good / 把纸质报纸做成奢侈品</strong></p>\n","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36],[226,375,941,35],[167,419,998,34],[167,462,998,34],[168,506,989,34],[167,549,998,34],[167,593,968,34],[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,80 起来。\n\n把题干接回来，A说《纽约时报》面对当前局面要作出某种调整；D说它要以某种管理状态为目标。A直接要求业务发生改变，D只要求管理方式达到某种性质。第三、四段的完整建议是：不要仓促停印，但要找到办法推进transition，并避免伤害忠诚顾客。前者是带方向的业务动作，后者只是对管理质量的抽象描述。\n\n现在拿主旨来检查。\n\n先看A。主旨“把纸质报纸做成奢侈品”本身就是一套战略调整：不再把纸质版当作大众低价产品，而是提高价格、逐年增收，保留给最忠诚顾客。A中的adjustments能够向后承接这些具体动作，也能向前解释为什么既不能维持原样又不能一次停掉。它把第三、四段的transition与第五、六段的涨价重定位连成一条完整路线。\n\n再看D。D若成立，全文主旨应主要讨论管理效率、组织流程、人员配置或经营控制，后文也应不断说明怎样让管理更有效。但文章真正花篇幅写的是产品定位和顾客结构：价格提高、忠诚顾客多付钱、纸质版变成高价保留产品。即使这些安排需要良好管理，“管理”也只是实现手段，不能概括佩雷蒂提出的具体方向。\n\n回到第一次局部证据，D能借the right way获得一种宽泛可能，所以当时保留没有问题；主旨提供的新区别是，全文需要一个能通向luxury good方案的动作。A能把转型、涨价和顾客重定位都装进去，D只能说“管理得好”，无法说明究竟往哪里改。\n\n> **37题选A。**","html":"<h2>回查37题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. make <span class=\"mask\">[xxx]</span> adjustments</li>\n<li>D. aim for <span class=\"mask\">[xxx]</span> management</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Make Your Print Newspaper a Luxury Good / 把纸质报纸做成奢侈品</strong></p>\n</blockquote>\n<p>也就是：全文不是泛泛要求把管理做得更好，而是在纸质版迟早衰退、又不能仓促停印的条件下，提出涨价、小众化并面向忠诚顾客的具体转型；现在只拿这条新依据，检查第一次没有拉开的两项。</p>\n<p>第一遍读第三、四段时，A和D都没有与局部建议冲突。A把“accelerate that transition”概括成作出调整，D把“go about doing it the right way”概括成追求某种管理。两项都有遮挡，且原文既谈转型也谈正确处理方式，所以当时没有必要凭措辞熟悉度强行选一个。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>把题干接回来，A说《纽约时报》面对当前局面要作出某种调整；D说它要以某种管理状态为目标。A直接要求业务发生改变，D只要求管理方式达到某种性质。第三、四段的完整建议是：不要仓促停印，但要找到办法推进transition，并避免伤害忠诚顾客。前者是带方向的业务动作，后者只是对管理质量的抽象描述。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。主旨“把纸质报纸做成奢侈品”本身就是一套战略调整：不再把纸质版当作大众低价产品，而是提高价格、逐年增收，保留给最忠诚顾客。A中的adjustments能够向后承接这些具体动作，也能向前解释为什么既不能维持原样又不能一次停掉。它把第三、四段的transition与第五、六段的涨价重定位连成一条完整路线。</p>\n<p>再看D。D若成立，全文主旨应主要讨论管理效率、组织流程、人员配置或经营控制，后文也应不断说明怎样让管理更有效。但文章真正花篇幅写的是产品定位和顾客结构：价格提高、忠诚顾客多付钱、纸质版变成高价保留产品。即使这些安排需要良好管理，“管理”也只是实现手段，不能概括佩雷蒂提出的具体方向。</p>\n<p>回到第一次局部证据，D能借the right way获得一种宽泛可能，所以当时保留没有问题；主旨提供的新区别是，全文需要一个能通向luxury good方案的动作。A能把转型、涨价和顾客重定位都装进去，D只能说“管理得好”，无法说明究竟往哪里改。</p>\n<blockquote>\n<p><strong>37题选A。</strong></p>\n</blockquote>\n","articleRects":[],"questionRects":[],"meta":{"kind":"review","qid":"37"}},{"section":"最终答案","raw":"# 5. 最终答案\n\n- 文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n<h2>36题题干</h2>\n<p><strong>The New York Times is considering ending its print edition partly due to ______.</strong></p>\n<blockquote>\n<p>《纽约时报》考虑结束纸质版，部分原因是什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n<h2>37题题干</h2>\n<p><strong>Peretti suggests that, in face of the present situation, the Times should ______.</strong></p>\n<blockquote>\n<p>佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？</p>\n</blockquote>\n<p>题型：<strong>作者建议题</strong>。</p>\n<hr />\n<h2>38题题干</h2>\n<p><strong>It can be inferred from Paragraphs 5 and 6 that a “legacy product” ______.</strong></p>\n<blockquote>\n<p>根据第五、六段可以推断，“传统保留产品”会怎么样？</p>\n</blockquote>\n<p>题型：<strong>推断细节题</strong>。</p>\n<hr />\n<h2>39题题干</h2>\n<p><strong>Peretti believes that, in a changing world, ______.</strong></p>\n<blockquote>\n<p>佩雷蒂认为，在不断变化的世界里，什么说法成立？</p>\n</blockquote>\n<p>题型：<strong>作者观点题</strong>。</p>\n<hr />\n<h2>40题题干</h2>\n<p><strong>Which of the following would be the best title of the text?</strong></p>\n<blockquote>\n<p>下面哪一项最适合作为本文标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr />\n<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>but, though, In other words</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>mistake, foresighted, hard</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>eliminate, discontinue, raise prices</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>upset, additional revenue, declining</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>print, Times, customers, change</td>\n</tr>\n</tbody>\n</table>\n<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>There will <span class=\"mask\">[xxx]</span> come a day when The New York Times <span class=\"mask\">[xxx]</span> to publish stories on newsprint. Exactly when that day will be is a matter of debate. “Sometime in the future,” the paper’s publisher said back in 2010.</p>\n</div></div><div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>There will <span class=\"mask\">[xxx]</span> come a day / when The New York Times <span class=\"mask\">[xxx]</span> to publish stories on newsprint. / Exactly when that day will be is a matter of debate. / “Sometime in the future,” / the paper’s publisher said back in 2010.</p>\n</div></div><div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>There will <span class=\"mask\">[xxx]</span> 一天到来 / when 纽约时报 <span class=\"mask\">[xxx]</span> to 刊登报道 on 新闻纸. / 确切何时 that day will be is 仍有争议. / “Sometime in the future,” / the paper’s publisher said back in 2010.</p>\n</div></div><div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>1、一天到来、纽约时报、刊登报道、新闻纸、确切何时、仍有争议。</p>\n</div></div><div class=\"coarseStack\"><div class=\"coarsePara coarseDone\"><p>1、一天到来、纽约时报、刊登报道、新闻纸、确切何时、仍有争议。</p>\n</div><div class=\"coarsePara currentFocus\"><p><span class=\"mask\">[xxx]</span> for ink on paper and the <span class=\"mask\">[xxx]</span> of pages aside, there’s plenty of <span class=\"mask\">[xxx]</span> to <span class=\"mask\">[xxx]</span> print. The <span class=\"mask\">[xxx]</span> required to make a physical newspaper—printing presses, delivery trucks—isn’t just expensive; it’s <span class=\"mask\">[xxx]</span> at a time when online-only competitors don’t have the same set of financial constraints. Readers are migrating away from print anyway. And though print ad sales still <span class=\"mask\">[xxx]</span> their online and mobile <s
