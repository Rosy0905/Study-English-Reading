<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"preface"}},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"stem_intro"}},{"section":"先读题干","raw":"## 36题题干\n\n**The New York Times is considering ending its print edition partly due to ______.**\n\n> 《纽约时报》考虑结束纸质版，部分原因是什么？\n\n题型：**具体细节题**。\n\n---","html":"<h2>36题题干</h2>\n<p><strong>The New York Times is considering ending its print edition partly due to ______.</strong></p>\n<blockquote>\n<p>《纽约时报》考虑结束纸质版，部分原因是什么？</p>\n</blockquote>\n<p>题型：<strong>具体细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[187,157,892,34],[232,210,402,34],[232,263,410,34],[232,316,420,34],[232,369,359,34]],"meta":{"kind":"stem","qid":"36"}},{"section":"先读题干","raw":"## 37题题干\n\n**Peretti suggests that, in face of the present situation, the Times should ______.**\n\n> 佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？\n\n题型：**作者建议题**。\n\n---","html":"<h2>37题题干</h2>\n<p><strong>Peretti suggests that, in face of the present situation, the Times should ______.</strong></p>\n<blockquote>\n<p>佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？</p>\n</blockquote>\n<p>题型：<strong>作者建议题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[187,474,991,36],[233,527,370,34],[233,580,405,34],[233,633,421,34],[233,686,404,34]],"meta":{"kind":"stem","qid":"37"}},{"section":"先读题干","raw":"## 38题题干\n\n**It can be inferred from Paragraphs 5 and 6 that a “legacy product” ______.**\n\n> 根据第五、六段可以推断，“传统保留产品”会怎么样？\n\n题型：**推断细节题**。\n\n---","html":"<h2>38题题干</h2>\n<p><strong>It can be inferred from Paragraphs 5 and 6 that a “legacy product” ______.</strong></p>\n<blockquote>\n<p>根据第五、六段可以推断，“传统保留产品”会怎么样？</p>\n</blockquote>\n<p>题型：<strong>推断细节题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[187,790,869,36],[232,844,516,34],[232,897,503,34],[232,950,503,34],[232,1003,477,34]],"meta":{"kind":"stem","qid":"38"}},{"section":"先读题干","raw":"## 39题题干\n\n**Peretti believes that, in a changing world, ______.**\n\n> 佩雷蒂认为，在不断变化的世界里，什么说法成立？\n\n题型：**作者观点题**。\n\n---","html":"<h2>39题题干</h2>\n<p><strong>Peretti believes that, in a changing world, ______.</strong></p>\n<blockquote>\n<p>佩雷蒂认为，在不断变化的世界里，什么说法成立？</p>\n</blockquote>\n<p>题型：<strong>作者观点题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[187,1108,480,35],[232,1161,515,34],[232,1214,522,34],[232,1267,509,34],[232,1320,541,34]],"meta":{"kind":"stem","qid":"39"}},{"section":"先读题干","raw":"## 40题题干\n\n**Which of the following would be the best title of the text?**\n\n> 下面哪一项最适合作为本文标题？\n\n题型：**全文作者观点／全文主旨题**。\n\n---","html":"<h2>40题题干</h2>\n<p><strong>Which of the following would be the best title of the text?</strong></p>\n<blockquote>\n<p>下面哪一项最适合作为本文标题？</p>\n</blockquote>\n<p>题型：<strong>全文作者观点／全文主旨题</strong>。</p>\n<hr />\n","articleRects":[],"questionRects":[[186,1425,770,35],[232,1478,531,35],[232,1531,561,35],[232,1584,567,34],[232,1637,588,34]],"meta":{"kind":"stem","qid":"40"}},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下这几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | but, though, In other words |\n| 态度词 / 评价词 | 先抓个大概好坏 | mistake, foresighted, hard |\n| 动作词 | 先看谁做了什么 | eliminate, discontinue, raise prices |\n| 结果词 | 看最后出了什么事 | upset, additional revenue, declining |\n| 重复主题词 | 大概知道老在说什么 | print, Times, customers, change |","html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下这几类：</p>\n<table>\n<thead>\n<tr>\n  <th>类型</th>\n  <th>关注原因</th>\n  <th>本文例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>逻辑词</td>\n  <td>看到这里可能要拐一下</td>\n  <td>but, though, In other words</td>\n</tr>\n<tr>\n  <td>态度词 / 评价词</td>\n  <td>先抓个大概好坏</td>\n  <td>mistake, foresighted, hard</td>\n</tr>\n<tr>\n  <td>动作词</td>\n  <td>先看谁做了什么</td>\n  <td>eliminate, discontinue, raise prices</td>\n</tr>\n<tr>\n  <td>结果词</td>\n  <td>看最后出了什么事</td>\n  <td>upset, additional revenue, declining</td>\n</tr>\n<tr>\n  <td>重复主题词</td>\n  <td>大概知道老在说什么</td>\n  <td>print, Times, customers, change</td>\n</tr>\n</tbody>\n</table>\n","articleRects":[],"questionRects":[],"meta":{"kind":"coarse_intro"}},{"section":"读文章","raw":"There will **[xxx]** come a day when The New York Times **[xxx]** to publish stories on newsprint. Exactly when that day will be is a matter of debate. “Sometime in the future,” the paper’s publisher said back in 2010.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>There will <span class=\"mask\">[xxx]</span> come a day when The New York Times <span class=\"mask\">[xxx]</span> to publish stories on newsprint. Exactly when that day will be is a matter of debate. “Sometime in the future,” the paper’s publisher said back in 2010.</p>\n</div></div>","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36]],"questionRects":[],"meta":{"kind":"coarse","coarse":true,"pid":0,"form":0},"contextRaw":""},{"section":"读文章","raw":"There will **[xxx]** come a day / when The New York Times **[xxx]** to publish stories on newsprint. / Exactly when that day will be is a matter of debate. / “Sometime in the future,” / the paper’s publisher said back in 2010.","html":"<div class=\"coarseStack\"><div class=\"coarsePara currentFocus\"><p>There will <span class=\"mask\">[xxx]</span> come a day / when The New York Times <span class=\"mask\">[xxx]</span> to publish stories on newsprint. / Exactly when that day will be is a matter of debate. / “Sometime in the future,” / the paper’s publisher said back in 2010.</p>\n< 以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住迟早停印、昂贵成本、不能匆忙、转型、网飞、忠诚顾客、涨价和更积极果断；这些碎片之间到底是什么关系，等题目问到再精读。</p>\n","articleRects":[],"questionRects":[],"meta":{"kind":"coarse_summary"}},{"section":"开始做题","raw":"# 3. 开始做36至39题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。\n\n\n---","html":"<h1>3. 开始做36至39题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n","articleRects":[],"questionRects":[],"meta":{"kind":"method_intro"}},{"section":"36题","raw":"## 36题\n\n> The New York Times is considering ending its print edition partly due to ______.  \n> 《纽约时报》考虑结束纸质版，部分原因是什么？\n\n题干点名The New York Times，因此先读第一段，看它提出了什么变化；但空格问的是结束纸质版的原因，理由紧接在后一段，所以把相邻的第二段也完整读完。\n\n> 原文参考：\n>\n> There will **[xxx]** come a day when The New York Times **[xxx]** to publish stories on newsprint. Exactly when that day will be is a matter of debate. “Sometime in the future,” the paper’s publisher said back in 2010.\n>\n> 开始精读：\n>\n> There will **[xxx]** come a day / when The New York Times **[xxx]** to publish stories on newsprint. / Exactly when that day will be is a matter of debate. / “Sometime in the future,” / the paper’s publisher said back in 2010.\n>\n> 顺着英文顺序读：\n>\n> 终究会 **[xxx]** 有一天 / 届时《纽约时报》将 **[xxx]** 在新闻纸上刊登报道 / 那一天究竟何时到来仍有争议 / “未来某个时候” / 该报出版商早在2010年就这样说\n\n> 原文参考：\n>\n> **[xxx]** for ink on paper and the **[xxx]** of pages aside, there’s plenty of **[xxx]** to **[xxx]** print. The **[xxx]** required to make a physical newspaper—printing presses, delivery trucks—isn’t just expensive; it’s **[xxx]** at a time when online-only competitors don’t have the same set of financial constraints. Readers are migrating away from print anyway. And though print ad sales still **[xxx]** their online and mobile **[xxx]**, revenue from print is still declining.\n>\n> 开始精读：\n>\n> **[xxx]** for ink on paper and the **[xxx]** of pages aside, / there’s plenty of **[xxx]** to **[xxx]** print. / The **[xxx]** required to make a physical newspaper—printing presses, delivery trucks— / isn’t just expensive; it’s **[xxx]** / at a time when online-only competitors don’t have the same set of financial constraints. / Readers are migrating away from print anyway. / And though print ad sales still **[xxx]** their online and mobile **[xxx]**, / revenue from print is still declining.\n>\n> 顺着英文顺序读：\n>\n> 先不谈对纸墨的 **[xxx]** 和翻页的 **[xxx]** / 放弃纸质版有充分的 **[xxx]** / 制作实体报纸所需的 **[xxx]**——印刷机和送货卡车—— / 不仅昂贵而且 **[xxx]** / 因为网络竞争者没有同样的财务限制 / 读者本来也在离开纸质版 / 虽然纸质广告销售仍 **[xxx]** 网络和移动端的 **[xxx]** / 但纸质收入仍在下降\n\n前两段把未来停印的设想与纸质业务的现实压力接了起来，空格要补的是其中一个明确原因。","html":"<h2>36题</h2>\n<blockquote>\n<p>The New York Times is considering ending its print edition partly due to ______.<br />\n《纽约时报》考虑结束纸质版，部分原因是什么？</p>\n</blockquote>\n<p>题干点名The New York Times，因此先读第一段，看它提出了什么变化；但空格问的是结束纸质版的原因，理由紧接在后一段，所以把相邻的第二段也完整读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>There will <span class=\"mask\">[xxx]</span> come a day when The New York Times <span class=\"mask\">[xxx]</span> to publish stories on newsprint. Exactly when that day will be is a matter of debate. “Sometime in the future,” the paper’s publisher said back in 2010.</p>\n<p>开始精读：</p>\n<p>There will <span class=\"mask\">[xxx]</span> come a day / when The New York Times <span class=\"mask\">[xxx]</span> to publish stories on newsprint. / Exactly when that day will be is a matter of debate. / “Sometime in the future,” / the paper’s publisher said back in 2010.</p>\n<p>顺着英文顺序读：</p>\n<p>终究会 <span class=\"mask\">[xxx]</span> 有一天 / 届时《纽约时报》将 <span class=\"mask\">[xxx]</span> 在新闻纸上刊登报道 / 那一天究竟何时到来仍有争议 / “未来某个时候” / 该报出版商早在2010年就这样说</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p><span class=\"mask\">[xxx]</span> for ink on paper and the <span class=\"mask\">[xxx]</span> of pages aside, there’s plenty of <span class=\"mask\">[xxx]</span> to <span class=\"mask\">[xxx]</span> print. The <span class=\"mask\">[xxx]</span> required to make a physical newspaper—printing presses, delivery trucks—isn’t just expensive; it’s <span class=\"mask\">[xxx]</span> at a time when online-only competitors don’t have the same set of financial constraints. Readers are migrating away from print anyway. And though print ad sales still <span class=\"mask\">[xxx]</span> their online and mobile <span class=\"mask\">[xxx]</span>, revenue from print is still declining.</p>\n<p>开始精读：</p>\n<p><span class=\"mask\">[xxx]</span> for ink on paper and the <span class=\"mask\">[xxx]</span> of pages aside, / there’s plenty of <span class=\"mask\">[xxx]</span> to <span class=\"mask\">[xxx]</span> print. / The <span class=\"mask\">[xxx]</span> required to make a physical newspaper—printing presses, delivery trucks— / isn’t just expensive; it’s <span class=\"mask\">[xxx]</span> / at a time when online-only competitors don’t have the same set of financial constraints. / Readers are migrating away from print anyway. / And though print ad sales still <span class=\"mask\">[xxx]</span> their online and mobile <span class=\"mask\">[xxx]</span>, / revenue from print is still declining.</p>\n<p>顺着英文顺序读：</p>\n<p>先不谈对纸墨的 <span class=\"mask\">[xxx]</span> 和翻页的 <span class=\"mask\">[xxx]</span> / 放弃纸质版有充分的 <span class=\"mask\">[xxx]</span> / 制作实体报纸所需的 <span class=\"mask\">[xxx]</span>——印刷机和送货卡车—— / 不仅昂贵而且 <span class=\"mask\">[xxx]</span> / 因为网络竞争者没有同样的财务限制 / 读者本来也在离开纸质版 / 虽然纸质广告销售仍 <span class=\"mask\">[xxx]</span> 网络和移动端的 <span class=\"mask\">[xxx]</span> / 但纸质收入仍在下降</p>\n</blockquote>\n<p>前两段把未来停印的设想与纸质业务的现实压力接了起来，空格要补的是其中一个明确原因。</p>\n","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36],[226,375,941,35],[167,419,998,34],[167,462,998,34],[168,506,989,34],[167,549,998,34],[167,593,968,34]],"questionRects":[[187,157,892,34],[232,210,402,34],[232,263,410,34],[232,316,420,34],[232,369,359,34]],"meta":{"kind":"question","qid":"36"}},{"section":"36题","raw":"### A. the increasing online ad sales\n\n> 不断增长的网络广告销售额\n\n把A接回题干，它说的是：《纽约时报》考虑结束纸质版，是因为网络广告销售额不断增长。\n\nA里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。\n\n> And though print ad sales still **[xxx]** their online and mobile **[xxx]**, revenue from print is still declining.\n\n原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。\n\n前半句还说纸质广告销售仍与网络和移动端形成某种较强比较，这个比较动作被遮住，但没有出现online ad sales正在increase的时间趋势。读者迁移到网络也不能自动等于网络广告销售增长。\n\nA若成立，段中需要直接比较网络广告收入前后变化，或说明网络广告增长挤压纸质版；现在真正写出的收入趋势只有print revenue declining。\n\n**“纸质收入下降”能不能直接改写成“increasing online ad sales”？**\n\n不能。两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。\n\n遮挡处涉及纸质广告与网络端的比较，不会自动补出网络广告持续增长这一事实，所以A排除。\n\n**第一轮判断：A排除。**","html":"<h3>A. the increasing online ad sales</h3>\n<blockquote>\n<p>不断增长的网络广告销售额</p>\n</blockquote>\n<p>把A接回题干，它说的是：《纽约时报》考虑结束纸质版，是因为网络广告销售额不断增长。</p>\n<p>A里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。</p>\n<blockquote>\n<p>And though print ad sales still <span class=\"mask\">[xxx]</span> their online and mobile <span class=\"mask\">[xxx]</span>, revenue from print is still declining.</p>\n</blockquote>\n<p>原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。</p>\n<p>前半句还说纸质广告销售仍与网络和移动端形成某种较强比较，这个比较动作被遮住，但没有出现online ad sales正在increase的时间趋势。读者迁移到网络也不能自动等于网络广告销售增长。</p>\n<p>A若成立，段中需要直接比较网络广告收入前后变化，或说明网络广告增长挤压纸质版；现在真正写出的收入趋势只有print revenue declining。</p>\n<p><strong>“纸质收入下降”能不能直接改写成“increasing online ad sales”？</strong></p>\n<p>不能。两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。</p>\n<p>遮挡处涉及纸质广告与网络端的比较，不会自动补出网络广告持续增长这一事实，所以A排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36],[226,375,941,35],[167,419,998,34],[167,462,998,34],[168,506,989,34],[167,549,998,34],[167,593,968,34]],"questionRects":[[187,157,892,34],[232,210,402,34],[232,263,410,34],[232,316,420,34],[232,369,359,34]],"meta":{"kind":"option","qid":"36","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","time"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"revenue from print is still declining","visibleOptionAnchor":"increasing online ad sales"}}}},{"section":"36题","raw":"### B. the pressure from its investors\n\n> 来自投资者的压力\n\n把B接回题干，它说的是：《纽约时报》受到投资者压力，所以考虑结束纸质版。\n\nB里的“pressure from its investors”和原文“online-only competitors don’t have the same set of financial constraints”都在谈财务压力来源，因为选项说投资者施压，原文说实体报纸相对纯网络竞争者承担更多成本限制，所以回看第二段关于基础设施的句子。\n\n> The **[xxx]** required to make a physical newspaper—printing presses, delivery trucks—isn’t just expensive; it’s **[xxx]** at a time when online-only competitors don’t have the same set of financial constraints.\n\n原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。B的“pressure from its investors”则需要投资者作为施压主体。\n\n第二段出现的是printing presses、delivery trucks、expensive和competitors，说明纸质生产本身昂贵；没有股东、董事会、回报要求或投资者意见。B把成本结构问题改成人际或治理压力。\n\n即使企业因成本高而让投资者担忧，也需要额外一句把投资者与结束纸质版连接起来。当前段落没有这条主体关系。\n\n**纯网络竞争者没有同样的成本限制，是否就等于《纽约时报》受到investors施压？**\n\n不等于。原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。\n\n基础设施的遮挡形容词不会把competitors改成investors，也不会补出投资者行动，所以B排除。\n\n**第一轮判断：B排除。**","html":"<h3>B. the pressure from its investors</h3>\n<blockquote>\n<p>来自投资者的压力</p>\n</blockquote>\n<p>把B接回题干，它说的是：《纽约时报》受到投资者压力，所以考虑结束纸质版。</p>\n<p>B里的“pressure from its investors”和原文“online-only competitors don’t have the same set of financial constraints”都在谈财务压力来源，因为选项说投资者施压，原文说实体报纸相对纯网络竞争者承担更多成本限制，所以回看第二段关于基础设施的句子。</p>\n<blockquote>\n<p>The <span class=\"mask\">[xxx]</span> required to make a physical newspaper—printing presses, delivery trucks—isn’t just expensive; it’s <span class=\"mask\">[xxx]</span> at a time when online-only competitors don’t have the same set of financial constraints.</p>\n</blockquote>\n<p>原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。B的“pressure from its investors”则需要投资者作为施压主体。</p>\n<p>第二段出现的是printing presses、delivery trucks、expensive和competitors，说明纸质生产本身昂贵；没有股东、董事会、回报要求或投资者意见。B把成本结构问题改成人际或治理压力。</p>\n<p>即使企业因成本高而让投资者担忧，也需要额外一句把投资者与结束纸质版连接起来。当前段落没有这条主体关系。</p>\n<p><strong>纯网络竞争者没有同样的成本限制，是否就等于《纽约时报》受到investors施压？</strong></p>\n<p>不等于。原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。</p>\n<p>基础设施的遮挡形容词不会把competitors改成investors，也不会补出投资者行动，所以B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36],[226,375,941,35],[167,419,998,34],[167,462,998,34],[168,506,989,34],[167,549,998,34],[167,593,968,34]],"questionRects" <p>把C接回题干，它说的是：《纽约时报》因为读者抱怨而考虑结束纸质版。</p>\n<p>C里的“complaints from its readers”和原文“Readers are migrating away from print”都涉及读者对纸质版的反应，因为选项说读者投诉，原文写读者用离开纸质版的行为作出选择，所以回看第二段倒数第二句。</p>\n<blockquote>\n<p>Readers are migrating away from print anyway.</p>\n</blockquote>\n<p>原文“Readers are migrating away from print”写的是读者数量或阅读习惯在迁移，是一种市场行为。C的“complaints from its readers”写的是读者主动表达不满，是另一种行动。</p>\n<p>离开纸质版可能源于价格、便利性或媒介习惯，不能自动证明读者向报社投诉。段中没有complain、protest、demand或读者要求停印的内容。</p>\n<p>更重要的是，读者迁移会削弱纸质版需求；读者抱怨却可能是抱怨停印本身。C没有说明抱怨内容，无法与原文的迁移方向合并。</p>\n<p><strong>读者正在离开纸质版，是否就等于出现了“complaints from its readers”？</strong></p>\n<p>不等于。一个是消费选择变化，一个是言语或书面投诉，动作形式不同。</p>\n<p>原文已经把读者反应写成migrating away，C改成complaints，没有后续句子支持这次改写，所以C排除。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[226,245,939,34],[167,288,989,34],[169,330,829,36],[226,375,941,35],[167,419,998,34],[167,462,998,34],[168,506,989,34],[167,549,998,34],[167,593,968,34]],"questionRects":[[187,157,892,34],[232,210,402,34],[232,263,410,34],[232,316,420,34],[232,369,359,34]],"meta":{"kind":"option","qid":"36","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“complaints from its readers”和原文“Readers are migrating away from print”都涉及读者对纸质版的反应，因为选项说读者投诉，原文写读者用离开纸质版的行为作出选择，所以回看第二段倒数第二句。"],"evidenceParagraphPids":[0,1],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","visible_link"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"Readers are migrating away from print","visibleOptionAnchor":"complaints from its readers"}}}},{"section":"36题","raw":"### D. the high cost of **[xxx]**\n\n> 高昂的 **[xxx]** 成本\n\n把D接回题干，它说的是：《纽约时报》部分因为高昂的某类运营成本而考虑结束纸质版。\n\nD里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。\n\n> The **[xxx]** required to make a physical newspaper—printing presses, delivery trucks—isn’t just expensive; it’s **[xxx]** at a time when online-only competitors don’t have the same set of financial constraints.\n\n原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。\n\n选项中被遮住的是cost后面的具体名词，原文开头同样把制作实体报纸所需的某套东西遮住。两边都围绕实体印刷和配送的运营负担，没有把原因换成广告、投资者或读者抱怨。\n\n题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。\n\n**印刷机、送货卡车等实体报纸条件“isn’t just expensive”，能不能概括成high cost of某项运营内容？**\n\n能。原文明确给出昂贵的实体生产负担，D正是对这一原因的概括。\n\n具体成本名称被遮住，但高成本与纸质版之间的因果已经完整接上，没有相反信息，所以D保留。\n\n**第一轮判断：D保留。**","html":"<h3>D. the high cost of <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>高昂的 <span class=\"mask\">[xxx]</span> 成本</p>\n</blockquote>\n<p>把D接回题干，它说的是：《纽约时报》部分因为高昂的某类运营成本而考虑结束纸质版。</p>\n<p>D里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。</p>\n<blockquote>\n<p>The <span class=\"mask\">[xxx]</span> required to make a physical newspaper—printing presses, delivery trucks—isn’t just expensive; it’s <span class=\"mask\">[xxx]</span> at a time when online-only competitors don’t have the same set of financial constraints.</p>\n</blockquote>\n<p>原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。</p>\n<p>选项中被遮住的是cost后面的具体名词，原文开头同样把制作实体报纸所需的某套东西遮住。两边都围绕实体印刷和配送的运营负担，没有把原因换成广告、投资者或读者抱怨。</p>\n<p>题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。</p>\n<p><strong>印刷机、送货卡车等实体报纸条件“isn’t just expensive”，能不能概括成high cost of某项运营内容？</strong></p>\n<p>能。原文明确给出昂贵的实体生产负担，D正是对这一原因的概括。</p>\n<p>具体成本名 _____.  \n> 佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？\n\n题干点名Peretti，第三段和第四段连续出现他的判断与建议。把这两段一起完整读完，区分“不能仓促做什么”和“应该怎样推进”。\n\n> 原文参考：\n>\n> Overhead may be high and **[xxx]** lower, but rushing to **[xxx]** its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.\n>\n> 开始精读：\n>\n> Overhead may be high and **[xxx]** lower, / but rushing to **[xxx]** its print edition would be a mistake, / says BuzzFeed CEO Jonah Peretti.\n>\n> 顺着英文顺序读：\n>\n> 运营成本可能很高而 **[xxx]** 更低 / 但是匆忙 **[xxx]** 纸质版会是一个错误 / BuzzFeed首席执行官乔纳·佩雷蒂这样说\n\n> 原文参考：\n>\n> Peretti says the Times shouldn’t waste time getting out of the print business, but only if they go about doing it the right way. “Figuring out a way to **[xxx]** that transition would make sense for them,” he said, “but if you **[xxx]** it, you’re going to have your most loyal customers really upset with you.”\n>\n> 开始精读：\n>\n> Peretti says the Times shouldn’t waste time getting out of the print business, / but only if they go about doing it the right way. / “Figuring out a way to **[xxx]** that transition would make sense for them,” he said, / “but if you **[xxx]** it, / you’re going to have your most loyal customers really upset with you.”\n>\n> 顺着英文顺序读：\n>\n> 佩雷蒂说《纽约时报》不应把时间浪费在退出纸质业务上 / 前提是以正确方式处理 / “找办法 **[xxx]** 这一转型对他们是合理的” / “但如果你 **[xxx]** 它” / 你会让最忠诚的顾客非常不满\n\n两段合起来的建议是：纸质业务需要变化，但处理方式不能伤害核心顾客；下面逐项核对。","html":"<h2>37题</h2>\n<blockquote>\n<p>Peretti suggests that, in face of the present situation, the Times should ______.<br />\n佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？</p>\n</blockquote>\n<p>题干点名Peretti，第三段和第四段连续出现他的判断与建议。把这两段一起完整读完，区分“不能仓促做什么”和“应该怎样推进”。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Overhead may be high and <span class=\"mask\">[xxx]</span> lower, but rushing to <span class=\"mask\">[xxx]</span> its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.</p>\n<p>开始精读：</p>\n<p>Overhead may be high and <span class=\"mask\">[xxx]</span> lower, / but rushing to <span class=\"mask\">[xxx]</span> its print edition would be a mistake, / says BuzzFeed CEO Jonah Peretti.</p>\n<p>顺着英文顺序读：</p>\n<p>运营成本可能很高而 <span class=\"mask\">[xxx]</span> 更低 / 但是匆忙 <span class=\"mask\">[xxx]</span> 纸质版会是一个错误 / BuzzFeed首席执行官乔纳·佩雷蒂这样说</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Peretti says the Times shouldn’t waste time getting out of the print business, but only if they go about doing it the right way. “Figuring out a way to <span class=\"mask\">[xxx]</span> that transition would make sense for them,” he said, “but if you <span class=\"mask\">[xxx]</span> it, you’re going to have your most loyal customers really upset with you.”</p>\n<p>开始精读：</p>\n<p>Peretti says the Times shouldn’t waste time getting out of the print business, / but only if they go about doing it the right way. / “Figuring out a way to <span class=\"mask\">[xxx]</span> that transition would make sense for them,” he said, / “but if you <span class=\"mask\">[xxx]</span> it, / you’re going to have your most loyal customers really upset with you.”</p>\n<p>顺着英文顺序读：</p>\n<p>佩雷蒂说《纽约时报》不应把时间浪费在退出纸质业务上 / 前提是以正确方式处理 / “找办法 <span class=\"mask\">[xxx]</span> 这一转型对他们是合理的” / “但如果你 <span class=\"mask\">[xxx]</span> 它” / 你会让最忠诚的顾客非常不满</p>\n</blockquote>\n<p>两段合起来的建议是：纸质业务需要变化，但处理方式不能伤害核心顾客；下面逐项核对。</p>\n","articleRects":[[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36]],"questionRects":[[187,474,991,36],[233,527,370,34],[233,580,405,34],[233,633,421,34],[233,686,404,34]],"meta":{"kind":"question","qid":"37"}},{"section":"37题","raw":"### A. make **[xxx]** adjustments\n\n> 作出 **[xxx]** 调整\n\n把A接回题干，它说的是：面对当前局面，《纽约时报》应当作出某种战略性调整。\n\nA里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。\n\n> “Figuring out a way to **[xxx]** that transition would make sense for them,” he said, “but if you **[xxx]** it, you’re going to have your most loyal customers really upset with you.”\n\n原文“accelerate that transition”所在位置虽被遮住，但that transition已经明确指纸质业务向新模式过渡；同时后半句提醒，若直接停掉，会惹恼最忠诚的顾客。A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。\n\n第三段还说匆忙取消纸质版是mistake，第四段说要以the right way处理。两段合起来不是维持原样，也不是一次性终止，而是改变路径、速度和经营方式。\n\nA中修饰adjustments的词被遮住，所以目前不能逐字确认它强调哪种调整；但“调整”本身与transition、right way和避免直接停印完全同向。\n\n**既要推进transition又不能直接停印，能不能归入对现状作出adjustments？**\n\n能。原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。\n\n修饰词尚未读清，但没有证据表明A要求永久停印或另找读者，因此先保留。\n\n**第一轮判断：A保留。**","html":"<h3>A. make <span class=\"mask\">[xxx]</span> adjustments</h3>\n<blockquote>\n<p>作出 <span class=\"mask\">[xxx]</span> 调整</p>\n</blockquote>\n<p>把A接回题干，它说的是：面对当前局面，《纽约时报》应当作出某种战略性调整。</p>\n<p>A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。</p>\n<blockquote>\n<p>“Figuring out a way to <span class=\"mask\">[xxx]</span> that transition would make sense for them,” he said, “but if you <span class=\"mask\">[xxx]</span> it, you’re going to have your most loyal customers really upset with you.”</p>\n</blockquote>\n<p>原文“accelerate that transition”所在位置虽被遮住，但that transition已经明确指纸质业务向新模式过渡；同时后半句提醒，若直接停掉，会惹恼最忠诚的顾客。A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。</p>\n<p>第三段还说匆忙取消纸质版是mistake，第四段说要以the right way处理。两段合起来不是维持原样，也不是一次性终止，而是改变路径、速度和经营方式。</p>\n<p>A中修饰adjustments的词被遮住，所以目前不能逐字确认它强调哪种调整；但“调整”本身与transition、right way和避免直接停印完全同向。</p>\n<p><strong>既要推进transition又不能直接停印，能不能归入对现状作出adjustments？</strong></p>\n<p>能。原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。</p>\n<p>修饰词尚未读清，但没有证据表明A要求永久停印或另找读者，因此先保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n","articleRects":[[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36]],"questionRects":[[187,474,991,36],[233,527,370,34],[233,580,405,34],[233,633,421,34],[233,686,404,34]],"meta":{"kind":"option","qid":"37","option":"A","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。"],"evidenceParagraphPids":[2,3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_action_or_evaluation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"that transition","visibleOptionAnchor":"adjustments"}}}},{"section":"37题","raw":"### B. end the print edition for good\n\n> 永久终止纸质版\n\n把B接回题干，它说的是：《纽约时报》应当永远终止纸质版。\n\nB里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。\n\n> rushing to **[xxx]** its print edition would be a mistake\n\n原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。B的“end the print edition for good”却把永久终止当成建议本身，两者动作方向相反。\n\n第四段进一步说，只有以正确方式推进转型才合理；直接停掉会让最忠诚顾客不满。B没有保留“处理方式”和“转型过程”，只留下最终关停。\n\n遮挡动词位于its print edition之前，但题干、句法和后文都表明它指取消或停掉纸质版。无论具体词是什么，would be a mistake已经否定了B的直接建议。\n\n**佩雷蒂把匆忙结束纸质版称为mistake，还会建议“end the print edition for good”吗？**\n\n不能。B正是原文警告不要仓促采取的动作。\n\n后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。\n\n**第一轮判断：B排除。**","html":"<h3>B. end the print edition for good</h3>\n<blockquote>\n<p>永久终止纸质版</p>\n</blockquote>\n<p>把B接回题干，它说的是：《纽约时报》应当永远终止纸质版。</p>\n<p>B里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。</p>\n<blockquote>\n<p>rushing to <span class=\"mask\">[xxx]</span> its print edition would be a mistake</p>\n</blockquote>\n<p>原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。B的“end the print edition for good”却把永久终止当成建议本身，两者动作方向相反。</p>\n<p>第四段进一步说，只有以正确方式推进转型才合理；直接停掉会让最忠诚顾客不满。B没有保留“处理方式”和“转型过程”，只留下最终关停。</p>\n<p>遮挡动词位于its print edition之前，但题干、句法和后文都表明它指取消或停掉纸质版。无论具体词是什么，would be a mistake已经否定了B的直接建议。</p>\n<p><strong>佩雷蒂把匆忙结束纸质版称为mistake，还会建议“end the print edition for good”吗？</strong></p>\n<p>不能。B正是原文警告不要仓促采取的动作。</p>\n<p>后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n","articleRects":[[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36]],"questionRects":[[187,474,991,36],[233,527,370,34],[233,580,405,34],[233,633,421,34],[233,686,404,34]],"meta":{"kind":"option","qid":"37","option":"B","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["B里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。"],"evidenceParagraphPids":[2,3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["action_direction","negation"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"would be a mistake","visibleOptionAnchor":"end the print edition for good"}}}},{"section":"37题","raw":"### C. seek new sources of readership\n\n> 寻找新的读者来源\n\n把C接回题干，它说的是：《纽约时报》应当寻找新的读者来源。\n\nC里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。\n\n> “Figuring out a way to **[xxx]** that transition would make sense for them,” he said, “but if you **[xxx]** it, you’re going to have your most loyal customers really upset with you.”\n\n原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。C的“seek new sources of readership”则把动作对象换成尚未拥有的新读者。\n\n佩雷蒂在这两段讨论的是怎样退出或改造纸质业务，不是怎样扩大受众。他没有提获客渠道、年轻读者、网络流量或新的市场来源。\n\n保护现有忠诚顾客与寻找新读者并非逻辑上绝对不能同时发生，但题干问的是佩雷蒂在当前局面下提出的建议；当前建议的实际落点是调整转型方式，而不是seek new sources。\n\n**原文要求顾及most loyal customers，能不能改成主动seek new sources of readership？**\n\n不能。一个保护已有核心读者，一个开拓新的读者来源，动作对象不同。\n\n这两段没有任何拓展读者的措施，C把经营转型问题换成获客问题，因此C排除。\n\n**第一轮判断：C排除。**","html":"<h3>C. seek new sources of readership</h3>\n<blockquote>\n<p>寻找新的读者来源</p>\n</blockquote>\n<p>把C接回题干，它说的是：《纽约时报》应当寻找新的读者来源。</p>\n<p>C里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。</p>\n<blockquote>\n<p>“Figuring out a way to <span class=\"mask\">[xxx]</span> that transition would make sense for them,” he said, “but if you <span class=\"mask\">[xxx]</span> it, you’re going to have your most loyal customers really upset with you.”</p>\n</blockquote>\n<p>原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。C的“seek new sources of readership”则把动作对象换成尚未拥有的新读者。</p>\n<p>佩雷蒂在这两段讨论的是怎样退出或改造纸质业务，不是怎样扩大受众。他没有提获客渠道、年轻读者、网络流量或新的市场来源。</p>\n<p>保护现有忠诚顾客与寻找新读者并非逻辑上绝对不能同时发生，但题干问的是佩雷蒂在当前局面下提出的建议；当前建议的实际落点是调整转型方式，而不是seek new sources。</p>\n<p><strong>原文要求顾及most loyal customers，能不能改成主动seek new sources of readership？</strong></p>\n<p>不能。一个保护已有核心读者，一个开拓新的读者来源，动作对象不同。</p>\n<p>这两段没有任何拓展读者的措施，C把经营转型问题换成获客问题，因此C排除。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n","articleRects":[[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36]],"questionRects":[[187,474,991,36],[233,527,370,34],[233,580,405,34],[233,633,421,34],[233,686,404,34]],"meta":{"kind":"option","qid":"37","option":"C","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["C里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。"],"evidenceParagraphPids":[2,3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"排除","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":false,"unresolvedCore":"none","contradictionDimensions":["object","scope"],"decisionBasis":"complete_visible_contradiction","completeVisibleContradiction":true,"visibleSourceAnchor":"most loyal customers","visibleOptionAnchor":"seek new sources of readership"}}}},{"section":"37题","raw":"### D. aim for **[xxx]** management\n\n> 以 **[xxx]** 管理为目标\n\n把D接回题干，它说的是：《纽约时报》应当以某种高效或妥善的管理方式处理当前局面。\n\nD里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。\n\n> Peretti says the Times shouldn’t waste time getting out of the print business, but only if they go about doing it the right way.\n\n原文“go about doing it the right way”强调管理和执行方式必须正确，D的“aim for”后面接一个被遮住的management，也是在概括应当追求某种管理状态。两边都没有主张立即停印。\n\nD比A更抽象：它没有直接写transition、价格或顾客，只把the right way概括成某类management。这样的概括未必精确，但目前也没有和原句发生主体、对象或方向冲突。\n\n被遮住的词决定management究竟是哪一种管理。若它对应高效、妥善或更有策略的处理方式，就能与the right way接上；现有文字还不足以把这种可能排除。\n\n**“go about doing it the right way”能不能暂时概括成aim for某种management？**\n\n还不能排除。两边都在要求用合适方式管理转型，而不是简单终止纸质版。\n\nD缺少A那样明确的transition动作，但这种不足尚未形成与原文相反的关系，因此第一次也先保留。\n\n**第一轮判断：D保留。**","html":"<h3>D. aim for <span class=\"mask\">[xxx]</span> management</h3>\n<blockquote>\n<p>以 <span class=\"mask\">[xxx]</span> 管理为目标</p>\n</blockquote>\n<p>把D接回题干，它说的是：《纽约时报》应当以某种高效或妥善的管理方式处理当前局面。</p>\n<p>D里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。</p>\n<blockquote>\n<p>Peretti says the Times shouldn’t waste time getting out of the print business, but only if they go about doing it the right way.</p>\n</blockquote>\n<p>原文“go about doing it the right way”强调管理和执行方式必须正确，D的“aim for”后面接一个被遮住的management，也是在概括应当追求某种管理状态。两边都没有主张立即停印。</p>\n<p>D比A更抽象：它没有直接写transition、价格或顾客，只把the right way概括成某类management。这样的概括未必精确，但目前也没有和原句发生主体、对象或方向冲突。</p>\n<p>被遮住的词决定management究竟是哪一种管理。若它对应高效、妥善或更有策略的处理方式，就能与the right way接上；现有文字还不足以把这种可能排除。</p>\n<p><strong>“go about doing it the right way”能不能暂时概括成aim for某种management？</strong></p>\n<p>还不能排除。两边都在要求用合适方式管理转型，而不是简单终止纸质版。</p>\n<p>D缺少A那样明确的transition动作，但这种不足尚未形成与原文相反的关系，因此第一次也先保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n","articleRects":[[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36]],"questionRects":[[187,474,991,36],[233,527,370,34],[233,580,405,34],[233,633,421,34],[233,686,404,34]],"meta":{"kind":"option","qid":"37","option":"D","optionFlow":{"schema":"ordinary-option-flow-v3","sequence":["option_title","direct_chinese","stem_reconnect","specific_source_locator","source_confirmation","concrete_comparison","single_bold_question","immediate_answer","evidence_threshold","first_round_judgement"],"sourceAnchors":["D里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。"],"evidenceParagraphPids":[2,3],"extraPrecisionParagraphPids":[],"sourceMode":"already_read","status":"保留","firstRoundAudit":{"sourceBoundary":"masked_student_visible_only","usedMainIdea":false,"usedAnswerKey":false,"usedUnmaskedSource":false,"maskCanChangeVerdict":true,"unresolvedCore":"masked_relation","contradictionDimensions":[],"decisionBasis":"supported_or_not_disproved","completeVisibleContradiction":false,"visibleSourceAnchor":"go about doing it the right way","visibleOptionAnchor":"aim for"}}}},{"section":"37题","raw":"### 37题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D保留。\n\n这一轮留下A和D。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。","html":"<h3>37题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮留下A和D。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n","articleRects":[[227,636,938,35],[167,680,846,34],[227,723,934,34],[167,766,998,35],[167,809,994,35],[167,852,884,36]],"questionRects":[[187,474,991,36],[233,527,370,34],[233,580,405,34],[233,633,421,34],[233,686,404,34]],"meta":{"kind":"result","qid":"37"}},{"section":"38题","raw":"## 38题\n\n> It can be inferred from Paragraphs 5 and 6 that a “legacy product” ______.  \n> 根据第五、六段可以推断，“传统保留产品”会怎么样？\n\n题干明确限定Paragraphs 5 and 6，所以直接按范围读取第五、六段。先看legacy product怎样形成，再看它面向谁、怎样收费。\n\n> 原文参考：\n>\n> Sometimes that’s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. “It was seen as a blunder,” he said. The move turned out to be **[xxx]**. And if Peretti were in charge at the Times? “I wouldn’t pick a year to end print,” he said. “I would raise prices and make it into more of a **[xxx]** product.”\n>\n> 开始精读：\n>\n> Sometimes that’s worth making a change anyway. / Peretti gives the example of Netflix discontinuing its DVD-mailing service / to focus on streaming. / “It was seen as a blunder,” he said. / The move turned out to be **[xxx]**. / And if Peretti were in charge at the Times? / “I wouldn’t pick a year to end print,” he said. / “I would raise prices / and make it into more of a **[xxx]** product.”\n>\n> 顺着英文顺序读：\n>\n> 有时无论如何这种改变也值得做 / 佩雷蒂举了Netflix停止光盘邮寄服务的例子 / 转而专注流媒体 / “当时它被看作一次失误” / 后来证明这一举动很 **[xxx]** / 如果佩雷蒂负责《纽约时报》呢 / “我不会选定某一年结束纸质版” / “我会提高价格” / 并把它变成更像一种 **[xxx]** 产品\n\n> 原文参考：\n>\n> The most loyal customers would still get the product they favor, the idea goes, and they’d feel like they were helping sustain the quality of something they believe in. “So if you’re overpaying for print, you could feel like you were helping,” Peretti said. “Then increase it at a higher rate each year and essentially try to generate additional revenue.” In other words, if you’re going to make a print product, make it for the people who are already **[xxx]** with it. Which may be what the Times is doing already. Getting the print edition seven days a week costs nearly $500 a year—more than twice as much as a digital-only subscription.\n>\n> 开始精读：\n>\n> The most loyal custome
