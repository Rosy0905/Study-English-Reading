e’re going to have 这类问题 / where we have 正在做的事 / that don’t make sense when the 市场变化 and the 世界变化. / 在这些情况下, / it’s better to be 更积极果断 than 不那么积极果断.”</p>\n</div></div><div class=\"coarseStack\"><div class=\"coarsePara coarseDone\"><p>1、一天到来、纽约时报、刊登报道、新闻纸、确切何时、仍有争议。</p>\n</div><div class=\"coarsePara coarseDone\"><p>2、纸墨、页面、充分、纸质版、实体报纸、印刷机、送货卡车、昂贵、纯网络竞争者、财务限制、读者、纸质收入。</p>\n</div><div class=\"coarsePara coarseDone\"><p>3、运营成本、很高、纸质版、一个错误。</p>\n</div><div class=\"coarsePara coarseDone\"><p>4、纽约时报、纸质业务、正确方式、这一转型、合理、最忠诚顾客、非常不满。</p>\n</div><div class=\"coarsePara coarseDone\"><p>5、作出改变、佩雷蒂、网飞、光盘邮寄服务、流媒体、一次失误、这一举动、纽约时报、结束纸质版、提高价格、产品。</p>\n</div><div class=\"coarsePara coarseDone\"><p>6、最忠诚顾客、喜欢的产品、维持品质、为纸质版多付钱、提高价格、每年、额外收入、纸质产品、这些人、每周七天、每年500美元、纯数字订阅。</p>\n</div><div class=\"coarsePara currentFocus\"><p>7、一件很难的事、幸运、巴兹菲德、传统业务、佩雷蒂、这类问题、正在做的事、市场变化、世界变化、在这些情况下、更积极果断、不那么积极果断。</p>\n</div></div><p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到《纽约时报》、纸质成本、佩雷蒂、传统保留产品或忠诚顾客时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头出现一天到来、《纽约时报》、新闻纸和时间争议；接着出现实体报纸、印刷机、送货卡车、昂贵、竞争者、读者和纸质收入；后面又出现运营成本、纸质版错误、转型、忠诚顾客、网飞、涨价、额外收入、传统业务和更积极果断。</p>\n<p>到这里还不能自然地说清楚：《纽约时报》为什么考虑停印，昂贵成本与收入下降怎样放在一起，为什么匆忙停印又是错误，佩雷蒂所说的正确方式具体是什么，网飞例子与纸质版有什么联系，忠诚顾客为什么愿意多付钱，以及最后的积极果断要落到哪一种做法。粗读时只要能判断“文章大概在谈纸质报纸面对变化时怎样处理”，并知道成本、转型、顾客和涨价大约出现在哪几段，就已经够用了。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。这里也是一样，先记住迟早停印、昂贵成本、不能匆忙、转型、网飞、忠诚顾客、涨价和更积极果断；这些碎片之间到底是什么关系，等题目问到再精读。</p>\n<h1>3. 开始做36至39题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n<hr />\n<h2>36题</h2>\n<blockquote>\n<p>The New York Times is considering ending its print edition partly due to ______.<br />\n《纽约时报》考虑结束纸质版，部分原因是什么？</p>\n</blockquote>\n<p>题干点名The New York Times，因此先读第一段，看它提出了什么变化；但空格问的是结束纸质版的原因，理由紧接在后一段，所以把相邻的第二段也完整读完。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>There will <span class=\"mask\">[xxx]</span> come a day when The New York Times <span class=\"mask\">[xxx]</span> to publish stories on newsprint. Exactly when that day will be is a matter of debate. “Sometime in the future,” the paper’s publisher said back in 2010.</p>\n<p>开始精读：</p>\n<p>There will <span class=\"mask\">[xxx]</span> come a day / when The New York Times <span class=\"mask\">[xxx]</span> to publish stories on newsprint. / Exactly when that day will be is a matter of debate. / “Sometime in the future,” / the paper’s publisher said back in 2010.</p>\n<p>顺着英文顺序读：</p>\n<p>终究会 <span class=\"mask\">[xxx]</span> 有一天 / 届时《纽约时报》将 <span class=\"mask\">[xxx]</span> 在新闻纸上刊登报道 / 那一天究竟何时到来仍有争议 / “未来某个时候” / 该报出版商早在2010年就这样说</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p><span class=\"mask\">[xxx]</span> for ink on paper and the <span class=\"mask\">[xxx]</span> of pages aside, there’s plenty of <span class=\"mask\">[xxx]</span> to <span class=\"mask\">[xxx]</span> print. The <span class=\"mask\">[xxx]</span> required to make a physical newspaper—printing presses, delivery trucks—isn’t just expensive; it’s <span class=\"mask\">[xxx]</span> at a time when online-only competitors don’t have the same set of financial constraints. Readers are migrating away from print anyway. And though print ad sales still <span class=\"mask\">[xxx]</span> their online and mobile <span class=\"mask\">[xxx]</span>, revenue from print is still declining.</p>\n<p>开始精读：</p>\n<p><span class=\"mask\">[xxx]</span> for ink on paper and the <span class=\"mask\">[xxx]</span> of pages aside, / there’s plenty of <span class=\"mask\">[xxx]</span> to <span class=\"mask\">[xxx]</span> print. / The <span class=\"mask\">[xxx]</span> required to make a physical newspaper—printing presses, delivery trucks— / isn’t just expensive; it’s <span class=\"mask\">[xxx]</span> / at a time when online-only competitors don’t have the same set of financial constraints. / Readers are migrating away from print anyway. / And though print ad sales still <span class=\"mask\">[xxx]</span> their online and mobile <span class=\"mask\">[xxx]</span>, / revenue from print is still declining.</p>\n<p>顺着英文顺序读：</p>\n<p>先不谈对纸墨的 <span class=\"mask\">[xxx]</span> 和翻页的 <span class=\"mask\">[xxx]</span> / 放弃纸质版有充分的 <span class=\"mask\">[xxx]</span> / 制作实体报纸所需的 <span class=\"mask\">[xxx]</span>——印刷机和送货卡车—— / 不仅昂贵而且 <span class=\"mask\">[xxx]</span> / 因为网络竞争者没有同样的财务限制 / 读者本来也在离开纸质版 / 虽然纸质广告销售仍 <span class=\"mask\">[xxx]</span> 网络和移动端的 <span class=\"mask\">[xxx]</span> / 但纸质收入仍在下降</p>\n</blockquote>\n<p>前两段把未来停印的设想与纸质业务的现实压力接了起来，空格要补的是其中一个明确原因。</p>\n<h3>A. the increasing online ad sales</h3>\n<blockquote>\n<p>不断增长的网络广告销售额</p>\n</blockquote>\n<p>把A接回题干，它说的是：《纽约时报》考虑结束纸质版，是因为网络广告销售额不断增长。</p>\n<p>A里的“increasing online ad sales”和原文“revenue from print is still declining”都在解释纸质业务的收入压力，因为选项把原因放在网络广告增长，原文明确写的是纸质收入下降，所以回看第二段最后两句。</p>\n<blockquote>\n<p>And though print ad sales still <span class=\"mask\">[xxx]</span> their online and mobile <span class=\"mask\">[xxx]</span>, revenue from print is still declining.</p>\n</blockquote>\n<p>原文“revenue from print is still declining”写得很明确：纸质收入仍在下降。A的“increasing online ad sales”却把原因改成网络广告销售额上升。一个给出纸质端的下降，一个给出网络端的增长。</p>\n<p>前半句还说纸质广告销售仍与网络和移动端形成某种较强比较，这个比较动作被遮住，但没有出现online ad sales正在increase的时间趋势。读者迁移到网络也不能自动等于网络广告销售增长。</p>\n<p>A若成立，段中需要直接比较网络广告收入前后变化，或说明网络广告增长挤压纸质版；现在真正写出的收入趋势只有print revenue declining。</p>\n<p><strong>“纸质收入下降”能不能直接改写成“increasing online ad sales”？</strong></p>\n<p>不能。两者可能同时发生，但原文只明确给出前者，A把收入项目和变化方向都换了。</p>\n<p>遮挡处涉及纸质广告与网络端的比较，不会自动补出网络广告持续增长这一事实，所以A排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. the pressure from its investors</h3>\n<blockquote>\n<p>来自投资者的压力</p>\n</blockquote>\n<p>把B接回题干，它说的是：《纽约时报》受到投资者压力，所以考虑结束纸质版。</p>\n<p>B里的“pressure from its investors”和原文“online-only competitors don’t have the same set of financial constraints”都在谈财务压力来源，因为选项说投资者施压，原文说实体报纸相对纯网络竞争者承担更多成本限制，所以回看第二段关于基础设施的句子。</p>\n<blockquote>\n<p>The <span class=\"mask\">[xxx]</span> required to make a physical newspaper—printing presses, delivery trucks—isn’t just expensive; it’s <span class=\"mask\">[xxx]</span> at a time when online-only competitors don’t have the same set of financial constraints.</p>\n</blockquote>\n<p>原文“online-only competitors don’t have the same set of financial constraints”把不利条件落在实体报纸的基础设施和竞争成本上。B的“pressure from its investors”则需要投资者作为施压主体。</p>\n<p>第二段出现的是printing presses、delivery trucks、expensive和competitors，说明纸质生产本身昂贵；没有股东、董事会、回报要求或投资者意见。B把成本结构问题改成人际或治理压力。</p>\n<p>即使企业因成本高而让投资者担忧，也需要额外一句把投资者与结束纸质版连接起来。当前段落没有这条主体关系。</p>\n<p><strong>纯网络竞争者没有同样的成本限制，是否就等于《纽约时报》受到investors施压？</strong></p>\n<p>不等于。原文的压力来自实体生产成本与竞争条件，B的压力主体是投资者。</p>\n<p>基础设施的遮挡形容词不会把competitors改成investors，也不会补出投资者行动，所以B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. the complaints from its readers</h3>\n<blockquote>\n<p>读者的抱怨</p>\n</blockquote>\n<p>把C接回题干，它说的是：《纽约时报》因为读者抱怨而考虑结束纸质版。</p>\n<p>C里的“complaints from its readers”和原文“Readers are migrating away from print”都涉及读者对纸质版的反应，因为选项说读者投诉，原文写读者用离开纸质版的行为作出选择，所以回看第二段倒数第二句。</p>\n<blockquote>\n<p>Readers are migrating away from print anyway.</p>\n</blockquote>\n<p>原文“Readers are migrating away from print”写的是读者数量或阅读习惯在迁移，是一种市场行为。C的“complaints from its readers”写的是读者主动表达不满，是另一种行动。</p>\n<p>离开纸质版可能源于价格、便利性或媒介习惯，不能自动证明读者向报社投诉。段中没有complain、protest、demand或读者要求停印的内容。</p>\n<p>更重要的是，读者迁移会削弱纸质版需求；读者抱怨却可能是抱怨停印本身。C没有说明抱怨内容，无法与原文的迁移方向合并。</p>\n<p><strong>读者正在离开纸质版，是否就等于出现了“complaints from its readers”？</strong></p>\n<p>不等于。一个是消费选择变化，一个是言语或书面投诉，动作形式不同。</p>\n<p>原文已经把读者反应写成migrating away，C改成complaints，没有后续句子支持这次改写，所以C排除。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. the high cost of <span class=\"mask\">[xxx]</span></h3>\n<blockquote>\n<p>高昂的 <span class=\"mask\">[xxx]</span> 成本</p>\n</blockquote>\n<p>把D接回题干，它说的是：《纽约时报》部分因为高昂的某类运营成本而考虑结束纸质版。</p>\n<p>D里的“high cost of”和原文“isn’t just expensive”都在解释维持实体报纸为何负担很重，因为选项概括高成本，原文列出印刷机与送货卡车并明确说昂贵，所以回看第二段关于实体报纸基础设施的句子。</p>\n<blockquote>\n<p>The <span class=\"mask\">[xxx]</span> required to make a physical newspaper—printing presses, delivery trucks—isn’t just expensive; it’s <span class=\"mask\">[xxx]</span> at a time when online-only competitors don’t have the same set of financial constraints.</p>\n</blockquote>\n<p>原文“isn’t just expensive”直接确认制作实体报纸需要高成本，并用printing presses和delivery trucks说明钱花在哪里。D的“high cost of”正把这层原因压缩成高昂的某项成本。</p>\n<p>选项中被遮住的是cost后面的具体名词，原文开头同样把制作实体报纸所需的某套东西遮住。两边都围绕实体印刷和配送的运营负担，没有把原因换成广告、投资者或读者抱怨。</p>\n<p>题干问partly due to，原文第二段列了不止一个放弃纸质版的动因，高成本正是其中之一。D不要求这是唯一原因，与partly的范围一致。</p>\n<p><strong>印刷机、送货卡车等实体报纸条件“isn’t just expensive”，能不能概括成high cost of某项运营内容？</strong></p>\n<p>能。原文明确给出昂贵的实体生产负担，D正是对这一原因的概括。</p>\n<p>具体成本名称被遮住，但高成本与纸质版之间的因果已经完整接上，没有相反信息，所以D保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>36题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮只留下D。另外三项都已经与当前读到的主体、动作、范围或方向出现明确冲突。</p>\n<h2>37题</h2>\n<blockquote>\n<p>Peretti suggests that, in face of the present situation, the Times should ______.<br />\n佩雷蒂建议，面对当前局面，《纽约时报》应该怎么做？</p>\n</blockquote>\n<p>题干点名Peretti，第三段和第四段连续出现他的判断与建议。把这两段一起完整读完，区分“不能仓促做什么”和“应该怎样推进”。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Overhead may be high and <span class=\"mask\">[xxx]</span> lower, but rushing to <span class=\"mask\">[xxx]</span> its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.</p>\n<p>开始精读：</p>\n<p>Overhead may be high and <span class=\"mask\">[xxx]</span> lower, / but rushing to <span class=\"mask\">[xxx]</span> its print edition would be a mistake, / says BuzzFeed CEO Jonah Peretti.</p>\n<p>顺着英文顺序读：</p>\n<p>运营成本可能很高而 <span class=\"mask\">[xxx]</span> 更低 / 但是匆忙 <span class=\"mask\">[xxx]</span> 纸质版会是一个错误 / BuzzFeed首席执行官乔纳·佩雷蒂这样说</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>Peretti says the Times shouldn’t waste time getting out of the print business, but only if they go about doing it the right way. “Figuring out a way to <span class=\"mask\">[xxx]</span> that transition would make sense for them,” he said, “but if you <span class=\"mask\">[xxx]</span> it, you’re going to have your most loyal customers really upset with you.”</p>\n<p>开始精读：</p>\n<p>Peretti says the Times shouldn’t waste time getting out of the print business, / but only if they go about doing it the right way. / “Figuring out a way to <span class=\"mask\">[xxx]</span> that transition would make sense for them,” he said, / “but if you <span class=\"mask\">[xxx]</span> it, / you’re going to have your most loyal customers really upset with you.”</p>\n<p>顺着英文顺序读：</p>\n<p>佩雷蒂说《纽约时报》不应把时间浪费在退出纸质业务上 / 前提是以正确方式处理 / “找办法 <span class=\"mask\">[xxx]</span> 这一转型对他们是合理的” / “但如果你 <span class=\"mask\">[xxx]</span> 它” / 你会让最忠诚的顾客非常不满</p>\n</blockquote>\n<p>两段合起来的建议是：纸质业务需要变化，但处理方式不能伤害核心顾客；下面逐项核对。</p>\n<h3>A. make <span class=\"mask\">[xxx]</span> adjustments</h3>\n<blockquote>\n<p>作出 <span class=\"mask\">[xxx]</span> 调整</p>\n</blockquote>\n<p>把A接回题干，它说的是：面对当前局面，《纽约时报》应当作出某种战略性调整。</p>\n<p>A里的“adjustments”和原文“accelerate that transition”都在谈《纽约时报》如何改变纸质业务，因为选项概括调整，原文建议加快转型但不要草率停印，所以回看第四段佩雷蒂的直接建议。</p>\n<blockquote>\n<p>“Figuring out a way to <span class=\"mask\">[xxx]</span> that transition would make sense for them,” he said, “but if you <span class=\"mask\">[xxx]</span> it, you’re going to have your most loyal customers really upset with you.”</p>\n</blockquote>\n<p>原文“accelerate that transition”所在位置虽被遮住，但that transition已经明确指纸质业务向新模式过渡；同时后半句提醒，若直接停掉，会惹恼最忠诚的顾客。A的“adjustments”把这种既要改变又不能猛停的做法概括为调整。</p>\n<p>第三段还说匆忙取消纸质版是mistake，第四段说要以the right way处理。两段合起来不是维持原样，也不是一次性终止，而是改变路径、速度和经营方式。</p>\n<p>A中修饰adjustments的词被遮住，所以目前不能逐字确认它强调哪种调整；但“调整”本身与transition、right way和避免直接停印完全同向。</p>\n<p><strong>既要推进transition又不能直接停印，能不能归入对现状作出adjustments？</strong></p>\n<p>能。原文要求改变处理方式而不是维持不动，A保留了这种渐进调整关系。</p>\n<p>修饰词尚未读清，但没有证据表明A要求永久停印或另找读者，因此先保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n<h3>B. end the print edition for good</h3>\n<blockquote>\n<p>永久终止纸质版</p>\n</blockquote>\n<p>把B接回题干，它说的是：《纽约时报》应当永远终止纸质版。</p>\n<p>B里的“end the print edition for good”和原文“would be a mistake”都在判断是否应立即结束纸质版，因为选项主张彻底终止，原文明确说匆忙取消是错误，所以回看第三段。</p>\n<blockquote>\n<p>rushing to <span class=\"mask\">[xxx]</span> its print edition would be a mistake</p>\n</blockquote>\n<p>原文“would be a mistake”评价的是rushing to结束纸质版这一做法，方向很清楚：面对成本与发行压力，也不能仓促停掉。B的“end the print edition for good”却把永久终止当成建议本身，两者动作方向相反。</p>\n<p>第四段进一步说，只有以正确方式推进转型才合理；直接停掉会让最忠诚顾客不满。B没有保留“处理方式”和“转型过程”，只留下最终关停。</p>\n<p>遮挡动词位于its print edition之前，但题干、句法和后文都表明它指取消或停掉纸质版。无论具体词是什么，would be a mistake已经否定了B的直接建议。</p>\n<p><strong>佩雷蒂把匆忙结束纸质版称为mistake，还会建议“end the print edition for good”吗？</strong></p>\n<p>不能。B正是原文警告不要仓促采取的动作。</p>\n<p>后文也要求以正确方式推进转型并照顾忠诚顾客，永久停印与这两层建议都相反，所以B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. seek new sources of readership</h3>\n<blockquote>\n<p>寻找新的读者来源</p>\n</blockquote>\n<p>把C接回题干，它说的是：《纽约时报》应当寻找新的读者来源。</p>\n<p>C里的“seek new sources of readership”和原文“most loyal customers”都涉及转型时要处理的读者，因为选项把重点放在开拓新读者，原文却强调不能激怒现有忠诚顾客，所以回看第四段后半句。</p>\n<blockquote>\n<p>“Figuring out a way to <span class=\"mask\">[xxx]</span> that transition would make sense for them,” he said, “but if you <span class=\"mask\">[xxx]</span> it, you’re going to have your most loyal customers really upset with you.”</p>\n</blockquote>\n<p>原文“most loyal customers”把注意力放在现有读者：转型若处理不当，会让这群人非常不满。C的“seek new sources of readership”则把动作对象换成尚未拥有的新读者。</p>\n<p>佩雷蒂在这两段讨论的是怎样退出或改造纸质业务，不是怎样扩大受众。他没有提获客渠道、年轻读者、网络流量或新的市场来源。</p>\n<p>保护现有忠诚顾客与寻找新读者并非逻辑上绝对不能同时发生，但题干问的是佩雷蒂在当前局面下提出的建议；当前建议的实际落点是调整转型方式，而不是seek new sources。</p>\n<p><strong>原文要求顾及most loyal customers，能不能改成主动seek new sources of readership？</strong></p>\n<p>不能。一个保护已有核心读者，一个开拓新的读者来源，动作对象不同。</p>\n<p>这两段没有任何拓展读者的措施，C把经营转型问题换成获客问题，因此C排除。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. aim for <span class=\"mask\">[xxx]</span> management</h3>\n<blockquote>\n<p>以 <span class=\"mask\">[xxx]</span> 管理为目标</p>\n</blockquote>\n<p>把D接回题干，它说的是：《纽约时报》应当以某种高效或妥善的管理方式处理当前局面。</p>\n<p>D里的“aim for”和原文“go about doing it the right way”都在谈转型的管理目标，因为选项要求以某种管理为目标，原文说只有以正确方式做才不必退出纸质业务，所以回看第四段第一句。</p>\n<blockquote>\n<p>Peretti says the Times shouldn’t waste time getting out of the print business, but only if they go about doing it the right way.</p>\n</blockquote>\n<p>原文“go about doing it the right way”强调管理和执行方式必须正确，D的“aim for”后面接一个被遮住的management，也是在概括应当追求某种管理状态。两边都没有主张立即停印。</p>\n<p>D比A更抽象：它没有直接写transition、价格或顾客，只把the right way概括成某类management。这样的概括未必精确，但目前也没有和原句发生主体、对象或方向冲突。</p>\n<p>被遮住的词决定management究竟是哪一种管理。若它对应高效、妥善或更有策略的处理方式，就能与the right way接上；现有文字还不足以把这种可能排除。</p>\n<p><strong>“go about doing it the right way”能不能暂时概括成aim for某种management？</strong></p>\n<p>还不能排除。两边都在要求用合适方式管理转型，而不是简单终止纸质版。</p>\n<p>D缺少A那样明确的transition动作，但这种不足尚未形成与原文相反的关系，因此第一次也先保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n<h3>37题第一次结果</h3>\n<ul>\n<li>A保留。</li>\n<li>B排除。</li>\n<li>C排除。</li>\n<li>D保留。</li>\n</ul>\n<p>这一轮留下A和D。两项都还有一条局部理由能接上，目前没有必要强行二选一；先把第一次结果冻结，等全文主旨形成后再用新的判断标准回查。</p>\n<h2>38题</h2>\n<blockquote>\n<p>It can be inferred from Paragraphs 5 and 6 that a “legacy product” ______.<br />\n根据第五、六段可以推断，“传统保留产品”会怎么样？</p>\n</blockquote>\n<p>题干明确限定Paragraphs 5 and 6，所以直接按范围读取第五、六段。先看legacy product怎样形成，再看它面向谁、怎样收费。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>Sometimes that’s worth making a change anyway. Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming. “It was seen as a blunder,” he said. The move turned out to be <span class=\"mask\">[xxx]</span>. And if Peretti were in charge at the Times? “I wouldn’t pick a year to end print,” he said. “I would raise prices and make it into more of a <span class=\"mask\">[xxx]</span> product.”</p>\n<p>开始精读：</p>\n<p>Sometimes that’s worth making a change anyway. / Peretti gives the example of Netflix discontinuing its DVD-mailing service / to focus on streaming. / “It was seen as a blunder,” he said. / The move turned out to be <span class=\"mask\">[xxx]</span>. / And if Peretti were in charge at the Times? / “I wouldn’t pick a year to end print,” he said. / “I would raise prices / and make it into more of a <span class=\"mask\">[xxx]</span> product.”</p>\n<p>顺着英文顺序读：</p>\n<p>有时无论如何这种改变也值得做 / 佩雷蒂举了Netflix停止光盘邮寄服务的例子 / 转而专注流媒体 / “当时它被看作一次失误” / 后来证明这一举动很 <span class=\"mask\">[xxx]</span> / 如果佩雷蒂负责《纽约时报》呢 / “我不会选定某一年结束纸质版” / “我会提高价格” / 并把它变成更像一种 <span class=\"mask\">[xxx]</span> 产品</p>\n</blockquote>\n<blockquote>\n<p>原文参考：</p>\n<p>The most loyal customers would still get the product they favor, the idea goes, and they’d feel like they were helping sustain the quality of something they believe in. “So if you’re overpaying for print, you could feel like you were helping,” Peretti said. “Then increase it at a higher rate each year and essentially try to generate additional revenue.” In other words, if you’re going to make a print product, make it for the people who are already <span class=\"mask\">[xxx]</span> with it. Which may be what the Times is doing already. Getting the print edition seven days a week costs nearly $500 a year—more than twice as much as a digital-only subscription.</p>\n<p>开始精读：</p>\n<p>The most loyal customers would still get the product they favor, / the idea goes, / and they’d feel like they were helping sustain the quality of something they believe in. / “So if you’re overpaying for print, / you could feel like you were helping,” Peretti said. / “Then increase it at a higher rate each year / and essentially try to generate additional revenue.” / In other words, if you’re going to make a print product, / make it for the people who are already <span class=\"mask\">[xxx]</span> with it. / Which may be what the Times is doing already. / Getting the print edition seven days a week costs nearly $500 a year— / more than twice as much as a digital-only subscription.</p>\n<p>顺着英文顺序读：</p>\n<p>最忠诚的顾客仍会得到自己喜欢的产品 / 这种想法认为 / 他们会觉得自己在帮助维持所信任事物的品质 / “所以即便为纸质版多付钱” / 你也会觉得自己在帮忙 / “然后每年以更高幅度涨价” / 并设法产生更多收入 / 换句话说，如果要做纸质产品 / 就为那些已经对它 <span class=\"mask\">[xxx]</span> 的人制作 / 这也许正是《纽约时报》已经在做的 / 每周七天纸质版接近每年500美元 / 是纯数字订阅价格的两倍多</p>\n</blockquote>\n<p>这两段已经把传统保留产品的定价、顾客和收入方式写清，下面检查四项推断。</p>\n<h3>A. helps restore the glory of former times</h3>\n<blockquote>\n<p>帮助恢复往日荣光</p>\n</blockquote>\n<p>把A接回题干，它说的是：传统保留产品能帮助恢复往日的辉煌。</p>\n<p>A里的“restore the glory of former times”和原文“raise prices and make it into”都在说明纸质版被改成传统保留产品后的目的，因为选项说恢复旧日荣光，原文说提高价格并重新定位，所以回看第五段末尾。</p>\n<blockquote>\n<p>“I would raise prices and make it into more of a <span class=\"mask\">[xxx]</span> product.”</p>\n</blockquote>\n<p>原文“raise prices and make it into”写的是经营重定位：不规定某年停印，而是涨价，把纸质版变成另一类产品。A的“restore the glory of former times”则要求这种产品把过去的辉煌重新带回来。</p>\n<p>第五、六段没有回顾纸媒黄金时代，也没有说销量、影响力或社会地位会恢复。后文只谈忠诚顾客愿意多付钱以及由此增加收入。</p>\n<p>传统保留产品可能带有怀旧色彩，但“保留旧产品”与“恢复旧日辉煌”不是同一结果。A把小众维持扩大成整体复兴。</p>\n<p><strong>涨价并把纸质版重新定位，是否就等于restore the glory of former times？</strong></p>\n<p>不等于。原文目标是让纸质版以新价格面向核心顾客继续存在，不是恢复过去的规模和荣耀。</p>\n<p>A需要复兴销量或地位的内容，两个段落都没有，因此A排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. is meant for the most <span class=\"mask\">[xxx]</span> customers</h3>\n<blockquote>\n<p>面向最 <span class=\"mask\">[xxx]</span> 的顾客</p>\n</blockquote>\n<p>把B接回题干，它说的是：传统保留产品是为最忠诚的一批顾客准备的。</p>\n<p>B里的“is meant for the most”和原文“The most loyal customers”都在界定这种产品面向谁，因为选项说它服务最某类顾客，原文直接把后续方案落到最忠诚顾客，所以回看第六段开头和“In other words”后的句子。</p>\n<blockquote>\n<p>The most loyal customers would still get the product they favor, the idea goes, and they’d feel like they were helping sustain the quality of something they believe in. ... In other words, if you’re going to make a print product, make it for the people who are already <span class=\"mask\">[xxx]</span> with it.</p>\n</blockquote>\n<p>原文“The most loyal customers”直接给出目标人群，后面又说纸质产品应为已经与它有深厚关系的人制作。B的“is meant for the most”同样把legacy product定义成面向最某类顾客。</p>\n<p>第五段的涨价方案会缩小大众购买意愿，第六段则说明核心顾客仍能获得喜欢的产品，并觉得自己在维持其品质。这不是追求更广泛流行，而是把产品留给忠诚度最高的人。</p>\n<p>B中具体形容词被遮住，但the most与customers保留了最高程度和顾客对象；原文恰好出现The most loyal customers，结构与含义都能接上。</p>\n<p><strong>原文把产品留给The most loyal customers，能不能说明它“is meant for the most某类customers”？</strong></p>\n<p>能。目标人群、最高程度以及产品用途都与原文一致。</p>\n<p>遮挡词很可能决定顾客的具体特征，但没有改变“传统保留产品面向核心忠诚顾客”这一关系，所以B保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n<h3>C. will have the cost of printing reduced</h3>\n<blockquote>\n<p>会降低印刷成本</p>\n</blockquote>\n<p>把C接回题干，它说的是：传统保留产品会让印刷成本降低。</p>\n<p>C里的“cost of printing reduced”和原文“increase it at a higher rate each year”都涉及纸质产品的价格与成本，因为选项说印刷成本下降，原文说向顾客收取的价格逐年提高，所以回看第六段中佩雷蒂的报价方案。</p>\n<blockquote>\n<p>“Then increase it at a higher rate each year and essentially try to generate additional revenue.”</p>\n</blockquote>\n<p>原文“increase it at a higher rate each year”承接前面的overpaying for print，写的是订阅价格继续上涨，以产生额外收入。C的“cost of printing reduced”写的是生产端印刷成本下降。</p>\n<p>一个变量是顾客支付价格，一个变量是报社生产成本；即使涨价能改善利润，也不等于printing cost本身降低。原文没有减少印刷机、配送或纸张开支的措施。</p>\n<p>C还把increase改成reduced，表面方向相反，但更根本的差别是对象换了：原文提高收费，C降低成本。</p>\n<p><strong>逐年提高纸质版价格以增加收入，是否等于让cost of printing reduced？</strong></p>\n<p>不等于。价格上涨和印刷成本下降是两个不同财务项目。</p>\n<p>第五、六段没有任何降本动作，C既换了对象又换了方向，因此C排除。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n<h3>D. expands the popularity of the paper</h3>\n<blockquote>\n<p>扩大报纸的受欢迎程度</p>\n</blockquote>\n<p>把D接回题干，它说的是：传统保留产品会扩大报纸的受欢迎程度。</p>\n<p>D里的“expands the popularity”和原文“The most loyal customers”都在判断纸质版改造后会覆盖多大人群，因为选项说扩大大众欢迎度，原文却把产品集中给最忠诚的现有顾客，所以回看第六段开头。</p>\n<blockquote>\n<p>The most loyal customers would still get the product they favor, the idea goes, and they’d feel like they were helping sustain the quality of something they believe in.</p>\n</blockquote>\n<p>原文“The most loyal customers”把受众缩到一个核心小群体，他们愿意为喜欢的产品多付钱。D的“expands the popularity”则要求纸质版在更大范围内变得更受欢迎。</p>\n<p>后文还说产品要为已经与它有深厚关系的人制作，价格接近纯数字订阅的两倍。这种高价、小众定位更像维持忠诚群体，而不是扩大普及率。</p>\n<p>D把“保留最忠诚顾客”改成“扩大所有人的欢迎度”，范围方向相反；没有任何新增读者或扩大销量的内容。</p>\n<p><strong>面向The most loyal customers的高价产品，能不能被说成expands the popularity？</strong></p>\n<p>不能。原文收窄目标人群，D却扩大受欢迎范围。</p>\n<p>涨价和小众定位都不会直接产生大众普及，D与第五、六段的经营方向不一致，所以D排除。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>38题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B保留。</li>\n<li>C排除。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只留下B。另外三项都已经与当前读到的主体、动作、范围或方向出现明确冲突。</p>\n<h2>39题</h2>\n<blockquote>\n<p>Peretti believes that, in a changing world, ______.<br />\n佩雷蒂认为，在不断变化的世界里，什么说法成立？</p>\n</blockquote>\n<p>题干再次点名Peretti，并把条件限定为a changing world。最后一段正是他对市场和世界变化的总结，因此完整读最后一段。</p>\n<blockquote>\n<p>原文参考：</p>\n<p>“It’s a really hard thing to do and it’s a <span class=\"mask\">[xxx]</span> luxury that BuzzFeed doesn’t have a legacy business,” Peretti remarked. “But we’re going to have questions like that where we have things we’re doing that don’t make sense when the market changes and the world changes. In those situations, it’s better to be more aggressive than less aggressive.”</p>\n<p>开始精读：</p>\n<p>“It’s a really hard thing to do / and it’s a <span class=\"mask\">[xxx]</span> luxury / that BuzzFeed doesn’t have a legacy business,” Peretti remarked. / “But we’re going to have questions like that / where we have things we’re doing / that don’t make sense when the market changes and the world changes. / In those situations, / it’s better to be more aggressive than less aggressive.”</p>\n<p>顺着英文顺序读：</p>\n<p>“这确实是一件很难做的事” / 而BuzzFeed没有传统业务是一种 <span class=\"mask\">[xxx]</span> 的幸运 / 佩雷蒂这样评论 / “但我们会遇到这类问题” / 我们正在做的一些事情 / 当市场和世界变化时已经不再合理 / 在这些情况下 / 更积极果断比不那么积极果断更好</p>\n</blockquote>\n<p>空格要补的是佩雷蒂面对变化时的行动判断，不是对某一种纸质方案的孤立细节。</p>\n<h3>A. traditional luxuries can stay unaffected</h3>\n<blockquote>\n<p>传统奢侈品可以不受影响</p>\n</blockquote>\n<p>把A接回题干，它说的是：在变化的世界里，传统奢侈品可以保持不受影响。</p>\n<p>A里的“stay unaffected”和原文“market changes and the world changes”都在判断环境变化会不会迫使旧做法改变，因为选项说传统事物不受影响，原文说一些做法会在变化后变得不再合理，所以回看最后一段。</p>\n<blockquote>\n<p>“But we’re going to have questions like that where we have things we’re doing that don’t make sense when the market changes and the world changes.”</p>\n</blockquote>\n<p>原文“market changes and the world changes”后面明确说原来在做的某些事情会don’t make sense，说明变化会影响旧做法的合理性。A的“stay unaffected”却说传统奢侈品可以完全不受影响。</p>\n<p>佩雷蒂之所以提出涨价、重定位和更积极行动，正是因为维持原状不再合理。A若成立，最后一段无需讨论如何面对变化。</p>\n<p>被遮住的luxury修饰BuzzFeed没有传统业务这一状态，不改变后一句已经写明的“环境变化—旧做法失效”关系。</p>\n<p><strong>旧做法会在market changes and the world changes后不再合理，还能说它们stay unaffected吗？</strong></p>\n<p>不能。原文强调变化会迫使企业重新判断旧业务，A则否定这种影响。</p>\n<p>最后一句要求更积极应对，也进一步表明不能指望传统事物自动保持原样，所以A排除。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n<h3>B. cautiousness facilitates problem-solving</h3>\n<blockquote>\n<p>谨慎有助于解决问题</p>\n</blockquote>\n<p>把B接回题干，它说的是：谨慎能帮助解决变化中的问题。</p>\n<p>B里的“cautiousness”和原文“more aggressive than less aggressive”都在比较面对变化时应采取的行动强度，因为选项推崇谨慎，原文明确偏向更积极果断，所以回看最后一句。</p>\n<blockquote>\n<p>In those situations, it’s better to be more aggressive than less aggressive.</p>\n</blockquote>\n<p>原文“more aggressive than less aggressive”直接比较两种行动方式，并选择更积极的一边。B的“cautiousness”则把更谨慎、更保守的行动写成解决问题的有利条件，两者方向相反。</p>\n<p>这里不是说任何时候都要鲁莽，而是在市场和世界变化、旧做法不再合理的situations中，拖延和过度谨慎更可能让问题继续。B把作者给出的行动偏好反过来。</p>\n<p>原句没有遮挡决定比较方向的better、more和less，因此这条分叉已经读清。</p>\n<p><strong>作者说more aggressive更好，能不能改成cautiousness facilitates problem-solving？</strong></p>\n<p>不能。B选择谨慎，原文选择更积极果断，比较方向相反。</p>\n<p>两者针对的是同一变化情境，不能靠其他遮挡词调和，所以B排除。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n<h3>C. aggressiveness better meets challenges</h3>\n<blockquote>\n<p>更积极果断才能更好应对挑战</p>\n</blockquote>\n<p>把C接回题干，它说的是：更积极果断的行动更能应对变化带来的挑战。</p>\n<p>C里的“aggressiveness better meets challenges”和原文“better to be more aggressive”直接使用相同的比较方向，因为选项概括积极行动更能应对挑战，原文在变化情境中明确说更积极比不积极好，所以回看最后一句。</p>\n<blockquote>\n<p>In those situations, it’s better to be more aggressive than less aggressive.</p>\n</blockquote>\n<p>原文“better to be more aggressive”给出作者清楚的行动判断：遇到市场和世界变化造成的不合理做法，应当更积极。C的“aggressiveness better meets challenges”把这一判断概括为积极果断更适合应对挑战。</p>\n<p>选项中的challenges对应前一句的questions以及旧做法don’t make sense；better meets对应原文better to be。主体、情境和比较方向都没有改变。</p>\n<p>C没有把more aggressive夸大成无条件冒险，而是保留“在变化世界中应对问题”这一条件，因此可以直接接回题干。</p>\n<p><strong>“better to be more aggressive”能不能说明aggressiveness better meets challenges？</strong></p>\n<p>能。C只是把原句的情境和行动偏好换成更概括的表达，方向完全一致。</p>\n<p>最后一段没有相反限制，也没有把积极行动缩回谨慎等待，因此C保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n<h3>D. legacy businesses are becoming outdated</h3>\n<blockquote>\n<p>传统业务正在变得过时</p>\n</blockquote>\n<p>把D接回题干，它说的是：传统业务正在变得过时。</p>\n<p>D里的“legacy businesses are becoming outdated”和原文“things we’re doing that don’t make sense”都在谈旧业务面对变化时可能出现的问题，因为选项判断整个传统业务正在过时，原文只说某些正在做的事情会变得不合理，所以回看最后一段中间。</p>\n<blockquote>\n<p>“But we’re going to have questions like that where we have things we’re doing that don’t make sense when the market changes and the world changes.”</p>\n</blockquote>\n<p>原文“things we’re doing that don’t make sense”把问题限定在一些具体做法：环境变化后，这些做法可能需要调整。D的“legacy businesses are becoming outdated”却把判断扩大到整个传统业务正在过时。</p>\n<p>佩雷蒂并没有主张传统业务一律消失。前文恰恰提出把纸质版做成高价保留产品，让传统业务以另一种方式继续存在。D的整体淘汰判断与这种重定位思路不一致。</p>\n<p>原文说的是某些行为在特定变化下失去合理性，D加入becoming的持续趋势，又把部分做法上升为整个业务类别。</p>\n<p><strong>“有些做法不再合理”是否就等于所有legacy businesses are becoming outdated？</strong></p>\n<p>不等于。原文针对部分做法，D针对整个业务；原文允许重新定位后继续，D则宣布整体过时。</p>\n<p>范围和趋势都被D扩大，最后一段没有支持这种整体结论，所以D排除。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n<h3>39题第一次结果</h3>\n<ul>\n<li>A排除。</li>\n<li>B排除。</li>\n<li>C保留。</li>\n<li>D排除。</li>\n</ul>\n<p>这一轮只留下C。另外三项都已经与当前读到的主体、动作、范围或方向出现明确冲突。</p>\n<h2>40题</h2>\n<p><strong>Which of the following would be the best title of the text?</strong></p>\n<p>下面哪一项最适合作为本文标题？</p>\n<p>这是全文作者观点 / 全文主旨题。</p>\n<p>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。</p>\n<p>选项：</p>\n<p>A. <strong>Shift to Online Newspapers All at Once</strong></p>\n<p>立刻全面转向网络报纸</p>\n<p>B. <strong>Cherish the Newspaper Still in Your Hand</strong></p>\n<p>珍惜你手中的纸质报纸</p>\n<p>C. <strong>Keep Your Newspapers Forever in Fashion</strong></p>\n<p>让纸质报纸永远流行</p>\n<p>D. <strong>Make Your Print Newspaper a Luxury Good</strong></p>\n<p>把纸质报纸做成奢侈品</p>\n<h3>用写作视角确定主旨的方法分析每个选项</h3>\n<p>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>作者这一段在做什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>提出《纽约时报》终有一天会停止纸质出版，但具体时间仍有争议</td>\n  <td>先摆出一个迟早会到来的变化</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>说明实体报纸需要昂贵基础设施，又面对读者迁移和纸质收入下降</td>\n  <td>回头解释维持原样为什么越来越难</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>转折指出成本虽高、发行虽低，仓促取消纸质版仍是错误</td>\n  <td>但话说回来立刻停下也不对</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>佩雷蒂建议用正确方式加快转型，避免直接停印伤害最忠诚顾客</td>\n  <td>接着提出一种渐进调整办法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>以网飞停止DVD邮寄转向流媒体为例，并提出不设停印年份而是涨价、把纸质版改造成保留产品</td>\n  <td>再举一个例子说明转向也能成功</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>说明忠诚顾客可继续获得喜爱的产品并支持其品质，报社则通过持续涨价增加收入，纸质版成为面向既有拥护者的高价产品</td>\n  <td>然后说明怎样保住核心价值</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>总结传统业务转型很难，但市场和世界变化时，企业应更积极果断地处理不再合理的做法</td>\n  <td>最后说环境变化时要更果断</td>\n</tr>\n</tbody>\n</table>\n<p>先不急着看四个标题。把第三列单独留下，可以看到全文每一步都在为后面的处理办法服务。接下来把A—D分别代入，同一条逻辑骨架不变，只检查每段内容是否真会这样写。</p>\n<h3>A. Shift to Online Newspapers All at Once</h3>\n<blockquote>\n<p>立刻全面转向网络报纸</p>\n</blockquote>\n<p>如果A是主旨，全文每一段都应当沿着A所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 A 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先宣布必须立刻全面停止纸质出版并转向网络</td>\n  <td>先摆出一个迟早会到来的变化</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>回头列出所有支持立即停印的成本与收入理由</td>\n  <td>回头解释维持原样为什么越来越难</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>但话说回来只短暂承认停印可能有一点风险</td>\n  <td>但话说回来立刻停下也不对</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>接着给出一次性关闭纸质版的具体日期和操作步骤</td>\n  <td>接着提出一种渐进调整办法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举例证明突然取消旧服务总能立刻成功</td>\n  <td>再举一个例子说明转向也能成功</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>然后说明怎样把全部顾客一次转移到网络端</td>\n  <td>然后说明怎样保住核心价值</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求面对变化立即切断所有传统业务</td>\n  <td>最后说环境变化时要更果断</td>\n</tr>\n</tbody>\n</table>\n<p>A只抓住“终有一天停止纸质出版”，却把文章反复强调的渐进转型改成“一次完成”。第三段明确说匆忙取消是错误，第四段也警告直接停掉会惹恼忠诚顾客。\n网飞例子并不是证明所有旧业务都应立即切断，而是说明转型可能值得做；佩雷蒂随后马上提出不设某个停印年份，而是提高价格、改变产品定位。\nA无法解释第五、六段为何花大量篇幅设计高价纸质产品。若要all at once，这些过渡安排都没有必要。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>B. Cherish the Newspaper Still in Your Hand</h3>\n<blockquote>\n<p>珍惜你手中的纸质报纸</p>\n</blockquote>\n<p>如果B是主旨，全文每一段都应当沿着B所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 B 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先抒发对终将消失的纸质报纸的惋惜</td>\n  <td>先摆出一个迟早会到来的变化</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>回头写纸墨、翻页和实体阅读为何值得保存</td>\n  <td>回头解释维持原样为什么越来越难</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>但话说回来承认数字媒介有一些便利</td>\n  <td>但话说回来立刻停下也不对</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>接着号召读者继续购买并珍惜手中报纸</td>\n  <td>接着提出一种渐进调整办法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举例写人们怎样因怀旧而保留旧媒介</td>\n  <td>再举一个例子说明转向也能成功</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>然后说明纸质报纸带来的情感和文化价值</td>\n  <td>然后说明怎样保住核心价值</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后呼吁无论环境怎样变化都不要放弃纸张</td>\n  <td>最后说环境变化时要更果断</td>\n</tr>\n</tbody>\n</table>\n<p>B把文章写成对纸质报纸的怀旧赞歌，但第二段开头只是说先把纸墨怀旧放在一边，随后集中讨论成本与收入。作者并未号召读者无条件保存纸质版。\n佩雷蒂确实想保住最忠诚顾客，但方法是涨价和小众化，不是要求所有人珍惜手中报纸。文章的重点是经营转型，不是抒情怀旧。\n最后一段还说市场变化时应更积极处理不合理做法，与“无论如何都珍惜纸质版”的静止态度相反。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>C. Keep Your Newspapers Forever in Fashion</h3>\n<blockquote>\n<p>让纸质报纸永远流行</p>\n</blockquote>\n<p>如果C是主旨，全文每一段都应当沿着C所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 C 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先提出让纸质报纸永久保持流行的目标</td>\n  <td>先摆出一个迟早会到来的变化</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>回头解释当前流行度下降的原因</td>\n  <td>回头解释维持原样为什么越来越难</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>但话说回来承认立刻停印不能解决流行问题</td>\n  <td>但话说回来立刻停下也不对</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>接着提出吸引新读者和扩大销量的办法</td>\n  <td>接着提出一种渐进调整办法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举例说明旧产品怎样重新赢得大众市场</td>\n  <td>再举一个例子说明转向也能成功</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>然后说明怎样降低价格并提高普及率</td>\n  <td>然后说明怎样保住核心价值</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求不断追逐变化以维持长期流行</td>\n  <td>最后说环境变化时要更果断</td>\n</tr>\n</tbody>\n</table>\n<p>C要求报纸永远流行，全文却承认读者迁移、纸质收入下降以及纸质版迟早停印。作者没有提出重新扩大大众销量的计划。\n第五、六段的方案是提高价格，把纸质版留给已经深爱它的核心顾客。这会把产品做得更小众，而不是维持普遍流行。\n标题中的Forever也与第一段的eventually ceases正面冲突，C无法容纳文章的时间判断。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>D. Make Your Print Newspaper a Luxury Good</h3>\n<blockquote>\n<p>把纸质报纸做成奢侈品</p>\n</blockquote>\n<p>如果D是主旨，全文每一段都应当沿着D所规定的中心推进。</p>\n<table>\n<thead>\n<tr>\n  <th>段落</th>\n  <th>如果 D 对，这段应该写什么</th>\n  <th>逻辑</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1</td>\n  <td>先提出纸质版迟早会退出大众日常消费</td>\n  <td>先摆出一个迟早会到来的变化</td>\n</tr>\n<tr>\n  <td>2</td>\n  <td>回头解释昂贵成本、读者迁移和收入下降为何使旧模式难以维持</td>\n  <td>回头解释维持原样为什么越来越难</td>\n</tr>\n<tr>\n  <td>3</td>\n  <td>但话说回来指出不能粗暴地立即停印</td>\n  <td>但话说回来立刻停下也不对</td>\n</tr>\n<tr>\n  <td>4</td>\n  <td>接着提出渐进转型并保护忠诚顾客</td>\n  <td>接着提出一种渐进调整办法</td>\n</tr>\n<tr>\n  <td>5</td>\n  <td>举例说明旧服务可以通过转型找到新的位置</td>\n  <td>再举一个例子说明转向也能成功</td>\n</tr>\n<tr>\n  <td>6</td>\n  <td>然后把纸质版涨价并做成面向核心拥护者的高价保留产品</td>\n  <td>然后说明怎样保住核心价值</td>\n</tr>\n<tr>\n  <td>7</td>\n  <td>最后要求环境变化时更果断地调整传统业务</td>\n  <td>最后说环境变化时要更果断</td>\n</tr>\n</tbody>\n</table>\n<p>D能覆盖全文。文章先承认纸质版迟早结束，再说明当前大众模式越来越难维持；随后拒绝仓促停印，提出涨价、照顾忠诚顾客并把纸质版重新定位为高价保留产品。\n“luxury good”准确抓住第五、六段的核心经营设计：最忠诚顾客继续获得喜欢的产品，愿意为维持其品质多付钱，报社通过逐年涨价获得额外收入。\n结尾对变化环境中更积极行动的主张，也支持把传统业务从大众产品改造成小众高价产品，而不是僵硬维持原样或一次性取消。</p>\n<p>把这张假设表与实际全文表对照，关键不是某一行能否勉强沾上，而是所有段落能否沿同一方向推进并在结尾完成同一个判断。</p>\n<h3>40题主旨结果</h3>\n<p>D能够解释文章为何既不主张立即停印，又要通过涨价、小众化和忠诚顾客把纸质版重新定位；A过于激进，B停留在怀旧，C与迟早停印和小众高价方向相反。</p>\n<blockquote>\n<p><strong>40题选D。</strong></p>\n</blockquote>\n<p>这句话就是本文后续做题的主旨底牌：</p>\n<p><strong>Make Your Print Newspaper a Luxury Good / 把纸质报纸做成奢侈品</strong></p>\n<h1>4.进阶方法：交叉验证冲全对</h1>\n<p>如果咱们能确保40题这种全文主旨类型的题目一定是对的，这里介绍一种方法，可以让咱们拿下所有不确定的选项，即交叉验证。那什么是交叉验证呢，即所有文科的一种通用手法，用多个判据去判断一个命题的正确性，如果多个依据都证明该命题是正确的，则该命题正确。为什么会有这个方法？原因就是为了解决大家的二选一选不出来的经典问题，那为什么会出现这个问题呢？因为光靠定位比对，定位句里有表达不认识，甚至选项里有表达不认识，就会出现这种情况，而单词因为遗忘问题实际上是背不完的，加上命题组每年都会加入固定的生词，因此我们需要寻找被生词干扰的判据，那就是全文主旨，如果咱们定位比对法得到两个都觉得对的选项，不妨在对自己主旨题一定有信心并且时间足够的情况下，用主旨去做交叉验证，英语考试发到草稿纸除了作文要用，其实第二个用处就是这里，主旨找对了然后交叉验证，99%的情况都能选出来正确的那个，这是我们带考研几年下来的经验之谈。最后，众所周知大家的概括能力一言难尽，因此这里我们可以直接用主旨题现成的正确的选项就行。</p>\n<h2>回查37题：A还是D？</h2>\n<p>第一遍留下：</p>\n<ul>\n<li>A. make <span class=\"mask\">[xxx]</span> adjustments</li>\n<li>D. aim for <span class=\"mask\">[xxx]</span> management</li>\n</ul>\n<p>主旨底牌是：</p>\n<blockquote>\n<p><strong>Make Your Print Newspaper a Luxury Good / 把纸质报纸做成奢侈品</strong></p>\n</blockquote>\n<p>也就是：全文不是泛泛要求把管理做得更好，而是在纸质版迟早衰退、又不能仓促停印的条件下，提出涨价、小众化并面向忠诚顾客的具体转型；现在只拿这条新依据，检查第一次没有拉开的两项。</p>\n<p>第一遍读第三、四段时，A和D都没有与局部建议冲突。A把“accelerate that transition”概括成作出调整，D把“go about doing it the right way”概括成追求某种管理。两项都有遮挡，且原文既谈转型也谈正确处理方式，所以当时没有必要凭措辞熟悉度强行选一个。</p>\n<p>我们先把题干和两个选项接起来。</p>\n<p>把题干接回来，A说《纽约时报》面对当前局面要作出某种调整；D说它要以某种管理状态为目标。A直接要求业务发生改变，D只要求管理方式达到某种性质。第三、四段的完整建议是：不要仓促停印，但要找到办法推进transition，并避免伤害忠诚顾客。前者是带方向的业务动作，后者只是对管理质量的抽象描述。</p>\n<p>现在拿主旨来检查。</p>\n<p>先看A。主旨“把纸质报纸做成奢侈品”本身就是一套战略调整：不再把纸质版当作大众低价产品，而是提高价格、逐年增收，保留给最忠诚顾客。A中的adjustments能够向后承接这些具体动作，也能向前解释为什么既不能维持原样又不能一次停掉。它把第三、四段的transition与第五、六段的涨价重定位连成一条完整路线。</p>\n<p>再看D。D若成立，全文主旨应主要讨论管理效率、组织流程、人员配置或经营控制，后文也应不断说明怎样让管理更有效。但文章真正花篇幅写的是产品定位和顾客结构：价格提高、忠诚顾客多付钱、纸质版变成高价保留产品。即使这些安排需要良好管理，“管理”也只是实现手段，不能概括佩雷蒂提出的具体方向。</p>\n<p>回到第一次局部证据，D能借the right way获得一种宽泛可能，所以当时保留没有问题；主旨提供的新区别是，全文需要一个能通向luxury good方案的动作。A能把转型、涨价和顾客重定位都装进去，D只能说“管理得好”，无法说明究竟往哪里改。</p>\n<blockquote>\n<p><strong>37题选A。</strong></p>\n</blockquote>\n<h1>5. 最终答案</h1>\n<ul>\n<li><strong>36题：D</strong> — the high cost of <span class=\"mask\">[xxx]</span>（高昂的 <span class=\"mask\">[xxx]</span> 成本）</li>\n<li><strong>37题：A</strong> — make <span class=\"mask\">[xxx]</span> adjustments（作出 <span class=\"mask\">[xxx]</span> 调整）</li>\n<li><strong>38题：B</strong> — is meant for the most <span class=\"mask\">[xxx]</span> customers（面向最 <span class=\"mask\">[xxx]</span> 的顾客）</li>\n<li><strong>39题：C</strong> — aggressiveness better meets challenges（更积极果断才能更好应对挑战）</li>\n<li><strong>40题：D</strong> — Make Your Print Newspaper a Luxury Good（把纸质报纸做成奢侈品）</li>\n</ul>\n<p>本篇答案：<strong>DABCD</strong>。</p>\n","analysisStartIndex":38,"maskInventory":{"token":"[xxx]","count":136},"twoChoiceAudit":{"schema":"strict-two-choice-cross-validation-v2","userInteractionMode":"single_conversation_direct_delivery","stage2ExecutionMode":"same_context_evidence_isolation","singleConversationContinuationRequired":true,"freshWorkerRequired":false,"firstRoundSourceBoundary":"masked_student_visible_only","ordinaryFirstRoundFrozenBeforeMainIdea":true,"mainIdeaUnavailableDuringOrdinaryFirstRound":true,"stage2WorkerFreshContext":false,"stage2PriorExposurePossible":true,"stage2EvidenceBoundaryEnforced":true,"stage2ReasoningUsedUnmaskedSource":false,"stage2ReasoningUsedAnswerKey":false,"stage2ReasoningUsedMaskMap":false,"finalAnswerCheckAfterContentFreeze":tru
