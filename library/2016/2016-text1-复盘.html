p\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>ethical persuasion\u003c/td>\n\u003ctd>道德劝说\u003c/td>\n\u003ctd>rather than\u003c/td>\n\u003ctd>而不是\u003c/td>\n\u003ctd>address\u003c/td>\n\u003ctd>v.处理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>misuse\u003c/td>\n\u003ctd>n.滥用\u003c/td>\n\u003ctd>step\u003c/td>\n\u003ctd>n.步骤\u003c/td>\n\u003ctd>better\u003c/td>\n\u003ctd>a.更好的\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>elevate notions of beauty\u003c/td>\n\u003ctd>提升美的观念\u003c/td>\n\u003ctd>material standard\u003c/td>\n\u003ctd>物质标准\u003c/td>\n\u003ctd>particular industry\u003c/td>\n\u003ctd>特定行业\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch1>2.一石五鸟第二鸟-精读带来的阅读能力提升与翻译能力提升\u003c/h1>\n\u003ch3>完整原文 · 第1段\u003c/h3>\n\u003cp>France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women. Its lawmakers gave preliminary approval last week to a law that would make it a crime to employ ultra-thin models on runways. The parliament also agreed to ban websites that &quot;incite excessive thinness&quot; by promoting extreme dieting.\u003c/p>\n\u003ch3>意群划分 · 第1段\u003c/h3>\n\u003cp>France, / which prides itself / as the global innovator of fashion, / has decided / its fashion industry / has lost an absolute right / to define physical beauty / for women.\u003c/p>\n\u003cp>Its lawmakers / gave preliminary approval / last week / to a law / that would make it a crime / to employ ultra-thin models / on runways.\u003c/p>\n\u003cp>The parliament / also agreed to ban websites / that &quot;incite excessive thinness&quot; / by promoting extreme dieting.\u003c/p>\n\u003ch3>意群翻译 · 第1段\u003c/h3>\n\u003cp>法国，/ 它自豪地认为自己 / 是时尚的全球创新者，/ 已经决定 / 它的时尚产业 / 已经失去了绝对权利 / 来定义身体美 / 对女性来说。\u003c/p>\n\u003cp>它的立法者们 / 给予了初步批准 / 上周 / 对一项法律 / 该法律将使其成为犯罪 / 雇用超瘦模特 / 在T台上。\u003c/p>\n\u003cp>议会 / 也同意禁止网站 / 那些&quot;煽动过度瘦身&quot;的 / 通过推广极端节食。\u003c/p>\n\u003ch3>标准译文 · 第1段\u003c/h3>\n\u003cp>法国一向自诩为全球时尚创新者，现在却决定其时尚产业不再拥有为女性定义身体美的绝对权利。上周，法国立法者初步批准了一项法律，将雇用超瘦模特走秀定为犯罪行为。议会还同意禁止那些通过推广极端节食来&quot;煽动过度瘦身&quot;的网站。\u003c/p>\n\u003ch3>完整原文 · 第2段\u003c/h3>\n\u003cp>Such measures have a couple of uplifting motives. They suggest beauty should not be defined by looks that end up impinging on health. That&#39;s a start. And the ban on ultra-thin models seems to go beyond protecting models from starving themselves to death – as some have done. It tells the fashion industry that it must take responsibility for the signal it sends women, especially teenage girls, about the social tape-measure they must use to determine their individual worth.\u003c/p>\n\u003ch3>意群划分 · 第2段\u003c/h3>\n\u003cp>Such measures / have a couple of uplifting motives.\u003c/p>\n\u003cp>They suggest / beauty should not be defined / by looks / that end up impinging on health.\u003c/p>\n\u003cp>That&#39;s a start.\u003c/p>\n\u003cp>And the ban on ultra-thin models / seems to go beyond / protecting models / from starving themselves to death – / as some have done.\u003c/p>\n\u003cp>It tells the fashion industry / that it must take responsibility / for the signal it sends women, / especially teenage girls, / about the social tape-measure / they must use / to determine their individual worth.\u003c/p>\n\u003ch3>意群翻译 · 第2段\u003c/h3>\n\u003cp>这些措施 / 有几个令人振奋的动机。\u003c/p>\n\u003cp>它们表明 / 美不应该被定义 / 通过外表 / 那些最终损害健康的。\u003c/p>\n\u003cp>这是一个开始。\u003c/p>\n\u003cp>并且对超瘦模特的禁令 / 似乎超越了 / 保护模特 / 免于饿死自己 – / 正如一些人已经做过的。\u003c/p>\n\u003cp>它告诉时尚产业 / 它必须承担责任 / 对于它发送给女性的信号，/ 特别是少女，/ 关于社会标尺 / 她们必须使用的 / 来确定她们的个人价值。\u003c/p>\n\u003ch3>标准译文 · 第2段\u003c/h3>\n\u003cp>这些措施有几个令人振奋的动机。它们表明，美不应该由那些最终损害健康的外表来定义。这是一个开始。对超瘦模特的禁令似乎不仅仅是为了保护模特免于饿死——正如一些模特已经发生的那样。它向时尚产业传达了一个信息：必须对其向女性，特别是少女发送的信号负责，这些信号涉及她们必须用来衡量个人价值的社会标准。\u003c/p>\n\u003ch3>完整原文 · 第3段\u003c/h3>\n\u003cp>The bans, if fully enforced, would suggest to women (and many men) that they should not let others be arbiters of their beauty. And perhaps faintly, they hint that people should look to intangible qualities like character and intellect rather than dieting their way to size zero or wasp-waist physiques.\u003c/p>\n\u003ch3>意群划分 · 第3段\u003c/h3>\n\u003cp>The bans, / if fully enforced, / would suggest to women / (and many men) / that they should not let others / be arbiters of their beauty.\u003c/p>\n\u003cp>And perhaps faintly, / they hint / that people should look to / intangible qualities / like character and intellect / rather than dieting their way / to size zero / or wasp-waist physiques.\u003c/p>\n\u003ch3>意群翻译 · 第3段\u003c/h3>\n\u003cp>这些禁令，/ 如果全面执行，/ 会向女性暗示 / （以及许多男性）/ 她们不应该让其他人 / 成为她们美丽的仲裁者。\u003c/p>\n\u003cp>也许微弱地，/ 它们暗示 / 人们应该关注 / 无形的品质 / 比如性格和智力 / 而不是通过节食 / 达到零号尺寸 / 或蜂腰体型。\u003c/p>\n\u003ch3>标准译文 · 第3段\u003c/h3>\n\u003cp>如果这些禁令得到全面执行，它们会向女性（以及许多男性）暗示，不应该让他人成为自己美丽的仲裁者。也许还隐约暗示着，人们应该关注性格和智力等无形品质，而不是通过节食来达到零号身材或蜂腰体型。\u003c/p>\n\u003ch3>完整原文 · 第4段\u003c/h3>\n\u003cp>The French measures, however, rely too much on severe punishment to change a culture that still regards beauty as skin-deep – and bone-showing. Under the law, using a fashion model that does not meet a government-defined index of body mass could result in a $85,000 fine and six months in prison.\u003c/p>\n\u003ch3>意群划分 · 第4段\u003c/h3>\n\u003cp>The French measures, however, / rely too much on / severe punishment / to change a culture / that still regards beauty / as skin-deep – / and bone-showing.\u003c/p>\n\u003cp>Under the law, / using a fashion model / that does not meet / a government-defined index / of body mass / could result in / a $85,000 fine / and six months in prison.\u003c/p>\n\u003ch3>意群翻译 · 第4段\u003c/h3>\n\u003cp>然而，法国的措施 / 过度依赖 / 严厉的惩罚 / 来改变一种文化 / 这种文化仍然认为美 / 是肤浅的 – / 以及露骨的。\u003c/p>\n\u003cp>根据该法律，/ 使用时装模特 / 不符合 / 政府定义的指数 / 身体质量的 / 可能导致 / 85,000美元的罚款 / 和六个月的监禁。\u003c/p>\n\u003ch3>标准译文 · 第4段\u003c/h3>\n\u003cp>然而，法国的措施过度依赖严厉的惩罚来改变一种仍将美视为肤浅——甚至露骨的文化。根据该法律，使用不符合政府定义的身体质量指数的时装模特，可能导致85,000美元的罚款和六个月的监禁。\u003c/p>\n\u003ch3>完整原文 · 第5段\u003c/h3>\n\u003cp>The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types. In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003ch3>意群划分 · 第5段\u003c/h3>\n\u003cp>The fashion industry / knows / it has an inherent problem / in focusing on / material adornment / and idealized body types.\u003c/p>\n\u003cp>In Denmark, / the United States, / and a few other countries, / it is trying to set / voluntary standards / for models and fashion images / that rely more on / peer pressure / for enforcement.\u003c/p>\n\u003ch3>意群翻译 · 第5段\u003c/h3>\n\u003cp>时尚产业 / 知道 / 它有一个内在问题 / 在专注于 / 物质装饰 / 和理想化的身体类型。\u003c/p>\n\u003cp>在丹麦，/ 美国，/ 和其他几个国家，/ 它正在尝试制定 / 自愿标准 / 对模特和时尚形象 / 更多地依赖 / 同行压力 / 来执行。\u003c/p>\n\u003ch3>标准译文 · 第5段\u003c/h3>\n\u003cp>时尚产业知道自己在专注于物质装饰和理想化身体类型方面存在内在问题。在丹麦、美国和其他几个国家，该行业正在尝试为模特和时尚形象制定自愿标准，这些标准更多地依靠同行压力来执行。\u003c/p>\n\u003ch3>完整原文 · 第6段\u003c/h3>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models. The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute. But in general it relies on a name-and-shame method of compliance.\u003c/p>\n\u003ch3>意群划分 · 第6段\u003c/h3>\n\u003cp>In contrast to France&#39;s actions, / Denmark&#39;s fashion industry / agreed last month / on rules and sanctions / regarding the age, health, / and other characteristics / of models.\u003c/p>\n\u003cp>The newly revised / Danish Fashion Ethical Charter / clearly states: / &quot;We are aware of / and take responsibility for / the impact / the fashion industry has / on body ideals, / especially on young people.&quot;\u003c/p>\n\u003cp>The charter&#39;s main tool / of enforcement / is to deny access / for designers and modeling agencies / to Copenhagen Fashion Week (CFW), / which is run by / the Danish Fashion Institute.\u003c/p>\n\u003cp>But in general / it relies on / a name-and-shame method / of compliance.\u003c/p>\n\u003ch3>意群翻译 · 第6段\u003c/h3>\n\u003cp>与法国的行动相比，/ 丹麦的时尚产业 / 上个月达成一致 / 关于规则和制裁 / 涉及年龄、健康，/ 和其他特征 / 模特的。\u003c/p>\n\u003cp>新修订的 / 丹麦时尚道德宪章 / 明确指出：/ &quot;我们意识到 / 并承担责任 / 对于影响 / 时尚产业所产生的 / 对身体理想，/ 特别是对年轻人。&quot;\u003c/p>\n\u003cp>宪章的主要工具 / 执行的 / 是拒绝准入 / 对设计师和模特经纪公司 / 到哥本哈根时装周（CFW），/ 它是由运营的 / 丹麦时尚协会。\u003c/p>\n\u003cp>但总的来说 / 它依赖于 / 点名批评的方法 / 合规的。\u003c/p>\n\u003ch3>标准译文 · 第6段\u003c/h3>\n\u003cp>与法国的行动相比，丹麦时尚产业上个月就模特的年龄、健康和其他特征达成了规则和制裁协议。新修订的丹麦时尚道德宪章明确指出：&quot;我们意识到并承担时尚产业对身体理想的影响责任，特别是对年轻人的影响。&quot;该宪章的主要执行工具是拒绝设计师和模特经纪公司参加由丹麦时尚协会运营的哥本哈根时装周（CFW）。但总的来说，它依靠点名批评的方式来确保合规。\u003c/p>\n\u003ch3>完整原文 · 第7段\u003c/h3>\n\u003cp>Relying on ethical persuasion rather than law to address the misuse of body ideals may be the best step. Even better would be to help elevate notions of beauty beyond the material standards of a particular industry.\u003c/p>\n\u003ch3>意群划分 · 第7段\u003c/h3>\n\u003cp>Relying on / ethical persuasion / rather than law / to address / the misuse of body ideals / may be the best step.\u003c/p>\n\u003cp>Even better / would be to help / elevate notions of beauty / beyond the material standards / of a particular industry.\u003c/p>\n\u003ch3>意群翻译 · 第7段\u003c/h3>\n\u003cp>依靠 / 道德说服 / 而不是法律 / 来解决 / 身体理想的滥用 / 可能是最好的步骤。\u003c/p>\n\u003cp>更好的 / 是帮助 / 提升美的概念 / 超越物质标准 / 特定行业的。\u003c/p>\n\u003ch3>标准译文 · 第7段\u003c/h3>\n\u003cp>依靠道德说服而非法律来解决身体理想的滥用可能是最好的方法。更好的做法是帮助将美的概念提升到超越特定行业的物质标准之上。\u003c/p>\n\u003ch2>文章的句内逻辑（大家自行根据需求阅读)\u003c/h2>\n\u003cp>我们采用一种借鉴数学符号解析的方式，把意群之间的推进、并列、解释和转折关系标出来。这里的符号只用于帮助理解，不要求在考场上照抄。\u003c/p>\n\u003cp>符号的作用：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>→\u003c/code>：主要叙述继续向下推进；\u003c/li>\n\u003cli>\u003ccode>+\u003c/code>：并列；\u003c/li>\n\u003cli>\u003ccode>：\u003c/code>：解释、修饰或补充；\u003c/li>\n\u003cli>\u003ccode>//\u003c/code>：转折或对比；\u003c/li>\n\u003cli>括号：把同一层的信息捆成一个整体。\u003c/li>\n\u003c/ul>\n\u003ch2>句子逻辑梳理（选修，按照自身语法基础而定)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>France：(which prides itself：(as the global innovator of fashion)) → has decided：(its fashion industry → has lost an absolute right：(to define physical beauty：(for women))).\u003c/p>\n\u003cp>Its lawmakers → gave preliminary approval：(last week)：(to a law：(that would make it a crime：(to employ ultra-thin models：(on runways)))).\u003c/p>\n\u003cp>The parliament → also agreed to ban websites：(that &quot;incite excessive thinness&quot;：(by promoting extreme dieting)).\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>Such measures → have a couple of uplifting motives.\u003c/p>\n\u003cp>They suggest：(beauty should not be defined：(by looks：(that end up impinging on health))).\u003c/p>\n\u003cp>That&#39;s a start.\u003c/p>\n\u003cp>And the ban on ultra-thin models → seems to go beyond：(protecting models：(from starving themselves to death))：(as some have done).\u003c/p>\n\u003cp>It tells the fashion industry：(that it must take responsibility：(for the signal it sends women：(especially teenage girls)：(about the social tape-measure：(they must use：(to determine their individual worth))))).\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>The bans：(if fully enforced) → would suggest to women (and many men)：(that they should not let others → be arbiters of their beauty).\u003c/p>\n\u003cp>And perhaps faintly → they hint：(that people should look to → intangible qualities：(like character and intellect) // rather than dieting their way：(to size zero or wasp-waist physiques)).\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>The French measures, however // rely too much on：(severe punishment)：(to change a culture：(that still regards beauty：(as skin-deep – and bone-showing))).\u003c/p>\n\u003cp>Under the law → using a fashion model：(that does not meet → a government-defined index：(of body mass)) → could result in：(a $85,000 fine + six months in prison).\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>The fashion industry → knows：(it has an inherent problem：(in focusing on：(material adornment + idealized body types))).\u003c/p>\n\u003cp>In Denmark + the United States + a few other countries → it is trying to set：(voluntary standards：(for models and fashion images))：(that rely more on：(peer pressure)：(for enforcement)).\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>In contrast to France&#39;s actions → Denmark&#39;s fashion industry → agreed last month：(on rules and sanctions：(regarding the age, health, and other characteristics：(of models))).\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter → clearly states：(&quot;We are aware of + take responsibility for：(the impact：(the fashion industry has：(on body ideals：(especially on young people))))&quot;).\u003c/p>\n\u003cp>The charter&#39;s main tool：(of enforcement) → is to deny access：(for designers and modeling agencies)：(to Copenhagen Fashion Week (CFW)：(which is run by：(the Danish Fashion Institute))).\u003c/p>\n\u003cp>But in general → it relies on：(a name-and-shame method：(of compliance)).\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>Relying on：(ethical persuasion // rather than law)：(to address：(the misuse of body ideals)) → may be the best step.\u003c/p>\n\u003cp>Even better → would be to help：(elevate notions of beauty：(beyond the material standards：(of a particular industry))).\u003c/p>\n\u003ch2>中文版句子逻辑（选修)\u003c/h2>\n\u003ch3>第1段\u003c/h3>\n\u003cp>法国：(它自豪地认为自己：(是时尚的全球创新者)) → 已经决定：(它的时尚产业 → 已经失去了绝对权利：(来定义身体美：(对女性来说)))。\u003c/p>\n\u003cp>它的立法者们 → 给予了初步批准：(上周)：(对一项法律：(该法律将使其成为犯罪：(雇用超瘦模特：(在T台上))))。\u003c/p>\n\u003cp>议会 → 也同意禁止网站：(那些&quot;煽动过度瘦身&quot;的：(通过推广极端节食))。\u003c/p>\n\u003ch3>第2段\u003c/h3>\n\u003cp>这些措施 → 有几个令人振奋的动机。\u003c/p>\n\u003cp>它们表明：(美不应该被定义：(通过外表：(那些最终损害健康的)))。\u003c/p>\n\u003cp>这是一个开始。\u003c/p>\n\u003cp>并且对超瘦模特的禁令 → 似乎超越了：(保护模特：(免于饿死自己))：(正如一些人已经做过的)。\u003c/p>\n\u003cp>它告诉时尚产业：(它必须承担责任：(对于它发送给女性的信号：(特别是少女)：(关于社会标尺：(她们必须使用的：(来确定她们的个人价值)))))。\u003c/p>\n\u003ch3>第3段\u003c/h3>\n\u003cp>这些禁令：(如果全面执行) → 会向女性暗示（以及许多男性）：(她们不应该让其他人 → 成为她们美丽的仲裁者)。\u003c/p>\n\u003cp>也许微弱地 → 它们暗示：(人们应该关注 → 无形的品质：(比如性格和智力) // 而不是通过节食：(达到零号尺寸或蜂腰体型))。\u003c/p>\n\u003ch3>第4段\u003c/h3>\n\u003cp>然而，法国的措施 // 过度依赖：(严厉的惩罚)：(来改变一种文化：(这种文化仍然认为美：(是肤浅的 – 以及露骨的)))。\u003c/p>\n\u003cp>根据该法律 → 使用时装模特：(不符合 → 政府定义的指数：(身体质量的)) → 可能导致：(85,000美元的罚款 + 六个月的监禁)。\u003c/p>\n\u003ch3>第5段\u003c/h3>\n\u003cp>时尚产业 → 知道：(它有一个内在问题：(在专注于：(物质装饰 + 理想化的身体类型)))。\u003c/p>\n\u003cp>在丹麦 + 美国 + 其他几个国家 → 它正在尝试制定：(自愿标准：(对模特和时尚形象))：(更多地依赖：(同行压力)：(来执行))。\u003c/p>\n\u003ch3>第6段\u003c/h3>\n\u003cp>与法国的行动相比 → 丹麦的时尚产业 → 上个月达成一致：(关于规则和制裁：(涉及年龄、健康和其他特征：(模特的)))。\u003c/p>\n\u003cp>新修订的丹麦时尚道德宪章 → 明确指出：(&quot;我们意识到 + 承担责任：(对于影响：(时尚产业所产生的：(对身体理想：(特别是对年轻人)))))&quot;)。\u003c/p>\n\u003cp>宪章的主要工具：(执行的) → 是拒绝准入：(对设计师和模特经纪公司)：(到哥本哈根时装周（CFW）：(它是由运营的：(丹麦时尚协会)))。\u003c/p>\n\u003cp>但总的来说 → 它依赖于：(点名批评的方法：(合规的))。\u003c/p>\n\u003ch3>第7段\u003c/h3>\n\u003cp>依靠：(道德说服 // 而不是法律)：(来解决：(身体理想的滥用)) → 可能是最好的步骤。\u003c/p>\n\u003cp>更好的 → 是帮助：(提升美的概念：(超越物质标准：(特定行业的)))。\u003c/p>\n\u003ch2>长难句翻译练习（英一必修，英二选修)\u003c/h2>\n\u003cp>对于长难句的翻译，流程一共五步：\u003c/p>\n\u003col>\n\u003cli>划分意群；\u003c/li>\n\u003cli>逐个意群直译；\u003c/li>\n\u003cli>按照中文语感，把应该放在一起的意群合并起来；\u003c/li>\n\u003cli>找到中文句子的骨干，再按照中文语序调整合并后意群的位置；\u003c/li>\n\u003cli>对第四步得到的完整句子进行艺术加工，整理成信达雅的参考答案水平的译文。\u003c/li>\n\u003c/ol>\n\u003ch2>第2段第5句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>It tells the fashion industry that it must take responsibility for the signal it sends women, especially teenage girls, about the social tape-measure they must use to determine their individual worth.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>It tells the fashion industry / that it must take responsibility / for the signal it sends women, / especially teenage girls, / about the social tape-measure / they must use / to determine their individual worth.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>它告诉时尚产业 / 它必须承担责任 / 对于它发送给女性的信号，/ 特别是少女，/ 关于社会标尺 / 她们必须使用的 / 来确定她们的个人价值。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把tell的对象与must的义务合并，明确谁应负责。：\u003c/p>\n\u003cblockquote>\n\u003cp>这向时尚行业传达信息：行业必须承担责任\u003c/p>\n\u003c/blockquote>\n\u003cp>再把信号的接受者和内容分开合并。：\u003c/p>\n\u003cblockquote>\n\u003cp>向女性尤其少女传递的、关于用什么社会标准衡量个人价值的信号\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>这向时尚行业传达信息：行业必须承担责任；向女性尤其少女传递的、关于用什么社会标准衡量个人价值的信号。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>它告诉时尚行业，行业必须为自己传递的信号负责。\u003c/p>\n\u003c/blockquote>\n\u003cp>将女性及少女放在“传递”的对象位置；about后面不是行业的价值，而是女性被要求用来衡量自身价值的标准。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>它告诉时尚行业，这个行业必须为自己发给女性，特别是少女的信号负责；信号涉及她们被要求用来判断个人价值的社会衡量尺度。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>tape-measure在这里是社会衡量尺度，不按裁缝的实物软尺直译。\u003c/p>\n\u003cp>两个it都要认清：开头指法律传递的信息，后一个指发出审美信号的行业。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>它向时尚产业传达了一个信息：必须对其向女性，特别是少女发送的信号负责，这些信号涉及她们必须用来衡量个人价值的社会标准。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第5段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>In Denmark, / the United States, / and a few other countries, / it is trying to set / voluntary standards / for models and fashion images / that rely more on / peer pressure / for enforcement.\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>在丹麦，/ 美国，/ 和其他几个国家，/ 它正在尝试制定 / 自愿标准 / 对模特和时尚形象 / 更多地依赖 / 同行压力 / 来执行。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先把地点并列项合并为行动范围，不要误当成几个不同政策。：\u003c/p>\n\u003cblockquote>\n\u003cp>在丹麦、美国和其他一些国家\u003c/p>\n\u003c/blockquote>\n\u003cp>再把制定什么、靠什么执行连起来。：\u003c/p>\n\u003cblockquote>\n\u003cp>为模特和时尚形象制定自愿标准，更多依靠同行压力执行\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>在丹麦、美国和其他一些国家；为模特和时尚形象制定自愿标准，更多依靠同行压力执行。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>该行业正在尝试制定依靠同行压力执行的自愿标准。\u003c/p>\n\u003c/blockquote>\n\u003cp>地点放在开头；that引出的执行方式后置说明标准，不能接成只有时尚形象依靠压力。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>在丹麦、美国和少数其他国家，时尚行业正试着为模特和时尚形象设立自愿标准，并更多依靠同行压力来执行这些标准。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>trying保留尝试语气，不说已经全面完成或强制执行。\u003c/p>\n\u003cp>voluntary与peer pressure并存：自愿规范仍有同行约束，不等于毫无要求。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>在丹麦、美国和其他几个国家，该行业正在尝试为模特和时尚形象制定自愿标准，这些标准更多地依靠同行压力来执行。\u003c/p>\n\u003c/blockquote>\n\u003ch2>第6段第2句\u003c/h2>\n\u003ch3>原文\u003c/h3>\n\u003cblockquote>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第一步：划分意群\u003c/h3>\n\u003cblockquote>\n\u003cp>The newly revised / Danish Fashion Ethical Charter / clearly states: / &quot;We are aware of / and take responsibility for / the impact / the fashion industry has / on body ideals, / especially on young people.&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第二步：逐个意群直译\u003c/h3>\n\u003cblockquote>\n\u003cp>新修订的 / 丹麦时尚道德宪章 / 明确指出：/ &quot;我们意识到 / 并承担责任 / 对于影响 / 时尚产业所产生的 / 对身体理想，/ 特别是对年轻人。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch3>第三步：按照中文语感合并意群\u003c/h3>\n\u003cp>先合并主句中的文件名称与表述动作。：\u003c/p>\n\u003cblockquote>\n\u003cp>新修订的丹麦时尚道德宪章明确指出\u003c/p>\n\u003c/blockquote>\n\u003cp>再把意识到和承担责任并列起来，共同指向行业造成的影响。：\u003c/p>\n\u003cblockquote>\n\u003cp>我们意识到时尚行业对身体理想尤其青年身体理想的影响，并承担责任\u003c/p>\n\u003c/blockquote>\n\u003cp>先得到：\u003c/p>\n\u003cblockquote>\n\u003cp>新修订的丹麦时尚道德宪章明确指出；我们意识到时尚行业对身体理想尤其青年身体理想的影响，并承担责任。\u003c/p>\n\u003c/blockquote>\n\u003ch3>第四步：寻找句子骨干并按照中文语序调整\u003c/h3>\n\u003cp>接着找中文句子的骨干：\u003c/p>\n\u003cblockquote>\n\u003cp>宪章指出：我们认识到这种影响并为之负责。\u003c/p>\n\u003c/blockquote>\n\u003cp>文件名称放在“明确指出”前；引语先交代态度和责任，再补行业影响的对象，把especially on young people放在影响范围内。\u003c/p>\n\u003cp>按照中文语序调整后是：\u003c/p>\n\u003cblockquote>\n\u003cp>新近修订的丹麦时尚道德宪章明确表示：“我们意识到时尚行业对理想体型观念的影响，并为这种影响承担责任，尤其是对年轻人的影响。”\u003c/p>\n\u003c/blockquote>\n\u003ch3>第五步：艺术加工\u003c/h3>\n\u003cp>第四步已经把意思说明白了，接下来让表达更加准确、自然：\u003c/p>\n\u003cp>are aware of与take responsibility for必须都保留，不能只译成知道问题。\u003c/p>\n\u003cp>body ideals说的是理想体型观念，不是青年身体已经受到某种具体伤害。\u003c/p>\n\u003cp>参考译文：\u003c/p>\n\u003cblockquote>\n\u003cp>新修订的丹麦时尚道德宪章明确指出：&quot;我们意识到并承担时尚产业对身体理想的影响责任，特别是对年轻人的影响。&quot;\u003c/p>\n\u003c/blockquote>\n\u003ch1>3.一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h1>\n\u003cp>之前我们的做题模式模拟的是考场中的真实状态：文章和选项里有不少表达不认识，所以经常会面临二选一的情况，我们通过交叉验证来排除。\u003c/p>\n\u003cp>而在当前的复盘模式中，我们刚才已经精读过整篇文章，文章和选项中的词也全部认识。因此，现在我们直接站在出题人的角度去分析每道题的：\u003c/p>\n\u003col>\n\u003cli>题目真正在问什么，这是什么题型，这个题型一般如何去应对；\u003c/li>\n\u003cli>每个选项从原文哪里改出来，对的是如何对文章进行同义改写的，错的做题时为什么容易被文章中的对应表达骗，命题人是怎么想的；\u003c/li>\n\u003cli>我们的三个最本质的方法：定位比对、写作视角和全文主旨，三个判据能否同时支持它。\u003c/li>\n\u003c/ol>\n\u003cp>其中三个判据的含义如下，我们在之前的做题模式里都见过：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>定位比对：\u003c/strong>检查选项有没有准确改写局部原文；\u003c/li>\n\u003cli>\u003cstrong>写作视角：\u003c/strong>假设选项正确，作者前后应该怎样写，再看实际文章是不是这样写；\u003c/li>\n\u003cli>\u003cstrong>全文主旨：\u003c/strong>检查选项能不能放进“科研虽然耗能，但有必要继续，同时还要改进能源使用方式”这个全文逻辑中。\u003c/li>\n\u003c/ul>\n\u003cp>命题人的命题手法主要有三类，如下：\u003c/p>\n\u003ch4>第一类：歪曲原意\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>选项在文章里有明确出处，命题人也确实是根据某一句或者某几句改出来的。\u003c/p>\n\u003cp>但比对完整命题以后会发现，选项不是原文的说法，而是把原文中的某个关键关系改掉了，例如：\u003c/p>\n\u003cul>\n\u003cli>肯定改成否定；\u003c/li>\n\u003cli>原因改成结果；\u003c/li>\n\u003cli>目的改成原因；\u003c/li>\n\u003cli>主体或对象偷换；\u003c/li>\n\u003cli>时间范围改变；\u003c/li>\n\u003cli>程度扩大或缩小；\u003c/li>\n\u003cli>动词词义改变；\u003c/li>\n\u003cli>语法结构改变；\u003c/li>\n\u003cli>作者承认 A 但支持 B，被改成作者否认 A。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项不是没出处，而是有出处，但命题人利用出处歪曲了原文。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们看到选项复现了原文里的关键词，就觉得它有出处；正确选项反而用了同义替换，看起来没有错误项那么“像原文”，于是咱们没继续比对完整句子，只凭关键词就选了错误项。\u003c/p>\n\u003cp>所以这一类不能只问：\u003c/p>\n\u003cblockquote>\n\u003cp>这个词文章里有没有？\u003c/p>\n\u003c/blockquote>\n\u003cp>而要问：\u003c/p>\n\u003cblockquote>\n\u003cp>原文到底是谁对谁做了什么？方向、对象、因果、态度和时间有没有被改？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第二类：题目问宏观内容，选项拿论据、细节或其他范围的信息来回答\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>这一类错误选项也有原文出处，而且选项本身表达的内容甚至可能完全正确。\u003c/p>\n\u003cp>它错的不是“原文没这么说”，而是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>它没有回答题干真正问的层面、范围或者功能。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>常见情况包括：\u003c/p>\n\u003cul>\n\u003cli>题目问段落主旨，选项是段落中的一个细节；\u003c/li>\n\u003cli>题目问全文主旨，选项只是某一段的内容；\u003c/li>\n\u003cli>题目问例子作用，选项只是例子内部发生了什么；\u003c/li>\n\u003cli>题目问作者观点，选项只是作者用来论证观点的事实；\u003c/li>\n\u003cli>题目限定某一段，选项出处却在其他段；\u003c/li>\n\u003cli>题目问论点，选项给的是论据；\u003c/li>\n\u003cli>题目问“为什么举这个例子”，选项回答“例子里这个人做了什么”。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>选项内容可以是真的，但它回答错了问题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们在原文里找到了这句话，确认它确实是真的，就直接选了。\u003c/p>\n\u003cp>但阅读选择题不是判断选项本身真假，而是判断：\u003c/p>\n\u003cblockquote>\n\u003cp>这个选项能不能准确回答题干？\u003c/p>\n\u003c/blockquote>\n\u003cp>所以这一类最常见的错误脑回路是：\u003c/p>\n\u003cblockquote>\n\u003cp>文章里确实写了 → 这个选项是真的 → 那就一定能选。\u003c/p>\n\u003c/blockquote>\n\u003cp>真正应该继续追问：\u003c/p>\n\u003cblockquote>\n\u003cp>题干问的是主旨、作用、态度还是细节？\n 这个选项是论点还是论据？\n 它的出处在题干限定范围内吗？\n 它是在回答例子作用，还是只复述例子内容？\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch4>第三类：无中生有\u003c/h4>\n\u003ch5>定义\u003c/h5>\n\u003cp>结合题干和选项的完整意思，文章实际没有表达这个命题。\u003c/p>\n\u003cp>选项通常不是完全凭空乱写，而是利用文章中的一些相关词、相关句子或现实常识，引导咱们自己把不存在的关系补出来。\u003c/p>\n\u003cp>在本篇文章里，常见的脑补包括：\u003c/p>\n\u003cul>\n\u003cli>原文有 energy，脑补出 energy shortage；\u003c/li>\n\u003cli>原文有 sustainable，脑补出 suspicions about sustainable energy；\u003c/li>\n\u003cli>原文有研究耗能，脑补出已经造成严重后果；\u003c/li>\n\u003cli>原文有净零目标，脑补出某项目由净零倡议推动；\u003c/li>\n\u003cli>原文说用了河流供电，脑补成解决了能源短缺；\u003c/li>\n\u003cli>原文说某项技术有用，脑补成问题非常紧迫；\u003c/li>\n\u003cli>原文提到一个目标，脑补出某种因果、目的或态度。\u003c/li>\n\u003c/ul>\n\u003cp>这一类的关键是：\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>文章里只有能让咱们产生联想的材料，但没有选项所表达的完整命题。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003ch5>典型误选脑回路\u003c/h5>\n\u003cp>咱们不是在比对原文，而是在替作者把文章继续写下去：\u003c/p>\n\u003cblockquote>\n\u003cp>原文说了 A，按照常识我觉得 B 也合理，所以文章应该也有 B。\u003c/p>\n\u003c/blockquote>\n\u003cp>但阅读题不能选“现实中可能正确”的内容，只能选“文章实际支持”的内容。\u003c/p>\n\u003cp>无中生有的分析不能只写：\u003c/p>\n\u003cblockquote>\n\u003cp>原文没提，所以错。\u003c/p>\n\u003c/blockquote>\n\u003cp>而要写清楚：\u003c/p>\n\u003cblockquote>\n\u003cp>命题人拿了文章中的哪个词或哪句话；\n 咱们从这个地方开始怎样脑补；\n 最终补出了选项里的哪一个原文没有的态度、因果、目的或结论。\u003c/p>\n\u003c/blockquote>\n\u003cp>那么现在我们知道了我们要干嘛，就可以开始复盘这几道题目：\u003c/p>\n\u003cp>我们先从25题开始，为什么要从全文主旨/作者观点态度题先开始，这就涉及到我们一个方法：交叉验证，因为这是复盘而不是做题，因此我们之前先精读了文章，那么现在就可以直接做主旨题，并把主旨题的主旨作为后面的分析手段之一。这部分无论是做题还是复盘，都属于一种抽象能力的考察，即写作视角思维，因此跟做题模式的分析是一致的。\u003c/p>\n\u003ch2>25题\u003c/h2>\n\u003cp>\u003cstrong>Which of the following may be the best title of the text?\u003c/strong>\u003c/p>\n\u003cp>下面哪一项可能是本文最佳标题？\u003c/p>\n\u003cp>这是全文作者观点 / 全文主旨题。\u003c/p>\n\u003cp>这类题不要自己强行概括，因为英语和语文基础差的同学很容易概括偏。\n我们这里介绍一种做法，也就是前面的写作视角法，只不过是对全文应用结合作者写作的小心思。\u003c/p>\n\u003cp>选项：\u003c/p>\n\u003cp>A. \u003cstrong>A Challenge to the Fashion Industry’s Body Ideals\u003c/strong>\u003c/p>\n\u003cp>对时尚行业身体审美观的挑战\u003c/p>\n\u003cp>B. \u003cstrong>A Dilemma for the Starving Models in France\u003c/strong>\u003c/p>\n\u003cp>法国挨饿模特的困境\u003c/p>\n\u003cp>C. \u003cstrong>Just Another Round of Struggle for Beauty\u003c/strong>\u003c/p>\n\u003cp>又一轮围绕美的斗争\u003c/p>\n\u003cp>D. \u003cstrong>The Great Threats to the Fashion Industry\u003c/strong>\u003c/p>\n\u003cp>时尚行业面临的巨大威胁\u003c/p>\n\u003ch3>用写作视角确定主旨的方法分析每个选项\u003c/h3>\n\u003cp>所谓写作视角确定主旨的方法，就是把每个选项代入文章的逻辑框架中，看应该怎么写，是不是和全文符合，大家一定要记住，考研英语的文章是选自外刊的，写这些文章的人要么是赞同或者批斗某人某事想赚黑子或者白子的钱，要么是想输出某种暴论来引起一些声望，所以观点一定是明确的，即使他中间要装那么一下，最后还是会忍不住回到为了一碟醋包的那一盘饺子的醋上，这是一种常见的逻辑框架，在后面我们会介绍更多。现在我们先快速回顾一遍这篇文章都写了啥：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在说什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>写法国通过法律限制超瘦模特和鼓吹极端节食的网站，收回时尚行业独占女性审美定义的权力\u003c/td>\n\u003ctd>先摆出一个出问题后的应对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>肯定这些措施保护健康，并要求行业为传递给女性尤其少女的身体标准负责\u003c/td>\n\u003ctd>再承认这种应对有积极作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明禁令还可能让个人不再把他人当成美的裁判，转而重视品格和智慧\u003c/td>\n\u003ctd>接着把影响落到个人选择上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>批评法国依靠严厉处罚改变文化，罚款和监禁力度过重\u003c/td>\n\u003ctd>但是又说当前办法用力过猛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力\u003c/td>\n\u003ctd>然后转向另一种较温和的做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/td>\n\u003ctd>然后说明这种做法怎样落地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>主张道德劝导可能优于法律，更进一步还应把美的观念提升到行业物质标准之外\u003c/td>\n\u003ctd>最后说还可以再往前一步\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Which of the following may be the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>A. A Challenge to the Fashion Industry’s Body Ideals\u003c/h3>\n\u003cp>对时尚行业身体审美观的挑战\u003c/p>\n\u003ch4>如果 A 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>对时尚行业身体审美观的挑战\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 A 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以法国立法限制超瘦模特开篇，展示对行业身体理想造成问题的回应。\u003c/td>\n\u003ctd>先摆出一个出问题后的应对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>承认措施能保护健康并要求行业对向女性传递的审美信号负责。\u003c/td>\n\u003ctd>再承认这种应对有积极作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明这种挑战怎样帮助个人拒绝把他人规定的体型当作自我价值。\u003c/td>\n\u003ctd>接着把影响落到个人选择上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出法国依赖重罚来挑战身体理想，用力过猛且未必改变文化。\u003c/td>\n\u003ctd>但是又说当前办法用力过猛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>转向行业自愿规范和同伴压力，介绍更温和的审美改革路径。\u003c/td>\n\u003ctd>然后转向另一种较温和的做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>以丹麦章程和参展准入展示行业如何执行新标准。\u003c/td>\n\u003ctd>然后说明这种做法怎样落地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>提出美的观念还应超越行业的物质标准，把挑战推进到价值认识。\u003c/td>\n\u003ctd>最后说还可以再往前一步\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A能覆盖全文。开头不是孤立处罚模特，而是在收回时尚行业独占女性外在美定义的权力；第二、三段把影响扩到健康、女性价值和个人审美裁判；后面又比较法国严厉法律与丹麦自愿规范，最后把目标推向超越行业物质标准的美。\n标题中的Challenge既能容纳法律禁令，也能容纳同行压力、道德劝导和观念提升。文章并不只赞成法国现有手段，第四段明确批评惩罚过重，但这种批评没有否定挑战旧身体审美的方向，反而寻找更合适的挑战方式。\n从篇幅看，七段始终围绕身体审美由谁定义、怎样纠偏以及用什么方式纠偏展开。A既覆盖问题，也覆盖作者对方法的修正和结尾的进一步主张。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>A 保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following may be the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>B. A Dilemma for the Starving Models in France\u003c/h3>\n\u003cp>法国挨饿模特的困境\u003c/p>\n\u003ch4>如果 B 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>法国挨饿模特的困境\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 B 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以法国挨饿模特在健康与工作之间的困境开头，介绍政府为她们采取的措施。\u003c/td>\n\u003ctd>先摆出一个出问题后的应对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>承认措施可减轻法国模特的健康危险与职业压力。\u003c/td>\n\u003ctd>再承认这种应对有积极作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明法国模特怎样在保持工作和保护身体之间作个人选择。\u003c/td>\n\u003ctd>接着把影响落到个人选择上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出严厉惩罚又可能压缩模特就业，使原有两难处境更尖锐。\u003c/td>\n\u003ctd>但是又说当前办法用力过猛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>引入同行自愿保护作为法国模特摆脱两难的较温和方案。\u003c/td>\n\u003ctd>然后转向另一种较温和的做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>用具体保障流程说明这种方案如何兼顾模特健康与职业机会。\u003c/td>\n\u003ctd>然后说明这种做法怎样落地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>提出让法国模特获得更独立的价值判断，进一步走出挨饿与失业的两难。\u003c/td>\n\u003ctd>最后说还可以再往前一步\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B只能覆盖第二段中“模特把自己饿死”的一个后果，无法解释文章为何讨论女性个人价值、丹麦行业宪章、CFW准入以及道德劝导。\n全文没有追踪一群法国挨饿模特的经历，也没有写治疗、救助或生存两难。模特挨饿是旧审美的严重例子，不是文章的全部中心。\n若标题真是法国挨饿模特的困境，后半篇应继续回到法国模特本身；实际却转向多个国家如何改变行业身体标准，范围明显更大。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>B 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following may be the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>C. Just Another Round of Struggle for Beauty\u003c/h3>\n\u003cp>又一轮围绕美的斗争\u003c/p>\n\u003ch4>如果 C 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>又一轮围绕美的斗争\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 C 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>以新一轮围绕美的冲突及各方应对开篇，说明审美斗争再次出现。\u003c/td>\n\u003ctd>先摆出一个出问题后的应对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>承认本轮斗争的限制措施带来某些健康与社会收益。\u003c/td>\n\u003ctd>再承认这种应对有积极作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明这轮争论如何影响个人在不同美的标准之间选择。\u003c/td>\n\u003ctd>接着把影响落到个人选择上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>指出斗争中的重罚手段过激，使围绕美的争夺付出额外代价。\u003c/td>\n\u003ctd>但是又说当前办法用力过猛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>转向协商与自愿标准，介绍本轮审美斗争中较温和的一条路线。\u003c/td>\n\u003ctd>然后转向另一种较温和的做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>展示这条温和路线如何在行业行动中落实，成为斗争的新阶段。\u003c/td>\n\u003ctd>然后说明这种做法怎样落地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>提出在这一轮之后仍需继续改变美的观念，将斗争向更深层推进。\u003c/td>\n\u003ctd>最后说还可以再往前一步\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>C抓住了围绕美存在分歧，但“Just Another Round of Struggle”要求全文把重点放在双方反复争斗。文章没有安排两派人物交锋，也没有写这一轮斗争的胜负。\n作者的态度并非中性记录争论。他赞成改变超瘦身体审美，只是认为法国的严厉处罚不是最佳手段，因而转向丹麦的道德劝导和更广义的美。\nC的“another round”还暗示过去已有多轮同类争斗，原文没有提供这种历史线。它能沾到beauty，却不能解释全文明确的改革方向。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>C 不保留。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Which of the following may be the best title of the text?\u003c/strong>\u003c/p>\n\u003ch3>D. The Great Threats to the Fashion Industry\u003c/h3>\n\u003cp>时尚行业面临的巨大威胁\u003c/p>\n\u003ch4>如果 D 是主旨，文章7段应该怎么写？\u003c/h4>\n\u003cp>如果全文主旨真的是：\u003c/p>\n\u003cp>时尚行业面临的巨大威胁\u003c/p>\n\u003cp>那文章7段应该大概这样展开：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>如果 D 对，这段应该写什么\u003c/th>\n\u003cth>逻辑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>列出时尚行业遭遇的巨大威胁，以及行业为免受损害采取的应对。\u003c/td>\n\u003ctd>先摆出一个出问题后的应对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>承认这些防御措施能减少行业损失、保护其基本生存条件。\u003c/td>\n\u003ctd>再承认这种应对有积极作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>说明从业者如何因威胁调整自己的职业与审美选择。\u003c/td>\n\u003ctd>接着把影响落到个人选择上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>批评部分防御措施过激，反而让行业承担更严重的代价。\u003c/td>\n\u003ctd>但是又说当前办法用力过猛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>转向自愿协商等较温和的防御办法来化解行业危机。\u003c/td>\n\u003ctd>然后转向另一种较温和的做法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>具体说明温和方案怎样执行、怎样保护行业免受巨大威胁。\u003c/td>\n\u003ctd>然后说明这种做法怎样落地\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>提出更长远的适应策略，让行业进一步摆脱威胁而稳定发展。\u003c/td>\n\u003ctd>最后说还可以再往前一步\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>D把监管与改革写成行业遭受的巨大威胁，但文章并不担忧时尚行业会被摧毁。真正被批评的是行业长期强化物质外表和理想化体型。\n法国罚款、丹麦准入限制和点名方式都是纠偏工具，不是作者列举的行业生存危机。第五、六段还写行业主动制定标准、承担责任，说明它在参与改变，而不是被动抵御威胁。\n结尾要求把美提升到特定行业的物质标准之外，也不是替行业解除威胁。D改变了作者站位，无法覆盖全文。\u003c/p>\n\u003cp>判断：\u003c/p>\n\u003cp>\u003cstrong>D 不保留。\u003c/strong>\u003c/p>\n\u003ch3>25题结论\u003c/h3>\n\u003cp>\u003cstrong>25. A. A Challenge to the Fashion Industry’s Body Ideals\u003c/strong>\u003c/p>\n\u003cp>这句话就是本文后续做题的主旨底牌：\u003c/p>\n\u003cp>\u003cstrong>A Challenge to the Fashion Industry’s Body Ideals / 对时尚行业身体审美观的挑战\u003c/strong>\u003c/p>\n\u003ch2>21题\u003c/h2>\n\u003cblockquote>\n\u003cp>According to the first paragraph, what would happen in France?\u003cbr>根据第一段，法国将会发生什么？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>具体细节题。题干要求判断“根据第一段，法国将会发生什么？”，先按第1段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women. Its lawmakers gave preliminary approval last week to a law that would make it a crime to employ ultra-thin models on runways. The parliament also agreed to ban websites that &quot;incite excessive thinness&quot; by promoting extreme dieting.\u003c/p>\n\u003c/blockquote>\n\u003cp>法国限制时尚行业对女性外在美的绝对定义权，用禁止超瘦模特和极端节食网站落实变化。\u003c/p>\n\u003ch3>A. Physical beauty would be redefined.\u003c/h3>\n\u003cblockquote>\n\u003cp>外在美将被重新定义\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A保留。当时选项呈现为“Physical beauty would be [xxx].”，保留了相应遮挡。当时的定位线索是：A里的“Physical beauty would be”和原文“lost an absolute right to define physical beauty”都在谈新法之后女性外在美由谁来界定，因为选项写结果，原文写时尚行业失去原先的定义权，所以回看第一段第一句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“lost an absolute right to define physical beauty”先写清一件事：时尚行业过去能够主导女性外在美的标准，现在法国认为这种绝对定义权不该继续存在。A的“Physical beauty would be”则把这项权力变化写成外在美会被重新处理的结果。两边的主体表达不同，但动作落点都在“外在美怎样被定义”。\u003c/p>\n\u003cp>A没有把法国措施扩大成整个行业消失，也没有另换对象；它只把“失去定义女性外在美的绝对权利”转换成“外在美会被怎样”。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法国的新规定意味着，外在美将被重新定义。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“Physical beauty would be”和原文“lost an absolute right to define physical beauty”都在谈新法之后女性外在美由谁来界定，因为选项写结果，原文写时尚行业失去原先的定义权，所以回看第一段第一句。\u003c/p>\n\u003cp>原文“lost an absolute right to define physical beauty”先写清一件事：时尚行业过去能够主导女性外在美的标准，现在法国认为这种绝对定义权不该继续存在。A的“Physical beauty would be”则把这项权力变化写成外在美会被重新处理的结果。两边的主体表达不同，但动作落点都在“外在美怎样被定义”。\u003c/p>\n\u003cp>第一段后面又补了两项具体做法：使用超瘦模特会被定为犯罪，鼓吹极端节食的网站也会被禁止。这些措施不是简单增加某个行业流程，而是在削弱原有审美标准的支配力。\u003c/p>\n\u003cp>A没有把法国措施扩大成整个行业消失，也没有另换对象；它只把“失去定义女性外在美的绝对权利”转换成“外在美会被怎样”。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women.\u003c/p>\n\u003cp>法国限制时尚行业对女性外在美的绝对定义权，用禁止超瘦模特和极端节食网站落实变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写法国通过法律限制超瘦模特和鼓吹极端节食的网站，收回时尚行业独占女性审美定义的权力。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>France will redefine physical beauty rather than leave its definition entirely to the fashion industry.\u003c/p>\n\u003cp>法国将重新定义外在美，而不再把定义完全交给时尚行业。\u003c/p>\n\u003c/blockquote>\n\u003cp>失去绝对定义权意味着旧标准不再由行业独占，后两项禁令给出了重新划界的实际措施。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨是挑战行业身体理想，第一段应回答审美界定或相应规则的变化，不能把挑战某种标准扩大成整个行业必然衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Physical beauty would be redefined.\u003cbr>外在美将被重新定义\u003c/p>\n\u003c/blockquote>\n\u003cp>A没有把法国措施扩大成整个行业消失，也没有另换对象；它只把“失去定义女性外在美的绝对权利”转换成“外在美会被怎样”。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写法国通过法律限制超瘦模特和鼓吹极端节食的网站，收回时尚行业独占女性审美定义的权力\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A正确。\u003c/strong>\u003c/p>\n\u003ch3>B. New runways would be constructed.\u003c/h3>\n\u003cblockquote>\n\u003cp>将建造新的走秀台\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“New runways would be constructed”和原文“employ ultra-thin models on runways”都出现了runways，因为选项写修建走秀台，原文写限制谁能在走秀台上工作，所以回看第一段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“employ ultra-thin models on runways”说的是走秀台上的用人规则：继续雇用超瘦模特会触犯法律。B的“New runways would be constructed”说的却是基础设施建设，要出现新走秀台。一个改变的是模特雇用条件，一个改变的是走秀台数量。\u003c/p>\n\u003cp>原文改变的是走秀台上的雇用规则，B改变的是走秀台本身的建设数量。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>Its lawmakers gave preliminary approval last week to a law that would make it a crime to employ ultra-thin models on runways.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法国的新规定意味着，将建造新的走秀台。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“New runways would be constructed”和原文“employ ultra-thin models on runways”都出现了runways，因为选项写修建走秀台，原文写限制谁能在走秀台上工作，所以回看第一段第二句。\u003c/p>\n\u003cp>原文“employ ultra-thin models on runways”说的是走秀台上的用人规则：继续雇用超瘦模特会触犯法律。B的“New runways would be constructed”说的却是基础设施建设，要出现新走秀台。一个改变的是模特雇用条件，一个改变的是走秀台数量。\u003c/p>\n\u003cp>两边确实共享runways这个地点词，所以第一眼容易连到一起；但地点相同不等于动作相同。原文没有让政府、议会或时尚公司去建造任何东西，法律的动作是禁止某类雇用。\u003c/p>\n\u003cp>B若成立，第一段需要出现build、construct、open之类的建设动作，并且说明新走秀台是法律实施后的结果。现在读到的则是make it a crime和employ，动作方向已经完全换掉。\u003c/p>\n\u003cp>原文改变的是走秀台上的雇用规则，B改变的是走秀台本身的建设数量。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>Its lawmakers gave preliminary approval last week to a law that would make it a crime to employ ultra-thin models on runways.\u003c/p>\n\u003cp>法国限制时尚行业对女性外在美的绝对定义权，用禁止超瘦模特和极端节食网站落实变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写法国通过法律限制超瘦模特和鼓吹极端节食的网站，收回时尚行业独占女性审美定义的权力。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>France will build new runways for fashion shows.\u003c/p>\n\u003cp>法国将为时装秀修建新的秀台。\u003c/p>\n\u003c/blockquote>\n\u003cp>修建场地需要建设计划；实际立法约束的是台上雇用什么模特，runways只交代用人规则发生的地点。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨是挑战行业身体理想，第一段应回答审美界定或相应规则的变化，不能把挑战某种标准扩大成整个行业必然衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>New runways would be constructed.\u003cbr>将建造新的走秀台\u003c/p>\n\u003c/blockquote>\n\u003cp>原文改变的是走秀台上的雇用规则，B改变的是走秀台本身的建设数量。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写法国通过法律限制超瘦模特和鼓吹极端节食的网站，收回时尚行业独占女性审美定义的权力\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. Websites about dieting would thrive.\u003c/h3>\n\u003cblockquote>\n\u003cp>有关节食的网站将兴盛\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“Websites about dieting would thrive”和原文“agreed to ban websites”都指向节食网站，因为选项预测这些网站兴盛，原文写议会同意禁止其中一类，所以回看第一段最后一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“agreed to ban websites”给出的方向是关闭、禁止；C的“Websites about dieting would thrive”给出的方向是兴盛、繁荣。两边谈的是同一类网络内容，但结果正好相反。\u003c/p>\n\u003cp>C既没有保留原文的禁止动作，也没有保留原文对网站类型的限定，第一段的明确信息足以排除它。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The parliament also agreed to ban websites that &quot;incite excessive thinness&quot; by promoting extreme dieting.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法国的新规定意味着，有关节食的网站将兴盛。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“Websites about dieting would thrive”和原文“agreed to ban websites”都指向节食网站，因为选项预测这些网站兴盛，原文写议会同意禁止其中一类，所以回看第一段最后一句。\u003c/p>\n\u003cp>原文“agreed to ban websites”给出的方向是关闭、禁止；C的“Websites about dieting would thrive”给出的方向是兴盛、繁荣。两边谈的是同一类网络内容，但结果正好相反。\u003c/p>\n\u003cp>原文还限定了被禁的是通过极端节食鼓吹过度瘦削的网站。C把它放宽成所有about dieting的网站，同时又把ban改成thrive。范围扩大和动作反转同时出现。\u003c/p>\n\u003cp>C既没有保留原文的禁止动作，也没有保留原文对网站类型的限定，第一段的明确信息足以排除它。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The parliament also agreed to ban websites that &quot;incite excessive thinness&quot; by promoting extreme dieting.\u003c/p>\n\u003cp>法国限制时尚行业对女性外在美的绝对定义权，用禁止超瘦模特和极端节食网站落实变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写法国通过法律限制超瘦模特和鼓吹极端节食的网站，收回时尚行业独占女性审美定义的权力。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Websites promoting extreme dieting will be encouraged to flourish.\u003c/p>\n\u003cp>提倡极端节食的网站将受到鼓励而蓬勃发展。\u003c/p>\n\u003c/blockquote>\n\u003cp>实际对鼓吹过度瘦削的网站采取ban，既没有扶持，也不能由部分网站被禁推出所有节食网站将兴盛。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨是挑战行业身体理想，第一段应回答审美界定或相应规则的变化，不能把挑战某种标准扩大成整个行业必然衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Websites about dieting would thrive.\u003cbr>有关节食的网站将兴盛\u003c/p>\n\u003c/blockquote>\n\u003cp>C既没有保留原文的禁止动作，也没有保留原文对网站类型的限定，第一段的明确信息足以排除它。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写法国通过法律限制超瘦模特和鼓吹极端节食的网站，收回时尚行业独占女性审美定义的权力\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. The fashion industry would decline.\u003c/h3>\n\u003cblockquote>\n\u003cp>时尚行业将衰退\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“fashion industry would decline”和原文“has lost an absolute right”都写法国措施会让时尚行业失去某种原有状态，因为选项说整个行业衰退，原文只说它失去一项定义权，所以回看第一段第一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“has lost an absolute right”限定得很具体：失去的是定义女性外在美的绝对权利。D的“fashion industry would decline”却把变化扩大为整个时尚行业走向衰退。一个是某项权力被收回，一个是行业规模、收入或影响力整体下降。\u003c/p>\n\u003cp>权力范围被限制，只能说明行业不能再独占审美定义权，不能直接说明行业整体衰退。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>法国的新规定意味着，时尚行业将衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“fashion industry would decline”和原文“has lost an absolute right”都写法国措施会让时尚行业失去某种原有状态，因为选项说整个行业衰退，原文只说它失去一项定义权，所以回看第一段第一句。\u003c/p>\n\u003cp>原文“has lost an absolute right”限定得很具体：失去的是定义女性外在美的绝对权利。D的“fashion industry would decline”却把变化扩大为整个时尚行业走向衰退。一个是某项权力被收回，一个是行业规模、收入或影响力整体下降。\u003c/p>\n\u003cp>第一段列出的法律措施也只针对超瘦模特和鼓吹极端节食的网站，没有写企业倒闭、市场萎缩、就业减少或产业地位下降。D需要一条从监管措施到行业衰退的因果链，而段中没有建立这条链。\u003c/p>\n\u003cp>D与原文都出现fashion industry，只能说明对象相同，不能把“失去一项定义权”改写成“行业衰退”。范围从单一权利扩到整个产业，结论已经越过第一段。\u003c/p>\n\u003cp>权力范围被限制，只能说明行业不能再独占审美定义权，不能直接说明行业整体衰退。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第1段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women.\u003c/p>\n\u003cp>法国限制时尚行业对女性外在美的绝对定义权，用禁止超瘦模特和极端节食网站落实变化。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：写法国通过法律限制超瘦模特和鼓吹极端节食的网站，收回时尚行业独占女性审美定义的权力。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The new law will cause the entire French fashion industry to decline.\u003c/p>\n\u003cp>新法律将导致整个法国时尚行业衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>产业衰退需要市场、收入或规模的后果。实际撤回的是一项审美定义权，全文继续讨论行业怎样调整标准。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入21题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨是挑战行业身体理想，第一段应回答审美界定或相应规则的变化，不能把挑战某种标准扩大成整个行业必然衰退。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>The fashion industry would decline.\u003cbr>时尚行业将衰退\u003c/p>\n\u003c/blockquote>\n\u003cp>权力范围被限制，只能说明行业不能再独占审美定义权，不能直接说明行业整体衰退。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：写法国通过法律限制超瘦模特和鼓吹极端节食的网站，收回时尚行业独占女性审美定义的权力\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>21题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>21. A. Physical beauty would be redefined.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“lost an absolute right to define physical beauty”先写清一件事：时尚行业过去能够主导女性外在美的标准，现在法国认为这种绝对定义权不该继续存在。\u003c/p>\n\u003cp>B：原文“employ ultra-thin models on runways”说的是走秀台上的用人规则：继续雇用超瘦模特会触犯法律。\u003c/p>\n\u003cp>C：原文“agreed to ban websites”给出的方向是关闭、禁止；C的“Websites about dieting would thrive”给出的方向是兴盛、繁荣。\u003c/p>\n\u003cp>D：原文“has lost an absolute right”限定得很具体：失去的是定义女性外在美的绝对权利。\u003c/p>\n\u003ch2>22题\u003c/h2>\n\u003cblockquote>\n\u003cp>The phrase “impinging on” (Line 2, Para. 2) is closest in meaning to ______.\u003cbr>第二段第二行的“impinging on”最接近下面哪一项含义？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>词义题。题干要求判断“第二段第二行的“impinging on”最接近下面哪一项含义？”，先按第2段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>Such measures have a couple of uplifting motives. They suggest beauty should not be defined by looks that end up impinging on health. That&#39;s a start. And the ban on ultra-thin models seems to go beyond protecting models from starving themselves to death – as some have done. It tells the fashion industry that it must take responsibility for the signal it sends women, especially teenage girls, about the social tape-measure they must use to determine their individual worth.\u003c/p>\n\u003c/blockquote>\n\u003cp>第二段先肯定措施动机，再说明审美不能损害健康，并以模特饿死和向女性传递的身体标准说明危害。\u003c/p>\n\u003ch3>A. indicating the state of\u003c/h3>\n\u003cblockquote>\n\u003cp>表明……的状态\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“indicating the state”和原文“looks that end up”都要解释外表与健康之间的联系，因为选项把它理解成展示健康状态，原文句型则写外表最终对健康产生某种作用，所以回看第二段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“looks that end up”后面接的是一个落到health上的动作，句子整体在解释为什么不能只用外表定义美。A的“indicating the state”则是把外表当成健康状况的指示器，关系变成“外表显示健康”。\u003c/p>\n\u003cp>原文是looks作用于health，A是looks显示health，两边关系方向不同。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest beauty should not be defined by looks that end up impinging on health.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段的impinging on在这里表示表明……的状态。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“indicating the state”和原文“looks that end up”都要解释外表与健康之间的联系，因为选项把它理解成展示健康状态，原文句型则写外表最终对健康产生某种作用，所以回看第二段第二句。\u003c/p>\n\u003cp>原文“looks that end up”后面接的是一个落到health上的动作，句子整体在解释为什么不能只用外表定义美。A的“indicating the state”则是把外表当成健康状况的指示器，关系变成“外表显示健康”。\u003c/p>\n\u003cp>两种关系的方向不同：原文从looks出发，对health造成某种后果；A则要求looks把health的状态呈现出来。前者是作用关系，后者是表征关系。\u003c/p>\n\u003cp>如果这里只是“表明健康状态”，作者没有必要用end up这种结果结构，也难以解释前文为何把措施称为积极动机。\u003c/p>\n\u003cp>原文是looks作用于health，A是looks显示health，两边关系方向不同。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest beauty should not be defined by looks that end up impinging on health.\u003c/p>\n\u003cp>第二段先肯定措施动机，再说明审美不能损害健康，并以模特饿死和向女性传递的身体标准说明危害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：肯定这些措施保护健康，并要求行业为传递给女性尤其少女的身体标准负责。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>These looks merely indicate the state of a woman’s health.\u003c/p>\n\u003cp>这些外貌只表明女性的健康状态。\u003c/p>\n\u003c/blockquote>\n\u003cp>显示状态只是描述外貌与健康的表征关系，无法解释作者为什么以饿死的后果论证限制此类审美。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>挑战身体理想的主旨帮助确认作者反对以健康为代价的外貌追求；短语的对象和负面作用仍由health及starving themselves to death确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>indicating the state of\u003cbr>表明……的状态\u003c/p>\n\u003c/blockquote>\n\u003cp>原文是looks作用于health，A是looks显示health，两边关系方向不同。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：肯定这些措施保护健康，并要求行业为传递给女性尤其少女的身体标准负责\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. heightening the value of\u003c/h3>\n\u003cblockquote>\n\u003cp>提高……的价值\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“heightening the value”和原文“beauty should not be defined by looks”都涉及作者如何评价外表与健康，因为选项说提高健康的价值，原文却在说明某些外表会对健康带来不利后果，所以回看第二段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“beauty should not be defined by looks”先否定只看外表的审美标准，后面的原因是这些looks最终会对health产生某种作用。B的“heightening the value”却表示让健康更有价值，是正向提升。\u003c/p>\n\u003cp>B还多加了the value这一抽象对象，原文只写health本身受到作用，因此B排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest beauty should not be defined by looks that end up impinging on health.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段的impinging on在这里表示提高……的价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“heightening the value”和原文“beauty should not be defined by looks”都涉及作者如何评价外表与健康，因为选项说提高健康的价值，原文却在说明某些外表会对健康带来不利后果，所以回看第二段第二句。\u003c/p>\n\u003cp>原文“beauty should not be defined by looks”先否定只看外表的审美标准，后面的原因是这些looks最终会对health产生某种作用。B的“heightening the value”却表示让健康更有价值，是正向提升。\u003c/p>\n\u003cp>原句的语境在讨论超瘦审美与挨饿风险，前后都指向健康受到损害，而不是健康价值被抬高。B把负面后果改成正面增值，也把动作对象从健康本身换成健康的价值。\u003c/p>\n\u003cp>heightening the value无法解释这种否定性理由。\u003c/p>\n\u003cp>整句用这层健康后果反对只按外表定义美，B的正向“heightening”与句子理由相反。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest beauty should not be defined by looks that end up impinging on health.\u003c/p>\n\u003cp>第二段先肯定措施动机，再说明审美不能损害健康，并以模特饿死和向女性传递的身体标准说明危害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：肯定这些措施保护健康，并要求行业为传递给女性尤其少女的身体标准负责。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>These looks heighten the value of health.\u003c/p>\n\u003cp>这些外貌提升了健康的价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>提高价值是正面提升，后文却用死亡风险说明需要保护模特；原文不在讨论健康的价值如何上涨。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>挑战身体理想的主旨帮助确认作者反对以健康为代价的外貌追求；短语的对象和负面作用仍由health及starving themselves to death确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>heightening the value of\u003cbr>提高……的价值\u003c/p>\n\u003c/blockquote>\n\u003cp>B还多加了the value这一抽象对象，原文只写health本身受到作用，因此B排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：肯定这些措施保护健康，并要求行业为传递给女性尤其少女的身体标准负责\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. losing faith in\u003c/h3>\n\u003cblockquote>\n\u003cp>对……失去信心\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“losing faith in”和原文“on health”都把health放在关系末端，因为选项要求某人对健康失去信心，原文却让looks对健康产生作用，所以回看第二段第二句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“on health”的前面主语来源是looks，意思是某类外表追求最终落到健康上。C的“losing faith in”通常需要一个人或群体作主体，表示对health不再相信。\u003c/p>\n\u003cp>looks在原句中是造成后果的外表标准，不是拥有信念的人。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest beauty should not be defined by looks that end up impinging on health.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段的impinging on在这里表示对……失去信心。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“losing faith in”和原文“on health”都把health放在关系末端，因为选项要求某人对健康失去信心，原文却让looks对健康产生作用，所以回看第二段第二句。\u003c/p>\n\u003cp>原文“on health”的前面主语来源是looks，意思是某类外表追求最终落到健康上。C的“losing faith in”通常需要一个人或群体作主体，表示对health不再相信。\u003c/p>\n\u003cp>原句没有写谁的信念发生变化，也没有faith、trust或belief一类内容；它讨
