uote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“setting a high [xxx] threshold for models”，保留了相应遮挡。当时的定位线索是：D里的“threshold for models”和原文“regarding the age”都在谈规则怎样给模特设定条件，因为选项写一项高门槛，原文写年龄等特征受规则约束，所以回看第六段第一句和CFW拒绝进入的执行句。读完全文后，做题模式再经交叉验证排除D，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。但段落没有给年龄门槛的具体数值，也没有说明什么叫high。\u003c/p>\n\u003cp>D把出现age扩大成明确的年龄方向和排除原因。C指出忽视模特健康，能与章程的健康责任和准入执行连成完整关系；D所需的高年龄门槛规则在原文中并未建立。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>设计师最可能被哥本哈根时装周拒绝，是因为他给模特设置很高的年龄门槛。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“threshold for models”和原文“regarding the age”都在谈规则怎样给模特设定条件，因为选项写一项高门槛，原文写年龄等特征受规则约束，所以回看第六段第一句和CFW拒绝进入的执行句。\u003c/p>\n\u003cp>第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。但段落没有给年龄门槛的具体数值，也没有说明什么叫high。\u003c/p>\n\u003cp>章程采用限制参加时装周的办法促使行业遵守规则，且直接强调行业对body ideals、especially on young people的责任。年龄是被规则涉及的一项，不能自动推出设计师因为把门槛设得太高而被拒绝。\u003c/p>\n\u003cp>D把出现age扩大成明确的年龄方向和排除原因。C指出忽视模特健康，能与章程的健康责任和准入执行连成完整关系；D所需的高年龄门槛规则在原文中并未建立。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003cp>丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Designers will be excluded because they require models to be too old.\u003c/p>\n\u003cp>设计师会因要求模特年龄过大而被排除。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要说明章程禁止把年龄门槛定得过高。原文只列age为监管事项，没有给高低方向或上限，提到年龄不等于支持这种惩罚原因。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调调整危害健康的身体理想；对拒绝参展的具体原因，还要看章程保护什么，以及哪种行为违反这个要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>setting a high age threshold for models\u003cbr>给模特设置很高的年龄门槛\u003c/p>\n\u003c/blockquote>\n\u003cp>D把出现age扩大成明确的年龄方向和排除原因。C指出忽视模特健康，能与章程的健康责任和准入执行连成完整关系；D所需的高年龄门槛规则在原文中并未建立。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"24题结论","level":2,"raw":"### 24题结论\n\n> **24. C. showing little concern for health factors**\n\nA：原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。\n\nB：原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。\n\nC：原文“take responsibility”要求时尚行业意识到并承担自己对身体审美、尤其是年轻人的影响；C的“showing little concern”写的是设计师对相关因素缺少关心。\n\nD：第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"question":"24","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>24. C. showing little concern for health factors\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。\u003c/p>\n\u003cp>B：原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。\u003c/p>\n\u003cp>C：原文“take responsibility”要求时尚行业意识到并承担自己对身体审美、尤其是年轻人的影响；C的“showing little concern”写的是设计师对相关因素缺少关心。\u003c/p>\n\u003cp>D：第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升","level":1,"raw":"# 4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\n\n在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\n\n以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\n\n**逻辑层次1：法国的强制性措施**（段落1-2核心事件） 法国决定：时尚产业失去定义女性身体美的绝对权利 → 立法措施：【禁止雇用超瘦模特 + 禁止煽动过度瘦身的网站】→ 动机：（保护健康 + 要求产业对其发送的社会信号负责）\n\n↓（深层含义）\n\n**逻辑层次2：禁令的潜在影响**（段落3理念转变） 对个体的影响：（不让他人成为美的仲裁者）→ 价值观转变：（关注性格和智力等无形品质 // 而非追求极端身材）\n\n//（批判转折）\n\n**逻辑层次3：法国措施的局限性**（段落4问题分析） 过度依赖严厉惩罚：（85,000美元罚款 + 6个月监禁）→ 试图改变的文化问题：（美仍被视为肤浅的、露骨的）\n\n↓（替代方案）\n\n**逻辑层次4：行业自律的尝试**（段落5-6对比方案） 时尚产业的自觉：（认识到专注物质装饰和理想化身体的内在问题）→ 自愿标准模式：【丹麦模式：（行业协议 + 道德宪章 + 承担责任）→ 执行机制：（拒绝参加时装周 + 点名批评）】// 对比法国的法律强制\n\n↓（最佳解决方案）\n\n**逻辑层次5：理想的解决路径**（段落7结论建议） 更好的方法：道德说服 > 法律强制 → 最终目标：将美的概念提升到超越特定行业的物质标准\n\n↑（全文主旨）\n\n全文核心观点：面对时尚产业对身体理想的扭曲影响，法国采取了严厉的法律措施，但依靠道德说服和行业自律可能是更好的选择，最终目标应该是将美的概念提升到超越物质标准的层面。","context":{"mode":"newtype","kind":"smallTitle","current":""},"meta":{"kind":"standard"},"focusId":null,"html":"\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：法国的强制性措施\u003c/strong>（段落1-2核心事件） 法国决定：时尚产业失去定义女性身体美的绝对权利 → 立法措施：【禁止雇用超瘦模特 + 禁止煽动过度瘦身的网站】→ 动机：（保护健康 + 要求产业对其发送的社会信号负责）\u003c/p>\n\u003cp>↓（深层含义）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：禁令的潜在影响\u003c/strong>（段落3理念转变） 对个体的影响：（不让他人成为美的仲裁者）→ 价值观转变：（关注性格和智力等无形品质 // 而非追求极端身材）\u003c/p>\n\u003cp>//（批判转折）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：法国措施的局限性\u003c/strong>（段落4问题分析） 过度依赖严厉惩罚：（85,000美元罚款 + 6个月监禁）→ 试图改变的文化问题：（美仍被视为肤浅的、露骨的）\u003c/p>\n\u003cp>↓（替代方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：行业自律的尝试\u003c/strong>（段落5-6对比方案） 时尚产业的自觉：（认识到专注物质装饰和理想化身体的内在问题）→ 自愿标准模式：【丹麦模式：（行业协议 + 道德宪章 + 承担责任）→ 执行机制：（拒绝参加时装周 + 点名批评）】// 对比法国的法律强制\u003c/p>\n\u003cp>↓（最佳解决方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：理想的解决路径\u003c/strong>（段落7结论建议） 更好的方法：道德说服 &gt; 法律强制 → 最终目标：将美的概念提升到超越特定行业的物质标准\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：面对时尚产业对身体理想的扭曲影响，法国采取了严厉的法律措施，但依靠道德说服和行业自律可能是更好的选择，最终目标应该是将美的概念提升到超越物质标准的层面。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 41题","level":2,"raw":"### 小标题题 · 41题\n\n**答案：D. A Public Challenge to the Industry’s Ideal / 对行业理想体型的公开挑战**\n\n由限制雇用极瘦模特引出谁有权定义女性身体理想。\n\n> When a country restricts the employment of extremely thin models, it challenges more than a particular casting decision.\n>\n> The immediate targets may be agencies, employers and websites, but the larger issue is who may set standards that influence people far beyond the fashion business itself.\n\n段内推进：\n\n> 由限制雇用极瘦模特引出谁有权定义女性身体理想。\n\nPublic Challenge对应法律把行业内部审美判断带进公共讨论，Industry’s Ideal对应行业向女性推广的理想身材；标题不是在报道一次普通选角。\n\n最强干扰项C（Giving Designers Complete Freedom from Responsibility）容易因相同话题进入考虑。但质疑行业绝对权利正是在追究公共责任，不能概括成给予设计师无限自由。\n\n**41题选D。**","context":{"mode":"newtype","kind":"smallTitle","current":"41"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：D. A Public Challenge to the Industry’s Ideal / 对行业理想体型的公开挑战\u003c/strong>\u003c/p>\n\u003cp>由限制雇用极瘦模特引出谁有权定义女性身体理想。\u003c/p>\n\u003cblockquote>\n\u003cp>When a country restricts the employment of extremely thin models, it challenges more than a particular casting decision.\u003c/p>\n\u003cp>The immediate targets may be agencies, employers and websites, but the larger issue is who may set standards that influence people far beyond the fashion business itself.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由限制雇用极瘦模特引出谁有权定义女性身体理想。\u003c/p>\n\u003c/blockquote>\n\u003cp>Public Challenge对应法律把行业内部审美判断带进公共讨论，Industry’s Ideal对应行业向女性推广的理想身材；标题不是在报道一次普通选角。\u003c/p>\n\u003cp>最强干扰项C（Giving Designers Complete Freedom from Responsibility）容易因相同话题进入考虑。但质疑行业绝对权利正是在追究公共责任，不能概括成给予设计师无限自由。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 42题","level":2,"raw":"### 小标题题 · 42题\n\n**答案：E. Health Is Not the Only Message / 传递的并不只有健康信息**\n\n从模特健康扩大到行业向公众传递的自我价值尺度。\n\n> The protection of models from dangerous eating habits is an obvious benefit.\n>\n> The policy asks an industry to consider not only what happens to the people it employs, but also what its messages ask audiences to believe.\n\n段内推进：\n\n> 从模特健康扩大到行业向公众传递的自我价值尺度。\n\nHealth对应保护模特免于危险饮食，Not the Only Message对应对女性尤其年轻女性个人价值尺度的影响；标题完整覆盖从雇员到公众的扩大。\n\n最强干扰项A（Replacing Every Rule with a Personal Diet）容易因相同话题进入考虑。但个人节食是压力可能导致的行为，本段讨论如何减少这层压力。\n\n**42题选E。**","context":{"mode":"newtype","kind":"smallTitle","current":"42"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：E. Health Is Not the Only Message / 传递的并不只有健康信息\u003c/strong>\u003c/p>\n\u003cp>从模特健康扩大到行业向公众传递的自我价值尺度。\u003c/p>\n\u003cblockquote>\n\u003cp>The protection of models from dangerous eating habits is an obvious benefit.\u003c/p>\n\u003cp>The policy asks an industry to consider not only what happens to the people it employs, but also what its messages ask audiences to believe.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从模特健康扩大到行业向公众传递的自我价值尺度。\u003c/p>\n\u003c/blockquote>\n\u003cp>Health对应保护模特免于危险饮食，Not the Only Message对应对女性尤其年轻女性个人价值尺度的影响；标题完整覆盖从雇员到公众的扩大。\u003c/p>\n\u003cp>最强干扰项A（Replacing Every Rule with a Personal Diet）容易因相同话题进入考虑。但个人节食是压力可能导致的行为，本段讨论如何减少这层压力。\u003c/p>\n\u003cp>\u003cstrong>42题选E。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 43题","level":2,"raw":"### 小标题题 · 43题\n\n**答案：F. Punishment Cannot Redefine Beauty by Itself / 惩罚无法独自重新定义美**\n\n区分守法行为与审美文化改变，指出重罚的局限。\n\n> A fine can make an employer obey a rule without changing the beliefs that produced the problem.\n>\n> Enforcement can establish a boundary, but a new understanding of beauty requires people to question the standards on the other side of that boundary as well.\n\n段内推进：\n\n> 区分守法行为与审美文化改变 → 指出重罚的局限。\n\nPunishment对应fine与severe penalties，Cannot Redefine Beauty by Itself对应守法以后旧审美文化仍可能存在；by itself保留法律有作用但不充分的限定。\n\n最强干扰项D（A Public Challenge to the Industry’s Ideal）容易因相同话题进入考虑。但前者概括法律发起挑战，本段进一步追问单靠惩罚能否改变价值观。\n\n**43题选F。**","context":{"mode":"newtype","kind":"smallTitle","current":"43"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：F. Punishment Cannot Redefine Beauty by Itself / 惩罚无法独自重新定义美\u003c/strong>\u003c/p>\n\u003cp>区分守法行为与审美文化改变，指出重罚的局限。\u003c/p>\n\u003cblockquote>\n\u003cp>A fine can make an employer obey a rule without changing the beliefs that produced the problem.\u003c/p>\n\u003cp>Enforcement can establish a boundary, but a new understanding of beauty requires people to question the standards on the other side of that boundary as well.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>区分守法行为与审美文化改变 → 指出重罚的局限。\u003c/p>\n\u003c/blockquote>\n\u003cp>Punishment对应fine与severe penalties，Cannot Redefine Beauty by Itself对应守法以后旧审美文化仍可能存在；by itself保留法律有作用但不充分的限定。\u003c/p>\n\u003cp>最强干扰项D（A Public Challenge to the Industry’s Ideal）容易因相同话题进入考虑。但前者概括法律发起挑战，本段进一步追问单靠惩罚能否改变价值观。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 44题","level":2,"raw":"### 小标题题 · 44题\n\n**答案：G. Making Voluntary Commitments Matter / 使自愿承诺产生约束力**\n\n解释行业章程如何通过准入和声誉压力执行。\n\n> Voluntary standards need not mean empty promises.\n>\n> Such arrangements depend on shared expectations and reputation, making responsibility visible within the industry instead of leaving all influence to the threat of legal punishment.\n\n段内推进：\n\n> 解释行业章程如何通过准入和声誉压力执行。\n\nVoluntary Commitments对应接受行业章程，Matter对应不遵守会失去活动准入并面对公开批评；标题把自愿承诺与执行后果联系起来。\n\n最强干扰项C（Giving Designers Complete Freedom from Responsibility）容易因相同话题进入考虑。但自愿标准仍然要求遵守章程，并非免除设计师责任。\n\n**44题选G。**","context":{"mode":"newtype","kind":"smallTitle","current":"44"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：G. Making Voluntary Commitments Matter / 使自愿承诺产生约束力\u003c/strong>\u003c/p>\n\u003cp>解释行业章程如何通过准入和声誉压力执行。\u003c/p>\n\u003cblockquote>\n\u003cp>Voluntary standards need not mean empty promises.\u003c/p>\n\u003cp>Such arrangements depend on shared expectations and reputation, making responsibility visible within the industry instead of leaving all influence to the threat of legal punishment.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释行业章程如何通过准入和声誉压力执行。\u003c/p>\n\u003c/blockquote>\n\u003cp>Voluntary Commitments对应接受行业章程，Matter对应不遵守会失去活动准入并面对公开批评；标题把自愿承诺与执行后果联系起来。\u003c/p>\n\u003cp>最强干扰项C（Giving Designers Complete Freedom from Responsibility）容易因相同话题进入考虑。但自愿标准仍然要求遵守章程，并非免除设计师责任。\u003c/p>\n\u003cp>\u003cstrong>44题选G。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"小标题题 · 45题","level":2,"raw":"### 小标题题 · 45题\n\n**答案：B. Looking Beyond the Body as a Measure / 超越以身材衡量价值**\n\n从健康形象再推进到品格和才智等非物质价值。\n\n> Even an effective industry charter leaves a deeper question unanswered: why should appearance be the principal measure of a person’s value?\n>\n> It makes the industry’s material standards less central to the way individuals understand themselves.\n\n段内推进：\n\n> 从健康形象再推进到品格和才智等非物质价值。\n\nBeyond the Body对应不以衣服尺码评价品格与智力，as a Measure对应衡量个人价值的尺度；这比改用一种更健康的体型标准更进一层。\n\n最强干扰项A（Replacing Every Rule with a Personal Diet）容易因相同话题进入考虑。但本段降低体型在价值判断中的地位，不是要求人人选择自己的节食方案。\n\n**45题选B。**","context":{"mode":"newtype","kind":"smallTitle","current":"45"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>\u003cstrong>答案：B. Looking Beyond the Body as a Measure / 超越以身材衡量价值\u003c/strong>\u003c/p>\n\u003cp>从健康形象再推进到品格和才智等非物质价值。\u003c/p>\n\u003cblockquote>\n\u003cp>Even an effective industry charter leaves a deeper question unanswered: why should appearance be the principal measure of a person’s value?\u003c/p>\n\u003cp>It makes the industry’s material standards less central to the way individuals understand themselves.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从健康形象再推进到品格和才智等非物质价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>Beyond the Body对应不以衣服尺码评价品格与智力，as a Measure对应衡量个人价值的尺度；这比改用一种更健康的体型标准更进一层。\u003c/p>\n\u003cp>最强干扰项A（Replacing Every Rule with a Personal Diet）容易因相同话题进入考虑。但本段降低体型在价值判断中的地位，不是要求人人选择自己的节食方案。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 全局解析","level":2,"raw":"### 排序题 · 全局解析\n\n| 段落 | 这一段在做什么 |\n| --- | --- |\n| A | 从限制极瘦模特提出更广影响 |\n| B | 以道德章程落实共同期待 |\n| C | 由公众影响推出责任，再转向手段审视 |\n| D | 转入仅改变约束来源仍不足 |\n| E | 指出惩罚与说服之间的缺口 |\n| F | 解释更广影响是传给公众的价值尺度 |\n| G | 解释自愿规范仍有约束 |\n| H | 综合法律、章程与价值观改变 |\n\n全文推进：\n\n> 从限制极瘦模特提出更广影响 → 解释更广影响是传给公众的价值尺度 → 由公众影响推出责任，再转向手段审视 → 指出惩罚与说服之间的缺口 → 以道德章程落实共同期待 → 解释自愿规范仍有约束 → 转入仅改变约束来源仍不足 → 综合法律、章程与价值观改变\n\n完整顺序：\n\n**A → F → C → E → B → G → D → H**\n\n41—45：F、C、B、G、D。","context":{"mode":"newtype","kind":"sorting","current":""},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>从限制极瘦模特提出更广影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>以道德章程落实共同期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>由公众影响推出责任，再转向手段审视\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>转入仅改变约束来源仍不足\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>指出惩罚与说服之间的缺口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>解释更广影响是传给公众的价值尺度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>解释自愿规范仍有约束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>综合法律、章程与价值观改变\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从限制极瘦模特提出更广影响 → 解释更广影响是传给公众的价值尺度 → 由公众影响推出责任，再转向手段审视 → 指出惩罚与说服之间的缺口 → 以道德章程落实共同期待 → 解释自愿规范仍有约束 → 转入仅改变约束来源仍不足 → 综合法律、章程与价值观改变\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → F → C → E → B → G → D → H\u003c/strong>\u003c/p>\n\u003cp>41—45：F、C、B、G、D。\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 41题","level":2,"raw":"### 排序题 · 41题\n\n41位于全文第2个位置，完整衔接是A → F → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段A的结尾：\n\n> That description is reasonable, but it does not capture the whole significance of asking a powerful industry to change the bodies it presents to the public.\n\n候选F的开头：\n\n> The wider significance lies in the message carried by those bodies.\n\n后段C的开头：\n\n> That reach gives the industry a responsibility to consider what its images encourage.\n\n前文已经落到`the whole significance`，F继续处理这一对象，完成“解释更广影响是传给公众的价值尺度”。到本段末尾，讨论又落到`well beyond its own employees`，这正好为下一段“由公众影响推出责任，再转向手段审视”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 从限制极瘦模特提出更广影响 → 解释更广影响是传给公众的价值尺度 → 由公众影响推出责任，再转向手段审视\n\n最强候选C的功能是“由公众影响推出责任，再转向手段审视”。它也属于同一论题，但若直接放在这里，就会跳过“解释更广影响是传给公众的价值尺度”这一必要环节；其段首“That reach gives the industry a responsibility to consider what its images encourage.”需要的前提与A当前收束的对象不一致，后续也接不出C所需的`well beyond its own employees`。\n\n**41题选F。**","context":{"mode":"newtype","kind":"sorting","current":"F"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>41位于全文第2个位置，完整衔接是A → F → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>That description is reasonable, but it does not capture the whole significance of asking a powerful industry to change the bodies it presents to the public.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The wider significance lies in the message carried by those bodies.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That reach gives the industry a responsibility to consider what its images encourage.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>the whole significance\u003c/code>，F继续处理这一对象，完成“解释更广影响是传给公众的价值尺度”。到本段末尾，讨论又落到\u003ccode>well beyond its own employees\u003c/code>，这正好为下一段“由公众影响推出责任，再转向手段审视”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从限制极瘦模特提出更广影响 → 解释更广影响是传给公众的价值尺度 → 由公众影响推出责任，再转向手段审视\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“由公众影响推出责任，再转向手段审视”。它也属于同一论题，但若直接放在这里，就会跳过“解释更广影响是传给公众的价值尺度”这一必要环节；其段首“That reach gives the industry a responsibility to consider what its images encourage.”需要的前提与A当前收束的对象不一致，后续也接不出C所需的\u003ccode>well beyond its own employees\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 42题","level":2,"raw":"### 排序题 · 42题\n\n42位于全文第3个位置，完整衔接是F → C → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段F的结尾：\n\n> The industry’s influence therefore extends well beyond its own employees.\n\n候选C的开头：\n\n> That reach gives the industry a responsibility to consider what its images encourage.\n\n后段E的开头：\n\n> One such means is severe punishment.\n\n前文已经落到`well beyond its own employees`，C继续处理这一对象，完成“由公众影响推出责任，再转向手段审视”。到本段末尾，讨论又落到`the means`，这正好为下一段“指出惩罚与说服之间的缺口”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 解释更广影响是传给公众的价值尺度 → 由公众影响推出责任，再转向手段审视 → 指出惩罚与说服之间的缺口\n\n最强候选F的功能是“解释更广影响是传给公众的价值尺度”。它也属于同一论题，但若直接放在这里，就会跳过“由公众影响推出责任，再转向手段审视”这一必要环节；其段首“The wider significance lies in the message carried by those bodies.”需要的前提与F当前收束的对象不一致，后续也接不出E所需的`the means`。\n\n**42题选C。**","context":{"mode":"newtype","kind":"sorting","current":"C"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>42位于全文第3个位置，完整衔接是F → C → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The industry’s influence therefore extends well beyond its own employees.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That reach gives the industry a responsibility to consider what its images encourage.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One such means is severe punishment.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>well beyond its own employees\u003c/code>，C继续处理这一对象，完成“由公众影响推出责任，再转向手段审视”。到本段末尾，讨论又落到\u003ccode>the means\u003c/code>，这正好为下一段“指出惩罚与说服之间的缺口”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释更广影响是传给公众的价值尺度 → 由公众影响推出责任，再转向手段审视 → 指出惩罚与说服之间的缺口\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“解释更广影响是传给公众的价值尺度”。它也属于同一论题，但若直接放在这里，就会跳过“由公众影响推出责任，再转向手段审视”这一必要环节；其段首“The wider significance lies in the message carried by those bodies.”需要的前提与F当前收束的对象不一致，后续也接不出E所需的\u003ccode>the means\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 43题","level":2,"raw":"### 排序题 · 43题\n\n43位于全文第5个位置，完整衔接是E → B → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段E的结尾：\n\n> This gap suggests the need for a method that works on shared expectations.\n\n候选B的开头：\n\n> Shared expectations can take a concrete form in an ethical charter.\n\n后段G的开头：\n\n> A practical consequence helps keep the charter from becoming a declaration nobody follows.\n\n前文已经落到`shared expectations`，B继续处理这一对象，完成“以道德章程落实共同期待”。到本段末尾，讨论又落到`practical consequence`，这正好为下一段“解释自愿规范仍有约束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 指出惩罚与说服之间的缺口 → 以道德章程落实共同期待 → 解释自愿规范仍有约束\n\n最强候选G的功能是“解释自愿规范仍有约束”。它也属于同一论题，但若直接放在这里，就会跳过“以道德章程落实共同期待”这一必要环节；其段首“A practical consequence helps keep the charter from becoming a declaration nobody follows.”需要的前提与E当前收束的对象不一致，后续也接不出G所需的`practical consequence`。\n\n**43题选B。**","context":{"mode":"newtype","kind":"sorting","current":"B"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>43位于全文第5个位置，完整衔接是E → B → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This gap suggests the need for a method that works on shared expectations.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Shared expectations can take a concrete form in an ethical charter.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A practical consequence helps keep the charter from becoming a declaration nobody follows.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>shared expectations\u003c/code>，B继续处理这一对象，完成“以道德章程落实共同期待”。到本段末尾，讨论又落到\u003ccode>practical consequence\u003c/code>，这正好为下一段“解释自愿规范仍有约束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>指出惩罚与说服之间的缺口 → 以道德章程落实共同期待 → 解释自愿规范仍有约束\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选G的功能是“解释自愿规范仍有约束”。它也属于同一论题，但若直接放在这里，就会跳过“以道德章程落实共同期待”这一必要环节；其段首“A practical consequence helps keep the charter from becoming a declaration nobody follows.”需要的前提与E当前收束的对象不一致，后续也接不出G所需的\u003ccode>practical consequence\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n"},{"section":"第四鸟 · 新题型","title":"排序题 · 44题","level":2,"raw":"### 排序题 · 44题\n\n44位于全文第6个位置，完整衔接是B → G → D。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\n\n前段B的结尾：\n\n> Peer pressure can then reinforce a commitment that was initially made voluntarily.\n\n候选G的开头：\n\n> A practical consequence helps keep the charter from becoming a declaration nobody follows.\n\n后段D的开头：\n\n> Different sources of pressure, however, can still leave the same narrow ideal in place.\n\n前文已经落到`practical consequence`，G继续处理这一对象，完成“解释自愿规范仍有约束”。到本段末尾，讨论又落到`a different source of pressure`，这正好为下一段“转入仅改变约束来源仍不足”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\n\n局部推进：\n\n> 以道德章程落实共同期待 → 解释自愿规范仍有约束 → 转入仅改变约束来源仍不足\n\n最强候选B的功能是“以道德章程落实共同期待”。它也属于同一论题，但若直接放在这里，就会跳过“解释自愿规范仍有约束”这一必要环节；其段首“Shared expectations can take a concrete form in an ethical charter.”需要的前提与B当前收束的对象不一致，后续也接不出D所需的`a different source of pressure`。\n\n**44题选G。**","context":{"mode":"newtype","kind":"sorting","current":"G"},"meta":{"kind":"newtype"},"focusId":null,"html":"\u003cp>44位于全文第6个位置，完整衔接是B → G → D。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Peer pressure can then reinforce a commitment that was initially made voluntarily.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A practical consequence helps keep the charter from becoming a declaration nobody follows.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Different sources of pressure, however, can still leave the same narrow ideal in place.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>practical consequence\u003c/code>，G继续处理这一对象，完成“解释自愿规范仍有约束”。到本段末尾，讨论又落到\u003ccode>a different source of pressure\u003c/code>，这正好为下一段“转入仅改变约束来源仍不足”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以道德章程落实共同期待 → 解释自愿规范仍有约束 → 转入仅改变约束来源仍不足\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“以道德章程落实共同期待”。它也属于同一论题，但若直接放在这里，就会跳过“解释自 由X增至Y。** |\n| 图表题 | The figures reveal a changing public view of what counts as beauty. | 这些数据揭示了公众审美观念的变化。 |\n| 图表题 | Preference for A became stronger while preference for B declined. | 对A的偏好增强，而对B的偏好下降。 |\n| **文本评论题** | **The passage questions an industry’s authority to define a public ideal.** | **短文质疑某个行业定义公众理想标准的权力。** |\n| 文本评论题 | The author contrasts legal punishment with voluntary standards. | 作者将法律惩罚与自愿规范作对比。 |\n| 文本评论题 | The discussion moves from protecting health to recognising a broader range of human qualities. | 讨论从保护健康推进到认识更广泛的人类品质。 |","context":{"mode":"image","asset":"articleAnnotated","label":"2016英语一Text 1重点词与语境","focus":[0,0,1080,6116],"sourceW":1080,"sourceH":6116,"includeTitle":true},"meta":{},"focusId":null,"html":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture challenges the idea that appearance alone determines individual worth.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画挑战仅凭外貌判断个人价值的观念。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is measuring personal success against a standard imposed by B.\u003c/td>\n\u003ctd>A正用B强加的标准衡量个人成功。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast invites attention to qualities beyond physical appearance.\u003c/td>\n\u003ctd>这一对比引导人们关注外在形象之外的品质。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The share of people choosing A increased from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>选择A的人群比例由X增至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures reveal a changing public view of what counts as beauty.\u003c/td>\n\u003ctd>这些数据揭示了公众审美观念的变化。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n const NEWTYPE = {"smallTitle":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp>\u003cstrong>A. Replacing Every Rule with a Personal Diet\u003c/strong>\u003c/p>\u003cp>\u003cstrong>B. Looking Beyond the Body as a Measure\u003c/strong>\u003c/p>\u003cp>\u003cstrong>C. Giving Designers Complete Freedom from Responsibility\u003c/strong>\u003c/p>\u003cp>\u003cstrong>D. A Public Challenge to the Industry’s Ideal\u003c/strong>\u003c/p>\u003cp>\u003cstrong>E. Health Is Not the Only Message\u003c/strong>\u003c/p>\u003cp>\u003cstrong>F. Punishment Cannot Redefine Beauty by Itself\u003c/strong>\u003c/p>\u003cp>\u003cstrong>G. Making Voluntary Commitments Matter\u003c/strong>\u003c/p>\u003csection class=\"newtype-qblock\" data-q=\"41\">\u003ch3>41.\u003c/h3>\u003cp>When a country restricts the employment of extremely thin models, it challenges more than a particular casting decision. It questions whether an industry has an unlimited right to define the bodies women should admire. Legal intervention brings that usually private judgement into public debate. The immediate targets may be agencies, employers and websites, but the larger issue is who may set standards that influence people far beyond the fashion business itself.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"42\">\u003ch3>42.\u003c/h3>\u003cp>The protection of models from dangerous eating habits is an obvious benefit. Less visible, but no less important, is the signal sent to everyone who sees their images. A young woman may learn to measure her worth against a body presented as desirable. Challenging that image can therefore loosen a wider social pressure. The policy asks an industry to consider not only what happens to the people it employs, but also what its messages ask audiences to believe.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"43\">\u003ch3>43.\u003c/h3>\u003cp>A fine can make an employer obey a rule without changing the beliefs that produced the problem. This is the difficulty with relying too heavily on severe penalties. A culture that equates beauty with a narrowly defined body may survive after an illegal practice has disappeared from the runway. Enforcement can establish a boundary, but a new understanding of beauty requires people to question the standards on the other side of that boundary as well.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"44\">\u003ch3>44.\u003c/h3>\u003cp>Voluntary standards need not mean empty promises. An industry can attach participation in a major event to compliance with an ethical charter. Designers and agencies then face a practical consequence when they ignore agreed requirements. Public criticism may add pressure from colleagues and audiences. Such arrangements depend on shared expectations and reputation, making responsibility visible within the industry instead of leaving all influence to the threat of legal punishment.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-q=\"45\">\u003ch3>45.\u003c/h3>\u003cp>Even an effective industry charter leaves a deeper question unanswered: why should appearance be the principal measure of a person’s value? Qualities such as judgement, character and intelligence cannot be reduced to a clothing size. Education and public discussion can help people recognise these less visible qualities. The most ambitious response therefore reaches beyond healthier images. It makes the industry’s material standards less central to the way individuals understand themselves.\u003c/p>\u003c/section>","sorting":"\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\u003cp class=\"orderline\">A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\u003csection class=\"newtype-qblock\" data-letter=\"A\">\u003ch3>A.\u003c/h3>\u003cp>Extremely thin models have become the target of legal restrictions in some debates about fashion. The restrictions are often described as health measures. That description is reasonable, but it does not capture the whole significance of asking a powerful industry to change the bodies it presents to the public.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"B\">\u003ch3>B.\u003c/h3>\u003cp>Shared expectations can take a concrete form in an ethical charter. Participants publicly accept requirements concerning models’ age and health. If access to an important event depends on compliance, the charter has a practical consequence. Peer pressure can then reinforce a commitment that was initially made voluntarily.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"C\">\u003ch3>C.\u003c/h3>\u003cp>That reach gives the industry a responsibility to consider what its images encourage. Protecting employees from dangerous practices is one part of the task; reducing harmful pressure on audiences is another. A policy can pursue both aims, yet the means used to secure them still deserve careful examination.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"D\">\u003ch3>D.\u003c/h3>\u003cp>Different sources of pressure, however, can still leave the same narrow ideal in place. Healthier bodies are not the only alternative to an unhealthy image. A broader understanding of beauty would also recognise intelligence and character, making appearance a less dominant measure of human worth.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"E\">\u003ch3>E.\u003c/h3>\u003cp>One such means is severe punishment. It may deter employers from breaking a rule, but deterrence is not the same as persuasion. People can obey a legal limit while continuing to admire the very ideal behind it. This gap suggests the need for a method that works on shared expectations.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"F\">\u003ch3>F.\u003c/h3>\u003cp>The wider significance lies in the message carried by those bodies. Fashion images can suggest that a particular shape determines individual worth. Audiences, especially young people, may absorb that message even when they have no intention of becoming models. The industry’s influence therefore extends well beyond its own employees.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"G\">\u003ch3>G.\u003c/h3>\u003cp>A practical consequence helps keep the charter from becoming a declaration nobody follows. It also shows why voluntary action should not be confused with the absence of standards. The industry still accepts a duty and faces scrutiny; it simply uses a different source of pressure to support that duty.\u003c/p>\u003c/section>\u003csection class=\"newtype-qblock\" data-letter=\"H\">\u003ch3>H.\u003c/h3>\u003cp>That broader understanding supplies the longest-term aim. Laws and industry charters may improve immediate practices, but they should also encourage people to question the scale by which they judge themselves. Responsibility ultimately involves changing both the images an industry produces and the importance society gives those images.\u003c/p>\u003c/section>"};
const FULL = "\u003ch2>史上最强阅读复盘法：一石五鸟法\u003c/h2>\n\u003ch3>省流：一石五鸟法怎么做\u003c/h3>\n\u003cp>为什么说考研英语实际只要两到三个月就足以考到70以上，两到三个月就是它的真实有效备考所需的工作量。\u003c/p>\n\u003cp>下面我们来介绍一种全网首发的\u003cstrong>一石五鸟\u003c/strong>阅读训练法，\u003cstrong>同时\u003c/strong>备考\u003cstrong>单词，阅读，新题型，翻译，作文\u003c/strong>。\u003c/p>\n\u003cp>\u003cstrong>第一步，标出文章中所有不会的生词并背掉，这一步可以在语境中进一步巩固单词\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第二步，使用意群法口译文章中的每一句话，一定先按照英文语序理解意群，再转换成中文，其中每篇文章的3-5句长难句要求手译，这一步就把翻译给练掉了\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第三步，去分析每道题的四个选项的题型出处错误类型，命题人的误导方式，以及他们的依据，以命题人视角来复盘，而不是简单的对答案\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第四步，基于刚才的精读和分析，现在我们脑子里已经有了文章的逻辑框架，然后就可以做我们根据本文按照考研标准改编的小标题题和排序题，这一步，是训练新题型所需的素养用的\u003c/strong>；\u003c/p>\n\u003cp>\u003cstrong>第五步，积累并记忆每篇文章中所有的能适配我们思路的作文语料，分第一段描述题目信息的有用表达和主题词两部分。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>我们的方法对于英语二冲击阅读满分，英语一适应25年后的风格和难度至关重要，是全网首发，将单词+阅读+新题型+翻译+作文的备考五合一，一石五鸟，也是英语能够节省90%以上时间的原理，下面我们来简单介绍下为什么要这样做。\u003c/strong>\u003c/p>\n\u003ch3>一石五鸟法的原理\u003c/h3>\n\u003ch4>一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h4>\n\u003cp>省流，我们给大家准备好了带重点表达标注的阅读真题，可以直接用我们的。\u003c/p>\n\u003cp>关于这一点，其实这几年市面上已经有很多人提到并实践了，原因无非是两个：1.在阅读语篇的语境中理解单词能有助于加深记忆；2.考研英语更偏向于逻辑分析，对词汇量的考察强度甚至没有六级高，因此会有高频词中频词这些概念，很多词会在不同年份出现大量复现的情况，所以与直接单词书APP相比，在阅读中背词确实效率更高，有的放矢。并且，自然地，单词熟练，属于我们阅读的基本功之一，因此单词和阅读可以互相训练，绝不仅仅是拆成两个不同的部分。阅读精读过程中，单词都是出现在语境中的，这才是最好的巩固单词的方式。\u003c/p>\n\u003cp>实操的话很简单，做完阅读复盘的时候，要经历翻译全文的过程，这一步的必经之路就是熟悉文章的所有单词，为了\u003cstrong>免除查单词的无效时间\u003c/strong>，我们在的语篇中给大家\u003cstrong>标注了语篇中的单词和词组语义\u003c/strong>，这块主要也是一个资料的问题，我们给大家都做好了。\u003c/p>\n\u003cp>例如：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_vocab_example\" alt=\"重点词语境标注示例\">\u003c/p>\n\u003cp>这样效率就是最高的。\u003c/p>\n\u003ch4>一石五鸟第二鸟-精读文章与翻译练习带来的翻译能力提升\u003c/h4>\n\u003cp>传统的做法为先看语法课再做阅读，10-11月再看翻译课，这个行为至少有以下几点不成立：\u003c/p>\n\u003cp>1.语法课在讲什么？翻译课在讲什么？不都是在讲长难句断句和纯理论视角的语法，那么，为什么会分为两部分割你们两次韭菜，这个骗局已经相当明显了，把\u003cstrong>同一个东西\u003c/strong>拆开讲两遍。\u003c/p>\n\u003cp>2.第二，翻译不应该是进行阅读训练所需的基本素质吗？我们\u003cstrong>阅读练习的过程就包含翻译\u003c/strong>，阅读做完复盘的过程，就是练习翻译的过程。那我不是应该阅读之前学吗？阅读需要翻译，应该先学翻译，我们阅读都搞完了，还学什么翻译，已经会了。就算要看翻译课，也应该是在阅读之前才符合逻辑。\u003c/p>\n\u003cp>3.按照那些语法课翻译课的做法，做完阅读时复盘慢慢搞没问题，但是考试的时候明显不是这样，一般一篇阅读要控制在15分钟左右，要想在考场上速读句子，靠市面上的各种语法课翻译课的方式去分析长难句是一种很扯淡的做法。然后某些机构和博主让你们速读时马马虎虎的读，然后依靠定位法，各种秒杀法等所谓技巧，但是复盘的时候又当成高中的语法题一样去抠句子，那请问这种复盘有什么意义？\u003cstrong>前后矛盾\u003c/strong>，逻辑混乱。\u003c/p>\n\u003cp>\u003cstrong>因此，结论相当明显了，阅读做题时的速读和复盘的精读应该使用同一种方法，并且还要摒弃所谓的繁文缛节的语法。这里我推荐一种完美符合这种思想的阅读方法，意群法，如下：\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_intent_example\" alt=\"意群法示例\">\u003c/p>\n\u003cp>这种方式，你们\u003cstrong>所需的语法仅需要主谓宾的划分\u003c/strong>，剩下的都是修饰成分，这是小学和初中就学过的。语法很重要，但语法的重要很少体现在阅读中，没有哪个考研人在考场上做阅读时会先分析语法，再读懂句子。只有提高阅读速度，才又充分的时间分给不确定的题目和主观题，才能有效提分。因此全程不用语法，不分析结构才是正解。\u003cstrong>很多同学在阅读时的常规视角为在读句子时总觉得英语语序很别扭，所以总是把句子调整成顺畅的中文再去理解\u003c/strong>，但事实上这只会造成阅读速度奇慢，我们做题需要的只有句意，只有翻译题才需要抠字眼翻译成文绉绉的样子。\u003c/p>\n\u003cp>\u003cstrong>那么，我们在使用的时候如何进行训练呢？\u003c/strong>\u003c/p>\n\u003cp>具体操作如下：\u003c/p>\n\u003cp>\u003cstrong>做完某篇阅读后，首先打开阅读大观的意群分析的逐句逐段分析部分，然后对照逐句逐段或者你手头真题的完整的文章，做如下操作：\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>1、将每个句子拆成若干个相对独立且完整的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2、针对每个意群，希望你可以，按字面意思直译每个独立的意群\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3、将每个意群直译后按照中文的语感组合成完整的标准翻译，并转换为通顺的语序\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>注意上述三点都是在口译下进行的，不要搞形式主义，真的全部抄一遍加笔译（很多人这么干过），一定是你自己口译，在脑子里完成意群法翻译的过程，这样才能有效提升考场环境的读文章速度。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>然后，什么是需要手译的，很简单，每篇文章都有三到七句最长的长难句，这几个句子需要你们用笔写出标准翻译（注意过程仍然不用写），方法还是意群法，但是最终输出要转成中文的语序，这一步实际上就是在做翻译题，但是又不是为了做翻译题而做，而是我们复盘阅读时一起进行的副产品，这样才能保质保量的同时效率拉满。例如以下段落，只有唯一的长难句需要手译，并且过程需要你在脑子里实现，最后用笔只写出标准翻译（红字加粗的部分），这种句子请各位挑出来当做翻译题练习即可。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第三鸟-阅读题目复盘带来的阅读思维提升\u003c/h4>\n\u003cp>其实很多人觉得自己真题白刷了，白精读了，原因就是对于题目就是对个答案，看下错题的解析就结束了，这样等于训练的是字面意义上的读文章能力，而不是做题能力，归根结底应试还是需要去针对性的进行一些套路识别的。\u003c/p>\n\u003cp>我们希望各位复盘时一定分析题目的正确选项和错误选项，训练对错误选项发现错误点的能力，明白错误选项的文章出处，命题原理。原因为很多题目因为正确选项改写严重，正选是无法选出来的，只能排除确定出错的选项，保证正确率，具体来说就是：\u003c/p>\n\u003cp>1.这个思想为把选项作为最小单位，不要把一篇阅读理解成五道题。而把一篇阅读理解成20个选项，独立的看待每个选项，用这种方法复盘题目，根本就不用学什么阅读技巧，看那么多课，而且你做一道题等于别人做四道。\u003c/p>\n\u003cp>2.根据实际情况，指出题目考察的文章的哪一句/一段/几段/文章主旨，并给出正确选项的出处（可有多个出处），指出每个错误选项的误导出处在哪里，命题人通常会笃定你翻译不准某些词汇和句子因而对其进行改编，变为错误选项，或笃定你不清楚考察内容的主旨和含义是什么，例如题目考某部分的主旨，三个错误选项是论证这个主旨的支撑细节；关于错误选项的分析，无论是哪种错误，要尽量找出文章中对应的句子（所有的真题解析都会有），比如无中生有中用来误导的片段在文章的什么位置；选项有原句对应，但是歪曲原意是怎么歪曲的；题干问某部分的主旨或整体作用，选项是否虽然原文里有但是只是一个小论据而已等。\u003c/p>\n\u003cp>\u003cstrong>以上的思路市面上也有人讲到过，那这里我们来讲点不一样的，市面上大部分就是带你找到选项出处就结束了，但是实际上对于任何的文科单选题，都有一种通法存在，那就是交叉验证，即用多个判据去交叉判断某个命题的正确性，这里我们用的是定位比对法，写作视角法和全文主旨法三个文科材料阅读类题目最本源的方法，定位比对大家都知道，写作视角法就是对一道题的三个错误选项分别指出：这一题的正确答案如果是某个错误选项，对应的文章部分应该怎么写，跟原来的写法有什么不一样；而全文主旨法就是用全文的主旨去先回答题干，然后和四个选项比对。\u003c/strong>\u003c/p>\n\u003ch4>一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h4>\n\u003cp>首先，这大概率是你们的新题型备考思路：\u003c/p>\n\u003cp>在阅读一刷结束后，分别对新题型里的各题型执行看几十小时网课，做往年真题练习的循环，并且，还要二刷。但是仍然感觉训练量不够，\u003cstrong>却找不到更多的训练资料\u003c/strong>。而且，明明自己认真看完了课，练完了十几年的真题，但是还是错一堆，尤其是排序题，而你的室友只做了几篇，却蒙都能蒙对，心想，新题型真吃天赋。\u003c/p>\n\u003cp>那么，新题型的备考真相是什么？\u003c/p>\n\u003cp>我们先看看考纲考新题型是想考你们什么：\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_overview\" alt=\"新题型考纲总览\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_newtype_table\" alt=\"新题型考纲表格\">\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_cloze_intro\" alt=\"七选五题型说明\">\u003c/p>\n\u003cp>\u003cstrong>七选五，小标题题考察点：文章每段的主旨及其论证主旨的细节\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_smalltitle\" alt=\"小标题题考点\">\u003c/p>\n\u003cp>\u003cstrong>排序题考察点：文章每段的主旨，文章行文逻辑（论证过程），每段的标志性表达\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_sorting\" alt=\"排序题考点\">\u003c/p>\n\u003cp>\u003cstrong>匹配题考察点：文章中出现的不同人物观点的独特性\u003c/strong>\u003c/p>\n\u003cp>\u003cimg data-asset=\"method_matching\" alt=\"匹配题考点\">\u003c/p>\n\u003cp>总结一下：\u003cstrong>文章每段的主旨及其论证主旨的细节，文章行文逻辑（论证过程），每段的标志性表达，文章中出现的不同人物观点的独特性，这些统称为文章的逻辑框架\u003c/strong>\u003c/p>\n\u003cp>新题型无论哪种题型，都在考察段落与全文的逻辑框架，尤其是排序题，之所以你们会觉得新题型很玄学，和努力不成正比，其实原因相当简单：\u003c/p>\n\u003cp>1.你们根本就没努力，没有去练习新题型所考察的素质，但是不能怪你们，因为主流的阅读复盘方法仅仅是翻译一遍，对了答案就结束了，根本没人强调复盘时文章逻辑梳理的重要性。然后那些新题型的课都是靠所谓的技巧秒杀，而且每个老师都不一样，根本没人会好好去读文章。因此，原因就是\u003cstrong>平时没有相关的文章逻辑梳理训练\u003c/strong>，就这么简单。\u003c/p>\n\u003cp>2.文章逻辑这个方面的训练\u003cstrong>单纯靠那十几篇新题型真题是完全不够的\u003c/strong>，特别是语感不好的同学，很多人二刷三刷了真题还是做不好，再加上新题型种类很多，稀释到每种题型其实训练量少得可怜。\u003c/p>\n\u003cp>那么，我们可不可以用阅读的语篇来进行文章逻辑的训练，甚至将阅读的语篇改编成排序题和小标题题，阅读的语篇和新题型的语篇只是篇幅不同，文章的难度不同，但是论证逻辑是相同的，并且我们之前是做过翻译全文这一步的，再梳理逻辑难度没有想象中的高。\u003c/p>\n\u003cp>因此，解法就出来了，在阅读的语篇中就加以文章逻辑的训练，然后再做语篇改编的小标题题和排序题（英语一），以阅读赋能新题型，新题型再赋能阅读，遥遥领先。在此基础上，再看几个小时的技巧课，这样才能锦上添花，须知技巧必须在你本人基本功良好的基础上才会有用，否则就是巫术，邪教。对于新题型的技巧课，每种题型看个一个小时知道技巧所表达的意思就行了。\u003c/p>\n\u003cp>这里顺便说下\u003cstrong>完型\u003c/strong>，我个人看法是\u003cstrong>直接随缘\u003c/strong>，做完10-25的真题即可，性价比太低。想看课一定要时间足够再说，并且你经过几个月的阅读做题研读复盘训练后，已经有了相当强的阅读能力和应试能力，这个时候就算裸考完型也是有一定的基础在的。\u003c/p>\n\u003cp>那么，段落和全文逻辑框架要注意哪些呢“\u003c/p>\n\u003cp>\u003cstrong>1.文章每段的主旨及其论证这个主旨的支撑细节（一般主旨句和细节句会相当明显，翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>2.每段的标志性表达，篇章结构特点，段落间连接纽带，上下文逻辑关系，即段间关系（需要自己概括）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>3.文章中分别出现的不同人物的观点及其独特性（翻译的时候顺手就知道了）；\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>4.全文的主旨与其支撑细节（需要自己概括）。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>第一种手段就是平时复盘阅读时，在单词和翻译完成后，按照以上内容自己一条一条梳理，一定一定要有意识地去训练，练习一个月以上就能显著提高你的阅读和新题型能力，这样才能解决新题型的备考的结构性困境，以及效率拉到最高。第二种方法就是纯懒人法，我们也给大家准备好了，可以直接拿去用\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>最终的效果就是一刷阅读完成后，你会发现新题型是一件手到擒来的事，甚至不需要看任何课，凭感觉就能全对。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>那么，我们现在梳理了文章，应该如何检验效果，并且直接精准练习到新题型的形式上呢？这里我们将每篇适合改编的阅读真题语篇改编成了小标题题和排序题（英语一专有），都给大家准备好了，直接安排到位。\u003c/strong>\u003c/p>\n\u003cp>只要能做全对就算梳理合格。如果你们按照步骤认真完成了真题词梳理，全文翻译，选项复盘与逻辑梳理三步，很容易就能直接全选对，相当于直接送人头，这相当于开卷考试。反观如果你们不按步骤来，那么阅读文章的难度是一定难于新题型文章的，你们一定会错的惨不忍睹，所以请务必认真执行。\u003c/p>\n\u003ch4>一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h4>\n\u003cp>省流，我们也给大家准备好了，可以直接用我们的。\u003c/p>\n\u003cp>从阅读中积累作文语料也是一个很早就有人提出的点，但是其不好把握的点在于要提前确定我们到时候的写作思路，才能针对性的积累，否则效率就是很低的，因此我们这里选择我们认为的作文最优解即考研作文宏大叙事化，具体内容可以参考我们去年的教学，并且用我们的思路，唯二的写作难点只有文章的主题词如何找以及如何描述图画/图表/文本，其中后者不必多说，前者的话，我们分为传统的个人向主题词和宏大叙事主题词，考纲里也明确写了，选题应启发考生关注国内外重大时事的作用，所以你们可以发现考研英语的很多语篇，尤其是英语一，都有一个较为宏大的主题，那么自然其中的很多表达就可以当成主题词去积累。\u003c/p>\n\u003ch2>为什么考研英语备考实际只需要两到三个月的有效备考工作量\u003c/h2>\n\u003cp>传统的考研英语规划往往把复习周期拉到七八个月，甚至一年半载，但这种安排并不符合语言考试的实际备考逻辑，很多时候只是xxx为了赚钱通过不断增加课程和资料来延长学习周期的手段。\u003c/p>\n\u003cp>事实上，考研英语各个板块的底层能力是相通的，只要采取我们的一石五鸟法，就可以省去绝大多数看课和刷额外资料的工作量，用同一套方法同时解决单词、阅读、翻译、新题型和作文语料积累的问题。\u003c/p>\n\u003cp>从全科时间分配来看，英语的投入应当少于数学和专业课，但明显高于政治。用相对较少的时间把英语考到73分，往往比投入大量时间追求80分更科学，因为相同时间投入数学和专业课，通常能够获得更大、更确定的分数回报。这里的“更大”，是指同样学习一段时间，数学和专业课的提分幅度往往更高；“更确定”，是指多掌握一种题型、多做一批典型题，通常就能稳定提高解决问题的能力，而英语虽然也可以通过背更多单词、精读更多文章来提高整体水平，但这种能力增长转化为考试分数的效率，并不像数学和专业课那样直接、稳定。因此，英语很重要，重要性高于政治，但一般不应挤占数学和专业课的核心复习时间。\u003c/p>\n\u003cp>不过，英语的投入风险较高，并不意味着可以像备考政治一样每天随便学一点，更不意味着可以忽视方法。考研英语的文章主要来自具有命题组改编特色的外刊材料，真正符合考试选材、设问和干扰项规律的训练材料只有历年真题；而真题数量有限，一旦第一次做题时没有按照正确方法分析，后续再重复时就会受到答案记忆的影响，很难恢复到真实的陌生做题状态，所以真题几乎没有可以随意浪费的机会。所以，考研英语复习最核心的结论就是：死磕真题，而且要用正确的方法处理真题，很多二战考生提分幅度不大，也是因为实际上没有用正确的方法处理宝贵的真题，早早的浪费了。\u003c/p>\n\u003cp>英语和政治的另一个区别在于，政治虽然也讲究方法和效率，但最终多数考生的分数相对集中；英语则具有更明显的区分度，考生之间出现15至20分的差距并不罕见，而这种差距往往不是由复习时间决定的，而是由是否正确处理真题决定的。很多同学所说的“课都看了，真题也全做了，但还是选不出来”，本质上就是仅仅完成了学习形式而已。\u003c/p>\n\u003cp>因此考研英语的复习时长只在达到一个基本阈值之前有明显作用，这个阈值就是把历年真题按照正确方法完整处理一遍所需要的时间，通常集中学习两到三个月就能够完成；超过这个阶段以后，单纯延长时间、继续看课或堆积额外资料，收益会迅速下降。最终决定英语分数上限的，不是你学了多久，而是你对一石五鸟里的每个部分对应的文章处理方法理解到了什么程度，这也是文科类考试的共同特点。因此，考生应先结合自己的基础、目标分数以及数学和专业课的情况，确定英语在整个上岸规划中的合理地位，再据此安排复习周期和时间投入，而不是机械照搬一套持续半年甚至一年的长期规划。\u003c/p>\n\u003chr>\n\u003chr>\n\u003ch1>1.一石五鸟第一鸟-积累文中重点单词带来的词汇量提升\u003c/h1>\n\u003cp>\u003cimg data-asset=\"articleAnnotated\" alt=\"2016英语一Text 1重点词与语境标注\">\u003c/p>\n\u003ch2>第1段\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003cth>表达\u003c/th>\n\u003cth>词性＋意思\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>France\u003c/td>\n\u003ctd>n.法国\u003c/td>\n\u003ctd>pride oneself as\u003c/td>\n\u003ctd>以……自豪\u003c/td>\n\u003c
