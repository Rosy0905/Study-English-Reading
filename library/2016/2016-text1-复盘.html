于“不能按伤害健康的外表定义美”这一理由。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest beauty should not be defined by looks that end up impinging on health.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>第二段的impinging on在这里表示损害……。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“doing”和原文“end up”都把一个动作放在health之前，因为选项用do something to health改写，原文用looks end up doing something on health表达结果，所以回看第二段第二句。\u003c/p>\n\u003cp>结合前后文，作者刚说这些措施有积极动机，接着解释不能让伤害健康的外表标准定义美。D没有把主体换成心理态度，也没有把方向改成提升价值，它保留了“对健康做了什么”这条核心关系。\u003c/p>\n\u003cp>两种写法都把未知动作落在health上，并且都服务于“不能按伤害健康的外表定义美”这一理由。\u003c/p>\n\u003cp>第二段先肯定措施动机，再说明审美不能损害健康，并以模特饿死和向女性传递的身体标准说明危害。\u003c/p>\n\u003cp>损害健康承接极端节食，后文的死亡风险把抽象伤害落到身体后果，正向的保护措施由此有了理由。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第2段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>They suggest beauty should not be defined by looks that end up impinging on health.\u003c/p>\n\u003cp>第二段先肯定措施动机，再说明审美不能损害健康，并以模特饿死和向女性传递的身体标准说明危害。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：肯定这些措施保护健康，并要求行业为传递给女性尤其少女的身体标准负责。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>These ideals of appearance end up doing harm to health.\u003c/p>\n\u003cp>这些外貌理想最终会损害健康。\u003c/p>\n\u003c/blockquote>\n\u003cp>损害健康承接极端节食，后文的死亡风险把抽象伤害落到身体后果，正向的保护措施由此有了理由。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入22题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>挑战身体理想的主旨帮助确认作者反对以健康为代价的外貌追求；短语的对象和负面作用仍由health及starving themselves to death确定。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>doing harm to\u003cbr>损害……\u003c/p>\n\u003c/blockquote>\n\u003cp>两种写法都把未知动作落在health上，并且都服务于“不能按伤害健康的外表定义美”这一理由。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：肯定这些措施保护健康，并要求行业为传递给女性尤其少女的身体标准负责\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D正确。\u003c/strong>\u003c/p>\n\u003ch3>22题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>22. D. doing harm to\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“looks that end up”后面接的是一个落到health上的动作，句子整体在解释为什么不能只用外表定义美。\u003c/p>\n\u003cp>B：原文“beauty should not be defined by looks”先否定只看外表的审美标准，后面的原因是这些looks最终会对health产生某种作用。\u003c/p>\n\u003cp>C：原文“on health”的前面主语来源是looks，意思是某类外表追求最终落到健康上。\u003c/p>\n\u003cp>D：结合前后文，作者刚说这些措施有积极动机，接着解释不能让伤害健康的外表标准定义美。\u003c/p>\n\u003ch2>23题\u003c/h2>\n\u003cblockquote>\n\u003cp>Which of the following is true of the fashion industry?\u003cbr>关于时尚行业，下面哪一项是正确的？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>具体细节题。题干要求判断“关于时尚行业，下面哪一项是正确的？”，先按第4、5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The French measures, however, rely too much on severe punishment to change a culture that still regards beauty as skin-deep – and bone-showing. Under the law, using a fashion model that does not meet a government-defined index of body mass could result in a $85,000 fine and six months in prison.\u003c/p>\n\u003cp>The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types. In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models. The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute. But in general it relies on a name-and-shame method of compliance.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n\u003ch3>A. The French measures have already failed.\u003c/h3>\n\u003cblockquote>\n\u003cp>法国的措施已经失败\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“have already failed”和原文“it is trying to set”都在判断时尚行业应对身体审美问题的进展，因为选项宣布法国措施已经失败，原文则写多个国家仍在尝试制定标准，所以回看第五段第二句，并连同第一句一起看。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。A的“have already failed”却给法国措施下了已经失败的完成性结论。时间状态一个是仍在尝试，一个是已经结束并失败。\u003c/p>\n\u003cp>第五段的“it is trying to set”还说明行业应对仍在推进，不能拿它证明法国措施已经失败，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于时尚行业，正确的陈述是：法国的措施已经失败。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“have already failed”和原文“it is trying to set”都在判断时尚行业应对身体审美问题的进展，因为选项宣布法国措施已经失败，原文则写多个国家仍在尝试制定标准，所以回看第五段第二句，并连同第一句一起看。\u003c/p>\n\u003cp>原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。A的“have already failed”却给法国措施下了已经失败的完成性结论。时间状态一个是仍在尝试，一个是已经结束并失败。\u003c/p>\n\u003cp>第五段承认行业存在问题，并介绍另一种依靠同行压力的标准，但没有回头报告法国法律执行后的结果。文章前一段只是批评法国惩罚过重，这不等于措施已经失败。\u003c/p>\n\u003cp>A若成立，需要出现执行数据、撤销法律、目标没有实现或明确的failure判断。这里没有这些结果，只有对手段轻重的比较以及其他国家的进行中做法。\u003c/p>\n\u003cp>对方法的批评不等于已经发生的失败结果，时间和结论都被A提前了。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重。指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力。具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The French measures have already failed to change the industry.\u003c/p>\n\u003cp>法国措施已经未能改变这个行业。\u003c/p>\n\u003c/blockquote>\n\u003cp>批评手段过重与报告实施失败不同。原文尚用if fully enforced讨论条件，也没有交代已经实施后的失败结果。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨涉及对身体标准的挑战，局部事实需要区分法国的拟议措施与丹麦正在确立的行业规范；标题不能单独决定成效已经出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>The French measures have already failed.\u003cbr>法国的措施已经失败\u003c/p>\n\u003c/blockquote>\n\u003cp>第五段的“it is trying to set”还说明行业应对仍在推进，不能拿它证明法国措施已经失败，所以A排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. New standards are being set in Denmark.\u003c/h3>\n\u003cblockquote>\n\u003cp>丹麦正在制定新标准\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B保留。当时的定位线索是：B里的“New standards are being set in Denmark”和原文“In Denmark”以及“trying to set”直接对应，因为选项把地点和正在制定标准这两个信息合在一起，所以回看第五段第二句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“In Denmark”给出地点，“trying to set”给出正在推进的动作，后面明确对象是standards for models and fashion images。B的“New standards are being set in Denmark”保留了地点、动作和对象。\u003c/p>\n\u003cp>正在制定这一基本关系已经由trying to set明确写出。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于时尚行业，正确的陈述是：丹麦正在制定新标准。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“New standards are being set in Denmark”和原文“In Denmark”以及“trying to set”直接对应，因为选项把地点和正在制定标准这两个信息合在一起，所以回看第五段第二句。\u003c/p>\n\u003cp>原文“In Denmark”给出地点，“trying to set”给出正在推进的动作，后面明确对象是standards for models and fashion images。B的“New standards are being set in Denmark”保留了地点、动作和对象。\u003c/p>\n\u003cp>原文还提到美国和其他国家，B只摘出丹麦，并没有说只有丹麦这样做；把并列范围中的一个成员拿出来回答“关于时尚行业哪项正确”，并不改变原句。\u003c/p>\n\u003cp>正在制定这一基本关系已经由trying to set明确写出。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重。指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力。具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Denmark’s fashion industry is setting new standards for models and images.\u003c/p>\n\u003cp>丹麦时尚行业正在为模特和时尚形象制定新标准。\u003c/p>\n\u003c/blockquote>\n\u003cp>第五段的trying to set和第六段的agreed last month、newly revised前后相接，从总体尝试推进到新章程的细节。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨涉及对身体标准的挑战，局部事实需要区分法国的拟议措施与丹麦正在确立的行业规范；标题不能单独决定成效已经出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>New standards are being set in Denmark.\u003cbr>丹麦正在制定新标准\u003c/p>\n\u003c/blockquote>\n\u003cp>正在制定这一基本关系已经由trying to set明确写出。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B正确。\u003c/strong>\u003c/p>\n\u003ch3>C. Models are no longer under peer pressure.\u003c/h3>\n\u003cblockquote>\n\u003cp>模特不再承受同行压力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“no longer under peer pressure”和原文“rely more on peer pressure”都直接谈peer pressure，因为选项说这种压力已经消失，原文说新标准更依赖它来执行，所以回看第五段末尾。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。C的“no longer under peer pressure”则说模特已经不再处于这种压力之下。\u003c/p>\n\u003cp>原文是继续并加强使用这种压力，C是取消这种压力，方向相反。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于时尚行业，正确的陈述是：模特不再承受同行压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“no longer under peer pressure”和原文“rely more on peer pressure”都直接谈peer pressure，因为选项说这种压力已经消失，原文说新标准更依赖它来执行，所以回看第五段末尾。\u003c/p>\n\u003cp>原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。C的“no longer under peer pressure”则说模特已经不再处于这种压力之下。\u003c/p>\n\u003cp>两边不只是程度不同，而是否定关系相反：原文增加依赖，C宣布压力不存在。即使peer pressure具体作用于设计师、机构或模特群体，C的no longer仍与“依赖它执行”无法同时成立。\u003c/p>\n\u003cp>原文是继续并加强使用这种压力，C是取消这种压力，方向相反。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重。指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力。具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Models no longer face pressure from their peers.\u003c/p>\n\u003cp>模特不再面临同行压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>无同行压力应取消这种执行方式；实际自愿标准更依赖peer pressure，随后name-and-shame再次说明行业压力发挥作用。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨涉及对身体标准的挑战，局部事实需要区分法国的拟议措施与丹麦正在确立的行业规范；标题不能单独决定成效已经出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Models are no longer under peer pressure.\u003cbr>模特不再承受同行压力\u003c/p>\n\u003c/blockquote>\n\u003cp>原文是继续并加强使用这种压力，C是取消这种压力，方向相反。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003ch3>D. Its inherent problems are getting worse.\u003c/h3>\n\u003cblockquote>\n\u003cp>其固有问题正在恶化\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“problems are getting worse”和原文“The fashion industry knows it has”都承认行业存在问题，因为选项进一步写问题正在恶化，原文只确认问题存在，所以回看第五段第一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。D的“problems are getting worse”却增加了变化趋势，要求这个问题比以前更严重。\u003c/p>\n\u003cp>段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于时尚行业，正确的陈述是：其固有问题正在恶化。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“problems are getting worse”和原文“The fashion industry knows it has”都承认行业存在问题，因为选项进一步写问题正在恶化，原文只确认问题存在，所以回看第五段第一句。\u003c/p>\n\u003cp>原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。D的“problems are getting worse”却增加了变化趋势，要求这个问题比以前更严重。\u003c/p>\n\u003cp>存在问题与问题恶化不是同一判断。第五段没有过去与现在的对比，也没有增长、加剧或越来越严重的表达；后一句反而写行业正在尝试建立标准。\u003c/p>\n\u003cp>D还把单数problem扩为复数problems，并用getting worse加入动态结果。\u003c/p>\n\u003cp>段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.\u003c/p>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重。指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力。具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The industry’s inherent problems are becoming progressively worse.\u003c/p>\n\u003cp>行业固有的问题正在不断恶化。\u003c/p>\n\u003c/blockquote>\n\u003cp>inherent只交代问题固有存在，不给恶化的时间比较。后文转向应对措施，而非提供越来越严重的趋势。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨涉及对身体标准的挑战，局部事实需要区分法国的拟议措施与丹麦正在确立的行业规范；标题不能单独决定成效已经出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Its inherent problems are getting worse.\u003cbr>其固有问题正在恶化\u003c/p>\n\u003c/blockquote>\n\u003cp>段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>23题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>23. B. New standards are being set in Denmark.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。\u003c/p>\n\u003cp>B：原文“In Denmark”给出地点，“trying to set”给出正在推进的动作，后面明确对象是standards for models and fashion images。\u003c/p>\n\u003cp>C：原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。\u003c/p>\n\u003cp>D：原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。\u003c/p>\n\u003ch2>24题\u003c/h2>\n\u003cblockquote>\n\u003cp>A designer is most likely to be rejected by CFW for ______.\u003cbr>一名设计师最可能因为什么被哥本哈根时装周拒绝？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“一名设计师最可能因为什么被哥本哈根时装周拒绝？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models. The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute. But in general it relies on a name-and-shame method of compliance.\u003c/p>\n\u003c/blockquote>\n\u003cp>丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\u003c/p>\n\u003ch3>A. pursuing perfect physical conditions\u003c/h3>\n\u003cblockquote>\n\u003cp>追求完美的身体条件\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“pursuing perfect physical conditions”和原文“age, health, and other characteristics”都涉及模特身体条件，因为选项写设计师追求完美身体，原文写丹麦规则审视年龄、健康等特征，所以回看第六段第一句和关于CFW执行工具的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。A的“pursuing perfect physical conditions”却把违规动作写成追求完美身体条件。\u003c/p>\n\u003cp>原文没有把“完美身体”写成拒绝条件，也没有出现设计师追求这一目标的动作，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>设计师最可能被哥本哈根时装周拒绝，是因为他追求完美的身体条件。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“pursuing perfect physical conditions”和原文“age, health, and other characteristics”都涉及模特身体条件，因为选项写设计师追求完美身体，原文写丹麦规则审视年龄、健康等特征，所以回看第六段第一句和关于CFW执行工具的句子。\u003c/p>\n\u003cp>原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。A的“pursuing perfect physical conditions”却把违规动作写成追求完美身体条件。\u003c/p>\n\u003cp>宪章反对的是时尚行业对身体审美造成有害影响，并要求承担责任；它没有把正常的健康状态或良好身体条件本身列为违规。A把“规则检查身体相关因素”改成“追求完美身体就会受罚”，对象与评价都发生偏移。\u003c/p>\n\u003cp>若A成立，需要原文明确写设计师要求模特达到完美体形，且这种追求触发CFW拒绝。当前段落只写年龄、健康及其他特征的规则，没有perfect这一极端标准。\u003c/p>\n\u003cp>关注健康因素是规则内容，追求完美身体是A另加的行为与评价。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003cp>丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Designers will be excluded for pursuing perfect physical conditions in their models.\u003c/p>\n\u003cp>设计师会因追求模特完美的身体条件而被排除。\u003c/p>\n\u003c/blockquote>\n\u003cp>假设必须明确把追求完美身体条件本身写成拒绝准入的理由。实际章程要求关注年龄、健康等条件，并未把perfect这一追求目标直接列为违规；不能仅凭都谈身体就等同两种条件。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调调整危害健康的身体理想；对拒绝参展的具体原因，还要看章程保护什么，以及哪种行为违反这个要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>pursuing perfect physical conditions\u003cbr>追求完美的身体条件\u003c/p>\n\u003c/blockquote>\n\u003cp>原文没有把“完美身体”写成拒绝条件，也没有出现设计师追求这一目标的动作，所以A排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003ch3>B. caring too much about models’ character\u003c/h3>\n\u003cblockquote>\n\u003cp>过分关注模特的品格\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“models’ character”和原文“other characteristics of models”词形接近，因为选项把character理解成人格品格，原文却把characteristics与年龄、健康并列为模特特征，所以回看第六段第一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。B的“models’ character”则指模特的性格或品格，是另一个更窄的概念。\u003c/p>\n\u003cp>characteristics与character不是这里的同一对象，B又增加了原文没有的过度关注动作。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>设计师最可能被哥本哈根时装周拒绝，是因为他过分关注模特的品格。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“models’ character”和原文“other characteristics of models”词形接近，因为选项把character理解成人格品格，原文却把characteristics与年龄、健康并列为模特特征，所以回看第六段第一句。\u003c/p>\n\u003cp>原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。B的“models’ character”则指模特的性格或品格，是另一个更窄的概念。\u003c/p>\n\u003cp>B还加入caring too much，要求设计师因为过分关注品格而受罚。原文没有写关注程度，更没有把人格评价列成拒绝CFW的原因；它讨论的是行业规则对模特条件和身体审美影响的约束。\u003c/p>\n\u003cp>两个词看起来相似，但修饰关系不同：原文是characteristics of models，B是models’ character；一个可包含年龄、健康等客观特征，一个是人的品格。\u003c/p>\n\u003cp>characteristics与character不是这里的同一对象，B又增加了原文没有的过度关注动作。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Designers will be excluded for caring too much about their models’ character.\u003c/p>\n\u003cp>设计师会因过分关注模特的品格而被排除。\u003c/p>\n\u003c/blockquote>\n\u003cp>品格属于作者希望重视的非物质品质。第六段没有把重视品格写成违规事项，更没有过度关注品格导致禁入的规则。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调调整危害健康的身体理想；对拒绝参展的具体原因，还要看章程保护什么，以及哪种行为违反这个要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>B实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>caring too much about models’ character\u003cbr>过分关注模特的品格\u003c/p>\n\u003c/blockquote>\n\u003cp>characteristics与character不是这里的同一对象，B又增加了原文没有的过度关注动作。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：B错误。\u003c/strong>\u003c/p>\n\u003ch3>C. showing little concern for health factors\u003c/h3>\n\u003cblockquote>\n\u003cp>很少考虑健康因素\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“showing little concern for [xxx] factors”，保留了相应遮挡。当时的定位线索是：C里的“showing little concern”和原文“take responsibility”都在判断时尚从业者是否认真对待其影响，因为选项写漠视，宪章要求承担责任，所以回看宪章声明以及CFW拒绝进入的执行句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“take responsibility”要求时尚行业意识到并承担自己对身体审美、尤其是年轻人的影响；C的“showing little concern”写的是设计师对相关因素缺少关心。两者正好构成遵守与不遵守的对照。\u003c/p>\n\u003cp>漠视宪章要求承担的影响，正是执行规则时可以针对的不合规表现。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>设计师最可能被哥本哈根时装周拒绝，是因为他很少考虑健康因素。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“showing little concern”和原文“take responsibility”都在判断时尚从业者是否认真对待其影响，因为选项写漠视，宪章要求承担责任，所以回看宪章声明以及CFW拒绝进入的执行句。\u003c/p>\n\u003cp>原文“take responsibility”要求时尚行业意识到并承担自己对身体审美、尤其是年轻人的影响；C的“showing little concern”写的是设计师对相关因素缺少关心。两者正好构成遵守与不遵守的对照。\u003c/p>\n\u003cp>执行工具是“deny access for designers and modeling agencies to CFW”，所以当设计师表现出对宪章关切事项的漠视时，被拒绝进入正能接上这套执行方式。C没有把处罚对象换掉，仍然是designer。\u003c/p>\n\u003cp>漠视宪章要求承担的影响，正是执行规则时可以针对的不合规表现。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003cp>丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Designers who disregard their models’ health will be denied access to CFW.\u003c/p>\n\u003cp>忽视模特健康的设计师会被拒绝参加哥本哈根时装周。\u003c/p>\n\u003c/blockquote>\n\u003cp>健康列在规则内，违反保护健康的要求与拒绝准入这项制裁可以接上。选项说的是忽视健康，没有另造与章程相反的年龄要求。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调调整危害健康的身体理想；对拒绝参展的具体原因，还要看章程保护什么，以及哪种行为违反这个要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>showing little concern for health factors\u003cbr>很少考虑健康因素\u003c/p>\n\u003c/blockquote>\n\u003cp>漠视宪章要求承担的影响，正是执行规则时可以针对的不合规表现。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003ch3>D. setting a high age threshold for models\u003c/h3>\n\u003cblockquote>\n\u003cp>给模特设置很高的年龄门槛\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“setting a high [xxx] threshold for models”，保留了相应遮挡。当时的定位线索是：D里的“threshold for models”和原文“regarding the age”都在谈规则怎样给模特设定条件，因为选项写一项高门槛，原文写年龄等特征受规则约束，所以回看第六段第一句和CFW拒绝进入的执行句。读完全文后，做题模式再经交叉验证排除D，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。但段落没有给年龄门槛的具体数值，也没有说明什么叫high。\u003c/p>\n\u003cp>D把出现age扩大成明确的年龄方向和排除原因。C指出忽视模特健康，能与章程的健康责任和准入执行连成完整关系；D所需的高年龄门槛规则在原文中并未建立。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003c/blockquote>\n\u003ch4>定位比对法\u003c/h4>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>设计师最可能被哥本哈根时装周拒绝，是因为他给模特设置很高的年龄门槛。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“threshold for models”和原文“regarding the age”都在谈规则怎样给模特设定条件，因为选项写一项高门槛，原文写年龄等特征受规则约束，所以回看第六段第一句和CFW拒绝进入的执行句。\u003c/p>\n\u003cp>第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。但段落没有给年龄门槛的具体数值，也没有说明什么叫high。\u003c/p>\n\u003cp>章程采用限制参加时装周的办法促使行业遵守规则，且直接强调行业对body ideals、especially on young people的责任。年龄是被规则涉及的一项，不能自动推出设计师因为把门槛设得太高而被拒绝。\u003c/p>\n\u003cp>D把出现age扩大成明确的年龄方向和排除原因。C指出忽视模特健康，能与章程的健康责任和准入执行连成完整关系；D所需的高年龄门槛规则在原文中并未建立。\u003c/p>\n\u003ch4>写作视角法\u003c/h4>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003cp>丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Designers will be excluded because they require models to be too old.\u003c/p>\n\u003cp>设计师会因要求模特年龄过大而被排除。\u003c/p>\n\u003c/blockquote>\n\u003cp>这需要说明章程禁止把年龄门槛定得过高。原文只列age为监管事项，没有给高低方向或上限，提到年龄不等于支持这种惩罚原因。\u003c/p>\n\u003ch4>主旨交叉验证法\u003c/h4>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调调整危害健康的身体理想；对拒绝参展的具体原因，还要看章程保护什么，以及哪种行为违反这个要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>setting a high age threshold for models\u003cbr>给模特设置很高的年龄门槛\u003c/p>\n\u003c/blockquote>\n\u003cp>D把出现age扩大成明确的年龄方向和排除原因。C指出忽视模特健康，能与章程的健康责任和准入执行连成完整关系；D所需的高年龄门槛规则在原文中并未建立。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003ch3>24题结论\u003c/h3>\n\u003cblockquote>\n\u003cp>\u003cstrong>24. C. showing little concern for health factors\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。\u003c/p>\n\u003cp>B：原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。\u003c/p>\n\u003cp>C：原文“take responsibility”要求时尚行业意识到并承担自己对身体审美、尤其是年轻人的影响；C的“showing little concern”写的是设计师对相关因素缺少关心。\u003c/p>\n\u003cp>D：第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。\u003c/p>\n\u003ch1>4.一石五鸟第四鸟-应用文章逻辑带来的新题型能力提升\u003c/h1>\n\u003cp>在新题型里，七选五作为我们从小做到大的，自不必多说，英语二的匹配题相当于纯福利，小标题题不难但是我们从小没怎么接触过，唯一可能会失分的是排序题。而这些题型无论怎么变，考察的都是关于理解文章上下文逻辑的能力，因此我们根据本篇阅读的主题与论证关系扩写改编成小标题题和排序题供大家练习。以下为训练用改编文本，不是外刊原文。\u003c/p>\n\u003cp>以下是本篇文章的逻辑框架，请先看懂理解后再开始完成改编的排序题与小标题题（大家注意一下这部分并不要求大家自己写出来跟我们一模一样的东西，就是单纯给大家的纯用于阅读的材料而已。注意只需要看懂，这里不放英文是为了只训练对文章逻辑的回忆）：\u003c/p>\n\u003cp>\u003cstrong>逻辑层次1：法国的强制性措施\u003c/strong>（段落1-2核心事件） 法国决定：时尚产业失去定义女性身体美的绝对权利 → 立法措施：【禁止雇用超瘦模特 + 禁止煽动过度瘦身的网站】→ 动机：（保护健康 + 要求产业对其发送的社会信号负责）\u003c/p>\n\u003cp>↓（深层含义）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次2：禁令的潜在影响\u003c/strong>（段落3理念转变） 对个体的影响：（不让他人成为美的仲裁者）→ 价值观转变：（关注性格和智力等无形品质 // 而非追求极端身材）\u003c/p>\n\u003cp>//（批判转折）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次3：法国措施的局限性\u003c/strong>（段落4问题分析） 过度依赖严厉惩罚：（85,000美元罚款 + 6个月监禁）→ 试图改变的文化问题：（美仍被视为肤浅的、露骨的）\u003c/p>\n\u003cp>↓（替代方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次4：行业自律的尝试\u003c/strong>（段落5-6对比方案） 时尚产业的自觉：（认识到专注物质装饰和理想化身体的内在问题）→ 自愿标准模式：【丹麦模式：（行业协议 + 道德宪章 + 承担责任）→ 执行机制：（拒绝参加时装周 + 点名批评）】// 对比法国的法律强制\u003c/p>\n\u003cp>↓（最佳解决方案）\u003c/p>\n\u003cp>\u003cstrong>逻辑层次5：理想的解决路径\u003c/strong>（段落7结论建议） 更好的方法：道德说服 &gt; 法律强制 → 最终目标：将美的概念提升到超越特定行业的物质标准\u003c/p>\n\u003cp>↑（全文主旨）\u003c/p>\n\u003cp>全文核心观点：面对时尚产业对身体理想的扭曲影响，法国采取了严厉的法律措施，但依靠道德说服和行业自律可能是更好的选择，最终目标应该是将美的概念提升到超越物质标准的层面。\u003c/p>\n\u003ch3>小标题题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A. Replacing Every Rule with a Personal Diet\u003c/p>\n\u003cp>B. Looking Beyond the Body as a Measure\u003c/p>\n\u003cp>C. Giving Designers Complete Freedom from Responsibility\u003c/p>\n\u003cp>D. A Public Challenge to the Industry’s Ideal\u003c/p>\n\u003cp>E. Health Is Not the Only Message\u003c/p>\n\u003cp>F. Punishment Cannot Redefine Beauty by Itself\u003c/p>\n\u003cp>G. Making Voluntary Commitments Matter\u003c/p>\n\u003cp>\u003cstrong>41.\u003c/strong>\u003c/p>\n\u003cp>When a country restricts the employment of extremely thin models, it challenges more than a particular casting decision. It questions whether an industry has an unlimited right to define the bodies women should admire. Legal intervention brings that usually private judgement into public debate. The immediate targets may be agencies, employers and websites, but the larger issue is who may set standards that influence people far beyond the fashion business itself.\u003c/p>\n\u003cp>\u003cstrong>42.\u003c/strong>\u003c/p>\n\u003cp>The protection of models from dangerous eating habits is an obvious benefit. Less visible, but no less important, is the signal sent to everyone who sees their images. A young woman may learn to measure her worth against a body presented as desirable. Challenging that image can therefore loosen a wider social pressure. The policy asks an industry to consider not only what happens to the people it employs, but also what its messages ask audiences to believe.\u003c/p>\n\u003cp>\u003cstrong>43.\u003c/strong>\u003c/p>\n\u003cp>A fine can make an employer obey a rule without changing the beliefs that produced the problem. This is the difficulty with relying too heavily on severe penalties. A culture that equates beauty with a narrowly defined body may survive after an illegal practice has disappeared from the runway. Enforcement can establish a boundary, but a new understanding of beauty requires people to question the standards on the other side of that boundary as well.\u003c/p>\n\u003cp>\u003cstrong>44.\u003c/strong>\u003c/p>\n\u003cp>Voluntary standards need not mean empty promises. An industry can attach participation in a major event to compliance with an ethical charter. Designers and agencies then face a practical consequence when they ignore agreed requirements. Public criticism may add pressure from colleagues and audiences. Such arrangements depend on shared expectations and reputation, making responsibility visible within the industry instead of leaving all influence to the threat of legal punishment.\u003c/p>\n\u003cp>\u003cstrong>45.\u003c/strong>\u003c/p>\n\u003cp>Even an effective industry charter leaves a deeper question unanswered: why should appearance be the principal measure of a person’s value? Qualities such as judgement, character and intelligence cannot be reduced to a clothing size. Education and public discussion can help people recognise these less visible qualities. The most ambitious response therefore reaches beyond healthier images. It makes the industry’s material standards less central to the way individuals understand themselves.\u003c/p>\n\u003ch3>小标题题 · 41题\u003c/h3>\n\u003cp>\u003cstrong>答案：D. A Public Challenge to the Industry’s Ideal / 对行业理想体型的公开挑战\u003c/strong>\u003c/p>\n\u003cp>由限制雇用极瘦模特引出谁有权定义女性身体理想。\u003c/p>\n\u003cblockquote>\n\u003cp>When a country restricts the employment of extremely thin models, it challenges more than a particular casting decision.\u003c/p>\n\u003cp>The immediate targets may be agencies, employers and websites, but the larger issue is who may set standards that influence people far beyond the fashion business itself.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>由限制雇用极瘦模特引出谁有权定义女性身体理想。\u003c/p>\n\u003c/blockquote>\n\u003cp>Public Challenge对应法律把行业内部审美判断带进公共讨论，Industry’s Ideal对应行业向女性推广的理想身材；标题不是在报道一次普通选角。\u003c/p>\n\u003cp>最强干扰项C（Giving Designers Complete Freedom from Responsibility）容易因相同话题进入考虑。但质疑行业绝对权利正是在追究公共责任，不能概括成给予设计师无限自由。\u003c/p>\n\u003cp>\u003cstrong>41题选D。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 42题\u003c/h3>\n\u003cp>\u003cstrong>答案：E. Health Is Not the Only Message / 传递的并不只有健康信息\u003c/strong>\u003c/p>\n\u003cp>从模特健康扩大到行业向公众传递的自我价值尺度。\u003c/p>\n\u003cblockquote>\n\u003cp>The protection of models from dangerous eating habits is an obvious benefit.\u003c/p>\n\u003cp>The policy asks an industry to consider not only what happens to the people it employs, but also what its messages ask audiences to believe.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从模特健康扩大到行业向公众传递的自我价值尺度。\u003c/p>\n\u003c/blockquote>\n\u003cp>Health对应保护模特免于危险饮食，Not the Only Message对应对女性尤其年轻女性个人价值尺度的影响；标题完整覆盖从雇员到公众的扩大。\u003c/p>\n\u003cp>最强干扰项A（Replacing Every Rule with a Personal Diet）容易因相同话题进入考虑。但个人节食是压力可能导致的行为，本段讨论如何减少这层压力。\u003c/p>\n\u003cp>\u003cstrong>42题选E。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 43题\u003c/h3>\n\u003cp>\u003cstrong>答案：F. Punishment Cannot Redefine Beauty by Itself / 惩罚无法独自重新定义美\u003c/strong>\u003c/p>\n\u003cp>区分守法行为与审美文化改变，指出重罚的局限。\u003c/p>\n\u003cblockquote>\n\u003cp>A fine can make an employer obey a rule without changing the beliefs that produced the problem.\u003c/p>\n\u003cp>Enforcement can establish a boundary, but a new understanding of beauty requires people to question the standards on the other side of that boundary as well.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>区分守法行为与审美文化改变 → 指出重罚的局限。\u003c/p>\n\u003c/blockquote>\n\u003cp>Punishment对应fine与severe penalties，Cannot Redefine Beauty by Itself对应守法以后旧审美文化仍可能存在；by itself保留法律有作用但不充分的限定。\u003c/p>\n\u003cp>最强干扰项D（A Public Challenge to the Industry’s Ideal）容易因相同话题进入考虑。但前者概括法律发起挑战，本段进一步追问单靠惩罚能否改变价值观。\u003c/p>\n\u003cp>\u003cstrong>43题选F。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 44题\u003c/h3>\n\u003cp>\u003cstrong>答案：G. Making Voluntary Commitments Matter / 使自愿承诺产生约束力\u003c/strong>\u003c/p>\n\u003cp>解释行业章程如何通过准入和声誉压力执行。\u003c/p>\n\u003cblockquote>\n\u003cp>Voluntary standards need not mean empty promises.\u003c/p>\n\u003cp>Such arrangements depend on shared expectations and reputation, making responsibility visible within the industry instead of leaving all influence to the threat of legal punishment.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释行业章程如何通过准入和声誉压力执行。\u003c/p>\n\u003c/blockquote>\n\u003cp>Voluntary Commitments对应接受行业章程，Matter对应不遵守会失去活动准入并面对公开批评；标题把自愿承诺与执行后果联系起来。\u003c/p>\n\u003cp>最强干扰项C（Giving Designers Complete Freedom from Responsibility）容易因相同话题进入考虑。但自愿标准仍然要求遵守章程，并非免除设计师责任。\u003c/p>\n\u003cp>\u003cstrong>44题选G。\u003c/strong>\u003c/p>\n\u003ch3>小标题题 · 45题\u003c/h3>\n\u003cp>\u003cstrong>答案：B. Looking Beyond the Body as a Measure / 超越以身材衡量价值\u003c/strong>\u003c/p>\n\u003cp>从健康形象再推进到品格和才智等非物质价值。\u003c/p>\n\u003cblockquote>\n\u003cp>Even an effective industry charter leaves a deeper question unanswered: why should appearance be the principal measure of a person’s value?\u003c/p>\n\u003cp>It makes the industry’s material standards less central to the way individuals understand themselves.\u003c/p>\n\u003c/blockquote>\n\u003cp>段内推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从健康形象再推进到品格和才智等非物质价值。\u003c/p>\n\u003c/blockquote>\n\u003cp>Beyond the Body对应不以衣服尺码评价品格与智力，as a Measure对应衡量个人价值的尺度；这比改用一种更健康的体型标准更进一层。\u003c/p>\n\u003cp>最强干扰项A（Replacing Every Rule with a Personal Diet）容易因相同话题进入考虑。但本段降低体型在价值判断中的地位，不是要求人人选择自己的节食方案。\u003c/p>\n\u003cp>\u003cstrong>45题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题\u003c/h3>\n\u003cp>\u003cstrong>Directions:\u003c/strong>\u003c/p>\n\u003cp>The following paragraphs are given in a wrong order. For questions 41–45, choose the correct order by writing the corresponding letters in the spaces. Paragraphs A, E and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)\u003c/p>\n\u003cp>A → 41. ____ → 42. ____ → E → 43. ____ → 44. ____ → 45. ____ → H\u003c/p>\n\u003cp>\u003cstrong>A.\u003c/strong>\u003c/p>\n\u003cp>Extremely thin models have become the target of legal restrictions in some debates about fashion. The restrictions are often described as health measures. That description is reasonable, but it does not capture the whole significance of asking a powerful industry to change the bodies it presents to the public.\u003c/p>\n\u003cp>\u003cstrong>B.\u003c/strong>\u003c/p>\n\u003cp>Shared expectations can take a concrete form in an ethical charter. Participants publicly accept requirements concerning models’ age and health. If access to an important event depends on compliance, the charter has a practical consequence. Peer pressure can then reinforce a commitment that was initially made voluntarily.\u003c/p>\n\u003cp>\u003cstrong>C.\u003c/strong>\u003c/p>\n\u003cp>That reach gives the industry a responsibility to consider what its images encourage. Protecting employees from dangerous practices is one part of the task; reducing harmful pressure on audiences is another. A policy can pursue both aims, yet the means used to secure them still deserve careful examination.\u003c/p>\n\u003cp>\u003cstrong>D.\u003c/strong>\u003c/p>\n\u003cp>Different sources of pressure, however, can still leave the same narrow ideal in place. Healthier bodies are not the only alternative to an unhealthy image. A broader understanding of beauty would also recognise intelligence and character, making appearance a less dominant measure of human worth.\u003c/p>\n\u003cp>\u003cstrong>E.\u003c/strong>\u003c/p>\n\u003cp>One such means is severe punishment. It may deter employers from breaking a rule, but deterrence is not the same as persuasion. People can obey a legal limit while continuing to admire the very ideal behind it. This gap suggests the need for a method that works on shared expectations.\u003c/p>\n\u003cp>\u003cstrong>F.\u003c/strong>\u003c/p>\n\u003cp>The wider significance lies in the message carried by those bodies. Fashion images can suggest that a particular shape determines individual worth. Audiences, especially young people, may absorb that message even when they have no intention of becoming models. The industry’s influence therefore extends well beyond its own employees.\u003c/p>\n\u003cp>\u003cstrong>G.\u003c/strong>\u003c/p>\n\u003cp>A practical consequence helps keep the charter from becoming a declaration nobody follows. It also shows why voluntary action should not be confused with the absence of standards. The industry still accepts a duty and faces scrutiny; it simply uses a different source of pressure to support that duty.\u003c/p>\n\u003cp>\u003cstrong>H.\u003c/strong>\u003c/p>\n\u003cp>That broader understanding supplies the longest-term aim. Laws and industry charters may improve immediate practices, but they should also encourage people to question the scale by which they judge themselves. Responsibility ultimately involves changing both the images an industry produces and the importance society gives those images.\u003c/p>\n\u003ch3>排序题 · 全局解析\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>段落\u003c/th>\n\u003cth>这一段在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>从限制极瘦模特提出更广影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B\u003c/td>\n\u003ctd>以道德章程落实共同期待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>由公众影响推出责任，再转向手段审视\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>转入仅改变约束来源仍不足\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E\u003c/td>\n\u003ctd>指出惩罚与说服之间的缺口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F\u003c/td>\n\u003ctd>解释更广影响是传给公众的价值尺度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G\u003c/td>\n\u003ctd>解释自愿规范仍有约束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H\u003c/td>\n\u003ctd>综合法律、章程与价值观改变\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全文推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从限制极瘦模特提出更广影响 → 解释更广影响是传给公众的价值尺度 → 由公众影响推出责任，再转向手段审视 → 指出惩罚与说服之间的缺口 → 以道德章程落实共同期待 → 解释自愿规范仍有约束 → 转入仅改变约束来源仍不足 → 综合法律、章程与价值观改变\u003c/p>\n\u003c/blockquote>\n\u003cp>完整顺序：\u003c/p>\n\u003cp>\u003cstrong>A → F → C → E → B → G → D → H\u003c/strong>\u003c/p>\n\u003cp>41—45：F、C、B、G、D。\u003c/p>\n\u003ch3>排序题 · 41题\u003c/h3>\n\u003cp>41位于全文第2个位置，完整衔接是A → F → C。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段A的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>That description is reasonable, but it does not capture the whole significance of asking a powerful industry to change the bodies it presents to the public.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选F的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>The wider significance lies in the message carried by those bodies.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That reach gives the industry a responsibility to consider what its images encourage.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>the whole significance\u003c/code>，F继续处理这一对象，完成“解释更广影响是传给公众的价值尺度”。到本段末尾，讨论又落到\u003ccode>well beyond its own employees\u003c/code>，这正好为下一段“由公众影响推出责任，再转向手段审视”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>从限制极瘦模特提出更广影响 → 解释更广影响是传给公众的价值尺度 → 由公众影响推出责任，再转向手段审视\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选C的功能是“由公众影响推出责任，再转向手段审视”。它也属于同一论题，但若直接放在这里，就会跳过“解释更广影响是传给公众的价值尺度”这一必要环节；其段首“That reach gives the industry a responsibility to consider what its images encourage.”需要的前提与A当前收束的对象不一致，后续也接不出C所需的\u003ccode>well beyond its own employees\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>41题选F。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 42题\u003c/h3>\n\u003cp>42位于全文第3个位置，完整衔接是F → C → E。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段F的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The industry’s influence therefore extends well beyond its own employees.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选C的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That reach gives the industry a responsibility to consider what its images encourage.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段E的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>One such means is severe punishment.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>well beyond its own employees\u003c/code>，C继续处理这一对象，完成“由公众影响推出责任，再转向手段审视”。到本段末尾，讨论又落到\u003ccode>the means\u003c/code>，这正好为下一段“指出惩罚与说服之间的缺口”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释更广影响是传给公众的价值尺度 → 由公众影响推出责任，再转向手段审视 → 指出惩罚与说服之间的缺口\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选F的功能是“解释更广影响是传给公众的价值尺度”。它也属于同一论题，但若直接放在这里，就会跳过“由公众影响推出责任，再转向手段审视”这一必要环节；其段首“The wider significance lies in the message carried by those bodies.”需要的前提与F当前收束的对象不一致，后续也接不出E所需的\u003ccode>the means\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>42题选C。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 43题\u003c/h3>\n\u003cp>43位于全文第5个位置，完整衔接是E → B → G。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段E的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>This gap suggests the need for a method that works on shared expectations.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选B的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Shared expectations can take a concrete form in an ethical charter.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A practical consequence helps keep the charter from becoming a declaration nobody follows.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>shared expectations\u003c/code>，B继续处理这一对象，完成“以道德章程落实共同期待”。到本段末尾，讨论又落到\u003ccode>practical consequence\u003c/code>，这正好为下一段“解释自愿规范仍有约束”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>指出惩罚与说服之间的缺口 → 以道德章程落实共同期待 → 解释自愿规范仍有约束\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选G的功能是“解释自愿规范仍有约束”。它也属于同一论题，但若直接放在这里，就会跳过“以道德章程落实共同期待”这一必要环节；其段首“A practical consequence helps keep the charter from becoming a declaration nobody follows.”需要的前提与E当前收束的对象不一致，后续也接不出G所需的\u003ccode>practical consequence\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>43题选B。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 44题\u003c/h3>\n\u003cp>44位于全文第6个位置，完整衔接是B → G → D。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段B的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>Peer pressure can then reinforce a commitment that was initially made voluntarily.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选G的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>A practical consequence helps keep the charter from becoming a declaration nobody follows.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Different sources of pressure, however, can still leave the same narrow ideal in place.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>practical consequence\u003c/code>，G继续处理这一对象，完成“解释自愿规范仍有约束”。到本段末尾，讨论又落到\u003ccode>a different source of pressure\u003c/code>，这正好为下一段“转入仅改变约束来源仍不足”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>以道德章程落实共同期待 → 解释自愿规范仍有约束 → 转入仅改变约束来源仍不足\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选B的功能是“以道德章程落实共同期待”。它也属于同一论题，但若直接放在这里，就会跳过“解释自愿规范仍有约束”这一必要环节；其段首“Shared expectations can take a concrete form in an ethical charter.”需要的前提与B当前收束的对象不一致，后续也接不出D所需的\u003ccode>a different source of pressure\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>44题选G。\u003c/strong>\u003c/p>\n\u003ch3>排序题 · 45题\u003c/h3>\n\u003cp>45位于全文第7个位置，完整衔接是G → D → H。A、E、H为题面已知位置，其余位置须由相邻对象和论证功能逐一确定。\u003c/p>\n\u003cp>前段G的结尾：\u003c/p>\n\u003cblockquote>\n\u003cp>The industry still accepts a duty and faces scrutiny; it simply uses a different source of pressure to support that duty.\u003c/p>\n\u003c/blockquote>\n\u003cp>候选D的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>Different sources of pressure, however, can still leave the same narrow ideal in place.\u003c/p>\n\u003c/blockquote>\n\u003cp>后段H的开头：\u003c/p>\n\u003cblockquote>\n\u003cp>That broader understanding supplies the longest-term aim.\u003c/p>\n\u003c/blockquote>\n\u003cp>前文已经落到\u003ccode>a different source of pressure\u003c/code>，D继续处理这一对象，完成“转入仅改变约束来源仍不足”。到本段末尾，讨论又落到\u003ccode>a broader understanding of beauty\u003c/code>，这正好为下一段“综合法律、章程与价值观改变”提供接入口。两处衔接都满足，才能确定位置，不能只看出现了共同话题。\u003c/p>\n\u003cp>局部推进：\u003c/p>\n\u003cblockquote>\n\u003cp>解释自愿规范仍有约束 → 转入仅改变约束来源仍不足 → 综合法律、章程与价值观改变\u003c/p>\n\u003c/blockquote>\n\u003cp>最强候选G的功能是“解释自愿规范仍有约束”。它也属于同一论题，但若直接放在这里，就会跳过“转入仅改变约束来源仍不足”这一必要环节；其段首“A practical consequence helps keep the charter from becoming a declaration nobody follows.”需要的前提与G当前收束的对象不一致，后续也接不出H所需的\u003ccode>a broader understanding of beauty\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>45题选D。\u003c/strong>\u003c/p>\n\u003ch1>5.一石五鸟第五鸟-顺手积累本文的大作文主题词与表达带来的写作能力提升\u003c/h1>\n\u003ch2>1. 大作文第一段描述题目信息时可积累的主题词\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可积累的主题表达\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003cth>所属类别\u003c/th>\n\u003cth>使用层级\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>a healthy view of beauty\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>健康的审美观\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>社会现象类：生活质量\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>independent self-evaluation\u003c/td>\n\u003ctd>独立的自我评价\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>industry responsibility\u003c/td>\n\u003ctd>行业责任\u003c/td>\n\u003ctd>人生哲理类：责任感、奉献精神\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>self-discipline\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>自律\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：自律\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>个人主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>respect for individual worth\u003c/td>\n\u003ctd>尊重个人价值\u003c/td>\n\u003ctd>人生哲理类：理解、信任、宽容\u003c/td>\n\u003ctd>宏观主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>intellectual development\u003c/td>\n\u003ctd>智力发展\u003c/td>\n\u003ctd>社会现象类：学习生活\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>cooperation within an industry\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>行业内部合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>人生哲理类：团结合作\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>宏观主题\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>healthy living\u003c/td>\n\u003ctd>健康生活\u003c/td>\n\u003ctd>社会现象类：生活质量\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a broader understanding of beauty\u003c/td>\n\u003ctd>更全面的审美认识\u003c/td>\n\u003ctd>人生哲理类：批判、独立、全局思维\u003c/td>\n\u003ctd>个人主题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 大作文第一段描述题目信息时可积累的表达\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适用题型\u003c/th>\n\u003cth>考试时可复用的形式\u003c/th>\n\u003cth>中文翻译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>图画题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The picture challenges the idea that appearance alone determines individual worth.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>图画挑战仅凭外貌判断个人价值的观念。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>A is measuring personal success against a standard imposed by B.\u003c/td>\n\u003ctd>A正用B强加的标准衡量个人成功。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图画题\u003c/td>\n\u003ctd>The contrast invites attention to qualities beyond physical appearance.\u003c/td>\n\u003ctd>这一对比引导人们关注外在形象之外的品质。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>图表题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The share of people choosing A increased from X to Y.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>选择A的人群比例由X增至Y。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>The figures reveal a changing public view of what counts as beauty.\u003c/td>\n\u003ctd>这些数据揭示了公众审美观念的变化。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图表题\u003c/td>\n\u003ctd>Preference for A became stronger while preference for B declined.\u003c/td>\n\u003ctd>对A的偏好增强，而对B的偏好下降。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>文本评论题\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>The passage questions an industry’s authority to define a public ideal.\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>短文质疑某个行业定义公众理想标准的权力。\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The author contrasts legal punishment with voluntary standards.\u003c/td>\n\u003ctd>作者将法律惩罚与自愿规范作对比。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文本评论题\u003c/td>\n\u003ctd>The discussion moves from protecting health to recognising a broader range of human qualities.\u003c/td>\n\u003ctd>讨论从保护健康推进到认识更广泛的人类品质。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n";
const JUMP_TARGETS = [{"label":"方法总览","index":0},{"label":"第一鸟 · 词汇","index":1},{"label":"第二鸟 · 精读与翻译","index":8},{"label":"句内逻辑","index":36},{"label":"长难句手译","index":39},{"label":"第三鸟 · 题目复盘","index":58},{"label":"25题","index":59},{"label":"21题","index":69},{"label":"22题","index":87},{"label":"23题","index":105},{"label":"24题","index":123},{"label":"第四鸟 · 新题型","index":141},{"label":"小标题题","index":141},{"label":"排序题","index":147},{"label":"第五鸟 · 写作积累","index":153}];
const allIndices = [0,1,2,3,4,5,6,7,11,15,19,23,27,31,35,36,37,38,39,45,51,57,58,59,61,63,65,67,68,69,73,77,81,85,86,87,91,95,99,103,104,105,109,113,117,121,122,123,127,131,135,139,140,141,142,143,144,145,146,147,148,149,150,151,152,153,154];
let idx=0, all=false, lastRenderedIdx=-1, renderToken=0;
let saved={idx:0,left:0,right:0,win:0};
const layout=document.getElementById('layout'),leftPanel=document.getElementById('leftPanel'),leftScroll=document.getElementById('leftScroll'),leftStage=document.getElementById('leftStage'),rightScroll=document.getElementById('rightScroll'),rightContent=document.getElementById('rightContent');
const prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset'),toggleAll=document.getElementById('toggleAll'),jump=document.getElementById('jump'),progress=document.getElementById('progress');
function escHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function clampScroll(target,max){return Math.max(0,Math.min(Math.max(0,max),target));}
function imageTarget(ctx,metrics){
 const {top,height,view,max}=metrics;
 if(ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence'){
  const margin=Math.max(24,Math.min(72,view*.09));
  return clampScroll(height<=view-2*margin?top+height/2-view/2:top-margin,max);
 }
 // Full-image and vocabulary pages have no focus padding and must honor includeTitle.
 if(ctx.includeTitle||!Array.isArray(ctx.focus))return 0;
 return clampScroll(top-Math.max(10,Math.min(22,view*.025)),max);
}
function latestTarget(top,view,max){return clampScroll(top-Math.max(72,Math.min(118,view*.12)),max);}
function newtypeTarget(top,view,max){return clampScroll(top-view*.2,max);}
function isParagraphCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('paragraph-');}
function isLongSentenceCumulative(st){return !!st.meta.cumulative&&String(st.meta.cumulativeGroup).startsWith('long-');}
function guardedSchedule(token,fn){
 requestAnimationFrame(()=>{
  if(token!==renderToken)return;
  fn();
  setTimeout(()=>{if(token===renderToken)fn();},80);
 });
}
function hydrateAssets(root){
 root.querySelectorAll('img[data-asset]').forEach(img=>{
  loadAsset(img.dataset.asset,function(src){if(src&&img.getAttribute('src')!==src)img.src=src;});
 });
}
function renderContext(ctx,token,restore){
 const restoreOr=(fn)=>()=>{if(restore){leftScroll.scrollTop=saved.left;}else fn();};
 if(ctx.mode==='newtype'){
  leftStage.className='leftStage newtypeStage';
  const key=ctx.kind;
  if(leftStage.dataset.kind!==key){
   leftStage.innerHTML='<div class="newtypePaper">'+NEWTYPE[key]+'</div>';
   leftStage.dataset.kind=key;
  }
  leftStage.querySelectorAll('.current').forEach(el=>el.classList.remove('current'));
  let el=null;
  if(ctx.current){
   const attr=key==='smallTitle'?'data-q':'data-letter';
   el=leftStage.querySelector('['+attr+'="'+CSS.escape(String(ctx.current))+'"]');
   if(el)el.classList.add('current');
  }
  guardedSchedule(token,restoreOr(()=>{
   if(!el){leftScroll.scrollTop=0;return;}
   const sr=leftScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const absolute=leftScroll.scrollTop+er.top-sr.top;
   leftScroll.scrollTop=newtypeTarget(absolute,leftScroll.clientHeight,leftScroll.scrollHeight-leftScroll.clientHeight);
  }));
  return;
 }
 delete leftStage.dataset.kind;
 leftStage.className='leftStage';
 const padded=ctx.focusUnit==='paragraph'||ctx.focusUnit==='sentence';
 const pad=padded?Math.max(40,leftScroll.clientHeight/2):0;
 const padHtml=pad?'<div class="scrollPad" style="height:'+pad+'px"></div>':'';
 leftStage.innerHTML=padHtml+'<div class="focusPage '+(ctx.asset==='articleAnnotated'?'annotatedPdfPage':'')+'" id="focusPage"><img id="focusImg" alt="'+escHtml(ctx.label)+'" width="'+ctx.sourceW+'" height="'+ctx.sourceH+'"></div>'+padHtml;
 const img=document.getElementById('focusImg'),page=document.getElementById('focusPage');
 const place=restoreOr(()=>{
  const f=ctx.focus||[0,0,ctx.sourceW,ctx.sourceH];
  const scale=img.clientWidth/ctx.sourceW,top=page.offsetTop+f[1]*scale,height=Math.max(2,f[3]*scale);
  leftScroll.scrollTop=imageTarget(ctx,{top,height,view:leftScroll.clientHeight,max:leftScroll.scrollHeight-leftScroll.clientHeight});
 });
 img.onload=()=>guardedSchedule(token,place);
 loadAsset(ctx.asset,function(src){img.src=src;if(img.complete)guardedSchedule(token,place);});
}
function positionLongSentence(st){
 const el=document.getElementById(st.focusId);
 if(!el)return;
 const tail=rightContent.querySelector('.longScrollTail');
 // Judge whether the actual cumulative content fits, excluding artificial scroll room.
 if(tail)tail.style.display='none';
 const view=rightScroll.clientHeight;
 if(st.meta.partIndex===0||rightScroll.scrollHeight<=view){
  rightScroll.scrollTop=0;
  return;
 }
 // Once content overflows, use the sample's centered focus for every new step.
 if(tail)tail.style.display='';
 const height=el.offsetHeight,margin=Math.max(26,Math.min(58,view*.07));
 const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
 const top=rightScroll.scrollTop+er.top-sr.top;
 const target=height<=view-2*margin?top+height/2-view/2:top-margin;
 rightScroll.scrollTop=clampScroll(target,rightScroll.scrollHeight-view);
}
function positionRight(st,token,restore){
 guardedSchedule(token,()=>{
  if(isLongSentenceCumulative(st)){
   positionLongSentence(st);
   if(!restore)return;
  }
  if(restore){
   rightScroll.scrollTop=saved.right;
   window.scrollTo(0,saved.win);
   return;
  }
  if(!st.meta.cumulative||st.meta.partIndex===0){rightScroll.scrollTop=0;return;}
  const el=document.getElementById(st.focusId);
  if(!el)return;
  if(isParagraphCumulative(st)){
   // Match the sample: no artificial tail; real content height limits the scroll.
   const sr=rightScroll.getBoundingClientRect(),er=el.getBoundingClientRect();
   const top=rightScroll.scrollTop+er.top-sr.top;
   rightScroll.scrollTop=clampScroll(top-34,rightScroll.scrollHeight-rightScroll.clientHeight);
   return;
  }
