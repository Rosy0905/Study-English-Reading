c/section>"},{"section":"第三鸟 · 题目复盘","title":"22题结论","level":2,"raw":"### 22题结论\n\n> **22. D. doing harm to**\n\nA：原文“looks that end up”后面接的是一个落到health上的动作，句子整体在解释为什么不能只用外表定义美。\n\nB：原文“beauty should not be defined by looks”先否定只看外表的审美标准，后面的原因是这些looks最终会对health产生某种作用。\n\nC：原文“on health”的前面主语来源是looks，意思是某类外表追求最终落到健康上。\n\nD：结合前后文，作者刚说这些措施有积极动机，接着解释不能让伤害健康的外表标准定义美。","context":{"mode":"image","asset":"questions","focus":[250,772,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"question":"22","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>22. D. doing harm to\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“looks that end up”后面接的是一个落到health上的动作，句子整体在解释为什么不能只用外表定义美。\u003c/p>\n\u003cp>B：原文“beauty should not be defined by looks”先否定只看外表的审美标准，后面的原因是这些looks最终会对health产生某种作用。\u003c/p>\n\u003cp>C：原文“on health”的前面主语来源是looks，意思是某类外表追求最终落到健康上。\u003c/p>\n\u003cp>D：结合前后文，作者刚说这些措施有积极动机，接着解释不能让伤害健康的外表标准定义美。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"23题 · 题干、题型与核心出处","level":2,"raw":"## 23题\n\n> Which of the following is true of the fashion industry?  \n> 关于时尚行业，下面哪一项是正确的？\n\n### 题型\n\n具体细节题。题干要求判断“关于时尚行业，下面哪一项是正确的？”，先按第4、5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> The French measures, however, rely too much on severe punishment to change a culture that still regards beauty as skin-deep – and bone-showing. Under the law, using a fashion model that does not meet a government-defined index of body mass could result in a $85,000 fine and six months in prison.\n>\n> The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types. In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\n>\n> In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models. The newly revised Danish Fashion Ethical Charter clearly states: \"We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.\" The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute. But in general it relies on a name-and-shame method of compliance.\n\n作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。","context":{"mode":"image","asset":"questions","focus":[250,1300,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"question":"23","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>Which of the following is true of the fashion industry?\u003cbr>关于时尚行业，下面哪一项是正确的？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>具体细节题。题干要求判断“关于时尚行业，下面哪一项是正确的？”，先按第4、5、6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>The French measures, however, rely too much on severe punishment to change a culture that still regards beauty as skin-deep – and bone-showing. Under the law, using a fashion model that does not meet a government-defined index of body mass could result in a $85,000 fine and six months in prison.\u003c/p>\n\u003cp>The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types. In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models. The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute. But in general it relies on a name-and-shame method of compliance.\u003c/p>\n\u003c/blockquote>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. The French measures have already failed.","level":3,"raw":"### A. The French measures have already failed.\n\n> 法国的措施已经失败\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A里的“have already failed”和原文“it is trying to set”都在判断时尚行业应对身体审美问题的进展，因为选项宣布法国措施已经失败，原文则写多个国家仍在尝试制定标准，所以回看第五段第二句，并连同第一句一起看。\n\n**错误类型：第一类——歪曲原意。**\n\n原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。A的“have already failed”却给法国措施下了已经失败的完成性结论。时间状态一个是仍在尝试，一个是已经结束并失败。\n\n第五段的“it is trying to set”还说明行业应对仍在推进，不能拿它证明法国措施已经失败，所以A排除。\n\n**命题人借用的原文材料：**\n\n> In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"23","option":"A"},"focusId":"focus-q23-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-A-0\">\u003cblockquote>\n\u003cp>法国的措施已经失败\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“have already failed”和原文“it is trying to set”都在判断时尚行业应对身体审美问题的进展，因为选项宣布法国措施已经失败，原文则写多个国家仍在尝试制定标准，所以回看第五段第二句，并连同第一句一起看。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。A的“have already failed”却给法国措施下了已经失败的完成性结论。时间状态一个是仍在尝试，一个是已经结束并失败。\u003c/p>\n\u003cp>第五段的“it is trying to set”还说明行业应对仍在推进，不能拿它证明法国措施已经失败，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. The French measures have already failed.","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 关于时尚行业，正确的陈述是：法国的措施已经失败。\n\nA里的“have already failed”和原文“it is trying to set”都在判断时尚行业应对身体审美问题的进展，因为选项宣布法国措施已经失败，原文则写多个国家仍在尝试制定标准，所以回看第五段第二句，并连同第一句一起看。\n\n原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。A的“have already failed”却给法国措施下了已经失败的完成性结论。时间状态一个是仍在尝试，一个是已经结束并失败。\n\n第五段承认行业存在问题，并介绍另一种依靠同行压力的标准，但没有回头报告法国法律执行后的结果。文章前一段只是批评法国惩罚过重，这不等于措施已经失败。\n\nA若成立，需要出现执行数据、撤销法律、目标没有实现或明确的failure判断。这里没有这些结果，只有对手段轻重的比较以及其他国家的进行中做法。\n\n对方法的批评不等于已经发生的失败结果，时间和结论都被A提前了。","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"23","option":"A"},"focusId":"focus-q23-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-A-0\">\u003cblockquote>\n\u003cp>法国的措施已经失败\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“have already failed”和原文“it is trying to set”都在判断时尚行业应对身体审美问题的进展，因为选项宣布法国措施已经失败，原文则写多个国家仍在尝试制定标准，所以回看第五段第二句，并连同第一句一起看。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。A的“have already failed”却给法国措施下了已经失败的完成性结论。时间状态一个是仍在尝试，一个是已经结束并失败。\u003c/p>\n\u003cp>第五段的“it is trying to set”还说明行业应对仍在推进，不能拿它证明法国措施已经失败，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is tryin /p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“have already failed”和原文“it is trying to set”都在判断时尚行业应对身体审美问题的进展，因为选项宣布法国措施已经失败，原文则写多个国家仍在尝试制定标准，所以回看第五段第二句，并连同第一句一起看。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。A的“have already failed”却给法国措施下了已经失败的完成性结论。时间状态一个是仍在尝试，一个是已经结束并失败。\u003c/p>\n\u003cp>第五段的“it is trying to set”还说明行业应对仍在推进，不能拿它证明法国措施已经失败，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于时尚行业，正确的陈述是：法国的措施已经失败。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“have already failed”和原文“it is trying to set”都在判断时尚行业应对身体审美问题的进展，因为选项宣布法国措施已经失败，原文则写多个国家仍在尝试制定标准，所以回看第五段第二句，并连同第一句一起看。\u003c/p>\n\u003cp>原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。A的“have already failed”却给法国措施下了已经失败的完成性结论。时间状态一个是仍在尝试，一个是已经结束并失败。\u003c/p>\n\u003cp>第五段承认行业存在问题，并介绍另一种依靠同行压力的标准，但没有回头报告法国法律执行后的结果。文章前一段只是批评法国惩罚过重，这不等于措施已经失败。\u003c/p>\n\u003cp>A若成立，需要出现执行数据、撤销法律、目标没有实现或明确的failure判断。这里没有这些结果，只有对手段轻重的比较以及其他国家的进行中做法。\u003c/p>\n\u003cp>对方法的批评不等于已经发生的失败结果，时间和结论都被A提前了。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重。指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力。具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The French measures have already failed to change the industry.\u003c/p>\n\u003cp>法国措施已经未能改变这个行业。\u003c/p>\n\u003c/blockquote>\n\u003cp>批评手段过重与报告实施失败不同。原文尚用if fully enforced讨论条件，也没有交代已经实施后的失败结果。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. The French measures have already failed.","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> A Challenge to the Fashion Industry’s Body Ideals  \n> 对时尚行业身体审美观的挑战\n\n把这个主旨直接代入23题题干：\n\n> 主旨涉及对身体标准的挑战，局部事实需要区分法国的拟议措施与丹麦正在确立的行业规范；标题不能单独决定成效已经出现。\n\nA实际说的是：\n\n> The French measures have already failed.  \n> 法国的措施已经失败\n\n第五段的“it is trying to set”还说明行业应对仍在推进，不能拿它证明法国措施已经失败，所以A排除。\n\n从全文推进看，这一处的作用是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：A错误。**","context":{"mode":"image","asset":"questions","focus":[250,1398,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-A","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"23","option":"A"},"focusId":"focus-q23-A-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-A-0\">\u003cblockquote>\n\u003cp>法国的措施已经失败\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“have already failed”和原文“it is trying to set”都在判断时尚行业应对身体审美问题的进展，因为选项宣布法国措施已经失败，原文则写多个国家仍在尝试制定标准，所以回看第五段第二句，并连同第一句一起看。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。A的“have already failed”却给法国措施下了已经失败的完成性结论。时间状态一个是仍在尝试，一个是已经结束并失败。\u003c/p>\n\u003cp>第五段的“it is trying to set”还说明行业应对仍在推进，不能拿它证明法国措施已经失败，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquot  set明确写出。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于时尚行业，正确的陈述是：丹麦正在制定新标准。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“New standards are being set in Denmark”和原文“In Denmark”以及“trying to set”直接对应，因为选项把地点和正在制定标准这两个信息合在一起，所以回看第五段第二句。\u003c/p>\n\u003cp>原文“In Denmark”给出地点，“trying to set”给出正在推进的动作，后面明确对象是standards for models and fashion images。B的“New standards are being set in Denmark”保留了地点、动作和对象。\u003c/p>\n\u003cp>原文还提到美国和其他国家，B只摘出丹麦，并没有说只有丹麦这样做；把并列范围中的一个成员拿出来回答“关于时尚行业哪项正确”，并不改变原句。\u003c/p>\n\u003cp>正在制定这一基本关系已经由trying to set明确写出。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重。指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力。具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Denmark’s fashion industry is setting new standards for models and images.\u003c/p>\n\u003cp>丹麦时尚行业正在为模特和时尚形象制定新标准。\u003c/p>\n\u003c/blockquote>\n\u003cp>第五段的trying to set和第六段的agreed last month、newly revised前后相接，从总体尝试推进到新章程的细节。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-B-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003c r pressure，因为选项说这种压力已经消失，原文说新标准更依赖它来执行，所以回看第五段末尾。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。C的“no longer under peer pressure”则说模特已经不再处于这种压力之下。\u003c/p>\n\u003cp>原文是继续并加强使用这种压力，C是取消这种压力，方向相反。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Models are no longer under peer pressure.","level":4,"raw":"#### 定位比对法\n\n先把C接回题干，整句话就变成：\n\n> 关于时尚行业，正确的陈述是：模特不再承受同行压力。\n\nC里的“no longer under peer pressure”和原文“rely more on peer pressure”都直接谈peer pressure，因为选项说这种压力已经消失，原文说新标准更依赖它来执行，所以回看第五段末尾。\n\n原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。C的“no longer under peer pressure”则说模特已经不再处于这种压力之下。\n\n两边不只是程度不同，而是否定关系相反：原文增加依赖，C宣布压力不存在。即使peer pressure具体作用于设计师、机构或模特群体，C的no longer仍与“依赖它执行”无法同时成立。\n\n原文是继续并加强使用这种压力，C是取消这种压力，方向相反。","context":{"mode":"image","asset":"questions","focus":[250,1574,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"23","option":"C"},"focusId":"focus-q23-C-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-C-0\">\u003cblockquote>\n\u003cp>模特不再承受同行压力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“no longer under peer pressure”和原文“rely more on peer pressure”都直接谈peer pressure，因为选项说这种压力已经消失，原文说新标准更依赖它来执行，所以回看第五段末尾。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。C的“no longer under peer pressure”则说模特已经不再处于这种压力之下。\u003c/p>\n\u003cp>原文是继续并加强使用这种压力，C是取消这种压力，方向相反。\u00 ead\" id=\"focus-q23-C-0\">\u003cblockquote>\n\u003cp>模特不再承受同行压力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“no longer under peer pressure”和原文“rely more on peer pressure”都直接谈peer pressure，因为选项说这种压力已经消失，原文说新标准更依赖它来执行，所以回看第五段末尾。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。C的“no longer under peer pressure”则说模特已经不再处于这种压力之下。\u003c/p>\n\u003cp>原文是继续并加强使用这种压力，C是取消这种压力，方向相反。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于时尚行业，正确的陈述是：模特不再承受同行压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“no longer under peer pressure”和原文“rely more on peer pressure”都直接谈peer pressure，因为选项说这种压力已经消失，原文说新标准更依赖它来执行，所以回看第五段末尾。\u003c/p>\n\u003cp>原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。C的“no longer under peer pressure”则说模特已经不再处于这种压力之下。\u003c/p>\n\u003cp>两边不只是程度不同，而是否定关系相反：原文增加依赖，C宣布压力不存在。即使peer pressure具体作用于设计师、机构或模特群体，C的no longer仍与“依赖它执行”无法同时成立。\u003c/p>\n\u003cp>原文是继续并加强使用这种压力，C是取消这种压力，方向相反。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-C-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.\u003c/p>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重。指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力。具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Models no longer face pressure from their peers.\u003c/p>\n\u003cp>模特不再面临同行压力。\u003c/p>\n\u003c/blockquote>\n\u003cp>无同行压力应取消这种执行方式；实际自愿标准更依赖peer pressure，随后name-and-shame再次说明行业压力发挥作用。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. Models are no longer under peer pressure.","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> A Challenge to the Fashion Industry’s Body Ideals  \n> 对时尚行业身体审美观的挑战\n\n把这个主旨直接代入23题题干：\n\n> 主旨涉及对身体标准的挑战，局部事实需要区分法国的拟议措施与丹麦正在确立的行业规范；标题不能单独决定成效已经出现。\n\nC实际说的是：\n\n> Models are no longer under peer pressure.  \n> 模特不再承受同行压力\n\n原文是继续并加强使用这种压力，C是取消这种压力，方向相反。\n\n从全文推进看，这一处的作用是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：C错误。**","context":{"mode":"image","asset":"questions","focus":[250,1574,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"23","option":"C"},"focusId":"focus-q23-C-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-C-0\">\u003cblockquote>\n\u003cp>模特不再承受同行压力\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C排除。当时的定位线索是：C里的“no longer under peer pressure”和原文“rely more on peer pressure”都直接谈peer pressure，因为选项说这种压力已经消失，原文说新标准更依赖它来执行，所以回看第五段末尾。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。C的“no longer under peer pressure”则说模特已经不再处于这种压力之下。\u003c/p>\n\u003cp>原文是继续并加强使用这种压力，C是取消这种压力，方向相反。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fash n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Models are no longer under peer pressure.\u003cbr>模特不再承受同行压力\u003c/p>\n\u003c/blockquote>\n\u003cp>原文是继续并加强使用这种压力，C是取消这种压力，方向相反。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Its inherent problems are getting worse.","level":3,"raw":"### D. Its inherent problems are getting worse.\n\n> 其固有问题正在恶化\n\n**做题模式中的状态：** 第一轮D排除。当时的定位线索是：D里的“problems are getting worse”和原文“The fashion industry knows it has”都承认行业存在问题，因为选项进一步写问题正在恶化，原文只确认问题存在，所以回看第五段第一句。\n\n**错误类型：第三类——无中生有。**\n\n原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。D的“problems are getting worse”却增加了变化趋势，要求这个问题比以前更严重。\n\n段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。\n\n**命题人借用的原文材料：**\n\n> The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.","context":{"mode":"image","asset":"questions","focus":[250,1662,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"23","option":"D"},"focusId":"focus-q23-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-D-0\">\u003cblockquote>\n\u003cp>其固有问题正在恶化\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“problems are getting worse”和原文“The fashion industry knows it has”都承认行业存在问题，因为选项进一步写问题正在恶化，原文只确认问题存在，所以回看第五段第一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。D的“problems are getting worse”却增加了变化趋势，要求这个问题比以前更严重。\u003c/p>\n\u003cp>段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Its inherent problems are getting worse.","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 关于时尚行业，正确的陈述是：其固有问题正在恶化。\n\nD里的“problems are getting worse”和原文“The fashion industry knows it has”都承认行业存在问题，因为选项进一步写问题正在恶化，原文只确认问题存在，所以回看第五段第一句。\n\n原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。D的“problems are getting worse”却增加了变化趋势，要求这个问题比以前更严重。\n\n存在问题与问题恶化不是同一判断。第五段没有过去与现在的对比，也没有增长、加剧或越来越严重的表达；后一句反而写行业正在尝试建立标准。\n\nD还把单数problem扩为复数problems，并用getting worse加入动态结果。\n\n段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。","context":{"mode":"image","asset":"questions","focus":[250,1662,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-23-option-D","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"23","option":"D"},"focusId":"focus-q23-D-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q23-D-0\">\u003cblockquote>\n\u003cp>其固有问题正在恶化\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D排除。当时的定位线索是：D里的“problems are getting worse”和原文“The fashion industry knows it has”都承认行业存在问题，因为选项进一步写问题正在恶化，原文只确认问题存在，所以回看第五段第一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。D的“problems are getting worse”却增加了变化趋势，要求这个问题比以前更严重。\u003c/p>\n\u003cp>段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q2 ustry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。D的“problems are getting worse”却增加了变化趋势，要求这个问题比以前更严重。\u003c/p>\n\u003cp>段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-D-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把D接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>关于时尚行业，正确的陈述是：其固有问题正在恶化。\u003c/p>\n\u003c/blockquote>\n\u003cp>D里的“problems are getting worse”和原文“The fashion industry knows it has”都承认行业存在问题，因为选项进一步写问题正在恶化，原文只确认问题存在，所以回看第五段第一句。\u003c/p>\n\u003cp>原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。D的“problems are getting worse”却增加了变化趋势，要求这个问题比以前更严重。\u003c/p>\n\u003cp>存在问题与问题恶化不是同一判断。第五段没有过去与现在的对比，也没有增长、加剧或越来越严重的表达；后一句反而写行业正在尝试建立标准。\u003c/p>\n\u003cp>D还把单数problem扩为复数problems，并用getting worse加入动态结果。\u003c/p>\n\u003cp>段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.\u003c/p>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重。指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力。具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The industry’s inherent problems are becoming progressively worse.\u003c/p>\n\u003cp>行业固有的问题正在不断恶化。\u003c/p>\n\u003c/blockquote>\n\u003cp>inherent只交代问题固有存在，不给恶化的时间比较。后文转向应对措施，而非提供越来越严重的趋势。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. Its inherent problems are getting worse.","leve industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。D的“problems are getting worse”却增加了变化趋势，要求这个问题比以前更严重。\u003c/p>\n\u003cp>存在问题与问题恶化不是同一判断。第五段没有过去与现在的对比，也没有增长、加剧或越来越严重的表达；后一句反而写行业正在尝试建立标准。\u003c/p>\n\u003cp>D还把单数problem扩为复数problems，并用getting worse加入动态结果。\u003c/p>\n\u003cp>段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-D-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第4、5、6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.\u003c/p>\n\u003cp>作者批评法国依赖惩罚，随后介绍丹麦等国家正在尝试自愿标准，第六段进一步展开丹麦新修订的章程。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重。指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力。具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果D真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>The industry’s inherent problems are becoming progressively worse.\u003c/p>\n\u003cp>行业固有的问题正在不断恶化。\u003c/p>\n\u003c/blockquote>\n\u003cp>inherent只交代问题固有存在，不给恶化的时间比较。后文转向应对措施，而非提供越来越严重的趋势。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q23-D-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入23题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨涉及对身体标准的挑战，局部事实需要区分法国的拟议措施与丹麦正在确立的行业规范；标题不能单独决定成效已经出现。\u003c/p>\n\u003c/blockquote>\n\u003cp>D实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>Its inherent problems are getting worse.\u003cbr>其固有问题正在恶化\u003c/p>\n\u003c/blockquote>\n\u003cp>段中没有前后时期的比较，后续还写正在采取应对；D所需的趋势没有建立，因此D排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：批评法国依靠严厉处罚改变文化，罚款和监禁力度过重指出行业知道自己有身体审美问题，一些国家正尝试依靠自愿标准和同行压力具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：D错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"23题结论","level":2,"raw":"### 23题结论\n\n> **23. B. New standards are being set in Denmark.**\n\nA：原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。\n\nB：原文“In Denmark”给出地点，“trying to set”给出正在推进的动作，后面明确对象是standards for models and fashion images。\n\nC：原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。\n\nD：原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。","context":{"mode":"image","asset":"questions","focus":[250,1300,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"question":"23","questionConclusion":true},"focusId":null,"html":"\u003cblockquote>\n\u003cp>\u003cstrong>23. B. New standards are being set in Denmark.\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003cp>A：原文“it is trying to set”描述的是正在进行的行业调整，主体范围包括丹麦、美国和其他国家。\u003c/p>\n\u003cp>B：原文“In Denmark”给出地点，“trying to set”给出正在推进的动作，后面明确对象是standards for models and fashion images。\u003c/p>\n\u003cp>C：原文“rely more on peer pressure”把同行压力当成执行标准的重要手段，而且程度是more。\u003c/p>\n\u003cp>D：原文“The fashion industry knows it has”说明行业意识到自己存在一个与物质外表和理想化体型有关的问题。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"24题 · 题干、题型与核心出处","level":2,"raw":"## 24题\n\n> A designer is most likely to be rejected by CFW for ______.  \n> 一名设计师最可能因为什么被哥本哈根时装周拒绝？\n\n### 题型\n\n原因细节题。题干要求判断“一名设计师最可能因为什么被哥本哈根时装周拒绝？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\n\n### 核心出处\n\n> In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models. The newly revised Danish Fashion Ethical Charter clearly states: \"We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.\" The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute. But in general it relies on a name-and-shame method of compliance.\n\n丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。","context":{"mode":"image","asset":"questions","focus":[250,1829,1800,470],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"question":"24","kind":"question"},"focusId":null,"html":"\u003cblockquote>\n\u003cp>A designer is most likely to be rejected by CFW for ______.\u003cbr>一名设计师最可能因为什么被哥本哈根时装周拒绝？\u003c/p>\n\u003c/blockquote>\n\u003ch3>题型\u003c/h3>\n\u003cp>原因细节题。题干要求判断“一名设计师最可能因为什么被哥本哈根时装周拒绝？”，先按第6段的限定范围和对象找依据，再将每个完整选项接回题干。不能因为有同话题词语就跳过主体、动作、限定条件或段落功能。\u003c/p>\n\u003ch3>核心出处\u003c/h3>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models. The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute. But in general it relies on a name-and-shame method of compliance.\u003c/p>\n\u003c/blockquote>\n\u003cp>丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\u003c/p>\n"},{"section":"第三鸟 · 题目复盘","title":"A. pursuing perfect physical conditions","level":3,"raw":"### A. pursuing perfect physical conditions\n\n> 追求完美的身体条件\n\n**做题模式中的状态：** 第一轮A排除。当时的定位线索是：A里的“pursuing perfect physical conditions”和原文“age, health, and other characteristics”都涉及模特身体条件，因为选项写设计师追求完美身体，原文写丹麦规则审视年龄、健康等特征，所以回看第六段第一句和关于CFW执行工具的句子。\n\n**错误类型：第一类——歪曲原意。**\n\n原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。A的“pursuing perfect physical conditions”却把违规动作写成追求完美身体条件。\n\n原文没有把“完美身体”写成拒绝条件，也没有出现设计师追求这一目标的动作，所以A排除。\n\n**命题人借用的原文材料：**\n\n> In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\n>\n> The newly revised Danish Fashion Ethical Charter clearly states: \"We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.\" The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.","context":{"mode":"image","asset":"questions","focus":[250,1838,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"24","option":"A"},"focusId":"focus-q24-A-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-A-0\">\u003cblockquote>\n\u003cp>追求完美的身体条件\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“pursuing perfect physical conditions”和原文“age, health, and other characteristics”都涉及模特身体条件，因为选项写设计师追求完美身体，原文写丹麦规则审视年龄、健康等特征，所以回看第六段第一句和关于CFW执行工具的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。A的“pursuing perfect physical conditions”却把违规动作写成追求完美身体条件。\u003c/p>\n\u003cp>原文没有把“完美身体”写成拒绝条件，也没有出现设计师追求这一目标的动作，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. pursuing perfect physical conditions","level":4,"raw":"#### 定位比对法\n\n先把A接回题干，整句话就变成：\n\n> 设计师最可能被哥本哈根时装周拒绝，是因为他追求完美的身体条件。\n\nA里的“pursuing perfect physical conditions”和原文“age, health, and other characteristics”都涉及模特身体条件，因为选项写设计师追求完美身体，原文写丹麦规则审视年龄、健康等特征，所以回看第六段第一句和关于CFW执行工具的句子。\n\n原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。A的“pursuing perfect physical conditions”却把违规动作写成追求完美身体条件。\n\n宪章反对的是时尚行业对身体审美造成有害影响，并要求承担责任；它没有把正常的健康状态或良好身体条件本身列为违规。A把“规则检查身体相关因素”改成“追求完美身体就会受罚”，对象与评价都发生偏移。\n\n若A成立，需要原文明确写设计师要求模特达到完美体形，且这种追求触发CFW拒绝。当前段落只写年龄、健康及其他特征的规则，没有perfect这一极端标准。\n\n关注健康因素是规则内容，追求完美身体是A另加的行为与评价。","context":{"mode":"image","asset":"questions","focus":[250,1838,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"24","option":"A"},"focusId":"focus-q24-A-1","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-A-0\">\u003cblockquote>\n\u003cp>追求完美的身体条件\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“pursuing perfect physical conditions”和原文“age, health, and other characteristics”都涉及模特身体条件，因为选项写设计师追求完美身体，原文写丹麦规则审视年龄、健康等特征，所以回看第六段第一句和关于CFW执行工具的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。A的“pursuing perfect physical conditions”却把违规动作写成追求完美身体条件。\u003c/p>\n\u003cp>原文没有把“完美身体”写成拒绝条件，也没有出现设计师追求这一目标的动作，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>设计师最可能被哥本哈根时装周拒绝，是因为他追求完美的身体条件。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“pursuing perfect physical conditions”和原文“age, health, and other characteristics”都涉及模特身体条件，因为选项写设计师追求完美身体，原文写丹麦规则审视年龄、健康等特征，所以回看第六段第一句和关于CFW执行工具的句子。\u003c/p>\n\u003cp>原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。A的“pursuing perfect physical conditions”却把违规动作写成追求完美身体条件。\u003c/p>\n\u003cp>宪章反对的是时尚行业对身体审美造成有害影响，并要求承担责任；它没有把正常的健康状态或良好身体条件本身列为违规。A把“规则检查身体相关因素”改成“追求完美身体就会受罚”，对象与评价都发生偏移。\u003c/p>\n\u003cp>若A成立，需要原文明确写设计师要求模特达到完美体形，且这种追求触发CFW拒绝。当前段落只写年龄、健康及其他特征的规则，没有perfect这一极端标准。\u003c/p>\n\u003cp>关注健康因素是规则内容，追求完美身体是A另加的行为与评价。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"A. pursuing perfect physical conditions","level":4,"raw":"#### 写作视角法\n\n原文第6段是这样写的：\n\n> In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\n>\n> The newly revised Danish Fashion Ethical Charter clearly states: \"We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.\" The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\n>\n> 丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\n\n把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果A真是作者的意思，文章至少得写成：\n\n> Designers will be excluded for pursuing perfect physical conditions in their models.\n>\n> 设计师会因追求模特完美的身体条件而被排除。\n\n假设必须明确把追求完美身体条件本身写成拒绝准入的理由。实际章程要求关注年龄、健康等条件，并未把perfect这一追求目标直接列为违规；不能仅凭都谈身体就等同两种条件。","context":{"mode":"image","asset":"questions","focus":[250,1838,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-A","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"24","option":"A"},"focusId":"focus-q24-A-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-A-0\">\u003cblockquote>\n\u003cp>追求完美的身体条件\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮A排除。当时的定位线索是：A里的“pursuing perfect physical conditions”和原文“age, health, and other characteristics”都涉及模特身体条件，因为选项写设计师追求完美身体，原文写丹麦规则审视年龄、健康等特征，所以回看第六段第一句和关于CFW执行工具的句子。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第一类——歪曲原意。\u003c/strong>\u003c/p>\n\u003cp>原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。A的“pursuing perfect physical conditions”却把违规动作写成追求完美身体条件。\u003c/p>\n\u003cp>原文没有把“完美身体”写成拒绝条件，也没有出现设计师追求这一目标的动作，所以A排除。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-1\">\u003 ent is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把A接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>设计师最可能被哥本哈根时装周拒绝，是因为他追求完美的身体条件。\u003c/p>\n\u003c/blockquote>\n\u003cp>A里的“pursuing perfect physical conditions”和原文“age, health, and other characteristics”都涉及模特身体条件，因为选项写设计师追求完美身体，原文写丹麦规则审视年龄、健康等特征，所以回看第六段第一句和关于CFW执行工具的句子。\u003c/p>\n\u003cp>原文“age, health, and other characteristics”说明规则关注模特的年龄、健康等条件，随后写不符合宪章要求的设计师和机构可能被CFW拒绝进入。A的“pursuing perfect physical conditions”却把违规动作写成追求完美身体条件。\u003c/p>\n\u003cp>宪章反对的是时尚行业对身体审美造成有害影响，并要求承担责任；它没有把正常的健康状态或良好身体条件本身列为违规。A把“规则检查身体相关因素”改成“追求完美身体就会受罚”，对象与评价都发生偏移。\u003c/p>\n\u003cp>若A成立，需要原文明确写设计师要求模特达到完美体形，且这种追求触发CFW拒绝。当前段落只写年龄、健康及其他特征的规则，没有perfect这一极端标准。\u003c/p>\n\u003cp>关注健康因素是规则内容，追求完美身体是A另加的行为与评价。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003cp>丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果A真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Designers will be excluded for pursuing perfect physical conditions in their models.\u003c/p>\n\u003cp>设计师会因追求模特完美的身体条件而被排除。\u003c/p>\n\u003c/blockquote>\n\u003cp>假设必须明确把追求完美身体条件本身写成拒绝准入的理由。实际章程要求关注年龄、健康等条件，并未把perfect这一追求目标直接列为违规；不能仅凭都谈身体就等同两种条件。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-A-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调调整危害健康的身体理想；对拒绝参展的具体原因，还要看章程保护什么，以及哪种行为违反这个要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>A实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>pursuing perfect physical conditions\u003cbr>追求完美的身体条件\u003c/p>\n\u003c/blockquote>\n\u003cp>原文没有把“完美身体”写成拒绝条件，也没有出现设计师追求这一目标的动作，所以A排除。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：A错误。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. caring too much about models’ character","level":3,"raw":"### B. caring too much about models’ character\n\n> 过分关注模特的品格\n\n**做题模式中的状态：** 第一轮B排除。当时的定位线索是：B里的“models’ character”和原文“other characteristics of models”词形接近，因为选项把character理解成人格品格，原文却把characteristics与年龄、健康并列为模特特征，所以回看第六段第一句。\n\n**错误类型：第三类——无中生有。**\n\n原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。B的“models’ character”则指模特的性格或品格，是另一个更窄的概念。\n\ncharacteristics与character不是这里的同一对象，B又增加了原文没有的过度关注动作。\n\n**命题人借用的原文材料：**\n\n> In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.","context":{"mode":"image","asset":"questions","focus":[250,2015,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"24","option":"B"},"focusId":"focus-q24-B-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-B-0\">\u003cblockquote>\n\u003cp>过分关注模特的品格\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“models’ character”和原文“other characteristics of models”词形接近，因为选项把character理解成人格品格，原文却把characteristics与年龄、健康并列为模特特征，所以回看第六段第一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。B的“models’ character”则指模特的性格或品格，是另一个更窄的概念。\u003c/p>\n\u003cp>characteristics与character不是这里的同一对象，B又增加了原文没有的过度关注动作。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. caring too much about models’ character","level":4,"raw":"#### 定位比对法\n\n先把B接回题干，整句话就变成：\n\n> 设计师最可能被哥本哈根时装周拒绝，是因为他过分关注模特的品格。\n\nB里的“models’ character”和原文“other characteristics of models”词形接近，因为选项把character理解成人格品格，原文却把characteristics与年龄、健康并列为模特特征，所以回看第六段第一句。\n\n原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。B的“models’ character”则指模特的性格或品格，是另一个更窄的概念。\n\nB还加入caring too much，要求设计师因为过分关注品格而受罚。原文没有写关注程度，更没有把人格评价列成拒绝CFW的原因；它讨论的是行业规则对模特条件和身体审美影响的约束。\n\n两个词看起来相似，但修饰关系不同：原文是characteristics of models，B是models’ character；一个可包含年龄、健康等客观特征，一个是人的品格。\n\ncharacteristics与character不是这里的同一对象，B又增加了原文没有的过度关注动作。","context":{"mode":"image","asset":"questions","focus":[250,2015,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"partIndex":1,"kind":"method","question":"24","option":"B"},"focusId":"focus-q24-B-1","html":"\u003csection class=\"re 入是执行规则的手段，目的是让行业对身体理想的影响负责。\n\n把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果B真是作者的意思，文章至少得写成：\n\n> Designers will be excluded for caring too much about their models’ character.\n>\n> 设计师会因过分关注模特的品格而被排除。\n\n品格属于作者希望重视的非物质品质。第六段没有把重视品格写成违规事项，更没有过度关注品格导致禁入的规则。","context":{"mode":"image","asset":"questions","focus":[250,2015,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"24","option":"B"},"focusId":"focus-q24-B-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-B-0\">\u003cblockquote>\n\u003cp>过分关注模特的品格\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮B排除。当时的定位线索是：B里的“models’ character”和原文“other characteristics of models”词形接近，因为选项把character理解成人格品格，原文却把characteristics与年龄、健康并列为模特特征，所以回看第六段第一句。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。B的“models’ character”则指模特的性格或品格，是另一个更窄的概念。\u003c/p>\n\u003cp>characteristics与character不是这里的同一对象，B又增加了原文没有的过度关注动作。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-B-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把B接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>设计师最可能被哥本哈根时装周拒绝，是因为他过分关注模特的品格。\u003c/p>\n\u003c/blockquote>\n\u003cp>B里的“models’ character”和原文“other characteristics of models”词形接近，因为选项把character理解成人格品格，原文却把characteristics与年龄、健康并列为模特特征，所以回看第六段第一句。\u003c/p>\n\u003cp>原文“other characteristics of models”中的characteristics是泛指模特的其他特征，并且与age和health并列。B的“models’ character”则指模特的性格或品格，是另一个更窄的概念。\u003c/p>\n\u003cp>B还加入caring too much，要求设计师因为过分关注品格而受罚。原文没有写关注程度，更没有把人格评价列成拒绝CFW的原因；它讨论的是行业规则对模特条件和身体审美影响的约束。\u003c/p>\n\u003cp>两个词看起来相似，但修饰关系不同：原文是characteristics of models，B是models’ character；一个可包含年龄、健康等客观特征，一个是人的品格。\u003c/p>\n\u003cp>characteristics与character不是这里的同一对象，B又增加了原文没有的过度关注动作。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-B-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果B真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Designers will be excluded for caring too much about their models’ character.\u003c/p>\n\u003cp>设计师会因过分关注模特的品格而被排除。\u003c/p>\n\u003c/blockquote>\n\u003cp>品格属于作者希望重视的非物质品质。第六段没有把重视品格写成违规事项，更没有过度关注品格导致禁入的规则。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"B. caring too much about models’ character","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> A Challenge to the Fashion Industry’s Body Ideals  \n> 对时尚行业身体审美观的挑战\n\n把这个主旨直接代入24题题干：\n\n> 主旨强调调整危害健康的身体理想；对拒绝参展的具体原因，还要看章程保护什么，以及哪种行为违反这个要求。\n\nB实际说的是：\n\n> caring too much about models’ character  \n> 过分关注模特的品格\n\ncharacteristics与character不是这里的同一对象，B又增加了原文没有的过度关注动作。\n\n从全文推进看，这一处的作用是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\n\n这项回答与全文有话题联系，但这种联系不足以补齐它所需的事实。主旨只限定答题方向，具体的主体、范围和因果仍必须由定位原文确认。\n\n**复盘判断：B错误。**","context":{"mode":"image","asset":"questions","focus":[250,2015,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-B","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"24","option":"B"},"focusId":"focus-q24-B-3 W拒绝进入的执行句。\u003c/p>\n\u003cp>原文“take responsibility”要求时尚行业意识到并承担自己对身体审美、尤其是年轻人的影响；C的“showing little concern”写的是设计师对相关因素缺少关心。两者正好构成遵守与不遵守的对照。\u003c/p>\n\u003cp>执行工具是“deny access for designers and modeling agencies to CFW”，所以当设计师表现出对宪章关切事项的漠视时，被拒绝进入正能接上这套执行方式。C没有把处罚对象换掉，仍然是designer。\u003c/p>\n\u003cp>漠视宪章要求承担的影响，正是执行规则时可以针对的不合规表现。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. showing little concern for health factors","level":4,"raw":"#### 写作视角法\n\n原文第6段是这样写的：\n\n> The newly revised Danish Fashion Ethical Charter clearly states: \"We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.\" The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\n>\n> 丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\n\n把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果C真是作者的意思，文章至少得写成：\n\n> Designers who disregard their models’ health will be denied access to CFW.\n>\n> 忽视模特健康的设计师会被拒绝参加哥本哈根时装周。\n\n健康列在规则内，违反保护健康的要求与拒绝准入这项制裁可以接上。选项说的是忽视健康，没有另造与章程相反的年龄要求。","context":{"mode":"image","asset":"questions","focus":[250,2102,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"24","option":"C"},"focusId":"focus-q24-C-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-C-0\">\u003cblockquote>\n\u003cp>很少考虑健康因素\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“showing little concern for [xxx] factors”，保留了相应遮挡。当时的定位线索是：C里的“showing little concern”和原文“take responsibility”都在判断时尚从业者是否认真对待其影响，因为选项写漠视，宪章要求承担责任，所以回看宪章声明以及CFW拒绝进入的执行句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“take responsibility”要求时尚行业意识到并承担自己对身体审美、尤其是年轻 续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Designers who disregard their models’ health will be denied access to CFW.\u003c/p>\n\u003cp>忽视模特健康的设计师会被拒绝参加哥本哈根时装周。\u003c/p>\n\u003c/blockquote>\n\u003cp>健康列在规则内，违反保护健康的要求与拒绝准入这项制裁可以接上。选项说的是忽视健康，没有另造与章程相反的年龄要求。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"C. showing little concern for health factors","level":4,"raw":"#### 主旨交叉验证法\n\n25题的正确答案是：\n\n> A Challenge to the Fashion Industry’s Body Ideals  \n> 对时尚行业身体审美观的挑战\n\n把这个主旨直接代入24题题干：\n\n> 主旨强调调整危害健康的身体理想；对拒绝参展的具体原因，还要看章程保护什么，以及哪种行为违反这个要求。\n\nC实际说的是：\n\n> showing little concern for health factors  \n> 很少考虑健康因素\n\n漠视宪章要求承担的影响，正是执行规则时可以针对的不合规表现。\n\n从全文推进看，这一处的作用是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\n\n这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\n\n**复盘判断：C正确。**","context":{"mode":"image","asset":"questions","focus":[250,2102,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-C","cumulativeFinal":true,"partIndex":3,"kind":"method","question":"24","option":"C"},"focusId":"focus-q24-C-3","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-C-0\">\u003cblockquote>\n\u003cp>很少考虑健康因素\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮C保留。当时选项呈现为“showing little concern for [xxx] factors”，保留了相应遮挡。当时的定位线索是：C里的“showing little concern”和原文“take responsibility”都在判断时尚从业者是否认真对待其影响，因为选项写漠视，宪章要求承担责任，所以回看宪章声明以及CFW拒绝进入的执行句。\u003c/p>\n\u003cp>\u003cstrong>选项类型：正确同义改写。\u003c/strong>\u003c/p>\n\u003cp>原文“take responsibility”要求时尚行业意识到并承担自己对身体审美、尤其是年轻人的影响；C的“showing little concern”写的是设计师对相关因素缺少关心。两者正好构成遵守与不遵守的对照。\u003c/p>\n\u003cp>漠视宪章要求承担的影响，正是执行规则时可以针对的不合规表现。\u003c/p>\n\u003cp>\u003cstrong>正确选项的原文依据：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003c/blockquote>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-C-1\">\u003ch3>定位比对法\u003c/h3>\n\u003cp>先把C接回题干，整句话就变成：\u003c/p>\n\u003cblockquote>\n\u003cp>设计师最可能被哥本哈根时装周拒绝，是因为他很少考虑健康因素。\u003c/p>\n\u003c/blockquote>\n\u003cp>C里的“showing little concern”和原文“take responsibility”都在判断时尚从业者是否认真对待其影响，因为选项写漠视，宪章要求承担责任，所以回看宪章声明以及CFW拒绝进入的执行句。\u003c/p>\n\u003cp>原文“take responsibility”要求时尚行业意识到并承担自己对身体审美、尤其是年轻人的影响；C的“showing little concern”写的是设计师对相关因素缺少关心。两者正好构成遵守与不遵守的对照。\u003c/p>\n\u003cp>执行工具是“deny access for designers and modeling agencies to CFW”，所以当设计师表现出对宪章关切事项的漠视时，被拒绝进入正能接上这套执行方式。C没有把处罚对象换掉，仍然是designer。\u003c/p>\n\u003cp>漠视宪章要求承担的影响，正是执行规则时可以针对的不合规表现。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-C-2\">\u003ch3>写作视角法\u003c/h3>\n\u003cp>原文第6段是这样写的：\u003c/p>\n\u003cblockquote>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003cp>丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\u003c/p>\n\u003c/blockquote>\n\u003cp>把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\u003c/p>\n\u003cp>如果C真是作者的意思，文章至少得写成：\u003c/p>\n\u003cblockquote>\n\u003cp>Designers who disregard their models’ health will be denied access to CFW.\u003c/p>\n\u003cp>忽视模特健康的设计师会被拒绝参加哥本哈根时装周。\u003c/p>\n\u003c/blockquote>\n\u003cp>健康列在规则内，违反保护健康的要求与拒绝准入这项制裁可以接上。选项说的是忽视健康，没有另造与章程相反的年龄要求。\u003c/p>\n\u003c/section>\u003csection class=\"revealPart\" id=\"focus-q24-C-3\">\u003ch3>主旨交叉验证法\u003c/h3>\n\u003cp>25题的正确答案是：\u003c/p>\n\u003cblockquote>\n\u003cp>A Challenge to the Fashion Industry’s Body Ideals\u003cbr>对时尚行业身体审美观的挑战\u003c/p>\n\u003c/blockquote>\n\u003cp>把这个主旨直接代入24题题干：\u003c/p>\n\u003cblockquote>\n\u003cp>主旨强调调整危害健康的身体理想；对拒绝参展的具体原因，还要看章程保护什么，以及哪种行为违反这个要求。\u003c/p>\n\u003c/blockquote>\n\u003cp>C实际说的是：\u003c/p>\n\u003cblockquote>\n\u003cp>showing little concern for health factors\u003cbr>很少考虑健康因素\u003c/p>\n\u003c/blockquote>\n\u003cp>漠视宪章要求承担的影响，正是执行规则时可以针对的不合规表现。\u003c/p>\n\u003cp>从全文推进看，这一处的作用是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行\u003c/p>\n\u003cp>这项回答保留了局部证据支持的关系；放回全文后，它仍承担本段原有功能，没有改变文章立场或另添事实。\u003c/p>\n\u003cp>\u003cstrong>复盘判断：C正确。\u003c/strong>\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. setting a high age threshold for models","level":3,"raw":"### D. setting a high age threshold for models\n\n> 给模特设置很高的年龄门槛\n\n**做题模式中的状态：** 第一轮D保留。当时选项呈现为“setting a high [xxx] threshold for models”，保留了相应遮挡。当时的定位线索是：D里的“threshold for models”和原文“regarding the age”都在谈规则怎样给模特设定条件，因为选项写一项高门槛，原文写年龄等特征受规则约束，所以回看第六段第一句和CFW拒绝进入的执行句。读完全文后，做题模式再经交叉验证排除D，最终选择C。\n\n**错误类型：第三类——无中生有。**\n\n第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。但段落没有给年龄门槛的具体数值，也没有说明什么叫high。\n\nD把出现age扩大成明确的年龄方向和排除原因。C指出忽视模特健康，能与章程的健康责任和准入执行连成完整关系；D所需的高年龄门槛规则在原文中并未建立。\n\n**命题人借用的原文材料：**\n\n> In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\n>\n> The newly revised Danish Fashion Ethical Charter clearly states: \"We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.\" The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.","context":{"mode":"image","asset":"questions","focus":[250,2190,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"partIndex":0,"kind":"option","question":"24","option":"D"},"focusId":"focus-q24-D-0","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-D-0\">\u003cblockquote>\n\u003cp>给模特设置很高的年龄门槛\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“setting a high [xxx] threshold for models”，保留了相应遮挡。当时的定位线索是：D里的“threshold for models”和原文“regarding the age”都在谈规则怎样给模特设定条件，因为选项写一项高门槛，原文写年龄等特征受规则约束，所以回看第六段第一句和CFW拒绝进入的执行句。读完全文后，做题模式再经交叉验证排除D，最终选择C。\u003c/p>\n\u003cp>\u003cstrong>错误类型：第三类——无中生有。\u003c/strong>\u003c/p>\n\u003cp>第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。但段落没有给年龄门槛的具体数值，也没有说明什么叫high。\u003c/p>\n\u003cp>D把出现age扩大成明确的年龄方向和排除原因。C指出忽视模特健康，能与章程的健康责任和准入执行连成完整关系；D所需的高年龄门槛规则在原文中并未建立。\u003c/p>\n\u003cp>\u003cstrong>命题人借用的原文材料：\u003c/strong>\u003c/p>\n\u003cblockquote>\n\u003cp>In contrast to France&#39;s actions, Denmark&#39;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\u003c/p>\n\u003cp>The newly revised Danish Fashion Ethical Charter clearly states: &quot;We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.&quot; The charter&#39;s main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\u003c/p>\n\u003c/blockquote>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. setting a high age threshold for models","level":4,"raw":"#### 定位比对法\n\n先把D接回题干，整句话就变成：\n\n> 设计师最可能被哥本哈根时装周拒绝，是因为他给模特设置很高的年龄门槛。\n\nD里的“threshold for models”和原文“regarding the age”都在谈规则怎样给模特设定条件，因为选项写一项高门槛，原文写年龄等特征受规则约束，所以回看第六段第一句和CFW拒绝进入的执行句。\n\n第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。但段落没有给年龄门槛的具体数值，也没有说明什么叫high。\n\n章程采用限制参加时装周的办法促使行业遵守规则，且直接强调行业对body ideals、especially on young people的责任。年龄是被规则涉及的一项，不能自 r models”和原文“regarding the age”都在谈规则怎样给模特设定条件，因为选项写一项高门槛，原文写年龄等特征受规则约束，所以回看第六段第一句和CFW拒绝进入的执行句。\u003c/p>\n\u003cp>第6段确实说章程涉及age、health等要求，因此D的age threshold有一个词面落点。但段落没有给年龄门槛的具体数值，也没有说明什么叫high。\u003c/p>\n\u003cp>章程采用限制参加时装周的办法促使行业遵守规则，且直接强调行业对body ideals、especially on young people的责任。年龄是被规则涉及的一项，不能自动推出设计师因为把门槛设得太高而被拒绝。\u003c/p>\n\u003cp>D把出现age扩大成明确的年龄方向和排除原因。C指出忽视模特健康，能与章程的健康责任和准入执行连成完整关系；D所需的高年龄门槛规则在原文中并未建立。\u003c/p>\n\u003c/section>"},{"section":"第三鸟 · 题目复盘","title":"D. setting a high age threshold for models","level":4,"raw":"#### 写作视角法\n\n原文第6段是这样写的：\n\n> In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.\n>\n> The newly revised Danish Fashion Ethical Charter clearly states: \"We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.\" The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.\n>\n> 丹麦章程涉及年龄、健康等条件，拒绝准入是执行规则的手段，目的是让行业对身体理想的影响负责。\n\n把这一处放回全文，它承担的写作任务是：具体写丹麦宪章如何规定年龄与健康、要求承担责任，并用CFW准入和点名方式执行。选项若成立，既要保留题干限定的关系，也要让这一步能够继续接到全文的论证方向。\n\n如果D真是作者的意思，文章至少得写成：\n\n> Designers will be excluded because they require models to be too old.\n>\n> 设计师会因要求模特年龄过大而被排除。\n\n这需要说明章程禁止把年龄门槛定得过高。原文只列age为监管事项，没有给高低方向或上限，提到年龄不等于支持这种惩罚原因。","context":{"mode":"image","asset":"questions","focus":[250,2190,1800,85],"sourceW":2256,"sourceH":3142,"label":"2016英语一Text 1题目"},"meta":{"cumulative":true,"cumulativeGroup":"question-24-option-D","cumulativeFinal":false,"partIndex":2,"kind":"method","question":"24","option":"D"},"focusId":"focus-q24-D-2","html":"\u003csection class=\"revealPart optionLead\" id=\"focus-q24-D-0\">\u003cblockquote>\n\u003cp>给模特设置很高的年龄门槛\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>做题模式中的状态：\u003c/strong> 第一轮D保留。当时选项呈现为“setting a high [xxx] threshold for models”，保留了相
