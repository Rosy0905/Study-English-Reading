<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 26题题干\n\n**Britain’s public sentiment about the countryside ______.**\n\n> 英国公众对于乡村的情感______。\n\n题型：**细节判断题**。","articleRects":[],"questionRects":[[226,190,755,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"26"},"html":"<h2>26题题干</h2>\n<p><strong>Britain’s public sentiment about the countryside ______.</strong></p>\n<blockquote><p>英国公众对于乡村的情感______。</p>\n</blockquote>\n<p>题型：<strong>细节判断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 27题题干\n\n**According to Paragraph 2, the achievements of the National Trust are now being ______.**\n\n> 根据第2段，国民信托的成果现在正被______。\n\n题型：**细节判断题**。","articleRects":[],"questionRects":[[226,557,1180,38],[280,619,83,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"27"},"html":"<h2>27题题干</h2>\n<p><strong>According to Paragraph 2, the achievements of the National Trust are now being ______.</strong></p>\n<blockquote><p>根据第2段，国民信托的成果现在正被______。</p>\n</blockquote>\n<p>题型：<strong>细节判断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 28题题干\n\n**Which of the following can be inferred from Paragraph 3?**\n\n> 下列哪项可以从第3段推断出来？\n\n题型：**段落推断题**。","articleRects":[],"questionRects":[[226,986,913,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"28"},"html":"<h2>28题题干</h2>\n<p><strong>Which of the following can be inferred from Paragraph 3?</strong></p>\n<blockquote><p>下列哪项可以从第3段推断出来？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 29题题干\n\n**The author holds that George Osborne’s preference ______.**\n\n> 作者认为，乔治·奥斯本的偏好______。\n\n题型：**观点判断题**。","articleRects":[],"questionRects":[[226,1353,803,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"29"},"html":"<h2>29题题干</h2>\n<p><strong>The author holds that George Osborne’s preference ______.</strong></p>\n<blockquote><p>作者认为，乔治·奥斯本的偏好______。</p>\n</blockquote>\n<p>题型：<strong>观点判断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 30题题干\n\n**In the last paragraph, the author shows his appreciation of ______.**\n\n> 在最后一段，作者表达了对______的赞赏。\n\n题型：**段落态度对象题**。","articleRects":[],"questionRects":[[226,1720,919,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"30"},"html":"<h2>30题题干</h2>\n<p><strong>In the last paragraph, the author shows his appreciation of ______.</strong></p>\n<blockquote><p>在最后一段，作者表达了对______的赞赏。</p>\n</blockquote>\n<p>题型：<strong>段落态度对象题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | While, likewise, but |\n| 态度词／评价词 | 先抓个大概好坏 | proudest, sensible, biased |\n| 动作词 | 先看谁做了什么 | save, build, respects |\n| 结果词 | 看最后出了什么事 | support, pressure, development |\n| 重复主题词 | 大概知道老在说什么 | countryside, cities, planning |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>While, likewise, but</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>proudest, sensible, biased</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>save, build, respects</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>support, pressure, development</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>countryside, cities, planning</td></tr></tbody></table>\n"},{"section":"读文章","raw":"For the first time in history more people live in towns than in the country. In Britain this has had a **[xxx]** result. While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.","articleRects":[[273,279,1123,38],[202,322,1194,39],[202,366,1194,39],[203,410,1193,40],[202,456,246,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>For the first time in history more people live in towns than in the country. In Britain this has had a <strong>[xxx]</strong> result. While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n</div></div>"},{"section":"读文章","raw":"For the first time in history more people live in towns than in the country. / In Britain this has had a **[xxx]** result. / While polls show Britons rate “ the countryside” alongside the royal family, / Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, / this has limited political support.","articleRects":[[273,279,1123,38],[202,322,1194,39],[202,366,1194,39],[203,410,1193,40],[202,456,246,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>For the first time in history more people live 都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到历史上首次、更多的人住在城镇、民调显示英国人、这获得的政治支持有限；中间又出现创立国民信托、自然之地的美、国家公园和绿化带、混凝土吞噬更多乡村；各大政党没有一个、给予乡村开发更高优先权、自由民主党保持沉默、更审慎的方法；新住宅、工厂和办公室、在城市和城镇、且不侵占绿化带；把住房建在哪里、乔治·奥斯本偏爱乡村新建、尊重其特色、为何破坏乡村保护区；结尾还有开发应当经过规划、而非任其失控、避免它而非推动它、应让左派和右派团结起来。</p>\n<p>到这里还不能自然地说清楚：公众喜爱乡村与政党的政策有什么差别，住房需求、建设地点与乡村保护怎样相接。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"26题","raw":"## 26题\n\n> Britain’s public sentiment about the countryside ______.  \n> 英国公众对于乡村的情感______。\n\nBritain’s public sentiment about the countryside是在问英国民众对乡村的情感。第1段的polls show Britons介绍了民众怎样评价乡村，因此先读完整的第1段。\n\n> 原文参考：\n> \n> For the first time in history more people live in towns than in the country. In Britain this has had a **[xxx]** result. While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.\n> \n> 开始精读：\n> \n> For the first time in history / more people live in towns / than in the country. / In Britain / this has had a **[xxx]** result. / While polls show / Britons rate “ the countryside” / alongside the royal family, / Shakespeare and the National Health Service / (NHS) / as what makes them proudest / of their country, / this has limited political support.\n> \n> 历史上首次 / 更多的人居住在城镇 / 比住在乡下的多。 / 在英国 / 这产生了**[xxx]**的结果。 / 虽然民意调查显示 / 英国人把“乡村” / 与王室并列， / 与莎士比亚及国民医疗服务体系 / （国民医疗服务体系） / 视为最令他们自豪的事物 / 让他们为自己的国家自豪， / 这获得的政治支持有限。\n\n空格要补对公众乡村情感的描述，需检查这份情感与本段列举的事物和政治支持分别是什么关系。\n\n接下来按A—D逐项看。","articleRects":[[273,279,1123,38],[202,322,1194,39],[202,366,1194,39],[203,410,1193,40],[202,456,246,38]],"questionRects":[[226,190,755,38],[280,251,599,38],[280,312,598,38],[280,373,558,38],[280,435,499,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"26","initialReadingPids":[0]},"html":"<h2>26题</h2>\n<blockquote><p>Britain’s public sentiment about the countryside ______.<br />\n英国公众对于乡村的情感______。</p>\n</blockquote>\n<p>Britain’s public sentiment about the countryside是在问英国民众对乡村的情感。第1段的polls show Britons介绍了民众怎样评价乡村，因此先读完整的第1段。</p>\n<blockquote><p>原文参考：</p>\n<p>For the first time in history more people live in towns than in the country. In Britain this has had a <strong>[xxx]</strong> result. While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n<p>开始精读：</p>\n<p>For the first time in history / more people live in towns / than in the country. / In Britain / this has had a <strong>[xxx]</strong> result. / While polls show / Britons rate “ the countryside” / alongside the royal family, / Shakespeare and the National Health Service / (NHS) / as what makes them proudest / of their country, / this has limited political support.</p>\n<p>历史上首次 / 更多的人居住在城镇 / 比住在乡下的多。 / 在英国 / 这产生了<strong>[xxx]</strong>的结果。 / 虽然民意调查显示 / 英国人把“乡村” / 与王室并列， / 与莎士比亚及国民医疗服务体系 / （国民医疗服务体系） / 视为最令他们自豪的事物 / 让他们为自己的国家自豪， / 这获得的政治支持有限。</p>\n</blockquote>\n<p>空格要补对公众乡村情感的描述，需检查这份情感与本段列举的事物和政治支持分别是什么关系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"26题","raw":"### A. has brought much benefit to the NHS\n\n> 已给国民医疗服务体系带来很多益处。\n\n把A接回题干，它说的是：英国公众对乡村的情感已给NHS带来很多益处。\n\nA说这份乡村情感让NHS受益。第1段确实有NHS，我们回到`rate ... alongside ... as`，看它与乡村怎样相连。\n\n> While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.\n\n英国人把乡村与王室、莎士比亚、NHS并列，都视为令自己为国家自豪的事物。`alongside`在这里把几样事物放到一起评价。\n\nNHS不是接受乡村所带来好处的一方，它与乡村一样，是英国人感到自豪的对象。A却说一种情感给它带来许多益处。\n\n原句没有写NHS因此得到资金、资源或其他好处。几个事物都让人自豪，不能接成其中一个给另一个带来利益。\n\n**NHS与乡村一起被列为自豪对象，等于它因公众的乡村情感而获益吗？**\n\n不等于。原文是并列评价，A改成了乡村情感使NHS受益。\n\n**第一轮判断：A排除。**","articleRects":[[273,279,1123,38],[202,322,1194,39],[202,366,1194,39],[203,410,1193,40],[202,456,246,38]],"questionRects":[[280,251,599,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>A. has brought much benefit to the NHS</h3>\n<blockquote><p>已给国民医疗服务体系带来很多益处。</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国公众对乡村的情感已给NHS带来很多益处。</p>\n<p>A说这份乡村情感让NHS受益。第1段确实有NHS，我们回到<code>rate ... alongside ... as</code>，看它与乡村怎样相连。</p>\n<blockquote><p>While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n</blockquote>\n<p>英国人把乡村与王室、莎士比亚、NHS并列，都视为令自己为国家自豪的事物。<code>alongside</code>在这里把几样事物放到一起评价。</p>\n<p>NHS不是接受乡村所带来好处的一方，它与乡村一样，是英国人感到自豪的对象。A却说一种情感给它带来许多益处。</p>\n<p>原句没有写NHS因此得到资金、资源或其他好处。几个事物都让人自豪，不能接成其中一个给另一个带来利益。</p>\n<p><strong>NHS与乡村一起被列为自豪对象，等于它因公众的乡村情感而获益吗？</strong></p>\n<p>不等于。原文是并列评价，A改成了乡村情感使NHS受益。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"26题","raw":"### B. didn’t start till the Shakespearean age\n\n> 直到莎士比亚时代才开始。\n\n把B接回题干，它说的是：英国公众对乡村的情感直到莎士比亚时代才开始。\n\nB说这种情感始于莎士比亚时代。原文有`Shakespeare`，我们看它前后有没有表示开始时间的词。\n\n> While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.\n\n莎士比亚与王室、NHS并列，是英国人引以为豪的人或事物。它没有跟在`since`、`began`之类表示起始时间的词后。\n\nB把人物莎士比亚改成了莎士比亚时代，又说直到那个时代乡村情感才出现。这样同时多出了一段时间和一个起点。\n\n原段的民意调查说的是现在英国人怎样评价乡村，没有借这个名字追溯这份感情从何时开始。\n\n**原文提到莎士比亚，是把他列为自豪对象，还是拿他的时代说明乡村情感的起点？**\n\n是前者。B的时间起点没有出处。\n\n**第一轮判断：B排除。**","articleRects":[[273,279,1123,38],[202,322,1194,39],[202,366,1194,39],[203,410,1193,40],[202,456,246,38]],"questionRects":[[280,312,598,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>B. didn’t start till the Shakespearean age</h3>\n<blockquote><p>直到莎士比亚时代才开始。</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国公众对乡村的情感直到莎士比亚时代才开始。</p>\n<p>B说这种情感始于莎士比亚时代。原文有<code>Shakespeare</code>，我们看它前后有没有表示开始时间的词。</p>\n<blockquote><p>While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n</blockquote>\n<p>莎士比亚与王室、NHS并列，是英国人引以为豪的人或事物。它没有跟在<code>since</code>、<code>began</code>之类表示起始时间的词后。</p>\n<p>B把人物莎士比亚改成了莎士比亚时代，又说直到那个时代乡村情感才出现。这样同时多出了一段时间和一个起点。</p>\n<p>原段的民意调查说的是现在英国人怎样评价乡村，没有借这个名字追溯这份感情从何时开始。</p>\n<p><strong>原文提到莎士比亚，是把他列为自豪对象，还是拿他的时代说明乡村情感的起点？</strong></p>\n<p>是前者。B的时间起点没有出处。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"26题","raw":"### C. is fully backed by the royal family\n\n> 得到王室的充分支持。\n\n把C接回题干，它说的是：英国公众对乡村的情感得到了王室的充分支持。\n\nC说王室充分支持公众的乡村情感。我们回到`Britons rate`，看谁在评价谁。\n\n> While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.\n\n做评价的是英国民众；被并列评价的是乡村、王室、莎士比亚和NHS。王室在这里没有发表意见，也没有采取支持乡村的行动。\n\nC把王室从被评价的对象变成了支持者，并添加`fully`说支持很充分。仅凭它与乡村并列，不能得到这种支持关系。\n\n段末还说政治支持有限，但即使不拿这句来推定王室具体态度，前面的并列也已经不足以证明C。\n\n**英国人同时为王室和乡村自豪，就说明王室在充分支持这份乡村情感吗？**\n\n不说明。原文没有写王室的支持行为，C把评价对象当成了支持者。\n\n**第一轮判断：C排除。**","articleRects":[[273,279,1123,38],[202,322,1194,39],[202,366,1194,39],[203,410,1193,40],[202,456,246,38]],"questionRects":[[280,373,558,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>C. is fully backed by the royal family</h3>\n<blockquote><p>得到王室的充分支持。</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国公众对乡村的情感得到了王室的充分支持。</p>\n<p>C说王室充分支持公众的乡村情感。我们回到<code>Britons rate</code>，看谁在评价谁。</p>\n<blockquote><p>While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n</blockquote>\n<p>做评价的是英国民众；被并列评价的是乡村、王室、莎士比亚和NHS。王室在这里没有发表意见，也没有采取支持乡村的行动。</p>\n<p>C把王室从被评价的对象变成了支持者，并添加<code>fully</code>说支持很充分。仅凭它与乡村并列，不能得到这种支持关系。</p>\n<p>段末还说政治支持有限，但即使不拿这句来推定王室具体态度，前面的并列也已经不足以证明C。</p>\n<p><strong>英国人同时为王室和乡村自豪，就说明王室在充分支持这份乡村情感吗？</strong></p>\n<p>不说明。原文没有写王室的支持行为，C把评价对象当成了支持者。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"26题","raw":"### D. is not well reflected in politics\n\n> 没有在政治中得到充分体现。\n\n把D接回题干，它说的是：英国公众对乡村的情感没有在政治中充分体现。\n\nD说公众感情没在政治中充分体现。第1段`While`后写民众自豪，末尾却写`limited political support`，两半句要一起读。\n\n> While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.\n\n民意调查显示，英国人把乡村列为最值得自豪的事物之一。公众对它的重视程度很高。\n\n但后半句说政治支持有限。也就是说，民众很看重乡村，政治上的支持却没有同样充分跟上。\n\nD的`not well reflected`没有说毫无政治支持，只说没有充分体现，正能接上`limited`所说的有限。\n\n**公众很为乡村自豪，但政治支持有限，能否说这种情感没有在政治中充分体现？**\n\n能。D保留了两半句之间的落差，也没有把有限说成完全没有。\n\n**第一轮判断：D保留。**","articleRects":[[273,279,1123,38],[202,322,1194,39],[202,366,1194,39],[203,410,1193,40],[202,456,246,38]],"questionRects":[[280,435,499,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"26","paragraphPids":[0]},"html":"<h3>D. is not well reflected in politics</h3>\n<blockquote><p>没有在政治中得到充分体现。</p>\n</blockquote>\n<p>把D接回题干，它说的是：英国公众对乡村的情感没有在政治中充分体现。</p>\n<p>D说公众感情没在政治中充分体现。第1段<code>While</code>后写民众自豪，末尾却写<code>limited political support</code>，两半句要一起读。</p>\n<blockquote><p>While polls show Britons rate “ the countryside” alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.</p>\n</blockquote>\n<p>民意调查显示，英国人把乡村列为最值得自豪的事物之一。公众对它的重视程度很高。</p>\n<p>但后半句说政治支持有限。也就是说，民众很看重乡村，政治上的支持却没有同样充分跟上。</p>\n<p>D的<code>not well reflected</code>没有说毫无政治支持，只说没有充分体现，正能接上<code>limited</code>所说的有限。</p>\n<p><strong>公众很为乡村自豪，但政治支持有限，能否说这种情感没有在政治中充分体现？</strong></p>\n<p>能。D保留了两半句之间的落差，也没有把有限说成完全没有。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"26题","raw":"### 26题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一次保留D。原文的民众自豪感与有限政治支持之间存在落差，能够说明这份情感未在政治中充分体现。","articleRects":[],"questionRects":[[226,190,755,38],[280,251,599,38],[280,312,598,38],[280,373,558,38],[280,435,499,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"26"},"html":"<h3>26题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一次保留D。原文的民众自豪感与有限政治支持之间存在落差，能够说明这份情感未在政治中充分体现。</p>\n"},{"section":"27题","raw":"## 27题\n\n> According to Paragraph 2, the achievements of the National Trust are now being ______.  \n> 根据第2段，国民信托的成果现在正被______。\n\n题干直接指定Paragraph 2及the National Trust。先将第2段的创立目的、后来取得的成果和现在的变化完整读完。\n\n> 原文参考：\n> \n> A century ago Octavia Hill launched the National Trust not to rescue **[xxx]** houses but to save “the beauty of natural places for everyone forever.” It was specifically to provide city **[xxx]** with spaces for **[xxx]** where they could experience “a **[xxx]** air. ” Hill’s pressure later led to the creation of national parks and green belts. They don’t make countryside any more, and every year concrete consumes more of it. It needs constant **[xxx]**.\n> \n> 开始精读：\n> \n> A century ago / Octavia Hill launched the National Trust / not to rescue **[xxx]** houses / but to save / “the beauty of natural places / for everyone forever.” / It was specifically to provide / city **[xxx]** / with spaces for **[xxx]** / where they could experience / “a **[xxx]** air. ” / Hill’s pressure later led / to the creation of national parks / and green belts. / They don’t make countryside any more, / and every year / concrete consumes more of it. / It needs constant **[xxx]**.\n> \n> 一个世纪以前 / 奥克塔维娅·希尔创立国民信托 / 并非为了拯救**[xxx]**的房屋 / 而是为了保存 / “自然之地的美 / 永远让每个人享有。” / 具体而言是为了提供 / 给城市的**[xxx]** / 用于**[xxx]**的空间 / 在那里他们能够体验 / “一种**[xxx]**的空气。” / 希尔施加的压力后来促成 / 国家公园的建立 / 以及绿化带的建立。 / 乡村不会再被制造出来， / 而且每一年 / 混凝土吞噬更多乡村。 / 它需要持续的**[xxx]**。\n\nachievements要落到该组织保存自然空间的成果，now being则要求判断这些成果当下经历的变化，须区分早期目的与当前状况。\n\n接下来按A—D逐项看。","articleRects":[[274,501,1122,37],[202,544,1194,39],[203,589,1193,38],[202,632,1194,40],[202,678,1195,38],[202,723,911,37]],"questionRects":[[226,557,1180,38],[280,619,83,37],[280,680,334,37],[280,741,358,37],[280,802,313,38],[280,863,365,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"27","initialReadingPids":[1]},"html":"<h2>27题</h2>\n<blockquote><p>According to Paragraph 2, the achievements of the National Trust are now being ______.<br />\n根据第2段，国民信托的成果现在正被______。</p>\n</blockquote>\n<p>题干直接指定Paragraph 2及the National Trust。先将第2段的创立目的、后来取得的成果和现在的变化完整读完。</p>\n<blockquote><p>原文参考：</p>\n<p>A century ago Octavia Hill launched the National Trust not to rescue <strong>[xxx]</strong> houses but to save “the beauty of natural places for everyone forever.” It was specifically to provide city <strong>[xxx]</strong> with spaces for <strong>[xxx]</strong> where they could experience “a <strong>[xxx]</strong> air. ” Hill’s pressure later led to the creation of national parks and green belts. They don’t make countryside any more, and every year concrete consumes more of it. It needs constant <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>A century ago / Octavia Hill launched the National Trust / not to rescue <strong>[xxx]</strong> houses / but to save / “the beauty of natural places / for everyone forever.” / It was specifically to provide / city <strong>[xxx]</strong> / with spaces for <strong>[xxx]</strong> / where they could experience / “a <strong>[xxx]</strong> air. ” / Hill’s pressure later led / to the creation of national parks / and green belts. / They don’t make countryside any more, / and every year / concrete consumes more of it. / It needs constant <strong>[xxx]</strong>.</p>\n<p>一个世纪以前 / 奥克塔维娅·希尔创立国民信托 / 并非为了拯救<strong>[xxx]</strong>的房屋 / 而是为了保存 / “自然之地的美 / 永远让每个人享有。” / 具体而言是为了提供 / 给城市的<strong>[xxx]</strong> / 用于<strong>[xxx]</strong>的空间 / 在那里他们能够体验 / “一种<strong>[xxx]</strong>的空气。” / 希尔施加的压力后来促成 / 国家公园的建立 / 以及绿化带的建立。 / 乡村不会再被制造出来， / 而且每一年 / 混凝土吞噬更多乡村。 / 它需要持续的<strong>[xxx]</strong>。</p>\n</blockquote>\n<p>achievements要落到该组织保存自然空间的成果，now being则要求判断这些成果当下经历的变化，须区分早期目的与当前状况。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"27题","raw":"### A. gradually destroyed\n\n> 逐渐遭到破坏。\n\n把A接回题干，它说的是：国民信托保存自然空间的成果现在正逐渐遭到破坏。\n\nA说成果逐渐被破坏。第2段先写建成国家公园和绿化带，后写`every year concrete consumes more`，我们按时间接起来。\n\n> Hill’s pressure later led to the creation of national parks and green belts.\n\n> They don’t make countryside any more, and every year concrete consumes more of it.\n\n国民信托要保存自然之美，希尔的推动又促成国家公园、绿化带。这些是已取得的保护成果。\n\n接着却说，每年混凝土都吞噬更多乡村。这里不是混凝土真的吃东西，而是建设用地不断占用本来要保存的自然空间。\n\n`every year`和`more`写出持续发生、范围增加。A的`gradually destroyed`正概括这些自然空间并未保住，反而逐步受到侵占。\n\n**原本要保存的乡村，每年都有更多被混凝土占用，能否说保护成果正在逐步受损？**\n\n能。A对应持续侵占带来的破坏。\n\n**第一轮判断：A保留。**","articleRects":[[274,501,1122,37],[202,544,1194,39],[203,589,1193,38],[202,632,1194,40],[202,678,1195,38],[202,723,911,37]],"questionRects":[[280,680,334,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"27","paragraphPids":[1]},"html":"<h3>A. gradually destroyed</h3>\n<blockquote><p>逐渐遭到破坏。</p>\n</blockquote>\n<p>把A接回题干，它说的是：国民信托保存自然空间的成果现在正逐渐遭到破坏。</p>\n<p>A说成果逐渐被破坏。第2段先写建成国家公园和绿化带，后写<code>every year concrete consumes more</code>，我们按时间接起来。</p>\n<blockquote><p>Hill’s pressure later led to the creation of national parks and green belts.</p>\n</blockquote>\n<blockquote><p>They don’t make countryside any more, and every year concrete consumes more of it.</p>\n</blockquote>\n<p>国民信托要保存自然之美，希尔的推动又促成国家公园、绿化带。这些是已取得的保护成果。</p>\n<p>接着却说，每年混凝土都吞噬更多乡村。这里不是混凝土真的吃东西，而是建设用地不断占用本来要保存的自然空间。</p>\n<p><code>every year</code>和<code>more</code>写出持续发生、范围增加。A的<code>gradually destroyed</code>正概括这些自然空间并未保住，反而逐步受到侵占。</p>\n<p><strong>原本要保存的乡村，每年都有更多被混凝土占用，能否说保护成果正在逐步受损？</strong></p>\n<p>能。A对应持续侵占带来的破坏。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"27题","raw":"### B. effectively reinforced\n\n> 得到有效巩固。\n\n把B接回题干，它说的是：国民信托保存自然空间的成果现在正得到有效巩固。\n\nB说成果被有效巩固。原文当前变化是`concrete consumes more of it`，我们看留下的乡村是在增加还是减少。\n\n> They don’t make countryside any more, and every year concrete consumes more of it.\n\n`it`接乡村，混凝土每年消耗更多乡村，意味着被建设占用的自然空间不断增加。\n\n巩固成果应该是保存的空间更稳固、更有保障；这里却写它仍在流失。B不能只依据前面曾建公园、绿化带，就忽略后面的当前变化。\n\n题干的`now`要求回答现在，早年的成果不是“现在得到巩固”的证明。\n\n**每年都有更多乡村被占用，是巩固保护成果，还是使成果继续流失？**\n\n是继续流失。B与当前变化相反。\n\n**第一轮判断：B排除。**","articleRects":[[274,501,1122,37],[202,544,1194,39],[203,589,1193,38],[202,632,1194,40],[202,678,1195,38],[202,723,911,37]],"questionRects":[[280,741,358,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>B. effectively reinforced</h3>\n<blockquote><p>得到有效巩固。</p>\n</blockquote>\n<p>把B接回题干，它说的是：国民信托保存自然空间的成果现在正得到有效巩固。</p>\n<p>B说成果被有效巩固。原文当前变化是<code>concrete consumes more of it</code>，我们看留下的乡村是在增加还是减少。</p>\n<blockquote><p>They don’t make countryside any more, and every year concrete consumes more of it.</p>\n</blockquote>\n<p><code>it</code>接乡村，混凝土每年消耗更多乡村，意味着被建设占用的自然空间不断增加。</p>\n<p>巩固成果应该是保存的空间更稳固、更有保障；这里却写它仍在流失。B不能只依据前面曾建公园、绿化带，就忽略后面的当前变化。</p>\n<p>题干的<code>now</code>要求回答现在，早年的成果不是“现在得到巩固”的证明。</p>\n<p><strong>每年都有更多乡村被占用，是巩固保护成果，还是使成果继续流失？</strong></p>\n<p>是继续流失。B与当前变化相反。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"27题","raw":"### C. properly protected\n\n> 得到妥善保护。\n\n把C接回题干，它说的是：国民信托保存自然空间的成果现在正得到妥善保护。\n\nC说成果得到妥善保护。第2段开头有`save ... forever`，但那是创立时的目的，我们要接着看后面的现实。\n\n> but to save “the beauty of natural places for everyone forever.”\n\n> They don’t make countryside any more, and every year concrete consumes more of it.\n\n希尔想永久保存自然之美，这说明组织希望实现什么。后面建起国家公园和绿化带，是曾经取得的成果。\n\n可是作者随后写，乡村不会被重新制造出来，每年混凝土还在吞噬更多。这种提醒说明自然空间并没有因此一直得到保障。\n\nC把早先的保护愿望当成现在已经实现的状态，漏掉了目的之后的转折。\n\n**过去希望永远保存自然之美，是否证明今天的这些空间已被妥善保护？**\n\n不能。作者紧接着写它们仍在遭到占用，C没有接上现在的状况。\n\n**第一轮判断：C排除。**","articleRects":[[274,501,1122,37],[202,544,1194,39],[203,589,1193,38],[202,632,1194,40],[202,678,1195,38],[202,723,911,37]],"questionRects":[[280,802,313,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>C. properly protected</h3>\n<blockquote><p>得到妥善保护。</p>\n</blockquote>\n<p>把C接回题干，它说的是：国民信托保存自然空间的成果现在正得到妥善保护。</p>\n<p>C说成果得到妥善保护。第2段开头有<code>save ... forever</code>，但那是创立时的目的，我们要接着看后面的现实。</p>\n<blockquote><p>but to save “the beauty of natural places for everyone forever.”</p>\n</blockquote>\n<blockquote><p>They don’t make countryside any more, and every year concrete consumes more of it.</p>\n</blockquote>\n<p>希尔想永久保存自然之美，这说明组织希望实现什么。后面建起国家公园和绿化带，是曾经取得的成果。</p>\n<p>可是作者随后写，乡村不会被重新制造出来，每年混凝土还在吞噬更多。这种提醒说明自然空间并没有因此一直得到保障。</p>\n<p>C把早先的保护愿望当成现在已经实现的状态，漏掉了目的之后的转折。</p>\n<p><strong>过去希望永远保存自然之美，是否证明今天的这些空间已被妥善保护？</strong></p>\n<p>不能。作者紧接着写它们仍在遭到占用，C没有接上现在的状况。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"27题","raw":"### D. largely overshadowed\n\n> 在很大程度上黯然失色。\n\n把D接回题干，它说的是：国民信托保存自然空间的成果现在在很大程度上黯然失色。\n\nD说成果黯然失色，原文写的却是`consumes more of it`。我们看这里说的是成果的名气，还是自然空间本身。\n\n> They don’t make countryside any more, and every year concrete consumes more of it.\n\n混凝土占用的是乡村土地，原来保存的自然空间正在减少。这是成果本身受损。\n\n`overshadowed`通常说被别的事物盖过、显得不那么突出。若这里要说成果黯然失色，得有某种东西使人不再注意或重视它；本句写出的并非这种比较。\n\n乡村被占掉，不能轻轻改成成果不够显眼。A说逐渐破坏，比D更直接接住实际发生的占用。\n\n**混凝土吞噬乡村，说的是保护成果不再显眼，还是成果所保存的空间被破坏？**\n\n是空间被破坏。D没有说出这种实际损失。\n\n**第一轮判断：D排除。**","articleRects":[[274,501,1122,37],[202,544,1194,39],[203,589,1193,38],[202,632,1194,40],[202,678,1195,38],[202,723,911,37]],"questionRects":[[280,863,365,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>D. largely overshadowed</h3>\n<blockquote><p>在很大程度上黯然失色。</p>\n</blockquote>\n<p>把D接回题干，它说的是：国民信托保存自然空间的成果现在在很大程度上黯然失色。</p>\n<p>D说成果黯然失色，原文写的却是<code>consumes more of it</code>。我们看这里说的是成果的名气，还是自然空间本身。</p>\n<blockquote><p>They don’t make countryside any more, and every year concrete consumes more of it.</p>\n</blockquote>\n<p>混凝土占用的是乡村土地，原来保存的自然空间正在减少。这是成果本身受损。</p>\n<p><code>overshadowed</code>通常说被别的事物盖过、显得不那么突出。若这里要说成果黯然失色，得有某种东西使人不再注意或重视它；本句写出的并非这种比较。</p>\n<p>乡村被占掉，不能轻轻改成成果不够显眼。A说逐渐破坏，比D更直接接住实际发生的占用。</p>\n<p><strong>混凝土吞噬乡村，说的是保护成果不再显眼，还是成果所保存的空间被破坏？</strong></p>\n<p>是空间被破坏。D没有说出这种实际损失。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"27题","raw":"### 27题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一次保留A。混凝土每年吞噬更多乡村，表现的是保存自然空间的成果持续受到破坏。","articleRects":[],"questionRects":[[226,557,1180,38],[280,619,83,37],[280,680,334,37],[280,741,358,37],[280,802,313,38],[280,863,365,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"27"},"html":"<h3>27题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一次保留A。混凝土每年吞噬更多乡村，表现的是保存自然空间的成果持续受到破坏。</p>\n"},{"section":"28题","raw":"## 28题\n\n> Which of the following can be inferred from Paragraph 3?  \n> 下列哪项可以从第3段推断出来？\n\n题干明确指定Paragraph 3，先从段首到段尾读完各个政党对乡村开发及保护的表态。\n\n> 原文参考：\n> \n> At the next election none of the big parties seem likely to endorse this sentiment. The Conservatives’ planning reform **[xxx]** gives rural development priority over conservation, even authorising “off-plan” building where local people might object. The concept of **[xxx]** development has been defined as profitable. Labour likewise wants to discontinue local planning where councils oppose development. The Liberal Democrats are silent. Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land. Its Campaign to Protect Rural England struck terror into many local Conservative parties.\n> \n> 开始精读：\n> \n> At the next election / none of the big parties / seem likely to endorse this sentiment. / The Conservatives’ planning reform **[xxx]** / gives rural development priority over conservation, / even authorising “off-plan” building / where local people might object. / The concept of **[xxx]** development / has been defined as profitable. / Labour likewise wants to discontinue / local planning / where councils oppose development. / The Liberal Democrats are silent. / Only Ukip, sensing its chance, / has sided with those pleading / for a more considered approach / to using green land. / Its Campaign to Protect Rural England / struck terror / into many local Conservative parties.\n> \n> 在下次选举中 / 各大政党没有一个 / 看起来可能支持这种情感。 / 保守党的规划改革**[xxx]** / 给予乡村开发高于保护的优先权， / 甚至批准“计划外”的建设 / 在当地人可能反对的地方。 / **[xxx]**发展的概念 / 被定义为有利可图。 / 工党同样希望停止 / 地方规划 / 在议会反对开发的地方。 / 自由民主党保持沉默。 / 只有英国独立党察觉到机会， / 站到了那些呼吁者一边 / 要求采用更审慎的方法 / 来使用绿地。 / 其保护英格兰乡村的运动 / 引发了恐惧 / 在许多地方保守党组织中。\n\ncan be inferred要求从本段具体表态推断，须核对每种立场属于哪个政党，以及这些立场与政治处境有什么联系。\n\n接下来按A—D逐项看。","articleRects":[[273,767,1123,38],[203,811,1193,38],[202,854,1193,39],[202,900,1194,38],[202,944,1194,38],[202,989,1194,38],[202,1033,1194,38],[202,1078,1194,37],[202,1122,304,38]],"questionRects":[[226,986,913,38],[280,1047,776,38],[280,1107,828,39],[280,1169,844,38],[280,1231,821,37]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2],"qid":"28","initialReadingPids":[2]},"html":"<h2>28题</h2>\n<blockquote><p>Which of the following can be inferred from Paragraph 3?<br />\n下列哪项可以从第3段推断出来？</p>\n</blockquote>\n<p>题干明确指定Paragraph 3，先从段首到段尾读完各个政党对乡村开发及保护的表态。</p>\n<blockquote><p>原文参考：</p>\n<p>At the next election none of the big parties seem likely to endorse this sentiment. The Conservatives’ planning reform <strong>[xxx]</strong> gives rural development priority over conservation, even authorising “off-plan” building where local people might object. The concept of <strong>[xxx]</strong> development has been defined as profitable. Labour likewise wants to discontinue local planning where councils oppose development. The Liberal Democrats are silent. Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land. Its Campaign to Protect Rural England struck terror into many local Conservative parties.</p>\n<p>开始精读：</p>\n<p>At the next election / none of the big parties / seem likely to endorse this sentiment. / The Conservatives’ planning reform <strong>[xxx]</strong> / gives rural development priority over conservation, / even authorising “off-plan” building / where local people might object. / The concept of <strong>[xxx]</strong> development / has been defined as profitable. / Labour likewise wants to discontinue / local planning / where councils oppose development. / The Liberal Democrats are silent. / Only Ukip, sensing its chance, / has sided with those pleading / for a more considered approach / to using green land. / Its Campaign to Protect Rural England / struck terror / into many local Conservative parties.</p>\n<p>在下次选举中 / 各大政党没有一个 / 看起来可能支持这种情感。 / 保守党的规划改革<strong>[xxx]</strong> / 给予乡村开发高于保护的优先权， / 甚至批准“计划外”的建设 / 在当地人可能反对的地方。 / <strong>[xxx]</strong>发展的概念 / 被定义为有利可图。 / 工党同样希望停止 / 地方规划 / 在议会反对开发的地方。 / 自由民主党保持沉默。 / 只有英国独立党察觉到机会， / 站到了那些呼吁者一边 / 要求采用更审慎的方法 / 来使用绿地。 / 其保护英格兰乡村的运动 / 引发了恐惧 / 在许多地方保守党组织中。</p>\n</blockquote>\n<p>can be inferred要求从本段具体表态推断，须核对每种立场属于哪个政党，以及这些立场与政治处境有什么联系。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"28题","raw":"### A. Labour is under attack for opposing development.\n\n> 工党因反对开发而受到攻击。\n\n把A接回题干，它说的是：工党因反对开发而受到攻击。\n\nA说工党反对开发而遭到攻击。第3段同时出现`Labour`、`councils`和`oppose`，我们先找出`oppose`的主语。\n\n> Labour likewise wants to discontinue local planning where councils oppose development.\n\n反对开发的是`councils`，地方议会。工党想做的却是，在这些议会反对开发的地方停止地方规划。\n\n所以，工党不是这里反对开发的一方。A把议会的立场挪到工党身上，又加上工党因此受到攻击。\n\n原句既没有这样描述工党的立场，也没有写这一攻击。不能见到同一句里有工党和反对，就把两者直接接起来。\n\n**原句明确反对开发的是工党，还是地方议会？**\n\n是地方议会。A把主语换了，也加了未出现的攻击。\n\n**第一轮判断：A排除。**","articleRects":[[273,767,1123,38],[203,811,1193,38],[202,854,1193,39],[202,900,1194,38],[202,944,1194,38],[202,989,1194,38],[202,1033,1194,38],[202,1078,1194,37],[202,1122,304,38]],"questionRects":[[280,1047,776,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"28","paragraphPids":[2]},"html":"<h3>A. Labour is under attack for opposing development.</h3>\n<blockquote><p>工党因反对开发而受到攻击。</p>\n</blockquote>\n<p>把A接回题干，它说的是：工党因反对开发而受到攻击。</p>\n<p>A说工党反对开发而遭到攻击。第3段同时出现<code>Labour</code>、<code>councils</code>和<code>oppose</code>，我们先找出<code>oppose</code>的主语。</p>\n<blockquote><p>Labour likewise wants to discontinue local planning where councils oppose development.</p>\n</blockquote>\n<p>反对开发的是<code>councils</code>，地方议会。工党想做的却是，在这些议会反对开发的地方停止地方规划。</p>\n<p>所以，工党不是这里反对开发的一方。A把议会的立场挪到工党身上，又加上工党因此受到攻击。</p>\n<p>原句既没有这样描述工党的立场，也没有写这一攻击。不能见到同一句里有工党和反对，就把两者直接接起来。</p>\n<p><strong>原句明确反对开发的是工党，还是地方议会？</strong></p>\n<p>是地方议会。A把主语换了，也加了未出现的攻击。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"28题","raw":"### B. The Conservatives may abandon “off-plan” building.\n\n> 保守党可能放弃“计划外”建设。\n\n把B接回题干，它说的是：保守党可能放弃“计划外”建设。\n\nB说保守党可能放弃计划外建设。原文的`authorising “off-plan” building`直接说了它对这种建设的做法。\n\n> The Conservatives’ planning reform **[xxx]** gives rural development priority over conservation, even authorising “off-plan” building where local people might object.\n\n保守党的改革优先考虑乡村开发，甚至在当地人可能反对的地方授权计划外建设。`even`把这种允许进一步强调出来。\n\nB却说可能放弃它。当地人反对，并没有在这句中导致保守党取消授权；作者反而说即便可能反对仍予以授权。\n\n不能根据存在反对者，就替保守党推断之后会改变主意。原文给出的行动是允许。\n\n**当地人可能反对时，原文说保守党仍授权建设，还是已经露出放弃建设的打算？**\n\n是仍授权建设。B的放弃没有依据。\n\n**第一轮判断：B排除。**","articleRects":[[273,767,1123,38],[203,811,1193,38],[202,854,1193,39],[202,900,1194,38],[202,944,1194,38],[202,989,1194,38],[202,1033,1194,38],[202,1078,1194,37],[202,1122,304,38]],"questionRects":[[280,1107,828,39]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"28","paragraphPids":[2]},"html":"<h3>B. The Conservatives may abandon “off-plan” building.</h3>\n<blockquote><p>保守党可能放弃“计划外”建设。</p>\n</blockquote>\n<p>把B接回题干，它说的是：保守党可能放弃“计划外”建设。</p>\n<p>B说保守党可能放弃计划外建设。原文的<code>authorising “off-plan” building</code>直接说了它对这种建设的做法。</p>\n<blockquote><p>The Conservatives’ planning reform <strong>[xxx]</strong> gives rural development priority over conservation, even authorising “off-plan” building where local people might object.</p>\n</blockquote>\n<p>保守党的改革优先考虑乡村开发，甚至在当地人可能反对的地方授权计划外建设。<code>even</code>把这种允许进一步强调出来。</p>\n<p>B却说可能放弃它。当地人反对，并没有在这句中导致保守党取消授权；作者反而说即便可能反对仍予以授权。</p>\n<p>不能根据存在反对者，就替保守党推断之后会改变主意。原文给出的行动是允许。</p>\n<p><strong>当地人可能反对时，原文说保守党仍授权建设，还是已经露出放弃建设的打算？</strong></p>\n<p>是仍授权建设。B的放弃没有依据。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"28题","raw":"### C. Ukip may gain from its support for rural conservation.\n\n> 英国独立党可能从支持乡村保护中获益。\n\n把C接回题干，它说的是：英国独立党可能从支持乡村保护中获益。\n\nC说独立党可能因支持乡村保护获益。它所在的句子有`sensing its chance`，后面还写保守党恐惧，我们把前后连起来。\n\n> Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land.\n\n> Its Campaign to Protect Rural England struck terror into many local Conservative parties.\n\n独立党察觉到机会，于是站到要求审慎使用绿地的人那边。这里不只是赞成一种理念，还明确把它看成自己的机会。\n\n保护乡村的运动又让许多地方保守党组织感到恐惧，说明对手已经感到这一做法可能带来竞争压力。\n\nC说`may gain`，只是可能获益，没有宣布它已经赢得选举。察觉机会和使对手担忧，都能支持这项可能性。\n\n**独立党看到机会、支持保护后又让对手紧张，能否推断它可能从这种支持中获益？**\n\n能。C的可能性没有超出这两处描写。\n\n**第一轮判断：C保留。**","articleRects":[[273,767,1123,38],[203,811,1193,38],[202,854,1193,39],[202,900,1194,38],[202,944,1194,38],[202,989,1194,38],[202,1033,1194,38],[202,1078,1194,37],[202,1122,304,38]],"questionRects":[[280,1169,844,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"28","paragraphPids":[2]},"html":"<h3>C. Ukip may gain from its support for rural conservation.</h3>\n<blockquote><p>英国独立党可能从支持乡村保护中获益。</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国独立党可能从支持乡村保护中获益。</p>\n<p>C说独立党可能因支持乡村保护获益。它所在的句子有<code>sensing its chance</code>，后面还写保守党恐惧，我们把前后连起来。</p>\n<blockquote><p>Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land.</p>\n</blockquote>\n<blockquote><p>Its Campaign to Protect Rural England struck terror into many local Conservative parties.</p>\n</blockquote>\n<p>独立党察觉到机会，于是站到要求审慎使用绿地的人那边。这里不只是赞成一种理念，还明确把它看成自己的机会。</p>\n<p>保护乡村的运动又让许多地方保守党组织感到恐惧，说明对手已经感到这一做法可能带来竞争压力。</p>\n<p>C说<code>may gain</code>，只是可能获益，没有宣布它已经赢得选举。察觉机会和使对手担忧，都能支持这项可能性。</p>\n<p><strong>独立党看到机会、支持保护后又让对手紧张，能否推断它可能从这种支持中获益？</strong></p>\n<p>能。C的可能性没有超出这两处描写。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"28题","raw":"### D. The Liberal Democrats are losing political influence.\n\n> 自由民主党正在失去政治影响力。\n\n把D接回题干，它说的是：自由民主党正在失去政治影响力。\n\nD说自由民主党正在失去影响力。原文写它的只有`are silent`，我们看沉默是否已经说明影响力变化。\n\n> The Liberal Democrats are silent.\n\n`silent`说这个政党没有就此表态。它没有告诉我们这个党以前有多少支持、现在少了多少，也没有写选民因此离开。\n\n沉默可能出于许多原因，不能单凭这一行为确定它的政治影响正在下降。\n\nD的`losing`需要一个从原来到现在的变化，原句只有当前没有表态的事实，两者不能直接画等号。\n\n**这次没有表态，就足以说明该党的政治影响力正在减弱吗？**\n\n不足以。原文没有给出影响力下降的比较或结果。\n\n**第一轮判断：D排除。**","articleRects":[[273,767,1123,38],[203,811,1193,38],[202,854,1193,39],[202,900,1194,38],[202,944,1194,38],[202,989,1194,38],[202,1033,1194,38],[202,1078,1194,37],[202,1122,304,38]],"questionRects":[[280,1231,821,37]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"28","paragraphPids":[2]},"html":"<h3>D. The Liberal Democrats are losing political influence.</h3>\n<blockquote><p>自由民主党正在失去政治影响力。</p>\n</blockquote>\n<p>把D接回题干，它说的是：自由民主党正在失去政治影响力。</p>\n<p>D说自由民主党正在失去影响力。原文写它的只有<code>are silent</code>，我们看沉默是否已经说明影响力变化。</p>\n<blockquote><p>The Liberal Democrats are silent.</p>\n</blockquote>\n<p><code>silent</code>说这个政党没有就此表态。它没有告诉我们这个党以前有多少支持、现在少了多少，也没有写选民因此离开。</p>\n<p>沉默可能出于许多原因，不能单凭这一行为确定它的政治影响正在下降。</p>\n<p>D的<code>losing</code>需要一个从原来到现在的变化，原句只有当前没有表态的事实，两者不能直接画等号。</p>\n<p><strong>这次没有表态，就足以说明该党的政治影响力正在减弱吗？</strong></p>\n<p>不足以。原文没有给出影响力下降的比较或结果。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"28题","raw":"### 28题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一次保留C。英国独立党察觉到机会、支持审慎使用绿地，且让地方保守党组织感到恐惧，可以推出它可能获益。","articleRects":[],"questionRects":[[226,986,913,38],[280,1047,776,38],[280,1107,828,39],[280,1169,844,38],[280,1231,821,37]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"28"},"html":"<h3>28题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一次保留C。英国独立党察觉到机会、支持审慎使用绿地，且让地方保守党组织感到恐惧，可以推出它可能获益。</p>\n"},{"section":"29题","raw":"## 29题\n\n> The author holds that George Osborne’s preference ______.  \n> 作者认为，乔治·奥斯本的偏好______。\n\nGeorge Osborne直接出现在第5段的George Osborne favours一句，后面还有He favours及作者的评价。先将这个自然段完整读完。\n\n> 原文参考：\n> \n> The idea that “housing crisis” equals “concreted **[xxx]**” is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban **[xxx]** and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?\n> \n> 开始精读：\n> \n> The idea that “housing crisis” / equals “concreted **[xxx]**” / is pure lobby talk. / The issue is not the need / for more houses / but, as always, / where to put them. / Under lobby pressure, / George Osborne favours rural new-build / against urban **[xxx]** and renewal. / He favours out-of-town shopping sites / against high streets. / This is not a free market / but a biased one. / Rural towns and villages have grown / and will always grow. / They do so best / where building sticks to their edges / and respects their character. / We do not ruin / urban conservation areas. / Why ruin rural ones?\n> \n> 认为“住房危机” / 等于“被混凝土覆盖的**[xxx]**” / 纯粹是游说者的话。 / 问题不在于需求 / 对更多住房的需求 / 而是一如既往地 / 把住房建在哪里。 / 在游说压力下， / 乔治·奥斯本偏爱乡村新建房屋 / 而非城市的**[xxx]**和更新。 / 他偏爱城外的购物场所 / 而非商业大街。 / 这不是一个自由市场 / 而是一个偏向一方的市场。 / 乡间城镇和村庄一直在发展 / 也将一直发展。 / 它们发展得最好 / 是在建筑紧贴其边缘时 / 并且尊重其特色。 / 我们不破坏 / 城市保护区。 / 为什么要破坏乡村保护区？\n\n本题要判断作者如何评价George Osborne’s preference。要把奥斯本偏向怎样建设，与作者认为建设应遵循什么要求区分开。\n\n接下来按A—D逐项看。","articleRects":[[273,1387,1123,39],[202,1432,1194,38],[202,1477,1194,38],[202,1521,1194,38],[203,1566,1193,37],[202,1610,1194,38],[202,1654,1194,38],[202,1699,164,34]],"questionRects":[[226,1353,803,38],[281,1414,713,38],[280,1475,791,38],[280,1537,764,37],[280,1598,740,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"29","initialReadingPids":[4]},"html":"<h2>29题</h2>\n<blockquote><p>The author holds that George Osborne’s preference ______.<br />\n作者认为，乔治·奥斯本的偏好______。</p>\n</blockquote>\n<p>George Osborne直接出现在第5段的George Osborne favours一句，后面还有He favours及作者的评价。先将这个自然段完整读完。</p>\n<blockquote><p>原文参考：</p>\n<p>The idea that “housing crisis” equals “concreted <strong>[xxx]</strong>” is pure lobby talk. The issue is not the need for more houses but, as always, where to put them. Under lobby pressure, George Osborne favours rural new-build against urban <strong>[xxx]</strong> and renewal. He favours out-of-town shopping sites against high streets. This is not a free market but a biased one. Rural towns and villages have grown and will always grow. They do so best where building sticks to their edges and respects their character. We do not ruin urban conservation areas. Why ruin rural ones?</p>\n<p>开始精读：</p>\n<p>The idea that “housing crisis” / equals “concreted <strong>[xxx]</strong>” / is pure lobby talk. / The issue is not the need / for more houses / but, as always, / where to put them. / Under lobby pressure, / George Osborne favours rural new-build / against urban <strong>[xxx]</strong> and renewal. / He favours out-of-town shopping sites / against high streets. / This is not a free market / but a biased one. / Rural towns and villages have grown / and will always grow. / They do so best / where building sticks to their edges / and respects their character. / We do not ruin / urban conservation areas. / Why ruin rural ones?</p>\n<p>认为“住房危机” / 等于“被混凝土覆盖的<strong>[xxx]</strong>” / 纯粹是游说者的话。 / 问题不在于需求 / 对更多住房的需求 / 而是一如既往地 / 把住房建在哪里。 / 在游说压力下， / 乔治·奥斯本偏爱乡村新建房屋 / 而非城市的<strong>[xxx]</strong>和更新。 / 他偏爱城外的购物场所 / 而非商业大街。 / 这不是一个自由市场 / 而是一个偏向一方的市场。 / 乡间城镇和村庄一直在发展 / 也将一直发展。 / 它们发展得最好 / 是在建筑紧贴其边缘时 / 并且尊重其特色。 / 我们不破坏 / 城市保护区。 / 为什么要破坏乡村保护区？</p>\n</blockquote>\n<p>本题要判断作者如何评价George Osborne’s preference。要把奥斯本偏向怎样建设，与作者认为建设应遵循什么要求区分开。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"29题","raw":"### A. reveals a strong prejudice against urban areas\n\n> 显露出对城市地区的强烈偏见。\n\n把A接回题干，它说的是：作者认为奥斯本的偏好显露出对城市地区的强烈偏见。\n\nA说对城市有强烈偏见。第5段两次`favours ... against ...`都让城市一边不被偏爱，随后还有`biased`，我们先把这些句子接起来。\n\n> Under lobby pressure, George Osborne favours rural new-build against urban **[xxx]** and renewal.\n\n> He favours out-of-town shopping sites against high streets.\n\n> This is not a free market but a biased one.\n\n奥斯本偏向乡村新建，不偏向城市更新；又偏向城外购物场所，不偏向城市商业大街。两次取舍都把建设机会放到城外。\n\n作者随后说这不是自由市场，而是有偏向的市场。这样读，A所说的对城市不公，确实容易和这两次选择联系起来。\n\n但`biased`直接评价的是市场。它是不是就等于对城市地区本身有`strong prejudice`，还要看作者后面到底在担心什么。先把A留下，不把两个词看成已经完全相等。\n\n**两次取舍都不偏爱城市，再加上有偏向的评价，能否先考虑A的理解？**\n\n可以先考虑。但偏向某种建设与对城市本身的强烈偏见是否相同，仍需回查。\n\n**第一轮判断：A保留。**","articleRects":[[273,1387,1123,39],[202,1432,1194,38],[202,1477,1194,38],[202,1521,1194,38],[203,1566,1193,37],[202,1610,1194,38],[202,1654,1194,38],[202,1699,164,34]],"questionRects":[[281,1414,713,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"29","paragraphPids":[4]},"html":"<h3>A. reveals a strong prejudice against urban areas</h3>\n<blockquote><p>显露出对城市地区的强烈偏见。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为奥斯本的偏好显露出对城市地区的强烈偏见。</p>\n<p>A说对城市有强烈偏见。第5段两次<code>favours ... against ...</code>都让城市一边不被偏爱，随后还有<code>biased</code>，我们先把这些句子接起来。</p>\n<blockquote><p>Under lobby pressure, George Osborne favours rural new-build against urban <strong>[xxx]</strong> and renewal.</p>\n</blockquote>\n<blockquote><p>He favours out-of-town shopping sites against high streets.</p>\n</blockquote>\n<blockquote><p>This is not a free market but a biased one.</p>\n</blockquote>\n<p>奥斯本偏向乡村新建，不偏向城市更新；又偏向城外购物场所，不偏向城市商业大街。两次取舍都把建设机会放到城外。</p>\n<p>作者随后说这不是自由市场，而是有偏向的市场。这样读，A所说的对城市不公，确实容易和这两次选择联系起来。</p>\n<p>但<code>biased</code>直接评价的是市场。它是不是就等于对城市地区本身有<code>strong prejudice</code>，还要看作者后面到底在担心什么。先把A留下，不把两个词看成已经完全相等。</p>\n<p><strong>两次取舍都不偏爱城市，再加上有偏向的评价，能否先考虑A的理解？</strong></p>\n<p>可以先考虑。但偏向某种建设与对城市本身的强烈偏见是否相同，仍需回查。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"29题","raw":"### B. shows his disregard for the character of rural areas\n\n> 显示他忽视了乡村地区的特色。\n\n把B接回题干，它说的是：作者认为奥斯本的偏好显示他忽视了乡村特色。\n\nB说忽视乡村特色。第5段后半明确提出`respects their character`，我们看作者要求乡村增长怎样进行。\n\n> Under lobby pressure, George Osborne favours rural new-build against urban **[xxx]** and renewal.\n\n> They do so best where building sticks to their edges and respects their character.\n\n> We do not ruin urban conservation areas. Why ruin rural ones?\n\n作者没有禁止乡村增长，而是说建设应靠着城镇、村庄的边缘，并尊重原有特色。随后反问：城市保护区不毁，为什么要毁乡村的？\n\n这两句接在批评奥斯本偏向乡村新建之后，提醒的正是这类选择不能把乡村看成随处铺混凝土的地方。\n\nB说忽视乡村特色，能接上作者提出尊重特色却又担心乡村被破坏的这层批评。不过还要和A分清，作者最终关注的是城市受到冷落，还是乡村被忽视的保护要求。\n\n**作者紧接着要求尊重乡村特色，并反问为何破坏乡村，这能支持B所说的忽视吗？**\n\n能。B有具体要求和反问可接，先与A保留。\n\n**第一轮判断：B保留。**","articleRects":[[273,1387,1123,39],[202,1432,1194,38],[202,1477,1194,38],[202,1521,1194,38],[203,1566,1193,37],[202,1610,1194,38],[202,1654,1194,38],[202,1699,164,34]],"questionRects":[[280,1475,791,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"29","paragraphPids":[4]},"html":"<h3>B. shows his disregard for the character of rural areas</h3>\n<blockquote><p>显示他忽视了乡村地区的特色。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者认为奥斯本的偏好显示他忽视了乡村特色。</p>\n<p>B说忽视乡村特色。第5段后半明确提出<code>respects their character</code>，我们看作者要求乡村增长怎样进行。</p>\n<blockquote><p>Under lobby pressure, George Osborne favours rural new-build against urban <strong>[xxx]</strong> and renewal.</p>\n</blockquote>\n<blockquote><p>They do so best where building sticks to their edges and respects their character.</p>\n</blockquote>\n<blockquote><p>We do not ruin urban conservation areas. Why ruin rural ones?</p>\n</blockquote>\n<p>作者没有禁止乡村增长，而是说建设应靠着城镇、村庄的边缘，并尊重原有特色。随后反问：城市保护区不毁，为什么要毁乡村的？</p>\n<p>这两句接在批评奥斯本偏向乡村新建之后，提醒的正是这类选择不能把乡村看成随处铺混凝土的地方。</p>\n<p>B说忽视乡村特色，能接上作者提出尊重特色却又担心乡村被破坏的这层批评。不过还要和A分清，作者最终关注的是城市受到冷落，还是乡村被忽视的保护要求。</p>\n<p><strong>作者紧接着要求尊重乡村特色，并反问为何破坏乡村，这能支持B所说的忽视吗？</strong></p>\n<p>能。B有具体要求和反问可接，先与A保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"29题","raw":"### C. stresses the necessity of easing the housing crisis\n\n> 强调了缓解住房危机的必要性。\n\n把C接回题干，它说的是：作者认为奥斯本的偏好强调了缓解住房危机的必要性。\n\nC说偏好强调缓解住房危机的必要性。段首已经用`not ... but`写出作者认为真正要问的问题，我们回看它。\n\n> The issue is not the need for more houses but, as always, where to put them.\n\n> Under lobby pressure, George Osborne favours rural new-build against urban **[xxx]** and renewal.\n\n> This is not a free market but a biased one.\n\n原句说，问题不在是否需要更多住房，而在把房子建在哪里。作者已经把“要不要增建”与“在哪里增建”分开。\n\n奥斯本偏向乡村新建、城外购物场所，正是对地点的选择。作者称这种市场有偏向，也是在批评这类选址取舍。\n\nC退回到大家需要缓解住房不足这一点，没有回答作者对偏好的评价。需要房子，不足以证明为什么应偏向乡村。\n\n**作者此处在争论是否需要住房，还是在争论新住房应放在哪里？**\n\n是在争论地点。C把已经分开的住房需求又拿来代替选址问题。\n\n**第一轮判断：C排除。**","articleRects":[[273,1387,1123,39],[202,1432,1194,38],[202,1477,1194,38],[202,1521,1194,38],[203,1566,1193,37],[202,1610,1194,38],[202,1654,1194,38],[202,1699,164,34]],"questionRects":[[280,1537,764,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>C. stresses the necessity of easing the housing crisis</h3>\n<blockquote><p>强调了缓解住房危机的必要性。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者认为奥斯本的偏好强调了缓解住房危机的必要性。</p>\n<p>C说偏好强调缓解住房危机的必要性。段首已经用<code>not ... but</code>写出作者认为真正要问的问题，我们回看它。</p>\n<blockquote><p>The issue is not the need for more houses but, as always, where to put them.</p>\n</blockquote>\n<blockquote><p>Under lobby pressure, George Osborne favours rural new-build against urban <strong>[xxx]</strong> and renewal.</p>\n</blockquote>\n<blockquote><p>This is not a free market but a biased one.</p>\n</blockquote>\n<p>原句说，问题不在是否需要更多住房，而在把房子建在哪里。作者已经把“要不要增建”与“在哪里增建”分开。</p>\n<p>奥斯本偏向乡村新建、城外购物场所，正是对地点的选择。作者称这种市场有偏向，也是在批评这类选址取舍。</p>\n<p>C退回到大家需要缓解住房不足这一点，没有回答作者对偏好的评价。需要房子，不足以证明为什么应偏向乡村。</p>\n<p><strong>作者此处在争论是否需要住房，还是在争论新住房应放在哪里？</strong></p>\n<p>是在争论地点。C把已经分开的住房需求又拿来代替选址问题。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"29题","raw":"### D. highlights his firm stand against lobby pressure\n\n> 凸显了他坚决抵制游说压力的立场。\n\n把D接回题干，它说的是：作者认为奥斯本的偏好凸显了他坚决抵制游说压力的立场。\n\nD说奥斯本坚定抵制游说压力。原句以`Under lobby pressure`开头，我们看这个短语怎样修饰他的选择。\n\n> Under lobby pressure, George Osborne favours rural new-build against urban **[xxx]** and renewal.\n\n在游说压力下，他偏向乡村新建而非城市更新。这个写法把他的选择放在压力影响下，没有说他顶住压力、坚持相反方案。\n\nD的`against lobby pressure`要他站在抵抗压力的一边，与`Under`这里的意思不一样。\n\n句中另有`against urban ... and renewal`，但那个`against`比较的是两种建设选择，不能把它移去说明他抵制游说。\n\n**原文说他在游说压力下作出偏向，能改写成他坚定抵制这份压力吗？**\n\n不能。D把受压力影响写成了抵抗压力。\n\n**第一轮判断：D排除。**","articleRects":[[273,1387,1123,39],[202,1432,1194,38],[202,1477,1194,38],[202,1521,1194,38],[203,1566,1193,37],[202,1610,1194,38],[202,1654,1194,38],[202,1699,164,34]],"questionRects":[[280,1598,740,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>D. highlights his firm stand against lobby pressure</h3>\n<blockquote><p>凸显了他坚决抵制游说压力的立场。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为奥斯本的偏好凸显了他坚决抵制游说压力的立场。</p>\n<p>D说奥斯本坚定抵制游说压力。原句以<code>Under lobby pressure</code>开头，我们看这个短语怎样修饰他的选择。</p>\n<blockquote><p>Under lobby pressure, George Osborne favours rural new-build against urban <strong>[xxx]</strong> and renewal.</p>\n</blockquote>\n<p>在游说压力下，他偏向乡村新建而非城市更新。这个写法把他的选择放在压力影响下，没有说他顶住压力、坚持相反方案。</p>\n<p>D的<code>against lobby pressure</code>要他站在抵抗压力的一边，与<code>Under</code>这里的意思不一样。</p>\n<p>句中另有<code>against urban ... and renewal</code>，但那个<code>against</code>比较的是两种建设选择，不能把它移去说明他抵制游说。</p>\n<p><strong>原文说他在游说压力下作出偏向，能改写成他坚定抵制这份压力吗？</strong></p>\n<p>不能。D把受压力影响写成了抵抗压力。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"29题","raw":"### 29题第一次结果\n\n- A保留。\n- B保留。\n- C排除。\n- D排除。\n\n暂时保留：A、B。\n\n第一次保留A、B。两种城乡取舍及biased评价使A的偏见理解暂时可保留；尊重乡村特色的要求和反对破坏的反问又使B的批评理解可保留，两层评价的具体落点还需辨清。","articleRects":[],"questionRects":[[226,1353,803,38],[281,1414,713,38],[280,1475,791,38],[280,1537,764,37],[280,1598,740,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"29"},"html":"<h3>29题第一次结果</h3>\n<ul><li>A保留。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>暂时保留：A、B。</p>\n<p>第一次保留A、B。两种城乡取舍及biased评价使A的偏见理解暂时可保留；尊重乡村特色的要求和反对破坏的反问又使B的批评理解可保留，两层评价的具体落点还需辨清。</p>\n"},{"section":"30题","raw":"## 30题\n\n> In the last paragraph, the author shows his appreciation of ______.  \n> 在最后一段，作者表达了对______的赞赏。\n\n题干明确说In the last paragraph，直接将第6段从开发应如何进行读到末尾的政治呼吁。\n\n> 原文参考：\n> \n> Development should be planned, not let rip. After the Netherlands, Britain is Europe’s most crowded country. Half a century of town and country planning has enabled it to retain an **[xxx]** rural coherence, while still permitting low-density urban living. There is no doubt of the alternative—the **[xxx]** landscapes of southern Portugal, Spain or Ireland. Avoiding this rather than promoting it should unite the left and right of the political **[xxx]**.\n> \n> 开始精读：\n> \n> Development should be planned, / not let rip. / After the Netherlands, / Britain is Europe’s most crowded country. / Half a century / of town and country planning / has enabled it to retain / an **[xxx]** rural coherence, / while still permitting / low-density urban living. / There is no doubt / of the alternative—the **[xxx]** landscapes / of southern Portugal, Spain or Ireland. / Avoiding this rather than promoting it / should unite the left and right / of the political **[xxx]**.\n> \n> 开发应当经过规划， / 而非任其失控。 / 仅次于荷兰， / 英国是欧洲最拥挤的国家。 / 半个世纪 / 的城乡规划 / 使英国得以保留 / 一种**[xxx]**的乡村协调性， / 同时仍然允许 / 低密度的城市生活。 / 毫无疑问 / 另一种结果是**[xxx]**的景观 / 在葡萄牙南部、西班牙或爱尔兰。 / 避免它而非推动它 / 应让左派和右派团结起来 / 在政治**[xxx]**上。\n\nshows his appreciation of要找作者赞赏的对象，须分清本段中的现状、带来结果的做法、另一种结果以及作者希望各方怎样行动。\n\n接下来按A—D逐项看。","articleRects":[[274,1743,1121,38],[202,1787,1194,38],[202,1832,1194,38],[203,1876,1193,38],[202,1921,1195,37],[202,1965,999,38]],"questionRects":[[226,1720,919,38],[280,1782,518,37],[280,1843,595,38],[280,1904,646,38],[280,1965,550,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"30","initialReadingPids":[5]},"html":"<h2>30题</h2>\n<blockquote><p>In the last paragraph, the author shows his appreciation of ______.<br />\n在最后一段，作者表达了对______的赞赏。</p>\n</blockquote>\n<p>题干明确说In the last paragraph，直接将第6段从开发应如何进行读到末尾的政治呼吁。</p>\n<blockquote><p>原文参考：</p>\n<p>Development should be planned, not let rip. After the Netherlands, Britain is Europe’s most crowded country. Half a century of town and country planning has enabled it to retain an <strong>[xxx]</strong> rural coherence, while still permitting low-density urban living. There is no doubt of the alternative—the <strong>[xxx]</strong> landscapes of southern Portugal, Spain or Ireland. Avoiding this rather than promoting it should unite the left and right of the political <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>Development should be planned, / not let rip. / After the Netherlands, / Britain is Europe’s most crowded country. / Half a century / of town and country planning / has enabled it to retain / an <strong>[xxx]</strong> rural coherence, / while still permitting / low-density urban living. / There is no doubt / of the alternative—the <strong>[xxx]</strong> landscapes / of southern Portugal, Spain or Ireland. / Avoiding this rather than promoting it / should unite the left and right / of the political <strong>[xxx]</strong>.</p>\n<p>开发应当经过规划， / 而非任其失控。 / 仅次于荷兰， / 英国是欧洲最拥挤的国家。 / 半个世纪 / 的城乡规划 / 使英国得以保留 / 一种<strong>[xxx]</strong>的乡村协调性， / 同时仍然允许 / 低密度的城市生活。 / 毫无疑问 / 另一种结果是<strong>[xxx]</strong>的景观 / 在葡萄牙南部、西班牙或爱尔兰。 / 避免它而非推动它 / 应让左派和右派团结起来 / 在政治<strong>[xxx]</strong>上。</p>\n</blockquote>\n<p>shows his appreciation of要找作者赞赏的对象，须分清本段中的现状、带来结果的做法、另一种结果以及作者希望各方怎样行动。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"30题","raw":"### A. the size of population in Britain\n\n> 英国的人口规模。\n\n把A接回题干，它说的是：作者赞赏英国的人口规模。\n\nA说作者赞赏人口规模。末段确实说英国拥挤，但我们要看这个事实后面接了什么评价。\n\n> Development should be planned, not let rip.\n\n> After the Netherlands, Britain is Europe’s most crowded country.\n\n英国仅次于荷兰，是欧洲最拥挤的国家。接着作者才写，半个世纪的城乡规划仍使它保持乡村协调，并容纳低密度城市生活。\n\n拥挤说明安排土地并不容易，后面的规划效果因此更值得注意。作者没有说人口多本身值得庆祝。\n\nA把用来交代困难的事实当成赞赏对象，漏掉了接下来真正得到肯定的做法。\n\n**作者说人口拥挤，是在夸人口多，还是在说明规划要面对的空间压力？**\n\n是在说明空间压力。赞赏落在后面的规划及其效果上。\n\n**第一轮判断：A排除。**","articleRects":[[274,1743,1121,38],[202,1787,1194,38],[202,1832,1194,38],[203,1876,1193,38],[202,1921,1195,37],[202,1965,999,38]],"questionRects":[[280,1782,518,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"30","paragraphPids":[5]},"html":"<h3>A. the size of population in Britain</h3>\n<blockquote><p>英国的人口规模。</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者赞赏英国的人口规模。</p>\n<p>A说作者赞赏人口规模。末段确实说英国拥挤，但我们要看这个事实后面接了什么评价。</p>\n<blockquote><p>Development should be planned, not let rip.</p>\n</blockquote>\n<blockquote><p>After the Netherlands, Britain is Europe’s most crowded country.</p>\n</blockquote>\n<p>英国仅次于荷兰，是欧洲最拥挤的国家。接着作者才写，半个世纪的城乡规划仍使它保持乡村协调，并容纳低密度城市生活。</p>\n<p>拥挤说明安排土地并不容易，后面的规划效果因此更值得注意。作者没有说人口多本身值得庆祝。</p>\n<p>A把用来交代困难的事实当成赞赏对象，漏掉了接下来真正得到肯定的做法。</p>\n<p><strong>作者说人口拥挤，是在夸人口多，还是在说明规划要面对的空间压力？</strong></p>\n<p>是在说明空间压力。赞赏落在后面的规划及其效果上。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"30题","raw":"### B. the **[xxx]** urban lifestyle in Britain\n\n> 英国的**[xxx]**城市生活方式。\n\n把B接回题干，它说的是：作者赞赏英国的**[xxx]**城市生活方式。\n\nB说某种城市生活方式值得赞赏，修饰词还不认识。原句确实有`low-density urban living`，我们看它在句子里怎样出现。\n\n> Half a century of town and country planning has enabled it to retain an **[xxx]** rural coherence, while still permitting low-density urban living.\n\n城乡规划使英国保留乡村协调性，`while still permitting`又说同时仍允许低密度城市生活。\n\n城市生活在这里是规划带来的一个好结果，因此B并不是完全找不到相关内容。但它前面的**[xxx]**还不能确定是否对应`low-density`。\n\n还要进一步分清，作者是在单独赞赏这种生活，还是借城市与乡村两边的结果来夸规划。先把B留下，和C比较。\n\n**原文把城市生活写成可以保留的结果，B的修饰又没读清，现在是否还需继续与C比较？**\n\n需要。城市生活确实被提到，但它是不是赞赏的主要对象仍要往前后接。\n\n**第一轮判断：B保留。**","articleRects":[[274,1743,1121,38],[202,1787,1194,38],[202,1832,1194,38],[203,1876,1193,38],[202,1921,1195,37],[202,1965,999,38]],"questionRects":[[280,1843,595,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"30","paragraphPids":[5]},"html":"<h3>B. the <strong>[xxx]</strong> urban lifestyle in Britain</h3>\n<blockquote><p>英国的<strong>[xxx]</strong>城市生活方式。</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者赞赏英国的<strong>[xxx]</strong>城市生活方式。</p>\n<p>B说某种城市生活方式值得赞赏，修饰词还不认识。原句确实有<code>low-density urban living</code>，我们看它在句子里怎样出现。</p>\n<blockquote><p>Half a century of town and country planning has enabled it to retain an <strong>[xxx]</strong> rural coherence, while still permitting low-density urban living.</p>\n</blockquote>\n<p>城乡规划使英国保留乡村协调性，<code>while still permitting</code>又说同时仍允许低密度城市生活。</p>\n<p>城市生活在这里是规划带来的一个好结果，因此B并不是完全找不到相关内容。但它前面的<strong>[xxx]</strong>还不能确定是否对应<code>low-density</code>。</p>\n<p>还要进一步分清，作者是在单独赞赏这种生活，还是借城市与乡村两边的结果来夸规划。先把B留下，和C比较。</p>\n<p><strong>原文把城市生活写成可以保留的结果，B的修饰又没读清，现在是否还需继续与C比较？</strong></p>\n<p>需要。城市生活确实被提到，但它是不是赞赏的主要对象仍要往前后接。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"30题","raw":"### C. the town-and-country planning in Britain\n\n> 英国的城乡规划。\n\n把C接回题干，它说的是：作者赞赏英国的城乡规划。\n\nC说英国城乡规划。末段第一句就要求`Development should be planned`，后面又说`planning has enabled`，我们把要求与成效连起来。\n\n> Development should be planned, not let rip.\n\n> Half a century of town and country planning has enabled it to retain an **[xxx]** rural coherence, while still permitting low-density urban living.\n\n作者先明确说开发应有规划，接着用英国半个世纪的经验说明规划做到了什么：一方面保留乡村的协调，另一方面仍允许低密度城市生活。\n\n`has enabled`把这些结果归到规划上。作者并不是只列两个漂亮事实，而是在说明规划让拥挤的国家仍能兼顾城乡。\n\nC直接说城乡规划，正接住段首提倡的做法和中间被说明的成效。\n\n**作者先提倡规划，再写规划兼顾城乡的成效，能否说明他在肯定这种规划？**\n\n能。C既对应要求，也对应被明确写出的作用，先留下。\n\n**第一轮判断：C保留。**","articleRects":[[274,1743,1121,38],[202,1787,1194,38],[202,1832,1194,38],[203,1876,1193,38],[202,1921,1195,37],[202,1965,999,38]],"questionRects":[[280,1904,646,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"30","paragraphPids":[5]},"html":"<h3>C. the town-and-country planning in Britain</h3>\n<blockquote><p>英国的城乡规划。</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者赞赏英国的城乡规划。</p>\n<p>C说英国城乡规划。末段第一句就要求<code>Development should be planned</code>，后面又说<code>planning has enabled</code>，我们把要求与成效连起来。</p>\n<blockquote><p>Development should be planned, not let rip.</p>\n</blockquote>\n<blockquote><p>Half a century of town and country planning has enabled it to retain an <strong>[xxx]</strong> rural coherence, while still permitting low-density urban living.</p>\n</blockquote>\n<p>作者先明确说开发应有规划，接着用英国半个世纪的经验说明规划做到了什么：一方面保留乡村的协调，另一方面仍允许低密度城市生活。</p>\n<p><code>has enabled</code>把这些结果归到规划上。作者并不是只列两个漂亮事实，而是在说明规划让拥挤的国家仍能兼顾城乡。</p>\n<p>C直接说城乡规划，正接住段首提倡的做法和中间被说明的成效。</p>\n<p><strong>作者先提倡规划，再写规划兼顾城乡的成效，能否说明他在肯定这种规划？</strong></p>\n<p>能。C既对应要求，也对应被明确写出的作用，先留下。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"30题","raw":"### D. the political life in today’s Britain\n\n> 当今英国的政治生活。\n\n把D接回题干，它说的是：作者赞赏当今英国的政治生活。\n\nD说赞赏当下政治生活。末句有政治左右两方，我们看作者说他们已经做得好，还是提出他们应该做什么。\n\n> Avoiding this rather than promoting it should unite the left and right of the political **[xxx]**.\n\n`should unite`是应该团结起来。作者希望左右双方都避免前面所说的另一种景观，而不要推动它出现。\n\n这是对各方接下来行动的要求，不是报告现有政治生活已经团结、值得赞赏。\n\nD把希望实现的合作当成了当前已获肯定的状态。句中的`should`恰恰没有保证这件事已经做到。\n\n**作者说左右两方应该团结，是否就在赞赏他们当下已经过好的政治生活？**\n\n不是。原句是在提出共同努力的要求，D把要求当成了现状。\n\n**第一轮判断：D排除。**","articleRects":[[274,1743,1121,38],[202,1787,1194,38],[202,1832,1194,38],[203,1876,1193,38],[202,1921,1195,37],[202,1965,999,38]],"questionRects":[[280,1965,550,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"30","paragraphPids":[5]},"html":"<h3>D. the political life in today’s Britain</h3>\n<blockquote><p>当今英国的政治生活。</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者赞赏当今英国的政治生活。</p>\n<p>D说赞赏当下政治生活。末句有政治左右两方，我们看作者说他们已经做得好，还是提出他们应该做什么。</p>\n<blockquote><p>Avoiding this rather than promoting it should unite the left and right of the political <strong>[xxx]</strong>.</p>\n</blockquote>\n<p><code>should unite</code>是应该团结起来。作者希望左右双方都避免前面所说的另一种景观，而不要推动它出现。</p>\n<p>这是对各方接下来行动的要求，不是报告现有政治生活已经团结、值得赞赏。</p>\n<p>D把希望实现的合作当成了当前已获肯定的状态。句中的<code>should</code>恰恰没有保证这件事已经做到。</p>\n<p><strong>作者说左右两方应该团结，是否就在赞赏他们当下已经过好的政治生活？</strong></p>\n<p>不是。原句是在提出共同努力的要求，D把要求当成了现状。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"30题","raw":"### 30题第一次结果\n\n- A排除。\n- B保留。\n- C保留。\n- D排除。\n\n暂时保留：B、C。\n\n第一次保留B、C。城市生活是规划允许保留的结果之一，但B的修饰语仍不清楚；C直接对应作者要求规划并说明规划成效的表述。","articleRects":[],"questionRects":[[226,1720,919,38],[280,1782,518,37],[280,1843,595,38],[280,1904,646,38],[280,1965,550,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"30"},"html":"<h3>30题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂时保留：B、C。</p>\n<p>第一次保留B、C。城市生活是规划允许保留的结果之一，但B的修饰语仍不清楚；C直接对应作者要求规划并说明规划成效的表述。</p>\n"},{"section":"进阶方法","raw":"### 把还没细读的段落接上\n\n> 原文参考：\n> \n> The sensible place to build new houses, factories and offices is where people are, in cities and towns where infrastructure is in place. The London **[xxx]** Stirling Ackroyd recently identified enough sites for half a million houses in the London area alone, with no intrusion on green belt. What is true of London is even truer of the **[xxx]**.\n> \n> 开始精读：\n> \n> The sensible place to build / new houses, / factories and offices / is where people are, / in cities and towns / where infrastructure is in place. / The London **[xxx]** Stirling Ackroyd / recently identified enough sites / for half a million houses / in the London area alone, / with no intrusion on green belt. / What is true of London / is even truer of the **[xxx]**.\n> \n> 适合建设的地方 / 新住宅， / 工厂和办公室 / 是人们所在之处， / 在城市和城镇里 / 那里已有基础设施。 / 伦敦的**[xxx]**斯特林阿克罗伊德 / 最近找到了足够的地块 / 可建五十万套住房 / 仅在伦敦地区， / 且不侵占绿化带。 / 适用于伦敦的情形 / 对**[xxx]**更为适用。","articleRects":[[273,1166,1123,38],[202,1211,1194,37],[203,1255,1193,38],[202,1299,1194,38],[202,1344,405,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_reading","readingPids":[4],"role":"whole_text_precision","paragraphPids":[3]},"html":"<h3>把还没细读的段落接上</h3>\n<blockquote><p>原文参考：</p>\n<p>The sensible place to build new houses, factories and offices is where people are, in cities and towns where infrastructure is in place. The London <strong>[xxx]</strong> Stirling Ackroyd recently identified enough sites for half a million houses in the London area alone, with no intrusion on green belt. What is true of London is even truer of the <strong>[xxx]</strong>.</p>\n<p>开始精读：</p>\n<p>The sensible place to build / new houses, / factories and offices / is where people are, / in cities and towns / where infrastructure is in place. / The London <strong>[xxx]</strong> Stirling Ackroyd / recently identified enough sites / for half a million houses / in the London area alone, / with no intrusion on green belt. / What is true of London / is even truer of the <strong>[xxx]</strong>.</p>\n<p>适合建设的地方 / 新住宅， / 工厂和办公室 / 是人们所在之处， / 在城市和城镇里 / 那里已有基础设施。 / 伦敦的<strong>[xxx]</strong>斯特林阿克罗伊德 / 最近找到了足够的地块 / 可建五十万套住房 / 仅在伦敦地区， / 且不侵占绿化带。 / 适用于伦敦的情形 / 对<strong>[xxx]</strong>更为适用。</p>\n</blockquote>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | proudest of their country；limited political support | proudest of their country与limited political support形成反差：民众以乡村为傲，政治支持却有限。这提出公众情感如何落实到保护中的问题，引出下段的保存自然实践。 | 以公众情感与政治支持的反差提出乡村保护问题。 |\n| 第2段 | national parks and green belts；concrete consumes more of it | to save “the beauty of natural places”写国民信托的目的，national parks and green belts写后来成果，concrete consumes more of it写乡村仍持续遭到占用。这说明民众所珍惜的自然空间正在承受什么压力，接着需要看政治力量如何回应。 | 交代保护实践及其面临的压力，引出政治回应。 |\n| 第3段 | gives rural development priority over conservation；sensing its chance | gives rural development priority over conservation写保守党的开发优先，工党也想在议会反对建设时停止地方规划，自由民主党沉默；sensing its chance与保护乡村运动则写英国独立党看到机会。这把首段的政治支持不足展开成各党具体选择，也为下段提出不同选址方案作铺垫。 | 把政治支持不足展开成各党的具体选择。 |\n| 第4段 | where infrastructure is in place；with no intrusion on green belt | where infrastructure is in place说明现有城镇适合建设，with no intrusion on green belt说明伦敦找到的住房用地可以不侵占绿化带。作者据此提出可以兼顾建设与绿地的办法，使下段对乡村新建偏好的批评有了实际对照。 | 提出可以兼顾住房建设与绿地保护的选址办法。 |\n| 第5段 | where to put them；respects their character；Why ruin rural ones | where to put them将争点确定为房屋位置；奥斯本在游说压力下偏爱乡村新建和城外购物，作者称这种市场biased。随后respects their character要求乡村建设尊重自身特色，Why ruin rural ones反对破坏乡村保护区。本段既承认乡村会发展，又要求发展遵守保护条件。 | 以可行选址作对照，批评忽视乡村特色的建设偏好。 |\n| 第6段 | Development should be planned, not let rip；rural coherence | Development should be planned, not let rip把前面的选址与保护要求归结为规划原则；城乡规划保留rural coherence并仍容纳low-density urban living，成为规划有效的理由。末尾以Avoiding this rather than promoting it要求左右两派共同避免所述另一种结果，回应首段政治支持不足。 | 以规划原则收束前面的选址与保护要求，回应开头的政治问题。 |\n\n全文观点：住房和乡村都可以发展，但建设应有规划、选择合适位置，并尊重乡村的自然空间与特色。现有城镇的建设条件说明开发与乡村保护能够兼顾；政治选择应支持这种兼顾，而不应在游说压力下放任对乡村的侵占。","articleRects":[[273,279,1123,38],[202,322,1194,39],[202,366,1194,39],[203,410,1193,40],[202,456,246,38],[274,501,1122,37],[202,544,1194,39],[203,589,1193,38],[202,632,1194,40],[202,678,1195,38],[202,723,911,37],[273,767,1123,38],[203,811,1193,38],[202,854,1193,39],[202,900,1194,38],[202,944,1194,38],[202,989,1194,38],[202,1033,1194,38],[202,1078,1194,37],[202,1122,304,38],[273,1166,1123,38],[202,1211,1194,37],[203,1255,1193,38],[202,1299,1194,38],[202,1344,405,38],[273,1387,1123,39],[202,1432,1194,38],[202,1477,1194,38],[202,1521,1194,38],[203,1566,1193,37],[202,1610,1194,38],[202,1654,1194,38],[202,1699,164,34],[274,1743,1121,38],[202,1787,1194,38],[202,1832,1194,38],[203,1876,1193,38],[202,1921,1195,37],[202,1965,999,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>proudest of their country；limited political support</td><td>proudest of their country与limited political support形成反差：民众以乡村为傲，政治支持却有限。这提出公众情感如何落实到保护中的问题，引出下段的保存自然实践。</td><td>以公众情感与政治支持的反差提出乡村保护问题。</td></tr><tr><td>第2段</td><td>national parks and green belts；concrete consumes more of it</td><td>to save “the beauty of natural places”写国民信托的目的，national parks and green belts写后来成果，concrete consumes more of it写乡村仍持续遭到占用。这说明民众所珍惜的自然空间正在承受什么压力，接着需要看政治力量如何回应。</td><td>交代保护实践及其面临的压力，引出政治回应。</td></tr><tr><td>第3段</td><td>gives rural development priority over conservation；sensing its chance</td><td>gives rural development priority over conservation写保守党的开发优先，工党也想在议会反对建设时停止地方规划，自由民主党沉默；sensing its chance与保护乡村运动则写英国独立党看到机会。这把首段的政治支持不足展开成各党具体选择，也为下段提出不同选址方案作铺垫。</td><td>把政治支持不足展开成各党的具体选择。</td></tr><tr><td>第4段</td><td>where infrastructure is in place；with no intrusion on green belt</td><td>where infrastructure is in place说明现有城镇适合建设，with no intrusion on green belt说明伦敦找到的住房用地可以不侵占绿化带。作者据此提出可以兼顾建设与绿地的办法，使下段对乡村新建偏好的批评有了实际对照。</td><td>提出可以兼顾住房建设与绿地保护的选址办法。</td></tr><tr><td>第5段</td><td>where to put them；respects their character；Why ruin rural ones</td><td>where to put them将争点确定为房屋位置；奥斯本在游说压力下偏爱乡村新建和城外购物，作者称这种市场biased。随后respects their character要求乡村建设尊重自身特色，Why ruin rural ones反对破坏乡村保护区。本段既承认乡村会发展，又要求发展遵守保护条件。</td><td>以可行选址作对照，批评忽视乡村特色的建设偏好。</td></tr><tr><td>第6段</td><td>Development should be planned, not let rip；rural coherence</td><td>Development should be planned, not let rip把前面的选址与保护要求归结为规划原则；城乡规划保留rural coherence并仍容纳low-density urban living，成为规划有效的理由。末尾以Avoiding this rather than promoting it要求左右两派共同避免所述另一种结果，回应首段政治支持不足。</td><td>以规划原则收束前面的选址与保护要求，回应开头的政治问题。</td></tr></tbody></table>\n<p>全文观点：住房和乡村都可以发展，但建设应有规划、选择合适位置，并尊重乡村的自然空间与特色。现有城镇的建设条件说明开发与乡村保护能够兼顾；政治选择应支持这种兼顾，而不应在游说压力下放任对乡村的侵占。</p>\n"},{"section":"进阶回查","raw":"## 回查29题：A还是B？\n\nA. reveals a strong prejudice against urban areas\n\nB. shows his disregard for the character of rural areas\n\nA说奥斯本对城市有强烈偏见，B说他忽视乡村特色。两次偏向城外，再加上`biased`，让A看起来也能接上；后面的尊重特色和保护区反问，又直接接到B。\n\n现在回看作者在批评这种选择之前提出了什么替代办法。第4段说新房屋、工厂和办公室可以建在人口与基础设施已有的城镇，又举伦敦：\n\n> enough sites for half a million houses in the London area alone, with no intrusion on green belt\n\n单是伦敦就有足够用地，而且不用侵占绿化带。作者不是说需要房子就不能保护乡村，而是在说明可以同时做到。\n\n第5段才说：\n\n> The issue is not the need for more houses but, as always, where to put them.\n>\n> They do so best where building sticks to their edges and respects their character.\n>\n> We do not ruin urban conservation areas. Why ruin rural ones?\n\n争议落在地点和建设方式上。城市有地可用，乡村即使增长也应尊重特色；奥斯本却在游说压力下偏向乡村新建，作者批评的是这种选择放下了乡村应受的保护。\n\nA把这种选址偏向进一步说成对城市本身有强烈偏见。`biased`能说明市场向某些建设方式倾斜，却没有直接说明他对城市地区本身有怎样的成见，也没有证明这种态度的程度。\n\n**作者提出城内可建设、乡村应保留特色，是为了证明奥斯本对城市本身有强烈成见，还是说明他的选择忽视了乡村保护？**\n\n是后者。B能接上作者提出的可行选址办法和对乡村特色的具体要求。不是所有乡村新建都错，而是开发不能忽略这些要求。\n\n> **29题选B。**","articleRects":[[273,1387,1123,39],[202,1432,1194,38],[202,1477,1194,38],[202,1521,1194,38],[203,1566,1193,37],[202,1610,1194,38],[202,1654,1194,38],[202,1699,164,34],[274,501,1122,37],[202,544,1194,39],[203,589,1193,38],[202,632,1194,40],[202,678,1195,38],[202,723,911,37],[273,767,1123,38],[203,811,1193,38],[202,854,1193,39],[202,900,1194,38],[202,944,1194,38],[202,989,1194,38],[202,1033,1194,38],[202,1078,1194,37],[202,1122,304,38],[273,1166,1123,38],[202,1211,1194,37],[203,1255,1193,38],[202,1299,1194,38],[202,1344,405,38],[274,1743,1121,38],[202,1787,1194,38],[202,1832,1194,38],[203,1876,1193,38],[202,1921,1195,37],[202,1965,999,38]],"questionRects":[[226,1353,803,38],[281,1414,713,38],[280,1475,791,38],[280,1537,764,37],[280,1598,740,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","B"],"newEvidencePids":[2,3,4,6],"finalChoice":"B","qid":"29","paragraphPids":[0,1,2,3,4,5]},"html":"<h2>回查29题：A还是B？</h2>\n<p>A. reveals a strong prejudice against urban areas</p>\n<p>B. shows his disregard for the character of rural areas</p>\n<p>A说奥斯本对城市有强烈偏见，B说他忽视乡村特色。两次偏向城外，再加上<code>biased</code>，让A看起来也能接上；后面的尊重特色和保护区反问，又直接接到B。</p>\n<p>现在回看作者在批评这种选择之前提出了什么替代办法。第4段说新房屋、工厂和办公室可以建在人口与基础设施已有的城镇，又举伦敦：</p>\n<blockquote><p>enough sites for half a million houses in the London area alone, with no intrusion on green belt</p>\n</blockquote>\n<p>单是伦敦就有足够用地，而且不用侵占绿化带。作者不是说需要房子就不能保护乡村，而是在说明可以同时做到。</p>\n<p>第5段才说：</p>\n<blockquote><p>The issue is not the need for more houses but, as always, where to put them.</p>\n<p>They do so best where building sticks to their edges and respects their character.</p>\n<p>We do not ruin urban conservation areas. Why ruin rural ones?</p>\n</blockquote>\n<p>争议落在地点和建设方式上。城市有地可用，乡村即使增长也应尊重特色；奥斯本却在游说压力下偏向乡村新建，作者批评的是这种选择放下了乡村应受的保护。</p>\n<p>A把这种选址偏向进一步说成对城市本身有强烈偏见。<code>biased</code>能说明市场向某些建设方式倾斜，却没有直接说明他对城市地区本身有怎样的成见，也没有证明这种态度的程度。</p>\n<p><strong>作者提出城内可建设、乡村应保留特色，是为了证明奥斯本对城市本身有强烈成见，还是说明他的选择忽视了乡村保护？</strong></p>\n<p>是后者。B能接上作者提出的可行选址办法和对乡村特色的具体要求。不是所有乡村新建都错，而是开发不能忽略这些要求。</p>\n<blockquote><p><strong>29题选B。</strong></p>\n</blockquote>\n"},{"section":"进阶回查","raw":"## 回查30题：B还是C？\n\nB. the **[xxx]** urban lifestyle in Britain\n\nC. the town-and-country planning in Britain\n\nB说作者赞赏某种城市生活，修饰词尚未读清；C说作者赞赏城乡规划。末段确实提到城市生活，但要分清它在这里为什么被写出来。\n\n前面作者不断在安排开发和保护怎样兼顾：城市已有基础设施和可用土地，乡村增长应沿边缘并尊重特色。到了末段，先直接提出：\n\n> Development should be planned, not let rip.\n\n随后说明英国经验：\n\n> Half a century of town and country planning has enabled it to retain an **[xxx]** rural coherence, while still permitting low-density urban living.\n\n这个句子的主语是城乡规划。`has enabled`先让它带来乡村这一边的成果，`while still permitting`再接城市这一边。人口如此拥挤，仍能同时保留两种生活空间，是规划值得肯定的原因。\n\n如果只取B，就只剩城市生活这一项结果，前面的乡村协调、段首明确提倡规划，以及全文怎样安排开发的讨论都接不完整。C把两项结果的共同来由说出来了。\n\n**作者写低密度城市生活，是单独评选一种生活方式，还是用它与乡村的协调共同说明规划有效？**\n\n是说明规划有效。即使B的修饰词仍不认识，也能从主语和两项结果看出作者赞赏的是C。\n\n> **30题选C。**","articleRects":[[274,1743,1121,38],[202,1787,1194,38],[202,1832,1194,38],[203,1876,1193,38],[202,1921,1195,37],[202,1965,999,38],[274,501,1122,37],[202,544,1194,39],[203,589,1193,38],[202,632,1194,40],[202,678,1195,38],[202,723,911,37],[273,767,1123,38],[203,811,1193,38],[202,854,1193,39],[202,900,1194,38],[202,944,1194,38],[202,989,1194,38],[202,1033,1194,38],[202,1078,1194,37],[202,1122,304,38],[273,1166,1123,38],[202,1211,1194,37],[203,1255,1193,38],[202,1299,1194,38],[202,1344,405,38],[273,1387,1123,39],[202,1432,1194,38],[202,1477,1194,38],[202,1521,1194,38],[203,1566,1193,37],[202,1610,1194,38],[202,1654,1194,38],[202,1699,164,34]],"questionRects":[[226,1720,919,38],[280,1782,518,37],[280,1843,595,38],[280,1904,646,38],[280,1965,550,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["B","C"],"newEvidencePids":[2,3,4,5],"finalChoice":"C","qid":"30","paragraphPids":[0,1,2,3,4,5]},"html":"<h2>回查30题：B还是C？</h2>\n<p>B. the <strong>[xxx]</strong> urban lifestyle in Britain</p>\n<p>C. the town-and-country planning in Britain</p>\n<p>B说作者赞赏某种城市生活，修饰词尚未读清；C说作者赞赏城乡规划。末段确实提到城市生活，但要分清它在这里为什么被写出来。</p>\n<p>前面作者不断在安排开发和保护怎样兼顾：城市已有基础设施和可用土地，乡村增长应沿边缘并尊重特色。到了末段，先直接提出：</p>\n<blockquote><p>Development should be planned, not let rip.</p>\n</blockquote>\n<p>随后说明英国经验：</p>\n<blockquote><p>Half a century of town and country planning has enabled it to retain an <strong>[xxx]</strong> rural coherence, while still permitting low-density urban living.</p>\n</blockquote>\n<p>这个句子的主语是城乡规划。<code>has enabled</code>先让它带来乡村这一边的成果，<code>while still permitting</code>再接城市这一边。人口如此拥挤，仍能同时保留两种生活空间，是规划值得肯定的原因。</p>\n<p>如果只取B，就只剩城市生活这一项结果，前面的乡村协调、段首明确提倡规划，以及全文怎样安排开发的讨论都接不完整。C把两项结果的共同来由说出来了。</p>\n<p><strong>作者写低密度城市生活，是单独评选一种生活方式，还是用它与乡村的协调共同说明规划有效？</strong></p>\n<p>是说明规划有效。即使B的修饰词仍不认识，也能从主语和两项结果看出作者赞赏的是C。</p>\n<blockquote><p><strong>30题选C。</strong></p>\n</blockquote>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**26. D**\n\n**27. A**\n\n**28. C**\n\n**29. B**\n\n**30. C**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>26. D</strong></p>\n<p><strong>27. A</strong></p>\n<p><strong>28. C</strong></p>\n<p><strong>29. B</strong></p>\n<p><strong>30. C</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRvR9BABXRUJQVlA4TOh9BAAvV0Y1AlWT4rZtHCX7r12uKP+IUOC2jdIOj/ETrGLcMrNH8RbyLRGaPefI224479iGiwN+DlOT4z8FnOMvoVr9//q7SZmZmZmZmZmZmZkcMzMzMzMzM7fnMDMzn/P//e7v/w/D/f7uuz5DZIRKdlVxOEEZXTapqo+L7wz3xPdkhqK7Kr7q3QVYXh+fAcpdICvUcatYNQuUB8gKdXV8fem/QE4GKC3ALjKzXFl0UeV6bn1OfGYouzp0dfU5n4JjvBN0kahy52DHrOrqO8FV9bxAXWeoYsmuittFciL6D4mNJEWSY5muv8d8teeF/f/9V/852jbbnWS6bbfZmelmO9OrmWmbi8203e00TXfa2TZXmXbTmWmTi53uTvd6t7tttm3a7U53s5Pd7HSzM92dzSbNZXaznd3pdrpN/9vuttOddjedZjvbdi96selsdnuRzm6yk9nspp2dzW63m4rzeT1f7/fnfQ58v/D7/vvDoDAEhSFHHBSGoDAoUBjyEaAwBHGCQYHCoAgGxREnGBQoDIpgUBxxgkERDApDMCiOIBgUQTxQGIJBkU9CUBiCOCgMwaBQoDDkiIPCEBQGBQpDjjjBoEBhUKAw5AiCQYH4BIMiGBQfQTAoECcYFMGgMASDIic5QWEIBoUhGBQ5yQkKQzAoDEFhyBGgMATxQWEICkOeAhSGHHGCQYHCoEBhyBEnGBQoDIpgUBxxgkGBwqAIBsURBIMiJCcoDMGgMASDIic5QWEIBoUhKAw54qAwJKL/HmjbriNJkqSNSK9QKzcLECQBfsUEEP7ErrX/6yQp53AXHNbdZbxdxqVdq9q2Wke6u7rHaqanu3paqrpc/uVe3dXdI+uut4DdUvf/33T1OetuERq6EzlEk+9G+OoN4BoNkUcOEUQesbeAh
