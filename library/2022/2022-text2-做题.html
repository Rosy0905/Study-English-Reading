<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 26题题干\n\n**The author suggests that Generation Z should ______.**\n\n> 作者建议Ｚ世代应该怎样做？\n\n题型：**细节推断题**。","articleRects":[],"questionRects":[[226,412,734,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"26"},"html":"<h2>26题题干</h2>\n<p><strong>The author suggests that Generation Z should ______.</strong></p>\n<blockquote><p>作者建议Ｚ世代应该怎样做？</p>\n</blockquote>\n<p>题型：<strong>细节推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 27题题干\n\n**The percentage of UK graduates in non-graduate roles reflects ______.**\n\n> 英国大学毕业生从事不要求大学学历工作的比例反映了什么？\n\n题型：**例证作用题**。","articleRects":[],"questionRects":[[226,745,981,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"27"},"html":"<h2>27题题干</h2>\n<p><strong>The percentage of UK graduates in non-graduate roles reflects ______.</strong></p>\n<blockquote><p>英国大学毕业生从事不要求大学学历工作的比例反映了什么？</p>\n</blockquote>\n<p>题型：<strong>例证作用题</strong>。</p>\n"},{"section":"先读题干","raw":"## 28题题干\n\n**The author considers it a good sign that ______.**\n\n> 作者认为哪一种情况是一个好迹象？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,1078,654,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"28"},"html":"<h2>28题题干</h2>\n<p><strong>The author considers it a good sign that ______.</strong></p>\n<blockquote><p>作者认为哪一种情况是一个好迹象？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 29题题干\n\n**It is advised in Paragraph 5 that those with one degree should ______.**\n\n> 第5段建议已经拥有一个学位的人怎样做？\n\n题型：**段落细节题**。","articleRects":[],"questionRects":[[226,1411,977,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"29"},"html":"<h2>29题题干</h2>\n<p><strong>It is advised in Paragraph 5 that those with one degree should ______.</strong></p>\n<blockquote><p>第5段建议已经拥有一个学位的人怎样做？</p>\n</blockquote>\n<p>题型：<strong>段落细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 30题题干\n\n**What can be concluded about Generation Z from the last two paragraphs?**\n\n> 根据最后两段，可以对Ｚ世代得出什么结论？\n\n题型：**段落推断题**。","articleRects":[],"questionRects":[[226,1744,1153,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"30"},"html":"<h2>30题题干</h2>\n<p><strong>What can be concluded about Generation Z from the last two paragraphs?</strong></p>\n<blockquote><p>根据最后两段，可以对Ｚ世代得出什么结论？</p>\n</blockquote>\n<p>题型：<strong>段落推断题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, rather, even if |\n| 态度词／评价词 | 先抓个大概好坏 | devalued, loyal, specific |\n| 动作词 | 先看谁做了什么 | consider, learn, earn |\n| 结果词 | 看最后出了什么事 | roles, advantages, careers |\n| 重复主题词 | 大概知道老在说什么 | degree, Generation Z, education |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, rather, even if</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>devalued, loyal, specific</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>consider, learn, earn</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>roles, advantages, careers</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>degree, Generation Z, education</td></tr></tbody></table>\n"},{"section":"读文章","raw":"As the latest **[xxx]** of students **[xxx]** their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.","articleRects":[[274,301,1122,38],[202,357,1194,38],[203,412,1192,38],[203,468,707,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>As the latest <strong>[xxx]</strong> of students <strong>[xxx]</strong> their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.</p>\n</div></div>"},{"section":"读文章","raw":"As the latest **[xxx]** of students **[xxx]** their undergraduate application form and weigh up their options, / it may be worth considering just how the point, / purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.","articleRects":[[274,301,1122,38],[202,357,1194,38],[203,412,1192,38],[203,468,707,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":1,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p>As the latest <strong>[xxx]</strong> of students <strong>[xxx]</strong> their undergraduate application form and weigh up their options, / it may be worth considering just how the point, / purpose and value of a degree has change 发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，遇到这种情况，可再结合全文检查。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，遇到这种情况，可再结合全文检查。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"26题","raw":"## 26题\n\n> The author suggests that Generation Z should ______.  \n> 作者建议Ｚ世代应该怎样做？\n\n题干问作者对Generation Z的建议。第1段直接提到what Generation Z need to consider，并把它放在本科申请和权衡选择的场景中，先把这一段从头读完。\n\n> 原文参考：\n> \n> As the latest **[xxx]** of students **[xxx]** their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.\n> \n> 开始精读：\n> \n> As the latest **[xxx]** of students / **[xxx]** their undergraduate application form / and weigh up their options, / it may be worth considering / just how the point, purpose and value of a degree has changed / and what Generation Z need to consider / as they start the third stage of their educational journey.\n> \n> 当最新的**[xxx]**学生 / **[xxx]**他们的本科申请表 / 并权衡自己的选择时， / 也许值得考虑， / 一个学位的意义、目的和价值究竟发生了怎样的变化， / 以及Ｚ世代需要考虑什么， / 当他们开启教育历程的第三阶段时。\n\n这一段先说学生正在权衡选择，再提出学位的意义、目的和价值发生了变化。空格要补的是：在开始下一阶段教育时，Ｚ世代应当考虑什么、怎样作出选择。\n\n接下来按A—D逐项看。","articleRects":[[274,301,1122,38],[202,357,1194,38],[203,412,1192,38],[203,468,707,38]],"questionRects":[[226,412,734,38],[292,468,518,37],[292,523,580,38],[292,579,666,38],[292,634,638,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"26","initialReadingPids":[0]},"html":"<h2>26题</h2>\n<blockquote><p>The author suggests that Generation Z should ______.<br />\n作者建议Ｚ世代应该怎样做？</p>\n</blockquote>\n<p>题干问作者对Generation Z的建议。第1段直接提到what Generation Z need to consider，并把它放在本科申请和权衡选择的场景中，先把这一段从头读完。</p>\n<blockquote><p>原文参考：</p>\n<p>As the latest <strong>[xxx]</strong> of students <strong>[xxx]</strong> their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.</p>\n<p>开始精读：</p>\n<p>As the latest <strong>[xxx]</strong> of students / <strong>[xxx]</strong> their undergraduate application form / and weigh up their options, / it may be worth considering / just how the point, purpose and value of a degree has changed / and what Generation Z need to consider / as they start the third stage of their educational journey.</p>\n<p>当最新的<strong>[xxx]</strong>学生 / <strong>[xxx]</strong>他们的本科申请表 / 并权衡自己的选择时， / 也许值得考虑， / 一个学位的意义、目的和价值究竟发生了怎样的变化， / 以及Ｚ世代需要考虑什么， / 当他们开启教育历程的第三阶段时。</p>\n</blockquote>\n<p>这一段先说学生正在权衡选择，再提出学位的意义、目的和价值发生了变化。空格要补的是：在开始下一阶段教育时，Ｚ世代应当考虑什么、怎样作出选择。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"26题","raw":"### A. be careful in choosing a college\n\n> 在选择大学时谨慎一些\n\n把A接回题干，它说的是：作者建议Ｚ世代在选择大学时谨慎一些。\n\nA说choosing a college，回第1段看作者让学生考虑什么。\n\n> it may be worth considering just how the point, purpose and value of a degree has changed\n\n开头确实出现申请本科、权衡选择，但后面具体列出的是a degree的point、purpose和value，也就是读这个学位有什么意义、目的和价值。\n\n如果是选哪所大学，接下来应该比较学校。这里比较的却是读大学这件事本身值不值得。\n\n**作者是在问选哪所大学，还是要不要走大学这条路？**\n\n后者。A把对大学教育的重新考虑换成了挑选大学，不能接上后面的具体内容。\n\n**第一轮判断：A排除。**","articleRects":[[274,301,1122,38],[202,357,1194,38],[203,412,1192,38],[203,468,707,38]],"questionRects":[[292,468,518,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>A. be careful in choosing a college</h3>\n<blockquote><p>在选择大学时谨慎一些</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者建议Ｚ世代在选择大学时谨慎一些。</p>\n<p>A说choosing a college，回第1段看作者让学生考虑什么。</p>\n<blockquote><p>it may be worth considering just how the point, purpose and value of a degree has changed</p>\n</blockquote>\n<p>开头确实出现申请本科、权衡选择，但后面具体列出的是a degree的point、purpose和value，也就是读这个学位有什么意义、目的和价值。</p>\n<p>如果是选哪所大学，接下来应该比较学校。这里比较的却是读大学这件事本身值不值得。</p>\n<p><strong>作者是在问选哪所大学，还是要不要走大学这条路？</strong></p>\n<p>后者。A把对大学教育的重新考虑换成了挑选大学，不能接上后面的具体内容。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"26题","raw":"### B. be diligent at each educational stage\n\n> 在每一个教育阶段都勤奋努力\n\n把B接回题干，它说的是：作者建议Ｚ世代在每一个教育阶段都勤奋努力。\n\nB说每个阶段都要勤奋，回第1段找作者对学习方式的建议。\n\n> what Generation Z need to consider as they start the third stage of their educational journey.\n\nthird stage只告诉我们学生走到了教育的第三阶段。作者接着要求考虑学位的意义和价值，并没有说前两个阶段努力得不够，也没有要求第三阶段更加勤奋。\n\n把stage看见了，还要看作者对这个阶段提出了什么要求。\n\n**提到教育阶段，就能推出每个阶段都应勤奋吗？**\n\n不能。文中要求重新考虑学位的价值，B所说的勤奋不是这一建议。\n\n**第一轮判断：B排除。**","articleRects":[[274,301,1122,38],[202,357,1194,38],[203,412,1192,38],[203,468,707,38]],"questionRects":[[292,523,580,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>B. be diligent at each educational stage</h3>\n<blockquote><p>在每一个教育阶段都勤奋努力</p>\n</blockquote>\n<p>把B接回题干，它说的是：作者建议Ｚ世代在每一个教育阶段都勤奋努力。</p>\n<p>B说每个阶段都要勤奋，回第1段找作者对学习方式的建议。</p>\n<blockquote><p>what Generation Z need to consider as they start the third stage of their educational journey.</p>\n</blockquote>\n<p>third stage只告诉我们学生走到了教育的第三阶段。作者接着要求考虑学位的意义和价值，并没有说前两个阶段努力得不够，也没有要求第三阶段更加勤奋。</p>\n<p>把stage看见了，还要看作者对这个阶段提出了什么要求。</p>\n<p><strong>提到教育阶段，就能推出每个阶段都应勤奋吗？</strong></p>\n<p>不能。文中要求重新考虑学位的价值，B所说的勤奋不是这一建议。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"26题","raw":"### C. reassess the necessity of college education\n\n> 重新评估大学教育的必要性\n\n把C接回题干，它说的是：作者建议Ｚ世代重新评估大学教育的必要性。\n\nC说重新评估大学教育的必要性，回第1段看considering后面列了哪些内容。\n\n> it may be worth considering just how the point, purpose and value of a degree has changed\n\n作者让准备申请的学生考虑学位的point、purpose和value发生了什么变化。先弄清学位如今能带来什么，才好决定自己是否需要这条路。\n\nC的reassess正好接住重新考虑，necessity接住读大学对自己是否必要，并没有说大学一定无用。\n\n**重新想清读大学有什么意义，是否包括判断自己还需不需要读？**\n\n包括。C保留了作者让学生重新衡量的意思，可以保留。\n\n**第一轮判断：C保留。**","articleRects":[[274,301,1122,38],[202,357,1194,38],[203,412,1192,38],[203,468,707,38]],"questionRects":[[292,579,666,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"26","paragraphPids":[0]},"html":"<h3>C. reassess the necessity of college education</h3>\n<blockquote><p>重新评估大学教育的必要性</p>\n</blockquote>\n<p>把C接回题干，它说的是：作者建议Ｚ世代重新评估大学教育的必要性。</p>\n<p>C说重新评估大学教育的必要性，回第1段看considering后面列了哪些内容。</p>\n<blockquote><p>it may be worth considering just how the point, purpose and value of a degree has changed</p>\n</blockquote>\n<p>作者让准备申请的学生考虑学位的point、purpose和value发生了什么变化。先弄清学位如今能带来什么，才好决定自己是否需要这条路。</p>\n<p>C的reassess正好接住重新考虑，necessity接住读大学对自己是否必要，并没有说大学一定无用。</p>\n<p><strong>重新想清读大学有什么意义，是否包括判断自己还需不需要读？</strong></p>\n<p>包括。C保留了作者让学生重新衡量的意思，可以保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"26题","raw":"### D. postpone their undergraduate application\n\n> 推迟他们的本科申请\n\n把D接回题干，它说的是：作者建议Ｚ世代推迟他们的本科申请。\n\nD说postpone申请，回第1段看application form附近有没有时间上的要求。\n\n> **[xxx]** their undergraduate application form and weigh up their options,\n\n> it may be worth considering just how the point, purpose and value of a degree has changed\n\n申请表交代的是学生正在面对的选择。作者让他们在这个时候考虑学位价值，没有给出更晚的申请时间，也没有提出先停下申请。\n\n考虑清楚之后可能照常申请，也可能选择别的道路，单凭considering不能确定要推迟。\n\n**认真考虑大学教育，是否就等于推迟申请？**\n\n不等于。D多出了推迟这个具体行动，原文没有要求。\n\n**第一轮判断：D排除。**","articleRects":[[274,301,1122,38],[202,357,1194,38],[203,412,1192,38],[203,468,707,38]],"questionRects":[[292,634,638,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"26","paragraphPids":[0]},"html":"<h3>D. postpone their undergraduate application</h3>\n<blockquote><p>推迟他们的本科申请</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者建议Ｚ世代推迟他们的本科申请。</p>\n<p>D说postpone申请，回第1段看application form附近有没有时间上的要求。</p>\n<blockquote><p><strong>[xxx]</strong> their undergraduate application form and weigh up their options,</p>\n</blockquote>\n<blockquote><p>it may be worth considering just how the point, purpose and value of a degree has changed</p>\n</blockquote>\n<p>申请表交代的是学生正在面对的选择。作者让他们在这个时候考虑学位价值，没有给出更晚的申请时间，也没有提出先停下申请。</p>\n<p>考虑清楚之后可能照常申请，也可能选择别的道路，单凭considering不能确定要推迟。</p>\n<p><strong>认真考虑大学教育，是否就等于推迟申请？</strong></p>\n<p>不等于。D多出了推迟这个具体行动，原文没有要求。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"26题","raw":"### 26题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一遍只留下C。第1段要求Ｚ世代在选择本科教育路线时重新考虑学位的意义和价值，C可以概括这一建议。","articleRects":[],"questionRects":[[226,412,734,38],[292,468,518,37],[292,523,580,38],[292,579,666,38],[292,634,638,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"26"},"html":"<h3>26题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍只留下C。第1段要求Ｚ世代在选择本科教育路线时重新考虑学位的意义和价值，C可以概括这一建议。</p>\n"},{"section":"27题","raw":"## 27题\n\n> The percentage of UK graduates in non-graduate roles reflects ______.  \n> 英国大学毕业生从事不要求大学学历工作的比例反映了什么？\n\n题干给出的UK graduates和non-graduate roles直接出现在第2段末句。要判断这个比例反映什么，先读完第2段，看数字前面提出了怎样的判断。\n\n> 原文参考：\n> \n> Millennials were told that if you did well in school, got a **[xxx]** degree, you would be set up for life. But that promise has been found **[xxx]**. As degrees became **[xxx]**, they became devalued. Education was no longer a secure route of social mobility. Today, 28 per cent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.\n> \n> 开始精读：\n> \n> Millennials were told that / if you did well in school, / got a **[xxx]** degree, / you would be set up for life. / But that promise has been found **[xxx]**. / As degrees became **[xxx]**, / they became devalued. / Education was no longer a secure route of social mobility. / Today, 28 per cent of graduates in the UK / are in non-graduate roles, / a percentage which is double the average among OECD countries.\n> \n> 千禧一代曾被告知， / 如果你在学校表现优异， / 获得一个**[xxx]**学位， / 你的一生就会有保障。 / 但人们发现，这个承诺是**[xxx]**。 / 随着学位变得**[xxx]**， / 它们也贬值了。 / 教育不再是社会流动的可靠途径。 / 如今，英国28%的毕业生 / 从事不要求大学学历的工作， / 这一比例是经合组织各国平均水平的两倍。\n\n数字说的是大学毕业生就业岗位与其学历不相称的比例。空格要说明作者用这组比例反映了学位或教育哪一方面的变化，需把末句与前面的判断连起来。\n\n接下来按A—D逐项看。","articleRects":[[274,523,1117,38],[202,579,1194,38],[202,635,1194,37],[203,690,1193,38],[202,745,1194,38],[202,801,141,30]],"questionRects":[[226,745,981,38],[292,801,533,37],[292,856,504,38],[292,912,520,37],[292,967,563,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[1],"qid":"27","initialReadingPids":[1]},"html":"<h2>27题</h2>\n<blockquote><p>The percentage of UK graduates in non-graduate roles reflects ______.<br />\n英国大学毕业生从事不要求大学学历工作的比例反映了什么？</p>\n</blockquote>\n<p>题干给出的UK graduates和non-graduate roles直接出现在第2段末句。要判断这个比例反映什么，先读完第2段，看数字前面提出了怎样的判断。</p>\n<blockquote><p>原文参考：</p>\n<p>Millennials were told that if you did well in school, got a <strong>[xxx]</strong> degree, you would be set up for life. But that promise has been found <strong>[xxx]</strong>. As degrees became <strong>[xxx]</strong>, they became devalued. Education was no longer a secure route of social mobility. Today, 28 per cent of graduates in the UK are in non-graduate roles, a percentage which is double the average among OECD countries.</p>\n<p>开始精读：</p>\n<p>Millennials were told that / if you did well in school, / got a <strong>[xxx]</strong> degree, / you would be set up for life. / But that promise has been found <strong>[xxx]</strong>. / As degrees became <strong>[xxx]</strong>, / they became devalued. / Education was no longer a secure route of social mobility. / Today, 28 per cent of graduates in the UK / are in non-graduate roles, / a percentage which is double the average among OECD countries.</p>\n<p>千禧一代曾被告知， / 如果你在学校表现优异， / 获得一个<strong>[xxx]</strong>学位， / 你的一生就会有保障。 / 但人们发现，这个承诺是<strong>[xxx]</strong>。 / 随着学位变得<strong>[xxx]</strong>， / 它们也贬值了。 / 教育不再是社会流动的可靠途径。 / 如今，英国28%的毕业生 / 从事不要求大学学历的工作， / 这一比例是经合组织各国平均水平的两倍。</p>\n</blockquote>\n<p>数字说的是大学毕业生就业岗位与其学历不相称的比例。空格要说明作者用这组比例反映了学位或教育哪一方面的变化，需把末句与前面的判断连起来。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"27题","raw":"### A. Millennials’ opinions about work\n\n> 千禧一代对工作的看法\n\n把A接回题干，它说的是：英国大学毕业生从事不要求大学学历工作的比例反映了千禧一代对工作的看法。\n\nA说千禧一代对工作的看法，回第2段看28 per cent统计的到底是什么。\n\n> Education was no longer a secure route of social mobility.\n\n> 28 per cent of graduates in the UK are in non-graduate roles\n\n前面说过去人们被告知拿到学位就能一生有保障，后面却有不少毕业生从事不要求大学学历的工作。这个比例记录的是就业情况。\n\n它没有调查这些人喜欢什么工作、怎样评价工作。被告知过什么，也不能直接当成他们自己的工作看法。\n\n**毕业生实际做什么工作，能直接说明他们对工作的看法吗？**\n\n不能。这里用就业结果说明学位保障不再可靠，A换成了个人看法。\n\n**第一轮判断：A排除。**","articleRects":[[274,523,1117,38],[202,579,1194,38],[202,635,1194,37],[203,690,1193,38],[202,745,1194,38],[202,801,141,30]],"questionRects":[[292,801,533,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>A. Millennials’ opinions about work</h3>\n<blockquote><p>千禧一代对工作的看法</p>\n</blockquote>\n<p>把A接回题干，它说的是：英国大学毕业生从事不要求大学学历工作的比例反映了千禧一代对工作的看法。</p>\n<p>A说千禧一代对工作的看法，回第2段看28 per cent统计的到底是什么。</p>\n<blockquote><p>Education was no longer a secure route of social mobility.</p>\n</blockquote>\n<blockquote><p>28 per cent of graduates in the UK are in non-graduate roles</p>\n</blockquote>\n<p>前面说过去人们被告知拿到学位就能一生有保障，后面却有不少毕业生从事不要求大学学历的工作。这个比例记录的是就业情况。</p>\n<p>它没有调查这些人喜欢什么工作、怎样评价工作。被告知过什么，也不能直接当成他们自己的工作看法。</p>\n<p><strong>毕业生实际做什么工作，能直接说明他们对工作的看法吗？</strong></p>\n<p>不能。这里用就业结果说明学位保障不再可靠，A换成了个人看法。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"27题","raw":"### B. the shrinking value of a degree\n\n> 学位价值的缩水\n\n把B接回题干，它说的是：英国大学毕业生从事不要求大学学历工作的比例反映了学位价值的缩水。\n\nB说学位价值缩水，回第2段把比例和前面的devalued、no longer连起来。\n\n> As degrees became **[xxx]**, they became devalued.\n\n> Education was no longer a secure route of social mobility.\n\n> 28 per cent of graduates in the UK are in non-graduate roles\n\n过去的许诺是有学位就能得到生活保障，接着作者说学位devalued，教育不再是可靠的社会流动途径。28%的毕业生做着不要求大学学历的工作，就是紧跟着的实际情况。\n\n有了学位却没进入需要它的岗位，学位并没有像原先许诺的那样发挥作用。\n\n**这个比例是在证实学位的保障变强了，还是变弱了？**\n\n变弱了。B的shrinking value与前面的devalued一致，比例也能说明这一点。\n\n**第一轮判断：B保留。**","articleRects":[[274,523,1117,38],[202,579,1194,38],[202,635,1194,37],[203,690,1193,38],[202,745,1194,38],[202,801,141,30]],"questionRects":[[292,856,504,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"27","paragraphPids":[1]},"html":"<h3>B. the shrinking value of a degree</h3>\n<blockquote><p>学位价值的缩水</p>\n</blockquote>\n<p>把B接回题干，它说的是：英国大学毕业生从事不要求大学学历工作的比例反映了学位价值的缩水。</p>\n<p>B说学位价值缩水，回第2段把比例和前面的devalued、no longer连起来。</p>\n<blockquote><p>As degrees became <strong>[xxx]</strong>, they became devalued.</p>\n</blockquote>\n<blockquote><p>Education was no longer a secure route of social mobility.</p>\n</blockquote>\n<blockquote><p>28 per cent of graduates in the UK are in non-graduate roles</p>\n</blockquote>\n<p>过去的许诺是有学位就能得到生活保障，接着作者说学位devalued，教育不再是可靠的社会流动途径。28%的毕业生做着不要求大学学历的工作，就是紧跟着的实际情况。</p>\n<p>有了学位却没进入需要它的岗位，学位并没有像原先许诺的那样发挥作用。</p>\n<p><strong>这个比例是在证实学位的保障变强了，还是变弱了？</strong></p>\n<p>变弱了。B的shrinking value与前面的devalued一致，比例也能说明这一点。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"27题","raw":"### C. public discontent with education\n\n> 公众对教育的不满\n\n把C接回题干，它说的是：英国大学毕业生从事不要求大学学历工作的比例反映了公众对教育的不满。\n\nC说公众不满，回第2段看比例里有没有人表达态度。\n\n> Education was no longer a secure route of social mobility.\n\n> 28 per cent of graduates in the UK are in non-graduate roles\n\n统计只说多少毕业生处在不要求大学学历的岗位上。读到这种情况，我们可能会觉得失望，但文章没有把这种感受记在公众名下。\n\n工作不需要学位是实际处境，是否因此不满还需要当事人的态度或调查。\n\n**28%的就业比例同时也是公众不满的比例吗？**\n\n不是。原文没有统计公众态度，C不能由这个数字直接推出。\n\n**第一轮判断：C排除。**","articleRects":[[274,523,1117,38],[202,579,1194,38],[202,635,1194,37],[203,690,1193,38],[202,745,1194,38],[202,801,141,30]],"questionRects":[[292,912,520,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>C. public discontent with education</h3>\n<blockquote><p>公众对教育的不满</p>\n</blockquote>\n<p>把C接回题干，它说的是：英国大学毕业生从事不要求大学学历工作的比例反映了公众对教育的不满。</p>\n<p>C说公众不满，回第2段看比例里有没有人表达态度。</p>\n<blockquote><p>Education was no longer a secure route of social mobility.</p>\n</blockquote>\n<blockquote><p>28 per cent of graduates in the UK are in non-graduate roles</p>\n</blockquote>\n<p>统计只说多少毕业生处在不要求大学学历的岗位上。读到这种情况，我们可能会觉得失望，但文章没有把这种感受记在公众名下。</p>\n<p>工作不需要学位是实际处境，是否因此不满还需要当事人的态度或调查。</p>\n<p><strong>28%的就业比例同时也是公众不满的比例吗？</strong></p>\n<p>不是。原文没有统计公众态度，C不能由这个数字直接推出。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"27题","raw":"### D. the desired route of social mobility\n\n> 人们期望的社会流动途径\n\n把D接回题干，它说的是：英国大学毕业生从事不要求大学学历工作的比例反映了人们期望的社会流动途径。\n\nD有social mobility，回第2段看它前面的限定。\n\n> Education was no longer a secure route of social mobility.\n\n> 28 per cent of graduates in the UK are in non-graduate roles\n\n原文确实出现社会流动途径，但完整说法是Education was no longer a secure route。no longer表明过去以为可靠的途径如今不再可靠。\n\n后面的就业比例继续说明这一落差，并不是在展示人们期望怎样实现社会流动。\n\n**这个数字支持的是一条理想途径，还是原有许诺落空了？**\n\n支持后者。D拿出了原文的名词，却没有接住作者对这条途径的否定。\n\n**第一轮判断：D排除。**","articleRects":[[274,523,1117,38],[202,579,1194,38],[202,635,1194,37],[203,690,1193,38],[202,745,1194,38],[202,801,141,30]],"questionRects":[[292,967,563,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"27","paragraphPids":[1]},"html":"<h3>D. the desired route of social mobility</h3>\n<blockquote><p>人们期望的社会流动途径</p>\n</blockquote>\n<p>把D接回题干，它说的是：英国大学毕业生从事不要求大学学历工作的比例反映了人们期望的社会流动途径。</p>\n<p>D有social mobility，回第2段看它前面的限定。</p>\n<blockquote><p>Education was no longer a secure route of social mobility.</p>\n</blockquote>\n<blockquote><p>28 per cent of graduates in the UK are in non-graduate roles</p>\n</blockquote>\n<p>原文确实出现社会流动途径，但完整说法是Education was no longer a secure route。no longer表明过去以为可靠的途径如今不再可靠。</p>\n<p>后面的就业比例继续说明这一落差，并不是在展示人们期望怎样实现社会流动。</p>\n<p><strong>这个数字支持的是一条理想途径，还是原有许诺落空了？</strong></p>\n<p>支持后者。D拿出了原文的名词，却没有接住作者对这条途径的否定。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"27题","raw":"### 27题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n第一遍只留下B。毕业生进入不要求大学学历岗位的比例，承接的是学位贬值、教育不再可靠促进社会流动的判断。","articleRects":[],"questionRects":[[226,745,981,38],[292,801,533,37],[292,856,504,38],[292,912,520,37],[292,967,563,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"27"},"html":"<h3>27题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一遍只留下B。毕业生进入不要求大学学历岗位的比例，承接的是学位贬值、教育不再可靠促进社会流动的判断。</p>\n"},{"section":"28题","raw":"## 28题\n\n> The author considers it a good sign that ______.  \n> 作者认为哪一种情况是一个好迹象？\n\n题干的a good sign让人想到第4段开头的Thankfully和there are signs。先读第4段；其中this is already happening需要接上前文，因此也完整读第3段，确认作者在称许什么变化。\n\n> 原文参考：\n> \n> Thankfully , there are signs that this is already happening, with Generation Z seeking to learn from their millennial **[xxx]**, even if parents and teachers tend to be still set in the degree mindset. Employers have long seen the advantages of hiring school leavers who often prove themselves to be more **[xxx]** and loyal employees than graduates. Many too are seeing the advantages of scrapping a degree requirement for certain roles.\n> \n> 开始精读：\n> \n> Thankfully , there are signs that this is already happening, / with Generation Z seeking to learn from their millennial **[xxx]**, / even if parents and teachers tend to be still set in the degree mindset. / Employers have long seen the advantages of hiring school leavers / who often prove themselves to be more **[xxx]** and loyal employees than graduates. / Many too are seeing the advantages of scrapping a degree requirement for certain roles.\n> \n> 值得庆幸的是，有迹象表明这已经在发生， / Ｚ世代正试图向他们的千禧一代**[xxx]**学习， / 即使父母和教师往往仍然固守学位观念。 / 雇主早已看到了聘用中学毕业生的好处， / 这些人常常证明，自己是比大学毕业生更**[xxx]**、更忠诚的员工。 / 许多雇主也正在看到取消某些岗位学位要求的好处。\n\n> 原文参考：\n> \n> This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an **[xxx]** one and that other options are available.\n> \n> 开始精读：\n> \n> This is not to say that there is no point in getting a degree, / but rather stress that a degree is not for everyone, / that the switch from classroom to lecture hall is not an **[xxx]** one / and that other options are available.\n> \n> 这并不是说获得学位没有意义， / 而是强调学位并不适合每个人， / 强调从中学课堂转到大学讲堂不是一种**[xxx]**转变， / 以及还有其他选择。\n\n第3段说学位并不适合所有人，而且还有其他选择；第4段接着称许已经发生的变化。空格要补作者肯定的具体人或群体正在怎样对待教育与用人选择。\n\n接下来按A—D逐项看。","articleRects":[[274,856,1122,38],[202,912,1194,37],[203,967,844,38],[274,1023,1122,38],[440,1044,8,15],[203,1078,1193,38],[202,1134,1194,38],[203,1189,1193,38],[202,1245,1194,38],[203,1300,920,38]],"questionRects":[[226,1078,654,38],[292,1134,771,38],[292,1189,740,38],[292,1241,784,45],[292,1300,767,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[2,3],"qid":"28","initialReadingPids":[2,3]},"html":"<h2>28题</h2>\n<blockquote><p>The author considers it a good sign that ______.<br />\n作者认为哪一种情况是一个好迹象？</p>\n</blockquote>\n<p>题干的a good sign让人想到第4段开头的Thankfully和there are signs。先读第4段；其中this is already happening需要接上前文，因此也完整读第3段，确认作者在称许什么变化。</p>\n<blockquote><p>原文参考：</p>\n<p>Thankfully , there are signs that this is already happening, with Generation Z seeking to learn from their millennial <strong>[xxx]</strong>, even if parents and teachers tend to be still set in the degree mindset. Employers have long seen the advantages of hiring school leavers who often prove themselves to be more <strong>[xxx]</strong> and loyal employees than graduates. Many too are seeing the advantages of scrapping a degree requirement for certain roles.</p>\n<p>开始精读：</p>\n<p>Thankfully , there are signs that this is already happening, / with Generation Z seeking to learn from their millennial <strong>[xxx]</strong>, / even if parents and teachers tend to be still set in the degree mindset. / Employers have long seen the advantages of hiring school leavers / who often prove themselves to be more <strong>[xxx]</strong> and loyal employees than graduates. / Many too are seeing the advantages of scrapping a degree requirement for certain roles.</p>\n<p>值得庆幸的是，有迹象表明这已经在发生， / Ｚ世代正试图向他们的千禧一代<strong>[xxx]</strong>学习， / 即使父母和教师往往仍然固守学位观念。 / 雇主早已看到了聘用中学毕业生的好处， / 这些人常常证明，自己是比大学毕业生更<strong>[xxx]</strong>、更忠诚的员工。 / 许多雇主也正在看到取消某些岗位学位要求的好处。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an <strong>[xxx]</strong> one and that other options are available.</p>\n<p>开始精读：</p>\n<p>This is not to say that there is no point in getting a degree, / but rather stress that a degree is not for everyone, / that the switch from classroom to lecture hall is not an <strong>[xxx]</strong> one / and that other options are available.</p>\n<p>这并不是说获得学位没有意义， / 而是强调学位并不适合每个人， / 强调从中学课堂转到大学讲堂不是一种<strong>[xxx]</strong>转变， / 以及还有其他选择。</p>\n</blockquote>\n<p>第3段说学位并不适合所有人，而且还有其他选择；第4段接着称许已经发生的变化。空格要补作者肯定的具体人或群体正在怎样对待教育与用人选择。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"28题","raw":"### A. Generation Z are seeking to earn a **[xxx]** degree\n\n> Ｚ世代正在寻求获得一个**[xxx]**学位\n\n把A接回题干，它说的是：作者认为Ｚ世代正在寻求获得一个**[xxx]**学位是好迹象。\n\nA说Ｚ世代寻求一个[xxx]学位，回第3、4段看Thankfully承接什么。\n\n> a degree is not for everyone\n\n> other options are available.\n\n> with Generation Z seeking to learn from their millennial **[xxx]**,\n\n第3段先说学位不适合每一个人，还有其他选择。第4段的好迹象承接的是有人已经开始这样考虑，而父母和老师反倒仍困在degree mindset里。\n\nA的学位修饰词暂时不认识，但主干仍然是寻求获得学位。它没有说跳出只认学位的想法，也没有说考虑其他道路。\n\n**只看已经认识的主干，A是否写出了作者称赞的变化？**\n\n没有。作者称赞的是开始考虑不同道路，A只写继续追求某个学位，接不上这层意思。\n\n**第一轮判断：A排除。**","articleRects":[[274,856,1122,38],[202,912,1194,37],[203,967,844,38],[274,1023,1122,38],[440,1044,8,15],[203,1078,1193,38],[202,1134,1194,38],[203,1189,1193,38],[202,1245,1194,38],[203,1300,920,38]],"questionRects":[[292,1134,771,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"28","paragraphPids":[2,3]},"html":"<h3>A. Generation Z are seeking to earn a <strong>[xxx]</strong> degree</h3>\n<blockquote><p>Ｚ世代正在寻求获得一个<strong>[xxx]</strong>学位</p>\n</blockquote>\n<p>把A接回题干，它说的是：作者认为Ｚ世代正在寻求获得一个<strong>[xxx]</strong>学位是好迹象。</p>\n<p>A说Ｚ世代寻求一个[xxx]学位，回第3、4段看Thankfully承接什么。</p>\n<blockquote><p>a degree is not for everyone</p>\n</blockquote>\n<blockquote><p>other options are available.</p>\n</blockquote>\n<blockquote><p>with Generation Z seeking to learn from their millennial <strong>[xxx]</strong>,</p>\n</blockquote>\n<p>第3段先说学位不适合每一个人，还有其他选择。第4段的好迹象承接的是有人已经开始这样考虑，而父母和老师反倒仍困在degree mindset里。</p>\n<p>A的学位修饰词暂时不认识，但主干仍然是寻求获得学位。它没有说跳出只认学位的想法，也没有说考虑其他道路。</p>\n<p><strong>只看已经认识的主干，A是否写出了作者称赞的变化？</strong></p>\n<p>没有。作者称赞的是开始考虑不同道路，A只写继续追求某个学位，接不上这层意思。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"28题","raw":"### B. school leavers are willing to be skilled workers\n\n> 中学毕业生愿意成为熟练工人\n\n把B接回题干，它说的是：作者认为中学毕业生愿意成为熟练工人是好迹象。\n\nB说中学毕业生愿意成为熟练工人，回第4段看school leavers后面的动作是谁做的。\n\n> Employers have long seen the advantages of hiring school leavers who often prove themselves to be more **[xxx]** and loyal employees than graduates.\n\n句子说雇主早已看到了雇用中学毕业生的好处，这些人常能证明自己是更[xxx]、更忠诚的员工。说的是雇主的发现和员工的表现。\n\nB改成中学毕业生自己的愿望，还具体说要成为skilled workers。原文这句话没有让他们表达这种职业选择。\n\n**雇主愿意雇用他们，是否就说明他们愿意成为熟练工人？**\n\n不能这样倒过来。B换了作出选择的人，也添了具体工种。\n\n**第一轮判断：B排除。**","articleRects":[[274,1023,1122,38],[440,1044,8,15],[203,1078,1193,38],[202,1134,1194,38],[203,1189,1193,38],[202,1245,1194,38],[203,1300,920,38]],"questionRects":[[292,1189,740,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"28","paragraphPids":[3]},"ht ，loyal和取消学位门槛这两处也能让我们看出：雇主在看实际工作需要。</p>\n<p><strong>不再把大学学位当作某些岗位的硬门槛，是否是更务实的做法？</strong></p>\n<p>是。C能同时接上重视实际表现和调整学历要求，可以保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"28题","raw":"### D. parents are changing their minds about education\n\n> 父母正在改变对教育的看法\n\n把D接回题干，它说的是：作者认为父母正在改变对教育的看法是好迹象。\n\nD说父母正在改想法，回第4段找parents。\n\n> even if parents and teachers tend to be still set in the degree mindset.\n\n原文是even if parents and teachers tend to be still set in the degree mindset。still说明原来的想法仍在，even if把这种情况作为与前面好迹象并存的阻力。\n\n开始从上一代经验中学习的是Ｚ世代，不能把他们的变化安到父母身上。\n\n**父母这里是正在改变，还是仍坚持原来的学位观念？**\n\n是仍坚持原来的观念。D的changing与still set相反。\n\n**第一轮判断：D排除。**","articleRects":[[274,1023,1122,38],[440,1044,8,15],[203,1078,1193,38],[202,1134,1194,38],[203,1189,1193,38],[202,1245,1194,38],[203,1300,920,38]],"questionRects":[[292,1300,767,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"28","paragraphPids":[3]},"html":"<h3>D. parents are changing their minds about education</h3>\n<blockquote><p>父母正在改变对教育的看法</p>\n</blockquote>\n<p>把D接回题干，它说的是：作者认为父母正在改变对教育的看法是好迹象。</p>\n<p>D说父母正在改想法，回第4段找parents。</p>\n<blockquote><p>even if parents and teachers tend to be still set in the degree mindset.</p>\n</blockquote>\n<p>原文是even if parents and teachers tend to be still set in the degree mindset。still说明原来的想法仍在，even if把这种情况作为与前面好迹象并存的阻力。</p>\n<p>开始从上一代经验中学习的是Ｚ世代，不能把他们的变化安到父母身上。</p>\n<p><strong>父母这里是正在改变，还是仍坚持原来的学位观念？</strong></p>\n<p>是仍坚持原来的观念。D的changing与still set相反。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"28题","raw":"### 28题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一遍只留下C。第4段认可雇主聘用中学毕业生、取消某些岗位学位要求的好处，可以概括为务实地看待学位。","articleRects":[],"questionRects":[[226,1078,654,38],[292,1134,771,38],[292,1189,740,38],[292,1241,784,45],[292,1300,767,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"28"},"html":"<h3>28题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍只留下C。第4段认可雇主聘用中学毕业生、取消某些岗位学位要求的好处，可以概括为务实地看待学位。</p>\n"},{"section":"29题","raw":"## 29题\n\n> It is advised in Paragraph 5 that those with one degree should ______.  \n> 第5段建议已经拥有一个学位的人怎样做？\n\n题干直接给出Paragraph 5和those with one degree，完整读第5段，重点理解作者怎样从第一个学位谈到此后的选择。\n\n> 原文参考：\n> \n> For those for whom a degree is the desired route, consider that this may well be the first of many. In this age of **[xxx]**, it pays to have specific knowledge or skills. Postgraduates now earn 40 per cent more than graduates. When more and more of us have a degree, it makes sense to have two.\n> \n> 开始精读：\n> \n> For those for whom a degree is the desired route, / consider that this may well be the first of many. / In this age of **[xxx]**, / it pays to have specific knowledge or skills. / Postgraduates now earn 40 per cent more than graduates. / When more and more of us have a degree, / it makes sense to have two.\n> \n> 对于那些希望走获取学位这条路的人， / 要考虑到这很可能是许多学位中的第一个。 / 在这个**[xxx]**的时代， / 拥有专门的知识或技能是有益的。 / 研究生现在比大学毕业生多挣40%。 / 当我们中有越来越多的人拥有一个学位时， / 拥有两个学位是有道理的。\n\n第5段从the first of many谈起，又比较研究生与大学毕业生的收入，最后写it makes sense to have two。空格要补的是作者对已经有一个学位者的进一步建议。\n\n接下来按A—D逐项看。","articleRects":[[273,1352,1123,45],[203,1411,1193,38],[202,1467,1194,37],[203,1522,873,38]],"questionRects":[[226,1411,977,38],[292,1466,612,38],[292,1522,564,38],[292,1577,595,38],[292,1633,604,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"29","initialReadingPids":[4]},"html":"<h2>29题</h2>\n<blockquote><p>It is advised in Paragraph 5 that those with one degree should ______.<br />\n第5段建议已经拥有一个学位的人怎样做？</p>\n</blockquote>\n<p>题干直接给出Paragraph 5和those with one degree，完整读第5段，重点理解作者怎样从第一个学位谈到此后的选择。</p>\n<blockquote><p>原文参考：</p>\n<p>For those for whom a degree is the desired route, consider that this may well be the first of many. In this age of <strong>[xxx]</strong>, it pays to have specific knowledge or skills. Postgraduates now earn 40 per cent more than graduates. When more and more of us have a degree, it makes sense to have two.</p>\n<p>开始精读：</p>\n<p>For those for whom a degree is the desired route, / consider that this may well be the first of many. / In this age of <strong>[xxx]</strong>, / it pays to have specific knowledge or skills. / Postgraduates now earn 40 per cent more than graduates. / When more and more of us have a degree, / it makes sense to have two.</p>\n<p>对于那些希望走获取学位这条路的人， / 要考虑到这很可能是许多学位中的第一个。 / 在这个<strong>[xxx]</strong>的时代， / 拥有专门的知识或技能是有益的。 / 研究生现在比大学毕业生多挣40%。 / 当我们中有越来越多的人拥有一个学位时， / 拥有两个学位是有道理的。</p>\n</blockquote>\n<p>第5段从the first of many谈起，又比较研究生与大学毕业生的收入，最后写it makes sense to have two。空格要补的是作者对已经有一个学位者的进一步建议。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"29题","raw":"### A. make an early decision on their career\n\n> 早日就自己的职业作出决定\n\n把A接回题干，它说的是：第5段建议已经拥有一个学位的人早日就自己的职业作出决定。\n\nA说早决定职业，回第5段看建议围绕什么展开。\n\n> consider that this may well be the first of many.\n\n> it makes sense to have two.\n\n这一段先说一个学位可能只是许多个中的第一个，随后说具体知识或技能有价值，再用研究生收入作比较。\n\n这些内容连着说明已经有学位的人可以继续学习，没有交代应在多早的时候确定职业。\n\n**这一段比较的是决定职业的早晚，还是继续学习带来的收获？**\n\n是后者。A提出的时间要求没有出处。\n\n**第一轮判断：A排除。**","articleRects":[[273,1352,1123,45],[203,1411,1193,38],[202,1467,1194,37],[203,1522,873,38]],"questionRects":[[292,1466,612,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>A. make an early decision on their career</h3>\n<blockquote><p>早日就自己的职业作出决定</p>\n</blockquote>\n<p>把A接回题干，它说的是：第5段建议已经拥有一个学位的人早日就自己的职业作出决定。</p>\n<p>A说早决定职业，回第5段看建议围绕什么展开。</p>\n<blockquote><p>consider that this may well be the first of many.</p>\n</blockquote>\n<blockquote><p>it makes sense to have two.</p>\n</blockquote>\n<p>这一段先说一个学位可能只是许多个中的第一个，随后说具体知识或技能有价值，再用研究生收入作比较。</p>\n<p>这些内容连着说明已经有学位的人可以继续学习，没有交代应在多早的时候确定职业。</p>\n<p><strong>这一段比较的是决定职业的早晚，还是继续学习带来的收获？</strong></p>\n<p>是后者。A提出的时间要求没有出处。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"29题","raw":"### B. attend on-the-job training programs\n\n> 参加在职培训项目\n\n把B接回题干，它说的是：第5段建议已经拥有一个学位的人参加在职培训项目。\n\nB说在职培训，回第5段看作者给出的深造方式。\n\n> it pays to have specific knowledge or skills.\n\n> Postgraduates now earn 40 per cent more than graduates.\n\n> it makes sense to have two.\n\n文中确实提到知识和技能，但紧接着举的是postgraduates与graduates的收入差别，结尾又说有一个学位时，再有两个是有道理的。\n\n在职培训也可能提高技能，可作者这里明确沿着继续取得学位展开。不能把任何提升技能的方法都当成本段的具体建议。\n\n**第5段给出的例子能把建议落实到在职培训吗？**\n\n不能。研究生和更多学位指向继续深造，B换成了文中未提的培训项目。\n\n**第一轮判断：B排除。**","articleRects":[[273,1352,1123,45],[203,1411,1193,38],[202,1467,1194,37],[203,1522,873,38]],"questionRects":[[292,1522,564,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>B. attend on-the-job training programs</h3>\n<blockquote><p>参加在职培训项目</p>\n</blockquote>\n<p>把B接回题干，它说的是：第5段建议已经拥有一个学位的人参加在职培训项目。</p>\n<p>B说在职培训，回第5段看作者给出的深造方式。</p>\n<blockquote><p>it pays to have specific knowledge or skills.</p>\n</blockquote>\n<blockquote><p>Postgraduates now earn 40 per cent more than graduates.</p>\n</blockquote>\n<blockquote><p>it makes sense to have two.</p>\n</blockquote>\n<p>文中确实提到知识和技能，但紧接着举的是postgraduates与graduates的收入差别，结尾又说有一个学位时，再有两个是有道理的。</p>\n<p>在职培训也可能提高技能，可作者这里明确沿着继续取得学位展开。不能把任何提升技能的方法都当成本段的具体建议。</p>\n<p><strong>第5段给出的例子能把建议落实到在职培训吗？</strong></p>\n<p>不能。研究生和更多学位指向继续深造，B换成了文中未提的培训项目。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"29题","raw":"### C. team up with high-paid postgraduates\n\n> 与高收入的研究生合作\n\n把C接回题干，它说的是：第5段建议已经拥有一个学位的人与高收入的研究生合作。\n\nC提到高收入研究生，回第5段看他们被拿来做什么比较。\n\n> Postgraduates now earn 40 per cent more than graduates.\n\n> When more and more of us have a degree, it makes sense to have two.\n\nPostgraduates now earn 40 per cent more than graduates是在比较两类人的收入。后面说it makes sense to have two，把建议落到了自己继续取得学位上。\n\nC却让已有学位的人去和研究生组队，原文没有写两类人合作会带来什么收益。\n\n**看到研究生收入更高，作者建议的是向他们合作，还是自己继续学？**\n\n是自己继续学。C把收入比较改成了合作建议。\n\n**第一轮判断：C排除。**","articleRects":[[273,1352,1123,45],[203,1411,1193,38],[202,1467,1194,37],[203,1522,873,38]],"questionRects":[[292,1577,595,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"29","paragraphPids":[4]},"html":"<h3>C. team up with high-paid postgraduates</h3>\n<blockquote><p>与高收入的研究生合作</p>\n</blockquote>\n<p>把C接回题干，它说的是：第5段建议已经拥有一个学位的人与高收入的研究生合作。</p>\n<p>C提到高收入研究生，回第5段看他们被拿来做什么比较。</p>\n<blockquote><p>Postgraduates now earn 40 per cent more than graduates.</p>\n</blockquote>\n<blockquote><p>When more and more of us have a degree, it makes sense to have two.</p>\n</blockquote>\n<p>Postgraduates now earn 40 per cent more than graduates是在比较两类人的收入。后面说it makes sense to have two，把建议落到了自己继续取得学位上。</p>\n<p>C却让已有学位的人去和研究生组队，原文没有写两类人合作会带来什么收益。</p>\n<p><strong>看到研究生收入更高，作者建议的是向他们合作，还是自己继续学？</strong></p>\n<p>是自己继续学。C把收入比较改成了合作建议。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"29题","raw":"### D. further their studies in a specific field\n\n> 在一个特定领域继续深造\n\n把D接回题干，它说的是：第5段建议已经拥有一个学位的人在一个特定领域继续深造。\n\nD说在特定领域深造，回第5段连接specific knowledge or skills与more than one degree。\n\n> it pays to have specific knowledge or skills.\n\n> Postgraduates now earn 40 per cent more than graduates.\n\n> it makes sense to have two.\n\n作者先说具体知识或技能有价值，再说研究生收入更高，最后提出不妨拥有第二个学位。这三句都把已经拿到学位的人往继续学习引。\n\nD既保留了specific所说的专门知识，也写出了further studies这一步，不要求我们另加一种文中没提的培训方式。\n\n**特定知识、研究生和更多学位，能否共同支持继续深造？**\n\n能。D把本段建议完整接住，可以保留。\n\n**第一轮判断：D保留。**","articleRects":[[273,1352,1123,45],[203,1411,1193,38],[202,1467,1194,37],[203,1522,873,38]],"questionRects":[[292,1633,604,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"保留","qid":"29","paragraphPids":[4]},"html":"<h3>D. further their studies in a specific field</h3>\n<blockquote><p>在一个特定领域继续深造</p>\n</blockquote>\n<p>把D接回题干，它说的是：第5段建议已经拥有一个学位的人在一个特定领域继续深造。</p>\n<p>D说在特定领域深造，回第5段连接specific knowledge or skills与more than one degree。</p>\n<blockquote><p>it pays to have specific knowledge or skills.</p>\n</blockquote>\n<blockquote><p>Postgraduates now earn 40 per cent more than graduates.</p>\n</blockquote>\n<blockquote><p>it makes sense to have two.</p>\n</blockquote>\n<p>作者先说具体知识或技能有价值，再说研究生收入更高，最后提出不妨拥有第二个学位。这三句都把已经拿到学位的人往继续学习引。</p>\n<p>D既保留了specific所说的专门知识，也写出了further studies这一步，不要求我们另加一种文中没提的培训方式。</p>\n<p><strong>特定知识、研究生和更多学位，能否共同支持继续深造？</strong></p>\n<p>能。D把本段建议完整接住，可以保留。</p>\n<p><strong>第一轮判断：D保留。</strong></p>\n"},{"section":"29题","raw":"### 29题第一次结果\n\n- A排除。\n- B排除。\n- C排除。\n- D保留。\n\n当前选择：D。\n\n第一遍只留下D。第5段把专门知识技能的价值、研究生收入和拥有两个学位相连，建议已有学位者继续在专门领域深造。","articleRects":[],"questionRects":[[226,1411,977,38],[292,1466,612,38],[292,1522,564,38],[292,1577,595,38],[292,1633,604,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"29"},"html":"<h3>29题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C排除。</li><li>D保留。</li></ul>\n<p>当前选择：D。</p>\n<p>第一遍只留下D。第5段把专门知识技能的价值、研究生收入和拥有两个学位相连，建议已有学位者继续在专门领域深造。</p>\n"},{"section":"30题","raw":"## 30题\n\n> What can be concluded about Generation Z from the last two paragraphs?  \n> 根据最后两段，可以对Ｚ世代得出什么结论？\n\n题干明确限定the last two paragraphs，即第6、7段。两段分别谈整个职业生涯中的教育，以及学位与个人身份的关系，需要把两段完整读完再作推断。\n\n> 原文参考：\n> \n> It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay **[xxx]**. It has been estimated that this generation, due to the pressures of technology, the wish for personal **[xxx]** and desire for **[xxx]**, will work for 17 different employers over the course of their working life and have five different careers. Education, and not just knowledge gained on campus, will be a core part of Generation Z’s career **[xxx]**.\n> \n> 开始精读：\n> \n> It is unlikely that Generation Z will be done with education at 18 or 21; / they will need to be constantly up-skilling throughout their career / to stay **[xxx]**. / It has been estimated that this generation, / due to the pressures of technology, / the wish for personal **[xxx]** and desire for **[xxx]**, / will work for 17 different employers over the course of their working life / and have five different careers. / Education, and not just knowledge gained on campus, / will be a core part of Generation Z’s career **[xxx]**.\n> \n> Ｚ世代不太可能在18岁或21岁时就结束受教育； / 他们将需要在整个职业生涯中不断提升技能， / 以保持**[xxx]**。 / 据估计，这一代人， / 由于技术的压力， / 对个人**[xxx]**的愿望，以及对**[xxx]**的渴望， / 将在一生的工作岁月里为17个不同的雇主工作， / 并从事五种不同的职业。 / 教育，而不仅仅是在校园获得的知识， / 将成为Ｚ世代职业**[xxx]**的核心部分。\n\n> 原文参考：\n> \n> Older generations often talk about their degree in the present and personal **[xxx]**: ‘I am a geographer’ or ‘I am a **[xxx]**’. Their sons or daughters would never say such a thing; it’s as if they already know that their degree won’t define them in the same way.\n> \n> 开始精读：\n> \n> Older generations often talk about their degree / in the present and personal **[xxx]**: / ‘I am a geographer’ or ‘I am a **[xxx]**’. / Their sons or daughters would never say such a thing; / it’s as if they already know / that their degree won’t define them in the same way.\n> \n> 年长的几代人常常谈论他们的学位， / 用现在时以及个人的**[xxx]**： / “我是一名地理学者”，或“我是一名**[xxx]**”。 / 他们的儿子或女儿绝不会这样说； / 就好像他们已经知道， / 自己的学位不会以同样的方式界定自己。\n\n第6段预计Ｚ世代会持续提升技能、经历多个雇主和职业，第7段比较他们与上一代怎样用学位描述自己。空格要归纳这些事实共同说明的Ｚ世代特点。\n\n接下来按A—D逐项看。","articleRects":[[274,1578,1122,37],[202,1633,1184,38],[202,1689,1194,38],[202,1744,1194,38],[202,1800,1184,37],[202,1855,1197,38],[202,1911,475,37],[274,1966,1120,38],[228,2269,1194,47],[227,2326,1194,46],[227,2386,336,37]],"questionRects":[[226,1744,1153,38],[292,1800,560,37],[292,1855,572,38],[292,1911,619,37],[292,1966,638,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5,6],"qid":"30","initialReadingPids":[5,6]},"html":"<h2>30题</h2>\n<blockquote><p>What can be concluded about Generation Z from the last two paragraphs?<br />\n根据最后两段，可以对Ｚ世代得出什么结论？</p>\n</blockquote>\n<p>题干明确限定the last two paragraphs，即第6、7段。两段分别谈整个职业生涯中的教育，以及学位与个人身份的关系，需要把两段完整读完再作推断。</p>\n<blockquote><p>原文参考：</p>\n<p>It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly up-skilling throughout their career to stay <strong>[xxx]</strong>. It has been estimated that this gener n\n> 他们将成为合格的教育工作者\n\n把B接回题干，它说的是：从最后两段可以得出，Ｚ世代将成为合格的教育工作者。\n\nB说成为教育工作者，回第6段看education与他们的关系。\n\n> It is unlikely that Generation Z will be done with education at 18 or 21;\n\n> they will need to be constantly up-skilling throughout their career\n\n> Education, and not just knowledge gained on campus, will be a core part of Generation Z’s career **[xxx]**.\n\n这里反复说他们需要提升技能、继续接受教育。他们是要不断学习的人，不是已经被描述为教别人学习的人。\n\n段落提到会换雇主、换职业，却没有指定教育行业，也没有评价他们是否具备教师资格。\n\n**接受更多教育，是否就意味着以后会从事教育？**\n\n不意味着。B把学习者换成了教育工作者。\n\n**第一轮判断：B排除。**","articleRects":[[274,1578,1122,37],[202,1633,1184,38],[202,1689,1194,38],[202,1744,1194,38],[202,1800,1184,37],[202,1855,1197,38],[202,1911,475,37]],"questionRects":[[292,1855,572,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"30","paragraphPids":[5]},"html":"<h3>B. They will make qualified educators.</h3>\n<blockquote><p>他们将成为合格的教育工作者</p>\n</blockquote>\n<p>把B接回题干，它说的是：从最后两段可以得出，Ｚ世代将成为合格的教育工作者。</p>\n<p>B说成为教育工作者，回第6段看education与他们的关系。</p>\n<blockquote><p>It is unlikely that Generation Z will be done with education at 18 or 21;</p>\n</blockquote>\n<blockquote><p>they will need to be constantly up-skilling throughout their career</p>\n</blockquote>\n<blockquote><p>Education, and not just knowledge gained on campus, will be a core part of Generation Z’s career <strong>[xxx]</strong>.</p>\n</blockquote>\n<p>这里反复说他们需要提升技能、继续接受教育。他们是要不断学习的人，不是已经被描述为教别人学习的人。</p>\n<p>段落提到会换雇主、换职业，却没有指定教育行业，也没有评价他们是否具备教师资格。</p>\n<p><strong>接受更多教育，是否就意味着以后会从事教育？</strong></p>\n<p>不意味着。B把学习者换成了教育工作者。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"30题","raw":"### C. Degrees will no longer appeal to them.\n\n> 学位将不再吸引他们\n\n把C接回题干，它说的是：从最后两段可以得出，学位将不再吸引Ｚ世代。\n\nC说学位不再有吸引力，回末段看won’t define them具体否定了什么。\n\n> ‘I am a geographer’\n\n> Their sons or daughters would never say such a thing;\n\n> their degree won’t define them in the same way.\n\n父辈会用所学专业称呼自己，子女不再如此，是因为一个学位不会以同样的方式界定他们。没有用学位来定义自己，并不等于不愿意取得学位。\n\n前面还说学位可能不止一个，之后也会继续学习。C的no longer appeal把不再定义身份改成了失去吸引力。\n\n**不把一个学位当成终身身份，是否就是不想要学位？**\n\n不是。他们仍可能读学位，只是不让它固定自己一生的方向。\n\n**第一轮判断：C排除。**","articleRects":[[274,1966,1120,38],[228,2269,1194,47],[227,2326,1194,46],[227,2386,336,37]],"questionRects":[[292,1911,619,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"30","paragraphPids":[6]},"html":"<h3>C. Degrees will no longer appeal to them.</h3>\n<blockquote><p>学位将不再吸引他们</p>\n</blockquote>\n<p>把C接回题干，它说的是：从最后两段可以得出，学位将不再吸引Ｚ世代。</p>\n<p>C说学位不再有吸引力，回末段看won’t define them具体否定了什么。</p>\n<blockquote><p>‘I am a geographer’</p>\n</blockquote>\n<blockquote><p>Their sons or daughters would never say such a thing;</p>\n</blockquote>\n<blockquote><p>their degree won’t define them in the same way.</p>\n</blockquote>\n<p>父辈会用所学专业称呼自己，子女不再如此，是因为一个学位不会以同样的方式界定他们。没有用学位来定义自己，并不等于不愿意取得学位。</p>\n<p>前面还说学位可能不止一个，之后也会继续学习。C的no longer appeal把不再定义身份改成了失去吸引力。</p>\n<p><strong>不把一个学位当成终身身份，是否就是不想要学位？</strong></p>\n<p>不是。他们仍可能读学位，只是不让它固定自己一生的方向。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"30题","raw":"### D. They will have a limited choice of jobs.\n\n> 他们将只有有限的工作选择\n\n把D接回题干，它说的是：从最后两段可以得出，Ｚ世代将只有有限的工作选择。\n\nD说工作选择有限，回第6段看17个雇主、5种职业怎样使用。\n\n> constantly up-skilling throughout their career\n\n> will work for 17 different employers over the course of their working life and have five different careers.\n\n这些数字描写的是他们在整个工作生涯中可能经历多次变化。作者因此提出要不断更新技能，让教育伴随职业发展。\n\n数字并没有列出有哪些职位向他们关闭，也没有与其他世代比较可选岗位多少。多次换工作也不能反过来证明选择受限。\n\n**这两个数字直接说明的是选择少，还是职业经历会不断变化？**\n\n是后者。D所说的选择有限没有在这段得到说明。\n\n**第一轮判断：D排除。**","articleRects":[[274,1578,1122,37],[202,1633,1184,38],[202,1689,1194,38],[202,1744,1194,38],[202,1800,1184,37],[202,1855,1197,38],[202,1911,475,37]],"questionRects":[[292,1966,638,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"30","paragraphPids":[5]},"html":"<h3>D. They will have a limited choice of jobs.</h3>\n<blockquote><p>他们将只有有限的工作选择</p>\n</blockquote>\n<p>把D接回题干，它说的是：从最后两段可以得出，Ｚ世代将只 is is already happening承接教育选择的变化：Ｚ世代开始向千禧一代学习，而父母和教师往往仍固守学位观念。随后，雇主看到聘用中学毕业生的好处，也看到scrapping a degree requirement for certain roles的好处。用人方对具体岗位学位门槛的重新评估，进一步说明教育与职业之间的关系正在变化。 | 从学生与雇主两方展示教育选择和岗位门槛正在变化。 |\n| 第5段 | the first of many；specific knowledge or skills | 转向仍希望选择学位路线的人，用the first of many提醒他们第一次取得学位未必是终点。specific knowledge or skills的价值、研究生较高的收入和it makes sense to have two连在一起，支持在专门领域进一步学习。它补充第3段的分流建议，说明选择读大学的人也需要重新理解后续教育。 | 补充仍选择大学路线者的方向，说明专门领域的进一步学习仍有价值。 |\n| 第6段 | constantly up-skilling throughout their career；not just knowledge gained on campus | 把讨论扩大到整个职业生涯。constantly up-skilling throughout their career明确要求持续提升技能，17 different employers和five different careers则预计工作经历会不断变化。作者又把教育扩展到not just knowledge gained on campus，说明学习不能只停留在取得一个校园学位的阶段。 | 将教育扩展到变化中的整个职业生涯，提出持续学习要求。 |\n| 第7段 | their degree won’t define them in the same way | 以两代人谈论学位的方式作结。上一代会说I am a geographer，子女却不会这样用学位描述自己；their degree won’t define them in the same way点出单个学位与个人身份的关系发生变化。这一对照承接第6段不断变化的职业经历和持续学习要求，收束全文对学位意义的重新思考。 | 用两代人自我介绍的差异回应开头，收束对单个学位意义的重新思考。 |\n\n全文观点：Ｚ世代应重新评估大学学位对自己的意义和必要性。学位不再稳妥地保证相应回报，因此教育路线需要结合个人情况选择；对于继续走学位路线的人，专门领域的进一步学习仍有价值。贯穿职业生涯、超出校园范围的持续学习，将比把一个学位当作固定身份更能体现这一代人的教育与职业特点。","articleRects":[[274,301,1122,38],[202,357,1194,38],[203,412,1192,38],[203,468,707,38],[274,523,1117,38],[202,579,1194,38],[202,635,1194,37],[203,690,1193,38],[202,745,1194,38],[202,801,141,30],[274,856,1122,38],[202,912,1194,37],[203,967,844,38],[274,1023,1122,38],[440,1044,8,15],[203,1078,1193,38],[202,1134,1194,38],[203,1189,1193,38],[202,1245,1194,38],[203,1300,920,38],[273,1352,1123,45],[203,1411,1193,38],[202,1467,1194,37],[203,1522,873,38],[274,1578,1122,37],[202,1633,1184,38],[202,1689,1194,38],[202,1744,1194,38],[202,1800,1184,37],[202,1855,1197,38],[202,1911,475,37],[274,1966,1120,38],[228,2269,1194,47],[227,2326,1194,46],[227,2386,336,37]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"whole_text_argument","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5,6]},"html":"<h1>4.把全文连起
