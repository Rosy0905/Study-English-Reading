<script>const DATA={"steps":[{"section":"阅前须知","raw":"# 0.阅前须知\n\n阅前声明，本教程对英语一英语二均适用。\n\n本教程主要解决考研英语阅读备考中的三个结构性问题：\n\n1. 考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；\n\n2. 考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；\n\n3. 考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。\n\n总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"preface"},"html":"<h1>0.阅前须知</h1>\n<p>阅前声明，本教程对英语一英语二均适用。</p>\n<p>本教程主要解决考研英语阅读备考中的三个结构性问题：</p>\n<ol>\n<li><p>考研英语骗局一：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持认识文章中的所有细节，一个不漏，咱们不可能完全认识文章中的每一个单词，带着不认识的地方读文章做题才是真正的学生视角，如果我能像考研名师那样把所有句子全部信达雅翻译出来，那我还看阅读讲解干嘛？不是纯有病，考场上我们也不会有天意爷加持。并且英语阅读首先是阅读，即使是有部分表达不认识，从段落和文章主旨、作者态度等宏观阅读文章内容本身分析的层面，也是不影响做全对的；</p>\n</li>\n<li><p>考研英语骗局二：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接边读边信达雅地翻译出文章，读完一遍只能在脑海里留下大致信息，并且很快遗忘，而且，一旦精读某部分的时候，咱们遇到不懂的表达一定会慌，这样信达雅的翻译出来难度就更大了，这才是真正的学生视角，因此正确的方式是先粗后细，放弃信达雅的机械翻译，粗读先理解文章大致出现了哪些东西，然后细读我们这里采用意群法这种手段实现，即可临危不乱；</p>\n</li>\n<li><p>考研英语骗局三：是个正常人都不可能在考场上做阅读时站在上帝视角天意加持直接用某种神技确定某个一定正确的答案，尤其是咱们找的定位句或者选项中有不认识的表达，如果这么干，那么100道题就可以出一百道神技，咱们难道都学一遍吗？实际上机构和名师们也都是这么干的。因此，二选一选不出来是个非常正常的现象。并且，用某种神技去秒杀一个文科单选问题违背了逻辑学里一个基本常识，即孤证不立，怎么办？还是先粗读完文章知道对文章的宏观认知，以及采用多判据交叉验证的方式解决，这是所有文科单选题的通法。</p>\n</li>\n</ol>\n<p>总之，大家把考研英语阅读当成阅读，才能发现真正正确的备考方式和真相，并且大家会发现考研英语所需的真正词汇量甚至不如六级，反而可能大家的“语文”能力更为重要。</p>\n"},{"section":"先读题干","raw":"# 1. 先读题干\n\n首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法","articleRects":[],"questionRects":[],"scrollTarget":"question","meta":{"kind":"stem_intro"},"html":"<h1>1. 先读题干</h1>\n<p>首先先看题干再用意群法粗读一遍文章，不看选项是因为提前看选项会干扰咱们粗读对文章的理解，看题干对考啥有个大致印象，并且因为题文同序的原因，也能帮助我们获取部分文章的逻辑信息。至于为什么要先粗读文章再做题，是因为近年来的命题趋势越来越趋向于反套路化，即针对所谓的“不看文章直接精准定位”，并且命题人对正确选项魔改严重，直接比对然后同义替换替换正选选出来非常难，其实就是要求大家读完文章再做题，所以我们也应该做出相应的的应对方法</p>\n"},{"section":"先读题干","raw":"## 31题题干\n\n**According to Paragraph 1, art-science collaborations have ______.**\n\n> 根据第一段，艺术与科学的合作已经怎样？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,504,918,37],[1150,535,104,8]],"scrollTarget":"question","meta":{"kind":"stem","qid":"31"},"html":"<h2>31题题干</h2>\n<p><strong>According to Paragraph 1, art-science collaborations have ______.</strong></p>\n<blockquote><p>根据第一段，艺术与科学的合作已经怎样？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 32题题干\n\n**The reworked version of The Four Seasons is mentioned to show that ______.**\n\n> 文中提到《四季》的改编版本，是为了说明什么？\n\n题型：**例证作用题**。","articleRects":[],"questionRects":[[226,817,1068,30]],"scrollTarget":"question","meta":{"kind":"stem","qid":"32"},"html":"<h2>32题题干</h2>\n<p><strong>The reworked version of The Four Seasons is mentioned to show that ______.</strong></p>\n<blockquote><p>文中提到《四季》的改编版本，是为了说明什么？</p>\n</blockquote>\n<p>题型：<strong>例证作用题</strong>。</p>\n"},{"section":"先读题干","raw":"## 33题题干\n\n**Some artists seem to worry that in the art-science partnership ______.**\n\n> 一些艺术家似乎担心，在艺术与科学的合作中会怎样？\n\n题型：**推断题**。","articleRects":[],"questionRects":[[226,1130,967,38],[1199,1162,105,7]],"scrollTarget":"question","meta":{"kind":"stem","qid":"33"},"html":"<h2>33题题干</h2>\n<p><strong>Some artists seem to worry that in the art-science partnership ______.</strong></p>\n<blockquote><p>一些艺术家似乎担心，在艺术与科学的合作中会怎样？</p>\n</blockquote>\n<p>题型：<strong>推断题</strong>。</p>\n"},{"section":"先读题干","raw":"## 34题题干\n\n**What does the author say about CAVS?**\n\n> 关于高级视觉研究中心，作者说了什么？\n\n题型：**细节题**。","articleRects":[],"questionRects":[[226,1443,654,38]],"scrollTarget":"question","meta":{"kind":"stem","qid":"34"},"html":"<h2>34题题干</h2>\n<p><strong>What does the author say about CAVS?</strong></p>\n<blockquote><p>关于高级视觉研究中心，作者说了什么？</p>\n</blockquote>\n<p>题型：<strong>细节题</strong>。</p>\n"},{"section":"先读题干","raw":"## 35题题干\n\n**In the last paragraph, the author holds that art-science collaborations ______.**\n\n> 在最后一段中，作者认为艺术与科学的合作应当怎样？\n\n题型：**段落观点题**。","articleRects":[],"questionRects":[[226,1757,1067,37]],"scrollTarget":"question","meta":{"kind":"stem","qid":"35"},"html":"<h2>35题题干</h2>\n<p><strong>In the last paragraph, the author holds that art-science collaborations ______.</strong></p>\n<blockquote><p>在最后一段中，作者认为艺术与科学的合作应当怎样？</p>\n</blockquote>\n<p>题型：<strong>段落观点题</strong>。</p>\n"},{"section":"读文章","raw":"# 2. 读文章过程\n\n看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。\n\n可以额外关注的一些词主要有以下几类：\n\n| 类型 | 关注原因 | 本文例子 |\n| --- | --- | --- |\n| 逻辑词 | 看到这里可能要拐一下 | But, however, therefore |\n| 态度词／评价词 | 先抓个大概好坏 | encouraging, valuable, powerful |\n| 动作词 | 先看谁做了什么 | communicate, design, invest |\n| 结果词 | 看最后出了什么事 | result, learning, invention |\n| 重复主题词 | 大概知道老在说什么 | artists, scientists, collaboration |\n","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_intro"},"html":"<h1>2. 读文章过程</h1>\n<p>看完题干后，第一步要粗读一遍文章。粗读就是根据自身水平从前往后扫文章：文章开头和结尾可以稍微慢一点，中间相对快一些；每个自然段的开头和结尾也可以多停一眼，但多停一眼不等于把首句或尾句整句翻完。扫到哪个小块能直接反应出意思，就顺着英文原位置留下最直的中文；需要先拆结构、调整语序、补前后关系或者想一会儿才能明白的地方，就先保留英文。例子内部仍然可以少读。</p>\n<p>可以额外关注的一些词主要有以下几类：</p>\n<table><thead><tr><th>类型</th><th>关注原因</th><th>本文例子</th></tr></thead><tbody><tr><td>逻辑词</td><td>看到这里可能要拐一下</td><td>But, however, therefore</td></tr><tr><td>态度词／评价词</td><td>先抓个大概好坏</td><td>encouraging, valuable, powerful</td></tr><tr><td>动作词</td><td>先看谁做了什么</td><td>communicate, design, invest</td></tr><tr><td>结果词</td><td>看最后出了什么事</td><td>result, learning, invention</td></tr><tr><td>重复主题词</td><td>大概知道老在说什么</td><td>artists, scientists, collaboration</td></tr></tbody></table>\n"},{"section":"读文章","raw":"**[xxx]**, challenging, **[xxx]**, fun. These were some of the words that Nature readers used to describe their experiences of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an **[xxx]** poll said they had collaborated with artists; and almost all said they would consider doing so in future.","articleRects":[[273,294,1123,38],[202,347,1194,37],[202,399,1187,37],[202,451,1194,38],[202,503,1193,38],[202,555,96,31]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse","pid":0,"form":0,"coarse":true,"literalReplacements":[],"coarseCoverage":{},"paragraphPids":[0]},"contextRaw":"","html":"<div class=\"coarseStack\"><div class=\"currentFocus\"><p><strong>[xxx]</strong>, challenging, <strong>[xxx]</strong>, fun. These were some of the words that Nature readers used to describe their experiences of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an <strong>[xxx]</strong> poll said they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n</div></div>"},{"section":"读文章","raw":"**[xxx]**, challenging, **[xxx]**, fun. / These were some of the words that Nature readers used to describe their experiences of art-science collaborations in a series of articles on partnerships between artists and researchers. / Nearly 40% of the roughly 350 people who responded to an **[xxx]** poll said they had collaborated with artists; / and almost all said they would consider doing so in future.","articleRects":[[273,294,1123,38],[202,347,1194,37],[202,399,1187,37],[202,451,1194,38],[202,5 <p>1、有挑战性、有趣、艺术与科学合作、在艺术家与研究人员之间、接近40%、大约350人、曾与艺术家合作、几乎所有人都说、会考虑今后这样做。</p>\n</div><div class=\"coarseDone\"><p>2、鼓舞人心的结果、寻找视觉艺术家、传播他们的工作、更广泛的受众。</p>\n</div><div class=\"coarseDone\"><p>3、艺术家与科学家、一个改编版本、四季、最新气候预测数据、创意行动呼吁。</p>\n</div><div class=\"coarseDone\"><p>4、双向往来、他们的传播需求、一个研究对象、共同设计它、促成新的研究、强有力的艺术作品。</p>\n</div><div class=\"coarseDone\"><p>5、半个多世纪以前、技术在文化中的作用、合作的基础、科学和技术进步、杰出的研究人员。</p>\n</div><div class=\"currentFocus\"><p>6、自然的调查结果、一如既往地强劲、使合作成功、双方、投入时间、超出必要目的、研究传播、挑战和批评、两者的核心。</p>\n</div></div>"},{"section":"读文章","raw":"粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到有挑战性、有趣、几乎所有人都说、会考虑今后这样做；中间又出现鼓舞人心的结果、寻找视觉艺术家、传播他们的工作、更广泛的受众；艺术家与科学家、一个改编版本、最新气候预测数据、创意行动呼吁；双向往来、他们的传播需求、促成新的研究、强有力的艺术作品；半个多世纪以前、技术在文化中的作用、科学和技术进步、杰出的研究人员；结尾还有自然的调查结果、一如既往地强劲、挑战和批评、两者的核心。\n\n到这里还不能自然地说清楚：科学家与艺术家怎样合作，音乐与研究中心的例子分别说明什么，作者为什么又强调双方的作用。先留下松散印象和大致位置，具体关系等题目问到时再查。\n\n实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"coarse_summary"},"html":"<p>粗读这一遍的主要目的，是先知道文章大概在谈什么，之后题目问到某个人、某个时间或某类内容时，能够尽快回到相应位置。把刚才留下的碎片放在一起，现在最多只能形成一个很松的印象：开头看到有挑战性、有趣、几乎所有人都说、会考虑今后这样做；中间又出现鼓舞人心的结果、寻找视觉艺术家、传播他们的工作、更广泛的受众；艺术家与科学家、一个改编版本、最新气候预测数据、创意行动呼吁；双向往来、他们的传播需求、促成新的研究、强有力的艺术作品；半个多世纪以前、技术在文化中的作用、科学和技术进步、杰出的研究人员；结尾还有自然的调查结果、一如既往地强劲、挑战和批评、两者的核心。</p>\n<p>到这里还不能自然地说清楚：科学家与艺术家怎样合作，音乐与研究中心的例子分别说明什么，作者为什么又强调双方的作用。先留下松散印象和大致位置，具体关系等题目问到时再查。</p>\n<p>实际做题时，首段和尾段可以稍微慢一点，中间段快一点。粗读不是考你能不能在一两分钟内说出一篇漂亮摘要，而是先在脑中建立一个够用的轮廓：文章大概在谈什么，整体往哪个方向走，以及某类信息大约出现在哪里。比如一段材料讲的是一起杀人事件，粗读时先知道“发生了杀人”就够了；当时顺手看到人物、时间或地点，也可以一并留下，没看到就不要补。至于怎么杀的、杀了谁、为什么杀，只有题目问到时才需要回去查找。当然，这种方法并不是每次都完全奏效，因为文章不一定都按照明显的首尾结构来写，有些段落可能整段都在举例，但总体原则仍然不变：粗读负责建立主题、方向和大致结构，精读则只服务于具体题目。先留下这些词块和大致位置，具体关系等题目问到时再精读。</p>\n"},{"section":"开始做题","raw":"# 3. 开始做题\n\n很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？\n\n那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）\n\n想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。\n\n这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"method_intro"},"html":"<h1>3. 开始做题</h1>\n<p>很多同学会有一种思维，就是去找”精准定位神技“这种套路，例如经典的蛇形定位比对法，想不读一遍文章直接定位就得出答案，搁那玩贪吃蛇呢，这其中至少存在三个以上的陷阱：1.命题人在逐渐的反套路化，让咱们无法根据关键词去所谓的精准定位，比如23年和25年英语一，25年英语二，并且他们对正确选项进行了魔改而不是原来单纯的同义替换，这导致咱们必须认真读完一整段甚至整篇文章才能排除掉另外三个正确选项；2.第二个陷阱想必咱们们都知道，无论是什么机构，他们的所谓的阅读技巧能写整整一本厚书，然后几十上百种神技，每种神技底下配一个先射箭再画靶子的题目，但是请问，咱们这样听课确实爽了，那实操呢，咱们真的能记得住数十种神技以及应用范围吗，更何况有些技巧甚至互相矛盾的，咱们到底听谁的？；3.第三个陷阱就是，只要我往死里背单词书，直接无脑同义替换就行了那请问，咱们不会遗忘吗？咱们真的记得住一词多义和一个词的十几个词组的意思吗？那么多东西咱们真的背的完吗，其他专业课都不考了吗？并且命题组每年都要保证一定的生词率，背是背不完的，如果有这个耐心和记忆力，那当年高考就应该上岸好学校了，对不对？还有一种论调是：因为我复盘的时候发现错题都是我不会同义替换导致的。纯细节题这么说可以，我们就当咱们记忆力和天赋超群，但是其它类型的题，有没有一种可能，这道题就不是用同义替换做的？</p>\n<p>那怎么破局呢？总之大家要知道，咱们国家的英语考试，是按语文出题的脑回路来出英语题的，考纲里也明确要求了首要考察考生的阅读能力而非英语能力，阅读首先是阅读，然后才是英语，所以大家一定要从阅读一篇文章而不是机械的同义替换的角度去解题，除了大家都知道的根据题目关键词去定位比对的方法外，这里介绍两种从阅读视角做题的方法，第一种是写作视角法（即如果某题某选项对，对应的部分作者应该怎么写，和原文是否一致），第二种是主旨法（选项符不符合文章主旨），由此衍生出的题型其实也只有六类：细节题，段落主旨题，全文主旨题，作者态度题，例子作用题，还有其它（例如早年经常出的猜词题）</p>\n<p>想必这里大家可以发现，我们的题型分法是按照解题方法来的，而我们刚才分析过，我们的解题方法才是最本质最本源的三种方法，然后大家又可以发现一点，有些题型是只能用某种方法做的，例如定位比对做细节题，但是大部分题型是可以用多种方法做，这就会衍生一个所有文科做题的通法：交叉验证，是解决二选一选不出来这个问题的唯一思路，这个作为进阶技巧我们后面再说。</p>\n<p>这里还有最后一个问题，我们在考场上遇到需要定位比对的情况时，面对一个长难句，如果按照先变成中文语序然后用语法规则+每一个表达都要精准翻译的方式，最后再信达雅的翻译出来，基本上是不太可能的，能这么做还不乱的通常天赋是不差的，但是普通人这块确实是有所欠缺的，所以我们引入了翻译学里一种极其适合我们普通人的方法，即意群法，这个方法最大的好处就是，咱们可以按照咱们的喜好任意切分意群，然后按照英文的语序拼接意思顺着读就能知道大概，并且这个方法天然就是处理翻译这种实时性场景而生的，考场上做题的时候用这种方法去精读相关句子，可以做到临危不乱，有条不紊的效果，我们接下来会展示这种方法。</p>\n"},{"section":"31题","raw":"## 31题\n\n> According to Paragraph 1, art-science collaborations have ______.  \n> 根据第一段，艺术与科学的合作已经怎样？\n\n题干明确给出Paragraph 1，先把第1段从头读到尾，查看读者怎样描述艺术与科学合作的经历，以及调查中的人曾做过什么、今后愿意做什么。\n\n> 原文参考：\n> \n> **[xxx]**, challenging, **[xxx]**, fun. These were some of the words that Nature readers used to describe their experiences of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an **[xxx]** poll said they had collaborated with artists; and almost all said they would consider doing so in future.\n> \n> 开始精读：\n> \n> **[xxx]**, challenging, **[xxx]**, fun. / These were some of the words / that Nature readers used to describe their experiences of art-science collaborations / in a series of articles on partnerships between artists and researchers. / Nearly 40% of the roughly 350 people / who responded to an **[xxx]** poll / said they had collaborated with artists; / and almost all said they would consider doing so in future.\n> \n> **[xxx]**、有挑战性、**[xxx]**、有趣。 / 这些是一些用语， / 《自然》的读者用它们来描述自己参与艺术与科学合作的经历， / 见于一系列关于艺术家与研究人员合作的文章。 / 大约350位受访者中，接近40%的人， / 他们回应了一项**[xxx]**调查， / 说自己曾与艺术家合作； / 而且几乎所有人都说，他们会考虑今后这样做。\n\nart-science collaborations对应段中的艺术家与研究人员合作。空格要概括第一段交代的合作状况，判断时须区分已有合作经历和未来合作意愿。\n\n接下来按A—D逐项看。","articleRects":[[273,294,1123,38],[202,347,1194,37],[202,399,1187,37],[202,451,1194,38],[202,503,1193,38],[202,555,96,31]],"questionRects":[[226,504,918,37],[1150,535,104,8],[292,556,478,37],[292,608,481,37],[292,660,491,38],[292,712,493,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[0],"qid":"31","initialReadingPids":[0]},"html":"<h2>31题</h2>\n<blockquote><p>According to Paragraph 1, art-science collaborations have ______.<br />\n根据第一段，艺术与科学的合作已经怎样？</p>\n</blockquote>\n<p>题干明确给出Paragraph 1，先把第1段从头读到尾，查看读者怎样描述艺术与科学合作的经历，以及调查中的人曾做过什么、今后愿意做什么。</p>\n<blockquote><p>原文参考：</p>\n<p><strong>[xxx]</strong>, challenging, <strong>[xxx]</strong>, fun. These were some of the words that Nature readers used to describe their experiences of art-science collaborations in a series of articles on partnerships between artists and researchers. Nearly 40% of the roughly 350 people who responded to an <strong>[xxx]</strong> poll said they had collaborated with artists; and almost all said they would consider doing so in future.</p>\n<p>开始精读：</p>\n<p><strong>[xxx]</strong>, challenging, <strong>[xxx]</strong>, fun. / These were some of the words / that Nature readers used to describe their experiences of art-science collaborations / in a series of articles on partnerships between artists and researchers. / Nearly 40% of the roughly 350 people / who responded to an <strong>[xxx]</strong> poll / said they had collaborated with artists; / and almost all said they would consider doing so in future.</p>\n<p><strong>[xxx]</strong>、有挑战性、<strong>[xxx]</strong>、有趣。 / 这些是一些用语， / 《自然》的读者用它们来描述自己参与艺术与科学合作的经历， / 见于一系列关于艺术家与研究人员合作的文章。 / 大约350位受访者中，接近40%的人， / 他们回应了一项<strong>[xxx]</strong>调查， / 说自己曾与艺术家合作； / 而且几乎所有人都说，他们会考虑今后这样做。</p>\n</blockquote>\n<p>art-science collaborations对应段中的艺术家与研究人员合作。空格要概括第一段交代的合作状况，判断时须区分已有合作经历和未来合作意愿。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"31题","raw":"### A. caught the attention of critics\n\n> 引起了评论家的关注\n\n把A接回题干，它说的是：根据第一段，艺术与科学的合作已经引起了评论家的关注。\n\nA说评论家关注，回第1段看是谁作出回应。\n\n> Nature readers used to describe their experiences of art-science collaborations\n\n这里是Nature的读者描述自己的合作经历，又有参与调查的人表示以后愿意合作。文中把他们称作readers和respondents，并没有说他们是评论家。\n\n读者觉得合作有趣，也不能据此补出另外一群评论家来。\n\n**第1段写出的回应者就是critics吗？**\n\n不是。A换了作出回应的人，原文没有交代评论家的关注。\n\n**第一轮判断：A排除。**","articleRects":[[273,294,1123,38],[202,347,1194,37],[202,399,1187,37],[202,451,1194,38],[202,503,1193,38],[202,555,96,31]],"questionRects":[[292,556,478,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"31","paragraphPids":[0]},"html":"<h3>A. caught the attention of critics</h3>\n<blockquote><p>引起了评论家的关注</p>\n</blockquote>\n<p>把A接回题干，它说的是：根据第一段，艺术与科学的合作已经引起了评论家的关注。</p>\n<p>A说评论家关注，回第1段看是谁作出回应。</p>\n<blockquote><p>Nature readers used to describe their experiences of art-science collaborations</p>\n</blockquote>\n<p>这里是Nature的读者描述自己的合作经历，又有参与调查的人表示以后愿意合作。文中把他们称作readers和respondents，并没有说他们是评论家。</p>\n<p>读者觉得合作有趣，也不能据此补出另外一群评论家来。</p>\n<p><strong>第1段写出的回应者就是critics吗？</strong></p>\n<p>不是。A换了作出回应的人，原文没有交代评论家的关注。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"31题","raw":"### B. received favourable responses\n\n> 获得了积极回应\n\n把B接回题干，它说的是：根据第一段，艺术与科学的合作已经获得了积极回应。\n\nB说积极回应，回第1段看读者的形容词和今后意愿。\n\n> and almost all said they would consider doing so in future.\n\n有些形容词不认识，但fun是有趣，末句还说almost all愿意考虑今后合作。已经参加过的人有积极体验，还没参加的人也普遍愿意考虑。\n\nchallenging不必然是负面评价；愿意继续或尝试合作，已经能帮助我们判断这里的整体反应。\n\n**几乎所有回应者都愿意考虑今后合作，能支持积极回应吗？**\n\n能。B与这些人的实际态度相符，可以保留。\n\n**第一轮判断：B保留。**","articleRects":[[273,294,1123,38],[202,347,1194,37],[202,399,1187,37],[202,451,1194,38],[202,503,1193,38],[202,555,96,31]],"questionRects":[[292,608,481,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"31","paragraphPids":[0]},"html":"<h3>B. received favourable responses</h3>\n<blockquote><p>获得了积极回应</p>\n</blockquote>\n<p>把B接回题干，它说的是：根据第一段，艺术与科学的合作已经获得了积极回应。</p>\n<p>B说积极回应，回第1段看读者的形容词和今后意愿。</p>\n<blockquote><p>and almost all said they would consider doing so in future.</p>\n</blockquote>\n<p>有些形容词不认识，但fun是有趣，末句还说almost all愿意考虑今后合作。已经参加过的人有积极体验，还没参加的人也普遍愿意考虑。</p>\n<p>challenging不必然是负面评价；愿意继续或尝试合作，已经能帮助我们判断这里的整体反应。</p>\n<p><strong>几乎所有回应者都愿意考虑今后合作，能支持积极回应吗？</strong></p>\n<p>能。B与这些人的实际态度相符，可以保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"31题","raw":"### C. promoted academic publishing\n\n> 促进了学术出版\n\n把C接回题干，它说的是：根据第一段，艺术与科学的合作已经促进了学术出版。\n\nC说促进学术出版，回第1段看articles用来交代什么。\n\n> used to describe their experiences of art-science collaborations in a series of articles on partnerships between artists and researchers.\n\n一系列文章记下了艺术家与研究者合作的体验，调查又询问了人们的合作意愿。文章在这里是这些意见出现的地方。\n\n要说合作促进出版，还需要看到论文数量、发表机会等发生变化，这一段没有作这种比较。\n\n**意见写在文章里，就说明合作促进了学术出版吗？**\n\n不能。C把调查所用的材料变成了合作带来的出版成果。\n\n**第一轮判断：C排除。**","articleRects":[[273,294,1123,38],[202,347,1194,37],[202,399,1187,37],[202,451,1194,38],[202,503,1193,38],[202,555,96,31]],"questionRects":[[292,660,491,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"31","paragraphPids":[0]},"html":"<h3>C. promoted academic publishing</h3>\n<blockquote><p>促进了学术出版</p>\n</blockquote>\n<p>把C接回题干，它说的是：根据第一段，艺术与科学的合作已经促进了学术出版。</p>\n<p>C说促进学术出版，回第1段看articles用来交代什么。</p>\n<blockquote><p>used to describe their experiences of art-science collaborations in a series of articles on partnerships between artists and researchers.</p>\n</blockquote>\n<p>一系列文章记下了艺术家与研究者合作的体验，调查又询问了人们的合作意愿。文章在这里是这些意见出现的地方。</p>\n<p>要说合作促进出版，还需要看到论文数量、发表机会等发生变化，这一段没有作这种比较。</p>\n<p><strong>意见写在文章里，就说明合作促进了学术出版吗？</strong></p>\n<p>不能。C把调查所用的材料变成了合作带来的出版成果。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"31题","raw":"### D. sparked heated public disputes\n\n> 引发了激烈的公众争论\n\n把D接回题干，它说的是：根据第一段，艺术与科学的合作已经引发了激烈的公众争论。\n\nD说激烈公众争论，回第1段找人们意见相冲突的地方。\n\n> **[xxx]**, challenging, **[xxx]**, fun.\n\n> Nature readers used to describe their experiences of art-science collaborations\n\n调查里有近40%的人合作过，几乎所有人愿意考虑未来合作。这是经验和意愿的统计，没有列出相互反对的两方。\n\nchallenging说合作经历可能有挑战，也不等于人们围绕它争吵。\n\n**文中有没有出现相互对立的公众意见？**\n\n没有。D的heated disputes不是这段调查所写的情况。\n\n**第一轮判断：D排除。**","articleRects":[[273,294,1123,38],[202,347,1194,37],[202,399,1187,37],[202,451,1194,38],[202,503,1193,38],[202,555,96,31]],"questionRects":[[292,712,493,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"31","paragraphPids":[0]},"html":"<h3>D. sparked heated public disputes</h3>\n<blockquote><p>引发了激烈的公众争论</p>\n</blockquote>\n<p>把D接回题干，它说的是：根据第一段，艺术与科学的合作已经引发了激烈的公众争论。</p>\n<p>D说激烈公众争论，回第1段找人们意见相冲突的地方。</p>\n<blockquote><p><strong>[xxx]</strong>, challenging, <strong>[xxx]</strong>, fun.</p>\n</blockquote>\n<blockquote><p>Nature readers used to describe their experiences of art-science collaborations</p>\n</blockquote>\n<p>调查里有近40%的人合作过，几乎所有人愿意考虑未来合作。这是经验和意愿的统计，没有列出相互反对的两方。</p>\n<p>challenging说合作经历可能有挑战，也不等于人们围绕它争吵。</p>\n<p><strong>文中有没有出现相互对立的公众意见？</strong></p>\n<p>没有。D的heated disputes不是这段调查所写的情况。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"31题","raw":"### 31题第一次结果\n\n- A排除。\n- B保留。\n- C排除。\n- D排除。\n\n当前选择：B。\n\n第一遍留下B。几乎所有受访者愿意考虑未来合作，可以概括为积极回应。","articleRects":[],"questionRects":[[226,504,918,37],[1150,535,104,8],[292,556,478,37],[292,608,481,37],[292,660,491,38],[292,712,493,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"31"},"html":"<h3>31题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：B。</p>\n<p>第一遍留下B。几乎所有受访者愿意考虑未来合作，可以概括为积极回应。</p>\n"},{"section":"32题","raw":"## 32题\n\n> The reworked version of The Four Seasons is mentioned to show that ______.  \n> 文中提到《四季》的改编版本，是为了说明什么？\n\nThe Four Seasons直接定位到第3段。先完整读第3段，了解改编加入了什么、演出在什么场合发出什么呼吁。题干问is mentioned to show，即举例的用意；第3段开头写One example，因此还要完整读相邻的第2段，找到这个例子承接的说法。\n\n> 原文参考：\n> \n> One example of how artists and scientists have together **[xxx]** the senses came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi’s The Four Seasons. They reimagined the 300-year-old **[xxx]** by injecting the latest climate prediction data for each season—provided by Monash University’s Climate Change Communication Research Hub. The performance was a creative call to action ahead of November’s United Nations Climate Change Conference in Glasgow, UK.\n> \n> 开始精读：\n> \n> One example of how artists and scientists have together **[xxx]** the senses / came last month / when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi’s The Four Seasons. / They reimagined the 300-year-old **[xxx]** / by injecting the latest climate prediction data for each season—provided by Monash University’s Climate Change Communication Research Hub. / The performance was a creative call to action / ahead of November’s United Nations Climate Change Conference in Glasgow, UK.\n> \n> 艺术家与科学家如何共同**[xxx]**感官的一个例子， / 出现在上个月， / 当时悉尼交响乐团演奏了安东尼奥·维瓦尔第《四季》的改编版本。 / 他们重新构想了这个有300年历史的**[xxx]**， / 通过融入各个季节的最新气候预测数据——这些数据由莫纳什大学气候变化传播研究中心提供。 / 这场演出是一次富有创意的行动呼吁， / 发生在十一月于英国格拉斯哥召开的联合国气候变化大会之前。\n\n> 原文参考：\n> \n> Such an encouraging result is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. “Artists help scientists reach a broader audience and make emotional connections that enhance learning,” one **[xxx]** said.\n> \n> 开始精读：\n> \n> Such an encouraging result is not surprising. / Scientists are increasingly seeking out visual artists / to help them communicate their work to new audiences. / “Artists help scientists reach a broader audience / and make emotional connections that enhance learning,” / one **[xxx]** said.\n> \n> 这样一个鼓舞人心的结果并不令人意外。 / 科学家正越来越多地寻找视觉艺术家， / 来帮助他们向新的受众传播自己的工作。 / “艺术家帮助科学家接触更广泛的受众， / 并建立能促进学习的情感联系，” / 一位**[xxx]**说。\n\n第3段用交响乐团的改编演出举例，第2段谈科学家借艺术向新受众传播工作、建立情感联系。空格要说明这个具体演出怎样表现艺术与科学合作的作用，不能只重复演出用了哪一首作品。\n\n接下来按A—D逐项看。","articleRects":[[274,608,1122,37],[203,660,1183,38 呼吁， / 发生在十一月于英国格拉斯哥召开的联合国气候变化大会之前。</p>\n</blockquote>\n<blockquote><p>原文参考：</p>\n<p>Such an encouraging result is not surprising. Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences. “Artists help scientists reach a broader audience and make emotional connections that enhance learning,” one <strong>[xxx]</strong> said.</p>\n<p>开始精读：</p>\n<p>Such an encouraging result is not surprising. / Scientists are increasingly seeking out visual artists / to help them communicate their work to new audiences. / “Artists help scientists reach a broader audience / and make emotional connections that enhance learning,” / one <strong>[xxx]</strong> said.</p>\n<p>这样一个鼓舞人心的结果并不令人意外。 / 科学家正越来越多地寻找视觉艺术家， / 来帮助他们向新的受众传播自己的工作。 / “艺术家帮助科学家接触更广泛的受众， / 并建立能促进学习的情感联系，” / 一位<strong>[xxx]</strong>说。</p>\n</blockquote>\n<p>第3段用交响乐团的改编演出举例，第2段谈科学家借艺术向新受众传播工作、建立情感联系。空格要说明这个具体演出怎样表现艺术与科学合作的作用，不能只重复演出用了哪一首作品。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"32题","raw":"### A. art can offer audiences easy access to science\n\n> 艺术能让受众容易接触科学\n\n把A接回题干，它说的是：提到《四季》的改编版本，是为了说明艺术能让受众容易接触科学。\n\nA说艺术让受众接近科学，先看例子前一段的broader audience，再看音乐里加入了什么。\n\n> Artists help scientists reach a broader audience and make emotional connections that enhance learning,\n\n> by injecting the latest climate prediction data for each season\n\n第2段说艺术家帮助科学家接触更广泛的受众、建立有利于学习的情感联系。第3段把最新气候预测数据放进《四季》，观众通过听音乐接触气候变化信息。\n\n科学数据原本需要专门阅读，现在通过演出传递出来，正好接住前面的communicate their work。\n\n**这场演出有没有把科学信息带到音乐听众面前？**\n\n有。A概括了艺术帮助传播科学的具体做法，可以保留。\n\n**第一轮判断：A保留。**","articleRects":[[274,608,1122,37],[203,660,1183,38],[204,711,1192,39],[202,763,660,39],[274,816,1122,38],[202,869,1194,38],[202,921,1194,38],[202,973,1194,38],[202,1025,1194,38],[202,1074,1194,45],[202,1130,677,38]],"questionRects":[[291,869,717,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"32","paragraphPids":[1,2]},"html":"<h3>A. art can offer audiences easy access to science</h3>\n<blockquote><p>艺术能让 受众、建立情感联系，使学习更有效。音乐例子接着展示科学信息怎样被带给观众。</p>\n<p>演出里确实用了科学数据，但不能仅凭数据出现，就把前面“艺术帮助传播科学”换成“科学帮助表达情感”。</p>\n<p><strong>作者用这个例子主要解释数据怎样表达情感吗？</strong></p>\n<p>不是。前面明确要解释的是科学家怎样借助艺术接触和帮助受众理解，B换了要说明的事情。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"32题","raw":"### C. public participation in science has a promising future\n\n> 公众参与科学拥有光明的前景\n\n把C接回题干，它说的是：提到《四季》的改编版本，是为了说明公众参与科学拥有光明的前景。\n\nC说公众参与科学前景好，回第3段看观众具体参与了什么。\n\n> communicate their work to new audiences.\n\n> a creative call to action ahead of November’s United Nations Climate Change Conference\n\n观众听的是加入气候预测数据的演出，演出还呼吁人们采取行动。这里能看到公众接收科学信息和行动呼吁。\n\n但作者没有比较公众参与科学活动的发展，也没有据此预测未来。一次演出有效传递信息，还不足以推出公众参与科学的整体前景。\n\n**例子有没有从当下演出推到公众参与科学的未来发展？**\n\n没有。C多出了对未来的判断，也偏离了前段明确提出的传播作用。\n\n**第一轮判断：C排除。**","articleRects":[[274,608,1122,37],[203,660,1183,38],[204,711,1192,39],[202,763,660,39],[274,816,1122,38],[202,869,1194,38],[202,921,1194,38],[202,973,1194,38],[202,1025,1194,38],[202,1074,1194,45],[202,1130,677,38]],"questionRects":[[291,973,825,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"排除","qid":"32","paragraphPids":[1,2]},"html":"<h3>C. public participation in science has a promising future</h3>\n<blockquote><p>公众参与科学拥有光明的前景</p>\n</blockquote>\n<p>把C接回题干，它说的是：提到《四季》的改编版本，是为了说明公众参与科学拥有光明的前景。</p>\n<p>C说公众参与科学前景好，回第3段看观众具体参与了什么。</p>\n<blockquote><p>communicate their work to new audiences.</p>\n</blockquote>\n<blockquote><p>a creative call to action ahead of November’s United Nations Climate Change Conference</p>\n</blockquote>\n<p>观众听的是加入气候预测数据的演出，演出还呼吁人们采取行动。这里能看到公众接收科学信息和行动呼吁。</p>\n<p>但作者没有比较公众参与科学活动的发展，也没有据此预测未来。一次演出有效传递信息，还不足以推出公众参与科学的整体前景。</p>\n<p><strong>例子有没有从当下演出推到公众参与科学的未来发展？</strong></p>\n<p>没有。C多出了对未来的判断，也偏离了前段明确提出的传播作用。</p>\n<p><strong>第一轮判断：C排除。</strong></p>\n"},{"section":"32题","raw":"### D. art is effective in facilitating scientific innovations\n\n> 艺术能有效促进科学创新\n\n把D接回题干，它说的是：提到《四季》的改编版本，是为了说明艺术能有效促进科学创新。\n\nD说艺术促进科学创新，回第3段看气候数据是在演出中产生的吗。\n\n> by injecting the latest climate prediction data for each season—provided by Monash University’s Climate Change Communication Research Hub.\n\n> The performance was a creative call to action\n\n演出采用的是研究机构提供的最新气候预测数据。艺术家把这些已有数据放进作品，创造的是音乐的改编版本。\n\n这里没有说演出使科学家获得新发现或改进预测方法。音乐的创作发生了变化，不能直接当成科学创新。\n\n**例子中的新变化发生在科学研究，还是科学数据的艺术表达？**\n\n在艺术表达。D把作品改编换成了科学创新。\n\n**第一轮判断：D排除。**","articleRects":[[274,816,1122,38],[202,869,1194,38],[202,921,1194,38],[202,973,1194,38],[202,1025,1194,38],[202,1074,1194,45],[202,1130,677,38]],"questionRects":[[291,1025,786,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"32","paragraphPids":[2]},"html":"<h3>D. art is effective in facilitating scientific innovations</h3>\n<blockquote><p>艺术能有效促进科学创新</p>\n</blockquote>\n<p>把D接回题干，它说的是：提到《四季》的改编版本，是为了说明艺术能有效促进科学创新。</p>\n<p>D说艺术促进科学创新，回第3段看气候数据是在演出中产生的吗。</p>\n<blockquote><p>by injecting the latest climate prediction data for each season—provided by Monash University’s Climate Change Communication Research Hub.</p>\n</blockquote>\n<blockquote><p>The performance was a creative call to action</p>\n</blockquote>\n<p>演出采用的是研究机构提供的最新气候预测数据。艺术家把这些已有数据放进作品，创造的是音乐的改编版本。</p>\n<p>这里没有说演出使科学家获得新发现或改进预测方法。音乐的创作发生了变化，不能直接当成科学创新。</p>\n<p><strong>例子中的新变化发生在科学研究，还是科学数据的艺术表达？</strong></p>\n<p>在艺术表达。D把作品改编换成了科学创新。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"32题","raw":"### 32题第一次结果\n\n- A保留。\n- B排除。\n- C排除。\n- D排除。\n\n当前选择：A。\n\n第一遍留下A。改编把气候数据带进音乐，承接艺术帮助科学家接触更广泛受众、促进学习的说法。","articleRects":[],"questionRects":[[226,817,1068,30],[291,869,717,38],[291,921,765,38],[291,973,825,38],[291,1025,786,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"32"},"html":"<h3>32题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C排除。</li><li>D排除。</li></ul>\n<p>当前选择：A。</p>\n<p>第一遍留下A。改编把气候数据带进音乐，承接艺术帮助科学家接触更广泛受众、促进学习的说法。</p>\n"},{"section":"33题","raw":"## 33题\n\n> Some artists seem to worry that in the art-science partnership ______.  \n> 一些艺术家似乎担心，在艺术与科学的合作中会怎样？\n\n题干的Some artists与worry指向艺术家对合作关系的顾虑。粗读第4段时见到a two-way street和their communication requirements，现在把第4段完整读完，查看作者为什么强调双向合作，以及受访者反对怎样看待艺术家和他们的作品。\n\n> 原文参考：\n> \n> But a **[xxx]** partnership must be a two-way street. Fewer artists than scientists responded to the Nature poll; however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared **[xxx]** in a project, are able to jointly design it and can **[xxx]** each other’s work. Such an approach can both prompt new research as well as result in powerful art.\n> \n> 开始精读：\n> \n> But a **[xxx]** partnership must be a two-way street. / Fewer artists than scientists responded to the Nature poll; / however, several respondents noted / that artists do not simply assist scientists with their communication requirements. / Nor should their work be considered only as an object of study. / The alliances are most valuable / when scientists and artists have a shared **[xxx]** in a project, / are able to jointly design it / and can **[xxx]** each other’s work. / Such an approach can both prompt new research / as well as result in powerful art.\n> \n> 但一种**[xxx]**合作关系必须是双向的。 / 回应《自然》调查的艺术家比科学家少； / 然而，几位受访者指出， / 艺术家并不只是协助科学家满足其传播需求。 / 他们的作品也不应该仅仅被视为研究对象。 / 这样的联盟最有价值， / 是在科学家和艺术家在一个项目中拥有共同的**[xxx]**， / 能够共同设计这个项目， / 并且能够**[xxx]**彼此作品的时候。 / 这样的方法既能促成新的研究， / 也能产生强有力的艺术作品。\n\n本题要从第4段的do not simply、Nor should和双方共同设计项目的要求，判断艺术家担心自己在合作中被怎样对待。担忧可以从作者纠正的做法中推断，但不能把理想合作已经能做到的事当成担忧本身。\n\n接下来按A—D逐项看。","articleRects":[[274,1182,1122,38],[203,1235,1194,37],[203,1287,1194,37],[203,1339,1194,37],[202,1391,1194,38],[199,1443,1197,38],[202,1496,792,37]],"questionRects":[[226,1130,967,38],[1199,1162,105,7],[293,1182,530,38],[292,1234,528,38],[292,1287,518,37],[292,1339,480,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[3],"qid":"33","initialReadingPids":[3]},"html":"<h2>33题</h2>\n<blockquote><p>Some artists seem to worry that in the art-science partnership ______.<br />\n一些艺术家似乎担心，在艺术与科学的合作中会怎样？</p>\n</blockquote>\n<p>题干的Some artists与worry指向艺术家对合作关系的顾虑。粗读第4段时见到a two-way street和their communication requirements，现在把第4段完整读完，查看作者为什么强调双向合作，以及受访者反对怎样看待艺术家和他们的作品。</p>\n<blockquote><p>原文参考：</p>\n<p>But a <strong>[xxx]</strong> partnership must be a two-way street. Fewer artists than scientists responded to the Nature poll; however, several respondents noted that artists do not simply assist scientists with their communication requirements. Nor should their work be considered only as an object of study. The alliances are most valuable when scientists and artists have a shared <strong>[xxx]</strong> in a project, are able to jointly design it and can <strong>[xxx]</strong> each other’s work. Such an approach can both prompt new research as well as result in powerful art.</p>\n<p>开始精读：</p>\n<p>But a <strong>[xxx]</strong> partnership must be a two-way street. / Fewer artists than scientists responded to the Nature poll; / however, several respondents noted / that artists do not simply assist scientists with their communication requirements. / Nor should their work be considered only as an object of study. / The alliances are most valuable / when scientists and artists have a shared <strong>[xxx]</strong> in a project, / are able to jointly design it / and can <strong>[xxx]</strong> each other’s work. / Such an approach can both prompt new research / as well as result in powerful art.</p>\n<p>但一种<strong>[xxx]</strong>合作关系必须是双向的。 / 回应《自然》调查的艺术家比科学家少； / 然而，几位受访者指出， / 艺术家并不只是协助科学家满足其传播需求。 / 他们的作品也不应该仅仅被视为研究对象。 / 这样的联盟最有价值， / 是在科学家和艺术家在一个项目中拥有共同的<strong>[xxx]</strong>， / 能够共同设计这个项目， / 并且能够<strong>[xxx]</strong>彼此作品的时候。 / 这样的方法既能促成新的研究， / 也能产生强有力的艺术作品。</p>\n</blockquote>\n<p>本题要从第4段的do not simply、Nor should和双方共同设计项目的要求，判断艺术家担心自己在合作中被怎样对待。担忧可以从作者纠正的做法中推断，但不能把理想合作已经能做到的事当成担忧本身。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"33题","raw":"### A. their role may be underestimated\n\n> 他们的作用可能被低估\n\n把A接回题干，它说的是：一些艺术家似乎担心，在艺术与科学的合作中，他们的作用可能被低估。\n\nA说艺术家的作用被低估，回第4段看两句“不应只被当作什么”。\n\n> artists do not simply assist scientists with their communication requirements.\n\n> Nor should their work be considered only as an object of study.\n\n作者先说艺术家不只是协助科学家传播的人，又说他们的作品不应只被当作研究对象。两处都在反对只看到艺术家的一小部分作用。\n\n随后要求双方共同设计项目，说明艺术家也应参与决定做什么、怎样做，而不是只接受一项辅助任务。\n\n**只把艺术家当传播助手或研究对象，是否忽略了他们作为合作者的作用？**\n\n是。A能够概括这些不满，先保留。\n\n**第一轮判断：A保留。**","articleRects":[[274,1182,1122,38],[203,1235,1194,37],[203,1287,1194,37],[203,1339,1194,37],[202,1391,1194,38],[199,1443,1197,38],[202,1496,792,37]],"questionRects":[[293,1182,530,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"保留","qid":"33","paragraphPids":[3]},"html":"<h3>A. their role may be underestimated</h3>\n<blockquote><p>他们的作用可能被低估</p>\n</blockquote>\n<p>把A接回题干，它说的是：一些艺术家似乎担心，在艺术与科学的合作中，他们的作用可能被低估。</p>\n<p>A说艺术家的作用被低估，回第4段看两句“不应只被当作什么”。</p>\n<blockquote><p>artists do not simply assist scientists with their communication requirements.</p>\n</blockquote>\n<blockquote><p>Nor should their work be considered only as an object of study.</p>\n</blockquote>\n<p>作者先说艺术家不只是协助科学家传播的人，又说他们的作品不应只被当作研究对象。两处都在反对只看到艺术家的一小部分作用。</p>\n<p>随后要求双方共同设计项目，说明艺术家也应参与决定做什么、怎样做，而不是只接受一项辅助任务。</p>\n<p><strong>只把艺术家当传播助手或研究对象，是否忽略了他们作为合作者的作用？</strong></p>\n<p>是。A能够概括这些不满，先保留。</p>\n<p><strong>第一轮判断：A保留。</strong></p>\n"},{"section":"33题","raw":"### B. their reputation may be impaired\n\n> 他们的声誉可能受损\n\n把B接回题干，它说的是：一些艺术家似乎担心，在艺术与科学的合作中，他们的声誉可能受损。\n\nB说声誉受损，回第4段看艺术家担心别人怎样看他们。\n\n> artists do not simply assist scientists with their communication requirements.\n\n> only as an object of study\n\n这里要求承认艺术家能参与共同设计、能作出自己的贡献。作品只被当作研究对象，也是在说合作中给予他们的角色太窄。\n\n文中没有说作品受到公众指责、艺术家名声变坏。没有充分发挥作用，与社会评价受损不是同一件事。\n\n**合作角色被看窄，就一定是在说艺术家的声誉受损吗？**\n\n不是。B需要关于名声或公众评价的内容，本段没有提供。\n\n**第一轮判断：B排除。**","articleRects":[[274,1182,1122,38],[203,1235,1194,37],[203,1287,1194,37],[203,1339,1194,37],[202,1391,1194,38],[199,1443,1197,38],[202,1496,792,37]],"questionRects":[[292,1234,528,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"33","paragraphPids":[3]},"html":"<h3>B. their reputation may be impaired</h3>\n<blockquote><p>他们的声誉可能受损</p>\n</blockquote>\n<p>把B接回题干，它说的是：一些艺术家似乎担心，在艺术与科学的合作中，他们的声誉可能受损。</p>\n<p>B说声誉受损，回第4段看艺术家担心别人怎样看他们。</p>\n<blockquote><p>artists do not simply assist scientists with their communication requirements.</p>\n</blockquote>\n<blockquote><p>only as an object of study</p>\n</blockquote>\n<p>这里要求承认艺术家能参与共同设计、能作出自己的贡献。作品只被当作研究对象，也是在说合作中给予他们的角色太窄。</p>\n<p>文中没有说作品受到公众指责、艺术家名声变坏。没有充分发挥作用，与社会评价受损不是同一件事。</p>\n<p><strong>合作角色被看窄，就一定是在说艺术家的声誉受损吗？</strong></p>\n<p>不是。B需要关于名声或公众评价的内容，本段没有提供。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"33题","raw":"### C. their creativity may be inhibited\n\n> 他们的创造力可能受到抑制\n\n把C接回题干，它说的是：一些艺术家似乎担心，在艺术与科学的合作中，他们的创造力可能受到抑制。\n\nC说创造力受抑制，回第4段看jointly design与powerful art。\n\n> artists do not simply assist scientists with their communication requirements.\n\n> are able to jointly design it\n\n> result in powerful art.\n\n作者要求双方共同设计项目，并说这种合作能产生有力量的艺术。若艺术家只负责替科学家传达内容，确实容易让人想到他们自己的设计和创作不容易展开。\n\n不过原文直接说出的还是不应只当助手、不应只当研究对象，尚没有具体说明创造力怎样受到了抑制。\n\n**共同设计的要求，能不能让我们暂时想到创作空间不足的顾虑？**\n\n能想到，但还需要与A比较。先把C保留，后面看作者继续强调合作角色，还是创造力受限。\n\n**第一轮判断：C保留。**","articleRects":[[274,1182,1122,38],[203,1235,1194,37],[203,1287,1194,37],[203,1339,1194,37],[202,1391,1194,38],[199,1443,1197,38],[202,1496,792,37]],"questionRects":[[292,1287,518,37]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"33","paragraphPids":[3]},"html":"<h3>C. their creativity may be inhibited</h3>\n<blockquote><p>他们的创造力可能受到抑制</p>\n</blockquote>\n<p>把C接回题干，它说的是：一些艺术家似乎担心，在艺术与科学的合作中，他们的创造力可能受到抑制。</p>\n<p>C说创造力受抑制，回第4段看jointly design与powerful art。</p>\n<blockquote><p>artists do not simply assist scientists with their communication requirements.</p>\n</blockquote>\n<blockquote><p>are able to jointly design it</p>\n</blockquote>\n<blockquote><p>result in powerful art.</p>\n</blockquote>\n<p>作者要求双方共同设计项目，并说这种合作能产生有力量的艺术。若艺术家只负责替科学家传达内容，确实容易让人想到他们自己的设计和创作不容易展开。</p>\n<p>不过原文直接说出的还是不应只当助手、不应只当研究对象，尚没有具体说明创造力怎样受到了抑制。</p>\n<p><strong>共同设计的要求，能不能让我们暂时想到创作空间不足的顾虑？</strong></p>\n<p>能想到，但还需要与A比较。先把C保留，后面看作者继续强调合作角色，还是创造力受限。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"33题","raw":"### D. their work may be misguided\n\n> 他们的工作可能被引入歧途\n\n把D接回题干，它说的是：一些艺术家似乎担心，在艺术与科学的合作中，他们的工作可能被引入歧途。\n\nD说工作被引入歧途，回第4段看作者有没有判定某个创作方向错误。\n\n> their work be considered only as an object of study.\n\n> are able to jointly design it and can **[xxx]** each other’s work.\n\n作者并没有说帮助科学传播本身是错误工作；他反对的是艺术家只做这种工作。把艺术当研究对象也不是完全不可，而是不应仅止于此。\n\nD说misguided，意味着工作被带到错误方向，和“作用不应限于一种”并不相同。\n\n**这里否定的是传播这项工作，还是只准艺术家发挥这一项作用？**\n\n是后者。D把作用受限改成了工作方向有错。\n\n**第一轮判断：D排除。**","articleRects":[[274,1182,1122,38],[203,1235,1194,37],[203,1287,1194,37],[203,1339,1194,37],[202,1391,1194,38],[199,1443,1197,38],[202,1496,792,37]],"questionRects":[[292,1339,480,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"33","paragraphPids":[3]},"html":"<h3>D. their work may be misguided</h3>\n<blockquote><p>他们的工作可能被引入歧途</p>\n</blockquote>\n<p>把D接回题干，它说的是：一些艺术家似乎担心，在艺术与科学的合作中，他们的工作可能被引入歧途。</p>\n<p>D说工作被引入歧途，回第4段看作者有没有判定某个创作方向错误。</p>\n<blockquote><p>their work be considered only as an object of study.</p>\n</blockquote>\n<blockquote><p>are able to jointly design it and can <strong>[xxx]</strong> each other’s work.</p>\n</blockquote>\n<p>作者并没有说帮助科学传播本身是错误工作；他反对的是艺术家只做这种工作。把艺术当研究对象也不是完全不可，而是不应仅止于此。</p>\n<p>D说misguided，意味着工作被带到错误方向，和“作用不应限于一种”并不相同。</p>\n<p><strong>这里否定的是传播这项工作，还是只准艺术家发挥这一项作用？</strong></p>\n<p>是后者。D把作用受限改成了工作方向有错。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"33题","raw":"### 33题第一次结果\n\n- A保留。\n- B排除。\n- C保留。\n- D排除。\n\n暂时保留：A、C。\n\n第一遍留下A、C。A直接概括艺术家作用被缩小的担忧；C若指创造力缺少发挥机会，也能从只做助手与共同设计的差别中间接引出。","articleRects":[],"questionRects":[[226,1130,967,38],[1199,1162,105,7],[293,1182,530,38],[292,1234,528,38],[292,1287,518,37],[292,1339,480,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"33"},"html":"<h3>33题第一次结果</h3>\n<ul><li>A保留。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂时保留：A、C。</p>\n<p>第一遍留下A、C。A直接概括艺术家作用被缩小的担忧；C若指创造力缺少发挥机会，也能从只做助手与共同设计的差别中间接引出。</p>\n"},{"section":"34题","raw":"## 34题\n\n> What does the author say about CAVS?  \n> 关于高级视觉研究中心，作者说了什么？\n\n题干给出CAVS，可以直接找到第5段的Center for Advanced Visual Studies (CAVS)。把这一整段读完，查看中心的设立目的、围绕光的项目，以及后来对研究人员与艺术家关系的展望。\n\n> 原文参考：\n> \n> More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders **[xxx]** focused their projects around light—hence the ‘visual studies’ in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was **[xxx]** looking to a time when leading researchers could also be artists, writers and poets, and vice versa.\n> \n> 开始精读：\n> \n> More than half a century ago, / the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) / to explore the role of technology in culture. / The founders **[xxx]** focused their projects around light—hence the ‘visual studies’ in the name. / Light was a something that both artists and scientists had an interest in, / and therefore could form the basis of collaboration. / As science and technology progressed, / and divided into more sub-disciplines, / the centre was **[xxx]** looking to a time / when leading researchers could also be artists, writers and poets, / and vice versa.\n> \n> 半个多世纪以前， / 麻省理工学院设立了它的高级视觉研究中心， / 以探索技术在文化中的作用。 / 创办者们**[xxx]**把项目集中在光上——这就是名称中“视觉研究”的由来。 / 光是艺术家和科学家都感兴趣的事物， / 因此可以形成合作的基础。 / 随着科学和技术的进步， / 并分成更多分支学科， / 该中心**[xxx]**展望这样一个时期： / 杰出的研究人员也可以是艺术家、作家和诗人， / 反之亦然。\n\n题目问作者对CAVS的陈述。第5段先交代中心探索技术在文化中的作用，接着说明光为何能成为合作基础，最后谈科学技术发展过程中对跨越研究与艺术身份的展望，选项要与这些具体关系核对。\n\n接下来按A—D逐项看。","articleRects":[[274,1548,1122,37],[202,1598,1196,39],[202,1652,1194,38],[203,1703,1192,39],[203,1757,1196,36],[202,1809,1194,38],[202,1861,1194,38],[202,1913,991,38]],"questionRects":[[226,1443,654,38],[292,1496,772,37],[292,1548,696,37],[292,1600,718,38],[292,1652,742,38]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[4],"qid":"34","initialReadingPids":[4]},"html":"<h2>34题</h2>\n<blockquote><p>What does the author say about CAVS?<br />\n关于高级视觉研究中心，作者说了什么？</p>\n</blockquote>\n<p>题干给出CAVS，可以直接找到第5段的Center for Advanced Visual Studies (CAVS)。把这一整段读完，查看中心的设立目的、围绕光的项目，以及后来对研究人员与艺术家关系的展望。</p>\n<blockquote><p>原文参考：</p>\n<p>More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture. The founders <strong>[xxx]</strong> focused their projects around light—hence the ‘visual studies’ in the name. Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration. As science and technology progressed, and divided into more sub-disciplines, the centre was <strong>[xxx]</strong> looking to a time when leading researchers could also be artists, writers and poets, and vice versa.</p>\n<p>开始精读：</p>\n<p>More than half a century ago, / the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) / to explore the role of technology in culture. / The founders <strong>[xxx]</strong> focused their projects around light—hence the ‘visual studies’ in the name. / Light was a something that both artists and scientists had an interest in, / and therefore could form the basis of collaboration. / As science and technology progressed, / and divided into more sub-disciplines, / the centre was <strong>[xxx]</strong> looking to a time / when leading researchers could also be artists, writers and poets, / and vice versa.</p>\n<p>半个多世纪以前， / 麻省理工学院设立了它的高级视觉研究中心， / 以探索技术在文化中的作用。 / 创办者们<strong>[xxx]</strong>把项目集中在光上——这就是名称中“视觉研究”的由来。 / 光是艺术家和科学家都感兴趣的事物， / 因此可以形成合作的基础。 / 随着科学和技术的进步， / 并分成更多分支学科， / 该中心<strong>[xxx]</strong>展望这样一个时期： / 杰出的研究人员也可以是艺术家、作家和诗人， / 反之亦然。</p>\n</blockquote>\n<p>题目问作者对CAVS的陈述。第5段先交代中心探索技术在文化中的作用，接着说明光为何能成为合作基础，最后谈科学技术发展过程中对跨越研究与艺术身份的展望，选项要与这些具体关系核对。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"34题","raw":"### A. It was headed alternately by artists and scientists.\n\n> 它曾由艺术家和科学家轮流领导\n\n把A接回题干，它说的是：关于CAVS，作者说它曾由艺术家和科学家轮流领导。\n\nA说艺术家和科学家轮流领导，回第5段找leading researchers。\n\n> when leading researchers could also be artists, writers and poets, and vice versa.\n\nleading researchers是优秀或处于前列的研究人员，后面说他们也可能同时是艺术家、作家或诗人。句子讨论一个人兼具多种身份。\n\nA却把leading读成领导中心，又加上alternately轮流。原文既没有轮换顺序，也没有介绍中心负责人。\n\n**leading researchers在这里是在列中心领导的轮班安排吗？**\n\n不是。它说的是研究者可以兼有艺术身份，A换成了管理安排。\n\n**第一轮判断：A排除。**","articleRects":[[274,1548,1122,37],[202,1598,1196,39],[202,1652,1194,38],[203,1703,1192,39],[203,1757,1196,36],[202,1809,1194,38],[202,1861,1194,38],[202,1913,991,38]],"questionRects":[[292,1496,772,37]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"34","paragraphPids":[4]},"html":"<h3>A. It was headed alternately by artists and scientists.</h3>\n<blockquote><p>它曾由艺术家和科学家轮流领导</p>\n</blockquote>\n<p>把A接回题干，它说的是：关于CAVS，作者说它曾由艺术家和科学家轮流领导。</p>\n<p>A说艺术家和科学家轮流领导，回第5段找leading researchers。</p>\n<blockquote><p>when leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n<p>leading researchers是优秀或处于前列的研究人员，后面说他们也可能同时是艺术家、作家或诗人。句子讨论一个人兼具多种身份。</p>\n<p>A却把leading读成领导中心，又加上alternately轮流。原文既没有轮换顺序，也没有介绍中心负责人。</p>\n<p><strong>leading researchers在这里是在列中心领导的轮班安排吗？</strong></p>\n<p>不是。它说的是研究者可以兼有艺术身份，A换成了管理安排。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"34题","raw":"### B. It exemplified valuable art-science alliances.\n\n> 它体现了有价值的艺术与科学联盟\n\n把B接回题干，它说的是：关于CAVS，作者说它体现了有价值的艺术与科学联盟。\n\nB说有价值的合作实例，回第5段看为什么选择光。\n\n> to explore the role of technology in culture.\n\n> both artists and scientists had an interest in, and therefore could form the basis of collaboration.\n\n光同时吸引艺术家和科学家，因此可以成为合作基础。这不是单方面替另一方完成任务，而是双方都有自己关心的东西。\n\n后面又期待研究者能兼为艺术家，艺术家也能兼为研究者，继续把两方面联系起来。\n\n**共同兴趣和可以相兼的身份，能不能说明两者形成有价值的合作？**\n\n能。B与这段展开的内容相符，保留。\n\n**第一轮判断：B保留。**","articleRects":[[274,1548,1122,37],[202,1598,1196,39],[202,1652,1194,38],[203,1703,1192,39],[203,1757,1196,36],[202,1809,1194,38],[202,1861,1194,38],[202,1913,991,38]],"questionRects":[[292,1548,696,37]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"保留","qid":"34","paragraphPids":[4]},"html":"<h3>B. It exemplified valuable art-science alliances.</h3>\n<blockquote><p>它体现了有价值的艺术与科学联盟</p>\n</blockquote>\n<p>把B接回题干，它说的是：关于CAVS，作者说它体现了有价值的艺术与科学联盟。</p>\n<p>B说有价值的合作实例，回第5段看为什么选择光。</p>\n<blockquote><p>to explore the role of technology in culture.</p>\n</blockquote>\n<blockquote><p>both artists and scientists had an interest in, and therefore could form the basis of collaboration.</p>\n</blockquote>\n<p>光同时吸引艺术家和科学家，因此可以成为合作基础。这不是单方面替另一方完成任务，而是双方都有自己关心的东西。</p>\n<p>后面又期待研究者能兼为艺术家，艺术家也能兼为研究者，继续把两方面联系起来。</p>\n<p><strong>共同兴趣和可以相兼的身份，能不能说明两者形成有价值的合作？</strong></p>\n<p>能。B与这段展开的内容相符，保留。</p>\n<p><strong>第一轮判断：B保留。</strong></p>\n"},{"section":"34题","raw":"### C. Its projects aimed at advancing visual studies.\n\n> 它的项目旨在推进视觉研究\n\n把C接回题干，它说的是：关于CAVS，作者说它的项目旨在推进视觉研究。\n\nC说项目推进视觉研究，回第5段看light与visual studies的联系。\n\n> to explore the role of technology in culture.\n\n> focused their projects around light—hence the ‘visual studies’ in the name.\n\n中心名称中确实有visual studies，项目也围绕光展开。只从研究对象看，把这些项目理解成视觉方面的研究并不突兀。\n\n但这段还说光是双方共同感兴趣的合作基础，开头的目的也是探索技术在文化中的作用。C把目的单独落在推进视觉研究上，是否够准确，还要回头接着前后段看。\n\n**围绕光开展项目，是否足以确定作者要强调的就是推进视觉研究？**\n\n还不能完全确定。先保留C与B比较，看中心的例子重点说明视觉研究的进展，还是双方怎样合作。\n\n**第一轮判断：C保留。**","articleRects":[[274,1548,1122,37],[202,1598,1196,39],[202,1652,1194,38],[203,1703,1192,39],[203,1757,1196,36],[202,1809,1194,38],[202,1861,1194,38],[202,1913,991,38]],"questionRects":[[292,1600,718,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"34","paragraphPids":[4]},"html":"<h3>C. Its projects aimed at advancing visual studies.</h3>\n<blockquote><p>它的项目旨在推进视觉研究</p>\n</blockquote>\n<p>把C接回题干，它说的是：关于CAVS，作者说它的项目旨在推进视觉研究。</p>\n<p>C说项目推进视觉研究，回第5段看light与visual studies的联系。</p>\n<blockquote><p>to explore the role of technology in culture.</p>\n</blockquote>\n<blockquote><p>focused their projects around light—hence the ‘visual studies’ in the name.</p>\n</blockquote>\n<p>中心名称中确实有visual studies，项目也围绕光展开。只从研究对象看，把这些项目理解成视觉方面的研究并不突兀。</p>\n<p>但这段还说光是双方共同感兴趣的合作基础，开头的目的也是探索技术在文化中的作用。C把目的单独落在推进视觉研究上，是否够准确，还要回头接着前后段看。</p>\n<p><strong>围绕光开展项目，是否足以确定作者要强调的就是推进视觉研究？</strong></p>\n<p>还不能完全确定。先保留C与B比较，看中心的例子重点说明视觉研究的进展，还是双方怎样合作。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"34题","raw":"### D. Its founders sought to raise the status of artists.\n\n> 它的创办者试图提高艺术家的地位\n\n把D接回题干，它说的是：关于CAVS，作者说它的创办者试图提高艺术家的地位。\n\nD说创办者提高艺术家地位，回第5段看成立中心的目的。\n\n> The founders **[xxx]** focused their projects around light\n\n> leading researchers could also be artists, writers and poets, and vice versa.\n\n中心成立是为了探索技术在文化中的作用，随后以双方都感兴趣的光建立合作。研究者与艺术家可以互兼身份，也是在说明联系。\n\n这里没有说艺术家原来地位低，也没有说明中心成立后要提升他们的社会地位。\n\n**让艺术家参与共同研究，是否就等于以提高其地位为办学目的？**\n\n不能等同。D把参与合作改成了原文没有提出的地位目标。\n\n**第一轮判断：D排除。**","articleRects":[[274,1548,1122,37],[202,1598,1196,39],[202,1652,1194,38],[203,1703,1192,39],[203,1757,1196,36],[202,1809,1194,38],[202,1861,1194,38],[202,1913,991,38]],"questionRects":[[292,1652,742,38]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"34","paragraphPids":[4]},"html":"<h3>D. Its founders sought to raise the status of artists.</h3>\n<blockquote><p>它的创办者试图提高艺术家的地位</p>\n</blockquote>\n<p>把D接回题干，它说的是：关于CAVS，作者说它的创办者试图提高艺术家的地位。</p>\n<p>D说创办者提高艺术家地位，回第5段看成立中心的目的。</p>\n<blockquote><p>The founders <strong>[xxx]</strong> focused their projects around light</p>\n</blockquote>\n<blockquote><p>leading researchers could also be artists, writers and poets, and vice versa.</p>\n</blockquote>\n<p>中心成立是为了探索技术在文化中的作用，随后以双方都感兴趣的光建立合作。研究者与艺术家可以互兼身份，也是在说明联系。</p>\n<p>这里没有说艺术家原来地位低，也没有说明中心成立后要提升他们的社会地位。</p>\n<p><strong>让艺术家参与共同研究，是否就等于以提高其地位为办学目的？</strong></p>\n<p>不能等同。D把参与合作改成了原文没有提出的地位目标。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"34题","raw":"### 34题第一次结果\n\n- A排除。\n- B保留。\n- C保留。\n- D排除。\n\n暂时保留：B、C。\n\n第一遍留下B、C。共同兴趣作为合作基础支持B；若把围绕光的项目宽泛理解为推进视觉研究，C也可以成立。","articleRects":[],"questionRects":[[226,1443,654,38],[292,1496,772,37],[292,1548,696,37],[292,1600,718,38],[292,1652,742,38]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"34"},"html":"<h3>34题第一次结果</h3>\n<ul><li>A排除。</li><li>B保留。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>暂时保留：B、C。</p>\n<p>第一遍留下B、C。共同兴趣作为合作基础支持B；若把围绕光的项目宽泛理解为推进视觉研究，C也可以成立。</p>\n"},{"section":"35题","raw":"## 35题\n\n> In the last paragraph, the author holds that art-science collaborations ______.  \n> 在最后一段中，作者认为艺术与科学的合作应当怎样？\n\n题干明确给出In the last paragraph，直接把第6段完整读完。注意作者从调查趋势转到to make a collaboration work，随后用needs to和must not提出要求，最后说明双方共同具有的特点。\n\n> 原文参考：\n> \n> Nature’s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and **[xxx]** surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of **[xxx]** each other. Artists and scientists alike are **[xxx]** in discovery and invention, and challenge and critique are core to both, too.\n> \n> 开始精读：\n> \n> Nature’s poll findings suggest that this trend is as strong as ever, / but, to make a collaboration work, / both sides need to invest time, / and **[xxx]** surprise and challenge. / The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, / and participants must not fall into the trap of **[xxx]** each other. / Artists and scientists alike are **[xxx]** in discovery and invention, / and challenge and critique are core to both, too.\n> \n> 《自然》的调查结果表明，这种趋势一如既往地强劲， / 但是，要使合作成功， / 双方都需要投入时间， / 并且**[xxx]**惊喜与挑战。 / 艺术与科学合作的范围需要超出传播研究这一必要目的， / 参与者还不能陷入**[xxx]**彼此的陷阱。 / 艺术家与科学家同样在发现和发明中**[xxx]**， / 而且挑战和批评也是两者的核心。\n\n本题要概括作者对艺术与科学合作的要求。第6段既谈双方投入时间，又谈合作范围超出研究传播，并指出挑战和批评对双方都很重要；空格需要把这些话中的具体主张准确接到合作上。\n\n接下来按A—D逐项看。","articleRects":[[273,1965,1123,38],[228,2269,1193,38],[228,2321,1193,38],[227,2373,1197,38],[229,2426,1193,38],[228,2478,878,38]],"questionRects":[[226,1757,1067,37],[293,1809,681,38],[293,1861,665,38],[294,1913,696,38],[293,1965,627,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"question","paragraphPids":[5],"qid":"35","initialReadingPids":[5]},"html":"<h2>35题</h2>\n<blockquote><p>In the last paragraph, the author holds that art-science collaborations ______.<br />\n在最后一段中，作者认为艺术与科学的合作应当怎样？</p>\n</blockquote>\n<p>题干明确给出In the last paragraph，直接把第6段完整读完。注意作者从调查趋势转到to make a collaboration work，随后用needs to和must not提出要求，最后说明双方共同具有的特点。</p>\n<blockquote><p>原文参考：</p>\n<p>Nature’s poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and <strong>[xxx]</strong> surprise and challenge. The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of <strong>[xxx]</strong> each other. Artists and scientists alike are <strong>[xxx]</strong> in discovery and invention, and challenge and critique are core to both, too.</p>\n<p>开始精读：</p>\n<p>Nature’s poll findings suggest that this trend is as strong as ever, / but, to make a collaboration work, / both sides need to invest time, / and <strong>[xxx]</strong> surprise and challenge. / The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, / and participants must not fall into the trap of <strong>[xxx]</strong> each other. / Artists and scientists alike are <strong>[xxx]</strong> in discovery and invention, / and challenge and critique are core to both, too.</p>\n<p>《自然》的调查结果表明，这种趋势一如既往地强劲， / 但是，要使合作成功， / 双方都需要投入时间， / 并且<strong>[xxx]</strong>惊喜与挑战。 / 艺术与科学合作的范围需要超出传播研究这一必要目的， / 参与者还不能陷入<strong>[xxx]</strong>彼此的陷阱。 / 艺术家与科学家同样在发现和发明中<strong>[xxx]</strong>， / 而且挑战和批评也是两者的核心。</p>\n</blockquote>\n<p>本题要概括作者对艺术与科学合作的要求。第6段既谈双方投入时间，又谈合作范围超出研究传播，并指出挑战和批评对双方都很重要；空格需要把这些话中的具体主张准确接到合作上。</p>\n<p>接下来按A—D逐项看。</p>\n"},{"section":"35题","raw":"### A. are likely to go beyond public expectations\n\n> 很可能超出公众的预期\n\n把A接回题干，它说的是：在最后一段中，作者认为艺术与科学的合作很可能超出公众的预期。\n\nA说超过公众预期，回末段找go beyond后面的对象。\n\n> The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication\n\n原文说合作要超出research communication这个必要目的。要超出的是现有传播任务，而不是公众对合作的预期。\n\n前面提到surprise和challenge，也是在说参与双方面对的合作过程，没有调查公众原先期待达到什么程度。\n\n**go beyond超出的到底是谁的预期吗？**\n\n不是预期，而是只为传播研究服务的范围。A把beyond后面的内容换掉了。\n\n**第一轮判断：A排除。**","articleRects":[[273,1965,1123,38],[228,2269,1193,38],[228,2321,1193,38],[227,2373,1197,38],[229,2426,1193,38],[228,2478,878,38]],"questionRects":[[293,1809,681,38]],"scrollTarget":"article","meta":{"kind":"option","option":"A","status":"排除","qid":"35","paragraphPids":[5]},"html":"<h3>A. are likely to go beyond public expectations</h3>\n<blockquote><p>很可能超出公众的预期</p>\n</blockquote>\n<p>把A接回题干，它说的是：在最后一段中，作者认为艺术与科学的合作很可能超出公众的预期。</p>\n<p>A说超过公众预期，回末段找go beyond后面的对象。</p>\n<blockquote><p>The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication</p>\n</blockquote>\n<p>原文说合作要超出research communication这个必要目的。要超出的是现有传播任务，而不是公众对合作的预期。</p>\n<p>前面提到surprise和challenge，也是在说参与双方面对的合作过程，没有调查公众原先期待达到什么程度。</p>\n<p><strong>go beyond超出的到底是谁的预期吗？</strong></p>\n<p>不是预期，而是只为传播研究服务的范围。A把beyond后面的内容换掉了。</p>\n<p><strong>第一轮判断：A排除。</strong></p>\n"},{"section":"35题","raw":"### B. will intensify interdisciplinary competition\n\n> 将加剧学科之间的竞争\n\n把B接回题干，它说的是：在最后一段中，作者认为艺术与科学的合作将加剧学科之间的竞争。\n\nB说学科竞争加剧，回末段看challenge and critique用于什么关系。\n\n> and challenge and critique are core to both, too.\n\n作者说两方都应投入时间，也都需要发现、发明、挑战和批评。双方在合作中可以提出不同看法，不等于学科之间要争夺输赢。\n\n文中没有写谁与谁竞争资源或地位，更没有比较竞争比过去激烈。\n\n**合作中的质疑和批评，就等于学科竞争加剧吗？**\n\n不等于。B把共同工作的要求改成了学科竞争。\n\n**第一轮判断：B排除。**","articleRects":[[273,1965,1123,38],[228,2269,1193,38],[228,2321,1193,38],[227,2373,1197,38],[229,2426,1193,38],[228,2478,878,38]],"questionRects":[[293,1861,665,38]],"scrollTarget":"article","meta":{"kind":"option","option":"B","status":"排除","qid":"35","paragraphPids":[5]},"html":"<h3>B. will intensify interdisciplinary competition</h3>\n<blockquote><p>将加剧学科之间的竞争</p>\n</blockquote>\n<p>把B接回题干，它说的是：在最后一段中，作者认为艺术与科学的合作将加剧学科之间的竞争。</p>\n<p>B说学科竞争加剧，回末段看challenge and critique用于什么关系。</p>\n<blockquote><p>and challenge and critique are core to both, too.</p>\n</blockquote>\n<p>作者说两方都应投入时间，也都需要发现、发明、挑战和批评。双方在合作中可以提出不同看法，不等于学科之间要争夺输赢。</p>\n<p>文中没有写谁与谁竞争资源或地位，更没有比较竞争比过去激烈。</p>\n<p><strong>合作中的质疑和批评，就等于学科竞争加剧吗？</strong></p>\n<p>不等于。B把共同工作的要求改成了学科竞争。</p>\n<p><strong>第一轮判断：B排除。</strong></p>\n"},{"section":"35题","raw":"### C. should do more than communicating science\n\n> 应当做得比传播科学更多\n\n把C接回题干，它说的是：在最后一段中，作者认为艺术与科学的合作应当做得比传播科学更多。\n\nC说不能只传播科学，回末段看go beyond research communication。\n\n> The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication\n\n作者明确要求合作超出必要的科研传播目的，并接着说双方都有发现、发明、挑战和批评的能力。\n\n不是说传播不需要做，而是合作还可以让双方参与研究和创作，不能到传播这一步就停止。\n\n**should do more than communicating science是否保留了传播之外还要做更多的要求？**\n\n保留了。C直接对应go beyond，可以保留。\n\n**第一轮判断：C保留。**","articleRects":[[273,1965,1123,38],[228,2269,1193,38],[228,2321,1193,38],[227,2373,1197,38],[229,2426,1193,38],[228,2478,878,38]],"questionRects":[[294,1913,696,38]],"scrollTarget":"article","meta":{"kind":"option","option":"C","status":"保留","qid":"35","paragraphPids":[5]},"html":"<h3>C. should do more than communicating science</h3>\n<blockquote><p>应当做得比传播科学更多</p>\n</blockquote>\n<p>把C接回题干，它说的是：在最后一段中，作者认为艺术与科学的合作应当做得比传播科学更多。</p>\n<p>C说不能只传播科学，回末段看go beyond research communication。</p>\n<blockquote><p>The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication</p>\n</blockquote>\n<p>作者明确要求合作超出必要的科研传播目的，并接着说双方都有发现、发明、挑战和批评的能力。</p>\n<p>不是说传播不需要做，而是合作还可以让双方参与研究和创作，不能到传播这一步就停止。</p>\n<p><strong>should do more than communicating science是否保留了传播之外还要做更多的要求？</strong></p>\n<p>保留了。C直接对应go beyond，可以保留。</p>\n<p><strong>第一轮判断：C保留。</strong></p>\n"},{"section":"35题","raw":"### D. are becoming more popular than before\n\n> 正变得比以前更受欢迎\n\n把D接回题干，它说的是：在最后一段中，作者认为艺术与科学的合作正变得比以前更受欢迎。\n\nD说比以前更受欢迎，回末段看as strong as ever怎样比较。\n\n> Nature’s poll findings suggest that this trend is as strong as ever\n\nas strong as ever说明这种趋势仍然和以往一样强劲，并没有说如今已经超过以往。后面的but又把话题转到怎样让合作真正有效。\n\n第1段的积极回应也没有拿两个时期的人数或意愿作比较。不能把一直有吸引力改成越来越受欢迎。\n\n**仍与以往一样强劲，是否就是比以前更受欢迎？**\n\n不是。D加出了原文没有给出的增长比较。\n\n**第一轮判断：D排除。**","articleRects":[[273,1965,1123,38],[228,2269,1193,38],[228,2321,1193,38],[227,2373,1197,38],[229,2426,1193,38],[228,2478,878,38]],"questionRects":[[293,1965,627,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"option","option":"D","status":"排除","qid":"35","paragraphPids":[5]},"html":"<h3>D. are becoming more popular than before</h3>\n<blockquote><p>正变得比以前更受欢迎</p>\n</blockquote>\n<p>把D接回题干，它说的是：在最后一段中，作者认为艺术与科学的合作正变得比以前更受欢迎。</p>\n<p>D说比以前更受欢迎，回末段看as strong as ever怎样比较。</p>\n<blockquote><p>Nature’s poll findings suggest that this trend is as strong as ever</p>\n</blockquote>\n<p>as strong as ever说明这种趋势仍然和以往一样强劲，并没有说如今已经超过以往。后面的but又把话题转到怎样让合作真正有效。</p>\n<p>第1段的积极回应也没有拿两个时期的人数或意愿作比较。不能把一直有吸引力改成越来越受欢迎。</p>\n<p><strong>仍与以往一样强劲，是否就是比以前更受欢迎？</strong></p>\n<p>不是。D加出了原文没有给出的增长比较。</p>\n<p><strong>第一轮判断：D排除。</strong></p>\n"},{"section":"35题","raw":"### 35题第一次结果\n\n- A排除。\n- B排除。\n- C保留。\n- D排除。\n\n当前选择：C。\n\n第一遍留下C。作者明确要求艺术与科学合作超出研究传播这一必要目的。","articleRects":[],"questionRects":[[226,1757,1067,37],[293,1809,681,38],[293,1861,665,38],[294,1913,696,38],[293,1965,627,38],[588,2092,469,35]],"scrollTarget":"article","meta":{"kind":"first_result","qid":"35"},"html":"<h3>35题第一次结果</h3>\n<ul><li>A排除。</li><li>B排除。</li><li>C保留。</li><li>D排除。</li></ul>\n<p>当前选择：C。</p>\n<p>第一遍留下C。作者明确要求艺术与科学合作超出研究传播这一必要目的。</p>\n"},{"section":"进阶方法","raw":"# 4.把全文连起来看\n\n先把每一段实际推进的事情接起来。\n\n| 段落 | 原文抓手 | 本段说了什么 | 与前后怎样相接 |\n| --- | --- | --- | --- |\n| 第1段 | would consider doing so in future | 以“would consider doing so in future”交代调查中的合作意愿：一部分人已有合作经历，几乎所有人愿意考虑未来合作，由此引出艺术与科学合作的话题。 | 以调查中的合作意愿引出艺术与科学合作。 |\n| 第2段 | reach a broader audience | 用“reach a broader audience”说明这种意愿为何不令人意外：艺术家能帮助科学家接触更多受众，并建立促进学习的情感联系，解释前段合作受到欢迎的一种原因。 | 解释合作受到欢迎的一个原因：艺术能够帮助科学传播。 |\n| 第3段 | latest climate prediction data；a creative call to action | 以“latest climate prediction data”写《四季》改编把气候数据融进音乐，并以“a creative call to action”交代演出作用，为上一段艺术帮助科学传播的说法提供实例。 | 用音乐改编实例具体展示前段所说的传播作用。 |\n| 第4段 | a two-way street；jointly design it | 以“a two-way street”转向对合作关系的要求：艺术家不应只协助传播，作品也不应只被当作研究对象；双方应能“jointly design it”，使合作既促成研究又产生艺术。这一转折把讨论从艺术对科学的帮助推进到双方共同参与。 | 转向合作应有的关系，提出双方共同参与而非只辅助传播。 |\n| 第5段 | the basis of collaboration | 用“the basis of collaboration”说明高级视觉研究中心为何围绕光开展项目：光是艺术家和科学家都感兴趣的事物。末句又展望研究人员与艺术家等身份可以相兼，承接前段对双向合作的要求。 | 用围绕光的合作项目承接双向合作要求，并展望身份相兼。 |\n| 第6段 | go beyond the necessary purpose of research communication | 以“go beyond the necessary purpose of research communication”提出结论：合作不能止于研究传播，双方需投入时间，挑战与批评也是两边共有的核心。 | 提出超越研究传播的合作方向，收束双方共同投入、共同产生成果的主张。 |\n\n全文肯定艺术帮助科学传播的作用，同时主张把合作发展为双方都能参与、共同产生研究和艺术成果的关系。","articleRects":[[273,294,1123,38],[202,347,1194,37],[202,399,1187,37],[202,451,1194,38],[202,503,1193,38],[202,555,96,31],[274,608,1122,37],[203,660,1183,38],[204,711,1192,39],[202,763,660,39],[274,816,1122,38],[202,869,1194,38],[202,921,1194,38],[202,973,1194,38],[202,1025,1194,38],[202,1074,1194,45],[202,1130,677,38],[274,1182,1122,38],[203,1235,1194,37],[203,1287,1194,37],[203,1339,1194,37],[202,1391,1194,38],[199,1443,1197,38],[202,1496,792,37],[274,1548,1122,37],[202,1598,1196,39],[202,1652,1194,38],[203,1703,1192,39],[203,1757,1196,36],[202,1809,1194,38],[202,1861,1194,38],[202,1913,991,38],[273,1965,1123,38],[228,2269,1193,38],[228,2321,1193,38],[227,2373,1197,38],[229,2426,1193,38],[228,2478,878,38]],"questionRects":[],"scrollTarget":"article","meta":{"kind":"review_intro","role":"whole_text_argument","paragraphPids":[0,1,2,3,4,5]},"html":"<h1>4.把全文连起来看</h1>\n<p>先把每一段实际推进的事情接起来。</p>\n<table><thead><tr><th>段落</th><th>原文抓手</th><th>本段说了什么</th><th>与前后怎样相接</th></tr></thead><tbody><tr><td>第1段</td><td>would consider doing so in future</td><td>以“would consider doing so in future”交代调查中的合作意愿：一部分人已有合作经历，几乎所有人愿意考虑未来合作，由此引出艺术与科学合作的话题。</td><td>以调查中的合作意愿引出艺术与科学合作。</td></tr><tr><td>第2段</td><td>reach a broader audience</td><td>用“reach a broader audience”说明这种意愿为何不令人意外：艺术家能帮助科学家接触更多受众，并建立促进学习的情感联系，解释前段合作受到欢迎的一种原因。</td><td>解释合作受到欢迎的一个原因：艺术能够帮助科学传播。</td></tr><tr><td>第3段</td><td>latest climate prediction data；a creative call to action</td><td>以“latest climate prediction data”写《四季》改编把气候数据融进音乐，并以“a creative call to action”交代演出作用，为上一段艺术帮助科学传播的说法提供实例。</td><td>用音乐改编实例具体展示前段所说的传播作用。</td></tr><tr><td>第4段</td><td>a two-way street；jointly design it</td><td>以“a two-way street”转向对合作关系的要求：艺术家不应只协助传播，作品也不应只被当作研究对象；双方应能“jointly design it”，使合作既促成研究又产生艺术。这一转折把讨论从艺术对科学的帮助推进到双方共同参与。</td><td>转向合作应有的关系，提出双方共同参与而非只辅助传播。</td></tr><tr><td>第5段</td><td>the basis of collaboration</td><td>用“the basis of collaboration”说明高级视觉研究中心为何围绕光开展项目：光是艺术家和科学家都感兴趣的事物。末句又展望研究人员与艺术家等身份可以相兼，承接前段对双向合作的要求。</td><td>用围绕光的合作项目承接双向合作要求，并展望身份相兼。</td></tr><tr><td>第6段</td><td>go beyond the necessary purpose of research communication</td><td>以“go beyond the necessary purpose of research communication”提出结论：合作不能止于研究传播，双方需投入时间，挑战与批评也是两边共有的核心。</td><td>提出超越研究传播的合作方向，收束双方共同投入、共同产生成果的主张。</td></tr></tbody></table>\n<p>全文肯定艺术帮助科学传播的作用，同时主张把合作发展为双方都能参与、共同产生研究和艺术成果的关系。</p>\n"},{"section":"进阶回查","raw":"## 回查33题：A还是C？\n\nSome artists seem to worry that in the art-science partnership ______.\n\nA. their role may be underestimated\n\nC. their creativity may be inhibited\n\n第一轮我们看到“共同设计”，想到如果只让艺术家协助传播，他们的创作空间可能不够，因此把C也留下了。现在再看第4段提出的两件事：\n\n> artists do not simply assist scientists with their communication requirements.\n> Nor should their work be considered only as an object of study.\n\n一件是不应只当传播助手，另一件是作品不应只被当研究对象。第一件可以让我们想到创作空间，但第二件说的是别人怎样对待已有作品，并没有交代创造力受到什么抑制。两句共同反对的是只承认艺术家的某一种作用。\n\n第5段选光作为合作基础，因为双方都感兴趣；末段又要求合作超出科研传播。后文一直在让艺术家以合作者的身份投入自己的研究、发现和创作，而不只是为科学家提供帮助。\n\n**把两种被反对的安排放在一起，A和C哪一个都能直接接上？**\n\nA。无论只当传播助手，还是只把作品当研究对象，都会把艺术家的作用看窄。C可以是我们想到的一种后果，但原文没有继续说明创造力怎样被压制，不能概括这两句的共同意思。\n\n**33题选A。**","articleRects":[[274,1182,1122,38],[203,1235,1194,37],[203,1287,1194,37],[203,1339,1194,37],[202,1391,1194,38],[199,1443,1197,38],[202,1496,792,37],[274,1548,1122,37],[202,1598,1196,39],[202,1652,1194,38],[203,1703,1192,39],[203,1757,1196,36],[202,1809,1194,38],[202,1861,1194,38],[202,1913,991,38],[273,1965,1123,38],[228,2269,1193,38],[228,2321,1193,38],[227,2373,1197,38],[229,2426,1193,38],[228,2478,878,38]],"questionRects":[[226,1130,967,38],[1199,1162,105,7],[293,1182,530,38],[292,1234,528,38],[292,1287,518,37],[292,1339,480,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["A","C"],"newEvidencePids":[5,6],"finalChoice":"A","qid":"33","paragraphPids":[0,1,2,3,4,5]},"html":"<h2>回查33题：A还是C？</h2>\n<p>Some artists seem to worry that in the art-science partnership ______.</p>\n<p>A. their role may be underestimated</p>\n<p>C. their creativity may be inhibited</p>\n<p>第一轮我们看到“共同设计”，想到如果只让艺术家协助传播，他们的创作空间可能不够，因此把C也留下了。现在再看第4段提出的两件事：</p>\n<blockquote><p>artists do not simply assist scientists with their communication requirements.\nNor should their work be considered only as an object of study.</p>\n</blockquote>\n<p>一件是不应只当传播助手，另一件是作品不应只被当研究对象。第一件可以让我们想到创作空间，但第二件说的是别人怎样对待已有作品，并没有交代创造力受到什么抑制。两句共同反对的是只承认艺术家的某一种作用。</p>\n<p>第5段选光作为合作基础，因为双方都感兴趣；末段又要求合作超出科研传播。后文一直在让艺术家以合作者的身份投入自己的研究、发现和创作，而不只是为科学家提供帮助。</p>\n<p><strong>把两种被反对的安排放在一起，A和C哪一个都能直接接上？</strong></p>\n<p>A。无论只当传播助手，还是只把作品当研究对象，都会把艺术家的作用看窄。C可以是我们想到的一种后果，但原文没有继续说明创造力怎样被压制，不能概括这两句的共同意思。</p>\n<p><strong>33题选A。</strong></p>\n"},{"section":"进阶回查","raw":"## 回查34题：B还是C？\n\nWhat does the author say about CAVS?\n\nB. It exemplified valuable art-science alliances.\n\nC. Its projects aimed at advancing visual studies.\n\n第一轮看到光和visual studies，我们把C留下了。现在把这两个词前后的说明接起来：\n\n> The founders [xxx] focused their projects around light—hence the ‘visual studies’ in the name.\n> Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration.\n\nhence解释名字为什么有“视觉研究”；therefore解释为什么光能作为合作基础。光不是只供某一方使用，而是两方都有兴趣。后面期待研究人员也可以是艺术家，艺术家也可以是研究人员，还是在说明两方的联系。\n\n再看前一段，作者刚说双方共同设计的合作最有价值；中心的例子接着让我们看到，这样的共同点可以怎样找到。它的成立目的写的是探索技术在文化中的作用，作者没有接着列出视觉研究被推进了哪些成果。\n\n**中心涉及视觉研究，是否就能把它在这里的目的定成推进视觉研究？**\n\n不能仅凭名称和研究对象这样确定。C抓到了项目涉及的领域，B却能接上作者明确展开的共同兴趣、合作基础和相兼身份。\n\n**34题选B。**","articleRects":[[274,1548,1122,37],[202,1598,1196,39],[202,1652,1194,38],[203,1703,1192,39],[203,1757,1196,36],[202,1809,1194,38],[202,1861,1194,38],[202,1913,991,38],[274,1182,1122,38],[203,1235,1194,37],[203,1287,1194,37],[203,1339,1194,37],[202,1391,1194,38],[199,1443,1197,38],[202,1496,792,37],[273,1965,1123,38],[228,2269,1193,38],[228,2321,1193,38],[227,2373,1197,38],[229,2426,1193,38],[228,2478,878,38]],"questionRects":[[226,1443,654,38],[292,1496,772,37],[292,1548,696,37],[292,1600,718,38],[292,1652,742,38]],"scrollTarget":"article","meta":{"kind":"review","reviewCandidates":["B","C"],"newEvidencePids":[4,6],"finalChoice":"B","qid":"34","paragraphPids":[0,1,2,3,4,5]},"html":"<h2>回查34题：B还是C？</h2>\n<p>What does the author say about CAVS?</p>\n<p>B. It exemplified valuable art-science alliances.</p>\n<p>C. Its projects aimed at advancing visual studies.</p>\n<p>第一轮看到光和visual studies，我们把C留下了。现在把这两个词前后的说明接起来：</p>\n<blockquote><p>The founders [xxx] focused their projects around light—hence the ‘visual studies’ in the name.\nLight was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration.</p>\n</blockquote>\n<p>hence解释名字为什么有“视觉研究”；therefore解释为什么光能作为合作基础。光不是只供某一方使用，而是两方都有兴趣。后面期待研究人员也可以是艺术家，艺术家也可以是研究人员，还是在说明两方的联系。</p>\n<p>再看前一段，作者刚说双方共同设计的合作最有价值；中心的例子接着让我们看到，这样的共同点可以怎样找到。它的成立目的写的是探索技术在文化中的作用，作者没有接着列出视觉研究被推进了哪些成果。</p>\n<p><strong>中心涉及视觉研究，是否就能把它在这里的目的定成推进视觉研究？</strong></p>\n<p>不能仅凭名称和研究对象这样确定。C抓到了项目涉及的领域，B却能接上作者明确展开的共同兴趣、合作基础和相兼身份。</p>\n<p><strong>34题选B。</strong></p>\n"},{"section":"最终答案","raw":"## 最终答案\n\n**31. B**\n\n**32. A**\n\n**33. A**\n\n**34. B**\n\n**35. C**","articleRects":[],"questionRects":[],"scrollTarget":"article","meta":{"kind":"final"},"html":"<h2>最终答案</h2>\n<p><strong>31. B</strong></p>\n<p><strong>32. A</strong></p>\n<p><strong>33. A</strong></p>\n<p><strong>34. B</strong></p>\n<p><strong>35. C</strong></p>\n"}],"articleImage":"data:image/webp;base64,UklGRsLKBQBXRUJQVlA4TLbKBQAvV8Z3As34liTJkiTJtoAp6g0l//+DzSMsqvr6GNH/Cdj/j+lfYPrH/TNxlyJ1F50tpVa9aJsz+/bs8+3X6e5gEiyELFIvqqQfr48qVdfXC5d1LM8qhEVd7l5EaUW10sc/l1TSi3248iHfcdPzXvW4oFCeK0LEC4/f3N/6L7EtUZA0UqmbZ2/07Zo+fq31eVV7Gz6oPEMotYt3T6X0VLoqfVS92W5u397tp/atF8znYnfim7/x6q7ugb696u5S9arbPEsx4oLDeNMPpZ+qlD6+eHvbzj7bbyemp+5jF/lcx5vulCKV9JSSK71x53wuOugYBb0qedZ8G8Sg48Wub69N1VXXtaJ+gVgZi4ISRKkXVyriSuX0+sXY2DDYzf52Xf5YFLVS8SWEN9Xt5ta6r7+q3dftUvWoF1ETubsjpUHJ881LvVSkXmz2dNvtvf1qQShSCZXnol799l0/fuNENKe46HzO8c4FxR8jV65HFXlx9tW2VcfW8/pIn18gGSJR8Pjhi62jOpfqqJLuxK/4fpzFxUJj7E3UHleplLaq60JeVfv6Styj7tS+tPXxjWMnhojjapCkN6EsPXGdPpP0atg2s22MbdqY2eaNKCXfB/lcvenlVVvX8+q6VX+9IWzsoGHrksS6N5/let5dP11SXmy29sNjt2233zcUQZ2PkV39ytbdVXpKRdVVu4teeXiuLeRZt9b5jf+8d7fcjtv1z5jubrtmd/+Q/6rd/QaTkCVDxHF/SG+uq3Vd5R7hr7q2Y+3uhY/jPBOitGDpRc/rqd+/F9ztrbHtzj7a29xBuT4qjvsjSnkzekpXVKqzXzfuckzqfFDebdg2kqSoHvKP9i00ce6eLLaNJCnq44eD1uUf4Ftvni0kSPD/ZUP/Fblt21hJe9vDfQN8Uxy6TZHuoqBtEdwd5BfYikTdg2TwKbDpEsczIpcdqRIjv9/T6qELLBQRvAECDToSAnJ5HYaaMCYq+lSMgFfAOrkkehS9LMc1QaJl+HkYeJ1QwIlv11Zth+fsYfI5Lp1H4B9GKigYUJPDtm0DyYr2n/qStHf/A0TEBMjfTjI4kqokqcoeSMqH7mgu2u/K5k36n3J1ql1dmH1hqSnP6PN9IEl5BmAS89Ne0SNgN9LbHA5Z1tTuPLhMf+W5KlcATscAN1hPKqcLPppTK/dNQhvdaNqhVtUlaO4SL8z+z5/6X9L0mV5muuf06f6f8z/nzOk+s5z5z5yZnp7pWbv79Oxb96w9+77v+77v+77v
